reference: Galatians 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: ml
  text: യെരൂശലേമിലേക്കു, എനിക്കുമുമ്പ് അപ്പൊസ്തലന്മാരായിരുന്നവരുടെ അടുക്കൽ ഞാൻ കയറിപ്പോയതുമില്ല; പകരം, ഞാൻ അറേബ്യയിലേക്കു പോയി, പിന്നെ വീണ്ടും ദമസ്കൊസിലേക്കു മടങ്ങിവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: ഞാൻ ... പോയതുമില്ല
  rationale: മുൻസന്ദർഭത്തിലെ നിഷേധം തുടർന്നുകൊണ്ടുപോകുന്ന οὐδέയുടെ ബന്ധകശക്തി മലയാളത്തിലെ ‘-തുമില്ല’ എന്ന പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀνῆλθον
  choice: കയറിപ്പോയി
  rationale: യെരൂശലേമിലേക്കുള്ള യാത്രയെ പരമ്പരാഗതമായി ‘കയറിപ്പോകുക’ എന്നു പറയുന്ന ഭൂമിശാസ്ത്രപരവും പ്രയോഗപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: ആധുനിക മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: എനിക്കുമുമ്പ് അപ്പൊസ്തലന്മാരായിരുന്നവരുടെ അടുക്കൽ
  rationale: πρὸ ἐμοῦ സൂചിപ്പിക്കുന്ന കാലപരമായ മുൻഗണന വ്യക്തമാക്കുകയും പദവിയിലുള്ള മേന്മ എന്ന ആശയം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു; πρός എന്നതിന്റെ വ്യക്തികളിലേക്കുള്ള ദിശ ‘അടുക്കൽ’ കൊണ്ട് നൽകുന്നു.
- source_word: ἀλλὰ
  choice: പകരം
  rationale: യെരൂശലേമിലേക്കു പോയില്ല എന്നതും അറേബ്യയിലേക്കു പോയി എന്നതും തമ്മിലുള്ള ശക്തമായ പ്രതിസ്ഥാപക വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπῆλθον
  choice: പോയി
  rationale: ἀπέρχομαιയുടെ യാത്രാസന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘പുറപ്പെട്ടുപോയി’ ഇവിടെ അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: Ἀραβίαν
  choice: അറേബ്യ
  rationale: പ്രദേശനാമത്തിന്റെ സാധാരണ മലയാള ലിപ്യന്തരണം; അതിന്റെ ചരിത്രപരമായ അതിരുകൾ വാക്യം നിർവചിക്കുന്നില്ല.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മടങ്ങിവരുന്ന പ്രവൃത്തിയെ ശക്തിപ്പെടുത്തുന്ന ആവർത്തനാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὑπέστρεψα
  choice: മടങ്ങിവന്നു
  rationale: യാത്രാസന്ദർഭത്തിൽ തിരികെ എത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം; ദമസ്കൊസ് മുമ്പത്തെ പുറപ്പെടൽസ്ഥാനമായിരുന്നുവെന്ന സൂചനയും നിലനിൽക്കുന്നു.
- source_word: Δαμασκόν
  choice: ദമസ്കൊസ്
  rationale: ആധുനിക മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ പരിചിതമായ നഗരനാമരൂപം.
theological_decisions:
- issue: ‘എനിക്കുമുമ്പ്’ എന്നത് അപ്പൊസ്തലന്മാരെക്കുറിച്ച് സൂചിപ്പിക്കുന്നത്
  choice: പൗലൊസിനു മുമ്പേ അപ്പൊസ്തലന്മാരായിരുന്നവർ എന്ന കാലപരമായ അർഥം
  alternative: പൗലൊസിനെക്കാൾ പദവിയിൽ ഉന്നതരായവർ
  rationale: πρὸ ἐμοῦ ഏറ്റവും സ്വാഭാവികമായി കാലപരമായ മുൻഗണനയാണ് സൂചിപ്പിക്കുന്നത്. വിവർത്തനം അധികാരക്രമമോ പദവിമേന്മയോ വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ആധുനികവും മാന്യവുമായ മലയാളം. ‘അപ്പൊസ്തലൻ’, ‘യെരൂശലേം’, ‘ദമസ്കൊസ്’ എന്നീ പരിചിത ബൈബിൾ രൂപങ്ങൾ നിലനിർത്തി; വാക്യത്തിന്റെ വൈരുധ്യഘടനയും യാത്രയുടെ ക്രമവും വ്യക്തമായി സൂക്ഷിച്ചു.
