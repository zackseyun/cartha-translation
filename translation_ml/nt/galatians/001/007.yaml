source:
  edition: SBLGNT
  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: ml
  text: അത് മറ്റൊരു സുവിശേഷമല്ല; നിങ്ങളെ കുഴപ്പത്തിലാക്കുകയും മശീഹയുടെ[a] സുവിശേഷത്തെ വളച്ചൊടിക്കാൻ[b] ആഗ്രഹിക്കുകയും ചെയ്യുന്ന ചിലർ ഉണ്ടെന്നതേയുള്ളൂ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ക്രിസ്തുവിന്റെ.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘വികലമാക്കാൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: മറ്റൊരു സുവിശേഷം
  rationale: ἄλλο എന്ന പദത്തോടൊപ്പം നാമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും, 6-ാം വാക്യത്തിലെ εὐαγγέλιον ആണ് ഉദ്ദേശിക്കപ്പെടുന്നത്. അതിനാൽ അർഥവ്യക്തതയ്ക്കായി ‘സുവിശേഷം’ ചേർത്തു.
- source_word: εἰ μή
  choice: എന്നാൽ
  rationale: ഇവിടെ εἰ μή കർശനമായ ഉപാധിയല്ല, മുൻപ്രസ്താവനയെ വിശദീകരിക്കുന്ന ഒരു യോഗ്യതയാണ്. മലയാളത്തിൽ ‘എന്നാൽ’ ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ταράσσοντες
  choice: കുഴപ്പത്തിലാക്കുകയും
  rationale: ταράσσω സൂചിപ്പിക്കുന്ന അസ്വസ്ഥതയും ആശയക്കുഴപ്പവും സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: θέλοντες
  choice: ആഗ്രഹിക്കുകയും ചെയ്യുന്ന
  rationale: അവരുടെ ഉദ്ദേശ്യം പ്രകടമാക്കുന്ന θέλωയുടെ വർത്തമാന കൃദന്തരൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μεταστρέψαι
  choice: വളച്ചൊടിക്കാൻ
  rationale: സുവിശേഷത്തെ അതിന്റെ യഥാർഥ സ്വഭാവത്തിൽനിന്ന് മാറ്റി വികലമാക്കുക എന്ന ശക്തമായ അർഥം ആധുനികവും ഗ്രാഹ്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: εὐαγγέλιον
  choice: സുവിശേഷം
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ മലയാള പദമാണ്.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: ഇവിടെ Χριστός യേശുവിന്റെ മശീഹാപദവിയെ സജീവമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘മശീഹ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
theological_decisions:
- issue: Χριστοῦ എന്നത് പദവിയായോ പേരുപോലുള്ള രൂപമായോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഈ പ്രയോഗം യേശുവിന്റെ മശീഹാപദവിയോടു ബന്ധപ്പെട്ട സുവിശേഷത്തെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത രൂപവും സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ നിഷേധവും തുടർന്ന് വരുന്ന വിശദീകരണാത്മക യോഗ്യതയും അർദ്ധവിരാമത്തിലൂടെ നിലനിർത്തി.
