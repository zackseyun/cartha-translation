id: GAL.1.23
reference: Galatians 1:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: ml
  text: 'അവർ കേട്ടുകൊണ്ടിരുന്നത് ഇത്രമാത്രം: “ഒരിക്കൽ നമ്മെ പീഡിപ്പിച്ചിരുന്നവൻ ഇപ്പോൾ താൻ ഒരിക്കൽ നശിപ്പിക്കാൻ ശ്രമിച്ചിരുന്ന ആ വിശ്വാസം പ്രസംഗിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സുവിശേഷം പ്രസംഗിക്കുന്നു.” ഗ്രീക്കിൽ “വിശ്വാസം”; ഇവിടെ അത് പൗലോസ് മുമ്പ് ആക്രമിച്ച ക്രിസ്തീയ സന്ദേശത്തെയോ വിശ്വാസത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: ഇത്രമാത്രം
  rationale: അവരുടെ അറിവ് ഈ വാർത്തയിൽ മാത്രം ഒതുങ്ങിയിരുന്നുവെന്ന പരിമിതി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀκούοντες ἦσαν
  choice: കേട്ടുകൊണ്ടിരുന്നത്
  rationale: പര്യായരൂപത്തിലുള്ള അപൂർണഭൂതകാലം തുടർച്ചയായോ ആവർത്തിച്ചോ കേൾക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: ഒരിക്കൽ നമ്മെ പീഡിപ്പിച്ചിരുന്ന ആൾ
  rationale: സുബ്സ്റ്റാന്റീവ് വർത്തമാന കൃദന്തരൂപവും ποτέ എന്ന കാലസൂചനയും ചേർന്ന തിരിച്ചറിയൽവാക്യം സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: νῦν εὐαγγελίζεται
  choice: ഇപ്പോൾ സുവിശേഷമായി പ്രസംഗിക്കുന്നു
  rationale: ക്രിയയുടെ സുവിശേഷപ്രഖ്യാപനാർഥം നിലനിർത്തുകയും പിന്നാലെയുള്ള ‘വിശ്വാസം’ അതിന്റെ സന്ദേശവിഷയമാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὴν πίστιν
  choice: വിശ്വാസം
  rationale: നിശ്ചയാർഥക ലേഖനത്തോടുകൂടിയ πίστις ഇവിടെ വ്യക്തിപരമായ വിശ്വസിക്കൽക്കാൾ ക്രിസ്തീയ വിശ്വാസസന്ദേശത്തെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; അടിസ്ഥാന പദരൂപം നിലനിർത്തുന്നു.
- source_word: ἣν ποτε ἐπόρθει
  choice: താൻ ഒരിക്കൽ നശിപ്പിക്കാൻ ശ്രമിച്ച
  rationale: πορθέωയുടെ തകർക്കുക/നശിപ്പിക്കുക എന്ന ശക്തമായ അർഥവും പൗലോസിന്റെ മുൻകാല ശത്രുതാപരമായ പ്രവർത്തനവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: τὴν πίστιν എന്നതിന്റെ അർഥം
  choice: ‘വിശ്വാസം’ എന്നത് പൗലോസ് ഇപ്പോൾ പ്രസംഗിക്കുന്ന ക്രിസ്തീയ വിശ്വാസസന്ദേശത്തെ സൂചിപ്പിക്കുന്നു
  alternative: വ്യക്തിയുടെ വിശ്വസിക്കൽ എന്ന പ്രവൃത്തി; അല്ലെങ്കിൽ സന്ദർഭാനുസൃതമായി നേരിട്ട് ‘സുവിശേഷം’
  rationale: മുമ്പ് പീഡിപ്പിച്ചതും ഇപ്പോൾ പ്രസംഗിക്കുന്നതുമായ ഒന്നായി ‘വിശ്വാസം’ ചിത്രീകരിക്കപ്പെടുന്നതിനാൽ ഇവിടെ വസ്തുനിഷ്ഠമായ സന്ദേശാർഥമാണ് കൂടുതൽ യോജിച്ചത്. എങ്കിലും മൂലപദത്തിന്റെ രൂപം പ്രധാനവാചകത്തിൽ നിലനിർത്തി സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള ഉദ്ധരണിയുടെ റിപ്പോർട്ട് സ്വഭാവവും മൂലവാക്യത്തിലെ കാലവൈരുധ്യവും—‘ഒരിക്കൽ’/‘ഇപ്പോൾ’—വ്യക്തമായി നിലനിർത്തി.
