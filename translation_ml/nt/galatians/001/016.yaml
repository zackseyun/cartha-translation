id: GAL.1.16
reference: Galatians 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: ml
  text: തന്റെ പുത്രനെ എന്നിൽ[a] വെളിപ്പെടുത്തി, ഞാൻ അവനെ ജനതകളുടെ ഇടയിൽ സുവിശേഷം ഘോഷിക്കേണ്ടതിന് ദൈവം പ്രസാദിച്ചപ്പോൾ, ഞാൻ ഉടനെ മാംസത്തോടും രക്തത്തോടും[b] കൂടിയാലോചിച്ചില്ല,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എനിക്ക്” അല്ലെങ്കിൽ “എന്നിലൂടെ.”
    reason: alternative_reading
  - marker: b
    text: “മാംസവും രക്തവും” എന്നത് ഒരു മനുഷ്യനെയോ മനുഷ്യരെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: വെളിപ്പെടുത്താൻ
  rationale: ദൈവിക വെളിപ്പെടുത്തൽ എന്ന ആശയം സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: തന്റെ പുത്രനെ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമബന്ധവും പുത്രൻ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν ἐμοὶ
  choice: എന്നിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തി, ആന്തരിക വെളിപ്പെടുത്തൽ, പൗലോസിനുള്ള വെളിപ്പെടുത്തൽ, പൗലോസിലൂടെ ഉണ്ടായ വെളിപ്പെടുത്തൽ എന്നീ സാധ്യതകൾക്കിടയിലെ യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: അങ്ങനെ ഞാൻ ... അവനെ സുവിശേഷമായി പ്രസംഗിക്കാൻ
  rationale: εὐαγγελίζωμαι എന്നതിലെ സുവിശേഷപ്രഘോഷണഭാവവും αὐτόν എന്ന നേരിട്ടുള്ള കർമത്തിന്റെ ശ്രദ്ധേയമായ വ്യക്തികേന്ദ്രിതത്വവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: ജനതകളുടെ ഇടയിൽ
  rationale: ἔθνη എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘ജനതകൾ’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് യഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: കാലസൂചന ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐ προσανεθέμην
  choice: ആലോചന ചോദിച്ചില്ല
  rationale: മറ്റുള്ളവരുമായി കൂടിയാലോചിക്കുക അഥവാ ഉപദേശം തേടുക എന്ന മധ്യമപ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: σαρκὶ καὶ αἵματι
  choice: മാംസരക്തങ്ങളോട്
  rationale: പൗലോസിന്റെ സജീവമായ ശൈലി നിലനിർത്തുന്ന ശാബ്ദിക പ്രയോഗമാണിത്; മനുഷ്യരെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പുത്രന്റെ വെളിപ്പെടുത്തലുമായി ബന്ധപ്പെട്ട ἐν ἐμοὶ എന്നതിന്റെ അർഥം
  choice: പ്രധാന പാഠത്തിൽ ശാബ്ദികവും അവ്യക്തവുമായ ‘എന്നിൽ’ നിലനിർത്തുക
  alternative: ‘എനിക്ക്’ അല്ലെങ്കിൽ ‘എന്നിലൂടെ’
  rationale: ആന്തരിക വെളിപ്പെടുത്തൽ, പൗലോസിനുള്ള വെളിപ്പെടുത്തൽ, പൗലോസിലൂടെ ഉണ്ടായ വെളിപ്പെടുത്തൽ എന്നിവയിൽ ഒന്നായി വാചകത്തെ പരിമിതപ്പെടുത്താതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്നതിനാൽ ദൈവം പ്രസാദിച്ചപ്പോൾ എന്ന ബന്ധഭാഗം വ്യക്തതയ്ക്കായി ഉൾപ്പെടുത്തി. ‘ജനതകൾ’ മൂലപദത്തിന്റെ രൂപം നിലനിർത്തുന്നു; സന്ദർഭാർഥം യഹൂദരല്ലാത്തവർ എന്നാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
