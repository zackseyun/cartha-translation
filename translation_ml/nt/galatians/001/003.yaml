source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸂καὶ κυρίου ἡμῶν⸃ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: ml
  text: പിതാവായ ദൈവത്തിൽനിന്നും നമ്മുടെ കർത്താവായ യേശു മശീഹയിൽനിന്നും നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യേശു ക്രിസ്തു.”'
    reason: Χριστός എന്ന ഗ്രീക്കുപദത്തിന്റെ പരമ്പരാഗത മലയാളരൂപം.
  - marker: b
    text: ‘നമ്മുടെ കർത്താവായ’ എന്നു വിവർത്തനം ചെയ്ത ഗ്രീക്ക് പദങ്ങൾ ഈ വിമർശനപാഠത്തിൽ പാഠപരമായി അനിശ്ചിതമായി അടയാളപ്പെടുത്തിയിരിക്കുന്നു.
    reason: SBLGNT-യിലെ ⸂καὶ κυρίου ἡμῶν⸃ എന്ന ബ്രാക്കറ്റിട്ട വായനയുടെ പാഠപരമായ അനിശ്ചിതത്വം, സ്ഥിരീകരിക്കാത്ത കൈയെഴുത്തുപ്രതി-വായന നിർമിക്കാതെ, അറിയിക്കുന്നു.
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ ലേഖനാഭിവാദ്യത്തിലെ അനുഗ്രഹവും ദൈവാനുകൂല്യവും ഒരുപോലെ നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പദം.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ദാതൃവിഭക്തിയുടെ സ്വാഭാവിക മലയാളരൂപം; ആശംസ സ്വീകരിക്കുന്നവരെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: യഹൂദ അഭിവാദ്യപശ്ചാത്തലവും ദൈവം നൽകുന്ന സമഗ്രക്ഷേമമെന്ന ദൈവശാസ്ത്രപരമായ ആഴവും സംരക്ഷിക്കുന്ന സ്ഥാപിത പരിഭാഷ.
- source_word: ἀπό
  choice: —യിൽനിന്നും
  rationale: കൃപയുടെയും സമാധാനത്തിന്റെയും ഉറവിടം സൂചിപ്പിക്കുന്നു; രണ്ട് ഉറവിടപദങ്ങളോടും ആവർത്തിച്ചത് മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: θεοῦ πατρός
  choice: പിതാവായ ദൈവം
  rationale: ഗ്രീക്കിലെ ‘ദൈവം, പിതാവ്’ എന്ന സംയുക്ത വിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; നൽകിയിരിക്കുന്ന പദക്രമത്തിൽ ἡμῶν നേരിട്ട് κυρίου-യോടാണ് ചേരുന്നത്.
- source_word: κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവ്
  rationale: κυρίου എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിക്ക് ‘കർത്താവ്’ എന്ന സ്ഥാപിത തുല്യം ഉപയോഗിക്കുകയും ἡμῶν അതിനോടു ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός ഇവിടെ പദവിയുടെ ശക്തി വഹിക്കുന്നതിനാൽ അതിന്റെ അർഥം വിവർത്തനം ചെയ്യുന്ന ‘മശീഹ’ സ്വീകരിച്ചു; പരമ്പരാഗത ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: implicit blessing formula
  choice: ഉണ്ടാകട്ടെ
  rationale: ഗ്രീക്കിൽ ക്രിയ ഇല്ലെങ്കിലും കൃപയും സമാധാനവും പ്രാപിക്കണമെന്ന ആശംസ മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമാക്കുന്ന പൂരകം.
theological_decisions:
- issue: Χριστοῦ എന്നത് അർഥം വിവർത്തനം ചെയ്ത പദവിയായോ പരമ്പരാഗത നാമസദൃശ രൂപമായോ നൽകണമോ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ അഭിവാദ്യത്തിൽ Χριστός ക്രിസ്തുശാസ്ത്രപരമായ പദവിയുടെ അർഥം ഇപ്പോഴും വഹിക്കുന്നു; എന്നാൽ വായനക്കാർക്ക് പരിചിതമായ പരമ്പരാഗത രൂപം യഥാർഥമായൊരു പരിഭാഷാവികല്പമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകി.
- issue: ἡμῶν ഏതു നാമത്തോടു ചേർക്കണം
  choice: നമ്മുടെ കർത്താവ്
  alternative: നമ്മുടെ പിതാവായ ദൈവം
  rationale: നൽകിയ SBLGNT പാഠത്തിലെ പദക്രമം κυρίου ἡμῶν എന്നാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘നമ്മുടെ’ കർത്താവിനോടു ചേർത്തു. ‘നമ്മുടെ’ പിതാവിനോടു ചേരുന്ന പ്രധാന പാഠപരമ്പര അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് പാഠഭേദം മറച്ചുവച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ അനുഗ്രഹാശംസാരൂപം. ഉറവിടബന്ധം വ്യക്തമാക്കാൻ ‘—യിൽനിന്നും’ ആവർത്തിച്ചു. മലയാളത്തിൽ ക്രിയരഹിതമായ വാചകം അസ്വാഭാവികമാകുന്നതിനാൽ സൂചിത ആശംസ ‘ഉണ്ടാകട്ടെ’ എന്നു വെളിപ്പെടുത്തി. ‘മശീഹ’ പദവിയായി ഉപയോഗിച്ചെങ്കിലും പരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകി.
