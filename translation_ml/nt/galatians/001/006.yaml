source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: ml
  text: മിശിഹായുടെ[b] കൃപയിൽ[a] നിങ്ങളെ വിളിച്ചവനിൽനിന്ന് നിങ്ങൾ ഇത്ര പെട്ടെന്ന് വ്യത്യസ്തമായ ഒരു സുവിശേഷത്തിലേക്കു[c] തിരിഞ്ഞുകൊണ്ടിരിക്കുന്നതിൽ ഞാൻ അതിശയിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മിശിഹായുടെ കൃപയാൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ഉപസർഗം മേഖലയെയോ ഉപാധിയെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ “ക്രിസ്തു”; ഇവിടെ ഈ പദം സ്ഥാനപ്പേരായി വരുന്നതിനാൽ “മിശിഹാ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “മറ്റൊരു സുവിശേഷത്തിലേക്കു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: ഞാൻ അതിശയിക്കുന്നു
  rationale: പൗലോസിന്റെ ഞെട്ടലും നിരാശയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὕτως ταχέως
  choice: ഇത്ര വേഗം
  rationale: മാറ്റത്തിന്റെ അമ്പരപ്പിക്കുന്ന വേഗത്തിന് ഗ്രീക്കിലുള്ള ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: μετατίθεσθε
  choice: ഉപേക്ഷിച്ച് … തിരിയുന്നതിൽ
  rationale: വെറും ആശയമാറ്റമല്ല, വിളിച്ച വ്യക്തിയിൽനിന്നുള്ള അകൽച്ചയും മറ്റൊന്നിലേക്കുള്ള നീക്കവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: നിങ്ങളെ വിളിച്ചവനെ
  rationale: വിളിച്ചവൻ ആരെന്നത് മൂലപാഠം ഇവിടെ വ്യക്തമാക്കാത്തതിനാൽ അതേ സംയമനം പാലിക്കുന്നു.
- source_word: ἐν χάριτι Χριστοῦ
  choice: മിശിഹായുടെ കൃപയിൽ
  rationale: ἐν എന്നതിന്റെ മേഖലയെ സൂചിപ്പിക്കുന്ന അർഥം പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു; ഉപാധി എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Χριστοῦ
  choice: മിശിഹായുടെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: വ്യത്യസ്തമായ ഒരു സുവിശേഷത്തിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ദിശയും ἕτερον സൂചിപ്പിക്കുന്ന ഗുണപരമായ വ്യത്യാസവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളെ വിളിച്ചവൻ’ ആരാണ്?
  choice: പ്രധാനവാചകത്തിൽ വ്യക്തിയെ വ്യക്തമാക്കാതെ ‘വിളിച്ചവൻ’ എന്നു നിലനിർത്തി.
  alternative: ‘നിങ്ങളെ വിളിച്ച ദൈവം’ അല്ലെങ്കിൽ ‘നിങ്ങളെ വിളിച്ച മിശിഹാ’
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ കർത്താവ് പരോക്ഷമാണ്; വ്യാഖ്യാനപരമായ ഒരു തിരിച്ചറിയൽ വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: ἐν χάριτι എന്നതിലെ ἐν-ന്റെ അർഥം
  choice: ‘കൃപയിൽ’
  alternative: ‘കൃപയാൽ’
  rationale: ഇത് മേഖലയെയോ ഉപാധിയെയോ സൂചിപ്പിക്കാം; പ്രധാനവാചകം ആദ്യ സാധ്യത സ്വീകരിക്കുകയും മറ്റേത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉപേക്ഷിച്ച് … തിരിയുക’ എന്ന ഘടന ബന്ധപരമായ ദ്രോഹവും മറ്റൊരു സന്ദേശത്തിലേക്കുള്ള നീക്കവും വ്യക്തമായി കൈമാറുന്നു; എല്ലാ വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വങ്ങളും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിരിക്കുന്നു.
