  text: to whom be the glory forever and ever. Amen.
translation:
  language: ml
  text: അവിടുത്തേക്ക് എന്നെന്നേക്കും മഹത്ത്വം ഉണ്ടാകട്ടെ. ആമേൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: അവിടത്തേക്ക്
  rationale: മുൻവാക്യത്തിലെ ‘നമ്മുടെ ദൈവവും പിതാവുമായവൻ’ എന്ന പരാമർശത്തിലേക്കാണ് ബന്ധസർവനാമം വിരൽചൂണ്ടുന്നത്. ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കാനും സ്തുതിവാക്യത്തിലെ ദാതൃവിഭക്തിയുടെ അർഥം നിലനിർത്താനും ‘അവിടത്തേക്ക്’ സ്വീകരിച്ചു.
- source_word: ἡ δόξα
  choice: മഹത്ത്വം
  rationale: ദൈവിക തേജസ്സും ബഹുമാനവും ഉൾക്കൊള്ളുന്ന സ്തുതിസന്ദർഭത്തിലെ പതിവും ഗൗരവമുള്ളതുമായ മലയാളപദമാണ് ‘മഹത്ത്വം’.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും ശക്തവുമായ ആധുനിക മലയാളരൂപമാണ് ‘എന്നെന്നേക്കും’.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: സ്തുതിവാക്യം സമാപിപ്പിക്കുന്ന ഉറച്ച സമ്മതപ്രകടനമായി മലയാള ബൈബിൾ-ആരാധനാ പ്രയോഗത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണമാണ് ‘ആമേൻ’.
theological_decisions:
- issue: ക്രിയയില്ലാത്ത സ്തുതിവാക്യത്തിന്റെ സൂചിത ക്രിയാർഥം
  choice: മഹത്ത്വം ഉണ്ടാകട്ടെ
  alternative: മഹത്ത്വം അവിടത്തേതാണ്
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ക്രിയ ഇല്ല. ‘ഉണ്ടാകട്ടെ’ എന്നത് സ്തുതിയും പ്രാർഥനാത്മകമായ ആശംസയും നിറഞ്ഞ പരമ്പരാഗത അർഥശക്തി നിലനിർത്തുന്നു; അതേസമയം ഉടമസ്ഥത എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് വാക്യത്തെ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലത്തിലെ സംക്ഷിപ്ത സ്തുതിവാക്യരൂപം സംരക്ഷിച്ചു.
