source:
  edition: SBLGNT
  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: ml
  text: 'എന്തെന്നാൽ, സഹോദരങ്ങളേ,[a] ഞാൻ നിങ്ങളെ അറിയിക്കുന്നു: ഞാൻ പ്രസംഗിച്ച സുവിശേഷം മനുഷ്യനിൽനിന്നുള്ളതല്ല.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരങ്ങളേ’ എന്ന ഗ്രീക്ക് അഭിസംബോധന ഇവിടെ വിശ്വാസസമൂഹത്തിലെ സഹോദരിമാരെയും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: b
    text: പദാനുപദമായി ‘മനുഷ്യനെ അനുസരിച്ചുള്ളതല്ല’; ഈ പ്രയോഗത്തിന് ‘മനുഷ്യരുടെ മാനദണ്ഡങ്ങൾക്കനുസരിച്ചുള്ളതല്ല’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: ഞാൻ നിങ്ങളെ അറിയിക്കുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അറിയിക്കുക’ നിലനിർത്തുന്നതോടൊപ്പം, പൗലോസ് ഒരു പ്രധാന വിശദീകരണം അവതരിപ്പിക്കുന്നതും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ പ്രസ്താവനയ്ക്ക് കാരണമോ വിശദീകരണമോ നൽകുന്ന ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന അഭിസംബോധനയെ അടുത്ത് പിന്തുടരുന്നു; പൗലോസിന്റെ പ്രയോഗത്തിൽ വിശ്വാസസമൂഹം മുഴുവനും ഉൾപ്പെടാവുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὐαγγέλιον
  choice: സുവിശേഷം
  rationale: പൗലോസിന്റെ സാങ്കേതികവും ദൈവശാസ്ത്രപരവുമായ പ്രയോഗത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും സംക്ഷിപ്തവുമായ പദം.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: ഞാൻ പ്രസംഗിച്ച
  rationale: പൗലോസ് പരസ്യമായി സുവിശേഷം പ്രഖ്യാപിച്ചതിനെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: οὐκ ἔστιν κατὰ ἄνθρωπον
  choice: മനുഷ്യനിൽനിന്നുള്ളതല്ല
  rationale: അടുത്ത വാക്യത്തിൽ മനുഷ്യനിൽനിന്ന് സ്വീകരിച്ചതോ പഠിച്ചതോ അല്ലെന്ന വിശദീകരണം വരുന്നതിനാൽ, ഇവിടെ ഉത്ഭവസ്രോതസ്സിനെ സൂചിപ്പിക്കുന്ന അർഥം സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നു; പദാനുപദ രൂപവും മാനദണ്ഡത്തെ സൂചിപ്പിക്കാവുന്ന അർഥവും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: κατὰ ἄνθρωπον എന്ന പ്രയോഗം മനുഷ്യസ്രോതസ്സിനെയോ മനുഷ്യരുടെ മാനദണ്ഡങ്ങളെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: മനുഷ്യനിൽനിന്നുള്ളതല്ല
  alternative: മനുഷ്യന്റെ മാനദണ്ഡങ്ങൾക്കനുസരിച്ചുള്ളതല്ല; പദാനുപദമായി ‘മനുഷ്യനെ അനുസരിച്ചുള്ളതല്ല’
  rationale: ഗലാത്യർ 1:12-ൽ പൗലോസ് ഈ സുവിശേഷം ഒരു മനുഷ്യനിൽനിന്നും സ്വീകരിക്കുകയോ പഠിക്കുകയോ ചെയ്തിട്ടില്ലെന്ന് പറയുന്നതിനാൽ സ്രോതസ്സിനെ സൂചിപ്പിക്കുന്ന വായന സന്ദർഭത്തിൽ ശക്തമാണ്. എന്നിരുന്നാലും ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ അഭിസംബോധനയും വാക്യഘടനയും ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യത്തിന്റെ വിശദീകരണാത്മക ബന്ധം ‘എന്തെന്നാൽ’ മുഖേനയും, ഉത്ഭവസ്രോതസ്സിനെക്കുറിച്ചുള്ള പ്രധാന വായന മുഖ്യപാഠത്തിലും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
