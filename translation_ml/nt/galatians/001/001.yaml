id: GAL.1.1
reference: Galatians 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: ml
  text: മനുഷ്യരിൽനിന്നോ ഒരു മനുഷ്യൻ മുഖാന്തരമോ അല്ല, മശീഹയായ യേശു[a] മുഖാന്തരവും അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച പിതാവായ ദൈവം മുഖാന്തരവും അപ്പോസ്തലനായ പൗലോസ്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശുക്രിസ്തു മുഖാന്തരം.’
    reason: Χριστός എന്ന ഗ്രീക്കുപദം സ്ഥാനപ്പേരായി ‘മശീഹ’ എന്നും പരമ്പരാഗത നാമരൂപത്തിൽ ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: ἀπόστολος
  choice: അപ്പോസ്തലൻ
  rationale: പൗലോസിന്റെ ദൈവിക നിയോഗത്തെയും അധികാരമുള്ള ശുശ്രൂഷാപദവിയെയും സൂചിപ്പിക്കുന്ന അംഗീകൃത പദമായതിനാൽ പൊതുവായ ‘ദൂതൻ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ഭാരം നിലനിർത്തുന്നു.
- source_word: ἀπ’ ἀνθρώπων
  choice: മനുഷ്യരിൽനിന്ന്
  rationale: ἀπό + genitive നിയോഗത്തിന്റെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ഏകവചനമായ ‘ഒരു മനുഷ്യൻ’ എന്ന പ്രയോഗത്തോടുള്ള വാഗ്‌വൈരുധ്യം നിലനിർത്താൻ ബഹുവചനം സംരക്ഷിച്ചു.
- source_word: δι’ ἀνθρώπου
  choice: ഒരു മനുഷ്യൻ മുഖാന്തരം
  rationale: διά + genitive ഇടനിലക്കാരനെയോ പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ അനിശ്ചിത ഏകവചനവും മുമ്പുള്ള ബഹുവചനത്തോടുള്ള വ്യത്യാസവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശു മുഖാന്തരം
  rationale: ആവർത്തിക്കുന്ന διά യഥാർഥ ദൈവിക പ്രവർത്തകത്വത്തെ മനുഷ്യ ഉറവിടത്തിനും ഇടനിലയ്ക്കും എതിരായി നിർത്തുന്നു; Χριστός ഇവിടെ സ്ഥാനപ്പേരിന്റെ അർഥം വഹിക്കുന്നതിനാൽ ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: θεοῦ πατρὸς
  choice: പിതാവായ ദൈവം
  rationale: ഗ്രീക്കിലെ സംയുക്ത ദൈവിക വിശേഷണം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച
  rationale: കർത്തൃവാചക വിശേഷണപ്രയോഗം ‘പിതാവായ ദൈവം’ എന്നതിനെ വിശേഷിപ്പിക്കുന്നു; ἐκ νεκρῶν എന്നതിന്റെ ബഹുവചനസ്വഭാവവും പുനരുത്ഥാനവാദവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστοῦ-യുടെ പരിഭാഷ
  choice: മശീഹയായ യേശു
  alternative: യേശുക്രിസ്തു
  rationale: ഈ അഭിവാദനത്തിൽ Χριστός വെറും പേരിന്റെ ഭാഗമെന്നതിലുപരി അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരിന്റെ ശക്തി നിലനിർത്തുന്നതിനാൽ ‘മശീഹ’ സ്വീകരിച്ചു; മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിനായി ‘മശീഹയായ യേശു’ എന്നു നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ബഹുവചനം/ഏകവചനം (‘മനുഷ്യരിൽനിന്ന് / ഒരു മനുഷ്യൻ മുഖാന്തരം’), ആവർത്തിക്കുന്ന διά, തുടർവാക്യത്തിലേക്കു നീളുന്ന അഭിവാദനഘടന എന്നിവ നിലനിർത്തി.
