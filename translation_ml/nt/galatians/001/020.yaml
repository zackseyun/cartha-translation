base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/020.yaml
  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: ml
  text: ഞാൻ നിങ്ങൾക്കു എഴുതുന്ന കാര്യങ്ങളിൽ—ഇതാ, ദൈവസന്നിധിയിൽ[a]—ഞാൻ കള്ളം പറയുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവത്തിന്റെ മുമ്പാകെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δὲ γράφω ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്ക് എഴുതുന്ന കാര്യങ്ങളെക്കുറിച്ച്
  rationale: ἃ എന്ന നപുംസക ബഹുവചന ബന്ധസർവനാമത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘കാര്യങ്ങൾ’ എന്നു പ്രതിനിധീകരിക്കുന്നു; δέ ഇവിടെ നേരിയ സംവാദമാറ്റം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം പദമായി നിർബന്ധിച്ച് ചേർത്തിട്ടില്ല; γράφωയുടെ വർത്തമാനകാലവും ὑμῖν എന്ന സ്വീകർത്തൃ ദത്തിവും നിലനിർത്തുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള പ്രസ്താവനയ്ക്ക് ഗൗരവമേകുകയും ചെയ്യുന്ന ഊന്നൽപദത്തെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യത്തിലും അവിടുത്തെ മുമ്പാകെയുള്ള ഉത്തരവാദിത്വത്തിലും പറയുന്ന ഗൗരവമേറിയ ഉറപ്പിന്റെ ഭാവം സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: ὅτι οὐ ψεύδομαι
  choice: ഞാൻ കള്ളം പറയുന്നില്ല
  rationale: ὅτι അവതരിപ്പിക്കുന്ന ഉറപ്പിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ പ്രത്യേക ബന്ധപദമില്ലാതെയും സ്വാഭാവികമായി പ്രകടമാകുന്നു; വർത്തമാനകാല നിഷേധം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസ് ദൈവത്തെ സാക്ഷിയാക്കി പറയുന്നതിന്റെ ശക്തി
  choice: ‘ദൈവസന്നിധിയിൽ ഞാൻ കള്ളം പറയുന്നില്ല’ എന്ന ഗൗരവമേറിയ ദൈവസാക്ഷ്യ ഉറപ്പായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഔപചാരിക സത്യപ്രതിജ്ഞയായി വികസിപ്പിക്കുക, അല്ലെങ്കിൽ വെറും ഊന്നലായി മൃദൂകരിക്കുക.
  rationale: ἐνώπιον τοῦ θεοῦ ദൈവത്തിന്റെ മുമ്പാകെയുള്ള ഉത്തരവാദിത്വം പ്രകടമാക്കുന്നു; എന്നാൽ ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ഒരു ഔപചാരിക സത്യപ്രതിജ്ഞാ സൂത്രവാക്യം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’ ἰδούയുടെ ഊന്നൽ നിലനിർത്തുന്നു; ‘ദൈവസന്നിധിയിൽ’ എന്നത് സഭാവിഭാഗസവിശേഷമായ വ്യാഖ്യാനം ചേർക്കാതെ പ്രസ്താവനയുടെ ഗൗരവം സംരക്ഷിക്കുന്നു.
