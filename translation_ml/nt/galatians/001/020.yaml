revisions:
- from: ഞാൻ നിങ്ങൾക്ക് എഴുതുന്ന കാര്യങ്ങളെക്കുറിച്ച്—ഇതാ, ദൈവസന്നിധിയിൽ ഞാൻ കള്ളം പറയുന്നില്ല.[a]
  to: ഞാൻ നിങ്ങൾക്കു എഴുതുന്ന കാര്യങ്ങളിൽ—ഇതാ, ദൈവസന്നിധിയിൽ[a]—ഞാൻ കള്ളം പറയുന്നില്ല.
  rationale: The revision clarifies that the matters are what Paul is writing, rather than topics about which he writes. It retains the direct emphatic particle (“ഇതാ”), the solemn appeal before God, and the present-tense denial of lying. The footnote is anchored directly to the phrase for which it supplies a lexical alternative.
