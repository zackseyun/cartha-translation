lexical_decisions:
- source_word: ἔπειτα
  choice: പിന്നീട്
  rationale: പൗലോസിന്റെ വിവരണത്തിലെ കാലക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἦλθον
  choice: ഞാൻ പോയി
  rationale: രൂപപരമായി ‘ഞാൻ വന്നു’ എന്നാകാമെങ്കിലും, മുൻ സ്ഥലത്തുനിന്നുള്ള യാത്രയെ വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ ‘ഞാൻ പോയി’ എന്നതാണ് സ്വാഭാവികം.
- source_word: εἰς
  choice: -ലേക്കു
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ ബലം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κλίματα
  choice: പ്രദേശങ്ങൾ
  rationale: ഒരൊറ്റ നഗരത്തെയല്ല, ഭൂമിശാസ്ത്രപരമായ മേഖലകളെയോ ജില്ലകളെയോ സൂചിപ്പിക്കുന്നു; ‘പ്രദേശങ്ങൾ’ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാണ്.
- source_word: Συρίας
  choice: സിറിയ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: Κιλικίας
  choice: കിലിക്യ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
