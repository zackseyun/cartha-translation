  register: ആധുനികവും മാന്യവും ലളിതവുമായ മലയാളം. ഗ്രീക്ക് ബഹുവചനമായ κλίματα ‘പ്രദേശങ്ങൾ’ എന്നു നിലനിർത്തി. εἰς എന്നതിന്റെ ദിശാബോധം ‘-ലേക്കു’ വഴി പ്രകടമാക്കി; സ്ഥലനാമങ്ങളോടുള്ള ജനിറ്റീവ് ഘടന സ്വാഭാവിക മലയാളത്തിൽ ‘സിറിയയുടെയും കിലിക്യയുടെയും’ എന്നു നൽകി.
