id: GAL.1.9
reference: Galatians 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: ml
  text: 'ഞങ്ങൾ മുമ്പേ പറഞ്ഞിട്ടുള്ളതുപോലെ, ഇപ്പോൾ വീണ്ടും ഞാൻ പറയുന്നു: നിങ്ങൾ സ്വീകരിച്ചതിനു വിരുദ്ധമായ[a] ഒരു സുവിശേഷം ആരെങ്കിലും നിങ്ങളോടു പ്രസംഗിക്കുന്നുവെങ്കിൽ, അയാൾ ശപിക്കപ്പെട്ടവനായിരിക്കട്ടെ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിങ്ങൾ സ്വീകരിച്ചതിൽനിന്നു വ്യത്യസ്തമായ” അല്ലെങ്കിൽ “അതിന് അപ്പുറമുള്ള”; ഈ പ്രയോഗം സ്വീകരിച്ച സന്ദേശത്തിൽനിന്നുള്ള വ്യതിചലനത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ “അയാൾ ശാപത്തിൻ കീഴിലായിരിക്കട്ടെ”; ഗ്രീക്ക്: അനാഥെമ എസ്റ്റോ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: ഞങ്ങൾ മുമ്പേ പറഞ്ഞിട്ടുള്ളതുപോലെ
  rationale: മുമ്പ് പറഞ്ഞ കാര്യം ഇപ്പോഴും പ്രസക്തമാണെന്ന ക്രിയാരൂപത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ബഹുവചനം സംരക്ഷിക്കുന്നു.
- source_word: ἄρτι πάλιν λέγω
  choice: ഇപ്പോൾ വീണ്ടും ഞാൻ പറയുന്നു
  rationale: ἄρτι എന്നതിലെ ഇപ്പോഴത്തെ സമയസൂചനയും πάλιν എന്നതിലെ ആവർത്തനവും നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ഏകവചനമായ ‘ഞാൻ’ വ്യക്തമായി നൽകുന്നു.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: ഒരു സുവിശേഷം ആരെങ്കിലും നിങ്ങളോടു പ്രസംഗിക്കുന്നുവെങ്കിൽ
  rationale: εὐαγγελίζομαι എന്ന ക്രിയയുടെ സുവിശേഷപ്രഘോഷണഭാവവും സോപാധിക വാക്യഘടനയും സ്വാഭാവികമായി പകരുന്നു.
- source_word: παρ’ ὃ
  choice: നിങ്ങൾ സ്വീകരിച്ചതിനു വിരുദ്ധമായ
  rationale: παρά ഇവിടെ അവർ സ്വീകരിച്ച സന്ദേശത്തിൽനിന്നുള്ള വ്യതിചലനം സൂചിപ്പിക്കുന്നു. ‘വിരുദ്ധമായ’ സന്ദർഭത്തിലെ ശക്തമായ വൈരുധ്യഭാവം പകരുന്നു; സാധ്യതയുള്ള വിശാല അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παρελάβετε
  choice: നിങ്ങൾ സ്വീകരിച്ചത്
  rationale: പരമ്പരയായി കൈമാറപ്പെട്ട സന്ദേശം സ്വീകരിക്കുക എന്ന παραλαμβάνωയുടെ സന്ദർഭോചിത അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: ἀνάθεμα ἔστω
  choice: അയാൾ ശപിക്കപ്പെട്ടവനായിരിക്കട്ടെ
  rationale: ἀνάθεμα എന്നതിലെ ഗൗരവമേറിയ ശാപവിധി നിലനിർത്തുന്നു; ‘ദൈവത്തിന്റെ’ എന്നു മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തത് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἀνάθεμα ἔστω എന്ന വിധിവാക്യത്തിന്റെ ശക്തിയും ശാപത്തിന്റെ കർത്താവും
  choice: അയാൾ ശപിക്കപ്പെട്ടവനായിരിക്കട്ടെ
  alternative: അയാൾ ശാപത്തിൻ കീഴിലായിരിക്കട്ടെ
  rationale: പൗലോസിന്റെ കടുത്ത അപലപനം മൃദൂകരിക്കാതെ പകരുന്നു; എന്നാൽ ശാപത്തെ ‘ദൈവത്തിന്റെ ശാപം’ എന്നു വിശദീകരിച്ച് മൂലപാഠത്തിന് അതീതമായ ദൈവശാസ്ത്രനിർണ്ണയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഞങ്ങൾ’ എന്നതിൽനിന്ന് ‘ഞാൻ’ എന്നതിലേക്കുള്ള മൂലപാഠത്തിലെ മാറ്റം സംരക്ഷിച്ചിട്ടുണ്ട്. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടു ചേർത്തിരിക്കുന്നു.
