  to: കാരണം, ഇപ്പോൾ ഞാൻ മനുഷ്യരെയാണോ ദൈവത്തെയാണോ സമ്മതിപ്പിക്കാൻ ശ്രമിക്കുന്നത്?[a] അതോ മനുഷ്യരെ പ്രസാദിപ്പിക്കാനാണോ ഞാൻ ശ്രമിക്കുന്നത്? ഞാൻ ഇപ്പോഴും മനുഷ്യരെ പ്രസാദിപ്പിച്ചുകൊണ്ടിരുന്നെങ്കിൽ, ഞാൻ മശീഹയുടെ അടിമയായിരിക്കുമായിരുന്നില്ല.[b]
