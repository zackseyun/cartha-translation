  source_fidelity: The draft correctly renders δοξάζω with ‘മഹത്ത്വപ്പെടുത്തുക’ and preserves the imperfect’s durative force with ‘-ക്കൊണ്ടിരുന്നു.’ It appropriately takes ἐν ἐμοὶ in its contextual causal/associative sense and retains the literal alternative in a footnote.
