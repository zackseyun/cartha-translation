id: GAL.1.4
reference: Galatians 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: ml
  text: നമ്മുടെ പാപങ്ങൾക്കുവേണ്ടി തന്നെത്തന്നെ നൽകിയവൻ, ഇപ്പോഴത്തെ ദുഷ്ട യുഗത്തിൽനിന്ന് നമ്മെ വിടുവിക്കേണ്ടതിന്, നമ്മുടെ ദൈവവും പിതാവുമായവന്റെ ഇഷ്ടപ്രകാരം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόντος ἑαυτόν
  choice: തന്നെത്തന്നെ നൽകിയവൻ
  rationale: ‘നൽകുക’ എന്നത് δίδωμι എന്ന പദത്തിന്റെ നേരായ അർഥവും സ്വമേധയാ സ്വയം അർപ്പിച്ച ഭാവവും നിലനിർത്തുന്നു.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: നമ്മുടെ പാപങ്ങൾക്കുവേണ്ടി
  rationale: പാപപരിഹാരത്തിന്റെ ഏതെങ്കിലും പ്രത്യേക സിദ്ധാന്തം കൂട്ടിച്ചേർക്കാതെ ὑπέρ എന്നതിന്റെ പ്രതിനിധാനപരവും വീണ്ടെടുപ്പുസംബന്ധവുമായ വ്യാപ്തി സൂക്ഷിക്കുന്നു.
- source_word: ἐξέληται
  choice: വിടുവിക്കേണ്ടതിന്
  rationale: അപകടകരമോ അധീനപ്പെടുത്തുന്നതോ ആയ അവസ്ഥയിൽനിന്ന് പുറത്തുകൊണ്ടുവരുക എന്ന ἐξαιρέωയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: ഇപ്പോഴത്തെ ദുഷ്ടയുഗത്തിൽനിന്ന്
  rationale: αἰών പ്രാഥമികമായി ഭൗതിക ലോകത്തെയല്ല, ഒരു യുഗത്തെയോ കാലക്രമത്തെയോ സൂചിപ്പിക്കുന്നു; ἐνεστῶτος അതിന്റെ ഇപ്പോഴുള്ള സ്വഭാവവും πονηροῦ ധാർമിക ദുഷ്ടതയും വ്യക്തമാക്കുന്നു.
- source_word: κατὰ τὸ θέλημα
  choice: ഇഷ്ടപ്രകാരം
  rationale: ദൈവത്തിന്റെ ഉദ്ദേശ്യത്തോടുള്ള അനുരൂപത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: നമ്മുടെ ദൈവവും പിതാവുമായവന്റെ
  rationale: ദൈവവും പിതാവും ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν എന്നതിൽ പാപപരിഹാരത്തിന്റെ രീതി കൂടുതൽ നിർവചിക്കണമോ
  choice: നമ്മുടെ പാപങ്ങൾക്കുവേണ്ടി
  alternative: നമ്മുടെ പാപങ്ങൾ നിമിത്തം
  rationale: മൂലപാഠത്തിലെ വീണ്ടെടുപ്പുസംബന്ധമായ ഭാരം നിലനിർത്തുമ്പോഴും പാപപരിഹാരത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തം വാക്യത്തിൽ ഇറക്കിവെക്കുന്നില്ല.
- issue: αἰών എന്നത് ‘യുഗം’ എന്നോ ‘ലോകം’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ഇപ്പോഴത്തെ ദുഷ്ടയുഗം
  alternative: ഇപ്പോഴത്തെ ദുഷ്ടലോകം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലുള്ള കാലിക-പ്രാപഞ്ചിക ആശയം ‘യുഗം’ കൂടുതൽ കൃത്യമായി സൂക്ഷിക്കുന്നു; ‘ലോകം’ എന്ന പരമ്പരാഗത പരിഭാഷയും അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ὅπως ἐξέληται എന്ന ഉദ്ദേശ്യപ്രയോഗം എങ്ങനെ നിലനിർത്തണം
  choice: നമ്മെ വിടുവിക്കേണ്ടതിന്
  alternative: നമ്മെ വിടുവിക്കാനായി
  rationale: ക്രിയയുടെ ഉദ്ദേശ്യഭാവം വ്യക്തമാക്കുകയും ഫലം യാന്ത്രികമായി മുൻകൂട്ടി നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ബന്ധവാക്യഘടന മുൻവാക്യവുമായി ചേരുന്നതിനാൽ ‘നൽകിയവൻ’ നിലനിർത്തി; അവസാനഭാഗത്തെ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘തന്നെയാണ് അങ്ങനെ ചെയ്തത്’ ചേർത്തു. ‘ദുഷ്ടയുഗം’ എന്നത് അല്പം സാങ്കേതികമെങ്കിലും αἰών എന്ന പദത്തിന്റെ അർഥം ‘ദുഷ്ടലോകം’ എന്നതിനെക്കാൾ കൃത്യമായി വഹിക്കുന്നു.
