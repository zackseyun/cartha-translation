revisions:
- from: നമ്മുടെ പാപങ്ങൾക്കുവേണ്ടി തന്നെത്തന്നെ നൽകിയവൻ—ഇപ്പോഴത്തെ ദുഷ്ടയുഗത്തിൽനിന്ന് നമ്മെ വിടുവിക്കേണ്ടതിന്[a], നമ്മുടെ ദൈവവും പിതാവുമായവന്റെ ഇഷ്ടപ്രകാരം തന്നെയാണ് അങ്ങനെ ചെയ്തത്.
