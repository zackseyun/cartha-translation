    text: അഥവാ, ‘ഇപ്പോഴത്തെ ദുഷ്ടലോകത്തിൽനിന്ന് നമ്മെ വിടുവിക്കേണ്ടതിന്.’
    reason: αἰών എന്നതിന് സന്ദർഭത്തിൽ ‘ലോകം’ എന്ന പരമ്പരാഗത പകരം സാധ്യമാണ്; എന്നാൽ മൂലപാഠത്തിലെ കാലികമായ അർഥം ‘യുഗം’ കൂടുതൽ കൃത്യമായി വഹിക്കുന്നു.
