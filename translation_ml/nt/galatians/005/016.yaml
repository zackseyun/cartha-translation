id: GAL.5.16
reference: Galatians 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ പറയുന്നു: ആത്മാവിനാൽ നടക്കുവിൻ; ജഡത്തിന്റെ[a] ആഗ്രഹം നിങ്ങൾ തീർച്ചയായും നിറവേറ്റുകയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാപസ്വഭാവത്തിന്റെ ആഗ്രഹം.’ ഗ്രീക്കുപദത്തിന്റെ അക്ഷരാർഥം ‘ജഡം’ എന്നാണ്. പൗലോസിന്റെ പ്രയോഗത്തിൽ, ആത്മാവിനെ എതിർക്കുന്ന വീണുപോയ മനുഷ്യസ്വഭാവത്തെ ഈ പദം സൂചിപ്പിക്കാം.
    reason: σάρξ എന്ന പദത്തിന്റെ അക്ഷരാർഥവും സന്ദർഭപരമായ മറ്റൊരു വ്യാഖ്യാനവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: Λέγω δέ
  choice: എന്നാൽ ഞാൻ പറയുന്നു
  rationale: δέ ഇവിടെ മുൻവാക്യങ്ങളിൽനിന്നുള്ള മൃദുവായ വൈരുധ്യമോ പ്രഭാഷണത്തിലെ വഴിത്തിരിവോ സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ വൈരുധ്യം അമിതമാക്കാതെ അത് നിലനിർത്തുന്നു.
- source_word: πνεύματι
  choice: ആത്മാവിനാൽ
  rationale: ദത്തിവ് ഇവിടെ പ്രവർത്തനമാധ്യമത്തെയോ ജീവിതമണ്ഡലത്തെയോ സൂചിപ്പിക്കാം. സമീപസന്ദർഭം പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആത്മാവിനാൽ’ ഈ അർത്ഥവും വ്യാകരണബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: περιπατεῖτε
  choice: നടക്കുക
  rationale: പൗലോസിന്റെ ‘നടക്കുക’ എന്ന ജീവിതചര്യാ-രൂപകം വിവർത്തനത്തിൽ നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിലും സന്ദർഭത്തിൽ അത് ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: ἐπιθυμίαν
  choice: മോഹം
  rationale: ἐπιθυμία ആഗ്രഹത്തെ സൂചിപ്പിക്കുന്ന വിശാലപദമാണെങ്കിലും ഇവിടെ ജഡത്തോടുള്ള ബന്ധം അതിന് നിഷേധാത്മക അർത്ഥം നൽകുന്നു. ‘മോഹം’ അതിനെ ‘കാമം’ എന്ന ചുരുങ്ങിയ അർത്ഥത്തിലേക്ക് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: σαρκὸς
  choice: ജഡത്തിന്റെ
  rationale: പൗലോസിന്റെ σάρξ എന്ന പ്രധാന രൂപകവും ആത്മാവുമായുള്ള അതിന്റെ സംഘർഷവും നിലനിർത്തുന്നു; ‘പാപസ്വഭാവം’ എന്നു മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: οὐ μὴ τελέσητε
  choice: നിങ്ങൾ തീർച്ചയായും നിറവേറ്റുകയില്ല
  rationale: οὐ μή ചേർന്നുള്ള ശക്തമായ നിഷേധം ‘തീർച്ചയായും ... ഇല്ല’ എന്നു പ്രകടമാക്കുന്നു; τελέω ഒരു മോഹം പ്രവർത്തിയിൽ പൂർത്തിയാക്കുന്നതിനെ ഇവിടെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: πνεύματι എന്നതിന്റെ സൂചിതവിഷയം
  choice: പരിശുദ്ധാത്മാവ്
  alternative: മനുഷ്യന്റെ ആത്മാവ്; പൊതുവായ ഒരു ആത്മീയ തത്ത്വം
  rationale: ഗലാത്യർ 5-ലെ സമീപസന്ദർഭത്തിൽ ആത്മാവും ജഡവും തമ്മിലുള്ള വൈരുധ്യം ക്രിസ്തീയജീവിതത്തിൽ പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. എങ്കിലും മുഖ്യപാഠത്തിൽ ഉറവിടത്തിലെ ‘ആത്മാവ്’ എന്ന പദം മാത്രമാണ് നൽകിയിരിക്കുന്നത്.
- issue: σάρξ എന്നതിന്റെ വിവർത്തനം
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: ഇവിടെ ധാർമ്മികമായി നിഷേധാത്മകമായ മനുഷ്യപ്രവണതയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും ‘ജഡം’ പൗലോസിന്റെ പദവും അതിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു. വ്യാഖ്യാനപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: καὶ എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: അർധവിരാമത്തിലൂടെ ചേർത്ത അനന്തരഫലം
  alternative: ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘അങ്ങനെ ചെയ്താൽ’ എന്ന വ്യക്തമായ ഫലബന്ധം
  rationale: ആത്മാവിനാൽ നടക്കുന്നതും ജഡത്തിന്റെ മോഹം നിറവേറ്റാതിരിക്കുന്നതും തമ്മിൽ ഫലബന്ധം സന്ദർഭത്തിൽ ശക്തമാണെങ്കിലും, ഗ്രീക്ക് പാഠത്തിലെ ലളിതമായ καὶ-യെ തുറന്ന നിബന്ധനാവാക്യമായി വികസിപ്പിക്കാതെ ബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘നടക്കുക,’ ‘ജഡം’ എന്നീ പൗലോസിന്റെ പ്രധാന രൂപകങ്ങൾ നിലനിർത്തി; ശക്തമായ ഗ്രീക്ക് നിഷേധം ‘തീർച്ചയായും ... ഇല്ല’ എന്നു വ്യക്തമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം അത് വിശദീകരിക്കുന്ന ‘ജഡത്തിന്റെ’ എന്ന പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
