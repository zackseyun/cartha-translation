  to: 'എന്നാൽ ഞാൻ പറയുന്നു: ആത്മാവിനാൽ നടക്കുവിൻ; ജഡത്തിന്റെ[a] ആഗ്രഹം നിങ്ങൾ തീർച്ചയായും നിറവേറ്റുകയില്ല.'
