id: GAL.5.22
reference: Galatians 5:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: ml
  text: എന്നാൽ ആത്മാവിന്റെ ഫലം സ്നേഹം, സന്തോഷം, സമാധാനം, ദീർഘക്ഷമ, ദയ, നന്മ, വിശ്വാസം[a] എന്നിവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിശ്വസ്തത.’ ഗ്രീക്ക് പദമായ പിസ്റ്റിസ് വിശ്വാസം, ആശ്രയം, വിശ്വസ്തത എന്നീ അർത്ഥങ്ങൾ നൽകാം. ഈ ഗുണപ്പട്ടികയിൽ ‘വിശ്വസ്തത’ എന്നും മനസ്സിലാക്കാവുന്നതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ ജഡത്തിന്റെ പ്രവൃത്തികളോടുള്ള വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καρπὸς
  choice: ഫലം
  rationale: പൗലോസിന്റെ രൂപകം നിലനിർത്തുകയും ഏകവചനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ πνεύματός
  choice: ആത്മാവിന്റെ
  rationale: സന്ദർഭത്തിൽ ജഡത്തോട് വിപരീതമായി പ്രവർത്തിക്കുന്ന പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വിശാലവുമായ തത്തുല്യപദം.
- source_word: χαρά
  choice: സന്തോഷം
  rationale: ഗുണപ്പട്ടികയിൽ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: ആന്തരികവും പരസ്പരബന്ധപരവുമായ മാനങ്ങൾ അമിതമായി പരിമിതപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: μακροθυμία
  choice: ദീർഘക്ഷമ
  rationale: നീണ്ടുനിൽക്കുന്ന ക്ഷമയും സഹനവും സൂചിപ്പിക്കുന്ന സഭാപരിചിതവും അർത്ഥസമ്പന്നവുമായ പദം.
- source_word: χρηστότης
  choice: ദയ
  rationale: മറ്റുള്ളവരോടുള്ള കരുണാപൂർവമായ നന്മയെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἀγαθωσύνη
  choice: നന്മ
  rationale: വിശാലമായ ധാർമിക നന്മയെ സംക്ഷിപ്തമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ സാധാരണയും പരമ്പരാഗതവുമായ അർത്ഥം നിലനിർത്തുന്നു; ഈ ഗുണപ്പട്ടികയിൽ സാധ്യതയുള്ള ‘വിശ്വസ്തത’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: πνεῦμα എന്നതിന്റെ സൂചിതവിഷയം
  choice: പരിശുദ്ധാത്മാവ്
  alternative: മനുഷ്യന്റെ ആത്മാവ്
  rationale: ഗലാത്യർ 5-ലെ ജഡം–ആത്മാവ് വൈരുധ്യവും പൗലോസിന്റെ വിപുലമായ വാദവും ഇവിടെ പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനത്തെയാണ് പിന്തുണയ്ക്കുന്നത്.
- issue: ഗുണപ്പട്ടികയിലെ πίστις എന്നതിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: രണ്ട് അർത്ഥങ്ങളും ഭാഷാപരമായി സാധുവാണ്. പ്രധാനപാഠം സാധാരണ തത്തുല്യമായ ‘വിശ്വാസം’ നിലനിർത്തുന്നു; സന്ദർഭാനുസൃതമായ ‘വിശ്വസ്തത’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ഏകവചനമായ ‘ഫലം’ നിലനിർത്തി. പട്ടികയുടെ താളം സംക്ഷിപ്തമായി സൂക്ഷിച്ചു; യഥാർഥമായ πίστις അർത്ഥദ്വയത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
