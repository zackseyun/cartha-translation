id: GAL.5.1
reference: Galatians 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: ml
  text: സ്വാതന്ത്ര്യത്തിനായിട്ടാണ് മശീഹ നമ്മെ സ്വതന്ത്രരാക്കിയത്[a]. അതുകൊണ്ട് ഉറച്ചുനിൽക്കുക; വീണ്ടും അടിമത്തത്തിന്റെ നുകത്തിനു വിധേയരാകരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സ്വാതന്ത്ര്യത്തിലാണ് മശീഹ നമ്മെ സ്വതന്ത്രരാക്കിയത്.” ആരംഭത്തിലെ ദത്തിവുപദപ്രയോഗം സംക്ഷിപ്തമായതിനാൽ അടുത്ത ബന്ധമുള്ള ഒന്നിലധികം രീതിയിൽ അതിനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഇവിടത്തെ ഗ്രീക്ക് ക്രിയയ്ക്ക് “വിധേയരാകുക” എന്നതിനൊപ്പം “കുടുങ്ങിപ്പോകുക” എന്ന അർഥവും വരാം. അതിനാൽ, “വീണ്ടും അടിമത്തത്തിന്റെ നുകത്തിൽ കുടുങ്ങിപ്പോകരുത്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: സ്വാതന്ത്ര്യത്തിനായിട്ടാണ്
  rationale: മുഖത്തുള്ള സംക്ഷിപ്തമായ ദത്തിവുപയോഗം ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാം. ഈ രൂപം പൗലോസിന്റെ ഊന്നൽ നിലനിർത്തുകയും ബന്ധപ്പെട്ട മറ്റൊരു വായന അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രക്ഷകനെ സൂചിപ്പിക്കുന്ന പദവിയാണ്. ‘മശീഹ’ എന്ന രൂപം അതിന്റെ യഹൂദ മശീഹാപരമായ പശ്ചാത്തലം നിലനിർത്തുന്നു.
- source_word: ἠλευθέρωσεν
  choice: സ്വതന്ത്രരാക്കി
  rationale: ἐλευθερόω എന്ന ക്രിയയുടെ നേരായ അർഥം നൽകുന്നു; ἐλευθερία എന്ന നാമവുമായുള്ള പദപ്രതിധ്വനിയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: στήκετε
  choice: ഉറച്ചുനിൽക്കുക
  rationale: തുടർച്ചയായ ദൃഢനിലപാടിനുള്ള വർത്തമാനകാല ആജ്ഞയുടെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപ്രഖ്യാപനത്തിൽനിന്നുള്ള നിഗമനം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ζυγῷ δουλείας
  choice: അടിമത്തത്തിന്റെ നുകം
  rationale: ζυγός എന്ന നുകത്തിന്റെ രൂപകവും δουλεία എന്ന അടിമാവസ്ഥയുടെ ശക്തമായ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ἐνέχεσθε
  choice: വിധേയരാകരുത്
  rationale: ഒരു അധികാരത്തിനോ ബന്ധനത്തിനോ കീഴ്പ്പെടുക, അതിൽ കുടുങ്ങുക എന്നീ സാധ്യതകളുള്ള പ്രയോഗത്തിൽ നുകത്തിനു കീഴിലാകുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മുൻകാല അടിമാവസ്ഥയിലേക്കുള്ള മടങ്ങിവരവ് നേരിട്ട് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്നത് പദവിയായോ പേരുപോലുള്ള രൂപമായോ നൽകണമോ
  choice: മശീഹ
  alternative: ക്രിസ്തു; അഭിഷിക്തൻ
  rationale: സന്ദർഭത്തിൽ സ്വാതന്ത്ര്യം നൽകുന്ന മശീഹാപരമായ പദവിയുടെ അർഥവും യഹൂദ പശ്ചാത്തലവും പ്രകടമാക്കാൻ ‘മശീഹ’ തിരഞ്ഞെടുത്തു; പേരുപോലെ മാത്രം വായിക്കപ്പെടാവുന്ന ‘ക്രിസ്തു’ ഒഴിവാക്കി.
- issue: δουλείαയുടെ ശക്തി എങ്ങനെ നൽകണം
  choice: അടിമത്തം
  alternative: ബന്ധനം; ദാസ്യം
  rationale: സ്വാതന്ത്ര്യത്തിന് നേർവിപരീതമായ അടിമാവസ്ഥയെ ശക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘അടിമത്തം’ മൂലപദത്തിന്റെ സാമൂഹികവും രൂപകാത്മകവുമായ ഭാരം കൂടുതൽ നേരിട്ട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നുകം’ എന്ന മൂലരൂപകം നിലനിർത്തി; ആരംഭവാക്യത്തിന്റെ യഥാർഥ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
