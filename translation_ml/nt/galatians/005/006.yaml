  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: ml
  text: കാരണം, മശീഹാ യേശുവിൽ[a] പരിച്ഛേദനയ്‌ക്കോ പരിച്ഛേദനമില്ലായ്മയ്‌ക്കോ യാതൊരു പ്രാബല്യവുമില്ല; എന്നാൽ സ്നേഹത്തിലൂടെ പ്രവർത്തിക്കുന്ന[c] വിശ്വാസത്തിനാണ്[b] പ്രാബല്യമുള്ളത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുയേശുവിൽ.’ ഗ്രീക്കിലെ Χριστός ഒരു സ്ഥാനപ്പേരായതിനാൽ മുഖ്യപാഠത്തിൽ അതിന്റെ അർത്ഥം സൂചിപ്പിക്കുന്ന ‘മശീഹാ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: πίστις എന്ന പദം ‘വിശ്വസ്തത’ എന്നോ ‘ആശ്രയിക്കൽ’ എന്നോ പരിഭാഷപ്പെടുത്താനും കഴിയും.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘സ്നേഹത്തിലൂടെ സജീവമായിരിക്കുന്ന,’ ‘സ്നേഹത്തിൽ സ്വയം പ്രകടമാക്കുന്ന,’ അല്ലെങ്കിൽ ‘സ്നേഹത്തിലൂടെ ഫലപ്രദമാകുന്ന.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ Χριστῷ Ἰησοῦ
  choice: കാരണം, മശീഹയായ യേശുവിൽ
  rationale: γάρ മുൻവാദത്തിന്റെ കാരണം വിശദീകരിക്കുന്നതിനാൽ ‘കാരണം’ എന്നു നൽകി. ἐν എന്നത് പൗലൊസിന്റെ ‘യേശുവിൽ’ എന്ന ഐക്യഭാഷ നിലനിർത്തുന്നു. Χριστός എന്ന സ്ഥാനപ്പേര് അർത്ഥസഹിതമായി ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: περιτομή ... ἀκροβυστία
  choice: പരിച്ഛേദന ... പരിച്ഛേദനമില്ലായ്മ
  rationale: ആചാരത്തെയും അതിനോടു ബന്ധപ്പെട്ട തിരിച്ചറിയൽനിലയെയും സൂചിപ്പിക്കുന്ന സമാന്തരവിരോധം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τι ἰσχύει
  choice: യാതൊരു പ്രാബല്യവുമില്ല
  rationale: ഇവിടെ ശാരീരിക ശക്തിയല്ല, ഫലപ്രാപ്തിയോ നിർണായകമൂല്യമോ ആണ് ഉദ്ദേശിക്കുന്നത്. ‘പ്രാബല്യം’ ഈ അർത്ഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: πίστις എന്നതിന് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മുഖ്യപരിഭാഷ; ‘വിശ്വസ്തത’, ‘ആശ്രയം’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: δι’ ἀγάπης
  choice: സ്നേഹത്തിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά സൂചിപ്പിക്കുന്ന മാധ്യമമോ മാർഗമോ അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐνεργουμένη
  choice: പ്രവർത്തിക്കുന്ന
  rationale: വർത്തമാനകാല മധ്യ/കർമണി കൃദന്തരൂപത്തിന്റെ സജീവതയും ഫലപ്രാപ്തിയും നിലനിർത്തുന്നു; അത് കർശനമായി മധ്യമോ കർമണിയോ എന്നു തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർത്ഥം പ്രകടമാക്കുന്ന ‘മശീഹാ’ മുഖ്യപാഠത്തിൽ നൽകി; സഭാപാരമ്പര്യത്തിൽ പരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: πίστις എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: മുഖ്യപാഠത്തിൽ സാധാരണവും സന്ദർഭോചിതവുമായ ‘വിശ്വാസം’ ഉപയോഗിച്ചു; പദത്തിന്റെ മറ്റു യഥാർഥ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി ദൈവശാസ്ത്രപരമായ അർത്ഥവ്യാപ്തി അടച്ചുപൂട്ടിയില്ല.
- issue: ἐνεργουμένη എന്നതിലെ മധ്യ/കർമണി അവ്യക്തത
  choice: പ്രവർത്തിക്കുന്ന
  alternative: സജീവമായിരിക്കുന്ന; സ്നേഹത്തിലൂടെ ഫലപ്രദമാകുന്ന; സ്നേഹത്തിൽ സ്വയം പ്രകടമാക്കുന്ന
  rationale: ഗ്രീക്ക് രൂപം മധ്യമായോ കർമണിയായോ ഗ്രഹിക്കാം. ‘പ്രവർത്തിക്കുന്ന’ എന്നത് ഈ അവ്യക്തത പരമാവധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ഒരുമിച്ച് പാലിച്ചു. ‘പരിച്ഛേദനമില്ലായ്മ’ സാധാരണ വായനക്കാർക്ക് ‘അഗ്രചർമം’ എന്ന സാങ്കേതികപദത്തേക്കാൾ വ്യക്തമാകുന്നു. ഗ്രീക്കിൽ രണ്ടാം ഖണ്ഡത്തിൽ ക്രിയാപദം അധ്യാഹൃതമായതിനാൽ മലയാളത്തിൽ ആശയം പൂർണമാക്കാൻ ‘പ്രാബല്യമുള്ളത്’ ആവർത്തിച്ചു.
