id: GAL.5.10
reference: Galatians 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: ml
  text: 'നിങ്ങളെക്കുറിച്ച് കർത്താവിൽ എനിക്ക് ഉറപ്പുണ്ട്: നിങ്ങൾ മറ്റൊരു നിലപാട് സ്വീകരിക്കുകയില്ല.[a] എന്നാൽ നിങ്ങളെ കലക്കിക്കൊണ്ടിരിക്കുന്നവൻ—അവൻ ആരായിരുന്നാലും[b]—വിധി വഹിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ മറ്റൊന്നും ചിന്തിക്കുകയില്ല.” ഗ്രീക്ക് ക്രിയയ്ക്ക് പൊതുവായി ചിന്തിക്കുക എന്നും ഒരു പ്രത്യേക മനോഭാവമോ നിലപാടോ പുലർത്തുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവൻ ആരായാലും” / “അവൻ ആരാണെന്നത് കാര്യമല്ല.”
    reason: alternative_rendering
lexical_decisions:
- source_word: πέποιθα
  choice: എനിക്ക് ഉറപ്പുണ്ട്
  rationale: പൂർണകാലരൂപം സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ആത്മവിശ്വാസാവസ്ഥ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങളെക്കുറിച്ച്
  rationale: ഗലാത്യരുടെ പ്രതികരണത്തെ സംബന്ധിച്ചുള്ള പൗലോസിന്റെ ഉറപ്പാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; അസ്വാഭാവികമായ അക്ഷരാർഥ വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ ഉറപ്പിന്റെ ആധാരവും മേഖലയുമായ കർത്താവുമായുള്ള ബന്ധം തുറന്നുവെക്കുന്നു.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: നിങ്ങൾ മറ്റൊരു നിലപാട് സ്വീകരിക്കുകയില്ല
  rationale: φρονέω ചിന്തിക്കുക എന്നതിലുപരി ഒരു മനോഭാവമോ നിലപാടോ പുലർത്തുന്നതിനെ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ നിലപാട് എന്ന പ്രയോഗം സ്വാഭാവികവും വ്യക്തവുമാണ്; കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ταράσσων ὑμᾶς
  choice: നിങ്ങളെ കലക്കിക്കൊണ്ടിരിക്കുന്നവൻ
  rationale: വർത്തമാനകാല പങ്കാളിത്തരൂപം ഇപ്പോൾ സമൂഹത്തിൽ ആശയക്കുഴപ്പവും അസ്വസ്ഥതയും സൃഷ്ടിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: βαστάσει τὸ κρίμα
  choice: ആ വിധി വഹിക്കും
  rationale: βαστάζω എന്നതിലെ ‘വഹിക്കുക’ എന്ന രൂപകം നിലനിർത്തുകയും κρίμα വിധിയെയോ അതിന്റെ ശിക്ഷാഫലത്തെയോ സൂചിപ്പിക്കാമെന്ന അവ്യക്തത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅστις ἐὰν ᾖ
  choice: അവൻ ആരായിരുന്നാലും
  rationale: കലക്കമുണ്ടാക്കുന്നവന്റെ വ്യക്തിത്വമോ സ്ഥാനമോ പ്രസക്തമല്ലെന്ന അനിശ്ചിത-വിട്ടുവീഴ്ചാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഗലാത്യരെക്കുറിച്ചുള്ള പൗലോസിന്റെ ഉറപ്പിന്റെ സ്വഭാവം
  choice: അവരുടെ ഭാവിനിലപാടിനെക്കുറിച്ചുള്ള ഉറപ്പ് കർത്താവിൽ ആധാരപ്പെടുത്തിയതായി വിവർത്തനം ചെയ്യുന്നു.
  alternative: എല്ലാ ഗലാത്യരും തീർച്ചയായും നിലനിൽക്കും എന്ന നിരുപാധിക ഉറപ്പോ, ദൈവശാസ്ത്രപരമായ ആധാരമില്ലാത്ത വ്യക്തിപരമായ പ്രതീക്ഷയോ ആയി വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം വ്യക്തിപരമായ ഉറപ്പിനെയും ‘കർത്താവിൽ’ എന്ന വ്യക്തമായ ആധാരത്തെയും ഭാവിപ്രതീക്ഷയെയും ഒരുമിച്ചു നിർത്തുന്നു; വിവർത്തനം ഈ പിരിമുറുക്കം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: τὸ κρίμα എന്നതിന്റെ വ്യാപ്തി
  choice: വിധി എന്ന പൊതുവായ പദം ഉപയോഗിച്ച് വിധിനിർണയത്തിനും അതിന്റെ ശിക്ഷാഫലത്തിനുമിടയിലെ അർഥവ്യാപ്തി തുറന്നുവെക്കുന്നു.
  alternative: നിത്യശിക്ഷയെന്നോ സഭാശിക്ഷ മാത്രമെന്നോ നിർദിഷ്ടമാക്കുക.
  rationale: ഈ വാക്യം വിധിയുടെ കൃത്യമായ സ്വഭാവം നിർവചിക്കുന്നില്ല; അതിനാൽ കൂടുതൽ പ്രത്യേകമായ ഉപദേശപരമായ അർഥം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കർത്താവിൽ,’ ‘വിധി വഹിക്കും’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ പൗലോസീയവും രൂപകാത്മകവുമായ സ്വരം നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്കിനനുസരിച്ച് ക്രമപ്പെടുത്തിയിരിക്കുന്നു.
