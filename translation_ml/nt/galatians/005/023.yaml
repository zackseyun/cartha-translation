  text: πραΰτης, ἐγκράτεια· κατὰ τῶν τοιούτων οὐκ ἔστιν νόμος.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/023.yaml
  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: ml
  text: സൗമ്യത, ആത്മനിയന്ത്രണം; ഇത്തരം കാര്യങ്ങൾക്കെതിരെ[a] നിയമമൊന്നുമില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇത്തരം ആളുകൾക്കെതിരെ.’ എന്നാൽ ഇവിടെ ഈ പ്രയോഗം ഈ ഗുണങ്ങൾ പ്രകടിപ്പിക്കുന്ന ആളുകളെക്കാൾ മുമ്പ് പറഞ്ഞ ഗുണങ്ങളെയാകാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘നിയമം’ എന്നത് ഇവിടെ മോശെയുടെ ന്യായപ്രമാണത്തെയും ഉൾക്കൊള്ളാം; എന്നാൽ ഗ്രീക്ക് വാചകം അതിനെ മാത്രം ഉദ്ദേശിക്കുന്നതായി വ്യക്തമാക്കുന്നില്ല.
    reason: theological_ambiguity
lexical_decisions:
- source_word: πραΰτης
  choice: സൗമ്യത
  rationale: കടുപ്പമില്ലാത്ത, വിനയപൂർവമായ മനോഭാവത്തെ സൂചിപ്പിക്കുന്ന ഈ പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ തത്തുല്യപ്രയോഗമാണ് ‘സൗമ്യത’.
- source_word: ἐγκράτεια
  choice: ആത്മനിയന്ത്രണം
  rationale: സ്വന്തം ആഗ്രഹങ്ങളെയും പ്രേരണകളെയും നിയന്ത്രിക്കുന്നതെന്ന ധാർമിക അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: κατὰ τῶν τοιούτων
  choice: ഇത്തരം കാര്യങ്ങൾക്കെതിരെ
  rationale: τοιούτων എന്ന രൂപം ആളുകളെയോ കാര്യങ്ങളെയോ സൂചിപ്പിക്കാമെങ്കിലും, സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ ആത്മാവിന്റെ ഫലഗുണങ്ങളിലേക്കാണ് ഏറ്റവും സ്വാഭാവികമായി ചൂണ്ടുന്നത്.
- source_word: νόμος
  choice: നിയമം
  rationale: ഗ്രീക്കിൽ നിർദേശക ഉപപദമില്ലാത്തതിനാൽ ഒരു പ്രത്യേക നിയമത്തെ മാത്രം ഉദ്ദേശിക്കുന്നതായി ചുരുക്കാതെ പൊതുവായ പ്രസ്താവനയായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: νόμος എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ‘നിയമം’ എന്ന പൊതുവായ അർഥത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ന്യായപ്രമാണം’ എന്നു നൽകി മോശെയുടെ ന്യായപ്രമാണത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുക.
  rationale: ഗലാത്യലേഖനത്തിന്റെ പശ്ചാത്തലത്തിൽ മോശെയുടെ ന്യായപ്രമാണം ഉൾപ്പെടാമെങ്കിലും, ഉപപദമില്ലാത്ത ഗ്രീക്ക് പ്രയോഗം ‘ഒരു നിയമവും ഇത്തരം ഗുണങ്ങൾക്ക് എതിരല്ല’ എന്ന വിശാലമായ സൂക്തരൂപത്തിലുള്ള പ്രസ്താവന അനുവദിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഗുണപ്പട്ടികയുടെ സംക്ഷിപ്ത താളവും അവസാനവാക്യത്തിന്റെ സൂക്തരൂപത്തിലുള്ള ശക്തിയും നിലനിർത്തി.
