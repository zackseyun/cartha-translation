  yaml_path: translation/nt/galatians/005/012.yaml
  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: ml
  text: നിങ്ങളെ കുഴപ്പത്തിലാക്കുന്നവർ[b] തങ്ങളെത്തന്നെ മുറിച്ചുകളയുകപോലും ചെയ്തിരുന്നെങ്കിൽ എത്ര നന്നായിരുന്നു[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, “തങ്ങളെത്തന്നെ മുറിച്ചുകളഞ്ഞിരുന്നെങ്കിൽ.” ഈ സന്ദർഭത്തിൽ, പരിച്ഛേദനത്തിനും അപ്പുറം പോയി സ്വയം വൃഷണഛേദം വരുത്തുന്നതിനെ പൗലൊസ് സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങളെ കലക്കിമറിക്കുന്നവർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: ചെയ്തിരുന്നെങ്കിൽ കൊള്ളാമായിരുന്നു
  rationale: നടക്കാത്തതോ നടക്കണമെന്നു ശക്തമായി ആഗ്രഹിക്കുന്നതോ ആയ കാര്യത്തെക്കുറിച്ചുള്ള ആശംസാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καὶ
  choice: പോലും
  rationale: വെറും സംയോജനമല്ല, പരിച്ഛേദനത്തിൽനിന്ന് അതിലും കടുത്ത മുറിക്കലിലേക്കുള്ള പൗലൊസിന്റെ വാക്ചാതുര്യപരമായ തീവ്രതയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ἀποκόψονται
  choice: തങ്ങളെത്തന്നെ മുറിച്ചുവികൃതമാക്കുക
  rationale: ക്രിയയുടെ മുറിച്ചുകളയുക എന്ന അടിസ്ഥാനാർഥവും മധ്യപ്രയോഗത്തിലെ ആത്മനിർദേശവും നിലനിർത്തുന്നു. പരിച്ഛേദനത്തെക്കുറിച്ചുള്ള പശ്ചാത്തലത്തിൽ ജനനേന്ദ്രിയഛേദനത്തെ സൂചിപ്പിക്കുന്ന കടുത്ത വാക്കുകളി സാധ്യതയുള്ളതാണെങ്കിലും മുഖ്യവാചകം അതിനെ അനാവശ്യമായി ഏകാർഥമാക്കുന്നില്ല.
- source_word: οἱ ἀναστατοῦντες
  choice: അസ്വസ്ഥരാക്കുന്നവർ
  rationale: ഗലാത്യവിശ്വാസികളെ കുഴപ്പത്തിലാക്കുകയും അവരുടെ സമാധാനം തകർക്കുകയും ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗം.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: ഗലാത്യയിലെ വിശ്വാസിസമൂഹത്തെ കൂട്ടമായി അഭിസംബോധന ചെയ്യുന്ന ദ്വിതീയപുരുഷ ബഹുവചന കർമരൂപം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: പരിച്ഛേദനവുമായി ബന്ധപ്പെട്ട പൗലൊസിന്റെ കടുത്ത ആശംസയുടെ വ്യാഖ്യാനം
  choice: പരിച്ഛേദനം നിർബന്ധിക്കുന്നവർ അതിലും അപ്പുറം പോയി തങ്ങളെത്തന്നെ മുറിച്ചുവികൃതമാക്കട്ടെ എന്ന കടുത്ത പരിഹാസാത്മക ആശംസയായി വിവർത്തനം ചെയ്തു.
  alternative: അവർ സമൂഹത്തിൽനിന്ന് തങ്ങളെത്തന്നെ വേർപെടുത്തട്ടെ എന്ന പൊതുവായ അർഥം മാത്രം നൽകുക.
  rationale: ഗലാത്യർ 5-ലെ തൊട്ടടുത്ത പശ്ചാത്തലം പരിച്ഛേദനവിവാദമായതിനാൽ മുറിക്കലിനെ ആധാരമാക്കിയ വാക്കുകളിയാണ് ഏറ്റവും സാന്ദർഭികമായ വായന. എന്നാൽ ‘മുറിച്ചുകളയുക’ എന്ന ക്രിയയിൽ സമൂഹത്തിൽനിന്നുള്ള വേർപെടൽ എന്ന വ്യാഖ്യാനസാധ്യതയും നിലനിൽക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ പൊതുമലയാളം ഉപയോഗിച്ചു. മൂലത്തിലെ കടുത്ത പരിഹാസവും മുറിക്കലിനെ ആധാരമാക്കിയ വാക്കുകളിയും മൃദൂകരിക്കാതെ നിലനിർത്തി; അതേസമയം ജനനേന്ദ്രിയഛേദനം എന്ന പ്രത്യേക വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
