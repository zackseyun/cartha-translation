id: GAL.5.13
reference: Galatians 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: ml
  text: കാരണം, സഹോദരങ്ങളേ[a], നിങ്ങൾ സ്വാതന്ത്ര്യത്തിലേക്കാണ് വിളിക്കപ്പെട്ടത്; എന്നാൽ ആ സ്വാതന്ത്ര്യത്തെ ജഡത്തിന് ഒരു അവസരമാക്കരുത്[b][c]. മറിച്ച്, സ്നേഹത്തിലൂടെ പരസ്പരം സേവിക്കുക[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരങ്ങളേ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്; ഈ ലേഖനത്തിൽ അത് സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും അഭിസംബോധന ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ജഡത്തിന് ഒരു ആധാരമാക്കരുത്’; സ്വാതന്ത്ര്യത്തെ ജഡത്തിന്റെ പാപപ്രവണതകൾ പ്രവർത്തിക്കാനുള്ള തുടക്കസ്ഥാനമോ അവസരമോ ആക്കരുത് എന്നാണ് ആശയം.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘ജഡം’ എന്നത് ശാരീരിക ദേഹത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; മനുഷ്യന്റെ പാപപ്രവണതകളെയും സൂചിപ്പിക്കുന്നു. ചില പരിഭാഷകൾ ‘പാപസ്വഭാവം’ എന്നു നൽകുന്നു.
    reason: alternative_reading
  - marker: d
    text: ‘സേവിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയ ‘ദാസൻ’ എന്ന പദവുമായി ബന്ധപ്പെട്ടതാണ്; മറ്റുള്ളവർക്കുവേണ്ടി ദാസനെപ്പോലെ തന്നെത്താൻ സമർപ്പിച്ചു സേവിക്കുക എന്ന ശക്തമായ ഭാവം അതിനുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: നിങ്ങൾ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന സർവനാമം മൂലപാഠത്തിൽ ഊന്നലോടെ വ്യക്തമായി നൽകിയിരിക്കുന്നു; മലയാളത്തിൽ ‘നിങ്ങൾ’ നിലനിർത്തുന്നത് ആ അഭിസംബോധന വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാദത്തിന് വിശദീകരണപരമായ അടിസ്ഥാനം നൽകുന്ന ബന്ധകപദം; മലയാളത്തിൽ ‘കാരണം’ ഈ യുക്തിബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: സ്വാതന്ത്ര്യത്തിനായി
  rationale: വിളിയുടെ ലക്ഷ്യമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്ന പ്രയോഗം. ‘സ്വാതന്ത്ര്യത്തിനായി’ എന്നത് ഗ്രീക്കിന്റെ ലക്ഷ്യസൂചന നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: ἐκλήθητε
  choice: വിളിക്കപ്പെട്ടത്
  rationale: ദൈവിക വിളിയെ സൂചിപ്പിക്കുന്ന കർമ്മണിപ്രയോഗം നിലനിർത്തുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനരീതി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ അഭിസംബോധന നേരിട്ട് നിലനിർത്തുന്നു; വിശ്വാസിസമൂഹത്തിലെ സ്ത്രീകളും ഉൾപ്പെടുന്ന പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μόνον
  choice: എന്നാൽ
  rationale: സ്വാതന്ത്ര്യത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയ്ക്ക് ശക്തമായ നിയന്ത്രണവ്യവസ്ഥ ചേർക്കുന്നു. മലയാളത്തിൽ ‘എന്നാൽ’ വാക്യത്തിന്റെ വൈരുധ്യ-പരിമിതീകരണബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μὴ...εἰς ἀφορμὴν
  choice: ഒരു അവസരമാക്കരുത്
  rationale: ἀφορμή എന്ന പദത്തിലെ അവസരം, തുടക്കസ്ഥാനം, പ്രവർത്തനത്തിനുള്ള ആധാരം എന്നീ ഭാവങ്ങളിൽ ‘അവസരം’ സന്ദർഭത്തിന് യോജിച്ചും മനസ്സിലാക്കാൻ എളുപ്പമായും വരുന്നു.
- source_word: σάρξ
  choice: ജഡം
  rationale: പൗലോസിന്റെ ദൈവശാസ്ത്രഭാരം വഹിക്കുന്ന രൂപകം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു. ഇവിടെ ശാരീരിക ദേഹം മാത്രമല്ല ഉദ്ദേശ്യമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τῆς ἀγάπης
  choice: സ്നേഹത്തിലൂടെ
  rationale: διά + genitive നൽകുന്ന കരണാർഥം നിലനിർത്തുന്നു; ἀγάπηയ്ക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം ‘സ്നേഹം’ ആണ്.
- source_word: δουλεύετε
  choice: സേവിക്കുക
  rationale: ദാസനായി സേവിക്കുക എന്ന ശക്തമായ പദബന്ധം പശ്ചാത്തലത്തിലുണ്ടെങ്കിലും പരസ്പര ധാർമ്മിക ആഹ്വാനത്തിൽ ‘സേവിക്കുക’ സ്വാഭാവികമാണ്; ദാസ്യസേവനത്തിന്റെ ശക്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀλλήλοις
  choice: പരസ്പരം
  rationale: പരസ്പരത വ്യക്തമാക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: വിശ്വാസിസമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന ἀδελφοί എന്ന പദം
  choice: സഹോദരങ്ങളേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ അഭിസംബോധന മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളുന്നതാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: പൗലോസിന്റെ ധാർമ്മിക സന്ദർഭത്തിലെ σάρξ
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: ‘പാപസ്വഭാവം’ എന്നത് സന്ദർഭാർത്ഥം വിശദീകരിക്കുമെങ്കിലും പൗലോസിന്റെ രൂപകവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും ചുരുക്കും. അതിനാൽ ‘ജഡം’ നിലനിർത്തി അർത്ഥപരിധി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: പരസ്പരബന്ധത്തിൽ δουλεύετε എന്ന ക്രിയയുടെ ദാസ്യഭാവം
  choice: പരസ്പരം സേവിക്കുക
  alternative: പരസ്പരം ദാസന്മാരാകുക
  rationale: രണ്ടാമത്തെ രൂപം ഗ്രീക്കിലെ ശക്തമായ ദാസ്യചിത്രം നേരിട്ട് നൽകുന്നു; എന്നാൽ മലയാളത്തിൽ അനാവശ്യമായ ഉടമസ്ഥതാഭാവം സൃഷ്ടിക്കാം. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘സേവിക്കുക’ ഉപയോഗിച്ച് ശക്തമായ മൂലഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐπ’ ἐλευθερίᾳ എന്നതിലെ ലക്ഷ്യവും അവസ്ഥയും തമ്മിലുള്ള സൂക്ഷ്മത
  choice: സ്വാതന്ത്ര്യത്തിനായി
  alternative: സ്വാതന്ത്ര്യത്തിലേക്ക്
  rationale: ഗ്രീക്ക് പ്രയോഗം വിളിയുടെ ലക്ഷ്യമോ അതിലൂടെ ലഭിക്കുന്ന അവസ്ഥയോ സൂചിപ്പിക്കാം. ‘സ്വാതന്ത്ര്യത്തിനായി’ ലക്ഷ്യഭാവം മുൻനിർത്തുന്നുവെങ്കിലും സ്വാതന്ത്ര്യം വിളിയുടെ ഉദ്ദേശ്യമാണെന്ന അടിസ്ഥാനതലം മാത്രം പ്രസ്താവിക്കുന്നു; അതിന്റെ സ്വഭാവം കൂടുതൽ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ജഡം’ പോലുള്ള പൗലോസിന്റെ സാങ്കേതിക-രൂപക പദം മുഖ്യവാചകത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു. വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും കാരണം, നിയന്ത്രണം, വൈരുധ്യം, പരസ്പരസേവനം എന്നീ മൂലപാഠബന്ധങ്ങൾ സംരക്ഷിച്ചു.
