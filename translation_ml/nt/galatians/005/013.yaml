revisions:
- from: കാരണം സഹോദരങ്ങളേ[a], നിങ്ങൾ സ്വാതന്ത്ര്യത്തിനായിട്ടാണ് വിളിക്കപ്പെട്ടത്. എന്നാൽ ആ സ്വാതന്ത്ര്യത്തെ ജഡത്തിന് ഒരു അവസരമാക്കരുത്[b][c]; പകരം, സ്നേഹത്തിലൂടെ പരസ്പരം സേവിക്കുക[d].
  to: കാരണം, സഹോദരങ്ങളേ[a], നിങ്ങൾ സ്വാതന്ത്ര്യത്തിലേക്കാണ് വിളിക്കപ്പെട്ടത്; എന്നാൽ ആ സ്വാതന്ത്ര്യത്തെ ജഡത്തിന് ഒരു അവസരമാക്കരുത്[b][c]. മറിച്ച്, സ്നേഹത്തിലൂടെ പരസ്പരം സേവിക്കുക[d].
