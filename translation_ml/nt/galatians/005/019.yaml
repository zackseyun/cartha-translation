source:
  edition: SBLGNT
  text: φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ⸀ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: ml
  text: 'ജഡത്തിന്റെ[a] പ്രവൃത്തികൾ വ്യക്തമാണ്: ലൈംഗിക അധാർമികത, അശുദ്ധി, അഴിഞ്ഞ പെരുമാറ്റം,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാപസ്വഭാവം.” ഗ്രീക്കിൽ “ജഡം” (σάρξ) എന്നാണ്; ഇവിടെ പാപത്തിലേക്കു ചായുന്ന മനുഷ്യന്റെ അഭിലാഷങ്ങളെയും ജീവിതദിശയെയും സൂചിപ്പിക്കുന്ന രൂപകമായി പൗലോസ് ഈ പദം ഉപയോഗിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: വ്യക്തമാണ്
  rationale: കാണാവുന്നതും വ്യക്തമായി തിരിച്ചറിയാവുന്നതുമായ കാര്യത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സുതാര്യവുമാണ്.
- source_word: δέ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ നേരിയ വിഷയമാറ്റമോ വൈരുധ്യമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എന്നാൽ’ എന്നു ചേർത്താൽ വൈരുധ്യം അമിതമായി ശക്തിപ്പെടാം; വാക്യക്രമം തന്നെ മാറ്റം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: τὰ ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: പ്രവൃത്തികളെയോ പ്രവർത്തനഫലങ്ങളെയോ സൂചിപ്പിക്കുന്ന സാധാരണ പദം; തുടർന്നുള്ള ‘ആത്മാവിന്റെ ഫലം’ എന്ന വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: τῆς σαρκός
  choice: ജഡത്തിന്റെ
  rationale: പൗലോസിന്റെ σάρξ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് ഒതുക്കാതെ നിലനിർത്തുന്നു; ഇവിടെ അത് പാപത്തിലേക്കു ചായുന്ന മനുഷ്യാഭിലാഷങ്ങളെയും ദിശാബോധത്തെയും സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἅτινά ἐστιν
  choice: ':'
  rationale: തുടർന്നുവരുന്ന ഉദാഹരണപ്പട്ടികയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ദ്വിബിന്ദു മതിയാകുന്നു.
- source_word: πορνεία
  choice: ലൈംഗിക അധാർമികത
  rationale: അനുവദനീയമല്ലാത്ത വിവിധ ലൈംഗിക പെരുമാറ്റങ്ങളെ ഉൾക്കൊള്ളുന്ന വിശാലവും വ്യക്തവുമായ ആധുനിക പ്രയോഗം.
- source_word: ἀκαθαρσία
  choice: അശുദ്ധി
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്ന ധാർമിക അശുദ്ധിയെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἀσέλγεια
  choice: ലജ്ജയില്ലാത്ത ദുർന്നടപ്പ്
  rationale: നിയന്ത്രണമില്ലാത്തതും സാമൂഹിക-ധാർമിക ലജ്ജയെ തള്ളിക്കളയുന്നതുമായ പെരുമാറ്റം എന്ന പദത്തിന്റെ ആശയം അറിയിക്കുന്നു; വെറും ‘കാമാസക്തി’ എന്നു ചുരുക്കുന്നത് അതിന്റെ വ്യാപ്തി കുറയ്ക്കും.
theological_decisions:
- issue: പൗലോസിന്റെ ധാർമിക പ്രയോഗത്തിലെ σάρξ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: ‘ജഡം’ എന്ന രൂപകം ജഡവും ആത്മാവും തമ്മിലുള്ള പൗലോസിന്റെ ഉദ്ദേശപൂർവമായ വൈരുധ്യവും അതിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു. ‘പാപസ്വഭാവം’ അർഥം വിശദീകരിക്കുന്നുവെങ്കിലും പദത്തെ ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാം; അതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ പട്ടികാരൂപവും അവസാനത്തിലെ തുടർച്ചാസൂചകമായ അർധവിരാമസ്വഭാവമുള്ള കോമയും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് സൂചിക ഇംഗ്ലീഷ് കരടിലെ തെറ്റായ സ്ഥാനമായ πορνεία-യോടല്ല, അത് വിശദീകരിക്കുന്ന σάρξ-നോടാണ് ചേർത്തത്.
