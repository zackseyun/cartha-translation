id: GAL.5.2
reference: Galatians 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: ml
  text: 'ശ്രദ്ധിക്കുക: പൗലോസായ ഞാൻ നിങ്ങളോടു പറയുന്നു—നിങ്ങൾ പരിച്ഛേദനം ഏൽക്കുന്നുവെങ്കിൽ[a], മശീഹാ[b] നിങ്ങൾക്ക് ഒട്ടും പ്രയോജനപ്പെടുകയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ പരിച്ഛേദിതരാകുന്നുവെങ്കിൽ’ അല്ലെങ്കിൽ ‘നിങ്ങൾ സ്വയം പരിച്ഛേദനം ചെയ്യിക്കുകയാണെങ്കിൽ.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ക്രിസ്തു’; ഇവിടെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: 'ശ്രദ്ധിക്കുക:'
  rationale: ശ്രോതാക്കളുടെ ശ്രദ്ധ ശക്തമായി ക്ഷണിക്കുന്ന പ്രയോഗമാണ്. പഴഞ്ചനായ ഭാവം ഒഴിവാക്കി പൗലോസിന്റെ മുന്നറിയിപ്പിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἐγὼ Παῦλος
  choice: പൗലോസായ ഞാൻ
  rationale: പ്രകടമായ സർവനാമവും പേരും ഒരുമിച്ച് നിലനിർത്തി പൗലോസിന്റെ ആത്മപരിചയവും ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: നിങ്ങളോടു പറയുന്നു
  rationale: മൂലത്തിലെ നേരിട്ടുള്ള പ്രസ്താവന ലളിതമായും അടുത്തായും പകർന്നു നൽകുന്നു.
- source_word: ἐὰν περιτέμνησθε
  choice: നിങ്ങൾ പരിച്ഛേദനം ഏൽക്കുന്നുവെങ്കിൽ
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ സുബ്ജങ്ക്റ്റീവിന്റെ, ആ കർമത്തിനു വിധേയരാകുക എന്ന ആശയം സംരക്ഷിക്കുന്നു; അതിനെ വൈദ്യപരമോ വംശീയമോ ആയ എല്ലാ പരിച്ഛേദനത്തെയും കുറിച്ചുള്ള പൊതുവിധിയായി വികസിപ്പിക്കുന്നില്ല.
- source_word: Χριστὸς
  choice: മശീഹാ
  rationale: ഇവിടെ Χριστός യേശുവിന്റെ അഭിഷിക്തനായുള്ള പദവിയെ സൂചിപ്പിക്കുന്നതിനാൽ പേരുപോലുള്ള ‘ക്രിസ്തു’ എന്നതിനെക്കാൾ പദവിയുടെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: οὐδὲν ὠφελήσει
  choice: നിങ്ങൾക്ക് ഒട്ടും പ്രയോജനപ്പെടുകയില്ല
  rationale: ഭാവികാലത്തിൽ പറയുന്ന പ്രയോജനത്തിന്റെ സമ്പൂർണ അഭാവം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ പദവിയുടെ അർഥം സജീവമാണ്; അതിനാൽ ‘അഭിഷിക്തൻ’ എന്ന ആശയം വഹിക്കുന്ന ‘മശീഹാ’ ഉപയോഗിച്ചു.
- issue: പരിച്ഛേദനത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ മുന്നറിയിപ്പിന്റെ വ്യാപ്തി
  choice: നീതീകരണത്തിനായുള്ള നിയമബാധ്യതയായി പരിച്ഛേദനം ഏറ്റെടുക്കുന്നതിനെക്കുറിച്ചുള്ള സന്ദർഭം പരിഭാഷയിൽ അതിരുകടന്ന് വിശദീകരിക്കാതെ വാക്യത്തിന്റെ നേരിട്ടുള്ള മുന്നറിയിപ്പ് നിലനിർത്തുന്നു.
  alternative: എല്ലാ സാഹചര്യങ്ങളിലുമുള്ള പരിച്ഛേദനത്തെ സമഗ്രമായി അപലപിക്കുന്നതായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗലാത്യലേഖനത്തിലെ സമീപസന്ദർഭം നിയമാനുഷ്ഠാനവും നീതീകരണവും സംബന്ധിച്ചതാണ്. മൂലവാക്യത്തേക്കാൾ വിശാലമായ ഒരു നിരോധനം പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്യാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശ്രദ്ധിക്കുക’ മുന്നറിയിപ്പിന്റെ ഊന്നൽ നൽകുന്നു; ‘പൗലോസായ ഞാൻ’ മൂലത്തിലെ സ്വയംപരിചയത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു. വാക്യത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
