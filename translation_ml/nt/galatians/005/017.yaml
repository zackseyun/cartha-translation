id: GAL.5.17
reference: Galatians 5:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: ml
  text: എന്തെന്നാൽ, ജഡം ആത്മാവിന് എതിരായതിനെ ആഗ്രഹിക്കുന്നു; ആത്മാവോ ജഡത്തിന് എതിരായതിനെ ആഗ്രഹിക്കുന്നു. കാരണം, ഇവ പരസ്പരം എതിർത്തുനിൽക്കുന്നു; അങ്ങനെ നിങ്ങൾ ആഗ്രഹിക്കുന്നതു ചെയ്യാതിരിക്കേണ്ടവിധം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὰρξ
  choice: ജഡം
  rationale: പൗലോസിന്റെ രൂപകാത്മക പദപ്രയോഗം നിലനിർത്താനും അതിനെ ‘പാപസ്വഭാവം’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കാനും ‘ജഡം’ സ്വീകരിച്ചു. ഇവിടെ അർഥം വെറും ഭൗതിക ശരീരത്തേക്കാൾ വിശാലമായ ധാർമ്മിക പ്രവണതയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπιθυμεῖ
  choice: മോഹിക്കുന്നു
  rationale: ശക്തമായ ആഗ്രഹത്തെ സൂചിപ്പിക്കുന്നതും സന്ദർഭത്തിൽ സ്വാഭാവികവുമായ പ്രയോഗം. എതിർദിശ κατά എന്ന ഘടനയിലൂടെ പ്രകടമാകുന്നു.
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: ആത്മാവിന് എതിരായതു / ജഡത്തിന് എതിരായതും
  rationale: κατά + genitive-ന്റെ എതിർപ്പിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന നൽകുന്നു.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: ഗലാത്യർ 5-ന്റെ സമീപസന്ദർഭം പരിശുദ്ധാത്മാവിനെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ആദരസൂചക വലിയക്ഷരവ്യത്യാസമില്ലാത്തതിനാൽ പദം തന്നെ genuine ambiguity ഭാഗികമായി നിലനിർത്തുന്നു.
- source_word: ἀλλήλοις ἀντίκειται
  choice: പരസ്പരം എതിർത്തുനിൽക്കുന്നു
  rationale: രണ്ടിന്റെയും പരസ്പരവിരോധം സംക്ഷിപ്തമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα μὴ
  choice: അതുകൊണ്ട് ... കഴിയുന്നില്ല
  rationale: ഇവിടെ ഉദ്ദേശ്യം അല്ലെങ്കിൽ ഫലം എന്ന രണ്ടുനിറവും സാധ്യമാണ്. മലയാളത്തിൽ ഈ വൈരുദ്ധ്യത്തിന്റെ പ്രായോഗിക ഫലം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ഈ ഘടന സ്വീകരിച്ചു.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: നിങ്ങൾ ആഗ്രഹിക്കുന്ന കാര്യങ്ങൾ ചെയ്യാൻ നിങ്ങൾക്കു കഴിയുന്നില്ല
  rationale: അനിശ്ചിത സാപേക്ഷഘടനയുടെ അർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ποιέω-യ്ക്ക് ലളിതമായ ‘ചെയ്യുക’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ധാർമ്മിക സന്ദർഭത്തിലെ σάρξ എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ജഡം’ നിലനിർത്തി.
  alternative: പാപസ്വഭാവം
  rationale: ‘ജഡം’ പൗലോസിന്റെ രൂപകവും ദൈവശാസ്ത്രപരമായ പദസമ്പത്തും സംരക്ഷിക്കുന്നു. ‘പാപസ്വഭാവം’ സന്ദർഭപരമായ വിശദീകരണമാകാമെങ്കിലും അർഥത്തെ ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാം.
- issue: πνεῦμα എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: സമീപസന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവ് എന്നായി ഗ്രഹിച്ചു ‘ആത്മാവ്’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: മനുഷ്യാത്മാവ്
  rationale: ഗലാത്യർ 5-ൽ ആത്മാവിനാൽ നടക്കുന്നതും ജഡത്തിന്റെ പ്രവൃത്തികളും തമ്മിലുള്ള ആവർത്തിച്ചുള്ള വൈരുദ്ധ്യം പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു. എങ്കിലും മലയാളരൂപം മനുഷ്യാത്മാവ് എന്ന കുറവ് സാധ്യതയുള്ള വായനയെ പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- issue: ἵνα μὴ ഘടനയിലെ ഉദ്ദേശ്യം/ഫലം
  choice: വിരോധത്തിന്റെ ഫലമായി ആഗ്രഹിക്കുന്നതു ചെയ്യാൻ കഴിയാത്ത സ്ഥിതി എന്നു അവതരിപ്പിച്ചു.
  alternative: ‘ചെയ്യാതിരിക്കേണ്ടതിന്’ എന്ന കർശനമായ ഉദ്ദേശ്യവായന
  rationale: ἵνα ഫലമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ പരസ്പരവിരോധത്തിന്റെ പ്രായോഗിക ഫലം സ്വാഭാവികമാണ്; എങ്കിലും ദൈവിക ഉദ്ദേശ്യത്തിന്റെ സാധ്യത പൂർണമായി നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ജഡം’ എന്ന ബൈബിൾപരമായ പദം ഉദ്ദേശപൂർവം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം സ്വാഭാവികമാക്കി.
