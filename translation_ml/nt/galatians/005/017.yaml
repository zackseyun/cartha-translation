revisions:
- from: എന്തെന്നാൽ, ജഡം ആത്മാവിന് എതിരായതു മോഹിക്കുന്നു; ആത്മാവോ ജഡത്തിന് എതിരായതും. ഇവ പരസ്പരം എതിർത്തുനിൽക്കുന്നു[a]. അതുകൊണ്ട്, നിങ്ങൾ ആഗ്രഹിക്കുന്ന കാര്യങ്ങൾ ചെയ്യാൻ നിങ്ങൾക്കു കഴിയുന്നില്ല.
  to: എന്തെന്നാൽ, ജഡം ആത്മാവിന് എതിരായതിനെ ആഗ്രഹിക്കുന്നു; ആത്മാവോ ജഡത്തിന് എതിരായതിനെ ആഗ്രഹിക്കുന്നു. കാരണം, ഇവ പരസ്പരം എതിർത്തുനിൽക്കുന്നു; അങ്ങനെ നിങ്ങൾ ആഗ്രഹിക്കുന്നതു ചെയ്യാതിരിക്കേണ്ടവിധം.
  rationale: The revision translates both occurrences of γάρ, makes the paired desires fully explicit in idiomatic Malayalam, and renders ἵνα μή with ‘ചെയ്യാതിരിക്കേണ്ടവിധം,’ which can convey the Greek purpose/result force without turning it into a categorical statement of inability. The established renderings ‘ജഡം’ and ‘ആത്മാവ്’ and the Spirit-reference footnote are retained.
