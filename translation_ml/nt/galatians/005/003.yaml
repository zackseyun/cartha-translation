  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: ml
  text: 'പരിച്ഛേദനം ഏൽക്കുന്ന ഓരോ മനുഷ്യനോടും[a][b] ഞാൻ വീണ്ടും സാക്ഷ്യപ്പെടുത്തുന്നു: അവൻ ന്യായപ്രമാണം മുഴുവനും പാലിക്കാൻ ബാധ്യസ്ഥനാണ്[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഓരോ വ്യക്തിയോടും.’ ഗ്രീക്കിൽ ‘ഓരോ മനുഷ്യനോടും’ എന്നാണെങ്കിലും, അത് പൊതുവായ പ്രതിനിധാനാർഥത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘പരിച്ഛേദിതനാകുന്ന’ അല്ലെങ്കിൽ ‘തന്നെത്തന്നെ പരിച്ഛേദനത്തിന് വിധേയനാക്കുന്ന.’ ഈ തർക്കസന്ദർഭത്തിൽ പരിച്ഛേദനം സ്വീകരിക്കുന്ന ഒരാളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് തോന്നുന്നു.
    reason: alternative_reading
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘കടക്കാരനാണ്’; അതായത്, ന്യായപ്രമാണം മുഴുവനും പാലിക്കാൻ അവൻ ബാധ്യസ്ഥനാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: സാക്ഷ്യപ്പെടുത്തി പറയുന്നു
  rationale: വ്യക്തിപരവും ഗൗരവമുള്ളതുമായ ഉറപ്പിച്ചുപറച്ചിലിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ സാക്ഷ്യഭാവം നിലനിർത്തുന്നു; വെറും ‘മുന്നറിയിപ്പു നൽകുന്നു’ എന്നതിനെക്കാൾ വ്യാഖ്യാനം കുറവാണ്.
- source_word: δὲ
  choice: വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു; പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മുൻവാക്യത്തോടുള്ള മൃദുവായ തുടർച്ചയാണ്. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ ആ ബന്ധം വ്യക്തമാണ്.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനവും പുതുക്കിയ ഊന്നലും നേരിട്ട് അറിയിക്കുന്നു.
- source_word: παντὶ ἀνθρώπῳ
  choice: ഓരോ മനുഷ്യനോടും
  rationale: ഗ്രീക്കിലെ ഏകവചന-വിതരണരൂപവും പൊതുവായ പ്രതിനിധാനാർഥവും നിലനിർത്തുന്നു.
- source_word: περιτεμνομένῳ
  choice: പരിച്ഛേദനം ഏൽക്കുന്ന
  rationale: ഈ തർക്കസന്ദർഭത്തിൽ പരിച്ഛേദനത്തിന് വിധേയനാകുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ജനനംമുതൽ പരിച്ഛേദിതനായ ഏവരെയും നിർബന്ധമായി ഉൾപ്പെടുത്തുന്ന തരത്തിൽ അർഥം അതിവിപുലീകരിക്കുന്നില്ല.
- source_word: ὀφειλέτης
  choice: കടപ്പെട്ടവനാണ്
  rationale: മൂലത്തിലെ ‘കടക്കാരൻ/ബാധ്യതയുള്ളവൻ’ എന്ന നാമരൂപത്തിന്റെ ശക്തി കാത്തുസൂക്ഷിക്കുന്നു; ഇവിടെ സാമ്പത്തിക കടമല്ല, നിർബന്ധിത ബാധ്യതയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ὅλον τὸν νόμον
  choice: ന്യായപ്രമാണം മുഴുവനും
  rationale: νόμος എന്നതിന്റെ പൗലോസീയ മത-നിയമപരമായ അർഥവും ὅλον നൽകുന്ന സമ്പൂർണതയുടെ ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: ποιῆσαι
  choice: അനുഷ്ഠിക്കാൻ
  rationale: ന്യായപ്രമാണത്തോടൊപ്പം ഉപയോഗിക്കുമ്പോൾ ‘ചെയ്യുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമായി അതു പാലിച്ചുനടക്കേണ്ടതിനെ അറിയിക്കുന്നു.
theological_decisions:
- issue: പരിച്ഛേദനവും ന്യായപ്രമാണം മുഴുവനോടുമുള്ള ബാധ്യതയും തമ്മിലുള്ള ബന്ധം
  choice: ഗലാത്യ തർക്കത്തിൽ പരിച്ഛേദനം ഏൽക്കുന്ന വ്യക്തി ന്യായപ്രമാണം മുഴുവനും അനുഷ്ഠിക്കാനുള്ള ബാധ്യത ഏറ്റെടുക്കുന്നു എന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ശൈശവത്തിൽ പരിച്ഛേദിതരായ യഹൂദന്മാർ ഉൾപ്പെടെ പരിച്ഛേദിതനായ ഏതൊരു പുരുഷനെയും പൊതുവായി ഉദ്ദേശിക്കുന്നു എന്ന വായന.
  rationale: περιτεμνομένῳ എന്ന വർത്തമാനകാല പങ്കാളിത്തരൂപവും 5:2-ലെ ഉടൻമുമ്പുള്ള സന്ദർഭവും പരിച്ഛേദനം മതപരമായ ആവശ്യമായി സ്വീകരിക്കാൻ പോകുന്നവരിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. എന്നാൽ ഉദ്ദേശ്യം മുഖ്യവാചകത്തിൽ തുറന്നുചേർക്കാതെ മൂലത്തിലെ പരിധി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘ന്യായപ്രമാണം’ പൗലോസിന്റെ νόμος എന്ന മത-നിയമപരമായ ആശയം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘അനുഷ്ഠിക്കുക’ അതിനോടൊപ്പം സ്വാഭാവികമാണ്. അർഥവ്യത്യാസങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
