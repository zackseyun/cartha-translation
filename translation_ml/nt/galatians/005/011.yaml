  source_fidelity: മൂലത്തിലെ വിരുദ്ധതാസൂചകം (δέ), സംബോധനരൂപം, ‘ഇപ്പോഴും’ എന്ന ഇരട്ട പ്രയോഗം, വ്യവസ്ഥാപരമായ വാദം, പീഡിപ്പിക്കപ്പെടുന്നു എന്ന കർമണിപ്രയോഗം, നിഗമനസൂചകം (ἄρα), പൂർണ്ണകാല ഫലാവസ്ഥ (κατήργηται) എന്നിവ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു. ‘ക്രൂശിന്റെ ഇടർച്ച’ σκάνδαλον τοῦ σταυροῦ എന്ന പ്രയോഗത്തിന്റെ രൂപകാത്മകവും തുറന്നതുമായ സ്വഭാവം സൂക്ഷിക്കുന്നു.
