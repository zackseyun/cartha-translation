id: GAL.5.11
reference: Galatians 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: ml
  text: എന്നാൽ സഹോദരന്മാരേ,[a] ഞാൻ ഇപ്പോഴും പരിച്ഛേദനം പ്രസംഗിക്കുന്നുവെങ്കിൽ, പിന്നെ എന്തുകൊണ്ടാണ് ഞാൻ ഇപ്പോഴും പീഡിപ്പിക്കപ്പെടുന്നത്? അങ്ങനെയെങ്കിൽ ക്രൂശിന്റെ ഇടർച്ച[b] നീക്കപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഹോദരീസഹോദരന്മാരേ”; ഗ്രീക്കിലെ “സഹോദരന്മാർ” എന്ന പദം സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട ഒരു സമൂഹത്തെ അഭിസംബോധന ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ക്രൂശ് ഉളവാക്കുന്ന എതിർപ്പ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷലിംഗ ബഹുവചന സംബോധനയെ നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്ത്രീകളും ഉൾപ്പെടുന്ന സമ്മിശ്രസമൂഹത്തെ അഭിസംബോധന ചെയ്യാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: περιτομήν
  choice: പരിച്ഛേദനം
  rationale: യഹൂദ ആചാരത്തെയും ഗലാത്യലേഖനത്തിലെ നിയമാനുഷ്ഠാനപരമായ ആവശ്യത്തെയും സൂചിപ്പിക്കുന്ന സ്ഥിരവും നേരിട്ടുമായ മലയാള പദം.
- source_word: ἔτι
  choice: ഇപ്പോഴും
  rationale: രണ്ടിടത്തുമുള്ള കാലസൂചനയും പൗലോസിന്റെ വാദത്തിലെ സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: κηρύσσω
  choice: പ്രസംഗിക്കുന്നുവെങ്കിൽ
  rationale: പരസ്യമായി പ്രഖ്യാപിക്കുക എന്ന വർത്തമാനകാല ക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: διώκομαι
  choice: പീഡിപ്പിക്കപ്പെടുന്നത്
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗവും സുവിശേഷം നിമിത്തമുള്ള ശത്രുതാപരമായ ഉപദ്രവവും വ്യക്തമാക്കുന്നു.
- source_word: ἄρα
  choice: അങ്ങനെയെങ്കിൽ
  rationale: മുൻപത്തെ സങ്കൽപ്പവാക്യത്തിൽനിന്ന് വരുന്ന നിഗമനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: κατήργηται
  choice: നീക്കപ്പെട്ടിരിക്കുന്നു
  rationale: 'പൂർണ്ണകാല കർമണിരൂപത്തിന്റെ ഫലാവസ്ഥ നിലനിർത്തുന്നു: ഇടർച്ച പ്രവർത്തനരഹിതമാക്കപ്പെട്ട നില.'
- source_word: σκάνδαλον
  choice: ഇടർച്ച
  rationale: തടസ്സമോ വീഴ്ചയ്ക്കുള്ള കാരണമോ എന്ന രൂപകാർഥവും നിരസനം ഉളവാക്കുന്ന സ്വഭാവവും സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു; മറ്റൊരു സാധുവായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: σταυροῦ
  choice: ക്രൂശിന്റെ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ σταυρός എന്ന പദത്തിന് നിലവിലുള്ള നേരിട്ടുള്ള മലയാള സമാനം.
theological_decisions:
- issue: സമ്മിശ്രസമൂഹത്തോടുള്ള ἀδελφοί എന്ന സംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലത്തിലെ പുരുഷലിംഗരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും അതിന്റെ ഉൾക്കൊള്ളുന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- issue: σκάνδαλον τοῦ σταυροῦ എന്നതിന്റെ അർഥം
  choice: ക്രൂശിന്റെ ഇടർച്ച
  alternative: ക്രൂശ് ഉളവാക്കുന്ന എതിർപ്പ്
  rationale: ക്രൂശ് മനുഷ്യരെ ഇടറിക്കുകയും നിരസനത്തിന് കാരണമാകുകയും ചെയ്യുന്നു എന്ന യഥാർഥ രൂപകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ ശൈലി. മൂലവാക്യത്തിലെ വ്യവസ്ഥ, ആവർത്തനം, ചോദ്യം, നിഗമനം എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
