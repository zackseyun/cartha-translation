id: GAL.5.24
reference: Galatians 5:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ τοῦ ⸀Χριστοῦ τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: ml
  text: മശീഹായുടേതായവർ ജഡത്തെ അതിന്റെ വികാരങ്ങളോടും മോഹങ്ങളോടുംകൂടെ ക്രൂശിച്ചിരിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവിന്റേതായവർ.”
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ “ജഡം” എന്നത് ആത്മാവിനെ എതിർക്കുന്ന പതിത മനുഷ്യസ്വഭാവത്തെ സൂചിപ്പിക്കുന്നു; ചില പരിഭാഷകൾ “പാപസ്വഭാവം” എന്നു നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... τοῦ Χριστοῦ
  choice: മശീഹായ്ക്കുള്ളവർ
  rationale: ജനങ്ങൾ മശീഹായുടേതാണെന്നും അവനോടു ചേർന്നവരാണെന്നും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സംബന്ധപ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകർന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ മുൻവാക്യത്തിൽനിന്നുള്ള മൃദുവായ വ്യത്യാസമോ തുടർച്ചയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ ചേർത്താൽ വൈരുധ്യം അമിതമാകും.
- source_word: σάρκα
  choice: ജഡത്തെ
  rationale: ആത്മാവിനെ എതിർക്കുന്ന മനുഷ്യന്റെ വീണ സ്വഭാവത്തെ ഇവിടെ രൂപകമായി സൂചിപ്പിച്ചാലും, പൗലോസിന്റെ σάρξ എന്ന ദൈവശാസ്ത്രപരമായ പദവും അതിലെ സംഘർഷവും നിലനിർത്താൻ ‘ജഡം’ ഉപയോഗിച്ചു.
- source_word: ἐσταύρωσαν
  choice: ക്രൂശിച്ചിരിക്കുന്നു
  rationale: ക്രൂശിനെ വ്യക്തമായി അനുസ്മരിപ്പിക്കുന്ന ക്രിയയെ ദുർബലപ്പെടുത്താതെ നിലനിർത്തുന്നു; ഗ്രീക്ക് aorist സൂചിപ്പിക്കുന്ന നിർണായകമായ പ്രവൃത്തിയെയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയെയും മലയാളത്തിലെ പൂർണ്ണക്രിയ വ്യക്തമാക്കുന്നു.
- source_word: σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις
  choice: അതിന്റെ വികാരങ്ങളോടും മോഹങ്ങളോടുംകൂടെ
  rationale: σύν-ന്റെ സഹവർത്തിത്വം ‘-ഓടുംകൂടെ’ കൊണ്ടും, ഈ ധാർമ്മിക സന്ദർഭത്തിലെ παθήματα-യെ ‘വികാരങ്ങൾ’ എന്നും ἐπιθυμίαι-യെ ശക്തമായ തെറ്റായ ആഗ്രഹങ്ങൾ സൂചിപ്പിക്കുന്ന ‘മോഹങ്ങൾ’ എന്നും പകർന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ അഭിഷിക്തസ്ഥാനപ്പേരായി വായിക്കാവുന്നതിനാൽ ‘മശീഹാ’ മുഖ്യപാഠത്തിൽ നൽകി; പേരുപോലുള്ള പരമ്പരാഗത വായനയായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: പൗലോസിന്റെ ധാർമ്മിക വിരോധത്തിൽ σάρξ
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: ‘പാപസ്വഭാവം’ അർത്ഥം വിശദീകരിക്കുന്നുവെങ്കിലും രൂപകത്തെ നിർവചിച്ച് തീർക്കും. ‘ജഡം’ പൗലോസിന്റെ പദപ്രയോഗവും ആത്മാവുമായുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മശീഹായ്ക്കുള്ളവർ’ ബന്ധവും ഉടമസ്ഥതയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ജഡം’, ‘ക്രൂശിക്കുക’ എന്നീ ഉറവിടത്തിലെ ശക്തമായ ദൈവശാസ്ത്രരൂപങ്ങൾ വ്യാഖ്യാനിച്ച് ലഘൂകരിച്ചിട്ടില്ല.
