id: GAL.5.15
reference: Galatians 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ പരസ്പരം കടിക്കുകയും വിഴുങ്ങുകയും ചെയ്യുന്നെങ്കിൽ, നിങ്ങൾ പരസ്പരം വിഴുങ്ങി നശിച്ചുപോകാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ പരസ്പരം തിന്നുതീർക്കപ്പെടാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.”
    reason: ἀναλωθῆτε എന്ന ക്രിയയുടെ ‘തിന്നുതീർക്കപ്പെടുക/വിഴുങ്ങിക്കളയപ്പെടുക’ എന്ന കൂടുതൽ നേരിട്ടുള്ള ദൃശ്യബിംബം നിലനിർത്തുന്ന പരിഭാഷ.
lexical_decisions:
- source_word: εἰ δὲ
  choice: എന്നാൽ ... ചെയ്യുന്നെങ്കിൽ
  rationale: εἰ നിബന്ധനയും δέ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യവും സൂചിപ്പിക്കുന്നു; ഈ മലയാളഘടന രണ്ടും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: സമൂഹത്തിനുള്ളിലെ അന്യോന്യപ്രവർത്തനമാണ് reciprocal pronoun സൂചിപ്പിക്കുന്നത്; ‘പരസ്പരം’ അതിനെ സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: δάκνετε
  choice: കടിക്കുകയും
  rationale: ക്രിയയുടെ അക്ഷരാർഥമായ മൃഗീയ ദൃശ്യബിംബം നിലനിർത്തുന്നു; വർത്തമാനകാലം തുടരുന്നതോ സ്വഭാവമായതോ ആയ പ്രവൃത്തിയെയും അനുവദിക്കുന്നു.
- source_word: κατεσθίετε
  choice: വിഴുങ്ങുകയും
  rationale: സാധാരണ ഭക്ഷിക്കുന്നതിനെക്കാൾ തീവ്രമായ ‘തിന്നുകളയുക/devour’ എന്ന അർഥവും കടിക്കുന്നതോടൊപ്പമുള്ള ഹിംസാത്മക ദൃശ്യവും നൽകുന്നു.
- source_word: βλέπετε
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: ഇവിടെ ഇത് ജാഗ്രത ആവശ്യപ്പെടുന്ന ആജ്ഞയാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മുന്നറിയിപ്പാണിത്.
- source_word: μὴ
  choice: -ാതിരിക്കാൻ
  rationale: subjunctive-നോടുകൂടിയ μή സാധ്യതയുള്ള പ്രതികൂലഫലത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പാണ്; മലയാളത്തിൽ ഉദ്ദേശ്യ/പ്രതിരോധ രൂപം അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὑπ’ ἀλλήλων
  choice: പരസ്പരം
  rationale: ഗ്രീക്കിലെ passive agent-ന്റെ അന്യോന്യത മലയാളത്തിൽ സന്ദർഭസഹജമായി നൽകുന്നു; ഓരോരുത്തരും മറ്റുള്ളവരുടെ നാശത്തിന് കാരണമാകുന്ന പരിഹാസാത്മകമായ ആശയം നിലനിൽക്കുന്നു.
- source_word: ἀναλωθῆτε
  choice: നശിപ്പിക്കപ്പെടാതിരിക്കാൻ
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയയുടെ ഫലം പൂർണമായ നാശമാണ്. പ്രധാനവാചകത്തിൽ സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചുകൊണ്ട് passive force നിലനിർത്തുന്നു; ‘തിന്നുതീർക്കപ്പെടുക’ എന്ന ദൃശ്യപരമായ പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: വിശ്വാസസമൂഹത്തിനുള്ളിലെ രൂപകാലങ്കാരപരമായ ഹിംസ
  choice: ‘കടിക്കുക,’ ‘വിഴുങ്ങുക’ എന്നീ മൃഗീയ ദൃശ്യങ്ങൾ അക്ഷരാർഥത്തിൽ നിലനിർത്തി, അന്തിമഫലം ‘നശിപ്പിക്കപ്പെടുക’ എന്ന് നൽകി.
  alternative: ‘നിങ്ങൾ പരസ്പരം ഉപദ്രവിക്കുകയും നശിപ്പിക്കുകയും ചെയ്യുന്നെങ്കിൽ’ എന്ന മൃദൂകരിച്ച വ്യാഖ്യാനപരമായ രൂപം.
  rationale: പൗലോസിന്റെ ഭാഷ ഉദ്ദേശപൂർവം ശക്തവും അടിയന്തരവുമാണ്. ദൃശ്യബിംബം മൃദൂകരിക്കുന്നത് സമൂഹത്തിന്റെ സ്വയംനാശത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിന്റെ പ്രഹരശേഷി കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘പരസ്പരം’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ഇരട്ട reciprocal പ്രയോഗവും സമൂഹത്തിന്റെ അന്യോന്യ സ്വയംനാശവും ഊന്നിപ്പറയുന്നതിനാൽ നിലനിർത്തി.
