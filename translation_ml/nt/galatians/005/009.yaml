id: GAL.5.9
reference: Galatians 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/009.yaml
  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: ml
  text: അല്പം പുളിമാവ് മാവിന്റെ പിണ്ഡം മുഴുവൻ പുളിപ്പിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുറച്ച് യീസ്റ്റ് മാവിന്റെ പിണ്ഡം മുഴുവൻ പുളിപ്പിക്കുന്നു.”
    reason: ζύμηയ്ക്കുള്ള ആധുനിക പദവികല്പമായ “യീസ്റ്റ്” നൽകുന്നു; “മാവിന്റെ പിണ്ഡം” φύραമയുടെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: μικρὰ
  choice: അല്പം
  rationale: ζύμηയുടെ ചെറിയ അളവിനെയാണ് സൂചിപ്പിക്കുന്നത്; പഴഞ്ചൊല്ലിന്റെ ചുരുക്കവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: ζύμη
  choice: പുളിമാവ്
  rationale: മാവിനെ പുളിപ്പിക്കുന്ന വസ്തുവെന്ന പുരാതന അർഥവും വേദപുസ്തകത്തിലെ രൂപകപ്രതിധ്വനിയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദമാണ്.
- source_word: ὅλον
  choice: മുഴുവൻ
  rationale: പുളിമാവിന്റെ ഫലം മാവുകുഴച്ചതിന്റെ സമഗ്രതയിലേക്കും വ്യാപിക്കുന്നു എന്ന ഊന്നൽ വ്യക്തമായി നൽകുന്നു.
- source_word: φύραμα
  choice: മാവുകുഴച്ചത്
  rationale: കുഴച്ചൊരുക്കിയ മാവിന്റെ പിണ്ഡം എന്ന മൂർത്തമായ ദൃശ്യം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ζυμοῖ
  choice: പുളിപ്പിക്കുന്നു
  rationale: കാരകപ്രയോഗത്തിന്റെ അർഥം നേരിട്ട് നൽകുകയും പഴഞ്ചൊല്ലിന്റെ സജീവവും സംക്ഷിപ്തവുമായ രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പഴഞ്ചൊല്ലിന്റെ രൂപകശക്തി
  choice: പുളിമാവിന്റെയും മാവുകുഴച്ചതിന്റെയും മൂർത്തമായ ചിത്രം വ്യാഖ്യാനിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: അല്പം തെറ്റായ ഉപദേശം സമൂഹത്തെ മുഴുവൻ ദുഷിപ്പിക്കുന്നു.
  rationale: സന്ദർഭത്തിൽ ഇത് ദോഷകരമായ സ്വാധീനത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പാണെങ്കിലും വാക്യം തന്നെ അതിന്റെ പ്രയോഗം വിശദീകരിക്കാതെ പഴഞ്ചൊല്ല് പ്രസ്താവിക്കുന്നു; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവും ചുരുക്കമുള്ളതുമായ പഴഞ്ചൊൽശൈലി സ്വീകരിച്ചു. ‘പുളിമാവ്’ എന്ന വേദപുസ്തകപരമായി പരിചിതമായ പദം നിലനിർത്തിയപ്പോൾ ‘മാവുകുഴച്ചത്’ എന്ന പ്രയോഗം പുരാതന ദൃശ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
