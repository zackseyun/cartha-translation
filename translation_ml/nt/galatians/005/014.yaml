id: GAL.5.14
reference: Galatians 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ന്യായപ്രമാണം മുഴുവനും ഒരൊറ്റ പ്രസ്താവനയിൽ നിറവേറ്റപ്പെട്ടിരിക്കുന്നു: “നിന്റെ അയൽക്കാരനെ നിന്നെപ്പോലെ സ്നേഹിക്കണം.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഒരൊറ്റ വചനത്തിൽ.” ഗ്രീക്കിലെ λόγος ഇവിടെ ഒരു പദത്തെ മാത്രമല്ല, ഒരൊറ്റ വചനത്തെയോ കല്പനയെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “നിവൃത്തിയായിരിക്കുന്നു”; വ്യാഖ്യാനപരമായി, “സംക്ഷേപിക്കപ്പെട്ടിരിക്കുന്നു.” ഗ്രീക്ക് ക്രിയയുടെ കൂടുതൽ നേരിട്ടുള്ള അർഥം “നിറവേറ്റപ്പെട്ടിരിക്കുന്നു” എന്നാണ്; ഈ കല്പനയിൽ ന്യായപ്രമാണത്തിന്റെ ഉദ്ദേശ്യം പൂർണതയിലെത്തുന്നു എന്ന ആശയവും അതിൽ ഉൾപ്പെടാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: കാരണം
  rationale: γάρ മുൻവാക്യത്തിലെ പ്രബോധനത്തിന് വിശദീകരണമോ അടിസ്ഥാനമോ നൽകുന്നു; ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πᾶς νόμος
  choice: ന്യായപ്രമാണം മുഴുവനും
  rationale: ഏകവചനത്തിലുള്ള νόμος-നെയും πᾶς നൽകുന്ന സമഗ്രതയെയും സംരക്ഷിക്കുന്നു.
- source_word: ἐν ἑνὶ λόγῳ
  choice: ഒരൊറ്റ പ്രസ്താവനയിൽ
  rationale: λόγος ഇവിടെ ഒരു പദമെന്നതിലുപരി ഉദ്ധരിക്കപ്പെടുന്ന വചനത്തെയോ കല്പനയെയോ സൂചിപ്പിക്കുന്നു; ‘പ്രസ്താവന’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: πεπλήρωται
  choice: നിവൃത്തിയാകുന്നു
  rationale: പൂർണതയിലേക്കെത്തുക, നിറവേറുക എന്ന πληρόω-യുടെ ശക്തി നിലനിർത്തുന്നു; വെറും ‘സംക്ഷേപിക്കപ്പെടുന്നു’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: Ἀγαπήσεις
  choice: സ്നേഹിക്കണം
  rationale: ലേവ്യപുസ്തകം 19:18-ൽനിന്നുള്ള ഭാവികാലരൂപത്തിലുള്ള കല്പനയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ കല്പനയായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸν πλησίον σου
  choice: നിന്റെ അയൽക്കാരനെ
  rationale: ഈ ധാർമികസന്ദർഭത്തിൽ πλησίον എന്നതിന് പതിവും കൃത്യവുമായ മലയാളസമാനപദം.
- source_word: ὡς σεαυτόν
  choice: നിന്നെപ്പോലെതന്നെ
  rationale: താരതമ്യത്തിന്റെ പൂർണബലം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സ്നേഹകല്പനയോടുള്ള ന്യായപ്രമാണത്തിന്റെ ബന്ധം
  choice: ന്യായപ്രമാണം മുഴുവനും ഈ സ്നേഹകല്പനയിൽ നിവൃത്തിയാകുന്നു
  alternative: ന്യായപ്രമാണം ഈ കല്പനയിൽ സംക്ഷേപിക്കപ്പെടുന്നു
  rationale: πληρόω സാധാരണയായി ‘നിവൃത്തിയാകുക/നിറവേറുക’ എന്ന ശക്തമായ ആശയം നൽകുന്നു. അതിനാൽ വെറും സംഗ്രഹമെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ സ്വീകരിക്കാതെ, സാധ്യതയായി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു. νόμος-നെ ധാർമികഭാഗങ്ങളിൽ മാത്രമായി പരിമിതപ്പെടുത്തുകയും ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. തിരുവെഴുത്തുപരമായ νόμος എന്ന ആശയത്തിന് ‘ന്യായപ്രമാണം’ നിലനിർത്തി; ഉദ്ധരണിയിലെ കല്പന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘സ്നേഹിക്കണം’ എന്ന രൂപത്തിൽ നൽകി.
