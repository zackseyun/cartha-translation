id: GAL.5.18
reference: Galatians 5:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: ml
  text: എന്നാൽ ആത്മാവിനാൽ നയിക്കപ്പെടുന്നുവെങ്കിൽ[a], നിങ്ങൾ ന്യായപ്രമാണത്തിന് കീഴിലല്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ആത്മാവിനാൽ നയിക്കപ്പെട്ടുകൊണ്ടിരിക്കുകയാണെങ്കിൽ.’'
    reason: വർത്തമാനകാല കർമണി ക്രിയയുടെ തുടരുന്ന സ്വഭാവം കൂടുതൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന പരിഭാഷാമാർഗം.
  - marker: b
    text: ‘ന്യായപ്രമാണത്തിന് കീഴിൽ’ എന്നത് അതിന്റെ അധികാരത്തിനോ ഭരണപരിധിക്കോ വിധേയരായിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഗലാത്യർ 5:23 താരതമ്യം ചെയ്യുക.
    reason: പൗലോസിന്റെ പ്രയോഗത്തിന്റെ അർത്ഥവ്യാപ്തി വ്യക്തമാക്കുകയും ബന്ധപ്പെട്ട വാക്യത്തിലേക്ക് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: εἰ
  choice: എങ്കിൽ / -ഉന്നുവെങ്കിൽ
  rationale: സോപാധിക ഉപവാക്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ക്രിയയോടു ചേർന്ന ‘-ഉന്നുവെങ്കിൽ’ സ്വാഭാവികമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ജഡവും ആത്മാവും തമ്മിലുള്ള സന്ദർഭപരമായ മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: πνεύματι
  choice: ആത്മാവിനാൽ
  rationale: ദത്തിവ് രൂപം ഇവിടെ പ്രവർത്തകമോ മാർഗമോ സൂചിപ്പിക്കുന്നു. ഗലാത്യർ 5:16–25-ലെ ജഡം–ആത്മാവ് വൈരുധ്യത്തിൽ ദൈവാത്മാവാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: ἄγεσθε
  choice: നയിക്കപ്പെടുന്നുവെങ്കിൽ
  rationale: വർത്തമാനകാല കർമണി രൂപത്തിന്റെ അർത്ഥം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി തുടർന്നുകൊണ്ടിരിക്കുന്ന അനുഭവം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἐστὲ
  choice: നിങ്ങൾ ... അല്ല
  rationale: നിഷേധാത്മകമായ നില നേരിട്ട് മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; ബഹുവചന അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: ὑπὸ νόμον
  choice: ന്യായപ്രമാണത്തിന് കീഴിൽ
  rationale: നിയമത്തിന്റെ അധികാരത്തിനോ ഭരണപരിധിക്കോ വിധേയമായ അവസ്ഥ എന്ന പൗലോസിന്റെ പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മോശെയുടെ ന്യായപ്രമാണമാണ് ഉദ്ദേശ്യം.
theological_decisions:
- issue: πνεύματι എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: ദൈവത്തിന്റെ ആത്മാവ്; മുഖ്യവാചകത്തിൽ ‘ആത്മാവ്’
  alternative: മനുഷ്യാത്മാവ്
  rationale: ഗലാത്യർ 5-ലെ ആവർത്തിതമായ ജഡം–ആത്മാവ് വൈരുധ്യം ദൈവാത്മാവിനെ സൂചിപ്പിക്കുന്നു. ‘പരിശുദ്ധാത്മാവ്’ എന്ന് വിപുലീകരിക്കാതെ ‘ആത്മാവ്’ എന്ന രൂപം മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- issue: ὑπὸ νόμον എന്നതിന്റെ അർത്ഥം
  choice: ന്യായപ്രമാണത്തിന്റെ അധികാരത്തിനോ ഭരണപരിധിക്കോ കീഴിലല്ല
  alternative: ഏതൊരു നിയമത്തിനും കീഴിലല്ല
  rationale: ഗലാത്യലേഖനത്തിലെ പൗലോസിന്റെ സന്ദർഭം മോശെയുടെ ന്യായപ്രമാണത്തെ ഒരു ഭരണക്രമമായി സൂചിപ്പിക്കുന്നു; മുഖ്യവാചകം ഈ ആശയം വിശദീകരിച്ച് വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നിയമം’ എന്ന പൊതുപദത്തേക്കാൾ മോശെയുടെ Torah-യെ സന്ദർഭപരമായി തിരിച്ചറിയിക്കുന്ന ‘ന്യായപ്രമാണം’ ഉപയോഗിച്ചു. കർമണി രൂപവും വ്യവസ്ഥാപക ഘടനയും മൂലപാഠത്തോട് അടുത്തുനിൽക്കുന്നു.
