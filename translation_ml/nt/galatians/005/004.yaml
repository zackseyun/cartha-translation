revisions:
- from: ന്യായപ്രമാണത്താൽ നീതീകരിക്കപ്പെടാൻ ശ്രമിക്കുന്ന നിങ്ങളോ മശീഹയിൽനിന്ന് വേർപെട്ടിരിക്കുന്നു[a]; കൃപയിൽനിന്ന് വീണുപോയിരിക്കുന്നു.
