  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατηργήθητε ⸀ἀπὸ Χριστοῦ οἵτινες ἐν νόμῳ δικαιοῦσθε, τῆς χάριτος ἐξεπέσατε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: ml
  text: ന്യായപ്രമാണത്താൽ നീതീകരിക്കപ്പെടാൻ ശ്രമിക്കുന്ന[b] നിങ്ങൾ മശീഹയിൽനിന്ന്[c] വേർപെട്ടിരിക്കുന്നു[a]; കൃപയിൽനിന്ന് വീണുപോയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മശീഹയോട് അന്യരായിരിക്കുന്നു” അല്ലെങ്കിൽ “മശീഹയിൽനിന്ന് ഛേദിക്കപ്പെട്ടിരിക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ന്യായപ്രമാണത്താൽ നീതീകരിക്കപ്പെടുന്ന നിങ്ങൾ.” ഗ്രീക്കിലെ വർത്തമാനകാല കർമണി രൂപം ഇപ്രകാരം കൂടുതൽ ഔപചാരികമായി പരിഭാഷപ്പെടുത്താം; ഇവിടെ പൗലോസിന്റെ വാദസന്ദർഭം പ്രതിഫലിപ്പിക്കാൻ “നീതീകരിക്കപ്പെടാൻ ശ്രമിക്കുന്ന” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ക്രിസ്തുവിൽനിന്ന്.” ഗ്രീക്കിലെ Χριστός സന്ദർഭത്തിൽ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുമ്പോൾ “മശീഹ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηργήθητε
  choice: വേർപെട്ടിരിക്കുന്നു
  rationale: ἀπὸ Χριστοῦ എന്ന പ്രയോഗത്തോടൊപ്പം ഇവിടെ καταργέω എന്ന ക്രിയ മശീഹയുമായുള്ള ബന്ധത്തിൽനിന്നുള്ള വേർപാടിനെ സൂചിപ്പിക്കുന്നു. ‘വേർപെട്ടിരിക്കുന്നു’ എന്നത് അതിന്റെ ശക്തമായ ബന്ധപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അന്തിമത്വം അധികമായി സൂചിപ്പിക്കാവുന്ന ‘ഛേദിക്കപ്പെട്ടിരിക്കുന്നു’ ഒഴിവാക്കി.
- source_word: ἀπὸ Χριστοῦ
  choice: മശീഹയിൽനിന്ന്
  rationale: ἀπό വേർപാടിനെ സൂചിപ്പിക്കുന്നു. Χριστός ഇവിടെ അഭിഷിക്തനായ രക്ഷകന്റെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: οἵτινες
  choice: നിങ്ങളോ
  rationale: ഗലാത്യരിൽ ന്യായപ്രമാണത്താൽ നീതീകരണം തേടുന്ന വിഭാഗത്തെ നേരിട്ട് തിരിച്ചറിയിക്കുന്ന പ്രയോഗം. ‘നിങ്ങളോ’ എന്നത് രണ്ടാംപുരുഷ അഭിസംബോധനയും ഊന്നലും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν νόμῳ
  choice: ന്യായപ്രമാണത്താൽ
  rationale: ഇവിടെ ἐν മാർഗമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. പൗലോസിന്റെ സന്ദർഭത്തിൽ νόμος ദൈവിക ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ പതിവും വ്യക്തവുമായ ‘ന്യായപ്രമാണത്താൽ’ തെരഞ്ഞെടുത്തു.
- source_word: δικαιοῦσθε
  choice: നീതീകരിക്കപ്പെടാൻ ശ്രമിക്കുന്ന
  rationale: വർത്തമാനകാല കർമണി രൂപം ഔപചാരികമായി ‘നീതീകരിക്കപ്പെടുന്ന’ എന്നു നൽകാമെങ്കിലും, യഥാർഥത്തിൽ ന്യായപ്രമാണത്താൽ നീതീകരണം നേടുന്നു എന്ന് പൗലോസ് അംഗീകരിക്കുന്നതായി തോന്നാതിരിക്കാൻ സന്ദർഭത്തിലെ ലക്ഷ്യമോ ശ്രമമോ വ്യക്തമാക്കുന്നു. ഈ വ്യാഖ്യാനഘടകം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
- source_word: τῆς χάριτος
  choice: കൃപയിൽനിന്ന്
  rationale: ἐκπίπτω എന്ന ക്രിയയോടുള്ള ജനിറ്റീവ് വേർപാടിനെ സൂചിപ്പിക്കുന്നു. ‘കൃപയിൽനിന്ന്’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐξεπέσατε
  choice: വീണുപോയിരിക്കുന്നു
  rationale: ക്രിയയിലെ വീഴ്ചയുടെ രൂപകം നിലനിർത്തുകയും അഓറിസ്റ്റ് സൂചിപ്പിക്കുന്ന നിർണായക ഫലം മലയാളത്തിൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഈ വാക്യം രക്ഷ നഷ്ടപ്പെടുന്നതിനെക്കുറിച്ചുള്ള സിദ്ധാന്തവിവാദം തീർപ്പാക്കുന്നവിധം പരിഭാഷപ്പെടുത്തണമോ എന്നത്
  choice: ‘മശീഹയിൽനിന്ന് വേർപെട്ടിരിക്കുന്നു; കൃപയിൽനിന്ന് വീണുപോയിരിക്കുന്നു’ എന്ന ശക്തമായ മുന്നറിയിപ്പ് അതേപടി നിലനിർത്തി.
  alternative: ‘മശീഹയോട് അന്യരായിരിക്കുന്നു’ എന്ന മൃദുവായ ഭാഷയോ ‘കൃപയുടെ മാർഗം ഉപേക്ഷിച്ചിരിക്കുന്നു’ എന്ന വ്യാഖ്യാനപരമായ ഭാഷയോ ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ശക്തമായ ബന്ധപരവും സ്ഥാനപരവുമായ ഭാഷ ഉപയോഗിക്കുന്നു; എന്നാൽ അതിന്റെ വ്യവസ്ഥിത ദൈവശാസ്ത്രപരമായ എല്ലാ പ്രത്യാഘാതങ്ങളും വിശദീകരിക്കുന്നില്ല. അതിനാൽ മുന്നറിയിപ്പിന്റെ കാഠിന്യം കുറയ്ക്കാതെയും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ നിഗമനം ചേർക്കാതെയും പരിഭാഷപ്പെടുത്തി.
- issue: δικαιοῦσθε എന്ന കർമണി രൂപം യഥാർഥമായി നടക്കുന്ന നീതീകരണമെന്നോ ലക്ഷ്യമിടുന്ന നീതീകരണമെന്നോ നൽകുന്നത്
  choice: പൗലോസിന്റെ വാദസന്ദർഭം പ്രകടമാക്കാൻ ‘നീതീകരിക്കപ്പെടാൻ ശ്രമിക്കുന്ന’ എന്നു നൽകി.
  alternative: രൂപപരമായി കൂടുതൽ നേരിട്ട് ‘ന്യായപ്രമാണത്താൽ നീതീകരിക്കപ്പെടുന്ന’ എന്നു നൽകുക.
  rationale: അടുത്തുള്ള പ്രസ്താവനകൾ ന്യായപ്രമാണത്തിന്റെ അടിസ്ഥാനത്തിൽ നീതീകരണം സാധുവാണെന്ന് ഉറപ്പിക്കുന്നില്ല; മറിച്ച് അതിനെ ആശ്രയിക്കുന്നവരെ മുന്നറിയിപ്പു നൽകുന്നു. എങ്കിലും ഗ്രീക്കിന്റെ ഔപചാരിക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പൗലോസിന്റെ വാക്കുകളുടെ കാഠിന്യവും രൂപകങ്ങളും നിലനിർത്തിയിരിക്കുന്നു; വിഭാഗീയ ദൈവശാസ്ത്രനിഗമനങ്ങൾ ചേർത്തിട്ടില്ല.
