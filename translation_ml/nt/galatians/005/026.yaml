revisions:
- from: നാം പൊങ്ങച്ചക്കാരായിത്തീരരുത്; അന്യോന്യം പ്രകോപിപ്പിക്കുകയും അന്യോന്യം അസൂയപ്പെടുകയും ചെയ്യരുത്.[a]
  to: നാം പരസ്പരം പ്രകോപിപ്പിക്കുകയും അസൂയപ്പെടുകയും ചെയ്യുന്ന വ്യർഥമഹത്ത്വബോധമുള്ളവരായിത്തീരരുത്.[a]
  rationale: The revision makes μὴ γινώμεθα κενόδοξοι one coherent Malayalam prohibition (“നാം ... ആയിത്തീരരുത്”) and renders the two nominative participles as coordinated descriptive actions. It does not decide whether these actions are the means, result, or accompanying expression of conceit. The footnote remains anchored to the rendering of κενόδοξοι and supplies the natural alternative “പൊങ്ങച്ചക്കാർ.”
