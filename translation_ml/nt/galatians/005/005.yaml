revisions:
- from: കാരണം നാമാകട്ടെ, ആത്മാവിനാൽ[a] വിശ്വാസത്താൽ[b] നീതിയുടെ[c] പ്രത്യാശയ്ക്കായി ആകാംക്ഷയോടെ കാത്തിരിക്കുന്നു.
  to: കാരണം നാമോ ആത്മാവിനാൽ, വിശ്വാസത്തിന്റെ അടിസ്ഥാനത്തിൽ, നീതിയുടെ പ്രത്യാശയ്ക്കായി ആകാംക്ഷയോടെ കാത്തിരിക്കുന്നു.
  rationale: The revision distinguishes the source/basis sense of ἐκ πίστεως from the instrumental rendering of πνεύματι, while retaining concise, natural Malayalam and the ambiguity of ἐλπίδα δικαιοσύνης. Footnotes have been adjusted for clearer Malayalam terminology and grammatical description.
  reviewer_model: gpt-5.6-terra
