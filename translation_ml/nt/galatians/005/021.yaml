id: GAL.5.21
reference: Galatians 5:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: ml
  text: അസൂയ, മദ്യലഹരി, അതിരുകടന്ന ആഘോഷങ്ങൾ[a], ഇവപോലെയുള്ള കാര്യങ്ങൾ എന്നിവയെക്കുറിച്ച് ഞാൻ നിങ്ങളോടു മുന്നറിയിപ്പു നൽകുന്നു; മുമ്പും മുന്നറിയിപ്പു നൽകിയതുപോലെ, ഇത്തരം കാര്യങ്ങൾ പതിവായി ചെയ്യുന്നവർ ദൈവരാജ്യം അവകാശമാക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉല്ലാസവിരുന്നുകൾ’ അല്ലെങ്കിൽ ‘ലഹരിയോടുകൂടിയ ഉല്ലാസങ്ങൾ.’ ഗ്രീക്കുപദം പലപ്പോഴും മദ്യപാനവുമായി ബന്ധപ്പെട്ട നിയന്ത്രണമില്ലാത്ത ആഘോഷത്തെയും അമിതോല്ലാസത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνοι
  choice: അസൂയ
  rationale: മറ്റൊരാളുടെ നന്മയോടോ നേട്ടത്തോടോ ഉള്ള നീരസപൂർണമായ മോഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളപദം.
- source_word: μέθαι
  choice: മദ്യലഹരി
  rationale: മദ്യപിച്ചുള്ള ലഹരിയെയും അതിന്റെ ആവർത്തിത സംഭവങ്ങളെയും വ്യക്തമാക്കുന്നു; പട്ടികയിലെ ദോഷപ്രവൃത്തിയുടെ വിഭാഗനാമമായി സ്വാഭാവികമാണ്.
- source_word: κῶμοι
  choice: കൂത്താട്ടം
  rationale: മദ്യപാനവുമായി പലപ്പോഴും ബന്ധപ്പെട്ടിരുന്ന നിയന്ത്രണമില്ലാത്ത ആഘോഷവും ഉല്ലാസവുമാണ് ഗ്രീക്കുപദം സൂചിപ്പിക്കുന്നത്. ലൈംഗിക അർഥം അനിവാര്യമാക്കാതെ അതിരുകടന്ന ആഘോഷത്തിന്റെ ഭാവം പകരുന്നു.
- source_word: τὰ ὅμοια τούτοις
  choice: ഇവപോലെയുള്ള മറ്റുകാര്യങ്ങൾ
  rationale: പേരെടുത്ത ദോഷങ്ങൾക്കപ്പുറത്തേക്കും പട്ടിക തുറന്നുവയ്ക്കുന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἃ προλέγω ὑμῖν
  choice: ഇപ്പോൾ ഞാൻ നിങ്ങൾക്കു മുന്നറിയിപ്പു നൽകുന്നു
  rationale: προλέγω എന്നതിന് മുൻകൂട്ടി പറയുക എന്നും മുന്നറിയിപ്പു നൽകുക എന്നും അർഥമാകാം; ഈ ധാർമിക സന്ദർഭത്തിൽ മുന്നറിയിപ്പിന്റെ ശക്തി പ്രധാനമാണ്. ആവർത്തിത മുന്നറിയിപ്പെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കാൻ 'ഇപ്പോൾ' ചേർത്തു.
- source_word: καθὼς προεῖπον
  choice: മുമ്പ് മുന്നറിയിപ്പു നൽകിയതുപോലെ
  rationale: മുൻകാലത്തെ അതേ മുന്നറിയിപ്പിലേക്കുള്ള സൂചനയും ആവർത്തനത്തിന്റെ വാചാടോപശക്തിയും നിലനിർത്തുന്നു.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: ഇത്തരം കാര്യങ്ങൾ പതിവായി ചെയ്യുന്നവർ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന സ്വഭാവപരമോ തുടരുന്നതോ ആയ പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; ഒറ്റപ്പെട്ട വീഴ്ചയെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം നിർണയിക്കുന്നില്ല.
- source_word: βασιλείαν θεοῦ
  choice: ദൈവരാജ്യം
  rationale: പുതിയനിയമത്തിലെ സ്ഥിരവും സ്വാഭാവികവുമായ ദൈവശാസ്ത്രപരമായ പ്രയോഗം.
- source_word: οὐ κληρονομήσουσιν
  choice: അവകാശമാക്കുകയില്ല
  rationale: ഭാവികാലത്തിലുള്ള അവകാശഭാഷയും അതിന്റെ അന്തിമകാലപരമായ ഗൗരവവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ മുന്നറിയിപ്പ് ഒറ്റപ്പെട്ട പ്രവൃത്തികളെയാണോ ജീവിതത്തിന്റെ സ്ഥിരമായ രീതിയെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: '''പതിവായി ചെയ്യുന്നവർ'' എന്ന് പരിഭാഷപ്പെടുത്തി സ്വഭാവപരമായോ തുടരുന്നതായോ ഉള്ള പ്രവൃത്തിയെ സൂചിപ്പിച്ചു.'
  alternative: '''ഇത്തരം കാര്യങ്ങൾ ചെയ്യുന്നവർ'''
  rationale: πράσσοντες എന്ന വർത്തമാന കൃദന്തം ഈ ദോഷപ്പട്ടികയുടെ പശ്ചാത്തലത്തിൽ പതിവായ പ്രവൃത്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ഓരോ ഒറ്റപ്പെട്ട വീഴ്ചയെയും കുറിച്ച് പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം ചുമത്താതെ പാഠത്തിന്റെ ഗൗരവം ഇത് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ നീണ്ട ബന്ധഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പുനഃക്രമീകരിച്ചെങ്കിലും ആവർത്തിച്ച മുന്നറിയിപ്പും അവകാശഭാഷയും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് യഥാർത്ഥത്തിൽ ദ്വയാർഥസാധ്യതയുള്ള κῶμοι എന്ന പദത്തിനാണ് ചേർത്തത്.
