  to: വിഗ്രഹാരാധന, മന്ത്രവാദം[a], ശത്രുതകൾ, കലഹം, അസൂയ, കോപാവേശങ്ങൾ, സ്വാർഥാഭിലാഷങ്ങൾ, ഭിന്നതകൾ, കക്ഷിതിരിവുകൾ[b],
  rationale: ἐριθεῖαι-യുടെ സാമൂഹികവും സ്വയംമുന്നേറ്റപരവുമായ ആശയം കൂടുതൽ കൃത്യമായി പ്രകടിപ്പിക്കാൻ «സ്വാർഥമോഹങ്ങൾ» എന്നത് «സ്വാർഥാഭിലാഷങ്ങൾ» എന്ന് മാറ്റി. αἱρέσεις-ന്റെ പാദക്കുറിപ്പിൽ പിൽക്കാല ‘heresies’ എന്ന ഉപയോഗം സൂചിപ്പിക്കുമ്പോൾ, ‘വേദവിരുദ്ധ’ എന്ന വ്യാഖ്യാനാത്മക മതവിധി ഒഴിവാക്കി നിഷ്പക്ഷമായ «വിപഥവിശ്വാസങ്ങൾ» ഉപയോഗിച്ചു. പട്ടികയുടെ തുടരുന്ന സ്വഭാവം സൂചിപ്പിക്കുന്ന അവസാന കോമ നിലനിർത്തിയിരിക്കുന്നു.
