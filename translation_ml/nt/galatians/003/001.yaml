id: GAL.3.1
reference: Galatians 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: ml
  text: അവിവേകികളായ ഗലാത്യരേ, നിങ്ങളുടെ കൺമുന്നിൽ യേശു മശീഹാ ക്രൂശിക്കപ്പെട്ടവനായി പരസ്യമായി അവതരിപ്പിക്കപ്പെട്ടിരിക്കെ, ആരാണ് നിങ്ങളെ മയക്കിയത്[a][b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വശീകരിച്ചത്’ അഥവാ ‘വഞ്ചിച്ചത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ മന്ത്രവാദംകൊണ്ട് മയക്കുന്നതിനെ അനുസ്മരിപ്പിക്കുന്ന ശക്തമായ രൂപകമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘വ്യക്തമായി അവതരിപ്പിക്കപ്പെട്ടിരുന്നു’ അഥവാ ‘പരസ്യമായി അറിയിപ്പുപലകയിൽ പ്രദർശിപ്പിക്കപ്പെട്ടിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: അവിവേകികളായ
  rationale: തിരിച്ചറിവില്ലാതെ പ്രവർത്തിക്കുന്നതിനെക്കുറിച്ചുള്ള പൗലോസിന്റെ ശാസന വ്യക്തമാക്കുന്നു; മൂലപദത്തിലില്ലാത്ത കടുത്ത ധാർമിക കുറ്റപ്പെടുത്തൽ ചേർക്കുന്നില്ല.
- source_word: ἐβάσκανεν
  choice: മയക്കിയത്
  rationale: ദോഷകരമായ വശീകരണമോ മന്ത്രവാദസദൃശമായ സ്വാധീനമോ സൂചിപ്പിക്കുന്ന മൂലരൂപകം നിലനിർത്തുന്നു; വെറും ‘വഞ്ചിച്ചത്’ എന്നതിനെക്കാൾ വാക്യത്തിന്റെ തീവ്രത പകരുന്നു.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: നിങ്ങളുടെ കൺമുന്നിൽ
  rationale: നേരിട്ട്, വ്യക്തമായി അവരുടെ മുമ്പിൽ അവതരിപ്പിക്കപ്പെട്ടുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ἰησοῦς Χριστός
  choice: യേശു മശീഹാ
  rationale: Ἰησοῦς എന്ന പേര് ലിപ്യന്തരണം ചെയ്യുകയും Χριστός എന്ന അഭിഷിക്തസ്ഥാനപ്പേര് ‘മശീഹാ’ എന്നു അർത്ഥവത്തായി നൽകുകയും ചെയ്യുന്നു.
- source_word: προεγράφη
  choice: പരസ്യമായി വരച്ചുകാട്ടപ്പെട്ടിരുന്നു
  rationale: എല്ലാവരുടെയും മുമ്പിൽ ദൃശ്യവ്യക്തതയോടെ അവതരിപ്പിച്ചു എന്ന പദത്തിന്റെ ആശയം പകരുന്നു; അക്ഷരാർഥത്തിൽ ഒരു ചിത്രം വരച്ചുവെന്ന അവകാശവാദത്തിലേക്ക് അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: ἐσταυρωμένος
  choice: ക്രൂശിക്കപ്പെട്ടവനായി
  rationale: സമ്പൂർണകൃത്യന്തത്തിന്റെ ഫലാവസ്ഥയും προεγράφηയോടൊപ്പമുള്ള വിധേയപ്രയോഗവും പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: Ἰησοῦς Χριστός എന്ന പേര്-സ്ഥാനപ്പേര് പ്രയോഗത്തിലെ Χριστός
  choice: യേശു മശീഹാ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός ഒരു കുടുംബപ്പേരുപോലെ കേൾക്കാതിരിക്കാനും ‘അഭിഷിക്തൻ/മശീഹാ’ എന്ന സ്ഥാനപ്പേരിന്റെ അർത്ഥം വായനക്കാരന് കേൾക്കാനും ‘മശീഹാ’ ഉപയോഗിച്ചു.
- issue: ἐσταυρωμένος എന്ന സമ്പൂർണകൃത്യന്തത്തിന്റെ പ്രാധാന്യം
  choice: ക്രൂശിക്കപ്പെട്ടവനായി
  alternative: ക്രൂശിക്കപ്പെട്ടു എന്ന്
  rationale: യേശുവിന്റെ ക്രൂശീകരണം സംഭവിച്ചതെന്നതോടൊപ്പം ക്രൂശിക്കപ്പെട്ട അവസ്ഥയിൽ അദ്ദേഹത്തെ അവരുടെ മുമ്പിൽ അവതരിപ്പിച്ചുവെന്ന ഗ്രീക്ക് വ്യാകരണബന്ധവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ആദ്യവാക്യത്തിലെ കടുത്ത ശാസനയും രണ്ടാംവാക്യത്തിലെ വിസ്മയാത്മക വാഗ്‌ചോദ്യഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
