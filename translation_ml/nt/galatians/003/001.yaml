- from: അവിവേകികളായ ഗലാത്യരേ, ആരാണ് നിങ്ങളെ മയക്കിയത്[a]? നിങ്ങളുടെ കൺമുന്നിൽ യേശു മശീഹാ ക്രൂശിക്കപ്പെട്ടവനായി പരസ്യമായി വരച്ചുകാട്ടപ്പെട്ടിരുന്നല്ലോ[b]!
