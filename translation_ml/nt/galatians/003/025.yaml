source:
  edition: SBLGNT
  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: ml
  text: എന്നാൽ വിശ്വാസം വന്നതോടെ[a], നാം ഇനി ഒരു പരിപാലകന്റെ[b] കീഴിലല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് ‘വിശ്വാസത്തിന്റെ കാലം വന്നതോടെ’ എന്ന സന്ദർഭാർഥത്തിലും മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിലെ παιδαγωγός പ്രധാനമായും ഒരു അധ്യാപകനെയല്ല, വീട്ടിലെ പ്രായപൂർത്തിയാകാത്ത കുട്ടിയെ നോക്കുകയും നിയന്ത്രിക്കുകയും ചെയ്തിരുന്ന പരിപാലകനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: വന്നതോടെ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിലുള്ള എയോറിസ്റ്റ് പാർട്ടിസിപ്പിളിനെ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി അവതരിപ്പിക്കുന്നു; സംഭവിച്ച വരവും അതിന്റെ ഇപ്പോഴത്തെ ഫലവും സൂചിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ന്യായപ്രമാണത്തിന്റെ താൽക്കാലിക മേൽനോട്ടവും ഇപ്പോഴത്തെ അവസ്ഥയും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് വിശ്വാസത്തിന്റെ വരവിലൂടെ ആരംഭിച്ച രക്ഷാചരിത്രപരമായ ഘട്ടത്തെയും സൂചിപ്പിക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: οὐκέτι
  choice: ഇനി ... അല്ല
  rationale: മുമ്പുണ്ടായിരുന്ന അവസ്ഥ അവസാനിച്ചുവെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑπὸ
  choice: കീഴിൽ
  rationale: മേൽനോട്ടത്തിനോ അധികാരത്തിനോ കീഴിലായിരിക്കുക എന്ന പൗലോസിന്റെ രൂപകം നിലനിർത്തുന്നു.
- source_word: παιδαγωγόν
  choice: മേൽനോട്ടക്കാരൻ
  rationale: പുരാതന വീട്ടിൽ പ്രായപൂർത്തിയാകാത്ത കുട്ടിയെ നിയന്ത്രിക്കുകയും സംരക്ഷിക്കുകയും ചെയ്തിരുന്ന വ്യക്തിയെയാണ് παιδαγωγός പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; ‘അധ്യാപകൻ’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘മേൽനോട്ടക്കാരൻ’ തിരഞ്ഞെടുത്തു.
- source_word: ἐσμεν
  choice: നാം ... അല്ല
  rationale: ഗ്രീക്ക് വർത്തമാനകാല ക്രിയയെ മലയാളത്തിലെ സ്വാഭാവിക നിഷേധാത്മക വിധിവാക്യമായി നൽകുന്നു.
theological_decisions:
- issue: ‘വിശ്വാസം വന്നത്’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: പ്രധാന പാഠത്തിൽ ‘വിശ്വാസം വന്നതോടെ’ എന്നു നൽകി.
  alternative: ‘വിശ്വാസത്തിന്റെ കാലം വന്നതോടെ’ എന്ന രക്ഷാചരിത്രപരമായ അർഥവ്യക്തീകരണം.
  rationale: പൗലോസ് ന്യായപ്രമാണത്തിന്റെ മുൻകാല മേൽനോട്ടത്തിൽനിന്നുള്ള മാറ്റത്തെ വിവരിക്കുന്നതിനാൽ കാലഘട്ടപരമായ സൂചന ഇവിടെ ഉണ്ടായേക്കാം. എന്നാൽ πίστις എന്ന പദത്തിൽ ഇല്ലാത്ത ‘കാലം’ പ്രധാന പാഠത്തിൽ ചേർത്ത് അർഥം തീർപ്പാക്കാതെ, സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘മേൽനോട്ടക്കാരൻ’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും പുരാതന സാംസ്കാരിക ചുമതലയോട് സാമ്യമുള്ളതുമാണ്; അതിന്റെ പ്രത്യേക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
