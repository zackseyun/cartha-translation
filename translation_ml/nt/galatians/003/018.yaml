id: GAL.3.18
reference: Galatians 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: ml
  text: അവകാശം ന്യായപ്രമാണത്തിൽനിന്നുള്ളതാണെങ്കിൽ, അത് ഇനി വാഗ്ദാനത്തിൽനിന്നുള്ളതല്ല; എന്നാൽ ദൈവം വാഗ്ദാനത്തിലൂടെ അബ്രാഹാമിന് അത് കൃപാപൂർവം നൽകിയിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവം വാഗ്ദാനത്താൽ അത് അബ്രാഹാമിന് അനുവദിച്ചിരിക്കുന്നു.”
    reason: κεχάρισται എന്നതിന് ‘അനുവദിച്ചിരിക്കുന്നു’ എന്നും διάയ്ക്ക് ‘വാഗ്ദാനത്താൽ’ എന്നും നൽകാവുന്ന പദപരമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: κληρονομία
  choice: അവകാശം
  rationale: അവകാശിയായി ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗം സ്വാഭാവികമായും സംക്ഷിപ്തമായും അറിയിക്കുന്നു; ന്യായപ്രമാണവും വാഗ്ദാനവും തമ്മിലുള്ള വാദത്തിനും യോജിക്കുന്നു.
- source_word: νόμου
  choice: ന്യായപ്രമാണം
  rationale: സന്ദർഭത്തിൽ മോശൈക ന്യായപ്രമാണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ ‘നിയമം’ എന്നതിനെക്കാൾ ബൈബിൾസന്ദർഭം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐκ νόμου
  choice: ന്യായപ്രമാണത്തിൽനിന്നുള്ളത്
  rationale: ἐκ എന്നതിന്റെ ഉറവിട/അടിസ്ഥാന ആശയം സൂക്ഷിക്കുകയും ἐξ ἐπαγγελίας എന്ന സമാന്തര പ്രയോഗത്തോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐπαγγελίας
  choice: വാഗ്ദാനം
  rationale: ഗ്രീക്കിലെ അനിർദ്ദിഷ്ട രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘വാഗ്ദാനം’ എന്നു വരുന്നു; സന്ദർഭം അബ്രാഹാമിനോടുള്ള വാഗ്ദാനത്തെ വ്യക്തമാക്കുന്നു.
- source_word: οὐκέτι
  choice: ഇനി ... അല്ല
  rationale: രണ്ടു അടിസ്ഥാനങ്ങളും ഒരേസമയം നിലനിൽക്കില്ലെന്ന പൗലോസിന്റെ നിഷേധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῷ δὲ Ἀβραὰμ
  choice: എന്നാൽ ... അബ്രാഹാമിന്
  rationale: δὲ എന്ന വൈരുധ്യവും ദാതീവിലുള്ള സ്വീകർത്താവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δι’ ἐπαγγελίας
  choice: വാഗ്ദാനത്തിലൂടെ
  rationale: διάയുടെ ഉപാധി/മാധ്യമ ആശയം സൂക്ഷിക്കുകയും ന്യായപ്രമാണത്തിൽനിന്ന് എന്ന മുൻപ്രയോഗത്തോടുള്ള വ്യത്യാസം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: κεχάρισται
  choice: കൃപാപൂർവം നൽകിയിരിക്കുന്നു
  rationale: χαρίζομαι എന്നതിലെ കൃപയോടു ബന്ധപ്പെട്ട ഭാവവും perfect രൂപത്തിന്റെ നിലവിലുള്ള ഫലവും മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: വാക്യത്തിലെ പ്രവർത്തകനെ വ്യക്തമായി നൽകുന്ന പതിവായ മലയാള പരിഭാഷ.
theological_decisions:
- issue: χαρίζομαι എന്ന ക്രിയയിലെ കൃപാഭാവം തുറന്നുപറയണമോ
  choice: ‘കൃപാപൂർവം നൽകിയിരിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നൽകിയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘അനുവദിച്ചിരിക്കുന്നു’
  rationale: അവകാശം ന്യായപ്രമാണത്തിൽനിന്നല്ല, വാഗ്ദാനത്തിലൂടെയാണ് എന്ന പൗലോസിന്റെ വൈരുധ്യത്തിൽ ക്രിയയുടെ കൃപാഭാവം പ്രസക്തമാണ്; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ മൂലപദത്തിന്റെ അർത്ഥഘടകം സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പൗലോസിന്റെ ‘ന്യായപ്രമാണത്തിൽനിന്ന് / വാഗ്ദാനത്തിൽനിന്ന്’ എന്ന ഉറവിടവൈരുധ്യം നിലനിർത്തിയിരിക്കുന്നു; ‘കൃപാപൂർവം’ മൂലക്രിയയുടെ അർത്ഥഭാവം വ്യക്തമാക്കുന്നു.
