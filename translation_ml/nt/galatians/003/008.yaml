id: GAL.3.8
reference: Galatians 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: ml
  text: 'ദൈവം വിശ്വാസത്താൽ ജനതകളെ[a] നീതീകരിക്കുന്നു എന്നു തിരുവെഴുത്ത് മുൻകൂട്ടിക്കണ്ട്, അബ്രാഹാമിനോട് മുൻകൂട്ടി സുവിശേഷം അറിയിച്ചു[b]: “നിന്നിൽ സകല ജനതകളും അനുഗ്രഹിക്കപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിജാതീയരെ”; ഗ്രീക്ക് ἔθνη എന്നതിന് “ജനതകൾ” എന്നും “വിജാതീയർ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അബ്രാഹാമിനോട് മുൻകൂട്ടി സുവിശേഷം പ്രസംഗിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: മുൻകൂട്ടിക്കണ്ട്
  rationale: മുൻകൂട്ടിയുള്ള അറിവ്/കാഴ്ച എന്ന ക്രിയയുടെ കാലപരവും അർഥപരവുമായ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡ γραφή
  choice: തിരുവെഴുത്ത്
  rationale: പൗലൊസിന്റെ പ്രയോഗത്തിൽ ഇത് ഒരു സാധാരണ എഴുത്തല്ല, വ്യക്തിവൽക്കരിക്കപ്പെട്ട വിശുദ്ധ തിരുവെഴുത്തിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐκ πίστεως
  choice: വിശ്വാസത്താൽ
  rationale: മാർഗമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ചുരുക്കമായും പതിവായും അവതരിപ്പിക്കുന്നു; ഏത് വ്യക്തിയുടെ വിശ്വാസമെന്നത് അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: δικαιοῖ
  choice: നീതീകരിക്കുന്നു
  rationale: വർത്തമാനകാലവും പൗലൊസിന്റെ നിയമപര/ബന്ധപരമായ അർഥസാധ്യതയും അമിതമായ പരാവർത്തനം കൂടാതെ നിലനിർത്തുന്ന സ്ഥാപിത പദം.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: ജനതകളെ ... സകല ജനതകളും
  rationale: രണ്ടിടത്തെയും ഒരേ പദബന്ധം നിലനിർത്തി അബ്രാഹാമിക വാഗ്ദാനവുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു; ‘ജാതികൾ’ എന്നതിലെ ജാതിവ്യവസ്ഥാസംബന്ധിയായ ആധുനിക തെറ്റിദ്ധാരണയും ഒഴിവാക്കുന്നു.
- source_word: προευηγγελίσατο
  choice: മുൻകൂട്ടി സുവിശേഷം അറിയിച്ചു
  rationale: ക്രിയയിലെ ‘സുവിശേഷം/സദ്വാർത്ത അറിയിക്കുക’ എന്ന ആശയവും മുൻകാലസൂചനയും രണ്ടും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τῷ Ἀβραὰμ
  choice: അബ്രാഹാമിനോട്
  rationale: പരോക്ഷ കർമത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἐνευλογηθήσονται
  choice: അനുഗ്രഹിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗത്തെ നേരിട്ട് നിലനിർത്തി ദൈവിക വാഗ്ദാനത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: ἐν σοὶ
  choice: നിന്നിൽ
  rationale: ഉല്പത്തി ഉദ്ധരണിയിലെ പ്രതിനിധാനപരവും ഉടമ്പടിസംബന്ധവുമായ സാന്ദ്രത വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ഗ്രീക്ക് പൂർവപ്രത്യയത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἔθνη എന്നത് ‘ജനതകൾ’ എന്നോ ‘വിജാതീയർ’ എന്നോ വിവർത്തനം ചെയ്യുക
  choice: രണ്ടിടത്തും ‘ജനതകൾ’
  alternative: ആദ്യത്തേതിൽ ‘വിജാതീയർ’, ഉദ്ധരണിയിൽ ‘ജനതകൾ’
  rationale: പൗലൊസിന്റെ വാക്യവും അബ്രാഹാമിനുള്ള വാഗ്ദാനവും തമ്മിലുള്ള പദപരവും ദൈവശാസ്ത്രപരവുമായ ബന്ധം തുറന്നുകാട്ടുന്നു; അതേസമയം ‘വിജാതീയർ’ എന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐκ πίστεως എന്നതിലെ πίστις ആരുടേതാണെന്നോ കൃത്യമായി എന്ത് അടിസ്ഥാനമാണെന്നോ വിശദീകരിക്കുക
  choice: ‘വിശ്വാസത്താൽ’ എന്ന സംക്ഷിപ്ത രൂപം
  alternative: ‘വിശ്വാസത്തിന്റെ അടിസ്ഥാനത്തിൽ’
  rationale: മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തതയും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും നിലനിർത്തുന്നു; പ്രത്യേക ദൈവശാസ്ത്ര വ്യവസ്ഥ നിർബന്ധിക്കുന്നില്ല.
- issue: προευηγγελίσατο എന്നതിന് സാങ്കേതിക ‘സുവിശേഷം പ്രസംഗിച്ചു’ എന്നോ പൊതുവായ ‘സദ്വാർത്ത അറിയിച്ചു’ എന്നോ നൽകുക
  choice: ‘മുൻകൂട്ടി സുവിശേഷം അറിയിച്ചു’
  alternative: ‘മുൻകൂട്ടി സദ്വാർത്ത അറിയിച്ചു’
  rationale: εὐαγγελ- പദകുടുംബവുമായുള്ള ബന്ധം നിലനിർത്തുമ്പോഴും അബ്രാഹാമിനോടുള്ള അറിയിപ്പെന്ന വാക്യഘടന സ്വാഭാവികമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘തിരുവെഴുത്ത്’ വ്യക്തിവൽക്കരിക്കപ്പെടുന്ന മൂലവാക്യഘടന നിലനിർത്തി. ‘ജനതകൾ’ എന്ന പദം ഉദ്ധരണിയുമായുള്ള ആവർത്തനം സംരക്ഷിക്കുകയും ‘ജാതികൾ’ എന്ന പദത്തിന് ഇന്നുള്ള ജാതിവ്യവസ്ഥാസംബന്ധിയായ ആശയക്കുഴപ്പം ഒഴിവാക്കുകയും ചെയ്യുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
