  naturalness: ‘ദൈവം വിശ്വാസത്താൽ ജനതകളെ നീതീകരിക്കുന്നു എന്നു തിരുവെഴുത്ത് മുൻകൂട്ടിക്കണ്ട്’ എന്ന ക്രമം ആധുനിക ഗൗരവമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ജനതകൾ’ ജാതിവ്യവസ്ഥയെ സൂചിപ്പിക്കാവുന്ന ‘ജാതികൾ’ ഒഴിവാക്കി nations എന്ന അർഥത്തിൽ യോജിച്ചിരിക്കുന്നു.
