  to: 'ദൈവം വിശ്വാസത്താൽ ജനതകളെ[a] നീതീകരിക്കുന്നു എന്നു തിരുവെഴുത്ത് മുൻകൂട്ടിക്കണ്ട്, അബ്രാഹാമിനോട് മുൻകൂട്ടി സുവിശേഷം അറിയിച്ചു[b]: “നിന്നിൽ സകല ജനതകളും അനുഗ്രഹിക്കപ്പെടും.”'
  rationale: മുഖ്യപാഠത്തിൽ മാറ്റം ആവശ്യമില്ല. προευηγγελίσατοയ്ക്ക് നൽകുന്ന ബദൽ കുറിപ്പ് മാത്രം ഇംഗ്ലീഷ് audit trail-ലുള്ള ക്രിയാപരമായ ബദലോട് യോജിപ്പിക്കുകയും ‘സുവിശേഷം’ എന്ന പദകുടുംബബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നവിധം പരിഷ്കരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കു ശേഷമാണ് നിലകൊള്ളുന്നത്.
