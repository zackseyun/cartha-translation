revisions:
- from: യെഹൂദനെന്നോ ഗ്രീക്കുകാരനെന്നോ ഇല്ല; അടിമയെന്നോ സ്വതന്ത്രനെന്നോ ഇല്ല; ആണും പെണ്ണും എന്നില്ല[a]. കാരണം, നിങ്ങൾ എല്ലാവരും മശീഹയായ യേശുവിൽ ഒന്നാണ്[b].
  to: യെഹൂദനോ ഗ്രീക്കുകാരനോ ഇല്ല; അടിമയോ സ്വതന്ത്രനോ ഇല്ല; ആണും പെണ്ണും ഇല്ല[a]. കാരണം, നിങ്ങൾ എല്ലാവരും മശീഹയായ യേശുവിൽ ഒന്നാണ്[b].
