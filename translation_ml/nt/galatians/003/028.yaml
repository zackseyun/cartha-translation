id: GAL.3.28
reference: Galatians 3:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: ml
  text: യെഹൂദനോ ഗ്രീക്കുകാരനോ ഇല്ല; അടിമയോ സ്വതന്ത്രനോ ഇല്ല; ആണും പെണ്ണും ഇല്ല[a]. കാരണം, നിങ്ങൾ എല്ലാവരും മശീഹയായ യേശുവിൽ ഒന്നാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ആദ്യത്തെ രണ്ടു ജോടികളിൽ നിഷേധത്തോടൊപ്പം ‘അഥവാ/അല്ലെങ്കിൽ’ എന്ന അർഥമുള്ള ബന്ധപദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; ഇവിടെ അക്ഷരാർഥത്തിൽ ‘ആണും പെണ്ണും’ എന്നാണ്. ഇത് ഉല്പത്തി 1:27-നെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം.
    reason: alternative_reading
  - marker: b
    text: 'ഗ്രീക്ക്: ‘ക്രിസ്തുയേശുവിൽ’; Χριστός ഇവിടെ ഒരു പദവിയായതിനാൽ ‘മശീഹയായ യേശുവിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: …എന്നോ ഇല്ല / …എന്നില്ല
  rationale: ആവർത്തിക്കുന്ന അസ്തിത്വനിഷേധത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ഊന്നലോടെ നിലനിർത്തുന്നു.
- source_word: Ἰουδαῖος
  choice: യെഹൂദൻ
  rationale: Ἕλλην എന്ന വംശീയ-മതപരമായ വിപരീതപദത്തോടുള്ള സ്ഥാപിതവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: Ἕλλην
  choice: ഗ്രീക്കുകാരൻ
  rationale: മൂലപാഠത്തിലെ നിർദിഷ്ടമായ ‘ഗ്രീക്ക്’ എന്ന പദം നിലനിർത്തുന്നു; വിശാലമായ ‘ജാതിയൻ’ എന്ന് വികസിപ്പിക്കുന്നില്ല.
- source_word: δοῦλος
  choice: അടിമ
  rationale: ἐλεύθερος എന്നതിനോടുള്ള സാമൂഹികപദവിയുടെ തീക്ഷ്ണമായ വൈരുധ്യം കൃത്യമായി നൽകുന്നു.
- source_word: ἐλεύθερος
  choice: സ്വതന്ത്രൻ
  rationale: അടിമ എന്നതിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രതിപദം.
- source_word: ἄρσεν καὶ θῆλυ
  choice: ആണും പെണ്ണും
  rationale: ജൈവലിംഗസൂചനയും καὶ എന്ന ‘ഉം/യും’ ഘടനയും ഉല്പത്തി 1:27-ന്റെ സാധ്യതയുള്ള പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: πάντες γὰρ ὑμεῖς
  choice: കാരണം, നിങ്ങൾ എല്ലാവരും
  rationale: γὰρ-ന്റെ കാരണബന്ധവും രണ്ടാംപുരുഷ ബഹുവചനത്തിലെ നേരിട്ടുള്ള ഊന്നലും വ്യക്തമാക്കുന്നു.
- source_word: εἷς ἐστε
  choice: ഒന്നാണ്
  rationale: ഐക്യത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന വിധേയത്തെ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός ഇവിടെ പദവിയായതിനാൽ ‘മശീഹ’ എന്നു നൽകുകയും മലയാളത്തിലെ സ്വാഭാവികമായ ബന്ധഘടന ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἄρσεν καὶ θῆλυ എന്നതിലെ καὶ എങ്ങനെ പ്രതിഫലിപ്പിക്കണം
  choice: ആണും പെണ്ണും എന്നില്ല
  alternative: ആണെന്നോ പെണ്ണെന്നോ ഇല്ല
  rationale: ആദ്യ രണ്ടു ജോടികളിലെ οὐδὲ-യിൽനിന്നുള്ള വ്യത്യാസവും ഉല്പത്തി 1:27-ലേക്കുള്ള സാധ്യതയുള്ള സൂചനയും സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ അർത്ഥം ഗ്രഹിക്കാവുന്നതാക്കാൻ ‘എന്നില്ല’ ചേർക്കുന്നു.
- issue: εἷς ἐστε എന്നത് വിശദീകരിച്ചു വികസിപ്പിക്കണമോ
  choice: നിങ്ങൾ എല്ലാവരും … ഒന്നാണ്
  alternative: നിങ്ങൾ എല്ലാവരും ഏകീകൃതരാണ് / ഒരൊറ്റ വ്യക്തിയാണ്
  rationale: വാക്യം പറയുന്ന ഐക്യം മാത്രം ഉറപ്പിക്കുന്നു; സൃഷ്ടിപരമായ എല്ലാ വ്യത്യാസങ്ങളും ഇല്ലാതാകുന്നു എന്നോ ഒരൊറ്റ വ്യക്തിയാകുന്നു എന്നോ അധികമായി നിർണ്ണയിക്കുന്നില്ല.
- issue: Χριστός പേരായോ പദവിയായോ നൽകണമോ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഇവിടെ Χριστός-ന്റെ പദവിസ്വഭാവം തുറന്നുകാട്ടുന്നു; സ്വകാര്യമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. സമാന്തരമായ മൂന്നു നിഷേധങ്ങളും അവസാനത്തെ കാരണവാക്യവും നിലനിർത്തി. ‘ആണും പെണ്ണും’ എന്ന അല്പം ശ്രദ്ധേയമായ ഘടന മൂലഗ്രീക്കിലെ ഉദ്ദേശ്യപ്രധാനമായ വ്യത്യാസം സംരക്ഷിക്കാനാണ്.
