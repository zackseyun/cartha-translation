revisions:
- from: നിങ്ങൾ ഇത്രയേറെ കഷ്ടം അനുഭവിച്ചത് വെറുതെയായോ?—അത് വാസ്തവത്തിൽ വെറുതെയായെങ്കിൽത്തന്നെ.[a]
  to: നിങ്ങൾ ഇത്രയേറെ കഷ്ടങ്ങൾ വെറുതെയാണോ അനുഭവിച്ചത്?—വാസ്തവത്തിൽ അത് വെറുതെയായിരുന്നെങ്കിൽ!
  rationale: The revision improves Malayalam idiom, preserves the plural scope of τοσαῦτα, and renders the second εἰκῇ with the Greek clause’s rhetorical, hesitant conditional force. The lexical alternative for ἐπάθετε remains available in the footnote.
