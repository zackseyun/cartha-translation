id: GAL.3.21
reference: Galatians 3:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: ml
  text: അങ്ങനെയെങ്കിൽ, നിയമം ദൈവത്തിന്റെ വാഗ്ദാനങ്ങൾക്ക് എതിരാണോ? ഒരിക്കലുമല്ല! ജീവൻ നൽകാൻ കഴിവുള്ള ഒരു നിയമം നൽകപ്പെട്ടിരുന്നെങ്കിൽ, നീതി[a] വാസ്തവത്തിൽ നിയമത്തിൽനിന്നുള്ളതാകുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ന്യായം.”
    reason: δικαιοσύνη എന്ന ഗ്രീക്കുപദത്തിന്റെ സാധ്യമായ നീതിപരമായ അർഥവികല്പം നിലനിർത്താൻ.
lexical_decisions:
- source_word: νόμος
  choice: നിയമം
  rationale: പൗലോസിന്റെ വാദത്തിൽ മോശെയുടെ നിയമം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, ഈ വാക്യത്തിലെ സാങ്കൽപ്പിക വ്യവസ്ഥ നിയമത്തെ പൊതുവായ ഒരു വിഭാഗമായും അവതരിപ്പിക്കുന്നു. അതിനാൽ നിർദ്ദിഷ്ടമായ ‘ന്യായപ്രമാണം’ എന്നതിനെക്കാൾ ‘നിയമം’ ഈ വ്യാപ്തി നന്നായി നിലനിർത്തുന്നു.
- source_word: κατὰ
  choice: എതിരായി
  rationale: ജനിറ്റീവിനോടുകൂടിയ κατά ഇവിടെ വിരോധത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ ചോദ്യരൂപത്തിനായി ‘എതിരാണോ’ എന്നു നൽകി.
- source_word: ἐπαγγελιῶν
  choice: വാഗ്ദാനങ്ങൾ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലുമല്ല!
  rationale: പൗലോസിന്റെ ശക്തമായ നിരാകരണം ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഊന്നലോടെയും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐδόθη
  choice: നൽകപ്പെട്ടിരുന്നെങ്കിൽ
  rationale: നിഷ്ക്രിയ അഓറിസ്റ്റിനെ സാങ്കൽപ്പിക വ്യവസ്ഥയോട് യോജിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകി.
- source_word: δυνάμενος ζῳοποιῆσαι
  choice: ജീവൻ നൽകാൻ കഴിവുള്ള
  rationale: നിയമത്തിന്റെ ജീവദായക ശേഷിയെ സൂചിപ്പിക്കുന്ന വിശേഷണഘടനയും അർഥവും നിലനിർത്തുന്നു.
- source_word: ὄντως
  choice: വാസ്തവത്തിൽ
  rationale: നിഗമനത്തിലെ ഊന്നൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐκ νόμου
  choice: നിയമത്തിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: പൗലോസിന്റെ സാന്ദ്രമായ പദത്തെ ‘നീതീകരണം’ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ, മലയാളത്തിൽ ധാർമിക നീതിയും ദൈവസന്നിധിയിലെ ശരിയായ നിലയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന പദം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: പൗലോസിന്റെ വാദത്തിലെ δικαιοσύνη എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: നീതി
  alternative: ന്യായം
  rationale: ‘നീതി’ ദൈവസന്നിധിയിലെ ശരിയായ നില എന്ന ആശയത്തെ ഉൾക്കൊള്ളുമ്പോഴും പദത്തെ സാങ്കേതികമായ ‘നീതീകരണം’ എന്നതിലേക്ക് ചുരുക്കുന്നില്ല. ‘ന്യായം’ എന്ന സാധ്യമായ നീതിപരമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിന്റെ വാദാത്മക ചോദ്യവും ശക്തമായ നിരാകരണവും സാങ്കൽപ്പിക വ്യവസ്ഥയും നിലനിർത്തിയിരിക്കുന്നു.
