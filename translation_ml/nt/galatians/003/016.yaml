- from: അബ്രാഹാമിനും അവന്റെ സന്തതിക്കും[a] വാഗ്ദാനങ്ങൾ അരുളപ്പെട്ടു. “പലരെ ഉദ്ദേശിക്കുന്നതുപോലെ, ‘സന്തതികൾക്കും’[b]” എന്നല്ല, ഒരാളെ ഉദ്ദേശിച്ച്, “നിന്റെ സന്തതിക്കും” എന്നാണ് പറയുന്നത്; ആ സന്തതി മശീഹയാണ്[c].
