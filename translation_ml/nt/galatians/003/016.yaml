id: GAL.3.16
reference: Galatians 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: ml
  text: അബ്രാഹാമിനോടും അവന്റെ സന്തതിയോടും[a] വാഗ്ദാനങ്ങൾ അരുളപ്പെട്ടു. പലരെ സൂചിപ്പിച്ചുകൊണ്ട് ‘സന്തതികൾക്കും’[b] എന്നു പറയുന്നില്ല; മറിച്ച്, ഒരാളെ സൂചിപ്പിച്ചുകൊണ്ട്, ‘നിന്റെ സന്തതിക്കും’ എന്നാണ് പറയുന്നത്. ആ ഒരാൾ മശീഹയാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലുടനീളം ‘വിത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. പൗലോസിന്റെ വാദത്തിന് കേന്ദ്രമായിരിക്കുന്ന ഏകവചന കൂട്ടനാമമാണ് ഗ്രീക്കിൽ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വിത്തുകൾക്കും’. പൗലോസ് ഇവിടെ പദത്തിന്റെ ബഹുവചനരൂപത്തെ പ്രത്യേകം ചൂണ്ടിക്കാണിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ക്രിസ്തു’.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: അരുളപ്പെട്ടു
  rationale: വാഗ്ദാനങ്ങൾ ദൈവം നൽകിയതാണെന്ന സന്ദർഭത്തിൽ λέγωയുടെ കർമണിപ്രയോഗത്തെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കർത്താവിനെ വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐπαγγελίαι
  choice: വാഗ്ദാനങ്ങൾ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിനൊത്ത, വ്യക്തവും സാധാരണവുമായ മലയാള പദം.
- source_word: σπέρμα / σπέρματι
  choice: സന്തതി
  rationale: ഏകവചനരൂപത്തിലും കൂട്ടാർഥത്തിലും ഉപയോഗിക്കാവുന്നതിനാൽ പൗലോസിന്റെ വാദത്തിന് ആധാരമായ വ്യാകരണസവിശേഷത നിലനിർത്തുന്നു.
- source_word: τοῖς σπέρμασιν
  choice: സന്തതികൾക്കും
  rationale: ഏകവചനവും ബഹുവചനവും തമ്മിലുള്ള പൗലോസിന്റെ ഉദ്ദേശ്യപൂർവമായ വ്യത്യാസം മലയാളത്തിൽ ദൃശ്യമാക്കുന്നു.
- source_word: ὡς ἐπὶ πολλῶν / ἀλλ’ ὡς ἐφ’ ἑνός
  choice: പലരെ ഉദ്ദേശിക്കുന്നതുപോലെ / ഒരാളെ ഉദ്ദേശിച്ച്
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും പലർ–ഒരാൾ എന്ന വിരോധം കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: Χριστός
  choice: മശീഹ
  rationale: ഇവിടെ അഭിഷിക്തനായ വാഗ്ദത്ത രക്ഷകനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: σπέρμα എന്ന ഏകവചന കൂട്ടനാമത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ വാദം
  choice: പ്രധാന പാഠത്തിൽ ‘സന്തതി’; ഉദ്ധരിച്ച ബഹുവചനത്തിൽ ‘സന്തതികൾ’
  alternative: ‘വിത്ത് / വിത്തുകൾ’ അല്ലെങ്കിൽ ‘വംശജൻ / വംശജർ’
  rationale: ‘സന്തതി’ സ്വാഭാവിക മലയാളത്തിൽ കൂട്ടാർഥം വഹിക്കുമ്പോഴും ഏകവചനരൂപം നിലനിർത്തുന്നു; ബഹുവചനം പ്രത്യേകം കാണിച്ച് പൗലോസിന്റെ വാദം മുൻകൂട്ടി പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: Χριστός എന്ന പദത്തിന്റെ തിരിച്ചറിയൽപ്രയോഗം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ὅς ἐστιν Χριστός എന്നതിൽ സ്ഥാനപ്പേരിന്റെ അർഥം സജീവമായതിനാൽ ‘മശീഹ’ ഉപയോഗിച്ചു; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ δέ-യ്ക്ക് വേറിട്ട കാലസൂചകപദം ചേർത്തിട്ടില്ല. ഉദ്ധരണികളുടെ ക്രമവും ഏകവചനം–ബഹുവചനം എന്ന വാദവും തെളിഞ്ഞുനിൽക്കാൻ വാക്യഘടന അല്പം പുനഃക്രമീകരിച്ചു; എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
