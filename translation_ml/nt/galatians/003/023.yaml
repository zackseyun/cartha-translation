id: GAL.3.23
reference: Galatians 3:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: ml
  text: എന്നാൽ വിശ്വാസം[a][b] വരുന്നതിനുമുമ്പ്, വെളിപ്പെടാനിരുന്ന വിശ്വാസം വെളിപ്പെടുന്നതുവരെ നാം നിയമത്തിൻകീഴിൽ കാവലിൽ സൂക്ഷിക്കപ്പെട്ടും[c] അടച്ചിടപ്പെട്ടും[d] ഇരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ വിശ്വാസം വരുന്നതിനുമുമ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ നിർദിഷ്ട ആർട്ടിക്കിൾ ഉള്ളതിനാൽ ക്രിസ്തുവോടെ ആരംഭിച്ച വിശ്വാസത്തിന്റെ കാലഘട്ടത്തെ ഇത് സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
  - marker: b
    text: πίστις എന്ന ഗ്രീക്ക് പദത്തിന് ‘വിശ്വസ്തത’ അല്ലെങ്കിൽ ‘ആശ്രയിക്കൽ’ എന്നും അർഥമാകാം; ഇവിടെ ‘വിശ്വാസം’ ആണ് സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ചത്.
    reason: lexical_alternative
  - marker: c
    text: ‘കസ്റ്റഡിയിൽ പാർപ്പിക്കപ്പെട്ടും’ അല്ലെങ്കിൽ ‘കാവലിലാക്കപ്പെട്ടും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: ‘തടവിലാക്കപ്പെട്ടും’, ‘അടച്ചുപൂട്ടപ്പെട്ടും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ ... ἐλθεῖν
  choice: '... വരുന്നതിനുമുമ്പ്'
  rationale: πρόയോടുകൂടിയ articular infinitive കാലസൂചന നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘വരുന്നതിനുമുമ്പ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാദത്തോടുള്ള മൃദുവായ വൈരുധ്യവും ആശയമാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: τὴν πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്നതിന്റെ പ്രാഥമിക അർഥം നിലനിർത്തുന്നു; ഇവിടെ വ്യക്തിയുടെ വിശ്വാസത്തോടൊപ്പം ക്രിസ്തുവിലൂടെ ആരംഭിച്ച വിശ്വാസത്തിന്റെ കാലഘട്ടവും സൂചിപ്പിക്കപ്പെടാം.
- source_word: ὑπὸ νόμον
  choice: നിയമത്തിൻകീഴിൽ
  rationale: നിയമത്തിന്റെ അധികാരത്തിനോ ഭരണക്രമത്തിനോ കീഴിലുള്ള അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐφρουρούμεθα
  choice: കാവലിൽ സൂക്ഷിക്കപ്പെട്ടും ... ഇരുന്നു
  rationale: imperfect passive സൂചിപ്പിക്കുന്ന തുടർന്നുനിന്ന ഭൂതകാലാവസ്ഥയും കാവൽ എന്ന അടിസ്ഥാനരൂപകവും നിലനിർത്തുന്നു.
- source_word: συγκλειόμενοι
  choice: അടച്ചിടപ്പെട്ടും
  rationale: ചുറ്റിയടയ്ക്കുക, പുറത്തുപോകാൻ അനുവദിക്കാതിരിക്കുക എന്ന നിയന്ത്രണാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς
  choice: '... വരെ'
  rationale: ഇവിടെ വരാനിരിക്കുന്ന വെളിപ്പെടുത്തലിലേക്കുള്ള കാലപരവും ലക്ഷ്യോന്മുഖവുമായ നീക്കം സന്ദർഭത്തിൽ ‘വരെ’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: വെളിപ്പെടാനിരുന്ന വിശ്വാസം വെളിപ്പെടുന്നതുവരെ
  rationale: μέλλωയുടെ ഭാവിസൂചനയും ἀποκαλύπτωയുടെ വെളിപ്പെടുത്തൽഭാഷയും സംരക്ഷിക്കുന്നു; ആവർത്തനം ഗ്രീക്കിലെ വിശ്വാസവും അതിന്റെ വെളിപ്പെടലും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πίστις വ്യക്തിപരമായ വിശ്വാസമാണോ, ക്രിസ്തുവോടെ ആരംഭിക്കുന്ന രക്ഷാചരിത്രഘട്ടമാണോ
  choice: മുഖ്യപാഠത്തിൽ ‘വിശ്വാസം’ എന്നു നൽകി ഇരു സാധ്യതകൾക്കും ഇടം നൽകി.
  alternative: ‘ആ വിശ്വാസം’ അല്ലെങ്കിൽ ‘വിശ്വാസത്തിന്റെ കാലഘട്ടം’
  rationale: ഗ്രീക്കിലെ article-ഉം ഗലാത്യർ 3-ലെ കാലഘട്ടപരമായ വൈരുധ്യവും വിശ്വാസത്തെ രക്ഷാചരിത്രപരമായി മനസ്സിലാക്കാൻ ഇടനൽകുന്നു; എന്നാൽ വിശദീകരണാത്മകമായ പരിഭാഷ ഒരു അർഥം അനാവശ്യമായി ഉറപ്പിക്കും.
- issue: നിയമത്തിൻകീഴിലെ അവസ്ഥ സംരക്ഷണമാണോ തടങ്കലാണോ
  choice: ‘കാവലിൽ സൂക്ഷിക്കപ്പെട്ടും അടച്ചിടപ്പെട്ടും’ എന്ന രണ്ടു രൂപകങ്ങളും നിലനിർത്തി.
  alternative: പൂർണമായും സംരക്ഷണാത്മകമായി ‘കാത്തുസൂക്ഷിക്കപ്പെട്ടു’ എന്നോ പൂർണമായും ശിക്ഷാത്മകമായി ‘തടവിലാക്കപ്പെട്ടു’ എന്നോ നൽകുക
  rationale: φρουρέωയും συγκλείωയും ചേർന്ന് സംരക്ഷണത്തിന്റെയും നിയന്ത്രണത്തിന്റെയും പിരിമുറുക്കം സൃഷ്ടിക്കുന്നു; അതിനെ ഒരൊറ്റ ദിശയിൽ തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘നിയമത്തിൻകീഴിൽ’ എന്ന പൗലോസീയ പ്രയോഗവും കാവൽ–അടച്ചിടൽ എന്നീ ഇരട്ടരൂപകങ്ങളും സംരക്ഷിച്ചു; സാങ്കേതിക ദൈവശാസ്ത്രപദങ്ങൾ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി.
