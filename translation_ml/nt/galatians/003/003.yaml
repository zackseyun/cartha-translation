id: GAL.3.3
reference: Galatians 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως ἀνόητοί ἐστε; ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: ml
  text: നിങ്ങൾ ഇത്ര വിവേകശൂന്യരാണോ? ആത്മാവിനാൽ[a] ആരംഭിച്ചിട്ട്, ഇപ്പോൾ ജഡത്താൽ[b] പൂർണരാക്കപ്പെടുകയാണോ?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആത്മാവിൽ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ജഡത്താൽ’ എന്നത് ഇവിടെ ‘മനുഷ്യപ്രയത്നത്താൽ’ എന്നും, സാധ്യതയായി ‘പാപസ്വഭാവത്താൽ’ എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘പൂർത്തിയാക്കപ്പെടുകയാണോ?’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἀνόητοί
  choice: ഇത്ര വിവേകശൂന്യർ
  rationale: രൂക്ഷമായ വാക്ചോദ്യത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട്, സാധാരണ ആധുനിക മലയാളത്തിൽ ബുദ്ധിയില്ലായ്മയേക്കാൾ തിരിച്ചറിവിന്റെയും വിവേചനത്തിന്റെയും അഭാവം സൂചിപ്പിക്കുന്നു.
- source_word: ἐναρξάμενοι
  choice: ആരംഭിച്ചിട്ട്
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും, ആരംഭവും ഇപ്പോഴത്തെ ശ്രമവും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πνεύματι
  choice: ആത്മാവിനാൽ
  rationale: സന്ദർഭം പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു; കരണം/മാർഗം സൂചിപ്പിക്കുന്ന ദത്തിവിനെ ‘-ിനാൽ’ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: മുമ്പത്തെ ആരംഭവും നിലവിലെ നിലപാടും തമ്മിലുള്ള കാലപരമായ വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: σαρκὶ
  choice: ജഡത്താൽ
  rationale: പൗലോസിന്റെ ആത്മാവ്–ജഡം വൈരുധ്യം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു; മനുഷ്യപ്രയത്നം, പാപസ്വഭാവം എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπιτελεῖσθε
  choice: പൂർണരാക്കപ്പെടുകയാണോ
  rationale: വർത്തമാനകാല മധ്യ/കർമണി രൂപത്തിന്റെ പ്രക്രിയാത്മകവും കർമണിസദൃശവുമായ അർഥം നിലനിർത്തുന്നു; ‘സമ്പൂർണതയിലേക്കു കൊണ്ടുവരപ്പെടുക’ എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: πνεύματι എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പരിശുദ്ധാത്മാവ്
  alternative: മനുഷ്യാത്മാവ് അഥവാ ആത്മീയ തത്ത്വം
  rationale: ഗലാത്യർ 3-ന്റെ അടുത്ത സന്ദർഭത്തിൽ ആത്മാവിനെ സ്വീകരിക്കൽ, അത്ഭുതപ്രവർത്തനം, വിശ്വാസം എന്നിവ ചർച്ച ചെയ്യപ്പെടുന്നതിനാൽ പരിശുദ്ധാത്മാവാണ് ഏറ്റവും ശക്തമായ വായന.
- issue: ആത്മാവിനോടു വിരുദ്ധമായി σάρξ എന്നതിന്റെ അർഥം
  choice: ജഡം
  alternative: മനുഷ്യപ്രയത്നം; പാപസ്വഭാവം
  rationale: പൗലോസിന്റെ σάρξ എന്ന പദത്തിന് ഇവിടെ പല അർഥതലങ്ങൾ ഉണ്ടാകാം. പ്രധാനപാഠത്തിൽ ‘ജഡം’ നിലനിർത്തുന്നത് ദൈവിക പ്രവർത്തനവും മാനുഷിക/ജഡിക മാർഗവും തമ്മിലുള്ള സംഘർഷം മുൻകൂട്ടി തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: ἐπιτελεῖσθε എന്ന ക്രിയയുടെ ഭാവം
  choice: പൂർണരാക്കപ്പെടുന്നു
  alternative: പൂർത്തിയാക്കപ്പെടുന്നു; പൂർത്തിയാക്കുന്നു
  rationale: രൂപം മധ്യമായോ കർമണിയായോ ഗ്രഹിക്കാവുന്നതാണ്. സന്ദർഭത്തിലെ ദൈവിക തുടക്കവും ജഡിക മാർഗത്തിലൂടെ സമാപനം തേടുന്നതും തമ്മിലുള്ള പരിഹാസഭരിതമായ വൈരുധ്യം കർമണിസദൃശ പരിഭാഷ നന്നായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും നേരിട്ടുള്ളതുമായ വാക്ചോദ്യശൈലി. പൗലോസിന്റെ ‘ആത്മാവ്–ജഡം’ പദസഞ്ചയം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സൂക്ഷിച്ചിട്ടുണ്ട്; അടിക്കുറിപ്പുകൾ യഥാർത്ഥ ഭാഷയിലെ അർഥസാധ്യതകൾ വ്യക്തമാക്കുന്നു.
