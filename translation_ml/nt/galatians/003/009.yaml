id: GAL.3.9
reference: Galatians 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: ml
  text: അതുകൊണ്ട്, വിശ്വാസമുള്ളവർ വിശ്വാസിയായ[a] അബ്രാഹാമിനോടൊപ്പം അനുഗ്രഹിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വസ്തനായ അബ്രാഹാം.”
    reason: πιστός എന്ന ഗ്രീക്ക് പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘വിശ്വാസിയായ’ എന്നും ‘വിശ്വസ്തനായ’ എന്നും അർഥസാധ്യതയുണ്ട്.
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἱ ἐκ πίστεως
  choice: വിശ്വാസമുള്ളവർ
  rationale: വിശ്വാസത്താൽ സവിശേഷരാകുന്ന ആളുകളെയാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; അർഥം അനാവശ്യമായി വികസിപ്പിക്കാതെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന രൂപമാണിത്.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: ഈ സന്ദർഭത്തിൽ πίστις എന്നത് പ്രധാനമായും വിശ്വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിശ്വസ്തത’ എന്ന അർഥമല്ല മുൻനിരയിൽ.
- source_word: εὐλογοῦνται
  choice: അനുഗ്രഹിക്കപ്പെടുന്നു
  rationale: അനുഗ്രഹം അവർ നേടിയെടുക്കുന്നതല്ല, സ്വീകരിക്കുന്നതാണ് എന്ന കർമണിപ്രയോഗവും വർത്തമാനകാലഭാവവും നിലനിർത്തുന്നു.
- source_word: σὺν
  choice: ഒപ്പം
  rationale: അബ്രാഹാമും വിശ്വാസമുള്ളവരും ഒരേ അനുഗ്രഹത്തിൽ പങ്കുചേരുന്നു എന്ന കൂട്ടായ്മയുടെ ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: വിശ്വാസിയായ അബ്രാഹാം
  rationale: ഗലാത്യർ 3-ന്റെ തൊട്ടടുത്ത സന്ദർഭത്തിൽ അബ്രാഹാമിന്റെ വിശ്വാസമാണ് ഊന്നിപ്പറയുന്നത്. πιστός എന്ന പദത്തിലെ ‘വിശ്വസ്തൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശ്വാസത്തെ കേന്ദ്രീകരിക്കുന്ന സന്ദർഭത്തിൽ πιστός എന്ന പദം അബ്രാഹാമിനെക്കുറിച്ച് എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: വിശ്വാസിയായ അബ്രാഹാം
  alternative: വിശ്വസ്തനായ അബ്രാഹാം
  rationale: πιστός എന്ന വിശേഷണത്തിന് ‘വിശ്വസിക്കുന്നവൻ’ എന്നും ‘വിശ്വസ്തൻ’ എന്നും അർഥമാകാം. അബ്രാഹാം ദൈവത്തെ വിശ്വസിച്ചതിനെക്കുറിച്ചുള്ള തൊട്ടുമുൻപത്തെ വാദം ആദ്യ അർഥത്തെ അനുകൂലിക്കുന്നു; എങ്കിലും മറ്റേ യഥാർഥ സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ കർമണിപ്രയോഗവും നിഗമനബന്ധവും നിലനിർത്തി; πιστός എന്ന പദത്തിന്റെ അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
