id: GAL.3.15
reference: Galatians 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: ml
  text: 'സഹോദരന്മാരേ[a], ഞാൻ മനുഷ്യരുടെ രീതിയിൽ സംസാരിക്കുന്നു: ഒരു മനുഷ്യൻ ഉറപ്പിച്ച ഉടമ്പടിപോലും[b] ആരും അസാധുവാക്കുകയോ അതിൽ കൂട്ടിച്ചേർക്കുകയോ ചെയ്യുന്നില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാരേ’ എന്നത് ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനമായ ἀδελφοί (adelphoi) എന്ന പദത്തിന്റെ പരിഭാഷയാണ്; പൗലോസ് അഭിസംബോധന ചെയ്യുന്ന സഹവിശ്വാസികളിൽ സ്ത്രീകളും ഉൾപ്പെട്ടിരിക്കാം.
    reason: cultural_note
  - marker: b
    text: ‘ഉടമ്പടി’ എന്നതിന് പകരം ‘വിൽപത്രം’ അഥവാ ‘നിയമപത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സ്ത്രീകളും ഉൾപ്പെട്ട വിശ്വാസിസമൂഹമായിരിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: ഞാൻ മാനുഷികമായ ഒരു ഉദാഹരണം പറയുകയാണ്
  rationale: സാധാരണ മനുഷ്യജീവിതത്തിൽനിന്നുള്ള താരതമ്യമോ നിയമപരമായ ഉദാഹരണമോ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὅμως
  choice: പോലും
  rationale: സാധാരണ മനുഷ്യരുടെ കാര്യത്തിൽപ്പോലും ഈ തത്ത്വം ബാധകമാണെന്ന വാദത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνθρώπου
  choice: ഒരു മനുഷ്യൻ
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ἀνθρώπου എന്നതിന്റെ മൂർത്തമായ മനുഷ്യസൂചന നിലനിർത്തുന്നു.
- source_word: κεκυρωμένην
  choice: ഉറപ്പിച്ച
  rationale: ഔദ്യോഗികമായി സാധൂകരിച്ച് പ്രാബല്യത്തിൽ വരുത്തിയതെന്ന പൂർണ്ണകാല നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ നിയമപരമായ ആശയം ലളിതമായി നൽകുന്നു.
- source_word: διαθήκην
  choice: ഉടമ്പടി
  rationale: അബ്രാഹാമിനോടുള്ള ദൈവിക വാഗ്ദാനവും ഉടമ്പടിയും ചർച്ച ചെയ്യുന്ന സന്ദർഭത്തിന് 'ഉടമ്പടി' ഏറ്റവും യോജിക്കുന്നു; 'വിൽപത്രം' എന്ന നിയമപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀθετεῖ
  choice: അസാധുവാക്കുകയോ
  rationale: പ്രാബല്യം ഇല്ലാതാക്കുക, റദ്ദാക്കുക എന്ന നിയമപരമായ ശക്തി വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπιδιατάσσεται
  choice: അതിനോട് എന്തെങ്കിലും കൂട്ടിച്ചേർക്കുകയോ
  rationale: കൂടുതൽ വ്യവസ്ഥകൾ ചേർക്കുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: διαθήκη എന്നത് 'ഉടമ്പടി' എന്നോ 'വിൽപത്രം' എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ഉടമ്പടി
  alternative: വിൽപത്രം / മരണപത്രം
  rationale: ഗലാത്യർ 3-ലെ അബ്രാഹാമിക വാഗ്ദാന-ഉടമ്പടി സന്ദർഭവുമായി 'ഉടമ്പടി' തുടർച്ച പുലർത്തുന്നു. എന്നാൽ ഗ്രീക്ക് പദത്തിനുള്ള നിയമപരമായ 'വിൽപത്രം' എന്ന അർഥസാധ്യത യഥാർഥമായതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. നിയമപരമായ ആശയം നിലനിർത്തുമ്പോഴും അതിസാങ്കേതിക പദപ്രയോഗം ഒഴിവാക്കി. ഗ്രീക്കിലെ വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിന് അനുസരിച്ച് ക്രമപ്പെടുത്തി.
