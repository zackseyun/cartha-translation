    issue: The phrase “ഒരു ഉദാഹരണം” is added to the introductory idiom.
    rationale: The Greek states that Paul is speaking in human terms; it introduces an ordinary human/legal comparison but does not explicitly use a word for “example.”
  - severity: low
    issue: “അതിനോട് എന്തെങ്കിലും കൂട്ടിച്ചേർക്കുക” is slightly awkward.
    rationale: The Greek verb means add further provisions to the established covenant. “അതിൽ കൂട്ടിച്ചേർക്കുക” expresses this more directly and idiomatically.
