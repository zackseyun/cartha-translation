lexical_decisions:
- source_word: ὅτι δὲ
  choice: എന്നത്
  rationale: δὲ ഇവിടെ വാദത്തിലെ മൃദുവായ മുന്നേറ്റം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യമായ കാലസൂചകമോ ശക്തമായ വൈരുധ്യമോ ചേർക്കാതെ വാക്യഘടനയിലൂടെ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν νόμῳ
  choice: ന്യായപ്രമാണത്താൽ
  rationale: ഇവിടെ ἐν മാർഗമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. പൗലോസിന്റെ നിയമപരമായ വാദസന്ദർഭത്തിൽ ‘ന്യായപ്രമാണത്താൽ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: οὐδεὶς
  choice: ആരും ... ഇല്ല
  rationale: സാർവത്രിക നിഷേധം മലയാളത്തിലെ സ്വാഭാവിക നിഷേധഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: δικαιοῦται
  choice: നീതീകരിക്കപ്പെടുന്നു
  rationale: ക്രിയയുടെ നിയമവിധിസംബന്ധമായ അർത്ഥം നിലനിർത്തുന്ന, മലയാള ക്രൈസ്തവപ്രയോഗത്തിൽ പരിചിതമായ രൂപമാണിത്; ‘നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടുന്നു’ എന്ന വിപുലീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: παρὰ τῷ θεῷ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ വിധിയുടെ മുമ്പിലുള്ള ഒരാളുടെ നിലയെ സംക്ഷിപ്തമായും ഗൗരവമുള്ള ഭാഷയിലും വ്യക്തമാക്കുന്നു.
- source_word: δῆλον
  choice: വ്യക്തമാണ്
  rationale: വാദത്തിലെ തെളിമ സൂചിപ്പിക്കുന്ന impersonal predicate-ന് സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: Ὁ δίκαιος
  choice: നീതിമാൻ
  rationale: വിശേഷണത്തിന്റെ നാമവാചകപ്രയോഗം സംക്ഷിപ്തമായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐκ πίστεως
  choice: വിശ്വാസത്താൽ
  rationale: πίστις-ന്റെ പ്രാഥമിക വിവർത്തനമായി ‘വിശ്വാസം’ സ്വീകരിക്കുന്നു; ‘വിശ്വസ്തത’ എന്ന സാധ്യമായ അർത്ഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ζήσεται
  choice: ജീവിക്കും
  rationale: ഭാവികാലത്തെ ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: Ὁ δίκαιος ἐκ πίστεως ζήσεται എന്ന ഉദ്ധരണിയുടെ വ്യാഖ്യാനബന്ധം
  choice: “നീതിമാൻ വിശ്വാസത്താൽ ജീവിക്കും”
  alternative: “വിശ്വാസത്താൽ നീതിമാനായവൻ ജീവിക്കും” അല്ലെങ്കിൽ “നീതിമാൻ വിശ്വസ്തതയാൽ ജീവിക്കും”
  rationale: ഗ്രീക്കിലെ വാക്യഘടനാപരമായ തുറന്ന നിലയെ മുഖ്യപാഠം പൂർണമായി പരിഹരിക്കുന്നില്ല. പതിവും നേരിട്ടുള്ളതുമായ വായന മുഖ്യപാഠത്തിൽ നൽകി, πίστις-ന്റെ ‘വിശ്വസ്തത’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘ന്യായപ്രമാണം,’ ‘നീതീകരിക്കപ്പെടുക’ എന്നീ സ്ഥാപിത പദങ്ങൾ നിയമവിധിസംബന്ധമായ ആശയം സംക്ഷിപ്തമായി നിലനിർത്താൻ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
