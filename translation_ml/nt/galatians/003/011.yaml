  text: ന്യായപ്രമാണത്താൽ ദൈവസന്നിധിയിൽ ആരും നീതീകരിക്കപ്പെടുന്നില്ല എന്നത് വ്യക്തമാണ്; കാരണം, “നീതിമാൻ വിശ്വാസത്താൽ ജീവിക്കും.”[b][a]
