language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: ml
  text: 'എന്നാൽ, യേശു മശീഹയിലുള്ള വിശ്വാസത്താൽ[a] വാഗ്ദാനം വിശ്വസിക്കുന്നവർക്കു നൽകപ്പെടേണ്ടതിന്, തിരുവെഴുത്ത് സകലത്തെയും പാപത്തിൻകീഴിൽ തടവിലാക്കി[b].


    [a] മറ്റൊരു വിവർത്തനം: “യേശു മശീഹയുടെ വിശ്വസ്തതയാൽ.”


    [b] മറ്റൊരു വിവർത്തനം: “സകലത്തെയും പാപത്തിൻകീഴിൽ അടച്ചിട്ടു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു വിവർത്തനം: “യേശു മശീഹയുടെ വിശ്വസ്തതയാൽ.”'
    reason: alternative_reading
  - marker: b
    text: 'മറ്റൊരു വിവർത്തനം: “സകലത്തെയും പാപത്തിൻകീഴിൽ അടച്ചിട്ടു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: തടവിലാക്കി
  rationale: പാപത്തിൻകീഴിൽ നിയന്ത്രിതമായി അടച്ചുവെച്ചിരിക്കുന്നതിന്റെ ശക്തമായ രൂപകം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡ γραφή
  choice: തിരുവെഴുത്ത്
  rationale: ഏകവചനത്തിലുള്ള ഗ്രീക്ക് പ്രയോഗവും തിരുവെഴുത്തിനെ പ്രവർത്തിക്കുന്ന ഏകീകൃത സാക്ഷിയായി അവതരിപ്പിക്കുന്ന പൗലോസിന്റെ വ്യക്തിവൽക്കരണവും സംരക്ഷിക്കുന്നു.
- source_word: τὰ πάντα
  choice: സകലത്തെയും
  rationale: നപുംസകലിംഗ ബഹുവചനത്തിന്റെ വിശാലവും സമഗ്രവുമായ വ്യാപ്തി ആളുകളിലേക്കു മാത്രമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ὑπὸ ἁμαρτίαν
  choice: പാപത്തിൻകീഴിൽ
  rationale: പാപത്തിന്റെ അധീനത എന്ന രൂപകം വ്യാഖ്യാനപരമായ വിപുലീകരണം കൂടാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἡ ἐπαγγελία
  choice: വാഗ്ദാനം
  rationale: ഗ്രീക്ക് നാമത്തിന്റെ സാധാരണ അർഥം കാത്തുസൂക്ഷിക്കുകയും ‘വാഗ്ദത്തദാനം’ എന്ന വിശദീകരണം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയിലുള്ള വിശ്വാസത്തിന്റെ അടിസ്ഥാനത്തിൽ
  rationale: വിവാദവിധേയമായ πίστις Χριστοῦ ഘടനയെ മുഖ്യപാഠത്തിൽ സാധാരണ objective-genitive വായനയായി അവതരിപ്പിക്കുന്നു; subjective-genitive വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός യേശുവിനോടു ചേർന്ന ഒരു പദവിയായതിനാൽ അതിന്റെ മശീഹാത്മക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: δοθῇ
  choice: നൽകപ്പെടേണ്ടിയിരുന്നു
  rationale: ἵνα-യോടു ചേർന്ന aorist passive subjunctive-ന്റെ ഉദ്ദേശ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς πιστεύουσιν
  choice: വിശ്വസിക്കുന്നവർക്കു
  rationale: ഗ്രീക്ക് വർത്തമാനകൃദ്‌രൂപത്തിന്റെ സജീവമായ വിശ്വാസപ്രതികരണം ഒരു സ്ഥിരലേബലായി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ എന്ന genitive ഘടന
  choice: 'objective genitive: “യേശു മശീഹയിലുള്ള വിശ്വാസം”'
  alternative: 'subjective genitive: “യേശു മശീഹയുടെ വിശ്വസ്തത”'
  rationale: പൗലോസിന്റെ ഈ പ്രയോഗം യഥാർഥത്തിൽ വ്യാഖ്യാനവിവാദമുള്ളതാണ്. മുഖ്യപാഠം സാധാരണ objective-genitive വായന സ്വീകരിക്കുമ്പോഴും മറ്റേ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി ദൈവശാസ്ത്രപരമായ സംഘർഷം മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘തിരുവെഴുത്ത്’ എന്ന ഏകവചനവും ‘പാപത്തിൻകീഴിൽ തടവിലാക്കി’ എന്ന വ്യക്തിവൽക്കരിച്ച രൂപകവും ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി.
