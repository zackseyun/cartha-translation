id: GAL.3.2
reference: Galatians 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: ml
  text: 'നിങ്ങളിൽനിന്ന് ഇതൊന്നുമാത്രം എനിക്ക് അറിയണം: ന്യായപ്രമാണം അനുസരിച്ചുള്ള പ്രവൃത്തികളിലൂടെയാണോ നിങ്ങൾ ആത്മാവിനെ സ്വീകരിച്ചത്, അതോ വിശ്വാസത്തോടെ കേട്ടതിലൂടെയോ?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശ്വാസത്തിന്റെ കേൾവിയിലൂടെ’; ഈ പ്രയോഗത്തിന് ‘വിശ്വാസത്തോടെ സന്ദേശം കേട്ടതിലൂടെ’ എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ ‘വിശ്വാസം’ എന്നതിനു ‘വിശ്വസ്തത’ എന്ന സൂക്ഷ്മാർഥം നൽകുന്നത് സാധ്യത കുറഞ്ഞതാണ്; എങ്കിലും ഗ്രീക്ക് പ്രയോഗം ചുരുക്കിയതായതിനാൽ ആ അർഥവും ചിലപ്പോൾ പരിഗണിക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: ഇതൊന്നുമാത്രം
  rationale: ഗ്രീക്കിലെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി പൗലോസിന്റെ ചോദ്യത്തിന്റെ മൂർച്ച പ്രകടമാക്കുന്നു.
- source_word: θέλω μαθεῖν ἀφ’ ὑμῶν
  choice: നിങ്ങളിൽനിന്ന് ... എനിക്ക് അറിയണം
  rationale: ‘നിങ്ങളിൽനിന്ന് മനസ്സിലാക്കണം’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ മലയാളത്തിൽ, θέλω μαθεῖν എന്നതിന്റെ അന്വേഷിക്കുന്ന ഭാവവും ἀφ’ ὑμῶν എന്നതും നിലനിർത്തുന്നു.
- source_word: ἐξ ἔργων νόμου
  choice: ന്യായപ്രമാണം അനുസരിച്ചുള്ള പ്രവൃത്തികളിലൂടെ
  rationale: പദാനുപദമായ ‘ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികൾ’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കി, νόμος നിർദേശിക്കുന്ന പ്രവൃത്തികൾ എന്ന ബന്ധം വ്യക്തമാക്കുന്നു; അവയെ മാനുഷിക സൽപ്രവൃത്തികൾ എന്ന പൊതുവായ അർഥത്തിലേക്ക് വിപുലീകരിക്കുന്നില്ല.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: സന്ദർഭം ദൈവം വിശ്വാസികൾക്കു നൽകുന്ന പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ അത് മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἐλάβετε
  choice: നിങ്ങൾ ... സ്വീകരിച്ചത്
  rationale: അഒറിസ്റ്റിന്റെ ഭൂതകാലസൂചനയും പൗലോസിന്റെ നേരിട്ടുള്ള ചോദ്യരൂപവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: വിശ്വാസത്തോടെ കേട്ടതിലൂടെ
  rationale: ചുരുക്കിയ ഗ്രീക്ക് ജനിറ്റീവ് ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. ‘സന്ദേശം’ എന്നു മുഖ്യവാചകത്തിൽ ചേർക്കാതെ, കേൾക്കലും വിശ്വാസവും തമ്മിലുള്ള ബന്ധത്തിലെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ ഏറ്റവും സാധ്യതയുള്ള അർഥം ‘വിശ്വാസം’ ആണ്; ‘വിശ്വസ്തത’ എന്ന കുറവ് സാധ്യതയുള്ള സൂക്ഷ്മാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ‘ആത്മാവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: വിശ്വാസികൾക്കു നൽകപ്പെട്ട പരിശുദ്ധാത്മാവ്
  alternative: പൊതുവായ ആത്മീയാനുഭവമോ ആത്മീയശക്തിയോ
  rationale: ഗലാത്യർ 3-ലെ സമീപസന്ദർഭം ദൈവത്തിന്റെ ആത്മാവിനെ ലഭിച്ചതിനെക്കുറിച്ചായതിനാൽ വ്യക്തിയായ ദൈവാത്മാവാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചിതവ്യക്തി.
- issue: ἐξ ἀκοῆς πίστεως എന്നതിലെ ബന്ധം
  choice: വിശ്വാസത്തോടെ കേൾക്കുക
  alternative: വിശ്വാസത്തിന്റെ കേൾവി; വിശ്വാസത്തിൽ സന്ദേശം കേൾക്കുക
  rationale: ഗ്രീക്ക് ഘടന ചുരുക്കിയതും ഒന്നിലധികം ബന്ധങ്ങൾ അനുവദിക്കുന്നതുമാണ്. മുഖ്യവാചകം ഏറ്റവും സ്വാഭാവികമായ സാധ്യത നൽകുന്നു; മറ്റുള്ളവ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സുലഭവുമായ ശൈലി. ‘ന്യായപ്രമാണം’, ‘ആത്മാവ്’, ‘വിശ്വാസം’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ഗ്രീക്ക് വാക്യഘടനയുടെ അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന അവസാന പ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
