id: GAL.3.6
reference: Galatians 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: ml
  text: അബ്രാഹാം ദൈവത്തെ വിശ്വസിച്ചതും അത് അവന് നീതിയായി[a] കണക്കാക്കപ്പെട്ടതും പോലെതന്നെ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ന്യായം.”
    reason: δικαιοσύνη എന്ന ഗ്രീക്ക് പദത്തിന്റെ ‘justice’ എന്ന അർഥസാധ്യത സംരക്ഷിക്കുന്ന പദപരമായ ബദൽ.
lexical_decisions:
- source_word: καθὼς
  choice: ചെയ്തതുപോലെതന്നെ
  rationale: അബ്രാഹാമിന്റെ ഉദാഹരണത്തെ തുടർന്നുള്ള വാദവുമായി താരതമ്യപ്പെടുത്തുന്ന ശക്തി നിലനിർത്തുന്നു; മലയാളത്തിൽ വാക്യാവസാന ക്രിയാസംയോജനത്തോടൊപ്പം സ്വാഭാവികമായി വരുന്നു.
- source_word: Ἀβραὰμ
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ പേരുരൂപം.
- source_word: ἐπίστευσεν
  choice: വിശ്വസിച്ചു
  rationale: πιστεύω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘ആശ്രയിച്ചു’ എന്ന അധിക വ്യാഖ്യാനഭാവം ചേർക്കുന്നില്ല.
- source_word: τῷ θεῷ
  choice: ദൈവത്തെ
  rationale: πιστεύω-യോടുള്ള ദത്തിവ് ഇവിടെ ദൈവം പറഞ്ഞത് സത്യമെന്ന് അംഗീകരിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തിൽ വിശ്വസിച്ചു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം ഒഴിവാക്കുന്നു.
- source_word: ἐλογίσθη
  choice: കണക്കാക്കപ്പെട്ടു
  rationale: λογίζομαι എന്ന പദത്തിന്റെ കണക്കിടൽ/വിലയിരുത്തൽ ഭാവവും കർമണിപ്രയോഗവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവന്
  rationale: നീതി ആരുടെ കണക്കിൽ ചേർക്കപ്പെട്ടുവെന്ന് സൂചിപ്പിക്കുന്ന ദത്തിവ് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς δικαιοσύνην
  choice: നീതിയായി
  rationale: ഫലം അഥവാ കണക്കാക്കപ്പെട്ട നില വ്യക്തമാക്കുന്നു; പൗലോസിന്റെ δικαιοσύνη എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അമിതമായി വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ ഉദ്ധരണിയിൽ δικαιοσύνη എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നീതി
  alternative: ന്യായം
  rationale: ഇവിടെ കണക്കാക്കപ്പെട്ട ശരിയായ നിലയെ ‘നീതി’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; പദത്തിനുള്ള ‘justice’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐλογίσθη എന്ന ദൈവിക കർമണിയുടെ പ്രവർത്താവ്
  choice: പ്രവർത്താവിനെ വ്യക്തമാക്കാതെ ‘കണക്കാക്കപ്പെട്ടു’
  alternative: ‘ദൈവം കണക്കാക്കി’
  rationale: ഗ്രീക്ക് വാചകം പ്രവർത്താവിനെ നേരിട്ട് പറയുന്നില്ല; ദൈവം പ്രവർത്താവാണെന്ന സാദ്ധ്യത മലയാളത്തിൽ തുറന്നുവെക്കുന്നു, എന്നാൽ പാഠത്തിൽ ഇല്ലാത്ത കർത്താവിനെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണ്ണവിരാമത്തിനു പകരം അൽപവിരാമം നിലനിർത്തി. ‘അത്’ എന്ന സർവനാമം മൂലപാഠത്തിലെ പരാമർശസംബന്ധമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
