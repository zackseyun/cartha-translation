  text: ὅσοι γὰρ εἰς Χριστὸν ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/027.yaml
  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: ml
  text: എന്തെന്നാൽ, മശീഹയിലേക്കു സ്നാനം ഏറ്റ നിങ്ങളിൽ ഏവരും മശീഹയെ ധരിച്ചിരിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: രണ്ടിടത്തും “മശീഹ” എന്നതിന് പകരം “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “മശീഹയെ വസ്ത്രംപോലെ ധരിച്ചിരിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: നിങ്ങളിൽ ... ഏറ്റവരെല്ലാം
  rationale: ὅσοιയുടെ വ്യാപകവും ബന്ധസൂചകവുമായ അർഥം നിലനിർത്തുകയും ഗലാത്യരോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാദത്തോടുള്ള വിശദീകരണബന്ധം ഒഴിവാക്കാതെ പ്രകടമാക്കുന്നു.
- source_word: εἰς
  choice: -യിലേക്കു
  rationale: ചേരൽ/ഐക്യപ്പെടൽ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; അതിനെ ഏതെങ്കിലും പ്രത്യേക സ്നാനസിദ്ധാന്തമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: Χριστόν
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവൻ എന്ന സ്ഥാനനാമത്തിന്റെ ശക്തി വഹിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: ἐβαπτίσθητε
  choice: സ്നാനം ഏറ്റവർ
  rationale: കർമണിപ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; സ്നാനത്തിന്റെ രീതി സംബന്ധിച്ച സഭാവിഭാഗീയ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: ἐνεδύσασθε
  choice: ധരിച്ചിരിക്കുന്നു
  rationale: വസ്ത്രം ധരിക്കുന്ന രൂപകം സംക്ഷിപ്തമായും dignified ആയുമുള്ള മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്നാനപ്രയോഗം ഒരു പ്രത്യേക കൂദാശാസിദ്ധാന്തത്തെയോ സ്നാനരീതിയെയോ നിർബന്ധിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തണമോ എന്നത്
  choice: മശീഹയിലേക്കു സ്നാനം ഏറ്റവർ
  alternative: മശീഹയിൽ സംബന്ധിക്കുന്നതിനായി സ്നാനം ഏറ്റവർ; മശീഹയിലേക്കു നിമജ്ജനം ചെയ്യപ്പെട്ടവർ
  rationale: ഗ്രീക്ക് εἰς Χριστόν മശീഹയിലേക്കുള്ള ചേരൽ/ഐക്യപ്പെടൽ സൂചിപ്പിക്കുന്നു; എന്നാൽ പിൽക്കാലത്തെ കൂദാശാഫലമോ ശാരീരിക സ്നാനരീതിയോ സംബന്ധിച്ച തർക്കങ്ങൾ ഈ വാക്യം ഒറ്റയ്ക്ക് തീർപ്പാക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്നാനം ഏറ്റവർ’ സാധാരണ ക്രൈസ്തവ ഉപയോഗം നിലനിർത്തുന്നു; ‘ധരിച്ചിരിക്കുന്നു’ മൂലത്തിലെ വസ്ത്രരൂപകം സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
