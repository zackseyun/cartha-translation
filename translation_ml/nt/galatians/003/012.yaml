source:
  edition: SBLGNT
  text: ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως, ἀλλ’· Ὁ ποιήσας ⸀αὐτὰ ζήσεται ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: ml
  text: എന്നാൽ നിയമം വിശ്വാസത്തിൽനിന്നുള്ളതല്ല; മറിച്ച്, “അവയെ അനുഷ്ഠിക്കുന്നവൻ അവയാൽ ജീവിക്കും.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവയിൽ ജീവിക്കും.”
    reason: lexical_alternative
  - marker: b
    text: ലേവ്യപുസ്തകം 18:5-ൽനിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: നിയമം
  rationale: ഗ്രീക്കിലെ വിശാലമായ പൗലൊസീയ പ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മോശെയുടെ നിയമം ഉദ്ദേശ്യമാണെന്നത് വ്യക്തമാകാൻ ഇടവരുത്തുന്നു, എന്നാൽ മൂലപാഠത്തേക്കാൾ പ്രത്യേകത ചേർക്കുന്നില്ല.
- source_word: ἐκ πίστεως
  choice: വിശ്വാസത്തിൽനിന്നുള്ളതല്ല
  rationale: ἐκ എന്നതിന്റെ ഉറവിടം/അടിസ്ഥാനം സൂചിപ്പിക്കുന്ന ശക്തിയും നിയമവും വിശ്വാസവും തമ്മിലുള്ള പൗലൊസിന്റെ വൈരുധ്യവും വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀλλ’
  choice: മറിച്ച്
  rationale: മുൻവാക്യത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ ποιήσας αὐτά
  choice: അവ അനുഷ്ഠിക്കുന്നവൻ
  rationale: നിയമത്തിലെ കല്പനകളെ സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമവും പൊതുവായ ഏകവചന കർത്താവും നിലനിർത്തുന്നു; ‘അനുഷ്ഠിക്കുക’ നിയമകല്പനകൾ പ്രവർത്തിയിൽ പാലിക്കുന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ζήσεται
  choice: ജീവിക്കും
  rationale: ഭാവികാലത്തിന്റെ നേരിട്ടുള്ള അർഥം ആധുനികവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ἐν αὐτοῖς
  choice: അവയാൽ
  rationale: ഉദ്ധരണിയുടെ സന്ദർഭത്തിൽ കല്പനകൾ അനുഷ്ഠിക്കുന്നതിലൂടെ/അവയെ ആധാരമാക്കി ജീവിക്കുക എന്ന ഉപാധിസൂചന സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: നിയമവും വിശ്വാസവും തമ്മിലുള്ള പൗലൊസിന്റെ വൈരുധ്യം
  choice: “നിയമം വിശ്വാസത്തിൽനിന്നുള്ളതല്ല” എന്ന അടുത്ത വിവർത്തനം
  alternative: “നിയമം വിശ്വാസത്തെ അടിസ്ഥാനമാക്കിയുള്ളതല്ല” / “നിയമം വിശ്വാസത്തിന്റെ തത്ത്വമനുസരിച്ച് പ്രവർത്തിക്കുന്നില്ല”
  rationale: വൈരുധ്യം മയപ്പെടുത്താതെയും അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്ര വിശദീകരണം വിവർത്തനത്തിൽ മുൻകൂട്ടി നിശ്ചയിക്കാതെയും ഗ്രീക്കിലെ സംക്ഷിപ്തതയും പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. പരമ്പരാഗതമായി കൂടുതൽ പ്രത്യേക അർഥം നൽകാവുന്ന ‘ന്യായപ്രമാണം’ എന്നതിനു പകരം മൂലത്തിലെ വിശാലത നിലനിർത്താൻ ‘നിയമം’ ഉപയോഗിച്ചു.
