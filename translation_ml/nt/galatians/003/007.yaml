id: GAL.3.7
reference: Galatians 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: ml
  text: അതിനാൽ, വിശ്വാസത്തിൽനിന്നുള്ളവർ—ഇവരാണ് അബ്രാഹാമിന്റെ മക്കൾ എന്ന് അറിഞ്ഞുകൊള്ളുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: അറിഞ്ഞുകൊള്ളുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ ‘തിരിച്ചറിയുക/ഉറപ്പായി മനസ്സിലാക്കുക’ എന്ന പ്രാബല്യം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄρα
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: οἱ ἐκ πίστεως
  choice: വിശ്വാസത്തിൽനിന്നുള്ളവർ
  rationale: ἐκ എന്ന ഉറവിട/അടിസ്ഥാന ഭാവം നിലനിർത്തി, ‘വിശ്വാസംകൊണ്ട് നിർവചിക്കപ്പെടുന്നവർ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സാന്ദ്രത സംരക്ഷിക്കുന്നു.
- source_word: οὗτοι
  choice: അവരാണ്
  rationale: ഗ്രീക്കിലെ ഊന്നിയ സൂചകസർവനാമത്തിന്റെ നിർണ്ണായക ഊന്നൽ മലയാളത്തിലെ ‘-ആണ്’ ഘടനയിലൂടെ പകരുന്നു.
- source_word: υἱοί ... Ἀβραάμ
  choice: അബ്രാഹാമിന്റെ മക്കൾ
  rationale: υἱοί എന്ന പുല്ലിംഗ ബഹുവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വംശ/കുടുംബബന്ധ പദമായ ‘മക്കൾ’ എന്നു നൽകുന്നു; സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന കൂട്ടത്തെ അനാവശ്യമായി പുരുഷന്മാരിൽ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ മക്കളെന്ന തിരിച്ചറിയലിന്റെ അടിസ്ഥാനം
  choice: വിശ്വാസത്തിൽനിന്നുള്ളവരാണ് അബ്രാഹാമിന്റെ മക്കൾ
  alternative: വിശ്വസിക്കുന്നവർ അബ്രാഹാമിന്റെ മക്കളാണ്
  rationale: ἐκ πίστεως എന്ന ഘടനയെ ലളിതമായ പ്രവൃത്തിവിവരണമായി ചുരുക്കാതെ, വിശ്വാസം അടിസ്ഥാനമോ നിർണ്ണായക ഉറവിടമോ ആണെന്ന പൗലോസിന്റെ ഭാഷ നിലനിർത്തുന്നു.
- issue: οὗτοι എന്ന ഊന്നൽ
  choice: -വരാണ് ... എന്ന്
  alternative: വിശ്വാസത്തിൽനിന്നുള്ളവർ അബ്രാഹാമിന്റെ മക്കളാണ്
  rationale: ‘ഇവരാണ്/അവരാണ്’ എന്ന തിരിച്ചറിയൽ-ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു; അതിലേക്ക് അധികമായ വ്യാഖ്യാനപരമായ ഒഴിവാക്കൽഭാവം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. വാക്യക്രമം സ്വാഭാവികമാക്കിയെങ്കിലും ഗ്രീക്കിലെ നിഗമനം, വിശ്വാസത്തിന്റെ അടിസ്ഥാനഭാവം, οὗτοι-യുടെ ഊന്നൽ എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്.
