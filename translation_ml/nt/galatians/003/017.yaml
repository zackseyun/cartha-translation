- from: 'ഞാൻ ഉദ്ദേശിക്കുന്നത് ഇതാണ്: ദൈവം മുമ്പേ സ്ഥിരീകരിച്ച ഉടമ്പടിയെ, നാനൂറ്റിമുപ്പതു വർഷത്തിനുശേഷം വന്ന ന്യായപ്രമാണം അസാധുവാക്കുന്നില്ല[a]; അങ്ങനെ വാഗ്ദാനത്തെ നിർവീര്യമാക്കുന്നുമില്ല[b].'
  to: 'ഞാൻ പറയുന്നതു ഇതാണ്: ദൈവം മുമ്പേ സ്ഥിരീകരിച്ച ഒരു ഉടമ്പടിയെ നാനൂറ്റിമുപ്പത് വർഷങ്ങൾക്കുശേഷം വന്ന ന്യായപ്രമാണം, വാഗ്ദാനത്തെ നിർവീര്യമാക്കുന്നതിനായി[b], അസാധുവാക്കുന്നില്ല[a].'
  rationale: വാക്യക്രമം ക്രമീകരിച്ച് εἰς τὸ καταργῆσαι എന്ന ഗ്രീക്ക് ആശ്രിത ഘടനയെ ‘വാഗ്ദാനത്തെ നിർവീര്യമാക്കുന്നതിനായി’ എന്നു നേരിട്ട് പ്രതിഫലിപ്പിച്ചു. ഇതിലൂടെ നിയമം ഉടമ്പടിയെ അസാധുവാക്കുന്നതിന്റെ ഉദ്ദേശ്യം/ഫലം വാഗ്ദാനം ഇല്ലാതാക്കുന്നതാകുമെന്ന പൗലോസിന്റെ വാദബന്ധം വ്യക്തമായി നിലനിൽക്കുന്നു. ‘ഒരു ഉടമ്പടി’ എന്ന അനിശ്ചിതത്വവും ഗ്രീക്ക് διαθήκην-നോട് യോജിക്കുന്നു.
