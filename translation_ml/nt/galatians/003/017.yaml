id: GAL.3.17
reference: Galatians 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: ml
  text: 'ഞാൻ പറയുന്നതു ഇതാണ്: ദൈവം മുമ്പേ സ്ഥിരീകരിച്ച ഒരു ഉടമ്പടിയെ നാനൂറ്റിമുപ്പത് വർഷങ്ങൾക്കുശേഷം വന്ന ന്യായപ്രമാണം, വാഗ്ദാനത്തെ നിർവീര്യമാക്കുന്നതിനായി[b], അസാധുവാക്കുന്നില്ല[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘റദ്ദാക്കുന്നില്ല.’
    reason: ‘അസാധുവാക്കുന്നില്ല’ എന്നതിന്റെ നിയമപരമായ പദപര്യായം.
  - marker: b
    text: അഥവാ, ‘പ്രാബല്യമില്ലാതാക്കുന്നതിനായി’ അല്ലെങ്കിൽ ‘നീക്കിക്കളയുന്നതിനായി.’
    reason: ‘നിർവീര്യമാക്കുന്നതിനായി’ എന്നതിന്റെ പദപര്യായങ്ങൾ; വാഗ്ദാനം ഇല്ലാതാക്കുക എന്ന καταργέωയുടെ ശക്തമായ ആശയവും εἰς τὸ-യുടെ ഉദ്ദേശ്യം/ഫലബന്ധവും നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: ഞാൻ ഉദ്ദേശിക്കുന്നത് ഇതാണ്
  rationale: പൗലോസ് തന്റെ വാദം വിശദീകരിക്കുന്നതായി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: διαθήκην
  choice: ഉടമ്പടിയെ
  rationale: സന്ദർഭം അബ്രാഹാമിനോടുള്ള ദൈവത്തിന്റെ വാഗ്ദാനാധിഷ്ഠിത ഉടമ്പടിയെക്കുറിച്ചാണ്; ‘വിൽപ്പത്രം’ എന്ന അർഥം ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: προκεκυρωμένην
  choice: മുമ്പേ സ്ഥിരീകരിച്ച
  rationale: προ- എന്നതിലെ മുൻകാലസൂചനയും perfect participle സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന സാധുതയും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ὁ ... γεγονὼς νόμος
  choice: വന്ന ന്യായപ്രമാണം
  rationale: ചരിത്രത്തിൽ പിന്നീട് നിലവിൽ വന്ന നിയമത്തെ സൂചിപ്പിക്കുന്ന γίνομαι എന്ന ക്രിയയുടെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ വിവർത്തനം.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: നാനൂറ്റിമുപ്പതു വർഷത്തിനുശേഷം
  rationale: കാലാന്തരം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ഗ്രീക്കിലെ സംഖ്യ കൃത്യമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἀκυροῖ
  choice: അസാധുവാക്കുന്നില്ല
  rationale: ഉടമ്പടിയുടെ നിയമപരമായ സാധുത ഇല്ലാതാക്കുക എന്ന ἀκυρόωയുടെ ബലം ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: εἰς τὸ καταργῆσαι
  choice: അങ്ങനെ ... നിർവീര്യമാക്കുന്നുമില്ല
  rationale: മുൻക്രിയയുടെ ഫലം എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാഗ്ദാനം പ്രാബല്യമില്ലാതാകുന്നു എന്ന ശക്തമായ ആശയം നിലനിർത്തുന്നു.
- source_word: τὴν ἐπαγγελίαν
  choice: വാഗ്ദാനത്തെ
  rationale: ഗലാത്യർ 3-ലെ അബ്രാഹാമിക വാദത്തിൽ സ്ഥിരമായി വരുന്ന അർഥം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: διαθήκη എന്നതിന്റെ അർഥം
  choice: ഉടമ്പടി
  alternative: വിൽപ്പത്രം / നിയമപരമായ വ്യവസ്ഥ
  rationale: സമീപസന്ദർഭം അബ്രാഹാമിനോടുള്ള ദൈവത്തിന്റെ മുൻവാഗ്ദാനത്തെ ആധാരമാക്കിയതിനാൽ ‘ഉടമ്പടി’ പൗലോസിന്റെ ചരിത്ര-ദൈവശാസ്ത്രപരമായ വാദം അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: εἰς τὸ καταργῆσαι എന്നതിലെ ഉദ്ദേശ്യം/ഫലം
  choice: അങ്ങനെ ... നിർവീര്യമാക്കുന്നുമില്ല
  alternative: വാഗ്ദാനത്തെ ഇല്ലാതാക്കത്തക്കവിധം
  rationale: ഗ്രീക്ക് ഘടന ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം; മലയാളത്തിൽ ഫലബന്ധം വ്യക്തമാക്കുമ്പോഴും നിയമം യഥാർഥത്തിൽ വാഗ്ദാനം ഇല്ലാതാക്കുന്നു എന്ന ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നിയമപരമായ ആശയങ്ങൾക്ക് ‘ഉടമ്പടി’, ‘സ്ഥിരീകരിച്ച’, ‘അസാധുവാക്കുക’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
