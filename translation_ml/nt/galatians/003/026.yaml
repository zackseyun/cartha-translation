  text: πάντες γὰρ υἱοὶ θεοῦ ἐστε διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/026.yaml
  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: ml
  text: കാരണം, മശീഹയായ യേശുവിൽ[b] വിശ്വാസത്തിലൂടെ നിങ്ങൾ എല്ലാവരും ദൈവത്തിന്റെ പുത്രന്മാരാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവത്തിന്റെ മക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ‘പുത്രന്മാർ’ എന്നാണ്; ഈ പദം പുത്രസ്ഥാനത്തിന്റെയും അവകാശത്തിന്റെയും സൂചന നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗതമായി: ‘ക്രിസ്തുയേശുവിൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: നിങ്ങൾ എല്ലാവരും
  rationale: രണ്ടാംപുരുഷ ബഹുവചനമായ ἐστε-യോടൊപ്പം, അഭിസംബോധന ചെയ്യപ്പെടുന്ന സമൂഹത്തിലെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന ഊന്നൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിന് അടിസ്ഥാനമോ കാരണമോ നൽകുന്ന γάρ-ന്റെ ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: υἱοὶ
  choice: പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം സംരക്ഷിക്കുകയും പൗലോസിന്റെ പുത്രസ്ഥാനവും അവകാശവും സംബന്ധിച്ച സൂചന നിലനിർത്തുകയും ചെയ്യുന്നു; ഉൾക്കൊള്ളുന്ന വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഉടമസ്ഥതയോ ബന്ധമോ സൂചിപ്പിക്കുന്ന ജനിറ്റീവിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: διὰ τῆς πίστεως
  choice: വിശ്വാസത്തിലൂടെ
  rationale: ജനിറ്റീവിനോടുകൂടിയ διά മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു; ‘വിശ്വാസത്തിലൂടെ’ അതിനെ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: ἐν എന്നതിന്റെ ‘-യിൽ’ ബന്ധം നിലനിർത്തി, Χριστός എന്ന പദത്തെ സ്ഥാനപ്പേരായി ‘മശീഹ’ എന്നു അവതരിപ്പിക്കുന്നു. ഇതിലൂടെ ക്രിസ്തുവുമായുള്ള ഐക്യത്തിന്റെ പൗലോസീയ ഭാഷ ഇല്ലാതാക്കുന്നില്ല.
theological_decisions:
- issue: ലിംഗസൂചകമായ പുത്രസ്ഥാനഭാഷ
  choice: ദൈവത്തിന്റെ പുത്രന്മാർ
  alternative: ദൈവത്തിന്റെ മക്കൾ
  rationale: മൂലപാഠത്തിൽ υἱοὶ (‘പുത്രന്മാർ’) എന്നാണ്; ഈ രൂപം പുത്രസ്ഥാനത്തിന്റെയും അവകാശത്തിന്റെയും ആശയസൂചന സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിലെ ഉൾക്കൊള്ളുന്ന വ്യാപ്തി അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: Χριστός ഇവിടെ ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥപരമായ ഉള്ളടക്കം ‘മശീഹ’ എന്നു നൽകുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
- issue: ἐν Χριστῷ Ἰησοῦ എന്ന ഘടകത്തിന്റെ ബന്ധം
  choice: മശീഹയായ യേശുവിൽ വിശ്വാസത്തിലൂടെ
  alternative: മശീഹയായ യേശുവിലുള്ള വിശ്വാസത്തിലൂടെ
  rationale: ആദ്യരൂപം ‘മശീഹയായ യേശുവിൽ’ എന്ന ഐക്യ/മണ്ഡലബന്ധവും ‘വിശ്വാസത്തിലൂടെ’ എന്ന ഉപാധിയും ഒരുമിച്ച് നിലനിർത്തുന്നു; രണ്ടാമത്തേത് ἐν-നെ ‘വിശ്വാസം’ എന്ന പദത്തിന്റെ വിഷയമായി മാത്രം വായിക്കാൻ കൂടുതൽ സാധ്യതയുള്ളതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പുത്രന്മാർ’ എന്ന ഔപചാരിക പദം മൂലത്തിലെ പുത്രസ്ഥാന-അവകാശ സൂചനയ്ക്കായി നിലനിർത്തി; സാധാരണ വായനക്കാർക്കായി അതിന്റെ ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകി.
