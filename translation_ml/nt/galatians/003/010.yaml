revisions:
- from: നിയമത്തിന്റെ പ്രവൃത്തികളിൽനിന്നുള്ളവരായ എല്ലാവരും ശാപത്തിൻ കീഴിലാണ്[a]. എന്തെന്നാൽ, “നിയമപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന സകലത്തിലും നിലനിന്ന് അവ അനുഷ്ഠിക്കാത്ത ഏവനും ശപിക്കപ്പെട്ടവൻ”[b] എന്ന് എഴുതിയിരിക്കുന്നുവല്ലോ.
  to: നിയമത്തിന്റെ പ്രവൃത്തികളിൽനിന്നുള്ളവരായ എല്ലാവരും ശാപത്തിന്റെ കീഴിലാണ്[a]; കാരണം, “നിയമപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന സകലവും അനുഷ്ഠിക്കുന്നതിൽ തുടരാത്ത ഏവനും ശപിക്കപ്പെട്ടവനാണ്”[b] എന്ന് എഴുതിയിരിക്കുന്നു.
  rationale: ഉദ്ധരണിയിലെ നിഷേധം ἐμμένει (‘തുടരുക/നിലനിൽക്കുക’) എന്ന ക്രിയയെ നിയന്ത്രിക്കുന്നുവെന്നത് മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കി. ‘അനുഷ്ഠിക്കുന്നതിൽ തുടരാത്ത’ എന്ന മുഖ്യപാഠം സ്വാഭാവിക മലയാളത്തിൽ πᾶσιν, ἐμμένει, τοῦ ποιῆσαι αὐτά എന്നിവയുടെ സമഗ്രമായ അനുസരണ-ആവശ്യകത നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് കൂടുതൽ ഘടനാനുസൃതമായ ബദൽ നൽകുന്നു; രണ്ട് അടിക്കുറിപ്പ് ആങ്കറുകളും സംരക്ഷിച്ചു.
