  source_fidelity: 'മുഖ്യപാഠത്തിലെ ഉദ്ധരണിയിൽ നിലവിലെ ‘നിലനിന്ന് അവ അനുഷ്ഠിക്കാത്ത’ എന്ന ക്രമം ഗ്രീക്കിലെ ഒരൊറ്റ നിഷേധമായ οὐκ ἐμμένει-യെ രണ്ട് വ്യത്യസ്ത പ്രവൃത്തികളായി വായിക്കപ്പെടാൻ ഇടയാക്കുന്നു: ‘നിലനിൽക്കുകയും അനുഷ്ഠിക്കാതിരിക്കുകയും ചെയ്യുന്നവൻ.’ ‘എഴുതിയിരിക്കുന്ന സകലവും അനുഷ്ഠിക്കുന്നതിൽ തുടരാത്ത’ എന്ന രൂപം തുടർച്ചയായ അനുസരണത്തിൽ പരാജയപ്പെടുന്നതെന്ന മൂലാർഥം വ്യക്തമായി നിലനിർത്തുന്നു. ἐξ ἔργων νόμου എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ താരതമ്യേന അക്ഷരാർഥമായി സൂക്ഷിച്ചിരിക്കുന്നു.'
  naturalness: ‘ശാപത്തിന്റെ കീഴിലാണ്’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ഉദ്ധരണിയിലെ ‘സകലവും അനുഷ്ഠിക്കുന്നതിൽ തുടരാത്ത’ എന്ന പ്രയോഗം വായനാസുഗമമായി, ‘സകലത്തിലും നിലനിന്ന് അവ അനുഷ്ഠിക്കാത്ത’ എന്ന ആശയക്കുഴപ്പസാധ്യത ഒഴിവാക്കുന്നു.
  terminology: ‘നിയമം,’ ‘നിയമപുസ്തകം,’ ‘ശാപം,’ ‘അനുഷ്ഠിക്കുക’ എന്നിവ സ്ഥിരതയുള്ള തിരുവെഴുത്തുരജിസ്റ്ററിലുള്ള പ്രയോഗങ്ങളാണ്. ‘നിയമത്തിന്റെ പ്രവൃത്തികളിൽനിന്നുള്ളവരായ’ എന്ന അസാധാരണ പ്രയോഗം പൗലോസിന്റെ ἐξ ἔργων νόμου എന്ന വ്യാഖ്യാനവിവാദമുള്ള ഘടനയെ മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു; ബദൽ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
