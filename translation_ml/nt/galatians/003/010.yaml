id: GAL.3.10
reference: Galatians 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: ml
  text: നിയമത്തിന്റെ പ്രവൃത്തികളിൽനിന്നുള്ളവരായ എല്ലാവരും ശാപത്തിന്റെ കീഴിലാണ്[a]; കാരണം, “നിയമപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന സകലവും അനുഷ്ഠിക്കുന്നതിൽ തുടരാത്ത ഏവനും ശപിക്കപ്പെട്ടവനാണ്”[b] എന്ന് എഴുതിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിയമത്തിന്റെ പ്രവൃത്തികളെ ആശ്രയിക്കുന്നവർ.”
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നിയമപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന സകലത്തിലും അവ ചെയ്യുവാൻ നിലനിൽക്കാത്ത ഏവനും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: എന്തെന്നാൽ ... എല്ലാവരും
  rationale: Ὅσοι എന്നതിന്റെ ബഹുവചനവും പൊതുവ്യാപ്തിയും നിലനിർത്തുന്നു; γάρ നൽകുന്ന വിശദീകരണബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ ‘എന്തെന്നാൽ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἐξ ἔργων νόμου
  choice: നിയമത്തിന്റെ പ്രവൃത്തികളിൽനിന്നുള്ളവർ
  rationale: പൗലോസിന്റെ അസാധാരണവും ദൈവശാസ്ത്രപരമായി ഭാരമുള്ളതുമായ ‘ἐξ’ ഘടന താരതമ്യേന അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; ‘ആശ്രയിക്കുന്നവർ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: ὑπὸ κατάραν
  choice: ശാപത്തിൻ കീഴിലാണ്
  rationale: ശാപത്തിന് അധീനമായ അവസ്ഥയെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ഗ്രീക്കിൽ നിർദേശകപദമില്ലാത്തതിനാൽ ഒരു പ്രത്യേക ശാപമായി അതിനെ അതിവ്യക്തമാക്കുന്നില്ല.
- source_word: γέγραπται
  choice: എന്ന് എഴുതിയിരിക്കുന്നുവല്ലോ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന സ്ഥിരപ്രയോഗവും perfect രൂപം സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന പ്രാബല്യവും പ്രകടമാക്കുന്നു.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: ഏവനും ശപിക്കപ്പെട്ടവൻ
  rationale: πᾶς എന്നതിന്റെ സർവവ്യാപ്തി ലിംഗനിരപേക്ഷവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐμμένει
  choice: നിലനിന്ന്
  rationale: തുടർച്ചയായ ഉറച്ച അനുസരണത്തിന്റെ ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: നിയമപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന സകലത്തിലും
  rationale: πᾶσιν എന്ന സമഗ്രതയും ‘നിയമപുസ്തകം’ എന്ന തിരുവെഴുത്തുസംബന്ധമായ ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: അവ അനുഷ്ഠിക്കാത്ത
  rationale: ഇവിടെ ποιέω സൂചിപ്പിക്കുന്ന പ്രായോഗിക അനുസരണം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അവ ചെയ്യുക’ എന്ന കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ἐξ ἔργων νόμου എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ ‘നിയമത്തിന്റെ പ്രവൃത്തികളിൽനിന്നുള്ളവർ’ എന്ന് താരതമ്യേന അക്ഷരാർഥത്തിൽ നൽകി.
  alternative: ‘നിയമത്തിന്റെ പ്രവൃത്തികളെ ആശ്രയിക്കുന്നവർ’ എന്ന് വ്യാഖ്യാനാത്മകമായി നൽകാം.
  rationale: ഈ പൗലോസീയ പ്രയോഗത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഭാഷയിൽ തന്നെ തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു; സ്വാഭാവികമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിലൂടെ ലഭ്യമാക്കുന്നു.
- issue: ശാപത്തിന്റെ വ്യാപ്തിയും അടിസ്ഥാനവും
  choice: നിയമപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന സകലത്തിലും നിലനിന്ന് അവ അനുഷ്ഠിക്കാത്തവനെക്കുറിച്ചുള്ള ഉദ്ധരണിയുടെ സമഗ്രത നിലനിർത്തി.
  alternative: ‘നിയമം പൂർണമായി പാലിക്കാത്തവൻ’ എന്ന ചുരുക്ക വ്യാഖ്യാനം നൽകാം.
  rationale: ചുരുക്ക വ്യാഖ്യാനം പാഠത്തിന്റെ ‘സകലത്തിലും’, ‘നിലനിൽക്കുക’, ‘അവ ചെയ്യുക’ എന്നീ വ്യത്യസ്ത ഘടകങ്ങളെ ലയിപ്പിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. ‘നിയമത്തിന്റെ പ്രവൃത്തികളിൽനിന്നുള്ളവർ’ എന്നത് സാധാരണ മലയാളത്തിൽ അല്പം അസാധാരണമായിരുന്നാലും മൂലത്തിലെ ഉദ്ദേശപൂർവമായ ഘടനയും വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കാൻ നിലനിർത്തി; അതിന്റെ സ്വാഭാവിക വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
