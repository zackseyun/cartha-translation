language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: ml
  text: മശീഹാ[a] നമുക്കുവേണ്ടി[b] ശാപമായിത്തീർന്ന് നിയമത്തിന്റെ ശാപത്തിൽനിന്ന് നമ്മെ വീണ്ടെടുത്തു. എന്തെന്നാൽ[c], “മരത്തിൽ[d] തൂങ്ങുന്ന ഏവനും ശപിക്കപ്പെട്ടവൻ” എന്ന് എഴുതിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നമ്മുടെ പക്ഷമായി”; സന്ദർഭത്തിൽ “നമ്മുടെ സ്ഥാനത്ത്” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “കാരണം, … എന്ന് എഴുതിയിരിക്കുന്നു.”
    reason: alternative_reading
  - marker: d
    text: ഗ്രീക്കുപദത്തിന്റെ അക്ഷരാർഥം “മരം” അല്ലെങ്കിൽ “തടി” എന്നാണ്; ഇവിടെ തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ പദപ്രയോഗം നിലനിർത്താൻ “മരം” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: മശീഹാ
  rationale: ഗ്രീക്കിലെ അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ പ്രചാരമുള്ള ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐξηγόρασεν
  choice: വീണ്ടെടുത്തു
  rationale: വിലകൊടുത്തുള്ള മോചനത്തിന്റെ പശ്ചാത്തലവും പൗലോസിന്റെ രക്ഷാസംബന്ധമായ പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: κατάρας / κατάρα
  choice: ശാപം / ശാപമായിത്തീർന്ന്
  rationale: ആദ്യപ്രയോഗത്തിലെ ബന്ധരൂപവും രണ്ടാമത്തെ പ്രയോഗത്തിലെ ശക്തമായ നാമപ്രയോഗവും മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: νόμου
  choice: നിയമം
  rationale: സന്ദർഭത്തിൽ മോശെയുടെ നിയമമാണ് ഉദ്ദേശ്യമെങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ ലളിതമായ അർഥം ആധുനികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: γενόμενος
  choice: ശാപമായിത്തീർന്ന്
  rationale: പങ്കാളിക്രിയയുടെ ബന്ധവും വീണ്ടെടുപ്പ് എങ്ങനെ നടന്നു എന്ന ആശയവും ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: ὑπὲρ ἡμῶν
  choice: നമുക്കുവേണ്ടി
  rationale: പ്രയോജനത്തിനുവേണ്ടിയും പ്രതിനിധിയായും എന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ‘നമ്മുടെ സ്ഥാനത്ത്’ എന്ന കൂടുതൽ നിർദിഷ്ട വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചുമത്തുന്നില്ല.
- source_word: ὅτι γέγραπται
  choice: എന്തെന്നാൽ, … എന്ന് എഴുതിയിരിക്കുന്നു
  rationale: തുടർന്നുള്ള തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ വിശദീകരണപരവും കാരണസൂചകവുമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: Ἐπικατάρατος
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ഉദ്ധരണിയുടെ ശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: κρεμάμενος
  choice: തൂങ്ങുന്ന
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണിയിലെ പൊതുവായ പ്രസ്താവനയ്ക്ക് യോജിച്ച രൂപം.
- source_word: ξύλου
  choice: മരം
  rationale: ‘മരം’ എന്നും ‘തടി’ എന്നും അർഥമാകാവുന്ന പദത്തിൽ, ആവർത്തനപുസ്തകത്തിലെ ഉദ്ധരണിയുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്ന ‘മരം’ തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: പ്രായശ്ചിത്തഭാഷയിൽ ὑπὲρ ἡμῶν എന്നതിന്റെ വ്യാപ്തി
  choice: നമുക്കുവേണ്ടി
  alternative: നമ്മുടെ സ്ഥാനത്ത്; നമ്മുടെ പക്ഷമായി
  rationale: ὑπέρ ഉപകാരം, പക്ഷമായുള്ള പ്രവർത്തനം, സന്ദർഭാനുസൃതമായി പ്രതിനിധിത്വം എന്നിവ ഉൾക്കൊള്ളാം. ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം വിവർത്തനത്തിൽ തന്നെ നിർബന്ധിക്കാതെ അതിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: γενόμενος എന്ന പങ്കാളിക്രിയയുടെ ബന്ധം
  choice: ശാപമായിത്തീർന്ന്
  alternative: ശാപമായിത്തീർന്നതിനാൽ; ശാപമായിത്തീർന്നപ്പോൾ
  rationale: വീണ്ടെടുപ്പിന്റെ മാർഗം സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായി നൽകുന്നു; കാലപരമോ കാരണപരമോ ആയ ബന്ധം അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പരമ്പരാഗതമായി പരിചിതമായെങ്കിലും കൂടുതൽ സാങ്കേതികമായ ‘ന്യായപ്രമാണം’ എന്നതിന് പകരം ‘നിയമം’ ഉപയോഗിച്ചു. പൗലോസിന്റെ ഞെട്ടിപ്പിക്കുന്ന ‘ശാപമായിത്തീർന്നു’ എന്ന നാമപ്രയോഗം മൃദൂകരിച്ചിട്ടില്ല; വാക്യത്തിന്റെ തിരുവെഴുത്ത്-ഉദ്ധരണി ഘടനയും നിലനിർത്തി.
