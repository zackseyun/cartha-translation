revisions:
- from: അങ്ങനെയെങ്കിൽ, നിങ്ങൾക്കു ആത്മാവിനെ നൽകിക്കൊണ്ടിരിക്കുകയും നിങ്ങളുടെ ഇടയിൽ അത്ഭുതങ്ങൾ പ്രവർത്തിക്കുകയും ചെയ്യുന്നവൻ അങ്ങനെ ചെയ്യുന്നത് ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളാലാണോ, അതോ വിശ്വാസത്തോടെയുള്ള കേൾവിയാലാണോ?[a]
