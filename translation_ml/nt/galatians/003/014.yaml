    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ, ‘വാഗ്ദാനം ചെയ്യപ്പെട്ട ആത്മാവിനെ.’
    reason: alternative_reading
  revision_rationale: The revision replaces the non-purpose connective with a direct Malayalam purpose construction and retains the Greek’s two parallel ἵνα clauses. It keeps the genitive ambiguity in “ആത്മാവിന്റെ വാഗ്ദാനം,” preserves “മശീഹ” as the translated title, and retains all three footnote alternatives. Footnote anchors should be placed after their respective expressions in the text.
