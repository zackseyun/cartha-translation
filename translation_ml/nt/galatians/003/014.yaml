revisions:
- from: അങ്ങനെ അബ്രാഹാമിന്റെ അനുഗ്രഹം മശീഹയായ യേശുവിൽ[b] വിജാതീയർക്കു[a] ലഭിക്കാനും, വിശ്വാസത്തിലൂടെ ആത്മാവിന്റെ വാഗ്ദാനം[c] നാം പ്രാപിക്കാനും ഇടയാകേണ്ടതിന്.
  to: അബ്രാഹാമിന്റെ അനുഗ്രഹം മശീഹ യേശുവിൽ വിജാതീയർക്കു ലഭിക്കേണ്ടതിനും, വിശ്വാസത്തിലൂടെ നാം ആത്മാവിന്റെ വാഗ്ദാനം പ്രാപിക്കേണ്ടതിനും.
