id: GAL.3.14
reference: Galatians 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: ml
  text: അബ്രാഹാമിന്റെ അനുഗ്രഹം മശീഹ യേശുവിൽ വിജാതീയർക്കു ലഭിക്കേണ്ടതിനും, വിശ്വാസത്തിലൂടെ നാം ആത്മാവിന്റെ വാഗ്ദാനം പ്രാപിക്കേണ്ടതിനും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα … ἵνα
  choice: …ലഭിക്കാനും …പ്രാപിക്കാനും ഇടയാകേണ്ടതിന്
  rationale: രണ്ടു ἵνα ഉപവാക്യങ്ങളുടെയും ഉദ്ദേശ്യാർഥവും സമാന്തരഘടനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς τὰ ἔθνη
  choice: വിജാതീയർക്കു
  rationale: ഇവിടെ പൗലോസിന്റെ യഹൂദർ–വിജാതീയർ പശ്ചാത്തലത്തിൽ ἔθνη എന്നത് ഭൂമിശാസ്ത്രപരമായ രാജ്യങ്ങളേക്കാൾ യഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘ജനതകൾക്ക്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: അബ്രാഹാമിന്റെ അനുഗ്രഹം
  rationale: അബ്രാഹാമിനോടു ബന്ധപ്പെട്ട അനുഗ്രഹത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവാക്യത്തിന്റെ നേരായതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: γένηται
  choice: ലഭിക്കാനും
  rationale: വിജാതീയരിലേക്കു അനുഗ്രഹം എത്തിച്ചേരുക എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഗ്രീക്കിലെ സാധ്യത/ഉദ്ദേശ്യഭാവം മുഴുവൻ വാക്യഘടനയിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനികമായ ശീർഷകാർഥം പരിഭാഷപ്പെടുത്തുകയും ἐν എന്ന ബന്ധം ‘-യിൽ’ വഴി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: ആത്മാവിന്റെ വാഗ്ദാനം
  rationale: ഗ്രീക്ക് ഷഷ്ഠീബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; ‘വാഗ്ദാനം ചെയ്യപ്പെട്ട ആത്മാവ്’ എന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: λάβωμεν
  choice: നാം പ്രാപിക്കാനും
  rationale: ἵνα-യോടു ചേർന്നുള്ള സ്വീകരണാർഥവും ഒന്നാംപുരുഷ ബഹുവചനവും സൂക്ഷിക്കുന്നു.
- source_word: διὰ τῆς πίστεως
  choice: വിശ്വാസത്തിലൂടെ
  rationale: πίστις എന്നതിന്റെ സാധാരണ അർഥവും διά സൂചിപ്പിക്കുന്ന മാർഗവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നത് ശീർഷകമായി പരിഭാഷപ്പെടുത്തണമോ പരമ്പരാഗത രൂപത്തിൽ നിലനിർത്തണമോ
  choice: മശീഹയായ യേശുവിൽ
  alternative: ക്രിസ്തുയേശുവിൽ
  rationale: അബ്രാഹാമിക വാഗ്ദാനത്തെക്കുറിച്ചുള്ള ഈ വാദത്തിൽ Χριστός-ന്റെ ശീർഷകാർഥം സജീവമാണ്; അതിനാൽ ‘മശീഹ’ എന്ന് പരിഭാഷപ്പെടുത്തി, പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: τοῦ πνεύματος എന്ന ഷഷ്ഠീബന്ധത്തിന്റെ അർഥം
  choice: ആത്മാവിന്റെ വാഗ്ദാനം
  alternative: വാഗ്ദാനം ചെയ്യപ്പെട്ട ആത്മാവ്
  rationale: മൂലത്തിലെ വ്യാകരണരൂപവും അതിലുള്ള യഥാർഥ വ്യാഖ്യാനസാധ്യതയും പ്രധാന പാഠത്തിൽ തുറന്നുവെക്കുന്നു; സന്ദർഭത്തിൽ ഏറെ സാധ്യതയുള്ള വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വായനാസുഗമവുമായ ശൈലി. ‘വിജാതീയർ,’ ‘അനുഗ്രഹം,’ ‘വാഗ്ദാനം,’ ‘വിശ്വാസം’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, രണ്ടു ഉദ്ദേശ്യോപവാക്യങ്ങളും സ്വാഭാവികമായ സമാന്തര infinitival ഘടനയിൽ അവതരിപ്പിച്ചു.
