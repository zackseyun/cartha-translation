id: GAL.3.20
reference: Galatians 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ μεσίτης ἑνὸς οὐκ ἔστιν, ὁ δὲ θεὸς εἷς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: ml
  text: മധ്യസ്ഥൻ ഒരാൾക്കു മാത്രമുള്ളവനല്ല[a]; എന്നാൽ ദൈവം ഏകനാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “മധ്യസ്ഥൻ ഒരാളുടേതല്ല.” ഗ്രീക്കിലെ പ്രയോഗം സംക്ഷിപ്തവും അവ്യക്തവുമാണ്; ഇതിന്റെ അർഥം “ഒരാൾക്കുവേണ്ടി മാത്രം പ്രവർത്തിക്കുന്നില്ല” എന്നോ “ഒരു കക്ഷിക്കുവേണ്ടി മാത്രമുള്ളവനല്ല” എന്നോ ആയിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “ദൈവം ഏകനാണ്” എന്നത് ഇസ്രായേലിന്റെ ഏകദൈവവിശ്വാസ പ്രഖ്യാപനത്തെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം; ആവർത്തനം 6:4 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: മധ്യസ്ഥൻ
  rationale: രണ്ടു കക്ഷികൾക്കിടയിൽ നിന്ന് ഇടപെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ പദം; വാക്യത്തിന്റെ ഉടമ്പടി/നിയമപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἑνὸς
  choice: ഒരുവന്റേത്
  rationale: ഗ്രീക്കിലെ ‘ഒരുവന്റെ/ഒന്നിന്റെ’ എന്ന സംക്ഷിപ്തവും അവ്യക്തവുമായ ഷഷ്ഠീവിഭക്തി പ്രയോഗം കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു; ‘ഒരു കക്ഷിക്കുവേണ്ടി മാത്രം’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: οὐκ ἔστιν
  choice: അല്ല
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മക പ്രസ്താവനയെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: രണ്ടാമത്തെ δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം വ്യക്തമാക്കുന്നു; ആദ്യത്തെ δέ-യ്ക്ക് മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ വാക്യം സ്വാഭാവികമാക്കുന്നു.
- source_word: θεὸς εἷς ἐστιν
  choice: ദൈവം ഏകനാണ്
  rationale: ഗ്രീക്കിലെ ലളിതവും ഊന്നലുള്ളതുമായ ഏകദൈവപ്രഖ്യാപനം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ പൗലോസിന്റെ സംക്ഷിപ്തവും ദുഷ്കരവുമായ വാദം
  choice: “മധ്യസ്ഥൻ ഒരുവന്റേതല്ല” എന്ന താരതമ്യേന അക്ഷരാർഥമുള്ള രൂപം
  alternative: “മധ്യസ്ഥൻ ഒരു കക്ഷിക്കുവേണ്ടി മാത്രമുള്ളവനല്ല”
  rationale: നിയമം, മോശെ, ക്രിസ്തു, അല്ലെങ്കിൽ ഉടമ്പടി എന്നിവയെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കാതെ ഗ്രീക്കിലെ യഥാർഥ അവ്യക്തതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
- issue: “ദൈവം ഏകനാണ്” എന്ന പ്രഖ്യാപനത്തിന്റെ പശ്ചാത്തലം
  choice: ഏകദൈവവിശ്വാസത്തിന്റെ പ്രതിധ്വനി നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ
  alternative: “ദൈവം ഒരേയൊരു ദൈവമാണ്”
  rationale: മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തത സംരക്ഷിക്കുകയും ആവർത്തനപരമായ വിശദീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആദ്യ ഉപവാക്യത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ സംക്ഷിപ്തതയും അവ്യക്തതയും മുഖ്യവാചകത്തിൽ നിലനിർത്തി, സാധ്യതയുള്ള അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
