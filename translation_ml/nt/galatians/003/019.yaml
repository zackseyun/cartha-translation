  source_fidelity: ‘വാഗ്ദാനം ലഭിച്ച സന്തതി’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ ᾧ ἐπήγγελται (‘ആർക്കു വാഗ്ദാനം ചെയ്യപ്പെട്ടുവോ’) എന്ന ദാതിവ് ബന്ധത്തെ ‘വാഗ്ദാനം സ്വീകരിച്ച’ എന്ന ആശയത്തിലേക്കു അല്പം മാറ്റുന്നു. ആ ബന്ധം പ്രത്യക്ഷമായി നിലനിർത്തണം. മറ്റെല്ലാ പ്രധാന ഘടകങ്ങളും—നിയമത്തിന്റെ ഉദ്ദേശ്യചോദ്യം, ‘ലംഘനങ്ങൾ നിമിത്തം’ എന്ന വ്യാഖ്യാന-അവ്യക്തത, കാലപരിധി, ദൂതന്മാരിലൂടെയും മധ്യസ്ഥനിലൂടെയും ഉള്ള ഏർപ്പെടുത്തൽ—ഉറവിടത്തോട് യോജിക്കുന്നു.
  naturalness: വാക്യക്രമം പൊതുവേ സ്വാഭാവികമാണ്. എന്നാൽ ‘വാഗ്ദാനം ലഭിച്ച സന്തതി’ക്കു പകരം ബന്ധവാക്യം ഉപയോഗിക്കുന്നത് കൂടുതൽ കൃത്യവും വ്യക്തവുമാണ്. ‘ക്രമീകരിക്കപ്പെട്ടു’ സാധ്യമെങ്കിലും നിയമം ഔപചാരികമായി സ്ഥാപിക്കപ്പെട്ട ആശയത്തിന് ‘ഏർപ്പെടുത്തപ്പെട്ടു’ കൂടുതൽ സ്വാഭാവികവും യോജിച്ചതുമാണ്.
  terminology: ‘ന്യായപ്രമാണം,’ ‘ലംഘനങ്ങൾ,’ ‘സന്തതി,’ ‘ദൂതന്മാർ,’ ‘മധ്യസ്ഥൻ’ എന്നിവ മാന്യവും ആധുനിക നിലവാരമലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതുമായ പദങ്ങളാണ്. ‘സന്തതി’ σπέρμαയുടെ അബ്രാഹാമിക-വാഗ്ദാനബന്ധം സംരക്ഷിക്കുന്നു; അതിന്റെ ഏകവചന/സാമൂഹികമായ സ്വഭാവം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
