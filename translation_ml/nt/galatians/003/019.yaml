  revised_text: അങ്ങനെയെങ്കിൽ, ന്യായപ്രമാണം എന്തിനാണ്? ലംഘനങ്ങൾ നിമിത്തം അത് കൂട്ടിച്ചേർക്കപ്പെട്ടു[b]—ആർക്കു വാഗ്ദാനം ചെയ്യപ്പെട്ടുവോ ആ സന്തതി[a] വരുന്നതുവരെ. ദൂതന്മാർ മുഖാന്തരം, ഒരു മധ്യസ്ഥന്റെ കൈവഴി, അത് ഏർപ്പെടുത്തപ്പെട്ടു[c].
