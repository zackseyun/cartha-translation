id: GAL.3.19
reference: Galatians 3:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: ml
  text: അങ്ങനെയെങ്കിൽ, ന്യായപ്രമാണം എന്തിനാണ്? ലംഘനങ്ങൾ നിമിത്തം അത് കൂട്ടിച്ചേർക്കപ്പെട്ടു[b]—ആർക്കു വാഗ്ദാനം ചെയ്യപ്പെട്ടുവോ ആ സന്തതി[a] വരുന്നതുവരെ. ദൂതന്മാർ മുഖാന്തരം, ഒരു മധ്യസ്ഥന്റെ കൈവഴി, അത് ഏർപ്പെടുത്തപ്പെട്ടു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വംശജൻ” അല്ലെങ്കിൽ “പിൻതലമുറക്കാരൻ.”
    reason: lexical_alternative
  - marker: b
    text: “ലംഘനങ്ങൾ നിമിത്തം” എന്നത് ലംഘനങ്ങളെ കൈകാര്യം ചെയ്യുക, വെളിപ്പെടുത്തുക, അല്ലെങ്കിൽ തടയുക എന്നിങ്ങനെ അർഥമാക്കാം; ഗ്രീക്ക് ഇതിനെ കൂടുതൽ കൃത്യമായി നിർവചിക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: അഥവാ “ക്രമീകരിക്കപ്പെട്ടു” അല്ലെങ്കിൽ “വ്യവസ്ഥ ചെയ്യപ്പെട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: അങ്ങനെയെങ്കിൽ, ന്യായപ്രമാണം എന്തിനാണ്?
  rationale: ഗ്രീക്കിലെ അപൂർണരൂപത്തിലുള്ള ചോദ്യം ഈ വാദസന്ദർഭത്തിൽ ന്യായപ്രമാണത്തിന്റെ സ്വഭാവത്തെക്കാൾ അതിന്റെ ഉദ്ദേശ്യം ചോദിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: νόμος
  choice: ന്യായപ്രമാണം
  rationale: ഇവിടെ മോശെയുടെ ന്യായപ്രമാണമെന്ന തിരിച്ചറിയാവുന്ന ഉടമ്പടിവ്യവസ്ഥയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാള ബൈബിൾ പ്രയോഗവുമായി ബന്ധം നിലനിർത്തുന്ന പദമാണിത്.
- source_word: τῶν παραβάσεων χάριν
  choice: ലംഘനങ്ങൾ നിമിത്തം
  rationale: χάριν എന്നതിലെ കാരണം/ഉദ്ദേശ്യം സംബന്ധിച്ച അർഥവ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു; ലംഘനങ്ങളെ തടയുക, വെളിപ്പെടുത്തുക തുടങ്ങിയ പ്രത്യേക വ്യാഖ്യാനങ്ങളൊന്നും വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: προσετέθη
  choice: കൂട്ടിച്ചേർക്കപ്പെട്ടു
  rationale: ന്യായപ്രമാണം മുമ്പുണ്ടായിരുന്ന വാഗ്ദാനത്തോട് അനുബന്ധമായി ചേർക്കപ്പെട്ടതാണെന്ന προστίθημι എന്ന ക്രിയയുടെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: വരുന്നതുവരെ
  rationale: ന്യായപ്രമാണം ചേർക്കപ്പെട്ട കാലഘട്ടത്തിന്റെ പരിധി നിർണയിക്കുന്ന ഗ്രീക്ക് ഘടനയെ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: τὸ σπέρμα
  choice: സന്തതി
  rationale: σπέρμα എന്നത് അബ്രാഹാമിക വാഗ്ദാനത്തിലെ വംശപരമ്പര/സന്തതി എന്ന അർഥം വഹിക്കുന്നു. മലയാളത്തിൽ 'വിത്ത്' എന്ന പദം ഇവിടെ അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമായതിനാൽ 'സന്തതി' തിരഞ്ഞെടുത്തു; ഏകവചനരൂപം പൗലോസിന്റെ വാദബന്ധം നിലനിർത്തുന്നു.
- source_word: ᾧ ἐπήγγελται
  choice: വാഗ്ദാനം ലഭിച്ച
  rationale: ദാതാവിനെ അനാവശ്യമായി വ്യക്തമാക്കാതെ, വാഗ്ദാനത്തിന്റെ ലക്ഷ്യമായ വ്യക്തിയെയും പൂർത്തികൃത ക്രിയയുടെ നിലനിൽക്കുന്ന ഫലത്തെയും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διαταγεὶς
  choice: ക്രമീകരിക്കപ്പെട്ടു
  rationale: διατάσσω എന്നതിലെ ഔപചാരികമായി ഏർപ്പെടുത്തുക/ക്രമപ്പെടുത്തുക എന്ന അർഥം നിലനിർത്തുന്നു; അർഥപരിധി കടന്ന് ഒരു പ്രത്യേക സാങ്കേതിക ആശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: δι’ ἀγγέλων
  choice: ദൂതന്മാർ മുഖാന്തരം
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥ ഉപാധിയെ വ്യക്തമായി പകർത്തുന്നു.
- source_word: ἐν χειρὶ μεσίτου
  choice: ഒരു മധ്യസ്ഥന്റെ കൈവഴി
  rationale: ഗ്രീക്കിലെ ദൃശ്യമായ 'കൈ' പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് പ്രവർത്തനമാധ്യമം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം നൽകുന്നു.
theological_decisions:
- issue: ‘ലംഘനങ്ങൾ നിമിത്തം’ എന്നതിന്റെ അർഥം
  choice: കാരണം/ഉദ്ദേശ്യം സംബന്ധിച്ച വിശാലമായ പ്രയോഗമായി നിലനിർത്തി.
  alternative: ലംഘനങ്ങളെ തടയാൻ; ലംഘനങ്ങളെ വെളിപ്പെടുത്താൻ; ലംഘനങ്ങൾ വർധിക്കേണ്ടതിന്.
  rationale: ഗ്രീക്ക് വാചകം ഇവയിൽ ഏതെങ്കിലും ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥവ്യാപ്തിയും പരിഭാഷയിൽ സംരക്ഷിച്ചു.
- issue: σπέρμα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സന്തതി
  alternative: വിത്ത്; പിൻതലമുറക്കാരൻ; വംശജൻ.
  rationale: അബ്രാഹാമിനോടുള്ള വാഗ്ദാനത്തിന്റെ പദബന്ധവും പൗലോസ് ഊന്നുന്ന ഏകവചനവും നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികമായ രൂപം തിരഞ്ഞെടുത്തു.
- issue: ദൂതന്മാരും മധ്യസ്ഥനും വഴിയുള്ള ന്യായപ്രമാണത്തിന്റെ ഏർപ്പെടുത്തൽ
  choice: ഗ്രീക്കിലെ ഇരട്ട മധ്യസ്ഥത വ്യക്തമായി നിലനിർത്തി.
  alternative: ദൂതന്മാരാൽ ഒരു മധ്യസ്ഥൻ മുഖാന്തരം നൽകപ്പെട്ടു.
  rationale: വാചകം മധ്യസ്ഥനെ തിരിച്ചറിയിക്കുന്നില്ല; അതിനാൽ പേരോ പ്രത്യേക ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയലോ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൗലോസിന്റെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി ചോദ്യത്തിനുശേഷം രണ്ട് പ്രസ്താവനകളായി ക്രമപ്പെടുത്തി; ആശയബന്ധം ഡാഷിലൂടെ നിലനിർത്തി. ‘ന്യായപ്രമാണം’, ‘സന്തതി’, ‘മധ്യസ്ഥൻ’ എന്നീ പരിചിതമായ ദൈവശാസ്ത്രപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
