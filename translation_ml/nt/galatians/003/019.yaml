- from: അങ്ങനെയെങ്കിൽ, ന്യായപ്രമാണം എന്തിനാണ്? ലംഘനങ്ങൾ നിമിത്തം അത് കൂട്ടിച്ചേർക്കപ്പെട്ടു[b]—വാഗ്ദാനം ലഭിച്ച സന്തതി[a] വരുന്നതുവരെ. ദൂതന്മാർ മുഖാന്തരം ഒരു മധ്യസ്ഥന്റെ കൈവഴി അത് ക്രമീകരിക്കപ്പെട്ടു[c].
  to: അങ്ങനെയെങ്കിൽ, ന്യായപ്രമാണം എന്തിനാണ്? ലംഘനങ്ങൾ നിമിത്തം അത് കൂട്ടിച്ചേർക്കപ്പെട്ടു[b]—ആർക്കു വാഗ്ദാനം ചെയ്യപ്പെട്ടുവോ ആ സന്തതി[a] വരുന്നതുവരെ. ദൂതന്മാർ മുഖാന്തരം, ഒരു മധ്യസ്ഥന്റെ കൈവഴി, അത് ഏർപ്പെടുത്തപ്പെട്ടു[c].
  rationale: ᾧ ἐπήγγελταιയുടെ ദാതിവ് ബന്ധവും പൂർണക്രിയയുടെ ഫലവും ബന്ധവാക്യത്തിലൂടെ സംരക്ഷിച്ചു; ഇതിലൂടെ വാഗ്ദാനം സന്തതിക്കു ചെയ്യപ്പെട്ടതാണെന്ന അർഥം നിലനിൽക്കുന്നു, സന്തതി വാഗ്ദാനത്തിന്റെ ഉള്ളടക്കമാണെന്നോ അത് കേവലം സ്വീകരിച്ചെന്നോ വ്യാഖ്യാനിക്കപ്പെടുന്നില്ല. διαταγεὶςനെ നിയമസ്ഥാപനത്തിന്റെ ഔപചാരിക അർഥം നൽകുന്ന ‘ഏർപ്പെടുത്തപ്പെട്ടു’ എന്നു മാറ്റി. അടിക്കുറിപ്പ്-സൂചകങ്ങൾ അവയുടെ യഥാർഥ പദങ്ങളോടു ചേർന്നുതന്നെ നിലനിർത്തിയിരിക്കുന്നു.
