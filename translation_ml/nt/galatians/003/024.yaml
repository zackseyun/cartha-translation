id: GAL.3.24
reference: Galatians 3:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε ὁ νόμος παιδαγωγὸς ἡμῶν γέγονεν εἰς Χριστόν, ἵνα ἐκ πίστεως δικαιωθῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: ml
  text: അതുകൊണ്ട്, ന്യായപ്രമാണം മശീഹാവരെ[b] നമ്മുടെ പരിപാലകനായിത്തീർന്നിരിക്കുന്നു[a], നാം വിശ്വാസത്താൽ നീതീകരിക്കപ്പെടേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മേൽനോട്ടക്കാരൻ’ എന്നും പറയാം; പരമ്പരാഗതമായി ‘ഗുരു’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. ഗ്രീക്കിലെ παιδαγωγός പ്രധാനമായും ക്ലാസ്‌മുറിയിലെ അധ്യാപകനെയല്ല, ഒരു കുട്ടിയുടെ മേൽനോട്ടവും നിയന്ത്രണവും വഹിച്ചിരുന്ന ഭവനപരിപാലകനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘മശീഹാവിലേക്ക്’; ‘മശീഹാവിലേക്കു നയിക്കുന്ന’ എന്നും ഈ പ്രയോഗം മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കുന്നതിനാൽ, ആനുമാനികമായ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὁ νόμος
  choice: ന്യായപ്രമാണം
  rationale: ഗലാത്യലേഖനത്തിലെ സന്ദർഭത്തിൽ മോശെയുടെ നിയമസംവിധാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും കൃത്യവുമായ പദമാണിത്.
- source_word: παιδαγωγὸς ἡμῶν
  choice: നമ്മുടെ മേൽനോട്ടക്കാരൻ
  rationale: ഗ്രീക്കോ-റോമൻ ഭവനത്തിൽ പ്രായപൂർത്തിയാകാത്ത കുട്ടിയെ നിയന്ത്രിക്കുകയും മേൽനോട്ടം വഹിക്കുകയും ചെയ്തിരുന്ന വ്യക്തിയെയാണ് παιδαγωγός പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; ക്ലാസ്‌മുറിയിലെ അധ്യാപകൻ എന്ന അർഥം ഒഴിവാക്കാൻ ഈ പദം തിരഞ്ഞെടുത്തു.
- source_word: γέγονεν
  choice: ആയിത്തീർന്നിരിക്കുന്നു
  rationale: ഭൂതകാലത്തിൽ ഉണ്ടായ മാറ്റത്തിന്റെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: εἰς Χριστόν
  choice: മശീഹാവുവരെ
  rationale: നിയമത്തിന്റെ താൽക്കാലിക മേൽനോട്ടച്ചുമതലയുടെ ലക്ഷ്യവും പരിധിയും മശീഹായാണെന്ന സന്ദർഭാർഥം നൽകുന്നു; εἰς എന്നതിലെ ദിശാ/ലക്ഷ്യസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Χριστόν
  choice: മശീഹാ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവൻ എന്ന പദവിയുടെ ശക്തിയോടെ വരുന്നതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἵνα
  choice: -േണ്ടതിന്
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵνα-വാക്യത്തെ സ്വാഭാവികമായ മലയാള ഉദ്ദേശ്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐκ πίστεως
  choice: വിശ്വാസത്താൽ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ മാർഗമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നതിനാൽ ഈ രൂപം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: δικαιωθῶμεν
  choice: നീതീകരിക്കപ്പെടേണ്ടതിന്
  rationale: നിയമപരമായ ‘നീതിമാനായി വിധിക്കപ്പെടുക’ എന്ന ഭാവവും കർമണിപ്രയോഗവും ഉദ്ദേശ്യസൂചകമായ വിധിലിംഗവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: εἰς Χριστόν എന്ന പ്രയോഗവും ന്യായപ്രമാണത്തിന്റെ പങ്കും
  choice: ‘മശീഹാവുവരെ’ എന്ന് മുഖ്യവാചകത്തിൽ നൽകി, നിയമത്തിന്റെ താൽക്കാലിക മേൽനോട്ടച്ചുമതലയും മശീഹാ അതിന്റെ പരിധി/ലക്ഷ്യമാണെന്ന സന്ദർഭവും സൂചിപ്പിച്ചു.
  alternative: ‘മശീഹാവിലേക്ക്’ അല്ലെങ്കിൽ ‘മശീഹാവിലേക്കു നയിക്കുന്ന’
  rationale: ഗലാത്യർ 3-ലെ സമീപസന്ദർഭം കാലപരമായ പരിധിയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; എങ്കിലും εἰς എന്നതിലെ ദിശയും ലക്ഷ്യവും പൂർണമായി ഇല്ലാതാക്കാതിരിക്കാൻ മറ്റ് വായനകൾ അടിക്കുറിപ്പിൽ നൽകി.
- issue: δικαιόω എന്ന പദത്തിന്റെ നിയമപരമായ ദൈവശാസ്ത്രഭാവം
  choice: ‘നീതീകരിക്കപ്പെടുക’
  alternative: ‘നീതിമാന്മാരായി പ്രഖ്യാപിക്കപ്പെടുക’
  rationale: പൗലോസിന്റെ നിയമപരമായ പദപ്രയോഗം സംരക്ഷിക്കുന്ന പരിചിതമായ മലയാളരൂപമാണ്; പ്രക്രിയയെ അധികമായി വിശദീകരിച്ച് ഒരു പ്രത്യേക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘ന്യായപ്രമാണം’, ‘മശീഹാ’, ‘നീതീകരിക്കുക’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. [a] മേൽനോട്ടക്കാരന്റെ സാമൂഹികപങ്കിനെയും [b] εἰς Χριστόν എന്നതിലെ യഥാർഥ വ്യാഖ്യാനസാധ്യതയെയും രേഖപ്പെടുത്തുന്നു.
