  terminology: “ന്യായപ്രമാണം,” “മശീഹാ,” “വിശ്വാസത്താൽ,” and “നീതീകരിക്കപ്പെടുക” are appropriate established Malayalam Scripture terms. “മശീഹാവരെ” preserves the contextual terminus sense adopted in the English audit trail, while the note preserves the more literal directional sense of εἰς Χριστόν.
