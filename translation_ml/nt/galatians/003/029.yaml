id: GAL.3.29
reference: Galatians 3:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: ml
  text: നിങ്ങൾ മശീഹയുടേതാണെങ്കിൽ[a], അപ്പോൾ നിങ്ങൾ അബ്രാഹാമിന്റെ സന്തതിയും[b] വാഗ്ദത്തമനുസരിച്ച് അവകാശികളും ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘നിങ്ങൾ ക്രിസ്തുവിന്റേതാണെങ്കിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വിത്ത്.’ ഗ്രീക്കിൽ ഈ പദം ഇവിടെ ഏകവചനത്തിലാണ്; ഈ അധ്യായത്തിൽ മുമ്പ് പൗലോസ് ഉപയോഗിച്ച അതേ പദത്തെ ഇത് പ്രതിധ്വനിപ്പിക്കുന്നു. ‘വംശം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: മശീഹയുടേത്
  rationale: Χριστός ഇവിടെ പദവിയായി വരുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; ഷഷ്ഠീവിഭക്തി സൂചിപ്പിക്കുന്ന ഉടമസ്ഥതയെയും ബന്ധത്തെയും ‘മശീഹയുടേത്’ എന്ന രൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: σπέρμα
  choice: സന്തതി
  rationale: വംശപരമായ ഈ സന്ദർഭത്തിൽ ‘സന്തതി’ സ്വാഭാവികമായ മലയാള കൂട്ടവാചകമാണ്. ഗ്രീക്കിലെ ഏകവചനമായ ‘വിത്ത്’ എന്ന പദവും മുൻവാദവുമായുള്ള ബന്ധവും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κληρονόμοι
  choice: അവകാശികൾ
  rationale: കുടുംബപരവും ഉടമ്പടിസംബന്ധവുമായ പശ്ചാത്തലത്തിൽ κληρονόμοι എന്നതിന്റെ സ്വാഭാവിക മലയാള തത്തുല്യമാണ് ‘അവകാശികൾ’.
- source_word: κατ’ ἐπαγγελίαν
  choice: വാഗ്ദത്തമനുസരിച്ച്
  rationale: ‘അടിസ്ഥാനത്തിൽ’, ‘മാനദണ്ഡപ്രകാരം’, ‘വിധത്തിൽ’ എന്നിവയിൽ ഒന്നായി അർത്ഥം ചുരുക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: നിങ്ങൾ ... ആണെങ്കിൽ, അപ്പോൾ
  rationale: വാക്യത്തിലെ ഉപാധിയും അതിൽനിന്നുള്ള നിഗമനവും വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; δέ ഇവിടെ ലഘുവായ ബന്ധകമായതിനാൽ പ്രത്യേകമായി ഭാരപ്പെടുത്തി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
theological_decisions:
- issue: σπέρμα എന്ന ഏകവചന കൂട്ടവാചകവും ഗലാത്യർ 3-ലെ മുൻ ‘വിത്ത്’ വാദവുമായുള്ള ബന്ധവും എങ്ങനെ നിലനിർത്തണം
  choice: പ്രധാനപാഠത്തിൽ ‘സന്തതി’; അടിക്കുറിപ്പിൽ അക്ഷരാർഥമായ ‘വിത്ത്’യും ഏകവചനവും വ്യക്തമാക്കുക
  alternative: പ്രധാനപാഠത്തിൽ ‘വിത്ത്’ ഉപയോഗിക്കുക
  rationale: ‘സന്തതി’ ആധുനിക മലയാളത്തിൽ വംശപരമായ അർത്ഥം വ്യക്തമായി നൽകുന്നു; അതേസമയം അടിക്കുറിപ്പ് പൗലോസിന്റെ മുൻവാദവുമായി ബന്ധപ്പെട്ട ഗ്രീക്ക് പദത്തിന്റെ രൂപവും പ്രതിധ്വനിയും നഷ്ടപ്പെടാതെ സൂക്ഷിക്കുന്നു.
- issue: Χριστοῦ എന്നത് പദവിയായോ പേരുപോലെയോ പരിഭാഷപ്പെടുത്തണം
  choice: മശീഹയുടേത്
  alternative: ക്രിസ്തുവിന്റേത്
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός എന്ന പദവിയുടെ അർത്ഥം തുറന്നുകാട്ടുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘മശീഹയുടേത്’, ‘വാഗ്ദത്തമനുസരിച്ച്’, ‘അവകാശികൾ’ എന്നീ രൂപങ്ങൾ മൂലവാക്യത്തിന്റെ ചുരുക്കവും നിഗമനഘടനയും നിലനിർത്തുന്നു.
