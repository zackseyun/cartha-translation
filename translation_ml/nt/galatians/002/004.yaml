id: GAL.2.4
reference: Galatians 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: ml
  text: എന്നാൽ, രഹസ്യമായി അകത്തേക്കു കൊണ്ടുവന്ന വ്യാജസഹോദരന്മാർ[a] നിമിത്തം—നമുക്കു മശീഹയായ യേശുവിൽ[b] ഉള്ള സ്വാതന്ത്ര്യം ചാരവൃത്തി നടത്തി പരിശോധിക്കാനും നമ്മെ അടിമകളാക്കാനുമായി അവർ രഹസ്യമായി കടന്നുവന്നു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വ്യാജസഹോദരന്മാർ’ എന്നത് പൗലോസിന്റെ കുടുംബബന്ധസൂചകമായ പദം നിലനിർത്തുന്നു; സഹവിശ്വാസികളായി തങ്ങളെത്തന്നെ അവതരിപ്പിച്ച ആളുകളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘ക്രിസ്തുയേശുവിൽ.’
    reason: alternative_reading
lexical_decisions:
- source_word: παρεισάκτους
  choice: ഒളിച്ചുകടത്തപ്പെട്ട
  rationale: പുറത്തുനിന്ന് രഹസ്യമായി അകത്തു കൊണ്ടുവരപ്പെട്ടവർ എന്ന വിശേഷണത്തിന്റെ നിഷ്ക്രിയവും ഗൂഢവുമായ ഭാവം നിലനിർത്തുന്നു; തുടർന്നുള്ള παρεισῆλθον എന്ന ക്രിയയിൽനിന്നും ഇതിനെ വേർതിരിക്കുന്നു.
- source_word: ψευδαδέλφους
  choice: വ്യാജസഹോദരന്മാർ
  rationale: പൗലോസിന്റെ കുടുംബബന്ധസൂചകമായ പദപ്രയോഗവും ശക്തമായ വിമർശനഭാവവും നിലനിർത്തുന്നു.
- source_word: παρεισῆλθον
  choice: രഹസ്യമായി നുഴഞ്ഞുകയറി
  rationale: അവർ ഒളിഞ്ഞ ഉദ്ദേശ്യത്തോടെ അകത്തു കടന്നുവെന്ന ക്രിയയുടെ ഗൂഢഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατασκοπῆσαι
  choice: ചാരമായി നിരീക്ഷിക്കാൻ
  rationale: വെറുമൊരു നിരീക്ഷണമല്ല, ശത്രുതാപരമായ രഹസ്യപരിശോധനയാണ് ഉദ്ദേശിക്കുന്നതെന്ന ആശയം പകർന്നു നൽകുന്നു.
- source_word: ἐλευθερίαν
  choice: സ്വാതന്ത്ര്യം
  rationale: പദത്തിന്റെ സാമൂഹികവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം കേൾവിയാകുന്ന വിധത്തിൽ പകർന്നുകൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധം സൃഷ്ടിക്കുന്നു.
- source_word: καταδουλώσουσιν
  choice: അടിമകളാക്കാനും
  rationale: ഒരാളെ അടിമത്തത്തിലേക്ക് കീഴ്പ്പെടുത്തുക എന്ന ശക്തമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: നമ്മെ അടിമകളാക്കാനും
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം മുൻപുള്ള ലക്ഷ്യക്രിയയോടു ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിലെ അസാധാരണമായ ഭാവികാലപ്രയോഗം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: Χριστῷ എന്നത് സ്ഥാനപ്പേരായോ പേരിന്റെ ഭാഗംപോലെയോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹയായ യേശുവിൽ
  alternative: ക്രിസ്തുയേശുവിൽ
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός-ന്റെ ‘മശീഹ’ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം ഇപ്പോഴും പ്രസക്തമായതിനാൽ അത് പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുന്നു; സഭാപാരമ്പര്യത്തിൽ പരിചിതമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ψευδαδέλφους എന്ന കുടുംബബന്ധപദത്തിന്റെ ശക്തി
  choice: വ്യാജസഹോദരന്മാർ
  alternative: വ്യാജവിശ്വാസികൾ
  rationale: അവർ സഹവിശ്വാസികളായി അവതരിപ്പിച്ചവരാണെന്ന പൗലോസിന്റെ കുടുംബരൂപകം സംരക്ഷിക്കുന്നു; അവരുടെ അന്തിമ ആത്മീയനിലയെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം വിധി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുമെന്ന ഗ്രീക്ക് ഘടന അവസാനത്തെ ദീർഘവിരാമചിഹ്നംകൊണ്ട് നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പുകുറികൾ ഉള്ളടക്കവുമായി മറിച്ചുകിടന്നതിനാൽ, പ്രധാനപാഠത്തിൽ അവ യഥാക്രമം ബന്ധപ്പെട്ട പദങ്ങളോടു ശരിയായി ചേർത്തിരിക്കുന്നു.
