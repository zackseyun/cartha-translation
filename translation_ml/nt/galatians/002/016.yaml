id: GAL.2.16
reference: Galatians 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: ml
  text: എന്നാൽ, ഒരു മനുഷ്യൻ ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളാൽ അല്ലാതെ, യേശു മശീഹയിലുള്ള വിശ്വാസത്തിലൂടെ മാത്രമേ നീതീകരിക്കപ്പെടുന്നുള്ളു എന്ന് അറിഞ്ഞിരിക്കെ, ഞങ്ങളും മശീഹയായ യേശുവിൽ വിശ്വസിച്ചു. അങ്ങനെ, ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളാലല്ല, മശീഹയിലുള്ള വിശ്വാസത്താൽ[b] നീതീകരിക്കപ്പെടേണ്ടതിന് ഞങ്ങൾ വിശ്വസിച്ചു. എന്തെന്നാൽ, ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളാൽ ഒരു മനുഷ്യനും[c] നീതീകരിക്കപ്പെടുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അല്ലെങ്കിൽ, “മശീഹയുടെ വിശ്വസ്തതയാൽ.”
    reason: alternative_reading
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “സകല ജഡവും ... ഇല്ല.” അതായത്, ഒരു മനുഷ്യനും.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: നീതീകരിക്കപ്പെടുന്നു / നീതീകരിക്കപ്പെടാൻ / നീതീകരിക്കപ്പെടുകയില്ല
  rationale: പൗലോസിന്റെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ പ്രയോഗം നിലനിർത്തുന്നതിനായി ഒരേ മലയാളപദം തുടർച്ചയായി ഉപയോഗിച്ചു; ‘നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടുക’ എന്ന വിശദീകരണപരമായ പരാവർത്തനം മുഖ്യവാചകത്തിൽ ചേർത്തില്ല.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ഗ്രീക്കിലെ ഏകവചനത്തിലുള്ള പൊതുപ്രതിനിധിയായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξ ἔργων νόμου
  choice: ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളാൽ
  rationale: ‘നല്ല പ്രവൃത്തികൾ’ എന്ന വിശാലമായ പരാവർത്തനം ഒഴിവാക്കി പൗലോസിന്റെ സവിശേഷ പദബന്ധം സുതാര്യമായി സംരക്ഷിക്കുന്നു.
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: യേശു എന്ന മശീഹയിലുള്ള വിശ്വാസത്തിലൂടെ
  rationale: മുഖ്യവാചകത്തിൽ objective-genitive വായന സ്വീകരിച്ചു; subjective-genitive സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: ഞങ്ങളും മശീഹയായ യേശുവിൽ വിശ്വസിച്ചു
  rationale: πιστεύω εἰς എന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ ‘…യിൽ വിശ്വസിച്ചു’ എന്നു നൽകി; καὶ ἡμεῖς എന്ന ഊന്നൽ ‘ഞങ്ങളും’ എന്നതിലൂടെ നിലനിർത്തി.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: മശീഹയിലുള്ള വിശ്വാസത്താൽ
  rationale: ആദ്യത്തെ πίστις Χριστοῦ ഘടനയോടൊത്ത objective-genitive വായന മുഖ്യവാചകത്തിൽ നൽകി; മറുവായന അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: Χριστός
  choice: മശീഹ
  rationale: ഗ്രീക്ക് സ്ഥാനപ്പേരിന്റെ സജീവമായ അർഥം ലിപ്യന്തരണം ചെയ്യാതെ വിവർത്തനം ചെയ്തു.
- source_word: πᾶσα σάρξ
  choice: ഒരു മനുഷ്യനും
  rationale: നിഷേധവാക്യത്തിലെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി; ‘സകല ജഡവും’ എന്ന അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: εἰδότες δὲ
  choice: എന്നാൽ … അറിഞ്ഞിരിക്കുന്ന
  rationale: δέയുടെ മൃദുവായ വിരുദ്ധബന്ധവും participial linkage-ഉം മലയാളവാക്യഘടനയിൽ നിലനിർത്തി.
theological_decisions:
- issue: πίστις Ἰησοῦ Χριστοῦ / πίστις Χριστοῦ എന്ന genitive ഘടനയുടെ അർഥം
  choice: യേശു എന്ന മശീഹയിലുള്ള വിശ്വാസം / മശീഹയിലുള്ള വിശ്വാസം
  alternative: യേശു എന്ന മശീഹയുടെ വിശ്വസ്തത / മശീഹയുടെ വിശ്വസ്തത
  rationale: ഈ ഘടന objective genitive ആണോ subjective genitive ആണോ എന്നത് യഥാർഥത്തിൽ വിവാദവിധേയമാണ്. മുഖ്യവാചകത്തിൽ വിശ്വാസിയുടെ മശീഹയിലുള്ള വിശ്വാസം എന്ന വായന നൽകി, മറ്റേ വായന അടിക്കുറിപ്പുകളിൽ വ്യക്തമായി സംരക്ഷിച്ചു.
- issue: δικαιόω എന്ന പദത്തിന്റെ നിയമപരവും ബന്ധപരവുമായ വ്യാപ്തി
  choice: നീതീകരിക്കപ്പെടുക
  alternative: നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടുക / നീതിമാനായി കണക്കാക്കപ്പെടുക
  rationale: ഒരു വ്യാഖ്യാനപരമായ വിശദീകരണത്തിലേക്ക് അർഥം ചുരുക്കാതെ പൗലോസിന്റെ ആവർത്തിത സാങ്കേതികപദത്തിന് സ്ഥിരമായ മലയാളരൂപം ഉപയോഗിച്ചു.
- issue: πᾶσα σάρξ എന്ന തിരുവെഴുത്തുസംബന്ധിയായ പ്രയോഗം
  choice: മുഖ്യവാചകത്തിൽ ‘ഒരു മനുഷ്യനും’; അടിക്കുറിപ്പിൽ അക്ഷരാർഥം
  alternative: ‘ഒരു ജഡവും’ അല്ലെങ്കിൽ ‘സകല ജഡവും … ഇല്ല’
  rationale: അക്ഷരാർഥരൂപം ആധുനിക മലയാളത്തിൽ ശരീരമാംസത്തെയോ മൃതശരീരത്തെയോ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാം. അതിനാൽ ഉദ്ദേശിച്ച മനുഷ്യസാർവത്രികത മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കി, മൂലഭാഷയിലെ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി സ്വീകരിച്ചു. ‘ന്യായപ്രമാണം’, ‘നീതീകരിക്കപ്പെടുക’, ‘മശീഹ’ എന്നീ തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തി; ദുഷ്കരമായ ഗ്രീക്ക് genitive ഘടനകളിലെ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
