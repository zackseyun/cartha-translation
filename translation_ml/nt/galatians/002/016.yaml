  to: എന്നാൽ, ഒരു മനുഷ്യൻ ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളാൽ അല്ലാതെ, യേശു മശീഹയിലുള്ള വിശ്വാസത്തിലൂടെ മാത്രമേ നീതീകരിക്കപ്പെടുന്നുള്ളു എന്ന് അറിഞ്ഞിരിക്കെ, ഞങ്ങളും മശീഹയായ യേശുവിൽ വിശ്വസിച്ചു. അങ്ങനെ, ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളാലല്ല, മശീഹയിലുള്ള വിശ്വാസത്താൽ[b] നീതീകരിക്കപ്പെടേണ്ടതിന് ഞങ്ങൾ വിശ്വസിച്ചു. എന്തെന്നാൽ, ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളാൽ ഒരു മനുഷ്യനും[c] നീതീകരിക്കപ്പെടുകയില്ല.
