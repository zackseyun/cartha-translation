id: GAL.2.20
reference: Galatians 2:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: ml
  text: ഇനി ജീവിക്കുന്നതോ ഞാനല്ല; മശീഹയാണ് എന്നിൽ ജീവിക്കുന്നത്. ഇപ്പോൾ ജഡത്തിൽ ഞാൻ ജീവിക്കുന്ന ജീവിതം, എന്നെ സ്നേഹിക്കുകയും എനിക്കുവേണ്ടി തന്നെത്തന്നെ ഏൽപ്പിച്ചുകൊടുക്കുകയും ചെയ്ത ദൈവപുത്രനിലുള്ള വിശ്വാസത്താൽ[a] ഞാൻ ജീവിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവപുത്രന്റെ വിശ്വസ്തതയാൽ ഞാൻ ജീവിക്കുന്നു.”
    reason: πίστις എന്ന പദത്തോടു ചേർന്ന ‘ദൈവപുത്രന്റെ’ എന്ന ജനിറ്റീവ്, പുത്രനിലുള്ള വിശ്വാസത്തെയോ പുത്രന്റെ വിശ്വസ്തതയെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: Χριστός
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമത്തേക്കാൾ അഭിഷിക്തനായ രക്ഷകനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന സ്ഥാനപ്പേരായ ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: ὃ δὲ νῦν ζῶ
  choice: ഇപ്പോൾ ... ഞാൻ ജീവിക്കുന്ന ജീവിതമാകട്ടെ
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ ആപേക്ഷികപ്രയോഗം സംക്ഷിപ്തവും അധ്യാഹൃതവുമാണ്. അതിലെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിനായി ‘ജീവിതം’ എന്നു വ്യക്തമാക്കി; δέ സൂചിപ്പിക്കുന്ന വിഷയമാറ്റം ‘-മാകട്ടെ’ വഴി നിലനിർത്തി.
- source_word: σάρξ
  choice: ജഡം
  rationale: ഇവിടെ σάρξ പാപസ്വഭാവത്തെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല; ഇപ്പോഴത്തെ ഭൗതികവും മർത്യവുമായ ജീവിതാവസ്ഥയാണ് ഉദ്ദേശ്യം. പൗലോസിന്റെ പ്രധാന പദവും അതിന്റെ വ്യാപ്തിയും നിലനിർത്താൻ ‘ജഡം’ ഉപയോഗിച്ചു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: πίστις എന്നതിന് സന്ദർഭോചിതമായ പ്രാഥമിക അർത്ഥമായി ‘വിശ്വാസം’ സ്വീകരിച്ചു. ബന്ധകവിഭക്തിയുടെ മറ്റൊരു സാധ്യമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: ദൈവപുത്രനിലുള്ള
  rationale: πίστις-നോടു ചേർന്ന ജനിറ്റീവ് വ്യാകരണപരമായി ദ്വയാർഥകമാണ്. മുഖ്യപാഠത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ objective-genitive വായന സ്വീകരിച്ചു; subjective-genitive വായന അടിക്കുറിപ്പിൽ നൽകി.
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: എനിക്കുവേണ്ടി തന്നെത്തന്നെ ഏല്പിച്ചുകൊടുത്ത
  rationale: സ്വമേധയാ സ്വയം സമർപ്പിച്ചതും മറ്റുള്ളവരുടെ കയ്യിൽ ഏല്പിക്കപ്പെട്ടതുമായ ഭാവങ്ങൾ പരമാവധി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: τῇ τοῦ υἱοῦ τοῦ θεοῦ എന്നതിലെ πίστις-ജനിറ്റീവ് ബന്ധത്തിന്റെ അർത്ഥം
  choice: ദൈവപുത്രനിലുള്ള വിശ്വാസത്താൽ
  alternative: ദൈവപുത്രന്റെ വിശ്വസ്തതയാൽ
  rationale: ഇത് പൗലോസിന്റെ പ്രയോഗത്തിലെ യഥാർഥ വ്യാകരണ-ദൈവശാസ്ത്ര ദ്വയാർഥകതയാണ്. മുഖ്യപാഠത്തിൽ objective-genitive വായന സ്വീകരിച്ചെങ്കിലും subjective-genitive വായന അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി പിന്തുടർന്നു. പൗലോസിന്റെ വിരോധാഭാസം നിലനിർത്താൻ ‘ജീവിക്കുന്നതോ ഞാനല്ല’ എന്നും, σάρξ എന്ന പ്രധാന പദത്തിന്റെ ആശയവ്യാപ്തി ചുരുക്കാതിരിക്കാൻ ‘ജഡം’ എന്നും പ്രയോഗിച്ചു.
