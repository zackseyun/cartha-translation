id: GAL.2.12
reference: Galatians 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: ml
  text: യാക്കോബിൽനിന്ന് ചിലർ[a][b] വരുന്നതിനുമുമ്പ് അവൻ യെഹൂദേതരരോടൊപ്പം പതിവായി ഭക്ഷണം കഴിച്ചിരുന്നു. എന്നാൽ അവർ വന്നപ്പോൾ, പരിച്ഛേദനക്കാരെ[c] ഭയന്ന് അവൻ പിന്മാറാനും സ്വയം വേർപെടുത്താനും തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചില ആളുകൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യാക്കോബിന്റെ കൂട്ടത്തിൽനിന്ന്.’ യാക്കോബ് അവരെ ഔദ്യോഗികമായി അയച്ചുവോ എന്ന് ഗ്രീക്ക് വാചകംതന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘പരിച്ഛേദനകക്ഷിക്കാരെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ ἐλθεῖν
  choice: വരുന്നതിനുമുമ്പ്
  rationale: πρό ചേർന്ന articular infinitive-ന്റെ കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τινας
  choice: ചിലർ
  rationale: വ്യക്തികളെ സൂചിപ്പിക്കുന്ന അനിശ്ചിത ബഹുവചനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ Ἰακώβου
  choice: യാക്കോബിന്റെ അടുക്കൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ഉറവിടമോ ബന്ധമോ നിലനിർത്തുന്നു; യാക്കോബ് അവരെ ഔദ്യോഗികമായി അയച്ചുവെന്ന് വാചകത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: μετὰ τῶν ἐθνῶν
  choice: യെഹൂദേതരരോടൊപ്പം
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ ἔθνη യെഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു. ‘വിശ്വാസികൾ’ എന്നത് മൂലവാചകത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: συνήσθιεν
  choice: പതിവായി ഭക്ഷണം കഴിച്ചിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയയുടെ ആവർത്തിതമോ പതിവായതോ ആയ പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: ὑπέστελλεν
  choice: പിന്മാറാനും ... തുടങ്ങി
  rationale: പിൻവാങ്ങൽ ആരംഭിച്ച് തുടരുന്നുവെന്ന സന്ദർഭോചിതമായ അപൂർണഭൂതകാല ഭാവം പകരുന്നു.
- source_word: ἀφώριζεν ἑαυτόν
  choice: സ്വയം വേർപെടുത്താനും
  rationale: പ്രതിഫലനസർവനാമത്തിന്റെ ശക്തിയും സാമൂഹിക അകലം പാലിക്കുന്ന പ്രവൃത്തിയും നിലനിർത്തുന്നു.
- source_word: φοβούμενος
  choice: ഭയന്ന്
  rationale: കാരണസൂചനയുള്ള പങ്കാളിക്രിയയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τοὺς ἐκ περιτομῆς
  choice: പരിച്ഛേദനക്കാരെ
  rationale: പരിച്ഛേദനയാൽ തിരിച്ചറിയപ്പെടുന്ന കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘കക്ഷി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം പ്രധാനവാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἀπὸ Ἰακώβου എന്നത് യാക്കോബിന്റെ ഔദ്യോഗിക അംഗീകാരമോ അയയ്ക്കലോ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: യാക്കോബിന്റെ അടുക്കൽനിന്ന്
  alternative: യാക്കോബിന്റെ കൂട്ടത്തിൽനിന്ന്; യാക്കോബ് അയച്ചവർ
  rationale: ഗ്രീക്ക് വാചകം ഉറവിടമോ ബന്ധമോ സൂചിപ്പിക്കുന്നുവെങ്കിലും യാക്കോബ് ഔദ്യോഗികമായി അയച്ചുവെന്ന് വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ ആ ഉത്തരവാദിത്വം വാചകത്തിൽ അധികമായി ചുമത്തുന്നില്ല.
- issue: τοὺς ἐκ περιτομῆς ഒരു ഔപചാരിക കക്ഷിയെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്യണമോ
  choice: പരിച്ഛേദനക്കാരെ
  alternative: പരിച്ഛേദനകക്ഷിക്കാരെ
  rationale: മൂലവാചകം കൂട്ടത്തെ പരിച്ഛേദനയുമായി ബന്ധപ്പെടുത്തി തിരിച്ചറിയുന്നു; എന്നാൽ അതിനെ ഔപചാരികമായ ഒരു കക്ഷിയെന്ന് നിർബന്ധമായി നാമകരണം ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ജാതികൾ’ എന്നതിന് പകരം സാധാരണ വായനക്കാർക്ക് സന്ദർഭം വ്യക്തമായ ‘യെഹൂദേതരർ’ ഉപയോഗിച്ചു. അപൂർണഭൂതകാല ക്രിയകളുടെ പതിവ് പ്രവൃത്തിയും ക്രമേണ പിന്മാറുന്ന ഭാവവും മലയാളത്തിൽ പ്രകടമാക്കി; യാക്കോബിന്റെ പങ്കിനെയും പരിച്ഛേദനക്കാരുടെ സംഘടനാസ്വഭാവത്തെയും കുറിച്ചുള്ള മൂലവാചകത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളോടെ നിലനിർത്തി.
