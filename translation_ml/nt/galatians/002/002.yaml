id: GAL.2.2
reference: Galatians 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: ml
  text: എന്നാൽ, ഒരു വെളിപ്പാടിന്റെ അടിസ്ഥാനത്തിൽ ഞാൻ കയറിപ്പോയി[a]. യഹൂദരല്ലാത്തവരുടെ ഇടയിൽ ഞാൻ പ്രസംഗിക്കുന്ന സുവിശേഷം ഞാൻ അവർക്കു മുന്നിൽ അവതരിപ്പിച്ചു; എന്നാൽ പ്രമുഖരായി കരുതപ്പെട്ടവരോടു സ്വകാര്യമായി—ഞാൻ ഓടിക്കൊണ്ടിരിക്കുന്നതോ മുമ്പ് ഓടിയതോ വ്യർഥമാകാതിരിക്കാനായി[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഒരു വെളിപ്പാടു നിമിത്തം.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘സ്വാധീനമുള്ളവരായി തോന്നിയവരോട്.’'
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: ‘ഞാൻ ഓടിക്കൊണ്ടിരുന്നതോ മുമ്പ് ഓടിയതോ വ്യർഥമായിപ്പോകുമോ എന്ന ആശങ്കയാൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: ഞാൻ കയറിപ്പോയി
  rationale: ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ എന്ന അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ പറയാത്ത ‘യെരൂശലേമിലേക്ക്’ എന്ന ലക്ഷ്യസ്ഥാനം ചേർക്കുന്നില്ല.
- source_word: κατὰ ἀποκάλυψιν
  choice: ഒരു വെളിപ്പാടിനോടുള്ള പ്രതികരണമായി
  rationale: വെളിപ്പാടാണ് യാത്രയെ പ്രേരിപ്പിച്ചതെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കാരണം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀνεθέμην
  choice: അവർക്കു മുമ്പാകെ അവതരിപ്പിച്ചു
  rationale: പരിഗണനയ്ക്കായി മുമ്പിൽ വെക്കുക എന്ന അർഥം നൽകുന്നു; ഔപചാരിക കീഴടങ്ങലോ അംഗീകാരത്തിനായുള്ള സമർപ്പണമോ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: τὸ εὐαγγέλιον
  choice: സുവിശേഷം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ച, മലയാള ക്രൈസ്തവഭാഷയിൽ സുപരിചിതമായ സംക്ഷിപ്ത പദം.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: ജനതകളുടെ ഇടയിൽ
  rationale: യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ‘ജാതികൾ’ എന്ന പദത്തിന്റെ ആധുനിക സാമൂഹിക അവ്യക്തത ഒഴിവാക്കുന്നു.
- source_word: κατ’ ἰδίαν
  choice: സ്വകാര്യമായി
  rationale: പൊതുസമ്മേളനത്തിൽനിന്നു വേറിട്ട സ്വകാര്യ സാഹചര്യത്തെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: τοῖς δοκοῦσιν
  choice: പ്രമുഖരായി കണക്കാക്കപ്പെട്ടവർ
  rationale: അവർ പ്രാധാന്യമുള്ളവരായി പരിഗണിക്കപ്പെട്ടിരുന്നു എന്ന അർഥം നിലനിർത്തുന്നു; പൗലോസ് അവരുടെ പദവി പൂർണമായി അംഗീകരിച്ചോ സൂക്ഷ്മമായി പരിമിതപ്പെടുത്തിയോയെന്നത് തീർപ്പാക്കുന്നില്ല.
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: ഞാൻ ഓടിക്കൊണ്ടിരിക്കുന്നതോ ഇതിനകം ഓടിയതോ വ്യർഥമായിപ്പോകാതിരിക്കേണ്ടതിന്
  rationale: വർത്തമാന പ്രവർത്തനവും കഴിഞ്ഞ അധ്വാനവും തമ്മിലുള്ള കാലവ്യത്യാസവും ഫലശൂന്യതയെക്കുറിച്ചുള്ള ആശങ്കയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസ് സുവിശേഷം സ്വകാര്യമായി അവതരിപ്പിച്ചത് അപ്പൊസ്തലന്മാരുടെ തിരുത്തലിനോ അംഗീകാരത്തിനോ കീഴ്പ്പെടുത്തിയതാണോ
  choice: ‘അവർക്കു മുമ്പാകെ അവതരിപ്പിച്ചു’ എന്ന നിഷ്പക്ഷ ഭാഷ ഉപയോഗിച്ചു.
  alternative: ‘അവരുടെ അംഗീകാരത്തിനായി സമർപ്പിച്ചു’ അല്ലെങ്കിൽ ‘വെറും അറിയിച്ചുകൊടുത്തു’.
  rationale: ഗ്രീക്ക് ക്രിയ പരിഗണനയ്ക്കായി കാര്യം മുമ്പിൽ വെക്കുന്നതിനെ സൂചിപ്പിക്കാം; എന്നാൽ ഔപചാരിക കീഴടങ്ങലിനെയോ യാതൊരു വിലയിരുത്തലും ഇല്ലാത്ത അറിയിപ്പിനെയോ സ്വതവേ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കയറിപ്പോയി’ എന്നത് സ്ഥലനാമം കൂട്ടിച്ചേർക്കാതെ മൂലത്തിലെ ദിശാബോധം സൂക്ഷിക്കുന്നു. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ ബന്ധങ്ങൾ അർദ്ധവിരാമവും ദീർഘവിരാമവും ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ നിലനിർത്തി.
