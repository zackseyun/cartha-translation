revisions:
- from: എന്നാൽ ഒരു വെളിപ്പാടിനോടുള്ള പ്രതികരണമായിട്ടാണ് ഞാൻ കയറിപ്പോയത്[a]. ജനതകളുടെ ഇടയിൽ ഞാൻ പ്രസംഗിക്കുന്ന സുവിശേഷം ഞാൻ അവർക്കു മുമ്പാകെ അവതരിപ്പിച്ചു; എന്നാൽ അതു പ്രമുഖരായി കണക്കാക്കപ്പെട്ടവരോട്[b] സ്വകാര്യമായിട്ടായിരുന്നു—ഞാൻ ഓടിക്കൊണ്ടിരിക്കുന്നതോ ഇതിനകം ഓടിയതോ വ്യർഥമായിപ്പോകാതിരിക്കേണ്ടതിന്[c].
  to: എന്നാൽ, ഒരു വെളിപ്പാടിന്റെ അടിസ്ഥാനത്തിൽ ഞാൻ കയറിപ്പോയി[a]. യഹൂദരല്ലാത്തവരുടെ ഇടയിൽ ഞാൻ പ്രസംഗിക്കുന്ന സുവിശേഷം ഞാൻ അവർക്കു മുന്നിൽ അവതരിപ്പിച്ചു; എന്നാൽ പ്രമുഖരായി കരുതപ്പെട്ടവരോടു സ്വകാര്യമായി—ഞാൻ ഓടിക്കൊണ്ടിരിക്കുന്നതോ മുമ്പ് ഓടിയതോ വ്യർഥമാകാതിരിക്കാനായി[c][b].
