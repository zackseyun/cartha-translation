id: GAL.2.9
reference: Galatians 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: ml
  text: എനിക്കു നൽകപ്പെട്ട കൃപ തിരിച്ചറിഞ്ഞ്, തൂണുകളായി കണക്കാക്കപ്പെട്ടിരുന്ന യാക്കോബും കേഫാസും യോഹന്നാനും എനിക്കും ബർണബാസിനും കൂട്ടായ്മയുടെ വലങ്കൈകൾ നൽകി[a]—ഞങ്ങൾ ജനതകളുടെ അടുക്കലേക്കു[b] പോകാനും അവർ പരിച്ഛേദിതരുടെ അടുക്കലേക്കു[c] പോകാനും എന്ന ഉദ്ദേശ്യത്തോടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പങ്കാളിത്തത്തിന്റെ വലങ്കൈകൾ നൽകി.”
    reason: lexical_alternative
  - marker: b
    text: “ജനതകൾ” എന്നത് ഈ സന്ദർഭത്തിൽ യഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു; അഥവാ, “വിജാതീയർ.”
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ “പരിച്ഛേദനത്തിലേക്ക്”; അതായത്, യഹൂദരുടെ അടുക്കലേക്ക്.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες
  choice: തിരിച്ചറിഞ്ഞപ്പോൾ
  rationale: തുടർന്നുള്ള പ്രവൃത്തിയുടെ അടിസ്ഥാനമായ തിരിച്ചറിവും അംഗീകാരവും ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: χάριν τὴν δοθεῖσάν μοι
  choice: എനിക്കു നൽകപ്പെട്ട കൃപ
  rationale: ദൈവിക കൃപ എന്ന പൗലോസിന്റെ വിശാലമായ ആശയം ചുരുക്കാതെ നിലനിർത്തുന്നു; കൃപ മുമ്പേ നൽകപ്പെട്ടതാണെന്ന ബന്ധവും വ്യക്തമാകുന്നു.
- source_word: Κηφᾶς
  choice: കേഫാവ്
  rationale: മൂലപാഠത്തിലെ Κηφᾶς എന്ന പേരിനെ പത്രോസ് എന്നു മാറ്റാതെ മലയാളലിപിയിൽ പകർത്തുന്നു.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: തൂണുകളായി കണക്കാക്കപ്പെട്ടിരുന്ന
  rationale: അവർക്ക് പൊതുവിൽ ഉണ്ടായിരുന്ന അംഗീകൃത സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; അനാവശ്യമായ പരിഹാസമോ അവമതിപ്പോ ചേർക്കുന്നില്ല.
- source_word: δεξιὰς ... κοινωνίας
  choice: കൂട്ടായ്മയുടെ വലങ്കൈകൾ
  rationale: δεξιὰς എന്ന ബഹുവചനം സൂക്ഷിക്കുകയും, συμφതവും പങ്കാളിത്തവും അടയാളപ്പെടുത്തുന്ന കൈകോർക്കൽരൂപകത്തെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἔθνη
  choice: ജനതകൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർത്ഥം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ യഹൂദരല്ലാത്തവരെ ഉദ്ദേശിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: περιτομήν
  choice: പരിച്ഛേദനക്കാർ
  rationale: അക്ഷരാർഥത്തിലെ 'പരിച്ഛേദനം' എന്ന സമൂഹസൂചക പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന വിധം നൽകുന്നു.
theological_decisions:
- issue: κοινωνία എന്നത് 'കൂട്ടായ്മ'യോ 'പങ്കാളിത്തം'യോ
  choice: കൂട്ടായ്മ
  alternative: പങ്കാളിത്തം
  rationale: ഇവിടെ അംഗീകാരവും സഹകരണവും സംയുക്ത ദൗത്യബന്ധവും ഉൾക്കൊള്ളുന്ന വിശാലത നിലനിർത്തുന്നു; ദൗത്യപരമായ പങ്കാളിത്തം മാത്രം എന്നു അർത്ഥം ചുരുക്കുന്നില്ല.
- issue: ἔθνη എന്നത് 'ജനതകൾ' എന്നോ 'വിജാതീയർ' എന്നോ
  choice: ജനതകൾ
  alternative: വിജാതീയർ
  rationale: മൂലപദത്തിന്റെ ഭാഷാപരമായ വിശാലത പ്രധാനപാഠത്തിൽ സൂക്ഷിച്ച്, സന്ദർഭത്തിലെ യഹൂദേതര അർത്ഥം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: εἰς τὴν περιτομήν എന്നതിന്റെ സമൂഹസൂചക അർത്ഥം
  choice: പരിച്ഛേദനക്കാരുടെ അടുക്കലേക്ക്
  alternative: പരിച്ഛേദനത്തിന്റെ അടുക്കലേക്ക്
  rationale: യഹൂദജനത്തെ സൂചിപ്പിക്കുന്ന metonymy വായനക്കാരന് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; യഹൂദർ എന്ന വിശദീകരണം അടിക്കുറിപ്പിലുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യത്തിന്റെ ഔപചാരിക അപ്പൊസ്തലിക പശ്ചാത്തലം നിലനിർത്തിക്കൊണ്ട് അത്യന്തം സഭാസാങ്കേതികമായ പദങ്ങൾ ഒഴിവാക്കി. മൂലത്തിലെ ബഹുവചനമായ 'വലങ്കൈകൾ' ഉദ്ദേശപൂർവം സൂക്ഷിച്ചു.
