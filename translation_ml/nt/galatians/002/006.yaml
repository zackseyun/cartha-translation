id: GAL.2.6
reference: Galatians 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: ml
  text: പ്രമുഖരായി കണക്കാക്കപ്പെട്ടവരുടെ[a] കാര്യമെടുത്താൽ—അവർ മുമ്പ് എങ്ങനെയുള്ളവരായിരുന്നു എന്നത് എനിക്ക് ഒരു വ്യത്യാസവും ഉണ്ടാക്കുന്നില്ല; ദൈവം ആരുടെയും മുഖം നോക്കുന്നില്ല[b]—ആ പ്രമുഖരായി കണക്കാക്കപ്പെട്ടവർ എനിക്ക് കൂടുതലായി ഒന്നും കൂട്ടിച്ചേർത്തില്ല.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘എന്തോ ആയവരായി കരുതപ്പെട്ടവർ’; അതായത്, പ്രധാനപ്പെട്ടവരായി കണക്കാക്കപ്പെട്ടവർ.'
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ദൈവം മനുഷ്യന്റെ മുഖം സ്വീകരിക്കുന്നില്ല’; പക്ഷപാതം കാണിക്കാതിരിക്കുക എന്നർഥമുള്ള ഒരു പ്രയോഗം.
    reason: cultural_note
  - marker: c
    text: അല്ലെങ്കിൽ, ‘എന്റെമേൽ കൂടുതലായി ഒന്നും ചുമത്തിയില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: പ്രമുഖരായി കണക്കാക്കപ്പെട്ടവർ
  rationale: δοκέω ഇവിടെ വെറും തോന്നലിനെയല്ല, മറ്റുള്ളവർ അംഗീകരിച്ചിരുന്ന സ്ഥാനത്തെയും പ്രശസ്തിയെയും സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം അവരുടെ സ്ഥാനത്തെ അംഗീകരിക്കുമ്പോഴും പൗലോസിന്റെ അകലം പാലിക്കുന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: അവർ മുമ്പ് എങ്ങനെയുള്ളവരായിരുന്നു
  rationale: ποτε-യുടെ കാലസൂചന സ്വാഭാവികമായി നൽകുകയും അവരുടെ മുൻകാലസ്ഥാനത്തിന് പൗലോസിന്റെ വാദത്തിൽ നിർണായകതയില്ലെന്ന ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οὐδέν μοι διαφέρει
  choice: എനിക്ക് ഒരു വ്യത്യാസവും ഉണ്ടാക്കുന്നില്ല
  rationale: അവരുടെ മുൻസ്ഥാനം തന്റെ വിലയിരുത്തലിനെ ബാധിക്കുന്നില്ലെന്ന പൗലോസിന്റെ പ്രസ്താവനയെ വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: ദൈവം ആരുടെയും മുഖം നോക്കുന്നില്ല
  rationale: മൂലത്തിലെ ‘മുഖം സ്വീകരിക്കുക’ എന്ന സെമിറ്റിക് പ്രയോഗത്തിന്റെ രൂപവും പക്ഷപാതം കാണിക്കാതിരിക്കുക എന്ന അർഥവും മലയാളത്തിലെ സ്വാഭാവികമായ ‘മുഖം നോക്കുക’ എന്ന പ്രയോഗത്തിലൂടെ ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: ἐμοὶ γὰρ
  choice: എനിക്ക്
  rationale: ἐμοί എന്ന ദത്തിവിഭക്തിയെ വ്യക്തമായി നിലനിർത്തുന്നു; γάρ നൽകുന്ന വിശദീകരണബന്ധം ഇടയ്ക്കുള്ള വാക്യഘടനയും അവസാനത്തെ മുഖ്യപ്രസ്താവനയും ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: οὐδὲν προσανέθεντο
  choice: കൂടുതലായി ഒന്നും കൂട്ടിച്ചേർത്തില്ല
  rationale: προσανατίθημι എന്ന പദത്തിലെ ‘കൂടുതലായി ചേർക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദേശത്തിലേക്കുള്ള കൂട്ടിച്ചേർക്കലോ പൗലോസിന്മേലുള്ള അധികചുമതലയോ എന്ന സന്ദർഭസാധ്യമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: യെരൂശലേം നേതാക്കളോടുള്ള പൗലോസിന്റെ ഭാവം അവഹേളനമാണോ, അവരുടെ സ്ഥാനത്തിൽനിന്നുള്ള സ്വാതന്ത്ര്യമാണോ
  choice: അവരുടെ അംഗീകൃത സ്ഥാനം സൂചിപ്പിക്കുമ്പോഴും അതിന്റെ നിർണായകതയെ പൗലോസ് നിരസിക്കുന്ന അളന്ന അകലം പാലിക്കുന്ന ഭാവം
  alternative: ‘വലിയവരെന്നു തോന്നിയവർ’ എന്ന കൂടുതൽ പരിഹാസഭാവമുള്ള വിവർത്തനം, അല്ലെങ്കിൽ ‘അംഗീകൃത നേതാക്കൾ’ എന്ന മൃദുവായ വിവർത്തനം
  rationale: സുവിശേഷത്തിന്റെ സത്യം അവരുടെ പദവിയിൽ ആശ്രയിച്ചിരുന്നില്ലെന്നതാണ് പൗലോസിന്റെ ഊന്നൽ; അവരുടെ നേതൃത്വം അസാധുവായിരുന്നുവെന്ന് വാക്യം നിർബന്ധമായി പറയുന്നില്ല.
- issue: οὐδὲν προσανέθεντο സന്ദേശത്തിലേക്ക് ഒന്നും ചേർത്തില്ല എന്നാണോ, അധികബാധ്യത ഒന്നും ചുമത്തിയില്ല എന്നാണോ
  choice: പ്രധാനവാചകത്തിൽ ‘എനിക്ക് കൂടുതലായി ഒന്നും കൂട്ടിച്ചേർത്തില്ല’ എന്ന താരതമ്യേന തുറന്ന പ്രയോഗം
  alternative: ‘എന്റെമേൽ കൂടുതലായി ഒന്നും ചുമത്തിയില്ല’
  rationale: ഗ്രീക്ക് ക്രിയയുടെ അർഥവ്യാപ്തിയും സന്ദർഭത്തിലെ സാധ്യതയും അനാവശ്യമായി ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലവാക്യത്തിലെ ഇടയ്ക്കു മുറിഞ്ഞു വീണ്ടും തുടരുന്ന ഘടന ദീർഘരേഖകൾകൊണ്ട് നിലനിർത്തി. ‘പ്രമുഖരായി കണക്കാക്കപ്പെട്ടവർ’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ആവർത്തനവും പൗലോസിന്റെ സൂക്ഷ്മമായ അകലം പാലിക്കുന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
