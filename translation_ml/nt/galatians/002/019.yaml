source:
  edition: SBLGNT
  text: ἐγὼ γὰρ διὰ νόμου νόμῳ ἀπέθανον ἵνα θεῷ ζήσω· Χριστῷ συνεσταύρωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: ml
  text: കാരണം, ന്യായപ്രമാണത്തിലൂടെ ഞാൻ ന്യായപ്രമാണത്തിനു മരിച്ചു; ദൈവത്തിനായി ഞാൻ ജീവിക്കേണ്ടതിന്. ഞാൻ മശീഹായോടുകൂടെ ക്രൂശിക്കപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് വിശദീകരണപരമായ അടിസ്ഥാനം നൽകുന്ന ബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: διὰ νόμου
  choice: ന്യായപ്രമാണത്തിലൂടെ
  rationale: διά + genitive എന്ന പ്രയോഗത്തിന്റെ ഉപാധിസൂചക ശക്തി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ νόμος മോശെയുടെ ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: νόμῳ
  choice: ന്യായപ്രമാണത്തോടു
  rationale: നിയമവുമായുള്ള ബന്ധത്തിൽ മരിച്ചുവെന്ന സാന്ദ്രമായ പൗലോസീയ പ്രയോഗം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀπέθανον
  choice: ഞാൻ ... മരിച്ചു
  rationale: നിർണായകമായ ഭൂതകാല സംഭവത്തെ സൂചിപ്പിക്കുന്ന aorist രൂപം മലയാളത്തിലെ ലളിത ഭൂതകാലത്തിൽ നൽകുന്നു.
- source_word: ἵνα
  choice: ജീവിക്കേണ്ടതിനാണ്
  rationale: ഉദ്ദേശ്യബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: θεῷ ζήσω
  choice: ദൈവത്തിനായി ജീവിക്കുക
  rationale: ദൈവത്തോടുള്ള ദിശയും സമർപ്പണവും ഉൾക്കൊള്ളുന്ന dative ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Χριστῷ
  choice: മശീഹയോടുകൂടെ
  rationale: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ മശീഹാ അർഥം നിലനിർത്തുകയും സഹക്രൂശീകരണബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: συνεσταύρωμαι
  choice: ഞാൻ ... ക്രൂശിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഭൂതകാലത്തിൽ സംഭവിച്ച് ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലമുള്ള perfect passive രൂപത്തിന്റെ ശക്തി മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ന്യായപ്രമാണത്തിലൂടെ ന്യായപ്രമാണത്തോടു മരിച്ചു എന്ന പ്രസ്താവനയുടെ അർഥം വികസിപ്പിക്കണമോ
  choice: ഗ്രീക്കിലെ സാന്ദ്രമായ രൂപം വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ നിലനിർത്തി.
  alternative: ന്യായപ്രമാണത്തിന്റെ ശിക്ഷാവിധിയിലൂടെ ഞാൻ ന്യായപ്രമാണത്തിന്റെ അധികാരത്തിനു മരിച്ചു.
  rationale: മൂലവാക്യം ഈ ബന്ധം എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്നു വ്യക്തമാക്കുന്നില്ല. വികസിപ്പിച്ചാൽ ഒരു പ്രത്യേക വ്യാഖ്യാനം വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യപ്പെടും.
- issue: Χριστός ഒരു പേരായോ സ്ഥാനപ്പേരായോ പരിഭാഷപ്പെടുത്തണമോ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ സഹക്രൂശീകരണത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയിൽ അഭിഷിക്തനായ രക്ഷകന്റെ സ്ഥാനപ്പേരായ ശക്തി സജീവമാണെന്ന് കരുതി 'മശീഹ' ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ രണ്ട് ചെറുവാക്യങ്ങളുടെയും വാദഗതിയും ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും നിലനിർത്തി.
