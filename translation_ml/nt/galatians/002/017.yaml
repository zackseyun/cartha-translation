id: GAL.2.17
reference: Galatians 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: ml
  text: എന്നാൽ, മശീഹയിൽ നീതീകരിക്കപ്പെടാൻ അന്വേഷിക്കുമ്പോൾ, നാം തന്നെയും പാപികളായി കണ്ടെത്തപ്പെട്ടാൽ, അങ്ങനെയെങ്കിൽ മശീഹ പാപത്തിന്റെ സേവകനാണോ? ഒരിക്കലുമല്ല!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: അന്വേഷിക്കുമ്പോൾ
  rationale: പ്രധാന ക്രിയയോടൊപ്പം നടക്കുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δικαιωθῆναι
  choice: നീതീകരിക്കപ്പെടാൻ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ന്യായവിധിസംബന്ധമായ അർഥം നിലനിർത്തുന്ന, മലയാള ക്രൈസ്തവഭാഷയിൽ പരിചിതമായ പദം.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ വാഗ്ദത്ത രാജാവെന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; ἐν എന്നതിന്റെ ബന്ധപരമായ തുറന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: εὑρέθημεν
  choice: കണ്ടെത്തപ്പെട്ടെങ്കിൽ
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗവും ‘അങ്ങനെ തെളിഞ്ഞു/കാണപ്പെട്ടു’ എന്ന വാചാടോപശക്തിയും അമിതവ്യാഖ്യാനമില്ലാതെ സൂക്ഷിക്കുന്നു.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: നമ്മളും പാപികളാണെന്ന്
  rationale: καί-യുടെ ‘കൂടി/ഉം’ ഭാവവും αὐτοί നൽകുന്ന സ്വയംസംബന്ധിയായ ഊന്നലും ‘നമ്മളും’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἁμαρτίας διάκονος
  choice: പാപത്തിന്റെ ശുശ്രൂഷകൻ
  rationale: διάκονος എന്നതിന്റെ സേവകൻ/ശുശ്രൂഷകൻ എന്ന ഏജൻസി-ബന്ധം നിലനിർത്തുന്നു; ഔദ്യോഗിക സഭാപദവിയെന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലുമല്ല!
  rationale: പൗലോസിന്റെ ശക്തമായ നിരാകരണം ആധുനികവും ഉജ്ജ്വലവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: മശീഹ പാപത്തിന് കാരണമാകുന്നു എന്ന് വാക്യം പ്രസ്താവിക്കുന്നുണ്ടോ എന്ന ചോദ്യം
  choice: മശീഹ പാപത്തിന്റെ ശുശ്രൂഷകനാണെന്നോ?
  alternative: മശീഹ പാപത്തിന്റെ ശുശ്രൂഷകനാണോ?
  rationale: ἆρα ഉന്നയിക്കുന്ന നിഗമനാത്മക വാചാടോപചോദ്യം ‘എന്നോ?’ കൊണ്ട് പ്രകടമാക്കുന്നു. ഇത് നിരസിക്കപ്പെടുന്ന ആരോപണത്തെ നിലനിർത്തുന്നു; മശീഹ പാപം ഉണ്ടാക്കുന്നു എന്ന പ്രസ്താവനയായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മശീഹ’, ‘നീതീകരിക്കപ്പെടുക’, ‘ശുശ്രൂഷകൻ’ എന്നിവ മൂലപദങ്ങളുടെ ദൈവശാസ്ത്രപരമായ സാന്ദ്രത സംരക്ഷിക്കുമ്പോൾ വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
