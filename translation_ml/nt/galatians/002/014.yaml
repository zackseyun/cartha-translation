    rationale: In contemporary Malayalam, ജാതി commonly denotes caste. In this Jewish/Gentile context, വിജാതീയൻ/വിജാതീയർ clearly expresses the ethnic-religious contrast without importing a caste sense.
  - severity: low
    issue: Footnote a repeats the main text's rendering while presenting it as more literal.
