  terminology: കേഫാസ് is correctly retained rather than replaced by പത്രോസ്. യെഹൂദൻ/യെഹൂദർ is appropriate. Replacing ജാതിക്കാരൻ/ജാതിക്കാർ with വിജാതീയൻ/വിജാതീയർ avoids an unintended caste-related reading. നിർബന്ധിക്കുന്നു properly conveys ἀναγκάζεις. The traditional technical rendering in note b is retained, with the marker anchored directly to the phrase it explains.
  issues:
