id: GAL.2.14
reference: Galatians 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: ml
  text: 'എന്നാൽ അവർ സുവിശേഷത്തിന്റെ സത്യത്തോടു യോജിച്ചു നടക്കുന്നില്ലെന്ന് ഞാൻ കണ്ടപ്പോൾ[a], എല്ലാവരുടെയും മുമ്പാകെ കേഫാസിനോട് ഞാൻ പറഞ്ഞു: “നീ യെഹൂദനായിരുന്നിട്ടും യെഹൂദനെപ്പോലെയല്ല, വിജാതീയനെപ്പോലെയാണ് ജീവിക്കുന്നതെങ്കിൽ, വിജാതീയരെ യെഹൂദരെപ്പോലെ ജീവിക്കാൻ[b] നീ എങ്ങനെ നിർബന്ധിക്കുന്നു?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘സുവിശേഷത്തിന്റെ സത്യത്തോടു നേരെ നടക്കുന്നില്ല.’'
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പദപ്രയോഗം: ‘വിജാതീയരെ യെഹൂദവൽക്കരിക്കാൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: നേരെ നടക്കുന്നില്ല
  rationale: ക്രിയയിലെ ‘നേരെ നടക്കുക’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട്, പെരുമാറ്റം സുവിശേഷസത്യത്തോട് പൊരുത്തപ്പെടാത്തതാണെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: സുവിശേഷത്തിന്റെ സത്യത്തിനൊത്ത്
  rationale: πρός ഇവിടെ വെറും ദിശയെയല്ല, സുവിശേഷസത്യത്തോടുള്ള പൊരുത്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സത്യത്തിനൊത്ത്’ എന്ന പ്രയോഗം അതു സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: Κηφᾷ
  choice: കേഫാസിനോട്
  rationale: മൂലപാഠത്തിലെ കേഫാസ് എന്ന പേരുതന്നെ ലിപ്യന്തരണം ചെയ്യുന്നു; അതിനു പകരം പത്രോസ് എന്നു മാറ്റുന്നില്ല.
- source_word: ἐθνικῶς
  choice: ജാതിക്കാരനെപ്പോലെ
  rationale: ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തെ സ്വാഭാവികമായി നൽകുകയും യെഹൂദജീവിതരീതിയുമായുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: Ἰουδαϊκῶς
  choice: യെഹൂദനെപ്പോലെ
  rationale: ἐθνικῶς എന്നതിനോടുള്ള സമാന്തരതയും വൈരുധ്യവും നിലനിർത്തുന്ന ലളിതമായ പ്രയോഗമാണിത്.
- source_word: ἀναγκάζεις
  choice: നിർബന്ധിക്കുന്നു
  rationale: ക്രിയയിലെ സമ്മർദത്തിന്റെയും നിർബന്ധത്തിന്റെയും ശക്തി അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: Ἰουδαΐζειν
  choice: യെഹൂദരെപ്പോലെ ജീവിക്കാൻ
  rationale: യെഹൂദജീവിതരീതി സ്വീകരിക്കുക എന്ന സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; പിൽക്കാല സാങ്കേതികമോ മതവിഭാഗപരമോ ആയ അർഥങ്ങൾ ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: Ἰουδαΐζειν എന്നത് പിൽക്കാല ദൈവശാസ്ത്രവിവാദങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: യെഹൂദരെപ്പോലെ ജീവിക്കാൻ
  alternative: യെഹൂദാചാരങ്ങൾ അനുസരിക്കാൻ; യെഹൂദവൽക്കരിക്കാൻ
  rationale: സന്ദർഭം ജാതീയ-മതപരമായ ജീവിതരീതിയെയും സഹഭോജനത്തിലെ അതിരുകളെയും സംബന്ധിക്കുന്നതാണ്. തിരഞ്ഞെടുത്ത രൂപം ആ സാമൂഹിക-മതപരമായ സംഘർഷം വ്യക്തമാക്കുമ്പോഴും അതിനെ പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രപദമായി ചുരുക്കുന്നില്ല.
- issue: πῶς എന്ന ചോദ്യത്തിന്റെ സ്വഭാവം
  choice: നീ എങ്ങനെ നിർബന്ധിക്കുന്നു?
  alternative: നിനക്ക് എങ്ങനെ നിർബന്ധിക്കാൻ കഴിയും?
  rationale: മൂലത്തിലെ πῶς കഴിവിനെക്കാൾ പ്രവൃത്തിയിലെ വൈരുധ്യത്തെ നേരിട്ട് ചോദ്യം ചെയ്യുന്നു; അതിനാൽ ‘എങ്ങനെ’ എന്ന നേരിട്ടുള്ള രൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നേരെ നടക്കുക’ എന്ന മൂലരൂപകവും ജാതിക്കാരൻ/യെഹൂദൻ എന്ന സാമൂഹിക വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
