  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: ml
  text: എന്നാൽ കേഫാസ് അന്ത്യൊക്ക്യയിൽ എത്തിയപ്പോൾ[a], അദ്ദേഹം കുറ്റക്കാരനെന്നു വിധിക്കപ്പെട്ടവനായിരുന്നു; അതിനാൽ ഞാൻ അദ്ദേഹത്തെ മുഖാമുഖം എതിർത്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കേഫാസ് പത്രോസിന്റെ അരമായ ഭാഷയിലെ പേരാണ്.
    reason: cross_reference
  - marker: b
    text: അഥവാ, “അദ്ദേഹം വ്യക്തമായി തെറ്റിലായിരുന്നതിനാൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: എന്നാൽ ... വന്നപ്പോൾ
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യവും ὅτε നൽകുന്ന കാലബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Κηφᾶς
  choice: കേഫാവ്
  rationale: ഗ്രീക്ക് പാഠത്തിലെ പേരിന്റെ രൂപം പത്രോസ് എന്നു പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἦλθεν εἰς Ἀντιόχειαν
  choice: അന്ത്യോക്യയിൽ വന്നപ്പോൾ
  rationale: ഒരു നഗരത്തിലേക്കുള്ള വരവ് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: അദ്ദേഹത്തെ മുഖത്തോടുമുഖം
  rationale: നേരിട്ടുള്ള വ്യക്തിപരമായ എതിർപ്പിന്റെ ദൃശ്യമായ പ്രയോഗശക്തി നിലനിർത്തുന്നു.
- source_word: ἀντέστην
  choice: ഞാൻ ... എതിർത്തു
  rationale: പൗലോസ് പരസ്യമായി നേരിട്ടതിനെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ὅτι κατεγνωσμένος ἦν
  choice: അദ്ദേഹം കുറ്റക്കാരനായി നിലകൊണ്ടിരുന്നതിനാൽ
  rationale: കാരണബന്ധവും പരോക്ഷപ്രയോഗവും ഫലമായി തുടരുന്ന അവസ്ഥയുടെ സൂചനയും കഴിയുന്നത്ര നിലനിർത്തുന്നു; ആരാണ് കുറ്റവിധി നടത്തിയതെന്ന് പാഠം പറയാത്തതിനാൽ അത് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: Κηφᾶς എന്ന പേരിന്റെ തിരിച്ചറിയലും രൂപവും
  choice: പ്രധാന പാഠത്തിൽ ‘കേഫാവ്’ നിലനിർത്തുക
  alternative: വായനക്കാർക്ക് കൂടുതൽ പരിചിതമായ ‘പത്രോസ്’ ഉപയോഗിക്കുക
  rationale: മൂലപാഠത്തിൽ Κηφᾶς എന്ന പേരാണ് ഉള്ളത്. അതിന്റെ രൂപം ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലത്തോട് കൂടുതൽ സുതാര്യമാണ്; പത്രോസുമായുള്ള തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: κατεγνωσμένος ἦν എന്നതിലെ കുറ്റവിധിയുടെ സ്വഭാവം
  choice: ‘കുറ്റക്കാരനായി നിലകൊണ്ടിരുന്നു’ എന്ന പരോക്ഷവും ഫലാവസ്ഥാപരവുമായ ഭാഷ
  alternative: ‘അദ്ദേഹം വ്യക്തമായും തെറ്റിലായിരുന്നു’
  rationale: മൂലത്തിലെ പരോക്ഷരൂപവും വിധിക്കപ്പെട്ട അവസ്ഥയുടെ ഭാവവും സംരക്ഷിക്കുന്നു; അതേസമയം ബദൽ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അദ്ദേഹം’ എന്ന ആദരസൂചക സർവനാമം സാധാരണ മലയാള വായനയിൽ സ്വാഭാവികമാണ്. ‘മുഖത്തോടുമുഖം’ മൂലത്തിലെ നേർക്കുനേർ എതിർപ്പിന്റെ ശക്തി നിലനിർത്തുന്നു.
