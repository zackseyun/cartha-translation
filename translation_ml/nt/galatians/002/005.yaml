id: GAL.2.5
reference: Galatians 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: ml
  text: അവർക്കു കീഴടങ്ങുന്ന കാര്യത്തിൽ ഞങ്ങൾ ഒരു നിമിഷംപോലും[a] വഴങ്ങിക്കൊടുത്തില്ല; സുവിശേഷത്തിന്റെ സത്യം നിങ്ങളോടുകൂടെ[b] നിലനിൽക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു മണിക്കൂർപോലും’; വളരെ ചുരുങ്ങിയ സമയത്തേക്കുപോലും ഇല്ല എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾക്കായി.’
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: അവർക്കു
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ചവരിലേക്കാണ് ദത്തിവ് ബന്ധസർവനാമം വിരൽചൂണ്ടുന്നത്. മലയാളത്തിൽ ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οὐδὲ πρὸς ὥραν
  choice: ഒരു നിമിഷംപോലും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു മണിക്കൂർപോലും’ എന്നാണെങ്കിലും, വളരെ ചുരുങ്ങിയ സമയത്തേക്കുപോലും എന്ന ആശയം നൽകുന്ന പ്രയോഗമാണിത്. ആ പ്രയോഗശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി എത്തിക്കുന്നു.
- source_word: εἴξαμεν
  choice: ഞങ്ങൾ വഴങ്ങിക്കൊടുത്തില്ല
  rationale: സമ്മർദത്തിനു വഴങ്ങുകയോ വിട്ടുകൊടുക്കുകയോ ചെയ്യുക എന്ന സജീവമായ അർഥം നൽകുന്നു; തുടർന്ന് വരുന്ന ‘കീഴടങ്ങൽ’ എന്ന ആശയത്തിൽനിന്ന് ക്രിയയെ വേർതിരിച്ചും നിലനിർത്തുന്നു.
- source_word: τῇ ὑποταγῇ
  choice: കീഴടങ്ങി
  rationale: വഴങ്ങിക്കൊടുക്കൽ ഏതു രീതിയിലായിരുന്നേനെ എന്നു സൂചിപ്പിക്കുന്ന ദത്തിവിന്റെ ഭാവം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἵνα
  choice: നിലനിൽക്കേണ്ടതിനായിരുന്നു
  rationale: പൗലോസിന്റെ വിസമ്മതത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന വിധത്തിൽ ഗ്രീക്കിലെ ഉദ്ദേശ്യസൂചക ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: സുവിശേഷത്തിന്റെ സത്യം
  rationale: പൗലോസിന്റെ പ്രധാനപ്പെട്ട പ്രയോഗത്തിന്റെ രൂപവും ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും അനാവശ്യമായ പരാവർത്തനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: διαμείνῃ
  choice: നിലനിൽക്കേണ്ടതിന്
  rationale: തുടർന്നും നിലനിൽക്കുക, സംരക്ഷിക്കപ്പെടുക എന്ന ക്രിയയുടെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങൾക്കായി
  rationale: ഗലാത്യർക്കുവേണ്ടിയോ അവരുടെ പ്രയോജനത്തിനായോ സുവിശേഷസത്യം നിലനിൽക്കണമെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘നിങ്ങളോടുകൂടെ’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: എതിരാളികളോടുള്ള പൗലോസിന്റെ വിസമ്മതത്തിന്റെ വ്യാപ്തി
  choice: അവർക്കു കീഴടങ്ങുന്ന തരത്തിൽ പൗലോസും സഹപ്രവർത്തകരും ഒട്ടും വഴങ്ങിക്കൊടുത്തില്ല.
  alternative: പൗലോസ് വ്യക്തിപരമായ കീഴടങ്ങൽ മാത്രം നിരസിച്ചു; അല്ലെങ്കിൽ സ്ഥാപനപരമായ ഒരു വിട്ടുവീഴ്ച മാത്രം നിരസിച്ചു.
  rationale: ഗ്രീക്ക് വാക്യം ‘കീഴടങ്ങി വഴങ്ങുക’ എന്നതിനെ വിശാലമായി അവതരിപ്പിക്കുന്നു. അതിനെ വ്യക്തിപരമോ സ്ഥാപനപരമോ ആയ ഒരു പ്രത്യേക അവകാശവാദമായി ചുരുക്കാതെ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സുവിശേഷം,’ ‘കീഴടങ്ങുക’ എന്നീ സുപരിചിത പദങ്ങൾ നിലനിർത്തിയപ്പോൾ ഗ്രീക്ക് വാക്യത്തിന്റെ ഉദ്ദേശ്യബന്ധവും വ്യാഖ്യാനസാധ്യതകളും വ്യക്തമായി സംരക്ഷിച്ചു.
