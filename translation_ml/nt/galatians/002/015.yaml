id: GAL.2.15
reference: Galatians 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡμεῖς φύσει Ἰουδαῖοι καὶ οὐκ ἐξ ἐθνῶν ἁμαρτωλοί,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/015.yaml
  text: We are Jews by birth and not sinners from among the Gentiles[b][a],
translation:
  language: ml
  text: ജന്മനാ യെഹൂദരായ നാം, ജനതകളിൽനിന്നുള്ള പാപികളല്ല[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ജനതകളിൽപ്പെട്ട പാപികളല്ല.”'
    reason: lexical_alternative
  - marker: b
    text: “ജന്മനാ” എന്നത് അക്ഷരാർഥത്തിൽ “സ്വഭാവത്താൽ” എന്നർഥമുള്ള പ്രയോഗത്തിന്റെ പരിഭാഷയാണ്; ഇവിടെ അത് സ്വാഭാവികമായ വംശീയ ഉത്ഭവത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς
  choice: നാം
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന സർവനാമത്തിന്റെ നേരിയ ഊന്നൽ നിലനിർത്തുന്നു; തുടർന്നുള്ള വിശേഷണഘടനയോടൊപ്പം സ്വാഭാവികമായ മലയാളവാക്യം നൽകുന്നു.
- source_word: φύσει
  choice: ജന്മനാ
  rationale: ഇവിടെ ഉള്ളാർന്ന ധാർമിക സ്വഭാവമല്ല, സ്വാഭാവികമായ വംശീയ ഉത്ഭവമാണ് ഉദ്ദേശിക്കുന്നത്. ‘ജന്മനാ’ ആ അർഥം വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: Ἰουδαῖοι
  choice: യെഹൂദർ
  rationale: വാക്യത്തിലെ വംശീയ-സാമൂഹിക തിരിച്ചറിയലും ‘ജനതകൾ’ എന്നതിനോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്ന സാധാരണ ബൈബിൾപദം.
- source_word: ἐξ ἐθνῶν
  choice: ജനതകളിൽനിന്നുള്ള
  rationale: ἐξ എന്ന മുൻപ്രത്യയത്തിന്റെ ‘ഇടയിൽനിന്നുള്ള/കൂട്ടത്തിൽപ്പെട്ട’ ഭാവം നിലനിർത്തുകയും യെഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἁμαρτωλοί
  choice: പാപികൾ
  rationale: ഗ്രീക്കിലെ പതിവായ ധാർമിക പദം നേരിട്ട് നിലനിർത്തുന്നു; പ്രസ്താവനയെ ‘പാപികളായി കണക്കാക്കപ്പെടുന്നവർ’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: യെഹൂദർക്ക് ജനതകളേക്കാൾ സ്വാഭാവികമായ ധാർമിക മേന്മയുണ്ടെന്ന് പൗലോസ് അംഗീകരിക്കുന്നതുപോലെ വാക്യം കേൾക്കണമോ
  choice: ഗ്രീക്കിലെ മൂർച്ചയുള്ള വംശീയ വൈരുധ്യം മൃദൂകരിക്കാതെ നിലനിർത്തി; എന്നാൽ യെഹൂദർ സ്വഭാവതഃ നീതിമാന്മാരാണെന്ന വിശദീകരണം ചേർത്തില്ല.
  alternative: ‘ജനതകളെപ്പോലെ പാപികളായി കണക്കാക്കപ്പെടുന്നവരല്ല’ എന്ന് വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലവാക്യം വൈരുധ്യം ചുരുക്കമായും നേരിട്ടും പറയുന്നു. അതിന്റെ അർഥപരിധി തുടർന്നുള്ള സന്ദർഭം വ്യക്തമാക്കുന്നു; ആ വിശദീകരണം ഈ വാക്യത്തിനുള്ളിൽ ഇറക്കുമതി ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജന്മനാ’ എന്നത് φύσειയുടെ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു. ‘ജനതകൾ’ മൂലത്തിലെ ἔθνη എന്ന പദത്തിന്റെ രൂപകൽപ്പന സംരക്ഷിക്കുന്നു; പകരംവായന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
