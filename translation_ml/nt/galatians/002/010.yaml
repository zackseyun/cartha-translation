id: GAL.2.10
reference: Galatians 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μόνον τῶν πτωχῶν ἵνα μνημονεύωμεν, ὃ καὶ ἐσπούδασα αὐτὸ τοῦτο ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/010.yaml
  text: only that we should remember the poor, which was exactly what I was eager to do.
translation:
  language: ml
  text: ദരിദ്രരെ ഓർക്കണമെന്നു മാത്രം അവർ ആവശ്യപ്പെട്ടു; അതുതന്നെ ചെയ്യാൻ ഞാനും ഉത്സുകനായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: മാത്രം
  rationale: ധാരണയോടൊപ്പം ചേർത്ത ഏക അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ഇത് വാക്യത്തിലെ അഭ്യർഥനയോടു ചേർത്തു.
- source_word: τῶν πτωχῶν
  choice: ദരിദ്രരെ
  rationale: πτωχός ഇവിടെ സാമ്പത്തികമായി ദരിദ്രരായ ആളുകളെയാണ് സാധാരണ അർഥത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: ἵνα μνημονεύωμεν
  choice: ഓർക്കണമെന്നു
  rationale: ἵνα ഇവിടെ അഭ്യർഥനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. ‘ഓർക്കുക’ എന്നത് ഗ്രീക്ക് പദപ്രയോഗം നിലനിർത്തുകയും സന്ദർഭത്തിൽ പ്രായോഗിക കരുതൽ ധ്വനിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὃ
  choice: അതുതന്നെ
  rationale: ബന്ധസർവനാമം മുമ്പുള്ള അഭ്യർഥന മുഴുവനിലേക്കും തിരിച്ചുചൂണ്ടുന്നു; αὐτὸ τοῦτο എന്ന ഊന്നലുമായി ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: ἐσπούδασα
  choice: ഉത്സുകനായിരുന്നു
  rationale: σπουδάζω ആത്മാർഥമായ സന്നദ്ധതയും പ്രവർത്തിക്കാനുള്ള തീക്ഷ്ണതയും സൂചിപ്പിക്കുന്നു; ‘ഉത്സുകനായിരുന്നു’ ഈ ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: അതുതന്നെ ചെയ്യാൻ
  rationale: αὐτὸ τοῦτο നൽകുന്ന ‘ഈ കാര്യം തന്നേ’ എന്ന ഊന്നൽ സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: ‘ദരിദ്രരെ ഓർക്കുക’ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘ദരിദ്രരെ’ എന്ന പൊതുവായ രൂപം നിലനിർത്തി
  alternative: ‘യെരൂശലേമിലെ ദരിദ്രരെ’ എന്ന് വ്യക്തമാക്കുക
  rationale: സന്ദർഭം പ്രത്യേക സമൂഹത്തെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം സ്ഥലം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- issue: ‘ഓർക്കുക’ എന്ന ക്രിയയുടെ പ്രായോഗിക അർഥം
  choice: ‘ഓർക്കുക’ എന്ന മൂലരൂപം നിലനിർത്തി
  alternative: ‘സഹായിക്കുക’ അല്ലെങ്കിൽ ‘കരുതുക’
  rationale: സന്ദർഭത്തിൽ പ്രവർത്തനപരമായ കരുതൽ ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും μνημονεύω എന്ന പദത്തിന്റെ സത്യസന്ധമായ രൂപകാത്മകതയും അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ സംക്ഷിപ്ത ഘടന മലയാളത്തിൽ പൂർണ്ണവാക്യമാക്കാൻ ‘അവർ ആവശ്യപ്പെട്ടു’ സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചു; ഏക അഭ്യർഥനയും പൗലോസിന്റെ തീക്ഷ്ണ സന്നദ്ധതയും വ്യക്തമായി നിലനിർത്തി.
