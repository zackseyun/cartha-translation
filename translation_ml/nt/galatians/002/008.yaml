id: GAL.2.8
reference: Galatians 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: ml
  text: കാരണം, പരിച്ഛേദിതരോടുള്ള[a] അപ്പൊസ്തലദൗത്യത്തിനായി പത്രോസിലൂടെ പ്രവർത്തിച്ചവൻ യഹൂദേതരർക്കായി[b] എന്നിലൂടെയും പ്രവർത്തിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘പരിച്ഛേദത്തിന്റെ അപ്പൊസ്തലദൗത്യത്തിനായി.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ജനതകൾക്കായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: പ്രവർത്തിച്ചവൻ / പ്രവർത്തിച്ചു
  rationale: ഒരേ മൂലപദത്തിന്റെ ആവർത്തനവും പത്രോസിന്റെയും പൗലോസിന്റെയും ശുശ്രൂഷകൾക്കിടയിലെ സമാന്തരഘടനയും നിലനിർത്തുന്നു; ദൈവിക പ്രവർത്തനത്തിന്റെ രീതി അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: Πέτρῳ / ἐμοὶ
  choice: പത്രോസിലൂടെ / എന്നിലൂടെയും
  rationale: 'സന്ദർഭത്തിൽ ദാതിവ് രൂപങ്ങൾ ഉപകരണാർഥകമായി മനസ്സിലാക്കുന്നത് സ്വാഭാവികമാണ്: പ്രവർത്തിച്ചവൻ പത്രോസിലൂടെയും പൗലോസിലൂടെയും പ്രവർത്തിച്ചു.'
- source_word: εἰς ἀποστολὴν
  choice: അപ്പൊസ്തലദൗത്യത്തിനായി
  rationale: ἀποστολή എന്നതിന്റെ ഔദ്യോഗിക നിയോഗവും ദൗത്യസ്വഭാവവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: τῆς περιτομῆς
  choice: പരിച്ഛേദിതർക്കായുള്ള
  rationale: ‘പരിച്ഛേദം’ എന്ന പദം പരിച്ഛേദിതരായ യഹൂദജനത്തെ സൂചിപ്പിക്കുന്ന ലക്ഷണപ്രയോഗമാണ്; യഹൂദേതരരുമായുള്ള വൈരുധ്യം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: τὰ ἔθνη
  choice: യഹൂദേതരർക്കായി
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ യഹൂദർ/പരിച്ഛേദിതർ എന്ന വിഭാഗത്തിന് എതിരായി യഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നു. സാധാരണ ആധുനിക വായനക്കാർക്ക് ‘യഹൂദേതരർ’ വ്യക്തമാണ്.
theological_decisions:
- issue: പ്രവർത്തനത്തിന്റെ കർത്താവിനെ ‘ദൈവം’ എന്ന് വ്യക്തമായി ചേർക്കണമോ
  choice: പ്രവർത്തിച്ചവൻ
  alternative: ദൈവം പ്രവർത്തിച്ചു / പ്രവർത്തിച്ച ദൈവം
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ‘ദൈവം’ എന്ന നാമമല്ല, ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തമാണ്—‘പ്രവർത്തിച്ചവൻ’. സന്ദർഭത്തിൽ ദൈവമാണ് ഉദ്ദേശ്യമെങ്കിലും, മൂലപാഠത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കാതെ ആ രൂപവും അതിലെ സൂക്ഷ്മതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അപ്പൊസ്തലദൗത്യം’ സഭാപരമായ ആശയം സംരക്ഷിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിലാണ്; ‘വിജാതീയർ’ എന്നതിനുപകരം കൂടുതൽ വ്യക്തവും നിഷ്പക്ഷവുമായ ‘യഹൂദേതരർ’ ഉപയോഗിച്ചു.
