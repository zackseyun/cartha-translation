id: GAL.2.21
reference: Galatians 2:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: ml
  text: ഞാൻ ദൈവത്തിന്റെ കൃപയെ അസാധുവാക്കുന്നില്ല. കാരണം, നീതി[a] ന്യായപ്രമാണത്തിലൂടെയാണ് ലഭിക്കുന്നതെങ്കിൽ, മശീഹ[b] വെറുതെയായി മരിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീതിന്യായം’; ഇവിടെ ദൈവമുമ്പാകെയുള്ള ശരിയായ നില എന്ന ആശയവും ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: ക്രിസ്തോസ്; ഇവിടെ അത് ഒരു സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘നിഷ്ഫലമായി മരിച്ചു’ അല്ലെങ്കിൽ ‘കാരണമില്ലാതെ മരിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: അസാധുവാക്കുന്നില്ല
  rationale: ഒന്നിനെ പ്രാബല്യമില്ലാത്തതാക്കുക അഥവാ ഫലശൂന്യമാക്കുക എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു; വെറും ‘നിരസിക്കുന്നില്ല’ എന്നതിനെക്കാൾ പൗലോസിന്റെ വാദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: χάριν
  choice: കൃപ
  rationale: ദൈവത്തിന്റെ അനുഗ്രഹപൂർണമായ ദയയെ സൂചിപ്പിക്കുന്ന, പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ച സ്ഥിരവും സ്വാഭാവികവുമായ മലയാള പദം.
- source_word: διὰ νόμου
  choice: ന്യായപ്രമാണത്തിലൂടെയാണ് ലഭിക്കുന്നത്
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം ‘-ത്തിലൂടെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ഗ്രീക്കിൽ അധ്യാഹരിച്ചിരിക്കുന്ന ക്രിയാഭാവം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ലഭിക്കുന്നു’ ചേർത്തിരിക്കുന്നു.
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: പൗലോസിന്റെ വാദത്തിൽ ദൈവമുമ്പാകെയുള്ള ശരിയായ നിലയെയും നീതിയെയും ഒരുപോലെ തുറന്നുവയ്ക്കുന്ന സംക്ഷിപ്ത പദം; ‘നീതീകരണം’ എന്നു വിവർത്തനം ചെയ്ത് ആശയം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘അഭിഷിക്തൻ’ എന്ന മശീഹാപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: δωρεὰν
  choice: വെറുതെയായി
  rationale: ഈ നിബന്ധനാപരമായ വാദത്തിൽ ‘ഒരു ഫലവുമില്ലാതെ/നിഷ്ഫലമായി’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘കാരണമില്ലാതെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: δικαιοσύνηയും ന്യായപ്രമാണവും തമ്മിലുള്ള ബന്ധം
  choice: നീതി ന്യായപ്രമാണത്തിലൂടെ ലഭിക്കാമായിരുന്നെങ്കിൽ മശീഹയുടെ മരണം നിഷ്ഫലമായേനേ എന്ന പൗലോസിന്റെ നിബന്ധനാപരമായ വാദം നേരിട്ട് നിലനിർത്തുന്നു.
  alternative: ‘നീതി’യെ പ്രധാനമായും ന്യായം/നീതിന്യായം എന്ന അർഥത്തിൽ കേൾക്കാം; അല്ലെങ്കിൽ ‘ദൈവമുമ്പാകെയുള്ള നീതിനിഷ്ഠ’ എന്നു കൂടുതൽ വ്യാഖ്യാനാത്മകമായി നൽകാം.
  rationale: മൂലവാക്യം നീതി ലഭിക്കുന്ന രീതി സംബന്ധിച്ച ദൈവശാസ്ത്രപരമായ സംഘർഷം ഉന്നയിക്കുന്നു; ‘നീതീകരണം’ പോലുള്ള കൂടുതൽ നിർവചിതമായ പദം ചേർത്ത് അത് മുൻകൂട്ടി പരിഹരിക്കുന്നില്ല.
- issue: Χριστός പേരോ സ്ഥാനപ്പേരോ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ വാദത്തിൽ അഭിഷിക്തനായ രക്ഷകന്റെ സ്ഥാനമാണ് മുൻനിൽക്കുന്നത്; അതിനാൽ സ്ഥാനപ്പേരിന്റെ അർഥം സുതാര്യമാക്കുന്നു, അതേസമയം ഗ്രീക്ക് രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: δωρεάν എന്നതിന്റെ വാദപരമായ ശക്തി
  choice: വെറുതെയായി മരിച്ചു
  alternative: കാരണമില്ലാതെ മരിച്ചു / നിഷ്ഫലമായി മരിച്ചു
  rationale: സന്ദർഭം മശീഹയുടെ മരണത്തിന് ഉദ്ദേശ്യമോ പ്രയോജനമോ ഇല്ലാതാകുമെന്ന നിഗമനമാണ് ഉന്നയിക്കുന്നത്; ‘വെറുതെയായി’ ഈ ശക്തി സ്വാഭാവികമായി വഹിക്കുന്നു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ന്യായപ്രമാണം’ മോശെയുടെ നിയമത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ ബൈബിൾ പദമായി നിലനിർത്തി; വാക്യത്തിലെ നിബന്ധനയും ശക്തമായ നിഗമനവും വ്യക്തമായി അവതരിപ്പിച്ചു.
