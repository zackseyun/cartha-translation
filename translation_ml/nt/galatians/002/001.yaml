- from: പിന്നെ, പതിനാലു വർഷത്തിനുശേഷം ഞാൻ ബർന്നബാസിനോടൊപ്പം വീണ്ടും യെരൂശലേമിലേക്കു കയറിപ്പോയി; തീത്തൊസിനെയും കൂടെ കൂട്ടിയിരുന്നു.
