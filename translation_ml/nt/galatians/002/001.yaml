id: GAL.2.1
reference: Galatians 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: ml
  text: പിന്നെ, പതിനാലു വർഷത്തിനുശേഷം, ബർന്നബാസിനോടൊപ്പം തീത്തൊസിനെയും കൂടെക്കൂട്ടിക്കൊണ്ട് ഞാൻ വീണ്ടും യെരൂശലേമിലേക്കു കയറിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: പിന്നെ
  rationale: പൗലോസിന്റെ വിവരണത്തിലെ സംഭവക്രമം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: പതിനാലു വർഷത്തിനുശേഷം
  rationale: διά + genitive ഇവിടെ അടുത്ത സംഭവം നടക്കുന്നതിനു മുമ്പ് കഴിഞ്ഞ കാലയളവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: യെരൂശലേമിലേക്കുള്ള യാത്ര ആവർത്തിച്ചതാണെന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀνέβην
  choice: കയറിപ്പോയി
  rationale: യെരൂശലേമിലേക്കുള്ള യാത്രയെക്കുറിച്ചുള്ള മൂലപാഠത്തിലെ ‘മുകളിലേക്കു പോകുക’ എന്ന പരമ്പരാഗതവും ഭൂമിശാസ്ത്രപരവുമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിലേക്കു
  rationale: ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: μετὰ Βαρναβᾶ
  choice: ബർന്നബാസിനോടൊപ്പം
  rationale: ലളിതമായ സഹയാത്രയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: തീത്തൊസിനെയും കൂടെ കൂട്ടിയിരുന്നു
  rationale: പ്രധാന ക്രിയയോടൊപ്പം നടന്ന പ്രവൃത്തിയെയും καί-യുടെ കൂട്ടിച്ചേർക്കൽഭാവത്തെയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; തീത്തൊസും ബർന്നബാസിനു പുറമേ കൂടെയുണ്ടായിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നു.
