translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലപാഠത്തിന്റെ സംഭവക്രമവും യെരൂശലേമിലേക്കു ‘കയറിപ്പോകുക’ എന്ന ദിശാസൂചനയും നിലനിർത്തിയിരിക്കുന്നു.
