revisions:
- from: നേരെമറിച്ച്, പരിച്ഛേദനയില്ലാത്തവർക്കായുള്ള സുവിശേഷം എന്നെ ഏൽപ്പിച്ചിരിക്കുന്നതുപോലെ, പരിച്ഛേദനയുള്ളവർക്കായുള്ള സുവിശേഷം പത്രോസിനെ ഏൽപ്പിച്ചിരിക്കുന്നുവെന്ന് അവർ മനസ്സിലാക്കി.[a]
  to: നേരെമറിച്ച്, എനിക്ക് പരിച്ഛേദനയില്ലാത്തവർക്കുള്ള സുവിശേഷം ഏൽപ്പിച്ചിരിക്കുന്നതുപോലെ, പത്രോസിന് പരിച്ഛേദനം ചെയ്യപ്പെട്ടവർക്കുള്ള സുവിശേഷവും ഏൽപ്പിച്ചിരിക്കുന്നതായി അവർ കണ്ടപ്പോൾ,[a]
  rationale: The revision retains the Greek contrast and the implied repetition of ‘entrusted with the gospel,’ while rendering ἰδόντες as the circumstantial ‘അവർ കണ്ടപ്പോൾ.’ It also preserves the sentence’s continuation into the next verse and uses natural Malayalam recipient marking for the entrusted commissions.
