id: GAL.2.7
reference: Galatians 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: ml
  text: നേരെമറിച്ച്, എനിക്ക് പരിച്ഛേദനയില്ലാത്തവർക്കുള്ള സുവിശേഷം ഏൽപ്പിച്ചിരിക്കുന്നതുപോലെ, പത്രോസിന് പരിച്ഛേദനം ചെയ്യപ്പെട്ടവർക്കുള്ള സുവിശേഷവും ഏൽപ്പിച്ചിരിക്കുന്നതായി അവർ കണ്ടപ്പോൾ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “പരിച്ഛേദനയില്ലായ്മയുടെ സുവിശേഷം … പരിച്ഛേദനയുടെ സുവിശേഷം”; അതായത്, ആ ജനവിഭാഗങ്ങൾക്കായി ഏൽപ്പിക്കപ്പെട്ട സുവിശേഷം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: നേരെമറിച്ച്
  rationale: മുൻവാക്യത്തിലെ ആശയത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἰδόντες
  choice: അവർ മനസ്സിലാക്കി
  rationale: ഇവിടെ ‘കണ്ടു’ എന്നത് വെറും കാഴ്ചയല്ല, വസ്തുത തിരിച്ചറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു; ആ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πεπίστευμαι
  choice: എന്നെ ഏൽപ്പിച്ചിരിക്കുന്നു
  rationale: πιστεύω എന്ന ക്രിയയുടെ perfect passive രൂപം ഒരു ദൗത്യം വിശ്വസിച്ച് ഏൽപ്പിക്കപ്പെട്ടതും അതിന്റെ ഫലം തുടരുന്നതും സൂചിപ്പിക്കുന്നു.
- source_word: τὸ εὐαγγέλιον
  choice: സുവിശേഷം
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ സ്ഥിരപ്പെട്ടതും ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നതുമായ മലയാള പദം.
- source_word: τῆς ἀκροβυστίας
  choice: പരിച്ഛേദനയില്ലാത്തവർക്കായുള്ള
  rationale: ഗ്രീക്കിലെ ഉടമ്പടി-സാമൂഹിക അടയാളം നിലനിർത്തിക്കൊണ്ട് ലക്ഷ്യജനവിഭാഗത്തെ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘ജാതികൾ’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: καθὼς
  choice: എന്നതുപോലെ
  rationale: പൗലോസിന്റെയും പത്രോസിന്റെയും ദൗത്യങ്ങൾ തമ്മിലുള്ള സമാന്തരത വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Πέτρος
  choice: പത്രോസ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം.
- source_word: τῆς περιτομῆς
  choice: പരിച്ഛേദനയുള്ളവർക്കായുള്ള
  rationale: മുൻപത്തെ പദപ്രയോഗത്തോട് സമാന്തരത പാലിക്കുകയും ഗ്രീക്കിലെ പരിച്ഛേദനാ-അടയാളം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: പത്രോസിനെ ഏൽപ്പിച്ചിരിക്കുന്നു
  rationale: ആദ്യ ഉപവാക്യത്തിലെ ‘സുവിശേഷം ഏൽപ്പിക്കുക’ എന്ന ആശയം ഗ്രീക്കിൽ അധ്യാഹരിച്ചിരിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിനായി അത് ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: ἀκροβυστία / περιτομή എന്നിവയെ ജനവിഭാഗനാമങ്ങളായോ ഗ്രീക്കിലുള്ള ഉടമ്പടി-അടയാളങ്ങളായോ പരിഭാഷപ്പെടുത്തണോ
  choice: ‘പരിച്ഛേദനയില്ലാത്തവർ / പരിച്ഛേദനയുള്ളവർ’ എന്ന് നൽകി.
  alternative: ‘ജാതികൾ / യഹൂദർ’ അല്ലെങ്കിൽ ‘അപരിച്ഛേദനം / പരിച്ഛേദനം’.
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടി-സാമൂഹിക ഭാഷ നിലനിർത്തുകയും അതിനെ ശുദ്ധമായ വംശീയ പരാവർത്തനമാക്കി മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: πεπίστευμαι എന്ന perfect passive-ന്റെ കാലഭാവം
  choice: ‘ഏൽപ്പിച്ചിരിക്കുന്നു’ എന്ന് വർത്തമാനഫലമുള്ള പൂർത്തീകരണമായി നൽകി.
  alternative: ‘ഏൽപ്പിച്ചിരുന്നു’.
  rationale: ഗ്രീക്ക് perfect രൂപം കഴിഞ്ഞകാലത്ത് ലഭിച്ച ദൗത്യവും ഇപ്പോഴും നിലനിൽക്കുന്ന ഏൽപ്പിക്കപ്പെട്ട അവസ്ഥയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പരിച്ഛേദനയില്ലാത്തവർ/പരിച്ഛേദനയുള്ളവർ’ എന്ന സമാന്തരപ്രയോഗം പൗലോസിന്റെ ഭാഷ നിലനിർത്തുന്നു. വാക്യക്രമം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി ക്രമീകരിച്ചിട്ടുണ്ട്.
