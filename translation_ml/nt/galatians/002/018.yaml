id: GAL.2.18
reference: Galatians 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: ml
  text: കാരണം, ഞാൻ പൊളിച്ചുകളഞ്ഞവയെ വീണ്ടും പണിയുന്നെങ്കിൽ, ഞാൻ എന്നെത്തന്നെ ഒരു ലംഘകനായി തെളിയിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ എന്നെത്തന്നെ ഒരു ലംഘകനായി കാണിച്ചുകൊടുക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: ‘പൊളിച്ചുകളഞ്ഞവ’ എന്നതിന് ‘നശിപ്പിച്ചവ’ അല്ലെങ്കിൽ ‘അഴിച്ചുകളഞ്ഞവ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: കാരണം, ... എങ്കിൽ
  rationale: γάρ മുൻവാദവുമായി വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘കാരണം’ എന്നും, εἰയുടെ വ്യവസ്ഥാഭാവം ‘എങ്കിൽ’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἃ ... ταῦτα
  choice: '...വയെ'
  rationale: ഗ്രീക്കിലെ ബന്ധസർവനാമ–സൂചകസർവനാമ ഘടനയുടെ ബഹുവചന വസ്തുസൂചന മലയാളത്തിലെ ‘അവയെ’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: κατέλυσα
  choice: പൊളിച്ചുകളഞ്ഞ
  rationale: οἰκοδομῶ എന്ന പണിയൽക്രിയയോടുള്ള കെട്ടിടരൂപകം വ്യക്തമായി നിലനിർത്തുന്നു; ‘നശിപ്പിച്ച’ എന്നതിനെക്കാൾ രൂപകസാമ്യം കൂടുതലാണ്.
- source_word: πάλιν οἰκοδομῶ
  choice: വീണ്ടും പണിയുന്നെങ്കിൽ
  rationale: πάλιν എന്ന ആവർത്തനവും οἰκοδομῶ എന്ന വർത്തമാനകാല പണിയൽക്രിയയും വ്യവസ്ഥാവാക്യത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: παραβάτην
  choice: ലംഘകൻ
  rationale: അതിരോ നിയമമോ ലംഘിക്കുന്നവൻ എന്ന ധാർമിക-നിയമപരമായ വിശാല അർത്ഥം സംരക്ഷിക്കുന്നു; ‘നിയമലംഘകൻ’ എന്നു പറയുന്നത് അർത്ഥം അനാവശ്യമായി മോശെയുടെ ന്യായപ്രമാണത്തിലേക്ക് മാത്രം ചുരുക്കാം.
- source_word: ἐμαυτὸν συνιστάνω
  choice: ഞാൻ എന്നെത്തന്നെ ... തെളിയിക്കുന്നു
  rationale: പ്രതിഫലനസർവനാമത്തിന്റെ സ്വയം കുറ്റപ്പെടുത്തുന്ന ഊന്നലും συνιστάνωയുടെ ‘സ്ഥാപിക്കുക/തെളിയിക്കുക’ എന്ന സന്ദർഭാർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘പൊളിച്ചുകളഞ്ഞവ’ എന്തിനെ സൂചിപ്പിക്കുന്നു എന്നത്
  choice: പ്രതിനിധാനം വ്യക്തമാക്കാതെ ബഹുവചനരൂപം നിലനിർത്തി
  alternative: ‘ന്യായപ്രമാണം’ അല്ലെങ്കിൽ ‘ന്യായപ്രമാണാനുഷ്ഠാനങ്ങൾ’ എന്നു വ്യക്തമാക്കുക
  rationale: വാക്യംതന്നെ പ്രതിനിധാനം തുറന്നുപറയുന്നില്ല; സന്ദർഭത്തിൽ നിന്നുള്ള ഒരു പ്രത്യേക വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നത് യഥാർത്ഥ അവ്യക്തത നീക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പൊളിക്കുക/പണിയുക’ എന്ന കെട്ടിടരൂപകം സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
