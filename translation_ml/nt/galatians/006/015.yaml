id: GAL.6.15
reference: Galatians 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: ml
  text: എന്തെന്നാൽ, പരിച്ഛേദനയോ പരിച്ഛേദനമില്ലായ്മയോ ഒന്നും പ്രാധാന്യമുള്ളതല്ല[a]; മറിച്ച്, പുതിയ സൃഷ്ടിയാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒന്നുമല്ല’ അല്ലെങ്കിൽ ‘ഒട്ടും മൂല്യമുള്ളതല്ല.’
    reason: τί ἐστιν എന്ന പ്രയോഗത്തിന്റെ അടുത്തതും വ്യാഖ്യാനാത്മകവുമായ മലയാള സാധ്യതകൾ രേഖപ്പെടുത്തുന്നു.
  - marker: b
    text: അല്ലെങ്കിൽ, സന്ദർഭത്തിൽ സാധ്യത കുറവാണെങ്കിലും, ‘ഒരു പുതിയ സൃഷ്ടജീവി.’
    reason: κτίσις എന്ന പദത്തിന് ‘സൃഷ്ടി’ എന്നും ‘സൃഷ്ടജീവി’ എന്നും അർഥമാകാവുന്ന നിഘണ്ടുസന്ദിഗ്ധത രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: എന്തെന്നാൽ ... യോ ... യോ
  rationale: γάρ മുൻവാദത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്തെന്നാൽ’ എന്നു നൽകി; οὔτε ... οὔτε എന്ന സമാന്തര നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായ ‘യോ ... യോ ഒന്നും’ എന്ന ഘടനയിൽ നിലനിർത്തി.
- source_word: περιτομή
  choice: പരിച്ഛേദന
  rationale: ശാരീരിക ആചാരത്തെയും അതു സൂചിപ്പിക്കുന്ന ഉടമ്പടിസംബന്ധമായ തിരിച്ചറിയലിനെയും ഒരുപോലെ നിലനിർത്തുന്ന പ്രചാരത്തിലുള്ള പദം.
- source_word: τί ἐστιν
  choice: ഒന്നും കാര്യമല്ല
  rationale: ഗ്രീക്ക് പ്രയോഗം ഇവിടെ നിർണായക പ്രാധാന്യമോ മൂല്യമോ ഇല്ലെന്ന ആശയം നൽകുന്നു. ‘ഒന്നും കാര്യമല്ല’ ആ അർഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘ഒന്നുമല്ല’ എന്നതിലുണ്ടാകാവുന്ന അസ്തിത്വനിഷേധത്തിന്റെ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἀκροβυστία
  choice: അഗ്രചർമ്മാവസ്ഥ
  rationale: ഇവിടെ ശരീരഭാഗത്തെക്കാൾ പരിച്ഛേദന ചെയ്യപ്പെടാത്ത അവസ്ഥയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘അഗ്രചർമ്മാവസ്ഥ’ പരിച്ഛേദനയുടെ സമാന്തരവിരുദ്ധമായി കൃത്യമാണ്.
- source_word: ἀλλὰ
  choice: മറിച്ച്
  rationale: മുൻപറഞ്ഞ രണ്ടു നിലകളെയും തള്ളി യഥാർഥമായി നിർണായകമായതിലേക്കു ശക്തമായി തിരിയുന്ന വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: καινὴ κτίσις
  choice: പുതിയ സൃഷ്ടി
  rationale: καινή ഗുണപരമായ പുതുമയും κτίσις സൃഷ്ടി എന്ന വിശാല ആശയവും വഹിക്കുന്നു. ‘പുതിയ സൃഷ്ടി’ വ്യക്തിയെ മാത്രം ഉദ്ദേശിക്കുന്ന ‘പുതിയ സൃഷ്ടജീവി’ എന്ന ചുരുക്കം ഒഴിവാക്കി ഗ്രീക്കിന്റെ വ്യാപ്തിയും സന്ദിഗ്ധതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പരിച്ഛേദനം, അഗ്രചർമ്മാവസ്ഥ, പുതിയ സൃഷ്ടി എന്നിവ തമ്മിലുള്ള വൈരുധ്യം
  choice: ആചാരപരമോ സാമൂഹികമോ ആയ ഇരു നിലകൾക്കും നിർണായക പ്രാധാന്യമില്ലെന്നും ‘പുതിയ സൃഷ്ടി’യാണ് നിർണായകമെന്നും വാക്യം വ്യക്തമാക്കുന്നു.
  alternative: ഇത് സാമൂഹിക തിരിച്ചറിയൽചിഹ്നങ്ങളെക്കുറിച്ചു മാത്രം പറയുന്നതായോ ഇരു നിലകളും തുല്യമായ രക്ഷാമാർഗങ്ങളാണെന്നോ വികസിപ്പിച്ചു വ്യാഖ്യാനിക്കുക.
  rationale: τί ἐστιν എന്ന നിഷേധവും ἀλλὰ എന്ന ശക്തമായ വൈരുധ്യവും നിലനിർത്തി; എന്നാൽ ‘പുതിയ സൃഷ്ടി’യുടെ കൃത്യമായ ദൈവശാസ്ത്രപരിധി പരിഭാഷയിൽ അധികമായി നിർവചിച്ചിട്ടില്ല.
- issue: κτίσις എന്നതിന്റെ പരിധി
  choice: ‘പുതിയ സൃഷ്ടി’ എന്ന വിശാല വായന മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘ഒരു പുതിയ സൃഷ്ടജീവി’ എന്ന വ്യക്തികേന്ദ്രിത വായന.
  rationale: ഇരുവായനകളും പദസാധ്യതകളാണെങ്കിലും പൗലോസിന്റെ പ്രയോഗത്തിലും ഈ സന്ദർഭത്തിലും വിശാലമായ ‘സൃഷ്ടി’ കൂടുതൽ യോജിക്കുന്നു; കുറവ് സാധ്യതയുള്ള മറ്റുവായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്ത വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട്, ‘ഒന്നും കാര്യമല്ല’ എന്ന സ്വാഭാവിക പ്രയോഗം ഉപയോഗിച്ചു. പ്രധാന പാഠത്തിൽ വിഭാഗീയമോ വ്യാഖ്യാതാവിശിഷ്ടമോ ആയ പദാവലി ചേർത്തിട്ടില്ല.
