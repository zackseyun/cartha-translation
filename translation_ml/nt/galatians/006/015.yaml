    rationale: The Greek term denotes uncircumcised status in this contrast. ‘പരിച്ഛേദനമില്ലായ്മ’ communicates that status more naturally and clearly.
  - severity: low
    issue: Footnote b calls ‘പുതിയ സൃഷ്ടി’ an ‘അക്ഷരാർഥത്തിൽ’ rendering although it is already the main translation.
    rationale: The footnote should simply identify the less likely lexical alternative, rather than redundantly label the main rendering as literal.
