  revision_rationale: The revision replaces the less idiomatic singular-paired reciprocal expression with the natural Malayalam reciprocal adverb “പരസ്പരം.” It retains the present imperative, the resultative future, “നിയമം” for νόμον, and the deliberately non-interpretive genitive “മശീഹായുടെ.”
