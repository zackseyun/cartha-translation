id: GAL.6.2
reference: Galatians 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: ml
  text: പരസ്പരം ഭാരങ്ങൾ ചുമക്കുക; അങ്ങനെ നിങ്ങൾ മശീഹായുടെ നിയമം[a] നിറവേറ്റും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ക്രിസ്തുവിന്റെ നിയമം.”'
    reason: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരമ്പരാഗത ലിപ്യന്തരണസമാനമായ പകരം നൽകുന്നു.
lexical_decisions:
- source_word: ἀλλήλων
  choice: ഒരാളുടെ … മറ്റൊരാൾ
  rationale: പരസ്പരത വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം; സമൂഹത്തിലെ ഓരോരുത്തരും മറ്റുള്ളവരുടെ ഭാരങ്ങൾ ചുമക്കണമെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: τὰ βάρη
  choice: ഭാരങ്ങൾ
  rationale: വാച്യമായ ‘ഭാരം’ എന്ന അർഥവും ഇവിടെ ഉദ്ദേശിക്കുന്ന പ്രയാസങ്ങൾ, സമ്മർദങ്ങൾ എന്നിവയുടെ രൂപകാലങ്കാരപരമായ അർഥവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- source_word: βαστάζετε
  choice: ചുമക്കുക
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞയുടെ പ്രവർത്തനശക്തി സ്വാഭാവികമായി നൽകുന്നു; ‘ഭാരങ്ങൾ’ എന്നതിനോടൊപ്പം യോജിക്കുന്ന സജീവമായ പ്രയോഗമാണിത്.
- source_word: οὕτως
  choice: അങ്ങനെ
  rationale: മുൻപുള്ള ആജ്ഞ അനുഷ്ഠിക്കുന്ന രീതിയെയും അതിന്റെ ഫലത്തെയും സംക്ഷിപ്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀναπληρώσετε
  choice: നിറവേറ്റും
  rationale: ഭാവികാല സൂചകത്തിന്റെ ഫലാർഥം നിലനിർത്തുകയും νόμον എന്നതിനോടൊപ്പം സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: νόμον
  choice: നിയമം
  rationale: ‘തത്ത്വം’ എന്നാക്കി വ്യാഖ്യാനിക്കാതെ νόμος എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും പൗലോസിന്റെ നിയമസംബന്ധിയായ ഭാഷയും നിലനിർത്തുന്നു; ആധുനിക വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός ഇവിടെ നിയമത്തെ വിശേഷിപ്പിക്കുന്ന സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ മശീഹാസംബന്ധിയായ അർഥം വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഇവിടെ Χριστός ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; സഭാപാരമ്പര്യത്തിൽ സുപരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ പകരമായി നൽകി.
- issue: ‘മശീഹായുടെ നിയമം’ എന്നതിലെ ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ഉടമസ്ഥതയോ ഉറവിടമോ സ്വഭാവസവിശേഷതയോ നിർണ്ണയിക്കാതെ ജനിറ്റീവ് ഘടന നിലനിർത്തി
  alternative: മശീഹാ നൽകിയ നിയമം / മശീഹായെപ്പോലെ സ്നേഹിക്കാനുള്ള നിയമം
  rationale: τοῦ Χριστοῦ എന്ന ജനിറ്റീവ് പല ബന്ധങ്ങൾ സൂചിപ്പിക്കാം; അവയിൽ ഒന്ന് മാത്രം വ്യാഖ്യാനമായി പാഠത്തിൽ ചേർക്കുന്നത് ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘ഒരാളുടെ … മറ്റൊരാൾ’ പരസ്പരതയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു. അർധവിരാമം ആജ്ഞയും അതിന്റെ ഫലവും തമ്മിലുള്ള അടുത്ത ബന്ധം കാണിക്കുന്നു.
