    issue: The explanatory connective γάρ is omitted.
    rationale: Although Malayalam can sometimes leave such a connection implicit, γάρ explicitly links this statement as an explanation of the preceding context. ‘എന്തെന്നാൽ’ conveys this relation naturally without importing interpretation.
