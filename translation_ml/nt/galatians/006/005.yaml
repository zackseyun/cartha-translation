  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, ഓരോരുത്തനും സ്വന്തം ചുമട് വഹിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഓരോരുത്തനും സ്വന്തം ഭാരം വഹിക്കും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം φορτίον (‘ചുമട്’) ആണ്; 2-ാം വാക്യത്തിലെ βάρη (‘ഭാരങ്ങൾ’) എന്ന പദത്തിൽനിന്ന് ഇത് വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ഓരോരുത്തനും
  rationale: വിതരണാർഥമുള്ള ഏകവചനത്തിന്റെ ഊന്നൽ നിലനിർത്തി, ഓരോ വ്യക്തിയെയും പ്രത്യേകം സൂചിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിലും സന്ദർഭത്തിലും സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നതിനാൽ ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമായി തോന്നും.
- source_word: τὸ ἴδιον
  choice: സ്വന്തം
  rationale: ഓരോ വ്യക്തിക്കും പ്രത്യേകമായി ഉള്ളത് എന്ന ἴδιος എന്ന പദത്തിന്റെ അർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: φορτίον
  choice: ചുമട്
  rationale: ചുമക്കാനുള്ള ലോഡ് എന്ന മൂർത്തമായ അർഥം നൽകുകയും 2-ാം വാക്യത്തിലെ βάρη എന്ന പദത്തിന് സാധാരണയായി ഉപയോഗിക്കാവുന്ന ‘ഭാരങ്ങൾ’ എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: βαστάσει
  choice: ചുമക്കും
  rationale: ഭാവികാല സജീവക്രിയയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും ‘ചുമട്’ എന്ന നാമത്തോടൊപ്പം സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഗലാത്യർ 6:5-നും 6:2-നും ഇടയിലുള്ള ബന്ധം
  choice: 6:2-ലെ ‘ഭാരങ്ങൾ’ എന്ന ആശയത്തിൽനിന്ന് വേർതിരിച്ച് ഇവിടെ ‘ചുമട്’ എന്ന് പരിഭാഷപ്പെടുത്തി; അതേസമയം ഈ വ്യത്യാസത്തിന് പ്രത്യേക ദൈവശാസ്ത്രപരമായ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
  alternative: രണ്ടിടത്തും ‘ഭാരം’ എന്ന് പരിഭാഷപ്പെടുത്തുക; അല്ലെങ്കിൽ ഈ വാക്യം അന്ത്യന്യായത്തിലെ വ്യക്തിപരമായ ഉത്തരവാദിത്വത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: അടുത്തടുത്ത വാക്യങ്ങളിൽ പൗലോസ് വ്യത്യസ്ത ഗ്രീക്ക് നാമങ്ങൾ ഉപയോഗിക്കുന്നു. ആ പദവ്യത്യാസവും പരസ്പരം ഭാരങ്ങൾ വഹിക്കണമെന്ന ആഹ്വാനത്തിനും ഓരോരുത്തന്റെ സ്വന്തം ഉത്തരവാദിത്വത്തിനുമിടയിലെ സംഘർഷവും പരിഭാഷ നിലനിർത്തുന്നു; ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ ഒത്തുതീർപ്പ് അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ചുമട് ചുമക്കും’ എന്ന സ്വാഭാവിക പദസമുച്ചയം മൂലപാഠത്തിലെ നാമ-ക്രിയ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
