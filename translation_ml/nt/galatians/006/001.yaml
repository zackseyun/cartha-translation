id: GAL.6.1
reference: Galatians 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: ml
  text: സഹോദരങ്ങളേ[a], ഒരാൾ ഒരു ലംഘനത്തിൽ അകപ്പെട്ടുപോയാൽ[b], ആത്മികരായ നിങ്ങൾ അങ്ങനെയുള്ളവനെ സൗമ്യതയുടെ മനോഭാവത്തോടെ[c] പുനഃസ്ഥാപിക്കുക. നീയും പ്രലോഭിപ്പിക്കപ്പെടാതിരിക്കാൻ നിന്നെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുക[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരങ്ങളേ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും, സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട സഹവിശ്വാസിസമൂഹത്തെ അഭിസംബോധന ചെയ്യാനും അതു ഉപയോഗിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അകപ്പെട്ടുപോയാൽ’ എന്നതിന് ‘പിടിക്കപ്പെട്ടാൽ,’ ‘അതിക്രമത്താൽ കീഴടക്കപ്പെട്ടാൽ,’ അല്ലെങ്കിൽ ‘അപ്രതീക്ഷിതമായി അതിൽ അകപ്പെട്ടാൽ’ എന്നും അർത്ഥമാകാം.
    reason: alternative_reading
  - marker: c
    text: ‘സൗമ്യതയുടെ മനോഭാവത്തോടെ’ എന്നതിലെ ഗ്രീക്ക് പദം ഒരു സൗമ്യമായ മാനുഷിക മനോഭാവത്തെയോ ദൈവാത്മാവിനാൽ ഉളവാകുന്ന സൗമ്യതയെയോ സൂചിപ്പിക്കാം.
    reason: preserve_ambiguity
  - marker: d
    text: മൂലപാഠത്തിൽ ഇവിടെ ‘നിന്നെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുക; നീയും പ്രലോഭിപ്പിക്കപ്പെടാതിരിക്കാൻ’ എന്നിങ്ങനെ ഏകവചനമാണ്. സമൂഹത്തിലെ ഓരോ വ്യക്തിക്കും പ്രത്യേകം നൽകുന്ന മുന്നറിയിപ്പാണിത്.
    reason: grammatical_clarification
lexical_decisions:
- source_word: Ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: വിളിസംബോധനയായ ബഹുവചനം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ ഇങ്ങനെ വരുന്നു; സന്ദർഭത്തിൽ വിശ്വാസിസമൂഹത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാനാകുന്ന പ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐὰν καὶ προλημφθῇ ἄνθρωπος
  choice: ഒരാൾ ... അകപ്പെട്ടുപോയാൽ
  rationale: ἄνθρωπος ഇവിടെ പൊതുവായി ഒരു മനുഷ്യനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഒരാൾ’ സ്വാഭാവികമാണ്. προλημφθῇ എന്നതിന് പാപത്തിൽ പിടിക്കപ്പെടുക, അതിനാൽ കീഴടക്കപ്പെടുക, അപ്രതീക്ഷിതമായി അതിൽ അകപ്പെടുക എന്നീ സാധ്യതകളുണ്ട്; ‘അകപ്പെട്ടുപോയാൽ’ ഈ അർത്ഥവ്യാപ്തി വലിയൊരളവിൽ നിലനിർത്തുന്നു.
- source_word: ἔν τινι παραπτώματι
  choice: ഏതെങ്കിലും അതിക്രമത്തിൽ
  rationale: παράπτωμα ധാർമികമായ തെറ്റായ ചുവടിനെയോ ലംഘനത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അതിക്രമം’ ഗൗരവം നിലനിർത്തുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദമാണ്; τινι എന്ന അനിശ്ചിതത്വം ‘ഏതെങ്കിലും’ പ്രകടമാക്കുന്നു.
- source_word: οἱ πνευματικοὶ
  choice: ആത്മികരായ നിങ്ങൾ
  rationale: ആത്മാവിനാൽ രൂപപ്പെട്ട ജീവിതമോ ആത്മിക പക്വതയോ എന്ന കൃത്യമായി തീർപ്പാക്കാത്ത പൗലോസിന്റെ പ്രയോഗം ‘ആത്മികർ’ നിലനിർത്തുന്നു.
- source_word: καταρτίζετε
  choice: നേരെയാക്കുക
  rationale: തെറ്റിയതിനെ ശരിയായ നിലയിലേക്കു പുനഃസ്ഥാപിക്കുക, നന്നാക്കുക എന്ന ക്രിയയുടെ അർത്ഥം ‘നേരെയാക്കുക’ ലളിതമായി നൽകുന്നു; ഇത് ബഹുവചന ആജ്ഞയാണ്.
- source_word: ἐν πνεύματι πραΰτητος
  choice: സൗമ്യതയുടെ ആത്മാവോടെ
  rationale: πνεῦμα ഇവിടെ മനുഷ്യന്റെ മനോഭാവത്തെയോ പരിശുദ്ധാത്മാവിനാൽ ഉളവാകുന്ന സൗമ്യതയെയോ സൂചിപ്പിക്കാം. ‘സൗമ്യതയുടെ ആത്മാവോടെ’ ഈ ഉദ്ദേശ്യപൂർവമായ ദ്വയാർഥസാധ്യത നിലനിർത്തുന്നു.
- source_word: σκοπῶν σεαυτόν
  choice: ഓരോരുത്തനും തന്നെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുക
  rationale: ഗ്രീക്കിൽ സമൂഹത്തോട് ബഹുവചനമായി സംസാരിച്ചശേഷം ഓരോ പുനഃസ്ഥാപകനോടും ഏകവചനത്തിൽ വ്യക്തിപരമായ മുന്നറിയിപ്പ് നൽകുന്നു. മലയാളത്തിൽ സംഖ്യാമാറ്റം വ്യക്തമായി കേൾക്കാൻ ‘ഓരോരുത്തനും’ ചേർത്തു.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: നിങ്ങളും പ്രലോഭിപ്പിക്കപ്പെടാതിരിക്കാൻ
  rationale: ധാർമിക സന്ദർഭത്തിൽ πειράζω-യുടെ സാധ്യതയേറിയ അർത്ഥം ‘പ്രലോഭിപ്പിക്കുക’ എന്നതാണ്; καὶ പങ്കിട്ട ദുർബലതയെ സൂചിപ്പിക്കുന്ന ‘ഉം’ ആയി വരുന്നു.
theological_decisions:
- issue: πνεύματι എന്നത് മനുഷ്യന്റെ മനോഭാവമോ ദൈവാത്മാവുമായുള്ള ബന്ധമോ
  choice: ‘സൗമ്യതയുടെ ആത്മാവോടെ’ എന്ന തുറന്ന പ്രയോഗം
  alternative: ‘സൗമ്യമായ മനോഭാവത്തോടെ’ അല്ലെങ്കിൽ ‘ആത്മാവ് നൽകുന്ന സൗമ്യതയോടെ’
  rationale: മൂലപാഠം ഏത് അർത്ഥമാണെന്ന് നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല; ഗലാത്യർ 5-ലെ ആത്മാവിന്റെ ഫലവുമായി അനുരണനവും മനുഷ്യന്റെ സൗമ്യമായ ഭാവവും ഒരുപോലെ സാധ്യമാണ്.
- issue: προλημφθῇ എന്നതിലെ പിടിക്കപ്പെടൽ/കീഴടക്കപ്പെടൽ വ്യത്യാസം
  choice: ‘അകപ്പെട്ടുപോയാൽ’
  alternative: ‘പിടിക്കപ്പെട്ടാൽ’ അല്ലെങ്കിൽ ‘അപ്രതീക്ഷിതമായി കീഴടക്കപ്പെട്ടാൽ’
  rationale: വ്യക്തി തെറ്റ് ചെയ്യുന്നതിനിടെ കണ്ടെത്തപ്പെടുന്നതാണോ, അതിക്രമം അപ്രതീക്ഷിതമായി അയാളെ കീഴടക്കുന്നതാണോ എന്ന വ്യത്യാസം മൂലക്രിയയിൽ നിലനിൽക്കുന്നു; മുഖ്യപാഠം ഒരു സാധ്യത മാത്രം ഉറപ്പിക്കുന്നില്ല.
- issue: Ἀδελφοί, ἄνθρωπος എന്നീ പദങ്ങളിലെ ലിംഗവും ഉൾക്കൊള്ളലും
  choice: ‘സഹോദരങ്ങളേ’, ‘ഒരാൾ’
  alternative: ‘സഹോദരീ സഹോദരന്മാരേ’, ‘ഒരു മനുഷ്യൻ’
  rationale: മലയാളത്തിലെ ‘സഹോദരങ്ങളേ’ സഭാസമൂഹത്തെ സ്വാഭാവികമായി അഭിസംബോധന ചെയ്യുന്നു; ἄνθρωπος ഇവിടെ പൊതുവായ ഏകവചന മനുഷ്യസൂചനയായതിനാൽ ‘ഒരാൾ’ അനാവശ്യമായ പുരുഷപരിമിതി ഒഴിവാക്കി മൂലാർത്ഥം കൃത്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സഭാവായനയ്ക്ക് യോജിച്ച മാന്യവും സുലഭവുമായ മലയാളം. ‘നേരെയാക്കുക’ ശിക്ഷിക്കലിനേക്കാൾ പുനഃസ്ഥാപനത്തിന്റെ ഭാവം നൽകുന്നു. വാക്യത്തിന്റെ രണ്ടാം പകുതിയിലെ ഗ്രീക്ക് ഏകവചന മുന്നറിയിപ്പ് മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ഓരോരുത്തനും’ എന്നു പ്രകടമാക്കി.
