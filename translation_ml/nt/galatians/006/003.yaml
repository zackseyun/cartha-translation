  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: ml
  text: കാരണം, ഒന്നുമല്ലാത്തവനായിരിക്കെ താൻ എന്തോ ആണെന്ന് ആരെങ്കിലും കരുതുന്നെങ്കിൽ, അവൻ സ്വയം വഞ്ചിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ സ്വയം തെറ്റിദ്ധരിപ്പിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: കാരണം, ... എങ്കിൽ
  rationale: γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘കാരണം’ എന്നും, εἰയുടെ നിബന്ധനാർഥം ‘എങ്കിൽ’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
- source_word: δοκεῖ
  choice: കരുതുന്നെങ്കിൽ
  rationale: ഇവിടെ മറ്റുള്ളവർക്ക് തോന്നുന്ന പ്രത്യക്ഷതയല്ല, ഒരാളുടെ സ്വയംവിലയിരുത്തലാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: τις
  choice: ആരെങ്കിലും
  rationale: അനിർദിഷ്ടവും പൊതുവുമായ വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: εἶναί τι
  choice: താൻ എന്തോ ആണെന്ന്
  rationale: പ്രാധാന്യമുള്ളവനാണെന്ന ഭാവം ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ചുരുക്കവും, μηδέν എന്നതുമായ നേരിട്ടുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: μηδὲν ὤν
  choice: ഒന്നുമല്ലാതിരിക്കെ
  rationale: പങ്കാളിക്രിയയുടെ സാഹചര്യമൂലക/വിരുദ്ധതാസൂചനയുള്ള ബന്ധം മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; ‘എങ്കിലും’ എന്ന് ചേർത്ത് ബന്ധത്തെ അതിയായി നിർണയിക്കുന്നില്ല.
- source_word: φρεναπατᾷ
  choice: വഞ്ചിക്കുന്നു
  rationale: മനസ്സിൽ തെറ്റിദ്ധരിപ്പിക്കുക എന്ന ആശയം പൊതുവായും വ്യക്തമായും നൽകുന്നു; ‘മിഥ്യാബോധത്തിലാക്കുന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἑαυτόν
  choice: അവൻ തന്നെത്താൻ
  rationale: ഏകവചന പ്രതിനിധിപരമായ പുരുഷലിംഗ പരാമർശവും പ്രത്യാവർത്തക ഊന്നലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൊതുവായ പുരുഷലിംഗ ഏകവചന പരാമർശം
  choice: ആരെങ്കിലും ... അവൻ തന്നെത്താൻ
  alternative: ആ വ്യക്തി സ്വയം / അവർ തങ്ങളെത്തന്നെ
  rationale: ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിപരമായ ഘടന നിലനിർത്തുകയും മലയാളത്തിൽ സാധാരണ വായനയ്ക്ക് വ്യക്തത നൽകുകയും ചെയ്യുന്നു; ബഹുവചനത്തിലാക്കി വ്യാകരണരൂപം മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എന്തോ ആണെന്ന് / ഒന്നുമല്ലാതിരിക്കെ’ എന്ന സമാന്തരവൈരുധ്യം പൗലോസിന്റെ മൂർച്ചയുള്ള പ്രയോഗം നിലനിർത്തുന്നു.
