id: GAL.6.11
reference: Galatians 6:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἴδετε πηλίκοις ὑμῖν γράμμασιν ἔγραψα τῇ ἐμῇ χειρί.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/011.yaml
  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: ml
  text: എന്റെ സ്വന്തം കൈകൊണ്ട് ഞാൻ നിങ്ങൾക്കു എത്ര വലിയ അക്ഷരങ്ങളിൽ എഴുതിയിരിക്കുന്നുവെന്നു നോക്കൂ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “എന്റെ സ്വന്തം കൈകൊണ്ട് ഞാൻ നിങ്ങൾക്കു എത്ര നീണ്ട കത്ത് എഴുതിയിരിക്കുന്നുവെന്നു നോക്കൂ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδετε
  choice: നോക്കൂ
  rationale: ബഹുവചന ആജ്ഞാരൂപം ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗമാണ്; നേരിട്ടും സ്വാഭാവികവുമായി അതിന്റെ ആഹ്വാനം നിലനിർത്തുന്നു.
- source_word: πηλίκοις
  choice: എത്ര വലിയ
  rationale: വലുപ്പമോ വ്യാപ്തിയോ സൂചിപ്പിക്കാവുന്ന പദമാണെങ്കിലും γράμμασιν എന്നതോടൊപ്പം ഇവിടെ അക്ഷരങ്ങളുടെ ഭൗതിക വലുപ്പമാണ് കൂടുതൽ സ്വാഭാവികമായ അർഥം.
- source_word: γράμμασιν
  choice: അക്ഷരങ്ങളിലാണ്
  rationale: ഇവിടെ എഴുതപ്പെട്ട ലിപിചിഹ്നങ്ങളെയോ അക്ഷരങ്ങളെയോ സൂചിപ്പിക്കുന്നു; കത്തിന്റെ ദൈർഘ്യം എന്നതിനെക്കാൾ കൈയെഴുത്തിന്റെ വലുപ്പത്തോടാണ് സന്ദർഭം നേരിട്ട് ചേരുന്നത്.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്ക്
  rationale: ἔγραψα എന്ന ക്രിയയുടെ പരോക്ഷ കർമമായി ഗലാത്യർക്കുള്ള എഴുത്തിനെ ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: ἔγραψα
  choice: എഴുതിയിരിക്കുന്നതെന്ന്
  rationale: സ്വീകർത്താക്കളുടെ മുമ്പിലുള്ള എഴുത്തിലേക്കു വിരൽചൂണ്ടുന്ന ലേഖനസന്ദർഭത്തിലെ അഒറിസ്റ്റിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τῇ ἐμῇ χειρί
  choice: സ്വന്തം കൈകൊണ്ട്
  rationale: കരണാർഥക ദത്തിവ് പ്രയോഗവും ἐμῇ നൽകുന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: πηλίκοις γράμμασιν എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: അക്ഷരങ്ങളുടെ ഭൗതിക വലുപ്പം
  alternative: ഞാൻ സ്വന്തം കൈകൊണ്ട് നിങ്ങൾക്ക് എത്ര നീണ്ട കത്താണ് എഴുതിയിരിക്കുന്നതെന്ന്
  rationale: γράμματα സാധാരണയായി അക്ഷരങ്ങളെയോ എഴുത്തുചിഹ്നങ്ങളെയോ സൂചിപ്പിക്കുന്നതും തൊട്ടുപിന്നാലെയുള്ള ‘സ്വന്തം കൈകൊണ്ട്’ എന്ന പരാമർശവും വലിയ കൈയെഴുത്ത് എന്ന അർഥത്തെ കൂടുതൽ പിന്തുണയ്ക്കുന്നു. എങ്കിലും കത്തിന്റെ ദൈർഘ്യം എന്ന ചരിത്രപരമായ വ്യാഖ്യാനം യഥാർഥ സാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നോക്കൂ’ ശ്രദ്ധ ക്ഷണിക്കുന്ന നേരിട്ടുള്ള ആജ്ഞ നിലനിർത്തുന്നു; പ്രധാന പാഠത്തിൽ കൈയെഴുത്തിലെ അക്ഷരവലുപ്പവും അടിക്കുറിപ്പിൽ കത്തിന്റെ ദൈർഘ്യം എന്ന സാധ്യതയും സംരക്ഷിച്ചിരിക്കുന്നു.
