id: GAL.6.14
reference: Galatians 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: ml
  text: എനിക്കത് ഒരിക്കലും സംഭവിക്കാതിരിക്കട്ടെ; നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ ക്രൂശിലല്ലാതെ മറ്റൊന്നിലും പുകഴ്ച ചെയ്യാൻ എനിക്ക് ഇടയാകരുത്. ആ ക്രൂശിലൂടെ[a] ലോകം എനിക്കു ക്രൂശിക്കപ്പെട്ടിരിക്കുന്നു; ഞാനും ലോകത്തിനു ക്രൂശിക്കപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനിലൂടെ’; ഗ്രീക്ക് ആപേക്ഷികസർവനാമം ‘ക്രൂശ്’ എന്നതിനു പകരം കർത്താവായ യേശു മശീഹയെ സൂചിപ്പിക്കുന്നതായി എടുക്കാവുന്നതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: എനിക്ക് ഒരിക്കലും ഇടവരരുത്
  rationale: ശക്തമായ വ്യക്തിപരമായ നിരാകരണം പ്രകടിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καυχᾶσθαι
  choice: പ്രശംസിക്കാൻ
  rationale: സന്ദർഭത്തിൽ സ്വന്തം അഭിമാനത്തിന്റെയോ മഹത്വവത്കരണത്തിന്റെയോ ആധാരമായി എടുത്തുപറയുക എന്ന പൗലോസിന്റെ പ്രയോഗം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യഘടനയോടു സ്വാഭാവികമായി ചേരുന്നു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ മറ്റൊന്നിലും
  rationale: പ്രശംസയ്ക്കുള്ള ഏക ആധാരം ക്രൂശാണെന്ന ഒഴിവാക്കൽഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: σταυρῷ
  choice: ക്രൂശ്
  rationale: പുതിയനിയമസന്ദർഭത്തിൽ σταυρός എന്ന പദത്തിന്റെ സ്ഥാപിതവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ സാധാരണ പുതിയനിയമ മലയാളപരിഭാഷ; ബഹുമാനവും അധികാരവും നിലനിർത്തുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: Χριστός എന്ന അഭിഷിക്തപദവിയുടെ അർഥം വെറും ലിപ്യന്തരണമായി മറയ്ക്കാതെ പദവിയായി നിലനിർത്തുന്നു.
- source_word: δι’ οὗ
  choice: ആ ക്രൂശിലൂടെ
  rationale: ഏറ്റവും അടുത്ത വ്യാകരണപൂർവ്വപദമായ σταυρῷ-നെ സൂചിപ്പിക്കുന്ന ഉപകരണാർഥം പ്രധാനവായനയായി സ്വീകരിക്കുന്നു; പകരമായ വ്യക്തിസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κόσμος
  choice: ലോകം
  rationale: ദൈവത്തോട് അന്യമായ ലോകക്രമം ഉൾപ്പെടുന്ന വിശാലമായ അർഥം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്ന സാധാരണ തുല്യപദം.
- source_word: ἐσταύρωται
  choice: ക്രൂശിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണ്ണമായ സംഭവത്തിന്റെ തുടരുന്ന ഫലം സൂചിപ്പിക്കുന്ന perfect passive ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κἀγὼ κόσμῳ
  choice: ഞാൻ ലോകത്തിനും
  rationale: ഗ്രീക്കിൽ രണ്ടാമത്തെ ഖണ്ഡത്തിൽ ക്രിയ വിട്ടുകളഞ്ഞിരിക്കുന്ന സംക്ഷിപ്ത സമാന്തരഘടന മലയാളത്തിലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστοῦ-യുടെ പരിഭാഷ
  choice: യേശുമശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവൻ എന്ന പദവിയർഥം വഹിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിൽ പതിവായ സംയുക്തനാമരൂപം ഉപയോഗിച്ചു.
- issue: δι’ οὗ എന്നതിന്റെ പൂർവ്വപദം
  choice: 'ക്രൂശ്: ‘ആ ക്രൂശിലൂടെ’'
  alternative: 'യേശുമശീഹ: ‘അവനിലൂടെ’'
  rationale: അടുത്തുള്ളതും വ്യാകരണപരമായി യോജിക്കുന്നതുമായ σταυρῷ പ്രധാന പൂർവ്വപദമാണ്. എന്നാൽ ആൺലിംഗ ഏകവചന രൂപം വ്യക്തിയെയും സൂചിപ്പിക്കാവുന്നതിനാൽ യഥാർഥമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: അവസാന രണ്ടു ഖണ്ഡങ്ങളിലെ ക്രൂശിക്കൽരൂപകത്തിന്റെ പരസ്പരത
  choice: ലോകം എനിക്കും ഞാൻ ലോകത്തിനും ക്രൂശിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: ലോകം എനിക്കു മരിച്ചിരിക്കുന്നു; ഞാനും ലോകത്തിനു മരിച്ചിരിക്കുന്നു
  rationale: മൂലത്തിലെ ക്രൂശിക്കൽരൂപകം മൃദൂകരിക്കാതെ, ലോകവും പൗലോസും തമ്മിലുള്ള നിർണായക വേർപാട് സമാന്തരമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ ശക്തമായ നിരാകരണവും ക്രൂശിക്കൽരൂപകവും സമാന്തരവാക്യഘടനയും സംരക്ഷിച്ചു. ‘യേശുമശീഹ’ മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തരൂപമായി ഉപയോഗിച്ചു.
