source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: ml
  text: ജഡത്തിൽ നല്ല പ്രതീതി ഉണ്ടാക്കാൻ ആഗ്രഹിക്കുന്നവരെല്ലാം നിങ്ങളെ പരിച്ഛേദന സ്വീകരിക്കാൻ നിർബന്ധിക്കുന്നു. മശീഹായുടെ ക്രൂശ് നിമിത്തം തങ്ങൾ പീഡിപ്പിക്കപ്പെടാതിരിക്കാനായി മാത്രമാണ് അവർ അങ്ങനെ ചെയ്യുന്നത്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ജഡത്തിൽ നല്ല പ്രതീതി ഉണ്ടാക്കാൻ” എന്നതിന് “ബാഹ്യമായി നല്ല പ്രതീതി ഉണ്ടാക്കാൻ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: '“മശീഹായുടെ ക്രൂശ് നിമിത്തം” എന്നതിന് “മശീഹായുടെ ക്രൂശിന്റെ പേരിൽ” എന്നും വിവർത്തനം ചെയ്യാം. പരമ്പരാഗതമായി: “ക്രിസ്തുവിന്റെ ക്രൂശ്.”'
    reason: lexical_and_traditional_alternatives
lexical_decisions:
- source_word: ὅσοι θέλουσιν
  choice: ആഗ്രഹിക്കുന്നവരെല്ലാം
  rationale: ὅσοι എന്നതിന്റെ സമഗ്രമായ വർഗസൂചനയും θέλουσιν എന്നതിന്റെ ഇച്ഛാഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ ചേർത്തു നൽകുന്നു.
- source_word: εὐπροσωπῆσαι ἐν σαρκί
  choice: ജഡത്തിൽ നല്ലൊരു മതിപ്പുണ്ടാക്കാൻ
  rationale: εὐπροσωπῆσαι എന്നത് അനുകൂലമായ ബാഹ്യപ്രതീതി സൃഷ്ടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ἐν σαρκί എന്ന പൗലോസീയ പ്രയോഗത്തിലെ ‘ജഡം’ നിലനിർത്തി അതിന്റെ അർത്ഥസമ്മർദം സംരക്ഷിക്കുന്നു.
- source_word: οὗτοι ἀναγκάζουσιν
  choice: അവരെല്ലാം ... നിർബന്ധിക്കുന്നു
  rationale: οὗτοι നൽകുന്ന ഊന്നൽ ‘അവരെല്ലാം’ എന്നതിലൂടെ നിലനിർത്തുകയും വർത്തമാനകാല സമ്മർദത്തെ ‘നിർബന്ധിക്കുന്നു’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: നിങ്ങളെ പരിച്ഛേദന ഏൽക്കാൻ
  rationale: പരിച്ഛേദനയ്ക്ക് വിധേയരാകുക എന്ന നിഷ്ക്രിയ ആശയം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: μόνον ἵνα
  choice: '... മാത്രമാണ്'
  rationale: അവർക്ക് പൗലോസ് ആരോപിക്കുന്ന ഏക ലക്ഷ്യത്തെ മലയാളത്തിലെ സ്വാഭാവിക ലക്ഷ്യവാക്യഘടനയിൽ ഊന്നിപ്പറയുന്നു.
- source_word: τῷ σταυρῷ τοῦ Χριστοῦ
  choice: മശീഹായുടെ ക്രൂശ് നിമിത്തം
  rationale: ദത്തിവ് ഇവിടെ കാരണമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു; Χριστός പദത്തിന്റെ സ്ഥാനപ്പേരായ അർത്ഥം ‘മശീഹാ’ എന്ന് വിവർത്തനം ചെയ്യുന്നു.
- source_word: μὴ διώκωνται
  choice: തങ്ങൾ പീഡിപ്പിക്കപ്പെടാതിരിക്കാൻ
  rationale: ἵνα-യോടുകൂടിയ നിഷ്ക്രിയ സബ്ജങ്ക്റ്റീവിന്റെ ലക്ഷ്യവും പീഡനം ഒഴിവാക്കാനുള്ള ഉദ്ദേശ്യവും കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ἐν σαρκί എന്ന പൗലോസീയ പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: ജഡത്തിൽ
  alternative: ബാഹ്യമായി / പുറമേ നല്ല മതിപ്പുണ്ടാക്കാൻ
  rationale: ‘ജഡം’ എന്ന ദൈവശാസ്ത്രപരമായി അർത്ഥസമ്പന്നമായ പദം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ ശരീരസംബന്ധമായ ബാഹ്യ മതചിഹ്നം, പ്രത്യേകിച്ച് പരിച്ഛേദന, പശ്ചാത്തലത്തിലുണ്ടെങ്കിലും അർത്ഥത്തെ അതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- issue: τοῦ Χριστοῦ എന്നതിലെ Χριστός
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഈ ജനിറ്റീവ് പ്രയോഗത്തിൽ സ്ഥാനപ്പേരിന്റെ അർത്ഥം സജീവമായതിനാൽ ‘മശീഹാ’ തെരഞ്ഞെടുക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: τῷ σταυρῷ എന്ന ദത്തിവിന്റെ ബന്ധം
  choice: ക്രൂശ് നിമിത്തം
  alternative: ക്രൂശിന്റെ പേരിൽ / ക്രൂശിനുവേണ്ടി
  rationale: പീഡനത്തിന്റെ കാരണത്തെ വ്യക്തമാക്കുന്ന വായന സന്ദർഭത്തിന് യോജിക്കുന്നു; ദത്തിവിലുള്ള ബന്ധത്തിന്റെ ചെറിയ വ്യത്യാസസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘ജഡം’, ‘പരിച്ഛേദന’, ‘ക്രൂശ്’, ‘മശീഹാ’ എന്നീ ബൈബിൾപരമായി അർത്ഥസമ്പന്നമായ പദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ ദീർഘവാക്യം മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി സ്വാഭാവികത വർധിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
