id: GAL.6.7
reference: Galatians 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: ml
  text: വഞ്ചിക്കപ്പെടരുത്; ദൈവം പരിഹസിക്കപ്പെടുന്നില്ല. എന്തെന്നാൽ, ഒരു മനുഷ്യൻ എന്തു വിതയ്ക്കുന്നുവോ അതുതന്നെ അവൻ കൊയ്യുകയും ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: വഞ്ചിക്കപ്പെടരുത്
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിലുള്ള ബഹുവചന ആജ്ഞയുടെ മുന്നറിയിപ്പുസ്വരം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θεὸς
  choice: ദൈവം
  rationale: ഇവിടെ ഏകസത്യദൈവത്തെ സൂചിപ്പിക്കുന്ന θεός എന്ന പദത്തിന്റെ പതിവും വ്യക്തവുമായ പരിഭാഷ.
- source_word: οὐ μυκτηρίζεται
  choice: ദൈവത്തെ പരിഹസിക്കാനാവില്ല
  rationale: 'μυκτηρίζω എന്നതിന് പരിഹസിക്കുക, അവജ്ഞയോടെ പെരുമാറുക എന്ന അർത്ഥമുണ്ട്. ഗ്രീക്കിലെ കർമണിരൂപത്തിന്റെ ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ അസാധ്യതാപ്രയോഗത്തിലൂടെ പ്രകടമാക്കുന്നു: ദൈവത്തെ പരിഹസിച്ചിട്ട് ഫലമില്ലെന്ന പഴഞ്ചൊല്ലുസദൃശമായ ഊന്നൽ ഇതിൽ നിലനിൽക്കുന്നു.'
- source_word: ὃ γὰρ ἐὰν
  choice: എന്തെന്നാൽ ... എന്തു
  rationale: പൊതുവായ ഒരു വ്യവസ്ഥ അവതരിപ്പിക്കുന്ന അനിശ്ചിത സാപേക്ഷഘടന മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: σπείρῃ
  choice: വിതയ്ക്കുന്നുവോ
  rationale: വിതയ്ക്കലിന്റെയും കൊയ്ത്തിന്റെയും കാർഷികരൂപകം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ἄνθρωπος ഇവിടെ മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്ന പ്രതിനിധി ഏകവചനമാണ്. മലയാളത്തിലെ ‘മനുഷ്യൻ’ അതിന്റെ ഏകവചനരൂപവും പൊതുവായ മനുഷ്യസൂചനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τοῦτο καὶ θερίσει
  choice: അതുതന്നെ അവൻ കൊയ്യുകയും ചെയ്യും
  rationale: τοῦτο എന്ന നിർദേശകപദത്തിന്റെ ഊന്നലിനെ ‘അതുതന്നെ’ എന്നും καίയുടെ അനുബന്ധഭാവത്തെ ‘-ഉം’ എന്നും പ്രകടമാക്കി, വിതച്ചതുതന്നെയാണ് കൊയ്യുക എന്ന കൃത്യമായ പരസ്പരബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἄνθρωπος എന്ന പൊതുവാചക ഏകവചനം
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരു വ്യക്തി / ആരെങ്കിലും
  rationale: വാക്യം പുരുഷലിംഗ ഏകവചനരൂപം ഉപയോഗിച്ചെങ്കിലും തത്ത്വം എല്ലാ മനുഷ്യർക്കും ബാധകമാണ്. ‘ഒരു മനുഷ്യൻ’ മൂലരൂപവും അതിന്റെ പ്രതിനിധിസ്വഭാവവും മലയാളത്തിൽ ഒരുമിച്ച് നിലനിർത്തുന്നതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
- issue: οὐ μυκτηρίζεται എന്ന പ്രസ്താവനയുടെ ഭാവം
  choice: ദൈവത്തെ പരിഹസിക്കാനാവില്ല
  alternative: ദൈവം പരിഹസിക്കപ്പെടുന്നില്ല
  rationale: ഗ്രീക്കിലെ കർമണിവ്യാകരണം രണ്ടാമത്തെ രൂപം കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുമെങ്കിലും മലയാളത്തിൽ അത് പതിവായി സംഭവിക്കുന്നില്ലെന്ന വിവരണമായി തെറ്റിദ്ധരിക്കാം. തെരഞ്ഞെടുത്ത രൂപം ദൈവത്തെ അവജ്ഞയോടെ പരിഹസിച്ച് രക്ഷപ്പെടാനാവില്ലെന്ന പ്രസ്താവനയുടെ ശക്തി നിലനിർത്തുന്നു; ദൈവത്തിന് നേരെ മനുഷ്യർ പരിഹാസശ്രമം നടത്താനാവില്ലെന്ന അർത്ഥമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിതയ്ക്കുക—കൊയ്യുക’ എന്ന മൂലരൂപകം നിലനിർത്തി. വാക്യത്തിന്റെ മുന്നറിയിപ്പുസ്വരവും പഴഞ്ചൊല്ലുസദൃശമായ സംക്ഷിപ്തതയും സംരക്ഷിച്ചു.
