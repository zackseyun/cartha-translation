review_pass:
  verdict: revise
  source_fidelity: 'The agricultural correlative is accurately retained: a human being reaps precisely what he or she sows. However, «ദൈവത്തെ പരിഹസിക്കാനാവില്ല» can naturally be heard as claiming that no one is able even to mock God, whereas οὐ μυκτηρίζεται is a passive proverbial declaration, ‘God is not mocked/sneered at.’ A direct Malayalam passive-predicative form better preserves the source wording without adding the idea of inability.'
  naturalness: The draft is clear and uses modern standard Malayalam. «ദൈവം പരിഹസിക്കപ്പെടുന്നില്ല» is concise, dignified, and natural in this aphoristic warning. The remaining wording is fluent.
  terminology: «ദൈവം», «വിതയ്ക്കുക», and «കൊയ്യുക» are appropriate. «ഒരു മനുഷ്യൻ» adequately represents the generic singular ἄνθρωπος in Malayalam; no footnote is needed, since Malayalam usage naturally allows this generic reference.
  issues:
  - severity: medium
    issue: «ദൈവത്തെ പരിഹസിക്കാനാവില്ല» shifts the passive declaration into an inability statement.
    rationale: The Greek says literally that God ‘is not mocked,’ not that people lack the capacity to direct mockery toward God. The revised wording retains the passive form and proverbial force without supplying an explanatory consequence such as escaping punishment.
  revised_text: വഞ്ചിക്കപ്പെടരുത്; ദൈവം പരിഹസിക്കപ്പെടുന്നില്ല. എന്തെന്നാൽ, ഒരു മനുഷ്യൻ എന്തു വിതയ്ക്കുന്നുവോ അതുതന്നെ അവൻ കൊയ്യുകയും ചെയ്യും.
  revised_footnotes: []
  revision_rationale: Only the rendering of οὐ μυκτηρίζεται is revised, to preserve its passive grammatical form and avoid the potentially misleading implication that humans cannot attempt to mock God. The warning, generic singular, and sowing–reaping metaphor remain unchanged.
