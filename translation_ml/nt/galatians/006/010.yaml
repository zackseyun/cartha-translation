    issue: The main-text rendering of ὡς καιρὸν ἔχομεν is somewhat cumbersome.
    rationale: ‘അവസരം ലഭിക്കുന്നതനുസരിച്ച്’ is intelligible, but ‘ലഭിക്കുന്നതനുസരിച്ച്’ can imply a measure or manner of receiving opportunities. ‘നമുക്കു അവസരമുള്ളപ്പോൾ’ is idiomatic and better matches ‘as/when we have opportunity.’
