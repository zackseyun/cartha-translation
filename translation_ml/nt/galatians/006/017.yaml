  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: ml
  text: ഇനിമുതൽ ആരും എനിക്ക് ബുദ്ധിമുട്ടുണ്ടാക്കരുത്; കാരണം യേശുവിന്റെ അടയാളങ്ങൾ[a] ഞാൻ എന്റെ ശരീരത്തിൽ വഹിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുദ്രക്കുത്തുകൾ’; ശരീരത്തിൽ കുത്തിപ്പതിപ്പിച്ച, ഉടമസ്ഥതയെയോ കൂറിനെയോ തിരിച്ചറിയിക്കുന്ന അടയാളങ്ങളെ ഈ പദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: ഇനിമുതൽ
  rationale: ഭാവികാലത്തെ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ തർജമ.
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: ആരും എനിക്ക് ബുദ്ധിമുട്ടുണ്ടാക്കരുത്
  rationale: κόπους παρέχειν എന്ന പ്രയോഗം ഇവിടെ അധ്വാനമല്ല, ശല്യം അഥവാ ബുദ്ധിമുട്ട് വരുത്തുക എന്നാണ്; മൂന്നാംപുരുഷ വിലക്കിന്റെ ബലം മലയാളത്തിലെ ‘ഉണ്ടാക്കരുത്’ നിലനിർത്തുന്നു.
- source_word: τὰ στίγματα
  choice: അടയാളങ്ങൾ
  rationale: ശരീരത്തിൽ പതിപ്പിച്ച ഉടമസ്ഥതയുടെയോ കൂറിന്റെയോ ചിഹ്നങ്ങളെയും മുറിപ്പാടുകളെയും സൂചിപ്പിക്കാവുന്ന പദമാണിത്. ‘അടയാളങ്ങൾ’ അർഥം അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധം വിശദീകരിച്ചു തീർക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു; യേശുവിനോടുള്ള ഉടമസ്ഥത, കൂറ്, സഹനം എന്നിവയിലെ സാധ്യതയുള്ള അർഥബന്ധം തുറന്നുവയ്ക്കുന്നു.
- source_word: ἐν τῷ σώματί μου
  choice: എന്റെ ശരീരത്തിൽ
  rationale: ἐν എന്ന സ്ഥാനസൂചകത്തിന്റെ രൂപവും ശരീരത്തിൽ നിലനിൽക്കുന്ന അടയാളങ്ങൾ എന്ന മലയാളപ്രയോഗത്തിന്റെ സ്വാഭാവികതയും സംരക്ഷിക്കുന്നു.
- source_word: βαστάζω
  choice: ഞാൻ ... വഹിക്കുന്നു
  rationale: ചുമക്കുക, വഹിക്കുക എന്നീ അർഥങ്ങളുള്ള പദത്തിന് സന്ദർഭത്തിലെ ഗൗരവവും തുടർച്ചയായ അവസ്ഥയും യോജിച്ച തർജമ.
theological_decisions:
- issue: പൗലൊസിന്റെ στίγματα എന്നതിന്റെ സ്വഭാവം
  choice: ‘യേശുവിന്റെ അടയാളങ്ങൾ’ എന്നു നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി.
  alternative: പീഡനത്തിൽ നിന്നുള്ള മുറിപ്പാടുകൾ; യേശുവിന്റെ ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന ചാപ്പടയാളങ്ങൾ; അപ്പൊസ്തലിക സഹനത്തിന്റെയും യേശുവുമായുള്ള ഐക്യത്തിന്റെയും രൂപകം.
  rationale: പദം ശാരീരിക മുറിപ്പാടുകളെയും യേശുവിനോടുള്ള കൂറിന്റെയോ അവകാശബന്ധത്തിന്റെയോ അടയാളങ്ങളെയും ഒരുമിച്ച് ധ്വനിപ്പിച്ചേക്കാം. വാക്യം ഇവയിൽ ഒന്ന് മാത്രമായി നിർണയിക്കാത്തതിനാൽ മുഖ്യപാഠം ആ വ്യാഖ്യാനസമ്മർദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ പൗലൊസിന്റെ സമാപനപ്രസ്താവനയുടെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘ശല്യപ്പെടുത്തരുത്’ എന്നതിനെക്കാൾ κόπους എന്ന ആശയം അല്പം വിശാലമായി നിലനിർത്താൻ ‘ബുദ്ധിമുട്ടുണ്ടാക്കരുത്’ തെരഞ്ഞെടുത്തു.
