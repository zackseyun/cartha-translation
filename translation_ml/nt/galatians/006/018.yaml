id: GAL.6.18
reference: Galatians 6:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ[a] കൃപ നിങ്ങളുടെ ആത്മാവിനോടുകൂടെ ഇരിക്കട്ടെ, സഹോദരന്മാരേ[b]. ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, പരമ്പരാഗതമായി, ‘യേശുക്രിസ്തു.’ ഗ്രീക്കിലെ Χριστός ഒരു പദവിയായതിനാൽ അതിന്റെ അർഥം നിലനിർത്താൻ ഇവിടെ ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'ഇവിടെ ‘സഹോദരന്മാരേ’ എന്നത് വിശ്വാസിസമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്നതും സ്ത്രീകളെയും പുരുഷന്മാരെയും ഉൾക്കൊള്ളാവുന്നതുമാണ്; മറ്റൊരു വിവർത്തനം: ‘സഹോദരീസഹോദരന്മാരേ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ ആശീർവാദവാക്യങ്ങളിൽ പതിവായി വരുന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ സമൃദ്ധിയും മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ ആദിമ ക്രൈസ്തവ ഏറ്റുപറച്ചിൽപരമായ അർഥവും മലയാളത്തിലെ സ്വാഭാവികമായ ആദരസൂചക പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Ἰησοῦ ഒരു പേരായും Χριστός അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയായും വേർതിരിച്ചു പ്രകടമാക്കുന്നു; പരമ്പരാഗതമായ ‘യേശുക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μετὰ
  choice: ആത്മാവിനോടുകൂടെ ഇരിക്കട്ടെ
  rationale: ഗ്രീക്കിൽ ക്രിയ ഇല്ലാത്ത ആശീർവാദശൈലിയാണ്; സ്വാഭാവിക മലയാളത്തിൽ ആശംസയുടെ ഭാവം വ്യക്തമാക്കാൻ ‘ഇരിക്കട്ടെ’ ചേർക്കുന്നു.
- source_word: πνεύματος ὑμῶν
  choice: നിങ്ങളുടെ ആത്മാവ്
  rationale: ബഹുവചനമായ ‘നിങ്ങളുടെ’ എന്നതിനൊപ്പം ഏകവചനമായ πνεῦμα ഉപയോഗിക്കുന്ന ഗ്രീക്ക് ഘടന നിലനിർത്തി, സമൂഹത്തെ ഒന്നായി അഭിസംബോധന ചെയ്യുന്ന പൗലോസിന്റെ ഭാഷ പരത്താതെ സംരക്ഷിക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധന നേരിട്ട് നിലനിർത്തുന്നു; വിശ്വാസിസമൂഹത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: ആരാധനാപരമായ സമാപനസൂത്രത്തിന്റെ മലയാളത്തിൽ സ്ഥിരപ്പെട്ട ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ സമാപനാശീർവാദത്തിൽ Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός വെറും പേരിന്റെ രണ്ടാം ഘടകമെന്നതിലുപരി ഒരു പദവിയുടെ അർഥം വഹിക്കുന്നു. അതിനാൽ അർഥം തുറന്നുകാട്ടുന്ന ‘മശീഹ’ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുകയും പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: സമ്മിശ്ര വിശ്വാസിസമൂഹത്തോടുള്ള ἀδελφοί എന്ന സംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: ഗ്രീക്ക് രൂപത്തിന്റെ വ്യാകരണപരമായ പുല്ലിംഗത്വം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അതേസമയം സന്ദർഭത്തിൽ ഇത് മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളാമെന്നത് അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
- issue: πνεύματος ὑμῶν എന്ന ഏകവചന-ബഹുവചന ഘടന
  choice: നിങ്ങളുടെ ആത്മാവ്
  alternative: നിങ്ങളോടുകൂടെ
  rationale: ‘നിങ്ങളുടെ’ എന്ന ബഹുവചന ഉടമസ്ഥസർവനാമത്തോടൊപ്പം ‘ആത്മാവ്’ എന്ന ഏകവചനം ഉപയോഗിക്കുന്ന മൂലപാഠത്തിന്റെ ശ്രദ്ധേയമായ ഘടനയും അതിലെ സമൂഹപരമായ സൂചനയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആശീർവാദശൈലി ഉപയോഗിച്ചു. ‘ഇരിക്കട്ടെ’ എന്ന ക്രിയ ഗ്രീക്കിലെ ക്രിയാരഹിത ആശീർവാദസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ [a] എന്ന അടയാളം ‘spirit’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് Χριστός സംബന്ധിച്ചതായതിനാൽ, മൂലപാഠവും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കവും അനുസരിച്ച് അത് ‘മശീഹയുടെ’ എന്നതിനുശേഷം സ്ഥാപിച്ചു.
