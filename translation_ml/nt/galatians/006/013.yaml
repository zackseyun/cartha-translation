source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: ml
  text: കാരണം, പരിച്ഛേദനം ഏൽക്കുന്നവർപോലും ന്യായപ്രമാണം പാലിക്കുന്നില്ല; എന്നാൽ നിങ്ങളുടെ ശരീരത്തിൽ അവർ അഭിമാനിക്കാനായി നിങ്ങൾ പരിച്ഛേദനം ഏൽക്കണമെന്ന് അവർ ആഗ്രഹിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘പരിച്ഛേദനം ഏൽക്കുന്നവർ’ എന്നതിന് ‘പരിച്ഛേദിതർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ നാമവാചകമായി ഉപയോഗിച്ച കൃദന്തരൂപമാണ്: ‘പരിച്ഛേദനം ഏൽക്കുന്നവർ / പരിച്ഛേദനം ഏറ്റവർ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: കാരണം, ... പോലും ... ഇല്ല
  rationale: γάρ എന്നതിന്റെ വിശദീകരണബന്ധവും οὐδέ എന്നതിന്റെ ‘പോലും ഇല്ല’ എന്ന ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ περιτεμνόμενοι
  choice: പരിച്ഛേദനം ഏൽക്കുന്നവർ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തത്തിന്റെ നാമവാചകപ്രയോഗം സംരക്ഷിക്കുന്നു; ‘പരിച്ഛേദനവാദികൾ’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: αὐτοὶ
  choice: പോലും
  rationale: ‘അവർതന്നെ’ എന്ന ഊന്നൽ മലയാളവാക്യത്തിൽ ‘പരിച്ഛേദനം ഏൽക്കുന്നവർപോലും’ എന്ന സ്വാഭാവിക ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: νόμον φυλάσσουσιν
  choice: ന്യായപ്രമാണം പാലിക്കുന്നില്ല
  rationale: തോറാ/ദൈവിക നിയമം അനുസരിക്കുക എന്ന പൗലോസിന്റെ സന്ദർഭത്തിലെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἀλλὰ θέλουσιν
  choice: എന്നാൽ ... അവർ ആഗ്രഹിക്കുന്നു
  rationale: വിരോധബന്ധവും ഇച്ഛാസൂചനയും dignified modern Malayalam-ൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: നിങ്ങൾ പരിച്ഛേദനം ഏൽക്കണമെന്ന്
  rationale: ഗ്രീക്കിലെ passive/middle infinitive-ന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἵνα
  choice: '... ആനായി'
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന ἵναയുടെ ശക്തി ‘പ്രശംസിക്കാനായി’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: നിങ്ങളുടെ ശരീരത്തിൽ
  rationale: സന്ദർഭം പരിച്ഛേദനത്തിന്റെ ദേഹപരമായ അടയാളമായതിനാൽ σάρξ ഇവിടെ ശരീരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മാംസം’ ഉണ്ടാക്കാവുന്ന അനാവശ്യ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: καυχήσωνται
  choice: അവർക്ക് പ്രശംസിക്കാനായി
  rationale: καυχάομαι എന്നതിന്റെ ഇവിടെ പ്രതികൂലമായ ‘boast’ ഭാവം നിലനിർത്തുന്നു; ‘അഭിമാനിക്കാനായി’ എന്നതിനെക്കാൾ സ്വന്തം നേട്ടമായി എടുത്തുപറയുന്ന സൂചന ‘പ്രശംസിക്കുക’ നൽകുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ σάρξ എന്നതിന്റെ അർഥം
  choice: പരിച്ഛേദനത്തിന്റെ ദേഹപരമായ അടയാളം വഹിക്കുന്ന ‘ശരീരം’
  alternative: രൂപകാലങ്കാരപരമായ ‘പാപസ്വഭാവം’ അല്ലെങ്കിൽ അക്ഷരാർഥത്തിലുള്ള ‘മാംസം’
  rationale: തൊട്ടടുത്ത സന്ദർഭം പരിച്ഛേദനമായതിനാൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഗലാത്യരുടെ ദേഹത്തിൽ ഉണ്ടാകുന്ന ദൃശ്യമായ അടയാളമാണ്; ‘പാപസ്വഭാവം’ എന്നു നൽകുന്നത് അടിസ്ഥാനമില്ലാത്ത ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കും.
- issue: περιτεμνόμενοι എന്ന കൃദന്തത്തിന്റെ വ്യാപ്തി
  choice: ‘പരിച്ഛേദനം ഏൽക്കുന്നവർ’ എന്ന വിവരണാത്മക തിരിച്ചറിയൽ
  alternative: ‘പരിച്ഛേദനം പ്രചരിപ്പിക്കുന്നവർ’
  rationale: വിപുലമായ സന്ദർഭത്തിൽ ഇവർ പരിച്ഛേദനം ആവശ്യപ്പെടുന്നവരാണെങ്കിലും, ഈ പദം അവരെ പരിച്ഛേദനവുമായി ബന്ധപ്പെട്ട നില/പ്രവൃത്തി മുഖേനയാണ് തിരിച്ചറിയിക്കുന്നത്; പ്രചാരകരെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം ലളിതമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
