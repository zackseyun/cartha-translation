id: GAL.6.8
reference: Galatians 6:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: ml
  text: എന്തെന്നാൽ, സ്വന്തം ജഡത്തിനായി[a] വിതയ്ക്കുന്നവൻ ജഡത്തിൽനിന്ന് നാശം[b] കൊയ്യും; എന്നാൽ ആത്മാവിനായി[c] വിതയ്ക്കുന്നവൻ ആത്മാവിൽനിന്ന് നിത്യജീവൻ കൊയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വന്തം പാപസ്വഭാവത്തിനായി.’ ‘ജഡം’ എന്ന ഗ്രീക്ക് പദം അക്ഷരാർഥത്തിൽ മാംസത്തെ സൂചിപ്പിക്കാം; പൗലോസിന്റെ ധാർമിക വൈരുധ്യങ്ങളിൽ അത് ആത്മാവിനെ എതിർക്കുന്ന, പാപാധീനമായ മനുഷ്യാഭിമുഖ്യത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ക്ഷയം’ അല്ലെങ്കിൽ ‘തകർച്ച.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് നാശം, തകർച്ച, ക്ഷയം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, ദൈവത്തിന്റെ ആത്മാവിനായി. ഗലാത്യരിലെ ഈ ജഡം–ആത്മാവ് വൈരുധ്യം പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സാധ്യതയുള്ളത്; ‘മനുഷ്യാത്മാവ്’ എന്നും ചിലർ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രബോധനത്തിന് കാരണം വിശദീകരിക്കുന്ന ബന്ധകത്തിന്റെ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὁ σπείρων
  choice: വിതയ്ക്കുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ പൊതുവായ, പഴഞ്ചൊല്ലുസദൃശമായ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: സ്വന്തം ജഡത്തിനായി
  rationale: σπείρω കൂടെയുള്ള εἰς ലക്ഷ്യമോ താത്പര്യമോ സൂചിപ്പിക്കുന്നതിനാൽ ‘-നായി’ സ്വാഭാവികമാണ്. ‘ജഡം’ പൗലോസിന്റെ സവിശേഷ പദപ്രയോഗവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; ἑαυτοῦയുടെ ഊന്നൽ ‘സ്വന്തം’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: ἐκ τῆς σαρκὸς
  choice: ജഡത്തിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം വ്യക്തമാക്കുകയും രണ്ടാം ഉപവാക്യത്തിലെ സമാന്തരഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: θερίσει
  choice: കൊയ്യും
  rationale: വിതയ്ക്കൽ–കൊയ്ത്ത് എന്ന കാർഷികരൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: φθοράν
  choice: നാശം
  rationale: ക്ഷയം, ദുഷണം, അന്തിമമായ തകർച്ച എന്നിവ ഉൾക്കൊള്ളാവുന്ന പദത്തിന്റെ വിശാലമായ ഫലാർത്ഥം ഇവിടെ സ്വാഭാവികമായി നൽകുന്നു; സാധ്യതയുള്ള മറ്റു ഭാവങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ δὲ σπείρων
  choice: എന്നാൽ … വിതയ്ക്കുന്നവൻ
  rationale: δέയുടെ വൈരുധ്യവും ആദ്യ ഉപവാക്യത്തോടുള്ള സമതുലിതമായ ഘടനയും നിലനിർത്തുന്നു.
- source_word: εἰς τὸ πνεῦμα
  choice: ആത്മാവിനായി
  rationale: ഗലാത്യരിലെ ജഡം–ആത്മാവ് വൈരുധ്യത്തിൽ πνεῦμα ദൈവത്തിന്റെ ആത്മാവിനെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സാധ്യതയുള്ളത്. ഗ്രീക്കിലെ പദരൂപം നിലനിർത്തിക്കൊണ്ട് വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐκ τοῦ πνεύματος
  choice: ആത്മാവിൽനിന്ന്
  rationale: ഉറവിടം സൂചിപ്പിക്കുന്ന ἐκയെ കൃത്യമായി നൽകുകയും ‘ജഡത്തിൽനിന്ന്’ എന്നതിനോടുള്ള സമാന്തരത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: സ്ഥിരപ്രയോഗമായ ഈ ഗ്രീക്ക് പദസമുച്ചയത്തിന്റെ കൃത്യവും മലയാളത്തിൽ സുപരിചിതവുമായ പരിഭാഷയാണ്.
theological_decisions:
- issue: പൗലോസിന്റെ ധാർമിക വൈരുധ്യത്തിലെ σάρξ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: സന്ദർഭം പാപാധീനമായ മനുഷ്യാഭിമുഖ്യത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘പാപസ്വഭാവം’ വ്യാഖ്യാനത്തെ മുഖ്യവാചകത്തിൽ ഉറപ്പിച്ചുകളയും. ‘ജഡം’ പൗലോസിന്റെ പദാവലിയും അതിലെ യഥാർഥമായ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- issue: πνεῦμα എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ആത്മാവ് (ദൈവത്തിന്റെ ആത്മാവ് എന്ന സന്ദർഭാർഥത്തിൽ)
  alternative: മനുഷ്യാത്മാവ്
  rationale: ഗലാത്യരിലെ ജഡം–ആത്മാവ് വൈരുധ്യം സാധാരണയായി പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. എന്നാൽ മലയാളത്തിൽ വലിയക്ഷരംകൊണ്ട് ഈ വ്യത്യാസം കാണിക്കാനാകാത്തതിനാൽ മുഖ്യവാചകത്തിൽ ‘ആത്മാവ്’ നിലനിർത്തി അടിക്കുറിപ്പിൽ സൂചിതവ്യക്തി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വിതയ്ക്കുക/കൊയ്യുക’ എന്ന കാർഷികരൂപകവും രണ്ടു ഉപവാക്യങ്ങളിലെ സമാന്തരതയും സംരക്ഷിച്ചിരിക്കുന്നു. ‘ജഡം’ എന്ന പദം സാധാരണ വായനക്കാർക്ക് വിശദീകരണം ആവശ്യപ്പെടുന്നതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
