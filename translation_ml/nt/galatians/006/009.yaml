id: GAL.6.9
reference: Galatians 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: ml
  text: നന്മ ചെയ്യുന്നതിൽ നാം മടുത്തുപോകരുത്[a]. കാരണം, തക്ക സമയത്ത്[b] നാം കൊയ്യും, കൈവിടാതിരുന്നാൽ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നല്ലതു ചെയ്യുന്നതിൽ നാം ധൈര്യം നഷ്ടപ്പെടുത്തരുത്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതിന് ഉചിതമായ സമയത്ത്.’
    reason: lexical_alternative
  - marker: c
    text: പദശഃ, ‘തളർന്നുവീഴാതെ’ അഥവാ ‘ക്ഷീണിച്ചുപോകാതെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: നന്മ ചെയ്യുന്നതിൽ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ നപുംസകലിംഗ വിശേഷണവും ποιέωയും ചേർന്ന പ്രയോഗം ‘നല്ലത്/നന്മ ചെയ്യുക’ എന്ന നൈതിക അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘നന്മ ചെയ്യുന്നതിൽ’ സ്വാഭാവികവും തുടർച്ചയായ പ്രവർത്തനഭാവം സൂക്ഷിക്കുന്നതുമാണ്.
- source_word: μὴ ἐγκακῶμεν
  choice: നാം മടുത്തുപോകരുത്
  rationale: ധൈര്യം നഷ്ടപ്പെട്ട് പിന്മാറുകയോ തുടർന്നുചെയ്യുന്നതിൽ ക്ഷീണിക്കുകയോ ചെയ്യരുതെന്ന ആഹ്വാനം ഈ രൂപം നൽകുന്നു. ‘മടുത്തുപോകരുത്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും പിന്നാലെയുള്ള പ്രയോഗത്തിൽനിന്ന് വേർതിരിച്ചറിയാവുന്നതുമാണ്.
- source_word: καιρῷ ... ἰδίῳ
  choice: തക്ക സമയത്ത്
  rationale: καιρός യോജിച്ചോ നിശ്ചയിക്കപ്പെട്ടോ ഉള്ള സമയത്തെയും ἴδιος അതിന് ഉചിതമായ സമയത്തെയും സൂചിപ്പിക്കുന്നു. ആരാണ് സമയം നിശ്ചയിക്കുന്നത് എന്നു വിവർത്തനം അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: θερίσομεν
  choice: നാം കൊയ്യും
  rationale: ‘കൊയ്യുക’ ചുറ്റുപാടിലുള്ള വിതയ്ക്കൽ–കൊയ്ത്ത് രൂപകം നിലനിർത്തുന്ന നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പദമാണ്.
- source_word: μὴ ἐκλυόμενοι
  choice: തളർന്നുവീഴാതിരുന്നാൽ
  rationale: ശക്തി ക്ഷയിച്ച് വിട്ടുകളയുക, തളരുക എന്ന അർഥപരിധി ഈ പങ്കാളിക്രിയയ്ക്കുണ്ട്. ‘-ആതിരുന്നാൽ’ എന്ന രൂപം വാക്യത്തിലെ സാഹചര്യാധീനമായ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ആദ്യത്തെ ἐγκακῶμεν എന്ന പ്രയോഗവുമായി പൂർണമായി ഒറ്റപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: ἐγκακῶμεν, ἐκλυόμενοι എന്നീ രണ്ടു സ്ഥിരോത്സാഹപ്രയോഗങ്ങളുടെ ബന്ധം
  choice: ആദ്യത്തേത് ‘മടുത്തുപോകരുത്’ എന്നും രണ്ടാമത്തേത് ‘തളർന്നുവീഴാതിരുന്നാൽ’ എന്നും ബന്ധമുള്ളതെങ്കിലും വ്യത്യസ്തമായ ഭാഷയിൽ നൽകുന്നു.
  alternative: ‘മനം മടുക്കരുത് ... കൈവിടാതിരുന്നാൽ’ അല്ലെങ്കിൽ ‘ക്ഷീണിക്കരുത് ... തളരാതിരുന്നാൽ’.
  rationale: പൗലോസ് ബന്ധമുള്ളെങ്കിലും ഒരേ പദമല്ലാത്ത രണ്ടു പ്രയോഗങ്ങൾ ഉപയോഗിക്കുന്നു. വ്യത്യാസം നിലനിർത്തുന്നത് വാക്യത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുകയും ഏതെങ്കിലും പ്രത്യേക ഉപദേശവ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: μὴ ἐκλυόμενοι എന്നതിന്റെ വ്യാകരണബന്ധം
  choice: ‘തളർന്നുവീഴാതിരുന്നാൽ’ എന്ന സാഹചര്യാധീന പ്രയോഗം.
  alternative: ‘തളർന്നുവീഴാതെ’ എന്ന വിധസൂചക പ്രയോഗം.
  rationale: പങ്കാളിക്രിയയ്ക്ക് വിധസൂചകമായോ സാഹചര്യാധീനമായോ വായിക്കാവുന്ന അർഥനിഴലുണ്ട്. മുഖ്യപാഠത്തിൽ മലയാളത്തിൽ വ്യക്തമായ സാഹചര്യാധീന രൂപം ഉപയോഗിച്ചെങ്കിലും പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വിതയ്ക്കൽ–കൊയ്ത്ത് രൂപകം ‘കൊയ്യും’ എന്നതിലൂടെ സംരക്ഷിച്ചു. വാക്യത്തിന്റെ ഒഴുക്കിനായി കാരണംസൂചകമായ γάρ ‘കാരണം’ എന്നു വ്യക്തമാക്കി; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
