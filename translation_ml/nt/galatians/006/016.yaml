id: GAL.6.16
reference: Galatians 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: ml
  text: ഈ മാനദണ്ഡമനുസരിച്ച് നടക്കുന്ന എല്ലാവരുടെയുംമേൽ[a] സമാധാനവും കരുണയും ഉണ്ടാകട്ടെ; ദൈവത്തിന്റെ ഇസ്രായേലിന്മേലും[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഈ മാനദണ്ഡം പിന്തുടരുന്ന എല്ലാവരുടെയുംമേൽ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് ഒരു മാനദണ്ഡത്തിനൊത്ത് നിരയായി നടക്കുക, അതിനനുസരിച്ച് ചുവടുവെക്കുക എന്ന ആശയമുണ്ട്.'
    reason: lexical_alternative
  - marker: b
    text: '‘ദൈവത്തിന്റെ ഇസ്രായേൽ’ എന്നത് ആരെ സൂചിപ്പിക്കുന്നു എന്നതിൽ വ്യത്യസ്ത വ്യാഖ്യാനങ്ങളുണ്ട്: വിശ്വാസികളായ യെഹൂദരെയോ, സഭ മുഴുവനെയോ, കൂടുതൽ വിശാലമായി ദൈവജനത്തെയോ സൂചിപ്പിക്കാം. ഗ്രീക്ക് പ്രയോഗം അതേപടി നിലനിർത്തി ഈ ചോദ്യം പരിഭാഷയിൽ തീർപ്പാക്കിയിട്ടില്ല.'
    reason: alternative_reading
  - marker: c
    text: അവസാനത്തെ ‘ഉം’ മുൻപറഞ്ഞവരോടൊപ്പം മറ്റൊരു സംഘത്തെ ചേർക്കുന്നതായും (‘കൂടാതെ ദൈവത്തിന്റെ ഇസ്രായേലിന്മേൽ’) അതേ സംഘത്തെ മറ്റൊരു വിധത്തിൽ വ്യക്തമാക്കുന്നതായും (‘അതായത് ദൈവത്തിന്റെ ഇസ്രായേലിന്മേൽ’) വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: എല്ലാവരുടെയുംമേൽ
  rationale: ὅσοι എന്നതിന്റെ ഉൾക്കൊള്ളുന്ന വ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ ‘എല്ലാവരും’ എന്ന ആശയത്തിലൂടെ നൽകുന്നു; അനുഗ്രഹവാക്യത്തിലെ ἐπ’ αὐτούς കൂടി ചേർത്ത് ‘എല്ലാവരുടെയുംമേൽ’ എന്നു രൂപപ്പെടുത്തി.
- source_word: κανόνι
  choice: മാനദണ്ഡമനുസരിച്ച്
  rationale: κανών ഇവിടെ ജീവിതത്തെ ക്രമപ്പെടുത്തുന്ന അളവുകോൽ അഥവാ നിബന്ധനയാണ്. ‘മാനദണ്ഡം’ ആ അർഥം വ്യക്തമായി നൽകുന്നു; ‘ചട്ടം’ എന്നത് അമിതമായ നിയമഭാവം സൃഷ്ടിക്കാം.
- source_word: στοιχήσουσιν
  choice: നടക്കുന്ന
  rationale: στοιχέω എന്ന പദത്തിലെ നിരയൊത്ത് നടക്കുക/ഒരു മാനദണ്ഡത്തിനനുസരിച്ച് ജീവിക്കുക എന്ന രൂപകം ‘നടക്കുന്ന’ എന്നതിലൂടെ നിലനിർത്തുന്നു. ഗ്രീക്കിലെ ഭാവികാലം ഇവിടെ ഒരു പൊതുവായ അനുഗ്രഹപ്രഖ്യാപനത്തിൽ സ്വാഭാവിക മലയാള വർത്തമാനരൂപത്തിൽ പ്രകടമാകുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: εἰρήνηയുടെ പതിവും സന്ദർഭോചിതവുമായ പരിഭാഷ; ഇവിടെ അനുഗ്രഹാശംസയുടെ ഭാഗമാണ്.
- source_word: ἔλεος
  choice: കരുണ
  rationale: ἔλεος എന്നതിന് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാള പദം; ‘സമാധാനം’ എന്നതിനോടൊപ്പം അനുഗ്രഹവാക്യത്തിൽ വരുന്നു.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: എല്ലാവരുടെയുംമേൽ ... ഇസ്രായേലിന്മേലും
  rationale: ആവർത്തിക്കുന്ന ἐπίയുടെ ‘മേൽ’ എന്ന ആശയം രണ്ടു ഭാഗത്തും നിലനിർത്തി അനുഗ്രഹവാക്യത്തിന്റെ ഭാവവും ഗ്രീക്ക് ഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഇസ്രായേൽ
  rationale: ഗ്രീക്കിലെ സമാസബന്ധം നേരിട്ട് നിലനിർത്തുകയും ഈ പ്രയോഗം ആരെ സൂചിപ്പിക്കുന്നു എന്ന വിവാദം പരിഭാഷയിൽ തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ ഇസ്രായേൽ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ‘ദൈവത്തിന്റെ ഇസ്രായേൽ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി, സൂചിതസമൂഹത്തെ നിർവചിക്കാതെ വെച്ചു.
  alternative: വിശ്വാസികളായ യെഹൂദർ; സഭ മുഴുവനും; യെഹൂദ-ജാതി വ്യത്യാസമില്ലാതെ ദൈവജനമെല്ലാം.
  rationale: ഗ്രീക്ക് പ്രയോഗം തന്നെ ഒരു വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല. ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ നിഗമനം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: ‘ദൈവത്തിന്റെ ഇസ്രായേലിന്മേൽ’ എന്നതിനുമുമ്പുള്ള അവസാന καίയുടെ ബന്ധം
  choice: ‘ഇസ്രായേലിന്മേലും’ എന്ന് additive ആയ ‘ഉം’ ഉപയോഗിച്ചു; അത് മറ്റൊരു സംഘത്തെ കൂട്ടിച്ചേർക്കുന്നതാണോ മുൻസംഘത്തെ പുനർവ്യക്തമാക്കുന്നതാണോ എന്ന് നിർണയിച്ചില്ല.
  alternative: ‘അതായത്, ദൈവത്തിന്റെ ഇസ്രായേലിന്മേൽ’ എന്ന വിശദീകരണാർഥം; അല്ലെങ്കിൽ വ്യക്തമായ രണ്ടാമത്തെ സംഘമായി ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തൽ.
  rationale: καί ഇവിടെ കൂട്ടിച്ചേർക്കലായോ വിശദീകരണപരമായ പുനർപ്രസ്താവനയായോ വായിക്കാം. ലളിതമായ ‘ഉം’ ഇരു സാധ്യതകളും തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നടക്കുന്ന’ എന്ന പൗലോസീയ ജീവിതരൂപകവും ‘മേൽ’ എന്ന അനുഗ്രഹവാക്യഭാവവും നിലനിർത്തി; അസ്വാഭാവികമായ അത്യന്തം പദാനുപദഘടന ഒഴിവാക്കി.
