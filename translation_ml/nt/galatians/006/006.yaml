source:
  edition: SBLGNT
  text: Κοινωνείτω δὲ ὁ κατηχούμενος τὸν λόγον τῷ κατηχοῦντι ἐν πᾶσιν ἀγαθοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/006.yaml
  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: ml
  text: വചനത്തിൽ ഉപദേശം ലഭിക്കുന്നവൻ തന്നെ ഉപദേശിക്കുന്നവനുമായി എല്ലാ നല്ല കാര്യങ്ങളും പങ്കിടട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്നെ ഉപദേശിക്കുന്നവനുമായി എല്ലാ നന്മകളിലും പങ്കാളിയാകട്ടെ.’ ഇതിൽ ഭൗതികസഹായവും ഉൾപ്പെടാൻ സാധ്യതയുണ്ട്.
    reason: κοινωνέω, ἐν πᾶσιν ἀγαθοῖς എന്നീ പ്രയോഗങ്ങളുടെ രൂപപരമായ മറ്റൊരു വിവർത്തനവും അവയുടെ സാധ്യതയുള്ള പ്രായോഗിക അർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: Κοινωνείτω
  choice: പങ്കിടട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം തുടർന്നുകൊണ്ടിരിക്കേണ്ട ഒരു പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘പങ്കിടട്ടെ’ എന്നത് പ്രായോഗികമോ ഭൗതികമോ ആയ പങ്കുവെക്കലിനുള്ള സാധ്യത നിലനിർത്തുകയും അതിനെ പണസഹായത്തിൽ മാത്രം ഒതുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇത് ശക്തമായ വിരോധമല്ല, നേരിയ ആശയമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അധികമായ ഒരു ബന്ധകപദം ചേർക്കാതെ വാക്യം ആരംഭിക്കുന്നത് സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്.
- source_word: ὁ κατηχούμενος τὸν λόγον
  choice: വചനത്തിൽ ഉപദേശം ലഭിക്കുന്നവൻ
  rationale: ഉപദേശം സ്വീകരിക്കുന്ന വ്യക്തിയെയാണ് ഗ്രീക്ക് വർത്തമാനകാല കർമണി പങ്കാളിത്തരൂപം സൂചിപ്പിക്കുന്നത്. ‘വചനത്തിൽ ഉപദേശം ലഭിക്കുന്നവൻ’ എന്നത് പിന്നീടുണ്ടായ സാങ്കേതിക സഭാപദപ്രയോഗം ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ നൽകുന്നു.
- source_word: τῷ κατηχοῦντι
  choice: തന്നെ ഉപദേശിക്കുന്നവനുമായി
  rationale: ഉപദേശം നൽകുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന കർത്തരി പങ്കാളിത്തരൂപമാണിത്. ‘തന്നെ’ എന്നത് ഉപദേശം ലഭിക്കുന്നവനും നൽകുന്നവനും തമ്മിലുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമായി കാണിക്കുന്നു.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: എല്ലാ നല്ല കാര്യങ്ങളും
  rationale: ഈ വിശാല പ്രയോഗത്തിൽ ഭൗതികവും പ്രായോഗികവുമായ നന്മകൾ ഉൾപ്പെടാം. സ്വാഭാവിക മലയാളത്തിനായി കർമരൂപത്തിൽ നൽകിയെങ്കിലും അതിന്റെ വ്യാപ്തി ചുരുക്കിയിട്ടില്ല.
theological_decisions:
- issue: ആജ്ഞാപിക്കുന്ന പങ്കുവെക്കലിന്റെ സ്വഭാവം
  choice: പഠിക്കുന്നവൻ ഉപദേശകനുമായി നല്ല കാര്യങ്ങൾ പങ്കിടണം; ഇതിൽ ഭൗതികസഹായവും ഉൾപ്പെടാൻ സാധ്യതയുണ്ട്.
  alternative: ഇത് ഭൗതികസഹായമല്ല, ആത്മീയ കൂട്ടായ്മ മാത്രം സൂചിപ്പിക്കുന്നു.
  rationale: κοινωνέω എന്ന ക്രിയയും സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന സമ്പ്രദാനവിഭക്തിയും ‘എല്ലാ നല്ല കാര്യങ്ങളും’ എന്ന പ്രയോഗവും ചേർന്ന് പ്രായോഗികമായ പങ്കുവെക്കലിനെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും മൂലവാക്യം അതിനെ പണസഹായത്തിൽ മാത്രം ഒതുക്കാത്തതിനാൽ പരിഭാഷയും ആ വിശാലത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘വചനത്തിൽ ഉപദേശം ലഭിക്കുന്നവൻ’ എന്ന പ്രയോഗം മൂലത്തിലെ കർമണി ആശയം നിലനിർത്തുന്നു; ‘പങ്കിടട്ടെ’ പ്രായോഗിക പങ്കുവെക്കലിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
