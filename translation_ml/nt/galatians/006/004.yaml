    rationale: ‘മറ്റൊരാളുമായി താരതമ്യം ചെയ്യുന്നതിൽ’ എന്നത് സന്ദർഭവ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നു. ഗ്രീക്കിൽ വ്യക്തമായി ഉള്ളത് ‘തന്നെ സംബന്ധിച്ച്’ എന്നതും ‘മറ്റൊരാളെ സംബന്ധിച്ച്’ എന്നതുമായ വൈരുധ്യമാണ്; താരതമ്യം എന്ന ക്രിയ നേരിട്ട് ഇല്ല.
