  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: ml
  text: എന്നാൽ ഓരോരുത്തനും സ്വന്തം പ്രവൃത്തി പരിശോധിക്കട്ടെ. അപ്പോൾ തന്നെ സംബന്ധിച്ച് മാത്രമേ, മറ്റൊരാളെ സംബന്ധിച്ചല്ല, അയാൾക്ക് അഭിമാനിക്കാനുള്ള വകയുണ്ടാകൂ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അഭിമാനിക്കാനുള്ള അടിസ്ഥാനം’ അല്ലെങ്കിൽ ‘പ്രശംസാവിഷയം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം അഭിമാനിക്കുന്ന പ്രവൃത്തിയെയോ അതിനുള്ള അടിസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργον
  choice: പ്രവൃത്തി
  rationale: വ്യക്തിയുടെ പെരുമാറ്റവും പ്രവർത്തനവും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ഒറ്റ പ്രവൃത്തിയായി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: δοκιμαζέτω
  choice: പരിശോധിക്കട്ടെ
  rationale: ഗുണനിലവാരം നിർണയിക്കാൻ വിലയിരുത്തുക എന്ന ആജ്ഞാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഫലം അനുകൂലമാണെന്ന് മുൻകൂട്ടി കരുതുന്നില്ല.
- source_word: ἕκαστος
  choice: ഓരോരുത്തനും
  rationale: ഗ്രീക്കിലെ വിതരണാത്മകമായ ഏകവചനബലം നിലനിർത്തുന്നു.
- source_word: ἑαυτοῦ
  choice: സ്വന്തം
  rationale: പരിശോധിക്കേണ്ടത് മറ്റൊരാളുടേതല്ല, ആ വ്യക്തിയുടെ തന്നെ പ്രവൃത്തിയാണെന്ന പ്രത്യാവർത്തക ഊന്നൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰς ἑαυτὸν μόνον
  choice: തന്നിൽത്തന്നെ മാത്രമായിരിക്കും
  rationale: സ്വന്തം പ്രവൃത്തിയെ അടിസ്ഥാനമാക്കുന്നതും മറ്റൊരാളുമായുള്ള താരതമ്യം ഒഴിവാക്കുന്നതുമായ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καύχημα
  choice: അഭിമാനിക്കാൻ വക
  rationale: അഭിമാനിക്കുന്ന പ്രവൃത്തിയെയും അതിനുള്ള അടിസ്ഥാനത്തെയും സൂചിപ്പിക്കാവുന്ന പദത്തിന്റെ അർഥവ്യാപ്തി സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: ἕξει
  choice: ഉണ്ടാകുക
  rationale: പരിശോധനയെ തുടർന്നുണ്ടാകുന്ന ഫലം ഭാവികാലത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸν ἕτερον
  choice: മറ്റൊരാളുമായി താരതമ്യം ചെയ്യുന്നതിൽ
  rationale: അക്ഷരാർഥം ‘മറ്റെയാൾ’ എന്നാണെങ്കിലും, εἰς എന്ന ഘടന ഈ സന്ദർഭത്തിൽ സ്വന്തം പ്രവൃത്തിയെ മറ്റൊരാളുടെ പ്രവൃത്തിയുമായി താരതമ്യം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യവും ആശയമാറ്റവും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രയോഗത്തിൽ καύχημα എന്നതിന്റെ അർഥം
  choice: ‘അഭിമാനിക്കാൻ വക’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പ്രശംസിക്കാനുള്ള അടിസ്ഥാനം’ അല്ലെങ്കിൽ ‘അഭിമാനം’
  rationale: ഇത് അഭിമാനിക്കുന്ന പ്രവൃത്തിയോ അതിനുള്ള കാരണമോ എന്ന രണ്ടുസാധ്യതകളും കുറച്ചെങ്കിലും തുറന്നുവെക്കുന്നു; ഇതിനെ നല്ല ആത്മാഭിമാനമായോ ദൈവസന്നിധിയിലെ അംഗീകാരമായോ നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- issue: ഏകവചന പൊതുകർത്താവും വ്യാകരണലിംഗവും
  choice: ‘ഓരോരുത്തനും’, ‘അയാൾക്ക്’ എന്ന ഏകവചനരൂപങ്ങൾ ഉപയോഗിച്ചു.
  alternative: ബഹുവചന ലിംഗനിരപേക്ഷ രൂപം ഉപയോഗിക്കുക
  rationale: ഗ്രീക്കിലെ ഏകവചന ഘടന നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. താരതമ്യത്തിന്റെ ആശയം സ്വാഭാവികമാക്കാൻ അവസാനഘടകം അല്പം വ്യക്തീകരിച്ചിരിക്കുന്നു; മുഖ്യപാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി ഒത്തിരിക്കുന്നു.
