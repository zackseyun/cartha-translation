revisions:
- from: എന്നാൽ ഓരോരുത്തനും സ്വന്തം പ്രവൃത്തി പരിശോധിക്കട്ടെ. അപ്പോൾ മറ്റൊരാളുമായി താരതമ്യം ചെയ്യുന്നതിലല്ല, തന്നിൽത്തന്നെ മാത്രമായിരിക്കും അയാൾക്ക് അഭിമാനിക്കാൻ വകയുണ്ടാകുക[a].
  to: എന്നാൽ ഓരോരുത്തനും സ്വന്തം പ്രവൃത്തി പരിശോധിക്കട്ടെ. അപ്പോൾ തന്നെ സംബന്ധിച്ച് മാത്രമേ, മറ്റൊരാളെ സംബന്ധിച്ചല്ല, അയാൾക്ക് അഭിമാനിക്കാനുള്ള വകയുണ്ടാകൂ[a].
  rationale: മുഖ്യപാഠത്തിലെ ‘താരതമ്യം ചെയ്യുക’ എന്ന വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കി, εἰς ἑαυτὸν μόνον / οὐκ εἰς τὸν ἕτερον എന്നതിലെ ‘തന്നെ സംബന്ധിച്ച്—മറ്റൊരാളെ സംബന്ധിച്ചല്ല’ എന്ന വിരുദ്ധസമാന്തരത നിലനിർത്തി. ഇതിലൂടെ സന്ദർഭത്തിലെ താരതമ്യവിരുദ്ധ ആശയം നിഷേധിക്കാതെ, മൂലപാഠം പറയുന്നതിലധികം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല. അടിക്കുറിപ്പും καύχημαയുടെ അർഥപരിധി കൂടുതൽ കൃത്യമായി വ്യക്തമാക്കാൻ പരിഷ്കരിച്ചു.
