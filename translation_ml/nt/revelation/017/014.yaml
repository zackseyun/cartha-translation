id: REV.17.14
reference: Revelation 17:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: ml
  text: ഇവർ കുഞ്ഞാടിനെതിരേ യുദ്ധം ചെയ്യും[a]; കുഞ്ഞാട് അവരെ ജയിക്കും; കാരണം, അവൻ കർത്താക്കന്മാരുടെ കർത്താവും രാജാക്കന്മാരുടെ രാജാവുമാണ്. അവനോടുകൂടെയുള്ളവർ വിളിക്കപ്പെട്ടവരും തിരഞ്ഞെടുക്കപ്പെട്ടവരും വിശ്വസ്തരുമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, ‘കുഞ്ഞാടിനോടുകൂടെ യുദ്ധം ചെയ്യും’; എന്നാൽ യുദ്ധസന്ദർഭത്തിൽ ഇതിന്റെ അർഥം കുഞ്ഞാടിനെതിരേ യുദ്ധം ചെയ്യുക എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: ഇവർ
  rationale: മുൻസന്ദർഭത്തിലെ രാജാക്കന്മാരെയും മൃഗത്തോടു ചേർന്ന ശക്തികളെയും ചൂണ്ടിക്കാണിക്കുന്ന സർവനാമത്തിന്റെ ദൈക്തിക ബലം നിലനിർത്തുന്നു.
- source_word: μετὰ τοῦ ἀρνίου
  choice: കുഞ്ഞാടിനോടു
  rationale: μετά + genitive എന്ന രൂപം അക്ഷരാർഥത്തിൽ ‘കൂടെ’ എന്നായാലും πολεμέω എന്ന യുദ്ധക്രിയയോടൊപ്പം ഇവിടെ വിരോധിയുടെ ദിശയാണ് സൂചിപ്പിക്കുന്നത്; ‘യുദ്ധം ചെയ്യും’ എന്ന ക്രിയയോടു ചേർന്ന് മലയാളത്തിൽ പ്രതിയോഗിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀρνίον
  choice: കുഞ്ഞാട്
  rationale: വെളിപ്പാടുപുസ്തകത്തിലെ സ്ഥിരമായ ക്രിസ്തുശീർഷകം; മലയാള ബൈബിൾഭാഷയിലും സ്വാഭാവികവും തിരിച്ചറിയാവുന്നതുമായ രൂപം.
- source_word: πολεμήσουσιν
  choice: യുദ്ധം ചെയ്യും
  rationale: ഭാവികാലവും സൈനിക-അപ്പോക്കലിപ്റ്റിക് ഭാവവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: νικήσει
  choice: ജയിക്കും
  rationale: νικάω എന്ന ആവർത്തിത പ്രമേയക്രിയയുടെ വിജയം/അതിജയം എന്ന ആശയം യുദ്ധസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: കുഞ്ഞാടിന്റെ വിജയത്തിനുള്ള കാരണം നേരിട്ട് അവതരിപ്പിക്കുന്ന കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: κύριος κυρίων
  choice: കർത്താക്കന്മാരുടെ കർത്താവ്
  rationale: പരമാധികാരം സൂചിപ്പിക്കുന്ന സെമിറ്റിക് ശൈലിയിലുള്ള ബഹുമാനപദവി നിലനിർത്തുന്നു.
- source_word: βασιλεὺς βασιλέων
  choice: രാജാക്കന്മാരുടെ രാജാവ്
  rationale: സകല രാജാധികാരത്തിനുമേലുള്ള പരമാധികാരം പ്രകടിപ്പിക്കുന്ന പരമ്പരാഗത പദവി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἱ μετ’ αὐτοῦ
  choice: അവനോടുകൂടെയുള്ളവർ
  rationale: കുഞ്ഞാടിനൊപ്പം ഉള്ളവരെ സൂചിപ്പിക്കുന്ന substantival പ്രയോഗം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: κλητοὶ
  choice: വിളിക്കപ്പെട്ടവർ
  rationale: ക്ഷണം, വിളി, ദൈവിക ആഹ്വാനം എന്നിവയിൽ ഒന്നിനെ സിദ്ധാന്തപരമായി നിർണയിക്കാതെ κλητός എന്ന പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: ἐκλεκτοὶ
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  rationale: പിൽക്കാല സിദ്ധാന്തസംവിധാനം ഇറക്കുമതി ചെയ്യാതെ തിരഞ്ഞെടുപ്പിന്റെ അടിസ്ഥാന അർഥം സാധാരണ വായനക്കാർക്കു വ്യക്തമാക്കുന്നു.
- source_word: πιστοί
  choice: വിശ്വസ്തർ
  rationale: ഈ ത്രയത്തിൽ ഉറച്ച വിശ്വാസവും വിശ്വസ്തമായ അനുസരണവും ഉൾക്കൊള്ളുന്ന അർഥം നൽകുന്നു; ‘വിശ്വസിക്കുന്നവർ’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: കുഞ്ഞാടിന്റെ ശീർഷകവും വിജയഭാഷയും
  choice: ‘കുഞ്ഞാട്’ എന്നും ‘ജയിക്കും’ എന്നും നൽകി വെളിപ്പാടുപുസ്തകത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരവും പ്രമേയപരവുമായ പദാവലി നിലനിർത്തുക.
  alternative: ‘ആട്ടിൻകുട്ടി ... അതിജയിക്കും’ അല്ലെങ്കിൽ ‘കുഞ്ഞാട് ... വിജയിക്കും’.
  rationale: ἀρνίον എന്നത് വെളിപ്പാടുപുസ്തകത്തിലെ പ്രത്യേക ശീർഷകവും νικάω ആവർത്തിക്കുന്ന മുഖ്യപ്രമേയവുമാണ്; വ്യാഖ്യാനാതീതമായ അധിക സിദ്ധാന്തം ചേർക്കാതെ ഗ്രന്ഥാന്തര ഏകോപനം സംരക്ഷിക്കുന്നു.
- issue: κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί എന്ന ത്രയം
  choice: ‘വിളിക്കപ്പെട്ടവരും തിരഞ്ഞെടുക്കപ്പെട്ടവരും വിശ്വസ്തരും’ എന്ന് മൂന്നു വിശേഷണങ്ങളും അതേ നിരയിൽ നിലനിർത്തുക.
  alternative: ‘വിളിക്കപ്പെട്ടവരും തിരഞ്ഞെടുക്കപ്പെട്ടവരും വിശ്വാസികളുമായവർ’ അല്ലെങ്കിൽ സിദ്ധാന്തപരമായ ക്രമം വിശദീകരിക്കുന്ന വിവർത്തനം.
  rationale: വിളി, തിരഞ്ഞെടുപ്പ്, വിശ്വസ്തത എന്നിവ തമ്മിലുള്ള ബന്ധം വാക്യം വിശദീകരിക്കുന്നില്ല; അതിനാൽ രക്ഷാക്രമമോ പ്രത്യേക വിഭാഗീയ സിദ്ധാന്തമോ വിവർത്തനത്തിൽ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കർത്താക്കന്മാരുടെ കർത്താവ്’, ‘രാജാക്കന്മാരുടെ രാജാവ്’ എന്നീ ഉയർന്ന ശീർഷകങ്ങൾ സംരക്ഷിച്ചു; അവസാനത്തെ മൂന്നു വിശേഷണങ്ങളും ഗ്രീക്ക് വാക്യത്തിന്റെ സമാന്തരഘടനയനുസരിച്ച് നിലനിർത്തി.
