source:
  edition: SBLGNT
  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: ml
  text: 'ഇവിടെ ജ്ഞാനമുള്ള മനസ്സ് വേണം: ഏഴു തലകൾ, സ്ത്രീ അവയുടെമേൽ ഇരിക്കുന്ന ഏഴു പർവതങ്ങളാണ്[a]; അവ ഏഴു രാജാക്കന്മാരുമാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഏഴു കുന്നുകൾ.” ഗ്രീക്ക് പദത്തിന് പർവതങ്ങളെയോ കുന്നുകളെയോ സൂചിപ്പിക്കാം; “പർവതങ്ങൾ” എന്നതാണ് കൂടുതൽ നേരിട്ടുള്ള വിവർത്തനം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε
  choice: ഇവിടെയാണ്
  rationale: തുടർന്നുവരുന്ന പ്രതീകവ്യാഖ്യാനത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന സ്ഥാനസൂചകവും അവതാരകവുമായ പ്രയോഗം.
- source_word: ὁ νοῦς ὁ ἔχων σοφίαν
  choice: ജ്ഞാനമുള്ള മനസ്സ് ആവശ്യമായിരിക്കുന്നത്
  rationale: ഗ്രീക്ക് വാക്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പ്രതീകങ്ങൾ ഗ്രഹിക്കാൻ ജ്ഞാനപൂർവമായ വിവേചനം വേണ്ടതാണെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: ഏഴു തലകൾ
  rationale: പ്രതീകത്തെ വ്യാഖ്യാനിച്ച് മാറ്റാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἑπτὰ ὄρη
  choice: ഏഴു പർവതങ്ങൾ
  rationale: ὄρη എന്നതിന്റെ നേരിട്ടുള്ള സാധാരണ അർഥം; ‘കുന്നുകൾ’ എന്ന സാധ്യമായ വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν
  choice: സ്ത്രീ ഇരിക്കുന്ന
  rationale: ὅπου ... ἐπ’ αὐτῶν എന്ന ഗ്രീക്ക് ഘടനയിലെ സ്ഥാനബന്ധം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പർവതങ്ങൾ’ എന്ന മുൻപദത്തോടുള്ള ബന്ധം വ്യക്തമാണ്.
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: അവ ഏഴു രാജാക്കന്മാരുമാണ്
  rationale: അവ്യക്തമായി സൂചിപ്പിച്ചിരിക്കുന്ന കർത്താവിനെ ഏഴു തലകളോട് ബന്ധിപ്പിക്കുകയും, പർവതങ്ങൾക്കും രാജാക്കന്മാർക്കും ഉള്ള സമാന്തര പ്രതീകാത്മക തിരിച്ചറിയൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഏഴു തലകളുടെ പ്രതീകാത്മക തിരിച്ചറിയൽ
  choice: തലകൾ പർവതങ്ങളും രാജാക്കന്മാരുമാണെന്ന വാക്യത്തിലെ തിരിച്ചറിയലുകൾ മാത്രം നിലനിർത്തുന്നു.
  alternative: പർവതങ്ങളെ റോമിലെ ഏഴു കുന്നുകളായോ രാജാക്കന്മാരെ പ്രത്യേക ചക്രവർത്തിമാർ, ഭരണാധികാരികൾ, അല്ലെങ്കിൽ രാജ്യങ്ങൾ ആയോ വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം തന്നെ ചരിത്രപരമായ സൂചനയെ നിർണായകമായി തീർപ്പാക്കുന്നില്ല; അതിനാൽ വിവർത്തനം പ്രത്യേക വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതെ പ്രതീകാത്മകവും ദൈവശാസ്ത്രപരവുമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്തവും വ്യാഖ്യാനാത്മകവുമായ സ്വരം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമായ സ്ഥാനസൂചക ആവർത്തനം ഒഴിവാക്കി.
