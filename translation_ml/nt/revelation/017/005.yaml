id: REV.17.5
reference: Revelation 17:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: ml
  text: 'അവളുടെ നെറ്റിയിൽ ഒരു പേര് എഴുതിയിരുന്നു: “രഹസ്യം[a], മഹതിയായ ബാബിലോൺ, ഭൂമിയിലെ വേശ്യകളുടെയും മ്ലേച്ഛതകളുടെയും അമ്മ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവളുടെ നെറ്റിയിൽ ഒരു പേര് എഴുതിയിരുന്നു—ഒരു രഹസ്യം: മഹതിയായ ബാബിലോൺ, ഭൂമിയിലെ വേശ്യകളുടെയും മ്ലേച്ഛതകളുടെയും അമ്മ.” ഈ വായനയിൽ “രഹസ്യം” എന്നത് ലിഖിതത്തിന്റെ ഭാഗമല്ല; തുടർന്നുള്ള പേരിന്റെ പ്രതീകാർഥത്തെ പരിചയപ്പെടുത്തുന്നതാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: അവളുടെ നെറ്റിയിൽ
  rationale: ἐπίയും accusative-ഉം ഇവിടെ എഴുത്ത് സ്ഥിതിചെയ്യുന്ന ഇടം സൂചിപ്പിക്കുന്നു; ആ ദൃശ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὄνομα γεγραμμένον
  choice: ഒരു പേര് എഴുതിയിരുന്നു
  rationale: γεγραμμένον എന്ന perfect passive participle-ന്റെ ഫലാവസ്ഥയും നിഷ്ക്രിയഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μυστήριον
  choice: രഹസ്യം
  rationale: അജ്ഞാതമോ മറഞ്ഞതോ ആയ കാര്യം എന്ന അപോകലിപ്റ്റിക് അർഥം നൽകുന്നു. മുഖ്യവായനയിൽ ഇത് നെറ്റിയിലെ പേരിന്റെ ഭാഗമെന്ന നിലയിൽ നിലനിർത്തുന്നു.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: മഹതിയായ ബാബിലോൺ
  rationale: Βαβυλών എന്ന സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ἡ μεγάλη എന്ന വിശേഷണം സ്വാഭാവികമായ പദക്രമത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἡ μήτηρ
  choice: അമ്മ
  rationale: തുടർന്നുള്ള ബന്ധസൂചക പദസമൂഹത്തിന്റെ ശീർഷകാത്മകവും രൂപകാത്മകവുമായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τῶν πορνῶν
  choice: വേശ്യകളുടെ
  rationale: πόρνη എന്ന പദത്തിന്റെ വ്യക്തമായ ലൈംഗിക-സാമൂഹിക അർഥം പൊതുവായ ‘ലൈംഗിക അധാർമികർ’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് വികസിപ്പിക്കാതെ നൽകുന്നു.
- source_word: τῶν βδελυγμάτων
  choice: മ്ലേച്ഛതകളുടെ
  rationale: βδέλυγμα സൂചിപ്പിക്കുന്ന മതപരവും ധാർമികവുമായ അറപ്പുളവാക്കുന്ന കാര്യങ്ങളുടെ ശക്തമായ ബൈബിൾഭാവം സംരക്ഷിക്കുന്നു.
- source_word: τῆς γῆς
  choice: ഭൂമിയിലെ
  rationale: വെളിപ്പാടിന്റെ ആഗോള-അപോകലിപ്റ്റിക് പശ്ചാത്തലത്തിൽ γῆയ്ക്ക് ‘ഭൂമി’ യോജിക്കുന്നു; മലയാളത്തിൽ ഈ ബന്ധം സ്വാഭാവികമായി ‘ഭൂമിയിലെ’ എന്നു പറയുന്നു.
theological_decisions:
- issue: μυστήριον ലിഖിതനാമത്തിന്റെ ഭാഗമാണോ, തുടർന്നുള്ള പേരിന്റെ പ്രതീകാർഥം പരിചയപ്പെടുത്തുന്ന വിവരണപദമാണോ
  choice: 'മുഖ്യവായനയിൽ അത് ലിഖിതത്തിന്റെ ഭാഗമായി: “രഹസ്യം, മഹതിയായ ബാബിലോൺ...”'
  alternative: '“ഒരു പേര് എഴുതിയിരുന്നു—ഒരു രഹസ്യം: മഹതിയായ ബാബിലോൺ...” എന്നിങ്ങനെ, തുടർന്നുള്ള പേരിന്റെ പ്രതീകാർഥം പരിചയപ്പെടുത്തുന്ന പദമായി വായിക്കാം.'
  rationale: ഗ്രീക്ക് മൂലപാഠത്തിലെ പദക്രമം μυστήριον ലിഖിതത്തിന്റെ ഭാഗമായി വായിക്കാൻ അനുവദിക്കുന്നു; എന്നാൽ പുരാതന പാഠത്തിലെ വിരാമചിഹ്നാഭാവം കാരണം മറ്റൊരു വായനയും സാധുവാണ്. ആ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദർശനത്തിലെ കടുത്ത രൂപകഭാഷ മയപ്പെടുത്താതെ നിലനിർത്തിയിരിക്കുന്നു; യഥാർഥ വിരാമചിഹ്ന-വ്യാഖ്യാന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
