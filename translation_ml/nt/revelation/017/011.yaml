id: REV.17.11
reference: Revelation 17:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: ml
  text: മുമ്പ് ഉണ്ടായിരുന്നതും ഇപ്പോൾ ഇല്ലാത്തതുമായ മൃഗം തന്നെയാണ് എട്ടാമത്തേത്[a]; അത് ആ ഏഴിൽനിന്നുള്ളതുമാണ്[b], നാശത്തിലേക്കു പോകുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മൃഗം തന്നെയാണ് എട്ടാമത്തെ രാജാവ്.’ സന്ദർഭത്തിൽ ‘രാജാവ്’ എന്ന നാമം സൂചിതമാണെങ്കിലും ഗ്രീക്കിൽ അത് പറഞ്ഞിട്ടില്ല.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ആ ഏഴിൽ ഒരാളാണ്.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ആ ഏഴിൽനിന്നുള്ളത്’ എന്നാണ്; ഇത് ഉത്ഭവത്തെയോ അംഗത്വത്തെയോ അടുത്ത ബന്ധത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാടിലെ ദൈവവിരുദ്ധമായ ഭീകര രാഷ്ട്രീയ-ആത്മീയ ശക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ അപ്പോക്കലിപ്റ്റിക് പദമായി ‘മൃഗം’ സ്വാഭാവികവും അന്തർപാഠബന്ധം നിലനിർത്തുന്നതുമാണ്.
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: മുമ്പ് ഉണ്ടായിരുന്നതും ഇപ്പോൾ ഇല്ലാത്തതുമായ
  rationale: ഗ്രീക്കിലെ കൂർമ്മമായ കാലവൈരുധ്യം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു; ‘ഇനിയില്ല’ എന്നതിലൂടെ കാലപരമായ അർഥം അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: αὐτὸς
  choice: മൃഗംതന്നെ
  rationale: ഊന്നൽ വ്യക്തമാക്കുകയും സൂചിതവസ്തുവായ മൃഗത്തോടുള്ള സ്വാഭാവിക മലയാള യോജിപ്പ് പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: ὄγδοός
  choice: എട്ടാമത്തേത്
  rationale: ഗ്രീക്കിൽ നാമപദം വ്യക്തമാക്കിയിട്ടില്ല. സന്ദർഭത്തിൽ ‘രാജാവ്’ സൂചിതമായിരിക്കാമെങ്കിലും പ്രധാനവാചകത്തിൽ അത് ചേർക്കാതെ മൂലത്തിന്റെ സംക്ഷിപ്തതയും അവ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν ἑπτά
  choice: ആ ഏഴിൽനിന്നുള്ളത്
  rationale: ἐκ എന്നതിന്റെ ഉത്ഭവം, അംഗത്വം, അടുത്ത ബന്ധം എന്നീ സാധ്യതകൾ തുറന്നുവെക്കുന്നു; ‘ഏഴിൽ ഒരാൾ’ എന്ന് അർഥം ചുരുക്കുന്നില്ല.
- source_word: εἰς ἀπώλειαν
  choice: നാശത്തിലേക്ക്
  rationale: അന്ത്യകാല വിധിയെയും പൂർണ തകർച്ചയെയും സൂചിപ്പിക്കുന്ന ഗൗരവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὑπάγει
  choice: പോകുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ സജീവത ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὄγδοός എന്നതിനോടൊപ്പം സൂചിതമായ നാമം ‘രാജാവ്’ എന്നു വ്യക്തമാക്കണമോ
  choice: പ്രധാനവാചകത്തിൽ ‘എട്ടാമത്തേത്’ എന്നു മാത്രം നൽകി നാമം സൂചിതമായി വിടുന്നു.
  alternative: ‘എട്ടാമത്തെ രാജാവ്’
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭം രാജാക്കന്മാരെക്കുറിച്ചാണെങ്കിലും ഈ വാക്യത്തിൽ βασιλεύς ഇല്ല. അതിനാൽ വ്യാഖ്യാനപരമായ പൂരണം അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു.
- issue: ἐκ τῶν ἑπτά എന്നതിനെ ‘ഏഴിൽ ഒരാൾ’ എന്നു നിർണയിക്കണമോ
  choice: ‘ആ ഏഴിൽനിന്നുള്ളത്’ എന്ന് വിവർത്തനം ചെയ്യുന്നു.
  alternative: ‘ആ ഏഴിൽ ഒരാൾ’
  rationale: മൂലവാക്യം ഉത്ഭവമോ അംഗത്വമോ അടുത്ത ബന്ധമോ സൂചിപ്പിക്കാം. പ്രത്യേക തിരിച്ചറിയൽ നിർബന്ധിക്കാതെ പ്രതീകാത്മകമായ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വെളിപ്പാടിന്റെ പ്രതീകാത്മക സ്വരം നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്കിലെ നാമരഹിത പ്രയോഗവും ἐκ എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
