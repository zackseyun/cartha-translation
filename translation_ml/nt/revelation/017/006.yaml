id: REV.17.6
reference: Revelation 17:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: ml
  text: വിശുദ്ധരുടെ രക്തത്താലും യേശുവിന്റെ സാക്ഷികളുടെ[a] രക്തത്താലും മത്തുപിടിച്ച ആ സ്ത്രീയെ ഞാൻ കണ്ടു. അവളെ കണ്ടപ്പോൾ ഞാൻ അത്യന്തം ആശ്ചര്യപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യേശുവിന്റെ രക്തസാക്ഷികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് ‘സാക്ഷികൾ’ എന്നും ‘രക്തസാക്ഷികൾ’ എന്നും അർഥമാകാം; അവരുടെ രക്തം പരാമർശിക്കുന്നതിനാൽ ‘രക്തസാക്ഷികൾ’ എന്ന അർഥം ഈ സന്ദർഭത്തിൽ പ്രത്യേകമായി യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθύουσαν ἐκ τοῦ αἵματος
  choice: രക്തം കുടിച്ച് മത്തയായിരുന്ന
  rationale: ἐκ എന്നതിന്റെ ഉറവിട/കാരണം സൂചിപ്പിക്കുന്ന ഭാവവും രക്തപാനത്തിലൂടെയുള്ള മത്തതയുടെ ഞെട്ടിക്കുന്ന ദൃശ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധർ
  rationale: വെളിപ്പാടിൽ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്ന പതിവായ, സംക്ഷിപ്തമായ പദം.
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: യേശുവിന്റെ സാക്ഷികൾ
  rationale: μάρτυς എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘സാക്ഷി’ നിലനിർത്തുന്നു; രക്തത്തെക്കുറിച്ചുള്ള സന്ദർഭം അവരുടെ രക്തസാക്ഷിത്വം വ്യക്തമാക്കുന്നതിനാൽ ആ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു. Ἰησοῦ എന്ന ജനിറ്റീവിന്റെ സംക്ഷിപ്തതയും സാധ്യതയുള്ള ബന്ധഭാവവും ‘യേശുവിന്റെ’ എന്നു സൂക്ഷിക്കുന്നു.
- source_word: ἐθαύμασα ... θαῦμα μέγα
  choice: ഞാൻ അത്യന്തം ആശ്ചര്യപ്പെട്ടു
  rationale: സജാതീയ അക്ക്യൂസറ്റീവ് ക്രിയയെ ശക്തിപ്പെടുത്തുന്നതാണ്; സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ തീവ്രത ക്രിയാവിശേഷണമായി നൽകുന്നു.
- source_word: ἰδὼν αὐτὴν
  choice: അവളെ കണ്ടപ്പോൾ
  rationale: എയോറിസ്റ്റ് പാർട്ടിസിപ്പിളിന്റെ കാലബന്ധം മലയാളത്തിലെ സ്വാഭാവിക ഉപവാക്യമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പീഡനസന്ദർഭത്തിൽ μάρτυρες എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാന പാഠത്തിൽ ‘സാക്ഷികൾ’
  alternative: ‘രക്തസാക്ഷികൾ’
  rationale: പദത്തിന്റെ അടിസ്ഥാനമായ സാക്ഷ്യഭാവം പ്രധാന പാഠത്തിൽ സംരക്ഷിക്കുന്നു; അവരുടെ രക്തം പരാമർശിക്കപ്പെടുന്നതിനാൽ രക്തസാക്ഷി എന്ന വികസിത അർഥം സന്ദർഭത്തിന് ഏറെ യോജിക്കുന്നു, അതിനാൽ അത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അപോകലിപ്റ്റിക് ദൃശ്യത്തിന്റെ ഞെട്ടിക്കുന്ന ശക്തി നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദ ഘടന ഒഴിവാക്കി.
