  to: വിശുദ്ധരുടെ രക്തത്താലും യേശുവിന്റെ സാക്ഷികളുടെ[a] രക്തത്താലും മത്തുപിടിച്ച ആ സ്ത്രീയെ ഞാൻ കണ്ടു. അവളെ കണ്ടപ്പോൾ ഞാൻ അത്യന്തം ആശ്ചര്യപ്പെട്ടു.
