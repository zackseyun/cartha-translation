id: REV.17.1
reference: Revelation 17:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: ml
  text: 'പിന്നെ, ഏഴു കലശങ്ങൾ കൈവശമുണ്ടായിരുന്ന ഏഴു ദൂതന്മാരിൽ ഒരാൾ വന്ന് എന്നോടു സംസാരിച്ചു: “വരൂ, അനേകം ജലങ്ങളുടെമേൽ ഇരിക്കുന്ന മഹാവേശ്യയ്‌ക്കെതിരായ ന്യായവിധി[a] ഞാൻ നിനക്കു കാണിച്ചുതരാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കുറ്റവിധി” അല്ലെങ്കിൽ “ശിക്ഷ.”
    reason: κρίμα എന്ന പദം ന്യായവിധി, കുറ്റനിർണയം, അതിന്റെ ശിക്ഷാത്മക ഫലം എന്നീ അർഥനിറങ്ങൾ വഹിക്കാം.
lexical_decisions:
- source_word: Καὶ
  choice: പിന്നെ
  rationale: കഥനത്തിന്റെ തുടർച്ചയും അടുത്ത ദർശനത്തിലേക്കുള്ള നീക്കവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἦλθεν
  choice: വന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനഭൂതകാല അർഥം നിലനിർത്തുന്നു.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: ഏഴു ദൂതന്മാരിൽ ഒരാൾ
  rationale: ഗ്രീക്കിലെ അംശസൂചക ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: ഏഴു പാത്രങ്ങൾ കൈവശമുണ്ടായിരുന്ന
  rationale: ദൂതന്മാരെ തിരിച്ചറിയിക്കുന്ന പങ്കാളിക്രിയാ ഘടന സംരക്ഷിക്കുന്നു; φιάλη ഇവിടെ വെളിപ്പാടിലെ ദൈവക്രോധത്തിന്റെ വിശാലപാത്രത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘പാത്രം’ ഉപയോഗിച്ചു.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: എന്നോടു സംസാരിച്ചു
  rationale: μετά + genitive എന്ന ‘എന്നോടൊപ്പം/എന്നോട്’ ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക സംസാരപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: λέγων
  choice: 'സംസാരിച്ചു:'
  rationale: മലയാളത്തിൽ വേറൊരു ‘പറഞ്ഞുകൊണ്ട്’ ചേർക്കുന്നത് ആവർത്തനമാകുന്നതിനാൽ ഉദ്ധരണിക്ക് മുമ്പുള്ള വിരാമചിഹ്നത്തിലൂടെ വാക്കിന്റെ പ്രവർത്തനം പ്രകടമാക്കുന്നു.
- source_word: Δεῦρο
  choice: വരൂ
  rationale: നേരിട്ടുള്ള ക്ഷണം/ആഹ്വാനം മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: δείξω σοι
  choice: ഞാൻ നിനക്കു കാണിച്ചുതരാം
  rationale: ഭാവികാല വാഗ്ദാനം നേരിട്ട് നിലനിർത്തുന്നു; ‘കാണിച്ചുതരാം’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: τὸ κρίμα
  choice: ന്യായവിധി
  rationale: വിധിപ്രഖ്യാപനവും അതിന്റെ ശിക്ഷാത്മക ഫലവും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ ന്യായിക അർഥം സംരക്ഷിക്കുന്നു.
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: മഹാവേശ്യയ്ക്കുള്ള
  rationale: πόρνηയുടെ ശക്തമായ പ്രവാചകീയ രൂപകം മയപ്പെടുത്താതെ, പഴമയോ അത്യന്തം അസഭ്യതയോ ഇല്ലാത്ത നിലവാരമുള്ള മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: അനേകം വെള്ളങ്ങളുടെമേൽ ഇരിക്കുന്ന
  rationale: ἐπίയുടെ ‘മേൽ’ എന്ന ദൃശ്യരൂപവും ഇരിപ്പിന്റെ പ്രതീകാത്മക അനിശ്ചിതത്വവും പിന്നീടുള്ള വ്യാഖ്യാനത്തിന് വിട്ടുകൊണ്ട് നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ബാബിലോണിനെ സൂചിപ്പിക്കുന്ന πόρνη എന്ന രൂപകപദം
  choice: മഹാവേശ്യ
  alternative: മഹാവ്യഭിചാരിണി
  rationale: ‘വേശ്യ’ മൂലപദത്തിന്റെ നേരിട്ടുള്ള ലൈംഗിക-പ്രവാചകീയ രൂപകം നിലനിർത്തുന്നു; ‘വ്യഭിചാരിണി’ വിവാഹബന്ധലംഘനം എന്ന കൂടുതൽ നിർദിഷ്ട ആശയം അനാവശ്യമായി മുൻനിർത്താം.
- issue: അപ്പോക്കലിപ്റ്റിക് സാഹചര്യത്തിലെ κρίμα
  choice: ന്യായവിധി
  alternative: കുറ്റവിധി / ശിക്ഷ
  rationale: ഗ്രീക്ക് പദം വിധി, കുറ്റനിർണയം, ശിക്ഷാത്മക ഫലം എന്നിവ ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ ഒരു വശത്തേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- issue: ‘അനേകം വെള്ളങ്ങളുടെമേൽ’ എന്ന പ്രതീകത്തിന്റെ വ്യാഖ്യാനം
  choice: പ്രതീകചിത്രം അതേപടി നിലനിർത്തി
  alternative: അനേകം ജനതകളുടെമേൽ ആധിപത്യം നടത്തുന്ന
  rationale: വാക്യം 15-ൽ ലഭിക്കുന്ന വ്യാഖ്യാനം ഈ വാക്യത്തിലേക്ക് മുൻകൂട്ടി കൊണ്ടുവരാതെ മൂലവാക്യത്തിന്റെ ദൃശ്യവും വെളിപ്പെടുത്തൽക്രമവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദർശനസാഹിത്യത്തിന്റെ പ്രതീകാത്മക ശക്തി നിലനിർത്തി; അനാവശ്യമായ സഭാപാരമ്പര്യ പദങ്ങളും വ്യാഖ്യാനവിപുലീകരണവും ഒഴിവാക്കി. പ്രധാനപാഠത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
