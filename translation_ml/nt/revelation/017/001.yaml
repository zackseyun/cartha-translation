revisions:
- from: 'പിന്നെ, ഏഴു പാത്രങ്ങൾ കൈവശമുണ്ടായിരുന്ന ഏഴു ദൂതന്മാരിൽ ഒരാൾ വന്ന് എന്നോടു സംസാരിച്ചു: “വരൂ, അനേകം വെള്ളങ്ങളുടെമേൽ ഇരിക്കുന്ന മഹാവേശ്യയ്ക്കുള്ള ന്യായവിധി[a] ഞാൻ നിനക്കു കാണിച്ചുതരാം.”'
  to: 'പിന്നെ, ഏഴു കലശങ്ങൾ കൈവശമുണ്ടായിരുന്ന ഏഴു ദൂതന്മാരിൽ ഒരാൾ വന്ന് എന്നോടു സംസാരിച്ചു: “വരൂ, അനേകം ജലങ്ങളുടെമേൽ ഇരിക്കുന്ന മഹാവേശ്യയ്‌ക്കെതിരായ ന്യായവിധി[a] ഞാൻ നിനക്കു കാണിച്ചുതരാം.”'
  rationale: 'The revision makes two limited fidelity improvements: it renders φιάλας specifically as “കലശങ്ങൾ,” and it clarifies that the judgment is directed against the great prostitute. The metaphor of the prostitute and the unexplained image of many waters remain intact. The existing footnote anchor and its lexical alternatives remain appropriate.'
