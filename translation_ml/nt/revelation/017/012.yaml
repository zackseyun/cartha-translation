id: REV.17.12
reference: Revelation 17:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: ml
  text: നീ കണ്ട പത്ത് കൊമ്പുകൾ പത്ത് രാജാക്കന്മാരാണ്. അവർക്ക് ഇതുവരെ രാജ്യം ലഭിച്ചിട്ടില്ല; എന്നാൽ അവർ ഒരു മണിക്കൂർ[a] രാജാക്കന്മാരായി മൃഗത്തോടൊപ്പം അധികാരം പ്രാപിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അൽപ്പകാലത്തേക്ക്.’ അപ്പോക്കലിപ്റ്റിക് ദൃശ്യഭാഷയിൽ ‘ഒരു മണിക്കൂർ’ എന്ന പ്രയോഗം ഹ്രസ്വവും പരിമിതവുമായ ഒരു കാലയളവിനെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέρατα
  choice: കൊമ്പുകൾ
  rationale: അപ്പോക്കലിപ്റ്റിക് ദൃശ്യബിംബം നിലനിർത്താൻ പദം അക്ഷരാർഥത്തിൽ പരിഭാഷപ്പെടുത്തി; പിന്നാലെ അവയെ രാജാക്കന്മാരായി തിരിച്ചറിയുന്നതിലൂടെ പ്രതീകാർഥം വാക്യംതന്നെ വ്യക്തമാക്കുന്നു.
- source_word: βασιλεῖς
  choice: രാജാക്കന്മാർ
  rationale: പദത്തിന്റെ സാധാരണ അർഥം നേരിട്ട് നൽകുന്നു; വിശാലമായ രാഷ്ട്രീയ ഭരണാധികാരികളെ പ്രതീകപ്പെടുത്താനുള്ള സാധ്യത വ്യാഖ്യാനത്തിലൂടെ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: βασιλείαν
  choice: രാജ്യം
  rationale: ഇവിടെ ലഭിക്കാത്ത ഒരു ഭരണരാജ്യത്തെയോ രാജാധിപത്യപരിധിയെയോ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; തുടർന്ന് വരുന്ന ‘അധികാരം’ എന്ന വ്യത്യസ്ത ആശയത്തിൽനിന്നും ഇതിനെ വേർതിരിക്കുന്നു.
- source_word: οὔπω ἔλαβον
  choice: ഇതുവരെ രാജ്യം ലഭിച്ചിട്ടില്ല
  rationale: ദർശനത്തിലെ സമയത്തോളം അവർ രാജ്യം പ്രാപിച്ചിട്ടില്ലെന്ന വർത്തമാനപ്രസക്തിയുള്ള കാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: നൽകപ്പെടുന്ന ഭരണാവകാശമോ അധികാരമോ കൃത്യമായി സൂചിപ്പിക്കുകയും ‘രാജ്യം’ എന്ന മുൻപത്തെ പദവുമായി ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὡς βασιλεῖς
  choice: രാജാക്കന്മാരായി
  rationale: അവർ അധികാരം പ്രാപിക്കുന്ന പദവിയോ നിലയോ നേരിട്ട് പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: μίαν ὥραν
  choice: ഒരു മണിക്കൂർ
  rationale: അപ്പോക്കലിപ്റ്റിക് പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; ‘അല്പകാലം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: λαμβάνουσιν
  choice: പ്രാപിക്കുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലത്തെ ദർശനവിവരണത്തിന്റെ സജീവശൈലിയിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഭാവിസൂചന ഉണ്ടാകാമെങ്കിലും അത് മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: μετὰ τοῦ θηρίου
  choice: മൃഗത്തോടൊപ്പം
  rationale: മൃഗവുമായുള്ള സഹവർത്തിത്വമോ കൂട്ടുകെട്ടോ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: θηρίου
  choice: മൃഗം
  rationale: വെളിപ്പാടുപുസ്തകത്തിലെ സ്ഥിരമായ പ്രതീകബിംബം നിലനിർത്തുന്ന കൃത്യവും ലളിതവുമായ പരിഭാഷ.
theological_decisions:
- issue: പത്തു രാജാക്കന്മാർ അക്ഷരാർഥത്തിലുള്ള രാജാക്കന്മാരാണോ പ്രതീകാത്മക ഭരണാധികാരികളോ ശക്തികളോ എന്നത്
  choice: ‘പത്തു രാജാക്കന്മാർ’ എന്ന ഉറവിടപദത്തിന്റെ നേരിട്ടുള്ള രൂപം നിലനിർത്തി.
  alternative: പത്തു ഭരണാധികാരികൾ; പത്തു രാഷ്ട്രീയ ശക്തികൾ; പത്തു രാജ്യങ്ങൾ
  rationale: ഗ്രീക്ക് പാഠം വ്യക്തമായി ‘രാജാക്കന്മാർ’ എന്നു പറയുന്നു; അതേസമയം സന്ദർഭം അപ്പോക്കലിപ്റ്റിക് പ്രതീകാത്മകത സൂചിപ്പിക്കുന്നു. പരിഭാഷ ഈ പിരിമുറുക്കം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കുന്നില്ല.
- issue: μίαν ὥραν അക്ഷരാർഥത്തിലുള്ള ഒരു മണിക്കൂറാണോ പ്രതീകാത്മകമായ അല്പകാലമാണോ എന്നത്
  choice: മുഖ്യപാഠത്തിൽ ‘ഒരു മണിക്കൂർ’ എന്നു നൽകി, പ്രതീകാത്മക സാധ്യത അടിക്കുറിപ്പിൽ ചേർത്തു.
  alternative: അല്പകാലത്തേക്ക്; കുറച്ചുനേരത്തേക്ക്
  rationale: ഉറവിടപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഒരു മണിക്കൂർ’ എന്നാണ്; അപ്പോക്കലിപ്റ്റിക് ഭാഷയിൽ അത് ഹ്രസ്വവും പരിമിതവുമായ കാലത്തെ സൂചിപ്പിക്കാം. രണ്ടും സംരക്ഷിക്കാൻ ഔപചാരിക രൂപം മുഖ്യപാഠത്തിലും വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കൊമ്പുകൾ,’ ‘രാജാക്കന്മാർ,’ ‘മൃഗം’ എന്നീ ദൃശ്യപദങ്ങൾ പ്രതീകാർഥം മുൻകൂട്ടി വിശദീകരിക്കാതെ നിലനിർത്തി. അടിക്കുറിപ്പ് യഥാർഥത്തിൽ വിശദീകരിക്കുന്ന ‘ഒരു മണിക്കൂർ’ എന്ന പ്രയോഗത്തിന് പിന്നാലെയാണ് [a] ചിഹ്നം നൽകിയിരിക്കുന്നത്.
