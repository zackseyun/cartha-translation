id: REV.17.8
reference: Revelation 17:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: ml
  text: നീ കണ്ട മൃഗം ഉണ്ടായിരുന്നു, ഇപ്പോൾ ഇല്ല. അത് അഗാധഗർത്തത്തിൽനിന്ന് കയറിവരാനിരിക്കുന്നു; നാശത്തിലേക്കു പോകുന്നു. ലോകസ്ഥാപനം മുതൽ ജീവന്റെ പുസ്തകത്തിൽ പേര് എഴുതപ്പെട്ടിട്ടില്ലാത്ത ഭൂവാസികൾ ആ മൃഗത്തെ കാണുമ്പോൾ വിസ്മയിക്കും; കാരണം, അത് ഉണ്ടായിരുന്നു, ഇപ്പോൾ ഇല്ല, എന്നാൽ സന്നിഹിതമാകും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അത് ഉണ്ടായിരുന്നു, ഇപ്പോൾ ഇല്ല, എന്നാൽ സന്നിഹിതമാകും എന്നത് കണ്ട്.’ അവസാന ഭാഗത്തിലെ ഗ്രീക്ക് പദം ‘കാരണം’ എന്നോ ‘എന്നത്’ എന്നോ മനസ്സിലാക്കാം; ‘സന്നിഹിതമാകും’ എന്നതിന് ‘വന്നെത്തും’ അല്ലെങ്കിൽ ‘പ്രത്യക്ഷമാകും’ എന്നും വിവർത്തനം ചെയ്യാം.'
    reason: ὅτιയുടെ കാരണവാചക/ഉള്ളടക്കവാചക സാദ്ധ്യതയും παρέσταιയുടെ ‘സന്നിഹിതമാകുക/എത്തിച്ചേരുക’ എന്ന അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാടിലെ പ്രതീകാത്മകവും ഭീകരവുമായ ജീവിയെ സൂചിപ്പിക്കുന്ന പതിവും സ്വാഭാവികവുമായ മലയാളപദം; ‘ജന്തു’ എന്നതിനെക്കാൾ സന്ദർഭത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: ഉണ്ടായിരുന്നു, ഇപ്പോൾ ഇല്ല
  rationale: കാലപരമായ മൂർച്ചയുള്ള വൈരുധ്യം നിലനിർത്തുന്നു; ‘ഇപ്പോൾ’ മലയാളത്തിൽ വർത്തമാനകാല അർഥം വ്യക്തമാക്കുന്ന സ്വാഭാവിക പൂരകമാണ്.
- source_word: μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου
  choice: അഗാധഗർത്തത്തിൽനിന്ന് കയറിവരാനിരിക്കുന്നു
  rationale: μέλλει സൂചിപ്പിക്കുന്ന ആസന്നഭാവിയും ἀναβαίνειν സൂചിപ്പിക്കുന്ന മുകളിലേക്കുള്ള ചലനവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ἄβυσσος
  choice: അഗാധഗർത്തം
  rationale: അവസാനമില്ലാത്ത ആഴത്തിന്റെ വെളിപ്പാടുസാഹിത്യപരമായ ഭാവം നൽകുന്നു; പാരമ്പര്യവ്യാഖ്യാനമുള്ള ‘അടിയില്ലാക്കുഴി’യെക്കാൾ കുറച്ച് വ്യാഖ്യാനാത്മകമാണ്.
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: നാശത്തിലേക്കു പോകുകയും ചെയ്യും
  rationale: അന്തിമനാശത്തിലേക്കുള്ള ഗതിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; മലയാളവാക്യത്തിലെ ഭാവികാലക്രമവുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: θαυμασθήσονται
  choice: വിസ്മയിക്കും
  rationale: ആശ്ചര്യവും അമ്പരപ്പും ഉൾക്കൊള്ളുന്ന സ്വാഭാവികമായ ഭാവികാലപ്രയോഗം.
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: ഭൂവാസികൾ
  rationale: വെളിപ്പാടിൽ ആവർത്തിക്കുന്ന സ്ഥിരപ്രയോഗത്തെ സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: പേര് എഴുതപ്പെട്ടിട്ടില്ലാത്ത
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ τὸ ὄνομα നിലനിർത്തുന്നു; ഓരോ വ്യക്തിയുടെയും പേര് എന്ന വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: ജീവന്റെ പുസ്തകത്തിൽ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘പുസ്തകത്തിന്മേൽ’ എന്നായാലും, പേര് രേഖപ്പെടുത്തുന്നതിന് മലയാളത്തിൽ ‘പുസ്തകത്തിൽ’ എന്നതാണ് സ്വാഭാവികം.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: ലോകസ്ഥാപനംമുതൽ
  rationale: ലോകത്തിന്റെ ആരംഭംമുതലുള്ള കാലപരിധി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; അടുത്തുള്ള ‘എഴുതപ്പെട്ടിട്ടില്ല’ എന്ന ക്രിയയോടാണ് ബന്ധിപ്പിക്കുന്നത്.
- source_word: βλεπόντων
  choice: കാണുമ്പോൾ
  rationale: വിസ്മയിക്കുന്ന സമയവും അതിന് ഇടയാക്കുന്ന കാഴ്ചയും സ്വാഭാവികമായ കാലവാചക ഉപവാക്യത്തിലൂടെ ബന്ധിപ്പിക്കുന്നു.
- source_word: ὅτι ἦν καὶ οὐκ ἔστιν καὶ παρέσται
  choice: കാരണം, അത് ഉണ്ടായിരുന്നു, ഇപ്പോൾ ഇല്ല, എന്നാൽ വന്നെത്തും
  rationale: ὅτιയെ പ്രധാനപാഠത്തിൽ കാരണവാചകമായി വായിക്കുന്നു. παρέσταιയിലെ ഭാവിയിലെ സാന്നിധ്യത്തെയും എത്തിച്ചേരലിനെയും ‘വന്നെത്തും’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; മറ്റു സാദ്ധ്യമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ലോകസ്ഥാപനംമുതൽ’ എന്നതിന്റെ വാക്യബന്ധം
  choice: ‘ജീവന്റെ പുസ്തകത്തിൽ പേര് എഴുതപ്പെട്ടിട്ടില്ല’ എന്നതിനോടു ബന്ധിപ്പിച്ചു.
  alternative: ഈ പ്രയോഗത്തെ സമീപസ്ഥമായ മറ്റൊരു ദൈവശാസ്ത്ര ആശയത്തോടു ബന്ധിപ്പിക്കുന്ന വ്യാഖ്യാനങ്ങൾ.
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പദക്രമം കാലസൂചനയെ പേര് എഴുതപ്പെട്ടിട്ടില്ല എന്ന പ്രസ്താവനയ്ക്കു പിന്നാലെ വെക്കുന്നു. അതിനപ്പുറമുള്ള മുൻനിർണ്ണയസിദ്ധാന്തം വിവർത്തനം ചേർക്കുന്നില്ല.
- issue: ὅτι എന്നതിന്റെ അർഥബന്ധം
  choice: ‘കാരണം’ എന്ന കാരണവാചക വായന പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചു.
  alternative: ‘അത് ഉണ്ടായിരുന്നു, ഇപ്പോൾ ഇല്ല, എന്നാൽ വന്നെത്തും എന്നത് കണ്ട്’ എന്ന ഉള്ളടക്കവാചക വായന.
  rationale: ഇരുവായനകളും വ്യാകരണപരമായി സാദ്ധ്യമാണ്. കാരണവാചക വായന വിസ്മയത്തിന്റെ കാരണം വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: παρέσται എന്നതിന്റെ സൂക്ഷ്മാർഥം
  choice: ‘വന്നെത്തും’
  alternative: ‘സന്നിഹിതമാകും’ അല്ലെങ്കിൽ ‘പ്രത്യക്ഷമാകും’
  rationale: പദം ഭാവിയിലെ സാന്നിധ്യമോ എത്തിച്ചേരലോ സൂചിപ്പിക്കുന്നു. ‘വന്നെത്തും’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; ‘പ്രത്യക്ഷമാകും’ എന്നു പറഞ്ഞ് പുനരുത്ഥാനമോ ദൃശ്യപ്രത്യക്ഷതയോ അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനാശൈലിയും ഉപയോഗിച്ചു. വെളിപ്പാടുസാഹിത്യത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അത്യന്തം സംസ്കൃതഭാരമുള്ള പദങ്ങൾ പരിമിതപ്പെടുത്തി. ആവർത്തിക്കുന്ന ‘ഉണ്ടായിരുന്നു, ഇപ്പോൾ ഇല്ല’ എന്ന ഘടന ഉദ്ദേശപൂർവം നിലനിർത്തി.
