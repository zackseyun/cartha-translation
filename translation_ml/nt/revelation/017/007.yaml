id: REV.17.7
reference: Revelation 17:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: ml
  text: 'ദൂതൻ എന്നോടു പറഞ്ഞു: “നീ എന്തിന് ആശ്ചര്യപ്പെട്ടു? ആ സ്ത്രീയുടെയും അവളെ വഹിക്കുന്ന[a]തും ഏഴു തലകളും പത്തു കൊമ്പുകളും ഉള്ളതുമായ മൃഗത്തിന്റെയും രഹസ്യം ഞാൻ നിന്നോടു പറയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളെ ചുമക്കുന്നതും.”
    reason: βαστάζω എന്ന പദത്തിന് ‘വഹിക്കുക’ എന്നതിനു പുറമേ ‘ചുമക്കുക’ എന്ന അർഥവും വരാം.
lexical_decisions:
- source_word: ἐθαύμασας
  choice: ആശ്ചര്യപ്പെട്ടത്
  rationale: θαυμάζω ഇവിടെ കൗതുകപ്പെടുക എന്നതിലുപരി വിസ്മയമോ അമ്പരപ്പോ സൂചിപ്പിക്കുന്നു. ‘ആശ്ചര്യപ്പെട്ടു’ ആ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μυστήριον
  choice: രഹസ്യം
  rationale: ഇവിടെ പദം വെളിപ്പെടുത്തപ്പെടാനിരിക്കുന്ന മറഞ്ഞ യാഥാർഥ്യത്തെ സൂചിപ്പിക്കുന്നു. ‘രഹസ്യം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും വെളിപ്പാട് സാഹിത്യത്തിന്റെ അർഥത്തിന് യോജിച്ചതുമാണ്.
- source_word: γυναικός
  choice: സ്ത്രീ
  rationale: സന്ദർഭത്തിൽ വിവാഹബന്ധമല്ല, പ്രതീകാത്മകമായ ഒരു സ്ത്രീരൂപമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: θηρίου
  choice: മൃഗം
  rationale: വെളിപ്പാട് പുസ്തകത്തിലെ സ്ഥിരമായ ഭീകര-പ്രതീകാത്മക പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: βαστάζοντος
  choice: വഹിക്കുന്ന
  rationale: സ്ത്രീയെ മൃഗം ചുമന്നുകൊണ്ടിരിക്കുന്ന ദൃശ്യത്തെ വ്യക്തമായി നൽകുന്നു; ‘വഹിക്കുക’ ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളമാണ്.
- source_word: ἔχοντος
  choice: ഉള്ള
  rationale: ഈ കൃദന്തരൂപം മൃഗത്തെയാണ് വിശേഷിപ്പിക്കുന്നത്. ‘ഏഴു തലകളും പത്തു കൊമ്പുകളുമുള്ള മൃഗം’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികവും ഗ്രീക്ക് ബന്ധം വ്യക്തവുമാക്കുന്നു.
- source_word: κεφαλάς
  choice: തലകൾ
  rationale: ദർശനത്തിലെ ശരീരരൂപക ദൃശ്യം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: κέρατα
  choice: കൊമ്പുകൾ
  rationale: വെളിപ്പാട് സാഹിത്യത്തിലെ പ്രതീകാത്മക ദൃശ്യം മാറ്റമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: Διὰ τί
  choice: എന്തിന്
  rationale: കാരണത്തെ ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἐρῶ σοι
  choice: ഞാൻ നിന്നോടു പറയാം
  rationale: ദൂതൻ തുടർന്നു നൽകാനിരിക്കുന്ന വിശദീകരണം നേരിട്ട് അവതരിപ്പിക്കുന്ന ഭാവികാലപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
theological_decisions:
- issue: ‘ഏഴു തലകളും പത്തു കൊമ്പുകളുമുള്ളത്’ എന്ന വിവരണത്തിന്റെ സൂചിതപദം
  choice: വിവരണം മൃഗത്തോടു ചേർത്തു.
  alternative: വാക്യഘടന അയവുള്ളതാക്കി സ്ത്രീയെയോ മുഴുവൻ രഹസ്യത്തെയോ സൂചിപ്പിക്കാമെന്ന അവ്യക്തത നിലനിർത്തുക.
  rationale: τοῦ βαστάζοντος, τοῦ ἔχοντος എന്നീ ഏകവചന ഷഷ്ഠീവിഭക്തി കൃദന്തരൂപങ്ങൾ θηρίου എന്ന പദത്തോടാണ് വ്യാകരണപരമായി യോജിക്കുന്നത്; γυναικός എന്ന സ്ത്രീലിംഗപദത്തോടല്ല. അതിനാൽ ഗ്രീക്ക് മൂലത്തിലെ വ്യക്തത മലയാളത്തിലും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ദർശനത്തിലെ പ്രതീകാത്മക പദങ്ങൾ ലളിതമാക്കാതെ നിലനിർത്തിയിരിക്കുന്നു; സങ്കീർണമായ ഗ്രീക്ക് ഷഷ്ഠീബന്ധം മലയാളത്തിലെ ‘സ്ത്രീയുടെയും ... മൃഗത്തിന്റെയും രഹസ്യം’ എന്ന സ്വാഭാവിക ഘടനയിൽ പകർത്തിയിരിക്കുന്നു.
