id: REV.17.10
reference: Revelation 17:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: ml
  text: അഞ്ചുപേർ വീണുപോയി[a]; ഒരാൾ ഉണ്ട്; മറ്റേയാൾ ഇനിയും വന്നിട്ടില്ല. അവൻ വരുമ്പോൾ അല്പകാലം നിലനിൽക്കേണ്ടതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, സന്ദർഭത്തിൽ കൂടുതൽ വ്യക്തമാക്കിയാൽ: “അഞ്ചു രാജാക്കന്മാർ വീണുപോയി; ഒരു രാജാവ് ഉണ്ട്; മറ്റേ രാജാവ് ഇനിയും വന്നിട്ടില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πέντε
  choice: അഞ്ചുപേർ
  rationale: പുരുഷലിംഗ ബഹുവചനത്തിലുള്ള ആർട്ടിക്കിളോടുകൂടിയ സംഖ്യ മുൻവാക്യത്തിലെ ഏഴു രാജാക്കന്മാരെ സൂചിപ്പിക്കുന്നു. സന്ദർഭബന്ധം നിലനിർത്തിക്കൊണ്ട് ‘രാജാക്കന്മാർ’ എന്നു മുഖ്യവാചകത്തിൽ ആവർത്തിക്കാതിരിക്കാൻ ‘അഞ്ചുപേർ’ എന്നു നൽകി.
- source_word: ἔπεσαν
  choice: വീണുപോയി
  rationale: πίπτω എന്ന ക്രിയയുടെ അക്ഷരാർഥമായ ‘വീണു’ എന്ന ആശയവും രാജാക്കന്മാരുടെ പതനം/നീക്കം എന്ന അപോകലിപ്റ്റിക് സൂചനയും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ὁ εἷς ἔστιν
  choice: ഒരാൾ ഉണ്ട്
  rationale: ‘ഒരാൾ ആകുന്നു/ഉണ്ട്’ എന്ന ഗ്രീക്കിലെ സംക്ഷിപ്തവും അപൂർണോക്തിപരവുമായ പ്രയോഗം സംരക്ഷിക്കുന്നു; ‘ഭരിക്കുന്നു’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ὁ ἄλλος
  choice: മറ്റേയാൾ
  rationale: അഞ്ചുപേർക്കും ഇപ്പോഴുള്ള ഒരാൾക്കും ശേഷമുള്ള അടുത്ത വ്യക്തിയെ ഏകവചനത്തിൽ വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: οὔπω ἦλθεν
  choice: ഇനിയും വന്നിട്ടില്ല
  rationale: കാത്തിരിക്കുന്ന വരവ് ഇതുവരെ സംഭവിച്ചിട്ടില്ലെന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅταν ἔλθῃ
  choice: അവൻ വരുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനുള്ള വരവിനെ സൂചിപ്പിക്കുന്ന ὅταν + സബ്ജങ്ക്റ്റീവ് ഘടനയുടെ സ്വാഭാവിക തുല്യം; ഏകവചനത്തിലുള്ള രാജാവാണ് സൂചിതൻ.
- source_word: ὀλίγον
  choice: അല്പകാലം
  rationale: μεῖναι എന്ന ക്രിയയോടൊപ്പം ഹ്രസ്വമായ ദൈർഘ്യം സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: αὐτὸν δεῖ μεῖναι
  choice: അവൻ … നിലനിൽക്കേണ്ടതാണ്
  rationale: ‘അവൻ നിലനിൽക്കേണ്ടത് അനിവാര്യമാണ്’ എന്ന ഗ്രീക്ക് ഘടനയെ ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഏഴു രാജാക്കന്മാരുടെ പ്രതീകത്തെ ചരിത്രപരമായി തിരിച്ചറിയൽ
  choice: രാജാക്കന്മാർ ആരെന്നു നിർണയിക്കാതെ വാക്യത്തിന്റെ സംക്ഷിപ്തമായ ഭാഷ നിലനിർത്തി.
  alternative: മുഖ്യവാചകത്തിൽ ‘അഞ്ചു രാജാക്കന്മാർ… ഒരു രാജാവ്… മറ്റേ രാജാവ്’ എന്നു വ്യക്തമാക്കുകയോ പ്രത്യേക റോമൻ ചക്രവർത്തിമാരുമായി അവരെ തിരിച്ചറിയുകയോ ചെയ്യുക.
  rationale: തൊട്ടുമുൻപുള്ള സന്ദർഭം ഇവർ രാജാക്കന്മാരാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും ഈ വാക്യം തന്നെ സംക്ഷിപ്തമാണ്. വിവാദമായ ചരിത്രക്രമമോ പ്രത്യേക തിരിച്ചറിയലോ വിവർത്തനത്തിൽ ഇറക്കുമതി ചെയ്യാതെ യഥാർഥ വ്യാഖ്യാനതുറവ് സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവഭാഷ ഉപയോഗിച്ചു. അപോകലിപ്റ്റിക് വാക്യത്തിന്റെ സംക്ഷിപ്തതയും വ്യാഖ്യാനപരമായ തുറവും നിലനിർത്തി; അർദ്ധവിരാമങ്ങൾ ക്രമാനുഗതമായ വിരുദ്ധതകൾ വ്യക്തമാക്കുന്നു.
