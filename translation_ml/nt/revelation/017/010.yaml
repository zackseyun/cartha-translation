  terminology: «വീണുപോയി» രാജാക്കന്മാരുടെ പതനം/അവസാനം എന്ന സന്ദർഭാർഥം അനുവദിച്ചുകൊണ്ട് മൂലത്തിന്റെ രൂപകാത്മകത സംരക്ഷിക്കുന്നു. «നിലനിൽക്കേണ്ടതാണ്» ‘remain’ എന്നതിന് യോജിച്ച ഔപചാരിക പ്രയോഗമാണ്. അടിക്കുറിപ്പിലെ «രാജാക്കന്മാർ» സന്ദർഭസ്പഷ്ടീകരണമായി മാത്രം നൽകിയിരിക്കുന്നു; മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനാതിക്രമമില്ല.
