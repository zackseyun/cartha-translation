id: REV.17.17
reference: Revelation 17:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: ml
  text: കാരണം, തന്റെ ഉദ്ദേശ്യം നടപ്പാക്കാനും ഒരേ ഉദ്ദേശ്യത്തോടെ പ്രവർത്തിക്കാനും തങ്ങളുടെ രാജ്യം മൃഗത്തിനു കൊടുക്കാനും, ദൈവത്തിന്റെ വചനങ്ങൾ നിറവേറുന്നതുവരെ, ദൈവം അവരുടെ ഹൃദയങ്ങളിൽ പ്രേരണ നൽകി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: അവരുടെ ഹൃദയങ്ങളിൽ തോന്നിച്ചു
  rationale: ഹൃദയത്തിനുള്ളിലെ പ്രേരണയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ദൈവത്തിന്റെ കാരണാത്മക പ്രവർത്തനം വെറും അനുവാദമായി ദുർബലപ്പെടുത്തുന്നില്ല.
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: തന്റെ ഉദ്ദേശ്യം നടപ്പാക്കാൻ
  rationale: γνώμη ഇവിടെ അഭിപ്രായമല്ല, ദൈവത്തിന്റെ ഉദ്ദേശ്യം അഥവാ നിശ്ചയം ആണ്; ποιῆσαι പ്രവർത്തനത്തിലൂടെ അത് നടപ്പാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ποιῆσαι μίαν γνώμην
  choice: ഒരേ ഉദ്ദേശ്യത്തോടെ പ്രവർത്തിച്ച്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഒരു ഉദ്ദേശ്യം ഉണ്ടാക്കുക’ മലയാളത്തിൽ അസ്വാഭാവികമാണ്. രാജാക്കന്മാരുടെ ഏകീകൃത നിശ്ചയവും പ്രവർത്തനവും ഈ വിവർത്തനം നിലനിർത്തുന്നു.
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: തങ്ങളുടെ രാജ്യം ... കൊടുക്കാൻ
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ βασιλείαയും ബഹുവചന ഉടമസ്ഥസൂചനയും നിലനിർത്തുന്നു; അധികാരം കൈമാറുന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: τῷ θηρίῳ
  choice: മൃഗത്തിനു
  rationale: വെളിപ്പാടുപുസ്തകത്തിലെ θηρίον എന്ന പ്രതീകത്തിന് സ്ഥിരതയുള്ളതും പരിചിതവുമായ മലയാള പദം.
- source_word: ἄχρι τελεσθήσονται οἱ λόγοι τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനങ്ങൾ നിറവേറുന്നതുവരെ
  rationale: τελέωയുടെ ഭാവികാല കർമണിപ്രയോഗം പൂർത്തീകരണം/നിറവേറൽ സൂചിപ്പിക്കുന്നു; പ്രവചനസന്ദർഭത്തിൽ ‘നിറവേറുക’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: രാജാക്കന്മാരുടെ പ്രവൃത്തികളിലെ ദൈവപരമാധികാരവും മനുഷ്യപ്രവർത്തനവും
  choice: ദൈവം അവരുടെ ഹൃദയങ്ങളിൽ പ്രേരണ ഉളവാക്കിയെന്നും അവർ ഏകീകൃതമായി പ്രവർത്തിക്കുമെന്നും ഒരുപോലെ പ്രസ്താവിച്ചു.
  alternative: ദൈവം വെറുതെ ‘അനുവദിച്ചു’ എന്നു ദുർബലപ്പെടുത്തുക, അല്ലെങ്കിൽ ഗ്രീക്കിനപ്പുറം നിർണയവാദപരമായി വിശദീകരിക്കുക.
  rationale: മൂലപാഠം ദൈവത്തിന്റെ കാരണാത്മക പ്രവർത്തനത്തെയും ഭരണാധികാരികളുടെ യഥാർഥ പ്രവർത്തനത്തെയും ഒരുമിച്ച് നിലനിർത്തുന്നു; വിവർത്തനം ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. കാരണം സൂചിപ്പിക്കുന്ന γάρന്റെ ബന്ധം ‘കൊണ്ടാണ് ഇങ്ങനെ സംഭവിക്കുന്നത്’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കി; അവസാന ക്രിയയുടെ ഭാവികാലബലം ‘അവർ അങ്ങനെ ചെയ്യും’ എന്നു പ്രകടമാക്കി.
