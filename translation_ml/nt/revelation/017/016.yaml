review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the collective subject, emphatic resumptive plural ('ഇവർ'), future actions, and the violent apocalyptic sequence. However, 'ശൂന്യയും നഗ്നയുമാക്കും' is grammatically awkward and does not naturally express the resultative force of ἠρημωμένην ποιήσουσιν; 'പാഴാക്കും' is clearer in this context. The final clause correctly conveys κατακαύσουσιν ἐν πυρί, though 'ചുട്ടെരിക്കും' is the more idiomatic Malayalam equivalent for complete burning by fire.
  naturalness: The verse is generally clear and suitably grave. Revising the paired predicates to 'പാഴാക്കുകയും നഗ്നയാക്കുകയും ചെയ്യും' and the final verb to 'തീയിൽ ചുട്ടെരിക്കുകയും ചെയ്യും' gives smoother modern standard Malayalam while retaining the source sequence.
  terminology: '''കൊമ്പുകൾ,'' ''മൃഗം,'' ''വേശ്യ,'' ''മാംസം,'' and ''വെറുക്കും'' are appropriate and preserve Revelation''s imagery without interpretive substitution. ''അപ്പോക്കലിപ്റ്റിക്'' in the footnote can be replaced with the established Malayalam ''പ്രളയസംബന്ധമായ'' only if project-wide terminology so prefers; it is not necessary for fidelity. The footnote''s statement that ''മാംസം'' is ''അക്ഷരാർഥത്തിലുള്ള'' may overstate the status of imagery; the wording is best adjusted to say that the Greek word itself is literal while the vision employs apocalyptic imagery.'
  issues:
  - severity: medium
    issue: Awkward predication in 'ശൂന്യയും നഗ്നയുമാക്കും'
    rationale: 'The Greek has two coordinated resultative descriptions: make her desolate and naked. Malayalam idiom calls for verbal coordination, e.g. ''പാഴാക്കുകയും നഗ്നയാക്കുകയും ചെയ്യും,'' rather than combining feminine adjective forms before a single verb.'
  - severity: low
    issue: Footnote b may blur literal lexical wording and symbolic vision imagery
    rationale: The source word σάρκας literally means 'flesh,' but the verse's overall scene is apocalyptic imagery. Clarifying that the Greek word is literal avoids claiming that the referent itself must be literal.
  - severity: low
    issue: Final burning expression can be more idiomatic
    rationale: '''തീയിൽ പൂർണമായി ദഹിപ്പിക്കും'' is understandable, but ''തീയിൽ ചുട്ടെരിക്കും'' naturally conveys κατακαίω''s intensive force in modern Malayalam.'
  revised_text: നീ കണ്ട പത്തു കൊമ്പുകളും മൃഗവും—ഇവർ വേശ്യയെ വെറുക്കും; അവളെ പാഴാക്കുകയും നഗ്നയാക്കുകയും ചെയ്യും[a]; അവളുടെ മാംസം തിന്നും[b]; അവളെ തീയിൽ ചുട്ടെരിക്കുകയും ചെയ്യും.
