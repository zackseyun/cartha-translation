id: REV.17.16
reference: Revelation 17:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: ml
  text: നീ കണ്ട പത്തു കൊമ്പുകളും മൃഗവും—ഇവർ വേശ്യയെ വെറുക്കും; അവളെ പാഴാക്കുകയും നഗ്നയാക്കുകയും ചെയ്യും[a]; അവളുടെ മാംസം തിന്നും[b]; അവളെ തീയിൽ ചുട്ടെരിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളെ പാഴാക്കി ഉടുതുണിയില്ലാതാക്കും.” ഗ്രീക്കിൽ “നഗ്ന” എന്നാണ്; അതിന് പരസ്യമായ അപമാനത്തിന്റെയും അനാവൃതതയുടെയും സൂചനയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ “മാംസം” എന്ന പദം അക്ഷരാർഥത്തിലുള്ളതാണ്; വെളിപ്പാടിന്റെ അപ്പോക്കലിപ്റ്റിക് ദൃശ്യഭാഷയിൽ ഈ പ്രയോഗം സമ്പൂർണവും അക്രമാസക്തവുമായ നാശത്തെ ചിത്രീകരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: കൊമ്പുകൾ
  rationale: വാക്യം വ്യാഖ്യാനമായ ‘രാജാക്കന്മാർ’ എന്നതിനു പകരം അപ്പോക്കലിപ്റ്റിക് പ്രതീകമായ ‘കൊമ്പുകൾ’ തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ദൃശ്യബിംബം അതേപടി നിലനിർത്തി.
- source_word: θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാടിലെ പ്രതീകാത്മകവും ഭീഷണിപൂർണവുമായ ആശയം വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: πόρνην
  choice: വേശ്യ
  rationale: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും നേരിട്ടുമുള്ള സമാനപദം; പഴഞ്ചനോ അനാവശ്യമായി അധിക്ഷേപകരമോ ആയ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: μισήσουσι
  choice: വെറുക്കും
  rationale: μισέω എന്ന ക്രിയയുടെ ഭാവികാല അർഥം നേരിട്ട് നൽകുന്നു; തുടർന്നുള്ള അക്രമപരമായ പ്രവൃത്തികളോടും യോജിക്കുന്നു.
- source_word: ἠρημωμένην ποιήσουσιν
  choice: ശൂന്യയാക്കും
  rationale: അവളെ പാഴായും ഉപേക്ഷിക്കപ്പെട്ട നിലയിലുമാക്കുക എന്ന ഫലസൂചക ഘടന നിലനിർത്തുന്നു.
- source_word: γυμνήν
  choice: നഗ്നയാക്കും
  rationale: ഗ്രീക്കിലെ വിശേഷണത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; പരസ്യമായ അപമാനവും അനാവൃതതയും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: σάρκας
  choice: മാംസം
  rationale: σάρξ എന്ന പദത്തിന്റെ ശരീരസംബന്ധിയായ ദൃശ്യബിംബം മൃദൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: φάγονται
  choice: തിന്നും
  rationale: ἐσθίωയുടെ നേരിട്ടുള്ള അർഥം; ‘വിഴുങ്ങും’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പ്രയോഗത്തേക്കാൾ മൂലരൂപത്തോട് അടുത്തത്.
- source_word: κατακαύσουσιν ἐν πυρί
  choice: തീയിൽ പൂർണമായി ദഹിപ്പിക്കും
  rationale: κατακαίωയുടെ ശക്തിവർധിതമായ ‘മുഴുവനായി കത്തിക്കുക’ എന്ന ആശയവും ἐν πυρί എന്ന പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὗτοι
  choice: ഇവർ
  rationale: ‘പത്തു കൊമ്പുകളും മൃഗവും’ എന്ന സംയുക്ത കർത്താവിനെ ഊന്നിപ്പറഞ്ഞ് വീണ്ടും സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘പത്തു കൊമ്പുകളും മൃഗവും’ എന്നതിന്റെ സൂചിതവസ്തുവും ബഹുവചന ക്രിയാന്വയവും
  choice: സംയുക്ത കർത്താവിനു ശേഷം ഊന്നൽ നൽകുന്ന ‘ഇവർ’ ചേർത്ത് ബഹുവചന ക്രിയകൾ ഉപയോഗിച്ചു.
  alternative: ‘നീ കണ്ട പത്തു കൊമ്പുകളും മൃഗവും വേശ്യയെ വെറുക്കും’ എന്നു സർവനാമം ഒഴിവാക്കി മിനുക്കുക; അല്ലെങ്കിൽ മൃഗത്തെ കൊമ്പുകളുടെ സമാനാധികരണമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്കിൽ നപുംസക ബഹുവചന ദൃശ്യബിംബവും ഏകവചനമായ θηρίον-വും പുരുഷലിംഗ ബഹുവചനമായ οὗτοι കൊണ്ടു പുനരാരംഭിച്ച് ബഹുവചന ക്രിയകളോടു ചേർക്കുന്നു. ‘ഇവർ’ ഈ ഊന്നലും കൂട്ടായ പ്രവർത്തനവും വായനാസൗകര്യത്തോടെ സംരക്ഷിക്കുന്നു.
- issue: വേശ്യയുടെ നാശത്തെക്കുറിച്ചുള്ള ദൃശ്യബിംബത്തിന്റെ സ്വഭാവം
  choice: അപ്പോക്കലിപ്റ്റിക് രൂപകം മൃദൂകരിക്കാതെയും അതിന്റെ പ്രതീകം മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിക്കാതെയും നിലനിർത്തി.
  alternative: ‘വേശ്യ’യെ നേരിട്ട് ഒരു നഗരം, സാമ്രാജ്യം, അല്ലെങ്കിൽ വ്യവസ്ഥ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: വാക്യം തന്നെ പ്രതീകാത്മക ന്യായവിധിദൃശ്യം അവതരിപ്പിക്കുന്നു; അതിന്റെ സൂചിതവസ്തുവിനെ വിവർത്തനത്തിൽ തീർപ്പാക്കുന്നത് മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൃശ്യബിംബങ്ങളുടെ കാഠിന്യം മൃദൂകരിച്ചിട്ടില്ല. അർധവിരാമങ്ങൾ നാശപ്രവൃത്തികളുടെ ക്രമം വ്യക്തമാക്കുന്നു; ദീർഘരേഖ οὗτοι എന്ന ഊന്നിയ പുനരാരംഭം പ്രതിഫലിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
