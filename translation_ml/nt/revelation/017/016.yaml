  to: നീ കണ്ട പത്തു കൊമ്പുകളും മൃഗവും—ഇവർ വേശ്യയെ വെറുക്കും; അവളെ പാഴാക്കുകയും നഗ്നയാക്കുകയും ചെയ്യും[a]; അവളുടെ മാംസം തിന്നും[b]; അവളെ തീയിൽ ചുട്ടെരിക്കുകയും ചെയ്യും.
  rationale: The revision corrects an unnatural adjective-plus-verb construction while preserving the Greek's two coordinated results, maintains the emphatic plural subject and all apocalyptic imagery, and uses an idiomatic intensive expression for burning. Footnote b now distinguishes the literal lexical value of 'flesh' from the symbolic character of the vision.
