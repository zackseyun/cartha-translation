id: REV.17.18
reference: Revelation 17:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: ml
  text: നീ കണ്ട സ്ത്രീ ഭൂമിയിലെ രാജാക്കന്മാരുടെ മേൽ ആധിപത്യമുള്ള മഹാനഗരമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂമിയിലെ രാജാക്കന്മാരുടെ മേൽ രാജത്വമുള്ള.’ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘രാജത്വം (അല്ലെങ്കിൽ രാജ്യം) ഉള്ള’ എന്നാണ്; രാജകീയ ഭരണമോ ഭരണാധികാരമോ കൈവശമുള്ളത് എന്നും ഇതിനെ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: സ്ത്രീ
  rationale: ദർശനത്തിൽ കണ്ട പ്രതീകാത്മക സ്ത്രീയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ഭാര്യ’ എന്നതിനെക്കാൾ ‘സ്ത്രീ’ സ്വാഭാവികവും വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമാണ്.
- source_word: ἣν εἶδες
  choice: നീ കണ്ട
  rationale: മുമ്പ് ദർശനത്തിൽ കണ്ട സ്ത്രീയെ നേരിട്ട് തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: πόλις ἡ μεγάλη
  choice: മഹാനഗരം
  rationale: πόλις എന്നതിന്റെ സാധാരണ അർഥമായ ‘നഗരം’ നിലനിർത്തുകയും μεγάληയുടെ മഹത്ത്വസൂചന സ്വാഭാവികമായ മലയാള സംയുക്തപദത്തിലൂടെ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἔχουσα βασιλείαν
  choice: ആധിപത്യമുള്ള
  rationale: അക്ഷരാർഥത്തിൽ ‘രാജത്വം/രാജ്യം ഉള്ള’ എന്നാണെങ്കിലും, രാജാക്കന്മാരുടെമേലുള്ള ഭരണാധികാരമാണ് സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്; ‘ആധിപത്യമുള്ള’ ആ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: βασιλεία
  choice: ആധിപത്യം
  rationale: ഇവിടെ ഭൂപ്രദേശപരമായ രാജ്യം എന്നതിലുപരി രാജകീയ ഭരണാധികാരമോ പരമാധികാരമോ ആണ് ഉദ്ദേശിക്കാവുന്നത്. യഥാർഥ പദവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ τῶν βασιλέων
  choice: രാജാക്കന്മാരുടെമേൽ
  rationale: ജനിറ്റീവിനോടൊപ്പമുള്ള ἐπί ഇവിടെ അധികാരമോ നിയന്ത്രണമോ സൂചിപ്പിക്കുന്നു; ‘മേൽ’ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῆς γῆς
  choice: ഭൂമിയിലെ
  rationale: വെളിപ്പാട് പുസ്തകത്തിലെ വിശാലമായ പ്രളയദർശനപരമായ വ്യാപ്തി നിലനിർത്തുന്നു; ഒരു പ്രത്യേക ദേശമായി അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: സ്ത്രീയും നഗരവും തമ്മിലുള്ള തിരിച്ചറിയലിന്റെ സ്വഭാവം
  choice: ‘സ്ത്രീ ... മഹാനഗരം ആകുന്നു’ എന്ന നേരിട്ടുള്ള പ്രതീകാത്മക തിരിച്ചറിയൽ നിലനിർത്തി.
  alternative: ‘മഹാനഗരത്തെ പ്രതിനിധാനം ചെയ്യുന്നു’ എന്ന വിശദീകരണപരമായ പരിഭാഷ.
  rationale: ഗ്രീക്കിൽ ലളിതമായ ἔστιν (‘ആകുന്നു/ആണ്’) ആണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ പ്രതീകത്തെ വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ മൂലവാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നേരിട്ടുള്ള തിരിച്ചറിയലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘മഹാനഗരം’ സ്വാഭാവികമായ ബൈബിൾ-സാഹിത്യ പ്രയോഗമാണ്; ‘ആധിപത്യം’ βασιλείαയുടെ സന്ദർഭാർഥം നൽകുമ്പോൾ അക്ഷരാർഥത്തിലെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
