id: REV.17.4
reference: Revelation 17:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: ml
  text: ആ സ്ത്രീ ധൂമ്രവർണവും കടുംചുവപ്പും നിറങ്ങളുള്ള വസ്ത്രം ധരിച്ചിരുന്നു; പൊന്നും വിലയേറിയ രത്നങ്ങളും മുത്തുകളുംകൊണ്ട് അവൾ അലങ്കരിക്കപ്പെട്ടിരുന്നു. അറപ്പുളവാക്കുന്ന കാര്യങ്ങളും അവളുടെ ലൈംഗിക അധാർമികതയുടെ[a] അശുദ്ധവസ്തുക്കളും നിറഞ്ഞ ഒരു സ്വർണപാനപാത്രം അവൾ കൈയിൽ പിടിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വേശ്യാവൃത്തി’ എന്നോ ‘വ്യഭിചാരം’ എന്നോ പരിഭാഷപ്പെടുത്താം; വെളിപ്പാട് പുസ്തകത്തിൽ ഗ്രീക്ക് പദത്തിന് അക്ഷരാർഥത്തിലും രൂപകാത്മകമായും അർഥശക്തി ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένη
  choice: വസ്ത്രം ധരിച്ചിരുന്നു
  rationale: ἦν എന്ന ക്രിയയോടുചേർന്ന പൂർണകാല കൃദന്തം സ്ത്രീയുടെ നിലയെ വിവരിക്കുന്നു; ഫലാവസ്ഥ നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: πορφυροῦν καὶ κόκκινον
  choice: പർപ്പിൾ നിറവും കടുംചുവപ്പും ഉള്ള വസ്ത്രം
  rationale: ആഡംബരത്തെയും രാജകീയ പ്രൗഢിയെയും സൂചിപ്പിക്കുന്ന രണ്ടു നിറങ്ങളും വേർതിരിച്ചു നിലനിർത്തുന്നു; വസ്ത്രം എന്ന ആശയം περιβεβλημένηയിൽനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: പൊന്നും വിലയേറിയ രത്നങ്ങളും മുത്തുകളുംകൊണ്ട് ... അലങ്കരിക്കപ്പെട്ടിരുന്നു
  rationale: ആഭരണങ്ങളുടെ കൃത്യരൂപം നിർണയിക്കാതെ സമൃദ്ധമായ അലങ്കാരത്തിന്റെ ദൃശ്യം നിലനിർത്തുന്നു; λίθῳ τιμίῳ എന്ന ഏകവചനത്തെ വർഗസൂചകമായി സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനമാക്കി.
- source_word: ποτήριον χρυσοῦν
  choice: ഒരു സ്വർണപാനപാത്രം
  rationale: പാത്രത്തിന്റെ വസ്തുവും പാനീയത്തിനുള്ള പാത്രമാണെന്ന അർഥവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: βδελυγμάτων
  choice: അറപ്പുളവാക്കുന്ന കാര്യങ്ങൾ
  rationale: ആരാധനാപരവും ധാർമികവുമായ കടുത്ത വെറുപ്പിന്റെ ഭാവം ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഭാഷയിൽ നൽകുന്നു.
- source_word: τὰ ἀκάθαρτα
  choice: അശുദ്ധവസ്തുക്കൾ
  rationale: നപുംസക ബഹുവചനത്തെ വസ്തുനിഷ്ഠമായി നിലനിർത്തുകയും ആചാരപരവും ധാർമികവുമായ അശുദ്ധിയുടെ സാധ്യത തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: πορνείας
  choice: ലൈംഗിക അധാർമികത
  rationale: പദത്തിന്റെ വിശാലമായ ലൈംഗിക അർഥം നൽകുന്നതിനൊപ്പം വെളിപ്പാടിലെ രൂപകാത്മകമായ അവിശ്വസ്തതയിലേക്കുള്ള സാധ്യത ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: സ്ത്രീയുടെ πορνεία എന്നത് അക്ഷരാർഥത്തിലുള്ള ലൈംഗിക പാപത്തെയോ രൂപകാത്മകമായ വിഗ്രഹാരാധനാപരമായ അവിശ്വസ്തതയെയോ സൂചിപ്പിക്കുന്നുവോ എന്ന ചോദ്യം
  choice: ലൈംഗിക അധാർമികത
  alternative: വേശ്യാവൃത്തി; പരസംഗം
  rationale: ദർശനത്തിലെ പ്രതീകം അക്ഷരാർഥവും രൂപകാത്മകവുമായ ശക്തി ഒരുമിച്ചു വഹിക്കാം. അതിനെ വാണിജ്യവേശ്യാവൃത്തിയിലേക്കോ ഒരു പ്രത്യേക ലൈംഗിക കുറ്റത്തിലേക്കോ മാത്രം ചുരുക്കാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ദർശനഭാഷയുടെ ഗൗരവവും ശക്തമായ ധാർമിക ചിത്രീകരണവും നിലനിർത്തുന്ന ശൈലി. ‘പർപ്പിൾ’ എന്ന പ്രചാരത്തിലുള്ള നിറപ്പേര് വ്യക്തതയ്ക്കായി ഉപയോഗിച്ചു; വാക്യം അമിതമായി നീളാതിരിക്കാൻ രണ്ട് സ്വാഭാവിക ഘടകങ്ങളാക്കി.
