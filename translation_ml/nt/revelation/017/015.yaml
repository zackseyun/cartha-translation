id: REV.17.15
reference: Revelation 17:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: ml
  text: 'അവൻ എന്നോടു പറയുന്നു: “നീ കണ്ട, വേശ്യ ഇരിക്കുന്ന ജലങ്ങൾ ജനതകളും ജനക്കൂട്ടങ്ങളും ജാതികളും ഭാഷകളുമാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕδατα
  choice: ജലങ്ങൾ
  rationale: ബഹുവചനമായ ‘waters’ എന്ന ദർശനചിഹ്നം അതേപടി നിലനിർത്തുന്നു.
- source_word: ἡ πόρνη
  choice: വേശ്യ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ളതും ഗൗരവമുള്ളതുമായ അർഥം നൽകുന്നു; വെളിപ്പാട് പുസ്തകത്തിലെ പ്രതീകാത്മക പ്രയോഗം മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: λαοὶ
  choice: ജനതകൾ
  rationale: വിവിധ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചനം സംരക്ഷിക്കുന്നു.
- source_word: ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: ‘crowds/multitudes’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔθνη
  choice: രാജ്യങ്ങൾ
  rationale: ജനതകൾ എന്ന മുൻപദവുമായി വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് രാഷ്ട്രീയ-ദേശീയ സമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: γλῶσσαι
  choice: ഭാഷക്കാർ
  rationale: അക്ഷരാർഥം ‘നാവുകൾ/ഭാഷകൾ’ ആണെങ്കിലും, ഇവിടെ ഭാഷയുടെ അടിസ്ഥാനത്തിൽ തിരിച്ചറിയപ്പെടുന്ന മനുഷ്യസമൂഹങ്ങളെയാണ് പട്ടിക സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തികളെയും കൂട്ടങ്ങളെയും സൂചിപ്പിക്കാൻ ‘ഭാഷക്കാർ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ജലങ്ങളുടെ പ്രതീകാത്മക തിരിച്ചറിയൽ
  choice: ജനതകളും ജനക്കൂട്ടങ്ങളും രാജ്യങ്ങളും ഭാഷക്കാരുമാണ്
  alternative: എല്ലാ മനുഷ്യരാശിയുമാണ്
  rationale: വാക്യം നൽകുന്ന നാലംഗ പട്ടിക സംരക്ഷിക്കുകയും അതിനെ പൊതുവായ ഒരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ദർശനഭാഷയും പട്ടികയുടെ താളവും സംരക്ഷിച്ചിരിക്കുന്നു; em dash മലയാള വായനയിൽ ബന്ധവാക്യം വ്യക്തമാക്കുന്നു.
