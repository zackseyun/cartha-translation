id: REV.17.13
reference: Revelation 17:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: ml
  text: ഇവർ ഒരേ മനസ്സുള്ളവരാണ്[a]; തങ്ങളുടെ ശക്തിയും അധികാരവും അവർ മൃഗത്തിനു കൊടുക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവർക്ക് ഒരേ ലക്ഷ്യമാണുള്ളത്.” ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അക്ഷരാർഥം അവർക്ക് “ഒരേ മനസ്സുണ്ട്” എന്നാണ്; അത് പൊതുവായ ദൃഢനിശ്ചയത്തെയോ ലക്ഷ്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: ഇവർ
  rationale: മുമ്പ് പരാമർശിച്ച പത്തു രാജാക്കന്മാരെ ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചന സർവനാമത്തിന്റെ സൂചനാബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μίαν γνώμην ἔχουσιν
  choice: ഒരേ മനസ്സുള്ളവരാണ്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഒരു മനസ്സ് ഉള്ളവർ’ എന്ന പ്രയോഗത്തെ സ്വാഭാവികമാക്കി, ഏകാഭിപ്രായം, പൊതുവായ ദൃഢനിശ്ചയം, ഒരേ ലക്ഷ്യം എന്നീ സാധ്യതകൾ തുറന്നുവെക്കുന്നു.
- source_word: δύναμιν
  choice: ശക്തി
  rationale: ഫലപ്രദമായി പ്രവർത്തിക്കാനുള്ള ബലം അല്ലെങ്കിൽ കഴിവ് എന്ന ആശയം ലളിതവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: δύναμις എന്നതിൽനിന്ന് വേറിട്ടുള്ള ഭരണാവകാശമോ അധികാരപ്രയോഗത്തിനുള്ള അവകാശമോ സൂചിപ്പിക്കുന്നു.
- source_word: τὴν δύναμιν καὶ ἐξουσίαν αὐτῶν
  choice: തങ്ങളുടെ ശക്തിയും അധികാരവും
  rationale: രണ്ടു വ്യത്യസ്തമായെങ്കിലും ബന്ധപ്പെട്ട ആശയങ്ങൾ നിലനിർത്തുകയും, പ്രവർത്തിയുടെ കർത്താക്കളിലേക്കുള്ള സ്വാഭാവിക പ്രത്യാവർത്തക ഉടമസ്ഥബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τῷ θηρίῳ
  choice: മൃഗത്തിനു
  rationale: വെളിപ്പാടിലെ സ്ഥിരമായ അന്ത്യകാല പ്രതീകമായ θηρίον എന്നതിന് പതിവും നേരിട്ടതുമായ തർജമ ഉപയോഗിക്കുന്നു.
- source_word: διδόασιν
  choice: കൊടുക്കുന്നു
  rationale: വർത്തമാനകാലവും ‘നൽകുക’ എന്ന നേരിട്ടുള്ള അർഥവും നിലനിർത്തുന്നു; കൈമാറ്റത്തിന്റെ സ്വഭാവം അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: μίαν γνώμην ἔχουσιν എന്ന പ്രയോഗത്തിന്റെ അന്ത്യകാല-രാഷ്ട്രീയ സന്ദർഭത്തിലുള്ള അർഥം
  choice: ഒരേ മനസ്സുള്ളവരാണ്
  alternative: ഒരേ ലക്ഷ്യമുള്ളവരാണ്
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗത്തിന് ഏകാഭിപ്രായം, പൊതുവായ ദൃഢനിശ്ചയം, ഒരേ ലക്ഷ്യം എന്നീ അർഥനിറങ്ങൾ ഉണ്ടാകാം. ‘ഒരേ മനസ്സുള്ളവർ’ എന്നത് പ്രയോഗരൂപവും അതിന്റെ ഉദ്ദേശ്യപൂർണമായ ഏകതയും നിലനിർത്തി, അർഥം ഒറ്റ സാധ്യതയിലേക്കു ചുരുക്കുന്നില്ല.
- issue: δύναμις, ἐξουσία എന്നീ പദങ്ങളെ വേർതിരിച്ചുനിർത്തൽ
  choice: ശക്തിയും അധികാരവും
  alternative: ബലവും ഭരണാവകാശവും
  rationale: ഒന്നാമത്തെ പദം പ്രവർത്തനശേഷിയെയും രണ്ടാമത്തേത് അധികാരാവകാശത്തെയും സൂചിപ്പിക്കാം. രണ്ടും പ്രത്യേകം തർജമ ചെയ്യുന്നത് മൃഗത്തിനു ലഭിക്കുന്ന ഫലപ്രദമായ ശക്തിയും ഭരണാധികാരവും തമ്മിലുള്ള വ്യത്യാസം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഒരേ മനസ്സുള്ളവർ’ എന്ന പരിചിതമായ പ്രയോഗം മൂലഭാഷയിലെ രൂപകവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു; ‘ശക്തി’, ‘അധികാരം’ എന്നീ പദങ്ങൾ തമ്മിലുള്ള ആശയവ്യത്യാസവും നിലനിർത്തുന്നു.
