id: REV.17.2
reference: Revelation 17:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: ml
  text: ആരോടുകൂടെ[a] ഭൂമിയിലെ രാജാക്കന്മാർ ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെട്ടു[b]; അവളുടെ ലൈംഗിക അധാർമികതയുടെ[d] വീഞ്ഞിനാൽ ഭൂമിയിൽ വസിക്കുന്നവർ[c] മത്തുപിടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളോടുകൂടെ.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ലൈംഗിക അധാർമികത’ എന്ന ഭാഷ അഴിമതി നിറഞ്ഞതോ വിഗ്രഹാരാധനാപരമോ അവിശ്വസ്തമോ ആയ കൂട്ടുകെട്ടിനെ പ്രതീകാത്മകമായി സൂചിപ്പിക്കുന്നതാകാം; അതേസമയം ലൈംഗിക രൂപകത്തിന്റെ ശക്തി നിലനിൽക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘ഭൂമിയിലെ നിവാസികൾ.’
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, ‘അവളുടെ വേശ്യാവൃത്തിയുടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: ആരോടുകൂടെ
  rationale: മുൻവാക്യത്തിലെ സ്ത്രീയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധസർവനാമഘടന നിലനിർത്തുന്നു; മലയാളത്തിൽ വാക്യബന്ധം വ്യക്തമാണ്.
- source_word: ἐπόρνευσαν
  choice: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെട്ടു
  rationale: ലൈംഗിക രൂപകം വ്യക്തമായി നിലനിർത്തുന്നതിനൊപ്പം വിഗ്രഹാരാധനാപരമോ രാഷ്ട്രീയമോ ആയ അവിശ്വസ്തതയിലേക്കുള്ള പ്രതീകാത്മക സൂചന മുൻകൂട്ടി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: ഭൂമിയിലെ രാജാക്കന്മാർ
  rationale: വെളിപ്പാട് പുസ്തകത്തിൽ ആവർത്തിക്കുന്ന വിശാലമായ ലോകസൂചനയെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐμεθύσθησαν
  choice: മത്തുപിടിച്ചു
  rationale: ഗ്രീക്ക് നിഷ്ക്രിയരൂപം സൂചിപ്പിക്കുന്ന ഫലാവസ്ഥ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: ഭൂമിയിൽ വസിക്കുന്നവർ
  rationale: വെളിപ്പാടിലെ ആവർത്തിത പ്രയോഗത്തിന്റെ ക്രിയാത്മക സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ οἴνου
  choice: വീഞ്ഞിനാൽ
  rationale: ἐκ ഇവിടെ ഉറവിടമോ കാരണമോ സൂചിപ്പിക്കുന്നു; കുടിച്ചതെന്ന ക്രിയ മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർക്കാതെ കാരണബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τῆς πορνείας αὐτῆς
  choice: അവളുടെ ലൈംഗിക അധാർമികതയുടെ
  rationale: ബന്ധപ്പെട്ട ക്രിയയുമായുള്ള പദസാമ്യം നിലനിർത്തുകയും വേശ്യാവൃത്തി എന്ന കൂടുതൽ നിർദ്ദിഷ്ട സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πορνεύω/πορνεία എന്ന പദങ്ങളെ പ്രധാന പാഠത്തിൽ വിഗ്രഹാരാധനയോ രാഷ്ട്രീയ-മതപരമായ അവിശ്വസ്തതയോ എന്നു തുറന്നുവ്യാഖ്യാനിക്കണമോ
  choice: ലൈംഗിക അധാർമികത എന്ന രൂപകം പ്രധാന പാഠത്തിൽ നിലനിർത്തുക
  alternative: വിഗ്രഹാരാധനാപരമായ കൂട്ടുകെട്ട് എന്നോ ആത്മീയ വ്യഭിചാരം എന്നോ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: വെളിപ്പാട് ലൈംഗിക രൂപകത്തിലൂടെ മതപരവും രാഷ്ട്രീയവുമായ അഴിമതിയും അവിശ്വസ്തതയും സൂചിപ്പിക്കുന്നു. രൂപകം അതേപടി നിലനിർത്തുന്നത് അതിന്റെ പ്രതീകാത്മക സമൃദ്ധിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ലൈംഗിക അധാർമികത’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ തുറന്ന ലൈംഗിക രൂപകം മൃദൂകരിക്കാത്തതുമാണ്; വാക്യത്തിന്റെ അപോകലിപ്റ്റിക് ദൃശ്യഭാഷയും ബന്ധഘടനയും സംരക്ഷിച്ചിട്ടുണ്ട്.
