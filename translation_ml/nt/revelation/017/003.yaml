id: REV.17.3
reference: Revelation 17:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: ml
  text: അവൻ എന്നെ ആത്മാവിൽ[a] ഒരു വിജനപ്രദേശത്തേക്ക് കൊണ്ടുപോയി. കടുഞ്ചുവപ്പുനിറമുള്ളതും ദൈവദൂഷണപരമായ പേരുകൾ നിറഞ്ഞതും ഏഴു തലകളും പത്തു കൊമ്പുകളും ഉള്ളതുമായ ഒരു മൃഗത്തിന്മേൽ ഇരിക്കുന്ന ഒരു സ്ത്രീയെ ഞാൻ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മാവിനാൽ’ അല്ലെങ്കിൽ ‘ആത്മികാവസ്ഥയിൽ’ എന്നും മനസ്സിലാക്കാം. ഗ്രീക്ക് പ്രയോഗം ആത്മാവിന്റെ പ്രവർത്തനത്താലുള്ള കൊണ്ടുപോകലിനെയോ ഒരു ആത്മിക ദർശനാവസ്ഥയെയോ സൂചിപ്പിക്കാം; വെളിപ്പാടിൽ ഇത് സാധാരണയായി ഒരു ദർശനാനുഭവത്തെ പരിചയപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: കൊണ്ടുപോയി
  rationale: ഒരു സ്ഥലത്തുനിന്ന് മറ്റൊരിടത്തേക്കുള്ള കൊണ്ടുപോകലിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ദർശനാനുഭവത്തിന്റെ പശ്ചാത്തലം വാക്യത്തിൽ നിലനിൽക്കുന്നു.
- source_word: εἰς ἔρημον
  choice: ഒരു വിജനപ്രദേശത്തേക്ക്
  rationale: ἔρημος എന്നത് മരുഭൂമി മാത്രമല്ല, വിജനമോ ജനവാസമില്ലാത്തതോ ആയ പ്രദേശവും സൂചിപ്പിക്കാം. നിർദേശകപദമില്ലാത്ത ഗ്രീക്ക് പ്രയോഗത്തിന് അനുസൃതമായി ‘ഒരു’ എന്നു ചേർത്തു.
- source_word: ἐν πνεύματι
  choice: ആത്മാവിൽ
  rationale: ഗ്രീക്കിലെ ἐν എന്ന ബന്ധവും വെളിപ്പാടിലെ ദർശനാനുഭവസൂചനയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ആത്മാവിന്റെ പ്രവർത്തനമോ ദർശകന്റെ ആത്മികാവസ്ഥയോ എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: γυναῖκα καθημένην ἐπὶ θηρίον
  choice: ഒരു മൃഗത്തിന്റെമേൽ ഒരു സ്ത്രീ ഇരിക്കുന്നത്
  rationale: സ്ത്രീയുടെ സ്ഥാനവും ദൃശ്യത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. θηρίον എന്ന വെളിപ്പാടിലെ സ്ഥിരമായ പ്രതീകപദത്തിന് ‘മൃഗം’ ഉപയോഗിച്ചു.
- source_word: κόκκινον
  choice: കടുഞ്ചുവപ്പുനിറമുള്ള
  rationale: κόκκινος സൂചിപ്പിക്കുന്ന തീവ്രമായ ചുവപ്പുനിറം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: ദൈവദൂഷണപരമായ പേരുകൾ നിറഞ്ഞത്
  rationale: γέμοντα എന്നതിന്റെ ‘നിറഞ്ഞ’ എന്ന അർഥവും βλασφημίας പേരുകളുടെ സ്വഭാവം വിശേഷിപ്പിക്കുന്നതും സംരക്ഷിക്കുന്നു.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: ഏഴു തലകളും പത്തു കൊമ്പുകളും ഉള്ളത്
  rationale: അന്ത്യകാലദർശനത്തിലെ പ്രതീകചിത്രണം വ്യാഖ്യാനിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν πνεύματι എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘ആത്മാവിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ആത്മാവിനാൽ’ അഥവാ ‘ആത്മികാവസ്ഥയിൽ’
  rationale: വെളിപ്പാടിൽ ഈ പ്രയോഗം സാധാരണയായി പ്രവാചകദർശനാനുഭവത്തെ പരിചയപ്പെടുത്തുന്നു. എന്നാൽ ആത്മാവിന്റെ പ്രവർത്തനമാണോ ദർശകന്റെ ആത്മികാവസ്ഥയാണോ മുൻനിരയിൽ എന്നത് വ്യാകരണപരമായി പൂർണമായി നിർണയിക്കാതെ, പ്രധാനപാഠത്തിൽ ഗ്രീക്കിനോടടുത്ത രൂപവും അടിക്കുറിപ്പിൽ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സങ്കീർണമായ ഗ്രീക്ക് വിവരണഘടന വായിക്കാൻ എളുപ്പമാക്കാൻ ‘ഉള്ളതുമായ’ എന്ന ബന്ധപ്രയോഗം ഉപയോഗിച്ചെങ്കിലും, മൃഗത്തിന്റെ നിറം, പേരുകൾ, തലകൾ, കൊമ്പുകൾ എന്നീ എല്ലാ ഘടകങ്ങളും അതോടുതന്നെ ബന്ധിപ്പിച്ചിരിക്കുന്നു.
