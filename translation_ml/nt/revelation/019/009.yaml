id: REV.19.9
reference: Revelation 19:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: ml
  text: 'അവൻ എന്നോടു പറയുന്നു: “എഴുതുക: കുഞ്ഞാടിന്റെ വിവാഹവിരുന്നിലേക്കു ക്ഷണിക്കപ്പെട്ടവർ അനുഗൃഹീതർ.[a]” അവൻ എന്നോടു പറയുന്നു: “ഇവ ദൈവത്തിന്റെ സത്യമായ വചനങ്ങളാകുന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കുഞ്ഞാടിന്റെ വിവാഹവിരുന്നിലേക്കു വിളിക്കപ്പെട്ടവർ.”
    reason: lexical_alternative
  - marker: b
    text: “സത്യമായ” എന്നതിന് “വിശ്വസനീയമായ” എന്നും അർഥമാകാം; ഈ വചനങ്ങൾ സത്യവും വിശ്വാസ്യതയും ഉള്ളവയാണെന്ന് ഈ പ്രയോഗം ഉറപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γράψον
  choice: എഴുതുക
  rationale: γράφω എന്ന ക്രിയയുടെ ഏകവചന ആജ്ഞാരൂപം നേരിട്ടും ഗൗരവത്തോടെയും മലയാളത്തിൽ പകർന്നു.
- source_word: Μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: വെളിപ്പാടിലെയും പുതിയ നിയമത്തിലെയും ധന്യതാപ്രഖ്യാപനത്തിന്റെ ദൈവശാസ്ത്രപരവും ഗൗരവമുള്ളതുമായ ഭാവം നിലനിർത്തുന്നു; ‘സന്തുഷ്ടർ’ എന്നത് വികാരാവസ്ഥയിലേക്കു ചുരുങ്ങാം.
- source_word: οἱ εἰς τὸ δεῖπνον ... κεκλημένοι
  choice: വിരുന്നിലേക്കു ക്ഷണിക്കപ്പെട്ടവർ
  rationale: κεκλημένοι എന്ന പൂർണ്ണകാല കർമണി പങ്കാളിരൂപം ക്ഷണം ലഭിച്ച നിലയെ സൂചിപ്പിക്കുന്നു. വിരുന്നിന്റെ സന്ദർഭത്തിൽ ‘ക്ഷണിക്കപ്പെട്ടവർ’ സ്വാഭാവികമാണ്; കൂടുതൽ അക്ഷരാർഥമായ ‘വിളിക്കപ്പെട്ടവർ’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δεῖπνον
  choice: വിരുന്ന്
  rationale: പ്രധാനഭക്ഷണമോ ആഘോഷവിരുന്നോ സൂചിപ്പിക്കുന്ന പദം; വിവാഹസന്ദർഭത്തിൽ ‘വിരുന്ന്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ചിത്രസമ്പന്നവുമാണ്.
- source_word: γάμου
  choice: വിവാഹ
  rationale: δεῖπνον എന്നതിനെ വിശേഷിപ്പിക്കുന്നതിനാൽ വിവാഹാഘോഷത്തിന്റെ വിരുന്ന് എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῦ ἀρνίου
  choice: കുഞ്ഞാടിന്റെ
  rationale: വെളിപ്പാടിലെ പ്രധാന ക്രിസ്തുശാസ്ത്രപരമായ പ്രതീകശീർഷകം നിലനിർത്തുന്നു.
- source_word: Οὗτοι οἱ λόγοι
  choice: ഇവ ... വചനങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചന നിർദ്ദേശകവും λόγοι എന്ന ബഹുവചനവും മലയാളത്തിൽ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: ἀληθινοὶ
  choice: സത്യമായ
  rationale: സത്യവും വിശ്വാസ്യതയും ഉൾക്കൊള്ളുന്ന ἀληθινός എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘വിശ്വസനീയമായ’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവಿಭക്തിയെ വ്യാഖ്യാനിച്ചു ‘ദൈവത്തിൽനിന്നുള്ള’ എന്നു മാറ്റാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യകാല രക്ഷാവിരുന്നിന്റെ സന്ദർഭത്തിൽ κεκλημένοι എന്നതിന്റെ പരിഭാഷ
  choice: ക്ഷണിക്കപ്പെട്ടവർ
  alternative: വിളിക്കപ്പെട്ടവർ
  rationale: ഭക്ഷണവിരുന്നിന്റെ സന്ദർഭത്തിൽ καλέω ക്ഷണിക്കുക എന്ന ആശയം നൽകുന്നു. ‘ക്ഷണിക്കപ്പെട്ടവർ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; എന്നാൽ വിശാലമായ ‘വിളി’ എന്ന ദൈവശാസ്ത്രപ്രതിധ്വനി മായാതിരിക്കാൻ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: δεῖπνον τοῦ γάμου എന്ന വിവാഹപ്രതീകത്തിന്റെ രൂപം
  choice: വിവാഹവിരുന്ന്
  alternative: വിവാഹത്തിന്റെ അത്താഴവിരുന്ന്
  rationale: ‘വിവാഹവിരുന്ന്’ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളമാണ്; δεῖπνον എന്നത് നിർബന്ധമായും രാത്രിഭക്ഷണം മാത്രമെന്ന് ചുരുക്കുന്നില്ല.
- issue: ἀληθινοὶ τοῦ θεοῦ എന്ന പ്രയോഗത്തിലെ സത്യവും ഉറവിടവും
  choice: ദൈവത്തിന്റെ സത്യമായ വചനങ്ങൾ
  alternative: ദൈവത്തിൽനിന്നുള്ള വിശ്വസനീയമായ വചനങ്ങൾ
  rationale: പ്രധാനപാഠം ἀληθινοί എന്നതിനെ ‘സത്യമായ’ എന്നും ഷഷ്ഠീവാചകമായ τοῦ θεοῦ എന്നതിനെ ‘ദൈവത്തിന്റെ’ എന്നും നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ വിശ്വാസ്യതയും ദൈവിക ഉറവിടവും സൂചിപ്പിക്കാമെങ്കിലും അവയെ പ്രധാനപാഠത്തിൽ നിർബന്ധിതമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദർശനവിവരണത്തിലെ വർത്തമാനകാല λέγει രണ്ടിടത്തും ‘പറയുന്നു’ എന്നു നിലനിർത്തി; ആവർത്തനം ഒഴിവാക്കാതെ രണ്ടാമത്തേതിൽ മലയാളത്തിന്റെ ഒഴുക്കിനായി ‘പിന്നെയും’ ചേർത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
