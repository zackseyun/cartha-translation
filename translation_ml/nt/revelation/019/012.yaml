id: REV.19.12
reference: Revelation 19:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: ml
  text: അവന്റെ കണ്ണുകൾ അഗ്നിജ്വാലപോലെയായിരുന്നു; അവന്റെ തലയിൽ അനേകം രാജകിരീടങ്ങൾ[a] ഉണ്ടായിരുന്നു; അവനല്ലാതെ ആരും അറിയാത്ത, എഴുതപ്പെട്ട ഒരു നാമം അവനുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കുപദം പ്രത്യേകമായി രാജകീയ കിരീടങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ഇതിനെ ‘ഡയഡീമുകൾ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὀφθαλμοὶ αὐτοῦ
  choice: അവന്റെ കണ്ണുകൾ
  rationale: ജനിറ്റീവ് സർവനാമത്തോടുകൂടിയ ഗ്രീക്ക് നാമവാക്യത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: δὲ
  choice: —
  rationale: ഇവിടെ വിവരണം തുടരുന്ന ലഘുസംയോജകമാണ്; മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ അർധവിരാമംകൊണ്ട് സ്വാഭാവികമായ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: φλὸξ πυρός
  choice: അഗ്നിജ്വാലപോലെ
  rationale: ക്രിയയില്ലാത്ത ഈ വിവരണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ദൃശ്യോപമയായി അവതരിപ്പിക്കുന്നു; തീജ്വാലയുടെ തീവ്രമായ പ്രതീതി നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: അവന്റെ തലയിൽ
  rationale: ἐπίയുടെ സ്ഥലസൂചക അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: διαδήματα πολλά
  choice: അനേകം രാജകിരീടങ്ങൾ
  rationale: διάδημα സാധാരണ കിരീടത്തേക്കാൾ പ്രത്യേകമായി രാജാധികാരത്തിന്റെ കിരീടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ കൃത്യതയും പൊതുവായ ഗ്രാഹ്യതയും ഒരുമിപ്പിക്കുന്നു.
- source_word: ἔχων
  choice: ഉണ്ടായിരുന്നു / അവനിൽ ... എഴുതപ്പെട്ടിരുന്നു
  rationale: കർത്താവിനെ വിവരിക്കുന്ന വർത്തമാന കൃതന്തത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ സമാപികാവാക്യങ്ങളാക്കി മാറ്റുന്നു.
- source_word: ὄνομα γεγραμμένον
  choice: ഒരു പേര് അവനിൽ എഴുതപ്പെട്ടിരുന്നു
  rationale: γεγραμμένον എന്ന പൂർണകാല നിഷ്ക്രിയ കൃതന്തത്തിന്റെ നിലനിൽക്കുന്ന ഫലഭാവം ‘എഴുതപ്പെട്ടിരുന്നു’ സംരക്ഷിക്കുന്നു; പേര് കൃത്യമായി എവിടെ എഴുതിയെന്നത് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ ‘അവനിൽ’ എന്നു പൊതുവായി നിലനിർത്തുന്നു.
- source_word: ὃ οὐδεὶς οἶδεν
  choice: മറ്റാർക്കും അറിയാത്ത
  rationale: οἶδεν എന്ന രൂപത്തിന്റെ വർത്തമാനാർഥവും ബന്ധവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളക്രമവും നിലനിർത്തുന്നു.
- source_word: εἰ μὴ αὐτός
  choice: അവനല്ലാതെ
  rationale: ഒഴിവാക്കൽപ്രയോഗത്തിലെ ഊന്നലും, ആ പേര് അറിയുന്നത് അവൻ മാത്രം എന്ന പ്രത്യേകതയും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: എഴുതപ്പെട്ട പേരിനെ അറിയുന്നവനെക്കുറിച്ചുള്ള പ്രത്യേകത
  choice: ‘അവനല്ലാതെ മറ്റാർക്കും അറിയാത്ത’ എന്ന് വിവർത്തനം ചെയ്തു; സവാരിക്കാരൻ തന്നെയാണ് ആ പേര് അറിയുന്ന ഏക വ്യക്തി എന്ന വ്യാകരണാർഥം നിലനിർത്തി.
  alternative: പേരിന്റെ അഗ്രാഹ്യതയെ പൊതുവായി ഊന്നിപ്പറയുന്ന വ്യാഖ്യാനം.
  rationale: εἰ μὴ αὐτός എന്ന ഗ്രീക്ക് പ്രയോഗം വ്യക്തമായ ഒഴിവാക്കൽ സൂചിപ്പിക്കുന്നു. അതിന്റെ വിശാലമായ ദൈവശാസ്ത്രപരമായ അർഥം വിശദീകരിക്കാതെ വാക്യത്തിലെ രഹസ്യവും സംഘർഷവും അതേപടി സൂക്ഷിക്കുന്നു.
- issue: കണ്ണുകളും അഗ്നിജ്വാലയും തമ്മിലുള്ള ബന്ധം
  choice: മലയാളത്തിലെ സ്വാഭാവിക ദൃശ്യവിവരണമായി ‘അഗ്നിജ്വാലപോലെയായിരുന്നു’ എന്ന് നൽകി.
  alternative: ‘അവന്റെ കണ്ണുകൾ അഗ്നിജ്വാലയായിരുന്നു’ എന്ന നേരിട്ടുള്ള രൂപകം.
  rationale: ഗ്രീക്കിൽ താരതമ്യപദം ഇല്ലെങ്കിലും ക്രിയയില്ലാത്ത നാമവിവരണം ദൃശ്യസാദൃശ്യം അറിയിക്കുന്നു. മലയാളത്തിൽ ‘പോലെ’ ചേർക്കുന്നത് അർഥം വ്യക്തമാക്കുന്നു; കണ്ണുകൾ അക്ഷരാർഥത്തിൽ തീയാണെന്ന അനാവശ്യ നിർണയം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘രാജകിരീടങ്ങൾ’ എന്നത് സാങ്കേതികമായ ‘ദിയാദേമുകൾ’ എന്ന പദത്തേക്കാൾ സുലഭമായിരിക്കുമ്പോഴും രാജകീയ അർഥം നിലനിർത്തുന്നു. പ്രധാനവാക്യത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
