revisions:
- from: അവന്റെ വായിൽനിന്ന് മൂർച്ചയേറിയ ഒരു വാൾ പുറപ്പെടുന്നു; അതുകൊണ്ട് ജനതകളെ പ്രഹരിക്കാനാണ് അത്. അവൻതന്നെ ഇരുമ്പുദണ്ഡുകൊണ്ട് അവരെ മേയിക്കും[a]. സർവശക്തനായ ദൈവത്തിന്റെ ക്രോധത്തിന്റെ ഉഗ്രതയാകുന്ന വീഞ്ഞിന്റെ ചക്ക് അവൻതന്നെ ചവിട്ടുന്നു.
  to: അവൻ അതുകൊണ്ട് ജനതകളെ പ്രഹരിക്കേണ്ടതിന്, അവന്റെ വായിൽനിന്ന് മൂർച്ചയേറിയ ഒരു വാൾ പുറപ്പെടുന്നു; അവൻതന്നെ ഇരുമ്പുദണ്ഡംകൊണ്ട് അവരെ മേയിക്കും[a]. സർവശക്തനായ ദൈവത്തിന്റെ ക്രോധത്തിന്റെ ഉഗ്രതയുടെ വീഞ്ഞുചക്ക് അവൻതന്നെ ചവിട്ടുന്നു.
  rationale: 'The revision corrects the agent–instrument relationship in the purpose clause: he strikes the nations with the sword, rather than the sword independently being said to strike. It also more closely preserves the source’s emphatic sequence, “the wine of the fury of the wrath,” without collapsing θυμός and ὀργή into one term. The literal shepherd metaphor and its non-doctrinal alternative are retained.'
