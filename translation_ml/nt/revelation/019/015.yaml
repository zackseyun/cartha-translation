id: REV.19.15
reference: Revelation 19:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: ml
  text: അവൻ അതുകൊണ്ട് ജനതകളെ പ്രഹരിക്കേണ്ടതിന്, അവന്റെ വായിൽനിന്ന് മൂർച്ചയേറിയ ഒരു വാൾ പുറപ്പെടുന്നു; അവൻതന്നെ ഇരുമ്പുദണ്ഡംകൊണ്ട് അവരെ മേയിക്കും[a]. സർവശക്തനായ ദൈവത്തിന്റെ ക്രോധത്തിന്റെ ഉഗ്രതയുടെ വീഞ്ഞുചക്ക് അവൻതന്നെ ചവിട്ടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇരുമ്പുദണ്ഡംകൊണ്ട് അവരെ ഭരിക്കും.” ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം “മേയിക്കുക” എന്നാണ്; സങ്കീർത്തനം 2-ന്റെ പ്രതിധ്വനി നിലനിർത്തിക്കൊണ്ട് ഇടയരൂപകവും ഇവിടെ സംരക്ഷിച്ചിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: പുറപ്പെടുന്നു
  rationale: വായിൽനിന്ന് വാൾ പുറപ്പെടുന്ന ദൃശ്യത്തിന്റെ സജീവമായ വർത്തമാനകാലഭാവം നിലനിർത്തുന്നു.
- source_word: ῥομφαία ὀξεῖα
  choice: മൂർച്ചയേറിയ ഒരു വാൾ
  rationale: വാളിന്റെ കൃത്യമായ ഉപവിഭാഗം അനാവശ്യമായി നിർണയിക്കാതെ ῥομφαία എന്ന ആയുധചിത്രവും ὀξεῖα എന്ന വിശേഷണവും വ്യക്തമായി നൽകുന്നു.
- source_word: ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη
  choice: അതുകൊണ്ട് ജനതകളെ പ്രഹരിക്കാനാണ് അത്
  rationale: ἵναയുടെ ഉദ്ദേശ്യഭാവവും ἐν αὐτῇയുടെ ഉപകരണാർഥവും സംരക്ഷിക്കുന്നു; πατάξῃയിൽ ഇല്ലാത്ത ‘വീഴ്ത്തുക’ എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: τὰ ἔθνη
  choice: ജനതകൾ
  rationale: യഹൂദരല്ലാത്തവർ എന്ന പരിമിത അർഥത്തിലേക്കു ചുരുക്കാതെ രാജ്യജനസമൂഹങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: ποιμανεῖ
  choice: മേയിക്കും
  rationale: രാജകീയ ഭരണാധികാരം ഉൾക്കൊള്ളുന്ന സാഹചര്യത്തിലും മൂലപദത്തിലെ ഇടയരൂപകം നിലനിർത്തുന്നു.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: ഇരുമ്പുദണ്ഡുകൊണ്ട്
  rationale: ഉപകരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ഇരുമ്പിന്റെ കഠിനതയുള്ള അധികാരചിത്രം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πατεῖ τὴν ληνὸν
  choice: ചക്ക് ചവിട്ടുന്നു
  rationale: മുന്തിരി ചവിട്ടി വീഞ്ഞെടുക്കുന്ന ചക്കിന്റെ പ്രവാചകീയ ന്യായവിധിചിത്രം സജീവമായ വർത്തമാനകാലത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: ക്രോധത്തിന്റെ ഉഗ്രതയാകുന്ന വീഞ്ഞ്
  rationale: θυμός, ὀργή എന്നീ അടുത്ത അർഥമുള്ള പദങ്ങളുടെ തീവ്രത ഒറ്റപ്പദമാക്കി മായ്ച്ചുകളയാതെ, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: സർവശക്തനായ ദൈവത്തിന്റെ
  rationale: παντοκράτωρ എന്ന ദൈവിക ബിരുദത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ന്യായവിധിയുടെ പശ്ചാത്തലത്തിലുള്ള ποιμανεῖ എന്ന ഇടയരൂപകം
  choice: അവരെ മേയിക്കും
  alternative: അവരെ ഭരിക്കും
  rationale: സങ്കീർത്തനം 2-ന്റെ രാജകീയ പ്രതിധ്വനി ഉണ്ടായിട്ടും ഗ്രീക്ക് ക്രിയയുടെ നേരിട്ടുള്ള ഇടയരൂപകം സംരക്ഷിക്കുന്നു; പരിപാലനവും ന്യായവിധിയുള്ള ഭരണവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ പിരിമുറുക്കം പരിഹരിക്കാതെ വിടുന്നു.
- issue: θυμοῦ τῆς ὀργῆς എന്ന ഇരട്ട ക്രോധപ്രയോഗം
  choice: ക്രോധത്തിന്റെ ഉഗ്രത
  alternative: ഉഗ്രക്രോധം
  rationale: രണ്ട് സമീപാർഥപദങ്ങളെയും പൂർണമായി ഒറ്റ വിശേഷണത്തിലേക്ക് ചുരുക്കാതെ, ദൈവിക ന്യായവിധിയുടെ കൂട്ടിച്ചേർത്ത തീവ്രത മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘മേയിക്കും’ എന്ന രൂപകം ഉദ്ദേശ്യപൂർവം നിലനിർത്തി; ‘ചക്ക്’ സന്ദർഭത്തിൽ വീഞ്ഞിന്റെ ചക്കാണെന്ന് വാക്യം തന്നെ വ്യക്തമാക്കുന്നു.
