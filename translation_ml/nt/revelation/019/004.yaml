reference: Revelation 19:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔπεσαν οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες καὶ τὰ τέσσαρα ζῷα, καὶ προσεκύνησαν τῷ θεῷ τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ λέγοντες· Ἀμήν, Ἁλληλουϊά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: ml
  text: 'ഇരുപത്തിനാലു മൂപ്പന്മാരും നാലു ജീവികളും കമിഴ്ന്നുവീണ് സിംഹാസനത്തിൽ ഇരിക്കുന്ന ദൈവത്തെ ആരാധിച്ചു; അവർ പറഞ്ഞു: “ആമേൻ! ഹല്ലേലൂയാ![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയെ സ്തുതിക്കുവിൻ!” ഇത് ഒരു എബ്രായ ആരാധനാഘോഷവാക്യമാണ്; അക്ഷരാർഥത്തിൽ, “യാഹിനെ സ്തുതിക്കുവിൻ!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: കമിഴ്ന്നുവീണ്
  rationale: ആരാധനയിൽ സാഷ്ടാംഗം വീഴുന്ന ചലനമാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. ‘കമിഴ്ന്നുവീണ്’ എന്നത് ആ ആദരപൂർവമായ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: ഇരുപത്തിനാലു മൂപ്പന്മാർ
  rationale: വെളിപ്പാടിലെ ഈ സിംഹാസനമണ്ഡല കഥാപാത്രങ്ങൾക്കുള്ള സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ പദമാണ് ‘മൂപ്പന്മാർ’.
- source_word: τὰ τέσσαρα ζῷα
  choice: നാലു ജീവികൾ
  rationale: ζῷα ഇവിടെ സാധാരണ മൃഗങ്ങളെയല്ല, സിംഹാസനത്തിനു ചുറ്റുമുള്ള ജീവസത്തകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ജീവികൾ’ മൂലപദത്തോട് അടുത്തും മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികവുമാണ്.
- source_word: προσεκύνησαν
  choice: ആരാധിച്ചു
  rationale: ക്രിയയുടെ കർമം ദൈവമായതിനാൽ ഇവിടെ വെറും വണക്കം അല്ല, ആരാധന തന്നെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: τῷ θεῷ τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്ന ദൈവത്തിന്റെ മുമ്പിൽ ... അവനെ
  rationale: ഗ്രീക്കിലെ ദാതൃവിഭക്തിയെ മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യഘടനയിൽ അവതരിപ്പിക്കുകയും, വിശേഷണാത്മക കൃദന്തരൂപം ദൈവത്തെ തിരിച്ചറിയിക്കുന്നതായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λέγοντες
  choice: ആരാധിച്ചുകൊണ്ട് പറഞ്ഞു
  rationale: അവരുടെ വാക്കുകൾ ആരാധനാപ്രവൃത്തിയോടൊപ്പമാണെന്ന കൃദന്തരൂപത്തിന്റെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἀμήν
  choice: ആമേൻ
  rationale: ആരാധനാപരമായ സ്ഥിരപ്രയോഗമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: Ἁλληλουϊά
  choice: ഹല്ലേലൂയാ
  rationale: ഗ്രീക്കിൽ ഉൾക്കൊള്ളിച്ചിരിക്കുന്ന എബ്രായ ആരാധനാഘോഷവാക്യത്തിന്റെ ആരാധനാപരമായ രൂപവും മലയാളത്തിലെ പരിചിതമായ പ്രയോഗവും നിലനിർത്തുന്നു; അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഗ്രീക്കിൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്ന എബ്രായ ആരാധനാഘോഷവാക്യമായ Ἁλληλουϊάയുടെ വിവർത്തനം
  choice: ഹല്ലേലൂയാ
  alternative: യഹോവയെ സ്തുതിക്കുവിൻ; യാഹിനെ സ്തുതിക്കുവിൻ
  rationale: ഇവിടെ ഇത് സാധാരണ പ്രസ്താവനയല്ല, സ്ഥിരമായ ആരാധനാഘോഷവാക്യമാണ്. ലിപ്യന്തരണം അതിന്റെ ആരാധനാപരമായ സ്വഭാവം സംരക്ഷിക്കുന്നു; അതിന്റെ ഘടകാർത്ഥവും ദൈവനാമത്തിന്റെ ഹ്രസ്വരൂപവും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ. ഗ്രീക്കിന്റെ ആശയക്രമം സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിലെ കർമബന്ധം വ്യക്തമാക്കാൻ ‘ദൈവത്തിന്റെ മുമ്പിൽ ... അവനെ’ എന്ന ഘടന ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘ഹല്ലേലൂയാ’യ്ക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
