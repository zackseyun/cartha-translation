- from: 'ഇരുപത്തിനാലു മൂപ്പന്മാരും നാലു ജീവികളും സിംഹാസനത്തിൽ ഇരിക്കുന്ന ദൈവത്തിന്റെ മുമ്പിൽ കമിഴ്ന്നുവീണ് അവനെ ആരാധിച്ചുകൊണ്ട് പറഞ്ഞു: “ആമേൻ! ഹല്ലേലൂയാ![a]”'
  to: 'ഇരുപത്തിനാലു മൂപ്പന്മാരും നാലു ജീവികളും കമിഴ്ന്നുവീണ് സിംഹാസനത്തിൽ ഇരിക്കുന്ന ദൈവത്തെ ആരാധിച്ചു; അവർ പറഞ്ഞു: “ആമേൻ! ഹല്ലേലൂയാ![a]”'
