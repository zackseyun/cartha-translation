revisions:
- from: അവിടുത്തെ ന്യായവിധികൾ സത്യവും നീതിയുള്ളവയുമാകുന്നു; തന്റെ ലൈംഗിക അധാർമികതകൊണ്ട് ഭൂമിയെ ദുഷിപ്പിച്ച മഹാവേശ്യയെ അവിടുന്ന് വിധിക്കുകയും, അവളുടെ കൈയിൽനിന്ന് തന്റെ അടിമകളുടെ രക്തത്തിന് പ്രതികാരം ചെയ്യുകയും ചെയ്തു.[a]
  to: അവിടുത്തെ ന്യായവിധികൾ സത്യവും നീതിയുക്തമായവയുമാണ്; കാരണം, തന്റെ ലൈംഗിക അധാർമികതയാൽ ഭൂമിയെ ദുഷിപ്പിച്ച മഹാവേശ്യയെ അവിടുന്ന് വിധിച്ചു; അവളുടെ കൈയിൽനിന്ന് തന്റെ അടിമകളുടെ[a] രക്തത്തിനുള്ള പ്രതികാരം നടത്തി.
  rationale: ക്രിയകളെ പൂർണരൂപത്തിൽ ക്രമപ്പെടുത്തി, ἐξεδίκησεν τὸ αἷμα എന്ന പ്രയോഗത്തിന്റെ ‘രക്തത്തിനുള്ള പ്രതികാരം’ എന്ന ന്യായികബന്ധം വ്യക്തമാക്കി. വിവർത്തനത്തിന്റെ അർഥം മാറ്റാതെ അടിക്കുറിപ്പ് അതു സംബന്ധിക്കുന്ന പദത്തിലേക്കു മാറ്റി.
