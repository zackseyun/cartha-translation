  source_fidelity: 'മുഖ്യാർഥം മിക്കവാറും വിശ്വസ്തമാണ്: κρίσεις, πόρνη, φθείρω, γῆ, πορνεία, δοῦλοι, ἐκ χειρὸς എന്നിവ യോജിച്ചവിധം പ്രതിഫലിക്കുന്നു. എന്നാൽ «രക്തത്തിന് പ്രതികാരം ചെയ്യുകയും ചെയ്തു» എന്ന പ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികവും ബന്ധം അല്പം അവ്യക്തവുമാണ്; രക്തച്ചൊരിച്ചിലിനുവേണ്ടി/രക്തത്തിനുള്ള പ്രതികാരം എന്ന രീതിയിൽ ἐξεδίκησεν τὸ αἷμα വ്യക്തമായി സൂചിപ്പിക്കണം.'
  naturalness: «വിധിക്കുകയും ... ചെയ്യുകയും ചെയ്തു» എന്ന പങ്കുവിന്യാസം വ്യാകരണപരമായി സാധ്യമെങ്കിലും ഈ ഗൗരവമുള്ള ന്യായിക പ്രഖ്യാപനത്തിൽ രണ്ടു പൂർണക്രിയകളാക്കി നൽകുന്നതാണ് കൂടുതൽ സ്വാഭാവികം. അടിക്കുറിപ്പ് അടയാളം അത് വിശദീകരിക്കുന്ന «അടിമകളുടെ» എന്ന പദത്തോടു ചേർത്തിരിക്കുന്നു.
  terminology: «ന്യായവിധികൾ», «മഹാവേശ്യ», «ഭൂമിയെ ദുഷിപ്പിച്ച», «അടിമകൾ» എന്നിവ മൂലപാഠത്തിന്റെ ബലവും ആധുനിക മലയാളത്തിലെ വ്യക്തതയും നിലനിർത്തുന്നു. «നീതിയുള്ളവ» എന്നതിനു പകരം «നീതിയുക്തമായവ» ഇവിടെ വിധികളോടു കൂടുതൽ സ്വാഭാവികമായ വിശേഷണമാണ്. δοῦλος-നുള്ള പകരം «ദാസന്മാർ» എന്നു അടിക്കുറിപ്പിൽ നൽകുന്നത് ഉചിതമാണ്.
