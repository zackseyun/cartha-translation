id: REV.19.2
reference: Revelation 19:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his servants from her hand.
translation:
  language: ml
  text: അവിടുത്തെ ന്യായവിധികൾ സത്യവും നീതിയുക്തമായവയുമാണ്; കാരണം, തന്റെ ലൈംഗിക അധാർമികതയാൽ ഭൂമിയെ ദുഷിപ്പിച്ച മഹാവേശ്യയെ അവിടുന്ന് വിധിച്ചു; അവളുടെ കൈയിൽനിന്ന് തന്റെ അടിമകളുടെ[a] രക്തത്തിനുള്ള പ്രതികാരം നടത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിമകൾ’ എന്നതിന് ‘ദാസന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് δοῦλος എന്ന പദം ഒരു യജമാനനു കീഴിൽപ്പെട്ട ആളെ സൂചിപ്പിക്കുന്നു.
    reason: δοῦλος എന്ന പദത്തിന്റെ ശക്തമായ ബന്ധാർഥവും മലയാളത്തിലെ പരമ്പരാഗത ബൈബിൾ പകരവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: സത്യവും നീതിയുള്ളവയും
  rationale: κρίσεις എന്ന ന്യായികസന്ദർഭത്തിൽ ദൈവത്തിന്റെ വിധികൾ യാഥാർഥ്യത്തോടൊത്തവയും ധാർമികമായി ശരിയായവയുമാണെന്ന രണ്ട് ഗുണങ്ങളും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κρίσεις
  choice: ന്യായവിധികൾ
  rationale: ന്യായികവും അന്തിമവിധിയുമായി ബന്ധപ്പെട്ടതുമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἔκρινεν
  choice: വിധിച്ചു
  rationale: κρίνω എന്നതിന്റെ വിശാലമായ ന്യായിക അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ശിക്ഷാവിധി ഉൾക്കൊള്ളുന്നുവെങ്കിലും ‘ശിക്ഷിച്ചു’ എന്ന് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: πόρνην τὴν μεγάλην
  choice: മഹാവേശ്യ
  rationale: രൂപകത്തിന്റെ ശക്തി നിലനിർത്തുന്ന, ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന സംക്ഷിപ്ത പ്രയോഗം.
- source_word: ἔφθειρεν
  choice: ദുഷിപ്പിച്ചു
  rationale: φθείρωയിലെ നശിപ്പിക്കുക/ദുഷിപ്പിക്കുക എന്ന അർഥവ്യാപ്തിയിൽ, πορνεία മുഖേന ഭൂമിക്ക് സംഭവിച്ച ധാർമിക-ആത്മീയ ദൂഷണം ഇവിടെ മുൻനിൽക്കുന്നു.
- source_word: τὴν γῆν
  choice: ഭൂമിയെ
  rationale: വെളിപ്പാടിലെ വിശാലമായ പ്രാപഞ്ചിക പശ്ചാത്തലത്തിന് യോജിക്കുന്ന സാധാരണ അർഥം.
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: തന്റെ ലൈംഗിക അധാർമികതകൊണ്ട്
  rationale: πορνείαയുടെ ലൈംഗിക അർഥം വ്യക്തമായി നൽകുകയും വിഗ്രഹാരാധനാപരമായ രൂപകസാധ്യത അടച്ചുകളയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐξεδίκησεν τὸ αἷμα
  choice: രക്തത്തിന് പ്രതികാരം ചെയ്തു
  rationale: അന്യായമായി ചൊരിയപ്പെട്ട രക്തത്തിനുവേണ്ടി നീതി നടപ്പാക്കിയെന്ന ന്യായിക പ്രതികാരഭാവം സംരക്ഷിക്കുന്നു.
- source_word: τῶν δούλων αὐτοῦ
  choice: തന്റെ അടിമകളുടെ
  rationale: δοῦλος സൂചിപ്പിക്കുന്ന യജമാനനോടുള്ള പൂർണ ഉടമസ്ഥബന്ധത്തിന്റെ ശക്തമായ അർഥം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐκ χειρὸς αὐτῆς
  choice: അവളുടെ കൈയിൽനിന്ന്
  rationale: അവളുടെ പ്രവർത്തനത്തിനും ഉത്തരവാദിത്വത്തിനും സൂചന നൽകുന്ന ഗ്രീക്ക്/ബൈബിൾ ശൈലി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവജനത്തെ സൂചിപ്പിക്കുന്ന δοῦλοι എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / ശുശ്രൂഷകർ
  rationale: ഇവിടെ ദൈവത്തിന്റേതായുള്ള പൂർണബന്ധം പ്രസക്തമായതിനാൽ ശക്തമായ മൂലാർഥം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘ദാസന്മാർ’ കൂടുതൽ മാന്യമായ ബൈബിൾ പ്രയോഗമാണെങ്കിലും അടിമത്തത്തിന്റെ ശക്തി കുറയ്ക്കാം.
- issue: πορνείαയുടെ നേരിട്ടുള്ളതും രൂപകപരവുമായ അർഥങ്ങൾ
  choice: ലൈംഗിക അധാർമികത
  alternative: വേശ്യാവൃത്തി / അവിശ്വസ്തത
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള ലൈംഗിക അർഥം നൽകുന്നു; വെളിപ്പാടിലെ വിഗ്രഹാരാധനയോ ആത്മീയ അവിശ്വസ്തതയോ സംബന്ധിച്ച രൂപകതലം വ്യാഖ്യാനമായി നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ആരാധനാ-ന്യായിക ശൈലി. ആവർത്തിക്കുന്ന ὅτι ഘടന മലയാളത്തിൽ ഒരു അർധവിരാമത്തിലൂടെ ബന്ധിപ്പിച്ചു. ‘അവിടുന്ന്/അവിടുത്തെ’ എന്ന ആദരസൂചക സർവനാമം ദൈവത്തെ സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് സൂചിക പ്രധാനപാഠത്തിൽ [a] ആയി ചേർത്തിരിക്കുന്നു.
