id: REV.19.1
reference: Revelation 19:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: ml
  text: 'ഇവയ്ക്കുശേഷം, സ്വർഗത്തിൽ ഒരു വലിയ ജനക്കൂട്ടത്തിന്റെ ഉച്ചത്തിലുള്ള ശബ്ദംപോലെ എന്തോ ഞാൻ കേട്ടു. അവർ പറഞ്ഞു: “ഹല്ലേലൂയാ![a] രക്ഷയും മഹത്ത്വവും ശക്തിയും നമ്മുടെ ദൈവത്തിനുള്ളവ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യാഹിനെ സ്തുതിക്കുവിൻ” അല്ലെങ്കിൽ “കർത്താവിനെ സ്തുതിക്കുവിൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ഇവയ്ക്കുശേഷം
  rationale: ബഹുവചന സൂചകത്തിന്റെ ആശയം നിലനിർത്തിക്കൊണ്ട് ദർശനത്തിലെ തുടർച്ച സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἤκουσα
  choice: ഞാൻ കേട്ടു
  rationale: ἀκούω എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാല ആഖ്യാനരൂപം നേരിട്ട് പകരുന്നു.
- source_word: ὡς
  choice: ശബ്ദംപോലെ
  rationale: കർശനമായ താദാത്മ്യമല്ല, കേട്ട ശബ്ദത്തിന്റെ സാദൃശ്യമോ അനുഭവപരമായ ഏകദേശതയോ സൂചിപ്പിക്കുന്നു.
- source_word: φωνὴν μεγάλην
  choice: ഉച്ചത്തിലുള്ള ശബ്ദം
  rationale: φωνήയോടൊപ്പമുള്ള μεγάλη ഇവിടെ പ്രധാനമായും ശബ്ദത്തിന്റെ ഉച്ചതയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: ὄχλου πολλοῦ
  choice: ഒരു വലിയ ജനക്കൂട്ടത്തിന്റെ
  rationale: വളരെ അനേകരടങ്ങിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വലിപ്പബോധം നിലനിർത്തുന്നു.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: ഇവിടെ οὐρανός ആകാശമല്ല, സ്വർഗീയ മണ്ഡലമാണ്.
- source_word: λεγόντων
  choice: അവർ പറഞ്ഞു
  rationale: ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ വ്യക്തമാക്കുകയും തുടർന്ന് വരുന്ന ഘോഷണത്തിന്റെ ഉള്ളടക്കം സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Ἁλληλουϊά
  choice: ഹല്ലേലൂയാ
  rationale: ഗ്രീക്കിൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്ന എബ്രായ ആരാധനാഘോഷത്തെ മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ തിരിച്ചറിയാവുന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἡ σωτηρία
  choice: രക്ഷ
  rationale: ദൈവത്തിനുള്ള രക്ഷാകര വിടുതലിനെ ആരാധനാഘോഷത്തിന് യോജിച്ച സംക്ഷിപ്ത നാമരൂപത്തിൽ പകരുന്നു.
- source_word: ἡ δόξα
  choice: മഹത്ത്വം
  rationale: ആരാധനാസന്ദർഭത്തിലെ δόξαയുടെ ദൈവിക മഹിമയും ബഹുമാനവും വ്യക്തമാക്കുന്ന സാധാരണ മലയാള പദമാണ്.
- source_word: ἡ δύναμις
  choice: ശക്തി
  rationale: ദൈവിക ബലത്തെയും പ്രവർത്തനശേഷിയെയും സൂചിപ്പിക്കുന്ന വിശാലവും സ്വാഭാവികവുമായ മലയാള തുല്യപദം.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: നമ്മുടെ ദൈവത്തിനുള്ളവ
  rationale: ഗ്രീക്കിലെ ഉടമസ്ഥതയെയോ അവകാശാരോപണത്തെയോ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: Ἁλληλουϊά എന്ന സ്വർഗീയ ആരാധനാഘോഷത്തിന്റെ പരിഭാഷ
  choice: ഹല്ലേലൂയാ
  alternative: യാഹിനെ സ്തുതിക്കുവിൻ / കർത്താവിനെ സ്തുതിക്കുവിൻ
  rationale: എബ്രായത്തിൽനിന്ന് ഗ്രീക്കിലേക്കു ലിപ്യന്തരണം ചെയ്ത ആരാധനാപദത്തിന്റെ അന്തർഗ്രന്ഥീയവും ആരാധനാപരവുമായ സ്വഭാവം നിലനിർത്തുന്നു; അതിന്റെ അർത്ഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: σωτηρία, δόξα, δύναμις എന്നിവയുടെ ദൈവത്തോടുള്ള ബന്ധം
  choice: രക്ഷയും മഹത്ത്വവും ശക്തിയും നമ്മുടെ ദൈവത്തിനുള്ളവ
  alternative: രക്ഷയും മഹത്ത്വവും ശക്തിയും നമ്മുടെ ദൈവത്തിന്റേതാണ്
  rationale: τοῦ θεοῦ ἡμῶν എന്ന ഉടമസ്ഥതാ/അവകാശാരോപണ ജനിറ്റീവിനെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ഗ്രീക്ക് വാചകത്തിൽ ഇല്ലാത്ത അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ആരാധനാഭാഷ. ‘ശബ്ദംപോലെ’ എന്ന രൂപം ὡς സൂചിപ്പിക്കുന്ന സാദൃശ്യം നിലനിർത്തുന്നു; ‘ഹല്ലേലൂയാ’ എന്ന പരിചിത ലിപ്യന്തരണം മുഖ്യവാചകത്തിലും അതിന്റെ അർത്ഥവികല്പങ്ങൾ അടിക്കുറിപ്പിലും നൽകിയിരിക്കുന്നു.
