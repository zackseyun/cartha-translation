  - severity: medium
    issue: The causal conjunction ὅτι is omitted
    rationale: 'The acclamation explicitly gives a reason: “for/because the Lord ... reigns.” Malayalam should represent this with “എന്തെന്നാൽ.”'
  - severity: medium
    issue: “രാജാവായി വാഴുന്നു” over-specifies the verb
    rationale: The phrase can suggest becoming king or beginning to reign. A simple “വാഴുന്നു” best follows the audit-trail main rendering while the footnote preserves the aorist’s alternatives.
