reference: Revelation 19:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: ml
  text: 'വലിയൊരു ജനസമൂഹത്തിന്റെ ശബ്ദംപോലെയും പെരുവെള്ളങ്ങളുടെ ശബ്ദംപോലെയും ശക്തമായ ഇടിമുഴക്കങ്ങളുടെ ശബ്ദംപോലെയും തോന്നുന്ന ഒരു ശബ്ദം ഞാൻ കേട്ടു. അവർ ഇങ്ങനെ പറഞ്ഞു: “ഹല്ലേലൂയാ! എന്തെന്നാൽ കർത്താവായ ദൈവം[a], സർവശക്തൻ, വാഴുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “നമ്മുടെ ദൈവമായ കർത്താവ്, സർവശക്തൻ” എന്നു വായിക്കുന്നു. ഇവിടെ സ്വീകരിച്ചിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിന്റെ അക്ഷരാർഥം “കർത്താവ്, ദൈവം, സർവശക്തൻ” എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: “വാഴുന്നു,” “വാണു,” “വാഴാൻ തുടങ്ങി,” അല്ലെങ്കിൽ “രാജാവായി” എന്നും വിവർത്തനം ചെയ്യാം. ദൈവത്തിന്റെ ഭരണം നിർണായകമായി പ്രകടമായതിനെ ആഘോഷിക്കുന്നതായി ഗ്രീക്ക് ക്രിയയെ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: ഞാൻ കേട്ടു
  rationale: ആഖ്യാനത്തിലെ aorist ക്രിയയെ നേരായും സ്വാഭാവികമായും വിവർത്തനം ചെയ്യുന്നു.
- source_word: ὡς
  choice: …പോലെയും / …പോലെയും ഒന്ന്
  rationale: മൂന്നു പ്രയോഗങ്ങളിലും താരതമ്യസ്വഭാവം നിലനിർത്തുന്നു; ആദ്യത്തേതിൽ ദർശനാനുഭവത്തിന്റെ അനിശ്ചിതത്വം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: φωνὴν
  choice: ശബ്ദം
  rationale: ഇവിടെ ജനസമൂഹത്തിന്റെയും വെള്ളത്തിന്റെയും ഇടിമുഴക്കത്തിന്റെയും കേൾവിയനുഭവം ഒരുമിപ്പിക്കുന്നതിനാൽ ‘ശബ്ദം’ ഏറ്റവും യോജിക്കുന്നു; തുടർന്നുള്ള വാക്കുകൾ വ്യക്തികളുടെ പ്രഖ്യാപനമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ὄχλου πολλοῦ
  choice: വലിയൊരു ജനസമൂഹം
  rationale: വളരെ വലിയ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ഉയർന്നതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗം.
- source_word: ὑδάτων πολλῶν
  choice: പെരുവെള്ളങ്ങൾ
  rationale: വലിയ ജലരാശികളുടെ അതിശക്തമായ ശബ്ദം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും വെളിപ്പാടിലെ ദൃശ്യ-ശ്രാവ്യ പ്രതീതി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: βροντῶν ἰσχυρῶν
  choice: ശക്തമായ ഇടിമുഴക്കങ്ങൾ
  rationale: ἰσχυρός എന്നതിലെ ശക്തിയുടെ ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: λεγόντων
  choice: അവർ ഇങ്ങനെ പറഞ്ഞു
  rationale: ബഹുവചന participle-നെ ജനസമൂഹത്തിന്റെ പ്രഖ്യാപനമായി സ്വാഭാവിക മലയാള വാക്യത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἁλληλουϊά
  choice: ഹല്ലേലൂയാ
  rationale: പുതിയനിയമ ആരാധനാഭാഷയിൽ സ്ഥിരപ്പെട്ട ശബ്ദലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: പ്രഖ്യാപനത്തിന്റെ കാരണബന്ധം വിരാമചിഹ്നവും തുടർന്നുള്ള വാക്യവുംകൊണ്ട് പ്രകടമാക്കി
  rationale: മലയാളത്തിലെ സ്തുതിഘോഷത്തിൽ ‘എന്തെന്നാൽ’ ചേർക്കാതെ തന്നെ കാരണം വ്യക്തമാണ്; ഇതു വാചകം കൂടുതൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: ἐβασίλευσεν
  choice: രാജാവായി വാഴുന്നു
  rationale: ദൈവത്തിന്റെ രാജത്വം വിജയകരമായി പ്രകടമായെന്ന സന്ദർഭാർഥം നൽകുന്നു; aorist-ന്റെ ‘വാണു/വാഴുന്നു/രാജാവായി’ എന്ന സാധ്യതകൾ കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: കർത്താവായ ദൈവം, സർവശക്തൻ
  rationale: അച്ചടിച്ച ഗ്രീക്ക് പാഠത്തിലെ മൂന്നു ദൈവിക വിശേഷണങ്ങളും ‘നമ്മുടെ’ എന്നില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐβασίλευσεν എന്ന aorist ക്രിയ ദൈവത്തിന്റെ രാജത്വവുമായി എങ്ങനെ ബന്ധിപ്പിക്കണം
  choice: രാജാവായി വാഴുന്നു
  alternative: വാണു; വാഴാൻ തുടങ്ങി; രാജാവായി
  rationale: ഇവിടെ ദൈവം മുമ്പ് പരമാധികാരിയല്ലായിരുന്നു എന്ന ധാരണ ചേർക്കാതെ, അവന്റെ ഭരണം നിർണായകമായി പ്രകടമാകുന്നതിനെ ആഘോഷിക്കുന്ന അർഥം നൽകുന്നു; വ്യാകരണപരമായ കാല-ആരംഭസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: κύριος ὁ θεός എന്നിടത്തെ പാഠവ്യത്യാസവും ഉടമസ്ഥസർവനാമവും
  choice: കർത്താവായ ദൈവം
  alternative: നമ്മുടെ ദൈവമായ കർത്താവ്
  rationale: നൽകിയ SBLGNT പാഠത്തിൽ ἡμῶν (‘നമ്മുടെ’) ഇല്ലാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല; സാക്ഷ്യപ്പെട്ട മറ്റൊരു വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ആരാധനാത്മക ഭാവം പാലിച്ചു. ആവർത്തിച്ചുള്ള താരതമ്യങ്ങൾ വെളിപ്പാടിന്റെ ശ്രാവ്യവൈഭവം നിലനിർത്തുന്നു; അതേസമയം അസ്വാഭാവികമായ പദാനുപദ ഘടന ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
