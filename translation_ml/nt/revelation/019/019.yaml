language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: ml
  text: മൃഗത്തെയും ഭൂമിയിലെ രാജാക്കന്മാരെയും അവരുടെ സൈന്യങ്ങളെയും കുതിരപ്പുറത്ത് ഇരിക്കുന്നവനും അവന്റെ സൈന്യത്തിനും എതിരെ[b] യുദ്ധം ചെയ്യാനായി ഒരുമിച്ചുകൂട്ടപ്പെട്ടിരിക്കുന്നതായി[a] ഞാൻ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒന്നിച്ചുകൂടിയിരിക്കുന്നതായി.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘കുതിരപ്പുറത്ത് ഇരിക്കുന്നവനോടും അവന്റെ സൈന്യത്തോടും യുദ്ധം ചെയ്യാൻ’; സന്ദർഭത്തിൽ, ‘അവർക്കെതിരെ യുദ്ധം ചെയ്യാൻ’ എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാട് പുസ്തകത്തിലെ പ്രതീകാത്മകവും ഭീഷണിജനകവുമായ പ്രയോഗം നിലനിർത്താൻ ‘മൃഗം’ സ്വാഭാവികവും പാരമ്പര്യസഹജവുമായ തിരഞ്ഞെടുപ്പാണ്.
- source_word: βασιλεῖς τῆς γῆς
  choice: ഭൂമിയിലെ രാജാക്കന്മാർ
  rationale: വെളിപ്പാടിന്റെ ആഗോള അന്ത്യകാലസന്ദർഭത്തിൽ γῆ എന്നതിന് ‘ഭൂമി’ യോജിക്കുന്നു; ലോകത്തിലെ ഭരണാധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: στρατεύματα
  choice: സൈന്യങ്ങൾ
  rationale: യുദ്ധസന്ദർഭത്തിൽ ‘സൈന്യങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്; രാജാക്കന്മാരുടെ വിവിധ സൈനികശക്തികളെ ബഹുവചനത്തിൽ നിലനിർത്തുന്നു.
- source_word: συνηγμένα
  choice: ഒരുമിച്ചുകൂട്ടപ്പെട്ടിരിക്കുന്നതു
  rationale: പെർഫെക്റ്റ് പാസീവ് കൃദന്തരൂപം, കൂട്ടിച്ചേർക്കപ്പെട്ടതിന്റെ ഫലമായി അവർ ഇപ്പോൾ ഒരുമിച്ചിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: ποιῆσαι τὸν πόλεμον
  choice: യുദ്ധം ചെയ്യാൻ
  rationale: യുദ്ധത്തിൽ ഏർപ്പെടുക എന്ന ഗ്രീക്ക് ശൈലിയുടെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപമാണിത്.
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: കുതിരപ്പുറത്ത് ഇരിക്കുന്നവനോട്
  rationale: μετάയുടെ അടിസ്ഥാനരൂപം ‘കൂടെ/നോട്’ എന്നായിരുന്നാലും യുദ്ധം ചെയ്യുക എന്ന സന്ദർഭം എതിർപ്പിന്റെ അർഥം വ്യക്തമാക്കുന്നു; വിവരണാത്മക കൃദന്തം ക്രിസ്തുശീർഷകം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: τοῦ καθημένου
  choice: ഇരിക്കുന്നവൻ
  rationale: ഗ്രീക്കിലെ വിവരണാത്മക കൃദന്തത്തെ നേരിട്ട് നിലനിർത്തുന്നു; ‘കുതിരക്കാരൻ’ എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: ἐπὶ τοῦ ἵππου
  choice: കുതിരപ്പുറത്ത്
  rationale: സ്ഥലസൂചനയുടെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: അവന്റെ സൈന്യത്തോട്
  rationale: യുദ്ധസന്ദർഭം എതിർപ്പിന്റെ അർഥം നൽകുന്നു; ഏകവചനമായ στρατεύματος ‘സൈന്യം’ എന്ന കൂട്ടനാമമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘കുതിരപ്പുറത്ത് ഇരിക്കുന്നവൻ’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: വാക്യത്തിലെ വിവരണാത്മക പ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: ‘മിശിഹായോട്’ അല്ലെങ്കിൽ ‘ക്രിസ്തുവിനോട്’ എന്ന് വ്യക്തമാക്കുക.
  rationale: സമീപസന്ദർഭം ആ വ്യക്തിയെ തിരിച്ചറിയിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ ക്രിസ്തുശീർഷകം ഉപയോഗിക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ വിവരണം നിലനിർത്തുന്നത് അനാവശ്യമായ വ്യാഖ്യാനചേർക്കൽ ഒഴിവാക്കുന്നു.
- issue: μετά എന്നതിന്റെ ബന്ധാർഥം
  choice: പ്രധാനവാക്യത്തിൽ ‘-നോട്’ എന്ന സ്വാഭാവിക മലയാളഘടന ഉപയോഗിച്ച്, യുദ്ധസന്ദർഭത്തിൽ അതിന്റെ എതിർപ്പാർഥം വായിക്കാനിടയാക്കി.
  alternative: ‘എതിരെ’ എന്ന് തുറന്നുപറയുക, അല്ലെങ്കിൽ അക്ഷരാർഥത്തിൽ ‘കൂടെ’ എന്നു നൽകുക.
  rationale: ποιεῖν πόλεμον μετά എന്ന പ്രയോഗത്തിൽ ബന്ധം വൈരപരമാണ്. ‘യുദ്ധം ചെയ്യാൻ ... -നോട്’ എന്നത് മലയാളത്തിൽ ആ വൈരാർഥം സ്വാഭാവികമായി നൽകുമ്പോഴും ഗ്രീക്കിന്റെ രൂപഭാവം ഒരു പരിധിവരെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ ദൃശ്യക്രമം സാധ്യമായത്ര നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി ക്രിയ അവസാനം വെച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
