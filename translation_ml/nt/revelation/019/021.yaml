source:
  edition: SBLGNT
  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: ml
  text: കുതിരപ്പുറത്ത് ഇരിക്കുന്നവന്റെ വായിൽനിന്നു പുറപ്പെട്ട വാൾ[b] കൊണ്ട് ശേഷിച്ചവർ കൊല്ലപ്പെട്ടു[a]. എല്ലാ പക്ഷികളും അവരുടെ മാംസം തിന്നു വയറുനിറച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: «വധിക്കപ്പെട്ടു».'
    reason: lexical_alternative
  - marker: b
    text: വായിൽനിന്നു പുറപ്പെടുന്ന «വാൾ» പ്രളയദർശനത്തിലെ പ്രതീകാത്മക ചിത്രമാണ്; വെളിപ്പാട് 19:15 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: ശേഷിച്ചവർ
  rationale: മുൻസന്ദർഭത്തിൽ മൃഗത്തെയും കള്ളപ്രവാചകനെയും കൈകാര്യം ചെയ്തശേഷം ശേഷിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ കൂട്ടനാമപ്രയോഗം.
- source_word: ἀπεκτάνθησαν
  choice: കൊല്ലപ്പെട്ടു
  rationale: ἀποκτείνω എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയരൂപം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നിഷ്ക്രിയമായിത്തന്നെ നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: വാളാൽ
  rationale: ἐν സഹിതമുള്ള ദത്തിവിഭക്തിയുടെ കരണാർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു; വെളിപ്പാടിലെ മൂർത്തമായ വാൾചിത്രം നിലനിർത്തുന്നു.
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: കുതിരപ്പുറത്ത് ഇരിക്കുന്നവന്റെ
  rationale: ഗ്രീക്കിലെ കൃതന്തഘടനയുടെ ബന്ധം സുതാര്യമായും സ്വാഭാവികമായ മലയാളത്തിലും അവതരിപ്പിക്കുന്നു.
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: വായിൽനിന്നു പുറപ്പെട്ട
  rationale: വാളിനെ വിശേഷിപ്പിക്കുന്ന കൃതന്തം നിലനിർത്തുകയും പ്രളയദർശനത്തിലെ ദൃശ്യചിത്രത്തെ വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πάντα τὰ ὄρνεα
  choice: എല്ലാ പക്ഷികളും
  rationale: സന്ദർഭം ശവംതിന്നുന്ന പക്ഷികളെ സൂചിപ്പിച്ചാലും ὄρνεα എന്ന പദത്തിൽ ഇല്ലാത്ത പ്രത്യേകത പ്രധാനപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐχορτάσθησαν
  choice: തിന്നു വയറുനിറച്ചു
  rationale: χορτάζωയുടെ പൂർണമായി ഭക്ഷണം കഴിച്ച് തൃപ്തിയടയുക എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; നിഷ്ക്രിയ ഗ്രീക്ക് രൂപം അക്ഷരാർഥത്തിൽ പകർത്തുന്നതിനേക്കാൾ സന്ദർഭത്തിലെ ഭക്ഷണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τῶν σαρκῶν αὐτῶν
  choice: അവരുടെ മാംസം തിന്നു
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഭക്ഷണത്തിന്റെ ഉറവിടം മലയാളത്തിലെ ക്രിയാസംയോജനത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; σάρξ ഇവിടെ ശരീരമാംസം തന്നെയാണ്.
theological_decisions:
- issue: കുതിരപ്പുറത്തിരിക്കുന്നവന്റെ വായിൽനിന്നു പുറപ്പെടുന്ന വാളിന്റെ സ്വഭാവം
  choice: വായിൽനിന്നു പുറപ്പെട്ട വാൾ എന്ന മൂർത്തമായ പ്രളയദർശനചിത്രം അതേപടി നിലനിർത്തി.
  alternative: വാൾ എന്നത് അവന്റെ വചനമോ ന്യായവിധിയോ ആണെന്ന് പ്രധാനപാഠത്തിൽ വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം പ്രതീകത്തിന്റെ അർഥം ഇവിടെ നേരിട്ട് നിർവചിക്കുന്നില്ല; അതിനാൽ വിവർത്തനം അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രതീകാർഥം മുൻകൂട്ടി തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൃശ്യം മൃദൂകരിക്കാതെയും അനാവശ്യമായി രൂക്ഷമാക്കാതെയും അവതരിപ്പിച്ചു. [a], [b] എന്നീ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
