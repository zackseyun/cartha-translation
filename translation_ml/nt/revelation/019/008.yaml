id: REV.19.8
reference: Revelation 19:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: ml
  text: അവൾക്ക് അണിയാൻ തിളക്കമുള്ളതും വെടിപ്പുള്ളതുമായ നേർത്ത ചണവസ്ത്രം നൽകപ്പെട്ടു; ആ നേർത്ത ചണവസ്ത്രം വിശുദ്ധരുടെ നീതിപ്രവൃത്തികളാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതിയുള്ള പ്രവൃത്തികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് മറ്റു സന്ദർഭങ്ങളിൽ ‘നീതിനിഷ്ഠമായ നിബന്ധനകൾ’ എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ വിശുദ്ധരുടെ നീതിപ്രവൃത്തികളെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
    reason: δικαιώματα എന്ന പദത്തിന്റെ പ്രസക്തമായ പദാർഥവൈവിധ്യം രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: അവൾക്ക് ... നൽകപ്പെട്ടു
  rationale: കർതൃരഹിതമായ ഗ്രീക്ക് കർമണിപ്രയോഗം നിലനിർത്തുന്നു; നൽകിയത് ദൈവമാണെന്ന് സാദ്ധ്യതയുണ്ടെങ്കിലും മൂലപാഠം കർത്താവിനെ വ്യക്തമാക്കുന്നില്ല.
- source_word: ἵνα περιβάληται
  choice: അവൾക്ക് അണിയാൻ
  rationale: മധ്യമപ്രയോഗത്തിന്റെ സ്വയം വസ്ത്രം അണിയുന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; വെറും ‘അണിയിക്കപ്പെടാൻ’ എന്നു വിവർത്തനം ചെയ്ത് ആ സൂക്ഷ്മത ഇല്ലാതാക്കുന്നില്ല.
- source_word: βύσσινον
  choice: നേർത്ത ചണവസ്ത്രം
  rationale: വിലയേറിയതും സൂക്ഷ്മമായി നെയ്തതുമായ fine linen എന്ന വസ്തുവിനെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു; രണ്ടു പ്രാവശ്യവും ആവർത്തിച്ച് പ്രതീകവ്യാഖ്യാനം വ്യക്തമാക്കുന്നു.
- source_word: λαμπρὸν
  choice: തിളക്കമുള്ളത്
  rationale: വസ്ത്രത്തിന്റെ ദൃശ്യമായ പ്രകാശഭാവം ലളിതവും സ്വാഭാവികവുമായി പകർന്നു നൽകുന്നു.
- source_word: καθαρόν
  choice: വെടിപ്പുള്ളത്
  rationale: വസ്ത്രവിവരണത്തിലെ ‘clean’ എന്ന ദൃശ്യാർഥം മുൻനിർത്തുന്നു; ഈ ഘട്ടത്തിൽ അമിതമായ അമൂർത്ത ധാർമിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: δικαιώματα
  choice: നീതിപ്രവൃത്തികൾ
  rationale: ഇവിടെയുള്ള ബഹുവചനം വിശുദ്ധരുടെ നീതിയുള്ള പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം; പദത്തിന്റെ മറ്റു സന്ദർഭങ്ങളിലെ ‘നീതിനിഷ്ഠമായ നിബന്ധനകൾ’ എന്ന അർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധരുടെ
  rationale: പുതിയനിയമത്തിൽ ദൈവത്തിന്റെ വിശുദ്ധജനത്തെ സൂചിപ്പിക്കുന്ന പതിവുപദത്തിന് സംക്ഷിപ്തവും സ്ഥാപിതവുമായ മലയാളരൂപം.
theological_decisions:
- issue: വധുവിന്റെ വസ്ത്രവുമായി δικαιώματα എന്ന പദത്തിനുള്ള ബന്ധം
  choice: നേർത്ത ചണവസ്ത്രം വിശുദ്ധരുടെ നീതിപ്രവൃത്തികളെ പ്രതിനിധീകരിക്കുന്നു.
  alternative: അത് വിശുദ്ധരുമായി ബന്ധപ്പെട്ട നീതിനിഷ്ഠമായ നിബന്ധനകളെയോ അവരുടെ നീതീകരിക്കപ്പെട്ട നിലയെയോ സൂചിപ്പിക്കുന്നു.
  rationale: സന്ദർഭവും ബഹുവചനരൂപവും പ്രവൃത്തികൾ എന്ന അർഥത്തെയാണ് കൂടുതൽ സ്വാഭാവികമാക്കുന്നത്. അതേസമയം വസ്ത്രം അവൾക്ക് ‘നൽകപ്പെട്ടു’ എന്നും പാഠം പറയുന്നു; അങ്ങനെ ദൈവിക ദാനവും വിശുദ്ധരുടെ നീതിനിഷ്ഠമായ നടത്തവും തമ്മിലുള്ള പാഠത്തിലെ പിരിമുറുക്കം പരിഹരിച്ചുകളയാതെ നിലനിർത്തുന്നു.
- issue: ἐδόθη എന്ന കർമണിപ്രയോഗത്തിലെ കർത്താവ്
  choice: നൽകിയ കർത്താവിനെ വ്യക്തമാക്കാതെ ‘നൽകപ്പെട്ടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവം അവൾക്ക് നൽകി’ എന്ന് കർത്താവിനെ വ്യക്തമാക്കുക.
  rationale: ഇത് ദൈവിക കർമണിപ്രയോഗമായിരിക്കാം; എങ്കിലും ഗ്രീക്ക് മൂലപാഠം നൽകുന്നയാളെ പേരെടുത്തുപറയുന്നില്ല. അതിനാൽ വിവർത്തനവും ആ നിയന്ത്രണം പാലിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘നേർത്ത ചണവസ്ത്രം’ സാധാരണ വായനക്കാർക്ക് വസ്തുവിനെ തിരിച്ചറിയാൻ സഹായിക്കുന്നു; ‘തിളക്കമുള്ളതും വെടിപ്പുള്ളതുമായ’ എന്ന കൂട്ടുപ്രയോഗം വസ്ത്രത്തിന്റെ ദൃശ്യവിവരണം നിലനിർത്തുന്നു.
