  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: ml
  text: സ്വർഗത്തിലുള്ള സൈന്യങ്ങൾ വെളുത്ത കുതിരകളുടെ മേൽ അവനെ പിന്തുടർന്നുകൊണ്ടിരുന്നു; അവർ വെളുത്തതും ശുദ്ധവുമായ നേർത്ത ലിനൻവസ്ത്രം ധരിച്ചിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “സൈന്യങ്ങൾ—സ്വർഗത്തിലുള്ളവ.” “സ്വർഗത്തിന്റെ സൈന്യങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύματα
  choice: സൈന്യങ്ങൾ
  rationale: സംഘടിത സൈനികസേനകളെ സൂചിപ്പിക്കുന്ന ബഹുവചനനാമത്തിന് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപരിഭാഷ.
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിലുള്ള
  rationale: സൈന്യങ്ങളുടെ സ്ഥാനം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം അതിന്റെ സ്ഥാനാർഥത്തിൽ നിലനിർത്തുന്നു; ‘സ്വർഗീയ’ എന്നത് ബന്ധമോ സ്വഭാവമോ അധികമായി സൂചിപ്പിക്കാം.
- source_word: ἠκολούθει αὐτῷ
  choice: അവനെ പിന്തുടർന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലക്രിയ ദർശനത്തിൽ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ ചിത്രീകരിക്കുന്നു; മലയാളത്തിലെ തുടർച്ചാസൂചക രൂപം ആ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: വെളുത്ത കുതിരകളുടെ മേൽ
  rationale: കുതിരപ്പുറത്തുള്ള അനുഗമനം വ്യക്തമായി അറിയിക്കുകയും λευκοῖς എന്ന വർണപദം ‘വെളുത്ത’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐνδεδυμένοι
  choice: ധരിച്ചിരുന്നു
  rationale: വസ്ത്രം അണിഞ്ഞിരുന്ന അവസ്ഥയെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: βύσσινον
  choice: നേർത്ത ചണവസ്ത്രം
  rationale: വിലയേറിയ, ഉന്നതഗുണമുള്ള ലിനൻ തുണിയെ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മലയാളരൂപം.
- source_word: λευκὸν καθαρόν
  choice: വെളുത്തതും ശുദ്ധവുമായ
  rationale: രണ്ട് വിശേഷണങ്ങളും വേർതിരിച്ചു സംരക്ഷിക്കുന്നു; നിറത്തെയും വൃത്തിയുടെയും/ശുദ്ധിയുടെയും ആശയങ്ങളെയും അനാവശ്യമായി ഒന്നാക്കുന്നില്ല.
theological_decisions:
- issue: സ്വർഗത്തിലുള്ള സൈന്യങ്ങളുടെ വ്യക്തിത്വം
  choice: ‘സ്വർഗത്തിലുള്ള സൈന്യങ്ങൾ’ എന്ന് വിവരണാത്മകമായി മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘സ്വർഗീയ സൈന്യങ്ങൾ’; ദൂതന്മാർ അല്ലെങ്കിൽ മഹത്ത്വീകരിക്കപ്പെട്ട വിശുദ്ധർ എന്ന് വ്യക്തമായി നിർവചിക്കൽ
  rationale: ഈ വാക്യം അവരുടെ സ്ഥാനവും വേഷവും പറയുന്നുവെങ്കിലും അവർ ദൂതന്മാരാണോ വിശുദ്ധരാണോ രണ്ടുകൂട്ടരുമാണോ എന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആ വ്യാഖ്യാനപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ദർശനസാഹിത്യത്തിന് യോജിച്ചതുമായ ശൈലി. ഗ്രീക്കിലെ തുടർച്ചാഭാവവും സൈന്യങ്ങളുടെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വവും നിലനിർത്തിയിരിക്കുന്നു.
