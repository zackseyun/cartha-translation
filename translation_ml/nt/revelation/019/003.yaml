  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ δεύτερον ⸀εἴρηκαν· Ἁλληλουϊά· καὶ ὁ καπνὸς αὐτῆς ἀναβαίνει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: ml
  text: 'അവർ രണ്ടാമതും പറഞ്ഞു: “ഹല്ലേലൂയാ!” അവളുടെ പുക എന്നെന്നേക്കും ഉയരുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ: “യുഗായുഗങ്ങളിലേക്ക്”; അവസാനമില്ലാത്ത ദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: രണ്ടാമതും
  rationale: ആവർത്തനത്തോടൊപ്പം ക്രമപരമായ ‘രണ്ടാം പ്രാവശ്യം’ എന്ന അർത്ഥവും സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: εἴρηκαν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ perfect രൂപമാണിത്. മലയാള ആഖ്യാനത്തിൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്; മൂലത്തിൽ ഇല്ലാത്ത ശബ്ദതീവ്രത ചേർക്കുന്ന ‘വിളിച്ചുപറഞ്ഞു’ ഒഴിവാക്കി.
- source_word: Ἁλληλουϊά
  choice: ഹല്ലേലൂയാ
  rationale: തിരിച്ചറിയാവുന്ന ആരാധനാഘോഷവാക്യമായതിനാൽ വിവർത്തനം ചെയ്യാതെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം നിലനിർത്തി.
- source_word: ὁ καπνὸς αὐτῆς
  choice: അവളുടെ പുക
  rationale: സന്ദർഭത്തിൽ സ്ത്രീയായി വ്യക്തിവൽക്കരിക്കപ്പെട്ട ബാബിലോണിലേക്കാണ് αὐτῆς സൂചിപ്പിക്കുന്നത്; ആ സ്ത്രീലിംഗ വ്യക്തിവൽക്കരണം നിലനിർത്തുന്നു.
- source_word: ἀναβαίνει
  choice: ഉയരുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ സജീവവും തുടരുന്നതുമായ ദൃശ്യഭാവം ലളിതമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത ദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യരൂപം; കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: εἰς τοὺς αἰῶνας τῶν αἰώνων സൂചിപ്പിക്കുന്ന ദൈർഘ്യം
  choice: എന്നെന്നേക്കും
  alternative: യുഗായുഗങ്ങളിലേക്ക്
  rationale: അന്തിമ ന്യായവിധിയുടെ ഈ സന്ദർഭത്തിൽ ഗ്രീക്ക് പ്രയോഗം അവസാനമില്ലാത്ത ദൈർഘ്യമാണ് സ്വാഭാവികമായി അറിയിക്കുന്നത്. അതിന്റെ ശക്തി മയപ്പെടുത്താതെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി; രൂപപരമായി അടുത്ത വിവർത്തനം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാത്മക-ആഖ്യാന ശൈലി. ‘ഹല്ലേലൂയാ’ എന്ന പരിചിത ആരാധനാവാക്യം നിലനിർത്തി. അടിക്കുറിപ്പ് ബന്ധപ്പെട്ട ദൈർഘ്യപ്രയോഗത്തിനു പിന്നാലെ സ്ഥാപിച്ചു.
