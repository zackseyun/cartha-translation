id: REV.19.13
reference: Revelation 19:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: ml
  text: അവൻ രക്തത്തിൽ മുക്കിയ മേലങ്കി ധരിച്ചിരിക്കുന്നു[a]. അവന്റെ പേര് “ദൈവവചനം” എന്നു വിളിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “രക്തം പുരണ്ടത്.” ഗ്രീക്ക് ക്രിയയുടെ കൂടുതൽ നേരിട്ടുള്ള അർഥം “മുക്കിയത്” അഥവാ “രക്തത്തിൽ ചായം കൊടുത്തത്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: ധരിച്ചിരിക്കുന്നു
  rationale: περιβάλλω എന്ന ക്രിയയുടെ പൂർണകാല കർത്തൃഭാവകൃത്ത് സൂചിപ്പിക്കുന്ന ഇപ്പോഴത്തെ അവസ്ഥ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἱμάτιον
  choice: അങ്കി
  rationale: പൊതുവായ പുറംവസ്ത്രത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ദർശനത്തിലെ രാജകീയ-യോദ്ധൃസന്ദർഭത്തിന് യോജിക്കുന്നതും അതിരുകടന്ന് പ്രത്യേകീകരിക്കാത്തതുമായ തിരഞ്ഞെടുപ്പ്.
- source_word: βεβαμμένον αἵματι
  choice: രക്തത്തിൽ മുക്കിയ
  rationale: βάπτω എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘മുക്കുക’ എന്ന ദൃശ്യതീവ്രത നിലനിർത്തുന്നു; ‘രക്തം പുരണ്ട’ എന്ന സാദ്ധ്യമായ ഫലാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: κέκληται
  choice: വിളിക്കപ്പെടുന്നു
  rationale: καλέωയുടെ പൂർണകാല കർമണിപ്രയോഗത്തിലെ നാമകരണവും അതിന്റെ നിലനിൽക്കുന്ന ഫലവും മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: അവന്റെ പേര്
  rationale: ഗ്രീക്കിലെ ഉടമസ്ഥതാസംരചനയുടെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: ദൈവവചനം
  rationale: λόγος ഇവിടെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമവിശേഷണമായി പ്രവർത്തിക്കുന്നു; ‘ദൈവവചനം’ അതിന്റെ തലക്കെട്ടുസ്വഭാവവും യോഹന്നാനീയ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: λόγος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ നാമവിശേഷണം
  choice: ദൈവവചനം
  alternative: ദൈവത്തിന്റെ സന്ദേശം
  rationale: ഈ വെളിപ്പാടുസന്ദർഭത്തിൽ ὁ Λόγος τοῦ Θεοῦ കുതിരപ്പുറത്തിരിക്കുന്ന വ്യക്തിയുടെ പേരായി അവതരിപ്പിക്കപ്പെടുന്നു. ‘ദൈവവചനം’ എന്നത് അതിന്റെ വ്യക്തിപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു; ‘ദൈവത്തിന്റെ സന്ദേശം’ എന്നു പറഞ്ഞാൽ വെറും ആശയവിനിമയമായി ചുരുങ്ങാൻ ഇടയുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദർശനത്തിന്റെ ഉജ്ജ്വല ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു.
