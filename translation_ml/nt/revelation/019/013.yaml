revisions:
- from: അവൻ രക്തത്തിൽ മുക്കിയ അങ്കി ധരിച്ചിരിക്കുന്നു[a]. അവന്റെ പേര് “ദൈവവചനം” എന്നു വിളിക്കപ്പെടുന്നു.
  to: അവൻ രക്തത്തിൽ മുക്കിയ മേലങ്കി ധരിച്ചിരിക്കുന്നു[a]. അവന്റെ പേര് “ദൈവവചനം” എന്നു വിളിക്കപ്പെടുന്നു.
  rationale: The revision replaces the potentially narrower അങ്കി with മേലങ്കി to reflect ἱμάτιον as an outer garment. It also makes the lexical footnote idiomatic while preserving the stated alternatives “stained,” “dipped,” and “dyed.” No doctrinal interpretation has been added.
