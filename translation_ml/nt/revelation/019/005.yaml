  to: 'സിംഹാസനത്തിൽനിന്ന് ഒരു സ്വരം പുറപ്പെട്ടു; അത് ഇങ്ങനെ പറഞ്ഞു: “നമ്മുടെ ദൈവത്തെ സ്തുതിക്കുവിൻ—അവന്റെ സകല അടിമകളേ,[a] അവനെ ഭയപ്പെടുന്നവരേ,[b] ചെറിയവരും വലിയവരുമേ.”'
