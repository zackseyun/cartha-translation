id: REV.19.5
reference: Revelation 19:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his servants, and those who fear him[b], the small and the great.”
translation:
  language: ml
  text: 'സിംഹാസനത്തിൽനിന്ന് ഒരു സ്വരം പുറപ്പെട്ടു; അത് ഇങ്ങനെ പറഞ്ഞു: “നമ്മുടെ ദൈവത്തെ സ്തുതിക്കുവിൻ—അവന്റെ സകല അടിമകളേ,[a] അവനെ ഭയപ്പെടുന്നവരേ,[b] ചെറിയവരും വലിയവരുമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദാസന്മാർ’ അല്ലെങ്കിൽ ‘സേവകർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദമായ δοῦλοι സന്ദർഭമനുസരിച്ച് അടിമകളെയോ ദാസന്മാരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവനെ ഭക്ത്യാദരങ്ങളോടെ മാനിക്കുന്നവർ’ എന്നും അർഥമാക്കാം. ‘അവനെ ഭയപ്പെടുക’ എന്നത് ദൈവത്തോടുള്ള ഭക്ത്യാദരവും വിശ്വസ്തമായ വിധേയത്വവും സൂചിപ്പിക്കുന്ന ബൈബിൾ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: സ്വരം
  rationale: λέγουσα (‘പറഞ്ഞുകൊണ്ട്’) എന്നതോടൊപ്പം വരുന്നതിനാൽ ഇവിടെ കേവലമായ ശബ്ദത്തേക്കാൾ സംസാരിക്കുന്ന ‘സ്വരം’ എന്ന അർഥമാണ് സ്വാഭാവികം.
- source_word: ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: സിംഹാസനത്തിൽനിന്ന് ... പുറപ്പെട്ടു
  rationale: ἀπό ഉറവിടവും ἐξέρχομαι പുറത്തേക്കുള്ള വരവും സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം സ്വരത്തിന്റെ ഉറവിടമായ സ്വർഗീയ സിംഹാസനത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: നമ്മുടെ ദൈവത്തെ സ്തുതിക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞാരൂപം വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ കർമവിഭക്തി ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: അവന്റെ സകല അടിമകളേ
  rationale: δοῦλοι ദൈവത്തിനുള്ള സമ്പൂർണമായ ഉടമസ്ഥതയും വിധേയത്വവും സൂചിപ്പിക്കുന്നതിനാൽ ശക്തമായ ‘അടിമകൾ’ നിലനിർത്തുന്നു; കൂടുതൽ മൃദുവായ ‘ദാസന്മാർ/സേവകർ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οἱ φοβούμενοι αὐτόν
  choice: അവനെ ഭയപ്പെടുന്നവരേ
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയവും ആദരപൂർവമായ വിധേയത്വവും ഉൾക്കൊള്ളുന്ന ബൈബിൾ പ്രയോഗത്തിന്റെ ഉദ്ദേശപൂർവമായ വ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: ചെറിയവരും വലിയവരുമേ
  rationale: നിലയിലും പ്രാധാന്യത്തിലും താഴ്ന്നവരെയും ഉയർന്നവരെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് യുഗ്മത്തിന്റെ രൂപവും വ്യാപ്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആരാധനാസന്ദർഭത്തിലെ δοῦλοι എന്ന പദം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ; സേവകർ
  rationale: ദൈവത്തിന്റേതായിരിക്കുകയും അവനോടു പൂർണമായി വിധേയരായിരിക്കുകയും ചെയ്യുന്ന ആശയം ‘അടിമകൾ’ കൂടുതൽ നേരിട്ട് സൂക്ഷിക്കുന്നു; പരമ്പരാഗതവും മൃദുവുമായ പദങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ദൈവത്തെ ‘ഭയപ്പെടുക’ എന്നതിന്റെ അർഥം
  choice: അവനെ ഭയപ്പെടുന്നവർ
  alternative: അവനെ ഭക്ത്യാദരങ്ങളോടെ മാനിക്കുന്നവർ
  rationale: ഭയം, ഭക്ത്യാദരം, വിശ്വസ്തമായ വിധേയത്വം എന്നിവയടങ്ങുന്ന ബൈബിൾ പ്രയോഗത്തെ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: οἱ μικροὶ καὶ οἱ μεγάλοι എന്നതിന്റെ ബന്ധം
  choice: മുൻപുള്ള അഭിസംബോധനകൾക്കു പിന്നാലെ സമാന്തര അഭിസംബോധനയായി നിലനിർത്തി
  alternative: ‘അവനെ ഭയപ്പെടുന്നവരെ’ മാത്രം വിശദീകരിക്കുന്ന അനുബന്ധപ്രയോഗമായി ചേർക്കുക
  rationale: ഗ്രീക്ക് വാക്യക്രമം രണ്ടു വായനകൾക്കും ഇടനൽകുന്നു; മലയാളത്തിൽ വേർതിരിച്ച സമാന്തര അഭിസംബോധന ഉപയോഗിക്കുന്നത് ചെറിയവരും വലിയവരും ആരോടാണ് വ്യാകരണപരമായി ചേരുന്നതെന്നത് അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘സ്തുതിക്കുവിൻ’, ‘അടിമകളേ’ എന്നീ രൂപങ്ങൾ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതോടൊപ്പം ദർശനത്തിലെ ഔപചാരിക പ്രഖ്യാപനസ്വരവും നിലനിർത്തുന്നു.
