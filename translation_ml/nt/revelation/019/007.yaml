source:
  edition: SBLGNT
  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: ml
  text: നമുക്ക് ആനന്ദിക്കാം, ആഹ്ലാദിക്കാം; അവനു മഹത്വം നൽകാം[a]. എന്തെന്നാൽ, കുഞ്ഞാടിന്റെ വിവാഹം വന്നെത്തിയിരിക്കുന്നു; അവന്റെ മണവാട്ടി[b] സ്വയം ഒരുങ്ങിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാം അവനു മഹത്വം നൽകും.’ ഗ്രീക്കിലെ ക്രിയാരൂപം ഭാവികാലത്തിലാണ്; എങ്കിലും ഇവിടെ ‘നമുക്ക് ആനന്ദിക്കാം’, ‘ആഹ്ലാദിക്കാം’ എന്നീ ആഹ്വാനങ്ങളോടൊപ്പം അതിന് ആഹ്വാനാർഥം ഉണ്ടായിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘അവന്റെ ഭാര്യ.’ ഗ്രീക്ക് പദമായ γυνή എന്നതിന് ‘സ്ത്രീ’, ‘ഭാര്യ’, അല്ലെങ്കിൽ വിവാഹസന്ദർഭത്തിൽ ‘മണവാട്ടി’ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρωμεν
  choice: നമുക്ക് ആനന്ദിക്കാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന വർത്തമാനകാല സബ്ജങ്‌ടീവ് ഇവിടെ ആഹ്വാനാർഥത്തിൽ വരുന്നു; ‘നമുക്ക് ... ചെയ്യാം’ എന്ന രൂപം ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀγαλλιῶμεν
  choice: ആഹ്ലാദിക്കാം
  rationale: χαίρωμεν എന്നതിനോടൊപ്പം വരുന്ന കൂടുതൽ തീവ്രമായ ആനന്ദത്തെ സൂചിപ്പിക്കാനും രണ്ടു ക്രിയകളുടെയും വ്യത്യാസം നിലനിർത്താനും ഈ പദം തിരഞ്ഞെടുത്തു.
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: അവനു മഹത്ത്വം നൽകാം
  rationale: ക്രിയാരൂപം ഭാവികാല സൂചകമാണെങ്കിലും, മുൻപുള്ള രണ്ട് ആഹ്വാനരൂപങ്ങളോടൊപ്പം സ്തുതിക്കുള്ള ഏകീകൃത ആഹ്വാനമായി വായിക്കാം. ഭാവികാല വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δόξαν
  choice: മഹത്ത്വം
  rationale: സ്തുതിയുടെയും ദൈവിക ബഹുമാനത്തിന്റെയും സന്ദർഭത്തിൽ δόξα എന്ന പദത്തിന്റെ സ്വാഭാവികവും ഭാരവത്തുമായ മലയാള തത്തുല്യം.
- source_word: ἦλθεν
  choice: വന്നെത്തിയിരിക്കുന്നു
  rationale: വിവാഹത്തിന്റെ സമയം എത്തിയെന്ന പൂർത്തിയായ സംഭവവും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: γάμος
  choice: വിവാഹം
  rationale: γάμος എന്നത് വിവാഹം, വിവാഹച്ചടങ്ങ്, വിവാഹവിരുന്ന് എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ അടുത്ത വാക്യത്തിലെ വിരുന്നിനെ മുൻകൂട്ടി ചേർക്കാതെ വിവാഹബന്ധത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: ἀρνίου
  choice: കുഞ്ഞാട്
  rationale: വെളിപ്പാടിലെ സ്ഥിരമായ ക്രിസ്തുശീർഷകം മലയാളത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: γυνὴ αὐτοῦ
  choice: അവന്റെ മണവാട്ടി
  rationale: വിവാഹസന്ദർഭത്തിൽ γυνή എന്നതിന് ‘മണവാട്ടി’ എന്ന അർഥം ഏറ്റവും യോജിക്കുന്നു; ‘ഭാര്യ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἡτοίμασεν ἑαυτήν
  choice: സ്വയം ഒരുങ്ങിയിരിക്കുന്നു
  rationale: പ്രതിഫലനാത്മക അർഥവും വിവാഹത്തിനായുള്ള ഒരുക്കത്തിന്റെ സ്വാഭാവിക മലയാളപ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിവാഹദൃശ്യത്തിൽ γυνὴ αὐτοῦ എന്നതിന്റെ വിവർത്തനം
  choice: അവന്റെ മണവാട്ടി
  alternative: അവന്റെ ഭാര്യ
  rationale: കുഞ്ഞാടുമായുള്ള ദൈവജനത്തിന്റെ അന്ത്യകാല വിവാഹദൃശ്യം ഇവിടെ പ്രധാനമാണ്. വിവാഹത്തിനായി ഒരുങ്ങുന്നവളെന്ന ഊന്നൽ ‘മണവാട്ടി’ വ്യക്തമാക്കുന്നു; എന്നാൽ ‘ഭാര്യ’ എന്നത് പദസാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: ആഹ്വാനക്രമത്തിൽ δώσομεν എന്ന ഭാവികാലരൂപത്തിന്റെ ബലം
  choice: അവനു മഹത്ത്വം നൽകാം
  alternative: നാം അവനു മഹത്ത്വം നൽകും
  rationale: χαίρωμεν, ἀγαλλιῶμεν എന്നിവയോടൊപ്പമുള്ള ആരാധനാപരമായ ക്രമത്തിൽ ഇത് സ്തുതിക്കുള്ള ആഹ്വാനമായി സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു. അതേസമയം വ്യാകരണപരമായ ഭാവികാല വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ആരാധനാപരമായ ഗൗരവമുള്ളതുമായ ശൈലി. χαίρωμεν–ἀγαλλιῶμεν എന്ന ഇരട്ട ആനന്ദപ്രയോഗം ‘ആനന്ദിച്ച് ആഹ്ലാദിക്കാം’ എന്നു വേർതിരിച്ചു നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവയുടെ ഉള്ളടക്കവും പൊരുത്തപ്പെടാത്തതിനാൽ, മലയാള കരടിൽ വാചകത്തിലെ ക്രമമനുസരിച്ച് [a] ഭാവികാലവായനയ്ക്കും [b] γυνή എന്ന പദത്തിന്റെ പര്യായത്തിനുമായി ക്രമപ്പെടുത്തി.
