id: REV.19.20
reference: Revelation 19:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: ml
  text: മൃഗം പിടിക്കപ്പെട്ടു; അതോടൊപ്പം[a], അതിന്റെ സന്നിധിയിൽ അടയാളങ്ങൾ പ്രവർത്തിക്കുകയും അവയാൽ മൃഗത്തിന്റെ മുദ്ര സ്വീകരിച്ചവരെയും അതിന്റെ പ്രതിമയെ ആരാധിച്ചവരെയും വഞ്ചിക്കുകയും ചെയ്ത കള്ളപ്രവാചകനും പിടിക്കപ്പെട്ടു. ഇരുവരെയും ജീവനോടെ ഗന്ധകത്താൽ കത്തുന്ന അഗ്നിത്തടാകത്തിലേക്ക് എറിഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനോടൊപ്പം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ സർവനാമം ‘മൃഗം’ എന്ന നപുംസകലിംഗ നാമത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഗന്ധകം’ സൾഫറിനെയാണ് സൂചിപ്പിക്കുന്നത്. പരമ്പരാഗത ഇംഗ്ലീഷ് പരിഭാഷകളിൽ ഇതിന് ‘brimstone’ എന്നും കാണാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιάσθη
  choice: പിടിക്കപ്പെട്ടു
  rationale: πιάζω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിപ്രയോഗം പിടികൂടപ്പെടുകയോ കൈവശമാക്കപ്പെടുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു; ‘പിടിക്കപ്പെട്ടു’ സ്വാഭാവികവും കർമണിരൂപം നിലനിർത്തുന്നതുമാണ്.
- source_word: θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാടിലെ സ്ഥിരമായ അന്ത്യകാലദർശന പ്രതീകം നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: μετ’ αὐτοῦ
  choice: അതോടൊപ്പം
  rationale: അടുത്ത മുൻപദമായ τὸ θηρίον വ്യാകരണപരമായി നപുംസകലിംഗമാണ്. ‘അതോടൊപ്പം’ അനാവശ്യമായി വ്യക്തിവൽക്കരിക്കാതെ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ψευδοπροφήτης
  choice: കള്ളപ്രവാചകൻ
  rationale: വ്യാജമായി പ്രവാചകത്വം അവകാശപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാള പദം.
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: അടയാളങ്ങൾ പ്രവർത്തിക്കുകയും
  rationale: σημεῖα എന്നത് അത്ഭുതപ്രവൃത്തികൾ എന്നതിലുപരി സൂചനാത്മകമായ ‘അടയാളങ്ങൾ’ ആണ്; ποιέω ഇവിടെ അവ നടത്തുകയോ പ്രവർത്തിക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐνώπιον αὐτοῦ
  choice: അതിന്റെ സന്നിധിയിൽ
  rationale: ‘അതിന്റെ മുമ്പിൽ’ എന്നും സാധ്യമെങ്കിലും, സാന്നിധ്യത്തിൽ നടന്ന പ്രവൃത്തിയെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν οἷς ἐπλάνησεν
  choice: അവയാൽ ... വഞ്ചിക്കുകയും
  rationale: ἐν οἷς ഇവിടെ അടയാളങ്ങളെ വഞ്ചനയുടെ ഉപാധിയായി അവതരിപ്പിക്കുന്നു; ‘അവയാൽ’ ആ ഉപകരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: χάραγμα
  choice: മുദ്ര
  rationale: മൃഗവുമായി ബന്ധമുള്ള തിരിച്ചറിയൽ അടയാളം അഥവാ പതിപ്പ് എന്ന ആശയം മലയാളത്തിൽ ചുരുക്കമായും പരിചിതമായും നൽകുന്നു.
- source_word: προσκυνοῦντας
  choice: ആരാധിച്ചവരെ
  rationale: സന്ദർഭം വെറും ശാരീരിക നമസ്കാരത്തേക്കാൾ ആരാധനാപരമായ ഭക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആരാധിക്കുക’ യോജിക്കുന്നു.
- source_word: ζῶντες
  choice: ജീവനോടെ
  rationale: ഇരുവരും ജീവിച്ചിരിക്കെ എറിയപ്പെട്ടു എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: λίμνην τοῦ πυρὸς
  choice: തീത്തടാകം
  rationale: അന്ത്യവിധിയുടെ ദൃശ്യരൂപകത്തെ വ്യാഖ്യാനിച്ച് മാറ്റാതെ, λίμνηയും πῦρഉം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: θείῳ
  choice: ഗന്ധകം
  rationale: θεῖον എന്നത് കത്തുന്ന സൾഫർ അഥവാ ഗന്ധകം; ആധുനിക മലയാളത്തിൽ വ്യക്തവും കൃത്യവുമായ പദം ‘ഗന്ധകം’ ആണ്.
theological_decisions:
- issue: മൃഗത്തെ സൂചിപ്പിക്കുന്ന സർവനാമങ്ങൾ
  choice: ‘അത്/അതിന്റെ’ എന്ന നപുംസക സൂചന
  alternative: ‘അവൻ/അവന്റെ’ എന്ന് വ്യക്തിവൽക്കരിക്കുക
  rationale: ഗ്രീക്കിലെ θηρίον വ്യാകരണപരമായി നപുംസകലിംഗമാണ്. മലയാളത്തിൽ ‘അത്’ ഉപയോഗിക്കുന്നത് വാക്യത്തിലെ രൂപകം നിലനിർത്തുകയും പാഠം നിർബന്ധിക്കാത്ത അധിക വ്യക്തിവൽക്കരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: അന്ത്യവിധിയുടെ ദൃശ്യഭാഷ
  choice: ‘ഗന്ധകം കത്തുന്ന തീത്തടാകം’ എന്ന് ദൃശ്യരൂപം നേരിട്ട് നിലനിർത്തുക
  alternative: നരകം, നിത്യദണ്ഡനം തുടങ്ങിയ വ്യാഖ്യാനപദങ്ങൾ ചേർത്ത് പരാവർത്തനം ചെയ്യുക
  rationale: വാക്യം നൽകുന്ന അന്ത്യകാലദർശന ദൃശ്യത്തെ അതേ രൂപത്തിൽ സംരക്ഷിക്കുന്നു; ഈ വാക്യത്തിൽ നേരിട്ട് പറയാത്ത പിന്നീടുള്ള സിദ്ധാന്തപരമായ വിശദീകരണങ്ങൾ ചേർക്കുന്നില്ല.
- issue: രണ്ടുപേരും ജീവനോടെ എറിയപ്പെടുന്നു
  choice: ‘ഇരുവരെയും ജീവനോടെ’ എന്ന് വ്യക്തമായി പറയുക
  alternative: ‘അവർ തീത്തടാകത്തിൽ എറിയപ്പെട്ടു’ എന്ന് ചുരുക്കുക
  rationale: ζῶντες എന്ന പദം നൽകുന്ന അസാധാരണവും ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ളതുമായ ഊന്നൽ നഷ്ടപ്പെടാതിരിക്കാൻ.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. വെളിപ്പാടിലെ പ്രതീകപദങ്ങൾ നേരിട്ട് നിലനിർത്തി; അനാവശ്യമായ സിദ്ധാന്തവ്യാഖ്യാനം ഒഴിവാക്കി. ദൈർഘ്യമേറിയ ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി.
