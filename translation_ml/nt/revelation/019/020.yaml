  to: മൃഗം പിടിക്കപ്പെട്ടു; അതോടൊപ്പം[a], അതിന്റെ സന്നിധിയിൽ അടയാളങ്ങൾ പ്രവർത്തിക്കുകയും അവയാൽ മൃഗത്തിന്റെ മുദ്ര സ്വീകരിച്ചവരെയും അതിന്റെ പ്രതിമയെ ആരാധിച്ചവരെയും വഞ്ചിക്കുകയും ചെയ്ത കള്ളപ്രവാചകനും പിടിക്കപ്പെട്ടു. ഇരുവരെയും ജീവനോടെ ഗന്ധകത്താൽ കത്തുന്ന അഗ്നിത്തടാകത്തിലേക്ക് എറിഞ്ഞു[b].
  rationale: ഗന്ധകവും അഗ്നിത്തടാകവും തമ്മിലുള്ള ഗ്രീക്ക് ബന്ധം വ്യക്തമായി നിലനിർത്താൻ ‘ഗന്ധകത്താൽ കത്തുന്ന അഗ്നിത്തടാകം’ എന്നു തിരുത്തി. ഗന്ധകത്തെ കുന്തിരിക്കവുമായി തെറ്റായി ബന്ധിപ്പിച്ചിരുന്ന കുറിപ്പ് b നീക്കി, sulfur/brimstone എന്ന യഥാർഥ ലെക്സിക്കൽ വിവരമായി മാറ്റി. മറ്റെല്ലാ ആശയങ്ങളും, പ്രത്യേകിച്ച് നപുംസക സൂചനയും അന്ത്യവിധിദൃശ്യത്തിന്റെ അക്ഷരാർഥസ്വഭാവവും, നിലനിർത്തിയിരിക്കുന്നു.
