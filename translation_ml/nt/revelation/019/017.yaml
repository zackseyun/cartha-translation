  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: ml
  text: 'പിന്നെ, സൂര്യനിൽ നിൽക്കുന്ന ഒരു ദൂതനെ ഞാൻ കണ്ടു. ആകാശമധ്യത്തിൽ[a] പറക്കുന്ന സകല പക്ഷികളോടും അവൻ ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു: “വരുവിൻ, ദൈവത്തിന്റെ മഹാഭോജനത്തിനായി ഒരുമിച്ചുകൂടുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആകാശത്തിന്റെ നടുവിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ μεσουράνημα വെളിപ്പാട് പുസ്തകത്തിൽ ഉപയോഗിക്കുന്ന സവിശേഷമായ അപോകലിപ്റ്റിക് പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: ഒരു ദൂതനെ
  rationale: ഗ്രീക്കിലെ സംഖ്യാവാചകമായ ἕνα മലയാളത്തിലെ ‘ഒരു’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: സൂര്യനിൽ നിൽക്കുന്ന
  rationale: ἐν എന്നതിന്റെ നേരിട്ടുള്ള സ്ഥലാർഥവും ദർശനത്തിലെ ശക്തമായ അപോകലിപ്റ്റിക് ദൃശ്യവും വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു
  rationale: κράζωയുടെ ശക്തിയും φωνῇ μεγάλῃയുടെ അർഥവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: എല്ലാ പക്ഷികളോടുമായി
  rationale: ὄρνεον പൊതുവായി ‘പക്ഷി’ എന്നാണ്; ഇരപിടിയൻ പക്ഷികളെന്ന ആശയം അടുത്ത വാക്യത്തിലെ സാഹചര്യത്തിൽ നിന്നുള്ളതിനാൽ ഇവിടെ ചേർത്തിട്ടില്ല.
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: ആകാശമധ്യത്തിൽ പറക്കുന്ന
  rationale: μεσουράνημα സൂചിപ്പിക്കുന്ന ആകാശത്തിന്റെ മധ്യഭാഗം എന്ന വെളിപ്പാട്-സവിശേഷ ദൃശ്യഭാഷ സംക്ഷിപ്തവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Δεῦτε
  choice: വരുവിൻ
  rationale: നേരിട്ടുള്ള ബഹുവചന ആഹ്വാനം ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: συνάχθητε
  choice: ഒരുമിച്ചുകൂടുവിൻ
  rationale: ആജ്ഞാരൂപത്തിന്റെ കൂട്ടിച്ചേരൽഭാവം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മഹാഭോജനത്തിനായി
  rationale: δεῖπνον എന്ന പ്രധാനഭക്ഷണം/വിരുന്ന് എന്ന ആശയവും μέγα എന്ന വിശേഷണത്തിന്റെ ഊന്നലും ദൈവത്തോടുള്ള ജനിറ്റീവ് ബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അപോകലിപ്റ്റിക് സ്ഥലദൃശ്യത്തിന്റെ പരിഭാഷ
  choice: സൂര്യനിൽ നിൽക്കുന്ന
  alternative: സൂര്യന്റെ മുമ്പിൽ നിൽക്കുന്ന
  rationale: മൂലത്തിലെ ἐν τῷ ἡλίῳ നൽകുന്ന മനപ്പൂർവം വിസ്മയകരമായ ദൃശ്യം സുരക്ഷിതമായ വ്യാഖ്യാനത്തിലേക്ക് മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- issue: ദൈവത്തിന്റെ മഹാഭോജനം എന്ന പ്രയോഗത്തിലെ ജനിറ്റീവ് ബന്ധം
  choice: ദൈവത്തിന്റെ മഹാഭോജനം
  alternative: ദൈവം ഒരുക്കുന്ന മഹാഭോജനം
  rationale: τοῦ θεοῦ എന്നതിന്റെ ബന്ധം ഏത് അർഥത്തിലാണ് എന്നത് വാക്യം തന്നെ പൂർണമായി വിശദീകരിക്കാത്തതിനാൽ ‘ഒരുക്കുന്ന’ പോലുള്ള വ്യാഖ്യാനപദം ചേർക്കാതെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ദർശനവിവരണ ശൈലി. ‘വരുവിൻ’, ‘ഒരുമിച്ചുകൂടുവിൻ’ എന്നീ രൂപങ്ങൾ ആഹ്വാനത്തിന്റെ ഔന്നത്യം കാത്തുസൂക്ഷിക്കുന്നു; ബാക്കി വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്.
