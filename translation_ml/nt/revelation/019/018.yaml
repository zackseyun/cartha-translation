id: REV.19.18
reference: Revelation 19:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and servant, and small and great.
translation:
  language: ml
  text: രാജാക്കന്മാരുടെ മാംസവും സൈന്യാധിപന്മാരുടെ മാംസവും ശക്തന്മാരുടെ മാംസവും കുതിരകളുടെയും അവയുടെ മേൽ ഇരിക്കുന്നവരുടെയും മാംസവും സ്വതന്ത്രരും അടിമകളും ചെറിയവരും വലിയവരുമായ എല്ലാവരുടെയും മാംസവും നിങ്ങൾ തിന്നാൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: നിങ്ങൾ തിന്നേണ്ടതിന്
  rationale: ἵναയോടുകൂടിയ aorist subjunctive ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യാർഥഘടന ഉപയോഗിച്ചു.
- source_word: σάρκας
  choice: മാംസം
  rationale: ശാരീരിക ശരീരങ്ങളെ സംബന്ധിക്കുന്ന ന്യായവിധിദൃശ്യമായതിനാൽ പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; പട്ടികയിലെ ആവർത്തനവും സംരക്ഷിച്ചു.
- source_word: βασιλέων
  choice: രാജാക്കന്മാരുടെ
  rationale: രാജകീയ പദവിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: χιλιάρχων
  choice: സൈന്യാധിപന്മാരുടെ
  rationale: ചരിത്രപരമായി സൈനിക കമാൻഡറെ സൂചിപ്പിക്കുന്ന പദം; ആധുനിക വായനക്കാർക്ക് സൈനിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἰσχυρῶν
  choice: ശക്തന്മാരുടെ
  rationale: നാമവൽക്കരിച്ച വിശേഷണം; ശക്തിയോ പ്രാബല്യമോ ഉള്ളവരെ സൂചിപ്പിക്കുന്ന ഉറവിടത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: ἵππων καὶ τῶν καθημένων ἐπ’ αὐτῶν
  choice: കുതിരകളുടെയും അവയുടെ മേൽ ഇരിക്കുന്നവരുടെയും
  rationale: ‘കുതിരസവാരിക്കാർ’ എന്നു ചുരുക്കാതെ ഇരിക്കുന്നവരെക്കുറിച്ചുള്ള ഗ്രീക്ക് ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: πάντων
  choice: എല്ലാവരുടെയും
  rationale: തുടർന്നുള്ള സാമൂഹികവും പദവിസംബന്ധവുമായ എല്ലാ വിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന സമാഹാരപ്രയോഗം.
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: സ്വതന്ത്രരും അടിമകളും
  rationale: സ്വതന്ത്രസ്ഥിതിയും ബന്ധിതസ്ഥിതിയും തമ്മിലുള്ള വ്യക്തമായ സാമൂഹിക വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: μικρῶν καὶ μεγάλων
  choice: ചെറിയവരും വലിയവരും
  rationale: പദവിയിലോ പ്രാധാന്യത്തിലോ ഉള്ള എല്ലാ തലങ്ങളെയും ഉൾക്കൊള്ളുന്ന മെരിസം അതിന്റെ പരമ്പരാഗത രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സാമൂഹിക-പദവി ദ്വന്ദത്തിൽ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: ἐλεύθερος എന്ന ‘സ്വതന്ത്രൻ’ എന്ന പദത്തോടുള്ള നേരിട്ടുള്ള വൈരുധ്യം ബന്ധിതമായ നിയമ-സാമൂഹിക നിലയെ മുൻനിർത്തുന്നു; അതിനാൽ ‘അടിമകൾ’ ഉറവിടത്തോട് കൂടുതൽ കൃത്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. വെളിപ്പാട് 19:17-ലെ ദൂതന്റെ ആഹ്വാനവുമായി ചേരുന്ന വിധത്തിൽ ഉദ്ദേശ്യവാക്യം അവസാനം വെച്ചു. ഗ്രീക്കിലെ പട്ടികാസ്വഭാവവും ‘മാംസം’ എന്ന ആവർത്തനത്തിന്റെ വാചാടോപബലവും കഴിയുന്നത്ര നിലനിർത്തി.
