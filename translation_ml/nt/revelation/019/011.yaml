id: REV.19.11
reference: Revelation 19:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: ml
  text: പിന്നെ ഞാൻ സ്വർഗം തുറന്നിരിക്കുന്നതു കണ്ടു. ഇതാ, ഒരു വെള്ളക്കുതിര! അതിന്മേൽ ഇരിക്കുന്നവൻ “വിശ്വസ്തനും സത്യവാനും” എന്നു വിളിക്കപ്പെടുന്നു. അവൻ നീതിയോടെ ന്യായം വിധിക്കുകയും യുദ്ധം ചെയ്യുകയും ചെയ്യുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ന്യായത്തോടെ വിധിക്കുകയും യുദ്ധം ചെയ്യുകയും ചെയ്യുന്നു.”
    reason: δικαιοσύνη എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘നീതി’ എന്നും ന്യായനിർവഹണത്തിന് ഊന്നൽ നൽകി ‘ന്യായം’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: തുറന്നിരിക്കുന്നതു
  rationale: ἀνοίγωയുടെ പൂർണകാല കർമണി കൃദന്തരൂപം സ്വർഗം തുറക്കപ്പെട്ടതിന്റെ ഫലമായി തുറന്ന നിലയിൽ ഇരിക്കുന്നതു സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ നില തുടർന്നിരിക്കുന്നതും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ദർശനത്തിലെ പെട്ടെന്നുള്ള ശ്രദ്ധാകർഷണവും വെളിപ്പാട് സാഹിത്യത്തിന്റെ സജീവതയും നിലനിർത്തുന്നു.
- source_word: ἵππος λευκός
  choice: ഒരു വെള്ളക്കുതിര
  rationale: ഗ്രീക്ക് നാമപദപ്രയോഗത്തിന്റെ നേരായ, സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: അതിന്മേൽ ഇരിക്കുന്നവൻ
  rationale: ‘കുതിരസവാരിക്കാരൻ’ എന്നു വ്യാഖ്യാനപരമായി ചുരുക്കാതെ മൂലത്തിലെ കൃദന്തരൂപത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: “വിശ്വസ്തനും സത്യവാനും” എന്നു വിളിക്കപ്പെടുന്നു
  rationale: καλούμενος എന്ന നാമകരണപ്രയോഗവും രണ്ടു വിശേഷണങ്ങളുടെ സ്ഥാനപ്പേരുപോലുള്ള പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: πιστός
  choice: വിശ്വസ്തൻ
  rationale: ആശ്രയിക്കാവുന്നവൻ, വിശ്വാസ്യതയുള്ളവൻ എന്നീ അർഥങ്ങളെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: ἀληθινός
  choice: സത്യവാൻ
  rationale: ‘വിശ്വസ്തൻ’ എന്നതിനോടു ചേർന്ന് വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി സ്വാഭാവികമാണ്; ‘യഥാർഥൻ’ എന്ന അർഥസാധ്യതയെ അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: ἐν δικαιοσύνῃ
  choice: നീതിയോടെ
  rationale: വിധിക്കുകയും യുദ്ധം ചെയ്യുകയും ചെയ്യുന്ന രീതിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായി മലയാളത്തിൽ സ്വാഭാവികം. δικαιοσύνηയിലെ ധാർമിക നേരും ന്യായനിർവഹണവും ഉൾക്കൊള്ളുന്നു.
- source_word: κρίνει
  choice: ന്യായം വിധിക്കുന്നു
  rationale: സാധാരണ വർത്തമാനകാല പ്രവർത്തനം കൃത്യമായി നൽകുന്നു; ἐν δικαιοσύνῃ സൂചിപ്പിക്കുന്നതിലധികം ക്രിയാവിശേഷണം ചേർക്കുന്നില്ല.
- source_word: πολεμεῖ
  choice: യുദ്ധം ചെയ്യുന്നു
  rationale: πολεμέωയുടെ സൈനികബലം നേരായും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന രീതിയിലും നൽകുന്നു.
theological_decisions:
- issue: കുതിരപ്പുറത്തിരിക്കുന്നവന്റെ വിശേഷണങ്ങൾ സ്ഥാനപ്പേരുകളായി അവതരിപ്പിക്കൽ
  choice: “വിശ്വസ്തനും സത്യവാനും” എന്ന നാമകരണരൂപം
  alternative: ‘വിശ്വസ്തനും സത്യവാനുമായവൻ’ എന്ന വിവരണാത്മക രൂപം
  rationale: സന്ദർഭത്തിൽ πιστός, ἀληθινός എന്നിവ കേവലം ഗുണവിവരണങ്ങളല്ല, ആ വ്യക്തിയെ തിരിച്ചറിയിക്കുന്ന സ്ഥാനപ്പേരുകളായി പ്രവർത്തിക്കുന്നു. ഉദ്ധരണിച്ചിഹ്നങ്ങൾ ഈ പ്രവർത്തനം സൂചിപ്പിക്കുന്നു; വ്യക്തിയെ വാക്യത്തിന് പുറത്തുനിന്ന് തിരിച്ചറിയിക്കുന്നില്ല.
- issue: δικαιοσύνηയുടെ പരിഭാഷ
  choice: നീതി
  alternative: ന്യായം
  rationale: ഈ സന്ദർഭത്തിൽ ധാർമിക നേരും ന്യായമായ വിധിയും രണ്ടും പ്രസക്തമാണ്. പ്രധാനപാഠത്തിലെ ‘നീതി’ വിശാലമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ന്യായനിർവഹണത്തിന് ഊന്നൽ നൽകുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വെളിപ്പാട്-ദർശന ശൈലി. ‘ഇതാ’ എന്നത് ദൃശ്യത്തിന്റെ നാടകീയ ശ്രദ്ധാകർഷണം നിലനിർത്തുന്നു. വാക്യങ്ങൾ വായനാസൗകര്യത്തിനായി വിഭജിച്ചെങ്കിലും ഗ്രീക്കിലെ ആശയക്രമം സംരക്ഷിച്ചിട്ടുണ്ട്.
