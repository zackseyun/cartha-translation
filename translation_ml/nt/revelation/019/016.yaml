reference: Revelation 19:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· Βασιλεὺς βασιλέων καὶ κύριος κυρίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: ml
  text: 'അവന്റെ അങ്കിയിന്മേലും അവന്റെ തുടയിന്മേലും എഴുതപ്പെട്ട ഒരു നാമമുണ്ട്: “രാജാധിരാജാവും കർത്താധികർത്താവും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആലേഖനം ചെയ്ത ഒരു നാമം.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, “എഴുതപ്പെട്ട ഒരു നാമം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലമായ ἔχειയും സ്ഥിതിയെ സൂചിപ്പിക്കുന്ന γεγραμμένον എന്ന പൂർണ്ണ നിഷ്ക്രിയ കൃദന്തവും മലയാളത്തിൽ സ്വാഭാവികമായി ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: അവന്റെ അങ്കിയിന്മേൽ
  rationale: ἱμάτιον എന്നത് വസ്ത്രമോ അങ്കിയോ ആകാം; രാജകീയ-യോദ്ധൃസന്ദർഭത്തിൽ ‘അങ്കി’ സ്വാഭാവികവും വ്യക്തവുമാണ്. സന്ദർഭത്തിൽനിന്നുള്ള ഉടമസ്ഥബന്ധം ‘അവന്റെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: തുടയിന്മേൽ
  rationale: μηρός എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘തുട’ നിലനിർത്തുകയും ലിഖിതത്തിന്റെ സ്ഥാനം വ്യാഖ്യാനിച്ചു മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὄνομα γεγραμμένον
  choice: ഒരു നാമം എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: ‘എഴുതപ്പെട്ട’ എന്നത് ഗ്രീക്കിലെ പൂർണ്ണ നിഷ്ക്രിയ കൃദന്തത്തിന്റെ നിലനിൽക്കുന്ന ഫലം സംരക്ഷിക്കുന്നു; ‘കൊത്തിവെച്ച’ എന്നു പറഞ്ഞ് എഴുത്തിന്റെ രീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: Βασιλεὺς βασιλέων
  choice: രാജാധിരാജാവ്
  rationale: ‘രാജാക്കന്മാരുടെ രാജാവ്’ എന്ന ഗ്രീക്ക് മഹത്വപ്രയോഗത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതവും ഗൗരവമുള്ളതുമായ സംക്ഷിപ്ത രൂപം.
- source_word: κύριος κυρίων
  choice: കർത്താധികർത്താവ്
  rationale: ‘കർത്താക്കന്മാരുടെ കർത്താവ്’ എന്ന പദവിയുടെ സ്ഥാപിതമായ മലയാള രൂപം; κύριος എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ ‘കർത്താവ്’ എന്ന അർഥവും ഉന്നതാധികാരവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: രാജകീയ പദവികളെ വ്യാഖ്യാനപരമായി മാറ്റണമോ പരമ്പരാഗത രൂപത്തിൽ നിലനിർത്തണമോ
  choice: “രാജാധിരാജാവും കർത്താധികർത്താവും” എന്ന പദവികൾ നിലനിർത്തി.
  alternative: “രാജാക്കന്മാരുടെ രാജാവും കർത്താക്കന്മാരുടെ കർത്താവും”; “പരമരാജാവും പരമകർത്താവും”
  rationale: ഗ്രീക്ക് പാഠത്തിലെ സമാന്തര രാജകീയ പദവികളും അവയുടെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തിയും സംരക്ഷിക്കുന്നു; ‘പരമ’ എന്ന വ്യാഖ്യാനപരമായ പുനരാഖ്യാനം ഒഴിവാക്കുന്നു.
- issue: ‘അങ്കിയിന്മേലും തുടയിന്മേലും’ എന്ന സ്ഥാനവിവരണം എങ്ങനെ കൈകാര്യം ചെയ്യണം
  choice: രണ്ട് സ്ഥാനങ്ങളും നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: “തുട മൂടുന്ന അങ്കിയുടെ ഭാഗത്ത്”; “അങ്കിയിലും വാൾക്കച്ചയുടെ ഭാഗത്തും”
  rationale: ഗ്രീക്ക് രണ്ട് ἐπί പ്രയോഗങ്ങൾ നൽകുന്നു. അവയുടെ ബന്ധം വിശദീകരിക്കാതെയും ദൃശ്യത്തെ സമന്വയിപ്പിക്കാതെയും മൂലപാഠത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘അങ്കി’, ‘തുട’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; രാജകീയ പദവികൾക്കായി മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ പരിചിതമായ ‘രാജാധിരാജാവ്’, ‘കർത്താധികർത്താവ്’ എന്നീ രൂപങ്ങൾ സ്വീകരിച്ചു.
