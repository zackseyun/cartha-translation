  to: 'അവനെ ആരാധിക്കാനായി ഞാൻ അവന്റെ പാദങ്ങൾക്കു മുമ്പിൽ വീണു. എന്നാൽ അവൻ എന്നോടു പറഞ്ഞു: “അരുത്! ഞാൻ നിന്റെയും യേശുവിന്റെ സാക്ഷ്യം[a] ഉള്ളവരായ നിന്റെ സഹോദരന്മാരുടെയും[b] സഹദാസനാണ്[c]. ദൈവത്തെ ആരാധിക്കുക! എന്തെന്നാൽ, യേശുവിന്റെ സാക്ഷ്യം പ്രവചനത്തിന്റെ ആത്മാവാണ്.”'
