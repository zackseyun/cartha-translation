id: REV.19.10
reference: Revelation 19:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: ml
  text: 'അവനെ ആരാധിക്കാനായി ഞാൻ അവന്റെ പാദങ്ങൾക്കു മുമ്പിൽ വീണു. എന്നാൽ അവൻ എന്നോടു പറഞ്ഞു: “അരുത്! ഞാൻ നിന്റെയും യേശുവിന്റെ സാക്ഷ്യം[a] ഉള്ളവരായ നിന്റെ സഹോദരന്മാരുടെയും[b] സഹദാസനാണ്[c]. ദൈവത്തെ ആരാധിക്കുക! എന്തെന്നാൽ, യേശുവിന്റെ സാക്ഷ്യം പ്രവചനത്തിന്റെ ആത്മാവാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യേശുവിന്റെ സാക്ഷ്യം’ എന്നതിന് ‘യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യം’ എന്നോ ‘യേശു നൽകുന്ന സാക്ഷ്യം’ എന്നോ അർഥമാകാം. വാക്യത്തിന്റെ അവസാനത്തിലുള്ള ഇതേ പ്രയോഗത്തിനും ഈ രണ്ടർഥസാധ്യതയുണ്ട്.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ ‘സഹോദരന്മാർ’ എന്നത് സഹവിശ്വാസികളായ സഹോദരന്മാരെയും സഹോദരിമാരെയും പ്രതിനിധിയായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘സഹശുശ്രൂഷകൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: ഞാൻ അവന്റെ കാൽക്കൽ വീണു
  rationale: ഗ്രീക്കിലെ ശാരീരിക നിലപാട് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പാദങ്ങൾക്കു മുമ്പിൽ’ എന്ന കൂടുതൽ പദാനുപദ രൂപത്തേക്കാൾ ‘കാൽക്കൽ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: προσκυνῆσαι αὐτῷ / τῷ θεῷ προσκύνησον
  choice: അവനെ ആരാധിക്കാനായി / ദൈവത്തെ ആരാധിക്കുക
  rationale: ദൂതൻ ഈ പ്രവൃത്തി നിരസിച്ച് അതിനെ ദൈവത്തിലേക്കു തിരിച്ചുവിടുന്നതിനാൽ, ഇവിടെ προσκυνέω എന്നതിന്റെ മതപരമായ ശക്തി ‘ആരാധിക്കുക’ എന്ന പദം വ്യക്തമായി നൽകുന്നു.
- source_word: Ὅρα μή
  choice: അരുത്!
  rationale: ഇത് പെട്ടെന്നുള്ള ശക്തമായ നിരോധനമാണ്. ‘നോക്കൂ, ചെയ്യരുത്’ എന്ന പദാനുപദ രൂപത്തേക്കാൾ ‘അരുത്!’ മലയാളത്തിൽ അതേ തീവ്രത സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σύνδουλος
  choice: സഹദാസൻ
  rationale: യോഹന്നാനും ദൂതനും ദൈവത്തിന്റെ കീഴിൽ ഒരേ ദാസസ്ഥാനത്താണെന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘സഹശുശ്രൂഷകൻ’ എന്നത് അടിമത്തം/അധീനത എന്ന ഘടകം ദുർബലമാക്കാം.
- source_word: ἀδελφῶν σου
  choice: നിന്റെ സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സഹവിശ്വാസികളായ സ്ത്രീപുരുഷന്മാരെ പ്രതിനിധിയായി ഉൾക്കൊള്ളാനിടയുണ്ടെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: യേശുവിന്റെ സാക്ഷ്യം ഉള്ളവർ
  rationale: ἔχω എന്നതിന്റെ നേരായ അർഥവും Ἰησοῦ എന്ന ജനിറ്റീവിന്റെ അവ്യക്തതയും നിലനിർത്തുന്നു; ‘യേശുവിനെക്കുറിച്ച് സാക്ഷ്യം പറയുന്നവർ’ എന്നു പരിഭാഷപ്പെടുത്തി അർഥം ഏകപക്ഷീയമായി നിർണയിക്കുന്നില്ല.
- source_word: μαρτυρία Ἰησοῦ
  choice: യേശുവിന്റെ സാക്ഷ്യം
  rationale: ഈ പ്രയോഗത്തിന് ‘യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യം’ എന്നും ‘യേശു നൽകുന്ന സാക്ഷ്യം’ എന്നും അർഥമാകാം. ‘യേശുവിന്റെ സാക്ഷ്യം’ ഇരു സാധ്യതകളും തുറന്നുവയ്ക്കുന്നു.
- source_word: πνεῦμα τῆς προφητείας
  choice: പ്രവചനത്തിന്റെ ആത്മാവ്
  rationale: πνεῦμα എന്ന ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള പദത്തെ ‘സാരം’ എന്നാക്കി ചുരുക്കാതെ, ഉറവിടത്തിലെ സാന്ദ്രതയും സാധ്യതയുള്ള അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘യേശുവിന്റെ സാക്ഷ്യം’ എന്നതിലെ ജനിറ്റീവിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘യേശുവിന്റെ സാക്ഷ്യം’ എന്ന അവ്യക്തരൂപം നിലനിർത്തി
  alternative: ‘യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യം’ / ‘യേശു നൽകുന്ന സാക്ഷ്യം’
  rationale: Ἰησοῦ എന്ന ജനിറ്റീവ് വസ്തുനിഷ്ഠമോ കർത്തൃനിഷ്ഠമോ ആയിരിക്കാം. ഉറവിടം നിർബന്ധിക്കാത്ത ഒരു ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ തീരുമാനിച്ചിട്ടില്ല.
- issue: σύνδουλος എന്ന പദത്തിലെ പങ്കിട്ട അധീനസ്ഥാനം
  choice: സഹദാസൻ
  alternative: സഹശുശ്രൂഷകൻ / കൂടെ ദാസനായവൻ
  rationale: ദൂതൻ ആരാധനയ്ക്ക് അർഹനല്ലെന്നും യോഹന്നാനോടൊപ്പം ദൈവത്തിന്റെ കീഴിലുള്ള ദാസനാണെന്നും വാക്യം ഊന്നുന്നു. അതിനാൽ പങ്കിട്ട അധീനത വ്യക്തമാക്കുന്ന രൂപം തെരഞ്ഞെടുത്തു.
- issue: πνεῦμα τῆς προφητείας എന്നതിലെ πνεῦμα
  choice: പ്രവചനത്തിന്റെ ആത്മാവ്
  alternative: പ്രവചനത്തിന്റെ സാരം / പ്രവചനത്തെ പ്രചോദിപ്പിക്കുന്ന ആത്മാവ്
  rationale: ഗ്രീക്ക് പ്രയോഗം ‘ആത്മാവ്’, ‘ജീവശക്തി’, ‘അന്തസ്സാരം’ എന്നീ ആശയങ്ങളിലേക്കു തുറന്നിരിക്കാം. മുഖ്യപാഠം അതിനെ ഒരൊറ്റ വിശദീകരണത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ദൂതന്റെ പെട്ടെന്നുള്ള നിരോധനം ‘അരുത്!’ എന്ന് സ്വാഭാവികമായി നൽകി. ‘സഹദാസൻ’, ‘യേശുവിന്റെ സാക്ഷ്യം’, ‘പ്രവചനത്തിന്റെ ആത്മാവ്’ എന്നീ രൂപങ്ങൾ ഉറവിടത്തിലെ ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും യഥാർത്ഥ അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
