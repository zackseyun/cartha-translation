id: REV.3.7
reference: Revelation 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: ml
  text: 'ഫിലദെൽഫിയയിലെ സഭയുടെ ദൂതന്[a] എഴുതുക: “വിശുദ്ധനായവനും സത്യമായവനും ദാവീദിന്റെ താക്കോൽ കൈവശമുള്ളവനും, തുറക്കുന്നവനും ആരും അടയ്ക്കുകയില്ലാത്തവനും, അടയ്ക്കുന്നവനും ആരും തുറക്കാത്തവനും ഇപ്രകാരം പറയുന്നു:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൂതൻ’ എന്നതിന് ‘സന്ദേശവാഹകൻ’ എന്നും വിവർത്തനം ചെയ്യാം (ἀγγέλῳ).
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ദൂതന്
  rationale: ഗ്രീക്ക് പദത്തിന് സ്വർഗീയ ദൂതൻ എന്നും മനുഷ്യ സന്ദേശവാഹകൻ എന്നും അർഥമാകാം. വെളിപ്പാടിലെ ഏഴ് സഭകൾക്കുള്ള ആവർത്തിത അഭിസംബോധനയിൽ വ്യാഖ്യാനം നിർബന്ധിക്കാതെ പരമ്പരാഗതവും സ്വാഭാവികവുമായ ‘ദൂതൻ’ നിലനിർത്തുന്നു.
- source_word: ἐκκλησίας
  choice: സഭയുടെ
  rationale: ഇവിടെ ക്രിസ്തീയ വിശ്വാസസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘സഭ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: Τάδε λέγει
  choice: ഇപ്രകാരം പറയുന്നു
  rationale: പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഗൗരവമുള്ള സൂത്രവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; τάδε എന്നതിന്റെ സൂചനാത്മക ബലവും ഇതിലൂടെ പ്രതിഫലിക്കുന്നു.
- source_word: ὁ ἅγιος
  choice: വിശുദ്ധനായവൻ
  rationale: ലേഖനത്തോടുകൂടിയ നാമവൽക്കരിച്ച വിശേഷണം ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു.
- source_word: ὁ ἀληθινός
  choice: സത്യനായവൻ
  rationale: സത്യസന്ധൻ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ യഥാർഥൻ, സത്യമായവൻ എന്നീ യോഹന്നാനീയ ഭാവങ്ങളും ഉൾക്കൊള്ളുന്ന സ്ഥാനപ്പേര്.
- source_word: κλεῖν Δαυίδ
  choice: ദാവീദിന്റെ താക്കോൽ
  rationale: യെശയ്യാവ് 22:22-ലെ രാജകീയ അധികാരപ്രതീകം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ മൂലരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνοίγων
  choice: തുറക്കുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തെ പ്രസംഗകന്റെ തുടർച്ചയായ വിശേഷണമായി സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: κλείσει
  choice: അടയ്ക്കുകയില്ല
  rationale: ഭാവികാല സൂചന നിലനിർത്തി, അവൻ തുറക്കുന്നതിനെ അടയ്ക്കാൻ ആർക്കും കഴിയില്ലെന്ന അർഥം പ്രകടമാക്കുന്നു.
- source_word: κλείων
  choice: അടയ്ക്കുന്നവൻ
  rationale: ἀνοίγων എന്നതിനോടുള്ള സമാന്തര ഘടന മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: ἀνοίγει
  choice: തുറക്കുന്നില്ല
  rationale: മൂലപാഠത്തിലെ വർത്തമാനകാലം നിലനിർത്തുന്നു; സമീപത്തെ ഭാവികാലരൂപവുമായി ഉള്ള കാലവ്യത്യാസം സമീകരിക്കുന്നില്ല.
theological_decisions:
- issue: ὁ ἅγιος, ὁ ἀληθινός എന്നീ ക്രിസ്തുസംബന്ധിയായ സ്ഥാനപ്പേരുകൾ
  choice: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സ്ഥാനപ്പേരുകളായി ‘വിശുദ്ധനായവൻ, സത്യനായവൻ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: പൊതുവായ വിശേഷണപ്രയോഗമായി ‘വിശുദ്ധനും സത്യവാനുമായവൻ’ എന്നു നൽകുക.
  rationale: അടുത്ത സന്ദർഭത്തിൽ സംസാരിക്കുന്നത് ക്രിസ്തുവാണ്; ലേഖനത്തോടുകൂടിയ ഈ വിശേഷണങ്ങൾ ഗൗരവമുള്ള സ്ഥാനപ്പേരുകളായി പ്രവർത്തിക്കുന്നു. പാഠത്തിനപ്പുറം സിദ്ധാന്തവികാസം ചേർക്കാതെ അതിന്റെ ഉയർന്ന ക്രിസ്തുദർശനം നിലനിർത്തുന്നു.
- issue: ‘ദാവീദിന്റെ താക്കോൽ’ എന്ന സൂചന
  choice: യെശയ്യാവിലെ ദാവീദീയ രാജാധികാരസൂചന പ്രധാനപാഠത്തിൽ പ്രതീകാത്മക രൂപത്തിൽ തന്നെ നിലനിർത്തി.
  alternative: ‘ദാവീദിന്റെ രാജ്യത്തിന്മേലുള്ള അധികാരം’ എന്ന് വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക.
  rationale: യെശയ്യാവ് 22:22-ലേക്കുള്ള സൂചന ശക്തമാണെങ്കിലും വിവർത്തനം പ്രതീകത്തെ വ്യാഖ്യാനത്തോടെ മാറ്റിസ്ഥാപിക്കരുത്; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. അഭിസംബോധനയും പ്രവാചകപ്രഖ്യാപനശൈലിയും നിലനിർത്തി. ഗ്രീക്കിലെ ‘തുറക്കുന്നു/ആരും അടയ്ക്കുകയില്ല’ എന്ന വർത്തമാന-ഭാവികാല വ്യത്യാസവും ‘അടയ്ക്കുന്നു/ആരും തുറക്കുന്നില്ല’ എന്ന വർത്തമാനകാല സമാന്തരവും ഉദ്ദേശപൂർവം സമീകരിച്ചിട്ടില്ല.
