revisions:
- from: 'ഫിലദെൽഫിയയിലെ സഭയുടെ ദൂതന്[a] എഴുതുക: “വിശുദ്ധനായവനും സത്യനായവനും ദാവീദിന്റെ താക്കോൽ കൈവശമുള്ളവനും[b]—തുറക്കുന്നവൻ; ആരും അടയ്ക്കുകയില്ല; അടയ്ക്കുന്നവൻ; ആരും തുറക്കുന്നില്ല—ഇപ്രകാരം പറയുന്നു:'
  to: 'ഫിലദെൽഫിയയിലെ സഭയുടെ ദൂതന്[a] എഴുതുക: “വിശുദ്ധനായവനും സത്യമായവനും ദാവീദിന്റെ താക്കോൽ കൈവശമുള്ളവനും, തുറക്കുന്നവനും ആരും അടയ്ക്കുകയില്ലാത്തവനും, അടയ്ക്കുന്നവനും ആരും തുറക്കാത്തവനും ഇപ്രകാരം പറയുന്നു:”'
  rationale: The sentence has been recast into coherent modern Malayalam, with the speaker’s descriptions kept in a single coordinated sequence. ‘ആരും അടയ്ക്കുകയില്ലാത്തവനും’ retains the future force of κλείσει, while ‘ആരും തുറക്കാത്തവനും’ retains the present force of ἀνοίγει. The Isaiah allusion footnote is retained; its anchor belongs after ‘ദാവീദിന്റെ താക്കോൽ.’
