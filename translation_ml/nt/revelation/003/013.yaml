id: REV.3.13
reference: Revelation 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/013.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: ml
  text: ചെവിയുള്ളവൻ ആത്മാവ് സഭകളോടു പറയുന്നത് കേൾക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: ചെവിയുള്ളവൻ
  rationale: ഗ്രീക്കിലെ ഏകവചനവും പഴമൊഴിസദൃശമായ ആഹ്വാനവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀκουσάτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു; ഇവിടെ കേൾക്കുക എന്നത് ശ്രദ്ധിച്ച് സ്വീകരിക്കുക എന്ന വിശാലമായ അർഥവും വഹിക്കുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: വെളിപ്പാടിലെ ആവർത്തിത സന്ദേശസൂത്രത്തിൽ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ പതിവനുസരിച്ച് ആദരസൂചകമായി വലിയക്ഷരം ഉപയോഗിച്ചു.
- source_word: λέγει
  choice: പറയുന്നത്
  rationale: വർത്തമാനകാലത്തിലെ പ്രസ്താവനയെ മലയാള വാക്യഘടനയിൽ സ്വാഭാവികമായി ഉള്ളടക്കവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: ταῖς ἐκκλησίαις
  choice: സഭകളോട്
  rationale: ദത്തിവിന്റെ അഭിസംബോധന/സ്വീകർത്തൃബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വെളിപ്പാടിലെ ഏഴ് സഭകളുടെ പശ്ചാത്തലത്തിൽ ‘സഭകൾ’ യോജിച്ച പതിവുപദമാണ്.
theological_decisions:
- issue: ‘ആത്മാവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: സഭകളോട് സംസാരിക്കുന്ന പരിശുദ്ധാത്മാവ്
  alternative: മനുഷ്യാത്മാവ്, അല്ലെങ്കിൽ വ്യക്തിത്വമില്ലാത്ത പ്രവചനാത്മാവ്
  rationale: വെളിപ്പാടിലെ ആവർത്തിതമായ ഈ ആഹ്വാനസൂത്രവും സന്ദർഭവും പരിശുദ്ധാത്മാവിനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; വിവർത്തനം അതിലപ്പുറമുള്ള വിഭാഗീയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ഏകവചന ആഹ്വാനവും വാക്യത്തിന്റെ ചുരുക്കവും സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ചേർത്തു.
