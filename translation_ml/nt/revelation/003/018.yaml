id: REV.3.18
reference: Revelation 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: ml
  text: നീ സമ്പന്നനാകേണ്ടതിന് തീയിൽ ശുദ്ധീകരിച്ച സ്വർണവും[a], നീ ധരിക്കേണ്ടതിനും നിന്റെ നഗ്നതയുടെ ലജ്ജ വെളിപ്പെടാതിരിക്കേണ്ടതിനും വെള്ള വസ്ത്രങ്ങളും[b], നിനക്കു കാഴ്ച ലഭിക്കേണ്ടതിന് കണ്ണുകളിൽ പുരട്ടാൻ നേത്രലേപനവും[c] എന്നിൽനിന്ന് വാങ്ങാൻ ഞാൻ നിനക്കു ഉപദേശിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തീയിൽ ശുദ്ധമാക്കിയ’ അല്ലെങ്കിൽ ‘തീയിൽ പരിശോധിച്ച.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദത്തിന് പൊതുവായി ‘ഉടുപ്പുകൾ’ എന്നും ചില സന്ദർഭങ്ങളിൽ കൂടുതൽ പ്രത്യേകമായി ‘അങ്കികൾ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: ‘നേത്രലേപനം’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദം കണ്ണുകളിൽ പുരട്ടിയിരുന്ന ഒരു ഔഷധതയ്യാറിപ്പിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: συμβουλεύω
  choice: ഞാൻ നിന്നെ ഉപദേശിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ അധികാരപൂർവമായ ഉപദേശത്തിന്റെ ഭാരം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἀγοράσαι
  choice: വാങ്ങാൻ
  rationale: ആത്മീയ വസ്തുക്കൾ നേടുന്നതിനെക്കുറിച്ചുള്ള രൂപകത്തെ വിശദീകരിച്ചു മാറ്റാതെ ലളിതമായ ക്രിയ നിലനിർത്തുന്നു.
- source_word: παρ’ ἐμοῦ
  choice: എന്നിൽനിന്നു
  rationale: ജനിറ്റീവിനോടുകൂടിയ παρά ഇവിടെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ നേരിട്ടുള്ള തുല്യപ്രയോഗമാണിത്.
- source_word: χρυσίον
  choice: സ്വർണം
  rationale: വസ്തുദ്രവ്യത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ അർഥം; ‘സ്വർണക്കട്ടി’ പോലുള്ള അനാവശ്യമായ പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു.
- source_word: πεπυρωμένον ἐκ πυρός
  choice: തീയിൽ ശുദ്ധീകരിച്ച
  rationale: അഗ്നിയിലൂടെ ശുദ്ധീകരിക്കപ്പെട്ട നിലയെ സൂചിപ്പിക്കുന്ന പൂർണ നിഷ്ക്രിയ കൃദന്തരൂപവും ലോഹശുദ്ധീകരണചിത്രവും സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: ἵνα πλουτήσῃς
  choice: നീ സമ്പന്നനാകേണ്ടതിന്
  rationale: സമ്പന്നാവസ്ഥയിലേക്കു പ്രവേശിക്കുന്ന ഭാവം ഉൾക്കൊള്ളുന്ന വിധത്തിൽ aorist subjunctive-ന്റെ ലക്ഷ്യാർഥം പ്രകടമാക്കുന്നു.
- source_word: ἱμάτια λευκά
  choice: വെള്ള വസ്ത്രങ്ങൾ
  rationale: ἱμάτια എന്ന വിശാലമായ വസ്ത്രപദത്തെ ‘അങ്കികൾ’ എന്നു അനാവശ്യമായി ചുരുക്കാതെ വെളിപ്പാടിലെ പ്രതീകചിത്രം നിലനിർത്തുന്നു.
- source_word: ἵνα περιβάλῃ
  choice: നീ ധരിക്കേണ്ടതിന്
  rationale: മധ്യമപ്രയോഗത്തിന്റെ വ്യക്തിപരമായ ഏറ്റെടുക്കൽ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μὴ φανερωθῇ
  choice: വെളിപ്പെടാതിരിക്കേണ്ടതിന്
  rationale: നിഷ്ക്രിയരൂപവും നഗ്നതയുടെ ലജ്ജ ദൃശ്യമാകാതിരിക്കണമെന്ന ആശയവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: നിന്റെ നഗ്നതയുടെ ലജ്ജ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധവും ധാർമിക-പ്രതീകാത്മക സാഹചര്യത്തിലെ ലജ്ജാഭാവവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: κολλούριον
  choice: നേത്രലേപനം
  rationale: കണ്ണിൽ പുരട്ടുന്ന ഔഷധതയ്യാറിപ്പിനെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും മാന്യവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളപദം.
- source_word: ἐγχρῖσαι
  choice: കണ്ണുകളിൽ പുരട്ടാൻ
  rationale: തേച്ചോ പുരട്ടിയോ പ്രയോഗിക്കുന്ന വൈദ്യപ്രവൃത്തിയെ കൃത്യമായി നൽകുന്നു; ഇവിടെ ‘അഭിഷേകം ചെയ്യുക’ എന്നു പറഞ്ഞ് അനാവശ്യമായ കൂദാശാസൂചന വരുത്തുന്നില്ല.
- source_word: ἵνα βλέπῃς
  choice: നിനക്കു കാഴ്ച ലഭിക്കേണ്ടതിന്
  rationale: കാണാൻ കഴിയുന്ന അവസ്ഥ കൈവരിക്കണമെന്ന ലക്ഷ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സ്വർണം, വെള്ള വസ്ത്രങ്ങൾ, നേത്രലേപനം എന്നിവയുടെ പ്രതീകാത്മക അർഥം
  choice: പ്രതീകചിത്രങ്ങൾ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: സ്വർണം ആത്മീയ സമ്പത്തായും വസ്ത്രങ്ങൾ നീതി അല്ലെങ്കിൽ വിശുദ്ധിയായും നേത്രലേപനം ആത്മീയ വിവേകമായും പരിഭാഷയ്ക്കുള്ളിൽത്തന്നെ വിശദീകരിക്കുക.
  rationale: ഈ വാക്യം പ്രതീകങ്ങൾ ഉപയോഗിക്കുന്നുവെങ്കിലും അവയുടെ ആത്മീയ സമാനതകൾ ഇവിടെ നേരിട്ട് നിർവചിക്കുന്നില്ല; അതിനാൽ സന്ദർഭത്തിൽനിന്ന് അർഥം ഗ്രഹിക്കാൻ വായനക്കാരനെ അനുവദിക്കുന്നു.
- issue: ἐγχρῖσαι എന്ന പദത്തിന്റെ അഭിഷേകപരമോ കൂദാശാപരമോ ആയ സാധ്യത
  choice: വൈദ്യപരമായ പ്രയോഗം സൂചിപ്പിക്കാൻ ‘പുരട്ടാൻ’ എന്നു നൽകി.
  alternative: ‘അഭിഷേകം ചെയ്യാൻ’ എന്നു നൽകി പ്രതീകാത്മക അനുരണനം കൂടുതൽ നിലനിർത്തുക.
  rationale: കൊλλούριον എന്ന നേത്രൗഷധത്തിന്റെ സന്ദർഭത്തിൽ പദം തേച്ചുപയോഗിക്കുന്ന പ്രവൃത്തിയെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്; ‘അഭിഷേകം’ എന്നത് മലയാളത്തിൽ മൂലപാഠം നിർബന്ധിക്കാത്ത കൂദാശാസൂചന സൃഷ്ടിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ സമാന്തര ഘടന നിലനിർത്താൻ ‘സ്വർണവും … വസ്ത്രങ്ങളും … നേത്രലേപനവും’ എന്ന ക്രമം ഉപയോഗിച്ചു; ‘എന്നിൽനിന്നു വാങ്ങാൻ’ മൂന്നു വസ്തുക്കൾക്കും ഒരുപോലെ ബാധകമാണ്. പ്രതീകങ്ങളെ വ്യാഖ്യാനിച്ചു ചേർക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
