  to: ജയിക്കുന്നവനെ ഞാൻ എന്റെ ദൈവത്തിന്റെ ആലയത്തിൽ ഒരു തൂണാക്കും[a]. അവൻ ഇനി ഒരിക്കലും അതിൽനിന്ന് പുറത്തുപോകുകയില്ല[b]. എന്റെ ദൈവത്തിന്റെ നാമവും, എന്റെ ദൈവത്തിന്റെ നഗരമായ, സ്വർഗത്തിൽനിന്ന് എന്റെ ദൈവത്തിൽനിന്ന് ഇറങ്ങിവരുന്ന പുതിയ യെരൂശലേമിന്റെ നാമവും, എന്റെ സ്വന്തം പുതിയ നാമവും[c] ഞാൻ അവന്റെമേൽ എഴുതും.
