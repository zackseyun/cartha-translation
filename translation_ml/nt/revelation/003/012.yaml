id: REV.3.12
reference: Revelation 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: ml
  text: ജയിക്കുന്നവനെ ഞാൻ എന്റെ ദൈവത്തിന്റെ ആലയത്തിൽ ഒരു തൂണാക്കും[a]. അവൻ ഇനി ഒരിക്കലും അതിൽനിന്ന് പുറത്തുപോകുകയില്ല[b]. എന്റെ ദൈവത്തിന്റെ നാമവും, എന്റെ ദൈവത്തിന്റെ നഗരമായ, സ്വർഗത്തിൽനിന്ന് എന്റെ ദൈവത്തിൽനിന്ന് ഇറങ്ങിവരുന്ന പുതിയ യെരൂശലേമിന്റെ നാമവും, എന്റെ സ്വന്തം പുതിയ നാമവും[c] ഞാൻ അവന്റെമേൽ എഴുതും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിജയിക്കുന്നവനെ.’ വെളിപ്പാടിൽ ഗ്രീക്ക് ക്രിയയായ νικάω വിശ്വസ്തതയോടെയുള്ള വിജയത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തിത പദമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ ശക്തമായ നിഷേധമാണ്: ‘അവൻ തീർച്ചയായും ഇനി ഒരിക്കലും പുറത്തുപോകുകയില്ല.’'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘എന്റെ പുതിയ നാമവും.’ ഗ്രീക്ക് പദക്രമം ഈ വാക്യഭാഗത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: ജയിക്കുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പ്രതിനിധാനപരവും തുടർച്ചാസൂചകവുമായ ഭാവം നിലനിർത്തുന്നു; വെളിപ്പാടിലെ ആവർത്തിതമായ νικάω പ്രമേയവും വ്യക്തമാക്കുന്നു.
- source_word: ποιήσω αὐτὸν στῦλον
  choice: അവനെ ... ഒരു തൂണാക്കും
  rationale: ποιέω-യോടുകൂടിയ predicate accusative ഘടനയും സ്ഥിരതയും ബഹുമാനവും സൂചിപ്പിക്കുന്ന വാസ്തുശില്പരൂപകവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ναῷ τοῦ θεοῦ μου
  choice: എന്റെ ദൈവത്തിന്റെ ആലയത്തിൽ
  rationale: ναός വിശുദ്ധമന്ദിരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആലയം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: അവൻ ഇനി ഒരിക്കലും അതിൽനിന്ന് പുറത്തുപോകുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധവും ἔτι നൽകുന്ന അന്തിമത്വവും മലയാളത്തിൽ ‘ഇനി ഒരിക്കലും ... ഇല്ല’ എന്ന ഘടനയിലൂടെ പ്രകടമാക്കുന്നു; ‘അതിൽനിന്ന്’ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ആലയസൂചന വ്യക്തമാക്കുന്നു.
- source_word: γράψω ἐπ’ αὐτὸν
  choice: ഞാൻ അവന്റെമേൽ എഴുതും
  rationale: മേൽ എഴുതുക/ആലേഖനം ചെയ്യുക എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; അനാവശ്യ വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ
  choice: എന്റെ ദൈവത്തിന്റെ നഗരത്തിന്റെ നാമവും—... പുതിയ യെരൂശലേമിന്റെ നാമവും—
  rationale: ‘നാമം’ എന്ന സമാന്തരഘടന സംരക്ഷിക്കുകയും appositional ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἡ καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: എന്റെ ദൈവത്തിന്റെ അടുക്കൽനിന്ന് സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുന്ന
  rationale: ἀπό സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ ഉറവിടവും ἐκ സൂചിപ്പിക്കുന്ന സ്വർഗത്തിൽനിന്നുള്ള പുറപ്പെടലും രണ്ടും നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ക്രമം ഉപയോഗിക്കുന്നു.
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: എന്റെ സ്വന്തം പുതിയ നാമം
  rationale: ആവർത്തിത നിർദേശകഘടനയിലെ ഊന്നൽ ‘സ്വന്തം’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; പുതിയ നാമത്തിന്റെ ഉള്ളടക്കം വ്യാഖ്യാനിക്കാതെ രഹസ്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: വാഗ്ദാനസൂത്രത്തിലെ പുല്ലിംഗ ഏകവചനം
  choice: ‘അവനെ/അവൻ/അവന്റെമേൽ’ എന്ന ഏകവചനരൂപങ്ങൾ
  alternative: ‘അവരെ’ പോലുള്ള ലിംഗനിരപേക്ഷ ബഹുവചനം
  rationale: ഗ്രീക്കിലെ αὐτόν അടക്കമുള്ള ഏകവചനരൂപങ്ങളെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു; അതിന്റെ പ്രതിനിധാനപരമായ വ്യാപ്തി പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: ഉയിർത്തെഴുന്നേറ്റ യേശുവിന്റെ വാക്കുകളിലെ ‘എന്റെ ദൈവം’ എന്ന ആവർത്തനം
  choice: ഉറവിടത്തിലുള്ള ഓരോ പ്രസക്ത ആവർത്തനവും സംരക്ഷിക്കുക
  alternative: ശൈലിക്കായി ആവർത്തനം ചുരുക്കുക
  rationale: τοῦ θεοῦ μου എന്ന ആവർത്തനം പാഠത്തിൽ വ്യക്തവും ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ളതുമാണ്; അതിലെ സംഘർഷം വിശദീകരിച്ചോ ലഘൂകരിച്ചോ മാറ്റുന്നില്ല.
- issue: അവസാനത്തെ നാമവാക്യത്തിന്റെ ഊന്നൽ
  choice: ‘എന്റെ സ്വന്തം പുതിയ നാമം’
  alternative: ‘എന്റെ പുതിയ നാമം’
  rationale: τὸ ὄνομά μου τὸ καινόν എന്ന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; നാമത്തെക്കുറിച്ച് അനുമാനപരമായ ഉപദേശം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ഗൗരവമുള്ള വാക്യരീതി. ‘ആലയം,’ ‘തൂൺ,’ ‘നാമം’ എന്നീ ബൈബിൾസംബന്ധിയായ രൂപകങ്ങളും മുഖ്യപദങ്ങളും നിലനിർത്തി. ദീർഘമായ നാമപ്പട്ടിക വായിക്കാൻ സഹായിക്കാൻ ദീർഘരേഖകൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ആവർത്തനവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും ലഘൂകരിച്ചിട്ടില്ല.
