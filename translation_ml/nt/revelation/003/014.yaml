id: REV.3.14
reference: Revelation 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: ml
  text: 'ലവൊദിക്യയിലെ സഭയുടെ ദൂതന് എഴുതുക: ആമേൻ, വിശ്വസ്തനും സത്യവാനുമായ സാക്ഷി, ദൈവത്തിന്റെ സൃഷ്ടിയുടെ ആരംഭം[a]—ഇങ്ങനെ പറയുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവത്തിന്റെ സൃഷ്ടിയുടെ ഉറവിടം/ഉത്ഭവം’ എന്നോ ‘ദൈവത്തിന്റെ സൃഷ്ടിയുടെമേൽ ഭരണാധികാരി’ എന്നോ അർഥമാകാം. ἀρχή എന്ന ഗ്രീക്ക് പദത്തിന് ‘ആരംഭം,’ ‘ഉത്ഭവം/ഉറവിടം,’ ‘ഭരണാധികാരി’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ദൂതന്
  rationale: സ്വർഗീയ ദൂതനെയോ മനുഷ്യസന്ദേശവാഹകനെയോ സൂചിപ്പിക്കാവുന്ന പദമാണിത്. വെളിപ്പാടിലെ ഏഴ് സഭകളോടുള്ള ആവർത്തിത അഭിസംബോധനയിൽ ‘ദൂതൻ’ സ്വാഭാവികവും പദത്തിന്റെ ദ്വയാർഥത നിലനിർത്തുന്നതുമാണ്.
- source_word: Τάδε λέγει
  choice: ഇങ്ങനെ പറയുന്നു
  rationale: പ്രവാചകീയ പ്രഖ്യാപനസൂത്രത്തിന്റെ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ Ἀμήν
  choice: ആമേൻ
  rationale: ഉറപ്പും സത്യവും സൂചിപ്പിക്കുന്ന എബ്രായ പശ്ചാത്തലമുള്ള സവിശേഷ ക്രിസ്തുശീർഷകമായതിനാൽ വിവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: ὁ μάρτυς
  choice: സാക്ഷി
  rationale: നിയമപരമായ സാക്ഷ്യത്തിന്റെയും വെളിപ്പെടുത്തുന്ന സാക്ഷ്യത്തിന്റെയും അർഥസാധ്യതകൾ സ്വാഭാവികമായി നിലനിർത്തുന്ന നേരിട്ടുള്ള തർജമ.
- source_word: πιστὸς καὶ ἀληθινός
  choice: വിശ്വസ്തനും സത്യവാനുമായ
  rationale: വ്യക്തിപരമായ വിശ്വസ്തതയും യാഥാർഥ്യത്തോട് പൂർണമായി പൊരുത്തപ്പെടുന്ന സത്യതയും ചേർന്ന ഗ്രീക്ക് വിശേഷണജോടി മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἡ ἀρχὴ
  choice: ആരംഭം
  rationale: ἀρχή എന്ന പദത്തിന്റെ ഏറ്റവും നേരിട്ടുള്ള അർഥം നൽകുകയും ‘ഉത്ഭവം/ഉറവിടം’ അല്ലെങ്കിൽ ‘ഭരണാധികാരി’ എന്ന വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധമായി തിരഞ്ഞെടുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τῆς κτίσεως τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സൃഷ്ടിയുടെ
  rationale: κτίσις എന്നതിന് ‘സൃഷ്ടി’ എന്ന നേരിട്ടുള്ള തർജമയും ഗ്രീക്ക് ജനിറ്റീവ് ഘടനയുടെ ലളിതമായ പുനരാവിഷ്കാരവുമാണ്.
theological_decisions:
- issue: ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ എന്ന ക്രിസ്തുശീർഷകത്തിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ സൃഷ്ടിയുടെ ആരംഭം
  alternative: ദൈവത്തിന്റെ സൃഷ്ടിയുടെ ഉറവിടം/ഉത്ഭവകാരണം; ദൈവത്തിന്റെ സൃഷ്ടിയുടെമേൽ ഭരണാധികാരി
  rationale: ἀρχή എന്ന പദം ‘ആരംഭം,’ ‘ഉത്ഭവം/ഉറവിടം,’ ‘ഭരണാധികാരി’ എന്നീ അർഥങ്ങൾ വഹിക്കാം. അതിനാൽ മുഖ്യപാഠം ഏറ്റവും നേരിട്ടുള്ള പദാർഥം നിലനിർത്തുകയും മത്സരിക്കുന്ന ക്രിസ്തുശാസ്ത്രപരമായ വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ അഭിസംബോധന ആദ്യം വരുന്നതും തുടർന്ന് ക്രിസ്തുശീർഷകങ്ങൾ നൽകി അവസാനം ‘ഇങ്ങനെ പറയുന്നു’ വരുന്നതുമായ ഘടന മലയാളവായനയ്ക്ക് സ്വാഭാവികമായി ക്രമപ്പെടുത്തി. ‘ദൂതൻ’ എന്ന പദം തന്നെ ‘angel/messenger’ എന്നീ സാധ്യതകൾ വഹിക്കുന്നതിനാൽ അതിനായി പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
