id: REV.3.2
reference: Revelation 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: ml
  text: ഉണരുക; മരിക്കാൻ പോകുന്ന ശേഷിച്ചവയെ ശക്തിപ്പെടുത്തുക. കാരണം, എന്റെ ദൈവത്തിന്റെ സന്നിധിയിൽ നിന്റെ പ്രവൃത്തികൾ പൂർത്തിയായതായി ഞാൻ കണ്ടെത്തിയിട്ടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: ഉണരുക
  rationale: അക്ഷരാർഥത്തിൽ ‘ജാഗരിച്ചിരിക്കുന്നവനായിത്തീരുക’ എന്നാണെങ്കിലും, സാർദിസിനോടുള്ള ഉണർവിനായുള്ള ആഹ്വാനം സ്വാഭാവികവും ശക്തവുമായി അറിയിക്കാൻ ‘ഉണരുക’ എന്നു നൽകി.
- source_word: στήρισον
  choice: ശക്തിപ്പെടുത്തുക
  rationale: ശേഷിച്ചവയെ ഉറപ്പിക്കുകയും ബലപ്പെടുത്തുകയും ചെയ്യുക എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: τὰ λοιπὰ
  choice: ശേഷിച്ചവയെ
  rationale: ഗ്രീക്കിൽ നപുംസക ബഹുവചനമായതിനാൽ ശേഷിക്കുന്നത് ആളുകളോ കാര്യങ്ങളോ എന്നത് വ്യക്തമാക്കാതെ ഉറവിടത്തിലെ വ്യാപ്തിയും അവ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: ἃ ἔμελλον ἀποθανεῖν
  choice: മരിക്കാറായിരുന്ന
  rationale: ἔμελλον എന്നത് ആസന്നമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘മരിക്കാറായിരുന്ന’ അതിനെ സംക്ഷിപ്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: πεπληρωμένα
  choice: പൂർത്തിയായതായി
  rationale: പ്രവൃത്തികൾ ദൈവസന്നിധിയിൽ നിറവേറിയതോ സമ്പൂർണമായതോ അല്ലെന്ന പൂർണകാല ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: എന്റെ ദൈവത്തിന്റെ സന്നിധിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിന്റെ മാനദണ്ഡവും ‘എന്റെ ദൈവം’ എന്ന മൂലപാഠത്തിലെ വ്യക്തമായ പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ശേഷിച്ചവ’ എന്നതിന്റെ സൂചന
  choice: ആളുകളെയോ പ്രവൃത്തികളെയോ ആത്മീയ ഗുണങ്ങളെയോ പ്രത്യേകം നിർണ്ണയിക്കാതെ ‘ശേഷിച്ചവ’ എന്നു നിലനിർത്തി.
  alternative: ‘ശേഷിച്ച ആളുകൾ’ അല്ലെങ്കിൽ ‘ശേഷിച്ച കാര്യങ്ങൾ’
  rationale: τὰ λοιπὰ സ്വതവേ വിശാലവും സന്ദർഭപരമായി അവ്യക്തവുമാണ്; വ്യാഖ്യാനത്തിലൂടെ അതിനെ ചുരുക്കരുത്.
- issue: ‘പ്രവൃത്തികൾ പൂർത്തിയായത്’ എന്ന വിലയിരുത്തൽ
  choice: ‘പൂർത്തിയായതായി ഞാൻ കണ്ടിട്ടില്ല’
  alternative: ‘പൂർണതയുള്ളതായി ഞാൻ കണ്ടിട്ടില്ല’
  rationale: πεπληρωμένα പ്രവൃത്തികൾ ആവശ്യമായ നിറവിലോ സമ്പൂർണതയിലോ എത്തിയിട്ടില്ലെന്ന ആശയം നൽകുന്നു; കൃപയും പ്രവൃത്തികളും സംബന്ധിച്ച അധിക സിദ്ധാന്തനിഗമനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കല്പനകളുടെ അടിയന്തരത നിലനിർത്താൻ ഹ്രസ്വവും നേരിട്ടുമായ വാക്യഘടന ഉപയോഗിച്ചു.
