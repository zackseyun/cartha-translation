revisions:
- from: ഇതാ, സാത്താന്റെ സിനഗോഗിൽനിന്ന് ചിലരെ ഞാൻ നിനക്കു തരുന്നു[a]—തങ്ങൾ യെഹൂദന്മാരാണെന്നു പറയുന്നവരായിട്ടും അങ്ങനെയല്ലാതെ കള്ളം പറയുന്നവരെത്തന്നെ. ഇതാ, അവർ വന്ന് നിന്റെ കാൽക്കൽ കുമ്പിടാനും[b], ഞാൻ നിന്നെ സ്നേഹിച്ചിരിക്കുന്നു എന്ന് അവർ അറിയാനും ഞാൻ ഇടയാക്കും.
  to: ഇതാ, സാത്താന്റെ സിനഗോഗിൽനിന്ന് ചിലരെ ഞാൻ നൽകുന്നു[a]—തങ്ങൾ യെഹൂദന്മാരാണെന്ന് പറയുകയും, എന്നാൽ അങ്ങനെയല്ലാതെ കള്ളം പറയുകയും ചെയ്യുന്നവർ. ഇതാ, അവർ വന്ന് നിന്റെ കാൽക്കൽ കുമ്പിടുകയും[b], ഞാൻ നിന്നെ സ്നേഹിച്ചു എന്ന് അറിയുകയും ചെയ്യുമാറ് ഞാൻ അവരെ ഇടയാക്കും.
