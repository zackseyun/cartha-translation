id: REV.3.9
reference: Revelation 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: ml
  text: ഇതാ, സാത്താന്റെ സിനഗോഗിൽനിന്ന് ചിലരെ ഞാൻ നൽകുന്നു[a]—തങ്ങൾ യെഹൂദന്മാരാണെന്ന് പറയുകയും, എന്നാൽ അങ്ങനെയല്ലാതെ കള്ളം പറയുകയും ചെയ്യുന്നവർ. ഇതാ, അവർ വന്ന് നിന്റെ കാൽക്കൽ കുമ്പിടുകയും[b], ഞാൻ നിന്നെ സ്നേഹിച്ചു എന്ന് അറിയുകയും ചെയ്യുമാറ് ഞാൻ അവരെ ഇടയാക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാത്താന്റെ സിനഗോഗിലുള്ളവരെ.’ ഗ്രീക്കിൽ അക്ഷരാർഥമായി, ‘സാത്താന്റെ സിനഗോഗിൽനിന്ന് ഞാൻ നൽകുന്നു’ എന്നാണ്; ആ കൂട്ടത്തിൽനിന്ന് ചിലർ വന്ന് കുമ്പിടേണ്ടിവരും എന്ന അർഥമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വന്ന് നിന്റെ കാൽക്കൽ ആരാധിക്കാൻ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘കുമ്പിടുക’ എന്നും ‘ആരാധിക്കുക’ എന്നും അർഥമാകാം. ഇവിടെ ‘കുമ്പിടുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് വിശ്വാസിക്ക് ദൈവികാരാധന ലഭിക്കുന്നു എന്ന ധാരണ ഒഴിവാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യാക്ഷേപത്തിന്റെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: സാത്താന്റെ സിനഗോഗിൽനിന്ന് ചിലരെ ഞാൻ നിനക്കു തരുന്നു
  rationale: വർത്തമാനകാലമായ διδῶ നിലനിർത്തുകയും ἐκ എന്നതിന്റെ ഭാഗികമായ അർഥം വ്യക്തമാക്കാൻ സന്ദർഭത്തിൽ സൂചിതമായ ‘ചിലരെ’ ചേർക്കുകയും ചെയ്യുന്നു. പരോക്ഷകർമം ഗ്രീക്കിൽ പ്രകടമല്ലെങ്കിലും ഫിലദെൽഫ്യയിലെ ദൂതനോടുള്ള അഭിസംബോധനയും തുടർന്നുള്ള σου/σε രൂപങ്ങളും കണക്കിലെടുത്ത് സ്വാഭാവിക മലയാളത്തിനായി ‘നിനക്കു’ ഉപയോഗിച്ചു.
- source_word: συναγωγῆς
  choice: സിനഗോഗ്
  rationale: ഇവിടെ യെഹൂദസമൂഹത്തെയോ അതിന്റെ കൂടിവരവിനെയോ സൂചിപ്പിക്കുന്ന സന്ദർഭവിശിഷ്ടമായ പദം നിലനിർത്തുന്നു; ‘സഭ’ എന്നത് ക്രൈസ്തവസഭയുമായി കലരാൻ സാധ്യതയുണ്ട്.
- source_word: τοῦ Σατανᾶ
  choice: സാത്താന്റെ
  rationale: വാചകത്തിന്റെ കടുത്ത വിവാദാത്മക പ്രയോഗം മൃദൂകരിക്കാതെയും വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: തങ്ങൾ യെഹൂദന്മാരാണെന്നു പറയുന്നവർ
  rationale: സ്വയം ഉന്നയിക്കുന്ന അവകാശവാദം പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: അങ്ങനെയല്ലാതെ കള്ളം പറയുന്നവർ
  rationale: അവകാശവാദവും അതിന്റെ നിഷേധവും തമ്മിലുള്ള ശക്തമായ വിരോധം നിലനിർത്തുന്നു; അവരുടെ ജാതീയതയെക്കുറിച്ച് വാചകത്തിനപ്പുറം വിശദീകരിക്കുന്നില്ല.
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν καὶ προσκυνήσουσιν
  choice: അവർ വന്ന് ... കുമ്പിടാൻ ഞാൻ ഇടയാക്കും
  rationale: ποιήσω എന്നതിന്റെ കാരകശക്തിയും ἥξουσιν, προσκυνήσουσιν എന്നീ പ്രവർത്തനങ്ങളും വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐνώπιον τῶν ποδῶν σου
  choice: നിന്റെ കാൽക്കൽ
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ പാദങ്ങളുടെ മുമ്പിൽ’ എന്നതിനേക്കാൾ സ്വാഭാവികമായ മലയാളത്തിൽ അതേ കീഴടങ്ങൽഭാവം അറിയിക്കുന്നു.
- source_word: γνῶσιν ὅτι ἐγὼ ἠγάπησά σε
  choice: ഞാൻ നിന്നെ സ്നേഹിച്ചിരിക്കുന്നു എന്ന് അവർ അറിയാൻ
  rationale: ἠγάπησα എന്ന എയോറിസ്റ്റിന്റെ മുൻകാല പ്രവർത്തനവും നിലനിൽക്കുന്ന പ്രസക്തിയും മലയാളത്തിലെ ‘സ്നേഹിച്ചിരിക്കുന്നു’ കൊണ്ട് വ്യക്തമാക്കുന്നു; ἐγώയുടെ ഊന്നൽ ‘ഞാൻ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘തങ്ങൾ യെഹൂദന്മാരാണെന്നു പറയുന്നവരായിട്ടും അങ്ങനെയല്ല’ എന്നതിന്റെ വ്യാപ്തി
  choice: വാചകത്തിലെ വിവാദാത്മകമായ നിയമിത്വനിഷേധം അതേപടി നിലനിർത്തി; അത് ജാതീയ യെഹൂദത്വത്തിന്റെ സമഗ്രനിഷേധമാണെന്ന് വികസിപ്പിച്ചില്ല.
  alternative: ഇത് ആത്മീയ യെഹൂദത്വത്തിന്റെ പുനർനിർവചനമായോ ജാതീയ തിരിച്ചറിയലിന്റെ നേരിട്ടുള്ള നിഷേധമായോ തുറന്ന് പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലവാചകം കടുത്ത ദൈവശാസ്ത്രവിധി പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ അടിസ്ഥാനത്തെ ഈ വാക്യം വിശദീകരിക്കുന്നില്ല; അതിനാൽ സംഘർഷവും അവ്യക്തതയും നിലനിർത്തുന്നു.
- issue: προσκυνήσουσιν എന്ന ക്രിയയുടെ അർഥം
  choice: കുമ്പിടുക
  alternative: ആരാധിക്കുക
  rationale: വിശ്വാസിയുടെ കാൽക്കൽ നടക്കുന്ന പ്രവൃത്തിയായതിനാൽ ‘ആരാധിക്കുക’ ദൈവികാരാധന അവർക്കു ലഭിക്കുന്നു എന്ന അനാവശ്യ ധാരണ സൃഷ്ടിക്കാം. ‘കുമ്പിടുക’ ശരീരഭാവമായ ആദരവും കീഴടങ്ങലും നിലനിർത്തുന്നു.
- issue: ἠγάπησά σε എന്നതിലെ കാലബോധം
  choice: സ്നേഹിച്ചിരിക്കുന്നു
  alternative: സ്നേഹിച്ചു / സ്നേഹിക്കുന്നു
  rationale: എയോറിസ്റ്റിനെ യാന്ത്രികമായി ഒരു ഒറ്റപ്പെട്ട ഭൂതകാലമായി പരിമിതപ്പെടുത്താതെ, മുമ്പ് പ്രകടമായ സ്നേഹത്തിന്റെയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയുടെയും സ്വാഭാവിക മലയാളരൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഇതാ’ എന്ന ബൈബിൾപരിചിതമായെങ്കിലും ഇപ്പോഴും ഗ്രാഹ്യമായ ശ്രദ്ധാകർഷകപ്രയോഗവും, സന്ദർഭവിശിഷ്ടമായ ‘സിനഗോഗ്’ എന്ന പദവും നിലനിർത്തി. വാചകത്തിന്റെ കടുപ്പം മൃദൂകരിച്ചിട്ടില്ല; എന്നാൽ യെഹൂദരെക്കുറിച്ച് മൂലവാചകത്തിനപ്പുറമുള്ള പൊതുവത്കരണം ഒഴിവാക്കി.
