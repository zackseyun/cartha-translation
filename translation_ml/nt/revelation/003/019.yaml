source:
  edition: SBLGNT
  text: ἐγὼ ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω· ⸀ζήλευε οὖν καὶ μετανόησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: ml
  text: ഞാൻ സ്നേഹിക്കുന്നവരെയെല്ലാം[a] ശാസിക്കുകയും ശിക്ഷണം നൽകുകയും[b] ചെയ്യുന്നു. അതുകൊണ്ട് തീക്ഷ്ണമായ ഉത്സാഹം കാണിക്കുക[c]; മാനസാന്തരപ്പെടുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞാൻ ആരെയൊക്കെ സ്നേഹിക്കുന്നുവോ, അവരെയൊക്കെ.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ശിക്ഷണം നൽകുക” എന്നത് വെറും ശിക്ഷയല്ല; തെറ്റ് തിരുത്തി പരിശീലിപ്പിക്കുകയും രൂപപ്പെടുത്തുകയും ചെയ്യുന്നതും ഉൾക്കൊള്ളുന്നു.
    reason: cultural_note
  - marker: c
    text: അല്ലെങ്കിൽ, “ആത്മാർഥത കാണിക്കുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിൽ സർവനാമം ഊന്നലുള്ളതാണ്. മലയാളത്തിൽ ക്രിയാരൂപത്തോടൊപ്പം ‘ഞാൻ’ വ്യക്തമായി ചേർക്കുന്നത് ആ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὅσους ἐὰν
  choice: സ്നേഹിക്കുന്നവരെയെല്ലാം
  rationale: ഈ അനിശ്ചിത ആപേക്ഷിക പ്രയോഗം ‘ആരെയൊക്കെ / എല്ലാവരെയും’ എന്ന വ്യാപ്തി നൽകുന്നു; ‘-വരെയെല്ലാം’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: φιλῶ
  choice: സ്നേഹിക്കുന്ന
  rationale: φιλέω ഇവിടെ യഥാർഥ സ്നേഹത്തെയും അടുപ്പത്തെയും സൂചിപ്പിക്കുന്നു. ‘സ്നേഹിക്കുക’ അതിന്റെ ബന്ധപരമായ ശക്തി കുറയ്ക്കാതെ നൽകുന്നു.
- source_word: ἐλέγχω
  choice: ശാസിക്കുന്നു
  rationale: ധാർമികമായ മാറ്റം ലക്ഷ്യമാക്കിയുള്ള കുറ്റബോധപ്പെടുത്തലും തിരുത്തലുമാണ് സന്ദർഭത്തിലെ അർഥം; ആധുനിക മലയാളത്തിൽ ‘ശാസിക്കുക’ അത് സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: παιδεύω
  choice: ശിക്ഷണം നൽകുന്നു
  rationale: ഈ പദത്തിൽ തിരുത്തലോടുകൂടിയ പരിശീലനവും രൂപപ്പെടുത്തലുമുണ്ട്; വെറും ശിക്ഷ എന്ന അർഥത്തിലേക്ക് ചുരുക്കാതെ ‘ശിക്ഷണം നൽകുക’ ഈ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ζήλευε
  choice: തീക്ഷ്ണത കാണിക്കുക
  rationale: തുടർച്ചയായ ആവേശപൂർണമായ ആത്മാർഥതയ്ക്കുള്ള ഏകവചന കല്പനയാണിത്. ‘തീക്ഷ്ണത കാണിക്കുക’ അതിന്റെ ശക്തി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ കല്പനയാകുകയും ചെയ്യുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള സ്നേഹപൂർവമായ തിരുത്തലിൽനിന്ന് തുടർന്നുള്ള പ്രതികരണത്തിലേക്കുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: μετανόησον
  choice: മാനസാന്തരപ്പെടുക
  rationale: ധാർമികവും ആത്മീയവുമായ പശ്ചാത്തലത്തിൽ ചിന്തയും വഴിയും മാറ്റി തിരിയുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും കൃത്യവുമായ മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: ദൈവിക തിരുത്തലുമായി ബന്ധപ്പെട്ട φιλῶ എന്ന സ്നേഹപദത്തിന്റെ സ്വഭാവം
  choice: ‘സ്നേഹിക്കുന്നു’ എന്ന് പൂർണ അർഥത്തിൽ പരിഭാഷപ്പെടുത്തി
  alternative: ‘വാത്സല്യം തോന്നുന്നു’ / ‘ഇഷ്ടപ്പെടുന്നു’
  rationale: ശാസനത്തിന്റെയും ശിക്ഷണത്തിന്റെയും അടിസ്ഥാനം യഥാർഥ സ്നേഹമാണെന്ന് വാക്യം പറയുന്നു. പദത്തെ ദുർബലപ്പെടുത്താതെയും φιλέω–ἀγαπάω വ്യത്യാസത്തെ സാങ്കേതിക ദൈവശാസ്ത്രമായി ഇറക്കുമതി ചെയ്യാതെയും ‘സ്നേഹിക്കുന്നു’ ഈ ശക്തി നിലനിർത്തുന്നു.
- issue: παιδεύω എന്നതിന്റെ തിരുത്തലും രൂപപ്പെടുത്തലും ഉൾക്കൊള്ളുന്ന അർഥം
  choice: ‘ശിക്ഷണം നൽകുന്നു’
  alternative: ‘ശിക്ഷിക്കുന്നു’ / ‘പരിശീലിപ്പിക്കുന്നു’
  rationale: പദം വെറും ദണ്ഡനത്തേക്കാൾ വിശാലമായി തിരുത്തുകയും വളർത്തുകയും ചെയ്യുന്ന പ്രവർത്തിയെ ഉൾക്കൊള്ളുന്നു. തിരുത്തലിന്റെ കാഠിന്യവും രൂപപ്പെടുത്തുന്ന ലക്ഷ്യവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഏകവചന കല്പനകൾ ലിംഗസൂചനയില്ലാത്ത സ്വാഭാവിക രൂപത്തിൽ നൽകിയിരിക്കുന്നു; ഗ്രീക്കിലെ ἐγώ എന്ന ഊന്നൽ ‘ഞാൻ’ വ്യക്തമായി ചേർത്ത് നിലനിർത്തി.
