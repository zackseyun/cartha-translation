id: REV.3.3
reference: Revelation 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: ml
  text: അതുകൊണ്ട്, നീ എങ്ങനെ സ്വീകരിക്കുകയും കേൾക്കുകയും ചെയ്തുവെന്ന് ഓർക്കുക[a]; അതു പാലിക്കുക, മാനസാന്തരപ്പെടുക. അതിനാൽ നീ ജാഗരിച്ചിരിക്കാതിരുന്നാൽ, ഞാൻ കള്ളനെപ്പോലെ വരും[b][c]; ഏതു മണിക്കൂറിലാണ് ഞാൻ നിന്റെമേൽ വരുന്നതെന്ന് നീ തീർച്ചയായും അറിയുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നീ സ്വീകരിക്കുകയും കേൾക്കുകയും ചെയ്തത് ഓർക്കുക.’ ഗ്രീക്കിൽ ‘എങ്ങനെ’ എന്നാണ്; അത് അവർ സ്വീകരിച്ച രീതിക്ക് ഊന്നൽ നൽകാം, എങ്കിലും ചിലർ അതിനെ സന്ദേശത്തെയാണു സൂചിപ്പിക്കുന്നതെന്ന് മനസ്സിലാക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: ‘ജാഗരിച്ചിരിക്കുക’ എന്നത് ‘ജാഗ്രതയോടെ ഇരിക്കുക’ അല്ലെങ്കിൽ ‘കാവലിരിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘ഞാൻ കള്ളനെപ്പോലെ വരും’ എന്ന മുന്നറിയിപ്പ് പെട്ടെന്നുള്ള, അപ്രതീക്ഷിതമായ സന്ദർശനത്തെക്കുറിച്ച് മറ്റിടങ്ങളിൽ ഉപയോഗിക്കുന്ന ഭാഷയെ പ്രതിധ്വനിപ്പിക്കുന്നു. ഇത് അന്തിമ ന്യായവിധിയെയാണോ അതോ കൂടുതൽ അടുത്തകാലത്തുള്ള ശിക്ഷണനടപടിയെയാണോ സൂചിപ്പ Jennings
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: ഓർക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ ഓർമപ്പെടുത്തൽ എന്ന ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട് / അതിനാൽ
  rationale: മുൻപുള്ള ശാസനയിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി രണ്ട് സന്ദർഭങ്ങളിലും അനുയോജ്യമായ രൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: സ്വീകരിക്കുകയും കേൾക്കുകയും ചെയ്ത രീതിയെയോ വിധത്തെയോ നേരിട്ട് സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് അവ്യയം; സന്ദേശത്തിന്റെ ഉള്ളടക്കമായി മാത്രം ചുരുക്കുന്നില്ല.
- source_word: εἴληφας
  choice: സ്വീകരിക്കുകയും ചെയ്തുവെന്ന്
  rationale: ഭൂതകാലത്തിലെ സ്വീകരണം ഇപ്പോഴും പ്രസക്തമാണെന്ന perfect രൂപത്തിന്റെ ഭാവം സന്ദർഭത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἤκουσας
  choice: കേൾക്കുകയും ചെയ്തുവെന്ന്
  rationale: മുമ്പ് നടന്ന കേൾവിയെ ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: τήρει
  choice: അതു കാത്തുകൊള്ളുക
  rationale: τηρέω എന്നതിലെ പാലിക്കുക, സൂക്ഷിക്കുക, മുറുകെപ്പിടിക്കുക എന്നീ അർഥസാധ്യതകൾ പൂർണമായി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു; ‘അതു’ മുമ്പ് സ്വീകരിച്ചു കേട്ടതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: μετανόησον
  choice: മാനസാന്തരപ്പെടുക
  rationale: പാപത്തിൽനിന്നുള്ള മനസ്സുമാറ്റവും തിരിഞ്ഞുവരവും സൂചിപ്പിക്കുന്ന, പുതിയനിയമസന്ദർഭത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: γρηγορήσῃς
  choice: ഉണർന്നിരിക്കാതിരുന്നാൽ
  rationale: ജാഗ്രതയുടെ രൂപകം നിലനിർത്തുകയും പിന്നാലെയുള്ള കള്ളന്റെ ദൃശ്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἥξω ὡς κλέπτης
  choice: ഞാൻ കള്ളനെപ്പോലെ വരും
  rationale: അപ്രതീക്ഷിതമായ വരവിന്റെ ഉപമ നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: οὐ μὴ γνῷς
  choice: നീ ഒരിക്കലും അറിയുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധത്തെ മലയാളത്തിൽ ഊന്നലോടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: ποίαν ὥραν
  choice: ഏതു മണിക്കൂറിലാണ്
  rationale: പൊതുവായ ‘സമയം’ എന്നതിലേക്കു മയപ്പെടുത്താതെ ഗ്രീക്കിലെ ‘മണിക്കൂർ’ എന്ന പ്രത്യേക പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐπὶ σέ
  choice: നിന്റെമേൽ
  rationale: അഭിസംബോധിതന്റെ നേരെയുള്ള വരവ്/സന്ദർശനം/ന്യായവിധി എന്ന തുറന്ന ഭാവം നിലനിർത്തുന്നു; ‘നിനക്കു വിരോധമായി’ എന്ന് വ്യാഖ്യാനപരമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: πῶς εἴληφας καὶ ἤκουσας എന്ന പ്രബോധനത്തിന്റെ സ്വഭാവം
  choice: ‘നീ എങ്ങനെ സ്വീകരിക്കുകയും കേൾക്കുകയും ചെയ്തുവെന്ന് ഓർക്കുക’ എന്ന് നൽകി.
  alternative: ‘നീ സ്വീകരിക്കുകയും കേൾക്കുകയും ചെയ്തത് ഓർക്കുക.’
  rationale: ഗ്രീക്കിൽ πῶς (‘എങ്ങനെ’) ഉള്ളതിനാൽ സ്വീകരണത്തിന്റെയും കേൾവിയുടെയും രീതിയാണ് നേരിട്ട് മുൻനിൽക്കുന്നത്. സന്ദേശത്തിന്റെ ഉള്ളടക്കത്തെ ഓർക്കുക എന്ന വ്യാഖ്യാനം സാധ്യമെങ്കിലും, മുഖ്യവാചകം മൂലത്തിലെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- issue: ‘ഞാൻ കള്ളനെപ്പോലെ വരും’ എന്ന മുന്നറിയിപ്പിന്റെ പരിധി
  choice: അപ്രതീക്ഷിതമായ വരവെന്ന നിലയിൽ മാത്രം വിവർത്തനം ചെയ്തു; അതിന്റെ കൃത്യമായ സ്വഭാവം നിർവചിച്ചില്ല.
  alternative: അന്ത്യവരവെന്നോ പ്രാദേശിക ന്യായവിധി/ശിക്ഷണസന്ദർശനമെന്നോ വ്യക്തമായി നിർവചിക്കുക.
  rationale: ഈ വാക്യം തന്നെ അത് അന്തിമ ന്യായവിധിയാണോ ഉടനെയുള്ള ശിക്ഷണനടപടിയാണോ എന്ന് തീരുമാനിക്കുന്നില്ല. അതിനാൽ ഉപമയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘മാനസാന്തരപ്പെടുക’, ‘കാത്തുകൊള്ളുക’, ‘നിന്റെമേൽ’ എന്നീ രൂപങ്ങൾ വെളിപ്പാട് ഗ്രന്ഥത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാവിഭാഗ-വിശിഷ്ട വ്യാഖ്യാനം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
