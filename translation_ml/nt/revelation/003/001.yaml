id: REV.3.1
reference: Revelation 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: ml
  text: '“സർദിസിലുള്ള സഭയുടെ ദൂതന്[a] എഴുതുക: ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കളും[b] ഏഴ് നക്ഷത്രങ്ങളും ഉള്ളവൻ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: നിന്റെ പ്രവൃത്തികൾ എനിക്കറിയാം. ജീവിച്ചിരിക്കുന്നു എന്നു നിനക്കൊരു പേരുണ്ട്[c]; എന്നാൽ നീ മരിച്ചവനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൂതൻ’ എന്നതിന് ‘സന്ദേശവാഹകൻ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദമായ ἄγγελος രണ്ടും സൂചിപ്പിക്കാം; വെളിപ്പാടിന്റെ ദർശനാത്മക പശ്ചാത്തലത്തിൽ ‘ദൂതൻ’ കൂടുതൽ സ്വാഭാവികമാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കൾ’ എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ നിലനിർത്തിയിരിക്കുന്നു. ഇത് പരിശുദ്ധാത്മാവിന്റെ പൂർണതയെ പ്രതീകാത്മകമായി സൂചിപ്പിക്കാം; ചിലർ ഇതിനെ ഏഴ് സ്വർഗീയ ആത്മാക്കളായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘നീ ജീവിക്കുന്നു എന്നു നിനക്കൊരു പേരുണ്ട്.’ ഇവിടെ ‘പേര്’ എന്നത് പ്രശസ്തിയെയോ പൊതുധാരണയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ദൂതന്
  rationale: ദൂതൻ എന്നത് സ്വർഗീയ ദൂതനെയും സന്ദേശവാഹകനെയും സൂചിപ്പിക്കാവുന്നതിനാൽ ഗ്രീക്കിലെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു; വെളിപ്പാടിന്റെ ദർശനാത്മക പശ്ചാത്തലത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്.
- source_word: ἐκκλησίας
  choice: സഭയുടെ
  rationale: സർദിസിലെ ക്രിസ്തീയ സമൂഹത്തെ സൂചിപ്പിക്കുന്നതിന് ആധുനിക മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ പദം.
- source_word: Τάδε λέγει
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകീയ പ്രഖ്യാപനത്തിന്റെ ഗൗരവം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു; ഗ്രീക്കിലെ സൂത്രവാക്യത്തിന്റെ പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: ὁ ἔχων
  choice: ഉള്ളവൻ
  rationale: വർത്തമാനകൃതന്തത്തിന്റെ അർത്ഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം വ്യാഖ്യാനപരമായി ഏകവചനമാക്കാതെ അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: ഏഴ് നക്ഷത്രങ്ങൾ
  rationale: പ്രതീകത്തിന്റെ വ്യാഖ്യാനം ഈ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ നേരിട്ടുള്ള വിവർത്തനം നൽകുന്നു.
- source_word: Οἶδά σου τὰ ἔργα
  choice: നിന്റെ പ്രവൃത്തികൾ എനിക്കറിയാം
  rationale: വെളിപ്പാടിലെ ആവർത്തിത വിലയിരുത്തൽ സൂത്രം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: ജീവിച്ചിരിക്കുന്നു എന്നു നിനക്കൊരു പേരുണ്ട്
  rationale: ὄνομα എന്ന ‘പേര്’ രൂപകം നിലനിർത്തുകയും അത് പ്രശസ്തി അഥവാ പൊതുധാരണയെ സൂചിപ്പിക്കുന്നതായി വായിക്കാനാകുന്ന വിധം മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: νεκρὸς εἶ
  choice: നീ മരിച്ചവനാണ്
  rationale: ആത്മീയ വിധിയുടെ കാഠിന്യം മയപ്പെടുത്താതെ നേരിട്ട് പകർത്തുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കൾ’ എന്നതിന്റെ അർത്ഥം
  choice: ബഹുവചനത്തിലുള്ള അക്ഷരാർഥ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: പരിശുദ്ധാത്മാവിന്റെ പൂർണതയെ സൂചിപ്പിക്കുന്ന ‘ദൈവത്തിന്റെ ഏഴുവിധ ആത്മാവ്’ എന്ന വ്യാഖ്യാനപരമായ രൂപം; അല്ലെങ്കിൽ ദൈവസന്നിധിയിലെ ഏഴ് സ്വർഗീയ ആത്മാക്കൾ.
  rationale: ഗ്രീക്ക് പാഠം ബഹുവചനത്തിലാണ്; പ്രതീകത്തിന്റെ വിവാദമായ തിരിച്ചറിയൽ വിവർത്തനം തന്നെ തീരുമാനിക്കരുത്.
- issue: സഭയുടെ ἄγγελος ആരാണ്
  choice: ‘ദൂതൻ’ എന്ന് വിവർത്തനം ചെയ്തു.
  alternative: ‘സന്ദേശവാഹകൻ’ അല്ലെങ്കിൽ സഭയുടെ മനുഷ്യപ്രതിനിധി.
  rationale: ‘ദൂതൻ’ എന്ന മലയാളപദം മൂലത്തിലെ അർത്ഥവ്യാപ്തി താരതമ്യേന നന്നായി കാത്തുസൂക്ഷിക്കുകയും വെളിപ്പാടിന്റെ അപോകലിപ്റ്റിക് പശ്ചാത്തലത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- issue: ‘ജീവിച്ചിരിക്കുന്നു എന്നു നിനക്കൊരു പേരുണ്ട്’ എന്ന പ്രയോഗം
  choice: ‘പേര്’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
  alternative: ‘ജീവിച്ചിരിക്കുന്നു എന്ന പ്രശസ്തി നിനക്കുണ്ട്’ എന്ന കൂടുതൽ വ്യാഖ്യാനപരമായ വിവർത്തനം.
  rationale: പൊതുധാരണ എന്ന അർത്ഥം വ്യക്തമാകുന്നുവെങ്കിലും, ὄνομα എന്ന മൂലരൂപത്തിന്റെ ചിത്രഭാഷ നഷ്ടപ്പെടുത്താതിരിക്കാൻ കൂടുതൽ ഔപചാരികമായ രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രവാചകീയ പ്രഖ്യാപനത്തിന് ‘അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചെങ്കിലും വാക്യത്തിന്റെ ശേഷിഭാഗം അമിതമായി പുരാതനമാക്കിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിന് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
