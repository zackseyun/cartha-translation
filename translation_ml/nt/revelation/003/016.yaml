id: REV.3.16
reference: Revelation 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: ml
  text: അതിനാൽ, നീ ചൂടുമല്ല തണുപ്പുമല്ല, ഇളംചൂടുള്ളവനായതുകൊണ്ട്, ഞാൻ നിന്നെ എന്റെ വായിൽനിന്ന് ഛർദ്ദിച്ചുകളയാനിരിക്കുകയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ വായിൽനിന്ന് തുപ്പിക്കളയാനിരിക്കുകയാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഗ്രീക്ക് ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥം ‘ഛർദ്ദിക്കുക’ എന്നാണ്; അത് ‘തുപ്പുക’ എന്നതിനെക്കാൾ ശക്തമായ ദൃശ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: അതിനാൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിൽനിന്ന് ഉണ്ടാകുന്ന പരിണതഫലം അവതരിപ്പിക്കുന്ന അനുമാനാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅτι
  choice: ആയതുകൊണ്ട്
  rationale: പ്രഖ്യാപിക്കപ്പെടുന്ന ന്യായവിധിയുടെ കാരണം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധകത്തിന്റെ കാരണാർഥം നിലനിർത്തുന്നു.
- source_word: χλιαρός
  choice: ഇളംചൂടുള്ളവൻ
  rationale: ചൂടിനും തണുപ്പിനും ഇടയിലുള്ള താപനിലയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ തുല്യപ്രയോഗം.
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: ചൂടുമല്ല തണുപ്പുമല്ല
  rationale: ഗ്രീക്കിലെ സമമിതമായ നിഷേധജോടിയും താപനിലയുടെ വൈരുധ്യവും വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: μέλλω
  choice: അിരിക്കുകയാണ്
  rationale: തുടർന്നുവരുന്ന പ്രവൃത്തി ആസന്നമാണെന്ന ഗ്രീക്ക് ക്രിയയുടെ ഭാവം ‘ഛർദ്ദിച്ചുകളയാനിരിക്കുകയാണ്’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐμέσαι
  choice: ഛർദ്ദിച്ചുകളയുക
  rationale: ഗ്രീക്ക് ക്രിയയുടെ ശക്തവും ഞെട്ടിക്കുന്നതുമായ ദൃശ്യബിംബം മയപ്പെടുത്താതെ നേരിട്ട് നിലനിർത്തുന്നു; ‘തുപ്പിക്കളയുക’ എന്നത് ഇതിന്റെ തീവ്രത കുറയ്ക്കും.
- source_word: ἐκ τοῦ στόματός μου
  choice: എന്റെ വായിൽനിന്ന്
  rationale: പുറത്തേക്കുള്ള നീക്കവും വ്യക്തമായ ശാരീരിക ദൃശ്യബിംബവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐμέσαι എന്ന പദത്തിലെ ന്യായവിധിദൃശ്യത്തിന്റെ തീവ്രത
  choice: ‘ഛർദ്ദിച്ചുകളയുക’ എന്ന ശക്തമായ ദൃശ്യബിംബം നിലനിർത്തി.
  alternative: ‘തുപ്പിക്കളയുക’ അല്ലെങ്കിൽ ‘പുറന്തള്ളുക’.
  rationale: വാക്യത്തിലെ മുന്നറിയിപ്പ് ഉദ്ദേശപൂർവം ഞെട്ടിക്കുന്നതാണ്. പദം മയപ്പെടുത്തുന്നത് ദൈവിക നിരാകരണത്തിന്റെ വാചാടോപപരവും ദൈവശാസ്ത്രപരവുമായ ശക്തി കുറയ്ക്കും.
- issue: μέλλω എന്ന ക്രിയയുടെ കാലസൂചന
  choice: ‘ഛർദ്ദിച്ചുകളയാനിരിക്കുകയാണ്’ എന്ന് ആസന്നത സൂചിപ്പിച്ചു.
  alternative: ‘ഛർദ്ദിച്ചുകളയും’ അല്ലെങ്കിൽ ‘ഛർദ്ദിച്ചുകളയാൻ പോകുന്നു’.
  rationale: ഗ്രീക്ക് രൂപം വെറും പൊതുവായ ഭാവികാലത്തേക്കാൾ ആസന്നമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ മുന്നറിയിപ്പിന്റെ അടിയന്തരത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ചൂടുമല്ല തണുപ്പുമല്ല’ എന്ന സമാന്തരഘടന മൂലത്തിലെ വൈരുധ്യം നിലനിർത്തുന്നു; ‘ഛർദ്ദിച്ചുകളയുക’ എന്ന നേരിട്ടുള്ള പദം അസ്വസ്ഥമാക്കുന്ന മൂലദൃശ്യത്തെ മനപ്പൂർവം മയപ്പെടുത്തുന്നില്ല.
