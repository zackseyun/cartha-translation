id: REV.3.5
reference: Revelation 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: ml
  text: ജയിക്കുന്നവൻ[a] ഇപ്രകാരം വെളുത്ത വസ്ത്രങ്ങൾ അണിഞ്ഞവനായിരിക്കും. അവന്റെ പേര് ജീവന്റെ പുസ്തകത്തിൽനിന്ന്[c] ഞാൻ ഒരിക്കലും മായിച്ചുകളയുകയില്ല[b]. എന്റെ പിതാവിന്റെ മുമ്പിലും അവിടുത്തെ ദൂതന്മാരുടെ മുമ്പിലും ഞാൻ അവന്റെ പേര് ഏറ്റുപറയും[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിജയിക്കുന്നവൻ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവന്റെ പേര് ജീവന്റെ പുസ്തകത്തിൽനിന്ന് ഞാൻ നിശ്ചയമായും മായിച്ചുകളയുകയില്ല.’ ഗ്രീക്കിൽ ഊന്നിയ നിഷേധമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, ദൈവത്തിനുള്ളവരായി ജീവൻ അവകാശമാക്കുന്നവരുടെ സ്വർഗീയ രേഖ.
    reason: cultural_note
  - marker: d
    text: അഥവാ, ‘ഞാൻ അവന്റെ പേര് അംഗീകരിച്ചു പ്രഖ്യാപിക്കും.’ മത്തായി 10:32 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ νικῶν
  choice: ജയിക്കുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു; ‘ജയിക്കുന്നവൻ’ എന്നത് തുടരുന്ന സ്വഭാവത്തെയും വെളിപ്പാടിലെ വിജയപ്രമേയത്തെയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὕτως
  choice: ഇപ്രകാരം
  rationale: മുൻസന്ദർഭത്തിലെ വാഗ്ദാനവുമായി ഉള്ള ബന്ധം വ്യക്തമാക്കുന്ന ബന്ധകശക്തി ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: περιβαλεῖται ἐν ἱματίοις λευκοῖς
  choice: വെള്ളവസ്ത്രങ്ങൾ അണിഞ്ഞവനാകും
  rationale: മധ്യ/കർമണിരൂപത്തിന്റെ ഫലാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ആരാണ് അണിയിക്കുന്നത് എന്ന് ചേർക്കാതെ വാഗ്ദാനത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു. ἱμάτια എന്ന പൊതുവായ പദത്തെ കൂടുതൽ സവിശേഷമായ ‘അങ്കി’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: οὐ μὴ ἐξαλείψω
  choice: ഞാൻ ഒരിക്കലും മായിച്ചുകളയുകയില്ല
  rationale: οὐ μή സഹിതമുള്ള ഭാവികാലക്രിയയുടെ ഊന്നിയ നിഷേധം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; പുസ്തകത്തിലെ പേര് നീക്കുന്നതെന്ന രൂപകത്തിന് ‘മായിച്ചുകളയുക’ യോജിക്കുന്നു.
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: ജീവന്റെ പുസ്തകത്തിൽനിന്ന്
  rationale: βίβλος പുസ്തകമോ ചുരുളോ സൂചിപ്പിക്കാമെങ്കിലും ‘ജീവന്റെ പുസ്തകം’ സ്ഥാപിതവും വ്യക്തവുമായ ബൈബിൾപ്രയോഗമാണ്.
- source_word: ὁμολογήσω τὸ ὄνομα αὐτοῦ
  choice: ഞാൻ അവന്റെ പേര് ഏറ്റുപറയും
  rationale: ὁμολογέω എന്നതിലെ പരസ്യമായി അംഗീകരിച്ചു പ്രഖ്യാപിക്കുന്ന അർഥം ‘ഏറ്റുപറയും’ നിലനിർത്തുന്നു; വെറും സ്വകാര്യ സമ്മതമായി ചുരുക്കുന്നില്ല.
- source_word: ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ
  choice: എന്റെ പിതാവിന്റെ മുമ്പിലും അവിടുത്തെ ദൂതന്മാരുടെ മുമ്പിലും
  rationale: ἐνώπιον എന്നതിന്റെ രണ്ടു ആവർത്തനങ്ങളും നിലനിർത്തുന്നു. αὐτοῦ ഉടൻ മുമ്പുള്ള ‘എന്റെ പിതാവ്’ എന്നതിലേക്കാണ് സ്വാഭാവികമായി ചൂണ്ടുന്നത്; മാന്യമായ മലയാളത്തിൽ അത് ‘അവിടുത്തെ’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ജീവന്റെ പുസ്തകത്തിൽനിന്ന് പേര് മായിക്കുകയില്ല എന്ന വാഗ്ദാനം സ്ഥിരതയെയും വിശ്വാസത്യാഗത്തെയും കുറിച്ചുള്ള തർക്കങ്ങളിൽ എന്ത് സൂചിപ്പിക്കുന്നു
  choice: ജയിക്കുന്നവനോടുള്ള ഉറപ്പിന്റെ വാഗ്ദാനമായി പ്രസ്താവന നേരിട്ട് വിവർത്തനം ചെയ്തു; അന്തിമമായി വീഴ്ച സംഭവിക്കുമോ ഇല്ലയോ എന്ന സിദ്ധാന്തനിഗമനം ചേർത്തിട്ടില്ല.
  alternative: ഇത് വിശുദ്ധന്മാരുടെ സ്ഥിരതയുടെ ഉറപ്പോ, രക്ഷ നഷ്ടപ്പെടാമെന്ന മുന്നറിയിപ്പോ ആയി വ്യാഖ്യാനിക്കാം.
  rationale: വാക്യം ശക്തമായ നിഷേധത്തോടെ ഒരു വാഗ്ദാനം നൽകുന്നു; എന്നാൽ വിപുലമായ സിദ്ധാന്തവിവാദം ഈ വാക്യം മാത്രം നിർവിവാദമായി തീർപ്പാക്കുന്നില്ല.
- issue: ഏകവചന പുല്ലിംഗരൂപത്തിന്റെ ലിംഗപ്രതിനിധാനം
  choice: ‘ജയിക്കുന്നവൻ’, ‘അവന്റെ പേര്’ എന്ന ഏകവചന പുല്ലിംഗ വ്യാകരണരൂപം നിലനിർത്തി.
  alternative: ലിംഗനിരപേക്ഷമായ ബഹുവചനരൂപം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ ഏകവചന പുല്ലിംഗ പ്രതിനിധിരൂപം സംരക്ഷിക്കുമ്പോഴും അത് പൊതുവായി ജയിക്കുന്ന ഏവരെയും സൂചിപ്പിക്കുന്നതിൽ തടസ്സമില്ല.
- issue: περιβαλεῖται എന്ന മധ്യ/കർമണിരൂപത്തിലെ പ്രവർത്തകന്റെ അനിശ്ചിതത്വം
  choice: ‘അണിഞ്ഞവനാകും’ എന്ന ഫലാവസ്ഥാപ്രയോഗം ഉപയോഗിച്ചു.
  alternative: ‘അണിയിക്കപ്പെടും’ അല്ലെങ്കിൽ ‘സ്വയം അണിയും’.
  rationale: ദൈവിക കർമണി എന്ന വ്യാഖ്യാനമോ സ്വയം വസ്ത്രം ധരിക്കുന്നു എന്ന വ്യാഖ്യാനമോ നിർബന്ധിക്കാതെ മൂലരൂപത്തിന്റെ സ്വാഭാവിക അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. അപ്പോക്കലിപ്റ്റിക് ദൃശ്യഭാഷ നിലനിർത്തിയെങ്കിലും അനാവശ്യമായി പുരാതനമോ സഭാവിഭാഗസവിശേഷമോ ആയ പദങ്ങൾ ഒഴിവാക്കി. ചെറുവാക്യവിഭജനം വായനാസൗകര്യം വർധിപ്പിക്കുന്നു; മൂലത്തിലെ മൂന്ന് വാഗ്ദാനഘടകങ്ങളുടെ ക്രമം മാറ്റിയിട്ടില്ല.
