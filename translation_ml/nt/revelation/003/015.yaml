id: REV.3.15
reference: Revelation 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: ml
  text: 'നിന്റെ പ്രവൃത്തികൾ എനിക്ക് അറിയാം: നീ തണുത്തവനുമല്ല, ചൂടുള്ളവനുമല്ല. നീ തണുത്തവനോ ചൂടുള്ളവനോ ആയിരുന്നെങ്കിൽ എത്ര നന്നായിരുന്നു![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീ തണുത്തവനോ ചൂടുള്ളവനോ ആയിരുന്നെങ്കിൽ!’
    reason: ὄφελον പ്രകടിപ്പിക്കുന്ന ശക്തമായ അഭിലാഷം മലയാളത്തിൽ നേരിട്ടുള്ള ‘എങ്കിൽ!’ രൂപത്തിൽ നൽകാവുന്നതാണ്.
lexical_decisions:
- source_word: Οἶδά
  choice: എനിക്ക് അറിയാം
  rationale: οἶδα ഇവിടെ വർത്തമാനകാലത്തെ നിലസൂചക അർഥത്തിലാണ്; ‘എനിക്ക് അറിയാം’ എന്നത് നേരിട്ടുള്ള വിലയിരുത്തൽഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὰ ἔργα
  choice: നിന്റെ പ്രവൃത്തികൾ
  rationale: വെളിപ്പാടുപുസ്തകത്തിലെ ആവർത്തിതമായ വിലയിരുത്തൽപ്രയോഗവുമായി പദബന്ധം നിലനിർത്തുകയും ധാർമിക ഗൗരവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ψυχρὸς
  choice: തണുത്തവൻ
  rationale: അടിസ്ഥാന താപനിലാരൂപകം വ്യാഖ്യാനിക്കാതെ അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; ζεστός എന്നതുമായുള്ള വൈരുധ്യവും വ്യക്തമാണ്.
- source_word: ζεστός
  choice: ചൂടുള്ളവൻ
  rationale: താപനിലയെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘തീക്ഷ്ണൻ’ അല്ലെങ്കിൽ ‘ആത്മീയമായി ഉത്സാഹമുള്ളവൻ’ എന്ന വ്യാഖ്യാനം വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ὄφελον
  choice: ആയിരുന്നെങ്കിൽ നന്നായിരുന്നു
  rationale: നിലവിലെ യാഥാർഥ്യത്തിന് വിരുദ്ധമായ ശക്തമായ അഭിലാഷം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἢ
  choice: ഓ
  rationale: ψυχρός, ζεστός എന്നീ രണ്ട് സാധ്യതകൾക്കിടയിലെ ലളിതമായ വികല്പബന്ധം മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: ‘തണുപ്പ്’, ‘ചൂട്’ എന്നീ താപനിലാരൂപകങ്ങളുടെ അർഥം
  choice: രൂപകത്തെ വിശദീകരിക്കാതെ ‘തണുത്തവൻ’, ‘ചൂടുള്ളവൻ’ എന്ന അക്ഷരാർഥ പദങ്ങൾ മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
  alternative: ‘തണുത്തവൻ’ ആത്മീയമായി നിർവികാരൻ/അവിശ്വാസി എന്നും ‘ചൂടുള്ളവൻ’ ആത്മീയമായി തീക്ഷ്ണൻ എന്നും വ്യാഖ്യാനിക്കുക; അല്ലെങ്കിൽ തണുപ്പും ചൂടും വ്യത്യസ്ത രീതികളിൽ പ്രയോജനകരമാണെന്ന് വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം രൂപകത്തെ വ്യക്തമായി വ്യാഖ്യാനിക്കുന്നില്ല. അതിനാൽ ഏതെങ്കിലും പ്രത്യേക ആത്മീയമോ ചരിത്രപരമോ ആയ വിശദീകരണം പരിഭാഷയിൽ ചേർക്കാതെ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അവ്യക്തതയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള അഭിസംബോധന. മൂലത്തിലെ താപനിലാരൂപകം വിശദീകരിക്കാതെ നിലനിർത്തി; ‘ആയിരുന്നെങ്കിൽ നന്നായിരുന്നു’ എന്ന പ്രയോഗം ὄφελον സൂചിപ്പിക്കുന്ന ശക്തമായ, യാഥാർഥ്യവിരുദ്ധമായ അഭിലാഷം സ്വാഭാവികമായി നൽകുന്നു.
