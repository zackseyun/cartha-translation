  yaml_path: translation/nt/revelation/003/022.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: ml
  text: കേൾക്കാൻ ചെവിയുള്ളവൻ, ആത്മാവ് സഭകളോട് പറയുന്നത് കേൾക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ആത്മാവ്’ എന്നു പറയുന്നത് പരിശുദ്ധാത്മാവിനെയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: കേൾക്കാൻ ചെവിയുള്ളവൻ
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ‘ചെവിയുള്ളവൻ’ എന്ന പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ ആശയമായ ശ്രദ്ധിച്ചു കേൾക്കാനുള്ള സന്നദ്ധത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀκουσάτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാം പുരുഷ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ ആഹ്വാനശക്തി സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പകരുന്നു.
- source_word: τί
  choice: പറയുന്നത്
  rationale: ‘എന്ത്’ എന്ന ഉള്ളടക്കബന്ധം മലയാളത്തിലെ പരോക്ഷവാക്യഘടനയിൽ സ്വാഭാവികമായി ‘പറയുന്നത്’ എന്നു പ്രകടമാകുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: വെളിപ്പാട് 2–3-ലെ ആവർത്തിത സൂത്രവാക്യത്തിൽ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ‘ആത്മാവ്’ ഈ പരാമർശം യോജിച്ചവിധം നൽകുന്നു.
- source_word: λέγει
  choice: പറയുന്നത്
  rationale: വർത്തമാനകാല പ്രസ്താവനയെ മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യരൂപത്തിൽ പകരുന്നു.
- source_word: ταῖς ἐκκλησίαις
  choice: സഭകളോട്
  rationale: ദത്തിവ് സൂചിപ്പിക്കുന്ന സന്ദേശസ്വീകർത്താക്കളെ വ്യക്തമാക്കുകയും വെളിപ്പാട് 2–3-ൽ അഭിസംബോധന ചെയ്യപ്പെടുന്ന പ്രാദേശിക സഭകളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആഹ്വാനത്തിലെ പ്രതിനിധാനപരമായ പുല്ലിംഗ ഏകവചനം
  choice: ചെവിയുള്ളവൻ … കേൾക്കട്ടെ
  alternative: ചെവിയുള്ള ആരും കേൾക്കട്ടെ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗ ഏകവചനവും അതിന്റെ പ്രതിനിധാനപരമായ വ്യാപ്തിയും മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇത് പുരുഷന്മാർക്കു മാത്രമുള്ള ആഹ്വാനമെന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- issue: τὸ πνεῦμα എന്നതിന്റെ പരാമർശം
  choice: ആത്മാവ്
  alternative: ആത്മാവ് [അഥവാ, പരിശുദ്ധാത്മാവ്]
  rationale: സന്ദർഭത്തിൽ സംസാരിക്കുന്നത് പരിശുദ്ധാത്മാവാണെങ്കിലും മൂലപാഠത്തിൽ ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ഇല്ല; അതിനാൽ വാക്യത്തിൽ അത് ചേർക്കാതെ സന്ദർഭപരമായ തിരിച്ചറിവ് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ഏകവചന രൂപവും സഭകളെന്ന ബഹുവചനവും സൂക്ഷിച്ചിരിക്കുന്നു; ‘പരിശുദ്ധ’ എന്ന പദം മൂലപാഠത്തിലില്ലാത്തതിനാൽ പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
