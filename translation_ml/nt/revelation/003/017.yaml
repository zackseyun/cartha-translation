id: REV.3.17
reference: Revelation 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: ml
  text: എന്തെന്നാൽ, ‘ഞാൻ ധനികനാണ്; ഞാൻ സമ്പന്നനായിത്തീർന്നിരിക്കുന്നു; എനിക്ക് ഒന്നിനും ആവശ്യമില്ല’ എന്നു നീ പറയുന്നു; നീ തന്നെയാണ് ദുരവസ്ഥയിലുള്ളവനും[a] ദയനീയനും ദരിദ്രനും അന്ധനും നഗ്നനും എന്ന് നീ അറിയുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ദുരവസ്ഥയിലുള്ളവൻ’ എന്ന വിശേഷണത്തോടൊപ്പം ആർട്ടിക്കിൾ ഉണ്ട്; അതിനാൽ ഈ വിവരണം പ്രത്യേകം ചൂണ്ടിക്കാണിക്കുന്നതാണ്.
    reason: മൂലപാഠത്തിലെ ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ പൂർണമായി പ്രകടമാകാത്തതിനാൽ.
lexical_decisions:
- source_word: ὅτι λέγεις ὅτι
  choice: എന്തെന്നാൽ, … എന്നു നീ പറയുന്നു
  rationale: ആദ്യത്തെ ὅτι മുമ്പുള്ള ശാസനയുടെ കാരണം അവതരിപ്പിക്കുന്നു; രണ്ടാമത്തേത് പറയുന്നതിന്റെ ഉള്ളടക്കം നേരിട്ടുള്ള ഉദ്ധരണിയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Πλούσιός εἰμι
  choice: ഞാൻ ധനികനാണ്
  rationale: സഭയുടെ സ്വയംവിലയിരുത്തലിലെ ധനസമൃദ്ധിയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: πεπλούτηκα
  choice: ഞാൻ സമ്പന്നനായിത്തീർന്നിരിക്കുന്നു
  rationale: സമ്പത്ത് നേടിയതിന്റെ ഫലമായി ഇപ്പോൾ നിലനിൽക്കുന്ന അവസ്ഥ എന്ന പൂർണ്ണകാല ക്രിയയുടെ ഭാവം കഴിയുന്നത്ര സൂക്ഷിക്കുന്നു.
- source_word: οὐδὲν χρείαν ἔχω
  choice: എനിക്ക് ഒന്നിനും ആവശ്യമില്ല
  rationale: οὐδέν എന്ന സമ്പൂർണ നിഷേധത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐκ οἶδας
  choice: നീ അറിയുന്നില്ല
  rationale: അറിവിനെ സൂചിപ്പിക്കുന്ന ക്രിയയെ വ്യാഖ്യാനപരമായി ‘തിരിച്ചറിയുന്നില്ല’ എന്നു മാറ്റാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: σὺ εἶ
  choice: നീ തന്നെയാണ്
  rationale: പ്രകടമായ σὺ സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘തന്നെയാണ്’ ഉപയോഗിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: ὁ ταλαίπωρος
  choice: ദുരവസ്ഥയിലുള്ളവൻ
  rationale: കഷ്ടവും ദയനീയവുമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ἐλεεινός എന്ന പദത്തിൽനിന്ന് അർഥവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἐλεεινός
  choice: ദയനീയൻ
  rationale: കരുണ അർഹിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുകയും ταλαίπωρος എന്നതുമായി അനാവശ്യമായി ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πτωχὸς καὶ τυφλὸς καὶ γυμνός
  choice: ദരിദ്രനും അന്ധനും നഗ്നനും
  rationale: സമ്പത്തിന്റെ അവകാശവാദത്തോടുള്ള വിരോധാഭാസവും മൂലപാഠത്തിലെ ശക്തമായ ദൃശ്യരൂപങ്ങളും വ്യാഖ്യാനപദങ്ങൾ ചേർക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സമ്പത്ത്, ദാരിദ്ര്യം, അന്ധത, നഗ്നത എന്നിവയെ ആത്മീയാവസ്ഥയായി മുഖ്യപാഠത്തിൽ തുറന്നു വ്യാഖ്യാനിക്കണമോ
  choice: മൂലപാഠത്തിലെ രൂപങ്ങൾ അതേപടി നിലനിർത്തി; ‘ആത്മീയമായി’ പോലുള്ള വിശദീകരണം ചേർത്തില്ല.
  alternative: ‘ആത്മീയമായി ധനികൻ/ദരിദ്രൻ’ എന്നിങ്ങനെ വ്യക്തമാക്കുക.
  rationale: വാക്യത്തിലെ വിരോധാഭാസവും രൂപകാത്മക സംഘർഷവും വായനക്കാരൻ ഗ്രഹിക്കേണ്ട വിധത്തിൽ പാഠം തന്നെയാണ് സൃഷ്ടിക്കുന്നത്; വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് അർഥത്തെ അനാവശ്യമായി ചുരുക്കും.
- issue: ὁ ταλαίπωρος എന്നതിലെ നിർദ്ദേശകമായ ആർട്ടിക്കിളിന്റെ ശക്തി
  choice: ‘നീ തന്നെയാണ്’ എന്ന ഊന്നലോടൊപ്പം സ്വാഭാവികമായ വിധേയവിശേഷണക്രമം ഉപയോഗിച്ചു; ആർട്ടിക്കിളിന്റെ ചൂണ്ടിക്കാണിക്കുന്ന ഭാവം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘ആ ദുരവസ്ഥയിലുള്ളവൻ നീയാണ്’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകുക.
  rationale: പകരംരൂപം ഗ്രീക്കിലെ ആർട്ടിക്കിൾ കൂടുതൽ പുറമേ കാണിച്ചാലും മലയാളത്തിൽ അസ്വാഭാവികമായോ മുമ്പ് പരാമർശിച്ച ഒരാളെ സൂചിപ്പിക്കുന്നതായോ തോന്നാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. സമ്പത്ത് സംബന്ധിച്ച ആദ്യ രണ്ടു പ്രസ്താവനകളിലെ വ്യത്യാസവും അവസാനത്തെ അഞ്ചു വിധേയവിശേഷണങ്ങളുടെ കൂട്ടിച്ചേർക്കുന്ന താളവും സൂക്ഷിച്ചു.
