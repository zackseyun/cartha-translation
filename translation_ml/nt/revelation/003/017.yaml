revisions:
- from: എന്തെന്നാൽ, ‘ഞാൻ ധനികനാണ്; ഞാൻ സമ്പന്നനായിത്തീർന്നിരിക്കുന്നു; എനിക്ക് ഒന്നിനും ആവശ്യമില്ല’ എന്നു നീ പറയുന്നു. എന്നാൽ ദുരവസ്ഥയിലുള്ളവനും[a] ദയനീയനും ദരിദ്രനും അന്ധനും നഗ്നനും നീ തന്നെയാണെന്ന് നീ അറിയുന്നില്ല.
  to: എന്തെന്നാൽ, ‘ഞാൻ ധനികനാണ്; ഞാൻ സമ്പന്നനായിത്തീർന്നിരിക്കുന്നു; എനിക്ക് ഒന്നിനും ആവശ്യമില്ല’ എന്നു നീ പറയുന്നു; നീ തന്നെയാണ് ദുരവസ്ഥയിലുള്ളവനും[a] ദയനീയനും ദരിദ്രനും അന്ധനും നഗ്നനും എന്ന് നീ അറിയുന്നില്ല.
  rationale: മൂലപാഠത്തിലെ καὶ-യെ അനാവശ്യമായി ‘എന്നാൽ’ എന്നു വിരോധസൂചകമാക്കാതിരിക്കാൻ വാക്യവിഭജനം അർധവിരാമമായി തിരുത്തി. മറ്റു പദപ്രയോഗങ്ങളും അടിക്കുറിപ്പും മൂലഗ്രീക്കിനോടും സ്വാഭാവിക ആധുനിക മലയാളത്തോടും യോജിക്കുന്നതിനാൽ മാറ്റിയിട്ടില്ല.
