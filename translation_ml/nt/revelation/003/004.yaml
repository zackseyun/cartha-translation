id: REV.3.4
reference: Revelation 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: ml
  text: എന്നാൽ സർദിസിൽ തങ്ങളുടെ വസ്ത്രങ്ങൾ മലിനമാക്കാത്ത ഏതാനും പേരുകൾ[a] നിനക്കുണ്ട്. അവർ വെള്ളവസ്ത്രങ്ങളിൽ[b] എന്നോടുകൂടെ നടക്കും; കാരണം അവർ യോഗ്യരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏതാനും ആളുകൾ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ഏതാനും പേരുകൾ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ സംക്ഷിപ്തമായി ‘വെള്ളയിൽ’ എന്നാണ്; ഇവിടെ വെള്ളവസ്ത്രങ്ങളാണ് ഉദ്ദേശിക്കുന്നതെന്ന് തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എങ്കിലും
  rationale: മുൻവാക്യത്തിലെ സർദിസ് സഭയെക്കുറിച്ചുള്ള ശാസനയ്ക്ക് ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: ἔχεις ὀλίγα ὀνόματα
  choice: ഏതാനും പേരുകൾ നിനക്കുണ്ട്
  rationale: ὀνόματα എന്നതിന്റെ അക്ഷരാർഥമായ ‘പേരുകൾ’ നിലനിർത്തുന്നു; ഇവിടെ അത് വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ലക്ഷണപ്രയോഗമാണ്. ഏകവചനമായ ‘നിനക്ക്’ സഭാദൂതനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന സംരക്ഷിക്കുന്നു.
- source_word: ἐν Σάρδεσιν
  choice: സർദിസിൽ
  rationale: നഗരനാമത്തിന്റെ സ്വാഭാവിക സ്ഥാനവാചക രൂപം.
- source_word: οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν
  choice: തങ്ങളുടെ വസ്ത്രങ്ങൾ മലിനമാക്കാത്ത
  rationale: μολύνω സൂചിപ്പിക്കുന്ന കളങ്കപ്പെടുത്തൽ/അശുദ്ധമാക്കൽ എന്ന വസ്ത്രരൂപകം ലളിതമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘തങ്ങളുടെ’ എന്നത് ആ വ്യക്തികളിലേക്കുള്ള തിരിച്ചുസൂചന വ്യക്തമാക്കുന്നു.
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: അവർ എന്നോടുകൂടെ നടക്കും
  rationale: നടക്കുക എന്ന അക്ഷരചിത്രവും ക്രിസ്തുവിനോടുള്ള കൂട്ടായ്മയുടെ സൂചനയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- source_word: ἐν λευκοῖς
  choice: വെള്ളവസ്ത്രം ധരിച്ച്
  rationale: ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘വെള്ളയിൽ’ എന്ന സംക്ഷിപ്ത രൂപമാണെങ്കിലും മുൻപുള്ള വസ്ത്രസന്ദർഭത്തിൽ സൂചിപ്പിച്ചിരിക്കുന്ന നാമം മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി തുറന്നുപറയുന്നു.
- source_word: ὅτι ἄξιοί εἰσιν
  choice: കാരണം അവർ യോഗ്യരാണ്
  rationale: കാരണം വ്യക്തമാക്കുന്ന ὅτιയും ἄξιος എന്നതിന്റെ നേരിട്ടുള്ള ‘യോഗ്യർ’ എന്ന അർഥവും ദൈവശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ὀλίγα ὀνόματα എന്നത് ‘ഏതാനും ആളുകൾ’ എന്നോ ‘ഏതാനും പേരുകൾ’ എന്നോ പരിഭാഷപ്പെടുത്തൽ
  choice: മുഖ്യവാചകത്തിൽ ‘ഏതാനും പേരുകൾ’ നിലനിർത്തി
  alternative: ഏതാനും ആളുകൾ
  rationale: മൂലത്തിലെ ശ്രദ്ധേയമായ ലക്ഷണപ്രയോഗവും വ്യക്തിപരമായി അറിയപ്പെടുന്നവരെന്ന സാധ്യതയുള്ള സൂചനയും സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുന്നു.
- issue: μολύνω എന്ന പദത്തിലെ നൈതികവും അശുദ്ധിയുമായി ബന്ധപ്പെട്ടതുമായ രൂപകം
  choice: ‘വസ്ത്രങ്ങൾ മലിനമാക്കാത്ത’
  alternative: ‘വസ്ത്രങ്ങൾ അശുദ്ധമാക്കാത്ത’
  rationale: വസ്ത്രത്തിലെ കറ എന്ന ദൃശ്യരൂപകം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു; അശുദ്ധിയുടെ ശക്തമായ ധ്വനി വിവർത്തനത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- issue: ἐν λευκοῖς എന്ന സംക്ഷിപ്ത പ്രയോഗം
  choice: ‘വെള്ളവസ്ത്രം ധരിച്ച്’ എന്ന് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കി
  alternative: ‘വെള്ളയിൽ’
  rationale: മുൻപുള്ള വസ്ത്രപരാമർശം വിട്ടുപോയ നാമം പൂരിപ്പിക്കാൻ ശക്തമായ സന്ദർഭാധാരം നൽകുന്നു; നിറത്തിന്റെ വിശുദ്ധി/ജയം തുടങ്ങിയ പ്രതീകാർഥങ്ങളെ കൂടുതൽ വിശദീകരിച്ച് പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: ἄξιοί εἰσιν എന്നത് യോഗ്യതയെയോ അർഹതയെയോ സൂചിപ്പിക്കുന്ന വിധം
  choice: ‘അവർ യോഗ്യരാണ്’ എന്ന് നേരിട്ട് വിവർത്തനം ചെയ്തു
  alternative: ‘അവർ അതിന് അർഹരാണ്’
  rationale: വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം മയപ്പെടുത്താതെയും രക്ഷ നേട്ടമായി സമ്പാദിക്കുന്നു എന്ന വ്യാഖ്യാനം ചേർക്കാതെയും മൂലപ്രസ്താവന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വെളിപ്പാടുപുസ്തകത്തിന്റെ ഗൗരവവും പ്രതീകാത്മകതയും നിലനിർത്തുന്ന മലയാളം. ‘പേരുകൾ,’ ‘നടക്കും,’ ‘യോഗ്യരാണ്’ എന്നീ ശ്രദ്ധേയമായ മൂലപ്രയോഗങ്ങൾ ലഘൂകരിക്കാതെ സൂക്ഷിച്ചു; ἐν λευκοῖς മാത്രം മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കി.
