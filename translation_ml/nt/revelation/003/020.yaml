id: REV.3.20
reference: Revelation 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: ml
  text: ഇതാ[a], ഞാൻ വാതിൽക്കൽ നിൽക്കുന്നു, മുട്ടുന്നു. ആരെങ്കിലും എന്റെ ശബ്ദം കേട്ട് വാതിൽ തുറന്നാൽ, ഞാൻ അകത്തു കടന്ന് ആ വ്യക്തിയുടെ അടുക്കലേക്കു വരും[b]; ആ വ്യക്തിയോടൊപ്പം ഭക്ഷണം കഴിക്കും[c], ആ വ്യക്തിയും എന്നോടൊപ്പം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നോക്കൂ” എന്നും പരിഭാഷപ്പെടുത്താം. “നിൽക്കുന്നു” എന്നതിനു പിന്നിലെ ഗ്രീക്ക് ക്രിയ പൂർണകാലരൂപത്തിലാണെങ്കിലും ഇവിടെ ഇപ്പോഴത്തെ തുടരുന്ന നിലയാണ് സൂചിപ്പിക്കുന്നത്; “മുട്ടുന്നു” എന്നത് തുടരുന്ന പ്രവൃത്തിയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത മറ്റൊരു പരിഭാഷ: “ഞാൻ ആ വ്യക്തിയുടെ അടുക്കലേക്കു പ്രവേശിക്കും.” ഇവിടെ പറയുന്നത് ഒരു സ്ഥലത്തേക്കുള്ള പ്രവേശനം മാത്രമല്ല, ആ വ്യക്തിയുടെ അടുക്കലേക്കുള്ള വരവുമാണ്.'
    reason: lexical_alternative
  - marker: c
    text: ഒരുമിച്ചു ഭക്ഷണം കഴിക്കുന്ന ചിത്രം അടുപ്പമുള്ള പരസ്പര കൂട്ടായ്മയെ പ്രകടമാക്കുന്നു. ഇത് പ്രത്യേകമായി കർത്തൃമേശയെയോ, മാനസാന്തരത്തെയോ, പുനഃസ്ഥാപിക്കപ്പെട്ട കൂട്ടായ്മയെയോ സൂചിപ്പിക്കുന്നുവോ എന്നതിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്; വാക്യം തന്നെ അത് വ്യക്തമായി തീർപ്പാക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് നിപാതത്തിന്റെ അടിയന്തരതയും ഗൗരവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἕστηκα
  choice: ഞാൻ ... നിൽക്കുന്നു
  rationale: ἵστημι എന്ന ക്രിയയുടെ പൂർണകാലരൂപം ഇവിടെ ഇപ്പോഴത്തെ നിലയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ കഴിഞ്ഞ പ്രവൃത്തിയെന്നതിലുപരി തുടരുന്ന നിൽപ്പാണ് വിവർത്തനം വ്യക്തമാക്കുന്നത്.
- source_word: ἐπὶ τὴν θύραν
  choice: വാതിൽക്കൽ
  rationale: പ്രവേശനകവാടത്തിനരികിലെ സ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κρούω
  choice: മുട്ടുകയും ചെയ്യുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള തുടരുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുകയും ἕστηκα എന്ന നിലയോടുള്ള ഏകോപനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐάν τις
  choice: ആരെങ്കിലും ... തുറന്നാൽ
  rationale: നിബന്ധനാപരവും എല്ലാവരെയും ഉൾക്കൊള്ളുന്നതുമായ ക്ഷണം ലിംഗപരമായ നിയന്ത്രണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: എന്റെ ശബ്ദം കേട്ട്
  rationale: φωνήയെ വെറും ശബ്ദധ്വനിയെന്നതിലുപരി സംസാരിക്കുന്ന വ്യക്തിയുടെ ശബ്ദമായി നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: ഞാൻ അയാളുടെ അടുക്കൽ അകത്തു ചെല്ലും
  rationale: εἰσελεύσομαιയുടെ പ്രവേശനാർഥവും πρὸς αὐτόν എന്നതിലെ വ്യക്തിപരമായ ദിശയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: δειπνήσω
  choice: ഭക്ഷണം കഴിക്കും
  rationale: പ്രധാന ഭക്ഷണം പങ്കിടുന്ന പ്രവൃത്തിയെ ഇന്നത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു; പ്രത്യേകമായ ഒരു സാംസ്കാരിക ഭക്ഷണസമയം നിർബന്ധിക്കുന്നില്ല.
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: അയാളോടൊപ്പം ... അയാളും എന്നോടൊപ്പം
  rationale: പരസ്പര കൂട്ടായ്മയ്ക്കുള്ള ഊന്നലും രണ്ടാം ഖണ്ഡത്തിലെ ഗ്രീക്ക് അപൂർണവാക്യഘടനയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭക്ഷണം പങ്കിടുന്നതിന്റെ രൂപകവും അതിന്റെ ദൈവശാസ്ത്രപരമായ സൂചനയും
  choice: വ്യക്തിപരവും പരസ്പരവുമായ മേശക്കൂട്ടായ്മയുടെ ചിത്രം വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തി.
  alternative: ഇത് കർത്തൃമേശയുടെ പ്രത്യേക സൂചനയായോ, മാനസാന്തരത്തിന്റെ രൂപകമായോ, വിശ്വാസിയുമായോ സഭയുമായോ പുനഃസ്ഥാപിക്കപ്പെടുന്ന കൂട്ടായ്മയായോ നിർണ്ണയിക്കുക.
  rationale: വാക്യം അടുപ്പമുള്ള പരസ്പര കൂട്ടായ്മ വ്യക്തമാക്കുന്നു; എന്നാൽ ഭക്ഷണം ഏത് പ്രത്യേക ആചാരത്തെയോ അനുഭവത്തെയോ സൂചിപ്പിക്കുന്നു എന്ന് അത് തന്നെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. “അയാൾ” എന്ന പ്രയോഗം അനിശ്ചിതനായ വ്യക്തിയെ സൂചിപ്പിക്കുമ്പോൾ മലയാളത്തിൽ വായനാസൗകര്യം നൽകുന്നു; ഉപാധിയിലെ “ആരെങ്കിലും” ക്ഷണത്തിന്റെ ഉൾക്കൊള്ളുന്ന സ്വഭാവം വ്യക്തമാക്കുന്നു. അർദ്ധവിരാമങ്ങൾ നിൽക്കലും മുട്ടലും, പ്രവേശനവും ഭക്ഷണകൂട്ടായ്മയും തമ്മിലുള്ള ഘടന തെളിയിക്കുന്നു.
