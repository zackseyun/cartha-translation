  terminology: “ഇതാ,” “വാതിൽക്കൽ,” “ശബ്ദം,” and “ഒരുമിച്ച് ഭക്ഷണം കഴിക്കും” are appropriate, dignified modern terms. The meal image remains untranslated into any specific sacramental or conversion interpretation.
