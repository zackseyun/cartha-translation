  - severity: low
    issue: Overweighted verbal coordination
    rationale: “മുട്ടുകയും ചെയ്യുന്നു” is grammatical but unnecessarily cumbersome. “മുട്ടുന്നു” is natural and adequately conveys the Greek present action.
