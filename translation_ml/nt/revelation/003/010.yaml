id: REV.3.10
reference: Revelation 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: ml
  text: എന്റെ സഹനത്തിന്റെ വചനം നീ കാത്തുസൂക്ഷിച്ചതിനാൽ[a], ഭൂമിയിൽ വസിക്കുന്നവരെ പരീക്ഷിക്കുന്നതിനായി ജനവാസമുള്ള ലോകം മുഴുവന്മേലും വരാനിരിക്കുന്ന പരീക്ഷണത്തിന്റെ സമയത്തിൽനിന്ന് ഞാനും നിന്നെ കാത്തുസൂക്ഷിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘എന്റെ സഹനത്തെക്കുറിച്ചുള്ള വചനം’ അഥവാ ‘സഹിക്കാൻ ആഹ്വാനം ചെയ്യുന്ന എന്റെ സന്ദേശം.’ ഗ്രീക്ക് പ്രയോഗം അടുത്തബന്ധമുള്ള ഒന്നിലധികം രീതികളിൽ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘പരീക്ഷണസമയത്തിലൂടെ നിന്നെ സംരക്ഷിക്കും’ അഥവാ ‘പരീക്ഷണസമയത്തിനു പുറത്തു നിന്നെ കാത്തുസൂക്ഷിക്കും.’ ഗ്രീക്കിൽ ‘...യിൽനിന്ന് കാത്തുസൂക്ഷിക്കും’ എന്നാണ്; ഈ സംരക്ഷണം എങ്ങനെ സംഭവിക്കുമെന്നതിനെക്കുറിച്ചുള്ള പിൽക്കാല ദൈവശാസ്ത്രവാദങ്ങൾക്ക് ആ പ്രയോഗം തനിയെ തീർപ്പു നൽകുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: കാത്തുസൂക്ഷിച്ചതിനാൽ
  rationale: τηρέω എന്ന ക്രിയയുടെ ‘കാക്കുക/പാലിക്കുക’ എന്ന അർഥപരിധി നിലനിർത്തുകയും പിന്നീട് വരുന്ന τηρήσω എന്നതുമായ പദബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: എന്റെ സഹനത്തിന്റെ വചനം
  rationale: യേശുവിന്റെ സഹനത്തെക്കുറിച്ചുള്ള വചനം, സഹിക്കാൻ ആഹ്വാനം ചെയ്യുന്ന സന്ദേശം, അല്ലെങ്കിൽ സഹനത്താൽ വിശേഷിപ്പിക്കപ്പെടുന്ന വചനം എന്നീ സാധ്യതകളുള്ള ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണത്തിന്റെ അർഥവ്യാപ്തി പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: κἀγώ
  choice: ഞാനും
  rationale: അവർ കാത്തുസൂക്ഷിച്ചതിന് പ്രത്യുത്തരമായി താനും കാത്തുസൂക്ഷിക്കുമെന്ന ഊന്നലും പരസ്പരബന്ധവും പ്രകടമാക്കുന്നു.
- source_word: τηρήσω ἐκ
  choice: പരീക്ഷണസമയത്തിൽനിന്ന് ... കാത്തുസൂക്ഷിക്കും
  rationale: τηρέω + ἐκ എന്നതിന്റെ നേരിട്ടുള്ള രൂപം പിന്തുടരുന്നു; നീക്കം ചെയ്യലോ പരീക്ഷണത്തിലൂടെ സംരക്ഷിക്കലോ എന്ന് മുഖ്യവാചകം തീർപ്പാക്കുന്നില്ല.
- source_word: ὥρας
  choice: സമയം
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘മണിക്കൂർ’ ആണെങ്കിലും ഇവിടെ ഒരു കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമായി ‘സമയം’ ഉപയോഗിക്കുന്നു.
- source_word: πειρασμοῦ
  choice: പരീക്ഷണം
  rationale: പരിശോധന, കഷ്ടപരീക്ഷ, പ്രലോഭനം എന്നിവ ഉൾപ്പെടാവുന്ന πειρασμός എന്ന പദത്തിന് ഈ ആഗോള സന്ദർഭത്തിൽ ഏറ്റവും വിശാലവും നിഷ്പക്ഷവുമായ തുല്യം.
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: വരാനിരിക്കുന്ന
  rationale: μέλλω + infinitive സൂചിപ്പിക്കുന്ന ഭാവിസാധ്യതയും അടുത്തുവരുന്ന സ്വഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: വാസയോഗ്യമായ ലോകം മുഴുവൻ
  rationale: οἰκουμένη എന്നത് പ്രപഞ്ചമൊട്ടാകെയല്ല, മനുഷ്യർ അധിവസിക്കുന്ന ലോകത്തെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്; ആ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: πειράσαι
  choice: പരീക്ഷിക്കാനായി
  rationale: വരാനിരിക്കുന്ന പരീക്ഷണസമയത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും πειρασμός എന്ന നാമപദവുമായുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ വസിക്കുന്നവരെ
  rationale: വെളിപ്പാടിൽ ആവർത്തിക്കുന്ന ഈ പ്രയോഗത്തിന്റെ ക്രിയാരൂപവും അന്തർപാഠബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിലെ τηρήσω ἐκ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: പരീക്ഷണസമയത്തിൽനിന്ന് ... കാത്തുസൂക്ഷിക്കും
  alternative: പരീക്ഷണസമയത്തിലൂടെ സംരക്ഷിക്കും; പരീക്ഷണസമയത്തിനു പുറത്തു നിർത്തും
  rationale: ഗ്രീക്ക് പ്രയോഗം സംരക്ഷണം എങ്ങനെ സംഭവിക്കും—മുൻകൂട്ടി നീക്കുന്നതിലൂടെയോ, പരീക്ഷണത്തിനിടയിൽ കാക്കുന്നതിലൂടെയോ, അതിന്റെ ആഘാതത്തിൽനിന്ന് ഒഴിവാക്കുന്നതിലൂടെയോ—എന്ന പിന്നീടുള്ള തർക്കങ്ങൾക്ക് സ്വയം തീർപ്പു നൽകുന്നില്ല.
- issue: τὸν λόγον τῆς ὑπομονῆς μου എന്നതിലെ ഷഷ്ഠീവ്യാകരണബന്ധം
  choice: എന്റെ സഹനത്തിന്റെ വചനം
  alternative: എന്റെ സഹനത്തെക്കുറിച്ചുള്ള വചനം; സഹിക്കാൻ ആഹ്വാനം ചെയ്യുന്ന എന്റെ സന്ദേശം
  rationale: ഗ്രീക്ക് വാക്യഘടന അനുവദിക്കുന്ന അടുത്തബന്ധമുള്ള വ്യത്യസ്ത അർഥങ്ങൾ മുഖ്യവാചകത്തിൽ തന്നെ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വചനം’, ‘സഹനം’, ‘പരീക്ഷണം’ എന്നിവ വെളിപ്പാടിന്റെ ഗൗരവമുള്ള ശൈലി നിലനിർത്തുന്നു; പദാനുപദതയും സ്വാഭാവിക മലയാളവാക്യക്രമവും തമ്മിൽ സമതുലനം പാലിച്ചിട്ടുണ്ട്.
