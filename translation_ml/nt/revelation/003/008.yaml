id: REV.3.8
reference: Revelation 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: ml
  text: നിന്റെ പ്രവൃത്തികൾ ഞാൻ അറിയുന്നു. ഇതാ, ആർക്കും അടയ്ക്കാൻ കഴിയാത്ത, തുറന്നിട്ടുള്ള ഒരു വാതിൽ[a] ഞാൻ നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്നു. കാരണം, നിനക്കു ശക്തി കുറവേ ഉള്ളൂ; നീ എന്റെ വചനം പാലിച്ചു, എന്റെ നാമം നിഷേധിച്ചതുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തുറന്ന ഒരു വാതിൽ.’ ഗ്രീക്കിലെ കൃദന്തരൂപം വാതിൽ തുറക്കപ്പെട്ടതും തുറന്ന നിലയിൽ തുടരുന്നതുമാണെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: നിന്റെ പ്രവൃത്തികൾ ഞാൻ അറിയുന്നു
  rationale: οἶδα രൂപത്തിൽ പൂർണകാലമാണെങ്കിലും അർഥത്തിൽ വർത്തമാനകാലമാണ്. τὰ ἔργα എന്ന ബഹുവചന നാമവും വെളിപ്പാടിലെ ആവർത്തിത പ്രയോഗവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരസൂചകത്തിന്റെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δέδωκα ἐνώπιόν σου
  choice: ഞാൻ നിന്റെ മുമ്പിൽ വെച്ചിരിക്കുന്നു
  rationale: δέδωκα എന്നതിന്റെ പൂർണകാലസ്വഭാവവും, വാതിൽ മുമ്പിൽ സ്ഥാപിച്ചിരിക്കുന്നു എന്ന സന്ദർഭോചിതമായ ആശയവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: θύραν ἠνεῳγμένην
  choice: തുറന്നിട്ടുള്ള ഒരു വാതിൽ
  rationale: പൂർണകാല കർമണി കൃദന്തം വാതിൽ തുറക്കപ്പെട്ടതും ഇപ്പോഴും തുറന്ന നിലയിലുള്ളതുമാണെന്ന് സൂചിപ്പിക്കുന്നു. ‘തുറന്നിട്ടുള്ള’ ഈ ക്രിയാത്മകവും ഫലസ്ഥിതിപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: ആർക്കും അടയ്ക്കാൻ കഴിയാത്ത
  rationale: δύναται സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മയും വാതിലിനോടു സ്വാഭാവികമായി ചേരുന്ന ‘അടയ്ക്കുക’ എന്ന ക്രിയയും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഇവിടെ തുടർന്നുവരുന്ന സഭയുടെ അവസ്ഥയും വിശ്വസ്തതയും മുമ്പത്തെ പ്രഖ്യാപനവുമായി കാരണബന്ധത്തിൽ അവതരിപ്പിക്കുന്ന വായന നിലനിർത്തുന്നു.
- source_word: μικρὰν ἔχεις δύναμιν
  choice: നിനക്കു ശക്തി കുറവേ ഉള്ളൂ
  rationale: δύναμις എന്നതിനെ ‘ശക്തി’ എന്നു നൽകുന്നത് പരിമിതമായ കഴിവോ വിഭവങ്ങളോ എന്ന അർഥം അനാവശ്യമായ രാഷ്ട്രീയ വ്യാഖ്യാനമില്ലാതെ പ്രകടമാക്കുന്നു. ‘കുറവേ ഉള്ളൂ’ μικράν എന്നതിന്റെ ഊന്നൽ നൽകുന്നു.
- source_word: ἐτήρησάς μου τὸν λόγον
  choice: നീ എന്റെ വചനം പാലിച്ചു
  rationale: τηρέωയുടെ അനുസരിക്കുക/കാത്തുകൊള്ളുക എന്ന അർഥപരിധിയിൽ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ് ‘പാലിച്ചു’; λόγος എന്നത് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ ‘വചനം’ ആയി നിലനിർത്തുന്നു.
- source_word: οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: എന്റെ നാമം നിഷേധിച്ചതുമില്ല
  rationale: ἀρνέομαιയുടെ നിഷേധിക്കുക/തള്ളിപ്പറയുക എന്ന ആശയവും ‘നാമം’ വഹിക്കുന്ന പ്രതിനിധിത്വപരമായ വിശ്വസ്തതയും പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘തുറന്നിട്ടുള്ള വാതിൽ’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: ദൗത്യാവസരം, രക്ഷയിലേക്കോ രാജ്യത്തിലേക്കോ ഉള്ള പ്രവേശനം, സംരക്ഷണം എന്നിവയിൽ ഒന്നായി നിർണ്ണയിക്കാതെ വാതിലിന്റെ രൂപകം അതേപടി നിലനിർത്തി.
  alternative: ഇത് സുവിശേഷദൗത്യത്തിനുള്ള അവസരമെന്നോ ദൈവരാജ്യത്തിലേക്കുള്ള പ്രവേശനമെന്നോ വ്യക്തമായി വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ വാക്യം രൂപകത്തെ വ്യക്തമായി വിശദീകരിക്കുന്നില്ല; അതിനാൽ അതിന്റെ യഥാർഥ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും പരിഭാഷയിൽ തുറന്നുവെക്കുന്നു.
- issue: ὅτιയും ‘ശക്തി കുറവ്’ എന്ന പ്രസ്താവനയും തമ്മിലുള്ള ബന്ധം
  choice: ὅτιയെ ‘കാരണം’ എന്നു നൽകി, തുടർന്നുള്ള ഘടകങ്ങളെ കാരണവിവരണമായി നിലനിർത്തി; ‘ശക്തി കുറവാണെങ്കിലും’ എന്ന സമ്മതസൂചക വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തില്ല.
  alternative: ‘നിനക്കു ശക്തി കുറവാണെങ്കിലും’ എന്നു പരിഭാഷപ്പെടുത്തി വിരുദ്ധത വ്യക്തമാക്കുക.
  rationale: സമ്മതസൂചകമായ അർഥം സന്ദർഭത്തിൽ സാധ്യമാണെങ്കിലും ഗ്രീക്കിൽ ‘എങ്കിലും’ എന്ന ഘടകം വ്യക്തമായി ഇല്ല. അതിനാൽ യഥാർഥ വാക്യബന്ധത്തിലെ അസാധാരണതയും അർഥതുറപ്പും സംരക്ഷിച്ചു.
- issue: ഗ്രീക്ക് ക്രിയകളുടെ കാലവും ക്രിയാഭാവവും
  choice: δέδωκα എന്ന പൂർണകാലത്തെ ‘വെച്ചിരിക്കുന്നു’ എന്നും, ἐτήρησας, ἠρνήσω എന്നീ അനിശ്ചിതഭൂതകാലരൂപങ്ങളെ സ്വാഭാവിക മലയാള ഭൂതകാലത്തിൽ ‘പാലിച്ചു’, ‘നിഷേധിച്ചതുമില്ല’ എന്നും നൽകി.
  alternative: എല്ലാ ക്രിയകളെയും ഫലസ്ഥിതി ഊന്നുന്ന പൂർണകാലസദൃശ രൂപങ്ങളിൽ നൽകുക.
  rationale: മൂലഗ്രീക്കിലെ ക്രിയാരൂപവ്യത്യാസം നിലനിർത്തുകയും മലയാളത്തിൽ അസ്വാഭാവികമായ കാലസമീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ‘ഇതാ’, ‘വചനം’, ‘നാമം’ തുടങ്ങിയ പദങ്ങൾ സാഹിത്യഗൗരവം നിലനിർത്തുമ്പോഴും വാക്യഘടന ലളിതവും സ്വാഭാവികവുമാണ്.
