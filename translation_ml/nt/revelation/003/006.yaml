  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: ml
  text: ചെവിയുള്ളവൻ[a] ആത്മാവ് സഭകളോടു പറയുന്നത് കേൾക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക്: ‘ചെവിയുള്ളവൻ കേൾക്കട്ടെ.’ ഏകവചന പുൽലിംഗരൂപത്തിലുള്ള ഈ പൊതുവായ ആഹ്വാനം കേൾക്കുന്ന ഏവരെയും അഭിസംബോധന ചെയ്യുന്നതാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: ചെവിയുള്ളവൻ
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ‘ചെവിയുള്ളവൻ’ എന്ന പ്രയോഗത്തിന്റെ പഴഞ്ചൊല്ലുസ്വഭാവവും പ്രതിനിധാനപരമായ ആഹ്വാനവും നിലനിർത്തുന്നു. ഇത് പുരുഷന്മാർക്കു മാത്രം ബാധകമായ പ്രയോഗമല്ല; കേൾക്കാൻ കഴിവുള്ള ഏവരെയും അഭിസംബോധന ചെയ്യുന്നു.
- source_word: ἀκουσάτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ ആഹ്വാനശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘കേൾക്കണം’ എന്നത് ബാധ്യതയെ കൂടുതൽ ശക്തമാക്കും.
- source_word: τί
  choice: പറയുന്നത്
  rationale: λέγει എന്ന ക്രിയയോടൊപ്പം ചേർത്ത് ‘ആത്മാവ് ... പറയുന്നത്’ എന്നു നൽകുന്നത് ഗ്രീക്കിലെ ‘എന്ത് പറയുന്നു’ എന്ന ഉള്ളടക്കബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: വെളിപ്പാട് 2–3 ലെ ആവർത്തിത സന്ദർഭത്തിൽ സഭകളോടു സംസാരിക്കുന്ന പരിശുദ്ധാത്മാവിനെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്. മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘ആത്മാവ്’ ഈ സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: λέγει
  choice: പറയുന്നത്
  rationale: വർത്തമാനകാലത്തെ തുടർച്ചയായ അഥവാ സ്വഭാവപരമായ സംസാരത്തെ മലയാളത്തിലെ ബന്ധവാക്യരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ταῖς ἐκκλησίαις
  choice: സഭകളോട്
  rationale: ബഹുവചന ദത്തിവിനെ ‘സഭകളോട്’ എന്നു നൽകുന്നത് സംസാരത്തിന്റെ അഭിസംബോധിതരെ കൃത്യമായി വ്യക്തമാക്കുകയും വെളിപ്പാടിലെ ഏഴു സഭകളുടെ പശ്ചാത്തലം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ആത്മാവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പരിശുദ്ധാത്മാവ്
  alternative: ഒരു ആത്മാവ്
  rationale: വെളിപ്പാട് 2–3 ലെ ആവർത്തിത സമാപനവാക്യത്തിൽ പ്രവാചകസന്ദേശത്തിലൂടെ സഭകളോടു സംസാരിക്കുന്ന പരിശുദ്ധാത്മാവാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചിതവ്യക്തി. വാക്യത്തിൽ ഉറവിടത്തിലുള്ളതുപോലെ ‘ആത്മാവ്’ എന്ന രൂപം തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
- issue: ആഹ്വാനത്തിലെ പൊതുവായ ഏകവചനം
  choice: ചെവിയുള്ളവൻ ... കേൾക്കട്ടെ
  alternative: ചെവിയുള്ളവർ കേൾക്കട്ടെ
  rationale: ഗ്രീക്കിൽ ഏകവചന പുൽലിംഗ കൃദന്തവും ഏകവചന ആജ്ഞാരൂപവുമാണുള്ളത്. മലയാളത്തിലും ആ ഏകവചനവും പഴഞ്ചൊല്ലുസ്വഭാവവും നിലനിർത്തുന്നു; ആശയം പുരുഷന്മാരിൽ മാത്രം പരിമിതമല്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ രൂപം. ഗ്രീക്കിലെ ഏകവചന പ്രയോഗവും ആജ്ഞാസ്വരവും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമം ഉപയോഗിച്ചു.
