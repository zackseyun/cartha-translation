language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: ml
  text: ജയിക്കുന്നവന്[a] എന്നോടുകൂടെ എന്റെ സിംഹാസനത്തിൽ ഇരിക്കാൻ ഞാൻ അനുവദിക്കും; ഞാനും ജയിച്ച് എന്റെ പിതാവിനോടുകൂടെ അവിടുത്തെ സിംഹാസനത്തിൽ ഇരുന്നതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജയിക്കുന്നവൻ’ എന്ന ഏകവചനപ്രയോഗം പ്രതിനിധാനപരമാണ്; ജയിക്കുന്ന ഓരോരുത്തർക്കും ഈ വാഗ്ദാനം ബാധകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: ജയിക്കുന്നവന്
  rationale: വർത്തമാനകാല കൃദന്തരൂപം വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമപ്രയോഗമായാണ് വന്നിരിക്കുന്നത്. ‘ജയിക്കുന്നവൻ’ എന്നത് വെളിപ്പാടിലെ ആവർത്തിതമായ വിജയപ്രമേയവും ഈ വാക്യത്തിലെ νικάω എന്ന ക്രിയയുടെ ആവർത്തനവും നിലനിർത്തുന്നു; ദാതൃപ്രയോഗം മലയാളവാക്യഘടനയ്ക്ക് സ്വാഭാവികമാണ്.
- source_word: δώσω αὐτῷ καθίσαι
  choice: ഇരിക്കാൻ അനുവാദം നൽകും
  rationale: δίδωμι + അനന്തക്രിയ എന്ന ഘടന ഇവിടെ ഒരു പദവിയോ അവകാശമോ അനുവദിക്കുന്ന അർഥത്തിലാണ്. ‘അനുവാദം നൽകും’ ഈ പ്രയോഗാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടുകൂടെ
  rationale: μετά + ഷഷ്ഠി സൂചിപ്പിക്കുന്ന സഹവാസബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν τῷ θρόνῳ μου
  choice: എന്റെ സിംഹാസനത്തിൽ
  rationale: സിംഹാസനാരോഹണസന്ദർഭത്തിൽ മലയാളത്തിൽ ‘സിംഹാസനത്തിൽ ഇരിക്കുക’ എന്നതാണ് സ്വാഭാവികമായ പ്രയോഗം.
- source_word: ὡς κἀγὼ
  choice: ഞാൻ ... പോലെതന്നെ
  rationale: ὡς എന്ന താരതമ്യവും κἀγώയിലെ ‘ഞാനും’ എന്ന ഉൾക്കൊള്ളുന്ന ഊന്നലും ചേർന്ന താരതമ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐνίκησα
  choice: ജയിച്ച്
  rationale: ആദ്യത്തെ νικῶν എന്ന പദവുമായി ഒരേ ‘ജയിക്കുക’ എന്ന ധാതു ഉപയോഗിച്ച് ഗ്രീക്കിലെ പദാവർത്തനവും വിജയപ്രമേയവും സംരക്ഷിക്കുന്നു.
- source_word: ἐκάθισα
  choice: ഇരുന്നു
  rationale: പൂർത്തിയായ സിംഹാസനാരോഹണപ്രവർത്തിയെ ലളിതവും സ്വാഭാവികവുമായ ഭൂതകാലരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μετὰ τοῦ πατρός μου
  choice: എന്റെ പിതാവിനോടുകൂടെ
  rationale: പിതാവുമായുള്ള സഹവാസവും പുത്രബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν τῷ θρόνῳ αὐτοῦ
  choice: അവിടുത്തെ സിംഹാസനത്തിൽ
  rationale: പിതാവിനെ പരാമർശിക്കുമ്പോൾ ആധുനിക മാനക മലയാളത്തിലെ ആദരസൂചക സർവനാമം ഉപയോഗിക്കുകയും സിംഹാസനചിത്രം അതേപടി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ജയിക്കുന്നവനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പുല്ലിംഗ ഏകവചനത്തിന്റെ പ്രതിനിധാനസ്വഭാവം
  choice: ‘ജയിക്കുന്നവന്’ എന്ന ഏകവചനരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തി, വാഗ്ദാനം ജയിക്കുന്ന ഓരോ വിശ്വാസിക്കും ബാധകമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക
  alternative: ‘ജയിക്കുന്നവർക്ക്’ എന്ന ബഹുവചനരൂപം ഉപയോഗിക്കുക
  rationale: ഗ്രീക്ക് പാഠത്തിന്റെ ഏകവചനഘടന സംരക്ഷിക്കുമ്പോഴും മലയാളത്തിലെ രൂപം സ്വാഭാവികമായി പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ലിംഗത്തെയോ പരിധിയെയോ കുറിച്ച് തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് സഹായിക്കുന്നു.
- issue: വിശ്വാസി ക്രിസ്തുവിന്റെ സിംഹാസനത്തിൽ ഇരിക്കുന്നതും ക്രിസ്തു പിതാവിന്റെ സിംഹാസനത്തിൽ ഇരിക്കുന്നതുമായ സമാന്തരബന്ധം
  choice: സമാന്തരതയെ വിശദീകരിക്കാതെയും മയപ്പെടുത്താതെയും നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  alternative: സിംഹാസനത്തിൽ ഇരിക്കൽ പ്രതീകാത്മകമാണെന്ന് പാഠത്തിനുള്ളിൽ വിശദീകരിക്കുകയോ വ്യക്തിവ്യത്യാസത്തെക്കുറിച്ചുള്ള സിദ്ധാന്തപരമായ വാക്കുകൾ ചേർക്കുകയോ ചെയ്യുക
  rationale: മൂലപാഠം ശക്തമായ താരതമ്യം ഉന്നയിക്കുന്നുവെങ്കിലും അതിന്റെ സ്വഭാവത്തെ കൂടുതൽ നിർവചിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ വിശദീകരണം പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്യാതെ പാഠത്തിലെ ശക്തിയും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ജയിക്കുക’ എന്ന പദം രണ്ടിടത്തും ആവർത്തിച്ച് മൂലപാഠത്തിലെ νικάω-ബന്ധം സൂക്ഷിച്ചു. പിതാവിനെ സൂചിപ്പിക്കാൻ ‘അവിടുത്തെ’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിച്ചു; പ്രധാനപാഠത്തിൽ വ്യാഖ്യാനാത്മക ദൈവശാസ്ത്രവികാസം ഒഴിവാക്കി.
