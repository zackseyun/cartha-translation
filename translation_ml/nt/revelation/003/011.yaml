id: REV.3.11
reference: Revelation 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: ml
  text: ഞാൻ വേഗം വരുന്നു[a]. ആരും നിന്റെ കിരീടം[b] എടുക്കാതിരിക്കേണ്ടതിന് നിനക്കുള്ളത് മുറുകെപ്പിടിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വേഗം’ എന്നതിന് ‘താമസിയാതെ’ അഥവാ ‘പെട്ടെന്ന്’ എന്നും അർഥമാകാം. ഗ്രീക്ക് ക്രിയാവിശേഷണം സമയത്തിന്റെ സമീപതയെയോ പ്രവർത്തനത്തിന്റെ ദ്രുതതയെയോ ഊന്നിക്കാട്ടാം.
    reason: alternative_reading
  - marker: b
    text: ഇവിടത്തെ ഗ്രീക്ക് പദം പ്രത്യേകമായി രാജകീയ മകുടത്തെയല്ല, വിജയിക്കോ ബഹുമാനിക്കപ്പെടുന്നയാൾക്കോ നൽകുന്ന വിജയമാലയെയോ ബഹുമതിക്കിരീടത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: ഞാൻ വരുന്നു
  rationale: വർത്തമാനകാലരൂപത്തിന് ഇവിടെ ആസന്നമായ ഭാവിസംഭവത്തിന്റെ ബലമുണ്ട്. മലയാളത്തിൽ ‘ഞാൻ വരുന്നു’ ആഗമനത്തിന്റെ ഉറപ്പും സമീപതയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ταχύ
  choice: വേഗം
  rationale: കാലസമീപതയായ ‘താമസിയാതെ’ എന്നും പ്രവർത്തനത്തിന്റെ ദ്രുതതയായ ‘പെട്ടെന്ന്’ എന്നും അർഥമാകാവുന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ ഇരട്ടസാധ്യത ‘വേഗം’ ഒരു പരിധിവരെ തുറന്നുവെക്കുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: κράτει
  choice: മുറുകെപ്പിടിക്കുക
  rationale: κρατέω എന്ന ആജ്ഞാരൂപം ഉറച്ചുനിൽക്കുകയും കൈവിടാതെ സൂക്ഷിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘മുറുകെപ്പിടിക്കുക’ ആ ആജ്ഞയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὃ ἔχεις
  choice: നിനക്കുള്ളത്
  rationale: ഗ്രീക്കുപാഠം വസ്തു എന്താണെന്ന് വ്യക്തമാക്കാത്തതിനാൽ സന്ദർഭം അതിനെ നിർവചിക്കാൻ അനുവദിച്ച് അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: ἵνα μηδεὶς λάβῃ
  choice: ആരും ... എടുത്തുകളയാതിരിക്കട്ടെ
  rationale: ἵναയോടുകൂടിയ നിഷേധാത്മക ഉപവാക്യം തടയേണ്ട ഉദ്ദേശിത ഫലത്തെ സൂചിപ്പിക്കുന്നു. ഈ മലയാളരൂപം മുന്നറിയിപ്പിന്റെ സ്വാഭാവികതയും ഉദ്ദേശ്യബന്ധവും നിലനിർത്തുന്നു.
- source_word: στέφανόν
  choice: കിരീടം
  rationale: στέφανος രാജകീയ മകുടത്തെ മാത്രമല്ല, വിജയത്തിന്റെയോ ബഹുമതിയുടെയോ അടയാളമായി നൽകുന്ന പുഷ്പചക്രം/കിരീടത്തെയാണ് സൂചിപ്പിക്കുന്നത്. വായനാസൗകര്യത്തിന് ‘കിരീടം’ ഉപയോഗിച്ച് പ്രത്യേക സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ വരവിനെക്കുറിച്ചുള്ള ταχύയുടെ അർഥസൂക്ഷ്മത
  choice: വേഗം
  alternative: താമസിയാതെ; പെട്ടെന്ന്
  rationale: ഈ പദം സമയപരമായ സമീപതയെയോ വരുമ്പോഴുള്ള ദ്രുതതയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിലെ ‘വേഗം’ ഈ രണ്ടു സൂക്ഷ്മതകളെയും പൂർണമായി അടച്ചുപൂട്ടുന്നില്ല; അടിക്കുറിപ്പ് യഥാർഥ വ്യാഖ്യാനസാധ്യത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നിനക്ക്/നിന്റെ’ ഗ്രീക്കിലെ രണ്ടാംപുരുഷ ഏകവചനത്തെ നിലനിർത്തുന്നു. യഥാർഥ ലെക്സിക്കൽ അനിശ്ചിതത്വങ്ങൾ മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പുകളിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
