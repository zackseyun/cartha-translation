revisions:
- from: തീയോടു കലർന്നതുപോലെ തോന്നിയ ഒരു സ്ഫടികക്കടൽ ഞാൻ കണ്ടു. മൃഗത്തിന്മേലും അതിന്റെ പ്രതിമയ്ക്കുമേലും അതിന്റെ പേരിന്റെ സംഖ്യയ്ക്കുമേലും വിജയം നേടിയവർ[a] ദൈവത്തിന്റെ വീണകൾ[b] കൈയിൽ പിടിച്ചുകൊണ്ട് ആ സ്ഫടികക്കടലിന്മേൽ നിൽക്കുന്നതും ഞാൻ കണ്ടു.
  to: തീയോടു കലർന്ന ഒരു സ്ഫടികക്കടൽപോലെയുള്ളത് ഞാൻ കണ്ടു; മൃഗത്തിന്മേലും അതിന്റെ പ്രതിമയ്ക്കുമേലും അതിന്റെ പേരിന്റെ സംഖ്യയ്ക്കുമേലും വിജയം നേടിയവർ[a] ദൈവത്തിന്റെ കിന്നരങ്ങൾ[b] കൈയിൽ പിടിച്ചുകൊണ്ട് ആ സ്ഫടികക്കടലിന്മേൽ നിൽക്കുന്നതായും ഞാൻ കണ്ടു.
  rationale: The revision makes the comparison introduced by ὡς unambiguous, retains the striking image of standing upon the sea, preserves the threefold parallelism and the stated alternative for ἐκ, and uses the conventional Malayalam biblical term ‘കിന്നരങ്ങൾ’ for κιθάραι. Footnote markers remain attached to the corresponding expressions.
