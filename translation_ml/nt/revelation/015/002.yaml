id: REV.15.2
reference: Revelation 15:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: ml
  text: തീയോടു കലർന്ന ഒരു സ്ഫടികക്കടൽപോലെയുള്ളത് ഞാൻ കണ്ടു; മൃഗത്തിന്മേലും അതിന്റെ പ്രതിമയ്ക്കുമേലും അതിന്റെ പേരിന്റെ സംഖ്യയ്ക്കുമേലും വിജയം നേടിയവർ[a] ദൈവത്തിന്റെ കിന്നരങ്ങൾ[b] കൈയിൽ പിടിച്ചുകൊണ്ട് ആ സ്ഫടികക്കടലിന്മേൽ നിൽക്കുന്നതായും ഞാൻ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മൃഗത്തിന്റെയും അതിന്റെ പ്രതിമയുടെയും അതിന്റെ പേരിന്റെ സംഖ്യയുടെയും അധികാരത്തിൽനിന്ന് പുറത്തുവന്നവർ.’ ഗ്രീക്ക് പ്രയോഗം അവയ്ക്കുമേലുള്ള വിജയത്തെയോ അവയുടെ അധികാരത്തിൽനിന്നുള്ള മോചനത്തെയോ ഊന്നിപ്പറയാം.
    reason: alternative_reading
  - marker: b
    text: ‘ദൈവത്തിന്റെ കിന്നരങ്ങൾ’ എന്നത് ദൈവത്തിന്റേതായ, ദൈവം നൽകിയ, അല്ലെങ്കിൽ ദൈവത്തിനായി സമർപ്പിച്ച കിന്നരങ്ങൾ എന്നിങ്ങനെ അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: പോലെ തോന്നിയ
  rationale: ദർശനത്തിൽ കണ്ടത് കൃത്യമായി അതുതന്നെയാണെന്ന് നിർവചിക്കാതെ, കാഴ്ചയിലെ സാദൃശ്യം സൂചിപ്പിക്കുന്നു.
- source_word: θάλασσαν ὑαλίνην
  choice: ഒരു സ്ഫടികക്കടൽ
  rationale: ὑάλινος സൂചിപ്പിക്കുന്ന ഗ്ലാസ്/സ്ഫടികസദൃശമായ ദൃശ്യഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; വാക്യത്തിലെ ആവർത്തനത്തിലും ഇതേ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: μεμιγμένην πυρί
  choice: തീയോടു കലർന്ന
  rationale: അസാധാരണമായ സംയുക്തദൃശ്യം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τοὺς νικῶντας
  choice: വിജയം നേടിയവർ
  rationale: വെളിപ്പാടിലെ νικάω എന്ന പദത്തിന്റെ ജയിക്കുക/അതിജീവിക്കുക എന്ന ആശയം സൈനിക അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκ τοῦ θηρίου ... καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ
  choice: മൃഗത്തിന്മേലും അതിന്റെ പ്രതിമയ്ക്കുമേലും അതിന്റെ പേരിന്റെ സംഖ്യയ്ക്കുമേലും
  rationale: νικάωയോടൊപ്പമുള്ള ആവർത്തിത ἐκ ഇവിടെ ശത്രുശക്തികൾക്കുമേലുള്ള വിജയം സൂചിപ്പിക്കുന്നതായി പ്രധാനവാചകത്തിൽ നൽകുന്നു; മൂന്നു ഘടകങ്ങളുടെയും സമാന്തരത സംരക്ഷിക്കുന്നു. 'അവയുടെ അധികാരത്തിൽനിന്ന് പുറത്തുവന്നവർ' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: ആ സ്ഫടികക്കടലിന്മേൽ നിൽക്കുന്നത്
  rationale: ἐπί + accusative നൽകുന്ന ശ്രദ്ധേയമായ 'കടലിന്മേൽ' എന്ന ദർശനചിത്രം ദുർബലമാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: κιθάρας τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വീണകൾ
  rationale: κιθάραയെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന 'വീണ' എന്നു നൽകുന്നു; τοῦ θεοῦയിലെ ഉടമസ്ഥത, ഉറവിടം, സമർപ്പണം എന്നീ സാധ്യതകൾ തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: νικῶντας എന്നതിനുശേഷമുള്ള ആവർത്തിത ἐκ, ജയിച്ചവരും മൃഗവും തമ്മിലുള്ള ബന്ധം എങ്ങനെ സൂചിപ്പിക്കുന്നു
  choice: മൃഗത്തിന്മേലും അതിന്റെ പ്രതിമയ്ക്കുമേലും അതിന്റെ പേരിന്റെ സംഖ്യയ്ക്കുമേലും അവർ വിജയം നേടിയതായി പ്രധാനവാചകത്തിൽ അവതരിപ്പിക്കുന്നു.
  alternative: മൃഗത്തിന്റെയും അതിന്റെ പ്രതിമയുടെയും അതിന്റെ പേരിന്റെ സംഖ്യയുടെയും അധികാരത്തിൽനിന്ന് അവർ പുറത്തുവന്നവരോ വിടുവിക്കപ്പെട്ടവരോ ആണെന്ന വായന.
  rationale: വെളിപ്പാടിലെ νικάωയുടെ ജയമെന്ന പ്രമേയവും മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗവും പ്രധാനവാചകത്തെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ ἐκയുടെ അടിസ്ഥാനമായ 'നിന്ന്/പുറത്ത്' എന്ന അർഥം മറ്റൊരു സൂക്ഷ്മത അനുവദിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: κιθάρας τοῦ θεοῦ എന്നതിലെ ജനിറ്റീവിന്റെ ബന്ധം
  choice: ദൈവത്തിന്റെ വീണകൾ
  alternative: ദൈവം നൽകിയ വീണകൾ, അല്ലെങ്കിൽ ദൈവത്തിനായി സമർപ്പിച്ച വീണകൾ
  rationale: ഉടമസ്ഥത, ഉറവിടം, സമർപ്പണം എന്നിവയിൽ ഒന്ന് നിർബന്ധമായി തിരഞ്ഞെടുത്ത് ദൈവശാസ്ത്രപരമായ അർഥം ചേർക്കാതെ ഗ്രീക്ക് ഘടനയുടെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദർശനഭാഷയുടെ അപൂർവത നിലനിർത്താൻ ‘സ്ഫടികക്കടൽ’, ‘കടലിന്മേൽ’ എന്നിവ ഉപയോഗിച്ചു. ‘കിന്നരങ്ങൾ’ എന്ന കുറച്ച് പരിചിതമായ പദത്തിന് പകരം വ്യാപകമായി ഗ്രഹിക്കാവുന്ന ‘വീണകൾ’ തിരഞ്ഞെടുത്തു.
