id: REV.15.7
reference: Revelation 15:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: ml
  text: നാലു ജീവികളിൽ ഒന്ന്, എന്നേക്കും ജീവിക്കുന്ന ദൈവത്തിന്റെ ക്രോധം നിറഞ്ഞ ഏഴു സ്വർണക്കിണ്ണങ്ങൾ[a] ആ ഏഴു ദൂതന്മാർക്കു കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഏഴു സ്വർണപ്പാത്രങ്ങൾ’; ഗ്രീക്കുപദം കിണ്ണംപോലെയുള്ള, വീതിയേറിയതും ആഴം കുറഞ്ഞതുമായ ഒരു പാത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: നാലു ജീവികളിൽ ഒന്ന്
  rationale: വെളിപ്പാടിലെ സിംഹാസനമുറിയിലെ ജീവസത്തകളെയാണ് ζῷον സൂചിപ്പിക്കുന്നത്; θηρίον എന്ന ‘മൃഗം’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്താൻ ‘ജീവികൾ’ യോജിക്കുന്നു.
- source_word: ἔδωκεν
  choice: കൊടുത്തു
  rationale: δίδωμι എന്ന ക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ ഭൂതകാല വിവർത്തനം.
- source_word: τοῖς ἑπτὰ ἀγγέλοις
  choice: ആ ഏഴു ദൂതന്മാർക്കു
  rationale: അപോകലിപ്റ്റിക് സന്ദർഭത്തിൽ ἄγγελος സ്വർഗീയ ദൂതന്മാരെ സൂചിപ്പിക്കുന്നു; മുമ്പ് പരാമർശിക്കപ്പെട്ട പ്രത്യേക ഏഴുപേരെന്ന നിർദ്ദിഷ്ടത ‘ആ’കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: ഏഴു സ്വർണപ്പാത്രങ്ങൾ
  rationale: φιάλη വീതിയേറിയ, ആഴം കുറഞ്ഞ പാത്രമാണ്; ആകൃതിയെ അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പറയാൻ ‘പാത്രങ്ങൾ’ തിരഞ്ഞെടുത്തു. പദത്തിന്റെ കൂടുതൽ കൃത്യമായ പാത്രരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: γεμούσας τοῦ θυμοῦ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ക്രോധം നിറഞ്ഞ
  rationale: γέμω + genitive എന്ന ഘടനയുടെ നിറഞ്ഞിരിപ്പ് സംരക്ഷിക്കുന്നു; θυμός ഇവിടെ ദൈവിക ന്യായവിധിയുടെ തീവ്രമായ ക്രോധത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ക്രോധം’ ഉപയോഗിച്ചു.
- source_word: τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നേക്കും ജീവിക്കുന്ന
  rationale: വർത്തമാന കൃതന്തമായ ζῶντος ദൈവത്തെ വിശേഷിപ്പിക്കുന്നു; εἰς τοὺς αἰῶνας τῶν αἰώνων എന്ന അനന്തകാലസൂചക പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘എന്നേക്കും’ എന്നു നൽകി.
theological_decisions:
- issue: ദൈവിക θυμός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദൈവത്തിന്റെ ക്രോധം
  alternative: ദൈവത്തിന്റെ കോപം / ദൈവത്തിന്റെ ഉഗ്രകോപം
  rationale: അന്ത്യന്യായവിധിയുടെ ഗൗരവവും തീവ്രതയും ‘ക്രോധം’ നിലനിർത്തുന്നു; വെറും വികാരാവസ്ഥയായി ചുരുക്കുകയോ ഗ്രീക്കിനപ്പുറം തീവ്രത കൂട്ടുകയോ ചെയ്യുന്നില്ല.
- issue: ദൈവത്തിന്റെ ജീവനും നിത്യതയും തമ്മിലുള്ള ബന്ധം
  choice: എന്നേക്കും ജീവിക്കുന്ന ദൈവം
  alternative: യുഗയുഗാന്തരങ്ങളോളം ജീവിക്കുന്ന ദൈവം / എന്നെന്നേക്കും ജീവിക്കുന്നവനായ ദൈവം
  rationale: τοῦ ζῶντος ദൈവത്തെ വിശേഷിപ്പിക്കുന്നതും തുടർന്നുള്ള കാലപ്രയോഗം ആ ജീവന്റെ അനന്തത സൂചിപ്പിക്കുന്നതും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ ഒരുമിച്ചു നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ പ്രധാന ക്രമം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും, ‘എന്നേക്കും ജീവിക്കുന്ന’ എന്ന വിശേഷണം ആരെ സൂചിപ്പിക്കുന്നുവെന്നത് മലയാളത്തിൽ വ്യക്തമായി വരാൻ ‘ദൈവത്തിന്റെ’ മുമ്പിൽ ചേർത്തു. ‘ആ ഏഴു ദൂതന്മാർ’ എന്ന പ്രയോഗം നിർദ്ദിഷ്ടത സംരക്ഷിക്കുന്നു.
