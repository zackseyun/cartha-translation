  to: നാലു ജീവികളിൽ ഒന്ന്, എന്നേക്കും ജീവിക്കുന്ന ദൈവത്തിന്റെ ക്രോധം നിറഞ്ഞ ഏഴു സ്വർണക്കിണ്ണങ്ങൾ[a] ആ ഏഴു ദൂതന്മാർക്കു കൊടുത്തു.
  rationale: The revision replaces the generic «സ്വർണപ്പാത്രങ്ങൾ» with «സ്വർണക്കിണ്ണങ്ങൾ» to represent φιάλαι more precisely while retaining natural modern Malayalam. The footnote preserves the broader alternative and explains the vessel sense. No other change is needed.
