id: REV.15.1
reference: Revelation 15:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: ml
  text: 'പിന്നെ സ്വർഗത്തിൽ മഹത്തായതും അത്ഭുതകരവുമായ മറ്റൊരു അടയാളം ഞാൻ കണ്ടു: അവസാനത്തെ ഏഴു ബാധകളുള്ള ഏഴു ദൂതന്മാരെ. എന്തെന്നാൽ, അവയിൽ ദൈവത്തിന്റെ ക്രോധം പൂർത്തിയായി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവസാനിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: അടയാളം
  rationale: വെളിപ്പാടിലെ ദൃശ്യവും പ്രതീകാത്മകവുമായ പ്രതിഭാസത്തിന് സ്വാഭാവികവും സ്ഥിരവുമായ മലയാള പദം.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: സന്ദർഭം ദൃശ്യമായ ആകാശത്തെക്കാൾ സ്വർഗീയ മണ്ഡലത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: μέγα καὶ θαυμαστόν
  choice: മഹത്തും അത്ഭുതകരവുമായ
  rationale: വലുപ്പം/പ്രാധാന്യം, വിസ്മയം എന്നീ രണ്ടു ഗുണങ്ങളും മാന്യമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας
  choice: അവസാനത്തെ ഏഴു ബാധകൾ കൈവശമുള്ള ഏഴു ദൂതന്മാർ
  rationale: പങ്കുപദഘടനയും ഏഴ് എന്ന ആവർത്തനവും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: πληγὰς
  choice: ബാധകൾ
  rationale: ദൈവിക ന്യായവിധിയുടെ വിനാശകരമായ പ്രഹരങ്ങൾ എന്ന അർഥം ബൈബിൾസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: അവ അവസാനത്തേതാകുന്നതിനുള്ള കാരണബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐν αὐταῖς ἐτελέσθη
  choice: അവയിൽ ... പൂർത്തിയായി
  rationale: ἐν എന്നതിന്റെ സ്ഥിതിവാചക രൂപവും τελέωയുടെ പര്യവസാന/പൂർത്തീകരണ ഭാവവും അടുത്തായി നിലനിർത്തുന്നു.
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ക്രോധം
  rationale: അപ്പോക്കലിപ്റ്റിക് ന്യായവിധിയിലെ ദൈവിക രോഷത്തിന്റെ ഗൗരവം മൃദൂകരിക്കാതെയും അതിശയോക്തിയാക്കാതെയും നൽകുന്നു.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന θυμός
  choice: ദൈവത്തിന്റെ ക്രോധം
  alternative: ദൈവത്തിന്റെ കോപം
  rationale: ‘ക്രോധം’ ഈ സന്ദർഭത്തിലെ തീവ്രവും ന്യായവിധിപരവുമായ ഭാവം നിലനിർത്തുന്നു; വെറും വികാരപ്രകടനമെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- issue: ἐτελέσθηയുടെ പൂർത്തീകരണഭാവം
  choice: പൂർത്തിയായി
  alternative: അവസാനിച്ചു
  rationale: ദൈവത്തിന്റെ ക്രോധം ഈ ബാധകളിൽ ഉദ്ദേശിച്ച പര്യവസാനത്തിലെത്തുന്നു എന്ന ആശയം നിലനിർത്തുന്നു; എല്ലാ ന്യായവിധിയും ഇതോടെ തീർന്നു എന്ന വിപുലമായ നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ദർശനവിവരണത്തിന്റെ ഉയർന്ന ഭാവം നിലനിർത്തുന്നു; ‘കൈവശമുള്ള’ എന്നത് ἔχοντας എന്ന പങ്കുപദത്തിന്റെ ബന്ധം വ്യക്തമായി നൽകുന്നു.
