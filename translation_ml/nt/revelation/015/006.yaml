id: REV.15.6
reference: Revelation 15:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: ml
  text: ഏഴു ബാധകളുള്ള ഏഴു ദൂതന്മാർ വിശുദ്ധമന്ദിരത്തിൽനിന്ന്[a] പുറത്തുവന്നു. അവർ ശുദ്ധവും തിളക്കമുള്ളതുമായ ചണവസ്ത്രം ധരിച്ചിരുന്നു[b]; നെഞ്ചിനു ചുറ്റും സ്വർണപ്പട്ടകൾ കെട്ടിയിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദേവാലയത്തിൽനിന്ന്’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദമായ ναός സാധാരണയായി ദേവാലയസമുച്ചയം മുഴുവനെയല്ല, അതിലെ വിശുദ്ധമന്ദിരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘നിർമലവും പ്രകാശിക്കുന്നതുമായ ചണവസ്ത്രം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ‘നെഞ്ചിനു ചുറ്റും സ്വർണക്കച്ചകൾ ധരിച്ചിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: പുറത്തുവന്നു
  rationale: പുറത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്ന ἐξέρχομαι എന്ന ക്രിയയുടെ സ്വാഭാവികവും സമകാലികവുമായ മലയാളരൂപം.
- source_word: ἄγγελοι
  choice: ദൂതന്മാർ
  rationale: വെളിപ്പാടിലെ സ്വർഗീയ ദർശനസന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരല്ല, സ്വർഗീയ ദൂതന്മാരാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: πληγάς
  choice: ബാധകൾ
  rationale: ദൈവിക ന്യായവിധിയായി വരുന്ന പ്രഹരങ്ങളെയോ മഹാദുരന്തങ്ങളെയോ സൂചിപ്പിക്കുന്ന പദം; വെളിപ്പാടിന്റെ സന്ദർഭത്തിൽ ‘ബാധകൾ’ സ്വാഭാവികമാണ്.
- source_word: ναοῦ
  choice: വിശുദ്ധമന്ദിരം
  rationale: മുഴുവൻ ദേവാലയസമുച്ചയത്തെക്കാൾ വിശുദ്ധമായ അകത്തെ മന്ദിരത്തെ സൂചിപ്പിക്കുന്ന ναός എന്ന പദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: ἐνδεδυμένοι
  choice: ധരിച്ചിരുന്നു
  rationale: വസ്ത്രം ധരിച്ച നിലയെ സൂചിപ്പിക്കുന്ന കൃതന്തത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λίνον
  choice: ചണവസ്ത്രം
  rationale: ചണനാരുകൊണ്ടുള്ള വസ്ത്രം എന്ന മൂലാർഥം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ ‘നേർത്ത’ എന്ന പ്രത്യേക വിശേഷണം ഇല്ല.
- source_word: καθαρὸν
  choice: ശുദ്ധമായ
  rationale: ‘വൃത്തിയുള്ള’ എന്നും ‘നിർമലമായ’ എന്നും അർഥമാകാവുന്ന പദത്തിന് ഈ വിശുദ്ധമന്ദിരസന്ദർഭത്തിൽ സ്വാഭാവികമായ തിരഞ്ഞെടുപ്പ്.
- source_word: λαμπρὸν
  choice: തിളക്കമുള്ള
  rationale: പ്രകാശമോ ദീപ്തിയോ സൂചിപ്പിക്കുന്ന വിശേഷണത്തെ വ്യക്തമായി നൽകുന്നു.
- source_word: περιεζωσμένοι
  choice: ചുറ്റും … കെട്ടിയിരുന്നു
  rationale: സ്വയം ചുറ്റിക്കെട്ടിയ നിലയെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ദൃശ്യരൂപം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: περὶ τὰ στήθη
  choice: നെഞ്ചിനു ചുറ്റും
  rationale: പട്ടകൾ അരയിലല്ല, നെഞ്ചിന്റെ ഭാഗത്താണ് ചുറ്റിയിരുന്നതെന്ന അസാധാരണ സ്ഥാനവിവരം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ζώνας χρυσᾶς
  choice: സ്വർണപ്പട്ടകൾ
  rationale: ζώνη എന്നത് അരപ്പട്ടയോ കച്ചയോ പട്ടയോ ആകാം; ഇവിടെ നെഞ്ചിനു ചുറ്റുമാകയാൽ ‘സ്വർണപ്പട്ടകൾ’ ദൃശ്യത്തിന് കൂടുതൽ യോജിക്കുന്നു.
theological_decisions:
- issue: സ്വർഗീയ ദേവാലയസന്ദർഭത്തിലെ ναός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിശുദ്ധമന്ദിരം
  alternative: ദേവാലയം
  rationale: ദൂതന്മാർ പുറപ്പെടുന്നത് ദൈവത്തിന്റെ സ്വർഗീയ വാസസ്ഥാനമായ അകത്തെ വിശുദ്ധസ്ഥലത്തുനിന്നാണെന്ന പ്രത്യേകത ‘വിശുദ്ധമന്ദിരം’ നിലനിർത്തുന്നു; എന്നാൽ പദത്തിന് പൊതുവായി ‘ദേവാലയം’ എന്നും വിവർത്തനം സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ദർശനവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മൂലപാഠത്തിലെ വസ്ത്രത്തിന്റെയും നെഞ്ചിനു ചുറ്റിയ സ്വർണപ്പട്ടകളുടെയും ദൃശ്യവിവരം അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
