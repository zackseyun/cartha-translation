id: REV.15.3
reference: Revelation 15:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the servant of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: ml
  text: 'അവർ ദൈവത്തിന്റെ ദാസനായ മോശെയുടെ ഗീതവും കുഞ്ഞാടിന്റെ ഗീതവും ഇങ്ങനെ ആലപിക്കുന്നു: “കർത്താവായ ദൈവമേ, സർവശക്തനേ, അങ്ങയുടെ പ്രവൃത്തികൾ മഹത്തായതും അത്ഭുതകരവുമാണ്; യുഗങ്ങളുടെ രാജാവേ[a], അങ്ങയുടെ വഴികൾ നീതിയുള്ളവയും സത്യമായവയുമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “യുഗങ്ങളുടെ രാജാവേ” എന്നതിനുപകരം “ജനതകളുടെ രാജാവേ” എന്നു കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: ആലപിച്ചുകൊണ്ട് പറയുന്നു
  rationale: വർത്തമാനകാല ദർശനവിവരണത്തിന്റെ സജീവത നിലനിർത്തുന്നു; λέγοντες-നോടുള്ള ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ᾠδὴν
  choice: ഗീതം
  rationale: ഉന്നതമായ സ്തുതിഗാനസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പദം; നിർബന്ധമില്ലാത്ത പ്രത്യേക ആരാധനാക്രമഭാവം ചേർക്കുന്നില്ല.
- source_word: δούλου
  choice: ദാസനായ
  rationale: മോശെ ദൈവത്തിന്റേതാണെന്നും ദൈവനിയോഗത്തിൽ സേവിക്കുന്നവനാണെന്നും സൂചിപ്പിക്കുന്ന δοῦλος എന്ന പദത്തിന്റെ ബന്ധിതത്വവും സേവനഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ἀρνίου
  choice: കുഞ്ഞാട്
  rationale: വെളിപ്പാടുപുസ്തകത്തിലെ ക്രിസ്തുസംബന്ധിയായ ശീർഷകവും ബലിമൃഗപ്രതീകവും സംരക്ഷിക്കുന്നു.
- source_word: Μεγάλα καὶ θαυμαστὰ
  choice: മഹത്തും അത്ഭുതകരവും
  rationale: ദൈവത്തിന്റെ പ്രവൃത്തികളുടെ വലിപ്പവും വിസ്മയജനകതയും ഉയർന്നെങ്കിലും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഭാഷയിൽ നൽകുന്നു.
- source_word: ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനങ്ങളെയും ചെയ്തികളെയും സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള, പതിവായ മലയാളപരിഭാഷ.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: കർത്താവായ ദൈവമേ, സർവശക്തനേ
  rationale: കർത്താവ്, ദൈവം, സർവശക്തൻ എന്നീ മൂന്നു ഘടകങ്ങളും അഭിസംബോധനാരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: δίκαιαι καὶ ἀληθιναὶ
  choice: നീതിയുള്ളവയും സത്യമായവയും
  rationale: ദൈവത്തിന്റെ വഴികളുടെ നീതിയും സത്യസ്വഭാവവും വേർതിരിച്ചു സംരക്ഷിക്കുന്ന നേരിട്ടുള്ള പ്രയോഗം.
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: യുഗങ്ങളുടെ രാജാവേ
  rationale: നൽകിയ SBLGNT പാഠത്തിലെ αἰώνων എന്ന പദത്തെ നേരിട്ട് പിന്തുടരുകയും അഭിസംബോധന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മോശെയെ വിശേഷിപ്പിക്കുന്ന δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ദൈവത്തിന്റെ ദാസനായ മോശെ
  alternative: ദൈവത്തിന്റെ സേവകനായ മോശെ / ദൈവത്തിന്റെ അടിമയായ മോശെ
  rationale: ‘സേവകൻ’ ബന്ധിതത്വത്തിന്റെ ശക്തി കുറയ്ക്കാം; ‘അടിമ’ ആധുനിക മലയാളത്തിൽ അനാവശ്യമായ അപമാനഭാവം ഉണർത്താം. ‘ദാസൻ’ ഉടമസ്ഥതയും നിയോഗിതസേവനവും ഗൗരവത്തോടെ നിലനിർത്തുന്നു.
- issue: വാക്യാവസാനത്തിലെ രാജശീർഷകത്തിന്റെ പാഠഭേദം
  choice: യുഗങ്ങളുടെ രാജാവ്
  alternative: ജനതകളുടെ രാജാവ്
  rationale: പ്രധാനപാഠം നൽകിയ SBLGNT-യിലെ αἰώνων പിന്തുടരുന്നു; പ്രധാനപ്പെട്ട ἐθνῶν പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള സ്തുതിഗീതശൈലി സ്വീകരിച്ചു. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; വാക്യത്തിലെ സമാന്തര ഘടനയും ദൈവശീർഷകങ്ങളും വ്യക്തമായി നിലനിർത്തി.
