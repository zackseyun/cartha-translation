  rationale: തിരുത്തൽ മുഖ്യമായും ശൈലീപരമാണ്. ശക്തമായ ഗ്രീക്ക് ആലങ്കാരികനിഷേധം, ദൈവത്തിന്റെ വിശുദ്ധി, ജനതകളുടെ വരവും ആരാധനയും, δικαιώματαയുടെ വിശാലമായ അർഥസാധ്യത എന്നിവ മാറ്റാതെ, വാക്യത്തെ സ്വാഭാവിക ആധുനിക മലയാളത്തിലാക്കി. അടിക്കുറിപ്പും ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിലെ ‘judicial verdicts or ordinances’ എന്ന അർഥപരിധി വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നവിധം പരിഷ്കരിച്ചു.
