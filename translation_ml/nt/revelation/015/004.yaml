id: REV.15.4
reference: Revelation 15:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: ml
  text: കർത്താവേ, അങ്ങയെ ഭയപ്പെടാതെയും അങ്ങയുടെ നാമത്തെ മഹത്വപ്പെടുത്താതെയും ഇരിക്കുന്നത് ആരാണ്? അങ്ങ് മാത്രം പരിശുദ്ധനല്ലോ. സകല ജനതകളും വന്ന് അങ്ങയുടെ സന്നിധിയിൽ ആരാധിക്കും; കാരണം, അങ്ങയുടെ നീതിയുള്ള പ്രവൃത്തികൾ[a] വെളിപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീതിയുള്ള വിധികൾ.” ഗ്രീക്ക് പദത്തിന് ന്യായവിധികളെയോ നിയമങ്ങളെയോ സൂചിപ്പിക്കാനും കഴിയും; എന്നാൽ ഇവിടെ വെളിപ്പെട്ട ദൈവത്തിന്റെ നീതിയുള്ള പ്രവൃത്തികളെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: ആരാണ് അങ്ങയെ ഭയപ്പെടാതിരിക്കുക?
  rationale: οὐ μή ഉൾപ്പെട്ട ചോദ്യം ‘ആരും അങ്ങനെ ചെയ്യാതിരിക്കില്ല’ എന്ന ശക്തമായ ആലങ്കാരിക അർഥം നൽകുന്നു. മലയാളത്തിൽ നിഷേധരൂപത്തിലുള്ള ചോദ്യം ആ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന പദത്തിന്റെ സംബോധനരൂപം; ദൈവത്തോടുള്ള നേരിട്ടുള്ള, മാന്യമായ അഭിസംബോധനയായി ‘കർത്താവേ’ സ്വാഭാവികമാണ്.
- source_word: δοξάσει τὸ ὄνομά σου
  choice: അങ്ങയുടെ നാമത്തെ മഹത്ത്വപ്പെടുത്തുക
  rationale: δοξάζω എന്നതിന്റെ മഹത്ത്വപ്പെടുത്തുക/മഹത്ത്വം നൽകുക എന്ന ആശയവും ‘നാമം’ എന്ന ബൈബിൾ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: μόνος ὅσιος
  choice: അങ്ങ് മാത്രം പരിശുദ്ധൻ
  rationale: ദൈവത്തെക്കുറിച്ചുള്ള സ്തുതിവാക്യത്തിൽ ὅσιος സൂചിപ്പിക്കുന്ന നൈതിക-ആരാധനാപരമായ വിശുദ്ധി ‘പരിശുദ്ധൻ’ വ്യക്തമായി നൽകുന്നു.
- source_word: πάντα τὰ ἔθνη
  choice: സകല ജനതകളും
  rationale: ἔθνη എന്നതിന്റെ ജനവിഭാഗങ്ങളെയും രാജ്യജനങ്ങളെയും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘വിജാതീയർ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: ἥξουσιν
  choice: വരും
  rationale: പ്രവചനാത്മകമായ ഭാവികാലത്തെ ലളിതവും സ്വാഭാവികവുമായി രേഖപ്പെടുത്തുന്നു.
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: അങ്ങയുടെ സന്നിധിയിൽ ആരാധിക്കും
  rationale: προσκυνέωയുടെ മതപരമായ ആരാധനാഭാവവും ἐνώπιόν σου എന്നതിന്റെ ‘സന്നിധിയിൽ/മുമ്പാകെ’ എന്ന സ്ഥാനബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: τὰ δικαιώματά σου
  choice: അങ്ങയുടെ നീതിയുള്ള പ്രവൃത്തികൾ
  rationale: δικαίωμα എന്ന പദത്തിന് നീതിപ്രവൃത്തി, വിധി, ചട്ടം എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ വെളിവായ ദൈവനീതിയെ സ്തുതിക്കുന്നതിനാൽ ‘നീതിയുള്ള പ്രവൃത്തികൾ’ വിശാലത നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐφανερώθησαν
  choice: വെളിപ്പെട്ടിരിക്കുന്നു
  rationale: സംഭവിച്ച വെളിപ്പെടുത്തലിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി പ്രകടമാക്കുന്നു; ഗ്രീക്ക് നിഷ്ക്രിയരൂപത്തിന്റെ ഫലാവസ്ഥയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവത്തെ വിശേഷിപ്പിക്കുന്ന ὅσιος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പരിശുദ്ധൻ
  alternative: വിശ്വസ്തൻ / ഭക്തിയുള്ളവൻ
  rationale: ഈ സ്തുതിസന്ദർഭത്തിൽ ദൈവത്തിന്റെ അതുല്യമായ നൈതികവും ആരാധനാപരവുമായ വിശുദ്ധിയാണ് മുൻനിരയിൽ. ‘പരിശുദ്ധൻ’ അതിനെ സംരക്ഷിക്കുന്നു; ‘ഭക്തിയുള്ളവൻ’ ദൈവത്തെക്കുറിച്ച് അസ്വാഭാവികമാണ്.
- issue: അന്ത്യകാല ന്യായവിധിയുടെ സന്ദർഭത്തിലെ δικαιώματα
  choice: നീതിയുള്ള പ്രവൃത്തികൾ
  alternative: നീതിയുള്ള വിധികൾ / നീതിനിയമങ്ങൾ
  rationale: സകല ജനതകൾക്കും വെളിവായ ദൈവനീതിയുടെ പ്രകടനങ്ങളെയാണ് സന്ദർഭം ആഘോഷിക്കുന്നത്. മുഖ്യപാഠം പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു; ന്യായവിധി എന്ന നിയമപരമായ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ആരാധനാപരവുമായ ശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. വാക്യത്തിന്റെ ശക്തമായ ആലങ്കാരിക ചോദ്യഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി സമാന്തര നിഷേധക്രിയകൾ ചേർത്തു.
