id: REV.15.8
reference: Revelation 15:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: ml
  text: ദൈവത്തിന്റെ മഹത്വത്തിൽനിന്നും അവിടുത്തെ ശക്തിയിൽനിന്നും വന്ന പുകകൊണ്ട് വിശുദ്ധമന്ദിരം നിറഞ്ഞു[a]. ഏഴ് ദൂതന്മാരുടെ ഏഴ് ബാധകളും പൂർത്തിയാകുന്നതുവരെ വിശുദ്ധമന്ദിരത്തിൽ പ്രവേശിക്കാൻ ആർക്കും കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘വിശുദ്ധമന്ദിരം’ എന്നതിന് ‘ആലയം’ എന്നും പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: ναός). എന്നാൽ ഈ പദം വിശാലമായ ആലയസമുച്ചയത്തെക്കാൾ പ്രത്യേകമായി ഉള്ളിലെ വിശുദ്ധ വാസസ്ഥാനത്തെ പലപ്പോഴും സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: വിശുദ്ധമന്ദിരം
  rationale: ναός ഇവിടെ വിശാലമായ ആലയസമുച്ചയത്തെക്കാൾ ദൈവത്തിന്റെ വിശുദ്ധ വാസസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധമന്ദിരം’ ഈ പ്രത്യേകത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐγεμίσθη
  choice: നിറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ഭൂതകാല കർമണിപ്രയോഗത്തിന്റെ ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: καπνοῦ
  choice: പുകകൊണ്ട്
  rationale: γεμίζω-യോടൊപ്പമുള്ള ഷഷ്ഠീവിഭക്തി നിറയ്ക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; ദൈവപ്രത്യക്ഷതയുടെ ദൃശ്യസന്ദർഭത്തിൽ ‘പുക’ യോജിക്കുന്നു.
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ
  choice: ദൈവത്തിന്റെ മഹത്വത്തിൽനിന്നും അവിടുത്തെ ശക്തിയിൽനിന്നും ഉയർന്ന
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടബന്ധം ‘-ൽനിന്നും’ കൊണ്ട് നിലനിർത്തി. പുക ഈ രണ്ടിൽനിന്നും വരുന്നു എന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ഉയർന്ന’ എന്നു ചേർത്ത് സ്വാഭാവികമാക്കി.
- source_word: οὐδεὶς ἐδύνατο εἰσελθεῖν
  choice: പ്രവേശിക്കാൻ ആർക്കും കഴിഞ്ഞില്ല
  rationale: തുടർന്നുനിന്ന അസാധ്യതയെ ലളിതവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄχρι τελεσθῶσιν
  choice: പൂർത്തിയാകുന്നതുവരെ
  rationale: കാലപരിധിയും ബാധകൾ സമാപിക്കുന്ന ഫലാർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: πληγαὶ
  choice: ബാധകൾ
  rationale: വെളിപ്പാട് പുസ്തകത്തിലെ ദൈവിക ന്യായവിധിയുടെ പ്രഹരങ്ങളെയോ മഹാവിപത്തുകളെയോ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികമായ പദമാണ്.
- source_word: τῶν ἑπτὰ ἀγγέλων
  choice: ഏഴ് ദൂതന്മാരുടെ
  rationale: ബാധകൾ ഏഴ് ദൂതന്മാരുമായി ബന്ധപ്പെട്ടവയാണെന്ന ഷഷ്ഠീബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; അവർ അവ വഹിക്കുന്നവരോ നടപ്പാക്കുന്നവരോ എന്നത് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: അപോകലിപ്റ്റിക് സ്വർഗീയ ആരാധനാസന്ദർഭത്തിൽ ναός എന്നതിന്റെ പരിഭാഷ
  choice: വിശുദ്ധമന്ദിരം
  alternative: ആലയം
  rationale: ‘വിശുദ്ധമന്ദിരം’ മുഴുവൻ ആലയപരിസരത്തെയല്ല, ദൈവത്തിന്റെ ഉള്ളിലെ വിശുദ്ധ വാസസ്ഥാനത്തെയാണ് കൂടുതൽ കൃത്യമായി സൂചിപ്പിക്കുന്നത്; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: പുകയുടെ ഉറവിടമായി മഹത്വവും ശക്തിയും
  choice: രണ്ടും പുകയുടെ ഉറവിടങ്ങളായി സമാന്തരമായി നിലനിർത്തി
  alternative: ശക്തിയെ മഹത്വത്തിന്റെ വിശദീകരണമായി കാണുക
  rationale: ആവർത്തിച്ചുള്ള ἐκ രണ്ട് ഘടകങ്ങളെയും സമാന്തര ഉറവിടങ്ങളായി അവതരിപ്പിക്കുന്നു; അവയുടെ തത്ത്വശാസ്ത്രബന്ധം പരിഭാഷയിൽ നിർണയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. ‘അവിടുത്തെ’ ദൈവത്തോടുള്ള മാന്യസൂചനയായി ഉപയോഗിച്ചു. ആദ്യവാക്യത്തിലെ ഉറവിടബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘ഉയർന്ന’ ചേർത്തിരിക്കുന്നു; ഇത് ഗ്രീക്കിലെ ἐκ-യുടെ അർഥം വിശദമാക്കുന്നതാണ്, പുതിയ ആശയം ചേർക്കുന്നതല്ല.
