    text: ‘ആലയം’ എന്നതിന് ‘വിശുദ്ധമന്ദിരം’ എന്നും വിവർത്തനം ചെയ്യാം; ναός എന്ന പദം വിശാലമായ ദേവാലയസമുച്ചയത്തേക്കാൾ അകത്തെ വിശുദ്ധസ്ഥാനത്തിന് ഊന്നൽ നൽകാം.
