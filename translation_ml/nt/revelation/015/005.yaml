    reason: cross_reference
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: ഇവയ്ക്കുശേഷം
  rationale: തുടർച്ച സൂചിപ്പിക്കുന്ന ബഹുവചന പ്രയോഗമായ μετὰ ταῦτα യുടെ അർത്ഥം നിലനിർത്തുന്നു. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ Καὶ പ്രത്യേകം ‘പിന്നെ’ എന്നു ചേർക്കാതെതന്നെ ഈ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: ദർശനത്തിൽ യോഹന്നാനുണ്ടായ നേരിട്ടുള്ള കാഴ്ചാനുഭവത്തെ ലളിതമായും കൃത്യമായും അറിയിക്കുന്നു.
- source_word: ἠνοίγη
  choice: തുറക്കപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ ഭൂതകാല കർമണിപ്രയോഗം നിലനിർത്തുകയും ആലയം തുറന്ന അവസ്ഥയിലായി എന്ന സംഭവത്തെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ναὸς
  choice: ആലയം
  rationale: വിശാലമായ ദേവാലയസമുച്ചയത്തേക്കാൾ അകത്തെ വിശുദ്ധസ്ഥാനത്തെ സൂചിപ്പിക്കാവുന്ന ναός എന്ന പദത്തിന് പരിചിതവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. ‘വിശുദ്ധമന്ദിരം’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῆς σκηνῆς
  choice: കൂടാരത്തിന്റെ
  rationale: മരുഭൂമിയിലെ ദൈവസന്നിധിയുടെ കൂടാരത്തെ ഓർമിപ്പിക്കുന്ന പഴയനിയമ ആരാധനാപശ്ചാത്തലം നിലനിർത്തുന്നു.
- source_word: τοῦ μαρτυρίου
  choice: സാക്ഷ്യ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിസാക്ഷ്യവുമായി ബന്ധപ്പെട്ട സ്ഥിരമായ ആരാധനാപദസമുച്ചയമായ ‘സാക്ഷ്യകൂടാരം’ രൂപപ്പെടുത്തുന്നു.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിലുള്ള
  rationale: ആലയം ഭൂമിയിലല്ല, സ്വർഗീയ മണ്ഡലത്തിലാണെന്ന സ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സ്വർഗീയ വിശുദ്ധസ്ഥാനത്തിന്റെ ആരാധനാപരമായ ദൃശ്യഭാഷ
  choice: ‘സ്വർഗത്തിലുള്ള സാക്ഷ്യകൂടാരത്തിന്റെ ആലയം’ എന്ന സംയുക്തരൂപം നിലനിർത്തി
  alternative: ‘സ്വർഗീയ വിശുദ്ധമന്ദിരം’ എന്ന ലളിതവത്കരണം; അല്ലെങ്കിൽ ‘സ്വർഗത്തിലെ ആലയം, അതായത് സാക്ഷ്യകൂടാരം’
  rationale: ഗ്രീക്കിലെ തുടർച്ചയായ ബന്ധവിഭക്തികൾ പഴയനിയമത്തിലെ സാക്ഷ്യകൂടാരത്തെയും വെളിപ്പാടിലെ സ്വർഗീയ ആലയത്തെയും ഒരുമിച്ച് അനുസ്മരിപ്പിക്കുന്നു. അവയുടെ ബന്ധം വിശദീകരിച്ചു തീർക്കാതെ മൂലപാഠത്തിലെ സാന്ദ്രതയും സാധ്യതയുള്ള അർത്ഥവൈവിധ്യവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ ആരാധനാപരമായ ബന്ധപദങ്ങൾ ലളിതവത്കരിക്കാതെ സൂക്ഷിച്ചു; വായനാസൗകര്യത്തിനായി ദർശനവിവരണത്തിനു ശേഷം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
