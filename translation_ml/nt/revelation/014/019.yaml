id: REV.14.19
reference: Revelation 14:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: ml
  text: ദൂതൻ ഭൂമിയിലേക്കു തന്റെ അരിവാൾ വീശി, ഭൂമിയിലെ മുന്തിരിവള്ളിയെ കൊയ്ത്, ദൈവക്രോധത്തിന്റെ വലിയ മുന്തിരിച്ചക്കിലേക്ക് എറിഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: തന്റെ അരിവാൾ ഭൂമിക്കുമീതെ വീശി
  rationale: ഇവിടെ βάλλω എന്നത് കൊയ്ത്തിനായി അരിവാൾ പ്രവർത്തിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; εἰς τὴν γῆν എന്നത് ലക്ഷ്യമായ ഭൂമിയിലേക്കുള്ള ചലനം പ്രകടമാക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ‘ഭൂമിക്കുമീതെ വീശി’ ഈ ദൃശ്യത്തെ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐτρύγησεν
  choice: കൊയ്ത്
  rationale: മുന്തിരിക്കുലകൾ ശേഖരിക്കുന്ന വിളവെടുപ്പാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പദം ‘കൊയ്ത്’ ആണ്.
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: ഭൂമിയിലെ മുന്തിരിവള്ളി
  rationale: ἄμπελος എന്ന ഏകവചനത്തെ നിലനിർത്തുന്നു; ഭൂമിയുടേതായ/ഭൂമിയിലെ മുന്തിരിവള്ളി എന്ന പ്രതീകാത്മക രൂപവും സംരക്ഷിക്കുന്നു.
- source_word: τὴν ληνὸν ... τὸν μέγαν
  choice: വലിയ മുന്തിരിച്ചക്കിൽ
  rationale: ληνός മുന്തിരി ചവിട്ടിപ്പിഴിയുന്ന ചക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘മുന്തിരിച്ചക്ക്’ ദൃശ്യവും പ്രവർത്തനവും എളുപ്പം ഗ്രഹിക്കാവുന്ന വിധം നൽകുന്നു.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ക്രോധമാകുന്ന
  rationale: ബന്ധസൂചക ഘടനയെ വെറും ഉടമസ്ഥതയായി മാത്രം വായിക്കാതെ, മുന്തിരിച്ചക്ക് ദൈവക്രോധത്തിന്റെ പ്രതീകമാണെന്ന രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മുന്തിരിച്ചക്കും ദൈവക്രോധവും തമ്മിലുള്ള ബന്ധം
  choice: ‘ദൈവത്തിന്റെ ക്രോധമാകുന്ന വലിയ മുന്തിരിച്ചക്ക്’
  alternative: ‘ദൈവക്രോധത്തിന്റെ വലിയ മുന്തിരിച്ചക്ക്’
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക പ്രയോഗത്തിന്റെ രൂപകാത്മക ശക്തി നിലനിർത്തിക്കൊണ്ട്, ചക്ക് ക്രോധത്തെ പ്രതിനിധാനം ചെയ്യുന്നു എന്നത് വായനക്കാരന് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു; അതിനപ്പുറം വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വെളിപ്പാടിലെ ശക്തമായ കൊയ്ത്ത്-ന്യായവിധി ദൃശ്യഭാഷ സംക്ഷിപ്തമായി നിലനിർത്തിയിരിക്കുന്നു.
