id: REV.14.13
reference: Revelation 14:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: ml
  text: 'ഞാൻ സ്വർഗത്തിൽനിന്ന് ഒരു ശബ്ദം പറയുന്നത് കേട്ടു: “എഴുതുക: ഇനിമുതൽ കർത്താവിൽ മരിക്കുന്ന മരിച്ചവർ ധന്യർ.” “അതെ,” ആത്മാവ് പറയുന്നു, “അവർ തങ്ങളുടെ അധ്വാനങ്ങളിൽനിന്ന് വിശ്രമിക്കേണ്ടതിന്[a]; അവരുടെ പ്രവൃത്തികൾ അവരോടൊപ്പം അനുഗമിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവർ തങ്ങളുടെ അധ്വാനങ്ങളിൽനിന്ന് വിശ്രമിക്കും.’ ഗ്രീക്ക് വാക്യഘടനയ്ക്ക് ഉദ്ദേശ്യത്തിന്റെയോ ഫലത്തിന്റെയോ ഭാവമുണ്ടാകാം.'
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ: ‘അവരുടെ പ്രവൃത്തികൾ അവരെ പിന്തുടരുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: സ്വർഗത്തിൽനിന്ന് ഒരു ശബ്ദം പറയുന്നതു
  rationale: φωνή എന്നത് സ്വാഭാവികമായി ‘ശബ്ദം’; ἐκ τοῦ οὐρανοῦ ഉത്ഭവം സൂചിപ്പിക്കുന്നതിനാൽ ‘സ്വർഗത്തിൽനിന്ന്’; λεγούσης എന്ന വർത്തമാന കൃദന്തത്തിന്റെ സംസാരപ്രവർത്തനം ‘പറയുന്നതു’ എന്നു നിലനിർത്തുന്നു.
- source_word: Γράψον
  choice: എഴുതുക
  rationale: ഏകവചന ഏറിസ്റ്റ് ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള കല്പന; ഗ്രീക്കിൽ ഇല്ലാത്ത കർമം ചേർത്തിട്ടില്ല.
- source_word: Μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: സാധാരണ സന്തോഷത്തെക്കാൾ ദൈവിക അംഗീകാരവും ഭാഗ്യാവസ്ഥയും ഉൾക്കൊള്ളുന്ന ഗൗരവമുള്ള ധന്യവചനഭാഷ.
- source_word: οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: കർത്താവിൽ മരിക്കുന്ന മരിച്ചവർ
  rationale: ‘മരിച്ചവർ’ എന്ന സമൂഹത്തെയും അവരെ വിശേഷിപ്പിക്കുന്ന ‘കർത്താവിൽ മരിക്കുന്നവർ’ എന്ന വർത്തമാന കൃദന്തരൂപത്തെയും നിലനിർത്തുന്നു; ἐν κυρίῳ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘കർത്താവിൽ’ എന്നു സംരക്ഷിക്കുന്നു.
- source_word: ἀπ’ ἄρτι
  choice: ഇനിമുതൽ
  rationale: പ്രഖ്യാപനം പ്രാബല്യത്തിൽ വരുന്ന കാലബിന്ദുവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: അതെ, ആത്മാവ് പറയുന്നു
  rationale: ναίയുടെ ഉറപ്പിക്കുന്ന ബലം ‘അതെ’ എന്നും വ്യക്തമായ കർത്താവായ τὸ πνεῦμα ‘ആത്മാവ്’ എന്നും നേരിട്ട് നൽകുന്നു.
- source_word: ἵνα ἀναπαήσονται
  choice: അവർ ... വിശ്രമിക്കേണ്ടതിനാണ്
  rationale: ἵναയുടെ ഉദ്ദേശ്യ/ഫല ഭാവവും ഭാവികാലക്രിയയുടെ മുന്നോട്ടുള്ള സൂചനയും മലയാളത്തിൽ സ്വാഭാവികമായി ഒരുമിച്ച് പ്രകടമാക്കുന്നു; വ്യാകരണത്തിലെ അസാധാരണത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: തങ്ങളുടെ അധ്വാനങ്ങളിൽനിന്ന്
  rationale: κόπος സൂചിപ്പിക്കുന്ന ക്ഷീണിപ്പിക്കുന്ന പ്രയത്നവും കഠിനാധ്വാനവും നിലനിർത്തുന്നു; വെറും മാനസികക്ലേശമായി ചുരുക്കുന്നില്ല.
- source_word: τὰ γὰρ ἔργα αὐτῶν
  choice: അവരുടെ പ്രവൃത്തികൾ
  rationale: ἔργα എന്ന വിശാലമായ പ്രവർത്തന/കർമപദത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളസമം.
- source_word: ἀκολουθεῖ μετ’ αὐτῶν
  choice: അവരോടൊപ്പം പിന്തുടരുന്നു
  rationale: ἀκολουθέωയുടെ ‘പിന്തുടരുക’ എന്ന ദൃശ്യഭാവവും μετάയുടെ ‘ഒപ്പം’ എന്ന ആശയവും രണ്ടും നിലനിർത്തുന്നു; ബഹുവചന നപുംസകലിംഗ കർത്താവിനോടുള്ള ഏകവചനക്രിയ ഗ്രീക്കിൽ സാധാരണമാണ്.
theological_decisions:
- issue: ‘കർത്താവിൽ’ എന്നതും മരിച്ചവരുമായുള്ള ബന്ധം
  choice: ‘കർത്താവിൽ മരിക്കുന്ന മരിച്ചവർ’ എന്നു താരതമ്യേന അക്ഷരാർഥത്തിൽ നിലനിർത്തി.
  alternative: ‘കർത്താവിനോടു വിശ്വസ്തരായി മരിക്കുന്നവർ’ അല്ലെങ്കിൽ ‘കർത്താവിനുള്ളവരായി മരിക്കുന്നവർ’.
  rationale: ഐക്യം, ഉടമസ്ഥബന്ധം, വിശ്വസ്തബന്ധം എന്നിവ ഉൾക്കൊള്ളാവുന്ന ἐν κυρίῳ എന്ന പ്രയോഗത്തെ ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: ἵνα ἀναπαήσονται എന്നതിന്റെ ബലം
  choice: ഉദ്ദേശ്യ/ഫലഭാവം ‘വിശ്രമിക്കേണ്ടതിനാണ്’ എന്നു നൽകി, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘അവർ വിശ്രമിക്കും’ അല്ലെങ്കിൽ ‘അവർ വിശ്രമിക്കട്ടെ’.
  rationale: ἵναയോടൊപ്പം ഭാവികാല സൂചകരൂപം വരുന്ന ഈ പാഠം ഉദ്ദേശ്യവും ഫലവും തമ്മിലുള്ള സൂക്ഷ്മത തുറന്നുവയ്ക്കുന്നു.
- issue: പ്രവൃത്തികളും അനുഗൃഹീതരായ മരിച്ചവരും തമ്മിലുള്ള ബന്ധം
  choice: ‘അവരുടെ പ്രവൃത്തികൾ അവരോടൊപ്പം പിന്തുടരുന്നു’ എന്നു മാത്രം പറഞ്ഞു.
  alternative: പ്രവൃത്തികൾ അവരുടെ അനുഗ്രഹം സമ്പാദിക്കുന്നു, അല്ലെങ്കിൽ മരണശേഷം അവ ഓർക്കപ്പെടുന്നു എന്ന വ്യാഖ്യാനം.
  rationale: പ്രവൃത്തികൾ കൂടെ വരുന്നു എന്ന പാഠവാക്യം സംരക്ഷിക്കുന്നു; പ്രതിഫലം, സാക്ഷ്യം, പുണ്യാർജനം എന്നിവയിൽ ഒന്നിനെ വിവർത്തനം വഴി നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആരാധനാവായനയ്ക്കും സാധാരണ വായനയ്ക്കും യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘അനുഗൃഹീതർ’, ‘കർത്താവിൽ’, ‘ആത്മാവ്’ എന്നീ പദങ്ങൾ ബൈബിൾഭാഷയുടെ ഗൗരവം നിലനിർത്തുന്നു; അതേസമയം അനാവശ്യമായ പുരാതന രൂപങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
