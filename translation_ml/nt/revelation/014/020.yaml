  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: ml
  text: മുന്തിരിച്ചക്ക് നഗരത്തിനു പുറത്ത് ചവിട്ടപ്പെട്ടു; ചക്കിൽനിന്ന് രക്തം പുറത്തുവന്ന്[b] കുതിരകളുടെ കടിഞ്ഞാണോളം ഉയർന്ന്, ആയിരത്തി അറുനൂറ് സ്റ്റേഡിയം ദൂരത്തേക്കു വ്യാപിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഒരു സ്റ്റേഡിയം പുരാതനകാലത്തെ ദൂരയളവായിരുന്നു; 1,600 സ്റ്റേഡിയം ഏകദേശം 296 കിലോമീറ്റർ (184 മൈൽ) ആണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “ചക്കിൽനിന്ന് രക്തം ഒഴുകിപ്പുറപ്പെട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπατήθη
  choice: ചവിട്ടപ്പെട്ടു
  rationale: πατέω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗത്തെ നേരിട്ട് നിലനിർത്തുകയും മുന്തിരിച്ചക്കിൽ മുന്തിരി ചവിട്ടുന്ന ദൃശ്യബിംബം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ληνός / ληνοῦ
  choice: മുന്തിരിച്ചക്ക് / ചക്ക്
  rationale: വീഞ്ഞുണ്ടാക്കാൻ മുന്തിരി ചവിട്ടിപ്പിഴിയുന്ന സംവിധാനത്തെ സൂചിപ്പിക്കുന്ന, ദൃശ്യബിംബം നിലനിർത്തുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: ἔξωθεν τῆς πόλεως
  choice: നഗരത്തിനു പുറത്തുവെച്ച്
  rationale: സ്ഥലസൂചന വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐξῆλθεν αἷμα
  choice: രക്തം പുറത്തുവന്ന്
  rationale: ἐξέρχομαι എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘പുറത്തുവരുക’ നിലനിർത്തുന്നു; ‘ഒഴുകി’ എന്ന സന്ദർഭോചിതമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: കുതിരകളുടെ കടിഞ്ഞാണോളം ഉയരത്തിൽ
  rationale: ἄχρι സൂചിപ്പിക്കുന്ന പരിധിയും രക്തത്തിന്റെ ആഴത്തെക്കുറിച്ചുള്ള ശക്തമായ ദൃശ്യവും വ്യക്തമായി പകർന്നുനൽകുന്നു.
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: ആയിരത്തിയറുനൂറ് സ്റ്റേഡിയം ദൂരം വ്യാപിച്ചു
  rationale: പുരാതന അളവ് മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. ഗ്രീക്കിലെ ἀπό സഹിതമുള്ള ദൂരപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ദൂരം വ്യാപിച്ചു’ എന്നു നൽകി.
theological_decisions:
- issue: ഈ ദൃശ്യം വിശദീകരണപരമായി മയപ്പെടുത്തണമോ, മൂർത്തമായ അന്ത്യകാല ന്യായവിധിബിംബമായി നിലനിർത്തണമോ
  choice: രക്തം, കുതിരകളുടെ കടിഞ്ഞാൺ, സ്റ്റേഡിയം എന്നീ മൂർത്തമായ ദൃശ്യഘടകങ്ങൾ അതേ ശക്തിയോടെ നിലനിർത്തി.
  alternative: അതിശക്തമായ ന്യായവിധിയുടെ പ്രതീകമാണെന്ന് വിശദീകരിച്ച് പരാവർത്തനം ചെയ്യുക.
  rationale: മൂലപാഠം ഉദ്ദേശപൂർവം അവതരിപ്പിക്കുന്ന ഉഗ്രമായ വെളിപ്പാടുസാഹിത്യ ദൃശ്യം വ്യാഖ്യാനത്തിലൂടെ പരിഹരിക്കാതെ വായനക്കാരന്റെ മുമ്പിൽ നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘മുന്തിരിച്ചക്ക്’ ദൃശ്യബിംബം വ്യക്തമാക്കുന്നു; ആവർത്തനത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ചക്ക്’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
