id: REV.14.5
reference: Revelation 14:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη⸃ ψεῦδος· ⸀ἄμωμοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/005.yaml
  text: And in their mouth no lie was found[a]; they are blameless.
translation:
  language: ml
  text: അവരുടെ വായിൽ ഒരു കള്ളവും കണ്ടെത്തിയില്ല; അവർ കുറ്റമറ്റവരാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കളങ്കമില്ലാത്തവർ” അല്ലെങ്കിൽ “ദോഷമില്ലാത്തവർ.” ഗ്രീക്ക് പദത്തിന് നൈതികമായ കുറ്റമില്ലായ്മയോടൊപ്പം യാഗപരമായ ശുദ്ധിയുടെ സൂചനയും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: അവരുടെ വായിൽ
  rationale: στόματι ഏകവചനത്തിലാണെങ്കിലും കൂട്ടത്തെ സംബന്ധിക്കുന്ന പ്രയോഗമാണ്. ‘അവരുടെ വായിൽ’ എന്നത് ഗ്രീക്കിന്റെ രൂപവും സംസാരത്തിന്റെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്ന ശൈലിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὐχ εὑρέθη
  choice: കണ്ടെത്തിയില്ല
  rationale: അയോറിസ്റ്റ് കർമണി രൂപത്തിന്റെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായ അകർതൃപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; അസത്യത്തിന്റെ അഭാവത്തിനാണ് ഊന്നൽ.
- source_word: ψεῦδος
  choice: ഒരു കള്ളവും
  rationale: ψεῦδος എന്നതിന്റെ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പരിഭാഷയാണ് ‘കള്ളം’. നിഷേധവാക്യത്തിൽ ‘ഒരു കള്ളവും’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἄμωμοί
  choice: കുറ്റമറ്റവർ
  rationale: ഈ പദത്തിന് നൈതികമായി കുറ്റമില്ലാത്തത് എന്നും യാഗപരമായി കളങ്കമില്ലാത്തത് എന്നും അർഥസാധ്യതയുണ്ട്. ‘കുറ്റമറ്റവർ’ പ്രധാന നൈതിക അർഥം വ്യക്തമായി നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: καὶ
  choice: —
  rationale: മുൻവാക്യത്തോടുള്ള തുടർച്ച മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി മനസ്സിലാകുന്നതിനാൽ ‘കൂടാതെ’ എന്നൊരു അധിക ബന്ധപദം ചേർത്തില്ല.
theological_decisions:
- issue: ἄμωμοί എന്ന വിശുദ്ധി/നിഷ്കളങ്കതാ പദം പാപരഹിതമായ സമ്പൂർണതയായി അതിശയിപ്പിക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: കുറ്റമറ്റവർ
  alternative: കളങ്കമില്ലാത്തവർ; ദോഷമില്ലാത്തവർ
  rationale: ‘കുറ്റമറ്റവർ’ നൈതിക നിർദോഷത വ്യക്തമാക്കുന്നു; എന്നാൽ പദത്തിൽ ഉണ്ടായേക്കാവുന്ന യാഗശുദ്ധിയുടെ ദൃശ്യഭാവം ഇല്ലാതാക്കാതിരിക്കാൻ ‘കളങ്കമില്ലാത്തവർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ ചുരുക്കവും ഊന്നലും സൂക്ഷിച്ചിരിക്കുന്നു; യഥാർഥമായ അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
