id: REV.14.8
reference: Revelation 14:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: ml
  text: 'മറ്റൊരുവനായ രണ്ടാം ദൂതൻ പിന്നാലെ വന്ന് ഇങ്ങനെ പറഞ്ഞു: “വീണു, വീണു, മഹതിയായ ബാബിലോൺ! തന്റെ ലൈംഗിക അധാർമികതയുടെ ക്രോധത്തിന്റെ വീഞ്ഞിൽനിന്ന് അവൾ സകല രാഷ്ട്രങ്ങളെയും കുടിപ്പിച്ചിരിക്കുന്നു[a][b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ ലൈംഗിക അധാർമികതയുടെ തീക്ഷ്ണവികാരത്തിന്റെ വീഞ്ഞിൽനിന്ന്’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ θυμός എന്ന പദത്തിന് ‘ക്രോധം,’ ‘രോഷം,’ അല്ലെങ്കിൽ തീക്ഷ്ണമായ ‘വികാരം/അഭിനിവേശം’ എന്നിങ്ങനെയും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ബാബിലോണിന്റെ ‘ലൈംഗിക അധാർമികത’ എന്ന ചിത്രം ദുഷിപ്പിക്കുന്ന, വിഗ്രഹാരാധനാപരമായ, അവിശ്വസ്തമായ സ്വാധീനത്തെ രൂപകമായി സൂചിപ്പിക്കുന്നതാകാം; എന്നാൽ പാഠം അതിനെ ഇവയിൽ ഏതെങ്കിലും ഒന്നിലേക്കു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: മറ്റൊരു ദൂതൻ—രണ്ടാമത്തെ ദൂതൻ
  rationale: ἄλλος (‘മറ്റൊരു’) എന്നും δεύτερος (‘രണ്ടാമത്തെ’) എന്നും ഉള്ള രണ്ടു ഘടകങ്ങളും നിലനിർത്തുന്നു; ഡാഷുകൾ വിശദീകരണസ്വഭാവമുള്ള ചേർത്തുപറച്ചിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: ἠκολούθησεν λέγων
  choice: പിന്നാലെ വന്ന് ഇങ്ങനെ പറഞ്ഞു
  rationale: ദർശനത്തിലെ തുടർച്ചയെ ‘പിന്നാലെ’ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ കൃതന്തബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തക്രിയയായി നൽകുന്നു.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: വീണു, വീണു
  rationale: ആവർത്തനവും പ്രവാചകീയ പ്രഖ്യാപനത്തിന്റെ ശക്തിയും അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: മഹതിയായ ബാബിലോൺ
  rationale: ἡ μεγάλη എന്ന വിശേഷണത്തിന്റെ പദവിസദൃശമായ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം സ്വീകരിക്കുന്നു.
- source_word: ἣ
  choice: അവൾ
  rationale: ബാബിലോണിനെ സ്ത്രീയായി വ്യക്തിവൽക്കരിക്കുന്ന ഗ്രീക്ക് സ്ത്രീലിംഗ ഏകവചന സൂചന നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ οἴνου
  choice: വീഞ്ഞിൽനിന്ന്
  rationale: ἐκ എന്നതിലെ ഉറവിടം/പാത്രത്തിൽനിന്നുള്ള കുടിക്കൽ എന്ന സൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
- source_word: τοῦ θυμοῦ
  choice: ഉന്മാദത്തിന്റെ
  rationale: θυμός എന്നതിന്റെ തീവ്രവികാരം, ആവേശം, ക്രോധം എന്നീ സാധ്യതകൾ പൂർണമായി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ, വീഞ്ഞിന്റെയും πορνείαയുടെയും സാഹചര്യത്തിൽ മത്തുപിടിപ്പിക്കുന്ന വികാരതീവ്രത സൂചിപ്പിക്കുന്നു.
- source_word: τῆς πορνείας αὐτῆς
  choice: തന്റെ ലൈംഗിക അധാർമികതയുടെ
  rationale: πορνείαയുടെ ലൈംഗിക ചിത്രം വ്യക്തമായി നിലനിർത്തുന്നു; വിഗ്രഹാരാധനയോ രാഷ്ട്രീയ അവിശ്വസ്തതയോ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് അതിനെ ചുരുക്കുന്നില്ല.
- source_word: πεπότικεν
  choice: കുടിപ്പിച്ചിരിക്കുന്നു
  rationale: ποτίζωയുടെ കാരണാർത്ഥവും perfect രൂപത്തിലെ പൂർത്തിയായ പ്രവൃത്തിയുടെ തുടരുന്ന ഫലവും സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: πάντα τὰ ἔθνη
  choice: സകല ജനതകളെയും
  rationale: ἔθνηയെ യഹൂദേതരർ എന്ന പരിമിത അർഥത്തിലാക്കാതെ വിശാലമായ ജനതകൾ/രാഷ്ട്രങ്ങൾ എന്ന നിലയിൽ നൽകുന്നു.
theological_decisions:
- issue: ബാബിലോണിന്റെ πορνείαയുടെ രൂപകസ്വഭാവം
  choice: പ്രധാനപാഠത്തിൽ ‘ലൈംഗിക അധാർമികത’ എന്ന ചിത്രം നിലനിർത്തുന്നു.
  alternative: വിഗ്രഹാരാധന; വേശ്യാവൃത്തി; ആത്മീയ അവിശ്വസ്തത
  rationale: വാക്യം തന്നെയുള്ള ലൈംഗിക രൂപകത്തെ ഒരു പ്രത്യേക മത-രാഷ്ട്രീയ വ്യാഖ്യാനമായി നിശ്ചയിക്കാതെ അതിന്റെ വ്യാഖ്യാനവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- issue: θυμός എന്ന പദത്തിന്റെ അർഥം
  choice: ഉന്മാദം
  alternative: ക്രോധം; രോഷം; തീക്ഷ്ണമായ അഭിനിവേശം
  rationale: ഇവിടെ θυμός ബാബിലോണിന്റെ πορνείαയോടു ബന്ധിച്ചിരിക്കുന്നതിനാൽ വികാരതീവ്രതയും മത്തുപിടിപ്പിക്കുന്ന ആവേശവും മുൻനിർത്തുന്നു; ക്രോധം എന്ന സാധ്യമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രവാചകീയ ആവർത്തനവും ബാബിലോണിന്റെ സ്ത്രീ-വ്യക്തിവൽക്കരണവും നിലനിർത്തി; ഗ്രീക്ക് വാക്യഘടന യാന്ത്രികമായി പകർത്താതെ മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്ക് മുൻനിർത്തി.
