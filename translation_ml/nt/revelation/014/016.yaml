id: REV.14.16
reference: Revelation 14:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: ml
  text: മേഘത്തിന്മേൽ ഇരിക്കുന്നവൻ തന്റെ അരിവാൾ ഭൂമിയിലേക്കു വീശി[a]; ഭൂമി കൊയ്യപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ അരിവാൾ ഭൂമിയിലേക്കു എറിഞ്ഞു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ ‘എറിഞ്ഞു’ എന്നർഥമുണ്ടെങ്കിലും, ഇവിടെ കൊയ്ത്തിനായി അരിവാൾ പ്രവർത്തിപ്പിക്കുന്നതാണു സന്ദർഭം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഭൂമി കൊയ്തെടുക്കപ്പെട്ടു.’ ഗ്രീക്കിൽ ‘ഭൂമി’ തന്നെയാണ് വ്യാകരണപരമായി കൊയ്യപ്പെടുന്നതായി പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: വീശി
  rationale: βάλλω എന്നതിന് അക്ഷരാർഥത്തിൽ ‘എറിഞ്ഞു/ചെലുത്തി’ എന്നാകാമെങ്കിലും, അരിവാൾ ഉപയോഗിച്ചുള്ള കൊയ്ത്തിന്റെ സന്ദർഭത്തിൽ അതിനെ പ്രവർത്തിപ്പിക്കുന്ന ചലനം സ്വാഭാവികമായി അറിയിക്കാൻ ‘വീശി’ അനുയോജ്യമാണ്; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: മേഘത്തിന്മേൽ ഇരുന്നവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകൃതന്തത്തെ വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി; ആ വ്യക്തി ആരാണെന്ന് വാക്യത്തിലേക്ക് വ്യാഖ്യാനമായി ചേർത്തിട്ടില്ല.
- source_word: νεφέλης
  choice: മേഘം
  rationale: ഗ്രീക്കിലെ നിർദ്ദിഷ്ടതയും മുൻസന്ദർഭത്തിൽ പറഞ്ഞ മേഘത്തിലേക്കുള്ള സൂചനയും മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ ‘മേഘത്തിന്മേൽ’ എന്ന രൂപം അറിയിക്കുന്നു.
- source_word: δρέπανον
  choice: അരിവാൾ
  rationale: കൊയ്ത്തിന് ഉപയോഗിക്കുന്ന ഉപകരണത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ മലയാളപദം; കാർഷികവും ന്യായവിധിസംബന്ധവുമായ ദൃശ്യബിംബം നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὴν γῆν
  choice: ഭൂമിയിലേക്കു
  rationale: ചലനസൂചകമായ ἐπί + accusative ഭൂമിയിലേക്കുള്ള ദിശ വ്യക്തമാക്കുന്നു; അരിവാൾ കൊയ്ത്തിനായി ചെലുത്തുന്ന ചിത്രം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐθερίσθη
  choice: കൊയ്യപ്പെട്ടു
  rationale: θερίζω എന്ന ക്രിയയുടെ aorist passive രൂപം നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἡ γῆ
  choice: ഭൂമി
  rationale: വെളിപ്പാടിന്റെ വിശ്വവ്യാപകമായ ദർശനസന്ദർഭത്തിൽ പ്രാദേശികമായ ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ യോജിക്കുന്നു; വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: മേഘത്തിന്മേൽ ഇരിക്കുന്ന കൊയ്ത്തുകാരന്റെ വ്യക്തിത്വം
  choice: പ്രധാനപാഠത്തിൽ ‘മേഘത്തിന്മേൽ ഇരുന്നവൻ’ എന്നു മാത്രം വിവരണാത്മകമായി നൽകുക.
  alternative: മുൻസന്ദർഭത്തെ അടിസ്ഥാനമാക്കി ‘മനുഷ്യപുത്രൻ’ അല്ലെങ്കിൽ മശീഹ എന്നു വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ദൈവകല്പന അനുഷ്ഠിക്കുന്ന ദൂതനായി കാണുക.
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ആ വ്യക്തിയെ പേരിട്ട് തിരിച്ചറിയുന്നില്ല. അതിനാൽ വ്യാഖ്യാനവ്യത്യാസം പരിഭാഷയിൽ തീർപ്പാക്കാതെ മൂലപാഠത്തിന്റെ സംയമനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ രണ്ടു ഉപവാക്യങ്ങളും ആവർത്തിക്കുന്ന ‘ഭൂമി’ എന്ന പദവും passive രൂപവും സംരക്ഷിച്ചു. വ്യക്തിയുടെ തിരിച്ചറിയൽ പ്രധാനപാഠത്തിൽ വ്യാഖ്യാനിച്ച് ചേർത്തിട്ടില്ല.
