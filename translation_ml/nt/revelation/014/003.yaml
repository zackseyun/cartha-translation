id: REV.14.3
reference: Revelation 14:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: ml
  text: അവർ സിംഹാസനത്തിന്റെ മുമ്പിലും നാലു ജീവികളുടെയും മൂപ്പന്മാരുടെയും മുമ്പിലും ഒരു പുതിയ പാട്ടെന്നപോലെ പാടിക്കൊണ്ടിരിക്കുന്നു.[a] ഭൂമിയിൽനിന്ന് വിലയ്ക്കു വാങ്ങപ്പെട്ടവരായ ആ ഒരു ലക്ഷത്തി നാൽപ്പത്തിനാലായിരം പേർക്കല്ലാതെ മറ്റാർക്കും ആ പാട്ട് പഠിക്കാൻ കഴിഞ്ഞില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു പുതിയ പാട്ടായി” / “ഒരു പുതിയ പാട്ടുപോലെ.” വെളിപ്പാടിലെ ദർശനവിവരണങ്ങളിൽ സാധാരണ കാണുന്ന പ്രത്യക്ഷതയുടെയോ താരതമ്യത്തിന്റെയോ ഭാഷയാണ് ഗ്രീക്കിൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഭൂമിയിൽനിന്ന് വീണ്ടെടുക്കപ്പെട്ടവർ.” ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം “വിലയ്ക്കു വാങ്ങുക” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: പാടിക്കൊണ്ടിരുന്നു
  rationale: വെളിപ്പാടിലെ ദർശനവിവരണത്തിന്റെ സജീവമായ വർത്തമാനഭാവം സ്വാഭാവിക മലയാള ആഖ്യാനശൈലിയിൽ തുടർച്ചയുള്ള പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു.
- source_word: ὡς ᾠδὴν καινὴν
  choice: ഒരു പുതിയ പാട്ടെന്നപോലെ
  rationale: ὡς എന്ന പദത്തിന്റെ ‘പോലെ/എന്നപോലെ’ എന്ന ദർശനാത്മകവും താരതമ്യാത്മകവുമായ ഭാവം നിലനിർത്തുന്നു; അത് യഥാർഥത്തിൽ പുതിയ പാട്ടല്ലെന്ന് തീർപ്പാക്കുന്നില്ല.
- source_word: ἐνώπιον
  choice: മുമ്പിൽ
  rationale: സിംഹാസനത്തിന്റെയും സ്വർഗീയ സന്നിധിയുടെയും മുമ്പിലുള്ള സ്ഥാനം സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: τῶν τεσσάρων ζῴων
  choice: നാലു ജീവികൾ
  rationale: വെളിപ്പാടിൽ സിംഹാസനത്തിനു ചുറ്റുമുള്ള സ്വർഗീയ ജീവികളെ സൂചിപ്പിക്കുന്ന ζῷον എന്ന പദത്തെ ‘മൃഗങ്ങൾ’ എന്ന തെറ്റിദ്ധരിപ്പിക്കുന്ന രൂപം ഒഴിവാക്കി വിവർത്തനം ചെയ്യുന്നു.
- source_word: τῶν πρεσβυτέρων
  choice: മൂപ്പന്മാർ
  rationale: സ്വർഗീയ സഭയിലെ നിർദിഷ്ട സംഘത്തിനുള്ള സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാള പദം.
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: മറ്റാർക്കും ... പഠിക്കാൻ കഴിഞ്ഞില്ല
  rationale: കഴിവില്ലായ്മയെ സൂചിപ്പിക്കുന്ന imperfect രൂപവും μαθεῖν എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘പഠിക്കുക’ എന്നതും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: ആ ഒരു ലക്ഷത്തി നാല്പത്തിനാലായിരം പേർ
  rationale: 144,000 എന്ന സംഖ്യയെ മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരീതിയിൽ നൽകുകയും ഗ്രീക്കിലെ നിർദിഷ്ട article ‘ആ’ കൊണ്ട് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: ഭൂമിയിൽനിന്ന് വിലയ്ക്കു വാങ്ങപ്പെട്ടവർ
  rationale: ἀγοράζω എന്നതിലെ വാങ്ങൽ/വിലകൊടുക്കൽ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു; ‘വീണ്ടെടുക്കപ്പെട്ടവർ’ എന്ന വ്യാഖ്യാനാത്മക ദൈവശാസ്ത്രപദം മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ദർശനവിവരണത്തിലെ ὡς എന്നതിന്റെ ബലം
  choice: ‘ഒരു പുതിയ പാട്ടെന്നപോലെ’ എന്ന താരതമ്യ/ദർശനഭാഷ
  alternative: ‘ഒരു പുതിയ പാട്ട്’ അല്ലെങ്കിൽ ‘പുതിയ പാട്ടായി’
  rationale: പാട്ട് യഥാർഥത്തിൽ പുതിയത് അല്ലെന്ന് വാക്യം ഉറപ്പിക്കുന്നില്ല; ദർശകൻ ഗ്രഹിച്ച വിധത്തെ സൂചിപ്പിക്കുന്ന ὡς എന്നതിന്റെ തുറന്ന ഭാവം ഈ രൂപം സംരക്ഷിക്കുന്നു.
- issue: ἠγορασμένοι എന്നതിന്റെ വിവർത്തനം
  choice: ‘വിലയ്ക്കു വാങ്ങപ്പെട്ടവർ’
  alternative: ‘വീണ്ടെടുക്കപ്പെട്ടവർ’
  rationale: മൂലപദത്തിലെ ചന്ത/വാങ്ങൽ രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ബന്ധപ്പെട്ട ദൈവശാസ്ത്രപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പാട്ടെന്നപോലെ’ എന്ന രൂപം ὡς-ന്റെ യഥാർഥ അനിശ്ചിതത്വം സൂക്ഷിക്കുന്നു. ‘വിലയ്ക്കു വാങ്ങപ്പെട്ടവർ’ എന്നത് മൂലത്തിലെ വ്യാപാരരൂപകം വ്യക്തമായി നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
