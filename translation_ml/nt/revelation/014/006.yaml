revisions:
- from: പിന്നെ, ആകാശമധ്യത്തിൽ പറക്കുന്ന മറ്റൊരു ദൂതനെ ഞാൻ കണ്ടു. ഭൂമിയിൽ വസിക്കുന്നവരോടും സകല ജനതയോടും ഗോത്രത്തോടും ഭാഷക്കാരോടും ജനസമൂഹത്തോടും സുവിശേഷം അറിയിക്കാനായി അവന്റെ പക്കൽ നിത്യമായ ഒരു സുവിശേഷം ഉണ്ടായിരുന്നു.[a][b]
  to: ഞാൻ ആകാശമധ്യത്തിൽ പറന്നുകൊണ്ടിരുന്ന മറ്റൊരു ദൂതനെ കണ്ടു[a]. ഭൂമിയിൽ വസിക്കുന്നവരോടും[b] എല്ലാ ജനതയിലും ഗോത്രത്തിലും ഭാഷയിലും ജനസമൂഹത്തിലും ഉള്ളവരോടും പ്രഘോഷിക്കാനായി, നിത്യമായ ഒരു സുവിശേഷം അവന്റെ പക്കൽ ഉണ്ടായിരുന്നു.
  rationale: The revision corrects the rendering of γλῶσσα and reshapes the coordinated universal formula into idiomatic Malayalam without adding interpretation. It retains the source’s purpose relation, the indefinite/anarthrous presentation of “an eternal gospel,” the apocalyptic midheaven imagery, and both required lexical footnote anchors.
