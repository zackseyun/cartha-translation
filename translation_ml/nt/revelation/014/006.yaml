id: REV.14.6
reference: Revelation 14:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: ml
  text: ഞാൻ ആകാശമധ്യത്തിൽ പറന്നുകൊണ്ടിരുന്ന മറ്റൊരു ദൂതനെ കണ്ടു[a]. ഭൂമിയിൽ വസിക്കുന്നവരോടും[b] എല്ലാ ജനതയിലും ഗോത്രത്തിലും ഭാഷയിലും ജനസമൂഹത്തിലും ഉള്ളവരോടും പ്രഘോഷിക്കാനായി, നിത്യമായ ഒരു സുവിശേഷം അവന്റെ പക്കൽ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആകാശമധ്യത്തിൽ” എന്നതിന് “ആകാശത്തിന്റെ നടുവിൽ” അല്ലെങ്കിൽ “ആകാശത്തിന്റെ ഉയർന്ന തുറന്ന വിസ്തൃതിയിൽ” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദം അന്ത്യദർശനസാഹിത്യത്തിലെ സവിശേഷ പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ഭൂമിയിൽ വസിക്കുന്നവർ” എന്നതിന്റെ അക്ഷരാർഥം “ഭൂമിയിൽ ഇരിക്കുന്നവർ” എന്നാണ്; വെളിപ്പാടിൽ ഈ പ്രയോഗം ഭൂമിയിലെ നിവാസികളെ സൂചിപ്പിക്കുന്ന ശൈലിപ്രയോഗമായി വരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: മറ്റൊരു ദൂതനെ
  rationale: ἄλλος വിവരണത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്ന ‘മറ്റൊരു’ എന്ന സ്വാഭാവിക അർഥം നൽകുന്നു; വെളിപ്പാടിന്റെ ദർശനസന്ദർഭത്തിൽ ἄγγελος സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πετόμενον ἐν μεσουρανήματι
  choice: ആകാശമധ്യത്തിൽ പറക്കുന്ന
  rationale: വർത്തമാനകാല കൃദന്തം ദൂതൻ പറന്നുകൊണ്ടിരിക്കുന്ന ദൃശ്യം നൽകുന്നു. μεσουράνημα ആകാശത്തിന്റെ നടുവിലോ ഉയർന്ന തുറന്ന വിസ്തൃതിയിലോ ഉള്ള സ്ഥാനം സൂചിപ്പിക്കുന്ന പ്രത്യേക അന്ത്യദർശനപ്രയോഗമാണ്.
- source_word: ἔχοντα
  choice: അവന്റെ പക്കൽ ... ഉണ്ടായിരുന്നു
  rationale: സുവിശേഷം ദൂതന്റെ കൈവശമുണ്ടെന്ന ἔχωയുടെ വിശാലമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അതിനെ കൈയിൽ പിടിച്ചിരുന്നുവെന്ന് അനാവശ്യമായി ദൃശ്യവൽക്കരിക്കുന്നില്ല.
- source_word: εὐαγγέλιον αἰώνιον
  choice: നിത്യമായ ഒരു സുവിശേഷം
  rationale: εὐαγγέλιον എന്നതിന് ക്രൈസ്തവഗ്രന്ഥപരമായ അനുരണനം നിലനിർത്തുന്ന ‘സുവിശേഷം’ ഉപയോഗിച്ചു. പദസമുച്ചയം നിർദേശകപദമില്ലാത്തതിനാൽ ‘ഒരു’ ചേർത്ത് അനിശ്ചിതത്വം സംരക്ഷിച്ചു; αἰώνιος എന്നതിന്റെ ദീർഘകാല/നിത്യ സ്വഭാവം ‘നിത്യമായ’ നൽകുന്നു.
- source_word: εὐαγγελίσαι
  choice: സുവിശേഷം അറിയിക്കാനായി
  rationale: അവ്യയം ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ εὐαγγέλιον–εὐαγγελίσαι പദബന്ധം മലയാളത്തിലും ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ വസിക്കുന്നവരോട്
  rationale: καθημένους അക്ഷരാർഥത്തിൽ ‘ഇരിക്കുന്നവർ’ എന്നാണെങ്കിലും വെളിപ്പാടിൽ ഭൂവാസികളെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമായി പ്രവർത്തിക്കുന്നു; ഭാവഭംഗിയെ തെറ്റായി ശരീരഭാവമാക്കി വായിക്കാതിരിക്കാൻ ‘വസിക്കുന്നവർ’ ഉപയോഗിച്ചു.
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: സകല ജനതയോടും ഗോത്രത്തോടും ഭാഷക്കാരോടും ജനസമൂഹത്തോടും
  rationale: സാർവത്രിക വ്യാപ്തി ഊന്നുന്ന നാലംഗ പട്ടികയും അതിന്റെ സഞ്ചിതതാളവും സംരക്ഷിച്ചു. γλῶσσα ഇവിടെ ഭാഷയാൽ തിരിച്ചറിയപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ഭാഷക്കാർ’ എന്നും λαός-ന് വേർതിരിവ് നിലനിർത്താൻ ‘ജനസമൂഹം’ എന്നും നൽകി.
theological_decisions:
- issue: εὐαγγέλιον αἰώνιον എന്ന നിർദേശകപദമില്ലാത്ത പ്രയോഗത്തിന്റെ നിർവചിതത്വം
  choice: നിത്യമായ ഒരു സുവിശേഷം
  alternative: നിത്യസുവിശേഷം / ആ നിത്യസുവിശേഷം
  rationale: ഗ്രീക്കിൽ നിർദേശകപദമില്ലാത്തതിനാൽ അതിനെ നിർബന്ധമായി നിർവചിതമാക്കാതെ ‘ഒരു’ ഉപയോഗിച്ചു. അതേസമയം ‘സുവിശേഷം’ എന്ന തിരുവെഴുത്തുപരമായ പദം നിലനിർത്തി; സന്ദേശത്തിന്റെ ഉള്ളടക്കത്തെ ഈ വാക്യം പറയുന്നതിലധികം വ്യാഖ്യാനിച്ചിട്ടില്ല.
- issue: ഭൂവാസികളെ സൂചിപ്പിക്കുന്ന καθημένους എന്ന പ്രയോഗം
  choice: ഭൂമിയിൽ വസിക്കുന്നവർ
  alternative: ഭൂമിയിൽ ഇരിക്കുന്നവർ / ഭൂമിയിൽ ജീവിക്കുന്നവർ
  rationale: വെളിപ്പാടിലെ ആവർത്തിത അന്ത്യദർശനപ്രയോഗം വാസസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു. ‘ഇരിക്കുന്നവർ’ ശരീരഭാവം മാത്രമെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാക്കാം; ‘വസിക്കുന്നവർ’ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം നൽകുന്നു, പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ദൂതൻ’, ‘സുവിശേഷം’, ‘ജനത’, ‘ഗോത്രം’ തുടങ്ങിയ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തി. ഗ്രീക്ക് വാക്യത്തിന്റെ ദീർഘമായ ഏകഘടന മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ ദർശനവാക്യവും ദൂതന്റെ ദൗത്യവും രണ്ട് വാക്യങ്ങളാക്കി; എന്നാൽ ആശയബന്ധവും സർവജനവ്യാപ്തിയുള്ള പട്ടികയും സംരക്ഷിച്ചു.
