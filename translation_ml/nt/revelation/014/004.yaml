  source_fidelity: മൊത്തത്തിൽ ഗ്രീക്കിനോടു വിശ്വസ്തമാണ്. എന്നാൽ ἐμολύνθησαν കർമണിപ്രയോഗമായതിനാൽ ‘തങ്ങളെത്തന്നെ മലിനമാക്കാത്തവർ’ എന്നതിനെക്കാൾ ‘മലിനരാകാത്തവർ’ അതിന്റെ അവസ്ഥാസൂചന കൂടുതൽ നേരിട്ട് നിലനിർത്തുന്നു. കൂടാതെ സ്ത്രീകളോടുള്ള ബന്ധം പറഞ്ഞിരിക്കുന്ന ഈ സന്ദർഭത്തിൽ παρθένοι-യുടെ പുല്ലിംഗ ബഹുവചനം ‘കന്യകന്മാർ’ എന്നു നൽകുന്നതാണ് കൂടുതൽ കൃത്യം.
  naturalness: ‘സ്ത്രീകളോടുകൂടെ മലിനരാകാത്തവർ’ എന്നും ‘എവിടെ പോയാലും’ എന്നും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘കന്യകകൾ’ ഈ പുരുഷസൂചക സംഘത്തെ സംബന്ധിച്ച് ലിംഗപരമായി അസ്വാഭാവികത സൃഷ്ടിക്കാം.
