id: REV.14.4
reference: Revelation 14:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: ml
  text: സ്ത്രീകളോടുകൂടെ മലിനരാകാത്തവർ ഇവരാണ്[a]; അവർ കന്യകന്മാരാണ്. കുഞ്ഞാട് എവിടെ പോയാലും അവനെ അനുഗമിക്കുന്നവർ ഇവരാണ്. ദൈവത്തിനും കുഞ്ഞാടിനും ആദ്യഫലമായി മനുഷ്യരുടെ ഇടയിൽനിന്ന് വിലയ്ക്കു വാങ്ങപ്പെട്ടവർ ഇവരാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ഈ ദൃശ്യഭാഷ ലൈംഗികവിരതിയെക്കുറിച്ചുള്ള അക്ഷരാർഥ പ്രസ്താവന മാത്രമല്ലാതെ ആത്മീയ വിശുദ്ധിയെയോ വിഗ്രഹാരാധന മൂലമുള്ള മലിനതയിൽനിന്നുള്ള സ്വാതന്ത്ര്യത്തെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: alternative_reading
  - marker: b
    text: ‘മനുഷ്യവർഗത്തിൽനിന്ന്’ അല്ലെങ്കിൽ ‘ജനങ്ങളുടെ ഇടയിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: തങ്ങളെത്തന്നെ മലിനമാക്കാത്തവർ
  rationale: ഗ്രീക്കിൽ ക്രിയാരൂപം കർമണിപ്രയോഗമാണെങ്കിലും, സ്ത്രീകളോടുള്ള ബന്ധത്തിൽ അവർ മലിനരായിട്ടില്ലെന്ന അവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ഈ പ്രയോഗം സഹായിക്കുന്നു; ധാർമികവും ആചാരപരവുമായ മലിനതയുടെ സൂചനയും നിലനിർത്തുന്നു.
- source_word: μετὰ γυναικῶν
  choice: സ്ത്രീകളോടുകൂടെ
  rationale: μετά + genitive എന്നത് ഇവിടെ ‘കൂടെ/ഒപ്പം’ എന്ന അർഥത്തിലാണ്. γυναικῶν എന്നത് ‘ഭാര്യമാർ’ എന്നു പരിമിതപ്പെടുത്താതെ പൊതുവായി ‘സ്ത്രീകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: παρθένοι
  choice: കന്യകകൾ
  rationale: παρθένοι എന്ന മൂർത്തമായ പദം അതേപടി നിലനിർത്തുന്നു; ‘ശുദ്ധർ’ പോലുള്ള വ്യാഖ്യാനപരമായ പദം ഉപയോഗിച്ച് രൂപകസാധ്യത മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
- source_word: ἀκολουθοῦντες
  choice: അനുഗമിക്കുന്നവർ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം അവരുടെ തുടർച്ചയായ, സവിശേഷമായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അനുഗമിക്കുന്നവർ’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀρνίῳ
  choice: കുഞ്ഞാട്
  rationale: വെളിപ്പാടിലെ യേശുവിനെ സൂചിപ്പിക്കുന്ന ക്രിസ്തുശാസ്ത്രപരവും ബലിസംബന്ധവുമായ പ്രതീകം സംരക്ഷിക്കുന്നു.
- source_word: ὅπου ἂν ὑπάγῃ
  choice: എവിടേക്കു പോയാലും
  rationale: ὅπου ἄν + subjunctive നൽകുന്ന അനിശ്ചിതവും സമഗ്രവുമായ ‘wherever’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἠγοράσθησαν
  choice: വിലയ്ക്കു വാങ്ങപ്പെട്ടവർ
  rationale: ἀγοράζω എന്നതിന്റെ വാങ്ങൽ-വില എന്ന രൂപകം നിലനിർത്തുന്നു; മുഖ്യവാചകത്തിൽ നേരിട്ട് ‘വീണ്ടെടുക്കപ്പെട്ടവർ’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ ഇടയിൽനിന്ന്
  rationale: ἄνθρωποι ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘ഇടയിൽനിന്ന്’ എന്നത് ഒരു സമൂഹത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: ἀπαρχὴ
  choice: ആദ്യഫലം
  rationale: ദൈവത്തിനായി സമർപ്പിക്കുന്ന വിളവിന്റെ ആദ്യഭാഗം എന്ന ആരാധനാപരവും കൊയ്ത്തുസംബന്ധവുമായ രൂപകം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സ്ത്രീകളോടുകൂടെ മലിനരാകാതിരിക്കുകയും കന്യകകളായിരിക്കുകയും ചെയ്തുവെന്ന വിവരണം അക്ഷരാർഥത്തിലോ രൂപകാർഥത്തിലോ നൽകണമോ
  choice: മുഖ്യവാചകത്തിൽ ഗ്രീക്കിലെ മൂർത്തമായ ഭാഷ അക്ഷരാർഥത്തിൽ നിലനിർത്തി.
  alternative: ആത്മീയ വിശുദ്ധിയെയോ വിഗ്രഹാരാധനാപരമായ മലിനതയിൽനിന്നുള്ള സ്വാതന്ത്ര്യത്തെയോ സൂചിപ്പിക്കുന്ന രൂപകമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: വെളിപ്പാടിൽ ഈ ഭാഷയ്ക്ക് പ്രതീകാത്മക ശക്തിയുണ്ടാകാമെങ്കിലും, പരിഭാഷ തന്നെ വ്യാഖ്യാനപ്രശ്നം തീർപ്പാക്കരുത്. അതിനാൽ മൂർത്തമായ വാചകം നിലനിർത്തി രൂപകസാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. വെളിപ്പാടിന്റെ പ്രതീകാത്മക ഭാഷയും വാങ്ങൽ, ആദ്യഫലം എന്നീ രൂപകങ്ങളും നിലനിർത്തി; ലിംഗസൂചനയില്ലാത്ത ἄνθρωποι എന്ന പദത്തെ ‘മനുഷ്യർ’ എന്നു നൽകി.
