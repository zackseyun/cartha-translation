id: REV.14.7
reference: Revelation 14:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: ml
  text: 'അവൻ ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ ഇങ്ങനെ പറഞ്ഞു: “ദൈവത്തെ ഭയപ്പെടുവിൻ[a], അവനു മഹത്ത്വം കൊടുപ്പിൻ; അവന്റെ ന്യായവിധിയുടെ സമയം വന്നിരിക്കുന്നു. ആകാശവും ഭൂമിയും സമുദ്രവും നീരുറവുകളും[b] സൃഷ്ടിച്ചവനെ ആരാധിക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തെ ഭക്ത്യാദരത്തോടെ ഭയപ്പെടുവിൻ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ഭക്ത്യാദരത്തോടെയുള്ള ഭയത്തെയും ന്യായവിധിയുടെ മുമ്പിലുള്ള ഭയത്തെയും സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ജലങ്ങളുടെ ഉറവുകൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: അവൻ ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ പറഞ്ഞു
  rationale: മുൻവാക്യത്തോടുള്ള കർത്തൃബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കിക്കൊണ്ട്, ἐν φωνῇ μεγάλῃ എന്ന പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: Φοβήθητε
  choice: ഭയപ്പെടുകയും
  rationale: വിധിയുടെയും ആരാധനയുടെയും പശ്ചാത്തലത്തിൽ ദൈവത്തോടുള്ള ഭക്ത്യാദരവും വിധിയെ അഭിമുഖീകരിക്കുന്ന ഭയവും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പദത്തിന്റെ അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: δότε αὐτῷ δόξαν
  choice: അവനു മഹത്ത്വം നൽകുകയും ചെയ്യുവിൻ
  rationale: δόξα എന്നതിന്റെ വ്യക്തമായ അർത്ഥം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ശൈലിയിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ
  choice: കാരണം അവന്റെ ന്യായവിധിയുടെ സമയം വന്നിരിക്കുന്നു
  rationale: ὅτιയുടെ കാരണാർഥവും പൂർത്തിയായെത്തിയ സമയത്തെ സൂചിപ്പിക്കുന്ന ἦλθεν എന്നതിന്റെ അടിയന്തരതയും വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ 'നാഴിക'യെക്കാൾ 'സമയം' സ്വാഭാവികമാണ്.
- source_word: προσκυνήσατε τῷ ποιήσαντι
  choice: സൃഷ്ടിച്ചവനെ ആരാധിക്കുവിൻ
  rationale: സൃഷ്ടാവെന്ന ആശയം നാമവൽക്കരിക്കാതെ ποιήσαντι എന്ന കൃദ്യന്തത്തിന്റെ ക്രിയാത്മകത നിലനിർത്തുകയും προσκυνέωയുടെ മതപരമായ അർത്ഥം പൂർണമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν καὶ πηγὰς ὑδάτων
  choice: ആകാശവും ഭൂമിയും സമുദ്രവും നീരുറവുകളും
  rationale: സൃഷ്ടിവിവരണത്തിന്റെ പട്ടികാസ്വഭാവം നിലനിർത്തുന്നു; πηγὰς ὑδάτων മലയാളത്തിൽ സ്വാഭാവികമായി 'നീരുറവുകൾ' എന്നു നൽകുന്നു.
theological_decisions:
- issue: Φοβήθητε τὸν θεόν എന്ന കല്പനയുടെ സ്വഭാവം
  choice: ദൈവത്തെ ഭയപ്പെടുക
  alternative: ദൈവത്തെ ഭക്ത്യാദരത്തോടെ വണങ്ങുക
  rationale: ന്യായവിധി, മഹത്ത്വം നൽകൽ, ആരാധന എന്നിവ ചേർന്ന പശ്ചാത്തലത്തിൽ ഭക്ത്യാദരവും ഭയവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ സംഘർഷം 'ഭയപ്പെടുക' സംരക്ഷിക്കുന്നു; അതിനെ വെറും ആദരമായി മൃദൂകരിക്കുന്നില്ല.
- issue: τῆς κρίσεως αὐτοῦ എന്നതിലെ αὐτοῦയുടെ ബന്ധം
  choice: അവന്റെ ന്യായവിധി
  alternative: അവൻ നടത്തുന്ന ന്യായവിധി
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി വിധി ദൈവത്തിന്റേതാണെന്നോ ദൈവത്തിൽനിന്നുള്ളതാണെന്നോ സൂചിപ്പിക്കാം. 'അവന്റെ ന്യായവിധി' ഈ സ്വാഭാവികമായ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ വെളിപ്പാടുപുസ്തകത്തിന്റെ ഗൗരവവും കല്പനാത്മക ഭാവവും നിലനിർത്തുന്ന ശൈലി. ബഹുവചന കല്പനയ്ക്ക് '-വിൻ' രൂപം ഉപയോഗിച്ചു.
