id: REV.14.1
reference: Revelation 14:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: ml
  text: പിന്നെ ഞാൻ നോക്കി; ഇതാ, സീയോൻ മലയിൽ കുഞ്ഞാട് നിന്നുകൊണ്ടിരുന്നു. അവനോടൊപ്പം ഒരു ലക്ഷത്തി നാല്പത്തിനാലായിരം പേർ ഉണ്ടായിരുന്നു. അവരുടെ നെറ്റികളിൽ കുഞ്ഞാടിന്റെ നാമവും അവന്റെ പിതാവിന്റെ നാമവും എഴുതപ്പെട്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: ‘അവന്റെ പിതാവിന്റെ നാമം അവരുടെ നെറ്റികളിൽ എഴുതപ്പെട്ടിരുന്നു’ എന്നു മാത്രമേയുള്ളൂ.'
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: പിന്നെ ഞാൻ നോക്കി
  rationale: ദർശനപരമ്പരയിലെ അടുത്ത രംഗത്തിലേക്കുള്ള സ്വാഭാവികമായ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നു; καί എന്നതിന്റെ പുരോഗമനശക്തിയും εἶδον എന്ന ദർശനക്രിയയും നിലനിർത്തുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന വെളിപ്പാട് സാഹിത്യശൈലിയിലെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὸ ἀρνίον
  choice: കുഞ്ഞാട്
  rationale: വെളിപ്പാട് പുസ്തകത്തിലെ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ശീർഷകം; അധികമായ വ്യാഖ്യാനവിശേഷണം ചേർക്കാതെ മൂലപദത്തിന്റെ രൂപവും പ്രതീകവും നിലനിർത്തുന്നു.
- source_word: ἑστὸς
  choice: നിൽക്കുന്നു
  rationale: പൂർണകാല പങ്കുപദം സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന അവസ്ഥയെ മലയാളത്തിലെ വർത്തമാനസ്ഥിതിയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: സീയോൻമലയിൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: μετ’ αὐτοῦ
  choice: അവനോടൊപ്പം
  rationale: കുഞ്ഞാടിനോടുള്ള കൂട്ടായ സാന്നിധ്യം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: ഒരുലക്ഷത്തി നാൽപ്പത്തിനാലായിരം പേർ
  rationale: കൃത്യമായ സംഖ്യ സംരക്ഷിച്ച് സാധാരണ മലയാള സംഖ്യാവ്യവഹാരത്തിൽ അവതരിപ്പിക്കുന്നു; വ്യക്തികളെ സൂചിപ്പിക്കാൻ ‘പേർ’ ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: ἔχουσαι
  choice: അവരുടെ നെറ്റികളിൽ ... എഴുതപ്പെട്ടിരുന്നു
  rationale: ‘ഉണ്ടായിരുന്നവർ’ എന്ന അക്ഷരാർഥഘടന ഒഴിവാക്കി, എഴുത്തിന്റെ സ്ഥാനം മുൻനിർത്തുന്ന സ്വാഭാവിക മലയാളവാക്യമായി പങ്കുപദത്തെ വികസിപ്പിക്കുന്നു.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: കുഞ്ഞാടിന്റെ നാമം
  rationale: സർവനാമത്തിന്റെ സൂചിതവ്യക്തി ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാക്കുന്നു; ദൈവിക ശീർഷകസന്ദർഭത്തിന് യോജിച്ച ‘നാമം’ ഉപയോഗിക്കുന്നു.
- source_word: καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: അവന്റെ പിതാവിന്റെ നാമവും
  rationale: രണ്ട് നാമങ്ങളെയും വേർതിരിച്ചെങ്കിലും സമാന്തരമായി ബന്ധിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന സംരക്ഷിക്കുന്നു.
- source_word: γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν
  choice: അവരുടെ നെറ്റികളിൽ ... എഴുതപ്പെട്ടിരുന്നു
  rationale: മുൻപേ എഴുതപ്പെട്ട് അവിടെ നിലനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പൂർണകാല നിഷ്ക്രിയരൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὸ ἀρνίον എന്നതിന്റെ തിരിച്ചറിവ്
  choice: വ്യാഖ്യാനവികാസമില്ലാതെ ‘കുഞ്ഞാട്’ എന്ന ക്രിസ്തുസംബന്ധിയായ ശീർഷകം ഉപയോഗിച്ചു.
  alternative: ‘യാഗകുഞ്ഞാട്’
  rationale: സന്ദർഭം കുഞ്ഞാടിനെ ക്രിസ്തുവായി തിരിച്ചറിയുന്നുവെങ്കിലും ‘യാഗ’ എന്ന വിശദീകരണം ഈ വാക്യത്തിൽ പ്രകടമായി ഇല്ല; അതിനാൽ പ്രതീകത്തിന്റെ വിശാലമായ വേദപുസ്തകപ്രതിധ്വനി തുറന്നുവെക്കുന്നു.
- issue: രണ്ട് നാമങ്ങൾ തമ്മിലുള്ള ബന്ധം
  choice: ‘കുഞ്ഞാടിന്റെ നാമവും അവന്റെ പിതാവിന്റെ നാമവും’ എന്ന് രണ്ട് സമന്വിത ഘടകങ്ങളായി നിലനിർത്തി.
  alternative: ‘കുഞ്ഞാടിന്റെ നാമം, അതായത് അവന്റെ പിതാവിന്റെ നാമം’
  rationale: ഗ്രീക്ക് പാഠം രണ്ട് നാമങ്ങളെ καί കൊണ്ട് ബന്ധിപ്പിക്കുന്നു; അവയെ ഒരേ നാമമായി വ്യാഖ്യാനിക്കുന്നത് മൂലപാഠത്തിലെ വ്യത്യാസവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും അനാവശ്യമായി പരിഹരിച്ചുകളയും.
- issue: നെറ്റിയിലെ എഴുത്തിനെക്കുറിച്ചുള്ള പാഠഭേദം
  choice: SBLGNTയിലെ ‘അവന്റെ നാമവും അവന്റെ പിതാവിന്റെ നാമവും’ എന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
  alternative: ‘അവന്റെ പിതാവിന്റെ നാമം’ മാത്രം
  rationale: മുഖ്യപാഠം രണ്ട് നാമങ്ങളും ഉൾക്കൊള്ളുന്നു; ശ്രദ്ധേയമായ മറ്റൊരു കൈയെഴുത്തുപ്രതി വായന ആദ്യത്തെ നാമം ഒഴിവാക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’, ‘കുഞ്ഞാട്’, ‘നാമം’ എന്നിവ വെളിപ്പാട് സാഹിത്യത്തിന്റെ ഉയർന്ന ഭാവം നിലനിർത്തുന്നു; എന്നാൽ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു.
