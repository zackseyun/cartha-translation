id: REV.14.10
reference: Revelation 14:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: ml
  text: ദൈവത്തിന്റെ ഉഗ്രകോപത്തിന്റെ വീഞ്ഞിൽനിന്ന് അവനും കുടിക്കും[a]; അത് അവന്റെ ക്രോധത്തിന്റെ പാനപാത്രത്തിൽ കലർത്തി നേർപ്പിക്കാതെ ഒരുക്കിയതാണ്. വിശുദ്ധ ദൂതന്മാരുടെ മുമ്പാകെയും കുഞ്ഞാടിന്റെ മുമ്പാകെയും തീയും ഗന്ധകവുംകൊണ്ട് അവൻ യാതന അനുഭവിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘കലർത്തിയതും നേർപ്പിക്കാത്തതുമായ.’ പുരാതനകാലത്ത് വീഞ്ഞ് സാധാരണയായി വെള്ളം ചേർത്ത് നേർപ്പിക്കുമായിരുന്നു. ഇവിടെ വീഞ്ഞ് ഒരുക്കപ്പെട്ടതാണെങ്കിലും നേർപ്പിക്കാത്തതാണെന്ന അസാധാരണ പ്രയോഗം ദൈവവിധിയുടെ പൂർണതീവ്രതയെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: അവനും
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ വ്യക്തിയെ വീണ്ടും ചൂണ്ടിക്കാണിക്കുന്ന ഊന്നലും ‘കൂടി’ എന്ന ചേർക്കൽഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: വീഞ്ഞിൽനിന്ന് … കുടിക്കും
  rationale: ഭാവികാലക്രിയയും ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടഭാവവും നിലനിർത്തുന്നു.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഉഗ്രകോപമാകുന്ന
  rationale: വിധിന്യായസന്ദർഭത്തിലെ θυμός-ന്റെ തീവ്രത ‘ഉഗ്രകോപം’ വ്യക്തമാക്കുന്നു; വീഞ്ഞ് ഒരു രൂപകമാണെന്ന ബന്ധവും വായനയിൽ തെളിയിക്കുന്നു.
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: വീര്യം കുറയ്ക്കാതെ തയ്യാറാക്കിയ
  rationale: κεράννυμι സൂചിപ്പിക്കുന്ന തയ്യാറാക്കൽ/കലർത്തൽഭാവവും ἄκρατος സൂചിപ്പിക്കുന്ന നേർപ്പിക്കാത്ത പൂർണവീര്യവും, മലയാളത്തിൽ വിരോധാഭാസമായി തോന്നാതെ, ഒരുമിച്ച് അറിയിക്കുന്നു.
- source_word: ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ
  choice: അവന്റെ ക്രോധത്തിന്റെ പാനപാത്രത്തിൽ
  rationale: ἐν-ന്റെ സ്ഥലഭാവവും പാനപാത്രരൂപകവും നിലനിർത്തുന്നു; ὀργή-യെ ‘ക്രോധം’ എന്നു നൽകി θυμός-ൽനിന്നുള്ള പദവ്യത്യാസവും സംരക്ഷിക്കുന്നു.
- source_word: βασανισθήσεται
  choice: പീഡിപ്പിക്കപ്പെടും
  rationale: ഭാവികാല നിഷ്ക്രിയരൂപവും കഠിനമായ ശിക്ഷാനുഭവവും വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: തീയും ഗന്ധകവുംകൊണ്ട്
  rationale: ἐν ഇവിടെ ശിക്ഷയുടെ ഉപാധി സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; θείον എന്നത് ആധുനികമായി ‘ഗന്ധകം’ ആണ്.
- source_word: ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου
  choice: വിശുദ്ധ ദൂതന്മാരുടെ മുമ്പാകെയും കുഞ്ഞാടിന്റെ മുമ്പാകെയും
  rationale: ἐνώπιον എന്ന പദത്തിന്റെ ആവർത്തനം നിലനിർത്തി, ഇരുകൂട്ടരുടെയും സന്നിധിയിൽ സംഭവിക്കുന്നതെന്ന ആശയം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: θυμός, ὀργή എന്നീ രണ്ടു വിധിന്യായപദങ്ങളുടെ വ്യത്യാസം
  choice: θυμός എന്നത് ‘ഉഗ്രകോപം’ എന്നും ὀργή എന്നത് ‘ക്രോധം’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടും ‘ക്രോധം’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: അടുത്തടുത്തായി വരുന്ന വ്യത്യസ്ത ഗ്രീക്ക് പദങ്ങളെ ഒരേ മലയാളപദത്തിലേക്ക് ചുരുക്കാതെ, അവയുടെ ബന്ധവും വാചകത്തിലെ തീവ്രതയും സംരക്ഷിക്കുന്നു.
- issue: τοῦ κεκερασμένου ἀκράτου എന്ന പ്രയോഗത്തിലെ പ്രകടമായ സംഘർഷം
  choice: മുഖ്യവാചകത്തിൽ ‘വീര്യം കുറയ്ക്കാതെ തയ്യാറാക്കിയ’ എന്നു നൽകി, അക്ഷരാർഥത്തിലെ ‘കലർത്തപ്പെട്ടതും കലർപ്പില്ലാത്തതും’ എന്ന സംഘർഷം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘കലർത്തപ്പെട്ട, കലർപ്പില്ലാത്ത വീഞ്ഞ്’ എന്ന് അക്ഷരാർഥത്തിൽ നൽകുക.
  rationale: പുരാതന വീഞ്ഞുതയ്യാറാക്കൽ പശ്ചാത്തലത്തിൽ ഇത് നേർപ്പിക്കാത്ത, പൂർണശക്തിയിലുള്ള വിധിയെ ഊന്നുന്നു. മുഖ്യവാചകം വായനാസൗകര്യം നൽകുമ്പോൾ അടിക്കുറിപ്പ് മൂലത്തിലെ അസാധാരണ കൂട്ടുപ്രയോഗം മറച്ചുവയ്ക്കുന്നില്ല.
- issue: ἐν πυρὶ καὶ θείῳ എന്നതിലെ ἐν-ന്റെ പ്രവർത്തനം
  choice: ‘തീയും ഗന്ധകവുംകൊണ്ട്’ എന്ന് ഉപാധിഭാവത്തിൽ നൽകി.
  alternative: ‘തീയിലും ഗന്ധകത്തിലും’ എന്ന് സ്ഥലഭാവത്തിൽ നൽകുക.
  rationale: വിധിശിക്ഷയുടെ ദൃശ്യത്തിൽ ഉപാധിഭാവം സ്വാഭാവികമാണെങ്കിലും, ഗ്രീക്ക് ഘടനയ്ക്ക് സ്ഥലഭാവവും അനുവദിക്കാം; പരിഭാഷ സന്ദർഭത്തിലെ പ്രവർത്തനം മുൻനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘പാനപാത്രം’, ‘കുഞ്ഞാട്’ തുടങ്ങിയ വെളിപ്പാട് ഗ്രന്ഥത്തിലെ പ്രധാന രൂപകങ്ങൾ നിലനിർത്തി; പഴഞ്ചൻ പദങ്ങൾ ഒഴിവാക്കി.
