id: REV.14.14
reference: Revelation 14:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: ml
  text: ഞാൻ നോക്കി; ഇതാ, ഒരു വെളുത്ത മേഘം. ആ മേഘത്തിന്മേൽ മനുഷ്യപുത്രനോടു സദൃശനായ ഒരാൾ[a] ഇരിക്കുന്നുണ്ടായിരുന്നു; അവന്റെ തലയിൽ ഒരു സ്വർണക്കിരീടവും കൈയിൽ മൂർച്ചയുള്ള ഒരു അരിവാളും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മനുഷ്യപുത്രനെപ്പോലെയുള്ളവൻ.’ ഈ പ്രയോഗം ദാനിയേൽ 7:13-നെ അനുസ്മരിപ്പിക്കുന്നു; സാധാരണയായി ഇതിനെ മിശിഹായെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി മനസ്സിലാക്കുന്നു. എന്നാൽ ഇവിടെ ഗ്രീക്കിൽ നിർദേശകപദമില്ല; അക്ഷരാർഥത്തിൽ, ‘ഒരു മനുഷ്യപുത്രനോടു സദൃശനായവൻ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: അതാ
  rationale: യോഹന്നാന്റെ ദർശനവിവരണത്തിലെ പെട്ടെന്നുള്ള ശ്രദ്ധാകർഷണവും സജീവതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: νεφέλη λευκή
  choice: ഒരു വെളുത്ത മേഘം
  rationale: λευκή എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥമായ ‘വെളുത്ത’ എന്ന പദം നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായി ‘പ്രകാശമുള്ള’ എന്നു വികസിപ്പിക്കുന്നില്ല.
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: ആ മേഘത്തിന്മേൽ ... ഇരിക്കുന്നു
  rationale: ഇരിക്കുന്ന നിലയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കൃദന്തരൂപം ദർശനത്തിന്റെ തത്സമയഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: ഒരു മനുഷ്യപുത്രനെപ്പോലെയുള്ള ഒരാൾ
  rationale: ὅμοιον എന്ന സാദൃശ്യവും നിർദേശകപദമില്ലാത്ത υἱὸν ἀνθρώπου എന്ന പ്രയോഗവും കഴിയുന്നത്ര നിലനിർത്തുന്നു; ദാനിയേൽ 7:13-ലെ സൂചനയെ വ്യക്തമായ ഒരു സ്ഥാനപ്പേരാക്കി മുഖ്യപാഠത്തിൽ ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: στέφανον χρυσοῦν
  choice: ഒരു സ്വർണക്കിരീടം
  rationale: വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ വിവർത്തനം. στέφανος എന്നത് രാജകീയ മകുടത്തേക്കാൾ വിജയമാലയെ സൂചിപ്പിക്കാവുന്നതാണെന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: δρέπανον ὀξύ
  choice: മൂർച്ചയുള്ള ഒരു അരിവാൾ
  rationale: കൊയ്ത്തിന്റെ പശ്ചാത്തലത്തിന് യോജിക്കുന്നതും സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്നതുമായ പദപ്രയോഗം.
theological_decisions:
- issue: υἱὸν ἀνθρώπου എന്നത് വ്യക്തമായ മിശിഹായുടെ സ്ഥാനപ്പേരായി വിവർത്തനം ചെയ്യണമോ എന്നത്
  choice: മുഖ്യപാഠത്തിൽ ‘ഒരു മനുഷ്യപുത്രനെപ്പോലെയുള്ള ഒരാൾ’ എന്നു വിവർത്തനം ചെയ്തു
  alternative: ‘മനുഷ്യപുത്രനെപ്പോലെയുള്ള ഒരാൾ’
  rationale: ഗ്രീക്കിൽ υἱὸν എന്നതിന് മുമ്പ് നിർദേശകപദമില്ലാത്തതിനാൽ മുഖ്യപാഠം അതിനെ നിശ്ചിത സ്ഥാനപ്പേരായി ശക്തിപ്പെടുത്തുന്നില്ല. എന്നാൽ ദാനിയേൽ 7:13-ന്റെ പ്രതിധ്വനിയും മിശിഹാപരമായ സാധാരണ ഗ്രഹിക്കലും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ദർശനവിവരണശൈലി. ‘അതാ’ എന്നത് വെളിപ്പാടുസാഹിത്യത്തിന് യോജിച്ച ഉയർന്ന ഭാവം നൽകുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ചെറുവാക്യങ്ങളും വർത്തമാനകാലമായ ‘ഇരിക്കുന്നു’ എന്ന രൂപവും ദർശനത്തിന്റെ സജീവത നിലനിർത്തുന്നു.
