  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: ml
  text: പിന്നെ മറ്റൊരു ദൂതൻ സ്വർഗത്തിലുള്ള ആലയത്തിൽനിന്ന്[a] പുറത്തുവന്നു; അവനും മൂർച്ചയുള്ള ഒരു അരിവാൾ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്വർഗത്തിലുള്ള വിശുദ്ധമന്ദിരത്തിൽനിന്ന്.” ഗ്രീക്കിലെ ναός എന്ന പദം ആലയത്തിന്റെ അകത്തെ വിശുദ്ധമന്ദിരത്തെ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: മറ്റൊരു ദൂതൻ
  rationale: ἄλλος ഇവിടെ ദർശനത്തിലെ ദൂതന്മാരുടെ തുടർച്ചയിൽ ‘മറ്റൊരാൾ’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘മറ്റൊരു ദൂതൻ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἐξῆλθεν
  choice: പുറത്തുവന്നു
  rationale: ἐξέρχομαι അകത്തുനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു; ‘പുറത്തുവന്നു’ ചലനത്തിന്റെ ദിശ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ναοῦ
  choice: ആലയത്തിൽനിന്ന്
  rationale: ναός ദേവാലയസമുച്ചയത്തേക്കാൾ പ്രത്യേകമായി ആലയത്തെയോ വിശുദ്ധമന്ദിരത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ വായനാസൗകര്യമുള്ള ‘ആലയം’ സ്വീകരിക്കുകയും കൂടുതൽ നിർദിഷ്ടമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിലുള്ള
  rationale: ഈ വിശേഷണപ്രയോഗം ആലയം സ്വർഗത്തിൽ സ്ഥിതിചെയ്യുന്നതായി തിരിച്ചറിയിക്കുന്നു; ‘സ്വർഗത്തിലുള്ള’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἔχων καὶ αὐτὸς
  choice: അവനും ... ഉണ്ടായിരുന്നു
  rationale: καὶ αὐτός ഈ ദൂതനും മുമ്പ് പരാമർശിച്ച വ്യക്തിയെപ്പോലെ അരിവാൾ കൈവശം വച്ചിരുന്നുവെന്ന് ഊന്നുന്നു. സ്വാഭാവിക മലയാളത്തിനായി പങ്കുപദഘടനയെ സമാപികക്രിയയായി അവതരിപ്പിച്ചു.
- source_word: δρέπανον
  choice: അരിവാൾ
  rationale: δρέπανον കൊയ്ത്തിന് ഉപയോഗിക്കുന്ന വളഞ്ഞ മൂർച്ചയുള്ള ഉപകരണമാണ്; ‘അരിവാൾ’ മലയാളത്തിലെ വ്യക്തവും സാധാരണവുമായ തത്തുല്യപദമാണ്.
- source_word: ὀξύ
  choice: മൂർച്ചയുള്ള
  rationale: ὀξύ അരിവാളിന്റെ മൂർച്ചയെ നേരിട്ട് വിശേഷിപ്പിക്കുന്നു; ‘മൂർച്ചയുള്ള’ ദൃശ്യബിംബം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്വർഗീയ ആലയത്തിന്റെ ദൃശ്യബിംബത്തിന്റെ സ്വഭാവം
  choice: ναός എന്നത് വ്യാഖ്യാനപരമായ വികസനം കൂടാതെ ‘ആലയം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: അകത്തെ വിശുദ്ധമന്ദിരത്തെ ഊന്നാൻ ‘വിശുദ്ധമന്ദിരം’ എന്നു നൽകുക, അല്ലെങ്കിൽ പ്രതീകാത്മകമായ സ്വർഗീയ വാസസ്ഥലമെന്നു പരാവർത്തനം ചെയ്യുക.
  rationale: വാക്യം സ്വർഗത്തിലെ ഒരു ആലയത്തെ വെളിപ്പാടുദർശനത്തിന്റെ ദൃശ്യമായി അവതരിപ്പിക്കുന്നു. അത് വാസ്തുശില്പപരമോ പ്രതീകാത്മകമോ ആരാധനാക്രമപരമോ എന്ന് പരിഭാഷയിൽ തീർപ്പാക്കാതെ മൂലപാഠത്തിലെ ദൃശ്യവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പിന്നെ’ ദർശനത്തിലെ സംഭവക്രമം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; അർഥം വ്യക്തമാക്കുന്ന വിധത്തിൽ ഗ്രീക്ക് പങ്കുപദഘടന മലയാളത്തിലെ സമാപികവാക്യമായി മാറ്റി.
