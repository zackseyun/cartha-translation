id: REV.14.18
reference: Revelation 14:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: ml
  text: 'പിന്നെ മറ്റൊരു ദൂതൻ യാഗപീഠത്തിൽനിന്ന് പുറപ്പെട്ടു. അഗ്നിയുടെമേൽ അധികാരമുള്ള അവൻ, മൂർച്ചയുള്ള അരിവാൾ കൈവശമുള്ളവനോടു ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു: “നിന്റെ മൂർച്ചയുള്ള അരിവാൾ നീട്ടി[a] ഭൂമിയിലെ മുന്തിരിവള്ളിയുടെ മുന്തിരിക്കുലകൾ വിളവെടുക്കുക; അതിലെ മുന്തിരിപ്പഴങ്ങൾ പാകമായിരിക്കുന്നു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ മൂർച്ചയുള്ള അരിവാൾ പ്രയോഗിക്കുക.” ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം “അയയ്ക്കുക” എന്നാണ്; കൊയ്ത്തിന്റെ സന്ദർഭത്തിൽ ചിലർ അതിനെ “പ്രയോഗിക്കുക” എന്നു വിവർത്തനം ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ഭൂമിയിലെ മുന്തിരിവള്ളി” അന്ത്യകാലദർശനത്തിലെ ഒരു രൂപകമാണ്. ചുറ്റുമുള്ള സന്ദർഭം ന്യായവിധിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യം അതിന്റെ സൂചിതവിഷയത്തെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: മറ്റൊരു ദൂതൻ
  rationale: വെളിപ്പാടിലെ ദർശനസന്ദർഭത്തിൽ ἄγγελος ഒരു ദൈവദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; ἄλλος സംഭവപരമ്പരയിലെ ‘മറ്റൊരു’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: യാഗപീഠത്തിൽനിന്നു പുറപ്പെട്ടു
  rationale: θυσιαστήριον എന്നത് ‘യാഗപീഠം’ ആണ്. ἐκ എന്നതിന്റെ പുറത്തേക്കുള്ള ചലനം ‘പുറപ്പെട്ടു’ എന്ന ക്രിയയിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: അഗ്നിയുടെമേൽ അധികാരമുള്ളവനായിരുന്നു അവൻ
  rationale: നിർദിഷ്ട പങ്കാളിത്തരൂപം ദൂതനെ വിശേഷിപ്പിക്കുന്നു. ἐξουσία ഇവിടെ അഗ്നിയോടുള്ള അധികാരമോ നിയന്ത്രണമോ സൂചിപ്പിക്കുന്നു.
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു
  rationale: വലിയ ശബ്ദത്തിൽ വിളിച്ചു എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: മൂർച്ചയുള്ള അരിവാൾ കൈവശമുള്ളവനോട്
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്ന വ്യക്തിയെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു; δρέπανον ‘അരിവാൾ’ എന്നും ὀξύ ‘മൂർച്ചയുള്ള’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: നിന്റെ മൂർച്ചയുള്ള അരിവാൾ നീട്ടി
  rationale: πέμπω അക്ഷരാർഥത്തിൽ ‘അയയ്ക്കുക’ എന്നാണ്; എന്നാൽ കൊയ്ത്തുസന്ദർഭത്തിൽ ‘അരിവാൾ നീട്ടുക’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും ദൃശ്യബിംബം നിലനിർത്തുന്നതുമാണ്. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: τρύγησον τοὺς βότρυας
  choice: കുലകൾ വിളവെടുക്കുക
  rationale: τρυγάω പ്രത്യേകിച്ച് മുന്തിരി ശേഖരിക്കുന്നതിനെയോ വിളവെടുക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; βότρυες മുന്തിരിക്കുലകളാണ്. പിന്നാലെ മുന്തിരിപ്പഴങ്ങൾ വ്യക്തമാകുന്നതിനാൽ ‘കുലകൾ’ മതിയാകുന്നു.
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: ഭൂമിയിലെ മുന്തിരിവള്ളിയുടെ
  rationale: ഗ്രീക്കിലെ ഇരട്ട ഷഷ്ഠിവിഭക്തിബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു; അന്ത്യകാലദർശനത്തിലെ രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἤκμασαν αἱ σταφυλαὶ αὐτῆς
  choice: അതിലെ മുന്തിരിപ്പഴങ്ങൾ പഴുത്തിരിക്കുന്നു
  rationale: ἀκμάζω ഇവിടെ പാകത്തിലെത്തുക എന്നതാണ്. ‘പൂർണമായി’ എന്ന വർധിത അർഥം ചേർക്കാതെ സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു.
theological_decisions:
- issue: τῆς ἀμπέλου τῆς γῆς എന്ന അന്ത്യകാലദർശനരൂപകത്തിന്റെ അർഥം
  choice: ‘ഭൂമിയിലെ മുന്തിരിവള്ളി’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: അതിനെ ഭൂമിയിലെ ദുഷ്ടരായ മനുഷ്യർ എന്നോ ന്യായവിധിക്കു വിധേയരാകുന്നവർ എന്നോ നേരിട്ട് വ്യാഖ്യാനിക്കുക.
  rationale: സമീപസന്ദർഭം ന്യായവിധിയെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം രൂപകത്തിന്റെ സൂചിതവിഷയം വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ യഥാർഥമായ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; ആവർത്തിച്ച ‘മൂർച്ചയുള്ള അരിവാൾ’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ ഊന്നൽ സംരക്ഷിക്കാൻ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗത്തുതന്നെ ചേർത്തു.
