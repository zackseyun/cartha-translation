reference: Revelation 14:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: ml
  text: 'മൂന്നാമനായ മറ്റൊരു ദൂതൻ അവരുടെ പിന്നാലെ വന്ന് ഉച്ചത്തിൽ പറഞ്ഞു: “ആരെങ്കിലും മൃഗത്തെയും അതിന്റെ പ്രതിമയെയും ആരാധിക്കുകയും[a] തന്റെ നെറ്റിയിലോ കൈയിലോ[b] ഒരു അടയാളം സ്വീകരിക്കുകയും ചെയ്യുന്നെങ്കിൽ,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “മൃഗത്തെയും അതിന്റെ പ്രതിമയെയും കുമ്പിടുകയും.” ഗ്രീക്ക് ക്രിയയ്ക്ക് സാഷ്ടാംഗം വീഴുകയോ കുമ്പിടുകയോ എന്ന ശരീരഭാവം സൂചിപ്പിക്കാനാകുമെങ്കിലും, ഇവിടെ ആരാധനാപരമായ വിധേയത്വമാണ് പ്രധാന ആശയം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥമായി “അവന്റെ നെറ്റിയിൽ അല്ലെങ്കിൽ അവന്റെ കൈയിൽ.” “ആരെങ്കിലും” എന്നതിനെ പരാമർശിക്കാൻ ഏകവചന പുൽലിംഗ സർവനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; മലയാളത്തിൽ ‘തന്റെ’ എന്നത് അതേ ഏകവചനബന്ധം ലിംഗഭേദമില്ലാതെ വ്യക്തമാക്കുന്നു.
    reason: translation_note
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: മൂന്നാമനായ മറ്റൊരു ദൂതൻ
  rationale: ἄλλος എന്ന ‘മറ്റൊരു’ എന്ന ആശയവും τρίτος എന്ന ക്രമസൂചനയും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിക്കുന്നു.
- source_word: ἠκολούθησεν αὐτοῖς
  choice: അവരുടെ പിന്നാലെ വന്ന്
  rationale: ദർശനത്തിലെ തുടർച്ചയായ സംഭവക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പിന്തുടർന്നു’ എന്നത് ലക്ഷ്യപൂർവമായ അനുഗമനം എന്ന അധികഭാവം നൽകാൻ ഇടയുള്ളതിനാൽ ഒഴിവാക്കി.
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ പറഞ്ഞു
  rationale: പ്രഖ്യാപനത്തിന്റെ ശക്തിയും എല്ലാവരും കേൾക്കുന്ന സ്വഭാവവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: Εἴ τις
  choice: ആരെങ്കിലും … ചെയ്യുന്നെങ്കിൽ
  rationale: അനിശ്ചിതവും പൊതുവ്യാപകവുമായ നിബന്ധന മലയാളത്തിൽ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: προσκυνεῖ
  choice: ആരാധിക്കുകയും
  rationale: വെറും ശരീരഭാവമായ കുമ്പിടലിനപ്പുറം മൃഗത്തോടുള്ള മതപരമായ ഭക്തിയും വിധേയത്വവും സന്ദർഭത്തിൽ ഉൾപ്പെടുന്നു.
- source_word: τὸ θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാടിലെ ഈ അന്ത്യദർശന പ്രതീകത്തിനുള്ള നേരിട്ടും സ്ഥാപിതവുമായ പരിഭാഷ.
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: അതിന്റെ പ്രതിമ
  rationale: εἰκών എന്നത് ഇവിടെ മൃഗത്തെ പ്രതിനിധാനം ചെയ്യുന്ന ദൃശ്യപ്രതിമയെ സൂചിപ്പിക്കുന്നു; നപുംസകലിംഗത്തിലുള്ള θηρίον-നോടുള്ള ബന്ധം ‘അതിന്റെ’ എന്ന് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: λαμβάνει χάραγμα
  choice: ഒരു അടയാളം സ്വീകരിക്കുകയും
  rationale: λαμβάνει എന്നത് സ്വീകരിക്കൽ/അംഗീകരിക്കൽ എന്നും χάραγμα തിരിച്ചറിയിക്കുന്ന കൊത്തിയതോ പതിപ്പിച്ചതോ ആയ അടയാളം എന്നും നൽകുന്നു. അനിർദ്ദിഷ്ടമായ χάραγμα-യ്ക്ക് ‘ഒരു’ യോജിക്കുന്നു.
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: തന്റെ നെറ്റിയിലോ കൈയിലോ
  rationale: അനിശ്ചിതനായ അതേ വ്യക്തിയിലേക്കുള്ള ഏകവചന പരാമർശം ‘തന്റെ’ എന്ന പ്രതിഫലക സർവനാമം ഉപയോഗിച്ച് ലിംഗഭേദമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മൃഗത്തോടുള്ള προσκυνέω എന്ന ക്രിയയുടെ മതപരമായ ശക്തി
  choice: ആരാധിക്കുക
  alternative: കുമ്പിടുക
  rationale: സന്ദർഭം വിഗ്രഹാരാധനാപരമായ ഭക്തിയെയും വിധേയത്വത്തെയും കുറിച്ചുള്ളതിനാൽ ‘ആരാധിക്കുക’ പ്രധാന അർഥം വ്യക്തമാക്കുന്നു; ശരീരഭാവത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: τις-നോടു ബന്ധപ്പെട്ട ഏകവചന പുൽലിംഗ αὐτοῦ
  choice: തന്റെ നെറ്റിയിലോ കൈയിലോ
  alternative: അവന്റെ നെറ്റിയിലോ അവന്റെ കൈയിലോ
  rationale: ഗ്രീക്കിലെ ഏകവചനബന്ധം നിലനിർത്തുമ്പോഴും, ആ വ്യാകരണലിംഗം ജൈവലിംഗം നിർണ്ണയിക്കുന്നതായി തോന്നാതിരിക്കാൻ മലയാളത്തിലെ സ്വാഭാവിക പ്രതിഫലക സർവനാമം ഉപയോഗിക്കുന്നു.
- issue: χάραγμα എന്നതിന്റെ സ്വഭാവം
  choice: ഒരു അടയാളം
  alternative: ഒരു മുദ്ര
  rationale: χάραγμα കൊത്തിയതോ പതിപ്പിച്ചതോ ആയ തിരിച്ചറിയൽചിഹ്നത്തെ സൂചിപ്പിക്കുന്നു. ‘അടയാളം’ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; ‘മുദ്ര’ അധികാരമുദ്ര എന്ന കൂടുതൽ പ്രത്യേക ധ്വനി ചേർക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലവാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്നതിനാൽ അവസാനത്തിലെ കോമയും അപൂർണ്ണ നിബന്ധനാ ഘടനയും നിലനിർത്തിയിരിക്കുന്നു.
