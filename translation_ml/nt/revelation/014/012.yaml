    text: '“യേശുവിലുള്ള വിശ്വാസം” എന്നും പരിഭാഷപ്പെടുത്താം; മറ്റൊരു സാധ്യത: “യേശുവിന്റെ വിശ്വസ്തത.” ഗ്രീക്ക് പ്രയോഗത്തിന് ഒന്നിലധികം അർഥസാധ്യതകളുണ്ട്.'
