id: REV.14.12
reference: Revelation 14:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: ml
  text: 'ഇവിടെയാണ് വിശുദ്ധരുടെ സഹിഷ്ണുത: ദൈവത്തിന്റെ കല്പനകൾ പാലിക്കുകയും യേശുവിന്റെ വിശ്വാസം[a] കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നവർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“യേശുവിലുള്ള വിശ്വാസം” എന്നും പരിഭാഷപ്പെടുത്താം; മറ്റൊരു സാധ്യത: “യേശുവിന്റെ വിശ്വസ്തത.” ഗ്രീക്ക് പ്രയോഗത്തിന് ഒന്നിലധികം അർഥസാധ്യതകളുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: ഇവിടെയാണ്
  rationale: മുമ്പ് വിവരിച്ച സാഹചര്യത്തിലേക്കു വിരൽചൂണ്ടുന്ന സ്ഥലസൂചക ക്രിയാവിശേഷണത്തിന്റെ ആലങ്കാരിക ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπομονὴ
  choice: സഹനം
  rationale: പരീക്ഷകളുടെ മധ്യേ ഉറച്ചുനിൽക്കുന്ന ക്ഷമയെയും തുടർച്ചയെയും സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പദമാണ്.
- source_word: ἁγίων
  choice: വിശുദ്ധരുടെ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്ന പുതിയനിയമത്തിലെ പതിവുപയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τηροῦντες
  choice: കാത്തുസൂക്ഷിക്കുന്നവരുടെ
  rationale: ദൈവകല്പനകൾ അനുസരിക്കുകയും വിശ്വാസത്തിൽ ഉറച്ചുനിൽക്കുകയും ചെയ്യുന്നതുൾപ്പെടുന്ന τηρέω എന്ന പദത്തിന്റെ ജാഗ്രതയോടെയുള്ള പാലനഭാവം നിലനിർത്തുന്നു.
- source_word: ἐντολὰς
  choice: കല്പനകളും
  rationale: ദൈവിക ആജ്ഞകളുടെ അധികാരവും ബൈബിൾഭാഷയിലെ പരിചിതമായ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ അടിസ്ഥാനവും പതിവുമായ അർഥം നൽകുന്നു; 'വിശ്വസ്തത' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: Ἰησοῦ
  choice: യേശുവിന്റെ
  rationale: ഗ്രീക്കിലെ സമ്പർക്കികാവിഭക്തിയെ നേരിട്ട് പ്രതിനിധീകരിച്ച്, യേശുവിലുള്ള വിശ്വാസമോ യേശുവിന്റെ വിശ്വാസം/വിശ്വസ്തതയോ എന്ന വ്യാകരണപരമായ അവ്യക്തത മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὴν πίστιν Ἰησοῦ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യേശുവിന്റെ വിശ്വാസം
  alternative: യേശുവിലുള്ള വിശ്വാസം; അല്ലെങ്കിൽ യേശുവിന്റെ വിശ്വസ്തത
  rationale: πίστις + Ἰησοῦ എന്ന സമ്പർക്കികാവിഭക്തി വിശ്വാസത്തിന്റെ ലക്ഷ്യമായി യേശുവിനെ സൂചിപ്പിക്കാമോ, യേശുവിനോടു ബന്ധപ്പെട്ട വിശ്വാസം/വിശ്വസ്തതയെ സൂചിപ്പിക്കാമോ എന്നതിൽ യഥാർഥ അവ്യക്തതയുണ്ട്. അതിനാൽ മുഖ്യപാഠം ഗ്രീക്കിനോട് അടുത്തുനിൽക്കുകയും വ്യാഖ്യാനാത്മക സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ വിശദീകരണാത്മക സമാനാധികരണഘടന മലയാളത്തിൽ ദീർഘവിരാമവും 'സഹനം' എന്ന പദത്തിന്റെ ആവർത്തനവും ഉപയോഗിച്ച് വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
