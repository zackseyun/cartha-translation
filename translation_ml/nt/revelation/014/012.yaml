revisions:
- from: ഇവിടെയാണ് വിശുദ്ധരുടെ സഹനം—ദൈവത്തിന്റെ കല്പനകളും യേശുവിന്റെ വിശ്വാസവും[a] കാത്തുസൂക്ഷിക്കുന്നവരുടെ സഹനം.
  to: 'ഇവിടെയാണ് വിശുദ്ധരുടെ സഹിഷ്ണുത: ദൈവത്തിന്റെ കല്പനകൾ പാലിക്കുകയും യേശുവിന്റെ വിശ്വാസം[a] കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നവർ.'
  rationale: The revision removes the added repetition of 'endurance,' represents the Greek apposition with a natural Malayalam colon construction, and uses 'സഹിഷ്ണുത' for steadfast endurance. It preserves the source's contested 'faith of Jesus' wording and retains all alternatives in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:52:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the key lexical elements and appropriately retains the ambiguity of τὴν πίστιν Ἰησοῦ in the main text with alternatives in a footnote. However, its repeated 'സഹനം' makes the Greek appositional construction sound as though endurance is being redundantly restated rather than identified with the saints described by the participle.
  naturalness: The em dash plus repetition ('...കാത്തുസൂക്ഷിക്കുന്നവരുടെ സഹനം') is heavy and unnatural in modern standard Malayalam. A colon followed by a relative participial description is clearer and more idiomatic. 'സഹിഷ്ണുത' more specifically conveys steadfast endurance under trial than the broader 'സഹനം.'
  terminology: '''വിശുദ്ധർ,'' ''ദൈവത്തിന്റെ കല്പനകൾ,'' and the deliberately close ''യേശുവിന്റെ വിശ്വാസം'' are suitable. The footnote correctly protects the disputed genitive construction without doctrinally resolving it.'
  issues:
  - severity: medium
    issue: Redundant rendering of the appositional phrase
    rationale: 'The Greek has one occurrence of ὑπομονή: ''Here is the endurance of the saints, those keeping ...'' The draft renders it twice (''വിശുദ്ധരുടെ സഹനം'' and ''...വരുടെ സഹനം''), which adds repetition not present in the source and obscures the apposition.'
  - severity: low
    issue: '''സഹനം'' is less precise for ὑπομονή'
    rationale: While possible, 'സഹനം' can denote tolerance or forbearance broadly. 'സഹിഷ്ണുത' better communicates steadfast endurance in the trial-oriented context of Revelation.
  revised_text: 'ഇവിടെയാണ് വിശുദ്ധരുടെ സഹിഷ്ണുത: ദൈവത്തിന്റെ കല്പനകൾ പാലിക്കുകയും യേശുവിന്റെ വിശ്വാസം[a] കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നവർ.'
  revised_footnotes:
