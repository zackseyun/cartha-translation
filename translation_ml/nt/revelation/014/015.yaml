id: REV.14.15
reference: Revelation 14:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: ml
  text: 'മറ്റൊരു ദൂതൻ വിശുദ്ധമന്ദിരത്തിൽനിന്ന് പുറത്തുവന്ന്, മേഘത്തിന്മേൽ ഇരിക്കുന്നവനോട് ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു: “നിന്റെ അരിവാൾ നീട്ടി കൊയ്യുക; കൊയ്യാനുള്ള സമയം വന്നിരിക്കുന്നു, കാരണം ഭൂമിയിലെ വിളവ് വിളഞ്ഞുകഴിഞ്ഞു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  choice: വിശുദ്ധമന്ദിരം
  rationale: ഇവിടെ പൊതുവായ ക്ഷേത്രപരിസരത്തെയല്ല, ദൈവസാന്നിധ്യവുമായി ബന്ധപ്പെട്ട ആലയത്തിന്റെ അന്തർവിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ναός എന്ന പദത്തിന്റെ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: നിന്റെ അരിവാൾ നീട്ടി
  rationale: πέμπωയുടെ അടിസ്ഥാന അർഥം ‘അയയ്ക്കുക’ എന്നാണെങ്കിലും അരിവാൾ പ്രയോഗിക്കുന്ന സാഹചര്യത്തിൽ ‘നീട്ടുക’ സ്വാഭാവികവും ദൃശ്യരൂപം നിലനിർത്തുന്നതുമാണ്.
- source_word: θέρισον
  choice: കൊയ്യുക
  rationale: വിളവെടുപ്പിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും നേരിട്ടുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: ἐξηράνθη ὁ θερισμὸς τῆς γῆς
  choice: ഭൂമിയിലെ വിളവ് വിളഞ്ഞുകഴിഞ്ഞു
  rationale: ἐξηράνθη അക്ഷരാർഥത്തിൽ ‘ഉണങ്ങി’ എന്നാണെങ്കിലും വിളവെടുപ്പിന്റെ സന്ദർഭത്തിൽ കൊയ്യാൻ പാകമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘വിളഞ്ഞുകഴിഞ്ഞു’ ആ ആശയം സ്വാഭാവികമായി നൽകുന്നു, അതിപാകമെന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: വിളവിന്റെ പാകത ന്യായവിധിയുടെ അതിപാകമോ സാധാരണ വിളവെടുപ്പുസജ്ജതയോ എന്നത്
  choice: വിളഞ്ഞുകഴിഞ്ഞു
  alternative: അതിപാകമായിരിക്കുന്നു / ഉണങ്ങിക്കഴിഞ്ഞു
  rationale: മൂലപദത്തിന്റെ ചിത്രഭാഷ കൊയ്ത്തിന് പാകമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘അതിപാകം’ എന്ന് നൽകി ന്യായവിധിയുടെ വൈകിപ്പോക്ക് പോലുള്ള വ്യാഖ്യാനം നിർബന്ധമായി ചേർക്കാതിരിക്കുന്നു.
- issue: മേഘത്തിന്മേൽ ഇരിക്കുന്നവന്റെ വ്യക്തിത്വം
  choice: മേഘത്തിന്മേൽ ഇരിക്കുന്നവൻ
  alternative: ക്രിസ്തു / മനുഷ്യപുത്രൻ
  rationale: ഈ വാക്യം ഉപയോഗിക്കുന്ന വിവരണാത്മക ഭാഷ തന്നെ നിലനിർത്തി വ്യക്തിത്വത്തെ വ്യാഖ്യാനത്തിലൂടെ തുറന്നുപറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. കല്പനകളുടെ ആവർത്തനവും ‘കാരണം... കാരണം...’ എന്ന മൂലവാക്യത്തിന്റെ യുക്തിബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിച്ചു.
