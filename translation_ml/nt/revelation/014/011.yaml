revisions:
- from: അവരുടെ പീഡനത്തിന്റെ പുക എന്നെന്നേക്കും ഉയരുന്നു[a]. മൃഗത്തെയും അതിന്റെ പ്രതിമയെയും ആരാധിക്കുന്നവർക്ക് രാവും പകലും വിശ്രമമില്ല; അതിന്റെ പേരിന്റെ മുദ്ര ആരെങ്കിലും സ്വീകരിക്കുന്നുവെങ്കിൽ അവർക്കും വിശ്രമമില്ല[b].
  to: അവരുടെ യാതനയുടെ പുക എന്നെന്നേക്കും ഉയരുന്നു; മൃഗത്തെയും അതിന്റെ പ്രതിമയെയും ആരാധിക്കുന്നവർക്കും, അതിന്റെ പേരിന്റെ മുദ്ര ആരെങ്കിലും സ്വീകരിക്കുന്നുവെങ്കിൽ അയാൾക്കും, രാവും പകലും വിശ്രമമില്ല[a][b].
  rationale: “യാതന” ഉപയോഗിച്ച് ശിക്ഷാസന്ദർഭത്തിലെ βασανισμός-ന്റെ അർഥം കൂടുതൽ കൃത്യമായി നൽകി. ഗ്രീക്കിലെ εἴ τις λαμβάνει എന്ന ഏകവചന, അനിശ്ചിത നിബന്ധന നിലനിർത്തിയെങ്കിലും, അതിന്റെ ഫലം വേറെയായി ആവർത്തിക്കാതെ വാക്യത്തിലെ ‘രാവും പകലും വിശ്രമമില്ല’ എന്ന പ്രധാനവാക്യത്തോടു ബന്ധിപ്പിച്ചു. ഇതിലൂടെ കരടിലെ അനാവശ്യ ബഹുവചന പരാമർശവും വ്യക്തതയ്ക്കായി ചേർത്ത ആവർത്തനവും ഒഴിവാകുന്നു; അൽപം അസാധാരണമായ ഗ്രീക്ക് അവസാനഘടന അടിക്കുറിപ്പിൽ തുറന്നുകാട്ടുന്നു.
