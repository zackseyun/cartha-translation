id: REV.14.11
reference: Revelation 14:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: ml
  text: അവരുടെ യാതനയുടെ പുക എന്നെന്നേക്കും ഉയരുന്നു; മൃഗത്തെയും അതിന്റെ പ്രതിമയെയും ആരാധിക്കുന്നവർക്കും, അതിന്റെ പേരിന്റെ മുദ്ര ആരെങ്കിലും സ്വീകരിക്കുന്നുവെങ്കിൽ അയാൾക്കും, രാവും പകലും വിശ്രമമില്ല[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “യുഗായുഗങ്ങളോളം.”'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അവസാനഭാഗം പെട്ടെന്ന് “അതിന്റെ പേരിന്റെ മുദ്ര ആരെങ്കിലും സ്വീകരിക്കുന്നുവെങ്കിൽ” എന്നു മാറുന്നു. ഇത് വിധിക്കു വിധേയരായവരുടെ വിവരണം തുടരുന്നതായി വായിക്കാം; മലയാളത്തിൽ ഒരേ പ്രധാനവാക്യമായ “വിശ്രമമില്ല” ഇരുവിഭാഗങ്ങൾക്കും ബാധകമാകുന്നവിധം ക്രമീകരിച്ചിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς
  choice: പുക
  rationale: വിധിന്യായത്തിന്റെ ദൃശ്യബിംബം വിപുലീകരിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: βασανισμοῦ
  choice: പീഡനം
  rationale: ശിക്ഷാസന്ദർഭത്തിലെ വേദനാജനകമായ അനുഭവം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; നിർദിഷ്ടമായ പീഡനരീതി അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: εἰς αἰῶνας αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: വെളിപ്പാടിലെ ഈ ശക്തമായ കാലദൈർഘ്യപ്രയോഗത്തിന്റെ സാധാരണ അർഥബലം നൽകുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀναβαίνει
  choice: ഉയരുന്നു
  rationale: വർത്തമാനകാലത്തിലെ തുടരുന്ന ദൃശ്യചലനം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀνάπαυσιν
  choice: വിശ്രമം
  rationale: ഗ്രീക്കിന്റെ നേരിട്ടുള്ള തുല്യപദവും ഇടവിടാത്ത പീഡനത്തോടുള്ള വൈരുധ്യം നിലനിർത്തുന്നതുമാണ്.
- source_word: ἡμέρας καὶ νυκτός
  choice: രാവും പകലും
  rationale: തുടർച്ചയായ കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: προσκυνοῦντες
  choice: ആരാധിക്കുന്നവർ
  rationale: വെളിപ്പാടിലെ മതപരമായ വണക്കംയും വിധേയത്വവും ഈ സന്ദർഭത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാടിലെ സ്ഥാപിതമായ അന്ത്യദർശന പ്രതീകത്തിന് നേരിട്ടുള്ള മലയാളപദം.
- source_word: εἰκόνα
  choice: പ്രതിമ
  rationale: ആരാധനയ്ക്കുള്ള പ്രതിനിധിരൂപം എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; 'രൂപം' എന്നതിനെക്കാൾ ഇവിടെ സ്വാഭാവികം.
- source_word: εἴ τις λαμβάνει
  choice: ആരെങ്കിലും സ്വീകരിക്കുന്നുവെങ്കിൽ
  rationale: ബഹുവചന പങ്കാളിവാക്യത്തിൽനിന്ന് ഏകവചന അനിശ്ചിത നിബന്ധനയിലേക്കുള്ള ഗ്രീക്കിലെ പെട്ടെന്നുള്ള മാറ്റം നിലനിർത്തുന്നു.
- source_word: χάραγμα
  choice: മുദ്ര
  rationale: തിരിച്ചറിയിക്കുന്ന അടയാളം എന്ന അർഥവും വെളിപ്പാടിലെ ആവർത്തിത പ്രയോഗവുമായി യോജിക്കുന്ന മലയാളപരിഭാഷയും നൽകുന്നു.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: അതിന്റെ പേരിന്റെ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: εἰς αἰῶνας αἰώνων സൂചിപ്പിക്കുന്ന വിധിന്യായത്തിന്റെ ദൈർഘ്യം
  choice: എന്നെന്നേക്കും
  alternative: യുഗായുഗങ്ങളോളം
  rationale: വെളിപ്പാടിൽ ഈ പ്രയോഗത്തിനുള്ള അതിശക്തമായ തുടരുന്ന കാലദൈർഘ്യബലം മുഖ്യപാഠത്തിൽ നൽകുന്നു; കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: അവസാന ഉപവാക്യത്തിന്റെ സൂചനയും വാക്യഘടനയും
  choice: ‘ആരെങ്കിലും സ്വീകരിക്കുന്നുവെങ്കിൽ’ എന്ന നിബന്ധനാരൂപം നിലനിർത്തി, വിശ്രമമില്ലെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കി
  alternative: ‘സ്വീകരിക്കുന്നവർക്കും’ എന്നു പൂർണമായി സമാന്തരമാക്കി മിനുക്കുക
  rationale: ഗ്രീക്കിലെ ബഹുവചന പങ്കാളിപ്രയോഗത്തിൽനിന്ന് ഏകവചന അനിശ്ചിത നിബന്ധനയിലേക്കുള്ള പെട്ടെന്നുള്ള മാറ്റം സംരക്ഷിക്കുന്നു. അതേസമയം മലയാളത്തിൽ തൂങ്ങിയുനിൽക്കുന്ന അപൂർണവാക്യം ഒഴിവാക്കാൻ സന്ദർഭത്തിൽനിന്നുള്ള ‘അവർക്കും വിശ്രമമില്ല’ ആവർത്തിക്കുന്നു; ഈ വിശദീകരണം അടിക്കുറിപ്പിൽ വെളിപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. അന്ത്യദർശന ദൃശ്യഭാഷ സംരക്ഷിച്ചു; ഗ്രീക്കിലെ അവസാനത്തെ വാക്യഘടനാമാറ്റം അടിക്കുറിപ്പോടെ നിലനിർത്തി.
