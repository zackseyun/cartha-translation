id: REV.14.2
reference: Revelation 14:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: ml
  text: ഞാൻ സ്വർഗത്തിൽനിന്ന് ഒരു ശബ്ദം കേട്ടു. അത് അനേകം വെള്ളങ്ങളുടെ ശബ്ദംപോലെയും[b] ശക്തമായ ഇടിമുഴക്കത്തിന്റെ ശബ്ദംപോലെയും ആയിരുന്നു.[a] ഞാൻ കേട്ട ആ ശബ്ദം തങ്ങളുടെ കിന്നരങ്ങൾ വായിക്കുന്ന കിന്നരവാദകരുടെ ശബ്ദംപോലെയായിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശബ്ദം’ എന്നതിനു പകരം ഓരോ സന്ദർഭത്തിലും ‘സ്വരം’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്കിലെ φωνή എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ഈ രണ്ട് അർഥങ്ങളും വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അനേകം വെള്ളങ്ങൾ’ എന്നത് അതിവിപുലവും എല്ലാം മൂടുന്നതുമായ ഇരമ്പലിനെ സൂചിപ്പിക്കുന്ന തിരുവെഴുത്തുപരമായ പ്രതിച്ഛായയാണ്; യെഹെസ്കേൽ 43:2 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
  - marker: c
    text: ഗ്രീക്കിലെ κιθάρα ഒരു പുരാതന തന്ത്രിവാദ്യമാണ്; ആധുനിക ഹാർപ്പിനെക്കാൾ ലൈറിനോടാണ് അതിനു കൂടുതൽ സാമ്യം. ഇവിടെ അതിനെ ‘കിന്നരം’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: ശബ്ദം
  rationale: വെള്ളം, ഇടിമുഴക്കം, വാദ്യസംഗീതം എന്നിവയോടാണ് ഇവിടെ താരതമ്യം; അതിനാൽ സംസാരിക്കുന്ന ഒരാളുടെ സാന്നിധ്യം സൂചിപ്പിക്കാതെ ശ്രാവ്യപ്രതിഭാസത്തെ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ശബ്ദം’ യോജിക്കുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: വെളിപ്പാടിന്റെ സന്ദർഭത്തിൽ οὐρανός വെറും ആകാശത്തേക്കാൾ സ്വർഗീയ മണ്ഡലത്തെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്.
- source_word: ὡς
  choice: പോലെ
  rationale: വാക്യത്തിലെ ഓരോ ദൃശ്യശ്രാവ്യ ഉപമയും വ്യക്തമായി അടയാളപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ὑδάτων πολλῶν
  choice: അനേകം വെള്ളങ്ങൾ
  rationale: ശക്തവും എല്ലാം മൂടുന്നതുമായ ഇരമ്പലിന്റെ തിരുവെഴുത്തുപരമായ പ്രതിച്ഛായയും മൂലപദങ്ങളുടെ ബഹുവചനരൂപവും നിലനിർത്തുന്നു.
- source_word: βροντῆς μεγάλης
  choice: വലിയ ഇടിമുഴക്കം
  rationale: μέγας സൂചിപ്പിക്കുന്ന ശക്തിയും വ്യാപ്തിയും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം നൽകുന്നു.
- source_word: κιθαρῳδῶν
  choice: കിന്നരം വായിക്കുന്നവർ
  rationale: തുടർന്നുള്ള κιθαριζόντων വാദ്യം വായിക്കുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നതിനാൽ, സന്ദർഭത്തിൽ സംഗീതജ്ഞരെ നേരിട്ട് സൂചിപ്പിക്കുന്ന വിവർത്തനം സ്വീകരിച്ചു.
- source_word: κιθαριζόντων
  choice: വായിക്കുന്ന
  rationale: വാദ്യം വായിക്കുന്ന പ്രവൃത്തിയെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: തങ്ങളുടെ കിന്നരങ്ങൾ വായിക്കുന്ന
  rationale: ഉടമസ്ഥതയും വാദ്യവായനയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; κιθάραയെ ആധുനിക ഇന്ത്യൻ വീണയുമായി തെറ്റായി സമീകരിക്കുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: സ്വർഗീയ ശ്രാവ്യപ്രതിഭാസത്തിന്റെ സ്വഭാവം
  choice: φωνή വന്നിടത്തെല്ലാം ‘ശബ്ദം’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: എല്ലായിടത്തും ‘സ്വരം’ എന്നോ ‘ശബ്ദം/സ്വരം’ കലർത്തിയോ വിവർത്തനം ചെയ്യുക.
  rationale: വെള്ളം, ഇടി, വാദ്യസംഗീതം എന്നീ വ്യക്തിത്വരഹിത ശബ്ദങ്ങളോടുള്ള ഉപമകൾക്കാണ് വാക്യത്തിൽ പ്രാധാന്യം. ‘ശബ്ദം’ എന്നു നൽകുന്നത് സംസാരിക്കുന്ന വ്യക്തിയെ പാഠത്തിൽ ഇല്ലാത്തവിധം മുൻകൂട്ടി നിർണയിക്കാതെ മൂലത്തിലെ സാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തിച്ചുള്ള ‘ശബ്ദം’ എന്നും ‘വായിക്കുന്ന’ എന്നും ഉള്ള ഘടനകൾ ശ്രാവ്യചിത്രത്തിന്റെ താളവും ഊന്നലും നിലനിർത്താൻ ഭാഗികമായി സംരക്ഷിച്ചു.
