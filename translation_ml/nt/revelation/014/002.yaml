  to: ഞാൻ സ്വർഗത്തിൽനിന്ന് ഒരു ശബ്ദം കേട്ടു. അത് അനേകം വെള്ളങ്ങളുടെ ശബ്ദംപോലെയും[b] ശക്തമായ ഇടിമുഴക്കത്തിന്റെ ശബ്ദംപോലെയും ആയിരുന്നു.[a] ഞാൻ കേട്ട ആ ശബ്ദം തങ്ങളുടെ കിന്നരങ്ങൾ വായിക്കുന്ന കിന്നരവാദകരുടെ ശബ്ദംപോലെയായിരുന്നു.[c]
