- issue: കാലദൈർഘ്യത്തോടൊപ്പമുള്ള ποιῆσαι എന്ന ക്രിയയുടെ അർത്ഥം
  choice: SBLGNT പാഠത്തെ പിന്തുടർന്ന് ‘നാല്പത്തിരണ്ടു മാസം പ്രവർത്തിക്കാൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നാല്പത്തിരണ്ടു മാസം തുടരാൻ’
  rationale: മുഖ്യപാഠം നൽകിയിരിക്കുന്ന ഗ്രീക്ക് വായനയ്ക്ക് മുൻഗണന നൽകുന്നു. പരിചിതമായ മറ്റൊരു പാഠ-പരിഭാഷാപാരമ്പര്യം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
