  source_fidelity: The repeated passive ἐδόθη is preserved, as are ‘mouth,’ the plural ‘blasphemies,’ delegated ‘authority,’ and the forty-two-month duration. However, ‘വലിയ കാര്യങ്ങൾ പറയുന്ന’ naturally suggests speaking of important matters rather than the elevated/arrogant utterances conveyed by μεγάλα in this context. ‘വലിയ വാക്കുകൾ’ retains the source’s relative breadth while fitting Malayalam speech idiom.
  naturalness: The sentence structure is clear and suitably formal. ‘വലിയ വാക്കുകളും ദൈവദൂഷണങ്ങളും സംസാരിക്കുന്ന’ is more idiomatic and contextually intelligible than ‘വലിയ കാര്യങ്ങളും ... പറയുന്ന.’
  terminology: ‘ദൈവദൂഷണങ്ങൾ,’ ‘അധികാരം,’ and ‘നൽകപ്പെട്ടു’ are appropriate modern-standard Malayalam choices. The proposed footnote removes an unsupported assertion that the ‘continue’ rendering is necessarily a manuscript variant; it is also a contextual/translation alternative for ποιῆσαι.
