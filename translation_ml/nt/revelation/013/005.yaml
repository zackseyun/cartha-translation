    issue: ‘വലിയ കാര്യങ്ങൾ’ is misleading in Malayalam.
    rationale: In ordinary Malayalam it tends to mean ‘important/significant matters,’ whereas μεγάλα here denotes grandiose utterances, immediately qualified by βλασφημίας. ‘വലിയ വാക്കുകൾ’ preserves lexical openness without reversing the contextual force.
  - severity: medium
    issue: Footnote a inaccurately attributes ‘continue’ solely to manuscripts and translations.
    rationale: The supplied SBLGNT text itself reads ποιῆσαι, whose broad contextual rendering has historically also produced ‘continue.’ The note should present this as an alternative rendering rather than make an unverified textual-variant claim.
