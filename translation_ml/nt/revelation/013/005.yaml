  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: ml
  text: വലിയ വാക്കുകളും[b] ദൈവദൂഷണങ്ങളും സംസാരിക്കുന്ന ഒരു വായ് അതിന് നൽകപ്പെട്ടു; നാല്പത്തിരണ്ടു മാസം പ്രവർത്തിക്കാനുള്ള അധികാരവും അതിന് നൽകപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘വലിയ വാക്കുകൾ’ എന്നത് ഈ സന്ദർഭത്തിൽ അഹങ്കാരത്തോടെയോ വമ്പോടെയോ ഉള്ള സംസാരത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη
  choice: നൽകപ്പെട്ടു
  rationale: ക്രിയയുടെ കർമണിപ്രയോഗം മൃഗത്തിന് ഇത് സ്വതവേ ഉള്ളതല്ല, നൽകപ്പെട്ടതാണ് എന്ന ആശയം നിലനിർത്തുന്നു. വാക്യത്തിലെ ആവർത്തനവും അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: στόμα
  choice: ഒരു വായ്
  rationale: അപ്പോക്കലിപ്റ്റിക് ദൃശ്യഭാഷ നിലനിർത്താൻ മൂർത്തമായ പദപ്രയോഗം ഉപയോഗിച്ചു; വെറും ‘സംസാരശേഷി’ എന്നു വ്യാഖ്യാനിച്ചില്ല.
- source_word: λαλοῦν
  choice: പറയുന്ന
  rationale: στόμα എന്ന പദത്തെ വിശേഷിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μεγάλα
  choice: വലിയ കാര്യങ്ങൾ
  rationale: ഗ്രീക്കിലെ വിശാലമായ അർത്ഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ അഹങ്കാരപരമായ വാക്കുകളാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ‘വമ്പുപറച്ചിലുകൾ’ എന്നു മുഖ്യപാഠത്തിൽ ചുരുക്കിയില്ല.
- source_word: βλασφημίας
  choice: ദൈവദൂഷണങ്ങൾ
  rationale: സമീപസന്ദർഭത്തിലെ ദൈവത്തിനെതിരായ വാക്കുകളെ വ്യക്തമായി സൂചിപ്പിക്കുകയും ബഹുവചനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐξουσία
  choice: അധികാരം
  rationale: അസംസ്കൃത ശക്തിയേക്കാൾ നൽകപ്പെട്ട അവകാശമോ അനുമതിയോ എന്ന ആശയം യോജിച്ചവിധം പ്രകടിപ്പിക്കുന്നു.
- source_word: ποιῆσαι
  choice: പ്രവർത്തിക്കാൻ
  rationale: ‘ചെയ്യുക’ എന്ന വിശാലമായ അർത്ഥമുള്ള ക്രിയയെ കാലദൈർഘ്യപ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘തുടരാൻ’ എന്ന പാഠപരമ്പര മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവന്നിട്ടില്ല.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: നാല്പത്തിരണ്ടു മാസം
  rationale: കാലദൈർഘ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും സംഖ്യാത്മക കാലപരിധി കൃത്യമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: μεγάλα സൂചിപ്പിക്കുന്ന സംസാരത്തിന്റെ സ്വഭാവം
  choice: ‘വലിയ കാര്യങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
