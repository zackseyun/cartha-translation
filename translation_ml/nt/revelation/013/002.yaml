id: REV.13.2
reference: Revelation 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: ml
  text: ഞാൻ കണ്ട മൃഗം പുള്ളിപ്പുലിയെപ്പോലെയായിരുന്നു[a]; അതിന്റെ കാലുകൾ കരടിയുടേതുപോലെയും അതിന്റെ വായ് സിംഹത്തിന്റെ വായ് പോലെയും ആയിരുന്നു. വ്യാളി അതിന് തന്റെ ശക്തിയും സിംഹാസനവും വലിയ അധികാരവും കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പുള്ളിപ്പുലി, കരടി, സിംഹം എന്നീ രൂപങ്ങൾ ദാനീയേൽ 7-ലെ മൃഗദർശനങ്ങളെ ഓർമിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാടിലെ ഭീകരവും പ്രതീകാത്മകവുമായ എതിരാളിയെ സൂചിപ്പിക്കുന്ന പദമാണിത്. ആ പ്രതീകശക്തി നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായതിനാൽ ‘മൃഗം’ തെരഞ്ഞെടുത്തു.
- source_word: ὅμοιον παρδάλει
  choice: പുള്ളിപ്പുലിയെപ്പോലെ
  rationale: ὅμοιος + ചതുർത്ഥി വിഭക്തി സാദൃശ്യം സൂചിപ്പിക്കുന്നു. ‘പുള്ളിപ്പുലിയെപ്പോലെ’ ദർശനത്തിലെ നേരിട്ടുള്ള താരതമ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πόδες
  choice: കാലുകൾ
  rationale: πούς എന്നതിന്റെ സാധാരണ അർഥം കാൽ/പാദം എന്നാണ്. മൃഗത്തിന്റെ അവയവത്തെക്കുറിച്ചുള്ള ഈ വിവരണത്തിൽ ‘കാലുകൾ’ സാധാരണ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്; ‘പാദങ്ങൾ’ അനാവശ്യമായി ഔപചാരികമാകും.
- source_word: ὡς ἄρκου
  choice: കരടിയുടേതുപോലെ
  rationale: ഗ്രീക്കിൽ ‘അതിന്റെ കാലുകൾ’ എന്നതിനു ശേഷമുള്ള താരതമ്യം സംക്ഷിപ്തമാണ്. കാലുകൾ കരടിയുടേതിനോട് സാദൃശ്യമുള്ളവയാണെന്ന അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: στόμα ... ὡς στόμα λέοντος
  choice: വായ് ... സിംഹത്തിന്റെ വായ് പോലെ
  rationale: ഗ്രീക്കിൽ στόμα ആവർത്തിക്കുന്നതിനാൽ ദർശനവിവരണത്തിന്റെ ദൃശ്യതയും സമാന്തരഘടനയും നിലനിർത്താൻ ‘വായ്’ ആവർത്തിച്ചു.
- source_word: δράκων
  choice: മഹാസർപ്പം
  rationale: വെളിപ്പാടിലെ δράκων എന്ന മഹത്തായ സർപ്പസദൃശ ദർശനരൂപത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പദമാണ് ‘മഹാസർപ്പം’; സാധാരണ പാമ്പിനെ സൂചിപ്പിക്കുന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: ἔδωκεν
  choice: കൊടുത്തു
  rationale: δίδωμι എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘കൊടുക്കുക’ എന്നാണ്; ഇവിടെ അധികാരദാനത്തെ ലളിതവും കൃത്യവുമായി പറയുന്നു.
- source_word: δύναμιν
  choice: ശക്തി
  rationale: പ്രവർത്തനശേഷിയെയോ ബലത്തെയോ സൂചിപ്പിക്കുന്ന δύναμις എന്ന പദത്തിന് ‘ശക്തി’ സ്വാഭാവികമാണ്; തുടർന്ന് വരുന്ന ἐξουσία എന്ന ‘അധികാരം’ എന്ന ആശയത്തിൽനിന്ന് വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: θρόνον
  choice: സിംഹാസനം
  rationale: θρόνος രാജകീയ ഭരണത്തിന്റെ ഇരിപ്പിടമായ ‘സിംഹാസനം’ തന്നെയാണ്; വെളിപ്പാടിലെ ഭരണസൂചന നിലനിർത്തുന്നു.
- source_word: ἐξουσίαν μεγάλην
  choice: വലിയ അധികാരം
  rationale: ἐξουσία ഭരണാവകാശത്തെയോ പ്രയോഗിക്കാവുന്ന അധികാരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വലിയ അധികാരം’ δύναμις എന്ന ‘ശക്തി’യിൽനിന്നുള്ള വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: മഹാസർപ്പം സ്വന്തം ശക്തിയും സിംഹാസനവും നൽകുന്നു എന്ന പ്രത്യാവർത്തകബന്ധം മലയാളത്തിൽ ‘തന്റെ’ എന്നതിലൂടെ വ്യക്തമായി വരുന്നു; മൃഗത്തിന്റെ വസ്തുക്കളെ സൂചിപ്പിക്കുന്നതുമായ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: മഹാസർപ്പവും മൃഗവും തമ്മിലുള്ള ബന്ധം സർവനാമങ്ങളിൽ അവതരിപ്പിക്കൽ
  choice: മൃഗത്തെ ‘അതിന്/അതിന്റെ’ എന്നും മഹാസർപ്പത്തിന്റെ സ്വത്തുകളെ ‘തന്റെ’ എന്നും അവതരിപ്പിച്ചു.
  alternative: മഹാസർപ്പത്തിനും അചേതനസൂചകമായ സർവനാമരൂപം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ സർവനാമരൂപങ്ങൾ ഒരേപോലെയാണെങ്കിലും, നൽകുന്നവൻ മഹാസർപ്പവും സ്വീകരിക്കുന്നത് മൃഗവുമാണെന്ന വാക്യബന്ധം ‘തന്റെ’ എന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ഇതിലൂടെ പാഠത്തിനപ്പുറം ഒരു സിദ്ധാന്തവാദവും ചേർക്കുന്നില്ല.
- issue: സംയുക്ത മൃഗരൂപങ്ങളുടെ വ്യാഖ്യാനവിസ്താരം
  choice: പുള്ളിപ്പുലി, കരടി, സിംഹം എന്നീ താരതമ്യങ്ങൾ നേരിട്ട് വിവർത്തനം ചെയ്തു; ദാനീയേൽ 7-ലെ പ്രതിധ്വനി മുഖ്യവാക്യത്തിൽ വിശദീകരിച്ചില്ല.
  alternative: ദാനീയേൽ 7-ലേക്കുള്ള സൂചന വിവർത്തനവാക്യത്തിൽതന്നെ ചേർക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം മൃഗരൂപങ്ങൾ വിശദീകരിക്കാതെ അവതരിപ്പിക്കുന്നു. അതിനാൽ സാധ്യതയുള്ള ദാനീയേൽബന്ധം അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിച്ച് മുഖ്യപാഠത്തിന്റെ പ്രതീകാത്മക തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ദർശനത്തിന്റെ സമാന്തരഘടനയും മൃഗരൂപങ്ങളുടെ ദൃശ്യതയും നിലനിർത്തി; വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
