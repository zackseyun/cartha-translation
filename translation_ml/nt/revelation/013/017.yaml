revisions:
- from: അങ്ങനെ, മൃഗത്തിന്റെ മുദ്രയോ അതിന്റെ പേരോ അതിന്റെ പേരിന്റെ സംഖ്യയോ ഉള്ളയാൾക്കല്ലാതെ ആർക്കും വാങ്ങാനോ വിൽക്കാനോ കഴിയാതെയായി.[a]
  to: അങ്ങനെ, മൃഗത്തിന്റെ മുദ്രയോ അതിന്റെ പേരോ അതിന്റെ പേരിന്റെ സംഖ്യയോ ഉള്ളയാൾക്കല്ലാതെ മറ്റാർക്കും വാങ്ങാനോ വിൽക്കാനോ കഴിയാതിരിക്കാൻ.
  rationale: The revision corrects the aspectual/modal force of the ἵνα clause without altering the verse's meaning. ‘മറ്റാർക്കും’ explicitly and naturally renders μή τις ('no one'), while the conditional exception and the source's potentially list-like sequence of mark, name, and number remain unexpanded. The existing alternative-pronoun footnote is retained, with its anchor omitted from the revised running text because it concerns only the immediately preceding phrase.
