id: REV.13.17
reference: Revelation 13:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἵνα μή τις ⸀δύνηται ἀγοράσαι ἢ πωλῆσαι εἰ μὴ ὁ ἔχων τὸ χάραγμα, τὸ ὄνομα τοῦ θηρίου ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/017.yaml
  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: ml
  text: അങ്ങനെ, മൃഗത്തിന്റെ മുദ്രയോ അതിന്റെ പേരോ അതിന്റെ പേരിന്റെ സംഖ്യയോ ഉള്ളയാൾക്കല്ലാതെ മറ്റാർക്കും വാങ്ങാനോ വിൽക്കാനോ കഴിയാതിരിക്കാൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μή τις δύνηται
  choice: അങ്ങനെ ... ആർക്കും ... കഴിയാതെയായി
  rationale: ἵνα ഇവിടെ ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്നു; μή τις എന്ന അനിശ്ചിത നിഷേധത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘ആർക്കും ... കഴിയാതെ’ എന്നു നൽകി.
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: വാങ്ങാനോ വിൽക്കാനോ
  rationale: സാധാരണ വാണിജ്യപ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുന്ന ഈ രണ്ടു ക്രിയകളുടെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: εἰ μὴ ὁ ἔχων
  choice: ഉള്ളയാൾക്കല്ലാതെ
  rationale: εἰ μὴ സൂചിപ്പിക്കുന്ന ഏക ഒഴിവും ὁ ἔχων എന്ന substantival participle-ന്റെ ‘ഉള്ളയാൾ’ എന്ന അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τὸ χάραγμα
  choice: മുദ്ര
  rationale: χάραγμα എന്നത് പതിപ്പിച്ച അടയാളമോ മുദ്രയോ ആകാം; വെളിപ്പാട് പുസ്തകത്തിന്റെ ഈ സന്ദർഭത്തിൽ ‘മുദ്ര’ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമാണ്.
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: മൃഗത്തിന്റെ പേര്
  rationale: ജനിറ്റീവ് ബന്ധം നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: θηρίου
  choice: മൃഗം
  rationale: വെളിപ്പാടിലെ പ്രതീകാത്മക വിരോധിയെ സൂചിപ്പിക്കുന്ന θηρίον-ന് മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും സ്ഥാപിതവുമായ പദം.
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: അല്ലെങ്കിൽ അതിന്റെ പേരിന്റെ സംഖ്യ
  rationale: αὐτοῦ-ന്റെ തൊട്ടുമുമ്പിലുള്ള നപുംസകലിംഗ antecedent ആയ θηρίον-നോടുള്ള ബന്ധം ‘അതിന്റെ’ എന്നു പ്രകടമാക്കുന്നു; ἀριθμός-നെ ‘സംഖ്യ’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: മുദ്ര, പേര്, പേരിന്റെ സംഖ്യ എന്നിവ തമ്മിലുള്ള ബന്ധം
  choice: ‘മുദ്രയോ അതിന്റെ പേരോ അതിന്റെ പേരിന്റെ സംഖ്യയോ’ എന്ന പരമ്പര
  alternative: ‘മുദ്ര, അതായത് മൃഗത്തിന്റെ പേരോ അതിന്റെ പേരിന്റെ സംഖ്യയോ’
  rationale: ഗ്രീക്കിലെ τὸ χάραγμα, τὸ ὄνομα ... ἢ τὸν ἀριθμόν എന്ന ഘടന apposition ആണോ പട്ടികയാണോ എന്നതിൽ ചില അസ്പഷ്ടതയുണ്ട്. ആവർത്തിച്ച ‘-യോ’ ഉപയോഗിച്ച് പട്ടികാസ്വഭാവം മുൻനിർത്തുമ്പോഴും ‘അതായത്’ ചേർത്ത് ബന്ധം തീർച്ചപ്പെടുത്തുന്നില്ല.
- issue: ὁ ἔχων എന്ന പുരുഷലിംഗ ഏകവചനത്തിന്റെ പൊതുവായ പ്രയോഗം
  choice: ഉള്ളയാൾ
  alternative: അവൻ ഉള്ളവനല്ലാതെ
  rationale: ഗ്രീക്ക് രൂപം വ്യാകരണപരമായി പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും ഇവിടെ പൊതുവായി ഏതൊരാളെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ഉള്ളയാൾ’ ആ പൊതുവായ വ്യാപ്തി സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- issue: αὐτοῦ എന്ന സർവനാമത്തിന്റെ സൂചന
  choice: അതിന്റെ പേര്
  alternative: അവന്റെ പേര്
  rationale: θηρίον നപുംസകലിംഗ നാമമായതിനാൽ ‘അതിന്റെ’ മൂലവാക്യബന്ധം കൃത്യമായി നൽകുന്നു; സന്ദർഭത്തിലെ വ്യക്തിസ്വഭാവം കണക്കിലെടുത്ത് ‘അവന്റെ’ എന്നതും സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘ആർക്കും ... കഴിയാതെയായി’ എന്ന ഘടന ഉദ്ദേശ്യം/ഫലം സ്വാഭാവികമായി നൽകുന്നു. ഗ്രീക്കിലെ ഘടനയെ അതിയായി വ്യാഖ്യാനിക്കാതിരിക്കാൻ appositional ‘അതായത്’ ഒഴിവാക്കി.
