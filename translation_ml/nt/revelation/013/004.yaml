reference: Revelation 13:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: ml
  text: 'മഹാസർപ്പം മൃഗത്തിന് അധികാരം കൊടുത്തതുകൊണ്ട് അവർ മഹാസർപ്പത്തെ ആരാധിച്ചു. അവർ മൃഗത്തെയും ആരാധിച്ചു; ഇങ്ങനെ പറഞ്ഞു: “മൃഗത്തെപ്പോലെ ആരുണ്ട്?[a][b] അതിനോടു യുദ്ധം ചെയ്യാൻ ആർക്കു കഴിയും?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മൃഗത്തോടു താരതമ്യപ്പെടുത്താവുന്നവൻ ആരുണ്ട്?”
    reason: lexical_alternative
  - marker: b
    text: ഈ പ്രശംസാവാക്യം ദൈവത്തിന് തുല്യനായി ആരുമില്ലെന്ന പഴയനിയമഭാഷയെ പ്രതിധ്വനിപ്പിക്കുന്നതായി തോന്നുന്നു (ഉദാ. പുറപ്പാട് 15:11; സങ്കീർത്തനം 35:10); ഇവിടെ ആ ഭാഷ ദൈവനിന്ദാപരമായി മൃഗത്തിനു പ്രയോഗിച്ചിരിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: അല്ലെങ്കിൽ, “അതിനെതിരെ യുദ്ധം ചെയ്യാൻ ആർക്കു കഴിയും?”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεκύνησαν
  choice: ആരാധിച്ചു
  rationale: വെളിപ്പാടുപുസ്തകത്തിൽ ഈ ക്രിയ സാധാരണയായി മതപരമായ വണക്കം സൂചിപ്പിക്കുന്നു; അതിനാൽ വെറും കുമ്പിടലിനേക്കാൾ ‘ആരാധിച്ചു’ എന്നത് സന്ദർഭത്തിലെ വിഗ്രഹാരാധനാഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: δράκοντι
  choice: മഹാസർപ്പത്തെ
  rationale: അപ്പോക്കലിപ്റ്റിക് പ്രതീകഭാഷയിലെ δράκων എന്ന പദത്തിന് മലയാളത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള പദം; പ്രതീകത്തെ വ്യാഖ്യാനിച്ചു മാറ്റുന്നില്ല.
- source_word: ὅτι ἔδωκεν
  choice: കൊടുത്തതുകൊണ്ട്
  rationale: ὅτι ഇവിടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു. മഹാസർപ്പം മുമ്പ് അധികാരം കൊടുത്തതാണ് അതിനെ ആരാധിക്കാനുള്ള കാരണമെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: വെറും ശക്തിയേക്കാൾ ഭരണത്തിനോ പ്രവർത്തനത്തിനോ ലഭിച്ച അധികാരത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: θηρίῳ
  choice: മൃഗത്തിന് / മൃഗത്തെ
  rationale: വെളിപ്പാടുപുസ്തകത്തിലെ θηρίον എന്ന പ്രതീകത്തിന് സ്ഥാപിതവും നേരിട്ടുള്ളതുമായ മലയാളപരിഭാഷയാണ് ‘മൃഗം’.
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: മൃഗത്തെപ്പോലെ ആരുണ്ട്?
  rationale: താരതമ്യമില്ലായ്മ അവകാശപ്പെടുന്ന വാചാടോപചോദ്യം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: πολεμῆσαι μετ’ αὐτοῦ
  choice: അതിനോടു യുദ്ധം ചെയ്യാൻ
  rationale: πολεμέω എന്നതിന്റെ സൈനികമായ ശക്തി ‘യുദ്ധം ചെയ്യുക’ നിലനിർത്തുന്നു. ‘അതിനോടു’ എന്നത് മൃഗത്തോടുള്ള ശത്രുതാപരമായ ഏറ്റുമുട്ടൽ സൂചിപ്പിക്കുമ്പോഴും ഗ്രീക്കിലെ രൂപത്തോട് അടുത്തുനിൽക്കുന്നു.
theological_decisions:
- issue: മൃഗത്തെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിന്റെ വ്യക്തിവൽക്കരണം
  choice: ‘അതിനോടു’ എന്ന നപുംസകസൂചന ഉപയോഗിച്ചു
  alternative: ‘അവനോടു’ എന്നു വ്യക്തിവൽക്കരിക്കുക
  rationale: ഗ്രീക്കിലെ αὐτοῦ നപുംസകലിംഗമായ θηρίον-നെയാണ് സൂചിപ്പിക്കുന്നത്. മൃഗം വ്യക്തിപരമായ പ്രവർത്തനം നടത്തുന്നുണ്ടെങ്കിലും ‘അവൻ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് വ്യാഖ്യാനപരമായ വ്യക്തിവൽക്കരണം കൂട്ടിച്ചേർക്കും.
- issue: ദൈവത്തിന്റെ താരതമ്യമില്ലായ്മയെക്കുറിച്ചുള്ള പഴയനിയമഭാഷയുടെ പ്രതിധ്വനി
  choice: ‘മൃഗത്തെപ്പോലെ ആരുണ്ട്?’ എന്ന വാചകം വിശദീകരണം ചേർക്കാതെ നിലനിർത്തി
  alternative: ഇത് ദൈവനിന്ദാപരമായ അനുകരണമാണെന്ന് മുഖ്യവാചകത്തിൽ തുറന്നുപറയുക
  rationale: ഈ ചോദ്യം ദൈവത്തിന്റെ അതുല്യതയെക്കുറിച്ചുള്ള പഴയനിയമവാക്യങ്ങളെ ദൈവനിന്ദാപരമായി മൃഗത്തിനു പ്രയോഗിക്കുന്നതായി തോന്നുന്നു. ആ അർത്ഥസംഘർഷം മുഖ്യവാചകം പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മഹാസർപ്പം’, ‘മൃഗം’, ‘അധികാരം’, ‘ആരാധിച്ചു’ എന്നീ പദങ്ങൾ അപ്പോക്കലിപ്റ്റിക് ഭാവവും മതപരമായ ഗൗരവവും നിലനിർത്തുന്നു. ആദ്യ ഗ്രീക്ക് καί മലയാളത്തിൽ അനാവശ്യമായി വാക്യം ‘എന്നിട്ട്’ എന്നു തുടങ്ങാതെ രണ്ടു സ്വാഭാവിക വാക്യങ്ങളാക്കി; രണ്ടാമത്തെ καί ‘മൃഗത്തെയും’ എന്നതിലൂടെ വ്യക്തമായി പ്രതിഫലിപ്പിച്ചു.
