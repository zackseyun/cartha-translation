id: REV.13.1
reference: Revelation 13:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: ml
  text: സമുദ്രത്തിൽനിന്ന് ഉയർന്നുവരുന്ന ഒരു മൃഗത്തെ ഞാൻ കണ്ടു. അതിന് പത്തു കൊമ്പുകളും ഏഴു തലകളും ഉണ്ടായിരുന്നു. അതിന്റെ കൊമ്പുകളിൽ പത്തു കിരീടങ്ങളും[a] തലകളിൽ ദൈവദൂഷണനാമങ്ങളും[b] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ കൃത്യമായി, “ഡയഡങ്ങൾ,” അഥവാ രാജകീയ ശിരോഭൂഷണങ്ങൾ.
    reason: διάδηματα എന്ന പദത്തിന്റെ കൂടുതൽ പ്രത്യേകമായ രാജകീയ അർഥം സൂചിപ്പിക്കുന്നു.
  - marker: b
    text: അഥവാ “ദൈവദൂഷണത്തിന്റെ പേരുകൾ.”
    reason: ὀνόματα βλασφημίας എന്ന ഗ്രീക്ക് നാമപദബന്ധത്തിന്റെ കൂടുതൽ രൂപാനുസൃതമായ വിവർത്തനം നൽകുന്നു.
lexical_decisions:
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ aorist രൂപം ലളിതമായ ഭൂതകാല ദർശനവിവരണമാണ്; ‘നോക്കിയപ്പോൾ കണ്ടു’ എന്നോ ‘ദർശനത്തിൽ കണ്ടു’ എന്നോ മൂലത്തിൽ ഇല്ലാത്ത ആശയം ചേർക്കുന്നില്ല.
- source_word: ἐκ τῆς θαλάσσης
  choice: സമുദ്രത്തിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന, സമുദ്രത്തിനുള്ളിൽനിന്നുള്ള ഉദയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാടിലെ പ്രതീകാത്മക ദൃശ്യത്തെ വ്യാഖ്യാനിച്ച് ‘രാക്ഷസൻ’ എന്നോ ഏതെങ്കിലും ഭരണശക്തിയെന്നോ മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἀναβαῖνον
  choice: കയറിവരുന്നതു
  rationale: വർത്തമാന കൃദന്തരൂപം ചിത്രീകരിക്കുന്ന തുടർന്നുകൊണ്ടിരിക്കുന്ന ഉയർന്നുവരവ് മലയാളത്തിൽ സജീവമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἔχον
  choice: അതിന് … ഉണ്ടായിരുന്നു
  rationale: ഗ്രീക്കിലെ വിവരണാത്മക കൃദന്തരൂപം മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥതാവാക്യമായി നൽകുന്നു.
- source_word: κέρατα δέκα
  choice: പത്തു കൊമ്പുകൾ
  rationale: പ്രതീകത്തെ വ്യാഖ്യാനിക്കാതെ അക്ഷരാർഥത്തിലുള്ള ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: κεφαλὰς ἑπτά
  choice: ഏഴു തലകൾ
  rationale: ഗ്രീക്കിലെ സംഖ്യയും ബഹുവചന ദൃശ്യവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: διαδήματα
  choice: കിരീടങ്ങൾ
  rationale: സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം മുഖ്യവാചകത്തിൽ ഉപയോഗിക്കുന്നു; രാജാധികാരത്തെ സൂചിപ്പിക്കുന്ന കൂടുതൽ കൃത്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπὶ τῶν κεράτων αὐτοῦ
  choice: അതിന്റെ കൊമ്പുകളിൽ
  rationale: ἐπίയുടെ സ്ഥാനസൂചക അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: തലകളിൽ
  rationale: തലകളിന്മേലുള്ള പേരുകളുടെ സ്ഥാനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὀνόματα βλασφημίας
  choice: ദൈവദൂഷണനാമങ്ങൾ
  rationale: βλασφημίαയുടെ മതപരമായ ഗൗരവവും ഗ്രീക്കിലെ നാമപദബന്ധവും ചുരുക്കവും ഗൗരവവുമുള്ള മലയാള സംയുക്തപദത്തിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പ്രതീകാത്മക അന്ത്യകാല ദൃശ്യഭാഷ
  choice: ‘മൃഗം,’ ‘കൊമ്പുകൾ,’ ‘തലകൾ,’ ‘കിരീടങ്ങൾ’ എന്നീ ദൃശ്യങ്ങൾ വ്യാഖ്യാനപരമായ തിരിച്ചറിയലുകളില്ലാതെ അതേപടി നിലനിർത്തി.
  alternative: മൃഗത്തെ ഒരു രാജ്യം, സാമ്രാജ്യം, ഭരണാധികാരി, അല്ലെങ്കിൽ സാത്താനിക പ്രതിനിധി എന്നിങ്ങനെ മുഖ്യവാചകത്തിൽ തിരിച്ചറിയുക.
  rationale: വാക്യം ദർശനത്തിലെ പ്രതീകങ്ങൾ അവതരിപ്പിക്കുന്നുവെങ്കിലും അവയുടെ നിർദിഷ്ട ചരിത്രപരമോ അന്ത്യകാലപരമോ ആയ തിരിച്ചറിയൽ ഇവിടെ പ്രസ്താവിക്കുന്നില്ല; അതിനാൽ വിവർത്തനം ഒരു പ്രത്യേക വ്യാഖ്യാനരീതി അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: διάδηματα എന്ന പദത്തിന്റെ രാജകീയ സൂക്ഷ്മാർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘കിരീടങ്ങൾ’; അടിക്കുറിപ്പിൽ ‘രാജകിരീടങ്ങൾ.’
  alternative: മുഖ്യവാചകത്തിൽ തന്നെ ‘രാജകിരീടങ്ങൾ’ ഉപയോഗിക്കുക.
  rationale: ‘കിരീടങ്ങൾ’ ആധുനിക മലയാളത്തിൽ എളുപ്പം ഗ്രഹിക്കാവുന്നതാണ്; അതേസമയം διάδημα എന്നത് സാധാരണ വിജയകിരീടത്തിൽനിന്ന് വ്യത്യസ്തമായ രാജകീയ ശിരോഭൂഷണമാണെന്ന സൂക്ഷ്മത അടിക്കുറിപ്പ് സംരക്ഷിക്കുന്നു.
- issue: ὀνόματα βλασφημίας എന്ന ബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘ദൈവദൂഷണനാമങ്ങൾ’ എന്ന നാമപദബന്ധം ഉപയോഗിച്ചു.
  alternative: ‘ദൈവത്തെ ദുഷിക്കുന്ന പേരുകൾ’ അല്ലെങ്കിൽ ‘ദൈവദൂഷണം നിറഞ്ഞ പേരുകൾ.’
  rationale: മൂലത്തിലെ genitive ബന്ധം കാരണമോ സ്വഭാവമോ എന്ന് അതിയായി വിശദീകരിക്കാതെ, പേരുകൾ ദൈവദൂഷണപരമാണെന്ന അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വായിക്കാനെളുപ്പമുള്ളതും ഗൗരവമുള്ളതുമായ ദർശനവിവരണശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി മൂന്ന് വാക്യങ്ങളാക്കി; എന്നാൽ ഘടകങ്ങളുടെ ക്രമവും പ്രതീകാത്മക ദൃശ്യവും നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് സൂചകങ്ങളുടെ സ്ഥാനവൈരുധ്യം മൂലപദങ്ങളോട് പൊരുത്തപ്പെടുത്തി തിരുത്തി: [a] കിരീടങ്ങൾക്കു ശേഷവും [b] ദൈവദൂഷണനാമങ്ങൾക്കു ശേഷവും.'
