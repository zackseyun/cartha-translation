id: REV.13.9
reference: Revelation 13:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἴ τις ἔχει οὖς ἀκουσάτω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/009.yaml
  text: If anyone has an ear[a], let him hear.
translation:
  language: ml
  text: കേൾക്കാൻ ചെവിയുള്ളവൻ കേൾക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴ τις
  choice: -ഉള്ളവൻ
  rationale: ഗ്രീക്കിലെ വ്യവസ്ഥാപരമായ ‘ആർക്കെങ്കിലും … ഉണ്ടെങ്കിൽ’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ പൊതുവാചകമായി ‘…ഉള്ളവൻ’ എന്നു സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു; ഇതിന്റെ പരാമർശം ഏതൊരാളെയും ഉൾക്കൊള്ളുന്നതാണ്.
- source_word: ἔχει οὖς
  choice: കേൾക്കാൻ ചെവിയുള്ളവൻ
  rationale: അക്ഷരാർഥത്തിലെ ‘ചെവിയുണ്ട്’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, ശാരീരികമായി ചെവിയുള്ളതിലുപരി ശ്രദ്ധിച്ചു സ്വീകരിക്കാനുള്ള ശേഷിയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. οὖς എന്ന ഏകവചനത്തിന്റെ ആശയം ‘ചെവി’ ആയി നിലനിർത്തുന്നു.
- source_word: ἀκουσάτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാം പുരുഷ ഏകവചന ആജ്ഞയുടെ ഗൗരവമുള്ള ആഹ്വാനം മലയാളത്തിലെ ‘-ട്ടെ’ രൂപം സ്വാഭാവികമായി നൽകുന്നു; ‘കേൾക്കുക’ എന്നത് ശ്രദ്ധയോടെ സ്വീകരിക്കുക എന്ന പ്രവാചകീയ പ്രയോഗത്തിന്റെ തുറന്ന അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കേൾവിക്കുള്ള ആഹ്വാനത്തിന്റെ പ്രയോഗാർഥം
  choice: ‘കേൾക്കട്ടെ’ എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുക
  alternative: ‘മനസ്സിലാക്കട്ടെ’ അല്ലെങ്കിൽ ‘ശ്രദ്ധിക്കട്ടെ’
  rationale: ഈ വാക്യം ശ്രദ്ധാപൂർവമായ സ്വീകരണത്തിനുള്ള പ്രവാചകീയ/അപ്പോക്കലിപ്റ്റിക് ആഹ്വാനമാണ്. ‘മനസ്സിലാക്കുക’ എന്നു വ്യാഖ്യാനിച്ചു ചുരുക്കാതെ ‘കേൾക്കുക’ എന്ന സാഹിത്യ-ദൈവശാസ്ത്ര പ്രതിധ്വനി സംരക്ഷിക്കുന്നു.
- issue: പൊതുവായ ഏകവചന പരാമർശം
  choice: ‘ഉള്ളവൻ’ എന്ന പൊതുവായ ഏകവചനരൂപം
  alternative: ‘ആർക്കെങ്കിലും … ഉണ്ടെങ്കിൽ, അവർ കേൾക്കട്ടെ’
  rationale: ഗ്രീക്കിലെ τις ലിംഗപരമായി അനിശ്ചിതമായ പൊതുപരാമർശമാണ്; ἀκουσάτω ഏകവചനവുമാണ്. മലയാളത്തിലെ പരമ്പരാഗത പൊതുവായ ‘ഉള്ളവൻ’ രൂപം ഏകവചനവും സൂക്തിസ്വഭാവവും നിലനിർത്തുന്നു; ഇവിടെ പുരുഷന്മാർക്ക് മാത്രമെന്ന അർഥം ഉദ്ദേശിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ സൂക്തിരൂപം. ‘ആർക്കെങ്കിലും ചെവിയുണ്ടെങ്കിൽ, അയാൾ കേൾക്കട്ടെ’ എന്ന കൂടുതൽ അക്ഷരാനുസൃത രൂപത്തേക്കാൾ ‘കേൾക്കാൻ ചെവിയുള്ളവൻ കേൾക്കട്ടെ’ മലയാളത്തിൽ സ്വാഭാവികവും ഓർമ്മിക്കാവുന്നതുമാണ്; അതേസമയം മൂലത്തിലെ ഏകവചനവും ‘കേൾക്കുക’ എന്ന മുഖ്യരൂപകവും നിലനിർത്തുന്നു.
