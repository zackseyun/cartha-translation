id: REV.13.8
reference: Revelation 13:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: ml
  text: ഭൂമിയിൽ വസിക്കുന്ന, ലോകസ്ഥാപനം മുതൽ അറുക്കപ്പെട്ട കുഞ്ഞാടിന്റെ ജീവപുസ്തകത്തിൽ പേര് എഴുതപ്പെട്ടിട്ടില്ലാത്ത എല്ലാവരും അവനെ ആരാധിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അറുക്കപ്പെട്ട കുഞ്ഞാടിന്റെ ജീവപുസ്തകത്തിൽ ലോകസ്ഥാപനം മുതൽ പേര് എഴുതപ്പെട്ടിട്ടില്ലാത്ത എല്ലാവരും.” ഗ്രീക്കിലെ “ലോകസ്ഥാപനം മുതൽ” എന്ന പ്രയോഗം “അറുക്കപ്പെട്ട” എന്നതിനോടോ “എഴുതപ്പെട്ടിട്ടില്ല” എന്നതിനോടോ ബന്ധിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: ആരാധിക്കും
  rationale: വെളിപ്പാടുപുസ്തകത്തിൽ ഈ പദം ദൈവത്തിനോ കുഞ്ഞാടിനോ മൃഗത്തിനോ അർപ്പിക്കുന്ന മതപരമായ വണക്കം സൂചിപ്പിക്കുന്നതിനാൽ ‘ആരാധിക്കും’ അതിന്റെ ശക്തി സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ വസിക്കുന്നവർ
  rationale: വെളിപ്പാടുപുസ്തകത്തിൽ ആവർത്തിക്കുന്ന പ്രയോഗത്തിന്റെ ക്രിയാരൂപവും അന്തർപാഠപരമായ സ്ഥിരതയും നിലനിർത്തുന്നു.
- source_word: οὗ ... τὸ ὄνομα αὐτοῦ
  choice: പേരെഴുതപ്പെട്ടിട്ടില്ലാത്ത ഏവരും
  rationale: ഗ്രീക്കിലെ ഏകവചനപരമായ വ്യക്തിഗത തിരിച്ചറിയൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ‘ഏവരും’ മുൻപുള്ള ‘എല്ലാവരും’ എന്നതിനെ വ്യക്തീകരിക്കുന്നു.
- source_word: γέγραπται
  choice: എഴുതപ്പെട്ടിട്ടില്ലാത്ത
  rationale: പൂർണ്ണകാലത്തിന്റെ മുൻകാല രേഖപ്പെടുത്തലും അതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥയും ഈ രൂപം സൂചിപ്പിക്കുന്നു.
- source_word: βιβλίῳ τῆς ζωῆς
  choice: ജീവപുസ്തകം
  rationale: അപ്പോക്കലിപ്റ്റിക ദൃശ്യരൂപത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗം.
- source_word: τοῦ ἀρνίου
  choice: കുഞ്ഞാടിന്റെ
  rationale: വെളിപ്പാടുപുസ്തകത്തിലെ ക്രിസ്തുസംബന്ധമായ ബലിദാന-മശീഹാ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
- source_word: τοῦ ἐσφαγμένου
  choice: അറുക്കപ്പെട്ട
  rationale: σφάζω എന്ന പദത്തിലെ ബലിദാനപരവും ഹിംസാത്മകവുമായ സൂചന ‘കൊല്ലപ്പെട്ട’ എന്നതിനെക്കാൾ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: ലോകസ്ഥാപനംമുതൽ
  rationale: ἀπό സഹിതമുള്ള കാലാരംഭം നേരിട്ട് പകർന്നു നൽകുകയും ബൈബിൾപ്രയോഗത്തിന്റെ ഗൗരവം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ലോകസ്ഥാപനംമുതൽ’ എന്ന കാലപ്രയോഗം ഏതിനോടാണ് ചേരുന്നത്
  choice: പ്രധാനപാഠത്തിൽ ‘അറുക്കപ്പെട്ട കുഞ്ഞാട്’ എന്നതിനോട് ചേർത്തു
  alternative: '‘പേരെഴുതപ്പെട്ടിട്ടില്ല’ എന്നതിനോട് ചേർത്ത്: ‘ലോകസ്ഥാപനംമുതൽ അറുക്കപ്പെട്ട കുഞ്ഞാടിന്റെ ജീവപുസ്തകത്തിൽ പേരെഴുതപ്പെട്ടിട്ടില്ലാത്ത ഏവരും’ എന്നല്ല, ‘അറുക്കപ്പെട്ട കുഞ്ഞാടിന്റെ ജീവപുസ്തകത്തിൽ ലോകസ്ഥാപനംമുതൽ പേരെഴുതപ്പെട്ടിട്ടില്ലാത്ത ഏവരും’'
  rationale: ഗ്രീക്ക് പദക്രമത്തിൽ ἀπὸ καταβολῆς κόσμου തൊട്ടുമുമ്പുള്ള τοῦ ἐσφαγμένου എന്നതിനോട് സ്വാഭാവികമായി ബന്ധപ്പെടാം. എന്നാൽ വെളിപ്പാട് 17:8-ലെ സമാന്തരപ്രയോഗം പേരെഴുതുന്നതിനോടുള്ള ബന്ധത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. യഥാർത്ഥ വ്യാകരണസന്ദിഗ്ധത പരിഹരിച്ചുകളയാതെ മുഖ്യവായനയും പാദക്കുറിപ്പിലെ മറ്റൊരു വായനയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘അതിനെ’ എന്ന നപുംസകലിംഗ സർവനാമം സന്ദർഭത്തിലെ മൃഗത്തെ സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന വെളിപ്പാട്-പ്രയോഗങ്ങൾക്ക് പരമ്പരാഗതമായെങ്കിലും സുതാര്യമായ പദങ്ങൾ തിരഞ്ഞെടുത്തു.
