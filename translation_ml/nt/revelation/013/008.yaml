revisions:
- from: ഭൂമിയിൽ വസിക്കുന്ന എല്ലാവരും അതിനെ ആരാധിക്കും—ലോകസ്ഥാപനംമുതൽ അറുക്കപ്പെട്ട കുഞ്ഞാടിന്റെ ജീവപുസ്തകത്തിൽ പേരെഴുതപ്പെട്ടിട്ടില്ലാത്ത ഏവരും.[a]
  to: ഭൂമിയിൽ വസിക്കുന്ന, ലോകസ്ഥാപനം മുതൽ അറുക്കപ്പെട്ട കുഞ്ഞാടിന്റെ ജീവപുസ്തകത്തിൽ പേര് എഴുതപ്പെട്ടിട്ടില്ലാത്ത എല്ലാവരും അവനെ ആരാധിക്കും.[a]
  rationale: The revision preserves the source syntax and the audit trail’s main reading, in which ‘from the foundation of the world’ modifies ‘the Lamb who was slain.’ The footnote retains the disputed alternative attachment to the inscription of names. It also renders the masculine object pronoun personally and regularizes Malayalam spacing.
