id: REV.13.12
reference: Revelation 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: ml
  text: അത് ഒന്നാമത്തെ മൃഗത്തിന്റെ സകല അധികാരവും അതിന്റെ സന്നിധിയിൽ[a] പ്രയോഗിക്കുന്നു. ഭൂമിയെയും അതിൽ വസിക്കുന്നവരെയും, മാരകമായ മുറിവ് സൗഖ്യം പ്രാപിച്ച ഒന്നാമത്തെ മൃഗത്തെ ആരാധിക്കുമാറാക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിന്റെ മുമ്പിൽ.’ രണ്ടാമത്തെ മൃഗം ഒന്നാമത്തെ മൃഗത്തിന്റെ ദൃഷ്ടിക്കു കീഴിലോ അതിന്റെ നേരിട്ടുള്ള സാന്നിധ്യത്തിലോ പ്രവർത്തിക്കുന്നു എന്നതിന് ഈ പ്രയോഗം ഊന്നൽ നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അതിന്റെ മരണത്തിന്റെ മുറിവ് സൗഖ്യം പ്രാപിച്ചു’; അതായത്, ‘അതിന്റെ മാരകമായ മുറിവ് സൗഖ്യം പ്രാപിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: വെറും ശക്തിയേക്കാൾ പ്രയോഗിക്കപ്പെടുന്ന അധികാരത്തെയോ അവകാശത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘അധികാരം’ യോജിക്കുന്നു.
- source_word: πᾶσαν
  choice: സകല
  rationale: ഒന്നാമത്തെ മൃഗത്തിന്റെ അധികാരത്തിന്റെ സമഗ്രത ഊന്നിപ്പറയുന്നു.
- source_word: ποιεῖ (first occurrence)
  choice: പ്രയോഗിക്കുന്നു
  rationale: ποιεῖ τὴν ἐξουσίαν എന്ന പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘അധികാരം പ്രയോഗിക്കുന്നു’ എന്നു വ്യക്തമാകുന്നു.
- source_word: ἐνώπιον αὐτοῦ
  choice: അതിന്റെ സന്നിധിയിൽ
  rationale: ഒന്നാമത്തെ മൃഗത്തിന്റെ മുമ്പിലോ അതിന്റെ സാന്നിധ്യത്തിലോ രണ്ടാമത്തെ മൃഗം പ്രവർത്തിക്കുന്നു എന്ന സ്ഥലപരവും ബന്ധപരവുമായ അർഥസാധ്യത നിലനിർത്തുന്നു.
- source_word: ποιεῖ (second occurrence)
  choice: പ്രേരിപ്പിക്കുന്നു
  rationale: ἵνα ഘടനയോടൊപ്പം കാരണകർത്തൃഭാവം നൽകുന്നു; ഗ്രീക്ക് നിർബന്ധത്തിന്റെ കൃത്യമായ അളവ് പറയാത്തതിനാൽ ‘നിർബന്ധിക്കുന്നു’ എന്നതിനെക്കാൾ ‘പ്രേരിപ്പിക്കുന്നു’ ആ അനിശ്ചിതത്വം നന്നായി കാക്കുന്നു.
- source_word: τὴν γῆν
  choice: ഭൂമിയെ
  rationale: വെളിപ്പാടിലെ ആഗോളവും പ്രളയദർശനപരവുമായ പശ്ചാത്തലത്തിന് ‘ഭൂമി’ യോജിക്കുന്നു.
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: അതിൽ വസിക്കുന്നവരെ
  rationale: κατοικέω എന്ന ക്രിയാത്മക പ്രയോഗവും വെളിപ്പാടിലെ ആവർത്തിതമായ ‘ഭൂവാസികൾ’ എന്ന ആശയവും കാക്കുന്നു.
- source_word: ἵνα προσκυνήσουσιν
  choice: ആരാധിക്കാൻ
  rationale: കാരണകർത്തൃഘടനയെ സ്വാഭാവിക മലയാളത്തിലെ ഉദ്ദേശ്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: θηρίον
  choice: മൃഗം
  rationale: പ്രളയദർശനസന്ദർഭത്തിലെ θηρίον എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും പതിവുമായ മലയാളരൂപം.
- source_word: πρῶτον
  choice: ഒന്നാമത്തെ
  rationale: തൊട്ടുമുമ്പുള്ള രണ്ടാമത്തെ മൃഗത്തിൽനിന്ന് ഇതിനെ വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: ἐθεραπεύθη
  choice: സൗഖ്യമായി
  rationale: നിഷ്ക്രിയരൂപത്തിലെ രോഗശാന്തി/മുറിവുണങ്ങൽ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: മരണകരമായ മുറിവ്
  rationale: അക്ഷരാർഥത്തിലെ ‘മരണത്തിന്റെ മുറിവ്’ എന്ന ഘടനയുടെ അർഥം, മരണം വരുത്തുന്ന മുറിവ് എന്ന നിലയിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ഭൂമിയെയും ഭൂവാസികളെയും സംബന്ധിച്ച രണ്ടാമത്തെ മൃഗത്തിന്റെ പ്രവർത്തനത്തിന്റെ ബലം
  choice: ആരാധിക്കാൻ ... പ്രേരിപ്പിക്കുന്നു
  alternative: ആരാധിക്കാൻ നിർബന്ധിക്കുന്നു / ആരാധിക്കുമാറാക്കുന്നു
  rationale: ഗ്രീക്ക് കാരണകർത്തൃഭാവം വ്യക്തമാക്കുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ നിർബന്ധത്തിന്റെ അളവ് പ്രത്യേകം നിർവചിക്കുന്നില്ല. അതിനാൽ കാരണകർത്തൃത്വം കാത്തുകൊണ്ട് അതിലധികം ബലം ചേർക്കാത്ത രൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വെളിപ്പാടിന്റെ ദർശനഭാഷ നിലനിർത്താൻ ‘മൃഗം,’ ‘സകല അധികാരം,’ ‘വസിക്കുന്നവർ’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
