revisions:
- from: അത് ഒന്നാമത്തെ മൃഗത്തിന്റെ സകല അധികാരവും അതിന്റെ സന്നിധിയിൽ[a] പ്രയോഗിക്കുന്നു. ഭൂമിയെയും അതിൽ വസിക്കുന്നവരെയും, മരണകരമായ മുറിവ് സൗഖ്യമായ ഒന്നാമത്തെ മൃഗത്തെ ആരാധിക്കാൻ അത് പ്രേരിപ്പിക്കുന്നു.[b]
  to: അത് ഒന്നാമത്തെ മൃഗത്തിന്റെ സകല അധികാരവും അതിന്റെ സന്നിധിയിൽ[a] പ്രയോഗിക്കുന്നു. ഭൂമിയെയും അതിൽ വസിക്കുന്നവരെയും, മാരകമായ മുറിവ് സൗഖ്യം പ്രാപിച്ച ഒന്നാമത്തെ മൃഗത്തെ ആരാധിക്കുമാറാക്കുന്നു.[b]
  rationale: രണ്ടാമത്തെ ποιεῖ-യുടെ കാരണകർത്തൃബലം ‘ആരാധിക്കുമാറാക്കുന്നു’ എന്നതിലൂടെ പുനഃസ്ഥാപിച്ചു; ഇത് ‘നിർബന്ധിക്കുന്നു’ എന്നതുപോലുള്ള അതിരുകടന്ന ബലം ചേർക്കുന്നില്ല. മുറിവ് സൗഖ്യം പ്രാപിച്ചതാണെന്ന വ്യാകരണബന്ധം പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും വ്യക്തമാക്കി.
