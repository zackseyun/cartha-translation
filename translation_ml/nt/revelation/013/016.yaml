reference: Revelation 13:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the servants—to be given a mark on their right hand or on their forehead,
translation:
  language: ml
  text: അത് എല്ലാവരെയും—ചെറിയവരെയും വലിയവരെയും, ധനികരെയും ദരിദ്രരെയും, സ്വതന്ത്രരെയും അടിമകളെയും—അവരുടെ വലതുകൈയിലോ അവരുടെ നെറ്റിയിലോ ഒരു അടയാളം നൽകപ്പെടാൻ ഇടയാക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവർ അവർക്ക് ഒരു അടയാളം നൽകാൻ.” ഗ്രീക്കിലെ പ്രയോഗം അസാധാരണമാണ്; മുഖ്യപാഠം അതിന്റെ അർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: ഇടയാക്കുന്നു
  rationale: ἵνα + ഉപവാക്യത്തോടൊപ്പം ഇവിടെ കാരണാർത്ഥം പ്രകടമാക്കുന്നു. ‘ഇടയാക്കുന്നു’ ഫലപ്രദമായ പ്രവർത്തനം വ്യക്തമാക്കുമ്പോഴും ക്രിയയിൽ ഉള്ളതിലധികം ബലപ്രയോഗം സൂചിപ്പിക്കുന്നില്ല.
- source_word: πάντας
  choice: എല്ലാവരെയും
  rationale: തുടർന്നുവരുന്ന വിപരീത സാമൂഹിക വിഭാഗങ്ങളെ മുഴുവനായി ഉൾക്കൊള്ളുന്ന വ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: ചെറിയവരെയും വലിയവരെയും
  rationale: സാമൂഹിക പദവികളുടെ മുഴുവൻ പരിധിയെയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് യുഗ്മത്തിന്റെ രൂപകാത്മകതയും വെളിപ്പാടിന്റെ താളവും നിലനിർത്തുന്നു.
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: ധനികരെയും ദരിദ്രരെയും
  rationale: സാമ്പത്തിക നിലയിലെ പതിവായ വിപരീതജോടിയെ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: സ്വതന്ത്രരെയും അടിമകളെയും
  rationale: ‘സ്വതന്ത്രർ’ എന്നതുമായുള്ള നേരിട്ടുള്ള വൈരുധ്യം δοῦλος ഇവിടെ നിയമപരവും സാമൂഹികവുമായ അടിമസ്ഥിതിയെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: ഒരു അടയാളം പതിപ്പിക്കപ്പെടാൻ
  rationale: സാക്ഷ്യപ്പെടുത്തിയ ഗ്രീക്ക് പദക്രമം അക്ഷരാർഥത്തിൽ സജീവ ബഹുവചനമാണെങ്കിലും സന്ദർഭത്തിലെ സംഭവത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പറയാൻ കർമണിപ്രയോഗം ഉപയോഗിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: χάραγμα
  choice: അടയാളം
  rationale: തിരിച്ചറിയിക്കുന്ന കൊത്തുപാടിനെയോ മുദ്രയെയോ സൂചിപ്പിക്കുന്ന χάραγμα എന്ന പദത്തിന് വെളിപ്പാടിന്റെ സന്ദർഭത്തിൽ വ്യക്തവും പരമ്പരാഗതവുമായ മലയാളപദമാണ്.
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς
  choice: അവരുടെ വലതുകൈയിൽ
  rationale: ഓരോ വ്യക്തിയെയും ഉദ്ദേശിക്കുന്ന വിതരണാർത്ഥ ഏകവചനഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: അല്ലെങ്കിൽ അവരുടെ നെറ്റിയിൽ
  rationale: ഗ്രീക്കിലെ സ്ഥാനവാചകവും ഏകവചനഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു; സംയുക്തരൂപത്തിൽ ‘വലതുകൈയിലോ നെറ്റിയിലോ’ എന്നു ചുരുക്കിയിരിക്കുന്നു.
theological_decisions:
- issue: സാമൂഹിക പദവികളുടെ ജോടിയിൽ δοῦλος എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: ‘സ്വതന്ത്രർ’ എന്ന വിപരീതപദം ബന്ധിതമായ നിയമ-സാമൂഹിക നിലയെ മുൻനിർത്തുന്നതിനാൽ ‘അടിമകൾ’ ആണ് ഇവിടെ കൃത്യം; പൊതുവായ സേവനമെന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- issue: ദുഷ്കരമായ ἵνα δῶσιν αὐτοῖς χάραγμα എന്ന ഉപവാക്യം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: ഒരു അടയാളം പതിപ്പിക്കപ്പെടാൻ ഇടയാക്കുന്നു
  alternative: അവർക്ക് ഒരു അടയാളം നൽകേണ്ടതിന്
  rationale: മുഖ്യപാഠം സ്വാഭാവികമായ മലയാളത്തിൽ സംഭവത്തിന്റെ അർത്ഥം നൽകുന്നു; പ്രവർത്തകർ ആരാണെന്നത് നിർണ്ണയിച്ച് ചേർക്കുന്നില്ല. ഗ്രീക്കിലെ അസാധാരണമായ സജീവ ബഹുവചനരൂപം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മൂന്ന് വിപരീതജോടികളുടെ ആവർത്തനതാളം നിലനിർത്തിയിട്ടുണ്ട്. ‘പതിപ്പിക്കുക’ എന്നത് ശരീരത്തിന്മേലുള്ള χάραγμα എന്ന അടയാളത്തിന്റെ സ്വഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; പ്രവർത്തകനെ പാഠത്തിന് പുറത്തുനിന്ന് നിർണ്ണയിച്ചിട്ടില്ല.
