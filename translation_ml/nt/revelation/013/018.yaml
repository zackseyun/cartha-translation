  source_fidelity: 'ഗ്രീക്ക് പാഠത്തിലെ വാക്യഘടനയും മുഖ്യപദങ്ങളും വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: ὧδε ἡ σοφία ἐστίν എന്നതിന് ‘ഇവിടെയാണ് ജ്ഞാനം,’ ὁ ἔχων νοῦν എന്നതിന് ‘വിവേകമുള്ളവൻ,’ ψηφισάτω എന്നതിന് ‘കണക്കുകൂട്ടട്ടെ,’ θηρίον എന്നതിന് ‘മൃഗം,’ എന്നിവ യോജിച്ചിരിക്കുന്നു. ἀριθμὸς γὰρ ἀνθρώπου ἐστίν എന്ന വിവാദസാധ്യതയുള്ള പ്രയോഗം ‘മനുഷ്യന്റെ സംഖ്യ’ എന്നതിലൂടെ അനാവശ്യമായി ഒരു വ്യാഖ്യാനത്തിലേക്കു ചുരുക്കാതെ സൂക്ഷിക്കുന്നു. 666 പ്രധാനപാഠമായും 616 പാഠഭേദമായും ശരിയായി നൽകിയിരിക്കുന്നു.'
  naturalness: പാഠം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘വിവേകമുള്ളവൻ’ എന്ന പൊതുവായ ഏകവചനപ്രയോഗവും ‘കണക്കുകൂട്ടട്ടെ’ എന്ന ആഹ്വാനരൂപവും സന്ദർഭത്തിനു യോജിക്കുന്നു. അർധവിരാമത്തിനു ശേഷമുള്ള അവസാന സ്വതന്ത്രവാക്യം വായനാസൗകര്യം നൽകുമ്പോഴും ഗ്രീക്കിലെ ബന്ധം മതിയായ രീതിയിൽ നിലനിർത്തുന്നു.
