id: REV.13.18
reference: Revelation 13:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: ml
  text: 'ഇവിടെയാണ് ജ്ഞാനം: വിവേകമുള്ളവൻ മൃഗത്തിന്റെ സംഖ്യ കണക്കുകൂട്ടട്ടെ; കാരണം അത് മനുഷ്യന്റെ സംഖ്യയാണ്[a]. അതിന്റെ സംഖ്യ അറുനൂറ്റി അറുപത്താറ്[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു മനുഷ്യന്റെ സംഖ്യ’ എന്നും ‘മാനുഷികമായ സംഖ്യ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ 666 എന്നതിനുപകരം 616 എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: ഇവിടെയാണ് ജ്ഞാനം
  rationale: പ്രയോഗത്തിന്റെയോ തിരിച്ചറിവിന്റെയോ നിർണായക സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ὧδε എന്ന പദത്തിന്റെ പ്രകടനശക്തി നിലനിർത്തിക്കൊണ്ട്, വാക്യം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ ἔχων νοῦν
  choice: വിവേകമുള്ളവൻ
  rationale: νοῦς ഇവിടെ കേവലം മനസ്സ് എന്ന അവയവാർഥത്തിലല്ല, ഗ്രഹിക്കാനും തിരിച്ചറിയാനുമുള്ള വിവേകത്തെ സൂചിപ്പിക്കുന്നു. ഏകവചനവും പൊതുവായ ആഹ്വാനവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ψηφισάτω
  choice: കണക്കുകൂട്ടട്ടെ
  rationale: സംഖ്യ എണ്ണി നിർണയിക്കുകയോ കണക്കിലൂടെ കണ്ടെത്തുകയോ ചെയ്യാനുള്ള ഏകവചന ആജ്ഞയാണ്; ആ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: മൃഗത്തിന്റെ സംഖ്യ
  rationale: വെളിപ്പാടിലെ അപോകലിപ്റ്റിക പശ്ചാത്തലത്തിൽ θηρίον എന്നതിന് സ്ഥിരവും നേരിട്ടുള്ളതുമായ ‘മൃഗം’ ഉപയോഗിക്കുകയും ഉടമസ്ഥബന്ധം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: കാരണം അത് മനുഷ്യന്റെ സംഖ്യയാണ്
  rationale: ἀνθρώπου എന്ന ഏകവചന ഷഷ്ഠിവിഭക്തി ഒരു പ്രത്യേക മനുഷ്യനെയോ മനുഷ്യനെ പൊതുവായോ മാനുഷിക സ്വഭാവത്തെയോ സൂചിപ്പിക്കാം. നിർവചനോപപദങ്ങളില്ലാത്ത മലയാളത്തിലെ ‘മനുഷ്യന്റെ’ ഈ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: καὶ ὁ ἀριθμὸς αὐτοῦ
  choice: അതിന്റെ സംഖ്യ
  rationale: αὐτοῦ എന്ന സർവനാമം നപുംസകലിംഗമായ θηρίον എന്ന പദത്തിലേക്കാണ് മടങ്ങുന്നത്; ‘അതിന്റെ’ എന്നത് വ്യാകരണബന്ധം സുതാര്യമാക്കുന്നു.
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: അറുനൂറ്റി അറുപത്താറ്
  rationale: ഗ്രീക്ക് സംഖ്യയുടെ നേരിട്ടുള്ളതും സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവുമായ പദരൂപം.
theological_decisions:
- issue: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν എന്നതിലെ ἀνθρώπου എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാന പാഠത്തിൽ ‘മനുഷ്യന്റെ സംഖ്യ’
  alternative: ‘ഒരു മനുഷ്യന്റെ സംഖ്യ’ അല്ലെങ്കിൽ ‘മാനുഷികമായ സംഖ്യ’
  rationale: ഗ്രീക്ക് വാക്യം ഒരു പ്രത്യേക വ്യക്തിയുടെ സംഖ്യ, മനുഷ്യനുമായി ബന്ധപ്പെട്ട സംഖ്യ, അല്ലെങ്കിൽ ദൈവികമല്ലാത്ത മാനുഷിക സംഖ്യ എന്നീ സാധ്യതകളിൽ ഒന്നിനെ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല. പ്രധാന പാഠം ഈ വ്യാഖ്യാനപിരിമുറുക്കം നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: സംഖ്യയുടെ പാഠഭേദം
  choice: പ്രധാന പാഠത്തിൽ 666
  alternative: '616'
  rationale: SBLGNT-യുടെ പ്രധാന പാഠം 666 പിന്തുടരുന്നു; ശ്രദ്ധേയമായ 616 എന്ന കൈയെഴുത്തുപ്രതി പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അപോകലിപ്റ്റിക പദമായ ‘മൃഗം’ നിലനിർത്തി; പ്രസിദ്ധമായ സംഖ്യയെ അക്കങ്ങളാക്കാതെ പദരൂപത്തിൽ നൽകി. ഗ്രീക്കിലെ γάρ വ്യക്തമാക്കാൻ ‘കാരണം’ ഉപയോഗിച്ചു; καί-യാൽ ബന്ധിപ്പിച്ച അവസാന പ്രസ്താവന മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി വേറൊരു വാക്യമായി നൽകി.
