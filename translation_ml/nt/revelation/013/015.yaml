- from: മൃഗത്തിന്റെ പ്രതിമയ്ക്കു ശ്വാസം[a] നൽകാൻ അവന് അധികാരം നൽകപ്പെട്ടു. അങ്ങനെ ആ പ്രതിമ സംസാരിക്കുകപോലും ചെയ്യുകയും, അതിനെ ആരാധിക്കാത്തവരെല്ലാം കൊല്ലപ്പെടാൻ ഇടയാക്കുകയും ചെയ്തു.[b]
  to: മൃഗത്തിന്റെ പ്രതിമയ്ക്കു ശ്വാസം[a] നൽകാനുള്ള അധികാരം അവന് നൽകപ്പെട്ടു; അങ്ങനെ മൃഗത്തിന്റെ പ്രതിമ സംസാരിക്കുകപോലും ചെയ്യാനും, മൃഗത്തിന്റെ പ്രതിമയെ ആരാധിക്കാത്തവരെല്ലാം കൊല്ലപ്പെടേണ്ടവിധം പ്രവർത്തിക്കാനും.
