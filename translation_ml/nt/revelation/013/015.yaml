id: REV.13.15
reference: Revelation 13:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: ml
  text: മൃഗത്തിന്റെ പ്രതിമയ്ക്കു ശ്വാസം[a] നൽകാനുള്ള അധികാരം അവന് നൽകപ്പെട്ടു; അങ്ങനെ മൃഗത്തിന്റെ പ്രതിമ സംസാരിക്കുകപോലും ചെയ്യാനും, മൃഗത്തിന്റെ പ്രതിമയെ ആരാധിക്കാത്തവരെല്ലാം കൊല്ലപ്പെടേണ്ടവിധം പ്രവർത്തിക്കാനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘ജീവൻ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: അവന് അധികാരം നൽകപ്പെട്ടു
  rationale: നൽകുന്നയാൾ ആരെന്നു വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു. മലയാളത്തിൽ അപൂർണ്ണമായി തോന്നുന്ന ‘അവന് നൽകപ്പെട്ടു’ എന്നതിനുപകരം, സന്ദർഭത്തിലെ അനുവദിച്ച കഴിവ്/അധികാരം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δοῦναι πνεῦμα
  choice: ശ്വാസം നൽകാൻ
  rationale: പ്രതിമ സംസാരിക്കാൻ തുടങ്ങുന്ന സന്ദർഭത്തിൽ πνεῦμα എന്ന പദത്തിന്റെ ‘ശ്വാസം’ എന്ന മൂർത്തമായ അർഥം യോജിക്കുന്നു; ‘ആത്മാവ്’ എന്നതിനെക്കാൾ കുറച്ച് വ്യാഖ്യാനാത്മകവും ‘ജീവൻ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ബഹുവ്യഞ്ജകതയോട് അടുത്തതുമാണ്.
- source_word: εἰκών
  choice: പ്രതിമ
  rationale: ആരാധനയ്ക്കുള്ള മൃഗത്തിന്റെ ദൃശ്യരൂപത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം; അതിനെ നിർബന്ധമായി ഒരു പ്രത്യേകതരം ശില്പമായി ചുരുക്കുന്നില്ല.
- source_word: θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാടുപുസ്തകത്തിലെ സ്ഥാപിതമായ അപ്പോക്കലിപ്റ്റിക് പ്രയോഗം നിലനിർത്തുന്നു; ‘ഭീകരജീവി’ പോലുള്ള പദങ്ങൾ അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കും.
- source_word: ἵνα καὶ λαλήσῃ
  choice: അങ്ങനെ ആ പ്രതിമ സംസാരിക്കുകപോലും ചെയ്യുകയും
  rationale: ἵναയുടെ ഉദ്ദേശ്യം/ഫലബന്ധം ‘അങ്ങനെ’കൊണ്ട് പ്രകടമാക്കുകയും, καί നൽകുന്ന അതിശയോക്തിപരമായ ഊന്നൽ ‘പോലും’കൊണ്ട് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ποιήσῃ ἵνα
  choice: കൊല്ലപ്പെടാൻ ഇടയാക്കുകയും ചെയ്തു
  rationale: ποιέωയ്ക്ക് പിന്നാലെയുള്ള ἵνα-വാക്യത്തിന്റെ കാരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആരാണ് നേരിട്ട് കൊന്നതെന്ന് പാഠത്തിൽ ഇല്ലാത്ത വിവരം ചേർക്കുന്നില്ല.
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: അതിനെ ആരാധിക്കാത്തവരെല്ലാം
  rationale: അനിശ്ചിത ബന്ധവാക്യത്തിന്റെ സമഗ്രത ‘എല്ലാം’കൊണ്ട് സൂചിപ്പിക്കുകയും, προσκυνέωയുടെ മതപരമായ അർഥം ‘ആരാധിക്കുക’കൊണ്ട് നൽകുകയും ചെയ്യുന്നു.
- source_word: ἀποκτανθῶσιν
  choice: കൊല്ലപ്പെടാൻ
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തുന്ന വ്യക്തവും ആധുനികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: മൃഗത്തിന്റെ പ്രതിമയെ സജീവമാക്കുന്നതിലെ πνεῦμα എന്ന പദത്തിന്റെ അർഥം
  choice: ശ്വാസം
  alternative: ആത്മാവ്; ജീവൻ
  rationale: പ്രതിമ സംസാരിക്കുന്നതായി പറയുന്നതിനാൽ ‘ശ്വാസം’ സൃഷ്ടിയുടെ വികൃതാനുകരണത്തെ സൂചിപ്പിക്കാൻ കഴിയും; അതേസമയം പ്രതിമയ്ക്ക് യഥാർഥ ദിവ്യജീവനോ വ്യക്തിപരമായ ആത്മാവോ ലഭിച്ചുവെന്ന് വിവർത്തനം മുൻകൂട്ടി തീരുമാനിക്കുന്നില്ല.
- issue: ἐδόθη എന്ന ദൈവിക കർമണിപ്രയോഗത്തിലെ നൽകുന്നയാൾ
  choice: നൽകുന്നയാളെ വ്യക്തമാക്കാതെ വെച്ചു
  alternative: ദൈവം നൽകി; സാത്താൻ നൽകി
  rationale: ഗ്രീക്ക് പാഠം നൽകുന്നയാളെ പേരെടുത്ത് പറയുന്നില്ല. അതിനാൽ ദൈവത്തെയോ സാത്താനെയോ വിവർത്തനത്തിൽ ചേർക്കാതെ മൂലപാഠത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ അവ്യക്തത സംരക്ഷിച്ചു.
- issue: കൊലപാതകത്തിലേക്കുള്ള കാരണബന്ധം
  choice: പ്രതിമ ആരാധിക്കാത്തവർ കൊല്ലപ്പെടാൻ ഇടയാക്കുന്നു
  alternative: പ്രതിമയെ ആരാധിക്കാത്ത എല്ലാവരും കൊല്ലപ്പെടത്തക്കവിധം അതു പ്രവർത്തിക്കുന്നു
  rationale: ποιήσῃ ἵνα എന്ന ഘടനയുടെ കാരണാർഥം പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായി നൽകിയെങ്കിലും, ഘടനയെ കൂടുതൽ വാക്കുതോറും പ്രതിഫലിപ്പിക്കുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ശ്വാസം’, ‘പ്രതിമ’, ‘ആരാധിക്കുക’, ‘കൊല്ലപ്പെടുക’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ദീർഘവാക്യം മലയാളവായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും കാരണ-ഫലബന്ധവും പ്രതിമയുടെ വ്യാകരണപരമായ കർത്തൃത്വവും നിലനിർത്തി.
