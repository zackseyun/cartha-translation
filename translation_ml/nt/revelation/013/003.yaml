id: REV.13.3
reference: Revelation 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: ml
  text: അതിന്റെ തലകളിലൊന്ന് കൊല്ലപ്പെടുംവിധം അറുക്കപ്പെട്ടതുപോലെ ആയിരുന്നു[a], അതിന്റെ മരണകരമായ മുറിവ് സുഖപ്പെട്ടു. ഭൂമി മുഴുവൻ വിസ്മയഭരിതമായി മൃഗത്തിന്റെ പിന്നാലെ ചെന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘കൊല്ലപ്പെടുംവിധം അറുക്കപ്പെട്ടതായി കാണപ്പെട്ടു.’ ഗ്രീക്കിലെ ‘പോലെ’ എന്ന പ്രയോഗം നേരിട്ടുള്ള ഉറപ്പിനേക്കാൾ പ്രത്യക്ഷതയെയോ സാദൃശ്യത്തെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: ‘ദേശം മുഴുവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഈ അപ്പോക്കലിപ്റ്റിക് പശ്ചാത്തലത്തിൽ ‘ഭൂമി മുഴുവൻ’ എന്നതാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: അതിന്റെ തലകളിലൊന്ന്
  rationale: μίαν ἐκ എന്ന ഭാഗസൂചക പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: ὡς ἐσφαγμένην εἰς θάνατον
  choice: കൊല്ലപ്പെടുംവിധം അറുക്കപ്പെട്ടതുപോലെ ആയിരുന്നു
  rationale: σφάζω എന്നതിലെ അറുക്കൽ/കശാപ്പുചെയ്യൽ എന്ന ശക്തമായ ദൃശ്യവും εἰς θάνατον എന്നതിലെ മരണകരമായ ഫലവും നിലനിർത്തുന്നു; ὡς സൂചിപ്പിക്കുന്ന സാദൃശ്യമോ പ്രത്യക്ഷതയോ ‘പോലെ’ വഴി സംരക്ഷിക്കുന്നു.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: അതിന്റെ മരണകരമായ മുറിവ്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അതിന്റെ മരണത്തിന്റെ മുറിവ്’ എന്ന അസ്വാഭാവിക രൂപം ഒഴിവാക്കി, മരണത്തിലേക്കു നയിക്കുന്ന മുറിവെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐθεραπεύθη
  choice: സുഖപ്പെട്ടു
  rationale: മുറിവ് ഭേദമായതോ പുനഃസ്ഥാപിക്കപ്പെട്ടതോ സൂചിപ്പിക്കുന്ന കർമണാർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐθαυμάσθη
  choice: വിസ്മയിച്ച്
  rationale: ഭൂമി മുഴുവൻ അത്ഭുതഭരിതമായ പ്രതികരണം പ്രകടിപ്പിച്ചു എന്ന ആശയം നൽകുന്നു; ആ വിസ്മയം അനുകൂലമോ പ്രതികൂലമോ എന്ന് നിർണയിക്കുന്നില്ല.
- source_word: ὅλη ἡ γῆ
  choice: ഭൂമി മുഴുവൻ
  rationale: γῆ എന്നതിന് ‘ദേശം’ എന്നും അർഥമുണ്ടെങ്കിലും, വെളിപ്പാടിലെ ഈ സർവവ്യാപക അപ്പോക്കലിപ്റ്റിക് പശ്ചാത്തലത്തിൽ ‘ഭൂമി മുഴുവൻ’ കൂടുതൽ യോജിക്കുന്നു.
- source_word: ὀπίσω τοῦ θηρίου
  choice: മൃഗത്തിന്റെ പിന്നാലെ ചെന്നു
  rationale: ദിശാസൂചനയും മൃഗത്തെ അനുഗമിക്കുന്നതോ അതിനോട് ചേരുന്നതോ ആയ ഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: θηρίου
  choice: മൃഗം
  rationale: വെളിപ്പാടിലെ θηρίον എന്ന അപ്പോക്കലിപ്റ്റിക് പ്രതീകത്തിനുള്ള പതിവും സുതാര്യവുമായ മലയാളപദം.
theological_decisions:
- issue: മൃഗത്തിന്റെ തലയുടെ പ്രത്യക്ഷമരണത്തിന്റെയും സൗഖ്യത്തിന്റെയും സ്വഭാവം
  choice: ഒരു തല മരണത്തിലേക്കു അറുക്കപ്പെട്ടതുപോലെ ഉണ്ടായിരുന്നുവെന്നും അതിന്റെ മരണകരമായ മുറിവ് സുഖപ്പെട്ടുവെന്നും മാത്രം വിവർത്തനം ചെയ്യുന്നു.
  alternative: ഇത് അക്ഷരാർഥത്തിലുള്ള മരണം-പുനരുത്ഥാനം, സാമ്രാജ്യത്തിന്റെയോ ഭരണാധികാരിയുടെയോ പ്രതീകാത്മക വീണ്ടെടുപ്പ്, അല്ലെങ്കിൽ വഞ്ചനാപരമായ നാടകീയ പ്രത്യക്ഷത എന്നിങ്ങനെ ഏതെങ്കിലും ഒരൊറ്റ വ്യാഖ്യാനമായി നിർണയിക്കുക.
  rationale: ὡς (‘പോലെ’) പ്രത്യക്ഷതയോ സാദൃശ്യമോ തുറന്നുവെക്കുന്നു; മുറിവിന്റെ സൗഖ്യം എങ്ങനെ മനസ്സിലാക്കണം എന്ന് വാക്യം തീർപ്പാക്കുന്നില്ല. അതിനാൽ വിവർത്തനം ദൈവശാസ്ത്രപരമായ ഈ സംഘർഷവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘അറുക്കപ്പെട്ടത്,’ ‘മരണകരമായ മുറിവ്,’ ‘പിന്നാലെ ചെന്നു’ എന്നീ പദപ്രയോഗങ്ങൾ ദൃശ്യത്തിന്റെ ശക്തിയും അനുഗമനത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ ഉറപ്പുകൾ ചേർത്തിട്ടില്ല.
