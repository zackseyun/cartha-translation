id: REV.13.14
reference: Revelation 13:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: ml
  text: അത് മൃഗത്തിന്റെ സന്നിധിയിൽ അതിന് ചെയ്യാൻ അനുവാദം ലഭിച്ച അടയാളങ്ങൾ മുഖേന ഭൂമിയിൽ വസിക്കുന്നവരെ വഞ്ചിക്കുന്നു[a]. വാളിന്റെ മുറിവുള്ളതും ജീവിച്ചതുമായ ആ മൃഗത്തിനായി ഒരു പ്രതിമ ഉണ്ടാക്കാൻ[b] ഭൂമിയിൽ വസിക്കുന്നവരോടു പറയുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂമിയിൽ വസിക്കുന്നവരെ വഴിതെറ്റിക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മൃഗത്തിന്റെ ഒരു പ്രതിമ ഉണ്ടാക്കാൻ’; ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘മൃഗത്തിനായി ഒരു പ്രതിമ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: 'അവസാന ഭാഗം ഇങ്ങനെയും പരിഭാഷപ്പെടുത്താം: ‘വാളിന്റെ മുറിവുള്ളതും വീണ്ടും ജീവിച്ചതുമായ മൃഗത്തിനായി.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: വഞ്ചിക്കുന്നു
  rationale: വഴിതെറ്റിക്കൽ എന്ന ഫലമുൾപ്പെടുന്ന ക്രിയയുടെ വർത്തമാനകാല സജീവഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατοικοῦντας / κατοικοῦσιν ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ വസിക്കുന്നവർ
  rationale: വെളിപ്പാടിലെ ആവർത്തിത പ്രയോഗത്തിന്റെ ക്രിയാത്മക സ്വഭാവവും വിഷയപരമായ ഏകതയും നിലനിർത്തുന്നു.
- source_word: διὰ τὰ σημεῖα
  choice: അടയാളങ്ങൾ മുഖേന
  rationale: διάയിലുള്ള കാരണ-കരണോപാധി അർത്ഥങ്ങളിൽ ഇവിടെ വഞ്ചന നടപ്പാകുന്ന മാർഗം മുൻനിൽക്കുന്നതിനാൽ 'മുഖേന' തിരഞ്ഞെടുത്തു; കാരണാർത്ഥവും സാഹചര്യത്തിൽ നിലനിൽക്കുന്നു.
- source_word: σημεῖα
  choice: അടയാളങ്ങൾ
  rationale: '''അത്ഭുതകരമായ'' എന്ന വിശദീകരണം ചേർക്കാതെ മൂലപദത്തിന്റെ വിശാലമായ അർത്ഥപരിധി സംരക്ഷിക്കുന്നു.'
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: ചെയ്യാൻ അനുവാദം ലഭിച്ച
  rationale: മലയാളത്തിലെ സ്വാഭാവികമായ നിഷ്ക്രിയപ്രയോഗത്തിലൂടെ അനുവദിക്കപ്പെട്ട അധികാരം സൂചിപ്പിക്കുന്നു; അനുവദിച്ചവൻ ആരെന്ന് വ്യക്തമാക്കുന്നില്ല.
- source_word: ἐνώπιον τοῦ θηρίου
  choice: മൃഗത്തിന്റെ സന്നിധിയിൽ
  rationale: സ്ഥലപരവും ബന്ധപരവുമായ അർത്ഥം dignified Malayalam-ൽ കൃത്യമായി നൽകുന്നു.
- source_word: λέγων
  choice: പറയുന്നു
  rationale: കൽപ്പിക്കുന്നു എന്നു ശക്തിപ്പെടുത്താതെ പങ്കാളിക്രിയയുടെ ആശയം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ നൽകുന്നു.
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: മൃഗത്തിനായി ഒരു പ്രതിമ ഉണ്ടാക്കാൻ
  rationale: ദത്തിവിന്റെ 'മൃഗത്തിനായി' എന്ന സമർപ്പണ/ബന്ധ സൂചന സംരക്ഷിക്കുന്നു; 'മൃഗത്തിന്റെ പ്രതിമ' എന്ന ജനിറ്റീവ് ആശയം മുഖ്യവാചകത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: εἰκόνα
  choice: പ്രതിമ
  rationale: ആരാധനാസംബന്ധമായ ദൃശ്യരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; 'രൂപം' എന്നും വിവർത്തനം സാധ്യമാണ്.
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης καὶ ἔζησεν
  choice: വാളിന്റെ മുറിവേറ്റിട്ടും ജീവിച്ചിരുന്ന
  rationale: മുറിവും തുടർന്നുള്ള ജീവനും തമ്മിലുള്ള സന്ദർഭജന്യ വൈരുധ്യം സ്വാഭാവികമായി നൽകുന്നു; പുനരുത്ഥാനം എന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: ἐδόθη എന്ന ദൈവിക നിഷ്ക്രിയയുടെ സൂചന
  choice: ‘അനുവാദം ലഭിച്ച’ എന്ന് നിഷ്ക്രിയമായി നിലനിർത്തി, അനുവദിച്ചവനെ വ്യക്തമാക്കാതിരിക്കുന്നു.
  alternative: ‘ദൈവം അതിന് അധികാരം നൽകി’
  rationale: ദൈവിക പരമാധികാരത്തിന്റെ സൂചന ഉണ്ടായേക്കാമെങ്കിലും മൂലവാചകം ദാതാവിനെ പേരെടുത്തുപറയുന്നില്ല; ആ ദൈവശാസ്ത്രപരമായ മുറുക്ക് സംരക്ഷിക്കുന്നു.
- issue: ἔζησεν എന്നതിന്റെ ശക്തി
  choice: ‘ജീവിച്ചിരുന്ന’ എന്ന് നൽകി, മുറിവിനുശേഷമുള്ള ജീവനെ മാത്രം പ്രസ്താവിക്കുന്നു.
  alternative: ‘വീണ്ടും ജീവിച്ചു’ / ‘ഉയിർത്തെഴുന്നേറ്റു’
  rationale: പുനരുജ്ജീവനത്തിന്റെ ധ്വനി സന്ദർഭത്തിൽ സാധ്യമാണെങ്കിലും ഈ ക്രിയ മാത്രം പൂർണമായ പുനരുത്ഥാനവാദം നിർബന്ധിക്കുന്നില്ല.
- issue: εἰκών മൃഗത്തിനായോ മൃഗത്തിന്റേതോ
  choice: ദത്തിവിനെ പിന്തുടർന്ന് ‘മൃഗത്തിനായി ഒരു പ്രതിമ’ എന്ന് നൽകി.
  alternative: ‘മൃഗത്തിന്റെ ഒരു പ്രതിമ’
  rationale: പ്രതിമ മൃഗത്തെ പ്രതിനിധീകരിക്കുന്നു എന്നത് സാധ്യതയുള്ളതായിരുന്നാലും ഗ്രീക്ക് ജനിറ്റീവ് ഉപയോഗിക്കുന്നില്ല; സമർപ്പണവും പ്രതിനിധാനവും തമ്മിലുള്ള തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാള വാക്യങ്ങളാക്കി. ‘മൃഗം’, ‘അടയാളം’, ‘പ്രതിമ’ എന്നീ വെളിപ്പാട്-സംബന്ധിയായ പ്രധാന പദങ്ങൾ സ്ഥിരതയോടെ ഉപയോഗിച്ചു.
