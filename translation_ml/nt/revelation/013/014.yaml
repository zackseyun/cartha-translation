- from: അത് മൃഗത്തിന്റെ സന്നിധിയിൽ ചെയ്യാൻ അനുവാദം ലഭിച്ച അടയാളങ്ങൾ മുഖേന ഭൂമിയിൽ വസിക്കുന്നവരെ വഞ്ചിക്കുന്നു[a]. വാളിന്റെ മുറിവേറ്റിട്ടും ജീവിച്ചിരുന്ന ആ മൃഗത്തിനായി ഒരു പ്രതിമ ഉണ്ടാക്കാൻ[b] ഭൂമിയിൽ വസിക്കുന്നവരോടു പറയുന്നു[c].
  to: അത് മൃഗത്തിന്റെ സന്നിധിയിൽ അതിന് ചെയ്യാൻ അനുവാദം ലഭിച്ച അടയാളങ്ങൾ മുഖേന ഭൂമിയിൽ വസിക്കുന്നവരെ വഞ്ചിക്കുന്നു[a]. വാളിന്റെ മുറിവുള്ളതും ജീവിച്ചതുമായ ആ മൃഗത്തിനായി ഒരു പ്രതിമ ഉണ്ടാക്കാൻ[b] ഭൂമിയിൽ വസിക്കുന്നവരോടു പറയുന്നു[c].
