id: REV.13.7
reference: Revelation 13:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: ml
  text: വിശുദ്ധരോടു[a] യുദ്ധം ചെയ്യാനും അവരെ ജയിക്കാനും[b] അവന് നൽകപ്പെട്ടു; എല്ലാ ഗോത്രത്തിന്റെയും ജനത്തിന്റെയും ഭാഷയുടെയും[c] ജനതയുടെയും മേൽ അവന് അധികാരം നൽകപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശുദ്ധർക്കെതിരെ യുദ്ധം ചെയ്യാൻ.” ഇവിടെ “വിശുദ്ധരോടു” എന്നതിന് ശത്രുതാപരമായ അർഥമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവരെ കീഴടക്കാനും” അല്ലെങ്കിൽ “അവരെ മറികടക്കാനും.”
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: “നാവിന്റെയും.” ഇവിടെ അത് ഭാഷയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: അവന് അധികാരം നൽകപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗവും നൽകുന്നവനെ പേരെടുത്തു പറയാത്ത സംയമനവും നിലനിർത്തുന്നു. ആദ്യ സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘അധികാരം’ ചേർത്തിരിക്കുന്നു.
- source_word: ποιῆσαι πόλεμον μετὰ τῶν ἁγίων
  choice: വിശുദ്ധരോടു യുദ്ധം ചെയ്യാൻ
  rationale: ‘യുദ്ധം ചെയ്യുക’ എന്നത് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള രൂപമാണ്. ‘-ഓട്’ എന്ന രൂപം ഇവിടെ സൗഹൃദസഹവർത്തിത്വമല്ല, ശത്രുതാപരമായ ഏറ്റുമുട്ടലാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധർ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദം.
- source_word: νικῆσαι αὐτούς
  choice: അവരെ ജയിക്കാൻ
  rationale: വെളിപ്പാടിലെ νικάω എന്ന മുഖ്യപ്രമേയവുമായി പദസാമ്യം നിലനിർത്തുന്നു; ‘പരാജയപ്പെടുത്തുക’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ആവർത്തനബന്ധം നന്നായി സംരക്ഷിക്കുന്നു.
- source_word: ἐξουσία
  choice: അധികാരം
  rationale: വെറും ബലത്തേക്കാൾ നൽകപ്പെട്ട ഭരണാവകാശത്തെയും അധികാരപരിധിയെയും വ്യക്തമാക്കുന്നു.
- source_word: φυλή
  choice: ഗോത്രം
  rationale: വംശബന്ധമുള്ള കൂട്ടത്തെ സൂചിപ്പിക്കുന്നതും ഈ നാലംഗ പട്ടികയിൽ പതിവായി ഉപയോഗിക്കുന്നതുമായ തുല്യപദം.
- source_word: λαός
  choice: ജനം
  rationale: ഒരു ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള പദം.
- source_word: γλῶσσα
  choice: ഭാഷക്കാർ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘നാവ്’ എന്നാണെങ്കിലും ഇവിടെ ഭാഷയുടെ അടിസ്ഥാനത്തിൽ തിരിച്ചറിയപ്പെടുന്ന ജനവിഭാഗമാണ് ഉദ്ദേശ്യം; പട്ടികയിലെ വ്യക്തിസമൂഹങ്ങളോടുള്ള സമാന്തരതയ്ക്കായി ‘ഭാഷക്കാർ’ ഉപയോഗിച്ചു.
- source_word: ἔθνος
  choice: ജനത
  rationale: ഈ ആഗോള നാലംഗ സൂത്രവാക്യത്തിൽ ഒരു ദേശീയ-വംശീയ ജനസമൂഹത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആവർത്തിക്കുന്ന ἐδόθη എന്ന പേരുപറയാത്ത ദൈവിക കർമണിപ്രയോഗം
  choice: ‘നൽകപ്പെട്ടു’ എന്ന കർമണിരൂപം നിലനിർത്തി; നൽകുന്നവനെ മുഖ്യവാചകത്തിൽ തിരിച്ചറിഞ്ഞിട്ടില്ല.
  alternative: ‘ദൈവം അനുവദിച്ചു’ അല്ലെങ്കിൽ ‘അവന് അനുവദിക്കപ്പെട്ടു’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠം നൽകുന്നവനെ നേരിട്ട് പറയുന്നില്ല. കർമണിരൂപം നിലനിർത്തുന്നത് ദൈവിക പരമാധികാരവും ദുഷ്ടതയ്ക്ക് ലഭിച്ച പരിമിത അനുമതിയും സംബന്ധിച്ച വാചകത്തിന്റെ സംഘർഷം വ്യാഖ്യാനത്തിലൂടെ തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വെളിപ്പാടിന്റെ ആവർത്തനഘടനയും പേരുപറയാത്ത കർമണിപ്രയോഗവും പരമാവധി നിലനിർത്തി; പട്ടികയിലെ സമൂഹവർഗങ്ങളുടെ സമാന്തരതയ്ക്കായി ‘ഭാഷക്കാർ’ തെരഞ്ഞെടുത്തു.
