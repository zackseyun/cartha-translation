id: REV.13.11
reference: Revelation 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: ml
  text: പിന്നെ, ഭൂമിയിൽനിന്ന്[a] കയറിവരുന്ന മറ്റൊരു മൃഗത്തെ ഞാൻ കണ്ടു. അതിന് കുഞ്ഞാടിന്റേതുപോലുള്ള രണ്ടു കൊമ്പുകൾ ഉണ്ടായിരുന്നു; അത് മഹാസർപ്പംപോലെ സംസാരിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശത്തുനിന്ന്’. γῆ എന്ന ഗ്രീക്ക് പദത്തിന് ‘ഭൂമി’ അല്ലെങ്കിൽ ‘ദേശം’ എന്നർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: മറ്റൊരു മൃഗം
  rationale: വെളിപ്പാടിലെ ശത്രുതാപരമായ പ്രതീകശക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പദപ്രയോഗം നിലനിർത്താൻ θηρίον എന്നത് ‘മൃഗം’ എന്നു പരിഭാഷപ്പെടുത്തി; ἄλλο എന്നത് ‘മറ്റൊരു’ എന്നു നേരിട്ട് നൽകി.
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: ഭൂമിയിൽനിന്ന് കയറിവരുന്ന
  rationale: വർത്തമാന കൃദന്തം മൃഗം ഉയർന്നുവരുന്ന ദൃശ്യചലനം പ്രകടമാക്കുന്നു. ‘കയറിവരുന്ന’ സ്വാഭാവികമായ മലയാളമാണ്; γῆയുടെ ‘ഭൂമി/ദേശം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: εἶχεν
  choice: ഉണ്ടായിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ വിവരണാത്മക സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘ഉണ്ടായിരുന്നു’ എന്നു നൽകി.
- source_word: κέρατα δύο
  choice: രണ്ടു കൊമ്പുകൾ
  rationale: അപ്പോക്കലിപ്റ്റിക് പ്രതീകഭാവം നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: ὅμοια ἀρνίῳ
  choice: കുഞ്ഞാടിന്റേതുപോലുള്ള
  rationale: ὅμοια എന്നത് വ്യാകരണപരമായി ‘കൊമ്പുകൾ’ എന്നതിനോടാണ് യോജിക്കുന്നത്. അതിനാൽ കൊമ്പുകളുടെ രൂപസാദൃശ്യം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കാൻ ‘കുഞ്ഞാടിന്റേതുപോലുള്ള’ എന്നു നൽകി.
- source_word: ἐλάλει
  choice: സംസാരിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലം സൂചിപ്പിക്കുന്ന തുടരുന്ന, വിവരണാത്മക പ്രവൃത്തി മലയാളത്തിൽ ‘സംസാരിച്ചുകൊണ്ടിരുന്നു’ എന്നു പ്രതിഫലിപ്പിച്ചു.
- source_word: ὡς δράκων
  choice: മഹാസർപ്പംപോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ നിലനിർത്തി; വെളിപ്പാടിന്റെ മലയാള ബൈബിൾ ശൈലിയിലും സന്ദർഭത്തിലും δράκων എന്ന പ്രതീകത്തിന് യോജിക്കുന്ന വ്യക്തമായ പദമായി ‘മഹാസർപ്പം’ തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ἀρνίον എന്ന പദം വെളിപ്പാടിലെ കുഞ്ഞാട്-പ്രതീകത്തെ ഓർമിപ്പിക്കാൻ സാധ്യതയുള്ളത്
  choice: കുഞ്ഞാട്
  alternative: ചെറിയ ആട്ടിൻകുട്ടി
  rationale: ‘കുഞ്ഞാട്’ വെളിപ്പാടിലെ യഥാർഥ കുഞ്ഞാടുമായുള്ള സൂചനാത്മക സാദൃശ്യം നിലനിർത്തുന്നു; എന്നാൽ ഈ മൃഗത്തെ കുഞ്ഞാടുമായി ഒന്നാക്കുന്നില്ല. ‘ചെറിയ ആട്ടിൻകുട്ടി’ അനാവശ്യമായി ചെറുപ്പം ഊന്നിപ്പറയും.
- issue: γῆ എന്നത് ‘ഭൂമി’ ആണോ ‘ദേശം/കര’ ആണോ എന്ന അർഥവ്യത്യാസം
  choice: ഭൂമി
  alternative: ദേശം; കര
  rationale: കടലിൽനിന്നുള്ള മൃഗത്തോടുള്ള വിശാലമായ ദൃശ്യവൈരുധ്യം ‘ഭൂമി’ നന്നായി നിലനിർത്തുന്നു. എന്നിരുന്നാലും മൂലപദത്തിന്റെ മറ്റൊരു യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ὡς δράκων എന്നത് സാദൃശ്യമോ സ്വത്വപ്രഖ്യാപനമോ
  choice: മഹാസർപ്പംപോലെ
  alternative: മഹാസർപ്പമായി
  rationale: മൂലത്തിലെ ഉപമ മാത്രം പരിഭാഷയിൽ നിലനിർത്തി; മൃഗം മഹാസർപ്പം തന്നെയാണെന്ന വ്യാഖ്യാനം അനാവശ്യമായി ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം ഉപയോഗിച്ചു. ദർശനവിവരണത്തിന്റെ സജീവതയ്ക്കായി ‘കയറിവരുന്ന’ എന്നും അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന ഭാവത്തിനായി ‘സംസാരിച്ചുകൊണ്ടിരുന്നു’ എന്നും നൽകി. ‘എന്നാൽ’ മൂലത്തിലെ καίയുടെ സന്ദർഭോചിതമായ വൈരുധ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
