id: REV.13.13
reference: Revelation 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: ml
  text: അതു വലിയ അടയാളങ്ങൾ ചെയ്യുന്നു[a]; മനുഷ്യരുടെ കൺമുമ്പിൽ[b] ആകാശത്തുനിന്ന്[c] ഭൂമിയിലേക്കു തീ ഇറങ്ങിവരാൻപോലും ഇടയാക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വലിയ അത്ഭുതങ്ങൾ’ അല്ലെങ്കിൽ ‘വലിയ വിസ്മയപ്രവൃത്തികൾ’; ഗ്രീക്കിൽ ‘അടയാളങ്ങൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മനുഷ്യരുടെ മുമ്പിൽ.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘സ്വർഗത്തിൽനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: പ്രവർത്തിക്കുന്നു
  rationale: σημεῖα എന്നതോടൊപ്പം വരുന്ന ποιεῖയെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘അടയാളങ്ങൾ പ്രവർത്തിക്കുന്നു’ എന്നു നൽകി, അത്ഭുതപ്രവൃത്തികൾ നടത്തുന്നു എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: σημεῖα μεγάλα
  choice: വലിയ അടയാളങ്ങൾ
  rationale: ‘അടയാളങ്ങൾ’ എന്നത് യോഹന്നാനീയവും അപ്പോക്കലിപ്റ്റികവുമായ സൂചനാത്മക അർഥം സംരക്ഷിക്കുന്നു; ‘വലിയ’ μεγάλαയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: ἵνα καὶ πῦρ ποιῇ
  choice: തീ ... ഇറങ്ങിവരാൻപോലും ഇടയാക്കുന്നു
  rationale: ἵνα ഘടനയിലെ ഫല/ഉദ്ദേശ്യ നിഴൽ നിർബന്ധമായി ഒന്നായി തീർപ്പാക്കാതെ, പ്രത്യേകമായി ശ്രദ്ധേയമായ ഈ പ്രവൃത്തിയെ ‘പോലും’ കൊണ്ടു പ്രകടമാക്കുന്നു.
- source_word: πῦρ
  choice: തീ
  rationale: സന്ദർഭവും പ്രവാചകസാഹിത്യത്തിലെ സ്വർഗീയ അഗ്നിയുടെ പ്രതിധ്വനിയും ആവശ്യപ്പെടുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ആകാശത്തുനിന്ന്
  rationale: ഇവിടെ തീ ഭൂമിയിലേക്കു താഴേക്കിറങ്ങുന്ന ദൃശ്യചലനമാണ് മുൻനിരയിൽ; ‘ആകാശം’ സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്. ‘സ്വർഗത്തിൽനിന്ന്’ എന്ന അപ്പോക്കലിപ്റ്റിക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: καταβαίνειν εἰς τὴν γῆν
  choice: ഭൂമിയിലേക്കു ... ഇറങ്ങിവരാൻ
  rationale: താഴേക്കുള്ള ചലനവും εἰς τὴν γῆν എന്ന ലക്ഷ്യവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ കൺമുമ്പിൽ
  rationale: പൊതുവായി മനുഷ്യർ കാണുന്നവിധം എന്ന ദൃശ്യതയെ സ്വാഭാവികവും ലിംഗനിരപേക്ഷവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അടയാളങ്ങളുടെ സ്വഭാവം
  choice: യഥാർഥമോ കുറഞ്ഞത് പരസ്യമായി നിരീക്ഷിക്കപ്പെടുന്നതോ ആയ അടയാളപ്രവർത്തനം വിവരിക്കുന്നു; അതിന്റെ പ്രവർത്തനരീതി നിർവചിക്കുന്നില്ല.
  alternative: ‘അത്ഭുതങ്ങൾ’ എന്നു നൽകി സ്വാഭാവികാതീത സംഭവങ്ങളാണെന്ന് സൂചിപ്പിക്കുക, അല്ലെങ്കിൽ വെറും മായാജാലമാണെന്ന് ഊന്നിപ്പറയുക.
  rationale: വാക്യം വലിയ അടയാളങ്ങൾ പ്രവർത്തിക്കുകയും മനുഷ്യരുടെ കൺമുമ്പിൽ തീ ഇറങ്ങിവരാൻ ഇടയാക്കുകയും ചെയ്യുന്നു എന്നു പറയുന്നു; ഇത് യഥാർഥ സ്വാഭാവികാതീത പ്രവൃത്തിയാണോ വഞ്ചനാപരമായ പ്രത്യക്ഷതയാണോ എന്ന് ഇവിടെ തീർപ്പാക്കുന്നില്ല.
- issue: οὐρανός എന്നതിന്റെ അർഥപരിധി
  choice: പ്രധാനവാചകത്തിൽ ‘ആകാശം’, അടിക്കുറിപ്പിൽ ‘സ്വർഗം’ എന്ന സാധ്യത.
  alternative: പ്രധാനവാചകത്തിൽ ‘സ്വർഗം’.
  rationale: തീ മുകളിൽനിന്ന് ഭൂമിയിലേക്കിറങ്ങുന്ന ദൃശ്യത്തിന് ‘ആകാശം’ സ്വാഭാവികമാണ്; എന്നാൽ വെളിപ്പാടിന്റെ സ്വർഗീയ/അപ്പോക്കലിപ്റ്റിക പശ്ചാത്തലം കാരണം ‘സ്വർഗം’ എന്ന അർഥവും സാധുവായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അതു’ എന്ന സർവനാമം മുൻസന്ദർഭത്തിലെ മൃഗത്തെ സൂചിപ്പിക്കുകയും ഉറവിടത്തിലെ നപുംസകലിംഗ രൂപം അനാവശ്യമായി വ്യക്തിവൽക്കരിക്കാതിരിക്കുകയും ചെയ്യുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
