id: REV.13.10
reference: Revelation 13:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: ml
  text: ആരെങ്കിലും തടവിനുള്ളവനെങ്കിൽ, അവൻ തടവിലേക്കു പോകുന്നു[a]; ആരെങ്കിലും വാളാൽ കൊല്ലപ്പെടേണ്ടവനെങ്കിൽ, അവൻ വാളാൽ കൊല്ലപ്പെടണം[b]. ഇവിടെയാണ് വിശുദ്ധന്മാരുടെ സഹിഷ്ണുതയും വിശ്വാസവും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ആരെങ്കിലും തടവിലേക്കു പോകുന്നുവെങ്കിൽ, അവൻ തടവിലേക്കു പോകുന്നു.” ഈ വരിയെ ഒരു കൽപ്പനയായി കാണുന്നതിനെക്കാൾ നിയമിതമായ വിധിയെക്കുറിച്ചുള്ള പ്രസ്താവനയായും മനസ്സിലാക്കാം.'
    reason: alternative_reading
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിലും പാഠരൂപങ്ങളിലും ഈ ഉപവാക്യം വ്യത്യസ്തമാണ്; അവയിൽ ചിലത്, “ആരെങ്കിലും വാളാൽ കൊല്ലുന്നുവെങ്കിൽ, അവൻ വാളാൽ കൊല്ലപ്പെടണം” എന്നു വായിക്കുന്നു. ഇവിടെ സ്വീകരിച്ച പാഠം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിട്ടുണ്ടെങ്കിലും, ഈ പാഠഭേദം വ്യാഖ്യാനത്തിന് പ്രാധാന്യമുള്ളതാണ്.
    reason: textual_variant
  - marker: c
    text: 'അല്ലെങ്കിൽ: “വിശുദ്ധന്മാരുടെ വിശ്വസ്തത.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: ആരെങ്കിലും
  rationale: പൊതുവായ, അനിശ്ചിതമായ വ്യവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: അടിമത്തത്തിനുള്ളവനെങ്കിൽ ... അടിമത്തത്തിലേക്കു പോകുന്നു
  rationale: ഗ്രീക്കിലെ ആവർത്തനവും പഴഞ്ചൊല്ലുപോലുള്ള സംക്ഷിപ്ത ഘടനയും നിലനിർത്തുന്നു; നിയമിതമായ വിധി എന്ന സാധ്യതയും തുറന്നുവയ്ക്കുന്നു.
- source_word: αἰχμαλωσία
  choice: അടിമത്തം
  rationale: പിടിച്ചുകൊണ്ടുപോകപ്പെടുന്ന അവസ്ഥയെയും ന്യായവിധിയുടെ ഗൗരവമുള്ള ഭാവത്തെയും സൂചിപ്പിക്കുന്നു; ‘തടവ്’ എന്നതിനെക്കാൾ വിശാലമാണ്.
- source_word: ἐν μαχαίρῃ
  choice: വാളാൽ
  rationale: ഉപകരണാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുകയും ബൈബിളിലെ ന്യായവിധിഭാഷയുടെ പ്രതിധ്വനി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀποκτανθῆναι
  choice: കൊല്ലപ്പെടേണ്ടവൻ / കൊല്ലപ്പെടണം
  rationale: നിഷ്ക്രിയ infinitive-ന്റെ അർഥവും സംഭവത്തിന്റെ അനിവാര്യതയും വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὧδέ ἐστιν
  choice: ഇവിടെയാണ്
  rationale: തുടർന്നുവരുന്ന ആശയത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നിർദ്ദേശകശക്തി നിലനിർത്തുന്നു.
- source_word: ὑπομονή
  choice: സഹനം
  rationale: പീഡനത്തിനിടയിലെ സ്ഥിരമായ നിലനിൽപ്പിനെ സൂചിപ്പിക്കുന്ന, വെളിപ്പാടുപുസ്തകത്തിന്റെ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പദം.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: പ്രധാന പാഠത്തിൽ സാധാരണ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ‘വിശ്വസ്തത’ എന്ന സന്ദർഭസാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധന്മാരുടെ
  rationale: ദൈവത്തിന്റെ വിശുദ്ധജനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മലയാളവായനക്കാർക്ക് പരിചിതവുമായ സംക്ഷിപ്ത പ്രയോഗം.
theological_decisions:
- issue: ആദ്യ രണ്ടു ഉപവാക്യങ്ങൾ നിയമിതമായ വിധിയെ വിവരിക്കുന്നതാണോ, ഒരു കല്പനയാണോ
  choice: നിയമിതമായ വിധി/അനിവാര്യതയെ വിവരിക്കുന്ന പഴഞ്ചൊല്ലുപോലുള്ള പ്രസ്താവന
  alternative: അക്രമത്തെ ചെറുക്കരുതെന്ന കല്പന; അല്ലെങ്കിൽ പിടിക്കുന്നവനും വാളാൽ കൊല്ലുന്നവനും അതേവിധി അനുഭവിക്കുമെന്ന പ്രതികാരനീതി
  rationale: സ്വീകരിച്ചിരിക്കുന്ന ഗ്രീക്ക് പാഠം ‘അടിമത്തത്തിനുള്ളവൻ അടിമത്തത്തിലേക്കു പോകുന്നു; കൊല്ലപ്പെടേണ്ടവൻ കൊല്ലപ്പെടണം’ എന്ന നിയമിതവിധിയുടെ ഗൗരവമുള്ള പ്രസ്താവനയായി സ്വാഭാവികമായി വായിക്കാം. പാഠം വ്യക്തമായി പറയാത്ത സമ്പൂർണ അഹിംസാസിദ്ധാന്തമോ പ്രതികാരസിദ്ധാന്തമോ പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: അവസാന ഉപവാക്യത്തിലെ πίστις
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: πίστις എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘വിശ്വാസം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; പീഡനത്തിനിടയിലെ സ്ഥിരത എന്ന സന്ദർഭത്തിൽ ‘വിശ്വസ്തത’ സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനവും ചുരുക്കവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു. ‘അടിമത്തത്തിനുള്ളവൻ’ എന്ന അസാധാരണമായെങ്കിലും ഗ്രഹിക്കാവുന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ അപൂർണതയും വിധിനിർണ്ണയത്തിന്റെ ഭാവവും സംരക്ഷിക്കുന്നു; പ്രധാന പാഠത്തിൽ വ്യാഖ്യാനപരമായ അധികവിവരണം ചേർത്തിട്ടില്ല.
