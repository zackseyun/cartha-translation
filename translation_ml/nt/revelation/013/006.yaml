revisions:
- from: അതു ദൈവത്തിനെതിരെ ദൂഷണങ്ങൾ പറയാൻ വായ് തുറന്നു[a]—അവന്റെ നാമത്തെയും അവന്റെ വാസസ്ഥാനത്തെയും[b], സ്വർഗത്തിൽ വസിക്കുന്നവരെയും ദുഷിക്കേണ്ടതിന്.
  to: അത് ദൈവത്തിനെതിരെ ദൂഷണങ്ങൾ ഉച്ചരിക്കാൻ തന്റെ വായ് തുറന്നു—അവന്റെ നാമത്തെയും അവന്റെ വാസസ്ഥാനത്തെയും[b], സ്വർഗത്തിൽ വസിക്കുന്നവരെയും[a] ദുഷിക്കാനായി.
  rationale: മുഖ്യപാഠം അവസാന പദസമുച്ചയത്തെ ദുഷിക്കപ്പെടുന്ന മൂന്നാമത്തെ കർമമായി നിലനിർത്തുന്നു; ഇത് ഗ്രീക്കിൽ സാധ്യമായ നേരിട്ടുള്ള വായനയാണ്. എന്നാൽ സ്കηνή/σκηνοῦντας എന്ന പദബന്ധം പിന്തുണയ്ക്കുന്ന സമാനാധികരണവായന അടിക്കുറിപ്പിൽ വ്യക്തമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പുകളുടെ വിഷയങ്ങളും ആങ്കറുകളും ഇംഗ്ലീഷ് POB ഓഡിറ്റ് ട്രെയിലിനോട് യോജിപ്പിച്ചു.
