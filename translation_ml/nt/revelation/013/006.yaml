id: REV.13.6
reference: Revelation 13:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: ml
  text: അത് ദൈവത്തിനെതിരെ ദൂഷണങ്ങൾ ഉച്ചരിക്കാൻ തന്റെ വായ് തുറന്നു—അവന്റെ നാമത്തെയും അവന്റെ വാസസ്ഥാനത്തെയും[b], സ്വർഗത്തിൽ വസിക്കുന്നവരെയും[a] ദുഷിക്കാനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, അവസാന പദസമുച്ചയത്തെ ‘ദുഷിക്കാനായി’ എന്ന ക്രിയയുടെ മൂന്നാമത്തെ കർമമായി കാണാതെ, ‘അവന്റെ വാസസ്ഥാനം’ എന്നതിന്റെ വിശദീകരണമായി വായിക്കാം: “അവന്റെ വാസസ്ഥാനം—സ്വർഗത്തിൽ വസിക്കുന്നവർ.”'
    reason: അവസാന accusative പദസമുച്ചയത്തിന്റെ സമാനാധികരണവും മൂന്നാം-കർമവുമായ വായനാസാധ്യത സംരക്ഷിക്കുന്നു.
  - marker: b
    text: “വാസസ്ഥാനം” എന്നതിന് “കൂടാരം” അഥവാ “തിരുനിവാസം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: σκηνή എന്ന പദത്തിന്റെ ‘dwelling,’ ‘tent,’ ‘tabernacle’ എന്നീ അർഥസാധ്യതകൾ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: അതു ... വായ് തുറന്നു
  rationale: ഗ്രീക്കിലെ സജീവവും ദൃശ്യവുമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ആദ്യത്തെ αὐτοῦ മൃഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ നപുംസകസൂചകമായ ‘അതു’ ഉപയോഗിച്ചു.
- source_word: εἰς βλασφημίας πρὸς τὸν θεόν
  choice: ദൈവത്തിനെതിരെ ദൂഷണങ്ങൾ പറയാൻ
  rationale: ശത്രുതാപരമായ പ്രസംഗസന്ദർഭത്തിൽ πρός എന്നതിന്റെ ‘എതിരെ’ എന്ന അർഥം വ്യക്തമാക്കുന്നു; ബഹുവചനമായ βλασφημίας ‘ദൂഷണങ്ങൾ’ എന്നു നിലനിർത്തുന്നു. ഗ്രീക്ക് ശൈലി അക്ഷരാർഥത്തിൽ പകർത്താതെ സ്വാഭാവിക മലയാളക്രമം സ്വീകരിച്ചു.
- source_word: βλασφημῆσαι
  choice: ദുഷിക്കേണ്ടതിന്
  rationale: വായ് തുറന്നതിന്റെ ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ഇൻഫിനിറ്റീവിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘ദൂഷണങ്ങൾ’ എന്ന നാമരൂപവുമായി അനാവശ്യ ആവർത്തനം ഒഴിവാക്കാൻ ക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: അവന്റെ നാമത്തെ
  rationale: ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വവും മാനവും ഉൾക്കൊള്ളുന്ന വേദപുസ്തകപ്രയോഗം നിലനിർത്താൻ ‘നാമം’ നേരിട്ട് ഉപയോഗിച്ചു.
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: അവന്റെ വാസസ്ഥാനത്തെ
  rationale: σκηνή എന്നതിന് കൂടാരം, തിരുനിവാസം, വാസസ്ഥാനം എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ഈ സ്വർഗീയ സന്ദർഭത്തിൽ ‘വാസസ്ഥാനം’ ആധുനിക വായനക്കാർക്ക് വ്യക്തവും അനാവശ്യ ആരാധനാക്രമപരമായ അർഥഭാരം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: സ്വർഗത്തിൽ വസിക്കുന്നവരെയും
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടർച്ചയായ വാസം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. മുഖ്യപാഠത്തിൽ ഇതിനെ ‘ദുഷിക്കുക’ എന്ന ക്രിയയുടെ മൂന്നാമത്തെ കർമമായി വായിച്ചു; വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: ‘അവന്റെ വാസസ്ഥാനം’ എന്നതിനും ‘സ്വർഗത്തിൽ വസിക്കുന്നവർ’ എന്നതിനും ഇടയിലെ ബന്ധം
  choice: അവന്റെ നാമം, വാസസ്ഥാനം, സ്വർഗവാസികൾ എന്നിവയെ ‘ദുഷിക്കുക’ എന്ന ക്രിയയുടെ മൂന്ന് സമാന്തര കർമങ്ങളായി മുഖ്യപാഠത്തിൽ അവതരിപ്പിച്ചു.
  alternative: 'അവസാന പദസമുച്ചയം ‘അവന്റെ വാസസ്ഥാനം’ എന്നതിനെ വിശദീകരിക്കുന്ന സമാനാധികരണമായി വായിക്കാം: ‘അവന്റെ വാസസ്ഥാനം—സ്വർഗത്തിൽ വസിക്കുന്നവർ.’'
  rationale: ഗ്രീക്ക് വ്യാകരണം രണ്ടുവായനകൾക്കും ഇടനൽകുന്നു. καί ഇല്ലെങ്കിലും അവസാനം വരുന്ന accusative പദസമുച്ചയം മൂന്നാമത്തെ കർമമായി മനസ്സിലാക്കാം; അതേസമയം σκηνή/σκηνοῦντας എന്ന പദബന്ധം സമാനാധികരണവായനയെ പിന്തുണയ്ക്കുന്നു. മുഖ്യപാഠം സ്വാഭാവിക മലയാളവും നേരിട്ടുള്ള കർമക്രമവും സ്വീകരിക്കുമ്പോൾ മറ്റുവായന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ദൂഷണം’, ‘നാമം’, ‘വാസസ്ഥാനം’ എന്നീ വേദപുസ്തകസന്ദർഭത്തിന് യോജിച്ച പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും അതിപുരാതനമോ വിഭാഗീയമോ ആയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
