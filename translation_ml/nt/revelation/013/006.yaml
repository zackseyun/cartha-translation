  naturalness: ‘ദൂഷണങ്ങൾ ഉച്ചരിക്കാൻ ... വായ് തുറന്നു’യും ‘ദുഷിക്കാനായി’യും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘തന്റെ വായ്’ ചേർക്കുന്നത് ഗ്രീക്കിലെ αὐτοῦ-വിന്റെ അർഥം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
  terminology: ‘ദൂഷണങ്ങൾ,’ ‘നാമം,’ ‘വാസസ്ഥാനം,’ ‘സ്വർഗത്തിൽ വസിക്കുന്നവർ’ എന്നിവ യോജിച്ച വേദപുസ്തക-രജിസ്റ്ററിലുള്ളതും വിഭാഗീയ വ്യാഖ്യാനം ചുമത്താത്തതുമാണ്. σκηνή-ക്കുള്ള ‘കൂടാരം’/‘തിരുനിവാസം’ എന്ന ബദലുകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
