id: REV.7.15
reference: Revelation 7:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: ml
  text: അതുകൊണ്ട് അവർ ദൈവത്തിന്റെ സിംഹാസനത്തിനുമുമ്പിലാണ്; അവർ അവന്റെ ആലയത്തിൽ രാവും പകലും അവനെ സേവിക്കുന്നു. സിംഹാസനത്തിൽ ഇരിക്കുന്നവൻ അവരുടെമേൽ തന്റെ കൂടാരം വിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെമേൽ വസിക്കും” അല്ലെങ്കിൽ “അവർക്കു അഭയമാകും.” ഗ്രീക്ക് ക്രിയ കൂടാരം അഥവാ തിരുനിവാസം എന്ന ദൃശ്യവുമായി ബന്ധപ്പെട്ടതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ വിശദീകരണത്തിലേക്കു തിരിച്ചുചൂണ്ടുന്ന കാരണപരവും നിഗമനാത്മകവുമായ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐνώπιον
  choice: മുമ്പിൽ
  rationale: ദൈവത്തിന്റെ സിംഹാസനത്തോടുള്ള സാന്നിധ്യപരവും സ്ഥലപരവുമായ സമീപ്യം ലളിതമായി അറിയിക്കുന്നു.
- source_word: λατρεύουσιν
  choice: സേവിക്കുന്നു
  rationale: ദൈവത്തിന് അർപ്പിക്കുന്ന ആരാധനാപരമായ വിശുദ്ധസേവനം എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ആലയസന്ദർഭം അതിന്റെ ആരാധനാസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ἡμέρας καὶ νυκτός
  choice: രാവും പകലും
  rationale: ഇടവിടാത്ത സേവനത്തിന്റെ ദൃശ്യഭാവം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: ναῷ
  choice: ആലയം
  rationale: ναός സൂചിപ്പിക്കുന്ന വിശുദ്ധമന്ദിരത്തെ പരിചിതവും മാന്യവുമായ മലയാളപദത്തിൽ അവതരിപ്പിക്കുന്നു; സ്വർഗീയസന്ദർഭം ചുറ്റുപാടിൽനിന്ന് വ്യക്തമാണ്.
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്നവൻ
  rationale: കർത്തൃസ്ഥാനത്തിലുള്ള വർത്തമാന പങ്കുപദത്തിന്റെ സ്ഥാനനാമസദൃശമായ ശക്തിയും തുടരുന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: അവരുടെമേൽ തന്റെ കൂടാരം വിരിക്കും
  rationale: σκηνόω എന്ന ക്രിയയിലെ കൂടാര/തിരുനിവാസ ദൃശ്യവും ἐπί നൽകുന്ന ‘മേൽ’ എന്ന ബന്ധവും ഗ്രഹിക്കാവുന്ന മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: σκηνώσει എന്നതിലെ ദൈവസാന്നിധ്യത്തിന്റെയും കൂടാരത്തിന്റെയും ദൃശ്യം
  choice: അവരുടെമേൽ തന്റെ കൂടാരം വിരിക്കും
  alternative: അവരുടെമേൽ വസിക്കും; അവരെ സംരക്ഷിക്കും
  rationale: ദൈവത്തിന്റെ സംരക്ഷകവും ഉടമ്പടിസംബന്ധവുമായ സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന കൂടാരദൃശ്യം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. ‘വസിക്കും’ എന്നത് ദൃശ്യം മങ്ങിക്കളയുകയും ‘സംരക്ഷിക്കും’ എന്നത് പ്രവർത്തനഫലത്തിലേക്കു മാത്രം അർഥം ചുരുക്കുകയും ചെയ്യാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘അവന്റെ ആലയം’ എന്നത് ആരാധനാസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘കൂടാരം വിരിക്കും’ എന്നത് മൂലത്തിലെ രൂപകം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
