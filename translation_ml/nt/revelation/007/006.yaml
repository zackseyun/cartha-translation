id: REV.7.6
reference: Revelation 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ἀσὴρ δώδεκα χιλιάδες, ἐκ φυλῆς Νεφθαλὶμ δώδεκα χιλιάδες, ἐκ φυλῆς Μανασσῆ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/006.yaml
  text: from the tribe of Asher[a], twelve thousand; from the tribe of Naphtali, twelve thousand; from the tribe of Manasseh, twelve thousand;
translation:
  language: ml
  text: ആശേർ ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം[a]; നഫ്താലി ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം; മനശ്ശെ ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സന്ദർഭം കൂടുതൽ വ്യക്തമായി ചേർത്താൽ: “ആശേർ ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം പേർ മുദ്രയേറ്റു” (തുടർന്നുള്ള ഗോത്രങ്ങൾക്കും ഇതേപോലെ). ഈ വാക്യത്തിന്റെ ഗ്രീക്ക് പാഠത്തിൽ ക്രിയ ആവർത്തിക്കുന്നില്ല.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: -ൽനിന്ന്
  rationale: ഓരോ വിഭാഗത്തിലും എണ്ണപ്പെട്ടവരുടെ ഉറവിടമോ ഗോത്രബന്ധമോ സൂചിപ്പിക്കുന്ന പൂർവപ്രത്യയമാണ്; പട്ടികയുടെ ആവർത്തനശൈലിയിൽ ‘ഗോത്രത്തിൽനിന്ന്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: φυλῆς
  choice: ഗോത്രം
  rationale: ഇസ്രായേലിന്റെ വംശപരമായ ഗോത്രവിഭാഗത്തെയാണ് ഇവിടെ φυλή സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘ഗോത്രം’ ആണ് പതിവും കൃത്യവുമായ പദം.
- source_word: Ἀσὴρ
  choice: ആശേർ
  rationale: ഗ്രീക്ക് രൂപത്തിന്റെയും മൂല എബ്രായ പേരിന്റെയും ശബ്ദരൂപം പരിഗണിച്ചുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: δώδεκα χιλιάδες
  choice: പന്ത്രണ്ടായിരം
  rationale: സംഖ്യ നേരിട്ട് നൽകുന്നു; ഈ വാക്യത്തിലെ ഗ്രീക്കിൽ ഇല്ലാത്ത ‘മുദ്രയേറ്റവർ’ എന്ന ക്രിയാപദപ്രയോഗം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: Νεφθαλὶμ
  choice: നഫ്താലി
  rationale: മൂലനാമത്തോട് ചേർന്നുനിൽക്കുന്നതും മലയാള വായനക്കാർക്ക് സ്വാഭാവികവുമായ ലിപ്യന്തരണം.
- source_word: Μανασσῆ
  choice: മനശ്ശെ
  rationale: പേരിന്റെ പരമ്പരാഗത സെമിറ്റിക് ശബ്ദരൂപം നിലനിർത്തുന്ന, മലയാളത്തിൽ വ്യക്തമായ ലിപ്യന്തരണം.
theological_decisions:
- issue: മുൻസന്ദർഭത്തിൽനിന്ന് ‘മുദ്രയേറ്റവർ’ അല്ലെങ്കിൽ ‘മുദ്രയേറ്റു’ എന്ന ആശയം ക്രിയയായി മുഖ്യപാഠത്തിൽ ചേർക്കണമോ
  choice: ക്രിയ ചേർക്കാതെ ഗ്രീക്കിലെ ക്രിയാരഹിതമായ പട്ടികാരൂപം നിലനിർത്തുക.
  alternative: ആശേർ ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം പേർ മുദ്രയേറ്റു; നഫ്താലി ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം; മനശ്ശെ ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം.
  rationale: മുദ്രയിടലിന്റെ ആശയം മുൻവാക്യത്തിൽ സ്ഥാപിക്കപ്പെട്ടിട്ടുണ്ടെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ഗോത്രവും സംഖ്യയും മാത്രം ആവർത്തിക്കുന്നു. അതിനാൽ ഉറവിടപാഠത്തിന്റെ സംക്ഷിപ്തതയും യഥാർഥമായ വ്യാകരണതുറപ്പും മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് സന്ദർഭത്തിൽനിന്നുള്ള പൂർണ്ണരൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തനാത്മക പട്ടികാശൈലിയും ക്രിയാരാഹിത്യവും നിലനിർത്തിയിരിക്കുന്നു; പേരുകൾ വായനാസൗകര്യവും മൂലശബ്ദവും തുലനം ചെയ്ത് ലിപ്യന്തരിച്ചു.
