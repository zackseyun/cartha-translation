id: REV.7.2
reference: Revelation 7:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: ml
  text: 'ഞാൻ കിഴക്കുനിന്ന്[a] കയറിവരുന്ന മറ്റൊരു ദൂതനെ കണ്ടു; ജീവനുള്ള ദൈവത്തിന്റെ മുദ്ര കൈവശംവെച്ചുകൊണ്ട്, ഭൂമിക്കും കടലിനും ഹാനി വരുത്താൻ അധികാരം ലഭിച്ചിരുന്ന നാലു ദൂതന്മാരോടും അവൻ വലിയ ശബ്ദത്തിൽ വിളിച്ചുപറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: ‘സൂര്യൻ ഉദിക്കുന്നിടത്തുനിന്ന്.’'
    reason: ἀπὸ ἀνατολῆς ἡλίου എന്ന പ്രയോഗത്തിലെ അക്ഷരാർഥ ദൃശ്യബിംബം സംരക്ഷിക്കാൻ; പ്രധാനപാഠത്തിലെ ‘കിഴക്ക്’ അതിന്റെ സ്വാഭാവിക ദിശാസൂചനയാണ്.
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: മറ്റൊരു ദൂതനെ
  rationale: മുമ്പ് പറഞ്ഞ നാലു ദൂതന്മാരിൽനിന്ന് വ്യത്യസ്തനായ ഒരു അധിക ദൂതനെയാണ് ἄλλον സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἀναβαίνοντα
  choice: കയറിവരുന്ന
  rationale: മുകളിലേക്കുള്ള ചലനം നിലനിർത്തുകയും ദർശകന്റെ കാഴ്ചപ്പാടിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: സൂര്യോദയദിക്കിൽനിന്ന്
  rationale: പദശഃ ഉള്ള സൂര്യന്റെ ഉദയം എന്ന ദൃശ്യബിംബവും കിഴക്ക് എന്ന ദിശാസൂചനയും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔχοντα σφραγῖδα
  choice: മുദ്ര അവന്റെ പക്കൽ ഉണ്ടായിരുന്നു
  rationale: ἔχω എന്നതിന്റെ കൈവശം ഉണ്ടായിരിക്കുക എന്ന അടിസ്ഥാനാർഥം സൂക്ഷിക്കുന്നു; ദൂതൻ മുദ്ര ധരിച്ചിരുന്നോ പിടിച്ചിരുന്നോ എന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: θεοῦ ζῶντος
  choice: ജീവനുള്ള ദൈവത്തിന്റെ
  rationale: ഗ്രീക്കിലെ വിശേഷണപ്രയോഗത്തിന്റെ ദൈവശാസ്ത്രഭാരം ലളിതവും സ്ഥാപിതവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു
  rationale: ശക്തമായ വിളിയും വലിയ ശബ്ദവും മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: τοῖς τέσσαρσιν ἀγγέλοις
  choice: നാലു ദൂതന്മാരോടും
  rationale: ദാതൃവിഭക്തിയിലെ അഭിസംബോധിതരെ മലയാളത്തിൽ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἷς ἐδόθη αὐτοῖς ἀδικῆσαι
  choice: ദോഷം ചെയ്യാൻ അധികാരം ലഭിച്ചിരുന്ന
  rationale: ദോഷം ചെയ്യാനുള്ള കാര്യം അവർക്കു നൽകപ്പെട്ടതാണെന്ന നിഷ്ക്രിയരൂപവും ഏല്പിക്കപ്പെട്ട ശേഷി/അധികാരം എന്ന സന്ദർഭാർഥവും വ്യക്തമാക്കുന്നു; നൽകിയവനെ വാക്യം പേരെടുത്തുപറയുന്നില്ല.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: ഭൂമിക്കും കടലിനും
  rationale: വെളിപ്പാടിലെ വിശാലമായ സൃഷ്ടിസംബന്ധിയായ പശ്ചാത്തലത്തിൽ γῆയ്ക്ക് ‘ഭൂമി’ യോജിക്കുന്നു; θάλασσα ‘കടൽ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ἐδόθη എന്ന നിഷ്ക്രിയക്രിയയിലെ ഏല്പിക്കപ്പെട്ട അധികാരം
  choice: ‘അധികാരം ലഭിച്ചിരുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ദോഷം ചെയ്യാൻ അനുവദിക്കപ്പെട്ടിരുന്ന’ അല്ലെങ്കിൽ ‘ദോഷം ചെയ്യാൻ നൽകപ്പെട്ടിരുന്ന’
  rationale: പ്രവർത്തനശേഷി സ്വതന്ത്രമല്ല, നൽകപ്പെട്ടതാണ് എന്ന ആശയം വ്യക്തമാക്കുന്നു; എന്നാൽ അത് നൽകിയവൻ ആരെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പരിഭാഷയും വ്യക്തമാക്കുന്നില്ല.
- issue: ἀπὸ ἀνατολῆς ἡλίου എന്ന ദിശാപ്രയോഗം
  choice: പ്രധാനപാഠത്തിൽ ‘സൂര്യോദയദിക്കിൽനിന്ന്’
  alternative: ‘കിഴക്കുനിന്ന്’ അല്ലെങ്കിൽ പദശഃ ‘സൂര്യന്റെ ഉദയത്തിൽനിന്ന്’
  rationale: ദിശാസൂചന വായനക്കാരന് വ്യക്തമായിരിക്കുമ്പോഴും മൂലപാഠത്തിലെ സൂര്യോദയബിംബം നഷ്ടപ്പെടാതിരിക്കാൻ സംയുക്തപ്രയോഗം തിരഞ്ഞെടുത്തു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. വാക്യാന്തത്തിലെ ദ്വിബിന്ദു അടുത്ത വാക്യത്തിൽ വരുന്ന ദൂതന്റെ വാക്കുകൾക്ക് വഴിതുറക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
