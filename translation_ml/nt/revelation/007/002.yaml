- from: 'പിന്നെ, സൂര്യോദയദിക്കിൽനിന്ന്[a] കയറിവരുന്ന മറ്റൊരു ദൂതനെ ഞാൻ കണ്ടു. ജീവനുള്ള ദൈവത്തിന്റെ മുദ്ര അവന്റെ പക്കൽ ഉണ്ടായിരുന്നു. ഭൂമിക്കും കടലിനും ദോഷം ചെയ്യാൻ അധികാരം ലഭിച്ചിരുന്ന നാലു ദൂതന്മാരോടും അവൻ ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു:'
  to: 'ഞാൻ കിഴക്കുനിന്ന്[a] കയറിവരുന്ന മറ്റൊരു ദൂതനെ കണ്ടു; ജീവനുള്ള ദൈവത്തിന്റെ മുദ്ര കൈവശംവെച്ചുകൊണ്ട്, ഭൂമിക്കും കടലിനും ഹാനി വരുത്താൻ അധികാരം ലഭിച്ചിരുന്ന നാലു ദൂതന്മാരോടും അവൻ വലിയ ശബ്ദത്തിൽ വിളിച്ചുപറഞ്ഞു:'
  rationale: ഗ്രീക്കിലെ ഏകവാക്യഘടനയും പങ്കാളിവാക്യബന്ധവും കൂടുതൽ വ്യക്തമായി നിലനിർത്തി. ἀδικῆσαι-ക്കു ‘ഹാനി വരുത്താൻ’ ഉപയോഗിച്ച് സൃഷ്ടിയിലേക്കുള്ള നാശകരമായ പ്രവൃത്തി വ്യക്തമാക്കി; ἐδόθη-യുടെ നൽകപ്പെട്ട/ഏൽപ്പിക്കപ്പെട്ട സ്വഭാവം ‘അധികാരം ലഭിച്ചിരുന്ന’ എന്നതിൽ നിലനിർത്തി, നൽകുന്നവനെ നിർണയിച്ചിട്ടില്ല. പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ ‘കിഴക്കുനിന്ന്’ ഉപയോഗിക്കുകയും പദശഃ ബിംബം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
