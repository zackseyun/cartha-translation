  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘സൂര്യോദയദിക്കിൽനിന്ന്’ എന്ന സംയുക്തപ്രയോഗത്തേക്കാൾ ‘കിഴക്കുനിന്ന്’ വായനാസൗകര്യമുള്ളതാണ്; അക്ഷരാർഥബിംബം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. ‘മുദ്ര കൈവശംവെച്ചുകൊണ്ട്’ ഗ്രീക്കിലെ ἔχοντα-യോടു ചേർന്നതും സ്വാഭാവികവുമാണ്.
