id: REV.7.12
reference: Revelation 7:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: ml
  text: 'അവർ ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്: “ആമേൻ! അനുഗ്രഹവും മഹത്ത്വവും ജ്ഞാനവും നന്ദിയും ബഹുമാനവും ശക്തിയും ബലവും നമ്മുടെ ദൈവത്തിനാകട്ടെ എന്നെന്നേക്കും.[a] ആമേൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യുഗങ്ങളുടെ യുഗങ്ങളോളം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: അവർ പറഞ്ഞു
  rationale: വർത്തമാനകാല കർത്തൃവാചക ബഹുവചന കൃദന്തരൂപം സ്തുതിവാക്യത്തെ പരിചയപ്പെടുത്തുന്നു. മുൻവാക്യത്തോടുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്താൻ പൂർത്തിയായ ക്രിയാവാക്യമായി നൽകി.
- source_word: Ἀμήν / ἀμήν
  choice: ആമേൻ
  rationale: ആരാധനാപരവും സ്തുതിപരവുമായ സന്ദർഭത്തിൽ പതിവായി ലിപ്യന്തരണം ചെയ്യുന്ന പദം; ആവർത്തനം സ്തുതിവാക്യത്തെ ചുറ്റിനിൽക്കുന്നു.
- source_word: ἡ εὐλογία
  choice: അനുഗ്രഹം
  rationale: ദൈവത്തോട് അർപ്പിക്കുന്ന ഏഴംഗ സ്തുതിപ്പട്ടികയിലെ ആദ്യ ഘടകമായി മൂലപദത്തിന്റെ രൂപവും സ്തുതിപരമായ അർഥവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἡ δόξα
  choice: മഹത്ത്വം
  rationale: ദൈവത്തെക്കുറിച്ചുള്ള സ്തുതിയിൽ δόξα സൂചിപ്പിക്കുന്ന മഹിമയും ഔന്നത്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἡ σοφία
  choice: ജ്ഞാനം
  rationale: σοφίαയുടെ സാധാരണവും വ്യക്തവുമായ മലയാള സമാനപദം.
- source_word: ἡ εὐχαριστία
  choice: നന്ദി
  rationale: ദൈവത്തോടുള്ള thanksgiving എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു; പട്ടികയിലെ നാമരൂപം നിലനിർത്തുന്നു.
- source_word: ἡ τιμή
  choice: ബഹുമാനം
  rationale: ഇവിടെ സാമ്പത്തിക മൂല്യമല്ല, ദൈവത്തിന് അർപ്പിക്കുന്ന ആദരവാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἡ δύναμις
  choice: ശക്തി
  rationale: കഴിവും അധികാരപ്രഭാവവും സൂചിപ്പിക്കുന്ന δύναμις എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: ἡ ἰσχύς
  choice: പ്രാബല്യം
  rationale: δύναμις-ൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് ἰσχύς സൂചിപ്പിക്കുന്ന ബലപ്രഭാവം പ്രകടമാക്കുന്നു; സമീപാർഥപദങ്ങളുടെ സ്തുതിപരമായ സമൃദ്ധി ചുരുക്കുന്നില്ല.
- source_word: τῷ θεῷ ἡμῶν
  choice: നമ്മുടെ ദൈവത്തിനാകട്ടെ
  rationale: സ്വീകർത്താവിനെയോ അർപ്പണലക്ഷ്യത്തെയോ സൂചിപ്പിക്കുന്ന ദത്തിവ് രൂപം മലയാളത്തിലെ ആശംസാ-സ്തുതിപ്രയോഗമായ ‘ദൈവത്തിനാകട്ടെ’ എന്നതിലൂടെ നൽകി.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള സമാനരൂപം; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ക്രിയയില്ലാത്ത ഗ്രീക്ക് സ്തുതിവാക്യത്തിൽ ക്രിയാഭാവം പൂരിപ്പിക്കൽ
  choice: നമ്മുടെ ദൈവത്തിനാകട്ടെ
  alternative: നമ്മുടെ ദൈവത്തിനുള്ളതാണ്
  rationale: മൂലഗ്രീക്കിൽ പട്ടികയ്ക്കുശേഷം വ്യക്തമായ ക്രിയയില്ല. ‘ആകട്ടെ’ എന്ന പൂരണം ഉടമസ്ഥാവകാശമായി മാത്രം വ്യാഖ്യാനിക്കാതെ അർപ്പണാത്മകവും ആരാധനാപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- issue: δύναμις, ἰσχύς എന്നീ സമീപാർഥപദങ്ങളെ വേർതിരിക്കൽ
  choice: ശക്തി ... പ്രാബല്യം
  alternative: ശക്തി ... ബലം
  rationale: മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ സമീപാർഥപദസഞ്ചയം ഒറ്റ ആശയമായി ചുരുക്കാതെ രണ്ട് വ്യത്യസ്ത മലയാള പദങ്ങളിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഏഴംഗ സ്തുതിപ്പട്ടികയുടെ താളവും സമാന്തരഘടനയും നിലനിർത്തിയിരിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യമായി ഓരോ നാമത്തിനുമുമ്പും നിർദേശകം ചേർത്തിട്ടില്ല.
