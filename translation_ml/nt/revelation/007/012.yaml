revisions:
- from: 'അവർ പറഞ്ഞു: “ആമേൻ! അനുഗ്രഹവും മഹത്ത്വവും ജ്ഞാനവും നന്ദിയും ബഹുമാനവും ശക്തിയും പ്രാബല്യവും നമ്മുടെ ദൈവത്തിനാകട്ടെ എന്നെന്നേക്കും.[a] ആമേൻ.”'
  to: 'അവർ ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്: “ആമേൻ! അനുഗ്രഹവും മഹത്ത്വവും ജ്ഞാനവും നന്ദിയും ബഹുമാനവും ശക്തിയും ബലവും നമ്മുടെ ദൈവത്തിനാകട്ടെ എന്നെന്നേക്കും.[a] ആമേൻ.”'
  rationale: The revision preserves the draft’s accurate sevenfold structure and formal doxological register. It more closely reflects the Greek participial λέγοντες and uses “ബലം” for ἰσχύς, avoiding the potentially narrower sense of “പ്രാബല്യം.” The footnote anchor and its lexical-alternative function remain correctly placed.
