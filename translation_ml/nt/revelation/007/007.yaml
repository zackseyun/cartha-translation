  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: ml
  text: ശിമെയോൻ ഗോത്രത്തിൽനിന്ന്[a] പന്ത്രണ്ടായിരം; ലേവി ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം; യിസ്സാഖാർ ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ശിമെയോന്റെ ഗോത്രത്തിൽനിന്ന് ... ലേവിയുടെ ഗോത്രത്തിൽനിന്ന് ... യിസ്സാഖാറിന്റെ ഗോത്രത്തിൽനിന്ന്.’'
    reason: ഗ്രീക്കിലെ ‘ഗോത്രത്തിന്റെ/ഗോത്രത്തിൽനിന്ന്’ എന്ന ബന്ധം കൂടുതൽ വ്യക്തമായി കാണിക്കുന്ന ഔപചാരിക മലയാളരൂപം.
lexical_decisions:
- source_word: ἐκ
  choice: -ൽനിന്ന്
  rationale: ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കുന്ന ആവർത്തിത പൂർവപ്രത്യയപ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികവും പട്ടികയുടെ ഘടന നിലനിർത്തുന്നതുമാണ്.
- source_word: φυλῆς
  choice: ഗോത്രം
  rationale: ഇസ്രായേലിന്റെ വംശപരമായ ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും കൃത്യവുമായ മലയാളപദം.
- source_word: Συμεὼν
  choice: ശിമെയോൻ
  rationale: ബൈബിൾ മലയാളത്തിലെ പരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
- source_word: δώδεκα χιλιάδες
  choice: പന്ത്രണ്ടായിരംപേർ
  rationale: ഗ്രീക്കിൽ സംഖ്യ മാത്രമാണെങ്കിലും സന്ദർഭത്തിൽ മുദ്രയേൽക്കുന്ന ആളുകളെയാണ് എണ്ണുന്നത്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘പേർ’ ചേർത്തു.
- source_word: Λευὶ
  choice: ലേവി
  rationale: പരിചിതമായ മലയാള പേരുരൂപം; പട്ടികയിലെ അസാധാരണ ഉൾപ്പെടുത്തലിനെ വിശദീകരിക്കാതെ മൂലപാഠം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Ἰσσαχὰρ
  choice: യിസ്സാഖാർ
  rationale: ബൈബിൾ മലയാളത്തിലെ പരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: ഗോത്രപ്പട്ടികയിലെ ആവർത്തനഘടന
  choice: ഓരോ ഗോത്രത്തിനും ‘ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരംപേർ’ എന്ന ഘടന ആവർത്തിച്ചു.
  alternative: ‘ശിമെയോൻ, ലേവി, യിസ്സാഖാർ ഗോത്രങ്ങളിൽനിന്ന് പന്ത്രണ്ടായിരംപേർ വീതം’ എന്ന് ചുരുക്കുക.
  rationale: ഗ്രീക്കിലെ ആവർത്തനവും വെളിപ്പാടുസാഹിത്യത്തിന്റെ എണ്ണിപ്പറയുന്ന താളവും സംരക്ഷിക്കുന്നു.
- issue: ഗോത്രപ്പട്ടികയിൽ ലേവിയുടെ ഉൾപ്പെടുത്തൽ
  choice: വിശദീകരണമില്ലാതെ ‘ലേവി’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ലേവിയുടെ അസാധാരണ ഉൾപ്പെടുത്തൽ മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുക.
  rationale: മൂലവാക്യം ലേവിയെ ലളിതമായി പട്ടികപ്പെടുത്തുന്നു; വിശദീകരണം ചേർക്കുന്നത് പാഠത്തിന് അതീതമായ വ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. പട്ടികയുടെ ഔപചാരിക ആവർത്തനം നിലനിർത്തി; സംഖ്യകൾ വാക്കുകളായി എഴുതി.
