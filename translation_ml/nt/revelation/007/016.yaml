source:
  edition: SBLGNT
  text: οὐ πεινάσουσιν ἔτι ⸀οὐδὲ διψήσουσιν ἔτι, οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος οὐδὲ πᾶν καῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: ml
  text: അവർ ഇനി വിശക്കുകയില്ല; ഇനി ദാഹിക്കുകയുമില്ല. സൂര്യനും യാതൊരു പൊള്ളുന്ന ചൂടും അവരുടെമേൽ ഒരിക്കലും പതിക്കുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൂര്യൻ അവരുടെമേൽ തീർച്ചയായും പതിക്കുകയില്ല’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ ശക്തമായ നിഷേധപ്രയോഗമാണ് (οὐδὲ μὴ πέσῃ).
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινάσουσιν
  choice: വിശക്കുകയില്ല
  rationale: πεινάω എന്ന ക്രിയയുടെ ഭാവികാല അർഥം സ്വാഭാവികമായ മലയാള ക്രിയാരൂപത്തിൽ നൽകുന്നു; തുടർന്നുള്ള ‘ദാഹിക്കുകയുമില്ല’ എന്നതിനോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: ἔτι
  choice: ഇനി
  rationale: നിഷേധത്തോടൊപ്പം ἔτι, ഈ ഘട്ടംമുതൽ അവസ്ഥ അവസാനിക്കുന്നുവെന്ന ‘ഇനി ഒരിക്കലുമില്ല’ എന്ന ആശയം നൽകുന്നു.
- source_word: οὐδὲ
  choice: -യുമില്ല / -നോ … -ഓ
  rationale: തുടർച്ചയായ നിഷേധവാക്യങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്ന രൂപങ്ങൾ; ഗ്രീക്കിലെ സഞ്ചിത നിഷേധം സംരക്ഷിക്കുന്നു.
- source_word: διψήσουσιν
  choice: ദാഹിക്കുകയുമില്ല
  rationale: διψάω എന്ന ക്രിയയെ ക്രിയാരൂപത്തിൽ തന്നേ നൽകി, വിശപ്പിനോടുള്ള ഗ്രീക്ക് സമാന്തരഘടന നിലനിർത്തുന്നു.
- source_word: οὐδὲ μὴ πέσῃ
  choice: ഒരിക്കലും പതിക്കുകയില്ല
  rationale: οὐ μή സഹിതമുള്ള ശക്തമായ ഭാവിനിഷേധം ‘ഒരിക്കലും … ഇല്ല’ എന്നു വ്യക്തമാക്കുന്നു; πέσῃ എന്നതിന്റെ ‘പതിക്കുക’ എന്ന ദൃശ്യബിംബവും നിലനിർത്തുന്നു.
- source_word: ἐπ’ αὐτούς
  choice: അവരുടെമേൽ
  rationale: ἐπί + accusative സൂചിപ്പിക്കുന്ന മേലേക്കുള്ള പതനം/ആഘാതം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ ἥλιος
  choice: സൂര്യൻ
  rationale: നേരിട്ടുള്ള ശബ്ദാർഥപരമായ വിവർത്തനം.
- source_word: πᾶν καῦμα
  choice: പൊള്ളുന്ന യാതൊരു ചൂടും
  rationale: καῦμα എന്നത് ദഹിപ്പിക്കുന്നതോ പൊള്ളിക്കുന്നതോ ആയ ചൂടിനെ സൂചിപ്പിക്കുന്നു; നിഷേധഘടനയിൽ πᾶν എന്നതിന്റെ സമഗ്രത ‘യാതൊരു …-ഉം’ വഴി നൽകുന്നു.
theological_decisions:
- issue: യെശയ്യാവ് 49:10-നോടുള്ള സൂചനയും അന്ത്യകാല പുനഃസ്ഥാപനഭാഷയും
  choice: വിശപ്പ്, ദാഹം, സൂര്യൻ, പൊള്ളുന്ന ചൂട് എന്നീ മൂർത്ത ദൃശ്യങ്ങൾ അതേപടി നിലനിർത്തി.
  alternative: വിശപ്പും ദാഹവും പ്രധാനമായും ആത്മീയമായ ആഗ്രഹങ്ങളുടെ രൂപകങ്ങളായി വിവർത്തനത്തിൽ വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം അന്ത്യകാല ആശ്വാസത്തിന്റേതും ഭാഷ യെശയ്യാവിലെ പുനഃസ്ഥാപനവാഗ്ദാനത്തെ അനുസ്മരിപ്പിക്കുന്നതുമാണ്. എന്നാൽ മൂലപാഠം രൂപകവ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ ആത്മീയവൽക്കരണം ഒഴിവാക്കി ദൃശ്യങ്ങൾ തുറന്ന നിലയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒരിക്കലും പതിക്കുകയില്ല’ എന്നത് ഗ്രീക്കിലെ ശക്തമായ നിഷേധവും ‘പതിക്കുക’ എന്ന മൂലദൃശ്യവും ഒരുമിച്ചു സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പിന്റെ സൂചകം ബന്ധപ്പെട്ട ശക്തമായ നിഷേധവാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
