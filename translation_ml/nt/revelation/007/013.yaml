id: REV.7.13
reference: Revelation 7:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: ml
  text: 'അപ്പോൾ മൂപ്പന്മാരിൽ ഒരാൾ എന്നോടു മറുപടിയായി പറഞ്ഞു: “വെള്ള മേലങ്കികൾ ധരിച്ചിരിക്കുന്ന ഇവർ ആരാണ്? ഇവർ എവിടെനിന്നു വന്നു?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: അപ്പോൾ
  rationale: ദർശനവിവരണത്തിലെ തുടർച്ചയും അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπεκρίθη ... λέγων μοι
  choice: എന്നോടു ചോദിച്ചു
  rationale: ἀπεκρίθη എന്നത് പദശഃ ‘മറുപടി പറഞ്ഞു’ എന്നാണെങ്കിലും, ഉടൻ പിന്നാലെയുള്ളത് ഒരു ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘എന്നോടു ചോദിച്ചു’ എന്നത് സംഭാഷണപ്രവർത്തിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഇവിടെ ഗ്രീക്ക് പ്രയോഗത്തിന് നിർബന്ധമായും മുമ്പത്തെ നേരിട്ടുള്ള ചോദ്യം ആവശ്യമില്ല.
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: മൂപ്പന്മാരിൽ ഒരാൾ
  rationale: ഭാഗാത്മക ഘടന കൃത്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: Οὗτοι οἱ περιβεβλημένοι
  choice: ധരിച്ചിരിക്കുന്ന ഇവർ
  rationale: പൂർണ്ണകാല കൃദന്തരൂപത്തിന്റെ ഇപ്പോഴുള്ള അവസ്ഥയെ ‘ധരിച്ചിരിക്കുന്ന’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: τὰς στολὰς τὰς λευκάς
  choice: വെള്ള അങ്കികൾ
  rationale: στολή സൂചിപ്പിക്കുന്ന നീണ്ട പുറംവസ്ത്രത്തിന് ‘അങ്കി’ സ്വാഭാവികവും വെളിപ്പാടിലെ വസ്ത്രപ്രതീകത്തിന് അനുയോജ്യവുമാണ്.
- source_word: τίνες εἰσὶν
  choice: ആരാണ്?
  rationale: തിരിച്ചറിയലിനെക്കുറിച്ചുള്ള ചോദ്യം ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πόθεν ἦλθον
  choice: എവിടെനിന്നു വന്നു?
  rationale: ഉത്ഭവസ്ഥലത്തെ ചോദിക്കുന്ന πόθεν-ഉം ഗ്രീക്ക് ഭൂതകാലരൂപമായ ἦλθον-ഉം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀπεκρίθη എന്ന ക്രിയയുടെ സംഭാഷണപരമായ അർഥം
  choice: ‘എന്നോടു ചോദിച്ചു’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘എന്നോടു മറുപടിയായി പറഞ്ഞു’
  rationale: മൂപ്പൻ ഉച്ചരിക്കുന്നത് ഒരു ചോദ്യമാണ്; മലയാളത്തിൽ പദശഃ ‘മറുപടി പറഞ്ഞു’ എന്നു നൽകിയാൽ രേഖപ്പെടുത്താത്ത മുൻചോദ്യമുണ്ടെന്ന തെറ്റായ ധാരണ ശക്തിപ്പെടാം. ഇത് ഉപദേശപരമായ വ്യാഖ്യാനം അല്ല, സ്വാഭാവിക സംഭാഷണരൂപമാണ്.
- issue: ἦλθον എന്ന ഭൂതകാലരൂപത്തിന്റെ വിവർത്തനം
  choice: ‘വന്നു’
  alternative: ‘വന്നിരിക്കുന്നു’
  rationale: ഗ്രീക്ക് aorist-ന്റെ ഭൂതകാലസ്വഭാവം നിലനിർത്തുന്നു. ‘വന്നിരിക്കുന്നു’ ഇപ്പോഴത്തെ പ്രസക്തിയെ ഊന്നാമെങ്കിലും, മലയാളത്തിൽ ലളിതഭൂതകാലം ഇവിടെ വ്യക്തവും സ്വാഭാവികവുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ദർശനവിവരണശൈലി. അനാവശ്യമായ പുരാതനപ്രയോഗങ്ങളും വിഭാഗീയ പദസഞ്ചയവും ഒഴിവാക്കി.
