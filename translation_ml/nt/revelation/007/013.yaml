revisions:
- from: 'അപ്പോൾ മൂപ്പന്മാരിൽ ഒരാൾ എന്നോടു ചോദിച്ചു: “വെള്ള അങ്കികൾ ധരിച്ചിരിക്കുന്ന ഇവർ ആരാണ്? ഇവർ എവിടെനിന്നു വന്നു?”'
  to: 'അപ്പോൾ മൂപ്പന്മാരിൽ ഒരാൾ എന്നോടു മറുപടിയായി പറഞ്ഞു: “വെള്ള മേലങ്കികൾ ധരിച്ചിരിക്കുന്ന ഇവർ ആരാണ്? ഇവർ എവിടെനിന്നു വന്നു?”'
  rationale: The revision restores the response sense of ἀπεκρίθη and retains λέγων μοι through a natural Malayalam speech introduction. “മേലങ്കികൾ” is used for στολαί to convey robe-like outer garments without importing a specialized doctrinal term. The two questions and the past sense of ἦλθον are preserved.
