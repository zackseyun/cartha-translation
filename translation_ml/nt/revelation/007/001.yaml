  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: ml
  text: ഇതിനുശേഷം[a] ഭൂമിയുടെ നാലു കോണുകളിൽ നിൽക്കുന്ന നാലു ദൂതന്മാരെ ഞാൻ കണ്ടു. ഭൂമിയിലോ കടലിലോ ഒരു മരത്തിന്മേലോ കാറ്റ് വീശാതിരിക്കാൻ അവർ ഭൂമിയിലെ നാലു കാറ്റുകളെ പിടിച്ചുനിർത്തുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു വിവർത്തനം: ‘ഇവയ്ക്കുശേഷം ഞാൻ കണ്ടു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: ഇതിനുശേഷം
  rationale: ദർശനവിവരണത്തിലെ കാലക്രമസൂചകത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ദർശനാത്മക ഗ്രഹണത്തെ അധിക വിശദീകരണം ചേർക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: τέσσαρας ἀγγέλους
  choice: നാലു ദൂതന്മാരെ
  rationale: സംഖ്യയും നാമവും നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; ഇവിടെ ἄγγελος ദൈവിക ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἑστῶτας
  choice: നിന്നുകൊണ്ട്
  rationale: ἵστημι എന്ന ക്രിയയുടെ പൂർണ്ണകാല കർത്തൃവാചക കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘നിയോഗിക്കപ്പെട്ട്’ എന്ന വ്യാഖ്യാനപരമായ ആശയം ചേർക്കുന്നില്ല.
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: ഭൂമിയുടെ നാലു കോണുകളിൽ
  rationale: വെളിപ്പാട് സാഹിത്യത്തിലെ പരമ്പരാഗത ദൃശ്യപ്രയോഗം അതിന്റെ രൂപകൽപ്പനയോടെ സംരക്ഷിക്കുന്നു; ἐπί ഇവിടെ സ്ഥാനസൂചനയായി സ്വാഭാവികമായ ‘-യിൽ’കൊണ്ട് നൽകിയിരിക്കുന്നു.
- source_word: κρατοῦντας
  choice: പിടിച്ചുനിർത്തുന്ന
  rationale: തുടർന്നുള്ള ഉദ്ദേശ്യവാക്യം കാറ്റുകൾ വീശുന്നത് തടയുന്നതായി വ്യക്തമാക്കുന്നതിനാൽ κρατέωയുടെ പിടിച്ചുവെക്കുക/തടഞ്ഞുനിർത്തുക എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: ഭൂമിയിലെ നാലു കാറ്റുകളെയും
  rationale: നാലു ദിക്കുകളിൽനിന്നുള്ള കാറ്റുകളെ സൂചിപ്പിക്കുന്ന ദർശനാത്മക പ്രയോഗം നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘ഭൂമിയിലെ’ എന്നത് സ്വാഭാവികമായ ബന്ധം നൽകുന്നു.
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: കാറ്റ് വീശാതിരിക്കേണ്ടതിന്
  rationale: ἵνα + ഉപവാക്യക്രിയയുടെ ഉദ്ദേശ്യഭാവം വ്യക്തമാക്കുകയും ഏകവചന അനിർദ്ദിഷ്ടമായ ἄνεμοςനെ പൊതുവാചകമായ ‘കാറ്റ്’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: ഭൂമിയിലോ കടലിലോ ഒരു മരത്തിന്മേലും
  rationale: മുൻപുള്ള നിഷേധത്തോടൊപ്പം μήτε…μήτε സൂചിപ്പിക്കുന്ന മൂന്നു മേഖലകളെയും മലയാളത്തിലെ ‘-ഓ…-ഓ…-ഉം’ ഘടനയിൽ സ്വാഭാവികമായി ഏകോപിപ്പിക്കുന്നു; πᾶν δένδρον വിതരണാർഥത്തിൽ ‘ഒരു മരത്തിന്മേലും’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: വെളിപ്പാട് ദർശനത്തിലെ γῆയുടെ വ്യാപ്തി
  choice: വാക്യത്തിലുടനീളം ‘ഭൂമി’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ദേശം / കര
  rationale: നാലു കോണുകൾ, നാലു കാറ്റുകൾ, ഭൂമി, കടൽ, എല്ലാ മരങ്ങളും എന്നിവ ഉൾപ്പെടുന്ന ദൃശ്യം ആഗോള-പ്രപഞ്ച വ്യാപ്തിയുള്ളതാണ്; ‘ദേശം’ എന്നു നൽകിയാൽ സന്ദർഭം അനുവദിക്കുന്നതിലധികം അർഥം ചുരുങ്ങും.
- issue: ‘ഭൂമിയുടെ നാലു കോണുകൾ’ എന്ന പ്രപഞ്ചദൃശ്യഭാഷയുടെ സ്വഭാവം
  choice: ദൃശ്യപ്രയോഗം പദരൂപത്തിൽ സംരക്ഷിച്ചു.
  alternative: ഭൂമിയുടെ നാലു അറ്റങ്ങൾ / നാലു ദിക്കുകൾ
  rationale: ഇത് പരമ്പരാഗത ദർശനാത്മക-പ്രപഞ്ച പ്രയോഗമാണ്. വിശദീകരണപരമായി സമതലപ്പെടുത്താതെ മൂലപാഠത്തിന്റെ ദൃശ്യബലം നിലനിർത്തുന്നു; പ്രയോഗത്തിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ ദർശനാത്മക ദൃശ്യഭാഷ സംരക്ഷിച്ചുകൊണ്ട് വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
