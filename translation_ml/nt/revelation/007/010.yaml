id: REV.7.10
reference: Revelation 7:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κράζουσι φωνῇ μεγάλῃ λέγοντες· Ἡ σωτηρία τῷ θεῷ ἡμῶν τῷ καθημένῳ ἐπὶ τῷ θρόνῳ καὶ τῷ ἀρνίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: ml
  text: 'അവർ ഉച്ചത്തിൽ വിളിച്ചുപറയുന്നു: “രക്ഷ[a] സിംഹാസനത്തിൽ ഇരിക്കുന്ന നമ്മുടെ ദൈവത്തിനും കുഞ്ഞാടിനും അവകാശപ്പെട്ടതാണ്!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “രക്ഷ സിംഹാസനത്തിൽ ഇരിക്കുന്ന നമ്മുടെ ദൈവത്തിനും കുഞ്ഞാടിനും!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζουσι
  choice: വിളിച്ചുപറയുന്നു
  rationale: വർത്തമാനകാല ബഹുവചനക്രിയ ദൃശ്യത്തിലെ സജീവവും ശക്തവുമായ വിളിയെ പ്രകടമാക്കുന്നു; വെറും ‘പറയുന്നു’ എന്നതിനെക്കാൾ κράζωയുടെ ഊന്നൽ ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: φωνῇ μεγάλῃ
  choice: ഉച്ചസ്വരത്തിൽ
  rationale: രീതി സൂചിപ്പിക്കുന്ന ഈ ദത്തിവ് പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ ശബ്ദത്തിന്റെ ശക്തി അറിയിക്കുന്നു.
- source_word: λέγοντες
  choice: 'വിളിച്ചുപറയുന്നു:'
  rationale: പ്രധാനക്രിയയോടൊപ്പം ചേർന്ന ഈ കൃദന്തം വിളിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ഒരൊറ്റ സംയുക്തക്രിയയും പിന്നാലെയുള്ള ഉദ്ധരണിയും ആവർത്തനം ഒഴിവാക്കി അർത്ഥം സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: Ἡ σωτηρία
  choice: രക്ഷ ... ഉള്ളത്
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് ജയഘോഷത്തിലെ ആരോപണ/അവകാശ ദത്തിവ് മലയാളത്തിൽ ‘ഉള്ളത്’ എന്നു വ്യക്തമാക്കി നൽകുന്നു; ‘ജയം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ σωτηρίαയുടെ വിശാലമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: τῷ θεῷ ἡμῶν
  choice: നമ്മുടെ ദൈവത്തിനും
  rationale: രക്ഷ ആരോടാണ് ആരോപിക്കപ്പെടുന്നത് അഥവാ ആരുടേതാണെന്ന് ദത്തിവ് സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള കുഞ്ഞാടിനോടൊപ്പം സംയുക്തമായി അത് നിലനിർത്തുന്നു.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്ന
  rationale: ‘നമ്മുടെ ദൈവം’ ആരെന്ന് വ്യക്തമാക്കുന്ന വിശേഷണകൃദന്തത്തെ ലളിതവും ദൃശ്യാത്മകവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῷ ἀρνίῳ
  choice: കുഞ്ഞാടിനും
  rationale: വെളിപ്പാടിലെ യേശുവിനുള്ള സ്ഥിരമായ യോഹന്നാനീയ ശീർഷകവും ബലിയർപ്പണ-മിശിഹാ ദൃശ്യവും പരിഭാഷപ്പെടുത്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: രക്ഷയും ദൈവവും കുഞ്ഞാടും തമ്മിലുള്ള ബന്ധം
  choice: “രക്ഷ ... നമ്മുടെ ദൈവത്തിനും കുഞ്ഞാടിനും ഉള്ളത്” എന്ന സംയുക്ത ജയഘോഷമായി പരിഭാഷപ്പെടുത്തുക.
  alternative: കൂടുതൽ അക്ഷരാർഥത്തിൽ “രക്ഷ നമ്മുടെ ദൈവത്തിനും കുഞ്ഞാടിനും” എന്നു നൽകുക.
  rationale: ഗ്രീക്ക് ദത്തിവ് ഘടന രക്ഷയെ ദൈവത്തിനും കുഞ്ഞാടിനും സംയുക്തമായി ആരോപിക്കുന്നു. അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ വാക്യത്തിന്റെ ഉന്നത ക്രിസ്തുശാസ്ത്രപരവും ആരാധനാത്മകവുമായ ശക്തി ഇതു സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ഗ്രീക്കിലെ ശക്തമായ വിളിയും ക്രിയയില്ലാത്ത ജയഘോഷവും സംരക്ഷിക്കുമ്പോൾ മലയാളവാക്യം വ്യക്തമായി ഗ്രഹിക്കാനായി ‘ഉള്ളത്’ ചേർത്തു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
