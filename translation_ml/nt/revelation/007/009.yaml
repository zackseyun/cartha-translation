id: REV.7.9
reference: Revelation 7:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: ml
  text: ഇവയ്ക്കുശേഷം ഞാൻ നോക്കി; ഇതാ, ആർക്കും എണ്ണാൻ കഴിയാത്ത ഒരു മഹാപുരുഷാരം! ഓരോ ജനതയിൽനിന്നും ഗോത്രങ്ങളിൽനിന്നും ജനസമൂഹങ്ങളിൽനിന്നും ഭാഷകളിൽനിന്നുമുള്ളവർ[a] സിംഹാസനത്തിന്റെയും കുഞ്ഞാടിന്റെയും മുമ്പിൽ നിന്നിരുന്നു. അവർ വെള്ള അങ്കികൾ ധരിച്ചിരുന്നു; അവരുടെ കൈകളിൽ ഈന്തപ്പനയുടെ കുരുത്തോലകളും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഒഴുക്കോടെ: “ഓരോ ജനതയിലും ഗോത്രത്തിലും ജനസമൂഹത്തിലും ഭാഷയിലും നിന്നുള്ളവർ.” മുഖ്യപാഠം ഗ്രീക്കിൽ ‘ജനത’ ഏകവചനത്തിലും തുടർന്ന് ‘ഗോത്രങ്ങൾ, ജനസമൂഹങ്ങൾ, ഭാഷകൾ’ ബഹുവചനത്തിലും വരുന്നതിലെ മാറ്റം നിലനിർത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ഇവയ്ക്കുശേഷം
  rationale: ταῦτα എന്ന ബഹുവചന സൂചനയും ദർശനങ്ങളുടെ ക്രമവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: ഞാൻ നോക്കി; ഇതാ
  rationale: ദർശനരംഗത്തിലേക്കുള്ള ശ്രദ്ധാമാറ്റം ‘നോക്കി’ അറിയിക്കുന്നു; ἰδού എന്ന ശ്രദ്ധാകർഷക പദത്തിന്റെ ശക്തി ‘ഇതാ’ നിലനിർത്തുന്നു.
- source_word: ὄχλος πολύς
  choice: ഒരു മഹാപുരുഷാരം
  rationale: വളരെ വലിയ ജനക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്നതോടൊപ്പം വെളിപ്പാടിന്റെ ഗൗരവമുള്ള ശൈലിക്കും യോജിക്കുന്നു.
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: ആർക്കും എണ്ണാൻ കഴിയാത്ത
  rationale: ആ ജനസമൂഹത്തെ എണ്ണാനുള്ള മനുഷ്യരുടെ അശക്തി വ്യക്തമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: ഓരോ ജനതയിൽനിന്നും ഗോത്രങ്ങളിൽനിന്നും ജനസമൂഹങ്ങളിൽനിന്നും ഭാഷകളിൽനിന്നുമുള്ളവർ
  rationale: ἔθνος എന്ന ഏകവചനത്തിനുശേഷം വരുന്ന φυλαί, λαοί, γλῶσσαι എന്നീ ബഹുവചനങ്ങളുടെ മാറ്റം മുഖ്യപാഠത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു; വ്യത്യസ്ത മാനവസമൂഹങ്ങളെയും ഭാഷാവിഭാഗങ്ങളെയും ഒന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: ἑστῶτες
  choice: നിന്നിരുന്നു
  rationale: ദർശനത്തിൽ അവർ സിംഹാസനത്തിന്റെയും കുഞ്ഞാടിന്റെയും മുമ്പിൽ നിൽക്കുന്ന നിലയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: സിംഹാസനത്തിന്റെയും കുഞ്ഞാടിന്റെയും മുമ്പിൽ
  rationale: ἐνώπιον എന്നതിന്റെ സാന്നിധ്യ-സ്ഥാന അർഥം ‘മുമ്പിൽ’ കൃത്യമായി നൽകുന്നു; മലയാളത്തിലെ സംയുക്തഘടന അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: അവർ വെള്ള അങ്കികൾ ധരിച്ചിരുന്നു
  rationale: στολαί സൂചിപ്പിക്കുന്ന പ്രത്യേക പുറംവസ്ത്രങ്ങളെ ‘അങ്കികൾ’ എന്നു വ്യക്തമാക്കുകയും περιβεβλημένους എന്ന ധരിച്ചിരിക്കുന്ന അവസ്ഥ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: അവരുടെ കൈകളിൽ ഈന്തപ്പനയുടെ കുരുത്തോലകളും ഉണ്ടായിരുന്നു
  rationale: φοίνικες ഇവിടെ വൃക്ഷങ്ങളെയല്ല, കൈകളിൽ പിടിക്കാവുന്ന ഈന്തപ്പനയുടെ ഓലകളെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ നിലാവസ്ഥയെ വ്യാഖ്യാനാത്മകമായ ‘പിടിച്ചിരുന്നു’ എന്ന ക്രിയ ചേർക്കാതെ നൽകുന്നു.
theological_decisions:
- issue: വെളിപ്പാടിലെ ἀρνίον എന്ന ക്രിസ്തുസംബന്ധമായ സ്ഥാനനാമം
  choice: കുഞ്ഞാട്
  alternative: ചെറിയ ആട്ടിൻകുട്ടി
  rationale: വെളിപ്പാടിൽ ἀρνίον സ്ഥിരമായ ക്രിസ്തുസംബന്ധമായ സ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നു. ‘കുഞ്ഞാട്’ അതിന്റെ പരിചിതമായ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു; രൂപശാസ്ത്രപരമായ ലഘുത്വം അതിരുകടന്ന് പ്രകടമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ദർശനവിവരണത്തിന്റെ ഉജ്ജ്വലതയ്ക്കായി ‘ഇതാ’യും ‘മഹാപുരുഷാരം’ എന്ന പദവും നിലനിർത്തി. ഗ്രീക്കിലെ ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും കൂടുതൽ സ്വാഭാവികമായ വിതരണഘടന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
