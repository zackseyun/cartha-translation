id: REV.7.3
reference: Revelation 7:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the servants of our God on their foreheads.”
translation:
  language: ml
  text: 'ഇങ്ങനെ പറഞ്ഞു: “നമ്മുടെ ദൈവത്തിന്റെ അടിമകളുടെ[a] നെറ്റികളിൽ ഞങ്ങൾ മുദ്രയിടുന്നതുവരെ ഭൂമിക്കോ കടലിനോ മരങ്ങൾക്കോ ദോഷം വരുത്തരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സേവകർ” അല്ലെങ്കിൽ “ദാസന്മാർ.” ഗ്രീക്കിലെ δοῦλους എന്ന പദം യജമാനനു സ്വന്തമായും അവന്റെ അധികാരത്തിൻകീഴിലും ഉള്ളവരെ സൂചിപ്പിക്കാം; ഇവിടെ “അടിമകൾ” ആ ആശയത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικήσητε
  choice: ദോഷം വരുത്തരുത്
  rationale: ഭൂമി, കടൽ, മരങ്ങൾ എന്നിവയാണ് കർമങ്ങൾ; അതിനാൽ വ്യക്തികളോടുള്ള അനീതിയേക്കാൾ ഭൗതികമായ ഹാനി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: γῆν
  choice: ഭൂമി
  rationale: ഭൂമി–കടൽ–മരങ്ങൾ എന്ന പ്രളയദർശനാത്മക നിരയിൽ വിശാലമായ അർഥം നൽകുന്നു.
- source_word: θάλασσαν
  choice: കടൽ
  rationale: സന്ദർഭത്തിന് യോജിച്ച നേരിട്ടുള്ള സാധാരണ പരിഭാഷ.
- source_word: δένδρα
  choice: മരങ്ങൾ
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ ബഹുവചന രൂപം.
- source_word: ἄχρι
  choice: വരെ
  rationale: ദോഷം വരുത്തുന്നതിനുള്ള വിലക്ക് മുദ്രയിടൽ പൂർത്തിയാകുന്നതുവരെ നിലനിൽക്കുന്നു എന്ന സമയപരിധി വ്യക്തമാക്കുന്നു.
- source_word: σφραγίσωμεν
  choice: ഞങ്ങൾ മുദ്രയിടുക
  rationale: ഒന്നാംപുരുഷ ബഹുവചനം നിലനിർത്തുകയും മുദ്രകൊണ്ട് അടയാളപ്പെടുത്തുക എന്ന ദർശനാത്മക ആശയം നേരിട്ട് പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: δούλους
  choice: അടിമകൾ
  rationale: ഒരു യജമാനന്റെ ഉടമസ്ഥതയിലും അധികാരത്തിലും ഉള്ളവർ എന്ന δοῦλος എന്ന പദത്തിന്റെ ശക്തി ഇവിടെ ദൈവത്തിന്റേതായി മുദ്രയിടപ്പെടുന്നവരുടെ ബന്ധത്തിൽ പ്രസക്തമാണ്.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: നമ്മുടെ ദൈവത്തിന്റെ
  rationale: ബന്ധസൂചക ഘടനയും ‘നമ്മുടെ’ എന്ന പ്രഭാഷകന്റെ സ്വയംതിരിച്ചറിയലും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: അവരുടെ നെറ്റിയിൽ
  rationale: മുദ്രയുടെ സ്ഥാനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഏകവചനമായ ‘നെറ്റിയിൽ’ ഓരോ വ്യക്തിയുടെയും നെറ്റിയെ വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: λέγων
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ പ്രവർത്താവിനോടു ബന്ധമുള്ള ഗ്രീക്ക് വർത്തമാന കൃദന്തരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ധരണി-ആമുഖമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റേതായുള്ള ബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: സേവകർ; ദാസന്മാർ
  rationale: ന്യായവിധിക്ക് മുമ്പ് മുദ്രയിടപ്പെടുന്നവർ ദൈവത്തിന്റേതാണെന്ന ഉടമസ്ഥതയും പൂർണ വിധേയത്വവും ഈ സന്ദർഭത്തിൽ പ്രധാനമാണ്. അതിനാൽ പദത്തിന്റെ ശക്തി മൃദൂകരിക്കാതെ ‘അടിമകൾ’ എന്നു നൽകി; പരമ്പരാഗതമായി ഉപയോഗിക്കുന്ന മൃദുവായ പകരങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഉദ്ധരണിയുടെ ആമുഖം മലയാളത്തിൽ സ്വാഭാവികമാക്കി; ‘നെറ്റിയിൽ’ വിതരണാർഥത്തിൽ ഏകവചനമായി ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘അടിമകളുടെ’ എന്ന പദത്തോടു ചേർത്തു.
