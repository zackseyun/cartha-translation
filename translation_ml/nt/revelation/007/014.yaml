id: REV.7.14
reference: Revelation 7:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: ml
  text: 'ഞാൻ അദ്ദേഹത്തോട്, “എന്റെ യജമാനനേ, അങ്ങേക്കറിയാം” എന്നു പറഞ്ഞു. അപ്പോൾ അദ്ദേഹം എന്നോട് പറഞ്ഞു: “ഇവർ മഹാകഷ്ടത്തിൽനിന്ന് പുറത്തുവരുന്നവരാണ്.[a] ഇവർ തങ്ങളുടെ അങ്കികൾ കഴുകി കുഞ്ഞാടിന്റെ രക്തത്തിൽ അവ വെളുപ്പിച്ചു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വലിയ പീഡനത്തിൽനിന്ന്” എന്നോ “വലിയ ദുരിതത്തിൽനിന്ന്” എന്നോ വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദത്തിന് ഞെരുക്കം, കഷ്ടത, പീഡനം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: “കുഞ്ഞാടിന്റെ രക്തത്തിൽ” എന്ന പ്രയോഗം ഉദ്ദേശ്യപൂർവം അതേപടി നിലനിർത്തിയിരിക്കുന്നു. ഗ്രീക്ക് പ്രയോഗത്തെ “കുഞ്ഞാടിന്റെ രക്തത്താൽ” എന്ന് ഉപകരണാർഥത്തിലും മനസ്സിലാക്കാം; എന്നാൽ ഇവിടെ സ്വീകരിച്ച രൂപം വെളിപ്പാടിലെ വിരോധാഭാസമായ ശുദ്ധീകരണദൃശ്യം സംരക്ഷിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: ഞാൻ ... പറഞ്ഞു
  rationale: രൂപം പൂർണകാലമാണെങ്കിലും യോഹന്നാന്റെ ആഖ്യാനത്തിലെ സംഭാഷണാവതരണത്തിൽ ഇത് ഭൂതകാലപ്രയോഗമായി സ്വാഭാവികമായി വരുന്നു.
- source_word: Κύριέ μου
  choice: എന്റെ യജമാനനേ
  rationale: സംസാരിക്കുന്നത് ദൈവത്തോടോ മശിഹയോടോ അല്ല, ഒരു സ്വർഗീയ മൂപ്പനോടാണ്. അതിനാൽ ആദരവ് നിലനിർത്തിക്കൊണ്ട് ദൈവിക പദവിയെന്ന ധാരണ വരുത്താത്ത സംബോധന തിരഞ്ഞെടുത്തു.
- source_word: σὺ οἶδας
  choice: അങ്ങേക്കറിയാം
  rationale: ആദരസൂചകമായ ‘അങ്ങ്’ മൂപ്പനോടുള്ള വിനയം പ്രകടമാക്കുന്നു; ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമത്തിന്റെ നേരിയ ഊന്നലും സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: οἱ ἐρχόμενοι
  choice: പുറത്തുവരുന്നവർ
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്നതോ സവിശേഷത സൂചിപ്പിക്കുന്നതോ ആയ ഭാവം ഭൂതകാലമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: മഹാകഷ്ടത്തിൽനിന്ന്
  rationale: വലിയ പീഡനം, ദുരിതം, ഞെരുക്കം എന്നിവ സൂചിപ്പിക്കാവുന്ന θλῖψις എന്ന പദത്തെ വ്യാഖ്യാനപരമായി ഒരു അന്ത്യകാലക്രമത്തിൽ ഒതുക്കാതെ, തിരിച്ചറിയാവുന്ന സംക്ഷിപ്ത പദപ്രയോഗമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἔπλυναν
  choice: കഴുകി
  rationale: പ്രവൃത്തിയെ പൂർത്തിയായ സമഗ്ര സംഭവമായി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് അനിശ്ചിതഭൂതകാലത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: στολάς
  choice: അങ്കികൾ
  rationale: στολή സൂചിപ്പിക്കുന്ന നീണ്ടതോ വിശിഷ്ടമോ ആയ വസ്ത്രത്തിന് സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പദം.
- source_word: ἐλεύκαναν αὐτάς
  choice: അവ വെളുപ്പിച്ചു
  rationale: ‘വെളുപ്പിക്കുക’ എന്ന കാരണാർഥം നിലനിർത്തുകയും ‘അവ’ എന്ന സർവനാമം അങ്കികളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῷ αἵματι
  choice: രക്തത്തിൽ
  rationale: ‘രക്തത്താൽ’ എന്ന ഉപകരണാർഥം സാധ്യമാണെങ്കിലും, രക്തത്തിൽ കഴുകി വെളുപ്പിക്കുന്ന വെളിപ്പാടിലെ ഉദ്ദേശ്യപൂർവമായ വിരോധാഭാസ ദൃശ്യം ഗ്രീക്കിനോടടുത്ത് നിലനിർത്തുന്നു.
- source_word: τοῦ ἀρνίου
  choice: കുഞ്ഞാടിന്റെ
  rationale: വെളിപ്പാടിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനനാമപരമായ പ്രയോഗമാണിത്; മലയാളത്തിലെ പതിവായ ക്രിസ്തുശാസ്ത്രപരമായ പദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: മൂപ്പനോടുള്ള κύριος എന്ന സംബോധന
  choice: എന്റെ യജമാനനേ
  alternative: പ്രഭോ; അങ്ങുന്നേ
  rationale: സ്വർഗീയ മൂപ്പനോടുള്ള ആദരവ് നിലനിർത്തുമ്പോഴും അയാളെ ദൈവമോ മശിഹയോ ആയി തെറ്റിദ്ധരിപ്പിക്കുന്ന ശക്തമായ ദൈവിക സംബോധന ഒഴിവാക്കുന്നു.
- issue: ‘മഹാകഷ്ടം’ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: മഹാകഷ്ടത്തിൽനിന്ന്
  alternative: വലിയ പീഡനത്തിൽനിന്ന്; വലിയ ദുരിതത്തിൽനിന്ന്
  rationale: ഇത് ഒരു പ്രത്യേക അന്ത്യകാലഘട്ടത്തെയോ പൊതുവായ വിശ്വാസിപീഡനത്തെയോ സൂചിപ്പിക്കുന്നുവെന്ന് വിവർത്തനം തന്നെ തീർപ്പാക്കുന്നില്ല; മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: രക്തത്തിലൂടെയുള്ള വെളുപ്പിക്കൽ എന്ന ദൃശ്യം
  choice: കുഞ്ഞാടിന്റെ രക്തത്തിൽ ... വെളുപ്പിച്ചു
  alternative: കുഞ്ഞാടിന്റെ രക്തത്താൽ ... വെളുപ്പിച്ചു
  rationale: ഉപകരണാർഥം സാധ്യമാണെങ്കിലും ἐν എന്നതിന്റെ സ്ഥലസൂചക രൂപവും വെളിപ്പാടിന്റെ ഉദ്ദേശ്യപൂർവമായ വിരോധാഭാസ ശുദ്ധീകരണദൃശ്യവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുറത്തുവരുന്നവർ’ എന്ന രൂപം ഗ്രീക്ക് വർത്തമാന കൃദന്തത്തിന്റെ തുറന്ന കാലഭാവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പ്രയോഗങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
