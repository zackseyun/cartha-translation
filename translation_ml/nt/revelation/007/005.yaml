  text: ἐκ φυλῆς Ἰούδα δώδεκα χιλιάδες ⸀ἐσφραγισμένοι, ἐκ φυλῆς Ῥουβὴν δώδεκα χιλιάδες, ἐκ φυλῆς Γὰδ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: ml
  text: യെഹൂദാ ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം പേർ മുദ്രയിടപ്പെട്ടു[a]; രൂബേൻ ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം പേർ; ഗാദ് ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം പേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ “മുദ്രയിടപ്പെട്ടവർ” എന്ന കർമണി കൃതന്തം ആദ്യ ഗോത്രത്തിന്റെ എണ്ണത്തിനുശേഷം മാത്രമാണ് വരുന്നത്. ഇവിടെ അതിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ “മുദ്രയിടപ്പെട്ടു” എന്നു നൽകിയിരിക്കുന്നു; തുടർന്നുള്ള സമാന്തര അംഗങ്ങളിലും അതു മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: -ൽനിന്ന്
  rationale: ഉത്ഭവമോ വിഭാഗത്തിൽനിന്നുള്ള ഉൾപ്പെടുത്തലോ സൂചിപ്പിക്കുന്ന ആവർത്തിതമായ ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: φυλῆς
  choice: ഗോത്രം
  rationale: ഇസ്രായേലിന്റെ വംശാവലിപരമായ പന്ത്രണ്ടു ഗോത്രങ്ങളുടെ പശ്ചാത്തലത്തിൽ സ്ഥാപിതവും കൃത്യവുമായ മലയാളപദം.
- source_word: Ἰούδα
  choice: യെഹൂദാ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പേരുരൂപം.
- source_word: δώδεκα χιλιάδες
  choice: പന്ത്രണ്ടായിരം പേർ
  rationale: സംഖ്യ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; മനുഷ്യരുടെ എണ്ണമാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘പേർ’ ചേർക്കുന്നു.
- source_word: ἐσφραγισμένοι
  choice: മുദ്രയിടപ്പെട്ടവർ
  rationale: ഗ്രീക്കിലെ ബഹുവചന കർമണി കൃതന്തത്തിന്റെ രൂപം കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുകയും ആദ്യ ഗോത്രഗണനയോടുള്ള അതിന്റെ വ്യാകരണബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: Ῥουβὴν
  choice: രൂബേൻ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പേരുരൂപം.
- source_word: Γὰδ
  choice: ഗാദ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പേരുരൂപം.
theological_decisions:
- issue: ഗോത്രപ്പട്ടികയിൽ ἐσφραγισμένοι എന്ന കർമണി കൃതന്തത്തിന്റെ രൂപവും വ്യാപ്തിയും
  choice: ആദ്യ ഉപവാക്യത്തിൽ ‘മുദ്രയിടപ്പെട്ടവർ’ എന്നു കൃതന്തരൂപത്തിൽ നൽകുകയും തുടർന്നുള്ള സമാന്തര ഉപവാക്യങ്ങളിൽ അത് ആവർത്തിക്കാതിരിക്കുകയും ചെയ്തു.
  alternative: ‘മുദ്രയിടപ്പെട്ടു’ എന്ന പൂർണക്രിയ ഉപയോഗിക്കുക; അല്ലെങ്കിൽ ഓരോ ഗോത്രത്തിനുശേഷവും അതു ആവർത്തിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം കൃതന്തം ആദ്യ സംഖ്യയ്ക്കുശേഷം മാത്രം വയ്ക്കുന്നു. കൃതന്തരൂപവും തുടർന്നുള്ള ഉപവാക്യങ്ങളിലെ ലോപവും നിലനിർത്തുന്നത് മൂലപാഠത്തിന്റെ ഘടനയും പട്ടികമുഴുവൻ ബാധകമാകുന്ന ആശയവും അനാവശ്യമായി വിശദീകരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗോത്രപ്പട്ടികയുടെ ആവർത്തിത ഘടനയും ഗ്രീക്കിലെ കൃതന്തരൂപവും സംരക്ഷിച്ചിട്ടുണ്ട്.
