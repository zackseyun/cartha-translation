id: REV.7.4
reference: Revelation 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: ml
  text: 'മുദ്രയേൽക്കപ്പെട്ടവരുടെ എണ്ണം ഞാൻ കേട്ടു: ഒരു ലക്ഷത്തി നാല്പത്തിനാലായിരം—ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ[a] ഓരോ ഗോത്രത്തിൽനിന്നും മുദ്രയേൽക്കപ്പെട്ടവർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേൽമക്കൾ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്; പുല്ലിംഗ വംശാവലിപ്രയോഗം ഇതിൽ നിലനിൽക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: ഞാൻ കേട്ടു
  rationale: ἀκούω എന്ന ക്രിയയുടെ ആഖ്യാനസന്ദർഭത്തിലെ ഏറിസ്റ്റ് രൂപം സ്വാഭാവികമായി ‘ഞാൻ കേട്ടു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἀριθμὸν
  choice: എണ്ണം
  rationale: മുദ്രയേൽക്കപ്പെട്ടവരുടെ ആകെ സംഖ്യയെ സൂചിപ്പിക്കുന്ന ἀριθμός എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ തത്തുല്യം ‘എണ്ണം’ ആണ്.
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: മുദ്രയേൽക്കപ്പെട്ടവരുടെ / മുദ്രയേൽക്കപ്പെട്ടവർ
  rationale: σφραγίζω എന്നതിന്റെ പൂർണ്ണകാല കർമണി കൃദന്തരൂപം, മുമ്പ് നടന്ന മുദ്രയിടലിന്റെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു. ‘മുദ്രയേൽക്കപ്പെട്ട’ എന്ന രൂപം കർമണിഭാവവും ഫലാവസ്ഥയും സംരക്ഷിക്കുന്നു; മൂലത്തിലെ ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: ഒരു ലക്ഷത്തി നാല്പത്തിനാലായിരം
  rationale: 144,000 എന്ന സംഖ്യയുടെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപമാണിത്.
- source_word: ἐκ
  choice: നിന്നുമായി
  rationale: ഉറവിടം അഥവാ ഏതു വിഭാഗങ്ങളിൽനിന്നാണ് ഇവർ വരുന്നത് എന്ന ആശയം വ്യക്തമാക്കുന്നു; πάσης φυλῆς എന്ന വിതരണാർഥത്തോട് ചേർന്ന് ‘എല്ലാ ഗോത്രങ്ങളിൽനിന്നുമായി’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: πάσης φυλῆς
  choice: എല്ലാ ഗോത്രങ്ങളിൽനിന്നുമായി
  rationale: ഏകവചനത്തിലുള്ള πᾶς ഇവിടെ വിതരണാർഥം നൽകുന്നു—ഓരോ ഗോത്രത്തിൽനിന്നും ആളുകൾ മുദ്രയേൽക്കപ്പെട്ടു എന്ന ആശയം. മലയാളത്തിൽ ‘എല്ലാ ... നിന്നുമായി’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: υἱῶν Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: υἱῶν എന്ന പുല്ലിംഗ വംശാവലിപദവും ഗോത്രപരമായ ഭാവവും ‘പുത്രന്മാർ’ സംരക്ഷിക്കുന്നു. കൂടുതൽ പതിവായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ഗോത്രപ്പട്ടികയുടെ സന്ദർഭത്തിൽ υἱῶν Ἰσραήλ എന്നതിന്റെ പരിഭാഷ
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേൽമക്കൾ
  rationale: ഗ്രീക്ക് പാഠം വ്യക്തമായി പുല്ലിംഗമായ υἱοί ഉപയോഗിക്കുന്നതിനാൽ വംശാവലി-ഗോത്രഭാവം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു. അതേസമയം, ഇത് ഏതെങ്കിലും പ്രത്യേക അന്ത്യകാല വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല; മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായ പൊതുവികല്പം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘മുദ്രയേൽക്കപ്പെട്ടവർ’ എന്ന ബൈബിൾസന്ദർഭത്തിന് അനുയോജ്യമായ പ്രയോഗം ഉപയോഗിച്ചു; മൂലത്തിലെ കൃദന്തത്തിന്റെ ആവർത്തനം സംരക്ഷിച്ചു. സംഖ്യ മലയാള സംഖ്യാനാമരീതിയിൽ നൽകി.
