id: REV.7.17
reference: Revelation 7:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: ml
  text: കാരണം സിംഹാസനത്തിന്റെ മധ്യത്തിലുള്ള[a] കുഞ്ഞാട് അവരെ മേയിക്കും; അവൻ അവരെ ജീവന്റെ ജലത്തിന്റെ ഉറവുകളിലേക്കു വഴിനടത്തും[b][c]. ദൈവം അവരുടെ കണ്ണുകളിൽനിന്ന് ഓരോ കണ്ണുനീർത്തുള്ളിയും തുടച്ചുകളയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സിംഹാസനത്തിന്റെ കേന്ദ്രത്തിലുള്ള.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നയിക്കും.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ജീവനുള്ള വെള്ളത്തിന്റെ ഉറവുകളിലേക്ക്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: കുഞ്ഞാട്
  rationale: വെളിപ്പാട് പുസ്തകത്തിലെ സ്ഥിരമായ ക്രിസ്തുശീർഷകവും ബലിമൃഗസൂചനയും നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: സിംഹാസനത്തിന്റെ മധ്യത്തിലുള്ള
  rationale: സിംഹാസനത്തോടുള്ള കേന്ദ്രസ്ഥാനത്തിന്റെ ദൃശ്യബിംബം നിലനിർത്തുന്നു; ‘കേന്ദ്രത്തിലുള്ള’ എന്നതും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ποιμανεῖ
  choice: മേയിക്കും
  rationale: ഇടയനായി പരിപാലിക്കുക എന്ന ποιμαίνωയുടെ അടിസ്ഥാനാർഥം പ്രകടമാക്കുകയും കുഞ്ഞാട് തന്നെയാണ് ഇടയനാകുന്നത് എന്ന ഉദ്ദേശ്യപൂർവമായ വിരോധാഭാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁδηγήσει
  choice: വഴിനടത്തും
  rationale: വഴികാട്ടി ലക്ഷ്യസ്ഥാനത്തേക്ക് കൊണ്ടുപോകുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘നയിക്കും’ എന്ന അടുത്ത പകരം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: ജീവജലത്തിന്റെ ഉറവുകളിലേക്കു
  rationale: ചലനലക്ഷ്യം ‘-ലേക്ക്’ എന്നു നൽകുകയും πηγήയുടെ സ്വാഭാവിക ജലസ്രോതസ്സ് എന്ന ബിംബം ‘ഉറവ്’ കൊണ്ട് നിലനിർത്തുകയും ചെയ്യുന്നു. ζωῆς വെള്ളത്തെ വിശേഷിപ്പിക്കുന്ന ‘ജീവജലം’ എന്ന വായന പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചെങ്കിലും ‘ജീവനുള്ള വെള്ളം’ എന്ന സജീവജലാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐξαλείψει
  choice: തുടച്ചുകളയും
  rationale: ആശ്വാസത്തിന്റെ ഈ സന്ദർഭത്തിൽ കണ്ണുനീർ പൂർണമായി നീക്കുന്നതിനെ സ്വാഭാവികവും ദൃശ്യവുമായ ഭാഷയിൽ പറയുന്നു.
- source_word: πᾶν δάκρυον
  choice: ഓരോ കണ്ണുനീർത്തുള്ളിയും
  rationale: ഏകവചനത്തോടുകൂടിയ πᾶν നൽകുന്ന സമഗ്രതയും വ്യക്തിവൽക്കരിച്ച ഊന്നലും മലയാളത്തിൽ തെളിവായി പ്രകടമാക്കുന്നു.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: അവരുടെ കണ്ണുകളിൽനിന്ന്
  rationale: ἐκയുടെ ഉറവിടാർഥവും കണ്ണുകളിൽനിന്ന് കണ്ണുനീർ തുടയ്ക്കുന്ന ദൃശ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുഞ്ഞാട് ഇടയനാകുന്നു എന്ന ക്രിസ്തുശാസ്ത്രപരമായ വിരോധാഭാസം
  choice: ‘കുഞ്ഞാട് അവരെ മേയിക്കും’ എന്ന് നേരിട്ട് നിലനിർത്തി
  alternative: ‘കുഞ്ഞാട് അവരെ പരിപാലിക്കും’ അല്ലെങ്കിൽ ‘ഭരിക്കും’
  rationale: വാക്യം കുഞ്ഞാടിനെ ഇടയന്റെ വേഷത്തിൽ മനപ്പൂർവം അവതരിപ്പിക്കുന്നു. പൊതുവായ ‘പരിപാലിക്കും’ എന്ന പ്രയോഗം ഈ ദൃശ്യബിംബം മങ്ങിക്കും; ‘ഭരിക്കും’ എന്നത് പിന്നാലെയുള്ള ജലസ്രോതസ്സുകളിലേക്കുള്ള വഴിനടത്തലുമായി ബന്ധപ്പെട്ട ഇടയഭാവത്തെ ദുർബലമാക്കും.
- issue: അവസാന ഉപവാക്യത്തിൽ ദൈവവും കുഞ്ഞാടും തമ്മിലുള്ള വ്യത്യാസം
  choice: ‘ദൈവം’ എന്ന വ്യക്തമായ കർത്താവോടെ വേറിട്ട വാക്യമായി നിലനിർത്തി
  alternative: കുഞ്ഞാട് തന്നെയാണ് തുടർന്നും കർത്താവ് എന്നു സൂചിപ്പിക്കുന്ന പരോക്ഷഘടന
  rationale: ഗ്രീക്കിൽ ὁ θεός എന്ന കർത്താവ് വ്യക്തമായി പറയപ്പെട്ടിരിക്കുന്നു. അതിനാൽ കുഞ്ഞാടിന്റെ പ്രവർത്തനങ്ങളിൽനിന്ന് ഈ അവസാന പ്രവർത്തിയെ വ്യാകരണപരമായി വേർതിരിക്കുന്നത് ഉറവിടപാഠത്തോട് വിശ്വസ്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ദർശനസാഹിത്യത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘കുഞ്ഞാട്’, ‘മേയിക്കും’, ‘ഉറവുകൾ’, ‘കണ്ണുനീർത്തുള്ളി’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിലെ ദൃശ്യസമ്പത്ത് നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാവിഭാഗ-വിശേഷ പദാവലി ഒഴിവാക്കിയിരിക്കുന്നു.
