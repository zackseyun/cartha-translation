  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ζαβουλὼν δώδεκα χιλιάδες, ἐκ φυλῆς Ἰωσὴφ δώδεκα χιλιάδες, ἐκ φυλῆς Βενιαμὶν δώδεκα χιλιάδες ⸀ἐσφραγισμένοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/008.yaml
  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: ml
  text: സെബൂലൂൻ ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം; യോസേഫ് ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം; ബെന്യാമീൻ ഗോത്രത്തിൽനിന്ന് പന്ത്രണ്ടായിരം—മുദ്രയിടപ്പെട്ടവർ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുദ്രയിട്ടവർ.’ ഗ്രീക്കിലെ അവസാനത്തെ പൂർണകാല നിഷ്ക്രിയ കൃദന്തരൂപം പട്ടികപ്പെടുത്തിയ എല്ലാ കൂട്ടങ്ങളെയും സംഗ്രഹിച്ച് വിശേഷിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: -ൽനിന്ന്
  rationale: ഉത്ഭവമോ ഉൾപ്പെട്ട വിഭാഗമോ സൂചിപ്പിക്കുന്ന ആവർത്തിത ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φυλῆς
  choice: ഗോത്രം
  rationale: ഇസ്രായേലിന്റെ വംശപരമായ ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപദം.
- source_word: Ζαβουλών
  choice: സെബൂലൂൻ
  rationale: പേരിന്റെ പരിചിതമായ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: δώδεκα χιλιάδες
  choice: പന്ത്രണ്ടായിരം
  rationale: ഗ്രീക്കിലെ സംഖ്യയും പട്ടികയുടെ സമാന്തരഘടനയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: Ἰωσήφ
  choice: യോസേഫ്
  rationale: മൂലപാഠം ‘യോസേഫ്’ എന്നു തന്നെയാണ് പറയുന്നത്; ബന്ധപ്പെട്ട മറ്റു ഗോത്രപരമ്പരകളെ വ്യാഖ്യാനമായി ചേർക്കുന്നില്ല.
- source_word: Βενιαμίν
  choice: ബെന്യാമീൻ
  rationale: പേരിന്റെ പരിചിതമായ മലയാള ലിപ്യന്തരണം.
- source_word: ἐσφραγισμένοι
  choice: മുദ്രയിടപ്പെട്ടവർ
  rationale: പൂർണകാല നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ നിഷ്ക്രിയതയും മുദ്രയിടലിന്റെ ഫലമായി നിലനിൽക്കുന്ന അവസ്ഥയും ചുരുക്കമായി പ്രകടിപ്പിക്കുന്നു; അവസാന സ്ഥാനത്ത് വെച്ച് പട്ടികയിലെ കൂട്ടങ്ങളെ സംഗ്രഹിക്കുന്നു.
theological_decisions:
- issue: അവസാനത്തെ ἐσφραγισμένοι എന്ന കൃദന്തരൂപത്തിന്റെ ബന്ധവും പ്രാബല്യവും
  choice: മൂന്നു ഗോത്രങ്ങളിൽനിന്നുമുള്ള എണ്ണപ്പെട്ടവരെ ഒന്നാകെ വിശേഷിപ്പിക്കുന്ന സമാപനപ്രയോഗമായി ‘മുദ്രയിടപ്പെട്ടവർ’ എന്നു നൽകി.
  alternative: ‘മുദ്രയിടപ്പെട്ടവരായ’ എന്നോ ‘മുദ്രയിടപ്പെട്ടിരുന്നവർ’ എന്നോ കൂടുതൽ വിശദമായി നൽകാം.
  rationale: ഗ്രീക്ക് പദം പട്ടികയുടെ അവസാനത്തിൽ നിന്ന് എല്ലാ കൂട്ടങ്ങളെയും സംഗ്രഹിക്കുന്നു. അതേ സാഹിത്യപ്രഭാവം നിലനിർത്തുകയും മുദ്രയുടെ സ്വഭാവത്തെക്കുറിച്ച് പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. ആവർത്തിത ഗോത്രസൂത്രവും അവസാനത്തെ സംഗ്രഹകൃദന്തരൂപവും സംരക്ഷിച്ചിരിക്കുന്നു.
