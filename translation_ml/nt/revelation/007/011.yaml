id: REV.7.11
reference: Revelation 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: ml
  text: സകല ദൂതന്മാരും സിംഹാസനത്തിന്റെയും മൂപ്പന്മാരുടെയും നാല് ജീവികളുടെയും[a] ചുറ്റും നിന്നിരുന്നു. അവർ സിംഹാസനത്തിന്റെ മുമ്പിൽ കമിഴ്ന്നുവീണ് ദൈവത്തെ ആരാധിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാല് ജീവസത്തകൾ.’
    reason: ζῷα എന്ന പദത്തിന് വ്യക്തിത്വമുള്ള ജീവിച്ചിരിക്കുന്ന സത്തകൾ എന്ന ആശയം കൂടുതൽ തുറന്നുവയ്ക്കുന്ന സാധ്യമായ പദാന്തരം.
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: സകല ദൂതന്മാരും
  rationale: πάντες എന്ന സമഗ്രതയും ἄγγελοι എന്നതിന്റെ വെളിപ്പാട് പുസ്തകത്തിലെ സാധാരണ അർഥവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἱστήκεισαν
  choice: നിന്നിരുന്നു
  rationale: ഈ രൂപത്തിന്റെ നിലസൂചകവും തുടർച്ചയുള്ളതുമായ ഭാവം ലളിതഭൂതകാലമായ ‘നിന്നു’ എന്നതിനെക്കാൾ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κύκλῳ
  choice: ചുറ്റും
  rationale: ജനിറ്റീവിനോടൊപ്പമുള്ള κύκλῳ സൂചിപ്പിക്കുന്ന വൃത്താകാരമായ ചുറ്റുമുള്ള സ്ഥാനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τοῦ θρόνου
  choice: സിംഹാസനത്തിന്റെ
  rationale: വെളിപ്പാട് പുസ്തകത്തിലെ രാജകീയവും സ്വർഗീയവുമായ ദൃശ്യബിംബം നിലനിർത്തുന്ന സ്ഥിരമായ പദമാണ് ‘സിംഹാസനം’.
- source_word: τῶν πρεσβυτέρων
  choice: മൂപ്പന്മാരുടെ
  rationale: വെളിപ്പാട് പുസ്തകത്തിലെ പ്രത്യേക സ്വർഗീയ സംഘത്തെ സൂചിപ്പിക്കാൻ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: τῶν τεσσάρων ζῴων
  choice: നാല് ജീവികളുടെ
  rationale: ζῷαയെ വെറും മൃഗങ്ങളായി ചുരുക്കാതെയും അവരുടെ സ്വഭാവത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കാതെയും ജീവിച്ചിരിക്കുന്ന സിംഹാസനമുറിയിലെ സത്തകളെ സൂചിപ്പിക്കുന്നു.
- source_word: ἔπεσαν
  choice: കമിഴ്ന്നുവീണ്
  rationale: തുടർന്നുള്ള ‘മുഖത്തിന്മേൽ’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ ഒറ്റ പ്രയോഗത്തിൽ ഉൾപ്പെടുത്തി പൂർണ സാഷ്ടാംഗവീഴ്ച വ്യക്തമാക്കുന്നു.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: സിംഹാസനത്തിന്റെ മുമ്പിൽ
  rationale: ഇവിടെ ἐνώπιον സൂചിപ്പിക്കുന്ന സ്ഥലപരമായ ‘മുമ്പിൽ’ എന്ന അർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: കമിഴ്ന്ന്
  rationale: ‘അവരുടെ മുഖങ്ങളിന്മേൽ’ എന്ന അക്ഷരാർഥത്തെ അസ്വാഭാവികമായി പകർത്താതെ, മുഖം നിലത്താക്കി വീഴുന്ന പൂർണ പ്രണാമഭാവം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: προσεκύνησαν
  choice: ആരാധിച്ചു
  rationale: കർമം ദൈവമായതിനാലും ശരീരപ്രണാമം മുമ്പേ വിവരിക്കപ്പെട്ടതിനാലും ഇവിടെ ഭക്തിപൂർവമായ ആരാധന എന്ന പൂർണ അർഥം യോജിക്കുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തെ
  rationale: προσκυνέωയുടെ നേരിട്ടുള്ള ലക്ഷ്യത്തെ സ്വാഭാവിക മലയാള കർമരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ζῷα എന്ന സ്വർഗീയ സിംഹാസനമുറി സത്തകളുടെ വിവർത്തനം
  choice: ജീവികൾ
  alternative: ജീവസത്തകൾ
  rationale: ‘ജീവികൾ’ എന്നത് അവയെ ‘മൃഗങ്ങൾ’ എന്നു ചുരുക്കുന്നില്ല; അതേസമയം അവയുടെ കൃത്യമായ സ്വഭാവത്തെക്കുറിച്ചുള്ള അധിക ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയലും ഇറക്കുമതി ചെയ്യുന്നില്ല. ‘ജീവസത്തകൾ’ എന്ന പകരം വിവർത്തനം സാധ്യമാണെന്ന് അടിക്കുറിപ്പ് സംരക്ഷിക്കുന്നു.
- issue: ദൈവത്തോടു ബന്ധപ്പെട്ട προσκυνέωയുടെ ശക്തി
  choice: ദൈവത്തെ ആരാധിച്ചു
  alternative: ദൈവത്തിന്റെ മുമ്പിൽ വണങ്ങി
  rationale: വീണ് കമിഴുന്ന ശാരീരിക പ്രവൃത്തി ഇതിനകം പറഞ്ഞിരിക്കുന്നതിനാലും കർമം ദൈവമായതിനാലും, ഇവിടെ ക്രിയയുടെ ഭക്തിപരമായ പൂർണ ശക്തി ‘ആരാധിച്ചു’ എന്നാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ദർശനവിവരണത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ഗ്രീക്കിലെ ദീർഘസംയുക്തവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; സംഭവക്രമവും ബന്ധങ്ങളും മാറ്റിയിട്ടില്ല. ‘കമിഴ്ന്നുവീണ്’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ἔπεσαν ... ἐπὶ τὰ πρόσωπα αὐτῶν എന്ന മുഴുവൻ ആശയവും വഹിക്കുന്നു.
