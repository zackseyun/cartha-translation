id: REV.10.2
reference: Revelation 10:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ χειρὶ αὐτοῦ ⸀βιβλαρίδιον ἠνεῳγμένον. καὶ ἔθηκεν τὸν πόδα αὐτοῦ τὸν δεξιὸν ἐπὶ τῆς θαλάσσης, τὸν δὲ εὐώνυμον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/002.yaml
  text: and having in his hand a little scroll that had been opened[a]. And he placed his right foot on the sea, and his left on the land[b],
translation:
  language: ml
  text: അവന്റെ കയ്യിൽ തുറന്നിരിക്കുന്ന ഒരു ചെറിയ ചുരുൾ[a] ഉണ്ടായിരുന്നു. അവൻ തന്റെ വലങ്കാൽ കടലിന്മേലും ഇടങ്കാൽ കരയിലും[b] വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ചെറിയ പുസ്തകം.’ βιβλαρίδιον എന്ന ഗ്രീക്കുപദം ചെറിയ ചുരുളിനെയോ ചെറുപുസ്തകത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഭൂമിയിൽ.’ γῆ എന്ന ഗ്രീക്കുപദത്തിന് ‘കര’ എന്നും ‘ഭൂമി’ എന്നും അർഥമാകാം; ഇവിടെ കടലിനോടുള്ള വ്യത്യാസം വ്യക്തമാക്കാൻ ‘കര’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων ἐν τῇ χειρὶ αὐτοῦ
  choice: അവന്റെ കൈയിൽ … ഉണ്ടായിരുന്നു
  rationale: വാക്യം 1-ലെ ദൂതനെ വിശേഷിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; കൈ എന്ന ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: βιβλαρίδιον
  choice: ഒരു ചെറിയ ചുരുൾ
  rationale: ലഘുത്വം സൂചിപ്പിക്കുന്ന രൂപവും ദർശനത്തിലെ ചുരുൾചിത്രവും നിലനിർത്തുന്നു; ‘ചെറിയ പുസ്തകം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἠνεῳγμένον
  choice: തുറക്കപ്പെട്ട നിലയിലുള്ള
  rationale: പൂർണ്ണ നിഷ്ക്രിയ കൃദന്തം സൂചിപ്പിക്കുന്ന, മുമ്പ് തുറക്കപ്പെട്ടതും ഇപ്പോഴും തുറന്ന നിലയിൽ തുടരുന്നതുമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἔθηκεν
  choice: വെച്ചു
  rationale: τίθημι ഇവിടെ സൂചിപ്പിക്കുന്ന മനഃപൂർവമായ കാൽവെപ്പിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιὸν
  choice: തന്റെ വലങ്കാൽ
  rationale: ഉടമസ്ഥതയും വലതുകാൽ എന്ന വ്യക്തമായ അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: കടലിന്മേൽ
  rationale: ἐπί സഹിതമുള്ള സ്ഥാനം ദൃശ്യമായി നിലനിർത്തുന്ന സ്വാഭാവിക പരിഭാഷ.
- source_word: τὸν δὲ εὐώνυμον
  choice: ഇടങ്കാൽ
  rationale: സമാന്തര ഘടനയിൽ ഗ്രീക്കിൽ പരോക്ഷമായി ആവർത്തിക്കപ്പെടുന്ന ‘കാൽ’ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചേർക്കുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: കരയിന്മേൽ
  rationale: കടലിനോടുള്ള തത്സമയ സ്ഥലവ്യത്യാസത്തിൽ γῆ എന്നതിന്റെ ‘കര/നിലം’ എന്ന അർഥമാണ് ഏറ്റവും യോജിച്ചത്.
theological_decisions:
- issue: θάλασσα എന്നതിനോടുള്ള വ്യത്യാസത്തിൽ γῆയുടെ പരിഭാഷ
  choice: കര
  alternative: ഭൂമി
  rationale: ദൂതന്റെ ഒരു കാൽ കടലിലും മറ്റേത് ഉണങ്ങിയ കരയിലും എന്ന ദൃശ്യവ്യത്യാസം ‘കര’ കൃത്യമായി നൽകുന്നു; എന്നാൽ ‘ഭൂമി’ എന്ന വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ തുടർച്ചയായ ഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് സൂചകങ്ങളും ഉള്ളടക്കവും പരസ്പരം മാറിപ്പോയതായി തോന്നുന്നതിനാൽ, [a] ചെറിയ ചുരുളിന്റെ പദപര്യായത്തോടും [b] കര/ഭൂമി എന്ന പദപര്യായത്തോടും യുക്തമായി ബന്ധിപ്പിച്ചു.
