  to: അവന്റെ കയ്യിൽ തുറന്നിരിക്കുന്ന ഒരു ചെറിയ ചുരുൾ[a] ഉണ്ടായിരുന്നു. അവൻ തന്റെ വലങ്കാൽ കടലിന്മേലും ഇടങ്കാൽ കരയിലും[b] വെച്ചു.
