id: REV.10.1
reference: Revelation 10:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: ml
  text: ഞാൻ സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുന്ന ശക്തനായ മറ്റൊരു ദൂതനെ[a] കണ്ടു. അവൻ മേഘം ധരിച്ചിരുന്നു; അവന്റെ തലയ്ക്കുമീതെ മഴവില്ല്[b] ഉണ്ടായിരുന്നു. അവന്റെ മുഖം സൂര്യനെപ്പോലെയും കാലുകൾ അഗ്നിത്തൂണുകൾപോലെയും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബലവാനായ മറ്റൊരു ദൂതൻ.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കുപദത്തിന് ‘പ്രകാശവലയം’ എന്ന അർഥവും വരാം; എന്നാൽ ‘മഴവില്ല്’ എന്നതാണ് സാധാരണ അർഥം, വെളിപ്പാടിലെ ദൃശ്യരൂപത്തോടും അതാണ് യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: മറ്റൊരു ദൂതൻ
  rationale: ἄγγελος എന്നതിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാമെങ്കിലും, സ്വർഗത്തിൽനിന്നുള്ള ഇറക്കം ഉൾപ്പെടുന്ന വെളിപ്പാടിലെ ദർശനസന്ദർഭത്തിൽ ‘ദൂതൻ’ എന്നതാണ് സ്വാഭാവികം.
- source_word: ἰσχυρὸν
  choice: ശക്തനായ
  rationale: അസാധാരണ ശക്തിയുള്ളവൻ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ദൂതന്റെ വ്യക്തിത്വത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുന്നതു
  rationale: സ്വർഗത്തിൽനിന്നുള്ള താഴോട്ടുള്ള സജീവ ചലനം വ്യക്തവും ദൃശ്യാത്മകവുമായി നിലനിർത്തുന്നു.
- source_word: περιβεβλημένον νεφέλην
  choice: മേഘം അണിഞ്ഞിരുന്നു
  rationale: περιβάλλω സൂചിപ്പിക്കുന്ന വസ്ത്രം ധരിച്ചതിന്റെയും ചുറ്റിപ്പൊതിഞ്ഞതിന്റെയും രൂപകം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: ἡ ἶρις
  choice: മഴവില്ല്
  rationale: ἶρις എന്ന പദത്തിന്റെ സാധാരണ അർഥം ‘മഴവില്ല്’ ആണ്; വെളിപ്പാട് 4:3-ലെ സമാന ദൃശ്യരൂപത്തോടും ഇത് പൊരുത്തപ്പെടുന്നു.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: അവന്റെ തലയ്ക്കുമീതെ
  rationale: തലയ്ക്ക് മുകളിൽ സ്ഥിതിചെയ്യുന്ന ദൃശ്യരൂപം ἐπί എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥത്തോടെ നൽകുന്നു.
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: അവന്റെ മുഖം സൂര്യനെപ്പോലെയും
  rationale: പ്രകാശമാനമായ മുഖത്തെ സൂര്യനോടു താരതമ്യം ചെയ്യുന്ന മൂലപാഠത്തിന്റെ ഉപമ അതേപടി നിലനിർത്തുന്നു.
- source_word: οἱ πόδες αὐτοῦ
  choice: കാലുകൾ
  rationale: πούς അടിസ്ഥാനമായി പാദത്തെയോ കാലിനെയോ സൂചിപ്പിക്കുന്നു; ഈ ദൃശ്യവിവരണത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ മലയാളപദം ‘കാലുകൾ’ ആണ്.
- source_word: στῦλοι πυρός
  choice: അഗ്നിത്തൂണുകൾ
  rationale: അഗ്നികൊണ്ടുള്ള തൂണുകൾ എന്ന ശക്തമായ ദൃശ്യരൂപം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശക്തനായ ദൂതന്റെ വ്യക്തിത്വം
  choice: ‘ശക്തനായ മറ്റൊരു ദൂതൻ’ എന്നു നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി.
  alternative: സൃഷ്ടിക്കപ്പെട്ട ഒരു ദൂതൻ; അല്ലെങ്കിൽ മശീഹാ/ക്രിസ്തുവിന്റെ പ്രത്യക്ഷീകരണം.
  rationale: ഗ്രീക്കുപാഠം ആ വ്യക്തിയെ ἄλλον ἄγγελον ἰσχυρόν എന്നു മാത്രമാണ് വിശേഷിപ്പിക്കുന്നത്. അതിനാൽ വിവാദമായ വ്യക്തിത്വം പരിഭാഷയിൽ തീർപ്പാക്കാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദർശനത്തിന്റെ സമാന്തര ദൃശ്യഘടകങ്ങൾ അർധവിരാമവും ചെറുവാക്യങ്ങളും ഉപയോഗിച്ച് വ്യക്തമായി ക്രമപ്പെടുത്തി; അപൂർവമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
