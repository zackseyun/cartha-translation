id: REV.10.9
reference: Revelation 10:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: ml
  text: അങ്ങനെ ഞാൻ ദൂതന്റെ അടുക്കൽ ചെന്ന്, ആ ചെറിയ ചുരുൾ[a] എനിക്കു തരാൻ അവനോടു പറഞ്ഞു. അപ്പോൾ അവൻ എന്നോടു പറയുന്നു:[b] “ഇതു എടുത്ത് തിന്നുകളയുക. ഇതു നിന്റെ വയറിനെ കയ്പേറിയതാക്കും[c]; എന്നാൽ നിന്റെ വായിൽ ഇതു തേൻപോലെ മധുരമായിരിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ചെറിയ പുസ്തകം.” ഗ്രീക്കിലെ βιβλαρίδιον ചെറിയ ചുരുളിനെയോ ചെറുപുസ്തകത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവൻ എന്നോടു പറഞ്ഞു.” വിവരണത്തിന് സജീവത നൽകുന്ന ചരിത്രവർത്തമാനകാലമാണ് ഗ്രീക്കിൽ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “നിന്റെ ഉദരത്തെ കയ്പേറിയതാക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: ഞാൻ ദൂതന്റെ അടുക്കൽ ചെന്ന്
  rationale: ദൂതന്റെ അടുത്തേക്കുള്ള യോഹന്നാന്റെ ചലനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പോയി’ എന്നതിലുപരി πρὸς സൂചിപ്പിക്കുന്ന സമീപനം ‘അടുക്കൽ ചെന്ന്’ നിലനിർത്തുന്നു.
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: എനിക്കു തരാൻ അവനോടു പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും അനന്തക്രിയയും ചേർന്ന ഗ്രീക്ക് ഘടനയുടെ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു; ‘അപേക്ഷിച്ചു’ എന്നു പറഞ്ഞ് വിനയഭാവം അധികമായി ചേർക്കുന്നില്ല.
- source_word: βιβλαρίδιον
  choice: ചെറിയ ചുരുൾ
  rationale: ലഘുരൂപത്തിന്റെ ചെറിയതെന്ന സൂചനയും പുരാതന എഴുത്തിന്റെ സാധ്യതയേറിയ ചുരുൾരൂപവും നിലനിർത്തുന്നു; ‘ചെറിയ പുസ്തകം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: λέγει μοι
  choice: അവൻ എന്നോടു പറയുന്നു
  rationale: വിവരണത്തിന് സജീവത നൽകുന്ന ഗ്രീക്ക് ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു; സാധാരണ ഭൂതകാലരൂപം അടിക്കുറിപ്പിൽ ചൂണ്ടിക്കാട്ടുന്നു.
- source_word: Λάβε
  choice: ഇതു വാങ്ങി
  rationale: സന്ദർഭത്തിൽ വസ്തു ഏറ്റുവാങ്ങാനുള്ള കല്പനയാണ്; മലയാളത്തിൽ ‘വാങ്ങുക’ എന്നത് ഇവിടെ പണംകൊടുത്തു വാങ്ങുക എന്നതല്ല, കൈപ്പറ്റുക എന്ന സ്വാഭാവിക അർത്ഥം നൽകുന്നു.
- source_word: κατάφαγε αὐτό
  choice: തിന്നുകളയുക
  rationale: κατεσθίω എന്ന സംയുക്തക്രിയയിലെ പൂർണമായി തിന്നുക എന്ന ശക്തി മലയാളത്തിലെ ‘തിന്നുകളയുക’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അതിനുമപ്പുറം വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: നിന്റെ വയറിനെ കയ്പുള്ളതാക്കും
  rationale: πικραίνω എന്ന കാരണാർഥവും ഭക്ഷണം-ദഹനം എന്ന സാഹചര്യത്തിലെ κοιλίαയുടെ ദേഹപരമായ അർത്ഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: γλυκὺ ὡς μέλι
  choice: തേൻപോലെ മധുരമായിരിക്കും
  rationale: ഉപമ മാറ്റമില്ലാതെ ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ചുരുൾ തിന്നുന്ന പ്രതീകാത്മക പ്രവൃത്തി
  choice: “ഇതു വാങ്ങി തിന്നുകളയുക” എന്ന ദൃശ്യമായ കല്പന അതേപടി നിലനിർത്തി.
  alternative: ദൈവസന്ദേശം ഉള്ളിലാക്കുക എന്ന അർത്ഥം മുഖ്യവാചകത്തിൽ വിശദീകരിക്കുക.
  rationale: വാക്യം പ്രവൃത്തിയുടെ പ്രതീകാർഥം ഇവിടെ തുറന്നുപറയുന്നില്ല. വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ ദൃശ്യവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ചരിത്രവർത്തമാനത്തിന്റെ സജീവതയും ചെറിയ ചുരുൾ, കയ്പ്, തേൻമധുരം എന്നീ പ്രത്യക്ഷ ദൃശ്യങ്ങളും സംരക്ഷിച്ചു; പ്രതീകത്തിന്റെ അർത്ഥം മുഖ്യവാചകത്തിൽ വിശദീകരിച്ചിട്ടില്ല.
