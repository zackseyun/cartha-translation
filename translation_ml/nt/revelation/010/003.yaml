source:
  edition: SBLGNT
  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: ml
  text: അവൻ സിംഹം ഗർജിക്കുന്നതുപോലെ ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ വിളിച്ചു. അവൻ വിളിച്ചപ്പോൾ ഏഴ് ഇടിമുഴക്കങ്ങൾ സ്വന്തം ശബ്ദങ്ങൾ ഉച്ചരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏഴ് ഇടിമുഴക്കങ്ങൾ സ്വന്തം ശബ്ദങ്ങൾ പുറപ്പെടുവിച്ചു.’ ഗ്രീക്ക് പ്രയോഗം ശ്രദ്ധേയമാംവിധം അക്ഷരാർഥസമീപമുള്ളതും ഇടിമുഴക്കങ്ങളെ സംസാരിക്കുന്നവയായി വ്യക്തിവൽക്കരിക്കുന്നതുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: വിളിച്ചു
  rationale: കράζω സൂചിപ്പിക്കുന്ന ശക്തമായ ശബ്ദത്തിലുള്ള വിളി സ്വാഭാവികമായി നൽകുന്നു; ദുഃഖം മാത്രം സൂചിപ്പിക്കാവുന്ന ‘നിലവിളിച്ചു’ ഒഴിവാക്കി.
- source_word: φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ
  rationale: φωνή എന്ന മൂർത്തനാമം നിലനിർത്തിക്കൊണ്ട് ദത്തിവ് രീതിയെയോ ഉപാധിയെയോ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
- source_word: ὥσπερ λέων μυκᾶται
  choice: സിംഹം ഗർജിക്കുന്നതുപോലെ
  rationale: ഉപമയും സിംഹത്തിന്റെ ശക്തമായ മുഴക്കത്തെ സൂചിപ്പിക്കുന്ന μυκᾶται എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപവും നിലനിർത്തുന്നു.
- source_word: ὅτε
  choice: വിളിച്ചപ്പോൾ
  rationale: സംഭവങ്ങളുടെ സമയബന്ധം സംരക്ഷിക്കുന്നു; ‘ശേഷം’ എന്നു ചേർത്ത് ക്രമം അതിയായി നിർണയിക്കുന്നില്ല.
- source_word: αἱ ἑπτὰ βρονταὶ
  choice: ഏഴ് ഇടിമുഴക്കങ്ങൾ
  rationale: ദർശനത്തിലെ നിർദിഷ്ടമായ ഏഴ് ഇടിമുഴക്കങ്ങളെ നേരിട്ട് നൽകുകയും അവയുടെ വ്യക്തിവൽക്കരണം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐλάλησαν
  choice: സംസാരിച്ചു
  rationale: വെറും ശബ്ദമുണ്ടായി എന്നതിലേക്കു ചുരുക്കാതെ λαλέωയുടെ സംസാരിക്കുക എന്ന അർഥവും വ്യക്തിവൽക്കരണവും നിലനിർത്തുന്നു.
- source_word: τὰς ἑαυτῶν φωνάς
  choice: താന്താങ്ങളുടെ ശബ്ദത്തിൽ
  rationale: ἑαυτῶν എന്ന ഊന്നലുള്ള ആത്മവാചകത ‘താന്താങ്ങളുടെ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ശബ്ദത്തിൽ സംസാരിച്ചു’ എന്നു നൽകി.
theological_decisions:
- issue: ഏഴ് ഇടിമുഴക്കങ്ങളുടെ വ്യക്തിവൽക്കരണം
  choice: ‘ഏഴ് ഇടിമുഴക്കങ്ങൾ ... സംസാരിച്ചു’ എന്ന വ്യക്തിവൽക്കരിച്ച രൂപം നിലനിർത്തി.
  alternative: ‘ഏഴ് ഇടിമുഴക്കങ്ങൾ മുഴങ്ങി’
  rationale: ഗ്രീക്ക് പാഠം ഇടിമുഴക്കങ്ങൾക്ക് സംസാരിക്കൽ വ്യക്തമായി ചാർത്തുന്നു; വെറും ശബ്ദപ്രഭാവമായി മാറ്റാതെ വെളിപ്പാട് സാഹിത്യത്തിലെ ദൃശ്യഭാഷ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ഗർജിക്കുന്നു’, ‘ഇടിമുഴക്കങ്ങൾ സംസാരിച്ചു’ എന്നീ രൂപങ്ങൾ വെളിപ്പാട് സാഹിത്യത്തിന്റെ ശക്തമായ ദൃശ്യഭാഷയും ഉദ്ദേശപൂർവമായ വ്യക്തിവൽക്കരണവും നിലനിർത്തുന്നു.
