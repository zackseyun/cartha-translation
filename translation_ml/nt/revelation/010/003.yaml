- from: അവൻ സിംഹം ഗർജിക്കുന്നതുപോലെ ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ വിളിച്ചു. അവൻ വിളിച്ചപ്പോൾ ഏഴ് ഇടിമുഴക്കങ്ങൾ താന്താങ്ങളുടെ ശബ്ദത്തിൽ സംസാരിച്ചു.[a]
  to: അവൻ സിംഹം ഗർജിക്കുന്നതുപോലെ ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ വിളിച്ചു. അവൻ വിളിച്ചപ്പോൾ ഏഴ് ഇടിമുഴക്കങ്ങൾ സ്വന്തം ശബ്ദങ്ങൾ ഉച്ചരിച്ചു.[a]
  rationale: The revision keeps the apocalyptic personification and the Greek’s emphatic “their own voices,” while using idiomatic modern Malayalam. “സ്വന്തം ശബ്ദങ്ങൾ ഉച്ചരിച്ചു” retains a plural object and communicates that the thunders are portrayed as uttering speech, not simply making thunderous sounds.
