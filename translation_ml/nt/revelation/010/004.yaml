id: REV.10.4
reference: Revelation 10:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: ml
  text: 'ഏഴ് ഇടിമുഴക്കങ്ങൾ സംസാരിച്ചപ്പോൾ, ഞാൻ എഴുതാൻ ഒരുങ്ങുകയായിരുന്നു. അപ്പോൾ സ്വർഗത്തിൽനിന്ന് ഒരു ശബ്ദം ഇങ്ങനെ പറയുന്നത് ഞാൻ കേട്ടു: “ഏഴ് ഇടിമുഴക്കങ്ങൾ സംസാരിച്ച കാര്യങ്ങൾ മുദ്രയിടുക; അവ എഴുതരുത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησαν
  choice: സംസാരിച്ചപ്പോൾ / സംസാരിച്ച കാര്യങ്ങൾ
  rationale: λαλέω എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘സംസാരിക്കുക’ നിലനിർത്തുന്നു; ഇടിമുഴക്കങ്ങളെ സംസാരിക്കുന്നവയായി അവതരിപ്പിക്കുന്ന ദർശനാത്മക വ്യക്തിവത്കരണവും സംരക്ഷിക്കുന്നു.
- source_word: αἱ ἑπτὰ βρονταί
  choice: ഏഴ് ഇടിമുഴക്കങ്ങൾ
  rationale: βροντή എന്നതിന്റെ അർഥം ‘ഇടിമുഴക്കം’ ആണ്. മലയാളത്തിൽ ‘ഇടിമുഴക്കങ്ങൾ’ എന്ന ബഹുവചനം സ്വാഭാവികവും മൂലപാഠത്തിലെ ഏഴ് സംസാരിക്കുന്ന ഘടകങ്ങളെ വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്.
- source_word: ἤμελλον γράφειν
  choice: ഞാൻ എഴുതാൻ ഒരുങ്ങുകയായിരുന്നു
  rationale: μέλλω + infinitive സൂചിപ്പിക്കുന്ന തൊട്ടടുത്തു നടക്കാനിരുന്ന പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; യോഹന്നാൻ എഴുതിത്തുടങ്ങുന്നതിന് മുമ്പ് തടയപ്പെട്ടു എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന് ഒരു ശബ്ദം
  rationale: ശബ്ദത്തിന്റെ ഉറവിടം മാത്രം വ്യക്തമാക്കുന്നു; സംസാരിക്കുന്നയാളുടെ വ്യക്തിത്വം മൂലപാഠം പറയുന്നതിലധികം നിർണ്ണയിക്കുന്നില്ല.
- source_word: Σφράγισον
  choice: മുദ്രവെച്ചു സൂക്ഷിക്കുക
  rationale: വെളിപ്പെടുത്താതെ അടച്ചുവെക്കുക എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു. ‘മുദ്രവെക്കുക’ എന്ന ദൃശ്യരൂപവും ‘സൂക്ഷിക്കുക’ എന്ന ലക്ഷ്യവും ചേർന്ന് മലയാളത്തിൽ കല്പന വ്യക്തമാക്കുന്നു.
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: ഏഴ് ഇടിമുഴക്കങ്ങൾ സംസാരിച്ച കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചനമായ ἃ സംസാരത്തിന്റെ ഉള്ളടക്കമായ ‘കാര്യങ്ങൾ’ എന്ന നിലയിൽ തുറന്നുപറയുന്നു; ഇതിലൂടെ തുടർന്നുള്ള αὐτά എന്ന ബഹുവചനത്തിന്റെ സൂചനയും സ്വാഭാവികമായി നിലനിർത്താം.
- source_word: μὴ αὐτὰ γράψῃς
  choice: അവ എഴുതരുത്
  rationale: αὐτά എന്ന മൂലപാഠത്തിലെ ബഹുവചന സർവനാമം ‘അവ’ എന്നു നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; മുൻപുള്ള ‘കാര്യങ്ങൾ’ എന്നതിലേക്കാണ് അത് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: സ്വർഗത്തിൽനിന്നുള്ള ശബ്ദത്തിന്റെ വ്യക്തിത്വം വ്യക്തമാക്കണമോ
  choice: സ്വർഗത്തിൽനിന്ന് ഒരു ശബ്ദം
  alternative: സ്വർഗത്തിൽനിന്നുള്ള ദൈവത്തിന്റെ ശബ്ദം
  rationale: മൂലപാഠം ശബ്ദം ആരുടേതാണെന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവത്തിന്റെ ശബ്ദമാണെന്ന വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കാതെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- issue: ഏഴ് ഇടിമുഴക്കങ്ങളുടെ വാക്കുകളെ ഏകവചന ഉള്ളടക്കമായോ ബഹുവചന കാര്യങ്ങളായോ അവതരിപ്പിക്കണമോ
  choice: സംസാരിച്ച കാര്യങ്ങൾ … അവ
  alternative: സംസാരിച്ചത് … അത്
  rationale: ἃ, αὐτά എന്നിവ രണ്ടും വ്യാകരണപരമായി ബഹുവചനമാണ്. മലയാളത്തിൽ ‘കാര്യങ്ങൾ … അവ’ എന്നത് സ്വാഭാവികമായിരിക്കെ ഈ ബഹുവചന സൂചനയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലപാഠത്തിലെ വ്യക്തിവത്കരണവും ശബ്ദത്തിന്റെ തിരിച്ചറിയാത്ത സ്വഭാവവും ബഹുവചന സൂചനയും നിലനിർത്തിയിരിക്കുന്നു.
