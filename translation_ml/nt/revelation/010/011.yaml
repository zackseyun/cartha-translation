id: REV.10.11
reference: Revelation 10:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: ml
  text: 'അവർ എന്നോടു പറയുന്നു: “നീ വീണ്ടും ജനങ്ങളെയും ജനതകളെയും ഭാഷകളെയും അനേകം രാജാക്കന്മാരെയും കുറിച്ച് പ്രവചിക്കണം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσίν μοι
  choice: അവർ എന്നോട് പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ബഹുവചന കർത്താവിനെ നിലനിർത്തുന്നു; ചരിത്രവർത്തമാനത്തെ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായി അവതരിപ്പിക്കുന്നു.
- source_word: Δεῖ σε
  choice: നീ ... പ്രവചിക്കണം
  rationale: ദൈവികമായോ നിർബന്ധിതമായോ ഉള്ള ആവശ്യകത സൂചിപ്പിക്കുന്ന δεῖയുടെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πάλιν προφητεῦσαι
  choice: വീണ്ടും പ്രവചിക്കണം
  rationale: πάλιν എന്നതിന്റെ ആവർത്തനാർഥവും προφητεύω എന്നതിന്റെ പ്രവചനപ്രവർത്തനവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ
  choice: കുറിച്ച്
  rationale: ഇവിടെ പ്രവചനത്തിന്റെ വിഷയമോ സംബന്ധമോ സൂചിപ്പിക്കുന്ന വിശാലമായ അർഥം നൽകുന്നു; ‘എതിരായി’ എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς
  choice: അനേകം ജനങ്ങളെയും ജനതകളെയും ഭാഷകളെയും രാജാക്കന്മാരെയും
  rationale: നാലംഗ പട്ടികയും πολλοῖς എന്ന വിശേഷണത്തിന്റെ വ്യാപ്തിയും നിലനിർത്തുന്നു; λαοί, ἔθνη എന്നിവയുടെ വ്യത്യാസം ‘ജനങ്ങൾ’, ‘ജനതകൾ’ എന്നിങ്ങനെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ἐπὶ എന്ന പദത്തിന്റെ ബന്ധാർഥം
  choice: കുറിച്ച്
  alternative: എതിരായി / മുമ്പാകെ
  rationale: സന്ദർഭത്തിൽ പ്രവചനത്തിന്റെ ലക്ഷ്യവിഷയത്തെ സൂചിപ്പിക്കുന്ന ‘കുറിച്ച്’ എന്നത് യുക്തമാണ്; വിധിപ്രഖ്യാപനം മാത്രമായി അർഥം പരിമിതപ്പെടുത്താതെ ഗ്രീക്കിലെ സാധ്യതയുള്ള വിശാലത സംരക്ഷിക്കുന്നു.
- issue: δεῖയിലെ നിർബന്ധത്തിന്റെ ഉറവിടം
  choice: പ്രവചിക്കണം
  alternative: പ്രവചിക്കേണ്ടതുണ്ട്
  rationale: ദൈവിക അനിവാര്യതയെന്ന വ്യാഖ്യാനം വാചകത്തിൽ പ്രത്യേകം ചേർക്കാതെ ആവശ്യകതയുടെ ശക്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘ജനങ്ങൾ/ജനതകൾ’ എന്ന ജോഡി മൂലത്തിലെ λαοί/ἔθνη വ്യത്യാസം സാധ്യമായത്ര നിലനിർത്തുന്നു. ഉദ്ധരണിക്കുള്ളിൽ വ്യക്തവും നേരിട്ടുമുള്ള കല്പനാഭാവം ഉപയോഗിച്ചു.
