revisions:
- from: 'അവർ എന്നോട് പറഞ്ഞു: “നീ അനേകം ജനങ്ങളെയും ജനതകളെയും ഭാഷകളെയും രാജാക്കന്മാരെയും കുറിച്ച് വീണ്ടും പ്രവചിക്കണം.”'
  to: 'അവർ എന്നോടു പറയുന്നു: “നീ വീണ്ടും ജനങ്ങളെയും ജനതകളെയും ഭാഷകളെയും അനേകം രാജാക്കന്മാരെയും കുറിച്ച് പ്രവചിക്കണം.”'
  rationale: The revision retains the Greek present tense, preserves the required future prophetic task and the broad ‘concerning’ relation, and places ‘അനേകം’ directly before ‘രാജാക്കന്മാരെയും’ to reflect its grammatical attachment to ‘kings’ alone.
  reviewer_model: gpt-5.6-terra
