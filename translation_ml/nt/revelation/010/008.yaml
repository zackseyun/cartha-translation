id: REV.10.8
reference: Revelation 10:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: ml
  text: 'സ്വർഗത്തിൽനിന്ന് ഞാൻ കേട്ട ശബ്ദം വീണ്ടും എന്നോടു സംസാരിച്ച് ഇങ്ങനെ പറഞ്ഞു: “പോയി, കടലിന്മേലും കരയിന്മേലും നിൽക്കുന്ന ദൂതന്റെ കൈയിൽ തുറന്നിരിക്കുന്ന ചുരുൾ[a] എടുക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചെറിയ ചുരുൾ’ എന്നും വിവർത്തനം ചെയ്യാം; എന്നാൽ ഈ വാക്യത്തിൽ βιβλίον (‘ചുരുൾ’) ആണ്, സമീപവാക്യങ്ങളിലുള്ള ലഘുത്വസൂചക രൂപമല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ
  choice: ശബ്ദം
  rationale: ഇവിടെ സംസാരിക്കുന്ന സ്വർഗീയ ശബ്ദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ശബ്ദം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: സ്വർഗീയ ശബ്ദം യോഹന്നാനോട് മറ്റൊരിക്കൽ സംസാരിക്കുന്ന ആവർത്തനം കൃത്യമായി അറിയിക്കുന്നു.
- source_word: λαλοῦσαν μετ’ ἐμοῦ καὶ λέγουσαν
  choice: എന്നോടു സംസാരിച്ചു പറഞ്ഞു
  rationale: μετάയോടുകൂടിയ പ്രയോഗത്തിന്റെ ബന്ധാത്മക ഭാവവും λέγουσαν എന്നതിന്റെ ഉദ്ധരണിയിലേക്കുള്ള പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: Ὕπαγε λάβε
  choice: പോയി ... എടുക്കുക
  rationale: തുടർച്ചയായ രണ്ട് ആജ്ഞകളെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: βιβλίον
  choice: ചുരുൾ
  rationale: പുരാതന സാഹിത്യസാഹചര്യത്തിൽ പുസ്തകത്തേക്കാൾ ചുരുൾ എന്ന അർഥം യോജിക്കുന്നു; ഈ വാക്യത്തിലെ രൂപം ലഘുത്വസൂചകമല്ലാത്തതിനാൽ ‘ചെറിയ ചുരുൾ’ എന്ന് ചേർത്തിട്ടില്ല.
- source_word: ἠνεῳγμένον
  choice: തുറന്നിരിക്കുന്ന
  rationale: മുമ്പ് തുറക്കപ്പെട്ടതിന്റെ ഫലമായി ഇപ്പോഴും തുറന്ന നിലയിലാണെന്ന perfect participle-ന്റെ ഭാവം സൂക്ഷിക്കുന്നു.
- source_word: ἐν τῇ χειρὶ
  choice: കൈയിൽ
  rationale: ചുരുളിന്റെ സ്ഥാനം നേരിട്ട് വ്യക്തമാക്കുന്ന ἐν എന്ന പൂർവപ്രത്യയത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἄγγελος
  choice: ദൂതൻ
  rationale: വെളിപ്പാടിന്റെ ദർശനസാഹചര്യത്തിൽ ഇത് സ്വർഗീയ ദൂതനെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്.
- source_word: ἑστῶτος
  choice: നിൽക്കുന്ന
  rationale: തുടരുന്ന നില്പിന്റെ അവസ്ഥ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: കടലിന്മേലും കരയിന്മേലും
  rationale: ദൂതന്റെ നില്പിനെക്കുറിച്ചുള്ള കടൽ–കര സ്ഥലവൈരുധ്യം വ്യക്തമാക്കുകയും ആവർത്തിച്ച ἐπίയുടെ ഘടന പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അപ്പോക്കലിപ്റ്റിക് ദൃശ്യത്തിലെ γῆയുടെ വിവർത്തനം
  choice: കര
  alternative: ഭൂമി
  rationale: കടലിന് എതിരായ ദൂതന്റെ ഭൗതിക നില്പിടമാണ് ഉടൻ കാണുന്ന ദൃശ്യം; അതിനാൽ ‘കര’ കൂടുതൽ കൃത്യമാണ്, അനാവശ്യമായ പ്രപഞ്ചശാസ്ത്ര നിഗമനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: ചുറ്റുപാടിലെ ലഘുത്വസൂചക രൂപങ്ങളോടുള്ള ബന്ധത്തിൽ βιβλίον
  choice: ചുരുൾ
  alternative: ചെറിയ ചുരുൾ; പുസ്തകം
  rationale: ഈ വാക്യത്തിൽ ലഘുത്വസൂചകമല്ലാത്ത βιβλίον ആണ് ഉള്ളത്. അതിനാൽ സമീപവാക്യങ്ങളിലെ ‘ചെറിയ ചുരുൾ’ എന്ന ആശയം ഈ വാക്യത്തിലേക്ക് സമന്വയിപ്പിക്കാതെ മൂലരൂപം മാനിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ദീർഘവാക്യഘടന വായനാസൗകര്യത്തോടെ നിലനിർത്തി; വിവരണാത്മക present-state ഭാവത്തിന് ‘തുറന്നിരിക്കുന്ന’, ‘നിൽക്കുന്ന’ എന്നിവ ഉപയോഗിച്ചു.
