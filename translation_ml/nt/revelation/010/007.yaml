id: REV.10.7
reference: Revelation 10:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own servants, the prophets.
translation:
  language: ml
  text: എന്നാൽ ഏഴാമത്തെ ദൂതന്റെ ശബ്ദത്തിന്റെ നാളുകളിൽ, അവൻ കാഹളം മുഴക്കാനിരിക്കുമ്പോൾ, ദൈവം തന്റെ സ്വന്തം അടിമകളായ[a] പ്രവാചകന്മാരോടു സുവാർത്ത അറിയിച്ചതുപോലെ, ദൈവത്തിന്റെ രഹസ്യം പൂർത്തിയാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദാസന്മാരായ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് ‘ദാസന്മാർ’ എന്നും ‘അടിമകൾ’ എന്നും അർഥമാകാം; ഈ സന്ദർഭത്തിൽ അവർ ദൈവത്തിന്റേതാണെന്ന ബന്ധത്തിന് ഊന്നലുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ കാലതാമസവുമായി ഇതിനെ ബന്ധിപ്പിക്കുന്ന വിരുദ്ധാർഥക സംയോജകം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: ഏഴാമത്തെ ദൂതന്റെ ശബ്ദം കേൾക്കുന്ന നാളുകളിൽ
  rationale: φωνήയുടെ ‘ശബ്ദം’ എന്ന അർഥം നിലനിർത്തുകയും, ഗ്രീക്ക് നാമപദബന്ധം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു; ഇതിനെ നേരത്തേ തന്നെ ‘കാഹളനാദം’ എന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: അവൻ കാഹളം മുഴക്കാനിരിക്കുമ്പോൾ
  rationale: μέλλῃയുടെ ആസന്നതയും σαλπίζειν സൂചിപ്പിക്കുന്ന കാഹളം മുഴക്കലും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ ἐτελέσθη
  choice: പൂർത്തിയാകും
  rationale: രൂപത്തിൽ ഭൂതകാലമായ അഒറിസ്റ്റ് ആണെങ്കിലും, ഭാവിമുഖമായ ὅταν μέλλῃ എന്ന സമയവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ സംഭവത്തിന്റെ ഉറപ്പുള്ള ഭാവിപൂർത്തീകരണം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മർമം
  rationale: μυστήριον എന്ന പ്രധാന ദൈവശാസ്ത്രപദത്തിന്റെ മറഞ്ഞതും ദൈവം വെളിപ്പെടുത്തുന്നതുമായ സ്വഭാവം നിലനിർത്തുന്നു; അതിനെ ഒരു പ്രത്യേക പദ്ധതിയായി വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ὡς εὐηγγέλισεν
  choice: സുവാർത്തയായി അറിയിച്ചതുപോലെ
  rationale: εὐαγγελίζωയിലെ ‘സുവാർത്ത അറിയിക്കുക’ എന്ന ആശയം ക്രിയാരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: തന്റെ സ്വന്തം അടിമകളായ
  rationale: ἑαυτοῦ ഊന്നിപ്പറയുന്ന ദൈവത്തിനുള്ള സ്വന്തബന്ധവും δοῦλος സൂചിപ്പിക്കുന്ന ബന്ധിത സേവനവും നിലനിർത്തുന്നു; മലയാളത്തിൽ പതിവായ ‘ദാസന്മാർ’ എന്ന പകരം വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοὺς προφήτας
  choice: പ്രവാചകന്മാരോടു
  rationale: ദൈവത്തിന്റെ അടിമകൾ ആരെന്നു വ്യക്തമാക്കുന്ന സമാനാധികരണപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ പ്രവാചകന്മാരെ സൂചിപ്പിക്കുന്ന δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ
  rationale: ἑαυτοῦ എന്ന പദം ഉടമസ്ഥബന്ധത്തിന് ഊന്നൽ നൽകുന്നതിനാൽ ‘അടിമകൾ’ മൂലപദത്തിന്റെ ശക്തി കൂടുതൽ നേരിട്ട് സൂക്ഷിക്കുന്നു; ‘ദാസന്മാർ’ സ്വാഭാവികവും പരമ്പരാഗതവുമായ പകരമാണ്.
- issue: ἐτελέσθη എന്ന അഒറിസ്റ്റിന്റെ കാലബലം
  choice: പൂർത്തിയാകും
  alternative: പൂർത്തിയായി / പൂർത്തിയാക്കപ്പെട്ടു
  rationale: ഭാവിയിൽ ഏഴാമത്തെ ദൂതൻ കാഹളം മുഴക്കാനിരിക്കുന്ന സമയത്തെക്കുറിച്ചുള്ള വാക്യത്തിൽ അഒറിസ്റ്റ് സംഭവത്തിന്റെ ഉറപ്പിനെ മുൻകൂട്ടി പൂർത്തിയായതുപോലെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ഭാവികാലം സന്ദർഭത്തിലെ സമയബന്ധം വ്യക്തമായി നൽകുന്നു; പ്രത്യേക അന്ത്യകാലക്രമം ഇതിൽ ചുമത്തുന്നില്ല.
- issue: μυστήριον എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: മർമം
  alternative: രഹസ്യം / രഹസ്യപദ്ധതി
  rationale: ‘മർമം’ ദൈവത്തിൽ മറഞ്ഞിരുന്ന് വെളിപ്പെടുത്തപ്പെടുന്ന യാഥാർഥ്യത്തെ സൂചിപ്പിക്കുമ്പോൾ, അതിനെ വെറും അജ്ഞേയരഹസ്യമോ നിർദിഷ്ടമായ ഒരു പദ്ധതിയോ ആയി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള വെളിപ്പാട്-ശൈലി നിലനിർത്തി. ‘ശബ്ദം കേൾക്കുന്ന നാളുകളിൽ’ എന്ന രൂപം ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അസാധാരണത സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ വായനാസൗകര്യം നൽകുന്നു. ‘മർമം’ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി തുറന്നുവെക്കുന്നു.
