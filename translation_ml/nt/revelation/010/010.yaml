id: REV.10.10
reference: Revelation 10:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: ml
  text: ഞാൻ ദൂതന്റെ കൈയിൽനിന്ന് ആ ചെറുചുരുൾ[a] വാങ്ങി തിന്നു. അത് എന്റെ വായിൽ തേൻപോലെ മധുരമായിരുന്നു; പിന്നെ ഞാൻ അതു തിന്നുകഴിഞ്ഞപ്പോൾ എന്റെ വയറ് കയ്പേറിയതായി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ചെറുപുസ്തകം.” ചെറിയൊരു ലിഖിതരേഖയെ സൂചിപ്പിക്കുന്ന ലഘുരൂപമാണ് ഗ്രീക്കിലുള്ളത്; പുരാതനകാലത്തെ സാധ്യതയുള്ള രൂപത്തിന് “ചെറുചുരുൾ” കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “എന്റെ ഉദരം കയ്പേറിയതായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: ചെറുചുരുൾ
  rationale: ചെറിയൊരു ലിഖിതരേഖയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ലഘുരൂപവും പുരാതന ചുരുളിന്റെ രൂപവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: ദൂതന്റെ കൈയിൽനിന്ന്
  rationale: ദൂതനിൽനിന്ന് നേരിട്ട് ചുരുൾ സ്വീകരിക്കുന്ന ദൃശ്യബിംബം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: κατέφαγον
  choice: തിന്നു
  rationale: പ്രതീകാത്മക പ്രവൃത്തിയെ അമിതമായി ശക്തിപ്പെടുത്താതെ, സന്ദർഭത്തിൽ സ്വാഭാവികവും നേരിട്ടുമുള്ള പദപ്രയോഗമാണ്.
- source_word: ὡς μέλι γλυκύ
  choice: തേൻപോലെ മധുരമായിരുന്നു
  rationale: ὡς എന്ന ഉപമയും മധുരത്തിന്റെ അനുഭവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅτε ἔφαγον αὐτό
  choice: ഞാൻ അതു തിന്നുകഴിഞ്ഞപ്പോൾ
  rationale: തിന്നതിനെത്തുടർന്നാണ് കയ്പ് അനുഭവപ്പെട്ടതെന്ന ആഖ്യാനക്രമം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπικράνθη
  choice: കയ്പേറിയതായി
  rationale: ഗ്രീക്കിലെ മാറ്റം സംഭവിക്കുന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കൃത്രിമമായ കാരണകർമപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: κοιλία
  choice: വയറ്
  rationale: ശരീരത്തിന്റെ ഉള്ളഭാഗത്തെയോ വയറിനെയോ സൂചിപ്പിക്കുന്ന ഇവിടെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളപദമാണ്.
theological_decisions:
- issue: ചുരുൾ തിന്നുന്ന പ്രതീകാത്മക പ്രവൃത്തി
  choice: പ്രതീകത്തെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ ദൃശ്യരൂപം നേരിട്ട് വിവർത്തനം ചെയ്യുക.
  alternative: മധുരത്തെയും കയ്പിനെയും സന്തോഷം, ന്യായവിധി തുടങ്ങിയ ആശയങ്ങളായി വിവർത്തനത്തിൽത്തന്നെ വിശദീകരിക്കുക.
  rationale: ഈ വാക്യം പ്രതീകത്തിന്റെ അർഥം മുഴുവനായി വിശദീകരിക്കുന്നില്ല; അതിനാൽ അതിലെ മധുരവും കയ്പും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ἐπικράνθη എന്ന ക്രിയയുടെ ഭാവം
  choice: വയറ് കയ്പേറിയതായി
  alternative: എന്റെ വയറ് കയ്പുള്ളതാക്കപ്പെട്ടു
  rationale: ഗ്രീക്ക് രൂപം വ്യാകരണപരമായി അഓറിസ്റ്റ് പാസീവായിരിക്കാമെങ്കിലും ഇവിടെ അവസ്ഥാമാറ്റമാണ് സ്വാഭാവികമായ അർഥം. മലയാളത്തിലെ കർശന കർമണി രൂപം പുറത്തുനിന്നുള്ള ഒരു കാരണകർത്താവിനെ അനാവശ്യമായി സൂചിപ്പിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ചെറുചുരുൾ’ പുരാതന ലിഖിതരൂപം വ്യക്തമാക്കുന്നു; ‘വയറ്’ സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന ശരീരസൂചകപദമാണ്. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
