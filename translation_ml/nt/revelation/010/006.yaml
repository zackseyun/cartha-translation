id: REV.10.6
reference: Revelation 10:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: ml
  text: 'എന്നെന്നേക്കും ജീവിക്കുന്നവനായ, ആകാശവും അതിലുള്ളവയും ഭൂമിയും അതിലുള്ളവയും കടലും അതിലുള്ളവയും സൃഷ്ടിച്ചവനെച്ചൊല്ലി അവൻ സത്യം ചെയ്തു: ഇനി ഒട്ടും താമസമുണ്ടാകുകയില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഇനി കാലം ഉണ്ടാകുകയില്ല.” ഇവിടെ χρόνος എന്ന പദം സന്ദർഭത്തിൽ “താമസം” എന്നാണ് മനസ്സിലാക്കുന്നത്—ദൈവത്തിന്റെ അന്തിമപ്രവർത്തനത്തിനു മുമ്പുള്ള കാത്തിരിപ്പുകാലം അവസാനിച്ചിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: സത്യം ചെയ്തു
  rationale: ὀμνύω എന്ന ക്രിയയുടെ സത്യപ്രതിജ്ഞ ചെയ്യുക എന്ന അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും ജീവിക്കുന്നവനെച്ചൊല്ലി
  rationale: ദത്തിവ് രൂപം സത്യം ആരെച്ചൊല്ലിയാണ് ചെയ്യുന്നതെന്ന് സൂചിപ്പിക്കുന്നു; εἰς τοὺς αἰῶνας τῶν αἰώνων എന്ന അനന്തകാലപ്രയോഗത്തിന്റെ ശക്തി ‘എന്നെന്നേക്കും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔκτισεν
  choice: സൃഷ്ടിച്ച
  rationale: പ്രപഞ്ചസൃഷ്ടിയുടെ സന്ദർഭത്തിൽ κτίζω എന്നതിന്റെ കൃത്യമായ ദൈവിക സ്രഷ്ടൃഭാഷ നിലനിർത്തുന്നു.
- source_word: τὸν οὐρανὸν
  choice: ആകാശം
  rationale: ആകാശം–ഭൂമി–കടൽ എന്ന സൃഷ്ടിത്രയത്തിൽ οὐρανός സൂചിപ്പിക്കുന്ന മുകളിലെ പ്രപഞ്ചമണ്ഡലത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളപദം.
- source_word: τὰ ἐν αὐτῷ / τὰ ἐν αὐτῇ
  choice: അതിലുള്ളവ
  rationale: മൂന്ന് മേഖലകളുടെയും ഉള്ളടക്കം ആവർത്തിച്ചു പറയുന്ന ഗ്രീക്ക് ഘടന സംക്ഷിപ്തമായും സമാന്തരമായും നിലനിർത്തുന്നു.
- source_word: γῆν
  choice: ഭൂമി
  rationale: പ്രപഞ്ചസൃഷ്ടിയുടെ ത്രയത്തിൽ γῆ ഒരു പ്രാദേശിക ദേശമല്ല, ഭൂമിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: θάλασσαν
  choice: കടൽ
  rationale: θάλασσα എന്ന ഏകവചനത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളസമം.
- source_word: ὅτι
  choice: — എന്ന് സൂചിപ്പിക്കുന്ന ദ്വിബിന്ദുവിലൂടെ സത്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു
  rationale: സത്യം ചെയ്തതിന്റെ ഉള്ളടക്കം തുടർന്നുവരുന്നതായി മലയാളവാക്യഘടനയിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു; കാരണാർഥം സ്വീകരിക്കുന്നില്ല.
- source_word: χρόνος οὐκέτι ἔσται
  choice: ഇനി ഒട്ടും താമസമുണ്ടാകുകയില്ല
  rationale: അടുത്ത വാക്യത്തിലെ ദൈവത്തിന്റെ രഹസ്യം പൂർത്തിയാകുന്ന സന്ദർഭത്തിൽ χρόνος കാലത്തിന്റെ സമ്പൂർണ അസ്തിത്വനാശത്തേക്കാൾ ഇനി കാത്തിരിപ്പോ വൈകലോ ഇല്ല എന്ന അർഥത്തിലാണ്. ‘ഒട്ടും’ οὐκέτιയുടെ നിർണായകശക്തി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: χρόνος എന്നതിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ അന്തിമപ്രവർത്തനത്തിനു മുമ്പുള്ള താമസം ഇനി ഉണ്ടാകില്ല
  alternative: ‘ഇനി കാലം ഉണ്ടാകുകയില്ല’
  rationale: 10:7-ലെ ഉടൻ പൂർത്തിയാകൽ സന്ദർഭം ‘താമസം’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ ഗ്രീക്കിന്റെ കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത യഥാർത്ഥമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു; കാലക്രമം തന്നെ അവസാനിക്കുന്നു എന്ന സിദ്ധാന്തം മുഖ്യവാചകത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സൃഷ്ടിപ്പട്ടികയിലെ ആകാശം–ഭൂമി–കടൽ എന്ന ത്രിഭാഗ സമാന്തരഘടന നിലനിർത്തി. ദീർഘമായ ഗ്രീക്ക് വാക്യം മലയാളത്തിൽ ഗ്രഹിക്കാൻ എളുപ്പമാക്കാൻ സത്യത്തിന്റെ ഉള്ളടക്കത്തിനു മുമ്പ് ദ്വിബിന്ദു ഉപയോഗിച്ചു.
