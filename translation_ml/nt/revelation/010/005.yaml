id: REV.10.5
reference: Revelation 10:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: ml
  text: ഞാൻ കടലിന്മേലും ഭൂമിമേലും[a] നിൽക്കുന്നതായി കണ്ട ദൂതൻ തന്റെ വലതുകൈ സ്വർഗത്തിലേക്ക്[b] ഉയർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കര.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സ്വർഗത്തോടു നേരെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: ദൂതൻ
  rationale: വെളിപ്പാട് പുസ്തകത്തിലെ സന്ദർഭത്തിൽ സ്വർഗീയ സത്തയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘സന്ദേശവാഹകൻ’ എന്നതിനെക്കാൾ ‘ദൂതൻ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἑστῶτα
  choice: നിൽക്കുന്നതായി
  rationale: ἵστημι എന്ന ക്രിയയുടെ perfect participle ഇവിടെ ദൂതന്റെ നിലവിലുള്ള നിലയെയോ ഭാവത്തെയോ വിവരിക്കുന്നു; ‘നിൽക്കുന്നതായി’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: കടലിന്മേൽ
  rationale: ἐπί + genitive നൽകുന്ന ‘മേൽ’ എന്ന സ്ഥലബന്ധവും ദർശനത്തിലെ ശക്തമായ ദൃശ്യരൂപവും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: കരയിന്മേൽ
  rationale: കടലിനോടുള്ള തൽക്ഷണ സ്ഥലവൈരുധ്യം കണക്കിലെടുത്ത് γῆയ്ക്ക് ‘കര’ യോജിക്കുന്നു; ‘ഭൂമി’ എന്ന സത്യസന്ധമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἦρεν
  choice: ഉയർത്തി
  rationale: αἴρω ഇവിടെ സത്യപ്രതിജ്ഞയുമായി ബന്ധപ്പെട്ട കൈ ഉയർത്തുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ഉയർത്തി’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: തന്റെ വലതുകൈ
  rationale: മൂലപാഠം കൈയെയും അത് വലതുകൈയാണെന്നതിനെയും വ്യക്തമായി പറയുന്നു; മലയാളത്തിൽ ഇത് സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὸν οὐρανόν
  choice: ആകാശത്തേക്ക്
  rationale: εἰς ഇവിടെ ദിശ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ആകാശം’ ദൃശ്യമായ മേലോട്ടുള്ള ദിശയും സ്വർഗീയ മേഖലയുമായുള്ള ബന്ധവും സന്ദർഭത്തിൽ വഹിക്കാം; ‘ആകാശത്തോടു നേരെ’ എന്ന ദിശാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: കടലിനോടു വൈരുധ്യത്തിൽ γῆ വിവർത്തനം ചെയ്യുന്നത്
  choice: കര
  alternative: ഭൂമി
  rationale: ദൂതൻ കടലും കരയും എന്ന രണ്ടു മേഖലകളിന്മേൽ നിൽക്കുന്ന ദൃശ്യവൈരുധ്യം ‘കര’ വ്യക്തമായി സംരക്ഷിക്കുന്നു; γῆയുടെ വിശാലമായ ‘ഭൂമി’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: οὐρανός വിവർത്തനം ചെയ്യുന്നത്
  choice: ആകാശം
  alternative: സ്വർഗം
  rationale: ഈ വാക്യത്തിൽ കൈ ഉയർത്തുന്ന ദിശയാണ് നേരിട്ട് പറയുന്നത്; അടുത്ത വാക്യത്തിലെ സത്യപ്രതിജ്ഞ ദൈവിക പശ്ചാത്തലം നൽകുന്നു. ‘ആകാശം’ ദൃശ്യദിശയെ സ്വാഭാവികമായി നൽകുമ്പോഴും ‘സ്വർഗം’ എന്ന ദൈവശാസ്ത്രപരമായ സാധ്യതയെ നിർബന്ധമായി അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. കടൽ–കര എന്ന ദൃശ്യവൈരുധ്യവും സത്യപ്രതിജ്ഞയ്ക്കു മുന്നോടിയായ കൈ ഉയർത്തുന്ന ഭാവവും സംരക്ഷിച്ചിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
