id: REV.4.6
reference: Revelation 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: ml
  text: സിംഹാസനത്തിന്റെ മുമ്പിൽ, സ്ഫടികത്തോടു സാദൃശ്യമുള്ള ഒരു ഗ്ലാസ് കടലിനോടു സാദൃശ്യമുള്ളത് ഉണ്ടായിരുന്നു.[a] സിംഹാസനത്തിന്റെ നടുവിലും സിംഹാസനത്തിനു ചുറ്റുമായി[b] നാല് ജീവികൾ[c] ഉണ്ടായിരുന്നു; അവയുടെ മുമ്പിലും പിമ്പിലും കണ്ണുകൾ നിറഞ്ഞിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഗ്ലാസ് കടൽപോലെയുള്ളത്.” ഗ്രീക്കിൽ ഇത് നേരിട്ടുള്ള തിരിച്ചറിയലല്ല, ഒരു താരതമ്യമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “സിംഹാസനത്തിന്റെ നടുവിലും സിംഹാസനത്തിനു ചുറ്റുമായി” എന്ന സ്ഥലവിവരണം ഗ്രീക്കിലും ദുഷ്കരമാണ്; ദർശനത്തിലെ കാഴ്ചപ്പാട് വ്യാഖ്യാനിച്ച് തീർക്കാതെ ഇവിടെ മൂലപാഠത്തോട് ചേർന്ന് നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, “നാല് ജീവസത്തകൾ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം വെളിപ്പാടിൽ പിന്നീട് കാണുന്ന ശത്രുതാപരമായ “മൃഗങ്ങളെ” സൂചിപ്പിക്കുന്ന പദമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνώπιον
  choice: മുമ്പിൽ
  rationale: സിംഹാസനത്തോടുള്ള സ്ഥലപരമായ ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὡς θάλασσα ὑαλίνη
  choice: ഒരു കണ്ണാടിക്കടൽപോലെയുള്ളത്
  rationale: ὡς സൂചിപ്പിക്കുന്ന ദർശനാത്മക ഉപമ നിലനിർത്തുന്നു; ὑαλίνη എന്നത് ഗ്ലാസ്/കണ്ണാടി പോലുള്ള സുതാര്യവും തിളക്കമുള്ളതുമായ രൂപം സൂചിപ്പിക്കുന്നു.
- source_word: ὁμοία κρυστάλλῳ
  choice: സ്ഫടികംപോലെ തിളങ്ങുന്ന
  rationale: സ്ഫടികത്തോടുള്ള രണ്ടാമത്തെ താരതമ്യം നിലനിർത്തുകയും ദൃശ്യത്തിന്റെ തെളിമയും തിളക്കവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: സിംഹാസനത്തിന്റെ നടുവിലും സിംഹാസനത്തിനു ചുറ്റുമായി
  rationale: ദുഷ്കരമായ സ്ഥലവിവരണം വ്യാഖ്യാനിച്ച് ലളിതമാക്കാതെ ഗ്രീക്കിന്റെ ഇരട്ട സ്ഥാനവിവരണം നിലനിർത്തുന്നു.
- source_word: ζῷα
  choice: ജീവികൾ
  rationale: ജീവനുള്ള സത്തകളെ സൂചിപ്പിക്കുന്ന നിഷ്പക്ഷ പദം; പിന്നീടുള്ള വെളിപ്പാടിലെ ശത്രുതാപരമായ ‘മൃഗം’ എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: γέμοντα ὀφθαλμῶν
  choice: കണ്ണുകൾ നിറഞ്ഞിരുന്നു
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൃശ്യതയും അതിശയകരമായ ഭാവവും ലളിതവും മാന്യവുമായ മലയാളത്തിൽ കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: മുമ്പിലും പിമ്പിലും
  rationale: ജീവികളുടെ മുൻ-പിൻ ഭാഗങ്ങളിലുള്ള കണ്ണുകളെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ദ്വന്ദ്വപ്രയോഗം.
theological_decisions:
- issue: സ്വർഗീയ സിംഹാസനദർശനത്തിലെ ζῷα എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ജീവികൾ
  alternative: ജീവസത്തകൾ; മൃഗങ്ങൾ
  rationale: യെഹെസ്കേലിന്റെ സിംഹാസനദർശനവുമായി ബന്ധമുള്ള ജീവനുള്ള സ്വർഗീയ സത്തകളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘മൃഗങ്ങൾ’ എന്നു പറഞ്ഞാൽ വെളിപ്പാടിന്റെ പിന്നീടുള്ള ശത്രുതാപരമായ മൃഗങ്ങളുമായി തെറ്റിദ്ധരിക്കാം.
- issue: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου എന്ന സ്ഥലപരമായ പിരിമുറുക്ക്
  choice: സിംഹാസനത്തിന്റെ നടുവിലും സിംഹാസനത്തിനു ചുറ്റുമായി
  alternative: സിംഹാസനത്തിനു ചുറ്റും; സിംഹാസനത്തിന്റെ മധ്യത്തിനു ചുറ്റും
  rationale: ദർശനത്തിലെ സ്ഥലവിവരണം സ്വാഭാവിക ഭൂമിതീയ ക്രമത്തിലേക്ക് നിർബന്ധിച്ച് ഒതുക്കാതെ മൂലപാഠത്തിലെ അസാധാരണതയും അവ്യക്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ദർശനത്തിന്റെ അപൂർവ ദൃശ്യഭാഷയും സ്ഥലപരമായ അവ്യക്തതയും നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യ സഭാപാരമ്പര്യ പദങ്ങൾ ഒഴിവാക്കി.
