id: REV.4.9
reference: Revelation 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: ml
  text: ജീവികൾ സിംഹാസനത്തിൽ ഇരിക്കുന്നവന്—എന്നെന്നേക്കും[a] ജീവിക്കുന്നവന്—മഹത്ത്വവും ബഹുമാനവും നന്ദിയും നൽകുമ്പോഴെല്ലാം,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യുഗങ്ങളുടെ യുഗങ്ങളോളം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: എപ്പോഴെല്ലാം / നൽകുമ്പോഴെല്ലാം
  rationale: ὅταν ഇവിടെ ആവർത്തിച്ചുണ്ടാകുന്ന, നിർദിഷ്ടമല്ലാത്ത സമയത്തെ സൂചിപ്പിക്കുന്നു. ‘നൽകുമ്പോഴെല്ലാം’ എന്ന രൂപം ഈ ആവർത്തനഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δώσουσιν
  choice: നൽകും / നൽകുമ്പോഴെല്ലാം
  rationale: δίδωμι എന്ന സാധാരണ ക്രിയയുടെ ലാളിത്യം നിലനിർത്താൻ ‘നൽകുക’ സ്വീകരിച്ചു; ആരാധനാസന്ദർഭം മുൻനിർത്തി കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘അർപ്പിക്കുക’ പ്രധാനപാഠത്തിൽ ഉപയോഗിച്ചില്ല.
- source_word: τὰ ζῷα
  choice: ജീവികൾ
  rationale: ഇത് സിംഹാസനമുറിയിലെ നേരത്തേ പരിചയപ്പെടുത്തിയ ജീവസത്തകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മൃഗങ്ങൾ’ എന്നത് തെറ്റായ ധ്വനി നൽകാം; ഈ വാക്യത്തിൽ ആവർത്തിക്കാത്ത ‘നാല്’ ചേർത്തിട്ടില്ല.
- source_word: δόξαν
  choice: മഹത്ത്വം
  rationale: ആരാധനാസന്ദർഭത്തിലെ δόξαയ്ക്ക് ‘മഹത്ത്വം’ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപദമാണ്; ‘സ്തുതി’ എന്ന് നൽകിയാൽ ഗുണത്തിൽനിന്ന് ആരാധനാക്രിയയിലേക്കു അർഥം മാറും.
- source_word: τιμήν
  choice: ബഹുമാനം
  rationale: τιμήയുടെ ആരാധനാസന്ദർഭത്തിലെ നേരിട്ടുള്ള അർഥം ‘ബഹുമാനം’ ആണ്; ‘മഹത്ത്വം’ എന്നും ‘നന്ദി’ എന്നും ഉള്ള പദങ്ങളോടൊപ്പം സ്വാഭാവികമായി ചേരുന്നു.
- source_word: εὐχαριστίαν
  choice: നന്ദി
  rationale: ഇവിടെ പ്രകടിപ്പിക്കുന്ന thanksgiving എന്ന ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ ‘നന്ദി’ വ്യക്തമായി അറിയിക്കുന്നു; ‘കൃതജ്ഞത’ ഉള്ളിലെ മനോഭാവത്തിന് കൂടുതൽ ഊന്നൽ നൽകാം.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്നവന്
  rationale: ഗ്രീക്കിലെ വർത്തമാന കൃദന്തരൂപവും ἐπί + ദത്തിവിന്റെ സിംഹാസനസന്ദർഭവും ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: τῷ ζῶντι
  choice: ജീവിക്കുന്നവന്
  rationale: കൃദന്തരൂപത്തിന്റെ ക്രിയാഭാവം നിലനിർത്തുകയും തുടർന്ന് വരുന്ന അനന്തകാലപ്രയോഗവുമായി വ്യക്തമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഈ ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാള തുല്യപ്രയോഗമാണിത്; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: ദൈവിക സിംഹാസനവിശേഷണം പാഠത്തിൽ ഇല്ലാത്ത വ്യക്തീകരണം ചേർക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്നവന്—എന്നെന്നേക്കും ജീവിക്കുന്നവന്—
  alternative: സിംഹാസനത്തിൽ ഇരിക്കുന്ന ദൈവത്തിന്, എന്നെന്നേക്കും ജീവിക്കുന്നവന്
  rationale: മൂലപാഠം അഭിസംബോധിതനെ സിംഹാസനാസീനതയാലും നിത്യജീവനാലും തിരിച്ചറിയിക്കുന്നു; ‘ദൈവം’ എന്നു വ്യക്തമായി ചേർക്കാതെ രണ്ടു വിശേഷണങ്ങളുടെയും സമാനാധികരണബന്ധം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ അൽപവിരാമം നിലനിർത്തി. സമാനാധികരണത്തിലുള്ള രണ്ടു ദൈവിക വിശേഷണങ്ങൾ ഡാഷുകൾകൊണ്ട് വ്യക്തമാക്കിയിരിക്കുന്നു.
