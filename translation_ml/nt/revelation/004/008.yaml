    rationale: γέμουσιν വർത്തമാനകാലമാണ്; ദർശനത്തിലെ നിലവിലെ വിവരണത്തെ ഭൂതകാലത്തിലാക്കരുത്.
  - severity: high
    issue: ‘ഇരുന്നവനും ഇരിക്കുന്നവനും’
    rationale: ὁ ἦν καὶ ὁ ὢν എന്നത് ‘was and is’ ആണ്. ‘ഇരുന്ന/ഇരിക്കുന്ന’ എന്നത് മലയാളത്തിൽ ഇരിപ്പിന്റെ അർഥം ഉണർത്തും; കാലസൂത്രത്തിന്റെ അർഥം മങ്ങുന്നു.
  - severity: medium
