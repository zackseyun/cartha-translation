revisions:
- from: 'നാലു ജീവികളും[a] ഓരോന്നിനും ആറു ചിറകുകളുള്ളവയും ചുറ്റും അകത്തും കണ്ണുകൾ നിറഞ്ഞവയുമായിരുന്നു. രാവും പകലും വിശ്രമമില്ലാതെ അവ പറഞ്ഞുകൊണ്ടിരിക്കുന്നു:


    “പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ,

    സർവശക്തനായ കർത്താവായ ദൈവം,

    ഇരുന്നവനും ഇരിക്കുന്നവനും വരുന്നവനും.”'
  to: 'നാലു ജീവികളിൽ ഓരോന്നിനും ആറു ചിറകുകളുണ്ട്; അവ ചുറ്റും അകത്തും കണ്ണുകളാൽ നിറഞ്ഞിരിക്കുന്നു. രാവും പകലും അവയ്ക്ക് വിശ്രമമില്ല; അവ ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരിക്കുന്നു:


    “പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ,

    സർവശക്തനായ കർത്താവായ ദൈവം,

    ആയിരുന്നവനും ഉള്ളവനും വരുന്നവനും.”'
  rationale: വർത്തമാനകാല ക്രിയാരൂപങ്ങൾ മലയാളത്തിലും വർത്തമാനമായി പുനഃസ്ഥാപിച്ചു. ‘ഇരുന്നവൻ’ എന്ന സാദ്ധ്യമായ സ്ഥല/ഇരിപ്പ്-അർഥം ഒഴിവാക്കി ὁ ἦν നെ ‘ആയിരുന്നവൻ’ എന്നും ὁ ὢν നെ ‘ഉള്ളവൻ’ എന്നും വിവർത്തനം ചെയ്തു. വിവാദസാധ്യതയുള്ള അവസാന കൃദന്തരൂപം മുഖ്യപാഠത്തിൽ ‘വരുന്നവൻ’ ആയി നിലനിർത്തി; പരമ്പരാഗത ‘വരുവാനുള്ളവൻ’ അടിക്കുറിപ്പിൽ നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം [a] ‘ജീവികൾ’ എന്നതിന് പിന്നാലെ തുടരും.
