id: REV.4.8
reference: Revelation 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: ml
  text: 'നാലു ജീവികളിൽ ഓരോന്നിനും ആറു ചിറകുകളുണ്ട്; അവ ചുറ്റും അകത്തും കണ്ണുകളാൽ നിറഞ്ഞിരിക്കുന്നു. രാവും പകലും അവയ്ക്ക് വിശ്രമമില്ല; അവ ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരിക്കുന്നു:


    “പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ,

    സർവശക്തനായ കർത്താവായ ദൈവം,

    ആയിരുന്നവനും ഉള്ളവനും വരുന്നവനും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῷα
  choice: ജീവികൾ
  rationale: ദർശനത്തിലെ സജീവമായ സ്വർഗീയ സത്തകളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘മൃഗങ്ങൾ’ എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കാൻ ‘ജീവികൾ’ സ്വാഭാവികവും വിശാലവുമാണ്.
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: ഓരോന്നിനും
  rationale: ഓരോ ജീവിയെയും പ്രത്യേകം ഉൾക്കൊള്ളുന്ന വിതരണാർഥം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: ആറു ചിറകുകളുള്ളവയും
  rationale: ഓരോ ജീവിക്കും ആറു ചിറകുണ്ടെന്ന ഗ്രീക്കിലെ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: ചുറ്റും അകത്തും
  rationale: കണ്ണുകളുടെ ബാഹ്യവും ആന്തരികവുമായ വ്യാപ്തി സൂചിപ്പിക്കുന്ന രണ്ടു സ്ഥാനവാചകങ്ങളും നിലനിർത്തുന്നു.
- source_word: γέμουσιν ὀφθαλμῶν
  choice: കണ്ണുകൾ നിറഞ്ഞവയുമായിരുന്നു
  rationale: γέμω എന്നതിന്റെ ‘നിറഞ്ഞിരിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥവും ദർശനത്തിന്റെ തീവ്രമായ ദൃശ്യരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: വിശ്രമമില്ലാതെ
  rationale: ‘വിശ്രമം ഇല്ല’ എന്ന മൂലാർഥം നിലനിർത്തുകയും വെറും സംസാരവിരാമമില്ലായ്മയായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἡμέρας καὶ νυκτός
  choice: രാവും പകലും
  rationale: തുടർച്ചയായ പ്രവർത്തനം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗമാണ്.
- source_word: λέγοντες
  choice: പറഞ്ഞുകൊണ്ടിരിക്കുന്നു
  rationale: തുടർച്ചയായ പ്രഖ്യാപനത്തെ പ്രകടമാക്കുന്നു; മൂലപദത്തിൽ ഇല്ലാത്ത ‘ആർത്തുവിളിച്ചു’ പോലുള്ള തീവ്രത ചേർക്കുന്നില്ല.
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ
  rationale: ആരാധനാപരവും ദൈവത്തെ സൂചിപ്പിക്കുന്നതുമായ ത്രിവർത്തനം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: κύριος, ὁ θεός
  choice: കർത്താവായ ദൈവം
  rationale: രണ്ടു ദൈവിക വിശേഷണങ്ങളെയും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: ὁ παντοκράτωρ
  choice: സർവശക്തനായ
  rationale: എല്ലാ ശക്തിയും അധികാരവും ഉള്ളവൻ എന്ന ദൈവിക പദവിയുടെ സ്ഥാപിതവും മനസ്സിലാക്കാവുന്നതുമായ മലയാളരൂപം.
theological_decisions:
- issue: ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος എന്ന ദൈവിക കാലസൂത്രത്തിന്റെ പരിഭാഷ
  choice: ഇരുന്നവനും ഇരിക്കുന്നവനും വരുന്നവനും
  alternative: ആയിരുന്നവനും ആയിരിക്കുന്നവനും വരുവാനുള്ളവനും
  rationale: അവസാന ഘടകം വർത്തമാനകാല കൃദന്തരൂപമായതിനാൽ ‘വരുന്നവൻ’ എന്നത് വരവിന്റെ സജീവവും പുരോഗമിക്കുന്നതുമായ ഭാവം സംരക്ഷിക്കുന്നു. പരമ്പരാഗത ഭാവികാലപ്രയോഗം നിയമാനുസൃതമായ മറ്റൊരു വായനയായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദർശനഭാഷയുടെ അപൂർവത ലളിതമാക്കാതെ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ‘ജീവികളും’ എന്നതിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
