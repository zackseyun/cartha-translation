id: REV.4.3
reference: Revelation 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: ml
  text: അവിടെ ഇരിക്കുന്നവൻ കാഴ്ചയിൽ ജാസ്പർ കല്ലിനോടും കാർണേലിയൻ കല്ലിനോടും സദൃശനായിരുന്നു. സിംഹാസനത്തിനു ചുറ്റും കാഴ്ചയിൽ മരതകത്തോടു സദൃശമായ ഒരു മഴവില്ല് ഉണ്ടായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ ‘പ്രകാശവലയം’; ഗ്രീക്കുപദത്തിന് മഴവില്ലുപോലെയുള്ള ദീപ്തിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: അവിടെ ഇരിക്കുന്നവൻ
  rationale: സിംഹാസനത്തിൽ തുടർന്നിരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമവാചകസമാനമായ വർത്തമാനകാല കൃദന്തം. സന്ദർഭത്തിൽനിന്ന് ‘അവിടെ’ ചേർക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികത നൽകുന്നു.
- source_word: ὅμοιος ὁράσει
  choice: കാഴ്ചയിൽ ... സദൃശൻ / സദൃശമായി കാണപ്പെട്ട
  rationale: ὁράσει എന്ന ദത്തിവിഭക്തി കാഴ്ചയിലോ രൂപത്തിലോ ഉള്ള സാമ്യം സൂചിപ്പിക്കുന്നു. വസ്തുതാപരമായ ഐക്യമല്ല, ദർശനത്തിലെ സാദൃശ്യമാണെന്ന് നിലനിർത്തുന്നു.
- source_word: λίθῳ ἰάσπιδι
  choice: സൂര്യകാന്തക്കല്ല്
  rationale: ἴασπις എന്ന പുരാതന രത്നനാമത്തിന് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ തത്തുല്യം; λίθος സൂചിപ്പിക്കുന്ന ‘കല്ല്’ പേരിൽ തന്നെ ഉൾപ്പെടുന്നു.
- source_word: σαρδίῳ
  choice: ചുവന്ന വൈഡൂര്യക്കല്ല്
  rationale: ചുവപ്പുനിറമുള്ള കാർണേലിയൻ/സാർഡിയസ് രത്നത്തെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പരമ്പരാഗത മലയാള രത്നനാമത്തിലൂടെ നൽകുന്നു; സാങ്കേതിക പകരംപദം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἶρις
  choice: മഴവില്ല്
  rationale: സിംഹാസനത്തെ ചുറ്റിയുള്ള മഴവില്ലുപോലെയുള്ള ദീപ്തിയെ സൂചിപ്പിക്കുന്ന ഏറ്റവും നേരിട്ടും സ്വാഭാവികവുമായ പദം; പ്രകാശവലയം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κυκλόθεν τοῦ θρόνου
  choice: സിംഹാസനത്തിനു ചുറ്റും
  rationale: സിംഹാസനത്തെ എല്ലാ വശത്തുനിന്നും ചുറ്റുന്ന സ്ഥാനം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: σμαραγδίνῳ
  choice: മരതകം
  rationale: പച്ചനിറമുള്ള emerald രത്നത്തിനുള്ള സാധാരണ ആധുനിക മലയാളപദം.
theological_decisions:
- issue: സിംഹാസനസ്ഥനെ രത്നങ്ങളോട് ഉപമിക്കുന്ന ദർശനഭാഷ
  choice: ‘കാഴ്ചയിൽ ... സദൃശൻ’ എന്ന ഉപമാഭാഷ നിലനിർത്തി
  alternative: ആ വ്യക്തി രത്നങ്ങളാൽ നിർമ്മിതനെന്നോ രത്നനിറമുള്ള പ്രകാശം പുറപ്പെടുവിച്ചെന്നോ വ്യാഖ്യാനിച്ച് പറയുക
  rationale: ഗ്രീക്കിൽ രണ്ടിടത്തും കാഴ്ചയിലെ സാദൃശ്യം മാത്രമാണ് പ്രസ്താവിക്കുന്നത്. അതിനെ ഭൗതിക ഘടനയോ നിർദിഷ്ട പ്രകാശവികിരണമോ ആക്കി മാറ്റാതെ ദൈവിക ദർശനത്തിന്റെ അതീതതയും അസ്പഷ്ടതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. രത്നനാമങ്ങളിൽ വായനാസൗകര്യവും പാരമ്പര്യപരിചയവും ചേർത്തു; അപരിചിതമായ സാങ്കേതിക പദങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി. ആവർത്തിച്ചിരിക്കുന്ന ഗ്രീക്ക് ഉപമാഭാവം മലയാളത്തിലും വ്യക്തമായി നിലനിർത്തി.
