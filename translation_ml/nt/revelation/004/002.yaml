id: REV.4.2
reference: Revelation 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: ml
  text: ഉടനെ ഞാൻ ആത്മാവിൽ[a] ആയിത്തീർന്നു; ഇതാ, സ്വർഗത്തിൽ ഒരു സിംഹാസനം നിലകൊണ്ടിരുന്നു; സിംഹാസനത്തിന്മേൽ ഇരിക്കുന്ന ഒരാൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആത്മീയാവസ്ഥയിൽ.” ഗ്രീക്കിൽ ഇവിടെ നിർവചനപദമില്ല; അതിനാൽ ഈ പ്രയോഗം പരിശുദ്ധാത്മാവിനാൽ പ്രാപിക്കപ്പെട്ട അവസ്ഥയെയോ ആത്മീയ/ദർശനാവസ്ഥയെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: സംഭവത്തിന്റെ പെട്ടെന്നുള്ള പരിവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐγενόμην
  choice: ഞാൻ ... ആയി
  rationale: γίνομαι സൂചിപ്പിക്കുന്ന ഒരു അവസ്ഥയിലേക്കുള്ള പ്രവേശനം നിലനിർത്തുന്നു; വെറും സ്ഥിരാവസ്ഥയായ ‘ആയിരുന്നു’ എന്നതിനെക്കാൾ ഗ്രീക്കിനോട് ചേർന്നതാണ്.
- source_word: ἐν πνεύματι
  choice: ആത്മാവിൽ
  rationale: വെളിപ്പാടിലെ പ്രവാചകദർശനാവസ്ഥയെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്ത പ്രയോഗം; പരിശുദ്ധാത്മാവിലുള്ള അനുഭവമോ ആത്മീയ/ദർശനാവസ്ഥയോ എന്ന യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ദർശനത്തിലെ പുതിയ കാഴ്ചയിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഉയർന്നതും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: θρόνος
  choice: ഒരു സിംഹാസനം
  rationale: ദർശനത്തിൽ ആദ്യമായി അവതരിപ്പിക്കപ്പെടുന്ന വസ്തുവായതിനാൽ ‘ഒരു’ ചേർക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἔκειτο
  choice: സ്ഥാപിക്കപ്പെട്ടിരുന്നു
  rationale: കെῖμαι ഇവിടെ സിംഹാസനം ഒരു സ്ഥാനത്ത് നിലകൊള്ളുകയോ സ്ഥാപിതമായിരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കിടന്നിരുന്നു’ എന്ന തെറ്റിദ്ധരിപ്പിക്കുന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: അന്തരീക്ഷാകാശമല്ല, ദൈവിക സ്വർഗീയ മണ്ഡലമാണ് ഈ അപ്പോക്കലിപ്റ്റിക് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: καθήμενος
  choice: ഒരാൾ ഇരിക്കുന്നുണ്ടായിരുന്നു
  rationale: സിംഹാസനത്തിലെ വ്യക്തിയെ ഗ്രീക്കിൽക്കാൾ അധികമായി തിരിച്ചറിയിക്കാതെ, substantival participle സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐν πνεύματι എന്നത് പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതോ പൊതുവായ ആത്മീയ/ദർശനാവസ്ഥയെ സൂചിപ്പിക്കുന്നതോ
  choice: ആത്മാവിൽ
  alternative: ആത്മീയാവസ്ഥയിൽ
  rationale: വെളിപ്പാടിലെ സമാന പ്രയോഗങ്ങൾ പ്രവാചകദർശനപരമായ അനുഭവത്തെ അടയാളപ്പെടുത്തുന്നു. എന്നാൽ ഗ്രീക്കിൽ നിർദ്ദേശകപദം ഇല്ലാത്തതിനാൽ കൂടുതൽ പൊതുവായ അർഥവും സാധ്യമാണ്; അതിനാൽ ആ വ്യാഖ്യാനസമ്മർദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ അപ്പോക്കലിപ്റ്റിക് ശൈലി. ‘ഇതാ’ ദർശനത്തിന്റെ നാടകീയ ശ്രദ്ധാകർഷണം നിലനിർത്തുന്നു; വാക്യത്തിലെ തുടർച്ച അടുത്ത വാക്യഭാഗത്തിലേക്കുള്ള മൂലപാഠത്തിന്റെ തുറന്ന ഘടനയെ മാനിക്കുന്നു.
