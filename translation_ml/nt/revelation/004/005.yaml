reference: Revelation 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: ml
  text: സിംഹാസനത്തിൽനിന്ന് മിന്നൽപ്പിണരുകളും ശബ്ദങ്ങളും ഇടിമുഴക്കങ്ങളും പുറപ്പെടുന്നു[a]; സിംഹാസനത്തിന്റെ മുമ്പിൽ തീയുടെ ഏഴു പന്തങ്ങൾ ജ്വലിച്ചുകൊണ്ടിരിക്കുന്നു[b], അവ ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കളാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശബ്ദങ്ങൾ’ എന്നതിന് ‘സ്വരങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘തീയുടെ ഏഴു ദീപങ്ങൾ ജ്വലിച്ചുകൊണ്ടിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കൾ’ എന്നത് ഏക പരിശുദ്ധാത്മാവിന്റെ പൂർണതയെ പ്രതീകാത്മകമായി സൂചിപ്പിക്കുന്നതായി പലരും മനസ്സിലാക്കുന്നു; എന്നാൽ ഗ്രീക്ക് പാഠം അക്ഷരാർഥത്തിൽ ‘ഏഴ് ആത്മാക്കൾ’ എന്നാണ് പറയുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: പുറപ്പെടുന്നു
  rationale: ἐκ എന്ന ആശയത്തോടുകൂടി സിംഹാസനത്തിൽനിന്ന് പ്രതിഭാസങ്ങൾ പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; വർത്തമാനകാലവും നിലനിർത്തുന്നു.
- source_word: ἀστραπαὶ
  choice: മിന്നൽപ്പിണരുകൾ
  rationale: ആവർത്തിച്ചുണ്ടാകുന്ന മിന്നലുകളെ സൂചിപ്പിക്കുന്ന ബഹുവചനം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φωναὶ
  choice: ശബ്ദങ്ങൾ
  rationale: φωνή എന്ന പദത്തിന് ‘ശബ്ദങ്ങൾ’ എന്നും ‘സ്വരങ്ങൾ’ എന്നും അർഥമാകാം. മിന്നലിനും ഇടിമുഴക്കത്തിനുമൊപ്പമുള്ള ഈ ദൈവപ്രത്യക്ഷതാചിത്രത്തിൽ വിശാലമായ ‘ശബ്ദങ്ങൾ’ അനുയോജ്യം; സാധ്യതയുള്ള മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: βρονταί
  choice: ഇടിമുഴക്കങ്ങൾ
  rationale: ബഹുവചനത്തിന്റെ ആവർത്തിതവും ഗംഭീരവുമായ ഇടിനാദം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λαμπάδες πυρὸς
  choice: തീയുടെ ഏഴു പന്തങ്ങൾ
  rationale: λαμπάς സാധാരണയായി ജ്വലിക്കുന്ന പന്തം അഥവാ ദീപശിഖയെ സൂചിപ്പിക്കുന്നു; πυρός എന്ന ബന്ധവും നേരിട്ട് സൂക്ഷിക്കുന്നു.
- source_word: καιόμεναι
  choice: ജ്വലിച്ചുകൊണ്ടിരുന്നു
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന ജ്വലനത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ പുരോഗമനസ്വഭാവം സാഹചര്യാനുസൃത മലയാള ഭൂതകാലത്തിൽ നൽകുന്നു.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: സിംഹാസനത്തിന്റെ മുമ്പിൽ
  rationale: സ്ഥലബന്ധം നേരിട്ടും സ്വാഭാവികമായും രേഖപ്പെടുത്തുന്നു.
- source_word: ἅ εἰσιν
  choice: അവ ... ആണ്
  rationale: മുൻപറഞ്ഞ ഏഴു പന്തങ്ങളെ പ്രതീകാത്മകമായി തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കൾ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ബഹുവചനം വ്യാഖ്യാനത്തിലൂടെ ഏകവചനമാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ എന്നതിന്റെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ ‘ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കൾ’ എന്ന് ബഹുവചനത്തോടെ നൽകി.
  alternative: ഏക പരിശുദ്ധാത്മാവിന്റെ പൂർണതയെ പ്രതീകാത്മകമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം; ‘ദൈവത്തിന്റെ ഏഴുവിധ ആത്മാവ്’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ.
  rationale: ഗ്രീക്ക് പാഠം ‘ഏഴ് ആത്മാക്കൾ’ എന്ന വ്യക്തമായ ബഹുവചനമാണ്. അതിനെ ഏകവചനമാക്കുന്നത് പരിഭാഷയെക്കാൾ വ്യാഖ്യാനമായിത്തീരും; അതിനാൽ പാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തി, സാധാരണ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൃശ്യത്തിന്റെ ശക്തി നിലനിർത്താൻ ‘മിന്നൽപ്പിണരുകൾ’, ‘ഇടിമുഴക്കങ്ങൾ’, ‘ജ്വലിച്ചുകൊണ്ടിരുന്നു’ എന്നിവ ഉപയോഗിച്ചു. ആദ്യക്രിയയുടെ വർത്തമാനകാലവും രണ്ടാമത്തെ ദൃശ്യത്തിന്റെ ഭൂതകാലസ്വഭാവവും ഉറവിടപാഠംപോലെ നിലനിർത്തി.
