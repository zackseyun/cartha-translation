id: REV.4.1
reference: Revelation 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: ml
  text: 'ഇവയ്ക്കുശേഷം ഞാൻ നോക്കി; ഇതാ, സ്വർഗത്തിൽ തുറന്നുകിടക്കുന്ന ഒരു വാതിൽ! എന്നോടു സംസാരിക്കുന്ന കാഹളനാദംപോലെ, ഞാൻ ആദ്യം കേട്ടിരുന്ന ആ ശബ്ദം[b] പറഞ്ഞു: “ഇവിടേക്കു കയറിവരിക; ഇവയ്ക്കുശേഷം സംഭവിക്കേണ്ട കാര്യങ്ങൾ ഞാൻ നിനക്കു കാണിച്ചുതരാം.”[a][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യാവഹാരികമായി: ‘ഇതിനുശേഷം ... ഇതിനുശേഷം.’ ഗ്രീക്കിൽ ‘ഇവയ്ക്കുശേഷം’ എന്ന ബഹുവചനപ്രയോഗം വാക്യത്തിന്റെ ആരംഭത്തിലും അവസാനത്തിലും ആവർത്തിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘ഞാൻ ആദ്യം കേട്ടിരുന്ന ആ ശബ്ദം’ എന്നത് യോഹന്നാൻ നേരത്തേ കേട്ട ശബ്ദത്തെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്; വെളിപ്പാട് 1:10 കാണുക.
    reason: cross_reference
  - marker: c
    text: ‘എന്നോടൊപ്പം സംസാരിക്കുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘എന്നോടൊപ്പം സംസാരിക്കുന്ന’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ഇവയ്ക്കുശേഷം
  rationale: ഗ്രീക്കിലെ ബഹുവചന സൂചനയും വാക്യത്തിന്റെ ആരംഭത്തിലും അവസാനത്തിലും വരുന്ന ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: εἶδον
  choice: ഞാൻ നോക്കി
  rationale: ദർശനസന്ദർഭത്തിൽ തുടർന്നുവരുന്ന ἰδοὺയോടൊപ്പം സ്വാഭാവികമായ മലയാളം; കാഴ്ചയിലേക്കുള്ള ശ്രദ്ധയെ വ്യക്തമാക്കുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: പെട്ടെന്നുള്ള ദർശനശ്രദ്ധയും വെളിപ്പാടിന്റെ ഗൗരവമുള്ള ശൈലിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: θύρα ἠνεῳγμένη
  choice: തുറന്നുകിടക്കുന്ന ഒരു വാതിൽ
  rationale: മുമ്പ് തുറക്കപ്പെട്ടതിന്റെ ഫലമായി ഇപ്പോഴും തുറന്നിരിക്കുന്ന അവസ്ഥയെ perfect passive participle സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: ഇവിടെ ദൃശ്യമായ ആകാശമല്ല, സ്വർഗീയ മണ്ഡലമാണ് സന്ദർഭം.
- source_word: ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα
  choice: ഞാൻ മുമ്പ് കേട്ടിരുന്ന ആ ശബ്ദം
  rationale: πρώτηയുടെ മുൻകാലസൂചനയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും വെളിപ്പാട് 1:10-ലെ ശബ്ദത്തിലേക്കുള്ള സാധ്യതയുള്ള തിരിച്ചുസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ
  choice: കാഹളംപോലെ എന്നോടു സംസാരിക്കുന്നതായി
  rationale: ശബ്ദത്തിന്റെ കാഹളസദൃശ ഗുണവും μετάയുടെ ‘എന്നോടു/എന്നോടൊപ്പം’ എന്ന ബന്ധവും അതിരുകടന്ന വ്യാഖ്യാനമില്ലാതെ നൽകുന്നു.
- source_word: Ἀνάβα ὧδε
  choice: ഇവിടേക്കു കയറിവരിക
  rationale: സ്വർഗത്തിലുള്ള സംസാരിക്കുന്നവന്റെ സ്ഥാനബോധത്തിൽനിന്നുള്ള മേലോട്ടുള്ള ക്ഷണത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἃ δεῖ γενέσθαι
  choice: സംഭവിക്കേണ്ട കാര്യങ്ങൾ
  rationale: δεῖയുടെ അനിവാര്യത നിലനിർത്തുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ സ്വഭാവം കൂടുതൽ വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
- source_word: δείξω σοι
  choice: ഞാൻ നിനക്കു കാണിച്ചുതരാം
  rationale: ഭാവികാല വാഗ്ദാനത്തെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ആവർത്തിക്കുന്ന μετὰ ταῦτα എന്ന പ്രയോഗത്തിന്റെ കാലസൂചന
  choice: രണ്ടിടത്തും ‘ഇവയ്ക്കുശേഷം’ എന്ന് ആവർത്തിച്ചു
  alternative: ‘ഇതിനുശേഷം’ അല്ലെങ്കിൽ ‘പിന്നീട്’
  rationale: ഗ്രീക്കിലെ ആവർത്തനവും ബഹുവചനവും സംരക്ഷിക്കുന്നത് ഇത് സാഹിത്യക്രമമോ ദർശനക്രമമോ രക്ഷാചരിത്രക്രമമോ എന്ന് തീരുമാനിച്ച് ഒരു പ്രത്യേക അന്ത്യകാലപദ്ധതി അടിച്ചേൽപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു.
- issue: ‘ആദ്യത്തെ ശബ്ദം’ എന്നതിന്റെ സൂചന
  choice: ‘ഞാൻ മുമ്പ് കേട്ടിരുന്ന ആ ശബ്ദം’
  alternative: ‘ആദ്യത്തെ ശബ്ദം’
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി മുൻപ് കേട്ട ശബ്ദത്തിലേക്കുള്ള തിരിച്ചുസൂചന നൽകുന്നു; അത് ആരുടേതാണെന്ന് വാക്യത്തിൽ അധികമായി നിർണ്ണയിക്കുന്നില്ല.
- issue: δεῖയുടെ അനിവാര്യത
  choice: ‘സംഭവിക്കേണ്ട’
  alternative: ‘സംഭവിക്കാനിരിക്കുന്ന’
  rationale: വെറും ഭാവികാലത്തേക്കാൾ ഉറവിടത്തിലെ അനിവാര്യത സംരക്ഷിക്കുന്നു; അതിന്റെ കാരണം അല്ലെങ്കിൽ കൃത്യമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ദർശനവിവരണശൈലി സ്വീകരിച്ചു. ‘ഇതാ’, ‘കാഹളം’, ‘സ്വർഗം’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. മുഖ്യവാചകത്തിലെ [a], [b], [c] അടയാളങ്ങൾ ബന്ധപ്പെട്ട അടിക്കുറിപ്പുകളോടൊപ്പം നൽകിയിരിക്കുന്നു.
