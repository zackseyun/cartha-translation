source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: ml
  text: 'ഇരുപത്തിനാലു മൂപ്പന്മാർ സിംഹാസനത്തിൽ ഇരിക്കുന്നവന്റെ മുമ്പിൽ വീഴുകയും, എന്നെന്നേക്കും ജീവിക്കുന്നവനെ ആരാധിക്കുകയും, തങ്ങളുടെ കിരീടങ്ങൾ[a] സിംഹാസനത്തിന്റെ മുമ്പിൽ എറിയുകയും, ഇങ്ങനെ പറയുകയും ചെയ്യും:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കിരീടങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം ബഹുമതിയുടെയോ വിജയത്തിന്റെയോ അടയാളമായി നൽകപ്പെട്ടിരുന്ന വിജയമാലകളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: വീണു
  rationale: ആരാധനാപശ്ചാത്തലത്തിലെ ആദരപൂർവമായ നിലംപതിക്കൽ എന്ന ശാരീരിക പ്രവൃത്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പൂർണ സാഷ്ടാംഗപ്രണാമം എന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: ഇരുപത്തിനാലു മൂപ്പന്മാർ
  rationale: വെളിപ്പാടിലെ സ്വർഗീയസഭാസന്ദർഭത്തിൽ πρεσβύτεροι എന്നതിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും പാരമ്പര്യസഹജവുമായ പദമാണ് ‘മൂപ്പന്മാർ’.
- source_word: ἐνώπιον
  choice: മുമ്പിൽ
  rationale: രണ്ട് പ്രയോഗങ്ങളിലും സാന്നിധ്യത്തെയും സ്ഥാനബന്ധത്തെയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്നവൻ
  rationale: പേരുപോലെ പ്രവർത്തിക്കുന്ന വർത്തമാന കൃദന്തത്തിന്റെ തുടർച്ചയായ സിംഹാസനസ്ഥിതി സംരക്ഷിക്കുകയും വ്യക്തിയെ വാക്യത്തിനപ്പുറം തിരിച്ചറിയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: προσκυνήσουσιν
  choice: ആരാധിക്കും
  rationale: ദൈവിക പശ്ചാത്തലത്തിൽ മതപരമായ ഭക്തിയും വണക്കവും വ്യക്തമായി നൽകുന്നു; വെറും ശാരീരിക കുനിയലായി ചുരുക്കുന്നില്ല.
- source_word: τῷ ζῶντι
  choice: ജീവിക്കുന്നവൻ
  rationale: ദൈവത്തിന്റെ ജീവിക്കുന്നതും നിലനിൽക്കുന്നതുമായ സ്വത്വത്തെ സൂചിപ്പിക്കുന്ന substantival participle സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് ആധുനിക മലയാളത്തിലെ വ്യക്തവും പ്രചാരമുള്ളതുമായ തുല്യപ്രയോഗം.
- source_word: βαλοῦσιν
  choice: എറിഞ്ഞുകൊണ്ട്
  rationale: βάλλω എന്നതിലെ സജീവവും ദൃശ്യവുമായ ‘എറിയുക’ എന്ന പ്രവർത്തി നിലനിർത്തുന്നു; വെറുതെ ‘വെക്കും’ എന്ന് മൃദൂകരിക്കുന്നില്ല.
- source_word: στεφάνους
  choice: കിരീടങ്ങൾ
  rationale: ബഹുമതിയുടെയോ വിജയത്തിന്റെയോ അടയാളമായ στέφανος-നെ ഈ രാജകീയ ദർശനസന്ദർഭത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ചരിത്രപരമായ ‘വിജയമാല’ എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: λέγοντες
  choice: ഇങ്ങനെ പറയും
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളിലേക്കുള്ള സ്വാഭാവിക മലയാള ആമുഖം; ഗ്രീക്കിലെ വർത്തമാന കൃദന്തത്തിന്റെ പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: സിംഹാസനത്തിൽ ഇരിക്കുന്നവനും എന്നെന്നേക്കും ജീവിക്കുന്നവനും ആരെന്ന തിരിച്ചറിയൽ
  choice: ‘സിംഹാസനത്തിൽ ഇരിക്കുന്നവൻ’, ‘എന്നെന്നേക്കും ജീവിക്കുന്നവൻ’ എന്നീ വിവരണാത്മക വിശേഷണങ്ങൾ തന്നെ നിലനിർത്തി.
  alternative: പരിഭാഷയിൽ തന്നെ ‘പിതാവായ ദൈവം’ എന്ന് വ്യക്തമായി തിരിച്ചറിയുക.
  rationale: സന്ദർഭം ദൈവത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നതെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം വ്യക്തിനാമമോ കൂടുതൽ നിർദ്ദിഷ്ടമായ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയലോ നൽകുന്നില്ല. അതിനാൽ പാഠത്തിലെ വിവരണഭാഷയും അതിന്റെ നിയന്ത്രിതമായ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ഭാവികാല ക്രിയകളുടെ ഏകോപനം മലയാളത്തിൽ ‘വീണു ... ആരാധിക്കും; ... എറിഞ്ഞുകൊണ്ട് ... പറയും’ എന്ന സ്വാഭാവിക ക്രമത്തിൽ നൽകിയിരിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ലെ footnote marker ക്രമത്തിൽ ഉണ്ടായിരുന്ന പൊരുത്തക്കേട് തിരുത്തി: ‘ages of ages’ എന്ന കുറിപ്പിന് പ്രധാനപാഠത്തിൽ അനുയോജ്യമായ marker ഇല്ലായിരുന്നു; ഈ മലയാള കരടിൽ ആവശ്യമായ στέφανος കുറിപ്പ് മാത്രം [a] ആയി ചേർത്തു.'
