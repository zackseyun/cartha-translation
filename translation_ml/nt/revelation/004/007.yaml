id: REV.4.7
reference: Revelation 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: ml
  text: ഒന്നാമത്തെ ജീവി സിംഹത്തെപ്പോലെയും രണ്ടാമത്തെ ജീവി കിടാവിനെപ്പോലെയും ആയിരുന്നു; മൂന്നാമത്തെ ജീവിക്ക് മനുഷ്യന്റേതുപോലെയുള്ള മുഖം ഉണ്ടായിരുന്നു[a]; നാലാമത്തെ ജീവി പറക്കുന്ന കഴുകനെപ്പോലെയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, ‘മനുഷ്യമുഖം.’ ഗ്രീക്കിൽ: ‘മനുഷ്യനെപ്പോലെയുള്ള മുഖം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῷον
  choice: ജീവി
  rationale: സിംഹാസനമുറിയിലെ ഈ സജീവ സത്തകളെ പിന്നീട് വെളിപ്പാടിൽ പ്രത്യക്ഷപ്പെടുന്ന ശത്രുതാപരമായ θηρίον-ൽനിന്ന് വേർതിരിക്കാനും ζῷον എന്ന പദത്തിന്റെ വിശാലമായ അർഥം സ്വാഭാവികമായി നൽകാനും ‘ജീവി’ തിരഞ്ഞെടുത്തു.
- source_word: ὅμοιον
  choice: -നെപ്പോലെ / -നെപ്പോലെയായിരുന്നു
  rationale: ഈ പദം താദാത്മ്യമല്ല, സാദൃശ്യമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവികമായ താരതമ്യപ്രയോഗം അതു നിലനിർത്തുന്നു.
- source_word: λέοντι
  choice: സിംഹം
  rationale: ὅμοιον എന്ന താരതമ്യപ്രയോഗത്തിനു ശേഷമുള്ള സാധാരണ മൃഗനാമം.
- source_word: μόσχῳ
  choice: കിടാവ്
  rationale: μόσχος സാധാരണയായി ഇളം കന്നുകാലിയെയോ കിടാവിനെയോ സൂചിപ്പിക്കുന്നു; ലിംഗമോ യാഗസംബന്ധമായ ആശയമോ അനാവശ്യമായി നിർണ്ണയിക്കാതെ ‘കിടാവ്’ അർഥം നൽകുന്നു.
- source_word: ἔχων
  choice: ഉണ്ടായിരുന്നു
  rationale: ഗ്രീക്ക് കൃദന്തരൂപത്തിന്റെ വിവരണാത്മക ശക്തി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സമാപികാക്രിയയായി പരിഭാഷപ്പെടുത്തി.
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: മനുഷ്യന്റേതുപോലെയുള്ള മുഖം
  rationale: πρόσωπον എന്നത് ‘മുഖം’ എന്നും ὡς താരതമ്യം സൂചിപ്പിക്കുന്നതുമാണ്; ἀνθρώπου ഇവിടെ മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ഈ രൂപം കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: ἀετῷ
  choice: കഴുകൻ
  rationale: ἀετός ചില സന്ദർഭങ്ങളിൽ ശവംതീനിക്കഴുകനെയും സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടത്തെ ദർശനാത്മക ചിത്രീകരണത്തിൽ ‘കഴുകൻ’ ഏറ്റവും യോജിച്ച സാധാരണ പരിഭാഷയാണ്.
- source_word: πετομένῳ
  choice: പറക്കുന്ന
  rationale: കഴുകൻ പറക്കുന്ന പ്രവൃത്തിയിലാണെന്ന ദൃശ്യവിവരണം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: മൂന്നാമത്തെ ജീവിയുടെ മുഖത്തെക്കുറിച്ചുള്ള ἀνθρώπου എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യന്റേതുപോലെയുള്ള മുഖം
  alternative: ഒരു മനുഷ്യനെപ്പോലെയുള്ള മുഖം
  rationale: ἀνθρώπου മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കാൻ കഴിയുന്നു; ὡς കൊണ്ടുള്ള താരതമ്യം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അനാവശ്യമായ ലിംഗവിശേഷീകരണം ഒഴിവാക്കുന്നു. കൂടുതൽ അക്ഷരാർഥപരമായ പദക്രമം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഏകവാക്യത്തിലെ നാല് സമാന്തര ദൃശ്യവിവരണങ്ങളും അർദ്ധവിരാമങ്ങളിലൂടെ വ്യക്തമായി ക്രമപ്പെടുത്തി.
