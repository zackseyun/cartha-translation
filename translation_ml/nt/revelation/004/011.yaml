source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: ml
  text: '“ഞങ്ങളുടെ കർത്താവും ദൈവവുമായ അങ്ങേ,


    മഹത്ത്വവും ബഹുമാനവും ശക്തിയും സ്വീകരിക്കാൻ


    അങ്ങ് യോഗ്യനാണ്[a];


    കാരണം അങ്ങാണ് സകലവും സൃഷ്ടിച്ചത്;


    അങ്ങയുടെ ഇഷ്ടം നിമിത്തം[b]


    അവ നിലവിലുണ്ടായിരുന്നു, സൃഷ്ടിക്കപ്പെടുകയും ചെയ്തു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, ഊന്നലോടെ: “യോഗ്യനാണ് അങ്ങ്.” ഗ്രീക്കിൽ ‘യോഗ്യൻ’ എന്ന പദമാണ് ആദ്യം വരുന്നത്.'
    reason: word_order_emphasis
  - marker: b
    text: അല്ലെങ്കിൽ, “അങ്ങയുടെ ഇഷ്ടത്താൽ.” διὰ τὸ θέλημά σου എന്ന ഗ്രീക്കുപ്രയോഗം പ്രധാനമായി കാരണം സൂചിപ്പിക്കാമെങ്കിലും, മാർഗം അഥവാ ഉപകരണം സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: അങ്ങ് യോഗ്യനാകുന്നു
  rationale: യോഗ്യതയെ സൂചിപ്പിക്കുന്ന വിധേയവിശേഷണവും εἶ എന്ന ക്രിയയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ടുള്ള അഭിസംബോധനയായി നൽകുന്നു. ഗ്രീക്കിൽ ‘യോഗ്യൻ’ ആദ്യം വരുന്നതിലെ ഊന്നൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: ഞങ്ങളുടെ കർത്താവും ദൈവവുമായവനേ
  rationale: ആരാധനാസന്ദർഭത്തിലെ ആർട്ടിക്കിൾ-നാമപദഘടന നേരിട്ടുള്ള അഭിസംബോധനയായി പ്രവർത്തിക്കുന്നു. ‘കർത്താവ്’, ‘ദൈവം’ എന്നീ രണ്ടു പദവികളും ‘ഞങ്ങളുടെ’ എന്ന ഉടമസ്ഥസൂചനയും നിലനിർത്തുന്നു.
- source_word: λαβεῖν
  choice: സ്വീകരിക്കാൻ
  rationale: ἄξιος എന്നതിനുശേഷമുള്ള infinitive, അഭിസംബോധിതൻ എന്തു സ്വീകരിക്കാൻ യോഗ്യനാണെന്നു പറയുന്നു. ആരാധനയിൽ അർപ്പിക്കപ്പെടുന്ന മഹത്ത്വം, ബഹുമാനം, ശക്തി എന്നിവയ്ക്ക് ‘സ്വീകരിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: മഹത്ത്വവും ബഹുമാനവും ശക്തിയും
  rationale: മൂന്നു നാമപദങ്ങളുള്ള സ്തുതിഘടനയും ആവർത്തിക്കുന്ന ‘και’യുടെ താളവും മലയാളത്തിലെ ‘-വും’ ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: ὅτι σὺ ἔκτισας τὰ πάντα
  choice: കാരണം അങ്ങാണ് സകലവും സൃഷ്ടിച്ചത്
  rationale: ὅτιയുടെ കാരണാർഥം ‘കാരണം’ എന്നും, ഊന്നലുള്ള σὺ ‘അങ്ങാണ്’ എന്നും നൽകുന്നു. τὰ πάνταയുടെ സമഗ്രവ്യാപ്തി ‘സകലവും’ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τὸ θέλημά σου
  choice: അങ്ങയുടെ ഇഷ്ടം നിമിത്തം
  rationale: διά + accusative സാധാരണയായി കാരണം അല്ലെങ്കിൽ അടിസ്ഥാനം സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ ആ കാരണാർഥം നിലനിർത്തുന്നു; സാധ്യമായ ഉപകരണാർഥ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: അവ നിലനിന്നു, സൃഷ്ടിക്കപ്പെടുകയും ചെയ്തു
  rationale: ἦσαν, ἐκτίσθησαν എന്നീ രണ്ടു വ്യത്യസ്ത ക്രിയകളെയും ഒന്നാക്കി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു. ‘നിലനിന്നു’ അവയുടെ അസ്തിത്വത്തെ സൂചിപ്പിക്കുകയും passive രൂപമായ ‘സൃഷ്ടിക്കപ്പെട്ടു’ സൃഷ്ടിയുടെ പ്രവർത്തനം അവയ്ക്കു സംഭവിച്ചതായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവത്തോടുള്ള പദവിക്രമത്തിന്റെ അഭിസംബോധനാത്മക രൂപം
  choice: ഞങ്ങളുടെ കർത്താവും ദൈവവുമായവനേ
  alternative: കർത്താവേ, ഞങ്ങളുടെ ദൈവമേ
  rationale: സിംഹാസനത്തിൽ ഇരിക്കുന്നവനോടുള്ള നേരിട്ടുള്ള ആരാധനാഭിസംബോധനയാണ് സന്ദർഭം. തെരഞ്ഞെടുത്ത രൂപം രണ്ടു പദവികളെയും ഒരേ അഭിസംബോധിതനുമായി ബന്ധിപ്പിക്കുന്നു; എന്നാൽ വാക്യം പറയുന്നതിലപ്പുറം ഒരു സിദ്ധാന്തവ്യാഖ്യാനവും ചേർക്കുന്നില്ല.
- issue: ദൈവഹിതവും സൃഷ്ടിയും തമ്മിലുള്ള ബന്ധം
  choice: അങ്ങയുടെ ഇഷ്ടം നിമിത്തം അവ നിലനിന്നു, സൃഷ്ടിക്കപ്പെടുകയും ചെയ്തു
  alternative: അങ്ങയുടെ ഇഷ്ടത്താൽ അവ നിലനിന്നു, സൃഷ്ടിക്കപ്പെടുകയും ചെയ്തു
  rationale: διά + accusativeയിലെ മുഖ്യമായ കാരണാർഥം തെരഞ്ഞെടുത്ത പാഠത്തിൽ നിലനിർത്തുന്നു. ‘ഇഷ്ടത്താൽ’ എന്നത് കാരണമോ മാർഗമോ സൂചിപ്പിക്കാവുന്നതിനാൽ യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു; സൃഷ്ടിയുടെ ദാർശനിക രീതി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവും ആരാധനാത്മകവുമായ ശൈലി. പഴയ രൂപങ്ങളായ ‘സ്വീകരിപ്പാൻ’, ‘സൃഷ്ടിച്ചിരിക്കുന്നു’ തുടങ്ങിയവ ഒഴിവാക്കി. ‘അങ്ങ്’ നേരിട്ടുള്ള ദൈവാഭിസംബോധനയിൽ മാന്യമായ ഭാവം നൽകുന്നു. കവിതാസദൃശമായ വരിവിഭജനം ഗ്രീക്കിലെ സ്തുതിഗീതതാളം വായനയിൽ നിലനിർത്തുന്നു.
