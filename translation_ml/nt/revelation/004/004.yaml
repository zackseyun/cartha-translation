  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: ml
  text: സിംഹാസനത്തിനു ചുറ്റും ഇരുപത്തിനാല് സിംഹാസനങ്ങൾ ഉണ്ടായിരുന്നു. ആ സിംഹാസനങ്ങളിൽ വെള്ള വസ്ത്രങ്ങൾ ധരിച്ച ഇരുപത്തിനാല് മൂപ്പന്മാർ ഇരുന്നിരുന്നു; അവരുടെ തലകളിൽ സ്വർണക്കിരീടങ്ങൾ[a] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിജയമാലകൾ’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദം രാജകീയ മകുടം മാത്രമല്ല, ബഹുമതിക്കോ വിജയത്തിനോ നൽകുന്ന കിരീടത്തെയോ മാലയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: ചുറ്റും
  rationale: കേന്ദ്രസിംഹാസനത്തെ വലയംചെയ്യുന്ന സ്ഥലബന്ധം സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: θρόνοι
  choice: സിംഹാസനങ്ങൾ
  rationale: കേന്ദ്രത്തിലെ സിംഹാസനത്തിനും ചുറ്റുമുള്ള ഇരുപത്തിനാല് ഇരിപ്പിടങ്ങൾക്കും ഗ്രീക്കിൽ ഒരേ പദമാണ്; രാജകീയവും ന്യായവിധിസംബന്ധവുമായ ദൃശ്യഭാവം നിലനിർത്താൻ ഒരേ മലയാളപദം ഉപയോഗിച്ചു.
- source_word: εἴκοσι τέσσαρες
  choice: ഇരുപത്തിനാല്
  rationale: സംഖ്യയുടെ സാധാരണ ആധുനിക മലയാളരൂപം.
- source_word: ἐπὶ τοὺς θρόνους
  choice: ആ സിംഹാസനങ്ങളിൽ
  rationale: ഈ സന്ദർഭത്തിലെ സ്ഥാനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആവർത്തനത്തിലെ വ്യക്തതയ്ക്കായി ‘ആ’ ചേർത്തു.
- source_word: πρεσβυτέρους
  choice: മൂപ്പന്മാർ
  rationale: വെളിപ്പാടിലെ തിരിച്ചറിയപ്പെട്ട സ്വർഗീയ സംഘത്തിന്റെ സ്ഥാനപ്പേരായി വരുന്ന പദം; അവരുടെ പ്രായമോ കൃത്യമായ സ്വത്വമോ അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: καθημένους
  choice: ഇരിക്കുന്നുണ്ടായിരുന്നു
  rationale: ദർശനത്തിൽ കണ്ടുകൊണ്ടിരുന്ന നിലയെ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: περιβεβλημένους
  choice: ധരിച്ച
  rationale: വസ്ത്രം അണിഞ്ഞ നിലയെ ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν ἱματίοις λευκοῖς
  choice: വെള്ളവസ്ത്രം
  rationale: ἱμάτια എന്ന പൊതുവായ ‘വസ്ത്രങ്ങൾ’ എന്ന അർഥം നിലനിർത്തുന്നു; ഗ്രീക്ക് ആവശ്യപ്പെടാത്ത ‘അങ്കി’ എന്ന പ്രത്യേക രൂപം ചേർക്കുന്നില്ല.
- source_word: στεφάνους
  choice: കിരീടങ്ങൾ
  rationale: സന്ദർഭത്തിൽ ഏറ്റവും വ്യക്തമായ മലയാളപദം; ബഹുമതിയുടെയോ വിജയത്തിന്റെയോ മാല/കിരീടം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: χρυσοῦς
  choice: സ്വർണ
  rationale: സ്വർണത്തിൽ നിർമിച്ചവയെന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ചുറ്റുമുള്ള ഇരുപത്തിനാല് θρόνοι-കളുടെ സ്വഭാവം
  choice: ‘ഇരിപ്പിടങ്ങൾ’ എന്നതിനു പകരം ‘സിംഹാസനങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: കേന്ദ്രസിംഹാസനത്തോടു തുല്യമായ പരമാധികാരം സൂചിപ്പിക്കാതിരിക്കാൻ ‘ഇരിപ്പിടങ്ങൾ’ എന്നു നൽകുക.
  rationale: ഗ്രീക്ക് മൂലപാഠം കേന്ദ്രസിംഹാസനത്തിനും ചുറ്റുമുള്ളവയ്ക്കും θρόνος എന്ന ഒരേ പദം ആവർത്തിക്കുന്നു. ആ പദബന്ധവും രാജകീയ/ന്യായവിധി ദൃശ്യഭാവവും പരിഭാഷയിൽ സംരക്ഷിച്ചു; മൂപ്പന്മാരുടെ അധികാരത്തിന്റെ കൃത്യസ്വഭാവം ഇതിലൂടെ നിർണയിക്കുന്നില്ല.
- issue: ഇരുപത്തിനാല് മൂപ്പന്മാരുടെ സ്വത്വം
  choice: വ്യാഖ്യാനപരമായ വിശദീകരണം ചേർക്കാതെ ‘മൂപ്പന്മാർ’ എന്നു മാത്രം നൽകി.
  alternative: സഭയുടെ പ്രതിനിധികൾ, ദൂതസത്തകൾ, അല്ലെങ്കിൽ ഇസ്രായേലിന്റെയും അപ്പൊസ്തലന്മാരുടെയും പ്രതിനിധികൾ എന്നു വ്യക്തമാക്കുക.
  rationale: വാക്യം അവരെ πρεσβύτεροι എന്നു വിളിക്കുന്നുവെങ്കിലും അവരുടെ സ്വത്വം വിശദീകരിക്കുന്നില്ല; അതിനാൽ വിവിധ വ്യാഖ്യാനങ്ങൾക്കിടയിലെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ദർശനവിവരണശൈലി. ഗ്രീക്കിലെ ദീർഘമായ പങ്കുപദഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ആവർത്തിക്കുന്ന θρόνος എന്ന പദബന്ധം ‘സിംഹാസനം/സിംഹാസനങ്ങൾ’ ആയി നിലനിർത്തി.
