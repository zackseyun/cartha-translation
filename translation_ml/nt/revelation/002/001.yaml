id: REV.2.1
reference: Revelation 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: ml
  text: 'എഫെസൊസിലുള്ള സഭയുടെ ദൂതന്[a] എഴുതുക: “തന്റെ വലങ്കയ്യിൽ ഏഴു നക്ഷത്രങ്ങളെ പിടിച്ചുകൊണ്ടിരിക്കുന്നവനും ഏഴു പൊൻവിളക്കുതണ്ടുകളുടെ നടുവിൽ നടക്കുന്നവനും ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എഫെസൊസിലുള്ള സഭയുടെ സന്ദേശവാഹകന്’.
    reason: ἀγγέλῳ എന്ന പദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം; ഉദ്ദേശിക്കുന്ന വ്യക്തിത്വം തർക്കവിധേയമാണ്.
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ദൂതന്
  rationale: ‘ദൂതൻ’ എന്ന മലയാളപദം സ്വർഗീയ ദൂതനെയും സന്ദേശവാഹകനെയും സൂചിപ്പിക്കാൻ കഴിയുന്നതിനാൽ ഗ്രീക്കുപദത്തിന്റെ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു; ഇവിടെ പ്രാഥമികമായി ‘ദൂതൻ’ എന്ന പരമ്പരാഗത വെളിപ്പാട്-സന്ദർഭ വായനയാണ് സ്വീകരിച്ചത്.
- source_word: ἐκκλησίας
  choice: സഭയുടെ
  rationale: ക്രിസ്തീയ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘സഭ’ സ്വാഭാവികവും സ്ഥാപിതവുമായ ആധുനിക മലയാള പ്രയോഗമാണ്.
- source_word: γράψον
  choice: എഴുതുക
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള ആജ്ഞാരൂപം ലളിതമായ മലയാള ആജ്ഞാരൂപത്തിൽ പകർത്തുന്നു.
- source_word: Τάδε λέγει
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഗൗരവവും ഔപചാരിക ഭാവവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: κρατῶν
  choice: മുറുകെപ്പിടിക്കുകയും
  rationale: κρατέω സൂചിപ്പിക്കുന്ന ഉറച്ച പിടിയും അധീനതയും വെറും ‘പിടിക്കുക’ എന്നതിനെക്കാൾ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δεξιᾷ
  choice: വലങ്കയ്യിൽ
  rationale: മൂലത്തിലെ വ്യക്തമായ ശരീരരൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: περιπατῶν
  choice: നടക്കുകയും ചെയ്യുന്നവൻ
  rationale: വിളക്കുതണ്ടുകളുടെ ഇടയിലൂടെയുള്ള സജീവ സാന്നിധ്യം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: ἐν μέσῳ
  choice: നടുവിൽ
  rationale: ‘മധ്യേ/ഇടയിൽ’ എന്ന അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: λυχνιῶν
  choice: വിളക്കുതണ്ടുകളുടെ
  rationale: ഇത് വിളക്കുകളെയല്ല, വിളക്കുകൾ വയ്ക്കുന്ന തണ്ടുകളെയോ പീഠങ്ങളെയോ സൂചിപ്പിക്കുന്നു; വെളിപ്പാട് 1-ലെ രൂപകത്തോടുള്ള കൃത്യതയും നിലനിർത്തുന്നു.
- source_word: χρυσῶν
  choice: പൊൻവിളക്കുതണ്ടുകളുടെ
  rationale: ‘പൊൻ-’ എന്ന വിശേഷണം χρυσῶν എന്നതിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാള തുല്യമാണ്.
theological_decisions:
- issue: ‘സഭയുടെ ദൂതൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘ദൂതൻ’ നിലനിർത്തി
  alternative: ‘സന്ദേശവാഹകൻ’
  rationale: ἄγγελος എന്ന ഗ്രീക്കുപദം സ്വർഗീയ ദൂതനെയോ മനുഷ്യ സന്ദേശവാഹകനെയോ സൂചിപ്പിക്കാം. വെളിപ്പാടിന്റെ ദർശനാത്മക പശ്ചാത്തലവും ആവർത്തിച്ചുള്ള പ്രയോഗവും ‘ദൂതൻ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ തർക്കവിധേയമായ തിരിച്ചറിയൽ അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള പ്രവാചകപ്രഖ്യാപന ശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ദൃശ്യരൂപങ്ങൾ കാത്തുസൂക്ഷിച്ചുകൊണ്ട് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു. തുടർന്നുള്ള വാക്യങ്ങളിലേക്ക് നീളുന്ന ഉദ്ധരണി സൂചിപ്പിക്കാൻ ആരംഭ ഉദ്ധരണിചിഹ്നം മാത്രം നൽകിയിരിക്കുന്നു.
