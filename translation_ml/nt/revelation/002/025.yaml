id: REV.2.25
reference: Revelation 2:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πλὴν ὃ ἔχετε κρατήσατε ἄχρι οὗ ἂν ἥξω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/025.yaml
  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: ml
  text: എങ്കിലും[a], നിങ്ങൾക്കുള്ളത് ഞാൻ വരുന്നതുവരെ മുറുകെപ്പിടിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ഒന്നു മാത്രം: നിങ്ങൾക്കുള്ളത് ഞാൻ വരുന്നതുവരെ മുറുകെപ്പിടിക്കുക.”'
    reason: πλὴν എന്ന പദത്തിന് ഇവിടെ വിരുദ്ധഭാവത്തോടൊപ്പം പരിമിതപ്പെടുത്തുന്ന ‘ഒന്നു മാത്രം’ എന്ന അർഥവും സാധ്യമാണ്.
lexical_decisions:
- source_word: πλὴν
  choice: എങ്കിലും
  rationale: മുൻവാക്യത്തെത്തുടർന്നുള്ള പരിമിതപ്പെടുത്തലോ വിരുദ്ധഭാവമോ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ‘ഒന്നു മാത്രം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὃ ἔχετε
  choice: നിങ്ങൾക്കുള്ളത്
  rationale: സഭയ്ക്ക് ഇപ്പോൾ ഉള്ളതിനെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പരിഭാഷ.
- source_word: κρατήσατε
  choice: മുറുകെപ്പിടിക്കുക
  rationale: κρατέω എന്ന ക്രിയയുടെ ഉറച്ചുപിടിച്ചുനിൽക്കാനുള്ള ആഹ്വാനവും ആജ്ഞാരൂപത്തിന്റെ ശക്തിയും വ്യക്തമാക്കുന്നു.
- source_word: ἄχρι οὗ ἂν
  choice: വരുന്നതുവരെ
  rationale: സംസാരിക്കുന്നവന്റെ വരവ് എന്ന ഭാവിയിലെ പരിധിവരെ തുടരണമെന്ന കാലപരിധി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἥξω
  choice: ഞാൻ വരുന്നതുവരെ
  rationale: എത്തിച്ചേരുക/വരുക എന്ന അർഥം നൽകുന്നു; വരവിന്റെ രീതിയോ സമയമോ നിർവചിക്കാതെ മൂലപാഠത്തിന്റെ തുറന്ന നില നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ‘വരവ്’ അന്തിമ യുഗാന്ത്യവരവാണോ, ഈ സഭയെ ന്യായംവിധിക്കാനുള്ള സന്ദർശനമാണോ എന്നത്
  choice: ‘ഞാൻ വരുന്നതുവരെ’ എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഞാൻ ന്യായവിധിക്കായി വരുന്നതുവരെ’ / ‘എന്റെ അന്തിമവരവുവരെ’
  rationale: ഇവിടെ വരവിന്റെ സ്വഭാവമോ സമയമോ ഗ്രീക്ക് പാഠം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായി തീർപ്പാക്കാതെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി. ബഹുവചന അഭിസംബോധന ‘നിങ്ങൾ’ ഉപയോഗിച്ചിരിക്കുന്നു; പരിചിതമായെങ്കിലും ഇന്നും വ്യക്തമായ ‘മുറുകെപ്പിടിക്കുക’ എന്ന പ്രയോഗം നിലനിർത്തി.
