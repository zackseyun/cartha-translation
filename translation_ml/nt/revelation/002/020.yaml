id: REV.2.20
reference: Revelation 2:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: ml
  text: 'എന്നാൽ, നിനക്കെതിരെ എനിക്ക് ഇതുണ്ട്: സ്വയം പ്രവാചകയെന്നു വിളിക്കുന്ന[b] ഈസബേൽ എന്ന സ്ത്രീയെ[a] നീ അനുവദിക്കുന്നു. അവൾ എന്റെ അടിമകളെ ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടാനും വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം കഴിക്കാനും പഠിപ്പിക്കുകയും വഴിതെറ്റിക്കുകയും[c] ചെയ്യുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ഈസബേൽ എന്ന സ്ത്രീയെ’ എന്നതിനുപകരം ‘നിന്റെ ഭാര്യയായ ഈസബേലിനെ’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘താൻ പ്രവാചകയാണെന്ന് അവകാശപ്പെടുന്ന.’'
    reason: lexical_alternative
  - marker: c
    text: ‘വഴിതെറ്റിക്കുന്നു’ എന്നത് ‘വഞ്ചിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ പ്രശംസയ്ക്കു വിരുദ്ധമായി ശക്തമായ ആക്ഷേപം അവതരിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാള പ്രയോഗം.
- source_word: ἔχω κατὰ σοῦ
  choice: നിനക്കു വിരോധമായി എനിക്ക് ഇതുണ്ട്
  rationale: ആരോപണമോ പരാതിയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἀφεῖς
  choice: നീ അനുവദിക്കുന്നു
  rationale: ദോഷകരമായ പ്രവൃത്തി തുടരാൻ വിട്ടുകൊടുക്കുന്നതാണ് ഇവിടെ അർഥം; 'അനുവദിക്കുന്നു' സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: ഈസബേൽ എന്ന സ്ത്രീയെ
  rationale: സ്ത്രീ എന്ന പദവും പേരും നിലനിർത്തുന്നു; 'നിന്റെ ഭാര്യ' എന്ന പാഠഭേദം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: സ്വയം പ്രവാചകയെന്നു വിളിക്കുന്ന
  rationale: സ്ത്രീലിംഗമായ προφῆτιν വ്യക്തമാക്കുകയും അവകാശവാദത്തിന്റെ സ്വഭാവം അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: διδάσκει
  choice: പഠിപ്പിക്കുകയും
  rationale: തുടരുന്ന പ്രവർത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: πλανᾷ
  choice: വഴിതെറ്റിക്കുകയും
  rationale: സത്യത്തിൽനിന്നോ ശരിയായ പെരുമാറ്റത്തിൽനിന്നോ തെറ്റിച്ചുകൊണ്ടുപോകുക എന്ന ക്രിയയുടെ ദിശാത്മക ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: τοὺς ἐμοὺς δούλους
  choice: എന്റെ അടിമകളെ
  rationale: ക്രിസ്തുവിനോടുള്ള ഉടമസ്ഥബന്ധവും പൂർണമായ വിധേയത്വവും ഇവിടെ പ്രസക്തമായതിനാൽ δοῦλος എന്നതിന്റെ ശക്തമായ അർഥം നിലനിർത്തുന്നു.
- source_word: πορνεῦσαι
  choice: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടാനും
  rationale: അനുവദിക്കപ്പെടാത്ത ലൈംഗിക പെരുമാറ്റത്തെ ആധുനികവും വ്യക്തവുമായ ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം കഴിക്കാനും
  rationale: വിഗ്രഹാരാധനയിലെ ബലിയുമായി ബന്ധപ്പെട്ട ഭക്ഷണം എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ഈസബേൽ’ എന്നതിന്റെ തിരിച്ചറിയൽ
  choice: പാഠത്തിലുള്ള പേര് അതേപടി നിലനിർത്തി; അത് യഥാർഥ വ്യക്തിനാമമാണോ പഴയനിയമത്തിലെ ഈസബേലിനെ സൂചിപ്പിക്കുന്ന പ്രതീകാത്മക പേരാണോ എന്ന് നിർണയിച്ചിട്ടില്ല.
  alternative: ഈസബേൽ എന്ന യഥാർഥ പേരുള്ള സ്ത്രീ; അല്ലെങ്കിൽ പഴയനിയമത്തിലെ ഈസബേലിനെ അനുസ്മരിപ്പിക്കുന്ന പ്രതീകാത്മക വിശേഷണം.
  rationale: വാക്യം തന്നെ ഈ ചോദ്യം തീർപ്പാക്കുന്നില്ല; അതിനാൽ യഥാർഥമായ വ്യാഖ്യാനസന്ദിഗ്ധത സംരക്ഷിക്കുന്നു.
- issue: δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: എന്റെ അടിമകളെ
  alternative: എന്റെ ദാസന്മാരെ / എന്റെ സേവകരെ
  rationale: ‘എന്റെ’ എന്ന ഉടമസ്ഥസൂചനയോടൊപ്പം ക്രിസ്തുവിനോടുള്ള ബന്ധിതമായ ചേർച്ച ഇവിടെ പ്രധാനമായതിനാൽ ‘അടിമകൾ’ മൂലപദത്തിന്റെ ശക്തി കൂടുതൽ സുതാര്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ആരോപണത്തിന്റെ ശക്തിയും ഈസബേലിന്റെ തിരിച്ചറിയലിലുള്ള സന്ദിഗ്ധതയും നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിട്ടുണ്ട്.
