revisions:
- from: ചെവിയുള്ളവൻ സഭകളോട് ആത്മാവ് പറയുന്നത് കേൾക്കട്ടെ. ജയിക്കുന്നവന് മറച്ചുവെച്ചിരിക്കുന്ന മന്നായിൽനിന്ന് ഞാൻ കുറെ കൊടുക്കും; അവന് ഒരു വെള്ളക്കല്ലും കൊടുക്കും. ആ കല്ലിന്മേൽ ഒരു പുതിയ പേര് എഴുതിയിരിക്കും; അത് ലഭിക്കുന്നവനല്ലാതെ മറ്റാരും ആ പേര് അറിയുകയില്ല.[a]
  to: ചെവിയുള്ളവൻ, ആത്മാവ് സഭകളോടു പറയുന്നതു കേൾക്കട്ടെ. ജയിക്കുന്നവന് ഞാൻ മറഞ്ഞിരിക്കുന്ന മന്നായിൽനിന്ന് കുറെ കൊടുക്കും; അവന് ഒരു വെള്ളക്കല്ലും[a] അതിൽ എഴുതപ്പെട്ടിരിക്കുന്ന ഒരു പുതിയ പേരും കൊടുക്കും. ആ പേര് സ്വീകരിക്കുന്നവനല്ലാതെ മറ്റാരും അറിയുകയില്ല.
  rationale: 'The revision improves Malayalam word order and restores the Greek structure of the promise: hidden manna, a white stone, and a new name written on the stone. It does not identify the name’s owner or decide the symbolic meaning of the white stone. The note is anchored at the relevant expression, and the final clause retains the source text’s implicit object with ‘സ്വീകരിക്കുന്നവൻ.’'
  reviewer_model: gpt-5.6-terra
