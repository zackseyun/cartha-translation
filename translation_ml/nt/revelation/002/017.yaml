id: REV.2.17
reference: Revelation 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: ml
  text: ചെവിയുള്ളവൻ, ആത്മാവ് സഭകളോടു പറയുന്നതു കേൾക്കട്ടെ. ജയിക്കുന്നവന് ഞാൻ മറഞ്ഞിരിക്കുന്ന മന്നായിൽനിന്ന് കുറെ കൊടുക്കും; അവന് ഒരു വെള്ളക്കല്ലും[a] അതിൽ എഴുതപ്പെട്ടിരിക്കുന്ന ഒരു പുതിയ പേരും കൊടുക്കും. ആ പേര് സ്വീകരിക്കുന്നവനല്ലാതെ മറ്റാരും അറിയുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വെള്ളക്കല്ല്’ വോട്ടിനുപയോഗിച്ച കല്ലിനെയോ, കുറ്റവിമുക്തിയുടെ അടയാളത്തെയോ, പ്രവേശനത്തിനുള്ള അടയാളക്കല്ലിനെയോ സൂചിപ്പിക്കാം; ഏത് പശ്ചാത്തലമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് പാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: ചെവിയുള്ളവൻ
  rationale: ഗ്രീക്കിലെ ഏകവചന ശൈലി സ്വാഭാവികവും പരിചിതവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; പ്രയോഗം പൊതുവായി ഏവരെയും ഉദ്ദേശിക്കുന്നു.
- source_word: ἀκουσάτω
  choice: കേൾക്കട്ടെ
  rationale: ആജ്ഞാർഥത്തെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: മൂലപാഠം ‘പരിശുദ്ധാത്മാവ്’ എന്ന് വിശദീകരിക്കാതെ ‘ആത്മാവ്’ എന്നു മാത്രമാണ് പറയുന്നത്; അതേ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: ταῖς ἐκκλησίαις
  choice: സഭകളോട്
  rationale: വെളിപ്പാടിലെ അഭിസംബോധനാസൂത്രത്തിൽ ἐκκλησία പ്രാദേശിക വിശ്വാസസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ സ്ഥാപിതമായ മലയാളപദം ഉപയോഗിക്കുന്നു.
- source_word: τῷ νικῶντι
  choice: ജയിക്കുന്നവന്
  rationale: νικάωയുടെ വിജയിക്കുക/അതിജയിക്കുക എന്ന സജീവ അർഥം പ്രകടമാക്കുന്നു; തുടരുന്ന വിശ്വസ്ത ജയത്തിന്റെ ഭാവവും നിലനിൽക്കുന്നു.
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: മറച്ചുവെച്ചിരിക്കുന്ന മന്നായിൽനിന്ന് കുറെ
  rationale: δίδωμι-ക്കുശേഷമുള്ള വിഭജനസൂചക ഷഷ്ഠി മന്നായിൽനിന്നുള്ള ഒരു പങ്കിനെ സൂചിപ്പിക്കുന്നു; perfect participle-ന്റെ നിലനിൽക്കുന്ന മറവിയുടെ ഭാവം ‘മറച്ചുവെച്ചിരിക്കുന്ന’ എന്നു നൽകുന്നു.
- source_word: ψῆφον λευκήν
  choice: ഒരു വെള്ളക്കല്ല്
  rationale: ψῆφος ചെറുകല്ല്, വോട്ടുകല്ല്, അടയാളക്കല്ല് തുടങ്ങിയ പശ്ചാത്തലങ്ങൾക്കു സാധ്യത നൽകുന്നു; പ്രധാനപാഠത്തിൽ അവയിൽ ഒന്നും നിർബന്ധിച്ച് നിശ്ചയിക്കാതെ ലളിതമായ ‘കല്ല്’ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον
  choice: ആ കല്ലിന്മേൽ ഒരു പുതിയ പേര് എഴുതിയിരിക്കും
  rationale: കല്ലിന്മേലുള്ള ലിഖിതത്തിന്റെ സ്ഥാനം വ്യക്തമാക്കുകയും perfect participle സൂചിപ്പിക്കുന്ന പൂർത്തിയായ, നിലനിൽക്കുന്ന എഴുത്തിനെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: അത് ലഭിക്കുന്നവനല്ലാതെ മറ്റാരും ആ പേര് അറിയുകയില്ല
  rationale: ബന്ധവാക്യം ‘പുതിയ പേര്’ എന്നതിനെ വിശേഷിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നു; λαμβάνων-ന്റെ വസ്തു വ്യാകരണപരമായി തുറന്നതിനാൽ ‘അത്’ കല്ല്/അതോടുകൂടിയ പേരിന്റെ സമുച്ചയത്തെ സൂചിപ്പിക്കാൻ അനുവദിക്കുന്നു.
theological_decisions:
- issue: ഏകവചന പുരുഷലിംഗ രൂപങ്ങളുടെ പൊതുവ്യാപ്തി
  choice: ‘ചെവിയുള്ളവൻ’, ‘ജയിക്കുന്നവന്’, ‘ലഭിക്കുന്നവൻ’ എന്നീ ഏകവചന രൂപങ്ങൾ നിലനിർത്തി
  alternative: ലിംഗനിരപേക്ഷ ബഹുവചനമോ ‘ആരെങ്കിലും’ എന്ന ആവർത്തനമോ ഉപയോഗിക്കുക
  rationale: ഗ്രീക്ക് വ്യാകരണപരമായി പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും ഉദ്ദേശ്യം പൊതുവ്യാപകമാണ്. മലയാളത്തിലെ ഈ പങ്കാളിത്തരൂപങ്ങൾ സ്വാഭാവികമായി പൊതുവായ അർഥത്തിൽ പ്രവർത്തിക്കുന്നു; അനാവശ്യമായി ബഹുവചനമാക്കേണ്ടതില്ല.
- issue: വെള്ളക്കല്ലിന്റെ പ്രതീകാത്മക പശ്ചാത്തലം
  choice: പ്രധാനപാഠത്തിൽ ‘ഒരു വെള്ളക്കല്ല്’ എന്നു മാത്രം നൽകി; സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു
  alternative: കുറ്റവിമുക്തിയുടെ അടയാളം, വിരുന്നിലേക്കുള്ള പ്രവേശനചിഹ്നം, അല്ലെങ്കിൽ വോട്ടുകല്ല് എന്നു നിർണ്ണയിക്കുക
  rationale: വാക്യം തന്നെ കല്ലിന്റെ സാംസ്കാരിക ഉപയോഗം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക വ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ പ്രതീകത്തിന്റെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: പുതിയ പേര് ആരുടേതെന്ന ചോദ്യം
  choice: ‘ഒരു പുതിയ പേര്’ എന്ന മൂലപാഠത്തിലെ അനിശ്ചിതത്വം നിലനിർത്തി
  alternative: അത് ക്രിസ്തുവിന്റെ പേരോ സ്വീകരിക്കുന്നവന്റെ പേരോ എന്നു വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് പേര് ആരുടേതാണെന്ന് തുറന്നുപറയുന്നില്ല; അതിനാൽ വിവർത്തനം ആ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. വെളിപ്പാടിന്റെ ആവർത്തിത ആഹ്വാനശൈലി നിലനിർത്തിയിട്ടുണ്ട്. വാക്യത്തിന്റെ അവസാനഭാഗം സ്വാഭാവിക മലയാളത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; അർഥബന്ധം മാറ്റിയിട്ടില്ല.
