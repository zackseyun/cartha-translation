  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: ml
  text: 'എന്നാൽ നിനക്കിത് ഉണ്ട്: നിക്കൊലായരുടെ പ്രവൃത്തികളെ[a] നീ വെറുക്കുന്നു; ഞാനും അവയെ വെറുക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രവൃത്തികൾ’ എന്നതിനു പകരം ‘ചെയ്തികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം പ്രവർത്തനങ്ങളെയോ ആചാരരീതികളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: τοῦτο ἔχεις
  choice: നിനക്കുള്ള ഒരു ഗുണം ഇതാണ്
  rationale: അക്ഷരാർഥം ‘ഇത് നിനക്കുണ്ട്’ എന്നാണെങ്കിലും, ഇവിടെ അംഗീകരിക്കപ്പെടുന്ന ഒരു സവിശേഷതയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മുൻനിർത്തിയ τοῦτοയുടെ ഊന്നലും ‘ഇതാണ്’ എന്ന ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: ':'
  rationale: അവർക്കുള്ളത് എന്താണെന്ന് തുടർന്നുള്ള വാക്യം വിശദീകരിക്കുന്നതിനാൽ മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി ആ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.
- source_word: μισεῖς
  choice: നീ വെറുക്കുന്നു
  rationale: μισέωയുടെ ശക്തമായ അർഥം മയപ്പെടുത്താതെ നൽകുന്നു.
- source_word: τὰ ἔργα
  choice: പ്രവൃത്തികളെ
  rationale: പ്രയോഗങ്ങൾ ഉൾപ്പെടെയുള്ള പ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കാൻ ἔργαയുടെ സുതാര്യവും സാധാരണവുമായ മലയാളസമാനപദം.
- source_word: τῶν Νικολαϊτῶν
  choice: നിക്കൊലായരുടെ
  rationale: സംഘനാമം മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്ത് ബന്ധരൂപത്തിൽ നൽകുന്നു.
- source_word: ἃ
  choice: അവയെ
  rationale: നപുംസക ബഹുവചന സർവനാമം മുൻപുള്ള ‘പ്രവൃത്തികളെ’ തന്നെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: καὶ ἐγώ എന്ന സംയുക്തരൂപത്തിലെ ‘ഞാനും’ എന്ന പങ്കിട്ട നിലപാട് കൃത്യമായി നൽകുന്നു.
- source_word: μισῶ
  choice: വെറുക്കുന്നു
  rationale: മുൻപുള്ള μισεῖς എന്ന അതേ ക്രിയയോടുള്ള ആവർത്തനവും ശക്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: വെറുപ്പിന്റെ വിഷയം
  choice: വെറുക്കപ്പെടുന്നത് നിക്കൊലായരുടെ പ്രവൃത്തികളാണെന്ന് വ്യക്തമായി പറയുന്നു.
  alternative: വാക്യം അയവോടെ പരിഭാഷപ്പെടുത്തി നിക്കൊലായർ എന്ന ആളുകളെത്തന്നെ വെറുക്കുന്നതായി ധ്വനിപ്പിക്കുക.
  rationale: τὰ ἔργα ആണ് നേരിട്ടുള്ള കർമം; അതിനാൽ ആളുകളല്ല, അവരുടെ പ്രവൃത്തികളാണ് വാചകത്തിൽ വെറുപ്പിന്റെ വിഷയമാകുന്നത്.
- issue: സഭയുടെ നിലപാടിനോടുള്ള സംസാരിക്കുന്നവന്റെ യോജിപ്പ്
  choice: ‘ഞാനും അവയെ വെറുക്കുന്നു’
  alternative: ‘അവയെ ഞാനും വെറുക്കുന്നു’
  rationale: κἀγὼയിലെ ‘ഞാനും’ എന്ന അർഥവും μισῶയുടെ ശക്തിയും നേരിട്ട് നിലനിർത്തുന്നു; ‘അവയെ’ ചേർക്കുന്നത് പ്രവൃത്തികളിലേക്കുള്ള സൂചന വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നീ’ നിലനിർത്തുന്നു. ‘നിക്കൊലായർ’ ഒരു സംഘനാമമായി ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
