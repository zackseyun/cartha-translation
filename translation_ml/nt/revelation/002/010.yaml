id: REV.2.10
reference: Revelation 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: ml
  text: നീ സഹിക്കാനിരിക്കുന്നതൊന്നും ഭയപ്പെടേണ്ടാ. ഇതാ, നിങ്ങളിൽ ചിലരെ പിശാച് തടവിലാക്കാൻ പോകുന്നു, നിങ്ങൾ പരീക്ഷിക്കപ്പെടേണ്ടതിന്[a]; നിങ്ങൾ പത്ത് ദിവസം കഷ്ടത അനുഭവിക്കും. മരണം വരെ വിശ്വസ്തനായിരിക്കുക[b], അപ്പോൾ ഞാൻ നിനക്കു ജീവന്റെ കിരീടം നൽകും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പരീക്ഷിക്കപ്പെടേണ്ടതിന്” എന്നതിന്റെ ഗ്രീക്കുപദത്തിന് “ശോധിക്കപ്പെടേണ്ടതിന്” എന്നും, സന്ദർഭാനുസരിച്ച് “പ്രലോഭിപ്പിക്കപ്പെടേണ്ടതിന്” എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “മരണം വരെ” എന്നത് “മരിക്കേണ്ടിവന്നാലും” അഥവാ “മരണത്തോളം” എന്നും അർത്ഥമാക്കാം; രക്തസാക്ഷിത്വം ആവശ്യമായാലും വിശ്വസ്തനായിരിക്കണമെന്ന ആശയം ഇതിൽ ഉൾപ്പെടാം.
    reason: alternative_reading
  - marker: c
    text: “കിരീടം” എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദം (സ്തെഫാനൊസ്) രാജകീയ മകുടത്തെയല്ല, വിജയിക്കു സമ്മാനമായി നൽകുന്ന വിജയമാലയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: ഒന്നും ഭയപ്പെടേണ്ടാ
  rationale: μηδέν ചേർന്ന നിരോധനകല്പനയുടെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἃ μέλλεις πάσχειν
  choice: നീ സഹിക്കാനിരിക്കുന്നത്
  rationale: μέλλω സൂചിപ്പിക്കുന്ന സമീപഭാവിയും πάσχωയുടെ കഷ്ടം അനുഭവിക്കുക എന്ന അർത്ഥവും സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരചിഹ്നത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: μέλλει βάλλειν ... εἰς φυλακήν
  choice: തടവിലിടാനിരിക്കുന്നു
  rationale: അക്ഷരാർഥമായ ‘തടവറയിലേക്ക് എറിയുക’ എന്നതിനുപകരം, മലയാളത്തിൽ ഫലവും സമീപഭാവിയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὁ διάβολος
  choice: പിശാച്
  rationale: ഇവിടെ വ്യക്തിപരമായ അതീന്ദ്രിയ എതിരാളിയെ സൂചിപ്പിക്കുന്ന പതിവുപദം.
- source_word: ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ചിലരെ
  rationale: കൂട്ടത്തിൽനിന്നുള്ള ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിന്റെ അർത്ഥം വ്യക്തമായി പകരുന്നു.
- source_word: ἵνα πειρασθῆτε
  choice: നിങ്ങളെ പരീക്ഷിക്കേണ്ടതിന്
  rationale: πειράζωയുടെ പരീക്ഷണം, ശോധന, പ്രലോഭനം എന്നീ സാധ്യതകളിൽ പീഡനസന്ദർഭത്തിന് ‘പരീക്ഷിക്കുക’ ഏറ്റവും യോജിക്കുന്നു; അവ്യക്തത കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἕξετε θλῖψιν
  choice: നിങ്ങൾക്കു കഷ്ടതയുണ്ടാകും
  rationale: θλῖψις സൂചിപ്പിക്കുന്ന പീഡനജന്യമായ ദുരിതം സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ἡμερῶν δέκα
  choice: പത്തു ദിവസം
  rationale: കാലദൈർഘ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: γίνου πιστός
  choice: വിശ്വസ്തനായിരിക്കുക
  rationale: ആ അവസ്ഥയിൽ പ്രവേശിക്കുകയും തുടർന്നുനിൽക്കുകയും ചെയ്യാനുള്ള കല്പനയെ സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἄχρι θανάτου
  choice: മരണംവരെ
  rationale: ജീവിതാവസാനംവരെയുള്ള സ്ഥിരതയും, ആവശ്യമെങ്കിൽ മരണത്തെ നേരിടുന്നതുവരെയുള്ള വിശ്വസ്തതയും ഉൾക്കൊള്ളുന്ന നേരിട്ടുള്ള വിവർത്തനം.
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: ജീവന്റെ കിരീടം
  rationale: സ്ഥിരമായ ബൈബിൾ രൂപകത്തെ നിലനിർത്തുന്നു; στέφανος രാജകിരീടമല്ല, വിജയിക്ക് ലഭിക്കുന്ന മാലയാണെന്ന സാംസ്കാരിക വിവരം കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: πειρασθῆτε എന്നതിന്റെ അർത്ഥം
  choice: പരീക്ഷിക്കേണ്ടതിന്
  alternative: ശോധിക്കേണ്ടതിന്; പ്രലോഭിപ്പിക്കപ്പെടേണ്ടതിന്
  rationale: തടവും പീഡനവും വിശ്വസ്തതയെ പരിശോധിക്കുന്ന പശ്ചാത്തലത്തിൽ ‘പരീക്ഷിക്കുക’ യോജിക്കുന്നു; എന്നാൽ ഗ്രീക്കുപദത്തിന്റെ മറ്റു അർത്ഥസാധ്യതകൾ കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ἄχρι θανάτου എന്നതിന്റെ വ്യാപ്തി
  choice: മരണംവരെ
  alternative: മരണത്തോളം; മരിക്കേണ്ടിവന്നാലും
  rationale: വാക്യം രക്തസാക്ഷിത്വം മാത്രം എന്ന് ചുരുക്കാതെ, മരണംവരെയുള്ള സ്ഥിരവിശ്വസ്തതയും മരണത്തെ നേരിടാനുള്ള സന്നദ്ധതയും ഉൾക്കൊള്ളാൻ അനുവദിക്കുന്നു.
- issue: στέφανος എന്ന പ്രതിഫലരൂപകം
  choice: കിരീടം
  alternative: വിജയമാല
  rationale: പരിചിതമായ തിരുവെഴുത്തുപ്രയോഗം നിലനിർത്തിക്കൊണ്ട്, രാജകീയ മകുടവുമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സാംസ്കാരിക വിശദീകരണം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധന (‘നീ/നിനക്കു’)യും സഭയിലെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനം (‘നിങ്ങളിൽ/നിങ്ങൾക്കു’)യും ഗ്രീക്ക് വചനത്തോട് അനുസൃതമായി വേർതിരിച്ചു. ‘ഇതാ’ ശ്രദ്ധാകർഷക കണികയായി നിലനിർത്തി.
