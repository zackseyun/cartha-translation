id: REV.2.21
reference: Revelation 2:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: ml
  text: അവൾ മാനസാന്തരപ്പെടേണ്ടതിന് ഞാൻ അവൾക്കു സമയം കൊടുത്തു; എന്നാൽ തന്റെ ലൈംഗിക അധാർമികതയിൽനിന്ന് മാനസാന്തരപ്പെടാൻ അവൾക്കു മനസ്സില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκα
  choice: ഞാൻ ... കൊടുത്തു
  rationale: അയോറിസ്റ്റ് സൂചകക്രിയയെ ഈ സന്ദർഭത്തിൽ പൂർത്തിയായ ഒരു പ്രവൃത്തിയായി ലളിതമായ ഭൂതകാലത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: αὐτῇ
  choice: അവൾക്കു
  rationale: സ്ത്രീലിംഗ ഏകവചന ദത്തിവ്; തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ യെസബേൽ എന്നു വിളിക്കപ്പെടുന്ന സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: χρόνον
  choice: സമയം
  rationale: മാനസാന്തരത്തിനായി അനുവദിച്ച കാലയളവ് എന്ന ആശയം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: ἵνα μετανοήσῃ
  choice: മാനസാന്തരപ്പെടേണ്ടതിന്
  rationale: ἵνα സഹിതമുള്ള അയോറിസ്റ്റ് സബ്ജങ്‌ടീവ് ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉദ്ദേശ്യബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐ θέλει
  choice: മനസ്സില്ല
  rationale: θέλω ഇവിടെ ഇച്ഛയെയോ സന്നദ്ധതയെയോ സൂചിപ്പിക്കുന്നു. ‘നിരസിച്ചു’ എന്നതിനെക്കാൾ കുറച്ച് വ്യാഖ്യാനാത്മകമായി അവളുടെ മനസ്സില്ലായ്മ അറിയിക്കുന്നു.
- source_word: μετανοῆσαι
  choice: മാനസാന്തരപ്പെടാൻ
  rationale: θέλει എന്ന ക്രിയയെ പൂർത്തിയാക്കുന്ന ഇൻഫിനിറ്റീവിന്റെ അർഥം നൽകുകയും ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐκ τῆς πορνείας αὐτῆς
  choice: തന്റെ ലൈംഗിക അധാർമികതയിൽനിന്ന്
  rationale: ἐκ എന്നതിന്റെ ‘നിന്ന്/വിട്ട്’ എന്ന ദിശാബോധം സംരക്ഷിക്കുന്നു; πορνείαയുടെ ലൈംഗിക അർഥവ്യാപ്തി പൊതുവായ ‘അധാർമികത’ എന്നതിലേക്കു മങ്ങിപ്പോകാതെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അപ്പോക്കലിപ്റ്റിക് ശാസനാസന്ദർഭത്തിലെ πορνείαയുടെ അർഥം
  choice: ലൈംഗിക അധാർമികത
  alternative: അധാർമികത; വേശ്യാവൃത്തി; പരസംഗം
  rationale: പദത്തിന് പ്രവാചക-അപ്പോക്കലിപ്റ്റിക് ഭാഷയിൽ രൂപകാലങ്കാരപരമോ വിഗ്രഹാരാധനാസംബന്ധമോ ആയ പ്രതിധ്വനി ഉണ്ടാകാമെങ്കിലും അതിന്റെ അടിസ്ഥാനാർഥം ലൈംഗിക അധാർമികതയാണ്. പ്രധാന പാഠം ആ അർഥം നൽകുന്നു; വിശാലമായ പ്രതീകാത്മക സാധ്യതയെ നിഷേധിക്കുന്നില്ല.
- issue: μετανοέω + ἐκ എന്ന ഘടനയുടെ ദിശാബോധം
  choice: ലൈംഗിക അധാർമികതയിൽനിന്ന് മാനസാന്തരപ്പെടുക
  alternative: ലൈംഗിക അധാർമികതയെക്കുറിച്ച് മാനസാന്തരപ്പെടുക
  rationale: ἐκ എന്ന അവ്യയം ദോഷകരമായ പെരുമാറ്റത്തിൽനിന്നുള്ള തിരിഞ്ഞുമാറ്റം ഊന്നുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ഈ ഘടന നിലനിർത്താനാകുന്നതിനാൽ അതിനെ മങ്ങിക്കേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ രണ്ട് ‘മാനസാന്തരപ്പെടുക’ പ്രയോഗങ്ങളും ഊന്നലിനായി നിലനിർത്തി. ഇവിടെ ആവശ്യമായ പ്രത്യേക പാഠാന്തരക്കുറിപ്പ് ഇല്ല; ഇംഗ്ലീഷ് കുറിപ്പിലെ കൂടുതൽ അക്ഷരാർഥമുള്ള ‘from’ പ്രധാന മലയാളപാഠത്തിൽ തന്നെയുണ്ട്.
