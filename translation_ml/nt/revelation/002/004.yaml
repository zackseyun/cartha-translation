id: REV.2.4
reference: Revelation 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι τὴν ἀγάπην σου τὴν πρώτην ἀφῆκες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/004.yaml
  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: ml
  text: 'എന്നാൽ, നിനക്കെതിരെ എനിക്കുള്ള പരാതി ഇതാണ്: നിന്റെ ആദ്യ സ്നേഹം നീ ഉപേക്ഷിച്ചിരിക്കുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ആദ്യ സ്നേഹം നീ വിട്ടുകളഞ്ഞിരിക്കുന്നു.’ ഈ പ്രയോഗം നിനക്കു ആദ്യം ഉണ്ടായിരുന്ന സ്നേഹത്തെ സൂചിപ്പിക്കാം—കർത്താവിനോടുള്ള സ്നേഹമോ, പരസ്പരമുള്ള സ്നേഹമോ, രണ്ടുമോ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻപുള്ള പ്രശംസയോട് വ്യക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള പ്രയോഗം.
- source_word: ἔχω κατὰ σοῦ
  choice: നിനക്കെതിരെ എനിക്ക് ഇതുണ്ട്
  rationale: ഒരാളിനെതിരെ ഒരു കുറ്റമോ പരാതിയോ ഉണ്ടെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശാസനാത്മക ഭാവം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: ':'
  rationale: പരാതിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ὅτιയെ മലയാളത്തിൽ സ്വാഭാവികമായി കോളൺകൊണ്ട് പ്രതിനിധീകരിക്കുന്നു; ‘കാരണം’ എന്നു നൽകിയാൽ വാക്യഘടനയെ അനാവശ്യമായി വ്യാഖ്യാനിച്ചേക്കാം.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ἀγάπη എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാള തത്തുല്യം.
- source_word: τὴν πρώτην
  choice: ആദ്യ
  rationale: ‘ആദ്യത്തെ/ആദിമമായ’ എന്ന അടിസ്ഥാന അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുകയും സ്നേഹത്തിന്റെ ലക്ഷ്യം ആരാണെന്ന് നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀφῆκες
  choice: ഉപേക്ഷിച്ചിരിക്കുന്നു
  rationale: ἀφίημι ഇവിടെ സൂചിപ്പിക്കുന്ന വിട്ടുകളയൽ അഥവാ പരിത്യജിക്കൽ ഗൗരവത്തോടെ അറിയിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പൂർത്തിക്രിയാരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘നിന്റെ ആദ്യസ്നേഹം’ എന്നതിന്റെ വിവക്ഷ
  choice: നിന്റെ ആദ്യസ്നേഹം
  alternative: ആദ്യം നിനക്കുണ്ടായിരുന്ന സ്നേഹം; കർത്താവിനോടുള്ള ആദ്യസ്നേഹം; പരസ്പരമുള്ള ആദ്യസ്നേഹം
  rationale: ഗ്രീക്ക് പ്രയോഗം സ്നേഹത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അത് കർത്താവിനോടുള്ള സ്നേഹമോ, പരസ്പരസ്നേഹമോ, രണ്ടുമോ എന്നു മുഖ്യവാചകത്തിൽ തീരുമാനിക്കാതെ യഥാർഥമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നിനക്ക്/നിന്റെ/നീ’ സഭയെ ഏകകമായി അഭിസംബോധന ചെയ്യുന്ന ഗ്രീക്ക് രൂപം നിലനിർത്തുന്നു.
