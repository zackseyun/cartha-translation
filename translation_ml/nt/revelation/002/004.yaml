revisions:
- from: 'എന്നാൽ നിനക്കെതിരെ എനിക്ക് ഇതുണ്ട്: നിന്റെ ആദ്യസ്നേഹം നീ ഉപേക്ഷിച്ചിരിക്കുന്നു.[a]'
  to: 'എന്നാൽ, നിനക്കെതിരെ എനിക്കുള്ള പരാതി ഇതാണ്: നിന്റെ ആദ്യ സ്നേഹം നീ ഉപേക്ഷിച്ചിരിക്കുന്നു.[a]'
  rationale: The revision replaces a literal but less natural rendering of the Greek complaint idiom with an idiomatic Malayalam equivalent, while preserving its rebuking force. It also regularizes spacing in ‘ആദ്യ സ്നേഹം’ and aligns the footnote’s person with the singular collective address in the source and main text. No theological interpretation has been added.
  reviewer_model: gpt-5.6-terra
