    issue: The main clause is somewhat calqued and awkward in modern Malayalam.
    rationale: The Greek idiom can naturally be represented as a stated complaint in Malayalam. This improves idiomatic fluency while retaining the same charge.
  - severity: low
    issue: The footnote’s ‘അവർക്കുണ്ടായിരുന്ന’ changes the main text’s singular second-person framing.
    rationale: Using ‘നിനക്കു’ better corresponds to the Greek σου and to the translation’s stated collective-singular address, while leaving the corporate referent intact.
