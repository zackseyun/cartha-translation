id: REV.2.26
reference: Revelation 2:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου, δώσω αὐτῷ ἐξουσίαν ἐπὶ τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: ml
  text: ജയിക്കുകയും[a] എന്റെ പ്രവൃത്തികൾ[b] അവസാനംവരെ കാത്തുപാലിക്കുകയും ചെയ്യുന്നവന് ഞാൻ ജനതകളുടെമേൽ അധികാരം നൽകും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിജയിക്കുകയും’.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ പ്രവൃത്തികൾ’ എന്നത് യേശുവിന്റേതോ അവനോടു ചേർന്നതോ അവൻ ആവശ്യപ്പെടുന്നതോ ആയ പ്രവൃത്തികളെ സൂചിപ്പിക്കാം; ഗ്രീക്ക് ഈ ബന്ധം കൂടുതൽ കൃത്യമായി നിർവചിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘ജയിക്കുന്നവൻ ... കാത്തുപാലിക്കുന്നവൻ ... അവന്’ എന്ന പുരുഷലിംഗ ഏകവചനരൂപങ്ങളാണ്; ഇവിടെ അവ പ്രതിനിധിപരമായ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ νικῶν
  choice: ജയിക്കുന്നവൻ / ജയിക്കുകയും ... ചെയ്യുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം ഒരു വ്യക്തിയെ വിശേഷിപ്പിക്കുന്നു. ‘ജയിക്കുക’ എന്നത് വെളിപ്പാടുപുസ്തകത്തിലെ പോരാട്ടത്തിന്റെയും വിജയത്തിന്റെയും സജീവമായ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: ὁ τηρῶν
  choice: കാത്തുപാലിക്കുന്നവൻ
  rationale: τηρέω എന്നതിന് കാത്തുസൂക്ഷിക്കുക, പാലിക്കുക, അനുസരിച്ച് നിലകൊള്ളുക എന്നീ അർഥവ്യാപ്തിയുണ്ട്. ‘കാത്തുപാലിക്കുക’ വിശ്വസ്തമായ അനുഷ്ഠാനത്തിന്റെ ആശയം നൽകുമ്പോഴും അർഥം ‘അനുസരിക്കുക’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἄχρι τέλους
  choice: അവസാനംവരെ
  rationale: അന്തിമഘട്ടംവരെ തുടരുന്ന സ്ഥിരതയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലപ്രയോഗം.
- source_word: τὰ ἔργα μου
  choice: എന്റെ പ്രവൃത്തികൾ
  rationale: ഗ്രീക്കിലെ ഉടമസ്ഥബന്ധം അതേപടി നിലനിർത്തുന്നു; ഇത് യേശുവിന്റെ സ്വന്തം പ്രവൃത്തികളെയോ അവനോടു ചേർന്ന പ്രവൃത്തികളെയോ അവൻ ആവശ്യപ്പെടുന്ന പ്രവൃത്തികളെയോ സൂചിപ്പിക്കുന്നുവെന്ന് വിവർത്തനത്തിൽ നിർബന്ധമായി തീരുമാനിക്കുന്നില്ല.
- source_word: δώσω αὐτῷ
  choice: ചെയ്യുന്നവന് ഞാൻ ... നൽകും
  rationale: ഏകവചനത്തിലുള്ള സ്വീകർത്താവിനെ മലയാളത്തിൽ ദാതൃവിഭക്തിയിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഭാവികാലമായ ‘നൽകും’ δίδωμι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സൂക്ഷിക്കുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: ഭരിക്കാനുള്ള അവകാശമോ ഏല്പിക്കപ്പെട്ട അധികാരമോ എന്ന അർഥം ഇവിടെ ‘ശക്തി’ എന്നതിനെക്കാൾ കൃത്യമായി നൽകുന്നു.
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: ജനതകളുടെമേൽ
  rationale: ലോകത്തിലെ ജനതകളുടെമേലുള്ള ഭരണാധികാരമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; യെഹൂദരല്ലാത്തവർ എന്ന അർഥത്തിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പുരുഷലിംഗ ഏകവചനത്തിന്റെ പ്രതിനിധിപരമായ പ്രയോഗം
  choice: മുഖ്യവാക്യത്തിൽ ഏകവചനത്തിലുള്ള ‘ചെയ്യുന്നവന്’ എന്ന രൂപം ഉപയോഗിക്കുക
  alternative: ‘അവന്’ എന്ന് തുറന്ന പുരുഷലിംഗ സർവനാമം ചേർക്കുക
  rationale: ഗ്രീക്കിൽ പുരുഷലിംഗ ഏകവചന കൃദന്തരൂപവും സർവനാമവുമാണുള്ളത്. മലയാളത്തിലെ ‘ചെയ്യുന്നവന്’ ഏകവചനം സൂക്ഷിക്കുകയും പുരുഷന്മാർക്കു മാത്രമുള്ള വാഗ്ദാനമെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു; പ്രതിനിധിപരമായ മൂലരൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ‘എന്റെ പ്രവൃത്തികൾ’ എന്നതിലെ ബന്ധം
  choice: ‘എന്റെ പ്രവൃത്തികൾ’ എന്ന തുറന്ന അർഥമുള്ള പ്രയോഗം നിലനിർത്തുക
  alternative: ‘ഞാൻ ആവശ്യപ്പെടുന്ന പ്രവൃത്തികൾ’ / ‘എന്റെ കല്പനകൾ’
  rationale: മൂലപാഠം ഈ പ്രവൃത്തികൾ യേശുവിന്റേതാണെന്ന ബന്ധം വ്യക്തമാക്കുന്നുവെങ്കിലും ആ ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം നിർവചിക്കുന്നില്ല. അതിനെ കല്പനകളായോ യേശുവിനുവേണ്ടി ചെയ്യുന്ന പ്രവൃത്തികളായോ ചുരുക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഒരേ വ്യക്തിയുടെ രണ്ടു സവിശേഷതകൾ വ്യക്തമാക്കാൻ ‘ജയിക്കുകയും ... കാത്തുപാലിക്കുകയും ചെയ്യുന്നവന്’ എന്ന സംയുക്തഘടന ഉപയോഗിച്ചു. ‘ജനതകളുടെമേൽ അധികാരം’ എന്നത് വെളിപ്പാടുപുസ്തകത്തിലെ ഭരണഭാവം നിലനിർത്തുന്നു.
