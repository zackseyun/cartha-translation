id: REV.2.8
reference: Revelation 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: ml
  text: 'സ്മുർന്നയിലെ സഭയുടെ ദൂതന്[a] എഴുതുക: “ആദ്യനും അന്ത്യനും, മരിച്ചവനായിത്തീരുകയും വീണ്ടും ജീവിക്കുകയും ചെയ്തവൻ[b], ഇങ്ങനെ പറയുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്മുർന്നയിലെ സഭയുടെ സന്ദേശവാഹകന്’.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘മരിച്ചിരുന്നിട്ട് വീണ്ടും ജീവൻ പ്രാപിച്ചവൻ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ദൂതന്
  rationale: വെളിപ്പാടിന്റെ ദർശനാത്മക പശ്ചാത്തലത്തിൽ ‘ദൂതൻ’ എന്നത് സ്വർഗീയ ദൂതനെയും സന്ദേശവാഹകനെയും സൂചിപ്പിക്കാൻ കഴിയുന്നു. പ്രധാനപാഠത്തിൽ പതിവായ അർഥം നിലനിർത്തുകയും മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
- source_word: ἐκκλησίας
  choice: സഭയുടെ
  rationale: ഇവിടെ പദം പൊതുവായ ഒരു സമ്മേളനത്തെയല്ല, സ്മുർന്നയിലെ ക്രിസ്തീയ വിശ്വാസസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സ്വാഭാവികമായ ‘സഭ’ തിരഞ്ഞെടുത്തു.
- source_word: Τάδε λέγει
  choice: ഇങ്ങനെ പറയുന്നു
  rationale: വെളിപ്പാടിൽ ആവർത്തിക്കുന്ന പ്രവാചകസന്ദേശസൂത്രത്തിന്റെ ഗൗരവവും നേരിട്ടുള്ള വർത്തമാനകാലപ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: ആദ്യനും അന്ത്യനും
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണമായി പ്രവർത്തിക്കുന്ന ദൈവിക ശീർഷകത്തിന്റെ സംക്ഷിപ്തതയും സമാന്തരഘടനയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐγένετο νεκρὸς
  choice: മരിച്ചവനായിത്തീരുകയും
  rationale: γίνομαι എന്ന ക്രിയയിലെ അവസ്ഥയിലേക്കു പ്രവേശിക്കുന്ന സംഭവാത്മക ഭാവം പൂർണമായി മിനുക്കിക്കളയാതെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔζησεν
  choice: വീണ്ടും ജീവിക്കുകയും ചെയ്തവൻ
  rationale: മരണത്തോടുള്ള സന്ദർഭപരമായ വൈരുധ്യവും പുനരുത്ഥാനസൂചനയും മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കാൻ ‘വീണ്ടും’ ചേർത്തു; ഇത് ഗ്രീക്കിലെ സന്ദർഭാർത്ഥത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ ശീർഷകവും മരണ-പുനരുത്ഥാനവാക്യവും
  choice: ‘ആദ്യനും അന്ത്യനും’ എന്നത് ശീർഷകമായി നിലനിർത്തി; തുടർന്ന് അവൻ മരണത്തിലേക്കു പ്രവേശിക്കുകയും വീണ്ടും ജീവിക്കുകയും ചെയ്തുവെന്ന് അവതരിപ്പിച്ചു.
  alternative: ‘ആദിയും അന്തവും’; ‘മരിച്ചിരുന്നിട്ട് വീണ്ടും ജീവൻ പ്രാപിച്ചവൻ’
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ഉന്നത ക്രിസ്തുശാസ്ത്രപരമായ സ്വയംതിരിച്ചറിയലും മരണ-പുനരുത്ഥാനസാക്ഷ്യവും അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവപൂർണ മലയാളം. പ്രവാചകസന്ദേശത്തിന്റെ ഔപചാരിക താളം നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. ഉദ്ധരണി അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ ഇരട്ടപ്പുള്ളി നിലനിർത്തി.
