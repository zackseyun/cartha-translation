id: REV.2.9
reference: Revelation 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: ml
  text: നിന്റെ കഷ്ടതയും ദാരിദ്ര്യവും എനിക്കറിയാം—എങ്കിലും നീ സമ്പന്നനാണ്—തങ്ങൾ യെഹൂദന്മാരാണെന്നു പറയുന്നവരിൽനിന്നുള്ള നിന്ദയും എനിക്കറിയാം. എന്നാൽ അവർ യെഹൂദന്മാരല്ല; സാത്താന്റെ സിനഗോഗാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്ദ’ എന്നതിന് ‘ദൂഷണം’ എന്നും പരിഭാഷപ്പെടുത്താം; മൂലപദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘ദൈവദൂഷണം’ എന്നും അർഥമുണ്ട്. ഇവിടെ വിശ്വാസികൾക്കെതിരായ അപകീർത്തികരമായ സംസാരമാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘സാത്താന്റെ സിനഗോഗ്’ എന്ന പ്രയോഗം അക്ഷരാർഥത്തോട് ചേർന്ന് നിലനിർത്തിയിരിക്കുന്നു. ‘സിനഗോഗ്’ എന്നതിന് ‘സഭ’ അല്ലെങ്കിൽ ‘യോഗം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: കഷ്ടത
  rationale: സമ്മർദം, ദുരിതം, പീഡനം എന്നിവ ഉൾക്കൊള്ളുന്ന പദമാണ്; സാങ്കേതിക അന്ത്യകാലധ്വനി ചേർക്കാതെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ കഷ്ടത എന്നു നൽകി.
- source_word: πτωχείαν
  choice: ദാരിദ്ര്യം
  rationale: ഭൗതിക ദാരിദ്ര്യത്തെ നേരിട്ട് സൂചിപ്പിക്കുകയും തുടർന്നുള്ള സമ്പന്നൻ എന്ന വിരോധാഭാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πλούσιος
  choice: സമ്പന്നൻ
  rationale: ഗ്രീക്കിൽ വിശേഷണം വിശദീകരണമില്ലാതെ നിൽക്കുന്നതിനാൽ ആത്മീയമായി എന്ന വ്യാഖ്യാനം ചേർക്കാതെ വിരോധാഭാസം അതേപടി സൂക്ഷിച്ചു.
- source_word: βλασφημίαν
  choice: ദൂഷണം
  rationale: ഇവിടെ വിശ്വാസികൾക്കെതിരായ ശത്രുതാപരവും അപകീർത്തികരവുമായ സംസാരമാണ് സന്ദർഭസൂചന; ദൈവദൂഷണം എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതിരിക്കാൻ ദൂഷണം തെരഞ്ഞെടുത്തു.
- source_word: ἐκ τῶν λεγόντων
  choice: പറയുന്നവരിൽനിന്നുള്ള
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: തങ്ങൾ യെഹൂദന്മാരാണെന്ന്
  rationale: പ്രതിഫലനബലം തങ്ങൾ എന്നതിലൂടെ സൂക്ഷിച്ചുകൊണ്ട് വാചകം സ്വാഭാവികമാക്കി.
- source_word: συναγωγὴ
  choice: സിനഗോഗ്
  rationale: യഹൂദസമൂഹം/യോഗം എന്ന ചരിത്രപരവും പദപരവുമായ പ്രത്യേകതയും വാക്യത്തിലെ മൂർച്ചയുള്ള പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: τοῦ Σατανᾶ
  choice: സാത്താന്റെ
  rationale: ജനിറ്റീവ് ബന്ധത്തിന്റെ നേരിട്ടും ശക്തവുമായ രൂപം; മയപ്പെടുത്തുകയോ അധിക വ്യാഖ്യാനം ചേർക്കുകയോ ചെയ്യുന്നില്ല.
theological_decisions:
- issue: ‘യെഹൂദന്മാരാണെന്നു പറയുന്നവരും അല്ലാത്തവരും’ എന്ന വിവാദപരമായ പ്രയോഗം
  choice: യെഹൂദന്മാർ എന്ന പദം നേരിട്ട് നിലനിർത്തി; അവർ യെഹൂദന്മാരല്ല എന്ന വൈരുധ്യവും അതേപടി നൽകി.
  alternative: തങ്ങൾ ദൈവജനമാണെന്ന് അവകാശപ്പെടുന്നവർ / യഥാർഥ യെഹൂദന്മാരെന്ന് പറയുന്നവർ
  rationale: Ἰουδαίους എന്നത് വ്യക്തമാണ്. വംശീയതയെക്കുറിച്ചുള്ള വിശദീകരണമോ ഉടമ്പടിസത്യസന്ധതയെക്കുറിച്ചുള്ള വ്യാഖ്യാനമോ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
- issue: ‘സമ്പന്നൻ’ എന്നത് ആത്മീയ സമ്പത്താണെന്ന് വ്യക്തമാക്കണമോ
  choice: സമ്പന്നൻ എന്ന് മാത്രം നൽകി.
  alternative: ആത്മീയമായി സമ്പന്നൻ
  rationale: സന്ദർഭം ഭൗതികമല്ലാത്ത സമ്പത്തിനെ സൂചിപ്പിച്ചാലും ഗ്രീക്ക് അതിനെ തുറന്നു നിർവചിക്കുന്നില്ല; അതിനാൽ സൂചനയെ വിശദീകരണമായി മാറ്റിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ഏകവചന അഭിസംബോധന നിലനിർത്തി. ദീർഘമായ ഗ്രീക്ക് വാക്യം വ്യക്തതയ്ക്കായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ആവർത്തിച്ച ‘എനിക്കറിയാം’ മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ പുനഃസ്ഥാപിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
