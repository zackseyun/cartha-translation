id: REV.2.3
reference: Revelation 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑπομονὴν ἔχεις, καὶ ἐβάστασας διὰ τὸ ὄνομά μου, καὶ ⸂οὐ κεκοπίακες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: ml
  text: നിനക്കു സഹിഷ്ണുതയുണ്ട്; എന്റെ നാമംനിമിത്തം നീ സഹിച്ചിരിക്കുന്നു[a]; നീ ക്ഷീണിച്ചിട്ടുമില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ നാമംനിമിത്തം നീ ഭാരം വഹിച്ചിരിക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നീ തളർന്നിട്ടില്ല”; ഈ വാക്യഭാഗത്തെ അധ്വാനവുമായി ബന്ധപ്പെടുത്തി “അധ്വാനത്താൽ നീ ക്ഷീണിച്ചിട്ടില്ല” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: സഹിഷ്ണുത
  rationale: പരീക്ഷകളുടെയും സമ്മർദത്തിന്റെയും മധ്യേ ഉറച്ചുനിൽക്കുന്ന സഹനത്തെ സൂചിപ്പിക്കുന്നു; ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: ἔχεις
  choice: നിനക്കു ... ഉണ്ട്
  rationale: വർത്തമാനകാലത്തിലുള്ള നേരിട്ടുള്ള പ്രശംസ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐβάστασας
  choice: നീ കഷ്ടങ്ങൾ സഹിച്ചിട്ടുണ്ട്
  rationale: βαστάζω എന്നത് ചുമക്കുക, വഹിക്കുക, സഹിക്കുക എന്നീ അർഥങ്ങൾ നൽകാം. ഇവിടെ യേശുവിന്റെ നാമംനിമിത്തമുള്ള ഭാരമോ ക്ലേശമോ താങ്ങിയെന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘സഹിഷ്ണുത’ എന്ന മുൻപദവുമായി പൂർണമായി ഒരേ പദപ്രയോഗമാക്കുന്നില്ല.
- source_word: διὰ τὸ ὄνομά μου
  choice: എന്റെ നാമംനിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണമോ നിമിത്തമോ സൂചിപ്പിക്കാം. യേശുവിനോടുള്ള ബന്ധം കാരണം അനുഭവിച്ച കഷ്ടത എന്ന ബൈബിൾപ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: οὐ κεκοπίακες
  choice: നീ ക്ഷീണിച്ചുപോയിട്ടുമില്ല
  rationale: κοπιάω എന്നതിന് അധ്വാനിക്കുക എന്നും ക്ഷീണിക്കുക എന്നും അർഥമുണ്ട്. സന്ദർഭത്തിലെ സഹനഭാവവും perfect രൂപം സൂചിപ്പിക്കുന്ന തുടരുന്ന നിലയും ഈ പരിഭാഷ നന്നായി നൽകുന്നു.
theological_decisions:
- issue: സഹനത്തെയും കഷ്ടം വഹിച്ചതിനെയും കുറിച്ചുള്ള പ്രശംസയുടെ വ്യാപ്തി
  choice: യേശുവിന്റെ നാമംനിമിത്തം കഷ്ടങ്ങൾ സഹിച്ചിട്ടും ക്ഷീണിച്ചുപോകാതിരുന്ന ഉറച്ച നിലപാടിനുള്ള പ്രശംസയായി വിവർത്തനം ചെയ്തു.
  alternative: അവസാന വാക്യഭാഗത്തെ ‘നീ അധ്വാനിച്ചിട്ടില്ല’ എന്നോ ‘അധ്വാനത്താൽ നീ ക്ഷീണിച്ചിട്ടില്ല’ എന്നോ മനസ്സിലാക്കാം.
  rationale: പ്രത്യേകമായ പീഡനരൂപമോ ശുശ്രൂഷാതൊഴിലോ പ്രതിഫലസിദ്ധാന്തമോ പാഠത്തിൽ ചേർക്കാതെ, ഗ്രീക്കിലുള്ള സമ്മർദത്തിനിടയിലെ സഹനവും അവസാന ക്രിയയുടെ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരവുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ഏകവചന അഭിസംബോധന ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തിച്ച καί ഘടന മലയാളത്തിൽ അർദ്ധവിരാമങ്ങളും ‘-ഉം’ രൂപവും ഉപയോഗിച്ച് സ്വാഭാവികമാക്കി; അർഥപരമായ സമാന്തരത നിലനിർത്തി.
