id: REV.2.28
reference: Revelation 2:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς κἀγὼ εἴληφα παρὰ τοῦ πατρός μου, καὶ δώσω αὐτῷ τὸν ἀστέρα τὸν πρωϊνόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: ml
  text: ഞാനും എന്റെ പിതാവിൽനിന്ന് പ്രാപിച്ചിരിക്കുന്നതുപോലെ, അവന് പ്രഭാതനക്ഷത്രം[a] നൽകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉദയനക്ഷത്രം.’ ഈ പ്രയോഗം മിശിഹായുടെ രാജകീയ പ്രതീകഭാഷയെ സൂചിപ്പിക്കാം; ‘തിളങ്ങുന്ന പ്രഭാതനക്ഷത്രം’ എന്നു യേശു തന്നെത്തന്നെ വിശേഷിപ്പിക്കുന്ന വെളിപ്പാട് 22:16-ലേക്കും ഇത് സൂചന നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: പ്രാപിച്ചിരിക്കുന്നതുപോലെ
  rationale: മുൻവാക്യത്തിലെ വാഗ്ദാനവുമായി താരതമ്യവും അനുരൂപതയും സൂചിപ്പിക്കുന്ന ὡς എന്നതിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ ‘പോലെ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: καὶ ἐγώ എന്ന സംയുക്തരൂപത്തിലെ സർവനാമത്തെയും ‘കൂടി/also’ എന്ന ചേർക്കൽഭാവത്തെയും ‘ഞാനും’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἴληφα
  choice: പ്രാപിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ സ്വീകരണത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന perfect രൂപം ‘പ്രാപിച്ചിരിക്കുന്നു’ എന്നു നൽകുന്നു; ഇവിടെ പിതാവിൽനിന്നുള്ള സ്വീകരണമാണെന്നതിനാൽ ‘കൈവശപ്പെടുത്തി’ എന്നതിനെക്കാൾ ‘പ്രാപിച്ചു’ യോജിക്കുന്നു.
- source_word: παρὰ τοῦ πατρός μου
  choice: എന്റെ പിതാവിൽനിന്ന്
  rationale: ജനിറ്റീവോടുകൂടിയ παρά ഇവിടെ ഉറവിടം സൂചിപ്പിക്കുന്നതിനാൽ ‘നിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘എന്റെ പിതാവ്’ എന്ന പുത്രബന്ധഭാഷ വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: καὶ δώσω αὐτῷ
  choice: ഞാൻ അവന് … നൽകും
  rationale: ഭാവികാലത്തിലെ നൽകൽ വ്യക്തമായി നിലനിർത്തുന്നു. αὐτῷ മുൻസന്ദർഭത്തിലെ ജയിക്കുന്നവനെ സൂചിപ്പിക്കുന്ന ഏകവചന ദാതിവാണ്; മലയാളത്തിൽ ‘അവന്’ സ്വാഭാവികമാണ്.
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: പ്രഭാതനക്ഷത്രം
  rationale: വിശേഷണാർഥമുള്ള ആർട്ടിക്കിൾ ഘടനയെ മലയാളത്തിലെ സ്വാഭാവികമായ സംയുക്തപദമായി നൽകി; പ്രതീകത്തിന്റെ അർഥം മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ചിട്ടില്ല.
theological_decisions:
- issue: ‘പ്രഭാതനക്ഷത്രം’ എന്നതിന്റെ തിരിച്ചറിയലും പ്രാധാന്യവും
  choice: മുഖ്യപാഠത്തിൽ ‘പ്രഭാതനക്ഷത്രം’ എന്ന രൂപകം വിശദീകരണമില്ലാതെ നിലനിർത്തുക.
  alternative: മിശിഹായുടെ രാജകീയ വിജയത്തിന്റെ പ്രതീകം; വെളിപ്പാട് 22:16-ന്റെ വെളിച്ചത്തിൽ ക്രിസ്തുതന്നെ; അല്ലെങ്കിൽ അന്ത്യകാല മഹത്ത്വം/പ്രതിഫലം എന്നിങ്ങനെ തുറന്നുപറയുക.
  rationale: ഈ വാക്യം പ്രതീകത്തെ സ്വയം നിർവചിക്കുന്നില്ല. അതിനാൽ ക്രിസ്തുസംബന്ധമായും രാജകീയമായും അന്ത്യകാലസംബന്ധമായും ഉള്ള സാദ്ധ്യമായ അനുരണനങ്ങൾ നിർബന്ധമായി ഒന്നാക്കി തീർക്കാതെ, രൂപകം മുഖ്യപാഠത്തിൽ അതേപടി സൂക്ഷിച്ച് അടിക്കുറിപ്പിൽ സൂചന നൽകുന്നു.
- issue: ‘എന്റെ പിതാവിൽനിന്ന്’ എന്നതിലെ ക്രിസ്തുസംബന്ധം
  choice: വിശദീകരണം ചേർക്കാതെ ‘എന്റെ പിതാവിൽനിന്ന്’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  alternative: അധികാരം ഏൽപ്പിക്കപ്പെട്ടതായോ വീണ്ടെടുപ്പിന്റെ ക്രമത്തിലുള്ള സ്വീകരണമായോ വിശദീകരിക്കുക.
  rationale: മൂലപാഠം വ്യക്തമാക്കുന്ന പുത്രബന്ധവും സ്വീകരണഭാഷയും മാത്രം പരിഭാഷയിൽ നിലനിർത്തുന്നു; പിന്നീടുള്ള സിദ്ധാന്തവ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രാപിച്ചിരിക്കുന്നു’ perfect രൂപത്തിന്റെ നിലനിൽക്കുന്ന ഫലം പ്രകടിപ്പിക്കുന്നു; ‘പ്രഭാതനക്ഷത്രം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപകമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പിന്റെ സൂചകം ബന്ധപ്പെട്ട പദത്തിനുതന്നെ പിന്നാലെ ചേർത്തിരിക്കുന്നു.
