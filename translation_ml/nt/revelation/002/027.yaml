id: REV.2.27
reference: Revelation 2:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ ὡς τὰ σκεύη τὰ κεραμικὰ ⸀συντρίβεται,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/027.yaml
  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
translation:
  language: ml
  text: അവൻ ഇരുമ്പുദണ്ഡുകൊണ്ട് അവരെ മേയിക്കും[a], മൺപാത്രങ്ങൾ തകർന്നുപോകുന്നതുപോലെ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഇരുമ്പുദണ്ഡുകൊണ്ട് അവരെ ഭരിക്കും.’ ഈ ക്രിയയുടെ അക്ഷരാർഥം ‘മേയിക്കുക’ എന്നാണ്; എന്നാൽ സങ്കീർത്തനം 2-ലേക്കുള്ള ഈ സൂചനയിൽ രാജകീയ ഭരണത്തിന്റെ അർത്ഥവും അതിനുണ്ട്.
    reason: alternative_reading
  - marker: b
    text: സങ്കീർത്തനം 2:9-ലേക്കുള്ള സൂചന; അവിടെ ജനതകൾ മൺപാത്രംപോലെ തകർക്കപ്പെടുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധം വിരാമചിഹ്നത്തിലൂടെ നിലനിർത്തി; ഇവിടെ ‘കൂടാതെ/എന്നും’ ചേർക്കുന്നത് അനാവശ്യമായി ഭാരപ്പെടുത്തും.
- source_word: ποιμανεῖ
  choice: മേയിക്കും
  rationale: ποιμαίνωയുടെ ഇടയപരിപാലനചിത്രം നേരിട്ട് നിലനിർത്തുന്നു; സങ്കീർത്തനം 2-ന്റെ പശ്ചാത്തലത്തിലുള്ള രാജകീയ ഭരണാർത്ഥവും സന്ദർഭത്തിൽ തുറന്ന നിലയിൽ തുടരുന്നു.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: ഇരുമ്പുദണ്ഡുകൊണ്ട്
  rationale: ῥάβδος എന്നതിലെ ദണ്ഡ്/അധികാരചിഹ്നത്തിന്റെ അർത്ഥവും ശക്തിപ്രയോഗത്തിന്റെ ഭാവവും ചുരുക്കമായും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: ὡς
  choice: പോലെ
  rationale: തുടർന്നുവരുന്ന ഉപമയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: മൺപാത്രങ്ങൾ
  rationale: κεραμικός സൂചിപ്പിക്കുന്ന മൺനിർമിത സ്വഭാവവും σκεῦος സൂചിപ്പിക്കുന്ന പാത്രവും വ്യക്തവും സാധാരണ വായനക്കാർക്ക് എളുപ്പവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: συντρίβεται
  choice: തകർന്നുപോകുന്നു
  rationale: ശക്തമായി പൊട്ടിത്തകരുന്ന അർത്ഥം നൽകുന്നു. നപുംസക ബഹുവചന കർത്താവിനോടുള്ള ഗ്രീക്ക് ഏകവചന ക്രിയ മലയാളത്തിലെ സ്വാഭാവിക ബഹുവചനപ്രയോഗമായി ക്രമപ്പെടുത്തി.
theological_decisions:
- issue: ποιμανεῖ എന്ന ക്രിയയിലൂടെയും ഇരുമ്പുദണ്ഡിന്റെ ചിത്രത്തിലൂടെയും സങ്കീർത്തനം 2:9-ലേക്കുള്ള രാജകീയ-മശിഹീയ സൂചന
  choice: പ്രധാനവാചകത്തിൽ ‘മേയിക്കും’ എന്ന് നൽകി ഇടയന്റെ ചിത്രം സംരക്ഷിച്ചു; രാജകീയ ഭരണവും ന്യായവിധിയും സൂചിപ്പിക്കുന്ന അർത്ഥം സന്ദർഭത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി.
  alternative: ‘ഭരിക്കും’ എന്ന് നൽകി രാജകീയ ആധിപത്യം മുൻനിർത്തുക.
  rationale: ഗ്രീക്ക് പാഠം പൊതുവായ ‘ഭരിക്കുക’ എന്ന ക്രിയയല്ല, ποιμαίνω ആണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ കരുതലും അധികാരവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം ഒതുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘മേയിക്കും’ എന്ന പരിചിതമായ ബൈബിൾ-ഇടയപ്രയോഗം മൂലഭാഷയിലെ രൂപകം നിലനിർത്തുന്നു. വാക്യം മുൻപും പിന്നാലെയും ഉള്ള പാഠത്തിന്റെ ഭാഗമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
