id: REV.2.22
reference: Revelation 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: ml
  text: ഇതാ, ഞാൻ അവളെ ഒരു കിടക്കയിലേക്കു[a] തള്ളിയിടുന്നു; അവളോടുകൂടെ വ്യഭിചാരം ചെയ്യുന്നവർ അവളുടെ പ്രവൃത്തികളെ വിട്ട് മാനസാന്തരപ്പെടുന്നില്ലെങ്കിൽ, അവരെയും വലിയ കഷ്ടതയിലേക്ക്[b] തള്ളിയിടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഒരു രോഗക്കിടക്കയിലേക്കു.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ഒരു കിടക്കയിലേക്കു’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ പലരും അതിനെ ന്യായവിധിയായി വരുന്ന രോഗത്തിന്റെയോ കഷ്ടതയുടെയോ കിടക്കയായി മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘വലിയ പീഡയിലേക്ക്.’ ഇവിടെ ഈ പ്രയോഗം കടുത്ത കഷ്ടാനുഭവത്തെയോ ദുരിതത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യാക്ഷേപത്തെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: βάλλω
  choice: ഞാൻ ... തള്ളിയിടുന്നു
  rationale: വരാനിരിക്കുന്ന ന്യായവിധിയെ സജീവവും ആസന്നവുമായി ചിത്രീകരിക്കുന്ന വർത്തമാനകാലപ്രയോഗം നിലനിർത്തുന്നു; രണ്ടാമത്തെ ഖണ്ഡത്തിൽ ഗ്രീക്കിൽ സൂചിതമായിരിക്കുന്ന ക്രിയ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ആവർത്തിക്കുന്നു.
- source_word: αὐτὴν εἰς κλίνην
  choice: അവളെ ഒരു കിടക്കയിൽ തള്ളിയിടുന്നു
  rationale: κλίνη എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘കിടക്ക’ നിലനിർത്തുന്നു. രോഗക്കിടക്ക എന്ന വ്യാഖ്യാനം മൂലപദത്തിൽ നിർബന്ധിതമല്ലാത്തതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: അവളോടുകൂടെ വ്യഭിചാരം ചെയ്യുന്നവർ
  rationale: μοιχεύω എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ വ്യഭിചാരം നിലനിർത്തുകയും അതിന്റെ സാദ്ധ്യമായ പ്രതീകാത്മക അർഥം വിശദീകരിച്ച് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς θλῖψιν μεγάλην
  choice: വലിയ കഷ്ടതയിലേക്ക്
  rationale: θλῖψις സൂചിപ്പിക്കുന്ന കടുത്ത പീഡയും ദുരിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു; ‘മഹാകഷ്ടം’ എന്ന സാങ്കേതികമായി തോന്നാവുന്ന പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἐὰν μὴ μετανοήσωσιν
  choice: മാനസാന്തരപ്പെടുന്നില്ലെങ്കിൽ
  rationale: ഗ്രീക്കിലെ ‘unless’ വ്യവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായ നിഷേധാത്മക ഉപാധിവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐκ τῶν ἔργων αὐτῆς
  choice: അവളുടെ പ്രവൃത്തികളിൽനിന്ന്
  rationale: ἐκ എന്നതിലെ ‘വിട്ടുതിരിയുക’ എന്ന ദിശാബോധം നിലനിർത്തുകയും പ്രവൃത്തികൾ അവളുടേതാണെന്ന ബന്ധം വ്യക്തമായി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: κλίνη എന്നത് ന്യായവിധിയുടെ ‘രോഗക്കിടക്ക’ എന്ന് മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കണമോ
  choice: മുഖ്യവാചകത്തിൽ അക്ഷരാർഥമായ ‘കിടക്ക’ നിലനിർത്തുക
  alternative: രോഗക്കിടക്ക
  rationale: സന്ദർഭം ന്യായവിധിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും κλίνη സ്വതവേ രോഗക്കിടക്ക എന്ന അർഥം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനത്തെ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: μοιχεύοντας അക്ഷരാർഥത്തിലുള്ള ലൈംഗിക വ്യഭിചാരമാണോ, ആത്മീയ അവിശ്വസ്തതയുടെ പ്രതീകമാണോ, രണ്ടുമാണോ
  choice: ‘വ്യഭിചാരം ചെയ്യുന്നവർ’ എന്ന നേരിട്ടുള്ള പദാർഥം നിലനിർത്തി വിശാലമായ പ്രതീകാത്മക പ്രയോഗം സന്ദർഭത്തിന് വിടുക
  alternative: അവളോടുകൂടെ ലൈംഗിക അധാർമികത ചെയ്യുന്നവർ / അവളോടുകൂടെ അവിശ്വസ്തരാകുന്നവർ
  rationale: μοιχεύω നേരിട്ട് വ്യഭിചാരത്തെ സൂചിപ്പിക്കുന്നു. വെളിപ്പാടിലെ പ്രതീകാത്മക വ്യാപ്തി സാദ്ധ്യമാണെങ്കിലും വിവർത്തനം അതിനെ പൊതുവായ പരാവർത്തനമാക്കി ചുരുക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ശൈലി. ‘ഇതാ,’ ‘മാനസാന്തരപ്പെടുക,’ ‘വ്യഭിചാരം’ എന്നിവ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ഗ്രീക്കിലെ ക്രിയ രണ്ടാമത്തെ ഖണ്ഡത്തിൽ ലോപിച്ചിട്ടുണ്ടെങ്കിലും മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘തള്ളിയിടുന്നു’ ആവർത്തിച്ചിരിക്കുന്നു.
