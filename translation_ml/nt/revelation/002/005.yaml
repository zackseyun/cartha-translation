id: REV.2.5
reference: Revelation 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: ml
  text: അതുകൊണ്ട്, നീ എവിടെനിന്ന് വീണുപോയിരിക്കുന്നുവെന്ന് ഓർക്കുക[a]; മാനസാന്തരപ്പെട്ട്, ആദ്യം ചെയ്ത പ്രവൃത്തികൾ ചെയ്യുക. എന്നാൽ അങ്ങനെ ചെയ്യുന്നില്ലെങ്കിൽ, ഞാൻ നിന്റെ അടുക്കൽ വരുന്നു; നീ മാനസാന്തരപ്പെടുന്നില്ലെങ്കിൽ, നിന്റെ വിളക്കുതണ്ട് അതിന്റെ സ്ഥാനത്തുനിന്ന് നീക്കിക്കളയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എത്ര ഉയരത്തിൽനിന്നാണ് നീ വീണുപോയിരിക്കുന്നതെന്ന്.’ ഗ്രീക്കിൽ അക്ഷരാർഥമായി ‘എവിടെനിന്ന് നീ വീണുപോയിരിക്കുന്നു’ എന്നാണ്; ചിലർ ഇതിൽ ഉയരത്തെ സൂചിപ്പിക്കുന്ന ഒരു പരോക്ഷരൂപകം കാണുന്നു.
    reason: lexical_alternative
  - marker: b
    text: വെളിപ്പാട് 1:20-ൽ ‘വിളക്കുതണ്ട്’ ഒരു സഭയുടെ പ്രതീകമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: ഓർക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ ഓർമപ്പെടുത്തൽസൂചന മലയാളത്തിൽ സ്വാഭാവികമായ ലളിത ആജ്ഞയിലൂടെ നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻ ശാസനയിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πόθεν πέπτωκας
  choice: നീ എവിടെനിന്നാണ് വീണിരിക്കുന്നതെന്ന്
  rationale: ‘എവിടെനിന്ന്’ എന്ന മൂലപാഠത്തിന്റെ തുറന്ന രൂപവും, സംഭവിച്ച വീഴ്ചയുടെ ഇപ്പോഴത്തെ ഫലാവസ്ഥ സൂചിപ്പിക്കുന്ന സമ്പൂർണകാലഭാവവും സംരക്ഷിക്കുന്നു; ‘എത്ര ഉയരത്തിൽനിന്ന്’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: μετανόησον / μετανοήσῃς
  choice: മാനസാന്തരപ്പെടുക / മാനസാന്തരപ്പെടുന്നില്ലെങ്കിൽ
  rationale: ധാർമിക-ആത്മീയ പശ്ചാത്തലത്തിലെ പശ്ചാത്താപവും തിരിഞ്ഞുവരവും ഉൾക്കൊള്ളുന്ന പരിചിതമായ മലയാളപദം.
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: ആദ്യം ചെയ്ത പ്രവൃത്തികൾ ചെയ്യുക
  rationale: πρῶτα എന്നതിന്റെ കാലസൂചന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും പ്രവൃത്തികളെ പൊതുവായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: εἰ δὲ μή
  choice: അല്ലെങ്കിൽ
  rationale: ഗ്രീക്കിലെ മുന്നറിയിപ്പിന്റെ വ്യവസ്ഥ മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: ἔρχομαί σοι
  choice: ഞാൻ നിന്റെ അടുക്കൽ വരുന്നു
  rationale: വർത്തമാനരൂപത്തിന്റെ സജീവമായ ആസന്നത നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘നിനക്കെതിരെ’ ചേർക്കുന്നില്ല.
- source_word: κινήσω
  choice: നീക്കിക്കളയും
  rationale: κινέωയുടെ ‘നീക്കുക’ എന്ന അടിസ്ഥാനചിത്രവും സ്ഥാനത്തുനിന്നുള്ള നീക്കത്തിന്റെ വിധിന്യായശക്തിയും ഒരുമിച്ച് നൽകുന്നു.
- source_word: τὴν λυχνίαν σου
  choice: നിന്റെ വിളക്കുതണ്ട്
  rationale: λُχνία വിളക്കല്ല, വിളക്ക് വയ്ക്കുന്ന തണ്ടാണ്; വെളിപ്പാട് 1:20-ലെ പ്രതീകചിത്രം നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: അതിന്റെ സ്ഥാനത്തുനിന്ന്
  rationale: ഉടമസ്ഥസർവനാമവും സ്ഥാനത്തിൽനിന്നുള്ള നീക്കവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിളക്കുതണ്ട് നീക്കുമെന്ന മുന്നറിയിപ്പിന്റെ സ്വഭാവം
  choice: സഭയെ സൂചിപ്പിക്കുന്ന വിളക്കുതണ്ടിന്റെ പ്രതീകചിത്രം വിശദീകരിച്ച് തീർപ്പാക്കാതെ നിലനിർത്തുക
  alternative: സഭയുടെ സാക്ഷ്യം നഷ്ടപ്പെടുക; സഭയുടെ നിലനിൽപ്പോ പദവിയോ വിധിക്കപ്പെടുക; വ്യക്തികളുടെ രക്ഷ നഷ്ടപ്പെടുക
  rationale: വെളിപ്പാട് 1:20 വിളക്കുതണ്ടുകളെ സഭകളായി തിരിച്ചറിയുന്നു. എന്നാൽ ഇവിടെ വ്യക്തിഗത രക്ഷയെക്കുറിച്ചുള്ള ഒരു വ്യവസ്ഥിത ദൈവശാസ്ത്രനിഗമനം പാഠം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ പ്രതീകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധന നിലനിർത്തി. ‘മാനസാന്തരം’, ‘വിളക്കുതണ്ട്’ എന്നീ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചു.
