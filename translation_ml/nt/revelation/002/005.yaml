  terminology: “മാനസാന്തരപ്പെടുക” suitably renders μετανοέω in this context. “വിളക്കുതണ്ട്” retains the concrete lampstand image and should not be replaced with an interpretive expression. The footnotes are accurate and their anchors remain correctly placed.
