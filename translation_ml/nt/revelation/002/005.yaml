revisions:
- from: അതുകൊണ്ട്, നീ എവിടെനിന്നാണ് വീണിരിക്കുന്നതെന്ന് ഓർക്കുക[a]; മാനസാന്തരപ്പെട്ട് ആദ്യം ചെയ്ത പ്രവൃത്തികൾ ചെയ്യുക. അല്ലെങ്കിൽ, നീ മാനസാന്തരപ്പെടുന്നില്ലെങ്കിൽ, ഞാൻ നിന്റെ അടുക്കൽ വരുന്നു; നിന്റെ വിളക്കുതണ്ട് അതിന്റെ സ്ഥാനത്തുനിന്ന് നീക്കിക്കളയും[b].
  to: അതുകൊണ്ട്, നീ എവിടെനിന്ന് വീണുപോയിരിക്കുന്നുവെന്ന് ഓർക്കുക[a]; മാനസാന്തരപ്പെട്ട്, ആദ്യം ചെയ്ത പ്രവൃത്തികൾ ചെയ്യുക. എന്നാൽ അങ്ങനെ ചെയ്യുന്നില്ലെങ്കിൽ, ഞാൻ നിന്റെ അടുക്കൽ വരുന്നു; നീ മാനസാന്തരപ്പെടുന്നില്ലെങ്കിൽ, നിന്റെ വിളക്കുതണ്ട് അതിന്റെ സ്ഥാനത്തുനിന്ന് നീക്കിക്കളയും[b].
