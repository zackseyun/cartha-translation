id: REV.2.24
reference: Revelation 2:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: ml
  text: 'എന്നാൽ തുയഥൈരയിലെ ശേഷിച്ച നിങ്ങളോടു ഞാൻ പറയുന്നു: ഈ ഉപദേശം അംഗീകരിക്കാത്തവരും, അവർ പറയുന്നതുപോലെ, ‘സാത്താന്റെ ആഴങ്ങൾ’[a] അറിയാത്തവരുമായ നിങ്ങളുടേമേൽ ഞാൻ മറ്റൊരു ഭാരവും ചുമത്തുന്നില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സാത്താന്റെ ആഴമുള്ള കാര്യങ്ങൾ.” ഈ ഗ്രീക്ക് പ്രയോഗം ‘ആഴമുള്ള’ ആത്മീയജ്ഞാനം തങ്ങൾക്കുണ്ടെന്ന ഒരു അവകാശവാദത്തെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം; ഈ പ്രയോഗത്തിന്റെ കൃത്യമായ വാചാടോപപരമായ ഉദ്ദേശ്യം തുറന്ന നിലയിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς λοιποῖς τοῖς ἐν Θυατείροις
  choice: തുയഥൈരയിലെ ശേഷിച്ചവരായ നിങ്ങളോട്
  rationale: സഭയിൽ ഈ ഉപദേശം സ്വീകരിച്ചവരിൽനിന്ന് വേർതിരിച്ചുള്ള ശേഷിച്ച അംഗങ്ങളെയാണ് λοιποί സൂചിപ്പിക്കുന്നത്. രണ്ടാംപുരുഷ അഭിസംബോധന മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἔχουσιν τὴν διδαχὴν ταύτην
  choice: ഈ ഉപദേശം സ്വീകരിക്കാത്തവർ
  rationale: ഇവിടെ ἔχω എന്നത് ഒരു ഉപദേശം കൈക്കൊണ്ട് അതിനോടു ചേർന്നുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥമായ ‘ഉണ്ടായിരിക്കുക’ എന്നതിനെക്കാൾ ‘സ്വീകരിക്കുക’ സാധാരണ മലയാളത്തിൽ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: അറിഞ്ഞിട്ടില്ലാത്തവർ
  rationale: γινώσκω അറിവിനെയോ അനുഭവപരമായ പരിചയത്തെയോ സൂചിപ്പിക്കാം. ‘അറിഞ്ഞിട്ടില്ലാത്തവർ’ ഈ പരിധി അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: സാത്താന്റെ ആഴങ്ങൾ
  rationale: βαθέα എന്നതിന്റെ ‘ആഴങ്ങൾ/ആഴമുള്ള കാര്യങ്ങൾ’ എന്ന രൂപകാത്മക അർഥവും, ഗൂഢമായ ആത്മീയജ്ഞാനത്തെക്കുറിച്ചുള്ള അവകാശവാദത്തിന്റെ സാധ്യതയുള്ള പ്രതിധ്വനിയും ഈ ചുരുക്കമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ὡς λέγουσιν
  choice: അവർ പറയുന്നതുപോലെ
  rationale: പ്രയോഗത്തിന്റെ റിപ്പോർട്ടുചെയ്യുന്ന സ്വഭാവം നിലനിർത്തുകയും, ഈ പേര് ആരുടെ കൃത്യമായ വിലയിരുത്തലാണെന്ന് വിവർത്തനത്തിൽ തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: നിങ്ങളുടേമേൽ മറ്റൊരു ഭാരവും ഞാൻ ചുമത്തുന്നില്ല
  rationale: βάλλω ἐπί എന്നത് ഇവിടെ ബാധ്യത ചുമത്തുക എന്ന ആശയമാണ്. ‘ഭാരം’ βάρος എന്ന രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘സാത്താന്റെ ആഴങ്ങൾ, അവർ പറയുന്നതുപോലെ’ എന്നതിന്റെ സൂചനയും ഭാവവും
  choice: ‘അവർ പറയുന്നതുപോലെ, സാത്താന്റെ ആഴങ്ങൾ’ എന്ന റിപ്പോർട്ടുചെയ്യുന്ന, സാധ്യതയുള്ള പരിഹാസഭാവമുള്ള പ്രയോഗമായി നിലനിർത്തി.
  alternative: തെറ്റായ ഉപദേശകർ തങ്ങളുടെ അറിവിനെ ‘ആഴങ്ങൾ’ എന്നു വിളിച്ചു, യോഹന്നാൻ അതിന്റെ യഥാർഥ ഉറവിടത്തെ സാത്താനുമായി ബന്ധപ്പെടുത്തി എന്നു തുറന്നുപറയുക; അല്ലെങ്കിൽ മുഴുവൻ പ്രയോഗവും യോഹന്നാന്റെ പരിഹാസനാമമാണെന്ന് വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ചുരുക്കവും വാദാത്മകവുമാണ്; കൃത്യമായി ആരുടെ പേരിടലാണെന്നത് നിർണയിക്കുന്നില്ല. അതിനാൽ വിവർത്തനം ആ ദൈവശാസ്ത്രപരവും വാചാടോപപരവുമായ സംഘർഷം തുറന്ന നിലയിൽ വിടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സഭാ വായനാശൈലി. പഴഞ്ചൻ പദക്രമം ഒഴിവാക്കി; മൂലത്തിലെ അഭിസംബോധന, രൂപകം, അവ്യക്തത എന്നിവ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചിക [a] പ്രധാന വാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
