id: REV.2.2
reference: Revelation 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: ml
  text: നിന്റെ പ്രവൃത്തികളും അധ്വാനവും സഹിഷ്ണുതയും ഞാൻ അറിയുന്നു. ദുഷ്ടരെ സഹിക്കാൻ നിനക്കു കഴിയില്ലെന്നും[a], തങ്ങളെ അപ്പൊസ്തലന്മാർ എന്നു പറയുന്നവരെ[b] നീ പരീക്ഷിച്ച്, അവർ അപ്പൊസ്തലന്മാരല്ലെന്നും അവരെ വ്യാജരെന്നു കണ്ടെത്തിയെന്നും ഞാൻ അറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദുഷ്ടരെ നീ സഹിച്ചുകൊടുക്കുന്നില്ല.” ഗ്രീക്കിൽ അക്ഷരാർഥം “സഹിക്കാൻ നിനക്കു കഴിയില്ല” എന്നാണ്; ഇവിടെ അവരെ സഹിക്കാനോ അനുവദിക്കാനോ വിസമ്മതിക്കുന്നതെന്ന ആശയവുമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അപ്പൊസ്തലന്മാരാണെന്ന് അവകാശപ്പെടുന്നവരെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: ഞാൻ അറിയുന്നു
  rationale: വർത്തമാനകാല അറിവിനെയും വ്യക്തിപരമായ വിലയിരുത്തലിനെയും നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: പ്രവർത്തനങ്ങളെയും ചെയ്തികളെയും വിശാലമായി ഉൾക്കൊള്ളുന്ന പദം; യോഹന്നാന്റെ രചനാശൈലിയോടും യോജിക്കുന്നു.
- source_word: κόπον
  choice: അധ്വാനം
  rationale: ക്ഷീണം വരുത്തുന്ന കഠിനപ്രയത്നം എന്ന κόπος-ന്റെ ഭാവം ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑπομονήν
  choice: സഹനം
  rationale: സമ്മർദത്തിനിടയിലും ഉറച്ചുനിൽക്കുന്ന ക്ഷമാപൂർവമായ നിലനിൽപ്പ് സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ പദം.
- source_word: οὐ δύνῃ βαστάσαι
  choice: സഹിക്കാൻ നിനക്കു കഴിയില്ല
  rationale: δύναμαι എന്ന ശേഷിസൂചനയും βαστάζω എന്ന ‘വഹിക്കുക/സഹിക്കുക’ എന്ന അടിസ്ഥാനഭാവവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ദുഷ്ടരെ അനുവദിച്ചുകൊടുക്കാത്തതെന്ന ആശയവും പ്രകടമാകുന്നു.
- source_word: κακούς
  choice: ദുഷ്ടരെ
  rationale: പുരുഷലിംഗ ബഹുവചന വിശേഷണം ഇവിടെ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന നാമമായി പ്രവർത്തിക്കുന്നു; ‘ദുഷ്ടരെ’ ലിംഗം അനാവശ്യമായി ചുരുക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐπείρασας
  choice: നീ പരീക്ഷിച്ച്
  rationale: അപ്പൊസ്തലത്വത്തെക്കുറിച്ചുള്ള അവകാശവാദം പരിശോധിച്ചു നിർണയിച്ചതിനെ ‘പരീക്ഷിക്കുക’ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: അപ്പൊസ്തലന്മാരെന്നു സ്വയം പറയുന്നവരെ
  rationale: ἑαυτούς എന്ന പ്രതിഫലനസർവനാമത്തിന്റെ ശക്തിയും സ്വയം ഉന്നയിച്ച പദവിയെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: ἀποστόλους
  choice: അപ്പൊസ്തലന്മാർ
  rationale: സഭാസന്ദർഭത്തിൽ അധികാരമുള്ള നിയുക്ത ദൂതന്മാരെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
- source_word: ψευδεῖς
  choice: വ്യാജന്മാർ
  rationale: അവരുടെ അവകാശവാദവും നിലയും അസത്യമാണെന്ന വിധി നൽകുന്നു; ‘കള്ളന്മാർ’ എന്നു പറഞ്ഞ് ഉദ്ദേശപൂർവമായ വഞ്ചനയെ അനാവശ്യമായി മുൻനിറുത്തുന്നില്ല.
theological_decisions:
- issue: ἀποστόλους എന്ന പദത്തിന്റെ സഭാസംബന്ധമായ അർഥം
  choice: അപ്പൊസ്തലന്മാർ
  alternative: ദൂതന്മാർ
  rationale: ഇവിടെ പരിശോധിക്കപ്പെടുന്നത് സഭയ്ക്കുള്ളിലെ അപ്പൊസ്തലിക അധികാരാവകാശമാണ്. ‘അപ്പൊസ്തലന്മാർ’ എന്നത് സാധ്യതയേറിയ സാങ്കേതിക അർഥം നിലനിർത്തുന്നു; പിന്നീടുണ്ടായ പ്രത്യേക സഭാഭരണരീതികളൊന്നും വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: κακούς എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: ദുഷ്ടരെ
  alternative: ദുഷ്ടപുരുഷന്മാരെ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുരുഷലിംഗം ഇവിടെ പൊതുവായി ആളുകളെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ഉദ്ദേശിച്ച വ്യക്തിസമൂഹത്തെ ലിംഗപരമായി അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: οὐ δύνῃ βαστάσαι എന്നതിലെ ശേഷിയും മനസ്സില്ലായ്മയും തമ്മിലുള്ള ഭാവം
  choice: സഹിക്കാൻ നിനക്കു കഴിയില്ല
  alternative: നീ സഹിച്ചുകൊടുക്കുന്നില്ല
  rationale: മൂലവാക്യത്തിലെ ‘കഴിയുക’ എന്ന ഘടന സംരക്ഷിക്കുമ്പോഴും സന്ദർഭത്തിലെ നൈതിക നിരാകരണം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു; ഒന്നിനെ മാത്രം നിർബന്ധിച്ച് അർഥത്തിലെ സംഘർഷം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ അഭിസംബോധനാശൈലി ഉപയോഗിച്ചു. ‘അധ്വാനം,’ ‘സഹനം,’ ‘പരീക്ഷിക്കുക’ എന്നീ സഭാപരിചിത പദങ്ങൾ സാധാരണ വായനക്കാർക്കും മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തി; ഗ്രീക്ക് വാക്യത്തിന്റെ സമാന്തര ഘടന പരമാവധി സംരക്ഷിച്ചു.
