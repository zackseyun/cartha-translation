  yaml_path: translation/nt/revelation/002/015.yaml
  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: ml
  text: അങ്ങനെ, നിക്കൊലാവ്യരുടെ ഉപദേശം അതേപോലെ മുറുകെപ്പിടിക്കുന്നവർ നിന്റെ ഇടയിലുമുണ്ട്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതുപോലെ’ അല്ലെങ്കിൽ ‘സമാനമായി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ഗ്രീക്ക് പദം ഇവർ ഈ ഉപദേശം മുറുകെപ്പിടിക്കുന്ന രീതിയെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ മുൻവാക്യത്തിൽ പറഞ്ഞവരോടുള്ള വിശാലമായ താരതമ്യം ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: അങ്ങനെ
  rationale: മുൻവാക്യത്തിലെ ശാസനയുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന താരതമ്യസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔχεις
  choice: നിന്റെ ഇടയിലുണ്ട്
  rationale: അക്ഷരാർഥം ‘നിനക്കുണ്ട്’ എന്നാണെങ്കിലും, സഭയുടെ കൂട്ടത്തിൽ അത്തരക്കാർ ഉണ്ടെന്ന സന്ദർഭാർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ഏകവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: καὶ σὺ
  choice: നിന്റെ ഇടയിലും
  rationale: ‘നീയും’ എന്ന ഊന്നലും മുൻവാക്യത്തോടുള്ള താരതമ്യവും ‘-ഉം’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: κρατοῦντας
  choice: മുറുകെപ്പിടിക്കുന്നവർ
  rationale: ഒരു ഉപദേശത്തോട് ഉറച്ചുനിൽക്കുകയോ അതിനെ പിന്തുടരുകയോ ചെയ്യുന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: διδαχὴν
  choice: ഉപദേശം
  rationale: സഭാസംബന്ധമായ അതിഭാരമുള്ള പദപ്രയോഗം ഒഴിവാക്കി, പഠിപ്പിക്കപ്പെടുന്ന ആശയത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപദം.
- source_word: Νικολαϊτῶν
  choice: നിക്കൊലായരുടെ
  rationale: ഗ്രീക്ക് സമൂഹനാമത്തെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ശബ്ദലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: ὁμοίως
  choice: അതേവിധം
  rationale: ‘അതുപോലെ/സമാനമായി’ എന്ന താരതമ്യാർഥം നിലനിർത്തുന്നു; ഇത് ഉപദേശം മുറുകെപ്പിടിക്കുന്ന രീതിയെയോ മുൻവാക്യത്തോടുള്ള വിശാലമായ താരതമ്യത്തെയോ സൂചിപ്പിക്കാമെന്ന ചെറിയ അവ്യക്തത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ὁμοίως എന്ന പദം വാക്യത്തിൽ ഏതിനോടാണ് ബന്ധപ്പെടുന്നത്
  choice: പ്രധാനപാഠത്തിൽ ‘അതേവിധം’ എന്ന് ക്രിയാഭാവത്തോട് ചേർത്ത് നൽകുന്നു; എന്നാൽ മുൻവാക്യവുമായി മുഴുവൻ പ്രസ്താവനയെയും താരതമ്യം ചെയ്യാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
  alternative: ‘അതുപോലെ, നിന്റെ ഇടയിലും നിക്കൊലായരുടെ ഉപദേശം മുറുകെപ്പിടിക്കുന്നവരുണ്ട്’ എന്ന് വാക്യത്തിന്റെ തുടക്കത്തിൽ ചേർക്കുക.
  rationale: ഗ്രീക്ക് പദക്രമം രണ്ടുവിധ ബന്ധത്തിനും ചെറിയ സാധ്യത നൽകുന്നു. പ്രധാനപാഠം സ്വാഭാവികമാക്കിക്കൊണ്ട് ഉറവിടത്തിലെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. അഭിസംബോധനയുടെ ഗ്രീക്ക് ഏകവചനം ‘നിന്റെ’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു; താരതമ്യസൂചനകളായ οὕτως, ὁμοίως എന്നിവ രണ്ടും ഒഴിവാക്കാതെ നൽകിയിരിക്കുന്നു.
