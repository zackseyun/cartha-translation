id: REV.2.12
reference: Revelation 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: ml
  text: 'പെർഗമൊസിലെ സഭയുടെ ദൂതന്[a] എഴുതുക: ‘മൂർച്ചയേറിയ ഇരുവായ്ത്തലയുള്ള വാൾ കൈവശമുള്ളവൻ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു:’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൂതൻ’ എന്നതിന് ‘സന്ദേശവാഹകൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ സൂചിപ്പിക്കുന്നത് ഒരു സ്വർഗീയ ജീവിയെയാണോ സഭയുടെ മനുഷ്യപ്രതിനിധിയെയാണോ എന്നതിൽ വ്യാഖ്യാതാക്കൾക്ക് അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ദൂതന്
  rationale: ἄγγελος എന്ന പദത്തിന് സ്വർഗീയ ദൂതനെയോ മനുഷ്യസന്ദേശവാഹകനെയോ സൂചിപ്പിക്കാം. ‘ദൂതൻ’ ഈ രണ്ടുസാധ്യതയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκκλησίας
  choice: സഭയുടെ
  rationale: ഇവിടെ പദം ക്രിസ്തീയ വിശ്വാസസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘സഭ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: Περγάμῳ
  choice: പെർഗമൊസിലെ
  rationale: Πέργαμος എന്ന സ്ഥലനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ രൂപം ഉപയോഗിച്ചു.
- source_word: γράψον
  choice: എഴുതുക
  rationale: γράφω എന്ന ക്രിയയുടെ ഏകവചന ആജ്ഞാരൂപം നേരിട്ട് പകർത്തുന്നു; തുടർന്നുള്ള ഉദ്ധരണി എഴുതേണ്ട ഉള്ളടക്കം നൽകുന്നു.
- source_word: Τάδε λέγει
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകീയവും രാജകീയവുമായ പ്രഖ്യാപനസൂത്രത്തിന്റെ ഔപചാരിക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἔχων
  choice: കൈവശമുള്ളവൻ
  rationale: വിവരണാത്മക സ്ഥാനപ്പേരായി വരുന്ന കർത്തൃവാചക കൃദന്തത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ῥομφαίαν
  choice: വാൾ
  rationale: പദം വലിയതോ ഭാരമേറിയതോ ആയ വാളിനെ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ ‘വാൾ’ മതിയായതും അനാവശ്യമായ അതിവ്യക്തീകരണം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: δίστομον
  choice: ഇരുവായ്ത്തലയുള്ള
  rationale: അക്ഷരാർഥത്തിൽ ‘രണ്ടുവായുള്ള’ എന്ന ദൃശ്യരൂപവും വാളിന്റെ ഇരുവശമൂർച്ചയും മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ὀξεῖαν
  choice: മൂർച്ചയേറിയ
  rationale: വാളിന്റെ തീക്ഷ്ണതയെ സൂചിപ്പിക്കുന്ന ὀξύς എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളസമാനം.
theological_decisions:
- issue: സഭയുടെ ‘ദൂതൻ’ ആരാണ്
  choice: പ്രധാനവാക്യത്തിൽ ‘ദൂതൻ’ എന്നു നിലനിർത്തി, സ്വർഗീയനോ മനുഷ്യനോ എന്നു നിർണയിച്ചില്ല.
  alternative: സന്ദേശവാഹകൻ; സഭാനേതാവ്; സ്വർഗീയ പ്രതിനിധി
  rationale: ἄγγελος എന്ന ഗ്രീക്കുപദവും ഈ വാക്യവും സൂചിപ്പിക്കപ്പെടുന്ന വ്യക്തിയുടെ സ്വഭാവം തീർച്ചപ്പെടുത്തുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ സംഘർഷം പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ‘അരുളിച്ചെയ്യുന്നു’ പ്രഖ്യാപനസൂത്രത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. ‘ദൂതൻ’ എന്ന പദം മൂലത്തിലെ യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
