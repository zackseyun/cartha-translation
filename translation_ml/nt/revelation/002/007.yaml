id: REV.2.7
reference: Revelation 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: ml
  text: ചെവിയുള്ളവൻ ആത്മാവ് സഭകളോടു പറയുന്നതു കേൾക്കട്ടെ. ജയിക്കുന്നവന് ദൈവത്തിന്റെ പറുദീസയിലുള്ള ജീവവൃക്ഷത്തിൽനിന്നു ഭക്ഷിക്കാൻ ഞാൻ കൊടുക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: ചെവിയുള്ളവൻ
  rationale: ഗ്രീക്കിലെ ഏകവചനവും പൊതുവായ ആഹ്വാനത്തിന്റെ സ്വഭാവവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀκουσάτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ ആഹ്വാനശക്തി നേരിട്ട് പകരുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: വെളിപ്പാട് 2–3-ലെ ആവർത്തിത സൂത്രവാക്യത്തിൽ പരിശുദ്ധാത്മാവാണ് സന്ദർഭസൂചിതനായ വ്യക്തി; മലയാളത്തിലെ ആദരസൂചക പ്രയോഗം അതു വ്യക്തമാക്കുന്നു.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: സഭകളോടു പറയുന്നതു
  rationale: വർത്തമാനകാല ക്രിയയും ബഹുവചന ἐκκλησίαις എന്നതും സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പകരുന്നു.
- source_word: τῷ νικῶντι
  choice: ജയിക്കുന്നവന്
  rationale: νικάω എന്ന ക്രിയയുടെ വിജയം നേടുക/ജയിക്കുക എന്ന സജീവമായ അർഥവും വെളിപ്പാടിലെ സംഘർഷ-വിജയ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: δώσω αὐτῷ φαγεῖν
  choice: ഭക്ഷിക്കാൻ ഞാൻ കൊടുക്കും
  rationale: ദാതാവിനെയും പ്രയോജനഭോക്താവിനെയും മലയാളത്തിലെ വിഭക്തികൾ വ്യക്തമാക്കുന്നതിനാൽ ഗ്രീക്കിലെ αὐτῷ വേറെ സർവനാമമായി ആവർത്തിക്കാതെ സ്വാഭാവികമായി അർഥം പകരുന്നു.
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: ജീവവൃക്ഷത്തിൽനിന്നു
  rationale: ἐκ എന്നതിന്റെ ഉറവിടസൂചന ‘നിന്നു’ കൊണ്ട് നിലനിർത്തുകയും ξύλον ഈ സന്ദർഭത്തിൽ ‘വൃക്ഷം’ എന്നു പകരുകയും ചെയ്യുന്നു.
- source_word: παραδείσῳ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പറുദീസയിൽ
  rationale: παράδεισος എന്ന പദത്തിന്റെ അന്തിമകാലപരവും തിരുവെഴുത്താന്തരബന്ധമുള്ളതുമായ ഭാരം ‘പറുദീസ’ നിലനിർത്തുന്നു; ജനിറ്റീവ് സ്വാഭാവിക ഉടമസ്ഥബന്ധമായി പകരുന്നു.
theological_decisions:
- issue: τὸ πνεῦμα എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ആത്മാവ്—സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവ്
  alternative: ഒരു പൊതുവായ ആത്മാവ്
  rationale: വെളിപ്പാട് 2–3-ലെ ആവർത്തിതമായ ദൈവിക അഭിസംബോധന പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു; വിവർത്തനം അധികമായ സിദ്ധാന്തവാചകം ചേർക്കുന്നില്ല.
- issue: νικάω എന്ന വിജയസൂത്രവാക്യത്തിന്റെ പരിഭാഷ
  choice: ജയിക്കുന്നവൻ
  alternative: അതിജീവിക്കുന്നവൻ / കീഴടക്കുന്നവൻ
  rationale: ‘ജയിക്കുക’ മലയാളത്തിൽ സ്വാഭാവികവും ക്രിയയുടെ വിജയാർഥത്തോടു നേരിട്ടു ചേർന്നതുമാണ്; ‘കീഴടക്കുക’ ഇവിടെ അതിക്രമപരമായ ഭാവം വരുത്താം.
- issue: പ്രതിനിധാന ഏകവചനം
  choice: ചെവിയുള്ളവൻ ... കേൾക്കട്ടെ
  alternative: ചെവിയുള്ളവർ കേൾക്കട്ടെ
  rationale: ഗ്രീക്കിലെ ഏകവചന രൂപം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ ഇത് ഏവരെയും ഉൾക്കൊള്ളുന്ന പൊതുവായ ആഹ്വാനമായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
- issue: ജീവവൃക്ഷത്തിൽനിന്നു ഭക്ഷിക്കാനുള്ള വാഗ്ദാനം
  choice: ഭക്ഷിക്കാൻ ഞാൻ കൊടുക്കും
  alternative: ഭക്ഷിക്കാനുള്ള അവകാശം ഞാൻ നൽകും
  rationale: മൂലപാഠം ‘അവകാശം’ എന്നു വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ആ വ്യാഖ്യാനം ചേർക്കാതെ δώσω ... φαγεῖν എന്ന ഘടനയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘സഭ’, ‘ആത്മാവ്’, ‘ജീവവൃക്ഷം’, ‘പറുദീസ’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യമായ സഭാവിഭാഗീയ വ്യാഖ്യാനം ഒഴിവാക്കി.
