revisions:
- from: ചെവിയുള്ളവൻ സഭകളോടു ആത്മാവ് പറയുന്നതു കേൾക്കട്ടെ. ജയിക്കുന്നവന് ദൈവത്തിന്റെ പറുദീസയിലുള്ള ജീവവൃക്ഷത്തിൽനിന്നു ഭക്ഷിക്കാൻ ഞാൻ കൊടുക്കും.[a]
