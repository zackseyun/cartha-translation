id: REV.2.18
reference: Revelation 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: ml
  text: 'തുയഥൈരയിലെ സഭയുടെ ദൂതന്[a] എഴുതുക: അഗ്നിയുടെ ജ്വാലപോലെ കണ്ണുകളും മിനുക്കിയ വെങ്കലംപോലെ[b] കാലുകളും ഉള്ള ദൈവപുത്രൻ ഇപ്രകാരം പറയുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സന്ദേശവാഹകന്.”
    reason: alternative_reading
  - marker: b
    text: “മിനുക്കിയ വെങ്കലം” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം അപൂർവമാണ്; അത് കൂടുതൽ പൊതുവായി ശുദ്ധീകരിച്ച, തിളങ്ങുന്ന ഒരു ലോഹത്തെയോ ലോഹസങ്കരത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ദൂതന്
  rationale: ἄγγελος എന്ന പദത്തിന് ‘ദൂതൻ’ എന്നത് സ്വാഭാവികവും അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമായ മലയാളപരിഭാഷയാണ്. വെളിപ്പാടിലെ ഏഴു സഭകളോടുള്ള ആവർത്തിത അഭിസംബോധനയിൽ ഇത് ദൈവദൂതനെയോ സന്ദേശവാഹകനെയോ സൂചിപ്പിക്കാം; ആ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐκκλησίας
  choice: സഭയുടെ
  rationale: ഇവിടെ പദം ഒരു ക്രൈസ്തവ വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ അംഗീകൃതവും സ്വാഭാവികവുമായ ‘സഭ’ തെരഞ്ഞെടുത്തു.
- source_word: Τάδε λέγει
  choice: ഇപ്രകാരം പറയുന്നു
  rationale: പ്രവാചകസന്ദേശത്തിന്റെ ഔപചാരിക സൂത്രവാക്യഭാവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പുത്രത്വ-ദൈവബന്ധ ശീർഷകം ചുരുക്കാതെയും വ്യാഖ്യാനിച്ച് മാറ്റാതെയും നേരിട്ട് പകർന്നു.
- source_word: ὁ ἔχων
  choice: ഉള്ള
  rationale: സംസാരിക്കുന്നവനെ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് ആർട്ടിക്കുലർ പാർട്ടിസിപ്പിളിന്റെ വിവരണാത്മക ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὀφθαλμοὺς ... ὡς φλόγα πυρός
  choice: അഗ്നിജ്വാലപോലെ കണ്ണുകൾ
  rationale: ഗ്രീക്കിലെ ഉപമയും ഉജ്ജ്വലമായ അപ്പോക്കലിപ്റ്റിക് ദൃശ്യവും അടുത്തായി പകർന്നു.
- source_word: πόδες ... ὅμοιοι χαλκολιβάνῳ
  choice: മിനുക്കിയ വെങ്കലംപോലെ കാലുകൾ
  rationale: അപൂർവമായ χαλκολίβανον സൂചിപ്പിക്കുന്ന തിളക്കമുള്ള ശുദ്ധീകരിച്ച ലോഹത്തിന്റെ ചിത്രം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; കൃത്യമായ ലോഹപരിചയം അനിശ്ചിതമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സംസാരിക്കുന്നവന്റെ ക്രിസ്തുശാസ്ത്രപരമായ സ്വയംപരിചയം
  choice: ദൈവപുത്രൻ
  alternative: ദൈവത്തിന്റെ പുത്രൻ
  rationale: മൂലപാഠത്തിലെ ὁ υἱὸς τοῦ θεοῦ എന്ന ശീർഷകം വ്യക്തമായി നിലനിർത്തുന്നു. ‘ദൈവപുത്രൻ’ സ്വാഭാവികമായ മലയാളരൂപമാണ്; അതിന്റെ താത്വിക ഉള്ളടക്കം മൃദൂകരിക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: തുയഥൈരയിലെ സഭയോടുള്ള അഭിസംബോധനയിലെ ἀγγέλῳ എന്ന പദത്തിന്റെ സൂചിതവ്യക്തി
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: ‘ദൂതൻ’ സ്വർഗീയ ദൂതനെയും നിയോഗിക്കപ്പെട്ട സന്ദേശവാഹകനെയും സൂചിപ്പിക്കാൻ കഴിയുന്നതിനാൽ മൂലപദത്തിന്റെ യഥാർഥ വ്യാഖ്യാനാവകാശം നിലനിർത്തുന്നു; മനുഷ്യ സന്ദേശവാഹകൻ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ ഔപചാരിക സന്ദേശസൂത്രവും ദൃശ്യാത്മക ഉപമകളും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
