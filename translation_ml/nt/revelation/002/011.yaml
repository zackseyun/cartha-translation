id: REV.2.11
reference: Revelation 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: ml
  text: ചെവിയുള്ളവൻ ആത്മാവ് സഭകളോടു പറയുന്നതെന്തെന്നു കേൾക്കട്ടെ. ജയിക്കുന്നവന് രണ്ടാം മരണത്താൽ ഒരിക്കലും ഒരു ദോഷവും സംഭവിക്കുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: ചെവിയുള്ളവൻ
  rationale: ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിപരമായ പ്രയോഗത്തിന്റെ രൂപവും പ്രസിദ്ധമായ ആഹ്വാനശൈലിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀκουσάτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ ആഹ്വാനപരമായ ശക്തി കൃത്യമായി നൽകുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: സഭകളോട് സംസാരിക്കുന്ന ദൈവിക വ്യക്തിയെയാണ് വെളിപ്പാടിലെ ആവർത്തിത സൂത്രവാക്യം സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘ആത്മാവ്’ സ്വാഭാവികമാണ്.
- source_word: ταῖς ἐκκλησίαις
  choice: സഭകളോട്
  rationale: വെളിപ്പാട് 2–3-ൽ അഭിസംബോധന ചെയ്യപ്പെടുന്ന വിശ്വാസസമൂഹങ്ങളെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὁ νικῶν
  choice: ജയിക്കുന്നവൻ
  rationale: νικάω എന്ന പദത്തിന്റെ വിജയിക്കുക/ജയിക്കുക എന്ന സജീവ അർഥവും വർത്തമാന പങ്കാളിരൂപത്തിന്റെ തുടർച്ചയായ സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: οὐ μὴ
  choice: ഒരിക്കലും ... ഇല്ല
  rationale: ഗ്രീക്കിലെ ശക്തമായ നിഷേധം ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഊന്നലോടെയും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀδικηθῇ
  choice: ദോഷം സംഭവിക്കുകയില്ല
  rationale: ഇവിടെ പദം നിയമപരമായി ‘അനീതി ചെയ്യപ്പെടുക’ എന്നതിലുപരി ദോഷകരമായി ബാധിക്കപ്പെടുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ കർമണസദൃശ പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: രണ്ടാം മരണത്താൽ
  rationale: ἐκ ഇവിടെ ദോഷത്തിന്റെ ഉറവിടമോ കാരണബന്ധമോ സൂചിപ്പിക്കുന്നു; ‘-ത്താൽ’ ആ ബന്ധം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ആത്മാവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: സഭകളോട് സംസാരിക്കുന്ന പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി ‘ആത്മാവ്’ എന്നു നൽകി
  alternative: പൊതുവായി പ്രവാചകാത്മാവ്
  rationale: വെളിപ്പാടിലെ ആവർത്തിത സന്ദേശസൂത്രത്തിൽ ആത്മാവ് ദൈവിക വക്താവായി പ്രവർത്തിക്കുന്നു; എന്നാൽ പാഠത്തിൽ ‘പരിശുദ്ധ’ എന്ന് കൂട്ടിച്ചേർത്ത് വ്യാഖ്യാനം വികസിപ്പിച്ചിട്ടില്ല.
- issue: പ്രതിനിധിപരമായ ഏകവചന പുല്ലിംഗരൂപങ്ങൾ
  choice: ‘ചെവിയുള്ളവൻ’, ‘ജയിക്കുന്നവൻ’ എന്നീ ഏകവചന രൂപങ്ങൾ നിലനിർത്തി
  alternative: ലിംഗനിരപേക്ഷ ബഹുവചനമായി പുനർരചന
  rationale: ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുമ്പോഴും അതിന്റെ പൊതുവായ ആഹ്വാനം വ്യക്തമാണ്.
- issue: ‘രണ്ടാം മരണം’ എന്നതിന്റെ അർഥം
  choice: വ്യാഖ്യാനവികസനം കൂടാതെ അതേ പ്രയോഗം നിലനിർത്തി
  alternative: അന്തിമ ന്യായവിധി അല്ലെങ്കിൽ നിത്യശിക്ഷ എന്നു വിശദീകരിക്കുക
  rationale: വെളിപ്പാടിനകത്ത് തന്നെ കൂടുതൽ അർഥവികാസം ലഭിക്കുന്ന ദൈവശാസ്ത്രപരമായി ഭാരമുള്ള പ്രയോഗമായതിനാൽ പരിഭാഷയിൽ മുൻകൂട്ടി വ്യാഖ്യാനിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലപാഠത്തിൽ പാഠഭേദമോ നിർബന്ധമായ വിശദീകരണമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല; നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ്-മാർക്കറുകളുടെ ഉള്ളടക്കം അനുബന്ധ പദങ്ങളുമായി പൊരുത്തപ്പെടാത്തതിനാൽ അവ അനുകരിച്ചിട്ടില്ല.
