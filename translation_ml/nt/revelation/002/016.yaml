- from: അതുകൊണ്ട് മാനസാന്തരപ്പെടുക. അല്ലെങ്കിൽ, ഞാൻ നിന്റെ അടുക്കൽ വേഗത്തിൽ വരുന്നു; എന്റെ വായിലെ വാൾകൊണ്ട് അവരോടു യുദ്ധം ചെയ്യും.[a][b]
