reference: Revelation 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: ml
  text: അതുകൊണ്ട്, മാനസാന്തരപ്പെടുക. എന്നാൽ, അങ്ങനെ ചെയ്യുന്നില്ലെങ്കിൽ, ഞാൻ നിന്റെ അടുക്കൽ വേഗത്തിൽ വരുന്നു; എന്റെ വായിലെ വാൾകൊണ്ട്[b] അവർക്കെതിരെ[a] യുദ്ധം ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർക്കെതിരെ’ എന്നതിന് അടിസ്ഥാനമായ ഗ്രീക്ക് പ്രയോഗം പദശഃ ‘അവരോടൊപ്പം’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ‘യുദ്ധം ചെയ്യും’ എന്ന ക്രിയയോടൊപ്പം ഇവിടെ അർഥം ‘അവർക്കെതിരെ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ വായിലെ വാൾ’ എന്നത് ക്രിസ്തുവിന്റെ ന്യായവിധിനിറഞ്ഞ വചനത്തെയോ വിധിപ്രഖ്യാപനത്തെയോ ചിത്രീകരിക്കുന്ന അന്ത്യകാലദർശനപരമായ രൂപകമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: മാനസാന്തരപ്പെടുക
  rationale: നിർണായകമായ ധാർമിക-ആത്മീയ തിരിഞ്ഞുവരവിനുള്ള ഏകവചന ആജ്ഞയാണ്. ‘മനം മാറ്റുക’ എന്നതിനെക്കാൾ ഉറവിടത്തിലെ ഗൗരവവും സമഗ്രമായ തിരിഞ്ഞുവരവും ഇത് നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ ശാസനയിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: εἰ δὲ μή
  choice: അല്ലെങ്കിൽ
  rationale: അനുസരിക്കാത്ത പക്ഷമുള്ള മുന്നറിയിപ്പിനെ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായും മൂർച്ചയോടെയും അവതരിപ്പിക്കുന്നു.
- source_word: ἔρχομαί σοι
  choice: ഞാൻ നിന്റെ അടുക്കൽ ... വരുന്നു
  rationale: വർത്തമാനകാലരൂപത്തിന്റെ ആസന്നത നിലനിർത്തുന്നു. ശത്രുതാഭാവം ഈ പ്രയോഗത്തിലേക്ക് മുൻകൂട്ടി ചേർക്കാതെ തുടർന്നുള്ള ‘യുദ്ധം ചെയ്യും’ എന്ന വാക്യത്തിൽനിന്ന് വ്യക്തമാകാൻ അനുവദിക്കുന്നു.
- source_word: ταχύ
  choice: വേഗത്തിൽ
  rationale: കാലസമീപ്യതയോ പെട്ടെന്നുള്ള സംഭവമോ എന്ന രണ്ടുസാധ്യതകളിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കാതെ ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ വേഗതാസൂചന നിലനിർത്തുന്നു.
- source_word: πολεμήσω μετ’ αὐτῶν
  choice: അവരോടു യുദ്ധം ചെയ്യും
  rationale: πολεμέω എന്നതിന്റെ ശക്തമായ സൈനികഭാവം നിലനിർത്തുന്നു. ഇവിടെ ‘അവരോടു’ എന്ന മലയാളപ്രയോഗം സഖ്യതയെയല്ല, എതിരാളികളോടുള്ള യുദ്ധത്തെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: വാൾകൊണ്ട്
  rationale: ἐν എന്നതിന്റെ കരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ന്യായവിധിയുടെ സജീവ ദൃശ്യരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τῇ ῥομφαίᾳ τοῦ στόματός μου
  choice: എന്റെ വായിലെ വാൾ
  rationale: വാളിന്റെ പ്രത്യേക വലിപ്പം അമിതമായി വ്യക്തമാക്കാതെ ‘വാൾ’ എന്ന സ്ഥാപിത ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘എന്റെ വചനം’ എന്നു വ്യാഖ്യാനിച്ച് രൂപകത്തെ പരത്തുന്നില്ല.
theological_decisions:
- issue: സഭയോടുള്ള ക്രിസ്തുവിന്റെ വരവും ചിലർക്കെതിരായ യുദ്ധവും തമ്മിലുള്ള വ്യത്യാസം
  choice: ‘നിന്റെ അടുക്കൽ’ എന്ന ഏകവചന സഭാസംബോധനയും ‘അവരോടു യുദ്ധം ചെയ്യും’ എന്ന ലക്ഷ്യനിർണ്ണയവും രണ്ടും നിലനിർത്തി.
  alternative: മുഴുവൻ സഭയോടും വ്യത്യാസമില്ലാതെ യുദ്ധം ചെയ്യുമെന്നോ, ക്രിസ്തുവിന്റെ വരവ് സഭയെ ഒട്ടും സംബന്ധിക്കുന്നില്ലെന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം സഭയെ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുമ്പോഴും യുദ്ധത്തിന്റെ ലക്ഷ്യമായി ‘അവരെ’ ചൂണ്ടിക്കാണിക്കുന്നു. ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ പാഠത്തിലുള്ളതുപോലെ സംരക്ഷിക്കുന്നു.
- issue: വിധിന്യായത്തിന്റെ ഉപകരണമായ ‘വായിലെ വാൾ’
  choice: അന്ത്യകാലദർശനപരമായ രൂപകം അതേപടി നിലനിർത്തി.
  alternative: ‘എന്റെ വചനം’ അല്ലെങ്കിൽ ‘എന്റെ വിധിപ്രഖ്യാപനം’ എന്നു പരാവർത്തനം ചെയ്യുക.
  rationale: വെളിപ്പാടുപുസ്തകത്തിലെ ഉജ്ജ്വലമായ ദൃശ്യഭാഷയെ വിശദീകരണപരമായ ആശയമായി ചുരുക്കാതെ അതിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര ശക്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മാനസാന്തരപ്പെടുക’ എന്ന സ്ഥാപിത ധാർമിക പദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി. മൂലത്തിലെ ഏകവചന ‘നീ’യും ബഹുവചന ‘അവർ’യും വ്യക്തമായി സംരക്ഷിച്ചു.
