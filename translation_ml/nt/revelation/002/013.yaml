id: REV.2.13
reference: Revelation 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: ml
  text: നീ എവിടെയാണ് വസിക്കുന്നതെന്ന് എനിക്കറിയാം—സാത്താന്റെ സിംഹാസനം ഉള്ളിടത്ത്. എങ്കിലും നീ എന്റെ നാമം മുറുകെപ്പിടിക്കുന്നു; എന്നിലുള്ള വിശ്വാസം നീ നിഷേധിച്ചില്ല[a]—അന്തിപ്പാസിന്റെ നാളുകളിൽപ്പോലും, എന്റെ സാക്ഷി[b], എന്റെ വിശ്വസ്തൻ, നിങ്ങളുടെ ഇടയിൽ, സാത്താൻ വസിക്കുന്നിടത്ത്, കൊല്ലപ്പെട്ടവൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘എന്റെ വിശ്വാസം.’ ഈ ഗ്രീക്ക് പ്രയോഗം ‘എന്നിലുള്ള വിശ്വാസം’ എന്നോ ‘എന്റെ വിശ്വസ്തത’ എന്നോ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ ‘എന്റെ രക്തസാക്ഷി.’ ഗ്രീക്ക് പദത്തിന് ‘സാക്ഷി’ എന്നാണ് അടിസ്ഥാനാർഥം; പീഡനത്തിന്റെയോ മരണത്തിന്റെയോ സന്ദർഭത്തിൽ ‘രക്തസാക്ഷി’ എന്ന അർഥവും അതിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: എനിക്കറിയാം
  rationale: വർത്തമാനാർഥമുള്ള ഗ്രീക്ക് പൂർണകാലരൂപത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: κατοικεῖς
  choice: നീ ... വസിക്കുന്നു
  rationale: സ്ഥിരമായി പാർക്കുക എന്ന ആശയം മാന്യവും സാധാരണക്കാർക്ക് വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: സാത്താന്റെ സിംഹാസനം ഉള്ളിടത്ത്
  rationale: വ്യാഖ്യാനപരമായ വിശദീകരണം ചേർക്കാതെ മൂലപാഠത്തിലെ ശക്തമായ അപ്പോക്കലിപ്റ്റിക് ദൃശ്യഭാഷ നിലനിർത്തുന്നു.
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: നീ എന്റെ നാമം മുറുകെപ്പിടിക്കുന്നു
  rationale: κρατέω സൂചിപ്പിക്കുന്ന ഉറച്ച പറ്റിപ്പിടിക്കലും വിശ്വസ്തമായ ചേർന്നുനിൽപ്പും പ്രകടമാക്കുന്നു; ‘നാമം’ എന്ന മൂലരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: τὴν πίστιν μου
  choice: എന്നിലുള്ള വിശ്വാസം
  rationale: ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ലക്ഷ്യസംബന്ധിയായ വായനയാണ് മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നത്; ഗ്രീക്കിലെ സംക്ഷിപ്തവും ബഹുവ്യാഖ്യാനസാധ്യതയുള്ളതുമായ ‘എന്റെ വിശ്വാസം’ എന്ന രൂപവും ‘എന്റെ വിശ്വസ്തത’ എന്ന സാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὁ μάρτυς μου
  choice: എന്റെ സാക്ഷി
  rationale: μάρτυς എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘സാക്ഷി’ എന്നാണ്; മരണസന്ദർഭത്തിൽ സാധ്യമായ ‘രക്തസാക്ഷി’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὁ πιστός μου
  choice: എന്റെ വിശ്വസ്തൻ
  rationale: മുൻപുള്ള ‘സാക്ഷി’ എന്ന നാമത്തിലേക്ക് ലയിപ്പിക്കാതെ, മൂലത്തിലെ സമാനാധികരണ ഘടനയും വ്യക്തിപരമായ ഉടമസ്ഥസൂചനയും നിലനിർത്തുന്നു.
- source_word: ἀπεκτάνθη παρ’ ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ ... കൊല്ലപ്പെട്ടു
  rationale: സഭ തന്നെയാണ് കൊന്നതെന്ന തെറ്റായ സൂചന ഒഴിവാക്കി, παρά + ദത്തിവ് സൂചിപ്പിക്കുന്ന ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന സ്ഥലസംബന്ധം നൽകുന്നു.
theological_decisions:
- issue: τὴν πίστιν μου എന്നതിലെ ജനിറ്റീവിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘എന്നിലുള്ള വിശ്വാസം’
  alternative: ‘എന്റെ വിശ്വാസം’ അല്ലെങ്കിൽ ‘എന്റെ വിശ്വസ്തത’
  rationale: സന്ദർഭത്തിൽ ക്രിസ്തുവിലുള്ള വിശ്വാസം നിഷേധിക്കാതിരുന്നതാണ് ഏറ്റവും സ്വാഭാവികമായ വായന. എന്നാൽ ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും യഥാർഥത്തിൽ ബഹുവ്യാഖ്യാനസാധ്യതയുള്ളതുമായതിനാൽ മറ്റു വായനകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: മരണസന്ദർഭത്തിലെ μάρτυς
  choice: മുഖ്യപാഠത്തിൽ ‘സാക്ഷി’
  alternative: ‘രക്തസാക്ഷി’
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം സംരക്ഷിക്കുമ്പോൾ, അന്തിപ്പാസ് കൊല്ലപ്പെട്ടതുകൊണ്ട് ഇവിടെ ഉയരുന്ന ‘രക്തസാക്ഷി’ എന്ന അർഥനിറം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു; പിൽക്കാലത്തെ സാങ്കേതികപ്രയോഗം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ച് ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ശൈലി. അപ്പോക്കലിപ്റ്റിക് ദൃശ്യഭാഷയായ ‘സാത്താന്റെ സിംഹാസനം’ വിശദീകരിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ ബന്ധങ്ങൾ വ്യക്തമാക്കാൻ മലയാളത്തിൽ വിരാമചിഹ്നങ്ങളും അവസാനത്തെ ക്രിയയുടെ ആവർത്തനവും ഉപയോഗിച്ചു; അർഥപരമായ പുതിയ അവകാശവാദം ചേർത്തിട്ടില്ല.
