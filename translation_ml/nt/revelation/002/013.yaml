  to: നീ എവിടെയാണ് വസിക്കുന്നതെന്ന് എനിക്കറിയാം—സാത്താന്റെ സിംഹാസനം ഉള്ളിടത്ത്. എങ്കിലും നീ എന്റെ നാമം മുറുകെപ്പിടിക്കുന്നു; എന്നിലുള്ള വിശ്വാസം നീ നിഷേധിച്ചില്ല[a]—അന്തിപ്പാസിന്റെ നാളുകളിൽപ്പോലും, എന്റെ സാക്ഷി[b], എന്റെ വിശ്വസ്തൻ, നിങ്ങളുടെ ഇടയിൽ, സാത്താൻ വസിക്കുന്നിടത്ത്, കൊല്ലപ്പെട്ടവൻ.
