id: REV.2.14
reference: Revelation 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: ml
  text: 'എങ്കിലും നിനക്കെതിരായി എനിക്ക് ചില കാര്യങ്ങളുണ്ട്: അവിടെ ബിലെയാമിന്റെ ഉപദേശം മുറുകെപ്പിടിക്കുന്ന ചിലർ നിനക്കുണ്ട്. വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം കഴിക്കാനും ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടാനും ഇസ്രായേൽമക്കളുടെ മുമ്പിൽ ഒരു ഇടർച്ചക്കല്ല് വെക്കാൻ ബാലാക്കിനെ പഠിപ്പിച്ചത് അവനായിരുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλίγα
  choice: ചില കാര്യങ്ങൾ
  rationale: നപുംസക ബഹുവചന വിശേഷണം നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നു; മലയാളത്തിൽ സൂചിതമായ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κρατοῦντας τὴν διδαχὴν
  choice: ഉപദേശം മുറുകെപ്പിടിക്കുന്ന
  rationale: ഒരു പഠിപ്പിക്കലിനോടുള്ള ഉറച്ച അനുസരണം സൂചിപ്പിക്കുന്നു; ഭൗതികമായി പിടിക്കുക എന്ന അർഥമല്ല.
- source_word: Βαλαάμ / Βαλὰκ
  choice: ബിലെയാം / ബാലാക്ക്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ നാമരൂപങ്ങൾ സ്വീകരിച്ചു.
- source_word: ἐδίδασκεν τῷ Βαλὰκ
  choice: ബാലാക്കിനെ പഠിപ്പിച്ചത്
  rationale: ഗ്രീക്ക് imperfect ഇവിടെ ഭൂതകാലത്തിലെ പ്രവർത്തനം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലരൂപം ഉപയോഗിച്ചു, അതിന്റെ ആവർത്തനസ്വഭാവം അനാവശ്യമായി നിർണയിച്ചില്ല.
- source_word: βαλεῖν σκάνδαλον
  choice: ഒരു ഇടർച്ചക്കല്ല് ... വെക്കാൻ
  rationale: ധാർമികമോ ആത്മീയമോ ആയ വീഴ്ചയ്ക്ക് കാരണമാകുന്ന വസ്തുവെന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തുന്നു.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: ഇസ്രായേൽമക്കളുടെ
  rationale: ഇത് 'ഇസ്രായേലിന്റെ പുത്രന്മാർ' എന്ന സെമിറ്റിക് സമൂഹനാമത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവികവും ആദരവുറ്റതുമായ രൂപമാണ്.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം കഴിക്കാൻ
  rationale: വിഗ്രഹാരാധനയിൽ അർപ്പിക്കപ്പെട്ട ഭക്ഷണമെന്ന ആരാധനാസംബന്ധമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: πορνεῦσαι
  choice: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടാൻ
  rationale: അനുവദനീയമല്ലാത്ത ലൈംഗിക പെരുമാറ്റത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: τῶν υἱῶν Ἰσραήλ എന്നതിലെ ലിംഗസൂചന എങ്ങനെ നൽകണം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഗ്രീക്കിന്റെ അക്ഷരാർഥം പാദക്കുറിപ്പിൽ സംരക്ഷിച്ചുകൊണ്ട്, സമൂഹത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത പ്രയോഗത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം മുഖ്യവാചകത്തിൽ നൽകി.
- issue: σκάνδαλον എന്ന രൂപകം അക്ഷരാർഥത്തിലോ വ്യാഖ്യാനിച്ചോ നൽകണമോ
  choice: ഇടർച്ചക്കല്ല്
  alternative: കെണി / പാപത്തിലേക്കുള്ള പ്രലോഭനം
  rationale: വീഴ്ചയ്ക്ക് ഇടയാക്കുന്ന വസ്തുവെന്ന ദൈവശാസ്ത്രപരമായ രൂപകം സംരക്ഷിക്കുന്നു; അതിനെ ഒരു പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: φαγεῖν ... καὶ πορνεῦσαι എന്ന infinitive-ുകളുടെ ബന്ധം
  choice: ഇടർച്ചക്കല്ലിന്റെ ഫലമോ ലക്ഷ്യമോ വ്യക്തമാക്കുന്ന സമാന്തര പ്രവൃത്തികളായി വിവർത്തനം ചെയ്തു
  alternative: ബാലാക്ക് പഠിപ്പിച്ച കാര്യങ്ങളുടെ നേരിട്ടുള്ള പട്ടികയായി മാത്രം നൽകുക
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ ഇവ σκάνδαλον എന്നതിന്റെ ഉള്ളടക്കമോ ഉദ്ദേശ്യമോ വ്യക്തമാക്കാം; മലയാളരൂപം ആ ബന്ധം വായനാസൗകര്യത്തോടെ നൽകുന്നു, എന്നാൽ രണ്ടിനെയും വേർതിരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ രൂപകവും നൈതിക പദങ്ങളുടെ വ്യാപ്തിയും സംരക്ഷിച്ചു. ഈ കരടിൽ പാദക്കുറിപ്പുകൾ ആവശ്യമില്ലാത്തതിനാൽ മുഖ്യവാചകത്തിൽ പാദക്കുറിപ്പ് ചിഹ്നങ്ങളില്ല.
