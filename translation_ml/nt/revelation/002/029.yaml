id: REV.2.29
reference: Revelation 2:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/029.yaml
  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: ml
  text: ചെവിയുള്ളവൻ ആത്മാവ് സഭകളോടു പറയുന്നത് കേൾക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: ചെവിയുള്ളവൻ
  rationale: ഗ്രീക്കിലെ നിർദ്ദിഷ്ട ഉപവാക്യപ്രയോഗവും ഏകവചനമായ οὖς-ഉം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; പൊതുവായ ആഹ്വാനത്തിന്റെ സദൃശവാക്യസ്വഭാവവും ഇതിലൂടെ സംരക്ഷിക്കപ്പെടുന്നു.
- source_word: ἀκουσάτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ ഗൗരവമുള്ള ആഹ്വാനം സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു നൽകുന്നു; വെറും ശബ്ദഗ്രഹണമല്ല, ശ്രദ്ധിച്ചു പ്രതികരിക്കണമെന്ന ആശയവും സന്ദർഭത്തിൽ തുറന്നുനിൽക്കുന്നു.
- source_word: τί
  choice: പറയുന്നത്
  rationale: λέγει എന്ന ക്രിയയോടു ചേർത്ത് ‘എന്ത്/പറയുന്ന കാര്യം’ എന്ന ഉള്ളടക്കബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ നാമീകൃത ക്രിയാരൂപത്തിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: വെളിപ്പാട് 2–3-ലെ ആവർത്തിത സൂത്രവാക്യത്തിൽ സഭകളോട് സംസാരിക്കുന്ന ദൈവാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ രൂപം അധിക വിശദീകരണം ചേർക്കാതെ ആ സൂചന നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറയുന്നത്
  rationale: വർത്തമാനകാലത്തിന്റെ തുടർച്ചയായ അഥവാ സ്വഭാവസവിശേഷമായ സംസാരത്തെ മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ταῖς ἐκκλησίαις
  choice: സഭകളോട്
  rationale: ഇവിടെ ἐκκλησίαι സഭാസമൂഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ബഹുവചനം നിലനിർത്തുകയും λέγει-യോടുള്ള പരോക്ഷകർമബന്ധം ‘-ഓട്’ വഴി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ആത്മാവ്’ എന്നതിന്റെ സൂചിത വ്യക്തി
  choice: സഭകളോട് സംസാരിക്കുന്ന പരിശുദ്ധാത്മാവ്
  alternative: മനുഷ്യാത്മാവ്; യേശുവിന്റെ സന്ദേശമോ അതിന്റെ ആത്മാവോ
  rationale: വെളിപ്പാട് 2–3-ലെ ആവർത്തിത സമാപനാഹ്വാനം ആത്മാവിനെ എല്ലാ സഭകളോടും സംസാരിക്കുന്ന ദൈവിക പ്രഭാഷകനായി അവതരിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘പരിശുദ്ധ’ എന്ന വിശേഷണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ ‘ആത്മാവ്’ എന്നു നൽകുന്നത് സൂചനയും പാഠത്തിന്റെ സംക്ഷിപ്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും ലാളിത്യവും ചേർന്ന രൂപം. പരമ്പരാഗത ബൈബിൾ ശൈലിയിലെ അത്യന്തം പുരാതനമായ പദക്രമം ഒഴിവാക്കി, മൂലത്തിലെ ഏകവചനവും ആജ്ഞാഭാവവും സഭകളെന്ന ബഹുവചനവും സംരക്ഷിച്ചു.
