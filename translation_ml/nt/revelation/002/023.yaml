id: REV.2.23
reference: Revelation 2:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: ml
  text: അവളുടെ മക്കളെ ഞാൻ മരണംകൊണ്ട് കൊല്ലും[a]. ഹൃദയങ്ങളും അന്തരംഗങ്ങളും പരിശോധിക്കുന്നവൻ ഞാനാണെന്ന് എല്ലാ സഭകളും അറിയും[b]. നിങ്ങളിൽ ഓരോരുത്തർക്കും അവരവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച് ഞാൻ നൽകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘മഹാമാരിയാൽ കൊല്ലും.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘മരണംകൊണ്ട് കൊല്ലും’ എന്നാണ്; ഇത് ന്യായവിധിയുടെ തീവ്രത കൂട്ടുന്ന പ്രയോഗമോ പഴയനിയമത്തിലെ ന്യായവിധിഭാഷയുടെ പ്രതിധ്വനിയോ ആയിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘വൃക്കകളും ഹൃദയങ്ങളും’ എന്നാണ്—മനുഷ്യന്റെ മറഞ്ഞ പ്രേരണകളും ചിന്തകളും ആഗ്രഹങ്ങളും ഉൾപ്പെടുന്ന അന്തരംഗത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: മക്കൾ
  rationale: ‘മക്കൾ’ എന്നത് ജൈവസന്തതിയെയോ ആലങ്കാരികമായി അനുയായികളെയോ സൂചിപ്പിക്കാം; ഗ്രീക്കിലെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: ἀποκτενῶ ἐν θανάτῳ
  choice: മരണംകൊണ്ട് കൊല്ലും
  rationale: അസാധാരണമായ ‘മരണത്താൽ/മരണംകൊണ്ട് കൊല്ലുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തിയും പഴയനിയമ ന്യായവിധിഭാഷയുമായുള്ള പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു; ‘മഹാമാരിയാൽ’ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐκκλησίαι
  choice: സഭകൾ
  rationale: വെളിപ്പാടിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്ന ക്രൈസ്തവ സമൂഹങ്ങൾക്ക് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപദം.
- source_word: ὁ ἐραυνῶν
  choice: പരിശോധിക്കുന്നവൻ
  rationale: തുടർച്ചയായ സൂക്ഷ്മപരിശോധനയും ന്യായവിധിസംബന്ധമായ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: νεφροὺς καὶ καρδίας
  choice: ഹൃദയങ്ങളും അന്തരംഗങ്ങളും
  rationale: മൂലത്തിൽ ക്രമം ‘വൃക്കകളും ഹൃദയങ്ങളും’ എന്നാണ്. ‘അന്തരംഗം’ മറഞ്ഞ പ്രേരണകളും ചിന്തകളും ആഗ്രഹങ്ങളും ഉൾപ്പെടുന്ന ഉള്ളിലെ മനുഷ്യനെ വ്യക്തമാക്കുന്നു; ‘ഹൃദയം’ എന്ന ബൈബിൾപ്രയോഗവും നിലനിർത്തുന്നു. സ്വാഭാവിക മലയാളത്തിനായി പദക്രമം മാറ്റിയിരിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ പറയുന്നു.
- source_word: δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν
  choice: നിങ്ങളിൽ ഓരോരുത്തർക്കും അവരവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച് ഞാൻ നൽകും
  rationale: ‘നൽകും’ എന്ന മൂലക്രിയയും ഓരോ വ്യക്തിയോടുമുള്ള വിതരണാർഥവും പ്രവൃത്തികളെ അടിസ്ഥാനമാക്കിയുള്ള പ്രതിഫലവിധിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സംസാരിക്കുന്നവന്റെ അന്തരംഗപരിശോധനയും ന്യായവിധി അധികാരവും
  choice: ‘ഹൃദയങ്ങളും അന്തരംഗങ്ങളും പരിശോധിക്കുന്നവൻ ഞാനാണ്’ എന്ന ശക്തമായ ഒന്നാംപുരുഷ സ്വയംതിരിച്ചറിയൽ നിലനിർത്തി.
  alternative: പൊതുവായ അറിവോ നിരീക്ഷണമോ മാത്രമായി മൃദൂകരിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ഉള്ളിലെ മനുഷ്യനെ പരിശോധിക്കുന്ന ന്യായാധിപന്റെ പ്രത്യേക അധികാരം പ്രസ്താവിക്കുന്നു; അതിന്റെ ദൈവിക ഗൗരവം കുറയ്ക്കരുത്.
- issue: ‘അവളുടെ മക്കൾ’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘മക്കൾ’ എന്നു നൽകി ജൈവമക്കളോ അനുയായികളോ എന്ന സാധ്യത തുറന്നുവെച്ചു.
  alternative: ‘അവളുടെ അനുയായികൾ’ എന്നോ ‘അവളുടെ ജൈവമക്കൾ’ എന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: സന്ദർഭം അനുയായികളെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും τέκνα തന്നിൽ നിന്ന് ഒരു അർഥം മാത്രം നിർബന്ധമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മരണംകൊണ്ട് കൊല്ലും’ എന്ന അസാധാരണ പ്രയോഗം മൂലപാഠത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ കഠിനത സംരക്ഷിക്കാൻ നിലനിർത്തി. ‘അവരവരുടെ’ എന്ന പ്രയോഗം ἑκάστῳ എന്ന വിതരണാർഥം വ്യക്തമാക്കുന്നു.
