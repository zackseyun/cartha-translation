  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്. ‘മരണംകൊണ്ട് കൊല്ലും’ സാധാരണ സംഭാഷണപ്രയോഗമല്ലെങ്കിലും മൂലപാഠത്തിന്റെ ന്യായവിധിഭാഷയും ആവർത്തനത്തിന്റെ തീവ്രതയും സംരക്ഷിക്കാൻ ഇവിടെ ഉചിതമാണ്. ‘ഹൃദയങ്ങളും അന്തരംഗങ്ങളും’ സ്വാഭാവികവും ഗ്രാഹ്യവുമാണ്.
