id: REV.2.19
reference: Revelation 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: ml
  text: നിന്റെ പ്രവൃത്തികളും സ്നേഹവും വിശ്വാസവും[a] സേവനവും സഹിഷ്ണുതയും, നിന്റെ പിന്നീടുള്ള പ്രവൃത്തികൾ ആദ്യകാലത്തെ പ്രവൃത്തികളേക്കാൾ അധികമാണെന്നതും എനിക്ക് അറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശ്വസ്തത.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് വിശ്വാസം എന്നോ വിശ്വസ്തത എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: എനിക്ക് അറിയാം
  rationale: οἶδα വർത്തമാനകാല സ്ഥിതിബോധം സൂചിപ്പിക്കുന്നു; വെളിപ്പാടിലെ സഭകളോടുള്ള ആവർത്തിത സൂത്രവാക്യത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: വ്യക്തമായ പ്രവർത്തനങ്ങളെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്നു; വാക്യത്തിലെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ക്രൈസ്തവ സദ്ഗുണമായ സജീവസ്നേഹത്തെ സ്വാഭാവികവും മാന്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ സാധാരണ അർഥമായ വിശ്വാസം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ സാധ്യമായ ‘വിശ്വസ്തത’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: διακονίαν
  choice: സേവനം
  rationale: ഔദ്യോഗിക പദവിയുടെ ധ്വനി ചേർക്കാതെ പ്രായോഗിക ശുശ്രൂഷയെ സൂചിപ്പിക്കുന്ന പൊതുവായ ആധുനിക പദം.
- source_word: ὑπομονήν
  choice: സഹിഷ്ണുത
  rationale: സമ്മർദത്തിൻ കീഴിലും ഉറച്ചുനിൽക്കുന്ന ക്ഷമാപൂർവമായ സഹനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: നിന്റെ ഒടുവിലത്തെ പ്രവൃത്തികൾ
  rationale: ἔσχατα ഇവിടെ ആദ്യകാല പ്രവൃത്തികളോടു താരതമ്യപ്പെടുത്തിയ ശേഷകാല പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു.
- source_word: πλείονα τῶν πρώτων
  choice: ആദ്യത്തേതിനെക്കാൾ അധികമാണ്
  rationale: πλείονα എന്ന താരതമ്യരൂപത്തിന്റെ ‘എണ്ണത്തിലോ വ്യാപ്തിയിലോ കൂടുതൽ’ എന്ന തുറന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: സദ്ഗുണങ്ങളുടെ പട്ടികയിലെ πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: ഇവിടെ ദൈവത്തിലുള്ള വിശ്വാസമോ പ്രവർത്തനത്തിൽ പ്രകടമാകുന്ന വിശ്വസ്തതയോ ഉദ്ദേശിക്കാം. മുഖ്യപാഠത്തിൽ സാധാരണ അർഥം സ്വീകരിച്ച് മറ്റൊരു യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ പട്ടികയും ‘പ്രവൃത്തികൾ’ എന്ന ആവർത്തനവും നിലനിർത്തി; πίστις എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
