id: REV.21.6
reference: Revelation 21:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: ml
  text: 'അവൻ എന്നോടു പറഞ്ഞു: “ഇവ സംഭവിച്ചുകഴിഞ്ഞു.[a] ഞാൻ ആൽഫയും ഓമേഗയും, ആരംഭവും അവസാനവും ആകുന്നു. ദാഹിക്കുന്നവന് ജീവജലത്തിന്റെ ഉറവിൽനിന്ന് ഞാൻ സൗജന്യമായി[b] നൽകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: “എല്ലാം പൂർത്തിയായി.” ഗ്രീക്ക് ക്രിയ ബഹുവചനത്തിലാണ്; അക്ഷരാർഥത്തിൽ, “അവ സംഭവിച്ചുകഴിഞ്ഞു” അല്ലെങ്കിൽ “ഇവ സംഭവിച്ചുകഴിഞ്ഞു.”'
    reason: alternative_reading
  - marker: b
    text: അഥവാ “വില വാങ്ങാതെ” അല്ലെങ്കിൽ “ദാനമായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γέγοναν
  choice: ഇവ സംഭവിച്ചുകഴിഞ്ഞു
  rationale: γίνομαι എന്ന ക്രിയയുടെ പൂർണകാല ബഹുവചനരൂപമാണിത്. പരാമർശിക്കപ്പെടുന്ന യാഥാർഥ്യങ്ങൾ സംഭവിച്ചുകഴിഞ്ഞുവെന്ന അർഥവും ബഹുവചനവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: ആൽഫയും ഓമേഗയും
  rationale: വെളിപ്പാടിലെ സ്ഥാപിത പ്രതീകാത്മക ദൈവിക ശീർഷകമായി ഗ്രീക്ക് അക്ഷരനാമങ്ങൾ നിലനിർത്തുന്നു; പിന്നാലെയുള്ള ‘ആരംഭവും അവസാനവും’ അതിന്റെ ആശയബലം വ്യക്തമാക്കുന്നു.
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: ആരംഭവും അവസാനവും
  rationale: കാലപരവും ലക്ഷ്യപരവുമായ അനുരണനങ്ങൾ അമിതമായി വ്യാഖ്യാനിക്കാതെ സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: τῷ διψῶντι
  choice: ദാഹിക്കുന്നവന്
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ ഏകവചനവും വ്യക്തിപരമായ അഭിസംബോധനയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: δώσω
  choice: ഞാൻ നൽകും
  rationale: ലളിതമായ ഭാവികാല വാഗ്ദാനം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐκ τῆς πηγῆς
  choice: ഉറവിൽനിന്ന്
  rationale: πηγή എന്നത് വെള്ളം പുറപ്പെടുന്ന ഉറവിനെ സൂചിപ്പിക്കുന്നു; ദൃശ്യബിംബത്തിന് യോജിച്ച വ്യക്തമായ ആധുനിക മലയാളം.
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: ജീവജലത്തിന്റെ
  rationale: ‘ജീവന്റെ ജലം’ എന്ന സ്ഥാപിത ബൈബിൾ ദൃശ്യബിംബം മലയാളത്തിൽ സ്വാഭാവികമായ സമാസരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: δωρεάν
  choice: സൗജന്യമായി
  rationale: വിലയോ പ്രതിഫലമോ കൂടാതെ ദാനമായി നൽകുന്നു എന്ന ക്രിയാവിശേഷണാർഥം വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: Γέγοναν എന്ന ദൈവിക പ്രഖ്യാപനത്തിലെ ബഹുവചനം
  choice: ഇവ സംഭവിച്ചുകഴിഞ്ഞു
  alternative: എല്ലാം പൂർത്തിയായി
  rationale: പുതിയ സൃഷ്ടിയെക്കുറിച്ചുള്ള പ്രഖ്യാപിത യാഥാർഥ്യങ്ങൾ സംഭവിച്ചുവെന്ന അർഥം നൽകുന്നതിനൊപ്പം ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു; പരമ്പരാഗത ഏകവചന സൂത്രവാക്യത്തിലേക്ക് അതിനെ ചുരുക്കുന്നില്ല.
- issue: ആൽഫ/ഓമേഗ പ്രതീകത്തിന്റെ സംരക്ഷണം
  choice: ആൽഫയും ഓമേഗയും
  alternative: ആദ്യക്ഷരവും അവസാനക്ഷരവും
  rationale: വെളിപ്പാടിലെ ദൈവിക സ്വയംപ്രഖ്യാപനത്തിന്റെ പ്രതീകാത്മകവും അന്തർപാഠപരവുമായ ശക്തി നിലനിർത്തുന്നു; അതിന്റെ ആശയം പിന്നാലെയുള്ള സമാന്തരവാക്യം വിശദീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ബഹുവചനവും പൂർണതയുടെ ഭാവവും സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പുസൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
