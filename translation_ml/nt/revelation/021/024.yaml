  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: ml
  text: ജനതകൾ അതിന്റെ വെളിച്ചത്താൽ[a] നടക്കും; ഭൂമിയിലെ രാജാക്കന്മാർ തങ്ങളുടെ മഹത്വം[b] അതിലേക്കു[c] കൊണ്ടുവരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിന്റെ വെളിച്ചത്തിലൂടെ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തങ്ങളുടെ പ്രതാപം’ അല്ലെങ്കിൽ ‘തങ്ങളുടെ ബഹുമതി.’
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘അവളിലേക്കു’; ‘നഗരം’ എന്ന പദം ഗ്രീക്കിൽ സ്ത്രീലിംഗമായതിനാൽ ഈ സർവനാമം നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: നടക്കും
  rationale: ക്രിയയുടെ മൂർത്തമായ ‘നടക്കുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; ഇവിടെ വെളിച്ചത്തിൽ സഞ്ചരിക്കുന്ന ജനതകളുടെ ദർശനചിത്രത്തിന് ഇത് സ്വാഭാവികമാണ്.
- source_word: τὰ ἔθνη
  choice: ജനതകൾ
  rationale: രാഷ്ട്ര-വംശീയ സമൂഹങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ἔθνη എന്ന പദത്തിനും പഴയനിയമ പ്രവാചക പശ്ചാത്തലത്തിനും യോജിക്കുന്നു; ‘വിജാതീയർ’ എന്ന പരിമിത അർത്ഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: അതിന്റെ വെളിച്ചത്താൽ
  rationale: ജനതകൾ നടക്കുന്നതിനുള്ള മാർഗമോ ഉപാധിയോ നഗരത്തിന്റെ വെളിച്ചമാണെന്ന διά + genitive പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വെളിച്ചത്തിലൂടെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: ഭൂമിയിലെ രാജാക്കന്മാർ
  rationale: വെളിപ്പാടിലെ പതിവായ അന്ത്യകാലദർശന പ്രയോഗത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φέρουσιν
  choice: കൊണ്ടുവരും
  rationale: ഗ്രീക്കിലെ വർത്തമാനരൂപം ഭാവിദർശനത്തിന്റെ സജീവ വിവരണത്തിലാണ് വരുന്നത്; മുൻക്രിയയുടെ ഭാവികാലത്തോടു ചേർന്ന് മലയാളത്തിൽ ‘കൊണ്ടുവരും’ സ്വാഭാവികമാണ്.
- source_word: τὴν δόξαν αὐτῶν
  choice: തങ്ങളുടെ മഹത്ത്വം
  rationale: δόξα സൂചിപ്പിക്കുന്ന മഹിമ, ബഹുമാനം, പ്രഭാവം എന്നീ അർത്ഥവ്യാപ്തിയും തിരുവെഴുത്തിലെ പ്രതിധ്വനിയും ‘മഹത്ത്വം’ നിലനിർത്തുന്നു; ‘പ്രതാപം’ ഒരു സാധുവായ പകരമാണ്.
- source_word: εἰς αὐτήν
  choice: അതിലേക്കു
  rationale: സ്ത്രീലിംഗ സർവനാമം സ്ത്രീലിംഗമായ πόλις എന്ന ‘നഗരം’ എന്ന പദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ നഗരത്തെ നിർബന്ധമായി സ്ത്രീരൂപത്തിൽ വ്യക്തിവൽക്കരിക്കാതെ ലക്ഷ്യദിശയുള്ള εἰς എന്നതിനെ ‘അതിലേക്കു’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: പുതിയ യെരൂശലേമിനെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ സർവനാമത്തിന്റെ വ്യക്തിവൽക്കരണം
  choice: നഗരത്തെ സൂചിപ്പിച്ച് ‘അതിന്റെ/അതിലേക്കു’ എന്ന് പരിഭാഷപ്പെടുത്തുക.
  alternative: വധു-രൂപകത്തെ ഊന്നി ‘അവളുടെ/അവളിലേക്കു’ എന്ന് നൽകുക.
  rationale: ഈ അധ്യായത്തിൽ നഗരം വധുവായി വ്യക്തിവൽക്കരിക്കപ്പെടുന്നുണ്ടെങ്കിലും ഈ വാക്യത്തിലെ ഉടനെയുള്ള ചിത്രം നഗരപരവും സ്ഥലസംബന്ധിയുമാണ്. അതിനാൽ അതിരുകടന്ന വ്യക്തിവൽക്കരണം വരുത്താതെ നഗരമാണ് സൂചിതമെന്നത് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ ദർശനചിത്രവും ഭാവികാല ദിശയും നിലനിർത്തിയിരിക്കുന്നു; വാക്യത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
