id: REV.21.9
reference: Revelation 21:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: ml
  text: 'അപ്പോൾ, അവസാനത്തെ ഏഴ് ബാധകൾ നിറഞ്ഞ ഏഴ് പാത്രങ്ങൾ കൈവശമുണ്ടായിരുന്ന ഏഴ് ദൂതന്മാരിൽ ഒരാൾ വന്ന് എന്നോടു സംസാരിച്ചു[a]: “വരിക, മണവാട്ടിയെ, കുഞ്ഞാടിന്റെ ഭാര്യയെ, ഞാൻ നിനക്കു കാണിച്ചുതരാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “എന്നോടുകൂടെ സംസാരിച്ചു.”
    reason: ഗ്രീക്കിലെ μετά + ഷഷ്ഠീവിഭക്തി ‘കൂടെ’ എന്ന ആശയം പ്രകടമാക്കുന്നു; മുഖ്യപാഠത്തിലെ “എന്നോടു സംസാരിച്ചു” സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
lexical_decisions:
- source_word: Καὶ
  choice: അപ്പോൾ
  rationale: കഥനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: ഏഴ് ദൂതന്മാരിൽ ഒരാൾ
  rationale: ἐκ സഹിതമുള്ള ഭാഗസൂചക പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: τὰς ἑπτὰ φιάλας
  choice: ഏഴ് പാത്രങ്ങൾ
  rationale: φιάλη സൂചിപ്പിക്കുന്ന വീതിയുള്ള പാത്രത്തെ പൊതുവായും വ്യക്തമായും അറിയിക്കുന്നു; ആധുനിക വായനക്കാരനെ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘കുപ്പി’ പോലുള്ള പദം ഒഴിവാക്കുന്നു.
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: അവസാനത്തെ ഏഴ് ബാധകൾ നിറഞ്ഞ
  rationale: γεμόντων എന്നതിന്റെ ‘നിറഞ്ഞിരിക്കുന്ന’ എന്ന അർഥവും ἐσχάτων എന്നതിന്റെ ക്രമപരമായ ‘അവസാനത്തെ’ എന്ന അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: എന്നോടു സംസാരിച്ചു
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ സംഭാഷണപ്രയോഗം; μετάയുടെ ‘കൂടെ/ഒപ്പം’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് മൂലഭാഷയുടെ പ്രത്യേകതയും നിലനിർത്തുന്നു.
- source_word: Δεῦρο
  choice: വരൂ
  rationale: ക്ഷണാത്മകമായ ആജ്ഞയുടെ മാന്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: δείξω σοι
  choice: ഞാൻ നിനക്കു കാണിച്ചുതരാം
  rationale: ഭാവികാല വാഗ്ദാനം നേരിട്ട് നൽകുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: τὴν νύμφην τὴν γυναῖκα τοῦ ἀρνίου
  choice: മണവാട്ടിയെ, കുഞ്ഞാടിന്റെ ഭാര്യയെ
  rationale: νύμφη, γυνή എന്നീ രണ്ടു സമസ്ഥാന നാമങ്ങളും വേർതിരിച്ച് പ്രകടിപ്പിക്കുന്നു; വിവാഹരൂപകം ചുരുക്കുകയോ വിശദീകരിച്ചു തീർക്കുകയോ ചെയ്യുന്നില്ല.
- source_word: τοῦ ἀρνίου
  choice: കുഞ്ഞാടിന്റെ
  rationale: വെളിപ്പാടിലെ ക്രിസ്തുസംബന്ധിയായ ἀρνίον എന്ന സ്ഥാനപ്പേര് അർഥാനുസൃതമായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: νύμφην എന്നതും γυναῖκα എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: “മണവാട്ടിയെ, കുഞ്ഞാടിന്റെ ഭാര്യയെ” എന്ന് രണ്ടു നാമങ്ങളും സമസ്ഥാനമായി നിലനിർത്തുക
  alternative: “കുഞ്ഞാടിന്റെ ഭാര്യയായ മണവാട്ടിയെ”
  rationale: മൂലഗ്രീക്കിലെ രണ്ടു നാമങ്ങളെയും തുറന്നുവെക്കുകയും അവയുടെ വിവാഹരൂപകത്തിലെ ഊന്നൽ ഒന്നാക്കി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ἀρνίον എന്ന ക്രിസ്തുസംബന്ധിയായ സ്ഥാനപ്പേര്
  choice: കുഞ്ഞാട്
  alternative: ആട്ടിൻകുട്ടി
  rationale: വെളിപ്പാടിൽ ആവർത്തിക്കുന്ന സ്ഥാനപ്പേരിന് മലയാളത്തിൽ ഗൗരവമുള്ളതും പരിചിതവുമായ രൂപം നൽകുന്നു; ഈ വാക്യത്തിന് പുറത്തുള്ള ദൈവശാസ്ത്രവിവരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദീർഘമായ തിരിച്ചറിയൽവാക്യം മൂലപാഠത്തിന്റെ ഘടന പിന്തുടരുമ്പോഴും വായനാസൗകര്യം നിലനിർത്തുന്നു. ‘മണവാട്ടി’യും ‘ഭാര്യ’യും രണ്ടും വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു.
