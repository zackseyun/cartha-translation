id: REV.21.13
reference: Revelation 21:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπὸ ⸀ἀνατολῆς πυλῶνες τρεῖς, καὶ ἀπὸ βορρᾶ πυλῶνες τρεῖς, καὶ ἀπὸ νότου πυλῶνες τρεῖς, καὶ ἀπὸ δυσμῶν πυλῶνες τρεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: ml
  text: കിഴക്കുവശത്ത്[a] മൂന്നു കവാടങ്ങൾ, വടക്കുവശത്ത് മൂന്നു കവാടങ്ങൾ, തെക്കുവശത്ത് മൂന്നു കവാടങ്ങൾ, പടിഞ്ഞാറുവശത്ത് മൂന്നു കവാടങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘കിഴക്കുനിന്ന് … വടക്കുനിന്ന് … തെക്കുനിന്ന് … പടിഞ്ഞാറുനിന്ന്’; കവാടങ്ങൾ സ്ഥിതിചെയ്യുന്ന വശം വ്യക്തമാക്കാൻ ഇവിടെ ആശയാനുസൃതമായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς
  choice: കിഴക്കുവശത്ത്
  rationale: ἀπό എന്നതിന്റെ അക്ഷരാർഥം ‘നിന്ന്’ എന്നായിരിക്കാമെങ്കിലും, നഗരത്തിന്റെ ഏതു വശത്താണ് കവാടങ്ങളുള്ളത് എന്ന സ്ഥാനസൂചനയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ‘കിഴക്കുവശത്ത്’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πυλῶνες
  choice: കവാടങ്ങൾ
  rationale: πυλών വലിയ പ്രവേശനകവാടത്തെയോ കവാടസംവിധാനത്തെയോ സൂചിപ്പിക്കാം. പുതിയ യെരൂശലേമിന്റെ മതിലിലെ പ്രവേശനങ്ങളെ വിവരിക്കുന്ന ഇവിടെ ‘കവാടങ്ങൾ’ വ്യക്തവും മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: τρεῖς
  choice: മൂന്നു
  rationale: നാലു വശങ്ങളിലെയും സമമിതിയും അളന്നുപറയുന്ന ശൈലിയും നിലനിർത്താൻ സംഖ്യ ഓരോ തവണയും ആവർത്തിച്ചു.
- source_word: ἀπὸ βορρᾶ / ἀπὸ νότου / ἀπὸ δυσμῶν
  choice: വടക്കുവശത്ത് / തെക്കുവശത്ത് / പടിഞ്ഞാറുവശത്ത്
  rationale: എല്ലാ ദിശാസൂചനകളും ഒരേ സ്ഥാനാർഥത്തിൽ സമാന്തരമായി പരിഭാഷപ്പെടുത്തി; ഇതിലൂടെ മൂലപാഠത്തിന്റെ ഘടനാപരമായ സമമിതി നിലനിൽക്കുന്നു.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: വാക്യഘടനയിലെ സമാന്തര ആവർത്തനം
  rationale: മലയാളത്തിൽ ഓരോ ഘടകത്തിനുമുമ്പും ‘കൂടാതെ/ഉം’ ചേർക്കുന്നത് കൃത്രിമമാകുന്നതിനാൽ, വിരാമചിഹ്നങ്ങളോടുകൂടിയ സമാന്തര ഘടന ഉപയോഗിച്ചു. എങ്കിലും ഗ്രീക്കിലെ ക്രമബദ്ധമായ എണ്ണിപ്പറച്ചിലും ആവർത്തനവും പൂർണമായി നിലനിർത്തി.
theological_decisions:
- issue: പുതിയ യെരൂശലേമിന്റെ കവാടങ്ങളുടെ സ്ഥാനവിവരണം
  choice: നഗരത്തിന്റെ നാലു വശങ്ങളിലും മൂന്നു വീതം കവാടങ്ങളുണ്ടെന്ന നേരിട്ടുള്ള വാസ്തുവിവരണം
  alternative: ഇസ്രായേൽ ഗോത്രങ്ങളുടെ പാളയക്രമത്തോടോ യെഹെസ്കേലിന്റെ ആലയ-നഗരദർശനത്തോടോ ഉള്ള പ്രതീകാത്മക ബന്ധം
  rationale: വാക്യം തന്നിൽ കവാടങ്ങളെ ദിശാനുസൃതമായി എണ്ണിപ്പറയുക മാത്രമാണ് ചെയ്യുന്നത്. വിശാലമായ തിരുവെഴുത്തുപശ്ചാത്തലത്തിൽ പ്രതീകാത്മക ബന്ധങ്ങൾ ഉണ്ടായേക്കാമെങ്കിലും അവ മുഖ്യപരിഭാഷയിൽ ചേർത്തിട്ടില്ല; വ്യാഖ്യാനസാധ്യത തുറന്നുവെച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വശത്ത്’ എന്ന ആവർത്തനം നാലു ദിശകളിലെ ക്രമവും സമമിതിയും വ്യക്തമാക്കുന്നു; ‘കവാടങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും ദർശനത്തിന്റെ മഹത്വത്തിന് യോജിച്ചതുമാണ്.
