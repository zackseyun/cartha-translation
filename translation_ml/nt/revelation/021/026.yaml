id: REV.21.26
reference: Revelation 21:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἴσουσιν τὴν δόξαν καὶ τὴν τιμὴν τῶν ἐθνῶν εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/026.yaml
  text: and they will bring the glory and the honor of the nations into it[a].
translation:
  language: ml
  text: ജനതകളുടെ മഹത്ത്വവും ബഹുമാനവും അവർ അതിലേക്കു കൊണ്ടുവരും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവളിലേക്കു’; ഗ്രീക്കിൽ നഗരം സ്ത്രീലിംഗത്തിൽ വ്യക്തീകരിക്കപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴσουσιν
  choice: കൊണ്ടുവരും
  rationale: φέρω എന്ന ക്രിയയുടെ ഭാവികാല സജീവരൂപം. നഗരത്തിന് പുറത്തുനിന്ന് അതിനകത്തേക്കുള്ള നീക്കത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δόξαν
  choice: മഹത്ത്വം
  rationale: δόξα എന്നതിന്റെ ബഹുമാനപരവും തേജസ്സാർന്നതുമായ വിശാല അർഥം നിലനിർത്തുന്നു; ‘പ്രതാപം’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: τιμὴν
  choice: ബഹുമാനം
  rationale: δόξαν എന്നതിനോടു ചേർന്നുനിൽക്കുന്ന ആദരവ്/മാനം എന്ന അർഥം നൽകുന്നു; ‘സമ്പത്ത്’ എന്ന വ്യുത്പന്ന അർഥത്തിലേക്കു വാചകത്തെ ചുരുക്കുന്നില്ല.
- source_word: τῶν ἐθνῶν
  choice: ജനതകളുടെ
  rationale: വിവിധ ജനസമൂഹങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘വിജാതീയർ’ എന്ന പരിഭാഷ പ്രസക്തമല്ലാത്ത യഹൂദ-വിജാതീയ വേർതിരിവ് മുൻനിരയിലാക്കാം.
- source_word: εἰς αὐτήν
  choice: അതിലേക്കു
  rationale: സർവനാമത്തിന്റെ സൂചന പുതിയ യെരൂശലേം എന്ന നഗരത്തിലേക്കാണ്. മലയാളത്തിൽ നഗരത്തെ സാധാരണയായി ‘അത്’ എന്നു പരാമർശിക്കുന്നത് സ്വാഭാവികമാണ്; ഗ്രീക്കിലെ സ്ത്രീലിംഗ നഗരവ്യക്തീകരണം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: καὶ
  choice: -വും … -വും
  rationale: δόξαν, τιμὴν എന്നീ രണ്ടു പദങ്ങളെയും മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയഘടനയിൽ ബന്ധിപ്പിക്കുന്നു; വാക്യത്തിന്റെ മുൻസന്ദർഭബന്ധം വാക്യക്രമത്തിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: αὐτήν എന്ന സർവനാമത്തിന്റെ സൂചനയും നഗരത്തിന്റെ വ്യക്തീകരണവും
  choice: പുതിയ യെരൂശലേം എന്ന നഗരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിലേക്കു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവളിലേക്കു,’ ഗ്രീക്കിലെ സ്ത്രീലിംഗവും മണവാട്ടിയായുള്ള നഗരവ്യക്തീകരണവും നേരിട്ട് നിലനിർത്തുന്നത്.
  rationale: πόλις വ്യാകരണപരമായി സ്ത്രീലിംഗമാണ്; ചുറ്റുപാടിൽ നഗരം മണവാട്ടിയായി വ്യക്തീകരിക്കപ്പെടുകയും ചെയ്യുന്നു. എങ്കിലും ആധുനിക മലയാളത്തിൽ നഗരത്തെ ഈ വാക്യത്തിൽ ‘അത്’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം. അർഥവത്തായ സ്ത്രീലിംഗ സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ജനതകളുടെ ‘മഹത്ത്വവും ബഹുമാനവും’ എന്നതിന്റെ അർഥം
  choice: ഭൗതിക സമ്പത്ത്, സാംസ്കാരിക ശ്രേഷ്ഠത, ജനതകൾ അർപ്പിക്കുന്ന ആദരം എന്നിവയിൽ ഒന്നായി ചുരുക്കാതെ വിശാലമായ പദപ്രയോഗം നിലനിർത്തി.
  alternative: ജനതകളുടെ സമ്പത്ത്; അവരുടെ സാംസ്കാരിക പ്രതാപം; അവർ അർപ്പിക്കുന്ന ആദരം.
  rationale: ഗ്രീക്ക് പ്രയോഗം അർഥവ്യാപ്തിയുള്ളതാണ്; സന്ദർഭം ഒരു വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക അന്ത്യകാല സിദ്ധാന്തം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘മഹത്ത്വം’, ‘ബഹുമാനം’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ വിശാലത നിലനിർത്തുന്നു; ‘കൊണ്ടുവരും’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ചലനാർഥം നൽകുന്നു.
