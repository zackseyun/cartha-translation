id: REV.21.23
reference: Revelation 21:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: ml
  text: ആ നഗരത്തിന് അതിന്മേൽ പ്രകാശിക്കാൻ സൂര്യന്റെയോ ചന്ദ്രന്റെയോ ആവശ്യമില്ല[a]; എന്തെന്നാൽ, ദൈവത്തിന്റെ മഹത്ത്വം അതിനെ പ്രകാശിപ്പിച്ചു, അതിന്റെ വിളക്ക് കുഞ്ഞാടാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അതിന് വെളിച്ചം നൽകാൻ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, ‘അതിനു/അതിന്മേൽ പ്രകാശിക്കാൻ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλις
  choice: നഗരം
  rationale: പുതിയ യെരൂശലേമിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പദം.
- source_word: οὐ χρείαν ἔχει
  choice: ആവശ്യമില്ല
  rationale: ‘ആവശ്യം ഇല്ല/ആവശ്യമില്ല’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: സൂര്യന്റെയോ ചന്ദ്രന്റെയോ
  rationale: നിഷേധവാക്യത്തിലെ രണ്ട് ആകാശഗോളങ്ങളെയും ‘-ഓ ... -ഓ’ എന്ന സ്വാഭാവിക മലയാള സമാന്തരഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: അതിന്മേൽ പ്രകാശിക്കാൻ
  rationale: ആകാശഗോളങ്ങൾ കർത്താവായതിനാൽ φαίνω എന്നതിന്റെ ‘പ്രകാശിക്കുക’ എന്ന അർഥവും αὐτῇ എന്ന ദത്തിവിന്റെ ‘അതിന്മേൽ’ എന്ന ബന്ധവും സംരക്ഷിക്കുന്നു; ‘വെളിച്ചം നൽകാൻ’ എന്ന വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: δόξα
  choice: മഹത്ത്വം
  rationale: ദൈവിക δόξαയെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നതുമായ പദം.
- source_word: ἐφώτισεν
  choice: പ്രകാശിപ്പിച്ചു
  rationale: പ്രകാശം പകർന്നുവെന്ന മൂർത്തമായ അർഥം വ്യക്തമായി നൽകുന്നു; മുമ്പുള്ള ‘പ്രകാശിക്കാൻ’ എന്നതോടുള്ള ആവർത്തനം ഗ്രീക്കിലെ ബന്ധിതമായ പ്രകാശപ്രതീകം നിലനിർത്തുന്നു.
- source_word: λύχνος
  choice: വിളക്ക്
  rationale: പൊതുവായ ‘വെളിച്ചം’ എന്നതല്ല, വെളിച്ചം നൽകുന്ന വിളക്കിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘വിളക്കുതണ്ട്’ എന്നും അർഥമില്ല.
- source_word: ἀρνίον
  choice: കുഞ്ഞാട്
  rationale: വെളിപ്പാടുപുസ്തകത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ ക്രിസ്തുശാസ്ത്രപരമായ വിശേഷണം; മലയാളത്തിൽ ആദരസൂചകമായ തലക്കെട്ടായി സ്വാഭാവികം.
theological_decisions:
- issue: ‘അതിന്റെ വിളക്ക് കുഞ്ഞാടാകുന്നു’ എന്ന രൂപകബന്ധം
  choice: കുഞ്ഞാട് അതിന്റെ വിളക്കാകുന്നു
  alternative: കുഞ്ഞാട് അതിന്റെ വെളിച്ചമാകുന്നു
  rationale: ഗ്രീക്ക് പൊതുവായ ‘വെളിച്ചം’ എന്ന പദമല്ല, λύχνος (‘വിളക്ക്’) എന്നാണ് പറയുന്നത്. ദൈവത്തിന്റെ മഹത്ത്വം പ്രകാശിപ്പിക്കുന്നതും കുഞ്ഞാട് നഗരത്തിന്റെ വിളക്കായിരിക്കുന്നതും തമ്മിലുള്ള പ്രതീകവ്യത്യാസം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- issue: ദൈവിക പ്രകാശത്തിന്റെ ദൃശ്യപ്രതീകം
  choice: വാക്യം പറയുന്നതുപോലെ മാത്രം വിവർത്തനം ചെയ്യുക
  alternative: ദൈവം സൃഷ്ടിക്കപ്പെട്ട എല്ലാ പ്രകാശസ്രോതസ്സുകളെയും പൂർണമായി പകരംവയ്ക്കുന്നു എന്ന വിശദീകരണം ചേർക്കുക
  rationale: നഗരത്തിന് സൂര്യനെയോ ചന്ദ്രനെയോ ആവശ്യമില്ലെന്നും ദൈവത്തിന്റെ മഹത്ത്വം അതിനെ പ്രകാശിപ്പിക്കുന്നുവെന്നും മാത്രമാണ് വാക്യം വ്യക്തമാക്കുന്നത്; അതിനപ്പുറമുള്ള അന്ത്യകാലവ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മഹത്ത്വം,’ ‘കുഞ്ഞാട്,’ ‘വിളക്ക്’ എന്നീ പ്രധാന പ്രതീകപദങ്ങൾ സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
