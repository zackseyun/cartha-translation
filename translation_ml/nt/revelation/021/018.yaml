source:
  edition: SBLGNT
  text: ⸀καὶ ἡ ἐνδώμησις τοῦ τείχους αὐτῆς ἴασπις, καὶ ἡ πόλις χρυσίον καθαρὸν ὅμοιον ὑάλῳ καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/018.yaml
  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: ml
  text: അതിന്റെ മതിലിന്റെ നിർമാണസാമഗ്രി ജാസ്പർ ആയിരുന്നു[a]; നഗരം ശുദ്ധമായ ഗ്ലാസ് പോലെയുള്ള ശുദ്ധസ്വർണമായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിന്റെ മതിലിന്റെ നിർമാണം ജാസ്പർ ആയിരുന്നു.’ ഗ്രീക്ക് പദം നിർമാണപ്രവൃത്തിയെയോ നിർമിച്ച വസ്തുവിന്റെ സാമഗ്രിയെയോ ഘടനയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തെളിഞ്ഞ ഗ്ലാസ് പോലെയുള്ള ശുദ്ധസ്വർണം.’ ഗ്രീക്കിൽ ‘ശുദ്ധമായ ഗ്ലാസ്’ എന്നാണ്; ഈ ഉപമ നഗരത്തിന്റെ തിളക്കവും സുതാര്യതപോലുള്ള തെളിമയും ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδώμησις
  choice: നിർമാണസാമഗ്രി
  rationale: ഈ നാമം നിർമാണത്തെയോ നിർമിതിയുടെ സാമഗ്രി/ഘടനയെയോ സൂചിപ്പിക്കാം. ἴασπις എന്ന വിധേയപദവും തുടർന്നുള്ള നഗരത്തിന്റെ പദാർഥവിവരണവും പരിഗണിച്ച്, ഇവിടെ സാമഗ്രിക്കാണ് മുൻതൂക്കം നൽകിയത്; പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τεῖχος
  choice: മതിൽ
  rationale: ഇവിടെ നഗരമതിലാണ് ഉദ്ദേശിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പദം ‘മതിൽ’ ആണ്.
- source_word: ἴασπις
  choice: സൂര്യകാന്തക്കല്ല്
  rationale: ജാസ്പർ വർഗത്തിലുള്ള രത്നക്കല്ലിന് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ പേരാണിത്. പുരാതന ἴασπις ആധുനിക ജാസ്പറുമായി കൃത്യമായി ഒത്തിരിക്കണമെന്നില്ലെങ്കിലും രത്നനാമം സംരക്ഷിക്കുന്നു.
- source_word: χρυσίον καθαρόν
  choice: ശുദ്ധസ്വർണം
  rationale: χρυσίον പദാർഥമായ സ്വർണത്തെയും καθαρόν അതിന്റെ ശുദ്ധിയെയും സൂചിപ്പിക്കുന്നു; ‘ശുദ്ധസ്വർണം’ സ്വാഭാവികവും അർഥസൂക്ഷ്മവുമായ മലയാളമാണ്.
- source_word: ὅμοιον
  choice: പോലെയുള്ള
  rationale: സാദൃശ്യം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് വിശേഷണത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ὑάλῳ καθαρῷ
  choice: തെളിഞ്ഞ സ്ഫടികം
  rationale: ὕαλος ഗ്ലാസിനെയോ ഗ്ലാസുപോലുള്ള സുതാര്യവസ്തുവിനെയോ സൂചിപ്പിക്കാം; καθαρός ഇവിടെ ദൃശ്യമായ തെളിമ/സുതാര്യതയും ഉണർത്തുന്നു. ‘തെളിഞ്ഞ സ്ഫടികം’ ദൃശ്യപ്രഭാവം സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
