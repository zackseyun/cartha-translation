revisions:
- from: അതിന്റെ മതിലിന്റെ നിർമാണസാമഗ്രി സൂര്യകാന്തക്കല്ലായിരുന്നു[a]; നഗരം തെളിഞ്ഞ സ്ഫടികംപോലെയുള്ള ശുദ്ധസ്വർണമായിരുന്നു[b].
  to: അതിന്റെ മതിലിന്റെ നിർമാണസാമഗ്രി ജാസ്പർ ആയിരുന്നു[a]; നഗരം ശുദ്ധമായ ഗ്ലാസ് പോലെയുള്ള ശുദ്ധസ്വർണമായിരുന്നു[b].
  rationale: The revision replaces ‘സ്ഫടികം’ with ‘ഗ്ലാസ്’ to render ὕαλος faithfully, while preserving the source’s repeated purity language. It also uses the conventional transliteration ‘ജാസ്പർ’ for ἴασπις, avoiding an unjustifiably exact modern mineral identification. Both footnotes are aligned with the corrected text and retain the lexical alternatives.
