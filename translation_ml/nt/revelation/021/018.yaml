translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തര വിവരണം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി അർധവിരാമം ഉപയോഗിച്ചു; യഥാർഥമായ പദാർഥ/നിർമാണ ദ്വയാർഥവും καθαρός എന്നതിലെ ശുദ്ധി/തെളിമ സൂചനയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
