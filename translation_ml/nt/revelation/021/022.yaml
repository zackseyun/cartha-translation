    rationale: ναός പല സന്ദർഭങ്ങളിലും വിശുദ്ധമന്ദിരം/ക്ഷേത്രം, പ്രത്യേകിച്ച് അതിന്റെ വിശുദ്ധഭാഗം, സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ അതിനെ ഉള്ളിലെ ഒരു സ്ഥാനമായി മാത്രം നിർവചിക്കുന്നത് അനാവശ്യമായി ഇടുങ്ങിയതാണ്.
