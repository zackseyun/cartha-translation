  to: അതിൽ ഒരു ആലയവും[a] ഞാൻ കണ്ടില്ല; കാരണം സർവശക്തനായ കർത്താവായ ദൈവവും കുഞ്ഞാടും[b] തന്നെയാണ് അതിന്റെ ആലയം.
  rationale: മുഖ്യവാചകത്തിന്റെ സ്വാഭാവികവും വിശ്വസ്തവുമായ കൂട്ടായ വായന നിലനിർത്തി. ഗ്രീക്കിലെ ഏകവചനക്രിയയും ക്രിയാനന്തര καὶ τὸ ἀρνίον-വും സൃഷ്ടിക്കുന്ന ഘടനാപരമായ സവിശേഷത അടിക്കുറിപ്പിൽ കൃത്യമായി രേഖപ്പെടുത്തി; അതിനെ ഏതെങ്കിലും പിന്നീട് രൂപപ്പെട്ട ദൈവശാസ്ത്രപരമായ വിശദീകരണത്തിലേക്ക് നിർബന്ധിച്ചിട്ടില്ല. ναός സംബന്ധിച്ച അടിക്കുറിപ്പും കൂടുതൽ കൃത്യമാക്കി.
