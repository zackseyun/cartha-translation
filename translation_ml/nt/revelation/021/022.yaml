id: REV.21.22
reference: Revelation 21:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: ml
  text: അതിൽ ഒരു ആലയവും[a] ഞാൻ കണ്ടില്ല; കാരണം സർവശക്തനായ കർത്താവായ ദൈവവും കുഞ്ഞാടും[b] തന്നെയാണ് അതിന്റെ ആലയം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധമന്ദിരം.’ ഗ്രീക്ക് ναός സാധാരണയായി ആലയത്തെയോ വിശുദ്ധമന്ദിരത്തെയോ സൂചിപ്പിക്കുന്നു; ചില സന്ദർഭങ്ങളിൽ അതിന്റെ വിശുദ്ധഭാഗത്തെ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ആണ്’ എന്ന ക്രിയ ഏകവചനത്തിലാണ്; ‘കുഞ്ഞാട്’ എന്നത് അതിനുശേഷം καί (‘കൂടാതെ/ഒപ്പം’) എന്ന പദത്തോടെ ചേർക്കപ്പെടുന്നു. എങ്കിലും കർത്താവായ ദൈവവും കുഞ്ഞാടും നഗരത്തിന്റെ ആലയമാണെന്ന അർഥമാണ് സ്വാഭാവികമായി ലഭിക്കുന്നത്.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: ആലയം
  rationale: ναός സാധാരണയായി ആലയത്തെ, കൂടുതൽ കൃത്യമായി അതിന്റെ ഉള്ളിലെ വിശുദ്ധമന്ദിരത്തെ, സൂചിപ്പിക്കുന്നു. ‘ആലയം’ ഇവിടെ ഭൗതിക ആലയത്തിന്റെ അഭാവവും ദൈവവും കുഞ്ഞാടും നഗരത്തിന്റെ ആലയമായിരിക്കുന്നതും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὐκ εἶδον
  choice: ഒരു ... വും ഞാൻ കണ്ടില്ല
  rationale: നിഷേധത്തോടുകൂടിയ ക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും അവിടെ ആലയം പൂർണമായി ഇല്ലെന്ന ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν αὐτῇ / αὐτῆς
  choice: അതിൽ / അതിന്റെ
  rationale: സർവനാമങ്ങൾ മുൻസന്ദർഭത്തിലെ നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ നഗരത്തെ നിർജീവ ഏകവചനമായി പരാമർശിക്കുന്ന ‘അത്’ സ്വാഭാവികമാണ്.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: സർവശക്തനായ കർത്താവായ ദൈവം
  rationale: ദൈവിക സ്ഥാനപ്പേരുകളുടെ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; παντοκράτωρ എന്നതിന് സ്ഥാപിതവും അർഥസമ്പന്നവുമായ ‘സർവശക്തൻ’ ഉപയോഗിക്കുന്നു.
- source_word: τὸ ἀρνίον
  choice: കുഞ്ഞാട്
  rationale: വെളിപ്പാടുപുസ്തകത്തിൽ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന ἀρνίον എന്ന പ്രതീകാത്മക നാമത്തിന്റെ പതിവും വ്യക്തവുമായ മലയാളരൂപമാണിത്.
theological_decisions:
- issue: ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον എന്നതിലെ കർത്തൃ-വിധേയ ബന്ധം
  choice: കർത്താവായ ദൈവവും കുഞ്ഞാടും ചേർന്ന് നഗരത്തിന്റെ ഏക ആലയമാണെന്ന് മുഖ്യവാചകത്തിൽ അവതരിപ്പിച്ചു.
  alternative: ‘കർത്താവായ ദൈവമാണ് അതിന്റെ ആലയം—കുഞ്ഞാടും’ എന്ന ഗ്രീക്ക് വാക്യക്രമത്തോട് കൂടുതൽ അടുത്ത രൂപം.
  rationale: καὶ τὸ ἀρνίον കുഞ്ഞാടിനെ ദൈവത്തോടൊപ്പം ചേർക്കുന്നു; അതേസമയം ἐστιν ഏകവചനമായി ആദ്യം ദൈവത്തോടു ചേരുന്ന ഗ്രീക്ക് ഘടനയ്ക്ക് ഒരു പ്രത്യേക ഊന്നലുണ്ട്. സ്വാഭാവിക മലയാളത്തിൽ ഇരുവരെയും ചേർത്തുപറഞ്ഞെങ്കിലും, മൂലഘടനയിലെ ഈ സവിശേഷത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘ദേവാലയം’ എന്നതിനെക്കാൾ വിശാലവും ഈ രൂപകപ്രയോഗത്തിൽ സ്വാഭാവികവുമായ ‘ആലയം’ തിരഞ്ഞെടുത്തു. ‘തന്നെയാണ്’ എന്ന ഊന്നൽ ഭൗതിക ആലയത്തിനു പകരം ദൈവവും കുഞ്ഞാടും തന്നെയാണ് ആലയം എന്ന വൈരുധ്യം വ്യക്തമാക്കുന്നു.
