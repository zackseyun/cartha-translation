id: REV.21.1
reference: Revelation 21:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: ml
  text: ഞാൻ പുതിയൊരു ആകാശവും പുതിയൊരു ഭൂമിയും കണ്ടു; കാരണം, ആദ്യത്തെ ആകാശവും ആദ്യത്തെ ഭൂമിയും[a] കടന്നുപോയിരുന്നു; കടൽ ഇനി ഇല്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുമ്പുണ്ടായിരുന്ന ആകാശവും മുമ്പുണ്ടായിരുന്ന ഭൂമിയും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ആദ്യത്തെ ആകാശവും ആദ്യത്തെ ഭൂമിയും’ എന്നാണ്; പുതിയ ക്രമത്തിനു മുമ്പുണ്ടായിരുന്ന ക്രമത്തെ ഇത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘കടൽ’ എന്നത് അക്ഷരാർഥത്തിൽ വായിക്കാം. എന്നാൽ വെളിപ്പാട് പുസ്തകത്തിൽ അതിന് അരാജകത്വം, അപകടം, അല്ലെങ്കിൽ വേർപാട് എന്നിവയുമായുള്ള പ്രതീകാത്മക ബന്ധങ്ങളും ഉണ്ടായേക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδον
  choice: ഞാൻ ... കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ aorist indicative രൂപത്തെ ലളിതമായ ഭൂതകാല ആഖ്യാനമായി നൽകുന്നു; ആധുനിക മലയാളത്തിൽ ഇത് നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: οὐρανὸν ... γῆν
  choice: ആകാശം ... ഭൂമി
  rationale: പ്രപഞ്ചസൃഷ്ടിയുടെ സമഗ്രതയെ സൂചിപ്പിക്കുന്ന ഈ അന്ത്യദർശനസന്ദർഭത്തിൽ, ‘ആകാശവും ഭൂമിയും’ എന്ന മലയാളപ്രയോഗം ഗ്രീക്കിലെ ഏകവചനരൂപങ്ങളെയും വിശാലമായ അർഥത്തെയും നിലനിർത്തുന്നു.
- source_word: καινὸν ... καινήν
  choice: പുതിയൊരു ... പുതിയൊരു
  rationale: καινός ഗുണത്തിലോ സ്വഭാവത്തിലോ ഉള്ള പുതുമയെ സൂചിപ്പിക്കാം. ‘പുതിയ’ എന്നത് പകരംവെക്കലാണോ രൂപാന്തരമാണോ എന്ന് മുൻകൂട്ടി തീരുമാനിക്കാതെ മൂലപദത്തിന്റെ തുറന്ന അർഥം കാക്കുന്നു; ‘ഒരു’ മലയാളവാക്യത്തെ സ്വാഭാവികമാക്കുന്നു.
- source_word: ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: ആദ്യത്തെ ആകാശവും ആദ്യത്തെ ഭൂമിയും
  rationale: πρῶτος എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ആദ്യത്തെ’ പുതിയ ക്രമത്തിനു മുമ്പുണ്ടായിരുന്ന ക്രമവുമായുള്ള വ്യത്യാസം നിലനിർത്തുന്നു. ‘മുമ്പുണ്ടായിരുന്ന’ എന്നത് സാധ്യമെങ്കിലും അല്പം വ്യാഖ്യാനാത്മകമാണ്.
- source_word: ἀπῆλθαν
  choice: കഴിഞ്ഞുപോയിരുന്നു
  rationale: മുൻ ക്രമം ഇല്ലാതായതിനെ യോഹന്നാന്റെ ദർശനവുമായി ബന്ധപ്പെടുത്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ പൂർവഭൂതകാലരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἡ θάλασσα
  choice: കടൽ
  rationale: θάλασσα എന്ന മൂർത്തപദത്തിന്റെ നേരിട്ടുള്ള മലയാളമാണ് ‘കടൽ.’ വെളിപ്പാടിലെ പ്രതീകാത്മക അനുരണനങ്ങൾ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: οὐκ ἔστιν ἔτι
  choice: ഇനി ഇല്ല
  rationale: ἔτι സഹിതമുള്ള വർത്തമാനകാല നിഷേധത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുകയും ഗ്രീക്കിലെ കാലരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘പുതിയ ആകാശവും പുതിയ ഭൂമിയും’ എന്നതിന്റെ സ്വഭാവം
  choice: പഴയ സൃഷ്ടിക്കു പകരം മറ്റൊന്ന് വരുന്നതാണോ അതേ സൃഷ്ടി പുതുക്കപ്പെടുന്നതാണോ എന്ന് വ്യക്തമാക്കാതെ ‘പുതിയ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: സമ്പൂർണ പകരംവെക്കൽ; നിലവിലുള്ള സൃഷ്ടിയുടെ പുതുക്കൽ അല്ലെങ്കിൽ രൂപാന്തരം.
  rationale: καινός പുതുമയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം മാത്രം പകരംവെക്കലും രൂപാന്തരവും തമ്മിലുള്ള ചോദ്യം തീർപ്പാക്കുന്നില്ല. അതിനാൽ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: ‘കടൽ ഇനി ഇല്ല’ എന്നതിന്റെ അർഥം
  choice: പ്രതീകാത്മക അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കാതെ മൂർത്തമായ ദൃശ്യഭാഷ അതേപടി നിലനിർത്തി.
  alternative: കടലിന്റെ അക്ഷരാർഥത്തിലുള്ള അഭാവം; അരാജകത്വം, അപകടം, തിന്മ, അല്ലെങ്കിൽ വേർപാട് നീങ്ങിപ്പോകുന്നതിന്റെ പ്രതീകം.
  rationale: വെളിപ്പാടിലെ കടലിന് പ്രതീകാത്മക അനുരണനങ്ങൾ ഉണ്ടായേക്കാം; എങ്കിലും അവയിൽ ഒന്ന് പരിഭാഷയിൽ നിർബന്ധിക്കുന്നത് മൂലവാചകത്തിന്റെ ബഹുവ്യഞ്ജകത ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ദർശനവിവരണശൈലി സ്വീകരിച്ചു. ‘പുതിയൊരു,’ ‘കഴിഞ്ഞുപോയിരുന്നു,’ ‘ഇനി ഇല്ല’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കുമ്പോഴും മൂലഗ്രീക്കിലെ കാലബന്ധവും അർഥതുറപ്പും പരമാവധി സംരക്ഷിക്കുന്നു.
