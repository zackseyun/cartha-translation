id: REV.21.20
reference: Revelation 21:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ πέμπτος σαρδόνυξ, ὁ ἕκτος σάρδιον, ὁ ἕβδομος χρυσόλιθος, ὁ ὄγδοος βήρυλλος, ὁ ἔνατος τοπάζιον, ὁ δέκατος χρυσόπρασος, ὁ ἑνδέκατος ὑάκινθος, ὁ δωδέκατος ἀμέθυστος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: ml
  text: അഞ്ചാമത്തേത് സാർഡോണിക്സ്; ആറാമത്തേത് സാർദിയസ്[a]; ഏഴാമത്തേത് ക്രിസൊലൈറ്റ്; എട്ടാമത്തേത് ബെറിൽ; ഒൻപതാമത്തേത് ടോപാസ്; പത്താമത്തേത് ക്രിസോപ്രേസ്; പതിനൊന്നാമത്തേത് ജസിന്ത്[b]; പന്ത്രണ്ടാമത്തേത് അമെഥിസ്റ്റ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സാർദിയസ്’ എന്നതിന് ‘കാർണേലിയൻ’ എന്നും പറയാം; പുരാതനകാലത്തെ ഈ രത്നം കൃത്യമായി ഏതാണെന്നത് അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ജസിന്ത്’ എന്നത് ‘ഹയാസിന്ത്’ എന്നും എഴുതാം; ഗ്രീക്കുപദം ഇവിടെ പൂവിനെയല്ല, ഒരു രത്നത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμπτος
  choice: അഞ്ചാമത്തേത്
  rationale: അടിസ്ഥാനക്കല്ലുകളുടെ തുടർച്ചയായ പട്ടികയെന്ന സന്ദർഭത്തിൽ ഗ്രീക്കിലെ നിർദിഷ്ടതയും ക്രമസംഖ്യയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σαρδόνυξ
  choice: സാർഡോണിക്സ്
  rationale: തിരിച്ചറിയാവുന്ന പരമ്പരാഗത രത്നനാമം ലിപ്യന്തരണം ചെയ്തു; σάρδιον എന്നതിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἕκτος
  choice: ആറാമത്തേത്
  rationale: ഗ്രീക്കിലെ ആവർത്തനാത്മകമായ പട്ടികക്രമം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: σάρδιον
  choice: സാർഡിയസ്
  rationale: കൃത്യമായ പുരാതന രത്നതിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ പരമ്പരാഗത നാമം നിലനിർത്തുകയും സാർഡോണിക്സിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἕβδομος
  choice: ഏഴാമത്തേത്
  rationale: ക്രമസംഖ്യയുടെ ഔപചാരികമായ അനുക്രമം നിലനിർത്തുന്നു.
- source_word: χρυσόλιθος
  choice: ക്രിസൊലൈറ്റ്
  rationale: പദോൽപ്പത്തി ‘സ്വർണക്കല്ല്’ എന്നാണെങ്കിലും പുരാതന രത്നത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ മാറുന്നതിനാൽ സ്ഥാപിതമായ രത്നനാമം ഉപയോഗിക്കുന്നു.
- source_word: ὄγδοος
  choice: എട്ടാമത്തേത്
  rationale: ക്രമസംഖ്യ നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: βήρυλλος
  choice: ബെറിൽ
  rationale: ഈ രത്നത്തിനുള്ള പ്രചാരത്തിലുള്ള ആധുനിക നാമം ഉപയോഗിക്കുന്നു.
- source_word: ἔνατος
  choice: ഒൻപതാമത്തേത്
  rationale: പട്ടികയുടെ ക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοπάζιον
  choice: ടോപാസ്
  rationale: ഈ രത്നനാമത്തിന്റെ പൊതുവായി തിരിച്ചറിയാവുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: δέκατος
  choice: പത്താമത്തേത്
  rationale: ഗ്രീക്ക് ക്രമസംഖ്യയുടെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: χρυσόπρασος
  choice: ക്രിസോപ്രേസ്
  rationale: അക്ഷരാർഥ പദോൽപ്പത്തി അവ്യക്തമാകുന്നതിനാൽ സ്ഥാപിതമായ രത്നനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ἑνδέκατος
  choice: പതിനൊന്നാമത്തേത്
  rationale: പട്ടികയിലെ ക്രമസംഖ്യ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ὑάκινθος
  choice: ജസിന്ത്
  rationale: ഇവിടെ പൂവല്ല, രത്നമാണ് ഉദ്ദേശിക്കുന്നത്; പരമ്പരാഗത രത്നനാമം ഉപയോഗിച്ച് അടിക്കുറിപ്പിൽ മറ്റൊരു രൂപം സൂചിപ്പിക്കുന്നു.
- source_word: δωδέκατος
  choice: പന്ത്രണ്ടാമത്തേത്
  rationale: പട്ടികയുടെ അവസാന ക്രമസംഖ്യ നേരിട്ട് നൽകുന്നു.
- source_word: ἀμέθυστος
  choice: അമെഥിസ്റ്റ്
  rationale: തിരിച്ചറിയാവുന്ന സ്ഥാപിത രത്നനാമം മലയാള ലിപിയിൽ നൽകുന്നു.
