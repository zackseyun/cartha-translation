translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും വായിക്കാൻ എളുപ്പമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്ത പട്ടികഘടനയും ആവർത്തനലയവും അർധവിരാമങ്ങൾകൊണ്ട് നിലനിർത്തി. അനിശ്ചിതമായ പുരാതന രത്നനാമങ്ങൾ അതിരുകടന്ന് ആധുനിക ധാതുക്കളുമായി സമീകരിക്കാതെ പരമ്പരാഗത ലിപ്യന്തരങ്ങളായി നൽകി.
