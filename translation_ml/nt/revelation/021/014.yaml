id: REV.21.14
reference: Revelation 21:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: ml
  text: നഗരത്തിന്റെ മതിലിന് പന്ത്രണ്ട് അടിത്തറകൾ[a] ഉണ്ടായിരുന്നു; അവയിൽ കുഞ്ഞാടിന്റെ പന്ത്രണ്ട് അപ്പൊസ്തലന്മാരുടെ പന്ത്രണ്ട് പേരുകൾ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പന്ത്രണ്ട് അടിത്തറക്കല്ലുകൾ.” വാസ്തുശില്പസന്ദർഭത്തിൽ ഗ്രീക്കിലെ θεμελίους എന്ന പദം അടിത്തറകളെയോ അടിത്തറക്കല്ലുകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεῖχος
  choice: മതിൽ
  rationale: നഗരത്തെ ചുറ്റിയുള്ള മതിലിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം.
- source_word: πόλεως
  choice: നഗരത്തിന്റെ
  rationale: നഗരത്തോടുള്ള ഉടമസ്ഥത/ബന്ധം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയെ നേരിട്ട് പകർന്നു.
- source_word: ἔχων
  choice: ഉണ്ടായിരുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല കൃദന്തരൂപം ദർശനവിവരണത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാള ഭൂതകാല ക്രിയയായി പകർന്നു.
- source_word: θεμελίους δώδεκα
  choice: പന്ത്രണ്ട് അടിത്തറകൾ
  rationale: θεμέλιος എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; വാസ്തുശില്പസന്ദർഭത്തിൽ ‘അടിത്തറക്കല്ലുകൾ’ എന്നും അർഥമാകാമെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ἐπ’ αὐτῶν
  choice: അവയിൽ
  rationale: പേരുകൾ ആ അടിത്തറകളുടെ മേൽ/അവയിൽ ഉണ്ടായിരുന്നുവെന്ന സ്ഥാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ὀνόματα
  choice: പേരുകൾ
  rationale: മൂലപാഠം ‘ലിഖിതങ്ങൾ’ എന്നു വ്യക്തമാക്കാതെ ‘പേരുകൾ’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ അധികവിവരം ചേർത്തില്ല.
- source_word: ἀποστόλων
  choice: അപ്പൊസ്തലന്മാർ
  rationale: പുതിയ നിയമത്തിലെ സാങ്കേതിക സ്ഥാനനാമത്തിന് മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സ്ഥാപിതമായ പദം.
- source_word: τοῦ ἀρνίου
  choice: കുഞ്ഞാടിന്റെ
  rationale: വെളിപ്പാടിലെ ക്രിസ്തുസംബന്ധിയായ പ്രധാന സ്ഥാനനാമം നിലനിർത്തുന്നു; ഷഷ്ഠീവിഭക്തിബന്ധവും നേരിട്ട് പകർന്നു.
theological_decisions:
- issue: ἀρνίον എന്ന ക്രിസ്തുസംബന്ധിയായ സ്ഥാനനാമം
  choice: കുഞ്ഞാട്
  alternative: ആട്ടിൻകുട്ടി
  rationale: വെളിപ്പാടിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന ആവർത്തിത സ്ഥാനനാമത്തിന്റെ ബൈബിൾപരമായ പ്രതിധ്വനി ‘കുഞ്ഞാട്’ കൂടുതൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ വലിയക്ഷരംകൊണ്ട് സ്ഥാനനാമം അടയാളപ്പെടുത്തുന്ന രീതി നിർബന്ധമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ദർശനവിവരണ ശൈലി. ‘മതിൽ,’ ‘അടിത്തറ,’ ‘പേരുകൾ’ എന്നീ സാധാരണ പദങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘കൊത്തിയിരുന്നു’ പോലുള്ള വിശദീകരണം ചേർത്തിട്ടില്ല.
