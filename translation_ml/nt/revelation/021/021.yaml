id: REV.21.21
reference: Revelation 21:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: ml
  text: പന്ത്രണ്ടു കവാടങ്ങൾ പന്ത്രണ്ടു മുത്തുകളായിരുന്നു; ഓരോ കവാടവും ഒറ്റ മുത്തിൽനിന്നുള്ളതായിരുന്നു. നഗരത്തിന്റെ വീഥി[a] ശുദ്ധമായ പൊന്നായിരുന്നു, സുതാര്യമായ ഗ്ലാസ്‌പോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നഗരത്തിന്റെ വിശാലവീഥി’ അല്ലെങ്കിൽ ‘നഗരചത്വരം.’
    reason: πλατεῖα എന്ന പദത്തിന് വിശാലവീഥി, പൊതുവഴി, നഗരചത്വരം എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: πυλῶνες
  choice: കവാടങ്ങൾ
  rationale: നഗരത്തിന്റെ പ്രവേശനകവാടങ്ങളെയോ കവാടഘടനകളെയോ സൂചിപ്പിക്കുന്ന പദം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ദൃശ്യത്തിന് യോജിച്ചതുമാണ്.
- source_word: μαργαρῖται / μαργαρίτου
  choice: മുത്തുകൾ / മുത്ത്
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ബഹുവചനത്തിനുശേഷമുള്ള ഏകവചനഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: ἀνὰ εἷς ἕκαστος
  choice: ഓരോ ... ഓരോ
  rationale: ഓരോ കവാടത്തിനും ഓരോ മുത്ത് എന്ന വിതരണാത്മക ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: ഓരോ മുത്തിൽനിന്നുള്ളതായിരുന്നു
  rationale: ἐξ സൂചിപ്പിക്കുന്ന വസ്തുസ്രോതസ്സ് നിലനിർത്തുകയും ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘ഉണ്ടാക്കപ്പെട്ടത്’ എന്ന ക്രിയ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πλατεῖα
  choice: വീഥി
  rationale: വിശാലമായ പൊതുവഴി, വീഥി, അല്ലെങ്കിൽ നഗരചത്വരം എന്ന അർഥസാധ്യതകളിൽ സന്ദർഭത്തിന് സ്വാഭാവികമായ ‘വീഥി’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റുള്ളവ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: χρυσίον καθαρὸν
  choice: തങ്കം
  rationale: καθαρόν എന്ന വിശേഷണം ഉൾക്കൊള്ളിച്ച് ശുദ്ധവും അമിശ്രിതവുമായ സ്വർണം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὡς ὕαλος διαυγής
  choice: സുതാര്യമായ സ്ഫടികംപോലെ
  rationale: ὕαλος എന്നത് ഇവിടെ ഗ്ലാസ്/സ്ഫടികം എന്നും διαυγής സുതാര്യത എന്നും സൂചിപ്പിക്കുന്നു; ദർശനാത്മകമായ ഉപമ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: πλατεῖα സൂചിപ്പിക്കുന്ന നഗരഭാഗത്തിന്റെ സ്വഭാവം
  choice: ഏകവചനമായ ‘നഗരത്തിന്റെ വീഥി’
  alternative: ‘നഗരത്തിന്റെ വിശാലവീഥി’ അല്ലെങ്കിൽ ‘നഗരചത്വരം’
  rationale: ഇത് പ്രധാനമായും പദാർഥ-ദൃശ്യവിവരണ പ്രശ്നമാണ്. നഗരഘടനയെ അനാവശ്യമായി നിർണയിക്കാതെ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ പദം ഉപയോഗിക്കുകയും യഥാർഥ അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തരവും വിതരണാത്മകവുമായ ഘടന സാധ്യമായത്ര നിലനിർത്തി; യഥാർഥ പദാർഥവൈവിധ്യം അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിച്ചു.
