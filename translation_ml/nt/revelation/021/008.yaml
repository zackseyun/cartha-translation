id: REV.21.8
reference: Revelation 21:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: ml
  text: എന്നാൽ ഭീരുക്കൾക്കും അവിശ്വാസികൾക്കും[a] അറപ്പുളവാക്കുന്നവർക്കും കൊലപാതകികൾക്കും ലൈംഗിക അധാർമികതയിൽ ജീവിക്കുന്നവർക്കും മന്ത്രവാദികൾക്കും വിഗ്രഹാരാധകർക്കും എല്ലാ കള്ളം പറയുന്നവർക്കും ഉള്ള ഓഹരി തീയും ഗന്ധകവുംകൊണ്ട് കത്തിക്കൊണ്ടിരിക്കുന്ന തടാകത്തിലാണ്. അതാണ് രണ്ടാമത്തെ മരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “വിശ്വസ്തരല്ലാത്തവർക്കും” അഥവാ “അവിശ്വസ്തർക്കും.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δειλοῖς
  choice: ഭീരുക്കൾക്കും
  rationale: സാധാരണ ഭയത്തെയല്ല, ധാർമികമായി അപലപിക്കപ്പെടുന്ന ഭീരുത്വത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπίστοις
  choice: അവിശ്വാസികൾക്കും
  rationale: വിധിന്യായപ്പട്ടികയിൽ വിശ്വസിക്കാത്തവരെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും നേരിട്ടുള്ള അർഥം; ‘വിശ്വസ്തരല്ലാത്തവർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐβδελυγμένοις
  choice: അറപ്പുളവാക്കുന്നവർക്കും
  rationale: βδελύσσομαι എന്ന ക്രിയയുടെ perfect participle അറപ്പിനും മ്ലേച്ഛതയ്ക്കും പാത്രമായ സ്വഭാവം സൂചിപ്പിക്കുന്നു; വ്യക്തികളെ തന്നെയാണ് പട്ടികപ്പെടുത്തുന്നത് എന്നതും ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: φονεῦσι
  choice: കൊലപാതകികൾക്കും
  rationale: അന്യായമായി കൊല്ലുന്നവരെ സൂചിപ്പിക്കുന്ന കൃത്യവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: πόρνοις
  choice: ലൈംഗിക അധാർമികതയിൽ ജീവിക്കുന്നവർക്കും
  rationale: ലൈംഗിക അധാർമിക പ്രവൃത്തികളിൽ ഏർപ്പെടുന്നവരെ വിശാലമായി സൂചിപ്പിക്കുന്നു; പഴഞ്ചൻ അല്ലെങ്കിൽ അനാവശ്യമായി ഇടുങ്ങിയ പദം ഒഴിവാക്കുന്നു.
- source_word: φαρμάκοις
  choice: മന്ത്രവാദികൾക്കും
  rationale: വെളിപ്പാട് പുസ്തകത്തിന്റെ സന്ദർഭത്തിൽ മായാജാലമോ മന്ത്രവാദമോ അനുഷ്ഠിക്കുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്; ഔഷധം കൈകാര്യം ചെയ്യുന്നവരെ അല്ല.
- source_word: εἰδωλολάτραις
  choice: വിഗ്രഹാരാധകർക്കും
  rationale: വിഗ്രഹങ്ങളെ ആരാധിക്കുന്നവരെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: എല്ലാ കള്ളന്മാർക്കും
  rationale: substantival adjective ആയ ψευδής ഇവിടെ കള്ളം പറയുന്നവരെയോ വ്യാജരായവരെയോ സൂചിപ്പിക്കുന്നു; പട്ടികയിൽ ‘എല്ലാ കള്ളന്മാർക്കും’ സ്വാഭാവികമാണ്.
- source_word: τὸ μέρος αὐτῶν
  choice: അവർക്കുള്ള ഓഹരി
  rationale: μέρος ഇവിടെ ഒരാൾക്കു ലഭിക്കുന്ന പങ്ക് അഥവാ വിധിച്ച അന്തിമഗതി എന്ന ആശയം നൽകുന്നു.
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: തീയും ഗന്ധകവും കത്തുന്ന തടാകത്തിലാണ്
  rationale: καιομένῃ എന്ന participle തടാകത്തെ വിശേഷിപ്പിക്കുന്നു; θείον എന്നത് ആധുനിക മലയാളത്തിൽ ‘ഗന്ധകം’ എന്നാണ്.
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: അതിലാണ് രണ്ടാമത്തെ മരണം
  rationale: relative clause മുൻപുള്ള തീയും ഗന്ധകവും കത്തുന്ന തടാകത്തെ രണ്ടാമത്തെ മരണമായി തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ ‘അതാണു’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: വിധിന്യായപ്പട്ടികയിലെ ἄπιστος എന്ന പദത്തിന്റെ അർഥം
  choice: അവിശ്വാസികൾ
  alternative: വിശ്വസ്തരല്ലാത്തവർ / അവിശ്വസ്തർ
  rationale: ഈ സന്ദർഭത്തിൽ വിശ്വസിക്കാത്തവർ എന്ന അർഥമാണ് ഏറ്റവും നേരിട്ട് തോന്നുന്നത്. എന്നാൽ പദത്തിന് അവിശ്വസ്തത എന്ന അർഥവും ഉണ്ടാകുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ὅ എന്ന relative pronoun സൂചിപ്പിക്കുന്നത്
  choice: തീയും ഗന്ധകവും കത്തുന്ന തടാകം തന്നെയാണ് രണ്ടാമത്തെ മരണം
  alternative: ആ തടാകത്തിൽ ലഭിക്കുന്ന ഓഹരിയാണ് രണ്ടാമത്തെ മരണം
  rationale: ὅ എന്ന neuter relative pronoun വ്യാകരണലിംഗത്തിൽ λίμνη എന്ന feminine noun-നോട് നേരിട്ട് പൊരുത്തപ്പെടുന്നില്ലെങ്കിലും, മുൻപുള്ള മുഴുവൻ ദൃശ്യത്തെയോ വിധിയെയോ സംഗ്രഹിച്ച് സൂചിപ്പിക്കാം. വിവർത്തനം ആശയം അനാവശ്യമായി ചുരുക്കാതെ ‘അതാണ്’ എന്നു നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ദീർഘമായ ദോഷപ്പട്ടികയുടെ കൂട്ടിച്ചേർക്കൽഭാവം നിലനിർത്തിയെങ്കിലും, അവസാന വിശദീകരണം സ്വാഭാവിക മലയാളത്തിനായി വേറെ വാക്യമാക്കി.
