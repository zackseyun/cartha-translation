id: REV.21.11
reference: Revelation 21:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: ml
  text: ദൈവത്തിന്റെ മഹത്വം അതിനുണ്ടായിരുന്നു. അതിന്റെ പ്രകാശം ഏറ്റവും വിലയേറിയ ഒരു രത്നംപോലെ, സ്ഫടികംപോലെ തെളിഞ്ഞ യാസ്പിസ് കല്ലുപോലെ[a] ആയിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യാസ്പിസ്’ എന്ന പുരാതന രത്നനാമത്തിന്റെ കൃത്യമായ ആധുനിക തിരിച്ചറിയൽ അനിശ്ചിതമാണ്.
    reason: historical_identification
  - marker: b
    text: അല്ലെങ്കിൽ, ‘സ്ഫടികംപോലെ മിന്നുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσαν
  choice: അതിന് ഉണ്ടായിരുന്നു
  rationale: മുൻവാക്യത്തിലെ നഗരത്തെ വിശേഷിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണവാക്യമായി നിലനിർത്തുന്നു.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മഹത്ത്വം
  rationale: δόξα എന്ന പദത്തിന്റെ ദൈവിക സാന്നിധ്യവും പ്രതാപവും ഉൾക്കൊള്ളുന്ന വേദപുസ്തകപരമായ ഭാരം ‘മഹത്ത്വം’ നിലനിർത്തുന്നു.
- source_word: ὁ φωστὴρ αὐτῆς
  choice: അതിന്റെ തേജസ്സ്
  rationale: φωστήρ ഇവിടെ നഗരത്തിൽനിന്നു ദൃശ്യമാകുന്ന പ്രകാശപ്രഭയെ സൂചിപ്പിക്കുന്നു; ‘തേജസ്സ്’ പ്രകാശവും ദീപ്തിയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: λίθῳ τιμιωτάτῳ
  choice: ഏറ്റവും വിലയേറിയ ഒരു രത്നം
  rationale: τιμιωτάτῳ എന്ന അതിശയോന്നത രൂപത്തിന്റെ ശക്തി ‘ഏറ്റവും വിലയേറിയ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു; ഈ ആഭരണസന്ദർഭത്തിൽ λίθος-ന് ‘രത്നം’ സ്വാഭാവികമാണ്.
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: ഒരു സൂര്യകാന്തക്കല്ലുപോലെ
  rationale: ἴασπις എന്ന പുരാതന രത്നനാമത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ‘സൂര്യകാന്തക്കല്ല്’ ഉപയോഗിക്കുന്നു; അതിന്റെ കൃത്യമായ ആധുനിക ധാതു-തിരിച്ചറിയൽ അനിശ്ചിതമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: κρυσταλλίζοντι
  choice: സ്ഫടികംപോലെ തെളിഞ്ഞ
  rationale: സ്ഫടികസദൃശമായ തെളിമയെയോ ദീപ്തിയെയോ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അർത്ഥത്തിലെ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: δόξα τοῦ θεοῦ എന്ന പ്രയോഗത്തിന്റെ ദർശനസാഹിത്യപരമായ അർത്ഥം
  choice: ദൈവത്തിന്റെ മഹത്ത്വം
  alternative: ദൈവത്തിന്റെ പ്രതാപം / ദൈവത്തിന്റെ ദീപ്തി
  rationale: ഇത് വെറും കാഴ്ചഭംഗിയല്ല, ദൈവസാന്നിധ്യത്തിന്റെ വെളിപ്പെട്ട മഹിമയും സൂചിപ്പിക്കുന്നു; ‘മഹത്ത്വം’ ആ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി ചുരുക്കുന്നില്ല.
- issue: φωστήρ എന്ന പദം പ്രകാശസ്രോതസ്സിനെയോ ദീപ്തിയെയോ സൂചിപ്പിക്കുന്നതിലെ അവ്യക്തത
  choice: അതിന്റെ തേജസ്സ്
  alternative: അതിന്റെ വെളിച്ചം / അതിന്റെ പ്രകാശം
  rationale: നഗരത്തിന്റെ ദൃശ്യപ്രഭയെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘തേജസ്സ്’ സ്വാഭാവികമാണ്; ഒരു പ്രത്യേക പ്രകാശഗോളം എന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ട് ഉപമകളും അതിശയോന്നത ഭാവവും നിലനിർത്തി; കല്ലിന്റെ തിരിച്ചറിയലും κρυσταλλίζοντι എന്നതിന്റെ ‘തെളിമ/മിന്നൽ’ സാധ്യതയും അതിയായി നിർണയിച്ചിട്ടില്ല.
