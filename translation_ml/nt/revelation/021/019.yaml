id: REV.21.19
reference: Revelation 21:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: ml
  text: 'നഗരമതിലിന്റെ അടിസ്ഥാനങ്ങൾ സകലവിധ വിലയേറിയ കല്ലുകളാലും അലങ്കരിക്കപ്പെട്ടിരുന്നു: ഒന്നാമത്തെ അടിസ്ഥാനം യാസ്പിസ്[a], രണ്ടാമത്തേത് നീലക്കല്ല്, മൂന്നാമത്തേത് കൽക്കേദോൻ[b], നാലാമത്തേത് മരതകം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യാസ്പിസ്’ ഗ്രീക്ക് രത്നനാമത്തിന്റെ ലിപ്യന്തരമാണ്; ഈ പുരാതന രത്നത്തിന്റെ കൃത്യമായ ആധുനിക തിരിച്ചറിയൽ അനിശ്ചിതമാണ്.
    reason: cultural_note
  - marker: b
    text: ‘കൽക്കേദോൻ’ ഗ്രീക്ക് രത്നനാമത്തിന്റെ ലിപ്യന്തരമാണ്; ചില പുരാതന രത്നങ്ങളുടെ കൃത്യമായ ആധുനിക തിരിച്ചറിയൽ അനിശ്ചിതമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: θεμέλιοι
  choice: അടിസ്ഥാനങ്ങൾ
  rationale: നഗരമതിലിന്റെ അടിസ്ഥാനഘടകങ്ങളെയോ അടിസ്ഥാനശിലകളെയോ സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപം; സന്ദർഭത്തിൽ സ്വാഭാവികവും ഗ്രീക്കിന്റെ രൂപത്തോട് ചേർന്നതുമായ പരിഭാഷ.
- source_word: τείχους
  choice: മതിൽ
  rationale: കോട്ടമതിൽ എന്ന ആശയം സന്ദർഭത്തിലുണ്ടെങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ സാധാരണ അർഥം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: παντὶ λίθῳ τιμίῳ
  choice: സകലവിധ വിലയേറിയ കല്ലുകളാലും
  rationale: ദാതൃകാവിഭക്തി അലങ്കാരത്തിനുപയോഗിച്ച വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; παντί എന്നതിന്റെ വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘സകലവിധ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: κεκοσμημένοι
  choice: അലങ്കരിക്കപ്പെട്ടിരുന്നു
  rationale: പൂർണ നിഷ്ക്രിയ കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന പൂർത്തിയായ അലങ്കൃതാവസ്ഥയും നിഷ്ക്രിയഭാവവും നിലനിർത്തുന്നു.
- source_word: ἴασπις
  choice: സൂര്യകാന്തം
  rationale: ἴασπις എന്ന പുരാതന രത്നനാമത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പരമ്പരാഗത സമാനപദം; കൃത്യമായ ആധുനിക ഖനിജതിരിച്ചറിയൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: σάπφιρος
  choice: നീലക്കല്ല്
  rationale: σάπφιρος എന്ന രത്നനാമത്തിന്റെ സാധാരണവും മനസ്സിലാക്കാൻ എളുപ്പവുമായ മലയാളരൂപം.
- source_word: χαλκηδών
  choice: കൽക്കേദോൻ
  rationale: പുരാതന രത്നത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ നിർവചനാത്മക പരിഭാഷയ്ക്കുപകരം ഗ്രീക്ക് നാമത്തിന്റെ ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- source_word: σμάραγδος
  choice: മരതകം
  rationale: σμάραγδος എന്ന രത്നനാമത്തിന് നിലവാരമുള്ള മലയാള സമാനപദം.
theological_decisions:
- issue: ദർശനവിവരണത്തിലെ രത്നപ്പട്ടികയുടെ പ്രതീകാർഥം
  choice: ഓരോ രത്നനാമവും നേരിട്ട് പരിഭാഷപ്പെടുത്തി; പ്രധാനവാചകത്തിൽ പ്രതീകവ്യാഖ്യാനം ചേർത്തില്ല.
  alternative: രത്നങ്ങളെ ഇസ്രായേൽ ഗോത്രങ്ങൾ, അപ്പൊസ്തലന്മാർ, അല്ലെങ്കിൽ മഹാപുരോഹിതന്റെ പതക്കം എന്നിവയുമായി ബന്ധപ്പെടുത്തി വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം രത്നങ്ങൾ പട്ടികപ്പെടുത്തുന്നുവെങ്കിലും അവയുടെ പ്രതീകാർഥം വിശദീകരിക്കുന്നില്ല; അതിനാൽ വാചകത്തിൽ ഇല്ലാത്ത ഒരു പ്രത്യേക ദൈവശാസ്ത്രപദ്ധതി പരിഭാഷയിലൂടെ അടിച്ചേൽപ്പിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പട്ടികയുടെ ഔന്നത്യം നിലനിർത്താൻ ‘അലങ്കരിക്കപ്പെട്ടിരുന്നു’, ‘മരതകം’ തുടങ്ങിയ രൂപങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിസ്ഥാനം-ഘടകങ്ങൾക്കും ‘അടിസ്ഥാനം’ എന്ന ഏകീകരിച്ച പദം നിലനിർത്തി.
