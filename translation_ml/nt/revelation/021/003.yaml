id: REV.21.3
reference: Revelation 21:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: ml
  text: 'പിന്നെ സിംഹാസനത്തിൽനിന്ന് ഉച്ചത്തിലുള്ള ഒരു ശബ്ദം ഇങ്ങനെ പറയുന്നതു ഞാൻ കേട്ടു: “ഇതാ, ദൈവത്തിന്റെ വാസസ്ഥലം[a] മനുഷ്യരോടുകൂടെയാണ്. അവിടുന്ന് അവരോടുകൂടെ വസിക്കും[b]. അവർ അവിടുത്തെ ജനതകളായിരിക്കും[c]. ദൈവംതന്നെ അവരോടുകൂടെ ഉണ്ടായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൈവത്തിന്റെ കൂടാരം” അല്ലെങ്കിൽ “ദൈവത്തിന്റെ തിരുനിവാസം” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ σκηνή എന്ന പദം കൂടാരത്തിന്റെയും തിരുനിവാസത്തിന്റെയും ചിത്രം ഉണർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അവിടുന്ന് അവരോടുകൂടെ കൂടാരമടിക്കും” എന്ന് കൂടുതൽ അക്ഷരാർഥത്തിൽ പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ “വാസസ്ഥലം/കൂടാരം” എന്ന മുൻപത്തെ പദവുമായി ബന്ധപ്പെട്ടതാണ്.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ “ജനതകൾ” എന്നത് ബഹുവചനമാണ്; ചില പരമ്പരാഗത പരിഭാഷകളിലെ ഏകവചനമായ “ജനം” എന്നല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: ഉച്ചത്തിലുള്ള ഒരു ശബ്ദം
  rationale: μέγας എന്ന പദം ഇവിടെ ശബ്ദത്തിന്റെ വലുപ്പമല്ല, അതിന്റെ ഉച്ചവും ശക്തിയും സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκ τοῦ θρόνου
  choice: സിംഹാസനത്തിൽനിന്ന്
  rationale: ἐκ ശബ്ദത്തിന്റെ ഉറവിടം സൂചിപ്പിക്കുന്നു; വെളിപ്പാടിലെ സിംഹാസനദൃശ്യവും അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ἰδούയുടെ ഗൗരവവും സ്വാഭാവികതയും ഒരുമിച്ച് നിലനിർത്തുന്ന മലയാളപ്രയോഗം.
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വാസസ്ഥലം
  rationale: σκηνήയുടെ അടിസ്ഥാനചിത്രം കൂടാരം/തിരുനിവാസം എന്നതാണെങ്കിലും ഇവിടെ ദൈവം മനുഷ്യരോടുകൂടെ വസിക്കുന്നതിലാണ് ഊന്നൽ. പ്രധാനവാചകത്തിൽ വ്യക്തമായ ‘വാസസ്ഥലം’ ഉപയോഗിക്കുകയും കൂടാരചിത്രം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
- source_word: μετὰ τῶν ἀνθρώπων
  choice: മനുഷ്യരോടുകൂടെ
  rationale: ἄνθρωποι ഇവിടെ സ്ത്രീപുരുഷഭേദമില്ലാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘മനുഷ്യർ’ ആ സമൂഹാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: σκηνώσει
  choice: വസിക്കും
  rationale: σκηνόω എന്ന ക്രിയയ്ക്ക് വസിക്കുക, കൂടാരമടിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. സ്വാഭാവികമായ പ്രധാനവാചകത്തിനായി ‘വസിക്കും’ തിരഞ്ഞെടുത്തു; σκηνήയുമായുള്ള പദചിത്രബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: λαοὶ αὐτοῦ
  choice: അവിടത്തെ ജനതകൾ
  rationale: λαοί ബഹുവചനമാണ്. ‘ജനതകൾ’ എന്നത് അതിനെ ഏകവചനമായ ‘ജനം’ എന്നു മിനുക്കാതെ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: αὐτὸς ὁ θεός
  choice: ദൈവംതന്നെ
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘തന്നെ’ എന്നതിലൂടെ പ്രകടമാക്കി; ദൈവത്തിന്റെ നേരിട്ടുള്ള സാന്നിധ്യമാണ് ഇതിലൂടെ വ്യക്തമാകുന്നത്.
- source_word: μετ’ αὐτῶν ἔσται
  choice: അവരോടുകൂടെ ഉണ്ടായിരിക്കും
  rationale: ഭാവികാലത്തിലുള്ള ദൈവസാന്നിധ്യപ്രസ്താവനയെ ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: λαοί എന്ന ബഹുവചനവും പരമ്പരാഗത ഏകവചനമായ ‘ജനം’ എന്ന വായനയും
  choice: അവർ അവിടത്തെ ജനതകളായിരിക്കും
  alternative: അവർ അവിടത്തെ ജനമായിരിക്കും
  rationale: വിമർശനാത്മക ഗ്രീക്ക് പാഠത്തിൽ λαοί ബഹുവചനമാണ്. പല ജനതകളും ദൈവത്തിന്റേതാകുന്നു എന്ന സാധ്യതയുള്ള ദൈവശാസ്ത്രപരമായ സൂചനയെ ഏകവചനമാക്കി ഇല്ലാതാക്കാതെ മൂലപാഠത്തിന്റെ രൂപം നിലനിർത്തി.
- issue: σκηνή / σκηνόω എന്നീ പദങ്ങളിലെ കൂടാര-തിരുനിവാസ ചിത്രം
  choice: ദൈവത്തിന്റെ വാസസ്ഥലം … അവിടന്ന് അവരോടുകൂടെ വസിക്കും
  alternative: ദൈവത്തിന്റെ കൂടാരം … അവിടന്ന് അവരോടുകൂടെ കൂടാരമടിക്കും
  rationale: പ്രധാനവാചകം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാക്കി; അതേസമയം പഴയനിയമത്തിലെ തിരുനിവാസത്തെയും ദൈവത്തിന്റെ ഉടമ്പടിസാന്നിധ്യത്തെയും ഓർമിപ്പിക്കുന്ന മൂലപദചിത്രം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടന്ന്/അവിടത്തെ’ ഉപയോഗിച്ചു. വാക്യത്തിന്റെ പ്രഖ്യാപനസ്വഭാവം നിലനിർത്താൻ ‘ഇതാ’യും നേരിട്ടുള്ള ഉദ്ധരണിയും സൂക്ഷിച്ചു.
