source:
  edition: SBLGNT
  text: καὶ οἱ πυλῶνες αὐτῆς οὐ μὴ κλεισθῶσιν ἡμέρας, νὺξ γὰρ οὐκ ἔσται ἐκεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/025.yaml
  text: And its gates will never be shut by day—for there will be no night there—[a][b]
translation:
  language: ml
  text: കൂടാതെ, അതിന്റെ കവാടങ്ങൾ പകൽ ഒരിക്കലും അടയ്ക്കപ്പെടുകയില്ല[a]; കാരണം, അവിടെ രാത്രി ഉണ്ടാകുകയില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘അതിന്റെ കവാടങ്ങൾ പകൽ തീർച്ചയായും ഒരിക്കലും അടയ്ക്കപ്പെടുകയില്ല.’ ഗ്രീക്കിൽ ഊന്നിയ നിഷേധപ്രയോഗമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'കവാടങ്ങൾ അടയ്ക്കപ്പെടാത്തതിന് പറയുന്ന കാരണം: ‘അവിടെ രാത്രി ഉണ്ടാകുകയില്ല.’'
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: അതിന്റെ
  rationale: മുൻവാക്യത്തിലെ നഗരവിവരണത്തോടുള്ള ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ നിലനിർത്തുന്നു; പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കുന്നത് ഇവിടെ അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: πυλῶνες
  choice: കവാടങ്ങൾ
  rationale: നഗരത്തിന്റെ പ്രവേശനകവാടങ്ങളെയോ കവാടസമുച്ചയങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘കവാടങ്ങൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ദൃശ്യബിംബത്തിന് യോജിച്ചതുമാണ്.
- source_word: οὐ μὴ κλεισθῶσιν
  choice: ഒരിക്കലും അടയ്ക്കപ്പെടുകയില്ല
  rationale: οὐ μή എന്ന ഊന്നിയ നിഷേധവും ഭാവികാലസൂചനയും വ്യക്തമായി പകരുന്നു.
- source_word: ἡμέρας
  choice: പകൽ
  rationale: കാലസൂചകമായ ജനിറ്റീവിനെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുകയും തുടർന്നുള്ള ‘രാത്രി’യോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: കാരണം അവിടെ രാത്രി ഉണ്ടാകുകയില്ല
  rationale: γάρ നൽകുന്ന കാരണബന്ധവും ἔσται എന്നതിന്റെ അസ്തിത്വാർഥവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: αὐτῆς
  choice: അതിന്റെ
  rationale: ഗ്രീക്കിലെ സ്ത്രീലിംഗം നഗരത്തിന്റെ വ്യാകരണലിംഗത്തോട് യോജിക്കുന്നതാണ്; മലയാളത്തിൽ നഗരത്തെ സൂചിപ്പിക്കാൻ ‘അതിന്റെ’ എന്നത് സ്വാഭാവികമാണ്.
theological_decisions:
- issue: പുതിയ യെരൂശലേമിന്റെ വ്യക്തിവൽക്കരണത്തിന്റെ അളവ്
  choice: ‘അതിന്റെ കവാടങ്ങൾ’
  alternative: ‘അവളുടെ കവാടങ്ങൾ’
  rationale: αὐτῆς എന്ന സ്ത്രീലിംഗ സർവനാമം വ്യാകരണപരമായി നഗരത്തോട് യോജിക്കുന്നു. ഈ വാക്യത്തിൽ വധുവെന്ന വ്യക്തിവൽക്കരണം മുൻനിരയിൽ കൊണ്ടുവരാതെ നഗരത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള വിവരണം നിലനിർത്തുന്നു.
- issue: കവാടങ്ങൾ അടയ്ക്കപ്പെടാത്തതിന്റെ കാരണം
  choice: γάρ-നെ ‘കാരണം’ എന്നു വ്യക്തമാക്കി
  alternative: വെറും ബന്ധകചിഹ്നം ഉപയോഗിക്കുക
  rationale: അവിടെ രാത്രി ഇല്ലെന്നതാണ് കവാടങ്ങൾ അടയ്ക്കപ്പെടാത്തതിനുള്ള വിശദീകരണമെന്ന് മൂലപാഠം തുറന്നുപറയുന്നു; അതിനാൽ കാരണബന്ധം മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒരിക്കലും’ എന്നത് ഗ്രീക്കിലെ ഊന്നിയ നിഷേധം വായനക്കാരന് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; ‘കവാടങ്ങൾ’ നഗരദൃശ്യബിംബം വ്യക്തമായി നിലനിർത്തുന്നു.
