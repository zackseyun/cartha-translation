id: REV.21.4
reference: Revelation 21:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: ml
  text: അവരുടെ കണ്ണുകളിൽനിന്ന് അവൻ ഓരോ കണ്ണുനീർത്തുള്ളിയും തുടച്ചുനീക്കും[a]. ഇനി മരണം ഉണ്ടാകുകയില്ല; ദുഃഖമോ നിലവിളിയോ വേദനയോ ഇനി ഉണ്ടാകുകയില്ല[b]. മുമ്പുണ്ടായിരുന്നവ കടന്നുപോയി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘എല്ലാ കണ്ണുനീരും.’ ഗ്രീക്കിലെ ഏകവചനം വിതരണാർഥത്തിലാണ്: ‘ഓരോ കണ്ണുനീർത്തുള്ളിയും.’'
    reason: lexical_alternative
  - marker: b
    text: ‘നിലവിളി’ എന്നതിന് ‘ഉച്ചത്തിലുള്ള കരച്ചിൽ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദത്തിന് ഒരു കരച്ചിലിനെയോ ഉച്ചത്തിലുള്ള വിളിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ആദ്യത്തെ കാര്യങ്ങൾ കടന്നുപോയി.’ ഇവിടെ ഗ്രീക്ക് പദം മുമ്പുണ്ടായിരുന്ന കാര്യങ്ങളെയോ അവസ്ഥകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: തുടച്ചുനീക്കും
  rationale: കണ്ണുനീരിനോടൊപ്പം ഉപയോഗിക്കുമ്പോൾ ἐξαλείφω എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം വ്യക്തിപരമായി തുടച്ചുമാറ്റുക എന്നതാണ്. ‘തുടച്ചുനീക്കും’ ആ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πᾶν δάκρυον
  choice: ഓരോ കണ്ണുനീർത്തുള്ളിയും
  rationale: πᾶν ചേർന്ന ഏകവചനരൂപം വിതരണാർഥമുള്ളതാണ്; ഓരോ കണ്ണുനീരും എന്ന ഊന്നൽ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: അവരുടെ കണ്ണുകളിൽനിന്ന്
  rationale: നീക്കം സംഭവിക്കുന്ന ഉറവിടം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: ὁ θάνατος
  choice: മരണം
  rationale: പുതിയ സൃഷ്ടിയിൽ മരണം സമ്പൂർണമായി ഇല്ലാതാകുന്നതിനെ സൂചിപ്പിക്കുന്ന അമൂർത്തനാമം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐκ ἔσται ἔτι
  choice: ഇനി ... ഉണ്ടാകുകയില്ല
  rationale: രണ്ടിടത്തും സമ്പൂർണമായ അവസാനത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം. മലയാളത്തിൽ ഗൗരവവും വ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: πένθος
  choice: ദുഃഖം
  rationale: വിലാപവും വിയോഗദുഃഖവും ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ സന്ദർഭോചിത പദം.
- source_word: κραυγή
  choice: നിലവിളി
  rationale: κραυγή സൂചിപ്പിക്കുന്ന കേൾക്കാവുന്ന കരച്ചിലിനെയോ ഉച്ചത്തിലുള്ള വിളിയെയോ മലയാളത്തിൽ ‘നിലവിളി’ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: πόνος
  choice: വേദന
  rationale: ശാരീരികവും മാനസികവുമായ കഷ്ടത ഉൾക്കൊള്ളാൻ കഴിയുന്ന, ഈ പട്ടികയിൽ ഏറ്റവും വ്യക്തമായ മലയാളസമാനപദം.
- source_word: τὰ πρῶτα
  choice: മുമ്പുണ്ടായിരുന്നവ
  rationale: മുൻകാലത്തെ അവസ്ഥകളെയോ പഴയ ക്രമത്തെയോ സൂചിപ്പിക്കുന്ന നപുംസക ബഹുവചനത്തിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം; ‘ആദ്യത്തേവ’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἀπῆλθαν
  choice: കടന്നുപോയി
  rationale: പഴയ അവസ്ഥകൾ അവസാനിച്ച് നീങ്ങിപ്പോയെന്ന പൂർത്തിയായ സംഭവബോധം ലളിതവും ഗൗരവപൂർണവുമായി നൽകുന്നു.
theological_decisions:
- issue: ‘തുടച്ചുനീക്കും’ എന്ന ക്രിയയുടെ കർത്താവ് ഈ വാക്യത്തിൽ തുറന്നുപറഞ്ഞിട്ടില്ല; മുൻസന്ദർഭത്തിൽനിന്നാണ് മനസ്സിലാകുന്നത്.
  choice: ‘അവൻ ... തുടച്ചുനീക്കും’ എന്ന് വിവർത്തനം ചെയ്തു; ‘ദൈവം’ എന്ന നാമം വാക്യത്തിലേക്ക് ചേർത്തില്ല.
  alternative: ‘ദൈവം ... തുടച്ചുനീക്കും’
  rationale: ഗ്രീക്കിൽ മൂന്നാംപുരുഷ ഏകവചന കർത്താവ് ക്രിയയിൽ അന്തർലീനമാണ്; ഉടൻമുമ്പുള്ള സന്ദർഭമാണ് അതിന്റെ സൂചന. മൂലവാക്യത്തിന്റെ ബന്ധവും സംക്ഷിപ്തതയും നിലനിർത്താൻ സർവനാമം ഉപയോഗിച്ചു.
- issue: പുതിയ സൃഷ്ടിയിൽ ഇല്ലാതാകുന്ന മരണം, ദുഃഖം, നിലവിളി, വേദന എന്നിവയുടെ വ്യാപ്തി.
  choice: ‘ഇനി ... ഉണ്ടാകുകയില്ല’ എന്ന നിരുപാധിക ഭാഷ നിലനിർത്തി.
  alternative: ‘ഇനി കുറയും’ അല്ലെങ്കിൽ സമ്പൂർണ അവസാനത്തെ മയപ്പെടുത്തുന്ന മറ്റു രൂപങ്ങൾ
  rationale: ഗ്രീക്ക് സമ്പൂർണമായ അവസാനമാണ് പ്രഖ്യാപിക്കുന്നത്; അതിൽ വ്യാഖ്യാനപരമായ നിയന്ത്രണമോ മയപ്പെടുത്തലോ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവപൂർണമായ ശൈലി. ‘ഓരോ കണ്ണുനീർത്തുള്ളിയും’ എന്നത് ഗ്രീക്കിലെ വിതരണാർഥം വ്യക്തമാക്കുന്നു; പട്ടികയിലെ ആവർത്തനഘടനയും അന്തിമത്വവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
