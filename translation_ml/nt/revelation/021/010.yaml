reference: Revelation 21:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: ml
  text: അവൻ എന്നെ ആത്മാവിൽ[a] വലിയതും ഉയരമുള്ളതുമായ ഒരു മലയിലേക്കു കൊണ്ടുപോയി; ദൈവത്തിൽനിന്ന് സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുന്ന വിശുദ്ധനഗരമായ യെരൂശലേം എനിക്കു കാണിച്ചുതന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മീയ ദർശനാവസ്ഥയിൽ’ എന്നും അർഥമാകാം. ഈ ഗ്രീക്ക് പ്രയോഗം വെളിപ്പാട് പുസ്തകത്തിൽ സാധാരണയായി പ്രവാചകദർശനം അവതരിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: കൊണ്ടുപോയി
  rationale: ദർശനസന്ദർഭത്തിൽ ഒരിടത്തുനിന്ന് മറ്റൊരു ദർശനസ്ഥാനത്തേക്കുള്ള മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ബലമായി വഹിച്ചെന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
- source_word: ἐν πνεύματι
  choice: ആത്മാവിൽ[a]
  rationale: വെളിപ്പാടിലെ പ്രവാചകദർശനസൂത്രവാക്യത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു; പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനമോ ആത്മീയ ദർശനാവസ്ഥയോ എന്ന സാധ്യത പാദക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: വലുതും ഉയരമുള്ളതുമായ ഒരു മലയിലേക്കു
  rationale: ἐπίയുടെ ചലനാർഥവും μέγα, ὑψηλόν എന്നീ രണ്ടു വിശേഷണങ്ങളുടെയും വ്യത്യസ്ത ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ἔδειξέν μοι
  choice: എനിക്കു കാണിച്ചുതന്നു
  rationale: δείκνυμι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὴν πόλιν τὴν ἁγίαν Ἰερουσαλήμ
  choice: വിശുദ്ധനഗരമായ യെരൂശലേം
  rationale: യെരൂശലേം തന്നെയാണ് വിശുദ്ധനഗരം എന്ന സമാനാധികരണബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καταβαίνουσαν
  choice: ഇറങ്ങിവരുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന നടന്നുകൊണ്ടിരിക്കുന്ന ഇറക്കം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: നഗരത്തിന്റെ പുറപ്പെടുന്ന ഉറവിടം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘സ്വർഗത്തിൽനിന്ന്’ സ്വാഭാവികമാണ്.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ അടുക്കൽനിന്ന്
  rationale: ἐκ τοῦ οὐρανοῦ എന്നതിനോടടുത്തുള്ള രണ്ടാമത്തെ ഉറവിടപ്രയോഗത്തിന്റെ വ്യത്യാസം നിലനിർത്തുകയും ദൈവസന്നിധിയിൽനിന്നുള്ള വരവ് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ‘സന്നിധി’ എന്ന പദം നേരിട്ട് ചേർത്ത് അതിവ്യാഖ്യാനം ചെയ്യുന്നില്ല.
theological_decisions:
- issue: ἐν πνεύματι എന്ന ദർശനസൂത്രത്തിലെ πνεῦμα ആരെയോ എന്തിനെയോ സൂചിപ്പിക്കുന്നു
  choice: ‘ആത്മാവിൽ’ എന്ന മുഖ്യവായന; പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനം സാധ്യതയുള്ളതായി നിലനിർത്തുന്നു
  alternative: ‘ആത്മീയ ദർശനാവസ്ഥയിൽ’ അല്ലെങ്കിൽ ‘തന്റെ ആത്മാവിൽ’
  rationale: വെളിപ്പാട് 1:10; 4:2; 17:3 എന്നിവയിലെ ആവർത്തിത പ്രയോഗം പ്രവാചകദർശനം അവതരിപ്പിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് രൂപം മാത്രം പരിശുദ്ധാത്മാവിനെയും യോഹന്നാന്റെ ആത്മാവിനെയും തമ്മിൽ പൂർണമായി നിർണയിക്കുന്നില്ല; അതിനാൽ മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി പാദക്കുറിപ്പിൽ അർഥസാധ്യത അറിയിക്കുന്നു.
- issue: ദൈവത്തിൽനിന്നും സ്വർഗത്തിൽനിന്നും എന്ന ഇരട്ട ഉറവിടപ്രയോഗം
  choice: ‘ദൈവത്തിന്റെ അടുക്കൽനിന്ന് സ്വർഗത്തിൽനിന്ന്’ എന്ന രണ്ടു ഘടകങ്ങളും നിലനിർത്തുന്നു
  alternative: ‘ദൈവത്തിൽനിന്ന് സ്വർഗത്തിലൂടെ’ അല്ലെങ്കിൽ ഒറ്റ ഉറവിടപ്രയോഗമായി ചുരുക്കൽ
  rationale: ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ എന്ന മൂലപാഠത്തിലെ രണ്ടു മുൻപ്രത്യയപ്രയോഗങ്ങളെയും സംരക്ഷിക്കുന്നു; അവയുടെ ബന്ധം വിശദീകരിച്ച് ദൈവത്തിന്റെ സ്ഥാനം സംബന്ധിച്ച അധിക നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ പ്രവാഹം നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യത്തിനായി അർദ്ധവിരാമം ഉപയോഗിച്ചു; പരമ്പരാഗത ബൈബിൾ പദങ്ങളായ ‘ആത്മാവ്’, ‘വിശുദ്ധനഗരം’, ‘യെരൂശലേം’, ‘സ്വർഗം’ എന്നിവ നിലനിർത്തി.
