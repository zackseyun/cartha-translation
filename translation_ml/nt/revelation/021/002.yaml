id: REV.21.2
reference: Revelation 21:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: ml
  text: ദൈവത്തിൽനിന്ന് സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുന്ന വിശുദ്ധനഗരമായ പുതിയ യെരൂശലേമിനെ ഞാൻ കണ്ടു. തന്റെ ഭർത്താവിനുവേണ്ടി അണിഞ്ഞൊരുങ്ങിയ ഒരു മണവാട്ടിയെപ്പോലെ അത് ഒരുക്കപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλιν τὴν ἁγίαν
  choice: വിശുദ്ധനഗരം
  rationale: നഗരത്തിന്റെ മൂർത്തമായ ദൃശ്യവും ἁγίαν എന്നതിന്റെ ദൈവികമായി വേർതിരിക്കപ്പെട്ടതെന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἰερουσαλὴμ καινὴν
  choice: പുതിയ യെരൂശലേം
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും καινήν എന്ന വിശേഷണം വിവർത്തനം ചെയ്യുകയും ചെയ്യുന്നു; വിശേഷണത്തിന്റെ വിവരണാത്മക സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: ὁράωയുടെ ലളിതമായ ഭൂതകാല അർഥം അധിക വിശദീകരണമില്ലാതെ നൽകുന്നു.
- source_word: καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ അടുക്കൽനിന്ന് സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുന്ന
  rationale: καταβαίνουσαν എന്ന ചലനവും ἐκ τοῦ οὐρανοῦ എന്ന പുറപ്പെടുന്ന മേഖലയെയും ἀπὸ τοῦ θεοῦ എന്ന അന്തിമ ഉറവിടത്തെയും വേർതിരിച്ചു വ്യക്തമാക്കുന്നു.
- source_word: ἡτοιμασμένην
  choice: ഒരുക്കപ്പെട്ടിരുന്നു
  rationale: പൂർണ നിഷ്ക്രിയ കൃതന്തം സൂചിപ്പിക്കുന്ന, ഒരുക്കം പൂർത്തിയായ നില മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὡς νύμφην
  choice: ഒരു മണവാട്ടിയെപ്പോലെ
  rationale: ὡς ഇവിടെ ഉപമ അവതരിപ്പിക്കുന്നു; സഭയെക്കുറിച്ചുള്ള വ്യാഖ്യാനം ചേർക്കാതെ ഉപമയായി തന്നേ നിലനിർത്തുന്നു.
- source_word: κεκοσμημένην
  choice: അണിഞ്ഞൊരുങ്ങിയ
  rationale: വിവാഹസന്ദർഭത്തിലെ അലങ്കാരവും സജ്ജീകരണവും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῷ ἀνδρὶ αὐτῆς
  choice: തന്റെ ഭർത്താവിനുവേണ്ടി
  rationale: മണവാട്ടിയുടെ പശ്ചാത്തലത്തിൽ ἀνήρ എന്നതിന്റെ പ്രസക്തമായ അർഥം ‘ഭർത്താവ്’ ആണ്; δοτική ഇവിടെ പ്രയോജനാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘പുതിയ യെരൂശലേം’ ഔപചാരികമായ അന്ത്യകാലപദവിയായി കാണണമോ
  choice: വിവരണാത്മകമായ ‘പുതിയ യെരൂശലേം’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘പുതിയ യെരൂശലേം’ എന്നതിനെ പ്രത്യേക ഔപചാരിക ശീർഷകമായി അച്ചടിശൈലിയിൽ അടയാളപ്പെടുത്തുക
  rationale: ഗ്രീക്കിൽ καινήν, Ἰερουσαλήμനെ വിശേഷിപ്പിക്കുന്നു. മലയാളത്തിൽ വലിയക്ഷരഭേദമില്ലാത്തതിനാൽ ശീർഷകമാണോ വിവരണാത്മക പ്രയോഗമാണോ എന്നത് കൃത്രിമമായി തീർപ്പാക്കാതെ സാധാരണ പ്രയോഗം സ്വീകരിച്ചു.
- issue: മണവാട്ടിയുടെ ദൃശ്യം സഭയെ സൂചിപ്പിക്കുന്നതായി മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കണമോ
  choice: ഉപമയെ ഉപമയായിത്തന്നെ നിലനിർത്തി
  alternative: ‘സഭയായ മണവാട്ടി’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുക
  rationale: വാക്യം നഗരത്തെ മണവാട്ടിയോട് ഉപമിക്കുന്നു; സഭയെന്ന തിരിച്ചറിയൽ ഇവിടെ പരിഭാഷയിൽ ചേർക്കുന്നത് മൂലപാഠത്തിനതീതമായ വ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ‘അത്’ വിശുദ്ധനഗരമായ പുതിയ യെരൂശലേമിലേക്കാണ് തിരിച്ചുപോകുന്നത്. യഥാർഥ പാഠവ്യത്യാസമോ മലയാളത്തിൽ നിർബന്ധമായ വിശദീകരണമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
