  source_fidelity: The draft accurately retains the square ground plan (τετράγωνος), the equality of length and width, the angel's measuring action with a κάλαμος, the stated extent of twelve thousand stadia, and the equality of all three dimensions. No doctrinal interpretation has been introduced into the main text.
