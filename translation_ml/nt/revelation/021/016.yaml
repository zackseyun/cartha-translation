source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: ml
  text: 'നഗരം സമചതുരാകൃതിയിലാണ്; അതിന്റെ നീളം അതിന്റെ വീതിക്കു തുല്യമാണ്. അവൻ അളവുകോൽകൊണ്ട്[a] നഗരം അളന്നു: പന്ത്രണ്ടായിരം സ്റ്റേഡിയം[b]. അതിന്റെ നീളവും വീതിയും ഉയരവും തുല്യമാണ്[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാങ്ങണകൊണ്ട്.’ ഗ്രീക്ക് പദത്തിന് ‘ഞാങ്ങണ’ എന്ന് അർഥമാകാമെങ്കിലും ഇവിടെ അത് അളക്കാനുള്ള ഉപകരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: സ്റ്റേഡിയം ഒരു പുരാതന ദൂരയളവാണ്. ഉപയോഗിക്കുന്ന സ്റ്റേഡിയത്തിന്റെ നീളത്തെ ആശ്രയിച്ച്, പന്ത്രണ്ടായിരം സ്റ്റേഡിയം ഏകദേശം 2,220 കിലോമീറ്റർ (1,380 മൈൽ) വരും.
    reason: cultural_note
  - marker: c
    text: കൂടുതൽ വ്യാഖ്യാനപരമായി, ‘നഗരം ഒരു സമചതുരഘനമാണ്’ എന്നു പറയാം. എന്നാൽ ഗ്രീക്ക് പാഠം നേരിട്ട് പറയുന്നത് അതിന്റെ നീളവും വീതിയും ഉയരവും തുല്യമാണെന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: τετράγωνος
  choice: സമചതുരമായി
  rationale: നാലു വശങ്ങളുള്ള ചതുരാകൃതിയെ സൂചിപ്പിക്കുന്ന പദം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ വാസ്തുവിവരണമാണ്.
- source_word: κεῖται
  choice: സ്ഥിതിചെയ്യുന്നു
  rationale: നഗരത്തിന്റെ നിലയെയോ രൂപവിന്യാസത്തെയോ വിവരിക്കുന്ന κεῖμαι എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: അതിന്റെ നീളം വീതിക്കു തുല്യമാണ്
  rationale: ὅσον സൂചിപ്പിക്കുന്ന അളവിലെ തുല്യത വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐμέτρησεν
  choice: അവൻ ... അളന്നു
  rationale: സന്ദർഭത്തിൽ കർത്താവ് ദൂതനാണ്; ലളിതമായ ഭൂതകാല ആഖ്യാനം നിലനിർത്തുന്നു.
- source_word: τῷ καλάμῳ
  choice: അളവുകോൽകൊണ്ട്
  rationale: κάλαμος എന്നതിന് ഞാങ്ങണ എന്നും അർഥമുണ്ടെങ്കിലും ഇവിടെ അളക്കാനുള്ള ഉപകരണമാണ്; അതിന്റെ പ്രവർത്തനം ആധുനിക വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: പന്ത്രണ്ടായിരം സ്റ്റേഡിയം
  rationale: അളന്നപ്പോൾ ലഭിച്ച ദൂരം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പുരാതന അളവുമാനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: στάδιος
  choice: സ്റ്റേഡിയം
  rationale: പുരാതന ദൂരയളവിന്റെ സുതാര്യമായ ലിപ്യന്തരണം; അനിശ്ചിതമായ ആധുനിക പരിവർത്തനം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: അതിന്റെ നീളവും വീതിയും ഉയരവും തുല്യമാണ്
  rationale: മൂന്നു മാനങ്ങളും തുല്യമാണെന്ന ഗ്രീക്ക് പ്രസ്താവന അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുരാതന അളവുമാനം നിലനിർത്തണമോ ആധുനിക അളവിലേക്കു മാറ്റണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘പന്ത്രണ്ടായിരം സ്റ്റേഡിയം’ നിലനിർത്തുന്നു
  alternative: ഏകദേശം 2,220 കിലോമീറ്റർ
  rationale: ഗ്രീക്ക് പാഠം പുരാതന അളവുമാനമാണ് നൽകുന്നത്; കൃത്യമായ ആധുനിക തുല്യമൂല്യം സ്വീകരിക്കുന്ന സ്റ്റേഡിയത്തിന്റെ നീളത്തെ ആശ്രയിച്ച് വ്യത്യാസപ്പെടുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു.
- issue: മൂന്നു മാനങ്ങളുടെയും തുല്യത എത്രത്തോളം വ്യാഖ്യാനിച്ച് പറയണം
  choice: നീളവും വീതിയും ഉയരവും തുല്യമാണെന്ന് നേരിട്ട് പറയുന്നു
  alternative: നഗരം ഒരു പൂർണ ഘനരൂപമാണ്
  rationale: ഘനരൂപം എന്നത് വാചകത്തിന്റെ ന്യായമായ ജ്യാമിതീയ നിഗമനമാണെങ്കിലും ഗ്രീക്ക് പാഠം നേരിട്ട് പറയുന്നത് മൂന്നു മാനങ്ങളുടെയും തുല്യതയാണ്; അതിനാൽ വ്യാഖ്യാനസംഗ്രഹം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സമചതുരമായി’ എന്നത് ദ്വിമാന രൂപവിന്യാസം വ്യക്തമാക്കുന്നു; അവസാന വാക്യം മൂന്നു മാനങ്ങളുടെയും തുല്യത പ്രത്യേകം നിലനിർത്തുന്നു. സാങ്കേതികമായ പുരാതന അളവുമാനം ലിപ്യന്തരിച്ചു, വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
