id: REV.21.7
reference: Revelation 21:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: ml
  text: ജയിക്കുന്നവൻ ഇവയെ അവകാശമായി പ്രാപിക്കും[a]. ഞാൻ അവന്റെ ദൈവമായിരിക്കും; അവൻ എന്റെ മകനായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിജയം നേടുന്നവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. വെളിപ്പാട് പുസ്തകത്തിൽ νικάω എന്ന ഗ്രീക്ക് ക്രിയ വിശ്വസ്തതയോടെ ജയിച്ചുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കാൻ ആവർത്തിച്ചു വരുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: ‘അവൻ എന്റെ മകനായിരിക്കും.’ ഇവിടെ പുരുഷലിംഗപദം പ്രതിനിധാനപരമായ വ്യാപ്തിയുള്ളതാകാം; എങ്കിലും പരിഭാഷ മൂലപാഠത്തിലെ പുത്രത്വഭാഷ നിലനിർത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: ജയിക്കുന്നവൻ
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃദന്തം നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു; തുടർച്ചയായി ജയിച്ചുനിൽക്കുന്നവനെ സൂചിപ്പിക്കുന്നു. ‘ജയിക്കുന്നവൻ’ വെളിപ്പാടിലെ ആവർത്തിതമായ νικάω പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κληρονομήσει
  choice: അവകാശമായി പ്രാപിക്കും
  rationale: κληρονομέω എന്ന പദത്തിലെ അവകാശം/പൈതൃകം ലഭിക്കുന്നതിന്റെ കുടുംബപരവും ഉടമ്പടിപരവുമായ ഭാവം വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള പിതാവ്–മകൻ ഭാഷയോടും യോജിക്കുന്നു.
- source_word: ταῦτα
  choice: ഇവയെ
  rationale: ബഹുവചന നിർദേശസർവനാമത്തിന്റെ രൂപം സംരക്ഷിക്കുകയും മുൻവിവരണത്തിലെ കാര്യങ്ങളിലേക്കു സ്വാഭാവികമായി ചൂണ്ടിക്കാണിക്കുകയും ചെയ്യുന്നു.
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: ഞാൻ അവന്റെ ദൈവമായിരിക്കും
  rationale: ദത്തിവിന്റെ ബന്ധപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും തിരുവെഴുത്തിലെ ഉടമ്പടിസൂത്രത്തിന്റെ ഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: അവൻ എന്റെ മകനായിരിക്കും
  rationale: മൂലത്തിലെ വ്യക്തിപരമായ പുത്രബന്ധവും അവകാശഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: υἱός
  choice: മകൻ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ഏകവചനവും പുത്രത്വ–അവകാശ ദൃശ്യവും നിലനിർത്തുന്നു; പൊതുവായ പ്രതിനിധാനപ്രയോഗമായിരിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ജയിക്കുന്നവനോടുള്ള പൊതുവായ വാഗ്ദാനത്തിലെ ലിംഗസൂചക പുത്രഭാഷ
  choice: പ്രധാനപാഠത്തിൽ ‘മകൻ’ നിലനിർത്തുക
  alternative: കുഞ്ഞ് / സന്താനം
  rationale: υἱός വ്യക്തമായി ‘മകൻ’ എന്നാണ്; ഇവിടെ അത് പ്രതിനിധാനപരമായ വ്യാപ്തിയുള്ളതാകാമെങ്കിലും പുത്രത്വത്തിന്റെയും അവകാശത്തിന്റെയും ദൃശ്യത്തെ ലിംഗനിരപേക്ഷമാക്കി മങ്ങിക്കരുത്.
- issue: ഉടമ്പടിസൂത്രത്തിന്റെ പ്രതിധ്വനി
  choice: ‘ഞാൻ അവന്റെ ദൈവമായിരിക്കും; അവൻ എന്റെ മകനായിരിക്കും’ എന്ന ബന്ധപരമായ രൂപം
  alternative: ‘ഞാൻ അവന് ദൈവമായിരിക്കും; അവൻ എനിക്ക് മകനായിരിക്കും’
  rationale: മൂലത്തിലെ ദത്തിവ് ഘടനയുടെ ബന്ധപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിന്റെ സമാന്തര ഘടനയും ഉടമ്പടി–പുത്രത്വ ദൃശ്യവും സംരക്ഷിച്ചിരിക്കുന്നു; ആവർത്തിത νικάω പദസംബന്ധം ‘ജയിക്കുന്നവൻ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
