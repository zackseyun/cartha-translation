source:
  edition: SBLGNT
  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: ml
  text: വലുതും ഉയരമുള്ളതുമായ ഒരു മതിലും പന്ത്രണ്ട് കവാടങ്ങളും അതിനുണ്ടായിരുന്നു; കവാടങ്ങളിൽ പന്ത്രണ്ട് ദൂതന്മാരും ഉണ്ടായിരുന്നു; അവയിൽ പേരുകൾ എഴുതപ്പെട്ടിരുന്നു; അവ ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ പന്ത്രണ്ട് ഗോത്രങ്ങളുടേതായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, പരമ്പരാഗതമായി: “ഇസ്രായേൽമക്കളുടെ പന്ത്രണ്ട് ഗോത്രങ്ങളുടേത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσα
  choice: ഉണ്ടായിരുന്നു
  rationale: മുൻവാക്യത്തിലെ നഗരത്തെ വിശേഷിപ്പിക്കുന്ന വർത്തമാനകാല കൃുദന്തരൂപമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ വിവരണപ്രവാഹത്തിനായി പരിമിത ക്രിയാരൂപമാക്കി.
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: വലുതും ഉയരമുള്ളതുമായ ഒരു മതിൽ
  rationale: μέγα, ὑψηλόν എന്നീ രണ്ടു വിശേഷണങ്ങളുടെയും വ്യത്യസ്ത അർഥം നിലനിർത്തുന്നു.
- source_word: πυλῶνας δώδεκα
  choice: പന്ത്രണ്ട് കവാടങ്ങൾ
  rationale: നഗരപ്രവേശനങ്ങളെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘കവാടങ്ങൾ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണ്.
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: ആ കവാടങ്ങളിൽ
  rationale: ἐπί + dative ഇവിടെ സ്ഥാനസൂചകമാണ്. ദൂതന്മാർ കവാടങ്ങളുടെ മുകളിൽ നിന്നുവെന്ന അനാവശ്യ ധാരണ ഒഴിവാക്കി, കവാടങ്ങളോടു ബന്ധപ്പെട്ട സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀγγέλους δώδεκα
  choice: പന്ത്രണ്ട് ദൂതന്മാർ
  rationale: ἀγγέλους എന്നതിന്റെ ഈ ദർശനസന്ദർഭത്തിലെ പതിവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: പേരുകൾ കൊത്തിയിരുന്നു
  rationale: ἐπιγεγραμμένα ഉപരിതലത്തിൽ എഴുതിയതോ ആലേഖനം ചെയ്തതോ എന്ന ആശയം നൽകുന്നു; സ്മാരകശില്പസന്ദർഭത്തിൽ ‘കൊത്തിയിരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: ἅ ἐστιν
  choice: അവ ... പേരുകളായിരുന്നു
  rationale: ബന്ധവാക്യം ഏതു പേരുകളാണെന്ന് തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ പരാമർശം വ്യക്തമായി ആവർത്തിക്കുന്നത് സ്വാഭാവികത നൽകുന്നു.
- source_word: φυλῶν
  choice: ഗോത്രങ്ങളുടെ
  rationale: ഇസ്രായേലിന്റെ പരമ്പരാഗത ഗോത്രവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ മലയാളപദം.
- source_word: υἱῶν Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ
  rationale: ഗ്രീക്കിലെ υἱῶν എന്ന പുരുഷലിംഗ കുടുംബപദം മുഖ്യവാചകത്തിൽ കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: υἱῶν Ἰσραήλ എന്ന സമൂഹനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേൽമക്കൾ
  rationale: മൂലപാഠം വ്യക്തമായി ‘പുത്രന്മാർ’ എന്നു പറയുന്നു; അതിനാൽ മുഖ്യവാചകത്തിൽ ആ രൂപം സംരക്ഷിച്ചു. മലയാളത്തിലെ പരിചിതമായ സമൂഹനാമം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള ἔχουσα മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ചെറുവാക്യങ്ങളാക്കി; നഗരത്തിന്റെ മതിൽ, കവാടങ്ങൾ, ദൂതന്മാർ, ആലേഖിത പേരുകൾ എന്നീ ദൃശ്യഘടകങ്ങൾ വ്യക്തമായി നിലനിർത്തി.
