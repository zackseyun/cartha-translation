  to: അശുദ്ധമായ യാതൊന്നും അതിൽ ഒരിക്കലും പ്രവേശിക്കുകയില്ല[a]; അറപ്പുളവാക്കുന്നതും അസത്യവും ചെയ്യുന്ന ആരും പ്രവേശിക്കുകയില്ല[b]. എന്നാൽ കുഞ്ഞാടിന്റെ ജീവപുസ്തകത്തിൽ എഴുതപ്പെട്ടവർ മാത്രമേ അതിൽ പ്രവേശിക്കുകയുള്ളൂ.
