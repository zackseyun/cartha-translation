id: REV.21.27
reference: Revelation 21:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: ml
  text: അശുദ്ധമായ യാതൊന്നും അതിൽ ഒരിക്കലും പ്രവേശിക്കുകയില്ല[a]; അറപ്പുളവാക്കുന്നതും അസത്യവും ചെയ്യുന്ന ആരും പ്രവേശിക്കുകയില്ല[b]. എന്നാൽ കുഞ്ഞാടിന്റെ ജീവപുസ്തകത്തിൽ എഴുതപ്പെട്ടവർ മാത്രമേ അതിൽ പ്രവേശിക്കുകയുള്ളൂ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശുദ്ധമായ’ എന്നതിന് ‘അപവിത്രമായ’ എന്നോ ‘മലിനമായ’ എന്നോ പരിഭാഷപ്പെടുത്താം (πᾶν κοινόν).
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘അറപ്പുളവാക്കുന്നതും അസത്യവും ചെയ്യുന്നവൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: ഒരിക്കലും പ്രവേശിക്കുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധവും ഭാവിയിലെ സമ്പൂർണ വിലക്കും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πᾶν κοινὸν
  choice: അശുദ്ധമായ യാതൊന്നും
  rationale: നപുംസക ഏകവചനമായ πᾶν ഇവിടെ ‘യാതൊന്നും’ എന്ന സമഗ്ര അർഥം നൽകുന്നു; യഹൂദ ശുദ്ധി-അശുദ്ധി പശ്ചാത്തലത്തിലെ κοινός എന്ന പദത്തിന്റെ ആചാരപരവും ധാർമികവുമായ ഭാരം ‘അശുദ്ധം’ നിലനിർത്തുന്നു.
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: അറപ്പുളവാക്കുന്നതോ വ്യാജമായതോ ചെയ്യുന്ന ആരും
  rationale: കർത്തൃപ്രയോഗത്തിലുള്ള participle വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. βδέλυγμα എന്നതിന്റെ ശക്തമായ ധാർമിക-ആരാധനാപര വെറുപ്പ് ‘അറപ്പുളവാക്കുന്നത്’ എന്നും ψεῦδος ‘വ്യാജമായത്’ എന്നും വായനാസൗകര്യത്തോടെ നൽകുന്നു; ‘ചെയ്യുക’ രണ്ടിനെയും നിയന്ത്രിക്കുന്ന ഗ്രീക്ക് ഘടന അടിക്കുറിപ്പിൽ തുറന്നുകാട്ടുന്നു.
- source_word: εἰ μὴ οἱ γεγραμμένοι
  choice: എഴുതപ്പെട്ടവർ മാത്രമേ
  rationale: εἰ μή സൂചിപ്പിക്കുന്ന ഏക അപവാദം ‘മാത്രമേ’ വ്യക്തമാക്കുന്നു; perfect passive ആയ γεγραμμένοι രേഖപ്പെടുത്തപ്പെട്ട നിലയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘എഴുതപ്പെട്ടവർ’ എന്നു നൽകി, മൂലത്തിൽ ഇല്ലാത്ത ‘പേരുകൾ’ ചേർത്തിട്ടില്ല.
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου
  choice: കുഞ്ഞാടിന്റെ ജീവപുസ്തകത്തിൽ
  rationale: അപ്പോക്കലിപ്റ്റിക് സന്ദർഭത്തിലെ സ്ഥാപിതമായ ‘ജീവപുസ്തകം’ എന്ന പ്രയോഗവും ἀρνίον എന്ന ക്രിസ്തുസംബന്ധിയായ മുഖ്യരൂപകത്തിന് ‘കുഞ്ഞാട്’ എന്ന പദവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുതിയ യെരൂശലേമിൽ പ്രവേശിക്കുന്നതിൽനിന്നുള്ള വിലക്കിന്റെ വ്യാപ്തി
  choice: അശുദ്ധമായ യാതൊന്നിനെയും അറപ്പുളവാക്കുന്നതോ വ്യാജമായതോ ചെയ്യുന്ന ഏതു വ്യക്തിയെയും വേർതിരിച്ചുകാട്ടി വിലക്കുന്നു.
  alternative: ആദ്യ വിലക്ക് വ്യക്തികളെയല്ല, അശുദ്ധ വസ്തുക്കളെ മാത്രം സൂചിപ്പിക്കുന്നു എന്നു പരിമിതപ്പെടുത്തുക.
  rationale: ഗ്രീക്കിലെ നപുംസകമായ πᾶν κοινόν എന്നതും വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ποιῶν എന്ന participle-ഉം രണ്ടുതലങ്ങളും നിലനിർത്തുന്നു; അവയെ ഒന്നായി ലയിപ്പിക്കുന്നില്ല.
- issue: ‘എഴുതപ്പെട്ടവർ’ എന്നതിന്റെ ഉള്ളടക്കം
  choice: മൂലപാഠത്തോട് ചേർന്ന് ‘എഴുതപ്പെട്ടവർ’ എന്നു മാത്രം നൽകുന്നു.
  alternative: ‘പേരുകൾ എഴുതപ്പെട്ടവർ’ എന്നു വ്യക്തമാക്കുക.
  rationale: പുസ്തകത്തിന്റെ രൂപകം പേരുകളെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും ഈ വാക്യത്തിൽ ‘പേരുകൾ’ എന്നു വ്യക്തമായി ഇല്ല; അതിനാൽ സമാന്തരവാക്യങ്ങളിലെ ഭാഷ ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ശക്തമായ നിഷേധം, നഗരത്തെ സൂചിപ്പിക്കുന്ന ‘അതിൽ’, കുഞ്ഞാട് എന്ന യോഹന്നാനീയ രൂപകം എന്നിവ വ്യക്തമായി നിലനിർത്തി. ദീർഘമായ ഗ്രീക്ക് വാക്യം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; അവസാന വാക്യത്തിൽ ‘അതിൽ’ ആവർത്തിച്ചത് ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കാനാണ്.
