id: REV.21.15
reference: Revelation 21:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: ml
  text: എന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്നവന്റെ പക്കൽ നഗരത്തെയും അതിന്റെ കവാടങ്ങളെയും അതിന്റെ മതിലിനെയും അളക്കുന്നതിനായി സ്വർണക്കൊണ്ടുള്ള ഒരു അളവുകോൽ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അളക്കുന്നതിനുള്ള ഒരു സ്വർണ ഞാങ്ങണ.’ κάλαμος എന്ന ഗ്രീക്ക് പദത്തിന്റെ അക്ഷരാർഥം ‘ഞാങ്ങണ’ എന്നാണ്; ഇവിടെ അത് അളക്കാൻ ഉപയോഗിക്കുന്ന കോലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: എന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്നവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ തുടർച്ചയായ വിവരണഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘ദൂതൻ’ എന്ന തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
- source_word: εἶχεν
  choice: പക്കൽ ... ഉണ്ടായിരുന്നു
  rationale: ἔχω എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം ഇവിടെ കൈവശമുണ്ടായിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പിടിച്ചിരുന്നു’ എന്നു പറഞ്ഞ് കൈയിൽ പിടിച്ചിരുന്നുവെന്ന ആശയം അധികമായി ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: സ്വർണത്തിലുള്ള ഒരു അളവുകോൽ
  rationale: μέτρον-κάλαμος സംയുക്തം അളക്കാനുള്ള ഉപകരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. κάλαμος അക്ഷരാർഥത്തിൽ ‘ഞാങ്ങണ’ ആണെങ്കിലും, ഉപകരണത്തിന്റെ പ്രവർത്തനം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കാൻ ‘അളവുകോൽ’ ഉപയോഗിക്കുന്നു; വസ്തു സ്വർണമാണെന്ന χρυσοῦν എന്ന വിശേഷണം നിലനിർത്തുന്നു.
- source_word: ἵνα μετρήσῃ
  choice: അളക്കുന്നതിനായി
  rationale: ἵναയും വിധിലിംഗ ക്രിയയും ചേർന്നുള്ള ഉദ്ദേശ്യാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὴν πόλιν
  choice: നഗരം
  rationale: πόλις എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘പുതിയ യെരൂശലേം’ എന്ന സന്ദർഭപരമായ തിരിച്ചറിയൽ വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τοὺς πυλῶνας αὐτῆς
  choice: അതിന്റെ കവാടങ്ങൾ
  rationale: πυλών വലിയ കവാടത്തെയോ പ്രവേശനകവാടത്തെയോ സൂചിപ്പിക്കാം. നഗരവാസ്തുവിന്റെ സന്ദർഭത്തിൽ ‘കവാടങ്ങൾ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: τὸ τεῖχος αὐτῆς
  choice: മതിൽ
  rationale: τεῖχος നഗരത്തെ ചുറ്റിയുള്ള മതിലിനെ സൂചിപ്പിക്കുന്നു. അധിക വ്യാഖ്യാനം ചേർക്കാതെ ‘മതിൽ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: സംസാരിക്കുന്നവനെ ‘ദൂതൻ’ എന്ന് വ്യക്തമായി തിരിച്ചറിയണമോ
  choice: ‘എന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്നവൻ’ എന്ന മൂലപാഠത്തിലെ വിവരണം നിലനിർത്തുന്നു.
  alternative: ‘എന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്ന ദൂതൻ’
  rationale: വിശാലസന്ദർഭത്തിൽ ആ വ്യക്തി ദൂതന്മാരിൽ ഒരാളാണെങ്കിലും, ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠത്തിൽ ἄγγελος ഇല്ല. അതിനാൽ പാഠത്തിൽ വ്യക്തമല്ലാത്ത തിരിച്ചറിയൽ വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പക്കൽ ... ഉണ്ടായിരുന്നു’ എന്ന ഘടന εἶχεν എന്നതിന്റെ കൈവശാർഥം സ്വാഭാവികമായി നൽകുന്നു. ‘സ്വർണത്തിലുള്ള’ എന്ന പ്രയോഗം ഉപകരണം സ്വർണനിർമിതമാണെന്ന അർഥം വ്യക്തമാക്കുന്നു. എല്ലാ ബന്ധകങ്ങളും ചേർത്ത് നഗരം, കവാടങ്ങൾ, മതിൽ എന്നീ മൂന്ന് അളക്കപ്പെടുന്ന ഘടകങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
