  to: എന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്നവന്റെ പക്കൽ നഗരത്തെയും അതിന്റെ കവാടങ്ങളെയും അതിന്റെ മതിലിനെയും അളക്കുന്നതിനായി സ്വർണക്കൊണ്ടുള്ള ഒരു അളവുകോൽ ഉണ്ടായിരുന്നു.[a]
