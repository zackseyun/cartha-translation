id: REV.21.5
reference: Revelation 21:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: ml
  text: 'സിംഹാസനത്തിൽ ഇരിക്കുന്നവൻ പറഞ്ഞു: “ഇതാ, ഞാൻ സകലവും പുതുതാക്കുന്നു[a].” പിന്നെ അവൻ പറഞ്ഞു: “എഴുതുക; ഈ വചനങ്ങൾ വിശ്വസനീയവും[b] സത്യവുമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞാൻ സകലവും പുതിയതാക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ വർത്തമാനകാലരൂപം തുടരുന്ന പ്രവർത്തനമായോ പൊതുവായ പ്രഖ്യാപനമായോ മനസ്സിലാക്കാം; പുതുക്കൽ മാറ്റിസ്ഥാപിക്കലാണോ രൂപാന്തരമാണോ എന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_and_theological_ambiguity
  - marker: b
    text: “വിശ്വസ്തവും” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ അർഥം ഈ വചനങ്ങൾ ആശ്രയിക്കാവുന്നവയാണ് എന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ വിവരണാത്മക സ്വഭാവവും സിംഹാസനദൃശ്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള ഉദ്‌ഘോഷത്തിന്റെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: καινὰ ποιῶ πάντα
  choice: ഞാൻ സകലവും പുതുതാക്കുന്നു
  rationale: ποιῶ എന്ന വർത്തമാനകാലരൂപത്തെയും πάντα എന്ന സമഗ്രവ്യാപ്തിയെയും നിലനിർത്തുന്നു; സൃഷ്ടിക്കുന്നു എന്നു വിവർത്തനം ചെയ്ത് മൂലത്തിൽ ഇല്ലാത്ത κτίζω-സദൃശ ആശയം ചേർക്കുന്നില്ല.
- source_word: Γράψον
  choice: എഴുതുക
  rationale: മൂലപാഠത്തിൽ വ്യക്തമാക്കാത്ത കർമം കൂട്ടിച്ചേർക്കാതെ നേരിട്ടുള്ള ആജ്ഞാരൂപം സംരക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: ;
  rationale: മലയാളത്തിൽ അർദ്ധവിരാമത്തിലൂടെ ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ഉറപ്പിന്റെ കാരണം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ‘എന്തെന്നാൽ’ എന്ന ഭാരമുള്ള ബന്ധകത്തിന്റെ ആവശ്യം ഒഴിവാക്കുന്നു.
- source_word: οὗτοι οἱ λόγοι
  choice: ഈ വചനങ്ങൾ
  rationale: വെളിപ്പെടുത്തപ്പെട്ട ഉച്ചാരണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വചനങ്ങൾ’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പ്രയോഗമാണ്.
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: വിശ്വസനീയവും സത്യവുമാണ്
  rationale: വചനങ്ങളെ ആശ്രയിക്കാമെന്ന അർഥവും അവയുടെ സത്യസ്വഭാവവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: καινὰ ποιῶ πάντα എന്നതിലെ അന്ത്യകാല പുതുക്കലിന്റെ വ്യാപ്തിയും സ്വഭാവവും
  choice: ഞാൻ സകലവും പുതുതാക്കുന്നു
  alternative: ഞാൻ എല്ലാം പുതുതാക്കുന്നു / ഞാൻ സകലവും പുതിയതാക്കുന്നു
  rationale: സകലത്തെയും മാറ്റിസ്ഥാപിക്കുകയാണോ രൂപാന്തരപ്പെടുത്തി പുതുക്കുകയാണോ എന്ന് തീർപ്പാക്കാതെ, മൂലഗ്രീക്കിലെ സമഗ്രവ്യാപ്തിയും ദൈവിക പ്രവർത്തനത്തിന്റെ വർത്തമാനപ്രഖ്യാപനവും നിലനിർത്തുന്നു.
- issue: ദൈവിക പ്രഭാഷകനെ അവതരിപ്പിക്കുന്ന വിധം
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്നവൻ
  alternative: സിംഹാസനസ്ഥൻ
  rationale: പ്രഭാഷകനെ പാഠത്തിൽ കാണുന്ന സിംഹാസനചിത്രത്തിലൂടെ മാത്രം തിരിച്ചറിയിക്കുന്നു; അധിക ദൈവശാസ്ത്രപരമായ നിർവചനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; വെളിപ്പാടുസാഹിത്യത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദക്രമം. ‘ഇതാ’, ‘വചനങ്ങൾ’ എന്നീ അല്പം ഉയർന്നെങ്കിലും വ്യാപകമായി മനസ്സിലാകുന്ന രൂപങ്ങൾ സന്ദർഭോചിതമായി ഉപയോഗിച്ചു.
