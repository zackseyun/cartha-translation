source:
  edition: SBLGNT
  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: ml
  text: 'അവൻ അതിന്റെ മതിൽ അളന്നു: മനുഷ്യന്റെ അളവുപ്രകാരം 144 മുഴം; അതുതന്നെയാണ് ദൂതന്റെയും അളവ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു മനുഷ്യന്റെ അളവുപ്രകാരം—അതായത്, ഒരു ദൂതന്റെ അളവുപ്രകാരം.’ ദൂതൻ മനുഷ്യർ ഉപയോഗിക്കുന്ന അളവേകകം ഉപയോഗിച്ചു എന്നോ, ഇവിടെ മനുഷ്യന്റെയും ദൂതന്റെയും അളവ് ഒത്തുവരുന്നു എന്നോ ഗ്രീക്ക് പ്രയോഗം ഊന്നിപ്പറയാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: അളന്നു
  rationale: μετρέω എന്ന ക്രിയയുടെ aorist active indicative രൂപം; അളക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: τεῖχος
  choice: മതിൽ
  rationale: നഗരത്തിന്റെ പ്രതിരോധമതിലിനെയാണ് τεῖχος സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ ‘മതിൽ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: αὐτῆς
  choice: അതിന്റെ
  rationale: സർവനാമം നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അനാവശ്യമായ വ്യക്തിവൽക്കരണം ഒഴിവാക്കി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 144 മുഴം
  rationale: അളവ് പുരാതന ഏകകമായ πῆχυς-ലാണ് നൽകിയിരിക്കുന്നത്; അതിനെ പരിവർത്തനം ചെയ്യാതെ പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ ‘മുഴം’ എന്നു നിലനിർത്തുന്നു.
- source_word: μέτρον ἀνθρώπου
  choice: മനുഷ്യന്റെ അളവുപ്രകാരം
  rationale: ἀνθρώπου പൊതുവായ മനുഷ്യസൂചനയാണ്; ‘മനുഷ്യന്റെ’ എന്നത് ലിംഗവിശേഷം ചുമത്താതെ അളവിന്റെ മാനദണ്ഡം വ്യക്തമാക്കുന്നു.
- source_word: ὅ ἐστιν ἀγγέλου
  choice: അതുതന്നെയാണ് ദൂതന്റെയും അളവ്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ പ്രയോഗം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതാക്കാൻ ‘അളവ്’ ആവർത്തിക്കുന്നു; ‘അതുതന്നെ’ മനുഷ്യന്റെയും ദൂതന്റെയും അളവ് ഇവിടെ ഒത്തുവരുന്ന ആശയം നൽകുന്നു, എന്നാൽ എല്ലാ വ്യാഖ്യാനസാധ്യതയും മുഖ്യവാചകത്തിൽ തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου എന്നതിന്റെ വ്യാഖ്യാനം
  choice: 144 മുഴം മനുഷ്യന്റെ അളവുപ്രകാരമാണ്; അതുതന്നെ ദൂതന്റെയും അളവാണെന്ന് മുഖ്യവാചകം സൂചിപ്പിക്കുന്നു.
  alternative: ‘ഒരു മനുഷ്യന്റെ അളവുപ്രകാരം—അതായത്, ദൂതന്റെ അളവുപ്രകാരം’ എന്നും, ദൂതൻ മനുഷ്യർ ഉപയോഗിക്കുന്ന അളവേകകം ഉപയോഗിച്ചു എന്നും ഗ്രഹിക്കാം.
  rationale: ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും വ്യാഖ്യാനസാധ്യതയുള്ളതുമാണ്. മുഖ്യവാചകം സ്വാഭാവികമായ സമാനതാബോധം നൽകുന്നു; അടിക്കുറിപ്പ് മറ്റുസാധ്യതകൾ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പുരാതന അളവേകകമായ ‘മുഴം’ നിലനിർത്തി. ഗ്രീക്കിലെ സംക്ഷിപ്തത മൂലമുള്ള വ്യാഖ്യാനഭേദം [a] എന്ന അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
