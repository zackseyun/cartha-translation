  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: ml
  text: 'അവൻ എന്നോടു പറയുന്നു: “ഈ പുസ്തകത്തിലെ പ്രവചനത്തിന്റെ വചനങ്ങൾ മുദ്രയിടരുത്[a][c]; കാരണം സമയം[b] അടുത്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മുദ്രവെക്കരുത്” അല്ലെങ്കിൽ “രഹസ്യമാക്കി വെക്കരുത്.” ഒരു വെളിപ്പാട് അടച്ചുവെക്കണോ തുറന്നുവെക്കണോ എന്നതിനെക്കുറിച്ചുള്ള പ്രവാചകഭാഷയാണ് ഈ പ്രയോഗം ഓർമിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിശ്ചിത സമയം അടുത്തിരിക്കുന്നു.” ഗ്രീക്കിലെ καιρός നിർണായകമോ നിശ്ചയിക്കപ്പെട്ടതോ ആയ സമയത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ദാനീയേൽ 12:4 താരതമ്യം ചെയ്യുക. അവിടെ പ്രവചനം മുദ്രവെക്കാൻ കല്പിക്കുന്നു; ഇവിടെ അതിന് വിപരീതമായ കല്പനയാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει μοι
  choice: അവൻ എന്നോടു പറയുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ആഖ്യാനരൂപം നിലനിർത്തി ദൃശ്യത്തിന്റെ സജീവത പകരുന്നു; ആധുനിക മലയാളത്തിലും ഇത് സ്വാഭാവികമാണ്.
- source_word: Μὴ σφραγίσῃς
  choice: മുദ്രയിട്ട് അടച്ചുവെക്കരുത്
  rationale: σφραγίζω എന്നതിലെ ‘മുദ്രവെക്കുക’ എന്ന നേരിട്ടുള്ള അർഥവും ഈ പ്രവചനസന്ദർഭത്തിലെ ‘വെളിപ്പെടുത്താതെ അടച്ചുവെക്കുക’ എന്ന ആശയവും ഒരുമിച്ച് പകരുന്നു.
- source_word: τοὺς λόγους
  choice: വചനങ്ങൾ
  rationale: λόγοι എന്ന ബഹുവചനത്തിന്റെ മൂർത്തരൂപം സംരക്ഷിക്കുന്നു; ‘സന്ദേശം’ എന്നു ഏകവചനമാക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: ഈ പുസ്തകത്തിലെ പ്രവചനത്തിന്റെ
  rationale: ഇരട്ട ജനിറ്റീവ് ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; βιβλίον എന്നതിന് ആധുനിക വായനക്കാർക്കു സ്വാഭാവികമായ ‘പുസ്തകം’ ഉപയോഗിക്കുന്നു.
- source_word: ὁ καιρὸς
  choice: സമയം
  rationale: καιρός നിർണായകമോ നിശ്ചിതമോ ആയ സമയത്തെ സൂചിപ്പിക്കാമെങ്കിലും മുഖ്യപാഠത്തിൽ കൂടുതൽ വ്യാഖ്യാനം ചേർക്കാതെ വിശാലമായ ‘സമയം’ നിലനിർത്തുന്നു.
- source_word: ἐγγύς ἐστιν
  choice: അടുത്തിരിക്കുന്നു
  rationale: സമീപതയെ വ്യക്തമായ സമകാലിക മലയാളത്തിൽ പകരുകയും വാക്യത്തിന്റെ അടിയന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അപ്പോക്കലിപ്റ്റിക് സന്ദർഭത്തിലെ സമീപകാലഭാഷ
  choice: കാരണം സമയം അടുത്തിരിക്കുന്നു
  alternative: കാരണം നിശ്ചിത സമയം അടുത്തിരിക്കുന്നു
  rationale: വാക്യം സമയത്തിന്റെ സമീപത ഉറപ്പിക്കുന്നുവെങ്കിലും വിശദമായ അന്ത്യകാലക്രമം നിർദേശിക്കുന്നില്ല. അതിനാൽ അവകാശവാദത്തിന്റെ സംഘർഷം മയപ്പെടുത്താതെയും അതിനെ വിശദീകരിച്ച് തീർക്കാതെയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വചനങ്ങൾ’, ‘പ്രവചനം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
