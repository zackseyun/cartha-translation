id: REV.22.1
reference: Revelation 22:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: ml
  text: പിന്നെ അവൻ എനിക്ക് സ്ഫടികംപോലെ തിളങ്ങുന്ന ജീവന്റെ ജലത്തിന്റെ ഒരു നദി കാണിച്ചുതന്നു; അത് ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും സിംഹാസനത്തിൽനിന്ന് ഒഴുകിവരുന്നതായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: എനിക്കു കാണിച്ചുതന്നു
  rationale: ദർശനസന്ദർഭത്തിലെ ലളിതമായ പരോക്ഷകർമവും ‘കാണിക്കുക’ എന്ന സാധാരണ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘വെളിപ്പെടുത്തി’ എന്ന വ്യാഖ്യാനഭാരം ചേർക്കുന്നില്ല.
- source_word: ποταμὸν ὕδατος ζωῆς
  choice: ജീവന്റെ ജലം നിറഞ്ഞ ഒരു നദി
  rationale: ποταμός എന്നത് ‘നദി’യായി വിവർത്തനം ചെയ്യുകയും ὕδατος ζωῆς എന്ന ബന്ധത്തെ ‘ജീവന്റെ ജലം’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘നിറഞ്ഞ’ ചേർത്തിട്ടുണ്ടെങ്കിലും ജലം ജീവൻ നൽകുന്നതാണെന്ന വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: λαμπρὸν
  choice: തിളക്കമുള്ള
  rationale: ഈ പദത്തിന്റെ പ്രാഥമികമായ പ്രകാശമോ ശോഭയോ സൂചിപ്പിക്കുന്നു; സ്ഫടികത്തോടുള്ള ഉപമയുടെ സ്വാധീനത്തിൽ ‘സുതാര്യമായ’ എന്നു മാറ്റുന്നില്ല.
- source_word: ὡς κρύσταλλον
  choice: സ്ഫടികംപോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ നേരിട്ട് നിലനിർത്തുന്നു; κρύσταλλον എന്നതിന് ആധുനിക നിലവാരമലയാളത്തിൽ പരിചിതവും മാന്യവുമായ പദമാണ് ‘സ്ഫടികം’.
- source_word: ἐκπορευόμενον
  choice: ഒഴുകിവരുകയായിരുന്നു
  rationale: നദിയുടെ ചലനത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗം; വർത്തമാന പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവാഹം പ്രകടമാക്കുന്നു.
- source_word: ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും സിംഹാസനത്തിൽനിന്ന്
  rationale: സിംഹാസനം ഏകവചനത്തിൽ നിലനിർത്തുകയും ദൈവത്തെയും കുഞ്ഞാടിനെയും ബന്ധിപ്പിക്കുന്ന രണ്ടു സമാന്തര ജനിറ്റീവുകളും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവത്തിനും കുഞ്ഞാടിനും സംബന്ധിച്ച ഏക സിംഹാസനത്തിന്റെ ദൃശ്യം
  choice: ‘ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും സിംഹാസനം’ എന്ന ഏകവചനഘടന നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും സിംഹാസനങ്ങളിൽനിന്ന്’ അല്ലെങ്കിൽ ‘ഇരുവരും പങ്കിടുന്ന സിംഹാസനത്തിൽനിന്ന്’.
  rationale: ഗ്രീക്കിൽ ‘സിംഹാസനം’ ഏകവചനവും അതിനെ ആശ്രയിക്കുന്ന രണ്ടു ഏകോപിത ജനിറ്റീവുകളും ഉണ്ട്. വിവർത്തനം ഈ ദൈവശാസ്ത്രപരമായ ശക്തിയും സാധ്യതയുള്ള സംഘർഷവും വിശദീകരിച്ചുതീർക്കാതെ അതേപടി സംരക്ഷിക്കുന്നു.
- issue: ജീവന്റെ ജലത്തിന്റെ സ്വഭാവം
  choice: ‘ജീവന്റെ ജലം’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘ജീവൻ നൽകുന്ന ജലം’ അല്ലെങ്കിൽ ‘ജീവജലം’.
  rationale: ‘ജീവൻ നൽകുന്ന’ എന്നത് ജനിറ്റീവിന്റെ പ്രവർത്തനത്തെ വ്യാഖ്യാനിച്ച് തീർക്കും; ‘ജീവജലം’ എന്നത് ‘ഒഴുകുന്ന വെള്ളം’ എന്ന മറ്റൊരു അർഥവും ഉണർത്താം. അതിനാൽ മൂലത്തിലെ രൂപകബന്ധം കൂടുതൽ തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വെളിപ്പാട് ഗ്രന്ഥത്തിന്റെ ദർശനാത്മക ഗൗരവം നിലനിർത്തുന്ന ഭാഷ. ദീർഘമായ ഗ്രീക്ക് വാക്യം വ്യക്തതയ്ക്കായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; രണ്ടാം വാക്യത്തിലെ ‘ആ നദി’ പങ്കാളിക്രിയകളുടെ ബന്ധം വ്യക്തമാക്കുന്നു. വ്യാഖ്യാനപരമായി വ്യക്തിയെ തിരിച്ചറിയിക്കാതെ καίയെ സന്ദർഭാനുസൃതമായി ‘പിന്നെ’ എന്നും പരാമർശിക്കപ്പെട്ട കർത്താവിനെ ‘അവൻ’ എന്നും നിലനിർത്തി.
