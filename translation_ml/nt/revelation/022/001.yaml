  to: പിന്നെ അവൻ എനിക്ക് സ്ഫടികംപോലെ തിളങ്ങുന്ന ജീവന്റെ ജലത്തിന്റെ ഒരു നദി കാണിച്ചുതന്നു; അത് ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും സിംഹാസനത്തിൽനിന്ന് ഒഴുകിവരുന്നതായിരുന്നു.
