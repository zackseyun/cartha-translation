id: REV.22.8
reference: Revelation 22:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: ml
  text: ഈ കാര്യങ്ങൾ കേൾക്കുകയും കാണുകയും ചെയ്യുന്ന യോഹന്നാൻ ഞാനാണ്. ഞാൻ അവ കേൾക്കുകയും കാണുകയും ചെയ്തപ്പോൾ, അവ എനിക്കു കാണിച്ചുകൊണ്ടിരുന്ന ദൂതന്റെ പാദങ്ങൾക്കു മുമ്പിൽ ആരാധിക്കാനായി ഞാൻ വീണു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വണങ്ങാനായി’ അല്ലെങ്കിൽ ‘സാഷ്ടാംഗം പ്രണമിക്കാനായി.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് പ്രണാമത്തെയോ ആദരപൂർവമായ സാഷ്ടാംഗവീഴ്ചയെയോ സൂചിപ്പിക്കാം. എന്നാൽ വെളിപ്പാട് പുസ്തകത്തിലെ അതിന്റെ പതിവ് അർഥവും അടുത്ത വാക്യത്തിലെ ശാസനയും കണക്കിലെടുത്ത് ഇവിടെ ‘ആരാധിക്കാനായി’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ Ἰωάννης
  choice: യോഹന്നാൻ എന്ന ഞാനാണ്
  rationale: καί നൽകുന്ന തുടർച്ച സന്ദർഭത്തിലും മലയാള വാക്യപ്രവാഹത്തിലും നിലനിൽക്കുന്നു; ἐγώയുടെ ഊന്നൽ ‘ഞാനാണ്’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ὁ ἀκούων καὶ βλέπων ταῦτα
  choice: ഇവ കേൾക്കുകയും കാണുകയും ചെയ്യുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തരൂപങ്ങളുടെ തുടരുന്ന ഭാവവും substantival ഘടനയും സ്വാഭാവികമായ മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: ὅτε ἤκουσα καὶ ἔβλεψα
  choice: ഞാൻ കേൾക്കുകയും കാണുകയും ചെയ്തപ്പോൾ
  rationale: ὅτεയെ ‘ചെയ്തപ്പോൾ’ എന്നു നൽകുന്നത് സമയബന്ധം മാത്രം വ്യക്തമാക്കുന്നു; ‘ശേഷം’ എന്നു നൽകി ക്രമം അതിവ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἔπεσα προσκυνῆσαι
  choice: ആരാധിക്കാനായി ഞാൻ വീണു
  rationale: ἔπεσαയുടെ ശാരീരിക പ്രവൃത്തിയും προσκυνέωയുടെ വെളിപ്പാട് പുസ്തകത്തിലെ ആരാധനാസംബന്ധമായ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου
  choice: ദൂതന്റെ കാൽക്കൽ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ ‘കാൽക്കൽ’ എന്ന പ്രയോഗം ദൂതന്റെ പാദങ്ങൾക്കു മുമ്പിൽ വീണ നിലയെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: ഇവ എനിക്കു കാണിച്ചുതന്ന
  rationale: ദൂതൻ ദർശനങ്ങൾ കാണിച്ചുകൊണ്ടിരുന്ന പങ്കിനെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൂതനോടു ബന്ധപ്പെട്ട προσκυνέωയുടെ സ്വഭാവം
  choice: ആരാധിക്കാനായി
  alternative: വണങ്ങാനായി / സാഷ്ടാംഗം വീഴാനായി
  rationale: προσκυνέωയ്ക്ക് വണക്കം, പ്രണാമം എന്നീ അർഥങ്ങളും വരാമെങ്കിലും വെളിപ്പാട് പുസ്തകത്തിലെ പതിവ് പ്രയോഗവും അടുത്ത വാക്യത്തിലെ ശാസനയും ഇവിടെ ആരാധനാസംബന്ധമായ ഗൗരവം സൂചിപ്പിക്കുന്നു. ദൂതൻ ആരാധനയ്ക്ക് അർഹനാണെന്നല്ല, യോഹന്നാന്റെ പ്രവൃത്തി അനുചിതമായിരുന്നെന്ന ആഖ്യാനത്തിലെ സംഘർഷമാണ് വിവർത്തനം സംരക്ഷിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാള വാക്യങ്ങളാക്കി; ആവർത്തിക്കുന്ന ‘ഇവ’ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചിക പ്രധാന പാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
