id: REV.22.14
reference: Revelation 22:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: ml
  text: തങ്ങളുടെ അങ്കികൾ കഴുകുന്നവർ അനുഗൃഹീതർ[a][b]; അങ്ങനെ അവർക്ക് ജീവവൃക്ഷത്തിലേക്കുള്ള അവകാശം ലഭിക്കാനും കവാടങ്ങൾവഴി നഗരത്തിൽ പ്രവേശിക്കാനും കഴിയും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘തങ്ങളുടെ അങ്കികൾ കഴുകുന്നവർ’ എന്നതിനുപകരം ‘അവന്റെ കൽപ്പനകൾ ചെയ്യുന്നവർ’ അഥവാ ‘അവന്റെ കൽപ്പനകൾ പാലിക്കുന്നവർ’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അങ്കികൾ കഴുകുന്ന ഈ ദൃശ്യബിംബം വെളിപ്പാട് 7:14-നെ അനുസ്മരിപ്പിക്കുന്നു; അവിടെ അങ്കികൾ കുഞ്ഞാടിന്റെ രക്തത്തിൽ കഴുകി വെളുപ്പിച്ചതായി പറയുന്നു.
    reason: cross_reference
  - marker: c
    text: 'മറ്റൊരു പരിഭാഷ: ‘കവാടങ്ങളിലൂടെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: വെറും മാനസിക സന്തോഷത്തേക്കാൾ ദൈവികവും അന്ത്യകാലപരവുമായ അനുഗ്രഹസ്ഥിതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സന്തുഷ്ടർ’ എന്നതിനെക്കാൾ യോജിക്കുന്നു.
- source_word: πλύνοντες
  choice: കഴുകുന്നവർ
  rationale: വസ്ത്രം കഴുകുക എന്ന ദൃശ്യബിംബം വ്യാഖ്യാനപരമായി ‘ശുദ്ധീകരിക്കുക’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു; വർത്തമാന കൃദന്തരൂപത്തിന്റെ സ്വഭാവസൂചനയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: στολάς
  choice: അങ്കികൾ
  rationale: വെളിപ്പാടിലെ ദർശനാത്മകമായ നീണ്ട വസ്ത്രങ്ങളുടെ പ്രതീകഭാവം നിലനിർത്തുന്ന, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദം.
- source_word: ἵνα
  choice: ഉണ്ടാകാനും … പ്രവേശിക്കാനും വേണ്ടിയാണത്
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξουσία
  choice: അവകാശം
  rationale: ഇവിടെ ഭരണാധികാരമോ ശക്തിയോ അല്ല, ജീവവൃക്ഷത്തിലേക്കുള്ള നിയമാനുസൃത പ്രവേശനാവകാശമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: ജീവവൃക്ഷത്തിൽ
  rationale: ἐξουσίαയോടൊപ്പമുള്ള ἐπί പ്രവേശനമോ പങ്കാളിത്തമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ജീവവൃക്ഷത്തിൽ അവകാശം’ ആ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: τοῖς πυλῶσιν
  choice: കവാടങ്ങളിലൂടെ
  rationale: ദത്തിവ് രൂപം ഇവിടെ പ്രവേശനമാർഗം സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി ഗ്രഹിക്കാം; ‘കവാടങ്ങളാൽ’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: εἰσέλθωσιν εἰς τὴν πόλιν
  choice: നഗരത്തിൽ പ്രവേശിക്കാനും
  rationale: ἵναയ്ക്കു ശേഷമുള്ള സാധ്യതാപരമായ ഉദ്ദേശ്യ/ഫലബന്ധം നിലനിർത്തിക്കൊണ്ട് ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം നൽകുന്നു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ പാഠഭേദം
  choice: SBLGNTയിലെ ‘തങ്ങളുടെ അങ്കികൾ കഴുകുന്നവർ’ എന്ന പാഠം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു.
  alternative: ‘അവന്റെ കല്പനകൾ അനുഷ്ഠിക്കുന്നവർ’ അഥവാ ‘അവന്റെ കല്പനകൾ പാലിക്കുന്നവർ.’
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് സ്രോതസ്സ് πλύνοντες τὰς στολὰς αὐτῶν എന്നാണ് വായിക്കുന്നത്. മറ്റൊരു പ്രധാന പാഠപരമ്പരയുടെ ദൈവശാസ്ത്രപരവും പരിഭാഷാചരിത്രപരവുമായ പ്രാധാന്യം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: അങ്കികൾ കഴുകുന്നതും ജീവവൃക്ഷത്തിലേക്കുള്ള അവകാശവും തമ്മിലുള്ള ബന്ധം
  choice: വാക്യം വ്യക്തമാക്കുന്ന ബന്ധം അതേപടി നിലനിർത്തി; അതിന്റെ പ്രവർത്തനരീതി മുഖ്യവാചകത്തിൽ വിശദീകരിച്ചില്ല.
  alternative: ഇത് മനുഷ്യന്റെ പുണ്യപ്രവൃത്തിയായി വ്യക്തമാക്കുക, അല്ലെങ്കിൽ വെളിപ്പാട് 7:14 അടിസ്ഥാനമാക്കി കുഞ്ഞാടിന്റെ രക്തത്തിൽ കഴുകുന്നതാണെന്ന് മുഖ്യവാചകത്തിൽ ചേർക്കുക.
  rationale: വാക്യത്തിൽ ഇല്ലാത്ത ഒരു സിദ്ധാന്തപരമായ വിശദീകരണം കൂട്ടിച്ചേർക്കാതെ അതിലെ യഥാർഥ ദൈവശാസ്ത്രപരമായ സംഘർഷവും പ്രതീകാത്മകതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അനുഗൃഹീതർ,’ ‘അങ്കികൾ,’ ‘ജീവവൃക്ഷം,’ ‘അവകാശം,’ ‘കവാടങ്ങൾ’ എന്നിവ ദർശനാത്മകവും ആരാധനാപരവുമായ ഭാവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നവയാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
