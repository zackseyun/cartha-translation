id: REV.22.6
reference: Revelation 22:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his servants what must happen soon.”
translation:
  language: ml
  text: 'അവൻ എന്നോടു പറഞ്ഞു: “ഈ വചനങ്ങൾ വിശ്വാസയോഗ്യവും സത്യവുമാണ്. പ്രവാചകന്മാരുടെ ആത്മാക്കളുടെ ദൈവമായ കർത്താവ്, ഉടൻ[a] സംഭവിക്കേണ്ട കാര്യങ്ങൾ തന്റെ അടിമകൾക്ക്[b] കാണിച്ചുകൊടുക്കാൻ തന്റെ ദൂതനെ അയച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വേഗത്തിൽ.” ഗ്രീക്ക് പ്രയോഗം സംഭവങ്ങളുടെ കാലസാമീപ്യത്തെയോ (“ഉടൻ”), അവ സംഭവിക്കുന്ന ദ്രുതഗതിയെയോ (“വേഗത്തിൽ”) ഊന്നിക്കാട്ടാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “ദാസന്മാർ” അല്ലെങ്കിൽ “ശുശ്രൂഷകർ.” ഗ്രീക്ക് പദം ഉടമയ്ക്കു കീഴിലുള്ള അടിമകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστοὶ
  choice: വിശ്വാസയോഗ്യം
  rationale: വചനങ്ങളുടെ ആശ്രയയോഗ്യതയും ഉറപ്പും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വിശ്വസ്തം’ എന്നത് വ്യക്തികളെ വിശേഷിപ്പിക്കുമ്പോൾ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: ἀληθινοί
  choice: സത്യം
  rationale: വചനങ്ങളുടെ സത്യത നേരിട്ടും ലളിതമായും നിലനിർത്തുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ഇവിടെ ദൈവിക സ്ഥാനനാമമായതിനാൽ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: പ്രവാചകന്മാരുടെ ആത്മാക്കളുടെ ദൈവം
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; ദൈവം പ്രവാചകന്മാരെ പ്രചോദിപ്പിക്കുന്നവൻ എന്നോ പ്രവാചകാത്മാക്കളുടെ ദൈവം എന്നോ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: ἄγγελον
  choice: ദൂതൻ
  rationale: വെളിപ്പാടിന്റെ ദർശനസന്ദർഭത്തിൽ സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ദൂതൻ’ ഈ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: δούλοις
  choice: അടിമകൾ
  rationale: δοῦλος സൂചിപ്പിക്കുന്ന ഉടമസ്ഥതയും പൂർണമായ അധീനതയും ‘ദാസൻ/ശുശ്രൂഷകൻ’ എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δεῖξαι
  choice: കാണിച്ചുകൊടുക്കാൻ
  rationale: ദർശനപരമായ സന്ദർഭത്തിൽ δείκνυμι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἃ δεῖ γενέσθαι
  choice: സംഭവിക്കേണ്ട കാര്യങ്ങൾ
  rationale: δεῖയിലെ അനിവാര്യതയും γενέσθαιയിലെ സംഭവിക്കുക എന്ന ആശയവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐν τάχει
  choice: ഉടൻ
  rationale: ഈ സന്ദർഭത്തിൽ കാലസാമീപ്യം പ്രധാനമായി അറിയിക്കുന്നു; സംഭവങ്ങൾ ആരംഭിച്ചാൽ വേഗത്തിൽ നടക്കും എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Καὶ εἶπέν μοι
  choice: അവൻ എന്നോടു പറഞ്ഞു
  rationale: καίയെ മലയാളത്തിൽ നിർബന്ധമായി ‘കൂടാതെ’ എന്നു ചേർക്കാതെ, തുടർച്ചയായ വിവരണത്തിന് സ്വാഭാവികമായ സംസാരപരിചയം നൽകുന്നു; ഗ്രീക്കിലുള്ള കർത്താവിന്റെ പരാമർശം ‘അവൻ’ എന്ന നിലയിൽ തന്നെ വിടുന്നു.
theological_decisions:
- issue: ἐν τάχει എന്ന പ്രയോഗത്തിന്റെ അന്ത്യകാലസംബന്ധിയായ അർഥം
  choice: ഉടൻ
  alternative: വേഗത്തിൽ
  rationale: പ്രയോഗം കാലസാമീപ്യത്തെയോ സംഭവത്തിന്റെ ദ്രുതഗതിയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ കാലസാമീപ്യം സ്വീകരിച്ചെങ്കിലും മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ദൈവജനത്തെ സൂചിപ്പിക്കുന്ന δοῦλοι എന്ന പദത്തിന്റെ ശക്തി
  choice: അടിമകൾ
  alternative: ദാസന്മാർ; ശുശ്രൂഷകർ
  rationale: ദൈവത്തിന്റേതായിരിക്കുക, അവനോടു പൂർണമായി അധീനരായിരിക്കുക എന്നീ ഘടകങ്ങൾ ഇവിടെ പ്രസക്തമാണ്. കൂടുതൽ പരമ്പരാഗതമായ മലയാള പദങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘പ്രവാചകന്മാരുടെ ആത്മാക്കളുടെ ദൈവം’ എന്ന ഷഷ്ഠീപ്രയോഗത്തിന്റെ ബന്ധം
  choice: ബന്ധം വ്യാഖ്യാനിക്കാതെ ഔപചാരികമായി നിലനിർത്തി
  alternative: പ്രവാചകന്മാരെ പ്രചോദിപ്പിക്കുന്ന ദൈവം; പ്രവാചകാത്മാക്കളുടെ ദൈവം
  rationale: മൂലപാഠം ‘ആത്മാക്കൾ’ പ്രവാചകന്മാരുടേതാണോ പ്രവചനപ്രവർത്തനവുമായി ബന്ധപ്പെട്ട ആത്മീയ പ്രവർത്തനങ്ങളാണോ എന്നത് പൂർണമായി വിശദീകരിക്കുന്നില്ല; വ്യാഖ്യാനപരമായ പരാവർത്തനം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. ‘വചനങ്ങൾ’, ‘കർത്താവ്’, ‘പ്രവാചകന്മാർ’, ‘ദൂതൻ’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സ്വാഭാവികമാക്കി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, ἐν τάχειയ്ക്ക് [a]യും δούλοιςയ്ക്ക് [b]യും ബന്ധപ്പെട്ട പദങ്ങൾക്കരികിൽ ശരിയായി സ്ഥാപിച്ചു.
