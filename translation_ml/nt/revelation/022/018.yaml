id: REV.22.18
reference: Revelation 22:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: ml
  text: ഈ പുസ്തകത്തിലെ പ്രവചനവചനങ്ങൾ കേൾക്കുന്ന ഏവരോടും ഞാൻ സാക്ഷ്യപ്പെടുത്തുന്നു:[a] ആരെങ്കിലും അവയോടു എന്തെങ്കിലും കൂട്ടിച്ചേർത്താൽ, ഈ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന ബാധകൾ ദൈവം അവന്റെമേൽ കൂട്ടിച്ചേർക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞാൻ സാക്ഷ്യം പറയുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ വെറും സാധാരണ മുന്നറിയിപ്പല്ല, ഔപചാരികമായ സാക്ഷ്യഭാഷയാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘പുസ്തകം’ എന്നതിനു പകരം ‘ചുരുൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; βιβλίον എന്ന പദം പുരാതന എഴുത്തിന്റെ ഭൗതികരൂപമായ ചുരുളിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: ഞാൻ സാക്ഷ്യപ്പെടുത്തുന്നു
  rationale: സാക്ഷ്യഭാഷയുടെ ഗൗരവവും ഔപചാരിക ശക്തിയും നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ മുന്നറിയിപ്പിന്റെ അർഥം തുടർന്നുള്ള വ്യവസ്ഥാവാക്യത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: παντὶ τῷ ἀκούοντι
  choice: കേൾക്കുന്ന ഏവരോടും
  rationale: ദാതൃക വിഭക്തിയിലുള്ള വർത്തമാന കൃതന്തത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: പ്രവചനവചനങ്ങൾ
  rationale: λόγοι എന്നതിന്റെ വാചിക ഉള്ളടക്കവും προφητεία എന്നതിന്റെ പ്രവചനസ്വഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τοῦ βιβλίου τούτου
  choice: ഈ പുസ്തകത്തിലെ
  rationale: βιβλίον എന്നതിന് സ്വാഭാവികമായ മലയാള പദം; പുരാതന ഭൗതികരൂപം ഉദ്ദേശിച്ചാൽ ‘ചുരുൾ’ എന്നും സാധ്യമാണ്.
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: ആരെങ്കിലും അവയോടു എന്തെങ്കിലും കൂട്ടിച്ചേർത്താൽ
  rationale: ἐπιτίθημι എന്ന ക്രിയയുടെ ‘കൂട്ടിച്ചേർക്കുക’ എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ വാക്യം പൂർണമാകാൻ ‘എന്തെങ്കിലും’ സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: ദൈവം അവന്റെമേൽ കൂട്ടിച്ചേർക്കും
  rationale: മുൻവാക്യത്തിലെ അതേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി, മനുഷ്യൻ കൂട്ടിച്ചേർക്കുന്നതും ദൈവം അവന്റെമേൽ കൂട്ടിച്ചേർക്കുന്നതുമായ വാക്ചാതുര്യസമത്വം സംരക്ഷിക്കുന്നു.
- source_word: τὰς πληγὰς
  choice: ബാധകൾ
  rationale: വെളിപ്പാടുപുസ്തകത്തിലെ ന്യായവിധിസംബന്ധമായ πληγή എന്ന പദത്തിന്റെ അർഥം നൽകുന്നു; ‘മഹാമാരികൾ’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: τὰς γεγραμμένας
  choice: എഴുതിയിരിക്കുന്ന
  rationale: എഴുതപ്പെട്ട് നിലനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണ്ണകാല നിഷ്ക്രിയ കൃതന്തത്തിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: പ്രസ്താവന സാക്ഷ്യമോ മുന്നറിയിപ്പോ എന്നത്
  choice: ‘ഞാൻ സാക്ഷ്യപ്പെടുത്തുന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘ഞാൻ മുന്നറിയിപ്പു നൽകുന്നു’
  rationale: Μαρτυρῶ അടിസ്ഥാനമായി സാക്ഷ്യം പറയുന്ന ഭാഷയാണ്. മുന്നറിയിപ്പിന്റെ ശക്തി വ്യവസ്ഥാപരമായ ന്യായവിധിവാക്യത്തിൽ വ്യക്തമായതിനാൽ അതിനെ ആദ്യക്രിയയിൽ വ്യാഖ്യാനാത്മകമായി ചേർത്തിട്ടില്ല.
- issue: ദൈവത്തിന്റെ പ്രതികരണത്തിലെ ക്രിയാസമത്വം
  choice: രണ്ടിടത്തും ‘കൂട്ടിച്ചേർക്കുക’ എന്ന ഒരേ ക്രിയ നിലനിർത്തി
  alternative: രണ്ടാമത്തെ ക്രിയ ‘വരുത്തും’ അല്ലെങ്കിൽ ‘ചുമത്തും’ എന്ന് പരിഭാഷപ്പെടുത്തുക
  rationale: 'ἐπιθῇ/ἐπιθήσει എന്ന ആവർത്തനം ഉദ്ദേശപൂർവമായ വാക്ചാതുര്യമാണ്: ആരെങ്കിലും വചനങ്ങളോടു കൂട്ടിച്ചേർത്താൽ ദൈവം അവന്റെമേൽ ബാധകൾ കൂട്ടിച്ചേർക്കും. ഈ തീക്ഷ്ണമായ സമാന്തരത പരിഭാഷയിൽ സംരക്ഷിച്ചു.'
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ശൈലി. ‘കൂട്ടിച്ചേർക്കും’ എന്ന ആവർത്തനം അല്പം marked ആയിരുന്നാലും ഗ്രീക്കിലെ നിർണായക വാക്ചാതുര്യസമത്വം സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
