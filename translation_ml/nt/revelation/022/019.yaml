id: REV.22.19
reference: Revelation 22:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: ml
  text: ഈ പ്രവചനപുസ്തകത്തിലെ വാക്കുകളിൽനിന്ന് ആരെങ്കിലും എന്തെങ്കിലും നീക്കിക്കളഞ്ഞാൽ, ഈ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന ജീവവൃക്ഷത്തിൽനിന്ന്[a] വിശുദ്ധനഗരത്തിൽനിന്നും അവനുള്ള പങ്ക് ദൈവം നീക്കിക്കളയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ജീവവൃക്ഷം’ എന്നതിനുപകരം ‘ജീവപുസ്തകം’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἀφέλῃ / ἀφελεῖ
  choice: നീക്കിക്കളഞ്ഞാൽ / നീക്കിക്കളയും
  rationale: നിബന്ധനാവാക്യത്തിലും അതിന്റെ ഫലവാക്യത്തിലും ഒരേ ക്രിയ ഉപയോഗിച്ച് ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ പ്രത്യുത്തരസമാന്തര്യം നിലനിർത്തുന്നു.
- source_word: λόγων
  choice: വാക്കുകളിൽനിന്ന്
  rationale: പ്രവചനത്തിന്റെ വാചിക ഉള്ളടക്കത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മുന്നറിയിപ്പിന്റെ പാഠസംബന്ധമായ സ്വഭാവം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: βιβλίου τῆς προφητείας ταύτης
  choice: ഈ പ്രവചനപുസ്തകത്തിലെ
  rationale: അർത്ഥം നഷ്ടപ്പെടാതെ സ്വാഭാവികമായ ആധുനിക മലയാളവാക്യഘടന നൽകുന്നു.
- source_word: μέρος
  choice: ഓഹരി
  rationale: വെറും ഭാഗം എന്നതിലുപരി ഒരാൾക്കുള്ള പങ്കാളിത്തമോ അവകാശവിഹിതമോ സൂചിപ്പിക്കുന്നു.
- source_word: ξύλου τῆς ζωῆς
  choice: ജീവവൃക്ഷം
  rationale: വെളിപ്പാട് 22-ലെ സമീപസന്ദർഭവുമായി യോജിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: πόλεως τῆς ἁγίας
  choice: വിശുദ്ധനഗരം
  rationale: അപോകലിപ്റ്റികവും ഉടമ്പടിസംബന്ധവുമായ വിശേഷണം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: ഈ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന
  rationale: പൂർണ നിഷ്ക്രിയ കൃതന്തത്തിന്റെ ആശയം കാത്തുസൂക്ഷിക്കുന്നു; വ്യാകരണപരമായി ജീവവൃക്ഷത്തെയും വിശുദ്ധനഗരത്തെയും ഒരുമിച്ച് വിശേഷിപ്പിക്കാൻ അനുവദിക്കുന്നു.
theological_decisions:
- issue: ‘ജീവവൃക്ഷം’ എന്ന വായനയും പിൽക്കാല ബൈസന്റൈൻ ‘ജീവപുസ്തകം’ എന്ന വായനയും തമ്മിലുള്ള പാഠഭേദം
  choice: ജീവവൃക്ഷം
  alternative: ജീവപുസ്തകം
  rationale: SBLGNT-യിലെ ξύλου τῆς ζωῆς എന്ന വായനയ്ക്കാണ് മുഖ്യപാഠത്തിൽ മുൻഗണന; അത് വെളിപ്പാട് 22-ന്റെ സമീപസന്ദർഭത്തോടും യോജിക്കുന്നു. പ്രസിദ്ധമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: τῶν γεγραμμένων എന്ന ബഹുവചനബന്ധത്തിന്റെ വ്യാപ്തി
  choice: ‘ഈ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന’ എന്നത് ജീവവൃക്ഷത്തെയും വിശുദ്ധനഗരത്തെയും വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ നിലനിർത്തി
  alternative: പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന കാര്യങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി വികസിപ്പിക്കുക
  rationale: ഗ്രീക്ക് വാക്യഘടനയിലെ യഥാർഥ ബന്ധവും ചെറിയ വ്യാഖ്യാനതുറപ്പില്ലായ്മയും വിശദീകരിച്ച് തീർക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘എന്തെങ്കിലും’ ചേർത്തത് ἀπό എന്ന ഘടനയിൽ സൂചിപ്പിക്കുന്ന ഭാഗിക നീക്കലിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട മുഖ്യപാഠവായനയ്ക്കുശേഷം നൽകിയിരിക്കുന്നു.
