id: REV.22.16
reference: Revelation 22:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: ml
  text: യേശുവായ ഞാൻ, സഭകൾക്കുവേണ്ടി ഈ കാര്യങ്ങൾ നിങ്ങളോടു സാക്ഷ്യപ്പെടുത്താൻ എന്റെ ദൂതനെ അയച്ചിരിക്കുന്നു.[a] ഞാൻ ദാവീദിന്റെ വേരും സന്തതിയും, ശോഭയുള്ള പ്രഭാതനക്ഷത്രവും ആകുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘സഭകളിൽവെച്ച് ഈ കാര്യങ്ങൾ നിങ്ങളോടു സാക്ഷ്യപ്പെടുത്താൻ’ എന്നും ‘സഭകളെക്കുറിച്ച് ഈ കാര്യങ്ങൾ നിങ്ങളോടു സാക്ഷ്യപ്പെടുത്താൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ἐπὶ ταῖς ἐκκλησίαις എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് ഒന്നിലധികം അർഥസൂക്ഷ്മതകൾ സാധ്യമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ‘സന്തതി’ എന്നതിന് ‘വംശജൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: യേശുവായ ഞാൻ
  rationale: വ്യക്തമായ സർവനാമം നൽകുന്ന ഊന്നലോടുകൂടിയ സ്വയംപരിചയം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഇവിടെ ഇല്ലാത്ത ഒരു കോപുല ചേർക്കുന്നില്ല.
- source_word: ἔπεμψα
  choice: അയച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായെങ്കിലും ഇപ്പോഴും പ്രസക്തമായ അയയ്ക്കൽ എന്ന സന്ദർഭഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸν ἄγγελόν μου
  choice: എന്റെ ദൂതനെ
  rationale: വെളിപ്പാടിന്റെ അപോകലിപ്റ്റിക് പശ്ചാത്തലത്തിൽ ἄγγελος ദൈവിക ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൂതൻ’ മലയാള ബൈബിൾഭാഷയിലും സാധാരണ ഉപയോഗത്തിലും അത് സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: ഈ കാര്യങ്ങൾ നിങ്ങളോടു സാക്ഷ്യപ്പെടുത്താൻ
  rationale: ഉദ്ദേശ്യസൂചകമായ ഇൻഫിനിറ്റീവും ὑμῖν എന്ന ദാതീവും ταῦτα എന്ന ബഹുവചന നേരിട്ടുള്ള കർമവും സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: സഭകൾക്കുവേണ്ടി
  rationale: സഭകളെ ഉദ്ദേശിച്ചുള്ള സാക്ഷ്യം എന്ന സന്ദർഭസാധ്യത സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്ക് പ്രയോഗത്തിന്റെ മറ്റു സാധ്യമായ സൂക്ഷ്മതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἡ ῥίζα
  choice: വേര്
  rationale: ഉറവിടം/മൂലം എന്ന രൂപകത്തെ വിശദീകരിച്ച് ലഘൂകരിക്കാതെ അക്ഷരാർഥത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὸ γένος Δαυίδ
  choice: ദാവീദിന്റെ സന്തതി
  rationale: γένος സൂചിപ്പിക്കുന്ന വംശബന്ധം സമകാലികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: ശോഭയുള്ള പ്രഭാതനക്ഷത്രം
  rationale: ആവർത്തിത നിർദേശകങ്ങളിലുള്ള വിശേഷണങ്ങളെ സ്വാഭാവിക മലയാള ശീർഷകമായി ചേർത്ത് പ്രകാശവും പ്രഭാതവും എന്ന രണ്ടു ഘടകങ്ങളും നിലനിർത്തുന്നു.
theological_decisions:
- issue: മിശിഹായുടെ ദാവീദീയ സ്വയംപരിചയം
  choice: ‘ദാവീദിന്റെ വേരും സന്തതിയും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദാവീദിന്റെ ഉറവിടവും സന്തതിയും’
  rationale: യേശു ദാവീദിന് മുൻപുള്ള മൂലവും ദാവീദിന്റെ വംശജനുമാണെന്ന പാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- issue: ‘പ്രഭാതനക്ഷത്രം’ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകം
  choice: ‘ശോഭയുള്ള പ്രഭാതനക്ഷത്രം’ എന്ന നേരിട്ടുള്ള സ്വയംവിശേഷണം നിലനിർത്തി.
  alternative: രൂപകത്തെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുക
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള ശീർഷകം അതിന്റെ ദൃശ്യബലത്തോടെ സംരക്ഷിക്കുകയും പിന്നീടുള്ള സിദ്ധാന്തവ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൂതൻ’, ‘സാക്ഷ്യപ്പെടുത്തുക’, ‘സഭ’, ‘പ്രഭാതനക്ഷത്രം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ സ്വാഭാവിക വാക്യഘടനയിൽ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
