  to: അതിന്റെ വീഥിയുടെ നടുവിലും നദിയുടെ ഇപ്പുറത്തും അപ്പുറത്തുമായി ജീവവൃക്ഷം ഉണ്ടായിരുന്നു[a]. അത് പന്ത്രണ്ട് ഫലങ്ങൾ കായ്ച്ചുകൊണ്ട് ഓരോ മാസവും അതിന്റെ ഫലം നൽകി[b][c]. വൃക്ഷത്തിന്റെ ഇലകൾ ജനതകളുടെ സൗഖ്യത്തിനായിരിക്കുന്നു.
