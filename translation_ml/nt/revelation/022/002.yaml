id: REV.22.2
reference: Revelation 22:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: ml
  text: അതിന്റെ വീഥിയുടെ നടുവിലും നദിയുടെ ഇപ്പുറത്തും അപ്പുറത്തുമായി ജീവവൃക്ഷം ഉണ്ടായിരുന്നു[a]. അത് പന്ത്രണ്ട് ഫലങ്ങൾ കായ്ച്ചുകൊണ്ട് ഓരോ മാസവും അതിന്റെ ഫലം നൽകി[b][c]. വൃക്ഷത്തിന്റെ ഇലകൾ ജനതകളുടെ സൗഖ്യത്തിനായിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക് വാചകം അത്യന്തം സംക്ഷിപ്തമാണ്: ജീവവൃക്ഷം വീഥിയുടെ നടുവിലും നദിയുടെ ‘ഇപ്പുറത്തും അപ്പുറത്തും’ ഉള്ളതായി ചിത്രീകരിക്കുന്നു. ഇതിനെ ‘നദിയുടെ ഇരുവശങ്ങളിലും’ എന്നും മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: ‘പന്ത്രണ്ട് ഫലങ്ങൾ’ എന്നത് പന്ത്രണ്ട് തരത്തിലുള്ള ഫലങ്ങളെയോ പൂർണവും സമൃദ്ധവുമായ ഫലദാനചക്രത്തെയോ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ഈ ദൃശ്യത്തിന് ഉല്പത്തി 2:9-ലെ ജീവവൃക്ഷത്തോടും യെഹെസ്കേൽ 47:12-ലെ എല്ലാ മാസവും ഫലം കായ്ക്കുകയും ഇലകൾ സൗഖ്യത്തിനായിരിക്കുകയും ചെയ്യുന്ന വൃക്ഷങ്ങളോടും പ്രതിധ്വനിയുണ്ട്.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ τῆς πλατείας αὐτῆς
  choice: അതിന്റെ വീഥിയുടെ നടുവിൽ
  rationale: πλατεῖα വിശാലവീഥിയെയോ പൊതുചത്വരത്തെയോ സൂചിപ്പിക്കാം; നഗരസന്ദർഭത്തിൽ ‘വീഥി’ സ്വാഭാവികമാണ്. ἐν μέσῳ എന്നതിന്റെ സ്ഥാനസൂചന ‘നടുവിൽ’ നിലനിർത്തുന്നു.
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: ഇപ്പുറത്തും അപ്പുറത്തുമായി
  rationale: ‘ഈ വശത്തും ആ വശത്തും’ എന്ന വിതരണാത്മക സ്ഥാനബോധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ξύλον ζωῆς
  choice: ജീവവൃക്ഷം
  rationale: ξύλον ഇവിടെ ‘മരം/വൃക്ഷം’ എന്ന അർഥത്തിലാണ്; ഉല്പത്തി–വെളിപ്പാട് പ്രതിധ്വനിയും അറിയപ്പെടുന്ന പ്രതീകവും പരിഗണിച്ച് ‘ജീവവൃക്ഷം’ എന്നു നൽകി.
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: പന്ത്രണ്ട് ഫലങ്ങൾ കായ്ച്ചുകൊണ്ട്
  rationale: ഗ്രീക്കിൽ ‘ഇനങ്ങൾ’ എന്നു വ്യക്തമല്ലാത്തതിനാൽ അത് ചേർക്കാതെ, ποιοῦν എന്ന ഫലോൽപാദനബോധം ‘കായ്ച്ചുകൊണ്ട്’ എന്നു നൽകി.
- source_word: κατὰ μῆνα ἕκαστον ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: ഓരോ മാസവും അതതിന്റെ ഫലം നൽകി
  rationale: മാസംതോറുമുള്ള ക്രമമായ ഫലദാനം വ്യക്തമാക്കുകയും αὐτοῦ എന്ന ഏകവചന സർവനാമബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: εἰς θεραπείαν τῶν ἐθνῶν
  choice: ജനതകളുടെ സൗഖ്യത്തിനായി
  rationale: θεραπεία രോഗശാന്തിയെയോ പുനഃസ്ഥാപനത്തെയോ സൂചിപ്പിക്കാം; ‘സൗഖ്യം’ ഈ അർഥവ്യാപ്തി സംക്ഷിപ്തമായി വഹിക്കുന്നു. ἔθνηയെ യഹൂദേതരർ എന്നായി ചുരുക്കാതെ ‘ജനതകൾ’ എന്നു നൽകി.
theological_decisions:
- issue: വീഥി, നദിയുടെ ഇരുവശങ്ങൾ, ഏകവചനത്തിലുള്ള ജീവവൃക്ഷം എന്നിവ തമ്മിലുള്ള സംക്ഷിപ്ത സ്ഥാനബന്ധം
  choice: ഏകവചനമായ ‘ജീവവൃക്ഷം’ നിലനിർത്തി, അത് വീഥിയുടെ നടുവിലും നദിയുടെ ഇപ്പുറത്തും അപ്പുറത്തുമായി ഉണ്ടെന്ന ദർശനഭാഷ അതേ സംഘർഷത്തോടെ അവതരിപ്പിച്ചു.
  alternative: ഭൗമികരൂപം എളുപ്പമാക്കാൻ ‘ജീവവൃക്ഷങ്ങൾ’ എന്നു ബഹുവചനമാക്കുക, അല്ലെങ്കിൽ വാക്യഘടന പുനഃക്രമീകരിച്ച് ഒരു നിർദിഷ്ട സ്ഥാനം നിശ്ചയിക്കുക.
  rationale: ഗ്രീക്ക് ഏകവചനം ഉപയോഗിക്കുകയും അതേ സമയം അമർത്തിച്ചുരുക്കിയ അപോകലിപ്റ്റിക് സ്ഥാനചിത്രം നൽകുകയും ചെയ്യുന്നു. അതിനെ വിശദീകരിച്ച് തീർക്കാതെ പാഠത്തിലെ യഥാർഥ ദ്വയാർഥതയും ഉല്പത്തി പശ്ചാത്തലവും സംരക്ഷിച്ചു.
- issue: ‘പന്ത്രണ്ട് ഫലങ്ങൾ’ എന്നതിന്റെ അർഥം
  choice: മൂലപാഠത്തോട് ചേർന്ന് ‘പന്ത്രണ്ട് ഫലങ്ങൾ’ എന്നു നൽകി.
  alternative: ‘പന്ത്രണ്ട് തരത്തിലുള്ള ഫലങ്ങൾ’ അല്ലെങ്കിൽ ‘പന്ത്രണ്ട് വിളവുകൾ’ എന്നു വ്യാഖ്യാനപരമായി നൽകുക.
  rationale: καρποὺς δώδεκα പന്ത്രണ്ട് ഇനങ്ങളെയോ സമ്പൂർണമായ ഫലചക്രത്തെയോ സൂചിപ്പിച്ചേക്കാം; എന്നാൽ ‘ഇനങ്ങൾ’ എന്ന ആശയം ഗ്രീക്കിൽ തുറന്നുപറയാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉണ്ടായിരുന്നു’, ‘കായ്ച്ചുകൊണ്ട്’, ‘സൗഖ്യം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കുമ്പോൾ ദർശനത്തിന്റെ ഔന്നത്യം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ സ്ഥാനപരമായ അസ്പഷ്ടത ലളിതമാക്കി തീർത്തിട്ടില്ല.
