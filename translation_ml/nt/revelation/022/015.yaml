id: REV.22.15
reference: Revelation 22:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: ml
  text: പുറത്ത് നായ്ക്കളും[a] മന്ത്രവാദികളും ലൈംഗികമായി അധാർമികരായവരും കൊലപാതകികളും വിഗ്രഹാരാധകരും അസത്യത്തെ സ്നേഹിക്കുകയും പ്രവർത്തിക്കുകയും ചെയ്യുന്ന ഏവരും ഉണ്ട്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നായ്ക്കൾ’ എന്നത് ഇവിടെ പുറത്താക്കലിനെയും ധാർമിക അശുദ്ധിയെയും സൂചിപ്പിക്കുന്ന രൂപകമായിരിക്കാം; ചിലർ ഇതിനെ കൂടുതൽ പ്രത്യേകമായ അർഥത്തിൽ വ്യാഖ്യാനിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘ഒരു കള്ളത്തെ സ്നേഹിക്കുകയും പ്രവർത്തിക്കുകയും ചെയ്യുന്ന ഏവരും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξω
  choice: പുറത്ത് ... ഉണ്ട്
  rationale: നഗരത്തിൽനിന്നുള്ള പുറത്താക്കലിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനക്രിയാവിശേഷണം. ഗ്രീക്കിലെ മുൻനിര ഊന്നൽ നിലനിർത്താൻ ‘പുറത്ത്’ ആദ്യം വെച്ചു; മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി ‘ഉണ്ട്’ അവസാനം ചേർത്തു.
- source_word: κύνες
  choice: നായ്ക്കൾ
  rationale: വെളിപ്പാടിലെ ശക്തമായ രൂപകചിത്രം അതേപടി നിലനിർത്തുന്നു; വിവാദമായ ഒരു പ്രത്യേക വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: φάρμακοι
  choice: ആഭിചാരക്കാർ
  rationale: ഇവിടെ വിഷം കൊടുക്കുന്നവരെയോ ഔഷധപ്രവർത്തകരെയോ അല്ല, മന്ത്രവാദം/ആഭിചാരം അനുഷ്ഠിക്കുന്നവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: πόρνοι
  choice: ലൈംഗിക അധാർമികതയിൽ ജീവിക്കുന്നവർ
  rationale: ലൈംഗികമായി അധാർമികമായ പെരുമാറ്റത്തിൽ ഏർപ്പെടുന്നവരെ വ്യാപകമായി സൂചിപ്പിക്കുന്നു; പഴയതോ അനാവശ്യമായി സങ്കുചിതമോ ആയ പദം ഒഴിവാക്കുന്നു.
- source_word: φονεῖς
  choice: കൊലപാതകികൾ
  rationale: കൊല ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന നാമത്തിന്റെ നേരിട്ടും വ്യക്തവുമായ പരിഭാഷ.
- source_word: εἰδωλολάτραι
  choice: വിഗ്രഹാരാധകർ
  rationale: പദത്തിന്റെ മതപരവും ധാർമികവുമായ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്ന പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: വ്യാജത്തെ സ്നേഹിക്കുകയും പ്രവർത്തിക്കുകയും ചെയ്യുന്ന ഏവരും
  rationale: πᾶς സഹിതമുള്ള വർത്തമാനകാല പങ്കാളിത്തരൂപങ്ങൾ സ്വഭാവസവിശേഷമായ തുടർച്ചയായ പ്രവണതയെ സൂചിപ്പിക്കുന്നു. ‘പ്രവർത്തിക്കുന്നു’ എന്നത് ποιῶν എന്ന ക്രിയയുടെ ബോധപൂർവമായ ആചരണഭാവം നിലനിർത്തുന്നു.
- source_word: ψεῦδος
  choice: വ്യാജം
  rationale: ഒറ്റപ്പെട്ട ഒരു കള്ളവാക്കിനേക്കാൾ വിശാലമായി അസത്യത്തെയും വ്യാജമായതിനോടുള്ള കൂറിനെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന മലയാളപദം.
theological_decisions:
- issue: ‘നായ്ക്കൾ’ എന്ന രൂപകത്തെ ഒരു പ്രത്യേക വിഭാഗമായി വ്യാഖ്യാനിക്കണമോ എന്നത്
  choice: മുഖ്യപാഠത്തിൽ ‘നായ്ക്കൾ’ എന്ന മൂർത്തരൂപകം നിലനിർത്തി.
  alternative: അശുദ്ധർ; ലജ്ജയില്ലാത്തവർ; ഒരു പ്രത്യേക ലൈംഗിക വിഭാഗം
  rationale: κύνες എന്ന ഗ്രീക്ക് പദത്തിന്റെ ദൃശ്യവും ഞെട്ടിക്കുന്നതുമായ രൂപകശക്തി സംരക്ഷിക്കുകയും വിവാദമായ ഒരു വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ സ്ഥാപിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ψεῦδος എന്നത് ‘ഒരു കള്ളം’ എന്നോ വിശാലമായ ‘വ്യാജം’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ എന്നത്
  choice: വിശാലമായ ധാർമിക വിഭാഗമായി ‘വ്യാജം’ ഉപയോഗിച്ചു.
  alternative: ഒരു കള്ളം
  rationale: ‘സ്നേഹിക്കുകയും പ്രവർത്തിക്കുകയും’ എന്ന പ്രയോഗം ഒറ്റപ്പെട്ട കള്ളം പറയലിനേക്കാൾ സ്ഥിരമായ ആഭിമുഖ്യത്തെയും ആചരണത്തെയും സൂചിപ്പിക്കുന്നു; എങ്കിലും ഏകവചനസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ദോഷപ്പട്ടികയുടെ ആവർത്തനഘടന നിലനിർത്തിയിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
