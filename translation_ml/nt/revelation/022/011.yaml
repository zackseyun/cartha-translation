id: REV.22.11
reference: Revelation 22:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ⸀ῥυπαρευθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: ml
  text: അനീതി ചെയ്യുന്നവൻ ഇനിയും അനീതി ചെയ്യട്ടെ; അശുദ്ധനായവൻ ഇനിയും അശുദ്ധനാക്കപ്പെടട്ടെ[a]; നീതിമാൻ ഇനിയും നീതി പ്രവർത്തിക്കട്ടെ[b]; വിശുദ്ധനായവൻ ഇനിയും വിശുദ്ധനാക്കപ്പെടട്ടെ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അശുദ്ധനായവൻ ഇനിയും അശുദ്ധനായിരിക്കട്ടെ.’ ഗ്രീക്കിൽ ക്രിയ കർമണിരൂപത്തിലാണ്; അതിനാൽ മുഖ്യപാഠം ‘അശുദ്ധനാക്കപ്പെടട്ടെ’ എന്നു നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘നീതിമാൻ ഇനിയും നീതിപ്രവൃത്തി ചെയ്യട്ടെ.’ δικαιοσύνη എന്ന പദത്തിന് സന്ദർഭാനുസരിച്ച് ‘നീതി’ എന്നും ‘ന്യായം’ എന്നും അർഥമാകാം.'
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: ‘വിശുദ്ധനായവൻ ഇനിയും വിശുദ്ധീകരിക്കപ്പെടട്ടെ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘വിശുദ്ധനാക്കപ്പെടുക’ അഥവാ ‘വിശുദ്ധീകരിക്കപ്പെടുക’ എന്നർഥമുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν / ἀδικησάτω
  choice: അനീതി ചെയ്യുന്നവൻ / അനീതി ചെയ്യട്ടെ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പ്രവൃത്തിസ്വഭാവവും മൂന്നാംപുരുഷ ആജ്ഞാരൂപത്തിന്റെ ശക്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔτι
  choice: ഇനിയും
  rationale: നാല് ഘടകങ്ങളിലും തുടരൽ അഥവാ നിലനിൽപ്പ് സൂചിപ്പിക്കുന്ന ആവർത്തിത ക്രിയാവിശേഷണത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ തർജമ.
- source_word: ὁ ῥυπαρός / ῥυπαρευθήτω
  choice: അശുദ്ധനായവൻ / അശുദ്ധനാക്കപ്പെടട്ടെ
  rationale: ധാർമ്മിക മലിനതയുടെയും അശുദ്ധിയുടെയും ആശയം നിലനിർത്തുകയും ഗ്രീക്കിലെ കർമണിപ്രയോഗം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ δίκαιος / δικαιοσύνην ποιησάτω
  choice: നീതിമാൻ / നീതി പ്രവർത്തിക്കട്ടെ
  rationale: δικαιοσύνηയുടെ ധാർമ്മിക അർഥവും ποιέω സൂചിപ്പിക്കുന്ന സജീവമായ ആചരണവും സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: ὁ ἅγιος / ἁγιασθήτω
  choice: വിശുദ്ധനായവൻ / വിശുദ്ധനാക്കപ്പെടട്ടെ
  rationale: വിശുദ്ധി എന്ന ആശയവും ἁγιασθήτω എന്ന കർമണിരൂപവും സംരക്ഷിക്കുന്നു; പ്രവർത്തകനെ വ്യക്തമാക്കാതെ മൂലപാഠത്തിലെ പിരിമുറുക്കം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യസന്ദർഭത്തിലെ നാല് ക്രിയകളുടെയും ആജ്ഞാർഥം
  choice: എല്ലാ ക്രിയകളും ‘ചെയ്യട്ടെ/ആക്കപ്പെടട്ടെ’ എന്ന മൂന്നാംപുരുഷ ആജ്ഞാരൂപത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ചെയ്തുകൊണ്ടിരിക്കും’ എന്ന പ്രവചനരൂപത്തിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് രൂപങ്ങൾ സൂചകവാക്യങ്ങളല്ല, ആജ്ഞാരൂപങ്ങളാണ്. തിന്മയെ അംഗീകരിക്കുന്നുവെന്ന വ്യാഖ്യാനം ചേർക്കാതെയും അവയെ പ്രവചനങ്ങളാക്കി മാറ്റാതെയും ഗൗരവമുള്ള ന്യായവിധിസ്വരം നിലനിർത്തുന്നു.
- issue: ῥυπαρευθήτω, ἁγιασθήτω എന്നിവയുടെ കർമണിപ്രയോഗം
  choice: ‘അശുദ്ധനാക്കപ്പെടട്ടെ’, ‘വിശുദ്ധനാക്കപ്പെടട്ടെ’ എന്ന കർമണിരൂപങ്ങൾ നിലനിർത്തി.
  alternative: ‘അശുദ്ധനായിരിക്കട്ടെ’, ‘വിശുദ്ധനായിരിക്കട്ടെ’ എന്ന സ്ഥിതിസൂചക രൂപങ്ങൾ ഉപയോഗിക്കുക.
  rationale: മൂലപാഠത്തിൽ രണ്ടും കർമണിരൂപങ്ങളാണ്. പ്രവർത്തകൻ ആരെന്നത് വ്യക്തമാക്കാതെ വയ്ക്കുന്നത് യഥാർഥ വ്യാകരണരൂപവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. നാല് സമാന്തര ഘടകങ്ങളിലെ ‘ഇനിയും’ എന്ന ആവർത്തനവും ആജ്ഞാർഥവും ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു; കർമണിരൂപങ്ങളുടെ അല്പം അസാധാരണമായ ശബ്ദഭാവം മൂലപാഠത്തിലെ വ്യാകരണപരവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കത്തിനായി നിലനിർത്തി.
