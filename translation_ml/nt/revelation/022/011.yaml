  terminology: ‘അനീതി,’ ‘അശുദ്ധൻ,’ ‘നീതിമാൻ,’ ‘നീതി,’ ‘വിശുദ്ധൻ’ എന്നിവ ധാർമ്മികവും മതപരവുമായ വിരുദ്ധസമാന്തരതയെ നന്നായി പകരുന്നു. ‘നീതി പ്രവർത്തിക്കട്ടെ’ എന്നത് δικαιοσύνην ποιησάτω-യുടെ സജീവപ്രവൃത്തി സൂചനയെ നിലനിർത്തുന്നു.
