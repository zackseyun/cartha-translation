id: REV.22.4
reference: Revelation 22:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὄψονται τὸ πρόσωπον αὐτοῦ, καὶ τὸ ὄνομα αὐτοῦ ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/004.yaml
  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: ml
  text: അവർ അവന്റെ മുഖം കാണും[a][b]; അവന്റെ നാമം അവരുടെ നെറ്റികളിൽ ഉണ്ടായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അവർ അവന്റെ മുഖം ദർശിക്കും.’'
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ’ എന്ന ഏകവചന സർവനാമങ്ങൾ ദൈവത്തെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ സമീപസന്ദർഭത്തിൽ ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും പങ്കിട്ട ദൈവിക വാഴ്ചയെ പ്രതിഫലിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψονται
  choice: കാണും
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭാവികാലരൂപമാണിത്. ആധുനിക സാധാരണ മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ ‘കാണും’ ദൃശ്യാർഥം കാത്തുസൂക്ഷിക്കുന്നു; കൂടുതൽ ഗാംഭീര്യമുള്ള ‘ദർശിക്കും’ എന്നതും സാധ്യമാണ്.
- source_word: πρόσωπον
  choice: മുഖം
  rationale: ഇവിടെ നേരിട്ടുള്ള കർമമായി വരുന്ന πρόσωπον എന്നതിന്റെ പ്രാഥമികവും സന്ദർഭോചിതവുമായ അർഥം ‘മുഖം’ ആണ്; ‘സാന്നിധ്യം’ എന്നു മാറ്റുന്നത് ദൃശ്യവും ബന്ധപരവുമായ ശക്തി കുറയ്ക്കും.
- source_word: ὄνομα
  choice: നാമം
  rationale: ὄνομα എന്നതിന്റെ നേരിട്ടുള്ള പരിഭാഷ. ‘നാമം’ വ്യക്തിത്വം, ഉടമസ്ഥത, സ്വഭാവം എന്നിവ സൂചിപ്പിക്കാമെങ്കിലും ആ വ്യാഖ്യാനങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: അവരുടെ നെറ്റികളിൽ
  rationale: ἐπί + genitive ഇവിടെ സ്ഥാനം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബഹുവചനസംബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്ന പ്രയോഗമാണ് ‘അവരുടെ നെറ്റികളിൽ’.
- source_word: καὶ
  choice: ഉം;
  rationale: ആദ്യത്തെ καί മുൻവാക്യത്തോടുള്ള തുടർച്ചയാകുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കാതെ വാക്യാരംഭത്തിലൂടെ സ്വാഭാവികമാക്കി; രണ്ടാമത്തേത് അർധവിരാമംകൊണ്ട് സമന്വയഘടനയായി പ്രകടമാക്കി.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: ഗ്രീക്കിലെ ഏകവചന സർവനാമം നേരിട്ട് നിലനിർത്തുന്നു. ‘ദൈവത്തിന്റെ’ അല്ലെങ്കിൽ ‘കുഞ്ഞാടിന്റെ’ എന്നു വ്യക്തമാക്കാതെ സന്ദർഭത്തിലെ യഥാർഥ സൂചനാസന്ദിഗ്ധത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘അവന്റെ മുഖം’, ‘അവന്റെ നാമം’ എന്നിവയിലെ ഏകവചന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: സൂചിതനെ പേരെടുത്തു വ്യക്തമാക്കാതെ ‘അവന്റെ’ എന്നു നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റെ’; അല്ലെങ്കിൽ സമീപസന്ദർഭത്തിലെ ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും പങ്കിട്ട ദൈവിക വാഴ്ചയെ പ്രതിഫലിപ്പിക്കുന്ന സൂചന.
  rationale: വെളിപ്പാട് 22:3-ലെ സമീപസന്ദർഭത്തിൽ ദൈവവും കുഞ്ഞാടും അടുത്ത ബന്ധത്തിൽ വരുന്നു. ഗ്രീക്ക് ഏകവചന സർവനാമം ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്നത് പരിഭാഷയിൽ കൃത്രിമമായി ചുരുക്കാതിരിക്കാൻ ‘അവന്റെ’ എന്നു തന്നെ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘കാണും’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികം; ‘ദർശിക്കും’ അടിക്കുറിപ്പിൽ ഉയർന്ന ശൈലിയിലുള്ള പദവികല്പമായി നൽകിയിരിക്കുന്നു. ഗ്രീക്കിലെ രണ്ട് καί-കളെയും യാന്ത്രികമായി ആവർത്തിക്കാതെ മലയാളത്തിന്റെ സ്വാഭാവിക സമന്വയഘടന ഉപയോഗിച്ചു.
