id: REV.22.7
reference: Revelation 22:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔρχομαι ταχύ· μακάριος ὁ τηρῶν τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: ml
  text: “ഇതാ, ഞാൻ ഉടൻ[a] വരുന്നു. ഈ പുസ്തകത്തിലെ[b] പ്രവചനവചനങ്ങൾ കാത്തുപാലിക്കുന്നവൻ ധന്യൻ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വേഗത്തിൽ”; ഗ്രീക്ക് പദം സമയസാമീപ്യത്തെയോ പെട്ടെന്നുള്ളതും ദ്രുതവുമായ വരവിനെയോ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഈ ചുരുളിലെ.”
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തിയും വെളിപ്പാടുസാഹിത്യത്തിന് യോജിച്ച ഗൗരവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔρχομαι
  choice: ഞാൻ ... വരുന്നു
  rationale: സന്ദർഭത്തിൽ ഭാവിസൂചനയുള്ള വർത്തമാനകാലപ്രയോഗം മലയാളത്തിലെ ‘വരുന്നു’ എന്ന രൂപം സ്വാഭാവികമായി പകരുന്നു.
- source_word: ταχύ
  choice: ഉടൻ
  rationale: ഈ സന്ദർഭത്തിൽ സമയസാമീപ്യമാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിൽ വേഗതയുടെയോ പെട്ടെന്നുള്ള സംഭവത്തിന്റെയോ അർഥസാധ്യതയും ഉള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: μακάριος
  choice: ധന്യൻ
  rationale: വെറും മാനസിക സന്തോഷമല്ല, ദൈവിക അംഗീകാരവും അന്തിമ നന്മയും ഉൾക്കൊള്ളുന്ന അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ ഭാരം നിലനിർത്തുന്നു.
- source_word: ὁ τηρῶν
  choice: കാത്തുപാലിക്കുന്നവൻ
  rationale: ‘അനുസരിക്കുന്നവൻ’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ, വചനങ്ങളെ സൂക്ഷിക്കുക, മുറുകെപ്പിടിക്കുക, ആചരിക്കുക എന്നീ τηρέωയുടെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: പ്രവചനവചനങ്ങൾ
  rationale: ‘പ്രവചനത്തിന്റെ വചനങ്ങൾ’ എന്ന ബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള സംയുക്തപ്രയോഗത്തിൽ പകരുന്നു; അതിനെ പൊതുവായ ‘സന്ദേശം’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: τοῦ βιβλίου τούτου
  choice: ഈ പുസ്തകത്തിലെ
  rationale: വെളിപ്പാട് സ്വന്തം രചനയെ സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. പുരാതന ഭൗതികരൂപം മുൻനിർത്തിയാൽ ‘ചുരുൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
theological_decisions:
- issue: ‘ഞാൻ ഉടൻ വരുന്നു’ എന്നതിലെ പ്രഭാഷകന്റെ തിരിച്ചറിയൽ
  choice: മൂലപാഠത്തിലുള്ള ഒന്നാംപുരുഷപ്രയോഗം മാത്രം നിലനിർത്തി; പ്രഭാഷകന്റെ പേര് വാക്യത്തിൽ ചേർത്തില്ല.
  alternative: ‘യേശു ഉടൻ വരുന്നു’ എന്ന് പ്രഭാഷകനെ വാക്യത്തിൽ വ്യക്തമായി പേരെടുത്ത് പറയുക.
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ വ്യക്തിനാമമില്ല. സാഹിത്യസന്ദർഭം പ്രഭാഷകനെ തിരിച്ചറിയാൻ അനുവദിക്കുന്നതിനാൽ പരിഭാഷ വ്യാഖ്യാനപരമായ പേര് ചേർത്ത് ആ അർഥം മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഇതാ’, ‘ധന്യൻ’ എന്നീ പദങ്ങൾ വെളിപ്പാടുസാഹിത്യത്തിന്റെയും അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെയും ഉയർന്ന ഭാവം നിലനിർത്തുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. എല്ലാ അടിക്കുറിപ്പുചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
