  terminology: “ആത്മാവ്,” “മണവാട്ടി,” “ജീവജലം,” and “സൗജന്യമായി” are appropriate and established Malayalam biblical terms. The symbolic force of “മണവാട്ടി” and the ambiguity of the first two calls are preserved without doctrinal expansion.
