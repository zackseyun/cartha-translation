  source_fidelity: 'The main text closely follows the Greek: it retains the two second-person calls “വരിക,” then shifts to third-person imperatives for the thirsty and willing person. “ആഗ്രഹിക്കുന്നവൻ” appropriately represents ὁ θέλων without adding an unstated object; “ജീവജലം” and “സൗജന്യമായി” accurately convey ὕδωρ ζωῆς and δωρεάν.'
