id: REV.22.17
reference: Revelation 22:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: ml
  text: 'ആത്മാവും മണവാട്ടിയും പറയുന്നു: “വരിക!” കേൾക്കുന്നവനും “വരിക!” എന്നു പറയട്ടെ. ദാഹിക്കുന്നവൻ വരട്ടെ; ആഗ്രഹിക്കുന്നവൻ ജീവജലം സൗജന്യമായി സ്വീകരിക്കട്ടെ.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിലകൂടാതെ” അല്ലെങ്കിൽ “ദാനമായി.”
    reason: lexical_alternative
  - marker: b
    text: ആദ്യത്തെ രണ്ടു “വരിക!” എന്ന വിളികൾ സാധാരണയായി കർത്താവിനോടുള്ള “വരിക” എന്ന അപേക്ഷയായി മനസ്സിലാക്കപ്പെടുന്നു; തുടർന്ന് ദാഹിക്കുന്നവനും ആഗ്രഹിക്കുന്നവനും വന്ന് ജീവജലം സ്വീകരിക്കാനുള്ള ക്ഷണമാണുള്ളത്. എന്നാൽ ആദ്യ രണ്ടു വിളികളുടെ അഭിസംബോധിതനെ ഗ്രീക്ക് വാക്യം തുറന്ന നിലയിൽ വിടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: സന്ദർഭത്തിൽ ഇത് പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതാണ്; മലയാളത്തിൽ പതിവുള്ള ദൈവികസൂചന നിലനിർത്തുന്നു.
- source_word: ἡ νύμφη
  choice: മണവാട്ടി
  rationale: വെളിപ്പാടിലെ പ്രതീകാത്മക ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: λέγουσιν
  choice: പറയുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ സജീവവും തുടരുന്നതുമായ പ്രഖ്യാപനഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ἔρχου
  choice: വരിക
  rationale: രണ്ടാംപുരുഷ ഏകവചന ആജ്ഞയുടെ നേരിട്ടുള്ള വിളി മാന്യവും ലളിതവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἀκούων
  choice: കേൾക്കുന്നവൻ
  rationale: ലിംഗപരമായി പൊതുവായ അർഥത്തിൽ ഉപയോഗിക്കാവുന്ന സ്വാഭാവിക മലയാളപദപ്രയോഗം; വർത്തമാന കൃതന്തത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: εἰπάτω
  choice: പറയട്ടെ
  rationale: മൂന്നാംപുരുഷ ആജ്ഞയുടെ ആഹ്വാനഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ διψῶν
  choice: ദാഹിക്കുന്നവൻ
  rationale: ദാഹം എന്ന രൂപകവും വ്യക്തിയുടെ ആവശ്യബോധവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐρχέσθω
  choice: വരട്ടെ
  rationale: മൂന്നാംപുരുഷ ആജ്ഞയെ ക്ഷണാത്മകമായും ഉറച്ചും അവതരിപ്പിക്കുന്നു.
- source_word: ὁ θέλων
  choice: ആഗ്രഹിക്കുന്നവൻ
  rationale: θέλω എന്നതിലെ ആഗ്രഹം/ഇച്ഛ എന്ന അർഥം, ഗ്രീക്കിൽ ഇല്ലാത്ത ഒരു കർമം ചേർക്കാതെ, സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: λαβέτω
  choice: സ്വീകരിക്കട്ടെ
  rationale: വാഗ്ദത്തമായ ജീവജലം ദാനമായി ലഭിക്കുന്ന സന്ദർഭത്തിൽ λαμβάνω എന്നതിന്റെ ‘സ്വീകരിക്കുക’ എന്ന അർഥം സ്വാഭാവികമാണ്; ‘എടുക്കട്ടെ’ എന്നതും സാധ്യമാണ്.
- source_word: ὕδωρ ζωῆς
  choice: ജീവജലം
  rationale: ‘ജീവന്റെ ജലം’ എന്ന ജനിറ്റീവ് ആശയം മലയാളത്തിലെ പരിചിതവും സംക്ഷിപ്തവുമായ ബൈബിൾ പ്രയോഗത്തിൽ നൽകുന്നു; വെറും ‘ജീവനുള്ള വെള്ളം’ എന്ന അർഥത്തിലേക്ക് മാറ്റുന്നില്ല.
- source_word: δωρεάν
  choice: സൗജന്യമായി
  rationale: വിലയോ പ്രതിഫലമോ കൂടാതെ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: “വരിക” എന്ന ആദ്യ രണ്ടു വിളികളുടെ അഭിസംബോധിതൻ
  choice: ആദ്യ രണ്ടു വിളികളുടെയും കർമം പ്രധാനവാക്യത്തിൽ വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ തുറന്ന നില സംരക്ഷിച്ചു.
  alternative: ഇരുവിളികളും കർത്താവിന്റെ വരവിനായുള്ള അപേക്ഷയാണെന്ന് നേരിട്ട് ചേർക്കുക; അല്ലെങ്കിൽ എല്ലാം ദാഹിക്കുന്നവർക്കുള്ള ക്ഷണമെന്നു വായിക്കുക.
  rationale: ഗ്രീക്കിൽ ആദ്യ രണ്ടു പ്രാവശ്യം രണ്ടാംപുരുഷ ആജ്ഞയും തുടർന്ന് ദാഹിക്കുന്നവനും ആഗ്രഹിക്കുന്നവനും സംബന്ധിച്ച മൂന്നാംപുരുഷ ആജ്ഞകളും വരുന്നു. കർമം ചേർക്കുന്നത് പാഠത്തിലെ സാഹിത്യ-ദൈവശാസ്ത്രപരമായ പാളികൾ അനാവശ്യമായി തീർപ്പാക്കും.
- issue: “മണവാട്ടി”യുടെ പ്രതീകാത്മക സൂചന
  choice: പ്രതീകം അതേപടി നിലനിർത്തി.
  alternative: സഭ, ദൈവജനം, അല്ലെങ്കിൽ പുതിയ യെരൂശലേം എന്നു വിവർത്തനത്തിൽ വ്യക്തമാക്കുക.
  rationale: വെളിപ്പാടിൽ ഈ പ്രതീകത്തിന് പരസ്പരം ബന്ധമുള്ള പല സൂചനകളുണ്ട്; അവയിൽ ഒന്ന് മാത്രം പ്രധാനവാക്യത്തിൽ ഉറപ്പിക്കുന്നത് മൂലപാഠത്തെക്കാൾ വ്യാഖ്യാനാത്മകമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വെളിപ്പാടിന്റെ പ്രതീകഭാഷയും ആജ്ഞാത്മക സമാന്തരഘടനയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
