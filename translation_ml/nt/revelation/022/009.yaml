  rationale: The revision only repairs the Malayalam syntax of the coordinate relationship expressed by σύνδουλος ... καὶ τῶν ... καὶ τῶν. Repeating ‘-ഒപ്പവും’ makes all three associated groups explicit while retaining the source's appositional description, ‘your brothers, the prophets,’ and its full scope.
