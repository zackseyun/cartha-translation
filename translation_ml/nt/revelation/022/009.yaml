id: REV.22.9
reference: Revelation 22:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow servant with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: ml
  text: 'അവൻ എന്നോടു പറഞ്ഞു: “അങ്ങനെ ചെയ്യരുത്![a] ഞാൻ നിനക്കൊപ്പവും നിന്റെ സഹോദരന്മാരായ പ്രവാചകന്മാരോടൊപ്പവും ഈ പുസ്തകത്തിലെ വചനങ്ങൾ പാലിക്കുന്നവരോടൊപ്പവും ഒരു സഹദാസനാണ്.[b] ദൈവത്തെ ആരാധിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘നോക്കൂ, അരുത്’ എന്നതുപോലുള്ള അപൂർണരൂപത്തിലുള്ള വിലക്കാണ്; യോഹന്നാൻ ദൂതനെ ആരാധിക്കാൻ ശ്രമിച്ചതിനെ ഉദ്ദേശിച്ച് ‘അങ്ങനെ ചെയ്യരുത്’ എന്ന അർഥം നൽകുന്നു. വെളിപ്പാട് 19:10 താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: ‘സഹദാസൻ’ എന്ന ഗ്രീക്ക് പദം ഒരേ യജമാനന്റെ കീഴിലുള്ള ദാസസ്ഥിതി പങ്കിടുന്നവനെ സൂചിപ്പിക്കുന്നു; ദൂതനും യോഹന്നാനെപ്പോലെ ദൈവത്തിനു കീഴിലുള്ളവനാണെന്നും അതിനാൽ ആരാധിക്കപ്പെടേണ്ടവനല്ലെന്നും ഇവിടെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅρα μή
  choice: അങ്ങനെ ചെയ്യരുത്!
  rationale: ഗ്രീക്കിൽ ഇത് പെട്ടെന്നുള്ള, അപൂർണരൂപത്തിലുള്ള വിലക്കാണ്. മുൻസന്ദർഭത്തിൽ യോഹന്നാൻ ദൂതനെ ആരാധിക്കാൻ ശ്രമിച്ചതിനാൽ, സൂചിതമായ പ്രവൃത്തി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: σύνδουλός
  choice: സഹദാസൻ
  rationale: ഒരേ യജമാനന്റെ കീഴിലുള്ള ദാസസ്ഥിതി പങ്കിടുന്നവനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ദൂതനും യോഹന്നാനെപ്പോലെ ദൈവത്തിനു കീഴിലുള്ളവനാണെന്ന ആശയം ‘സഹദാസൻ’ സംക്ഷിപ്തമായും ശക്തമായും നിലനിർത്തുന്നു.
- source_word: ἀδελφῶν σου τῶν προφητῶν
  choice: പ്രവാചകന്മാരായ നിന്റെ സഹോദരന്മാർ
  rationale: ‘നിന്റെ സഹോദരന്മാർ’ ആരെന്നു ‘പ്രവാചകന്മാർ’ വിശദീകരിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: τηρούντων
  choice: പാലിക്കുന്നവർ
  rationale: τηρέω ഇവിടെ വചനങ്ങളെ വിശ്വസ്തമായി കാത്തുസൂക്ഷിച്ച് അനുസരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാലിക്കുക’ ഈ അർഥവ്യാപ്തി സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: λόγους τοῦ βιβλίου τούτου
  choice: ഈ പുസ്തകത്തിലെ വചനങ്ങൾ
  rationale: λόγοι എന്നതിന്റെ ബഹുവചനസ്വഭാവവും പുസ്തകത്തിന്റെ വാചിക ഉള്ളടക്കത്തോടുള്ള ബന്ധവും ‘വചനങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: τῷ θεῷ προσκύνησον
  choice: ദൈവത്തെ ആരാധിക്കുക
  rationale: വെളിപ്പാടിൽ προσκυνέω ആരാധനാപൂർവമായ നമസ്കാരത്തെ സൂചിപ്പിക്കുന്നു; ദൂതനിലേക്കു തെറ്റായി തിരിഞ്ഞ ആരാധന ദൈവത്തിലേക്കു മാത്രം തിരിക്കണമെന്ന വൈരുധ്യം ഈ പരിഭാഷ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: σύνδουλος എന്നതിലെ ദാസസ്ഥിതി
  choice: ‘സഹദാസൻ’ എന്നു പരിഭാഷപ്പെടുത്തുക
  alternative: ‘സഹശുശ്രൂഷകൻ’ അല്ലെങ്കിൽ ‘കൂടെ സേവിക്കുന്നവൻ’
  rationale: ദൂതൻ ആരാധനയ്ക്കുള്ളവനല്ല, മറിച്ച് യോഹന്നാനോടൊപ്പം ദൈവത്തിന്റെ അധികാരത്തിനു കീഴിലുള്ളവനാണ് എന്ന വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഊന്നൽ ദാസസ്ഥിതി വ്യക്തമാക്കുന്നതിലൂടെ നിലനിർത്തുന്നു.
- issue: Ὅρα μή എന്ന അപൂർണരൂപത്തിലുള്ള വിലക്ക്
  choice: സൂചിതമായ പ്രവൃത്തി ചേർത്ത് ‘അങ്ങനെ ചെയ്യരുത്!’ എന്നു നൽകുക
  alternative: ‘അരുത്!’ അല്ലെങ്കിൽ ‘ചെയ്യാതിരിക്കാൻ നോക്കുക’
  rationale: മുൻസന്ദർഭത്തിലെ ദൂതാരാധനാശ്രമമാണ് വിലക്കപ്പെടുന്നതെന്ന് വ്യക്തമാണ്. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി പ്രവൃത്തി സൂചിപ്പിക്കുന്നത് പുതിയ ദൈവശാസ്ത്രവാദം ചേർക്കുന്നില്ല.
- issue: അധികാരം പങ്കിടുന്ന കൂട്ടങ്ങളുടെ ബന്ധം
  choice: നിനക്കും പ്രവാചകന്മാരായ സഹോദരന്മാർക്കും വചനങ്ങൾ പാലിക്കുന്നവർക്കും ഒപ്പമുള്ള സഹദാസൻ
  alternative: ദൂതൻ പ്രവാചകന്മാർക്കും വചനം പാലിക്കുന്നവർക്കും മാത്രം സഹദാസനാണെന്നു ചുരുക്കുക
  rationale: ഗ്രീക്ക് καί ഘടനയിൽ യോഹന്നാൻ, പ്രവാചകന്മാരായ സഹോദരന്മാർ, പുസ്തകവചനങ്ങൾ പാലിക്കുന്നവർ എന്നിവരെ ചേർത്ത് പറയുന്നു. ഇവ തമ്മിലുള്ള കൃത്യമായ വ്യാപ്തി അനാവശ്യമായി ഏകീകരിക്കാതെ പട്ടിക നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സഹദാസൻ’ എന്ന പദം സാധാരണ സംഭാഷണത്തിൽ അപൂർവമാണെങ്കിലും മൂലപദത്തിലെ പങ്കിട്ട ദാസസ്ഥിതി കൃത്യമായി സംരക്ഷിക്കുന്നതിനാൽ ഉപയോഗിച്ചു. കർത്തൃവാക്യമായ ‘ദൈവത്തെ ആരാധിക്കുക’ നേരിട്ടും ഗൗരവത്തോടെയും നിലനിർത്തി.
