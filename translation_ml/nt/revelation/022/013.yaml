id: REV.22.13
reference: Revelation 22:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: ml
  text: “ഞാൻ ആൽഫയും ഒമേഗയും, ആദ്യനും അന്ത്യനും, ആരംഭവും അവസാനവും ആകുന്നു.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഉത്ഭവവും ലക്ഷ്യവും.”'
    reason: ἀρχή എന്നതിന് ‘ഉത്ഭവം’ എന്നും τέλος എന്നതിന് ‘ലക്ഷ്യം’ എന്നും അർഥമാകാവുന്ന പദാർഥസാധ്യത സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഊന്നലോടെ നൽകിയിരിക്കുന്ന ഒന്നാംപുരുഷ സർവനാമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഞാൻ’ എന്നു നിലനിർത്തുന്നു.
- source_word: τὸ Ἄλφα
  choice: ആൽഫ
  rationale: ഗ്രീക്ക് അക്ഷരമാലയിലെ ആദ്യാക്ഷരത്തിന്റെ പേരും വെളിപ്പാടിലെ സ്ഥിരമായ പ്രതീകാത്മക ശീർഷകവുമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: τὸ Ὦ
  choice: ഒമേഗ
  rationale: ഗ്രീക്ക് അക്ഷരമാലയിലെ അവസാനാക്ഷരത്തിന്റെ പേരും അംഗീകൃത പ്രതീകാത്മക ശീർഷകവുമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: ὁ πρῶτος
  choice: ആദ്യൻ
  rationale: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ശീർഷകസ്വഭാവവും ‘അന്ത്യൻ’ എന്നതിനോടുള്ള സമാന്തരതയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὁ ἔσχατος
  choice: അന്ത്യൻ
  rationale: ‘ആദ്യൻ’ എന്നതിനുള്ള നേരിട്ടുള്ള ശീർഷകാത്മക പ്രതിയോഗിയായി ഗൗരവമുള്ള മലയാളപ്രയോഗം.
- source_word: ἡ ἀρχὴ
  choice: ആരംഭം
  rationale: ‘അവസാനം’ എന്നതിനോടുള്ള സാഹിത്യസമാന്തരത കാത്തുകൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ അർഥം നൽകുന്നു.
- source_word: τὸ τέλος
  choice: അവസാനം
  rationale: ഈ യുഗ്മത്തിൽ τέλος എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നൽകുകയും സമഗ്രത സൂചിപ്പിക്കുന്ന സമാന്തരഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മൂന്നു സമാന്തര സ്വയംവിശേഷണങ്ങളിലെ സമഗ്രാധിപത്യവും നിത്യതയും അതിവ്യാഖ്യാനിക്കാതെ അവതരിപ്പിക്കൽ
  choice: ഞാൻ ആൽഫയും ഒമേഗയും, ആദ്യനും അന്ത്യനും, ആരംഭവും അവസാനവും ആകുന്നു.
  alternative: ഞാൻ ആൽഫയും ഒമേഗയും, ആദ്യനും അന്ത്യനും, ഉത്ഭവവും ലക്ഷ്യവും ആകുന്നു.
  rationale: ഗ്രീക്കിലെ മൂന്നു ശീർഷകയുഗ്മങ്ങളുടെ സമമിതിയും ഗൗരവവും മുഖ്യവാചകം സംരക്ഷിക്കുന്നു. ἀρχή, τέλος എന്നിവയ്ക്ക് ‘ഉത്ഭവം’, ‘ലക്ഷ്യം’ എന്ന അർഥസാധ്യതകളുണ്ടെങ്കിലും അവ മുഖ്യവാചകത്തിൽ സ്വീകരിക്കുന്നത് പ്രസ്താവനയെ അനാവശ്യമായി വ്യാഖ്യാനിച്ചുറപ്പിച്ചേക്കാം; അതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആദ്യൻ/അന്ത്യൻ’ എന്ന രൂപങ്ങൾ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ശീർഷകഭാവം നിലനിർത്തുന്നു; ‘ആരംഭം/അവസാനം’ എന്ന രൂപങ്ങൾ അമൂർത്ത യുഗ്മത്തിന്റെ സമാന്തരത വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
