  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his servants will worship him[d][c][b],
translation:
  language: ml
  text: ഇനി യാതൊരു ശാപവും ഉണ്ടായിരിക്കുകയില്ല.[a] ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും സിംഹാസനം അതിൽ ഉണ്ടായിരിക്കും; അവന്റെ അടിമകൾ[b] അവനെ ആരാധിക്കും.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ശാപവിധേയമായ യാതൊന്നും’ അല്ലെങ്കിൽ ‘ശപിക്കപ്പെട്ട യാതൊരു വസ്തുവും.’'
    reason: lexical_alternative
  - marker: b
    text: ‘അടിമകൾ’ എന്ന മൂലപദത്തിന് ‘ദാസന്മാർ’ എന്നും വിവർത്തനം ചെയ്യാം; അത് ഒരാളുടെ ഉടമസ്ഥതയിലും പൂർണ വിധേയത്വത്തിലും ഉള്ളവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: ‘അവനെ സേവിക്കും’ അല്ലെങ്കിൽ ‘അവന് വിശുദ്ധസേവനം അർപ്പിക്കും.’'
    reason: lexical_alternative
  - marker: d
    text: ഗ്രീക്കിൽ ‘സിംഹാസനം’ ഏകവചനമാണ്; ‘ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും’ എന്നതിന് ശേഷം ‘അവന്റെ ... അവനെ’ എന്ന ഏകവചന സർവനാമങ്ങളാണ് വരുന്നത്. ഇങ്ങനെ ദൈവവും കുഞ്ഞാടും തമ്മിലുള്ള വ്യത്യാസവും അവരുടെ പങ്കിട്ട ഭരണവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: യാതൊരു ശാപവും
  rationale: κατάθεμα ഇവിടെ ശാപത്തെയോ ശാപവിധേയമായ വസ്തുവിനെയോ സൂചിപ്പിക്കാം. പുതിയ സൃഷ്ടിയിൽ ശാപം പൂർണമായി നീങ്ങുന്നതെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നതിനായി ‘യാതൊരു ശാപവും’ തെരഞ്ഞെടുത്തു; കൂടുതൽ മൂർത്തമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὐκ ἔσται ἔτι
  choice: ഇനി ... ഉണ്ടായിരിക്കുകയില്ല
  rationale: ഭാവികാല അസ്തിത്വനിഷേധവും ἔτι എന്നതിന്റെ ‘ഇനി ഒരിക്കലും/മേലാൽ’ എന്ന ഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ θρόνος
  choice: സിംഹാസനം
  rationale: സ്ഥിരമായ തുല്യപദം; ഗ്രീക്കിലെ ഏകവചനം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും
  rationale: രണ്ട് ബന്ധസൂചക ഘടകങ്ങളും വ്യക്തമായി നിലനിർത്തുന്നു. വെളിപ്പാടിലെ ബലിയർപ്പണപരവും മശീഹാപരവുമായ പ്രതീകത്തിന് ‘കുഞ്ഞാട്’ യോജിക്കുന്നു.
- source_word: ἐν αὐτῇ
  choice: അതിൽ
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുമ്പ് പരാമർശിച്ച നഗരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നഗരത്തെ സൂചിപ്പിക്കാൻ ‘അതിൽ’ സ്വാഭാവികമാണ്.
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: δοῦλοι ഉടമസ്ഥതയുടെയും പൂർണമായ വിധേയത്വത്തിന്റെയും ശക്തമായ അർഥം വഹിക്കുന്നതിനാൽ ‘അടിമകൾ’ ഉപയോഗിച്ചു. ‘ദാസന്മാർ/ശുശ്രൂഷകർ’ എന്ന മൃദുവായ വിവർത്തനങ്ങൾ ആ ശക്തി കുറയ്ക്കാം.
- source_word: λατρεύσουσιν
  choice: ആരാധിക്കും
  rationale: ദൈവസന്നിധിയിലെ വിശുദ്ധമോ ആരാധനാപരമോ ആയ സേവനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്. സിംഹാസനസന്ദർഭത്തിൽ ‘ആരാധിക്കും’ വ്യക്തവും സ്വാഭാവികവുമാണ്; ‘സേവിക്കും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: αὐτοῦ ... αὐτῷ
  choice: അവന്റെ ... അവനെ
  rationale: ‘ദൈവത്തിന്റെയും കുഞ്ഞാടിന്റെയും’ എന്ന രണ്ടു പരാമർശങ്ങൾക്കുശേഷവും മൂലപാഠം ഏകവചന സർവനാമങ്ങൾ ഉപയോഗിക്കുന്നു. ആ വ്യാകരണപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവവും കുഞ്ഞാടും എന്ന വ്യത്യസ്ത പരാമർശങ്ങൾക്കൊപ്പം ഏകവചന സിംഹാസനവും ഏകവചന സർവനാമങ്ങളും
  choice: ‘സിംഹാസനം ... അവന്റെ അടിമകൾ അവനെ ആരാധിക്കും’ എന്ന ഏകവചനരൂപങ്ങൾ നിലനിർത്തി.
  alternative: വ്യക്തതയ്ക്കായി ‘അവരുടെ ... അവരെ’ എന്ന ബഹുവചനം ഉപയോഗിക്കുക, അല്ലെങ്കിൽ സർവനാമം ഒഴിവാക്കി പരാവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം ദൈവത്തെയും കുഞ്ഞാടിനെയും വേർതിരിച്ചു പരാമർശിക്കുന്നതോടൊപ്പം ഒരു സിംഹാസനവും ഏകവചന സർവനാമങ്ങളും ഉപയോഗിക്കുന്നു. ഈ ഉദ്ദേശ്യപൂർവമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനം നിശ്ശബ്ദമായി പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യഘടന സ്വാഭാവികമാക്കിയെങ്കിലും ഏകവചന സിംഹാസനവും സർവനാമങ്ങളും ഉൾപ്പെടെയുള്ള മൂലപാഠത്തിന്റെ നിർണായക രൂപങ്ങൾ സംരക്ഷിച്ചു.
