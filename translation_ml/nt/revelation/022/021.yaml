id: REV.22.21
reference: Revelation 22:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μετὰ ⸀πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/021.yaml
  text: The grace of the Lord Jesus be with all[a].
translation:
  language: ml
  text: കർത്താവായ യേശുവിന്റെ കൃപ എല്ലാവരോടുംകൂടെ ഉണ്ടായിരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികൾ: “കർത്താവായ യേശുവിന്റെ കൃപ വിശുദ്ധന്മാരെല്ലാവരോടുംകൂടെ ഉണ്ടായിരിക്കട്ടെ”; മറ്റു ചിലത്: “നിങ്ങളെല്ലാവരോടുംകൂടെ ഉണ്ടായിരിക്കട്ടെ.”'
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പത്രസമാപന ആശീർവാദത്തിൽ ബന്ധപരവും രക്ഷാസംബന്ധവുമായ പുതിയനിയമ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്ഥാപിതമായ പദം.
- source_word: κυρίου
  choice: കർത്താവായ
  rationale: യേശുവിന്റെ ക്രിസ്തുസംബന്ധിയായ സ്ഥാനപ്പേരായി κύριος എന്നതിന്റെ സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളരൂപം; ‘കർത്താവായ യേശു’ എന്ന ഘടന ഉടമസ്ഥതാസംബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: μετὰ
  choice: ഒപ്പം / കൂടെ
  rationale: ഗ്രീക്കിൽ ക്രിയയില്ലെങ്കിലും ആശീർവാദവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഉണ്ടായിരിക്കട്ടെ’ ചേർത്ത് μετὰ എന്നത് ‘എല്ലാവരോടുംകൂടെ’ എന്നു നൽകി.
- source_word: πάντων
  choice: എല്ലാവരും
  rationale: SBLGNT പാഠത്തിലെ വിശേഷണമില്ലാത്ത, വിശാലമായ ‘എല്ലാവരും’ എന്ന അർത്ഥം നിലനിർത്തുന്നു; ‘നിങ്ങളെല്ലാവരും’ എന്നോ ‘വിശുദ്ധന്മാരെല്ലാവരും’ എന്നോ വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: ആശീർവാദം ലഭിക്കുന്നവരെ വ്യക്തമായി നിർവചിക്കണമോ
  choice: ‘എല്ലാവരോടുംകൂടെ’ എന്ന വിശാലവും അനിർവചിതവുമായ രൂപം
  alternative: ‘നിങ്ങളെല്ലാവരോടുംകൂടെ’ അല്ലെങ്കിൽ ‘വിശുദ്ധന്മാരെല്ലാവരോടുംകൂടെ’
  rationale: അടിസ്ഥാന ഗ്രീക്ക് പാഠം πάντων എന്നു മാത്രം വായിക്കുന്നു. അതിനാൽ മറ്റു പാഠപരമ്പരകളിലെ സ്വീകർത്താക്കളെ മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ യഥാർഥമായ വ്യാപ്തിയും അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആശീർവാദശൈലി. ഗ്രീക്കിലെ ക്രിയാരഹിത ഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഉണ്ടായിരിക്കട്ടെ’ ചേർത്തു; പാഠത്തിലെ πάντων എന്നതിന്റെ അനിർവചിത വ്യാപ്തി നിലനിർത്തി.
