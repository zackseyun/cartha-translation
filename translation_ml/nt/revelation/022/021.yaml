  source_fidelity: 'മുഖ്യപാഠം Ἡ χάρις τοῦ κυρίου Ἰησοῦ μετὰ πάντων എന്നതിനെ വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു: ‘കൃപ,’ ‘കർത്താവായ യേശു,’ ‘എല്ലാവരോടുംകൂടെ’ എന്നിവ യഥാക്രമം χάρις, κυρίου Ἰησοῦ, μετὰ πάντων എന്നിവയുടെ അർത്ഥവും അനിർവചിതമായ വ്യാപ്തിയും നിലനിർത്തുന്നു. ഗ്രീക്കിലെ ക്രിയാരഹിത ആശീർവാദരൂപം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഉണ്ടായിരിക്കട്ടെ’ ചേർത്തത് ന്യായമാണ്.'
