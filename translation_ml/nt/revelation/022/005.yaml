source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: ml
  text: ഇനി രാത്രി ഉണ്ടാകുകയില്ല. അവർക്കു വിളക്കിന്റെ വെളിച്ചത്തിന്റെയോ സൂര്യപ്രകാശത്തിന്റെയോ ആവശ്യമുണ്ടാകുകയില്ല; കാരണം, കർത്താവായ ദൈവം അവരുടെമേൽ പ്രകാശിക്കും. അവർ എന്നെന്നേക്കും വാഴും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ: ‘യുഗങ്ങളുടെ യുഗങ്ങളോളം’; അവസാനമില്ലാത്ത കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ οὐκ ἔσται ἔτι
  choice: ഇനി രാത്രി ഉണ്ടാകുകയില്ല
  rationale: രാത്രി ഇനിയുണ്ടാകില്ലെന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἔχουσιν χρείαν
  choice: അവർക്കു ആവശ്യമുണ്ടാകുകയില്ല
  rationale: ഗ്രീക്കിൽ വർത്തമാനകാലരൂപമാണെങ്കിലും ചുറ്റുമുള്ള ഭാവികാല ക്രിയകളും സമാപനദർശനത്തിന്റെ പശ്ചാത്തലവും കണക്കിലെടുത്ത് മലയാളത്തിൽ ഭാവികാലം ഉപയോഗിച്ചു.
- source_word: φωτὸς λύχνου καὶ φῶς ἡλίου
  choice: വിളക്കിന്റെ വെളിച്ചമോ സൂര്യന്റെ വെളിച്ചമോ
  rationale: രണ്ടു പ്രകാശസ്രോതസ്സുകളെയും വ്യക്തമായി നിലനിർത്തുന്നു; നിഷേധവാക്യത്തിൽ മലയാളത്തിന് സ്വാഭാവികമായ ‘-ഓ ... -ഓ’ ഘടന ഉപയോഗിച്ചു.
- source_word: κύριος ὁ θεός
  choice: കർത്താവായ ദൈവം
  rationale: κύριος എന്നതിന് പതിവായ ‘കർത്താവ്’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് സംയുക്ത വിശേഷണം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: അവരുടെമേൽ പ്രകാശിക്കും
  rationale: ἐπί സൂചിപ്പിക്കുന്ന ദിശാബോധവും പ്രകാശത്തിന്റെ ദൃശ്യബിംബവും സംരക്ഷിക്കുന്നു.
- source_word: βασιλεύσουσιν
  choice: വാഴും
  rationale: രാജാധികാരത്തോടെ ഭരിക്കുക എന്ന ക്രിയയുടെ അർഥം ചുരുക്കവും തിരുവെഴുത്തുശൈലിക്ക് യോജിച്ചതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തത്തുല്യം.
theological_decisions:
- issue: ഭാവിദർശനത്തിലെ οὐκ ἔχουσιν χρείαν എന്ന വർത്തമാനകാലരൂപത്തിന്റെ സമയസൂചന
  choice: മലയാളത്തിൽ ‘ആവശ്യമുണ്ടാകുകയില്ല’ എന്ന ഭാവികാലരൂപം
  alternative: ‘ആവശ്യമില്ല’ എന്ന വർത്തമാനകാലരൂപം
  rationale: മൂലത്തിലെ വർത്തമാനകാലം ദർശനത്തെ സജീവമായി വിവരിക്കാമെങ്കിലും, ἔσται, φωτίσει, βασιλεύσουσιν എന്നീ ഭാവികാലരൂപങ്ങളോടുള്ള യോജിപ്പിനായി ഭാവികാലം സ്വീകരിച്ചു; അർഥത്തിൽ നിർണായകമായ മാറ്റമില്ല.
- issue: κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: ഈ ദൈവസംബന്ധിയായ സന്ദർഭത്തിൽ ‘കർത്താവ്’ സ്വാഭാവികവും വ്യാപകമായി മനസ്സിലാക്കപ്പെടുന്നതുമായ തത്തുല്യമാണ്; പ്രത്യേക സമ്പ്രദായപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാവുന്നതും വെളിപ്പാട് സാഹിത്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമായ ശൈലി. ചെറുവാക്യങ്ങളും വ്യക്തമായ പ്രകാശബിംബവും ഉപയോഗിച്ചു; സമ്പ്രദായവിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
