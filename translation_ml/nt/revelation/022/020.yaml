source:
  edition: SBLGNT
  text: Λέγει ὁ μαρτυρῶν ταῦτα· Ναί· ἔρχομαι ταχύ. Ἀμήν· ⸀ἔρχου, κύριε Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/020.yaml
  text: The one who testifies to these things says[a], “Yes, I am coming soon.” Amen. Come, Lord Jesus.
translation:
  language: ml
  text: 'ഈ കാര്യങ്ങൾക്ക് സാക്ഷ്യം പറയുന്നവൻ പറയുന്നു: “അതെ, ഞാൻ ഉടൻ വരുന്നു.[a]” ആമേൻ. കർത്താവായ യേശുവേ, വരണമേ!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ വേഗത്തിൽ വരുന്നു.” ഗ്രീക്ക് ക്രിയാവിശേഷണം കാലത്തിലെ സാമീപ്യത്തെയോ വരവിന്റെ അല്ലെങ്കിൽ പ്രവർത്തനത്തിന്റെ വേഗത്തെയോ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: അരുളിച്ചെയ്യുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ ഇപ്പോഴത്തെ പ്രസ്താവനാഭാവം നിലനിർത്തുന്നു; യേശുവിന്റെ നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നതിന് മലയാളത്തിൽ സ്വാഭാവികവും ആദരസൂചകവുമായ പ്രയോഗം.
- source_word: ὁ μαρτυρῶν
  choice: സാക്ഷ്യം പറയുന്നവൻ
  rationale: വർത്തമാനകാല കൃ വ്യന്തത്തിന്റെ തുടർച്ചയായ സാക്ഷ്യഭാവവും μαρτυρέω എന്ന പദത്തിന്റെ സാക്ഷി/സാക്ഷ്യ അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ταῦτα
  choice: ഇക്കാര്യങ്ങൾ
  rationale: ബഹുവചന നിർദ്ദേശകപദം വെളിപ്പാടിൽ പറഞ്ഞിരിക്കുന്ന കാര്യങ്ങളിലേക്കു ചൂണ്ടുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ναί
  choice: അതെ
  rationale: അധിക വ്യാഖ്യാനഭാരം ചേർക്കാതെ നേരിട്ടുള്ള സമ്മതം പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔρχομαι
  choice: ഞാൻ വരുന്നു
  rationale: ഭാവിയിലേക്കു ദൃഷ്ടിയുള്ള ഗ്രീക്ക് വർത്തമാനരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉറപ്പുള്ള പ്രഖ്യാപനമായി നൽകുന്നു.
- source_word: ταχύ
  choice: ഉടൻ
  rationale: ഈ സന്ദർഭത്തിൽ കാലസാമീപ്യത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; വേഗത്തിലുള്ള വരവ് എന്ന സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: Ἀμήν
  choice: ആമേൻ
  rationale: ആരാധനാപരവും പ്രാർഥനാപരവുമായ സമ്മതത്തെ പാരമ്പര്യവും പൊതുവെ മനസ്സിലാകുന്നതുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔρχου
  choice: വരണമേ
  rationale: നേരിട്ടുള്ള അഭ്യർഥനയുടെ അടിയന്തരത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ ആദരപൂർവമായ പ്രാർഥനാഭാഷയിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: κύριε
  choice: കർത്താവായ
  rationale: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριος എന്ന സ്ഥാനപ്പേരിന്റെ ആദരവും പുതിയനിയമത്തിലെ സ്ഥാപിത പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: Ἰησοῦ
  choice: യേശുവേ
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം സംബോധനാവിഭക്തിയിൽ നൽകുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ വരവിനെക്കുറിച്ചുള്ള വാഗ്ദാനത്തിൽ ταχύ എന്ന പദത്തിന്റെ അർഥം
  choice: ഉടൻ
  alternative: വേഗത്തിൽ
  rationale: ταχύ കാലസാമീപ്യത്തെയോ വരവിന്റെ/പ്രവർത്തനത്തിന്റെ വേഗത്തെയോ സൂചിപ്പിക്കാം. സമാപനവാഗ്ദാനത്തിന്റെയും തുടർന്നുള്ള പ്രാർഥനയുടെയും പശ്ചാത്തലത്തിൽ ‘ഉടൻ’ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാണ്; എന്നാൽ ദൈവശാസ്ത്രപരമായി പ്രസക്തമായ മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ വാക്യത്തിന്റെ ആരാധനാപരമായ ഗൗരവം കാത്തുസൂക്ഷിക്കുന്ന മലയാളം. ‘അരുളിച്ചെയ്യുന്നു’, ‘വരണമേ’ എന്നീ രൂപങ്ങൾ സന്ദർഭോചിതമായ ആദരം നൽകുന്നു; അതിരുകടന്ന പുരാതനഭാഷ ഒഴിവാക്കിയിരിക്കുന്നു.
