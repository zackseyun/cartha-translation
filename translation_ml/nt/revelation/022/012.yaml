id: REV.22.12
reference: Revelation 22:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: ml
  text: “ഇതാ, ഞാൻ വേഗം[a] വരുന്നു; ഓരോരുത്തന് തന്റെ പ്രവൃത്തി എങ്ങനെയാണോ അതനുസരിച്ച് നൽകാനുള്ള എന്റെ പ്രതിഫലം എന്നോടുകൂടെയുണ്ട്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വേഗത്തിൽ.” ഗ്രീക്ക് ταχύ എന്ന പദം വരവിന്റെ സമീപ്യതയെയോ (“വേഗം,” “താമസിയാതെ”), അതിന്റെ ദ്രുതതയെയോ (“വേഗത്തിൽ”) ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: പ്രവാചകീയവും വെളിപ്പാടുസാഹിത്യപരവുമായ ശ്രദ്ധാകർഷണം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔρχομαι
  choice: ഞാൻ ... വരുന്നു
  rationale: സന്ദർഭത്തിൽ ഭാവിയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലരൂപം മലയാളത്തിലെ ‘വരുന്നു’ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: ταχύ
  choice: വേഗം
  rationale: ‘വേഗം’ എന്നത് സമീപകാലത്തെയും ദ്രുതതയെയും സൂചിപ്പിക്കാൻ കഴിയുന്നതിനാൽ ഗ്രീക്ക് പദത്തിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു; വ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ μισθός μου
  choice: പ്രതിഫലം
  rationale: μισθός എന്ന പദത്തിലെ പ്രതിഫലത്തിന്റെയും ചെയ്തതിനുള്ള മടക്കനൽകലിന്റെയും ആശയം വാണിജ്യഭാവം അമിതമാക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടുകൂടെയുണ്ട്
  rationale: ഗ്രീക്കിൽ സൂചിതമായിരിക്കുന്ന ‘ഉണ്ട്’ ചേർത്ത് സ്വാഭാവികവും പൂർണ്ണവുമായ മലയാളവാക്യമാക്കുന്നു.
- source_word: ἀποδοῦναι
  choice: നൽകാനുള്ള
  rationale: ഓരോരുത്തന്റെയും പ്രവൃത്തിക്കനുസരിച്ചുള്ള പ്രതിഫലം നൽകുക എന്ന ഉദ്ദേശ്യം സന്ദർഭസഹജമായി പകർന്നു നൽകുന്നു; ന്യായവിധിയുടെ സ്വഭാവത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἑκάστῳ
  choice: അവനവന്
  rationale: വിതരണാത്മകമായ ഏകവചനാർത്ഥവും ഓരോ വ്യക്തിയുടെയും ഉത്തരവാദിത്വവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὡς τὸ ἔργον ἐστὶν αὐτοῦ
  choice: ഓരോരുത്തന്റെയും പ്രവൃത്തി എങ്ങനെയാണോ അതനുസരിച്ച്
  rationale: ἔργον എന്ന നാമപദവും ἐστίν എന്ന ക്രിയാരൂപവും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് വിധിയുടെ മാനദണ്ഡം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἑκάστῳ ... αὐτοῦ എന്നതിലെ ലിംഗപ്രതിനിധാനം
  choice: ഓരോരുത്തന്റെയും ... അവനവന്
  alternative: ഓരോ വ്യക്തിയുടെയും ... ആ വ്യക്തിക്ക്
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായെങ്കിലും പ്രതിനിധാനാർഥമുള്ള രൂപം മലയാളത്തിൽ സാധാരണയായി എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന ‘ഓരോരുത്തൻ/അവനവൻ’ പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- issue: പ്രവൃത്തിക്കനുസരിച്ചുള്ള പ്രതിഫലത്തിന്റെ സ്വഭാവം
  choice: പ്രവൃത്തി എങ്ങനെയാണോ അതനുസരിച്ച് ... പ്രതിഫലം
  alternative: ചെയ്ത പ്രവൃത്തികൾക്കനുസരിച്ച് പ്രതിഫലം
  rationale: വചനം പറയുന്ന വ്യക്തിഗത പ്രതിഫലവും പ്രവൃത്തിയുമായുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു; അന്തിമരക്ഷയുടെ അടിസ്ഥാനത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം, എന്നാൽ വെളിപ്പാടുപുസ്തകത്തിന്റെ ഗൗരവമുള്ള പ്രവാചകീയ ശൈലി നിലനിർത്തിയാണ് പരിഭാഷ. ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷകവും ‘എന്നോടുകൂടെയുണ്ട്’ എന്ന ഉയർന്നെങ്കിലും സ്വാഭാവികമായ പ്രയോഗവും അതിനായി തെരഞ്ഞെടുത്തു.
