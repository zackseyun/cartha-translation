id: REV.11.7
reference: Revelation 11:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ സാക്ഷ്യം പൂർത്തിയാക്കുമ്പോൾ, അഗാധഗർത്തത്തിൽനിന്ന് കയറിവരുന്ന മൃഗം അവരോടു യുദ്ധം ചെയ്യുകയും[a] അവരെ ജയിക്കുകയും കൊല്ലുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർക്കെതിരെ യുദ്ധം ചെയ്യുകയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τελέσωσιν
  choice: പൂർത്തിയാക്കുമ്പോൾ
  rationale: ὅταν-നോടുകൂടിയ aorist subjunctive ഭാവിയിലെ സന്ദർഭസാധ്യതയെ സൂചിപ്പിക്കുന്നു. ‘പൂർത്തിയാക്കുമ്പോൾ’ നിയോഗിക്കപ്പെട്ട സാക്ഷ്യം സമാപിപ്പിക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μαρτυρίαν
  choice: സാക്ഷ്യം
  rationale: ‘സാക്ഷ്യം’ എന്നത് testimony/witness എന്ന രണ്ടു ബന്ധിത ആശയങ്ങളെയും ഉൾക്കൊള്ളുകയും വെളിപ്പാടുപുസ്തകത്തിലെ സാക്ഷ്യംവഹിക്കൽ എന്ന പ്രമേയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാടുപുസ്തകത്തിന്റെ ദർശനാത്മക പശ്ചാത്തലത്തിൽ θηρίον എന്നതിന് വ്യക്തവും പതിവുമായ തുല്യപദമാണ് ‘മൃഗം’; ‘വന്യമൃഗം’ എന്നു ചേർക്കേണ്ട ആവശ്യമില്ല.
- source_word: ἀναβαῖνον
  choice: കയറിവരുന്ന
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ സജീവമായ ചലനം സ്വാഭാവിക മലയാളത്തിൽ ബന്ധവാക്യമായി നിലനിർത്തുന്നു.
- source_word: ἀβύσσου
  choice: അഗാധഗർത്തം
  rationale: അളക്കാനാകാത്ത ആഴമുള്ള അധോലോകസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ἄβυσσος എന്ന പദത്തെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു; ‘അടിത്തട്ടില്ലാത്ത കുഴി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: അവരോടു യുദ്ധം ചെയ്യുകയും
  rationale: μετά + genitive എന്ന ഘടനയിലെ ‘അവരോടു’ എന്ന രൂപം നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘അവരോടു യുദ്ധം ചെയ്യുക’ എന്നത് ശത്രുതാപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: νικήσει
  choice: ജയിക്കുകയും
  rationale: νικάω എന്നതിലെ കീഴടക്കൽ/വിജയിക്കൽ ആശയം സംഘർഷത്തിന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀποκτενεῖ
  choice: കൊല്ലുകയും
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ആധുനികവും വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: ποιήσει μετ’ αὐτῶν πόλεμον എന്നതിലെ ശത്രുതാപരമായ ബന്ധം
  choice: അവരോടു യുദ്ധം ചെയ്യുകയും
  alternative: അവർക്കെതിരെ യുദ്ധം ചെയ്യുകയും
  rationale: ഗ്രീക്കിലെ μετά + genitive-നെ ‘അവരോടു’ എന്നു അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘ജയിക്കുകയും കൊല്ലുകയും’ എന്ന ക്രിയകളും മലയാളത്തിലെ പ്രയോഗവും ശത്രുത സംശയരഹിതമാക്കുന്നു; ‘അവർക്കെതിരെ’ എന്നത് അർഥം കൂടുതൽ തുറന്നുപറയുന്ന സാധുവായ മറ്റൊരു രൂപമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ക്രിയാക്രമവും ദർശനാത്മക ദൃശ്യഭാഷയും നിലനിർത്തി. പാദക്കുറിപ്പ് യഥാർഥത്തിൽ വ്യത്യസ്തമായി വിവർത്തനം ചെയ്യാവുന്ന യുദ്ധപ്രയോഗത്തോടാണ് ചേർത്തിരിക്കുന്നത്.
