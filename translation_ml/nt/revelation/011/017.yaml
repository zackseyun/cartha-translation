reference: Revelation 11:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες· Εὐχαριστοῦμέν σοι, κύριε, ὁ θεός, ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην καὶ ἐβασίλευσας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: ml
  text: 'ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്: “കർത്താവേ, ദൈവമേ, സർവശക്തനേ, ഉള്ളവനും ഉണ്ടായിരുന്നവനുമായ[a] അങ്ങേക്കു ഞങ്ങൾ നന്ദി അർപ്പിക്കുന്നു; കാരണം അങ്ങ് അങ്ങയുടെ മഹാശക്തി കൈക്കൊണ്ട് രാജാവായി ഭരിക്കാൻ തുടങ്ങിയിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉള്ളവനും ഉണ്ടായിരുന്നവനും.’ വെളിപ്പാടിലെ മറ്റു ചില ഇടങ്ങളിലെ കൈയെഴുത്തുപ്രതികളിലും പരിഭാഷകളിലും ‘വരാനിരിക്കുന്നവനും’ എന്നു കാണാം; എന്നാൽ ഇവിടെയുള്ള ഗ്രീക്ക് പാഠത്തിൽ ആ വാക്കുകളില്ല.
    reason: textual_variant
  - marker: b
    text: അഥവാ, ‘ഭരിച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘രാജാവായിരിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് രാജഭരണത്തിന്റെ ആരംഭത്തെയോ അതിന്റെ പ്രയോഗത്തെയോ ഊന്നിക്കാട്ടാം; ഇവിടെ ദൈവത്തിന്റെ ഭരണം പരസ്യമായി പ്രകടമാകുന്നതാണ് സൂചിപ്പിക്കുന്നതെന്ന് തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ മൂപ്പന്മാരുടെ പ്രവർത്തനവുമായി ഈ വാക്കുകളെ ബന്ധിപ്പിക്കുന്ന വർത്തമാനകാല കർത്തൃക്രിയാവിശേഷണത്തിന്റെ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: Εὐχαριστοῦμέν σοι
  choice: അങ്ങേക്കു ഞങ്ങൾ നന്ദി അർപ്പിക്കുന്നു
  rationale: നന്ദി പറയുക എന്ന അടിസ്ഥാനാർഥവും സ്വർഗീയ ആരാധനയ്ക്കു യോജിച്ച മാന്യവും ആരാധനാത്മകവുമായ ഭാവവും നൽകുന്നു.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: സർവശക്തനായ കർത്താവായ ദൈവമേ
  rationale: മൂന്നു ദൈവിക വിശേഷണങ്ങളെയും അഭിസംബോധനാരൂപത്തിൽ സ്വാഭാവികമായ മലയാളക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: ഇരിക്കുന്നവനും ഉണ്ടായിരുന്നവനുമായ
  rationale: വർത്തമാനവും ഭൂതകാലവും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രൂപങ്ങൾ നിലനിർത്തുന്നു; മൂലപാഠത്തിലില്ലാത്ത ‘വരാനിരിക്കുന്നവൻ’ എന്ന ഭാഗം ചേർക്കുന്നില്ല.
- source_word: εἴληφας τὴν δύναμίν σου τὴν μεγάλην
  choice: അങ്ങ് അങ്ങയുടെ മഹാശക്തി ഏറ്റെടുത്ത്
  rationale: പൂർത്തിയായതും ഇപ്പോഴും പ്രസക്തിയുള്ളതുമായ പ്രവർത്തനത്തെ ‘ഏറ്റെടുത്ത്’ എന്ന രൂപം പ്രകടിപ്പിക്കുന്നു; δύναμις, μεγάλη എന്നിവ ‘മഹാശക്തി’യായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: ἐβασίλευσας
  choice: രാജഭരണം ആരംഭിച്ചിരിക്കുന്നു
  rationale: രാജകീയ ഭരണം ആരംഭിക്കുകയോ നിർണായകമായി പ്രയോഗിക്കുകയോ ചെയ്യുന്ന സന്ദർഭസാധ്യമായ ഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ദൈവം അതിനു മുമ്പ് പരമാധികാരിയായിരുന്നില്ല എന്ന നിഗമനം നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവിക നാമവിശേഷണത്തിൽ ‘വരാനിരിക്കുന്നവൻ’ എന്ന ഭാഗം ചേർക്കണോ എന്നത്
  choice: ഇരിക്കുന്നവനും ഉണ്ടായിരുന്നവനുമായ
  alternative: ഇരിക്കുന്നവനും ഉണ്ടായിരുന്നവനും വരാനിരിക്കുന്നവനുമായ
  rationale: SBLGNT പാഠത്തിൽ ὁ ὢν καὶ ὁ ἦν മാത്രമാണുള്ളത്. വെളിപ്പാടിലെ മറ്റു സമാന പ്രയോഗങ്ങളോട് ഒത്തുചേർക്കാതെ ഇവിടെ കാണുന്ന ചുരുക്കരൂപം അതേപടി സംരക്ഷിക്കുന്നു.
- issue: ἐβασίλευσας എന്ന ക്രിയയുടെ ഭാവം
  choice: രാജഭരണം ആരംഭിച്ചിരിക്കുന്നു
  alternative: ഭരിച്ചു / രാജാവായിരിക്കുന്നു
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിന്റെ രാജകീയ ഭരണത്തിന്റെ നിർണായകമായ ആരംഭമോ പരസ്യപ്രകടനമോ ആഘോഷിക്കപ്പെടുന്നു. ദൈവത്തിന്റെ ശാശ്വത പരമാധികാരത്തെക്കുറിച്ച് പാഠം പറയാത്ത വിധത്തിൽ ഒരു നിഷേധം ഇറക്കുമതി ചെയ്യാതെ ആരംഭഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും ആരാധനാത്മകവുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ച് ആദരസൂചകത നിലനിർത്തി. ഗ്രീക്ക് പാഠത്തിലെ ആവർത്തനവും കാലസൂചനയും കഴിയുന്നത്ര സ്വാഭാവികമായി സംരക്ഷിച്ചു.
