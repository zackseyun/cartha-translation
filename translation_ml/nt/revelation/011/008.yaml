reference: Revelation 11:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: ml
  text: അവരുടെ മൃതദേഹം[b] ആ മഹാനഗരത്തിന്റെ തെരുവിൽ കിടക്കുന്നു. ആ നഗരത്തെ ആത്മികമായി[a] സൊദോം എന്നും ഈജിപ്ത് എന്നും വിളിക്കുന്നു; അവിടെ അവരുടെ കർത്താവും ക്രൂശിക്കപ്പെട്ടു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മികമായി’ എന്നതിന് ‘പ്രതീകാത്മകമായി’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘മൃതശരീരം’ ഏകവചനത്തിലാണ്; രണ്ടു സാക്ഷികളെയും ഒരു ഏകകമായി അവതരിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം. ചില പരിഭാഷകൾ ‘മൃതശരീരങ്ങൾ’ എന്നു ബഹുവചനത്തിൽ നൽകുന്നു.
    reason: alternative_reading
  - marker: c
    text: ‘അവരുടെ കർത്താവ് ക്രൂശിക്കപ്പെട്ട’ സ്ഥലം എന്ന പരാമർശം യെരൂശലേമിലേക്കു വിരൽചൂണ്ടുന്നു; എങ്കിലും പാഠം ‘മഹാനഗരം’ എന്ന പ്രതീകാത്മക വിശേഷണം നിലനിർത്തുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: അവരുടെ മൃതദേഹം
  rationale: πτῶμα ഏകവചനമായതിനാൽ, രണ്ടു സാക്ഷികളെ ഒരു ഘടകമായി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം നിലനിർത്തുന്നു. ‘മൃതശരീരം’ എന്നതിനെക്കാൾ ‘മൃതദേഹം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: ἐπὶ τῆς πλατείας
  choice: തെരുവിൽ
  rationale: πλατεῖα വിശാലമായ തെരുവിനെയോ പൊതുചത്വരത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ഉറപ്പില്ലാത്ത പ്രത്യേകീകരണം ഒഴിവാക്കി സ്വാഭാവികമായ ‘തെരുവിൽ’ സ്വീകരിച്ചു.
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: ആ മഹാനഗരത്തിന്റെ
  rationale: വെളിപ്പാടിലെ പ്രാധാന്യമുള്ള ‘മഹാനഗരം’ എന്ന വിശേഷണം നിലനിർത്തുന്നു; മുൻസന്ദർഭത്തിലെ നിർദ്ദിഷ്ട നഗരത്തെ സൂചിപ്പിക്കാൻ ‘ആ’ ചേർത്തു.
- source_word: πνευματικῶς
  choice: ആത്മികമായി
  rationale: അക്ഷരാർഥത്തോട് അടുത്തതും ആത്മിക/പ്രതീകാത്മക നാമകരണത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ തുറന്ന അർഥം നിലനിർത്തുന്നതുമായ പരിഭാഷ.
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: സൊദോം എന്നും ഈജിപ്ത് എന്നും
  rationale: സ്ഥലനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകി; അവയുടെ പ്രതീകാത്മക സൂചനകൾ മുഖ്യവാചകത്തിൽ വിശദീകരിച്ചിട്ടില്ല.
- source_word: ὅπου καὶ
  choice: അവിടെത്തന്നെയാണ് … വും
  rationale: ὅπου എന്ന സ്ഥലസൂചനയും καί എന്ന കൂട്ടിച്ചേർക്കൽഭാവവും സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁ κύριος αὐτῶν
  choice: അവരുടെ കർത്താവ്
  rationale: κύριος എന്ന ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള പദത്തിന് മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായ ‘കർത്താവ്’ ഉപയോഗിച്ചു.
- source_word: ἐσταυρώθη
  choice: ക്രൂശിക്കപ്പെട്ടത്
  rationale: σταυρόω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിപ്രയോഗം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: രണ്ടു സാക്ഷികളെ സൂചിപ്പിക്കുന്ന αὐτῶν-നോടൊപ്പം ഏകവചനത്തിലുള്ള πτῶμα
  choice: ‘അവരുടെ മൃതദേഹം’ എന്ന ഏകവചനം നിലനിർത്തി.
  alternative: ‘അവരുടെ മൃതദേഹങ്ങൾ’ എന്ന ബഹുവചനം.
  rationale: സാക്ഷികൾ രണ്ടുപേരാണെങ്കിലും SBLGNT-യിൽ നാമം ഏകവചനത്തിലാണ്. അവരെ ഒരു ഏകകമായി കാണിക്കുന്ന ആലങ്കാരിക പ്രഭാവം പരിഭാഷയിൽ മായ്ച്ചുകളയാതിരിക്കാനാണ് ഏകവചനം സ്വീകരിച്ചത്.
- issue: πνευματικῶς എന്നതിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘ആത്മികമായി’.
  alternative: ‘പ്രതീകാത്മകമായി’ അല്ലെങ്കിൽ ‘രൂപകമായി’.
  rationale: ഗ്രീക്കിലെ ആത്മികമായ ഭാഷ നേരിട്ട് നിലനിർത്തുന്നു; അതിനെ വെറും സാഹിത്യരൂപകമായി ചുരുക്കുന്നില്ല. വായനാസഹായത്തിനായി പകരം അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ‘മഹാനഗരം’ ഏത് നഗരമാണെന്ന തിരിച്ചറിയൽ
  choice: മുഖ്യവാചകത്തിൽ നഗരം ‘മഹാനഗരം’ എന്നുതന്നെ നിലനിർത്തി.
  alternative: ‘യെരൂശലേം’ എന്ന് നേരിട്ട് വ്യക്തമാക്കുക.
  rationale: കർത്താവ് ക്രൂശിക്കപ്പെട്ട സ്ഥലം എന്ന വാക്യം യെരൂശലേമിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും, ഗ്രീക്ക് പാഠം നഗരത്തിന് പ്രതീകാത്മകമായ പേരുകളാണ് നൽകുന്നത്. അതിനാൽ അപോകലിപ്റ്റിക് സംഘർഷം വ്യാഖ്യാനത്തിലൂടെ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഗ്രീക്കിലെ നീണ്ട ബന്ധവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; എന്നാൽ ആശയബന്ധവും പ്രതീകാത്മക സംഘർഷവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദത്തിനോ വാക്യത്തിനോ ചേർത്ത് സ്ഥാപിച്ചു.
