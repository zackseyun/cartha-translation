  terminology: ‘മഹാനഗരം,’ ‘ആത്മികമായി,’ ‘സൊദോം,’ ‘ഈജിപ്ത്,’ and ‘കർത്താവ്’ are appropriate. The notes preserve the corporate singular, the semantic range of πνευματικῶς, and the implicit allusion to Jerusalem.
