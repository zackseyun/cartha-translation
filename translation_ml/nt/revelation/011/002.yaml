id: REV.11.2
reference: Revelation 11:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: ml
  text: എന്നാൽ ആലയത്തിനു പുറത്തുള്ള പ്രാകാരം ഒഴിവാക്കുക[a]; അതിനെ അളക്കരുത്. കാരണം, അത് ജനതകൾക്കു[b] നൽകപ്പെട്ടിരിക്കുന്നു; അവർ വിശുദ്ധനഗരത്തെ നാല്പത്തിരണ്ട് മാസം ചവിട്ടിമെതിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘വിശുദ്ധമന്ദിരത്തിനു പുറത്തുള്ള പ്രാകാരം.’ ഗ്രീക്ക് പദമായ ναός മുഴുവൻ ആലയസമുച്ചയത്തേക്കാൾ പ്രത്യേകമായി വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘വിജാതീയർക്കു.’ ഗ്രീക്ക് പദമായ ἔθνεσιν സന്ദർഭമനുസരിച്ച് ‘ജനതകൾ’ എന്നോ ‘വിജാതീയർ’ എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλή
  choice: പ്രാകാരം
  rationale: ആലയസന്ദർഭത്തിലെ ചുറ്റുമതിലിനുള്ളിലുള്ള തുറസ്സായ പ്രാകാരത്തെ സ്വാഭാവികവും കൃത്യവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: ആലയത്തിനു പുറത്തുള്ള
  rationale: പ്രാകാരം ναός-നു പുറത്താണെന്ന സ്ഥലപരമായ വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ναός
  choice: ആലയം
  rationale: വായനാസൗകര്യമുള്ള പൊതുപദം തെരഞ്ഞെടുത്തു; കൂടുതൽ സവിശേഷമായ ‘വിശുദ്ധമന്ദിരം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἔκβαλε ἔξωθεν
  choice: ഒഴിവാക്കുക
  rationale: അടുത്തുള്ള ‘അളക്കരുത്’ എന്ന കല്പനയോടു ചേർന്ന്, അളവെടുപ്പിൽ ഉൾപ്പെടുത്താതിരിക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥത്തിലുള്ള പുറത്തേക്കെറിയൽ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: അതിനെ അളക്കരുത്
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള നിരോധനകല്പനയുടെ ശക്തി നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐδόθη
  choice: നൽകപ്പെട്ടിരിക്കുന്നു
  rationale: കർമ്മണിപ്രയോഗം നിലനിർത്തി, നൽകുന്ന കർത്താവിനെ വാക്യത്തിൽ വ്യക്തമാക്കാതെ വിടുന്നു; ലഭിച്ചിരിക്കുന്ന ഇപ്പോഴത്തെ അവസ്ഥയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τοῖς ἔθνεσιν
  choice: ജനതകൾക്കു
  rationale: രാഷ്ട്രീയ-സാമൂഹിക കൂട്ടങ്ങളെ സൂചിപ്പിക്കാവുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘വിജാതീയർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πόλιν τὴν ἁγίαν
  choice: വിശുദ്ധനഗരം
  rationale: ദർശനത്തിലെ നഗരത്തെ അതിലധികം തിരിച്ചറിയിച്ചുപറയാതെ, ഗ്രീക്ക് വിശേഷണവും നാമവും സംക്ഷിപ്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: πατήσουσιν
  choice: ചവിട്ടിമെതിക്കും
  rationale: ശത്രുതാപരമായ അപമാനവും അധീനപ്പെടുത്തലും ഉൾക്കൊള്ളുന്ന ക്രിയയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: നാല്പത്തിരണ്ട് മാസം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അപ്പോക്കലിപ്റ്റിക് ആലയദൃശ്യത്തിൽ ναός എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ആലയം’
  alternative: ‘വിശുദ്ധമന്ദിരം’
  rationale: ‘ആലയം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; എന്നാൽ ഇവിടെ ναός മുഴുവൻ ആലയസമുച്ചയത്തേക്കാൾ പ്രത്യേകമായി വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കാം. ദർശനത്തിന്റെ വ്യാഖ്യാനത്തെ ബാധിക്കാവുന്ന ഈ വ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἔθνεσιν എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ജനതകൾക്കു’
  alternative: ‘വിജാതീയർക്കു’
  rationale: ഗ്രീക്ക് പദത്തിന് പൊതുവായി ജനതകൾ എന്നും യഹൂദരല്ലാത്ത വിജാതീയർ എന്നും അർഥമാകാം. മുഖ്യപാഠത്തിൽ വിശാലവും വ്യാഖ്യാനപരമായി കുറച്ച് നിയന്ത്രിതവുമായ രൂപം ഉപയോഗിച്ച് മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. കല്പനകൾ നേരിട്ടാണ് നൽകിയിരിക്കുന്നത്; കർമ്മണിപ്രയോഗത്തിലെ അപ്രകട കർത്താവിനെയും മൂലപാഠത്തിലെ പ്രധാന അർഥസന്ദിഗ്ധതകളെയും നിലനിർത്തിയിരിക്കുന്നു.
