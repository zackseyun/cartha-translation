id: REV.11.16
reference: Revelation 11:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: ml
  text: ദൈവത്തിന്റെ സന്നിധിയിൽ തങ്ങളുടെ സിംഹാസനങ്ങളിൽ ഇരുന്നിരുന്ന ഇരുപത്തിനാല് മൂപ്പന്മാർ കമിഴ്ന്നുവീണ് ദൈവത്തെ ആരാധിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: മൂപ്പന്മാർ
  rationale: വെളിപ്പാട് പുസ്തകത്തിൽ ഈ പദം സ്വർഗീയസഭയിലെ അറിയപ്പെടുന്ന വ്യക്തികളെ സൂചിപ്പിക്കുന്നു; കേവലം പ്രായമേറിയ പുരുഷന്മാർ എന്നതിലുപരി ഈ സ്ഥാനപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐνώπιον
  choice: സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിലുള്ള സ്ഥലപരവും ബന്ധപരവുമായ സാന്നിധ്യം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καθήμενοι
  choice: ഇരുന്നിരുന്ന
  rationale: അവർ അപ്പോൾ തുടർന്നുകൊണ്ടിരുന്ന ഇരിപ്പുനിലയെ പങ്കാളിക്രിയയുടെ വിവരണാത്മക സ്വഭാവത്തോടെ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τοὺς θρόνους αὐτῶν
  choice: തങ്ങളുടെ സിംഹാസനങ്ങളിൽ
  rationale: ഓരോരുത്തരും തങ്ങളുടേതായ സിംഹാസനത്തിൽ ഇരിക്കുന്ന ദൃശ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: കമിഴ്ന്നുവീണ്
  rationale: മുഖം നിലത്താകുന്ന സാഷ്ടാംഗമായ ശരീരനിലയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; ശരീരഭാവത്തിന്റെ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: προσεκύνησαν
  choice: ആരാധിച്ചു
  rationale: ക്രിയയുടെ കർത്താക്കൾ ദൈവത്തോടാണ് പ്രവൃത്തി ചെയ്യുന്നത്; സ്വർഗീയ സിംഹാസനദൃശ്യത്തിൽ മതപരമായ ആരാധനയാണ് പ്രധാന അർഥം.
- source_word: θεῷ / θεοῦ
  choice: ദൈവം / ദൈവത്തെ / ദൈവത്തിന്റെ
  rationale: θεός എന്ന പദത്തിന്റെ വിഭക്തിരൂപങ്ങൾ മലയാളവാക്യഘടനയ്ക്ക് അനുസൃതമായി നൽകുന്ന പതിവും വ്യക്തവുമായ പരിഭാഷ.
- source_word: οἱ εἴκοσι τέσσαρες
  choice: ഇരുപത്തിനാല്
  rationale: ദർശനത്തിൽ മുമ്പേ അറിയപ്പെട്ട നിർദിഷ്ട സംഘത്തെ സൂചിപ്പിക്കുന്ന സംഖ്യ ആധുനിക മലയാളരീതിയിൽ നൽകുന്നു.
theological_decisions:
- issue: സ്വർഗീയ ആരാധനാദൃശ്യത്തിലെ προσκυνέω എന്ന ക്രിയയുടെ സ്വഭാവം
  choice: ആരാധിച്ചു
  alternative: വണങ്ങി / ആദരാഞ്ജലി അർപ്പിച്ചു
  rationale: പ്രവൃത്തിയുടെ സ്വീകർത്താവ് വ്യക്തമായി ദൈവമാണ്; സിംഹാസനമുറിയിലെ ആരാധനാസന്ദർഭം മതപരമായ അർഥത്തെ മുൻനിരയിൽ കൊണ്ടുവരുന്നു. അതിനാൽ വെറും ശാരീരിക നമസ്കാരമെന്നു ദുർബലപ്പെടുത്താതെ ‘ആരാധിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ഇരിപ്പുനില, കമിഴ്ന്നുവീഴൽ, ആരാധന എന്നീ ക്രമങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായ സഭാവിഭാഗീയ പദാവലി ഒഴിവാക്കി.
