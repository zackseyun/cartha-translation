id: REV.11.6
reference: Revelation 11:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: ml
  text: ഇവർക്ക് ആകാശം അടച്ചുകളയാനുള്ള അധികാരമുണ്ട്, അവരുടെ പ്രവചനത്തിന്റെ നാളുകളിൽ മഴ പെയ്യാതിരിക്കേണ്ടതിന്.[a] വെള്ളങ്ങളുടെമേൽ അവയെ രക്തമാക്കി മാറ്റാനുള്ള അധികാരവും, തങ്ങൾ ആഗ്രഹിക്കുമ്പോഴെല്ലാം എല്ലാ ബാധകളാലും ഭൂമിയെ പ്രഹരിക്കാനുള്ള അധികാരവും അവർക്കുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വർഗം അടച്ചുകളയാൻ.’ ഗ്രീക്കിലെ οὐρανός എന്ന പദത്തിന് ‘സ്വർഗം’ എന്നും ‘ആകാശം’ എന്നും അർഥമാകാം; ഇവിടെ മഴയെക്കുറിച്ചുള്ള സന്ദർഭം കാരണം ‘ആകാശം’ എന്നു സ്വീകരിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: ഇവർക്ക്
  rationale: സന്ദർഭത്തിലെ രണ്ടു സാക്ഷികളെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ ‘രണ്ട്’ ആവർത്തിക്കാത്തതിനാൽ മലയാളത്തിലും ചേർത്തിട്ടില്ല.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: കേവലമായ കഴിവിനെക്കാൾ അനുവദിക്കപ്പെട്ട അവകാശവും അധികാരപരിധിയും സൂചിപ്പിക്കുന്ന പദം.
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: ആകാശം അടച്ചുകളയാൻ
  rationale: മഴ തടയുന്നതാണ് ഉടൻ വരുന്ന സന്ദർഭം; അതിനാൽ οὐρανός എന്നതിനു ഇവിടെ സ്വാഭാവികമായി ‘ആകാശം’ ഉപയോഗിച്ചു.
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: അവർ പ്രവചിക്കുന്ന നാളുകളിൽ
  rationale: ഗ്രീക്ക് നാമപ്രയോഗത്തിന്റെ കാലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കി.
- source_word: ἐπὶ τῶν ὑδάτων
  choice: വെള്ളങ്ങളുടെമേൽ
  rationale: ἐξουσίαν എന്നതിനോടൊപ്പം അധികാരത്തിന്റെ മേഖലയെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ ബഹുവചനവും നിലനിർത്തി.
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: വെള്ളങ്ങളെ രക്തമാക്കി മാറ്റാൻ
  rationale: രക്തത്തിലേക്കുള്ള രൂപാന്തരത്തിന്റെ ദൃശ്യഭാവം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πατάξαι τὴν γῆν
  choice: ഭൂമിയെ പ്രഹരിക്കാൻ
  rationale: വെളിപ്പാടിലെ ശക്തമായ പ്രഹരദൃശ്യം നിലനിർത്തുന്ന, ആധുനികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: ἐν πάσῃ πληγῇ
  choice: സകലവിധ ബാധകളാലും
  rationale: ἐν എന്നതിന്റെ കരണാർഥവും πάσῃ എന്നതിന്റെ വ്യാപകതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഇത് ഒരു നിശ്ചിത പട്ടിക വിശദീകരിക്കുന്നില്ല.
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: തങ്ങൾ ആഗ്രഹിക്കുമ്പോഴെല്ലാം
  rationale: ആവർത്തിക്കാവുന്ന നിബന്ധനയും അവരുടെ ഇച്ഛപ്രകാരമുള്ള പ്രവർത്തനവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സാക്ഷികളുടെ പ്രവൃത്തികളിലെ മോശെ-ഏലിയാ അനുസ്മരണങ്ങളും അപ്പോക്കലിപ്റ്റിക് സ്വഭാവവും
  choice: അത്ഭുതപ്രവൃത്തികളെ നേരിട്ടുള്ള ഭാഷയിൽ നിലനിർത്തി; അവ അക്ഷരാർഥമോ പ്രതീകാത്മകമോ രണ്ടുമോ എന്നു വിവർത്തനത്തിൽ തീർപ്പാക്കിയില്ല.
  alternative: പ്രവൃത്തികളെ പ്രതീകാത്മകമായി വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: മൂലവാക്യം സാക്ഷികൾക്കു ലഭിച്ച അധികാരത്തിന്റെ ഭാഗമായി ഈ പ്രവൃത്തികളെ അവതരിപ്പിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ഉള്ള മലയാളം. പരമ്പരാഗത ബൈബിൾഭാഷയിലെ അത്യന്തം പ്രാചീന രൂപങ്ങൾ ഒഴിവാക്കി; അപ്പോക്കലിപ്റ്റിക് ദൃശ്യത്തിന്റെ ശക്തി നിലനിർത്തി.
