- from: ഇവർക്കു ആകാശം അടച്ചുകളയാനുള്ള അധികാരമുണ്ട്; അങ്ങനെ, അവർ പ്രവചിക്കുന്ന നാളുകളിൽ മഴ പെയ്യുകയില്ല.[a] വെള്ളങ്ങളെ രക്തമാക്കി മാറ്റാനും തങ്ങൾ ആഗ്രഹിക്കുമ്പോഴെല്ലാം സകലവിധ ബാധകളാലും ഭൂമിയെ പ്രഹരിക്കാനും അവർക്കു വെള്ളങ്ങളുടെമേൽ അധികാരമുണ്ട്.
  to: ഇവർക്ക് ആകാശം അടച്ചുകളയാനുള്ള അധികാരമുണ്ട്, അവരുടെ പ്രവചനത്തിന്റെ നാളുകളിൽ മഴ പെയ്യാതിരിക്കേണ്ടതിന്.[a] വെള്ളങ്ങളുടെമേൽ അവയെ രക്തമാക്കി മാറ്റാനുള്ള അധികാരവും, തങ്ങൾ ആഗ്രഹിക്കുമ്പോഴെല്ലാം എല്ലാ ബാധകളാലും ഭൂമിയെ പ്രഹരിക്കാനുള്ള അധികാരവും അവർക്കുണ്ട്.
