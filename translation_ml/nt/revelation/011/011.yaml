id: REV.11.11
reference: Revelation 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: ml
  text: ആ മൂന്നര ദിവസങ്ങൾക്കുശേഷം ദൈവത്തിൽനിന്നുള്ള ജീവശ്വാസം[a] അവരിൽ പ്രവേശിച്ചു. അവർ കാലുകളിൽ എഴുന്നേറ്റുനിന്നു; അവരെ നോക്കിക്കൊണ്ടിരുന്നവരുടെമേൽ വലിയ ഭയം വീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്തിൽനിന്നുള്ള ജീവന്റെ ആത്മാവ്.” ഗ്രീക്കിലെ πνεῦμα എന്ന പദത്തിന് “ശ്വാസം,” “ആത്മാവ്,” അല്ലെങ്കിൽ സന്ദർഭാനുസരിച്ച് “പരിശുദ്ധാത്മാവ്” എന്ന അർഥം വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: ആ മൂന്നര ദിവസങ്ങൾക്കുശേഷം
  rationale: μετά + accusative കാലാനന്തരത്തെ സൂചിപ്പിക്കുന്നു. നിർദേശകഭാവമുള്ള ഗ്രീക്ക് article നിലനിർത്താൻ ‘ആ’ ചേർത്തു; മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരൂപമായി ‘മൂന്നര’ ഉപയോഗിച്ചു.
- source_word: πνεῦμα ζωῆς
  choice: ജീവശ്വാസം
  rationale: πνεῦμα എന്നതിന് ശ്വാസം, ആത്മാവ് എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. യെഹെസ്കേൽ 37-നെ അനുസ്മരിപ്പിക്കുന്ന ജീവൻ പുനഃസ്ഥാപിക്കുന്ന ഈ രംഗത്തിൽ ‘ജീവശ്വാസം’ സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ള
  rationale: ജീവശ്വാസത്തിന്റെ ദൈവിക ഉറവിടം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: അവരിൽ പ്രവേശിച്ചു
  rationale: അവരുടെ ഉള്ളിലേക്കുള്ള പ്രവേശനം വ്യക്തമാക്കുന്നതിനൊപ്പം ഗ്രീക്ക് പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്ന മലയാളരൂപം.
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: അവർ സ്വന്തം കാലുകളിൽ എഴുന്നേറ്റുനിന്നു
  rationale: ἔστησαν ഇവിടെ അകർമകമായ ‘നിന്നു’ എന്ന അർഥത്തിലാണ്. മരിച്ചുകിടന്നവർ കാലുകളിൽ നിൽക്കുന്നതിലേക്കുള്ള മാറ്റം സ്വാഭാവികമായി അറിയിക്കാൻ ‘എഴുന്നേറ്റുനിന്നു’ ഉപയോഗിച്ചു.
- source_word: φόβος μέγας
  choice: വലിയ ഭയം
  rationale: അർഥം അതിശയിപ്പിക്കാതെ ഗ്രീക്കിലെ തീവ്രത നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐπέπεσεν ἐπὶ
  choice: മേൽ ... വീണു
  rationale: ഭയം ഒരാളുടെമേൽ ‘വീഴുക’ എന്ന ഗ്രീക്ക് ദൃശ്യഭാവം മലയാളത്തിലും സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: അവരെ നോക്കിക്കൊണ്ടിരുന്നവർ
  rationale: θεωρέω സൂചിപ്പിക്കുന്ന തുടർച്ചയായ ശ്രദ്ധാപൂർവമായ കാഴ്ച participial ഭാവത്തോടെ നൽകുന്നു.
theological_decisions:
- issue: πνεῦμα ζωῆς ജീവൻ നൽകുന്ന ശ്വാസമാണോ, ഒരു ആത്മാവാണോ, പരിശുദ്ധാത്മാവാണോ എന്നത്
  choice: ദൈവത്തിൽനിന്നുള്ള ജീവശ്വാസം
  alternative: ദൈവത്തിൽനിന്നുള്ള ജീവന്റെ ആത്മാവ്; അല്ലെങ്കിൽ ദൈവത്തിൽനിന്നുള്ള ജീവദായക ആത്മാവ്
  rationale: ഗ്രീക്ക് πνεῦμα ഈ അർഥസാധ്യതകൾ വഹിക്കുന്നു; വാക്യം പരിശുദ്ധാത്മാവിനെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല. മുഖ്യപാഠം പ്രവാചകീയ ജീവപുനഃസ്ഥാപനത്തിന്റെ ശ്വാസദൃശ്യത്തെ മുൻനിർത്തുന്നു; യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും വെളിപ്പാട് ഗ്രന്ഥത്തിന്റെ ഗൗരവത്തിന് യോജിച്ചതുമായ മലയാളം. ഗ്രീക്കിലെ ദൃശ്യഭാഷയും πνεῦμα എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
