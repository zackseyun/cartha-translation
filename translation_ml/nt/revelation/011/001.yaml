id: REV.11.1
reference: Revelation 11:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: ml
  text: 'വടിപോലെയുള്ള ഒരു ഞാങ്ങണ എനിക്കു നൽകപ്പെട്ടു; ഇങ്ങനെ പറഞ്ഞു: “എഴുന്നേറ്റ് ദൈവത്തിന്റെ ആലയവും[a] യാഗപീഠവും അതിൽ ആരാധിക്കുന്നവരെയും അളക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്തിന്റെ വിശുദ്ധമന്ദിരം”; ναός എന്ന ഗ്രീക്ക് പദം ആലയസമുച്ചയം മുഴുവനെയല്ല, പ്രത്യേകിച്ച് അതിന്റെ അകത്തെ വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: എനിക്കു നൽകപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗവും നൽകുന്നവനെ പരാമർശിക്കാത്തതും നിലനിർത്തുന്നു.
- source_word: κάλαμος
  choice: ഞാങ്ങണ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; അളവുകോൽ എന്ന് മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ὅμοιος ῥάβδῳ
  choice: വടിപോലെയുള്ള
  rationale: ὅμοιος സഹിതമുള്ള താരതമ്യം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: λέγων
  choice: ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്
  rationale: പറയുന്നയാൾ ആരെന്ന് വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ അപൂർണകൃതന്തത്തിന്റെ ആശയവും അവ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: Ἔγειρε
  choice: എഴുന്നേറ്റ്
  rationale: തുടർന്നുവരുന്ന അളക്കുക എന്ന ആജ്ഞയുമായി സ്വാഭാവികമായി ചേരുന്ന ആജ്ഞാരൂപം.
- source_word: μέτρησον
  choice: അളക്കുക
  rationale: നേരിട്ടുള്ള ആജ്ഞയുടെ ലളിതവും കൃത്യവുമായ വിവർത്തനം.
- source_word: ναὸν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ആലയം
  rationale: ναός എന്ന പദത്തിന്റെ ആരാധനാലയസംബന്ധിയായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; അകത്തെ വിശുദ്ധമന്ദിരത്തെ പ്രത്യേകിച്ച് സൂചിപ്പിക്കാവുന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: θυσιαστήριον
  choice: യാഗപീഠം
  rationale: θυσιαστήριον എന്നതിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാള പദം; ഏതു പ്രത്യേക പീഠമെന്ന് നിർണയിക്കുന്നില്ല.
- source_word: τοὺς προσκυνοῦντας
  choice: ആരാധിക്കുന്നവരെ
  rationale: നാമവത്കൃത കൃതന്തത്തിന്റെ ക്രിയാത്മകത നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: ἐν αὐτῷ
  choice: അതിൽ
  rationale: സർവനാമം ഏറ്റവും സ്വാഭാവികമായി ആലയത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലവാചകമായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: ദർശനത്തിലെ ναός എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: ദൈവത്തിന്റെ ആലയം
  alternative: ദൈവത്തിന്റെ വിശുദ്ധമന്ദിരം
  rationale: ഇത് ഭൂമിയിലെ അക്ഷരാർഥത്തിലുള്ള ആലയമാണോ, സ്വർഗീയ വിശുദ്ധമന്ദിരമാണോ, ദൈവജനത്തിന്റെ പ്രതീകമാണോ എന്നു വാക്യം തന്നെ തീർപ്പാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ ഒരു നിലപാടും പ്രധാന പാഠത്തിൽ ചേർത്തിട്ടില്ല.
- issue: λέγων സൂചിപ്പിക്കുന്ന പ്രഭാഷകന്റെ തിരിച്ചറിയൽ
  choice: പറയുന്നയാളെ വ്യക്തമാക്കാതെ ‘ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്’
  alternative: ‘ഒരു ദൂതൻ പറഞ്ഞു’ അല്ലെങ്കിൽ ‘ഒരു ശബ്ദം പറഞ്ഞു’
  rationale: ഗ്രീക്ക് പാഠം പറയുന്നയാളെ തുറന്നു തിരിച്ചറിയിക്കുന്നില്ല; ദൂതനെയോ ശബ്ദത്തെയോ ചേർക്കുന്നത് മൂലപാഠത്തിന് അതീതമായ വ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഞാങ്ങണ’, ‘ആലയം’, ‘യാഗപീഠം’ എന്നീ പദങ്ങൾ ദർശനാത്മക പശ്ചാത്തലത്തിന്റെ ഭാവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ‘ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന മൂലപാഠത്തിലെ അല്പം അസാധാരണമായ വാക്യബന്ധവും പ്രഭാഷകന്റെ അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
