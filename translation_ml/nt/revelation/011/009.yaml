id: REV.11.9
reference: Revelation 11:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: ml
  text: ജനവിഭാഗങ്ങളിൽനിന്നും ഗോത്രങ്ങളിൽനിന്നും ഭാഷകളിൽനിന്നും ജനതകളിൽനിന്നും ചിലർ മൂന്നര ദിവസം അവരുടെ ശവം[a] നോക്കിക്കൊണ്ടിരിക്കുന്നു; അവരുടെ ശവങ്ങൾ കല്ലറയിൽ വെക്കാൻ അവർ അനുവദിക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ആദ്യം ‘അവരുടെ ശവം’ എന്ന് ഏകവചനത്തിലും പിന്നീട് ‘അവരുടെ ശവങ്ങൾ’ എന്ന് ബഹുവചനത്തിലുമാണ്. ഏകവചനം രണ്ടു സാക്ഷികളെയും ഒരു കൂട്ടമായി അവതരിപ്പിച്ചശേഷം വ്യക്തിഗത ശവങ്ങളിലേക്കു മാറുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπουσιν
  choice: നോക്കിക്കൊണ്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള തുടർച്ചയായ ദൃശ്യപ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: വിവിധ ജനവിഭാഗങ്ങളിലും ഗോത്രങ്ങളിലും ഭാഷക്കാരിലും ജനതകളിലും പെട്ട ചിലർ
  rationale: ἐκ എന്നതിന്റെ ഭാഗസൂചക അർഥം ‘പെട്ട ചിലർ’ എന്നു വ്യക്തമാക്കുന്നു; പട്ടികയിലെ വ്യത്യസ്ത കൂട്ടങ്ങളെ വേർതിരിച്ചും നിലനിർത്തുന്നു.
- source_word: λαῶν
  choice: ജനവിഭാഗങ്ങൾ
  rationale: ബഹുവചനത്തിലുള്ള വ്യത്യസ്ത ജനക്കൂട്ടങ്ങളെ സൂചിപ്പിക്കുകയും അവസാനത്തെ ἐθνῶν എന്ന പദത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: φυλῶν
  choice: ഗോത്രങ്ങൾ
  rationale: വെളിപ്പാടിലെ ജനവിഭാഗപ്പട്ടികയ്ക്ക് യോജിച്ച സ്ഥിരവും വ്യക്തവുമായ പദം.
- source_word: γλωσσῶν
  choice: ഭാഷക്കാർ
  rationale: ‘ഭാഷകളിൽ പെട്ടവർ’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കി, ഭാഷയുടെ അടിസ്ഥാനത്തിൽ തിരിച്ചറിയപ്പെടുന്ന ആളുകളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐθνῶν
  choice: ജനതകൾ
  rationale: ഇവിടെ രാഷ്ട്രീയ രാഷ്ട്രങ്ങളെക്കാൾ വിശാലമായ ജനതകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വിജാതീയർ’ എന്നത് അനാവശ്യമായി അർഥം ചുരുക്കും.
- source_word: τὸ πτῶμα αὐτῶν
  choice: അവരുടെ ശവം
  rationale: രണ്ടു സാക്ഷികളെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ആദ്യ ഉപവാക്യത്തിലെ ഏകവചനരൂപം അതേപടി നിലനിർത്തുന്നു.
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: മൂന്നര ദിവസം
  rationale: കാലദൈർഘ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: τὰ πτώματα αὐτῶν
  choice: അവരുടെ ശവങ്ങൾ
  rationale: രണ്ടാം ഉപവാക്യത്തിൽ ഗ്രീക്ക് ബഹുവചനത്തിലേക്കു മാറുന്നതു വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐκ ἀφίουσιν
  choice: അനുവദിക്കുന്നുമില്ല
  rationale: ഈ സന്ദർഭത്തിൽ ἀφίημι എന്നതിന് ‘അനുവദിക്കുക’ എന്ന അർഥമാണ്; നിഷേധവും മുൻ ഉപവാക്യത്തോടുള്ള ബന്ധവും പ്രകടമാക്കുന്നു.
- source_word: τεθῆναι εἰς μνῆμα
  choice: കല്ലറയിൽ വെക്കാൻ
  rationale: പൊതുവായ ‘സംസ്കരിക്കുക’ എന്നതിനെക്കാൾ, ശവം ഒരു സംസ്കാരസ്ഥാനത്ത് വെക്കുന്നതെന്ന ഗ്രീക്കിലെ ദൃശ്യപ്രവർത്തനം അടുത്തായി പകരുന്നു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ ഏകവചനമായ πτῶμαയും രണ്ടാം ഉപവാക്യത്തിലെ ബഹുവചനമായ πτώματαയും
  choice: ആദ്യം ‘അവരുടെ ശവം’ എന്നും പിന്നീട് ‘അവരുടെ ശവങ്ങൾ’ എന്നും രൂപവ്യത്യാസം നിലനിർത്തി
  alternative: മലയാളത്തിലെ ഒഴുക്കിനായി രണ്ടു സ്ഥലത്തും ‘അവരുടെ ശവങ്ങൾ’ എന്നു നൽകുക
  rationale: മൂലപാഠം തന്നെയുള്ള ഏകവചന–ബഹുവചന മാറ്റം സാക്ഷികളെ ആദ്യം ഒരു ഏകീകൃത സാക്ഷ്യമായി കാണിച്ചശേഷം വ്യക്തികളായി കാണിക്കുന്നതാകാം. ഈ സാധ്യത തീർപ്പാക്കാതെ പാഠത്തിലെ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഭാഷക്കാർ’ എന്ന പ്രയോഗം പട്ടികയുടെ അർഥം സ്വാഭാവികമാക്കുന്നു; ഏകവചന–ബഹുവചന വ്യത്യാസം ഉദ്ദേശപൂർവം അസാധാരണമായ നിലയിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
