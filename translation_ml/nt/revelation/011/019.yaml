id: REV.11.19
reference: Revelation 11:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: ml
  text: അപ്പോൾ സ്വർഗത്തിലുള്ള ദൈവത്തിന്റെ ആലയം[a] തുറക്കപ്പെട്ടു; അവന്റെ ആലയത്തിൽ അവന്റെ ഉടമ്പടിയുടെ പെട്ടകം[b] കാണപ്പെട്ടു. മിന്നലുകളും ശബ്ദങ്ങളും[c] ഇടിമുഴക്കങ്ങളും ഭൂകമ്പവും വലിയ ആലിപ്പഴവർഷവും ഉണ്ടായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധമന്ദിരം’; ഗ്രീക്ക് ναός വിശാലമായ ആലയസമുച്ചയത്തേക്കാൾ അകത്തെ വിശുദ്ധ വാസസ്ഥാനത്തെ ഊന്നിപ്പറയാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഉടമ്പടിയുടെ പെട്ടകം’; ഗ്രീക്കിൽ അക്ഷരാർഥമായി ‘അവന്റെ ഉടമ്പടിയുടെ പെട്ടകം’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘സ്വരങ്ങൾ’ അല്ലെങ്കിൽ ‘മുഴക്കങ്ങൾ’; വെളിപ്പാടിലെ ദൈവിക മഹിമയുടെയും ന്യായവിധിയുടെയും ദൃശ്യങ്ങളിൽ ഈ പദപ്രയോഗം ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: ആലയം
  rationale: ναός സൂചിപ്പിക്കുന്ന ദൈവത്തിന്റെ വിശുദ്ധ വാസസ്ഥലത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം. അകത്തെ വിശുദ്ധസ്ഥാനമെന്ന കൂടുതൽ നിർദിഷ്ടമായ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിലുള്ള
  rationale: ναός-നെ വിശേഷിപ്പിക്കുന്ന സ്ഥാനസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἠνοίγη
  choice: തുറക്കപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ ഭൂതകാല കർമണിപ്രയോഗം നിലനിർത്തുകയും പ്രവർത്തകൻ ആരെന്നത് പാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὤφθη
  choice: കാണപ്പെട്ടു
  rationale: പെട്ടകം സ്വയം പ്രത്യക്ഷപ്പെട്ടു എന്ന് നിർബന്ധിക്കാതെ, അത് ദൃശ്യമായെന്ന ഗ്രീക്ക് കർമണിപ്രയോഗത്തിന്റെ തുറന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: അവന്റെ ഉടമ്പടിയുടെ പെട്ടകം
  rationale: αὐτοῦ എന്ന ഉടമസ്ഥസർവനാമം വ്യക്തമായി നിലനിർത്തുന്നു; διαθήκη-യ്ക്ക് നിലവാരമുള്ള വേദപദമായ 'ഉടമ്പടി' ഉപയോഗിക്കുന്നു.
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: അവന്റെ ആലയത്തിൽ
  rationale: ആവർത്തിക്കുന്ന ναός-ന് ഒരേ മലയാളപദം നൽകി αὐτοῦ-വും സംരക്ഷിക്കുന്നു.
- source_word: ἐγένοντο
  choice: ഉണ്ടായി
  rationale: തുടർന്നുള്ള പ്രതിഭാസങ്ങളുടെ സംഭവത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀστραπαὶ
  choice: മിന്നലുകൾ
  rationale: ബഹുവചനബലം സ്വാഭാവികവും നേരിട്ടുമായ രീതിയിൽ നൽകുന്നു.
- source_word: φωναὶ
  choice: ശബ്ദങ്ങൾ
  rationale: φωναί-യുടെ വ്യാപകമായ ശ്രാവ്യാർഥം മലയാളത്തിൽ നിലനിർത്തുന്നു; 'സ്വരങ്ങൾ' എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: βρονταὶ
  choice: ഇടിമുഴക്കങ്ങൾ
  rationale: ബഹുവചനവും ആവർത്തിച്ചുള്ള ഇടിയുടെ ശ്രാവ്യബലവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σεισμὸς
  choice: ഭൂകമ്പം
  rationale: σεισμός-ന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപരിഭാഷ.
- source_word: χάλαζα μεγάλη
  choice: വലിയ ആലിപ്പഴവർഷം
  rationale: χάλαζα-യുടെ ആലിപ്പഴം/ആലിപ്പഴവർഷം എന്ന അർഥവും μεγάλη-യുടെ തീവ്രതയും ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സ്വർഗീയ ναός-ന്റെ സ്വഭാവം
  choice: മുഖ്യപാഠത്തിൽ 'ആലയം'
  alternative: '''വിശുദ്ധമന്ദിരം'''
  rationale: '''ആലയം'' സ്വർഗീയ ദൈവവാസസ്ഥലത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുമ്പോൾ അതിന്റെ നിർമ്മിതിയെക്കുറിച്ച് അനാവശ്യമായ നിർദിഷ്ടത വരുത്തുന്നില്ല; ναός-ന്റെ അകത്തെ വിശുദ്ധസ്ഥാനമെന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.'
- issue: ദൈവിക പ്രത്യക്ഷതയുടെ നിരയിലെ φωναὶ
  choice: മുഖ്യപാഠത്തിൽ 'ശബ്ദങ്ങൾ'
  alternative: '''സ്വരങ്ങൾ'' അല്ലെങ്കിൽ ''മുഴക്കങ്ങൾ'''
  rationale: കാലാവസ്ഥാപരമായ മുഴക്കങ്ങൾ മാത്രമെന്നോ വ്യക്തമായ സംസാരശബ്ദങ്ങൾ മാത്രമെന്നോ തീരുമാനിക്കാതെ ഗ്രീക്ക് പദത്തിന്റെ ശ്രാവ്യവ്യാപ്തി സംരക്ഷിക്കുന്നു; അക്ഷരാർഥപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: പെട്ടകവുമായി ബന്ധപ്പെട്ട ഉടമ്പടിയുടെ ഉടമസ്ഥത
  choice: '''അവന്റെ ഉടമ്പടി'''
  alternative: '''ഉടമ്പടി'''
  rationale: ഗ്രീക്കിലെ αὐτοῦ വ്യക്തമായി സംരക്ഷിച്ച് ഉടമ്പടി ദൈവത്തിന്റേതാണെന്ന് പാഠം പറയുന്നതുപോലെ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ, എന്നാൽ വെളിപ്പാടിന്റെ ഗൗരവവും ദൈവിക പ്രത്യക്ഷതയുടെ താളവും നിലനിർത്തുന്ന ശൈലി. കർമണിപ്രയോഗങ്ങളും ഘടകങ്ങളുടെ നിരയും കഴിയുന്നത്ര സംരക്ഷിച്ചു; അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി.
