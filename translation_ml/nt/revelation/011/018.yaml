id: REV.11.18
reference: Revelation 11:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: ml
  text: ജനതകൾ കോപിച്ചു; അങ്ങയുടെ ക്രോധം വന്നു. മരിച്ചവർ വിധിക്കപ്പെടാനും അങ്ങയുടെ ദാസന്മാർക്കും—പ്രവാചകന്മാർക്കും, വിശുദ്ധർക്കും, അങ്ങയുടെ നാമത്തെ ഭയപ്പെടുന്നവർക്കും—ചെറിയവർക്കും വലിയവർക്കും[c]—പ്രതിഫലം നൽകാനും, ഭൂമിയെ[b] നശിപ്പിക്കുന്നവരെ നശിപ്പിക്കാനുമുള്ള സമയം വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘ഭൂമി’ എന്നതിന് ‘ദേശം’ എന്നും, ‘നശിപ്പിക്കുന്നവർ’ എന്നതിന് ‘ദുഷിപ്പിക്കുന്നവർ’ എന്നും വിവർത്തനം ചെയ്യാം. γῆ എന്ന ഗ്രീക്ക് പദത്തിന് ‘ദേശം’ എന്നും അർഥമുണ്ട്; διαφθείρω എന്നതിന് ‘നശിപ്പിക്കുക,’ ‘ദുഷിപ്പിക്കുക’ എന്നീ അർഥങ്ങളുമുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ചെറിയവർക്കും വലിയവർക്കും’ എന്ന വാക്യഭാഗം ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ἔθνη
  choice: ജനതകൾ
  rationale: ലോകത്തിലെ ജനസമൂഹങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന പദം; ഈ സന്ദർഭത്തിൽ യഹൂദരല്ലാത്തവരെ മാത്രം വേർതിരിച്ചു കാണിക്കുന്നില്ല.
- source_word: ὠργίσθησαν
  choice: കോപിച്ചു
  rationale: കോപിതരായി എന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; അതിശക്തമായ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ὀργή
  choice: ക്രോധം
  rationale: ദൈവികവും ന്യായവിധിപരവുമായ കോപത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; ജനതകളുടെ കോപത്തോടുള്ള പദപരമായ വൈരുധ്യവും വ്യക്തമാക്കുന്നു.
- source_word: καιρός
  choice: സമയം
  rationale: നിർണായകമായി നിശ്ചയിക്കപ്പെട്ട അവസരത്തെ സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവികമായ പൊതുപദം മതിയാകുന്നു.
- source_word: κριθῆναι
  choice: വിധിക്കപ്പെടാൻ
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗവും ന്യായവിധിയുടെ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: μισθός
  choice: പ്രതിഫലം
  rationale: ദൈവം തന്റെ ജനത്തിനു നൽകുന്ന അംഗീകാരപരമായ പകരം എന്ന അർഥം നൽകുന്നു; കൂലി എന്ന ഇടപാടുസ്വഭാവമുള്ള ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: δούλοις
  choice: ദാസന്മാർ
  rationale: ദൈവത്തോടുള്ള കീഴ്പ്പെടലും അവകാശബന്ധവും ഉൾക്കൊള്ളുന്ന പതിവായ മലയാളപദം; അടിമകൾ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἁγίοις
  choice: വിശുദ്ധർ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: φοβουμένοις τὸ ὄνομά σου
  choice: അങ്ങയുടെ നാമത്തെ ഭയപ്പെടുന്നവർ
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയം സൂചിപ്പിക്കുന്ന ബൈബിൾ ശൈലി വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: ചെറിയവരും വലിയവരും
  rationale: പദവിയോ നിലയോ നോക്കാതെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന ദ്വന്ദ്വഘടനയും താളവും നിലനിർത്തുന്നു.
- source_word: διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν
  choice: ഭൂമിയെ നശിപ്പിക്കുന്നവരെ നശിപ്പിക്കാൻ
  rationale: ഒരേ ഗ്രീക്ക് ധാതുവിന്റെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി നീതിപൂർവമായ പ്രത്യുപകാരത്തിന്റെ പദകളി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവജനത്തെ വിശേഷിപ്പിക്കുന്ന δοῦλος എന്ന പദം
  choice: ദാസന്മാർ
  alternative: അടിമകൾ
  rationale: ഇവിടെ ഊന്നൽ ദൈവത്തിന്റെ ജനമെന്ന നിലയിലും അവർക്ക് ലഭിക്കുന്ന പ്രതിഫലത്തിലുമാണ്; ബന്ധിതാവസ്ഥയ്ക്ക് മാത്രം ഊന്നൽ നൽകാതെ ദൈവത്തോടുള്ള കീഴ്പ്പെടൽ സൂചിപ്പിക്കാൻ ‘ദാസന്മാർ’ അനുയോജ്യം. മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: γῆ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം / നിലം
  rationale: പ്രപഞ്ചവ്യാപകമായ അന്ത്യന്യായവിധിയുടെ സന്ദർഭത്തിൽ ‘ഭൂമി’ യോജിക്കുന്നു; ‘ദേശം’ എന്ന പരിമിതമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ‘ചെറിയവരും വലിയവരും’ ആരെ വിശേഷിപ്പിക്കുന്നു എന്ന ഘടനാപരമായ വ്യാപ്തി
  choice: പ്രതിഫലം ലഭിക്കുന്ന മുഴുവൻ കൂട്ടത്തെയും ഉൾക്കൊള്ളുന്ന അനുബന്ധവാക്യമായി നിലനിർത്തി
  alternative: ‘അങ്ങയുടെ നാമത്തെ ഭയപ്പെടുന്നവർ’ എന്ന തൊട്ടുമുമ്പുള്ള കൂട്ടത്തെ മാത്രം വിശേഷിപ്പിക്കുന്നതായി വായിക്കുക
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ പരിധി സംബന്ധിച്ച് ചെറിയ അനിശ്ചിതത്വം ഉണ്ടായേക്കാം. മലയാളത്തിൽ ഡാഷുകൾ ഉപയോഗിച്ച് വാക്യത്തിന്റെ സമഗ്രതയും യഥാർഥമായ ഘടനാപരമായ തുറന്ന നിലയും പരമാവധി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തനവും ന്യായവിധിയുടെ ഗൗരവവും കഴിയുന്നത്ര നിലനിർത്തി; ദീർഘമായ പട്ടിക ഡാഷുകൾകൊണ്ട് വ്യക്തമായി ക്രമപ്പെടുത്തി.
