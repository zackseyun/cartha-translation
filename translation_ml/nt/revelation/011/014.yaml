- from: രണ്ടാമത്തെ കഷ്ടം കഴിഞ്ഞുപോയി; ഇതാ, മൂന്നാമത്തെ കഷ്ടം വേഗത്തിൽ[a] വരുന്നു.
  to: രണ്ടാമത്തെ അയ്യോ കഴിഞ്ഞുപോയി; ഇതാ, മൂന്നാമത്തെ അയ്യോ വേഗത്തിൽ[a] വരുന്നു.
  rationale: Only the rendering of οὐαί is revised. «അയ്യോ» retains the source word's lament-and-impending-doom force and its formal recurrence as the second and third woe, while the rest of the draft faithfully and naturally represents the Greek text and preserves the disputed nuance of ταχύ.
