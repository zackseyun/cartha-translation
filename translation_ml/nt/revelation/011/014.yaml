id: REV.11.14
reference: Revelation 11:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ δευτέρα ἀπῆλθεν· ⸂ἰδοὺ ἡ οὐαὶ ἡ τρίτη⸃ ἔρχεται ταχύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: ml
  text: രണ്ടാമത്തെ അയ്യോ കഴിഞ്ഞുപോയി; ഇതാ, മൂന്നാമത്തെ അയ്യോ വേഗത്തിൽ[a] വരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “താമസിയാതെ.” ഗ്രീക്ക് ταχύ എന്ന പദത്തിന് കാലസാമീപ്യത്തെയോ ദ്രുതതയെയോ ഊന്നിക്കാട്ടാനാകും.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: കഷ്ടം
  rationale: വിലാപത്തെയും വരാനിരിക്കുന്ന വിനാശത്തെയും സൂചിപ്പിക്കുന്ന ഈ പദം വെളിപ്പാടിലെ എണ്ണിപ്പറയുന്ന ന്യായവിധിഘട്ടങ്ങൾക്ക് ഉപയോഗിച്ചിരിക്കുന്നു. ‘കഷ്ടം’ അതിന്റെ പ്രവാചകഗൗരവവും പരസ്പരപാഠബന്ധവും നിലനിർത്തുന്നു; ‘ദുരന്തം’ അല്ലെങ്കിൽ ‘ന്യായവിധി’ എന്നത് അർത്ഥത്തെ കൂടുതൽ വ്യാഖ്യാനിച്ചുകളയും.
- source_word: δευτέρα
  choice: രണ്ടാമത്തെ
  rationale: ‘കഷ്ടം’ എന്ന നാമത്തെ നേരിട്ട് വിശേഷിപ്പിക്കുന്ന ക്രമസംഖ്യ സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: ἀπῆλθεν
  choice: കഴിഞ്ഞുപോയി
  rationale: ἀπέρχομαι എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം അക്ഷരാർഥത്തിൽ ‘പോയി’ എന്നാണെങ്കിലും, ഈ ന്യായവിധിഘട്ടം അവസാനിച്ചു എന്ന സന്ദർഭാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἰδού
  choice: ഇതാ
  rationale: ശ്രദ്ധ അടിയന്തരമായി ആകർഷിക്കുന്ന പ്രവാചകശൈലിയിലെ സൂചകപദമാണ്; ‘ഇതാ’ അതിന്റെ ഗൗരവവും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: τρίτη
  choice: മൂന്നാമത്തെ
  rationale: ‘കഷ്ടം’ എന്ന നാമത്തെ നേരിട്ട് വിശേഷിപ്പിക്കുന്ന ക്രമസംഖ്യയെ ലളിതമായും കൃത്യമായും നൽകുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ സജീവതയും ആഗമനത്തിന്റെ സമീപഭാവവും നിലനിർത്തുന്നു; ‘വരാനിരിക്കുന്നു’ എന്നു പറഞ്ഞാൽ മൂലപാഠത്തിലുള്ളതിനെക്കാൾ അധികമായി ആസന്നത സൂചിപ്പിക്കാം.
- source_word: ταχύ
  choice: വേഗത്തിൽ
  rationale: ഈ ക്രിയാവിശേഷണം കാലസാമീപ്യമോ സംഭവത്തിന്റെ ദ്രുതതയോ സൂചിപ്പിക്കാം. ‘വേഗത്തിൽ’ അടിയന്തരത നിലനിർത്തുകയും ഒരു പ്രത്യേക അന്ത്യകാലക്രമം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു; ‘താമസിയാതെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിൽ ταχύ എന്ന പദത്തിന്റെ അർത്ഥം
  choice: വേഗത്തിൽ
  alternative: താമസിയാതെ
  rationale: വെളിപ്പാടിൽ ταχύ എന്നത് സംഭവം ഉടൻ ഉണ്ടാകുമെന്ന കാലസാമീപ്യത്തെയോ അത് ആരംഭിക്കുമ്പോഴുള്ള ദ്രുതതയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഈ വ്യാഖ്യാനഭേദം തീർപ്പാക്കാതെ അടിയന്തരത നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സുതാര്യമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രവാചകശൈലി. ‘ഇതാ’ വെളിപ്പാടിന്റെ ഔന്നത്യം നിലനിർത്തുന്നു; വാക്യഘടന മൂലപാഠത്തിലെ രണ്ട് ഘട്ടങ്ങളെയും വ്യക്തമായി വേർതിരിക്കുന്നു.
