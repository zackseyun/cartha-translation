    reason: alternative_reading
  revision_rationale: Only the rendering of οὐαί is revised. «അയ്യോ» retains the source word's lament-and-impending-doom force and its formal recurrence as the second and third woe, while the rest of the draft faithfully and naturally represents the Greek text and preserves the disputed nuance of ταχύ.
