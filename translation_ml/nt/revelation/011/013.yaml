id: REV.11.13
reference: Revelation 11:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: ml
  text: ആ നാഴികയിൽ ഒരു വലിയ ഭൂകമ്പം ഉണ്ടായി; നഗരത്തിന്റെ പത്തിലൊന്ന് നിലംപതിച്ചു. ഭൂകമ്പത്തിൽ ഏഴായിരം പേർ[a] കൊല്ലപ്പെട്ടു. ശേഷിച്ചവർ അത്യന്തം ഭയപ്പെട്ട് സ്വർഗത്തിന്റെ ദൈവത്തിന് മഹത്വം നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “മനുഷ്യരുടെ പേരുകൾ ഏഴായിരം”; മരിച്ചവരായി എണ്ണപ്പെട്ട ഏഴായിരം വ്യക്തികൾ എന്ന അർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ആ നാഴികയിൽ
  rationale: അപ്പോക്കലിപ്റ്റിക് വിവരണത്തിലെ സമയസൂചനയുടെ തീവ്രത നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: ἐγένετο σεισμὸς μέγας
  choice: ഒരു വലിയ ഭൂകമ്പം ഉണ്ടായി
  rationale: സംഭവത്തെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുമ്പോൾ μέγας എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും നിലനിർത്തുന്നു.
- source_word: τὸ δέκατον τῆς πόλεως
  choice: നഗരത്തിന്റെ പത്തിലൊന്ന്
  rationale: ഭാഗസൂചക പ്രയോഗവും സംഖ്യയുടെ കൃത്യതയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἔπεσεν
  choice: നിലംപതിച്ചു
  rationale: ‘വീണു’ എന്നതിനെക്കാൾ നഗരഭാഗത്തിന്റെ നാശം മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുമ്പോഴും സംഭവത്തിന്റെ കൃത്യരീതി അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: ἀπεκτάνθησαν
  choice: കൊല്ലപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്ന ആധുനികവും വ്യക്തവുമായ രൂപം.
- source_word: ὀνόματα ἀνθρώπων χιλιάδες ἑπτά
  choice: ഏഴായിരം പേർ[a]
  rationale: ‘മനുഷ്യരുടെ പേരുകൾ ഏഴായിരം’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ശ്രദ്ധേയമായ മൂലഭാഷാരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: οἱ λοιποὶ
  choice: ശേഷിച്ചവർ
  rationale: ‘ബാക്കിയായവർ’ എന്ന നേരിട്ടുള്ള ആശയം നൽകുന്നു; ‘അതിജീവിച്ചവർ’ എന്ന വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: ἔμφοβοι ἐγένοντο
  choice: അത്യന്തം ഭയപ്പെട്ടു
  rationale: ഭയത്തിന്റെ ശക്തിയും അവസ്ഥാമാറ്റവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἔδωκαν δόξαν
  choice: മഹത്ത്വം നൽകി
  rationale: ബൈബിൾ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുകയും അതിനെ മാനസാന്തരമെന്നോ ആരാധനയെന്നോ അധികമായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിന്റെ ദൈവത്തിനു
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ശീർഷകം നേരിട്ട് സംരക്ഷിക്കുന്ന, dignified Malayalam biblical phrasing.
theological_decisions:
- issue: ശേഷിച്ചവരുടെ പ്രതികരണം യഥാർഥ മാനസാന്തരമോ രക്ഷാകരമായ വിശ്വാസമോ ആയിരുന്നോ എന്നത്
  choice: അവർ ‘അത്യന്തം ഭയപ്പെട്ട് സ്വർഗത്തിന്റെ ദൈവത്തിനു മഹത്ത്വം നൽകി’ എന്നു മാത്രം പറയുന്നു.
  alternative: അവർ മാനസാന്തരപ്പെട്ടു; അല്ലെങ്കിൽ ഭയത്താൽ ദൈവത്തിന്റെ ശക്തി വെറുതേ അംഗീകരിച്ചു.
  rationale: ഗ്രീക്ക് പാഠം ഭയവും ദൈവത്തിനു മഹത്ത്വം നൽകലും വ്യക്തമാക്കുന്നു; എന്നാൽ പ്രതികരണത്തിന്റെ ആന്തരിക ആത്മീയ സ്വഭാവം നിർവചിക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ഗദ്യശൈലി. ‘ആ നാഴികയിൽ,’ ‘മഹത്ത്വം നൽകി,’ ‘സ്വർഗത്തിന്റെ ദൈവം’ എന്നീ പദപ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ഔപചാരികവും അപ്പോക്കലിപ്റ്റികുമായ ഭാവം നിലനിർത്തുന്നു; അപൂർവമായോ അതിപുരാതനമായോ ഉള്ള വാക്കുകൾ ഒഴിവാക്കി.
