id: REV.11.3
reference: Revelation 11:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: ml
  text: എന്റെ രണ്ടു സാക്ഷികൾക്കു ഞാൻ നൽകും[a]; അവർ ചാക്കുവസ്ത്രം ധരിച്ച് ആയിരത്തി ഇരുനൂറ്റി അറുപത് ദിവസം പ്രവചിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എന്റെ രണ്ടു സാക്ഷികൾക്കു ഞാൻ നൽകും.” എന്താണ് നൽകുന്നതെന്ന് ഗ്രീക്ക് വ്യക്തമാക്കുന്നില്ല; പ്രവചിക്കാനുള്ള അധികാരമോ നിയോഗമോ ആയിരിക്കാം ഉദ്ദേശ്യം.'
    reason: lexical_alternative
  - marker: b
    text: ചാക്കുവസ്ത്രം ദുഃഖം, അനുതാപം, പ്രവാചകവിലാപം എന്നിവയുമായി ബന്ധപ്പെട്ടിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: ഞാൻ നൽകും
  rationale: ഗ്രീക്കിൽ ക്രിയയുടെ നേരിട്ടുള്ള കർമം വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ ‘അധികാരം നൽകും’ എന്നു മുഖ്യപാഠത്തിൽ ചേർത്ത് അർഥം തീർപ്പാക്കാതെ, ഉറവിടത്തിലെ അപൂർണതയും സന്ദർഭം സൂചിപ്പിക്കുന്ന നിയോഗം/ശേഷി എന്ന സാധ്യതയും നിലനിർത്തുന്നു.
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: എന്റെ രണ്ടു സാക്ഷികൾക്കു
  rationale: ദാതൃവിഭക്തിയും ഉടമസ്ഥബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ കൃത്യമായി പകരുന്നു; ‘സാക്ഷികൾ’ എന്നത് μάρτυς എന്ന പദത്തിന്റെ സാക്ഷ്യപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: προφητεύσουσιν
  choice: പ്രവചിക്കും
  rationale: προφητεύω എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും പ്രചാരത്തിലുള്ളതുമായ മലയാള തുല്യപദം.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: ആയിരത്തിരുനൂറ്ററുപത് ദിവസം
  rationale: കർമവിഭക്തി കാലദൈർഘ്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദിവസം’ എന്ന പ്രയോഗം അതു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: περιβεβλημένοι σάκκους
  choice: ചാക്കുവസ്ത്രം ധരിച്ചുകൊണ്ട്
  rationale: വസ്ത്രം ധരിച്ചിരിക്കുന്ന നിലയെ സൂചിപ്പിക്കുന്ന കൃതന്തവും σάκκους എന്ന ദൃശ്യപ്രതീകവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: δώσω എന്ന ക്രിയയുടെ പറയാതിരിക്കുന്ന നേരിട്ടുള്ള കർമം
  choice: മുഖ്യപാഠത്തിൽ ‘ഞാൻ നൽകും’ എന്നു മാത്രം നൽകി ഗ്രീക്കിലെ തുറന്ന ഘടന നിലനിർത്തുന്നു.
  alternative: ‘ഞാൻ അധികാരം നൽകും’ അല്ലെങ്കിൽ ‘ഞാൻ നിയോഗിക്കും.’
  rationale: അടുത്ത വാക്യഭാഗം പ്രവചനനിയോഗമോ അതിനുള്ള അധികാരമോ സൂചിപ്പിക്കാമെങ്കിലും, ഗ്രീക്ക് പാഠം എന്താണ് നൽകുന്നതെന്നു വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഒരു വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതെ അടിക്കുറിപ്പിൽ സാധ്യത വ്യക്തമാക്കുന്നു.
- issue: ചാക്കുവസ്ത്രത്തിന്റെ പ്രതീകാത്മക അർഥം
  choice: ‘ചാക്കുവസ്ത്രം’ എന്ന ദൃശ്യരൂപം മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
  alternative: ‘ദുഃഖവസ്ത്രം ധരിച്ച്.’
  rationale: ചാക്കുവസ്ത്രം ദുഃഖം, അനുതാപം, പ്രവാചകവിലാപം എന്നിവയുമായി ബന്ധപ്പെട്ടിരുന്നെങ്കിലും വാക്യം അവയിൽ ഒന്ന് മാത്രമായി അർഥം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ καὶ-ഘടന അനാവശ്യമായി ആവർത്തിക്കാതെ മലയാള വാക്യപ്രവാഹം സ്വാഭാവികമാക്കി; എന്നാൽ രണ്ട് ഭാവിക്രിയകളുടെയും ബന്ധവും ഉറവിടത്തിലെ അർഥതുറപ്പും സംരക്ഷിച്ചു.
