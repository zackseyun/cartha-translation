source:
  edition: SBLGNT
  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: ml
  text: 'അവർ സ്വർഗത്തിൽനിന്ന് അവരോടു പറയുന്ന ഒരു ഉച്ചത്തിലുള്ള ശബ്ദം കേട്ടു: “ഇവിടേക്കു കയറിവരുവിൻ.” അവർ ആ മേഘത്തിൽ[a] സ്വർഗത്തിലേക്കു കയറിപ്പോയി; അവരുടെ ശത്രുക്കൾ അവരെ നിരീക്ഷിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു മേഘത്തിൽ.” ഗ്രീക്കിൽ “ആ മേഘത്തിൽ” എന്നാണ്; ഇത് ദൈവസാന്നിധ്യവും നീതീകരണവും വെളിപ്പെടുത്തുന്ന വേദപുസ്തകീയ മേഘരംഗങ്ങളെ ഓർമിപ്പിക്കുന്നതുമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: അവർ കേട്ടു
  rationale: ἀκούω എന്ന ക്രിയയുടെ aorist രൂപം ഇവിടെ സ്വർഗീയശബ്ദം കേട്ട സംഭവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർച്ചയായി ശ്രദ്ധിച്ചു കേൾക്കുക എന്ന അർഥമല്ല.
- source_word: φωνῆς μεγάλης
  choice: ഒരു ഉച്ചത്തിലുള്ള ശബ്ദം
  rationale: μεγάλης ഇവിടെ പ്രധാനമായും ശബ്ദത്തിന്റെ ശക്തിയെയോ ഉച്ചത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം ഇതാണ്.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: വെളിപ്പാടിലെ ദർശനപരവും ദൈവികവുമായ സന്ദർഭത്തിൽ οὐρανός വെറും ആകാശമല്ല, സ്വർഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: λεγούσης αὐτοῖς
  choice: അവരോടു പറയുന്ന
  rationale: φωνῆς എന്നതിനെ വിശേഷിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപവും αὐτοῖς എന്ന ദത്തിവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ἀνάβατε ὧδε
  choice: ഇവിടേക്കു കയറിവരുവിൻ
  rationale: ബഹുവചന aorist ആജ്ഞാരൂപത്തിന്റെ മേലോട്ടുള്ള അടിയന്തര വിളിയും ὧδε എന്ന സ്ഥലസൂചനയും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: സ്വർഗത്തിലേക്കു കയറിപ്പോയി
  rationale: മേലോട്ടുള്ള ചലനവും εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യവും നിലനിർത്തുന്നു; സാങ്കേതികമായ മതപദപ്രയോഗം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐν τῇ νεφέλῃ
  choice: ആ മേഘത്തിൽ
  rationale: ഗ്രീക്കിലെ നിർദേശക ഉപപദത്തിന്റെ നിർദിഷ്ടത നിലനിർത്തുകയും ദൈവസാന്നിധ്യവുമായി ബന്ധപ്പെട്ട വേദപുസ്തകീയ മേഘപ്രതീകത്തിന്റെ സാധ്യത തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: ἐθεώρησαν
  choice: നോക്കിക്കൊണ്ടിരുന്നു
  rationale: θεωρέω വെറുതെ കണ്ടു എന്നതിലുപരി ശ്രദ്ധയോടെ നിരീക്ഷിക്കുന്ന ഭാവം നൽകുന്നു; അപൂർണ്ണഭൂതകാലരൂപത്തിന്റെ തുടരുന്ന ദൃശ്യവും ഇതിലൂടെ പ്രകടമാകുന്നു.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: അവരുടെ ശത്രുക്കൾ
  rationale: ഉടമസ്ഥബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് പകർത്തുന്നു.
theological_decisions:
- issue: ‘ആ മേഘത്തിൽ’ എന്ന പ്രയോഗത്തിലെ സാധ്യതയുള്ള വേദപുസ്തകീയ സൂചന
  choice: പ്രധാനവാചകത്തിൽ ‘ആ മേഘത്തിൽ’ നിലനിർത്തി
  alternative: ‘ഒരു മേഘത്തിൽ’
  rationale: τῇ എന്ന നിർദേശക ഉപപദം ഒരു തിരിച്ചറിയാവുന്ന മേഘത്തെ സൂചിപ്പിച്ചേക്കാം; ദൈവസാന്നിധ്യത്തിന്റെയും നീതീകരണത്തിന്റെയും മേഘപ്രതീകത്തിലേക്കുള്ള സാധ്യതയുള്ള സൂചന വ്യാഖ്യാനിച്ച് ഉറപ്പിക്കാതെ ഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള ആജ്ഞയിൽ ബഹുവചനത്തെ വ്യക്തമാക്കുന്ന ‘വരുവിൻ’ ഉപയോഗിച്ചു. ദർശനവിവരണത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അതിപുരാതനമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
