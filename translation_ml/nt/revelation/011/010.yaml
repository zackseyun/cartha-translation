revisions:
- from: ഭൂമിയിൽ വസിക്കുന്നവർ അവരെച്ചൊല്ലി സന്തോഷിക്കുകയും ആഘോഷിക്കുകയും ചെയ്യും; അവർ പരസ്പരം സമ്മാനങ്ങൾ അയയ്ക്കും. കാരണം, ഈ രണ്ടു പ്രവാചകന്മാർ ഭൂമിയിൽ വസിക്കുന്നവരെ പീഡിപ്പിച്ചിരുന്നു.
