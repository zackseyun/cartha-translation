id: REV.11.10
reference: Revelation 11:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: ml
  text: ഭൂമിയിൽ വസിക്കുന്നവർ അവരെച്ചൊല്ലി സന്തോഷിക്കുകയും ആഘോഷിക്കുകയും ചെയ്യുന്നു; അവർ പരസ്പരം സമ്മാനങ്ങൾ അയയ്ക്കും. കാരണം, ഈ രണ്ടു പ്രവാചകന്മാർ ഭൂമിയിൽ വസിക്കുന്നവരെ പീഡിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ വസിക്കുന്നവർ
  rationale: വാക്യത്തിൽ രണ്ടുതവണ വരുന്ന കർത്തൃഭാവമുള്ള ക്രിയാവിശേഷണപ്രയോഗത്തിന്റെ ക്രിയാത്മകതയും വെളിപ്പാടിലെ ആവർത്തിത പ്രയോഗവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: അവരെച്ചൊല്ലി സന്തോഷിക്കുകയും
  rationale: രണ്ടു പ്രവാചകന്മാരുടെ മരണത്തെ ആസ്പദമാക്കിയുള്ള സന്തോഷമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ἐπίയുടെ ബന്ധാർത്ഥം അമിതമായി വ്യാഖ്യാനിക്കാതെ നൽകുന്നു.
- source_word: εὐφραίνονται
  choice: ആഘോഷിക്കുകയും ചെയ്യും
  rationale: χαίρουσιν എന്നതിനോട് ബന്ധപ്പെട്ടെങ്കിലും വേറിട്ട ഉത്സവോല്ലാസത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: അവർ പരസ്പരം സമ്മാനങ്ങൾ അയയ്ക്കും
  rationale: δῶρα എന്നതിന്റെ സാധാരണ അർത്ഥവും πέμψουσιν എന്ന ഭാവികാലവും ἀλλήλοις എന്ന പരസ്പരബന്ധവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: οὗτοι οἱ δύο προφῆται
  choice: ഈ രണ്ടു പ്രവാചകന്മാർ
  rationale: നിർദ്ദേശകസർവനാമത്തോടുകൂടിയ നാമപദസമുച്ചയത്തിന്റെ ലളിതവും മാന്യവുമായ മലയാളരൂപം.
- source_word: ἐβασάνισαν
  choice: പീഡിപ്പിച്ചിരുന്നു
  rationale: βασανίζω സൂചിപ്പിക്കുന്ന കഠിനമായ യാതനയോ ദുരിതമോ മൃദൂകരിക്കാതെ നൽകുന്നു; മുൻകാല പ്രവർത്തിയുടെ സന്ദർഭബന്ധം മലയാളത്തിലെ പൂർവകാലരൂപം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വെളിപ്പാടിൽ ആവർത്തിക്കുന്ന ‘ഭൂമിയിൽ വസിക്കുന്നവർ’ എന്ന പ്രയോഗം
  choice: ഭൂമിയിൽ വസിക്കുന്നവർ
  alternative: ഭൂവാസികൾ
  rationale: ദൈവത്തിനെതിരെ നിൽക്കുന്ന ലോകത്തെ ഈ പ്രയോഗം പലപ്പോഴും സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, ആ ദൈവശാസ്ത്രപരമായ അർത്ഥം മുഖ്യപാഠത്തിൽ വിശദീകരിച്ച് ചേർക്കാതെ മൂലത്തിലെ ആവർത്തിത ക്രിയാപ്രയോഗം സംരക്ഷിക്കുന്നു.
- issue: രണ്ടു സാക്ഷികൾ ലോകത്തിനുണ്ടാക്കിയ അനുഭവത്തിന്റെ തീവ്രത
  choice: പീഡിപ്പിച്ചിരുന്നു
  alternative: ദുഃഖിപ്പിച്ചിരുന്നു
  rationale: മൂലത്തിലെ ἐβασάνισαν എന്ന ശക്തമായ പദത്തെ മൃദൂകരിക്കാതെ, അധിക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെയും അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ വെളിപ്പാടിന്റെ ഗൗരവത്തിന് യോജിച്ച മലയാളം. മൂലവാക്യത്തിലെ വർത്തമാനകാലത്തിൽനിന്ന് ഭാവികാലത്തിലേക്കുള്ള മാറൽ മലയാളത്തിൽ ‘സന്തോഷിക്കുകയും ആഘോഷിക്കുകയും ചെയ്യും’ എന്ന ഏകോപിത ഭാവികാലഘടനയായി സ്വാഭാവികമാക്കി; സമ്മാനങ്ങൾ അയയ്ക്കുന്നതിലെ ഭാവികാലം വ്യക്തമായി നിലനിർത്തി.
