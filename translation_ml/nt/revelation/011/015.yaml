id: REV.11.15
reference: Revelation 11:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: ml
  text: 'ഏഴാമത്തെ ദൂതൻ കാഹളം മുഴക്കി[a]. അപ്പോൾ സ്വർഗത്തിൽ ഇങ്ങനെ പറയുന്ന ഉച്ചത്തിലുള്ള ശബ്ദങ്ങൾ ഉണ്ടായി: “ലോകത്തിന്റെ രാജത്വം നമ്മുടെ കർത്താവിന്റെയും അവിടത്തെ മശിഹായുടെയും[b] ആയിത്തീർന്നിരിക്കുന്നു; അവിടുന്ന് എന്നെന്നേക്കും വാഴും[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ലോകത്തിന്റെ രാജ്യങ്ങൾ ആയിത്തീർന്നിരിക്കുന്നു” എന്നും മറ്റുചിലതിൽ “ഈ ലോകത്തിന്റെ രാജത്വം ആയിത്തീർന്നിരിക്കുന്നു” എന്നും വായനയുണ്ട്. SBLGNT-യിലെ വായന ഏകവചനത്തിൽ “ലോകത്തിന്റെ രാജത്വം” എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: അഥവാ “അവിടത്തെ ക്രിസ്തുവിന്റെയും.” ഗ്രീക്കിലെ Χριστός ഇവിടെ പദവിനാമമായതിനാൽ “മശിഹാ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “യുഗങ്ങളുടെ യുഗങ്ങളിലേക്ക്”; അവസാനമില്ലാത്ത കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: കാഹളം മുഴക്കി
  rationale: σαλπίζω എന്ന ക്രിയയിൽ സൂചിപ്പിച്ചിരിക്കുന്ന വാദ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കി നൽകുന്നു; അർഥത്തിൽ അന്യമായ ഒന്നും ചേർക്കുന്നില്ല.
- source_word: φωναὶ μεγάλαι
  choice: ഉച്ചത്തിലുള്ള ശബ്ദങ്ങൾ
  rationale: λέγοντες പിന്തുടരുന്നതിനാൽ സംസാരിക്കുന്ന ശബ്ദങ്ങളാണ് ഉദ്ദേശ്യം. μεγάλαι ഇവിടെ വലുപ്പത്തേക്കാൾ ശബ്ദത്തിന്റെ ഉച്ചതയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: വെളിപ്പാടിലെ ഈ സന്ദർഭത്തിൽ οὐρανός ആകാശമണ്ഡലത്തെയല്ല, സ്വർഗീയ മണ്ഡലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: ലോകത്തിന്റെ രാജത്വം ... ആയിത്തീർന്നിരിക്കുന്നു
  rationale: SBLGNT-യിൽ βασιλεία ഏകവചനമാണ്. ഇവിടെ അത് ഭൂപ്രദേശമായ രാജ്യമെന്നതിലുപരി രാജകീയ അധികാരത്തെയും ഭരണത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘രാജത്വം’ യോജിക്കുന്നു. പ്രഖ്യാപിക്കപ്പെടുന്ന പൂർത്തിയായ സംഭവത്തിന്റെ ഇപ്പോഴത്തെ ഫലം അറിയിക്കാൻ ‘ആയിത്തീർന്നിരിക്കുന്നു’ ഉപയോഗിച്ചു.
- source_word: τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ
  choice: നമ്മുടെ കർത്താവിന്റെയും അവിടത്തെ മശിഹായുടെയും
  rationale: രണ്ട് ജനിറ്റീവുകളെയും സമാന്തരമായി നിലനിർത്തുന്നു. Χριστός ഇവിടെ വ്യക്തമായ പദവിനാമമായതിനാൽ ‘മശിഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: καὶ βασιλεύσει
  choice: അവിടന്ന് ... വാഴും
  rationale: ഗ്രീക്കിലെ ക്രിയ ഏകവചനമായതിനാൽ ഏകവചന സർവനാമം നിലനിർത്തി; അതിന്റെ കൃത്യമായ പൂർവപദം വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമായ സംഘർഷം നീക്കിയിട്ടില്ല.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: ‘യുഗങ്ങളുടെ യുഗങ്ങളിലേക്ക്’ എന്ന ഗ്രീക്ക് പ്രയോഗം അവസാനമില്ലാത്ത ദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്നു; ‘എന്നെന്നേക്കും’ അതിന്റെ സ്വാഭാവിക മലയാള തുല്യമാണ്.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശിഹാ
  alternative: ക്രിസ്തു
  rationale: τοῦ χριστοῦ αὐτοῦ (‘അവിടത്തെ Χριστός’) എന്ന ഘടനയിൽ ഇത് പേരുപോലെയല്ല, അഭിഷിക്തനായ ഭരണാധികാരിയുടെ പദവിയായാണ് പ്രവർത്തിക്കുന്നത്.
- issue: βασιλεύσει എന്ന ഏകവചന ക്രിയയുടെ കർത്താവ്
  choice: അവിടന്ന് വാഴും
  alternative: അവർ വാഴും / കർത്താവും അവിടത്തെ മശിഹായും വാഴും
  rationale: മൂലപാഠത്തിലെ ക്രിയ ഏകവചനമാണ്. പൂർവപദം കൂടുതൽ വ്യക്തമായി നിർണ്ണയിക്കാതെ, ഗ്രീക്കിലെ ചുരുക്കവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
- issue: βασιλεία എന്നതിന്റെ അർഥപരിധി
  choice: രാജത്വം
  alternative: രാജ്യം
  rationale: ഇവിടെ ലോകം ഒരു ഭൂപ്രദേശീയ രാജ്യമായി മാറുന്നു എന്നതല്ല, അതിന്മേലുള്ള രാജാധികാരം കർത്താവിന്റെയും മശിഹായുടെയും ആയിത്തീരുന്നു എന്ന ആശയമാണ് മുൻനിൽക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കർത്താവ്’, ‘മശിഹാ’, ‘രാജത്വം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ദൈവശാസ്ത്രപരമായ കൃത്യതയോടെ ഉപയോഗിച്ചു. ബഹുമാനസൂചകമായ ‘അവിടന്ന്/അവിടത്തെ’ ഉപയോഗിച്ചെങ്കിലും മൂലപാഠത്തിലെ ഏകവചന കർത്താവിന്റെ അനിശ്ചിത പൂർവപദം പരിഹരിച്ചിട്ടില്ല.
