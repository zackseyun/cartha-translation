id: REV.11.4
reference: Revelation 11:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: ml
  text: ഭൂമിയുടെ കർത്താവിന്റെ മുമ്പിൽ നിൽക്കുന്ന ഇവർ രണ്ടു ഒലിവുമരങ്ങളും രണ്ടു വിളക്കുതണ്ടുകളും ആകുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സെഖര്യാവ് 4-ലേക്കുള്ള സൂചന. അവിടെ ഒലിവുമരങ്ങളുടെയും വിളക്കുതണ്ടുകളുടെയും ദൃശ്യങ്ങൾ ദൈവം നിയോഗിക്കുകയും ആത്മാവിനാൽ ശക്തിപ്പെടുത്തുകയും ചെയ്ത ശുശ്രൂഷകരെ പ്രതിനിധീകരിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: 'അഥവാ: “ഇവർ രണ്ടു ഒലിവുമരങ്ങളും രണ്ടു വിളക്കുതണ്ടുകളും ആകുന്നു; ഇവർ ഭൂമിയുടെ കർത്താവിന്റെ മുമ്പിൽ നിൽക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτοί
  choice: ഇവർ
  rationale: സന്ദർഭത്തിലെ രണ്ട് സാക്ഷികളെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ ബഹുവചന സർവനാമമാണ്. മുൻവാക്യത്തിലെ ‘സാക്ഷികൾ’ എന്ന പദം ഇവിടെ കൂട്ടിച്ചേർക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: ἐλαῖαι
  choice: ഒലിവുമരങ്ങൾ
  rationale: സെഖര്യാവ് 4-ലെ ദൃശ്യപ്രതീകത്തോടുള്ള ബന്ധം നിലനിർത്താൻ, ഫലങ്ങളെയല്ല മരങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: λυχνίαι
  choice: വിളക്കുതണ്ടുകൾ
  rationale: വിളക്കുകളെയല്ല, വിളക്കുകൾ വയ്ക്കുന്ന തണ്ടുകളെയാണ് λυχνία സൂചിപ്പിക്കുന്നത്; വെളിപ്പാടിലെ ആവർത്തിത ദൃശ്യപ്രതീകവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: ἐνώπιον
  choice: മുമ്പിൽ
  rationale: ഒരാളുടെ സന്നിധിയിലുള്ള സ്ഥാനത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന ബഹുമാനസൂചകവും ദൈവശാസ്ത്രപരവുമായ സ്ഥാനപ്പേരിന്റെ പതിവായ മലയാളരൂപമാണ്.
- source_word: γῆς
  choice: ഭൂമി
  rationale: വെളിപ്പാടിന്റെ വിശാലമായ പ്രാപഞ്ചിക പശ്ചാത്തലത്തിൽ ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ യോജിക്കുന്നു.
- source_word: ἑστῶτες
  choice: നിൽക്കുന്ന
  rationale: ἵστημι എന്ന ക്രിയയുടെ perfect active participle ആണിത്; നിലയുറപ്പിച്ച് ഇപ്പോഴും നിൽക്കുന്ന അവസ്ഥയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: സെഖര്യാവ് 4-ലെ ദൃശ്യപ്രതീകവും രണ്ട് സാക്ഷികളുടെ വ്യക്തിത്വവും തമ്മിലുള്ള ബന്ധം
  choice: ‘രണ്ട് ഒലിവുമരങ്ങളും രണ്ട് വിളക്കുതണ്ടുകളും’ എന്ന രൂപകം വിശദീകരണമില്ലാതെ നേരിട്ട് നിലനിർത്തി.
  alternative: ‘ഈ രണ്ട് സാക്ഷികൾ രണ്ട് ഒലിവുമരങ്ങളെയും രണ്ട് വിളക്കുതണ്ടുകളെയും പോലെയാണ്’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം.
  rationale: ഗ്രീക്ക് പാഠം ഉപമയായി പറയാതെ ദൃശ്യപ്രതീകത്തിലൂടെ അവരെ തിരിച്ചറിയിക്കുന്നു. നേരിട്ടുള്ള രൂപകം അന്തർപാഠബന്ധവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- issue: ἑστῶτες എന്ന പുല്ലിംഗ പങ്കാളിക്രിയയുടെ ബന്ധം
  choice: ‘മുമ്പിൽ നിൽക്കുന്ന’ എന്ന പങ്കാളിക്രിയാരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘ഇവരാണ് രണ്ട് ഒലിവുമരങ്ങളും രണ്ട് വിളക്കുതണ്ടുകളും; ഇവർ ഭൂമിയുടെ കർത്താവിന്റെ മുമ്പിൽ നിൽക്കുന്നു’ എന്ന് വ്യക്തമായി രണ്ട് പ്രസ്താവനകളാക്കുക.
  rationale: ഗ്രീക്കിൽ പങ്കാളിക്രിയ പുല്ലിംഗമായതിനാൽ അത് ‘ഇവർ’ എന്നു സൂചിപ്പിക്കപ്പെടുന്ന സാക്ഷികളോടാണ് വ്യാകരണപരമായി ചേരുന്നത്; എന്നാൽ വാക്യത്തിന്റെ ദൃശ്യരൂപകഘടനയും ഘടകങ്ങളുടെ സ്ഥാനവും ഒരു പരിധിവരെ തുറന്നതായതിനാൽ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ പങ്കാളിക്രിയാരൂപവും അടിക്കുറിപ്പിൽ കൂടുതൽ വ്യക്തമായ പര്യായവും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘വിളക്കുതണ്ടുകൾ’ എന്ന പദം ‘വിളക്കുകൾ’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി മൂലപദത്തിന്റെ അർഥം കൃത്യമായി നൽകുന്നു; രൂപകത്തെ മുഖ്യപാഠത്തിൽ വിശദീകരിച്ചിട്ടില്ല.
