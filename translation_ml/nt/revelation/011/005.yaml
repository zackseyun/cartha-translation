id: REV.11.5
reference: Revelation 11:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: ml
  text: ആരെങ്കിലും അവരെ ഉപദ്രവിക്കാൻ ആഗ്രഹിക്കുന്നുവെങ്കിൽ, അവരുടെ വായിൽനിന്ന്[a] തീ പുറപ്പെടുകയും അവരുടെ ശത്രുക്കളെ ദഹിപ്പിക്കുകയും ചെയ്യുന്നു. ആരെങ്കിലും അവരെ ഉപദ്രവിക്കാൻ ആഗ്രഹിച്ചാൽ, ഇങ്ങനെതന്നെ അയാൾ കൊല്ലപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവരുടെ വായിൽനിന്ന്.’ ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം ബഹുവചനമാണെങ്കിലും ‘വായ്’ എന്ന നാമം ഏകവചനത്തിലാണ്; ‘അവരുടെ വായുകളിൽനിന്ന്’ എന്നും മനസ്സിലാക്കാം.
    reason: ഗ്രീക്കിലെ ഏകവചന നാമവും ബഹുവചന ഉടമസ്ഥസർവനാമവും വ്യക്തമാക്കുന്ന വിവർത്തന-വ്യാകരണക്കുറിപ്പ്.
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: ഉപദ്രവിക്കാൻ
  rationale: രണ്ടു സാക്ഷികൾക്കെതിരായ ശത്രുതാപരമായ ദോഷപ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; അനീതിചെയ്യുക എന്ന പരിമിത അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: πῦρ
  choice: തീ
  rationale: വെളിപ്പാടിലെ ദൃശ്യബിംബം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: അവരുടെ വായിൽനിന്ന് തീ പുറപ്പെടുന്നു
  rationale: ἐκπορεύεται എന്ന വർത്തമാനകാലപ്രയോഗവും ഏകവചനമായ στόματος എന്ന രൂപവും കഴിയുന്നത്ര അടുത്തായി സൂക്ഷിക്കുന്നു.
- source_word: κατεσθίει
  choice: ദഹിപ്പിക്കുന്നു
  rationale: പൂർണമായി നശിപ്പിക്കുന്ന ശക്തമായ അർഥം മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: ἐχθροὺς
  choice: ശത്രുക്കളെ
  rationale: സാക്ഷികളോട് ശത്രുത പുലർത്തുന്നവരെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ പദം.
- source_word: θέλει / θελήσῃ
  choice: ആഗ്രഹിക്കുന്നെങ്കിൽ / ആഗ്രഹിച്ചാൽ
  rationale: ആദ്യത്തെ വർത്തമാന നിർദ്ദേശകക്രിയയും രണ്ടാമത്തെ അനിശ്ചിതസാധ്യത സൂചിപ്പിക്കുന്ന ഉപാധിവാക്യവും മലയാളത്തിൽ സൂക്ഷ്മമായി വേർതിരിക്കുന്നു.
- source_word: οὕτως
  choice: ഇങ്ങനെതന്നെ
  rationale: മുൻപ് വിവരിച്ച തീകൊണ്ടുള്ള നാശരീതിയിലേക്കുള്ള തിരിച്ചുസൂചന വ്യക്തമാക്കുന്നു.
- source_word: δεῖ
  choice: കൊല്ലപ്പെടണം
  rationale: അനിവാര്യതയുടെ ശക്തി ‘-ണം’ രൂപത്തിലൂടെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀποκτανθῆναι
  choice: കൊല്ലപ്പെടണം
  rationale: കർമണിപ്രയോഗം സംരക്ഷിക്കുകയും കൊലയുടെ പ്രവർത്തകനെ പാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വായിൽനിന്ന് പുറപ്പെടുന്ന തീ അക്ഷരാർഥത്തിലോ പ്രതീകാർഥത്തിലോ എടുക്കണമോ
  choice: തീ വായിൽനിന്ന് പുറപ്പെടുന്നു എന്ന ദൃശ്യബിംബം അതേപടി നിലനിർത്തി.
  alternative: വിധി പ്രഖ്യാപിക്കുന്ന വാക്കുകളുടെ പ്രതീകമായി വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം ദൃശ്യബിംബം നേരിട്ട് അവതരിപ്പിക്കുന്നു. അതിന്റെ അക്ഷരാർഥ–പ്രതീകാർഥ സാധ്യത വിവർത്തനം തീർപ്പാക്കുന്നില്ല.
- issue: οὕτως സൂചിപ്പിക്കുന്ന മരണരീതി
  choice: ‘ഇങ്ങനെതന്നെ’ എന്ന് മുൻവാക്യത്തിലെ നാശരീതിയിലേക്ക് തിരിച്ചുചൂണ്ടി.
  alternative: പൊതുവായി ‘അയാൾ തീർച്ചയായും കൊല്ലപ്പെടും’ എന്നു നൽകുക.
  rationale: ഗ്രീക്കിലെ രീതിസൂചകമായ οὕτως ഒഴിവാക്കാതെ, അതിന്റെ വ്യാഖ്യാനപരമായ തീവ്രത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അപോകലിപ്റ്റിക് ദൃശ്യബിംബം വ്യാഖ്യാനിക്കാതെ സംരക്ഷിച്ചു. ‘അയാൾ’ എന്നത് വ്യാകരണപരമായി വ്യക്തിയെ സൂചിപ്പിക്കുന്നതേയുള്ളൂ; ലിംഗത്തെ ഊന്നുന്നില്ല.
