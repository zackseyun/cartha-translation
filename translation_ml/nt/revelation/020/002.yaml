id: REV.20.2
reference: Revelation 20:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: ml
  text: അവൻ മഹാസർപ്പത്തെ—ആ പുരാതന സർപ്പത്തെ, അതായത് പിശാചും സാത്താനും ആയവനെ—പിടിച്ചു; അവനെ ആയിരം വർഷത്തേക്ക് ബന്ധിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκράτησεν
  choice: പിടിച്ച്
  rationale: ഇവിടെ κρατέω ബലമായി പിടികൂടുന്ന നിർണായക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘പിടിച്ച്’ എന്നത് സ്വാഭാവികവും സംക്ഷിപ്തവുമായി ആ പ്രവർത്തിയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: δράκοντα
  choice: മഹാസർപ്പത്തെ
  rationale: വെളിപ്പാടിലെ അപോകലിപ്റ്റിക് ദൃശ്യഭാഷയിൽ δράκων എന്നതിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും വ്യക്തവുമായ തുല്യപദമാണ് ‘മഹാസർപ്പം’; സാധാരണ ‘സർപ്പം’ എന്ന ὄφις-ൽനിന്നുള്ള വ്യത്യാസവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: ആ പുരാതന സർപ്പത്തെ
  rationale: ഇത് മഹാസർപ്പത്തെ വിശദീകരിച്ച് തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ പ്രയോഗമാണ്. ‘ആ’ എന്നത് മുമ്പ് അറിയപ്പെടുന്ന ആദിമ സർപ്പത്തിലേക്കുള്ള സൂചന സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ഗ്രീക്കിലെ ഇരട്ട നിർദ്ദേശക ഉപപദത്തിന്റെ ഊന്നലും ഭാഗികമായി നിലനിർത്തുന്നു.
- source_word: Διάβολος
  choice: പിശാച്
  rationale: Διάβολος എന്ന അംഗീകൃത പദവിയുടെ സാധാരണവും വ്യക്തവുമായ മലയാള രൂപം; ഇവിടെ ഒരേ വ്യക്തിയെ തിരിച്ചറിയിക്കുന്ന പേരായി ഉപയോഗിക്കുന്നു.
- source_word: Σατανᾶς
  choice: സാത്താൻ
  rationale: വ്യക്തിനാമം/പദവി എന്ന നിലയിൽ മലയാളത്തിൽ സ്ഥിരപ്പെട്ട ലിപ്യന്തരണം.
- source_word: ἔδησεν
  choice: ബന്ധിച്ചു
  rationale: δέω എന്നതിന്റെ മൂർത്തമായ ബന്ധനദൃശ്യം നിലനിർത്തുന്നു; ബന്ധനത്തിന്റെ സ്വഭാവത്തെ ‘തടഞ്ഞു’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: χίλια ἔτη
  choice: ആയിരം വർഷത്തേക്ക്
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന accusative പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘വർഷത്തേക്ക്’ എന്നു നൽകി; സംഖ്യയെ പ്രതീകാത്മകമോ അക്ഷരാർഥമോ എന്നു വിവർത്തനം തന്നെ തീരുമാനിക്കുന്നില്ല.
theological_decisions:
- issue: ആയിരം വർഷത്തിന്റെ സ്വഭാവം
  choice: χίλια ἔτη എന്നത് നേരിട്ട് ‘ആയിരം വർഷത്തേക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: അക്ഷരാർഥത്തിലുള്ള ആയിരം വർഷമെന്നോ പ്രതീകാത്മക കാലഘട്ടമെന്നോ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: കാലഘട്ടം അക്ഷരാർഥമോ പ്രതീകാത്മകമോ എന്ന സഹസ്രാബ്ദവാദ തർക്കം വാക്യം സ്വയം തീർപ്പാക്കുന്നില്ല; അതിനാൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: മഹാസർപ്പത്തിന്റെ തിരിച്ചറിയൽ
  choice: മഹാസർപ്പം, പുരാതന സർപ്പം, പിശാച്, സാത്താൻ എന്നീ മുഴുവൻ തിരിച്ചറിയൽശൃംഖലയും നിലനിർത്തി.
  alternative: പേരുകൾ ഒറ്റ ലളിതമായ വിശേഷണമായി ചുരുക്കുക.
  rationale: വാക്യം തന്നെ ഒരേ വ്യക്തിയെ ഈ എല്ലാ പേരുകളാലും വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു; അവയിൽ ഒന്നും ഒഴിവാക്കുകയോ ലയിപ്പിക്കുകയോ ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘മഹാസർപ്പം’ വെളിപ്പാടിലെ ദൃശ്യഭാഷയും δράκων/ὄφις വ്യത്യാസവും നിലനിർത്തുന്നു. ഇടയ്ക്കുള്ള തിരിച്ചറിയൽവാക്യം ദീർഘരേഖകൾകൊണ്ട് വേർതിരിച്ച് ഗ്രീക്കിലെ സമാനാധികരണ ഘടന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
