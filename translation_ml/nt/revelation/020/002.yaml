revisions:
- from: അവൻ മഹാസർപ്പത്തെ—പിശാചും സാത്താനും ആയ ആ പുരാതന സർപ്പത്തെ[a]—പിടിച്ച് ആയിരം വർഷത്തേക്ക് ബന്ധിച്ചു.
  to: അവൻ മഹാസർപ്പത്തെ—ആ പുരാതന സർപ്പത്തെ, അതായത് പിശാചും സാത്താനും ആയവനെ—പിടിച്ചു; അവനെ ആയിരം വർഷത്തേക്ക് ബന്ധിച്ചു.
