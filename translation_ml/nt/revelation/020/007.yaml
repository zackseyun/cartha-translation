id: REV.20.7
reference: Revelation 20:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: ml
  text: ആയിരം വർഷം പൂർത്തിയാകുമ്പോൾ, സാത്താൻ തന്റെ തടവറയിൽനിന്ന് മോചിപ്പിക്കപ്പെടും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: ആകുമ്പോൾ
  rationale: ഭാവിയിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന സമയത്തെ സൂചിപ്പിക്കുന്ന ὅταν + ഉപവാക്യക്രിയയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘ശേഷം’ എന്ന അധിക കാലക്രമവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: τελεσθῇ
  choice: പൂർത്തിയാകുക
  rationale: τελέω എന്ന ക്രിയയുടെ aorist passive subjunctive രൂപം നിർവചിക്കപ്പെട്ട കാലയളവ് പൂർത്തിയാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പൂർത്തിയാകുമ്പോൾ’ ഫലാവസ്ഥയും സമയബന്ധവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὰ χίλια ἔτη
  choice: ആയിരം വർഷം
  rationale: മുൻസന്ദർഭത്തിൽ പരാമർശിച്ച നിർവചിത കാലയളവിനെയാണ് ഗ്രീക്ക് നിർദേശകം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സംഖ്യയോടുകൂടിയ ഈ പ്രയോഗത്തിന് പ്രത്യേക നിർദേശകപദം ആവശ്യമില്ല; സന്ദർഭം നിർവചിതത്വം വ്യക്തമാക്കുന്നു.
- source_word: λυθήσεται
  choice: മോചിപ്പിക്കപ്പെടും
  rationale: λύωയുടെ future passive രൂപം ആ ബന്ധനത്തിൽനിന്നുള്ള വിടുതലിനെ സൂചിപ്പിക്കുന്നു. ‘മോചിപ്പിക്കപ്പെടും’ കർമണിപ്രയോഗം നിലനിർത്തുകയും അനുകൂലമായ നൈതിക വിലയിരുത്തൽ നിർബന്ധമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: Σατανᾶς
  choice: സാത്താൻ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥാപിതമായ പേരിന്റെ ലിപ്യന്തരണം.
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: തന്റെ തടവറയിൽനിന്ന്
  rationale: ഈ സന്ദർഭത്തിൽ φυλακή തടവിടത്തെയാണ് സൂചിപ്പിക്കുന്നത്. αὐτοῦ സാത്താനിലേക്കു തന്നെ തിരിച്ചുപോകുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രതിഫലനസർവനാമമായ ‘തന്റെ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ആയിരം വർഷത്തിന്റെ സ്വഭാവം
  choice: ‘ആയിരം വർഷം’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി
  alternative: അക്ഷരാർഥത്തിലുള്ള ആയിരവർഷ ഭരണകാലം / പ്രതീകാത്മകമായ ദീർഘകാലം
  rationale: ഈ വാക്യം കാലയളവിനെ പരാമർശിക്കുന്നുവെങ്കിലും അത് അക്ഷരാർഥത്തിലോ പ്രതീകാത്മകമായോ ഗ്രഹിക്കണമെന്നു തീരുമാനിക്കുന്നില്ല. അതിനാൽ സഹസ്രാബ്ദത്തെക്കുറിച്ചുള്ള പ്രത്യേക ദൈവശാസ്ത്ര സമ്പ്രദായം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- issue: സാത്താന്റെ വിടുതലിന്റെ മൂല്യനിർണയം
  choice: ഗ്രീക്കിലെ കർമണി രൂപം അനുസരിച്ച് ‘മോചിപ്പിക്കപ്പെടും’
  alternative: ‘സ്വതന്ത്രനാക്കപ്പെടും’ / ‘അഴിച്ചുവിടപ്പെടും’
  rationale: വിടുതൽ നടത്തുന്ന കർത്താവിനെ വാക്യം പേരെടുത്തു പറയുന്നില്ല; അതിന്റെ നൈതിക അർഥവും ഇവിടെ വിശദീകരിക്കുന്നില്ല. കർമണി രൂപം ഈ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ കാലക്രമവും കർമണി ഘടനയും നിലനിർത്തി; സഹസ്രാബ്ദത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
