  source_fidelity: 'ഗ്രീക്ക് വാക്യത്തിലെ കാലസൂചനയും ക്രമവും കൃത്യമായി പ്രതിഫലിക്കുന്നു: ὅταν ... τελεσθῇ എന്ന ഭാവിസന്ദർഭം ‘പൂർത്തിയാകുമ്പോൾ’ എന്നും, λυθήσεται എന്ന ഭാവികർമണി ‘മോചിപ്പിക്കപ്പെടും’ എന്നും നൽകിയിരിക്കുന്നു. τὰ χίλια ἔτηയിലെ നിർദിഷ്ടമായ കാലഘട്ടം സന്ദർഭാനുസൃതമായി ‘ആയിരം വർഷം’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്. ‘തന്റെ തടവറയിൽനിന്ന്’ ἐκ τῆς φυλακῆς αὐτοῦ-വിന്റെ അർഥവും ഉടമസ്ഥബന്ധവും ശരിയായി നൽകുന്നു.'
  naturalness: വാക്യം ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. സംഖ്യയോടൊപ്പം ‘വർഷം’ ഏകവചനരൂപത്തിൽ വരുന്നത് മലയാളത്തിലെ സാധാരണ അളവുപ്രയോഗമാണ്; അതിനാൽ അത് ഗ്രീക്കിലെ ബഹുവചനാർഥത്തെ നഷ്ടപ്പെടുത്തുന്നില്ല.
