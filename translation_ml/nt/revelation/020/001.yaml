id: REV.20.1
reference: Revelation 20:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: ml
  text: പിന്നെ, അഗാധത്തിന്റെ[a] താക്കോലും ഒരു വലിയ ചങ്ങലയും കൈയിൽ പിടിച്ചുകൊണ്ട് സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുന്ന ഒരു ദൂതനെ ഞാൻ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അഗാധം’ എന്നതിന് ‘അടിയില്ലാത്ത കുഴി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ‘അഗാധം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: പിന്നെ
  rationale: ദർശനപരമ്പരയിലെ അടുത്ത രംഗം പരിചയപ്പെടുത്തുന്ന ബന്ധകമായി സ്വാഭാവികമായ മലയാളം; ഗ്രീക്കിലെ ലളിതമായ ആഖ്യാനതുടർച്ച നിലനിർത്തുന്നു.
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: ദർശനവിവരണത്തിലെ aorist ക്രിയയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἄγγελον
  choice: ഒരു ദൂതനെ
  rationale: സന്ദർഭം സ്വർഗീയ ജീവിയെയാണു സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘സന്ദേശവാഹകൻ’ എന്നതിനെക്കാൾ ‘ദൂതൻ’ യോജിക്കുന്നു.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുന്ന
  rationale: വർത്തമാന കൃദന്തത്തിന്റെ പുരോഗമനസ്വഭാവവും ἐκ സൂചിപ്പിക്കുന്ന ഉത്ഭവസ്ഥാനവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔχοντα
  choice: കൈയിൽ പിടിച്ചുകൊണ്ട്
  rationale: താക്കോലും ചങ്ങലയും ദൂതന്റെ കൈവശമുണ്ടെന്ന ദൃശ്യരൂപം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: അഗാധത്തിന്റെ താക്കോൽ
  rationale: ഗ്രീക്കിലെ genitive ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; ‘അഗാധത്തിലേക്കുള്ള താക്കോൽ’ എന്നതും സാധ്യമെങ്കിലും അത് ബന്ധത്തിന്റെ സ്വഭാവം കൂടുതൽ വ്യാഖ്യാനിക്കും.
- source_word: ἅλυσιν μεγάλην
  choice: ഒരു വലിയ ചങ്ങല
  rationale: വലുപ്പമോ പ്രഭാവമോ സൂചിപ്പിക്കുന്ന μεγάλην എന്ന പദത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പരിഭാഷ.
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: കൈയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘കൈമേൽ’ എന്നു വരാമെങ്കിലും വസ്തുക്കൾ കൈവശം വഹിക്കുന്ന ഈ ദൃശ്യത്തിന് ‘കൈയിൽ’ എന്നതാണ് സ്വാഭാവിക മലയാളം.
theological_decisions:
- issue: വെളിപ്പാട് സാഹിത്യത്തിലെ ἄβυσσος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അഗാധം
  alternative: അടിയില്ലാത്ത കുഴി
  rationale: ‘അഗാധം’ ഗ്രീക്ക് പദത്തിന്റെ വിശാലവും നിർവചിക്കപ്പെടാത്തതുമായ ദൃശ്യത്തെ നിലനിർത്തുന്നു; ‘അടിയില്ലാത്ത കുഴി’ മൂലപദത്തിൽ വ്യക്തമാക്കാത്ത രൂപകൽപ്പന കൂടുതൽ ചേർക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ദർശനവിവരണശൈലി. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കനുസരിച്ച് ക്രമീകരിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പിന്റെ സൂചകം അതു വിശദീകരിക്കുന്ന ‘അഗാധം’ എന്ന പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
