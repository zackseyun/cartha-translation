source:
  edition: SBLGNT
  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: ml
  text: മരിച്ചവരിൽ ശേഷിച്ചവർ ആയിരം വർഷം പൂർത്തിയാകുന്നതുവരെ ജീവൻ പ്രാപിച്ചില്ല[a]. ഇതാണ് ഒന്നാമത്തെ പുനരുത്ഥാനം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആയിരം വർഷം പൂർത്തിയാകുന്നതുവരെ ജീവിച്ചില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: ശേഷിച്ചവർ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ കൂട്ടത്തിൽ ഉൾപ്പെടാത്ത ശേഷിച്ചവരെ സൂചിപ്പിക്കുന്ന വൈരുധ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τῶν νεκρῶν
  choice: മരിച്ചവരിൽ
  rationale: മരിച്ച വ്യക്തികളുടെ കൂട്ടത്തിൽനിന്നുള്ള ശേഷിപ്പിനെ മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐκ ἔζησαν
  choice: ജീവൻ പ്രാപിച്ചില്ല
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിൽ ζάω എന്ന ക്രിയയുടെ ജീവിക്കാനാരംഭിക്കുക/വീണ്ടും ജീവനിലേക്കു വരുക എന്ന പ്രവേശനാർഥം വ്യക്തമാക്കുന്നു; അതേസമയം 'ജീവിച്ചില്ല' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἄχρι τελεσθῇ
  choice: പൂർത്തിയാകുന്നതുവരെ
  rationale: ഒരു നിശ്ചിത കാലയളവ് അതിന്റെ സമാപ്തിയിലെത്തുന്നതുവരെ എന്ന പരിധിയും പൂർത്തീകരണാർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ χίλια ἔτη
  choice: ആയിരം വർഷം
  rationale: മുൻസന്ദർഭത്തിൽ പരാമർശിച്ച നിർദിഷ്ടമായ ആയിരം വർഷത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ എണ്ണപദത്തോടൊപ്പം ഏകവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: αὕτη
  choice: ഇതാണ്
  rationale: മുൻപ് വിവരിച്ച യാഥാർഥ്യത്തിലേക്കു ചൂണ്ടുന്ന പ്രകടമായ നിർദ്ദേശാർഥം നിലനിർത്തുന്നു.
- source_word: ἡ ἀνάστασις ἡ πρώτη
  choice: ഒന്നാമത്തെ പുനരുത്ഥാനം
  rationale: ἀνάστασις എന്ന പുനരുത്ഥാനപദവും πρώτη എന്ന ക്രമസൂചനയും നേരിട്ട്, സഭാപാരമ്പര്യങ്ങളിൽ സാധാരണ ഗ്രഹിക്കാവുന്ന ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: '''ഇതാണ് ഒന്നാമത്തെ പുനരുത്ഥാനം'' എന്നതിലെ സൂചകത്തിന്റെ പരാമർശം'
  choice: മുൻസന്ദർഭത്തിൽ വിവരിച്ച പുനരുത്ഥാനയാഥാർഥ്യത്തിലേക്കുള്ള വിശാലമായ സൂചനയായി വിവർത്തനം തുറന്നുവെക്കുന്നു.
  alternative: ഇത് 4-ാം വാക്യത്തിലെ രക്തസാക്ഷികളെ മാത്രം സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ നീതിമാന്മാരായ എല്ലാ മരിച്ചവരെയും സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ ആത്മീയ പുനരുത്ഥാനമായി വ്യാഖ്യാനിക്കുന്നു.
  rationale: ഗ്രീക്ക് വാചകം 'ഇതാണ് ഒന്നാമത്തെ പുനരുത്ഥാനം' എന്നു മാത്രമാണ് പറയുന്നത്. ഒരു പ്രത്യേക സഹസ്രാബ്ദാന്ത്യ പദ്ധതിയെയോ വ്യാഖ്യാനത്തെയോ വിവർത്തനത്തിലേക്ക് ചേർക്കാതിരിക്കുന്നു.
- issue: ἔζησαν എന്ന ക്രിയയുടെ സന്ദർഭാർഥം
  choice: പുനരുത്ഥാനസന്ദർഭത്തോട് യോജിച്ച് 'ജീവൻ പ്രാപിച്ചില്ല' എന്നു നൽകി.
  alternative: '''ജീവിച്ചില്ല'' എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം; അല്ലെങ്കിൽ ആത്മീയമായി ജീവൻ പ്രാപിച്ചു എന്ന വ്യാഖ്യാനം.'
  rationale: അടുത്തുള്ള പുനരുത്ഥാനഭാഷ ജീവിക്കാനാരംഭിക്കുക/ജീവനിലേക്കു വരുക എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ മൂലത്തിലെ ചുരുക്കവും വ്യാഖ്യാനപരമായ പിരിമുറുക്കവും നിലനിർത്താൻ കൂടുതൽ വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. 'ജീവൻ പ്രാപിച്ചില്ല' പുനരുത്ഥാനസന്ദർഭം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത സംരക്ഷിക്കുന്നു. മുഖ്യവാചകത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
