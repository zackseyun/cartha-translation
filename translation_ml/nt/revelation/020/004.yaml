  source_fidelity: 'ഗ്രീക്ക് വാക്യഘടനയും പ്രധാന അവ്യക്തതകളും വിശ്വസ്തമായി നിലനിർത്തിയിരിക്കുന്നു: സിംഹാസനങ്ങളിൽ ഇരുന്നവരുടെ പരോക്ഷ കർത്താവ്, അവർക്കു നൽകപ്പെട്ട κρίμα, ‘യേശുവിന്റെ സാക്ഷ്യം’ എന്നതിലെ അവ്യക്തമായ ഷഷ്ഠീബന്ധം, ആത്മാക്കളും മൃഗത്തെ ആരാധിക്കാത്തവരും തമ്മിലുള്ള ബന്ധം എന്നിവയെ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കിയിട്ടില്ല. πεπελεκισμένων-ന്റെ ‘തലവെട്ടിക്കൊല്ലപ്പെട്ടവർ,’ ψυχὰς-ന്റെ ‘ആത്മാക്കൾ,’ ἔζησαν-ന്റെ സംഭവാത്മകമായ ‘ജീവൻ പ്രാപിച്ചു’ എന്നിവ സന്ദർഭത്തോടു യോജിക്കുന്നു.'
  naturalness: പരിഭാഷ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ള ദർശനാത്മക രജിസ്റ്ററിനൊത്തതുമാണ്. ‘സിംഹാസനങ്ങൾ,’ ‘ന്യായവിധി,’ ‘ദൈവത്തിന്റെ വചനം,’ ‘പ്രതിമ,’ ‘മുദ്ര’ എന്നീ പ്രയോഗങ്ങൾ വ്യക്തമാണ്. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ കൂട്ടിച്ചേർക്കൽ മലയാളത്തിൽ വായിക്കാവുന്ന വിധം കൈകാര്യം ചെയ്തിരിക്കുന്നു.
  terminology: ‘മശീഹ’ എന്ന പ്രധാനപാഠരൂപവും ‘ക്രിസ്തു’ എന്ന അടിക്കുറിപ്പ്-ബദലും നൽകിയിരിക്കുന്ന നയവുമായി ഒത്തുപോകുന്നു. ‘മൃഗം,’ ‘പ്രതിമ,’ ‘മുദ്ര’ എന്നിവ വ്യാഖ്യാനപരമായ അധികഭാരം ചേർക്കാതെ മൂലപദങ്ങളോടു ചേർന്നുനിൽക്കുന്നു. അടിക്കുറിപ്പ് a യേശുവിന്റെ സാക്ഷ്യം എന്ന പ്രയോഗത്തിന്റെ യഥാർഥ അവ്യക്തത ശരിയായി രേഖപ്പെടുത്തുന്നു; അടിക്കുറിപ്പ് b യുടെ സൂചകം ‘മശീഹയോടൊപ്പം’ എന്ന പ്രസക്തസ്ഥാനത്താണ്.
