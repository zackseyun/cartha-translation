id: REV.20.4
reference: Revelation 20:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: ml
  text: പിന്നെ ഞാൻ സിംഹാസനങ്ങൾ കണ്ടു; അവയിൽ അവർ ഇരുന്നു, ന്യായവിധി അവർക്കു നൽകപ്പെട്ടു. യേശുവിന്റെ സാക്ഷ്യം നിമിത്തവും[a] ദൈവത്തിന്റെ വചനം നിമിത്തവും തലവെട്ടിക്കൊല്ലപ്പെട്ടവരുടെ ആത്മാക്കളെയും, മൃഗത്തെയോ അതിന്റെ പ്രതിമയെയോ ആരാധിക്കാതിരിക്കുകയും തങ്ങളുടെ നെറ്റിയിലും കൈയിലും മുദ്ര സ്വീകരിക്കാതിരിക്കുകയും ചെയ്തവരെയും ഞാൻ കണ്ടു. അവർ ജീവൻ പ്രാപിച്ച് മശീഹയോടൊപ്പം[b] ആയിരം വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യേശുവിന്റെ സാക്ഷ്യം’ എന്ന ഗ്രീക്ക് പ്രയോഗം യേശു നൽകിയ സാക്ഷ്യം എന്നോ യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യം എന്നോ അർഥമാക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ക്രിസ്തുവിനോടൊപ്പം.’ ഇവിടെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ പ്രധാന പാഠത്തിൽ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνους
  choice: സിംഹാസനങ്ങൾ
  rationale: ദർശനാത്മക പശ്ചാത്തലത്തിലെ മൂർത്തമായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: അവയിൽ അവർ ഇരുന്നു
  rationale: ക്രിയയുടെ അജ്ഞാത ബഹുവചന കർത്താവിനെ തിരിച്ചറിയാതെ, ഗ്രീക്കിലെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: ന്യായവിധി അവർക്കു നൽകപ്പെട്ടു
  rationale: ഇത് വിധിനിർണയാധികാരമോ വിധിന്യായത്തിന്റെ പ്രവൃത്തിയോ ഫലമോ എന്നു വിശദീകരിച്ച് തീർപ്പാക്കാതെ κρίμα എന്ന പദത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
- source_word: ψυχὰς
  choice: ആത്മാക്കളെ
  rationale: ദർശനത്തിലെ മരണാനന്തര ചിത്രണം നിലനിർത്തുന്നു; ‘ആളുകൾ’ എന്ന പരിഭാഷ ആ ദൃശ്യഭാവം മങ്ങിച്ചുകളയും.
- source_word: πεπελεκισμένων
  choice: തലവെട്ടിക്കൊല്ലപ്പെട്ടവരുടെ
  rationale: വധരീതിയെ വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: യേശുവിന്റെ സാക്ഷ്യം നിമിത്തം
  rationale: διάയുടെ കാരണാർഥം നൽകുകയും Ἰησοῦ എന്ന ഷഷ്ഠീവിഭക്തി യേശു നൽകിയ സാക്ഷ്യമോ യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യമോ എന്ന അവ്യക്തത പ്രധാന പാഠത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λόγον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: നേരിട്ടുള്ളതും മലയാള ക്രൈസ്തവ വായനയിൽ സുതാര്യവുമായ പ്രയോഗം.
- source_word: προσεκύνησαν
  choice: ആരാധിക്കാതിരിക്കുകയും
  rationale: ശാരീരികമായി കുമ്പിടുക എന്നതിലുപരി സന്ദർഭത്തിലെ മതപരമായ ആരാധനാഭാവം വ്യക്തമാക്കുന്നു.
- source_word: θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാടിലെ സ്ഥാപിതമായ ദർശനാത്മക സംജ്ഞയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: εἰκόνα
  choice: പ്രതിമ
  rationale: ആരാധനയ്ക്കുള്ള പ്രതിനിധിരൂപം എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘വിഗ്രഹം’ എന്ന വ്യാഖ്യാനപരമായ ശക്തീകരണം ഒഴിവാക്കുന്നു.
- source_word: χάραγμα
  choice: മുദ്ര
  rationale: അധികാരപരമായ അടയാളം എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: ἔζησαν
  choice: ജീവൻ പ്രാപിച്ചു
  rationale: സന്ദർഭത്തിലെ ജീവിക്കലിലേക്കുള്ള സംഭവാത്മക മാറ്റം സൂചിപ്പിക്കുന്നു; പുനരുത്ഥാനത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
- source_word: χριστοῦ
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമത്തേക്കാൾ അഭിഷിക്തൻ എന്ന പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ പദവിയുടെ അർഥം പ്രകടമാക്കുന്നു.
- source_word: χίλια ἔτη
  choice: ആയിരം വർഷം
  rationale: സംഖ്യയും കാലപരിധിയും വ്യാഖ്യാനിക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ἐκάθισαν എന്ന ക്രിയയുടെ കർത്താവും ന്യായവിധി ലഭിച്ചവരും ആരെന്നത്
  choice: ‘അവർ’, ‘അവർക്കു’ എന്ന് മാത്രം നൽകി തിരിച്ചറിയൽ അവ്യക്തമായി നിലനിർത്തി.
  alternative: രക്തസാക്ഷികൾ, സകല വിശുദ്ധരും, അപ്പൊസ്തലന്മാർ, അല്ലെങ്കിൽ സ്വർഗീയ ന്യായസഭാംഗങ്ങൾ എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്കിൽ കർത്താവ് പരോക്ഷമാണ്; പ്രത്യേക കൂട്ടത്തെ ചേർക്കുന്നത് പാഠത്തിനു പുറത്തുള്ള വ്യാഖ്യാനമായിരിക്കും.
- issue: διὰ τὴν μαρτυρίαν Ἰησοῦ എന്നതിലെ ഷഷ്ഠീബന്ധം
  choice: പ്രധാന പാഠത്തിൽ ‘യേശുവിന്റെ സാക്ഷ്യം നിമിത്തം’ എന്ന് നൽകി അവ്യക്തത സംരക്ഷിച്ചു.
  alternative: ‘യേശുവിനെക്കുറിച്ച് അവർ നൽകിയ സാക്ഷ്യം നിമിത്തം’ അല്ലെങ്കിൽ ‘യേശു നൽകിയ സാക്ഷ്യം നിമിത്തം’.
  rationale: ഇത് യേശു വഹിച്ച സാക്ഷ്യമോ യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യമോ ആകാം; അടിക്കുറിപ്പ് ഈ യഥാർഥ സാധ്യത വ്യക്തമാക്കുന്നു.
- issue: Χριστός എന്ന പദത്തിന്റെ പ്രവർത്തനം
  choice: പദവിയായി ‘മശീഹ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ക്രിസ്തു’.
  rationale: ഈ സന്ദർഭത്തിൽ ‘അഭിഷിക്തൻ’ എന്ന പദവിയുടെ സ്വഭാവം പ്രകടമാണ്; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἔζησαν എന്നതിന്റെ അർഥം
  choice: ‘അവർ ജീവൻ പ്രാപിച്ചു’.
  alternative: ‘അവർ ജീവിച്ചു’ അല്ലെങ്കിൽ ‘അവർ വീണ്ടും ജീവിച്ചു’.
  rationale: സന്ദർഭത്തിലെ സംഭവാത്മക അർഥം നൽകുന്നു; ‘വീണ്ടും’ എന്നു ചേർത്ത് പുനരുത്ഥാനത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- issue: ആത്മാക്കളും മൃഗത്തെ ആരാധിക്കാത്തവരും തമ്മിലുള്ള ബന്ധം
  choice: ഗ്രീക്കിലെ കൂട്ടിച്ചേർക്കുന്ന ഘടന അനുസരിച്ച് രണ്ടിനെയും ദർശനത്തിൽ കണ്ടവരായി അവതരിപ്പിച്ചു; അവ ഒരേ കൂട്ടമോ വേറിട്ട കൂട്ടങ്ങളോ എന്ന് വിശദീകരിച്ചില്ല.
  alternative: രണ്ടാമത്തെ വിവരണം തലവെട്ടിക്കൊല്ലപ്പെട്ടവരെ മാത്രം നിർവചിക്കുന്നതായി തുറന്നുപറയുക, അല്ലെങ്കിൽ തീർച്ചയായും വേറൊരു കൂട്ടമായി വേർതിരിക്കുക.
  rationale: വാക്യഘടന വ്യത്യസ്ത ബന്ധവായനകൾ അനുവദിക്കുന്നു; പരിഭാഷ അതിനെ സിദ്ധാന്തപരമായി തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി ഉപയോഗിച്ചു. ദർശനാത്മക പദങ്ങളായ ‘സിംഹാസനം’, ‘ആത്മാക്കൾ’, ‘മൃഗം’, ‘മുദ്ര’ എന്നിവ നിലനിർത്തി. മൂലത്തിൽ വ്യക്തമല്ലാത്ത കർത്താവിനെയോ കൂട്ടങ്ങളുടെ പരസ്പരബന്ധത്തെയോ വ്യാഖ്യാനിച്ച് നിർണ്ണയിച്ചിട്ടില്ല. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് സൂചകങ്ങൾ അവയുടെ ഉള്ളടക്കത്തോട് പൊരുത്തപ്പെടുന്ന സ്ഥാനങ്ങളായ ‘യേശുവിന്റെ സാക്ഷ്യം’ എന്നും ‘മശീഹ’ എന്നും ചേർത്തു.
