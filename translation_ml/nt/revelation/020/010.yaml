id: REV.20.10
reference: Revelation 20:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: ml
  text: അവരെ വഴിതെറ്റിച്ചുകൊണ്ടിരുന്ന പിശാചിനെ തീയും ഗന്ധകവുമുള്ള തടാകത്തിലേക്ക് എറിഞ്ഞു. അവിടെ മൃഗവും കള്ളപ്രവാചകനും ഉണ്ട്.[a] അവർ പകലും രാത്രിയും എന്നെന്നേക്കും പീഡിപ്പിക്കപ്പെടും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ഉണ്ട്’ എന്ന ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല; സന്ദർഭം അനുസരിച്ച് അത് ഇവിടെ പൂരിപ്പിച്ചിരിക്കുന്നു.
    reason: grammatical_ambiguity
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘യുഗങ്ങളുടെ യുഗങ്ങളോളം’; അവസാനമില്ലാത്ത ദൈർഘ്യം സൂചിപ്പിക്കുന്ന ശക്തമായ ഗ്രീക്ക് പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: പിശാച്
  rationale: വെളിപ്പാട് പുസ്തകത്തിൽ സാത്താനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ വ്യക്തിനാമസദൃശ പദവിയായതിനാൽ, ആധുനിക മലയാളത്തിൽ സുപരിചിതവും സന്ദർഭോചിതവുമായ ‘പിശാച്’ തെരഞ്ഞെടുത്തു.
- source_word: ὁ πλανῶν αὐτοὺς
  choice: അവരെ വഴിതെറ്റിച്ചുകൊണ്ടിരുന്ന
  rationale: വർത്തമാന കൃദന്തത്തിന്റെ തുടർച്ചയായ പ്രവർത്തനഭാവവും ആഖ്യാനത്തിലെ ഭൂതകാലബന്ധവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു. ‘വഞ്ചിച്ചുകൊണ്ടിരുന്ന’ എന്നും സാധ്യമെങ്കിലും πλανάω എന്ന പദത്തിലെ തെറ്റായ വഴിയിലേക്ക് നയിക്കൽ എന്ന ഭാവം ‘വഴിതെറ്റിക്കുക’ കൂടുതൽ നേരിട്ട് നൽകുന്നു.
- source_word: ἐβλήθη
  choice: എറിഞ്ഞു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ അനിർദ്ദിഷ്ടകർത്തൃപ്രയോഗമായി നൽകി; ബലമായി വിധിസ്ഥലത്തേക്ക് തള്ളപ്പെടുന്നതിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: തീയും ഗന്ധകവുമുള്ള തടാകം
  rationale: θεῖον എന്നത് ‘ഗന്ധകം’ എന്നാണ്; പഴയതോ അപരിചിതമോ ആയ പദം ഒഴിവാക്കി ദൃശ്യരൂപം നേരിട്ട് നിലനിർത്തി.
- source_word: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: അവിടെ മൃഗവും കള്ളപ്രവാചകനും ഉണ്ട്
  rationale: ഗ്രീക്കിൽ ക്രിയ ഇല്ലെങ്കിലും മലയാളത്തിൽ വ്യക്തതയ്ക്കായി വർത്തമാനകാല ‘ഉണ്ട്’ ചേർത്തു. മുൻസന്ദർഭത്തിൽ അവരെ അവിടേക്ക് എറിഞ്ഞതിനു ശേഷമുള്ള തുടരുന്ന സാന്നിധ്യമാണ് ഇത് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: θηρίον
  choice: മൃഗം
  rationale: വെളിപ്പാട് പുസ്തകത്തിലെ അന്ത്യകാല ദൃശ്യരൂപത്തിനുള്ള സ്ഥാപിതവും നേരിട്ടുള്ളതുമായ മലയാള പദം.
- source_word: ψευδοπροφήτης
  choice: കള്ളപ്രവാചകൻ
  rationale: മൂലപദത്തിന്റെ അർത്ഥം നേരിട്ട് നൽകുകയും വെളിപ്പാട് പുസ്തകത്തിലെ പദവിയായി സ്വാഭാവികമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്നു.
- source_word: βασανισθήσονται
  choice: പീഡിപ്പിക്കപ്പെടും
  rationale: കടുത്ത യാതന അനുഭവിപ്പിക്കപ്പെടും എന്ന വിധിന്യായസന്ദർഭത്തിലെ അർത്ഥം നൽകുന്നു; പീഡനത്തിന്റെ പ്രത്യേക രീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἡμέρας καὶ νυκτός
  choice: പകലും രാത്രിയും
  rationale: മൂലത്തിലെ ക്രമം നിലനിർത്തിക്കൊണ്ട് ഇടവിടാത്ത തുടർച്ചയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: ഗ്രീക്കിലെ ശക്തമായ കാലദൈർഘ്യപ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാള തുല്യം; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: εἰς τοὺς αἰῶνας τῶν αἰώνων സൂചിപ്പിക്കുന്ന അന്തിമ ശിക്ഷയുടെ ദൈർഘ്യം
  choice: എന്നെന്നേക്കും
  alternative: യുഗങ്ങളുടെ യുഗങ്ങളോളം
  rationale: ഗ്രീക്ക് ശൈലിയുടെ ശക്തമായ, അവസാനമില്ലാത്ത ദൈർഘ്യഭാവം മലയാളത്തിൽ മയപ്പെടുത്താതെ നൽകുന്നു. അതേസമയം വാക്യം പറയുന്നതിന് അപ്പുറമുള്ള സിദ്ധാന്തവിവാദം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- issue: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης എന്ന ക്രിയാരഹിത ഉപവാക്യത്തിലെ സൂചിതക്രിയ
  choice: അവിടെ മൃഗവും കള്ളപ്രവാചകനും ഉണ്ട്
  alternative: അവിടെ മൃഗവും കള്ളപ്രവാചകനും ഉണ്ടായിരുന്നു
  rationale: മൂലത്തിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല. 19:20-ലെ മുൻസന്ദർഭത്തെ അടിസ്ഥാനമാക്കി തുടരുന്ന സാന്നിധ്യം സൂചിപ്പിക്കുന്ന വർത്തമാനകാലം ഏറ്റവും യോജിച്ചതാണ്; ഈ വ്യാകരണപൂരണം അധിക സിദ്ധാന്തവാദം ചേർക്കുന്നില്ല.
- issue: βασανισθήσονται എന്ന ബഹുവചനത്തിന്റെ സൂചന
  choice: അവർ ... പീഡിപ്പിക്കപ്പെടും
  alternative: അവരെ ... പീഡിപ്പിക്കും
  rationale: ഗ്രീക്കിലെ ബഹുവചന കർമണി നിലനിർത്തി; സമീപസന്ദർഭത്തിലെ പിശാച്, മൃഗം, കള്ളപ്രവാചകൻ എന്നിവരിലേക്കുള്ള സ്വാഭാവിക പരാമർശം തുറന്നുതന്നെ വെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗതമായി പരിചിതമായ ‘പിശാച്’, ‘മൃഗം’, ‘കള്ളപ്രവാചകൻ’ എന്നീ പദങ്ങൾ നിലനിർത്തി; ദുർഗ്രാഹ്യമായ പുരാതന ശൈലികളും വിഭാഗീയ സിദ്ധാന്തപദങ്ങളും ഒഴിവാക്കി.
