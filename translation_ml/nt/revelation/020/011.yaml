id: REV.20.11
reference: Revelation 20:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: ml
  text: പിന്നെ ഞാൻ വലിയൊരു വെള്ള സിംഹാസനവും അതിന്മേൽ ഇരിക്കുന്നവനെയും കണ്ടു. അവന്റെ സന്നിധിയിൽനിന്ന്[a] ഭൂമിയും ആകാശവും ഓടിപ്പോയി; അവയ്ക്ക് ഒരു സ്ഥലവും കണ്ടെത്തപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവന്റെ മുഖത്തുനിന്ന്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: വലിയൊരു വെള്ള സിംഹാസനം
  rationale: μέγαν എന്നതിലെ വലുപ്പത്തിന്റെയും മഹത്ത്വത്തിന്റെയും ഭാവം ‘വലിയ’ നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണക്രമവും പാലിക്കുന്നു.
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: അതിന്മേൽ ഇരിക്കുന്നവൻ
  rationale: സിംഹാസനത്തിൽ ഇരിക്കുന്ന വ്യക്തിയെ മൂലപാഠം പേരിട്ടു തിരിച്ചറിയാത്തതിനാൽ വിവരണാത്മകമായ പ്രയോഗം തന്നെയാണ് നിലനിർത്തിയത്.
- source_word: ἀπὸ τοῦ προσώπου
  choice: അവന്റെ സന്നിധിയിൽനിന്ന്
  rationale: πρόσωπον എന്നതിന്റെ അക്ഷരാർഥം ‘മുഖം’ ആണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ഒരാളുടെ മുമ്പിൽനിന്നോ സാന്നിധ്യത്തിൽനിന്നോ ഓടിപ്പോകുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘സന്നിധിയിൽനിന്ന്’ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἔφυγεν
  choice: ഓടിപ്പോയി
  rationale: φεύγω നൽകുന്ന സജീവവും ദൃശ്യവുമായ ‘പലായനം ചെയ്തു’ എന്ന ഭാവം നിലനിർത്തുന്നു; ‘അപ്രത്യക്ഷമായി’ എന്ന വ്യാഖ്യാനാത്മക അർഥം ചേർക്കുന്നില്ല.
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: ഭൂമിയും ആകാശവും
  rationale: രണ്ടു ഏകവചന നാമങ്ങളെയും വ്യക്തമായി നിലനിർത്തുന്നു; അപ്പോക്കലിപ്റ്റിക് പശ്ചാത്തലത്തിൽ οὐρανός സൂചിപ്പിക്കുന്ന സൃഷ്ടിജഗത്തിന്റെ മേലുലകത്തെ ‘ആകാശം’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: അവയ്ക്കായി ഒരു സ്ഥലവും കണ്ടെത്തപ്പെട്ടില്ല
  rationale: മൂലത്തിലെ നിഷേധവും കർമണിപ്രയോഗവും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു; ‘അവയ്ക്ക്’ ഭൂമിയെയും ആകാശത്തെയും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: സിംഹാസനത്തിൽ ഇരിക്കുന്നവന്റെ തിരിച്ചറിയൽ
  choice: ‘അതിന്മേൽ ഇരിക്കുന്നവൻ’ എന്നു പേരുപറയാതെ നിലനിർത്തി
  alternative: ദൈവം, പിതാവായ ദൈവം, മശീഹാ, അല്ലെങ്കിൽ ദിവ്യന്യായാധിപൻ എന്നു വ്യക്തമായി തിരിച്ചറിയുക
  rationale: ഈ വാക്യം സിംഹാസനത്തിൽ ഇരിക്കുന്നവനെ പേരിട്ടു പറയുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ വിവരണാത്മക രൂപവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
- issue: ഭൂമിയും ആകാശവും ഓടിപ്പോകുന്നതിന്റെ സ്വഭാവം
  choice: ‘ഓടിപ്പോയി’ എന്ന ദൃശ്യരൂപം നിലനിർത്തി
  alternative: ‘അപ്രത്യക്ഷമായി’ അല്ലെങ്കിൽ ‘നശിച്ചു’ എന്നു വ്യാഖ്യാനിക്കുക
  rationale: വാക്യം φεύγω എന്ന ക്രിയയിലൂടെ പലായനത്തിന്റെ വ്യക്തിവൽക്കരിച്ച ചിത്രം നൽകുന്നു; അതിന്റെ അന്തിമ ഭൗതികമോ ദൈവശാസ്ത്രപരമോ ആയ അർഥം വിവർത്തനം മുൻകൂട്ടി തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. ‘സന്നിധി’ എന്ന പരിചിതമായ ഉയർന്ന രജിസ്റ്ററിലെ പദം ഇവിടെ πρόσωπον എന്നതിന്റെ സാന്നിധ്യാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു; അതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
