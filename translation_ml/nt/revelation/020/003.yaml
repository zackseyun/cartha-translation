  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: ml
  text: ആയിരം വർഷം പൂർത്തിയാകുന്നതുവരെ ജനതകളെ ഇനി വഞ്ചിക്കാതിരിക്കേണ്ടതിന്[b], അവൻ അവനെ അഗാധത്തിലേക്ക്[a] എറിഞ്ഞു; അത് അടച്ച് അവന്റെ മീതെ മുദ്രവെച്ചു. അതിനുശേഷം അവൻ കുറച്ചുകാലത്തേക്ക് മോചിപ്പിക്കപ്പെടണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അടിത്തട്ടില്ലാത്ത കുഴിയിലേക്ക്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ജനതകളെ ഇനി വഴിതെറ്റിക്കാതിരിക്കേണ്ടതിന്.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘അവനെ അല്പകാലത്തേക്ക് അഴിച്ചുവിടണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: എറിഞ്ഞു
  rationale: βάλλω എന്ന ക്രിയയുടെ ബലപ്രയോഗത്തോടെയുള്ള ഇടലിന്റെ ദൃശ്യതയും തീവ്രതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἄβυσσον
  choice: അഗാധം
  rationale: വെളിപ്പാടിലെ പ്രളയദർശനപരമായ സ്ഥലനാമത്തിന്റെ ആശയവ്യാപ്തി നിലനിർത്തുകയും ‘അടിത്തട്ടില്ലാത്ത കുഴി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ἔκλεισεν
  choice: അടച്ചു
  rationale: κλείω എന്നതിന്റെ സാധാരണ അർഥം കൃത്യമായി നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത പൂട്ടിടൽ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: അവന്റെ മീതെ മുദ്രവെച്ചു
  rationale: മുദ്രയിട്ട് സുരക്ഷിതമാക്കുന്ന പ്രവൃത്തിയും ἐπάνω αὐτοῦ എന്ന സ്ഥലബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു; ‘അതു’ എന്നത് മുമ്പുള്ള അഗാധത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: ജനതകളെ ഇനി വഞ്ചിക്കാതിരിക്കേണ്ടതിന്
  rationale: πλανάωയുടെ വഞ്ചിക്കുക/വഴിതെറ്റിക്കുക എന്ന അർഥപരിധിയിൽ ‘വഞ്ചിക്കുക’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്; ἔτιയുടെ ‘ഇനി’ എന്ന കാലസൂചനയും നിലനിർത്തുന്നു.
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: ആയിരം വർഷം പൂർത്തിയാകുന്നതുവരെ
  rationale: τελεσθῇ സൂചിപ്പിക്കുന്ന സമാപ്തിയും ἄχρι നിർണ്ണയിക്കുന്ന സമയപരിധിയും വ്യക്തമായി നൽകുന്നു.
- source_word: μετὰ ταῦτα
  choice: അതിനുശേഷം
  rationale: സംഭവക്രമത്തിലെ ഔപചാരികമായ സമയമാറ്റം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δεῖ
  choice: വേണം
  rationale: അനിവാര്യതയുടെ ബലം നിലനിർത്തുന്നു; അത് ദൈവിക നിർണ്ണയമോ കഥാഗതിയിലെ അനിവാര്യതയോ എന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: λυθῆναι αὐτὸν
  choice: അവൻ മോചിപ്പിക്കപ്പെടണം
  rationale: λύωയുടെ കർമണിപ്രയോഗം നിലനിർത്തി ബന്ധനത്തിൽനിന്നുള്ള വിടുതൽ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: μικρὸν χρόνον
  choice: കുറച്ചുകാലത്തേക്ക്
  rationale: പരിമിതമായ ദൈർഘ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ആയിരം വർഷം’ എന്നതിന്റെ സ്വഭാവം
  choice: ‘ആയിരം വർഷം’ എന്ന് വ്യാഖ്യാനവിശേഷണമില്ലാതെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: അക്ഷരാർഥത്തിലുള്ള സഹസ്രാബ്ദം; പ്രതീകാത്മകമായ ദീർഘകാലം
  rationale: വാക്യം തന്നെ ഈ കാലയളവ് അക്ഷരാർഥത്തിലോ പ്രതീകാത്മകമായോ ഗ്രഹിക്കണമെന്ന് തീർപ്പാക്കുന്നില്ല; വിവർത്തനം സഹസ്രാബ്ദവാദങ്ങളിലെ തർക്കം പരിഹരിക്കരുത്.
- issue: പ്രളയദർശനപരമായ സന്ദർഭത്തിലെ δεῖയുടെ ബലം
  choice: ‘മോചിപ്പിക്കപ്പെടണം’ എന്ന അനിവാര്യതാസൂചക രൂപം ഉപയോഗിച്ചു.
  alternative: ദൈവിക നിർണ്ണയം; കഥാഗതിയിലെ അനിവാര്യത
  rationale: ഗ്രീക്ക് അനിവാര്യത സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ അടിസ്ഥാനം ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല; മലയാളരൂപം ആ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ പ്രവർത്തനക്രമവും അനിവാര്യതയും നിലനിർത്തിയിരിക്കുന്നു; സഹസ്രാബ്ദത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
