id: REV.20.6
reference: Revelation 20:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: ml
  text: ഒന്നാമത്തെ പുനരുത്ഥാനത്തിൽ പങ്കുള്ളവൻ ഭാഗ്യവാനും വിശുദ്ധനും ആകുന്നു. അത്തരക്കാരുടെമേൽ രണ്ടാമത്തെ മരണത്തിന് അധികാരമില്ല; അവർ ദൈവത്തിന്റെയും മശിഹായുടെയും പുരോഹിതന്മാരായിരിക്കും; അവനോടുകൂടെ ആയിരം വർഷം വാഴും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: അനുഗൃഹീതൻ
  rationale: വെറും മാനസിക സന്തോഷമല്ല, ദൈവാനുഗ്രഹമുള്ള അവസ്ഥയാണ് ഈ വാഴ്ത്തുവാക്യത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: ἅγιος
  choice: വിശുദ്ധൻ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട നിലയും വിശുദ്ധസ്വഭാവവും ഉൾക്കൊള്ളുന്ന നേരിട്ടുള്ള സമാനപദം.
- source_word: ὁ ἔχων μέρος
  choice: പങ്കുള്ളവൻ
  rationale: പുനരുത്ഥാനത്തിലുള്ള പങ്കാളിത്തം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു; ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: ഒന്നാമത്തെ പുനരുത്ഥാനത്തിൽ
  rationale: ക്രമസൂചകമായ ആദ്യത്തെ പുനരുത്ഥാനം എന്ന അർഥം വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τούτων
  choice: അത്തരക്കാരുടെമേൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ വിഭാഗത്തിലുള്ള ആളുകളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്; അവരുടെമേലുള്ള അധികാരപരിധിയാണ് സന്ദർഭാർഥം.
- source_word: ὁ δεύτερος θάνατος
  choice: രണ്ടാമത്തെ മരണം
  rationale: വെളിപ്പാടിലെ അന്ത്യകാലസംബന്ധിയായ സാങ്കേതിക പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: അധികാരമില്ല
  rationale: ἐξουσία ഇവിടെ കേവല ശക്തിയേക്കാൾ അധികാരമോ അധീനതയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἱερεῖς
  choice: പുരോഹിതന്മാർ
  rationale: ആരാധനാസംബന്ധിയായ പുരോഹിതപദവിയെ വ്യാഖ്യാനാത്മകമായി ദുർബലപ്പെടുത്താതെ നേരിട്ട് പകരുന്നു.
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: ദൈവത്തിന്റെയും മശിഹായുടെയും
  rationale: Χριστός ഇവിടെ പദവിനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ മശിഹാ എന്ന പദവിയർഥം പ്രകടമാക്കുന്നു.
- source_word: βασιλεύσουσιν
  choice: വാഴും
  rationale: രാജകീയ ഭരണപങ്കാളിത്തം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പരമ്പരാഗതവുമായ മലയാളപ്രയോഗം.
- source_word: μετ’ αὐτοῦ
  choice: അവനോടുകൂടെ
  rationale: മശിഹായോടൊപ്പമുള്ള ഭരണപങ്കാളിത്തം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: χίλια ἔτη
  choice: ആയിരം വർഷം
  rationale: പാഠത്തിലെ കാലദൈർഘ്യം ഒരു പ്രത്യേക സഹസ്രാബ്ദവ്യവസ്ഥ അടിച്ചേൽപ്പിക്കാതെ അതേപടി നൽകുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശിഹാ
  alternative: ക്രിസ്തു
  rationale: ദൈവത്തോടൊപ്പം ഔപചാരികമായ സമാന്തരഘടനയിൽ വരുന്ന Χριστός ഇവിടെ പദവിനാമസ്വഭാവം പുലർത്തുന്നു; അതിനാൽ മശിഹാ എന്നത് ആ പദവിയർഥം കൂടുതൽ സുതാര്യമാക്കുന്നു.
- issue: ആയിരം വർഷത്തെ ഭരണകാലം
  choice: ആയിരം വർഷം വാഴും
  alternative: സഹസ്രാബ്ദരാജ്യം ഭരിക്കും
  rationale: മൂലപാഠം കാലദൈർഘ്യവും വാഴ്ചയും മാത്രം പ്രസ്താവിക്കുന്നു; പ്രത്യേക അന്ത്യകാലവ്യവസ്ഥയെ വ്യാഖ്യാനമായി ചേർക്കുന്നില്ല.
- issue: ഒന്നാമത്തെ പുനരുത്ഥാനം
  choice: ഒന്നാമത്തെ പുനരുത്ഥാനം
  alternative: ആത്മീയ പുനരുത്ഥാനം / ശരീരത്തിന്റെ ഒന്നാം പുനരുത്ഥാനം
  rationale: പുനരുത്ഥാനത്തിന്റെ സ്വഭാവത്തെ ഈ വാക്യം തന്നിൽ കൂടുതൽ നിർവചിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനഭേദം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ബൈബിൾ ശൈലി. ഏകവചനമായ ‘പങ്കുള്ളവൻ’ എന്നതിൽനിന്ന് അതേ വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനമായ ‘അത്തരക്കാർ’ എന്നതിലേക്കുള്ള ഗ്രീക്ക് മാറ്റം നിലനിർത്തി. അനാവശ്യമായ മതവിഭാഗപരമായ വ്യാഖ്യാനം ഒഴിവാക്കി.
