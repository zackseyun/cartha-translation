id: REV.20.12
reference: Revelation 20:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: ml
  text: മരിച്ചവരെ—വലിയവരെയും ചെറിയവരെയും—സിംഹാസനത്തിന്റെ മുമ്പിൽ നിൽക്കുന്നതായി ഞാൻ കണ്ടു. പുസ്തകങ്ങൾ[a] തുറക്കപ്പെട്ടു. ജീവന്റെ പുസ്തകമായ മറ്റൊരു പുസ്തകവും തുറക്കപ്പെട്ടു. പുസ്തകങ്ങളിൽ എഴുതിയിരുന്നതിന്റെ അടിസ്ഥാനത്തിൽ, അവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച്[b] മരിച്ചവർക്കു ന്യായം വിധിക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുസ്തകങ്ങൾ’ എന്നത് പുരാതനകാലത്തെ എഴുത്തുചുരുളുകളെയും സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: ‘അവർ ചെയ്ത കാര്യങ്ങൾക്കനുസരിച്ച്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: മരിച്ചവർ / മരിച്ചവരെ
  rationale: മരിച്ച വ്യക്തികളെ സമൂഹമായി സൂചിപ്പിക്കുന്ന substantival adjective; മലയാളത്തിൽ വിഭക്തിക്കനുസരിച്ചുള്ള രൂപങ്ങൾ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: μεγάλους καὶ τοὺς μικρούς
  choice: വലിയവരെയും ചെറിയവരെയും
  rationale: പദവിയോ സാമൂഹികപ്രാധാന്യമോ എന്തായാലും എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് merism ഔപചാരികമായി നിലനിർത്തുന്നു; ‘പ്രമുഖരും അപ്രധാനരും’ എന്നത് വ്യാഖ്യാനാത്മകമാകും.
- source_word: ἑστῶτας
  choice: നിൽക്കുന്നതായി
  rationale: Perfect participle സൂചിപ്പിക്കുന്ന നിലവിലെ നില സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: സിംഹാസനത്തിന്റെ മുമ്പിൽ
  rationale: θρόνος എന്നത് ‘ന്യായാസനം’ എന്ന് വ്യാഖ്യാനിക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: βιβλία
  choice: പുസ്തകങ്ങൾ
  rationale: വ്യാപകവും പരിചിതവുമായ സമാനപദം; പുരാതന മാധ്യമം ചുരുളുകളായിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: തുറക്കപ്പെട്ടു
  rationale: രണ്ടിടത്തുമുള്ള passive aorist നേരിട്ട് നിലനിർത്തുന്നു; ‘മുദ്ര നീക്കപ്പെട്ടു’ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: ἄλλο βιβλίον
  choice: മറ്റൊരു പുസ്തകം
  rationale: മുൻപറഞ്ഞ പുസ്തകങ്ങളിൽനിന്ന് വേറിട്ട ഒരു അധിക പുസ്തകത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: ജീവന്റെ പുസ്തകമായ
  rationale: ഗ്രീക്കിലെ elliptical genitive മലയാളത്തിൽ വ്യക്തമായി പൂരിപ്പിച്ച് ‘book of life’ എന്ന അർഥം നൽകുന്നു.
- source_word: ἐκρίθησαν
  choice: ന്യായം വിധിക്കപ്പെട്ടു
  rationale: ന്യായവിധിയുടെ ഔപചാരിക അർഥം നിലനിർത്തുന്നു; ‘ശിക്ഷിക്കപ്പെട്ടു’ എന്നു പറഞ്ഞ് വിധിയുടെ ഫലം മുൻകൂട്ടി നിർണയിക്കുന്നില്ല.
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: പുസ്തകങ്ങളിൽ എഴുതിയിരുന്നതിന്റെ അടിസ്ഥാനത്തിൽ
  rationale: ἐκ ഇവിടെ ന്യായവിധിയുടെ രേഖാപരമായ അടിസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; perfect participle-ന്റെ പൂർത്തിയായ രേഖ എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: അവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച്
  rationale: ἔργα എന്നതിന്റെ പ്രവർത്തനങ്ങൾ/ചെയ്ത കാര്യങ്ങൾ എന്ന വിശാല അർഥം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പ്രവൃത്തികൾക്കനുസരിച്ചുള്ള ന്യായവിധി
  choice: ‘അവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച്’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  alternative: ‘അവർ ചെയ്തതനുസരിച്ച്’
  rationale: വാക്യം ന്യായവിധിയും പ്രവൃത്തികളും തമ്മിലുള്ള ബന്ധം വ്യക്തമായി പ്രസ്താവിക്കുന്നു. അതിനെ മൃദൂകരിക്കുകയോ വിപുലമായ ഒരു സിദ്ധാന്തചട്ടക്കൂടിലൂടെ വിശദീകരിക്കുകയോ ചെയ്യാതെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: ἐκρίθησαν എന്നതിലെ വിധിയുടെ സ്വഭാവം
  choice: ‘ന്യായം വിധിക്കപ്പെട്ടു’
  alternative: ‘കുറ്റം വിധിക്കപ്പെട്ടു’ / ‘ശിക്ഷിക്കപ്പെട്ടു’
  rationale: κρίνω ഇവിടെ ന്യായവിധിയെ സൂചിപ്പിക്കുന്നു; വിധി നിർബന്ധമായും കുറ്റസ്ഥാപനമോ ശിക്ഷയോ ആണെന്ന് പരിഭാഷയിൽ മുൻകൂട്ടി തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വെളിപ്പാട്-ന്യായവിധി ശൈലി. ഗ്രീക്കിലെ ആവർത്തനവും passive രൂപങ്ങളും കഴിയുന്നത്ര സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് [a] തെറ്റായ സ്ഥാനവുമായി ബന്ധിപ്പിച്ചതായി തോന്നുന്നതിനാൽ, അതിന്റെ ഉള്ളടക്കങ്ങൾക്ക് യോജിച്ച സ്ഥാനങ്ങളിൽ മലയാള അടിക്കുറിപ്പ് മാർക്കറുകൾ ക്രമപ്പെടുത്തി.
