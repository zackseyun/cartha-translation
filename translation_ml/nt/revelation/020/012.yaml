revisions:
- from: മരിച്ചവരെ—വലിയവരെയും ചെറിയവരെയും—സിംഹാസനത്തിന്റെ മുമ്പിൽ നിൽക്കുന്നതായി ഞാൻ കണ്ടു. പുസ്തകങ്ങൾ[a] തുറക്കപ്പെട്ടു. ജീവന്റെ പുസ്തകമായ മറ്റൊരു പുസ്തകവും തുറക്കപ്പെട്ടു. പുസ്തകങ്ങളിൽ എഴുതിയിരുന്നതിന്റെ അടിസ്ഥാനത്തിൽ, അവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച് മരിച്ചവർ ന്യായം വിധിക്കപ്പെട്ടു.[b]
  to: മരിച്ചവരെ—വലിയവരെയും ചെറിയവരെയും—സിംഹാസനത്തിന്റെ മുമ്പിൽ നിൽക്കുന്നതായി ഞാൻ കണ്ടു. പുസ്തകങ്ങൾ[a] തുറക്കപ്പെട്ടു. ജീവന്റെ പുസ്തകമായ മറ്റൊരു പുസ്തകവും തുറക്കപ്പെട്ടു. പുസ്തകങ്ങളിൽ എഴുതിയിരുന്നതിന്റെ അടിസ്ഥാനത്തിൽ, അവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച്[b] മരിച്ചവർക്കു ന്യായം വിധിക്കപ്പെട്ടു.
  rationale: 'The revision makes only two safe changes: it corrects the Malayalam judicial-passive construction by marking the judged persons with ‘മരിച്ചവർക്കു,’ and it moves footnote [b] to its precise lexical anchor. No interpretive or doctrinal content has been added, and the source’s distinction between the books and the book of life is retained.'
