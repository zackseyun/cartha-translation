  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: ml
  text: മരണവും ഹാദേസും തീപ്പൊയ്കയിലേക്ക് എറിയപ്പെട്ടു. ഇതാണ് രണ്ടാമത്തെ മരണം, തീപ്പൊയ്ക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഹാദേസ്’ ഗ്രീക്ക് പദമാണ്; ചിലർ അതിനെ ‘ശവക്കുഴി’ എന്നും വിവർത്തനം ചെയ്യുന്നു. ഇവിടെ ഹാദേസ് ‘തീപ്പൊയ്ക’യിൽനിന്ന് വേറിട്ടതാണ്; അതിനാൽ ‘നരകം’ എന്ന വിവർത്തനം ഈ സന്ദർഭത്തിൽ തെറ്റിദ്ധരിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: മരണം
  rationale: ആദ്യ വാക്യത്തിൽ ഹാദേസിനോടൊപ്പം പ്രവർത്തനത്തിന് വിധേയമാകുന്ന സത്തയായി മരണത്തെ അവതരിപ്പിക്കുന്ന വെളിപ്പാട് സാഹിത്യത്തിലെ വ്യക്തിവൽക്കരണം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘രണ്ടാമത്തെ മരണം’ എന്ന പ്രയോഗത്തിൽ അതേ പദം ഒരു വിധി/അവസ്ഥയുടെ പേരായി വരുന്നു.
- source_word: ᾅδης
  choice: ഹാദേസ്
  rationale: ഗ്രീക്ക് പദം ലിപ്യന്തരണം ചെയ്ത് തീപ്പൊയ്കയിൽനിന്നുള്ള ആശയവ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു; ‘നരകം’ എന്നു വിവർത്തനം ചെയ്താൽ ഈ വാക്യത്തിലെ രണ്ടു വ്യത്യസ്ത പ്രതീകങ്ങളെ ഒന്നാക്കാനിടയുണ്ട്.
- source_word: ἐβλήθησαν
  choice: എറിയപ്പെട്ടു
  rationale: βάλλω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണി രൂപവും ബലമായി തള്ളിവിടുന്ന അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λίμνη τοῦ πυρός
  choice: തീപ്പൊയ്ക
  rationale: സ്ഥിരമായ വെളിപ്പാട്-സാഹിത്യ പ്രതീകം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὗτος
  choice: ഈ തീപ്പൊയ്കയാണ്
  rationale: ഗ്രീക്കിലെ സൂചകസർവനാമത്തിന്റെ പരാമർശം മലയാളത്തിൽ അവ്യക്തമാകാതിരിക്കാനായി അതിന്റെ സന്നിഹിത പൂർവപദം ആവർത്തിക്കുന്നു; ഇത് വ്യാഖ്യാനപരമായ ‘അർഥമാക്കുന്നത്’ എന്നതിനെക്കാൾ നേരിട്ടുള്ള സമീകരണം നിലനിർത്തുന്നു.
- source_word: θάνατος ὁ δεύτερος
  choice: രണ്ടാമത്തെ മരണം
  rationale: ആർട്ടിക്കിളോടുകൂടിയ നാമ-വിശേഷണ ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപവും വെളിപ്പാട് പുസ്തകത്തിലെ സാങ്കേതിക പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യവിധിയുടെ പശ്ചാത്തലത്തിൽ ᾅδης എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഹാദേസ്
  alternative: മൃതലോകം; ശവക്കുഴി; നരകം
  rationale: ഈ വാക്യം ഹാദേസിനെയും തീപ്പൊയ്കയെയും വേർതിരിക്കുന്നു. അതിനാൽ ‘നരകം’ എന്നു നൽകിയാൽ പാഠത്തിലെ വ്യത്യാസം ഇല്ലാതാകാം; ലിപ്യന്തരണം പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ ആശയവ്യത്യാസം സംരക്ഷിക്കുന്നു.
- issue: θάνατος എന്നതിന്റെ വ്യക്തിവൽക്കരണം
  choice: ആദ്യ പ്രയോഗത്തിൽ ഹാദേസിനൊപ്പം പ്രവർത്തനത്തിന് വിധേയമായ സത്തയായി ‘മരണം’; രണ്ടാം പ്രയോഗത്തിൽ ‘രണ്ടാമത്തെ മരണം’ എന്ന വിധി/അവസ്ഥയുടെ പേര്
  alternative: രണ്ടിടത്തും ഒരേ തരത്തിലുള്ള അമൂർത്ത നാമമായി മാത്രം വായിക്കുക; രണ്ടിടത്തും വ്യക്തിരൂപമായി വായിക്കുക
  rationale: ഗ്രീക്ക് പാഠത്തിലെ സാഹിത്യപരമായ വ്യക്തിവൽക്കരണവും സാങ്കേതിക പ്രയോഗവും വേർതിരിച്ച് നിലനിർത്തുന്നു. മലയാളത്തിൽ വലിയക്ഷരഭേദമില്ലാത്തതിനാൽ വാക്യഘടന തന്നെയാണ് ഈ വ്യത്യാസം സൂചിപ്പിക്കുന്നത്.
- issue: അവസാന വാക്യഭാഗത്തിന്റെ ബന്ധം
  choice: ‘ഈ തീപ്പൊയ്കയാണ് രണ്ടാമത്തെ മരണം’ എന്ന സമീകരണം
  alternative: ‘ഇത് രണ്ടാമത്തെ മരണമാണ്, തീപ്പൊയ്ക’ എന്ന കൂടുതൽ രൂപാനുസൃത ഘടന
  rationale: ἡ λίμνη τοῦ πυρός എന്ന ആവർത്തിത ഘടകം ‘രണ്ടാമത്തെ മരണം’ എന്താണെന്ന് സമീകരിക്കുന്നു. മലയാളത്തിൽ ആവർത്തനവും കോമയോടുള്ള അനുബന്ധഘടനയും കൃത്രിമമാകുന്നതിനാൽ അർഥബന്ധം വ്യക്തമായി മുന്നോട്ടുവയ്ക്കുന്നു; തിരിച്ചറിയൽബന്ധം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഹാദേസ്’ എന്ന ലിപ്യന്തരണം പാഠത്തിലെ ആശയവ്യത്യാസം കാക്കുന്നു. മലയാളത്തിൽ capitalization ഇല്ലാത്തതിനാൽ മരണത്തിന്റെ വ്യക്തിവൽക്കരണം വാക്യഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
