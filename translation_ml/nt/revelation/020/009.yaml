  source_fidelity: 'The Malayalam accurately represents the Greek sequence and imagery: ascent/advance over the earth’s breadth, encirclement of the saints’ camp and the beloved city, and fire descending from heaven to consume the attackers. “ഭൂമിയുടെ വിശാലതയിലാകെ” conveys πλάτος without importing the unsupported idea of a plain.'
