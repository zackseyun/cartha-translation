id: REV.20.9
reference: Revelation 20:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: ml
  text: അവർ ഭൂമിയുടെ വിശാലതയിലാകെ കയറിച്ചെന്ന് വിശുദ്ധരുടെ പാളയത്തെയും പ്രിയപ്പെട്ട നഗരത്തെയും[a] വളഞ്ഞു. അപ്പോൾ ആകാശത്തുനിന്ന് തീ ഇറങ്ങി അവരെ ദഹിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിൽ ‘പ്രിയപ്പെട്ട നഗരം’ ഏതാണ് എന്ന് പാഠം വ്യക്തമായി പറയുന്നില്ല. ഇത് യെരൂശലേമിനെയോ, കൂടുതൽ വിശാലമായി ദൈവത്തിന്റെ നഗരത്തെയോ സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: കയറിച്ചെന്ന്
  rationale: ἀναβαίνω എന്ന ക്രിയയിലെ മുകളിലേക്കുള്ളതോ മുന്നേറുന്നതോ ആയ ചലനം നിലനിർത്തുന്നു; പ്രത്യേക ഭൂമിശാസ്ത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: ഭൂമിയുടെ വിശാലതയിലാകെ
  rationale: πλάτος എന്നതിലെ ‘വീതി/വിശാലവ്യാപ്തി’ എന്ന ദൃശ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘സമതലം’ ചേർക്കുന്നില്ല.
- source_word: ἐκύκλευσαν
  choice: വളഞ്ഞു
  rationale: ചുറ്റും വളയുക എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിന് യോജിച്ച, വ്യക്തമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: παρεμβολὴν
  choice: പാളയം
  rationale: സൈനികമോ സമൂഹപരമോ ആയ താവളത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ദൃശ്യം വ്യാഖ്യാനാത്മകമായ കൂട്ടിച്ചേർക്കലില്ലാതെ നിലനിർത്തുന്നു.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധരുടെ
  rationale: വെളിപ്പാടുപുസ്തകത്തിലെ ἅγιοι എന്ന പദത്തിന് സ്വാഭാവികവും പരമ്പരാഗതവുമായ മലയാളസമാനപദം.
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: പ്രിയപ്പെട്ട നഗരത്തെ
  rationale: നഗരം ആരാൽ സ്നേഹിക്കപ്പെട്ടതാണെന്ന് വ്യക്തമാക്കാതെ ἠγαπημένην എന്ന പദത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: ആകാശത്തുനിന്ന് തീ ഇറങ്ങി
  rationale: മൂലപാഠത്തിലെ ദിശയും ദൃശ്യവും നേരിട്ടും സ്വാഭാവികമായും പകരുന്നു.
- source_word: κατέφαγεν αὐτούς
  choice: അവരെ ദഹിപ്പിച്ചു
  rationale: തീയെ കർത്താവാക്കിയ സന്ദർഭത്തിൽ ‘തിന്നുകളഞ്ഞു/വിഴുങ്ങി’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമായി സമ്പൂർണ നാശത്തെ അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘പ്രിയപ്പെട്ട നഗരം’ എന്നതിന്റെ സൂചിതസ്ഥലം
  choice: പ്രധാനപാഠത്തിൽ ‘പ്രിയപ്പെട്ട നഗരം’ എന്നു മാത്രം നൽകി തിരിച്ചറിയൽ തുറന്നുവെച്ചു.
  alternative: യെരൂശലേം; അല്ലെങ്കിൽ ദൈവത്തിന്റെ ജനതയെയോ നഗരത്തെയോ സൂചിപ്പിക്കുന്ന അന്ത്യകാലപ്രതീകം.
  rationale: ഗ്രീക്ക് പാഠം ഈ വാക്യത്തിൽ നഗരത്തിന് പേര് നൽകുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക വ്യാഖ്യാനം വിവർത്തനത്തിൽ ഉറപ്പിക്കുന്നത് ഒഴിവാക്കി ദൈവശാസ്ത്രപരമായ സംഘർഷവും അവ്യക്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭൂമിയുടെ വിശാലതയിലാകെ’ എന്ന പ്രയോഗം πλάτος എന്ന പദത്തിന്റെ വിശാലവ്യാപ്തി സംരക്ഷിക്കുന്നു; ‘സമതലം’ പോലുള്ള അധിക ഭൂപ്രകൃതിവിവരം ചേർക്കുന്നില്ല. ആവർത്തിച്ച καί-കളെ മലയാളവാക്യപ്രവാഹത്തിന് അനുസരിച്ച് ബന്ധിപ്പിക്കുകയും രണ്ടാമത്തെ പ്രധാന സംഭവത്തിന് ‘അപ്പോൾ’ ഉപയോഗിക്കുകയും ചെയ്തു.
