reference: Revelation 20:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: ml
  text: കടൽ അതിലുള്ള മരിച്ചവരെ വിട്ടുകൊടുത്തു; മരണവും പാതാളവും[a] അവയിൽ ഉണ്ടായിരുന്ന മരിച്ചവരെ വിട്ടുകൊടുത്തു. ഓരോരുത്തനും അവരവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച് വിധിക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക്: ᾅδης (ഹാദേസ്), അതായത് മരിച്ചവരുടെ ലോകം. ഈ പദം സാധാരണയായി ‘നരകം’ എന്നു പരിഭാഷപ്പെടുത്തുന്ന പദങ്ങളിൽനിന്ന് വ്യത്യസ്തമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: വിട്ടുകൊടുത്തു
  rationale: δίδωμι എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘കൊടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ കടലും മരണവും പാതാളവും മരിച്ചവരെ ന്യായവിധിക്കായി പുറത്തുവിടുന്നതാണ് സന്ദർഭം; അതിനാൽ ‘വിട്ടുകൊടുത്തു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἡ θάλασσα
  choice: കടൽ
  rationale: നിശ്ചിതമായ കടലിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാള പദം.
- source_word: τοὺς νεκρούς
  choice: മരിച്ചവരെ
  rationale: നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ‘മരിച്ചവർ’ എന്നു നൽകുന്നു.
- source_word: τοὺς ἐν αὐτῇ
  choice: അതിലുള്ള
  rationale: കടലിനുള്ളിൽ ഉണ്ടായിരുന്ന മരിച്ചവരെ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ὁ θάνατος
  choice: മരണം
  rationale: ഇവിടെ മരണം പാതാളത്തോടൊപ്പം മരിച്ചവരെ വിട്ടുകൊടുക്കുന്ന വ്യക്തിവൽക്കരിക്കപ്പെട്ട ശക്തിയായി വരുന്നു; മലയാളത്തിൽ സന്ദർഭംതന്നെ ഈ വ്യക്തിവൽക്കരണം വ്യക്തമാക്കുന്നു.
- source_word: ὁ ᾅδης
  choice: പാതാളം
  rationale: ᾅδης മരിച്ചവരുടെ അധോലോകം/വാസസ്ഥലം എന്ന ആശയം വഹിക്കുന്നു. ‘പാതാളം’ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ‘നരകം’ എന്ന അന്തിമശിക്ഷാ ധാരണയുമായി അനാവശ്യമായി കലരാത്തതുമാണ്; അടിക്കുറിപ്പ് ഗ്രീക്ക് പദത്തിന്റെ പ്രത്യേകത വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ἐν αὐτοῖς
  choice: അവയിൽ ഉണ്ടായിരുന്ന
  rationale: ബഹുവചനമായ αὐτοῖς മരണത്തെയും പാതാളത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നതിനാൽ ‘അവയിൽ’ എന്നു നൽകി ആ വ്യാകരണബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: ἐκρίθησαν ἕκαστος
  choice: ഓരോരുത്തനും ... വിധിക്കപ്പെട്ടു
  rationale: ബഹുവചന ക്രിയയോടൊപ്പം വരുന്ന വിതരണാത്മക ഏകവചനമായ ἕκαστος ഓരോ വ്യക്തിയെയും പ്രത്യേകം മുൻനിർത്തുന്നു; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: അവരവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച്
  rationale: ἔργα എന്നത് ഇവിടെ ചെയ്ത പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു. ‘അവരവരുടെ’ എന്നത് വിധി ഓരോരുത്തന്റെ സ്വന്തം പ്രവൃത്തികൾക്കനുസരിച്ചാണെന്ന വിതരണാത്മക അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അന്ത്യന്യായവിധിയുടെ സന്ദർഭത്തിൽ ᾅδης എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാതാളം
  alternative: മരിച്ചവരുടെ ലോകം; നരകം
  rationale: ‘പാതാളം’ ᾅδης-നെ അന്തിമശിക്ഷയെ സൂചിപ്പിക്കുന്ന പദങ്ങളുമായി ഒറ്റപ്പെടുത്താതെ അതിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു. ‘നരകം’ എന്നു നൽകുന്നത് സമീപസന്ദർഭത്തിലെ ‘തീപ്പൊയ്ക’യുമായി അനാവശ്യമായി സമീകരിച്ചേക്കാം.
- issue: θάνατος എന്നതിന്റെ വ്യക്തിവൽക്കരണം
  choice: മരണം
  alternative: മരണശക്തി
  rationale: മൂലപാഠം ‘മരണം’ എന്ന സാധാരണ നാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിന് ‘മരണശക്തി’ എന്ന വ്യാഖ്യാനഘടകം ചേർക്കാതെ, മരിച്ചവരെ വിട്ടുകൊടുക്കുന്ന പ്രവർത്തിയിലൂടെ വ്യക്തിവൽക്കരണം പ്രകടമാകാൻ അനുവദിക്കുന്നു.
- issue: പ്രവൃത്തികൾക്കനുസരിച്ചുള്ള വിധി
  choice: ഓരോരുത്തനും അവരവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച് വിധിക്കപ്പെട്ടു
  alternative: അവർ ചെയ്തതിന്റെ അടിസ്ഥാനത്തിൽ വിധിക്കപ്പെട്ടു
  rationale: κατάയും ἔργαയും നൽകുന്ന ‘പ്രവൃത്തികൾക്കനുസരിച്ച്’ എന്ന ബന്ധം നിലനിർത്തുന്നു; രക്ഷയുടെയോ ശിക്ഷയുടെയോ വിശദമായ ദൈവശാസ്ത്രക്രമം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. അപ്പോക്കലിപ്റ്റിക് വ്യക്തിവൽക്കരണം നിലനിർത്തി; ‘അവരവരുടെ’ എന്ന സ്വാഭാവിക വിതരണരൂപം ഉപയോഗിച്ച് ഓരോ വ്യക്തിയുടെയും പ്രവൃത്തികളോടുള്ള ബന്ധം വ്യക്തമാക്കി.
