id: REV.20.15
reference: Revelation 20:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: ml
  text: ജീവന്റെ പുസ്തകത്തിൽ എഴുതപ്പെട്ടതായി ആരെങ്കിലും കാണപ്പെടാതിരുന്നാൽ, ആ വ്യക്തിയെ അഗ്നിത്തടാകത്തിലേക്ക് എറിയപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജീവന്റെ ചുരുളിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. βίβλος എന്ന ഗ്രീക്ക് പദം പുസ്തകത്തെയോ ചുരുളിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: ആരെയെങ്കിലും ... എങ്കിൽ
  rationale: അനിശ്ചിതമായ വ്യവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ആരെയും ഉൾക്കൊള്ളാവുന്ന പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: οὐχ εὑρέθη
  choice: കണ്ടില്ലെങ്കിൽ
  rationale: εὑρίσκωയുടെ ഭൂതകാല കർമണിപ്രയോഗത്തിന്റെ ന്യായവിധി/പരിശോധനാ സന്ദർഭത്തിലുള്ള അർഥം മലയാളത്തിലെ സ്വാഭാവിക വ്യവസ്ഥാരൂപത്തിൽ നൽകുന്നു.
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: ജീവന്റെ പുസ്തകത്തിൽ
  rationale: βίβλος എന്നത് പുസ്തകത്തെയോ ചുരുളിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ പരിചിതവും വ്യക്തവുമായ ‘ജീവന്റെ പുസ്തകം’ തെരഞ്ഞെടുത്തു.
- source_word: γεγραμμένος
  choice: എഴുതപ്പെട്ടതായി
  rationale: പൂർണ കർമണി കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന, മുമ്പ് രേഖപ്പെടുത്തി ഇപ്പോഴും അങ്ങനെ നിലനിൽക്കുന്ന അവസ്ഥയെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐβλήθη
  choice: എറിഞ്ഞു
  rationale: βάλλωയുടെ ബലപ്രയോഗമുള്ള ചലനം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘തള്ളപ്പെട്ടു’ എന്നതിനെക്കാൾ മൂലത്തിലെ ‘throw/cast’ ആശയത്തോട് അടുത്തതാണ്.
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: തീപ്പൊയ്കയിലേക്ക്
  rationale: വെളിപ്പാടിലെ ആവർത്തിതമായ അഗ്നിതടാക ദൃശ്യത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τις ... γεγραμμένος / ἐβλήθη
  choice: അയാളെ
  rationale: ഗ്രീക്കിലെ അനിശ്ചിത ഏകവചന വ്യക്തിയെ മലയാളത്തിൽ വ്യക്തമായി തിരിച്ചുസൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇതിന് നിർബന്ധമായ വ്യാകരണലിംഗമില്ലാത്തതിനാൽ മൂലത്തിന്റെ ഏകവചനം നിലനിൽക്കുകയും അനാവശ്യ പുരുഷലിംഗ നിർണ്ണയം ഒഴിവാകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അനിശ്ചിത ഏകവചന വ്യക്തിയുടെ പരാമർശം
  choice: അയാളെ
  alternative: ആ വ്യക്തിയെ
  rationale: ഗ്രീക്കിൽ τις-നോടനുബന്ധിച്ച രൂപങ്ങൾ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ പൊതുവായ ഏതൊരു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘അയാളെ’ ഏകവചനവും വ്യക്തിസൂചനയും നിലനിർത്തുന്നു; അനാവശ്യമായി പുരുഷനെന്ന അർഥം ചുമത്തുന്നില്ല.
- issue: അന്തിമ ന്യായവിധിയുടെ ദൃശ്യം
  choice: തീപ്പൊയ്ക
  alternative: അഗ്നിതടാകം
  rationale: മൂലത്തിലെ λίμνη τοῦ πυρός എന്ന അപ്പോക്കലിപ്റ്റിക് ദൃശ്യം വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജീവന്റെ പുസ്തകം’ എന്ന പരിചിത പ്രയോഗം നിലനിർത്തി; ‘തീപ്പൊയ്ക’ വെളിപ്പാടിലെ ദൃശ്യഭാഷയെ സ്വാഭാവികമായി നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
