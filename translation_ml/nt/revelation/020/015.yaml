revisions:
- from: ജീവന്റെ പുസ്തകത്തിൽ എഴുതപ്പെട്ടതായി ആരെയെങ്കിലും കണ്ടില്ലെങ്കിൽ, അയാളെ തീപ്പൊയ്കയിലേക്ക് എറിഞ്ഞു.[a]
  to: ജീവന്റെ പുസ്തകത്തിൽ എഴുതപ്പെട്ടതായി ആരെങ്കിലും കാണപ്പെടാതിരുന്നാൽ, ആ വ്യക്തിയെ അഗ്നിത്തടാകത്തിലേക്ക് എറിയപ്പെട്ടു.[a]
  rationale: The revision corrects the Greek passive ἐβλήθη with Malayalam ‘എറിയപ്പെട്ടു’, improves the conditional syntax, and uses ‘അഗ്നിത്തടാകം’ for the direct apocalyptic image. ‘ആ വ്യക്തിയെ’ retains the representative singular without unnecessarily assigning gender. The footnote remains correctly anchored to ‘പുസ്തകം’.
  reviewer_model: gpt-5.6-terra
