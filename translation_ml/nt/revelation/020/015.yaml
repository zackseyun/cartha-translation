review_pass:
  verdict: revise
  source_fidelity: The conditional and the judicial sense are substantially conveyed, but the final verb is active (‘എറിഞ്ഞു’, ‘[someone] threw’) whereas Greek ἐβλήθη is aorist passive (‘was thrown’). The main text needs a passive Malayalam construction. ‘തീപ്പൊയ്ക’ is understandable, but ‘അഗ്നിത്തടാകം’ more directly and consistently renders λίμνη τοῦ πυρός in this established apocalyptic expression.
  naturalness: The draft is generally clear, but ‘എഴുതപ്പെട്ടതായി ആരെയെങ്കിലും കണ്ടില്ലെങ്കിൽ’ is less idiomatic than ‘ജീവന്റെ പുസ്തകത്തിൽ എഴുതപ്പെട്ടതായി കാണപ്പെടാതിരുന്നാൽ’. The revision uses a smooth modern-standard Malayalam conditional while retaining the indefinite singular scope.
  terminology: ‘ജീവന്റെ പുസ്തകം’ is appropriate. ‘അഗ്നിത്തടാകം’ is preferred over ‘തീപ്പൊയ്ക’ for formal register and close correspondence to ‘lake of fire’. The lexical footnote correctly notes the possible sense ‘scroll’; its marker is retained.
  issues:
  - severity: high
    issue: The rendering ‘എറിഞ്ഞു’ is active.
    rationale: ἐβλήθη is passive. Malayalam should state that the person ‘was thrown,’ not leave an unstated active agent implied by ‘threw’.
  - severity: medium
    issue: ‘തീപ്പൊയ്ക’ is a looser and less standard rendering of λίμνη τοῦ πυρός.
    rationale: ‘അഗ്നിത്തടാകം’ directly represents ‘lake of fire’ and better preserves the fixed imagery and formal register of Revelation.
  - severity: low
    issue: The conditional wording is somewhat awkward.
    rationale: ‘എഴുതപ്പെട്ടതായി കാണപ്പെടാതിരുന്നാൽ’ naturally expresses ‘if anyone was not found written’ without altering the forensic/disclosive nuance.
  revised_text: ജീവന്റെ പുസ്തകത്തിൽ എഴുതപ്പെട്ടതായി ആരെങ്കിലും കാണപ്പെടാതിരുന്നാൽ, ആ വ്യക്തിയെ അഗ്നിത്തടാകത്തിലേക്ക് എറിയപ്പെട്ടു.[a]
  revised_footnotes:
