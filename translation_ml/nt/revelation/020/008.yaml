revisions:
- from: അവൻ പുറപ്പെട്ട് ഭൂമിയുടെ നാലു കോണുകളിലുമുള്ള ജനതകളെ—ഗോഗിനെയും മാഗോഗിനെയും[b]—വഞ്ചിക്കുകയും[a] അവരെ യുദ്ധത്തിനായി[c] ഒരുമിച്ചുകൂട്ടുകയും ചെയ്യും. അവരുടെ എണ്ണം കടൽപ്പുറത്തെ മണൽപോലെയാണ്.
  to: അവൻ ഭൂമിയുടെ നാലു കോണുകളിലുള്ള ഗോഗും മാഗോഗും ആയ ജനതകളെ വഞ്ചിക്കാനും[a], അവരെ യുദ്ധത്തിനായി[c] ഒരുമിച്ചുകൂട്ടാനും പുറപ്പെടും. അവരുടെ എണ്ണം കടൽക്കരയിലെ മണൽപോലെയാണ്.
