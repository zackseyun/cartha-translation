  revision_rationale: 'The main text is revised to clarify that Gog and Magog stand in apposition to the nations and to preserve the Greek purpose construction. Since the Gog/Magog explanatory note is not needed to establish the translation’s grammar and the supplied draft had its marker attached to the names, its anchor should be retained there. Accordingly, the complete corrected text should read: “അവൻ ഭൂമിയുടെ നാലു കോണുകളിലുള്ള ഗോഗും മാഗോഗും[b] ആയ ജനതകളെ വഞ്ചിക്കാനും[a], അവരെ യുദ്ധത്തിനായി[c] ഒരുമിച്ചുകൂട്ടാനും പുറപ്പെടും. അവരുടെ എണ്ണം കടൽക്കരയിലെ മണൽപോലെയാണ്.”'
