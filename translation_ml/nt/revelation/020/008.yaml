id: REV.20.8
reference: Revelation 20:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: ml
  text: അവൻ ഭൂമിയുടെ നാലു കോണുകളിലുള്ള ഗോഗും മാഗോഗും ആയ ജനതകളെ വഞ്ചിക്കാനും[a], അവരെ യുദ്ധത്തിനായി[c] ഒരുമിച്ചുകൂട്ടാനും പുറപ്പെടും. അവരുടെ എണ്ണം കടൽക്കരയിലെ മണൽപോലെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വഴിതെറ്റിക്കാനും.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘പോരാട്ടത്തിനായി.’ ഗ്രീക്കുപദത്തിന് ‘യുദ്ധം’ എന്നും ‘പോരാട്ടം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: അവൻ പുറപ്പെടും
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച സാത്താനാണ് വ്യാകരണപരമായി തുടർന്നുവരുന്ന കർത്താവ്. ചലനത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്താൻ ‘പുറപ്പെടും’ സ്വീകരിച്ചു.
- source_word: πλανῆσαι
  choice: വഞ്ചിക്കുക
  rationale: πλανάω എന്നതിന്റെ ‘വഞ്ചിക്കുക/വഴിതെറ്റിക്കുക’ എന്ന അർഥപരിധിയിൽ, സന്ദർഭത്തിന് സ്വാഭാവികമായ ‘വഞ്ചിക്കുക’ മുഖ്യപാഠത്തിൽ നൽകി; മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: τὰ ἔθνη
  choice: ജനതകൾ
  rationale: ഇവിടെ യഹൂദരല്ലാത്തവർ എന്ന പരിമിത അർഥത്തേക്കാൾ വിവിധ ദേശീയ-ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനതകൾ’ യോജിക്കുന്നു.
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: ഭൂമിയുടെ നാലു കോണുകളിലുമുള്ള
  rationale: വാസയോഗ്യലോകത്തിന്റെ അറ്റങ്ങളെയെല്ലാം സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ദൃശ്യപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: ഗോഗിനെയും മാഗോഗിനെയും
  rationale: പേരുകൾ ലിപ്യന്തരണം ചെയ്തു; ഭൂമിയുടെ നാലു കോണുകളിലുള്ള ജനതകളെ വിശേഷിപ്പിക്കുന്ന സമാനാധികരണപ്രയോഗമായി വായിക്കാവുന്ന ഘടന നിലനിർത്തി.
- source_word: συναγαγεῖν
  choice: ഒരുമിച്ചുകൂട്ടുക
  rationale: യുദ്ധത്തിനായി പല ജനതകളെയും കൂട്ടിച്ചേർക്കുന്ന പ്രവൃത്തി വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τὸν πόλεμον
  choice: യുദ്ധത്തിനായി
  rationale: πόλεμος എന്നതിന്റെ ‘യുദ്ധം/പോരാട്ടം’ എന്ന അർഥപരിധി അനാവശ്യമായി ചുരുക്കാതെ ലക്ഷ്യം സൂചിപ്പിക്കുന്ന ഘടനയിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: അവരുടെ എണ്ണം
  rationale: ഗ്രീക്കിലെ ബന്ധസർവനാമഘടനയെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: കടൽപ്പുറത്തെ മണൽപോലെ
  rationale: എണ്ണമറ്റതിനെ സൂചിപ്പിക്കുന്ന ബൈബിൾ ദൃശ്യോപമ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവൻ പുറപ്പെടും’ എന്നതിലെ കർത്താവ്
  choice: മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന സാത്താൻ
  alternative: ഈ വാക്യത്തിൽ കർത്താവിനെ വീണ്ടും പേരെടുത്ത് വ്യക്തമാക്കുക
  rationale: ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ കർത്താവ് പ്രത്യക്ഷമായി ഇല്ലെങ്കിലും വെളിപ്പാട് 20:7-ലെ സാത്താനാണ് വ്യാകരണപരമായ തുടർച്ച. ‘സാത്താൻ’ എന്ന് ചേർക്കാതെ സർവനാമം ഉപയോഗിക്കുന്നത് മൂലപാഠത്തിന്റെ രൂപം കൂടുതൽ കാത്തുസൂക്ഷിക്കുന്നു.
- issue: ‘ഗോഗും മാഗോഗും’ എന്നതിന്റെ പ്രയോഗശക്തി
  choice: വഞ്ചിക്കപ്പെടുന്ന ജനതകളെ സമാനാധികരണമായി തിരിച്ചറിയുന്ന പേരുകൾ
  alternative: രണ്ട് വ്യക്തികളോ കർശനമായ ഭൂമിശാസ്ത്ര-വംശീയ സമൂഹങ്ങളോ ആയി വ്യക്തമാക്കുക
  rationale: യെഹെസ്കേൽ 38–39-ലെ പ്രതിധ്വനി നിലനിർത്തുകയും ഈ പേരുകൾ പ്രതീകാത്മകമാണോ മാതൃകാപരമാണോ കൃത്യമായ ഭൂമിശാസ്ത്രസൂചനയാണോ എന്ന് പരിഭാഷയിൽ തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. അപോകലിപ്റ്റിക് ദൃശ്യഭാഷയും യെഹെസ്കേൽസംബന്ധിയായ പേരുകളും നിലനിർത്തി; തർക്കവിധേയമായ തിരിച്ചറിയലുകൾ മുഖ്യപാഠത്തിൽ വിശദീകരിച്ച് തീർപ്പാക്കിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
