  source_fidelity: 'മുഖ്യപാഠം ഗ്രീക്കിലെ ക്രമവും ആശയവും കൃത്യമായി പിന്തുടരുന്നു: നാലാമൻ പാത്രം സൂര്യന്റെമേൽ ഒഴിക്കുന്നു; സൂര്യന് മനുഷ്യരെ തീകൊണ്ട് ചുട്ടുപൊള്ളിക്കാനുള്ള അധികാരം നൽകപ്പെടുന്നു. എങ്കിലും αὐτῷ എന്ന സർവനാമത്തെ മുഖ്യപാഠത്തിൽ ‘സൂര്യന്’ എന്നു നിർണയമായി വികസിപ്പിച്ചിരിക്കുന്നത് ഗ്രീക്കിലെ സർവനാമരൂപത്തേക്കാൾ അല്പം കൂടുതൽ വ്യക്തമാക്കലാണ്. അടിക്കുറിപ്പിലൂടെ ആ വ്യാകരണപരമായ രൂപവും സാധ്യതയേറിയ സൂര്യ-സൂചനയും നിലനിർത്തണം.'
