id: REV.16.8
reference: Revelation 16:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: ml
  text: നാലാമൻ തന്റെ പാത്രം സൂര്യന്റെമേൽ ഒഴിച്ചു; തീകൊണ്ട് മനുഷ്യരെ ചുട്ടുപൊള്ളിക്കാൻ അതിന് അധികാരം നൽകപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “മനുഷ്യരെ തീയിൽ ചുട്ടുപൊള്ളിക്കാനുള്ള അധികാരം അതിന് നൽകപ്പെട്ടു.” ‘അതിന്’ എന്നത് മിക്കവാറും സൂര്യനെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: ἐν πυρίയുടെ കൂടുതൽ അക്ഷരാർഥമായ ‘തീയിൽ’ എന്ന രൂപവും αὐτῷ എന്ന സർവനാമത്തിന്റെ സാധ്യതയേറിയ സൂചിതപദവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: നാലാമൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ക്രമസംഖ്യാനാമവിശേഷണം ഇവിടെ നാമമായി പ്രവർത്തിക്കുന്നു. സന്ദർഭത്തിൽ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ഈ വാക്യത്തിൽ ‘ദൂതൻ’ എന്ന് ആവർത്തിച്ചിട്ടില്ല; അതിനാൽ ഗ്രീക്കിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: ἐξέχεεν
  choice: ഒഴിച്ചു
  rationale: വെളിപ്പാടിലെ പാത്രന്യായവിധികളുടെ ആവർത്തിത പ്രയോഗത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളം.
- source_word: φιάλην
  choice: പാത്രം
  rationale: φιάλη സൂചിപ്പിക്കുന്ന വീതിയേറിയ പാത്രത്തിന് ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന പൊതുപദം; പഴഞ്ചൻ അല്ലെങ്കിൽ അത്യന്തം സാങ്കേതിക പദം ഒഴിവാക്കുന്നു.
- source_word: ἐπὶ τὸν ἥλιον
  choice: സൂര്യന്റെമേൽ
  rationale: ἐπί + accusative ഇവിടെ ഒഴിക്കപ്പെടുന്നതിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; ‘സൂര്യന്റെമേൽ’ ദൃശ്യരൂപവും ദിശയും നിലനിർത്തുന്നു.
- source_word: ἐδόθη αὐτῷ
  choice: സൂര്യന് അധികാരം നൽകപ്പെട്ടു
  rationale: αὐτῷ എന്ന സർവനാമത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ മുൻപദം സൂര്യനാണ്. മലയാളത്തിൽ കർത്തൃരഹിതമായ ദൈവിക കർമണിപ്രയോഗം നിലനിർത്തുന്നു. ‘അധികാരം’ ഗ്രീക്കിൽ പ്രത്യേകം നാമമായി ഇല്ലെങ്കിലും infinitive-നോടുകൂടിയ ἐδόθηയുടെ അനുവദന/ശേഷി അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: καυματίσαι
  choice: ചുട്ടുപൊള്ളിക്കാൻ
  rationale: തീവ്രമായ ചൂടുകൊണ്ട് പൊള്ളിക്കുക എന്ന καυματίζωയുടെ അർഥം സ്വാഭാവികവും ശക്തവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τοὺς ἀνθρώπους
  choice: മനുഷ്യരെ
  rationale: പുരുഷന്മാർക്ക് മാത്രമല്ല, പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്ന ലിംഗനിരപേക്ഷമായ കൃത്യരൂപം.
- source_word: ἐν πυρί
  choice: തീകൊണ്ട്
  rationale: ἐν ഇവിടെ ഉപാധി/മാർഗം സൂചിപ്പിക്കുന്നു; ‘തീകൊണ്ട്’ മലയാളത്തിൽ സ്വാഭാവികവും ഗ്രീക്കിലെ തീയുടെ ദൃശ്യരൂപം നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: ἐδόθηയിലെ പരോക്ഷ ദൈവിക പ്രവർത്തനം
  choice: ‘നൽകപ്പെട്ടു’ എന്ന കർമണിപ്രയോഗം നിലനിർത്തി, നൽകിയത് ആരെന്ന് വ്യക്തമാക്കാതിരിക്കുക.
  alternative: ദൈവം സൂര്യന് അധികാരം നൽകി.
  rationale: വെളിപ്പാടിൽ സാധാരണമായ ദൈവിക കർമണിപ്രയോഗം ദൈവത്തിന്റെ പരമാധികാരപരമായ അനുവദനം സൂചിപ്പിച്ചേക്കാം; എന്നാൽ വാക്യം നൽകുന്നവനെ നേരിട്ട് പറയാത്തതിനാൽ പരിഭാഷയും പേര് ചേർക്കുന്നില്ല.
- issue: αὐτῷയുടെ സൂചിതപദം
  choice: സൂര്യൻ
  alternative: നാലാമൻ/നാലാമത്തെ ദൂതൻ, അല്ലെങ്കിൽ വ്യക്തമല്ലാത്ത മറ്റൊരു പ്രവർത്തകൻ
  rationale: ഏറ്റവും അടുത്ത വ്യാകരണപരമായ മുൻപദം ἥλιον ആണ്; മനുഷ്യരെ ചുട്ടുപൊള്ളിക്കുന്ന പ്രവർത്തനവും സൂര്യനോട് സ്വാഭാവികമായി ചേരുന്നു. എങ്കിലും ഗ്രീക്കിൽ സർവനാമം മാത്രമുള്ളതിനാൽ അക്ഷരാർഥ ഘടന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ἐδόθηയോടൊപ്പം ‘അധികാരം’ ചേർക്കൽ
  choice: സ്വാഭാവിക മലയാളത്തിനായി ‘അധികാരം നൽകപ്പെട്ടു’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുക.
  alternative: ‘ചുട്ടുപൊള്ളിക്കാൻ അതിന് നൽകപ്പെട്ടു’ എന്ന കൂടുതൽ അക്ഷരാർഥ രൂപം
  rationale: ഗ്രീക്കിൽ ‘അധികാരം’ എന്ന നാമം ഇല്ലെങ്കിലും ἐδόθη + infinitive അനുവദിക്കപ്പെട്ട ശേഷി/അധികാരം സൂചിപ്പിക്കുന്നു. ചേർത്ത പദം ആശയം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥ വ്യത്യാസം അടിക്കുറിപ്പിലൂടെ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നാലാമൻ’ എന്ന സംക്ഷിപ്ത രൂപം മൂലപാഠത്തെ പിന്തുടരുന്നു; ‘ദൂതൻ’ അനാവശ്യമായി ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
