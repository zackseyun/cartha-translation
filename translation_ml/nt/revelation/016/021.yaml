id: REV.16.21
reference: Revelation 16:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: ml
  text: ഏതാണ്ട് ഒരു താലന്ത് വീതം ഭാരമുള്ള വൻ ആലിപ്പഴങ്ങൾ[a] സ്വർഗത്തിൽനിന്ന്[b] മനുഷ്യരുടെമേൽ വീഴുന്നു; ആലിപ്പഴത്തിന്റെ ബാധ നിമിത്തം മനുഷ്യർ ദൈവത്തെ ദൂഷിച്ചു, കാരണം അതിന്റെ ബാധ അത്യന്തം കഠിനമായിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഒരു താലന്തിന്റെ ഭാരമുള്ളവ.’ ഗ്രീക്കിൽ കൃത്യമായ അളവല്ല, താരതമ്യമാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ആകാശത്തുനിന്ന്.’ ഗ്രീക്കിലെ οὐρανός എന്നതിന് ‘സ്വർഗം’ എന്നും ‘ആകാശം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: ‘അതിന്റെ ബാധ വളരെ വലുതായിരുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: വൻ ആലിപ്പഴങ്ങൾ
  rationale: ഗ്രീക്കിലെ ഏകവചന സമാഹാരപദം മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനത്തിൽ നൽകി; അസാധാരണ വലുപ്പം ‘വൻ’ വ്യക്തമാക്കുന്നു.
- source_word: ὡς ταλαντιαία
  choice: ഏകദേശം ഒരു താലന്ത് വീതം ഭാരമുള്ള
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഏകദേശ താരതമ്യം നിലനിർത്തുകയും ഓരോ ആലിപ്പഴത്തിന്റെയും ഭാരം ഉദ്ദേശിക്കുന്നുവെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: καταβαίνει
  choice: വീഴുന്നു
  rationale: ആലിപ്പഴത്തെക്കുറിച്ചുള്ള മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗവും ഗ്രീക്കിലെ ദൃശ്യസജീവമായ വർത്തമാനകാലവും നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ആകാശത്തുനിന്ന്
  rationale: ആലിപ്പഴം വീഴുന്ന തത്സമയ ഭൗതിക ദൃശ്യം മുൻനിർത്തുന്നു; οὐρανός എന്ന പദത്തിന്റെ ‘സ്വർഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: മനുഷ്യരുടെമേൽ
  rationale: ἄνθρωποι ലിംഗനിരപേക്ഷമായി മനുഷ്യരെ പൊതുവിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐβλασφήμησαν
  choice: ദൈവത്തെ ദുഷിച്ചു
  rationale: ദൈവത്തിനെതിരായ നിന്ദാഭാഷ എന്ന ശക്തമായ അർഥം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: ആലിപ്പഴവർഷം വരുത്തിയ ബാധ നിമിത്തം
  rationale: ἐκ എന്നതിന്റെ കാരണാർഥവും വെളിപാടിൽ πληγήക്കുള്ള ന്യായവിധിസംബന്ധമായ ‘ബാധ’ എന്ന അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: കാരണം, ആ ബാധ അത്യന്തം കഠിനമായിരുന്നു
  rationale: μεγάλη ... σφόδρα എന്ന തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു; αὐτῆς സൂചിപ്പിക്കുന്ന ആലിപ്പഴബാധയെ ‘ആ ബാധ’ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: οὐρανός എന്നതിന്റെ അർഥം
  choice: ആകാശത്തുനിന്ന്
  alternative: സ്വർഗത്തിൽനിന്ന്
  rationale: ആലിപ്പഴം വീഴുന്ന ഭൗതിക ദൃശ്യം കണക്കിലെടുത്ത് ‘ആകാശം’ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാണ്; വെളിപാടിലെ ദൈവിക ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ‘സ്വർഗം’ എന്ന വായനയും സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: ἄνθρωποι എന്ന പൊതുവാചകത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യർ
  alternative: ആളുകൾ
  rationale: ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവിൽ ഉദ്ദേശിക്കുന്നു; ‘മനുഷ്യർ’ അതിനെ കൃത്യവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നൽകുന്നു.
- issue: മനുഷ്യരുടെ പ്രതികരണവും ബാധയുടെ കഠിനതയും തമ്മിലുള്ള ബന്ധം
  choice: നിമിത്തം ... കാരണം
  alternative: ബാധയിൽനിന്ന് ... എന്തെന്നാൽ
  rationale: ആലിപ്പഴബാധ അവരുടെ ദൈവദൂഷണത്തിന് കാരണമായെന്നും തുടർന്നുള്ള ὅτι വാക്യം ബാധയുടെ അതികഠിനത വിശദീകരിക്കുന്നുവെന്നും പാഠത്തിന്റെ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘താലന്ത്’ എന്ന പുരാതന ഭാരമാനം പരിവർത്തനം ചെയ്യാതെ നിലനിർത്തി; കൃത്യതയുടെ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
