id: REV.16.6
reference: Revelation 16:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι αἷμα ἁγίων καὶ προφητῶν ἐξέχεαν, καὶ αἷμα αὐτοῖς ⸀δέδωκας πιεῖν· ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: ml
  text: എന്തെന്നാൽ അവർ വിശുദ്ധരുടെയും പ്രവാചകന്മാരുടെയും രക്തം ചൊരിഞ്ഞു[a], നീ അവർക്കു കുടിക്കാൻ രക്തം കൊടുത്തിരിക്കുന്നു; അവർ അർഹരാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധരുടെയും പ്രവാചകന്മാരുടെയും രക്തം ഒഴുക്കി.’ ഗ്രീക്ക് ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ഒഴിക്കുക’ എന്നാണ്; ചുറ്റുമുള്ള ഭാഗത്ത് കലശങ്ങൾ ഒഴിക്കുന്ന ന്യായവിധിദൃശ്യത്തെയും ഇത് പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവർ അർഹരാണ്’ എന്നതിന്റെ അർഥം, അവർ ഈ ന്യായവിധി അർഹിക്കുന്നു എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രഖ്യാപനത്തിന് കാരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് കാരണസൂചകത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: αἷμα
  choice: രക്തം
  rationale: രണ്ടിടത്തും ആവർത്തനം നിലനിർത്തി പ്രതികാരനീതിയുടെ ശക്തമായ ദൃശ്യഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: ἁγίων
  choice: വിശുദ്ധർ
  rationale: വെളിപ്പാടിൽ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനങ്ങളെ സൂചിപ്പിക്കുന്ന പൊതുവായ ബൈബിൾ അർഥം; പിൽക്കാല ഔദ്യോഗിക വിശുദ്ധപദവി എന്ന ആശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: προφητῶν
  choice: പ്രവാചകന്മാർ
  rationale: ദൈവത്തിന്റെ സന്ദേശവാഹകരെ സൂചിപ്പിക്കുന്ന വ്യക്തവും പതിവുമായ മലയാള പദം.
- source_word: ἐξέχεαν
  choice: ചൊരിഞ്ഞു
  rationale: രക്തത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണ്; അതേസമയം ഗ്രീക്കിലെ ‘ഒഴിക്കുക/ചൊരിയുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: രക്തം ചൊരിഞ്ഞവരെയാണ് ദത്തിവ് സർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ പരോക്ഷകർമമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δέδωκας
  choice: കൊടുത്തിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണകാലത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴത്തെ പ്രസക്തിയും മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πιεῖν
  choice: കുടിക്കാൻ
  rationale: ‘കൊടുത്തിരിക്കുന്നു’ എന്ന ക്രിയയുടെ ഉദ്ദേശ്യപൂരകമായി ഗ്രീക്ക് അനന്തക്രിയയെ നേരിട്ട്, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἄξιοί εἰσιν
  choice: അവർ അതിന് അർഹരാണ്
  rationale: ἄξιος എന്ന വിലയിരുത്തൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ ഒറ്റയ്ക്ക് ‘അർഹർ’ എന്നു പറയുന്നതിലെ അവ്യക്തത കുറയ്ക്കാൻ സന്ദർഭത്തിൽ സൂചിതമായ വിധിയെ ‘അതിന്’ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പ്രതികാരനീതിയുടെ ഭാഷ
  choice: ‘നീ അവർക്കു കുടിക്കാൻ രക്തം കൊടുത്തിരിക്കുന്നു’ എന്ന കഠിനവും അനുപാതികവുമായ ന്യായവിധിഭാഷ നേരിട്ട് നിലനിർത്തി.
  alternative: ‘നീ അവരെ ശിക്ഷിച്ചു’ എന്ന പൊതുവായ മൃദൂകരിച്ച പരാവർത്തനം.
  rationale: ഗ്രീക്ക് വാക്യം രക്തത്തിന് രക്തം എന്ന ഞെട്ടിക്കുന്ന ന്യായവിധിദൃശ്യം അവതരിപ്പിക്കുന്നു; അതിനെ പൊതുവായ ശിക്ഷാഭാഷയാക്കി ലഘൂകരിക്കരുത്.
- issue: ‘വിശുദ്ധർ’ എന്നതിന്റെ സൂചന
  choice: ദൈവത്തിന്റെ വിശുദ്ധജനങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന ബൈബിൾപദമായി ‘വിശുദ്ധർ’ ഉപയോഗിച്ചു.
  alternative: ‘വിശുദ്ധജനങ്ങൾ’.
  rationale: സ്ഥാപിതമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തുമ്പോഴും പിൽക്കാല സഭാപരമായ ഔദ്യോഗിക പദവിയെ വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: ἄξιοί εἰσιν എന്ന ന്യായവിധിപ്രഖ്യാപനം
  choice: ‘അവർ അതിന് അർഹരാണ്’ എന്ന് നൽകി; ഇവിടെ അർഹത ന്യായവിധി ലഭിക്കാനുള്ള അർഹതയാണ്.
  alternative: ‘അവർ അർഹരാണ്’ എന്ന കൂടുതൽ രൂപനിഷ്ഠമായെങ്കിലും മലയാളത്തിൽ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാവുന്ന രൂപം.
  rationale: ഗ്രീക്കിൽ കർമം പ്രസ്താവിച്ചിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ വിധിയാണ് സൂചിതം. ‘അതിന്’ ചേർക്കുന്നത് പുതിയ ദൈവശാസ്ത്രവാദം ഇറക്കുമതി ചെയ്യാതെ മലയാളത്തിലെ അർഥവ്യക്തത ഉറപ്പാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ന്യായവിധിശൈലി. ‘ചൊരിഞ്ഞു’ എന്നത് രക്തത്തോടൊപ്പം പ്രചാരത്തിലുള്ളതും ഗ്രീക്ക് ദൃശ്യഭാഷയോട് അടുത്തതുമാണ്. പ്രധാനവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
