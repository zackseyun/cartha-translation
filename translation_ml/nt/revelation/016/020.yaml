  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶσα νῆσος ἔφυγεν, καὶ ὄρη οὐχ εὑρέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/020.yaml
  text: And every island fled[a], and mountains were not found.
translation:
  language: ml
  text: ഓരോ ദ്വീപും ഓടിപ്പോയി[a], പർവതങ്ങൾ കണ്ടെത്താനായില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അപ്രത്യക്ഷമായി.” ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം “ഓടിപ്പോയി” എന്നാണ്; അത് ഈ വാക്യത്തിലെ സജീവമായ വ്യക്തിവത്കരണം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα νῆσος
  choice: ഓരോ ദ്വീപും
  rationale: ഏകവചന നാമത്തോടുകൂടിയ πᾶσα ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോ’ എന്നാണ്; ഓരോ ദ്വീപിനെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്കിന്റെ ശക്തി ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: ἔφυγεν
  choice: ഓടിപ്പോയി
  rationale: φεύγω എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘ഓടിപ്പോകുക/പലായനം ചെയ്യുക’ നിലനിർത്തി, വെളിപ്പാടിലെ സജീവമായ മാനവീകരണചിത്രം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഫലം അപ്രത്യക്ഷമാകലാണ്.
- source_word: ὄρη
  choice: പർവതങ്ങൾ
  rationale: ὄρη എന്ന ബഹുവചനത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളപരിഭാഷ.
- source_word: οὐχ εὑρέθησαν
  choice: കാണപ്പെട്ടില്ല
  rationale: εὑρίσκωയുടെ നിഷേധിത കർമണിപ്രയോഗത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ‘ഇല്ലാതായി’ എന്ന് വ്യാഖ്യാനിച്ച് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: καὶ ... καὶ
  choice: …; …
  rationale: മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ആവർത്തിച്ച ‘ഉം’ അസ്വാഭാവികമായതിനാൽ, ആദ്യഘടകത്തിലെ ‘-ഉം’യും അർദ്ധവിരാമവും ഉപയോഗിച്ച് രണ്ടു സമാന്തര ഘടകങ്ങളുടെ സഞ്ചിതബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രപഞ്ചവ്യാപകമായ അന്ത്യകാലദൃശ്യത്തെ അക്ഷരാർഥത്തിലുള്ള അപ്രത്യക്ഷതയായി വ്യാഖ്യാനിക്കണോ, രൂപകമായി മയപ്പെടുത്തണോ
  choice: ‘ഓടിപ്പോയി’ എന്ന മൂർത്തവും സജീവവുമായ ചിത്രം നിലനിർത്തുന്നു
  alternative: ‘അപ്രത്യക്ഷമായി’ അല്ലെങ്കിൽ ‘ഇല്ലാതായി’
  rationale: ഗ്രീക്ക് വാചകം ദ്വീപുകളെ മാനവീകരിക്കുന്ന ശക്തമായ ദൃശ്യം നൽകുന്നു. അത് അക്ഷരാർഥമാണോ പ്രതീകാത്മകമാണോ എന്ന ചോദ്യം പരിഭാഷയിൽ തീർപ്പാക്കാതെ വ്യാഖ്യാനത്തിനായി തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മലകൾ’ എന്ന സാധാരണ പദത്തിനുപകരം അന്ത്യകാലദൃശ്യത്തിന്റെ ഔന്നത്യം സൂക്ഷിക്കാൻ ‘പർവതങ്ങൾ’ ഉപയോഗിച്ചു; എന്നാൽ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നിലനിർത്തി.
