  source_fidelity: 'മുഖ്യപാഠം പൊതുവേ ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: ആദ്യത്തവൻ, പാത്രം ഒഴിക്കൽ, ഭൂമി, ഏകവചനമായ വ്രണം, മൃഗത്തിന്റെ അടയാളവും പ്രതിമാരാധനയും എല്ലാം നിലനിർത്തിയിട്ടുണ്ട്. എന്നാൽ പാദക്കുറിപ്പിലെ ‘ദുഷ്കരം’ വ്രണത്തെ വിശേഷിപ്പിക്കാൻ യോജിക്കുന്നതല്ല; അതിന് സാധാരണയായി ‘പ്രയാസമുള്ള’ എന്നാണ് അർഥം, അതിനാൽ κακόν/πονηρόν എന്ന വിശേഷണജോഡിക്കുള്ള ശരിയായ ബദലല്ല.'
  naturalness: ‘തന്റെ പാത്രം ഭൂമിയിലേക്കു ചൊരിഞ്ഞു’ മനസ്സിലാക്കാവുന്നതാണ്; ‘തന്റെ കിണ്ണം ഭൂമിയിലേക്ക് ഒഴിച്ചു’ എന്നത് φιάληയ്ക്കും ഒഴിക്കൽക്രിയയ്ക്കും കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. പരിഷ്കരിച്ച വാക്യം ആധുനിക നിലവാരമുള്ള മലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി നിലനിർത്തുന്നു.
