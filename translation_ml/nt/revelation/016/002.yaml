- from: ആദ്യത്തവൻ പോയി തന്റെ പാത്രം ഭൂമിയിലേക്കു ചൊരിഞ്ഞു. അപ്പോൾ മൃഗത്തിന്റെ അടയാളമുള്ളവരും അതിന്റെ പ്രതിമയെ ആരാധിക്കുന്നവരുമായ മനുഷ്യരുടെമേൽ ദോഷകരവും വേദനാജനകവുമായ ഒരു വ്രണം ഉണ്ടായി.[a]
  to: ആദ്യത്തവൻ പോയി തന്റെ കിണ്ണം ഭൂമിയിലേക്ക് ഒഴിച്ചു. അപ്പോൾ മൃഗത്തിന്റെ അടയാളമുള്ളവരും അതിന്റെ പ്രതിമയെ ആരാധിക്കുന്നവരുമായ മനുഷ്യരുടെമേൽ ദോഷകരവും കഠിനവുമായ ഒരു വ്രണം ഉണ്ടായി.[a]
  rationale: പാദക്കുറിപ്പിലെ തെറ്റിദ്ധരിപ്പിക്കുന്ന ബദൽ നീക്കി, ഗ്രീക്കിലെ രണ്ടു തീവ്രമായ നിഷേധവിശേഷണങ്ങൾക്കു യോജിച്ച മലയാള ബദൽ നൽകി. φιάληയുടെ പാത്രസ്വഭാവം കൂടുതൽ വ്യക്തമായി കാണിക്കാൻ ‘കിണ്ണം’ ഉപയോഗിച്ചു. വിധിക്കു വിധേയരാകുന്നവർ മൃഗത്തിന്റെ അടയാളമുള്ളവരും അതിന്റെ പ്രതിമയെ ആരാധിക്കുന്നവരുമാണെന്ന പരിമിതി മാറ്റമില്ലാതെ നിലനിർത്തി.
