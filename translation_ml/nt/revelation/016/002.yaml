id: REV.16.2
reference: Revelation 16:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: ml
  text: ആദ്യത്തവൻ പോയി തന്റെ കിണ്ണം ഭൂമിയിലേക്ക് ഒഴിച്ചു. അപ്പോൾ മൃഗത്തിന്റെ അടയാളമുള്ളവരും അതിന്റെ പ്രതിമയെ ആരാധിക്കുന്നവരുമായ മനുഷ്യരുടെമേൽ ദോഷകരവും കഠിനവുമായ ഒരു വ്രണം ഉണ്ടായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഹാനികരവും ദുസ്സഹവുമായ ഒരു വ്രണം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ κακόν, πονηρόν എന്നീ രണ്ടു ശക്തമായ വിശേഷണങ്ങൾ വ്രണത്തിന്റെ തീവ്രത ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: ആദ്യത്തവൻ
  rationale: ഗ്രീക്കിൽ നാമം ചേർക്കാതെ വിശേഷണം നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു. സന്ദർഭത്തിൽ ഏഴ് ദൂതന്മാരിൽ ആദ്യത്തവനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൂതൻ’ എന്നു പാഠത്തിൽ കൂട്ടിച്ചേർക്കാതെ മൂലരൂപം നിലനിർത്തുന്നു.
- source_word: ἀπῆλθεν
  choice: പോയി
  rationale: ആഖ്യാനക്രമത്തിലെ ചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പുറപ്പെട്ടുപോയി’ എന്ന അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: തന്റെ പാത്രം ... ചൊരിഞ്ഞു
  rationale: φιάλη വെളിപ്പാടിലെ ന്യായവിധിദ്രവ്യം വഹിക്കുന്ന വീതിയുള്ള പാത്രമാണ്. ‘കലശം’ എന്നതിനെക്കാൾ ‘പാത്രം’ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്; ἐκχέωയുടെ ഒഴുക്കിക്കളയുന്ന പ്രവൃത്തി ‘ചൊരിഞ്ഞു’ വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὴν γῆν
  choice: ഭൂമിയിലേക്കു
  rationale: εἰς ലക്ഷ്യത്തിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്നു. ഇവിടെ γῆയെ ‘ദേശം’ എന്നു പരിമിതപ്പെടുത്താതെ അപ്പോക്കലിപ്റ്റിക് സന്ദർഭത്തിലെ ‘ഭൂമി’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἕλκος
  choice: വ്രണം
  rationale: പുണ്ണായോ അൾസർപോലെയോ ഉള്ള മുറിവിനെ സൂചിപ്പിക്കുന്ന പദം. ‘വ്രണം’ മാന്യവും പൊതുവേ മനസ്സിലാകുന്നതുമായ മലയാളമാണ്; ‘കുരു’ അത്യന്തം പ്രത്യേകമാണ്.
- source_word: κακὸν καὶ πονηρὸν
  choice: ദോഷകരവും വേദനാജനകവുമായ
  rationale: രണ്ടു ശക്തമായ പ്രതികൂല വിശേഷണങ്ങളുടെ കൂട്ടായ തീവ്രത നിലനിർത്തുന്നു. πονηρόν എന്നതിന് ഇവിടെ ധാർമികമായ ‘ദുഷ്ടം’ എന്ന അർഥം നിർബന്ധിക്കാതെ, വ്രണത്തിന്റെ കഠിനമായ അനുഭവം സൂചിപ്പിക്കുന്നു.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: മനുഷ്യരുടെമേൽ
  rationale: ἄνθρωποι ലിംഗഭേദമില്ലാതെ മനുഷ്യരെ സൂചിപ്പിക്കുന്നു; ‘പുരുഷന്മാർ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: τὸ χάραγμα τοῦ θηρίου
  choice: മൃഗത്തിന്റെ അടയാളം
  rationale: വെളിപ്പാടിലെ പ്രധാന പ്രയോഗത്തിന്റെ സുതാര്യവും സ്ഥിരതയുള്ളതുമായ പരിഭാഷയാണ്.
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: അതിന്റെ പ്രതിമയെ ആരാധിക്കുന്നവർ
  rationale: προσκυνέω ഇവിടെ പ്രതിമയോടുള്ള ആരാധനാഭിവാദ്യം സൂചിപ്പിക്കുന്നു. αὐτοῦയുടെ നപുംസകലിംഗ പൂർവപദമായ മൃഗത്തെ ‘അതിന്റെ’ എന്നു തിരിച്ചുകാട്ടുന്നു.
theological_decisions:
- issue: κακὸν καὶ πονηρὸν എന്ന ഇരട്ട വിശേഷണത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘ദോഷകരവും വേദനാജനകവുമായ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ചീത്തയും ദുഷ്ടവുമായ’ അല്ലെങ്കിൽ ‘ഭയങ്കരവും മാരകവുമായ’
  rationale: മൂലപാഠത്തിലെ ഇരട്ട തീവ്രത സംരക്ഷിക്കുമ്പോഴും വ്രണത്തിന് ധാർമിക ദുഷ്ടത ആരോപിക്കുന്നില്ല. πονηρός ഇവിടെ ദുസ്സഹം/വേദനാജനകം എന്ന അനുഭവപരമായ അർഥം വഹിക്കാം; മറ്റ് സാധ്യത ഫുട്‌നോട്ടിൽ അറിയിക്കുന്നു.
- issue: ബാധിക്കപ്പെടുന്നവരുടെ പരിധി
  choice: മൃഗത്തിന്റെ അടയാളമുള്ളവരും അതിന്റെ പ്രതിമയെ ആരാധിക്കുന്നവരുമായ മനുഷ്യർക്കു മാത്രമായി വാചകം നിലനിർത്തി
  alternative: മനുഷ്യരെ പൊതുവായി ബാധിച്ചതായി വായിക്കുക
  rationale: രണ്ടു പങ്കാളിത്തപ്രയോഗങ്ങളും ബാധിക്കപ്പെടുന്ന മനുഷ്യരെ വ്യക്തമായി വിശേഷിപ്പിക്കുന്നു; ന്യായവിധിയുടെ പരിധി മൂലപാഠത്തേക്കാൾ വിപുലമാക്കുന്നില്ല.
- issue: ὁ πρῶτος എന്നതിൽ സൂചിതമായ നാമം
  choice: ‘ആദ്യത്തവൻ’ എന്നു മാത്രം നൽകി
  alternative: ‘ആദ്യത്തെ ദൂതൻ’
  rationale: സന്ദർഭം ദൂതനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ഗ്രീക്ക് വാക്യം നാമം ആവർത്തിക്കുന്നില്ല. അതിനാൽ സൂചിത നാമം വിശദീകരണമെന്ന നിലയിൽ പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ വെളിപ്പാടിന്റെ ഗൗരവത്തിനു യോജിച്ച മലയാളം. ഗ്രീക്ക് വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ സ്വാഭാവിക മലയാള ആഖ്യാനക്രമം ഉപയോഗിച്ചു. എല്ലാ പാദക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
