id: REV.16.10
reference: Revelation 16:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: ml
  text: അഞ്ചാമൻ തന്റെ പാത്രം മൃഗത്തിന്റെ സിംഹാസനത്തിന്മേൽ ഒഴിച്ചു. അപ്പോൾ അതിന്റെ രാജ്യം ഇരുണ്ടുപോയി[a]; വേദന നിമിത്തം അവർ തങ്ങളുടെ നാവുകൾ കടിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അന്ധകാരത്തിലായി.”'
    reason: ἐσκοτωμένη എന്ന പദത്തിന്റെ ഫലാവസ്ഥയെ കൂടുതൽ ഔപചാരികമായി പ്രകടിപ്പിക്കുന്ന വിവർത്തനവികൽപം.
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: അഞ്ചാമൻ
  rationale: ഗ്രീക്കിൽ ആർട്ടിക്കിളോടുകൂടിയ ക്രമസംഖ്യ മാത്രമാണ്; സന്ദർഭത്തിൽ ദൂതൻ സൂചിതമാണെങ്കിലും മൂലവാക്യത്തിൽ ഇല്ലാത്തതിനാൽ പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: തന്റെ പാത്രം ... ഒഴിച്ചു
  rationale: പാത്രവിധികളുടെ ആവർത്തിത പ്രയോഗത്തിന് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളം; φιάλη എന്നത് വിശാലമായ പാത്രത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: മൃഗത്തിന്റെ സിംഹാസനത്തിന്മേൽ
  rationale: ἐπίയും accusative-ഉം ഇവിടെ ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു; വെളിപ്പാടിലെ θηρίον എന്ന പ്രതീകത്തിന് സ്ഥിരവും സ്വാഭാവികവുമായ പദം ‘മൃഗം’ ആണ്.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: അതിന്റെ രാജ്യം
  rationale: αὐτοῦയുടെ മുൻപദം മൃഗമാണ്; മലയാളത്തിൽ ‘അതിന്റെ’ എന്നു നൽകുന്നത് അനാവശ്യമായ വ്യക്തിവൽക്കരണം ഒഴിവാക്കി ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐγένετο ... ἐσκοτωμένη
  choice: ഇരുണ്ടുപോയി
  rationale: അന്ധകാരാവസ്ഥയിലേക്കുള്ള പ്രവേശനവും അതിന്റെ ഫലാവസ്ഥയും സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐμασῶντο τὰς γλώσσας αὐτῶν
  choice: അവർ തങ്ങളുടെ നാവുകൾ കടിച്ചുകൊണ്ടിരുന്നു
  rationale: imperfect രൂപത്തിലെ തുടർച്ചയായ പ്രവൃത്തിയെ ‘കൊണ്ടിരുന്നു’ സംരക്ഷിക്കുന്നു; μασάομαιയുടെ വേദനാപ്രേരിതമായ കടിക്കൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκ τοῦ πόνου
  choice: വേദന നിമിത്തം
  rationale: ἐκ ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു; ‘നിമിത്തം’ dignified ആയതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പ്രയോഗമാണ്.
theological_decisions:
- issue: മൃഗത്തോടു ബന്ധമുള്ള സർവനാമവും രാജ്യത്തിന്റെ ഉടമസ്ഥതയും
  choice: അതിന്റെ രാജ്യം
  alternative: അവന്റെ രാജ്യം
  rationale: ഗ്രീക്കിലെ θηρίον നപുംസകലിംഗമാണ്. പ്രതീകത്തെ വ്യക്തിവൽക്കരിക്കാതെ മൂലപാഠത്തിന്റെ രൂപസൂചനയോട് ചേർന്ന് നിൽക്കാൻ ‘അതിന്റെ’ തിരഞ്ഞെടുത്തു.
- issue: അന്ധകാരവിധിയുടെ ഭാഷാതീവ്രത
  choice: ഇരുണ്ടുപോയി
  alternative: അന്ധകാരത്തിൽ മുങ്ങിപ്പോയി
  rationale: മൂലത്തിലെ passive participle ഇരുണ്ട അവസ്ഥ വന്നതിനെ പറയുന്നു; ‘മുങ്ങിപ്പോയി’ എന്ന അധിക രൂപകം ചേർക്കാതെ വിധിയുടെ ഫലം നേരിട്ട് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിൽ ഇല്ലാത്ത ‘ദൂതൻ’ ചേർത്തിട്ടില്ല. തുടർച്ചയായ വേദനാപ്രതികരണം imperfect ക്രിയാരൂപത്തിന് അനുസരിച്ച് ‘കടിച്ചുകൊണ്ടിരുന്നു’ എന്നു നൽകിയിരിക്കുന്നു.
