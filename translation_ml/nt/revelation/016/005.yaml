    rationale: The supplied lexical decision explicitly indicates that the ‘over the waters’ sense is preserved in a footnote, but the translation contains no such footnote or anchor. Adding it makes the audit trail and rendered footnotes consistent.
  - severity: low
    issue: Awkward rendering of the divine title sequence
    rationale: “പരിശുദ്ധനുമായവനേ” can sound like an ordinary conjoined adjective and is less natural after the preceding relative-title phrase. “പരിശുദ്ധനായവനുമായ അങ്ങ്” preserves ὁ ὅσιος as a title while reading naturally.
