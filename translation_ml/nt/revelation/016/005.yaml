source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: ml
  text: 'ജലങ്ങളുടെ ദൂതൻ പറയുന്നതു ഞാൻ കേട്ടു[a][c]: “ഉള്ളവനും ഉണ്ടായിരുന്നവനും, പരിശുദ്ധനായവനുമായ അങ്ങ് നീതിമാനാണ്[b], കാരണം അങ്ങ് ഇവ ന്യായംവിധിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ, ‘ഉള്ളവനും ഉണ്ടായിരുന്നവനും വരാനിരിക്കുന്നവനും’ എന്ന ദീർഘമായ നാമരൂപം കാണുന്നു; വെളിപ്പാടിലെ സമാന പ്രയോഗങ്ങളോട് ഒത്തുചേർത്തതാകാം അത്. ഇവിടെ സ്വീകരിച്ച പാഠം: ‘ഉള്ളവനും ഉണ്ടായിരുന്നവനും, പരിശുദ്ധനായവൻ.’'
    reason: textual_variant
  - marker: b
    text: 'അഥവാ: ‘അങ്ങ് ന്യായവാനാണ്.’'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: ‘ജലങ്ങളുടെ മേലുള്ള ദൂതൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: ജലങ്ങളുടെ ദൂതൻ
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവ്യാകരണഘടന നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ജലങ്ങളുമായി ബന്ധപ്പെട്ടതോ അവയുടെ മേൽ ചുമതലയുള്ളതോ ആയ ദൂതനെ സൂചിപ്പിക്കാം; ആ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Δίκαιος
  choice: നീതിമാൻ
  rationale: ദൈവത്തിന്റെ വിധിയിലെ ധാർമിക നീതിയും ന്യായവും സൂചിപ്പിക്കുന്നു. ആരാധനാത്മക അഭിസംബോധനയിൽ ‘നീതിമാൻ’ സ്വാഭാവികമാണ്; ‘ന്യായവാൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: ഇപ്പോഴുള്ളവനും മുമ്പുണ്ടായിരുന്നവനും
  rationale: വെളിപ്പാടിലെ സവിശേഷ ദൈവികനാമസൂത്രത്തിന്റെ വർത്തമാന-ഭൂതകാല ഘടന വ്യക്തമായി നിലനിർത്തുന്നു. ഗ്രീക്കിൽ ഭാവികാലഘടകം ഇല്ലാത്തത് വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ὁ ὅσιος
  choice: പരിശുദ്ധനുമായവനേ
  rationale: ὅσιος സൂചിപ്പിക്കുന്ന ധാർമികവും ഉടമ്പടിസംബന്ധവുമായ വിശുദ്ധി, ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ സ്വാഭാവികമായ ‘പരിശുദ്ധൻ’ എന്ന പദത്തിലൂടെ നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ദൈവം നീതിമാനാണെന്ന പ്രഖ്യാപനത്തിനുള്ള കാരണം പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് ബന്ധകത്തിന്റെ കാരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ταῦτα
  choice: ഇവയെ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ പൊതുവായ സൂചകസർവനാമം നിലനിർത്തുന്നു; ‘ഈ ന്യായവിധികൾ’ എന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: ἔκρινας
  choice: ന്യായംവിധിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി പ്രകടമാക്കുന്ന വിധത്തിൽ ഗ്രീക്ക് aorist-നെ മലയാളത്തിലെ പൂർണ്ണക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവികാലഘടകം ഇല്ലാത്ത ദൈവികനാമം
  choice: ഇപ്പോഴുള്ളവനും മുമ്പുണ്ടായിരുന്നവനും പരിശുദ്ധനുമായവനേ
  alternative: ഇപ്പോഴുള്ളവനും മുമ്പുണ്ടായിരുന്നവനും വരാനിരിക്കുന്നവനും ആയവനേ
  rationale: SBLGNT പാഠം ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος എന്നാണ് വായിക്കുന്നത്; വെളിപ്പാടിലെ മറ്റു ഭാഗങ്ങളിലെ ദീർഘസൂത്രവുമായി ഒത്തുചേർക്കാതെ അച്ചടിച്ച ഗ്രീക്ക് പാഠം പിന്തുടരുന്നു. പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: ὁ ὅσιος എന്നതിന്റെ വാക്യഘടനാപരമായ ബന്ധം
  choice: 'മുൻപുള്ള ദൈവികനാമത്തോടു ചേർന്ന അഭിസംബോധന: ‘പരിശുദ്ധനുമായവനേ’'
  alternative: 'വേറിട്ട നാമപദവി: ‘പരിശുദ്ധനായവനേ’'
  rationale: ഗ്രീക്കിലെ ആർട്ടിക്കിളോടുകൂടിയ വിശേഷണം ദൈവത്തെ സൂചിപ്പിക്കുന്ന നാമപദവിയാണ്. മലയാളത്തിൽ തുടർച്ചയായ അഭിസംബോധനയായി നൽകുന്നത് അർത്ഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പാഠത്തിലെ പ്രത്യേക നാമപദവി ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ദൈവത്തോടുള്ള ആദരസൂചക അഭിസംബോധനയ്ക്കായി ‘അങ്ങ്’ സ്വീകരിച്ചു. ഗ്രീക്കിലെ പദക്രമം യാന്ത്രികമായി പകർത്താതെ, പ്രഖ്യാപനത്തിന്റെ ഊന്നലും ദൈവികനാമത്തിലെ അസാധാരണമായ കാലഘടനയും സംരക്ഷിച്ചു.
