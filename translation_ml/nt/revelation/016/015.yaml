id: REV.16.15
reference: Revelation 16:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: ml
  text: “ഇതാ, ഞാൻ കള്ളനെപ്പോലെ വരുന്നു. ഉണർന്നിരിക്കുകയും തന്റെ വസ്ത്രങ്ങൾ കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നവൻ അനുഗൃഹീതൻ; അവൻ നഗ്നനായി നടക്കാതിരിക്കാനും ആളുകൾ അവന്റെ ലജ്ജ കാണാതിരിക്കാനും വേണ്ടി—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഉദ്‌ഘോഷത്തിന്റെ ഗൗരവവും വെളിപ്പാട് സാഹിത്യത്തിന്റെ ഉയർന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔρχομαι
  choice: ഞാൻ ... വരുന്നു
  rationale: വർത്തമാനകാലരൂപത്തിന്റെ സജീവതയും ആസന്നമായ ഭാവിസൂചനയും നിലനിർത്തുന്നു.
- source_word: ὡς κλέπτης
  choice: കള്ളനെപ്പോലെ
  rationale: അപ്രതീക്ഷിതമായ വരവിനെ സൂചിപ്പിക്കുന്ന ഉപമ കൃത്യമായി നൽകുന്നു; കള്ളന്റെ ധാർമിക സ്വഭാവം പ്രസ്താവകനിലേക്ക് മാറ്റുന്നില്ല.
- source_word: μακάριος
  choice: അനുഗൃഹീതൻ
  rationale: സാധാരണ മാനസിക സന്തോഷത്തേക്കാൾ അനുഗ്രഹവചനത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം വഹിക്കുന്നു.
- source_word: ὁ γρηγορῶν
  choice: ഉണർന്നിരിക്കുന്നവൻ
  rationale: ശാരീരിക ഉണർവും രൂപകാത്മക ജാഗ്രതയും ഒരുപോലെ തുറന്നുവയ്ക്കുന്നു.
- source_word: τηρῶν
  choice: കാത്തുസൂക്ഷിക്കുന്ന
  rationale: τηρέω എന്നതിലെ കൈവശം നിലനിർത്തുക, കാക്കുക എന്നീ അർഥവ്യാപ്തി വസ്ത്രങ്ങളുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: തന്റെ വസ്ത്രങ്ങൾ
  rationale: വെളിപ്പാടിലെ സാധ്യതയുള്ള പ്രതീകാത്മക അനുരണനം നിലനിർത്തിക്കൊണ്ട് ഉയർന്നതും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പ്രയോഗമാണ്.
- source_word: ἵνα μὴ
  choice: അങ്ങനെ ... ചെയ്യാതിരിക്കട്ടെ
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മക ഉദ്ദേശ്യഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γυμνὸς περιπατῇ
  choice: അവൻ നഗ്നനായി നടക്കുക
  rationale: നടക്കുന്നതിന്റെ മൂർത്തമായ ദൃശ്യവും നഗ്നതയുടെ അപമാനസാധ്യതയും നിലനിർത്തുന്നു.
- source_word: βλέπωσιν
  choice: ആളുകൾ ... കാണുക
  rationale: ഗ്രീക്കിലെ നിർദ്ദിഷ്ടമല്ലാത്ത മൂന്നാംപുരുഷ ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ അനിശ്ചിത മനുഷ്യകർത്താവായി നൽകുന്നു.
- source_word: ἀσχημοσύνην αὐτοῦ
  choice: അവന്റെ ലജ്ജാകരമായ നഗ്നത
  rationale: പദം സൂചിപ്പിക്കുന്ന അപമാനകരമായ ശരീരാവിഷ്കാരം വ്യക്തമാക്കുന്നു; വെറും സാമൂഹിക ലജ്ജയായി ദുർബലപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: വസ്ത്രം, നഗ്നത എന്നിവയുടെ അന്ത്യകാലപ്രതീകാത്മകത
  choice: പ്രധാനപാഠത്തിൽ മൂർത്തമായ ദൃശ്യഭാഷ അതേപടി നിലനിർത്തി.
  alternative: വസ്ത്രങ്ങളെ നീതിപ്രവൃത്തികളായോ ആത്മീയ സന്നദ്ധതയായോ, നഗ്നതയെ അന്ത്യകാല അപമാനമായോ നേരിട്ട് വ്യാഖ്യാനിക്കുക.
  rationale: സന്ദർഭത്തിൽ പ്രതീകാത്മക അനുരണനം ഉണ്ടായാലും ഗ്രീക്ക് വാക്യം തന്നെ അതിന്റെ കൃത്യമായ വ്യാഖ്യാനം പ്രസ്താവിക്കുന്നില്ല; അതിനാൽ അർഥസംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
- issue: ഏകവചന പുല്ലിംഗ പ്രതിനിധാനം
  choice: ‘ചെയ്യുന്നവൻ’, ‘അവൻ’, ‘തന്റെ’ എന്നീ ഏകവചന പുല്ലിംഗരൂപങ്ങൾ നിലനിർത്തി.
  alternative: ബഹുവചനത്തിലേക്കോ ലിംഗനിരപേക്ഷ പുനർഘടനയിലേക്കോ മാറ്റുക.
  rationale: ഗ്രീക്കിലെ വിശേഷണക്രിയാരൂപം വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനവും പ്രതിനിധാനപരവുമാണ്; മലയാളത്തിലും അതിനോടടുത്ത രൂപം സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള വെളിപ്പാട്-ശൈലി. വാക്യത്തിന്റെ അവസാനം SBLGNT-യിലെ ദീർഘവിരാമ സ്വഭാവം സൂചിപ്പിക്കാൻ em dash നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാളിയിലെ അടിക്കുറിപ്പ്-മാർക്കറുകൾ ഉള്ളടക്കവുമായി പൊരുത്തക്കേടുള്ളതായി തോന്നുന്നതിനാൽ, മൂലഗ്രീക്കിൽ യഥാർത്ഥ പാഠവ്യത്യാസമോ നിർബന്ധമായ വിശദീകരണമോ ഇല്ലാത്ത ഈ ഏകവാക്യ കരടിൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
