revisions:
- from: “ഇതാ, ഞാൻ കള്ളനെപ്പോലെ വരുന്നു. ഉണർന്നിരിക്കുകയും തന്റെ വസ്ത്രങ്ങൾ കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നവൻ അനുഗൃഹീതൻ; അങ്ങനെ അവൻ നഗ്നനായി നടക്കുകയും ആളുകൾ അവന്റെ ലജ്ജാകരമായ നഗ്നത കാണുകയും ചെയ്യാതിരിക്കട്ടെ—”
  to: “ഇതാ, ഞാൻ കള്ളനെപ്പോലെ വരുന്നു. ഉണർന്നിരിക്കുകയും തന്റെ വസ്ത്രങ്ങൾ കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നവൻ അനുഗൃഹീതൻ; അവൻ നഗ്നനായി നടക്കാതിരിക്കാനും ആളുകൾ അവന്റെ ലജ്ജ കാണാതിരിക്കാനും വേണ്ടി—”
  rationale: 'The revision removes the redundant interpretive phrase “ലജ്ജാകരമായ നഗ്നത” in favor of “ലജ്ജ,” which preserves the semantic range of ἀσχημοσύνη and its connection with shameful exposure. It also recasts the final clause as an explicit purpose construction corresponding to ἵνα μή. No footnote is necessary: the source’s ambiguity is retained in the main text, and no textual variant is presented.'
  reviewer_model: gpt-5.6-terra
