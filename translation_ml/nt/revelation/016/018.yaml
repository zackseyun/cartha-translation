id: REV.16.18
reference: Revelation 16:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: ml
  text: മിന്നൽപ്പിണരുകളും ശബ്ദങ്ങളും[a] ഇടിമുഴക്കങ്ങളും ഉണ്ടായി; വലിയൊരു ഭൂകമ്പവും ഉണ്ടായി. ഭൂമിയിൽ മനുഷ്യർ ഉണ്ടായതുമുതൽ അത്തരമൊരു ഭൂകമ്പം ഉണ്ടായിട്ടില്ല—അത്ര വലിയതായിരുന്നു ആ ഭൂകമ്പം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വരങ്ങളും.”
    reason: φωνή എന്ന പദത്തിന് ‘ശബ്ദം’ എന്നും ‘സ്വരം’ എന്നും അർഥമാകാം; സന്ദർഭം ഏത് അർഥമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് പൂർണമായി നിർണയിക്കുന്നില്ല.
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: മിന്നൽപ്പിണരുകൾ
  rationale: ബഹുവചനത്തിന്റെ ആവർത്തിതമായ മിന്നൽപ്രഭകൾ എന്ന ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: φωναὶ
  choice: ശബ്ദങ്ങൾ
  rationale: ഈ മിന്നൽ-ഇടി പരമ്പരയിൽ വ്യക്തികളുടെ സംസാരമെന്ന് അനാവശ്യമായി നിർണയിക്കാതെ കേൾവിസംബന്ധമായ പ്രതിഭാസത്തെ സൂചിപ്പിക്കുന്നു; ‘സ്വരങ്ങൾ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: βρονταί
  choice: ഇടിമുഴക്കങ്ങൾ
  rationale: ബഹുവചനവും ആവർത്തിച്ചുണ്ടാകുന്ന ശക്തമായ ഇടിനാദവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σεισμὸς μέγας
  choice: വലിയൊരു ഭൂകമ്പം
  rationale: സന്ദർഭത്തിൽ σεισμός എന്നതിന്റെ പതിവായ അർഥവും μέγας സൂചിപ്പിക്കുന്ന അസാധാരണ വലുപ്പവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀφ’ οὗ ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ മനുഷ്യർ ഉണ്ടായതുമുതൽ
  rationale: കാലസൂചനയായ ‘മുതൽ’ നിലനിർത്തുകയും ἄνθρωποι മനുഷ്യരാശിയെ പൊതുവായി സൂചിപ്പിക്കുന്നതും ἐγένοντοയുടെ ‘ഉണ്ടാകുക’ എന്ന ഭാവവും പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τηλικοῦτος σεισμὸς οὕτω μέγας
  choice: അത്ര വലിയതായിരുന്നു ആ ഭൂകമ്പം
  rationale: മൂലത്തിലെ ആവർത്തനപരമായ തീവ്രതയും ഭൂകമ്പത്തിന്റെ സമാനതയില്ലാത്ത വലുപ്പവും സംക്ഷിപ്തവും ഊന്നലുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀφ’ οὗ ἄνθρωποι ἐγένοντο എന്നതിലെ ἄνθρωποι മനുഷ്യരാശിയെ പൊതുവായി സൂചിപ്പിക്കുന്നത്
  choice: മനുഷ്യർ ഉണ്ടായതുമുതൽ
  alternative: മനുഷ്യർ ഭൂമിയിൽ വന്നതുമുതൽ
  rationale: ഇവിടെ പരാമർശം പുരുഷന്മാരെ മാത്രം കുറിച്ചല്ല, ഭൂമിയിലെ മനുഷ്യരുടെ അസ്തിത്വത്തെ പൊതുവായി കുറിച്ചാണ്. ‘ഉണ്ടായതുമുതൽ’ ἐγένοντοയുടെ രൂപവും ചരിത്രപരമായ താരതമ്യവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ അപോകലിപ്റ്റിക് ശൈലി. മൂലത്തിലെ സംഭവപരമ്പര സെമിക്കോളൻകൊണ്ട് വ്യക്തമായി നിലനിർത്തുകയും അവസാനത്തെ ആവർത്തന ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്തു.
