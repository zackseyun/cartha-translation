id: REV.16.11
reference: Revelation 16:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ വേദനകളും വ്രണങ്ങളും നിമിത്തം സ്വർഗത്തിന്റെ ദൈവത്തെ ദുഷിച്ചു[a]; തങ്ങളുടെ പ്രവൃത്തികളിൽനിന്ന് അവർ മാനസാന്തരപ്പെട്ടതുമില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്വർഗത്തിന്റെ ദൈവത്തെ നിന്ദിച്ചു” അല്ലെങ്കിൽ “അവനെക്കുറിച്ച് ദോഷമായി സംസാരിച്ചു.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “തങ്ങളുടെ പ്രവൃത്തികളിൽനിന്ന് മാനസാന്തരപ്പെട്ടില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: ദുഷിച്ചു
  rationale: ദൈവത്തിനെതിരെ അപകീർത്തികരമായോ ഭക്തിഹീനമായോ സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന βλασφημέωയുടെ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ ‘ദുഷിച്ചു’ വ്യക്തമാക്കുന്നു.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിന്റെ ദൈവത്തെ
  rationale: ഗ്രീക്കിലെ ബഹുമാനഗൗരവമുള്ള ദൈവനാമം അതിന്റെ ബന്ധസൂചക ഘടനയോടെ നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: തങ്ങളുടെ വേദനകൾ നിമിത്തം
  rationale: ഇവിടെ ἐκ കാരണത്തെ സൂചിപ്പിക്കുന്നു; πόνοι കഠിനമായ വേദനകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἑλκῶν
  choice: വ്രണങ്ങൾ
  rationale: ἕλκος എന്നത് വ്രണമോ പുണ്ണോ ആകാം; ‘വ്രണങ്ങൾ’ വൈദ്യപരമായി അതിരുകടന്ന് നിർവചിക്കാതെ ബാധയുടെ സന്ദർഭത്തിന് ചേരുന്നു.
- source_word: μετενόησαν
  choice: മാനസാന്തരപ്പെട്ടില്ല
  rationale: വെറും അഭിപ്രായമാറ്റമല്ല, ധാർമികവും ദൈവബന്ധപരവുമായ പശ്ചാത്താപവും തിരിഞ്ഞുവരവും μετανοέω ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: തങ്ങളുടെ പ്രവൃത്തികളിൽനിന്ന്
  rationale: അവരുടെ മുൻപ്രവൃത്തികളിൽനിന്ന് തിരിയുക എന്ന ἐκയുടെ വേർപാട്/പിന്മാറ്റ അർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആവർത്തിക്കുന്ന ἐκ പ്രയോഗങ്ങളുടെ അർഥം
  choice: വേദനകളും വ്രണങ്ങളും നിമിത്തം അവർ ദൈവത്തെ ദുഷിച്ചു; പ്രവൃത്തികളിൽനിന്ന് അവർ മാനസാന്തരപ്പെട്ടില്ല.
  alternative: വേദനകളിൽനിന്നും വ്രണങ്ങളിൽനിന്നും അവർ ദൈവത്തെ ദുഷിച്ചു എന്ന കൂടുതൽ പദാനുപദമായ രൂപം.
  rationale: ആദ്യ രണ്ടു പ്രയോഗങ്ങളിൽ ἐκ സന്ദർഭാനുസൃതമായി കാരണം സൂചിപ്പിക്കുന്നു; μετανοέωയോടൊപ്പമുള്ള അവസാന പ്രയോഗത്തിൽ അത് പ്രവൃത്തികളിൽനിന്നുള്ള തിരിഞ്ഞുപോക്കിനെ സൂചിപ്പിക്കുന്നു. ഇതിലൂടെ വിധിയോടുള്ള അവരുടെ പ്രതികരണം വ്യാഖ്യാനാതിക്രമമില്ലാതെ വ്യക്തമാകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള അപ്പോക്കലിപ്റ്റിക് ശൈലി. ‘നിമിത്തം’ കാരണബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിൽ അവസാന ἐκയുടെ ‘നിന്ന്’ ഘടന തന്നെ നിലനിൽക്കുന്നതിനാൽ അതിനെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് ചില അളവിൽ വിശദീകരണസ്വഭാവമുള്ളതാണ്.
