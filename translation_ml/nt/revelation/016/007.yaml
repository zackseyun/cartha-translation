source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: ml
  text: 'ഞാൻ യാഗപീഠം ഇങ്ങനെ പറയുന്നതു കേട്ടു[a]: “അതേ, കർത്താവേ, ദൈവമേ, സർവശക്തനേ, അങ്ങയുടെ ന്യായവിധികൾ സത്യവും നീതിയുക്തവുമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യാഗപീഠത്തിൽനിന്ന് ഇങ്ങനെ പറയുന്നതു ഞാൻ കേട്ടു.” ഗ്രീക്ക് വ്യാകരണം യോഹന്നാൻ കേട്ടതിന്റെ ഉറവിടം സൂചിപ്പിക്കാവുന്നതാണ്; എങ്കിലും യാഗപീഠംതന്നെ സംസാരിക്കുന്നതായി വ്യക്തിവൽക്കരിക്കുന്നതാണ് ഈ വാക്യത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ വായന.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: ഞാൻ കേട്ടു
  rationale: ἀκούω എന്ന ക്രിയയുടെ aorist രൂപം കഴിഞ്ഞകാലത്തിലെ ലളിതമായ ഒരു കേൾവി സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ഉദ്ദേശപൂർവം ശ്രദ്ധിച്ചുകേട്ടു എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: യാഗപീഠം ഇങ്ങനെ പറയുന്നതു
  rationale: ἤκουσα എന്നതിനോടൊപ്പമുള്ള genitive കേട്ടതിന്റെ ഉറവിടം സൂചിപ്പിക്കാമെങ്കിലും, λέγοντος കാരണം യാഗപീഠത്തെത്തന്നെ സംസാരിക്കുന്നതായി അവതരിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം. ഇത് വെളിപാടിലെ സജീവമായ വ്യക്തിവൽക്കരണം നിലനിർത്തുകയും ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ശബ്ദം’ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: Ναί
  choice: അതേ
  rationale: ശക്തമായ സമ്മതവും പ്രതികരണഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: κύριε, ὁ θεός
  choice: കർത്താവായ ദൈവമേ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയിൽ κύριος എന്നതിന് ‘കർത്താവ്’ നിലനിർത്തുകയും, പിന്നാലെയുള്ള ὁ θεός അതോടു ചേർന്ന ദൈവിക അഭിസംബോധനയായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ὁ παντοκράτωρ
  choice: സർവശക്തനായ
  rationale: παντοκράτωρ സൂചിപ്പിക്കുന്ന സമഗ്ര അധികാരവും ശക്തിയും വെളിപാടിലെ പതിവായ ദൈവിക വിശേഷണമായി വ്യക്തമായി നൽകുന്നു.
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: സത്യവും നീതിയുമുള്ളവ
  rationale: κρίσεις എന്നതിനോടുള്ള predicate adjectives ആയി വിശ്വാസ്യത/യാഥാർഥ്യം, നീതിപൂർവത എന്നീ രണ്ടർഥങ്ങളും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: αἱ κρίσεις σου
  choice: അങ്ങയുടെ ന്യായവിധികൾ
  rationale: κρίσεις എന്നതിന്റെ ന്യായാധിപത്യപരമായ അർഥം നിലനിർത്തുന്നു; ദൈവത്തോടുള്ള നേരിട്ടുള്ള ആദരപൂർവ അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: യാഗപീഠത്തെ സംസാരിക്കുന്നതായി വ്യക്തിവൽക്കരിക്കൽ
  choice: ‘യാഗപീഠം ഇങ്ങനെ പറയുന്നതു ഞാൻ കേട്ടു’
  alternative: ‘യാഗപീഠത്തിൽനിന്ന് ഇങ്ങനെ പറയുന്നതു ഞാൻ കേട്ടു’ അഥവാ ‘യാഗപീഠത്തിൽനിന്ന് ഒരു ശബ്ദം പറയുന്നതു ഞാൻ കേട്ടു’
  rationale: ഗ്രീക്ക് പാഠം യാഗപീഠത്തെ genitive രൂപത്തിലും ‘പറയുന്ന’ എന്ന participle-നോടും അവതരിപ്പിക്കുന്നു. അതിനാൽ വ്യക്തിവൽക്കരണം നിലനിർത്തുന്നത് അപോകലിപ്റ്റിക് ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു; ‘ശബ്ദം’ ചേർക്കുന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്ത ഘടകം കൂട്ടിച്ചേർക്കും. എങ്കിലും genitive ഉറവിടമായി മനസ്സിലാക്കാവുന്ന യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ദൈവിക പദവികളുടെ നേരിട്ടുള്ള അഭിസംബോധന
  choice: ‘സർവശക്തനായ കർത്താവായ ദൈവമേ’
  alternative: ‘കർത്താവേ, സർവശക്തനായ ദൈവമേ’ അഥവാ ‘കർത്താവായ സർവശക്തനായ ദൈവമേ’
  rationale: κύριε, ὁ θεός, ὁ παντοκράτωρ എന്നീ മൂന്നു ഘടകങ്ങളും ഒഴിവാക്കാതെ, മലയാളത്തിലെ സ്വാഭാവിക അഭിസംബോധനാക്രമത്തിൽ നൽകുന്നു. പ്രത്യേക മതവിഭാഗീയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യാഗപീഠം’, ‘കർത്താവ്’, ‘സർവശക്തൻ’, ‘ന്യായവിധി’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയിരിക്കുമ്പോഴും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
