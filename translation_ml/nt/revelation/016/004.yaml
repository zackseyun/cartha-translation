- from: മൂന്നാമൻ തന്റെ പാത്രം നദികളിലേക്കും ജലസ്രോതസ്സുകളിലേക്കും ഒഴിച്ചു; അത് രക്തമായിത്തീർന്നു.[a]
  to: മൂന്നാമൻ തന്റെ പാത്രം നദികളിലേക്കും ജലത്തിന്റെ ഉറവുകളിലേക്കും ഒഴിച്ചു; അവയിലെ വെള്ളം രക്തമായിത്തീർന്നു.[a]
