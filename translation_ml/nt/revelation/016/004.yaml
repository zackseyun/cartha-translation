id: REV.16.4
reference: Revelation 16:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: ml
  text: മൂന്നാമൻ തന്റെ പാത്രം നദികളിലേക്കും ജലത്തിന്റെ ഉറവുകളിലേക്കും ഒഴിച്ചു; അവയിലെ വെള്ളം രക്തമായിത്തീർന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവ രക്തമായിത്തീർന്നു.” ഗ്രീക്കിൽ ക്രിയ ഏകവചനത്തിലാണെങ്കിലും, നദികളിലെയും ഉറവുകളിലെയും വെള്ളത്തെ ഒരു സമാഹാരമായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം; ബഹുവചനത്തിലുള്ള പരിഭാഷയും സാധ്യമാണ്.
    reason: വ്യാകരണപരമായ അവ്യക്തതയും പരിഭാഷാവികൽപവും
lexical_decisions:
- source_word: ὁ τρίτος
  choice: മൂന്നാമൻ
  rationale: ഗ്രീക്കിൽ ‘ദൂതൻ’ എന്ന നാമം ആവർത്തിക്കാതെ നിർദിഷ്ടമായ ക്രമസംഖ്യ മാത്രമാണ് ഉള്ളത്. മുൻസന്ദർഭത്തിൽ ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമായതിനാൽ മലയാളത്തിലും ആ ലോപം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐξέχεεν
  choice: ഒഴിച്ചു
  rationale: പാത്രത്തിലെ ഉള്ളടക്കം പുറത്തേക്ക് പകരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളപ്രയോഗം.
- source_word: φιάλην
  choice: പാത്രം
  rationale: φιάλη ഒരു വീതിയുള്ള, ആഴം കുറഞ്ഞ പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കുപ്പി’ എന്ന പഴയ പരിഭാഷാഭാവം ഒഴിവാക്കി പൊതുവായും കൃത്യമായും ഗ്രഹിക്കാവുന്ന പദം തിരഞ്ഞെടുത്തു.
- source_word: εἰς τοὺς ποταμοὺς
  choice: നദികളിലേക്ക്
  rationale: εἰς എന്നതിലെ ദിശ/ചലനഭാവം ‘-ലേക്ക്’ വ്യക്തമായി നൽകുന്നു.
- source_word: τὰς πηγὰς τῶν ὑδάτων
  choice: ജലസ്രോതസ്സുകളിലേക്ക്
  rationale: πηγή എന്നത് ഉറവിനെയോ ജലത്തിന്റെ ഉത്ഭവസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം. ‘ജലസ്രോതസ്സുകൾ’ ഈ വിശാല അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἐγένετο αἷμα
  choice: അത് രക്തമായിത്തീർന്നു
  rationale: ഗ്രീക്കിലെ ഏകവചന ക്രിയ നിലനിർത്തി, മുമ്പ് പറഞ്ഞ ജലത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്ന ഫലവാക്യമായി പരിഭാഷപ്പെടുത്തി. γίνομαι സൂചിപ്പിക്കുന്ന രൂപാന്തരഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐγένετο എന്ന ഏകവചന ക്രിയയുടെ സൂചിത കർത്താവ്
  choice: ജലത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്ന ‘അത്’
  alternative: നദികളും ജലസ്രോതസ്സുകളും സൂചിപ്പിക്കുന്ന ‘അവ രക്തമായിത്തീർന്നു’
  rationale: ഗ്രീക്കിൽ കർത്താവ് പ്രത്യക്ഷമായി നൽകിയിട്ടില്ല; ക്രിയ ഏകവചനത്തിലാണ്. അതിനാൽ നദികളെയും ഉറവുകളെയും ബഹുവചനമായി തുറന്നുപറയാതെ, അവയിലെ ജലത്തെ സമാഹാരമായി സൂചിപ്പിക്കുന്ന ഏകവചന രൂപം നിലനിർത്തുന്നു. വ്യാകരണപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന ‘ദൂതൻ’ എന്ന പദം ചേർക്കാതെ മൂലത്തിലെ ലോപം നിലനിർത്തി; പഴഞ്ചൻ പദാവലികൾ ഒഴിവാക്കി.
