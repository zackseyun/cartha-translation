id: REV.16.12
reference: Revelation 16:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: ml
  text: ആറാമൻ തന്റെ കിണ്ണം മഹാനദിയായ യൂഫ്രട്ടീസിന്മേൽ ഒഴിച്ചു. സൂര്യൻ ഉദിക്കുന്ന ദിക്കിൽനിന്നുള്ള രാജാക്കന്മാരുടെ വഴി ഒരുക്കപ്പെടേണ്ടതിന് അതിലെ വെള്ളം വറ്റിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ലളിതമായി: ‘കിഴക്കുനിന്നുള്ള.’ അക്ഷരാർഥം: ‘സൂര്യന്റെ ഉദയത്തിൽനിന്നുള്ള.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: ആറാമൻ
  rationale: ഗ്രീക്കിൽ നാമപദം ചേർക്കാതെ നിർദേശകപദത്തോടുകൂടിയ ക്രമസംഖ്യ മാത്രമാണുള്ളത്. സന്ദർഭത്തിൽ പാത്രം വഹിക്കുന്ന ആറാമത്തെ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൂതൻ’ എന്നു കൂട്ടിച്ചേർക്കാതെ മൂലത്തിലെ ലോപം നിലനിർത്തുന്നു.
- source_word: ἐξέχεεν
  choice: ഒഴിച്ചു
  rationale: ἐκχέω എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം; പാത്രത്തിലെ ഉള്ളടക്കം ചൊരിയുന്ന ന്യായവിധിദൃശ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: φιάλην
  choice: പാത്രം
  rationale: φιάλη വീതിയുള്ള ആഴംകുറഞ്ഞ പാത്രത്തെ സൂചിപ്പിക്കുന്നു. ‘പാത്രം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കുപ്പി എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നതുമാണ്.
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: മഹാനദിയായ യൂഫ്രട്ടീസിന്മേൽ
  rationale: നദിയുടെ പേരിനെ വിശദീകരിക്കുന്ന ഗ്രീക്ക് സമാനാധികരണഘടന സ്വാഭാവിക മലയാളത്തിൽ ‘മഹാനദിയായ’ എന്നു നൽകുന്നു; ἐπίയുടെ ലക്ഷ്യബന്ധം ‘-ന്മേൽ’കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: ἐξηράνθη
  choice: വറ്റിപ്പോയി
  rationale: അയോറിസ്റ്റ് പാസീവ് സംഭവവും അതിന്റെ ഫലാവസ്ഥയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വറ്റിപ്പോയി’ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു; പ്രവർത്തകനെ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: τὸ ὕδωρ αὐτοῦ
  choice: അതിലെ വെള്ളം
  rationale: സർവനാമം നദിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അതിലെ വെള്ളം’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἵνα ἑτοιμασθῇ
  choice: ഒരുക്കപ്പെടേണ്ടതിന്
  rationale: ἵναയോടുകൂടിയ പാസീവ് സബ്ജങ്ക്ടീവ് ലക്ഷ്യത്തെ പ്രകടമാക്കുന്നു. ഈ രൂപം ഉദ്ദേശ്യവും പാസീവ് ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἡ ὁδὸς
  choice: വഴി
  rationale: ὁδός എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും വ്യാപകവുമായ തുല്യപദം; അക്ഷരാർഥവും പ്രതീകാത്മക സാധ്യതയും മുൻകൂട്ടി ചുരുക്കുന്നില്ല.
- source_word: τῶν βασιλέων
  choice: രാജാക്കന്മാരുടെ
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് ഘടന നേരിട്ട് നിലനിർത്തുന്നു; ‘രാജാക്കന്മാർക്കുള്ള’ എന്ന വ്യാഖ്യാനപരമായ പുനർരചന ഒഴിവാക്കുന്നു.
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: സൂര്യോദയദിക്കിൽനിന്നുള്ള
  rationale: ‘സൂര്യന്റെ ഉദയത്തിൽനിന്ന്’ എന്ന ഗ്രീക്ക് ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് ആ രാജാക്കന്മാരുടെ കിഴക്കൻ ഉത്ഭവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ആറാമൻ’ ഒരു ദൂതനാണെന്ന് വാക്യത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘ദൂതൻ’ എന്നു ചേർക്കാതെ ‘ആറാമൻ’ എന്നു നിലനിർത്തി.
  alternative: ആറാമത്തെ ദൂതൻ
  rationale: സമീപസന്ദർഭം ഈ വ്യക്തിയെ ദൂതനായി തിരിച്ചറിയുന്നെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം നാമപദം ആവർത്തിക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ ലോപം സംരക്ഷിച്ചു.
- issue: യൂഫ്രട്ടീസ് വറ്റുന്നതും രാജാക്കന്മാരുടെ വരവും പ്രതീകാത്മകമായി വിശദീകരിക്കണമോ
  choice: ദൃശ്യം വ്യാഖ്യാനവികാസമില്ലാതെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ആക്രമണം, അന്തിമകാലസൈന്യസമാഹരണം തുടങ്ങിയ പ്രതീകവ്യാഖ്യാനങ്ങൾ പാഠത്തിൽ ചേർക്കുക
  rationale: ഈ വാക്യം ദൃശ്യത്തിന്റെ അന്തിമ പ്രതീകാർഥം വിശദീകരിക്കുന്നില്ല. അതിനാൽ അതിന്റെ അപോകലിപ്റ്റിക് സംഘർഷവും തുറന്ന അർഥസാധ്യതയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘യൂഫ്രട്ടീസ്’ എന്ന പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു. വാക്യത്തിലെ അപോകലിപ്റ്റിക് ദൃശ്യബിംബം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സൂക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തി.
