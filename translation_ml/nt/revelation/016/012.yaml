  to: ആറാമൻ തന്റെ കിണ്ണം മഹാനദിയായ യൂഫ്രട്ടീസിന്മേൽ ഒഴിച്ചു. സൂര്യൻ ഉദിക്കുന്ന ദിക്കിൽനിന്നുള്ള രാജാക്കന്മാരുടെ വഴി ഒരുക്കപ്പെടേണ്ടതിന് അതിലെ വെള്ളം വറ്റിപ്പോയി.[a]
  rationale: ‘പാത്രം’ എന്ന പൊതുപദത്തിനു പകരം φιάληയുടെ അർഥം കൂടുതൽ കൃത്യമായി നൽകുന്ന ‘കിണ്ണം’ ഉപയോഗിച്ചു. അവസാന വിശേഷണം ‘സൂര്യൻ ഉദിക്കുന്ന ദിക്കിൽനിന്നുള്ള’ എന്നു പരിഷ്കരിച്ച് ഗ്രീക്ക് ദൃശ്യബിംബവും സ്ഥലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ കൂടുതൽ നേരിട്ടു നിലനിർത്തി. മറ്റെല്ലാ ഘടകങ്ങളും മൂലപാഠത്തോടും ഇംഗ്ലീഷ് ഓഡിറ്റ് തീരുമാനങ്ങളോടും യോജിച്ചിരിക്കുന്നു.
