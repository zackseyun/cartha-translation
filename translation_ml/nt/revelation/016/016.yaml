source:
  edition: SBLGNT
  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: ml
  text: അവരെ എബ്രായഭാഷയിൽ ഹർമഗെദോൻ എന്നു വിളിക്കപ്പെടുന്ന സ്ഥലത്തേക്ക് കൂട്ടിച്ചേർത്തു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: ‘അവൻ/അത് അവരെ കൂട്ടിച്ചേർത്തു.’ ക്രിയ ഏകവചനമാണ്; കർത്താവ് ആരെന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല. 13–14 വാക്യങ്ങളിൽ രാജാക്കന്മാരെ കൂട്ടിച്ചേർക്കാൻ പുറപ്പെടുന്ന അശുദ്ധാത്മാക്കളെ മുൻനിർത്തി, ‘അവർ അവരെ കൂട്ടിച്ചേർത്തു’ എന്ന അർഥവും ചിലർ കാണുന്നു.'
    reason: alternative_reading
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘എബ്രായ അല്ലെങ്കിൽ അരമായ ഭാഷയിൽ.’ വെളിപ്പാടിൽ ‘എബ്രായഭാഷയിൽ’ എന്നത് എബ്രായവും അരമായയും കർശനമായി വേർതിരിക്കാതെ ഒരു സെമിറ്റിക് നാമരൂപത്തെ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: അവൻ ... കൂട്ടിച്ചേർത്തു
  rationale: ഗ്രീക്കിലെ ക്രിയ മൂന്നാംപുരുഷ ഏകവചനമാണ് (‘അവൻ/അത് കൂട്ടിച്ചേർത്തു’). അതിനാൽ മൂലരൂപം നേരിട്ട് നിലനിർത്തുന്നു; കർത്താവ് ആരെന്നത് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അതിനെ വ്യാഖ്യാനിച്ച് നിർണ്ണയിക്കുന്നില്ല.
- source_word: αὐτοὺς
  choice: അവരെ
  rationale: സന്ദർഭത്തിൽ കൂട്ടിച്ചേർക്കപ്പെടുന്ന രാജാക്കന്മാരെ സൂചിപ്പിക്കുന്ന കർമസ്ഥാന ബഹുവചന സർവനാമം.
- source_word: εἰς τὸν τόπον
  choice: സ്ഥലത്ത്
  rationale: ചലനത്തിന്റെ ലക്ഷ്യസ്ഥാനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന രൂപം; τόπος എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘സ്ഥലം’ നിലനിർത്തുന്നു.
- source_word: τὸν καλούμενον
  choice: വിളിക്കപ്പെടുന്ന
  rationale: സ്ഥലത്തെ വിശേഷിപ്പിക്കുന്ന വർത്തമാനകാല കർമണി പ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: Ἑβραϊστὶ
  choice: എബ്രായഭാഷയിൽ
  rationale: വെളിപ്പാടിലെ പതിവുപ്രയോഗം സുതാര്യമായി പരിഭാഷപ്പെടുത്തുന്നു; ഇത് എബ്രായയോ വിശാലമായ എബ്രായ-അരമായ ഭാഷാപാരമ്പര്യമോ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ἁρμαγεδών
  choice: അർമ്മഗെദോൻ
  rationale: ഗ്രീക്ക് നാമരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം; പേരിനെ അർഥവിവർത്തനം ചെയ്യുന്നില്ല.
theological_decisions:
- issue: കൂട്ടിച്ചേർക്കലിന്റെ കർത്താവ്
  choice: അവൻ അവരെ ... കൂട്ടിച്ചേർത്തു
  alternative: അവർ അവരെ ... കൂട്ടിച്ചേർത്തു / അത് അവരെ ... കൂട്ടിച്ചേർത്തു
  rationale: συνήγαγεν ഏകവചനമായതിനാൽ പ്രധാനപാഠത്തിൽ ഏകവചനം സംരക്ഷിക്കുന്നു. എന്നാൽ 13–14 വാക്യങ്ങളിലെ അശുദ്ധാത്മാക്കളെ അടിസ്ഥാനമാക്കി ബഹുവചന കർത്താവ് ഗ്രഹിക്കാവുന്നതും, ഏകവചന കർത്താവിന്റെ തിരിച്ചറിയൽ തുറന്നിരിക്കുന്നതും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; ഇതുവഴി ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലഗ്രീക്കിലെ ഏകവചന ക്രിയ പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും കർത്താവിന്റെ അനിശ്ചിതത്വവും ഭാഷാനാമത്തിന്റെ വ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
