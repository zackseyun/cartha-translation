- from: അവൻ അവരെ എബ്രായഭാഷയിൽ അർമ്മഗെദോൻ എന്നു വിളിക്കപ്പെടുന്ന സ്ഥലത്ത് കൂട്ടിച്ചേർത്തു.[a][b]
  to: അവരെ എബ്രായഭാഷയിൽ ഹർമഗെദോൻ എന്നു വിളിക്കപ്പെടുന്ന സ്ഥലത്തേക്ക് കൂട്ടിച്ചേർത്തു.[a][b]
  rationale: The revision corrects the directional sense of εἰς, removes an unwarranted masculine identification of the singular but unspecified agent, and adopts a Greek-faithful transliteration of the name. The notes retain both the singular Greek form and the contextual rationale for a plural interpretive rendering, without resolving the agent’s identity.
