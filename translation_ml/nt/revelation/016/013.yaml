id: REV.16.13
reference: Revelation 16:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: ml
  text: അപ്പോൾ മഹാസർപ്പത്തിന്റെ വായിൽനിന്നും മൃഗത്തിന്റെ വായിൽനിന്നും കള്ളപ്രവാചകന്റെ വായിൽനിന്നും തവളകളെപ്പോലെയുള്ള മൂന്ന് അശുദ്ധാത്മാക്കൾ വരുന്നതു ഞാൻ കണ്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘മഹാസർപ്പത്തിന്റെ വായിൽനിന്നും മൃഗത്തിന്റെ വായിൽനിന്നും കള്ളപ്രവാചകന്റെ വായിൽനിന്നും തവളകളെപ്പോലെയുള്ള മൂന്ന് അശുദ്ധാത്മാക്കളെ ഞാൻ കണ്ടു.’ ഗ്രീക്കിൽ ആവർത്തിക്കുന്ന ഉറവിടസൂചക പദസമുച്ചയങ്ങൾ ‘മൂന്ന് അശുദ്ധാത്മാക്കൾ’ എന്നതിനു മുമ്പാണ് വരുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭൂതകാല ആഖ്യാനരൂപം ദർശനവിവരണത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκ ... τοῦ στόματος
  choice: വായിൽനിന്നും ... വരുന്നതു
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടവും പുറത്തേക്കുള്ള ചലനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: δράκοντος
  choice: മഹാസർപ്പം
  rationale: വെളിപ്പാടിലെ δράκων എന്ന പ്രതീകാത്മക രൂപത്തിന് മലയാള ബൈബിൾഭാഷയിൽ വ്യക്തവും സ്ഥാപിതവുമായ പദം.
- source_word: θηρίου
  choice: മൃഗം
  rationale: വെളിപ്പാടിലെ θηρίον എന്ന അന്ത്യകാലദർശന പ്രതീകത്തെ മൃദൂകരിക്കാതെ നേരിട്ട് നൽകുന്നു.
- source_word: ψευδοπροφήτου
  choice: കള്ളപ്രവാചകൻ
  rationale: ψευδοπροφήτης എന്ന സംയുക്തപദത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാള തുല്യം.
- source_word: πνεύματα
  choice: ആത്മാക്കൾ
  rationale: ഇവിടെ കാറ്റിനെയോ മനോഭാവങ്ങളെയോ അല്ല, ആത്മീയ സത്തകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: τρία ἀκάθαρτα
  choice: മൂന്ന് അശുദ്ധാത്മാക്കൾ
  rationale: ἀκάθαρτος എന്ന പദത്തിന്റെ ആചാരപരവും ധാർമിക-ആത്മീയവുമായ അശുദ്ധതാഭാവം ‘അശുദ്ധ’ സംരക്ഷിക്കുന്നു.
- source_word: ὡς βάτραχοι
  choice: തവളകളെപ്പോലെയുള്ള
  rationale: ὡς ഇവിടെ സമാനതയാണ് സൂചിപ്പിക്കുന്നത്, താദാത്മ്യമല്ല; മലയാളത്തിൽ ഉപമ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: πνεύματα ἀκάθαρτα എന്നതിന്റെ അന്ത്യകാലദർശന സ്വഭാവം
  choice: ‘തവളകളെപ്പോലെയുള്ള മൂന്ന് അശുദ്ധാത്മാക്കൾ’ എന്ന് വ്യാഖ്യാനവികാസമില്ലാതെ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തവളകളെപ്പോലെയുള്ള മൂന്ന് ദുരാത്മാക്കൾ’
  rationale: അടുത്ത വാക്യം ഇവയുടെ പൈശാചിക സ്വഭാവം വ്യക്തമാക്കുന്നുവെങ്കിലും ഈ വാക്യം ‘അശുദ്ധാത്മാക്കൾ’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ സന്ദർഭം തന്നെയാണ് കൂടുതൽ വിശദീകരിക്കേണ്ടത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ദർശനവിവരണ ശൈലി. ഗ്രീക്കിലെ മൂന്ന് ആവർത്തിത ഉറവിടസൂചനകൾ നിലനിർത്തിയിരിക്കെ, ‘വരുന്നതു’ ചേർത്ത് മലയാളവാക്യബന്ധം സ്വാഭാവികമാക്കി. ‘അപ്പോൾ’ ആഖ്യാനബന്ധകമായ καίയുടെ സന്ദർഭോചിത രൂപമാണ്.
