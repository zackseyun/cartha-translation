source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: ml
  text: 'ഞാൻ വിശുദ്ധമന്ദിരത്തിൽനിന്ന്[a] ഒരു ഉച്ചത്തിലുള്ള ശബ്ദം ഏഴ് ദൂതന്മാരോടു ഇങ്ങനെ പറയുന്നതു കേട്ടു: “പോകുവിൻ; ദൈവത്തിന്റെ ക്രോധത്തിന്റെ ഏഴ് കലശങ്ങൾ[b] ഭൂമിയിലേക്കു ഒഴിച്ചുകളവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേവാലയം’; ഗ്രീക്കിലെ ναός എന്ന പദം വിശാലമായ ദേവാലയസമുച്ചയത്തേക്കാൾ പ്രത്യേകമായി അകത്തെ വിശുദ്ധസ്ഥാനത്തെ സൂചിപ്പിക്കാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ φιάλη എന്ന പദം ആഴം കുറഞ്ഞ, വിശാലമായ ഒരു പാത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘കുപ്പി’ എന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: ഒരു ഉച്ചത്തിലുള്ള ശബ്ദം
  rationale: φωνήയോടൊപ്പമുള്ള μέγας ഇവിടെ ശബ്ദത്തിന്റെ മഹത്ത്വത്തേക്കാൾ അതിന്റെ ഉച്ചതയെ സൂചിപ്പിക്കുന്നു; ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ναοῦ
  choice: വിശുദ്ധമന്ദിരം
  rationale: ναός സാധാരണയായി വിശാലമായ ദേവാലയസമുച്ചയത്തെക്കാൾ അകത്തെ വിശുദ്ധസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. വെളിപ്പാടിലെ സ്വർഗീയ പശ്ചാത്തലത്തിൽ ‘വിശുദ്ധമന്ദിരം’ ആ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: λεγούσης
  choice: പറയുന്നതു
  rationale: വർത്തമാനകാല കൃദന്തരൂപം ‘ശബ്ദം’ എന്ന പദത്തോട് യോജിക്കുന്നു; ‘പറയുന്നതു ഞാൻ കേട്ടു’ എന്ന ഘടന ഗ്രീക്കിന്റെ സജീവതയും മലയാളത്തിന്റെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: Ὑπάγετε
  choice: പോകുവിൻ
  rationale: ദൂതന്മാരോട് പുറപ്പെട്ട് പ്രവർത്തിക്കാനുള്ള നേരിട്ടുള്ള ബഹുവചന കല്പനയാണിത്; ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ ‘പോകുവിൻ’ അനുയോജ്യം.
- source_word: ἐκχέετε
  choice: ചൊരിയുവിൻ
  rationale: പാത്രങ്ങളിലെ ഉള്ളടക്കം പൂർണമായി ഒഴിക്കുന്ന ദൃശ്യബിംബം നിലനിർത്തുകയും ന്യായവിധിയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: φιάλας
  choice: പാത്രങ്ങൾ
  rationale: φιάλη ആഴം കുറഞ്ഞ വിശാലമായ പാത്രമാണ്; ‘കുപ്പികൾ’ എന്ന പരമ്പരാഗത ധാരണ ഒഴിവാക്കി മലയാളത്തിൽ സ്വാഭാവികമായ പൊതുപദം ഉപയോഗിക്കുന്നു.
- source_word: θυμοῦ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ക്രോധം
  rationale: θυμός ഇവിടെ ദൈവത്തിന്റെ തീവ്രമായ ന്യായവിധിക്രോധത്തെ സൂചിപ്പിക്കുന്നു; ‘ക്രോധം’ അതിന്റെ ഗൗരവം അധിക വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: εἰς τὴν γῆν
  choice: ഭൂമിയിലേക്കു
  rationale: εἰς നൽകുന്ന ദിശാബോധം സംരക്ഷിക്കുന്നു; വിശ്വവ്യാപക ന്യായവിധിയുടെ സന്ദർഭത്തിൽ γῆയെ ‘ദേശം’ എന്നല്ല ‘ഭൂമി’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: വെളിപ്പാടിലെ സ്വർഗീയ ദൃശ്യത്തിൽ ναός എന്നതിന്റെ വിവർത്തനം
  choice: വിശുദ്ധമന്ദിരം
  alternative: ദേവാലയം
  rationale: അകത്തെ വിശുദ്ധസ്ഥാനത്തിന്റെ സൂക്ഷ്മത നഷ്ടപ്പെടുത്താതെ സ്വർഗീയ വിശുദ്ധസ്ഥലത്തിന്റെ ദൃശ്യബിംബം നിലനിർത്തുന്നു; ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ഇതിൽ ചേർക്കുന്നില്ല.
- issue: θυμός τοῦ θεοῦ എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ദൈവത്തിന്റെ ക്രോധം
  alternative: ദൈവത്തിന്റെ കോപം
  rationale: ഈ പ്രയോഗം ദുഷ്ടതയ്‌ക്കെതിരായ ദൈവിക ന്യായവിധിയുടെ തീവ്രത സൂചിപ്പിക്കുന്നു. ‘ക്രോധം’ ആ ഗൗരവം നിലനിർത്തുന്നു; എന്നാൽ പാത്രങ്ങളുടെ ഉള്ളടക്കം വ്യാകരണപരമായി വ്യക്തമാക്കാൻ ‘നിറഞ്ഞ’ ചേർത്തത് അർഥവ്യക്തതയ്ക്കായാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, എന്നാൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ശൈലി. ദൈവിക കല്പനയുടെ ഭാവം നിലനിർത്താൻ ‘പോകുവിൻ’, ‘ചൊരിയുവിൻ’ എന്നീ ആദരസൂചക ബഹുവചന കല്പനാരൂപങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
