revisions:
- from: മനുഷ്യർ അത്യുഷ്ണത്താൽ പൊള്ളിപ്പോയി; ഈ ബാധകളുടെമേൽ അധികാരമുള്ള ദൈവത്തിന്റെ നാമത്തെ അവർ ദുഷിച്ചു. എന്നാൽ അവനു മഹത്ത്വം നൽകേണ്ടതിന് അവർ മാനസാന്തരപ്പെട്ടില്ല.
  to: മനുഷ്യർ കഠിനമായ ചൂടിനാൽ പൊള്ളിപ്പോയി; ഈ ബാധകളുടെമേൽ അധികാരമുള്ള ദൈവത്തിന്റെ നാമത്തെ അവർ ദൂഷിച്ചു; അവനു മഹത്ത്വം നൽകാൻ അവർ മാനസാന്തരപ്പെട്ടില്ല.
