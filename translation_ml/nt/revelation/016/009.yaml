id: REV.16.9
reference: Revelation 16:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: ml
  text: മനുഷ്യർ കഠിനമായ ചൂടിനാൽ പൊള്ളിപ്പോയി; ഈ ബാധകളുടെമേൽ അധികാരമുള്ള ദൈവത്തിന്റെ നാമത്തെ അവർ ദൂഷിച്ചു; അവനു മഹത്ത്വം നൽകാൻ അവർ മാനസാന്തരപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: പൊള്ളിപ്പോയി
  rationale: καυματίζω എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയരൂപം ചൂടിനാൽ പൊള്ളിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികവും അമിതവത്കരിക്കാത്തതുമായ പ്രയോഗമാണിത്.
- source_word: οἱ ἄνθρωποι
  choice: മനുഷ്യർ
  rationale: പുരുഷന്മാരെ മാത്രം അല്ല, പൊതുവായി മനുഷ്യരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ വ്യാപ്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: καῦμα μέγα
  choice: അത്യുഷ്ണത്താൽ
  rationale: μέγα ഇവിടെ ചൂടിന്റെ വലുപ്പത്തേക്കാൾ അതിന്റെ തീവ്രത വ്യക്തമാക്കുന്നു; ഉപാധി/കാരണം സൂചിപ്പിക്കുന്ന വാക്യബന്ധവും ഈ പ്രയോഗം സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: ἐβλασφήμησαν
  choice: ദുഷിച്ചു
  rationale: ദൈവത്തിന്റെ നാമത്തിനെതിരായ നിന്ദാപരവും അപമാനകരവുമായ സംസാരത്തിന്റെ മതപരമായ ഗൗരവം ഈ സന്ദർഭത്തിൽ ‘ദുഷിച്ചു’ എന്ന പദം നൽകുന്നു.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ നാമത്തെ
  rationale: ദൈവത്തിന്റെ വെളിപ്പെട്ട വ്യക്തിത്വവും മാനവും പ്രതിനിധാനം ചെയ്യുന്ന ബൈബിൾ ഭാഷാശൈലി ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: ഈ ബാധകളുടെമേൽ അധികാരമുള്ള
  rationale: ἔχοντος എന്ന വർത്തമാന കൃുദന്തരൂപവും ἐξουσία എന്ന പദത്തിന്റെ അധികാരം/അവകാശമുള്ള ശക്തി എന്ന ആശയവും നേരിട്ട് പകർന്നുനൽകുന്നു.
- source_word: πληγὰς
  choice: ബാധകൾ
  rationale: വെളിപ്പാട് പുസ്തകത്തിലെ ദൈവിക ന്യായവിധിയുടെ പ്രഹരങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ബൈബിൾപദമാണ്.
- source_word: οὐ μετενόησαν
  choice: മാനസാന്തരപ്പെട്ടില്ല
  rationale: വെറും അഭിപ്രായമാറ്റമല്ല, ധാർമികവും ആത്മീയവുമായ തിരിഞ്ഞുവരവ് എന്ന μετανοέωയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: δοῦναι αὐτῷ δόξαν
  choice: അവനു മഹത്ത്വം നൽകേണ്ടതിന്
  rationale: മാനസാന്തരത്തിന്റെ ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന infinitive ബന്ധവും ‘മഹത്ത്വം നൽകുക’ എന്ന ബൈബിൾ ഭാഷാശൈലിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: οἱ ἄνθρωποι എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ വ്യാപ്തി
  choice: എല്ലാ മനുഷ്യരെയും പൊതുവായി സൂചിപ്പിക്കുന്ന ‘മനുഷ്യർ’
  alternative: പുരുഷന്മാർ
  rationale: സന്ദർഭം പുരുഷന്മാരെ മാത്രം പ്രത്യേകമായി പരാമർശിക്കുന്നില്ല; ന്യായവിധി നേരിടുന്ന മനുഷ്യരെയാണ് പൊതുവായി സൂചിപ്പിക്കുന്നത്.
- issue: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας എന്നതിലെ ദൈവിക അധികാരം
  choice: ദൈവത്തിന് ഈ ബാധകളുടെമേൽ അധികാരമുണ്ടെന്ന് നേരിട്ട് പ്രസ്താവിക്കുന്നു
  alternative: ദൈവം ഈ ബാധകളുമായി കേവലം ബന്ധപ്പെട്ടിരിക്കുന്നു
  rationale: ἐξουσία എന്ന പദം അധികാരത്തെ വ്യക്തമായി ആരോപിക്കുന്നു; പ്രസ്താവനയെ മയപ്പെടുത്താതെയും അതിനപ്പുറം സിദ്ധാന്തപരമായി വികസിപ്പിക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള ബൈബിൾ ശൈലി പാലിച്ചു. ‘നാമം’, ‘മാനസാന്തരം’, ‘മഹത്ത്വം നൽകുക’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുപ്രയോഗങ്ങൾ നിലനിർത്തി; ആവശ്യമില്ലാത്ത അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
