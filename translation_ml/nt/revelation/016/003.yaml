id: REV.16.3
reference: Revelation 16:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: ml
  text: രണ്ടാമത്തവൻ തന്റെ പാത്രം കടലിലേക്ക് ഒഴിച്ചു. അപ്പോൾ കടൽ മരിച്ച ഒരാളുടെ രക്തംപോലുള്ള രക്തമായിത്തീർന്നു[a]; കടലിലുണ്ടായിരുന്ന സകല ജീവജാലങ്ങളും മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ശവത്തിൽനിന്നുള്ള രക്തംപോലുള്ള രക്തം’; ഗ്രീക്കിൽ അക്ഷരാർഥം, ‘മരിച്ച ഒരാളുടേതുപോലുള്ള രക്തം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: രണ്ടാമത്തവൻ
  rationale: സന്ദർഭത്തിൽ ഇത് രണ്ടാമത്തെ ദൂതനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ ‘ദൂതൻ’ എന്നു വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ ഗ്രീക്കിലെ സംക്ഷിപ്തപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐξέχεεν
  choice: ഒഴിച്ചു
  rationale: പാത്രത്തിലെ ഉള്ളടക്കം കടലിലേക്ക് ചൊരിയുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായും കൃത്യമായും അറിയിക്കുന്നു.
- source_word: φιάλην
  choice: പാത്രം
  rationale: φιάλη സൂചിപ്പിക്കുന്ന വീതിയുള്ള പാത്രത്തിന് പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ മലയാളപദം; ‘കുപ്പി’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: εἰς τὴν θάλασσαν
  choice: കടലിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന ദിശയും ഉള്ളിലേക്കുള്ള ചലനവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐγένετο αἷμα
  choice: കടൽ ... രക്തംപോലെയായി
  rationale: ഗ്രീക്കിലെ കർത്തൃസൂചന മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘കടൽ’ ആവർത്തിക്കുന്നു. തുടർന്നുള്ള ὡς νεκροῦ എന്ന താരതമ്യം ചേർത്ത് രക്തമായിത്തീർന്ന ദൃശ്യത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὡς νεκροῦ
  choice: മരിച്ച ഒരാളുടെ രക്തംപോലെ
  rationale: νεκροῦ എന്ന ഏകവചന മനുഷ്യസൂചനയും അവിടെ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്ന ‘രക്തം’ എന്ന താരതമ്യവും വ്യക്തമാക്കുന്നു; ശവത്തിൽനിന്നുള്ള രക്തം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: സകല ജീവജാലങ്ങളും
  rationale: സമുദ്രസന്ദർഭത്തിൽ ‘ജീവനുള്ള സകല സൃഷ്ടികളും’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ആത്മാവ്’ എന്ന മനുഷ്യകേന്ദ്രിത തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἀπέθανεν
  choice: ചത്തുപോയി
  rationale: ജീവജാലങ്ങൾ മരിച്ചതിനെ സാധാരണവും ശക്തവുമായ മലയാളത്തിൽ നേരിട്ട് പറയുന്നു.
- source_word: τὰ ἐν τῇ θαλάσσῃ
  choice: കടലിലുണ്ടായിരുന്ന
  rationale: മുമ്പുള്ള ജീവജാലങ്ങളോടു സ്ഥലസൂചന സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: ബാധയുടെ ദൃശ്യസ്വഭാവവും കടൽ രക്തമാകുന്നതും
  choice: കടൽ യഥാർഥത്തിൽ രക്തമായിത്തീരുന്ന ദർശനഭാഷയുടെ ശക്തി നിലനിർത്തുക
  alternative: ‘കടൽ രക്തംപോലെ കാണപ്പെട്ടു’ എന്നു വെറും ദൃശ്യസാദൃശ്യമാക്കി മൃദൂകരിക്കുക
  rationale: ἐγένετο αἷμα എന്നത് ‘രക്തമായി’ എന്നാണ് പറയുന്നത്; ὡς νεκροῦ അതിന്റെ സ്വഭാവത്തെ താരതമ്യം ചെയ്യുന്നു. അതിനാൽ ന്യായവിധിയുടെ കാഠിന്യം വെറും കാഴ്ചയായി ചുരുക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ദൂതൻ’ ചേർത്തിട്ടില്ല; ദർശനത്തിലെ കഠിനമായ ന്യായവിധിഭാഷ മൃദൂകരിച്ചിട്ടില്ല.
