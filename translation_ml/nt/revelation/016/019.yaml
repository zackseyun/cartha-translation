id: REV.16.19
reference: Revelation 16:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: ml
  text: മഹാനഗരം മൂന്നു ഭാഗങ്ങളായി പിളർന്നു; ജനതകളുടെ നഗരങ്ങൾ വീണു. മഹത്തായ ബാബിലോൺ ദൈവസന്നിധിയിൽ ഓർമിക്കപ്പെട്ടു[a]; അവൾക്കു അവന്റെ ക്രോധത്തിന്റെ ഉഗ്രതയായ വീഞ്ഞിന്റെ പാനപാത്രം നൽകേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘ദൈവസന്നിധിയിൽ ഓർമിക്കപ്പെട്ടു.’ ന്യായവിധിക്കായി ദൈവത്തിന്റെ ശ്രദ്ധയിൽ വരുന്നതിനെ സൂചിപ്പിക്കുന്ന ബൈബിൾ പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... εἰς τρία μέρη
  choice: മൂന്നു ഭാഗങ്ങളായി പിളർന്നു
  rationale: പദാനുപദമായി ‘മൂന്നു ഭാഗങ്ങളായിത്തീർന്നു’ എന്നാണെങ്കിലും, ഈ ഫലസൂചക പ്രയോഗം നഗരത്തിന്റെ വിഭജനത്തെ സൂചിപ്പിക്കുന്നു. ‘പിളർന്നു’ എന്നത് അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: മഹാനഗരം
  rationale: വെളിപ്പാടിലെ പ്രതീകാത്മക നഗരദൃശ്യവും വിശേഷണത്തിന്റെ ഊന്നലും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: ജനതകളുടെ നഗരങ്ങൾ
  rationale: ἔθνη എന്നതിന് ഇവിടെ ആഗോളമായ ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ‘ജനതകൾ’ എന്നത് സ്വാഭാവികവും അനാവശ്യമായ മതവിഭാഗസൂചന ഒഴിവാക്കുന്നതുമാണ്.
- source_word: ἔπεσαν
  choice: വീണു
  rationale: മൂലപദത്തിന്റെ ദൃശ്യതീവ്രത നിലനിർത്തുന്നു; ‘തകർന്നു’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: മഹാബാബിലോൺ
  rationale: വെളിപ്പാടിൽ ആവർത്തിക്കുന്ന മഹത്തായ ബാബിലോൺ എന്ന പ്രതീകാത്മക ശീർഷകം സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: ദൈവം അവളെ ഓർത്തു
  rationale: ഗ്രീക്കിലെ ദൈവസന്നിധിയിൽ ഓർമിക്കപ്പെടുക എന്ന ബൈബിൾ പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭം ഇത് ന്യായവിധിക്കായുള്ള ഓർമയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: δοῦναι αὐτῇ
  choice: അവൾക്ക് ... കൊടുക്കേണ്ടതിന്
  rationale: ഇൻഫിനിറ്റീവിലുള്ള ഉദ്ദേശ്യ/ഫലബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: വീഞ്ഞിന്റെ പാനപാത്രം
  rationale: ന്യായവിധിയുടെ ഓഹരിയെ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകം നിലനിർത്തുന്നു.
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: തന്റെ കോപത്തിന്റെ ഉഗ്രത
  rationale: θυμός, ὀργή എന്നീ ബന്ധപ്പെട്ടെങ്കിലും വേറിട്ട പദങ്ങളെ യഥാക്രമം ‘ഉഗ്രത’, ‘കോപം’ എന്നു പ്രതിഫലിപ്പിച്ച് വാക്യത്തിലെ തീവ്രത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐμνήσθη ἐνώπιον τοῦ θεοῦ എന്ന ന്യായവിധിസംബന്ധിയായ പ്രയോഗം
  choice: ദൈവം അവളെ ഓർത്തു
  alternative: ന്യായവിധിക്കായി ദൈവം അവളെ ഓർത്തു
  rationale: ‘ന്യായവിധിക്കായി’ എന്നു മുഖ്യവാചകത്തിൽ ചേർക്കുന്നത് സന്ദർഭസൂചനയെ വ്യാഖ്യാനമായി ഉറപ്പിച്ചുകളയും. മൂലത്തിലെ പ്രയോഗവും അതിലുള്ള ദൈവിക ന്യായവിധിയുടെ സൂചനയും നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: θυμός, ὀργή എന്നീ രണ്ട് ക്രോധപദങ്ങളുടെ വ്യത്യാസം
  choice: കോപത്തിന്റെ ഉഗ്രത
  alternative: ഉഗ്രകോപം
  rationale: ‘ഉഗ്രകോപം’ കൂടുതൽ സുഗമമാണെങ്കിലും രണ്ട് ഗ്രീക്ക് പദങ്ങളെ ഒറ്റ ആശയമായി ചുരുക്കും. ‘കോപത്തിന്റെ ഉഗ്രത’ രണ്ടിന്റെയും ആശയഘടകങ്ങൾ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൃശ്യാത്മകമായ അന്ത്യകാലഭാഷ നിലനിർത്തിയിട്ടുണ്ട്. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘ഓർത്തു’ എന്ന പ്രയോഗത്തിനുശേഷം വെച്ചിരിക്കുന്നു.
