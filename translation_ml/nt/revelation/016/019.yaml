revisions:
- from: മഹാനഗരം മൂന്നു ഭാഗങ്ങളായി പിളർന്നു; ജനതകളുടെ നഗരങ്ങൾ വീണു. മഹാബാബിലോണിന് തന്റെ കോപത്തിന്റെ ഉഗ്രതയാകുന്ന വീഞ്ഞിന്റെ പാനപാത്രം കൊടുക്കേണ്ടതിന് ദൈവം അവളെ ഓർത്തു[a].
