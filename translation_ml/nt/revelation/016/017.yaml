id: REV.16.17
reference: Revelation 16:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: ml
  text: ഏഴാമൻ തന്റെ കിണ്ണം വായുവിലേക്കു ചൊരിഞ്ഞു; വിശുദ്ധമന്ദിരത്തിൽനിന്നും സിംഹാസനത്തിൽനിന്നും “സംഭവിച്ചിരിക്കുന്നു”[a] എന്നു പറയുന്ന ഒരു ഉച്ചത്തിലുള്ള ശബ്ദം പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പൂർത്തിയായി.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: ഏഴാമൻ
  rationale: ഗ്രീക്കിൽ വിശേഷണപദമായ ക്രമസംഖ്യ മാത്രമേ ഉള്ളൂ; സന്ദർഭത്തിൽ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ‘ദൂതൻ’ എന്നു മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: ἐξέχεεν
  choice: ചൊരിഞ്ഞു
  rationale: ἐκχέω എന്ന ക്രിയയുടെ ഒഴിച്ചുപകരൽ അർഥവും ഈ അധ്യായത്തിലെ ന്യായവിധിയുടെ പാത്രങ്ങൾ ചൊരിയുന്ന ആവർത്തിത പ്രയോഗവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: φιάλην
  choice: പാത്രം
  rationale: വീതിയേറിയ ഒരു പാത്രത്തെയാണ് φιάλη സൂചിപ്പിക്കുന്നത്; ‘കുപ്പി’ പോലുള്ള തെറ്റായ ആധുനിക ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἐπὶ τὸν ἀέρα
  choice: വായുവിലേക്കു
  rationale: ചൊരിയുക എന്ന ചലനക്രിയയോടുകൂടിയ ἐπί + accusative ലക്ഷ്യദിശയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വായുവിലേക്കു’ സ്വാഭാവികമാണ്.
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: ഒരു ഉച്ചത്തിലുള്ള ശബ്ദം പുറപ്പെട്ടു
  rationale: φωνὴ μεγάλη എന്നത് സ്വാഭാവികമായി ‘ഉച്ചത്തിലുള്ള ശബ്ദം’ എന്നും ἐξῆλθεν ഉറവിടത്തിൽനിന്നുള്ള പുറപ്പെടലായും വിവർത്തനം ചെയ്യുന്നു.
- source_word: ἐκ τοῦ ναοῦ
  choice: വിശുദ്ധമന്ദിരത്തിൽനിന്ന്
  rationale: ναός വിശാലമായ ദേവാലയപരിസരത്തെയല്ല, പ്രത്യേകിച്ച് അകത്തെ വിശുദ്ധസ്ഥാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπὸ τοῦ θρόνου
  choice: സിംഹാസനത്തിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ രണ്ടാമത്തെ ഉറവിടവിവരണം ഒഴിവാക്കാതെയും ആദ്യത്തേതുമായി ലയിപ്പിക്കാതെയും നിലനിർത്തുന്നു.
- source_word: λέγουσα
  choice: എന്നു പറയുന്ന
  rationale: സ്ത്രീലിംഗത്തിലുള്ള participle φωνήയോടു യോജിക്കുന്നു; മലയാളത്തിൽ ശബ്ദത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കാൻ ഈ ഘടന സ്വാഭാവികമാണ്.
- source_word: Γέγονεν
  choice: സംഭവിച്ചുകഴിഞ്ഞു
  rationale: γίνομαιയുടെ perfect രൂപം സംഭവത്തിന്റെ പൂർത്തീകരണവും അതിന്റെ നിലവിലുള്ള ഫലാവസ്ഥയും സൂചിപ്പിക്കുന്നു; ‘സംഭവിച്ചുകഴിഞ്ഞു’ ഈ ഭാവം വ്യാഖ്യാനാതിക്രമമില്ലാതെ നൽകുന്നു.
theological_decisions:
- issue: അപ്പോക്കലിപ്റ്റിക് സ്വർഗീയ-ആലയ ദൃശ്യത്തിൽ ναός എന്നതിന്റെ പരിഭാഷ
  choice: വിശുദ്ധമന്ദിരം
  alternative: ദേവാലയം
  rationale: ഇത് ഉപദേശപരമായ നിർണ്ണയമല്ല, പദപരമായ പ്രത്യേകതയാണ്. ναός സൂചിപ്പിക്കുന്ന അകത്തെ വിശുദ്ധസ്ഥാനവും ἱερόν സൂചിപ്പിക്കാവുന്ന വിശാലമായ ആലയപരിസരവും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- issue: Γέγονεν എന്ന പൂർത്തീകരണപ്രഖ്യാപനത്തിന്റെ പരിഭാഷ
  choice: സംഭവിച്ചുകഴിഞ്ഞു
  alternative: പൂർത്തിയായി
  rationale: ഏഴാമത്തെ പാത്രവുമായി ബന്ധപ്പെട്ട സംഭവം പൂർത്തിയായതിനെ perfect/resultative രൂപം പ്രഖ്യാപിക്കുന്നു. ‘പൂർത്തിയായി’ എന്ന പരമ്പരാഗത സാധ്യതയെയും അതിന്റെ അന്തർപാഠസാദ്ധ്യതയെയും അടിക്കുറിപ്പിൽ നിലനിർത്തി, മുഖ്യപാഠം സംഭവിക്കുക എന്ന ക്രിയയുടെ അർഥത്തോട് അടുത്തുനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ‘ഏഴാമൻ’ എന്ന അപൂർണ പരാമർശം നിലനിർത്തി; വാക്യത്തിന്റെ രണ്ട് ഉറവിടപ്രയോഗങ്ങളും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ഉദ്ധരണിക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
