revisions:
- from: ഏഴാമൻ തന്റെ പാത്രം വായുവിലേക്കു ചൊരിഞ്ഞു. അപ്പോൾ വിശുദ്ധമന്ദിരത്തിൽനിന്ന്, സിംഹാസനത്തിൽനിന്ന്, “സംഭവിച്ചുകഴിഞ്ഞു”[a] എന്നു പറയുന്ന ഒരു ഉച്ചത്തിലുള്ള ശബ്ദം പുറപ്പെട്ടു.
  to: ഏഴാമൻ തന്റെ കിണ്ണം വായുവിലേക്കു ചൊരിഞ്ഞു; വിശുദ്ധമന്ദിരത്തിൽനിന്നും സിംഹാസനത്തിൽനിന്നും “സംഭവിച്ചിരിക്കുന്നു”[a] എന്നു പറയുന്ന ഒരു ഉച്ചത്തിലുള്ള ശബ്ദം പുറപ്പെട്ടു.
