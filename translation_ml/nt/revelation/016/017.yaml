    rationale: φιάλη സാധാരണയായി വീതിയുള്ള കിണ്ണം/ബൗൾ ആണ്. ‘കിണ്ണം’ ഉപയോഗിക്കുന്നത് മൂലപാഠത്തിലെ പാത്രത്തിന്റെ രൂപവും ഈ അധ്യായത്തിലെ ആവർത്തിതമായ കിണ്ണചിത്രവും കൂടുതൽ വ്യക്തമായി നിലനിർത്തും.
