id: REV.16.14
reference: Revelation 16:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: ml
  text: എന്തെന്നാൽ, അവ ഭൂതങ്ങളുടെ ആത്മാക്കളാണ്[a]; അവ അടയാളങ്ങൾ പ്രവർത്തിച്ചുകൊണ്ട് ലോകം മുഴുവനിലുമുള്ള[b] രാജാക്കന്മാരുടെ അടുക്കലേക്കു പുറപ്പെടുന്നു—സർവശക്തനായ ദൈവത്തിന്റെ മഹാദിവസത്തിലെ യുദ്ധത്തിനായി അവരെ ഒരുമിച്ചുകൂട്ടാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂതാത്മാക്കൾ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ജനവാസമുള്ള ലോകം മുഴുവനിലുമുള്ള രാജാക്കന്മാരുടെ അടുക്കലേക്കു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: ഭൂതങ്ങളുടെ ആത്മാക്കൾ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയോട് അടുത്തുനിൽക്കുകയും അവ ഭൂതസ്വഭാവമുള്ള ആത്മാക്കളാണെന്ന അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു; കൂടുതൽ സംക്ഷിപ്തമായ ‘ഭൂതാത്മാക്കൾ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ποιοῦντα σημεῖα
  choice: അടയാളങ്ങൾ പ്രവർത്തിച്ചുകൊണ്ട്
  rationale: σημεῖα എന്നത് വ്യാഖ്യാനിച്ച് ‘അത്ഭുതങ്ങൾ’ എന്നാക്കാതെ ‘അടയാളങ്ങൾ’ എന്നു നിലനിർത്തുന്നു; ποιέωയുടെ പ്രവർത്തനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἃ ἐκπορεύεται
  choice: അവ ... പുറപ്പെടുന്നു
  rationale: ഗ്രീക്കിൽ ക്രിയ ഏകവചനരൂപത്തിലാണെങ്കിലും ആപേക്ഷിക സർവനാമവും മുൻപദവും ബഹുവചനമായ ആത്മാക്കളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥാനുസൃതമായ ബഹുവചനം ഉപയോഗിക്കുന്നു.
- source_word: ἐπὶ τοὺς βασιλεῖς
  choice: രാജാക്കന്മാരുടെ അടുക്കലേക്കു
  rationale: ചലനം സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ἐπί ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കമാണ്; രാജാക്കന്മാർക്കെതിരേ എന്ന അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: τῆς οἰκουμένης ὅλης
  choice: ലോകം മുഴുവനിലുമുള്ള
  rationale: മനുഷ്യർ അധിവസിക്കുന്ന ലോകമൊട്ടാകെയുള്ള രാഷ്ട്രീയ വ്യാപ്തി സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: συναγαγεῖν
  choice: ഒരുമിച്ചുകൂട്ടാൻ
  rationale: ഇൻഫിനിറ്റീവിന്റെ ഉദ്ദേശ്യാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τὸν πόλεμον
  choice: യുദ്ധത്തിനായി
  rationale: εἰς ഇവിടെ ലക്ഷ്യമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു; ഏകവചനത്തിലുള്ള നിർണായക സംഘർഷം നിലനിർത്തുന്നു.
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: മഹാദിവസത്തിലെ
  rationale: ഗ്രീക്കിലെ ഗൗരവമുള്ള അന്ത്യകാലപ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: സർവശക്തനായ ദൈവത്തിന്റെ
  rationale: παντοκράτωρ എന്ന ദൈവിക വിശേഷണത്തിന്റെ സ്ഥാപിതവും വ്യക്തവുമായ മലയാളരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ആത്മാക്കൾ പ്രവർത്തിക്കുന്ന അടയാളങ്ങളുടെ സ്വഭാവം
  choice: അവയെ ‘അടയാളങ്ങൾ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി, ഭൂതങ്ങളുടെ ആത്മാക്കൾ അവ പ്രവർത്തിക്കുന്നു എന്നു പറയുന്നു.
  alternative: അവ വെറും കൺകെട്ടുവിദ്യകളാണെന്നോ ദൈവിക അത്ഭുതങ്ങൾക്ക് തുല്യമായ അത്ഭുതങ്ങളാണെന്നോ വ്യക്തമാക്കുക.
  rationale: σημεῖα അവയുടെ യാഥാർഥ്യമോ പ്രവർത്തനരീതിയോ വിശദീകരിക്കുന്നില്ല. അതിനാൽ വഞ്ചനാപരമായ ദൃശ്യങ്ങൾ, യഥാർഥ അമാനുഷിക പ്രവൃത്തികൾ തുടങ്ങിയ സാധ്യതകൾക്കിടയിലെ പാഠത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: πνεύματα δαιμονίων എന്ന ജനിറ്റീവ് ബന്ധം
  choice: ‘ഭൂതങ്ങളുടെ ആത്മാക്കൾ’ എന്ന അടുത്ത ഘടന മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
  alternative: ‘ഭൂതാത്മാക്കൾ’ എന്നു ഗുണവിശേഷണാർഥത്തിൽ മാത്രം പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ ജനിറ്റീവ് ഉടമസ്ഥതയെയോ ഉറവിടത്തെയോ സ്വഭാവത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം ബന്ധം അതിയായി നിർവചിക്കാതെ നിലനിർത്തുകയും സ്വാഭാവികമായ വ്യത്യസ്തരൂപം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദർശനഗ്രന്ഥത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ‘മഹാദിവസം’, ‘സർവശക്തൻ’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ തുടർച്ചയെ സൂചിപ്പിക്കാൻ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
