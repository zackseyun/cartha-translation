id: REV.1.6
reference: Revelation 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: ml
  text: നമ്മെ ഒരു രാജ്യവും[a], തന്റെ ദൈവത്തിനും പിതാവിനുമായി പുരോഹിതന്മാരും ആക്കിയവന് മഹത്ത്വവും ആധിപത്യവും എന്നെന്നേക്കും[b] ഉണ്ടായിരിക്കട്ടെ. ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പിൽക്കാല കൈയെഴുത്തുപ്രതികളിൽ ‘ഒരു രാജ്യം, പുരോഹിതന്മാർ’ എന്നതിനുപകരം ‘രാജാക്കന്മാരും പുരോഹിതന്മാരും’ എന്നു കാണുന്നു. മുഖ്യപാഠം നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തെ പിന്തുടരുന്നു.
    reason: textual_variant
  - marker: b
    text: 'കൂടുതൽ പദാനുപദമായി: ‘യുഗങ്ങളുടെ യുഗങ്ങളോളം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: ആക്കിയ
  rationale: ഗ്രീക്ക് ഏറിസ്റ്റ് ക്രിയയെ സന്ദർഭത്തിലെ മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന ഭൂതകാല കർത്തൃവിശേഷണരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: βασιλείαν
  choice: ഒരു രാജ്യം
  rationale: പദം ‘രാജാക്കന്മാർ’ എന്നല്ല, ഏകവചനത്തിലുള്ള ‘രാജ്യം’ എന്നാണ്; പുറപ്പാട് 19:6-ലെ സമൂഹപരമായ തിരിച്ചറിയലും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: ἱερεῖς
  choice: പുരോഹിതന്മാർ
  rationale: ആരാധനാപരവും ഉടമ്പടിസംബന്ധവുമായ തിരിച്ചറിയൽ നേരിട്ട് നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: തന്റെ ദൈവത്തിനും പിതാവിനുംവേണ്ടിയുള്ള
  rationale: ദത്തിവ് സൂചിപ്പിക്കുന്ന സമർപ്പണവും സേവനബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; αὐτοῦ രണ്ടു നാമങ്ങളോടും ബന്ധപ്പെട്ടിരിക്കുന്നതു ‘തന്റെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവന്
  rationale: സ്തുതിവാക്യത്തിലെ ദത്തിവ് മഹത്ത്വവും ആധിപത്യവും അവനോടു ചാർത്തുന്നതായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: δόξα
  choice: മഹത്ത്വം
  rationale: δόξα എന്ന പദത്തിന്റെ സ്തുതിവാക്യപരമായ അർഥം വ്യക്തമാക്കുന്ന പ്രചാരത്തിലുള്ള മാന്യമായ മലയാളരൂപം.
- source_word: κράτος
  choice: ആധിപത്യം
  rationale: വെറും ശക്തിയേക്കാൾ ഭരണാധികാരത്തോടുകൂടിയ പരമശക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; കൂടുതൽ പദാനുപദരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: ആരാധനാപരമായ സ്ഥിരീകരണമായി മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സ്ഥിരപ്പെട്ട രൂപം.
theological_decisions:
- issue: ‘തന്റെ ദൈവത്തിനും പിതാവിനും’ എന്നതിന്റെ ബന്ധസൂചന
  choice: ‘തന്റെ’ എന്നത് സന്ദർഭത്തിലെ യേശുക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നതായി വാചകം നിലനിർത്തുന്നു.
  alternative: ‘പിതാവായ ദൈവത്തിന്’ എന്നു ബന്ധവ്യത്യാസം മിനുക്കിക്കളയുക.
  rationale: അടുത്തുള്ള പൂർവപദം യേശുക്രിസ്തുവാണ്; ഗ്രീക്കിലെ ബന്ധപരവും ക്രിസ്തുശാസ്ത്രപരവുമായ ഉത്കണ്ഠ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: വിശ്വാസിസമൂഹത്തിന്റെ പദവി
  choice: ‘ഒരു രാജ്യവും ... പുരോഹിതന്മാരും’
  alternative: ‘രാജാക്കന്മാരും പുരോഹിതന്മാരും’
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠം βασιλείαν, ἱερεῖς എന്നാണ്. അതിനാൽ പിന്നീട് ഉണ്ടായ പാഠഭേദമോ പരമ്പരാഗത വ്യാഖ്യാനമോ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ സമൂഹപരമായ ‘രാജ്യം’ എന്ന തിരിച്ചറിയൽ സംരക്ഷിക്കുന്നു.
- issue: സ്തുതിവാക്യത്തിലെ αὐτῷ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: സന്ദർഭത്തിലെ യേശുക്രിസ്തുവിനോടാണ് മഹത്ത്വവും ആധിപത്യവും ചാർത്തുന്നത്.
  alternative: അടുത്തുള്ള ‘ദൈവവും പിതാവും’ എന്ന പ്രയോഗത്തെ സൂചിതനായി സ്വീകരിക്കുക.
  rationale: വാക്യഘടനയിൽ ‘നമ്മെ ... ആക്കിയവൻ’ എന്ന ക്രിസ്തുസംബന്ധിയായ കർത്താവിലേക്കുള്ള മടങ്ങിച്ചൂണ്ടലാണ് ഏറ്റവും സ്വാഭാവികം; എന്നാൽ പേരിനെ പകരം ചേർക്കാതെ ‘അവന്’ എന്നു തന്നെയാക്കി സർവനാമരൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആരാധനാഭാഷ. ഗ്രീക്കിലെ ‘ഒരു രാജ്യം’ എന്ന ഏകവചന സമൂഹപരമായ രൂപവും ‘തന്റെ ദൈവത്തിനും പിതാവിനും’ എന്ന ബന്ധപരമായ ഭാഷയും ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് പാളിയിലെ അടിക്കുറിപ്പ് മാർക്കറുകളും അവയുടെ ഉള്ളടക്കവും തമ്മിലുള്ള പ്രത്യക്ഷമായ മറിച്ചിടൽ ഉറവിടസാക്ഷ്യത്തിന്റെ അടിസ്ഥാനത്തിൽ തിരുത്തിയിരിക്കുന്നു.
