id: REV.1.16
reference: Revelation 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: ml
  text: അവന്റെ വലങ്കയ്യിൽ ഏഴു നക്ഷത്രങ്ങൾ ഉണ്ടായിരുന്നു; അവന്റെ വായിൽനിന്ന് മൂർച്ചയേറിയ, ഇരുവായ്ത്തലയുള്ള ഒരു വാൾ[a] പുറപ്പെട്ടുകൊണ്ടിരുന്നു; അവന്റെ കാഴ്ച ശക്തിയോടെ[b] പ്രകാശിക്കുന്ന സൂര്യനെപ്പോലെയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൂർച്ചയുള്ള ഇരുവായ്ത്തലയുള്ള വാൾ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പൂർണശക്തിയോടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: ഉണ്ടായിരുന്നു
  rationale: ചുറ്റുമുള്ള ദർശനവിവരണത്തോടു ചേർന്നുനിൽക്കുന്ന വർത്തമാനകാല വിവരണാത്മക കൃദന്തരൂപമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ സമാപികാക്രിയ ഉപയോഗിച്ചുകൊണ്ട് അതിന്റെ വിവരണാത്മക ബലം നിലനിർത്തുന്നു.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: അവന്റെ വലങ്കയ്യിൽ
  rationale: ഗ്രീക്കിൽ χείρ (‘കൈ’) വ്യക്തമായി ഉള്ളതിനാൽ അത് നിലനിർത്തി; മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു.
- source_word: ἀστέρας ἑπτά
  choice: ഏഴു നക്ഷത്രങ്ങൾ
  rationale: അർഥവും എണ്ണവും നേരിട്ട്, സ്വാഭാവിക മലയാള പദക്രമത്തിൽ പകർന്നു.
- source_word: ῥομφαία
  choice: വാൾ
  rationale: വലിയതരം വാളിനെ സൂചിപ്പിക്കാവുന്ന പദമാണെങ്കിലും, ആയുധത്തിന്റെ കൃത്യമായ രൂപം അനാവശ്യമായി നിർണയിക്കാതെ ദർശനചിത്രം വ്യക്തമായി നിലനിർത്താൻ ‘വാൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: δίστομος
  choice: ഇരുവായ്ത്തലയുള്ള
  rationale: അക്ഷരാർഥത്തിൽ ‘രണ്ടു വായുള്ള’ എന്നും പ്രയോഗാർഥത്തിൽ ‘ഇരുവശത്തും വെട്ടുവായുള്ള’ എന്നും വരുന്ന വിശേഷണം. മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: ὀξεῖα
  choice: മൂർച്ചയേറിയ
  rationale: വാളിന്റെ മൂർച്ചയെ വ്യക്തമാക്കുന്ന വിശേഷണം പ്രത്യേകം നിലനിർത്തി; δίστομος എന്ന പദത്തിന്റെ അർഥത്തിൽ ലയിപ്പിച്ചില്ല.
- source_word: ἐκπορευομένη
  choice: പുറപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: വാൾ അവന്റെ വായിൽനിന്ന് തുടർച്ചയായി പുറപ്പെടുന്നതായി ദർശനത്തിൽ കാണുന്ന വിവരണാത്മക ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡ ὄψις αὐτοῦ
  choice: അവന്റെ രൂപം
  rationale: ὄψις മുഖത്തെ മാത്രം അല്ല, കാണപ്പെടുന്ന മുഴുവൻ ഭാവത്തെയോ രൂപത്തെയോ സൂചിപ്പിക്കാം. ‘രൂപം’ ഈ വ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: പ്രകാശിക്കുന്ന സൂര്യനെപ്പോലെ
  rationale: സൂര്യന്റെ തുടർച്ചയായ തിളക്കത്തെ സ്വാഭാവിക മലയാള താരതമ്യഘടനയിൽ പകർന്നു.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: ശക്തിയോടെ
  rationale: ഇവിടെ δύναμις സൂര്യന്റെ തീവ്രതയെയോ പൂർണപ്രഭയെയോ സൂചിപ്പിക്കുന്നു. ‘ശക്തിയോടെ’ ഗ്രീക്കിനോട് അടുത്തുനിൽക്കുന്നു; ‘പൂർണശക്തിയോടെ’ എന്ന വ്യാഖ്യാനസൂചന അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: വായിൽനിന്ന് പുറപ്പെടുന്ന വാളിന്റെ ദർശനാത്മക പ്രതീകം
  choice: പ്രതീകത്തെ വ്യാഖ്യാനവികാസമില്ലാതെ അതേ ദർശനരൂപത്തിൽ നിലനിർത്തി.
  alternative: വാൾ ക്രിസ്തുവിന്റെ ന്യായവിധിവചനമാണെന്ന് മുഖ്യപാഠത്തിൽ തുറന്നു വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം പ്രതീകാത്മകമായ അപ്പോക്കലിപ്റ്റിക് ദൃശ്യം അവതരിപ്പിക്കുന്നു. വാളിനെ ദൈവിക ന്യായവിധിയോടോ ദൈവവചനത്തോടോ ബന്ധിപ്പിക്കാവുന്നതാണെങ്കിലും, ആ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് വാക്യത്തിന്റെ തുറന്ന പ്രതീകാത്മകതയെ അനാവശ്യമായി നിർണയിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ദർശനവിവരണ ശൈലി. ദീർഘവാക്യത്തിലെ മൂന്നു സമാന്തര ദൃശ്യങ്ങൾ അർദ്ധവിരാമങ്ങളാൽ ബന്ധിപ്പിച്ച് ഗ്രീക്ക് ഘടനയുടെ ഒഴുക്ക് നിലനിർത്തി.
