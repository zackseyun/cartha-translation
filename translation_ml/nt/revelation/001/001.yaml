id: REV.1.1
reference: Revelation 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: ml
  text: യേശുക്രിസ്തുവിന്റെ വെളിപ്പാട്[a], ഉടൻ[b] സംഭവിക്കേണ്ട കാര്യങ്ങൾ തന്റെ ദാസന്മാർക്കു കാണിച്ചുകൊടുക്കാൻ ദൈവം അത് അവനു നൽകി. തന്റെ ദൂതനെ അയച്ചുകൊണ്ട് അവൻ തന്റെ ദാസനായ യോഹന്നാനെ അത് അറിയിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യേശുക്രിസ്തുവിൽനിന്നുള്ള വെളിപ്പാട്’ എന്നോ ‘യേശുക്രിസ്തുവിനെക്കുറിച്ചുള്ള വെളിപ്പാട്’ എന്നോ വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ഷഷ്ഠീപ്രയോഗം ഈ ബന്ധം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാൻ അനുവദിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘ഉടൻ’ എന്നതിനു പകരം ‘വേഗത്തിൽ’ എന്നും വിവർത്തനം ചെയ്യാം; കാര്യങ്ങൾ സമീപഭാവിയിൽ സംഭവിക്കുമെന്നോ, ആരംഭിച്ചാൽ വേഗത്തിൽ സംഭവിക്കുമെന്നോ ഈ പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘അറിയിച്ചു’ എന്ന ക്രിയയ്ക്ക് ‘സൂചിപ്പിച്ചു’ അഥവാ ‘ചിഹ്നങ്ങളിലൂടെ അറിയിച്ചു’ എന്ന ഭാവവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: വെളിപ്പാട്
  rationale: മറഞ്ഞിരുന്നത് തുറന്നുകാട്ടൽ അഥവാ വെളിപ്പെടുത്തൽ എന്ന അർഥം നൽകുന്ന, മലയാള ബൈബിൾ ഭാഷയിലും പൊതുവായ ആധുനിക ഉപയോഗത്തിലും സ്വാഭാവികമായ പദം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശുക്രിസ്തുവിന്റെ
  rationale: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ മലയാളത്തിൽ ഉറച്ചതും സ്വാഭാവികവുമായ രൂപം ‘ക്രിസ്തു’ ആണ്. ഷഷ്ഠീവ്യാക്തി മൂലപാഠത്തിലെ genitive-ന്റെ ‘അവനിൽനിന്നുള്ളത്/അവനെക്കുറിച്ചുള്ളത്’ എന്ന സാധ്യതകൾ പൂർണമായി തീർപ്പാക്കുന്നില്ല; അവ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: ദൈവം അത് അവനു നൽകി
  rationale: ‘അവൻ’ യേശുക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ ദൈവവും യേശുവും തമ്മിലുള്ള മൂലപാഠത്തിലെ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: δεῖξαι
  choice: കാണിച്ചുകൊടുക്കാൻ
  rationale: ദർശനാത്മക സാഹചര്യത്തിനു യോജിക്കുന്നതും ഉദ്ദേശ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നതുമായ സ്വാഭാവിക മലയാളം.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: തന്റെ ദാസന്മാർക്ക്
  rationale: δοῦλος ഉടമസ്ഥതയും പൂർണവിധേയത്വവും സൂചിപ്പിക്കാമെങ്കിലും, ആധുനിക മാന്യമായ മലയാളത്തിൽ ‘ദാസൻ’ ആ ശക്തി സൂക്ഷിക്കുന്ന ബൈബിൾപരവും സ്വാഭാവികവുമായ പദമാണ്; ‘അടിമ’ ഇവിടെ അനാവശ്യമായി സാമൂഹിക അടിമത്തത്തിന്റെ മുൻനിര അർഥം ഉയർത്താം.
- source_word: ἃ δεῖ γενέσθαι
  choice: സംഭവിക്കേണ്ട കാര്യങ്ങൾ
  rationale: ബഹുവചനബന്ധവാക്യവും അനിവാര്യതയും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐν τάχει
  choice: ഉടൻ
  rationale: കാലസാമീപ്യമാണ് സന്ദർഭത്തിലെ സ്വാഭാവിക വായന; ‘വേഗത്തിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐσήμανεν
  choice: അറിയിച്ചു
  rationale: σημαίνω എന്നതിന്റെ ‘അറിയിക്കുക/സൂചിപ്പിക്കുക’ എന്ന അടിസ്ഥാനബോധം സുതാര്യമായ മലയാളത്തിൽ നൽകുന്നു; ചിഹ്നങ്ങളിലൂടെ അറിയിക്കൽ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: തന്റെ ദൂതനെ അയച്ച്
  rationale: ഗ്രീക്കിലെ means/intermediary ബന്ധം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: തന്റെ ദാസനായ യോഹന്നാനെ
  rationale: സ്വീകർത്താവായ യോഹന്നാനെയും അവന്റെ വിധേയത്വബന്ധത്തെയും വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: Ἀποκάλυψις Ἰησοῦ Χριστοῦ എന്നതിലെ genitive
  choice: ‘യേശുക്രിസ്തുവിന്റെ വെളിപ്പാട്’ എന്നു നൽകി, ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കിയില്ല.
  alternative: ‘യേശുക്രിസ്തുവിൽനിന്നുള്ള വെളിപ്പാട്’ അല്ലെങ്കിൽ ‘യേശുക്രിസ്തുവിനെക്കുറിച്ചുള്ള വെളിപ്പാട്’.
  rationale: ഗ്രീക്ക് genitive ഉറവിടം, ഉടമസ്ഥത, വിഷയം എന്നിവയിൽ ഒന്നിലധികം ഭാവങ്ങൾ അനുവദിക്കുന്നു. തുടർന്നുള്ള വാക്യം ദൈവം അത് യേശുവിനു നൽകിയെന്നു പറയുന്നതിനാൽ ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം അടിക്കുറിപ്പോടെ നിലനിർത്തുന്നു.
- issue: δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദാസൻ/ദാസന്മാർ
  alternative: അടിമ/അടിമകൾ
  rationale: ദൈവത്തോടുള്ള പൂർണവിധേയത്വവും ചേർന്നുനിൽപ്പും ‘ദാസൻ’ മലയാളത്തിൽ മാന്യമായി വഹിക്കുന്നു. ‘അടിമ’ മൂലപദത്തിന്റെ നിയമ-സാമൂഹിക ശക്തി കൂടുതൽ നേരിട്ട് നൽകുന്നുവെങ്കിലും, ഈ വാക്യത്തിൽ ആധുനിക വായനക്കാരനു തെറ്റായ മുൻനിര ഭാവം സൃഷ്ടിക്കാം.
- issue: ἐσήμανεν എന്ന ക്രിയയിലെ ചിഹ്നസൂചന
  choice: അറിയിച്ചു
  alternative: ചിഹ്നങ്ങളിലൂടെ അറിയിച്ചു / സൂചിപ്പിച്ചു
  rationale: ക്രിയയ്ക്ക് പൊതുവായി ‘അറിയിക്കുക’ എന്ന അർഥമുണ്ട്; വെളിപ്പാട് പുസ്തകത്തിന്റെ പ്രതീകാത്മക സ്വഭാവം ചിഹ്നഭാവത്തെ പ്രസക്തമാക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾ രജിസ്റ്റർ. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; ആശയബന്ധവും സർവനാമസൂചനയും നിലനിർത്തി. ‘യേശുക്രിസ്തു’, ‘വെളിപ്പാട്’, ‘ദൂതൻ’, ‘യോഹന്നാൻ’ എന്നീ മലയാളത്തിൽ ഉറച്ച രൂപങ്ങൾ ഉപയോഗിച്ചു.
