revisions:
- from: യേശുക്രിസ്തുവിന്റെ വെളിപ്പാട്[a]. ഉടൻ സംഭവിക്കേണ്ട കാര്യങ്ങൾ തന്റെ ദാസന്മാർക്കു കാണിച്ചുകൊടുക്കാൻ ദൈവം അത് അവനു നൽകി. അവൻ തന്റെ ദൂതനെ അയച്ച് തന്റെ ദാസനായ യോഹന്നാനെ അത് അറിയിച്ചു[b][c].
