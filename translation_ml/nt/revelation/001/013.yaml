id: REV.1.13
reference: Revelation 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: ml
  text: വിളക്കുതണ്ടുകളുടെ നടുവിൽ മനുഷ്യപുത്രനെപ്പോലെ ഒരുവൻ[a] ഉണ്ടായിരുന്നു. അവൻ പാദങ്ങൾവരെ എത്തുന്ന അങ്കി ധരിച്ചിരുന്നു; മാറിനു കുറുകെ പൊൻകച്ച കെട്ടിയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു മനുഷ്യപുത്രനെപ്പോലെയുള്ളവൻ.’ ഗ്രീക്ക് പ്രയോഗം ദാനീയേൽ 7:13-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; ഇവിടെ അത് മഹത്ത്വീകരിക്കപ്പെട്ട യേശുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ
  choice: നടുവിൽ
  rationale: ദർശനത്തിലെ സ്ഥലബന്ധം നേരിട്ടും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: λυχνιῶν
  choice: വിളക്കുതണ്ടുകളുടെ
  rationale: λυχνία വിളക്കിനെക്കാൾ അതു വയ്ക്കുന്ന തണ്ടിനെയാണ് സൂചിപ്പിക്കുന്നത്; വെളിപ്പാട് 1-ലെ പ്രതീകവുമായി ഇതു പൊരുത്തപ്പെടുന്നു.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: ഒരു മനുഷ്യപുത്രനെപ്പോലെയുള്ള ഒരുവൻ
  rationale: ഗ്രീക്കിൽ നിർദേശക ഉപപദമില്ലാത്തതിനാൽ ദാനീയേൽ 7:13-ലെ പ്രതിധ്വനി നിലനിർത്തിക്കൊണ്ട് ഇതിനെ മുഖ്യപാഠത്തിൽ സ്ഥിരമായ സ്ഥാനപ്പേരായി തീർച്ചപ്പെടുത്തുന്നില്ല.
- source_word: ἐνδεδυμένον
  choice: ധരിച്ച്
  rationale: ആ രൂപം അങ്കി ധരിച്ച നിലയിലാണെന്ന സ്ഥിതിവാചക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ποδήρη
  choice: പാദങ്ങൾവരെ എത്തുന്ന അങ്കി
  rationale: പാദംവരെ നീളുന്ന വസ്ത്രം എന്ന പദത്തിന്റെ കൃത്യമായ അർഥം സാധാരണ വായനക്കാർക്കു വ്യക്തമാക്കുന്നു.
- source_word: περιεζωσμένον
  choice: കെട്ടിയിരുന്നു
  rationale: കച്ച ശരീരത്തിനു ചുറ്റും ബന്ധിച്ച നിലയിലായിരുന്നുവെന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πρὸς τοῖς μαστοῖς
  choice: മാറിനു ചുറ്റും
  rationale: കച്ച അരയിലല്ല, ശരീരത്തിന്റെ മേൽഭാഗത്താണ് കെട്ടിയിരുന്നതെന്ന സ്ഥാനസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ζώνην χρυσᾶν
  choice: പൊൻകച്ച
  rationale: ζώνη എന്നത് കച്ചയെയോ അരപ്പട്ടയെയോ സൂചിപ്പിക്കാം; ഇവിടെ മാറിനു ചുറ്റുമുള്ള ദർശനാത്മക വസ്ത്രവിവരണത്തിന് ‘കച്ച’ യോജിക്കുന്നു.
theological_decisions:
- issue: ὅμοιον υἱὸν ἀνθρώπου എന്ന പ്രയോഗത്തിന്റെ ക്രിസ്തുവിനെക്കുറിച്ചുള്ള സൂചന
  choice: മുഖ്യപാഠത്തിൽ ‘ഒരു മനുഷ്യപുത്രനെപ്പോലെയുള്ള ഒരുവൻ’ എന്നു നൽകി.
  alternative: ‘മനുഷ്യപുത്രനെപ്പോലെയുള്ള ഒരുവൻ’ എന്നു സ്ഥാനപ്പേരിന്റെ അർഥത്തിൽ നൽകാം.
  rationale: ഇത് ഗ്രീക്ക് വാക്യത്തിന്റെ അനിശ്ചിത രൂപവും ദാനീയേൽ 7:13-ലേക്കുള്ള സൂചനയും സംരക്ഷിക്കുന്നു. ദർശനം മഹത്ത്വീകരിക്കപ്പെട്ട യേശുവിനെയാണ് ബാധകമാക്കുന്നതെന്ന പരമ്പരാഗത ക്രിസ്തുശാസ്ത്ര വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ദർശനവിവരണ ശൈലി പാലിച്ചു. ‘വിളക്കുതണ്ട്,’ ‘അങ്കി,’ ‘പൊൻകച്ച’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും മൂലരൂപകങ്ങളോട് ചേർന്നുനിൽക്കുന്നതുമാണ്.
