- from: വിളക്കുതണ്ടുകളുടെ നടുവിൽ ഒരു മനുഷ്യപുത്രനെപ്പോലെയുള്ള ഒരുവൻ[a] ഉണ്ടായിരുന്നു. അവൻ പാദങ്ങൾവരെ എത്തുന്ന അങ്കി ധരിച്ച്, മാറിനു ചുറ്റും പൊൻകച്ച കെട്ടിയിരുന്നു.
