id: REV.1.19
reference: Revelation 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γράψον οὖν ἃ εἶδες καὶ ἃ εἰσὶν καὶ ἃ μέλλει ⸀γίνεσθαι μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/019.yaml
  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: ml
  text: അതിനാൽ, നീ കണ്ടവയും ഇപ്പോൾ ഉള്ളവയും ഇവയ്ക്കുശേഷം സംഭവിക്കാൻ പോകുന്നവയും[a] എഴുതുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇവയ്ക്കുശേഷം സംഭവിക്കാനുള്ളവ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ ചില സന്ദർഭങ്ങളിൽ ലളിതമായ ഭാവികാല അർഥം നൽകാമെങ്കിലും, പലപ്പോഴും ഉടൻ സംഭവിക്കാനിരിക്കുന്നതിന്റെ ഭാവം വഹിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: എഴുതുക
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലെ ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള ബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻപുള്ള ദർശനത്തോടും നിയോഗത്തോടുമുള്ള നിഗമനപരമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἃ εἶδες
  choice: നീ കണ്ടവ
  rationale: ഇതിനകം കണ്ട ദർശനവിഷയങ്ങളെ സൂചിപ്പിക്കുന്ന ഭൂതകാലരൂപം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἃ εἰσὶν
  choice: ഇപ്പോൾ ഉള്ളവ
  rationale: വർത്തമാന യാഥാർഥ്യങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഇപ്പോൾ’ ചേർത്തിരിക്കുന്നു; ഗ്രീക്കിലെ ബഹുവചനബന്ധസർവനാമത്തിന്റെ ആശയം ‘ഉള്ളവ’ നിലനിർത്തുന്നു.
- source_word: μέλλει γίνεσθαι
  choice: സംഭവിക്കാനിരിക്കുന്നവ
  rationale: μέλλω സഹിതമുള്ള അനന്തരൂപം സൂചിപ്പിക്കുന്ന വരാനിരിക്കുന്നതോ ആസന്നമോ ആയ സംഭവത്തിന്റെ ഭാവം ലളിതമായ ഭാവികാലമാക്കി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: μετὰ ταῦτα
  choice: ഇവയ്ക്കുശേഷം
  rationale: ബഹുവചന സൂചകപദവും കാലക്രമബന്ധവും ഔപചാരികമായെങ്കിലും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: വെളിപ്പാടുസാഹിത്യത്തിലെ μέλλει എന്ന ക്രിയയുടെ കാലസൂചന
  choice: ആസന്നതയുടെ ഭാവം ഉൾക്കൊള്ളുന്ന ‘സംഭവിക്കാനിരിക്കുന്നവ’
  alternative: ലളിതമായ ഭാവികാല അർഥത്തിൽ ‘സംഭവിക്കുന്നവ’
  rationale: ഗ്രീക്ക് പ്രയോഗം പലപ്പോഴും സംഭവിക്കാൻ പോകുന്നതെന്നോ ആസന്നമായതെന്നോ ഉള്ള ഭാവം നൽകുന്നു. അത് മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും, അവസാനകാല സംഭവങ്ങളുടെ സമയത്തെക്കുറിച്ചുള്ള വിശാലമായ തർക്കം തീർപ്പാക്കാതെ ലളിതഭാവി സാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ മൂന്ന് സമാന്തര ഘടകങ്ങളും ‘കണ്ടവയും—ഉള്ളവയും—സംഭവിക്കാനിരിക്കുന്നവയും’ എന്ന ക്രമത്തിൽ സൂക്ഷിച്ചിട്ടുണ്ട്. ‘ഇപ്പോൾ’ ഉറവിടത്തിൽ പ്രത്യേകം പദമായി ഇല്ലെങ്കിലും εἰσίν എന്ന വർത്തമാനകാലത്തിന്റെ അർഥം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കാൻ ചേർത്തതാണ്.
