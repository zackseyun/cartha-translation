id: REV.1.5
reference: Revelation 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: ml
  text: വിശ്വസ്ത സാക്ഷിയും മരിച്ചവരിൽ ആദ്യജാതനും ഭൂമിയിലെ രാജാക്കന്മാരുടെ അധിപനുമായ യേശു മശീഹയിൽനിന്നും[a]. നമ്മെ സ്നേഹിക്കുന്നവനും തന്റെ രക്തത്താൽ നമ്മുടെ പാപങ്ങളിൽനിന്ന് നമ്മെ മോചിപ്പിച്ചവനുമായ[b] അവന്—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യേശു ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός എന്നത് ‘മശീഹ’ എന്ന സ്ഥാനപ്പേരാണ്.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികൾ ‘തന്റെ രക്തത്താൽ നമ്മുടെ പാപങ്ങളിൽനിന്ന് നമ്മെ മോചിപ്പിച്ചു’ എന്നതിനു പകരം ‘തന്റെ രക്തത്തിൽ നമ്മുടെ പാപങ്ങളിൽനിന്ന് നമ്മെ കഴുകി ശുദ്ധീകരിച്ചു’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός ഇവിടെ പേരിന്റെ ഭാഗംപോലെ മാത്രമല്ല, അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായും പ്രവർത്തിക്കുന്നു. അതിനാൽ പാരമ്പര്യ ലിപ്യന്തരണമായ ‘ക്രിസ്തു’ എന്നതിനു പകരം അർത്ഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: ὁ μάρτυς ὁ πιστός
  choice: വിശ്വസ്തസാക്ഷി
  rationale: μάρτυς ഇവിടെ സാക്ഷ്യം വഹിക്കുന്നവനെയാണ് സൂചിപ്പിക്കുന്നത്; നിർബന്ധമായും രക്തസാക്ഷിയെയല്ല. πιστός എന്നത് സാക്ഷിയുടെ വിശ്വസ്തതയും ആശ്രയയോഗ്യതയും നിലനിർത്തുന്നു.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: മരിച്ചവരിൽ ആദ്യജാതൻ
  rationale: πρωτότοκος എന്ന ബൈബിൾരൂപകം നിലനിർത്തിക്കൊണ്ട് τῶν νεκρῶν എന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘ആദ്യം ഉയിർത്തെഴുന്നേറ്റവൻ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കിയിട്ടില്ല.
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: ഭൂമിയിലെ രാജാക്കന്മാരുടെ അധിപൻ
  rationale: ἄρχων സൂചിപ്പിക്കുന്ന ഭരണാധികാരവും രാജാക്കന്മാരുടെമേലുള്ള മേൽക്കോയ്മയും ‘അധിപൻ’ വ്യക്തമായി നൽകുന്നു; γῆ വെളിപ്പാടിന്റെ വിശാലസന്ദർഭത്തിൽ ‘ഭൂമി’ എന്നാണ്.
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: നമ്മെ സ്നേഹിക്കുന്നവനായ അവന്
  rationale: വർത്തമാനകാല കൃതന്തമായ ἀγαπῶντι സൂചിപ്പിക്കുന്ന തുടരുന്ന സ്നേഹം ‘സ്നേഹിക്കുന്നവൻ’ നിലനിർത്തുന്നു. വാക്യത്തിൽ തുടർന്നുള്ള വിശേഷണത്തോടു ചേർത്ത് ‘...വനുമായ അവന്’ എന്നു രൂപപ്പെടുത്തി.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: നമ്മുടെ പാപങ്ങളിൽനിന്ന് നമ്മെ മോചിപ്പിച്ചവൻ
  rationale: λύωയുടെ അഴിച്ചുവിടുക/സ്വതന്ത്രമാക്കുക എന്ന വിമോചനചിത്രം ‘മോചിപ്പിക്കുക’ പകരുന്നു; ἐκ സൂചിപ്പിക്കുന്ന വേർപാട് ‘പാപങ്ങളിൽനിന്ന്’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: തന്റെ രക്തത്താൽ
  rationale: ഇവിടെ ἐν മാർഗമോ ഉപകരണമോ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ ‘-ത്താൽ’ ഉപയോഗിച്ചു; രക്തത്തെക്കുറിച്ചുള്ള ബലിദാനഭാഷ വിശദീകരിച്ച് വിപുലീകരിച്ചിട്ടില്ല.
theological_decisions:
- issue: λύσαντι എന്ന പാഠവും λούσαντι എന്ന പാഠഭേദവും
  choice: മോചിപ്പിച്ചവൻ
  alternative: തന്റെ രക്തത്തിൽ നമ്മുടെ പാപങ്ങൾ കഴുകിക്കളഞ്ഞവൻ
  rationale: നൽകിയ SBLGNT പാഠം λύσαντι (‘മോചിപ്പിച്ചു/അഴിച്ചുവിട്ടു’) എന്നാണ്. പ്രസിദ്ധവും ദൈവശാസ്ത്രപരമായി ശ്രദ്ധേയവുമായ λούσαντι (‘കഴുകി’) എന്ന പാഠഭേദം മുഖ്യപാഠത്തിലേക്ക് കലർത്താതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός അഭിഷിക്തനായവനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ്. അതിനാൽ അർത്ഥം വഹിക്കുന്ന ‘മശീഹ’ മുഖ്യപാഠത്തിൽ നൽകി; പരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: πρωτότοκος τῶν νεκρῶν എന്ന പ്രയോഗത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: മരിച്ചവരിൽ ആദ്യജാതൻ
  alternative: മരിച്ചവരിൽനിന്ന് ആദ്യം ഉയിർത്തെഴുന്നേറ്റവൻ
  rationale: ‘ആദ്യജാതൻ’ എന്നത് കാലക്രമത്തിലെ ആദ്യത്വത്തിനൊപ്പം പദവിയും മേൽക്കോയ്മയും സൂചിപ്പിക്കാവുന്ന ബൈബിൾരൂപകമാണ്. അതിനെ ‘ആദ്യം ഉയിർത്തെഴുന്നേറ്റവൻ’ എന്നു മാത്രം നിർവചിച്ച് അതിന്റെ വ്യാപ്തി ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. തുടർച്ചയായ വാക്യത്തിന്റെ ഭാഗമാണെന്നതിനാൽ തുടക്കത്തിലെ ‘നിന്നും’ ബന്ധവും അവസാനത്തിലെ ദീർഘവിരാമവും നിലനിർത്തി. പട്ടികയിലെ സമാന്തര സ്ഥാനപ്പേരുകൾ ‘-യും ... -നും ... -മായ’ ഘടനയിൽ സ്വാഭാവികമാക്കി.
