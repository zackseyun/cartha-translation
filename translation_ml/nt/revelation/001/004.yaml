reference: Revelation 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: ml
  text: 'യോഹന്നാൻ, ഏഷ്യയിലെ ഏഴു സഭകൾക്ക്: ആയിരിക്കുന്നവനും ആയിരുന്നവനും വരുന്നവനുമായവനിൽനിന്ന്[a], അവന്റെ സിംഹാസനത്തിന്റെ മുമ്പിലുള്ള ഏഴു ആത്മാക്കളിൽനിന്ന്[b] നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പരമ്പരാഗതമായി: ‘ആയിരിക്കുന്നവനും ആയിരുന്നവനും വരുവാനുള്ളവനുമായവനിൽനിന്ന്.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ഏഴു ആത്മാക്കൾ’ എന്നത് പരിശുദ്ധാത്മാവിന്റെ പൂർണതയെ പ്രതീകാത്മകമായി സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ ഏഴു സ്വർഗീയ ആത്മാക്കളെ സൂചിപ്പിക്കാം. ഗ്രീക്ക് പാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഏഴു ആത്മാക്കൾ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: ഏഴു സഭകൾക്ക്
  rationale: ഈ ക്രൈസ്തവ ലേഖനസന്ദർഭത്തിൽ ἐκκλησία എന്നതിന് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപദം ‘സഭ’ ആണ്.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: ഏഷ്യയിലെ
  rationale: ഗ്രീക്കിലെ സ്ഥലനാമം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആധുനിക ഭൂഖണ്ഡമൊട്ടാകെയല്ല, റോമൻ പ്രവിശ്യയായ ഏഷ്യയാണ്.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ
  rationale: ലേഖനാശംസയുടെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൃപയും സമാധാനവും എന്ന ഗ്രീക്ക് ക്രമം നിലനിർത്തുന്നു.
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: ഇരിക്കുന്നവനും ഇരുന്നവനും വരുന്നവനുമായ അവനിൽനിന്നും
  rationale: കാലത്രയത്തിലുള്ള ദൈവിക വിശേഷണം വ്യക്തിപരമായ ശീർഷകമായി നിലനിർത്തുന്നു. ὁ ἐρχόμενος എന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ സജീവഭാവം ‘വരുന്നവൻ’ എന്നു പകരുന്നു.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: ഏഴു ആത്മാക്കളിൽനിന്നും
  rationale: ഗ്രീക്കിലെ ബഹുവചനം വ്യാഖ്യാനിച്ച് ഏകവചനമാക്കാതെ അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: അവന്റെ സിംഹാസനത്തിനു മുമ്പിലുള്ള
  rationale: സ്ഥാനം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു; ആത്മാക്കളുടെ സ്വഭാവത്തെ അതിലധികം നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ‘ഇരിക്കുന്നവനും ഇരുന്നവനും വരുന്നവനും’ എന്ന വിശേഷണത്തിന്റെ വ്യക്തിത്വം
  choice: ദൈവത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ ശീർഷകമായി ‘...അവനിൽനിന്നും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഇരിക്കുന്നവനിൽനിന്നും, ഇരുന്നവനിൽനിന്നും, വരുവാനുള്ളവനിൽനിന്നും’ എന്ന പരമ്പരാഗത രൂപം.
  rationale: ഗ്രീക്കിൽ ἀπό എന്നതിനുശേഷമുള്ള വ്യാകരണപരമായി അസാധാരണമായ മാറ്റമില്ലാത്ത ദൈവിക ശീർഷകത്തിന്റെ ഗൗരവം നിലനിർത്തുകയും മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: ‘ഏഴു ആത്മാക്കൾ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ബഹുവചനമായ ‘ഏഴു ആത്മാക്കൾ’ നിലനിർത്തി.
  alternative: പരിശുദ്ധാത്മാവിന്റെ പൂർണതയുടെ പ്രതീകം; അല്ലെങ്കിൽ ദൈവസിംഹാസനത്തിനു മുമ്പിലുള്ള ഏഴു സ്വർഗീയ ആത്മാക്കൾ.
  rationale: ഗ്രീക്ക് പാഠം ബഹുവചനമാണ്; വിവാദത്തിലുള്ള തിരിച്ചറിയൽ പ്രധാനപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സാധ്യതകൾ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ലേഖനത്തിന്റെ അഭിസംബോധനാരൂപം സംരക്ഷിച്ചു; ദൈവിക ശീർഷകത്തിന്റെ ആവർത്തനഗൗരവവും ‘ഏഴു ആത്മാക്കൾ’ എന്ന വ്യാഖ്യാനതുറന്ന നിലയും നിലനിർത്തി.
