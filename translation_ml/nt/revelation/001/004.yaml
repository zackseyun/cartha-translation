    issue: The divine title is rendered with “ഇരിക്കുന്നവനും ഇരുന്നവനും.”
    rationale: These forms naturally convey ‘the one sitting’ and ‘the one who sat,’ while the Greek means ‘the one who is and who was.’ Replacing them with existential forms preserves the source title’s temporal and theological force without adding interpretation.
