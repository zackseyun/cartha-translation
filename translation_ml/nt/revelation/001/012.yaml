- from: എന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്ന ശബ്ദം ആരുടേതെന്നു കാണാൻ ഞാൻ തിരിഞ്ഞു.[a] തിരിഞ്ഞപ്പോൾ ഏഴു സ്വർണ്ണവിളക്കുതണ്ടുകൾ ഞാൻ കണ്ടു.
  to: എന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്ന ശബ്ദത്തെ കാണാൻ ഞാൻ തിരിഞ്ഞു.[a] തിരിഞ്ഞപ്പോൾ ഏഴു സ്വർണവിളക്കുതണ്ടുകൾ ഞാൻ കണ്ടു.
  rationale: The revision removes the unsupported expansion “ആരുടേതെന്നു” while preserving the original’s unusual expression of turning to see a voice. It retains the imperfect sense of ongoing speech, the antecedent action of turning, and the concrete term for seven golden lampstands. The footnote now properly presents the “with me” rendering as an alternative to the idiomatic main-text “to me.”
