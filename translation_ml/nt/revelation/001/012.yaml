id: REV.1.12
reference: Revelation 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: ml
  text: എന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്ന ശബ്ദത്തെ കാണാൻ ഞാൻ തിരിഞ്ഞു.[a] തിരിഞ്ഞപ്പോൾ ഏഴു സ്വർണവിളക്കുതണ്ടുകൾ ഞാൻ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “എന്നോടൊപ്പം സംസാരിച്ചുകൊണ്ടിരുന്ന.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, “എന്നോടൊപ്പം സംസാരിച്ചുകൊണ്ടിരുന്ന” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: ഞാൻ തിരിഞ്ഞു
  rationale: ശരീരം തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന aorist രൂപം ലളിതവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: βλέπειν τὴν φωνὴν
  choice: ശബ്ദം ആരുടേതെന്നു കാണാൻ
  rationale: ‘ശബ്ദത്തെ കാണുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം ശബ്ദത്തിന്റെ ഉറവിടത്തെ കാണുക എന്നതാണ്; മലയാളത്തിൽ അർത്ഥം വ്യക്തമായി ലഭിക്കാൻ സ്വാഭാവികമായ ഈ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: φωνὴν
  choice: ശബ്ദം
  rationale: φωνή ഇവിടെ സംസാരിക്കുന്ന ശബ്ദത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശബ്ദം’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἐλάλει μετ’ ἐμοῦ
  choice: എന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്ന
  rationale: Imperfect രൂപത്തിലെ തുടരുന്ന പ്രവൃത്തിയെ ‘സംസാരിച്ചുകൊണ്ടിരുന്ന’ എന്നു പ്രകടമാക്കുന്നു; μετά + genitive-ന്റെ ‘കൂടെ/ഒപ്പം’ എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐπιστρέψας
  choice: തിരിഞ്ഞപ്പോൾ
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള adverbial aorist participle സൂചിപ്പിക്കുന്ന സമയക്രമം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ലളിതമായ aorist അർത്ഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἑπτὰ λυχνίας χρυσᾶς
  choice: ഏഴു സ്വർണ്ണവിളക്കുതണ്ടുകൾ
  rationale: λυχνία വിളക്കിനെയല്ല, വിളക്ക് വയ്ക്കുന്ന തണ്ടിനെയാണ് സൂചിപ്പിക്കുന്നത്; χρυσᾶς അതിന്റെ സ്വർണ്ണനിർമ്മിതിയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: അപ്പോക്കലിപ്റ്റിക് പ്രതീകമായ λυχνίας-ന്റെ പരിഭാഷ
  choice: വിളക്കുതണ്ടുകൾ
  alternative: വിളക്കുകൾ
  rationale: വെളിപ്പാട് 1:20-ൽ ഇതേ വസ്തുക്കൾ പ്രതീകാത്മകമായി വ്യാഖ്യാനിക്കപ്പെടുന്നതിനാൽ വിളക്കിനെയും അതു വയ്ക്കുന്ന തണ്ടിനെയും വേർതിരിക്കുന്ന കൃത്യമായ പദം നിലനിർത്തുന്നു.
- issue: ‘ശബ്ദത്തെ കാണുക’ എന്ന അസാധാരണ ഗ്രീക്ക് പ്രയോഗം
  choice: ശബ്ദം ആരുടേതെന്നു കാണാൻ
  alternative: ശബ്ദത്തെ കാണാൻ
  rationale: മൂലത്തിലെ ദൃശ്യ-ശ്രാവ്യ സംഘർഷം അക്ഷരാർഥത്തിൽ നിലനിർത്തിയാൽ മലയാളത്തിൽ അർത്ഥശൂന്യമോ തെറ്റിദ്ധരിപ്പിക്കുന്നതോ ആകാം; ശബ്ദത്തിന്റെ ഉറവിടത്തെ കാണാനുള്ള തിരിഞ്ഞുനോട്ടം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘വിളക്കുതണ്ട്’ എന്ന കൃത്യമായ വസ്തുനാമം തുടർന്നുള്ള പ്രതീകവ്യാഖ്യാനവുമായി പദസുസ്ഥിരത കാത്തുസൂക്ഷിക്കുന്നു.
