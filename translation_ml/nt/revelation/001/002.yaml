id: REV.1.2
reference: Revelation 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: ml
  text: അവൻ ദൈവത്തിന്റെ വചനത്തിനും മശീഹയായ യേശുവിന്റെ സാക്ഷ്യത്തിനും[a]—താൻ കണ്ട എല്ലാറ്റിനും—സാക്ഷ്യം വഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മശീഹയായ യേശുവിൽനിന്നുള്ള സാക്ഷ്യത്തിനും’ അല്ലെങ്കിൽ ‘മശീഹയായ യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യത്തിനും.’ ഗ്രീക്ക് പ്രയോഗം ഈ രണ്ടർഥത്തിലും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: സാക്ഷ്യം വഹിച്ചു
  rationale: μαρτυρέω എന്ന ക്രിയയുടെ സാക്ഷി/സാക്ഷ്യ അർഥം നിലനിർത്തുന്ന, സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: λόγον
  choice: വചനം
  rationale: ഇവിടെ λόγος ദൈവം അറിയിച്ച വചനത്തെ സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തിന്റെ വചനം’ മലയാളത്തിലെ സ്ഥിരവും സ്വാഭാവികവുമായ ബൈബിൾപ്രയോഗമാണ്.
- source_word: μαρτυρίαν
  choice: സാക്ഷ്യം
  rationale: ἐμαρτύρησεν എന്ന സമാനമൂലമുള്ള ക്രിയയോടുള്ള പദബന്ധം നിലനിർത്തുകയും ഗ്രീക്കിലെ സാക്ഷ്യസങ്കൽപ്പം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരിന്റെ അർഥം വഹിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിനായി ‘മശീഹയായ യേശു’ എന്നു രൂപപ്പെടുത്തി.
- source_word: ὅσα εἶδεν
  choice: താൻ കണ്ട എല്ലാറ്റിനും
  rationale: ὅσα എന്നതിലെ സമഗ്രത നിലനിർത്തുന്നു; മുൻപറഞ്ഞ സാക്ഷ്യവിഷയങ്ങളെ സംഗ്രഹിക്കുന്ന അനുബന്ധവാക്യമായി സ്വാഭാവികമായി വായിക്കാം.
- source_word: τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: ദൈവത്തിന്റെ വചനത്തിനും മശീഹയായ യേശുവിന്റെ സാക്ഷ്യത്തിനും
  rationale: ‘സാക്ഷ്യം വഹിച്ചു’ എന്ന ക്രിയയുടെ ഏകോപിത വിഷയങ്ങളായി രണ്ട് നാമഘടകങ്ങളും നിലനിർത്തുന്നു; Ἰησοῦ Χριστοῦ എന്ന ഷഷ്ഠീവ്യാകരണഘടകത്തിലെ അർഥസന്ദിഗ്ധത പ്രധാനപാഠത്തിൽ പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἡ μαρτυρία Ἰησοῦ Χριστοῦ എന്നതിലെ genitive അർഥസന്ദിഗ്ധത
  choice: മശീഹയായ യേശുവിന്റെ സാക്ഷ്യം
  alternative: മശീഹയായ യേശുവിൽനിന്നുള്ള സാക്ഷ്യം / മശീഹയായ യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യം
  rationale: ഗ്രീക്ക് പ്രയോഗം യേശു നൽകുന്ന സാക്ഷ്യത്തെയോ യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യത്തെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിലെ ‘യുടെ’ ഘടന ഈ രണ്ടിൽ ഒന്നിനെ നിർബന്ധമായി തിരഞ്ഞെടുക്കുന്നില്ല; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός സ്ഥാനപ്പേരിന്റെ അർഥം സജീവമായതിനാൽ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. സാക്ഷ്യവുമായി ബന്ധപ്പെട്ട ക്രിയ-നാമ പദബന്ധവും ഗ്രീക്കിലെ യഥാർഥ അർഥസന്ദിഗ്ധതയും നിലനിർത്തി; ὅσα εἶδεν മുൻപറഞ്ഞതിന്റെ സംഗ്രഹമാണെന്ന് വായനയിൽ വ്യക്തമാക്കാൻ ദീർഘരേഖകൾ ഉപയോഗിച്ചു.
