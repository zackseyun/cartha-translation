id: REV.1.17
reference: Revelation 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: ml
  text: 'അവനെ കണ്ടപ്പോൾ ഞാൻ മരിച്ചവനെപ്പോലെ അവന്റെ കാൽക്കൽ വീണു. അവൻ തന്റെ വലങ്കൈ എന്റെമേൽ വെച്ചുകൊണ്ട് പറഞ്ഞു: “ഭയപ്പെടേണ്ട. ഞാൻ ആദ്യനും അന്ത്യനും ആകുന്നു,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὅτε εἶδον αὐτόν
  choice: അവനെ കണ്ടപ്പോൾ
  rationale: ὅτεയുടെ കാലസൂചന സ്വാഭാവികമായി നൽകുന്നു. മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന καί മലയാളത്തിൽ പ്രത്യേകം ‘അപ്പോൾ/കൂടാതെ’ എന്നു ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ തന്നെ പ്രകടമാകുന്നു.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: അവന്റെ കാൽക്കൽ വീണു
  rationale: ഒരാളുടെ മുമ്പിൽ, അയാളുടെ പാദത്തിനരികിൽ വീഴുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: ὡς νεκρός
  choice: മരിച്ചവനെപ്പോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ വ്യക്തമായി നിലനിർത്തുന്നു; യോഹന്നാൻ യഥാർഥത്തിൽ മരിച്ചുവെന്ന് അർഥമാക്കുന്നില്ല.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: അവൻ തന്റെ വലങ്കൈ എന്റെമേൽ വെച്ചു
  rationale: τίθημι എന്നതിന്റെ ‘വെക്കുക’ എന്ന അർഥവും, പ്രതീകാത്മക പ്രാധാന്യമുള്ള ‘വലങ്കൈ’ എന്ന വ്യക്തമായ സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: λέγων
  choice: വെച്ചുകൊണ്ട് പറഞ്ഞു
  rationale: കൈ വെക്കലിനോടൊപ്പം നടന്ന സംസാരത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്ക് വർത്തമാന കൃതന്തത്തിന്റെ സമകാലികത നിലനിർത്തുന്നു.
- source_word: Μὴ φοβοῦ
  choice: ഭയപ്പെടേണ്ട
  rationale: നിഷേധ ആജ്ഞയുടെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളരൂപം.
- source_word: ἐγώ εἰμι
  choice: ഞാൻ … ആകുന്നു
  rationale: ഊന്നലുള്ള സ്വയംപരിചയപ്പെടുത്തൽ നിലനിർത്തുകയും പിന്നാലെയുള്ള വിശേഷണപദങ്ങളുമായി വ്യാകരണപരമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: ആദ്യനും അന്ത്യനും
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വിശേഷണങ്ങൾ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരുകളായി പ്രവർത്തിക്കുന്നു. മലയാളത്തിൽ ലിംഗ-വചനസമ്മതിയോടെ അവയുടെ സ്ഥാനപ്പേർസ്വഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ὁ πρῶτος καὶ ὁ ἔσχατος എന്നത് സ്ഥാനപ്പേരായി വിവർത്തനം ചെയ്യൽ
  choice: ആദ്യനും അന്ത്യനും
  alternative: ആദ്യത്തേതും അവസാനത്തേതും
  rationale: സന്ദർഭത്തിൽ ഇത് സംസാരിക്കുന്ന വ്യക്തിയുടെ സ്വയംവിശേഷണമാണ്; വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ‘-നും’ രൂപം ഈ സ്ഥാനപ്പേർസ്വഭാവം വ്യക്തമാക്കുന്നു. അതേസമയം വാക്യം പറയുന്നതിലപ്പുറം പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ἐγώ εἰμι എന്നതിന്റെ ബലം
  choice: ഞാൻ … ആകുന്നു
  alternative: ഞാനാണ്
  rationale: പിന്നാലെയുള്ള ഇരട്ട സ്ഥാനപ്പേരുമായി ചേർന്ന ഔപചാരിക സ്വയംപരിചയപ്പെടുത്തൽ സംരക്ഷിക്കുന്നു. ‘ഞാനാണ്’ എന്നതും സാധ്യമെങ്കിലും, ‘ആകുന്നു’ കൂടുതൽ ഗൗരവമുള്ളതും ഘടനാപരമായി സുതാര്യവുമാണ്.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വെളിപ്പാട് സാഹിത്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ഉറവിടത്തിൽ പ്രസക്തമായ യഥാർഥ പാഠഭേദമോ മലയാളത്തിൽ നിർബന്ധമായി വിശദീകരിക്കേണ്ട അർഥദ്വയമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല. ഇംഗ്ലീഷ് consultation layer-ലെ [a] ചിഹ്നത്തിന്റെ സ്ഥാനം അതിന്റെ അടിക്കുറിപ്പിലെ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ അത് അനുകരിച്ചിട്ടില്ല.
