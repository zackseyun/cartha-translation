id: REV.1.18
reference: Revelation 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: ml
  text: ജീവിക്കുന്നവൻ ഞാൻ തന്നെയാണ്—ഞാൻ മരിച്ചവനായിത്തീർന്നു[a]; ഇതാ, ഞാൻ എന്നെന്നേക്കും ജീവിച്ചിരിക്കുന്നു[b]. മരണത്തിന്റെയും പാതാളത്തിന്റെയും താക്കോലുകൾ എന്റെ കൈവശമുണ്ട്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ സ്വാഭാവികമായി: ‘ഞാൻ മരിച്ചിരുന്നു.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഞാൻ മരിച്ചവനായിത്തീർന്നു’ എന്നാണ്; മരണത്തിലേക്കുള്ള മാറ്റത്തിന് അത് ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘യുഗങ്ങളുടെ യുഗങ്ങളിലേക്ക്’; അവസാനമില്ലാത്ത ദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന ഭാഷാശൈലി.
    reason: lexical_alternative
  - marker: c
    text: ‘പാതാളം’ എന്നത് മരിച്ചവരുടെ ലോകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അന്തിമശിക്ഷയുടെ സ്ഥലത്തെ മാത്രമല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: ജീവിക്കുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഇവിടെ ഒരു വിശേഷണപ്പേരായി പ്രവർത്തിക്കുന്നു. ‘ജീവിക്കുന്നവൻ’ എന്നത് ആ ശീർഷകസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐγενόμην νεκρός
  choice: ഞാൻ മരിച്ചവനായിത്തീർന്നു
  rationale: γίνομαι എന്ന ക്രിയ മരണാവസ്ഥയിലേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു; വെറും ‘മരിച്ചിരുന്നു’ എന്നതിനെക്കാൾ മൂലഭാഷയിലെ മാറ്റത്തിന്റെ ഭാവം ഇത് വ്യക്തമാക്കുന്നു.
- source_word: ἰδού
  choice: എന്നാൽ ഇതാ
  rationale: ἰδού എന്ന ശ്രദ്ധാകർഷക പദത്തിന്റെ സജീവത ‘ഇതാ’ നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ മരണവും ഇപ്പോഴത്തെ ജീവനുമുള്ള ശക്തമായ വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘എന്നാൽ’ ചേർത്തു.
- source_word: ζῶν εἰμι
  choice: ഞാൻ ജീവിച്ചിരിക്കുന്നു
  rationale: കൃദന്തവും εἰμίയും ചേർന്ന പ്രയോഗം ഇപ്പോഴത്തെ നിലയെ സൂചിപ്പിക്കുന്നു. ‘ജീവിച്ചിരിക്കുന്നു’ മരണത്തിനു ശേഷമുള്ള തുടർന്നുനിൽക്കുന്ന ജീവാവസ്ഥയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: ‘യുഗങ്ങളുടെ യുഗങ്ങളിലേക്ക്’ എന്ന അക്ഷരാർഥമുള്ള ഗ്രീക്ക് പ്രയോഗം അവസാനമില്ലാത്ത ദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന ഭാഷാശൈലിയാണ്; അതിന്റെ സ്വാഭാവിക മലയാള തുല്യം ‘എന്നെന്നേക്കും’ ആണ്.
- source_word: κλεῖς
  choice: താക്കോലുകൾ
  rationale: നേരിട്ടുള്ള മലയാള തുല്യം; ഈ ദൃശ്യരൂപം അധികാരവും നിയന്ത്രണവും സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ θανάτου
  choice: മരണത്തിന്റെ
  rationale: ‘താക്കോലുകൾ’ എന്നതിനോടു ബന്ധപ്പെട്ട ഷഷ്ഠീവ്യാകരണബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ മരണത്തെ വ്യക്തിവൽക്കരിക്കേണ്ട നിർബന്ധമില്ല.
- source_word: τοῦ ᾅδου
  choice: പാതാളത്തിന്റെ
  rationale: ᾅδης മരിച്ചവരുടെ ലോകം/വാസസ്ഥലം എന്ന ആശയമാണ് നൽകുന്നത്. മലയാള ബൈബിൾഭാഷയിൽ ‘പാതാളം’ ഈ വ്യത്യാസം നിലനിർത്തുകയും അന്തിമശിക്ഷയെ സൂചിപ്പിക്കുന്ന ‘നരകം’ എന്നതുമായുള്ള കലരൽ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ᾅδης എന്ന പദത്തിന്റെ അന്ത്യകാലസംബന്ധമായ വിവർത്തനം
  choice: പാതാളം
  alternative: മരിച്ചവരുടെ ലോകം; കല്ലറ; നരകം
  rationale: വാക്യം മരണത്തെയും ᾅδης-നെയും ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ യാഥാർഥ്യങ്ങളായി പറയുന്നു. ‘പാതാളം’ എന്നത് ഇതിനെ ശാരീരിക കല്ലറയായി മാത്രം ചുരുക്കുകയോ അന്തിമശിക്ഷയായ നരകവുമായി ഒത്തുചേർക്കുകയോ ചെയ്യാതെ മൂലപദത്തിന്റെ ആശയവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
- issue: ἐγενόμην νεκρός എന്നതിലെ മരണത്തിലേക്കുള്ള മാറ്റം
  choice: മരിച്ചവനായിത്തീർന്നു
  alternative: മരിച്ചിരുന്നു
  rationale: ഈ രൂപം പുത്രന്റെ യഥാർഥ മരണത്തെയും അതിലേക്കുള്ള പ്രവേശനത്തെയും പ്രകടിപ്പിക്കുന്നു; കൂടുതൽ സുഗമമായ പകരംവിവർത്തനം മൂലക്രിയയിലെ മാറ്റത്തിന്റെ സൂചന മങ്ങിച്ചേക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ജീവിക്കുന്നവൻ’, ‘ഇതാ’, ‘പാതാളം’ എന്നീ പദങ്ങൾ വെളിപ്പാടുപുസ്തകത്തിന്റെ ഉയർന്ന ഭാവം നിലനിർത്തുന്നു. അവസാന ഖണ്ഡത്തിലെ ἔχω മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്റെ കൈവശമുണ്ട്’ എന്നു നൽകിയിരിക്കുന്നു; ഇതിലൂടെ താക്കോലുകളുടെ ഉടമസ്ഥതയും അധികാരവും വ്യക്തമാകുന്നു.
