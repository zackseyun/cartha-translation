id: REV.1.20
reference: Revelation 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: ml
  text: 'നീ എന്റെ വലങ്കയ്യിൽ കണ്ട ഏഴ് നക്ഷത്രങ്ങളുടെയും ഏഴ് സ്വർണവിളക്കുനിലകളുടെയും രഹസ്യം ഇതാണ്: ഏഴ് നക്ഷത്രങ്ങൾ ഏഴ് സഭകളുടെ ദൂതന്മാരാണ്[a]; ഏഴ് വിളക്കുനിലകൾ ഏഴ് സഭകളാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏഴ് സഭകളുടെ സന്ദേശവാഹകർ.’ ഗ്രീക്ക് പദം സ്വർഗീയ ദൂതന്മാരെയോ മനുഷ്യ സന്ദേശവാഹകരെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: മർമം
  rationale: ദർശനത്തിൽ കാണപ്പെട്ട അടയാളങ്ങളുടെ ഇപ്പോൾ വെളിപ്പെടുത്തപ്പെടുന്ന അർഥത്തെ സൂചിപ്പിക്കുന്നതോടൊപ്പം, മൂലപദത്തിന്റെ വെളിപ്പാടുസാഹിത്യപരമായ ഗൗരവവും നിലനിർത്തുന്നു; വെറും ‘പ്രതീകാർഥം’ എന്നു വിശദീകരിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἀστέρων / ἀστέρες
  choice: നക്ഷത്രങ്ങൾ
  rationale: ദർശനത്തിലെ പ്രതീകത്തെ നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു; അതിന്റെ സൂചിതാർഥം തുടർന്നുള്ള വാക്യം വ്യക്തമാക്കുന്നു.
- source_word: οὓς εἶδες
  choice: നീ ... കണ്ട
  rationale: നക്ഷത്രങ്ങളെ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധവാക്യം സ്വാഭാവികമായ ആധുനിക മലയാളക്രമത്തിൽ നൽകുന്നു.
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: എന്റെ വലങ്കയ്യിൽ
  rationale: ἐπί + genitive വിവിധമായി പരിഭാഷപ്പെടുത്താമെങ്കിലും, സമീപസന്ദർഭത്തിലെ കൈയിൽ നക്ഷത്രങ്ങൾ പിടിച്ചിരിക്കുന്ന ദൃശ്യത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: λυχνίας
  choice: വിളക്കുതണ്ടുകൾ
  rationale: വിളക്കിനെത്തന്നെയല്ല, വിളക്ക് സ്ഥാപിക്കുന്ന തണ്ടിനെയാണ് λυχνία സൂചിപ്പിക്കുന്നത്; ദർശനത്തിലെ ദൃശ്യരൂപം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: χρυσᾶς
  choice: സ്വർണ
  rationale: സ്വർണനിർമിതമോ സ്വർണസ്വഭാവമുള്ളതോ ആയ വസ്തുവിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വിശേഷിപ്പിക്കുന്നു.
- source_word: ἄγγελοι
  choice: ദൂതന്മാർ
  rationale: ഗ്രീക്ക് പദത്തിന് സ്വർഗീയ ദൂതന്മാരെയോ മനുഷ്യ സന്ദേശവാഹകരെയോ സൂചിപ്പിക്കാം. ‘ദൂതന്മാർ’ എന്നത് പദത്തിന്റെ പരമ്പരാഗത ഭാവം നിലനിർത്തുന്നു; മനുഷ്യ സന്ദേശവാഹകർ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: സഭകൾ
  rationale: വെളിപ്പാടുപുസ്തകം അഭിസംബോധന ചെയ്യുന്ന പ്രാദേശിക വിശ്വാസസമൂഹങ്ങൾക്ക് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപദം.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: '... നക്ഷത്രങ്ങളുടെയും ... വിളക്കുതണ്ടുകളുടെയും മർമം ഇതാണ്:'
  rationale: ഗ്രീക്കിൽ ആദ്യം വിഷയം അവതരിപ്പിച്ച് തുടർന്ന് അതിന്റെ വിശദീകരണം നൽകുന്ന ഘടന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν എന്നതിന്റെ സൂചിതർ
  choice: ഏഴ് സഭകളുടെ ദൂതന്മാർ
  alternative: ഏഴ് സഭകളുടെ സന്ദേശവാഹകർ
  rationale: ἄγγελος എന്ന പദം സ്വർഗീയ ദൂതനെയോ മനുഷ്യ സന്ദേശവാഹകനെയോ സൂചിപ്പിക്കാം. വെളിപ്പാടുപുസ്തകത്തിൽ സ്വർഗീയ അർഥം സാധാരണമായതിനാൽ മുഖ്യപാഠത്തിൽ ‘ദൂതന്മാർ’ നിലനിർത്തുന്നു; എന്നാൽ പാഠം മനുഷ്യ പ്രതിനിധികളെ വ്യക്തമായി ഒഴിവാക്കാത്തതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദർശനഭാഷയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. അർധവിരാമം രണ്ട് പ്രതീകവ്യാഖ്യാനങ്ങളെയും വ്യക്തമായി വേർതിരിക്കുന്നു.
