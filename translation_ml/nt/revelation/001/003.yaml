id: REV.1.3
reference: Revelation 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: ml
  text: ഈ പ്രവചനത്തിലെ വചനങ്ങൾ ഉറക്കെ വായിക്കുന്നവനും[a] അവ കേൾക്കുകയും അതിൽ എഴുതിയിരിക്കുന്നതു പാലിക്കുകയും ചെയ്യുന്നവരും ഭാഗ്യവാൻ; എന്തെന്നാൽ, സമയം അടുത്തിരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘വായിക്കുന്നവൻ’; ഗ്രീക്ക് പദം സഭായോഗത്തിൽ പരസ്യമായി വായിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നതാകാം. അതിനാലാണ് ‘ഉറക്കെ വായിക്കുന്നവൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘നിശ്ചയിക്കപ്പെട്ട സമയം അടുത്തിരിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: അനുഗൃഹീതർ
  rationale: പുതിയനിയമത്തിലെ അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ ആത്മീയവും ഉടമ്പടിസംബന്ധവുമായ ഭാരം നിലനിർത്തുന്നു; കേവലമായ വികാരസന്തോഷം എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല. ഗ്രീക്കിലെ ഏകവചന വിശേഷണം വായിക്കുന്ന ഒരാളെയും കേൾക്കുകയും പാലിക്കുകയും ചെയ്യുന്ന അനേകരെയും ചേർത്ത് വിശേഷിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: ὁ ἀναγινώσκων
  choice: ഉറക്കെ വായിക്കുന്നവൻ
  rationale: ഏകവചന വായനക്കാരനും ബഹുവചന ശ്രോതാക്കളും തമ്മിലുള്ള വ്യത്യാസം സഭായോഗത്തിലെ പരസ്യവായനയെ ശക്തമായി സൂചിപ്പിക്കുന്നു. ‘ഉറക്കെ’ എന്നത് സാധ്യതയുള്ള വാചികസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: οἱ ἀκούοντες
  choice: അവ കേൾക്കുന്നവർ
  rationale: സംസാരിച്ചുകേൾപ്പിക്കുന്ന വചനങ്ങൾ സ്വീകരിക്കുന്നതെന്ന അടിസ്ഥാനാർഥം സൂക്ഷിക്കുകയും തുടർന്ന് വരുന്ന അനുസരണത്തിന്റെ ആശയം മുൻകൂട്ടി അതിലേക്കു ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: ഈ പ്രവചനത്തിലെ വചനങ്ങൾ
  rationale: λόγοι എന്നതിനെ പൊതുവായ ‘സന്ദേശം’ എന്നാക്കാതെ ‘വചനങ്ങൾ’ എന്നു നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ഇതേ പ്രവചനത്തെ ‘ഈ’ വ്യക്തമാക്കുന്നു.
- source_word: τηροῦντες
  choice: പാലിക്കുന്നവർ
  rationale: എഴുതിയിരിക്കുന്നതിനെ വിശ്വസ്തമായി അനുസരിക്കുകയും കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്ന വിശാലമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും നിയമാനുഷ്ഠാനമായി ചുരുക്കുന്നില്ല.
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: അതിൽ എഴുതിയിരിക്കുന്നതു
  rationale: ഗ്രീക്കിലെ നപുംസക ബഹുവചന പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ സമാഹാര ഏകവചനമായി അവതരിപ്പിക്കുന്നു; ‘അതിൽ’ എന്നത് പ്രവചനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ γὰρ καιρὸς
  choice: എന്തെന്നാൽ, സമയം
  rationale: καιρός-ന് നിർണായകമോ നിശ്ചയിക്കപ്പെട്ടതോ ആയ സമയത്തിന്റെ ഭാവമുണ്ടാകാമെങ്കിലും, ‘സമയം’ ആ അർഥസാധ്യത തുറന്നുവെക്കുകയും വ്യാഖ്യാനം അമിതമായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐγγύς
  choice: അടുത്തിരിക്കുന്നു
  rationale: കാലസംബന്ധമായ സമീപത വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ പറയുന്നു; പൂർത്തീകരണത്തിന്റെ കൃത്യക്രമത്തെ നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ഏകവചന വായനക്കാരനും ബഹുവചന ശ്രോതാക്കളും സൂചിപ്പിക്കുന്ന പരസ്യവായനാസന്ദർഭം
  choice: ἀναγινώσκων എന്നത് ‘ഉറക്കെ വായിക്കുന്നവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: വാചികഭാവം വ്യക്തമാക്കാതെ ‘വായിക്കുന്നവൻ’ എന്നു നൽകുക.
  rationale: ഒരാൾ വായിക്കുകയും അനേകർ കേൾക്കുകയും ചെയ്യുന്ന വ്യാകരണഘടന സഭായോഗത്തിലെ പരസ്യവായനയെ ശക്തമായി സൂചിപ്പിക്കുന്നു; ‘ഉറക്കെ’ എന്നു ചേർക്കുന്നത് സിദ്ധാന്തപരമായ അധികവിവരം ചേർക്കാതെ ആ ചരിത്രസന്ദർഭം വ്യക്തമാക്കുന്നു.
- issue: καιρός ἐγγύς എന്നതിന്റെ അന്ത്യകാലസംബന്ധമായ ശക്തി
  choice: ‘സമയം അടുത്തിരിക്കുന്നു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നിശ്ചയിക്കപ്പെട്ട സമയം അടുത്തിരിക്കുന്നു’ എന്നു നൽകുക.
  rationale: മൂലം സമയത്തിന്റെ സമീപത ഉറപ്പിക്കുന്നു, എന്നാൽ പൂർത്തീകരണത്തിന്റെ കാലക്രമമോ പ്രത്യേക അന്ത്യകാലപദ്ധതിയോ നിർണ്ണയിക്കുന്നില്ല. പരിഭാഷ ആ ഉദ്ദേശ്യപൂർവമായ തുറന്ന നില നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അനുഗൃഹീതർ’, ‘വചനങ്ങൾ’, ‘പാലിക്കുക’ എന്നിവ ബൈബിൾഭാഷയുടെ ഭാരം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ഏകവചന വായനക്കാരനും ബഹുവചന ശ്രോതാക്കളും മലയാളത്തിൽ വ്യക്തമായി വേർതിരിച്ചിരിക്കുന്നു; അവസാനം വരുന്ന ‘അനുഗൃഹീതർ’ ഇരുകൂട്ടരെയും ഉൾക്കൊള്ളുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
