source:
  edition: SBLGNT
  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: ml
  text: അവന്റെ തലയും തലമുടിയും വെളുത്ത ആട്ടിൻരോമംപോലെയും മഞ്ഞുപോലെയും വെളുത്തതായിരുന്നു[a]; അവന്റെ കണ്ണുകൾ തീയുടെ ജ്വാലപോലെയായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ തലയും തലമുടിയും വെളുത്ത ആട്ടിൻരോമംപോലെ, മഞ്ഞുപോലെ വെളുത്തതായിരുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: ഈ ദൃശ്യരൂപം ദാനീയേൽ 7:9-നെ അനുസ്മരിപ്പിക്കുകയും ഈ വിവരണം ദർശനാത്മകമാണെന്ന് ഊന്നിപ്പറയുകയും ചെയ്യുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇത് വിവരണം മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലഘുവായ ബന്ധകമാണ്; മലയാളത്തിൽ അർഥമില്ലാത്ത കാലസൂചന ചേർക്കാതെ വാക്യബന്ധത്തിലൂടെ അതിന്റെ ശക്തി സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: κεφαλὴ
  choice: തല
  rationale: ദർശനവിവരണത്തിലെ ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള മലയാളപദം.
- source_word: τρίχες
  choice: തലമുടി
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ സമാഹാരനാമം; ഇവിടെ തലയുടെ മുടിയാണെന്ന് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: λευκαὶ
  choice: വെളുത്തിരുന്നു
  rationale: അടിസ്ഥാന വർണസൂചന നിലനിർത്തുകയും ഗ്രീക്കിലെ വെളുപ്പിന്റെ ഊന്നൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὡς ἔριον λευκόν
  choice: വെളുത്ത കമ്പിളിപോലെ
  rationale: വിശേഷണം കമ്പിളിയെ വിശേഷിപ്പിക്കുന്നതും ഉപമ വ്യക്തമായി നിലനിർത്തുന്നതുമായ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: ὡς χιών
  choice: മഞ്ഞുപോലെ
  rationale: വെളുപ്പിനെ ശക്തിപ്പെടുത്തുന്ന രണ്ടാമത്തെ ഉപമ അതേപടി നിലനിർത്തുന്നു.
- source_word: ὀφθαλμοὶ
  choice: കണ്ണുകൾ
  rationale: സാധാരണവും കൃത്യവുമായ ശരീരാവയവപദം.
- source_word: ὡς φλὸξ πυρός
  choice: തീജ്വാലപോലെ
  rationale: ഗ്രീക്കിലെ അഗ്നിജ്വാലയുടെ ശക്തമായ ദൃശ്യരൂപം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: മഹത്വീകരിക്കപ്പെട്ട മനുഷ്യപുത്രന്റെ പ്രതീകാത്മക വിവരണം
  choice: ഉപമകളും ദൃശ്യരൂപങ്ങളും മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി.
  alternative: വിശുദ്ധി, നിത്യത, ന്യായവിധി എന്നിവയെ സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനാത്മകമായി വികസിപ്പിക്കുക.
  rationale: വാക്യം ദർശനാത്മക ഉപമകളാണ് നൽകുന്നത്; അവയുടെ ദൈവശാസ്ത്രപരമായ അർഥം ഇവിടെ നേരിട്ട് വിശദീകരിക്കുന്നില്ല. അതിനാൽ പ്രതീകങ്ങളെ സ്വതന്ത്രമായി സംസാരിക്കാൻ അനുവദിക്കുന്നത് അർഥസാധ്യതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദർശനാത്മക ഉപമകൾ ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ സൂക്ഷിച്ചിരിക്കുന്നു; മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
