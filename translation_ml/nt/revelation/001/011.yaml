  terminology: ‘സഭകൾ’ appropriately renders ἐκκλησίαις in this context. ‘പുസ്തകം’ with a scroll alternative footnote is sound. The city names and the Pergamum/Pergamos footnote are acceptable modern Malayalam usage.
