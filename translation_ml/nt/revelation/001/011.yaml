id: REV.1.11
reference: Revelation 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: ml
  text: 'പറഞ്ഞുകൊണ്ട്: “നീ കാണുന്നതു ഒരു പുസ്തകത്തിൽ[a] എഴുതി ഏഴ് സഭകൾക്ക്—എഫെസൊസിലേക്കും സ്മുർന്നയിലേക്കും പെർഗമൊനിലേക്കും[b] തുയഥൈരയിലേക്കും സർദിസിലേക്കും ഫിലദെൽഫിയയിലേക്കും ലവൊദിക്ക്യയിലേക്കും—അയയ്ക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു ചുരുളിൽ”; βιβλίον എന്ന ഗ്രീക്ക് പദം ചുരുളിനെയോ പുസ്തകത്തെയോ എഴുത്തുരേഖയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: പെർഗമൊൻ എന്ന സ്ഥലപ്പേര് ചില പഴയ പരിഭാഷകളിൽ “പെർഗമോസ്” എന്നു നൽകിയിട്ടുണ്ട്.
    reason: alternative_rendering
lexical_decisions:
- source_word: λεγούσης
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച ശബ്ദം പറയുന്നതിനെ തുടർന്നു വിവരിക്കുന്ന സ്ത്രീലിംഗ ജനിറ്റീവ് വർത്തമാന കൃദന്തരൂപമാണിത്. മലയാളത്തിൽ ഉദ്ധരണി സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘ഇങ്ങനെ പറഞ്ഞു’ എന്നു നൽകി; പുതിയൊരു സംസാരിക്കുന്ന വ്യക്തിയെ ചേർത്തിട്ടില്ല.
- source_word: Ὃ βλέπεις
  choice: നീ കാണുന്നത്
  rationale: ദർശനത്തിൽ യോഹന്നാൻ കാണുന്ന കാര്യങ്ങളുടെ വിശാലമായ പരിധി നിലനിർത്തുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: γράψον
  choice: എഴുതി
  rationale: γράφω എന്ന ക്രിയയുടെ ഏകവചന ആജ്ഞാരൂപം. തുടർന്നുള്ള ‘അയയ്ക്കുക’ എന്ന ആജ്ഞയുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: εἰς βιβλίον
  choice: ഒരു പുസ്തകത്തിൽ
  rationale: βιβλίον എന്നത് പുസ്തകം, ചുരുൾ, അല്ലെങ്കിൽ എഴുത്തുരേഖ എന്നിവയെ സൂചിപ്പിക്കാം. ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമായ ‘പുസ്തകം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് ‘ചുരുൾ’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: πέμψον
  choice: അയയ്ക്കുക
  rationale: πέμπω എന്ന ക്രിയയുടെ ഏകവചന ആജ്ഞാരൂപം. എഴുതിയതു തന്നെയാണ് അയയ്ക്കേണ്ടത് എന്നത് മലയാള വാക്യഘടനയിൽ വ്യക്തമായതിനാൽ അനാവശ്യമായ കർമസർവനാമം ചേർത്തില്ല.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: ഏഴ് സഭകൾക്ക്
  rationale: തിരിച്ചറിയാവുന്ന ക്രിസ്തീയ വിശ്വാസസമൂഹങ്ങളെയാണ് ἐκκλησία ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘സഭകൾ’ എന്നത് വിഭാഗീയ സവിശേഷതകൾ ചേർക്കാതെ ഈ അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἰς Ἔφεσον … εἰς Λαοδίκειαν
  choice: എഫെസൊസിലേക്കും … ലവൊദിക്ക്യയിലേക്കും
  rationale: ഓരോ നഗരനാമത്തിനുമുമ്പും ആവർത്തിക്കുന്ന εἰς എന്ന പദത്തിന്റെ വിതരണാത്മക ഊന്നൽ മലയാളത്തിലെ ‘-ലേക്കും’ എന്ന ആവർത്തനത്തിലൂടെ സംരക്ഷിച്ചു.
- source_word: Πέργαμον
  choice: പെർഗമൊൻ
  rationale: ഗ്രീക്ക് രൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു; പരമ്പരാഗതമായി കാണുന്ന ‘പെർഗമോസ്’ അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: വെളിപ്പാട് 1:11-ലെ ἐκκλησίαις എന്നതിന്റെ സ്വഭാവം
  choice: സഭകൾ
  alternative: കൂട്ടായ്മകൾ / സമൂഹങ്ങൾ
  rationale: ഉത്ഥിതനായ യേശു യോഹന്നാനിലൂടെ അഭിസംബോധന ചെയ്യുന്ന നിർദിഷ്ട ക്രിസ്തീയ വിശ്വാസസമൂഹങ്ങളാണ് ഉദ്ദേശ്യം. ‘സഭകൾ’ എന്ന പരിഭാഷ വിഭാഗീയ സഭാഭരണരീതിയോ മറ്റേതെങ്കിലും പ്രത്യേക ഉപദേശമോ ഇറക്കുമതി ചെയ്യാതെ ആ സഭാസംബന്ധമായ സൂചന വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. നഗരങ്ങളിലേക്കുള്ള ആവർത്തിച്ച ദിശാസൂചന മൂലപാഠത്തിന്റെ താളവും വിതരണാത്മക ഊന്നലും നിലനിർത്തുന്നു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവയുടെ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെട്ടിരുന്നില്ല; അതിനാൽ [a] βιβλίον എന്ന പദത്തിനുശേഷവും [b] പെർഗമൊൻ എന്ന പേരിനുശേഷവും അർഥാനുസൃതമായി സ്ഥാപിച്ചു.
