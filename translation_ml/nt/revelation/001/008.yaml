id: REV.1.8
reference: Revelation 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: ml
  text: “ഞാൻ ആൽഫയും ഓമേഗയും ആകുന്നു,” കർത്താവായ ദൈവം അരുളിച്ചെയ്യുന്നു, “ഉള്ളവനും ഉണ്ടായിരുന്നവനും വരുന്നവനും, സർവശക്തനും.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉള്ളവനും ഉണ്ടായിരുന്നവനും വരുവാനുള്ളവനും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: ഞാൻ ... ആകുന്നു
  rationale: ഊന്നലുള്ള ഗ്രീക്ക് സർവനാമവും ക്രിയയും മലയാളത്തിലെ ഗൗരവമുള്ള സ്വയംപ്രഖ്യാപനശൈലിയിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: ആൽഫയും ഓമേഗയും
  rationale: ഗ്രീക്ക് അക്ഷരനാമങ്ങൾ നിലനിർത്തുന്നത് മൂലപാഠത്തിലെ പ്രതീകാത്മകതയും വെളിപ്പാടുസാഹിത്യത്തിലെ സ്ഥാപിത പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: λέγει
  choice: അരുളിച്ചെയ്യുന്നു
  rationale: വർത്തമാനകാലം നിലനിർത്തിക്കൊണ്ട് ദൈവിക വചനത്തിന് യോജിച്ച, മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം നൽകുന്നു.
- source_word: κύριος, ὁ θεός
  choice: കർത്താവായ ദൈവം
  rationale: അടുത്തടുത്തുള്ള ദൈവിക സ്ഥാനപ്പേരുകളെ സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുകയും രണ്ടിന്റെയും അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: ഇരിക്കുന്നവനും ഇരുന്നവനും വന്നുകൊണ്ടിരിക്കുന്നവനും
  rationale: മൂന്നംഗ ഘടന നിലനിർത്തുന്നു; ἐρχόμενος എന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ സജീവവും പുരോഗമിക്കുന്നതുമായ ഭാവം ‘വന്നുകൊണ്ടിരിക്കുന്നവൻ’ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ παντοκράτωρ
  choice: സർവശക്തൻ
  rationale: ദൈവത്തിന്റെ സമഗ്ര അധികാരവും ശക്തിയും സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദമാണ്.
theological_decisions:
- issue: ദൈവത്തിന്റെ നിത്യസത്തയെയും വരവിനെയും സൂചിപ്പിക്കുന്ന സ്വയംവിശേഷണത്തിലെ ἐρχόμενος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വന്നുകൊണ്ടിരിക്കുന്നവൻ
  alternative: വരുവാനുള്ളവൻ
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല കൃദന്തം സജീവമായി വരുന്നതിനെ കൂടുതൽ നേരിട്ട് സൂചിപ്പിക്കുന്നു. ഭാവികാലപരമായ പരമ്പരാഗത വ്യാഖ്യാനവും സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു; അതുവഴി ദൈവത്തിന്റെ വരവിനെക്കുറിച്ചുള്ള പാഠത്തിലെ അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആരാധനാപരമായ ശൈലി സ്വീകരിച്ചു. ‘ആൽഫ’, ‘ഓമേഗ’ എന്നീ ഗ്രീക്ക് അക്ഷരനാമങ്ങളും മൂലത്തിലെ മൂന്നംഗ ദൈവിക സ്വയംവിശേഷണവും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം പ്രധാനപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
