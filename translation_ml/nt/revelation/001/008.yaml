    issue: “ഇരിക്കുന്നവനും ഇരുന്നവനും” is semantically ambiguous and unnatural for divine existence across present and past.
    rationale: In current Malayalam, these forms normally mean “the one sitting” and “the one who sat,” whereas ὁ ὢν καὶ ὁ ἦν denotes the one who is/existed.
  - severity: low
