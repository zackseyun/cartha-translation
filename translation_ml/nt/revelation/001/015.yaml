id: REV.1.15
reference: Revelation 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ, ὡς ἐν καμίνῳ ⸀πεπυρωμένης, καὶ ἡ φωνὴ αὐτοῦ ὡς φωνὴ ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: ml
  text: അവന്റെ പാദങ്ങൾ ചൂളയിൽ പഴുപ്പിച്ചതുപോലെ തിളങ്ങുന്ന വെങ്കലംപോലെയായിരുന്നു[a]; അവന്റെ സ്വരം അനേകം വെള്ളങ്ങളുടെ ശബ്ദംപോലെയായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തിളങ്ങുന്ന വെങ്കലം’ എന്നു പരിഭാഷപ്പെടുത്തിയ അപൂർവപദം കൃത്യമായി ഏത് ലോഹത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് ഉറപ്പില്ല. അതിന് അത്യന്തം ശുദ്ധീകരിച്ചതോ ജ്വലിക്കുന്നതോ ആയ ഒരു ലോഹസങ്കരം, മിനുക്കിയ വെങ്കലം, അല്ലെങ്കിൽ മേന്മയുള്ള പിച്ചള എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അനേകം വെള്ളങ്ങളുടെ സ്വരംപോലെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόδες
  choice: പാദങ്ങൾ
  rationale: πούς എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘പാദം’ എന്നാണ്. ദർശനവിവരണത്തിലെ ശരീരഭാഗത്തെ കൃത്യമായി സൂചിപ്പിക്കാനും ‘കാലുകൾ’ എന്നതിലെ വിശാലമായ അർഥം ഒഴിവാക്കാനും ‘പാദങ്ങൾ’ തെരഞ്ഞെടുത്തു.
- source_word: ὅμοιοι
  choice: പോലെയും
  rationale: ὅμοιος സാദൃശ്യം പ്രകടിപ്പിക്കുന്നു. വാക്യത്തിന്റെ സമാന്തരഘടനയിൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘പോലെയും ... പോലെയും ആയിരുന്നു’ എന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: χαλκολιβάνῳ
  choice: തിളങ്ങുന്ന വെങ്കലം
  rationale: അത്യപൂർവമായ χαλκολίβανον ഏത് ലോഹത്തെയാണ് കൃത്യമായി സൂചിപ്പിക്കുന്നതെന്നത് അനിശ്ചിതമാണ്; അതു ശുദ്ധീകരിച്ചോ ജ്വലിക്കുന്നതോ ആയ വെങ്കലസദൃശ ലോഹമാകാം. ‘തിളങ്ങുന്ന വെങ്കലം’ അതിന്റെ ദീപ്തി വ്യക്തമാക്കുന്നു, എന്നാൽ ലോഹഘടനയെക്കുറിച്ച് അനാവശ്യമായ ഉറപ്പ് നൽകുന്നില്ല.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: ചൂളയിൽ പഴുപ്പിച്ച
  rationale: κάμινος ലോഹം ചൂടാക്കുന്ന ചൂളയെയും πυρόομαι തീയിൽ ചൂടാക്കൽ, ജ്വലിപ്പിക്കൽ, ശുദ്ധീകരിക്കൽ എന്നിവയെയും സൂചിപ്പിക്കാം. ‘ചൂളയിൽ പഴുപ്പിച്ച’ എന്നത് അഗ്നിയിൽ അത്യന്തം ചൂടാക്കി ശുദ്ധീകരിക്കുന്ന ലോഹത്തിന്റെ ദൃശ്യബിംബം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: φωνή
  choice: സ്വരം
  rationale: ആദ്യത്തെ φωνή വ്യക്തിയുടെ ശബ്ദത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അവന്റെ സ്വരം’ വ്യക്തിപരമായ അർഥവും ഗാംഭീര്യവും നിലനിർത്തുന്നു.
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: അനേകം വെള്ളങ്ങളുടെ ശബ്ദംപോലെ
  rationale: രണ്ടാമത്തെ φωνή കേൾക്കുന്ന ശബ്ദത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ശബ്ദം’ സ്വാഭാവികമാണ്. ὕδατα πολλά എന്ന ബഹുവചന ബൈബിൾബിംബം പ്രത്യേകമായി കടലിലേക്കോ വെള്ളച്ചാട്ടത്തിലേക്കോ ചുരുക്കാതെ ‘അനേകം വെള്ളങ്ങൾ’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: അവസാന ഉപമയിൽ ആവർത്തിക്കുന്ന φωνήയുടെ വിവർത്തനം
  choice: അവന്റെ സ്വരം അനേകം വെള്ളങ്ങളുടെ ശബ്ദംപോലെ
  alternative: അവന്റെ സ്വരം അനേകം വെള്ളങ്ങളുടെ സ്വരംപോലെ
  rationale: ആദ്യപ്രയോഗത്തിൽ വ്യക്തിയുടെ ‘സ്വരം’ എന്നും ഉപമയിൽ കേൾവിയനുഭവത്തിന്റെ ‘ശബ്ദം’ എന്നും വിവർത്തനം ചെയ്യുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്. അതേസമയം, മൂലത്തിലെ പദാവർത്തനവും വ്യക്തിവൽക്കരണസാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു; ദർശനത്തിലെ മഹത്വബിംബത്തെ ഒരു പ്രത്യേക പ്രകൃതിശബ്ദമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗാംഭീര്യമുള്ളതുമായ ദർശനവിവരണശൈലി സ്വീകരിച്ചു. ‘പാദങ്ങൾ’, ‘സ്വരം’ എന്നിവ dignified register നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. മൂലത്തിലെ രണ്ട് സമാന്തര ഉപമകളും ‘പോലെയും ... പോലെയും ആയിരുന്നു’ എന്ന ഘടനയിൽ സംരക്ഷിച്ചു; അപൂർവ ലോഹപദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
