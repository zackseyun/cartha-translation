id: REV.1.9
reference: Revelation 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: ml
  text: നിങ്ങളുടെ സഹോദരനും യേശുവിലുള്ള കഷ്ടതയിലും രാജ്യത്തിലും സഹിഷ്ണുതയിലും നിങ്ങളോടൊപ്പം പങ്കാളിയുമായ യോഹന്നാനായ ഞാൻ, ദൈവവചനവും യേശുവിന്റെ സാക്ഷ്യവും[a] നിമിത്തം പത്മോസ് എന്നു വിളിക്കപ്പെടുന്ന ദ്വീപിലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യം.’ ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തിരൂപം യേശു നൽകിയ സാക്ഷ്യം എന്നോ യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യം എന്നോ അർഥമാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: നിങ്ങളോടൊപ്പം പങ്കാളി
  rationale: ഈ പദം ഒരേ അനുഭവങ്ങളിലും യാഥാർഥ്യങ്ങളിലും മറ്റുള്ളവരോടൊപ്പം പങ്കുചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നിങ്ങളോടൊപ്പം പങ്കാളി’ എന്ന പ്രയോഗം യോഹന്നാനും വായനക്കാരും തുടർന്നുപറയുന്ന കഷ്ടത, രാജ്യം, സഹിഷ്ണുത എന്നിവയിൽ പങ്കുചേരുന്നു എന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: കഷ്ടതയിലും രാജ്യത്തിലും സഹിഷ്ണുതയിലും
  rationale: മൂന്നു നാമങ്ങളും ഒരേ പങ്കാളിത്തമേഖലയായി ബന്ധിപ്പിച്ചിരിക്കുന്ന ഗ്രീക്ക് ഘടന നിലനിർത്തുന്നു. വെളിപ്പാട് സാഹിത്യസന്ദർഭത്തിലെ θλῖψις എന്നതിന്റെ ഗൗരവം ‘കഷ്ടത’ അറിയിക്കുന്നു; ὑπομονήയ്ക്ക് ‘സഹിഷ്ണുത’ ദീർഘകാലം ഉറച്ചുനിൽക്കുന്നതിന്റെ അർഥം നൽകുന്നു.
- source_word: ἐν Ἰησοῦ
  choice: യേശുവിലുള്ള
  rationale: ഈ പദസമുച്ചയം അതിന് മുമ്പുള്ള കഷ്ടത, രാജ്യം, സഹിഷ്ണുത എന്നീ മൂന്നിനെയും യേശുവുമായുള്ള ബന്ധത്തിൽ സ്ഥാപിക്കുന്നു. ‘യേശുവിലുള്ള’ എന്നത് ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ദൈവശാസ്ത്രപ്രയോഗം അനാവശ്യമായി വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: ദ്വീപിലായിരുന്നു
  rationale: ഇവിടെ γίνομαι ഒരു സ്ഥലത്ത് ആയിരുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണ്. ദ്വീപിൽ എങ്ങനെ എത്തി എന്നത് ഗ്രീക്ക് വ്യക്തമാക്കാത്തതിനാൽ അതിനെക്കുറിച്ചുള്ള അനുമാനം ഒഴിവാക്കുന്നു.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: പത്മോസ് എന്നു വിളിക്കപ്പെടുന്ന
  rationale: καλουμένῃ എന്ന കർമണി വർത്തമാന കൃദന്തത്തിന്റെ രൂപവും ദ്വീപിന്റെ പേരും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: ദൈവവചനം നിമിത്തം
  rationale: Accusative-നോടുകൂടിയ διά ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ എന്നത് ദൈവവചനത്തിന്റെ പ്രസംഗമോ അതിനോടുള്ള വിശ്വസ്തതയോ അതുമായി ബന്ധപ്പെട്ട പീഡനമോ—ഇവയിൽ ഏതാണ് ഉദ്ദേശിച്ചതെന്ന് അനാവശ്യമായി തീരുമാനിക്കുന്നില്ല.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: യേശുവിന്റെ സാക്ഷ്യം
  rationale: Ἰησοῦ എന്ന genitive രൂപം യേശു നൽകിയ സാക്ഷ്യം എന്നും യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യം എന്നും അർഥമാക്കാവുന്നതാണ്. ‘യേശുവിന്റെ സാക്ഷ്യം’ മുഖ്യപാഠത്തിൽ ഈ യഥാർഥ ദ്വയാർഥത സാധ്യമായത്ര നിലനിർത്തുന്നു; മറ്റൊരു വ്യക്തമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀδελφὸς ὑμῶν
  choice: നിങ്ങളുടെ സഹോദരൻ
  rationale: ക്രിസ്തുവിലുള്ള കുടുംബബന്ധവും വായനക്കാരോടുള്ള യോഹന്നാന്റെ ഐക്യദാർഢ്യവും നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: μαρτυρίαν Ἰησοῦ എന്നതിലെ genitive-ന്റെ ദ്വയാർഥത
  choice: മുഖ്യപാഠത്തിൽ ‘യേശുവിന്റെ സാക്ഷ്യം’
  alternative: ‘യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യം’
  rationale: വെളിപ്പാട് പുസ്തകത്തിൽ ഈ പ്രയോഗം യേശു നൽകുന്ന സാക്ഷ്യത്തെയോ യേശുവിനെ സംബന്ധിച്ച സാക്ഷ്യത്തെയോ സൂചിപ്പിക്കാം. മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം തീർപ്പാക്കാതെ സൂക്ഷിക്കാൻ മുഖ്യപാഠത്തിൽ ബന്ധസൂചകമായ രൂപം നിലനിർത്തുകയും മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ നീണ്ട സ്വപരിചയവാക്യത്തിന്റെ ബന്ധങ്ങൾ നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ പദക്രമം സ്വീകരിച്ചു. ‘പത്മോസ്’ എന്ന പ്രചാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിച്ചു.
