  source_fidelity: 'മുഖ്യപാഠം ഗ്രീക്കിലെ എല്ലാ പ്രധാന ഘടകങ്ങളും വിശ്വസ്തമായി പകരുന്നു: ശ്രദ്ധക്ഷണമായ Ἰδοὺ (‘ഇതാ’), സജീവ വർത്തമാനരൂപമായ ἔρχεται (‘വരുന്നു’), ‘മേഘങ്ങളോടുകൂടെ,’ വിതരണാത്മകമായ ‘എല്ലാ കണ്ണുകളും,’ കുത്തിത്തുളച്ചവരെ പ്രത്യേകമായി ഉൾപ്പെടുത്തൽ, ‘ഭൂമിയിലെ എല്ലാ ഗോത്രങ്ങളും,’ ഇരട്ട ഉറപ്പിക്കൽ ‘അതേ, ആമേൻ.’ ‘അവനെച്ചൊല്ലി വിലപിക്കും’ ἐπ’ αὐτόν എന്നതിലെ വിലാപത്തിന്റെ വിഷയ/ബന്ധ സൂക്ഷ്മത തുറന്നുവയ്ക്കുന്നു.'
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാചകം സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. “അവനെ കുത്തിത്തുളച്ചവരും കാണും” എന്ന ചേർക്കൽ ‘എല്ലാ കണ്ണുകളും’ എന്ന മുൻപ്രസ്താവനയിൽ ഉൾപ്പെട്ട പ്രത്യേകവിഭാഗത്തെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ഡാഷ് വായനാസൗകര്യവും ഊന്നലും നൽകുന്നു.
  terminology: ‘മേഘങ്ങളോടുകൂടെ,’ ‘ഗോത്രങ്ങൾ,’ ‘വിലപിക്കും,’ ‘ആമേൻ’ എന്നിവ പ്രസക്തമായ ബൈബിൾ-രജിസ്റ്റർ നിലനിർത്തുന്നു. φυλαί-യ്ക്ക് ‘ഗോത്രങ്ങൾ’ യോജിച്ചതാണ്. γῆ-യ്ക്ക് മുഖ്യപാഠത്തിലെ ‘ഭൂമി’ സാർവലൗകിക സാഹചര്യത്തോട് യോജിക്കുന്നു; സെഖര്യാവിന്റെ പ്രതിധ്വനിസംബന്ധിയായ ‘ദേശം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ യുക്തമായി സംരക്ഷിച്ചിരിക്കുന്നു.
