id: REV.1.7
reference: Revelation 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: ml
  text: ഇതാ, അവൻ മേഘങ്ങളോടുകൂടെ വരുന്നു. എല്ലാ കണ്ണുകളും അവനെ കാണും—അവനെ കുത്തിത്തുളച്ചവരും കാണും. ഭൂമിയിലെ[a] എല്ലാ ഗോത്രങ്ങളും അവനെച്ചൊല്ലി വിലപിക്കും. അതേ, ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദേശത്തിലെ എല്ലാ ഗോത്രങ്ങളും അവനെച്ചൊല്ലി വിലപിക്കും.’ ഈ വാക്കുകൾ സെഖര്യാവ് 12:10–12-നെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം; അവിടെ ‘ദേശം’ എന്ന അർഥം സന്ദർഭത്തിന് യോജിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സജീവത സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: ഭാവിയെ സജീവമായി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ ഊർജം മലയാളത്തിലെ വർത്തമാനരൂപം സ്വാഭാവികമായി പകരുന്നു.
- source_word: μετὰ τῶν νεφελῶν
  choice: മേഘങ്ങളോടുകൂടെ
  rationale: ദാനീയേൽ 7:13-ലെ പ്രതീകാത്മക പശ്ചാത്തലത്തോടുള്ള ബന്ധവും ‘കൂടെ’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ὄψεται
  choice: കാണും
  rationale: ഗ്രീക്ക് ഭാവികാലത്തെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: πᾶς ὀφθαλμὸς
  choice: എല്ലാ കണ്ണുകളും
  rationale: ‘എല്ലാവരും’ എന്നു സാമാന്യവൽക്കരിക്കാതെ ഗ്രീക്കിലെ ദൃശ്യവും വിതരണാത്മകവുമായ ശരീരാവയവപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: οἵτινες
  choice: അവരും
  rationale: ‘എല്ലാ കണ്ണുകളും’ എന്നതിൽ ഉൾപ്പെട്ട പ്രത്യേക വിഭാഗത്തെ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐξεκέντησαν
  choice: കുത്തിത്തുളച്ച
  rationale: സെഖര്യാവ് 12:10, യോഹന്നാൻ 19:37 എന്നിവയോടുള്ള പദബന്ധം നിലനിർത്തുകയും ആഴത്തിൽ തുളച്ചുകയറ്റിയ പ്രവൃത്തിയെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: κόψονται
  choice: വിലപിക്കും
  rationale: ശോകാചരണത്തെയും ദുഃഖപ്രകടനത്തെയും സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം അനാവശ്യമായി പ്രത്യേക ശരീരചലനമായി പരിമിതപ്പെടുത്താതെ പകരുന്നു.
- source_word: ἐπ’ αὐτὸν
  choice: അവനെച്ചൊല്ലി
  rationale: ‘അവനെക്കുറിച്ച്/അവനെ നിമിത്തം’ വിലപിക്കുന്നതെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വിലാപത്തിന്റെ കാരണം അല്ലെങ്കിൽ വിഷയമെന്ന സൂക്ഷ്മമായ തുറന്നത്വവും നിലനിർത്തുന്നു.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: ഭൂമിയിലെ എല്ലാ ഗോത്രങ്ങളും
  rationale: φυλαί എന്നതിന്റെ പ്രത്യേകമായ ‘ഗോത്രങ്ങൾ’ എന്ന അർഥവും വാക്യത്തിലെ സാർവലൗകിക വ്യാപ്തിക്ക് യോജിക്കുന്ന γῆയുടെ ‘ഭൂമി’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: ναί, ἀμήν
  choice: അതേ, ആമേൻ
  rationale: ഇരട്ട ഉറപ്പിക്കൽ സംരക്ഷിക്കുന്നു; മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ പരിചിതമായ ‘ആമേൻ’ പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: πᾶσαι αἱ φυλαὶ τῆς γῆς എന്ന പ്രയോഗത്തിലെ τῆς γῆςയുടെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘ഭൂമിയിലെ എല്ലാ ഗോത്രങ്ങളും’
  alternative: ‘ദേശത്തിലെ എല്ലാ ഗോത്രങ്ങളും’
  rationale: ‘എല്ലാ കണ്ണുകളും’ കാണുമെന്ന സാർവലൗകിക പ്രസ്താവന പ്രധാനപാഠത്തിൽ ‘ഭൂമി’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ സെഖര്യാവ് 12:10–12-ന്റെ പ്രതിധ്വനി കാരണം ‘ദേശം’ എന്ന വായനയും യഥാർഥ സാധ്യതയാണ്; അതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ,’ ‘ഗോത്രങ്ങൾ,’ ‘വിലപിക്കും,’ ‘ആമേൻ’ തുടങ്ങിയ പരിചിതമായ വാക്കുകൾ ഉപയോഗിച്ച് ദാനീയേൽ–സെഖര്യാവ് പ്രതിധ്വനികളും അന്ത്യകാല ദൃശ്യത്തിന്റെ ഗാംഭീര്യവും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം [a] പ്രധാനപാഠത്തിൽ വ്യക്തമായി ചേർത്തിരിക്കുന്നു.
