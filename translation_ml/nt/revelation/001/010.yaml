  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: ml
  text: കർത്താവിന്റെ ദിവസത്തിൽ[a] ഞാൻ ആത്മാവിൽ[b] ആയിത്തീർന്നു; എന്നിട്ട് എന്റെ പിന്നിൽ കാഹളത്തിന്റെ ശബ്ദംപോലെ ഉച്ചത്തിലുള്ള ഒരു ശബ്ദം ഞാൻ കേട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, സാധ്യത കുറവാണെങ്കിലും, “കർത്താവിന്റെ നാളിൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം κυριακῇ ἡμέρᾳ (“കർത്താവിന്റെ ദിവസം”) എന്നാണ്; അന്ത്യകാലത്തെ “കർത്താവിന്റെ നാൾ” എന്നതിന് സാധാരണ ഉപയോഗിക്കുന്ന പ്രയോഗമല്ല ഇത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “ആത്മാവിന്റെ പ്രേരണയിൽ.” ഈ പ്രയോഗം പരിശുദ്ധാത്മാവിന്റെ പ്രവാചകസ്വാധീനത്തിൻ കീഴിലായിരുന്നതിനെ സൂചിപ്പിക്കാം; എന്നാൽ “മൂർച്ഛാവസ്ഥയിൽ” എന്ന് വാക്യം വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: ഞാൻ … ആയി
  rationale: γίνομαι എന്ന ക്രിയയുടെ അവസ്ഥയിലേക്കുള്ള പ്രവേശനഭാവം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; വെറും ‘ആയിരുന്നു’ എന്നതിനെക്കാൾ ഈ ഭാവം നിലനിർത്തുകയും ‘മൂർച്ഛാവസ്ഥയിലായി’ എന്നതുപോലുള്ള വ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν πνεύματι
  choice: ആത്മാവിൽ
  rationale: വെളിപ്പാടിലെ ദർശനസൂത്രങ്ങളിൽ പരിശുദ്ധാത്മാവിന്റെ പ്രവാചകസ്വാധീനമാണ് സാധ്യതയേറിയത്. എങ്കിലും ഗ്രീക്ക് വാചകം ‘മൂർച്ഛാവസ്ഥ’ എന്നു വ്യക്തമാക്കാത്തതിനാൽ ലളിതമായ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: കർത്താവിന്റെ ദിവസത്തിൽ
  rationale: κυριακός എന്ന വിശേഷണം ‘കർത്താവിനുള്ളത്/കർത്താവിന്റേത്’ എന്ന അർഥം നൽകുന്നു. അന്ത്യകാലസൂചനയായ പതിവ് ഗ്രീക്ക് പ്രയോഗത്തിൽനിന്ന് ഇതിനെ വേർതിരിച്ചുകൊണ്ട് രൂപം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἤκουσα
  choice: ഞാൻ കേട്ടു
  rationale: ഇവിടെ ἀκούω ശ്രദ്ധയോടെ കേൾക്കുന്നതല്ല, ശ്രവണാനുഭവം റിപ്പോർട്ട് ചെയ്യുന്നതാണ്; ‘കേട്ടു’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: ὀπίσω μου
  choice: എന്റെ പിന്നിൽ
  rationale: സന്ദർഭത്തിൽ സ്ഥലം സൂചിപ്പിക്കുന്ന അർഥമാണ്; കാലക്രമത്തിൽ ‘എനിക്കുശേഷം’ എന്ന അർഥമല്ല.
- source_word: φωνὴν μεγάλην
  choice: ഉച്ചത്തിലുള്ള ഒരു ശബ്ദം
  rationale: φωνήയോടൊപ്പം μέγας ഇവിടെ ശബ്ദത്തിന്റെ ഉച്ചതയെയോ ശക്തിയെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὡς σάλπιγγος
  choice: കാഹളത്തിന്റെ ശബ്ദംപോലെ
  rationale: ശബ്ദത്തിന്റെ ഗുണമാണ് ഉപമിക്കപ്പെടുന്നത്. മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ശബ്ദം’ ചേർക്കുന്നു; എന്നാൽ ഗ്രീക്കിൽ ഇല്ലാത്ത ‘മുഴക്കം’ പോലുള്ള അധിക ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἐν πνεύματι എന്നത് ദർശനാവസ്ഥയായോ കൂടുതൽ അക്ഷരാർഥത്തിലോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ആത്മാവിൽ
  alternative: ആത്മികാവസ്ഥയിൽ; മൂർച്ഛാവസ്ഥയിൽ
  rationale: പരിശുദ്ധാത്മാവിന്റെ പ്രവാചകപ്രേരണയാണ് സാധ്യതയേറിയതെങ്കിലും ഗ്രീക്ക് വാചകം ‘മൂർച്ഛാവസ്ഥ’ എന്നു പറയുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- issue: κυριακῇ ἡμέρᾳ ആഴ്ചയിലെ കർത്താവിന്റെ ദിവസത്തെയോ അന്ത്യകാല ‘കർത്താവിന്റെ നാളിനെയോ’ സൂചിപ്പിക്കുന്നുവോ
  choice: കർത്താവിന്റെ ദിവസത്തിൽ
  alternative: കർത്താവിന്റെ നാളിൽ
  rationale: κυριακός സ്വാഭാവികമായി ‘കർത്താവിന്റേത്’ എന്നാണ്. അന്ത്യകാലത്തെ ‘കർത്താവിന്റെ നാൾ’ എന്നതിന് പതിവായി ഉപയോഗിക്കുന്ന ഗ്രീക്ക് ഘടന ഇതല്ല; എന്നാൽ ആ ദിവസം എങ്ങനെ തിരിച്ചറിഞ്ഞുവെന്നതിൽ പരിഭാഷ അധികമായി തീരുമാനമെടുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കാഹളം’ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച പരിചിതപദമാണ്. ഗ്രീക്ക് വാക്യക്രമം കൃത്യമായി അനുകരിക്കാതെ മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിനായി ‘അപ്പോൾ’ ചേർത്തിരിക്കുന്നു; ആശയപരമായ പുതിയ വിവരം ചേർത്തിട്ടില്ല.
