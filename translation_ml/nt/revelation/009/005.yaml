revisions:
- from: അവരെ കൊല്ലാതെ, അഞ്ചുമാസം അവരെ പീഡിപ്പിക്കേണ്ടതിന് അവയ്ക്ക് അധികാരം നൽകപ്പെട്ടു. അവ ഉണ്ടാക്കുന്ന പീഡനം, തേൾ ഒരു മനുഷ്യനെ കുത്തുമ്പോൾ ഉണ്ടാകുന്ന പീഡനംപോലെയായിരുന്നു.
  to: അവരെ കൊല്ലാനുള്ളതല്ല, പകരം അഞ്ചുമാസം അവരെ പീഡിപ്പിക്കാനുള്ളതാണ് അവയ്ക്കു നൽകപ്പെട്ടത്. അവ ഉണ്ടാക്കുന്ന പീഡനം, തേൾ ഒരു മനുഷ്യനെ കുത്തുമ്പോഴുള്ള പീഡനംപോലെയായിരുന്നു.
  rationale: The revision removes the unstated noun “authority” while preserving the Greek divine passive through “അവയ്ക്കു നൽകപ്പെട്ടത്.” It also makes the not-killing versus tormenting contrast explicit. The repeated “പീഡിപ്പിക്കുക / പീഡനം,” the five-month duration, and the scorpion-sting comparison are retained in natural modern Malayalam.
