id: REV.9.5
reference: Revelation 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: ml
  text: അവരെ കൊല്ലാനുള്ളതല്ല, പകരം അഞ്ചുമാസം അവരെ പീഡിപ്പിക്കാനുള്ളതാണ് അവയ്ക്കു നൽകപ്പെട്ടത്. അവ ഉണ്ടാക്കുന്ന പീഡനം, തേൾ ഒരു മനുഷ്യനെ കുത്തുമ്പോഴുള്ള പീഡനംപോലെയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: അവയ്ക്ക് അധികാരം നൽകപ്പെട്ടു
  rationale: ദാതാവിനെ വ്യക്തമാക്കാത്ത ഗ്രീക്ക് നിഷ്ക്രിയപ്രയോഗവും ദൈവിക അനുമതിയുടെ ആശയവും നിലനിർത്തുന്നു; മുൻസന്ദർഭത്തിലെ വെട്ടുക്കിളികളെ സൂചിപ്പിക്കുന്ന നപുംസക ബഹുവചനമായ ‘അവയ്ക്ക്’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: അവരെ കൊല്ലാതെ
  rationale: കൊല്ലരുതെന്ന പരിധിയും തുടർന്നുള്ള ഉദ്ദേശ്യ/ഫലബന്ധവും മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀλλ’ ἵνα βασανισθήσονται μῆνας πέντε
  choice: അഞ്ചുമാസം അവരെ പീഡിപ്പിക്കേണ്ടതിന്
  rationale: ἵναയ്ക്ക് ശേഷമുള്ള അസാധാരണ ഭാവികാല നിഷ്ക്രിയരൂപത്തിന്റെ ഉദ്ദേശ്യ/ഫലബലം നിലനിർത്തുകയും അഞ്ചുമാസം എന്ന കാലദൈർഘ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: βασανισθήσονται / βασανισμός
  choice: പീഡിപ്പിക്കുക / പീഡനം
  rationale: ഗ്രീക്കിലെ βασαν- പദാവർത്തനം മലയാളത്തിലും പരമാവധി നിലനിർത്തുന്നു; ‘പീഡനം’ കടുത്ത വേദനയെ സൂചിപ്പിക്കുമ്പോഴും ന്യായവ്യവസ്ഥാപരമായ പീഡനം എന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: അവ ഉണ്ടാക്കുന്ന പീഡനം
  rationale: സന്ദർഭത്തിൽ αὐτῶν എന്നത് വെട്ടുക്കിളികൾ ഏൽപ്പിക്കുന്ന പീഡനമാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അസ്വാഭാവികമായ ‘അവയുടെ പീഡനം’ ഒഴിവാക്കുന്നു.
- source_word: ὡς βασανισμὸς σκορπίου
  choice: തേൾ ... ഉണ്ടാകുന്ന പീഡനംപോലെ
  rationale: തേളിന്റെ ആക്രമണം മൂലമുള്ള വേദന എന്ന താരതമ്യം മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും βασανισμός എന്ന പദത്തിന്റെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὅταν παίσῃ
  choice: കുത്തുമ്പോൾ
  rationale: παίω അടിസ്ഥാനമായി ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്നാണെങ്കിലും തേളിനെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം ‘കുത്തുക’ ആണ്.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യനെ
  rationale: ഇവിടെ ἄνθρωπος പൊതുവായി ഏതൊരു മനുഷ്യനെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘മനുഷ്യൻ’ ആ പൊതുവായ അർഥം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അപ്പോക്കലിപ്റ്റിക് ന്യായവിധിയിലെ ദൈവിക നിഷ്ക്രിയപ്രയോഗം
  choice: ‘അധികാരം നൽകപ്പെട്ടു’ എന്നു നിഷ്ക്രിയരൂപത്തിൽ നിലനിർത്തി; ദാതാവിനെ പേരെടുത്ത് പറഞ്ഞില്ല.
  alternative: ‘ദൈവം അവയ്ക്ക് അധികാരം നൽകി’ അല്ലെങ്കിൽ ‘അവയ്ക്ക് അനുവാദം ലഭിച്ചു’.
  rationale: മൂലപാഠം ദാതാവിനെ വ്യക്തമാക്കുന്നില്ല. ദൈവത്തെ നേരിട്ട് ചേർക്കുന്നത് പാഠത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനം വരുത്തും; നിഷ്ക്രിയരൂപം ദൈവാധിപത്യവും മധ്യസ്ഥ ന്യായവിധിയും തമ്മിലുള്ള പാഠത്തിലെ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: ἵναയും ഭാവികാല നിഷ്ക്രിയരൂപവും പ്രകടിപ്പിക്കുന്ന ഉദ്ദേശ്യം/ഫലം
  choice: ‘പീഡിപ്പിക്കേണ്ടതിന്’ എന്ന ഉദ്ദേശ്യ-ഫല പ്രയോഗം.
  alternative: ‘പീഡിപ്പിക്കാൻ’ അല്ലെങ്കിൽ ‘അവർ പീഡിപ്പിക്കപ്പെടുംവിധം’.
  rationale: കൊല്ലാനുള്ള അധികാരം നൽകിയില്ല, പകരം ഒരു പരിധിക്കുള്ളിൽ പീഡിപ്പിക്കാനുള്ള അധികാരമാണ് നൽകിയതെന്ന വൈരുധ്യം വ്യക്തമാക്കുന്നു; ഉദ്ദേശ്യമോ ഫലമോ മാത്രമായി കടുപ്പിച്ച് തീർപ്പാക്കുന്നില്ല.
- issue: ἄνθρωπον എന്ന ഏകവചനത്തിന്റെ പൊതുവായ പ്രയോഗം
  choice: ‘ഒരു മനുഷ്യനെ’.
  alternative: ‘ഒരാളെ’.
  rationale: ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിപ്രയോഗം നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘മനുഷ്യൻ’ ലിംഗഭേദമില്ലാതെ മനുഷ്യവ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ നിഷ്ക്രിയപ്രയോഗവും βασαν- പദാവർത്തനവും സംരക്ഷിച്ചു; ‘കുത്തുക’ എന്ന സന്ദർഭസൂക്ഷ്മമായ പദം ഉപയോഗിച്ചതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
