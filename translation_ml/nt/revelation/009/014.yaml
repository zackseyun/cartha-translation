  yaml_path: translation/nt/revelation/009/014.yaml
  text: saying to the sixth angel[a], the one who had the trumpet, “Release the four angels who are bound at the great river Euphrates.”
translation:
  language: ml
  text: 'കാഹളം കൈവശമുള്ള ആറാമത്തെ ദൂതനോട് ഇങ്ങനെ പറഞ്ഞു: “മഹാനദിയായ യൂഫ്രട്ടീസിനരികെ ബന്ധിക്കപ്പെട്ടിരിക്കുന്ന[a] നാല് ദൂതന്മാരെ അഴിച്ചുവിടുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബന്ധിക്കപ്പെട്ടവരായ” അല്ലെങ്കിൽ “ബന്ധിക്കപ്പെട്ടുകിടക്കുന്ന” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ പൂർണകാല കർമണി പങ്കാളിത്തരൂപം, മുമ്പുണ്ടായ ബന്ധനത്തിന്റെ ഫലമായി അവർ ഇപ്പോഴും നിയന്ത്രിതാവസ്ഥയിൽ തുടരുന്നതിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντα
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: വാക്യം മുൻവാക്യത്തിലെ യാഗപീഠത്തിൽനിന്നുള്ള ശബ്ദത്തിന്റെ പ്രവർത്തനം തുടരുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനരൂപം ഉപയോഗിച്ചു.
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: ആറാമത്തെ ദൂതനോട്
  rationale: ദത്തിവ് പരോക്ഷകർമത്തെ നേരിട്ട്, സ്വാഭാവികമായ മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: കാഹളം കൈവശമുണ്ടായിരുന്ന
  rationale: ആരോടാണ് സംസാരിച്ചതെന്ന് വ്യക്തമാക്കുന്ന articular participial phrase-ന്റെ വിശേഷണാത്മക ശക്തി നിലനിർത്തുന്നു.
- source_word: Λῦσον
  choice: അഴിച്ചുവിടുക
  rationale: λύω എന്ന ക്രിയയുടെ നിയന്ത്രണം നീക്കി മോചിപ്പിക്കുക എന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: നാല് ദൂതന്മാരെ
  rationale: സംഖ്യയും നേരിട്ടുള്ള കർമവും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: τοὺς δεδεμένους
  choice: ബന്ധിക്കപ്പെട്ടിരിക്കുന്ന
  rationale: ഗ്രീക്ക് perfect passive participle സൂചിപ്പിക്കുന്ന, മുമ്പുണ്ടായ ബന്ധനത്തിന്റെ ഫലമായി ഇപ്പോഴും തുടരുന്ന അവസ്ഥ പ്രകടമാക്കുന്നു.
- source_word: ἐπὶ τῷ ποταμῷ
  choice: നദിക്കരികെ
  rationale: ദത്തിവോടുകൂടിയ ἐπί ഇവിടെ സ്ഥാനബന്ധം സൂചിപ്പിക്കുന്നു; നദിയോടു ബന്ധപ്പെട്ട സ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: മഹാനദിയായ യൂഫ്രട്ടീസ്
  rationale: നദിയുടെ വിശേഷണവും പേരും നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്ക് apposition മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: നാല് ദൂതന്മാരുടെ സ്വഭാവവും നൈതിക നിലയും
  choice: “നാല് ദൂതന്മാർ” എന്നു മാത്രം വിവർത്തനം ചെയ്തു
  alternative: “വീണുപോയ നാല് ദൂതന്മാർ” അല്ലെങ്കിൽ “ന്യായവിധിക്കായി നിയമിക്കപ്പെട്ട നാല് ദൂതന്മാർ”
  rationale: വാക്യം അവരെ ബന്ധിക്കപ്പെട്ട ദൂതന്മാർ എന്നു മാത്രമാണ് തിരിച്ചറിയിക്കുന്നത്. അവരുടെ നൈതിക നില നിർണ്ണയിക്കുന്ന വിശേഷണം ചേർക്കുന്നത് മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ഒരു ദൈവശാസ്ത്ര നിഗമനം ഇറക്കുമതി ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വെളിപ്പാട് ഗ്രന്ഥത്തിന്റെ ഗൗരവമുള്ള ആഖ്യാനശൈലി നിലനിർത്താൻ “കാഹളം,” “മഹാനദി,” “ദൂതന്മാർ” എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചു.
