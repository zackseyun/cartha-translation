id: REV.9.12
reference: Revelation 9:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ μία ἀπῆλθεν· ἰδοὺ ἔρχεται ἔτι δύο οὐαὶ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/012.yaml
  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: ml
  text: ഒന്നാമത്തെ കഷ്ടം കഴിഞ്ഞുപോയി[a]. ഇതാ[b], ഇവയ്ക്കുശേഷം ഇനിയും രണ്ടു കഷ്ടങ്ങൾ വരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആ ഒരു കഷ്ടം കഴിഞ്ഞുപോയി’; ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ആ ഒരു കഷ്ടം’ എന്നാണ്. എങ്കിലും സന്ദർഭത്തിൽ ഇത് ഒരു പരമ്പരയിലെ ഒന്നാമത്തേതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇതിനുശേഷം രണ്ടു കഷ്ടങ്ങൾകൂടി വരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: കഷ്ടം
  rationale: ന്യായവിധിയോടുകൂടിയ വരാനിരിക്കുന്ന ദുരന്തത്തെ സൂചിപ്പിക്കുന്ന വെളിപ്പാട് സാഹിത്യത്തിലെ ആവർത്തിത പ്രയോഗത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; സാധാരണ വായനക്കാർക്കും സ്വാഭാവികമാണ്.
- source_word: ἡ μία
  choice: ഒന്നാമത്തെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒന്ന്’ എന്നാണെങ്കിലും, മുമ്പ് അറിയിച്ച മൂന്ന് കഷ്ടങ്ങളിൽ ആദ്യത്തേതിനെ വേർതിരിക്കുന്നതിനാൽ ഇവിടെ ക്രമസൂചക അർഥമാണ്.
- source_word: ἀπῆλθεν
  choice: കഴിഞ്ഞുപോയി
  rationale: ആദ്യ കഷ്ടം അവസാനിച്ചുവെന്ന പൂർത്തിയായ സംഭവബോധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἰδού
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന കാര്യത്തിലേക്ക് അടിയന്തരമായി ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രവാചക ശൈലിയിലെ സൂചകം നിലനിർത്തുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: ശേഷിക്കുന്ന രണ്ടു കഷ്ടങ്ങളും വരാനിരിക്കുന്നുവെന്ന സജീവവും സമീപസ്ഥവുമായ ഭാവം നൽകുന്നു; ഗ്രീക്കിലെ ഏകവചന ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചന കർത്താവിനോടു ചേർക്കുന്നു.
- source_word: ἔτι
  choice: ഇനിയും
  rationale: ആദ്യത്തേതിനു പുറമേ രണ്ടു കഷ്ടങ്ങൾ ശേഷിക്കുന്നുവെന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: μετὰ ταῦτα
  choice: ഇതിനുശേഷം
  rationale: ഗ്രീക്കിലെ കാലക്രമബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ഇവയ്ക്കുശേഷം’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപവും സാധ്യമാണ്.
theological_decisions:
- issue: മൂന്നു കഷ്ടങ്ങളുടെ വെളിപ്പാട്-ക്രമം
  choice: അറിയിക്കപ്പെട്ട കഷ്ടങ്ങളിൽ ഒന്നാമത്തേത് അവസാനിച്ചു; രണ്ടെണ്ണംകൂടി പിന്നാലെ വരുന്നു.
  alternative: ‘കഷ്ടം’ എന്ന ആവർത്തിത സൂത്രവാക്യം ഒഴിവാക്കി പൊതുവായി ‘വിധി’ അല്ലെങ്കിൽ ‘ദുരന്തം’ എന്നു വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം കഷ്ടങ്ങളുടെ എണ്ണപ്പെട്ട ക്രമത്തെ ഊന്നുന്നു. ‘ഒന്നാമത്തെ’, ‘കഷ്ടം’, ‘ഇനിയും രണ്ടു’ എന്നിവ നിലനിർത്തുന്നത് അധിക വ്യാഖ്യാനം ചേർക്കാതെ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ ഘടന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രവാചക-വെളിപ്പാട് ശൈലി. ‘ഇതാ’ എന്നത് ἰδούവിന്റെ ശ്രദ്ധാകർഷക ശക്തി നിലനിർത്തുന്നു; ‘കഷ്ടം’ οὐαίയുടെ ദുരന്തവും ന്യായവിധിഗൗരവവും ഒരുമിച്ച് വഹിക്കുന്നു.
