id: REV.9.4
reference: Revelation 9:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: ml
  text: ഭൂമിയിലെ പുല്ലിനെയോ, പച്ചയായ യാതൊന്നിനെയോ, ഒരു വൃക്ഷത്തെയോ ഉപദ്രവിക്കരുത്; നെറ്റികളിൽ ദൈവത്തിന്റെ മുദ്രയില്ലാത്ത മനുഷ്യരെ മാത്രമേ ഉപദ്രവിക്കാവൂ എന്ന് അവയോടു പറയപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: അവയോടു പറയപ്പെട്ടു
  rationale: λέγωയുടെ കർമണിപ്രയോഗവും സ്ത്രീലിംഗ ബഹുവചന സർവനാമവും നിലനിർത്തുന്നു; വക്താവിനെ മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനത്തിലും ചേർക്കുന്നില്ല.
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: ഉപദ്രവിക്കരുതെന്നും
  rationale: ഈ ന്യായവിധിദർശനത്തിന്റെ പശ്ചാത്തലത്തിൽ ἀδικέω എന്നത് കേടുവരുത്തുക അഥവാ ഉപദ്രവിക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ അധികാരപൂർവ നിർദേശം നൽകുന്നു.
- source_word: τὸν χόρτον τῆς γῆς
  choice: ഭൂമിയിലെ പുല്ല്
  rationale: χόρτος എന്നതിന്റെ സാധാരണ സസ്യസംബന്ധമായ അർഥവും γῆς എന്ന ജനിറ്റീവ് ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐδὲ πᾶν χλωρόν
  choice: പച്ചയായ ഒന്നും
  rationale: നാമവൽക്കരിച്ച χλωρόν അക്ഷരാർഥത്തിൽ ‘പച്ചയായ ഒന്ന്’ എന്നാണ്; ‘ചെടി’ എന്നു ചുരുക്കാതെ അതിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: οὐδὲ πᾶν δένδρον
  choice: ഏതെങ്കിലും വൃക്ഷം
  rationale: δένδρον എന്നതിന്റെ നേരിട്ടുള്ള അർഥം; മുൻപുള്ള സസ്യപദങ്ങളോടുള്ള ഏകോപനം നിലനിർത്തുന്നു.
- source_word: εἰ μὴ τοὺς ἀνθρώπους
  choice: മനുഷ്യരെ മാത്രമേ
  rationale: εἰ μή അനുവദിക്കപ്പെട്ട ഏക ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; ἄνθρωποι പുരുഷന്മാർക്ക് മാത്രമല്ല, മനുഷ്യരെ പൊതുവേ സൂചിപ്പിക്കുന്നു.
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മുദ്ര
  rationale: വെളിപ്പാടിലെ ദൈവിക ഉടമസ്ഥതയുടെയും സംരക്ഷണത്തിന്റെയും പ്രധാന പ്രതീകമായ σφραγίς നേരിട്ട് ‘മുദ്ര’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐπὶ τῶν μετώπων
  choice: നെറ്റികളിൽ
  rationale: μέτωπον എന്നത് നെറ്റി; ബഹുവചനവും സ്ഥാനബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ἀνθρώπους എന്നതിന്റെ വ്യാപ്തി
  choice: എല്ലാ ലിംഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന ‘മനുഷ്യർ’
  alternative: പുരുഷന്മാർ
  rationale: ഇവിടെ സസ്യലോകത്തോടു മനുഷ്യരെ പൊതുവായി വിരുദ്ധമായി നിർത്തുന്നു; പുരുഷന്മാർക്ക് മാത്രമായി പരിമിതപ്പെടുത്താൻ സന്ദർഭത്തിൽ അടിസ്ഥാനമില്ല.
- issue: കർമണിപ്രയോഗത്തിലുള്ള നിർദേശത്തിന്റെ ഉറവിടം
  choice: വക്താവിനെ വ്യക്തമാക്കാതെ ‘അവയോടു പറയപ്പെട്ടു’
  alternative: ദൈവം അവയോടു കല്പിച്ചു
  rationale: ἐρρέθη എന്ന കർമണിപ്രയോഗം വക്താവിനെ പരാമർശിക്കുന്നില്ല. സന്ദർഭത്തിൽ അധികാരപൂർവ നിർദേശമാണെങ്കിലും ദൈവത്തെ വ്യക്തമായ കർത്താവായി വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: ഉപദ്രവത്തിന് അനുവദിക്കപ്പെട്ടവരുടെ പരിധി
  choice: ദൈവത്തിന്റെ മുദ്രയില്ലാത്ത മനുഷ്യർ മാത്രം
  alternative: മുദ്രയുള്ളവരെയും ഉൾപ്പെടെ മനുഷ്യർ പൊതുവേ
  rationale: εἰ μή എന്ന അപവാദപ്രയോഗവും തുടർന്നുള്ള ബന്ധവാക്യവും ലക്ഷ്യത്തെ വ്യക്തമായി പരിമിതപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദർശനത്തിലെ വെട്ടുക്കിളികളെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ബഹുവചന αὐταῖς മലയാളത്തിൽ ലിംഗനിരപേക്ഷമായ ‘അവയോട്’ എന്നു നൽകിയിരിക്കുന്നു. πᾶν χλωρόν എന്നതിന്റെ വിശാലത ‘പച്ചയായ ഒന്ന്’ എന്ന പ്രയോഗത്തിൽ സംരക്ഷിച്ചു.
