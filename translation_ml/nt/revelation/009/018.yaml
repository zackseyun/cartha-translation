id: REV.9.18
reference: Revelation 9:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπὸ τῶν τριῶν πληγῶν τούτων ἀπεκτάνθησαν τὸ τρίτον τῶν ἀνθρώπων, ⸀ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: ml
  text: ഈ മൂന്നു ബാധകളാൽ—അവയുടെ വായുകളിൽനിന്ന് പുറപ്പെടുന്ന തീയും പുകയും ഗന്ധകവും മൂലം—മനുഷ്യരിൽ മൂന്നിലൊന്ന് കൊല്ലപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനുഷ്യരാശിയുടെ മൂന്നിലൊന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം ആൺമനുഷ്യരെ മാത്രമല്ല, മനുഷ്യരെ പൊതുവെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: ഈ മൂന്നു ബാധകളാൽ
  rationale: ἀπό ഇവിടെ സ്ഥലപരമായ വേർപാടല്ല, മരണത്തിന്റെ കാരണം/മാർഗം സൂചിപ്പിക്കുന്നു. τούτων എന്ന നിർദ്ദേശകപദം ‘ഈ’ എന്നു നിലനിർത്തുന്നു; πληγαίയ്ക്ക് വെളിപ്പാടിലെ ന്യായവിധിയുടെ പ്രഹരങ്ങൾ എന്ന അർഥത്തിൽ ‘ബാധകൾ’ സ്വാഭാവികമാണ്.
- source_word: ἀπεκτάνθησαν
  choice: കൊല്ലപ്പെട്ടു
  rationale: ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയഭാവം നേരിട്ട് നിലനിർത്തുന്ന, സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: മനുഷ്യരിൽ മൂന്നിലൊന്നു
  rationale: ഭാഗസൂചകമായ τὸ τρίτον ‘മൂന്നിലൊന്നു’ എന്നും, ἀνθρώπων ആൺമനുഷ്യരെ മാത്രമല്ല പൊതുവെ മനുഷ്യരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മനുഷ്യരിൽ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: തീ, പുക, ഗന്ധകം എന്നിവയാൽ
  rationale: ἐκ ഇവിടെ മരണകാരകമായ ഉറവിടം/മാർഗം സൂചിപ്പിക്കുന്നു. θεῖον എന്നതിന് പരമ്പരാഗതവും ഇന്നും മനസ്സിലാകുന്നതുമായ ‘ഗന്ധകം’ ഉപയോഗിച്ചു.
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: അവയുടെ വായുകളിൽനിന്നു പുറപ്പെട്ട
  rationale: പങ്കാളിക്രിയയുടെ പുറപ്പെടൽ എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു. αὐτῶν മുമ്പ് വിവരിച്ച കുതിരസദൃശ ജീവികളെ സൂചിപ്പിക്കുന്നതിനാൽ ജഡ/മൃഗസൂചകമായ ‘അവയുടെ’ അനുയോജ്യമാണ്.
theological_decisions:
- issue: അന്ത്യകാല ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ἀνθρώπων എന്നതിന്റെ വ്യാപ്തി
  choice: മനുഷ്യരിൽ
  alternative: പുരുഷന്മാരിൽ
  rationale: ഗ്രീക്ക് പദം ഇവിടെ ലിംഗഭേദമില്ലാതെ മനുഷ്യരെ പൊതുവെ സൂചിപ്പിക്കുന്നു; അതിനെ ആൺമനുഷ്യരിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: ബാധകളും തീ, പുക, ഗന്ധകം എന്നിവയും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടാമത്തെ ഘടകം ആദ്യത്തേതിനെ വിശദീകരിക്കുന്നതായി ഡാഷുകൾകൊണ്ട് അവതരിപ്പിച്ചു
  alternative: രണ്ട് സ്വതന്ത്ര കാരണങ്ങളായി ബന്ധിപ്പിക്കൽ
  rationale: ഗ്രീക്കിലെ ἀπό ... ἐκ ... ഘടനയിൽ തീ, പുക, ഗന്ധകം എന്നിവ ‘ഈ മൂന്നു ബാധകൾ’ എന്താണെന്ന് വിശദമാക്കുന്നു. കാരണബന്ധം നിലനിർത്തിക്കൊണ്ട് ആവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ കാരണസൂചക ആവർത്തനം ഡാഷുകൾ ഉപയോഗിച്ച് സ്വാഭാവികമായി ക്രമപ്പെടുത്തി; ദൃശ്യത്തിന്റെ കഠിനതയും നിഷ്ക്രിയപ്രയോഗവും നിലനിർത്തി.
