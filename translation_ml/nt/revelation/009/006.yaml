id: REV.9.6
reference: Revelation 9:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: ml
  text: ആ ദിവസങ്ങളിൽ മനുഷ്യർ മരണം അന്വേഷിക്കും; എന്നാൽ അത് ഒരിക്കലും കണ്ടെത്തുകയില്ല. അവർ മരിക്കാൻ കൊതിക്കും; എന്നാൽ മരണം അവരിൽനിന്ന് ഓടിയകലുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: കാലസൂചനയുടെ ദൂരവാചകഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ζητήσουσιν
  choice: അന്വേഷിക്കും
  rationale: മരണത്തെ മനഃപൂർവം തേടുന്ന പ്രവൃത്തിയുടെ ഗൗരവവും ഉദ്ദേശ്യബോധവും പ്രകടമാക്കുന്നു.
- source_word: οἱ ἄνθρωποι
  choice: മനുഷ്യർ
  rationale: ἄνθρωποι ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, പൊതുവായി മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്; 'മനുഷ്യർ' രൂപവും വ്യാപ്തിയും കൃത്യമായി നൽകുന്നു.
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: അത് ഒരിക്കലും കണ്ടെത്തുകയില്ല
  rationale: οὐ μή സഹിതമുള്ള ഭാവികാലത്തിന്റെ ശക്തമായ നിഷേധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; 'അത്' മരണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: മരിക്കാൻ കൊതിക്കും
  rationale: ἐπιθυμέω സൂചിപ്പിക്കുന്ന തീവ്രമായ ആഗ്രഹം 'കൊതിക്കും' എന്നത് സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: മരണം അവരിൽനിന്ന് ഓടിയകലുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ സജീവതയും മരണത്തിന്റെ വ്യക്തിവൽക്കരണവും നിലനിർത്തുന്നു; 'ഓടിയകലുന്നു' φεύγει എന്നതിലെ ഒഴിഞ്ഞുമാറുന്ന ദൃശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അന്ത്യകാല ന്യായവിധിയുടെ ദൃശ്യത്തിൽ മരണത്തിന്റെ വ്യക്തിവൽക്കരണം
  choice: മരണം അവരിൽനിന്ന് ഓടിയകലുന്നു
  alternative: അവർക്ക് മരിക്കാൻ കഴിയുകയില്ല
  rationale: ഗ്രീക്കിൽ മരണം തന്നെയാണ് φεύγει എന്ന ക്രിയയുടെ കർത്താവ്. അതിനാൽ അർഥം വിശദീകരിച്ച് ദൃശ്യഭാഷ ഇല്ലാതാക്കാതെ, മരണത്തെ പ്രവർത്തിക്കുന്ന ഒന്നായി അവതരിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ സംഘർഷവും പ്രതീകവും നിലനിർത്തി.
- issue: οἱ ἄνθρωποι എന്ന പൊതുവാചകത്തിന്റെ വ്യാപ്തി
  choice: മനുഷ്യർ
  alternative: പുരുഷന്മാർ
  rationale: സന്ദർഭത്തിൽ ഈ പദം പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; ന്യായവിധിക്കു വിധേയരായ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. അതിനാൽ ആധുനിക മലയാളത്തിൽ 'മനുഷ്യർ' ആണ് അർഥപരമായി കൃത്യം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ രണ്ടു ഭാവികാല ക്രിയകൾക്കും പിന്നാലെയുള്ള നാടകീയ വർത്തമാനകാലമായ φεύγει-നും ഇടയിലെ വ്യത്യാസം 'അന്വേഷിക്കും/കൊതിക്കും' എന്നും 'ഓടിയകലുന്നു' എന്നും നിലനിർത്തിയിരിക്കുന്നു.
