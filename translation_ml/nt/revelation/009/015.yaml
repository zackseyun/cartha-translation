id: REV.9.15
reference: Revelation 9:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: ml
  text: ആ മണിക്കൂറിനും ദിവസത്തിനും മാസത്തിനും വർഷത്തിനുമായി ഒരുക്കിവെച്ചിരുന്ന നാല് ദൂതന്മാരെ അഴിച്ചുവിട്ടു; മനുഷ്യരിൽ മൂന്നിലൊന്നിനെ കൊല്ലേണ്ടതിനായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλύθησαν
  choice: അഴിച്ചുവിട്ടു
  rationale: മുൻവാക്യത്തിൽ ബന്ധിക്കപ്പെട്ടവരായ ദൂതന്മാരെ മോചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ, λύω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄγγελοι
  choice: ദൂതന്മാർ
  rationale: വെളിപ്പാടിലെ ദർശനാത്മക പശ്ചാത്തലത്തിൽ മനുഷ്യസന്ദേശവാഹകരല്ല, അതീന്ദ്രിയ ദൂതന്മാരാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: ἡτοιμασμένοι
  choice: ഒരുക്കിവെച്ചിരുന്ന
  rationale: മുൻകൂട്ടി ഒരുക്കപ്പെട്ടതിന്റെ ഫലമായി സജ്ജരായിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പൂർണ കർമണി കൃദന്തത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: ആ മണിക്കൂറിനും ദിവസത്തിനും മാസത്തിനും വർഷത്തിനുമായി
  rationale: സമയഘടകങ്ങളുടെ സഞ്ചിതക്രമം നിലനിർത്തുകയും കൃത്യമായി നിശ്ചയിക്കപ്പെട്ട സമയത്തിന്റെ സൂചന നൽകുകയും ചെയ്യുന്നു; അതിനെ ഒരു മൊത്തം കാലദൈർഘ്യമായി നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἵνα
  choice: കൊല്ലേണ്ടതിന്
  rationale: ഉദ്ദേശ്യത്തെ വ്യക്തമാക്കുന്ന ἵναയുടെ പ്രയോജനാർഥക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀποκτείνωσιν
  choice: കൊല്ലുക
  rationale: ഉദ്ദേശിക്കപ്പെട്ട മരണകരമായ പ്രവൃത്തിയെ വ്യക്തവും സമകാലികവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: മനുഷ്യരിൽ മൂന്നിലൊന്ന്
  rationale: ഭാഗസൂചകമായ τὸ τρίτον കൃത്യമായി നൽകുകയും ἀνθρώπων എന്നത് പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതായും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘മണിക്കൂറും ദിവസവും മാസവും വർഷവും’ എന്ന സമയപ്രയോഗത്തിന്റെ സൂചന
  choice: ദൈവികമായി കൃത്യമായി നിശ്ചയിക്കപ്പെട്ട ഒരു സമയത്തെ സഞ്ചിത സമയഘടകങ്ങളിലൂടെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: ഒരു വർഷം, മാസം, ദിവസം, മണിക്കൂർ എന്നിവ ചേർന്ന മൊത്തം കാലദൈർഘ്യം; അല്ലെങ്കിൽ കൃത്യമായ കാലക്രമം സൂചിപ്പിക്കാതെ ദൈവത്തിന്റെ പരമാധികാരമുള്ള സമയനിർണയം മാത്രം.
  rationale: ഗ്രീക്കിൽ ഒരൊറ്റ നിർദേശകപദത്തിന്റെ കീഴിലുള്ള സമയഘടകങ്ങളുടെ ക്രമം കൃത്യമായ നിയമനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. എന്നാൽ ദർശനാത്മക കാലക്രമം ഇതിലധികം തീർപ്പാക്കാതെ വാചകത്തിലെ സംഘർഷവും അവ്യക്തതയും നിലനിർത്തുന്നു.
- issue: ἀνθρώπων എന്നതിന്റെ വ്യാപ്തി
  choice: മനുഷ്യർ
  alternative: മനുഷ്യകുലം; ആളുകൾ; പുരുഷന്മാർ
  rationale: ഇവിടെ പദം പുരുഷന്മാരെ പ്രത്യേകമായി അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യർ’ ഈ വ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ കർമണി ആശയം മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ സൂക്ഷിച്ചിരിക്കുന്നു. ‘മനുഷ്യർ’ എന്നത് ലിംഗപരമായി കൃത്യമായ പൊതുസൂചനയാണ്.
