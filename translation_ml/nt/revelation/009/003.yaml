id: REV.9.3
reference: Revelation 9:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: ml
  text: പുകയിൽനിന്ന് വെട്ടുക്കിളികൾ ഭൂമിയിലേക്കു പുറത്തുവന്നു; ഭൂമിയിലെ തേളുകൾക്ക് അധികാരമുള്ളതുപോലെ, അവയ്ക്കും അധികാരം[a] നൽകപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശക്തി.’ ഗ്രീക്ക് പദത്തിന് അധികാരം, അവകാശം, ശക്തി എന്നീ അർഥങ്ങൾ വരാം; കർമണിപ്രയോഗത്തിൽ അനുവദിച്ചുനൽകപ്പെട്ട കഴിവ് എന്ന ഭാവം പ്രതിഫലിപ്പിക്കാൻ ഇവിടെ ‘അധികാരം’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ
  choice: പുകയിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന, അകത്തുനിന്നു പുറത്തേക്കുള്ള ഉദ്ഭവം മലയാളത്തിൽ സ്വാഭാവികമായും ദൃശ്യവുമായും അറിയിക്കുന്നു.
- source_word: ἐξῆλθον
  choice: പുറത്തുവന്നു
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ പുറത്തേക്കുള്ള ചലനം വ്യക്തമായി നിലനിർത്തുന്നു; പുകയിൽനിന്നുള്ള ഉദ്ഭവത്തിന്റെ ദൃശ്യം ശക്തമാക്കുന്നു.
- source_word: ἀκρίδες
  choice: വെട്ടുക്കിളികൾ
  rationale: ബൈബിൾ-അപ്പോക്കലിപ്റ്റിക് പശ്ചാത്തലത്തിൽ ἀκρίς എന്ന പദത്തിന്റെ പതിവും കൃത്യവുമായ മലയാള പദം.
- source_word: εἰς τὴν γῆν
  choice: ഭൂമിയിലേക്കു
  rationale: εἰς എന്നതിലെ ദിശാസൂചന നിലനിർത്തുകയും γῆയെ ഇവിടെ വിശാലമായ ‘ഭൂമി’ എന്ന അർഥത്തിൽ പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: അവയ്ക്കും അധികാരം നൽകപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തി, നൽകിയത് ആരെന്ന് വാക്യത്തിൽ വ്യക്തമാക്കാതെ വിടുന്നു. ἐξουσίαയ്ക്ക് ഇവിടെ ഏൽപ്പിക്കപ്പെട്ട അനുമതി/അധികാരം എന്ന ഭാവം ഉണ്ട്.
- source_word: ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς
  choice: ഭൂമിയിലെ തേളുകൾക്ക് അധികാരമുള്ളതുപോലെ
  rationale: ὡς അവതരിപ്പിക്കുന്ന താരതമ്യം നേരിട്ട് നിലനിർത്തുന്നു; οἱ σκορπίοι τῆς γῆς എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ‘ഭൂമിയിലെ തേളുകൾ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: വെട്ടുക്കിളികൾക്കു നൽകപ്പെട്ട ശേഷിയുടെ സ്വഭാവം
  choice: ἐξουσίαയെ ‘അധികാരം’ എന്നു പരിഭാഷപ്പെടുത്തി ‘നൽകപ്പെട്ടു’ എന്ന കർമണിപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ശക്തി’ എന്നു പരിഭാഷപ്പെടുത്തുകയോ, നൽകിയത് ദൈവമാണെന്ന് മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കുകയോ ചെയ്യാം.
  rationale: വാചകം സ്വതന്ത്രമായ ബലത്തേക്കാൾ അനുവദിക്കപ്പെട്ട അധികാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. നൽകുന്നയാളെ ഗ്രീക്ക് വ്യക്തമാക്കാത്തതിനാൽ പരിഭാഷയും ആ ദൈവശാസ്ത്രപരമായ സംയമനം പാലിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ‘അധികാരം’ എന്ന ആവർത്തനം ഗ്രീക്ക് മൂലത്തിലെ ἐξουσίαയുടെ ആവർത്തനവും താരതമ്യത്തിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
