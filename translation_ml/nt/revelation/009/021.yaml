revisions:
- from: അവർ തങ്ങളുടെ കൊലപാതകങ്ങളിൽനിന്നോ മന്ത്രവാദങ്ങളിൽനിന്നോ ലൈംഗിക അധാർമികതയിൽനിന്നോ മോഷണങ്ങളിൽനിന്നോ മാനസാന്തരപ്പെട്ടില്ല.[a]
