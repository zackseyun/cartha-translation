id: REV.9.21
reference: Revelation 9:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ കൊലപാതകങ്ങളിൽനിന്നും, മന്ത്രവാദങ്ങളിൽനിന്നും[a], ലൈംഗിക അധാർമികതയിൽനിന്നും, മോഷണങ്ങളിൽനിന്നും മാനസാന്തരപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മന്ത്രവാദങ്ങൾ” എന്നതിന് “മാന്ത്രികവിദ്യകൾ” എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് പദം ഔഷധക്കൂട്ടുകളുമായോ വിഷപ്രയോഗങ്ങളുമായോ ബന്ധപ്പെട്ടു വരാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν
  choice: മാനസാന്തരപ്പെട്ടില്ല
  rationale: ഈ ധാർമിക പശ്ചാത്തലത്തിൽ μετανοέω വെറും മനസ്സുമാറ്റമല്ല, പാപത്തിൽനിന്നുള്ള മാനസാന്തരത്തെ സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന ἐκ-പ്രയോഗങ്ങളോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: ἐκ
  choice: -യിൽനിന്ന്
  rationale: μετανοέω-യോടുള്ള ἐκ ഓരോ പാപത്തിൽനിന്നും തിരിഞ്ഞുമാറുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ ‘-യിൽനിന്ന്’ എന്നു നിലനിർത്തി.
- source_word: φόνων
  choice: കൊലപാതകങ്ങൾ
  rationale: φόνος ധാർമികവും കുറ്റകരവുമായ മനുഷ്യഹത്യയെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘കൊലകൾ’ എന്നതിനെക്കാൾ ‘കൊലപാതകങ്ങൾ’ യോജിക്കുന്നു.
- source_word: φαρμάκων
  choice: മന്ത്രവാദങ്ങൾ
  rationale: വെളിപ്പാടിലെ അന്ത്യദർശനപരവും ധാർമികവുമായ സന്ദർഭത്തിൽ ഈ പദം പ്രധാനമായും മാന്ത്രികമോ ഗൂഢവിദ്യാസംബന്ധമോ ആയ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു. ഔഷധക്കൂട്ടുകൾ, വിഷപ്രയോഗങ്ങൾ എന്നീ വിപുലമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: πορνείας
  choice: ലൈംഗിക അധാർമികത
  rationale: πορνεία-യുടെ വിശാലമായ ലൈംഗിക-ധാർമിക അർത്ഥപരിധി നിലനിർത്തുന്ന, ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗമാണിത്.
- source_word: κλεμμάτων
  choice: മോഷണങ്ങൾ
  rationale: κλέμμα മോഷ്ടിച്ച വസ്തുവിനെയോ മോഷണപ്രവൃത്തിയെയോ സൂചിപ്പിക്കാം; ദുഷ്പ്രവൃത്തികളുടെ ഈ പട്ടികയിൽ ‘മോഷണങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: -നിന്നോ ... -നിന്നോ ... -നിന്നോ
  rationale: ആദ്യത്തെ നിഷേധത്തോടു ചേർന്ന ആവർത്തിത പരമ്പര മലയാളത്തിൽ ‘-ഓ’ ഘടനയിലൂടെ സ്വാഭാവികമായും വ്യക്തമായും അവതരിപ്പിച്ചു.
theological_decisions:
- issue: അന്ത്യദർശനപരമായ ദുഷ്പ്രവൃത്തിപ്പട്ടികയിലെ φαρμάκων എന്ന പദത്തിന്റെ അർത്ഥപരിധി
  choice: മന്ത്രവാദങ്ങൾ
  alternative: മാന്ത്രികവിദ്യകൾ; ആഭിചാരപ്രവൃത്തികൾ; ഔഷധക്കൂട്ടുകൾ അല്ലെങ്കിൽ വിഷപ്രയോഗങ്ങൾ
  rationale: വെളിപ്പാടിൽ ഇതേ പദകുടുംബം സാധാരണയായി മന്ത്രവാദത്തെയും മാന്ത്രിക വഞ്ചനയെയും സൂചിപ്പിക്കുന്നു. എന്നാൽ പദത്തിന്റെ ചരിത്രപരമായ ഔഷധക്കൂട്ട്/വിഷം സംബന്ധിച്ച അർത്ഥസാധ്യത മായ്ച്ചുകളയാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിത ἐκ ഘടന ‘-യിൽനിന്നോ’ എന്ന രൂപത്തിൽ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചിക പ്രധാനപാഠത്തിലെ പ്രസക്തമായ പദത്തിനു തൊട്ടുപിന്നിൽ നൽകിയിരിക്കുന്നു.
