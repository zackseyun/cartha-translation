id: REV.9.10
reference: Revelation 9:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: ml
  text: അവയ്ക്ക് തേളുകളെപ്പോലെയുള്ള വാലുകളും കുത്തുകളും ഉണ്ട്; മനുഷ്യരെ അഞ്ചുമാസത്തേക്ക് ഉപദ്രവിക്കാനുള്ള അവയുടെ ശക്തി അവയുടെ വാലുകളിലാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς
  choice: വാലുകൾ
  rationale: ദർശനത്തിലെ ശരീരഘടനാപരമായ പ്രതീകം നേരിട്ട് നിലനിർത്തുന്നു; ബഹുവചനം സംരക്ഷിക്കുന്നു.
- source_word: ὁμοίας σκορπίοις
  choice: തേളുകളുടേതുപോലെയുള്ള
  rationale: ὅμοιος + ദത്തിവ് സൂചിപ്പിക്കുന്ന സാദൃശ്യം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ വാലുകളെ തേളുകളുടെ വാലുകളോടു താരതമ്യം ചെയ്യുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κέντρα
  choice: കുത്തുമുള്ളുകൾ
  rationale: κέντρον എന്നത് കുത്തുന്ന മൂർച്ചയുള്ള ഭാഗത്തെയോ വിഷമുള്ളിനെയോ സൂചിപ്പിക്കാം. തേളിന്റെ ദൃശ്യപ്രതീകത്തിൽ ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ പദമാണ്.
- source_word: ἐξουσία
  choice: ശക്തി
  rationale: ഇവിടെ നിയമപരമായ അധികാരത്തേക്കാൾ ഉപദ്രവിക്കാനുള്ള പ്രവർത്തനശേഷിയാണ് മുൻനിൽക്കുന്നത്; അതിനാൽ 'ശക്തി' അനുയോജ്യം.
- source_word: ἀδικῆσαι
  choice: ഉപദ്രവിക്കാനുള്ള
  rationale: ഈ ന്യായവിധി-ദർശനസന്ദർഭത്തിൽ അനീതി ചെയ്യുക എന്ന അമൂർത്ത അർഥത്തേക്കാൾ ദോഷമോ വേദനയോ വരുത്തുക എന്ന അർഥമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: τοὺς ἀνθρώπους
  choice: മനുഷ്യരെ
  rationale: ἄνθρωποι ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ലിംഗഭേദമില്ലാതെ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: μῆνας πέντε
  choice: അഞ്ചുമാസത്തേക്ക്
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന accusative സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാല ബാധയുടെ ദൃശ്യത്തിൽ ἐξουσία എന്നതിന്റെ അർഥം
  choice: '''ശക്തി'' എന്നു പരിഭാഷപ്പെടുത്തി'
  alternative: '''അധികാരം'''
  rationale: വാലുകൾ മുഖേന മനുഷ്യരെ ഉപദ്രവിക്കാനുള്ള ഫലപ്രദമായ ശേഷിയാണ് വാക്യം വിവരിക്കുന്നത്. ഈ ശക്തി അനുവദിക്കപ്പെട്ടതാണോ എന്ന ദൈവശാസ്ത്രചോദ്യത്തെ പരിഭാഷ സ്വയം തീർപ്പാക്കുന്നില്ല.
- issue: τοὺς ἀνθρώπους എന്നതിന്റെ പൊതുവായ മനുഷ്യസൂചന
  choice: '''മനുഷ്യരെ'' എന്നു പരിഭാഷപ്പെടുത്തി'
  alternative: '''ആളുകളെ'''
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം ഇവിടെ മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; 'മനുഷ്യരെ' എന്നത് കൃത്യവും മാന്യവും ഉൾക്കൊള്ളുന്നതുമായ മലയാളമാണ്.
- issue: ὁμοίας σκορπίοις എന്ന സാദൃശ്യത്തിന്റെ പരിധി
  choice: '''തേളുകളുടേതുപോലെയുള്ള വാലുകൾ'''
  alternative: '''തേളുകളെപ്പോലെയുള്ള വാലുകൾ'''
  rationale: ഗ്രീക്ക് രൂപം സാദൃശ്യം സൂചിപ്പിച്ചാലും കൃത്യമായി ഏതു ഘടകത്തോടാണെന്നതിൽ സംക്ഷിപ്തമാണ്. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ വാലുകൾ തേളുകളുടെ വാലുകളോടു സദൃശമാണെന്ന സന്ദർഭസൂചന നൽകി; പ്രതീകത്തിന് അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ദർശനഗ്രന്ഥത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. വാക്യത്തിന്റെ ഗ്രീക്ക് ഘടനയും ദൃശ്യപ്രതീകവും കഴിയുന്നത്ര സംരക്ഷിച്ചുകൊണ്ട് സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു.
