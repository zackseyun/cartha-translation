id: REV.9.19
reference: Revelation 9:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: ml
  text: കാരണം, കുതിരകളുടെ ശക്തി അവയുടെ വായിലും വാലുകളിലുമാണ്; കാരണം, അവയുടെ വാലുകൾ സർപ്പങ്ങളെപ്പോലെയുള്ളവയും തലകളുള്ളവയുമാണ്; അവകൊണ്ട് അവ ഉപദ്രവിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: ശക്തി
  rationale: ഈ ദർശനസന്ദർഭത്തിൽ കുതിരകൾക്ക് ഉപദ്രവം വരുത്താനുള്ള ഫലപ്രദമായ കഴിവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഏല്പിക്കപ്പെട്ട അധികാരത്തേക്കാൾ ‘ശക്തി’ സ്വാഭാവികമാണ്.
- source_word: στόματι
  choice: വായിൽ
  rationale: ഗ്രീക്കിൽ ഏകവചനമാണുള്ളത്; ബഹുവചന കർത്താവിനോടൊപ്പം ഓരോ കുതിരയുടെയും വായിനെ വിതരണാർത്ഥത്തിൽ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഏകവചനം സ്വാഭാവികമാണ്.
- source_word: οὐραῖς
  choice: വാലുകളിൽ
  rationale: മൂലത്തിലെ ബഹുവചനം നിലനിർത്തുകയും ശക്തിയുടെ സ്ഥാനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὅμοιαι ὄφεσιν
  choice: സർപ്പങ്ങളെപ്പോലെയാണ്
  rationale: ὄφις എന്നതിന്റെ ദർശനാത്മകവും ഗൗരവമുള്ളതുമായ ഭാവം ‘സർപ്പം’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔχουσαι κεφαλάς
  choice: തലകളുള്ള
  rationale: വാലുകൾ സർപ്പങ്ങളെപ്പോലെ മാത്രമല്ല, തലകളോടുകൂടിയവയാണെന്ന ദൃശ്യവിവരണം സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: ἀδικοῦσιν
  choice: ഉപദ്രവിക്കുന്നു
  rationale: ഇവിടെ നീതിനിഷേധം എന്ന അമൂർത്ത അർത്ഥമല്ല, ദോഷമോ പരിക്കോ വരുത്തുന്നതാണ് പ്രസക്തം; ‘ഉപദ്രവിക്കുന്നു’ അത് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐν αὐταῖς
  choice: അവകൊണ്ട്
  rationale: ἐν ഇവിടെ ഉപകരണാർത്ഥത്തിൽ വരുന്നു; വാലുകൾ/അവയിലെ തലകൾ ഉപദ്രവത്തിന്റെ മാർഗമാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: രണ്ടാമത്തെ γάρ മുൻവാക്യത്തെ വിശദീകരിക്കുന്നു; ആദ്യത്തെ γάρ മുൻവാക്യസന്ദർഭത്തോടുള്ള ബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാതെയും നിലനിൽക്കുന്നു.
theological_decisions:
- issue: കുതിരകളുടെ വാലുകളും തലകളും ഉൾപ്പെടുന്ന അന്ത്യകാല ദർശനചിത്രം
  choice: ചിത്രണം വ്യാഖ്യാനാത്മക പ്രതീകവത്കരണം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  alternative: വാലുകളെ വ്യാജോപദേശമോ പൈശാചിക പ്രവർത്തനമോ ആയി പരിഭാഷയിൽ തന്നെ വ്യാഖ്യാനിക്കുക
  rationale: ഗ്രീക്ക് പാഠം ദർശനത്തിലെ രൂപം വിവരിക്കുകയാണ്; അതിന്റെ പ്രതീകാർത്ഥം പരിഭാഷയിൽ നിശ്ചയിക്കുന്നത് യഥാർഥത്തിലുള്ള തുറന്ന നില ഇല്ലാതാക്കും.
translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദർശനചിത്രത്തിന്റെ അസാധാരണത ലഘൂകരിക്കുകയോ വ്യാഖ്യാനിച്ച് തീർക്കുകയോ ചെയ്തിട്ടില്ല. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകൾ പാഠസാക്ഷ്യവുമായി പൊരുത്തപ്പെടാത്തതായി തോന്നുന്നതിനാൽ അവ പകർത്തിയിട്ടില്ല: ὅμοιαι ὄφεσιν എന്നത് വാലുകളെ സർപ്പങ്ങളോട് ഉപമിക്കുന്ന മുഖ്യപാഠമാണ്; ἔχουσαι κεφαλάς എന്നതിന് ‘തലകളുള്ള’ എന്ന നേരിട്ടുള്ള പരിഭാഷ മതിയാകുന്നു.'
