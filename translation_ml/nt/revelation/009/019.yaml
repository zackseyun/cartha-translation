revisions:
- from: കുതിരകളുടെ ശക്തി അവയുടെ വായിലും വാലുകളിലുമാണ്; എന്തെന്നാൽ, അവയുടെ വാലുകൾ തലകളുള്ള സർപ്പങ്ങളെപ്പോലെയാണ്; അവകൊണ്ട് അവ ഉപദ്രവിക്കുന്നു.
  to: കാരണം, കുതിരകളുടെ ശക്തി അവയുടെ വായിലും വാലുകളിലുമാണ്; കാരണം, അവയുടെ വാലുകൾ സർപ്പങ്ങളെപ്പോലെയുള്ളവയും തലകളുള്ളവയുമാണ്; അവകൊണ്ട് അവ ഉപദ്രവിക്കുന്നു.
  rationale: 'The revision makes ‘തലകളുള്ളവ’ agree unambiguously with the tails, preserves both explanatory clauses, and retains the vivid apocalyptic imagery without supplying an allegorical meaning. No footnote is required: the Greek wording is directly expressible in Malayalam, and the supplied English footnote alternatives are not needed for this rendering.'
  reviewer_model: gpt-5.6-terra
