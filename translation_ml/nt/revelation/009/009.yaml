id: REV.9.9
reference: Revelation 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: ml
  text: അവയ്ക്ക് ഇരുമ്പ് നെഞ്ചുകവചങ്ങൾ പോലെയുള്ള നെഞ്ചുകവചങ്ങൾ ഉണ്ടായിരുന്നു; അവയുടെ ചിറകുകളുടെ ശബ്ദം യുദ്ധത്തിലേക്കു പാഞ്ഞോടുന്ന അനേകം കുതിരകൾ വലിക്കുന്ന രഥങ്ങളുടെ ശബ്ദംപോലെ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യുദ്ധത്തിലേക്കു ഓടുന്ന അനേകം കുതിരകളുടെ രഥങ്ങളുടെ ശബ്ദംപോലെ.”'
    reason: τρεχόντων എന്നതിന്റെ അടിസ്ഥാനാർഥമായ “ഓടുന്ന” എന്ന രൂപവും, ἁρμάτων ἵππων πολλῶν എന്ന ഗ്രീക്ക് ജനിറ്റീവ് ഘടനയും സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: θώρακας
  choice: നെഞ്ചുകവചങ്ങൾ
  rationale: θώραξ നെഞ്ചും ശരീരത്തിന്റെ മുൻഭാഗവും സംരക്ഷിക്കുന്ന കവചത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; ‘നെഞ്ചുകവചം’ കൃത്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: ὡς θώρακας σιδηροῦς
  choice: ഇരുമ്പുകൊണ്ടുള്ള നെഞ്ചുകവചങ്ങൾപോലെയുള്ള
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ നിലനിർത്തുകയും σιδηροῦς എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ‘ഇരുമ്പുകൊണ്ടുള്ള’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: φωνὴ
  choice: ശബ്ദം
  rationale: ഇവിടെ φωνή ചിറകുകളും രഥങ്ങളും ഉണ്ടാക്കുന്ന കേൾവിയനുഭവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ശബ്ദം’ യോജിക്കുന്നു.
- source_word: πτερύγων
  choice: ചിറകുകളുടെ
  rationale: πτέρυξ എന്നതിന് നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യപദം ‘ചിറക്’ ആണ്.
- source_word: ἁρμάτων ἵππων πολλῶν
  choice: അനേകം കുതിരകളുടെ രഥങ്ങളുടെ
  rationale: ഗ്രീക്കിലെ രഥം–കുതിര ബന്ധവും ‘അനേകം’ എന്നതിന്റെ വ്യാകരണബന്ധവും കഴിയുന്നത്ര തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു; കുതിരകൾ തന്നെയാണോ ഓടുന്നത്, അതോ മുഴുവൻ രഥസമൂഹമാണോ പാഞ്ഞുപോകുന്നത് എന്ന ഘടനാപരമായ ചെറിയ അനിശ്ചിതത്വം പരിഹരിച്ചുകളയുന്നില്ല.
- source_word: τρεχόντων
  choice: പാഞ്ഞുപോകുന്ന
  rationale: τρέχω എന്നതിന്റെ വേഗമേറിയ ചലനം യുദ്ധസന്ദർഭത്തിൽ സ്വാഭാവികവും സജീവവുമായി പ്രകടിപ്പിക്കുന്നു; ‘ആക്രമിക്കുന്ന’ എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: εἰς πόλεμον
  choice: യുദ്ധത്തിലേക്കു
  rationale: εἰς എന്ന ദിശാബോധവും πόλεμος എന്ന യുദ്ധാർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ ദർശനത്തിലെ ദൃശ്യത്തിന്റെ സ്വഭാവം
  choice: ὡς സൂചിപ്പിക്കുന്ന ഉപമകളായി വിവരണം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: വെട്ടുക്കിളികളെ യന്ത്രങ്ങളായോ ഭൂതങ്ങളായോ ഒരു പ്രത്യേക പ്രതീകസൈന്യമായോ പരിഭാഷയിൽ തിരിച്ചറിയുക.
  rationale: മൂലവാക്യം താരതമ്യങ്ങൾ മാത്രമാണ് നൽകുന്നത്; വിവാദമായ അന്ത്യകാല വ്യാഖ്യാനം പരിഭാഷയിൽ തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും വ്യക്തവുമായ ശൈലി. ദർശനാത്മക ഉപമകൾ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ഉപമയ്ക്കു ശേഷം പ്രധാന പാഠത്തിൽ നൽകിയിരിക്കുന്നു.
