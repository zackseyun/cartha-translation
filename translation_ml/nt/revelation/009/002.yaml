id: REV.9.2
reference: Revelation 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: ml
  text: അവൻ അഗാധഗർത്തത്തിന്റെ ലംബകുഴി[a] തുറന്നു. ആ ലംബകുഴിയിൽനിന്ന് ഒരു വലിയ ചൂളയിലെ പുകപോലെ പുക ഉയർന്നു; ആ ലംബകുഴിയിൽനിന്നുള്ള പുകമൂലം സൂര്യനും വായുമണ്ഡലവും ഇരുളിലായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അഗാധഗർത്തത്തിന്റെ കുഴി’; പരമ്പരാഗതമായി, ‘അടിയില്ലാക്കുഴി.’
    reason: φρέαρ എന്നതിന് ‘കുഴി’ അല്ലെങ്കിൽ ‘കിണർ’ എന്നർഥമുണ്ടാകാം; ഇവിടെ അത് അഗാധഗർത്തത്തിലേക്കുള്ള ലംബമായ പ്രവേശനതുറവിനെ സൂചിപ്പിക്കുന്നു. പരമ്പരാഗത പ്രയോഗം വ്യാഖ്യാനാത്മകമാണ്.
lexical_decisions:
- source_word: ἤνοιξεν
  choice: തുറന്നു
  rationale: ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു; എങ്ങനെ തുറന്നു എന്നത് അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: φρέαρ
  choice: കിണർവഴി
  rationale: അഗാധഗർത്തത്തിലേക്കു നയിക്കുന്ന ലംബമായ തുറന്ന പ്രവേശനപാത എന്ന ദൃശ്യം നൽകുകയും അതിനെ അഗാധഗർത്തവുമായി ഒന്നാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀβύσσου
  choice: അഗാധഗർത്തത്തിലേക്കുള്ള
  rationale: ἄβυσσος സൂചിപ്പിക്കുന്ന അത്യഗാധമായ അധോലോകസ്ഥലത്തിന്റെ ദൃശ്യം നിലനിർത്തുന്നു; പരമ്പരാഗതമായ ‘അടിയില്ലാക്കുഴി’ എന്ന വ്യാഖ്യാനാത്മക പ്രയോഗം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: ἀνέβη
  choice: ഉയർന്നു
  rationale: പുകയുടെ മുകളിലേക്കുള്ള ചലനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καπνὸς
  choice: പുക
  rationale: നേരിട്ടുള്ള സാധാരണ പദം; വാക്യത്തിലുടനീളം ഒരേപോലെ ആവർത്തിക്കുന്നു.
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: ഒരു വലിയ ചൂളയിലെ പുകപോലെ
  rationale: ὡς എന്ന ഉപമാസൂചനയും വലിയ ചൂളയുടെ ദൃശ്യവും വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἐσκοτώθη
  choice: ഇരുണ്ടുപോയി
  rationale: പുക കാരണമായി സൂര്യനും വായുമണ്ഡലവും ഇരുളിലായ ഫലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ ἥλιος
  choice: സൂര്യൻ
  rationale: നേരിട്ടുള്ള പദസമം.
- source_word: ὁ ἀὴρ
  choice: വായുമണ്ഡലം
  rationale: ഇവിടെ ദൃശ്യമാകുന്ന അന്തരീക്ഷത്തെ സൂചിപ്പിക്കുന്നു; ‘ആകാശം’ എന്ന് മാറ്റി ദൃശ്യത്തെ സ്വർഗമണ്ഡലത്തിലേക്കു നീക്കുന്നില്ല.
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: കിണർവഴിയിൽനിന്നുള്ള പുകമൂലം
  rationale: പുകയുടെ ഉറവിടവും ഇരുണ്ടതിന്റെ കാരണവും ഒരുമിച്ച് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വെളിപ്പാടിലെ സ്ഥലസൂചക പദങ്ങൾ പരമ്പരാഗത വ്യാഖ്യാനം കലർത്താതെ പരിഭാഷപ്പെടുത്തൽ
  choice: φρέαρ, ἄβυσσος എന്നിവ വേർതിരിച്ച് ‘അഗാധഗർത്തത്തിലേക്കുള്ള കിണർവഴി’ എന്നു നൽകി.
  alternative: ‘അടിയില്ലാക്കുഴി’ അല്ലെങ്കിൽ ‘അഗാധഗർത്തത്തിന്റെ കുഴി’
  rationale: പ്രവേശനവഴിയെയും അഗാധഗർത്തത്തെയും ഒന്നാക്കാതെ ഗ്രീക്കിലെ വ്യത്യാസം സൂക്ഷിക്കുന്നു; ‘അടിയില്ലാത്തത്’ എന്ന പരമ്പരാഗത വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കിണർവഴി’ എന്ന പദം പ്രവേശനപാതയെയും അഗാധഗർത്തത്തെയും വേർതിരിക്കുന്നു; ‘വായുമണ്ഡലം’ ἀήρ എന്നതിന്റെ അന്തരീക്ഷസൂചന നിലനിർത്തുന്നു.
