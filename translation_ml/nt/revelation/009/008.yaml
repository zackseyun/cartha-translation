  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶχον τρίχας ὡς τρίχας γυναικῶν, καὶ οἱ ὀδόντες αὐτῶν ὡς λεόντων ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/008.yaml
  text: And they had hair like women’s hair[a], and their teeth were like lions’ teeth,
translation:
  language: ml
  text: അവയ്ക്കു സ്ത്രീകളുടേതുപോലുള്ള മുടിയുണ്ടായിരുന്നു[a]; അവയുടെ പല്ലുകൾ സിംഹങ്ങളുടെ പല്ലുകൾപോലെയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “സ്ത്രീകളുടെ മുടിപോലെയുള്ള മുടി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶχον
  choice: ഉണ്ടായിരുന്നു
  rationale: ദർശനവിവരണത്തിലെ ἔχω എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ വിവരണഭൂതകാലമായി നൽകുന്നു.
- source_word: τρίχας
  choice: മുടി
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും, തലമുടിയെ സൂചിപ്പിക്കുമ്പോൾ ആധുനിക മലയാളത്തിൽ ‘മുടി’ എന്ന സമൂഹവാചകമാണ് സ്വാഭാവികം.
- source_word: ὡς τρίχας γυναικῶν
  choice: സ്ത്രീകളുടെ മുടിപോലെയുള്ള മുടി
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ നിലനിർത്തുന്നു; ആദ്യത്തെ ‘മുടി’ എന്തിനോടാണ് താരതമ്യപ്പെടുത്തുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: οἱ ὀδόντες αὐτῶν
  choice: അവയുടെ പല്ലുകൾ
  rationale: ദർശനത്തിലെ ജീവികളെ സൂചിപ്പിക്കുന്ന നപുംസക സർവനാമത്തോടുകൂടിയ സ്വാഭാവിക മലയാള ഉടമസ്ഥപ്രയോഗം.
- source_word: ὡς λεόντων
  choice: സിംഹങ്ങളുടെ പല്ലുകൾപോലെ
  rationale: താരതമ്യം പല്ലുകളോടാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ഗ്രീക്കിൽ അധ്യാഹരിച്ചിരിക്കുന്ന നാമം മലയാളത്തിൽ ആവർത്തിക്കുന്നു.
- source_word: ἦσαν
  choice: ആയിരുന്നു
  rationale: εἰμίയുടെ അപൂർണഭൂതകാലത്തെ വിവരണാത്മകമായ ലളിത ഭൂതകാലത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അപ്പോക്കലിപ്റ്റിക് ദർശനചിത്രങ്ങളുടെ സ്വഭാവം
  choice: സ്ത്രീകളുടെ മുടിയും സിംഹങ്ങളുടെ പല്ലുകളും എന്ന ഉപമകൾ വ്യാഖ്യാനിക്കാതെ നേരിട്ട് നിലനിർത്തി.
  alternative: ചിത്രങ്ങളുടെ പ്രതീകാർഥം വിവർത്തനത്തിൽ വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ദർശനത്തിലെ താരതമ്യങ്ങൾ മാത്രം നൽകുന്നു; അവയുടെ പ്രതീകാർഥം നിർവചിക്കുന്നില്ല. അതിനാൽ വിവർത്തനം ആ ദൃശ്യതീവ്രതയും വ്യാഖ്യാനതുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും ദർശനവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. മുമ്പത്തെ സന്ദർഭത്തിലെ വെട്ടുക്കിളികളെ സൂചിപ്പിക്കാൻ ‘അവ’ ഉപയോഗിച്ചു; ഉപമകളെ പ്രതീകവ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കിയിട്ടില്ല.
