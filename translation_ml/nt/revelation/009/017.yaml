revisions:
- from: 'ദർശനത്തിൽ ഞാൻ കുതിരകളെയും അവയുടെമേൽ ഇരിക്കുന്നവരെയും കണ്ടത് ഇങ്ങനെയാണ്: അവർ ധരിച്ചിരുന്ന കവചങ്ങൾ തീയുടെ നിറവും ഹയസിന്തിന്റെ നിറവും ഗന്ധകത്തിന്റെ നിറവും ഉള്ളവയായിരുന്നു[a]. കുതിരകളുടെ തലകൾ സിംഹങ്ങളുടെ തലകൾപോലെയായിരുന്നു; അവയുടെ വായിൽനിന്ന് തീയും പുകയും ഗന്ധകവും പുറപ്പെടുന്നു[b].'
  to: 'ദർശനത്തിൽ ഞാൻ കുതിരകളെയും അവയുടെമേൽ ഇരിക്കുന്നവരെയും ഇങ്ങനെയാണ് കണ്ടത്: അവർ തീച്ചുവപ്പും ഹയസിന്ത്-നീലയും ഗന്ധകമഞ്ഞയും നിറമുള്ള മാർക്കവചങ്ങൾ ധരിച്ചിരുന്നു[a]. കുതിരകളുടെ തലകൾ സിംഹങ്ങളുടെ തലകൾപോലെയായിരുന്നു; അവയുടെ വായിൽനിന്ന് തീയും പുകയും ഗന്ധകവും പുറപ്പെടുന്നു[b].'
