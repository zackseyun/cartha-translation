id: REV.9.17
reference: Revelation 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: ml
  text: 'ദർശനത്തിൽ ഞാൻ കുതിരകളെയും അവയുടെമേൽ ഇരിക്കുന്നവരെയും ഇങ്ങനെയാണ് കണ്ടത്: അവർ തീച്ചുവപ്പും ഹയസിന്ത്-നീലയും ഗന്ധകമഞ്ഞയും നിറമുള്ള മാർക്കവചങ്ങൾ ധരിച്ചിരുന്നു[a]. കുതിരകളുടെ തലകൾ സിംഹങ്ങളുടെ തലകൾപോലെയായിരുന്നു; അവയുടെ വായിൽനിന്ന് തീയും പുകയും ഗന്ധകവും പുറപ്പെടുന്നു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ രൂപാനുസൃതമായി: “തീമയവും ഹയസിന്ത്-വർണവും ഗന്ധക-വർണവുമായ മാർക്കവചങ്ങൾ.” ഹയസിന്ത് സാധാരണയായി കടുംനീലയോ നീലകലർന്ന വയലറ്റോ ആയ നിറത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: മൂന്നു ഗ്രീക്ക് വിശേഷണങ്ങളുടെ കൂടുതൽ നേരിട്ടുള്ള രൂപവും ഹയസിന്ത്-വർണത്തിന്റെ അർത്ഥവ്യാപ്തിയും വ്യക്തമാക്കുന്നു.
  - marker: b
    text: “പുറപ്പെടുന്നു” എന്ന വർത്തമാനകാലപ്രയോഗം ഗ്രീക്ക് വാക്യത്തിലെ സജീവമായ വർത്തമാനകാലം നിലനിർത്തുന്നു.
    reason: മൂലപാഠത്തിലെ കാലപ്രയോഗം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചതാണെന്ന് വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: οὕτως
  choice: കണ്ടത് ഇങ്ങനെയാണ്
  rationale: ദർശനത്തിൽ കണ്ട കാഴ്ചയുടെ സ്വഭാവമോ രീതിയോ പരിചയപ്പെടുത്തുന്ന പ്രയോഗം; ഗ്രീക്കിലെ സൂചനാത്മക ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ὁράσει
  choice: ദർശനത്തിൽ
  rationale: വെളിപ്പാടിന്റെ ദർശനാത്മക സന്ദർഭത്തിൽ ὅρασις വെറും കാഴ്ചയല്ല, ദർശനാനുഭവമാണ്.
- source_word: καθημένους ἐπ’ αὐτῶν
  choice: അവയുടെമേൽ ഇരിക്കുന്നവരെ
  rationale: ‘കുതിരപ്പടയാളികൾ’ എന്നു ചുരുക്കാതെ ഗ്രീക്കിലെ പങ്കാളിവാക്യത്തിന്റെ ദൃശ്യരൂപം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: θώρακας
  choice: കവചങ്ങൾ
  rationale: നെഞ്ചിനെ സംരക്ഷിക്കുന്ന ആയുധസജ്ജീകരണമാണ് ഉദ്ദേശിക്കുന്നത്; ‘മാർക്കവചം’ എന്ന സാങ്കേതിക പദത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് ‘കവചം’ സ്വാഭാവികമാണ്.
- source_word: πυρίνους καὶ ὑακινθίνους καὶ θειώδεις
  choice: തീയുടെ നിറവും ഹയസിന്തിന്റെ നിറവും ഗന്ധകത്തിന്റെ നിറവും ഉള്ളവ
  rationale: ദർശനത്തിലെ ദൃശ്യവിവരണത്തിൽ ഇവ നിറസൂചനകളായി പ്രവർത്തിക്കുന്നു. അതേസമയം ‘ചുവപ്പ്/നീല/മഞ്ഞ’ എന്നു കൃത്യമായി നിർണ്ണയിക്കാതെ മൂലപദങ്ങളുടെ രൂപകബന്ധവും അർത്ഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- source_word: ὡς κεφαλαὶ λεόντων
  choice: സിംഹങ്ങളുടെ തലകൾപോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἐκπορεύεται
  choice: പുറപ്പെടുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലം നിലനിർത്തി ദർശനത്തിന്റെ സജീവത പ്രകടമാക്കുന്നു; പിന്നാലെയുള്ള സംയുക്ത കർത്താവിനൊത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കുന്നു.
- source_word: θεῖον
  choice: ഗന്ധകം
  rationale: പുരാതനമോ പരമ്പരാഗതമോ ആയ അസ്പഷ്ട പദത്തിനുപകരം ആധുനിക മലയാളത്തിലെ വ്യക്തമായ വസ്തുനാമം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: കവചങ്ങളെ വിശേഷിപ്പിക്കുന്ന മൂന്നു അപോകലിപ്റ്റിക് പദങ്ങളുടെ വ്യാഖ്യാനം
  choice: ദർശനത്തിലെ നിറസൂചനകളായി പരിഭാഷപ്പെടുത്തി, എന്നാൽ ചുവപ്പ്/നീല/മഞ്ഞ എന്ന കൃത്യമായ വർണനിർണ്ണയം മുഖ്യവാക്യത്തിൽ ചേർത്തില്ല.
  alternative: ‘തീമയവും ഹയസിന്തുമയവും ഗന്ധകമയവും’ എന്നു കൂടുതൽ രൂപാനുസൃതമായി നൽകുക, അല്ലെങ്കിൽ ‘തീച്ചുവപ്പ്, ഹയസിന്ത് നീല, ഗന്ധകമഞ്ഞ’ എന്നു നിറങ്ങൾ വ്യക്തമായി നിർണ്ണയിക്കുക.
  rationale: മൂന്നു സമാന്തര വിശേഷണങ്ങളും ദൃശ്യരൂപം വിവരിക്കുന്നുവെങ്കിലും അവ നിറം മാത്രമോ, രൂപഗുണമോ, വസ്തുസാദൃശ്യമോ സൂചിപ്പിക്കുന്നുവെന്നതിൽ കുറച്ചു അർത്ഥവ്യാപ്തിയുണ്ട്. ഇപ്പോഴത്തെ രൂപം വായനാസൗകര്യവും യഥാർത്ഥ അനിശ്ചിതത്വവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ദർശനവിവരണ ശൈലി. അപൂർവമായ ‘ഹയസിന്ത്’ മൂലചിത്രം സംരക്ഷിക്കാൻ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു; അനാവശ്യമായ സഭാപാരമ്പര്യ പദങ്ങൾ ഒഴിവാക്കി.
