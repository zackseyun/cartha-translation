    rationale: θώρακες specifically denotes breastplates/chest armor. മാർക്കവചങ്ങൾ preserves this concrete feature of the image.
  - severity: low
    issue: The opening word order is slightly less natural in Malayalam.
    rationale: ദർശനത്തിൽ ഞാൻ ... ഇങ്ങനെയാണ് കണ്ടത് more smoothly expresses οὕτως εἶδον while retaining its demonstrative force.
