revisions:
- from: ഈ ബാധകളാൽ കൊല്ലപ്പെടാതിരുന്ന ശേഷിച്ച മനുഷ്യർ[a], ഭൂതങ്ങളെയും—കാണാനോ കേൾക്കാനോ നടക്കാനോ കഴിയാത്ത പൊന്ന്, വെള്ളി, വെങ്കലം, കല്ല്, മരം എന്നിവകൊണ്ടുള്ള വിഗ്രഹങ്ങളെയും—ആരാധിക്കാതിരിക്കേണ്ടതിന്[b] തങ്ങളുടെ കൈകളുടെ പ്രവൃത്തികളിൽനിന്ന് മാനസാന്തരപ്പെട്ടതുപോലുമില്ല.[c]
  to: ഈ ബാധകളിൽ കൊല്ലപ്പെടാതിരുന്ന ശേഷിച്ച മനുഷ്യർ[a] തങ്ങളുടെ കൈകളുടെ പ്രവൃത്തികളിൽനിന്ന്[c] മാനസാന്തരപ്പെടുകപോലും ചെയ്തില്ല; അങ്ങനെ അവർ ഭൂതങ്ങളെയും പൊന്ന്, വെള്ളി, വെങ്കലം, കല്ല്, മരം എന്നിവകൊണ്ടുള്ള വിഗ്രഹങ്ങളെയും ആരാധിക്കാതിരിക്കേണ്ടതിന്[b]—ആ വിഗ്രഹങ്ങൾക്ക് കാണാനോ കേൾക്കാനോ നടക്കാനോ കഴിയില്ല.
  rationale: The revision retains the source’s purpose/result ambiguity in ἵνα μή and its emphatic denial in οὐδέ, while improving Malayalam clause attachment and footnote anchoring. The final sentence explicitly identifies the powerless referent as the idols, without adding interpretation.
