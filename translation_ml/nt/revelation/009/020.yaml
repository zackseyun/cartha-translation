id: REV.9.20
reference: Revelation 9:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: ml
  text: ഈ ബാധകളിൽ കൊല്ലപ്പെടാതിരുന്ന ശേഷിച്ച മനുഷ്യർ[a] തങ്ങളുടെ കൈകളുടെ പ്രവൃത്തികളിൽനിന്ന്[c] മാനസാന്തരപ്പെടുകപോലും ചെയ്തില്ല; അങ്ങനെ അവർ ഭൂതങ്ങളെയും പൊന്ന്, വെള്ളി, വെങ്കലം, കല്ല്, മരം എന്നിവകൊണ്ടുള്ള വിഗ്രഹങ്ങളെയും ആരാധിക്കാതിരിക്കേണ്ടതിന്[b]—ആ വിഗ്രഹങ്ങൾക്ക് കാണാനോ കേൾക്കാനോ നടക്കാനോ കഴിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യരിൽ ശേഷിച്ചവർ.” ഗ്രീക്ക് പദം ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ആരാധിക്കുന്നത് അവസാനിപ്പിക്കേണ്ടതിന്.” ഗ്രീക്ക് ഉപവാക്യം ഉദ്ദേശ്യമോ ലക്ഷ്യമാക്കിയ ഫലമോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “തങ്ങളുടെ കൈകളുടെ പ്രവൃത്തികളിൽനിന്ന് മാനസാന്തരപ്പെട്ടില്ല.” ഈ സന്ദർഭത്തിൽ അവർ ഉണ്ടാക്കി ആരാധിച്ച വസ്തുക്കളെയാണ് ഈ പ്രയോഗം പ്രത്യേകിച്ച് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: ശേഷിച്ച മനുഷ്യർ
  rationale: λοιποί എന്നതിന്റെ ‘ശേഷിച്ചവർ’ എന്ന അർഥവും ἀνθρώπων എന്ന പൊതുവായ മനുഷ്യസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις
  choice: ഈ ബാധകളാൽ കൊല്ലപ്പെടാതിരുന്ന
  rationale: അയോറിസ്റ്റ് കർമണിപ്രയോഗവും πληγαί എന്ന പദത്തിന്റെ വെളിപ്പാട് സന്ദർഭത്തിലെ ന്യായവിധിബാധകൾ എന്ന അർഥവും നേരിട്ട് നൽകുന്നു.
- source_word: οὐδὲ μετενόησαν
  choice: മാനസാന്തരപ്പെട്ടതുപോലുമില്ല
  rationale: οὐδέയുടെ ഊന്നൽ ‘പോലും ഇല്ല’ എന്ന പ്രയോഗത്തിലൂടെ സൂചിപ്പിക്കുന്നു; μετανοέωയ്ക്ക് സാധാരണ ബൈബിൾ മലയാളത്തിലെ ‘മാനസാന്തരപ്പെടുക’ ഉപയോഗിക്കുന്നു.
- source_word: ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: തങ്ങളുടെ കൈകളുടെ പ്രവൃത്തികളിൽനിന്ന്
  rationale: ἐκ എന്ന ‘നിന്ന്’ ബന്ധവും ‘കൈകളുടെ പ്രവൃത്തികൾ’ എന്ന മൂർത്തമായ ബൈബിൾ ദൃശ്യവും സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് അവർ നിർമിച്ചു ആരാധിച്ചവയെ പ്രത്യേകിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: τὰ δαιμόνια
  choice: ഭൂതങ്ങൾ
  rationale: പുതിയനിയമത്തിലെ ശത്രുതാപരമായ ആത്മീയ സത്തകളെ സൂചിപ്പിക്കുന്ന δαιμόνιαയ്ക്ക് വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാള പദം.
- source_word: τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: പൊന്ന്, വെള്ളി, വെങ്കലം, കല്ല്, മരം എന്നിവകൊണ്ടുള്ള വിഗ്രഹങ്ങൾ
  rationale: വിഗ്രഹങ്ങളുടെ വസ്തുസംയോജനപ്പട്ടികയും അതിന്റെ സഞ്ചിതമായ പ്രഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: കാണാനോ കേൾക്കാനോ നടക്കാനോ കഴിയാത്ത
  rationale: വിഗ്രഹങ്ങളുടെ അശക്തിയെ പരിഹസിക്കുന്ന മൂന്നു ക്രിയകളും ചുരുക്കാതെ സംരക്ഷിക്കുന്നു; περιπατεῖν ‘നടക്കുക’ എന്നാണ് നൽകിയിരിക്കുന്നത്.
theological_decisions:
- issue: ἵνα μὴ προσκυνήσουσιν എന്ന ഘടനയിൽ മാനസാന്തരവും വിഗ്രഹാരാധന ഉപേക്ഷിക്കലും തമ്മിലുള്ള ബന്ധം
  choice: ആരാധിക്കാതിരിക്കേണ്ടതിന്
  alternative: ആരാധിക്കുന്നത് അവസാനിപ്പിക്കേണ്ടതിന്
  rationale: ἵνα μήയുടെ ഉദ്ദേശ്യ/ലക്ഷ്യസൂചന സംരക്ഷിക്കുകയും, മാനസാന്തരത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം ചേർക്കാതെ വിഗ്രഹാരാധനയിൽനിന്നുള്ള തിരിഞ്ഞുനിൽപ്പ് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: ἀνθρώπων എന്ന പദത്തിന്റെ പൊതുവായ വ്യാപ്തി
  choice: മനുഷ്യർ
  alternative: മനുഷ്യകുലത്തിൽ ശേഷിച്ചവർ
  rationale: ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; ബാധകളിൽ കൊല്ലപ്പെട്ടവരോടു വിരുദ്ധമായി ശേഷിച്ച മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ നീണ്ട വാക്യബന്ധം നിലനിർത്തിക്കൊണ്ട്, വിഗ്രഹങ്ങളെ വിശദീകരിക്കുന്ന ഉപവാക്യം ദീർഘരേഖകൾക്കുള്ളിൽ വെച്ച് വായനാസൗകര്യം വർധിപ്പിച്ചു.
