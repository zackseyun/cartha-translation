id: REV.9.16
reference: Revelation 9:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ ἀριθμὸς τῶν στρατευμάτων τοῦ ⸀ἱππικοῦ ⸀δισμυριάδες μυριάδων· ἤκουσα τὸν ἀριθμὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/016.yaml
  text: And the number of the troops of the cavalry was two hundred million; I heard their number.
translation:
  language: ml
  text: കുതിരപ്പടയിലെ സൈനികരുടെ എണ്ണം ഇരുപതു കോടി[a] ആയിരുന്നു; അവരുടെ എണ്ണം ഞാൻ കേട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, “രണ്ടു പതിനായിരങ്ങൾ × പതിനായിരം”; അതായത് ഇരുപതു കോടി.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριθμὸς
  choice: എണ്ണം
  rationale: ‘സംഖ്യ, ആകെ എണ്ണം’ എന്ന സാധാരണ അർഥം നൽകുന്നു; ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്താൻ വാക്യത്തിന്റെ രണ്ടിടത്തും ‘എണ്ണം’ ഉപയോഗിച്ചു.
- source_word: στρατευμάτων
  choice: സൈനികർ
  rationale: ഈ ബഹുവചനപദം സൈനിക വിഭാഗങ്ങളെയോ സേനകളെയോ സൂചിപ്പിക്കാം. ‘കുതിരപ്പടയിലെ സൈനികർ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും സൈനികസന്ദർഭം വ്യക്തമായി അറിയിക്കുന്നതുമാണ്.
- source_word: ἱππικοῦ
  choice: കുതിരപ്പട
  rationale: കുതിരപ്പുറത്തു പോരാടുന്ന സംഘടിത സൈനികശക്തിയെ സൂചിപ്പിക്കുന്ന കൃത്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളപദം.
- source_word: δισμυριάδες μυριάδων
  choice: ഇരുപതു കോടി
  rationale: പദപ്രയോഗത്തിന്റെ കണക്കാക്കാവുന്ന മൂല്യം 200,000,000 ആണ്. ആ സംഖ്യ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകി; ഗ്രീക്കിന്റെ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ἤκουσα
  choice: ഞാൻ കേട്ടു
  rationale: ലളിതമായ ഭൂതകാല ആഖ്യാനക്രിയയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: മുമ്പു പറഞ്ഞ കുതിരപ്പടയിലെ സൈനികരിലേക്കു തിരിഞ്ഞുനോക്കുന്ന സ്വാഭാവിക മലയാള സർവനാമരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കണക്കിന്റെ വ്യക്തത മുഖ്യവാചകത്തിൽ നിലനിർത്തുകയും മൂലഭാഷയിലെ അസാധാരണ സംഖ്യാരൂപം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
