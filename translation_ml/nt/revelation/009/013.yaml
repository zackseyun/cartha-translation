id: REV.9.13
reference: Revelation 9:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: ml
  text: ആറാമത്തെ ദൂതൻ കാഹളം ഊതി. അപ്പോൾ ദൈവത്തിന്റെ മുമ്പിലുള്ള സ്വർണയാഗപീഠത്തിന്റെ കൊമ്പുകളിൽനിന്ന് ഒരു ശബ്ദം[a] ഞാൻ കേട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരേയൊരു ശബ്ദം.’ ശബ്ദം ഒന്നായിരുന്നു എന്നതിന് ഗ്രീക്ക് പാഠം ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: കാഹളം ഊതി
  rationale: σαλπίζω എന്ന ക്രിയയുടെ അർഥം കാഹളം മുഴക്കുക/ഊതുക എന്നാണ്. മലയാളത്തിൽ സന്ദർഭം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ക്രിയയിൽ ഉൾക്കൊള്ളുന്ന വാദ്യത്തെ തുറന്നുപറഞ്ഞു.
- source_word: φωνὴν μίαν
  choice: ഒരു ശബ്ദം
  rationale: μίαν നൽകുന്ന ഏകത്വത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ശബ്ദം ആരുടേതാണെന്ന് നിർണയിക്കുന്നില്ല.
- source_word: ἐκ τῶν κεράτων
  choice: കൊമ്പുകളിൽനിന്ന്
  rationale: ἐκ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; κέρατα യാഗപീഠത്തിന്റെ കൊമ്പുപോലുള്ള projections-നെ സൂചിപ്പിക്കുന്ന ആരാധനാസംബന്ധിയായ ദൃശ്യഭാഷയാണ്.
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: സ്വർണയാഗപീഠത്തിന്റെ
  rationale: സ്വർണത്താൽ നിർമിച്ച നിർദിഷ്ട യാഗപീഠത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മുമ്പിലുള്ള
  rationale: ἐνώπιον സൂചിപ്പിക്കുന്ന ദൈവസന്നിധിയിലെ സ്ഥാനം ഔപചാരികമായി നിലനിർത്തുന്നു; യാഗപീഠം അവിടെ നിൽക്കുന്നു എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: ἄγγελος
  choice: ദൂതൻ
  rationale: വെളിപ്പാടിലെ ദർശനസന്ദർഭത്തിൽ ഇത് മനുഷ്യസന്ദേശവാഹകനെയല്ല, സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ ഭാഷയിൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ശബ്ദത്തിന്റെ വ്യക്തിത്വം
  choice: ആരുടേതെന്ന് വ്യക്തമാക്കാതെ ‘ഒരു ശബ്ദം’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ദൈവത്തിന്റെ ശബ്ദം; ഒരു ദൂതന്റെ ശബ്ദം; യാഗപീഠവുമായി ബന്ധപ്പെട്ട ശബ്ദം
  rationale: ഗ്രീക്ക് പാഠം യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽനിന്ന് ഒരു ശബ്ദം കേട്ടുവെന്നു മാത്രമേ പറയുന്നുള്ളൂ. ശബ്ദത്തിന്റെ വ്യക്തിത്വം നിർണയിക്കാതിരുന്നത് മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്വർണയാഗപീഠം’, ‘കൊമ്പുകൾ’ എന്നീ ദേവാലയദൃശ്യങ്ങൾ നിലനിർത്തി; ശബ്ദത്തിന്റെ ഉറവിടത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
