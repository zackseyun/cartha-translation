id: REV.9.11
reference: Revelation 9:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: ml
  text: അവർക്കുമേൽ രാജാവായി അഗാധത്തിന്റെ[a] ദൂതനുണ്ട്. എബ്രായഭാഷയിൽ അവന്റെ പേര് അബദ്ദോൻ[b] എന്നും ഗ്രീക്കിൽ അപ്പോല്ല്യോൻ[c] എന്നും ആണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അഗാധം’ എന്നതിന് ‘അടിത്തട്ടില്ലാത്ത കുഴി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
  - marker: b
    text: ‘അബദ്ദോൻ’ എന്ന എബ്രായപേര് നാശവുമായി ബന്ധപ്പെട്ടതാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘അപ്പോല്ല്യോൻ’ എന്ന ഗ്രീക്കുപേരിന്റെ അർഥം ‘നശിപ്പിക്കുന്നവൻ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: അവർക്കുമേൽ രാജാവായി … ഉണ്ട്
  rationale: ‘അവർക്ക്/അവർക്കുമേൽ ഉണ്ട്’ എന്ന ഗ്രീക്ക് ഘടനയും βασιλέα എന്നതിലെ രാജകീയ ദൃശ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: അഗാധത്തിന്റെ ദൂതൻ
  rationale: ἄγγελος ഇവിടെ വെളിപ്പാടിലെ അതീന്ദ്രിയ ദൂതനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൂതൻ’ എന്നു നൽകി. ἄβυσσος എന്നതിന് നേരിട്ടുള്ളതും പരമ്പരാഗത വ്യാഖ്യാനം കുറച്ച് മാത്രം ചേർക്കുന്നതുമായ ‘അഗാധം’ തിരഞ്ഞെടുത്തു.
- source_word: Ἑβραϊστὶ
  choice: എബ്രായഭാഷയിൽ
  rationale: ‘എബ്രായ ഭാഷയിൽ’ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: Ἀβαδδών
  choice: അബദ്ദോൻ
  rationale: ഇവിടെ വ്യക്തിനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; അതിന്റെ നാശവുമായി ബന്ധപ്പെട്ട അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: καὶ ἐν τῇ Ἑλληνικῇ ὄνομα ἔχει
  choice: എന്നും ഗ്രീക്കിൽ … എന്നും ആണ്
  rationale: എബ്രായ-ഗ്രീക്ക് പേരുകളുടെ സമാന്തരത സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: Ἀπολλύων
  choice: അപ്പോല്ല്യോൻ
  rationale: വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു; ‘നശിപ്പിക്കുന്നവൻ’ എന്ന സുതാര്യമായ ഗ്രീക്ക് അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: Ἀβαδδών, Ἀπολλύων എന്നീ പേരുകൾ വിവർത്തനം ചെയ്യണമോ ലിപ്യന്തരിക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘അബദ്ദോൻ’, ‘അപ്പോല്ല്യോൻ’ എന്നു ലിപ്യന്തരിച്ചു.
  alternative: ‘നാശം’, ‘നശിപ്പിക്കുന്നവൻ’ എന്നിങ്ങനെ അർഥം വിവർത്തനം ചെയ്യുക.
  rationale: ഇവ ദൂതന് നൽകിയ പേരുകളായി വാക്യത്തിൽ പ്രവർത്തിക്കുന്നു. പേരുകളുടെ അർഥം പ്രധാനമായതിനാൽ അത് മുഖ്യപാഠത്തെ മാറ്റാതെ അടിക്കുറിപ്പുകളിൽ നൽകി.
- issue: ἀβύσσου എന്നതിന്റെ ദൃശ്യരൂപം
  choice: അഗാധം
  alternative: അടിയില്ലാത്ത കുഴി
  rationale: ‘അഗാധം’ ഗ്രീക്ക് പദത്തിന്റെ കൂടുതൽ നേരിട്ടുള്ള തുല്യപദമാണ്; ‘അടിയില്ലാത്ത കുഴി’ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പരമ്പരാഗത പ്രയോഗമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ‘അവർക്കുമേൽ രാജാവായി’ എന്ന ബന്ധവും എബ്രായ-ഗ്രീക്ക് പേരുകളുടെ സമാന്തരതയും നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പ്-ചിഹ്നക്രമത്തിലെ പൊരുത്തക്കേട് തിരുത്തി: [a] അഗാധം, [b] അബദ്ദോൻ, [c] അപ്പോല്ല്യോൻ.'
