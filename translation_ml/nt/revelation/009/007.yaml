source:
  edition: SBLGNT
  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: ml
  text: വെട്ടുക്കിളികളുടെ രൂപങ്ങൾ യുദ്ധത്തിനായി ഒരുക്കിയ കുതിരകളെപ്പോലെയായിരുന്നു; അവയുടെ തലകളിൽ സ്വർണംപോലുള്ള കിരീടങ്ങൾപോലെയുള്ളവ[a] ഉണ്ടായിരുന്നു; അവയുടെ മുഖങ്ങൾ മനുഷ്യരുടെ മുഖങ്ങൾപോലെയായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിജയമാലകൾ’; ഗ്രീക്ക് στέφανοι എന്ന പദത്തിന് ബഹുമതിയോടോ വിജയത്തോടോ ബന്ധപ്പെട്ട മാലാകൃതിയിലുള്ള കിരീടങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘മനുഷ്യരുടെ മുഖങ്ങൾ’; ഈ പ്രയോഗം പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοιώματα
  choice: രൂപങ്ങൾ
  rationale: ദർശനത്തിൽ കാണപ്പെട്ട ബാഹ്യരൂപത്തെയും സാദൃശ്യത്തെയും സൂചിപ്പിക്കുന്നു; യഥാർഥ സ്വരൂപമാണെന്ന് ഉറപ്പിക്കാതെ ദൃശ്യപ്രതീതി നിലനിർത്തുന്നു.
- source_word: ἀκρίδων
  choice: വെട്ടുക്കിളികളുടെ
  rationale: ἀκρίς എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപരിഭാഷ.
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: യുദ്ധത്തിനായി ഒരുക്കിയ കുതിരകളെപ്പോലെയായിരുന്നു
  rationale: സാദൃശ്യവും കുതിരകൾ യുദ്ധസജ്ജമായ നിലയിലാണെന്ന perfect passive participle-ന്റെ ആശയവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: അവയുടെ തലകളിൽ
  rationale: ἐπί സൂചിപ്പിക്കുന്ന സ്ഥാനബന്ധത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: ὡς στέφανοι
  choice: കിരീടങ്ങൾ എന്നു തോന്നിക്കുന്നവ
  rationale: ὡς എന്ന താരതമ്യസൂചന നിലനിർത്തുകയും അവ യഥാർഥ കിരീടങ്ങളാണെന്ന് ഉറപ്പിച്ചു പറയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: στέφανοι
  choice: കിരീടങ്ങൾ
  rationale: στέφανος കിരീടത്തെയോ ബഹുമതി/വിജയവുമായി ബന്ധപ്പെട്ട പുഷ്പമാലാകൃതിയിലുള്ള കിരീടത്തെയോ സൂചിപ്പിക്കാം; പൊതുവായ അർഥം മുഖ്യവാചകത്തിലും പ്രത്യേക സാധ്യത അടിക്കുറിപ്പിലും നൽകുന്നു.
- source_word: ὅμοιοι χρυσῷ
  choice: സ്വർണംപോലെയുള്ള
  rationale: ഇത് സ്വർണത്തിൽ നിർമിച്ചതാണെന്നല്ല, സ്വർണത്തോടുള്ള സാദൃശ്യമാണെന്ന് ഗ്രീക്ക് സൂചിപ്പിക്കുന്നു.
- source_word: πρόσωπα ἀνθρώπων
  choice: മനുഷ്യരുടെ മുഖങ്ങൾ
  rationale: πρόσωπα എന്നതിന്റെ ദൃശ്യവും മൂർത്തവുമായ അർഥം നൽകുന്നു; ἀνθρώπων ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: വെളിപ്പാടിലെ ദർശനാത്മക ഉപമാഭാഷ
  choice: ആവർത്തിച്ചുള്ള സാദൃശ്യസൂചനകൾ വ്യക്തമായി നിലനിർത്തുക
  alternative: ചിത്രണത്തെ അക്ഷരാർഥത്തിലുള്ള വസ്തുവിവരണമായി അവതരിപ്പിക്കുക
  rationale: ὅμοια/ὡς എന്നീ പദങ്ങൾ രൂപങ്ങൾ കുതിരകളെപ്പോലെയും തലകളിലുള്ളവ കിരീടങ്ങൾപോലെയും സ്വർണംപോലെയും മുഖങ്ങൾ മനുഷ്യരുടെ മുഖങ്ങൾപോലെയും കാണപ്പെട്ടതായി പറയുന്നു. ഈ ദർശനാത്മക അനിശ്ചിതത്വം വിവർത്തനം പരിഹരിച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ദർശനത്തിന്റെ ആവർത്തിച്ച ഉപമാസ്വഭാവം ‘പോലെ’, ‘തോന്നിക്കുന്നവ’ എന്നീ പ്രയോഗങ്ങളിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പ് [a] അതു വിശദീകരിക്കുന്ന ‘കിരീടങ്ങൾ’ എന്ന പദത്തോടു ചേർത്തു.
