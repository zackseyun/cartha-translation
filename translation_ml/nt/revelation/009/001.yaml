id: REV.9.1
reference: Revelation 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: ml
  text: അഞ്ചാമത്തെ ദൂതൻ കാഹളം മുഴക്കി. അപ്പോൾ സ്വർഗത്തിൽനിന്ന് ഭൂമിയിലേക്കു വീണുകഴിഞ്ഞിരുന്ന ഒരു നക്ഷത്രത്തെ ഞാൻ കണ്ടു.[a][b] അഗാധഗർത്തത്തിലേക്കുള്ള കുഴിയുടെ താക്കോൽ അവന് നൽകപ്പെട്ടു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വർഗത്തിൽനിന്ന് ഭൂമിയിലേക്കു വീണ ഒരു നക്ഷത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഗ്രീക്കിലെ പൂർണ്ണഭൂതകാല രൂപം, യോഹന്നാൻ അതിനെ കണ്ടപ്പോഴേക്കും വീഴ്ച സംഭവിച്ചുകഴിഞ്ഞിരുന്നുവെന്ന് സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: തുടർന്നുവരുന്ന ‘അവന്’ എന്ന പുരുഷലിംഗ പരാമർശം കാരണം, ‘നക്ഷത്രം’ ഒരു വ്യക്തിസത്തയെ പ്രതീകപ്പെടുത്തുന്നുണ്ടാകാം. എന്നാൽ വാക്യം ആ വ്യക്തിയെ തിരിച്ചറിയിക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: പരമ്പരാഗതമായി ‘അഗാധഗർത്തത്തിന്റെ കുഴി’ അഥവാ ‘അടിയില്ലാക്കുഴി’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. ഗ്രീക്കിലെ പദം കിണർ, കുഴി, അല്ലെങ്കിൽ ലംബപാത എന്ന അർഥം നൽകാം; ഇവിടെ അത് അഗാധഗർത്തത്തിലേക്കുള്ള പ്രവേശനപാതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: കാഹളം മുഴക്കി
  rationale: σαλπίζω എന്ന ക്രിയയിൽ ഉൾക്കൊള്ളുന്ന കാഹളത്തിന്റെ ദൃശ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀστέρα
  choice: ഒരു നക്ഷത്രത്തെ
  rationale: ἀστήρ എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘നക്ഷത്രം’ നിലനിർത്തുന്നു; അത് ഒരു വ്യക്തിസത്തയെ പ്രതിനിധീകരിക്കുന്നുണ്ടോ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: πεπτωκότα
  choice: വീണുകഴിഞ്ഞിരുന്ന
  rationale: പൂർണ്ണഭൂതകാല പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന, യോഹന്നാൻ കാണുന്നതിനു മുമ്പേ വീഴ്ച സംഭവിച്ച് അതിന്റെ ഫലം നിലനിന്നിരുന്ന അവസ്ഥ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: സ്വർഗത്തിൽനിന്ന് ഭൂമിയിലേക്ക്
  rationale: വെളിപ്പാടിന്റെ ദർശനപരമായ പശ്ചാത്തലത്തിൽ οὐρανός എന്നത് ‘സ്വർഗം’ എന്നും γῆ എന്നത് ‘ഭൂമി’ എന്നും പരിഭാഷപ്പെടുത്തി പ്രപഞ്ചപരമായ വിരുദ്ധത നിലനിർത്തുന്നു.
- source_word: ἐδόθη αὐτῷ
  choice: അവനു നൽകപ്പെട്ടു
  rationale: നൽകിയ കർത്താവിനെ വ്യക്തമാക്കാത്ത ഗ്രീക്ക് കർമണിപ്രയോഗം സംരക്ഷിക്കുന്നു; പുരുഷലിംഗ സർവനാമത്തിന്റെ വ്യക്തിസൂചനയും നിലനിർത്തുന്നു.
- source_word: ἡ κλεὶς
  choice: താക്കോൽ
  rationale: നിശ്ചിതത്വമുള്ള ഗ്രീക്ക് നാമത്തിന്റെ സ്വാഭാവിക മലയാളസമാനപദം.
- source_word: τοῦ φρέατος τῆς ἀβύσσου
  choice: അഗാധഗർത്തത്തിലേക്കുള്ള കിണറിന്റെ
  rationale: φρέαρ എന്ന പ്രവേശനകിണറിനെയും ἄβυσσος എന്ന അഗാധഗർത്തത്തെയും വേർതിരിച്ചു കാണിക്കുന്നു. മലയാളത്തിൽ ബന്ധം വ്യക്തമാകാൻ ‘അഗാധഗർത്തത്തിലേക്കുള്ള കിണർ’ എന്നു നൽകുന്നു; ‘അടിയില്ലാക്കുഴി’ എന്ന അധികവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘നക്ഷത്രം’ ദൂതനെയോ സാത്താനെയോ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ തിരിച്ചറിയണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘നക്ഷത്രം’ എന്ന ദൃശ്യം നിലനിർത്തി വ്യക്തിയെ പ്രത്യേകം തിരിച്ചറിയുന്നില്ല
  alternative: ദൂതൻ; സാത്താനിക സത്ത
  rationale: തുടർന്നുള്ള പുരുഷലിംഗ പരാമർശം വ്യക്തിസത്തയെ സൂചിപ്പിക്കാമെങ്കിലും വാക്യം ആരാണെന്ന് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ പ്രതീകത്തിന്റെ ഉദ്ദേശപൂർവമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: ‘നൽകപ്പെട്ടു’ എന്ന കർമണിപ്രയോഗത്തിൽ ദൈവത്തെ കർത്താവായി വ്യക്തമാക്കണമോ
  choice: കർത്താവിനെ പറയാതെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു
  alternative: ദൈവം അവനു താക്കോൽ നൽകി
  rationale: ദൈവിക അനുമതി സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്ക് വാക്യം നൽകുന്നവനെ പേരെടുത്ത് പറയുന്നില്ല; പരിഭാഷയും അതേ സംയമനം പാലിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദർശനഭാഷയിലെ ‘നക്ഷത്രം’, ‘സ്വർഗം’, ‘അഗാധഗർത്തം’ എന്നീ പ്രതീകങ്ങൾ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
