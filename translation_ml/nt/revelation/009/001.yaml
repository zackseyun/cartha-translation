  source_fidelity: 'മുഖ്യവാക്യം പൊതുവേ ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: കാഹളം മുഴക്കൽ, മുമ്പേ സംഭവിച്ച വീഴ്ച സൂചിപ്പിക്കുന്ന പൂർണ്ണഭൂതകാല പങ്കാളിക്രിയ, പേരെടുക്കാത്ത കർമണിപ്രയോഗം എന്നിവ നിലനിൽക്കുന്നു. എന്നിരുന്നാലും φρέαρ-നെ ‘കിണർ’ എന്നു നൽകുന്നത് വെള്ളക്കിണർ എന്ന അനാവശ്യമായ പ്രത്യേക ചിത്രം ഉണർത്താം; ഇവിടെ അഗാധഗർത്തത്തിലേക്കുള്ള കുഴി/ലംബപാതയാണ് ഉചിതം.'
  naturalness: ‘വീണുകഴിഞ്ഞിരുന്ന ഒരു നക്ഷത്രത്തെ’ എന്നും ‘അവന് നൽകപ്പെട്ടു’ എന്നും ആധുനിക പ്രമാണ മലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘അഗാധഗർത്തത്തിലേക്കുള്ള കുഴി’ എന്നത് ‘കിണർ’ എന്നതിനെക്കാൾ സന്ദർഭോചിതവും വ്യക്തവുമാണ്.
  terminology: ‘സ്വർഗം,’ ‘ഭൂമി,’ ‘നക്ഷത്രം,’ ‘കാഹളം,’ ‘താക്കോൽ,’ ‘അഗാധഗർത്തം’ എന്നിവ സ്ഥിരവും ഗൗരവമുള്ളതുമായ പ്രയോഗങ്ങളാണ്. ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിലെ നക്ഷത്രത്തിന്റെ വ്യക്തിസൂചനയെക്കുറിച്ചുള്ള നിരീക്ഷണം സ്വതന്ത്ര അടിക്കുറിപ്പായി പുനഃസ്ഥാപിച്ചിരിക്കുന്നു; അത് മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
