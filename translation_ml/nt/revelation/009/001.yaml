- from: അഞ്ചാമത്തെ ദൂതൻ കാഹളം മുഴക്കി. അപ്പോൾ സ്വർഗത്തിൽനിന്ന് ഭൂമിയിലേക്കു വീണുകഴിഞ്ഞിരുന്ന ഒരു നക്ഷത്രത്തെ ഞാൻ കണ്ടു.[a] അഗാധഗർത്തത്തിലേക്കുള്ള കിണറിന്റെ താക്കോൽ അവനു നൽകപ്പെട്ടു.[b]
  to: അഞ്ചാമത്തെ ദൂതൻ കാഹളം മുഴക്കി. അപ്പോൾ സ്വർഗത്തിൽനിന്ന് ഭൂമിയിലേക്കു വീണുകഴിഞ്ഞിരുന്ന ഒരു നക്ഷത്രത്തെ ഞാൻ കണ്ടു.[a][b] അഗാധഗർത്തത്തിലേക്കുള്ള കുഴിയുടെ താക്കോൽ അവന് നൽകപ്പെട്ടു.[c]
  rationale: കിണർ എന്ന പദം കുഴിയായി മാറ്റി φρέαρ-ന്റെ പ്രവേശന-ശാഫ്റ്റ് അർഥം കൂടുതൽ വ്യക്തമായി നിലനിർത്തി. മുഖ്യപാഠത്തിലെ ‘നക്ഷത്രം’ എന്ന പ്രതീകം വ്യാഖ്യാനിക്കാതെ സംരക്ഷിച്ചുകൊണ്ട്, പുരുഷലിംഗ സർവനാമം ഉണർത്തുന്ന സാധ്യതയെ പ്രത്യേകം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി. കർമണിപ്രയോഗത്തിൽ നൽകുന്നവനെ പേരെടുത്തുപറഞ്ഞിട്ടില്ല.
