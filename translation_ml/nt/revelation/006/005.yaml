id: REV.6.5
reference: Revelation 6:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: ml
  text: അവൻ മൂന്നാമത്തെ മുദ്ര തുറന്നപ്പോൾ, മൂന്നാമത്തെ ജീവി, “വരിക”[a] എന്നു പറയുന്നതു ഞാൻ കേട്ടു. ഞാൻ നോക്കി; ഇതാ, ഒരു കറുത്ത കുതിര! അതിന്മേൽ ഇരിക്കുന്നവന്റെ കൈയിൽ ഒരു തുലാസ്[b] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇങ്ങോട്ടു വരിക.” ഈ കല്പന യോഹന്നാനോടുള്ളതാണെന്നോ കുതിരയെയും അതിന്മേൽ ഇരിക്കുന്നവനെയും വിളിക്കുന്നതാണെന്നോ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: തൂക്കാനുള്ള തുലാസ്; അടുത്ത വാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ ഭക്ഷണം അളന്നുകൊടുക്കാൻ ഉപയോഗിക്കുന്ന തുലാസായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: തുറന്നപ്പോൾ
  rationale: മുദ്ര തുറക്കുന്നതിനെ സ്വാഭാവികവും നേരിട്ടുമായ രീതിയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: σφραγῖδα τὴν τρίτην
  choice: മൂന്നാമത്തെ മുദ്ര
  rationale: ഗ്രീക്കിലെ ക്രമസൂചനയും നാമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ζῴου
  choice: ജീവി
  rationale: വെളിപ്പാടിലെ സിംഹാസനമുറിയിലെ ജീവസത്തകളെ സൂചിപ്പിക്കുന്ന പദം; ‘മൃഗം’ എന്നത് സാധാരണ മൃഗമെന്ന തെറ്റായ ധാരണ ഉണ്ടാക്കാം.
- source_word: Ἔρχου
  choice: വരിക
  rationale: ആരോടാണ് കല്പനയെന്നത് വ്യക്തമാക്കാതെ ഹ്രസ്വമായ ആജ്ഞാരൂപം നിലനിർത്തുന്നു.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: ഞാൻ നോക്കി; ഇതാ
  rationale: ദർശനത്തിന്റെ പെട്ടെന്നുള്ള ദൃശ്യപരിവർത്തനവും ἰδού എന്ന പദത്തിന്റെ ശ്രദ്ധയാകർഷിക്കുന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἵππος μέλας
  choice: ഒരു കറുത്ത കുതിര
  rationale: ദർശനത്തിലെ വർണപ്രതീകം അക്ഷരാർഥത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: അതിന്മേൽ ഇരിക്കുന്നവൻ
  rationale: ഗ്രീക്കിലെ കൃദന്തരൂപത്തെ വ്യാഖ്യാനപരമായി ‘കുതിരക്കാരൻ’ എന്നു ചുരുക്കാതെ അടുത്ത് പിന്തുടരുന്നു.
- source_word: ζυγὸν
  choice: ഒരു തുലാസ്
  rationale: തുടർന്നുള്ള വാക്യത്തിലെ ഭക്ഷ്യധാന്യം അളക്കുന്നതിന്റെ പശ്ചാത്തലത്തിൽ തൂക്കാനുള്ള തുലാസാണ് ഉദ്ദേശ്യം; ‘നുകം’ ഇവിടെ പ്രസക്തമല്ല.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: അവന്റെ കൈയിൽ
  rationale: മൂലപാഠത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
theological_decisions:
- issue: Ἔρχου എന്ന ആജ്ഞയുടെ സംബോധിതൻ
  choice: ‘വരിക’ എന്നു മാത്രം നൽകി സംബോധിതനെ വ്യക്തമാക്കിയില്ല.
  alternative: യോഹന്നാനോടുള്ള ‘ഇങ്ങോട്ടു വരിക’ എന്ന ആഹ്വാനമായോ കുതിരയെയും അതിന്മേൽ ഇരിക്കുന്നവനെയും പുറപ്പെടാൻ വിളിക്കുന്ന ആഹ്വാനമായോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്കിൽ സംബോധിതൻ സൂചിപ്പിക്കപ്പെട്ടിട്ടില്ല; അതിനാൽ യഥാർഥമായ അവ്യക്തത മുഖ്യപാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ സാധ്യതകൾ പറയുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ദർശനവിവരണ ശൈലി. ‘ഇതാ’ എന്നത് അപോകലിപ്റ്റിക് ദൃശ്യത്തിന്റെ സജീവത നിലനിർത്തുന്നു; വാക്യഘടന ഗ്രീക്കിനോട് അടുത്തിരിക്കുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമാണ്.
