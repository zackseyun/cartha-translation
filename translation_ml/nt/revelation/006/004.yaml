id: REV.6.4
reference: Revelation 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: ml
  text: തീച്ചുവപ്പുള്ള മറ്റൊരു കുതിര പുറപ്പെട്ടു.[a] ഭൂമിയിൽനിന്ന് സമാധാനം എടുത്തുകളയാനും അങ്ങനെ അവർ പരസ്പരം അറുത്തുകൊല്ലേണ്ടതിനും അതിന്മേൽ ഇരിക്കുന്നവന് നൽകപ്പെട്ടു;[b][c] അവന് ഒരു വലിയ വാളും നൽകപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചുവന്ന മറ്റൊരു കുതിര.’ ഗ്രീക്കിലെ πυρρός എന്ന പദം കൂടുതൽ കൃത്യമായി തീപോലെയുള്ള ചുവപ്പിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഭൂമി’ എന്നതിന് പകരം ‘ദേശം’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്കിലെ γῆ എന്ന പദത്തിന് രണ്ടർത്ഥവും ഉണ്ടാകാം. ഇവിടെ വെളിപ്പാടിന്റെ വിശാലമായ അന്ത്യകാലദർശനസന്ദർഭം പരിഗണിച്ച് ‘ഭൂമി’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘അറുത്തുകൊല്ലുക’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന ക്രിയ സാധാരണ ‘കൊല്ലുക’ എന്നതിനെക്കാൾ ശക്തമാണ്; അത് രക്തരൂക്ഷിതമായ കൊലയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἵππος πυρρός
  choice: തീച്ചുവപ്പുള്ള മറ്റൊരു കുതിര
  rationale: ἄλλος ദർശനപരമ്പരയിലെ മുൻ കുതിരയിൽനിന്ന് വ്യത്യസ്തമായ അടുത്ത കുതിരയെ സൂചിപ്പിക്കുന്നു. πυρρός വെറും ചുവപ്പിനെക്കാൾ തീപോലെയുള്ള ചുവപ്പിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തീച്ചുവപ്പ്’ ദൃശ്യത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: ദർശനത്തിൽ കുതിര രംഗത്തേക്ക് വരുന്നതിനെ സ്വാഭാവികമായും ഗൗരവത്തോടെയും അവതരിപ്പിക്കുന്നു.
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: അതിന്മേൽ ഇരിക്കുന്നവന്
  rationale: ‘കുതിരക്കാരൻ’ എന്നു വ്യാഖ്യാനപരമായി ചുരുക്കാതെ ഗ്രീക്കിലെ കൃതന്തപ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: ἐδόθη αὐτῷ
  choice: അവന് ... നൽകപ്പെട്ടു
  rationale: നൽകിയവനെ വ്യക്തമാക്കാത്ത ദൈവിക കർമണിപ്രയോഗം നിലനിർത്തുന്നു; എന്നാൽ മലയാളത്തിൽ വാക്യത്തിന്റെ അർത്ഥം വ്യക്തമാകാൻ ‘അധികാരം’ സന്ദർഭാനുസൃതമായി ചേർത്തിരിക്കുന്നു.
- source_word: λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς
  choice: ഭൂമിയിൽനിന്ന് സമാധാനം എടുത്തുകളയാൻ
  rationale: λαβεῖν ... ἐκ എന്ന ഘടനയിലെ നീക്കംചെയ്യൽഭാവം ‘എടുത്തുകളയാൻ’ സ്വാഭാവികമായി നൽകുന്നു. γῆയുടെ വിശാലമായ അപ്പോക്കലിപ്റ്റിക് അർത്ഥത്തിന് ‘ഭൂമി’ അനുയോജ്യം.
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: മനുഷ്യർ പരസ്പരം അറുത്തുകൊല്ലേണ്ടതിന്
  rationale: അവ്യക്തമായ ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ ‘മനുഷ്യർ’ എന്നു സ്വാഭാവികമാക്കുന്നു. σφάζω സാധാരണ ‘കൊല്ലുക’ എന്നതിനെക്കാൾ രക്തരൂക്ഷിതമായ അറുപ്പിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അറുത്തുകൊല്ലുക’ തെരഞ്ഞെടുത്തു.
- source_word: μάχαιρα μεγάλη
  choice: ഒരു വലിയ വാൾ
  rationale: μάχαιρα വാൾ, ചെറുവാൾ, വലിയ കത്തി എന്നിവ സൂചിപ്പിക്കാമെങ്കിലും ദർശനചിത്രത്തിൽ ‘വാൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്; μεγάληയെ ‘വലിയ’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐδόθη എന്ന ദൈവിക കർമണിപ്രയോഗം
  choice: ‘നൽകപ്പെട്ടു’ എന്നു കർമണിയായി നിലനിർത്തി; നൽകിയവനെ പേരെടുത്ത് പറഞ്ഞില്ല
  alternative: ‘ദൈവം നൽകി’ എന്നു കർത്താവിനെ വ്യക്തമാക്കുക
  rationale: വെളിപ്പാടിലെ ആവർത്തിത കർമണിപ്രയോഗം ദൈവിക പരമാധികാരമോ അനുവാദമോ സൂചിപ്പിച്ചേക്കാം; എങ്കിലും ഗ്രീക്ക് വാക്യം നൽകുന്നവനെ വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനവും ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്നുവെക്കുന്നു.
- issue: ἵναയുടെ ഉദ്ദേശ്യം/ഫലം എന്ന അർത്ഥബന്ധം
  choice: ‘പരസ്പരം അറുത്തുകൊല്ലേണ്ടതിന്’
  alternative: ‘അങ്ങനെ അവർ പരസ്പരം അറുത്തുകൊന്നു’
  rationale: ἵνα ഉദ്ദേശ്യമോ പ്രതീക്ഷിത ഫലമോ സൂചിപ്പിക്കാം. ‘-േണ്ടതിന്’ ഈ ബന്ധം നിലനിർത്തുന്നു; സംഭവം ഇതിനകം പൂർത്തിയായി എന്നു വരുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ദർശനവിവരണശൈലി. ‘തീച്ചുവപ്പ്,’ ‘അറുത്തുകൊല്ലുക,’ ‘വലിയ വാൾ’ എന്നിവ മൂലപാഠത്തിന്റെ ഉജ്ജ്വലവും ഹിംസാത്മകവുമായ ദൃശ്യഭാവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
