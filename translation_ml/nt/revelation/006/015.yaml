id: REV.6.15
reference: Revelation 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every servant and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: ml
  text: ഭൂമിയിലെ രാജാക്കന്മാരും പ്രഭുക്കന്മാരും[a] സൈന്യാധിപന്മാരും ധനികരും ശക്തന്മാരും എല്ലാ അടിമകളും സ്വതന്ത്രരും[b] മലകളിലെ ഗുഹകളിലും പാറക്കെട്ടുകൾക്കിടയിലും ഒളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഉന്നതസ്ഥാനത്തുള്ളവരും.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഓരോ അടിമയും സ്വതന്ത്രനും’; ഗ്രീക്കിലെ പുരുഷലിംഗ ഏകവചനജോടി ഇവിടെ പ്രതിനിധാനപരമായ അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: ഭൂമിയിലെ രാജാക്കന്മാർ
  rationale: γῆ എന്നതിന് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാകാമെങ്കിലും, വെളിപ്പാടിലെ സാർവലൗകിക ന്യായവിധിയുടെ പശ്ചാത്തലവും ആവർത്തിച്ചുവരുന്ന പ്രയോഗവും ഇവിടെ ‘ഭൂമി’യെ പിന്തുണയ്ക്കുന്നു.
- source_word: μεγιστᾶνες
  choice: പ്രഭുക്കന്മാർ
  rationale: ഉന്നതസ്ഥാനവും സാമൂഹിക പ്രാമുഖ്യവും ഉള്ളവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം; പാരമ്പര്യ കുലീനതയിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: χιλίαρχοι
  choice: സൈന്യാധിപന്മാർ
  rationale: പദം അക്ഷരാർഥത്തിൽ ആയിരംപേരുടെ സൈനികാധികാരിയെ സൂചിപ്പിക്കാമെങ്കിലും, സന്ദർഭത്തിൽ പൊതുവായ സൈനിക കമാൻഡ് പദവി വ്യക്തമായി അറിയിക്കാൻ ഈ രൂപം യോജിക്കുന്നു.
- source_word: πλούσιοι
  choice: ധനികർ
  rationale: സമ്പന്നരായ ആളുകളെ സൂചിപ്പിക്കുന്ന നാമവൽക്കരിച്ച വിശേഷണത്തിന് സംക്ഷിപ്തവും സാധാരണവുമായ മലയാളരൂപം.
- source_word: ἰσχυροὶ
  choice: ശക്തന്മാർ
  rationale: ശക്തി അഥവാ പ്രാബല്യം എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; പട്ടികയിലെ മറ്റുള്ള സാമൂഹികവിഭാഗങ്ങളിൽനിന്ന് വേറിട്ടുനിൽക്കുന്നു.
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: അടിമകളും സ്വതന്ത്രരും
  rationale: അടിമ–സ്വതന്ത്രൻ എന്ന വ്യക്തമായ സാമൂഹിക വൈരുധ്യം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ ഏകവചന പുരുഷലിംഗജോടിക്ക് പ്രതിനിധാനപരമായ അർഥമുള്ളതിനാൽ മലയാളത്തിൽ സമൂഹവിഭാഗങ്ങളെ ഉൾക്കൊള്ളുന്ന ബഹുവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: ഒളിച്ചു
  rationale: മലയാളത്തിൽ കർത്താവിലേക്കുതന്നെ മടങ്ങുന്ന അർഥം ക്രിയയിൽ സ്വാഭാവികമായി ഉൾപ്പെടുന്നതിനാൽ ‘തങ്ങളെത്തന്നെ ഒളിപ്പിച്ചു’ എന്ന ഭാരമുള്ള രൂപം ആവശ്യമില്ല.
- source_word: εἰς τὰ σπήλαια
  choice: ഗുഹകളിൽ
  rationale: εἰς ചലനത്തെ സൂചിപ്പിക്കാമെങ്കിലും ‘ഒളിച്ചു’ എന്ന ക്രിയയ്ക്കുശേഷം ഫലമായിരിക്കുന്ന സ്ഥലം പറയാൻ സ്ഥലവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: εἰς τὰς πέτρας τῶν ὀρέων
  choice: മലകളിലെ പാറക്കെട്ടുകൾക്കിടയിൽ
  rationale: πέτραιയെ വെറും ഒറ്റപ്പെട്ട കല്ലുകളെന്നല്ല, ഒളിക്കാൻ കഴിയുന്ന മലമ്പാറകളും പാറരൂപങ്ങളും എന്ന നിലയിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: ἐλεύθερος എന്ന ‘സ്വതന്ത്രൻ’ പദത്തോടുള്ള നേരിട്ടുള്ള വൈരുധ്യം ബന്ധിതമായ സാമൂഹികസ്ഥിതിയെ മുൻനിർത്തുന്നതിനാൽ ‘അടിമ’യാണ് ഇവിടെ കൃത്യം.
- issue: അടിമ–സ്വതന്ത്രൻ ജോടിയിലെ ലിംഗപ്രതിനിധാനം
  choice: അടിമകളും സ്വതന്ത്രരും
  alternative: ഓരോ അടിമയും സ്വതന്ത്രപുരുഷനും
  rationale: ഗ്രീക്കിൽ രണ്ടുപദങ്ങളും വ്യാകരണപരമായി പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും ഈ സ്ഥിരജോടി എല്ലാ സാമൂഹികസ്ഥാനങ്ങളിലുള്ള ആളുകളെയും പ്രതിനിധീകരിക്കുന്നു. മലയാളത്തിലെ ബഹുവചനം ഈ പൊതുവ്യാപ്തി സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. സാമൂഹിക പദവികളുടെ പട്ടികയിലെ സമാന്തരത നിലനിർത്തി; ‘മലകളിലെ’ എന്നത് ഗുഹകൾക്കും പാറക്കെട്ടുകൾക്കും ഒരുപോലെ ബന്ധപ്പെടുന്ന വിധത്തിൽ വാക്യം ക്രമപ്പെടുത്തി.
