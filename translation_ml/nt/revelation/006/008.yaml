id: REV.6.8
reference: Revelation 6:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: ml
  text: ഞാൻ നോക്കി; അപ്പോൾ ഇതാ, വിളറിയ പച്ചനിറമുള്ള ഒരു കുതിര.[a] അതിന്മേൽ ഇരിക്കുന്നവന്റെ പേര് മരണം എന്നായിരുന്നു; പാതാളം അവനോടൊപ്പം പിന്നാലെ വന്നു. ഭൂമിയുടെ നാലിലൊന്നിന്മേൽ അവർക്ക് അധികാരം നൽകപ്പെട്ടു; വാളുകൊണ്ടും ക്ഷാമംകൊണ്ടും മഹാമാരികൊണ്ടും[b] ഭൂമിയിലെ വന്യമൃഗങ്ങളാലും കൊല്ലാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വിളറിയ ഒരു കുതിര.’ χλωρός എന്ന ഗ്രീക്ക് പദം അക്ഷരാർഥത്തിൽ പച്ചകലർന്നതോ വിളറിയ പച്ചനിറമുള്ളതോ ആയ നിറത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് രോഗാതുരമായ വിളർച്ചയെ ഓർമിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘മരണംകൊണ്ട്.’ പഴയനിയമത്തിലെ വിധിപ്പട്ടികയുടെ പശ്ചാത്തലത്തിൽ ഇവിടെ ‘മരണം’ എന്നത് മഹാമാരിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം; പ്രത്യേകിച്ച് യെഹെസ്കേൽ 14-ന്റെ പ്രതിധ്വനി ശ്രദ്ധേയമാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: വിളറിയ പച്ചനിറമുള്ള
  rationale: ഈ പദത്തിന്റെ പച്ചകലർന്ന നിറം എന്ന അടിസ്ഥാനാർഥവും സന്ദർഭത്തിലെ രോഗാതുരമായ വിളർച്ചയും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘വിളറിയ’ മാത്രം എന്നു വിവർത്തനം ചെയ്യുന്നതിനെക്കാൾ മൂലപദത്തിന്റെ വർണസൂചന വ്യക്തമാണ്.
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: അതിന്മേൽ ഇരിക്കുന്നവൻ
  rationale: ഗ്രീക്കിലെ കർത്തൃവാചക പ്രയോഗത്തെ സ്വാഭാവികവും സുതാര്യവുമായി പിന്തുടരുന്നു; ‘കുതിരക്കാരൻ’ എന്ന വ്യാഖ്യാനാത്മക ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: അതിന്റെമേൽ ഇരിക്കുന്നവന്റെ പേര് മരണം എന്നായിരുന്നു
  rationale: പേരിടൽസൂത്രം വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Θάνατος
  choice: മരണം
  rationale: ഇവിടെ മരണം വ്യക്തിവൽക്കരിക്കപ്പെട്ട് കുതിരപ്പുറത്തിരിക്കുന്നവന്റെ പേരായി വരുന്നു; മലയാളത്തിൽ പ്രത്യേക വലിയക്ഷരരീതി ഇല്ലാത്തതിനാൽ സന്ദർഭം തന്നെ വ്യക്തിവൽക്കരണം വ്യക്തമാക്കുന്നു.
- source_word: ᾅδης
  choice: പാതാളം
  rationale: മരിച്ചവരുടെ ലോകം എന്ന ആശയം സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ പദമാണിത്; അന്തിമ ശിക്ഷാസ്ഥലമെന്ന അർഥമുള്ള ‘നരകം’ ഒഴിവാക്കുന്നു.
- source_word: μετ’ αὐτοῦ
  choice: അവനോടൊപ്പം
  rationale: μετά + genitive എന്നതിന്റെ അടിസ്ഥാനമായ ‘കൂടെ/ഒപ്പം’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; ἠκολούθει എന്ന ക്രിയ പിന്നാലെ പോകുന്നതിന്റെ ആശയം നൽകുന്നു.
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: അവർക്ക് അധികാരം നൽകപ്പെട്ടു
  rationale: ἐξουσίαയെ വെറും ശക്തിയല്ല, നൽകപ്പെട്ട അധികാരം എന്ന നിലയിൽ അവതരിപ്പിക്കുന്നു; ദൈവിക കർമണി പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: ഭൂമിയുടെ നാലിലൊന്നിന്മേൽ
  rationale: വിധിദൃശ്യത്തിന്റെ വിശാല വ്യാപ്തിയും കൃത്യമായ നാലിലൊന്ന് എന്ന അളവും നിലനിർത്തുന്നു.
- source_word: ἀποκτεῖναι
  choice: കൊന്നുകളയാൻ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν ῥομφαίᾳ
  choice: വാളുകൊണ്ട്
  rationale: കൊലയുടെ ഉപാധി സൂചിപ്പിക്കുന്ന instrumental പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν λιμῷ
  choice: ക്ഷാമംകൊണ്ട്
  rationale: λιμός വ്യക്തിപരമായ വിശപ്പിനേക്കാൾ വ്യാപകമായ ഭക്ഷ്യക്ഷാമത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν θανάτῳ
  choice: മഹാമാരികൊണ്ട്
  rationale: യെഹെസ്കേൽ 14-ലെ വിധിപ്പട്ടികയുടെ പശ്ചാത്തലത്തിൽ θάνατος മഹാമാരി/പകർച്ചവ്യാധി എന്ന ആശയം വഹിക്കാം; ‘മരണംകൊണ്ട് കൊല്ലുക’ എന്ന അസ്വാഭാവികതയും ഒഴിവാകുന്നു. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: ഭൂമിയിലെ വന്യമൃഗങ്ങളെക്കൊണ്ട്
  rationale: θηρίαയെ വീട്ടുമൃഗങ്ങളല്ലാത്ത അപകടകാരികളായ മൃഗങ്ങൾ എന്ന നിലയിൽ വ്യക്തമാക്കുകയും ὑπό സൂചിപ്പിക്കുന്ന പ്രവർത്തകമാധ്യമം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ᾅδης എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാതാളം
  alternative: നരകം; ശവക്കുഴി; മരിച്ചവരുടെ ലോകം
  rationale: വാക്യം വ്യക്തിവൽക്കരിക്കപ്പെട്ട മരണത്തെയും അതിനെ അനുഗമിക്കുന്ന മരിച്ചവരുടെ ലോകത്തെയും വേർതിരിക്കുന്നു. ‘നരകം’ എന്നു നൽകിയാൽ അന്തിമ ന്യായവിധിയുമായി ഈ പദത്തെ അനാവശ്യമായി ലയിപ്പിക്കാം; ‘ശവക്കുഴി’ ആ ലോകസങ്കൽപ്പത്തെ അമിതമായി ഭൗതികമാക്കാം.
- issue: വിധിപ്പട്ടികയിലെ ἐν θανάτῳ
  choice: മഹാമാരികൊണ്ട്
  alternative: മരണംകൊണ്ട്
  rationale: യെഹെസ്കേൽ 14-നോടുള്ള പഴയനിയമ പ്രതിധ്വനിയിൽ ‘മരണം’ മഹാമാരിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായി വരാം. പട്ടികയുടെ അർഥസമന്വയം കാത്തുകൊണ്ട് അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഇതാ’ ദർശനത്തിന്റെ പെട്ടെന്നുള്ള വെളിപ്പാടിനെ നിലനിർത്തുന്നു. ‘പാതാളം’ എന്ന പരമ്പരാഗത പദം ഉപയോഗിച്ചെങ്കിലും ‘നരകം’ എന്ന സിദ്ധാന്തഭാരം ഒഴിവാക്കി. മൂലത്തിലെ നീണ്ട ഏകവാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ആശയക്രമവും ബന്ധങ്ങളും നിലനിർത്തി.
