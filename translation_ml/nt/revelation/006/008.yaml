revisions:
- from: ഞാൻ നോക്കി; അപ്പോൾ ഇതാ, വിളറിയ പച്ചനിറമുള്ള ഒരു കുതിര.[a] അതിന്മേൽ ഇരിക്കുന്നവന്റെ പേര് മരണം എന്നായിരുന്നു; പാതാളം അവനോടൊപ്പം പിന്നാലെ ചെന്നു. വാളുകൊണ്ടും ക്ഷാമംകൊണ്ടും മഹാമാരികൊണ്ടും[b] ഭൂമിയിലെ വന്യമൃഗങ്ങളെക്കൊണ്ടും കൊന്നുകളയാൻ ഭൂമിയുടെ നാലിലൊന്നിന്മേൽ അവർക്ക് അധികാരം നൽകപ്പെട്ടു.
  to: ഞാൻ നോക്കി; അപ്പോൾ ഇതാ, വിളറിയ പച്ചനിറമുള്ള ഒരു കുതിര.[a] അതിന്മേൽ ഇരിക്കുന്നവന്റെ പേര് മരണം എന്നായിരുന്നു; പാതാളം അവനോടൊപ്പം പിന്നാലെ വന്നു. ഭൂമിയുടെ നാലിലൊന്നിന്മേൽ അവർക്ക് അധികാരം നൽകപ്പെട്ടു; വാളുകൊണ്ടും ക്ഷാമംകൊണ്ടും മഹാമാരികൊണ്ടും[b] ഭൂമിയിലെ വന്യമൃഗങ്ങളാലും കൊല്ലാൻ.
  rationale: 'The revision restores the Greek syntactic progression: delegated authority over one quarter of the earth is stated before the purpose of killing. It also makes the Hades clause and the final instrumental phrase more natural in modern standard Malayalam, while preserving the source’s ambiguity and all existing footnote anchors and contents.'
