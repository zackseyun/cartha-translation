    issue: The authority clause follows and is grammatically entangled with the killing clause.
    rationale: Greek first states that authority was given to them over a fourth of the earth and then gives the purpose/result, ‘to kill.’ Reordering restores both the source sequence and the scope of the authority.
  - severity: low
