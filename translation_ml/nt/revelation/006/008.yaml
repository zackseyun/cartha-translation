  terminology: ‘പാതാളം’ appropriately avoids conflating ᾅδης with final punishment. ‘മഹാമാരികൊണ്ട്’ is defensible in this Ezekiel-shaped judgment list, and the footnote properly preserves the literal ‘മരണംകൊണ്ട്.’
