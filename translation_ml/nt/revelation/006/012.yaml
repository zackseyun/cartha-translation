id: REV.6.12
reference: Revelation 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: ml
  text: 'അവൻ ആറാമത്തെ മുദ്ര തുറന്നപ്പോൾ ഞാൻ കണ്ടു: വലിയൊരു ഭൂകമ്പമുണ്ടായി; സൂര്യൻ രോമംകൊണ്ടുണ്ടാക്കിയ ചാക്കുതുണിപോലെ[a] കറുത്തതായി; ചന്ദ്രൻ മുഴുവനും രക്തംപോലെയായി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘രോമച്ചാക്കുതുണിപോലെ’; രോമംകൊണ്ട് നെയ്ത ഈ പരുക്കൻ ചാക്കുതുണി പരമ്പരാഗതമായി ദുഃഖാചരണവുമായി ബന്ധപ്പെട്ടിരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: വെളിപ്പാടിലെ ദർശനവിവരണത്തിന് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പ്രയോഗം.
- source_word: ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην
  choice: അവൻ ആറാമത്തെ മുദ്ര തുറന്നപ്പോൾ
  rationale: ὅτε എന്ന കാലസൂചകബന്ധവും ക്രിയയിലെ പരോക്ഷ കർത്താവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: σεισμὸς μέγας ἐγένετο
  choice: വലിയൊരു ഭൂകമ്പമുണ്ടായി
  rationale: σεισμός എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം ‘ഭൂകമ്പം’; ἐγένετο മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഉണ്ടായി’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: സൂര്യൻ ... കറുത്തതായി
  rationale: μέλας എന്നതിന്റെ കൃത്യമായ വർണാർഥമായ ‘കറുപ്പ്’ നിലനിർത്തുന്നു; വെറും ‘ഇരുണ്ടു’ എന്ന് ലഘൂകരിക്കുന്നില്ല.
- source_word: ὡς σάκκος τρίχινος
  choice: രോമംകൊണ്ടുണ്ടാക്കിയ ചാക്കുതുണിപോലെ
  rationale: σάκκος എന്ന പരുക്കൻ ചാക്കുതുണിയെയും τρίχινος എന്ന ‘രോമംകൊണ്ടുണ്ടാക്കിയ’ വിശേഷണത്തെയും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἡ σελήνη ὅλη
  choice: ചന്ദ്രൻ മുഴുവനും
  rationale: ὅλη നൽകുന്ന സമഗ്രതയുടെ ഊന്നൽ തുറന്നുവെക്കുന്നു.
- source_word: ἐγένετο ὡς αἷμα
  choice: രക്തംപോലെയായി
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ നിലനിർത്തുന്നു; ചന്ദ്രൻ അക്ഷരാർഥത്തിൽ രക്തമായി എന്നു പറയുന്നില്ല.
theological_decisions:
- issue: പ്രപഞ്ചലക്ഷണങ്ങളുടെ സ്വഭാവം
  choice: ദർശനാത്മകവും അന്ത്യകാലസംബന്ധവുമായ ദൃശ്യങ്ങളെ വ്യാഖ്യാനാത്മക വിശദീകരണമില്ലാതെ നേരിട്ട് അവതരിപ്പിച്ചു.
  alternative: ഇവയെ പൂർണമായും അക്ഷരാർഥത്തിലുള്ള ജ്യോതിശ്ശാസ്ത്രസംഭവങ്ങളായോ പൂർണമായും പ്രതീകാത്മകമായ ന്യായവിധിചിത്രങ്ങളായോ നിർണ്ണയിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ‘പോലെ’ എന്ന ഉപമകളിലൂടെ ദൃശ്യങ്ങൾ അവതരിപ്പിക്കുന്നുവെങ്കിലും അവയുടെ വിശാലമായ വ്യാഖ്യാനം തീർപ്പാക്കുന്നില്ല; അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അനിശ്ചിതത്വവും പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള καί ബന്ധങ്ങളെ മലയാളത്തിലെ സ്വാഭാവിക വിരാമചിഹ്നങ്ങളിലൂടെ ക്രമപ്പെടുത്തി; ദൃശ്യങ്ങളുടെ ശക്തിയും ക്രമവും നിലനിർത്തി.
