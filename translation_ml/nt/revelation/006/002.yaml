  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: ml
  text: ഞാൻ നോക്കി; അതാ, ഒരു വെളുത്ത കുതിര! അതിന്മേൽ ഇരിക്കുന്നവന്റെ[b] കൈയിൽ ഒരു വില്ലുണ്ടായിരുന്നു. അവന് ഒരു കിരീടം നൽകപ്പെട്ടു[a]. അവൻ ജയിച്ചടക്കിക്കൊണ്ടും ജയിച്ചടക്കാനുമായി പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഒരു വിജയകിരീടം അവന് നൽകപ്പെട്ടു.’ ഗ്രീക്കിലെ στέφανος എന്ന പദം രാജകീയ മകുടത്തെക്കാൾ പലപ്പോഴും വിജയവുമായി ബന്ധപ്പെട്ട മാലയെയോ കിരീടത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ കുതിരപ്പുറത്തിരിക്കുന്നവൻ ആരാണെന്ന് പാഠം വ്യക്തമാക്കുന്നില്ല. ഇതിനെക്കുറിച്ചുള്ള വ്യാഖ്യാനങ്ങൾ വളരെ വ്യത്യസ്തമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶδον
  choice: ഞാൻ നോക്കി
  rationale: ὁράωയുടെ ഈ രൂപത്തിന് സാധാരണയായി ‘ഞാൻ കണ്ടു’ എന്നും അർഥമുണ്ടെങ്കിലും, പിന്നാലെയുള്ള ἰδούവിനോടൊപ്പം ദർശനത്തിന്റെ ശ്രദ്ധാകേന്ദ്രമാറ്റം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ഞാൻ നോക്കി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἰδοὺ
  choice: അതാ
  rationale: ദർശനത്തിൽ പെട്ടെന്ന് പ്രത്യക്ഷപ്പെടുന്നതിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ἰδούയുടെ സജീവമായ വ്യവഹാരബലം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἵππος λευκός
  choice: ഒരു വെളുത്ത കുതിര
  rationale: ദർശനത്തിൽ ആദ്യമായി പ്രത്യക്ഷപ്പെടുന്ന, നിർദിഷ്ടമല്ലാത്ത കുതിരയെ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: അതിന്മേൽ ഇരിക്കുന്നവൻ
  rationale: ഗ്രീക്കിലെ വിശേഷണകൃദ്‌രൂപം നിലനിർത്തുന്നു; ‘കുതിരക്കാരൻ’ എന്നതിനെക്കാൾ മൂലരൂപത്തോട് സുതാര്യമായി ചേർന്നുനിൽക്കുന്നു.
- source_word: ἔχων τόξον
  choice: കൈയിൽ ഒരു വില്ലുണ്ടായിരുന്നു
  rationale: ἔχων എന്നതിന്റെ കൈവശമുള്ളതെന്ന അർഥവും τόξον എന്ന ആയുധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: അവന് ഒരു കിരീടം നൽകപ്പെട്ടു
  rationale: ദൈവിക കർമ്മണി എന്നു വ്യാഖ്യാനിച്ച് കർത്താവിനെ ചേർക്കാതെ ഗ്രീക്കിലെ കർമ്മണിപ്രയോഗം നിലനിർത്തുന്നു; στέφανοςന്റെ വിജയമാല/കിരീടം എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: ഒരു ലക്ഷ്യത്തോടെ പുറപ്പെട്ടുപോകുന്ന ചലനം സന്ദർഭോചിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: νικῶν καὶ ἵνα νικήσῃ
  choice: ജയിച്ചുകൊണ്ടും ജയിക്കാനുമായി
  rationale: νικῶν എന്ന തുടർച്ചയായ പ്രവർത്തനവും ἵνα νικήσῃ എന്ന ഉദ്ദേശ്യപ്രയോഗവും വേർതിരിച്ചുതന്നെ നിലനിർത്തുന്നു; ആവർത്തനവും മൂലവാക്യത്തിന്റെ ശക്തിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വെളുത്ത കുതിരപ്പുറത്തിരിക്കുന്നവന്റെ തിരിച്ചറിയൽ
  choice: പരിഭാഷയിൽ ആ വ്യക്തിയെ തിരിച്ചറിയാതെ വിടുന്നു.
  alternative: ക്രിസ്തു അല്ലെങ്കിൽ ക്രിസ്തുസദൃശനായ ഒരാൾ; ജയിച്ചടക്കുന്ന ഭരണാധികാരി/സാമ്രാജ്യം; എതിർക്രിസ്തു അല്ലെങ്കിൽ വഞ്ചകനായ ജേതാവ്
  rationale: ഗ്രീക്ക് പാഠം ആ വ്യക്തിയുടെ രൂപവും പ്രവർത്തനവും വിവരിക്കുന്നുവെങ്കിലും അയാൾ ആരാണെന്ന് പറയുന്നില്ല. അതിനാൽ വിവാദമായ ഒരു വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കാതെ പാഠത്തിലെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- issue: ἐδόθη എന്ന കർമ്മണിപ്രയോഗത്തിലെ നൽകുന്നവൻ
  choice: ‘നൽകപ്പെട്ടു’ എന്നു കർമ്മണിയായി നിലനിർത്തുന്നു.
  alternative: ‘ദൈവം അവന് നൽകി’ എന്നിങ്ങനെ കർത്താവിനെ വ്യക്തമാക്കുക
  rationale: മൂലപാഠം നൽകുന്നവനെ പേരെടുത്തുപറയുന്നില്ല; അതിനാൽ ദൈവിക കർമ്മണി ആയിരിക്കാമെന്ന സാധ്യത അംഗീകരിച്ചാലും പരിഭാഷ അതിനെ നിർബന്ധിതമായി തീർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘അതാ’ ദർശനത്തിന്റെ സജീവത നിലനിർത്തുന്നു; അവസാനത്തിലെ ഉദ്ദേശപൂർവമായ ആവർത്തനം ഗ്രീക്ക് വാക്യഘടനയും ജയത്തിന്റെ മുന്നേറ്റഭാവവും സംരക്ഷിക്കുന്നു.
