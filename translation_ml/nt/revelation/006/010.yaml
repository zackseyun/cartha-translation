id: REV.6.10
reference: Revelation 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: ml
  text: 'അവർ ഉച്ചത്തിൽ നിലവിളിച്ചുപറഞ്ഞു: “വിശുദ്ധനും സത്യനുമായ യജമാനനേ,[a] ഭൂമിയിൽ വസിക്കുന്നവർക്കു ന്യായവിധി നടത്തുകയും ഞങ്ങളുടെ രക്തത്തിനു അവരിൽനിന്ന് പ്രതികാരം ചെയ്യുകയും ചെയ്യാതെ എത്രനാൾ നീ ഇരിക്കും?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പരമാധികാരിയേ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം δεσπότης (ദെസ്പോതേസ്) ആണ്; അത് ഉടമസ്ഥതയോടു ബന്ധപ്പെട്ട പരമാധികാരത്തെ ഊന്നിപ്പറയുന്നു. ഇത് സാധാരണയായി “കർത്താവ്” എന്നു പരിഭാഷപ്പെടുത്തുന്ന κύριος എന്ന പദത്തിൽനിന്ന് വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “അവർക്കെതിരെ ഞങ്ങളുടെ രക്തത്തിനു പ്രതികാരം ചെയ്യുകയും” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ἐκ (“നിന്ന്”) എന്ന പ്രയോഗം പ്രതികാരത്തിന്റെ ഉറവിടത്തെയോ അതു ചുമത്തപ്പെടുന്നവരെയോ സൂചിപ്പിക്കാം; “ഭൂമിയിൽ വസിക്കുന്നവർ” എന്നത് വെളിപ്പാട് പുസ്തകത്തിൽ ആവർത്തിക്കുന്ന ഒരു വിശേഷണപ്രയോഗമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔκραξαν φωνῇ μεγάλῃ
  choice: അവർ ഉച്ചത്തിൽ നിലവിളിച്ചുകൊണ്ട് പറഞ്ഞു
  rationale: κράζωയുടെ ശക്തവും അടിയന്തരവുമായ നിലവിളിയും φωνῇ μεγάλῃ എന്ന രീതിസൂചക പ്രയോഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് നൽകുന്നു.
- source_word: Ἕως πότε
  choice: എത്രനാൾ
  rationale: ദൈവിക നടപടി വൈകുന്നതിനെക്കുറിച്ചുള്ള വിലാപപൂർവമായ ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δεσπότης
  choice: സർവാധികാരിയേ
  rationale: κύριος എന്ന സാധാരണ ‘കർത്താവ്’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട്, δεσπότης സൂചിപ്പിക്കുന്ന പരമമായ അധികാരവും അധിപത്യവും വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἅγιος καὶ ἀληθινός
  choice: വിശുദ്ധനും സത്യവാനുമായ
  rationale: ദൈവത്തിന്റെ വിശുദ്ധിയും സത്യസന്ധവും ആശ്രയയോഗ്യവുമായ സ്വഭാവവും അഭിസംബോധനയുടെ ഭാഗമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: ന്യായം വിധിച്ച് ... പ്രതികാരം ചെയ്യാതെ ... നീ കാത്തിരിക്കും
  rationale: രൂപത്തിൽ വർത്തമാനകാല ചോദ്യമായിരുന്നാലും, നടപടി വൈകുന്നതിനെക്കുറിച്ചുള്ള അഭ്യർഥനയാണ് സന്ദർഭത്തിലെ അർഥം. ‘പ്രതികാരം’ എന്നത് ന്യായപരമായ ശിക്ഷാനടപടിയുടെ ശക്തി മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὸ αἷμα ἡμῶν
  choice: ഞങ്ങളുടെ രക്തത്തിന്
  rationale: അക്രമമരണത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾസംബന്ധിയായ ‘രക്തം’ എന്ന പ്രതീകം വിശദീകരിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ വസിക്കുന്നവരെ
  rationale: ἐκ ഇവിടെ പ്രതികാരനടപടിയുടെ ലക്ഷ്യത്തെയോ അവരിൽനിന്നുള്ള കണക്കുചോദിക്കലിനെയോ സൂചിപ്പിക്കുന്നു; വെളിപ്പാടിലെ ആവർത്തിതമായ ‘ഭൂമിയിൽ വസിക്കുന്നവർ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: δεσπότης എന്ന ദൈവിക അഭിസംബോധന
  choice: സർവാധികാരിയേ
  alternative: യജമാനനേ / പരമാധികാരിയായ കർത്താവേ
  rationale: ‘യജമാനൻ’ ഉടമസ്ഥതയുടെ ഭാവം നൽകുമെങ്കിലും ആധുനിക മലയാളത്തിൽ മനുഷ്യബന്ധത്തിന്റെ പരിമിതമായ ധ്വനി ഉണ്ടാകാം. ‘സർവാധികാരി’ പരമാധികാരം വ്യക്തമാക്കുകയും κύριος എന്നതിന്റെ പതിവ് പരിഭാഷയായ ‘കർത്താവ്’ എന്നതുമായി പദവ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: രക്തത്തിന് പ്രതികാരം ചെയ്യണമെന്ന രക്തസാക്ഷികളുടെ അപേക്ഷ
  choice: ഞങ്ങളുടെ രക്തത്തിന് പ്രതികാരം ചെയ്യുക
  alternative: ഞങ്ങളുടെ രക്തത്തിന് നീതി നടത്തുക / ഞങ്ങളെ നീതീകരിക്കുക
  rationale: ἐκδικέωയിലെ ന്യായവിധിയോടുകൂടിയ പ്രതികാരത്തിന്റെ ശക്തി മൃദൂകരിക്കാതെ സൂക്ഷിക്കുന്നു. ഇത് വ്യക്തിപരമായ പ്രതികാരത്തെ അനുകൂലിക്കുന്ന പ്രസ്താവനയാക്കി മാറ്റാതെ ദൈവത്തിന്റെ നീതിനടപടിക്കായുള്ള അപേക്ഷയായി തന്നെയാണ് അവതരിപ്പിക്കുന്നത്.
- issue: οὐ κρίνεις എന്ന ചോദ്യത്തിന്റെ കാലവും ഭാവവും
  choice: ചെയ്യാതെ എത്രനാൾ നീ കാത്തിരിക്കും?
  alternative: എത്രനാൾ നീ ന്യായം വിധിക്കുകയും പ്രതികാരം ചെയ്യാതിരിക്കുകയും ചെയ്യും? / നീ ന്യായം വിധിച്ച് പ്രതികാരം ചെയ്യുകയില്ലേ?
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല രൂപത്തെ യാന്ത്രികമായി പകർത്താതെ, വൈകുന്ന നടപടിയെക്കുറിച്ചുള്ള ചോദ്യത്തിന്റെ പ്രയോഗാർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അതേസമയം ദൈവത്തിന്റെ വൈകിപ്പിക്കൽ എന്തുകൊണ്ടെന്ന് വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നിലവിളിച്ചു,’ ‘എത്രനാൾ,’ ‘ഞങ്ങളുടെ രക്തം’ എന്നീ ദൃശ്യവും വികാരതീവ്രവുമായ പ്രയോഗങ്ങൾ നിലനിർത്തി. δεσπότης–κύριος വ്യത്യാസം സംരക്ഷിക്കാൻ മുഖ്യപാഠത്തിൽ ‘സർവാധികാരി’ ഉപയോഗിച്ച് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
