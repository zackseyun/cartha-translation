id: REV.6.9
reference: Revelation 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: ml
  text: അവൻ അഞ്ചാമത്തെ മുദ്ര തുറന്നപ്പോൾ, ദൈവവചനം നിമിത്തവും തങ്ങൾക്കുണ്ടായിരുന്ന സാക്ഷ്യം നിമിത്തവും അറുക്കപ്പെട്ടവരുടെ ആത്മാക്കളെ യാഗപീഠത്തിന്റെ കീഴിൽ ഞാൻ കണ്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സാക്ഷ്യം’ എന്നതിന് ‘സാക്ഷ്യവഹിക്കൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം പറഞ്ഞ സാക്ഷ്യമൊഴിയെയോ സാക്ഷ്യം വഹിക്കുന്ന പ്രവൃത്തിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: തുറന്നപ്പോൾ
  rationale: ἀνοίγω എന്ന ക്രിയയുടെ സാധാരണ അർഥവും വെളിപ്പാടിലെ മുദ്രതുറക്കൽ പരമ്പരയിലെ ആവർത്തിത പ്രയോഗവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: σφραγῖδα
  choice: മുദ്ര
  rationale: അപോകലിപ്റ്റിക ദൃശ്യത്തിലെ σφραγίς എന്ന പദത്തിന് കൃത്യവും പരമ്പരാഗതവുമായ മലയാളപദം.
- source_word: ὑποκάτω τοῦ θυσιαστηρίου
  choice: യാഗപീഠത്തിന്റെ കീഴിൽ
  rationale: സ്ഥലസൂചനയും ബലിസംബന്ധമായ ദൃശ്യവും അധിക വിശദീകരണമില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: ψυχὰς
  choice: ആത്മാക്കളെ
  rationale: ദർശനത്തിൽ മരിച്ചവരെക്കുറിച്ചുള്ള പ്രത്യേക ചിത്രണം സംരക്ഷിക്കുന്നു; ‘ജീവൻ’ അല്ലെങ്കിൽ ‘വ്യക്തികൾ’ എന്നു പരാവർത്തനം ചെയ്ത് ദൃശ്യം മങ്ങിക്കുന്നില്ല.
- source_word: ἐσφαγμένων
  choice: അറുക്കപ്പെട്ടവരുടെ
  rationale: σφάζω സൂചിപ്പിക്കുന്ന അക്രമാസക്തമായ അറുക്കലും യാഗപീഠത്തോടു ചേർന്ന ബലിസംബന്ധമായ അനുരണനവും ‘കൊല്ലപ്പെട്ട’ എന്ന പൊതുപദത്തേക്കാൾ നന്നായി നിലനിർത്തുന്നു.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: ദൈവവചനം നിമിത്തം
  rationale: διά + accusative ഇവിടെ സൂചിപ്പിക്കുന്ന കാരണബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μαρτυρίαν ἣν εἶχον
  choice: തങ്ങൾക്കുണ്ടായിരുന്ന സാക്ഷ്യം
  rationale: ἣν εἶχον എന്ന ലളിതമായ ‘അവർക്കുണ്ടായിരുന്നു’ എന്ന ആശയം വ്യാഖ്യാനാത്മക വിപുലീകരണമില്ലാതെ നൽകുന്നു; μαρτυρίαയുടെ ‘സാക്ഷ്യം/സാക്ഷ്യവഹിക്കൽ’ എന്ന അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദർശനത്തിലെ ψυχὰς എന്നതിന്റെ സ്വഭാവം
  choice: ‘ആത്മാക്കൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ജീവനുകൾ’ അല്ലെങ്കിൽ ‘വ്യക്തികൾ’
  rationale: മരിച്ചവരുടെ ആത്മാക്കളെ യാഗപീഠത്തിനു കീഴിൽ കാണുന്ന ദർശനചിത്രം സംരക്ഷിക്കുന്നു; ഇതിൽനിന്ന് വിപുലമായ മനുഷ്യസ്വഭാവശാസ്ത്ര നിഗമനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: ἐσφαγμένων എന്നതിന്റെ ശക്തിയും ബലിസംബന്ധമായ അനുരണനവും
  choice: ‘അറുക്കപ്പെട്ടവർ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കൊല്ലപ്പെട്ടവർ’
  rationale: യാഗപീഠത്തിന്റെ പശ്ചാത്തലത്തിൽ σφάζωയുടെ ശക്തമായ, ബലിസംബന്ധമായ ഭാവം മൃദൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: μαρτυρία എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: പ്രധാന പാഠത്തിൽ ‘സാക്ഷ്യം’ ഉപയോഗിച്ചു.
  alternative: ‘സാക്ഷ്യവഹിക്കൽ’
  rationale: ഗ്രീക്ക് പദം സാക്ഷ്യമൊഴിയെയോ സാക്ഷ്യവഹിക്കലിനെയോ സൂചിപ്പിക്കാം; പ്രധാന പാഠം ഈ സാന്ദ്രത സംരക്ഷിക്കുകയും അടിക്കുറിപ്പ് മറ്റൊരു വായന അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘യാഗപീഠം’, ‘ആത്മാക്കൾ’, ‘അറുക്കപ്പെട്ടവർ’ എന്നീ പദങ്ങൾ ദർശനത്തിലെ ആരാധനാ-ബലിദാന ദൃശ്യത്തെ സംരക്ഷിക്കുന്നു. പ്രധാന പാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
