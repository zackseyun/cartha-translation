id: REV.6.14
reference: Revelation 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: ml
  text: ആകാശം ചുരുട്ടപ്പെടുന്ന ഒരു ചുരുൾപോലെ വേർപെട്ടുപോയി[a][b]; എല്ലാ മലകളും ദ്വീപുകളും അവയുടെ സ്ഥാനങ്ങളിൽനിന്ന് നീക്കപ്പെട്ടു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആകാശം അകന്നുപോയി’ എന്നും ‘ആകാശം വേർപെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദത്തിന് വേർപെടുക, പിൻവാങ്ങുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ചുരുൾ’ എന്നത് ചുരുട്ടിവെക്കാവുന്ന പുരാതന എഴുത്തുചുരുളാണ്, ആധുനിക രീതിയിൽ തുന്നിക്കെട്ടിയ പുസ്തകമല്ല.
    reason: cultural_note
  - marker: c
    text: 'അക്ഷരാർഥം: ‘അവയുടെ സ്ഥാനങ്ങളിൽനിന്ന്.’ അതായത് ഓരോ മലയും ദ്വീപും അതത് സ്ഥാനത്തുനിന്ന് നീക്കപ്പെട്ടു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανὸς
  choice: ആകാശം
  rationale: ഈ അന്ത്യദർശനത്തിലെ ഭൗമിക-പ്രാപഞ്ചിക ദൃശ്യത്തിൽ ഭൂമിക്കുമുകളിലെ ദൃശ്യവിസ്തൃതിയാണ് ഉദ്ദേശിക്കുന്നത്; ദൈവത്തിന്റെ വാസസ്ഥലം എന്ന ധ്വനി അനാവശ്യമായി വരാതിരിക്കാൻ ‘ആകാശം’ സ്വാഭാവികമാണ്.
- source_word: ἀπεχωρίσθη
  choice: വേർപെട്ടുപോയി
  rationale: ക്രിയയ്ക്ക് വേർപെടുക, അകന്നുപോകുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ചുരുൾ ചുരുട്ടപ്പെടുന്ന ഉപമയോടൊപ്പം ഈ പരിഭാഷ വേർപാടിന്റെയും പിൻവാങ്ങലിന്റെയും അർഥവ്യാപ്തി നിലനിർത്തുന്നു; പൂർണമായി അപ്രത്യക്ഷമായി എന്ന് ഉറപ്പിക്കുന്നില്ല.
- source_word: βιβλίον
  choice: ചുരുൾ
  rationale: ഒന്നാം നൂറ്റാണ്ടിലെ സന്ദർഭത്തിലും ചുരുട്ടപ്പെടുന്ന ഉപമയിലും ഇത് ആധുനിക തുന്നിക്കെട്ടിയ പുസ്തകത്തേക്കാൾ എഴുത്തുചുരുളിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἑλισσόμενον
  choice: ചുരുട്ടപ്പെടുന്ന
  rationale: വർത്തമാന മധ്യ/കർമണി കൃദന്തരൂപം ചുരുട്ടപ്പെടുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ഉപമ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: എല്ലാ മലകളും ദ്വീപുകളും
  rationale: ഗ്രീക്കിലെ ഏകവചന നാമങ്ങളോടുകൂടിയ πᾶν വിതരണാർഥത്തിൽ ഓരോ മലയും ഓരോ ദ്വീപും ഉൾപ്പെടുന്നതായി പറയുന്നു; മലയാളത്തിൽ ബഹുവചനരൂപം സ്വാഭാവികവും സമഗ്രവുമാണ്.
- source_word: ἐκ τῶν τόπων αὐτῶν
  choice: അവയുടെ സ്ഥാനങ്ങളിൽനിന്ന്
  rationale: മൂലത്തിലെ ബഹുവചനം നേരിട്ട് നിലനിർത്തുകയും ഓരോന്നും അതത് സ്ഥാനത്തുനിന്ന് മാറ്റപ്പെട്ടുവെന്ന ആശയം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐκινήθησαν
  choice: നീക്കപ്പെട്ടു
  rationale: ഇവിടെ വെറും കുലുക്കമല്ല, സ്ഥാനത്തുനിന്നുള്ള മാറ്റമാണ് ἐκ τῶν τόπων എന്ന പ്രയോഗം സൂചിപ്പിക്കുന്നത്; കർമണിരൂപവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യദർശനത്തിലെ οὐρανός എന്ന പ്രാപഞ്ചിക പദം
  choice: ‘ആകാശം’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘സ്വർഗം’
  rationale: ദൃശ്യമായ പ്രാപഞ്ചിക കലക്കമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘സ്വർഗം’ ദൈവത്തിന്റെ വാസസ്ഥലത്തെക്കുറിച്ചുള്ള അധികമായ ദൈവശാസ്ത്ര നിഗമനം ഉണർത്താം.
- issue: ആകാശത്തിന് സംഭവിക്കുന്നതിന്റെ സ്വഭാവം
  choice: ‘വേർപെട്ടുപോയി’
  alternative: ‘അപ്രത്യക്ഷമായി’ / ‘പിളർന്നു’ / ‘അകന്നുപോയി’
  rationale: ἀπεχωρίσθη എന്ന പദത്തിലെ വേർപാട്/പിൻവാങ്ങൽ സംബന്ധമായ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തുന്നു. ദൃശ്യം നാശമോ വെറും പിളർപ്പോ മാത്രമാണെന്ന് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ദർശനവിവരണ ശൈലി. ‘ചുരുൾ’, ‘വേർപെട്ടുപോയി’, ‘നീക്കപ്പെട്ടു’ എന്നീ പദങ്ങൾ മൂലദൃശ്യവും കർമണിഘടനയും സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനരികെ നൽകിയിരിക്കുന്നു.
