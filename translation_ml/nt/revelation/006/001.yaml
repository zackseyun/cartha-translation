reference: Revelation 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: ml
  text: കുഞ്ഞാട് ഏഴ് മുദ്രകളിൽ ഒന്ന് തുറന്നപ്പോൾ ഞാൻ കണ്ടു. അപ്പോൾ നാല് ജീവികളിൽ ഒന്ന് ഇടിമുഴക്കംപോലെയുള്ള ശബ്ദത്തിൽ, “വരിക”[a] എന്നു പറയുന്നതു ഞാൻ കേട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആജ്ഞ യോഹന്നാനെയല്ല, കുതിരപ്പുറത്തുള്ളവനെയാണ് അഭിസംബോധന ചെയ്യുന്നതെന്നു മനസ്സിലാക്കിയാൽ, “പുറപ്പെടുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: കുഞ്ഞാട്
  rationale: വെളിപ്പാടിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരാണ്; മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ രൂപം.
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: ഏഴ് മുദ്രകളിൽ ഒന്ന്
  rationale: ഏഴടങ്ങിയ ഗണത്തിൽനിന്നുള്ള ഒരു മുദ്ര എന്ന ഭാഗികബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ζῴων
  choice: ജീവികൾ
  rationale: സിംഹാസനമുറിയിലെ ജീവസത്തകളെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ മൃഗങ്ങളെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘ജീവികൾ’ യോജിക്കുന്നു.
- source_word: ὡς φωνῇ βροντῆς
  choice: ഇടിമുഴക്കംപോലെയുള്ള ശബ്ദത്തിൽ
  rationale: ശബ്ദത്തെ ഇടിമുഴക്കത്തോട് ഉപമിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ἔρχου
  choice: വരൂ
  rationale: ഗ്രീക്ക് ആജ്ഞാരൂപത്തിന്റെ ഏറ്റവും നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; അഭിസംബോധിതൻ ആരെന്ന് മുഖ്യപാഠത്തിൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: ὅτε
  choice: തുറന്നപ്പോൾ
  rationale: സംഭവങ്ങളുടെ സമയബന്ധം മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: കൂടുതൽ ക്രിയ ചേർക്കാതെ ആഖ്യാനത്തിലെ ഭൂതകാലക്രിയ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἤκουσα
  choice: ഞാൻ കേട്ടു
  rationale: ആഖ്യാനക്രമത്തിലെ ἀκούω എന്ന ക്രിയയുടെ സാധാരണയും കൃത്യവുമായ പരിഭാഷ.
- source_word: λέγοντος
  choice: പറയുന്നതു
  rationale: സംസാരരീതിയെ അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ കൃ dan? Wait JSON no. Need correct. Continue.
theological_decisions:
- issue: Ἔρχου എന്ന ആജ്ഞയുടെ അഭിസംബോധിതനും പ്രയോഗബലവും
  choice: അഭിസംബോധിതനെ വ്യക്തമാക്കാതെ ‘വരൂ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുന്നു.
  alternative: ആജ്ഞ കുതിരപ്പുറത്തിരിക്കുന്നവനോടാണെന്നു മനസ്സിലാക്കിയാൽ ‘പുറപ്പെടൂ’ എന്നും പരിഭാഷപ്പെടുത്താം.
  rationale: ഗ്രീക്ക് പാഠം അഭിസംബോധിതനെ തുറന്നു പറയുന്നില്ല. അതിനാൽ അവ്യക്തത പരിഹരിക്കാതെ നിലനിർത്തുകയും വ്യാഖ്യാനപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കുഞ്ഞാട്’, ‘മുദ്ര’, ‘ജീവികൾ’ തുടങ്ങിയ സന്ദർഭോചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
