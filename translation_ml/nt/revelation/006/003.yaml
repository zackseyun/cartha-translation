id: REV.6.3
reference: Revelation 6:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: ml
  text: അവൻ രണ്ടാമത്തെ മുദ്ര തുറന്നപ്പോൾ, “വരിക” എന്നു രണ്ടാമത്തെ ജീവി പറയുന്നതു ഞാൻ കേട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പോകുക.” ഈ ആജ്ഞ മുന്നോട്ടുവരാനുള്ള വിളിയല്ല, കുതിരപ്പുറത്തിരിക്കുന്നവനോടുള്ളതാണെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: അപ്പോൾ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള ആഖ്യാനത്തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; കാലസൂചക ഉപവാക്യത്തോടൊപ്പം പ്രത്യേകം ‘എന്നും’ ചേർക്കേണ്ടതില്ല.
- source_word: ὅτε ἤνοιξεν
  choice: അവൻ ... തുറന്നപ്പോൾ
  rationale: ὅτε എന്ന കാലബന്ധവും ἀνοίγωയുടെ നേരിട്ടുള്ള അർഥമായ ‘തുറക്കുക’ എന്നതും സംരക്ഷിക്കുന്നു; ‘മുദ്ര പൊട്ടിച്ചു’ എന്ന വ്യാഖ്യാനപരമായ ക്രിയ ഒഴിവാക്കുന്നു.
- source_word: σφραγῖδα τὴν δευτέραν
  choice: രണ്ടാമത്തെ മുദ്ര
  rationale: ഗ്രീക്കിലെ ക്രമസംഖ്യാ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἤκουσα
  choice: ഞാൻ കേട്ടു
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ aorist രൂപത്തിന് ലളിതവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: τοῦ δευτέρου ζῴου
  choice: രണ്ടാമത്തെ ജീവി
  rationale: വെളിപ്പാടിലെ സിംഹാസനസന്നിധിയിലെ ജീവസത്തയെ സൂചിപ്പിക്കുന്ന ζῷον എന്ന പദത്തെ സാധാരണ മൃഗമായി തെറ്റിദ്ധരിപ്പിക്കാതെ, മുൻസന്ദർഭവുമായി ഒത്തുപോകുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: λέγοντος
  choice: പറയുന്നതു
  rationale: ‘കേട്ടു’ എന്ന ക്രിയയെ ആശ്രയിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἔρχου
  choice: വരിക
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം; അഭിസംബോധിതൻ ആരെന്ന സന്ദർഭപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: മുദ്ര തുറക്കുന്ന സന്ദർഭത്തിലെ Ἔρχου എന്ന ആജ്ഞയുടെ പരിഭാഷ
  choice: വരിക
  alternative: പോകുക
  rationale: ഗ്രീക്ക് പദത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ അർഥം ‘വരിക’ എന്നാണ്. ആജ്ഞ യോഹന്നാനോടാണോ കുതിരപ്പുറത്തിരിക്കുന്നവനോടാണോ എന്നത് സന്ദർഭത്തിൽ ചർച്ചാവിഷയമായതിനാൽ പ്രധാനപാഠത്തിൽ അത് തീർപ്പാക്കാതെ, മറ്റൊരു ഗ്രഹിക്കൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ജീവി’ എന്ന പദം സമീപസന്ദർഭത്തിലെ സിംഹാസനജീവികളെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ഉപയോഗമായി നിലനിർത്തി; വ്യാഖ്യാനപരമായ അധികവിശേഷണങ്ങൾ ചേർത്തിട്ടില്ല.
