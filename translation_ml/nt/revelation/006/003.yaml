  source_fidelity: 'പ്രധാനവാക്യം ഗ്രീക്ക് ക്രമവും അർഥവും കൃത്യമായി നൽകുന്നു: അവൻ മുദ്ര തുറക്കുന്നു, യോഹന്നാൻ രണ്ടാമത്തെ ജീവി പറയുന്നതു കേൾക്കുന്നു, ആജ്ഞയുടെ മുഖ്യവായന ‘വരിക’ തന്നെയാണ്. തുടക്കത്തിലെ Καὶ മലയാള ആഖ്യാനശൈലിയിൽ സ്വതന്ത്ര പദമായി ഒഴിവാക്കാവുന്നതാണ്; ‘...തുറന്നപ്പോൾ’ എന്ന ബന്ധം തുടർച്ചയെ മതിയായി വഹിക്കുന്നു.'
  naturalness: മുഖ്യപാഠം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. എന്നാൽ അടിക്കുറിപ്പിലെ ‘മുന്നോട്ടുവരാനുള്ള വിളിയായല്ല’ എന്ന പ്രയോഗം അനാവശ്യമായി നിഷേധാത്മകവും വ്യാഖ്യാനത്തെ ദ്വന്ദ്വമായി ചുരുക്കുന്നതുമാണ്. അഭിസംബോധിതനെക്കുറിച്ചുള്ള ചർച്ചയെ കൂടുതൽ നേരിട്ട്, സ്വാഭാവികമായി അറിയിക്കണം.
