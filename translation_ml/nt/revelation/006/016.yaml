id: REV.6.16
reference: Revelation 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: ml
  text: 'അവർ മലകളോടും പാറകളോടും പറയുന്നു: “ഞങ്ങളുടെമേൽ വീഴുവിൻ; സിംഹാസനത്തിൽ ഇരിക്കുന്നവന്റെ മുഖത്തുനിന്നും[a] കുഞ്ഞാടിന്റെ ക്രോധത്തിൽനിന്നും ഞങ്ങളെ മറയ്ക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സിംഹാസനത്തിൽ ഇരിക്കുന്നവന്റെ സന്നിധിയിൽനിന്നും.’
    reason: ἀπὸ προσώπου എന്നത് അക്ഷരാർഥത്തിൽ ‘മുഖത്തുനിന്ന്’ എന്നും സന്ദർഭാനുസൃതമായി ‘സന്നിധിയിൽനിന്ന്’ എന്നും മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: λέγουσιν
  choice: പറയുന്നു
  rationale: വർത്തമാനകാല നിർദേശരൂപത്തിന്റെ ദൃശ്യമായ അടിയന്തരത നിലനിർത്തുന്നു; അപോകലിപ്റ്റിക് വിവരണത്തിലെ vivid present സ്വാഭാവികമായി മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὄρεσιν
  choice: മലകളോട്
  rationale: ὄρος എന്നതിന്റെ സാധാരണവും കൃത്യവുമായ അർഥം ‘മല’ ആണ്; ‘കുന്നുകൾ’ എന്നു പറയുന്നത് ദൃശ്യത്തിന്റെ ശക്തി കുറയ്ക്കും.
- source_word: πέτραις
  choice: പാറകളോട്
  rationale: πέτρα പാറക്കൂട്ടത്തെയോ ശിലാഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു; ‘പാറകൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ദൃശ്യസമ്പന്നവുമാണ്.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: ഞങ്ങളുടെമേൽ വീഴുവിൻ
  rationale: ബഹുവചനത്തിലെ അടിയന്തര കല്പനയുടെ ശക്തി നിലനിർത്തുന്നു; ἐπί + accusative ഇവിടെ ‘മേൽ’ എന്ന് കൃത്യമായി നൽകുന്നു.
- source_word: κρύψατε ἡμᾶς
  choice: ഞങ്ങളെ മറയ്ക്കുവിൻ
  rationale: നേരിട്ടുള്ള കല്പനയുടെ ശക്തി നിലനിർത്തുന്ന, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗം.
- source_word: ἀπὸ προσώπου
  choice: മുഖത്തുനിന്നും
  rationale: πρόσωπον എന്നതിന്റെ വ്യക്തമായ ‘മുഖം’ എന്ന ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ സാധ്യമായ ‘സന്നിധിയിൽനിന്ന്’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്നവന്റെ
  rationale: Substantival participle-ഉം തുടരുന്ന സിംഹാസനസ്ഥിതിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὀργῆς
  choice: ക്രോധം
  rationale: ന്യായവിധിയുടെ ശക്തമായ കോപം സൂചിപ്പിക്കുന്ന ὀργήയ്ക്ക് ‘ക്രോധം’ ഗൗരവവും തീവ്രതയും നൽകുന്നു.
- source_word: τοῦ ἀρνίου
  choice: കുഞ്ഞാട്
  rationale: വെളിപ്പാടിലെ സ്ഥിരമായ ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകവും ബലിയർപ്പണത്തിലെ സൗമ്യതയും ന്യായവിധിയിലെ അധികാരവും ചേർന്ന വിരോധാഭാസവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അപോകലിപ്റ്റിക് ന്യായവിധിയിലെ ദൈവിക-മാനുഷിക കർത്താക്കളെ അവതരിപ്പിക്കൽ
  choice: ‘സിംഹാസനത്തിൽ ഇരിക്കുന്നവൻ’ എന്നും ‘കുഞ്ഞാട്’ എന്നും വേർതിരിച്ചെങ്കിലും ഏകോപിതമായ ഭയത്തിന്റെയും ന്യായവിധിയുടെയും ഉറവിടങ്ങളായി നിലനിർത്തി.
  alternative: ഇരുവരെയും ദൈവത്തെക്കുറിച്ചുള്ള പൊതുവായ ഒറ്റ പരാമർശമായി ലയിപ്പിക്കുകയോ ‘കുഞ്ഞാടിന്റെ ക്രോധം’ മൃദൂകരിക്കുകയോ ചെയ്യുക.
  rationale: ഗ്രീക്കിൽ ἀπό-യോടൊപ്പം ഏകോപിപ്പിച്ച രണ്ടു വ്യത്യസ്ത genitive ഘടകങ്ങളുണ്ട്. ബലിയർപ്പണവുമായി ബന്ധപ്പെട്ട കുഞ്ഞാട് അന്ത്യന്യായവിധിയുടെ ക്രോധവും വഹിക്കുന്നു എന്ന ഉദ്ദേശ്യപൂർവമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. അഭിസംബോധനയുടെ ബഹുവചന കല്പനാഭാവം വ്യക്തമാക്കാൻ ‘വീഴുവിൻ’, ‘മറയ്ക്കുവിൻ’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ vivid present ‘പറയുന്നു’ എന്നു നിലനിർത്തി.
