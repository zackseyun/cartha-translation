id: REV.6.7
reference: Revelation 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: ml
  text: 'അവൻ നാലാമത്തെ മുദ്ര തുറന്നപ്പോൾ, നാലാമത്തെ ജീവിയുടെ ശബ്ദം ഇങ്ങനെ പറയുന്നതായി ഞാൻ കേട്ടു: “വരുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുറപ്പെടുക” എന്നും ആയേക്കാം. ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി “വരുക” എന്നാണ്; എന്നാൽ ഈ ആജ്ഞ യോഹന്നാനോടാണോ കുതിരക്കാരനോടാണോ എന്നതിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: തുറന്നപ്പോൾ
  rationale: ἀνοίγω എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ സ്വാഭാവിക പരിഭാഷ; ചുരുളിലെ മുദ്ര തുറക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: σφραγῖδα
  choice: മുദ്ര
  rationale: വെളിപ്പാട് 6-ൽ ചുരുളിനെ അടച്ചിരിക്കുന്ന seal-നുള്ള സ്ഥിരവും കൃത്യവുമായ മലയാളപദം.
- source_word: τετάρτην / τετάρτου
  choice: നാലാമത്തെ
  rationale: രണ്ട് സ്ഥാനങ്ങളിലുമുള്ള ക്രമസംഖ്യ ഒരേവിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: φωνὴν
  choice: ശബ്ദം
  rationale: φωνή ഇവിടെ ജീവി ഉച്ചരിക്കുന്ന കേൾവിയായ ശബ്ദത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പറയുന്ന ശബ്ദം’ സ്വാഭാവികവും മൂലവാക്യത്തിന്റെ ഘടനയോട് അടുത്തതുമാണ്.
- source_word: ζῴου
  choice: ജീവി
  rationale: സിംഹാസനത്തെ ചുറ്റിയുള്ള ജീവസത്തകളെയാണ് ζῷον സൂചിപ്പിക്കുന്നത്; θηρίον എന്ന ‘മൃഗം’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: λέγοντος
  choice: പറയുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം ‘പറയുന്ന ശബ്ദം’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ നിലനിർത്തി.
- source_word: Ἔρχου
  choice: വരുക
  rationale: ഏകവചന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം; ആരോടാണ് പറയുന്നതെന്ന് വാചകം വ്യക്തമാക്കാത്തതിനാൽ അതു കൂട്ടിച്ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: Ἔρχου എന്ന ആജ്ഞയുടെ അഭിസംബോധിതൻ
  choice: ആരോടാണെന്ന് വ്യക്തമാക്കാതെ “വരുക” എന്നു മാത്രം നൽകി.
  alternative: യോഹന്നാനോടുള്ള ആജ്ഞയായോ കുതിരക്കാരനോടുള്ള പുറപ്പെടാനുള്ള ആജ്ഞയായോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് മൂലപാഠം അഭിസംബോധിതനെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനത്തിലൂടെ അനിശ്ചിതത്വം പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിത ദർശനവിവരണത്തിന്റെ ഔപചാരികത കാത്തുസൂക്ഷിച്ചു; അഭിസംബോധിതനെക്കുറിച്ചുള്ള മൂലപാഠത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പോടെ നിലനിർത്തി.
