id: REV.6.6
reference: Revelation 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: ml
  text: 'നാല് ജീവികളുടെ നടുവിൽനിന്ന് ഒരു ശബ്ദംപോലെ ഞാൻ കേട്ടു; അതു ഇങ്ങനെ പറയുന്നതായിരുന്നു: “ഒരു ദിനാറിന് ഒരു കൊയ്നിക്സ് ഗോതമ്പ്[a][b]; ഒരു ദിനാറിന് മൂന്ന് കൊയ്നിക്സ് യവം; എണ്ണയ്ക്കും വീഞ്ഞിനും കേടുവരുത്തരുത്[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഒരു കൊയ്നിക്സ് ഏകദേശം ഒരു ലിറ്ററിനടുത്തുള്ള ഉണങ്ങിയ ധാന്യത്തിന്റെ അളവായിരുന്നു; സാധാരണയായി ഒരാൾക്കുള്ള ഒരു ദിവസത്തെ ധാന്യവിഹിതമായി ഇതിനെ കണക്കാക്കിയിരുന്നു.
    reason: cultural_note
  - marker: b
    text: ഒരു ദിനാർ സാധാരണയായി ഒരു തൊഴിലാളിയുടെ ഒരു ദിവസത്തെ കൂലിയായിരുന്നു. അതിനാൽ ഇവിടെ പറഞ്ഞിരിക്കുന്ന വിലകൾ കടുത്ത ക്ഷാമത്തെ ചിത്രീകരിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: 'അഥവാ: “എണ്ണയെയും വീഞ്ഞിനെയും ഹാനിപ്പെടുത്തരുത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: ഒരു ശബ്ദംപോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന സാദൃശ്യമോ അനുഭവപ്രതീതിയോ നിലനിർത്തുന്നു; ശബ്ദത്തിന്റെ ഉറവിടം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: നാല് ജീവികളുടെ നടുവിൽനിന്ന്
  rationale: ἐν μέσῳ എന്നതിന്റെ സ്ഥാനസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ζῷα-യ്ക്ക് ‘ജീവികൾ’ എന്നു നൽകുന്നത് പിന്നീട് വരുന്ന വിരുദ്ധ ‘മൃഗങ്ങളുമായി’ ഇവയെ കുഴയ്ക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: Χοῖνιξ
  choice: കൊയ്നിക്സ്
  rationale: പുരാതന അളവിനെ ആധുനിക അളവിലേക്ക് കൃത്യതയില്ലാതെ മാറ്റാതെ ചരിത്രപരമായ പദം നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: σίτου
  choice: ഗോതമ്പ്
  rationale: യവത്തോടുള്ള വ്യക്തമായ വ്യത്യാസം നിലനിർത്തുന്ന സാധാരണ അർഥം.
- source_word: δηναρίου
  choice: ഒരു ദിനാറിന്
  rationale: വില സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; പുരാതന നാണയനാമം നിലനിർത്തുന്നു.
- source_word: τρεῖς χοίνικες κριθῶν
  choice: മൂന്ന് കൊയ്നിക്സ് യവം
  rationale: ആദ്യ അളവുപദവുമായി ഏകീകരണം പാലിക്കുകയും κριθαί എന്നതിന്റെ അർഥം കൃത്യമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: μὴ ἀδικήσῃς
  choice: കേടുവരുത്തരുത്
  rationale: സാധനങ്ങളായ എണ്ണയും വീഞ്ഞും സന്ദർഭമായതിനാൽ ἀδικέω-യുടെ ‘ഹാനി ചെയ്യുക/നശിപ്പിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വിശാലമായ ‘ഹാനി ചെയ്യരുത്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τὸ ἔλαιον καὶ τὸν οἶνον
  choice: എണ്ണയ്ക്കും വീഞ്ഞിനും
  rationale: ἔλαιον സാധാരണയായി ഒലിവെണ്ണയെ സൂചിപ്പിച്ചാലും മൂലത്തിലെ പൊതുവായ പ്രയോഗം നിലനിർത്തുന്നു; οἶνος-ന് സ്വാഭാവികമായ ‘വീഞ്ഞ്’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: വെളിപ്പാടിലെ സിംഹാസനദർശനത്തിലുള്ള ζῴων എന്ന പദം
  choice: ജീവികൾ
  alternative: മൃഗങ്ങൾ
  rationale: ദർശനത്തിലെ സിംഹാസനത്തെ ചുറ്റിയുള്ള ജീവികളെ പിന്നീട് പ്രത്യക്ഷപ്പെടുന്ന ശത്രുതാപരമായ ‘മൃഗങ്ങളിൽനിന്ന്’ വേർതിരിക്കുന്നു; മൂലപദത്തിന്റെ ‘ജീവിക്കുന്ന സത്തകൾ’ എന്ന ആശയവും നിലനിർത്തുന്നു.
- issue: പുരാതന അളവും കൂലിനാണയവും എത്രമാത്രം ആധുനികവത്കരിക്കണം
  choice: കൊയ്നിക്സ്, ദിനാർ എന്നീ ചരിത്രപദങ്ങൾ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുക
  alternative: ലിറ്റർ പോലുള്ള ആധുനിക അളവ് മുഖ്യവാക്യത്തിൽ ഉപയോഗിക്കുക
  rationale: χоῖνιξ-ന്റെ കൃത്യമായ ആധുനിക തുല്യത അനിശ്ചിതമായതിനാൽ തെറ്റായ കൃത്യത ഒഴിവാക്കുന്നു; ദിനാറിന്റെ ദിവസക്കൂലി-സംബന്ധമായ സാംസ്കാരിക ശക്തി അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ദർശനാത്മക ശൈലി. പുരാതന അളവും നാണയവും ലിപ്യന്തരണം ചെയ്ത് ചരിത്രസവിശേഷത സംരക്ഷിച്ചു; അവയുടെ പ്രായോഗിക അർഥം അടിക്കുറിപ്പുകളിൽ നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യവാചകഭാഗങ്ങളിൽ ചേർത്തിട്ടുണ്ട്.
