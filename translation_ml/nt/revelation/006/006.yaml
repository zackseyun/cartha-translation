  source_fidelity: 'തിരുത്തൽ ആവശ്യമാണ്: ‘λέγουσαν’ എന്ന ‘പറയുന്ന/പറഞ്ഞ’ ഘടകം കരടിയിൽ ഉദ്ധരണിച്ചിഹ്നംകൊണ്ട് മാത്രം സൂചിപ്പിക്കപ്പെടുന്നു; അത് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നത് ഉചിതമാണ്. കൂടാതെ തുടക്കത്തിലെ ‘അപ്പോൾ’ ഗ്രീക്കിലെ ലളിതമായ καὶ-യെ അനാവശ്യമായി കാലസൂചകമാക്കുന്നു. ‘നടുവിൽനിന്ന്’ എന്ന പ്രയോഗം ശബ്ദത്തിന്റെ ഉറവിടത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ὡς-ന്റെ സാദൃശ്യം ‘ഒരു ശബ്ദംപോലെ’ എന്നതിൽ നിലനിൽക്കുന്നു.'
  naturalness: മുഴുവൻ വാക്യവും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘അതു ഇങ്ങനെ പറയുന്നതായിരുന്നു’ ചേർക്കുന്നതിലൂടെ ഉദ്ധരണിയുടെ ബന്ധം വ്യക്തവും വായനാസുഗമവുമാകുന്നു.
  terminology: ‘ജീവികൾ,’ ‘കൊയ്നിക്സ്,’ ‘ഗോതമ്പ്,’ ‘യവം,’ ‘ദിനാർ,’ ‘എണ്ണ,’ ‘വീഞ്ഞ്’ എന്നിവ സന്ദർഭത്തിനും മൂലപദങ്ങൾക്കും യോജിച്ചവയാണ്. ‘കേടുവരുത്തരുത്’ ἀδικήσῃς-ന്റെ സന്ദർഭോചിതമായ വിശാല അർഥം നൽകുന്നു. അടിക്കുറിപ്പുകൾ അളവ്, ദിനാറിന്റെ കൂലിസംബന്ധം, പദപര്യായം എന്നിവ യഥാക്രമം വ്യക്തമാക്കുന്നു.
