revisions:
- from: 'അപ്പോൾ, നാല് ജീവികളുടെ നടുവിൽനിന്ന് ഒരു ശബ്ദംപോലെ ഞാൻ കേട്ടു: “ഒരു ദിനാറിന് ഒരു കൊയ്നിക്സ് ഗോതമ്പ്[a][b]; ഒരു ദിനാറിന് മൂന്ന് കൊയ്നിക്സ് യവം; എണ്ണയ്ക്കും വീഞ്ഞിനും കേടുവരുത്തരുത്.”[c]'
  to: 'നാല് ജീവികളുടെ നടുവിൽനിന്ന് ഒരു ശബ്ദംപോലെ ഞാൻ കേട്ടു; അതു ഇങ്ങനെ പറയുന്നതായിരുന്നു: “ഒരു ദിനാറിന് ഒരു കൊയ്നിക്സ് ഗോതമ്പ്[a][b]; ഒരു ദിനാറിന് മൂന്ന് കൊയ്നിക്സ് യവം; എണ്ണയ്ക്കും വീഞ്ഞിനും കേടുവരുത്തരുത്[c].”'
  rationale: ‘പറയുന്നതായിരുന്നു’ ചേർത്ത് λέγουσαν-ന്റെ ആശയം വ്യക്തമായി നൽകിയിരിക്കുന്നു. καὶ-യെ അനാവശ്യമായി കാലസൂചകമാക്കുന്ന ‘അപ്പോൾ’ ഒഴിവാക്കി. അളവുപദവും നാണയനാമവും ചരിത്രപരമായി നിലനിർത്തിയിട്ടുണ്ട്; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ ബാധിക്കുന്ന പദങ്ങളോട് ചേർത്തിരിക്കുന്നു.
