id: REV.6.11
reference: Revelation 6:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow servants and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: ml
  text: 'അവരിൽ ഓരോരുത്തർക്കും ഒരു വെളുത്ത അങ്കി നൽകപ്പെട്ടു. അവരോടു പറഞ്ഞു: അവരെപ്പോലെതന്നെ കൊല്ലപ്പെടാനിരിക്കുന്ന അവരുടെ സഹദാസന്മാരും സഹോദരന്മാരും[b] പൂർത്തിയാകുന്നതുവരെ[a] അവർ കുറച്ചുകാലം കൂടി വിശ്രമിക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൂർത്തിയാകുന്നതുവരെ’ എന്നതിന് ‘നിറവേറുന്നതുവരെ’ എന്നും, സന്ദർഭാർഥമായി ‘അവരുടെ പൂർണ്ണസംഖ്യ തികയുന്നതുവരെ’ എന്നും മനസ്സിലാക്കാം. ഗ്രീക്കിൽ ‘എണ്ണം’ എന്ന പദം നേരിട്ട് ഇല്ല.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ ‘സഹോദരന്മാർ’ എന്നു പറയുന്നത് സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള സഹവിശ്വാസികളെ വിശാലമായി സൂചിപ്പിക്കാം; ഗ്രീക്കിൽ പുല്ലിംഗ ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: στολὴ λευκή
  choice: വെള്ള അങ്കി
  rationale: στολή നീണ്ട പുറംവസ്ത്രത്തെയോ അങ്കിയെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ദർശനസന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണ് ‘അങ്കി’.
- source_word: ἑκάστῳ
  choice: അവരിൽ ഓരോരുത്തർക്കും ഓരോ
  rationale: ഗ്രീക്കിലെ വിതരണാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ഓരോ വ്യക്തിക്കും പ്രത്യേകം അങ്കി ലഭിച്ചതായി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐρρέθη αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: അജ്ഞാത കർത്താവുള്ള ഗ്രീക്ക് കർമണിപ്രയോഗത്തിന്റെ അർഥം കർത്താവിനെ ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: കുറച്ചുകാലംകൂടി വിശ്രമിക്കണം
  rationale: ἀναπαύωയുടെ ‘വിശ്രമിക്കുക’ എന്ന അർഥവും ἔτι χρόνον μικρόν എന്ന കാലപരമായ ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: πληρωθῶσιν
  choice: പൂർത്തിയാകുന്നതുവരെ
  rationale: ‘എണ്ണം’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത പദം ചേർക്കാതെ, ‘പൂർത്തിയാകുക/നിറവേറുക’ എന്ന വിശാലമായ കർമണി ആശയം നിലനിർത്തുന്നു.
- source_word: σύνδουλοι
  choice: സഹദാസന്മാർ
  rationale: ഒരേ യജമാനനു കീഴിലുള്ളവരെന്ന σύνδουλος എന്ന പദത്തിന്റെ ബന്ധാർഥം ‘സഹ-’ എന്ന ഘടകത്തിലൂടെ നിലനിർത്തുന്നു; ‘ദാസൻ’ ഈ മതസാഹിത്യ രജിസ്റ്ററിൽ അടിമത്തബന്ധവും സേവനവും ഒരുമിച്ച് സൂചിപ്പിക്കാൻ കഴിയും.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാർ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനം പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു; വിശാലമായ വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μέλλοντες ἀποκτέννεσθαι
  choice: കൊല്ലപ്പെടാനിരിക്കുന്ന
  rationale: സംഭവിക്കാനിരിക്കുന്നതെന്ന μέλλωയുടെ ഭാവാർഥവും ἀποκτέννεσθαιയുടെ കർമണിരൂപവും സൂക്ഷിക്കുന്നു; ‘വിധിക്കപ്പെട്ട’ എന്ന കൂടുതൽ നിർണയവാദപരമായ ആശയം ചേർക്കുന്നില്ല.
- source_word: ὡς καὶ αὐτοί
  choice: അവരെപ്പോലെതന്നെ
  rationale: ബലിപീഠത്തിനടിയിലെ ആത്മാക്കൾ കൊല്ലപ്പെട്ടതുമായി ചെയ്യുന്ന താരതമ്യം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
theological_decisions:
- issue: πληρωθῶσιν എന്നതിന്റെ അർഥം
  choice: ‘പൂർത്തിയാകുന്നതുവരെ’ എന്നു പൊതുവായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘അവരുടെ പൂർണ്ണസംഖ്യ തികയുന്നതുവരെ’ അല്ലെങ്കിൽ ‘നിറവേറുന്നതുവരെ’
  rationale: മൂലഗ്രീക്കിൽ ‘എണ്ണം’ എന്ന നാമം വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ സംഖ്യ പൂർത്തിയാകുന്നതെന്ന സാദ്ധ്യമായ അർഥം അടിക്കുറിപ്പിൽ അറിയിച്ചുകൊണ്ട് പ്രധാനവാചകത്തിൽ യഥാർഥമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: ἀδελφοί മിശ്രലിംഗ വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കാനുള്ള സാദ്ധ്യത
  choice: പ്രധാനവാചകത്തിൽ ‘സഹോദരന്മാർ’
  alternative: ‘സഹോദരീസഹോദരന്മാർ’ അല്ലെങ്കിൽ ‘സഹവിശ്വാസികൾ’
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗരൂപം സംരക്ഷിക്കുന്നു; എന്നാൽ ആ പ്രയോഗത്തിൽ സ്ത്രീകളും ഉൾപ്പെടാമെന്ന ഭാഷാപരമായ സാദ്ധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: σύνδουλοι എന്ന ദാസ്യപദം
  choice: ‘സഹദാസന്മാർ’
  alternative: ‘സഹശുശ്രൂഷകർ’ അല്ലെങ്കിൽ ‘സഹഅടിമകൾ’
  rationale: ഒരേ യജമാനനോടുള്ള അധീനതയും ചേർന്നുള്ള സേവനവും നിലനിർത്തുന്നു; ‘ശുശ്രൂഷകർ’ മാത്രം ഉപയോഗിച്ചാൽ അധീനബന്ധം മങ്ങാം, ‘അടിമകൾ’ ഈ രജിസ്റ്ററിൽ അനാവശ്യമായി കഠിനമായി കേൾക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്ത് രജിസ്റ്റർ. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാള വാക്യങ്ങളാക്കി; ആശയബന്ധവും ഭാവാർഥവും സംരക്ഷിച്ചു.
