id: REV.6.17
reference: Revelation 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: ml
  text: കാരണം, അവരുടെ ക്രോധത്തിന്റെ മഹാദിവസം വന്നെത്തിയിരിക്കുന്നു[a]; ആർക്ക് നിലനിൽക്കാൻ കഴിയും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില വ്യാഖ്യാനപരമായ പരിഭാഷകളിൽ ‘അവന്റെ ക്രോധം’ എന്നു കാണുന്നു; എന്നാൽ ഗ്രീക്കിൽ ‘അവരുടെ ക്രോധം’ എന്നാണ്. ഇത് സിംഹാസനത്തിൽ ഇരിക്കുന്നവനെയും കുഞ്ഞാടിനെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച ഭീതിയുടെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ, ആധുനിക മലയാളത്തിൽ വ്യക്തമായ കാരണബന്ധകമായ ‘കാരണം’ തിരഞ്ഞെടുത്തു.
- source_word: ἦλθεν
  choice: വന്നെത്തിയിരിക്കുന്നു
  rationale: സംഭവം ഇപ്പോൾ യാഥാർഥ്യമായതും അതിന്റെ ഫലം നിലവിൽ അനുഭവപ്പെടുന്നതുമായ അർഥബലം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: മഹാദിവസം
  rationale: ഗൗരവവും അന്ത്യകാലപരമായ ഭാവവും നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്കിലെ വിശേഷണപ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: τῆς ὀργῆς
  choice: ക്രോധത്തിന്റെ
  rationale: വിധിന്യായസന്ദർഭത്തിലെ ὀργήയുടെ ശക്തമായ ദൈവിക ന്യായവിധിഭാവം ‘കോപം’ എന്നതിനെക്കാൾ വ്യക്തമായി ‘ക്രോധം’ നൽകുന്നു.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: ഗ്രീക്കിലെ ബഹുവചന സർവനാമം മുൻവാക്യത്തിലെ സിംഹാസനത്തിൽ ഇരിക്കുന്നവനെയും കുഞ്ഞാടിനെയും സൂചിപ്പിക്കുന്നു; അതിലെ വ്യാകരണപരവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കം മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: τίς
  choice: ആർക്ക്
  rationale: ശേഷിയെക്കുറിച്ചുള്ള അലങ്കാരപ്രശ്നം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘ആർക്ക്’ യോജിക്കുന്നു.
- source_word: δύναται
  choice: കഴിയും
  rationale: ശേഷിയെയും പ്രാപ്തിയെയും നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: σταθῆναι
  choice: നിലനിൽക്കാൻ
  rationale: ἵστημι എന്ന പദത്തിന്റെ ‘നിൽക്കുക’ എന്ന അടിസ്ഥാനാർഥത്തോടൊപ്പം ന്യായവിധിയുടെ മുമ്പിൽ താങ്ങിനിൽക്കുക എന്ന സന്ദർഭാർഥവും അനാവശ്യമായ വിശദീകരണമില്ലാതെ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ‘ക്രോധം’ എന്നതിനോടു ചേർന്ന ബഹുവചന സർവനാമം സിംഹാസനത്തിൽ ഇരിക്കുന്നവനെയും കുഞ്ഞാടിനെയും സൂചിപ്പിക്കുന്നത്
  choice: ‘അവരുടെ ക്രോധം’ എന്ന ബഹുവചനപ്രയോഗം നിലനിർത്തുക
  alternative: ഏക ദൈവിക പ്രവർത്തനത്തോട് യോജിപ്പിച്ച് ‘അവന്റെ ക്രോധം’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: ഗ്രീക്ക് പാഠം αὐτῶν (‘അവരുടെ’) എന്നാണ് വ്യക്തമായി വായിക്കുന്നത്; അത് മുൻവാക്യത്തിൽ പറയുന്ന രണ്ടു വ്യക്തികളെ സൂചിപ്പിക്കുന്നു. അതിനാൽ വ്യാകരണപരവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കം വ്യാഖ്യാനത്തിലൂടെ ഇല്ലാതാക്കാതെ പാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘വന്നെത്തിയിരിക്കുന്നു’, ‘മഹാദിവസം’, ‘നിലനിൽക്കാൻ’ എന്നീ പ്രയോഗങ്ങൾ വെളിപ്പാടുസാഹിത്യത്തിന്റെ ഗാംഭീര്യം നിലനിർത്തുന്നു; ബഹുവചനമായ ‘അവരുടെ’ മൂലപാഠത്തിലെ ഉദ്ദേശപൂർവമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
