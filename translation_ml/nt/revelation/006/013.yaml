id: REV.6.13
reference: Revelation 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες τοῦ οὐρανοῦ ἔπεσαν εἰς τὴν γῆν, ὡς συκῆ ⸀βάλλει τοὺς ὀλύνθους αὐτῆς ὑπὸ ἀνέμου μεγάλου σειομένη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: ml
  text: ആകാശത്തിലെ നക്ഷത്രങ്ങൾ, ശക്തമായ കാറ്റിനാൽ കുലുങ്ങുന്ന അത്തിവൃക്ഷം അതിന്റെ പാകമെത്താത്ത അത്തിപ്പഴങ്ങൾ[a] പൊഴിക്കുന്നതുപോലെ, ഭൂമിയിലേക്കു വീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശീതകാല അത്തിപ്പഴങ്ങൾ,’ ‘പച്ച അത്തിപ്പഴങ്ങൾ,’ അല്ലെങ്കിൽ ‘വൈകിയ അത്തിപ്പഴങ്ങൾ’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് പദം പാകമെത്തുംമുമ്പ് കുലുക്കത്തിൽ കൊഴിഞ്ഞുപോകുന്ന അപക്വ അത്തിപ്പഴങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες
  choice: നക്ഷത്രങ്ങൾ
  rationale: പദത്തിന്റെ സാധാരണ അർത്ഥവും വെളിപ്പാടിലെ ദൃശ്യബിംബവും നിലനിർത്തുന്നു; പ്രതീകാത്മക അർത്ഥം മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുന്നില്ല.
- source_word: τοῦ οὐρανοῦ
  choice: ആകാശത്തിലെ
  rationale: οὐρανός എന്ന പദത്തിന് ‘ആകാശം’ എന്നും ‘സ്വർഗം’ എന്നും അർത്ഥമാകാം. നക്ഷത്രങ്ങൾ വീഴുന്ന ദൃശ്യത്തിൽ ‘ആകാശത്തിലെ’ എന്നത് സ്വാഭാവികവും മഹാപ്രപഞ്ചസംബന്ധിയായ ഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: ഭൂമിയിലേക്കു വീണു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ഭൂമിയിലേക്കുള്ള ചലനം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς
  choice: പോലെ
  rationale: തുടർന്നുവരുന്ന ഉപമയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: συκῆ
  choice: അത്തിവൃക്ഷം
  rationale: അത്തിമരത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ കൃത്യവും മാന്യവുമായ സാധാരണ മലയാളരൂപം.
- source_word: βάλλει
  choice: പൊഴിക്കുന്നു
  rationale: βάλλω എന്നതിന് അക്ഷരാർഥത്തിൽ ‘എറിയുന്നു’ എന്നാകാമെങ്കിലും, വൃക്ഷത്തിൽനിന്നു കായ്കൾ വീഴുന്ന സന്ദർഭത്തിൽ ‘പൊഴിക്കുന്നു’ എന്നതാണ് സ്വാഭാവികം.
- source_word: ὀλύνθους
  choice: പാകമാകാത്ത അത്തിപ്പഴങ്ങൾ
  rationale: പാകമെത്തുന്നതിനുമുമ്പ് കൊഴിഞ്ഞുപോകുന്ന അത്തിപ്പഴങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് ഏറ്റവും വ്യക്തമായ രൂപമാണിത്. മറ്റ് സാദ്ധ്യമായ അർത്ഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: ശക്തമായ കാറ്റിൽ
  rationale: കാറ്റിന്റെ പ്രബലതയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: σειομένη
  choice: കുലുങ്ങുന്ന
  rationale: അത്തിവൃക്ഷത്തെ വിശേഷിപ്പിക്കുന്ന വർത്തമാനകാല കർമണി കൃദന്തരൂപത്തിന്റെ സാഹചര്യാർഥം സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: ആകാശത്തിലെ നക്ഷത്രങ്ങൾ ഭൂമിയിലേക്കു വീഴുന്ന അന്ത്യകാല ദൃശ്യബിംബം
  choice: ‘ആകാശത്തിലെ നക്ഷത്രങ്ങൾ ഭൂമിയിലേക്കു വീണു’ എന്ന മൂലപാഠത്തിലെ ദൃശ്യബിംബം അതേപടി നിലനിർത്തി.
  alternative: ‘നക്ഷത്രങ്ങൾ’ എന്നത് ദൂതന്മാരെയോ ഭരണാധികാരികളെയോ സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ ദൃശ്യത്തിന് പ്രതീകാത്മക അർത്ഥമുണ്ടാകാമെങ്കിലും, മൂലപാഠം ഇവിടെ അതു വിശദീകരിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനസാദ്ധ്യതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഭാഷയിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘അത്തിവൃക്ഷം’ എന്ന സാഹിത്യപരമായ രൂപത്തോടൊപ്പം ‘അത്തിപ്പഴങ്ങൾ’ എന്ന പൊതുവായി മനസ്സിലാകുന്ന പദം ഉപയോഗിച്ചു. വാക്യത്തിലെ മഹാപ്രപഞ്ചസംബന്ധിയായ ദൃശ്യവും ഉപമയുടെ സജീവതയും നിലനിർത്തി.
