  to: 'അവർ ഒരു പുതിയ പാട്ടു പാടുന്നു:


    “ചുരുൾ എടുക്കാനും അതിന്റെ മുദ്രകൾ തുറക്കാനും നീ യോഗ്യനാണ്; കാരണം, നീ അറുക്കപ്പെടുകയും നിന്റെ രക്തത്താൽ[b] എല്ലാ ഗോത്രത്തിലും ഭാഷയിലും ജനത്തിലും രാഷ്ട്രത്തിലും നിന്നുള്ള ആളുകളെ[c] ദൈവത്തിനായി[a] വിലയ്ക്കു വാങ്ങുകയും ചെയ്തിരിക്കുന്നു.”'
  rationale: The revision corrects the inaccurate c footnote by making the supplied object explicit as ‘ആളുകളെ’ and by anchoring the note to that actual word. It also joins the two Greek coordinated reasons in idiomatic Malayalam. No change is made to the verse's meaning, its sacrificial language, or the dative sense ‘for God.’
