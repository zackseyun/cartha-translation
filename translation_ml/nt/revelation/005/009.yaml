id: REV.5.9
reference: Revelation 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: ml
  text: 'അവർ ഒരു പുതിയ പാട്ടു പാടുന്നു:


    “ചുരുൾ എടുക്കാനും അതിന്റെ മുദ്രകൾ തുറക്കാനും നീ യോഗ്യനാണ്; കാരണം, നീ അറുക്കപ്പെടുകയും നിന്റെ രക്തത്താൽ[b] എല്ലാ ഗോത്രത്തിലും ഭാഷയിലും ജനത്തിലും രാഷ്ട്രത്തിലും നിന്നുള്ള ആളുകളെ[c] ദൈവത്തിനായി[a] വിലയ്ക്കു വാങ്ങുകയും ചെയ്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവത്തിന്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ രക്തംകൊണ്ട്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ‘ആളുകളെ’ എന്ന കർമം ഗ്രീക്കിൽ തുറന്നുപറഞ്ഞിട്ടില്ല; വാക്യത്തിൽ സൂചിതമായ കർമം വ്യക്തമാക്കാൻ ചേർത്തതാണ്.
    reason: translation_clarity
lexical_decisions:
- source_word: ᾄδουσιν
  choice: പാടുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ സജീവമായ ആഖ്യാനഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ᾠδὴν καινὴν
  choice: ഒരു പുതിയ പാട്ട്
  rationale: ബൈബിളിലെ ‘പുതിയ പാട്ട്’ എന്ന ആശയം നേരായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: Ἄξιος εἶ
  choice: നീ യോഗ്യനാണ്
  rationale: നേരിട്ടുള്ള സ്തുതിവാക്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸ βιβλίον
  choice: ചുരുൾ
  rationale: മുദ്രകളിട്ട പുരാതന എഴുത്തുരേഖയുടെ രൂപം ‘പുസ്തകം’ എന്നതിനെക്കാൾ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: അതിന്റെ മുദ്രകൾ തുറക്കാൻ
  rationale: ഗ്രീക്കിലെ ‘മുദ്രകൾ തുറക്കുക’ എന്ന സംക്ഷിപ്ത പ്രയോഗം വ്യാഖ്യാനിച്ച് ‘പൊട്ടിക്കുക’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἐσφάγης
  choice: നീ അറുക്കപ്പെട്ടു
  rationale: σφάζω എന്ന പദത്തിലെ ഹിംസാത്മകവും യാഗസംബന്ധവുമായ ഭാവം ‘കൊല്ലപ്പെട്ടു’ എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἠγόρασας
  choice: വിലയ്ക്കു വാങ്ങി
  rationale: ക്രിയയുടെ അടിസ്ഥാനമായ വാങ്ങൽസംബന്ധമായ അർഥം വ്യക്തമാക്കുന്നു; വ്യാഖ്യാനപരമായ ‘വീണ്ടെടുത്തു’ എന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിനായി
  rationale: വാങ്ങപ്പെട്ടവർ ദൈവത്തിനുള്ളവരാകുന്നു എന്ന ദാതൃകാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ദൈവത്തിന്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐν τῷ αἵματί σου
  choice: നിന്റെ രക്തത്താൽ
  rationale: ἐν എന്നതിന്റെ ഉപകരണാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും മൂലത്തിലെ രക്തസംബന്ധമായ യാഗഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: എല്ലാ ഗോത്രത്തിലും ഭാഷയിലും ജനത്തിലും രാഷ്ട്രത്തിലും നിന്നുള്ളവരെ
  rationale: ἐκ πάσης എന്നത് പട്ടികയിലെ നാലു ഘടകങ്ങളോടും ബന്ധപ്പെടുത്തി ലോകവ്യാപകമായ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘വിലയ്ക്കു വാങ്ങി’ എന്ന ക്രിയയുടെ കർമം ഗ്രീക്ക് വാക്യത്തിൽ തുറന്നുപറഞ്ഞിട്ടില്ല
  choice: സന്ദർഭത്തിൽ സൂചിതമായ മനുഷ്യരെ ‘ഉള്ളവരെ’ എന്നു ചേർത്തു
  alternative: കർമം പറയാതെ ‘എല്ലാ ഗോത്രത്തിലും ... നിന്നും ദൈവത്തിനായി വിലയ്ക്കു വാങ്ങി’ എന്നു നൽകുക
  rationale: മലയാളവാക്യത്തിന്റെ വ്യക്തതയ്ക്കായി സൂചിതമായ കർമം ആവശ്യമാണ്. ‘ഉള്ളവരെ’ എന്ന പൊതുപ്രയോഗം സന്ദർഭം വ്യക്തമാക്കുന്നു; വാങ്ങപ്പെട്ടവരുടെ സ്വഭാവത്തെക്കുറിച്ച് കൂടുതൽ സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: ἐν τῷ αἵματί σου എന്ന പ്രായശ്ചിത്തസംബന്ധമായ ഭാഷ
  choice: ‘നിന്റെ രക്തത്താൽ’ എന്ന ദൃശ്യവും യാഗസംബന്ധവുമായ ഭാഷ നിലനിർത്തി
  alternative: ‘നിന്റെ മരണത്താൽ’ എന്നു പരാവർത്തനം ചെയ്യുക
  rationale: വാക്യം വാങ്ങലിന്റെ മാർഗമായി കുഞ്ഞാടിന്റെ രക്തത്തെ തന്നെയാണ് പറയുന്നത്. അതിനെ പൊതുവായ മരണഭാഷയായി ലഘൂകരിക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ തീവ്രത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘അറുക്കപ്പെട്ടു,’ ‘രക്തത്താൽ,’ ‘വിലയ്ക്കു വാങ്ങി’ എന്നീ മൂലത്തിലെ ശക്തമായ ദൃശ്യങ്ങൾ മൃദൂകരിച്ചിട്ടില്ല. കവിതാസ്വഭാവം നിലനിർത്താൻ പാട്ട് പ്രത്യേകം ഉദ്ധരണിയായി ക്രമപ്പെടുത്തി.
