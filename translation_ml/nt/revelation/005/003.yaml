id: REV.5.3
reference: Revelation 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: ml
  text: സ്വർഗത്തിലോ ഭൂമിയിലോ ഭൂമിക്കടിയിലോ ഉള്ള ആർക്കും ആ ചുരുൾ തുറക്കാനോ അതിനെ നോക്കാനോ കഴിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുസ്തകം.” ഗ്രീക്ക് പദത്തിന് പൊതുവേ ഒരു എഴുത്തുരേഖയെ സൂചിപ്പിക്കാനാകും; എന്നാൽ ഈ ദർശനസന്ദർഭത്തിൽ “ചുരുൾ” എന്നതാണ് പുരാതന ദൃശ്യത്തിന് കൂടുതൽ യോജിച്ചത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: ആർക്കും ... കഴിഞ്ഞില്ല
  rationale: ഗ്രീക്കിലെ സർവവ്യാപക നിഷേധത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ നിഷേധക്രിയാസംയോജനത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: ἐδύνατο
  choice: കഴിഞ്ഞില്ല
  rationale: ഭൂതകാല വിവരണത്തിൽ കഴിവില്ലായ്മ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: ഏകവചനത്തിലുള്ള ഗ്രീക്ക് സ്ഥലസൂചനയും വെളിപ്പാടിലെ പ്രപഞ്ചപരമായ ഭാഷയും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: ἐπί + genitive സൂചിപ്പിക്കുന്ന സ്ഥാനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑποκάτω τῆς γῆς
  choice: ഭൂമിക്കടിയിൽ
  rationale: സ്വർഗം, ഭൂമി, ഭൂമിക്കടിയിൽ എന്ന ത്രിതല പ്രപഞ്ചചിത്രണം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀνοῖξαι
  choice: തുറക്കാൻ
  rationale: കഴിവിനെ സൂചിപ്പിക്കുന്ന ക്രിയയോടു ചേർന്ന ഗ്രീക്ക് infinitive-ന്റെ ലളിതമായ മലയാളരൂപം.
- source_word: τὸ βιβλίον
  choice: ആ ചുരുൾ
  rationale: ദർശനത്തിലെ പുരാതന എഴുത്തുരേഖയ്ക്ക് ചുരുൾ എന്നതാണ് ഏറ്റവും യോജിച്ച ദൃശ്യസൂചന; നിർദിഷ്ടതയ്ക്കായി 'ആ' ചേർത്തിരിക്കുന്നു.
- source_word: οὔτε βλέπειν αὐτό
  choice: അതിലേക്കു നോക്കാനോ
  rationale: രണ്ടാമത്തെ നിഷേധിത infinitive-നെ സമാന്തരമായി അവതരിപ്പിക്കുന്നു; βλέπειν ഇവിടെ വെറും കാണുക എന്നതിലുപരി അതിലേക്കു നോക്കുക എന്ന ആശയത്തിന് യോജിക്കുന്നു. മൂലത്തിൽ ഇല്ലാത്ത 'പോലും' ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ചുരുൾ തുറക്കാൻ കഴിയാത്തവരുടെ പ്രപഞ്ചവ്യാപക പരിധി
  choice: “സ്വർഗത്തിലോ ഭൂമിയിലോ ഭൂമിക്കടിയിലോ” എന്ന ത്രിതല സ്ഥലഭാഷ നിലനിർത്തി.
  alternative: “സൃഷ്ടിയിൽ എവിടെയും” എന്ന പൊതുവായ പരാവർത്തനം.
  rationale: പരമ്പരാഗത പ്രപഞ്ചത്രയത്തിലൂടെ വാക്യം സർവത്രയുമുള്ള അശക്തിയെ ഊന്നിപ്പറയുന്നു. ദൃശ്യഭാഷ അതേപടി നിലനിർത്തുന്നത് വെളിപ്പാടിന്റെ ദർശനാത്മക സ്വഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. 'ഉള്ള' എന്നത് മൂന്ന് സ്ഥലസൂചനകളെയും 'ആർക്കും' എന്നതോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; പ്രപഞ്ചത്രയവും രണ്ട് infinitive-കളുടെ സമാന്തരതയും സംരക്ഷിച്ചിരിക്കുന്നു.
