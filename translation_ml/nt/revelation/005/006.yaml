id: REV.5.6
reference: Revelation 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: ml
  text: ഞാൻ സിംഹാസനത്തിന്റെയും നാലു ജീവികളുടെയും നടുവിലും, മൂപ്പന്മാരുടെ നടുവിലും, അറുക്കപ്പെട്ടതുപോലെ[a] നിൽക്കുന്ന, ഏഴ് കൊമ്പുകളും ഏഴ് കണ്ണുകളുമുള്ള ഒരു കുഞ്ഞാടിനെ കണ്ടു. ആ ഏഴ് കണ്ണുകൾ[b] ഭൂമി മുഴുവനിലേക്കും അയയ്ക്കപ്പെട്ടിരിക്കുന്ന ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കളാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അറുക്കപ്പെട്ട നിലയിൽ.’ ഗ്രീക്ക് ക്രിയാരൂപം അറുക്കൽ നടന്നുകഴിഞ്ഞതും അതിന്റെ ഫലം നിലനിൽക്കുന്നതും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കൾ’ എന്ന പ്രയോഗം മൂലപാഠത്തിലുള്ളതുപോലെ നിലനിർത്തിയിരിക്കുന്നു. ചിലർ ഇതിനെ പരിശുദ്ധാത്മാവിന്റെ ഏഴിരട്ടി പൂർണതയെ സൂചിപ്പിക്കുന്ന പ്രതീകമായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ ... καὶ ... ἐν μέσῳ
  choice: '... നടുവിലും ... നടുവിലും'
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള സ്ഥലസൂചന നിലനിർത്തുകയും ദർശനത്തിലെ പാളികളുള്ള ദൃശ്യക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ζῴων
  choice: ജീവികൾ
  rationale: ഇവ സാധാരണ മൃഗങ്ങളല്ല, സിംഹാസനത്തെ ചുറ്റിയുള്ള ജീവസത്തകളാണ്; ‘ജീവികൾ’ വെളിപ്പാട് സാഹിത്യത്തിന്റെ പശ്ചാത്തലത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πρεσβυτέρων
  choice: മൂപ്പന്മാർ
  rationale: സ്വർഗീയസഭയിലെ അംഗീകൃത കൂട്ടത്തെയോ സ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്ന പതിവ് മലയാള പദം.
- source_word: ἀρνίον
  choice: കുഞ്ഞാട്
  rationale: ബലിയുടെയും മശീഹയുടെയും പ്രതീകം നിലനിർത്തുന്നു; ഗ്രീക്ക് രൂപത്തിലെ ചെറുപ്പസൂചനയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἑστηκὸς
  choice: നിൽക്കുന്ന
  rationale: പൂർണ്ണകാല പങ്കാളിക്രിയ കുഞ്ഞാടിനെ നിലകൊള്ളുന്ന അവസ്ഥയിൽ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിൽക്കുന്ന’ ദൃശ്യം സജീവമായി നിലനിർത്തുന്നു.
- source_word: ὡς ἐσφαγμένον
  choice: അറുക്കപ്പെട്ടതുപോലെ
  rationale: ὡς എന്ന താരതമ്യഭാവവും അറുക്കൽ പൂർത്തിയായിട്ടും അതിന്റെ അടയാളം നിലനിൽക്കുന്ന വിരോധാഭാസവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: അതിന് ഏഴ് കൊമ്പുകളും ഏഴ് കണ്ണുകളും ഉണ്ടായിരുന്നു
  rationale: പ്രതീകങ്ങളെ വ്യാഖ്യാനിച്ച് മാറ്റാതെ അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വിവരണശൈലിക്കായി പങ്കാളിക്രിയയെ സമാപികാക്രിയയാക്കുന്നു.
- source_word: οἵ εἰσιν
  choice: ആ കണ്ണുകൾ ... ആണ്
  rationale: ഏറ്റവും അടുത്തതും സന്ദർഭപരമായി യോജിച്ചതുമായ മുൻപദമായ ‘ഏഴ് കണ്ണുകൾ’ എന്നതുമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കൾ
  rationale: വിവാദവിധേയമായ ദൈവശാസ്ത്രപ്രതീകത്തെ ‘ഏഴുവിധമായ ആത്മാവ്’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: ഭൂമി മുഴുവനിലേക്കും അയയ്ക്കപ്പെട്ട
  rationale: നിഷ്ക്രിയ ബഹുവചന പങ്കാളിക്രിയയും ദൗത്യത്തിന്റെ വ്യാപ്തിയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കൾ’ എന്ന് തിരിച്ചറിയപ്പെടുന്നതിന്റെ മുൻപദം
  choice: ആപേക്ഷിക ഉപവാക്യം കുഞ്ഞാടിന്റെ ഏഴ് കണ്ണുകളെയാണ് ‘ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കൾ’ എന്ന് തിരിച്ചറിയുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: കൊമ്പുകളെയും കണ്ണുകളെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നതായി കൂടുതൽ അയഞ്ഞ രീതിയിൽ മനസ്സിലാക്കാം.
  rationale: വ്യാകരണത്തിലും സെഖര്യാവിലെ കണ്ണുകളുടെ പ്രതീകവുമായുള്ള ബന്ധത്തിലും ഏറ്റവും അടുത്ത മുൻപദം ‘ഏഴ് കണ്ണുകൾ’ ആണ്. എങ്കിലും അടിക്കുറിപ്പ് ചിത്രഭാഷയുടെ വ്യാഖ്യാനപരമായ സ്വഭാവം അംഗീകരിക്കുന്നു.
- issue: ‘ദൈവത്തിന്റെ ഏഴ് ആത്മാക്കൾ’ എന്ന പ്രയോഗം
  choice: ഗ്രീക്കിലെ ബഹുവചനരൂപം അതേപടി നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റെ ഏഴുവിധമായ ആത്മാവ്’ അല്ലെങ്കിൽ ‘ഏഴിരട്ടി പൂർണതയിലുള്ള ദൈവാത്മാവ്’ എന്ന് വ്യാഖ്യാനിക്കാം.
  rationale: മൂലപാഠം തന്നെ ‘ഏഴ് ആത്മാക്കൾ’ എന്നു പറയുന്നു. പരിശുദ്ധാത്മാവിന്റെ ഏഴിരട്ടി പൂർണതയെന്ന സാദ്ധ്യമായ അർഥം നിഷേധിക്കാതെയും അതിനെ പരിഭാഷയിൽ നിർബന്ധിക്കാതെയും ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വെളിപ്പാട് സാഹിത്യത്തിന്റെ ദൃശ്യപ്രതീകങ്ങൾ വിശദീകരിച്ച് മാറ്റാതെ നിലനിർത്തി; ആവർത്തിച്ചുള്ള ‘നടുവിൽ’ എന്ന ഘടനയും ദൈവശാസ്ത്രപരമായി വിവാദമായ ബഹുവചനമായ ‘ഏഴ് ആത്മാക്കൾ’ എന്ന പ്രയോഗവും സംരക്ഷിച്ചു.
