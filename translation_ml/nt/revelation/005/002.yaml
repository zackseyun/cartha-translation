  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄγγελον ἰσχυρὸν κηρύσσοντα ἐν φωνῇ μεγάλῃ· Τίς ⸀ἄξιος ἀνοῖξαι τὸ βιβλίον καὶ λῦσαι τὰς σφραγῖδας αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: ml
  text: 'ഞാൻ ശക്തനായ ഒരു ദൂതൻ ഉച്ചത്തിൽ പ്രഖ്യാപിക്കുന്നതു കണ്ടു: “ചുരുൾ[a] തുറക്കാനും അതിന്റെ മുദ്രകൾ പൊട്ടിക്കാനും യോഗ്യൻ ആർ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പുസ്തകം.” ഗ്രീക്ക് βιβλίον എന്ന പദത്തിന് പൊതുവേ എഴുതപ്പെട്ട രേഖ എന്ന അർഥവുമുണ്ട്; എന്നാൽ ഒന്നിലധികം മുദ്രകളുള്ള വസ്തുവെന്ന ഈ സന്ദർഭത്തിൽ “ചുരുൾ” കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: ശക്തനായ ഒരു ദൂതൻ
  rationale: ἰσχυρός ശക്തിയെയും പ്രാബല്യത്തെയും സൂചിപ്പിക്കുന്നു. ‘ശക്തനായ’ എന്നത് ആ അർഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: κηρύσσοντα
  choice: വിളിച്ചുപറയുന്നതു
  rationale: κηρύσσω പരസ്യമായും അധികാരപൂർവമായും പ്രഖ്യാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഉച്ചസ്വരത്തിലുള്ള ഈ പ്രഖ്യാപനത്തിന് ‘വിളിച്ചുപറയുക’ സ്വാഭാവികമാണ്.
- source_word: ἐν φωνῇ μεγάλῃ
  choice: ഉച്ചസ്വരത്തിൽ
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം ഉച്ചത്തിലും ശക്തമായും സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഉച്ചസ്വരത്തിൽ’ ആ ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: Τίς ἄξιος
  choice: യോഗ്യൻ ആർ
  rationale: ἄξιος ഒരു ഗൗരവമേറിയ പ്രവൃത്തി നിർവഹിക്കാനുള്ള യോഗ്യതയെയോ അർഹതയെയോ സൂചിപ്പിക്കുന്നു. ‘യോഗ്യൻ’ ഈ സന്ദർഭത്തിലെ അർഥവും ദൈവശാസ്ത്രപരമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: ചുരുൾ തുറക്കാൻ
  rationale: βιβλίον പൊതുവേ എഴുതപ്പെട്ട രേഖയെയോ പുസ്തകത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും, അനേകം മുദ്രകളുള്ള വസ്തുവെന്ന ഈ ദൃശ്യത്തിൽ പുരാതന ചുരുൾ തന്നെയാണ് ഏറ്റവും സ്വാഭാവികം.
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: അതിന്റെ മുദ്രകൾ പൊട്ടിക്കാൻ
  rationale: λύω അഴിക്കുക, വിടുവിക്കുക എന്ന അടിസ്ഥാനാർഥമുള്ളതാണെങ്കിലും മുദ്രകളോടൊപ്പം അവ നീക്കി ചുരുൾ തുറക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മുദ്രകൾ പൊട്ടിക്കുക’ ദൃശ്യത്തിന്റെ മൂർത്തത നിലനിർത്തുന്നു.
theological_decisions:
- issue: സിംഹാസനമുറിയിലെ ദർശനത്തിൽ βιβλίον എന്നതിന്റെ വിവർത്തനം
  choice: ചുരുൾ
  alternative: പുസ്തകം
  rationale: ഒന്നിലധികം മുദ്രകളാൽ അടച്ചിരിക്കുന്ന എഴുതപ്പെട്ട വസ്തുവെന്ന ദൃശ്യവും ഒന്നാം നൂറ്റാണ്ടിലെ ചരിത്രപരമായ പശ്ചാത്തലവും പരിഗണിക്കുമ്പോൾ ‘ചുരുൾ’ കൂടുതൽ യോജിക്കുന്നു. ഇത് ഉപദേശപരമായ വ്യാഖ്യാനമല്ല, പദപരവും ചരിത്രപരവുമായ തീരുമാനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ശൈലി. വാക്യത്തിലെ ദർശനാത്മക ഭാവവും പൊതുപ്രഖ്യാപനത്തിന്റെ ശക്തിയും നിലനിർത്തി. ‘ചുരുൾ’ എന്ന തിരഞ്ഞെടുപ്പ് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേകം അടിക്കുറിപ്പ് ആവശ്യമില്ല.
