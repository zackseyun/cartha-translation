revisions:
- from: 'അപ്പോൾ ശക്തനായ ഒരു ദൂതൻ ഉച്ചസ്വരത്തിൽ ഇങ്ങനെ വിളിച്ചുപറയുന്നതു ഞാൻ കണ്ടു: “ചുരുൾ തുറക്കാനും അതിന്റെ മുദ്രകൾ പൊട്ടിക്കാനും യോഗ്യൻ ആർ?”'
  to: 'ഞാൻ ശക്തനായ ഒരു ദൂതൻ ഉച്ചത്തിൽ പ്രഖ്യാപിക്കുന്നതു കണ്ടു: “ചുരുൾ[a] തുറക്കാനും അതിന്റെ മുദ്രകൾ പൊട്ടിക്കാനും യോഗ്യൻ ആർ?”'
