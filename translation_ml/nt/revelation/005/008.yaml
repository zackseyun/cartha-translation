id: REV.5.8
reference: Revelation 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: ml
  text: അവൻ ചുരുൾ എടുത്തപ്പോൾ, നാല് ജീവികളും ഇരുപത്തിനാല് മൂപ്പന്മാരും കുഞ്ഞാടിന്റെ മുമ്പിൽ വീണു. ഓരോരുത്തരും ഒരു കിന്നരവും[a] ധൂപം നിറഞ്ഞ പൊൻപാത്രങ്ങളും കൈയിൽ പിടിച്ചിരുന്നു. അവ[c] വിശുദ്ധരുടെ[b] പ്രാർത്ഥനകളാകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ലൈയർ’—പുരാതന തന്ത്രിവാദ്യം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിശുദ്ധജനങ്ങളുടെ’.
    reason: lexical_alternative
  - marker: c
    text: ‘അവ’ എന്നത് ഗ്രീക്കിൽ വ്യാകരണപരമായി പൊൻപാത്രങ്ങളോടാണ് യോജിക്കുന്നത്; ദർശനചിത്രത്തിൽ പാത്രങ്ങളിലെ ധൂപവും പ്രാർത്ഥനകളുമായി അടുത്ത് ബന്ധിപ്പിക്കപ്പെട്ടിരിക്കുന്നു.
    reason: source_ambiguity
lexical_decisions:
- source_word: βιβλίον
  choice: ചുരുൾ
  rationale: പുരാതനകാലത്തെ ചുരുട്ടിവെച്ച എഴുത്തുരേഖയെയാണ് ഈ ദർശനസന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ആധുനിക രൂപത്തിലുള്ള ‘പുസ്തകം’ എന്നതിനെക്കാൾ ‘ചുരുൾ’ ദൃശ്യത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ζῷα
  choice: ജീവികൾ
  rationale: സിംഹാസനത്തിനു ചുറ്റുമുള്ള സ്വർഗീയ ജീവികളെയാണ് സൂചിപ്പിക്കുന്നത്; നിന്ദാസൂചനയുള്ള ‘മൃഗങ്ങൾ’ ഒഴിവാക്കി മൂലപദത്തിന്റെ ജീവസത്ത നിലനിർത്തുന്നു.
- source_word: πρεσβύτεροι
  choice: മൂപ്പന്മാർ
  rationale: ഇരുപത്തിനാല് സ്വർഗീയ മൂപ്പന്മാരെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; പിൽക്കാല സഭാപദവി അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἀρνίου
  choice: കുഞ്ഞാട്
  rationale: വെളിപ്പാടിലെ സ്ഥിരമായ ക്രിസ്തുസംബന്ധിയായ സ്ഥാനപ്പേരിന്റെ അർഥവും യാഗസംബന്ധിയായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: κιθάραν
  choice: കിന്നരം
  rationale: പുരാതന തന്ത്രിവാദ്യത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വേദപാരമ്പര്യത്തിൽ പരിചിതവുമായ പദം; കൃത്യമായ വാദ്യരൂപം അനിശ്ചിതമായതിനാൽ ‘വീണ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: φιάλας χρυσᾶς
  choice: പൊൻപാത്രങ്ങൾ
  rationale: φιάλη എന്നത് വീതിയേറിയതോ ആഴം കുറഞ്ഞതോ ആയ പാത്രമാണ്; ‘കുപ്പികൾ’ എന്ന തെറ്റായ ആധുനിക ചിത്രം ഒഴിവാക്കുന്നു.
- source_word: γεμούσας θυμιαμάτων
  choice: ധൂപം നിറഞ്ഞ
  rationale: മലയാളത്തിൽ ധൂപത്തെ ദ്രവ്യനാമമായി ഏകവചനത്തിൽ പറയുന്നത് സ്വാഭാവികമാണ്; പാത്രങ്ങൾ നിറഞ്ഞിരിക്കുന്ന ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: αἱ προσευχαὶ τῶν ἁγίων
  choice: വിശുദ്ധരുടെ പ്രാർഥനകൾ
  rationale: ἅγιοι എന്നത് ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്നു; പിൽക്കാലത്ത് ഔദ്യോഗികമായി വിശുദ്ധരായി പ്രഖ്യാപിക്കപ്പെട്ടവരിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പൊൻപാത്രങ്ങൾ/ധൂപം പ്രാർഥനകളായി തിരിച്ചറിയപ്പെടുന്നത്
  choice: ‘അവ വിശുദ്ധരുടെ പ്രാർഥനകളാകുന്നു’ എന്ന് നേരിട്ടുള്ള സമവാക്യരൂപത്തിൽ വിവർത്തനം ചെയ്തു.
  alternative: ‘അവ വിശുദ്ധരുടെ പ്രാർഥനകളെ പ്രതിനിധീകരിക്കുന്നു’
  rationale: മൂലപാഠത്തിലെ αἵ εἰσιν എന്ന നേരിട്ടുള്ള തിരിച്ചറിയൽ മൃദുവാക്കി വ്യാഖ്യാനിക്കുന്നില്ല. αἵ എന്ന സ്ത്രീലിംഗ ബഹുവചന സർവനാമം വ്യാകരണപരമായി φιάλας (‘പാത്രങ്ങൾ’) എന്നതിനോടാണ് യോജിക്കുന്നത്; എന്നാൽ ദർശനചിത്രം പാത്രങ്ങളിലെ ധൂപത്തെയും പ്രാർഥനകളെയും അടുത്ത് ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘അവ’ ഈ പാഠപരമായ സംഘർഷം അകാലത്തിൽ തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- issue: ἅγιοι എന്ന പദത്തിന്റെ പരിധി
  choice: വിശുദ്ധർ
  alternative: വിശുദ്ധജനങ്ങൾ / ദൈവത്തിന്റെ ജനം
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ വിശുദ്ധി-സംബന്ധിയായ അർഥം നിലനിർത്തുന്നു; ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിലെ ഔദ്യോഗിക പദവിയിലേക്ക് അത് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ആദ്യത്തെ ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി. ‘കിന്നരം’, ‘കുഞ്ഞാട്’, ‘മൂപ്പന്മാർ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കി. നൽകിയ ഇംഗ്ലീഷ് പാളിയിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവയുടെ യഥാർഥ പദങ്ങളോട് പൊരുത്തപ്പെട്ടിരുന്നില്ല; അതിനാൽ മലയാളത്തിൽ [a] ‘കിന്നരം’ എന്നതിനും [b] ‘വിശുദ്ധരുടെ’ എന്നതിനും ചേർത്തു.
