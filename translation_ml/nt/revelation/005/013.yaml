id: REV.5.13
reference: Revelation 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: ml
  text: 'സ്വർഗത്തിലും ഭൂമിയിലും ഭൂമിക്കടിയിലും സമുദ്രത്തിന്മേലും ഉള്ള സൃഷ്ടിക്കപ്പെട്ട സകലത്തെയും, അവയിൽ ഉള്ള സകലത്തെയും, ഇങ്ങനെ പറയുന്നതായി ഞാൻ കേട്ടു: “സിംഹാസനത്തിൽ ഇരിക്കുന്നവനും കുഞ്ഞാടിനും അനുഗ്രഹവും ബഹുമാനവും മഹത്ത്വവും ആധിപത്യവും എന്നെന്നേക്കും ഉണ്ടായിരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: സകല സൃഷ്ടജീവികളും
  rationale: κτίσμα സൃഷ്ടിക്കപ്പെട്ട ജീവിയെയോ വസ്തുവെയോ സൂചിപ്പിക്കാം. ഇവിടെ ശബ്ദത്തോടെ സ്തുതിക്കുന്നവരായതിനാൽ ‘സൃഷ്ടജീവികൾ’ സ്വാഭാവികമാണ്; πᾶν എന്നതിന്റെ സമഗ്രത ‘സകല’ നിലനിർത്തുന്നു.
- source_word: ὃ ἐν τῷ οὐρανῷ ... καὶ τὰ ἐν αὐτοῖς πάντα
  choice: സ്വർഗത്തിലും ഭൂമിയിലും ഭൂമിക്കടിയിലും സമുദ്രത്തിന്മേലുമുള്ള ... അവയിലെ സകലവും
  rationale: സൃഷ്ടിയുടെ എല്ലാ മണ്ഡലങ്ങളെയും ഉൾക്കൊള്ളുന്ന പരമ്പരയും αὐτοῖς എന്നതിന്റെ കൂട്ടായ പരാമർശവും കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἤκουσα λέγοντας
  choice: ഇങ്ങനെ പറയുന്നതു ഞാൻ കേട്ടു
  rationale: കൂട്ടമായ സൃഷ്ടജീവികളെ അർത്ഥാനുസൃതമായി സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയുടെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്നവനും
  rationale: വർത്തമാന പങ്കാളിക്രിയയുടെ നിലനിൽക്കുന്ന പ്രവൃത്തി സ്വാഭാവികവും ആദരപൂർവവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τῷ ἀρνίῳ
  choice: കുഞ്ഞാടിനും
  rationale: വെളിപ്പാടിലെ സ്ഥിരമായ ക്രിസ്തുശീർഷകവും ബലിയർപ്പണസംബന്ധമായ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: ἡ εὐλογία
  choice: സ്തുതി
  rationale: ദൈവസ്തുതിപരമായ ഈ സന്ദർഭത്തിൽ εὐλογία അർപ്പിക്കപ്പെടുന്ന പ്രശംസയെ സൂചിപ്പിക്കുന്നു; ‘അനുഗ്രഹം’ എന്നത് മലയാളത്തിൽ ലഭിക്കുന്ന അനുഗ്രഹമായി തെറ്റിദ്ധരിക്കപ്പെടാൻ ഇടയുള്ളതിനാൽ ‘സ്തുതി’ കൂടുതൽ വ്യക്തമാണ്.
- source_word: ἡ τιμή
  choice: ബഹുമാനം
  rationale: അർപ്പിക്കപ്പെടുന്ന ആദരത്തെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἡ δόξα
  choice: മഹത്ത്വം
  rationale: ആരാധനാസന്ദർഭത്തിലെ δόξαയുടെ തേജസ്സും ഉന്നതതയും സൂചിപ്പിക്കുന്ന സ്ഥാപിത മലയാള പദമാണ്.
- source_word: τὸ κράτος
  choice: ആധിപത്യം
  rationale: പ്രകടമായ ശക്തിയോടുകൂടിയ ഭരണാധികാരത്തിന്റെ ആശയം രാജകീയ സ്തുതിസന്ദർഭത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിനും കുഞ്ഞാടിനും ഒരുമിച്ച് അർപ്പിക്കുന്ന സ്തുതി
  choice: ‘സിംഹാസനത്തിൽ ഇരിക്കുന്നവനും കുഞ്ഞാടിനും ... ഉണ്ടായിരിക്കട്ടെ’ എന്ന ഏക സംയുക്ത സ്തുതിവാക്യമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഓരോ സ്വീകർത്താവിനുമായി ക്രിയ ആവർത്തിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം ഇരുവർക്കും ഒരേ സ്തുതിഘടകങ്ങൾ സംയുക്തമായി അർപ്പിക്കുന്നു; വിശദീകരണപരമായ ദൈവശാസ്ത്രവികാസമില്ലാതെ അതേ സമാന്തരത നിലനിർത്തുന്നു.
- issue: κτίσμα എന്നതിന്റെ പരാമർശം
  choice: ശബ്ദത്തോടെ സ്തുതിക്കുന്നവരെന്ന സന്ദർഭബോധം മുൻനിർത്തി ‘സകല സൃഷ്ടജീവികളും’ ഉപയോഗിച്ചു.
  alternative: ‘സകല സൃഷ്ടിയും’ അല്ലെങ്കിൽ ‘സൃഷ്ടിക്കപ്പെട്ട സകലതും’.
  rationale: വ്യക്തിപരമായി സംസാരിക്കുന്നവരുടെ ഭാവം വ്യക്തമാക്കുമ്പോഴും സാർവത്രിക വ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർവവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ സർവസൃഷ്ടിപരമായ പട്ടികയും ഏകീകൃത സ്തുതിഘടനയും നിലനിർത്തി; വിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
