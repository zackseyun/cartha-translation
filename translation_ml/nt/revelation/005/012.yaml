id: REV.5.12
reference: Revelation 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: ml
  text: 'അവർ ഉച്ചസ്വരത്തിൽ പറഞ്ഞു: “അറുക്കപ്പെട്ട കുഞ്ഞാട്[a] ശക്തിയും സമ്പത്തും[b] ജ്ഞാനവും ബലവും[c] ബഹുമാനവും മഹത്ത്വവും അനുഗ്രഹവും സ്വീകരിക്കാൻ യോഗ്യൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “കൊല്ലപ്പെട്ട കുഞ്ഞാട്.” “അറുക്കപ്പെട്ട” എന്നത് ഗ്രീക്കിലെ പദത്തിന്റെ ബലിപരവും കൂടുതൽ ദൃശ്യവുമായ ഭാവം നിലനിർത്തുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഐശ്വര്യം.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “കരുത്ത്.” മുമ്പുള്ള “ശക്തി”യിൽനിന്ന് ഗ്രീക്കിലെ രണ്ടു പദങ്ങളെയും വേർതിരിച്ചുകാട്ടാൻ ഇവിടെ “ബലം” ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: അവർ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ സ്വർഗീയ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ സമാപികാക്രിയയായി നൽകി; ഘോഷത്തിന്റെ നേരിട്ടുള്ള ഉദ്ധരണിയിലേക്കുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: φωνῇ μεγάλῃ
  choice: ഉച്ചസ്വരത്തിൽ
  rationale: ‘വലിയ ശബ്ദത്തോടെ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം; കേൾക്കാവുന്ന ഉച്ചതയും കൂട്ടായ പ്രഖ്യാപനത്തിന്റെ ഗാംഭീര്യവും സൂക്ഷിക്കുന്നു.
- source_word: Ἄξιόν ἐστιν
  choice: യോഗ്യൻ
  rationale: കർതൃസ്ഥാനത്തുള്ള കുഞ്ഞാടിന്റെ വ്യക്തിപരമായ ശീർഷകപ്രയോഗത്തോട് ഒത്തുപോകുന്ന ലിംഗരൂപം; സ്വീകരിക്കാൻ അർഹനാണെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τὸ ἀρνίον
  choice: കുഞ്ഞാട്
  rationale: വെളിപ്പാടിലെ യേശുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ക്രിസ്തുശീർഷകം; സന്ദർഭം തന്നെയാണ് ശീർഷകസ്വഭാവം വ്യക്തമാക്കുന്നത്.
- source_word: τὸ ἐσφαγμένον
  choice: അറുക്കപ്പെട്ട
  rationale: σφάζω എന്ന പദത്തിന്റെ ബലിപരവും ഹിംസാത്മകവുമായ ദൃശ്യത ‘കൊല്ലപ്പെട്ട’ എന്ന പൊതുപദത്തേക്കാൾ കൃത്യമായി നിലനിർത്തുന്നു; perfect passive-ന്റെ സംഭവിച്ച മരണവും തുടരുന്ന അവസ്ഥയും ഈ കൃദന്തരൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: λαβεῖν
  choice: സ്വീകരിക്കാൻ
  rationale: ഇവിടെ ആരാധനാഗീതത്തിൽ കുഞ്ഞാടിന് ശക്തി മുതലായവ അർപ്പിക്കപ്പെടുന്നതാണ് ആശയം; ‘എടുക്കാൻ’ എന്നതിനെക്കാൾ ‘സ്വീകരിക്കാൻ’ സന്ദർഭോചിതം.
- source_word: δύναμιν
  choice: ശക്തി
  rationale: δύναμις എന്നതിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളസമം; ഏഴംഗ പട്ടികയിലെ ആദ്യ ഇനം.
- source_word: πλοῦτον
  choice: സമ്പത്ത്
  rationale: ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവും; വിഭവസമൃദ്ധിയുടെ ആശയം നൽകുന്നു.
- source_word: σοφίαν
  choice: ജ്ഞാനം
  rationale: ആരാധനാപരമായ ബൈബിൾഭാഷയിൽ σοφίαയുടെ സ്വാഭാവികവും പരിചിതവുമായ സമം.
- source_word: ἰσχὺν
  choice: ബലം
  rationale: മുൻപുള്ള δύναμις എന്ന ‘ശക്തി’യിൽനിന്ന് പദവൈവിധ്യം നിലനിർത്തിക്കൊണ്ട് ἰσχύς സൂചിപ്പിക്കുന്ന കരുത്ത് നൽകുന്നു.
- source_word: τιμὴν
  choice: ബഹുമാനം
  rationale: ആദരവും വിലമതിപ്പും അർപ്പിക്കുന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: δόξαν
  choice: മഹത്ത്വം
  rationale: δόξαയുടെ ആരാധനാപരമായ അർഥം സ്വാഭാവികമായി വഹിക്കുന്ന മലയാളപദം.
- source_word: εὐλογίαν
  choice: സ്തുതി
  rationale: ഈ സ്വർഗീയ സ്തുതിഗീതത്തിൽ εὐλογία എന്നത് ഉച്ചരിക്കപ്പെടുന്ന പുകഴ്ച/വാഴ്ത്തൽ എന്ന അർഥത്തിലാണ്; ‘അനുഗ്രഹം’ ഇവിടെ കുഞ്ഞാട് നൽകുന്നതല്ല, കുഞ്ഞാടിന് അർപ്പിക്കുന്ന പ്രശംസയാണ്.
theological_decisions:
- issue: കുഞ്ഞാട് എന്ന ക്രിസ്തുശീർഷകം
  choice: കുഞ്ഞാട്
  alternative: ആട്ടിൻകുട്ടി
  rationale: വെളിപ്പാടിന്റെ സന്ദർഭത്തിൽ ἀρνίον ഉയിർത്തെഴുന്നേറ്റെങ്കിലും അറുക്കപ്പെട്ട യേശുവിന്റെ സ്ഥിരമായ ശീർഷകമാണ്. ‘കുഞ്ഞാട്’ ശീർഷകത്തിന്റെ ഗാംഭീര്യവും ബലിചിത്രവും നിലനിർത്തുന്നു; അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ബലിമരണത്തിന്റെ ഭാഷ
  choice: അറുക്കപ്പെട്ട
  alternative: കൊല്ലപ്പെട്ട
  rationale: മൂലത്തിലെ σφάζω സാധാരണ മരണത്തേക്കാൾ അറുപ്പിനെയോ വധത്തെയോ ദൃശ്യമായി സൂചിപ്പിക്കുന്നു. ‘അറുക്കപ്പെട്ട’ ആ ഉദ്ദേശ്യപൂർവമായ ദൃശ്യത സംരക്ഷിക്കുന്നു; പ്രായശ്ചിത്തത്തിന്റെ പ്രത്യേക സിദ്ധാന്തരീതി വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: εὐλογίαയുടെ ആരാധനാപരമായ അർഥം
  choice: സ്തുതി
  alternative: അനുഗ്രഹം
  rationale: പട്ടിക മുഴുവനും കുഞ്ഞാട് സ്വീകരിക്കാൻ യോഗ്യനായ അർപ്പണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ εὐλογία ഇവിടെ അനുഗ്രഹം നൽകൽ എന്നതിലുപരി വാഴ്ത്തൽ/സ്തുതി എന്ന അർഥത്തിലാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗാംഭീര്യമുള്ളതുമായ ആരാധനാഭാഷ. ഏഴംഗ സ്തുതിപ്പട്ടികയുടെ താളവും δύναμις/ἰσχύς തമ്മിലുള്ള പദവ്യത്യാസവും സൂക്ഷിച്ചു. മുഖ്യവാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
