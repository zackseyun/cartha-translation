id: REV.5.10
reference: Revelation 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: ml
  text: നീ അവരെ നമ്മുടെ ദൈവത്തിനായി ഒരു രാജ്യവും[a] പുരോഹിതന്മാരും ആക്കി; അവർ ഭൂമിയിൽ വാഴുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ഒരു രാജ്യവും” എന്നതിനുപകരം “രാജാക്കന്മാരും” എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “അവർ ഭൂമിയിൽ വാഴുന്നു” എന്നതിനുപകരം “അവർ ഭൂമിയിൽ വാഴും” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: ആക്കി
  rationale: Aorist active indicative. ഗാനത്തിലെ ദൈവിക പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന ലളിതമായ ഭൂതകാലപ്രയോഗം.
- source_word: αὐτοὺς
  choice: അവരെ
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച വീണ്ടെടുക്കപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചന കർമസർവനാമം.
- source_word: τῷ θεῷ ἡμῶν
  choice: നമ്മുടെ ദൈവത്തിനായി
  rationale: ഈ ദത്തിവ് ദൈവത്തിനുവേണ്ടി അവരെ രാജ്യവും പുരോഹിതന്മാരുമാക്കി എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തിന്’ എന്നതിനെക്കാൾ ‘ദൈവത്തിനായി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: βασιλείαν
  choice: ഒരു രാജ്യം
  rationale: സ്വീകരിച്ച ഗ്രീക്ക് പാഠത്തിലെ ഏകവചന നാമത്തെ അതേപടി നിലനിർത്തുന്നു; വീണ്ടെടുക്കപ്പെട്ടവരെ കൂട്ടമായി ഒരു രാജ്യമായി രൂപപ്പെടുത്തിയെന്ന ആശയം നൽകുന്നു.
- source_word: ἱερεῖς
  choice: പുരോഹിതന്മാർ
  rationale: നാമത്തിന്റെ പതിവും വ്യക്തവുമായ മലയാള പരിഭാഷ; ‘രാജ്യം’ എന്നതിനോടൊപ്പം പുറപ്പാട് 19:6-നെയും വെളിപ്പാട് 1:6-നെയും അനുസ്മരിപ്പിക്കുന്നു.
- source_word: βασιλεύουσιν
  choice: വാഴുന്നു
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് രൂപം വർത്തമാനകാല active indicative ആണ്; അതിനാൽ ഭാവികാലമാക്കാതെ വർത്തമാനകാലമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: ἐπί + genitive ഇവിടെ സ്ഥലം സൂചിപ്പിക്കുന്നു. ‘ഭൂമിയുടെമേൽ ഭരിക്കുന്നു’ എന്ന വ്യാഖ്യാനഭാരം ചേർക്കാതെ നേരായ അർഥം നൽകുന്നു.
theological_decisions:
- issue: വീണ്ടെടുക്കപ്പെട്ടവരുടെ βασιλείαν എന്ന തിരിച്ചറിയൽ
  choice: ഒരു രാജ്യം
  alternative: രാജാക്കന്മാർ
  rationale: SBLGNT പാഠം βασιλείαν (‘രാജ്യം’) എന്നാണ് വായിക്കുന്നത്; βασιλεῖς (‘രാജാക്കന്മാർ’) എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: വിശുദ്ധരുടെ വാഴ്ചയുടെ കാലം
  choice: അവർ ഭൂമിയിൽ വാഴുന്നു
  alternative: അവർ ഭൂമിയിൽ വാഴും
  rationale: നൽകിയിരിക്കുന്ന βασιλεύουσιν വർത്തമാനകാലരൂപമാണ്. അതിനാൽ അന്ത്യകാലക്രമത്തെ മുൻകൂട്ടി തീർപ്പാക്കാതെ മുഖ്യപാഠം വർത്തമാനകാലം നിലനിർത്തുകയും ഭാവികാല പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാഗാനശൈലി. മുഖ്യപാഠത്തിൽ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും പ്രസക്തമായ പദങ്ങൾക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു. നൽകിയ ഗ്രീക്ക് പാഠത്തിലെ βασιλεύουσιν വർത്തമാനകാലമായതിനാൽ ഇംഗ്ലീഷ് ലെക്സിക്കൽ കുറിപ്പിലെ ‘future active indicative’ എന്ന വിവരണം പിന്തുടർന്നിട്ടില്ല.
