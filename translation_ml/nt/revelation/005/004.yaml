id: REV.5.4
reference: Revelation 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: ml
  text: ചുരുൾ തുറക്കാനോ അതിലേക്കു നോക്കാനോ യോഗ്യനായ ആരെയും കണ്ടെത്താതിരുന്നതിനാൽ ഞാൻ വളരെ കരഞ്ഞുകൊണ്ടിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുസ്തകം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് രണ്ടർത്ഥവും വരാം; എന്നാൽ പുരാതന എഴുത്തുവസ്തുവും ഈ ദൃശ്യവും കണക്കിലെടുക്കുമ്പോൾ “ചുരുൾ” കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അതിനുള്ളിലേക്കു നോക്കാനോ.” ഈ പ്രയോഗത്തിന് അതിലേക്കു നോക്കുക എന്നോ, സന്ദർഭത്തിൽ അതിന്റെ ഉള്ളടക്കം കാണുക എന്നോ അർത്ഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: ഞാൻ
  rationale: മുൻവാക്യത്തോടുള്ള καί-യുടെ ബന്ധം മലയാളത്തിലെ തുടർച്ചയിലും സന്ദർഭത്തിലും സ്വാഭാവികമായി പ്രകടമാകുന്നു; വേറിട്ട് ‘പിന്നെ’ എന്നു ചേർക്കുന്നത് കാലക്രമസൂചന അധികമായി നൽകും.
- source_word: ἔκλαιον
  choice: കരഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലരൂപം കഴിഞ്ഞകാലത്ത് തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം അനുയോജ്യം.
- source_word: πολύ
  choice: വളരെ
  rationale: കരച്ചിലിന്റെ തീവ്രതയെ മാത്രം വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഉച്ചത്തിൽ’ അല്ലെങ്കിൽ ‘കഠിനമായി’ എന്ന ഭാവം ചേർക്കുന്നില്ല.
- source_word: οὐδεὶς ἄξιος εὑρέθη
  choice: യോഗ്യനായി ആരെയും കണ്ടെത്താത്തതിനാൽ
  rationale: ‘യോഗ്യൻ’ എന്നത് ധാർമികവും സ്ഥാനപരവുമായ ഭാരമുള്ള ἄξιος-നെ നിലനിർത്തുന്നു; കണ്ടെത്തലിന്റെ ആശയം സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിലെ കാരണംസൂചക ഘടന സ്വാഭാവികമാക്കുന്നു.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: ചുരുൾ തുറക്കാൻ
  rationale: വെളിപ്പാടിലെ ദൃശ്യവും പുരാതന എഴുത്തുരൂപവും കണക്കിലെടുത്ത് βιβλίον ഇവിടെ ‘ചുരുൾ’ എന്നു നൽകുന്നു.
- source_word: οὔτε βλέπειν αὐτό
  choice: അതിലേക്കു നോക്കാനോ
  rationale: βλέπειν αὐτό എന്നതിന്റെ അടിസ്ഥാനമായ ‘അതിനെ/അതിലേക്കു നോക്കുക’ എന്ന അർത്ഥം നിലനിർത്തുന്നു; ഉള്ളടക്കം പരിശോധിക്കുക എന്ന കൂടുതൽ പ്രത്യേക അർത്ഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: സ്വർഗീയ സിംഹാസനദൃശ്യത്തിലെ ἄξιος എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: ‘യോഗ്യൻ’ എന്നു പരിഭാഷപ്പെടുത്തി അതിന്റെ ധാർമികവും ദൈവസന്നിധിയിലെ സ്ഥാനപരവുമായ ഭാരം നിലനിർത്തുക
  alternative: ‘കഴിവുള്ളവൻ’ അല്ലെങ്കിൽ ‘അർഹതയുള്ളവൻ’
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് വെറും പ്രവർത്തനശേഷിയല്ല; ദൈവിക ഉദ്ദേശ്യം നടപ്പാക്കാൻ ആവശ്യമായ യോഗ്യതയാണ്. എന്നാൽ വാചകത്തിൽ വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: വെളിപ്പാട് 5-ലെ βιβλίον-ന്റെ വസ്തുരൂപം
  choice: ‘ചുരുൾ’
  alternative: ‘പുസ്തകം’
  rationale: തുറക്കപ്പെടേണ്ട മുദ്രയിട്ട പുരാതന എഴുത്തുവസ്തുവെന്ന ദൃശ്യത്തിന് ‘ചുരുൾ’ കൂടുതൽ യോജിക്കുന്നു; ഇത് ഉപദേശപരമായ വികസനം അല്ല, സാംസ്കാരിക-ശബ്ദാർഥപരമായ തിരഞ്ഞെടുപ്പാണ്.
- issue: βλέπειν αὐτό എന്നതിന്റെ വ്യാപ്തി
  choice: ‘അതിലേക്കു നോക്കുക’ എന്ന അടിസ്ഥാന അർത്ഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തുക
  alternative: ‘അതിനുള്ളിലേക്കു നോക്കുക’ അല്ലെങ്കിൽ ‘അതിന്റെ ഉള്ളടക്കം പരിശോധിക്കുക’
  rationale: സന്ദർഭം ചുരുളിന്റെ ഉള്ളടക്കം കാണുന്നതിലേക്കു സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്ക് പ്രയോഗം അതിനെ നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല; അതിനാൽ യഥാർഥ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ച ‘കരഞ്ഞുകൊണ്ടിരുന്നു’ എന്നു പ്രകടിപ്പിച്ചു. ‘യോഗ്യൻ’ എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രഭാരം സംരക്ഷിച്ചു; βλέπειν എന്നതിലെ യഥാർഥ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി.
