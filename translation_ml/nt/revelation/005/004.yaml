  to: ചുരുൾ തുറക്കാനോ അതിലേക്കു നോക്കാനോ യോഗ്യനായ ആരെയും കണ്ടെത്താതിരുന്നതിനാൽ ഞാൻ വളരെ കരഞ്ഞുകൊണ്ടിരുന്നു.[a][b]
  rationale: 'A limited idiomatic revision clarifies the negative existential clause while retaining the source sequence and meaning: John’s sustained, intense weeping arose because no person was found worthy for either opening the scroll or looking at it. The footnote wording is lightly improved for natural Malayalam; the lexical ambiguity of βλέπειν remains preserved.'
