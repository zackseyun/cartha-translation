id: REV.5.14
reference: Revelation 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα ⸀ἔλεγον· Ἀμήν. καὶ οἱ πρεσβύτεροι ἔπεσαν καὶ προσεκύνησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: ml
  text: നാലു ജീവികളും, “ആമേൻ” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു. മൂപ്പന്മാർ വീണ് ആരാധിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികൾ ‘ആരാധിച്ചു’ എന്നതിനുശേഷം ‘എന്നെന്നേക്കും ജീവിക്കുന്നവനെ’ അല്ലെങ്കിൽ ‘അവനെ’ എന്നിങ്ങനെ വ്യക്തമായ ഒരു കർമം ചേർക്കുന്നു. കർമം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കാൻ വിടുന്ന ഹ്രസ്വമായ SBLGNT പാഠമാണ് മുഖ്യപാഠത്തിൽ പിന്തുടർന്നിരിക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: ജീവികൾ
  rationale: വെളിപ്പാടിലെ സിംഹാസനത്തിനുചുറ്റുമുള്ള സ്വർഗീയ ജീവികളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; മൃഗങ്ങൾ എന്ന പരിമിത അർഥം ഒഴിവാക്കുകയും യെഹെസ്കേലിന്റെ സിംഹാസനദർശനവുമായുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ അതിന്റെ കാലഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἀμήν
  choice: ആമേൻ
  rationale: ആരാധനാപരമായ അംഗീകാരവാക്യമായതിനാൽ പരിചിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: πρεσβύτεροι
  choice: മൂപ്പന്മാർ
  rationale: ഇവിടെ പ്രായത്തെ മാത്രം സൂചിപ്പിക്കാതെ സ്വർഗീയസഭയിലെ തിരിച്ചറിയപ്പെട്ട ഒരു സംഘത്തിന്റെ സ്ഥാനപ്പേരായാണ് പദം ഉപയോഗിച്ചിരിക്കുന്നത്.
- source_word: ἔπεσαν
  choice: വീണ്
  rationale: ആരാധനയിൽ ശരീരം താഴ്ത്തുന്ന പ്രവൃത്തി ലളിതമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: προσεκύνησαν
  choice: ആരാധിച്ചു
  rationale: സിംഹാസനമുറിയിലെ ഈ സന്ദർഭത്തിൽ പദം വെറും വണക്കം മാത്രമല്ല, ആരാധനാപരമായ ഭക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ആരാധനയുടെ കർമം ഗ്രീക്കിൽ വ്യക്തമാക്കാത്തത്
  choice: ആരാധിച്ചു എന്ന ക്രിയയ്ക്ക് വ്യക്തമായ കർമം ചേർക്കാതെ നിലനിർത്തി.
  alternative: അവനെ ആരാധിച്ചു / ദൈവത്തെ ആരാധിച്ചു / എന്നെന്നേക്കും ജീവിക്കുന്നവനെ ആരാധിച്ചു
  rationale: SBLGNT പാഠം καὶ προσεκύνησαν എന്നിടത്ത് അവസാനിക്കുന്നു; കർമം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുമെങ്കിലും വാക്യത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ മറ്റൊരു പാഠപാരമ്പര്യത്തിലെയോ സന്ദർഭവ്യാഖ്യാനത്തിലെയോ വാക്കുകൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ച ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ആരാധനയുടെ കർമം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
