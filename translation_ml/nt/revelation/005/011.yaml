id: REV.5.11
reference: Revelation 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: ml
  text: ഞാൻ നോക്കി[a], സിംഹാസനത്തിനും ജീവികൾക്കും മൂപ്പന്മാർക്കും ചുറ്റുമുള്ള അനേകം ദൂതന്മാരുടെ ശബ്ദവും കേട്ടു. അവരുടെ എണ്ണം പതിനായിരങ്ങളുടെ പതിനായിരങ്ങളും ആയിരങ്ങളുടെ ആയിരങ്ങളും[b] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ കണ്ടു.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ, “പതിനായിരങ്ങളുടെ പതിനായിരങ്ങളും ആയിരങ്ങളുടെ ആയിരങ്ങളും”; അതിവിപുലമായ ഒരു സമൂഹത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം. പകരമായി, “പതിനായിരം പതിനായിരങ്ങളും ആയിരം ആയിരങ്ങളും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: ഞാൻ നോക്കി
  rationale: ദർശനത്തിന്റെ തുടർച്ചയിൽ യോഹന്നാൻ ശ്രദ്ധ തിരിക്കുന്നതും തുടർന്ന് കേട്ടതു വിവരിക്കുന്നതുമായ ക്രമം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു. ‘ഞാൻ കണ്ടു’ എന്നും സാധ്യമാണ്.
- source_word: ἤκουσα
  choice: ഞാൻ കേട്ടു
  rationale: ആഖ്യാനത്തിലെ aorist രൂപത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: അനേകം ദൂതന്മാരുടെ ശബ്ദം
  rationale: φωνή എന്ന ഏകവചനത്തെ നിലനിർത്തുകയും genitive ഘടന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു; കൂട്ടമായുള്ള ഏകീകൃത ശബ്ദം എന്ന ആശയം നിർബന്ധമായി വിശദീകരിക്കുന്നില്ല.
- source_word: κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων
  choice: സിംഹാസനത്തിന്റെയും ജീവികളുടെയും മൂപ്പന്മാരുടെയും ചുറ്റും
  rationale: κύκλῳ എന്നതിന്റെ സ്ഥലസൂചനയും മൂന്ന് genitive ഘടകങ്ങളുടെ സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: ζῴων
  choice: ജീവികൾ
  rationale: വെളിപ്പാടിലെ സിംഹാസനദർശനവുമായി ബന്ധപ്പെട്ട പ്രത്യേക ജീവികളെ സൂചിപ്പിക്കുന്ന ലളിതവും മാന്യവുമായ പദം; സാധാരണ മൃഗങ്ങൾ എന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: πρεσβυτέρων
  choice: മൂപ്പന്മാർ
  rationale: വെളിപ്പാടിലെ πρεσβύτεροι എന്ന പദത്തിന് സ്ഥിരതയുള്ള, സ്വാഭാവിക മലയാള രൂപം.
- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: അവരുടെ എണ്ണം ... ആയിരുന്നു
  rationale: എണ്ണത്തെക്കുറിച്ചുള്ള ഗ്രീക്ക് വാക്യഭാഗം വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: μυριάδες μυριάδων
  choice: പതിനായിരം പതിനായിരങ്ങൾ
  rationale: μυριάς എന്ന പദത്തിന്റെ സംഖ്യാപരമായ അടിസ്ഥാനമൂല്യം നിലനിർത്തിക്കൊണ്ട് അതിവിപുലമായ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തനരീതി സംരക്ഷിക്കുന്നു.
- source_word: χιλιάδες χιλιάδων
  choice: ആയിരം ആയിരങ്ങൾ
  rationale: ഗ്രീക്കിലെ ആവർത്തിത സംഖ്യാഭാഷയുടെ ശൈലി ചുരുക്കാതെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: സിംഹാസനത്തിനു ചുറ്റുമുള്ള ζῷα എന്ന ദർശനജീവികളുടെ വിശേഷണം
  choice: ജീവികൾ
  alternative: ജീവജന്തുക്കൾ; ജീവസത്തകൾ
  rationale: ദർശനത്തിലെ പ്രത്യേക സത്തകളെ സാധാരണ മൃഗങ്ങളായി വ്യാഖ്യാനിക്കാതെയും അവരുടെ സ്വഭാവത്തെക്കുറിച്ച് അധിക തത്ത്വശാസ്ത്രപരമായ നിർവചനം ചേർക്കാതെയും മൂലപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- issue: വലിയ സംഖ്യയുടെ വ്യാഖ്യാനം
  choice: പതിനായിരം പതിനായിരങ്ങളും ആയിരം ആയിരങ്ങളും
  alternative: അസംഖ്യം; കോടാനുകോടി
  rationale: അളവറ്റ മഹാസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ദർശനാത്മക പ്രയോഗം കൃത്യമായ കണക്കായി അല്ലെങ്കിൽ ‘അസംഖ്യം’ എന്ന വ്യാഖ്യാനമായി ഒതുക്കാതെ മൂലരൂപത്തിലെ ഉദ്ദേശ്യപൂർവമായ ആവർത്തനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ദർശനാത്മക സംഖ്യാഭാഷയും വാക്യത്തിലെ ‘നോക്കി—കേട്ടു’ എന്ന പുരോഗതിയും സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
