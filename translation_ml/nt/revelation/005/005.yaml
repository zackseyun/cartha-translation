revisions:
- from: 'അപ്പോൾ മൂപ്പന്മാരിൽ ഒരാൾ എന്നോടു പറയുന്നു: “കരയേണ്ടാ. ഇതാ, യെഹൂദാഗോത്രത്തിൽനിന്നുള്ള സിംഹം, ദാവീദിന്റെ വേര്, ചുരുൾപുസ്തകവും അതിന്റെ ഏഴു മുദ്രകളും തുറക്കാൻ ജയം നേടിയിരിക്കുന്നു[a][b].”'
  to: 'അപ്പോൾ മൂപ്പന്മാരിൽ ഒരാൾ എന്നോടു പറയുന്നു: “കരയേണ്ടാ. ഇതാ, യെഹൂദായുടെ ഗോത്രത്തിൽനിന്നുള്ള സിംഹം, ദാവീദിന്റെ വേര്, ചുരുളും അതിന്റെ ഏഴു മുദ്രകളും തുറക്കാൻ ജയം നേടിയിരിക്കുന്നു[a][b].”'
  rationale: പരിഷ്കാരം അർത്ഥത്തിൽ മാറ്റം വരുത്തുന്നില്ല. βιβλίον-ന് ‘ചുരുൾ’ ഉപയോഗിച്ച് ചരിത്രസന്ദർഭവും സ്വാഭാവിക മലയാളവും മെച്ചപ്പെടുത്തി; യെഹൂദായുമായുള്ള ഗോത്രബന്ധം കൂടുതൽ വ്യക്തമായി രേഖപ്പെടുത്തി. ἀνοῖξαι-യുടെ ഉദ്ദേശം/ഫലം/യോഗ്യത സംബന്ധിച്ച വ്യാകരണതുറപ്പ് ‘തുറക്കാൻ’ എന്നതിലൂടെ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങളും അവയുടെ അർത്ഥങ്ങളും മാറ്റമില്ലാതെ സൂക്ഷിച്ചു.
