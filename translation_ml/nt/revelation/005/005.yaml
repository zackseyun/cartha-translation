id: REV.5.5
reference: Revelation 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: ml
  text: 'അപ്പോൾ മൂപ്പന്മാരിൽ ഒരാൾ എന്നോടു പറയുന്നു: “കരയേണ്ടാ. ഇതാ, യെഹൂദായുടെ ഗോത്രത്തിൽനിന്നുള്ള സിംഹം, ദാവീദിന്റെ വേര്, ചുരുളും അതിന്റെ ഏഴു മുദ്രകളും തുറക്കാൻ ജയം നേടിയിരിക്കുന്നു[a][b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജയം നേടിയിരിക്കുന്നു’ എന്നതിന് ‘ജയിച്ചിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ വെളിപ്പാടിൽ വിജയത്തെയും കീഴടക്കലിനെയും സൂചിപ്പിക്കുന്ന പ്രധാന പദമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘തുറക്കാൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് അനന്തക്രിയയെ ‘അങ്ങനെ തുറക്കാൻ കഴിയും’ എന്ന ഫലാർഥത്തിലും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: മൂപ്പന്മാർ
  rationale: വെളിപ്പാടിൽ ഇത് പ്രായത്തെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, സ്വർഗീയസഭയിലെ അംഗീകൃത വിഭാഗത്തിന്റെ പേരാണ്; ‘മൂപ്പന്മാർ’ ആ സ്ഥാനനാമം നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ആഖ്യാനവർത്തമാനകാലത്തിന്റെ സജീവതയും അടിയന്തരതയും നിലനിർത്തുന്നു.
- source_word: Μὴ κλαῖε
  choice: കരയേണ്ടാ
  rationale: κλαίω എന്നതിന്റെ കരച്ചിൽ/വിലാപം എന്ന ആശയം ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘കരച്ചിൽ നിർത്തുക’ എന്നും സന്ദർഭത്തിൽ സാധ്യമാണ്.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐνίκησεν
  choice: ജയം നേടിയിരിക്കുന്നു
  rationale: വെളിപ്പാടിലെ പ്രധാന νικάω വിജയപ്രമേയം നിലനിർത്തുന്നു; ‘ജയിച്ചിരിക്കുന്നു’ എന്നും സാധ്യമാണ്.
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: യെഹൂദാഗോത്രത്തിൽനിന്നുള്ള സിംഹം
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉത്ഭവം/ബന്ധം വ്യക്തമായി നിലനിർത്തുകയും മിശിഹായെ സൂചിപ്പിക്കുന്ന പ്രതീകാത്മക പദവി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἡ ῥίζα Δαυίδ
  choice: ദാവീദിന്റെ വേര്
  rationale: യെശയ്യാവിലെ പ്രതിധ്വനിയുള്ള മിശിഹാപദവി വിശദീകരണപരമായി മാറ്റാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀνοῖξαι
  choice: തുറക്കാൻ
  rationale: ഗ്രീക്ക് അനന്തക്രിയയെ ഔപചാരികമായി അടുത്തുനിൽക്കുന്ന രീതിയിൽ നൽകുന്നു; അത് ഉദ്ദേശമോ ഫലമോ യോഗ്യതയോ സൂചിപ്പിക്കാം എന്ന വ്യാകരണപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: τὸ βιβλίον
  choice: ചുരുൾപുസ്തകം
  rationale: സന്ദർഭത്തിലെ എഴുതപ്പെട്ട ചുരുളിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ ‘പുസ്തകം’ എന്നതിനെക്കാൾ ചരിത്രപരമായ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: σφραγῖδας
  choice: മുദ്രകൾ
  rationale: ചുരുൾ അടച്ചുറപ്പിക്കുന്ന σφραγίς-ന്റെ പതിവും വ്യക്തവുമായ മലയാളസമാനപദമാണ്.
- source_word: αὐτοῦ
  choice: അതിന്റെ
  rationale: നപുംസകലിംഗമായ βιβλίον-നെ സൂചിപ്പിക്കുന്ന സർവനാമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന് പ്രയോഗിക്കുന്ന രാജകീയ മിശിഹാപദവികൾ
  choice: ‘യെഹൂദാഗോത്രത്തിൽനിന്നുള്ള സിംഹം’, ‘ദാവീദിന്റെ വേര്’ എന്നീ രണ്ടു പദവികളും നേരിട്ട് നിലനിർത്തി.
  alternative: ഒന്നോ രണ്ടോ പദവികൾ വിശദീകരണപരമായി പരാവർത്തനം ചെയ്യുക.
  rationale: വാക്യം ഇസ്രായേലിന്റെ തിരുവെഴുത്തുകളിൽനിന്നുള്ള രാജകീയ-മിശിഹാ തിരിച്ചറിയലുകൾ ഒരുമിച്ച് നിരത്തുന്നു; അവയെ നേരിട്ട് നിലനിർത്തുന്നത് അധിക സിദ്ധാന്തവിവരണം ചേർക്കാതെ ക്രിസ്തുസംബന്ധമായ ശക്തി സംരക്ഷിക്കുന്നു.
- issue: ἐνίκησεν എന്നതിനുശേഷമുള്ള ἀνοῖξαι-യുടെ ബന്ധം
  choice: ‘ജയം നേടിയിരിക്കുന്നു, ... തുറക്കാൻ’ എന്ന ഗ്രീക്ക് അനന്തക്രിയയോട് അടുത്ത രൂപം ഉപയോഗിച്ചു.
  alternative: ‘തുറക്കാൻ കഴിയേണ്ടതിന് ജയം നേടിയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ജയിച്ചതിനാൽ തുറക്കാൻ കഴിയും’.
  rationale: അനന്തക്രിയ വിജയം തുറക്കലുമായി ബന്ധിപ്പിക്കുന്നു; എന്നാൽ ഉദ്ദേശം, ഫലം, അല്ലെങ്കിൽ ഫലപ്രദമായ യോഗ്യത എന്നിവയിൽ ഒന്ന് മാത്രം നിർബന്ധിച്ച് വ്യക്തമാക്കാതെ മൂലത്തിലെ അർത്ഥതുറപ്പ് സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ഒരുമിച്ച് ലക്ഷ്യമിട്ടു. ആഖ്യാനവർത്തമാനകാലമായ ‘പറയുന്നു’ നിലനിർത്തി. ‘സിംഹം’, ‘വേര്’ എന്നീ തിരുവെഴുത്തുപ്രതീകങ്ങൾ വിശദീകരിക്കാതെ സംരക്ഷിച്ചു; ‘ചുരുൾപുസ്തകം’ ചരിത്രസന്ദർഭം വ്യക്തമാക്കുന്നു.
