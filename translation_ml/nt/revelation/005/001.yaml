id: REV.5.1
reference: Revelation 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ⸀ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: ml
  text: സിംഹാസനത്തിൽ ഇരിക്കുന്നവന്റെ വലങ്കൈയിൽ, അകത്തും മറുവശത്തും എഴുതിയതും ഏഴു മുദ്രകളാൽ മുദ്രയിട്ടതുമായ ഒരു ചുരുൾ[a][b] ഞാൻ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഒരു പുസ്തകം.’ ഈ സന്ദർഭത്തിലെ ഗ്രീക്ക് പദമായ βιβλίον, കോഡെക്സ് രൂപത്തിലുള്ള പുസ്തകത്തേക്കാൾ ഒരു ചുരുളിനെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അകത്തും മറുവശത്തും എഴുതിയത്.’ ചിലർ രണ്ടാമത്തെ പ്രയോഗം പൊതുവായി ‘പുറത്തും’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ആഓറിസ്റ്റ് രൂപം ലളിതമായ ഭൂതകാല ആഖ്യാനമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπὶ τὴν δεξιὰν
  choice: വലങ്കൈയിൽ
  rationale: ἐπί അക്ഷരാർഥത്തിൽ ‘മേൽ’ എന്നാകാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ കൈയിലെ സ്ഥാനം അഥവാ കൈവശം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘വലങ്കൈയിൽ’ വ്യക്തമാക്കുന്നു.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്നവന്റെ
  rationale: ദൈവനാമം ചേർക്കാതെ ഗ്രീക്കിലെ വിവരണാത്മകമായ കൃദന്തരൂപം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: βιβλίον
  choice: ചുരുൾ
  rationale: ഒന്നാം നൂറ്റാണ്ടിലെ സന്ദർഭവും ഇരുവശത്തുമുള്ള എഴുത്തും മുദ്രകളും പരിഗണിക്കുമ്പോൾ കോഡെക്സ് രൂപത്തിലുള്ള പുസ്തകത്തേക്കാൾ ചുരുളാണ് സാധ്യതയേറിയത്.
- source_word: γεγραμμένον
  choice: എഴുതിയത്
  rationale: എഴുതപ്പെട്ട നിലയിൽ തുടരുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പൂർണ നിഷ്ക്രിയ കൃദന്തത്തെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: അകത്തും മറുവശത്തും
  rationale: ചുരുളിന്റെ അകത്തെ എഴുത്തുപ്രതലവും അതിന്റെ പിൻവശം അഥവാ മറുവശവും എന്ന ഭൗതിക ദൃശ്യം നിലനിർത്തുന്നു; പൊതുവായ ‘പുറത്തും’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: κατεσφραγισμένον
  choice: മുദ്രയിട്ടത്
  rationale: പൂർണ നിഷ്ക്രിയ കൃദന്തം സൂചിപ്പിക്കുന്ന പൂർത്തിയായ മുദ്രിതാവസ്ഥയെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: σφραγῖσιν ἑπτά
  choice: ഏഴു മുദ്രകളാൽ
  rationale: കരണമോ ഉപാധിയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ദത്തിവിനെ മലയാളത്തിലെ ‘-ആൽ’ രൂപം വ്യക്തമായി പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: സിംഹാസനസ്ഥനായ വ്യക്തിയുടെ പരാമർശം
  choice: സിംഹാസനത്തിൽ ഇരിക്കുന്നവൻ
  alternative: സിംഹാസനത്തിൽ ഇരിക്കുന്ന ദൈവം
  rationale: ഗ്രീക്ക് പാഠം വ്യക്തിയെ ദൈവനാമം ഉപയോഗിക്കാതെ വിവരണാത്മകമായി തിരിച്ചറിയുന്നു. അതിനാൽ കൂടുതൽ വ്യക്തമായ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘വലങ്കൈ’, ‘സിംഹാസനം’, ‘മുദ്ര’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ദുഷ്കരമായ പഴയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
