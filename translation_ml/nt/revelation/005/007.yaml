id: REV.5.7
reference: Revelation 5:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἦλθεν καὶ εἴληφεν ἐκ τῆς δεξιᾶς τοῦ καθημένου ἐπὶ τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/007.yaml
  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: ml
  text: അവൻ വന്ന് സിംഹാസനത്തിൽ ഇരിക്കുന്നവന്റെ വലങ്കൈയിൽനിന്ന് അത് എടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: വന്ന്
  rationale: ἔρχομαιയുടെ ഭൂതകാല ആഖ്യാനരൂപം ഇവിടെ കുഞ്ഞാടിന്റെ മുന്നോട്ടുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു. ‘വന്ന്’ എന്നത് മൂലത്തിലെ ലളിതമായ ചലനക്രിയയെ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘സമീപിച്ച്’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത വ്യാഖ്യാനനിറം കൂടും.
- source_word: εἴληφεν
  choice: എടുത്തു
  rationale: λαμβάνωയുടെ perfect രൂപമാണെങ്കിലും ദർശനാത്മക ആഖ്യാനത്തിലെ സംഭവക്രമം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ഭൂതകാലത്തിൽ നൽകാം. മുൻസന്ദർഭത്തിലെ ചുരുളാണ് സൂചിത കർമം; അതിനാൽ ‘അത്’ ചേർത്തിരിക്കുന്നു. ‘സ്വീകരിച്ചു’ എന്നതിനെക്കാൾ ‘എടുത്തു’ നേരിട്ടുള്ള പ്രവർത്തനത്തെ വ്യക്തമാക്കുന്നു.
- source_word: ἐκ
  choice: യിൽനിന്ന്
  rationale: ഉറവിടമോ ആരംഭസ്ഥാനമോ സൂചിപ്പിക്കുന്ന സാധാരണ സ്ഥാനാർഥമാണ്; മലയാളത്തിൽ ‘വലങ്കൈയിൽനിന്ന്’ സ്വാഭാവികമാണ്.
- source_word: τῆς δεξιᾶς
  choice: വലങ്കൈ
  rationale: ഈ ഘടനയിൽ δεξιά വലതുവശമെന്നതിലുപരി വലങ്കൈയെ സൂചിപ്പിക്കുന്നു. ദർശനത്തിലെ സാക്ഷാൽ ദൃശ്യബിംബം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: τοῦ καθημένου
  choice: ഇരിക്കുന്നവന്റെ
  rationale: κάθημαιയുടെ വർത്തമാന കൃദന്തരൂപം വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമപ്രയോഗമാണ്. ‘ഇരിക്കുന്നവൻ’ തുടരുന്ന അവസ്ഥയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τοῦ θρόνου
  choice: സിംഹാസനത്തിൽ
  rationale: ἐπί ഇവിടെ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. സിംഹാസനവുമായി ബന്ധപ്പെട്ട ഇരിപ്പിന് മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘സിംഹാസനത്തിൽ’ എന്നതാണ്.
theological_decisions:
- issue: εἴληφεν എന്ന ക്രിയയുടെ സൂചിത നേരിട്ടുള്ള കർമം
  choice: മുൻസന്ദർഭത്തിലെ ചുരുളിനെ സൂചിപ്പിച്ച് ‘അത്’ ചേർത്തു.
  alternative: ‘അവൻ വന്ന് ... വലങ്കൈയിൽനിന്ന് എടുത്തു’ എന്നിങ്ങനെ കർമം പറയാതിരിക്കുക.
  rationale: ഗ്രീക്കിൽ കർമം മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ വിട്ടിരിക്കുന്നു. മലയാളത്തിൽ ‘അത്’ ചേർക്കുന്നത് പുതിയ ആശയം കൂട്ടാതെ വാക്യത്തെ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- issue: സിംഹാസനസ്ഥനായ വ്യക്തിയുടെ വിവരണം
  choice: ‘സിംഹാസനത്തിൽ ഇരിക്കുന്നവൻ’
  alternative: ‘സിംഹാസനത്തിൽ ഇരുന്നവൻ’ അല്ലെങ്കിൽ വ്യക്തിയെ ദൈവം എന്നു നേരിട്ട് തിരിച്ചറിയിക്കൽ.
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന അവസ്ഥ സംരക്ഷിക്കുകയും കുഞ്ഞാടിനെയും സിംഹാസനസ്ഥനെയും വാചകത്തിൽ വേർതിരിക്കുകയും ചെയ്യുന്നു; മൂലത്തിൽ ഇല്ലാത്ത അധിക ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അനാവശ്യമായ പുരാതനശൈലിയും വിശദീകരണാത്മക കൂട്ടിച്ചേർക്കലുകളും ഒഴിവാക്കി.
