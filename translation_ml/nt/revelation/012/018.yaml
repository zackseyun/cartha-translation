  rationale: SBLGNT പാഠത്തിലെ ἐστάθη മൂന്നാംപുരുഷമാണ്; സന്ദർഭത്തിൽ അത് മഹാസർപ്പത്തെ സൂചിപ്പിക്കുന്നു. എന്നാൽ ഒന്നാംപുരുഷരൂപമായ ἐστάθην ഉള്ള കൈയെഴുത്തുപ്രതി പാരമ്പര്യം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
