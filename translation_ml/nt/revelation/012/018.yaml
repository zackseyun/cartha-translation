- source_word: ἐστάθη
  choice: അവൻ… നിന്നു
  rationale: SBLGNT-യിലെ മൂന്നാംപുരുഷ ഏകവചനരൂപം സന്ദർഭത്തിൽ മുൻവാക്യത്തിലെ മഹാസർപ്പത്തെ സൂചിപ്പിക്കുന്നു; കർത്താവ് മലയാളത്തിൽ വ്യക്തമായി ചേർത്തു.
- source_word: ἐπὶ
