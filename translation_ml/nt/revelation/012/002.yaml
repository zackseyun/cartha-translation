  text: καὶ ἐν γαστρὶ ἔχουσα· ⸂καὶ κράζει⸃ ὠδίνουσα καὶ βασανιζομένη τεκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/002.yaml
  text: And she was pregnant[a], and she cries out[c][b], suffering birth pains and being tormented to give birth.
translation:
  language: ml
  text: അവൾ ഗർഭിണിയായിരുന്നു[a]; പ്രസവവേദന അനുഭവിച്ചും പ്രസവിക്കാനുള്ള കഠിനയാതന അനുഭവിച്ചും അവൾ നിലവിളിക്കുന്നു[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഗർഭത്തിൽ ശിശുവുള്ളവളായിരുന്നു’; അക്ഷരാർഥത്തിൽ, ‘ഗർഭത്തിൽ ശിശുവിനെ ധരിച്ചവളായി.’
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രസവവേദന അനുഭവിച്ചും’ എന്നതിന് പകരം ‘പ്രസവത്തിലായിരിക്കെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘കഠിനയാതന അനുഭവിച്ചും’ എന്നതിന് പകരം ‘അതിവേദനയിലായും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: അവൾ ഗർഭിണിയായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഗർഭത്തിൽ ഉള്ളവളായി’ എന്ന ഗ്രീക്ക് പ്രയോഗം ഗർഭാവസ്ഥയെ സൂചിപ്പിക്കുന്ന സാധാരണ ശൈലിയാണ്; ആധുനിക മലയാളത്തിൽ ‘ഗർഭിണിയായിരുന്നു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: κράζει
  choice: അവൾ നിലവിളിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ ദൃശ്യസജീവത നിലനിർത്തുന്നു; പ്രസവവേദനയുടെ പശ്ചാത്തലത്തിൽ ഉച്ചത്തിലുള്ള വിളിയെ ‘നിലവിളിക്കുന്നു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὠδίνουσα
  choice: പ്രസവവേദന അനുഭവിച്ചും
  rationale: പ്രസവവുമായി ബന്ധപ്പെട്ട വേദനയെ വ്യക്തമായി നിലനിർത്തുന്നു; ‘പ്രസവത്തിലായിരിക്കെ’ എന്നതിനെക്കാൾ വേദനാചിത്രം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: βασανιζομένη
  choice: കഠിനയാതനയിൽപ്പെട്ടും
  rationale: നിഷ്ക്രിയരൂപത്തിലെ തീവ്രമായ പീഡാനുഭവം നിലനിർത്തുന്നു; മലയാളത്തിൽ ഈ പ്രസവസന്ദർഭത്തിന് ചേരുന്ന വിധത്തിൽ ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: τεκεῖν
  choice: പ്രസവിക്കാനുള്ള
  rationale: ശിശുവിനെ പ്രസവിക്കുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ ... καὶ
  choice: … അനുഭവിച്ചും … യാതനയിൽപ്പെട്ടും
  rationale: ആവർത്തിച്ചുള്ള ഗ്രീക്ക് സംയോജകങ്ങളുടെ സഞ്ചിതഭാവം മലയാളത്തിലെ സമാന്തര ‘-ഉം’ ഘടനയിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദർശനത്തിലെ സ്ത്രീയുടെ കഷ്ടതയുടെ തീവ്രതയും സ്വഭാവവും
  choice: βασανιζομένη എന്നതിനെ ശക്തമായി ‘കഠിനയാതനയിൽപ്പെട്ടും’ എന്നു പരിഭാഷപ്പെടുത്തി; സ്ത്രീയുടെ പ്രതീകാത്മക വ്യക്തിത്വം വ്യാഖ്യാനിക്കാതെ വിട്ടു.
  alternative: ‘അതിവേദനയിലായി’ അല്ലെങ്കിൽ ‘കഷ്ടപ്പെട്ട്’ എന്ന മൃദുവായ പരിഭാഷകൾ.
  rationale: വാക്യം കഷ്ടതയെ തീവ്രമായി ചിത്രീകരിക്കുന്നുവെങ്കിലും സ്ത്രീ ആരെ പ്രതിനിധീകരിക്കുന്നു എന്നു ഇവിടെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഗ്രീക്കിന്റെ ശക്തി സംരക്ഷിച്ചുകൊണ്ട് പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ദർശനസാഹിത്യത്തിന്റെ ഗൗരവവും ദൃശ്യസജീവതയും നിലനിർത്തുന്ന മലയാളം. ഗ്രീക്കിലെ വർത്തമാനകാലമായ κράζει ‘നിലവിളിക്കുന്നു’ എന്നു നിലനിർത്തി; പങ്കാളിക്രിയകളുടെ സഞ്ചിതഘടന മലയാളത്തിലെ ‘-ഉം’ സമാന്തരരൂപങ്ങളാൽ അവതരിപ്പിച്ചു.
