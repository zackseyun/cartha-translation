id: REV.12.4
reference: Revelation 12:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: ml
  text: അവന്റെ വാൽ ആകാശത്തിലെ നക്ഷത്രങ്ങളിൽ മൂന്നിലൊന്നിനെ വലിച്ചിഴക്കുന്നു; അവയെ ഭൂമിയിലേക്ക് എറിഞ്ഞുകളഞ്ഞു. പ്രസവിക്കാനിരുന്ന സ്ത്രീ പ്രസവിക്കുമ്പോൾ അവളുടെ കുഞ്ഞിനെ വിഴുങ്ങുന്നതിനായി മഹാസർപ്പം അവളുടെ മുമ്പിൽ നിന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύρει
  choice: വലിച്ചുകൊണ്ടിരുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള ക്രിയയുടെ ദൃശ്യാത്മകവും തുടരുന്നതുമായ ഭാവം നിലനിർത്തുന്നു; ‘തൂത്തുകളയുന്നു’ എന്നതിനെക്കാൾ മൂലപദത്തിലെ വലിച്ചിഴയ്ക്കൽ ആശയത്തോട് അടുത്തതാണ്.
- source_word: τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ
  choice: ആകാശത്തിലെ നക്ഷത്രങ്ങളിൽ മൂന്നിലൊന്ന്
  rationale: ഭാഗസൂചകമായ ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: ἔβαλεν
  choice: എറിഞ്ഞുകളഞ്ഞു
  rationale: മൂലത്തിലെ ഭൂതകാലമാറ്റം സംരക്ഷിക്കുകയും ശക്തമായ എറിയൽ/തള്ളിവീഴ്ത്തൽ അർഥം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: δράκων
  choice: മഹാസർപ്പം
  rationale: വെളിപ്പാടിലെ ഭീകരമായ ഡ്രാഗൺ രൂപത്തെ സാധാരണ മലയാള ബൈബിൾ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള പദത്തിൽ നൽകുന്നു; വെറും ‘സർപ്പം’ എന്നതിൽ നഷ്ടമാകാവുന്ന വലിപ്പവും ഭീകരതയും സൂചിപ്പിക്കുന്നു.
- source_word: καταφάγῃ
  choice: വിഴുങ്ങിക്കളയേണ്ടതിന്
  rationale: പൂർണമായി തിന്നുകളയുക/വിഴുങ്ങുക എന്ന ശക്തമായ അർഥവും ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആകാശനക്ഷത്രങ്ങളുടെ പ്രതീകാത്മക തിരിച്ചറിയൽ
  choice: ‘നക്ഷത്രങ്ങൾ’ എന്ന പ്രതീകം വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി
  alternative: ദൂതന്മാർ എന്നോ മറ്റൊരു ആത്മീയ വിഭാഗമെന്നോ വ്യക്തമാക്കുക
  rationale: വാക്യം തന്നെ നക്ഷത്രങ്ങളെ ആരെന്നു നിർവചിക്കുന്നില്ല; പ്രത്യേക വ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ പ്രതീകാത്മക അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
- issue: σύρει എന്ന വർത്തമാനകാലവും ἔβαλεν എന്ന ഭൂതകാലവും തമ്മിലുള്ള കാലഭേദം
  choice: ‘വലിച്ചുകൊണ്ടിരുന്നു; ... എറിഞ്ഞുകളഞ്ഞു’ എന്ന് കാലഭേദം നിലനിർത്തി
  alternative: രണ്ടു ക്രിയകളും ഒരേ വർത്തമാനകാലത്തിലോ ഭൂതകാലത്തിലോ ഏകീകരിക്കുക
  rationale: SBLGNT പാഠത്തിലെ ശ്രദ്ധേയമായ കാലമാറ്റം ശൈലിപരമായി അസമമായിരുന്നാലും മായ്ച്ചുകളയാതെ സംരക്ഷിക്കുന്നു.
- issue: സ്ത്രീ പ്രസവിക്കുമ്പോഴുള്ള മഹാസർപ്പത്തിന്റെ ഉദ്ദേശ്യം
  choice: കുഞ്ഞിനെ വിഴുങ്ങുക എന്ന ഉദ്ദേശ്യബന്ധം നേരിട്ട് നിലനിർത്തി
  alternative: സംഭവിക്കാനിരുന്ന ഫലമായി മൃദൂകരിക്കുക
  rationale: ἵναയും ഉപവാക്യത്തിലെ ക്രിയയും മഹാസർപ്പത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും ദൃശ്യാത്മകതയും പുലർത്തുന്ന മലയാളം. മൂലത്തിലെ അസാധാരണമായ വർത്തമാനകാലം–ഭൂതകാലം മാറൽ ബോധപൂർവം നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായി പ്രതീകങ്ങളെ വ്യാഖ്യാനിച്ചിട്ടില്ല.
