revisions:
- from: ആ മഹാസർപ്പം—പിശാച് എന്നും സാത്താൻ എന്നും വിളിക്കപ്പെടുന്ന, ലോകം മുഴുവനെയും വഴിതെറ്റിക്കുന്ന ആ പുരാതന പാമ്പ്[a]—ഭൂമിയിലേക്കു വലിച്ചെറിയപ്പെട്ടു[b]. അവനോടൊപ്പം അവന്റെ ദൂതന്മാരും വലിച്ചെറിയപ്പെട്ടു.
  to: ആ വലിയ മഹാവ്യാളി—പിശാച് എന്നും സാത്താൻ എന്നും വിളിക്കപ്പെടുന്ന, ലോകം മുഴുവനെയും വഴിതെറ്റിക്കുന്ന ആ പുരാതന പാമ്പ്[a]—ഭൂമിയിലേക്കു തള്ളിയിടപ്പെട്ടു[b]. അവന്റെ ദൂതന്മാരും അവനോടൊപ്പം തള്ളിയിടപ്പെട്ടു.
