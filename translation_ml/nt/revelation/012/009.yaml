id: REV.12.9
reference: Revelation 12:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: ml
  text: ആ വലിയ മഹാവ്യാളി—പിശാച് എന്നും സാത്താൻ എന്നും വിളിക്കപ്പെടുന്ന, ലോകം മുഴുവനെയും വഴിതെറ്റിക്കുന്ന ആ പുരാതന പാമ്പ്[a]—ഭൂമിയിലേക്കു തള്ളിയിടപ്പെട്ടു[b]. അവന്റെ ദൂതന്മാരും അവനോടൊപ്പം തള്ളിയിടപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ലോകം മുഴുവനെയും വഴിതെറ്റിക്കുന്ന” എന്നതിന് “അധിവസിക്കപ്പെടുന്ന ലോകം മുഴുവനെയും വഞ്ചിക്കുന്ന” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “പുരാതന പാമ്പ്” എന്ന പ്രയോഗം ഉല്പത്തി 3-ലെ പാമ്പിന്റെ ദൃശ്യത്തെ അനുസ്മരിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: വലിച്ചെറിയപ്പെട്ടു / വലിച്ചെറിയപ്പെട്ടു
  rationale: നിർബന്ധിതമായ പുറത്താക്കലിന്റെ ശക്തി നിലനിർത്തുകയും ഗ്രീക്കിലെ ക്രിയാപുനരാവർത്തനം മലയാളത്തിലും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: δράκων ὁ μέγας
  choice: ആ മഹാസർപ്പം
  rationale: വെളിപ്പാടിലെ ഭീകരമായ സർപ്പരൂപ ജീവിയെ സൂചിപ്പിക്കുന്ന δράκων എന്ന പദത്തിന് മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപം; തുടർന്നുള്ള ‘പാമ്പ്’ എന്ന വിശേഷണത്തിൽനിന്നും വേർതിരിക്കുന്നു.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: ആ പുരാതന പാമ്പ്
  rationale: ὄφις എന്നതിന്റെ സാധാരണ അർഥം ‘പാമ്പ്’; ἀρχαῖος പഴക്കവും ആദിമകാലബന്ധവും സൂചിപ്പിക്കുന്നു. ‘പുരാതന’ എന്നത് അതിനെ അതിവ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὁ καλούμενος
  choice: എന്നും ... എന്നും വിളിക്കപ്പെടുന്ന
  rationale: തിരിച്ചറിയിക്കുന്ന രണ്ടു പേരുകളെയും സ്വാഭാവികമായ മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: Διάβολος
  choice: പിശാച്
  rationale: ഇവിടെ പദം ‘അപവാദി’ എന്ന പൊതുവർണനയല്ല, അംഗീകൃതമായ പേരുപദവിയായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിലെ സ്ഥാപിതരൂപം ഉപയോഗിക്കുന്നു.
- source_word: Σατανᾶς
  choice: സാത്താൻ
  rationale: പേരിന്റെ മലയാള ലിപ്യന്തരണരൂപം നിലനിർത്തുന്നു; ‘എതിരാളി’ എന്നു വിവർത്തനം ചെയ്ത് വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ὁ πλανῶν
  choice: വഴിതെറ്റിക്കുന്ന
  rationale: πλανάω എന്നതിലെ വഞ്ചനയും തെറ്റായ വഴിയിലേക്കു നയിക്കലും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: τὴν οἰκουμένην ὅλην
  choice: ലോകം മുഴുവനെയും
  rationale: അധിവസിക്കപ്പെടുന്ന മുഴുവൻ ലോകം എന്ന വ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു; പരിമിതമായൊരു ദേശമായി ചുരുക്കുന്നില്ല.
- source_word: εἰς τὴν γῆν
  choice: ഭൂമിയിലേക്കു
  rationale: സ്വർഗീയ മേഖലയിലെ പുറത്താക്കലിനോടുള്ള ഭൗമിക വിരുദ്ധത സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: അവന്റെ ദൂതന്മാർ
  rationale: വെളിപ്പാടിന്റെ സന്ദർഭത്തിൽ അമാനുഷിക ദൂതജീവികളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ പതിവായ ബൈബിൾപദം ഉപയോഗിക്കുന്നു.
- source_word: μετ’ αὐτοῦ
  choice: അവനോടൊപ്പം
  rationale: കൂടെ പുറത്താക്കപ്പെട്ടുവെന്ന സഹഗമനബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: Διάβολος, Σατανᾶς എന്നീ പേരുപദവികളുടെ സമാനാധികരണബന്ധം
  choice: പിശാച് എന്നും സാത്താൻ എന്നും വിളിക്കപ്പെടുന്ന
  alternative: അപവാദി എന്നും എതിരാളി എന്നും വിളിക്കപ്പെടുന്ന
  rationale: ഗ്രീക്ക് വാക്യം മഹാസർപ്പത്തെ അംഗീകൃതമായ രണ്ടു പേരുകളാൽ തിരിച്ചറിയുന്നു. സ്ഥാപിത പേരുരൂപങ്ങൾ നിലനിർത്തുന്നത് അധികമായ ഉപദേശവ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതെ ഈ തിരിച്ചറിയൽ സംരക്ഷിക്കുന്നു.
- issue: οἰκουμένη എന്നതിന്റെ വ്യാപ്തി
  choice: ലോകം മുഴുവനെയും
  alternative: അധിവസിക്കപ്പെടുന്ന ഭൂമി മുഴുവനെയും
  rationale: അപ്പോക്കലിപ്റ്റിക് സന്ദർഭത്തിലെ സാർവലൗകിക വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്ക് പദത്തിന്റെ ‘അധിവസിക്കപ്പെടുന്ന ലോകം’ എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: δράκων എന്ന പ്രതീകജീവിയുടെ മലയാളരൂപം
  choice: മഹാസർപ്പം
  alternative: മഹാഡ്രാഗൺ
  rationale: ‘മഹാസർപ്പം’ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; എന്നിരുന്നാലും തുടർന്നുള്ള ὄφις ‘പാമ്പ്’ എന്നു വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തി രണ്ടു ഗ്രീക്ക് പദങ്ങളുടെയും വ്യത്യാസം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ സമാനാധികരണങ്ങളുടെ നിരയും ἐβλήθη എന്ന ക്രിയയുടെ ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
