id: REV.12.3
reference: Revelation 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων ⸂μέγας πυρρός⸃, ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: ml
  text: 'പിന്നെ സ്വർഗത്തിൽ മറ്റൊരു അടയാളം പ്രത്യക്ഷപ്പെട്ടു: ഇതാ, തീച്ചുവപ്പുള്ള ഒരു വലിയ മഹാസർപ്പം! അതിന് ഏഴു തലകളും പത്തു കൊമ്പുകളും ഉണ്ടായിരുന്നു; അതിന്റെ തലകളിൽ ഏഴു രാജമകുടങ്ങളും[a] ഉണ്ടായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജകീയ ശിരോബന്ധങ്ങൾ.” ഗ്രീക്കിലെ διάδημα രാജാധികാരത്തെ സൂചിപ്പിക്കുന്ന ശിരോഭൂഷണമാണ്; വിജയിയുടെ കിരീടമായ στέφανος എന്ന പദത്തിൽനിന്ന് ഇത് വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: പ്രത്യക്ഷപ്പെട്ടു
  rationale: ദർശനവിവരണത്തിൽ ഈ കർമണിരൂപം സ്വാഭാവികമായി ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്ന അർഥം നൽകുന്നു.
- source_word: ἄλλο σημεῖον
  choice: മറ്റൊരു അടയാളം
  rationale: വെളിപ്പാടിലെ σημεῖον പ്രതീകാത്മകമായ ദർശനചിഹ്നത്തെ സൂചിപ്പിക്കുന്നു; ‘അടയാളം’ വ്യക്തവും പരിചിതവുമാണ്.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: അപോകലിപ്റ്റിക ദർശനത്തിന്റെ പ്രാപഞ്ചികവും ദൈവികവുമായ പശ്ചാത്തലത്തിൽ ‘സ്വർഗം’ ഉചിതമാണ്; ‘ആകാശം’ എന്നും അർഥമാകാം.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ദർശനത്തിലെ പെട്ടെന്നുള്ള ശ്രദ്ധാകർഷണം മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവപൂർണവുമായി നിലനിർത്തുന്നു.
- source_word: δράκων
  choice: മഹാസർപ്പം
  rationale: δράκων സൂചിപ്പിക്കുന്ന ഭീകരമായ സർപ്പരൂപജീവിയെ മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; സാധാരണ ‘സർപ്പം’ എന്നതിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: μέγας πυρρός
  choice: തീച്ചുവപ്പുള്ള ഒരു വലിയ
  rationale: μέγας വലിപ്പവും ഭീകരമായ മഹത്ത്വവും സൂചിപ്പിക്കുന്നു; πυρρός തീജ്വാലപോലുള്ള ചുവപ്പിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തീച്ചുവപ്പ്’ അതിന്റെ ദൃശ്യതീവ്രത കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: അതിന് ഏഴു തലകളും പത്തു കൊമ്പുകളും ഉണ്ടായിരുന്നു
  rationale: ഗ്രീക്കിലെ വിവരണാത്മക കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണവാക്യമായി അവതരിപ്പിച്ചു; പ്രതീകങ്ങളെ വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα
  choice: അതിന്റെ തലകളിൽ ഏഴു രാജമകുടങ്ങൾ
  rationale: διάδημα സാധാരണ വിജയകിരീടത്തിൽനിന്ന് വ്യത്യസ്തമായ രാജാധികാരത്തിന്റെ ശിരോഭൂഷണമാണ്; ‘രാജമകുടം’ ആ പ്രത്യേകത സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πυρρός എന്ന വർണപദത്തിന്റെ വിവർത്തനം
  choice: തീച്ചുവപ്പ്
  alternative: ചുവപ്പ്
  rationale: പദം തീയുടെയോ ജ്വാലയുടെയോ പോലുള്ള ചുവപ്പിനെ സൂചിപ്പിക്കുന്നു. ‘തീച്ചുവപ്പ്’ അതിന്റെ ശക്തമായ ദൃശ്യഭാവം കാത്തുസൂക്ഷിക്കുന്നു; വ്യാഖ്യാനപരമായ പ്രതീകാർഥം ചേർക്കുന്നില്ല.
- issue: δράκων എന്ന ജീവിയുടെ നാമം
  choice: മഹാസർപ്പം
  alternative: ഡ്രാഗൺ
  rationale: ഈ വാക്യം ജീവിയുടെ പ്രതീകാർഥം മുൻകൂട്ടി നിർവചിക്കാതെ അതിന്റെ ഭീകരമായ സർപ്പരൂപം അവതരിപ്പിക്കുന്നു. ‘മഹാസർപ്പം’ മലയാളത്തിൽ മാന്യവും ഗ്രാഹ്യവുമാണ്.
- issue: αὐτοῦ എന്ന സർവനാമത്തിന്റെ അവതരണം
  choice: അതിന്റെ
  alternative: അവന്റെ
  rationale: ഈ വാക്യത്തിൽ ജീവിയെ നപുംസകസൂചനയോടെ പരാമർശിക്കുന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്. തുടർന്നുള്ള വാക്യങ്ങളിൽ ലഭിക്കുന്ന വ്യക്തിപരമായ തിരിച്ചറിയൽ ഇവിടെ മുൻകൂട്ടി ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവപൂർണവുമായ ദർശനവിവരണശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യം വ്യക്തതയ്ക്കായി മലയാളത്തിൽ രണ്ട് ഘടകങ്ങളാക്കി; ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷകവും ഏഴ്/പത്ത് എന്നീ ദൃശ്യവിശദാംശങ്ങളും സംരക്ഷിച്ചു. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
