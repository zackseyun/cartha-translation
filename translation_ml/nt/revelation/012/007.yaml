id: REV.12.7
reference: Revelation 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: ml
  text: 'സ്വർഗത്തിൽ യുദ്ധം പൊട്ടിപ്പുറപ്പെട്ടു: മീഖായേലും അവന്റെ ദൂതന്മാരും മഹാസർപ്പത്തിനെതിരെ യുദ്ധം ചെയ്തു.[a] മഹാസർപ്പവും അവന്റെ ദൂതന്മാരും യുദ്ധം ചെയ്തു,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “മീഖായേലും അവന്റെ ദൂതന്മാരും മഹാസർപ്പത്തോടു യുദ്ധം ചെയ്യാൻ.” ഗ്രീക്കിൽ പ്രവർത്തനത്തെയോ ഉദ്ദേശ്യത്തെയോ സൂചിപ്പിക്കുന്ന ആർട്ടിക്കിളോടുകൂടിയ infinitive ഘടനയുണ്ട്.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ ലളിതമായി: “മഹാസർപ്പം യുദ്ധം ചെയ്തു; അവന്റെ ദൂതന്മാരും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: യുദ്ധം പൊട്ടിപ്പുറപ്പെട്ടു
  rationale: γίνομαι + πόλεμος എന്ന പ്രയോഗം ഒരു യുദ്ധം ഉണ്ടായിത്തുടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പൊട്ടിപ്പുറപ്പെട്ടു’ എന്നത് ആ സംഭവാരംഭഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: ഇവിടെ οὐρανός ദൃശ്യമായ ആകാശത്തെക്കാൾ സ്വർഗീയ മണ്ഡലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: Μιχαὴλ
  choice: മീഖായേൽ
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: അവന്റെ ദൂതന്മാർ
  rationale: മീഖായേലിനോടു ചേർന്നുനിൽക്കുന്ന ദൂതന്മാരുമായുള്ള ബന്ധം നേരായ ഉടമസ്ഥപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: മഹാസർപ്പത്തോടു യുദ്ധം ചെയ്തു
  rationale: ഗ്രീക്കിലെ നിർദേശകപദത്തോടുകൂടിയ infinitive ഘടന പ്രവർത്തനം/ഉദ്ദേശ്യം ചുരുക്കി പറയുന്നു. മലയാളത്തിൽ പ്രവർത്തനം വ്യക്തമായി പറയുന്നത് സ്വാഭാവികമാണ്; hostile context ‘യുദ്ധം ചെയ്തു’ എന്നതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: δράκοντος / δράκων
  choice: മഹാസർപ്പം
  rationale: വെളിപ്പാടിലെ അപോകലിപ്റ്റിക് രൂപകവും ഉടനെയുള്ള സന്ദർഭവും കണക്കിലെടുത്ത് δράκων എന്നതിന് മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികമായ ‘മഹാസർപ്പം’ തെരഞ്ഞെടുത്തു.
- source_word: ἐπολέμησεν
  choice: തിരിച്ചും യുദ്ധം ചെയ്തു
  rationale: രണ്ടാം വാക്യഭാഗം മഹാസർപ്പത്തിന്റെ പ്രതികരണപരമായ പോരാട്ടം അവതരിപ്പിക്കുന്നു. ‘തിരിച്ചും’ സന്ദർഭത്തിൽ സൂചിതമായ പ്രതികരണം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൂടുതൽ ഔപചാരികമായ നേരിട്ടുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: καὶ οἱ ἄγγελοι αὐτοῦ
  choice: അവന്റെ ദൂതന്മാരും
  rationale: മീഖായേലിന്റെയും മഹാസർപ്പത്തിന്റെയും പക്ഷങ്ങളിലുള്ള ദൂതന്മാർ തമ്മിലുള്ള സമാന്തരഘടന നിലനിർത്തുന്നു.
theological_decisions:
- issue: മീഖായേലിന്റെ വ്യക്തിത്വവും പദവിയും
  choice: ‘മീഖായേൽ’ എന്ന വ്യക്തിനാമം മാത്രം നൽകി, വ്യാഖ്യാനപരമായ വിശേഷണം ചേർത്തില്ല.
  alternative: പ്രധാനദൂതൻ എന്നു വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ചില പാരമ്പര്യങ്ങളിലെ ക്രിസ്തുവുമായി ബന്ധിപ്പിക്കുന്ന വ്യാഖ്യാനം ഉൾപ്പെടുത്തുക.
  rationale: ഈ വാക്യം മീഖായേലിന്റെ പേര് പറയുന്നുവെങ്കിലും അവന്റെ പദവി വ്യക്തമാക്കുകയോ ക്രിസ്തുവുമായി താദാത്മ്യപ്പെടുത്തുകയോ ചെയ്യുന്നില്ല. അതിനാൽ വാക്യത്തിന്റെ പരിധി കടക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സ്വർഗത്തിൽ,’ ‘യുദ്ധം പൊട്ടിപ്പുറപ്പെട്ടു,’ ‘മഹാസർപ്പം’ എന്നീ രൂപങ്ങൾ സാഹിത്യഗൗരവവും സ്വാഭാവികതയും കൂട്ടിച്ചേർക്കുന്നു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
