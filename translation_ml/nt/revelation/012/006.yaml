id: REV.12.6
reference: Revelation 12:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: ml
  text: ആ സ്ത്രീ മരുഭൂമിയിലേക്കു പലായനം ചെയ്തു; അവിടെ ദൈവം ഒരുക്കിയ ഒരു സ്ഥലം അവൾക്കുണ്ട്; അവിടെ അവർ അവളെ ആയിരത്തി ഇരുനൂറ്റി അറുപത് ദിവസം പോറ്റേണ്ടതിനായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൾ അവിടെ ആയിരത്തി ഇരുനൂറ്റി അറുപത് ദിവസം പോറ്റപ്പെടേണ്ടതിനായി.’ ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമാക്കാത്ത മൂന്നാംപുരുഷ ബഹുവചന ക്രിയയാണ്; അക്ഷരാർഥത്തിൽ, ‘അവർ അവളെ അവിടെ പോറ്റേണ്ടതിനായി.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγεν
  choice: ഓടിപ്പോയി
  rationale: φεύγω അടിയന്തരമായ പലായനത്തെയോ രക്ഷപ്പെടലിനെയോ സൂചിപ്പിക്കുന്നു. ‘ഓടിപ്പോയി’ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അതിന്റെ ചലനവും അടിയന്തരതയും നിലനിർത്തുന്നു.
- source_word: ἔρημον
  choice: മരുഭൂമി
  rationale: ἔρημος ജനവാസമില്ലാത്ത വിജനപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘മരുഭൂമി’ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ വിശാലമായ വിജനസ്ഥലത്തെ സൂചിപ്പിക്കാൻ സ്വാഭാവികമാണ്; മണൽപ്രദേശം മാത്രമായി നിർബന്ധിച്ച് ചുരുക്കുന്നില്ല.
- source_word: τόπον
  choice: ഒരു സ്ഥലം
  rationale: τόπος എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: ദൈവം ഒരുക്കിയ
  rationale: പൂർണ്ണകാല നിഷ്ക്രിയ കൃദന്തം ആ സ്ഥലം നേരത്തേ സജ്ജമാക്കിയതാണെന്ന് സൂചിപ്പിക്കുന്നു; വ്യക്തിയായ കർത്താവിനോടുകൂടിയ ἀπό സ്വാഭാവിക മലയാളത്തിൽ കർത്തൃപ്രയോഗമായി നൽകുന്നു.
- source_word: ἵνα
  choice: വേണ്ടതിനായിരുന്നു
  rationale: ἵναയുടെ ഉദ്ദേശ്യബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കേവല ഫലമായി മാത്രം വായിക്കാതെ ഉദ്ദേശ്യം നിലനിർത്തുന്നു.
- source_word: τρέφωσιν αὐτὴν
  choice: അവർ അവളെ പോറ്റേണ്ടതിന്
  rationale: τρέφω ദീർഘകാലം ഭക്ഷണവും പരിപാലനവും നൽകി പോറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ വ്യക്തമാക്കാത്ത മൂന്നാംപുരുഷ ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്ന് നിലനിർത്തുന്നു; ‘ദൈവം’ എന്ന് ചേർത്ത് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: ആയിരത്തിരുനൂറ്ററുപത് ദിവസം
  rationale: കാലദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന ദ്വിതീയാവിഭക്തിയെ മലയാളത്തിൽ സംഖ്യയും ‘ദിവസം’ എന്ന പദവുംകൊണ്ട് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔχει ἐκεῖ
  choice: അവിടെ … അവൾക്കുണ്ട്
  rationale: ἔχει എന്നതിന്റെ വർത്തമാനകാലവും ἐκεῖയുടെ സ്ഥലഊന്നലും നിലനിർത്തുന്നു; മലയാളത്തിൽ അനാവശ്യമായ ഇരട്ടിപ്പ് ഒഴിവാക്കാൻ ‘അവിടെ’ ഒരിക്കൽ മാത്രം ചേർക്കുന്നു.
theological_decisions:
- issue: τρέφωσιν എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: ‘അവർ … അവളെ പോറ്റേണ്ടതിന്’ എന്ന അനിശ്ചിത സജീവപ്രയോഗം നിലനിർത്തി.
  alternative: ‘അവൾ അവിടെ പോറ്റപ്പെടേണ്ടതിന്’ അല്ലെങ്കിൽ ‘ദൈവം അവളെ പോറ്റേണ്ടതിന്’
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായി പറഞ്ഞിട്ടില്ലാത്ത മൂന്നാംപുരുഷ ബഹുവചന കർത്താവുണ്ട്. നിഷ്ക്രിയമാക്കുന്നത് വ്യാകരണരൂപം മറയ്ക്കും; ദൈവത്തെ കർത്താവായി ചേർക്കുന്നത് പാഠത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദൃശ്യത്തിന്റെ ബൈബിൾസംബന്ധമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവിക പദക്രമം ഒഴിവാക്കി. അടിക്കുറിപ്പ് സൂചിക [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
