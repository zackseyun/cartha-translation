- from: ആ സ്ത്രീ മരുഭൂമിയിലേക്ക് ഓടിപ്പോയി. അവിടെ ദൈവം ഒരുക്കിയ ഒരു സ്ഥലം അവൾക്കുണ്ട്; അവിടെ അവർ ആയിരത്തിരുനൂറ്ററുപത് ദിവസം അവളെ പോറ്റേണ്ടതിനായിരുന്നു.[a]
  to: ആ സ്ത്രീ മരുഭൂമിയിലേക്കു പലായനം ചെയ്തു; അവിടെ ദൈവം ഒരുക്കിയ ഒരു സ്ഥലം അവൾക്കുണ്ട്; അവിടെ അവർ അവളെ ആയിരത്തി ഇരുനൂറ്റി അറുപത് ദിവസം പോറ്റേണ്ടതിനായി.[a]
