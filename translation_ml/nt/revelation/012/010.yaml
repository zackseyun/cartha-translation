id: REV.12.10
reference: Revelation 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: ml
  text: 'സ്വർഗത്തിൽ ഒരു ഉച്ചത്തിലുള്ള ശബ്ദം ഇങ്ങനെ പറയുന്നതു ഞാൻ കേട്ടു: “ഇപ്പോൾ നമ്മുടെ ദൈവത്തിന്റെ രക്ഷയും ശക്തിയും രാജ്യവും അവന്റെ മശീഹായുടെ[a] അധികാരവും വന്നിരിക്കുന്നു. കാരണം നമ്മുടെ സഹോദരന്മാരുടെ[b] കുറ്റാരോപകൻ—രാവും പകലും നമ്മുടെ ദൈവസന്നിധിയിൽ അവർക്കെതിരെ കുറ്റം ചുമത്തുന്നവൻ—താഴേക്ക് എറിയപ്പെട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ ക്രിസ്തുവിന്റെ.” ഗ്രീക്കിലെ Χριστός (ക്രിസ്തോസ്) എന്ന പദവി ‘ദൈവത്തിന്റെ അഭിഷിക്തൻ’ എന്നാണ് അർത്ഥമാക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: “സഹോദരന്മാർ” എന്നത് സ്ത്രീകളെയും പുരുഷന്മാരെയും ഉൾക്കൊള്ളുന്ന സഹവിശ്വാസിസമൂഹത്തെ കൂട്ടായി സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: ഒരു ഉച്ചത്തിലുള്ള ശബ്ദം
  rationale: μέγας ഇവിടെ ശബ്ദത്തിന്റെ വലുപ്പമല്ല, ഉച്ചതയെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: Ἄρτι ἐγένετο
  choice: ഇപ്പോൾ ... വന്നിരിക്കുന്നു
  rationale: നിർണായകമായ ഇപ്പോഴത്തെ സംഭവവും അതിന്റെ നിലവിലുള്ള ഫലവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία
  choice: രക്ഷയും ശക്തിയും രാജ്യവും
  rationale: ഗ്രീക്കിലെ ആവർത്തിതമായ ഘടന നിലനിർത്തിക്കൊണ്ട് മൂന്നു ആശയങ്ങളെയും വ്യക്തമായി വേർതിരിക്കുന്നു; βασιλείαയ്ക്ക് വെളിപ്പാട് ഗ്രന്ഥത്തിന്റെ രാജകീയ-അന്ത്യകാല ഭാഷാശൈലിക്ക് യോജിച്ച ‘രാജ്യം’ ഉപയോഗിച്ചു.
- source_word: ἡ ἐξουσία
  choice: അധികാരം
  rationale: δύναμις എന്ന ‘ശക്തി’യിൽനിന്ന് വ്യത്യസ്തമായി, നിയമാനുസൃതമായ ഭരണാവകാശം സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: അവന്റെ മശിഹായുടെ
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമംപോലെയല്ല, ദൈവത്തിന്റെ അഭിഷിക്തനായ ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന പദവിയായാണ് പ്രവർത്തിക്കുന്നത്.
- source_word: κατήγωρ
  choice: കുറ്റാരോപകൻ
  rationale: കുറ്റം ചുമത്തുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന അപൂർവമായ ന്യായവ്യവഹാരപദത്തിന്റെ അർത്ഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἐβλήθη
  choice: താഴേക്ക് എറിയപ്പെട്ടിരിക്കുന്നു
  rationale: സന്ദർഭത്തിലെ ബലപ്രയോഗത്തോടെയുള്ള സ്വർഗീയ പതനം വ്യക്തമാക്കുകയും passive രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἡμέρας καὶ νυκτός
  choice: രാവും പകലും
  rationale: തുടർച്ചയായ കുറ്റാരോപണം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശിഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ പദം ദൈവത്തിന്റെ അഭിഷിക്തനായ രാജാവിന്റെ പദവിയായി വരുന്നതിനാൽ അതിന്റെ അർത്ഥസമ്പന്നമായ ശീർഷകരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ἀδελφῶν എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ പരിധി
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ / സഹവിശ്വാസികൾ
  rationale: മൂലപാഠത്തിന്റെ വ്യാകരണരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു; വിശ്വാസസമൂഹത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്ന കൂട്ടായ പ്രയോഗമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. സ്വർഗീയ പ്രഖ്യാപനത്തിന്റെ താളം നിലനിർത്താൻ പട്ടികാസ്വഭാവമുള്ള ഘടന സംരക്ഷിക്കുകയും, ആവർത്തിതമായ കുറ്റാരോപണവാക്യം ദീർഘവാക്യത്തിൽ വ്യക്തമായി വേർതിരിക്കാൻ ഡാഷുകൾ ഉപയോഗിക്കുകയും ചെയ്തു.
