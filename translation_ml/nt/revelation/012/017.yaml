id: REV.12.17
reference: Revelation 12:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: ml
  text: മഹാസർപ്പം സ്ത്രീയോടു അത്യന്തം കോപിച്ചു; ദൈവത്തിന്റെ കല്പനകൾ പാലിക്കുകയും യേശുവിന്റെ സാക്ഷ്യം[a] മുറുകെപ്പിടിക്കുകയും ചെയ്യുന്ന അവളുടെ സന്തതിയിൽ ശേഷിച്ചവരോടു യുദ്ധം ചെയ്യാൻ അത് പുറപ്പെട്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശുവെക്കുറിച്ചുള്ള സാക്ഷ്യം’; മറ്റൊരു സാധ്യത, ‘യേശു നൽകുന്ന സാക്ഷ്യം.’ ഗ്രീക്കിലെ ജനിറ്റീവ് രൂപം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: കോപാകുലനായി
  rationale: കോപം ഉളവായതും അതിന്റെ തീവ്രമായ ശത്രുതാപരമായ പ്രതികരണവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δράκων
  choice: മഹാസർപ്പം
  rationale: വെളിപ്പാടിലെ പ്രതീകാത്മക ജീവിയെ സൂചിപ്പിക്കാൻ മലയാള ക്രൈസ്തവ ഭാഷയിൽ പരിചിതവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പദം.
- source_word: ἐπὶ τῇ γυναικί
  choice: സ്ത്രീയോടു
  rationale: ഇവിടെ ἐπί സൂചിപ്പിക്കുന്ന കോപത്തിന്റെ ലക്ഷ്യത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπῆλθεν
  choice: പുറപ്പെട്ടുപോയി
  rationale: സംഭവവിവരണത്തിലെ സ്ഥലമാറ്റവും ഉദ്ദേശ്യപൂർവമായ പുറപ്പെടലും വ്യക്തമാക്കുന്നു.
- source_word: ποιῆσαι πόλεμον
  choice: യുദ്ധം ചെയ്യാൻ
  rationale: ഗ്രീക്കിലെ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς
  choice: അവളുടെ സന്തതിയിൽ ശേഷിച്ചവരോടു
  rationale: σπέρμα എന്നതിന്റെ കുടുംബബന്ധപരമായ അർഥവും λοιποί സൂചിപ്പിക്കുന്ന ശേഷിച്ച വിഭാഗവും നിലനിർത്തുന്നു; യുദ്ധസന്ദർഭം ‘-ഓടു’ എന്നതിന്റെ വൈരപരമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τηρούντων τὰς ἐντολὰς τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കല്പനകൾ പാലിക്കുകയും
  rationale: τηρέωയുടെ വിശ്വസ്തമായ അനുസരണവും ἐντολαίയുടെ ബൈബിൾപരമായ ഭാരവും വ്യക്തമായി നൽകുന്നു.
- source_word: ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: യേശുവിന്റെ സാക്ഷ്യം മുറുകെപ്പിടിക്കുകയും ചെയ്യുന്ന
  rationale: ἔχω ഇവിടെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ കൈവശംവെക്കലിനെയോ ചേർന്നുനിൽപ്പിനെയോ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘യേശുവിന്റെ’ എന്ന രൂപം ഗ്രീക്ക് ജനിറ്റീവിന്റെ വ്യാഖ്യാനസാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: τὴν μαρτυρίαν Ἰησοῦ എന്നതിലെ ജനിറ്റീവ് ബന്ധം
  choice: യേശുവിന്റെ സാക്ഷ്യം
  alternative: യേശുവെക്കുറിച്ചുള്ള സാക്ഷ്യം; അല്ലെങ്കിൽ യേശു നൽകുന്ന സാക്ഷ്യം
  rationale: Ἰησοῦ എന്ന ജനിറ്റീവ് വസ്തുനിഷ്ഠമായോ കർത്തൃനിഷ്ഠമായോ ഗ്രഹിക്കാം. മുഖ്യപാഠം അതിനെ തീർപ്പാക്കാതെ സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിലൂടെ അവ്യക്തത നിലനിർത്തുന്നു; പ്രധാന സാധ്യതകൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വെളിപ്പാടിന്റെ പ്രതീകാത്മക ഭാവം നിലനിർത്തിക്കൊണ്ട് അപരിചിതമായ സംസ്കൃതപദങ്ങളും അനാവശ്യമായ സഭാവിഭാഗ-വിശേഷ ഭാഷയും ഒഴിവാക്കി.
