id: REV.12.12
reference: Revelation 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: ml
  text: അതുകൊണ്ട്, ആകാശങ്ങളേ, അവയിൽ വസിക്കുന്നവരേ, ആനന്ദിക്കുവിൻ! ഭൂമിക്കും[a] സമുദ്രത്തിനും അയ്യോ കഷ്ടം! പിശാച് വലിയ ക്രോധത്തോടെ[b] നിങ്ങളുടെ അടുക്കൽ ഇറങ്ങിവന്നിരിക്കുന്നു; തനിക്കു കുറച്ചുസമയം മാത്രമേ ഉള്ളൂ[c] എന്ന് അവന് അറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ദേശത്തിനും’ അഥവാ ‘കരയ്ക്കും.’ ഗ്രീക്ക് γῆ എന്ന പദത്തിന് ‘ഭൂമി,’ ‘ദേശം,’ ‘കര’ എന്നീ അർത്ഥങ്ങൾ വരാം; ഇവിടെ സന്ദർഭത്തിന്റെ വിശ്വവ്യാപകത പരിഗണിച്ച് ‘ഭൂമി’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘വലിയ ക്രോധം ഉള്ളവനായി.’
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘തനിക്കു കുറച്ചുസമയം ഉണ്ടെന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ സ്വർഗീയ വിജയത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: εὐφραίνεσθε
  choice: ആനന്ദിക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞയുടെ ശക്തിയും വെളിപ്പാടിന്റെ ഗൗരവമുള്ള ആഹ്വാനശൈലിയും നിലനിർത്തുന്നു.
- source_word: οἱ οὐρανοὶ
  choice: ആകാശങ്ങളേ
  rationale: നാമനിർദേശരൂപം ഇവിടെ സംബോധനയായി പ്രവർത്തിക്കുന്നു; ഗ്രീക്കിലെ ബഹുവചനവും നേരിട്ടുള്ള ആഹ്വാനവും സംരക്ഷിക്കുന്നു.
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: അവയിൽ വസിക്കുന്നവരേ
  rationale: σκηνόω എന്നതിന്റെ കൂടാരമടിച്ച് പാർക്കുക എന്ന പദചിത്രം ഇവിടെ സ്ഥിരവാസത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, അർത്ഥം വ്യക്തമായി നൽകുന്നു; അസ്വാഭാവികമായ അക്ഷരാർഥം ഒഴിവാക്കുന്നു.
- source_word: οὐαὶ
  choice: അയ്യോ കഷ്ടം
  rationale: പ്രവാചകീയ ദുരന്തപ്രഖ്യാപനത്തിന്റെ ശക്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: ഭൂമിക്കും സമുദ്രത്തിനും
  rationale: വെളിപ്പാടിലെ വിശ്വവ്യാപക പശ്ചാത്തലത്തിലും സമുദ്രത്തോടുള്ള ജോടിയിലും γῆയ്ക്ക് ‘ഭൂമി’ എന്ന അർത്ഥമാണ് കൂടുതൽ യോജിച്ചത്; ‘ദേശം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κατέβη
  choice: ഇറങ്ങിവന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ ഇറങ്ങിവരവിനും അതിന്റെ ഇപ്പോഴത്തെ ഫലത്തിനും ഒരുപോലെ ഊന്നൽ നൽകുന്നു.
- source_word: ὁ διάβολος
  choice: പിശാച്
  rationale: ഈ സന്ദർഭത്തിൽ സാത്താന്റെ സ്ഥാപിതമായ ശീർഷകത്തിന് വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ
  rationale: ഭൂമിയുടെയും സമുദ്രത്തിന്റെയും മണ്ഡലത്തിലേക്കുള്ള ചലനം പ്രകടമാക്കുന്നു; ഗ്രീക്ക് പദത്തിൽ നിർബന്ധമല്ലാത്ത ‘നിങ്ങൾക്കെതിരെ’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἔχων θυμὸν μέγαν
  choice: വലിയ ക്രോധത്തോടെ
  rationale: θυμός സൂചിപ്പിക്കുന്ന തീവ്രമായ കോപം ഗൗരവത്തോടെയും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: εἰδὼς
  choice: എന്ന് അവന് അറിയാം
  rationale: ഗ്രീക്ക് കൃ participleന്റെ വിശദീകരണബന്ധം മലയാളത്തിൽ വ്യക്തമായ ഉപവാക്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὀλίγον καιρὸν ἔχει
  choice: തനിക്കു വളരെ കുറച്ച് സമയം മാത്രമേ ഉള്ളൂ
  rationale: അവശേഷിക്കുന്ന പരിമിതമായ കാലയളവിന്റെ ഹ്രസ്വത ഊന്നിപ്പറയുന്നു; ‘മാത്രമേ’ ഗ്രീക്കിലെ ὀλίγον എന്ന നിയന്ത്രണത്തിന്റെ പ്രസക്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘പിശാച് നിങ്ങളുടെ അടുക്കൽ ഇറങ്ങിവന്നിരിക്കുന്നു’ എന്നതിലെ ‘നിങ്ങൾ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ഉടൻ മുമ്പ് ദുരന്തം പ്രഖ്യാപിക്കപ്പെട്ട ഭൂമിയെയും സമുദ്രത്തെയും അഭിസംബോധന ചെയ്യുന്ന ബഹുവചനമായി നിലനിർത്തി.
  alternative: ‘നിങ്ങൾ’ സ്വർഗങ്ങളെയും അവയിൽ വസിക്കുന്നവരെയും തുടർന്നും അഭിസംബോധന ചെയ്യുന്നു എന്നു വായിക്കുക.
  rationale: വാക്യത്തിലെ ഏറ്റവും അടുത്ത അഭിസംബോധിതർ ഭൂമിയും സമുദ്രവുമാണ്; എങ്കിലും അവരുടെ ‘നിവാസികൾ’ എന്നു വിശദീകരിച്ച് മൂലപാഠത്തേക്കാൾ അർത്ഥം ചുരുക്കാതെ രൂപകാത്മക സംബോധന അതേപടി നിലനിർത്തുന്നു.
- issue: ഭൂമി എന്നോ ദേശം എന്നോ ഉള്ള γῆയുടെ അർത്ഥം
  choice: വിശ്വവ്യാപക വിരുദ്ധസമാന്തര്യം മുൻനിർത്തി ‘ഭൂമി’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ‘ദേശം’ അല്ലെങ്കിൽ ‘കര’ എന്നു വായിക്കുക.
  rationale: ‘ആകാശങ്ങൾ’ എന്നതും ‘സമുദ്രം’ എന്നതും ചേർന്ന സന്ദർഭം സൃഷ്ടിയുടെ വിശാല മണ്ഡലങ്ങളെ സൂചിപ്പിക്കുന്നു; എന്നാൽ പദത്തിന്റെ യഥാർത്ഥ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പ്രവാചകീയ ശൈലി സ്വീകരിച്ചു. ‘ആകാശങ്ങളേ’ എന്ന ബഹുവചനവും ‘ആനന്ദിക്കുവിൻ’ എന്ന ആജ്ഞാരൂപവും ഭാഗത്തിന്റെ ഉയർന്ന സംബോധനശൈലി സംരക്ഷിക്കുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
