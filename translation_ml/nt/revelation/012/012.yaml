revisions:
- from: അതുകൊണ്ട്, ആകാശങ്ങളേ, അവയിൽ വസിക്കുന്നവരേ, ആനന്ദിക്കുവിൻ! ഭൂമിക്കും[a] സമുദ്രത്തിനും അയ്യോ കഷ്ടം! പിശാച് വലിയ ക്രോധത്തോടെ[b] നിങ്ങളുടെ അടുക്കൽ ഇറങ്ങിവന്നിരിക്കുന്നു. തനിക്കു വളരെ കുറച്ച് സമയം മാത്രമേ ഉള്ളൂ എന്ന്[c] അവന് അറിയാം.
  to: അതുകൊണ്ട്, ആകാശങ്ങളേ, അവയിൽ വസിക്കുന്നവരേ, ആനന്ദിക്കുവിൻ! ഭൂമിക്കും[a] സമുദ്രത്തിനും അയ്യോ കഷ്ടം! പിശാച് വലിയ ക്രോധത്തോടെ[b] നിങ്ങളുടെ അടുക്കൽ ഇറങ്ങിവന്നിരിക്കുന്നു; തനിക്കു കുറച്ചുസമയം മാത്രമേ ഉള്ളൂ[c] എന്ന് അവന് അറിയാം.
  rationale: The revision removes an unwarranted intensification of ‘little time,’ restores the Greek’s close relationship between the descent, great wrath, and knowing clause, and relocates footnote c to the words it actually explains. No disputed reading or doctrinal inference is introduced.
