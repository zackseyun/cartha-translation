  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: ml
  text: 'സ്വർഗത്തിൽ ഒരു വലിയ അടയാളം പ്രത്യക്ഷപ്പെട്ടു: സൂര്യനെ വസ്ത്രമായി ധരിച്ച ഒരു സ്ത്രീ; അവളുടെ പാദങ്ങൾക്കു കീഴെ ചന്ദ്രനും അവളുടെ തലയിൽ പന്ത്രണ്ട് നക്ഷത്രങ്ങളുടെ ഒരു കിരീടവും[a] ഉണ്ടായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാല’ അല്ലെങ്കിൽ ‘വിജയിയുടെ കിരീടം’; ഗ്രീക്കിലെ στέφανος എന്ന പദം രാജകീയ മകുടത്തെ സൂചിപ്പിക്കുന്ന പദത്തിൽനിന്ന് വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: അടയാളം
  rationale: വെളിപ്പാടിലെ പ്രതീകാത്മക ദർശനചിഹ്നം എന്ന അർഥം നിലനിർത്തുന്നു; ‘അത്ഭുതം’ എന്നാക്കി അർഥം ചുരുക്കുന്നില്ല.
- source_word: μέγα
  choice: വലിയ
  rationale: വലുപ്പവും പ്രാധാന്യവും ഒരുപോലെ സൂചിപ്പിക്കാൻ കഴിയുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ὤφθη
  choice: പ്രത്യക്ഷപ്പെട്ടു
  rationale: രൂപപരമായി നിഷ്ക്രിയമായ ‘കാണപ്പെട്ടു’ എന്ന ആശയം ദർശനവിവരണത്തിന് സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: οὐρανός എന്നതിന് ‘ആകാശം’ എന്നും അർഥമുണ്ടെങ്കിലും വെളിപ്പാടിന്റെ ദർശനസന്ദർഭത്തിൽ ‘സ്വർഗം’ കൂടുതൽ യോജിക്കുന്നു.
- source_word: γυνή
  choice: ഒരു സ്ത്രീ
  rationale: ഈ വാക്യം അവളെ ഭാര്യയായി നിർവചിക്കാത്തതിനാൽ പൊതുവായ പദം ഉപയോഗിക്കുന്നു.
- source_word: περιβεβλημένη τὸν ἥλιον
  choice: സൂര്യനെ വസ്ത്രമായി ധരിച്ച
  rationale: സൂര്യനാൽ പൊതിയപ്പെട്ടോ വസ്ത്രമണിഞ്ഞോ ഉള്ള ദൃശ്യരൂപം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക വിവർത്തനം.
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: അവളുടെ കാൽക്കീഴിൽ ചന്ദ്രൻ
  rationale: മൂലത്തിലെ സ്ഥാനസംബന്ധമായ ദൃശ്യബിംബം ചുരുക്കവും വ്യക്തവുമായി സംരക്ഷിക്കുന്നു.
- source_word: στέφανος
  choice: കിരീടം
  rationale: പ്രധാനപാഠത്തിൽ എളുപ്പം ഗ്രഹിക്കാവുന്ന പദം; രാജകീയ മകുടത്തിൽനിന്നുള്ള ഗ്രീക്ക് പദവ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀστέρων δώδεκα
  choice: പന്ത്രണ്ട് നക്ഷത്രങ്ങൾകൊണ്ടുള്ള
  rationale: കിരീടവും നക്ഷത്രങ്ങളും തമ്മിലുള്ള ഷഷ്ഠീവ്യാകരണബന്ധം അധിക വ്യാഖ്യാനം ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സ്ത്രീയുടെ പ്രതീകാത്മക തിരിച്ചറിയൽ
  choice: വിവർത്തനത്തിൽ സ്ത്രീയെ തിരിച്ചറിയാതെ ദർശനത്തിലെ അടയാളമായി മാത്രം വിവരിക്കുന്നു.
  alternative: ഇസ്രായേൽ, മറിയം, ദൈവജനം, സഭ എന്നിങ്ങനെ തിരിച്ചറിയുക.
  rationale: ഈ വാക്യം സ്ത്രീ ആരാണെന്ന് വ്യക്തമായി പറയുന്നില്ല; അതിനാൽ ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കാതെ പ്രതീകാത്മക അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ദർശനസാഹിത്യത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ദൃശ്യബിംബവും സ്ത്രീയുടെ തിരിച്ചറിയലിലെ ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വവും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] സൂര്യത്തിനു ശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് στέφανος എന്ന ‘കിരീടം’ എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ അടയാളം അതത് പദത്തോടു ചേർത്തു.
