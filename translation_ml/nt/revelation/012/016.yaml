id: REV.12.16
reference: Revelation 12:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: ml
  text: ഭൂമി സ്ത്രീയെ സഹായിച്ചു[a]. ഭൂമി തന്റെ വായ് തുറന്ന് മഹാസർപ്പം തന്റെ വായിൽനിന്ന് എറിഞ്ഞുവിട്ട[b] നദിയെ വിഴുങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശം സ്ത്രീയെ സഹായിച്ചു’ അല്ലെങ്കിൽ ‘നിലം സ്ത്രീയെ സഹായിച്ചു.’ ഗ്രീക്ക് γῆ എന്ന പദത്തിന് ‘ഭൂമി,’ ‘ദേശം,’ ‘നിലം’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘എറിഞ്ഞുവിട്ട’ എന്നതിന് ‘പുറത്തേക്ക് എറിഞ്ഞ’ അല്ലെങ്കിൽ ‘പുറത്തുവിട്ട’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: സഹായിച്ചു
  rationale: βοηθέω എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനാർഥമായ ‘സഹായിക്കുക, തുണയ്ക്കുക’ എന്നത് സ്വാഭാവികവും നേരിട്ടും നൽകുന്നു.
- source_word: ἡ γῆ
  choice: ഭൂമി
  rationale: γῆ എന്നതിന് ‘ഭൂമി,’ ‘ദേശം,’ ‘നിലം’ എന്നീ അർഥങ്ങൾ വരാം. ഈ അപ്പോക്കലിപ്റ്റിക് ദൃശ്യത്തിലെ വിശാലവും വ്യക്തിവൽക്കരിച്ചതുമായ പ്രതീകത്തിന് ‘ഭൂമി’ ഏറ്റവും യോജിക്കുന്നു; യഥാർഥമായ പദാർഥവൈകല്യം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τῇ γυναικί
  choice: സ്ത്രീയെ
  rationale: ഗുണഭോക്താവിനെ സൂചിപ്പിക്കുന്ന ദാതൃവിഭക്തിയെ മലയാളത്തിൽ സഹായിക്കുക എന്ന ക്രിയയോടൊപ്പമുള്ള സ്വാഭാവിക കർമരൂപത്തിൽ നൽകുന്നു; പ്രതീകാത്മക വ്യക്തിയെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς
  choice: ഭൂമി തന്റെ വായ് തുറന്ന്
  rationale: ഭൂമിയെ വ്യക്തിവൽക്കരിക്കുന്ന മൂലരൂപകം അതേപടി നിലനിർത്തുന്നു. ‘തന്റെ’ എന്ന പ്രത്യയരൂപം മലയാളത്തിൽ കർത്താവിലേക്കുള്ള ബന്ധം വ്യക്തമായി കാണിക്കുന്നു.
- source_word: κατέπιεν
  choice: വിഴുങ്ങി
  rationale: καταπίνω എന്നതിന്റെ ‘വിഴുങ്ങുക’ എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; വ്യക്തിവൽക്കരിച്ച ദൃശ്യത്തിന്റെ ശക്തിയും സംക്ഷിപ്തതയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: τὸν ποταμόν
  choice: നദിയെ
  rationale: ποταμός എന്നതിന്റെ സാധാരണ അർഥം ‘നദി’യാണ്. സന്ദർഭത്തിൽ പ്രളയസദൃശമായ ഒഴുക്ക് സൂചിപ്പിക്കാമെങ്കിലും ‘പ്രളയം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് അനാവശ്യമായ വ്യാഖ്യാനവികാസമാകും.
- source_word: ὃν ἔβαλεν
  choice: എറിഞ്ഞുവിട്ട
  rationale: βάλλω എന്നതിലെ ശക്തിയുള്ള ‘എറിയുക/വലിച്ചെറിയുക’ എന്ന ആശയം സൂക്ഷിക്കുമ്പോഴും, വായിൽനിന്ന് പുറപ്പെടുന്ന നദിയെക്കുറിച്ചുള്ള മലയാളവാക്യത്തിൽ ‘എറിഞ്ഞുവിട്ട’ സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു. കൂടുതൽ സന്ദർഭോചിതമായ ‘പുറത്തുവിട്ട’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὁ δράκων
  choice: മഹാസർപ്പം
  rationale: വെളിപ്പാട് പുസ്തകത്തിലെ δράκων എന്ന അപ്പോക്കലിപ്റ്റിക് ജീവിക്ക് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ തുല്യപദമാണ്; അതിനെ സാധാരണ പാമ്പായി ചുരുക്കുന്നില്ല.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: തന്റെ വായിൽനിന്ന്
  rationale: ഉത്ഭവസ്ഥാനം നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘തന്റെ’ മഹാസർപ്പത്തെയാണ് നിർവ്യാജമായി പരാമർശിക്കുന്നത്.
theological_decisions:
- issue: അപ്പോക്കലിപ്റ്റിക് ദൃശ്യത്തിൽ ഭൂമിയുടെ വ്യക്തിവൽക്കരണം
  choice: ഭൂമി സഹായിക്കുകയും വായ് തുറന്ന് നദിയെ വിഴുങ്ങുകയും ചെയ്യുന്നതായി മൂലദൃശ്യം വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
  alternative: ഭൂമിയെ ഒരു ജനസമൂഹം, പ്രദേശം, അല്ലെങ്കിൽ ദൈവിക സംരക്ഷണത്തിന്റെ ഉപാധി എന്നിങ്ങനെ വിശദീകരിക്കുക.
  rationale: വാക്യം ഈ പ്രതീകത്തിന്റെ അർഥം ഇവിടെ നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ പരിഭാഷ പ്രതീകാത്മക പിരിമുറുക്കം പരിഹരിക്കാതെ ദൃശ്യം മാത്രം വിശ്വസ്തമായി നൽകണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. അപ്പോക്കലിപ്റ്റിക് ദൃശ്യത്തിന്റെ ഗൗരവവും വ്യക്തിവൽക്കരണവും നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാപരമായോ വ്യാഖ്യാനപരമായോ പദങ്ങൾ ഒഴിവാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദഭാഗത്തിന് സമീപം മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
