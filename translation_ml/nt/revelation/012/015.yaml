id: REV.12.15
reference: Revelation 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: ml
  text: സർപ്പം തന്റെ വായിൽനിന്ന് നദിപോലെ വെള്ളം സ്ത്രീയുടെ പിന്നാലെ[a] എറിഞ്ഞു; അവളെ നദിയൊഴുക്കിൽ കൊണ്ടുപോകാൻ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്ത്രീയുടെ പിന്നിൽ.’ ഗ്രീക്കുപദം സ്ഥാനം സൂചിപ്പിച്ചോ പിന്തുടരുന്ന ദിശ സൂചിപ്പിച്ചോ വായിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് അടുത്ത്: ‘അവളെ നദിയാൽ വഹിക്കപ്പെടുന്നവളാക്കാൻ.’ അതായത്, നദിയുടെ ഒഴുക്കിൽ അവളെ കൊണ്ടുപോകാൻ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: ചീറ്റിച്ചു
  rationale: βάλλω എന്നതിന് അടിസ്ഥാനമായി ‘എറിഞ്ഞു/വിട്ടു’ എന്ന അർഥമുണ്ടെങ്കിലും, വായിൽനിന്ന് വെള്ളം ശക്തിയായി പുറപ്പെടുന്ന ദൃശ്യം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ചീറ്റിച്ചു’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ὁ ὄφις
  choice: സർപ്പം
  rationale: ὄφις എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും വെളിപ്പാടിലെ ബൈബിൾപ്രതീകാത്മക പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: തന്റെ വായിൽനിന്ന്
  rationale: പ്രത്യയത്തിന്റെ ഉറവിടസൂചനയും സർപ്പത്തെ സൂചിപ്പിക്കുന്ന αὐτοῦ എന്ന സർവനാമബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὀπίσω τῆς γυναικός
  choice: സ്ത്രീയുടെ പിന്നാലെ
  rationale: ὀπίσω + genitive സ്ഥലം സൂചിപ്പിച്ച് ‘പിന്നിൽ’ എന്നും പിന്തുടരുന്ന ദിശയിൽ ‘പിന്നാലെ’ എന്നും വരാം; ആക്രമണസന്ദർഭത്തിൽ ‘പിന്നാലെ’ യോജിക്കുന്നു, എന്നാൽ ഭിന്നസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὕδωρ ὡς ποταμόν
  choice: നദിപോലെ വെള്ളം
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമയും ποταμός എന്ന ‘നദി’ദൃശ്യവും വ്യാഖ്യാനപരമായ ‘പ്രളയം’ ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἵνα
  choice: —വേണ്ടതിനായിരുന്നു
  rationale: ἵναയുടെ ഉദ്ദേശ്യബലം സ്വാഭാവികമായ മലയാള ഉദ്ദേശ്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ποταμοφόρητον ποιήσῃ
  choice: അവളെ നദിയിൽ ഒഴുക്കിക്കൊണ്ടുപോകേണ്ടതിന്
  rationale: അപൂർവമായ ποταμοφόρητος എന്ന പദത്തിന്റെ ‘നദിയാൽ വഹിക്കപ്പെടുന്ന/ഒഴുക്കിക്കൊണ്ടുപോകപ്പെടുന്ന’ അർഥവും ποιέωയുടെ കാരണാർഥവും നിലനിർത്തുന്നു; ‘മുക്കിക്കൊല്ലുക’ എന്ന അതിവ്യക്തമായ ഫലം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സർപ്പത്തിന്റെ ആക്രമണത്തിലെ പ്രതീകാത്മക അപ്പോക്കലിപ്റ്റിക് ദൃശ്യം
  choice: ‘നദിപോലെ വെള്ളം’ എന്നും ‘നദിയിൽ ഒഴുക്കിക്കൊണ്ടുപോകുക’ എന്നും ദൃശ്യം അതേപടി നിലനിർത്തി.
  alternative: വെള്ളത്തെ സൈന്യം, പീഡനം, അസത്യം, കലാപം തുടങ്ങിയ ഏതെങ്കിലും പ്രതീകവ്യാഖ്യാനമായി മുഖ്യവാചകത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുക.
  rationale: മൂലവാക്യം പ്രതീകാത്മകമാണെങ്കിലും അതിന്റെ അർഥം സ്വയം വ്യാഖ്യാനിച്ച് ഒരൊറ്റ ദൈവശാസ്ത്രവായന നിർബന്ധിക്കാതെ ദൃശ്യം സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. അപ്പോക്കലിപ്റ്റിക് ദൃശ്യം വ്യാഖ്യാനിച്ച് മാറ്റാതെ, അപൂർവ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം മുഖ്യവാചകത്തിലും കൂടുതൽ അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകി.
