id: REV.12.5
reference: Revelation 12:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: ml
  text: അവൾ ഒരു മകനെ, ഒരു ആൺകുഞ്ഞിനെ, പ്രസവിച്ചു. അവൻ ഇരുമ്പുദണ്ഡുകൊണ്ട് സകല ജനതകളെയും മേയിക്കാനിരിക്കുന്നവനാണ്[a]. അവളുടെ കുഞ്ഞ് ദൈവത്തിന്റെ അടുക്കലേക്കും അവന്റെ സിംഹാസനത്തിന്റെ അടുക്കലേക്കും ബലമായി പിടിച്ചെടുക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇരുമ്പുദണ്ഡുകൊണ്ട് സകല ജനതകളെയും ഭരിക്കാനിരിക്കുന്നവനാണ്.’ ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘മേയിക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ അത് സങ്കീർത്തനം 2-നെ പ്രതിധ്വനിപ്പിക്കുകയും രാജകീയ അധികാരത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: പ്രസവിച്ചു
  rationale: കുഞ്ഞിനെ പ്രസവിക്കുന്നതിന്റെ മൂർത്തമായ ദൃശ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: υἱόν, ἄρσεν
  choice: ഒരു മകനെ, ഒരു ആൺകുഞ്ഞിനെ
  rationale: υἱόν, ἄρσεν എന്നീ രണ്ടു പദങ്ങളും നൽകുന്ന ഉദ്ദേശ്യപൂർവമായ ഊന്നൽ ആവർത്തനം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: μέλλει ποιμαίνειν
  choice: മേയിക്കാനിരിക്കുന്നവനാണ്
  rationale: μέλλει എന്നതിലെ ഭാവിമുഖത നിലനിർത്തുകയും, അത് കേവലം ഉടനടി സംഭവിക്കുമെന്നോ മാറ്റമില്ലാത്ത വിധിയാണെന്നോ അതിയായി നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ποιμαίνειν
  choice: മേയിക്കുക
  rationale: ποιμαίνω എന്ന ഇടയരൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു; സങ്കീർത്തനം 2-ലെ രാജാധികാരസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πάντα τὰ ἔθνη
  choice: സകല ജനതകളെയും
  rationale: ലോകത്തിലെ ജനതകളെ വ്യാപകമായി സൂചിപ്പിക്കുന്നതും സങ്കീർത്തനം 2-ന്റെ പ്രതിധ്വനി നിലനിർത്തുന്നതുമായ സ്വാഭാവിക പ്രയോഗം.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: ഇരുമ്പുദണ്ഡുകൊണ്ട്
  rationale: ഉപകരണാർഥം വ്യക്തമായി നൽകുകയും മൂലത്തിലെ ശക്തമായ ദൃശ്യരൂപം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἡρπάσθη
  choice: പെട്ടെന്ന് പറിച്ചെടുക്കപ്പെട്ടു
  rationale: ἁρπάζω സൂചിപ്പിക്കുന്ന പെട്ടെന്നുള്ളതും ശക്തിയോടുകൂടിയതുമായ മാറ്റം കർമണിപ്രയോഗത്തിൽ നിലനിർത്തുന്നു; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള മുകളിലോട്ടുള്ള നീക്കം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: τὸ τέκνον αὐτῆς
  choice: അവളുടെ കുഞ്ഞ്
  rationale: υἱός എന്നതിൽനിന്ന് പൊതുവായ τέκνον എന്ന പദത്തിലേക്കുള്ള ഗ്രീക്ക് വ്യത്യാസം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: ദൈവത്തിന്റെ അടുക്കലേക്കും അവന്റെ സിംഹാസനത്തിന്റെ അടുക്കലേക്കും
  rationale: ആവർത്തിക്കുന്ന πρὸς രണ്ടിടത്തേക്കുമുള്ള നീക്കമായി ആവർത്തിച്ച് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ποιμαίνειν ... ἐν ῥάβδῳ σιδηρᾷ എന്നതിലെ സങ്കീർത്തനം 2-നോടുള്ള മശീഹീയ സൂചന
  choice: മുഖ്യപാഠത്തിൽ ‘മേയിക്കുക’ എന്ന ഇടയരൂപകം നിലനിർത്തുക
  alternative: ‘ഇരുമ്പുദണ്ഡുകൊണ്ട് സകല ജനതകളെയും ഭരിക്കുക’
  rationale: സന്ദർഭത്തിൽ രാജകീയ അധികാരം വ്യക്തമായിരുന്നാലും ഗ്രീക്ക് ക്രിയ ποιμαίνω അക്ഷരാർഥത്തിൽ ‘മേയിക്കുക’ എന്നാണ്; അതിനാൽ രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് രാജകീയ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: μέλλει എന്നതിന്റെ ഭാവിമുഖത
  choice: ‘മേയിക്കാനിരിക്കുന്നവനാണ്’
  alternative: ‘മേയിക്കാൻ പോകുന്നവനാണ്’ / ‘മേയിക്കും’
  rationale: ഇത് ഭാവിയിൽ നിശ്ചയിക്കപ്പെട്ട പ്രവർത്തിയെയോ അടുത്തുവരുന്ന പ്രവർത്തിയെയോ സൂചിപ്പിക്കാം. മലയാളരൂപം ഈ ഭാവിമുഖത നിലനിർത്തുന്നു; അനാവശ്യമായി ഉടനടിത്ത്വം മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒരു മകനെ, ഒരു ആൺകുഞ്ഞിനെ’ എന്ന ഘടന മൂലത്തിലെ ആവർത്തന ഊന്നൽ സംരക്ഷിക്കുന്നു. ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് കലർത്താതെ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
