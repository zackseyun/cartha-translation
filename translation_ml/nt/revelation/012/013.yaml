id: REV.12.13
reference: Revelation 12:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: ml
  text: മഹാസർപ്പം താൻ ഭൂമിയിലേക്കു തള്ളപ്പെട്ടതായി കണ്ടപ്പോൾ, ആൺകുഞ്ഞിനെ[b] പ്രസവിച്ച സ്ത്രീയെ പിന്തുടർന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്ത്രീയെ പീഡിപ്പിച്ചു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘പിന്തുടർന്നു’ എന്നും ‘പീഡിപ്പിച്ചു’ എന്നും അർഥമാകാം; ഇവിടെ ശത്രുതാപരമായ പിന്തുടരലും പീഡനവും ഒരുമിച്ച് ഉൾപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘ആണിനെ.’ സ്വാഭാവികമായ അർഥത്തിനായി ‘കുഞ്ഞ്’ എന്നു ചേർത്തിരിക്കുന്നു; ചുറ്റുപാടിലെ വാചകവും താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: മഹാസർപ്പം
  rationale: വെളിപ്പാടിലെ ഭീകരമായ അപോകലിപ്റ്റിക ദൃശ്യത്തെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ ഭാഷയിലും പൊതുവായ ഉപയോഗത്തിലും സ്വാഭാവികമായ പദം; ‘പാമ്പ്’ എന്നു മാറ്റി മറ്റൊരു ദൃശ്യവുമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: ἐβλήθη
  choice: തള്ളപ്പെട്ടതായി
  rationale: βάλλωയുടെ ബലപ്രയോഗവും കർമണിപ്രയോഗവും നിലനിർത്തുന്നു; കണ്ട സംഭവത്തിനു മുമ്പേ തള്ളപ്പെട്ടെന്ന കാലബന്ധം മലയാളത്തിൽ ‘-പ്പെട്ടതായി കണ്ടപ്പോൾ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἰς τὴν γῆν
  choice: ഭൂമിയിലേക്കു
  rationale: ചുറ്റുപാടിലെ സ്വർഗം–ഭൂമി വൈരുധ്യത്തിൽ γῆയെ ‘ദേശം’ എന്നതിലുപരി ‘ഭൂമി’ എന്നു നൽകുന്നതാണ് യോജിച്ചത്.
- source_word: ἐδίωξεν
  choice: പിന്തുടർന്നു
  rationale: διώκωയുടെ നേരിട്ടുള്ള പിന്തുടരൽ എന്ന അർഥം നിലനിർത്തുന്നു; പീഡിപ്പിക്കൽ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: γυναῖκα
  choice: സ്ത്രീയെ
  rationale: പ്രതീകാത്മക വ്യക്തിത്വം വ്യാഖ്യാനിച്ച് ചേർക്കാതെ γυνήയുടെ സാധാരണ അർഥം നൽകുന്നു.
- source_word: ἥτις
  choice: '... പ്രസവിച്ച'
  rationale: മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണവാക്യഘടന; ‘ആ സ്ത്രീ’യുടെ മുൻകൃത്യത്തെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἔτεκεν
  choice: പ്രസവിച്ച
  rationale: τίκτωയുടെ ‘ജന്മം നൽകുക’ എന്ന നേരിട്ടുള്ള അർഥം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸν ἄρσενα
  choice: ആൺകുഞ്ഞിനെ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ആണിനെ’ എന്നാണ്; സന്ദർഭം ആവശ്യപ്പെടുന്ന ‘കുഞ്ഞ്’ ചേർത്ത് ലിംഗത്തെക്കുറിച്ചുള്ള ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്ത്രീയുടെയും ആൺകുഞ്ഞിന്റെയും പ്രതീകാത്മക വ്യക്തിത്വം
  choice: ‘സ്ത്രീ’, ‘ആൺകുഞ്ഞ്’ എന്നീ മൂലദൃശ്യങ്ങൾ വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: സ്ത്രീയെ മറിയം, ഇസ്രായേൽ, അല്ലെങ്കിൽ ദൈവജനം/സഭ എന്നും കുഞ്ഞിനെ വ്യക്തമായി ഒരു പ്രത്യേക തിരിച്ചറിയലോടെയും പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ അപോകലിപ്റ്റിക പ്രതീകങ്ങളുടെ സൂചനയെക്കുറിച്ച് പല വ്യാഖ്യാനങ്ങളുണ്ട്; ഗ്രീക്ക് വാചകം പറയുന്നതിലപ്പുറം വിവർത്തനം ആ ചോദ്യം തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനയ്ക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മഹാസർപ്പം’ അപോകലിപ്റ്റിക ദൃശ്യത്തിന്റെ ഭീകരത സൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ [a], [b] എന്ന ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
