id: REV.12.11
reference: Revelation 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: ml
  text: കുഞ്ഞാടിന്റെ രക്തംകൊണ്ടും തങ്ങളുടെ സാക്ഷ്യവചനത്താലും അവർ അവനെ ജയിച്ചു[a]. മരണംവരെ അവർ തങ്ങളുടെ ജീവനെ സ്നേഹിച്ചില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ അതിജയിച്ചു.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ psychē എന്ന പദത്തിന് ‘ജീവൻ,’ ‘സ്വയം,’ അല്ലെങ്കിൽ ‘ആത്മാവ്’ എന്നിങ്ങനെ അർഥങ്ങളുണ്ടാകാം. ഇവിടെ ‘മരണംവരെ’ എന്ന പ്രയോഗം സൂചിപ്പിക്കുന്നതുപോലെ, അർഥം സ്വന്തം ജീവൻ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν
  choice: ജയിച്ചു
  rationale: യുദ്ധത്തിന്റെയും വിജയത്തിന്റെയും ദൃശ്യഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം; ‘അതിജയിച്ചു’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് നേരിട്ട് ഗ്രഹിക്കാം.
- source_word: διὰ τὸ αἷμα
  choice: രക്തംകൊണ്ട്
  rationale: διά + accusative ഇവിടെ മാർഗമോ അടിസ്ഥാനകാരണമോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ ഉപകരണാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു; കാരണാർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: τοῦ ἀρνίου
  choice: കുഞ്ഞാടിന്റെ
  rationale: വെളിപ്പാടിലെ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന യാഗപരവും അന്ത്യകാലപരവുമായ പ്രതീകം നിലനിർത്തുന്നു.
- source_word: διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν
  choice: തങ്ങളുടെ സാക്ഷ്യവചനത്താൽ
  rationale: λόγος, μαρτυρία എന്നീ രണ്ടു ആശയങ്ങളും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂക്ഷിക്കുന്നു; അവർ പ്രസ്താവിച്ച സാക്ഷ്യസന്ദേശം എന്ന അർഥം നൽകുന്നു.
- source_word: οὐκ ἠγάπησαν
  choice: പ്രിയപ്പെട്ടതായി കരുതിയില്ല
  rationale: ഇവിടെ ‘സ്നേഹിച്ചില്ല’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ ജീവനെ അവഗണിച്ചു എന്ന തെറ്റായ ധ്വനി നൽകാം. മരണത്തെ ഒഴിവാക്കാൻ ജീവനെ പരമമായി വിലമതിച്ചില്ല എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: τὴν ψυχὴν αὐτῶν
  choice: തങ്ങളുടെ ജീവനെ
  rationale: ψυχή എന്നത് ജീവൻ, സ്വയം, ആത്മാവ് എന്നിവ സൂചിപ്പിക്കാം. രക്തസാക്ഷിത്വവും മരണവും പറയുന്ന സന്ദർഭത്തിൽ ഭൂമിയിലെ ജീവൻ എന്ന അർഥമാണ് ഏറ്റവും യോജിച്ചത്; ഗ്രീക്കിലെ വിതരണാർഥമുള്ള ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: ἄχρι θανάτου
  choice: മരണത്തോളം
  rationale: അവരുടെ വിശ്വസ്തത മരണത്തിൽ എത്തുന്ന അറ്റംവരെ നീണ്ടുവെന്ന ഗൗരവമുള്ള അർഥം സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: കുഞ്ഞാടിന്റെ രക്തത്തിലൂടെയുള്ള വിജയത്തിന്റെ അർഥം
  choice: ‘രക്തംകൊണ്ട്’ എന്നു മാർഗാർഥത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കുഞ്ഞാടിന്റെ രക്തം നിമിത്തം’ എന്ന കാരണാർഥത്തിലുള്ള പരിഭാഷ.
  rationale: വിശുദ്ധരുടെ വിജയം കുഞ്ഞാടിന്റെ യാഗമരണത്തിൽ അധിഷ്ഠിതമാണെന്ന് വാക്യം വ്യക്തമാക്കുന്നു. എന്നാൽ മൂലപാഠം വിശദീകരിക്കാത്ത പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: രക്തസാക്ഷിത്വസന്ദർഭത്തിലെ ψυχή
  choice: ‘ജീവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘സ്വയം’.
  rationale: ശരീരം–ആത്മാവ് എന്ന വേർതിരിവ് വാക്യത്തിൽ അനാവശ്യമായി കൊണ്ടുവരാതിരിക്കാനും, മരിക്കാൻ പോലും തയ്യാറായിരുന്നുവെന്ന സന്ദർഭാർഥം നിലനിർത്താനും ‘ജീവൻ’ യോജിക്കുന്നു.
- issue: ജീവനെ സ്നേഹിക്കാതിരുന്നതിന്റെ ധ്വനി
  choice: ജീവൻ പ്രിയപ്പെട്ടതല്ലെന്നല്ല, മരണത്തെ ഒഴിവാക്കാൻ അതിനെ പരമമായി പിടിച്ചുനിന്നില്ല എന്ന രീതിയിൽ അവതരിപ്പിച്ചു.
  alternative: അക്ഷരാർഥമായി ‘തങ്ങളുടെ ജീവനെ സ്നേഹിച്ചില്ല’.
  rationale: οὐκ ἠγάπησαν എന്ന രൂപം നിലനിർത്തിക്കൊണ്ട്, ജീവന്റെ മൂല്യം നിഷേധിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ സന്ദർഭാർഥമുള്ള സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ഒരുമിച്ച് നിലനിർത്തി. ‘കുഞ്ഞാട്,’ ‘രക്തം,’ ‘സാക്ഷ്യം,’ ‘മരണം’ എന്നീ വെളിപ്പാടിന്റെ പ്രധാന പ്രതീകങ്ങളും പദബന്ധങ്ങളും സംരക്ഷിച്ചു; അനാവശ്യമായ സഭാവിഭാഗീയ വ്യാഖ്യാനം ഒഴിവാക്കി.
