id: REV.12.8
reference: Revelation 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ⸀ἴσχυσεν, οὐδὲ τόπος εὑρέθη ⸀αὐτῶν ἔτι ἐν τῷ οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: ml
  text: എന്നാൽ അവനു ജയിക്കാനുള്ള ശക്തിയുണ്ടായില്ല[a]; അവർക്കായി സ്വർഗത്തിൽ മേലാൽ ഒരു ഇടവും കണ്ടെത്തപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ജയിച്ചില്ല.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ശക്തനായിരിക്കുക, കഴിവുണ്ടായിരിക്കുക, ജയിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ യുദ്ധവിവരണത്തോട് ഇവിടെ വരുന്ന പരാജയത്തെ വിരുദ്ധമായി ബന്ധിപ്പിക്കുന്നതിനാൽ, സന്ദർഭത്തിലെ adversative force സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: οὐκ ἴσχυσεν
  choice: അവനു ജയിക്കാനുള്ള ശക്തിയുണ്ടായില്ല
  rationale: ἰσχύω എന്ന ക്രിയയിലെ ‘ശക്തനായിരിക്കുക/കഴിവുണ്ടാകുക’ എന്ന അർഥവും യുദ്ധസന്ദർഭത്തിലെ ‘ജയിക്കുക’ എന്ന സാധ്യതയും ഒരുമിച്ച് നിലനിർത്തുന്നു; ഏകവചനക്രിയ മുൻവാക്യത്തിലെ മഹാസർപ്പത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: οὐδὲ
  choice: …ഇല്ല
  rationale: മുൻനിഷേധത്തോടു ചേർന്ന രണ്ടാമത്തെ നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായ സമാന്തരഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: τόπος
  choice: ഇടം
  rationale: സ്വർഗീയ മണ്ഡലത്തിലെ സ്ഥാനം/സ്ഥലം എന്ന നേരിട്ടുള്ള അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: εὑρέθη
  choice: കണ്ടെത്തപ്പെട്ടില്ല
  rationale: ഗ്രീക്കിലെ aorist passive രൂപം സംരക്ഷിക്കുന്നു; ‘ഇടമുണ്ടായിരുന്നില്ല’ എന്നു ലളിതമാക്കി passive/resultative ഭാവം നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: αὐτῶν
  choice: അവർക്കായി
  rationale: മഹാസർപ്പത്തെയും അവന്റെ ദൂതന്മാരെയും കൂട്ടമായി സൂചിപ്പിക്കുന്ന genitive ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔτι
  choice: മേലാൽ
  rationale: നിഷേധസന്ദർഭത്തിൽ ‘ഇനി ഒരിക്കലും/ഇനിമുതൽ ഇല്ല’ എന്ന no longer എന്ന കാലപരമായ മാറ്റം സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: ഇവിടെ ദൃശ്യമായ ആകാശമല്ല, സ്വർഗീയ മണ്ഡലമാണ് ഉദ്ദേശിക്കുന്നത്.
theological_decisions:
- issue: ἴσχυσεν എന്ന ഏകവചനക്രിയയുടെ കർത്താവ്
  choice: ‘അവൻ’—മുൻവാക്യത്തിലെ മഹാസർപ്പം
  alternative: ‘അവർ ജയിച്ചില്ല’ എന്ന കൂട്ടവായന
  rationale: ഗ്രീക്ക് ഏകവചനക്രിയ മഹാസർപ്പത്തെ തുടർന്നും കർത്താവായി നിലനിർത്തുന്നു; തുടർന്ന് αὐτῶν മഹാസർപ്പത്തെയും അവന്റെ ദൂതന്മാരെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- issue: οὐκ ἴσχυσεν എന്നതിലെ ശക്തി/ജയം എന്ന അർഥവ്യാപ്തി
  choice: ‘ജയിക്കാനുള്ള ശക്തിയുണ്ടായില്ല’
  alternative: ‘അവൻ ജയിച്ചില്ല’ അല്ലെങ്കിൽ ‘അവനു ശക്തിയുണ്ടായില്ല’
  rationale: യുദ്ധത്തിലെ ഫലമായ ‘ജയിക്കുക’ എന്ന അർഥവും ക്രിയയുടെ അടിസ്ഥാനമായ ശക്തി/കഴിവ് എന്ന അർഥവും ചേർത്ത്, ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് അർഥം ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ഗ്രീക്കിലെ ഏകവചനവും തുടർന്ന് വരുന്ന ബഹുവചനസൂചനയും passive ഘടനയും സംരക്ഷിച്ചിട്ടുണ്ട്.
