id: REV.12.14
reference: Revelation 12:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: ml
  text: സ്ത്രീക്കു ആ വലിയ കഴുകന്റെ രണ്ടു ചിറകുകൾ നൽകപ്പെട്ടു; അങ്ങനെ അവൾ മരുഭൂമിയിൽ തനിക്കുള്ള സ്ഥലത്തേക്കു പറന്നുചെല്ലേണ്ടതിനായിരുന്നു. അവിടെ, സർപ്പത്തിന്റെ സന്നിധിയിൽനിന്ന് അകലെ, അവൾ ഒരു കാലവും കാലങ്ങളും അരക്കാലവും പോഷിപ്പിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: വലിയ കഴുകന്റെ രണ്ടു ചിറകുകൾ
  rationale: ഗ്രീക്ക് പദക്രമത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; നിർദ്ദിഷ്ടമായ ‘രണ്ടു ചിറകുകൾ’ സംരക്ഷിക്കുന്നു.
- source_word: ἔρημον
  choice: മരുഭൂമി
  rationale: വെളിപ്പാട് 12-ലെ അഭയസ്ഥാനസന്ദർഭത്തിന് യോജിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: τρέφεται
  choice: പോഷിപ്പിക്കപ്പെടുകയും
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിന്റെ അർത്ഥം നിലനിർത്തുന്നു; പോഷിപ്പിക്കുന്നത് ആരെന്നത് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അതു തുറന്നുവയ്ക്കുന്നു.
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: ഒരു കാലവും കാലങ്ങളും അരക്കാലവും
  rationale: എണ്ണത്തെ വ്യാഖ്യാനിച്ച് തീർക്കാതെ മൂലപാഠത്തിലെ പ്രതീകാത്മകവും ഉദ്ദേശപൂർവം അസാധാരണവുമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: സർപ്പത്തിന്റെ സന്നിധിയിൽനിന്ന് അകലെ
  rationale: πρόσωπον എന്ന സാന്നിധ്യസൂചക ശൈലി സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുകയും സംരക്ഷണപരമായ അകലം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഒരു കാലവും കാലങ്ങളും അരക്കാലവും’ എന്ന കാലപരിധിയുടെ വ്യാഖ്യാനം
  choice: പ്രതീകാത്മക പ്രയോഗം അതേപടി നിലനിർത്തി
  alternative: മൂന്നര വർഷം
  rationale: മൂലപാഠം നേരിട്ട് ‘മൂന്നര വർഷം’ എന്നു പറയുന്നില്ല; ആ വ്യാഖ്യാനം മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ.
- issue: സ്ത്രീയെ പോഷിപ്പിക്കുന്ന കർത്താവ്
  choice: കർമണിപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കാതെ നിലനിർത്തി
  alternative: ദൈവം അവളെ പോഷിപ്പിക്കുന്നു
  rationale: സന്ദർഭത്തിൽ ദൈവിക പരിപാലനം സൂചിപ്പിക്കാമെങ്കിലും ഈ വാക്യത്തിൽ പ്രവർത്തകനെ ഗ്രീക്ക് പാഠം പേരെടുത്തുപറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഗ്രീക്കിലെ ആവർത്തനാത്മകമായ സ്ഥലസൂചന (‘തനിക്കുള്ള സ്ഥലം’, ‘അവിടെ’) അർത്ഥവ്യക്തതയോടെ സംരക്ഷിച്ചു; വാക്യഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ക്രമപ്പെടുത്തി.
