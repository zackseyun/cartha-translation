id: REV.18.4
reference: Revelation 18:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: ml
  text: 'പിന്നെ സ്വർഗത്തിൽനിന്ന് മറ്റൊരു ശബ്ദം ഇങ്ങനെ പറയുന്നതു ഞാൻ കേട്ടു: “എന്റെ ജനമേ, അവളിൽനിന്ന് പുറത്തുവരുക[a]; അങ്ങനെ നിങ്ങൾ അവളുടെ പാപങ്ങളിൽ പങ്കുചേരാതിരിക്കാനും[b] അവളുടെ ബാധകളിൽനിന്ന് ഒരു ബാധയും നിങ്ങൾക്കു ഏൽക്കാതിരിക്കാനും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവളെ വിട്ടുപോകുക’ എന്നും പരിഭാഷപ്പെടുത്താം. Ἐξέλθατε എന്ന ആജ്ഞയ്ക്ക് ‘പുറത്തുവരുക’ എന്നോ ‘വിട്ടുപോകുക’ എന്നോ ഉള്ള അർഥം സന്ദർഭാനുസരണം നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘അവൾ’ എന്നു പറയുന്നത് ബാബിലോണിനെയാണ്. ഗ്രന്ഥം നഗരത്തെയും അതു പ്രതിനിധാനം ചെയ്യുന്ന വ്യവസ്ഥയെയും ഒരു സ്ത്രീയായി വ്യക്തിവൽക്കരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: മറ്റൊരു ശബ്ദം
  rationale: മുമ്പുള്ള ശബ്ദത്തിൽനിന്നു വ്യത്യസ്തമായ, കൂടിയൊരു ശബ്ദത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ഇവിടെ οὐρανός ആകാശമണ്ഡലത്തെയല്ല, സ്വർഗീയ മണ്ഡലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: Ἐξέλθατε
  choice: പുറത്തുവരുക
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപമാണിത്. മലയാളത്തിൽ സമൂഹത്തോടുള്ള നേരിട്ടുള്ള ആഹ്വാനമായി ‘പുറത്തുവരുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ὁ λαός μου
  choice: എന്റെ ജനമേ
  rationale: ഗ്രീക്കിലെ സംബോധനശക്തിയും ഉടമ്പടിപരമായ അടുപ്പവും മലയാളത്തിലെ ‘-മേ’ രൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐξ αὐτῆς
  choice: അവളിൽനിന്ന്
  rationale: ബാബിലോണിനെ സ്ത്രീയായി വ്യക്തിവൽക്കരിക്കുന്ന വെളിപ്പാടിലെ ദൃശ്യഭാഷ നപുംസകരൂപമാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς
  choice: നിങ്ങൾ അവളുടെ പാപങ്ങളിൽ പങ്കുചേരാതിരിക്കാനും
  rationale: συγκοινωνέω സൂചിപ്പിക്കുന്ന പങ്കാളിത്തവും കൂട്ടുത്തരവാദിത്വത്തിന്റെ ധ്വനിയും ‘പങ്കുചേരുക’ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε
  choice: അവളുടെ ബാധകളിൽ ഒന്നും ഏൽക്കാതിരിക്കാനും
  rationale: ἐκ എന്നതിലെ ഭാഗികത ‘ഒന്നും’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; λάβητε ഇവിടെ ശിക്ഷാബാധ അനുഭവിക്കുകയെന്ന അർഥത്തിൽ ‘ഏൽക്കുക’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: αὐτῆς എന്ന സ്ത്രീലിംഗ സർവനാമത്തിന്റെ സൂചിതം
  choice: ബാബിലോണിനെ വ്യക്തിവൽക്കരിക്കുന്ന സ്ത്രീലിംഗം ‘അവൾ/അവളുടെ’ എന്നു നിലനിർത്തി.
  alternative: നഗരം അഥവാ വ്യവസ്ഥ എന്ന നിലയിൽ ‘അത്/അതിന്റെ’ എന്നു നൽകുക.
  rationale: വെളിപ്പാട് ബാബിലോണിനെ സ്ത്രീയായും നഗരമായും അവതരിപ്പിക്കുന്നു. സ്ത്രീലിംഗം നിലനിർത്തുന്നത് വ്യാഖ്യാനം കൂട്ടിച്ചേർക്കാതെ ആ സാഹിത്യദൃശ്യം സംരക്ഷിക്കുന്നു.
- issue: ആവർത്തിക്കുന്ന രണ്ട് ἵνα μὴ ഉപവാക്യങ്ങളുടെ ബന്ധം
  choice: രണ്ടിനെയും ഏകോപിതമായ ഉദ്ദേശ്യ/മുന്നറിയിപ്പ് ഉപവാക്യങ്ങളായി ‘…ആതിരിക്കാനും …ആതിരിക്കാനും’ എന്നു നൽകി.
  alternative: രണ്ടാമത്തേതിനെ ഒന്നാമത്തേതിന്റെ വിശദീകരണമായി നൽകുക.
  rationale: ἵναയുടെ ആവർത്തനം രണ്ടു സമാന്തര ഉദ്ദേശ്യങ്ങളെയോ മുന്നറിയിപ്പുകളെയോ ഊന്നിപ്പറയുന്നു; മലയാളത്തിലെ സമാന്തര ഘടന അത് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പൊതുവായ വായനയ്ക്ക് വ്യക്തമായ മലയാളം ഉപയോഗിച്ചു. ‘പുറത്തുവരുവിൻ’ പോലുള്ള പഴയ ബൈബിൾശൈലി ഒഴിവാക്കി ‘പുറത്തുവരുക’ എന്ന മാന്യവും നിലവിലുള്ളതുമായ ആജ്ഞാരൂപം സ്വീകരിച്ചു; കവിതാത്മകമായ വ്യക്തിവൽക്കരണവും ഇരട്ട മുന്നറിയിപ്പിന്റെ സമാന്തരതയും നിലനിർത്തി.
