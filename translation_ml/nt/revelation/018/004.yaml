  to: 'പിന്നെ സ്വർഗത്തിൽനിന്ന് മറ്റൊരു ശബ്ദം ഇങ്ങനെ പറയുന്നതു ഞാൻ കേട്ടു: “എന്റെ ജനമേ, അവളിൽനിന്ന് പുറത്തുവരുക[a]; അങ്ങനെ നിങ്ങൾ അവളുടെ പാപങ്ങളിൽ പങ്കുചേരാതിരിക്കാനും[b] അവളുടെ ബാധകളിൽനിന്ന് ഒരു ബാധയും നിങ്ങൾക്കു ഏൽക്കാതിരിക്കാനും.”'
  rationale: 'The revision only clarifies the final clause’s ἐκ τῶν πληγῶν αὐτῆς: the hearers are warned not to receive even one plague from among those belonging to Babylon. It retains the source order, feminine imagery, direct summons, and the parallel force of the two ἵνα clauses. Footnote anchors and the supplied footnote purposes remain intact.'
