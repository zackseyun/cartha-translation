revisions:
- from: 'അപ്പോൾ ശക്തനായ ഒരു ദൂതൻ വലിയൊരു തിരികല്ലുപോലെയുള്ള ഒരു കല്ല് എടുത്ത് കടലിലേക്ക് എറിഞ്ഞുകൊണ്ട് പറഞ്ഞു: “ഇതുപോലെ, മഹാനഗരമായ ബാബിലോൻ അതിശക്തമായി എറിയപ്പെടും[a]; ഇനി ഒരിക്കലും അതിനെ കണ്ടെത്തുകയില്ല.”'
  to: 'ഒരു ശക്തനായ ദൂതൻ വലിയ തിരികല്ലുപോലെയുള്ള ഒരു കല്ല് ഉയർത്തിയെടുത്ത് കടലിലേക്കു എറിഞ്ഞു, ഇങ്ങനെ പറഞ്ഞു: “ഇതുപോലെ മഹാനഗരമായ ബാബിലോൻ ബലത്തോടെ എറിയപ്പെടും[a]; ഇനി ഒരിക്കലും കണ്ടെത്തപ്പെടുകയില്ല.”'
  rationale: The revision retains the comparison rather than identifying the stone outright as a millstone, makes the angel's lifting action explicit, preserves the simple connective force of Καὶ, and renders the final clause in a Malayalam passive that mirrors the Greek. The lexical note remains anchored to «ബലത്തോടെ» and preserves the disputed semantic range of ὁρμήματι without imposing an interpretive scheme.
