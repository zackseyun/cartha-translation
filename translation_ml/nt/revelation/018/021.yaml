id: REV.18.21
reference: Revelation 18:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: ml
  text: 'ഒരു ശക്തനായ ദൂതൻ വലിയ തിരികല്ലുപോലെയുള്ള ഒരു കല്ല് ഉയർത്തിയെടുത്ത് കടലിലേക്കു എറിഞ്ഞു, ഇങ്ങനെ പറഞ്ഞു: “ഇതുപോലെ മഹാനഗരമായ ബാബിലോൻ ബലത്തോടെ എറിയപ്പെടും[a]; ഇനി ഒരിക്കലും കണ്ടെത്തപ്പെടുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആവേഗത്തോടെ,” “ശക്തിയോടെ,” അല്ലെങ്കിൽ “ഉഗ്രമായി” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം പെട്ടെന്നുള്ളതും ശക്തമായതുമായ ചലനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρεν
  choice: എടുത്ത്
  rationale: ദൂതൻ പ്രതീകാത്മക പ്രവൃത്തിക്കായി കല്ല് കൈയിലെടുക്കുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ ഉയർത്തുക എന്ന ചലനവും ഉൾക്കൊള്ളാം.
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: ശക്തനായ ഒരു ദൂതൻ
  rationale: εἷς സൂചിപ്പിക്കുന്ന ഏക ദൂതനെ നിലനിർത്തുകയും ἰσχυρός എന്നതിന്റെ ശക്തിയുള്ള/പ്രബലമായ അർഥം ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: λίθον ὡς μύλινον μέγαν
  choice: വലിയൊരു തിരികല്ലുപോലെയുള്ള ഒരു കല്ല്
  rationale: ὡς എന്ന ഉപമാസൂചകം നിലനിർത്തുന്നു; കല്ലിനെ തിരികല്ലായി നേരിട്ട് തിരിച്ചറിയാതെ അതിനോടു താരതമ്യം ചെയ്യുന്നു.
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: കടലിലേക്ക് എറിഞ്ഞുകൊണ്ട്
  rationale: βάλλωയുടെ ശക്തമായ എറിയൽപ്രവൃത്തി സ്വാഭാവികമായി നൽകുന്നു; λέγων-നോടുള്ള പ്രവൃത്തിബന്ധവും മലയാളത്തിൽ സുഗമമാക്കുന്നു.
- source_word: Οὕτως
  choice: ഇതുപോലെ
  rationale: ദൂതന്റെ പ്രതീകാത്മക പ്രവൃത്തിയെയും തുടർന്ന് പ്രഖ്യാപിക്കുന്ന ബാബിലോന്റെ വീഴ്ചയെയും നേരിട്ട് ബന്ധിപ്പിക്കുന്നു.
- source_word: ὁρμήματι
  choice: അതിശക്തമായി
  rationale: പദം സൂചിപ്പിക്കുന്ന പെട്ടെന്നുള്ള, പ്രബലമായ, ഉഗ്രമായ ചലനം മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: βληθήσεται
  choice: എറിയപ്പെടും
  rationale: മുമ്പത്തെ ἔβαλεν എന്ന ക്രിയയുമായുള്ള ഉദ്ദേശ്യപൂർവമായ പ്രതിധ്വനി നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘താഴേക്ക്’ എന്ന ഘടകം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: മഹാനഗരമായ ബാബിലോൻ
  rationale: ബാബിലോനെയും ‘മഹാനഗരം’ എന്ന വിശേഷണത്തെയും വ്യക്തമായി ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: ഇനി ഒരിക്കലും അതിനെ കണ്ടെത്തുകയില്ല
  rationale: οὐ μήയുടെ ഊന്നിയ നിഷേധവും ἔτιയുടെ ‘ഇനി/മേലാൽ’ എന്ന അന്തിമത്വവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ബാബിലോന്റെ നാശചിത്രത്തിന്റെ സ്വഭാവം
  choice: ന്യായവിധിയുടെ ശക്തിയും അന്തിമത്വവും നിലനിർത്തി; ‘ബാബിലോൻ’ അക്ഷരാർഥത്തിലുള്ള നഗരമാണോ പ്രതീകമാണോ രണ്ടും കൂടിയാണോ എന്ന് നിർണ്ണയിച്ചില്ല.
  alternative: ബാബിലോനെ അക്ഷരാർഥത്തിലുള്ള പുരാതന/ഭാവി നഗരമായോ ദൈവവിരുദ്ധ ലോകവ്യവസ്ഥയുടെ മാത്രം പ്രതീകമായോ വ്യക്തമായി നിർവചിക്കുക.
  rationale: വാക്യം പ്രതീകാത്മക പ്രവൃത്തിയും നാശപ്രഖ്യാപനവും അവതരിപ്പിക്കുന്നുവെങ്കിലും ഒരു പ്രത്യേക അന്ത്യകാല വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. പ്രതീകാത്മക ദൃശ്യത്തിന്റെ ഭാരം നിലനിർത്താൻ ‘തിരികല്ല്,’ ‘എറിയപ്പെടും,’ ‘ഇനി ഒരിക്കലും’ എന്നീ നേരിട്ടുള്ള പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു.
