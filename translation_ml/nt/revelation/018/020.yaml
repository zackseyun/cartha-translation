id: REV.18.20
reference: Revelation 18:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: ml
  text: സ്വർഗമേ, അവളെച്ചൊല്ലി ആനന്ദിക്കുക! വിശുദ്ധജനങ്ങളേ, അപ്പൊസ്തലന്മാരേ, പ്രവാചകന്മാരേ, നിങ്ങളും ആനന്ദിക്കുക. കാരണം, ദൈവം നിങ്ങളുടെ ന്യായവിധി അവളിൽനിന്ന് നടപ്പാക്കിയിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: “ദൈവം നിങ്ങൾക്കുവേണ്ടി അവൾക്കെതിരെ വിധി പ്രസ്താവിച്ചിരിക്കുന്നു” അല്ലെങ്കിൽ “ദൈവം നിങ്ങൾക്കുവേണ്ടി അവൾക്കെതിരെ പ്രതികാരം നടത്തിയിരിക്കുന്നു.” ഗ്രീക്ക് പ്രയോഗം ചുരുക്കമുള്ളതാണ്; അക്ഷരാർഥത്തിൽ, “ദൈവം നിങ്ങളുടെ ന്യായവിധി അവളിൽനിന്ന് വിധിച്ചു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐφραίνου
  choice: ആനന്ദിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ ആഹ്വാനസ്വഭാവവും സന്തോഷിക്കാനുള്ള നേരിട്ടുള്ള പ്രേരണയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπ’ αὐτῇ
  choice: അവളെച്ചൊല്ലി
  rationale: ἐπί + ദത്തിവ് ഇവിടെ ആനന്ദത്തിന്റെ വിഷയമോ കാരണമോ സൂചിപ്പിക്കുന്നു. ‘അവളുടെമേൽ’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കി ബന്ധത്തിന്റെ പരിധി അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: οὐρανέ
  choice: സ്വർഗമേ
  rationale: ഏകവചന സംബോധനയുടെ വ്യക്തിവൽക്കരിച്ച, ഗൗരവമുള്ള ആഹ്വാനം നിലനിർത്തുന്നു.
- source_word: οἱ ἅγιοι
  choice: വിശുദ്ധജനങ്ങളേ
  rationale: വെളിപ്പാടിലെ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനങ്ങളെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘വിശുദ്ധന്മാർ’ എന്ന പദത്തിന് ഉണ്ടാകാവുന്ന പ്രത്യേക പാരമ്പര്യാർഥം ഒഴിവാക്കുന്നു.
- source_word: οἱ ἀπόστολοι
  choice: അപ്പൊസ്തലന്മാരേ
  rationale: പ്രവാചകന്മാരോടൊപ്പം വരുന്ന സാങ്കേതിക സഭാപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: οἱ προφῆται
  choice: പ്രവാചകന്മാരേ
  rationale: προφῆται എന്നതിന്റെ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ മലയാളരൂപം.
- source_word: ὅτι
  choice: കാരണം
  rationale: ആനന്ദിക്കാനുള്ള ആഹ്വാനത്തിന്റെ കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἔκρινεν
  choice: വിധിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദൈവിക ന്യായപ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും κρίνω എന്ന ന്യായവിധി-പദസംബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸ κρίμα ὑμῶν
  choice: നിങ്ങളുടെ ന്യായവിധി
  rationale: κρίνω/κρίμα എന്ന സമാനമൂലപദങ്ങളുടെ ആവർത്തനവും ഗ്രീക്കിലെ ചുരുക്കവും സംരക്ഷിക്കുന്നു; ‘നിങ്ങൾക്കുവേണ്ടിയുള്ള വിധി’ എന്ന് മുഖ്യവാക്യത്തിൽ വ്യാഖ്യാനിച്ചുറപ്പിക്കുന്നില്ല.
- source_word: ἐξ αὐτῆς
  choice: അവളിൽനിന്ന്
  rationale: ἐξ എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള ദിശാസംബന്ധം നിലനിർത്തി, ‘അവൾക്കെതിരെ’ അല്ലെങ്കിൽ ‘അവളോട് പ്രതികാരം ചെയ്തു’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ബാബിലോണിനെതിരായി വിശുദ്ധർക്കുവേണ്ടി ദൈവം നടത്തിയ ന്യായപ്രവൃത്തി എത്രത്തോളം തുറന്ന് വ്യാഖ്യാനിക്കണം
  choice: ‘ദൈവം നിങ്ങളുടെ ന്യായവിധി അവളിൽനിന്ന് വിധിച്ചിരിക്കുന്നു’ എന്ന ചുരുക്കമുള്ള ന്യായവിധി-ഭാഷ മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘ദൈവം നിങ്ങൾക്കുവേണ്ടി അവൾക്കെതിരെ വിധി പ്രസ്താവിച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ദൈവം അവളോട് നിങ്ങൾക്കുവേണ്ടി പ്രതികാരം ചെയ്തിരിക്കുന്നു.’
  rationale: ഗ്രീക്ക് κρίνω/κρίμα എന്ന ന്യായവിധി-ഭാഷയാണ് ഉപയോഗിക്കുന്നത്; പ്രതികാരത്തിനുള്ള വ്യക്തമായ ക്രിയയല്ല. ആശയം വിശുദ്ധരുടെ നീതീകരണമോ അവർക്കുവേണ്ടിയുള്ള ശിക്ഷാവിധിയോ ഉൾക്കൊള്ളുന്നുവെങ്കിലും, അത് മുഖ്യപാഠത്തിൽ പൂർണമായി തുറന്നുപറയുന്നത് ഉറവിടത്തിലെ യഥാർത്ഥ ചുരുക്കവും വ്യാഖ്യാനസാധ്യതയും ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ സംബോധനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിൽ ‘സ്വർഗമേ’ ഏകവചന സംബോധനയാണെങ്കിലും തുടർന്നുള്ള നാമസംഘങ്ങളും ആഹ്വാനിക്കപ്പെടുന്നവരായതിനാൽ, മലയാളത്തിൽ അവയെ വ്യക്തമായ സംബോധനരൂപങ്ങളാക്കി ‘നിങ്ങളും ആനന്ദിക്കുക’ എന്നു ചേർത്തു. അവസാന ഉപവാക്യത്തിലെ അസാധാരണമായ ചുരുക്കം ഉദ്ദേശപൂർവം നിലനിർത്തി, സ്വാഭാവികമായ വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
