revisions:
- from: സ്വർഗമേ, അവളെച്ചൊല്ലി ആനന്ദിക്കുക! വിശുദ്ധജനങ്ങളേ, അപ്പൊസ്തലന്മാരേ, പ്രവാചകന്മാരേ, നിങ്ങളും ആനന്ദിക്കുക. കാരണം, ദൈവം നിങ്ങളുടെ ന്യായവിധി അവളിൽനിന്ന് വിധിച്ചിരിക്കുന്നു.[a]
  to: സ്വർഗമേ, അവളെച്ചൊല്ലി ആനന്ദിക്കുക! വിശുദ്ധജനങ്ങളേ, അപ്പൊസ്തലന്മാരേ, പ്രവാചകന്മാരേ, നിങ്ങളും ആനന്ദിക്കുക. കാരണം, ദൈവം നിങ്ങളുടെ ന്യായവിധി അവളിൽനിന്ന് നടപ്പാക്കിയിരിക്കുന്നു.[a]
  rationale: The revision changes only the awkward Malayalam realization of the compressed κρίνω/κρίμα clause. It retains ‘നിങ്ങളുടെ ന്യായവിധി’ and ‘അവളിൽനിന്ന്’ in the main text, thereby avoiding an interpretive expansion to ‘for you against her,’ while using a natural Malayalam construction for God’s completed judicial action. The footnote continues to identify the more explicit readings as interpretive alternatives.
