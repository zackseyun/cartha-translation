id: REV.18.8
reference: Revelation 18:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഒരൊറ്റ ദിവസത്തിൽത്തന്നെ അവളുടെ ബാധകൾ വന്നെത്തും: മരണവും ദുഃഖവും ക്ഷാമവും; കൂടാതെ അവൾ തീയിൽ ദഹിപ്പിക്കപ്പെടും. കാരണം, അവളെ ന്യായംവിധിച്ച കർത്താവായ ദൈവം ശക്തനാണ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: ഒരൊറ്റ ദിവസത്തിൽത്തന്നെ
  rationale: സംഭവങ്ങളുടെ പെട്ടെന്നുള്ളതും കേന്ദ്രീകൃതവുമായ വരവ് ഊന്നിപ്പറയുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: αἱ πληγαὶ
  choice: ബാധകൾ
  rationale: ന്യായവിധിയായി വരുന്ന വിനാശകരമായ പ്രഹരങ്ങൾ എന്ന അർഥം നിലനിർത്തുന്ന, വെളിപ്പാട് സാഹിത്യത്തിന് യോജിച്ച പൊതുവായ പദം.
- source_word: πένθος
  choice: ദുഃഖം
  rationale: വിലാപവും ശോകവും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: λιμός
  choice: ക്ഷാമം
  rationale: ഭക്ഷ്യക്ഷാമം അഥവാ famine എന്ന അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: അവൾ തീയിൽ വെന്തുപോകും
  rationale: തീകൊണ്ട് പൂർണമായി ദഹിപ്പിക്കപ്പെടുക എന്ന κατακαίωയുടെ ശക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കർമണിപ്രയോഗത്തിന്റെ ആശയം നിലനിൽക്കുന്നു.
- source_word: ἰσχυρός
  choice: ശക്തനാണ്
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘സർവശക്തൻ’ പോലുള്ള കൂടുതൽ പ്രത്യേകമായ ദൈവശാസ്ത്രപദം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ὅτι എന്ന ബന്ധകത്തിന്റെ അർഥം
  choice: കാരണം
  alternative: തീർച്ചയായും / എന്തെന്നാൽ
  rationale: ദൈവത്തിന്റെ ശക്തിയാണ് വിധിയുടെ ഉറപ്പിനും നിർവഹണത്തിനും അടിസ്ഥാനം എന്ന കാരണബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- issue: ὁ κρίνας αὐτήν എന്ന aorist participle
  choice: അവളെ ന്യായംവിധിച്ച
  alternative: അവളെ ന്യായംവിധിക്കുന്ന
  rationale: ഗ്രീക്കിലെ ഭൂതകാലപരമായ participle ഔപചാരികമായി സംരക്ഷിക്കുന്നു; ദർശനത്തിലെ വിധി ഉറപ്പായിത്തീർന്നതായി അവതരിപ്പിക്കുന്ന ഭാവവും നിലനിർത്തുന്നു.
- issue: κύριος ὁ θεός എന്ന ദൈവനാമപ്രയോഗം
  choice: കർത്താവായ ദൈവം
  alternative: കർത്താവു ദൈവം
  rationale: κύριος, θεός എന്നീ രണ്ടു പദങ്ങളും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളഘടന.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സുഗമവുമായ മലയാളം. വിധിയുടെ പെട്ടെന്നുള്ള വരവ് പ്രകടമാക്കാൻ ‘ഒരൊറ്റ...ത്തന്നെ’ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ പട്ടികാസ്വഭാവം ദീർഘവിരാമവും പൂർണവിരാമവും ഉപയോഗിച്ച് വ്യക്തമായി അവതരിപ്പിച്ചു.
