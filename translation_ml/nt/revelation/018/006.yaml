id: REV.18.6
reference: Revelation 18:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν, καὶ ⸀διπλώσατε ⸀τὰ διπλᾶ κατὰ τὰ ἔργα αὐτῆς· ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν κεράσατε αὐτῇ διπλοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: ml
  text: അവൾതന്നെ പകരം കൊടുത്തതുപോലെ അവൾക്കു പകരം കൊടുക്കുക; അവളുടെ പ്രവൃത്തികൾക്കനുസരിച്ച് അവൾക്കു ഇരട്ടിയായി പകരം കൊടുക്കുക.[a] അവൾ കലക്കിയ പാനപാത്രത്തിൽ അവൾക്കു ഇരട്ടി അളവിൽ കലക്കുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾക്കു ഇരട്ടിയായതു ഇരട്ടിപ്പിക്കുക.” ഗ്രീക്ക് പ്രയോഗം ശക്തവും സംക്ഷിപ്തവുമാണ്; അത് തീവ്രമാക്കിയ പ്രതിഫലത്തെ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അവൾ കലക്കി ഒരുക്കിയ പാനപാത്രം; ഈ ദൃശ്യം ന്യായവിധിയുടെ പാനീയത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: അവൾ കൊടുത്തതുപോലെതന്നെ അവൾക്കു തിരികെ കൊടുക്കുക
  rationale: ἀποδίδωμι എന്ന ക്രിയയുടെ പ്രതികാരപരമായ തിരിച്ചുനൽകൽ എന്ന അർഥവും αὐτή നൽകുന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διπλώσατε τὰ διπλᾶ
  choice: അവൾക്കു ഇരട്ടി പകരം കൊടുക്കുക
  rationale: ഗ്രീക്കിലെ ശക്തവും സംക്ഷിപ്തവുമായ ആവർത്തനപ്രയോഗത്തെ വായനാസൗകര്യത്തോടെ അവതരിപ്പിക്കുമ്പോഴും ഇരട്ടിയായ പ്രതിഫലത്തിന്റെ തീവ്രത സംരക്ഷിക്കുന്നു.
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: അവളുടെ പ്രവൃത്തികൾക്കനുസരിച്ച്
  rationale: ἔργα എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും പ്രവൃത്തിക്ക് അനുസൃതമായ ന്യായവിധിയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν
  choice: അവൾ കലക്കിയ പാനപാത്രത്തിൽ
  rationale: κεράννυμι സൂചിപ്പിക്കുന്ന പാനീയം കലക്കി ഒരുക്കുന്ന ദൃശ്യവും വെളിപ്പാടിലെ പാനപാത്രപ്രതീകവും സംരക്ഷിക്കുന്നു.
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: അവൾക്കായി ഇരട്ടി അളവ് കലക്കുക
  rationale: കലക്കുക എന്ന ആവർത്തിത ക്രിയാചിത്രത്തോടൊപ്പം διπλοῦν സൂചിപ്പിക്കുന്ന ഇരട്ടി അളവ് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഇരട്ടി പകരം നൽകാനുള്ള കല്പനയുടെ സ്വഭാവം
  choice: കാഠിന്യം മയപ്പെടുത്താതെയും കൃത്യമായ നിയമഗണിതമായി നിർവചിക്കാതെയും പ്രതീകാത്മകവും ന്യായവിധിപരവുമായ പ്രതിഫലമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഇരട്ടി’ എന്നത് അക്ഷരാർഥത്തിലുള്ള കൃത്യമായ ശിക്ഷാനുപാതമായി കാണുക, അല്ലെങ്കിൽ ഇരട്ടിപ്പിക്കൽ എന്ന ദൃശ്യം ഒഴിവാക്കി പൊതുവായ നീതിയായി പരാവർത്തനം ചെയ്യുക.
  rationale: അപ്പോക്കലിപ്റ്റിക് ന്യായവിധിഭാഷയിൽ ഇത് ബാബിലോണിനുള്ള തീവ്രമായ പ്രതിഫലത്തെ ചിത്രീകരിക്കുന്നു. ഇരട്ടിപ്പിക്കൽ കൃത്യമായ അളവാണോ വാഗ്‌വൈഭവപരമായ ഊന്നലാണോ എന്നത് പരിഭാഷ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കല്പനാരൂപങ്ങൾ ഉപയോഗിച്ചു. ‘പാനപാത്രം’, ‘പ്രവൃത്തികൾ’, ‘പകരം’ എന്നീ പദങ്ങൾ വെളിപ്പാടിന്റെ ന്യായവിധിഭാവവും പ്രതീകാത്മകതയും നിലനിർത്തുന്നു.
