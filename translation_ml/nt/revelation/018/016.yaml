revisions:
- from: 'പറഞ്ഞു: “അയ്യോ, അയ്യോ[a], നേർത്ത ചണവസ്ത്രവും ധൂമ്രവസ്ത്രവും കടുംചുവപ്പുവസ്ത്രവും ധരിച്ച്, പൊന്നും വിലയേറിയ കല്ലുകളും മുത്തുകളുംകൊണ്ട് അലങ്കരിക്കപ്പെട്ട മഹാനഗരമേ!”'
  to: 'പറഞ്ഞുകൊണ്ട്: “കഷ്ടം, കഷ്ടം[a], നേർത്ത ലിനൻവസ്ത്രവും ധൂമ്രനിറത്തിലുള്ള വസ്ത്രവും കടുംചുവപ്പുനിറത്തിലുള്ള വസ്ത്രവും ധരിച്ച്, പൊന്നും വിലയേറിയ കല്ലുകളും മുത്തുകളുംകൊണ്ട് അലങ്കരിക്കപ്പെട്ട മഹാനഗരമേ!”'
  rationale: The revision corrects the participial force of λέγοντες, replaces the inaccurate ‘ചണവസ്ത്രം’ with ‘ലിനൻവസ്ത്രം,’ and gives οὐαί a main rendering that preserves both prophetic judgment and lament. The Greek’s singular luxury nouns may idiomatically be represented as plural collective items in Malayalam, so ‘കല്ലുകളും മുത്തുകളും’ is retained.
