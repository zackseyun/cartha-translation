id: REV.18.16
reference: Revelation 18:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: ml
  text: 'പറഞ്ഞുകൊണ്ട്: “കഷ്ടം, കഷ്ടം[a], നേർത്ത ലിനൻവസ്ത്രവും ധൂമ്രനിറത്തിലുള്ള വസ്ത്രവും കടുംചുവപ്പുനിറത്തിലുള്ള വസ്ത്രവും ധരിച്ച്, പൊന്നും വിലയേറിയ കല്ലുകളും മുത്തുകളുംകൊണ്ട് അലങ്കരിക്കപ്പെട്ട മഹാനഗരമേ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അയ്യോ, അയ്യോ.”
    reason: οὐαί എന്ന ഉദ്ഗാരം വിലാപവും ന്യായവിധിയുടെ പ്രഖ്യാപനവും ഉൾക്കൊള്ളുന്നു; ‘അയ്യോ’ വിലാപസ്വരം കൂടുതൽ മുൻനിർത്തുന്ന സാധ്യമായ വിവർത്തനമാണ്.
lexical_decisions:
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: വർത്തമാനകാല കർത്തൃവാചക ബഹുവചന കൃദന്തം മുൻവാക്യത്തിലെ കർത്താക്കളോടു ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ഉദ്ധരണി സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘പറഞ്ഞു’ ഉപയോഗിച്ചു; പുതിയ കർത്താവിനെ ചേർത്തിട്ടില്ല.
- source_word: Οὐαὶ οὐαί
  choice: അയ്യോ, അയ്യോ
  rationale: വിലാപവും വരാനിരിക്കുന്ന/സംഭവിച്ച ന്യായവിധിയുടെ ഭീതിയും ഉൾക്കൊള്ളുന്ന ആവർത്തിത ഉദ്ഗാരം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ വിലാപസ്വരം നൽകുന്നു; ന്യായവിധിസ്വരം സന്ദർഭം നിലനിർത്തുന്നു.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: മഹാനഗരമേ
  rationale: ആവർത്തിച്ച നിർദേശകപദം നൽകുന്ന ഊന്നൽ സംബോധനരൂപത്തിലുള്ള സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: περιβεβλημένη
  choice: ധരിച്ച്
  rationale: നഗരം വിലാസവസ്ത്രങ്ങൾ അണിഞ്ഞ നിലയിലാണെന്ന പൂർണ്ണകാല കൃദന്തത്തിന്റെ ഫലം സ്വാഭാവികമായി പകരുന്നു.
- source_word: βύσσινον
  choice: നേർത്ത ചണവസ്ത്രം
  rationale: സാധാരണ ചണമല്ല, വിലയേറിയ സൂക്ഷ്മമായ ലിനൻ വസ്ത്രമാണെന്ന ആഡംബരസൂചന നിലനിർത്തുന്നു.
- source_word: πορφυροῦν
  choice: ധൂമ്രവസ്ത്രം
  rationale: സമ്പത്തും രാജകീയതയും സൂചിപ്പിക്കുന്ന ധൂമ്രനിറത്തിലുള്ള വസ്ത്രം എന്ന് പട്ടികയിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: κόκκινον
  choice: കടുംചുവപ്പുവസ്ത്രം
  rationale: വെറും ചുവപ്പിനേക്കാൾ vivid ആയ scarlet നിറവും ആഡംബരചിത്രവും പകരുന്നു.
- source_word: κεχρυσωμένη
  choice: അലങ്കരിക്കപ്പെട്ട
  rationale: പൊന്ന് പൂശിയെന്ന പരിമിത അർഥത്തിനു പകരം, തുടർന്ന് വരുന്ന പൊന്ന്, വിലയേറിയ കല്ലുകൾ, മുത്തുകൾ എന്നിവയൊക്കെയുള്ള സമൃദ്ധമായ അലങ്കാരത്തെ ഉൾക്കൊള്ളുന്നു.
- source_word: χρυσίῳ
  choice: പൊന്ന്
  rationale: അലങ്കാരത്തിനുപയോഗിച്ച വസ്തു എന്ന ദത്തിവ്യാകരണബന്ധം ‘കൊണ്ട്’ എന്നതിലൂടെ പകരുന്നു.
- source_word: λίθῳ τιμίῳ
  choice: വിലയേറിയ കല്ലുകൾ
  rationale: ഗ്രീക്കിലെ ഏകവചനം വസ്തുവർഗത്തെ കൂട്ടായ അർഥത്തിൽ സൂചിപ്പിക്കാവുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: μαργαρίτῃ
  choice: മുത്തുകൾ
  rationale: ഗ്രീക്കിലെ ഏകവചനം കൂട്ടായ വസ്തുസൂചനയായി എടുത്ത് സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു.
theological_decisions:
- issue: ബാബിലോണിന്റെ വീഴ്ചയെക്കുറിച്ചുള്ള വിലാപത്തിന്റെ സ്വരം
  choice: ‘അയ്യോ’ എന്ന് വിവർത്തനം ചെയ്ത് വിലാപസ്വരം മുൻനിർത്തുകയും ന്യായവിധിയുടെ ഭാരം സന്ദർഭത്തിൽ നിലനിർത്തുകയും ചെയ്തു
  alternative: ‘കഷ്ടം, കഷ്ടം’ എന്ന് നൽകി പ്രവാചകീയ ന്യായവിധിസ്വരം കൂടുതൽ നേരിട്ട് അടയാളപ്പെടുത്തുക
  rationale: οὐαί ദുഃഖോദ്ഗാരവും ന്യായവിധിപ്രഖ്യാപനവും ഉൾക്കൊള്ളാം. മലയാളത്തിൽ ‘അയ്യോ’ ഇവിടെ വ്യാപാരികളുടെ വിലാപത്തിന് സ്വാഭാവികമാണ്; എന്നാൽ ന്യായവിധിസൂചന നഷ്ടപ്പെടാതിരിക്കാനായി പാദക്കുറിപ്പിൽ മറ്റൊരു സാധ്യത നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും വെളിപ്പാട് പുസ്തകത്തിന്റെ ഗൗരവമുള്ള വിലാപശൈലി നിലനിർത്തുന്നതുമായ മലയാളം. വസ്ത്രങ്ങളുടെയും ആഭരണങ്ങളുടെയും ആഡംബരപ്പട്ടിക വ്യക്തമായി കേൾക്കാൻ സമാന്തര ഘടന ഉപയോഗിച്ചു.
