id: REV.18.1
reference: Revelation 18:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: ml
  text: ഇതിനുശേഷം, വലിയ അധികാരമുള്ള മറ്റൊരു ദൂതൻ സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുന്നത് ഞാൻ കണ്ടു; അവന്റെ മഹത്ത്വത്താൽ ഭൂമി പ്രകാശിതമായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ഇതിനുശേഷം
  rationale: ദർശനങ്ങളുടെ കാലക്രമത്തിലുള്ള തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ταῦτα എന്ന ബഹുവചനത്തെ മലയാളത്തിൽ വേർതിരിച്ചു പറയുന്നത് ഇവിടെ അനാവശ്യമായി കൃത്രിമമാകും.
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാല അർഥം അധിക ഭാവം ചേർക്കാതെ നൽകുന്നു.
- source_word: ἄλλον ἄγγελον
  choice: മറ്റൊരു ദൂതൻ
  rationale: ദർശനപരമ്പരയിൽ മുമ്പുള്ളവരിൽനിന്ന് വേറൊരു ദൂതനെ സൂചിപ്പിക്കുന്ന ἄλλον എന്നതിന്റെ സ്വാഭാവിക വിവർത്തനം.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുന്നത്
  rationale: καταβαίνοντα എന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ, കാണുന്ന പ്രവൃത്തിയോടൊപ്പം നടക്കുന്ന ഇറക്കം നിലനിർത്തുന്നു; ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം ‘സ്വർഗത്തിൽനിന്ന്’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: വലിയ അധികാരമുള്ള
  rationale: ἐξουσία എന്നത് വെറും ശക്തിയേക്കാൾ അധികാരം, അവകാശം, നിയോഗിക്കപ്പെട്ട അധീശത്വം എന്നിവ സൂചിപ്പിക്കുന്നതിനാൽ ‘അധികാരം’ തെരഞ്ഞെടുത്തു.
- source_word: ἡ γῆ
  choice: ഭൂമി
  rationale: പ്രാദേശികമായ ‘ദേശം’ എന്നതിനെക്കാൾ വിശാലമായ സാർവലൗകിക ദൃശ്യമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: ἐφωτίσθη
  choice: പ്രകാശിതമായി
  rationale: φωτίζω എന്ന ക്രിയയുടെ നിഷ്ക്രിയ അർഥവും ദൃശ്യത്തിന്റെ ഗാംഭീര്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: അവന്റെ മഹത്ത്വത്താൽ
  rationale: ἐκ ഇവിടെ പ്രകാശത്തിന്റെ ഉറവിടമോ കാരണമോ സൂചിപ്പിക്കുന്നു; ‘മഹത്ത്വത്താൽ’ മലയാളത്തിൽ ആ ബന്ധം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ദൂതന്റെ മഹത്ത്വത്തിന്റെയും അധികാരത്തിന്റെയും സ്വഭാവം
  choice: ദൂതനു വലിയ അധികാരവും ഭൂമിയെ പ്രകാശിപ്പിക്കുന്ന മഹത്ത്വവും ഉണ്ടെന്ന് വാക്യം പറയുന്നതുപോലെ തന്നെ നിലനിർത്തി.
  alternative: ഇത് ദൂതന്റെ ദൈവികത സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കുകയോ, മറുവശത്ത് അവന്റെ മഹത്ത്വത്തിന്റെ ശക്തി മയപ്പെടുത്തുകയോ ചെയ്യാം.
  rationale: ഗ്രീക്ക് പാഠം ദൂതനെ ദൈവമായി തിരിച്ചറിയുന്നില്ല; അതേസമയം ‘അവന്റെ മഹത്ത്വം’ എന്ന ശക്തമായ ഭാഷ ഉപയോഗിക്കുന്നു. വിവർത്തനം ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വിശദീകരിച്ച് തീർക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിന്റെ ദർശനാത്മക ഗാംഭീര്യം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ സംസ്കൃതഭാരിത ഭാഷ ഒഴിവാക്കി. പ്രസക്തമായ യഥാർഥ അർഥവ്യത്യാസം പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല.
