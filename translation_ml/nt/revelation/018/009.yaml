source:
  edition: SBLGNT
  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: ml
  text: അവളോടൊപ്പം ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുകയും[b] അവളോടൊപ്പം ആഡംബരജീവിതം നയിക്കുകയും ചെയ്ത ഭൂമിയിലെ രാജാക്കന്മാർ, അവൾ കത്തുന്നതിന്റെ പുക കാണുമ്പോൾ അവളെച്ചൊല്ലി കരയുകയും വിലപിക്കുകയും[a] ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിലപിക്കും’ എന്നതിന് ‘നെഞ്ചത്തടിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയ പ്രകടമായ വിലാപത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവളോടൊപ്പം ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെട്ടു’ എന്നത് വെളിപ്പാടിൽ അഴിമതിപരവും വിഗ്രഹാരാധനാപരവുമായ സഖ്യത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തിത രൂപകത്തിന്റെ ഭാഗമായിരിക്കാം; അതേസമയം ഗ്രീക്കിലെ ലൈംഗിക ദൃശ്യഭാഷയും നിലനിൽക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: കരയുകയും
  rationale: κλαίω സൂചിപ്പിക്കുന്ന കേൾക്കാവുന്ന കരച്ചിലും ദുഃഖപ്രകടനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κόψονται
  choice: വിലപിക്കുകയും
  rationale: ഈ സന്ദർഭത്തിലെ മധ്യമപ്രയോഗം ആചാരപരമായ ദുഃഖപ്രകടനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ശരീരം മുറിക്കുക എന്ന അക്ഷരാർഥം തെറ്റിദ്ധരിപ്പിക്കാം.
- source_word: ἐπ’ αὐτὴν
  choice: അവളെച്ചൊല്ലി
  rationale: വിലാപത്തിന്റെ വിഷയമോ കാരണമോ അവളാണെന്ന ἐπί + accusative പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: ഭൂമിയിലെ രാജാക്കന്മാർ
  rationale: വെളിപ്പാടിലെ ആഗോള വ്യാപ്തിയുള്ള അന്ത്യകാലദർശന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: μετ’ αὐτῆς
  choice: അവളോടൊപ്പം
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന സഹവർത്തിത്വം നേരിട്ട് നൽകുന്നു; ഏകദേശം രണ്ടു പങ്കാളിത്തക്രിയകളോടും ബന്ധപ്പെടാവുന്ന വിധത്തിലാണ് വാക്യഘടന.
- source_word: πορνεύσαντες
  choice: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുകയും
  rationale: ലൈംഗികമായ രൂപകം മായ്ച്ചുകളയാതെ, ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ ഭാഷയിൽ πορνεύωയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: στρηνιάσαντες
  choice: ആഡംബരത്തിൽ ജീവിക്കുകയും
  rationale: സ്വയംതൃപ്തമായ ധൂർത്തും സുഖലോലുപതയും ഉൾക്കൊള്ളുന്ന ക്രിയയെ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὅταν βλέπωσιν
  choice: കാണുമ്പോൾ
  rationale: ഭാവിയിലെ സന്ദർഭസാധ്യതയെ സൂചിപ്പിക്കുന്ന ὅταν + subjunctive മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν καπνὸν
  choice: പുക
  rationale: നേരിട്ടുള്ള അർഥം; മലയാള വാക്യത്തിൽ നിർദിഷ്ടത സന്ദർഭംകൊണ്ട് വ്യക്തമാകുന്നു.
- source_word: τῆς πυρώσεως αὐτῆς
  choice: അവൾ കത്തുന്നതിന്റെ
  rationale: πύρωσις സൂചിപ്പിക്കുന്ന കത്തൽപ്രക്രിയയെ സമീപവാക്യങ്ങളിൽ നിന്നുള്ള അധിക ആശയങ്ങൾ ചേർക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബാബിലോണിന്റെ ‘ലൈംഗിക അധാർമികത’ എന്ന പ്രതീകത്തിന്റെ സ്വഭാവം
  choice: പ്രധാനപാഠത്തിൽ ലൈംഗിക ഭാഷ നിലനിർത്തുകയും സന്ദർഭത്തിലെ രൂപകസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
  alternative: ‘അവിശ്വസ്തത കാണിച്ചു’ അല്ലെങ്കിൽ പൊതുവായി ‘അധാർമികത പ്രവർത്തിച്ചു’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: വെളിപ്പാട് വിഗ്രഹാരാധനാപരവും അഴിമതിപരവുമായ സഖ്യങ്ങൾക്ക് വേശ്യാവൃത്തി/ലൈംഗിക അധാർമികതയുടെ പ്രവാചകപ്രതീകം ആവർത്തിച്ചു ഉപയോഗിക്കുന്നു. അതിനെ ശുദ്ധമായ രാഷ്ട്രീയ വ്യാഖ്യാനമായി ചുരുക്കാതെ പാഠത്തിലെ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: κόψονται എന്ന വിലാപക്രിയ
  choice: ‘വിലപിക്കും’ എന്ന അർഥപ്രധാനമായ വിവർത്തനം.
  alternative: ‘തങ്ങളെത്തന്നെ അടിക്കും’ അല്ലെങ്കിൽ ‘നെഞ്ചത്തടിക്കും’.
  rationale: ഇവിടെ ക്രിയയുടെ പ്രയോഗം പ്രകടമായ ദുഃഖാചരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അക്ഷരാർഥം സ്വയംപരിക്കേൽപ്പിക്കൽ പ്രധാനമാണെന്ന തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാം; ദൃശ്യഭാവം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ സമാന്തരമായ ‘കരയുകയും വിലപിക്കുകയും’ എന്ന ദ്വിക്രിയ നിലനിർത്തി. ‘അവളോടൊപ്പം’ എന്നത് രണ്ടു മുൻക്രിയകളുമായും സ്വാഭാവികമായി ബന്ധപ്പെടുന്ന വിധത്തിൽ മുൻവശത്ത് വെച്ചു; പാഠത്തിലെ സ്ത്രീരൂപകവും തീയിൽ നശിക്കുന്ന ദൃശ്യവും സംരക്ഷിച്ചു.
