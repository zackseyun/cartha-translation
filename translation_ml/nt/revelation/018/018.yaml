id: REV.18.18
reference: Revelation 18:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἔκραξαν βλέποντες τὸν καπνὸν τῆς πυρώσεως αὐτῆς λέγοντες· Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: ml
  text: 'അവൾ കത്തിയെരിയുന്നതിന്റെ പുക കണ്ടപ്പോൾ അവർ ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “ആ മഹാനഗരത്തോടു തുല്യമായ നഗരം ഏത്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκραξαν
  choice: ഉറക്കെ നിലവിളിച്ചു
  rationale: κράζω ഉച്ചത്തിലുള്ള വിളിയെയോ നിലവിളിയെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ വിലാപത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: βλέποντες
  choice: കണ്ടപ്പോൾ
  rationale: പ്രധാന ക്രിയയോടൊപ്പം നടക്കുന്ന കാഴ്ചയെ സ്വാഭാവികമായ മലയാള കാലബന്ധത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: καπνὸν τῆς πυρώσεως αὐτῆς
  choice: അവളുടെ ദഹനത്തിന്റെ പുക
  rationale: πύρωσις എന്നത് കത്തിക്കൊണ്ടിരിക്കുന്നതോ ദഹിപ്പിക്കപ്പെടുന്നതോ ആയ പ്രക്രിയയെ സൂചിപ്പിക്കുന്നു; αὐτῆς നഗരത്തിന്റെ സ്ത്രീരൂപ വ്യക്തിവൽക്കരണം നിലനിർത്തുന്നു.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിയിലേക്കുള്ള ഗ്രീക്ക് പങ്കാളിക്രിയ മലയാളത്തിൽ പ്രധാന ക്രിയയോട് ചേർത്ത് സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: ആ മഹാനഗരത്തോടു തുല്യമായ നഗരം ഏത്?
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ താരതമ്യപ്രയോഗത്തിൽ ഉദ്ദേശിക്കപ്പെട്ട ‘നഗരം’ മലയാളത്തിൽ വ്യക്തമാക്കി; കാലസൂചനയില്ലാത്ത നാമവാക്യത്തിന്റെ വാചകശക്തി സംരക്ഷിക്കുന്നു.
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: ആ മഹാനഗരം
  rationale: നിശ്ചിതവും സന്ദർഭത്തിൽ പരിചിതവുമായ നഗരത്തെ മലയാളത്തിൽ ‘ആ’ എന്നു സൂചിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ബാബിലോൻ/നഗരത്തിന്റെ സ്ത്രീരൂപ വ്യക്തിവൽക്കരണം
  choice: ‘അവളുടെ’ എന്നു നിലനിർത്തി
  alternative: ‘അതിന്റെ’ എന്നു നൽകുക
  rationale: വെളിപ്പാടിലെ നഗര-സ്ത്രീ രൂപകബന്ധം αὐτῆς എന്ന സ്ത്രീലിംഗ സർവനാമത്തിൽ പ്രകടമാണ്; അതിനെ നപുംസകരൂപത്തിലാക്കി മായ്ച്ചിട്ടില്ല.
- issue: താരതമ്യചോദ്യത്തിലെ കാലസൂചന
  choice: ‘തുല്യമായ നഗരം ഏത്?’ എന്ന കാലനിരപേക്ഷ നാമവാക്യം
  alternative: ‘ഏത് നഗരം ഇതുപോലെയായിരുന്നു?’ അല്ലെങ്കിൽ ‘ഏത് നഗരം ഇതുപോലെയാണ്?’
  rationale: ഗ്രീക്കിൽ പ്രകടമായ ബന്ധകക്രിയ ഇല്ല; ഭൂതകാലമോ വർത്തമാനകാലമോ നിർബന്ധിച്ച് ചേർക്കാതെ യഥാർത്ഥ സംക്ഷിപ്തതയും അലങ്കാരചോദ്യവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ദഹനം’ എന്ന പദം കത്തിച്ചാമ്പലാകുന്ന പ്രക്രിയയുടെ ഗൗരവം നൽകുന്നു; വാക്യഘടന ഗ്രീക്കിന്റെ അർത്ഥവും വെളിപ്പാടിലെ വ്യക്തിവൽക്കരണവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
