id: REV.18.13
reference: Revelation 18:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and servants, that is[b], human souls.
translation:
  language: ml
  text: കറുവാപ്പട്ട, സുഗന്ധവ്യഞ്ജനം[a], ധൂപവർഗങ്ങൾ, സുഗന്ധതൈലം, കുന്തിരിക്കം, വീഞ്ഞ്, ഒലിവെണ്ണ, മേൽത്തരം മാവ്, ഗോതമ്പ്, കന്നുകാലികൾ, ചെമ്മരിയാടുകൾ, കുതിരകൾ, വണ്ടികൾ, ശരീരങ്ങൾ, മനുഷ്യരുടെ ആത്മാക്കൾ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അമോമം’; വിലയേറിയ ഒരു സുഗന്ധസസ്യമോ സുഗന്ധവ്യഞ്ജനമോ.
    reason: lexical_alternative
  - marker: b
    text: ‘ശരീരങ്ങൾ’ എന്നത് അക്ഷരാർഥം; ഇവിടെ മനുഷ്യരെ അടിമകളായി വിൽക്കുന്ന വ്യാപാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: കറുവാപ്പട്ട
  rationale: ഇറക്കുമതി ചെയ്തിരുന്ന സുഗന്ധവ്യഞ്ജനമായ കറുവാപ്പട്ടയെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: ἄμωμον
  choice: സുഗന്ധവ്യഞ്ജനം
  rationale: വിലയേറിയ സുഗന്ധസസ്യമോ വ്യഞ്ജനമോ ആണ് ഉദ്ദേശ്യം; കൃത്യമായ സസ്യതിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ പൊതുവായ സ്വാഭാവിക പദം മുഖ്യവാചകത്തിലും ‘അമോമം’ അടിക്കുറിപ്പിലും നൽകി.
- source_word: θυμιάματα
  choice: ധൂപവർഗങ്ങൾ
  rationale: വ്യാപാരസാധനങ്ങളുടെ പട്ടികയിൽ ധൂപാർപ്പണക്രിയയല്ല, ധൂപമായി ഉപയോഗിക്കുന്ന സുഗന്ധവസ്തുക്കളാണ് സൂചന.
- source_word: μύρον
  choice: സുഗന്ധതൈലം
  rationale: വിലയേറിയ സുഗന്ധലേപനമോ പരിമളതൈലമോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വസ്തുവിന്റെ സ്വഭാവം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: λίβανον
  choice: കുന്തിരിക്കം
  rationale: പൊതുവായ ധൂപവർഗങ്ങളിൽനിന്ന് വ്യത്യസ്തമായ ഫ്രാങ്കിൻസെൻസ് റെസിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിത മലയാളപദം.
- source_word: ἔλαιον
  choice: ഒലിവെണ്ണ
  rationale: സന്ദർഭത്തിലെ എണ്ണ ഒലിവെണ്ണയാണെന്ന് വ്യക്തമായി പറയുന്നു.
- source_word: σεμίδαλιν
  choice: മേൽത്തരം മാവ്
  rationale: ഉയർന്ന ഗുണമേന്മയുള്ള നന്നായി അരച്ച മാവാണ് അർത്ഥം; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ പ്രയോഗം.
- source_word: σῖτον
  choice: ഗോതമ്പ്
  rationale: ധാന്യം എന്ന വിശാല അർത്ഥം സാധ്യമെങ്കിലും ഈ വ്യാപാരപ്പട്ടികയിൽ ഗോതമ്പ് എന്ന പ്രത്യേക അർത്ഥമാണ് ഏറ്റവും സാധ്യതയുള്ളത്.
- source_word: κτήνη
  choice: കന്നുകാലികൾ
  rationale: വളർത്തുമൃഗങ്ങൾ, പ്രത്യേകിച്ച് വലിയ മൃഗങ്ങൾ, എന്ന അർത്ഥം നൽകുന്നു; പിന്നാലെയുള്ള ചെമ്മരിയാടുകളിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: πρόβατα
  choice: ചെമ്മരിയാടുകൾ
  rationale: ആടുകളിൽ പ്രത്യേകിച്ച് sheep എന്ന അർത്ഥം വ്യക്തമാക്കാൻ ‘ചെമ്മരിയാടുകൾ’ ഉപയോഗിച്ചു.
- source_word: ῥεδῶν
  choice: രഥങ്ങൾ
  rationale: നാലുചക്രമുള്ള വാഹനങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘രഥങ്ങൾ’ ബൈബിൾ മലയാളത്തിൽ മനസ്സിലാകുന്നതാണ്, എങ്കിലും ആഡംബരവണ്ടികൾ എന്ന ആശയവും സാധ്യമാണ്.
- source_word: σωμάτων
  choice: ശരീരങ്ങൾ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തി മനുഷ്യരെ ചരക്കാക്കിയതിന്റെ ഞെട്ടിക്കുന്ന ഭാഷ സംരക്ഷിക്കുന്നു; അടിമകൾ എന്ന വ്യാപാരസന്ദർഭം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ψυχὰς ἀνθρώπων
  choice: മനുഷ്യജീവൻ
  rationale: വെറും ദേഹത്തേക്കാൾ സമ്പൂർണ മനുഷ്യജീവിതത്തെ ഉന്നയിക്കുന്ന പരമാവധി ഘട്ടം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘മനുഷ്യരുടെ ആത്മാക്കൾ’ എന്ന അക്ഷരാർഥവും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: σωμάτων καὶ ψυχὰς ἀνθρώπων എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: ശരീരങ്ങൾ—അതായത് മനുഷ്യജീവൻ
  alternative: അടിമകൾ, അതായത് മനുഷ്യരുടെ ആത്മാക്കൾ; ശരീരങ്ങളും മനുഷ്യരുടെ ആത്മാക്കളും
  rationale: മനുഷ്യരെ വിൽപ്പനച്ചരക്കാക്കിയതിലുള്ള വാചകത്തിന്റെ ധാർമിക ഞെട്ടൽ ‘ശരീരങ്ങൾ’ എന്ന അക്ഷരാർഥം നിലനിർത്തുന്നു. ഡാഷും ‘അതായത്’ എന്നതും അവസാനപ്രയോഗത്തിന്റെ വിശദീകരണപരവും ഉച്ചകോടിപോലുമായ ബലം കാണിക്കുന്നു; ‘അടിമകൾ’ എന്ന ചരിത്രസന്ദർഭം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യാപാരസാധനങ്ങളുടെ വേഗമേറിയ പട്ടികാശൈലി നിലനിർത്തി. പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ഗൗരവമുള്ളതുമാക്കി; അവസാനത്തെ മനുഷ്യവ്യാപാരസൂചനയുടെ ഞെട്ടൽ മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു.
