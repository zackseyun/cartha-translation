id: REV.18.10
reference: Revelation 18:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: ml
  text: 'അവളുടെ പീഡനത്തെ ഭയന്ന് അവർ ദൂരെ നിന്നുകൊണ്ട് പറഞ്ഞു: “അയ്യോ, അയ്യോ! മഹാനഗരമേ, ബാബിലോനേ, ശക്തമായ നഗരമേ![a] ഒറ്റ മണിക്കൂറിൽ നിന്റെ ന്യായവിധി വന്നെത്തിയല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശക്തമായ നഗരമേ” എന്നതിന് “പ്രബലമായ നഗരമേ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ശക്തി, പ്രാബല്യം, മഹാബലം എന്നീ ആശയങ്ങൾ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: അവർ ദൂരെ നിന്നുകൊണ്ട്
  rationale: ദൂരത്ത് നിലകൊള്ളുന്ന അവരുടെ അവസ്ഥയും തുടർന്നുള്ള സംസാരവുമായുള്ള ബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: അവളുടെ പീഡനത്തെ ഭയന്ന്
  rationale: διάയുടെ കാരണാർഥവും βασανισμός സൂചിപ്പിക്കുന്ന കഠിനമായ യാതനയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Οὐαὶ οὐαί
  choice: അയ്യോ, അയ്യോ
  rationale: οὐαίയിൽ ഒരുമിച്ചുള്ള വിലാപത്തിന്റെയും ആപത്‌പ്രഖ്യാപനത്തിന്റെയും ഭാവം മലയാളത്തിലെ സ്വാഭാവികമായ ദുഃഖോദ്ഗാരത്തിലൂടെ നൽകുന്നു; വിധിയുടെ പശ്ചാത്തലം വാക്യം തന്നെ വ്യക്തമാക്കുന്നു.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: മഹാനഗരമേ
  rationale: നേരിട്ടുള്ള അഭിസംബോധന മലയാളത്തിൽ വിഭക്തിയോടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Βαβυλὼν
  choice: ബാബിലോനേ
  rationale: പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം അഭിസംബോധനാരൂപത്തിൽ നൽകുന്നു.
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: ശക്തമായ നഗരമേ
  rationale: ἰσχυράയുടെ ശക്തി/പ്രാബല്യം എന്ന അടിസ്ഥാന അർഥം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: μιᾷ ὥρᾳ
  choice: ഒറ്റ മണിക്കൂറിൽ
  rationale: സംഭവത്തിന്റെ അതിവേഗവും പെട്ടെന്നുള്ള സ്വഭാവവും ഊന്നിപ്പറയുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἦλθεν ἡ κρίσις σου
  choice: നിന്റെ ന്യായവിധി വന്നെത്തിയല്ലോ
  rationale: വിധി നിർണായകമായി എത്തിയെന്ന പൂർത്തിയായ സംഭവവും വിലാപത്തിന്റെ തത്സമയ ഭാവവും നൽകുന്നു.
theological_decisions:
- issue: οὐαί എന്ന അപോകലിപ്തിക ഉദ്ഗാരത്തിന്റെ പരിഭാഷ
  choice: അയ്യോ, അയ്യോ
  alternative: ഹാ കഷ്ടം, ഹാ കഷ്ടം
  rationale: ഗ്രീക്കിൽ വിലാപവും വിനാശപ്രഖ്യാപനവും ഒന്നിച്ചുണ്ടാകാം. ‘അയ്യോ’ ആ യഥാർഥ ദ്വയാർഥം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; ‘ഹാ കഷ്ടം’ കൂടുതൽ പരമ്പരാഗതമായ മറ്റൊരു സാധ്യതയാണ്.
- issue: ἦλθεν എന്ന ക്രിയയുടെ കാല-ഭാവം
  choice: വന്നെത്തിയല്ലോ
  alternative: വന്നു
  rationale: അവരുടെ നേരിട്ടുള്ള വിലാപത്തിൽ വിധി ഇതിനകം നിർണായകമായി എത്തിയതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി പ്രകടമാക്കുന്നു; ഇത് ഉപദേശപരമായ നിർണ്ണയം അല്ല, സന്ദർഭാനുസൃതമായ ഭാഷാന്തരമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള അപോകലിപ്തിക ഭാവം നിലനിർത്തി. ദീർഘവും കൃത്രിമവുമായ നാമവാക്യങ്ങൾ ഒഴിവാക്കി, അഭിസംബോധനാരൂപങ്ങൾ ഉപയോഗിച്ചു. പ്രധാന വാചകത്തിലെ [a] അടയാളം അനുബന്ധ പദപരമായ വികൽപക്കുറിപ്പിനോട് പൊരുത്തപ്പെടുന്നു.
