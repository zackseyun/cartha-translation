id: REV.18.5
reference: Revelation 18:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐκολλήθησαν αὐτῆς αἱ ἁμαρτίαι ἄχρι τοῦ οὐρανοῦ, καὶ ἐμνημόνευσεν ὁ θεὸς τὰ ἀδικήματα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/005.yaml
  text: for her sins have piled up as high as heaven, and God has remembered her wrongdoings.
translation:
  language: ml
  text: കാരണം, അവളുടെ പാപങ്ങൾ സ്വർഗം വരെ കൂമ്പാരമായി കൂടിയിരിക്കുന്നു[a]; ദൈവം അവളുടെ ദുഷ്പ്രവൃത്തികൾ ഓർത്തിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളുടെ പാപങ്ങൾ സ്വർഗം വരെ ഒന്നിനൊന്ന് ചേർന്നിരിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘ഒട്ടിച്ചേരുക/ചേർന്നുനിൽക്കുക’ എന്നാണ്; ഇവിടെ പാപങ്ങൾ വലിയൊരു കൂമ്പാരമായി കൂടിയിരിക്കുന്നതിനെ അതു ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'ഇവിടെ ‘ഓർത്തിരിക്കുന്നു’ എന്നതിന് ന്യായവിധിസംബന്ധിയായ ശക്തിയുണ്ട്: ദൈവം അവളുടെ ദുഷ്പ്രവൃത്തികളെ അവഗണിച്ചിട്ടില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ആജ്ഞയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് കാരണസൂചകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐκολλήθησαν
  choice: കൂമ്പാരമായിരിക്കുന്നു
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ഒട്ടിച്ചേരുക/ചേർന്നുനിൽക്കുക എന്നതാണെങ്കിലും, പാപങ്ങൾ സ്വർഗംവരെ എത്തുന്നു എന്ന സന്ദർഭത്തിൽ വൻതോതിലുള്ള ശേഖരണത്തിന്റെ രൂപകം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἁμαρτίαι
  choice: പാപങ്ങൾ
  rationale: ἁμαρτία എന്ന പദത്തിന്റെ നിലവാരമുള്ളതും വ്യക്തവുമായ മലയാളപരിഭാഷ.
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: സ്വർഗംവരെ
  rationale: പരിധിയും മുകളിലേക്കുള്ള ദൃശ്യരൂപവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐμνημόνευσεν
  choice: ഓർത്തിരിക്കുന്നു
  rationale: ഓർക്കുക എന്ന മൂലക്രിയ നിലനിർത്തുകയും, പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ന്യായവിധിസംബന്ധിയായ പ്രസക്തി മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: നേരിട്ടുള്ള നിലവാരമുള്ള പരിഭാഷ.
- source_word: ἀδικήματα
  choice: ദുഷ്‌പ്രവൃത്തികൾ
  rationale: തെറ്റായതും അനീതിയുള്ളതുമായ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു; മുമ്പുള്ള ‘പാപങ്ങൾ’ എന്നതിൽനിന്നുള്ള പദവ്യത്യാസവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἁμαρτίαι, ἀδικήματα എന്നീ പദങ്ങളുടെ വ്യത്യാസം
  choice: ‘പാപങ്ങൾ’, ‘ദുഷ്‌പ്രവൃത്തികൾ’ എന്നിങ്ങനെ വ്യത്യസ്ത പദങ്ങൾ ഉപയോഗിക്കുക
  alternative: രണ്ടും ‘പാപങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: ഗ്രീക്കിലെ ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ രണ്ടു പദങ്ങളുടെ വാഗ്‌രൂപസമൃദ്ധി നിലനിർത്തുന്നു; അവയ്ക്കിടയിൽ അമിതമായ സിദ്ധാന്തവ്യത്യാസം ആരോപിക്കുന്നില്ല.
- issue: ദൈവം ‘ഓർത്തു’ എന്നതിന്റെ ന്യായവിധിസംബന്ധിയായ ശക്തി
  choice: വാചകത്തിൽ ‘ഓർത്തിരിക്കുന്നു’ എന്നു തന്നെ നിലനിർത്തുക
  alternative: ‘കണക്കു ചോദിച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ന്യായവിധിക്കു വിധേയമാക്കിയിരിക്കുന്നു’ എന്നു വിപുലീകരിക്കുക
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ഓർമ പ്രവർത്തനപരവും ന്യായവിധിസംബന്ധിയുമാണെങ്കിലും, ഗ്രീക്ക് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘കൂമ്പാരമായിരിക്കുന്നു’ എന്നത് മൂലത്തിലെ അസാധാരണമായ ഒട്ടിച്ചേരൽ-രൂപകത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; അടിക്കുറിപ്പ് അക്ഷരാർഥസാധ്യത സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യവാചകത്തിൽ നൽകിയിട്ടുണ്ട്.
