id: REV.18.15
reference: Revelation 18:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: ml
  text: ഈ വസ്തുക്കളുടെ വ്യാപാരികൾ[a]—അവളിൽനിന്ന് സമ്പന്നരായവർ—അവളുടെ യാതനയെ ഭയന്ന് അകലെ നിൽക്കും; അവർ കരയുകയും വിലപിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ചരക്കുകളുടെ’ അല്ലെങ്കിൽ ‘ഈ വ്യാപാരസാധനങ്ങളുടെ’; ഈ പ്രയോഗം സമീപസന്ദർഭത്തിൽ പട്ടികപ്പെടുത്തിയ ആഡംബരവസ്തുക്കളെ പിന്നോട്ടു ചൂണ്ടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: വ്യാപാരികൾ
  rationale: വാണിജ്യത്തിൽ ഏർപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നിലവാരമുള്ളതുമായ മലയാളപദം.
- source_word: τούτων
  choice: ഈ വസ്തുക്കളുടെ
  rationale: സമീപസന്ദർഭത്തിൽ പട്ടികപ്പെടുത്തിയ ആഡംബരവസ്തുക്കളിലേക്കുള്ള പൂർവപരാമർശം നിലനിർത്തുന്നു; ഗ്രീക്കിലെ സർവനാമത്തെ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: πλουτήσαντες
  choice: സമ്പന്നരായവർ
  rationale: ബാബിലോണിൽനിന്ന് അവർ മുമ്പ് സമ്പത്ത് നേടിയെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കർമ്മണിഭാവം ചേർക്കുന്നില്ല.
- source_word: ἀπ’ αὐτῆς
  choice: അവളിൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ഉറവിടബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ μακρόθεν
  choice: അകലെ
  rationale: ഭയത്താൽ മനഃപൂർവം പാലിക്കുന്ന സ്ഥലപരമായ അകലം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: στήσονται
  choice: നിന്നുകൊണ്ട് ... ചെയ്യും
  rationale: ഭാവികാലക്രിയയും അനുബന്ധ വർത്തമാന കൃദന്തങ്ങളുടെ സമകാലിക പ്രവർത്തനവും മലയാളത്തിൽ സ്വാഭാവികമായി ഏകോപിപ്പിക്കുന്നു.
- source_word: διὰ τὸν φόβον
  choice: ഭയം നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണബന്ധം ഔപചാരികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: βασανισμοῦ
  choice: പീഡനം
  rationale: വെളിപ്പാടിലെ ന്യായവിധിസന്ദർഭത്തിന് യോജിക്കുന്ന കടുത്ത യാതനയുടെ അർഥം നിലനിർത്തുന്നു; ആധുനിക നിയമപരമോ ശാരീരികമോ ആയ ‘പീഡിപ്പിക്കൽ’ എന്ന ചുരുങ്ങിയ അർഥത്തിലേക്ക് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: κλαίοντες
  choice: കരയുകയും
  rationale: ശബ്ദത്തോടെ കരയുന്ന പ്രവൃത്തിയെ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: πενθοῦντες
  choice: വിലപിക്കുകയും
  rationale: നഷ്ടത്തെക്കുറിച്ചുള്ള ദുഃഖപ്രകടനം സൂചിപ്പിച്ച് κλαίοντες എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അപോകലിപ്റ്റിക് ന്യായവിധിഭാഷയിലെ βασανισμός എന്നതിന്റെ സ്വഭാവം
  choice: ‘പീഡനം’ എന്നു പരിഭാഷപ്പെടുത്തി, അതിനെ കേവലം മാനസികമോ സാമ്പത്തികമോ ആയ വിഷമമായി ലഘൂകരിച്ചില്ല.
  alternative: ശിക്ഷ; ദുരിതം; യാതന
  rationale: ഉടൻ വരുന്ന സന്ദർഭം ബാബിലോണിന്റെ ന്യായവിധിയാണ്; വെളിപ്പാടിൽ ഈ പദം കടുത്ത ശിക്ഷാത്മക യാതനയെ സൂചിപ്പിക്കാറുണ്ട്. എന്നാൽ ഈ വാക്യം പറയുന്നതിലപ്പുറം അന്തിമശിക്ഷയെക്കുറിച്ചുള്ള വിശദമായ സിദ്ധാന്തം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ വാക്യക്രമവും ആവർത്തനാത്മകമായ ദുഃഖഭാവവും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാസംയോജനം ഉപയോഗിച്ചു.
