id: REV.18.17
reference: Revelation 18:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι μιᾷ ὥρᾳ ἠρημώθη ὁ τοσοῦτος πλοῦτος. Καὶ πᾶς κυβερνήτης καὶ πᾶς ὁ ἐπὶ τόπον πλέων, καὶ ναῦται καὶ ὅσοι τὴν θάλασσαν ἐργάζονται, ἀπὸ μακρόθεν ἔστησαν
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/017.yaml
  text: for in one hour such great wealth has been laid waste. And every shipmaster, and everyone sailing to a place, and sailors, and as many as work the sea, stood far off
translation:
  language: ml
  text: എന്തെന്നാൽ, ഇത്ര വലിയ സമ്പത്ത് ഒരു മണിക്കൂറിനുള്ളിൽ നശിപ്പിക്കപ്പെട്ടു. എല്ലാ കപ്പൽനായകന്മാരും, ഏതെങ്കിലും സ്ഥലത്തേക്കു കപ്പലിൽ യാത്രചെയ്യുന്ന ഏവരും[a], നാവികരും, കടലിനെ ആശ്രയിച്ചു ഉപജീവനം നടത്തുന്ന എല്ലാവരും അകലെ നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഏതെങ്കിലും തുറമുഖത്തേക്കു കപ്പലിൽ പോകുന്ന ഏവരും” അല്ലെങ്കിൽ “എവിടേക്കെങ്കിലും കപ്പലിൽ യാത്രചെയ്യുന്ന ഏവരും.” ഗ്രീക്ക് പ്രയോഗം അല്പം പ്രയോഗവിശേഷമുള്ളതാണ്; കടൽമാർഗം വിവിധ ലക്ഷ്യസ്ഥാനങ്ങളിലേക്കു യാത്രചെയ്യുന്നവരെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: —ല്ലോ
  rationale: മുൻവാക്യത്തിലെ വിലാപത്തിന്റെ കാരണവും ഉള്ളടക്കവും അവതരിപ്പിക്കുന്ന ὅτιയുടെ വിശദീകരണശക്തി മലയാളത്തിൽ സ്വാഭാവികമായ വിലാപസൂചകമായ ‘—ല്ലോ’ വഴി പ്രകടമാക്കുന്നു.
- source_word: μιᾷ ὥρᾳ
  choice: ഒരൊറ്റ മണിക്കൂറിനുള്ളിൽ
  rationale: സമയത്തിന്റെ ഹ്രസ്വതയും ന്യായവിധിയുടെ പെട്ടെന്നുള്ള വരവും വ്യക്തമാക്കുന്നു; കൃത്യദൈർഘ്യം സംബന്ധിച്ച് അധികവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἠρημώθη
  choice: നശിച്ചുപോയി
  rationale: സമ്പത്ത് പാഴാക്കപ്പെടുകയും തകർന്നുപോകുകയും ചെയ്തുവെന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: ഇത്ര വലിയ സമ്പത്ത്
  rationale: τοσοῦτος എന്ന പദത്തിന്റെ അളവിനെയും വിസ്മയ-വിലാപഭാവത്തെയും നിലനിർത്തുന്നു.
- source_word: πᾶς κυβερνήτης
  choice: ഓരോ കപ്പൽനായകനും
  rationale: കപ്പൽ നിയന്ത്രിക്കുന്നതോ നയിക്കുന്നതോ ആയ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘നായകൻ’ ആധുനികവും വ്യക്തവുമായ സമുദ്രസന്ദർഭപദമാണ്.
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: ഏതെങ്കിലും സ്ഥലത്തേക്കു കപ്പലിൽ യാത്രചെയ്യുന്ന ഏവരും
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള സമുദ്രയാത്ര എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലവും അല്പം അനിശ്ചിതവുമായ അർത്ഥം സംരക്ഷിക്കുന്നു; യാത്രക്കാരെന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ναῦται
  choice: നാവികർ
  rationale: ആധുനിക മലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ തത്തുല്യപദം.
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: കടലിൽ തൊഴിൽചെയ്യുന്ന എല്ലാവരും
  rationale: നാവികരെക്കാൾ വിശാലമായ, കടലുമായി ബന്ധപ്പെട്ട അധ്വാനമോ ഉപജീവനമോ നടത്തുന്നവരെ ഉൾക്കൊള്ളുന്ന പ്രയോഗം.
- source_word: ἀπὸ μακρόθεν ἔστησαν
  choice: ദൂരെ മാറിനിന്നു
  rationale: അവർ അകലത്തിൽ നിന്നുവെന്ന സ്ഥലപരമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിലെ ഭീതിജന്യ അകലം വ്യാഖ്യാനമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ബാബിലോണിന്റെ വീഴ്ചയെക്കുറിച്ചുള്ള വിലാപത്തിൽ പറയുന്ന സമുദ്രബന്ധിത വിഭാഗങ്ങളുടെ വ്യാപ്തി
  choice: കപ്പൽനായകർ, ലക്ഷ്യസ്ഥാനങ്ങളിലേക്കു കപ്പലിൽ യാത്രചെയ്യുന്നവർ, നാവികർ, കടലിൽ തൊഴിൽചെയ്യുന്നവർ എന്നീ വിഭാഗങ്ങളെ വേർതിരിച്ചു നിലനിർത്തുന്നു.
  alternative: എല്ലാവരെയും ‘കടൽയാത്രക്കാർ’ എന്ന ഒറ്റ വിഭാഗമാക്കി ചുരുക്കുക, അല്ലെങ്കിൽ രണ്ടാം വിഭാഗത്തെ വ്യാപാരികളോ യാത്രക്കാരോ എന്നു മാത്രം നിർവചിക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിലെ സമാന്തരമായി ചേർത്തിട്ടുള്ള വ്യത്യസ്ത വിഭാഗങ്ങളെ നിലനിർത്തുന്നത് ബാബിലോണിന്റെ തകർച്ച മൂലമുള്ള വ്യാപകമായ സാമ്പത്തിക നഷ്ടത്തെ പ്രകടമാക്കുന്നു; പാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേക തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ വിലാപശൈലി. സമുദ്രബന്ധിത വിഭാഗങ്ങളെ വേർതിരിച്ചും ഗ്രീക്ക് പ്രയോഗത്തിലെ യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചും അവതരിപ്പിച്ചു.
