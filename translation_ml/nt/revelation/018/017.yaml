revisions:
- from: ഇത്ര വലിയ സമ്പത്ത് ഒരൊറ്റ മണിക്കൂറിനുള്ളിൽ നശിച്ചുപോയല്ലോ! ഓരോ കപ്പൽനായകനും, ഏതെങ്കിലും സ്ഥലത്തേക്കു കപ്പലിൽ യാത്രചെയ്യുന്ന ഏവരും[a], നാവികരും, കടലിൽ തൊഴിൽചെയ്യുന്ന എല്ലാവരും ദൂരെ മാറിനിന്നു.
  to: എന്തെന്നാൽ, ഇത്ര വലിയ സമ്പത്ത് ഒരു മണിക്കൂറിനുള്ളിൽ നശിപ്പിക്കപ്പെട്ടു. എല്ലാ കപ്പൽനായകന്മാരും, ഏതെങ്കിലും സ്ഥലത്തേക്കു കപ്പലിൽ യാത്രചെയ്യുന്ന ഏവരും[a], നാവികരും, കടലിനെ ആശ്രയിച്ചു ഉപജീവനം നടത്തുന്ന എല്ലാവരും അകലെ നിന്നു.
  rationale: The revision explicitly translates ὅτι as “എന്തെന്നാൽ,” restores the passive force of ἠρημώθη, and renders the final stance without implying additional movement. It preserves the Greek list’s distinct maritime groups and retains the lexical ambiguity of πᾶς ὁ ἐπὶ τόπον πλέων in both text and footnote.
