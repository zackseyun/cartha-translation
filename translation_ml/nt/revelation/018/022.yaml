id: REV.18.22
reference: Revelation 18:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: ml
  text: വീണവാദകരുടെയും സംഗീതജ്ഞരുടെയും കുഴൽവാദകരുടെയും കാഹളവാദകരുടെയും ശബ്ദം ഇനി ഒരിക്കലും നിന്നിൽ കേൾക്കുകയില്ല[a]; യാതൊരു കൈവേലയിലും പ്രാവീണ്യമുള്ള ഒരു ശില്പിയെയും ഇനി ഒരിക്കലും നിന്നിൽ കണ്ടെത്തുകയില്ല; തിരികല്ലിന്റെ ശബ്ദവും ഇനി ഒരിക്കലും നിന്നിൽ കേൾക്കുകയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പൈപ്പുവാദകർ”; ഗ്രീക്കിലെ αὐλός പുരാതന ഊതുവാദ്യമാണ്; അത് ആധുനിക കുഴലിനോ ഫ്ലൂട്ടിനോ പൂർണമായി സമാനമായിരുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അരയ്ക്കൽയന്ത്രത്തിന്റെ ശബ്ദം”; ഗ്രീക്ക് പദം തിരികല്ലിനെയോ അരയ്ക്കുന്ന സംവിധാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: ശബ്ദം
  rationale: ഇവിടെ സംസാരസ്വരമല്ല, സംഗീതോപകരണങ്ങളുടെയും തിരികല്ലിന്റെയും കേൾക്കാവുന്ന ശബ്ദമാണ് ഉദ്ദേശിക്കുന്നത്; ആവർത്തിക്കുന്ന ദൃശ്യബിംബവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: κιθαρῳδῶν
  choice: വീണവായനക്കാർ
  rationale: കിഥാരയുമായി ബന്ധപ്പെട്ട വാദകരെയാണ് പദം സൂചിപ്പിക്കുന്നത്. പുരാതന വാദ്യത്തോട് ആധുനിക വീണ പൂർണമായി തുല്യമല്ലെങ്കിലും, സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികമായി മനസ്സിലാകുന്ന തന്ത്രിവാദ്യസൂചനയാണിത്.
- source_word: μουσικῶν
  choice: സംഗീതജ്ഞർ
  rationale: സംഗീതത്തിൽ ഏർപ്പെട്ട കലാകാരന്മാരെ വിശാലമായി സൂചിപ്പിക്കുന്ന പദം; പട്ടികയിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: αὐλητῶν
  choice: കുഴൽവായനക്കാർ
  rationale: αὐλός എന്ന പുരാതന ഊതുവാദ്യം വായിക്കുന്നവരാണ് ഉദ്ദേശ്യം. ആധുനിക ഫ്ലൂട്ടുമായി അതിനെ പൂർണമായി സമീകരിക്കാതെ പൊതുവായ കുഴൽവാദ്യസൂചന നൽകുന്നു.
- source_word: σαλπιστῶν
  choice: കാഹളമൂതുന്നവർ
  rationale: കാഹളം മുഴക്കുന്നവരെ വ്യക്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: ഇനി ഒരിക്കലും ... കേൾക്കുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധവും ἔτι സൂചിപ്പിക്കുന്ന അന്തിമമായ അവസാനവും മലയാളത്തിൽ ഊന്നിപ്പറയുന്നു.
- source_word: ἐν σοὶ
  choice: നിന്നിൽ
  rationale: ബാബിലോനെ നഗരമായി വ്യക്തിവൽക്കരിച്ചുള്ള നേരിട്ടുള്ള ദ്വിതീയപുരുഷ അഭിസംബോധന സംരക്ഷിക്കുന്നു.
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: ഒരു തൊഴിലിലുമുള്ള ഒരു കരകൗശലക്കാരൻ
  rationale: എല്ലാത്തരം വൈദഗ്ധ്യത്തൊഴിലാളികളെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സമഗ്രത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐ μὴ εὑρεθῇ ... ἔτι
  choice: ഇനി ഒരിക്കലും ... കണ്ടെത്തുകയില്ല
  rationale: ആ നഗരത്തിൽ അത്തരം ഒരാളും ശേഷിക്കില്ലെന്ന ഊന്നിയ അഭാവം പ്രകടമാക്കുന്നു.
- source_word: μύλου
  choice: തിരികല്ല്
  rationale: ധാന്യം അരയ്ക്കുന്ന കല്ലിനെയോ അരയ്ക്കൽ സംവിധാനത്തെയോ സൂചിപ്പിക്കുന്ന ദൃശ്യബിംബം മലയാളത്തിൽ വ്യക്തമായി കൈമാറുന്നു; ഗ്രീക്ക് പദത്തിന് വിശാലമായി അരയ്ക്കൽയന്ത്രവും സൂചിപ്പിക്കാനാകും.
theological_decisions:
- issue: ബാബിലോന്റെ ന്യായവിധിയുടെ ദൃശ്യബിംബം
  choice: സംഗീതാഘോഷം, വൈദഗ്ധ്യമുള്ള തൊഴിൽ, ദൈനംദിന ആഹാരനിർമാണം എന്നിവയുടെ ശബ്ദവും സാന്നിധ്യവും പൂർണമായി അവസാനിക്കുന്നതായി മൂന്നു പ്രഖ്യാപനങ്ങളിലൂടെ അവതരിപ്പിച്ചു.
  alternative: ഇവയെ പ്രതീകാത്മക പ്രാധാന്യമില്ലാത്ത അലങ്കാരവിവരങ്ങളായി മാത്രം അവതരിപ്പിക്കുക.
  rationale: ആവർത്തിക്കുന്ന οὐ μή ... ἔτι ഘടന സമ്പൂർണവും അന്തിമവുമായ ശൂന്യതയെ സൂചിപ്പിക്കുന്നു. അതേസമയം ദൃശ്യങ്ങളെ അമിതമായി രൂപകവത്കരിക്കാതെ മൂലപാഠത്തിലെ വ്യക്തമായ ചിത്രങ്ങൾ മാത്രം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പ്രവചനാത്മകമായ ആവർത്തനവും ബാബിലോനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും സംരക്ഷിച്ചു. ‘ഇനി ഒരിക്കലും’ എന്ന പ്രയോഗം ശക്തമായ ഗ്രീക്ക് നിഷേധത്തിന്റെ അന്തിമത്വം വ്യക്തമാക്കുന്നു.
