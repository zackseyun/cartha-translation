id: REV.18.7
reference: Revelation 18:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: ml
  text: അവൾ സ്വയം എത്രത്തോളം മഹത്ത്വപ്പെടുത്തി ആഡംബരത്തിൽ ജീവിച്ചുവോ[a], അത്രത്തോളം അവൾക്കു പീഡനവും വിലാപവും കൊടുക്കുവിൻ. കാരണം, ‘ഞാൻ രാജ്ഞിയായി ഇരിക്കുന്നു; ഞാൻ വിധവയല്ല; ഞാൻ ഒരിക്കലും വിലാപം കാണുകയില്ല[b]’ എന്ന് അവൾ ഹൃദയത്തിൽ പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വയംഭോഗപരമായി ജീവിച്ചുവോ’ അല്ലെങ്കിൽ ‘സുഖലോലുപയായി ജീവിച്ചുവോ.’ ഗ്രീക്ക് ക്രിയ ആഡംബരപൂർണവും നിയന്ത്രണമില്ലാത്തതുമായ സുഖജീവിതത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഒരിക്കലും ... കാണുകയില്ല’ എന്നതിൽ ഗ്രീക്കിൽ ഊന്നിയ നിഷേധപ്രയോഗമുണ്ട്; വിലാപം തനിക്കു ഒരിക്കലും ഉണ്ടാകില്ലെന്ന അവളുടെ അത്യുറച്ച ആത്മവിശ്വാസമാണ് അത് പ്രകടമാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: എത്രത്തോളം ... അത്രത്തോളം
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധമുള്ള അളവുസൂചക ഘടനയും ആനുപാതികമായ പ്രതിഫലവിധിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐδόξασεν αὑτὴν
  choice: അവൾ തന്നെത്താൻ ... മഹത്ത്വപ്പെടുത്തി
  rationale: പ്രതിഫലനിർദ്ദേശം വ്യക്തമായി നിലനിർത്തി ബാബിലോണിന്റെ സ്വയംപുകഴ്ത്തലും സ്വയംഉയർത്തലും പ്രകടമാക്കുന്നു.
- source_word: ἐστρηνίασεν
  choice: ആഡംബരത്തിൽ ജീവിച്ചു
  rationale: സുഖലോലുപവും നിയന്ത്രണമില്ലാത്തതുമായ ആഡംബരജീവിതത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭം ആവശ്യപ്പെടാത്ത ലൈംഗിക അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: δότε αὐτῇ
  choice: അവൾക്കു ... കൊടുക്കുവിൻ
  rationale: ന്യായവിധിയുടെ ആജ്ഞാസ്വരം നേരിട്ട് നിലനിർത്തുന്ന ബഹുവചന ആജ്ഞാരൂപം.
- source_word: βασανισμὸν
  choice: പീഡനം
  rationale: വിധിയുടെ കീഴിലുള്ള കഠിനയാതനയുടെ വ്യാപകമായ അർഥം നൽകുന്നു; ശാരീരിക പീഡനത്തിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: πένθος
  choice: ദുഃഖാചരണം
  rationale: നഷ്ടത്തോടും വിധിയോടും ബന്ധപ്പെട്ട വിലാപപൂർണമായ mourning എന്ന ആശയം നൽകുകയും രണ്ടു പ്രയോഗങ്ങളിലും ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: അവൾ ഹൃദയത്തിൽ പറയുന്നു
  rationale: ആന്തരികമായ അഹങ്കാരപൂർണ ഉറപ്പിനെ സൂചിപ്പിക്കുന്ന തിരുവെഴുത്തുശൈലിയിലെ ഹൃദയപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: Κάθημαι βασίλισσα
  choice: ഞാൻ രാജ്ഞിയായി ഇരിക്കുന്നു
  rationale: രാജകീയ സ്ഥാനത്തും സുരക്ഷിതത്വത്തിലും ഇരിക്കുന്നതിന്റെ ദൃശ്യരൂപം, വെറും ‘ഞാൻ രാജ്ഞിയാണ്’ എന്നു സമതലപ്പെടുത്താതെ, സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: χήρα οὐκ εἰμί
  choice: ഞാൻ വിധവയല്ല
  rationale: നഷ്ടമോ ഉപേക്ഷിക്കപ്പെടലോ തനിക്കുണ്ടാകില്ലെന്ന അവകാശവാദത്തിന്റെ സ്ത്രീരൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: οὐ μὴ ἴδω
  choice: ഞാൻ ഒരിക്കലും കാണുകയില്ല
  rationale: οὐ μή എന്ന ഊന്നിയ നിഷേധത്തിന്റെ ഉറച്ച ആത്മവിശ്വാസം മലയാളത്തിലെ ‘ഒരിക്കലും ... ഇല്ല’ എന്ന ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ബാബിലോണിനെ സ്ത്രീ/രാജ്ഞി/വിധവയായി വ്യക്തിവൽക്കരിക്കൽ
  choice: ‘അവൾ,’ ‘രാജ്ഞി,’ ‘വിധവ’ എന്നീ സ്ത്രീലിംഗ രൂപങ്ങൾ മുഴുവനും നിലനിർത്തി.
  alternative: നഗരമോ സാമ്പത്തികവ്യവസ്ഥയോ എന്ന നിർവ്യക്തമായ രൂപത്തിലാക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിലെ സ്ത്രീരൂപ വ്യക്തിവൽക്കരണം വെളിപ്പാടിന്റെ പ്രവാചകവാഗ്മിതയ്ക്കും സ്വയംഉയർത്തലിൽനിന്ന് വിധിയിലേക്കുള്ള വിരോധാഭാസത്തിനും കേന്ദ്രമാണ്.
- issue: βασανισμός എന്നതിലെ വിധിന്യായഭാഷ
  choice: പ്രധാനപാഠത്തിൽ ‘പീഡനം’ ഉപയോഗിച്ചു.
  alternative: ‘യാതന’ അല്ലെങ്കിൽ ‘വേദന.’
  rationale: ദൈവിക/ന്യായിക പ്രതിഫലത്തിന്റെ കഠിനത നിലനിർത്തുമ്പോഴും അതിന്റെ രീതി ശാരീരിക പീഡനമായി മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘തന്നെത്താൻ,’ ‘ഹൃദയത്തിൽ പറയുന്നു,’ ‘രാജ്ഞിയായി ഇരിക്കുന്നു’ എന്നീ ബൈബിൾപ്രതീകങ്ങൾ അർഥവ്യക്തത നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി; ‘കൊടുക്കുവിൻ’ ആജ്ഞയുടെ ഔപചാരികവും ന്യായവിധിപരവുമായ സ്വരം സംരക്ഷിക്കുന്നു.
