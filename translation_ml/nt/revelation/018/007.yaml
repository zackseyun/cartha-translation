revisions:
- from: അവൾ തന്നെത്താൻ എത്രത്തോളം മഹത്ത്വപ്പെടുത്തി ആഡംബരത്തിൽ ജീവിച്ചുവോ[a], അത്രത്തോളം അവൾക്കു പീഡനവും ദുഃഖാചരണവും കൊടുക്കുവിൻ. കാരണം, ‘ഞാൻ രാജ്ഞിയായി ഇരിക്കുന്നു; ഞാൻ വിധവയല്ല; ദുഃഖാചരണം ഞാൻ ഒരിക്കലും കാണുകയില്ല[b]’ എന്ന് അവൾ ഹൃദയത്തിൽ പറയുന്നു.
  to: അവൾ സ്വയം എത്രത്തോളം മഹത്ത്വപ്പെടുത്തി ആഡംബരത്തിൽ ജീവിച്ചുവോ[a], അത്രത്തോളം അവൾക്കു പീഡനവും വിലാപവും കൊടുക്കുവിൻ. കാരണം, ‘ഞാൻ രാജ്ഞിയായി ഇരിക്കുന്നു; ഞാൻ വിധവയല്ല; ഞാൻ ഒരിക്കലും വിലാപം കാണുകയില്ല[b]’ എന്ന് അവൾ ഹൃദയത്തിൽ പറയുന്നു.
  rationale: 'The revision retains every substantive feature of the SBLGNT text and the English audit trail: proportional recompense, self-exaltation, luxurious/self-indulgent living, torment and mourning, inward boastfulness, queen/widow imagery, and the emphatic denial of future mourning. It replaces less idiomatic wording and corrects the misleading footnote alternative without altering the passage’s meaning.'
