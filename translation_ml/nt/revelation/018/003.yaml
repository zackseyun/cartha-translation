    rationale: ‘വീഞ്ഞിൽനിന്ന് കുടിച്ചിരിക്കുന്നു’ മലയാളത്തിൽ അല്പം അസ്വാഭാവികമാണ്. വ്യത്യസ്ത വായനയിൽ ക്രിയ ‘കുടിച്ചിരിക്കുന്നു’ ആയാലും, മലയാളത്തിൽ കർമത്തെ നേരിട്ട് ‘വീഞ്ഞ് കുടിച്ചിരിക്കുന്നു’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം. ഇത് പാഠാർഥം മാറ്റുന്നില്ല.
  revised_text: എന്തെന്നാൽ, അവളുടെ ലൈംഗിക അധാർമികതയുടെ ക്രോധത്തിന്റെ വീഞ്ഞ് നിമിത്തം സകല ജനതകളും വീണുപോയിരിക്കുന്നു[a]; ഭൂമിയിലെ രാജാക്കന്മാർ അവളോടൊപ്പം ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെട്ടു[b]; ഭൂമിയിലെ വ്യാപാരികൾ അവളുടെ ആഡംബരഭോഗത്തിന്റെ ശക്തിയാൽ സമ്പന്നരായി[c].
