id: REV.18.3
reference: Revelation 18:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: ml
  text: എന്തെന്നാൽ, അവളുടെ ലൈംഗിക അധാർമികതയുടെ ക്രോധത്തിന്റെ വീഞ്ഞ് നിമിത്തം സകല ജനതകളും വീണുപോയിരിക്കുന്നു[a]; ഭൂമിയിലെ രാജാക്കന്മാർ അവളോടൊപ്പം ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെട്ടു[b]; ഭൂമിയിലെ വ്യാപാരികൾ അവളുടെ ആഡംബരഭോഗത്തിന്റെ ശക്തിയാൽ സമ്പന്നരായി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പാഠസാക്ഷ്യങ്ങളിൽ ‘സകല ജനതകളും അവളുടെ ലൈംഗിക അധാർമികതയുടെ ക്രോധത്തിന്റെ വീഞ്ഞ് കുടിച്ചിരിക്കുന്നു’ എന്നാണ്. ‘ക്രോധം’ എന്നതിന് ‘ഉഗ്രവികാരം’ എന്നും അർഥമാകാം; ഗ്രീക്കിലെ തുടർച്ചയായ ബന്ധപദങ്ങൾ ഒന്നിലധികം വിധത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്.
    reason: textual_and_lexical_alternative
  - marker: b
    text: ഇവിടത്തെ ‘ലൈംഗിക അധാർമികത’ എന്ന ഭാഷ അഴിമതി നിറഞ്ഞതും വിഗ്രഹാരാധനാപരവും ചൂഷണപരവുമായ സഖ്യത്തെ രൂപകമായി സൂചിപ്പിക്കാം; പരിഭാഷ ഗ്രീക്കിലെ ലൈംഗിക ദൃശ്യഭാഷ നിലനിർത്തുന്നു.
    reason: alternative_reading
  - marker: c
    text: ‘ആഡംബരഭോഗം’ എന്ന ഗ്രീക്ക് പദം വെറും സുഖസൗകര്യമല്ല, ധൂർത്തവും സ്വയംതൃപ്തിക്കായുള്ള അതിരുകടന്ന ആഡംബരവും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ബാബിലോണിന്റെ വീഴ്ചയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τοῦ οἴνου
  choice: വീഞ്ഞ് നിമിത്തം
  rationale: ἐκ ഇവിടെ കാരണമോ ഉറവിടമോ സൂചിപ്പിക്കുന്നു. നൽകിയിരിക്കുന്ന SBLGNT വായനയായ πέπτωκαν എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ കാരണബന്ധം വ്യക്തമാക്കാൻ ‘നിമിത്തം’ ഉപയോഗിച്ചു.
- source_word: θυμοῦ
  choice: ക്രോധത്തിന്റെ
  rationale: θυμός എന്നതിന് ക്രോധം എന്നും ശക്തമായ വികാരം എന്നും അർഥമാകാം. വെളിപ്പാടിന്റെ ന്യായവിധി പശ്ചാത്തലത്തിൽ ‘ക്രോധം’ പ്രധാനവായനയായി നിലനിർത്തി; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: πορνείας / ἐπόρνευσαν
  choice: ലൈംഗിക അധാർമികത / ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ ലൈംഗിക രൂപകം വ്യാഖ്യാനിച്ച് ‘വിഗ്രഹാരാധന’ എന്നൊന്നിലേക്ക് ചുരുക്കാതെ അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: πέπτωκαν
  choice: വീണുപോയിരിക്കുന്നു
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ πίπτω എന്ന ക്രിയയുടെ പൂർണകാലരൂപം നേരിട്ട് പരിഭാഷപ്പെടുത്തി. സന്ദർഭത്തിൽ പരിചിതമായ ‘കുടിച്ചിരിക്കുന്നു’ എന്ന വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: πάντα τὰ ἔθνη
  choice: സകല ജനതകളും
  rationale: ജനതകളെ സമൂഹമായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔμποροι
  choice: വ്യാപാരികൾ
  rationale: വെളിപ്പാട് 18-ലെ വാണിജ്യസന്ദർഭത്തിന് യോജിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: ἐκ τῆς δυνάμεως
  choice: ശക്തിയാൽ
  rationale: δύναμις എന്നതിലെ ശക്തി അർഥം വ്യാഖ്യാനിച്ച് ‘സമ്പത്ത്’ ആക്കാതെ നിലനിർത്തുന്നു; ഇവിടെ ആഡംബരഭോഗത്തിന്റെ സമ്പന്നമാക്കുന്ന പ്രാബല്യമാണ് സൂചന.
- source_word: στρήνους
  choice: ആഡംബരഭോഗം
  rationale: വെറും സുഖസൗകര്യമല്ല, സ്വയംതൃപ്തിക്കായുള്ള ധൂർത്തവും അതിരുകടന്നതുമായ ആഡംബരം സൂചിപ്പിക്കുന്ന പദം തെരഞ്ഞെടുത്തു.
- source_word: ἐπλούτησαν
  choice: സമ്പന്നരായി
  rationale: വാണിജ്യത്തിലൂടെ ധനികരായ ഫലം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πορνεία/πορνεύω എന്ന ലൈംഗിക ഭാഷയെ രൂപകത്തിന്റെ വ്യാഖ്യാനമായി മാറ്റണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘ലൈംഗിക അധാർമികത’ എന്ന രൂപകം നിലനിർത്തി
  alternative: വിഗ്രഹാരാധന; ആത്മീയ വ്യഭിചാരം; അഴിമതി നിറഞ്ഞ രാഷ്ട്രീയ-സാമ്പത്തിക സഖ്യം
  rationale: ഈ ദർശനത്തിലെ ഭാഷ മതപരവും രാഷ്ട്രീയവും സാമ്പത്തികവുമായ അവിശ്വസ്തതയെ ഒരുമിച്ച് സൂചിപ്പിക്കാം. ഒരു പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം സംരക്ഷിച്ചു.
- issue: πέπτωκαν എന്ന നൽകിയിരിക്കുന്ന പാഠവും സന്ദർഭത്തിൽ അറിയപ്പെടുന്ന ‘കുടിച്ചു’ എന്ന വായനയും
  choice: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തെ അനുസരിച്ച് ‘വീണുപോയിരിക്കുന്നു’
  alternative: ‘കുടിച്ചിരിക്കുന്നു’ എന്ന വ്യത്യസ്ത വായന
  rationale: മൂലഭാഷാ സ്രോതസ്സായി നൽകിയ പാഠത്തിന് മുൻഗണന നൽകി; എന്നാൽ വീഞ്ഞിന്റെ രൂപകവുമായി കൂടുതൽ എളുപ്പം ചേരുന്ന വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ സുതാര്യമായി അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ മൂന്നു സമാന്തര ഘടകങ്ങൾ അർദ്ധവിരാമങ്ങളാൽ വേർതിരിച്ചു. അപരിചിതമായ ബന്ധപദശൃംഖലയുടെ അർഥസങ്കീർണ്ണത പൂർണമായി ലളിതീകരിക്കാതെ പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
