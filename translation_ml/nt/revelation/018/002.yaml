id: REV.18.2
reference: Revelation 18:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: ml
  text: 'അവൻ ശക്തമായ ശബ്ദത്തിൽ വിളിച്ചുപറഞ്ഞു: “വീണു, വീണു, മഹത്തായ ബാബിലോൺ! അവൾ ഭൂതങ്ങളുടെ വാസസ്ഥലവും സകല അശുദ്ധാത്മാക്കളുടെയും തടവിടവും[a] സകല അശുദ്ധപ്പക്ഷികളുടെയും തടവിടവും സകല അശുദ്ധവും വെറുക്കപ്പെട്ടതുമായ മൃഗങ്ങളുടെയും തടവിടവും[b] ആയിത്തീർന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തടവിടം’ എന്നതിന് പകരം ‘താവളം’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം തടവിടത്തെയും ജീവികൾ വസിക്കുകയോ പതിവായി എത്തുകയോ ചെയ്യുന്ന ഇടത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘സകല അശുദ്ധവും വെറുക്കപ്പെട്ടതുമായ മൃഗങ്ങളുടെയും തടവിടവും’ എന്ന വാക്കുകൾ ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ἔκραξεν ἐν ἰσχυρᾷ φωνῇ
  choice: അതിശക്തമായ ശബ്ദത്തിൽ വിളിച്ചുപറഞ്ഞു
  rationale: κράζω സൂചിപ്പിക്കുന്ന ഉച്ചത്തിലുള്ള വിളിയും ἰσχυρός സൂചിപ്പിക്കുന്ന ശക്തിയും സ്വാഭാവികവും ഗാംഭീര്യമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: വീണു, ... വീണു
  rationale: ആവർത്തിച്ച എയോറിസ്റ്റിന്റെ പ്രവാചകീയ പ്രഖ്യാപനഭാവവും യെശയ്യാവിലെ ന്യായവിധിപ്രതിധ്വനിയും നിലനിർത്തുന്നതിനായി ക്രിയയുടെ ആവർത്തനം സംരക്ഷിച്ചു; മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിനായി നാമപദം രണ്ടു ക്രിയകൾക്കിടയിൽ വെച്ചു.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: മഹതിയായ ബാബിലോൺ
  rationale: ἡ μεγάλη എന്ന വിശേഷണത്തിന്റെ ബഹുമാനസൂചകമല്ലാത്ത, വലിപ്പം/പ്രാധാന്യം സൂചിപ്പിക്കുന്ന തലക്കെട്ടുസ്വഭാവം ‘മഹതിയായ’ വഴി ഗാംഭീര്യത്തോടെ നൽകുന്നു.
- source_word: ἐγένετο κατοικητήριον δαιμονίων
  choice: ഭൂതങ്ങളുടെ വാസസ്ഥലം ... ആയിത്തീർന്നു
  rationale: ἐγένετοയുടെ ഫലാവസ്ഥയും κατοικητήριον എന്നതിന്റെ യഥാർഥ താമസസ്ഥല അർഥവും വ്യക്തമാക്കുന്നു; δαιμόνιαയ്ക്ക് പൊതുവായി മനസ്സിലാകുന്ന ‘ഭൂതങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: φυλακὴ
  choice: തടവിടം
  rationale: പദത്തിന് തടവ്, കാവൽ, സൂക്ഷിപ്പിടം, ജീവികൾ വസിക്കുന്ന/വിഹരിക്കുന്ന ഇടം എന്നീ സാധ്യതകളുണ്ട്. ‘തടവിടം’ confinement/keeping എന്ന മുഖ്യാർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: സകല അശുദ്ധാത്മാക്കളും
  rationale: ‘അശുദ്ധാത്മാവ്’ ബൈബിൾ പ്രയോഗബന്ധം നിലനിർത്തുന്നു; παντός എന്ന സമഗ്രത ‘സകല’ വഴി നൽകുന്നു.
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: സകല അശുദ്ധപ്പക്ഷികളും
  rationale: ὄρνεον എന്ന പൊതുവായ ‘പക്ഷി’ അർഥം നിലനിർത്തി; ശവംതീനിപ്പക്ഷി മുതലായ കൂടുതൽ നിർദിഷ്ട അർഥം ഇറക്കുമതി ചെയ്തില്ല.
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: സകല അശുദ്ധവും വെറുക്കപ്പെട്ടതുമായ മൃഗങ്ങൾ
  rationale: θηρίον ഇവിടെ ‘സകല’ എന്നതിനുകീഴിൽ പക്ഷികളോടൊപ്പം വരുന്നതിനാൽ പൊതുവായ മൃഗം എന്ന അർഥം സ്വീകരിച്ചു. μεμισημένουയുടെ perfect passive/resultative ഭാവം ‘വെറുക്കപ്പെട്ട’ എന്ന് നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: θηρίον ഇവിടെ വെളിപ്പാടിലെ സാങ്കേതിക തലക്കെട്ടായ ‘മൃഗം’ ആണോ പൊതുനാമമാണോ
  choice: പൊതുനാമമായ ‘മൃഗം’
  alternative: പ്രതീകാത്മക എതിരാളിയെ സൂചിപ്പിക്കുന്ന ‘മൃഗം’ എന്ന സാങ്കേതിക തലക്കെട്ട്
  rationale: παντός എന്നതിനുകീഴിൽ അശുദ്ധാത്മാവിനോടും അശുദ്ധപ്പക്ഷിയോടും ചേർന്നുള്ള പട്ടിക പൊതുവായ ജീവിവർഗത്തെ സൂചിപ്പിക്കുന്നു; പ്രത്യേക അന്തകാലശാസ്ത്ര തിരിച്ചറിയൽ ഇറക്കുമതി ചെയ്യുന്നത് ഒഴിവാക്കി.
- issue: φυλακήയുടെ ദൃശ്യരൂപം തടവിനെയോ വാസകേന്ദ്രത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: മുഖ്യപാഠത്തിൽ ‘തടവിടം’
  alternative: ‘വിഹാരകേന്ദ്രം’ അല്ലെങ്കിൽ ‘താവളം’
  rationale: തടവ്/സൂക്ഷിപ്പ് എന്ന നേരിട്ടുള്ള പദാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; വസിക്കുന്നതോ പതിവായി എത്തുന്നതോ ആയ ഇടം എന്ന യഥാർഥ സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ നൽകി, അപോകലിപ്റ്റിക് ദൃശ്യത്തെ ഒറ്റവിധം തീർപ്പാക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ഗാംഭീര്യമുള്ള പ്രഖ്യാപനശൈലി സ്വീകരിച്ചു. ‘വീണു’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ പ്രവാചകീയ താളം സംരക്ഷിക്കുന്നു. ‘അശുദ്ധാത്മാവ്’, ‘വാസസ്ഥലം’, ‘ആയിത്തീർന്നു’ തുടങ്ങിയ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കുമ്പോഴും വെളിപ്പാടിന്റെ ഉയർന്ന ശൈലി നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
