id: REV.18.12
reference: Revelation 18:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γόμον χρυσοῦ καὶ ἀργύρου καὶ λίθου τιμίου καὶ ⸀μαργαριτῶν καὶ βυσσίνου καὶ ⸀πορφύρας καὶ σιρικοῦ καὶ κοκκίνου, καὶ πᾶν ξύλον θύϊνον καὶ πᾶν σκεῦος ἐλεφάντινον καὶ πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/012.yaml
  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: ml
  text: സ്വർണം, വെള്ളി, വിലയേറിയ കല്ലുകൾ, മുത്തുകൾ, നേർത്ത ലിനൻ തുണി, ധൂമ്രനിറമുള്ള തുണി, പട്ട്, കടുംചുവപ്പുനിറമുള്ള തുണി, എല്ലാത്തരം സുഗന്ധമുള്ള വിലയേറിയ മരത്തടി[a], എല്ലാത്തരം ആനക്കൊമ്പ് വസ്തുക്കൾ, അതിവിലയേറിയ മരത്തടി, വെങ്കലം, ഇരുമ്പ്, മാർബിൾ എന്നിവകൊണ്ടുള്ള എല്ലാത്തരം വസ്തുക്കൾ—ഇവയുടെ ചരക്കും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തൂയിൻ മരത്തടി”; വിലയേറിയതും സുഗന്ധമുള്ളതുമായ ഒരിനം മരത്തടിക്കുള്ള പരമ്പരാഗത പേര്.
    reason: θύϊνος എന്ന അപൂർവ പദത്തിന്റെ പരമ്പരാഗത നാമവും സസ്യതിരിച്ചറിയലിലെ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: γόμον
  choice: ചരക്ക്
  rationale: കപ്പലിൽ കൊണ്ടുപോകുന്ന ചരക്കിനെയോ വാണിജ്യസാധനങ്ങളുടെ കൂട്ടത്തെയോ സൂചിപ്പിക്കുന്ന ഏകവചന കൂട്ടർഥം; മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന പട്ടികയ്ക്ക് സ്വാഭാവികം.
- source_word: λίθου τιμίου
  choice: വിലയേറിയ കല്ലുകൾ
  rationale: ഗ്രീക്കിൽ ഏകവചന വസ്തുനാമമാണെങ്കിലും മലയാളത്തിലെ വാണിജ്യപ്പട്ടികയിൽ കൂട്ടർഥം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: μαργαριτῶν
  choice: മുത്തുകൾ
  rationale: പദത്തിന്റെ സാധാരണ അർഥവും ഗ്രീക്കിലെ ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: βυσσίνου
  choice: നേർത്ത ചണവസ്ത്രം
  rationale: ആഡംബരഗുണമുള്ള അതിസൂക്ഷ്മമായ ലിനൻ തുണിയെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ പറയുന്നു.
- source_word: πορφύρας
  choice: ധൂമ്രവസ്ത്രം
  rationale: നിറമോ ചായമോ തുണിയോ സൂചിപ്പിക്കാവുന്ന പദം; വാണിജ്യപ്പട്ടികയിലെ വസ്തുവെന്ന നിലയിൽ ‘വസ്ത്രം’ വ്യക്തമാക്കി.
- source_word: σιρικοῦ
  choice: പട്ട്
  rationale: പട്ടിനെയോ പട്ടുവസ്തുക്കളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: κοκκίνου
  choice: കടുംചുവപ്പുവസ്ത്രം
  rationale: സ്കാർലറ്റ് നിറമുള്ള തുണിയെന്ന വാണിജ്യവസ്തുവിനെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: πᾶν ξύλον θύϊνον
  choice: എല്ലാത്തരം സുഗന്ധമുള്ള വിലയേറിയ മരത്തടി
  rationale: θύϊνος എന്ന അപൂർവ വൃക്ഷനാമത്തിന്റെ കൃത്യമായ സസ്യതിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ ഉറപ്പില്ലാത്ത ‘സിട്രൺ’ എന്ന തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ അതിന്റെ വിലയും സുഗന്ധവും അറിയിച്ചു.
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: എല്ലാത്തരം ആനക്കൊമ്പുപാത്രങ്ങൾ
  rationale: σκεῦος എന്നത് പാത്രം, ഉപകരണം, വസ്തു എന്നിവയെ ഉൾക്കൊള്ളാം; ആവർത്തിത പട്ടികാസംരചനയിൽ ‘പാത്രങ്ങൾ’ സംക്ഷിപ്തവും യോജിച്ചതുമാണ്.
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: അതിവിലയേറിയ മരത്തടി ... എന്നിവകൊണ്ടുള്ള എല്ലാത്തരം പാത്രങ്ങൾ
  rationale: τιμιωτάτου എന്ന അതിശയോക്തിരൂപത്തിന്റെ ശക്തി ‘അതിവിലയേറിയ’ എന്ന് നിലനിർത്തുകയും, തുടർന്നുള്ള ലോഹങ്ങളും മാർബിളും അതേ ‘പാത്രങ്ങൾ’ എന്ന നാമത്തോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്തു.
- source_word: χαλκοῦ
  choice: വെങ്കലം
  rationale: ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാവുന്ന പദത്തിൽ പുരാതന വസ്തുക്കളുടെ സന്ദർഭത്തിന് ‘വെങ്കലം’ യോജിക്കുന്നു.
- source_word: σιδήρου
  choice: ഇരുമ്പ്
  rationale: സാധാരണവും നേരിട്ടുള്ളതുമായ അർഥം.
- source_word: μαρμάρου
  choice: മാർബിൾ
  rationale: ആധുനിക മലയാളത്തിൽ വ്യാപകമായി മനസ്സിലാകുന്ന വസ്തുനാമം.
