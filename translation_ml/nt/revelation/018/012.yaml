translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യവുമായ വ്യാപാരപ്പട്ടികാശൈലി. ഈ വാക്യം മുൻവാക്യത്തിൽനിന്നു വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ ‘ഇവയുടെ ചരക്കും’ എന്നും കോമയും നിലനിർത്തി. മരത്തടി, വെങ്കലം, ഇരുമ്പ്, മാർബിൾ എന്നിവയെല്ലാം പാത്രങ്ങളുടെ നിർമ്മാണവസ്തുക്കളായി വായിക്കാവുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി കൂട്ടിച്ചേർത്തു.
