  naturalness: The lament is generally fluent and suitably elevated. “തലയിൽ പൊടി എറിഞ്ഞിട്ട്,” “ഐശ്വര്യത്തിൽനിന്ന്,” and “ഒറ്റ മണിക്കൂറിനുള്ളിൽ” are more idiomatic and precise in modern standard Malayalam. “പാഴാക്കപ്പെട്ടു” naturally conveys a city being laid waste while retaining the passive.
  terminology: “അയ്യോ, അയ്യോ” is a defensible modern lament equivalent for Οὐαὶ οὐαί. “ഐശ്വര്യം” communicates the commercial magnificence/wealth implied by τιμιότης without the unnatural collocation “വിലയേറിയ സമൃദ്ധി.” The passive for ἠρημώθη is retained without specifying an agent.
