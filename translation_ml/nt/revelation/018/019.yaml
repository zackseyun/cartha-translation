id: REV.18.19
reference: Revelation 18:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: ml
  text: 'അവർ തങ്ങളുടെ തലയിൽ പൊടി എറിഞ്ഞിട്ട്, കരഞ്ഞും വിലപിച്ചും ഉറക്കെ നിലവിളിച്ചു: “അയ്യോ, അയ്യോ[a], മഹാനഗരമേ! കടലിൽ കപ്പലുകളുണ്ടായിരുന്ന എല്ലാവരും നിന്റെ ഐശ്വര്യത്തിൽനിന്ന് സമ്പന്നരായല്ലോ! ഒറ്റ മണിക്കൂറിനുള്ളിൽ നീ പാഴാക്കപ്പെട്ടുവല്ലോ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹാ കഷ്ടം, ഹാ കഷ്ടം.” ഗ്രീക്ക് ഉദ്ഗാരം വിലാപം പ്രകടിപ്പിക്കുകയും ഈ സന്ദർഭത്തിൽ ന്യായവിധിയുടെ ഗൗരവം സൂചിപ്പിക്കുകയും ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: തങ്ങളുടെ തലയിൽ പൊടി വാരിയിട്ട്
  rationale: ദുഃഖാചരണത്തിന്റെ ദൃശ്യമായ പ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: കരഞ്ഞും വിലപിച്ചുംകൊണ്ട് ഉറക്കെ നിലവിളിച്ചു
  rationale: ἔκραξαν എന്നതിലെ ഉച്ചത്തിലുള്ള നിലവിളിയും κλαίοντες, πενθοῦντες എന്നിവയിലെ കണ്ണീരും ദുഃഖാചരണവും വേർതിരിച്ചും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: Οὐαὶ οὐαί
  choice: അയ്യോ, അയ്യോ
  rationale: മലയാളത്തിൽ വിലാപവും ദുരന്തബോധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന ആവർത്തിത ഉദ്ഗാരം; ന്യായവിധിയുടെ ഗൗരവം സന്ദർഭം നിലനിർത്തുന്നു.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: മഹാനഗരമേ
  rationale: നഗരത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന വിലാപരീതിക്ക് യോജിച്ച സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: ἐν ᾗ ἐπλούτησαν
  choice: നിന്റെ ... സമൃദ്ധിയാൽ സമ്പന്നരായല്ലോ
  rationale: ἐν ᾗ എന്നതിന്റെ വാച്യമായ ‘അതിൽ’ എന്ന രൂപത്തേക്കാൾ, തുടർന്നുള്ള ἐκ τῆς τιμιότητος αὐτῆς വ്യക്തമാക്കുന്ന ഉപാധി/ഉറവിടബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: കടലിൽ കപ്പലുകളുണ്ടായിരുന്ന എല്ലാവരും
  rationale: ἔχοντες എന്നതിനെ ‘ഉടമകൾ’ എന്നു അധികമായി നിർണ്ണയിക്കാതെ, ഗ്രീക്കിനോട് അടുത്തുനിൽക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: നിന്റെ വിലയേറിയ സമൃദ്ധിയാൽ
  rationale: τιμιότης എന്നതിലെ വിലമതിപ്പ്, ചെലവേറിയ ഭംഗി, സമൃദ്ധി എന്നീ അർത്ഥനിറങ്ങളെ ഒറ്റ സാമ്പത്തിക പദമായി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: μιᾷ ὥρᾳ
  choice: ഒറ്റ മണിക്കൂറുകൊണ്ട്
  rationale: നാശത്തിന്റെ അതിവേഗതയും പെട്ടെന്നുള്ള സമ്പൂർണതയും ഊന്നിപ്പറയുന്നു.
- source_word: ἠρημώθη
  choice: ശൂന്യമാക്കപ്പെട്ടു
  rationale: ക്രിയയുടെ ദൈവിക കർത്താവിനെ വ്യക്തമാക്കാതെ തന്നെ ഗ്രീക്കിലെ കർമണിപ്രയോഗവും നാശഫലവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: Οὐαὶ οὐαί എന്ന വിലാപ-ന്യായവിധി ഉദ്ഗാരത്തിന്റെ പരിഭാഷ
  choice: അയ്യോ, അയ്യോ
  alternative: ഹാ കഷ്ടം, ഹാ കഷ്ടം
  rationale: ‘അയ്യോ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ വിലാപോദ്ഗാരമാണ്; ആവർത്തനവും സന്ദർഭവും പ്രവാചകീയ ന്യായവിധിയുടെ ഭാരം നിലനിർത്തുന്നു. ‘ഹാ കഷ്ടം’ കൂടുതൽ പരമ്പരാഗതമായെങ്കിലും ആധുനിക മലയാളത്തിൽ കുറച്ച് കൃത്രിമമായി കേൾക്കാം.
- issue: ἠρημώθη എന്ന കർമണിപ്രയോഗത്തിലെ പ്രവർത്തകനെ നിർണ്ണയിക്കൽ
  choice: ശൂന്യമാക്കപ്പെട്ടു
  alternative: ദൈവം ശൂന്യമാക്കി
  rationale: മൂലപാഠം പ്രവർത്തകനെ പേരെടുത്തുപറയുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായി പ്രവർത്തകനെ ചേർത്ത് അവ്യക്തത നീക്കാതെ കർമണിപ്രയോഗം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. നഗരത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന വിലാപത്തിന്റെ വികാരതീവ്രത നിലനിർത്താൻ സംബോധനരൂപവും ‘-ല്ലോ/-വല്ലോ’ ഭാവവും ഉപയോഗിച്ചു; പഴഞ്ചൻ പദസമ്പത്ത് ഒഴിവാക്കി.
