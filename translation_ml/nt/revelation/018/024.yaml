id: REV.18.24
reference: Revelation 18:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: ml
  text: അവളിൽ പ്രവാചകന്മാരുടെയും വിശുദ്ധരുടെയും, ഭൂമിയിൽ അറുക്കപ്പെട്ട എല്ലാവരുടെയും രക്തം കണ്ടെത്തപ്പെട്ടു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവത്തിന്റെ വിശുദ്ധജനം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഭൂമിയിൽ വധിക്കപ്പെട്ട എല്ലാവരുടെയും.’ ‘അറുക്കപ്പെട്ട’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം സാധാരണ കൊലപാതകത്തെക്കാൾ ശക്തമാണ്; അത് ക്രൂരമായ വധത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘അവൾ’ എന്നത് ചുറ്റുപാടിലുള്ള ദർശനത്തിൽ സ്ത്രീയായി ചിത്രീകരിക്കപ്പെടുന്ന ബാബിലോണിനെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: അവളിൽ
  rationale: സ്ത്രീയായി ചിത്രീകരിക്കപ്പെടുന്ന ബാബിലോണിനെയാണ് സ്ത്രീലിംഗ സർവനാമം സൂചിപ്പിക്കുന്നത്; വ്യക്തിവൽക്കരണം നിലനിർത്തുന്നു.
- source_word: αἷμα
  choice: രക്തം
  rationale: നേരിട്ടുള്ള അർഥം നൽകുകയും സന്ദർഭത്തിലെ രക്തപാതകക്കുറ്റത്തിന്റെ ന്യായവിധിസ്വരം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: προφητῶν
  choice: പ്രവാചകന്മാരുടെ
  rationale: προφήτης എന്ന പദത്തിന്റെ സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: ἁγίων
  choice: വിശുദ്ധരുടെ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗം; 'വിശുദ്ധജനത്തിന്റെ' എന്നതും സാധ്യമാണ്.
- source_word: εὑρέθη
  choice: കണ്ടെത്തി
  rationale: ദൃശ്യമാകുകയോ വെളിപ്പെടുകയോ ചെയ്തുവെന്ന ന്യായവിധിസ്വരം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: πάντων τῶν ἐσφαγμένων
  choice: അറുക്കപ്പെട്ട എല്ലാവരുടെയും
  rationale: σφάζω സൂചിപ്പിക്കുന്ന ക്രൂരമായ കൊലയുടെ ശക്തി സാധാരണ 'കൊല്ലുക' എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: വെളിപ്പാടിലെ വിശാലമായ അപ്പോക്കലിപ്റ്റിക് പരിധിക്ക് യോജിക്കുന്ന വിധത്തിൽ γῆയെ 'ഭൂമി' എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ബാബിലോണിന്റെ കുറ്റത്തിന്റെ വ്യാപ്തി
  choice: പ്രവാചകന്മാരുടെയും വിശുദ്ധരുടെയും മാത്രമല്ല, ഭൂമിയിൽ അറുക്കപ്പെട്ട എല്ലാവരുടെയും രക്തത്തിന് ബാബിലോണിനെ ഉത്തരവാദിയാക്കുന്ന സമഗ്രമായ കുറ്റാരോപണം നിലനിർത്തി.
  alternative: അവസാന ഭാഗത്തെ സകല നീതിരക്തപാതകത്തിന്റെയും പ്രതിനിധിയായ ബാബിലോണിനെക്കുറിച്ചുള്ള അതിശയോക്തിപരമായ അപ്പോക്കലിപ്റ്റിക് ഭാഷയായി വായിക്കാം.
  rationale: ചരിത്രവുമായി ഈ പ്രതീകം എങ്ങനെ ബന്ധപ്പെടുന്നു എന്ന് ഗ്രീക്ക് പാഠം വിശദീകരിക്കുന്നില്ല; അതിനാൽ കുറ്റാരോപണത്തിന്റെ വ്യാപ്തി ചുരുക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ബാബിലോണിന്റെ സ്ത്രീരൂപകൽപ്പനയ്ക്കായി ‘അവളിൽ’ നിലനിർത്തി; σφάζωയുടെ ശക്തിക്കായി ‘അറുക്കപ്പെട്ട’ ഉപയോഗിച്ചു. പദ്യത്തിന്റെ സമാന്തരഘടന വ്യക്തമാക്കാൻ രണ്ടാം ‘രക്തവും’ മലയാളത്തിൽ ആവർത്തിച്ചു.
