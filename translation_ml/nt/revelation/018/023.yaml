source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: ml
  text: വിളക്കിന്റെ വെളിച്ചം ഇനി ഒരിക്കലും നിന്നിൽ പ്രകാശിക്കുകയില്ല; മണവാളന്റെയും മണവാട്ടിയുടെയും ശബ്ദം ഇനി ഒരിക്കലും നിന്നിൽ കേൾക്കുകയുമില്ല. കാരണം, നിന്റെ വ്യാപാരികൾ ഭൂമിയിലെ പ്രമാണിമാരായിരുന്നു[a]; നിന്റെ മന്ത്രവാദത്താൽ[b] സകല ജനതകളും വഴിതെറ്റിക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഭൂമിയിലെ അധികാരശാലികൾ.’ ഗ്രീക്കുപദം വലിയ സ്ഥാനമോ സ്വാധീനമോ അധികാരമോ ഉള്ളവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മായാവിദ്യയാൽ’ അല്ലെങ്കിൽ ‘ആഭിചാരത്താൽ.’ ഗ്രീക്കിലെ φαρμακεία മന്ത്രവാദത്തെയോ മായാജാലത്തിലൂടെയുള്ള വഞ്ചനയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: വിളക്കിന്റെ വെളിച്ചം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടന നേരിട്ട് നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: ഇനി ഒരിക്കലും ... പ്രകാശിക്കുകയില്ല
  rationale: οὐ μή നൽകുന്ന ശക്തമായ നിഷേധവും ἔτι സൂചിപ്പിക്കുന്ന പൂർണമായ വിരാമവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν σοὶ
  choice: നിന്നിൽ
  rationale: ബാബിലോൻ നഗരത്തെ വ്യക്തിയായി അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: മണവാളന്റെയും മണവാട്ടിയുടെയും ശബ്ദം
  rationale: φωνήയുടെ ‘ശബ്ദം/സ്വരം’ എന്ന അർഥവും പ്രവാചകീയ ന്യായവിധിഭാഷയുടെ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: ഇനി ഒരിക്കലും ... കേൾക്കുകയുമില്ല
  rationale: ഗ്രീക്കിലെ ശക്തമായ നിഷേധവും കർമണിപ്രയോഗത്തിന്റെ അർഥവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘-യുമില്ല’ മുൻവാക്യത്തോടുള്ള സമാന്തരത സൂചിപ്പിക്കുന്നു.
- source_word: οἱ ἔμποροί σου
  choice: നിന്റെ വ്യാപാരികൾ
  rationale: അധ്യായത്തിലെ വാണിജ്യസന്ദർഭത്തിന് യോജിക്കുന്ന സാധാരണവും കൃത്യവുമായ പദം.
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: ഭൂമിയിലെ പ്രമാണിമാർ
  rationale: μεγιστᾶνες സൂചിപ്പിക്കുന്ന ഉന്നതസ്ഥാനവും സ്വാധീനവും ഉൾക്കൊള്ളുന്നു; രാഷ്ട്രീയ കുലീനതയിലേക്കോ ധനികവർഗത്തിലേക്കോ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: നിന്റെ മന്ത്രവാദത്താൽ
  rationale: φαρμακείαയുടെ മായാജാല-മന്ത്രപ്രയോഗ അർഥം വ്യക്തമാക്കുന്നു; ആധുനിക ഔഷധപ്രയോഗം എന്ന തെറ്റായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: ἐπλανήθησαν
  choice: വഴിതെറ്റിക്കപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ കർമണിരൂപവും വഞ്ചനയിലൂടെയോ പ്രലോഭനത്തിലൂടെയോ തെറ്റിലേക്ക് നയിക്കപ്പെടുക എന്ന വിശാലതയും സംരക്ഷിക്കുന്നു.
- source_word: πάντα τὰ ἔθνη
  choice: സകല ജനതകളും
  rationale: ലോകത്തിലെ ജനസമൂഹങ്ങളെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന വെളിപ്പാടുപുസ്തകത്തിലെ പ്രയോഗത്തിന് യോജിക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാല ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ φαρμακείαയുടെ പരിഭാഷ
  choice: മന്ത്രവാദം
  alternative: മായാവിദ്യ / ആഭിചാരം
  rationale: മാന്ത്രികപ്രയോഗവും വഞ്ചനാത്മക ആത്മീയ സ്വാധീനവും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ഔഷധങ്ങളുമായി മാത്രം ബന്ധിപ്പിക്കുന്ന ആധുനിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- issue: ആവർത്തിക്കുന്ന οὐ μή വാക്യങ്ങളുടെ ശക്തി
  choice: ഇനി ഒരിക്കലും ... ഇല്ല
  alternative: ഇനി ... ഇല്ല / തീർച്ചയായും ... ഇല്ല
  rationale: ബാബിലോനോടുള്ള വിധിയുടെ മാറ്റാനാവാത്ത അന്തിമത്വം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. നഗരത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ‘നിന്നിൽ/നിന്റെ’ രൂപങ്ങൾ നിലനിർത്തി. രണ്ട് നിഷേധവാക്യങ്ങളുടെയും സമാന്തരഘടന സംരക്ഷിച്ചു; വ്യാഖ്യാനപരമായി അർഥം ചുരുക്കുന്ന പദങ്ങൾ ഒഴിവാക്കി.
