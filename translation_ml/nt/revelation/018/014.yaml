  source_fidelity: 'പ്രധാന അർഥം ശരിയായി കൈമാറുന്നു: ὀπώραയുടെ ‘ഫലം,’ ഉള്ളിലെ ആഗ്രഹം, ആഡംബര-ശോഭയുള്ള വസ്തുക്കളുടെ നഷ്ടം, ഒടുവിലത്തെ ശക്തമായ നിഷേധം എന്നിവ നിലനിൽക്കുന്നു. എന്നാൽ ‘നിന്നിൽനിന്ന് ഇല്ലാതായി’ എന്ന പ്രയോഗം ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമല്ല; ἀπώλετο ἀπὸ σοῦയുടെ ‘നിനക്കു നഷ്ടമായി’ എന്ന നഷ്ടബോധം കൂടുതൽ നേരിട്ടു നൽകണം.'
  naturalness: ‘സമൃദ്ധവും ശോഭയേറിയതുമായ സകലവും’ എന്നത് വസ്തുക്കളെ സൂചിപ്പിക്കുന്നതിൽ അല്പം അപൂർണവും, അതിലെ സംയുക്തവിശേഷണം രണ്ടു ഗ്രീക്ക് നാമവൽക്കരിച്ച വിശേഷണങ്ങളുടെ വ്യാപ്തി മങ്ങിക്കളയാനും ഇടയാക്കുന്നു. ‘സമൃദ്ധമായതും ശോഭയേറിയതുമായ സകല വസ്തുക്കളും’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
  terminology: ‘ഉള്ളം കൊതിച്ച ഫലം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ψυχήയും ἐπιθυμίαയും സൂചിപ്പിക്കുന്നു. ‘പ്രാണന്റെ അഭിലാഷം’ എന്ന അടിക്കുറിപ്പ് പദാനുപദത്വം കാണിക്കുന്നുവെങ്കിലും നിലവിലെ ഭാഷയിൽ അസ്വാഭാവികമാണ്; ‘ഉള്ളത്തിന്റെ ആഗ്രഹം’ കൂടുതൽ വ്യക്തമാകുന്നു. അവസാനത്തെ നിഷ്ക്രിയസമാന രൂപം ഗ്രീക്കിലെ അനിർദിഷ്ട മൂന്നാംപുരുഷ ബഹുവചനത്തിന്റെ വ്യാഖ്യാനസാധ്യത സംരക്ഷിക്കുന്നു.
