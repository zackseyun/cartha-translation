id: REV.18.14
reference: Revelation 18:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: ml
  text: നിന്റെ ഉള്ളം കൊതിച്ച ഫലം നിന്നെ വിട്ടുപോയി[a]; സമൃദ്ധമായതും ശോഭയേറിയതുമായ സകല വസ്തുക്കളും നിനക്കു നഷ്ടമായി; അവ ഇനി ഒരിക്കലും കണ്ടെത്തപ്പെടുകയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘നിന്റെ ഉള്ളത്തിന്റെ ആഗ്രഹത്തിന്റെ ഫലം.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവർ അവയെ ഇനി ഒരിക്കലും കണ്ടെത്തുകയില്ല.’ ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπώρα
  choice: ഫലം
  rationale: പാകമായതോ വിളവുകാലാവസാനത്തേതോ ആയ പഴത്തെ സൂചിപ്പിക്കാവുന്ന പദമാണിത്. ആഡംബരവസ്തുക്കളെക്കുറിച്ചുള്ള വിലാപത്തിൽ രൂപകം നിലനിർത്താൻ ‘ഫലം’ അനുയോജ്യമാണ്.
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: നിന്റെ ഉള്ളം കൊതിച്ച
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ശൃംഖലയുടെ അർഥവും ആന്തരികമായ തീവ്രാഭിലാഷവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: നിന്നെ വിട്ടുപോയി
  rationale: വിട്ടകന്നതും ഇപ്പോൾ കൈവശമില്ലാത്തതുമായ അവസ്ഥയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πάντα τὰ λιπαρὰ
  choice: സമൃദ്ധമായ സകലവും
  rationale: λιπαρά ഇവിടെ കൊഴുപ്പുള്ള ഭക്ഷണം മാത്രമല്ല, സമ്പന്നതയും ആഡംബരവും നിറഞ്ഞ വസ്തുക്കളെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
- source_word: τὰ λαμπρὰ
  choice: ശോഭയേറിയതുമായ
  rationale: പ്രകാശം, മോടി, പ്രൗഢി എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്ന പദം; വ്യാപാര-ആഡംബര പശ്ചാത്തലത്തിൽ ‘ശോഭയേറിയ’ സ്വാഭാവികമാണ്.
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: നിന്നിൽനിന്ന് ഇല്ലാതായി
  rationale: നഷ്ടപ്പെട്ടതും തിരിച്ചുകിട്ടാനാവാത്തതുമായ ഭാവം നൽകുന്നു; മലയാളത്തിൽ അസ്വാഭാവികമായ ‘നിന്നിൽനിന്ന് നശിച്ചു’ എന്ന രൂപം ഒഴിവാക്കുന്നു.
- source_word: οὐκέτι οὐ μὴ
  choice: ഇനി ഒരിക്കലും ... ഇല്ല
  rationale: ഗ്രീക്കിലെ ശക്തമായ നിഷേധവും അന്തിമത്വവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αὐτὰ εὑρήσουσιν
  choice: അവ ... കണ്ടെത്തപ്പെടുകയുമില്ല
  rationale: ക്രിയയുടെ മൂന്നാം പുരുഷ ബഹുവചനത്തിന് വ്യക്തമായ കർത്താവ് ഗ്രീക്കിൽ ഇല്ല. പുതിയൊരു കർത്താവിനെ ചേർക്കാതെ നിഷ്ക്രിയരൂപത്തിൽ അർഥം നൽകുന്നു.
theological_decisions:
- issue: εὑρήσουσιν എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: ‘അവ ... കണ്ടെത്തപ്പെടുകയുമില്ല’ എന്ന കർത്തൃരഹിത/നിഷ്ക്രിയസമാന അർഥം
  alternative: ‘അവർ അവയെ ഇനി ഒരിക്കലും കണ്ടെത്തുകയില്ല’ എന്ന അനിശ്ചിത കർത്താവോടെയുള്ള രൂപം
  rationale: ഗ്രീക്കിൽ മൂന്നാം പുരുഷ ബഹുവചന ക്രിയയുണ്ടെങ്കിലും കർത്താവിനെ വ്യക്തമാക്കുന്നില്ല. മുഖ്യവാചകത്തിൽ പ്രത്യേക വ്യക്തികളെ ചേർക്കാതെ നഷ്ടത്തിന്റെ അന്തിമത്വം നിലനിർത്തുകയും വ്യാകരണപരമായ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ബാബിലോണിനോടുള്ള ഏകവചന അഭിസംബോധനയായി ‘നിന്റെ/നിന്നെ’ നിലനിർത്തി. സെമിറ്റിക് ഭാവമുള്ള പദാനുപദ ‘പ്രാണൻ’ മുഖ്യവാചകത്തിൽക്കാൾ സ്വാഭാവികമായ ‘ഉള്ളം’ ഉപയോഗിച്ചു; പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
