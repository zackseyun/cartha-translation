    rationale: ഇത് വസ്തുക്കൾ ‘നിന്നിൽനിന്ന്’ നശിച്ചുപോയി എന്ന അസ്വാഭാവിക ബന്ധം സൃഷ്ടിക്കുന്നു. സന്ദർഭത്തിൽ ഉദ്ദേശ്യം ബാബിലോണിന് അവ നഷ്ടമായിരിക്കുന്നു എന്നതാണ്; ‘നിനക്കു നഷ്ടമായി’ അത് സ്വാഭാവികമായും വിശ്വസ്തമായും പറയുന്നു.
