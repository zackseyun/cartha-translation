revisions:
- from: നിന്റെ ഉള്ളം കൊതിച്ച ഫലം നിന്നെ വിട്ടുപോയി[a]; സമൃദ്ധവും ശോഭയേറിയതുമായ സകലവും നിന്നിൽനിന്ന് ഇല്ലാതായി; അവ ഇനി ഒരിക്കലും കണ്ടെത്തപ്പെടുകയുമില്ല.[b]
  to: നിന്റെ ഉള്ളം കൊതിച്ച ഫലം നിന്നെ വിട്ടുപോയി[a]; സമൃദ്ധമായതും ശോഭയേറിയതുമായ സകല വസ്തുക്കളും നിനക്കു നഷ്ടമായി; അവ ഇനി ഒരിക്കലും കണ്ടെത്തപ്പെടുകയില്ല[b].
