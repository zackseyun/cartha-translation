id: REV.18.11
reference: Revelation 18:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: ml
  text: ഭൂമിയിലെ[b] വ്യാപാരികൾ അവളെച്ചൊല്ലി[a] കരയുകയും വിലപിക്കുകയും ചെയ്യുന്നു; കാരണം അവരുടെ ചരക്ക് ഇനി ആരും വാങ്ങുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളെക്കുറിച്ച്’ അല്ലെങ്കിൽ ‘അവൾനിമിത്തം.’
    reason: ἐπ’ αὐτήν എന്ന പ്രയോഗം വിലാപത്തിന്റെ വിഷയമോ കാരണമോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിലെ ‘അവളെച്ചൊല്ലി’ ഈ അർഥവ്യാപ്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
  - marker: b
    text: ‘ഭൂമി’ എന്നതിനുപകരം ‘ദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം. വെളിപ്പാടിൽ ഇവിടെ വിശാലമായ ലോകവ്യാപ്തിയാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: γῆ എന്ന ഗ്രീക്കുപദത്തിന്റെ യഥാർഥമായ മറ്റൊരു അർഥസാധ്യത രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ἔμποροι
  choice: വ്യാപാരികൾ
  rationale: വാണിജ്യത്തിൽ ഏർപ്പെട്ടിരിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപദം; വെളിപ്പാട് 18-ലെ ആഡംബരവസ്തുക്കളുടെ വ്യാപാരസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: τῆς γῆς
  choice: ഭൂമിയിലെ
  rationale: γῆ എന്നതിന് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാകാം. വെളിപ്പാടിലെ വിശാലമായ ന്യായവിധിസന്ദർഭം കണക്കിലെടുത്ത് ആഗോള വ്യാപ്തി നിലനിർത്തുന്ന ‘ഭൂമിയിലെ’ സ്വീകരിച്ചു.
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: കരയുകയും വിലപിക്കുകയും ചെയ്യുന്നു
  rationale: കരച്ചിലിനെയും ദുഃഖാചരണത്തെയും സൂചിപ്പിക്കുന്ന രണ്ടു ക്രിയകളുടെയും വ്യത്യാസവും വാക്യത്തിലെ തീവ്രതയും നിലനിർത്തുന്നു.
- source_word: ἐπ’ αὐτήν
  choice: അവളെച്ചൊല്ലി
  rationale: വിലാപത്തിന്റെ വിഷയത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ബാബിലോണിന്റെ സ്ത്രീരൂപത്തിലുള്ള വ്യക്തിവൽക്കരണം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸν γόμον αὐτῶν
  choice: അവരുടെ ചരക്ക്
  rationale: γόμος കപ്പലിൽ കയറ്റിയ ചരക്കിനെയോ വ്യാപാരസാധനങ്ങളെയോ സൂചിപ്പിക്കുന്നു; തുടർന്നുവരുന്ന സാധനപ്പട്ടികയും സമുദ്രവ്യാപാരസന്ദർഭവും കണക്കിലെടുത്ത് ‘ചരക്ക്’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: ഇനി ആരും വാങ്ങുന്നില്ല
  rationale: വാങ്ങൽ അവസാനിച്ചിരിക്കുന്നതിനെ οὐκέτι നൽകുന്ന ഊന്നലോടെ ലളിതമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: ബാബിലോണിന്റെ സൂചിതവസ്തുവും വ്യക്തിവൽക്കരണവും
  choice: സ്ത്രീലിംഗ വ്യക്തിസൂചന നിലനിർത്താൻ ‘അവളെച്ചൊല്ലി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: നഗരത്തെയോ വ്യവസ്ഥയെയോ അമൂർത്തമായി കണ്ട് ‘അതിനെച്ചൊല്ലി’ എന്നു നൽകുക.
  rationale: വെളിപ്പാട് ബാബിലോണിനെ സ്ത്രീയും നഗരവുമായി വ്യക്തിവൽക്കരിക്കുന്നു. സ്ത്രീലിംഗ സൂചന നിലനിർത്തുന്നത് അപോകലിപ്റ്റിക പ്രതിരൂപത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. രണ്ടു വിലാപക്രിയകളും ബാബിലോണിന്റെ സ്ത്രീരൂപ വ്യക്തിവൽക്കരണവും വ്യാപാരസന്ദർഭത്തിലെ ‘ചരക്ക്’ എന്ന കൃത്യപദവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
