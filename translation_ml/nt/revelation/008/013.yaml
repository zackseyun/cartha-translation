id: REV.8.13
reference: Revelation 8:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: ml
  text: 'പിന്നെ ആകാശമധ്യത്തിൽ[b] പറന്നുകൊണ്ടിരുന്ന ഒരു കഴുകനെ[a] ഞാൻ കണ്ടു; ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ ഇങ്ങനെ പറയുന്നതും ഞാൻ കേട്ടു: “ഭൂമിയിൽ വസിക്കുന്നവർക്ക് അയ്യോ, അയ്യോ, അയ്യോ! കാഹളം മുഴക്കാനിരിക്കുന്ന മൂന്നു ദൂതന്മാരുടെ ശേഷിച്ച കാഹളനാദങ്ങൾ നിമിത്തം!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ഒരു കഴുകൻ” എന്നതിനുപകരം “ഒരു ദൂതൻ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അഥവാ, “ആകാശത്തിന്റെ ഉന്നതഭാഗത്ത്”; ഗ്രീക്ക് പദം തലയ്ക്കു മുകളിലുള്ള തുറന്ന ആകാശത്തിന്റെ ഉന്നതഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: കഴുകൻ
  rationale: സാധാരണ അർഥമായ ‘eagle’ എന്നതിനെ നൽകുന്നു; ശവഭോജി പക്ഷിയെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്ന സന്ദർഭമില്ല. SBLGNT-യിലെ വായനയാണ് മുഖ്യപാഠത്തിൽ പിന്തുടരുന്നത്.
- source_word: μεσουρανήματι
  choice: ആകാശമധ്യത്തിൽ
  rationale: തലയ്ക്കു മുകളിലുള്ള തുറന്ന ആകാശത്തിന്റെ ഉന്നതഭാഗം എന്ന ദർശനാത്മക ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ
  rationale: വലിയ ശബ്ദത്തിലുള്ള പൊതുപ്രഖ്യാപനം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: അയ്യോ, അയ്യോ, അയ്യോ
  rationale: പ്രവാചകപ്രഖ്യാപനത്തിന്റെ തീവ്രത വഹിക്കുന്ന മൂന്നിരട്ടി ആവർത്തനം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ വസിക്കുന്നവർക്ക്
  rationale: വെളിപ്പാടിൽ ആവർത്തിക്കുന്ന പ്രയോഗത്തിന്റെ അർഥവും ഗൗരവവും സംരക്ഷിക്കുന്നു; ‘വസിക്കുന്നവർ’ എന്നത് ആവർത്തിത പദബന്ധം തിരിച്ചറിയാനും സഹായിക്കുന്നു.
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: ശേഷിച്ച കാഹളനാദങ്ങൾ നിമിത്തം
  rationale: ἐκ-ന്റെ സന്ദർഭോചിതമായ കാരണാർഥം ‘നിമിത്തം’ എന്നും, കാഹളവുമായി ബന്ധപ്പെട്ട φωναί-യെ സ്വാഭാവികമായി ‘കാഹളനാദങ്ങൾ’ എന്നും നൽകുന്നു.
- source_word: τῶν τριῶν ἀγγέλων
  choice: മൂന്നു ദൂതന്മാരുടെ
  rationale: അപ്പോക്കലിപ്റ്റിക് സന്ദർഭത്തിൽ ἄγγελος സ്വർഗീയ ദൂതന്മാരെ സൂചിപ്പിക്കുന്നു.
- source_word: τῶν μελλόντων σαλπίζειν
  choice: കാഹളം മുഴക്കാനിരിക്കുന്ന
  rationale: μέλλω + infinitive സൂചിപ്പിക്കുന്ന ആസന്നതയും σαλπίζω-യുടെ കാഹളം മുഴക്കുക എന്ന അർഥവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: പറക്കുന്ന വിളംബരക്കാരന്റെ പാഠവായന
  choice: ഒരു കഴുകൻ
  alternative: ഒരു ദൂതൻ
  rationale: മുഖ്യപാഠം SBLGNT-യിലെ ἀετοῦ (‘കഴുകൻ’) എന്ന വായന പിന്തുടരുന്നു. ചില കൈയെഴുത്തുപ്രതികളിലെ ‘ദൂതൻ’ എന്ന വായന പരസ്യതയ്ക്കായി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു; മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ദർശനാത്മക ശൈലി. ഗ്രീക്കിലെ ‘ഞാൻ കണ്ടു; ... ഞാൻ കേട്ടു’ എന്ന ഇരട്ട സാക്ഷ്യഘടനയും മൂന്നിരട്ടി ‘അയ്യോ’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനങ്ങൾ അവയുടെ യഥാർഥ വിഷയങ്ങളായ ‘കഴുകൻ’, ‘ആകാശമധ്യം’ എന്നിവയോടു ചേർത്ത് തിരുത്തി.
