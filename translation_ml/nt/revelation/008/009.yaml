reference: Revelation 8:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: ml
  text: കടലിലുള്ള പ്രാണനുള്ള[a] സൃഷ്ടികളിൽ മൂന്നിലൊന്ന് ചത്തു; കപ്പലുകളിൽ മൂന്നിലൊന്ന് നശിപ്പിക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “ജീവനുള്ള”; “ജീവജാലങ്ങളിൽ.” ഗ്രീക്കിൽ അക്ഷരാർഥം: “പ്രാണൻ/ജീവൻ ഉള്ളവ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανε
  choice: ചത്തു
  rationale: ἀποθνῄσκω ഇവിടെ ജീവികളുടെ മരണത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. മൃഗങ്ങളെയും മറ്റു കടൽജീവികളെയും കുറിച്ച് പറയുമ്പോൾ ‘ചത്തു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: τὸ τρίτον
  choice: മൂന്നിലൊന്ന്
  rationale: അളവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാള തുല്യരൂപം.
- source_word: κτισμάτων
  choice: സൃഷ്ടികളിൽ
  rationale: κτίσμα എന്നതിന് ‘സൃഷ്ടി’ അഥവാ ‘സൃഷ്ടിക്കപ്പെട്ടത്’ എന്നർത്ഥമുണ്ട്. തുടർന്നുള്ള τὰ ἔχοντα ψυχάς ഇതിനെ കടലിലെ ജീവികളായി പരിമിതപ്പെടുത്തുന്നതിനാൽ ‘സൃഷ്ടികൾ’ എന്ന പദം മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: കടലിലുള്ള
  rationale: സ്ഥലസൂചന സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: τὰ ἔχοντα ψυχάς
  choice: പ്രാണനുള്ളവയിൽ
  rationale: ψυχήയുടെ ‘പ്രാണൻ/ജീവൻ’ എന്ന അർത്ഥം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ ജീവനുള്ള കടൽസൃഷ്ടികളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു. വ്യാഖ്യാനപരമായ ‘ആത്മാവ്’ എന്ന സാങ്കേതിക അർത്ഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: πλοίων
  choice: കപ്പലുകളിൽ
  rationale: πλοῖον എന്നതിന് ഈ സമുദ്രസന്ദർഭത്തിൽ വ്യക്തവും സാധാരണവുമായ മലയാള പദം ‘കപ്പൽ’ ആണ്.
- source_word: διεφθάρησαν
  choice: നശിപ്പിക്കപ്പെട്ടു
  rationale: διαφθείρωയുടെ കർമണിപ്രയോഗം ഇവിടെ ധാർമിക ദുഷിപ്പല്ല, വിനാശകരമായ നാശമാണ് സൂചിപ്പിക്കുന്നത്; കർമണിരൂപവും സംരക്ഷിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: കടൽസൃഷ്ടികളെ വിവരിക്കുന്ന ψυχάς എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പ്രാണനുള്ളവയിൽ
  alternative: ജീവനുള്ളവയിൽ; ജീവജാലങ്ങളിൽ; ആത്മാക്കളുള്ളവയിൽ
  rationale: വാക്യം മൃഗങ്ങളുടെ ആത്മാവിനെക്കുറിച്ചുള്ള സാങ്കേതിക സിദ്ധാന്തം സ്ഥാപിക്കുന്നില്ല. ‘പ്രാണൻ’ എന്നത് ψυχήയുടെ പദസാന്നിധ്യം ഭാഗികമായി സംരക്ഷിക്കുകയും ഇവിടെ ഉദ്ദേശിക്കുന്ന സജീവജീവിതത്തെ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു. കൂടുതൽ വ്യാഖ്യാനപരമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വിശദീകരണസ്വഭാവമുള്ള τὰ ἔχοντα ψυχάς എന്ന ഘടകത്തെ ദീർഘരേഖകൾക്കിടയിൽ നൽകി അതിന്റെ വ്യാകരണബന്ധവും ആശയപരമായ ഊന്നലും നിലനിർത്തി.
