id: REV.8.1
reference: Revelation 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: ml
  text: അവൻ ഏഴാമത്തെ മുദ്ര തുറന്നപ്പോൾ[a], സ്വർഗത്തിൽ ഏകദേശം അരമണിക്കൂർ നിശ്ശബ്ദത ഉണ്ടായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏഴാമത്തെ മുദ്ര പൊട്ടിച്ചുതുറന്നപ്പോൾ.’ ഗ്രീക്ക് പാഠം ലളിതമായി ‘ഏഴാമത്തെ മുദ്ര തുറന്നപ്പോൾ’ എന്നാണ് പറയുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സ്വർഗത്തിൽ ഏകദേശം അരമണിക്കൂർ നിശ്ശബ്ദത നിലവിൽ വന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: തുറന്നപ്പോൾ
  rationale: ഇവിടെ ഒരിക്കൽ സംഭവിക്കുന്ന കഥാസന്ദർഭമായതിനാൽ, ആവർത്തനാർഥമുള്ള ‘തുറക്കുമ്പോഴെല്ലാം’ എന്നതിനു പകരം സ്വാഭാവികമായ കാലസൂചനയായ ‘തുറന്നപ്പോൾ’ തിരഞ്ഞെടുത്തു.
- source_word: ἤνοιξεν
  choice: തുറന്നു
  rationale: ἀνοίγω എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘തുറക്കുക’ എന്നതാണ്; ‘പൊട്ടിച്ചുതുറന്നു’ എന്നു പറയുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാകും.
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: ഏഴാമത്തെ മുദ്ര
  rationale: σφραγίς എന്നതിന് അംഗീകൃതവും സന്ദർഭോചിതവുമായ പദം ‘മുദ്ര’; ക്രമസംഖ്യയും വ്യക്തമായി നിലനിർത്തി.
- source_word: ἐγένετο
  choice: ഉണ്ടായി
  rationale: ഒരു അവസ്ഥ നിലവിൽ വന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ഗ്രീക്കിലെ സംഭവാരംഭത്തിന്റെ സൂക്ഷ്മതയും നിലനിർത്തുന്നു.
- source_word: σιγὴ
  choice: നിശ്ശബ്ദത
  rationale: രംഗത്തിന്റെ ഗൗരവവും നാടകീയമായ മൗനവും ‘നിശ്ശബ്ദത’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: ഇവിടെ οὐρανός ആകാശമണ്ഡലത്തെയല്ല, സ്വർഗീയ മണ്ഡലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὡς ἡμιώριον
  choice: ഏകദേശം അരമണിക്കൂർ
  rationale: ὡς സമയദൈർഘ്യത്തിന്റെ ഏകദേശത സൂചിപ്പിക്കുന്നു; ‘ഏകദേശം അരമണിക്കൂർ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ἤνοιξεν എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവിന്റെ സൂചന
  choice: ‘അവൻ’ എന്നു നൽകി; മുൻസന്ദർഭത്തിലെ കുഞ്ഞാടിനെ പേരെടുത്ത് ചേർത്തില്ല.
  alternative: ‘കുഞ്ഞാട് ഏഴാമത്തെ മുദ്ര തുറന്നപ്പോൾ’
  rationale: ഗ്രീക്കിൽ മൂന്നാംപുരുഷ ഏകവചന കർത്താവ് പരോക്ഷമാണ്. മലയാളത്തിൽ ‘അവൻ’ എന്നു നൽകുന്നത് മുൻസന്ദർഭബന്ധം നിലനിർത്തുകയും ഈ വാക്യത്തിൽ ഇല്ലാത്ത വ്യക്തമായ തിരിച്ചറിയൽ കൂട്ടിച്ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വെളിപ്പാടിന്റെ ദർശനാത്മക ഭാവം നിലനിർത്തിക്കൊണ്ട് അമിതമായ സംസ്കൃതവൽക്കരണവും വ്യാഖ്യാനവിപുലീകരണവും ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
