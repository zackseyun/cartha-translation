id: REV.8.5
reference: Revelation 8:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: ml
  text: അപ്പോൾ ദൂതൻ ധൂപകലശം എടുത്ത് യാഗപീഠത്തിലെ തീകൊണ്ട് അതു നിറച്ച് ഭൂമിയിലേക്കു എറിഞ്ഞു. തുടർന്ന് ഇടിമുഴക്കങ്ങളും ശബ്ദങ്ങളും[a] മിന്നൽപ്പിണരുകളും ഒരു ഭൂകമ്പവും ഉണ്ടായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്വരങ്ങൾ.” ഗ്രീക്ക് പദത്തിന് വ്യക്തികളുടെ സ്വരങ്ങളെയോ പൊതുവായ ശബ്ദങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴληφεν
  choice: എടുത്ത്
  rationale: വർത്തമാനഫലസൂചനയുള്ള പൂർണകാലരൂപമാണെങ്കിലും, തുടർന്നുള്ള സംഭവങ്ങളുടെ ആഖ്യാനക്രമത്തിൽ സ്വാഭാവികമായ മലയാള ഭൂതകാലക്രിയയായി നൽകി.
- source_word: λιβανωτόν
  choice: ധൂപകലശം
  rationale: ധൂപം കത്തിക്കാനും യാഗപീഠത്തിൽനിന്നുള്ള തീക്കനൽ വഹിക്കാനും ഉപയോഗിക്കുന്ന ആരാധനാപാത്രത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും പരിചിതവുമായ പദം.
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: യാഗപീഠത്തിലെ തീകൊണ്ട് അതു നിറച്ച്
  rationale: പാത്രം നിറയ്ക്കാൻ ഉപയോഗിച്ച തീ യാഗപീഠത്തിൽനിന്നുള്ളതാണെന്ന ഉറവിടബന്ധവും യാഗപീഠത്തിന്റെ പ്രതീകാത്മക പ്രാധാന്യവും നിലനിർത്തുന്നു.
- source_word: θυσιαστηρίου
  choice: യാഗപീഠം
  rationale: വെളിപ്പാടിലെ ദൈവാലയ-ആരാധനാ ദൃശ്യത്തിന് യോജിച്ച സ്ഥിരപ്രയോഗം.
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: ഭൂമിയിലേക്കു എറിഞ്ഞു
  rationale: βάλλω എന്ന ക്രിയയിലെ ശക്തമായ പ്രവർത്തനഭാവം ‘എറിഞ്ഞു’ നിലനിർത്തുന്നു; γῆയെ പ്രാദേശികമായ നിലം എന്നതിലുപരി വിശാലമായ ഭൂമി എന്നു നൽകുന്നു.
- source_word: ἐγένοντο
  choice: ഉണ്ടായി
  rationale: തുടർന്നുള്ള പ്രതിഭാസങ്ങൾ സംഭവിച്ചതിനെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: βρονταὶ
  choice: ഇടിമുഴക്കങ്ങൾ
  rationale: ബഹുവചനത്തിലുള്ള ആവർത്തിച്ച ഇടിനാദത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: φωναὶ
  choice: ശബ്ദങ്ങൾ
  rationale: വ്യക്തമായ സംസാരിക്കുന്നവർ സൂചിപ്പിക്കപ്പെടാത്തതിനാൽ ‘ശബ്ദങ്ങൾ’ എന്നത് ശബ്ദപ്രതിഭാസത്തെ നൽകുകയും ‘സ്വരങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀστραπαὶ
  choice: മിന്നൽപ്പിണരുകൾ
  rationale: ബഹുവചനമായ മിന്നൽപ്രകാശങ്ങളെ സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: σεισμός
  choice: ഒരു ഭൂകമ്പം
  rationale: ഏകവചനത്തിലുള്ള എണ്ണാവുന്ന സംഭവത്തെ മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: അപ്പോക്കലിപ്റ്റിക് ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ γῆയുടെ അർഥം
  choice: ഭൂമി
  alternative: നിലം; ദേശം
  rationale: വെളിപ്പാടിലെ ഈ ദൃശ്യം വിശാലവും പ്രപഞ്ചപരവുമായ ന്യായവിധിഭാവം വഹിക്കുന്നതിനാൽ ‘ഭൂമി’ അനുയോജ്യം; ‘നിലം’ അർഥത്തെ അനാവശ്യമായി ചുരുക്കുകയും ‘ദേശം’ പ്രാദേശികത സൂചിപ്പിക്കുകയും ചെയ്യും.
- issue: ദൈവപ്രത്യക്ഷതാ സൂത്രവാക്യത്തിൽ φωναίയുടെ അർഥം
  choice: ശബ്ദങ്ങൾ
  alternative: സ്വരങ്ങൾ
  rationale: സംസാരിക്കുന്നവരെ വാക്യം തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ ‘ശബ്ദങ്ങൾ’ വ്യക്തമായ സംസാരത്തെ ഇറക്കുമതി ചെയ്യാതെ അവ്യക്തത നിലനിർത്തുന്നു; ‘സ്വരങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ധൂപകലശം,’ ‘യാഗപീഠം’ തുടങ്ങിയ പരിചിതമായ ആരാധനാപദങ്ങൾ നിലനിർത്തി; അനാവശ്യമായ പുരാതന ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
