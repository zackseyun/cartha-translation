id: REV.8.8
reference: Revelation 8:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: ml
  text: രണ്ടാമത്തെ ദൂതൻ കാഹളം മുഴക്കി; തീയാൽ ജ്വലിക്കുന്ന ഒരു വലിയ മലയെപ്പോലെയുള്ളത്[a] കടലിലേക്ക് എറിയപ്പെട്ടു; കടലിന്റെ മൂന്നിലൊന്ന് രക്തമായിത്തീർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തീയാൽ ജ്വലിക്കുന്ന ഒരു വലിയ മലയെപ്പോലെ’; ഗ്രീക്ക് പദം സാദൃശ്യം സൂചിപ്പിക്കുന്നു, അതിനെ യഥാർഥ മല എന്ന് നിർണയിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: കാഹളം മുഴക്കി
  rationale: σαλπίζω എന്ന ക്രിയയിൽ കാഹളം ഊതുകയോ മുഴക്കുകയോ ചെയ്യുന്ന ആശയം തന്നെയുണ്ട്. സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന വാദ്യം വ്യക്തമാക്കുന്നത് സ്വാഭാവികവും കൃത്യവുമായ മലയാളം നൽകുന്നു.
- source_word: ὡς
  choice: പോലെയുള്ള
  rationale: ὡς ഇവിടെ താദാത്മ്യമല്ല, സാദൃശ്യമാണ് സൂചിപ്പിക്കുന്നത്. തുടർന്ന് ചേർത്ത ‘ഒന്ന്’ ദർശനത്തിലെ വസ്തുവിനെ ഒരു യഥാർഥ മലയായി നിർണയിക്കാതെ താരതമ്യം നിലനിർത്തുന്നു.
- source_word: ὄρος μέγα
  choice: ഒരു വലിയ മല
  rationale: നാമ-വിശേഷണ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും ഗൗരവമുള്ളതുമായ പരിഭാഷയാണിത്.
- source_word: πυρὶ καιόμενον
  choice: തീയിൽ കത്തുന്ന
  rationale: πυρί എന്ന ദത്തിവും καιόμενον എന്ന വർത്തമാന മധ്യ/കർമണി കൃദന്തവും ചേർന്ന ദൃശ്യബിംബം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വസ്തു അഗ്നിപർവതമോ ഉൽക്കയോ പ്രതീകമോ ആണെന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἐβλήθη
  choice: എറിയപ്പെട്ടു
  rationale: അനിശ്ചിത ഭൂതകാല കർമണി രൂപത്തെ കൃത്യമായി നിലനിർത്തുന്നു; പ്രവർത്തകനെ പാഠം പറയാത്തതിനാൽ പരിഭാഷയും ചേർക്കുന്നില്ല.
- source_word: εἰς τὴν θάλασσαν
  choice: കടലിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ദിശയും θάλασσα എന്നതിന്റെ സാധാരണ അർഥമായ ‘കടൽ’ എന്നതും സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: കടലിന്റെ മൂന്നിലൊന്ന്
  rationale: ഭാഗസൂചകമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളരൂപമാണിത്.
- source_word: αἷμα
  choice: രക്തം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; രൂപകമോ ഉപമയോ എന്ന് പാഠം വ്യക്തമാക്കാത്തതിനാൽ അത്തരം വിശദീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: മലയോട് സാദൃശ്യമുള്ള വസ്തുവിന്റെ സ്വഭാവം
  choice: ‘തീയിൽ കത്തുന്ന ഒരു വലിയ മലപോലെയുള്ള ഒന്ന്’ എന്ന് പരിഭാഷപ്പെടുത്തി സാദൃശ്യം നിലനിർത്തുന്നു.
  alternative: ‘തീയിൽ കത്തുന്ന ഒരു വലിയ മല’ എന്ന് അതിനെ യഥാർഥ മലയായി അവതരിപ്പിക്കുക.
  rationale: ὡς സാദൃശ്യം സൂചിപ്പിക്കുന്നു. അതിനാൽ വസ്തു യഥാർഥ മലയാണോ, ഉൽക്കപോലെയുള്ള ഒന്നാണോ, ന്യായവിധിയുടെ പ്രതീകമാണോ എന്നത് പരിഭാഷ തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവപൂർണ മലയാളം. ഗ്രീക്കിലെ ആവർത്തിച്ച καί മലയാളത്തിൽ അമിതഭാരം സൃഷ്ടിക്കാതിരിക്കാനായി ആദ്യ ബന്ധം വാക്യവിരാമവും ‘അപ്പോൾ’ എന്ന സ്വാഭാവിക ബന്ധകവും ഉപയോഗിച്ച് അവതരിപ്പിച്ചു; സംഭവക്രമം നിലനിർത്തിയിട്ടുണ്ട്.
