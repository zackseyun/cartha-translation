revisions:
- from: രണ്ടാമത്തെ ദൂതൻ കാഹളം മുഴക്കി. അപ്പോൾ തീയിൽ കത്തുന്ന ഒരു വലിയ മലപോലെയുള്ള ഒന്ന് കടലിലേക്ക് എറിയപ്പെട്ടു; കടലിന്റെ മൂന്നിലൊന്ന് രക്തമായി.
