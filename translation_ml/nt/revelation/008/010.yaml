id: REV.8.10
reference: Revelation 8:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: ml
  text: മൂന്നാമത്തെ ദൂതൻ കാഹളം മുഴക്കി. അപ്പോൾ ആകാശത്തുനിന്ന്[a] പന്തംപോലെ[b] കത്തിക്കൊണ്ടിരുന്ന ഒരു വലിയ നക്ഷത്രം[c] വീണു. അത് നദികളുടെ മൂന്നിലൊന്നിന്മേലും നീരുറവുകളിന്മേലും വീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വർഗത്തിൽനിന്ന്.’ ഗ്രീക്ക് പദത്തിന് ‘ആകാശം’ എന്നും ‘സ്വർഗം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിളക്കുപോലെ.’ ഗ്രീക്ക് പദം പന്തത്തെയോ വിളക്കിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ ജ്വലിച്ചുകൊണ്ട് വീഴുന്ന നക്ഷത്രത്തിന്റെ ദൃശ്യത്തിന് ‘പന്തം’ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘നക്ഷത്രം’ എന്ന ദർശനചിത്രം വ്യാഖ്യാനിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു. ഇത് ഒരു ദൂതസത്തയെയോ ഉൽക്കാസദൃശ വസ്തുവിനെയോ പ്രതീകാത്മക അധികാരത്തെയോ സൂചിപ്പിക്കുന്നുവോ എന്നതിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: കാഹളം മുഴക്കി
  rationale: σαλπίζω എന്ന ക്രിയയുടെ ‘കാഹളം ഊതുക/മുഴക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀστὴρ μέγας
  choice: ഒരു വലിയ നക്ഷത്രം
  rationale: നാമ-വിശേഷണ ഘടന നേരിട്ട് നിലനിർത്തുന്നു; ‘വലിയ’ എന്നത് വലുപ്പത്തെയോ പ്രാധാന്യത്തെയോ നിർബന്ധമായി വേർതിരിക്കാതെ ഗ്രീക്കിലെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ആകാശത്തുനിന്ന്
  rationale: οὐρανός ഇവിടെ മുകളിലെ ദൃശ്യവ്യാപ്തിയെയും സ്വർഗത്തെയും സൂചിപ്പിക്കാവുന്നതാണ്. വീഴുന്ന നക്ഷത്രത്തിന്റെ ദൃശ്യത്തിൽ ‘ആകാശം’ സ്വാഭാവികമാണ്; ‘സ്വർഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: καιόμενος ὡς λαμπάς
  choice: പന്തംപോലെ കത്തിക്കൊണ്ടിരുന്ന
  rationale: καιόμενος എന്ന വർത്തമാന കൃദന്തത്തിന്റെ തുടർന്നുകൊണ്ടിരിക്കുന്ന ജ്വലനം പ്രകടമാക്കുന്നു; λαμπάς എന്നതിന് ദൃശ്യത്തിൽ യോജിക്കുന്ന ‘പന്തം’ ഉപയോഗിക്കുന്നു.
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: വീണു ... അത് ... വീണു
  rationale: മൂലപാഠത്തിലെ ആവർത്തനം നിലനിർത്തി, ആദ്യം താഴേക്കുള്ള പതനവും പിന്നെ ജലസ്രോതസ്സുകളിലേക്കുള്ള പതനവും ഊന്നിപ്പറയുന്നു.
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: നദികളിൽ മൂന്നിലൊന്നിന്മേൽ
  rationale: τὸ τρίτον എന്ന അളവ് ‘മൂന്നിലൊന്ന്’ എന്നു കൃത്യമായി നൽകുന്നു; ἐπίയുടെ ലക്ഷ്യാർഥം ‘-ന്മേൽ’ കൊണ്ട് സൂചിപ്പിക്കുന്നു.
- source_word: πηγὰς τῶν ὑδάτων
  choice: നീരുറവുകൾ
  rationale: πηγήയുടെ സ്വാഭാവിക മലയാള സമാനപദം ഉപയോഗിക്കുന്നു. ‘ജലങ്ങളുടെ ഉറവുകൾ’ എന്ന കൃത്രിമ ഘടന ഒഴിവാക്കിയിട്ടും ജലസ്രോതസ്സുകളെന്ന അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വീഴുന്ന നക്ഷത്രത്തിന്റെ സൂചിതാർഥം
  choice: ‘ഒരു വലിയ നക്ഷത്രം’ എന്നു ചിത്രത്തെ അതേപടി നിലനിർത്തി
  alternative: ദൂതസത്ത, ഉൽക്കാസദൃശ വസ്തു, അല്ലെങ്കിൽ പ്രതീകാത്മക അധികാരം എന്നു വ്യാഖ്യാനിക്കുക
  rationale: വാക്യം അതിന്റെ പ്രതീകാത്മക സൂചിതാർഥം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഏതെങ്കിലും പ്രത്യേക വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ചേർക്കാതെ ദർശനത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വെളിപ്പാടിന്റെ ദർശനാത്മക താളം നിലനിർത്താൻ ‘വീണു’ എന്ന ആവർത്തനവും വ്യക്തമായ ദൃശ്യഭാഷയും സംരക്ഷിച്ചു.
