id: REV.8.2
reference: Revelation 8:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: ml
  text: ദൈവത്തിന്റെ മുമ്പിൽ നിൽക്കുന്ന ഏഴ് ദൂതന്മാരെ ഞാൻ കണ്ടു[a]; അവർക്ക് ഏഴ് കാഹളങ്ങൾ നൽകപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവത്തിന്റെ മുമ്പിൽ നിന്നുകൊണ്ടിരിക്കുന്ന’ അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ മുമ്പിൽ നിന്നിട്ടുള്ള’; ഗ്രീക്കിലെ പരിപൂർണകാല ക്രിയാരൂപം അവരുടെ നിൽപ്പ് തുടരുന്ന ഒരു അവസ്ഥയാണെന്ന് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: ദർശനവിവരണത്തിലെ ὁράω എന്ന ക്രിയയുടെ aorist രൂപം സ്വാഭാവികമായി ‘ഞാൻ കണ്ടു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: ഏഴ് ദൂതന്മാരെ
  rationale: നിശ്ചിതമായ ഒരു സംഘത്തെയാണ് ഗ്രീക്ക് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സംഖ്യയും സന്ദർഭവും ആ നിശ്ചിതത്വം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ വേറൊരു നിർദ്ദേശപദം ആവശ്യമില്ല.
- source_word: ἀγγέλους
  choice: ദൂതന്മാർ
  rationale: സ്വർഗീയ സിംഹാസനസദസ്സിന്റെ സന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരല്ല, സ്വർഗീയ ദൂതന്മാരാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മുമ്പിൽ
  rationale: സ്ഥലപരവും ബന്ധപരവുമായ അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἑστήκασιν
  choice: നിൽക്കുന്ന
  rationale: ἵστημι എന്ന ക്രിയയുടെ perfect രൂപം മുമ്പ് നിലകൊണ്ടതിന്റെ ഫലമായി തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിൽക്കുന്ന’ എന്നത് ആ നിലനിൽക്കുന്ന അവസ്ഥ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐδόθησαν αὐτοῖς
  choice: അവർക്ക് ... നൽകപ്പെട്ടു
  rationale: നൽകുന്നവനെ വ്യക്തമാക്കാത്ത ഗ്രീക്ക് കർമണിപ്രയോഗം അതേപടി നിലനിർത്തുന്നു; ‘അവർ സ്വീകരിച്ചു’ എന്ന സജീവകാഴ്ചപ്പാട് ഒഴിവാക്കുന്നു.
- source_word: σάλπιγγες
  choice: കാഹളങ്ങൾ
  rationale: വെളിപ്പാടിലെ ദൈവിക ന്യായവിധി-ദൃശ്യങ്ങൾക്ക് യോജിച്ച, സാധാരണ മലയാള ബൈബിൾഭാഷയിലും മനസ്സിലാകുന്ന പദമാണ്.
theological_decisions:
- issue: ഏഴ് ദൂതന്മാരുടെ തിരിച്ചറിയലും പദവിയും
  choice: ‘ദൈവത്തിന്റെ മുമ്പിൽ നിൽക്കുന്ന ഏഴ് ദൂതന്മാർ’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഏഴ് പ്രധാനദൂതന്മാർ’ അല്ലെങ്കിൽ പിൽക്കാല പാരമ്പര്യത്തിലെ പ്രത്യേക ദൂതന്മാരുമായി തിരിച്ചറിയൽ
  rationale: ഗ്രീക്കിൽ ἀρχάγγελοι എന്ന പദമോ അവരുടെ പദവി നിർവചിക്കുന്ന മറ്റൊരു പ്രസ്താവനയോ ഇല്ല. അതിനാൽ പിൽക്കാല വ്യാഖ്യാനപാരമ്പര്യം ചേർക്കാതെ വാക്യം പറയുന്നതു മാത്രം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കാഹളം’ അപോകലിപ്റ്റിക് സന്ദർഭത്തിന് യോജിച്ച പരിചിതമായ പദമായി സ്വീകരിച്ചു. കർമണിപ്രയോഗം ദാതാവിനെ പരോക്ഷമായി തന്നെ നിലനിർത്തുന്നു.
