id: REV.8.11
reference: Revelation 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: ml
  text: ആ നക്ഷത്രത്തിന്റെ പേര് “വേംവുഡ്” എന്നു വിളിക്കപ്പെടുന്നു.[a] വെള്ളത്തിന്റെ മൂന്നിലൊന്ന് വേംവുഡായി മാറി; വെള്ളം കയ്പേറിയതാക്കപ്പെട്ടതുകൊണ്ട് അനേകം ആളുകൾ ആ വെള്ളം നിമിത്തം മരിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അബ്സിന്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Ἄψινθος/ἄψινθον വേംവുഡ് എന്ന കയ്പുള്ള സസ്യത്തെ സൂചിപ്പിക്കുന്നു; ഈ പദത്തിന്റെ ആവർത്തനം നക്ഷത്രത്തിന്റെ പേരിനെയും വെള്ളത്തിന്റെ കയ്പിനെയും ബന്ധിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അവസാനഭാഗം കൂടുതൽ വ്യക്തമായി, ‘വെള്ളം കയ്പേറിയതാക്കപ്പെട്ടതുകൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄνομα
  choice: പേര്
  rationale: നക്ഷത്രത്തിന്റെ പേരിനെയോ നാമധേയത്തെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപദം.
- source_word: ἀστέρος
  choice: നക്ഷത്രം
  rationale: വെളിപ്പാട് സാഹിത്യത്തിലെ ദൃശ്യബിംബം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: λέγεται
  choice: എന്നു വിളിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്ക് നാമകരണശൈലി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἄψινθος / ἄψινθον
  choice: കാഞ്ഞിരം / കാഞ്ഞിരം
  rationale: കയ്പുള്ള സസ്യത്തെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പദം; നക്ഷത്രത്തിന്റെ പേരും വെള്ളത്തിനുണ്ടായ മാറ്റവും ഒരേ പദം ആവർത്തിച്ച് ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐγένετο
  choice: ആയി
  rationale: εἰς എന്നതോടുകൂടിയ രൂപാന്തരമോ ഫലാവസ്ഥയോ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: വെള്ളത്തിൽ മൂന്നിലൊന്ന്
  rationale: ഭാഗസൂചക പ്രയോഗത്തിന്റെ അളവുസംബന്ധിയായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: അനേകം മനുഷ്യർ
  rationale: പുരുഷന്മാർക്ക് മാത്രമല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ἄνθρωποι എന്ന പദത്തിന്റെ ഉൾക്കൊള്ളുന്ന അർഥം നൽകുന്നു.
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: ആ വെള്ളം നിമിത്തം മരിച്ചു
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം/കാരണം വ്യക്തമാക്കുന്നു; മൂലത്തിൽ സ്പഷ്ടമല്ലാത്ത ‘കുടിച്ചതിനാൽ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: ὅτι ἐπικράνθησαν
  choice: അവ കയ്പേറിയതാക്കപ്പെട്ടതിനാൽ
  rationale: കർമണിപ്രയോഗവും ഫലാവസ്ഥയും നിലനിർത്തുന്നു; ‘അവ’ എന്നത് സമീപസ്ഥമായ വെള്ളത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐπικράνθησαν എന്ന കർമണിക്രിയയുടെ കർത്തൃസൂചന
  choice: ‘അവ’ വെള്ളത്തെ സൂചിപ്പിക്കുന്നു.
  alternative: മനുഷ്യർ കയ്പേറിയവരോ രോഗബാധിതരോ ആയി എന്ന വായന.
  rationale: വ്യാകരണപരമായി ഏറ്റവും അടുത്ത ബഹുവചനപൂർവപദം വെള്ളമാണ്; കയ്പേറിയ വെള്ളം മരണകാരണമാകുന്ന സന്ദർഭവും ഈ വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും മൂലത്തിലെ സർവനാമരഹിതമായ ക്രിയയെ മലയാളത്തിൽ ‘അവ’ ഉപയോഗിച്ച് അധികവ്യാഖ്യാനമില്ലാതെ അവതരിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കാഞ്ഞിരം’ എന്ന പരിചിതമായ ബൈബിൾസസ്യനാമം ഉപയോഗിച്ച് മൂലത്തിലെ ആവർത്തനബന്ധം സംരക്ഷിച്ചു. ‘ആ വെള്ളം നിമിത്തം’ എന്ന പ്രയോഗം മരണത്തിന്റെ കാരണബന്ധം വ്യക്തമാക്കുന്നു; കുടിക്കൽ എന്ന മൂലത്തിൽ ഇല്ലാത്ത വിശദാംശം ചേർത്തിട്ടില്ല.
