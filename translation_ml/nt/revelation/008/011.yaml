  source_fidelity: ‘കാഞ്ഞിരം’ സാധാരണയായി Strychnos nux-vomicaയെ സൂചിപ്പിക്കുന്ന മലയാള സസ്യനാമമാണ്; അത് ഗ്രീക്കിലെ ἄψινθος, അഥവാ wormwood (Artemisia വർഗത്തിലെ കയ്പുള്ള സസ്യം), എന്നതിന്റെ കൃത്യമായ സമാനതയല്ല. അതിനാൽ സസ്യപരമായും ആവർത്തിക്കുന്ന പദബന്ധപരമായും ഇത് തിരുത്തേണ്ടതാണ്. ‘വെള്ളത്തിൽ മൂന്നിലൊന്ന്’ എന്നതിനു പകരം ‘വെള്ളത്തിന്റെ മൂന്നിലൊന്ന്’ ഗ്രീക്കിലെ ഭാഗസൂചക പ്രയോഗത്തെ കൃത്യമായി നൽകുന്നു.
  naturalness: തിരുത്തിയ വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘വെള്ളം കയ്പേറിയതാക്കപ്പെട്ടതുകൊണ്ട്’ എന്ന വ്യക്തമായ രൂപം അവസാനത്തെ കർമണിപ്രയോഗത്തിന്റെ സൂചന വെള്ളത്തിലേക്കാണെന്ന് അനാവശ്യമായ വ്യാഖ്യാനമില്ലാതെ വ്യക്തമാക്കുന്നു.
  terminology: നക്ഷത്രത്തിന്റെ പേരായും വെള്ളം ആയിത്തീർന്ന വസ്തുവായും ‘വേംവുഡ്’ ഒരേപോലെ ഉപയോഗിക്കുന്നു; ഇതിലൂടെ Ἄψινθος/ἄψινθον-ന്റെ ആവർത്തനബന്ധം സംരക്ഷിക്കപ്പെടുന്നു. ‘അബ്സിന്ത്’ ഒരു ബദൽ രൂപമായി മാത്രം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
