    rationale: കാഞ്ഞിരം സാധാരണയായി വേംവുഡിനെയല്ല, നക്സ്വോമിക്ക (Strychnos nux-vomica)യെയാണ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിലെ ἄψινθος-ന്റെ സസ്യപരമായ സൂചനയും ഇംഗ്ലീഷ് POB-യുടെ ‘wormwood’ എന്ന തീരുമാനവും നിലനിർത്താൻ ‘വേംവുഡ്’ ഉപയോഗിക്കണം.
