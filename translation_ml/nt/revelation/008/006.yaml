id: REV.8.6
reference: Revelation 8:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: ml
  text: ഏഴ് കാഹളങ്ങൾ കൈവശമുണ്ടായിരുന്ന ആ ഏഴ് ദൂതന്മാർ അവ മുഴക്കാൻ തങ്ങളെത്തന്നെ ഒരുക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കാഹളങ്ങൾ ഊതാൻ.’ ഗ്രീക്ക് ക്രിയയുടെ അർഥം കാഹളം മുഴക്കുക എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελοι
  choice: ദൂതന്മാർ
  rationale: വെളിപ്പാട് ഗ്രന്ഥത്തിലെ ഈ സ്വർഗീയ ദൃശ്യത്തിൽ ἄγγελοι മനുഷ്യസന്ദേശവാഹകരെയല്ല, സ്വർഗീയ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἔχοντες
  choice: കൈവശമുണ്ടായിരുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണ ഉപവാക്യമായി നൽകി; കാഹളങ്ങൾ അവരുടെ കൈവശമായിരുന്നുവെന്ന ആശയം ഇതു വ്യക്തമാക്കുന്നു.
- source_word: σάλπιγγας
  choice: കാഹളങ്ങൾ
  rationale: σάλπιγξ എന്നത് കാഹളത്തെ സൂചിപ്പിക്കുന്ന പതിവുപദമാണ്; അപോകലിപ്റ്റികവും ആരാധനാപരവുമായ പ്രതീകധ്വനി ‘കാഹളം’ നിലനിർത്തുന്നു.
- source_word: ἡτοίμασαν αὑτοὺς
  choice: തങ്ങളെത്തന്നെ ഒരുക്കി
  rationale: കർമം ചെയ്യുന്നവരിലേക്കുതന്നെ മടങ്ങുന്ന αὑτοὺς എന്ന സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട്, സ്വയം സജ്ജരായതിനെ വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἵνα σαλπίσωσιν
  choice: അവ മുഴക്കാൻ
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ആൻ’ രൂപത്തിൽ നൽകി; σαλπίζω എന്ന ക്രിയയുടെ അർഥം സന്ദർഭത്തിലെ കാഹളങ്ങൾ മുഴക്കുക എന്നതാണ്.
theological_decisions:
- issue: അപോകലിപ്റ്റിക സന്ദർഭത്തിലെ ἄγγελοι ആരെ സൂചിപ്പിക്കുന്നു
  choice: സ്വർഗീയ ദൂതന്മാർ എന്ന അർഥത്തിൽ ‘ദൂതന്മാർ’
  alternative: മനുഷ്യ സന്ദേശവാഹകർ
  rationale: വെളിപ്പാട് 8-ലെ സ്വർഗീയ രംഗവും ഏഴ് കാഹളങ്ങൾ ഇവർക്കു നൽകിയിരിക്കുന്നതും സ്വർഗീയ ദൂതന്മാരെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്; അതിൽക്കവിഞ്ഞ സിദ്ധാന്തപരമായ വിശദീകരണം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവ’ എന്നത് ഉടൻ മുമ്പുള്ള ഏഴ് കാഹളങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ഉദ്ദേശ്യാർഥമുള്ള ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സംക്ഷിപ്തമായ ‘മുഴക്കാൻ’ എന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
