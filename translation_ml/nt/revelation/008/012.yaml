id: REV.8.12
reference: Revelation 8:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: ml
  text: നാലാമത്തെ ദൂതൻ കാഹളം മുഴക്കി. അപ്പോൾ സൂര്യന്റെ മൂന്നിലൊന്നും ചന്ദ്രന്റെ മൂന്നിലൊന്നും നക്ഷത്രങ്ങളുടെ മൂന്നിലൊന്നും പ്രഹരിക്കപ്പെട്ടു. അങ്ങനെ അവയുടെ മൂന്നിലൊന്ന് ഇരുണ്ടുപോകാനും പകലിന്റെ മൂന്നിലൊന്ന് പ്രകാശിക്കാതിരിക്കാനും[a] രാത്രിയുടെ മൂന്നിലൊന്നും അതുപോലെ പ്രകാശിക്കാതിരിക്കാനും ഇടയായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പകലിന്റെ മൂന്നിലൊന്ന് പ്രകാശിക്കാതിരിക്കേണ്ടതിന്.” “അങ്ങനെ” എന്നതിനു ശേഷമുള്ള ഗ്രീക്ക് ഘടനയ്ക്ക് കൂടുതൽ ഉദ്ദേശ്യസൂചകമായ അർഥസൂക്ഷ്മതയും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: കാഹളം മുഴക്കി
  rationale: σαλπίζω എന്ന ക്രിയയുടെ ‘കാഹളം മുഴക്കുക’ എന്ന അർഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: ἐπλήγη
  choice: പ്രഹരിക്കപ്പെട്ടു
  rationale: പൂർണ്ണമായും നശിച്ചു എന്നു പറയാതെ, πλήσσω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗവും ന്യായവിധിയുടെ പ്രഹരചിത്രവും നിലനിർത്തുന്നു.
- source_word: τὸ τρίτον
  choice: മൂന്നിലൊന്ന്
  rationale: ആവർത്തിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കൃത്യമായ അളവ് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി രേഖപ്പെടുത്തുന്നു.
- source_word: ἥλιος / σελήνη / ἀστέρες
  choice: സൂര്യൻ / ചന്ദ്രൻ / നക്ഷത്രങ്ങൾ
  rationale: ആകാശഗോളങ്ങളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പദങ്ങൾ അതേപടി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ ... ഇടയായി
  rationale: ἵνα സൂചിപ്പിക്കാവുന്ന ഫലം/ഉദ്ദേശ്യം എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഉദ്ദേശ്യസൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: σκοτισθῇ
  choice: ഇരുണ്ടുപോകാനും
  rationale: ആകാശവെളിച്ചങ്ങൾക്ക് സംഭവിച്ച ഇരുണ്ടുപോകൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ കർമണഭാവം മലയാളത്തിലെ സ്വാഭാവിക ഫലപ്രയോഗത്തിൽ പ്രകടമാകുന്നു.
- source_word: αὐτῶν
  choice: അവയുടെ
  rationale: സൂര്യൻ, ചന്ദ്രൻ, നക്ഷത്രങ്ങൾ എന്നിവയെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: പകൽ ... പ്രകാശിക്കാതിരിക്കാനും
  rationale: φαίνωയുടെ ‘പ്രകാശിക്കുക’ എന്ന സന്ദർഭോചിത അർഥം സ്വീകരിച്ച് ആകാശീയ ഇരുട്ടിന്റെ ദൃശ്യചിത്രം നിലനിർത്തുന്നു.
- source_word: τὸ τρίτον αὐτῆς
  choice: പകലിന്റെ മൂന്നിലൊന്ന്
  rationale: ബാധിക്കപ്പെടുന്ന അളവ് പകലിന്റെ മൂന്നിലൊന്നാണെന്നത് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ἡ νὺξ ὁμοίως
  choice: രാത്രി അതുപോലെ ആകാനും
  rationale: പകലിനെക്കുറിച്ച് പറഞ്ഞ അതേ പരിമിതി രാത്രിക്കും ബാധകമാണെന്ന ὁμοίωςയുടെ ബന്ധം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആകാശീയ ന്യായവിധിയുടെ സ്വഭാവം
  choice: ആകാശഗോളങ്ങളുടെ മൂന്നിലൊന്നിനുണ്ടാകുന്ന ഇരുണ്ടുപോകൽ വ്യാഖ്യാനപരമായ നിർണ്ണയമില്ലാതെ നേരിട്ട് അവതരിപ്പിച്ചു.
  alternative: ഇത് കർശനമായി അക്ഷരാർഥത്തിലുള്ള ജ്യോതിശ്ശാസ്ത്രസംഭവമെന്നോ പൂർണ്ണമായും പ്രതീകാത്മകമായ രാഷ്ട്രീയ/പ്രപഞ്ചചിത്രമെന്നോ നിർണ്ണയിക്കുക.
  rationale: വാക്യം തന്നെ അക്ഷരാർഥമോ പ്രതീകാർഥമോ എന്ന് തീർപ്പാക്കുന്നില്ല; അതിനാൽ അപോകലിപ്റ്റിക് ന്യായവിധിയുടെ ചിത്രവും അതിലെ വ്യാഖ്യാനതീവ്രതയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പ്രഹരിക്കപ്പെട്ടു’ ന്യായവിധിയുടെ ശക്തമായ ദൃശ്യഭാവം നിലനിർത്തുന്നു; വാക്യഘടന മലയാളത്തിലെ സ്വാഭാവിക വായനയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി.
