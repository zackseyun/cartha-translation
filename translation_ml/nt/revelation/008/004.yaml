id: REV.8.4
reference: Revelation 8:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: ml
  text: വിശുദ്ധരുടെ പ്രാർഥനകളോടൊപ്പം ധൂപത്തിന്റെ പുക ദൂതന്റെ കൈയിൽനിന്ന് ദൈവത്തിന്റെ സന്നിധിയിൽ ഉയർന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉയർന്നു’ എന്നതിന് ‘മേലോട്ടു ചെന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘വിശുദ്ധരുടെ പ്രാർഥനകളോടൊപ്പം’ എന്നാണ്. ധൂപപ്പുകയും പ്രാർഥനകളും തമ്മിൽ ഇവിടെ ബന്ധമുണ്ട്; എന്നാൽ അവ രണ്ടും ഒന്നുതന്നെയാണെന്ന് ഈ വാക്യം വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: ഉയർന്നു
  rationale: മുകളിലേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയ; ധൂപപ്പുകയുടെ ദൃശ്യത്തിന് സ്വാഭാവികവും ആധുനികവുമായ മലയാളപ്രയോഗം.
- source_word: καπνὸς
  choice: പുക
  rationale: സാധാരണവും നേരിട്ടുള്ളതുമായ അർഥം നിലനിർത്തുന്നു; ദർശനത്തിലെ ചിത്രത്തെ അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: θυμιαμάτων
  choice: ധൂപവർഗത്തിന്റെ
  rationale: θυμίαμα ധൂപത്തെയോ ധൂപസാമഗ്രിയെയോ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ബഹുവചനഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ധൂപവർഗം’ ഉപയോഗിച്ചു.
- source_word: ταῖς προσευχαῖς
  choice: പ്രാർഥനകളോടൊപ്പം
  rationale: പുകയും പ്രാർഥനകളും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നു; എന്നാൽ ധൂപം പ്രാർഥന തന്നെയാണെന്നോ അതിനെ വഹിക്കുന്നുവെന്നോ നിർണയിക്കുന്നില്ല.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധരുടെ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബൈബിൾപദം; പിന്നീട് രൂപപ്പെട്ട വിശുദ്ധപദവി എന്ന അർഥത്തിലേക്ക് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: ദൂതന്റെ കൈയിൽനിന്ന്
  rationale: മൂലത്തിലെ ദൃശ്യരൂപം നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിലേക്ക്
  rationale: പുക ദൈവത്തിന്റെ മുമ്പാകെ ഉയരുന്ന ദിശയും സാന്നിധ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ധൂപവും പ്രാർഥനകളും തമ്മിലുള്ള ബന്ധം
  choice: ‘പ്രാർഥനകളോടൊപ്പം’ എന്നു പരിഭാഷപ്പെടുത്തി; രണ്ടും ബന്ധപ്പെട്ടിരിക്കുന്നുവെങ്കിലും ഒന്നുതന്നെയാണെന്ന് പറഞ്ഞില്ല.
  alternative: ‘വിശുദ്ധരുടെ പ്രാർഥനകളാകുന്ന ധൂപത്തിന്റെ പുക’ അല്ലെങ്കിൽ ‘വിശുദ്ധരുടെ പ്രാർഥനകൾക്കായി പുക ഉയർന്നു.’
  rationale: ഗ്രീക്ക് വാക്യഘടന ധൂപപ്പുകയെയും പ്രാർഥനകളെയും ബന്ധിപ്പിക്കുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ അവയെ വ്യക്തമായി സമീകരിക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ വ്യാഖ്യാനതുറവ് നിലനിർത്തി.
- issue: ‘വിശുദ്ധർ’ എന്നതിന്റെ സൂചിതർ
  choice: ദൈവത്തിന്റെ വിശുദ്ധജനത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന ‘വിശുദ്ധർ’ നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റെ വിശുദ്ധജനം.’
  rationale: പദത്തിന്റെ ബൈബിൾപരമായ വ്യാപ്തി നിലനിർത്തുകയും ഏതെങ്കിലും സഭാവിഭാഗത്തിന്റെ വിശുദ്ധപദവി എന്ന പരിമിത അർഥം ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദർശനത്തിലെ ദൃശ്യരൂപം സംരക്ഷിച്ചു; ധൂപവും പ്രാർഥനകളും തമ്മിലുള്ള ബന്ധത്തെ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കിയില്ല.
