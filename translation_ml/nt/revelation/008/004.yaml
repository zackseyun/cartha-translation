  to: വിശുദ്ധരുടെ പ്രാർഥനകളോടൊപ്പം ധൂപത്തിന്റെ പുക ദൂതന്റെ കൈയിൽനിന്ന് ദൈവത്തിന്റെ സന്നിധിയിൽ ഉയർന്നു.[a][b]
