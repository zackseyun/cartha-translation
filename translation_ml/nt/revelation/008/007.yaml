id: REV.8.7
reference: Revelation 8:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: ml
  text: ഒന്നാമൻ കാഹളം മുഴക്കി. അപ്പോൾ രക്തം കലർന്ന[b] ആലിപ്പഴവും തീയും ഉണ്ടായി; അത് ഭൂമിയിലേക്ക്[a] എറിയപ്പെട്ടു. ഭൂമിയുടെ മൂന്നിലൊന്ന് കത്തിയെരിഞ്ഞു; വൃക്ഷങ്ങളുടെ മൂന്നിലൊന്നും കത്തിയെരിഞ്ഞു; പച്ചപ്പുല്ലെല്ലാം കത്തിയെരിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭൂമി’ എന്നതിന് ‘ദേശം’ അഥവാ ‘കര’ എന്നും പരിഭാഷപ്പെടുത്താം; γῆ എന്ന ഗ്രീക്ക് പദത്തിന് ഈ അർഥങ്ങളും വരാം. എന്നാൽ ഇവിടത്തെ വിശാലമായ അന്ത്യകാലദർശനസന്ദർഭം ‘ഭൂമി’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘രക്തത്തിൽ കലർന്ന’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: ഒന്നാമൻ
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ കാഹളങ്ങളുള്ള ഏഴു ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, ഇവിടെ ‘ദൂതൻ’ എന്ന നാമം ഗ്രീക്കിൽ പ്രകടമല്ല. അതിനാൽ മൂലപാഠത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: ἐσάλπισεν
  choice: കാഹളം മുഴക്കി
  rationale: σαλπίζω എന്ന ക്രിയയുടെ അർഥം കാഹളം മുഴക്കുക എന്നതാണ്; മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭത്തിൽ വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: ἐγένετο
  choice: ഉണ്ടായി
  rationale: ദർശനത്തിൽ പുതിയൊരു പ്രതിഭാസം സംഭവിച്ചതിനെ അവതരിപ്പിക്കുന്ന γίνομαι എന്ന ക്രിയയുടെ സംഭവാത്മക ഭാവം ലളിതമായി നൽകുന്നു.
- source_word: χάλαζα καὶ πῦρ
  choice: ആലിപ്പഴവും തീയും
  rationale: വ്യാഖ്യാനം ചേർക്കാതെ വിനാശകരമായ രണ്ടു ദൃശ്യഘടകങ്ങളെയും നേരിട്ട് പകർത്തുന്നു.
- source_word: μεμιγμένα ἐν αἵματι
  choice: രക്തം കലർന്ന
  rationale: രക്തവുമായി കലർന്ന അവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ദർശനത്തിന്റെ ഞെട്ടിക്കുന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: അത് ഭൂമിയിലേക്ക് എറിയപ്പെട്ടു
  rationale: ഏകവചനത്തിലുള്ള കർമണി ക്രിയയെ മാനിച്ച് ആലിപ്പഴവും തീയും ചേർന്ന പ്രതിഭാസത്തെ ഒരു സമഗ്രതയായി ‘അത്’ എന്നു സൂചിപ്പിക്കുന്നു; εἰς ചലനത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
- source_word: τὸ τρίτον τῆς γῆς
  choice: ഭൂമിയുടെ മൂന്നിലൊന്ന്
  rationale: ഭാഗസൂചകമായ ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യപ്രയോഗമാണിത്.
- source_word: κατεκάη
  choice: വെന്തുപോയി
  rationale: κατακαίω സൂചിപ്പിക്കുന്ന തീവ്രമായ ദഹനവും നാശവും ‘വെന്തുപോയി’ എന്ന പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ τρίτον τῶν δένδρων
  choice: വൃക്ഷങ്ങളുടെ മൂന്നിലൊന്ന്
  rationale: ആവർത്തിക്കുന്ന ഭാഗസൂചക ഘടന വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: πᾶς χόρτος χλωρός
  choice: പച്ചപ്പുല്ലെല്ലാം
  rationale: χόρτος എന്നതിന്റെ മൂർത്തമായ ‘പുല്ല്’ എന്ന അർഥവും χλωρός സൂചിപ്പിക്കുന്ന പച്ചപ്പും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വെളിപ്പാടിലെ ന്യായവിധിദൃശ്യത്തിൽ γῆ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം / കര
  rationale: γῆ എന്നതിന് ‘ദേശം’ അഥവാ ‘കര’ എന്നും അർഥമാകാമെങ്കിലും, ചുറ്റുമുള്ള കാഹളന്യായവിധികളുടെ വിശാലമായ പ്രപഞ്ചാത്മക പശ്ചാത്തലത്തിൽ ‘ഭൂമി’ കൂടുതൽ യോജിക്കുന്നു. എങ്കിലും മൂലപദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ദർശനവിവരണശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിൽ പ്രകടമല്ലാത്ത ‘ദൂതൻ’ ചേർത്തിട്ടില്ല. ആവർത്തിക്കുന്ന ‘വെന്തുപോയി’ എന്ന ഘടന മൂലപാഠത്തിന്റെ ആനാഫോറയും ന്യായവിധിയുടെ തീവ്രതയും നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന യഥാർത്ഥ പദബന്ധങ്ങളോടു ചേർത്ത് ക്രമപ്പെടുത്തി.
