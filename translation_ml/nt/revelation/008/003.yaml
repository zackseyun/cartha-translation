id: REV.8.3
reference: Revelation 8:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: ml
  text: മറ്റൊരു ദൂതൻ വന്ന് യാഗപീഠത്തിനരികെ നിന്നു. അവന്റെ കൈയിൽ ഒരു സ്വർണധൂപകലശം ഉണ്ടായിരുന്നു. എല്ലാ വിശുദ്ധരുടെയും പ്രാർഥനകളോടൊപ്പം സിംഹാസനത്തിന്റെ മുമ്പിലുള്ള സ്വർണയാഗപീഠത്തിന്മേൽ അർപ്പിക്കേണ്ടതിന് അവനു ധാരാളം ധൂപം നൽകപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “എല്ലാ വിശുദ്ധരുടെയും പ്രാർഥനകൾക്ക് അതു നൽകേണ്ടതിന്”; സന്ദർഭത്തിൽ ധൂപം അവരുടെ പ്രാർഥനകളോടൊപ്പം അർപ്പിക്കപ്പെടുന്നു, അല്ലെങ്കിൽ അവയോടു ചേർക്കപ്പെടുന്നു എന്നാണർഥം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: മറ്റൊരു ദൂതൻ
  rationale: ἄλλος ഇവിടെ മുമ്പുള്ള ക്രമത്തിൽ ചേർന്നുവരുന്ന മറ്റൊരു ദൂതനെ സൂചിപ്പിക്കുന്നു; വേറൊരു തരത്തിലുള്ള ജീവിയെയല്ല.
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: യാഗപീഠത്തിനരികെ നിന്നു
  rationale: ἐπί + genitive ഇവിടെ യാഗപീഠത്തിന്റെ മുകളിൽ നിന്നു എന്നതിനെക്കാൾ അതിനരികെയുള്ള സ്ഥാനം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: λιβανωτὸν χρυσοῦν
  choice: സ്വർണധൂപകലശം
  rationale: λιβανωτός ധൂപം കത്തിക്കാനുള്ള പാത്രമാണ്; ആചാരപരമായ സന്ദർഭത്തിൽ ‘ധൂപകലശം’ സംക്ഷിപ്തവും വ്യക്തവുമായ മലയാളപദമാണ്.
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: ധാരാളം ധൂപവർഗം അവനു നൽകപ്പെട്ടു
  rationale: θυμιάματα ധൂപദ്രവ്യത്തെയോ ധൂപാർപ്പണത്തെയോ സൂചിപ്പിക്കാം. ‘ധൂപവർഗം’ മൂലത്തിലെ ബഹുവചനസൂചന നഷ്ടപ്പെടുത്താതെ മലയാളത്തിൽ സ്വാഭാവികമാണ്; കർമണിപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἵνα δώσει
  choice: അർപ്പിക്കേണ്ടതിന്
  rationale: δίδωμι അക്ഷരാർഥത്തിൽ ‘നൽകുക’ എന്നാണെങ്കിലും യാഗപീഠവും ധൂപവും ഉൾപ്പെടുന്ന ആരാധനാസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക’ എന്ന പ്രവർത്തനാർഥം യോജിക്കുന്നു; ἵνα ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു.
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: വിശുദ്ധരായ എല്ലാവരുടെയും പ്രാർഥനകളോടൊപ്പം
  rationale: ദത്തിവ് ഘടന ദുഷ്കരമാണ്. ധൂപം പ്രാർഥനകളോടൊപ്പം അർപ്പിക്കപ്പെടുന്നു എന്ന സന്ദർഭാർഥം നൽകുമ്പോഴും മൂലത്തിലെ ബന്ധത്തെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἅγιοι
  choice: വിശുദ്ധർ
  rationale: വെളിപ്പാടിൽ ἅγιοι ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്നു. ആ അർഥം ‘വിശുദ്ധർ’ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: സ്വർണയാഗപീഠത്തിന്മേൽ
  rationale: ἐπί + accusative ഇവിടെ അർപ്പണം യാഗപീഠത്തിന്മേലേക്ക് വയ്ക്കുന്ന ദിശയും സ്ഥാനവും സൂചിപ്പിക്കുന്നു.
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: സിംഹാസനത്തിന്റെ മുമ്പിലുള്ള
  rationale: ἐνώπιον സ്ഥലം/സാന്നിധ്യം സൂചിപ്പിക്കുന്നു; ‘മുമ്പിലുള്ള’ സ്വാഭാവികവും കൃത്യവുമാണ്.
theological_decisions:
- issue: വിശുദ്ധരുടെ പ്രാർഥനകളോടുള്ള ധൂപത്തിന്റെ ബന്ധം
  choice: ധൂപവർഗം വിശുദ്ധരായ എല്ലാവരുടെയും പ്രാർഥനകളോടൊപ്പം അർപ്പിക്കപ്പെടുന്നു.
  alternative: ധൂപവർഗം വിശുദ്ധരുടെ പ്രാർഥനകൾക്ക് ‘നൽകപ്പെടുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥമായ ദത്തിവ് വായന.
  rationale: ഗ്രീക്ക് വാക്യഘടന ചുരുക്കമുള്ളതും ദ്വയാർഥസാധ്യതയുള്ളതുമാണ്. ക്ഷേത്ര-ധൂപ ദൃശ്യസന്ദർഭം ‘പ്രാർഥനകളോടൊപ്പം’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ ദൂതന്റെ മധ്യസ്ഥതയെക്കുറിച്ചുള്ള വികസിത ഉപദേശം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല. അക്ഷരഘടനയിലെ സംഘർഷം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി. ആരാധനാസംബന്ധിയായ ‘യാഗപീഠം’, ‘ധൂപകലശം’, ‘ധൂപവർഗം’ എന്നീ പരിചിതപദങ്ങൾ ഉപയോഗിച്ചു; വിഭാഗീയ പ്രത്യേകതകൾ ഒഴിവാക്കി.
