id: 2PE.3.11
reference: 2 Peter 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: ml
  text: ഇവയെല്ലാം ഇങ്ങനെ അഴിഞ്ഞുപോകുമ്പോൾ[a], വിശുദ്ധമായ പെരുമാറ്റത്തിലും ദൈവഭക്തിയിലും നിങ്ങൾ എങ്ങനെയുള്ളവരായിരിക്കണം?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നശിച്ചുപോകുമ്പോൾ’; ഗ്രീക്ക് പദം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇവ ‘അഴിക്കപ്പെടുന്നതിനെ’ അല്ലെങ്കിൽ ‘വിഘടിക്കുന്നതിനെ’ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: ഇവയെല്ലാം
  rationale: സമീപസന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന സൃഷ്ടലോകത്തിലെ യാഥാർഥ്യങ്ങളെയെല്ലാം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: അഴിഞ്ഞുപോകുന്നതിന്റെ രീതിയെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണബലം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: λυομένων
  choice: അഴിഞ്ഞുപോകുന്നതിനാൽ
  rationale: λύω എന്ന പദത്തിന്റെ ‘അഴിക്കുക/ഘടകബന്ധം വേർപെടുക’ എന്ന അടിസ്ഥാനചിത്രം സംരക്ഷിക്കുകയും ‘നശിപ്പിക്കപ്പെടുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ποταποὺς
  choice: എങ്ങനെയുള്ളവരായിരിക്കണം
  rationale: ആളുകളുടെ സ്വഭാവവും നിലവാരവും ചോദ്യം ചെയ്യുന്ന ποταπός എന്ന പദത്തിന്റെ നൈതിക ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δεῖ
  choice: ആയിരിക്കണം
  rationale: സന്ദർഭത്തിലെ നൈതിക അനിവാര്യത വ്യക്തമാക്കുന്നു; അമിതമായി കടുപ്പിക്കാതെ δεῖയുടെ നിർബന്ധബലം നൽകുന്നു.
- source_word: ὑπάρχειν
  choice: ആയിരിക്കുക
  rationale: δεῖയും ὑμᾶςഉം ചേർന്ന ഘടനയിൽ വ്യക്തികൾ എങ്ങനെയുള്ളവരായിരിക്കണം എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: വിശുദ്ധമായ ജീവിതരീതിയിൽ
  rationale: ἀναστροφή സൂചിപ്പിക്കുന്ന പെരുമാറ്റവും ജീവിതശൈലിയും ഉൾക്കൊള്ളുന്നു; ഗ്രീക്കിലെ ബഹുവചനം മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചന സമാഹാരപ്രയോഗമായി നൽകുന്നു.
- source_word: εὐσεβείαις
  choice: ദൈവഭക്തിയിൽ
  rationale: ദൈവത്തോടുള്ള ഭക്തിയും അതനുസരിച്ചുള്ള ജീവിതവും സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പദം.
theological_decisions:
- issue: ലോകത്തിന്റെ അന്ത്യകാല വിധിയെക്കുറിച്ചുള്ള വിവരണം
  choice: λυομένων എന്നത് ‘അഴിഞ്ഞുപോകുന്നതിനാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നശിപ്പിക്കപ്പെടുന്നതിനാൽ’ അല്ലെങ്കിൽ ‘നശിച്ചുപോകുന്നതിനാൽ’
  rationale: ഗ്രീക്ക് പദം അഴിക്കപ്പെടൽ/ഘടന വേർപെടൽ എന്ന ചിത്രമാണ് നൽകുന്നത്. സന്ദർഭം അന്ത്യകാല വിഘടനത്തെ സൂചിപ്പിച്ചാലും, മൂലപദത്തേക്കാൾ ശക്തമായ സമ്പൂർണ നാശം എന്ന വ്യാഖ്യാനം പരിഭാഷയിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: വാക്യത്തിന്റെ വാചാടോപബലം
  choice: ചോദ്യരൂപത്തിന്റെ ആശ്ചര്യ-പ്രബോധനബലം മലയാളത്തിൽ ആശ്ചര്യചിഹ്നത്തോടെ പ്രകടിപ്പിച്ചു.
  alternative: ‘നിങ്ങൾ എങ്ങനെയുള്ളവരായിരിക്കണം?’ എന്ന നേരിട്ടുള്ള ചോദ്യരൂപം
  rationale: ποταπούς δεῖ ὑπάρχειν ὑμᾶς രൂപത്തിൽ ചോദ്യം ഉണ്ടെങ്കിലും, അത് വിവരം തേടുന്നതിലേറെ ശക്തമായ നൈതിക ആഹ്വാനമാണ്; മലയാളത്തിലെ ഈ രൂപം ആ ബലം സ്വാഭാവികമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിശുദ്ധമായ ജീവിതരീതി’, ‘ദൈവഭക്തി’ എന്നീ പദങ്ങൾ സഭാപരമായ പരിചിതത്വവും പൊതുഗ്രാഹ്യതയും ഒരുമിപ്പിക്കുന്നു.
