  terminology: '''ദൈവഭക്തി'' is an appropriate established Malayalam rendering of εὐσέβεια. ''വിശുദ്ധമായ പെരുമാറ്റം'' adequately renders ἁγίαις ἀναστροφαῖς; its singular collective form is natural in Malayalam and does not materially lose the Greek plural''s sense.'
