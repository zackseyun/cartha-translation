    issue: The one Greek imperative φυλάσσεσθε is rendered twice.
    rationale: ‘ജാഗ്രത പാലിക്കുക’ and ‘സൂക്ഷിച്ചുകൊള്ളുക’ both function as imperatives, whereas the latter has no separate source-word basis. A single imperative should govern the purpose/warning clause.
  - severity: low
    issue: Footnote marker a is positioned after ‘നിലയിൽനിന്ന്’ rather than directly after the equivalent of στηριγμός.
