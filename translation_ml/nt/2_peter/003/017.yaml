id: 2PE.3.17
reference: 2 Peter 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: ml
  text: അതുകൊണ്ട്, പ്രിയരേ, നിങ്ങൾ ഇത് മുൻകൂട്ടി അറിയുന്നവരായതിനാൽ, ജാഗ്രത പാലിച്ചുകൊള്ളുവിൻ; അധർമ്മികളുടെ തെറ്റിനാൽ അവരോടൊപ്പം വലിച്ചിഴക്കപ്പെട്ടു നിങ്ങളുടെ സ്വന്തം ഉറച്ച നിലയിൽ[a]നിന്ന് വീണുപോകാതിരിക്കേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ സ്വന്തം സ്ഥിരതയിൽനിന്ന്’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ സ്വന്തം അചഞ്ചലതയിൽനിന്ന്.’ ഗ്രീക്ക് στηριγμός എന്ന പദത്തിന് ഉറപ്പ്, സ്ഥിരത, അചഞ്ചലത എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വീണുപോകുക’ എന്നത് ‘വിട്ടകന്നുപോകുക’ എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഗ്രീക്ക് ആവശ്യപ്പെടുന്നതിലധികം ദൈവശാസ്ത്രപരമായ പ്രത്യേകത മുന്നറിയിപ്പിനു നൽകാതിരിക്കാനാണ് മുഖ്യപാഠത്തിൽ മൂലരൂപകം നിലനിർത്തിയത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς οὖν, ἀγαπητοί
  choice: അതുകൊണ്ട്, പ്രിയരേ, നിങ്ങൾ
  rationale: οὖν സൂചിപ്പിക്കുന്ന നിഗമനപരമായ ബന്ധവും ὑμεῖς നൽകുന്ന ഊന്നലും നിലനിർത്തുന്നു; ἀγαπητοίയുടെ സ്നേഹപൂർവമായ അഭിസംബോധനയ്ക്ക് സ്വാഭാവികവും മാന്യവുമായ രൂപമാണ് ‘പ്രിയരേ’.
- source_word: προγινώσκοντες
  choice: ഇതു മുൻകൂട്ടി അറിയുന്നതിനാൽ
  rationale: മുൻകൂർ അറിവ്/മുന്നറിയിപ്പ് എന്ന കാലപരമായ ആശയം വ്യക്തമാക്കുന്നു; ‘ഇതു’ സന്ദർഭത്തിൽനിന്ന് സ്വാഭാവികമായി പൂരിപ്പിച്ചതാണ്.
- source_word: φυλάσσεσθε
  choice: ജാഗ്രത പാലിക്കുക … സൂക്ഷിച്ചുകൊള്ളുക
  rationale: വർത്തമാനകാല മധ്യമാജ്ഞയുടെ തുടർച്ചയായ സ്വയംജാഗ്രതാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: അധർമ്മികളുടെ തെറ്റിനാൽ
  rationale: πλάνηയിലെ തെറ്റ്/വഴിതെറ്റൽ എന്ന ആശയം ‘തെറ്റ്’ നൽകുന്നു; ἀθέσμων എന്നത് ധാർമികനിയമത്തെ മാനിക്കാത്തവരെ സൂചിപ്പിക്കുന്ന പതിവും ഗൗരവമുള്ളതുമായ ‘അധർമ്മികൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: συναπαχθέντες
  choice: അവരോടൊപ്പം വലിച്ചുകൊണ്ടുപോകപ്പെട്ട്
  rationale: ക്രിയയുടെ കർമണിപ്രയോഗവും συν- നൽകുന്ന ‘മറ്റുള്ളവരോടൊപ്പം’ എന്ന ഘടകവും രണ്ടും തുറന്നുവെക്കുന്നു.
- source_word: ἐκπέσητε
  choice: വീണുപോകാതിരിക്കാൻ
  rationale: ‘നിന്ന് വീഴുക’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു; വിശ്വാസത്യാഗം പോലുള്ള കൂടുതൽ നിർദിഷ്ടമായ ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: നിങ്ങളുടെ സ്വന്തം ഉറച്ച നിലയിൽനിന്ന്
  rationale: ἰδίουയിലെ സ്വന്തമെന്ന ഊന്നലും στηριγμός സൂചിപ്പിക്കുന്ന സ്ഥിരതയുള്ള നിലയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐκπέσητε എന്നത് രക്ഷ നഷ്ടപ്പെടുന്നതോ വിശ്വാസത്യാഗമോ നിർബന്ധമായി സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘നിങ്ങളുടെ സ്വന്തം ഉറച്ച നിലയിൽനിന്ന് നിങ്ങൾ വീണുപോകാതിരിക്കാൻ’ എന്ന നിഷ്പക്ഷ രൂപം
  alternative: ‘വിശ്വാസത്തിൽനിന്ന് അകന്നുപോകാതിരിക്കാൻ’
  rationale: ഗ്രീക്ക് വാക്യം ഉറച്ച നിലയിൽനിന്ന് വീഴാനുള്ള യഥാർഥ മുന്നറിയിപ്പ് നൽകുന്നു; എന്നാൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ അന്തിമഫലം നിർവചിക്കുന്നില്ല. അതിനാൽ മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് മതവിഭാഗപരമായ വ്യാഖ്യാനം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ ഗൗരവവും ഇടയസ്നേഹമുള്ള അഭിസംബോധനയും നിലനിർത്തി. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ അർഥബന്ധം വ്യക്തമാക്കാൻ മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി; മുന്നറിയിപ്പിന്റെ ഉദ്ദേശ്യബന്ധം രണ്ടാം വാക്യത്തിൽ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു തൊട്ടുപിന്നാലെ ചേർത്തു.
