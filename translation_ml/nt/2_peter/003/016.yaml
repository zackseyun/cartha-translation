id: 2PE.3.16
reference: 2 Peter 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: ml
  text: തന്റെ എല്ലാ കത്തുകളിലും ഈ കാര്യങ്ങളെക്കുറിച്ച് സംസാരിക്കുമ്പോൾ അദ്ദേഹം ഇങ്ങനെതന്നെ ചെയ്യുന്നു. അവയിൽ മനസ്സിലാക്കാൻ പ്രയാസമുള്ള ചില കാര്യങ്ങളുണ്ട്. അറിവില്ലാത്തവരും[b] നിലയുറപ്പില്ലാത്തവരും മറ്റുള്ള തിരുവെഴുത്തുകളെ[a] വളച്ചൊടിക്കുന്നതുപോലെ, ഇവയെയും വളച്ചൊടിച്ചുകൊണ്ട് അവർക്കുതന്നെ നാശം വരുത്തുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശേഷിക്കുന്ന തിരുവെഴുത്തുകൾ.’ ഗ്രീക്ക് പദത്തിന് ‘മറ്റുള്ള’ എന്നും ‘ശേഷിക്കുന്ന’ എന്നും അർഥമാകാം; ഇവിടെ പൗലോസിന്റെ കത്തുകളെയും മറ്റു തിരുവെഴുത്തുകളെയും താരതമ്യം ചെയ്യുന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പഠനം ലഭിക്കാത്തവർ.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘വികലമാക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: കത്തുകൾ
  rationale: എഴുത്തുകുത്ത് എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, പരമ്പരാഗതമായ ‘ലേഖനങ്ങൾ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ആധുനിക പദം തിരഞ്ഞെടുത്തു.
- source_word: λαλῶν
  choice: സംസാരിക്കുമ്പോൾ
  rationale: മാധ്യമം കത്തുകളാണെങ്കിലും, ‘പറയുക/സംസാരിക്കുക’ എന്ന ഗ്രീക്ക് ക്രിയയുടെ രൂപകം ‘എഴുതുമ്പോൾ’ എന്ന് പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: περὶ τούτων
  choice: ഈ കാര്യങ്ങളെക്കുറിച്ച്
  rationale: മുൻസന്ദർഭത്തിൽ പരാമർശിച്ച വിഷയങ്ങളിലേക്കുള്ള സൂചന നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: δυσνόητά τινα
  choice: മനസ്സിലാക്കാൻ പ്രയാസമുള്ള ചില കാര്യങ്ങൾ
  rationale: τινα എന്ന അനിശ്ചിതത്വവും δυσνόητα എന്ന ഗ്രഹിക്കാൻ പ്രയാസമുള്ളത് എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀμαθεῖς
  choice: അറിവില്ലാത്തവർ
  rationale: ഔപചാരിക വിദ്യാഭ്യാസമില്ലായ്മ മാത്രമായി അർഥം ചുരുക്കാതെ, പഠനമോ ഗ്രാഹ്യമോ ഇല്ലാത്തവരെ സൂചിപ്പിക്കുന്ന പൊതുവായ മലയാളപ്രയോഗം.
- source_word: ἀστήρικτοι
  choice: അസ്ഥിരർ
  rationale: ഉറപ്പിക്കപ്പെടാത്തവരോ നിലയുറപ്പില്ലാത്തവരോ എന്ന ആശയം ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: στρεβλοῦσιν
  choice: വളച്ചൊടിക്കുന്നു
  rationale: ഒന്നിനെ അതിന്റെ ശരിയായ രൂപത്തിൽനിന്ന് തിരിക്കുന്നതെന്ന ശക്തമായ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὰς λοιπὰς γραφὰς
  choice: മറ്റുള്ള തിരുവെഴുത്തുകൾ
  rationale: γραφαί എന്നത് വിശുദ്ധ തിരുവെഴുത്തുകളെ സൂചിപ്പിക്കുന്നതായി നിലനിർത്തുകയും λοιπάς എന്നതിന് സാധ്യമായ ‘മറ്റുള്ള/ശേഷിക്കുന്ന’ പരിധി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπώλειαν
  choice: നാശം
  rationale: പ്രത്യേക സാങ്കേതിക ദൈവശാസ്ത്രപദം ചേർക്കാതെ, ഗുരുതരമായ അന്തിമഫലം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: τὰς λοιπὰς γραφὰς എന്നതിൽ പൗലോസിന്റെ കത്തുകൾക്ക് തിരുവെഴുത്തുപദവി സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘മറ്റുള്ള തിരുവെഴുത്തുകൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി, പൗലോസിന്റെ കത്തുകൾ മറ്റു വിശുദ്ധ എഴുത്തുകളോടൊപ്പം താരതമ്യം ചെയ്യപ്പെടുന്നു എന്ന സ്വാഭാവിക സൂചന നിലനിർത്തി.
  alternative: ‘മറ്റുള്ള എഴുത്തുകൾ’
  rationale: പുതിയനിയമത്തിൽ γραφαί സാധാരണയായി വിശുദ്ധ തിരുവെഴുത്തുകളെയാണ് സൂചിപ്പിക്കുന്നത്; λοιπάς അവയെ ഇതിനകം പരാമർശിച്ച കത്തുകളുമായി ഒരേ താരതമ്യവിഭാഗത്തിൽ നിർത്തുന്നു. എന്നാൽ പരിഭാഷ ഗ്രീക്കിലുള്ള സൂചനയ്ക്കപ്പുറം ഒരു വിശദമായ സിദ്ധാന്തപ്രസ്താവന ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; ആശയബന്ധം നിലനിർത്തി. ‘അദ്ദേഹം’ മുൻസന്ദർഭത്തിലെ പൗലോസിനെ സൂചിപ്പിക്കുന്നു, എന്നാൽ ഈ വാക്യത്തിൽ ഇല്ലാത്ത പേര് ചേർത്തിട്ടില്ല.
