revisions:
- from: തന്റെ എല്ലാ കത്തുകളിലും അദ്ദേഹം ഈ കാര്യങ്ങളെക്കുറിച്ച് സംസാരിക്കുമ്പോൾ ഇങ്ങനെതന്നെ ചെയ്യുന്നു. അവയിൽ മനസ്സിലാക്കാൻ പ്രയാസമുള്ള ചില കാര്യങ്ങളുണ്ട്. അറിവില്ലാത്തവരും[b] അസ്ഥിരരുമായ ആളുകൾ മറ്റുള്ള തിരുവെഴുത്തുകളെ[a] വളച്ചൊടിക്കുന്നതുപോലെ ഇവയെയും വളച്ചൊടിക്കുന്നു[c]. അത് അവരുടെതന്നെ നാശത്തിൽ കലാശിക്കുന്നു.
  to: തന്റെ എല്ലാ കത്തുകളിലും ഈ കാര്യങ്ങളെക്കുറിച്ച് സംസാരിക്കുമ്പോൾ അദ്ദേഹം ഇങ്ങനെതന്നെ ചെയ്യുന്നു. അവയിൽ മനസ്സിലാക്കാൻ പ്രയാസമുള്ള ചില കാര്യങ്ങളുണ്ട്. അറിവില്ലാത്തവരും[b] നിലയുറപ്പില്ലാത്തവരും മറ്റുള്ള തിരുവെഴുത്തുകളെ[a] വളച്ചൊടിക്കുന്നതുപോലെ, ഇവയെയും വളച്ചൊടിച്ചുകൊണ്ട് അവർക്കുതന്നെ നാശം വരുത്തുന്നു[c].
  rationale: 'The revision preserves the Greek comparison: the same people twist the difficult matters in Paul''s letters as they twist the other/rest of the Scriptures. It also renders the final phrase as an action that brings destruction upon themselves, rather than as a detached concluding result. Footnote anchors remain attached to their relevant Malayalam terms.'
