id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: ml
  text: എന്നാൽ, അവന്റെ വാഗ്ദത്തപ്രകാരം, നീതി[a] വസിക്കുന്ന പുതിയ ആകാശങ്ങളെയും പുതിയ ഭൂമിയെയും നാം കാത്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായം വസിക്കുന്ന.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: പുതിയ ആകാശങ്ങളെയും പുതിയ ഭൂമിയെയും
  rationale: καινός ഗുണത്തിലോ സ്വഭാവത്തിലോ ഉള്ള പുതുമയെ സൂചിപ്പിക്കുന്നു. യെശയ്യാവ് 65:17; 66:22 എന്നിവയിലെ പ്രപഞ്ചവ്യാപകമായ ബൈബിൾഭാഷ നിലനിർത്താൻ ‘ആകാശങ്ങൾ’, ‘ഭൂമി’ എന്നിവ ഉപയോഗിച്ചു; ‘പുതുക്കപ്പെട്ട’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലവിശേഷണത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനം ചേർക്കും.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന ഇപ്പോഴത്തെ ആകാശങ്ങളുടെയും ഭൂമിയുടെയും നാശത്തോടുള്ള മൃദുവായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: അവന്റെ വാഗ്ദത്തപ്രകാരം
  rationale: κατά + accusative ഇവിടെ അനുരൂപതയെയോ അടിസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; ἐπάγγελμα ‘വാഗ്ദത്തം’ എന്നാണ്.
- source_word: προσδοκῶμεν
  choice: നാം കാത്തിരിക്കുന്നു
  rationale: വർത്തമാനകാലരൂപം തുടരുന്ന പ്രതീക്ഷാഭരിതമായ കാത്തിരിപ്പിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν οἷς
  choice: വസിക്കുന്ന
  rationale: ബഹുവചനമായ relative pronoun പുതിയ ആകാശങ്ങളെയും പുതിയ ഭൂമിയെയും ചേർന്ന പുതിയ സൃഷ്ടിയായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ participial രൂപം ഈ ബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: മലയാളത്തിലെ ‘നീതി’ ദൈവസന്നിധിയിലെ ശരിതനവും ന്യായവും ഉൾക്കൊള്ളുന്ന വിശാലമായ ബൈബിൾ ആശയം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: κατοικεῖ
  choice: വസിക്കുന്നു
  rationale: κατοικέω സ്ഥിരമായി പാർക്കുകയോ വസിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വസിക്കുന്നു’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിലെ δικαιοσύνη എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നീതി
  alternative: ന്യായം
  rationale: ‘നീതി’ പുതിയ സൃഷ്ടിയിൽ ദൈവസന്നിധിയിൽ ശരിയായിരിക്കുന്നതും ന്യായം നിലനിൽക്കുന്നതുമായ വിശാല ആശയം സംരക്ഷിക്കുന്നു. ‘ന്യായം’ പ്രസക്തമായ മറ്റൊരു സൂക്ഷ്മാർഥമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മലയാളം. മൂലത്തിലെ മൃദുവായ വൈരുധ്യവും തുടർച്ചയായ പ്രതീക്ഷയും പുതിയ സൃഷ്ടിയുടെ പ്രപഞ്ചവ്യാപക ഭാഷയും സംരക്ഷിച്ചു.
