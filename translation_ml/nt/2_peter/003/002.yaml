- from: വിശുദ്ധ പ്രവാചകന്മാർ മുമ്പേ പറഞ്ഞ വചനങ്ങളും നിങ്ങളുടെ അപ്പൊസ്തലന്മാർ മുഖാന്തരം കർത്താവും രക്ഷകനും നൽകിയ കല്പനയും[a][b] ഓർക്കേണ്ടതിന്,
