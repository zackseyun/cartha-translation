id: 2PE.3.2
reference: 2 Peter 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: ml
  text: വിശുദ്ധ പ്രവാചകന്മാർ മുമ്പേ പറഞ്ഞ വചനങ്ങളും നിങ്ങളുടെ അപ്പൊസ്തലന്മാർ മുഖാന്തരം കർത്താവും രക്ഷകനുമായവന്റെ കല്പനയും[a][b] ഓർക്കേണ്ടതിന്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: ‘നിങ്ങളുടെ അപ്പൊസ്തലന്മാരുടെ, കർത്താവും രക്ഷകനുമായവന്റേതായ, കല്പനയും.’ ഗ്രീക്കിലെ ജനിറ്റീവ് രൂപങ്ങളുടെ ബന്ധം ഒന്നിലധികം സ്വാഭാവിക രീതികളിൽ അവതരിപ്പിക്കാം.'
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ: ‘മുമ്പ് പറയപ്പെട്ട വചനങ്ങൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: ഓർക്കേണ്ടതിന്
  rationale: സന്ദർഭത്തിലെ ഉദ്ദേശ്യബന്ധം നിലനിർത്തിക്കൊണ്ട്, മധ്യ/കർമണരൂപത്തിലുള്ള ഗ്രീക്ക് ക്രിയയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: προειρημένων ῥημάτων
  choice: മുമ്പേ പറഞ്ഞ വചനങ്ങൾ
  rationale: പ്രത്യേകമായി പ്രവചിക്കുക എന്ന ഇടുങ്ങിയ അർഥം ചുമത്താതെ, മുൻകൂട്ടി/മുമ്പായി പറയപ്പെട്ടതെന്ന കാലസൂചനയും വാക്കുകളുടെ സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: വിശുദ്ധ പ്രവാചകന്മാർ പറഞ്ഞ
  rationale: ഗ്രീക്കിലെ പ്രവർത്തൃസൂചന മലയാളത്തിലെ സ്വാഭാവിക കർത്തൃപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἐντολῆς
  choice: കല്പന
  rationale: ഏകവചനവും അധികാരപൂർവമായ ആജ്ഞയുടെ ഭാവവും സംരക്ഷിക്കുന്ന പ്രചാരത്തിലുള്ള മലയാള പദം.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: നിങ്ങളുടെ അപ്പൊസ്തലന്മാർ മുഖാന്തരം
  rationale: ὑμῶν എന്നത് ἀποστόλων-നോടു ബന്ധിപ്പിക്കുമ്പോഴും, കർത്താവിന്റെ കല്പന അപ്പൊസ്തലന്മാർ മുഖാന്തരം ലഭിച്ചതെന്ന പ്രധാന വാക്യഘടന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: കർത്താവും രക്ഷകനും നൽകിയ
  rationale: ജനിറ്റീവ് ബന്ധത്തെ കല്പനയുടെ ഉറവിടമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘നമ്മുടെ’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: τῶν ἀποστόλων ὑμῶν എന്നതിലെ ὑμῶν-ന്റെ ബന്ധം
  choice: ‘നിങ്ങളുടെ’ എന്നത് ‘അപ്പൊസ്തലന്മാർ’ എന്നതോടു ചേർത്തു
  alternative: ‘അപ്പൊസ്തലന്മാർ നിങ്ങൾക്കു നൽകിയ കല്പന’
  rationale: പദക്രമം ὑμῶν-നെ ἀποστόλων-നോടാണ് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഉടമസ്ഥതയുടെ അതിരുകടന്ന ഭാവം ഒഴിവാക്കാൻ ‘മുഖാന്തരം’ ചേർത്ത് അവരുടെ മധ്യസ്ഥപങ്ക് പ്രകടമാക്കി.
- issue: τοῦ κυρίου καὶ σωτῆρος എന്നതിന്റെ വാക്യഘടനാപരമായ ബന്ധം
  choice: കല്പനയുടെ ഉറവിടം കർത്താവും രക്ഷകനുമാണ്; അത് അപ്പൊസ്തലന്മാർ മുഖാന്തരം ലഭിച്ചു
  alternative: അപ്പൊസ്തലന്മാർ കർത്താവിന്റെയും രക്ഷകന്റെയും ആളുകളാണെന്ന വിശേഷണം
  rationale: ἐντολῆς-നോടുള്ള ബന്ധമാണ് ഏറ്റവും യോജിച്ചത്; എന്നാൽ ഗ്രീക്ക് ജനിറ്റീവുകളുടെ ഘടനയ്ക്ക് ഒന്നിലധികം അവതരണസാധ്യതകളുള്ളതിനാൽ പകരം വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മുൻവാക്യത്തിൽ ആരംഭിച്ച ഉദ്ദേശ്യഘടന തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ‘അപ്പൊസ്തലൻ’, ‘കല്പന’, ‘കർത്താവ്’, ‘രക്ഷകൻ’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചു.
