id: 2PE.3.9
reference: 2 Peter 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: ml
  text: കർത്താവ് തന്റെ വാഗ്ദാനത്തെക്കുറിച്ച് വൈകുന്നില്ല[a]—ചിലർ അതിനെ വൈകുന്നതായി കരുതുന്നതുപോലെയല്ല. മറിച്ച്, അവിടുന്ന് നിങ്ങളോടു ദീർഘക്ഷമ കാണിക്കുന്നു[b][c]; ആരും നശിച്ചുപോകാൻ അല്ല, എല്ലാവരും മാനസാന്തരത്തിലേക്കു വരാനാണ് അവിടുന്ന് ആഗ്രഹിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “വാഗ്ദാനം നിറവേറ്റാൻ വൈകുന്നില്ല.”'
    reason: ‘വാഗ്ദാനത്തെക്കുറിച്ച് വൈകുന്നില്ല’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ മലയാളത്തിലെ കൂടുതൽ വ്യക്തമായ, എന്നാൽ അല്പം വ്യാഖ്യാനാത്മകമായ പകരം.
  - marker: b
    text: 'അഥവാ: “നിങ്ങളോടു ക്ഷമയോടെ പെരുമാറുന്നു.”'
    reason: μακροθυμεῖ എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാള പകരം.
  - marker: c
    text: “ആരും”, “എല്ലാവരും” എന്നിവയുടെ വ്യാപ്തി ഗ്രീക്കിലുള്ളതുപോലെ ഇവിടെ നിർണ്ണയിക്കാതെ വിട്ടിരിക്കുന്നു. പത്രോസിന്റെ വായനക്കാരെ പ്രത്യേകിച്ചാണോ അതോ മനുഷ്യരെ കൂടുതൽ വ്യാപകമായാണോ ഉദ്ദേശിക്കുന്നത് എന്നതിൽ വ്യാഖ്യാതാക്കൾക്കു ഭിന്നാഭിപ്രായമുണ്ട്.
    reason: വിവർത്തനത്തിൽ പരിഹരിക്കരുതാത്ത യഥാർഥ വ്യാഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ അനിശ്ചിതത്വം.
lexical_decisions:
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ദൈവിക/ക്രിസ്തുസംബന്ധമായ സ്ഥാനനാമമായി മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ വിവർത്തനം.
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: തന്റെ വാഗ്ദാനത്തെക്കുറിച്ച് താമസിക്കുന്നില്ല
  rationale: βραδύνει എന്നതിലെ വൈകൽ/താമസം എന്ന ആശയം നിലനിർത്തുകയും τῆς ἐπαγγελίας എന്ന ബന്ധത്തെ വ്യാഖ്യാനാത്മകമായി വികസിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു. സന്ദർഭം വ്യക്തമാക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായി ‘തന്റെ’ ചേർത്തിരിക്കുന്നു.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: ചിലർ താമസമെന്നു കരുതുന്നതുപോലെ
  rationale: ἡγέομαι എന്നതിന്റെ ‘കരുതുക/വിലയിരുത്തുക’ എന്ന അർഥവും βραδύτητα എന്ന നാമത്തിന്റെ ‘താമസം’ എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μακροθυμεῖ
  choice: ദീർഘക്ഷമ കാണിക്കുന്നു
  rationale: ദീർഘകാലം ക്ഷമയോടെ പിടിച്ചുനിൽക്കുന്ന നിയന്ത്രിത സഹനത്തിന്റെ ഭാവം ലളിതമായ ‘ക്ഷമിക്കുന്നു’ എന്നതിനെക്കാൾ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങളോടു
  rationale: വ്യക്തികളിലേക്കുള്ള മനോഭാവത്തിന്റെ ദിശ സൂചിപ്പിക്കുന്ന εἰς മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μὴ βουλόμενός
  choice: ആഗ്രഹിച്ചുകൊണ്ട്
  rationale: βούλομαι എന്നതിലെ ഇച്ഛ/ആഗ്രഹത്തിന്റെ അർഥം നിലനിർത്തുന്നു; ദൈവഹിതത്തെക്കുറിച്ചുള്ള പിന്നീടുള്ള സാങ്കേതിക വേർതിരിവുകൾ പാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: τινας ἀπολέσθαι
  choice: ആരും നശിച്ചുപോകാതെ
  rationale: ἀπόλλυμι എന്നതിന്റെ അകർമ്മകമായ ‘നശിച്ചുപോകുക’ എന്ന ഭാവം നൽകുന്നു; പുറമേനിന്നുള്ള നശിപ്പിക്കൽ എന്ന കാരകഭാവം ഒഴിവാക്കുന്നു.
- source_word: πάντας
  choice: എല്ലാവരും
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും വ്യാപ്തി നിർണ്ണയിക്കാത്തതുമായ ‘എല്ലാവരും’ അതേപടി നിലനിർത്തുന്നു.
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: മാനസാന്തരത്തിലേക്കു വരുക
  rationale: χωρέω ഇവിടെ ഒരു നിലയിലേക്കു പ്രവേശിക്കുക/എത്തുക എന്ന അർഥത്തിലാണ്; μετάνοια എന്നതിന് നിലവാരമുള്ളതും ദൈവശാസ്ത്രപരമായി പരിചിതവുമായ ‘മാനസാന്തരം’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘നിങ്ങൾ’, ‘ആരും’, ‘എല്ലാവരും’ എന്നിവയുടെ വ്യാപ്തി
  choice: ‘നിങ്ങളോടു ... ആരും ... എല്ലാവരും’ എന്ന് ഗ്രീക്ക് പാഠത്തിലുള്ളതുപോലെ പരിധി നിർണ്ണയിക്കാതെ നൽകുക.
  alternative: ‘ആരും/എല്ലാവരും’ എന്നത് ലേഖനസ്വീകർത്താക്കളിൽ മാത്രം പരിമിതപ്പെടുത്തുക, അല്ലെങ്കിൽ മുഴുവൻ മനുഷ്യരാശിയെയും വ്യക്തമായി സൂചിപ്പിക്കുന്നതായി വികസിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം വ്യാപ്തിയെ വ്യക്തമായി നിർവചിക്കുന്നില്ല. അതിനാൽ പിന്നീടുള്ള ദൈവശാസ്ത്രവാദങ്ങളിൽ നിന്നുള്ള പരിമിതീകരണമോ വിപുലീകരണമോ വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: βουλόμενος എന്നതിലെ ദൈവിക ഇച്ഛയുടെ സ്വഭാവം
  choice: ‘ആഗ്രഹിച്ചുകൊണ്ട്’
  alternative: ‘നിശ്ചയിച്ചുകൊണ്ട്’ അല്ലെങ്കിൽ സാങ്കേതികമായി ‘ഇച്ഛിച്ചുകൊണ്ട്’
  rationale: പദം ഇച്ഛയെയോ ആഗ്രഹത്തെയോ സൂചിപ്പിക്കുന്നു; എന്നാൽ ദൈവഹിതത്തിന്റെ വിവിധ സാങ്കേതിക വിഭാഗങ്ങൾ വാക്യം തന്നെ നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. ‘കർത്താവ്’, ‘വാഗ്ദാനം’, ‘മാനസാന്തരം’, ‘ദീർഘക്ഷമ’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
