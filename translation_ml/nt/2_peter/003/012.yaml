id: 2PE.3.12
reference: 2 Peter 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: ml
  text: ദൈവത്തിന്റെ ദിവസത്തിന്റെ വരവിനായി കാത്തിരിക്കുകയും അതിനെ വേഗത്തിലാക്കുകയും ചെയ്യുമ്പോൾ[a], ആ ദിവസം നിമിത്തം ആകാശങ്ങൾ തീപിടിച്ച് വിഘടിച്ചുപോകുകയും മൂലഘടകങ്ങൾ[b] കത്തിയുരുകുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവത്തിന്റെ ദിവസത്തിന്റെ വരവിനായി ആകാംക്ഷയോടെ കാത്തിരിക്കുമ്പോൾ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് “വേഗത്തിലാക്കുക” എന്നും “ആകാംക്ഷയോടെ കാത്തിരിക്കുക” എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: “മൂലഘടകങ്ങൾ” എന്നത് ലോകത്തിന്റെ അടിസ്ഥാന ഘടകങ്ങളെയോ ഒരുപക്ഷേ ആകാശഗോളങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: കാത്തിരിക്കുകയും
  rationale: പ്രതീക്ഷയോടെയുള്ള തുടർച്ചയായ കാത്തിരിപ്പിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: σπεύδοντας
  choice: അതിനെ വേഗത്തിലാക്കുകയും
  rationale: പ്രത്യക്ഷ കർമത്തോടുകൂടിയ ക്രിയയുടെ ‘വേഗത്തിലാക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ‘ആകാംക്ഷയോടെ കാത്തിരിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: παρουσίαν
  choice: വരവ്
  rationale: അന്ത്യകാലസന്ദർഭത്തിൽ സാന്നിധ്യം/ആഗമനം എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: ദൈവത്തിന്റെ ദിവസം
  rationale: കൂടുതൽ പതിവുള്ള ‘കർത്താവിന്റെ ദിവസം’ എന്ന പ്രയോഗവുമായി ലയിപ്പിക്കാതെ ഗ്രീക്കിലെ അസാധാരണമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: δι’ ἣν
  choice: ആ ദിവസം നിമിത്തം
  rationale: διά + accusative ഇവിടെ സൂചിപ്പിക്കുന്ന കാരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐρανοὶ
  choice: ആകാശങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും പ്രപഞ്ചപരമായ വ്യാപ്തി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πυρούμενοι
  choice: തീപിടിച്ച്
  rationale: തീയാൽ ബാധിക്കപ്പെടുന്ന അർഥം മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: λυθήσονται
  choice: അഴിഞ്ഞുപോകുകയും
  rationale: നശിപ്പിക്കപ്പെടുക എന്നതിലുപരി ഘടന പിരിഞ്ഞുപോകുക/വിഘടിക്കുക എന്ന λύωയുടെ സന്ദർഭോചിത അർഥം നൽകുന്നു.
- source_word: στοιχεῖα
  choice: മൂലഘടകങ്ങൾ
  rationale: ലോകത്തിന്റെ അടിസ്ഥാന ഘടകങ്ങളെയോ ആകാശഗോളങ്ങളെയോ സൂചിപ്പിക്കാവുന്ന പദത്തിന്റെ അനിശ്ചിതത്വം പരമാവധി നിലനിർത്തുന്നു.
- source_word: καυσούμενα
  choice: കത്തി
  rationale: ചൂടിന്റെയോ തീയുടെയോ പ്രവർത്തനത്തിന് വിധേയമാകുന്ന ഘടകങ്ങളെ സ്വാഭാവികമായി വിവരിക്കുന്നു.
- source_word: τήκεται
  choice: ഉരുകുകയും ചെയ്യും
  rationale: ചൂടിനാൽ ഉരുകിപ്പോകുക എന്ന അർഥം നൽകുകയും ചുറ്റുമുള്ള ഭാവികാല പ്രസ്താവനകളോട് മലയാളവാക്യത്തിൽ യോജിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: σπεύδοντας τὴν παρουσίαν എന്നതിന്റെ അർഥം
  choice: വരവിനെ വേഗത്തിലാക്കുക
  alternative: വരവിനായി ആകാംക്ഷയോടെ കാത്തിരിക്കുക
  rationale: ഗ്രീക്ക് രണ്ട് അർഥസാധ്യതകളും അനുവദിക്കുന്നു. വരവിനെ കർമമായി സ്വീകരിക്കുന്ന നേരിട്ടുള്ള വായന മുഖ്യപാഠത്തിൽ നൽകിയിട്ടും കാരണപരമായ ധാർമ്മിക നിഗമനം നിർബന്ധിക്കാതിരിക്കാൻ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: στοιχεῖα എന്നതിന്റെ സൂചിതവസ്തു
  choice: മൂലഘടകങ്ങൾ
  alternative: ആകാശഗോളങ്ങൾ
  rationale: ഈ അന്ത്യകാലസന്ദർഭത്തിൽ പദത്തിന്റെ സൂചിതവസ്തു വിവാദവിധേയമാണ്; പ്രത്യേക പ്രപഞ്ചസങ്കൽപ്പം പാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ വിശാലമായ പദം തിരഞ്ഞെടുക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ പങ്കാളിക്രിയകൾ മലയാളത്തിലെ തുടർച്ചയായ ക്രിയാസംയോജനമായി മാറ്റി; അപൂർവമായ ‘ദൈവത്തിന്റെ ദിവസം’ എന്ന പ്രയോഗവും പ്രധാന വ്യാഖ്യാനസന്ദിഗ്ധതകളും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
