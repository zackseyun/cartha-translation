  source_fidelity: 'മുഖ്യാർത്ഥം പൊതുവേ കൃത്യമാണ്: προσδοκῶντας-ന്റെ പ്രതീക്ഷാപൂർവ കാത്തിരിപ്പും σπεύδοντας-ന്റെ ‘വേഗത്തിലാക്കുക’ എന്ന സാധ്യമായ അർഥവും, ‘ദൈവത്തിന്റെ ദിവസം’ എന്ന അസാധാരണ പ്രയോഗവും, στοιχεῖα-യുടെ സന്ദിഗ്ധതയും നിലനിൽക്കുന്നു. എന്നിരുന്നാലും λυθήσονται-യ്ക്ക് ‘അഴിഞ്ഞുപോകുക’ എന്നതിനെക്കാൾ ‘വിഘടിച്ചുപോകുക’ പ്രപഞ്ചഘടന പിരിഞ്ഞുപോകുന്ന സന്ദർഭം കൂടുതൽ നേരിട്ട് അറിയിക്കുന്നു.'
  naturalness: വാക്യഘടന ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘ദൈവത്തിന്റെ ദിവസത്തിന്റെ’ എന്ന ഇരട്ട ഷഷ്ഠീപ്രയോഗം അല്പം ഭാരമുള്ളതെങ്കിലും ‘the coming of the day of God’ എന്ന സ്രോതസ്സുഘടനയും ‘ദൈവത്തിന്റെ ദിവസം’ എന്ന വ്യതിരിക്ത പ്രയോഗവും സംരക്ഷിക്കുന്നതിനാൽ നിലനിർത്തിയിരിക്കുന്നു.
  terminology: ‘മൂലഘടകങ്ങൾ’ στοιχεῖα-യ്ക്ക് ഉചിതമായ വിശാലപദമാണ്; അടിക്കുറിപ്പ് അതിന്റെ സാദ്ധ്യമായ ‘ആകാശഗോളങ്ങൾ’ എന്ന സൂചന സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം വിശദീകരിക്കപ്പെടുന്ന പദത്തോടുതന്നെ ചേർക്കുന്നതാണ് വ്യക്തതയ്ക്ക് ഉചിതം.
