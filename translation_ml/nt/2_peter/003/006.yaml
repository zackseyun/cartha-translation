lexical_decisions:
- source_word: δι’ ὧν
  choice: അവയിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം/ഉപാധി എന്ന അർഥവും ബഹുവചന സർവനാമത്തിന്റെ തുറന്ന പരാമർശവും നിലനിർത്തുന്നു; മുൻവാക്യത്തിൽ പറഞ്ഞ കാര്യങ്ങളിലേക്കാണ് ഇത് മടങ്ങിപ്പോകുന്നത്.
- source_word: ὁ τότε κόσμος
