  source_fidelity: 'മൂലവാക്യത്തിലെ പ്രധാന ഘടകങ്ങൾ കരടിൽ ഉണ്ട്: ഇപ്പോഴുള്ള ആകാശങ്ങളും ഭൂമിയും, അതേ വചനം, തീ, ന്യായവിധിയുടെയും അഭക്തരുടെ നാശത്തിന്റെയും ദിവസം. എന്നാൽ ‘തീയ്ക്കായി കരുതിവെക്കപ്പെട്ടിരിക്കുന്നു’ എന്നും ‘ദിവസത്തേക്കായി അവ സൂക്ഷിക്കപ്പെടുന്നു’ എന്നും വേർതിരിച്ച നിലവിലെ ഘടന ഗ്രീക്കിലെ τεθησαυρισμένοι (‘സംഭരിച്ചുവെക്കപ്പെട്ടിരിക്കുന്നു’) എന്നും πυρὶ τηρούμενοι (‘തീയ്ക്കായി സൂക്ഷിക്കപ്പെടുന്നു’) എന്നും ഉള്ള ബന്ധം അല്പം മങ്ങിക്കുന്നു.'
  naturalness: ‘ഭക്തികെട്ട’ ആധുനിക ഉപയോഗത്തിൽ സ്വാഭാവികമാണെങ്കിലും, ἀσεβῶν-ന്റെ ദൈവഭക്തിയില്ലാത്ത/അഭക്തമായ ആശയം ‘അഭക്തരായ’ കൂടുതൽ ചുരുക്കത്തോടെയും ഗൗരവമുള്ള തിരുവെഴുത്തു രജിസ്റ്ററോടെയും നൽകുന്നു. വാക്യഘടന പുനഃക്രമീകരിക്കുന്നത് തീയ്ക്കായുള്ള സൂക്ഷിപ്പിനെയും ഭാവിയിലെ ദിവസത്തെയും കൂടുതൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
  terminology: ‘വചനം,’ ‘ന്യായവിധി,’ ‘നാശം’ എന്നിവ യോജിച്ചവയാണ്. ‘ആകാശങ്ങളും ഭൂമിയും’ ഗ്രീക്കിലെ ബഹുവചന οὐρανοί-യും ഏകവചന γῆ-യും നന്നായി പ്രതിഫലിപ്പിക്കുന്നു. ‘അഭക്തരായ മനുഷ്യർ’ ἀσεβῶν ἀνθρώπων-നെ ലിംഗനിഷ്പക്ഷമായ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
