  to: എന്നാൽ ഇപ്പോഴുള്ള ആകാശങ്ങളും ഭൂമിയും അതേ വചനത്താൽ സംഭരിച്ചുവെക്കപ്പെട്ടിരിക്കുന്നു; തീയ്ക്കായി സൂക്ഷിക്കപ്പെട്ടുകൊണ്ട്, അഭക്തരായ മനുഷ്യരുടെ ന്യായവിധിയുടെയും നാശത്തിന്റെയും ദിവസത്തിനായി അവ നിലകൊള്ളുന്നു.
