id: 2PE.3.7
reference: 2 Peter 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോഴുള്ള ആകാശങ്ങളും ഭൂമിയും അതേ വചനത്താൽ സംഭരിച്ചുവെക്കപ്പെട്ടിരിക്കുന്നു; തീയ്ക്കായി സൂക്ഷിക്കപ്പെട്ടുകൊണ്ട്, അഭക്തരായ മനുഷ്യരുടെ ന്യായവിധിയുടെയും നാശത്തിന്റെയും ദിവസത്തിനായി അവ നിലകൊള്ളുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: എന്നാൽ ഇപ്പോഴുള്ള ആകാശങ്ങളും ഭൂമിയും
  rationale: δέ മുൻവാക്യത്തിലെ പഴയ ലോകവുമായി ഉള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി. νῦν ഇപ്പോഴുള്ള സൃഷ്ടിവ്യവസ്ഥയെ സൂചിപ്പിക്കുന്നു; οὐρανοί എന്ന ബഹുവചനം ‘ആകാശങ്ങൾ’ എന്നു നിലനിർത്തി.
- source_word: τῷ αὐτῷ λόγῳ
  choice: അതേ വചനത്താൽ
  rationale: λόγος സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ ദൈവത്തിന്റെ ഫലപ്രദമായ വചനത്തിലേക്കു മടങ്ങിച്ചൂണ്ടുന്നു. ദത്തിവ് കരണാർഥത്തിൽ സ്വാഭാവികമായി ‘-ത്താൽ’ എന്നു നൽകി; αὐτῷയുടെ അനുസ്മരണബലം ‘അതേ’ നിലനിർത്തുന്നു.
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: കരുതിവെക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഈ പരോക്ഷ പൂർണകാലരൂപം കഴിഞ്ഞ പ്രവൃത്തിയുടെ ഫലമായി തുടരുന്ന ഇപ്പോഴത്തെ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘കരുതിവെക്കപ്പെട്ടിരിക്കുന്നു’ പൂർത്തിയായ പ്രവൃത്തിയും നിലനിൽക്കുന്ന അവസ്ഥയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: πυρὶ τηρούμενοι
  choice: തീയ്ക്കായി … സൂക്ഷിക്കപ്പെടുന്നു
  rationale: τηρέω എന്നത് സൂക്ഷിക്കുക/കാത്തുവെക്കുക എന്ന അർഥത്തിലാണ്. πυρί ഇവിടെ ഉദ്ദേശ്യമോ ലക്ഷ്യമോ സൂചിപ്പിക്കുന്നതായി എടുത്ത് ‘തീയ്ക്കായി’ എന്നു നൽകി; ഗ്രീക്കിൽ നിർദേശക ലേഖനം ഇല്ലാത്തതിനാൽ പ്രത്യേകമായ ‘ആ തീ’ എന്ന് പറഞ്ഞില്ല.
- source_word: εἰς ἡμέραν κρίσεως καὶ ἀπωλείας
  choice: ന്യായവിധിയുടെയും നാശത്തിന്റെയും ദിവസത്തേക്കായി
  rationale: εἰς കാലപരമായ ലക്ഷ്യബിന്ദുവിനെ സൂചിപ്പിക്കുന്നു; ‘ദിവസത്തേക്കായി’ ആ ലക്ഷ്യഭാവം സംരക്ഷിക്കുന്നു. ἀπώλεια വ്യക്തവും മതസാങ്കേതികഭാരം കുറഞ്ഞതുമായ ‘നാശം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: ഭക്തികെട്ട മനുഷ്യരുടെ
  rationale: ἀσεβής ദൈവഭക്തിയില്ലായ്മയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭക്തികെട്ട’ എന്നു നൽകി. ἄνθρωποι മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കാം; മലയാളത്തിലെ ‘മനുഷ്യർ’ ലിംഗഭേദമില്ലാതെ ആ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
theological_decisions:
- issue: വരാനിരിക്കുന്ന അഗ്നിന്യായവിധിയുടെ സ്വഭാവം
  choice: ഇപ്പോഴുള്ള ആകാശങ്ങളും ഭൂമിയും ഭാവിയിലെ തീയ്ക്കായി സൂക്ഷിക്കപ്പെടുന്നു എന്നും ഭക്തികെട്ട മനുഷ്യരുടെ ന്യായവിധിയുടെയും നാശത്തിന്റെയും ദിവസം വരുന്നു എന്നും മാത്രം വ്യക്തമാക്കുന്നു.
  alternative: സൃഷ്ടിയുടെ സമ്പൂർണ ഉന്മൂലനം, അല്ലെങ്കിൽ ശുദ്ധീകരണത്തിലൂടെയുള്ള രൂപാന്തരം എന്നു നിർണയിക്കുക.
  rationale: ‘നാശം’ എന്നത് വ്യാകരണപരമായി ഭക്തികെട്ട മനുഷ്യരോടാണ് നേരിട്ട് ബന്ധിപ്പിച്ചിരിക്കുന്നത്. ഈ വാക്യം മാത്രം ആകാശത്തിന്റെയും ഭൂമിയുടെയും അന്തിമാവസ്ഥയെ പൂർണ ഉന്മൂലനമോ രൂപാന്തരമോ എന്ന് തീർപ്പാക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കരുതിവെക്കപ്പെട്ടിരിക്കുന്നു’ എന്നും ‘സൂക്ഷിക്കപ്പെടുന്നു’ എന്നും വ്യത്യസ്ത പദങ്ങൾ ഉപയോഗിച്ച് τεθησαυρισμένοι, τηρούμενοι എന്നീ രണ്ടു ഗ്രീക്ക് ആശയങ്ങളുടെ വ്യത്യാസം നിലനിർത്തി. ‘മനുഷ്യർ’ സ്വാഭാവികമായി എല്ലാവരെയും ഉൾക്കൊള്ളുന്നതിനാൽ ഇംഗ്ലീഷിൽ ആവശ്യമായിരുന്ന ലിംഗസംബന്ധിയായ അടിക്കുറിപ്പ് മലയാളത്തിൽ ആവശ്യമില്ല.
