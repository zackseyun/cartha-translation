id: 2PE.3.4
reference: 2 Peter 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: ml
  text: 'പറഞ്ഞുകൊണ്ട്: “അവന്റെ വരവിന്റെ വാഗ്ദാനം എവിടെ? പിതാക്കന്മാർ നിദ്ര പ്രാപിച്ചതുമുതൽ[a], സൃഷ്ടിയുടെ ആരംഭം മുതൽ ഉണ്ടായിരുന്നതുപോലെതന്നെ സകലവും തുടരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിദ്ര പ്രാപിച്ചു” എന്നത് മരിച്ചതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സൗമ്യപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ പരിഹാസക്കാരെ വിവരിക്കുന്ന വർത്തമാനകാല പങ്കാളിത്തക്രിയയുടെ ഒഴുക്ക് നിലനിർത്തുന്നു; മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ‘ഇങ്ങനെ’ ചേർത്തു.
- source_word: ἐπαγγελία
  choice: വാഗ്ദാനം
  rationale: വരവിനെക്കുറിച്ചുള്ള ഉറപ്പിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപദം.
- source_word: παρουσίας
  choice: വരവ്
  rationale: ഈ അന്ത്യകാലസന്ദർഭത്തിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന ക്രിസ്തുവിന്റെ ആഗമനത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘സാന്നിധ്യം’ എന്ന സ്തബ്ധമായ അർഥം ഇവിടെ കുറച്ച് യോജിച്ചതാണ്.
- source_word: ἀφ’ ἧς
  choice: മുതൽ
  rationale: കഴിഞ്ഞുപോയ ഒരു സമയബിന്ദുവിൽനിന്നുള്ള തുടർച്ച മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ πατέρες
  choice: പിതാക്കന്മാർ
  rationale: ഉടമസ്ഥസർവനാമം ചേർക്കാതെ ഗ്രീക്കിലെ നിർദ്ദിഷ്ടരൂപം സംരക്ഷിക്കുന്നു; മുൻതലമുറകളെ സൂചിപ്പിക്കാം.
- source_word: ἐκοιμήθησαν
  choice: നിദ്രപ്രാപിച്ചു
  rationale: മരണത്തിനുള്ള ഗ്രീക്ക് സൗമ്യപ്രയോഗത്തിലെ ഉറക്കത്തിന്റെ രൂപകം നിലനിർത്തുന്നു.
- source_word: πάντα
  choice: സകലവും
  rationale: സമഗ്രമായ വ്യാപ്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὕτως διαμένει
  choice: ഉണ്ടായിരുന്നതുപോലെതന്നെ ... തുടരുന്നു
  rationale: എല്ലാം അതേ നിലയിൽ തുടരുന്നു എന്ന പരിഹാസക്കാരുടെ വാദം മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: സൃഷ്ടിയുടെ ആരംഭംമുതൽ
  rationale: ഗ്രീക്ക് പദബന്ധത്തിന്റെ അർഥവും കാലസൂചനയും അടുത്തായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിലെ παρουσία എന്ന പദത്തിന്റെ അർഥം
  choice: അവന്റെ വരവ്
  alternative: അവന്റെ സാന്നിധ്യം / ആഗമനം
  rationale: സന്ദർഭം ക്രിസ്തുവിന്റെ പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവി മടങ്ങിവരവിന്റെ വൈകലിനെ പരിഹസിക്കുന്നതാണ്. ‘വരവ്’ ആ ചലനാത്മക അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- issue: ἐκοιμήθησαν എന്ന മരണസൗമ്യപ്രയോഗം
  choice: നിദ്രപ്രാപിച്ചു
  alternative: മരിച്ചു
  rationale: മൂലപാഠത്തിലെ ഉറക്കരൂപകം നിലനിർത്തുന്നു; അതിൽ ഇല്ലാത്ത പ്രത്യേക ഉപദേശവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തോട് ബന്ധപ്പെടുന്ന പങ്കാളിത്തക്രിയാരൂപം നിലനിർത്തുന്നു. ‘പിതാക്കന്മാർ’ എന്നത് ഗ്രീക്കിലെ ഉടമസ്ഥസർവനാമമില്ലായ്മ സംരക്ഷിക്കുന്നു; മരണത്തിനുള്ള ഉറക്കരൂപകം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
