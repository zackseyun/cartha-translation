  to: 'ഒന്നാമതായി, ഇത് അറിഞ്ഞുകൊണ്ട്: അന്ത്യനാളുകളിൽ പരിഹാസത്തോടെ പരിഹസിക്കുന്നവർ[a], സ്വന്തം മോഹങ്ങൾക്കനുസരിച്ച് നടക്കുന്നവരായി, വരും[b].'
  rationale: The revision makes “സ്വന്തം മോഹങ്ങൾക്കനുസരിച്ച് നടക്കുന്നവരായി” modify the incoming scoffers, preserving the Greek participial relationship. It retains the cognate emphasis of ἐν ἐμπαιγμονῇ ἐμπαῖκται and preserves the broad, morally negative sense of ἐπιθυμίαι. Footnote b is moved to the end because its explained term occurs within the preceding descriptive phrase; this is structurally valid but less immediate than ideal.
