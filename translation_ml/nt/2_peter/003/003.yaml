source:
  edition: SBLGNT
  text: τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ⸀ἐσχάτων τῶν ἡμερῶν ⸂ἐν ἐμπαιγμονῇ⸃ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: ml
  text: 'ഒന്നാമതായി, ഇത് അറിഞ്ഞുകൊണ്ട്: അന്ത്യനാളുകളിൽ പരിഹാസത്തോടെ പരിഹസിക്കുന്നവർ[a], സ്വന്തം മോഹങ്ങൾക്കനുസരിച്ച് നടക്കുന്നവരായി, വരും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരിഹാസത്തിൽ പരിഹാസകർ.” ഗ്രീക്കിൽ ഊന്നലിനായി ഒരേ ധാതുവിൽനിന്നുള്ള രണ്ടു പദങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “മോഹങ്ങൾ” എന്നത് “ദുരാഗ്രഹങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദം ലൈംഗിക മോഹം മാത്രമല്ല, ശക്തമായ ആഗ്രഹങ്ങളെ പൊതുവായും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: ഒന്നാമതായി ഇതു അറിഞ്ഞുകൊള്ളുക
  rationale: ഗ്രീക്കിലെ പങ്കാളിത്തരൂപം സന്ദർഭത്തിൽ വായനക്കാരോടുള്ള ആഹ്വാനമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; πρῶτον എന്നതിന്റെ മുൻഗണനാഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐλεύσονται
  choice: വരും
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ഭാവികാല അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: അന്ത്യനാളുകളിൽ
  rationale: കാലസൂചനയും പരമ്പരാഗത അന്ത്യകാലപ്രയോഗവും നിലനിർത്തുന്ന, എന്നാൽ പ്രത്യേക അന്ത്യകാലവ്യവസ്ഥ നിർബന്ധിക്കാത്ത പരിഭാഷ.
- source_word: ἐν ἐμπαιγμονῇ ... ἐμπαῖκται
  choice: പരിഹാസത്തോടെ പരിഹസിക്കുന്നവർ
  rationale: മൂലത്തിലെ ഒരേ ധാതുവിൽനിന്നുള്ള പദങ്ങളുടെ ഊന്നൽ മലയാളത്തിലും ആവർത്തനത്തിലൂടെ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: സ്വന്തം മോഹങ്ങൾക്കനുസരിച്ച്
  rationale: ἐπιθυμία എന്നത് ലൈംഗിക മോഹത്തിൽ മാത്രം ഒതുങ്ങാതെ ശക്തമായ ആഗ്രഹങ്ങളെ വിശാലമായി സൂചിപ്പിക്കാം; സന്ദർഭത്തിലെ നിഷേധാത്മക ധാർമ്മിക ഭാവം ‘മോഹങ്ങൾ’ നൽകുന്നു.
- source_word: πορευόμενοι
  choice: നടക്കും
  rationale: ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന നടത്തം എന്ന രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിൽ ബൈബിൾപരവും ഗ്രഹിക്കാവുന്നതുമാണ്.
theological_decisions:
- issue: ἐπ’ ἐσχάτων τῶν ἡμερῶν എന്ന അന്ത്യകാലപ്രയോഗം
  choice: അന്ത്യനാളുകളിൽ
  alternative: നാളുകളുടെ അവസാനത്തിൽ
  rationale: വാക്യത്തിന്റെ അന്ത്യകാല മുന്നറിയിപ്പ് നിലനിർത്തുന്നു; എന്നാൽ ഏതെങ്കിലും പ്രത്യേക സഹസ്രാബ്ദവാദമോ സഭാപാരമ്പര്യത്തിലെ അന്ത്യകാലക്രമമോ ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ പരിഹാസപദങ്ങളുടെ ആവർത്തനഊന്നലും ‘നടക്കുക’ എന്ന ജീവിതരൂപകവും നിലനിർത്തി.
