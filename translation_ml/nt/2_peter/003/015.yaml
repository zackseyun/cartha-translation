source:
  edition: SBLGNT
  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: ml
  text: നമ്മുടെ കർത്താവിന്റെ ദീർഘക്ഷമയെ രക്ഷയായി കണക്കാക്കുക, നമ്മുടെ പ്രിയ സഹോദരനായ പൗലോസും തനിക്കു നൽകപ്പെട്ട ജ്ഞാനത്തിനനുസരിച്ച് നിങ്ങൾക്കു എഴുതിയതുപോലെതന്നെ[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹിഷ്ണുതയെ’; കർത്താവിന്റെ വൈകൽ നിസ്സംഗതയല്ല, രക്ഷ ലക്ഷ്യമാക്കിയുള്ളതാണ് എന്നതാണ് ആശയം.
    reason: lexical_alternative
  - marker: b
    text: ‘തനിക്കു നൽകപ്പെട്ട ജ്ഞാനം’ എന്നത് ദൈവം നൽകിയ ജ്ഞാനത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം; എന്നാൽ ഗ്രീക്കിൽ നൽകിയത് ആരെന്ന് വ്യക്തമാക്കിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: ദീർഘക്ഷമ
  rationale: ന്യായവിധി ഉടൻ നടപ്പാക്കാതെ ക്ഷമയോടെ കാത്തിരിക്കുന്നതും സ്വയം നിയന്ത്രിക്കുന്നതുമായ ഭാവം ഈ പദം സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ കർത്താവിന്റെ വൈകൽ എന്ന ആശയം സ്വാഭാവികമായി നിലനിർത്താൻ ‘ദീർഘക്ഷമ’ അനുയോജ്യമാണ്.
- source_word: σωτηρίαν
  choice: രക്ഷ
  rationale: അന്ത്യകാലസന്ദർഭത്തിൽ കർത്താവിന്റെ ക്ഷമയിലൂടെ പ്രവർത്തിക്കുന്ന ദൈവത്തിന്റെ രക്ഷാകരമായ ഉദ്ദേശ്യം ഈ പദം വഹിക്കുന്നു; അതിന്റെ പുതിയനിയമപരമായ ദൈവശാസ്ത്രഭാരം ‘രക്ഷ’ നിലനിർത്തുന്നു.
- source_word: ἡγεῖσθε
  choice: കണക്കാക്കുക
  rationale: ഒരു കാര്യത്തെ മറ്റൊന്നായി കരുതുകയോ വിലയിരുത്തുകയോ ചെയ്യണമെന്ന ആജ്ഞയാണ് ഇവിടെ. ‘...യായി കണക്കാക്കുക’ σωτηρίαν എന്ന പദവുമായി ഉള്ള വിധേയബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ‘നമ്മുടെ കർത്താവ്’ എന്ന ബഹുമാനപദവിയും സന്ദർഭത്തിലെ യേശുവിനെക്കുറിച്ചുള്ള സൂചനയും മലയാളത്തിലെ പതിവായ പുതിയനിയമപ്രയോഗമായ ‘കർത്താവ്’ സംരക്ഷിക്കുന്നു.
- source_word: ἀγαπητὸς ... ἀδελφὸς
  choice: പ്രിയനായ സഹോദരൻ
  rationale: പൗലോസിനെക്കുറിച്ചുള്ള സ്നേഹപൂർവമായ വിശേഷണം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ ഇതു പകർന്നു നൽകുന്നു.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: തനിക്കു നൽകപ്പെട്ട ജ്ഞാനത്തിന് അനുസരിച്ച്
  rationale: κατά ഇവിടെ അനുരൂപതയെ സൂചിപ്പിക്കുന്നു. δοθεῖσαν എന്ന കർമണിപ്രയോഗത്തിൽ നൽകിയത് ആരെന്നു വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: ἔγραψεν ὑμῖν
  choice: നിങ്ങൾക്ക് എഴുതി
  rationale: ഗ്രീക്കിലെ ആഓറിസ്റ്റ് ക്രിയയെ ലളിതമായ ഭൂതകാലമായി പകർന്നു നൽകുന്നു.
- source_word: καθὼς καὶ
  choice: '...പോലെതന്നെ'
  rationale: പത്രോസിന്റെ ആഹ്വാനത്തെയും പൗലോസിന്റെ സമാനമായ എഴുത്തിനെയും ബന്ധിപ്പിക്കുന്ന താരതമ്യവും കൂട്ടിച്ചേർക്കൽഭാവവും ഈ രൂപം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘തനിക്കു നൽകപ്പെട്ട ജ്ഞാനം’ എന്നതിലെ ദൈവിക കർത്തൃത്വസൂചന
  choice: ‘തനിക്കു നൽകപ്പെട്ട’ എന്ന കർമണിരൂപം നിലനിർത്തി, പ്രധാനപാഠത്തിൽ ‘ദൈവം’ എന്നു ചേർത്തിട്ടില്ല.
  alternative: ‘ദൈവം തനിക്കു നൽകിയ ജ്ഞാനത്തിന് അനുസരിച്ച്’
  rationale: ജ്ഞാനം നൽകിയത് ദൈവമാണെന്ന സൂചന ശക്തമാണെങ്കിലും ഗ്രീക്ക് വാചകം കർത്താവിനെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ സൂചിതമായത് തുറന്നു ചേർക്കാതെ മൂലപാഠത്തിന്റെ രൂപവും അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
- issue: കർത്താവിന്റെ വൈകിയ പ്രവർത്തനത്തിന്റെ അർഥം
  choice: μακροθυμίαയെ ‘ദീർഘക്ഷമ’ എന്നും σωτηρίαയെ ‘രക്ഷ’ എന്നും വിവർത്തനം ചെയ്ത് നേരിട്ടുള്ള വിധേയബന്ധം നിലനിർത്തി.
  alternative: ‘സഹിഷ്ണുതയെ രക്ഷയ്ക്കുള്ള അവസരമായി’
  rationale: വാക്യം കർത്താവിന്റെ വൈകൽ മാനസാന്തരത്തിന് അവസരം നൽകുന്നു എന്നു വിശദീകരിച്ചു പറയുന്നതിലുപരി, അവന്റെ ദീർഘക്ഷമയെ ‘രക്ഷ’യായി കണക്കാക്കാൻ പറയുന്നു. വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി ആ ദൈവശാസ്ത്രപരമായ ഉരസൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി. മൂലത്തിലെ ആജ്ഞ, താരതമ്യം, കർമണിപ്രയോഗത്തിലെ കർത്തൃഅനിശ്ചിതത്വം എന്നിവ നിലനിർത്തിയിട്ടുണ്ട്. വാക്യം അടുത്ത ഭാഗത്തേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ ചേർത്തിരിക്കുന്നു.
