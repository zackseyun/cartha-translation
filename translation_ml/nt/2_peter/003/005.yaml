reference: 2 Peter 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: ml
  text: 'അവർ മനഃപൂർവം ഈ കാര്യം അവഗണിക്കുന്നു: ആകാശങ്ങൾ പണ്ടുമുതലേ ഉണ്ടായിരുന്നു; ഭൂമി വെള്ളത്തിൽനിന്നും വെള്ളത്തിലൂടെയും ദൈവത്തിന്റെ വചനത്താൽ രൂപംകൊണ്ടതായിരുന്നു.[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ കാര്യം അവർ മനഃപൂർവം കാണാതെ പോകുന്നു’ അല്ലെങ്കിൽ ‘ഈ കാര്യം അവർ സ്വമേധയാ അവഗണിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം, ഒരു കാര്യം ശ്രദ്ധയിൽപ്പെടാതിരിക്കുകയോ അറിയപ്പെടാതിരിക്കുകയോ ചെയ്യുന്നതും അതിനോടുള്ള മനഃപൂർവമായ നിലപാടും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: അവർ മനപ്പൂർവം ഈ കാര്യം അവഗണിക്കുന്നു
  rationale: λανθάνει എന്നതിലെ ശ്രദ്ധിക്കാതിരിക്കൽ/അറിയാതിരിക്കൽ എന്ന ആശയത്തോടൊപ്പം θέλοντας സൂചിപ്പിക്കുന്ന മനഃപൂർവതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐρανοὶ ἦσαν ἔκπαλαι
  choice: പണ്ടുമുതലേ ആകാശങ്ങൾ ഉണ്ടായിരുന്നു
  rationale: οὐρανοὶ എന്ന ബഹുവചനം ‘ആകാശങ്ങൾ’ എന്നു നിലനിർത്തുകയും ἔκπαλαιയുടെ പുരാതനകാലസൂചന ‘പണ്ടുമുതലേ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: γῆ
  choice: ഭൂമി
  rationale: ഗ്രീക്കിൽ നിർദേശകപ്രത്യയം ഇല്ലെങ്കിലും, സൃഷ്ടിക്കപ്പെട്ട ലോകത്തെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളം ‘ഭൂമി’ ആണ്; അസ്വാഭാവികമായ അനിശ്ചിതരൂപം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: വെള്ളത്തിൽനിന്നും വെള്ളത്തിലൂടെയും
  rationale: ἐκ എന്ന ഉറവിടസൂചനയും διά എന്ന മാധ്യമ/വഴിസൂചനയും വേർതിരിച്ചു നിലനിർത്തുന്നു; അവയുടെ കൃത്യമായ സൃഷ്ടിശാസ്ത്രബന്ധം വ്യാഖ്യാനിച്ച് തീർക്കുന്നില്ല.
- source_word: συνεστῶσα
  choice: രൂപപ്പെട്ടതായിരുന്നു
  rationale: സൃഷ്ടിസന്ദർഭത്തിലെ ഭൂമിയുടെ സ്ഥാപിതാവസ്ഥയെയോ ഘടനയെയോ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘നിലനിന്നിരുന്നു’, ‘ഘടിതമായിരുന്നു’ തുടങ്ങിയ സാധ്യതകളെ പൂർണമായി നിഷേധിക്കാതെ വായനാസൗകര്യം നൽകുന്നു.
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: ദൈവത്തിന്റെ വചനത്താൽ
  rationale: instrumental dative-നെ ‘-ത്താൽ’ എന്നു പ്രതിഫലിപ്പിക്കുകയും λόγος-നെ ‘വചനം’ എന്നു ഔപചാരികമായി നിലനിർത്തുകയും ചെയ്യുന്നു; അതിനെ വെറും ‘കല്പന’യായി ചുരുക്കുകയോ വ്യക്തിപരമായ Logos എന്ന അർഥം നേരിട്ട് ചേർക്കുകയോ ചെയ്യുന്നില്ല.
theological_decisions:
- issue: λόγῳ എന്നത് വ്യക്തിപരമായ Logos-നെ സൂചിപ്പിക്കുന്നവിധം പരിഭാഷപ്പെടുത്തണമോ
  choice: ദൈവത്തിന്റെ വചനത്താൽ
  alternative: ദൈവത്തിന്റെ കല്പനയാൽ
  rationale: സന്ദർഭം സൃഷ്ടിയിൽ പ്രവർത്തിക്കുന്ന ദൈവത്തിന്റെ ഫലപ്രദമായ വചനത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഈ വാക്യം തന്നെ അതിനെ പുത്രന്റെ വ്യക്തിപരമായ പദവിയായി വ്യക്തമായി നിർവചിക്കുന്നില്ല. അതിനാൽ മൂലപദത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: ἐξ ὕδατος καὶ δι’ ὕδατος തമ്മിലുള്ള ബന്ധം നിർവചിക്കണമോ
  choice: വെള്ളത്തിൽനിന്നും വെള്ളത്തിലൂടെയും
  alternative: വെള്ളത്തിൽനിന്നും വെള്ളത്താൽ
  rationale: ആദ്യ പ്രയോഗത്തിലെ ഉറവിടവും രണ്ടാമത്തേതിലെ മാധ്യമം/വഴി എന്ന സാധ്യതയും നിലനിർത്തുന്നു; ഭൂമിയുടെ രൂപീകരണത്തിൽ വെള്ളത്തിന്റെ കൃത്യമായ പങ്കിനെക്കുറിച്ച് വാക്യം അനുവദിക്കുന്ന അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ബഹുവചനമായ ‘ആകാശങ്ങൾ’ നിലനിർത്തി. ‘ഭൂമി’ എന്നത് മലയാളത്തിൽ നിർദേശകപ്രത്യയമില്ലാതെയും സ്വാഭാവികമായി നിശ്ചിതമായ സൃഷ്ടലോകത്തെ സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേക കുറിപ്പ് ആവശ്യമില്ല. ‘വചനം’ എന്നത് സഭാപരമായ പരിചയം ഉള്ളതെങ്കിലും സാധാരണ വായനക്കാർക്കും വ്യക്തമാണ്.
