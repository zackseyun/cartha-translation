id: 2PE.3.10
reference: 2 Peter 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: ml
  text: എന്നാൽ കർത്താവിന്റെ ദിവസം കള്ളനെപ്പോലെ വരും. ആ ദിവസം ആകാശങ്ങൾ ഉഗ്രമായ ഇരമ്പലോടെ കടന്നുപോകും; ഘടകങ്ങൾ[a] കത്തിക്കൊണ്ടിരിക്കുമ്പോൾ വിഘടിപ്പിക്കപ്പെടും; ഭൂമിയും അതിലുള്ള പ്രവൃത്തികളും കണ്ടെത്തപ്പെടും[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആകാശഗോളങ്ങൾ.’ ഇവിടെ στοιχεῖα എന്ന പദം പ്രപഞ്ചത്തിന്റെ ഘടകങ്ങളെ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘കണ്ടെത്തപ്പെടും’ എന്നത് ‘വെളിപ്പെടും’ അല്ലെങ്കിൽ ‘തുറന്നുകാട്ടപ്പെടും’ എന്ന അർഥത്തിലാണെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: പല കൈയെഴുത്തുപ്രതികളിലും ‘കണ്ടെത്തപ്പെടും’ എന്നതിനു പകരം ‘കത്തിനശിക്കും’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: വരും
  rationale: ἥκω എന്ന ക്രിയയുടെ ഭാവികാലരൂപം ഇവിടെ ‘വരും/എത്തും’ എന്നാണ്; യുഗാന്ത്യസന്ദർഭത്തിൽ ‘വരും’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: ἡμέρα κυρίου
  choice: കർത്താവിന്റെ ദിവസം
  rationale: പ്രവാചക-അപ്പൊസ്തലിക പ്രയോഗത്തിലെ സ്ഥാപിതമായ യുഗാന്ത്യപദപ്രയോഗം നിലനിർത്തുന്നു; ആഴ്ചയിലെ ആരാധനാദിവസത്തെ സൂചിപ്പിക്കുന്നതായി മാറ്റുന്നില്ല.
- source_word: κλέπτης
  choice: കള്ളൻ
  rationale: ഉപമ അപ്രതീക്ഷിതമായ വരവിനെയാണ് ഊന്നുന്നത്; മലയാള ബൈബിൾശൈലിയിലും സാധാരണ ഭാഷയിലും ‘കള്ളൻ’ സ്വാഭാവികമാണ്.
- source_word: ἐν ᾗ
  choice: ആ ദിവസം
  rationale: മുൻപറഞ്ഞ ‘കർത്താവിന്റെ ദിവസം’ എന്നതിനോടു തുടർന്നുള്ള സംഭവങ്ങളെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: οἱ οὐρανοὶ
  choice: ആകാശങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും പ്രപഞ്ചവ്യാപകമായ സന്ദർഭം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ῥοιζηδόν
  choice: ചീറുന്ന മുഴക്കത്തോടെ
  rationale: വേഗത്തിൽ പാഞ്ഞുപോകുന്നതുപോലുള്ള ചീറൽ, ഇരമ്പൽ, മുഴക്കം എന്നീ ശബ്ദഭാവങ്ങൾ ഉൾക്കൊള്ളുന്ന സജീവമായ മലയാളപ്രയോഗം.
- source_word: παρελεύσονται
  choice: ഒഴിഞ്ഞുപോകും
  rationale: യുഗാന്ത്യസന്ദർഭത്തിലെ ‘കടന്നുപോകുക/ഇല്ലാതാകുക’ എന്ന അർഥഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: στοιχεῖα
  choice: മൂലഘടകങ്ങൾ
  rationale: പ്രപഞ്ചത്തിന്റെ ഘടകങ്ങളെയോ ആകാശഗോളങ്ങളെയോ സൂചിപ്പിക്കാവുന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; മുഖ്യപാഠത്തിൽ കൂടുതൽ പ്രത്യേകമായ വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: καυσούμενα
  choice: കത്തിക്കൊണ്ടിരിക്കെ
  rationale: അഴിച്ചുവിടപ്പെടുന്നതിനോടൊപ്പം നടക്കുന്ന കത്തുന്ന പ്രക്രിയയെ വ്യക്തമാക്കുന്നു; പ്രവർത്തകനെ ചേർക്കുന്നില്ല.
- source_word: λυθήσεται
  choice: അഴിഞ്ഞുപോകും
  rationale: λύω എന്നതിലെ അഴിക്കപ്പെടുക, ഘടകങ്ങളായി വേർപെടുക എന്ന ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു; പൊതുവായ ‘നശിക്കും’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: γῆ
  choice: ഭൂമി
  rationale: ആകാശങ്ങളും പ്രപഞ്ചഘടകങ്ങളും ഉൾപ്പെടുന്ന പശ്ചാത്തലത്തിൽ പ്രാദേശികമായ ‘ദേശം’ എന്നതിനു പകരം ‘ഭൂമി’ യോജിക്കുന്നു.
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: അതിലുള്ള പ്രവൃത്തികൾ
  rationale: ἔργα എന്നതിലെ പ്രവൃത്തികൾ/ചെയ്ത കാര്യങ്ങൾ എന്ന അർഥം നിലനിർത്തുന്നു; മനുഷ്യപ്രവൃത്തികളിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: εὑρεθήσεται
  choice: കണ്ടെത്തപ്പെടും
  rationale: ലഭ്യമായ SBLGNT പാഠത്തിലെ ദുഷ്കരമായ ‘കണ്ടെത്തപ്പെടും’ എന്ന നേരിട്ടുള്ള അർഥം മിനുക്കിമാറ്റാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവസാനവാക്യഭാഗമായ καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται എന്നതിന്റെ അർഥം
  choice: ‘ഭൂമിയും അതിലുള്ള പ്രവൃത്തികളും കണ്ടെത്തപ്പെടും’ എന്ന ദുഷ്കരമായ വായന മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘വെളിപ്പെടും/തുറന്നുകാട്ടപ്പെടും’; അല്ലെങ്കിൽ പാഠഭേദപ്രകാരം ‘കത്തിനശിക്കും.’
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്കുപാഠത്തിലെ εὑρεθήσεται എന്നത് ഏറ്റവും നേരിട്ട് ‘കണ്ടെത്തപ്പെടും’ എന്നാണ്. പാഠവും വ്യാഖ്യാനവും തർക്കവിധേയമായതിനാൽ ആശയത്തെ നിശ്ശബ്ദമായി ലളിതമാക്കാതെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ നൽകുന്നു.
- issue: στοιχεῖα എന്നതിന്റെ സൂചിതാർഥം
  choice: ‘മൂലഘടകങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ആകാശഗോളങ്ങൾ’ അല്ലെങ്കിൽ ‘പ്രപഞ്ചത്തിന്റെ അടിസ്ഥാനഘടകങ്ങൾ.’
  rationale: സന്ദർഭത്തിൽ ഈ പദം പ്രപഞ്ചഘടകങ്ങളെയോ കൂടുതൽ പ്രത്യേകമായി ആകാശഗോളങ്ങളെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഈ അനിശ്ചിതത്വം അതിരുകടന്ന് പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം ഗൗരവവും ദൃശ്യസാന്ദ്രതയും നിലനിർത്തി. ‘ചീറുന്ന മുഴക്കം,’ ‘അഴിഞ്ഞുപോകും’ എന്നിവ ഗ്രീക്കിലെ ശബ്ദ-വിഘടന ദൃശ്യങ്ങളെ സ്വാഭാവികമായി പകരുന്നു. ദുഷ്കരമായ അവസാനവാക്യം വ്യാഖ്യാനിച്ച് മിനുക്കാതെ മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുകയും ആവശ്യമായ ഭിന്നസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ നൽകുകയും ചെയ്തു.
