revisions:
- from: എന്നാൽ കർത്താവിന്റെ ദിവസം കള്ളനെപ്പോലെ വരും. ആ ദിവസം ആകാശങ്ങൾ ചീറുന്ന മുഴക്കത്തോടെ ഒഴിഞ്ഞുപോകും; മൂലഘടകങ്ങൾ[a] കത്തിക്കൊണ്ടിരിക്കെ അഴിഞ്ഞുപോകും; ഭൂമിയും അതിലുള്ള പ്രവൃത്തികളും കണ്ടെത്തപ്പെടും[b][c].
  to: എന്നാൽ കർത്താവിന്റെ ദിവസം കള്ളനെപ്പോലെ വരും. ആ ദിവസം ആകാശങ്ങൾ ഉഗ്രമായ ഇരമ്പലോടെ കടന്നുപോകും; ഘടകങ്ങൾ[a] കത്തിക്കൊണ്ടിരിക്കുമ്പോൾ വിഘടിപ്പിക്കപ്പെടും; ഭൂമിയും അതിലുള്ള പ്രവൃത്തികളും കണ്ടെത്തപ്പെടും[b][c].
  rationale: മൂലഗ്രീക്കിലെ കോസ്മിക ‘കടന്നുപോകൽ,’ കത്തിക്കൊണ്ടിരിക്കുന്ന ഘടകങ്ങളുടെ വിഘടനം, അവസാനത്തിലെ ദുഷ്കരവും പാഠഭേദവിധേയവുമായ ‘കണ്ടെത്തപ്പെടും’ എന്നിവ നിലനിർത്തിക്കൊണ്ട് മലയാളപ്രയോഗം കൂടുതൽ സ്വാഭാവികവും കൃത്യവുമാക്കി. അടിക്കുറിപ്പുകളിലെ പാഠഭേദവും അർഥസാധ്യതകളും മാറ്റമില്ലാതെ വ്യക്തമായി സൂക്ഷിച്ചു.
