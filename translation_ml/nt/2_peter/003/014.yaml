id: 2PE.3.14
reference: 2 Peter 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: ml
  text: അതുകൊണ്ട്, പ്രിയപ്പെട്ടവരേ, ഇവയ്ക്കായി കാത്തിരിക്കുന്ന നിങ്ങൾ, സമാധാനത്തിൽ കറയില്ലാത്തവരും കുറ്റമറ്റവരുമായി അവനാൽ കണ്ടെത്തപ്പെടാൻ[a] പരമാവധി പരിശ്രമിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ മുമ്പാകെ സമാധാനത്തിൽ കറയില്ലാത്തവരും കുറ്റമറ്റവരുമായി കണ്ടെത്തപ്പെടാൻ.’ ഗ്രീക്കിലെ ദത്തിവ് ‘അവനാൽ’ എന്ന പ്രവർത്തകാർഥത്തിലോ ‘അവന്റെ മുമ്പാകെ’ എന്ന സാന്നിധ്യ/ബന്ധാർഥത്തിലോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ കർത്താവിന്റെ ദിവസത്തെയും പുതിയ ആകാശത്തെയും പുതിയ ഭൂമിയെയും അടിസ്ഥാനമാക്കി നിഗമനം അവതരിപ്പിക്കുന്ന ബന്ധപദം.
- source_word: ἀγαπητοί
  choice: പ്രിയപ്പെട്ടവരേ
  rationale: സ്നേഹവും ലേഖനശൈലിയിലെ മാന്യമായ സംബോധനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ταῦτα προσδοκῶντες
  choice: ഇവയ്ക്കായി കാത്തിരിക്കുന്ന നിങ്ങൾ
  rationale: മുമ്പ് വിവരിച്ച ഭാവിയാഥാർഥ്യങ്ങളെ സൂചിപ്പിക്കുന്ന സർവനാമവും തുടരുന്ന പ്രതീക്ഷയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തവും സംരക്ഷിക്കുന്നു.
- source_word: σπουδάσατε
  choice: പരമാവധി പരിശ്രമിക്കുക
  rationale: തീവ്രമായ ഉത്സാഹത്തോടെയുള്ള പ്രവർത്തനത്തിന് ആഹ്വാനം ചെയ്യുന്ന ആജ്ഞയുടെ ശക്തി വ്യക്തമായി പകരുന്നു.
- source_word: ἄσπιλοι
  choice: കറയില്ലാത്തവർ
  rationale: ധാർമികശുദ്ധിയെ സൂചിപ്പിക്കുന്ന ‘കറ’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: ἀμώμητοι
  choice: കുറ്റമറ്റവർ
  rationale: ἄσπιλοι എന്നതിനോടൊപ്പം വരുന്ന ധാർമിക നിർദോഷതയുടെ ആശയം സ്വാഭാവികമായി പകരുന്നു.
- source_word: αὐτῷ εὑρεθῆναι
  choice: അവനാൽ കണ്ടെത്തപ്പെടാൻ
  rationale: ദൈവിക പരിശോധന നടത്തുന്നവനെ വാക്യത്തിൽ പേര് ചേർത്ത് വ്യക്തമാക്കാതെ, ഗ്രീക്കിലെ പരോക്ഷമായ പരാമർശവും നിഷ്ക്രിയരൂപവും നിലനിർത്തുന്നു; ദത്തിവിന്റെ മറ്റൊരു സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐν εἰρήνῃ
  choice: സമാധാനത്തിൽ
  rationale: ആന്തരികശാന്തി, ദൈവവുമായുള്ള അനുരഞ്ജിതനില, സമൂഹസമാധാനം എന്നിവയിൽ ഒന്നായി അർഥം ചുരുക്കാതെ ഗ്രീക്കിന്റെ തുറന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിൽ αὐτῷ എന്നതിന്റെ ബന്ധവും ദത്തിവിന്റെ പ്രവർത്തനവും
  choice: ‘അവനാൽ കണ്ടെത്തപ്പെടാൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി, ‘അവൻ’ ആരെന്ന് വാക്യത്തിൽ കൂടുതൽ വ്യക്തമാക്കിയിട്ടില്ല.
  alternative: ‘അവന്റെ മുമ്പാകെ കണ്ടെത്തപ്പെടാൻ’
  rationale: സന്ദർഭം ദൈവികനായ ഒരാളെ സൂചിപ്പിക്കുന്നെങ്കിലും ഈ വാക്യം ആ വ്യക്തിയെ നാമപദംകൊണ്ട് വീണ്ടും പറയുന്നില്ല. ദത്തിവ് പ്രവർത്തകനെ (‘അവനാൽ’) അല്ലെങ്കിൽ സാന്നിധ്യം/ബന്ധം (‘അവന്റെ മുമ്പാകെ’) സൂചിപ്പിക്കാം; അതിനാൽ മുഖ്യവായന തിരഞ്ഞെടുത്തിട്ടും യഥാർഥമായ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ലേഖനശൈലി. മൂലത്തിലെ നിഗമനബന്ധം, സ്നേഹപൂർവമായ സംബോധന, തുടരുന്ന പ്രതീക്ഷ, ശക്തമായ ആജ്ഞ, ധാർമികശുദ്ധിയുടെ ഇരട്ടവിവരണം, ‘സമാധാനത്തിൽ’ എന്നതിന്റെ തുറന്ന അർഥവ്യാപ്തി എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
