reference: 2 Peter 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: ml
  text: 'എന്നാൽ പ്രിയരേ, ഈ ഒരു കാര്യം നിങ്ങളുടെ ശ്രദ്ധയിൽനിന്ന് വിട്ടുപോകരുത്[a]: കർത്താവിന്റെ ദൃഷ്ടിയിൽ ഒരു ദിവസം ആയിരം വർഷംപോലെയും ആയിരം വർഷം ഒരു ദിവസംപോലെയും ആകുന്നു[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ഒരു കാര്യത്തെക്കുറിച്ച് നിങ്ങൾ അറിയാത്തവരായിരിക്കരുത്.’
    reason: lexical_alternative
  - marker: b
    text: സങ്കീർത്തനം 90:4-ന്റെ പ്രതിധ്വനി.
    reason: cross_reference
  - marker: c
    text: ‘പോലെ’ എന്ന താരതമ്യപദമാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്; ഒരു ദിവസം അക്ഷരാർഥത്തിൽ ആയിരം വർഷത്തിനു തുല്യമാണെന്ന് ഇതു പറയുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: Ἓν δὲ τοῦτο
  choice: എന്നാൽ ... ഈ ഒരു കാര്യം
  rationale: Ἓν എന്ന ഏകവചന ഊന്നലും τοῦτο എന്ന നിർദേശകഭാവവും നിലനിർത്തുന്നു; δέ സന്ദർഭത്തിലെ വിരുദ്ധതയോ തുടർച്ചയോ സ്വാഭാവികമായി ‘എന്നാൽ’ എന്നു നൽകുന്നു.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: നിങ്ങളുടെ ശ്രദ്ധയിൽപ്പെടാതെ പോകരുത്
  rationale: ‘നിങ്ങൾ അറിയാതിരിക്കരുത്’ എന്ന വ്യത്യസ്ത രൂപം സാധ്യമെങ്കിലും, λανθάνω എന്ന പദത്തിന്റെ ‘ശ്രദ്ധയിൽപ്പെടാതെ പോകുക’ എന്ന അർത്ഥവും നിരോധനാത്മക ആജ്ഞയും ഈ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀγαπητοί
  choice: പ്രിയരേ
  rationale: വിശ്വാസസമൂഹത്തോടുള്ള സ്നേഹപൂർവവും മാന്യവുമായ സംബോധന ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: παρὰ κυρίῳ
  choice: കർത്താവിന്റെ അടുക്കൽ
  rationale: παρά + ദത്തിവിന്റെ സാന്നിധ്യ/വീക്ഷണ അർത്ഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘കർത്താവിന്റെ ദൃഷ്ടിയിൽ’ എന്നത് വീക്ഷണഭാവം കൂടുതൽ വ്യക്തമാക്കുന്ന മറ്റൊരു സാധ്യതയാണ്.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: ഒരു ദിവസം ആയിരം വർഷംപോലെയും
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ നിലനിർത്തി, അക്ഷരാർഥത്തിലുള്ള സമവാക്യമെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: ആയിരം വർഷം ഒരു ദിവസംപോലെയും ആണ്
  rationale: ആദ്യ ഭാഗത്തോടുള്ള സമാന്തരതയും മറിച്ചുള്ള താരതമ്യവും മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: χίλια ἔτη
  choice: ആയിരം വർഷം
  rationale: മൂലത്തിലെ സാധാരണ സംഖ്യാവാചക പ്രയോഗം വ്യാഖ്യാനപരമായ വികസനം കൂടാതെ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: കാലസംബന്ധിയായ താരതമ്യത്തിന്റെ സ്വഭാവം
  choice: കർത്താവിനോടുള്ള സമയബന്ധത്തെക്കുറിച്ചുള്ള ഉപമയായി വിവർത്തനം ചെയ്യുക; ഒരു ദിവസവും ആയിരം വർഷവും അക്ഷരാർഥത്തിൽ തുല്യമാണെന്നോ പ്രവചനകാലം കണക്കാക്കാനുള്ള സൂത്രമാണെന്നോ അവതരിപ്പിക്കാതിരിക്കുക.
  alternative: ഒരു ദിവസം അക്ഷരാർഥത്തിൽ ആയിരം വർഷത്തിനു തുല്യമാണെന്നോ ഇത് അന്ത്യകാല കണക്കുകൂട്ടലിനുള്ള പരിവർത്തനസൂത്രമാണെന്നോ വായിക്കുക.
  rationale: രണ്ടിടത്തുമുള്ള ὡς (‘പോലെ’) താരതമ്യമാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ പ്രത്യേക കാലക്രമസിദ്ധാന്തം പാഠത്തിലേക്ക് ചേർക്കാതെ മൂലത്തിലെ ഉപമയും ദൈവ-കാലബന്ധത്തിലെ ആശയഗൗരവവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ശൈലി. ‘പ്രിയരേ’ സഭാസമൂഹത്തോടുള്ള സ്നേഹപൂർവ സംബോധന നിലനിർത്തുന്നു. ‘കർത്താവിന്റെ അടുക്കൽ’ മൂലത്തിലെ സാന്നിധ്യ/വീക്ഷണ ഭാവം തുറന്ന നിലയിൽ വയ്ക്കുന്നു; ‘വർഷംപോലെയും ... ദിവസംപോലെയും’ എന്ന സമാന്തരഘടന ഉപമയെ വ്യക്തമായി കേൾപ്പിക്കുന്നു.
