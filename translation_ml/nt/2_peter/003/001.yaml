id: 2PE.3.1
reference: 2 Peter 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: ml
  text: പ്രിയപ്പെട്ടവരേ, ഇത് ഞാൻ നിങ്ങൾക്കു ഇപ്പോൾ എഴുതുന്ന രണ്ടാമത്തെ ലേഖനമാണ്. ഈ രണ്ടു ലേഖനങ്ങളിലും[a] ഓർമിപ്പിച്ചുകൊണ്ട് നിങ്ങളുടെ നിർമലമായ മനസ്സിനെ[b] ഞാൻ ഉണർത്തുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “അവയിൽ”; ഗ്രീക്കിൽ ഇത് ബഹുവചനമായതിനാൽ രണ്ടു ലേഖനങ്ങളെയും സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ “നിങ്ങളുടെ ആത്മാർഥമായ മനസ്സിനെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: പ്രിയപ്പെട്ടവരേ
  rationale: സംബോധനയുടെ സ്നേഹപൂർവമായ ഭാവവും ലേഖനശൈലിയുടെ ഗൗരവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: ഞാൻ ഇപ്പോൾ നിങ്ങൾക്ക് എഴുതുന്നത് രണ്ടാമത്തെ ലേഖനമാണ്
  rationale: ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിൽ പുനഃക്രമീകരിക്കുന്നു; ἤδη എന്നതിനെ സന്ദർഭോചിതമായി ‘ഇപ്പോൾ’ എന്നു നൽകുന്നു.
- source_word: γράφω
  choice: എഴുതുന്നത്
  rationale: ലേഖനം എഴുതിക്കൊണ്ടിരിക്കുന്ന ഇപ്പോഴത്തെ പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐν αἷς
  choice: ഈ രണ്ടു ലേഖനങ്ങളിലും
  rationale: സ്ത്രീലിംഗ ബഹുവചനത്തിലുള്ള ബന്ധസർവനാമം മുമ്പു സൂചിപ്പിച്ച രണ്ടു ലേഖനങ്ങളെയും സ്വാഭാവികമായി പരാമർശിക്കുന്നു.
- source_word: διεγείρω
  choice: ഞാൻ ഉണർത്തുന്നു
  rationale: ശ്രദ്ധയെയും ചിന്തയെയും വീണ്ടും സജീവമാക്കുക എന്ന രൂപകാലങ്കാരപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν ὑπομνήσει
  choice: ഓർമിപ്പിക്കുന്നതിലൂടെ
  rationale: ഓർമപ്പെടുത്തൽ തന്നെയാണ് മനസ്സിനെ ഉണർത്തുന്ന മാർഗം എന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰλικρινῆ διάνοιαν
  choice: ആത്മാർഥമായ മനസ്സിനെ
  rationale: εἰλικρινής എന്നതിലെ കാപട്യമില്ലായ്മ/നിർമലതയും διάνοια എന്നതിലെ മനസ്സ്, ചിന്താശക്തി എന്നീ ആശയങ്ങളും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: διάνοιαν എന്ന നാമത്തോടുള്ള ഉടമസ്ഥബന്ധം സാധാരണ മലയാള പ്രയോഗത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἐν αἷς എന്ന ബഹുവചന ബന്ധസർവനാമത്തിന്റെ സൂചന
  choice: പത്രോസ് സ്വീകർത്താക്കൾക്ക് എഴുതിയ രണ്ടു ലേഖനങ്ങളെയും സൂചിപ്പിക്കുന്നു.
  alternative: അയഞ്ഞ ബഹുവചനപ്രയോഗമായി ഇപ്പോഴത്തെ ലേഖനത്തെ മാത്രം സൂചിപ്പിക്കുന്നു.
  rationale: ബഹുവചന ബന്ധസർവനാമം ഏറ്റവും സ്വാഭാവികമായി തൊട്ടുമുമ്പ് പരാമർശിച്ച രണ്ടു ലേഖനങ്ങളിലേക്കാണ് തിരിഞ്ഞുനിൽക്കുന്നത്; അതിനാൽ വ്യാഖ്യാനപരമായ അധിക അവകാശവാദമില്ലാതെ വ്യാകരണപരമായ നേരായ അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ലേഖനശൈലി സ്വീകരിച്ചു. ‘പ്രിയപ്പെട്ടവരേ’ എന്നത് സ്നേഹപൂർവമായ സംബോധന നിലനിർത്തുന്നു; ‘ഉണർത്തുന്നു’ എന്നത് മൂലത്തിലെ രൂപകാലങ്കാരം സംരക്ഷിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-യിലെ തെറ്റായി സ്ഥാനപ്പെടുത്തിയതായി തോന്നുന്ന അടിക്കുറിപ്പ് ചിഹ്നം തിരുത്തി, ബഹുവചനബന്ധസർവനാമത്തെക്കുറിച്ചുള്ള [a] ‘ഈ രണ്ടു ലേഖനങ്ങളിലും’ എന്നതിനു ശേഷവും പദാർഥവികല്പമായ [b] ‘മനസ്സിനെ’ എന്നതിനു ശേഷവും ചേർത്തു.
