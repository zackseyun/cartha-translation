id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: ml
  text: എന്നാൽ നമ്മുടെ കർത്താവും രക്ഷകനുമായ യേശു മശീഹയുടെ കൃപയിലും പരിജ്ഞാനത്തിലും വളരുക. അവനു ഇപ്പോഴും നിത്യതയുടെ നാൾവരെയും മഹത്ത്വം ഉണ്ടായിരിക്കട്ടെ.[a] ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ സ്വാഭാവികമായ കാലപ്രയോഗമായി: “അവനു ഇപ്പോഴും എന്നേക്കും മഹത്ത്വം ഉണ്ടായിരിക്കട്ടെ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്തത് “ഇപ്പോഴും നിത്യതയുടെ നാൾവരെയും” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: വളരുക
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞയുടെ തുടർച്ചയായ വളർച്ച എന്ന ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ മുന്നറിയിപ്പിനോടുള്ള മൃദുവായ വൈരുധ്യവും പുതിയ പ്രബോധനത്തിലേക്കുള്ള മാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: കൃപയിലും പരിജ്ഞാനത്തിലും
  rationale: ἐν രണ്ടു നാമങ്ങളെയും നിയന്ത്രിക്കുന്നതും വളർച്ചയുടെ മേഖലകളെ സൂചിപ്പിക്കുന്നതും മലയാളത്തിലെ സമാന്തര വിഭക്തിരൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: χάριτι
  choice: കൃപ
  rationale: പുതിയനിയമത്തിലെ സ്ഥാപിതവും ഇവിടെ യോജിച്ചതുമായ ദൈവശാസ്ത്രപദം.
- source_word: γνώσει
  choice: പരിജ്ഞാനം
  rationale: വെറും വിവരമോ ബൗദ്ധിക അറിവോ എന്നതിലുപരി വ്യക്തിയെ സംബന്ധിച്ച അറിവ് സൂചിപ്പിക്കാൻ ‘പരിജ്ഞാനം’ യോജിക്കുന്നു; എങ്കിലും മൂലത്തിലെ ‘knowledge’ എന്ന ആശയപരിധി കവിയുന്നില്ല.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: നമ്മുടെ കർത്താവും രക്ഷകനുമായ യേശു മശീഹയുടെ
  rationale: ഒറ്റ നിർദേശകപദം κύριος, σωτήρ എന്നീ രണ്ടു വിശേഷണങ്ങളെയും ഒരേ വ്യക്തിയായ യേശുവിനോട് ബന്ധിപ്പിക്കുന്നു. Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: αὐτῷ ἡ δόξα
  choice: അവനു ... മഹത്ത്വം ഉണ്ടായിരിക്കട്ടെ
  rationale: ക്രിയ വ്യക്തമാക്കിയിട്ടില്ലാത്ത ഗ്രീക്ക് സ്തുതിവാക്യം മലയാളത്തിൽ സ്വാഭാവികവും ആദരപൂർവവുമായ ആശംസാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: ഇപ്പോഴും നിത്യതയുടെ നാൾവരെയും
  rationale: καὶ...καὶ എന്ന ബന്ധവും അസാധാരണമായ ‘നിത്യതയുടെ നാൾ’ എന്ന മൂലപ്രയോഗവും ചുരുക്കി ‘എന്നേക്കും’ എന്നു സമതലപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστοῦ-ന്റെ വിവർത്തനം
  choice: യേശു മശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരിന്റെ ശക്തി വഹിക്കുന്നതിനാൽ അതിന്റെ അർഥം നൽകുന്ന ‘മശീഹ’ സ്വീകരിച്ചു; പതിവായ ലിപ്യന്തരണത്തെ മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവന്നില്ല.
- issue: ‘നമ്മുടെ കർത്താവും രക്ഷകനും’ എന്നതിന്റെ വ്യക്തിസൂചന
  choice: രണ്ടു സ്ഥാനപ്പേരുകളും ഒരേ വ്യക്തിയായ യേശു മശീഹയെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘കർത്താവും രക്ഷകനുമായ’ എന്നു നൽകി
  alternative: രണ്ടു വേറിട്ട സൂചനകളാകാമെന്ന മങ്ങിയ ഘടന
  rationale: ഒറ്റ ഗ്രീക്ക് നിർദേശകപദം κύριος, σωτήρ എന്നിവയെ ഒരേ വ്യക്തിയുമായി ബന്ധിപ്പിക്കുന്നതിനെ മലയാള വ്യാകരണം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- issue: εἰς ἡμέραν αἰῶνος എന്ന അസാധാരണ കാലപ്രയോഗം
  choice: നിത്യതയുടെ നാൾവരെയും
  alternative: എന്നേക്കും
  rationale: ‘നാൾ’ എന്ന മൂലരൂപവും അതിലെ ദൈവശാസ്ത്രപരമായ/കാലപരമായ തുറന്ന ഭാവവും സംരക്ഷിക്കുന്നു; ‘എന്നേക്കും’ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ലളിതീകരണമാണ്.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘മശീഹ’, ‘കൃപ’, ‘മഹത്ത്വം’, ‘ആമേൻ’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി രൂപപ്പെടുത്തി. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പ് അസാധാരണമായ ഗ്രീക്ക് കാലപ്രയോഗത്തിനുള്ള സ്വാഭാവിക മലയാള പര്യായം നൽകുന്നു.
