id: 2PE.2.3
reference: 2 Peter 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: ml
  text: അത്യാഗ്രഹത്തോടെ അവർ കെട്ടിച്ചമച്ച വാക്കുകളാൽ നിങ്ങളെ ചൂഷണം ചെയ്യും. പണ്ടുമുതലേ അവർക്കായുള്ള ന്യായവിധി നിഷ്ക്രിയമല്ല[a]; അവരുടെ നാശം ഉറങ്ങുന്നുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ നിങ്ങളെ ചരക്കുപോലെ ഉപയോഗിച്ച് ലാഭം നേടും”—ആളുകളിൽനിന്ന് ലാഭം നേടുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു വാണിജ്യരൂപകമാണ് ഗ്രീക്കിലുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: അത്യാഗ്രഹത്തോടെ
  rationale: തെറ്റായ ഉപദേഷ്ടാക്കളുടെ പ്രവൃത്തിക്കു പ്രേരകമായ അതിരുകടന്ന ലാഭമോഹം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πλαστοῖς λόγοις
  choice: കെട്ടിച്ചമച്ച വാക്കുകൾകൊണ്ട്
  rationale: πλαστός എന്നതിലെ രൂപപ്പെടുത്തിയതോ കൃത്രിമമായി നിർമിച്ചതോ എന്ന ഭാവം നിലനിർത്തി, വെറും അസത്യത്തേക്കാൾ മനഃപൂർവം ചമച്ച പ്രസ്താവനകളെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐμπορεύσονται
  choice: നിങ്ങളെ ചൂഷണം ചെയ്യും
  rationale: മനുഷ്യരെ ലാഭത്തിനുള്ള ചരക്കുപോലെ ഉപയോഗിക്കുന്ന വാണിജ്യരൂപകം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി പകരുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: κρίμα
  choice: ന്യായവിധി
  rationale: വിധിയോ ശിക്ഷാവിധിയോ എന്ന നിയമപരമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ശിക്ഷയുടെ സ്വഭാവം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: ἔκπαλαι
  choice: പണ്ടുമുതലേയുള്ള
  rationale: വിധി വളരെ മുമ്പേ നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്നുവെന്ന കാലസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐκ ἀργεῖ
  choice: നിഷ്ക്രിയമായിരിക്കുന്നില്ല
  rationale: ἀργέω എന്നതിലെ പ്രവർത്തനരഹിതമാകുക എന്ന ആശയം സംരക്ഷിക്കുന്നു; വെറും താമസം എന്ന കാലപരമായ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἀπώλεια
  choice: നാശം
  rationale: നാശമോ വിനാശമോ എന്ന പൊതുവായ അർഥം വ്യക്തമായി നൽകുന്നു; അതിന്റെ രീതി അല്ലെങ്കിൽ അന്തിമസ്വഭാവം നിർണ്ണയിക്കുന്നില്ല.
- source_word: οὐ νυστάζει
  choice: ഉറങ്ങുന്നുമില്ല
  rationale: വരാനിരിക്കുന്ന നാശത്തെ ഉറങ്ങാത്ത ഒന്നായി വ്യക്തിവൽക്കരിക്കുന്ന ഗ്രീക്ക് ദൃശ്യഭാഷ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രഖ്യാപിക്കപ്പെട്ട ശിക്ഷയുടെ സ്വഭാവം
  choice: വരാനിരിക്കുന്ന ദൈവിക ന്യായവിധിയും നാശവും എന്ന നിലയിൽ ഭാഷയെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  alternative: ‘നാശം’ എന്നത് സമ്പൂർണ അസ്തിത്വനാശമായോ അന്തിമവിധിയില്ലാത്ത തകർച്ചയായോ പ്രത്യേകം വ്യാഖ്യാനിക്കുക
  rationale: വാക്യം തെറ്റായ ഉപദേഷ്ടാക്കളുടെ വിധി ഉറപ്പാണെന്ന് പ്രഖ്യാപിക്കുന്നു; എന്നാൽ ആ ശിക്ഷയുടെ രീതി, ദൈർഘ്യം, അന്തിമസ്വഭാവം എന്നിവ നിർവചിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ മുന്നറിയിപ്പ് നിലനിർത്തിക്കൊണ്ട് പ്രത്യേക സിദ്ധാന്തനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ന്യായവിധി നിഷ്ക്രിയമായിരിക്കുന്നില്ല’, ‘നാശം ഉറങ്ങുന്നുമില്ല’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിലെ സമാന്തരതയും വ്യക്തിവൽക്കരണവും സംരക്ഷിക്കുന്നു.
