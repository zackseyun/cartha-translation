source:
  edition: SBLGNT
  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: ml
  text: എന്നാൽ, ശക്തിയിലും പ്രാബല്യത്തിലും വലിയവരായിട്ടും ദൂതന്മാർ അവർക്കെതിരെ നിന്ദാപരമായ ഒരു വിധി ഉന്നയിക്കുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്ദാപരമായ ഒരു വിധി’ എന്നതിന് ‘ദൂഷണപരമായ ഒരു വിധി’ എന്നോ ‘അധിക്ഷേപകരമായ ഒരു വിധി’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് വിശേഷണം നിന്ദാപരമോ അധിക്ഷേപകരമോ അപകീർത്തികരമോ ആയ സംസാരത്തെ സൂചിപ്പിക്കാം. ‘അവർ’ എന്നത് മുൻവാക്യത്തിലെ ‘മഹത്ത്വമുള്ളവരെ’ സൂചിപ്പിക്കാനാണ് സാധ്യത; എന്നാൽ പത്രോസ് ഇവിടെ അവരെ കൂടുതൽ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല.
    reason: lexical_alternative_and_ambiguous_referent
lexical_decisions:
- source_word: ὅπου
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യം ഇവിടെ പ്രധാനമായതിനാൽ, കർശനമായ സ്ഥലസൂചനയ്ക്കുപകരം സ്വാഭാവികമായ വൈരുധ്യബന്ധകം ഉപയോഗിച്ചു.
- source_word: ἄγγελοι
  choice: ദൂതന്മാർ
  rationale: സന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരല്ല, സ്വർഗീയ ദൂതന്മാരാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: ശക്തിയിലും പ്രാബല്യത്തിലും
  rationale: അടുത്ത അർത്ഥമുള്ള രണ്ടു ഗ്രീക്ക് പദങ്ങളുടെയും ഊന്നൽ നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: μείζονες ὄντες
  choice: വലിയവരായിട്ടും
  rationale: കർത്തൃവാചകത്തിന്റെ സന്ദർഭജന്യമായ concessive അർത്ഥം—അവർ വലിയവരായിട്ടും അങ്ങനെ ചെയ്യുന്നില്ല—വ്യക്തമാക്കുന്നു.
- source_word: οὐ φέρουσιν
  choice: കൊണ്ടുവരുന്നില്ല
  rationale: വിധി ഉന്നയിക്കുക അഥവാ മുന്നോട്ടുവയ്ക്കുക എന്ന നിയമപരമായ ഭാവം ഗ്രീക്ക് പ്രയോഗത്തോട് അടുത്തായി നിലനിർത്തുന്നു.
- source_word: κατ’ αὐτῶν
  choice: അവർക്കെതിരെ
  rationale: സർവനാമത്തിന്റെ വ്യക്തമായി പറയാത്ത പൂർവപദം അതേപടി സൂക്ഷിക്കുന്നു; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മുഖ്യപാഠത്തിൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: βλάσφημον
  choice: നിന്ദാപരമായ
  rationale: ദൈവദൂഷണം എന്ന പരിമിത അർത്ഥത്തിലേക്ക് ചുരുക്കാതെ അധിക്ഷേപകരമോ അപകീർത്തികരമോ ആയ സംസാരത്തിന്റെ വിശാല അർത്ഥം നൽകുന്നു.
- source_word: κρίσιν
  choice: വിധി
  rationale: ന്യായപരമായ വിലയിരുത്തലോ വിധിപ്രസ്താവമോ എന്ന വിശാല അർത്ഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: κατ’ αὐτῶν എന്നതിലെ αὐτῶν ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യപാഠത്തിൽ ‘അവർ’ എന്ന സർവനാമം നിലനിർത്തി.
  alternative: വീണുപോയ ദൂതന്മാർ; മനുഷ്യ അധികാരികൾ; മഹത്ത്വമുള്ള സ്വർഗീയ ജീവികൾ
  rationale: ഈ വാക്യം പൂർവപദത്തെ കൂടുതൽ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല. ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കാതെ ഗ്രീക്കിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ വൈരുധ്യം, ഇരട്ട ശക്തിപദം, സർവനാമത്തിന്റെ അവ്യക്തത എന്നിവ നിലനിർത്തി.
