revisions:
- from: എന്നാൽ ദൂതന്മാർ ശക്തിയിലും പ്രാബല്യത്തിലും അവരെക്കാൾ വലിയവരായിട്ടും, അവർക്കെതിരെ നിന്ദാപരമായ ഒരു വിധി കൊണ്ടുവരുന്നില്ല.[a]
  to: എന്നാൽ, ശക്തിയിലും പ്രാബല്യത്തിലും വലിയവരായിട്ടും ദൂതന്മാർ അവർക്കെതിരെ നിന്ദാപരമായ ഒരു വിധി ഉന്നയിക്കുന്നില്ല.[a]
