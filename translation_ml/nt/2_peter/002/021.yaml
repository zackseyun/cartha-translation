id: 2PE.2.21
reference: 2 Peter 2:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: ml
  text: എന്തെന്നാൽ, നീതിയുടെ വഴി[a] അറിഞ്ഞശേഷം തങ്ങൾക്കു നൽകപ്പെട്ട[c] വിശുദ്ധ കല്പനയിൽനിന്ന് പിന്തിരിയുന്നതിനെക്കാൾ[b], ആ വഴി അറിയാതിരുന്നതായിരുന്നു അവർക്ക് നല്ലത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നീതിയുടെ പാത’; δικαιοσύνη എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ന്യായം’ എന്നും അർഥമാകാം, എന്നാൽ ഇവിടെ ധാർമികമായ ശരിയായ ജീവിതമാർഗമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തിരികെപ്പോകുക’ അല്ലെങ്കിൽ ‘വിട്ടുമാറുക.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘കൈമാറപ്പെട്ട.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον ... ἦν
  choice: നല്ലതായിരുന്നു
  rationale: താരതമ്യവും സന്ദർഭത്തിലെ സംഭവിക്കാതെപോയ ഭൂതകാലസാധ്യതയും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: അറിയാതിരുന്നതായിരുന്നു / അറിഞ്ഞശേഷം
  rationale: ഒരേ ക്രിയയുടെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തുകയും, മൂലപാഠം ആവശ്യപ്പെടുന്നതിലധികമായി ‘പൂർണമായി അറിഞ്ഞു’ എന്ന ആശയം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: നീതിയുടെ വഴി
  rationale: ὁδός ഇവിടെ ജീവിതരീതിയെയോ മാർഗത്തെയോ സൂചിപ്പിക്കുന്ന രൂപകമാണ്; δικαιοσύνη ഈ ധാർമിക സന്ദർഭത്തിൽ ‘നീതി’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: ὑποστρέψαι ἐκ
  choice: നിന്ന് പിന്തിരിയുക
  rationale: മുമ്പ് അറിഞ്ഞതിൽനിന്നുള്ള പിന്നോട്ടുള്ള തിരിവും വേർപാടും രണ്ടും വ്യക്തമാക്കുന്നു.
- source_word: παραδοθείσης
  choice: നൽകപ്പെട്ട
  rationale: അവർക്കു ലഭ്യമാക്കിയതോ എത്തിച്ചുകൊടുത്തതോ എന്ന നിഷ്ക്രിയ അർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; പ്രത്യേകമായ പരമ്പരാഗത കൈമാറ്റസിദ്ധാന്തം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: ἁγίας ἐντολῆς
  choice: വിശുദ്ധ കല്പന
  rationale: ഏകവചനവും മതധാർമിക ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിന് ഈ വാക്യം നൽകുന്ന വിശദീകരണപരമായ കാരണബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഈ വാക്യം വിശ്വാസത്യാഗമാണോ വെറും ബാഹ്യപരിചയമാണോ എന്ന് പരിഭാഷയിൽ തീർപ്പാക്കണമോ
  choice: യഥാർഥമായ അറിവും അതിനുശേഷമുള്ള പിന്തിരിയലും മൂലപാഠം പറയുന്നതുപോലെ നേരിട്ട് പ്രസ്താവിക്കുന്നു.
  alternative: രക്ഷ നഷ്ടപ്പെട്ടു എന്ന് കൂടുതൽ ശക്തമായി സൂചിപ്പിക്കുക, അല്ലെങ്കിൽ വിശ്വാസവുമായി ഉപരിപ്ലവമായ പരിചയം മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ എന്ന് ദുർബലപ്പെടുത്തുക.
  rationale: ἐπιγινώσκω കൊണ്ടുള്ള അറിവും ὑποστρέφω കൊണ്ടുള്ള തിരിച്ചുപോക്കും വ്യക്തമാണ്; എന്നാൽ സ്ഥിരതയെയോ വിശ്വാസത്യാഗത്തെയോ സംബന്ധിച്ച സഭാവിഭാഗീയ നിഗമനം മൂലപാഠം ഇവിടെ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് താരതമ്യഘടന വായനാസൗകര്യത്തിനായി മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ ക്രമീകരിച്ചിരിക്കുന്നു; ‘ആ വഴി’ എന്ന ആവർത്തനം താരതമ്യത്തിലെ വിഷയം വ്യക്തമാക്കുന്നു.
