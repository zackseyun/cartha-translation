reference: 2 Peter 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: ml
  text: അനേകർ അവരുടെ അഴിഞ്ഞാട്ടങ്ങളെ[a] പിന്തുടരും; അവരാൽ സത്യത്തിന്റെ വഴി[b] നിന്ദിക്കപ്പെടും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദുർന്നടപ്പുകളെ,” “നിയന്ത്രണമില്ലാത്ത നിർലജ്ജമായ പെരുമാറ്റങ്ങളെ.” ഗ്രീക്കുപദം പലപ്പോഴും ലൈംഗിക സൂചനകളുള്ള, ലജ്ജയില്ലാത്തതും നിയന്ത്രണമറ്റതുമായ പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ പ്രയോഗം സത്യത്തോടൊത്ത ക്രൈസ്തവ വിശ്വാസത്തെയും ജീവിതരീതിയെയും സൂചിപ്പിക്കുന്നതാകാം.
    reason: interpretive_clarification
  - marker: c
    text: അഥവാ “ദൂഷിക്കപ്പെടും,” “അപകീർത്തിപ്പെടുത്തപ്പെടും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: അനേകർ
  rationale: വലിയൊരു എണ്ണത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐξακολουθήσουσιν
  choice: പിന്തുടരും
  rationale: മറ്റൊരാളുടെ വഴിയോ പെരുമാറ്റരീതിയോ അനുഗമിക്കുക എന്ന ക്രിയയുടെ ഭാവികാലബലം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: സന്ദർഭത്തിലെ വ്യാജോപദേഷ്ടാക്കളിലേക്കുള്ള ബഹുവചന സർവനാമസൂചന സ്വാഭാവികമായി അടുത്ത നാമപദവുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ταῖς ἀσελγείαις
  choice: ലജ്ജയില്ലാത്ത ദുഷ്പ്രവൃത്തികളെ
  rationale: ἀσέλγεια സൂചിപ്പിക്കുന്ന നിർലജ്ജവും നിയന്ത്രണമില്ലാത്തതുമായ ധാർമിക പെരുമാറ്റം വ്യക്തമാക്കുന്നു; ലൈംഗിക അതിക്രമസൂചന മാത്രം ആക്കി അർഥം ചുരുക്കുന്നില്ല. ഗ്രീക്കിലെ ബഹുവചനവും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: δι’ οὓς
  choice: അവർ നിമിത്തം
  rationale: διά + accusative-ന്റെ കാരണാർഥം നിലനിർത്തുകയും മുൻപറഞ്ഞ ആളുകളെ വ്യക്തമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: സത്യത്തിന്റെ വഴി
  rationale: ഗ്രീക്കിലെ genitive ഘടനയും 'വഴി' എന്ന ആദിമക്രൈസ്തവ രൂപകവും സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: βλασφημηθήσεται
  choice: ദുഷിക്കപ്പെടും
  rationale: അപകീർത്തികരമായോ നിന്ദാപരമായോ സംസാരിക്കപ്പെടുക എന്ന passive അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഇവിടെ കർമം ദൈവമല്ല, 'സത്യത്തിന്റെ വഴി' ആയതിനാൽ 'ദൈവദൂഷണം ചെയ്യപ്പെടും' എന്ന അതിസങ്കുചിത പ്രയോഗം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: '''സത്യത്തിന്റെ വഴി'' എന്ന പ്രയോഗത്തിന്റെ സൂചന'
  choice: ക്രൈസ്തവ വിശ്വാസത്തെയും അതിനൊത്ത ജീവിതരീതിയെയും സൂചിപ്പിക്കാവുന്ന രൂപകം നിലനിർത്തി 'സത്യത്തിന്റെ വഴി' എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: '''സത്യമാർഗം'' അല്ലെങ്കിൽ ''യഥാർഥമായ വഴി'''
  rationale: മൂലത്തിലെ 'വഴി' രൂപകവും genitive ബന്ധവും നിലനിർത്തുന്നു; അതിനെ ഒരു പ്രത്യേക സഭാപരമായ സാങ്കേതികപദമോ വെറും സിദ്ധാന്തപ്രസ്താവനയോ ആക്കി ചുരുക്കുന്നില്ല.
- issue: ἀσέλγεια എന്ന പദത്തിന്റെ ധാർമിക വ്യാപ്തി
  choice: ലൈംഗിക സൂചന ഉൾക്കൊള്ളാവുന്നതും അതിൽ മാത്രം ഒതുങ്ങാത്തതുമായ 'ലജ്ജയില്ലാത്ത ദുഷ്പ്രവൃത്തികൾ' എന്നു നൽകി.
  alternative: '''കാമാസക്തി,'' ''ദുർന്നടപ്പ്,'' അല്ലെങ്കിൽ ''അഴിഞ്ഞാട്ടം'''
  rationale: പദം നിർലജ്ജവും നിയന്ത്രണമില്ലാത്തതുമായ പെരുമാറ്റത്തെ വ്യാപകമായി സൂചിപ്പിക്കാം. പരിഭാഷ അതിന്റെ ലൈംഗിക അതിസ്വാതന്ത്ര്യസൂചന ഇല്ലാതാക്കാതെയും അർഥം അതിലേക്കു മാത്രം ചുരുക്കാതെയും വയ്ക്കുന്നു.
- issue: βλασφημέω എന്നതിന്റെ ശക്തി
  choice: '''ദുഷിക്കപ്പെടും'' എന്ന പൊതുവായ അപകീർത്തി/നിന്ദാഭാഷയുടെ അർഥം സ്വീകരിച്ചു.'
  alternative: '''നിന്ദിക്കപ്പെടും,'' ''ദൂഷിക്കപ്പെടും,'' അല്ലെങ്കിൽ ''ദൈവദൂഷണത്തിന് ഇരയാകും'''
  rationale: സത്യത്തിന്റെ വഴിക്കെതിരെ അപകീർത്തികരമായി സംസാരിക്കപ്പെടും എന്ന ഗൗരവം സൂക്ഷിക്കുന്നു; ദൈവത്തെ നേരിട്ട് ദൂഷിക്കുന്നതെന്ന അർഥം അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. 'അനേകർ,' 'സത്യത്തിന്റെ വഴി' എന്നീ രൂപങ്ങൾ മൂലത്തിന്റെ ഭാരം നിലനിർത്തുന്നു. പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ക്രമപ്പെടുത്തി; എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
