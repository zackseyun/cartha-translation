reference: 2 Peter 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: ml
  text: 'എന്നാൽ അവന്റെ സ്വന്തം നിയമലംഘനത്തിന് അവന് ശാസന ലഭിച്ചു: മനുഷ്യശബ്ദത്തിൽ സംസാരിച്ച സംസാരശേഷിയില്ലാത്ത ഒരു ചുമട്ടുമൃഗം[a] പ്രവാചകന്റെ ഭ്രാന്തിനെ തടഞ്ഞു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ചുമട്ടുമൃഗം’; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ബിലെയാമിന്റെ കഴുതയാണ് (സംഖ്യ 22:28–30).
    reason: cross_reference
  - marker: b
    text: അഥവാ ‘ഒരു മനുഷ്യന്റെ ശബ്ദത്തിൽ.’ മൃഗത്തിന്റെ സംസാരശേഷിയില്ലായ്മയും മനുഷ്യശബ്ദവും തമ്മിലുള്ള വൈരുധ്യമാണ് ഗ്രീക്കിൽ പ്രധാനമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: ശാസന
  rationale: കുറ്റം ചൂണ്ടിക്കാട്ടി തിരുത്തുന്ന ശാസന എന്ന അർഥം സ്വാഭാവികവും സന്ദർഭോചിതവുമായി നൽകുന്നു.
- source_word: ἰδίας παρανομίας
  choice: തന്റെ സ്വന്തം നിയമലംഘനത്തിന്
  rationale: παρανομίαയിലെ നിയമവിരുദ്ധതയുടെ ശക്തിയും ἰδίας നൽകുന്ന വ്യക്തിപരമായ ഉത്തരവാദിത്വത്തിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ὑποζύγιον
  choice: ചുമട്ടുമൃഗം
  rationale: മൂലപദത്തിലെ പൊതുവായ ‘ഭാരം വഹിക്കുന്ന മൃഗം’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ കഴുതയെ മുഖ്യവാചകത്തിൽ അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: ἄφωνον
  choice: സംസാരശേഷിയില്ലാത്ത
  rationale: ശബ്ദം ഒട്ടും പുറപ്പെടുവിക്കാനാകാത്തത് എന്നതിലുപരി സംസാരമില്ലാത്തത് എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുകയും തുടർന്നുള്ള അത്ഭുതകരമായ സംസാരവുമായി വിരോധാഭാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: മനുഷ്യശബ്ദത്തിൽ
  rationale: മൃഗത്തിന്റെയും മനുഷ്യന്റെയും ശബ്ദത്തെ തമ്മിൽ വേർതിരിക്കുന്ന പ്രയോഗം ലിംഗവിശേഷമില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: φθεγξάμενον
  choice: സംസാരിച്ചു
  rationale: വ്യക്തമായ വാക്കുകൾ ഉച്ചരിച്ചതാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: ἐκώλυσεν
  choice: തടഞ്ഞു
  rationale: κωλύωയുടെ തടയുക/നിയന്ത്രിക്കുക എന്ന ശക്തമായ അർഥം സന്ദർഭത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: παραφρονίαν
  choice: ഭ്രാന്തിനെ
  rationale: വെറും മൂഢതയെക്കാൾ ശക്തമായ യുക്തിരഹിതാവസ്ഥയെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: τοῦ προφήτου
  choice: പ്രവാചകന്റെ
  rationale: ജനിറ്റീവ് ബന്ധം സ്വാഭാവികമായി നൽകുകയും ബിലെയാമിനെ മൂലവാചകത്തിലുള്ള പദവിയാൽ തന്നെ പരാമർശിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ὑποζύγιον എന്നത് ബിലെയാമിന്റെ കഴുതയായി മുഖ്യവാചകത്തിൽ പ്രത്യേകീകരിക്കണമോ
  choice: മുഖ്യവാചകത്തിൽ പൊതുവായ ‘ചുമട്ടുമൃഗം’ നിലനിർത്തി, അടിക്കുറിപ്പിൽ കഴുതയെന്ന് വ്യക്തമാക്കുന്നു.
  alternative: കഴുത
  rationale: സംഖ്യാപുസ്തകം 22-ലേക്കുള്ള സൂചന വ്യക്തമായിരിക്കുമ്പോഴും ഗ്രീക്ക് പദം പൊതുവായതാണ്; അതിനാൽ മൂലഭാഷയുടെ വ്യാപ്തി മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐν ἀνθρώπου φωνῇയിലെ ἀνθρώπου എങ്ങനെ വിവർത്തനം ചെയ്യണം
  choice: മനുഷ്യശബ്ദത്തിൽ
  alternative: ഒരു പുരുഷന്റെ ശബ്ദത്തിൽ
  rationale: ഇവിടെ വൈരുധ്യം മൃഗവും മനുഷ്യനും തമ്മിലാണ്, പുരുഷനും സ്ത്രീയും തമ്മിലല്ല; അതിനാൽ ‘മനുഷ്യ’ എന്നാണ് അർഥസൂക്ഷ്മമായി യോജിക്കുന്നത്.
- issue: παραφρονίαν എന്ന പദത്തിന്റെ തീവ്രത
  choice: ഭ്രാന്ത്
  alternative: മൂഢത
  rationale: മൂലപദത്തിലെ ശക്തമായ യുക്തിരാഹിത്യവും വഴിതെറ്റിയ ആവേശവും മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു; വൈദ്യശാസ്ത്രപരമായ നിർണയം ഉദ്ദേശിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിയമലംഘനം,’ ‘ശാസന,’ ‘ഭ്രാന്ത്’ എന്നീ പദങ്ങൾ മൂലവാചകത്തിന്റെ ധാർമികവും വാചികവുമായ ശക്തി നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
