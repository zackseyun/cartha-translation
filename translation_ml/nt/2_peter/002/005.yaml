source:
  edition: SBLGNT
  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: ml
  text: പുരാതന ലോകത്തെ അവൻ ഒഴിവാക്കിയില്ല; എന്നാൽ, അഭക്തരുടെ ലോകത്തിന്മേൽ പ്രളയം വരുത്തിക്കൊണ്ട്, നീതിയുടെ[c] പ്രഘോഷകനായ[b] നോഹയെ എട്ടാമനായി[a] കാത്തുരക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എട്ടുപേരിൽ ഒരാളായ നോഹയെ’ അല്ലെങ്കിൽ ‘എട്ടാമനായ നോഹയെ’; ὄγδοον Νῶε എന്ന ഗ്രീക്ക് പ്രയോഗം ചുരുക്കിയതാണ്. നോഹയെ മറ്റു ഏഴുപേരോടൊപ്പം കാത്തുരക്ഷിച്ചു എന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നീതിയുടെ പ്രസംഗകൻ’; κῆρυξ എന്ന പദം പരസ്യമായി അറിയിക്കുന്ന പ്രഘോഷകനെയോ പ്രസംഗകനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘നീതി’ എന്നതിന് ‘നീതിനിഷ്ഠ’ എന്നും, സന്ദർഭാനുസരണം ‘ന്യായം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: പുരാതനലോകം
  rationale: പ്രളയത്തിനു മുമ്പുണ്ടായിരുന്ന മുൻകാല ലോകത്തെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘പുരാതനലോകം’ കാലപരമായ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὐκ ἐφείσατο
  choice: വെറുതെവിട്ടില്ല
  rationale: ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ φείδομαι എന്നതിന്റെ ‘spare’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὄγδοον Νῶε
  choice: നോഹയെ എട്ടാമനായി
  rationale: ഗ്രീക്കിലെ ചുരുക്കിയ ordinal പ്രയോഗം തീർപ്പാക്കി മാറ്റാതെ നിലനിർത്തുന്നു; നോഹ ഏഴുപേരോടൊപ്പം രക്ഷിക്കപ്പെട്ടവരിൽ ഒരാളാണെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: δικαιοσύνης κήρυκα
  choice: നീതിയുടെ പ്രഘോഷകൻ
  rationale: κῆρυξ എന്നതിലെ പരസ്യമായി അറിയിക്കുന്നവൻ എന്ന ഭാവം ‘പ്രഘോഷകൻ’ നൽകുന്നു; δικαιοσύνηയ്ക്ക് ഈ സന്ദർഭത്തിൽ ‘നീതി’ സ്വാഭാവികവും വിശാലവുമായ തുല്യപദമാണ്.
- source_word: ἐφύλαξεν
  choice: കാത്തുരക്ഷിച്ചു
  rationale: ന്യായവിധിക്കിടയിലെ സംരക്ഷണവും രക്ഷയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: κατακλυσμὸν
  choice: പ്രളയം
  rationale: നോഹയുടെ കാലത്തെ മഹാപ്രളയത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: κόσμῳ ἀσεβῶν
  choice: ഭക്തികെട്ടവരുടെ ലോകത്തിന്മേൽ
  rationale: ἀσεβῶν എന്ന ബഹുവചന ജനിറ്റീവിനെ ആളുകളെ സൂചിപ്പിക്കുന്നതായി നിലനിർത്തുകയും ലോകത്തിന്മേലാണ് പ്രളയം വന്നതെന്ന ദാതിവ് ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπάξας
  choice: വരുത്തിയപ്പോൾ
  rationale: പ്രളയം വരുത്തിയതും നോഹയെ കാത്തുരക്ഷിച്ചതും തമ്മിലുള്ള കാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നീതി
  alternative: നീതിനിഷ്ഠ; ന്യായം
  rationale: ഇവിടെ ദൈവത്തിന്റെ ന്യായവിധി മാത്രം എന്നാക്കി അർഥം ചുരുക്കാതെ, ശരിയായ ജീവിതവും ധാർമിക ക്രമവും ഉൾക്കൊള്ളുന്ന പദമായി ‘നീതി’ ഉപയോഗിച്ചു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ὄγδοον Νῶε എന്ന ചുരുക്കിയ പ്രയോഗം
  choice: നോഹയെ എട്ടാമനായി
  alternative: എട്ടുപേരിൽ ഒരാളായ നോഹയെ
  rationale: ഗ്രീക്കിലെ യഥാർഥമായ ചുരുക്കവും അർഥസാധ്യതയും മുഖ്യവാചകത്തിൽ നിലനിർത്തി, കൂടുതൽ വ്യാഖ്യാനാത്മകമായ വായന അടിക്കുറിപ്പിലാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ മുഖ്യക്രിയകളും കാലബന്ധവും വ്യക്തമായി നിലനിർത്തി; ὄγδοον Νῶε എന്നതിലെ യഥാർഥമായ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
