id: 2PE.2.13
reference: 2 Peter 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ⸀ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: ml
  text: അനീതിയുടെ കൂലി അനുഭവിക്കുന്നവരായി[a], പകൽസമയത്തെ സുഖഭോഗം ആനന്ദമായി കരുതുന്നു. അവർ കറകളും കളങ്കങ്ങളുമാണ്; നിങ്ങളോടൊപ്പം വിരുന്നുണ്ണുമ്പോൾ തങ്ങളുടെ വഞ്ചനകളിൽ[b] ആനന്ദിച്ചുല്ലസിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അനീതിയുടെ പ്രതിഫലം.’
    reason: lexical_alternative
  - marker: b
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ ‘വഞ്ചനകളിൽ’ എന്നതിനുപകരം ‘സ്നേഹവിരുന്നുകളിൽ’ എന്നാണ്: ‘നിങ്ങളോടൊപ്പം വിരുന്നുണ്ണുമ്പോൾ തങ്ങളുടെ സ്നേഹവിരുന്നുകളിൽ ആനന്ദിച്ചുല്ലസിക്കുന്നു.’'
    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι
  choice: അനുഭവിക്കുന്നവരായി
  rationale: സന്ദർഭത്തിൽ ഈ കൃദ്യന്തം മറ്റുള്ളവരാൽ അന്യായം ചെയ്യപ്പെടുന്നതിനെക്കാൾ, സ്വന്തം അനീതിയുടെ ദോഷഫലം ഏറ്റുവാങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അനുഭവിക്കുന്നവരായി’ എന്നത് ആ ശിക്ഷാത്മക പ്രതിഫലത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μισθὸν ἀδικίας
  choice: അനീതിയുടെ കൂലി
  rationale: μισθός എന്നതിന്റെ ‘കൂലി/പ്രതിഫലം’ എന്ന അർഥവും ἀδικία എന്നതിന്റെ ധാർമികമായ ‘അനീതി’ എന്ന ബലവും നിലനിർത്തുന്നു; മൂലത്തിലെ സമാസബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: ἡδονὴν ἡγούμενοι
  choice: ആനന്ദമായി കരുതുന്നു
  rationale: ἡγέομαι-യുടെ ‘ആയി കണക്കാക്കുക/കരുതുക’ എന്ന അർഥവും ἡδονή-യുടെ ‘ആനന്ദം/സുഖം’ എന്ന അർഥവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: പകൽസമയത്തെ സുഖഭോഗം
  rationale: τρυφή സൂചിപ്പിക്കുന്ന ആഡംബരപൂർണമായ സ്വയംഭോഗവും ἐν ἡμέρᾳ സൂചിപ്പിക്കുന്ന പകൽസമയത്തെ നിർലജ്ജതയും അമിതവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: σπίλοι καὶ μῶμοι
  choice: കറകളും കളങ്കങ്ങളും
  rationale: ധാർമിക അശുദ്ധിയെയും അപകീർത്തിയെയും സൂചിപ്പിക്കുന്ന ഇരട്ട ദൃശ്യപ്രതീകം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐντρυφῶντες
  choice: ആനന്ദിച്ചുല്ലസിക്കുന്നു
  rationale: സ്വയംതൃപ്തിയോടെ സുഖിക്കുന്നതും അതിരുകടന്ന് ആഘോഷിക്കുന്നതുമായ ഭാവം സന്ദർഭാനുസൃതമായി നൽകുന്നു.
- source_word: ἀπάταις αὐτῶν
  choice: തങ്ങളുടെ വഞ്ചനകളിൽ
  rationale: SBLGNT-യിലെ ἀπάταις എന്ന വായനയുടെ ‘വഞ്ചനകൾ/ചതികൾ’ എന്ന അർഥം സ്വീകരിക്കുന്നു; വ്യാജോപദേശകരെക്കുറിച്ചുള്ള സന്ദർഭത്തോടും ഇത് യോജിക്കുന്നു.
- source_word: συνευωχούμενοι ὑμῖν
  choice: നിങ്ങളോടൊപ്പം വിരുന്നുണ്ണുമ്പോൾ
  rationale: ഒരുമിച്ച് വിരുന്നിൽ പങ്കെടുക്കുക എന്ന ക്രിയയുടെ അർഥവും മറ്റു പ്രവർത്തനത്തോടുള്ള സമകാലികബന്ധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വിരുന്നിന്റെ സ്വഭാവം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: ἀπάταις / ἀγάπαις എന്ന പാഠഭേദം
  choice: മുഖ്യപാഠത്തിൽ ἀπάταις എന്നത് ‘തങ്ങളുടെ വഞ്ചനകളിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ἀγάπαις എന്ന പാഠഭേദം സ്വീകരിച്ചാൽ ‘തങ്ങളുടെ സ്നേഹവിരുന്നുകളിൽ’ എന്നു വരാം
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠം ἀπάταις എന്നാണ് വായിക്കുന്നത്; അത് വ്യാജോപദേശകരുടെ വഞ്ചനയെക്കുറിച്ചുള്ള സന്ദർഭത്തോടു യോജിക്കുന്നു. അർഥവത്തായ ἀγάπαις എന്ന പാഠഭേദം വ്യാഖ്യാനപ്രാധാന്യമുള്ളതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘സുഖഭോഗം,’ ‘കറകളും കളങ്കങ്ങളും,’ ‘വിരുന്നുണ്ണുമ്പോൾ’ എന്നിവ മൂലത്തിലെ ധാർമിക ശക്തിയും ദൃശ്യപ്രതീകവും സാമൂഹികസന്ദർഭവും നിലനിർത്തുന്നു. പാഠഭേദവും ‘കൂലി/പ്രതിഫലം’ എന്ന ശബ്ദവികൽപ്പവും അടിക്കുറിപ്പുകളിൽ സുതാര്യമായി നൽകിയിരിക്കുന്നു.
