reference: 2 Peter 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: ml
  text: ഇവർ വെള്ളമില്ലാത്ത ഉറവുകളും കൊടുങ്കാറ്റിനാൽ ആട്ടിയോടിക്കപ്പെടുന്ന മൂടൽമഞ്ഞുകളുമാണ്[a]; ഇവർക്കായി അന്ധകാരത്തിന്റെ കൂരിരുട്ട് സൂക്ഷിച്ചുവെച്ചിരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൊടുങ്കാറ്റിനാൽ ആട്ടിയോടിക്കപ്പെടുന്ന മേഘങ്ങൾ.’ ഗ്രീക്ക് പദം കൂടുതൽ കൃത്യമായി ‘മൂടൽമഞ്ഞ്’ അല്ലെങ്കിൽ ‘മഞ്ഞ്’ എന്നാണ് സൂചിപ്പിക്കുന്നത്; ചില വിവർത്തനങ്ങൾ അതിനെ വിശാലമായ അർഥത്തിൽ ‘മേഘങ്ങൾ’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഇവർക്കായി അന്ധകാരത്തിന്റെ കൂരിരുട്ട് മാറ്റിവെച്ചിരിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: വെള്ളമില്ലാത്ത ഉറവുകൾ
  rationale: πηγή സ്വാഭാവിക ഉറവിനെയോ ജലസ്രോതസ്സിനെയോ സൂചിപ്പിക്കുന്നു; കുഴിച്ച കിണറെന്ന അർഥമല്ല സാധാരണ. വെള്ളം നൽകേണ്ട ഉറവിൽ വെള്ളമില്ലെന്ന വിരോധാഭാസം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ὁμίχλαι
  choice: മൂടൽമഞ്ഞുകൾ
  rationale: ὁμίχλη മൂടൽമഞ്ഞിനെയോ മഞ്ഞിനെയോ സൂചിപ്പിക്കുന്നു. ‘മേഘങ്ങൾ’ എന്ന വിശാലമായ പരമ്പരാഗത വിവർത്തനത്തേക്കാൾ ഗ്രീക്ക് പദത്തിന്റെ കൃത്യമായ ദൃശ്യബിംബം ഇതു നൽകുന്നു.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: കൊടുങ്കാറ്റിനാൽ തുരത്തപ്പെടുന്ന
  rationale: λαῖλαψ ശക്തമായ കാറ്റോടുകൂടിയ കൊടുങ്കാറ്റിനെയും ἐλαύνω തുരത്തുകയോ മുന്നോട്ടു പായിക്കുകയോ ചെയ്യുന്നതിനെയും സൂചിപ്പിക്കുന്നു. കർമണിപ്രയോഗവും ശക്തമായ ചലനവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: οἷς
  choice: ഇവർക്കായി
  rationale: ഇടയിൽ സ്ത്രീലിംഗ ബഹുവചന രൂപകങ്ങൾ വന്നാലും ബന്ധസർവനാമം ‘ഇവർ’ എന്നു പറയപ്പെട്ട വ്യാജോപദേഷ്ടാക്കളിലേക്കാണ് മടങ്ങുന്നത്. അതിനാൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ‘ഇവർക്കായി’ യോജിക്കുന്നു.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: അന്ധകാരത്തിന്റെ കൂരിരുട്ട്
  rationale: ζόφος കനത്ത, ഭീതിജനകമായ ഇരുട്ടിനെയും σκότος അന്ധകാരത്തെയും സൂചിപ്പിക്കുന്നു. രണ്ടു പദങ്ങളുള്ള ഗ്രീക്ക് ഘടനയും അതിന്റെ തീവ്രതയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τετήρηται
  choice: സൂക്ഷിച്ചുവെച്ചിരിക്കുന്നു
  rationale: τηρέωയുടെ പൂർണ്ണ കർമണി രൂപം മുമ്പേ മാറ്റിവെച്ചതും ഇപ്പോഴും അങ്ങനെ നിലനിൽക്കുന്നതുമായ അവസ്ഥ സൂചിപ്പിക്കുന്നു. ‘സൂക്ഷിച്ചുവെച്ചിരിക്കുന്നു’ ആ കാലഭാവവും കർമണിരൂപവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ ന്യായവിധിയുടെ കർമണിപ്രയോഗം
  choice: വിധി സൂക്ഷിച്ചുവെച്ചിരിക്കുന്നുവെന്ന് പറയുകയും പ്രവർത്തകനെ വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുക
  alternative: ‘ദൈവം സൂക്ഷിച്ചുവെച്ചിരിക്കുന്നു’ എന്ന് പ്രവർത്തകനെ വ്യക്തമായി ചേർക്കുക
  rationale: ഗ്രീക്ക് വാക്യം ദൈവിക ന്യായവിധിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും പ്രവർത്തകനെ പേരെടുത്തു പറയുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ കർമണിപ്രയോഗവും അതിലുള്ള അർഥതുറപ്പും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉറവ്, മൂടൽമഞ്ഞ്, കൊടുങ്കാറ്റ്, കൂരിരുട്ട് എന്നീ ദൃശ്യബിംബങ്ങൾ വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യമായി പ്രവർത്തകനെ ചേർത്തിട്ടില്ല.
