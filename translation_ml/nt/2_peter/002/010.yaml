id: 2PE.2.10
reference: 2 Peter 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: ml
  text: പ്രത്യേകിച്ച്, അശുദ്ധിയോടുള്ള മോഹത്തിൽ ജഡത്തെ പിന്തുടരുകയും ആധിപത്യത്തെ അവജ്ഞയോടെ നിരസിക്കുകയും ചെയ്യുന്നവരെ. അവർ ധാർഷ്ട്യമുള്ളവരും തന്നിഷ്ടക്കാരുമാണ്; മഹിമയുള്ളവരെ നിന്ദിക്കുമ്പോൾ അവർ വിറയ്ക്കുന്നില്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആധിപത്യം’ എന്നതിന് ‘അധികാരം’ അല്ലെങ്കിൽ ‘കർത്തൃത്വം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘മഹിമയുള്ളവർ’ എന്നത് മഹിമയുള്ള സ്വർഗീയ സത്തകളെ—ഒരുപക്ഷേ ദൂതന്മാരെ—സൂചിപ്പിക്കുന്നതാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: μάλιστα
  choice: പ്രത്യേകിച്ച്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ന്യായവിധിക്കുള്ളിൽ ഈ വിഭാഗത്തിന് പ്രത്യേക ഊന്നൽ നൽകുന്നു.
- source_word: ὀπίσω σαρκὸς
  choice: ജഡത്തെ പിന്തുടരുക
  rationale: ὀπίσω എന്ന പിന്തുടരൽപ്രയോഗവും σάρξ എന്ന പ്രധാന രൂപകവും നിലനിർത്തുന്നു; ‘പാപസ്വഭാവം’ എന്ന് വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: അശുദ്ധിയോടുള്ള മോഹത്തിൽ
  rationale: ἐπιθυμίαയുടെ പ്രതികൂലമായ കാമനയും μιασμός സൂചിപ്പിക്കുന്ന മലിനതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: κυριότητος
  choice: ആധിപത്യം
  rationale: ‘അധികാരം’ എന്നതിനേക്കാൾ κυριότης എന്ന പദത്തിന്റെ lordship/dominion ഭാവം നിലനിർത്തുന്നു; ആരുടെ ആധിപത്യമാണെന്ന് മുഖ്യപാഠം നിർണയിക്കുന്നില്ല.
- source_word: καταφρονοῦντας
  choice: നിന്ദിക്കുക
  rationale: അവജ്ഞയോടുകൂടിയ നിരസനത്തിന്റെ ശക്തി സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: Τολμηταί
  choice: ധാർഷ്ട്യമുള്ളവർ
  rationale: സന്ദർഭത്തിലെ കുറ്റകരമായ സാഹസികതയെ ‘ധീരർ’ എന്ന അനുകൂലഭാവമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: αὐθάδεις
  choice: തന്നിഷ്ടക്കാർ
  rationale: സ്വന്തം ഇഷ്ടത്തിൽ പിടിച്ചുനിൽക്കുന്ന, സ്വയം പ്രസാദിപ്പിക്കുന്ന മനോഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δόξας
  choice: മഹിമയുള്ളവർ
  rationale: മഹിമയുള്ള സ്വർഗീയ സത്തകളെ സൂചിപ്പിക്കാമെങ്കിലും ‘ദൂതന്മാർ’ എന്ന് വ്യക്തമാക്കാതെ ബഹുവചനത്തിന്റെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: οὐ τρέμουσιν
  choice: അവർ വിറയ്ക്കുന്നില്ല
  rationale: ഭയഭക്തിയുടെ അഭാവം കാണിക്കുന്ന ഗ്രീക്കിലെ ദൃശ്യമായ ശാരീരിക രൂപകം നിലനിർത്തുന്നു.
- source_word: βλασφημοῦντες
  choice: ദുഷിക്കുമ്പോൾ
  rationale: ദൈവത്തെക്കുറിച്ചുള്ള നിന്ദയിൽ മാത്രം ഒതുങ്ങിപ്പോകാവുന്ന ‘ദൈവദൂഷണം’ ഒഴിവാക്കി, ഉന്നത സത്തകൾക്കെതിരായ അപകീർത്തികരമായ സംസാരം സൂചിപ്പിക്കുന്നു; സമകാലിക പങ്കാളിത്തപ്രയോഗവും പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: κυριότητος എന്നതിന്റെ സൂചിതവിഷയം
  choice: ആധിപത്യം എന്ന് പൊതുവായി, സൂചിതവിഷയം വ്യക്തമാക്കാതെ
  alternative: കർത്താവിന്റെ കർത്തൃത്വം; ദൂതീയ ആധിപത്യം; പൊതുവായ അധികാരം
  rationale: വാക്യം ആരുടെ ആധിപത്യമാണെന്ന് വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ ക്രിസ്തുവിന്റെ കർത്തൃത്വമെന്നോ മാനുഷിക അധികാരമെന്നോ മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ച് തീരുമാനിക്കുന്നില്ല.
- issue: δόξας എന്നതിന്റെ സൂചിതവിഷയം
  choice: മഹിമയുള്ളവർ എന്ന് വ്യക്തിത്വസൂചനയോടെ, എന്നാൽ തിരിച്ചറിയൽ തുറന്നുവെച്ച്
  alternative: ദൂതന്മാർ; മഹിമകൾ; സ്വർഗീയ മഹിമാസത്തകൾ
  rationale: അടുത്ത വാക്യം ദൂതന്മാരെ പരാമർശിക്കുന്നതിനാൽ സ്വർഗീയ സത്തകളാകാനുള്ള സാധ്യത ശക്തമാണ്; എങ്കിലും δόξας എന്ന പദം തന്നെ ‘ദൂതന്മാർ’ എന്ന് വ്യക്തമാക്കാത്തതിനാൽ ആ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: βλασφημοῦντες എന്ന പങ്കാളിത്തപ്രയോഗത്തിന്റെ ബന്ധം
  choice: ‘ദുഷിക്കുമ്പോൾ അവർ വിറയ്ക്കുന്നില്ല’ എന്ന സമകാലിക ബന്ധം
  alternative: ‘ദുഷിക്കാൻ അവർ വിറയ്ക്കുന്നില്ല’ എന്ന ഫലസൂചക/പൂരകബന്ധം
  rationale: ഗ്രീക്ക് പങ്കാളിത്തരൂപം പ്രവർത്തനങ്ങൾ സമകാലികമായി അവതരിപ്പിക്കുന്നു; ഉദ്ദേശ്യാർഥമോ പൂരകാർഥമോ മാത്രം നിർബന്ധിക്കാതെ അതിന്റെ വ്യാകരണതീവ്രത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. കുറ്റാരോപണത്തിന്റെ മുറുക്കമുള്ള താളം നിലനിർത്താൻ രണ്ടാം വാക്യം സംക്ഷിപ്തമാക്കി. σάρξ, κυριότης, δόξας എന്നീ ദൈവശാസ്ത്രപരമായി സാന്ദ്രവും അവ്യക്തവുമായ പദങ്ങൾ അമിതമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
