revisions:
- from: പ്രത്യേകിച്ച്, അശുദ്ധിയോടുള്ള മോഹത്തിൽ ജഡത്തെ പിന്തുടരുകയും ആധിപത്യത്തെ നിന്ദിക്കുകയും ചെയ്യുന്നവരെ. അവർ ധാർഷ്ട്യമുള്ളവരും തന്നിഷ്ടക്കാരുമാണ്; മഹിമയുള്ളവരെ ദുഷിക്കുമ്പോൾ അവർ വിറയ്ക്കുന്നില്ല.[a][b]
  to: പ്രത്യേകിച്ച്, അശുദ്ധിയോടുള്ള മോഹത്തിൽ ജഡത്തെ പിന്തുടരുകയും ആധിപത്യത്തെ അവജ്ഞയോടെ നിരസിക്കുകയും ചെയ്യുന്നവരെ. അവർ ധാർഷ്ട്യമുള്ളവരും തന്നിഷ്ടക്കാരുമാണ്; മഹിമയുള്ളവരെ നിന്ദിക്കുമ്പോൾ അവർ വിറയ്ക്കുന്നില്ല.[a][b]
  rationale: The revision distinguishes καταφρονέω (‘disdainfully reject/disregard’) from βλασφημέω (‘revile/speak abusively of’), while retaining the source’s syntactic continuation, terse characterization, and unresolved references to dominion and the glorious ones. No doctrinal identification is added.
