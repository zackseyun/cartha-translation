id: 2PE.2.9
reference: 2 Peter 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: ml
  text: ഭക്തന്മാരെ പരീക്ഷയിൽനിന്ന് എങ്ങനെ വിടുവിക്കണമെന്നും, അനീതിക്കാരെ ശിക്ഷ അനുഭവിച്ചുകൊണ്ടിരിക്കുന്നവരായി ന്യായവിധിദിവസംവരെ എങ്ങനെ കാത്തുവെക്കണമെന്നും കർത്താവിന് അറിയാം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പ്രലോഭനത്തിൽനിന്ന്.” ഗ്രീക്ക് പദത്തിന് പ്രലോഭനം, പരീക്ഷണം, കഷ്ടപരീക്ഷ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ സന്ദർഭം കഷ്ടപരീക്ഷയിൽനിന്നുള്ള വിടുതലിനാണ് കൂടുതൽ അനുകൂലം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അനീതിക്കാരെ ന്യായവിധിദിവസത്തിൽ ശിക്ഷിക്കാനായി കാത്തുവെക്കണമെന്നും.” ഗ്രീക്ക് വർത്തമാന പങ്കുപദം ഇപ്പോൾ തുടരുന്ന ശിക്ഷയെ സൂചിപ്പിക്കുന്നതായോ, വരാനിരിക്കുന്ന ന്യായവിധിയോടു ബന്ധപ്പെട്ട ശിക്ഷയെ സൂചിപ്പിക്കുന്നതായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: എങ്ങനെ ... എന്നും ... അറിയാം
  rationale: രണ്ട് അനന്തക്രിയകളോടൊപ്പമുള്ള οἶδεν പ്രായോഗിക അറിവിനെയോ കഴിവിനെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എങ്ങനെ ... എന്നും അറിയാം’ എന്ന പ്രയോഗം അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന ദൈവിക അഭിസംബോധനയ്ക്ക് ആധുനിക മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും മാന്യവുമായ സാധാരണ പദം.
- source_word: εὐσεβεῖς
  choice: ഭക്തരെ
  rationale: വിശ്വാസഭക്തിയാൽ സവിശേഷരായ ആളുകളെ സൂചിപ്പിക്കുന്ന substantival adjective-ന്റെ മത-ധാർമിക അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐκ πειρασμοῦ
  choice: പരീക്ഷയിൽനിന്ന്
  rationale: πειρασμός പരീക്ഷണം, കഷ്ടപരീക്ഷ, പ്രലോഭനം എന്നീ അർഥങ്ങൾക്കു വഴിയൊരുക്കുന്നു; നോഹയുടെയും ലോത്തിന്റെയും സന്ദർഭം കണക്കിലെടുത്ത് ‘പരീക്ഷ’ പ്രധാന പാഠത്തിൽ യോജിക്കുന്നു, എന്നാൽ മറ്റർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ῥύεσθαι
  choice: വിടുവിക്കണമെന്നും
  rationale: അപകടത്തിൽനിന്നോ ദുരിതത്തിൽനിന്നോ രക്ഷിക്കുന്നതെന്ന ῥύομαι-യുടെ ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀδίκους
  choice: നീതികെട്ടവരെ
  rationale: ἄδικος എന്നതിന്റെ ധാർമികവും ന്യായവിധിസംബന്ധവുമായ ശക്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: εἰς ἡμέραν κρίσεως
  choice: ന്യായവിധിദിവസംവരെ
  rationale: τηρεῖν-നോടൊപ്പം വരുന്ന εἰς ഭാവിയിലെ ന്യായവിധിദിവസംവരെയുള്ള കാത്തുവെക്കലായി വായിക്കാവുന്നതിനെ പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: κολαζομένους
  choice: ശിക്ഷ അനുഭവിക്കുന്നവരായി
  rationale: വർത്തമാനകാല കർമണി participle-ന്റെ തുടരുന്ന അവസ്ഥാസൂചന നിലനിർത്തുന്നു; അതിനെ അന്തിമദിവസത്തിലെ ശിക്ഷയായി മാത്രം ചുരുക്കുന്നില്ല.
- source_word: τηρεῖν
  choice: കാത്തുസൂക്ഷിക്കണമെന്നും
  rationale: τηρέω-യുടെ keep/guard/reserve എന്ന വിശാലത നൽകുന്നു; ഇവിടെ സംരക്ഷണത്തിന്റെ അനുകൂലഭാവം ഒഴിവാക്കാൻ ശിക്ഷാവസ്ഥയോടു ചേർത്താണ് ഉപയോഗിച്ചത്.
theological_decisions:
- issue: πειρασμός എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: പരീക്ഷ/കഷ്ടപരീക്ഷ
  alternative: പ്രലോഭനം
  rationale: മുൻവാക്യങ്ങളിലെ നോഹയുടെയും ലോത്തിന്റെയും വിടുതൽ ദുരന്തകരമായ സാഹചര്യങ്ങളിൽനിന്നുള്ള രക്ഷയാണ്; അതിനാൽ ‘പരീക്ഷ’ സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നു. എന്നിരുന്നാലും ഗ്രീക്ക് പദത്തിന്റെ ‘പ്രലോഭനം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: κολαζομένους എന്ന participle-ന്റെ കാലബലം
  choice: ന്യായവിധിദിവസംവരെ ശിക്ഷ അനുഭവിക്കുന്ന അവസ്ഥയിൽ കാത്തുസൂക്ഷിക്കൽ
  alternative: ന്യായവിധിദിവസത്തിൽ ശിക്ഷിക്കപ്പെടാനായി കാത്തുവെക്കൽ
  rationale: വർത്തമാന participle തുടരുന്ന ശിക്ഷാവസ്ഥയെ സൂചിപ്പിക്കാം; എന്നാൽ εἰς ἡμέραν κρίσεως ഭാവിയിലെ ന്യായവിധിയിലേക്ക് ദൃഷ്ടി തിരിക്കുന്നു. ഇടനിലാവസ്ഥയെക്കുറിച്ചുള്ള പൂർണ സിദ്ധാന്തം അടിച്ചേൽപ്പിക്കാതെ ഈ പിരിമുറുക്ക് പാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ‘ഭക്തർ’, ‘വിടുവിക്കുക’, ‘ന്യായവിധിദിവസം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് പരിചിതമായിരിക്കെ മൂലപാഠത്തിന്റെ മത-ന്യായപരമായ ഭാരം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
