  to: എന്തെന്നാൽ, പൊള്ളയായ പൊങ്ങച്ചവാക്കുകൾ[a] പറഞ്ഞുകൊണ്ട് അവർ, വഴിതെറ്റി ജീവിക്കുന്നവരിൽനിന്ന് കഷ്ടിച്ച്[c] ഒഴിഞ്ഞുമാറിക്കൊണ്ടിരിക്കുന്നവരെ ജഡത്തിന്റെ മോഹങ്ങളാലും[b] കാമാസക്തികളാലും[d] വശീകരിക്കുന്നു.
  rationale: അർഥത്തിൽ മാറ്റം വരുത്താതെ, ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις എന്ന ഉപാധി-പ്രയോഗം മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘മോഹങ്ങളാലും കാമാസക്തികളാലും’ എന്നു പരിഷ്കരിച്ചു. ἀσελγείαις-ന്റെ ബഹുവചനവും ഇതിലൂടെ വ്യക്തമായി നിലനിൽക്കുന്നു.
