id: 2PE.2.18
reference: 2 Peter 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: ml
  text: എന്തെന്നാൽ, പൊള്ളയായ പൊങ്ങച്ചവാക്കുകൾ[a] പറഞ്ഞുകൊണ്ട് അവർ, വഴിതെറ്റി ജീവിക്കുന്നവരിൽനിന്ന് കഷ്ടിച്ച്[c] ഒഴിഞ്ഞുമാറിക്കൊണ്ടിരിക്കുന്നവരെ ജഡത്തിന്റെ മോഹങ്ങളാലും[b] കാമാസക്തികളാലും[d] വശീകരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പൊള്ളയായ അതിശയോക്തിവാക്കുകൾ.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ജഡികമായ മോഹങ്ങൾ.” ഇവിടെ “ജഡം” ധാർമിക അർഥത്തിലുള്ള ഒരു രൂപകമാണ്.'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “ഇപ്പോൾ മാത്രം ഒഴിഞ്ഞുമാറിക്കൊണ്ടിരിക്കുന്നവരെ.” ചില ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിലെ പാഠം “യഥാർഥമായി ഒഴിഞ്ഞുമാറിയവരെ” എന്ന അർഥം നൽകുന്നു.'
    reason: alternative_reading
  - marker: d
    text: 'അഥവാ: “ജഡത്തിന്റെ മോഹങ്ങൾകൊണ്ട്, അതായത് കാമാസക്തികളാൽ.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὑπέρογκα … ματαιότητος
  choice: പൊള്ളയായ പൊങ്ങച്ചവാക്കുകൾ
  rationale: ὑπέρογκα എന്നത് അതിരുകടന്നതും വീമ്പുനിറഞ്ഞതുമായ സംസാരത്തെയും ματαιότητος അതിന്റെ പൊള്ളത്തരം/നിഷ്ഫലതയെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ രണ്ടു ആശയങ്ങളും സ്വാഭാവികമായി ഒരുമിപ്പിക്കുന്നു.
- source_word: φθεγγόμενοι
  choice: പറഞ്ഞുകൊണ്ട്
  rationale: വശീകരിക്കുന്ന രീതി വ്യക്തമാക്കുന്ന വർത്തമാന കൃതന്തത്തിന്റെ തുടർച്ചാസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: δελεάζουσιν
  choice: വശീകരിക്കുന്നു
  rationale: ഇരയിട്ട് ആകർഷിക്കുക എന്ന ക്രിയയുടെ പ്രലോഭനാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: ജഡത്തിന്റെ മോഹങ്ങൾകൊണ്ട്
  rationale: ἐν ഇവിടെ മാർഗം/ഉപാധി സൂചിപ്പിക്കുന്നു. σάρξ എന്ന ഗ്രീക്ക് രൂപകം ‘പാപസ്വഭാവം’ എന്നു വ്യാഖ്യാനിച്ചു തീർക്കാതെ ‘ജഡം’ എന്നുതന്നെ സംരക്ഷിക്കുന്നു.
- source_word: ἀσελγείαις
  choice: കാമാസക്തി
  rationale: നിയന്ത്രണമില്ലാത്തതും ലജ്ജയില്ലാത്തതുമായ ഇന്ദ്രിയാസക്തിയുടെ ആശയം വായനാസൗകര്യമുള്ള ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ബഹുവചനത്തിന്റെ ആശയം സന്ദർഭത്തിൽ സമാഹാരനാമമായി വരുന്നു.
- source_word: ὀλίγως
  choice: കഷ്ടിച്ച്
  rationale: ഒഴിഞ്ഞുമാറൽ അപൂർണ്ണവും അപകടാവസ്ഥയിലുമാണെന്ന ഏറ്റവും സ്വാഭാവിക അർഥം നൽകുന്നു; ‘ഇപ്പോൾ മാത്രം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀποφεύγοντας
  choice: ഒഴിഞ്ഞുമാറിക്കൊണ്ടിരിക്കുന്നവരെ
  rationale: വർത്തമാന കൃതന്തത്തിലെ പുരോഗമനസ്വഭാവം സംരക്ഷിക്കുകയും രക്ഷപ്പെടൽ പൂർത്തിയായി എന്ന് അതിരുകടന്ന് പ്രസ്താവിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: വഴിതെറ്റി ജീവിക്കുന്നവരിൽനിന്ന്
  rationale: πλάνηയിലെ തെറ്റ്/വഴിതെറ്റൽ എന്ന അർഥവും ἀναστρέφομαι സൂചിപ്പിക്കുന്ന പതിവായ ജീവിതരീതിയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ധാർമിക സന്ദർഭത്തിലെ σάρξ
  choice: ‘ജഡത്തിന്റെ’ എന്നു രൂപകത്തെ സംരക്ഷിച്ചു
  alternative: ‘ജഡികമായ’ അല്ലെങ്കിൽ ‘പാപസ്വഭാവത്തിന്റെ’
  rationale: ‘പാപസ്വഭാവം’ എന്നത് ഒരു വ്യവസ്ഥിത ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കാം; ‘ജഡം’ മൂലപദത്തിന്റെ രൂപകവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്നുവയ്ക്കുന്നു.
- issue: വശീകരിക്കപ്പെടുന്നവരുടെ ഒഴിഞ്ഞുമാറലിന്റെ നില
  choice: ‘കഷ്ടിച്ച് ഒഴിഞ്ഞുമാറിക്കൊണ്ടിരിക്കുന്നവർ’
  alternative: ‘യഥാർഥമായി രക്ഷപ്പെട്ടവർ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ മാത്രം ഒഴിഞ്ഞുമാറുന്നവർ’
  rationale: ὀλίγως എന്ന പാഠത്തിലെ അനിശ്ചിതത്വവും വർത്തമാന കൃതന്തത്തിന്റെ പുരോഗമനസ്വഭാവവും നിലനിർത്തുന്നു; അവരുടെ രക്ഷ പൂർത്തിയായോ ആത്മീയമായി നിർണായകമായോ എന്ന് വാക്യം തീരുമാനിപ്പിക്കുന്നില്ല.
- issue: ἀσελγείαις എന്നതും ‘ജഡത്തിന്റെ മോഹങ്ങൾ’ എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ‘മോഹങ്ങളും കാമാസക്തിയുംകൊണ്ട്’ എന്ന ഏകോപിത വായന
  alternative: ‘ജഡത്തിന്റെ മോഹങ്ങൾകൊണ്ട്, അതായത് കാമാസക്തികളാൽ’
  rationale: ഗ്രീക്കിലെ ദത്തിവ് രൂപങ്ങൾ രണ്ടു അടുത്ത ഉപാധികളായോ രണ്ടാമത്തേത് ആദ്യത്തേതിനെ വിശദീകരിക്കുന്നതായോ ഗ്രഹിക്കാം. മുഖ്യവാചകം സ്വാഭാവിക ഏകോപനം സ്വീകരിക്കുകയും വിശദീകരണസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ജഡം’ പോലുള്ള ഉറവിടരൂപകം സംരക്ഷിക്കുമ്പോഴും വാക്യഘടന സ്വാഭാവികമാക്കി. ‘ഒഴിഞ്ഞുമാറിക്കൊണ്ടിരിക്കുന്നവർ’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ പുരോഗമനസ്വഭാവവും ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
