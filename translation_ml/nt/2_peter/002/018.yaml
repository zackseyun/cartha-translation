  source_fidelity: 'മുഖ്യവാചകം ഗ്രീക്ക് വാക്യഘടനയെയും അർഥത്തെയും വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു: പൊങ്ങച്ചവും പൊള്ളയുമായ സംസാരവും, അതുവഴിയുള്ള വശീകരണവും, കഷ്ടിച്ച് ഒഴിഞ്ഞുമാറിക്കൊണ്ടിരിക്കുന്നവരും, വഴിതെറ്റി ജീവിക്കുന്നവരുമായുള്ള ബന്ധവും വ്യക്തമാണ്. ὀλίγως എന്ന SBLGNT പാഠത്തിന്റെ ‘കഷ്ടിച്ച്’ എന്ന അർഥവും അനുബന്ധക്കുറിപ്പിലെ പാഠഭേദവും യോജിച്ചതാണ്.'
  naturalness: ‘ജഡത്തിന്റെ മോഹങ്ങളും കാമാസക്തിയുംകൊണ്ട്’ എന്ന രൂപത്തിൽ രണ്ട് ഏകോപിത നാമങ്ങളോടുള്ള ഉപാധിവിഭക്തി അവസാന ഘടകത്തിൽ മാത്രം ചേർന്നിരിക്കുന്നത് വായനയിൽ അല്പം അസ്വാഭാവികമാണ്. ‘ജഡത്തിന്റെ മോഹങ്ങളാലും കാമാസക്തികളാലും’ എന്നത് ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ കൂടുതൽ സുഗമവും വ്യക്തവുമാണ്.
  terminology: ‘ജഡം’ σάρξ-ന്റെ രൂപകസ്വഭാവം നിലനിർത്തുന്നു; ‘പാപസ്വഭാവം’ പോലുള്ള വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കിയതും ഉചിതമാണ്. ἀσελγείαις ബഹുവചനമായതിനാൽ ‘കാമാസക്തികളാലും’ എന്നു ബഹുവചനമാക്കുന്നത് ഉറവിടത്തോടും അടിക്കുറിപ്പോടും കൂടുതൽ ചേർന്നുനിൽക്കും.
