revisions:
- from: 'സത്യമായ പഴഞ്ചൊല്ലിൽ പറയുന്നത് അവർക്കു സംഭവിച്ചിരിക്കുന്നു: “നായ സ്വന്തം ഛർദിയിലേക്കു മടങ്ങുന്നു,”[a] എന്നും “കുളിപ്പിക്കപ്പെട്ട പെൺപന്നി ചെളിയിൽ ഉരുളാൻ മടങ്ങുന്നു” എന്നും.'
  to: 'സത്യമായ പഴഞ്ചൊല്ലിൽ പറയുന്നത് അവർക്കു സംഭവിച്ചിരിക്കുന്നു: “നായ സ്വന്തം ഛർദിയിലേക്കു തിരിഞ്ഞ്,”[a] എന്നും “കുളിച്ച പെൺപന്നി ചെളിയിൽ ഉരുളാൻ പോകുന്നു” എന്നും.'
  rationale: പരിഷ്കാരം ἐπιστρέψας-നെ ‘തിരിഞ്ഞ്’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘മടങ്ങുന്നു’ രണ്ടാം ഖണ്ഡത്തിൽ നിന്ന് നീക്കുന്നു; εἰς κυλισμὸν βορβόρου-ന്റെ ദിശയും ഉരുളൽ എന്ന ദൃശ്യവും ‘ചെളിയിൽ ഉരുളാൻ പോകുന്നു’ എന്ന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ഉദ്ധരണിയുടെ ഉദ്ദേശ്യപൂർവമായ ചുരുക്കവും വ്യക്തതയ്ക്കായി സംരക്ഷിച്ചിരിക്കുന്നു.
