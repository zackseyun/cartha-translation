id: 2PE.2.22
reference: 2 Peter 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς ⸀κυλισμὸν βορβόρου.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: ml
  text: 'സത്യമായ പഴഞ്ചൊല്ലിൽ പറയുന്നത് അവർക്കു സംഭവിച്ചിരിക്കുന്നു: “നായ സ്വന്തം ഛർദിയിലേക്കു തിരിഞ്ഞ്,”[a] എന്നും “കുളിച്ച പെൺപന്നി ചെളിയിൽ ഉരുളാൻ പോകുന്നു” എന്നും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “സ്വന്തം ഛർദിയിലേക്കു തിരിഞ്ഞ നായ … ചെളിയിൽ ഉരുളാൻ കുളിച്ച പെൺപന്നി.” ആദ്യവരി സദൃശവാക്യങ്ങൾ 26:11-നെ അനുസ്മരിപ്പിക്കുന്നു.'
    reason: മൂലത്തിലെ കൃത്തരൂപങ്ങളും രണ്ടാമത്തെ ഖണ്ഡത്തിലെ ഒഴിവാക്കിയ ക്രിയയും വ്യക്തമാക്കുന്നതിനും പഴയനിയമബന്ധം ചൂണ്ടിക്കാണിക്കുന്നതിനും.
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: അവർക്കു സംഭവിച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണകാലം, സംഭവിച്ചതിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നതായി സൂചിപ്പിക്കുന്നു; ദത്തിവ് പ്രയോഗം ‘അവർക്കു’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: സത്യമായ പഴഞ്ചൊല്ലിൽ പറയുന്നത്
  rationale: മൂലത്തിലെ സംക്ഷിപ്തവും അപൂർണ്ണവുമായ ഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പഴഞ്ചൊല്ലിന്റെ ഉള്ളടക്കം അവരുടെ കാര്യത്തിൽ സത്യമായിത്തീർന്നുവെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: നായ സ്വന്തം ഛർദിയിലേക്കു മടങ്ങുന്നു
  rationale: സാമാന്യസത്യത്തെ സൂചിപ്പിക്കുന്ന പഴഞ്ചൊല്ലിന്റെ ശൈലി നിലനിർത്തുകയും സദൃശവാക്യങ്ങൾ 26:11-ലെ ദൃശ്യബിംബം വ്യക്തമായി കൈമാറുകയും ചെയ്യുന്നു.
- source_word: Ὗς λουσαμένη
  choice: കുളിപ്പിക്കപ്പെട്ട പെൺപന്നി
  rationale: Ὗς എന്നതിലെ സ്ത്രീലിംഗസൂചന ‘പെൺപന്നി’ എന്നു നിലനിർത്തുന്നു. λουσαμένη എന്ന മധ്യ/കർമണി രൂപത്തെ ആരാണ് കുളിപ്പിച്ചതെന്ന് നിർണ്ണയിക്കാതെ ‘കുളിപ്പിക്കപ്പെട്ട’ എന്നു നൽകുന്നു.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: ചെളിയിൽ ഉരുളാൻ
  rationale: κυλισμός എന്ന ഉരുളൽ/കിടന്നുരുളൽ എന്ന പ്രവൃത്തിയും βόρβορος എന്ന ചെളി/ചളി എന്ന ദൃശ്യവും ലളിതവും സജീവവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സംക്ഷിപ്തമായ പഴഞ്ചൊൽ ഉദ്ധരണിയുടെ പ്രയോഗം
  choice: പഴഞ്ചൊല്ലിൽ പറയുന്നത് അവരുടെ കാര്യത്തിൽ സംഭവിച്ചിരിക്കുന്നു
  alternative: സത്യമായ പഴഞ്ചൊല്ലിന്റെ വാക്ക് അവർക്കു സംഭവിച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തത അംഗീകരിച്ചുകൊണ്ട് അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു; ഈ പിന്നോട്ടുപോക്കിന്റെ ചിത്രംകൊണ്ട് വ്യക്തമാകുന്നതിലപ്പുറം ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ നിഗമനം ചേർക്കുന്നില്ല.
- issue: λουσαμένη എന്ന രൂപത്തിന്റെ കർത്തൃത്വം
  choice: കുളിപ്പിക്കപ്പെട്ട പെൺപന്നി
  alternative: കുളിച്ച പെൺപന്നി
  rationale: മധ്യ/കർമണി രൂപത്തിന്റെ സാധ്യതകളെ അനാവശ്യമായി തീർപ്പാക്കാതെ, സന്ദർഭത്തിലെ ‘washed sow’ എന്ന അവസ്ഥയെ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഛർദി’, ‘പെൺപന്നി’, ‘ചെളിയിൽ ഉരുളുക’ എന്നീ നേരിട്ടുള്ള പദങ്ങൾ മൂലത്തിലെ കടുത്ത ദൃശ്യബിംബം മയപ്പെടുത്താതെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
