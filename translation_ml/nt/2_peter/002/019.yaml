reference: 2 Peter 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: ml
  text: അവർക്ക് സ്വാതന്ത്ര്യം വാഗ്ദാനം ചെയ്യുമ്പോൾ, അവർതന്നെ നാശത്തിന്റെ[a] അടിമകളാണ്. കാരണം, ഒരാൾ എന്തിനാൽ കീഴടക്കപ്പെട്ടിരിക്കുന്നുവോ, അതിനാൽ അയാൾ അടിമയാക്കപ്പെട്ടുമിരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദുഷിപ്പ്.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഒരാൾ എന്തിനാൽ തോൽപ്പിക്കപ്പെട്ടിരിക്കുന്നുവോ, അതിനാൽ അയാൾ അടിമയാക്കപ്പെട്ടുമിരിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: സ്വാതന്ത്ര്യം
  rationale: ‘സ്വാതന്ത്ര്യം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്; തുടർന്നുള്ള അടിമത്തവുമായുള്ള ശക്തമായ വൈരുധ്യവും ഇത് നിലനിർത്തുന്നു.
- source_word: ἐπαγγελλόμενοι
  choice: വാഗ്ദാനം ചെയ്യുന്നു
  rationale: കേവലം പ്രഖ്യാപിക്കുന്നതല്ല, ഒരു വാഗ്ദാനം നൽകുന്നതാണ് ഗ്രീക്ക് ക്രിയയുടെ അർഥം.
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: വാഗ്ദാനം ചെയ്യുന്ന സ്വാതന്ത്ര്യവും അവരുടെ യഥാർഥ ബന്ധിതാവസ്ഥയും തമ്മിലുള്ള വിരോധാഭാസം മൃദൂകരിക്കാതെ പ്രകടമാക്കുന്നു.
- source_word: ὑπάρχοντες
  choice: ആയിരിക്കെ
  rationale: വാഗ്ദാനം ചെയ്യുന്ന അതേ സമയത്ത് അവർ നിലകൊള്ളുന്ന യഥാർഥ അവസ്ഥയും അതിലെ വൈരുധ്യവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: φθορᾶς
  choice: ദുഷിപ്പിന്റെ
  rationale: ഈ പദത്തിലെ ധാർമിക അധഃപതനത്തിന്റെയും നാശകരമായ ഫലത്തിന്റെയും ഭാവങ്ങൾ ഒരൊറ്റ പ്രത്യേക അർഥത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ᾧ γάρ τις ἥττηται
  choice: കാരണം, ഒരാൾ എന്തിനാൽ കീഴടക്കപ്പെട്ടിരിക്കുന്നുവോ
  rationale: പൊതുവായ ഒരു തത്ത്വമായി വരുന്ന വാക്യത്തെ ഏകവചനത്തിലും നിഷ്ക്രിയരൂപത്തിലും നിലനിർത്തുന്നു; ‘കീഴടക്കപ്പെടുക’ തോൽവിയുടെയും ആധിപത്യത്തിന്റെയും ഭാവം നൽകുന്നു.
- source_word: τούτῳ καὶ δεδούλωται
  choice: അതിനാൽത്തന്നെ അയാൾ അടിമയാക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ദാതിവിഭക്തിയിലെ ഉപാധി/കർത്തൃഭാവവും സമ്പൂർണകാല നിഷ്ക്രിയരൂപം സൂചിപ്പിക്കുന്ന തുടരുന്ന അടിമാവസ്ഥയും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: δοῦλοι / δεδούλωται എന്ന പദജോടി സ്വാതന്ത്ര്യത്തിന്റെ വ്യാജവാഗ്ദാനത്തോട് വിരുദ്ധമായി വരുന്നത്
  choice: ‘അടിമകൾ’, ‘അടിമയാക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തുക
  alternative: ‘ദാസന്മാർ’, ‘ബന്ധനത്തിലായിരിക്കുന്നു’
  rationale: ഗ്രീക്കിലെ ഒരേ അടിമത്ത-പദകുടുംബവും സ്വാതന്ത്ര്യവും യഥാർഥ അധീനതയും തമ്മിലുള്ള കടുത്ത വൈരുധ്യവും മലയാളത്തിൽ തുറന്നുവെക്കുന്നു.
- issue: φθοράയുടെ ധാർമികവും നാശപരവുമായ അർഥവ്യാപ്തി
  choice: മുഖ്യവാചകത്തിൽ ‘ദുഷിപ്പ്’; അടിക്കുറിപ്പിൽ ‘നാശം’ എന്ന സാധ്യത
  alternative: ‘അധഃപതനം’ അല്ലെങ്കിൽ ‘നാശം’ മാത്രം
  rationale: സന്ദർഭത്തിലെ ധാർമിക ദുഷിപ്പിനെ മുൻനിർത്തുമ്പോഴും പദത്തിന്റെ നാശ/വിനാശ ഭാവം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അഴിമതി’ എന്ന പദം ഇന്നത്തെ മലയാളത്തിൽ കൈക്കൂലി/ഭരണദുരുപയോഗം എന്ന പരിമിത ധ്വനി കൂടുതലായി നൽകുന്നതിനാൽ ഒഴിവാക്കി. പൊതുവാചകത്തിലെ τις ഏകവചനമായി ‘ഒരാൾ … അയാൾ’ എന്നു നിലനിർത്തി.
