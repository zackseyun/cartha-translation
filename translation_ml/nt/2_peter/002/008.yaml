id: 2PE.2.8
reference: 2 Peter 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: ml
  text: താൻ കണ്ടതും കേട്ടതും മൂലം[a], അവരുടെ ഇടയിൽ വസിച്ചിരുന്ന ആ നീതിമാൻ, ദിവസംതോറും അവരുടെ നിയമവിരുദ്ധ പ്രവൃത്തികളാൽ നീതിയുള്ള തന്റെ ഉള്ളത്തെ പീഡിപ്പിച്ചുകൊണ്ടിരുന്നു[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘കാഴ്ചയാലും കേൾവിയാലും’ എന്ന പദങ്ങൾ ആദ്യം വരുന്നു. അതിനാൽ ഇത് ‘അവരുടെ നിയമവിരുദ്ധ പ്രവൃത്തികൾ കണ്ടും കേട്ടും’ എന്ന അർഥത്തിലും വാക്യവുമായി ബന്ധിപ്പിച്ചു വായിക്കാം.
    reason: syntactic_ambiguity
  - marker: b
    text: 'അഥവാ, ‘അവരുടെ നിയമവിരുദ്ധ പ്രവൃത്തികൾ കണ്ടും കേട്ടും, അവൻ ദിവസംതോറും തന്റെ നീതിയുള്ള ഉള്ളത്തിൽ പീഡനം അനുഭവിച്ചുകൊണ്ടിരുന്നു.’ എന്നാൽ ഗ്രീക്കിൽ പ്രധാന ക്രിയ സകർമകമാണ്: അവൻ തന്റെ നീതിയുള്ള ഉള്ളത്തെ പീഡിപ്പിച്ചുകൊണ്ടിരുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέμματι … καὶ ἀκοῇ
  choice: താൻ കണ്ടതും കേട്ടതും നിമിത്തം
  rationale: കാഴ്ചയും കേൾവിയും സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തി രൂപങ്ങളെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കാരണാർഥത്തിൽ അവതരിപ്പിക്കുന്നു; ലോത്ത് നേരിട്ട് അനുഭവിച്ച കാര്യങ്ങളാണ് അവന്റെ ഉള്ളിലെ പീഡനത്തിന് ഇടയായത്.
- source_word: ὁ δίκαιος
  choice: ആ നീതിമാൻ
  rationale: വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നതിനെയും മുൻവാക്യത്തിലെ ലോത്തിനെ തിരിച്ചുസൂചിപ്പിക്കുന്നതിനെയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: അവരുടെ ഇടയിൽ പാർത്തിരുന്ന
  rationale: അവരുടെ മധ്യേ തുടർച്ചയായി താമസിച്ചിരുന്നതെന്ന പങ്കാളിക്രിയയുടെ ദൈർഘ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: ദിവസംതോറും
  rationale: ആവർത്തിച്ചുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ψυχὴν δικαίαν
  choice: തന്റെ നീതിനിഷ്ഠമായ ഉള്ളത്തെ
  rationale: ψυχή ഇവിടെ ശരീരത്തിൽനിന്ന് വേർതിരിച്ച ഒരു സത്തയെക്കുറിച്ചുള്ള സാങ്കേതിക പ്രസ്താവനയല്ല; ആ വ്യക്തിയുടെ ആന്തരിക സ്വത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഉള്ളം’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; ഗ്രീക്കിലെ ആവർത്തിച്ച δικαίαν-ഉം നിലനിർത്തുന്നു.
- source_word: ἀνόμοις ἔργοις
  choice: അവരുടെ നിയമവിരുദ്ധ പ്രവൃത്തികളാൽ
  rationale: ἄνομος എന്ന പദത്തിന്റെ നിയമ-ധാർമിക ശക്തിയും ദത്തിവിഭക്തിയുടെ കാരണം/മാർഗം എന്ന സാധ്യതയും നിലനിർത്തുന്നു. ‘അവരുടെ’ എന്നത് സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കപ്പെട്ടതാണ്.
- source_word: ἐβασάνιζεν
  choice: പീഡിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവവും βασανίζω എന്ന ശക്തമായ ക്രിയയുടെ തീവ്രതയും നിലനിർത്തുന്നു; വെറും ദുഃഖിതനായിരുന്നു എന്നാക്കി മൃദൂകരിക്കുന്നില്ല.
theological_decisions:
- issue: ψυχή എന്ന പദത്തിന്റെ മനുഷ്യസ്വഭാവസംബന്ധിയായ അർഥം
  choice: ലോത്തിന്റെ ആന്തരിക സ്വത്വത്തെ സൂചിപ്പിക്കാൻ ‘ഉള്ളം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘പ്രാണൻ’
  rationale: വാക്യം ശരീരം-ആത്മാവ് ഘടനയെക്കുറിച്ചുള്ള സാങ്കേതിക സിദ്ധാന്തം പഠിപ്പിക്കുന്നില്ല; ലോത്തിന്റെ ആന്തരിക ധാർമിക വേദനയാണ് പ്രധാനം. അതിനാൽ അനാവശ്യമായ സിദ്ധാന്തനിർണയം ഒഴിവാക്കുന്നു.
- issue: ἐβασάνιζεν എന്ന സകർമക സജീവരൂപം
  choice: ‘തന്റെ … ഉള്ളത്തെ പീഡിപ്പിച്ചുകൊണ്ടിരുന്നു’ എന്നു സകർമകമായി നിലനിർത്തി.
  alternative: ‘അവൻ ഉള്ളിൽ പീഡിതനായിരുന്നു’ അല്ലെങ്കിൽ ‘അവൻ തന്നെത്താൻ പീഡിപ്പിച്ചു’
  rationale: ഗ്രീക്കിലെ സജീവരൂപവും ψυχή എന്ന കർമവും സംരക്ഷിക്കുന്നു; അതോടൊപ്പം ഇത് സ്വയം വരുത്തിയ പീഡനമാണോ അനുഭവിച്ച ആന്തരിക യാതനയാണോ എന്ന സൂക്ഷ്മമായ പിരിമുറുക്കം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നീതിമാൻ/നീതിനിഷ്ഠമായ’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ δίκαιος/δικαίαν ആവർത്തനം ഉദ്ദേശപൂർവം സംരക്ഷിക്കുന്നു. അവസാനത്തെ ദീർഘവിരാമം അടുത്ത സന്ദർഭവുമായി വാക്യത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കാൻ നിലനിർത്തി.
