id: 2PE.2.12
reference: 2 Peter 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: ml
  text: എന്നാൽ ഇവർ, സഹജസ്വഭാവമുള്ളവയും പിടിക്കപ്പെടാനും നശിപ്പിക്കപ്പെടാനും ജനിച്ചവയുമായ വിവേകമില്ലാത്ത മൃഗങ്ങളെപ്പോലെ, തങ്ങൾക്കു മനസ്സിലാകാത്ത കാര്യങ്ങളെ ദൂഷിച്ചുപറഞ്ഞുകൊണ്ട്, തങ്ങളുടെ നാശത്തിൽ നശിപ്പിക്കപ്പെടുകയും ചെയ്യും[a][b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിവേകമില്ലാത്ത മൃഗങ്ങൾ’ എന്നതിന് ‘യുക്തിബോധമില്ലാത്ത മൃഗങ്ങൾ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ പദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘സഹജസ്വഭാവമുള്ളവയായി ജനിച്ചവ’ എന്നതിനടുത്തതാണ്; ഇവിടെ സഹജപ്രേരണകളാൽ നയിക്കപ്പെടുന്ന ജീവികളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘ദൂഷിച്ചുപറഞ്ഞുകൊണ്ട്’ എന്നതിന് ‘നിന്ദിച്ചുപറഞ്ഞുകൊണ്ട്’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ദൈവദൂഷണം പറയുക’ എന്ന അർഥവും വരാം; എന്നാൽ ഇവിടെ ദൂഷണത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കിയിട്ടില്ല.
    reason: lexical_alternative
  - marker: d
    text: ഗ്രീക്കിൽ ‘നാശം’ എന്നും ‘നശിപ്പിക്കപ്പെടും’ എന്നും ഒരേ മൂലത്തിൽനിന്നുള്ള പദങ്ങൾ ആവർത്തിച്ച് പദപ്രയോഗം സൃഷ്ടിക്കുന്നു. ‘തങ്ങളുടെ’ എന്നത് ഇവിടെ ഈ ആളുകളെത്തന്നെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: wordplay
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: വിവേകമില്ലാത്ത മൃഗങ്ങൾ
  rationale: ἄλογα എന്നത് സംസാരശേഷിയില്ലായ്മയെക്കാൾ യുക്തിവിവേകമില്ലായ്മയെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്കു സ്വാഭാവികവും താരതമ്യത്തിന്റെ ധാർമ്മിക ഊന്നൽ നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: γεγεννημένα φυσικὰ
  choice: സ്വാഭാവിക പ്രേരണകളാൽ നയിക്കപ്പെടുന്നവയും ... ജനിച്ചവയുമായ
  rationale: ഗ്രീക്കിലെ ചുരുക്കിയ participle–adjective ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി തുറന്നുപറയുന്നു. φυσικάയിലെ സഹജസ്വഭാവം/പ്രേരണ എന്ന ആശയവും γεγεννημέναയിലെ ജനനചിത്രവും രണ്ടും നിലനിർത്തുന്നു.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: പിടിക്കപ്പെടാനും നശിപ്പിക്കപ്പെടാനുംവേണ്ടി
  rationale: εἰς ഇവിടെ ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കുന്നു; ἅλωσις പിടിക്കപ്പെടലിനെയും φθορά നാശത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: തങ്ങൾക്കു മനസ്സിലാകാത്ത കാര്യങ്ങളെ
  rationale: നപുംസക ബഹുവചനമായ οἷς വ്യക്തികളെയല്ല, കാര്യങ്ങളെയോ വിഷയങ്ങളെയോ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ἀγνοοῦσιν എന്നത് ഇവിടെ അറിവില്ലായ്മയും ഗ്രഹിക്കായ്മയും ഉൾക്കൊള്ളുന്നു.
- source_word: βλασφημοῦντες
  choice: ദൂഷിച്ചുപറയുന്ന
  rationale: βλασφημέω ദൈവദൂഷണം എന്ന പ്രത്യേക അർഥത്തിലേക്കു മാത്രം ചുരുക്കാതെ, ശക്തമായ അപകീർത്തികരമായ/നിന്ദാപരമായ സംസാരത്തെ സൂചിപ്പിക്കാൻ ഈ പ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται
  choice: ആ മൃഗങ്ങളുടെ നാശത്തിൽ അവയെപ്പോലെതന്നെ നശിച്ചുപോകും
  rationale: φθοράയും φθαρήσονταιയും തമ്മിലുള്ള പദബന്ധം ‘നാശം/നശിച്ചുപോകും’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തുന്നു. αὐτῶν എന്നത് ഉപമയിലെ മൃഗങ്ങളെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം ശക്തമായി നിർദേശിക്കുന്നു; ‘അവയെപ്പോലെതന്നെ’ കായുടെ ബന്ധവും ഫലസാമ്യവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: βλασφημοῦντες എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ദൂഷിച്ചുപറയുന്ന
  alternative: ദൈവദൂഷണം പറയുന്ന; നിന്ദിക്കുന്ന
  rationale: ഗ്രീക്ക് പദം ശക്തമായ നിന്ദാപരമായ സംസാരത്തെ സൂചിപ്പിച്ചാലും അതിന്റെ ലക്ഷ്യം ഈ വാക്യത്തിൽ വ്യക്തമാക്കുന്നില്ല. ‘ദൈവദൂഷണം’ എന്നു വിവർത്തനം ചെയ്താൽ ലക്ഷ്യത്തെ അനാവശ്യമായി നിർണയിക്കും; ‘ദൂഷിച്ചുപറയുന്ന’ ശക്തി നിലനിർത്തിക്കൊണ്ട് അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: φθορά / φθαρήσονται എന്ന പദസമൂഹം
  choice: നാശം / നശിച്ചുപോകും
  alternative: ദുഷിപ്പ് / ദുഷിച്ചുപോകും; വിനാശം / നശിപ്പിക്കപ്പെടും
  rationale: പിടിക്കപ്പെടുകയും നശിപ്പിക്കപ്പെടുകയും ചെയ്യുന്ന മൃഗങ്ങളുടെ തൊട്ടുമുമ്പത്തെ ചിത്രം ഇവിടെ വിധിയുടെയും നാശത്തിന്റെയും അർഥത്തെ പിന്തുണയ്ക്കുന്നു. ബന്ധപ്പെട്ട പദങ്ങളുടെ ആവർത്തനം ഗ്രീക്കിലെ പദപ്രയോഗവും മുന്നറിയിപ്പിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
- issue: αὐτῶν എന്ന സർവനാമത്തിന്റെ സൂചന
  choice: ഉപമയിലെ മൃഗങ്ങളുടെ നാശത്തെ സൂചിപ്പിക്കുന്നതായി അവതരിപ്പിക്കുക
  alternative: ഇവരുടെ സ്വന്തം നാശത്തിൽ; സർവനാമം പൂർണമായി അവ്യക്തമായി നിലനിർത്തുക
  rationale: ഏറ്റവും അടുത്തതും ആശയപരമായി അനുയോജ്യവുമായ മുൻപദം മൃഗങ്ങളാണ്. എങ്കിലും ഫലം ഇവർക്കുതന്നെയാണെന്നത് ‘ഇവരും’ എന്നും ‘അവയെപ്പോലെതന്നെ’ എന്നും വ്യക്തമാക്കുന്നു; കൂടുതൽ പ്രത്യേകമായ ന്യായവിധിസിദ്ധാന്തം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; മൃഗോപമയും നാശത്തെക്കുറിച്ചുള്ള കഠിനമായ മുന്നറിയിപ്പും മൃദൂകരിച്ചിട്ടില്ല.
