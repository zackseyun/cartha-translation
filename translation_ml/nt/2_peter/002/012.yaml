revisions:
- from: എന്നാൽ ഇവർ, സ്വാഭാവിക പ്രേരണകളാൽ നയിക്കപ്പെടുന്നവയും പിടിക്കപ്പെടാനും നശിപ്പിക്കപ്പെടാനുംവേണ്ടി ജനിച്ചവയുമായ വിവേകമില്ലാത്ത മൃഗങ്ങളെപ്പോലെയാണ്[a][b]. തങ്ങൾക്കു മനസ്സിലാകാത്ത കാര്യങ്ങളെ ദൂഷിച്ചുപറയുന്ന ഇവർ[c], ആ മൃഗങ്ങളുടെ നാശത്തിൽ അവയെപ്പോലെതന്നെ നശിച്ചുപോകും[d].
  to: എന്നാൽ ഇവർ, സഹജസ്വഭാവമുള്ളവയും പിടിക്കപ്പെടാനും നശിപ്പിക്കപ്പെടാനും ജനിച്ചവയുമായ വിവേകമില്ലാത്ത മൃഗങ്ങളെപ്പോലെ, തങ്ങൾക്കു മനസ്സിലാകാത്ത കാര്യങ്ങളെ ദൂഷിച്ചുപറഞ്ഞുകൊണ്ട്, തങ്ങളുടെ നാശത്തിൽ നശിപ്പിക്കപ്പെടുകയും ചെയ്യും[a][b][c][d].
  rationale: The revision corrects the antecedent of αὐτῶν from the comparison animals to “these” people, without over-specifying whether ἐν τῇ φθορᾷ means “in,” “by,” or “amid” their destruction. It retains the source's repeated φθορ-/φθειρ- wordplay through “നാശം/നശിപ്പിക്കപ്പെടും,” keeps the object of βλασφημοῦντες unspecified, and uses natural modern Malayalam.
