id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: ml
  text: എന്നാൽ ജനത്തിനിടയിൽ കള്ളപ്രവാചകന്മാരും ഉണ്ടായി. അതുപോലെതന്നെ, നിങ്ങളുടെ ഇടയിലും കള്ളോപദേഷ്ടാക്കൾ ഉണ്ടാകും. അവർ നാശത്തിലേക്കു നയിക്കുന്ന ദുരുപദേശങ്ങൾ[a] രഹസ്യമായി കടത്തിക്കൊണ്ടുവരും; തങ്ങളെ വിലയ്ക്കു വാങ്ങിയ യജമാനനെപ്പോലും[b] നിഷേധിച്ചുകൊണ്ട്, തങ്ങൾക്കുതന്നെ അതിവേഗം നാശം വരുത്തുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നാശകരമായ കക്ഷിഭേദങ്ങൾ.’ ഗ്രീക്ക് പദത്തിന് കക്ഷികൾ, വിഭാഗങ്ങൾ, മതവിഭാഗങ്ങൾ എന്നീ അർഥങ്ങളും വരാം; ഇവിടെ നാശത്തിലേക്കു നയിക്കുന്ന ഉപദേശങ്ങളെയോ പ്രസ്ഥാനങ്ങളെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘തങ്ങളെ വീണ്ടെടുത്ത കർത്താവിനെ.’ ഗ്രീക്ക് പാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘തങ്ങളെ വാങ്ങിയ യജമാനൻ’ എന്നാണ്; ഈ വാങ്ങൽരൂപകം അതിന്റെ വ്യാപ്തിയെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രവിവാദം തീർപ്പാക്കാതെ ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: ഉണ്ടായി
  rationale: ഭൂതകാലത്തിൽ ജനത്തിനിടയിൽ കള്ളപ്രവാചകന്മാർ പ്രത്യക്ഷപ്പെട്ടതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ψευδοπροφῆται
  choice: കള്ളപ്രവാചകന്മാർ
  rationale: ഗ്രീക്ക് സംയുക്തനാമത്തിന്റെ നേരിട്ടുള്ളതും മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതവുമായ പരിഭാഷ.
- source_word: ἐν τῷ λαῷ
  choice: ജനത്തിനിടയിൽ
  rationale: ഒരു സമൂഹത്തിനുള്ളിൽ എന്ന ആശയം നിലനിർത്തുന്നു; പ്രധാനപാഠത്തിൽ ‘ഇസ്രായേൽ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്തത് ചേർക്കുന്നില്ല.
- source_word: ψευδοδιδάσκαλοι
  choice: കള്ളോപദേഷ്ടാക്കൾ
  rationale: ‘കള്ളപ്രവാചകന്മാർ’ എന്ന സമാന്തരപ്രയോഗം നിലനിർത്തുന്ന, വ്യക്തവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: παρεισάξουσιν
  choice: രഹസ്യമായി കൊണ്ടുവരും
  rationale: ഒളിഞ്ഞ രീതിയിൽ അകത്തു കടത്തിക്കൊണ്ടുവരുക എന്ന ക്രിയയുടെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: αἱρέσεις ἀπωλείας
  choice: നാശത്തിലേക്കു നയിക്കുന്ന ദുരുപദേശങ്ങൾ
  rationale: ἀπωλείας എന്നതിന്റെ ഫലസൂചനയും ഈ സന്ദർഭത്തിലെ ഉപദേശപരമായ വ്യതിചലനവും വ്യക്തമാക്കുന്നു; αἵρεσις എന്ന പദത്തിന്റെ ‘കക്ഷി/വിഭാഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὸν ... δεσπότην
  choice: യജമാനനെ
  rationale: δεσπότης എന്ന പദത്തെ κύριος എന്നതിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് അധികാരവും ഉടമസ്ഥതയും സൂചിപ്പിക്കുന്നു.
- source_word: ἀγοράσαντα αὐτοὺς
  choice: തങ്ങളെ വിലയ്ക്കു വാങ്ങിയ
  rationale: ‘വാങ്ങുക’ എന്ന വ്യാപാരരൂപകം നിലനിർത്തുകയും ‘വീണ്ടെടുക്കുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം പ്രധാനപാഠത്തിൽ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀρνούμενοι
  choice: നിഷേധിക്കുകയും
  rationale: യജമാനനെ തള്ളിപ്പറയുന്ന പ്രവൃത്തിയെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: അങ്ങനെ തങ്ങളുടെമേൽ അതിവേഗം നാശം വരുത്തുകയും ചെയ്യും
  rationale: പ്രവൃത്തിയുടെ സ്വയംവരുത്തിയ ഫലവും ταχινή എന്നതിന്റെ വേഗസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ αἱρέσεις എന്ന പദത്തിന്റെ അർഥം
  choice: ദുരുപദേശങ്ങൾ
  alternative: നാശകരമായ കക്ഷിഭേദങ്ങൾ / വിഭാഗങ്ങൾ
  rationale: രഹസ്യമായി കൊണ്ടുവരുന്നതും യജമാനനെ നിഷേധിക്കുന്നതുമായ സന്ദർഭം ഉപദേശപരമായ വ്യതിചലനത്തെ മുൻനിരയിൽ കൊണ്ടുവരുന്നു. എങ്കിലും പദത്തിന്റെ വിഭാഗം അഥവാ കക്ഷി എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: τὸν ἀγοράσαντα αὐτοὺς δεσπότην എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: തങ്ങളെ വിലയ്ക്കു വാങ്ങിയ യജമാനൻ
  alternative: തങ്ങളെ വീണ്ടെടുത്ത കർത്താവ്
  rationale: വ്യാജോപദേഷ്ടാക്കളെ യജമാനൻ ‘വാങ്ങി’ എന്ന് മൂലപാഠം പറയുന്നതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ അതേ രൂപകത്തോടെ സംരക്ഷിക്കുന്നു.
- issue: δεσπότης എന്ന പദത്തെ κύριος എന്നതിൽനിന്ന് വേർതിരിക്കൽ
  choice: യജമാനൻ
  alternative: കർത്താവ് / പരമാധികാരി
  rationale: ഗ്രീക്കിലെ വ്യത്യസ്ത പദവും അതിലുള്ള അധികാര-ഉടമസ്ഥതാഭാവവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘ദുരുപദേശങ്ങൾ’, ‘യജമാനൻ’, ‘വിലയ്ക്കു വാങ്ങിയ’ എന്നീ പ്രയോഗങ്ങൾ ഉറവിടത്തിലെ അർഥവും രൂപകവും പരമാവധി തെളിമയോടെ സംരക്ഷിക്കുന്നു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി, എന്നാൽ താരതമ്യവും പ്രവൃത്തി-ഫലബന്ധവും നിലനിർത്തി.
