  to: എന്നാൽ ജനത്തിനിടയിൽ കള്ളപ്രവാചകന്മാരും ഉണ്ടായി. അതുപോലെതന്നെ, നിങ്ങളുടെ ഇടയിലും കള്ളോപദേഷ്ടാക്കൾ ഉണ്ടാകും. അവർ നാശത്തിലേക്കു നയിക്കുന്ന ദുരുപദേശങ്ങൾ[a] രഹസ്യമായി കടത്തിക്കൊണ്ടുവരും; തങ്ങളെ വിലയ്ക്കു വാങ്ങിയ യജമാനനെപ്പോലും[b] നിഷേധിച്ചുകൊണ്ട്, തങ്ങൾക്കുതന്നെ അതിവേഗം നാശം വരുത്തുകയും ചെയ്യും.
