revisions:
- from: ധാർമികനായ ലോത്തിനെ നിയമം ലംഘിക്കുന്നവരുടെ ലജ്ജയില്ലാത്ത ദുഷ്പ്രവൃത്തികൾ നിമിത്തം കഠിനമായി മനോവേദന അനുഭവിച്ചുകൊണ്ടിരിക്കെ അവിടുന്ന് രക്ഷിച്ചു—[a][b]
  to: നിയമവിരുദ്ധരുടെ ലജ്ജയില്ലാത്ത ജീവിതരീതി[b] മൂലം കഠിനമായി പീഡിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്ന[a] നീതിമാനായ ലോത്തിനെ അവിടുന്ന് രക്ഷിച്ചു—
  rationale: The revision restores the singular, habitual sense of ἀναστροφή as «ജീവിതരീതി», avoids the added specificity of plural «ദുഷ്പ്രവൃത്തികൾ», and uses «പീഡിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്ന» to represent the ongoing passive force of καταπονούμενον. It also uses the standard biblical Malayalam term «നീതിമാനായ» for δίκαιον and moves both footnote anchors to their corresponding expressions. The implicit divine subject is appropriately retained as «അവിടുന്ന്», as supplied by the preceding context.
