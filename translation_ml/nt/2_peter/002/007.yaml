id: 2PE.2.7
reference: 2 Peter 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: ml
  text: നിയമവിരുദ്ധരുടെ ലജ്ജയില്ലാത്ത ജീവിതരീതി[b] മൂലം കഠിനമായി പീഡിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്ന[a] നീതിമാനായ ലോത്തിനെ അവിടുന്ന് രക്ഷിച്ചു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കഠിനമായി പീഡിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്ന” എന്നതിന് “ഞെരുക്കപ്പെട്ടുകൊണ്ടിരുന്ന” അല്ലെങ്കിൽ “കഠിനമായി മനോവേദന അനുഭവിച്ചുകൊണ്ടിരുന്ന” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “ജീവിതരീതി” എന്നതിന് “പെരുമാറ്റം” എന്നും പരിഭാഷപ്പെടുത്താം. “ലജ്ജയില്ലാത്ത” എന്ന പദം കാമാസക്തമോ നിയന്ത്രണമില്ലാത്തതോ ആയ ധാർമിക അതിക്രമത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: ഈ വാക്യം മുൻവാക്യത്തിലെ നിബന്ധനാപരമായ ദീർഘവാക്യത്തിന്റെ തുടർച്ചയാണ്. നൽകിയിരിക്കുന്ന ഒറ്റവാക്യത്തിൽ സ്വാഭാവികമായ മലയാളക്രമം നിലനിർത്തി, അവസാനത്തിലെ രേഖ അടുത്ത വാക്യത്തിലേക്കുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നു.
- source_word: δίκαιον
  choice: ധാർമികനായ
  rationale: ലോത്തിനെക്കുറിച്ചുള്ള ഗ്രന്ഥത്തിന്റെ വ്യക്തമായ അനുകൂല ധാർമിക വിലയിരുത്തൽ മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: Λὼτ
  choice: ലോത്തിനെ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പേരുരൂപം; ἐρρύσατο എന്ന ക്രിയയുടെ കർമമായി മലയാളത്തിലെ വിഭക്തി ചേർത്തിരിക്കുന്നു.
- source_word: καταπονούμενον
  choice: കഠിനമായി മനോവേദന അനുഭവിച്ചുകൊണ്ടിരിക്കെ
  rationale: വർത്തമാനകാല കർമണി കൃദന്തത്തിലെ തുടർച്ചയും കടുത്ത ക്ലേശവും വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി അനുഭവകർത്തൃരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς
  choice: നിയമം ലംഘിക്കുന്നവരുടെ ലജ്ജയില്ലാത്ത ദുഷ്പ്രവൃത്തികൾ നിമിത്തം
  rationale: ὑπό കാരണത്തെ സൂചിപ്പിക്കുന്നു; ἀναστροφή പെരുമാറ്റരീതിയെയും ἐν ἀσελγείᾳ അതിന്റെ ലജ്ജയില്ലാത്ത ധാർമിക അതിക്രമസ്വഭാവത്തെയും പ്രകടമാക്കുന്നു.
- source_word: τῶν ἀθέσμων
  choice: നിയമം ലംഘിക്കുന്നവരുടെ
  rationale: സ്ഥാപിതമായ നിയമത്തെയോ ശരിയായ ക്രമത്തെയോ അവഗണിക്കുന്നവരെന്ന ἄθεσμος എന്ന പദത്തിന്റെ ധാർമിക-നിയമപരമായ സൂചന നിലനിർത്തുന്നു.
- source_word: ἐν ἀσελγείᾳ
  choice: ലജ്ജയില്ലാത്ത
  rationale: ἀσέλγεια വെറും ഇന്ദ്രിയാസക്തിയേക്കാൾ വിശാലമായി ലജ്ജയില്ലാത്ത ധാർമിക അതിക്രമത്തെ സൂചിപ്പിക്കാം; സന്ദർഭം അനാവശ്യമായി ലൈംഗിക അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἀναστροφῆς
  choice: ദുഷ്പ്രവൃത്തികൾ
  rationale: ഇവിടെ ദുഷിച്ച പെരുമാറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ബഹുവചനരൂപം മലയാളത്തിൽ ആവർത്തിതമായ പെരുമാറ്റത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു. ‘ജീവിതരീതി’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: ἐρρύσατο
  choice: അവിടുന്ന് രക്ഷിച്ചു
  rationale: അപകടത്തിൽനിന്നോ നാശത്തിൽനിന്നോ വിടുവിക്കുക എന്ന ῥύομαιയുടെ അർഥം വ്യക്തമായി നൽകുന്നു; കർത്താവ് മുൻവാക്യത്തിൽ നിന്നുള്ള ദൈവമായതിനാൽ ആദരസൂചക സർവനാമം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ഉല്പത്തി വിവരണത്തിന്റെ വെളിച്ചത്തിൽ ലോത്തിന്റെ ധാർമികനില
  choice: ‘ധാർമികനായ ലോത്ത്’ എന്ന വ്യക്തമായ വിശേഷണം നിലനിർത്തി.
  alternative: ലോത്തിന്റെ പ്രവൃത്തികളെക്കുറിച്ചുള്ള വ്യാഖ്യാനപരമായ അസ്വസ്ഥത കാരണം വിശേഷണം മയപ്പെടുത്തുകയോ ഒഴിവാക്കുകയോ ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം δίκαιον എന്ന് ലോത്തിനെ നേരിട്ട് വിശേഷിപ്പിക്കുന്നു. പരിഭാഷ പാഠത്തിന്റെ സ്വന്തം വിലയിരുത്തൽ സംരക്ഷിക്കണം.
- issue: ἀσέλγεια എന്ന പദത്തിന്റെ പരിധി
  choice: ‘ലജ്ജയില്ലാത്ത’ എന്ന് പരിഭാഷപ്പെടുത്തി, ധാർമിക അതിക്രമത്തിന്റെ വിശാല അർഥം നിലനിർത്തി.
  alternative: ‘കാമാസക്തമായ’ അല്ലെങ്കിൽ ‘ലൈംഗിക ദുർവൃത്തിയുള്ള’ എന്ന് അർഥം ചുരുക്കുക.
  rationale: ഈ പദത്തിന് ലൈംഗിക ദുർവൃത്തി ഉൾപ്പെടാമെങ്കിലും അതിൽ മാത്രം ഒതുങ്ങുന്നില്ല; ‘ലജ്ജയില്ലാത്ത’ എന്നത് യഥാർഥമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ മാന്യവും തിരുവെഴുത്തിന് യോജിച്ചതുമായ ശൈലി. മുൻവാക്യത്തിൽ നിന്നുള്ള കർത്താവിനെ ‘അവിടുന്ന്’ എന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു. മൂലപാഠത്തിലെ തുടർച്ച സൂചിപ്പിക്കാൻ അവസാനം ദീർഘരേഖ നിലനിർത്തി; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാചകഭാഗത്തിന് ശേഷം പ്രധാന പാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
