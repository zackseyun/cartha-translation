id: 2PE.2.6
reference: 2 Peter 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: ml
  text: സൊദോം, ഗൊമോറ എന്നീ നഗരങ്ങളെ ചാരമാക്കി[a] നാശത്തിനു വിധിച്ച്, ഭാവിയിൽ ദൈവഭക്തിയില്ലാത്തവർക്കു അവയെ ഒരു ഉദാഹരണമാക്കി വെച്ചെങ്കിൽ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയെ ചാരമായി മാറ്റി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഭാവിയിലെ ദൈവഭക്തിയില്ലാത്തവർക്കു അവയെ ഒരു ഉദാഹരണമാക്കി വെച്ച്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τεφρώσας
  choice: ചാരമാക്കി
  rationale: ക്രിയ പട്ടണങ്ങളെ വെറുതെ കത്തിച്ചതല്ല, ചാരമാക്കി മാറ്റിയ ഫലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: καταστροφῇ
  choice: നാശത്തിനു
  rationale: κατέκρινεν എന്ന ന്യായവിധിസംബന്ധിയായ ക്രിയയോടു ചേർന്ന് വിധിയുടെ ഫലം അല്ലെങ്കിൽ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു.
- source_word: κατέκρινεν
  choice: വിധിക്കുകയും
  rationale: കുറ്റം വിധിച്ച് ശിക്ഷയ്ക്ക് ഏല്പിക്കുന്ന ന്യായവിധിയുടെ ഭാവം നിലനിർത്തുന്നു; 'നാശത്തിനു വിധിച്ചു' എന്ന കൂട്ടുപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ὑπόδειγμα
  choice: ഒരു മാതൃക
  rationale: മൂലപദത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തുന്നു; ഇതൊരു മുന്നറിയിപ്പായ മാതൃകയാണെന്ന ഭാവം ന്യായവിധിയുടെ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: μελλόντων ἀσεβέσιν
  choice: ഭാവിയിൽ ഭക്തികെട്ടവരാകുന്നവർക്ക്
  rationale: μέλλω സൂചിപ്പിക്കുന്ന ഭാവികാലബന്ധവും ἀσεβής എന്ന പദത്തിന്റെ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വഭാവവും നിലനിർത്തുന്നു; അവരുടെ ജീവിതരീതിയെക്കുറിച്ച് മൂലത്തിൽ ഇല്ലാത്ത ക്രിയ ചേർക്കുന്നില്ല.
- source_word: τεθεικώς
  choice: മാതൃകയാക്കിവെക്കുകയും
  rationale: തീരുമാനിച്ച് സ്ഥാപിച്ചതും അതിന്റെ ഫലം നിലനിൽക്കുന്നതുമായ perfect participle-ന്റെ ഭാവം 'ആക്കിവെക്കുക' സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: സൊദോം, ഗൊമൊരാ എന്നീ പട്ടണങ്ങളെ
  rationale: ഗ്രീക്കിലെ ബഹുവചനമായ 'പട്ടണങ്ങൾ' നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പേരുചേർക്കൽ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ട കർത്താവ്
  choice: വ്യക്തമായ കർത്തൃനാമമോ സർവനാമമോ ചേർക്കാതെ മലയാള ക്രിയാരൂപത്തിൽ സൂചിപ്പിച്ചു
  alternative: അവൻ / ദൈവം / കർത്താവ്
  rationale: ഈ ഉപവാക്യത്തിൽ ഗ്രീക്ക് കർത്താവിനെ വീണ്ടും പ്രസ്താവിക്കുന്നില്ല. മലയാളത്തിൽ കർത്താവിനെ ആവർത്തിക്കാതെയും വാക്യശൃംഖല സ്വാഭാവികമായി തുടരാം; അങ്ങനെ മൂലത്തിൽ ഇല്ലാത്ത ദൈവനാമമോ പദവിയോ ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
- issue: ἀσεβέσιν എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ഭക്തികെട്ടവരാകുന്നവർ
  alternative: ദൈവഭക്തിയില്ലാതെ ജീവിക്കാനിരുന്നവർ / വരാനിരിക്കുന്ന ഭക്തികെട്ടവർ
  rationale: മത-ധാർമികമായ ദൈവഭക്തിയില്ലായ്മയുടെ ഭാവം വ്യക്തികളെ സൂചിപ്പിക്കുന്ന രീതിയിൽ നൽകുന്നു; 'ജീവിക്കുക' എന്ന വ്യാഖ്യാനവികാസം പ്രധാന പാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: ὑπόδειγμα എന്നതിലെ മുന്നറിയിപ്പിന്റെ ഭാവം
  choice: ഒരു മാതൃക
  alternative: ഒരു മുന്നറിയിപ്പായ മാതൃക
  rationale: മുന്നറിയിപ്പിന്റെ ഭാവം സന്ദർഭത്തിൽ ശക്തമാണെങ്കിലും അത് പദത്തിൽ നിർബന്ധമായി തുറന്നുപറഞ്ഞിട്ടില്ല; അതിനാൽ പ്രധാന പാഠം യഥാസാധ്യം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ഗദ്യം. 2:4–9-ലെ നീണ്ട വ്യവസ്ഥാവാക്യത്തിന്റെ ഭാഗമായതിനാൽ തുടർച്ച സൂചിപ്പിക്കുന്ന ‘ചെയ്തെങ്കിൽ’ ഘടനയും അവസാനത്തിലെ അൽപവിരാമവും നിലനിർത്തി. പേരുകൾ സാധാരണ മലയാള ബൈബിൾ രൂപങ്ങളായ ‘സൊദോം’, ‘ഗൊമൊരാ’ എന്നു നൽകി.
