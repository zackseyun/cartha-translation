theological_decisions:
- issue: ταρταρώσας എന്ന പദത്തിലെ പ്രത്യേക അധോലോകസൂചന
  choice: ടാർട്ടറസിലേക്കു തള്ളിയിട്ട്
  alternative: നരകത്തിലേക്കു തള്ളിയിട്ട്
  rationale: മൂലഗ്രീക്ക് പൊതുവായ ‘നരകം’ എന്ന പദമല്ല, ടാർട്ടറസിലേക്കു നിക്ഷേപിക്കുക എന്ന പ്രത്യേക ക്രിയയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പിന്നീടുള്ള സിദ്ധാന്തപരമായ അർഥങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ ആ പ്രത്യേകത മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുന്നു.
