  choice: ടാർട്ടറസിലേക്കു തള്ളിയിട്ട്, ന്യായവിധിക്കായി കാത്തുസൂക്ഷിക്കപ്പെടേണ്ടതിന് കൂരിരുളിന്റെ ചങ്ങലകൾക്ക് ഏല്പിച്ചു
  alternative: കൂരിരുളിന്റെ ചങ്ങലകളിൽ ടാർട്ടറസിലേക്കു തള്ളി, ന്യായവിധിക്കായി കാത്തുസൂക്ഷിച്ചു
  rationale: ചങ്ങലകൾ ഉപകരണമോ സ്ഥലമോ രൂപകമോ എന്നു തീർച്ചപ്പെടുത്താതെ ഗ്രീക്കിലെ സാന്ദ്രമായ ദൃശ്യവും വ്യാകരണബന്ധവും കഴിയുന്നത്ര തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം ഗ്രീക്കിലെ Εἰ γὰρ എന്ന നിബന്ധനാ ഉപവാക്യമായതിനാൽ അടുത്ത വാക്യഭാഗത്തിലേക്കു തുടരുന്നതായി കോമയോടെ അവസാനിപ്പിച്ചു. ‘ടാർട്ടറസ്’ അപരിചിതമായിരിക്കാമെന്നതിനാൽ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
