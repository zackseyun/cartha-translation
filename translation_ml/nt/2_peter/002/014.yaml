    issue: പങ്കാളിത്തവിശേഷണങ്ങളുടെ ശ്രേണി സ്വതന്ത്രവാക്യങ്ങളായി വിഭജിച്ചിരിക്കുന്നു.
    rationale: ഗ്രീക്കിലെ കുറ്റാരോപണങ്ങളുടെ അടുക്കിവരുന്ന ഘടനയും κατάρας τέκνα എന്ന അന്തിമ അപോസിഷണൽ പ്രഖ്യാപനവും നിലനിർത്താൻ ഇവയെ ഒരൊറ്റ വിശേഷണശ്രേണിയായി നൽകുന്നതാണ് കൂടുതൽ വിശ്വസ്തം.
