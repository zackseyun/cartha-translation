  revision_rationale: പരിഷ്കരണം അർഥം മാറ്റാതെ ഗ്രീക്കിലെ തുടർച്ചയായ പങ്കാളിത്തവിശേഷണങ്ങളുടെ പട്ടിക പുനഃസ്ഥാപിക്കുന്നു. ‘പാപത്തിൽനിന്ന് ഒഴിയാത്തതുമായ’ എന്നത് ἀκαταπαύστους ἁμαρτίας എന്നതിന്റെ ‘പാപത്തിൽനിന്ന് നിർത്താത്ത/ഒഴിയാത്ത’ അടിസ്ഥാനബലം സംരക്ഷിക്കുന്നു; അടങ്ങാത്ത പാപാസക്തി എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു. വിവാദമായ μοιχαλίδος-ന്റെ മൂർത്തമായ ഏകവചനചിത്രവും അടിക്കുറിപ്പും സംരക്ഷിച്ചു.
