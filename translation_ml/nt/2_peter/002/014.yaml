  - severity: low
    issue: ‘അവ ഒരിക്കലും ഒഴിയുന്നില്ല’ എന്ന കണ്ണുകളെ സൂചിപ്പിക്കുന്ന സ്വതന്ത്രവാക്യരൂപം.
    rationale: അർഥം തെറ്റുന്നില്ലെങ്കിലും, കണ്ണുകളെ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയെ മലയാളത്തിൽ വിശേഷണമായി നിലനിർത്തുന്നതാണ് കൂടുതൽ സുതാര്യവും സ്വാഭാവികവും.
  revised_text: വ്യഭിചാരിണിയാൽ നിറഞ്ഞതും പാപത്തിൽനിന്ന് ഒഴിയാത്തതുമായ കണ്ണുകളുള്ളവർ[a][b], ഉറപ്പില്ലാത്തവരെ വശീകരിക്കുന്നവർ, അത്യാഗ്രഹത്തിൽ പരിശീലനം നേടിയ ഹൃദയമുള്ളവർ, ശാപത്തിന്റെ മക്കൾ.
