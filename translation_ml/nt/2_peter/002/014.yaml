id: 2PE.2.14
reference: 2 Peter 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: ml
  text: വ്യഭിചാരിണിയാൽ നിറഞ്ഞതും പാപത്തിൽനിന്ന് ഒഴിയാത്തതുമായ കണ്ണുകളുള്ളവർ[a][b], ഉറപ്പില്ലാത്തവരെ വശീകരിക്കുന്നവർ, അത്യാഗ്രഹത്തിൽ പരിശീലനം നേടിയ ഹൃദയമുള്ളവർ, ശാപത്തിന്റെ മക്കൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, വ്യാഖ്യാനപരമായി, “വ്യഭിചാരം നിറഞ്ഞ” അല്ലെങ്കിൽ “വ്യഭിചാരമോഹം നിറഞ്ഞ.” ഗ്രീക്കിൽ അക്ഷരാർഥം “ഒരു വ്യഭിചാരിണിയാൽ നിറഞ്ഞ” എന്നാണ്; ഇത് തീക്ഷ്ണമായ ഒരു ദൃശ്യപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “പാപം ചെയ്യുന്നതിൽനിന്ന് ഒഴിയാത്ത” അല്ലെങ്കിൽ “പാപത്തിൽനിന്ന് നിർത്താത്ത.” വ്യാഖ്യാനപരമായി, “പാപത്തോടുള്ള അടങ്ങാത്ത കൊതിയുള്ള” എന്നും.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: വ്യഭിചാരിണിയാൽ നിറഞ്ഞ
  rationale: ഗ്രീക്കിലെ ‘ഒരു വ്യഭിചാരിണിയാൽ നിറഞ്ഞ’ എന്ന മൂർത്തവും ഞെട്ടിക്കുന്നതുമായ ഏകവചനപ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു. മലയാളത്തിൽ ഇതിന്റെ അസാധാരണത ഉദ്ദേശപൂർവമായ ദൃശ്യതീവ്രത സംരക്ഷിക്കുന്നു; വ്യാഖ്യാനപരമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: പാപം ചെയ്യുന്നതിൽനിന്ന് അവ ഒരിക്കലും ഒഴിയുന്നില്ല
  rationale: ‘പാപത്തിൽനിന്ന് നിർത്താത്ത/ഒഴിയാത്ത’ എന്ന ഗ്രീക്ക് ആശയത്തോട് അടുത്തുനിൽക്കുകയും കണ്ണുകളെ വിശേഷിപ്പിക്കുന്ന ഘടന മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു. ‘പാപത്തോടുള്ള അടങ്ങാത്ത കൊതി’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: δελεάζοντες
  choice: വശീകരിക്കുന്നു
  rationale: ഇരയെ ആകർഷിച്ചു കുടുക്കുന്നതിന്റെ ഭാവമുള്ള ക്രിയയാണ്. ‘വശീകരിക്കുന്നു’ ആകർഷണത്തിന്റെയും ധാർമിക ചതിയുടെയും ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ψυχὰς ἀστηρίκτους
  choice: ഉറപ്പില്ലാത്തവരെ
  rationale: ψυχαί ഇവിടെ ശരീരത്തിൽനിന്ന് വേർപെട്ട ആത്മാക്കളെയല്ല, ദൃഢതയില്ലാത്ത മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ അർഥം തെറ്റിക്കാതെ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: അത്യാഗ്രഹത്തിൽ അഭ്യസിച്ച ഹൃദയം
  rationale: γεγυμνασμένην എന്നത് പരിശീലനംകൊണ്ട് പതിവാക്കിയ നിലയെ സൂചിപ്പിക്കുന്നു; ‘അഭ്യസിച്ച’ ആ രൂപകം നിലനിർത്തുന്നു. πλεονεξίαയുടെ അമിതമായി സ്വന്തമാക്കാനുള്ള മോഹം ‘അത്യാഗ്രഹം’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: κατάρας τέκνα
  choice: ശാപത്തിന്റെ മക്കൾ
  rationale: ‘ശാപത്തിന് വിധേയരായവർ’ എന്ന് പരത്തിപ്പറയാതെ, ഗ്രീക്കിലെ ശക്തമായ ബന്ധസൂചക പ്രയോഗം അതേ രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἔχοντες ... ἔχοντες
  choice: അവർക്കുള്ളത് ... അവർക്കുള്ളത്
  rationale: രണ്ടുതവണ വരുന്ന പങ്കാളിത്തക്രിയയുടെ ആവർത്തനവും കുറ്റാരോപണങ്ങളുടെ അടുക്കിവരവും മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: μοιχαλίδος എന്ന ലൈംഗിക ദൃശ്യപ്രയോഗം വ്യാഖ്യാനപരമായി മൃദൂകരിക്കണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘വ്യഭിചാരിണിയാൽ നിറഞ്ഞ’ എന്ന മൂർത്തരൂപം നിലനിർത്തുക
  alternative: ‘വ്യഭിചാരം നിറഞ്ഞ’ അല്ലെങ്കിൽ ‘വ്യഭിചാരമോഹം നിറഞ്ഞ’ എന്നു നൽകുക
  rationale: ഗ്രീക്കിലെ ഏകവചനവും മൂർത്തവുമായ പ്രയോഗത്തിന്റെ തീക്ഷ്ണത മൃദൂകരിക്കാതിരിക്കാൻ പ്രധാനപാഠത്തിൽ അത് സംരക്ഷിക്കുന്നു; സാധ്യതയുള്ള വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിലാക്കുന്നു.
- issue: ἀκαταπαύστους ἁμαρτίας എന്നത് അടങ്ങാത്ത പാപാസക്തിയായോ പാപത്തിൽനിന്ന് ഒഴിയാത്ത നിലയായോ നൽകണമോ
  choice: ‘പാപം ചെയ്യുന്നതിൽനിന്ന് അവ ഒരിക്കലും ഒഴിയുന്നില്ല’
  alternative: ‘പാപത്തോടുള്ള അടങ്ങാത്ത കൊതിയുള്ള’
  rationale: നിർത്താതെ തുടരുക എന്ന ഗ്രീക്ക് പദത്തിന്റെ അടിസ്ഥാനബലം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു. എന്നാൽ അടങ്ങാത്ത പാപാസക്തി എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
- issue: ψυχαί എന്നതിന് ‘ആത്മാക്കൾ’ എന്ന പരമ്പരാഗത പദമോ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന പദമോ ഉപയോഗിക്കണമോ
  choice: ‘ഉറപ്പില്ലാത്തവർ’
  alternative: ‘ഉറപ്പില്ലാത്ത ആത്മാക്കൾ’
  rationale: ഇവിടെ മുഴുവൻ മനുഷ്യരെയാണ് ചൂണ്ടിക്കാണിക്കുന്നത്; ‘ആത്മാക്കൾ’ എന്നത് ശരീരരഹിത സത്തകളെന്ന തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാം. ഇതിൽ പ്രത്യേക ആത്മശാസ്ത്ര നിലപാട് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ അടുക്കിവരുന്ന കുറ്റാരോപണങ്ങൾ ചെറുവാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചെങ്കിലും ആവർത്തനവും അവസാനത്തെ ശക്തമായ ‘ശാപത്തിന്റെ മക്കൾ’ എന്ന പ്രയോഗവും നിലനിർത്തി. ‘വ്യഭിചാരിണിയാൽ നിറഞ്ഞ’ എന്ന അസാധാരണ രൂപം ഉറവിടത്തിലെ ഉദ്ദേശപൂർവമായ ദൃശ്യതീവ്രത കാരണം സംരക്ഷിച്ചു.
