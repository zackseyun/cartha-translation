revisions:
- from: വ്യഭിചാരിണിയാൽ നിറഞ്ഞ കണ്ണുകളാണ് അവർക്കുള്ളത്[a]; പാപം ചെയ്യുന്നതിൽനിന്ന് അവ ഒരിക്കലും ഒഴിയുന്നില്ല[b]. ഉറപ്പില്ലാത്തവരെ അവർ വശീകരിക്കുന്നു. അത്യാഗ്രഹത്തിൽ അഭ്യസിച്ച ഹൃദയമാണ് അവർക്കുള്ളത്. അവർ ശാപത്തിന്റെ മക്കൾതന്നെ!
  to: വ്യഭിചാരിണിയാൽ നിറഞ്ഞതും പാപത്തിൽനിന്ന് ഒഴിയാത്തതുമായ കണ്ണുകളുള്ളവർ[a][b], ഉറപ്പില്ലാത്തവരെ വശീകരിക്കുന്നവർ, അത്യാഗ്രഹത്തിൽ പരിശീലനം നേടിയ ഹൃദയമുള്ളവർ, ശാപത്തിന്റെ മക്കൾ.
  rationale: പരിഷ്കരണം അർഥം മാറ്റാതെ ഗ്രീക്കിലെ തുടർച്ചയായ പങ്കാളിത്തവിശേഷണങ്ങളുടെ പട്ടിക പുനഃസ്ഥാപിക്കുന്നു. ‘പാപത്തിൽനിന്ന് ഒഴിയാത്തതുമായ’ എന്നത് ἀκαταπαύστους ἁμαρτίας എന്നതിന്റെ ‘പാപത്തിൽനിന്ന് നിർത്താത്ത/ഒഴിയാത്ത’ അടിസ്ഥാനബലം സംരക്ഷിക്കുന്നു; അടങ്ങാത്ത പാപാസക്തി എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു. വിവാദമായ μοιχαλίδος-ന്റെ മൂർത്തമായ ഏകവചനചിത്രവും അടിക്കുറിപ്പും സംരക്ഷിച്ചു.
