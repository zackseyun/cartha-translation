id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: ml
  text: കർത്താവും രക്ഷകനുമായ യേശു മശീഹയെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിലൂടെ ലോകത്തിന്റെ മലിനതകളിൽനിന്ന് ഒഴിഞ്ഞുമാറിയവർ വീണ്ടും അവയിൽ കുരുങ്ങി അവയാൽ തോൽപ്പിക്കപ്പെടുന്നുവെങ്കിൽ, അവരുടെ ഒടുവിലത്തെ അവസ്ഥ ആദ്യത്തേതിനെക്കാൾ മോശമായിത്തീർന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: ഒഴിഞ്ഞുമാറിയവർ
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പ് നടന്ന രക്ഷപ്പെടലിനെ സൂചിപ്പിക്കുന്ന aorist participle; മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യമായി നൽകി.
- source_word: τὰ μιάσματα τοῦ κόσμου
  choice: ലോകത്തിന്റെ മാലിന്യങ്ങൾ
  rationale: μίασμα എന്നത് മലിനമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ധാർമിക അശുദ്ധിയുടെയും മലിനീകരണത്തിന്റെയും ഭാവം നിലനിർത്തുന്നു.
- source_word: ἐν ἐπιγνώσει
  choice: പരിജ്ഞാനത്തിലൂടെ
  rationale: ἐν ഇവിടെ മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാം. ἐπίγνωσις-ന്റെ ശക്തമായ അറിവെന്ന സൂചന 'പരിജ്ഞാനം' സ്വാഭാവികമായി വഹിക്കുമ്പോഴും രക്ഷിക്കപ്പെട്ട നിലയെക്കുറിച്ചുള്ള വിവാദം നിർണയിക്കുന്നില്ല.
- source_word: τοῦ κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: കർത്താവും രക്ഷകനുമായ യേശുമശീഹയെക്കുറിച്ചുള്ള
  rationale: κύριος, σωτήρ എന്നീ പദവികൾ ഒരേ വ്യക്തിയായ യേശുവിനെ വിശേഷിപ്പിക്കുന്നു; Χριστός എന്ന പദത്തിന്റെ പദവിസ്വഭാവം 'മശീഹ'യായി നിലനിർത്തുന്നു.
- source_word: τούτοις δὲ πάλιν ἐμπλακέντες
  choice: വീണ്ടും അവയിൽ കുരുങ്ങി
  rationale: τούτοις മുമ്പുള്ള മാലിന്യങ്ങളെ സൂചിപ്പിക്കുന്നു; ἐμπλέκω-യിലെ വലയിൽപ്പെടുന്ന ദൃശ്യഭാവം 'കുരുങ്ങി' നിലനിർത്തുന്നു.
- source_word: ἡττῶνται
  choice: അവയ്ക്കു കീഴടങ്ങുന്നുവെങ്കിൽ
  rationale: തോൽപ്പിക്കപ്പെടുക, അധീനമാക്കപ്പെടുക എന്ന അർഥം നൽകുന്നു; കർത്താവ് വ്യക്തമായതിനാൽ മലയാളത്തിൽ കർമണി ഒഴിവാക്കി സ്വാഭാവികമായി നൽകി.
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: അവരുടെ ഒടുവിലത്തെ അവസ്ഥ ആദ്യത്തേതിനെക്കാൾ മോശം
  rationale: അക്ഷരാർഥത്തിലുള്ള 'അവസാന കാര്യങ്ങൾ' എന്നതിനു പകരം അവസാനത്തെ അവസ്ഥയും ആദ്യത്തെ അവസ്ഥയും തമ്മിലുള്ള താരതമ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: γέγονεν αὐτοῖς
  choice: അവരുടെ ... അവസ്ഥ ... മോശമായിത്തീർന്നിരിക്കുന്നു
  rationale: perfect ക്രിയ സൂചിപ്പിക്കുന്ന നിലവിലുള്ള ഫലാവസ്ഥ മലയാളത്തിലെ '-ത്തീർന്നിരിക്കുന്നു' എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പരിജ്ഞാനവും വിശ്വാസത്യാഗവുമായി അതിന്റെ ബന്ധവും
  choice: ἐπίγνωσις എന്നത് 'പരിജ്ഞാനം' എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി; അത് രക്ഷാകരമായ പുനർജനനമാണോ ബാഹ്യമായ പരിചയം മാത്രമാണോ എന്നു നിർവചിച്ചില്ല.
  alternative: '''രക്ഷാകരമായ പരിജ്ഞാനം'' അല്ലെങ്കിൽ ''വെറും ബാഹ്യമായ അറിവ്'''
  rationale: ഗ്രീക്ക് പദം തന്നെ ഈ ദൈവശാസ്ത്രവിവാദം തീർപ്പാക്കുന്നില്ല; അതിനാൽ വാക്യത്തിലെ യഥാർഥ സംഘർഷവും അനിശ്ചിതത്വവും നിലനിർത്തി.
- issue: Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ 'കർത്താവും രക്ഷകനുമായ യേശു' എന്ന പദവിനിരയിൽ Χριστός-ന്റെ പദവിസ്വഭാവം കേൾക്കുന്നതിനാൽ 'മശീഹ' തെരഞ്ഞെടുത്തു.
- issue: വീണ്ടും കുരുങ്ങുന്നവരുടെ അന്തിമ ആത്മീയ വിധി
  choice: അവരുടെ 'ഒടുവിലത്തെ അവസ്ഥ' ആദ്യത്തേതിനെക്കാൾ മോശമാണെന്ന് മാത്രം പറഞ്ഞു.
  alternative: അവർ രക്ഷ നഷ്ടപ്പെടുത്തി എന്നോ ഒരിക്കലും യഥാർഥമായി രക്ഷിക്കപ്പെട്ടിരുന്നില്ല എന്നോ വ്യക്തമാക്കുക
  rationale: മൂലവാക്യം ഈ വ്യവസ്ഥിത ദൈവശാസ്ത്രനിഗമനങ്ങളിൽ ഒന്നും വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ദീർഘമായ നിബന്ധനാവാക്യം സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തി. ഈ വാക്യത്തിന് അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല; അതിനാൽ പ്രധാനപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളില്ല.
