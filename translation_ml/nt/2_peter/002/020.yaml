revisions:
- from: കർത്താവും രക്ഷകനുമായ യേശുമശീഹയെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിലൂടെ ലോകത്തിന്റെ മാലിന്യങ്ങളിൽനിന്ന് ഒഴിഞ്ഞുമാറിയവർ വീണ്ടും അവയിൽ കുരുങ്ങി അവയ്ക്കു കീഴടങ്ങുന്നുവെങ്കിൽ, അവരുടെ ഒടുവിലത്തെ അവസ്ഥ ആദ്യത്തേതിനെക്കാൾ മോശമായിത്തീർന്നിരിക്കുന്നു.
  to: കർത്താവും രക്ഷകനുമായ യേശു മശീഹയെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിലൂടെ ലോകത്തിന്റെ മലിനതകളിൽനിന്ന് ഒഴിഞ്ഞുമാറിയവർ വീണ്ടും അവയിൽ കുരുങ്ങി അവയാൽ തോൽപ്പിക്കപ്പെടുന്നുവെങ്കിൽ, അവരുടെ ഒടുവിലത്തെ അവസ്ഥ ആദ്യത്തേതിനെക്കാൾ മോശമായിത്തീർന്നിരിക്കുന്നു.
