revisions:
- from: അവിടുത്തെ ദിവ്യശക്തി ജീവനും ദൈവഭക്തിക്കും വേണ്ടതെല്ലാം നമുക്കു നൽകിയിരിക്കുന്നു. തന്റെതന്നെ മഹത്ത്വത്താലും ശ്രേഷ്ഠതയാലും നമ്മെ വിളിച്ചവനെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിലൂടെയാണ് അവ നമുക്കു ലഭിച്ചത്.[a]
  to: അവിടുത്തെ ദിവ്യശക്തി, ജീവനും ദൈവഭക്തിക്കും വേണ്ടതെല്ലാം, തന്റെ സ്വന്തം മഹത്ത്വത്താലും ശ്രേഷ്ഠതയാലും നമ്മെ വിളിച്ചവനെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിലൂടെ നമുക്കു നൽകിയിരിക്കുന്നു.[a]
  rationale: മൂലവാക്യത്തിലെ മുഖ്യക്രിയയായ ‘നൽകിയിരിക്കുന്നു’ എന്നതോടു ‘പരിജ്ഞാനത്തിലൂടെ’ എന്ന മാർഗസൂചനയെ നേരിട്ട് ബന്ധിപ്പിച്ചു. ἰδίᾳ δόξῃ καὶ ἀρετῇ എന്ന വിവാദാസ്പദമായ ദത്തിവ് സമുച്ചയത്തിന്റെ പ്രധാനവായന ‘മഹത്ത്വത്താലും ശ്രേഷ്ഠതയാലും’ എന്ന നിലയിൽ നിലനിർത്തുകയും, ലക്ഷ്യസൂചനയായ മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു. വ്യാകരണവിഭക്തിയെക്കുറിച്ചുള്ള തെറ്റായ പരാമർശം ‘ദത്തിവ്’ എന്നു തിരുത്തി.
