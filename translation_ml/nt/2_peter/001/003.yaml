id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: ml
  text: അവിടുത്തെ ദിവ്യശക്തി, ജീവനും ദൈവഭക്തിക്കും വേണ്ടതെല്ലാം, തന്റെ സ്വന്തം മഹത്ത്വത്താലും ശ്രേഷ്ഠതയാലും നമ്മെ വിളിച്ചവനെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിലൂടെ നമുക്കു നൽകിയിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “തന്റെ സ്വന്തം മഹത്ത്വത്തിലേക്കും ശ്രേഷ്ഠതയിലേക്കും നമ്മെ വിളിച്ചവനെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിലൂടെ.” ഗ്രീക്കിലെ ദത്തിവ് പദസമുച്ചയം വ്യത്യസ്തമായി മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: ആശയബന്ധം സ്വാഭാവികമായ വാക്യഘടനയിലൂടെ പ്രകടിപ്പിച്ചു
  rationale: ഈ പദം തുടർന്നുവരുന്ന പ്രബോധനത്തിന്റെ അടിസ്ഥാനമോ കാരണമോ അവതരിപ്പിക്കുന്നു. ഒറ്റ വാക്യമായി വായിക്കുമ്പോൾ അസ്വാഭാവികമായ താരതമ്യപ്രയോഗം ഒഴിവാക്കി, ഗ്രീക്കിലെ അടിസ്ഥാനസൂചന നിലനിർത്തുന്ന രണ്ടു മലയാളവാക്യങ്ങളാക്കി.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: ജീവനും ദൈവഭക്തിക്കും വേണ്ടതെല്ലാം
  rationale: τὰ πρὸς എന്നത് ‘ബന്ധപ്പെട്ടവ’ അല്ലെങ്കിൽ ‘വേണ്ടവ’ എന്ന അർഥം നൽകുന്നു; ഈ രൂപം സമഗ്രതയും സ്വാഭാവികതയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: അവിടുത്തെ ദിവ്യശക്തി
  rationale: ഉടമസ്ഥതയും θεῖος എന്നതിന്റെ ദൈവിക അർഥവും മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δεδωρημένης
  choice: നൽകിയിരിക്കുന്നു
  rationale: പൂർണകാലരൂപം സൂചിപ്പിക്കുന്ന, പൂർത്തിയായിട്ടും ഫലം തുടരുന്ന ദാനത്തെ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: പരിജ്ഞാനത്തിലൂടെയാണ്
  rationale: ἐπίγνωσις എന്നതിലെ വ്യക്തവും ആഴമുള്ളതുമായ അറിവിന്റെ ഭാവം അമിതമായ സാങ്കേതികതയില്ലാതെ നൽകുന്നു.
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: നമ്മെ വിളിച്ചവനെക്കുറിച്ചുള്ള
  rationale: കർത്താവിന്റെ വ്യക്തിപരമായ പ്രവർത്തനവും വിളിയുടെ ക്രിയാഭാവവും നിലനിർത്തുന്നു.
- source_word: ἰδίᾳ
  choice: തന്റെതന്നെ
  rationale: സ്വന്തമായുള്ളത് എന്ന ἴδιος-ന്റെ ഊന്നൽ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δόξῃ
  choice: മഹത്ത്വത്താൽ
  rationale: ദൈവിക തേജസ്സും മഹിമയും ഉൾക്കൊള്ളുന്ന δόξα എന്ന പദത്തിന് സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ പരിഭാഷ.
- source_word: ἀρετῇ
  choice: ശ്രേഷ്ഠതയാൽ
  rationale: ἀρετή ഇവിടെ വെറും മാനുഷിക സദ്ഗുണത്തേക്കാൾ വിശാലമായ ഉത്കൃഷ്ടതയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ശ്രേഷ്ഠത’ തെരഞ്ഞെടുത്തു.
- source_word: ζωὴν
  choice: ജീവൻ
  rationale: ഗ്രീക്കിൽ വിശേഷണമില്ലാത്തതിനാൽ ഇപ്പോഴത്തെയും ഭാവിയിലെയും അർഥസാധ്യതകൾ നിലനിർത്തുന്ന വിശാലമായ പദം ഉപയോഗിച്ചു.
- source_word: εὐσέβειαν
  choice: ദൈവഭക്തി
  rationale: ദൈവത്തോടുള്ള ഭക്തിയും അതിനനുസരിച്ചുള്ള ജീവിതവും ഉൾക്കൊള്ളുന്ന εὐσέβεια എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: ἰδίᾳ δόξῃ καὶ ἀρετῇ എന്ന ദ്വിതീയാവിഭക്തിപദസമുച്ചയം മാർഗമാണോ ലക്ഷ്യമാണോ എന്നത്
  choice: തന്റെതന്നെ മഹത്ത്വത്താലും ശ്രേഷ്ഠതയാലും
  alternative: തന്റെതന്നെ മഹത്ത്വത്തിലേക്കും ശ്രേഷ്ഠതയിലേക്കും
  rationale: SBLGNT പാഠത്തിലെ ദ്വിതീയാവിഭക്തി ഏറ്റവും സ്വാഭാവികമായി ഉപകരണമോ മാർഗമോ സൂചിപ്പിക്കാമെന്നതിനാൽ പ്രധാനപാഠത്തിൽ ആ അർഥം സ്വീകരിച്ചു. ലക്ഷ്യസൂചനയായ വ്യാഖ്യാനവും വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ ശൈലി. ദൈർഘ്യമേറിയ ഗ്രീക്ക് ഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി; ആശയബന്ധം നിലനിർത്തി. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിൽ ആദരസൂചകമായ ‘അവിടുത്തെ’ ഉപയോഗിച്ചു.
