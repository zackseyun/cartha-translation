id: 2PE.1.12
reference: 2 Peter 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങൾ ഇവ അറിയുന്നവരും ഇപ്പോൾ നിങ്ങളുടെ ഇടയിലുള്ള സത്യത്തിൽ ഉറപ്പിക്കപ്പെട്ടവരുമാണെങ്കിലും, ഇവയെക്കുറിച്ച് നിങ്ങളെ എപ്പോഴും ഓർമിപ്പിക്കാൻ ഞാൻ സന്നദ്ധനായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾക്ക് ഇപ്പോഴുള്ള സത്യത്തിൽ.’
    reason: παρούσῃ എന്ന പദം ‘നിങ്ങളുടെ ഇടയിൽ സന്നിഹിതമായ’ എന്നും ‘നിങ്ങൾക്ക് ഇപ്പോഴുള്ള’ എന്നും മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: Διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μελλήσω
  choice: ഞാൻ സന്നദ്ധനായിരിക്കും
  rationale: μέλλω എന്നതിന്റെ ഭാവികാലരൂപം ഇവിടെ വെറും ഭാവിക്രിയയേക്കാൾ ഉദ്ദേശ്യവും സന്നദ്ധതയും സൂചിപ്പിക്കുന്നു.
- source_word: ἀεὶ
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായോ ആവർത്തിച്ചോ ചെയ്യുന്ന പ്രവൃത്തിയുടെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ὑπομιμνῄσκειν
  choice: ഓർമിപ്പിക്കാൻ
  rationale: ഒരാളെ ഓർക്കാൻ പ്രേരിപ്പിക്കുക എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം; ആവർത്തനഭാവം ἀεὶ നൽകുന്നു.
- source_word: περὶ τούτων
  choice: ഇവയെക്കുറിച്ച്
  rationale: περί + ജനിറ്റീവ് എന്നതിന്റെ ‘ഇവ സംബന്ധിച്ച്’ എന്ന അർഥം ലളിതമായി നൽകുന്നു.
- source_word: καίπερ
  choice: ആണെങ്കിലും
  rationale: വാക്യത്തിലെ concessive ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰδότας
  choice: ഇവ അറിയുന്നവരും
  rationale: അറിവിന്റെ വിഷയം മുൻപുള്ള ‘ഇവ’ ആണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐστηριγμένους
  choice: ഉറപ്പിക്കപ്പെട്ടവരും
  rationale: പൂർണ നിഷ്ക്രിയ പങ്കാളിക്രിയയുടെ മുൻപ് സംഭവിച്ച ഉറപ്പിക്കലും തുടരുന്ന അവസ്ഥയും സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: ഇപ്പോൾ നിങ്ങളുടെ ഇടയിലുള്ള സത്യത്തിൽ
  rationale: παρούσῃ എന്നതിന്റെ ‘സന്നിഹിതമായ/ഇപ്പോൾ ഉള്ള’ ഭാവം നിലനിർത്തുന്നു; പ്രത്യേക സാങ്കേതിക ദൈവശാസ്ത്രാർഥം ചുമത്തുന്നില്ല.
theological_decisions:
- issue: ‘ഇപ്പോൾ സന്നിഹിതമായ സത്യം’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ഇപ്പോൾ നിങ്ങളുടെ ഇടയിലുള്ള സത്യം
  alternative: നിങ്ങൾക്ക് ഇപ്പോഴുള്ള സത്യം; ഇപ്പോഴത്തെ സത്യം
  rationale: ഗ്രീക്ക് പ്രയോഗം വായനക്കാരുടെ ഇടയിൽ ഇപ്പോൾ സന്നിഹിതമായതോ അവർ കൈവശം വച്ചിരിക്കുന്നതോ ആയ സത്യത്തെ സൂചിപ്പിക്കാം. ഒരു പ്രത്യേക യുഗപരമായ സാങ്കേതിക അർഥം ചുമത്താതെ ഈ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉറപ്പിക്കപ്പെട്ടവർ’ എന്ന നിഷ്ക്രിയരൂപം മൂലത്തിലെ വ്യാകരണഭാവം നിലനിർത്തുന്നു; അസാധാരണമായ ‘present truth’ എന്ന പ്രയോഗം വ്യാഖ്യാനിച്ച് തീർക്കാതെ പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും അതിന്റെ സാധ്യതകൾ സംരക്ഷിക്കുന്നു.
