id: 2PE.1.1
reference: 2 Peter 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: ml
  text: 'മശീഹയായ യേശുവിന്റെ അടിമയും അപ്പൊസ്തലനുമായ ശിമെയോൻ പത്രോസ്, നമ്മുടെ ദൈവവും രക്ഷകനുമായ മശീഹയായ യേശുവിന്റെ[c] നീതിയിൽ[b] നമ്മുടേതിനു തുല്യമായ വിശ്വാസം[a] ലഭിച്ചവർക്ക്:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നമ്മുടേതിനു തുല്യമായ പദവിയുള്ള വിശ്വാസം’ അല്ലെങ്കിൽ ‘നമ്മുടേതുപോലെതന്നെ വിലയേറിയ വിശ്വാസം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് വിശേഷണം തുല്യമായ മൂല്യം, ബഹുമാനം, അല്ലെങ്കിൽ അവകാശസ്ഥാനം എന്നിവ ഊന്നിപ്പറയാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നീതിയിലൂടെ’ അല്ലെങ്കിൽ ‘നീതിയാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് മുൻനിപാതം ഒരു മണ്ഡലത്തെയോ ഉപാധിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'ഗ്രീക്ക് വ്യാകരണപ്രകാരം ഇവിടെ മശീഹയായ യേശുവിനെയാണ് ‘നമ്മുടെ ദൈവവും രക്ഷകനും’ എന്നു വിളിക്കുന്നതായുള്ള വായനയാണ് ഏറ്റവും സ്വാഭാവികം. കുറഞ്ഞ സാധ്യതയുള്ള മറ്റൊരു വായന: ‘നമ്മുടെ ദൈവത്തിന്റെയും രക്ഷകനായ മശീഹയായ യേശുവിന്റെയും നീതിയിൽ’; ഇതിൽ രണ്ടു വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: ശിമെയോൻ പത്രോസ്
  rationale: SBLGNT-യിലെ Συμεών എന്ന രൂപം നേരിട്ട് പ്രതിഫലിപ്പിക്കാൻ ‘ശിമെയോൻ’ ഉപയോഗിച്ചു; Πέτρος എന്ന പേരിന്റെ മലയാളത്തിലെ സ്ഥാപിതരൂപമാണ് ‘പത്രോസ്’.
- source_word: δοῦλος
  choice: അടിമ
  rationale: വെറും സേവനം ചെയ്യുന്നതിനെക്കാൾ യേശുവിനോടുള്ള സമ്പൂർണ ഉടമസ്ഥബന്ധം സൂചിപ്പിക്കുന്ന δοῦλος എന്ന പദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἀπόστολος
  choice: അപ്പൊസ്തലൻ
  rationale: പ്രത്യേകമായി നിയോഗിക്കപ്പെട്ട ദൂതന്റെ ഔദ്യോഗികപങ്ക് സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാളപദം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശു
  rationale: Χριστός ഒരു സ്ഥാനപ്പേരാണെന്ന അർഥം വ്യക്തമാക്കുകയും സ്വാഭാവികമായ മലയാളവാക്യഘടന പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῖς ... λαχοῦσιν
  choice: ലഭിച്ചവർക്ക്
  rationale: വിശ്വാസം സ്വയം നേടിയെടുത്തതല്ല, ലഭിച്ചതാണെന്ന ആശയം വ്യക്തമാക്കുന്നു; ചീട്ടിട്ട് ലഭിക്കുന്നതിന്റെ ദൃശ്യരൂപം അനാവശ്യമായി കടുപ്പിക്കുന്നില്ല.
- source_word: ἰσότιμον ... πίστιν
  choice: നമ്മുടേതിനോടു തുല്യമായ വിലയുള്ള വിശ്വാസം
  rationale: ἰσότιμος സൂചിപ്പിക്കുന്ന തുല്യമായ മൂല്യം, ബഹുമാനം, പദവി എന്നീ അർഥസാധ്യതകളിൽ ‘തുല്യമായ വില’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ കൊടുത്തു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: ഇവിടെ വിശ്വാസികളുടെ പൊതുവായ വിശ്വാസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വിശ്വസ്തത’ എന്നതല്ല സന്ദർഭത്തിന് കൂടുതൽ സ്വാഭാവികം.
- source_word: ἐν δικαιοσύνῃ
  choice: നീതിയിൽ
  rationale: ἐν എന്ന പൂർവപ്രത്യയത്തിന്റെ മണ്ഡലാർഥവും ഉപാധ്യർഥവും നിർബന്ധമായി ഒന്നിലേക്കു ചുരുക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: δικαιοσύνῃ
  choice: നീതി
  rationale: ദൈവത്തിന്റെ ശരിയായതും നീതിപൂർവവുമായ പ്രവർത്തനത്തെ ഉൾക്കൊള്ളുന്ന, സന്ദർഭത്തിന് യോജിച്ച സ്ഥാപിതമായ മലയാളപദം.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: നമ്മുടെ ദൈവവും രക്ഷകനുമായ മശീഹയായ യേശു
  rationale: ഒരൊറ്റ നിർദേശകപദത്തിന്റെ കീഴിലുള്ള θεός, σωτήρ എന്നീ ഏകവചന വ്യക്തിനാമങ്ങൾ ഒരേ വ്യക്തിയെ—യേശുവിനെ—സൂചിപ്പിക്കുന്നു എന്ന ഏറ്റവും സ്വാഭാവികമായ ഗ്രീക്ക് വായന മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘നമ്മുടെ ദൈവവും രക്ഷകനുമായ മശീഹയായ യേശു’ എന്നത് ഒരാളെ സൂചിപ്പിക്കുന്നുവോ രണ്ടുപേരെ സൂചിപ്പിക്കുന്നുവോ
  choice: യേശുവിനെയാണ് ‘നമ്മുടെ ദൈവവും രക്ഷകനും’ എന്നു വിളിക്കുന്ന ഏകവ്യക്തി വായന
  alternative: ‘നമ്മുടെ ദൈവം’ എന്നും ‘രക്ഷകനായ മശീഹയായ യേശു’ എന്നും രണ്ടു വ്യക്തികളെ സൂചിപ്പിക്കുന്ന വായന
  rationale: τοῦ എന്ന ഒരൊറ്റ നിർദേശകപദം καί കൊണ്ട് ബന്ധിപ്പിച്ച θεοῦ, σωτῆρος എന്നീ ഏകവചന വ്യക്തിനാമങ്ങളെ നിയന്ത്രിക്കുന്നതിനാൽ ഒരേയൊരു സൂചിതവ്യക്തിയെന്ന വായനയാണ് കൊയ്നേ ഗ്രീക്കിൽ ഏറ്റവും സ്വാഭാവികം. ദൈവശാസ്ത്രപരമായ പ്രാധാന്യം കണക്കിലെടുത്ത് കുറഞ്ഞ സാധ്യതയുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ കത്തുരൂപഭാഷ ഉപയോഗിച്ചു. δοῦλος എന്ന പദത്തിന്റെ ബന്ധപരമായ ശക്തി നിലനിർത്താൻ ‘ദാസൻ’ എന്നതിനു പകരം ‘അടിമ’ സ്വീകരിച്ചു. Χριστός എന്ന സ്ഥാനപ്പേര് പേരായി മങ്ങിപ്പോകാതിരിക്കാൻ ‘മശീഹയായ യേശു’ എന്നു പരിഭാഷപ്പെടുത്തി. മൂലഗ്രീക്കിലെ ദീർഘമായ അഭിവാദനവാക്യം വായനാസൗകര്യത്തോടെ നിലനിർത്താൻ അവസാനം ‘എഴുതുന്നത്’ ചേർത്തു.
