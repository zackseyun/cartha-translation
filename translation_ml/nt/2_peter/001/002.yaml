id: 2PE.1.2
reference: 2 Peter 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: ml
  text: ദൈവത്തെയും നമ്മുടെ കർത്താവായ യേശുവിനെയും കുറിച്ചുള്ള അറിവിൽ നിങ്ങൾക്കു കൃപയും സമാധാനവും വർധിക്കട്ടെ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തെയും നമ്മുടെ കർത്താവായ യേശുവിനെയും കുറിച്ചുള്ള അറിവിലൂടെ.” ഗ്രീക്ക് മുൻനിലപദമായ ἐν ഇവിടെ “അറിവിൽ” എന്ന സാഹചര്യമോ “അറിവിലൂടെ” എന്ന മാർഗമോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “അറിവ്” എന്നതിന് “പൂർണമായ അറിവ്” എന്നും പരിഭാഷപ്പെടുത്താം. ἐπίγνωσις എന്ന ഗ്രീക്ക് പദത്തിന് കൂടുതൽ പൂർണമായ അറിവ് എന്ന സൂചന ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: ലേഖനാശംസയിലെ പതിവുപദവും ദൈവിക പ്രീതിയുടെ ദൈവശാസ്ത്രപരമായ അർഥവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: ആശംസയിലെ പരമ്പരാഗത അർഥവും ശാലോം എന്ന പശ്ചാത്തലത്തിലെ സമഗ്രക്ഷേമസൂചനയും സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: πληθυνθείη
  choice: വർധിച്ചുവരട്ടെ
  rationale: ആശംസയോ പ്രാർഥനയോ സൂചിപ്പിക്കുന്ന optative ഭാവവും അളവിൽ പെരുകുക എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ passive രൂപം മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ ആശംസാരൂപത്തിൽ അവതരിപ്പിച്ചു.
- source_word: ἐν
  choice: -ത്തിൽ (അറിയുന്നതിൽ)
  rationale: പ്രധാനപാഠത്തിൽ വ്യാപ്തി/മേഖല എന്ന അർഥം നിലനിർത്തുന്നു; മാർഗം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐπιγνώσει
  choice: അറിയുന്നതിൽ
  rationale: ബന്ധപരവും സജീവവുമായ അറിവിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പൂർണമായ അറിവ്’ എന്ന ശക്തമായ സൂചന ഉറപ്പിച്ച് ചുമത്തുന്നില്ല.
- source_word: θεοῦ
  choice: ദൈവത്തെ
  rationale: ἐπίγνωσις എന്ന പദത്തിന്റെ genitive പൂരകത്തെ മലയാളത്തിലെ ‘അറിയുക’ എന്ന ക്രിയയോടു ചേർന്ന കർമരൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἰησοῦ
  choice: യേശുവിനെ
  rationale: വ്യക്തിനാമത്തിന്റെ സ്ഥാപിത മലയാളരൂപം ഉപയോഗിക്കുകയും ‘അറിയുക’ എന്നതിന്റെ രണ്ടാമത്തെ കർമമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിയുടെ ഭാരവും പുതിയനിയമത്തിലെ പതിവുപയോഗവും നിലനിർത്തുന്ന സ്ഥാപിത മലയാളരൂപം.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: ദൈവത്തെയും നമ്മുടെ കർത്താവായ യേശുവിനെയും
  rationale: ദൈവവും യേശുവും രണ്ടുപേരും ἐπίγνωσις എന്നതിനെ ആശ്രയിക്കുന്നതായി മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി കാണിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ആശയവ്യത്യാസം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ആത്മീയസന്ദർഭത്തിലെ ἐπίγνωσις എന്ന പദത്തിന്റെ ശക്തമായ സൂചന
  choice: അറിയുന്നത്
  alternative: പൂർണമായി അറിയുന്നത് / പൂർണമായ അറിവ്
  rationale: ഈ പദത്തിന് സമ്പൂർണമായോ കൂടുതൽ ആഴമുള്ളതായോ അറിവിന്റെ സൂചന ഉണ്ടാകാമെങ്കിലും, പ്രധാനപാഠത്തിൽ അത് നിർബന്ധിത സാങ്കേതിക അർഥമാക്കി മാറ്റാതെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ἐπιγνώσει എന്നതിനോടൊപ്പമുള്ള ἐν എന്ന പദത്തിന്റെ പ്രവർത്തനം
  choice: അറിയുന്നതിൽ
  alternative: അറിയുന്നതിലൂടെ / അറിവിനാൽ
  rationale: ഗ്രീക്ക് പദം മേഖല (‘-ത്തിൽ’) എന്നും മാർഗം (‘-ത്തിലൂടെ’) എന്നും മനസ്സിലാക്കാവുന്നതാണ്. പ്രധാനപാഠം ആദ്യത്തേതു സ്വീകരിക്കുകയും മറ്റേതു അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്ത് വ്യാഖ്യാനതുറപ്പ് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ലേഖനാശംസാശൈലി. ‘വർധിച്ചുവരട്ടെ’ എന്നത് ആശംസയുടെ സ്വാഭാവികത കാത്തുസൂക്ഷിക്കുന്നു; രണ്ട് അടിക്കുറിപ്പുകളുടെയും സൂചകങ്ങൾ പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
