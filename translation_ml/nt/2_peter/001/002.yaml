- from: ദൈവത്തെയും നമ്മുടെ കർത്താവായ യേശുവിനെയും അറിയുന്നതിൽ നിങ്ങൾക്കു കൃപയും സമാധാനവും വർധിച്ചുവരട്ടെ[a][b].
