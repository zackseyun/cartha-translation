id: 2PE.1.19
reference: 2 Peter 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: ml
  text: നമുക്കു കൂടുതൽ ഉറപ്പുള്ള പ്രവാചകവചനമുണ്ട്[a]; ഇരുണ്ട സ്ഥലത്ത് പ്രകാശിക്കുന്ന ഒരു വിളക്കിന് എന്നപോലെ അതിനു ശ്രദ്ധ നൽകുന്നതു നിങ്ങൾ നന്നായി ചെയ്യുന്നു—പകൽ പുലരുകയും പ്രഭാതനക്ഷത്രം[b] നിങ്ങളുടെ ഹൃദയങ്ങളിൽ ഉദിക്കുകയും ചെയ്യുന്നതുവരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “പ്രവാചകവചനം നമുക്ക് കൂടുതൽ ഉറപ്പുള്ളതാണ്.” അപ്പൊസ്തലന്മാരുടെ ദൃക്സാക്ഷ്യം പ്രവാചകവചനത്തെ സ്ഥിരീകരിക്കുന്നു എന്നോ, പ്രവാചകവചനത്തിന്റെ ഉറപ്പുള്ള സ്വഭാവത്തെയാണ് ഇവിടെ ഊന്നുന്നതെന്നോ ഗ്രീക്ക് വാചകം മനസ്സിലാക്കാം.'
    reason: alternative_reading
  - marker: b
    text: “പ്രഭാതനക്ഷത്രം” എന്ന പ്രയോഗത്തിന് മശീഹായെ സൂചിപ്പിക്കുന്ന പ്രതിധ്വനി ഉണ്ടായേക്കാം; വെളിപ്പാട് 22:16 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: കൂടുതൽ ഉറപ്പുള്ളതാണ്
  rationale: താരതമ്യാർഥം നിലനിർത്തുന്നു. ഗ്രീക്ക് പദം പ്രവാചകവചനത്തിന്റെ ഉറപ്പിനെ ഊന്നുന്നതായോ മുൻപറഞ്ഞ അപ്പൊസ്തലസാക്ഷ്യത്താൽ അതിന്റെ ഉറപ്പ് സ്ഥിരീകരിക്കപ്പെട്ടതായോ മനസ്സിലാക്കാം; മുഖ്യപാഠം അതിനെ അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: προφητικὸν λόγον
  choice: പ്രവാചകവചനം
  rationale: ‘പ്രവാചക’വും ‘വചനം’ എന്ന ആശയവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്ന പ്രയോഗം.
- source_word: ᾧ ... προσέχοντες
  choice: അതിനു ശ്രദ്ധ നൽകുന്നത്
  rationale: ശ്രദ്ധാപൂർവം ചെവികൊടുക്കുക എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: λύχνῳ φαίνοντι
  choice: പ്രകാശിക്കുന്ന ഒരു വിളക്ക്
  rationale: വിളക്കിന്റെ ഉപമയും വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടർച്ചയായ പ്രകാശവും നിലനിർത്തുന്നു.
- source_word: αὐχμηρῷ τόπῳ
  choice: ഇരുണ്ട സ്ഥലം
  rationale: വിളക്കിന്റെ ദൃശ്യരൂപവുമായി യോജിക്കുന്നതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ അർഥം.
- source_word: ἡμέρα διαυγάσῃ
  choice: പകൽ പുലരുക
  rationale: ദിവസം ഉദിച്ച് വെളിച്ചമാകുന്ന ദൃശ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: φωσφόρος
  choice: പ്രഭാതനക്ഷത്രം
  rationale: സന്ദർഭത്തിലെ ആകാശഗോളരൂപകം വ്യക്തമായി നിലനിർത്തുന്നു; മുഖ്യപാഠത്തിൽ അതിന്റെ സൂചിത വ്യക്തിയെ നിർണയിക്കുന്നില്ല.
- source_word: ἀνατείλῃ
  choice: ഉദിക്കുക
  rationale: നക്ഷത്രത്തിന്റെ ഉദയത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ദൃശ്യസമ്പന്നവുമായ പദം.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളിൽ
  rationale: ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം വിശദീകരണം ചേർക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: βεβαιότερον എന്ന താരതമ്യപദവും പ്രവാചകവചനവും അപ്പൊസ്തലസാക്ഷ്യവും തമ്മിലുള്ള ബന്ധം
  choice: പ്രവാചകവചനം നമുക്ക് കൂടുതൽ ഉറപ്പുള്ളതാണ്
  alternative: കൂടുതൽ ഉറപ്പുള്ള പ്രവാചകവചനം നമുക്കുണ്ട്
  rationale: ആദ്യ രൂപം മുൻസന്ദർഭത്തിലെ ദൃക്സാക്ഷ്യത്താൽ വചനം സ്ഥിരീകരിക്കപ്പെടുന്ന സാധ്യത തുറന്നുവെക്കുന്നു; ബദൽ രൂപം അതിന്റെ സ്വതസിദ്ധമായ ഉറപ്പിനെ കൂടുതൽ ഊന്നാം. ഗ്രീക്കിലെ രണ്ടു സാധ്യതകളും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: പ്രഭാതനക്ഷത്രത്തിന്റെ സൂചിതാർഥം
  choice: പ്രഭാതനക്ഷത്രം എന്ന രൂപകം തിരിച്ചറിയൽ ചേർക്കാതെ നിലനിർത്തി
  alternative: ക്രിസ്തുവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിക്കുക
  rationale: മശീഹാസംബന്ധമായ പ്രതിധ്വനി ഉണ്ടായേക്കാമെങ്കിലും ഈ വാക്യം തന്നെ അതിനെ തുറന്നുപറയുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ശ്രദ്ധ നൽകുക,’ ‘പകൽ പുലരുക,’ ‘ഉദിക്കുക’ എന്നീ പൊതുവായി ഗ്രഹിക്കാവുന്ന പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; പഴഞ്ചൻ പദങ്ങളും സഭാവിഭാഗസവിശേഷമായ വ്യാഖ്യാനങ്ങളും ഒഴിവാക്കി.
