id: 2PE.1.15
reference: 2 Peter 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: ml
  text: എന്റെ വേർപാടിനുശേഷം നിങ്ങൾക്ക് എപ്പോൾ വേണമെങ്കിലും ഈ കാര്യങ്ങൾ ഓർത്തെടുക്കാൻ കഴിയേണ്ടതിന് ഞാൻ എല്ലാ ശ്രമവും നടത്തും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδάσω
  choice: ഞാൻ എല്ലാ ശ്രമവും നടത്തും
  rationale: ഭാവികാല ക്രിയ ആത്മാർഥമായ ഉത്സാഹവും പരമാവധി പരിശ്രമവും സൂചിപ്പിക്കുന്നു; ആ തീവ്രത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: δὲ καὶ
  choice: …കഴിയേണ്ടതിന്
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, മുൻവാക്യത്തിന്റെ തുടർച്ചയാണ്; καί ചേർന്ന അനന്തക്രിയാ ഘടന പത്രോസിന്റെ ശ്രമത്തിന്റെ തുടർലക്ഷ്യം പ്രകടമാക്കുന്നു. മലയാള വാക്യക്രമത്തിൽ ലക്ഷ്യപ്രത്യയം ഉപയോഗിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: ἑκάστοτε
  choice: എപ്പോൾ വേണമെങ്കിലും
  rationale: ഓരോ അവസരത്തിലും അഥവാ ആവശ്യമുള്ള ഏതു സമയത്തും എന്ന പ്രായോഗിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἔχειν ὑμᾶς
  choice: നിങ്ങൾക്ക് … കഴിയേണ്ടതിന്
  rationale: ἔχειν എന്നത് ഈ ഘടനയിൽ കഴിവോ അവസരമോ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘ഉണ്ടായിരിക്കുക’ എന്നതിനെക്കാൾ ഈ പരിഭാഷ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: എന്റെ വേർപാടിനുശേഷവും
  rationale: ἔξοδος എന്ന പദത്തിലെ ‘പുറപ്പെടൽ/വേർപാട്’ എന്ന രൂപകം നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് മരണമാണ് എന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു. καί നൽകുന്ന തുടർച്ചാഭാവം മലയാളത്തിലെ ‘-വും’ കൊണ്ടും പ്രകടമാക്കുന്നു.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: ഈ കാര്യങ്ങൾ ഓർത്തെടുക്കാൻ
  rationale: ഈ ഗ്രീക്ക് ശൈലിയുടെ അർഥം കാര്യങ്ങളെ മനസ്സിലേക്കു തിരികെ കൊണ്ടുവരിക എന്നതാണ്; ‘ഓർത്തെടുക്കുക’ അതിന്റെ സജീവഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τούτων
  choice: ഈ കാര്യങ്ങൾ
  rationale: സമീപസന്ദർഭത്തിൽ പത്രോസ് ഊന്നിപ്പറഞ്ഞ കാര്യങ്ങളിലേക്കുള്ള നേരിട്ടുള്ള സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ ആസന്നമായ അന്ത്യം സൂചിപ്പിക്കുന്ന ἔξοδος എന്ന പദത്തിന്റെ അർഥം
  choice: വേർപാട്
  alternative: മരണം; പുറപ്പാട്
  rationale: മൂലപാഠം മരണത്തെ രൂപകാത്മകമായി ‘പുറപ്പെടൽ’ എന്നു വിളിക്കുന്നു. ‘വേർപാട്’ ആ രൂപകവും ഗൗരവമുള്ള ഭാവവും നിലനിർത്തുന്നു; ‘മരണം’ അർഥം തുറന്നുപറയുന്നുവെങ്കിലും രൂപകം ഇല്ലാതാക്കും, ‘പുറപ്പാട്’ മലയാളത്തിൽ ഇവിടെ അസ്വാഭാവികമോ പ്രത്യേക പുറപ്പാട്-സൂചനയായി തെറ്റിദ്ധരിക്കപ്പെടാവുന്നതോ ആണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ലക്ഷ്യബന്ധവും ἔξοδος എന്ന മരണരൂപകവും സംരക്ഷിച്ചുകൊണ്ട് സ്വാഭാവിക മലയാള വാക്യക്രമം സ്വീകരിച്ചു.
