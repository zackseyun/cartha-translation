id: 2PE.1.21
reference: 2 Peter 1:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: ml
  text: പ്രവചനം ഒരിക്കലും മനുഷ്യന്റെ ഇഷ്ടത്താൽ ഉളവാക്കപ്പെട്ടതല്ല[a]; മറിച്ച്, പരിശുദ്ധാത്മാവിനാൽ വഹിക്കപ്പെട്ട്[b] മനുഷ്യർ ദൈവത്തിൽനിന്ന് സംസാരിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൊണ്ടുവരപ്പെട്ടതല്ല’ അല്ലെങ്കിൽ ‘ഉത്പാദിപ്പിക്കപ്പെട്ടതല്ല’; ഗ്രീക്കിലെ ക്രിയ നിഷ്ക്രിയരൂപത്തിലാണ്, പിന്നീട് വരുന്ന ‘വഹിക്കപ്പെട്ട്’ എന്ന കൃദന്തരൂപവുമായി അതിന് പദബന്ധമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘പരിശുദ്ധാത്മാവിനാൽ വഹിക്കപ്പെട്ട്.’ ആത്മാവിന്റെ സജീവമായ പ്രേരണയ്ക്കും മുന്നോട്ടുനയിക്കലിനും ഗ്രീക്ക് ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: ‘മനുഷ്യൻ,’ ‘മനുഷ്യർ’ എന്നിവയ്ക്കുള്ള ഗ്രീക്ക് പദങ്ങൾ ഇവിടെ മനുഷ്യരെ പൊതുവായി പ്രതിനിധാനം ചെയ്യുന്നു; സ്ത്രീകളെ ഒഴിവാക്കുക എന്നതല്ല ഉദ്ദേശ്യം.
    reason: cultural_note
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: മനുഷ്യന്റെ ഇഷ്ടത്താൽ
  rationale: 'നിഷ്ക്രിയക്രിയയോടൊപ്പമുള്ള ദത്തിവിഭക്തി ഇവിടെ ഉപകരണാർഥം നൽകുന്നു: പ്രവചനത്തിന്റെ ഉത്ഭവം മനുഷ്യന്റെ ഇച്ഛയിലൂടെയല്ല. ഏകവചനത്തിലുള്ള ἀνθρώπου-ന്റെ പൊതുവായ മാനുഷിക അർഥം ഈ പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.'
- source_word: ἠνέχθη
  choice: ഉളവായതല്ല
  rationale: φέρω എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയരൂപം പ്രവചനം മനുഷ്യേച്ഛയാൽ കൊണ്ടുവരപ്പെട്ടതോ ഉദ്ഭവിപ്പിക്കപ്പെട്ടതോ അല്ലെന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ഉളവായത്’ സ്വീകരിച്ചു; നിഷ്ക്രിയതയുടെ കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: προφητεία
  choice: പ്രവചനം
  rationale: പ്രവാചകവെളിപ്പാടിനെയോ പ്രവാചകവചനത്തെയോ പൊതുവായി സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: ποτέ
  choice: ഒരിക്കലും
  rationale: οὐ-യോടൊപ്പം ποτέ ശക്തമായ നിഷേധമായ ‘ഒരിക്കലും ... അല്ല’ എന്ന അർഥം നൽകുന്നു.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിനാൽ
  rationale: ὑπό + ഷഷ്ഠിവിഭക്തി പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ ആത്മാവ് നിർദിഷ്ടനായ പരിശുദ്ധാത്മാവാണ്.
- source_word: φερόμενοι
  choice: നയിക്കപ്പെട്ടുകൊണ്ട്
  rationale: φέρω എന്ന ക്രിയയുടെ നിഷ്ക്രിയ വർത്തമാനകൃദന്തം ആത്മാവിന്റെ സജീവമായ പ്രേരണയും വഴിനടത്തലും ചിത്രീകരിക്കുന്നു. മലയാളത്തിൽ ‘നയിക്കപ്പെട്ടുകൊണ്ട്’ സ്വാഭാവികമാണ്; ‘വഹിക്കപ്പെട്ടുകൊണ്ട്’ എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐλάλησαν
  choice: സംസാരിച്ചു
  rationale: λαλέω-യുടെ നേരായ അർഥം ‘സംസാരിക്കുക’ എന്നതാണ്; അനാവശ്യമായി ശൈലി ഉയർത്തുന്നില്ല.
- source_word: ἀπὸ θεοῦ
  choice: ദൈവത്തിൽനിന്ന്
  rationale: ἀπό ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. ‘ദൈവത്തിൽനിന്ന്’ എന്നത് ദൈവിക ഉറവിടം നിലനിർത്തുകയും പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തകത്വത്തിൽനിന്ന് അതിനെ വേർതിരിച്ചുകാണിക്കുകയും ചെയ്യുന്നു.
- source_word: ἄνθρωποι
  choice: മനുഷ്യർ
  rationale: ദൈവത്തോടും ആത്മാവോടും വ്യത്യാസപ്പെടുത്തി മനുഷ്യവക്താക്കളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിലെ പൊതുവായ പ്രതിനിധ്യാർഥം മലയാളത്തിലെ ‘മനുഷ്യർ’ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: പ്രവചനത്തിലെ ദൈവികവും മാനുഷികവുമായ പ്രവർത്തകത്വങ്ങളുടെ ബന്ധം
  choice: മനുഷ്യർ യഥാർഥത്തിൽ സംസാരിച്ചു; എന്നാൽ അവരുടെ സന്ദേശത്തിന്റെ ഉറവിടം ദൈവവും അവരെ നയിച്ച പ്രവർത്തകൻ പരിശുദ്ധാത്മാവുമായിരുന്നു.
  alternative: ആത്മാവ് യാന്ത്രികമായി വാക്കുകൾ പറഞ്ഞുകൊടുത്തുവെന്നോ, പ്രവചനം ഭാഗികമായി മനുഷ്യരുടെ സ്വതന്ത്ര മുൻകൈയിൽനിന്ന് ഉണ്ടായെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: ‘മനുഷ്യർ ... സംസാരിച്ചു’ എന്നത് മാനുഷിക സംസാരത്തെ നിലനിർത്തുന്നു; ‘ദൈവത്തിൽനിന്ന്,’ ‘പരിശുദ്ധാത്മാവിനാൽ നയിക്കപ്പെട്ടുകൊണ്ട്’ എന്നിവ നിർണായകമായ ദൈവിക ഉറവിടവും പ്രവർത്തകത്വവും നിലനിർത്തുന്നു. മൂലപാഠത്തിലെ ഈ സംഘർഷം പരിഭാഷ പരിഹരിച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രവചനം,’ ‘പരിശുദ്ധാത്മാവ്’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ഒരേസമയം ഗ്രീക്കിലെ ഉറവിടം (ἀπό), പ്രവർത്തകൻ (ὑπό), മനുഷ്യരുടെ യഥാർഥ സംസാരം എന്നിവ തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമായി സൂക്ഷിച്ചു.
