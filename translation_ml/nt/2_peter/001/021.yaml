revisions:
- from: പ്രവചനം ഒരിക്കലും മനുഷ്യന്റെ ഇഷ്ടത്താൽ ഉളവായതല്ല[a]; മറിച്ച്, പരിശുദ്ധാത്മാവിനാൽ നയിക്കപ്പെട്ടുകൊണ്ട്[b] മനുഷ്യർ ദൈവത്തിൽനിന്ന് സംസാരിച്ചു.[c]
  to: പ്രവചനം ഒരിക്കലും മനുഷ്യന്റെ ഇഷ്ടത്താൽ ഉളവാക്കപ്പെട്ടതല്ല[a]; മറിച്ച്, പരിശുദ്ധാത്മാവിനാൽ വഹിക്കപ്പെട്ട്[b] മനുഷ്യർ ദൈവത്തിൽനിന്ന് സംസാരിച്ചു.[c]
  rationale: 'The revision restores the passive force and deliberate φέρω wordplay of the Greek: prophecy was not produced by human will, whereas human speakers spoke from God while being borne along by the Holy Spirit. It preserves the distinction between divine source (‘ദൈവത്തിൽനിന്ന്’) and the Spirit''s agency (‘പരിശുദ്ധാത്മാവിനാൽ’) without resolving the text into either dictation or merely human initiative.'
  reviewer_model: gpt-5.6-terra
