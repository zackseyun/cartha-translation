revisions:
- from: അവയിലൂടെ അവിടന്ന് വിലയേറിയതും അതിമഹത്തുമായ വാഗ്ദാനങ്ങൾ നമുക്കു നൽകിയിരിക്കുന്നു. ഈ വാഗ്ദാനങ്ങളിലൂടെ നിങ്ങൾ ദൈവിക സ്വഭാവത്തിൽ പങ്കാളികളാകാനും[a], ദുഷ്ടമോഹം മൂലം ലോകത്തിലുള്ള ദുഷിപ്പിൽനിന്ന് ഒഴിഞ്ഞുമാറാനും[b] വേണ്ടിയാണിത്.
  to: അവയിലൂടെ അവിടുന്ന് നമുക്കു അമൂല്യവും അതിമഹത്തുമായ വാഗ്ദാനങ്ങൾ നൽകിയിരിക്കുന്നു; ഈ വാഗ്ദാനങ്ങളിലൂടെ, പാപകരമായ ആഗ്രഹം നിമിത്തമുള്ള ലോകത്തിലെ ദുഷിപ്പിൽനിന്ന് ഒഴിഞ്ഞുമാറിയവരായി[b], നിങ്ങൾ ദൈവിക സ്വഭാവത്തിന്റെ പങ്കാളികളാകേണ്ടതിന്[a].
  rationale: The revision restores the Greek participial relationship of ἀποφυγόντες, retains the intentionally non-specific reference of ‘അവയിലൂടെ,’ and uses standard Malayalam wording. Footnote a is limited to its lexical alternative, while footnote b explains the participial construction without forcing an exact temporal sequence.
