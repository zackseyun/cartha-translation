id: 2PE.1.4
reference: 2 Peter 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: ml
  text: അവയിലൂടെ അവിടുന്ന് നമുക്കു അമൂല്യവും അതിമഹത്തുമായ വാഗ്ദാനങ്ങൾ നൽകിയിരിക്കുന്നു; ഈ വാഗ്ദാനങ്ങളിലൂടെ, പാപകരമായ ആഗ്രഹം നിമിത്തമുള്ള ലോകത്തിലെ ദുഷിപ്പിൽനിന്ന് ഒഴിഞ്ഞുമാറിയവരായി[b], നിങ്ങൾ ദൈവിക സ്വഭാവത്തിന്റെ പങ്കാളികളാകേണ്ടതിന്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവിക സ്വഭാവത്തിൽ പങ്കുകൊള്ളുന്നവരാകേണ്ടതിന്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഒഴിഞ്ഞുമാറിക്കൊണ്ട്.’ ഗ്രീക്കിലെ രൂപം ‘ഒഴിഞ്ഞുമാറിയശേഷം’ എന്ന കൃതന്തഭാവവും സൂചിപ്പിക്കാം.
    reason: syntactic_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: അവയിലൂടെ
  rationale: ജനിറ്റീവിനോടുകൂടിയ διά മാർഗമോ മാധ്യമമോ സൂചിപ്പിക്കുന്നു. സർവനാമത്തിന്റെ പൂർവപദം അമിതമായി നിർണയിക്കാതെ മുൻവാക്യവുമായി ബന്ധം നിലനിർത്തുന്നു.
- source_word: τίμια καὶ μέγιστα
  choice: വിലയേറിയതും അതിമഹത്തുമായ
  rationale: τίμια എന്നതിന്റെ മൂല്യവത്തായ/അമൂല്യമായ അർഥവും μέγιστα എന്ന അതിശയോക്തിപരമായ ശക്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπαγγέλματα δεδώρηται
  choice: വാഗ്ദാനങ്ങൾ ... നൽകിയിരിക്കുന്നു
  rationale: പൂർണ്ണകാലരൂപം മുൻപ് നൽകിയ ദാനത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ 'നൽകിയിരിക്കുന്നു' അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διὰ τούτων
  choice: ഈ വാഗ്ദാനങ്ങളിലൂടെ
  rationale: τούτων തൊട്ടുമുമ്പുള്ള വാഗ്ദാനങ്ങളിലേക്കാണ് സ്വാഭാവികമായി ചൂണ്ടുന്നത്; മലയാളത്തിൽ സൂചന വ്യക്തമാക്കുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: θείας κοινωνοὶ φύσεως
  choice: ദൈവിക സ്വഭാവത്തിൽ പങ്കാളികൾ
  rationale: κοινωνός സൂചിപ്പിക്കുന്ന യഥാർഥ പങ്കാളിത്തവും θεία φύσις എന്ന ശക്തമായ പ്രയോഗവും വ്യാഖ്യാനിച്ച് ദുർബലമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀποφυγόντες
  choice: ഒഴിഞ്ഞുമാറാനും
  rationale: മലയാളത്തിലെ ഉദ്ദേശ്യവാക്യഘടനയിൽ പങ്കാളികളാകുന്നതോടു ചേർന്നുള്ള രക്ഷപ്പെടലിനെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മൂലത്തിലെ കൃതന്തബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: φθορᾶς
  choice: ദുഷിപ്പിൽനിന്ന്
  rationale: സന്ദർഭത്തിലെ ധാർമികവും ആത്മികവുമായ corruption എന്ന ആശയം 'ദുഷിപ്പ്' വ്യക്തമായി നൽകുന്നു; വെറും ഭൗതിക ജീർണതയായി ചുരുക്കുന്നില്ല.
- source_word: ἐν ἐπιθυμίᾳ
  choice: ദുഷ്ടമോഹം മൂലം
  rationale: ἐπιθυμία സ്വതവേ പൊതുവായ ആഗ്രഹത്തെയും സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ ലോകത്തിലെ ദുഷിപ്പുമായി ബന്ധപ്പെടുന്നതിനാൽ ധാർമികമായി പ്രതികൂലമാണ്. 'ദുഷ്ടമോഹം' ലൈംഗിക അർഥത്തിൽ മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως എന്നതിലെ ദൈവിക പങ്കാളിത്തം
  choice: ദൈവിക സ്വഭാവത്തിൽ പങ്കാളികൾ
  alternative: ദൈവിക സ്വഭാവത്തിൽ പങ്കുകൊള്ളുന്നവർ
  rationale: വിശ്വാസികൾ ദൈവത്തിന്റെ സത്തയായി മാറുന്നു എന്ന് പറയാതെ, മൂലപാഠത്തിലെ ശക്തമായ പങ്കാളിത്തഭാഷ സംരക്ഷിക്കുന്നു. വിശുദ്ധീകരണം, ക്രിസ്തുവുമായുള്ള ഐക്യം, ദൈവീകരണം തുടങ്ങിയ പിൽക്കാല സിദ്ധാന്തങ്ങളിൽ ഒന്നിനെ വിവർത്തനം നിർബന്ധമാക്കുന്നില്ല.
- issue: ἐπιθυμίαയുടെ പ്രതികൂല ധാർമികശക്തി
  choice: ദുഷ്ടമോഹം
  alternative: ആഗ്രഹം; മോഹം
  rationale: ഈ പദത്തിന് പൊതുവേ 'ആഗ്രഹം' എന്ന അർഥമുണ്ടാകാമെങ്കിലും ലോകത്തിലെ ദുഷിപ്പുമായുള്ള ബന്ധം ഇവിടെ അതിന്റെ പ്രതികൂല സ്വഭാവം വ്യക്തമാക്കുന്നു.
- issue: ἀποφυγόντες എന്ന കൃതന്തത്തിന്റെ ബന്ധം
  choice: ഉദ്ദേശ്യവാക്യത്തിലെ ഏകോപിത ക്രിയയായി അവതരിപ്പിച്ചു
  alternative: ദുഷിപ്പിൽനിന്ന് ഒഴിഞ്ഞുമാറിയവരായി ദൈവിക സ്വഭാവത്തിൽ പങ്കാളികളാകുക
  rationale: മൂലത്തിലെ കൃതന്തം മുൻകാലമോ അനുഗാമിയായ സാഹചര്യമോ സൂചിപ്പിക്കാം. പ്രധാനപാഠം സ്വാഭാവിക മലയാളം നൽകുന്നു; കർശനമായ കാലക്രമം അടിച്ചേൽപ്പിക്കാതിരിക്കാൻ പര്യായഘടന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. ‘അവിടന്ന്’ എന്ന ആദരസൂചക സർവനാമം സന്ദർഭത്തിൽ സൂചിതനായ ദൈവത്തെ പരാമർശിക്കുന്നു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വ്യക്തതയ്ക്കായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; ആശയബന്ധം ‘ഈ വാഗ്ദാനങ്ങളിലൂടെ’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി.
