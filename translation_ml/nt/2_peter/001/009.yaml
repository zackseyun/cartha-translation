    text: അഥവാ, ‘സമീപത്തുള്ളതു മാത്രം കാണുന്നവൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: ഈ കാര്യങ്ങൾ ഇല്ലാത്തവൻ
  rationale: ഗ്രീക്കിലെ ദാതിവ് ബന്ധസർവനാമവും πάρεστιν എന്ന പ്രയോഗവും ചേർന്ന്, മുമ്പ് പറഞ്ഞ ഗുണങ്ങൾ ഒരാളിൽ ഇല്ലെന്ന പൊതുവായ അർഥം നൽകുന്നു. ‘ഈ കാര്യങ്ങൾ’ എന്ന് നൽകിയതിലൂടെ ταῦταയുടെ വിശാലമായ സൂചന നിലനിർത്തുന്നു.
- source_word: τυφλός
  choice: അന്ധനാണ്
  rationale: ആത്മീയ ഗ്രഹണശേഷിയില്ലായ്മ സൂചിപ്പിക്കുന്ന രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: μυωπάζων
  choice: അടുത്തുള്ളതു മാത്രം കാണുന്നവൻ
  rationale: ‘ഹ്രസ്വദൃഷ്ടിയുള്ളവൻ’ എന്ന സാങ്കേതിക പദത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാണ്; കാണാൻ കഴിയുന്നത് സമീപത്തുള്ളതിൽ ഒതുങ്ങുന്നു എന്ന ഗ്രീക്ക് രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: λήθην λαβὼν
  choice: മറന്നവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘മറവി സ്വീകരിച്ചവൻ’ എന്ന ഗ്രീക്ക് ഭാഷാശൈലി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: തന്റെ പഴയ പാപങ്ങളിൽനിന്നുള്ള ശുദ്ധീകരണം
  rationale: καθαρισμός എന്നതിനു ‘ശുദ്ധീകരണം’ എന്നും πάλαι എന്ന കാലസൂചനയ്ക്ക് ‘പഴയ’ എന്നും നൽകുന്നു. ജനിറ്റീവ് ബന്ധം പാപങ്ങളിൽനിന്നുള്ള ശുദ്ധീകരണം എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: τυφλός, μυωπάζων എന്നീ രൂപകങ്ങൾ തമ്മിലുള്ള ബന്ധം
  choice: ‘അന്ധനാണ്—അടുത്തുള്ളതു മാത്രം കാണുന്നവൻ’ എന്ന നിലയിൽ രണ്ടും ചേർത്ത്, പൂർണ അന്ധതയും പരിമിത ദൃഷ്ടിയും തമ്മിലുള്ള ഉദ്ദേശ്യമായ സംഘർഷം നിലനിർത്തി.
  alternative: ‘അന്ധനോ ഹ്രസ്വദൃഷ്ടിയുള്ളവനോ’ എന്നു രണ്ടു സാധ്യതകളായി വേർതിരിക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ ബന്ധിപ്പിക്കുന്ന ‘അല്ലെങ്കിൽ’ ഇല്ല; പങ്കാളിക്രിയ മുഖ്യവിശേഷണത്തെ വിശദീകരിക്കുകയോ ശക്തിപ്പെടുത്തുകയോ ചെയ്യുന്നു. അതിനാൽ ഒന്നിനെ മറ്റൊന്നിനു പകരമുള്ളതായി മാറ്റരുത്.
- issue: αὐτοῦ എന്ന ഏകവചന പുരുഷലിംഗ സർവനാമത്തിന്റെ പൊതുവായ പ്രയോഗം
  choice: ‘തന്റെ’
  alternative: ‘അവന്റെ’
  rationale: ‘തന്റെ’ ഏകവചന പരാമർശവും പൊതുവായ വ്യക്തിസൂചനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു; പുരുഷന്മാർക്കു മാത്രമായി അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മുമ്പത്തെ വാക്യത്തിൽ പറഞ്ഞ ഗുണങ്ങളിലേക്കുള്ള ‘ഈ കാര്യങ്ങൾ’ എന്ന സൂചനയും, അന്ധത/ഹ്രസ്വദൃഷ്ടി രൂപകത്തിലെ യഥാർഥ സംഘർഷവും സംരക്ഷിച്ചു.
