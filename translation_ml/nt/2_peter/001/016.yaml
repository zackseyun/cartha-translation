  to: കൗശലപൂർവം കെട്ടിച്ചമച്ച കെട്ടുകഥകളെ പിന്തുടർന്നിട്ടല്ല ഞങ്ങൾ നമ്മുടെ കർത്താവായ യേശു മിശിഹായുടെ[b] ശക്തിയും വരവും[a] നിങ്ങൾക്കു അറിയിച്ചതു; മറിച്ച്, അദ്ദേഹത്തിന്റെ മഹിമ നേരിൽ കണ്ട ദൃക്സാക്ഷികളായിത്തീർന്നതാണ്.
