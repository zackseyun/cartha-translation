id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: ml
  text: കൗശലപൂർവം കെട്ടിച്ചമച്ച കെട്ടുകഥകളെ പിന്തുടർന്നിട്ടല്ല ഞങ്ങൾ നമ്മുടെ കർത്താവായ യേശു മിശിഹായുടെ[b] ശക്തിയും വരവും[a] നിങ്ങൾക്കു അറിയിച്ചതു; മറിച്ച്, അദ്ദേഹത്തിന്റെ മഹിമ നേരിൽ കണ്ട ദൃക്സാക്ഷികളായിത്തീർന്നതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സാന്നിധ്യം’ അല്ലെങ്കിൽ ‘ആഗമനം’. ഗ്രീക്ക് παρουσία എന്ന പദത്തിന് സാന്നിധ്യം, എത്തിച്ചേരൽ, വരവ് എന്നീ അർഥങ്ങൾ വരാം; പുതിയനിയമത്തിലെ പല സന്ദർഭങ്ങളിലും അത് മിശിഹായുടെ വരവിനെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ ‘ക്രിസ്തോസ്’; അതിന്റെ അർഥം ‘മിശിഹാ’ അഥവാ ‘അഭിഷിക്തൻ’ എന്നാണ്. ഇവിടെ അത് സ്ഥാനപ്പേരായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: കൗശലപൂർവം കെട്ടിച്ചമച്ച കെട്ടുകഥകൾ
  rationale: σοφίζω എന്ന പദത്തിന്റെ കൗശലത്തോടെ സൃഷ്ടിച്ചെടുത്തത് എന്ന ഭാവവും μῦθος എന്നതിന്റെ വിശ്വാസയോഗ്യമല്ലാത്ത കഥ എന്ന നിഷേധാത്മക ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξακολουθήσαντες
  choice: പിന്തുടർന്നിട്ട്
  rationale: മുഖ്യക്രിയയ്ക്കു പശ്ചാത്തലമായ പങ്കാളിക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ‘അല്ല ... മറിച്ച്’ എന്ന വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐγνωρίσαμεν ὑμῖν
  choice: ഞങ്ങൾ ... നിങ്ങളെ അറിയിച്ചത്
  rationale: γνωρίζω എന്നതിന്റെ ‘അറിയിക്കുക/വെളിപ്പെടുത്തുക’ എന്ന അർഥവും ὑμῖν എന്ന സ്വീകർത്താവിനെയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: δύναμιν
  choice: ശക്തി
  rationale: δύναμις എന്നതിന്റെ നേരിട്ടുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പരിഭാഷ.
- source_word: παρουσίαν
  choice: വരവ്
  rationale: ഈ ക്രിസ്തുസംബന്ധമായ സന്ദർഭത്തിൽ ഭാവിയിലെ ആഗമനത്തെ സൂചിപ്പിക്കാൻ സാധ്യതയേറിയ തിരഞ്ഞെടുപ്പ്; ‘സാന്നിധ്യം’, ‘ആഗമനം’ എന്നീ നിഘണ്ടുപരമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന സ്ഥാനപ്പേരിന്റെ സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളരൂപം.
- source_word: Χριστοῦ
  choice: മിശിഹാ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മിശിഹാ’ ഉപയോഗിക്കുന്നു.
- source_word: ἐπόπται γενηθέντες
  choice: ദൃക്സാക്ഷികളായിട്ട്
  rationale: സ്വയം നേരിൽ കണ്ടവർ എന്ന ἐπόπται-യുടെ തെളിവുസംബന്ധമായ ഊന്നൽ സംരക്ഷിക്കുകയും മുൻ പങ്കാളിക്രിയയോടുള്ള സമാന്തരഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μεγαλειότητος
  choice: മഹിമ
  rationale: μεγαλειότης സൂചിപ്പിക്കുന്ന മഹത്ത്വവും പ്രഭാവവും dignified ആയ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκείνου
  choice: അദ്ദേഹത്തിന്റെ
  rationale: സൂചകസർവനാമം യേശു മിശിഹായെ തിരിച്ചുസൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുമാനസൂചക ഉടമസ്ഥരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ക്രിസ്തുസംബന്ധമായ παρουσίαയുടെ പരിഭാഷ
  choice: വരവ്
  alternative: സാന്നിധ്യം; ആഗമനം
  rationale: παρουσίαയ്ക്ക് സാന്നിധ്യം, എത്തിച്ചേരൽ, വരവ് എന്നീ അർഥങ്ങൾ ഉണ്ടെങ്കിലും പുതിയനിയമത്തിലെ യേശുസംബന്ധമായ പ്രയോഗങ്ങളിൽ അവന്റെ ഭാവിയിലെ വരവ് സാധാരണമായി ഉദ്ദേശിക്കപ്പെടുന്നു. എന്നാൽ നിഘണ്ടുപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: Χριστός സ്ഥാനപ്പേരോ പേരിന്റെ ഭാഗമോ
  choice: മിശിഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός യേശുവിന്റെ സ്ഥാനപ്പേരായി മനസ്സിലാക്കാവുന്നതിനാൽ ‘മിശിഹാ’ അതിന്റെ അർഥം വായനക്കാരനു കൂടുതൽ സുതാര്യമാക്കുന്നു; പതിവായ ശബ്ദാന്തരരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ഗദ്യശൈലി. ‘കൗശലപൂർവം കെട്ടിച്ചമച്ച’ എന്ന പ്രയോഗം മൂലപദത്തിലെ കരകൗശലത്തോടെ നിർമ്മിച്ചെടുത്തതെന്ന ഭാവം നൽകുന്നു; ‘ദൃക്സാക്ഷികൾ’ കെട്ടുകഥകളോടുള്ള തെളിവുസംബന്ധമായ വൈരുധ്യം ശക്തമായി നിലനിർത്തുന്നു.
