id: 2PE.1.7
reference: 2 Peter 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: ml
  text: ദൈവഭക്തിയിൽ സഹോദരവാത്സല്യവും, സഹോദരവാത്സല്യത്തിൽ സ്നേഹവും കൂട്ടിച്ചേർക്കുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: ദൈവഭക്തി
  rationale: ദൈവത്തോടുള്ള ഭക്തിയും അതു ജീവിതത്തിലും പെരുമാറ്റത്തിലും പ്രകടമാകുന്നതും ഉൾക്കൊള്ളുന്ന εὐσέβεια എന്ന പദത്തിന്റെ ഇരുവശങ്ങളും ‘ദൈവഭക്തി’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: φιλαδελφίαν
  choice: സഹോദരവാത്സല്യം
  rationale: വിശേഷിച്ച് സഹവിശ്വാസികളോടുള്ള കുടുംബസദൃശമായ സ്നേഹവാത്സല്യമാണ് φιλαδελφία സൂചിപ്പിക്കുന്നത്. തുടർന്നുവരുന്ന ἀγάπηയിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്താൻ ‘സഹോദരവാത്സല്യം’ തെരഞ്ഞെടുത്തു.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ἀγάπηയുടെ വിശാലമായ അർഥം അമിതമായി വ്യാഖ്യാനിക്കാതെ ലളിതവും സ്വാഭാവികവുമായി നൽകുന്ന പദമാണ് ‘സ്നേഹം’; φιλαδελφίαയ്ക്കു ശേഷമുള്ള ക്രമോന്നതിയും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: '...യോടു ...വും കൂട്ടിച്ചേർക്കുക'
  rationale: ഗുണങ്ങളുടെ ശൃംഖലയിൽ അടുത്ത ഗുണം മുൻപത്തേതിനോടു ചേർക്കണമെന്ന ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു. ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ ആവർത്തിക്കാത്ത ക്രിയ മുൻസന്ദർഭത്തിൽനിന്ന് സ്വാഭാവികമായി പൂരിപ്പിച്ചിരിക്കുന്നു.
- source_word: δέ
  choice: -വും
  rationale: ഇവിടെ δέ വൈരുധ്യമല്ല, പട്ടിക തുടരുന്ന മൃദുവായ സംയോജകമാണ്; മലയാളത്തിലെ ‘-വും’ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഗുണശ്രേണിയിൽ φιλαδελφίαയും ἀγάπηയും തമ്മിലുള്ള വ്യത്യാസം
  choice: φιλαδελφίαയെ ‘സഹോദരവാത്സല്യം’ എന്നും ἀγάπηയെ ‘സ്നേഹം’ എന്നും പരിഭാഷപ്പെടുത്തുക
  alternative: രണ്ടിനെയും യഥാക്രമം ‘സഹോദരസ്നേഹം’, ‘സ്നേഹം’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: ഗ്രീക്ക് പാഠം ബന്ധമുള്ളതെങ്കിലും വ്യത്യസ്തമായ രണ്ടു പദങ്ങൾ തുടർച്ചയായി ഉപയോഗിക്കുന്നു. ‘സഹോദരവാത്സല്യം’ സഹവിശ്വാസികളോടുള്ള കുടുംബസദൃശമായ അടുപ്പം സൂചിപ്പിക്കുമ്പോൾ ‘സ്നേഹം’ അതിനെക്കാൾ വിശാലമായ ഗുണമായി നിലനിൽക്കുന്നു; ഇതിലൂടെ പാഠത്തിലെ വാചകപരമായ പുരോഗതി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഒറ്റയ്ക്കു വായിക്കുമ്പോഴും വാക്യം പൂർണമാകാൻ മുൻവാക്യത്തിൽനിന്ന് സൂചിതമായ ‘കൂട്ടിച്ചേർക്കുക’ ചേർത്തിരിക്കുന്നു. ‘സഹോദരവാത്സല്യം’–‘സ്നേഹം’ എന്ന വ്യത്യാസം മൂലപാഠത്തിലെ രണ്ടു പദങ്ങളെയും വ്യക്തമായി നിലനിർത്തുന്നു.
