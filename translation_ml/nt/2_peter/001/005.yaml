id: 2PE.1.5
reference: 2 Peter 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: ml
  text: ഇതേ കാരണത്താൽ, എല്ലാ ശുഷ്കാന്തിയും കാണിച്ച്, നിങ്ങളുടെ വിശ്വാസത്തോടൊപ്പം സദ്ഗുണവും സദ്ഗുണത്തോടൊപ്പം പരിജ്ഞാനവും സമൃദ്ധമായി ചേർക്കുക.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വാസം’ എന്നതിന് ‘വിശ്വസ്തത’ എന്നോ ‘ആശ്രയിക്കുക’ എന്നോ വിവർത്തനം ചെയ്യാം (πίστις).
    reason: lexical_alternative
  - marker: b
    text: ‘സദ്ഗുണം’ എന്നതിന് ‘ധാർമിക ശ്രേഷ്ഠത’ എന്നും പറയാം (ἀρετή).
    reason: lexical_alternative
  - marker: c
    text: '‘സമൃദ്ധമായി ചേർക്കുക’ എന്ന ക്രിയയ്ക്ക് ‘നൽകുക’ അഥവാ ‘സമൃദ്ധമായി പ്രദാനം ചെയ്യുക’ എന്നും അർഥമുണ്ട്. കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘നിങ്ങളുടെ വിശ്വാസത്തിൽ സദ്ഗുണവും സദ്ഗുണത്തിൽ പരിജ്ഞാനവും ചേർക്കുക.’'
    reason: lexical_and_structural_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: അതുകൊണ്ടുതന്നെ
  rationale: മുൻവാക്യത്തിലെ ദൈവിക ദാനങ്ങളുമായി ഈ ആഹ്വാനത്തിനുള്ള ഊന്നിയ കാരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: നിങ്ങൾ എല്ലാ ശുഷ്കാന്തിയും കാണിച്ച്
  rationale: പൂർണമായ ആത്മാർഥതയും പരിശ്രമവും സഹപ്രവൃത്തിയായി കൊണ്ടുവരണമെന്ന കർത്തൃവാചകത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπιχορηγήσατε
  choice: ചേർത്തുകൊടുക്കുക
  rationale: ഗുണങ്ങളെ ഒന്നിനോടൊന്ന് സമൃദ്ധമായി നൽകുകയോ കൂട്ടിച്ചേർക്കുകയോ ചെയ്യുക എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ‘നൽകുക’ എന്ന മൂലഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: നിങ്ങളുടെ വിശ്വാസത്തോടു
  rationale: ആവർത്തിക്കുന്ന ἐν + ദത്തിവ് ഘടന ഇവിടെ ഗുണങ്ങളുടെ പുരോഗമനബന്ധമായി വായിക്കാം; അക്ഷരാർഥമായ ‘വിശ്വാസത്തിൽ’ എന്നതിനെക്കാൾ ‘വിശ്വാസത്തോടു’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: πίστει
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ കേന്ദ്രാർഥവും ഈ ഗുണപ്പട്ടികയിലെ ഏറ്റവും നേരിട്ടുള്ള അർഥവും നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀρετήν
  choice: സദ്ഗുണം
  rationale: സ്വഭാവത്തിലെ ധാർമിക നന്മയും ശ്രേഷ്ഠതയും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന സംക്ഷിപ്ത മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: γνῶσιν
  choice: പരിജ്ഞാനം
  rationale: γνῶσις എന്നതിന്റെ അറിവ് എന്ന കേന്ദ്രാർഥം, ഗുണങ്ങളുടെ പട്ടികയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: ഗുണപ്പട്ടികയിലെ πίστις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഈ സന്ദർഭത്തിൽ ‘വിശ്വാസം’ ഏറ്റവും നേരിട്ടുള്ള വായനയാണ്. എന്നിരുന്നാലും πίστις എന്ന പദത്തിന് വിശ്വസ്തതയുടെയും ആശ്രയത്തിന്റെയും അർഥനിറങ്ങൾ ഉണ്ടാകാവുന്നതിനാൽ അവ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ആവർത്തിക്കുന്ന ἐν ഘടനയുടെ ബന്ധം
  choice: ‘…ത്തോടു … ചേർത്തുകൊടുക്കുക’ എന്ന പുരോഗമനബന്ധം
  alternative: ‘…ത്തിൽ … നൽകുക’
  rationale: ഗ്രീക്കിലെ ബന്ധം ഒന്നിനെ മറ്റൊന്നിൽ/അതോടനുബന്ധിച്ച് നൽകുന്നതായി നിലനിൽക്കുന്നു. മലയാളത്തിൽ അർഥം അവ്യക്തമാകാതിരിക്കാനാണ് ‘ത്തോടു’ ഉപയോഗിച്ചത്; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശുഷ്കാന്തി’, ‘സദ്ഗുണം’, ‘പരിജ്ഞാനം’ എന്നിവ വാക്യത്തിന്റെ ഉപദേശാത്മക ഗൗരവം നിലനിർത്തുമ്പോഴും ഇന്നത്തെ ബൈബിൾ വായനയിൽ മനസ്സിലാകുന്ന പദങ്ങളാണ്.
