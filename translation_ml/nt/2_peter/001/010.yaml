id: 2PE.1.10
reference: 2 Peter 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: ml
  text: അതുകൊണ്ട്, സഹോദരന്മാരേ,[a] നിങ്ങളുടെ വിളിയും തിരഞ്ഞെടുപ്പും ഉറപ്പാക്കാൻ ഇനിയും അധികം ശുഷ്കാന്തി കാണിക്കുവിൻ; കാരണം, നിങ്ങൾ ഈ കാര്യങ്ങൾ ചെയ്യുന്നുവെങ്കിൽ, ഒരിക്കലും ഇടറുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സഹോദരന്മാരും സഹോദരിമാരും’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ ഈ അഭിസംബോധന വിശ്വാസസമൂഹത്തെ മുഴുവനായി ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള പ്രബോധനത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μᾶλλον
  choice: അധികം
  rationale: σπουδάσατε എന്ന ആജ്ഞയുടെ തീവ്രത വർധിപ്പിക്കുന്ന താരതമ്യബലം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന അഭിസംബോധന നേരിട്ട് നിലനിർത്തുന്നു; വിശ്വാസസമൂഹത്തെ മുഴുവനായി ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: σπουδάσατε
  choice: ശുഷ്കാന്തി കാണിക്കുവിൻ
  rationale: ഗൗരവത്തോടെയും ഉത്സാഹത്തോടെയും പരിശ്രമിക്കാനുള്ള ആജ്ഞയെ മാന്യവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: βεβαίαν
  choice: ഉറപ്പുള്ളതാക്കാൻ
  rationale: വിളിയും തിരഞ്ഞെടുപ്പും ദൃഢമാക്കുകയോ സ്ഥിരീകരിക്കുകയോ ചെയ്യുക എന്ന അർഥം നൽകുന്നു; അവയ്ക്ക് ഉത്ഭവം നൽകുന്നു എന്ന ആശയം നിർബന്ധിക്കുന്നില്ല.
- source_word: κλῆσιν
  choice: വിളി
  rationale: ദൈവത്തിന്റെ വിളിയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ പുതിയനിയമ പദപ്രയോഗം.
- source_word: ἐκλογὴν
  choice: തിരഞ്ഞെടുപ്പ്
  rationale: ദൈവത്തിന്റെ തിരഞ്ഞെടുക്കൽ എന്ന ആശയം കൃത്യമായി നിലനിർത്തുന്നു; ഏതെങ്കിലും പ്രത്യേക സിദ്ധാന്തവ്യവസ്ഥയെ വിവർത്തനത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: ποιεῖσθαι
  choice: ആക്കാൻ
  rationale: βεβαίαν എന്ന വിശേഷണത്തോടൊപ്പം ചേർന്ന് ‘ഉറപ്പുള്ളതാക്കുക’ എന്ന കാരണാത്മക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ταῦτα
  choice: ഇവ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ഗുണങ്ങളെയും പ്രവൃത്തികളെയും ചുരുക്കമായും വ്യക്തമായും തിരികെ സൂചിപ്പിക്കുന്നു.
- source_word: ποιοῦντες
  choice: ചെയ്തുകൊണ്ടിരുന്നാൽ
  rationale: വർത്തമാന പങ്കാളിപദത്തിന്റെ തുടർച്ചയായ പ്രവൃത്തിയും സന്ദർഭത്തിലെ വ്യവസ്ഥാസ്വഭാവവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐ μὴ ... ποτε
  choice: ഒരിക്കലും ... ഇല്ല
  rationale: ഗ്രീക്കിലെ ശക്തമായ നിഷേധത്തെ സ്വാഭാവിക മലയാളത്തിൽ ഊന്നലോടെ പകരുന്നു.
- source_word: πταίσητέ
  choice: ഇടറുകയില്ല
  rationale: വീഴ്ചയിലേക്കോ പരാജയത്തിലേക്കോ നയിക്കുന്ന ഇടർച്ചയുടെ രൂപകം നിലനിർത്തുന്നു; പാപരഹിത പൂർണതയെയോ അന്തിമ വിശ്വാസത്യാഗത്തെയോ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ‘നിങ്ങളുടെ വിളിയും തിരഞ്ഞെടുപ്പും ഉറപ്പുള്ളതാക്കുക’ എന്നതിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ വിളിയുടെയും തിരഞ്ഞെടുപ്പിന്റെയും യാഥാർഥ്യം സ്ഥിരോത്സാഹമുള്ള സദ്ഗുണജീവിതത്തിലൂടെ ഉറപ്പിക്കുകയോ സ്ഥിരീകരിക്കുകയോ ചെയ്യാനുള്ള പ്രബോധനമായി തുറന്ന നിലയിൽ വിവർത്തനം ചെയ്തു.
  alternative: മനുഷ്യശ്രമം ദൈവത്തിന്റെ വിളിക്കും തിരഞ്ഞെടുപ്പിനും ഉത്ഭവം നൽകുന്നു, അല്ലെങ്കിൽ അവയെ നിർണ്ണയിക്കുന്നു എന്ന വായന.
  rationale: ποιεῖσθαι എന്നത് βεβαίαν എന്നതോടൊപ്പം സ്ഥിരീകരണം/ദൃഢീകരണം സൂചിപ്പിക്കുന്നു. വിവർത്തനം ദൈവത്തിന്റെ മുൻപ്രവൃത്തിയും മനുഷ്യന്റെ ശുഷ്കാന്തിയും തമ്മിലുള്ള പാഠത്തിലെ സംഘർഷം ഒരു വിഭാഗീയ വ്യാഖ്യാനത്തിലൂടെ പരിഹരിക്കുന്നില്ല.
- issue: ‘ഒരിക്കലും ഇടറുകയില്ല’ എന്ന വാഗ്ദാനത്തിന്റെ വ്യാപ്തി
  choice: വിശ്വസ്തമായ ക്രിസ്തീയ ജീവിതത്തിൽ ഇടറാതിരിക്കാനുള്ള ശക്തമായ ഉറപ്പായി രൂപകം നിലനിർത്തി.
  alternative: ഒരു പാപവും ഒരിക്കലും ചെയ്യുകയില്ലെന്ന പാപരഹിത പൂർണതയുടെ ഉറപ്പ്, അല്ലെങ്കിൽ അന്തിമമായി വിശ്വാസത്തിൽനിന്നു വീഴുകയില്ലെന്ന പ്രത്യേക സിദ്ധാന്തപരമായ ഉറപ്പ്.
  rationale: πταίω എന്ന ക്രിയ ഇടറുക എന്ന രൂപകാർഥം സ്വാഭാവികമായി നൽകുന്നു. അതിന്റെ പരിധി പാഠം വ്യക്തമാക്കുന്നതിലുപരി ചുരുക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ പ്രബോധനശൈലി. ‘ശുഷ്കാന്തി’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതവും സ്വാഭാവികവുമാക്കി. ഗ്രീക്ക് വാക്യത്തിന്റെ നിഗമനം, തീവ്രത, വ്യവസ്ഥാസ്വഭാവം, ശക്തമായ നിഷേധം എന്നിവ സംരക്ഷിച്ചു.
