id: 2PE.1.20
reference: 2 Peter 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/020.yaml
  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: ml
  text: 'ഒന്നാമതായി നിങ്ങൾ ഇതു മനസ്സിലാക്കണം: തിരുവെഴുത്തിലെ ഒരു പ്രവചനവും ഒരാളുടെ സ്വന്തം വ്യാഖ്യാനത്തിൽനിന്ന് ഉളവാകുന്നതല്ല.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: ഒന്നാമതായി നിങ്ങൾ ഇതു മനസ്സിലാക്കണം
  rationale: മുൻഗണനയോടെ ഉറപ്പായി അറിഞ്ഞിരിക്കണമെന്ന പങ്കാളിത്തപ്രയോഗത്തിന്റെ ആഹ്വാനസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πᾶσα προφητεία γραφῆς
  choice: തിരുവെഴുത്തിലെ ഒരു പ്രവചനവും
  rationale: ഗ്രീക്കിലെ πᾶσα ... οὐ എന്ന സർവസാമാന്യ നിഷേധത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഒരു ... വും ... അല്ല’ ഘടനയിൽ അവതരിപ്പിക്കുന്നു; γραφῆς-നെ ‘തിരുവെഴുത്തിലെ’ എന്നു ബന്ധിപ്പിക്കുന്നു.
- source_word: ἰδίας ἐπιλύσεως
  choice: ഒരാളുടെ സ്വന്തം വ്യാഖ്യാനത്തിൽനിന്ന്
  rationale: ἰδίας ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്നത് വ്യക്തമാക്കാതെ വ്യക്തിയുടെ ‘സ്വന്തം’ എന്ന ആശയം നിലനിർത്തുന്നു; ἐπίλυσις-ന്റെ അർത്ഥപരിധിയിൽപ്പെട്ട വിശദീകരണം/വ്യാഖ്യാനം എന്ന ആശയത്തിന് ‘വ്യാഖ്യാനം’ ഉപയോഗിക്കുന്നു.
- source_word: οὐ γίνεται
  choice: ഉളവാകുന്നതല്ല
  rationale: γίνεται-യുടെ ‘ഉണ്ടാകുക/ഉത്ഭവിക്കുക’ എന്ന ചലനാത്മക അർത്ഥം നിലനിർത്തുന്നു; വെറും ‘ആയിരിക്കുകയല്ല’ എന്ന നിലാവസ്ഥയായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: വാക്യം പ്രവചനത്തിന്റെ ഉത്ഭവത്തെയാണോ വായനക്കാരന്റെ വ്യാഖ്യാനത്തെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ‘വ്യാഖ്യാനത്തിൽനിന്ന് ഉളവാകുന്നതല്ല’ എന്ന് നൽകി ഉത്ഭവഭാവം മുൻനിർത്തി, ‘വ്യാഖ്യാനം’ എന്ന പദം നിലനിർത്തി
  alternative: ‘സ്വന്തമായി വ്യാഖ്യാനിക്കാനുള്ളതല്ല’
  rationale: οὐ γίνεται പ്രവചനം എങ്ങനെ ഉളവാകുന്നു എന്നതിലേക്കാണ് സ്വാഭാവികമായി ചൂണ്ടുന്നത്; എന്നാൽ ἐπίλυσις വ്യാഖ്യാനത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ആ ലെക്സിക്കൽ സംഘർഷം പരിഭാഷയിൽ മായ്ച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും, തിരുവെഴുത്തുപാരായണത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. അനാവശ്യമായി സാങ്കേതികമോ മതവിഭാഗ-സവിശേഷമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
