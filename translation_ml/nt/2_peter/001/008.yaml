id: 2PE.1.8
reference: 2 Peter 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഇവ നിങ്ങളിൽ ഉണ്ടായിരിക്കുകയും വർധിച്ചുവരികയും[a] ചെയ്യുന്നുവെങ്കിൽ, നമ്മുടെ കർത്താവായ യേശു മശീഹയെ[c] അറിയുന്നതിൽ[b] ഇവ നിങ്ങളെ നിഷ്‌ക്രിയരോ ഫലശൂന്യരോ ആക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സമൃദ്ധമായിരിക്കുകയും’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നമ്മുടെ കർത്താവായ യേശു മശീഹയെക്കുറിച്ചുള്ള പൂർണപരിജ്ഞാനത്തിൽ’.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘യേശു ക്രിസ്തു’; Χριστός എന്ന ശീർഷകത്തിന്റെ അർഥം വ്യക്തമാക്കാൻ ഇവിടെ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ഇവ
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ ഗുണങ്ങളെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിന്റെ അന്വയബന്ധം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὑμῖν ὑπάρχοντα
  choice: നിങ്ങളിൽ ഉണ്ടായിരിക്കുകയും
  rationale: വായനക്കാരിൽ ഈ ഗുണങ്ങൾ സന്നിഹിതമാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഉടമസ്ഥതയും ഉള്ളിലുള്ള സാന്നിധ്യവും ഇവിടെ അടുത്ത അർഥസാധ്യതകളാണ്.
- source_word: πλεονάζοντα
  choice: വർധിച്ചുവരികയും
  rationale: തുടർച്ചയായ വളർച്ചയുടെ ഭാവം വ്യക്തമാക്കുന്നു; ‘പെരുകുക/സമൃദ്ധമായിരിക്കുക’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀργούς
  choice: നിഷ്‌ക്രിയരോ
  rationale: വെറും മടിയേക്കാൾ, പ്രയോജനകരമായ പ്രവർത്തനം ഇല്ലാത്ത അവസ്ഥയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: ἀκάρπους
  choice: ഫലശൂന്യരോ
  rationale: മൂലത്തിലെ ഫലത്തിന്റെ രൂപകം നിലനിർത്തുകയും ἀργούς എന്നതിനോടുള്ള സമാന്തരത പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: καθίστησιν
  choice: ആകാതെ അവ നിങ്ങളെ കാക്കും
  rationale: οὐκ … οὐδὲ എന്ന നിഷേധത്തോടുകൂടിയ ഫലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τὴν … ἐπίγνωσιν
  choice: അറിയുന്നതിൽ
  rationale: കർത്താവിനെ അറിയുന്നതുമായി ബന്ധപ്പെട്ട പ്രവർത്തനക്ഷമതയും ഫലപ്രാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു; εἰς എന്നതിന്റെ ബന്ധപരമായ ഭാവം കടുപ്പിച്ച് നിർവചിക്കുന്നില്ല.
- source_word: ἐπίγνωσιν
  choice: അറിയുന്നതിൽ
  rationale: സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്ന പ്രയോഗം; കൂടുതൽ പൂർണമായ പരിജ്ഞാനം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവായ
  rationale: κύριος എന്ന ക്രിസ്തുശീർഷകത്തിന്റെ മാന്യവും പതിവുമായ മലയാളരൂപം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയെ
  rationale: Χριστός എന്ന ശീർഷകത്തിന്റെ അർഥം ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി, യേശു എന്ന പേര് ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστοῦ എങ്ങനെ നൽകണം
  choice: യേശു മശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός ഇവിടെ ശീർഷകമായതിനാൽ അതിന്റെ ‘മശീഹ’ എന്ന അർഥം പ്രകടമാക്കുന്നു; പരമ്പരാഗത ലിപ്യന്തരണരൂപവും അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐπίγνωσις എന്നതിലെ ശക്തമായ അറിവിന്റെ ഭാവം
  choice: അറിയുന്നതിൽ
  alternative: പൂർണപരിജ്ഞാനത്തിൽ
  rationale: മൂലപദത്തിന് കൂടുതൽ സമ്പൂർണമായ അറിവ് എന്ന ഭാവം ഉണ്ടാകാമെങ്കിലും അത് എല്ലാ സന്ദർഭത്തിലും നിർബന്ധമല്ല; പ്രധാന പാഠത്തിൽ അമിതമായി നിർവചിക്കാതെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ γάρ ‘എന്തെന്നാൽ’ എന്നു നിലനിർത്തി; വ്യവസ്ഥാസൂചന ഗ്രീക്കിൽ പ്രത്യേകം εἰ കൊണ്ടല്ല, പങ്കുപദഘടനയുടെ സന്ദർഭാർഥത്തിൽ നിന്നാണ് വരുന്നത്. ‘നിഷ്‌ക്രിയർ/ഫലശൂന്യർ’ എന്ന സമാന്തരജോടി മൂലത്തിലെ നിഷേധവും ഫലരൂപകവും സംരക്ഷിക്കുന്നു.
