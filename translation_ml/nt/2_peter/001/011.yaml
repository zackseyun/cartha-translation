id: 2PE.1.11
reference: 2 Peter 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: ml
  text: എന്തെന്നാൽ, ഇങ്ങനെ നമ്മുടെ കർത്താവും രക്ഷകനുമായ മശീഹയായ യേശുവിന്റെ[b] നിത്യരാജ്യത്തിലേക്കുള്ള പ്രവേശനം[a] നിങ്ങൾക്കു സമൃദ്ധമായി നൽകപ്പെടും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അകത്തേക്കു പ്രവേശിക്കൽ.’ ഗ്രീക്ക് εἴσοδος എന്ന പദത്തിന് പ്രവേശിക്കുന്ന പ്രവൃത്തിയെയോ പ്രവേശനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പരിഭാഷ: ‘യേശുക്രിസ്തു.’ ഇവിടെ ഗ്രീക്ക് സ്ഥാനപ്പേരായ Χριστός അതിന്റെ അർഥം നിലനിർത്താൻ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: alternative_reading
  - marker: c
    text: 'മറ്റൊരു പദക്രമം: ‘നമ്മുടെ കർത്താവും രക്ഷകനുമായ മശീഹയായ യേശുവിന്റെ നിത്യരാജ്യത്തിലേക്കുള്ള പ്രവേശനം നിങ്ങൾക്കു ഇങ്ങനെ സമൃദ്ധമായി നൽകപ്പെടും.’'
    reason: previous_rendering
lexical_decisions:
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ജീവിതരീതിയിലേക്കും പ്രവർത്തനത്തിലേക്കും വിരൽചൂണ്ടുന്ന പ്രദർശകഭാവം നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻ പ്രസ്താവനയ്ക്കുള്ള വിശദീകരണമോ കാരണമോ അവതരിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πλουσίως
  choice: സമൃദ്ധമായി
  rationale: അളവിലും ഔദാര്യത്തിലും ഉള്ള സമൃദ്ധിയുടെ ഭാവം അതിശയോക്തിയില്ലാതെ പകരുന്നു.
- source_word: ἐπιχορηγηθήσεται
  choice: ഒരുക്കിത്തരപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തിക്കൊണ്ട്, ആവശ്യമായതു സമൃദ്ധമായി സജ്ജമാക്കി നൽകുക എന്ന ക്രിയയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: സ്വീകർത്താവിനെയോ പ്രയോജനഭോക്താവിനെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ചതുർഥിവിഭക്തി നേരിട്ട് പകരുന്നു.
- source_word: ἡ εἴσοδος
  choice: പ്രവേശനം
  rationale: അകത്തു കടക്കൽ എന്ന പ്രവൃത്തിയെയും ലഭിക്കുന്ന പ്രവേശനത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സാധാരണ മലയാളപദമാണ്.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: നിത്യരാജ്യത്തിലേക്കുള്ള
  rationale: ലക്ഷ്യദിശയും αἰώνιος എന്നതിന്റെ അവസാനമില്ലാത്ത കാലഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: നമ്മുടെ കർത്താവും രക്ഷകനുമായ
  rationale: ഒരേ വ്യക്തിയെ വിശേഷിപ്പിക്കുന്ന രണ്ടു സ്ഥാനപ്പേരുകൾ എന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്യുകയും, മലയാളത്തിൽ ഉടമസ്ഥബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘നമ്മുടെ കർത്താവും രക്ഷകനും’ എന്ന രണ്ടു സ്ഥാനപ്പേരുകളുടെ സൂചിതവ്യക്തി
  choice: രണ്ടു സ്ഥാനപ്പേരുകളും മശീഹയായ യേശു എന്ന ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: രണ്ടു സ്ഥാനപ്പേരുകളും വ്യത്യസ്ത വ്യക്തികളെ സൂചിപ്പിക്കുന്നതുപോലെ വായിക്കുക.
  rationale: ഒരൊറ്റ നിർദേശകപദത്തിന്റെ കീഴിൽ καί കൊണ്ട് ബന്ധിപ്പിച്ച രണ്ടു ഏകവചന വ്യക്തിനാമപദങ്ങൾക്കു പിന്നാലെ Ἰησοῦ Χριστοῦ വരുന്നതിനാൽ, ഗ്രീക്ക് വാക്യഘടന ഒരേ സൂചിതവ്യക്തിയെയാണ് ശക്തമായി പിന്തുണയ്ക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തിയെങ്കിലും, മലയാളത്തിൽ അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി. ‘കർത്താവ്,’ ‘രക്ഷകൻ,’ ‘മശീഹ,’ ‘നിത്യരാജ്യം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ബൈബിൾപരമായ ഗൗരവം നിലനിർത്തുന്നു.
