id: 2PE.1.14
reference: 2 Peter 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: ml
  text: എന്റെ കൂടാരം അഴിച്ചുവയ്ക്കൽ ആസന്നമാണെന്ന് അറിഞ്ഞുകൊണ്ട്, നമ്മുടെ കർത്താവായ യേശു മശീഹ എനിക്കു വ്യക്തമാക്കിത്തന്നതുപോലെതന്നെ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ കൂടാരം നീക്കപ്പെടൽ’; താൽക്കാലിക വാസസ്ഥലമായ കൂടാരം അഴിച്ചുമാറ്റുന്നതിന്റെ രൂപകത്തിലൂടെ പത്രോസ് തന്റെ ആസന്നമരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ആസന്നമാണ്’ എന്നതിന് ‘ഉടൻ സംഭവിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: എനിക്കറിയാം
  rationale: മുൻവാക്യത്തോടുള്ള ബന്ധം നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്ക് കൃുദന്തരൂപത്തിന്റെ അറിവ് സൂചിപ്പിക്കുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കാരണം എന്ന ബന്ധം അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: ταχινή
  choice: സമയം അടുത്തിരിക്കുന്നു
  rationale: സംഭവത്തിന്റെ ആസന്നത സൂചിപ്പിക്കുന്നു. ഗ്രീക്ക് വിശേഷണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലപ്രയോഗമായി മാറ്റുന്നു; ‘വേഗത്തിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀπόθεσις
  choice: അഴിച്ചുവെക്കുക
  rationale: എന്തെങ്കിലും ഊരി/അഴിച്ച് മാറ്റിവെക്കുക എന്ന രൂപകം നിലനിർത്തുന്നു; നേരിട്ട് ‘മരണം’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: σκηνώματός
  choice: കൂടാരമാകുന്ന ശരീരം
  rationale: ‘കൂടാരം’ എന്ന താൽക്കാലിക വാസസ്ഥലത്തിന്റെ ചിത്രം നിലനിർത്തുകയും ഇവിടെ ഉദ്ദേശിക്കുന്നത് ശരീരമാണെന്ന് സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: καθὼς καὶ
  choice: പോലെതന്നെ
  rationale: താരതമ്യവും സ്ഥിരീകരണവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ക്രിസ്തുവിനുള്ള പതിവും ഗൗരവമുള്ളതുമായ മലയാള ശീർഷകം.
- source_word: Ἰησοῦς Χριστὸς
  choice: യേശു മശീഹ
  rationale: Χριστός എന്നതിന്റെ അഭിഷിക്തൻ/മശീഹ എന്ന ശീർഷകാർഥം നിലനിർത്തുന്നു; വ്യക്തിനാമത്തിന്റെ ഭാഗം മാത്രമായി ചുരുക്കുന്നില്ല.
- source_word: ἐδήλωσέν
  choice: വ്യക്തമാക്കിത്തന്നു
  rationale: അറിയിക്കുക അഥവാ വ്യക്തമാക്കുക എന്ന ക്രിയയുടെ അർഥം അതിരുകടന്ന് ഔപചാരിക വെളിപ്പാടായി വ്യാഖ്യാനിക്കാതെ നൽകുന്നു.
- source_word: μοι
  choice: എനിക്ക്
  rationale: പരോക്ഷ കർമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: പത്രോസിന്റെ ആസന്നമരണത്തെക്കുറിച്ചുള്ള രൂപകം
  choice: ‘എന്റെ കൂടാരമാകുന്ന ശരീരം അഴിച്ചുവെക്കുക’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘ഞാൻ ഉടൻ മരിക്കും’ അഥവാ ‘എന്റെ വേർപാട് അടുത്തിരിക്കുന്നു’.
  rationale: ഗ്രീക്ക് പാഠം ശരീരജീവിതത്തെ താൽക്കാലിക കൂടാരമായി ചിത്രീകരിക്കുന്നു. ശരീരം എന്ന സൂചന ചേർത്തുകൊണ്ട് ആ ചിത്രം വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: Ἰησοῦς Χριστός എന്ന ശീർഷകം
  choice: ‘യേശു മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘യേശുക്രിസ്തു’.
  rationale: Χριστός ഇവിടെ ‘മശീഹ/അഭിഷിക്തൻ’ എന്ന ശീർഷകാർഥം വഹിക്കുന്നതിനാൽ അതിന്റെ അർഥം വിവർത്തനത്തിൽ തുറന്നുകാട്ടുന്നു. ഗ്രീക്കിൽ Χριστός-ന് മുമ്പ് പ്രത്യേക നിർദേശകപദമില്ലാത്തതിനാൽ മലയാളത്തിൽ വേറെ നിർദേശകപദം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘കൂടാരം’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുമ്പോൾ ‘ശരീരം’ ചേർത്ത് അതിന്റെ സൂചിതാർഥം വ്യക്തമാക്കിയിരിക്കുന്നു; വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
