revisions:
- from: എന്റെ കൂടാരമാകുന്ന ശരീരം അഴിച്ചുവെക്കേണ്ട സമയം അടുത്തിരിക്കുന്നുവെന്ന് എനിക്കറിയാം[a][b]; നമ്മുടെ കർത്താവായ യേശു മശീഹ എനിക്കു വ്യക്തമാക്കിത്തന്നതുപോലെതന്നെ.
  to: എന്റെ കൂടാരം അഴിച്ചുവയ്ക്കൽ ആസന്നമാണെന്ന് അറിഞ്ഞുകൊണ്ട്, നമ്മുടെ കർത്താവായ യേശു മശീഹ എനിക്കു വ്യക്തമാക്കിത്തന്നതുപോലെതന്നെ.[a][b]
  rationale: The revision removes the interpretive addition ‘ശരീരം’ from the main text while preserving the tent metaphor and explains its death-reference in the footnote. It also restores the participial sense of εἰδώς and renders ταχινή as imminence of the laying-aside event, without the obligation nuance introduced by ‘അഴിച്ചുവെക്കേണ്ട സമയം.’
