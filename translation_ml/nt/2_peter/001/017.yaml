id: 2PE.1.17
reference: 2 Peter 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, പിതാവായ ദൈവത്തിൽനിന്ന് ബഹുമാനവും മഹത്ത്വവും അവൻ പ്രാപിച്ചപ്പോൾ, മഹിമാപൂർണമായ തേജസ്സിൽനിന്ന്[a] ഇങ്ങനെയൊരു ശബ്ദം അവന്റെ അടുക്കൽ വന്നു: “ഇവൻ എന്റെ പുത്രൻ, എന്റെ പ്രിയൻ[b]; ഇവനിൽ ഞാൻ പ്രസാദിച്ചു[c]”—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മഹിമാപൂർണമായ തേജസ്സിനാൽ.” ഗ്രീക്കിലെ ὑπό പ്രവർത്തകനെ സൂചിപ്പിക്കാം; “നിന്ന്” എന്ന പരിഭാഷ ശബ്ദത്തിന്റെ ഉറവിടം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഇവൻ എന്റെ പ്രിയപുത്രൻ.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി “ഇവൻ എന്റെ പുത്രൻ, എന്റെ പ്രിയൻ” എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “ഇവനോടു ഞാൻ പ്രസാദിച്ചു” അല്ലെങ്കിൽ “ഇവനിൽ ഞാൻ ആനന്ദിച്ചു.” ഗ്രീക്ക് ക്രിയ ഭൂതകാലരൂപത്തിലാണ്; εἰς എന്നത് അക്ഷരാർഥത്തിൽ ദിശ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഇവിടെ പ്രസാദത്തിന്റെയോ ആനന്ദത്തിന്റെയോ ബന്ധത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν
  choice: പ്രാപിച്ചപ്പോൾ
  rationale: സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃദന്തരൂപത്തിന്റെ കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρὰ θεοῦ πατρὸς
  choice: പിതാവായ ദൈവത്തിൽനിന്ന്
  rationale: παρά + ഷഷ്ഠി സൂചിപ്പിക്കുന്ന ഉറവിടാർഥം നിലനിർത്തുകയും θεοῦ πατρός എന്ന ഇരട്ട നാമപ്രയോഗം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: τιμὴν καὶ δόξαν
  choice: ബഹുമാനവും മഹത്ത്വവും
  rationale: രണ്ട് വ്യത്യസ്ത നാമങ്ങളെയും വേർതിരിച്ച് നിലനിർത്തുന്ന നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ
  choice: ശബ്ദം അവന്റെ അടുക്കൽ വന്നു
  rationale: φέρω എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപം അക്ഷരാർഥത്തിൽ ‘എത്തിക്കപ്പെട്ടു’ എന്നാകാമെങ്കിലും, ശബ്ദത്തെക്കുറിച്ച് ആ രൂപം മലയാളത്തിൽ കൃത്രിമമാണ്; ‘അവന്റെ അടുക്കൽ വന്നു’ ലക്ഷ്യവും സംഭവവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τοιᾶσδε
  choice: ഇങ്ങനെയൊരു
  rationale: തുടർന്നുവരുന്ന ഉദ്ധരണിയിലേക്കു മുൻകൂട്ടി ചൂണ്ടുന്ന പദത്തിന്റെ പ്രവർത്തനം ചുരുക്കമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: മഹിമാപൂർണമായ തേജസ്സിൽനിന്ന്
  rationale: ദൈവസാന്നിധ്യത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്ന പ്രയോഗവും ശബ്ദത്തിന്റെ സ്വർഗീയ ഉറവിടവും സംരക്ഷിക്കുന്നു; ὑπόയുടെ കർത്തൃകാരകസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: ഇവൻ എന്റെ പുത്രൻ, എന്റെ പ്രിയൻ
  rationale: ‘എന്റെ പുത്രൻ’ എന്നും ‘എന്റെ പ്രിയൻ’ എന്നും സമാനാധികരണത്തിൽ വരുന്ന ഗ്രീക്ക് ഘടനയും ആവർത്തിച്ചുള്ള μου എന്ന ഉടമസ്ഥസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: ഇവനിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു
  rationale: εἰς എന്നതിന്റെ ദിശാത്മക രൂപത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഇവനിൽ’കൊണ്ട് സമീപിക്കുകയും ദൈവിക പ്രഖ്യാപനത്തിന്റെ തുടർന്നുനിൽക്കുന്ന പ്രസക്തി മലയാളത്തിലെ പൂർത്തവർത്തമാനരൂപത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു; ഭൂതകാലസൂചന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: τῆς μεγαλοπρεποῦς δόξης എന്ന ദൈവിക പരോക്ഷനാമപ്രയോഗം
  choice: മഹിമാപൂർണമായ തേജസ്സ്
  alternative: മഹത്തായ തേജസ്സ്; ദൈവിക മഹിമ
  rationale: ഈ വാക്യം ദൈവത്തിന്റെ മഹിമാപൂർണ സാന്നിധ്യത്തെ ആദരപൂർവം പരോക്ഷമായി സൂചിപ്പിക്കുന്നതാകാം. ‘ദൈവിക’ എന്നു വ്യാഖ്യാനിച്ച് ചേർക്കാതെ ആ ഉയർന്ന ഭാവം നിലനിർത്തുന്നു.
- issue: പുത്രനെക്കുറിച്ചുള്ള പിതാവിന്റെ പ്രഖ്യാപനത്തിലെ സമാനാധികരണം
  choice: ഇവൻ എന്റെ പുത്രൻ, എന്റെ പ്രിയൻ
  alternative: ഇവൻ എന്റെ പ്രിയപുത്രൻ
  rationale: ഗ്രീക്കിലെ രണ്ട് ഘടകങ്ങളെയും ഒന്നാക്കി ചുരുക്കാതെ അതിലെ ഊന്നലും സ്നേഹസൂചനയും സംരക്ഷിക്കുന്നു; പിന്നീടുള്ള സിദ്ധാന്തപരമായ ഭാഷ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: εὐδόκησα എന്ന ഭൂതകാലരൂപത്തിന്റെ കാലവും ബന്ധസൂചനയും
  choice: ഇവനിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു
  alternative: ഇവനിൽ ഞാൻ പ്രസാദിച്ചു; ഇവനോടു ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്ക് ഔപചാരികമായി ഭൂതകാലമാണെങ്കിലും സുവിശേഷവിവരണങ്ങളിലെ ദൈവിക പ്രഖ്യാപനത്തിന്റെ മലയാളപ്രയോഗത്തിൽ പൂർത്തവർത്തമാനം സ്വാഭാവികമാണ്. ഔപചാരിക ഭൂതകാലവും വ്യത്യസ്ത ബന്ധസൂചനയും അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘പിതാവായ ദൈവം’, ‘ബഹുമാനം’, ‘മഹത്ത്വം’, ‘തേജസ്സ്’, ‘പ്രസാദിച്ചിരിക്കുന്നു’ എന്നീ പദങ്ങൾ ഉയർന്ന ഭാവം നിലനിർത്തുമ്പോഴും പഴഞ്ചൊല്ലായോ വിഭാഗീയമായോ തോന്നാതിരിക്കാൻ ശ്രദ്ധിച്ചിട്ടുണ്ട്. വാക്യാവസാനത്തിലെ ദീർഘരേഖ അടുത്ത വാക്യത്തിലേക്കുള്ള മൂലപാഠത്തിന്റെ വ്യാകരണതുടർച്ച സൂചിപ്പിക്കുന്നു.
