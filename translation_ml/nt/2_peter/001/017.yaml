revisions:
- from: 'എന്തെന്നാൽ, പിതാവായ ദൈവത്തിൽനിന്ന് ബഹുമാനവും മഹത്ത്വവും അവൻ പ്രാപിച്ചപ്പോൾ, മഹിമാപൂർണമായ തേജസ്സിൽനിന്ന്[a] ഇങ്ങനെയൊരു ശബ്ദം അവന്റെ അടുക്കൽ വന്നു: “ഇവൻ എന്റെ പുത്രൻ, എന്റെ പ്രിയൻ[b]; ഇവനിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു[c]”—'
  to: 'എന്തെന്നാൽ, പിതാവായ ദൈവത്തിൽനിന്ന് ബഹുമാനവും മഹത്ത്വവും അവൻ പ്രാപിച്ചപ്പോൾ, മഹിമാപൂർണമായ തേജസ്സിൽനിന്ന്[a] ഇങ്ങനെയൊരു ശബ്ദം അവന്റെ അടുക്കൽ വന്നു: “ഇവൻ എന്റെ പുത്രൻ, എന്റെ പ്രിയൻ[b]; ഇവനിൽ ഞാൻ പ്രസാദിച്ചു[c]”—'
  rationale: Only the rendering of εὐδόκησα is changed, from a Malayalam perfect-present to the Greek aorist past, preserving the source tense without affecting the declaration’s solemn register. Footnote c is correspondingly updated, and footnote a is made grammatically clearer in Malayalam. No doctrinal interpretation is added.
