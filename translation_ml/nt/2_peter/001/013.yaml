id: 2PE.1.13
reference: 2 Peter 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: ml
  text: എന്നാൽ, ഞാൻ ഈ കൂടാരത്തിൽ[a] ഉള്ളിടത്തോളം, ഓർമിപ്പിച്ചുകൊണ്ട് നിങ്ങളെ ഉണർത്തുന്നത് ഉചിതമാണെന്ന് ഞാൻ കരുതുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഈ കൂടാരത്തിൽ.’ ഇവിടെ ‘കൂടാരം’ പത്രോസിന്റെ ഇപ്പോഴത്തെ മർത്യമായ ദേഹജീവിതത്തെ സൂചിപ്പിക്കുന്ന രൂപകമാണ്; ‘ഈ വാസസ്ഥലത്തിൽ’ അല്ലെങ്കിൽ ‘ഈ ശരീരത്തിൽ’ എന്നും അർഥമാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: ഉചിതം
  rationale: ἡγοῦμαι എന്ന ക്രിയയോടൊപ്പം ഇവിടെ ധാർമികമായ നീതി എന്നതിലുപരി യോജിച്ചതും ചെയ്യേണ്ടതുമായ കാര്യം എന്ന അർഥമാണ്; ‘ഉചിതം’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള മൃദുവായ വൈരുധ്യമോ ആശയവികാസമോ സൂചിപ്പിക്കുന്നു.
- source_word: ἡγοῦμαι
  choice: ഞാൻ കരുതുന്നു
  rationale: ആലോചിച്ചെത്തിയ വിലയിരുത്തൽ സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗം.
- source_word: ἐφ’ ὅσον
  choice: കഴിയുന്നിടത്തോളം
  rationale: εἰμί എന്നതിനോടൊപ്പം കാലപരമായ ‘ആയിരിക്കുന്ന കാലമത്രയും’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σκηνώματι
  choice: കൂടാരം
  rationale: ക്ഷണികമായ ഇപ്പോഴത്തെ ദേഹജീവിതത്തെ സൂചിപ്പിക്കുന്ന മൂലരൂപകം നിലനിർത്തുന്നു; അടുത്ത വാക്യത്തിലെ അതു നീക്കിവെക്കുന്നതുമായ ദൃശ്യബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: διεγείρειν
  choice: ഉണർത്തുന്നത്
  rationale: ഉറക്കത്തിൽനിന്നോ ജഡതയിൽനിന്നോ ഉണർത്തുക എന്ന രൂപകാർഥം നേരിട്ട് നിലനിർത്തുകയും ആത്മീയ-ധാർമിക പ്രേരണ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν ὑπομνήσει
  choice: ഓർമിപ്പിച്ചുകൊണ്ട്
  rationale: ഓർമപ്പെടുത്തൽ മുഖേന അവരെ ഉണർത്തുന്നു എന്ന മാർഗമോ രീതിയോ ലളിതമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ഈ കൂടാരം’ എന്ന രൂപകത്തിന്റെ സൂചിതാർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ഈ കൂടാരം’ എന്ന ദേഹരൂപകം നേരിട്ട് നിലനിർത്തുക.
  alternative: ‘ഈ ശരീരം’ അല്ലെങ്കിൽ ‘ഈ വാസസ്ഥലം’ എന്ന് വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം പത്രോസിന്റെ ഇപ്പോഴത്തെ മർത്യദേഹജീവിതത്തെ കൂടാരമെന്ന രൂപകത്തിലൂടെ അവതരിപ്പിക്കുന്നു. രൂപകം നിലനിർത്തുന്നത് ജീവിതത്തിന്റെ താൽക്കാലികതയും അടുത്ത വാക്യവുമായുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. വാക്യത്തിന്റെ ഗ്രീക്ക് ഘടനയും കൂടാരരൂപകവും സംരക്ഷിച്ചുകൊണ്ട് ‘ഓർമിപ്പിച്ചുകൊണ്ട്’ എന്ന സ്വാഭാവിക ക്രിയാവിശേഷണരൂപം ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
