id: 2PE.1.6
reference: 2 Peter 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: ml
  text: അറിവിൽ ആത്മനിയന്ത്രണവും, ആത്മനിയന്ത്രണത്തിൽ സ്ഥിരതയും[a], സ്ഥിരതയിൽ ദൈവഭക്തിയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്ഥിരത’ എന്നതിന് ‘സഹനം,’ ‘സ്ഥിരോത്സാഹം,’ അല്ലെങ്കിൽ ‘ക്ഷമയോടെയുള്ള സഹനം’ എന്നും പരിഭാഷപ്പെടുത്താം (ὑπομονή).
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ഈ വാക്യം സംക്ഷിപ്തമാണ്; മുൻവാക്യത്തിൽ ആരംഭിച്ച സദ്ഗുണശൃംഖല ഇവിടെ തുടരുന്നു. ഓരോ സദ്ഗുണത്തോടും അടുത്തത് ചേർക്കണമെന്ന ആശയമാണ് മനസ്സിലാക്കേണ്ടത്.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: അറിവിൽ
  rationale: γνῶσις എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘അറിവ്’ ഈ സദ്ഗുണപ്പട്ടികയിൽ സ്വാഭാവികവും മുൻവാക്യത്തിലെ ഘടനയോടു യോജിച്ചതുമാണ്.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: ആത്മനിയന്ത്രണം / ആത്മനിയന്ത്രണത്തിൽ
  rationale: സ്വന്തം ആഗ്രഹങ്ങളെയും പ്രേരണകളെയും നിയന്ത്രിക്കുന്ന ധാർമികശേഷിയെയാണ് ἐγκράτεια സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘ആത്മനിയന്ത്രണം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὑπομονήν / ὑπομονῇ
  choice: സ്ഥിരത / സ്ഥിരതയിൽ
  rationale: കഷ്ടതകളുടെ മധ്യേ ഉറച്ചുനിൽക്കുകയും തുടർന്നുകൊണ്ടിരിക്കുകയും ചെയ്യുന്നതാണ് ὑπομονήയുടെ ആശയം. ‘സ്ഥിരത’ അതിനെ ചുരുക്കമായും സദ്ഗുണപ്പട്ടികയ്ക്ക് യോജിച്ചും അവതരിപ്പിക്കുന്നു; വിപുലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: εὐσέβειαν
  choice: ദൈവഭക്തി
  rationale: ദൈവത്തോടുള്ള ഭയഭക്തിയും അത് ജീവിതത്തിൽ പ്രകടമാകുന്നതും εὐσέβεια സൂചിപ്പിക്കുന്നു. ‘ദൈവഭക്തി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സഭാവിഭാഗനിരപേക്ഷവുമായ പ്രയോഗമാണ്.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: …യിൽ …വും
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച സദ്ഗുണശൃംഖലയെ തുടരുന്ന ഗ്രീക്കിലെ സംക്ഷിപ്തഘടന മലയാളത്തിലും വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: δέ
  choice: –വും
  rationale: ഇവിടെ δέ വൈരുധ്യമല്ല, പട്ടികയിലെ അടുത്ത ഘടകം ചേർക്കുന്നതാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ‘–വും’ ആ കൂട്ടിച്ചേർക്കൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: സദ്ഗുണശൃംഖലയിലെ അപൂർണവാക്യഘടന
  choice: മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന സംക്ഷിപ്ത പട്ടികാഘടന നിലനിർത്തുക
  alternative: ‘അറിവിനോടൊപ്പം ആത്മനിയന്ത്രണവും … കൂട്ടിച്ചേർക്കുക’ എന്നു ക്രിയ വ്യക്തമാക്കി വികസിപ്പിക്കുക
  rationale: ഗ്രീക്കിൽ ക്രിയ ഈ വാക്യത്തിൽ ആവർത്തിക്കുന്നില്ല; 1:5-ലെ ആഹ്വാനം ഇവിടെ തുടർന്നുവരുന്നു. ക്രിയ ചേർത്ത് അർഥം തീർത്തുപറയാതെ ഉറവിടത്തിന്റെ സംക്ഷിപ്തതയും ബന്ധവും നിലനിർത്തുന്നു.
- issue: ὑπομονήയുടെ ധാർമിക വ്യാപ്തി
  choice: സ്ഥിരത
  alternative: സഹനം; സ്ഥിരോത്സാഹം; ക്ഷമയോടെയുള്ള സഹനം
  rationale: ഈ പദം വെറും നിഷ്ക്രിയമായ കാത്തിരിപ്പല്ല, പ്രയാസത്തിൽ ഉറച്ചുനിൽക്കലും ഉൾക്കൊള്ളുന്നു. ‘സ്ഥിരത’ ആ വ്യാപ്തി തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനവും സംക്ഷിപ്തതയും നിലനിർത്താൻ സമാന്തരമായ ‘…യിൽ …വും’ ഘടന ഉപയോഗിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനക്രിയ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
