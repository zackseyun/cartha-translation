revisions:
- from: ഞങ്ങൾ അവനോടുകൂടെ വിശുദ്ധമലയിൽ ഉണ്ടായിരുന്നപ്പോൾ സ്വർഗത്തിൽനിന്ന് വന്ന ഈ ശബ്ദം ഞങ്ങൾതന്നെ കേട്ടു.[a]
  to: ഞങ്ങൾ അവനോടുകൂടെ വിശുദ്ധമലയിൽ ഉണ്ടായിരുന്നപ്പോൾ, സ്വർഗത്തിൽനിന്ന് കൊണ്ടുവരപ്പെട്ട ഈ ശബ്ദം ഞങ്ങൾതന്നെ കേട്ടു.[a]
