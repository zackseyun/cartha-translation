id: 2PE.1.18
reference: 2 Peter 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: ml
  text: ഞങ്ങൾ അവനോടുകൂടെ വിശുദ്ധമലയിൽ ഉണ്ടായിരുന്നപ്പോൾ, സ്വർഗത്തിൽനിന്ന് കൊണ്ടുവരപ്പെട്ട ഈ ശബ്ദം ഞങ്ങൾതന്നെ കേട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വർഗത്തിൽനിന്ന് വഹിക്കപ്പെട്ട ഈ ശബ്ദം.’
    reason: ἐνεχθεῖσαν എന്ന passive participle-ന്റെ ‘വഹിക്കപ്പെട്ട’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ പദവികൽപം.
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: ഈ ശബ്ദം
  rationale: മുൻവാക്യത്തിലെ ദൈവിക ഉച്ചാരണത്തെയാണ് φωνή സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ശബ്ദം’ എന്നത് കേൾക്കപ്പെട്ട വാക്കുകളെയും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἡμεῖς
  choice: ഞങ്ങൾതന്നെ
  rationale: ക്രിയാരൂപത്തിൽ ഇതിനകം കർത്താവ് അടങ്ങിയിരിക്കെ പ്രത്യക്ഷ സർവനാമം നൽകിയിരിക്കുന്ന ഊന്നൽ ‘ഞങ്ങൾതന്നെ’ സംരക്ഷിക്കുന്നു; ദൃക്‌സാക്ഷ്യസ്വഭാവവും ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: ἠκούσαμεν
  choice: കേട്ടു
  rationale: ἀκούω എന്ന ക്രിയയുടെ aorist രൂപം ഇവിടെ സ്വർഗീയശബ്ദം കേട്ട സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘ശ്രദ്ധിച്ചു കേട്ടു’ എന്ന അധിക അർഥം ആവശ്യമില്ല.
- source_word: ἐξ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ഉത്ഭവസ്ഥാനം സൂചിപ്പിക്കുന്ന ἐκ എന്നതിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ἐνεχθεῖσαν
  choice: വന്ന
  rationale: φέρω എന്നതിന്റെ passive participle ശബ്ദം സ്വർഗത്തിൽനിന്ന് എത്തിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു. ശബ്ദത്തെക്കുറിച്ച് ‘വന്ന’ എന്ന പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; ക്രിയയുടെ ‘വഹിക്കപ്പെട്ടു/കൊണ്ടുവരപ്പെട്ടു’ എന്ന രൂപകഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: σὺν αὐτῷ ὄντες
  choice: ഞങ്ങൾ അവനോടുകൂടെ ... ഉണ്ടായിരുന്നപ്പോൾ
  rationale: പങ്കാളിത്തനിർമ്മിതിയുടെ കാലസംബന്ധം ‘ഉണ്ടായിരുന്നപ്പോൾ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘അവൻ’ സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: വിശുദ്ധമലയിൽ
  rationale: മലയാളത്തിൽ മലയുടെ മുകളിലോ മലപ്രദേശത്തോ ഉണ്ടായിരുന്നതിനെ ‘മലയിൽ’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്. ἅγιος എന്നതിന്റെ ബൈബിൾപരവും നിലവാരമുള്ളതുമായ തുല്യം ‘വിശുദ്ധ’ ആണ്.
theological_decisions:
- issue: ‘വിശുദ്ധമല’ ഏത് മലയെ സൂചിപ്പിക്കുന്നു
  choice: യേശുവിന്റെ രൂപാന്തരീകരണം നടന്ന മലയെ വിവരണാത്മകമായി സൂചിപ്പിക്കുന്നു; പ്രത്യേക മലയുടെ പേര് ചേർക്കുന്നില്ല.
  alternative: താബോർമല അല്ലെങ്കിൽ ഹെർമോൻമല എന്ന് വ്യക്തമായി തിരിച്ചറിയുക.
  rationale: ഗ്രീക്ക് പാഠം ‘വിശുദ്ധമല’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ. പാഠത്തിൽ ഇല്ലാത്ത പരമ്പരാഗതമോ ഭൂമിശാസ്ത്രപരമോ ആയ തിരിച്ചറിയൽ വിവർത്തനത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഞങ്ങൾതന്നെ’ എന്നത് മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കനുസരിച്ച് ക്രമപ്പെടുത്തി; മലയുടെ പേര് നിർണ്ണയിക്കാതെ മൂലപാഠത്തിന്റെ പരിധി പാലിച്ചു.
