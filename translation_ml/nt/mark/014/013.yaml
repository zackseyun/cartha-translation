id: MRK.14.13
reference: Mark 14:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: ml
  text: 'അവൻ തന്റെ ശിഷ്യന്മാരിൽ രണ്ടുപേരെ അയക്കുന്നു; അവരോടു പറയുന്നു: “നഗരത്തിലേക്കു പോകുക. വെള്ളം നിറച്ച ഒരു മൺകുടം ചുമന്നുകൊണ്ടിരിക്കുന്ന ഒരാൾ നിങ്ങളെ കണ്ടുമുട്ടും. അയാളെ പിന്തുടരുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλει
  choice: അയച്ചുകൊണ്ട്
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാന ശൈലി നിലനിർത്താനും തുടർന്നുള്ള ‘പറയുന്നു’ എന്ന ക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാനും ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരിൽ രണ്ടുപേരെ
  rationale: ഭാഗസൂചകമായ ഗ്രീക്ക് ഘടന കൃത്യവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; μαθητής എന്നതിന് സന്ദർഭോചിതമായ പതിവുപദം ‘ശിഷ്യൻ’ ആണ്.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം സംരക്ഷിച്ച് മർക്കോസിന്റെ സജീവമായ ആഖ്യാനശൈലി നിലനിർത്തുന്നു.
- source_word: Ὑπάγετε
  choice: പോകുക
  rationale: ബഹുവചന ആജ്ഞയുടെ ശക്തി വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς τὴν πόλιν
  choice: നഗരത്തിലേക്കു
  rationale: നഗരത്തിന്റെ ഉള്ളിലേക്കുള്ള ദിശയെ സൂചിപ്പിക്കുന്ന εἰς എന്ന പദത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπαντήσει ὑμῖν
  choice: നിങ്ങളെ കണ്ടുമുട്ടും
  rationale: ഭാവികാലവും നേരിട്ടുള്ള കണ്ടുമുട്ടലിന്റെ ആശയവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; കൂടിക്കാഴ്ച യാദൃച്ഛികമാണോ ഉദ്ദേശപൂർവമാണോ എന്ന് അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: ἄνθρωπος
  choice: ഒരാൾ
  rationale: സന്ദർഭത്തിലെ വ്യക്തിയെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള പുരുഷസൂചകമായ ‘അയാളെ’ എന്ന രൂപം വ്യക്തത നൽകുന്നു.
- source_word: κεράμιον ὕδατος
  choice: വെള്ളം നിറച്ച ഒരു മൺകുടം
  rationale: κεράμιον സാധാരണയായി മൺപാത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘വെള്ളം നിറച്ച’ എന്നത് പാത്രത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: βαστάζων
  choice: ചുമന്നുകൊണ്ടിരിക്കുന്ന
  rationale: പാത്രം കൊണ്ടുപോകുന്ന തുടരുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ ദൃശ്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: അയാളെ പിന്തുടരുക
  rationale: നേരിട്ടുള്ള ആജ്ഞയും നിർദ്ദിഷ്ട വ്യക്തിയുടെ പിന്നാലെ പോകുക എന്ന സന്ദർഭാർഥവും കൃത്യമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും ആഖ്യാനോചിതവുമായ ശൈലി. മർക്കോസിന്റെ ചരിത്രവർത്തമാനം ‘പറയുന്നു’ എന്ന രൂപത്തിലൂടെ സൂക്ഷിച്ചു. മുഖ്യപാഠത്തിലെ എല്ലാ ആജ്ഞകളും വ്യക്തവും നേരിട്ടുമാണ്.
