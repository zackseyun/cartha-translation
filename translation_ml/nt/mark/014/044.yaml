source:
  edition: SBLGNT
  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: ml
  text: 'അവനെ ഒറ്റിക്കൊടുക്കുന്നവൻ അവർക്ക് ഒരു തിരിച്ചറിയൽസൂചന[a] നൽകിയിരുന്നു: “ഞാൻ ആരെ ചുംബിക്കുന്നുവോ, അവൻ തന്നെയാണ്.[b] അവനെ പിടിച്ചു ഭദ്രമായി കൊണ്ടുപോകുവിൻ.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അടയാളം”; ആളെ തിരിച്ചറിയാൻ മുൻകൂട്ടി സമ്മതിച്ചിരുന്ന ഒരു സൂചന.
    reason: lexical_alternative
  - marker: b
    text: ചുംബനം അക്കാലത്ത് പതിവായിരുന്ന ഒരു അഭിവാദ്യരീതിയായിരുന്നു; ഇവിടെ അത് ആളെ തിരിച്ചറിയാനുള്ള സൂചനയായി പ്രവർത്തിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അല്ലെങ്കിൽ, “സുരക്ഷിതമായി കൊണ്ടുപോകുവിൻ.” ഇവിടെ “ഭദ്രമായി” എന്നത് അവൻ രക്ഷപ്പെടാതിരിക്കേണ്ടതിന് ഉറച്ച നിയന്ത്രണത്തിൽ കൊണ്ടുപോകുക എന്ന അർഥത്തിലായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: പറഞ്ഞുറപ്പിച്ചിരുന്നു
  rationale: പ്ലൂപർഫെക്റ്റ് രൂപം, അറസ്റ്റിന് മുമ്പേ അടയാളം നിശ്ചയിച്ചിരുന്നുവെന്ന മുൻകാലപൂർണ അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘അടയാളം പറഞ്ഞുറപ്പിച്ചിരുന്നു’ എന്നത് ക്രമീകരണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: അവനെ ഒറ്റിക്കൊടുക്കുന്നവൻ
  rationale: വർത്തമാന കൃതന്തത്തിന്റെ പുരോഗമിക്കുന്ന പ്രവൃത്തിഭാവം നിലനിർത്തുകയും സന്ദർഭത്തിലെ വഞ്ചനയുടെ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: σύσσημον
  choice: ഒരു അടയാളം
  rationale: മുൻകൂട്ടി സമ്മതിച്ച തിരിച്ചറിയൽസൂചനയാണ് ഉദ്ദേശ്യം. ‘അടയാളം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; അതിന്റെ ധാരണാപരമായ സ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ὃν ἂν φιλήσω
  choice: ഞാൻ ആരെ ചുംബിക്കുന്നുവോ
  rationale: ἄν ചേർന്ന അനിശ്ചിത ബന്ധവാക്യത്തിന്റെ തിരിച്ചറിയൽസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: αὐτός ἐστιν
  choice: അവൻ തന്നെയാണ്
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘തന്നെ’ വഴി നിലനിർത്തുന്നു.
- source_word: κρατήσατε
  choice: പിടിച്ച്
  rationale: ബലമായി കൈവശപ്പെടുത്തുക എന്ന ക്രിയയുടെ ശാരീരികവും അടിയന്തരവുമായ ഭാവം നൽകുന്നു; നിയമനടപടി എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: ἀπάγετε ἀσφαλῶς
  choice: ഭദ്രമായി കൊണ്ടുപോകുവിൻ
  rationale: അവൻ രക്ഷപ്പെടാതിരിക്കത്തക്കവിധം ഉറച്ച കാവലിൽ കൊണ്ടുപോകുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; യേശുവിന്റെ ക്ഷേമത്തെ സൂചിപ്പിക്കുന്ന ‘സുരക്ഷിതമായി’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘ഭദ്രമായി’ തിരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നേരിട്ടുള്ള വാക്കുകളിൽ ബൈബിൾ ശൈലിക്ക് യോജിച്ച ‘കൊണ്ടുപോകുവിൻ’ നിലനിർത്തി. δέ-യ്ക്ക് ഉറവിടത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ കൃത്രിമമായ കാലസൂചകം ചേർത്തിട്ടില്ല.
