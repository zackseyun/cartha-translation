id: MRK.14.18
reference: Mark 14:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: ml
  text: 'അവർ ചാരിക്കിടന്ന് ഭക്ഷണം കഴിച്ചുകൊണ്ടിരിക്കുമ്പോൾ[a] യേശു പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു[b], നിങ്ങളിൽ ഒരാൾ—എന്നോടൊപ്പം ഭക്ഷണം കഴിക്കുന്നവൻ—എന്നെ ഒറ്റിക്കൊടുക്കും[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അന്നത്തെ ഔപചാരിക വിരുന്നുകളിൽ മേശയ്ക്കരികിൽ ചാരിക്കിടന്ന് ഭക്ഷണം കഴിക്കുന്നതായിരുന്നു പതിവ്.
    reason: cultural_note
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ആമേൻ, ഞാൻ നിങ്ങളോടു പറയുന്നു.”'
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: “എന്നെ ഏല്പിച്ചുകൊടുക്കും” അഥവാ “എന്നെ കൈമാറും.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഏല്പിച്ചുകൊടുക്കുക, കൈമാറുക, ഒറ്റിക്കൊടുക്കുക എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ യേശുവിന്റെ സ്വന്തം സഹചാരികളിലൊരാൾ വഞ്ചനാപൂർവം അവനെ കൈമാറുന്നതാണ് ഉദ്ദേശ്യം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: ചാരിക്കിടന്ന്
  rationale: പുരാതന മധ്യധരണ്യദേശത്തിലെ ഔപചാരിക വിരുന്നുകളിൽ പതിവായിരുന്ന ചാരിക്കിടന്നുള്ള ഭക്ഷണഭാവം നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘ഇരിക്കുമ്പോൾ’ എന്നതിനെക്കാൾ ചരിത്രരംഗം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἐσθιόντων / ὁ ἐσθίων
  choice: ഭക്ഷണം കഴിച്ചുകൊണ്ടിരിക്കുമ്പോൾ / ഭക്ഷണം കഴിക്കുന്നവൻ
  rationale: ἐσθίω എന്ന ക്രിയയുടെ ലളിതമായ അർഥമായ ‘ഭക്ഷണം കഴിക്കുക’ നിലനിർത്തുന്നു. അവസാനത്തെ ആർട്ടിക്കിൾ ചേർന്ന കൃദന്തം ‘ഭക്ഷണം കഴിക്കുന്നവൻ’ എന്നു ബന്ധവാചകസമാനമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവപൂർണമായ ആമുഖപ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ആമേൻ’ എന്ന കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: εἷς ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ഒരാൾ
  rationale: സംഘത്തിലെ ഒരംഗത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: παραδώσει
  choice: ഒറ്റിക്കൊടുക്കും
  rationale: ക്രിയയ്ക്ക് പൊതുവെ ‘ഏല്പിച്ചുകൊടുക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും, യേശുവിനൊപ്പം ഭക്ഷണം പങ്കിടുന്ന അടുത്ത അനുയായി അവനെ ശത്രുക്കൾക്ക് കൈമാറുന്ന ഈ സന്ദർഭത്തിലെ വഞ്ചനാഭാവം ‘ഒറ്റിക്കൊടുക്കും’ വ്യക്തമായി അറിയിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥമായ പകരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടൊപ്പം
  rationale: സഹവർത്തിത്വത്തെ ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പീഡാനുഭവസന്ദർഭത്തിൽ παραδώσει എന്നതിന്റെ പരിഭാഷ
  choice: ഒറ്റിക്കൊടുക്കും
  alternative: ഏല്പിച്ചുകൊടുക്കും / കൈമാറും
  rationale: ഗ്രീക്ക് ക്രിയ സ്വതവേ എല്ലായിടത്തും ‘വഞ്ചിക്കുക’ എന്നർഥമല്ല. എന്നാൽ ഇവിടെ യേശുവിനൊപ്പം മേശപങ്കിടുന്ന ഒരാൾ അവനെ എതിരാളികൾക്ക് കൈമാറുന്നതായതിനാൽ ബന്ധവഞ്ചനയുടെ ഭാവം സന്ദർഭത്തിൽ വ്യക്തമാണ്. അതേസമയം ക്രിയയുടെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചരിത്രപരമായ ഭക്ഷണഭാവം മുഖ്യവാചകത്തിൽ നിലനിർത്തി സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി. ദീർഘമായ വാക്യം വായിക്കാൻ എളുപ്പമാക്കാൻ ‘എന്നോടൊപ്പം ഭക്ഷണം കഴിക്കുന്നവൻ’ എന്ന ഭാഗം ഇടവരകളാൽ വേർതിരിച്ചു.
