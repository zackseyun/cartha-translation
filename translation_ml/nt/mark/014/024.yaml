id: MRK.14.24
reference: Mark 14:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഇത് എന്റെ രക്തമാണ്—ഉടമ്പടിയുടെ രക്തം[a]—അനേകർക്കുവേണ്ടി[c] ചൊരിയപ്പെടുന്നത്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളും സമാന്തരവിവരണങ്ങളും ‘എന്റെ രക്തം—പുതിയ ഉടമ്പടിയുടെ രക്തം’ എന്നു വായിക്കുന്നു. എന്നാൽ ഇവിടെ മർക്കോസിന്റെ ഗ്രീക്കുപാഠത്തിലെ ഏറ്റവും നല്ല വായന ‘എന്റെ രക്തം—ഉടമ്പടിയുടെ രക്തം’ എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: അല്ലെങ്കിൽ ‘ചൊരിയപ്പെട്ടുകൊണ്ടിരിക്കുന്നത്’; പരമ്പരാഗതമായി, ‘ഒഴുക്കപ്പെടുന്നത്’.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘അനേകരുടെ പക്ഷമായി’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: ഇത് ... ആണ്
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള ബന്ധകക്രിയാപ്രയോഗം നിലനിർത്തുന്നു; ‘ഇത് അർഥമാക്കുന്നത്’ എന്നോ ‘ഇത് പ്രതിനിധാനം ചെയ്യുന്നത്’ എന്നോ വ്യാഖ്യാനപരമായി മാറ്റുന്നില്ല.
- source_word: τὸ αἷμά μου
  choice: എന്റെ രക്തം
  rationale: കൈവശബന്ധം നേരിട്ട് വിവർത്തനം ചെയ്യുകയും യാഗപരവും ഉടമ്പടിസംബന്ധവുമായ ‘രക്തം’ എന്ന ദൃശ്യഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τῆς διαθήκης
  choice: ഉടമ്പടിയുടെ രക്തം
  rationale: അന്ത്യ അത്താഴത്തിന്റെ പശ്ചാത്തലത്തിലും പുറപ്പാട് 24:8-ലെ പ്രതിധ്വനിയിലും διαθήκη എന്നത് ‘ഉടമ്പടി’ എന്നാണ്. മലയാളത്തിൽ ‘എന്റെ ഉടമ്പടിയുടെ രക്തം’ എന്നു തെറ്റായി ഗ്രഹിക്കപ്പെടാതിരിക്കാൻ വിശദീകരണസ്വഭാവമുള്ള ഇടച്ചൊല്ലായി ചേർത്തിരിക്കുന്നു.
- source_word: ἐκχυννόμενον
  choice: ചൊരിയപ്പെടുന്നത്
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ പുരോഗമന/സന്നിഹിത ഭാവം സൂക്ഷിക്കുകയും രക്തം ഒഴുക്കുന്ന യാഗദൃശ്യഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὑπὲρ πολλῶν
  choice: അനേകർക്കുവേണ്ടി
  rationale: ὑπέρ + ഷഷ്ഠിയുടെ പ്രതിനിധിത്വപരമായ അർഥസാധ്യത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘എല്ലാവർക്കുംവേണ്ടി’ എന്ന് മാറ്റി ദൈവശാസ്ത്രവിവാദം തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: διαθήκη എന്ന പദത്തിന്റെ ഉടമ്പടിസംബന്ധമായോ വിൽപത്രസംബന്ധമായോ ഉള്ള അർഥം
  choice: ഉടമ്പടി
  alternative: വിൽപത്രം
  rationale: രക്തത്തെക്കുറിച്ചുള്ള ഭാഷയും പുറപ്പാട് 24:8-ന്റെ പ്രതിധ്വനിയും ഉള്ള ഈ സന്ദർഭത്തിൽ ‘ഉടമ്പടി’ തന്നെയാണ് വ്യക്തമായ അർഥം.
- issue: ഉടമ്പടിക്കു മുമ്പ് ‘പുതിയ’ എന്നു ചേർക്കണമോ
  choice: ഉടമ്പടിയുടെ
  alternative: പുതിയ ഉടമ്പടിയുടെ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ καινῆς (‘പുതിയ’) ഇല്ല. സമാന്തരപാഠങ്ങളോടോ പരിചിത പാരമ്പര്യത്തോടോ ഒത്താക്കാൻ മൂലപാഠത്തിൽ ഇല്ലാത്ത പദം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല; പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: ὑπὲρ πολλῶν പ്രായശ്ചിത്തത്തിന്റെ വ്യാപ്തിയെക്കുറിച്ച് സൂചിപ്പിക്കുന്നത്
  choice: അനേകർക്കുവേണ്ടി
  alternative: എല്ലാവർക്കുംവേണ്ടി; അനേകരുടെ പക്ഷമായി
  rationale: ‘അനേകർ’ എന്ന മൂലപദം അതേപടി നിലനിർത്തുന്നു; ഇതിലൂടെ വിശാലമായ ദൈവശാസ്ത്രവിവാദം വിവർത്തനത്തിൽ തന്നെ പരിഹരിക്കാൻ ശ്രമിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എന്റെ ഉടമ്പടിയുടെ രക്തം’ എന്ന തെറ്റായ ബന്ധം ഒഴിവാക്കാനും ഗ്രീക്കിലെ ‘എന്റെ രക്തം—ഉടമ്പടിയുടെ രക്തം’ എന്ന ബന്ധം വ്യക്തമാക്കാനും ഡാഷുകൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ഘടകങ്ങൾക്കു തൊട്ടുപിന്നാലെ നൽകിയിരിക്കുന്നു.
