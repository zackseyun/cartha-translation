id: MRK.14.43
reference: Mark 14:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: ml
  text: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഉടനെ പന്ത്രണ്ടുപേരിൽ ഒരുവനായ യൂദാസ് അവിടെയെത്തി[a]. അവനോടൊപ്പം വാളുകളും വടികളുമായി[b] മഹാപുരോഹിതന്മാരിൽനിന്നും ശാസ്ത്രിമാരിൽനിന്നും മൂപ്പന്മാരിൽനിന്നും വന്ന ഒരു ജനക്കൂട്ടവും[c][d] വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ഇവിടെ ആഖ്യാനത്തിന് സജീവത നൽകുന്ന ചരിത്രവർത്തമാനകാലമാണ്—അക്ഷരാർഥത്തിൽ ‘എത്തുന്നു’.
    reason: lexical_alternative
  - marker: b
    text: ‘വടികൾ’ എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ അക്ഷരാർഥം ‘മരം’ എന്നാണ്; ഇവിടെ ആയുധങ്ങളായ അടിവടികളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘ജനക്കൂട്ടം’ എന്നതിനു സന്ദർഭം പരിഗണിച്ച് ‘അക്രമിക്കൂട്ടം’ എന്നും പറയാം; എന്നാൽ ഗ്രീക്ക് പദം സ്വതവേ ‘ജനക്കൂട്ടം’ എന്നാണ്.
    reason: lexical_alternative
  - marker: d
    text: ‘മഹാപുരോഹിതന്മാരും ശാസ്ത്രിമാരും മൂപ്പന്മാരും അയച്ച ഒരു ജനക്കൂട്ടം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘അവരിൽനിന്ന്’ എന്നാണ്; ഇത് ഉറവിടമോ അധികാരമോ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ ആഖ്യാനത്തിലെ പെട്ടെന്നുള്ള സംഭവഗതിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ
  rationale: സമകാലികമായി തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് genitive absolute ഘടനയും ἔτι എന്നതിന്റെ ‘ഇനിയും’ എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: παραγίνεται
  choice: അവിടെയെത്തി
  rationale: സംഭവസ്ഥലത്തേക്കുള്ള വരവ് വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ സ്വാഭാവിക മലയാള ആഖ്യാനത്തിനനുസരിച്ച് ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εἷς τῶν δώδεκα
  choice: പന്ത്രണ്ടുപേരിൽ ഒരുവനായ
  rationale: ‘പന്ത്രണ്ടുപേർ’ എന്ന അംഗീകൃത സംഘനാമത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ശിഷ്യൻ’ ചേർക്കുന്നില്ല.
- source_word: ὄχλος
  choice: ഒരു ജനക്കൂട്ടം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം നൽകുന്നു; സന്ദർഭത്തിലെ ശത്രുതയെ ‘അക്രമിക്കൂട്ടം’ പോലുള്ള ശക്തമായ പദം മുൻകൂട്ടി അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: μαχαιρῶν
  choice: വാളുകൾ
  rationale: μάχαιρα ചെറുവാളിനെയോ കഠാരയെയോ സൂചിപ്പിക്കാമെങ്കിലും അറസ്റ്റിന്റെ ഈ സന്ദർഭത്തിൽ ‘വാളുകൾ’ സ്വാഭാവികവും ആവശ്യത്തിന് കൃത്യവുമാണ്.
- source_word: ξύλων
  choice: വടികൾ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘മരം/മരവസ്തുക്കൾ’ എന്നാണെങ്കിലും ഇവിടെ ആയുധമായി കൊണ്ടുവന്ന അടിവടികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: മഹാപുരോഹിതന്മാരുടെയും ശാസ്ത്രിമാരുടെയും മൂപ്പന്മാരുടെയും അടുക്കൽനിന്നുള്ളവർ
  rationale: παρά + genitive സൂചിപ്പിക്കുന്ന ഉറവിടമോ അധികാരബന്ധമോ നിലനിർത്തുന്നു; ‘അയച്ചവർ’ എന്ന് മൂലത്തേക്കാൾ വ്യക്തമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἀρχιερέων
  choice: മഹാപുരോഹിതന്മാർ
  rationale: സുവിശേഷങ്ങളിലെ ബഹുവചനം നിലവിലെ ഏക മഹാപുരോഹിതനെ മാത്രം അല്ല, പുരോഹിതനേതൃത്വവർഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ഈ പദം പരിചിതമാണ്.
- source_word: γραμματέων
  choice: ശാസ്ത്രിമാർ
  rationale: യഹൂദ നിയമപണ്ഡിതരും എഴുത്തുകാരുമായ ഔദ്യോഗിക വിഭാഗത്തിനുള്ള നേരിട്ടുള്ള, പ്രചാരത്തിലുള്ള മലയാള സമാനപദം.
- source_word: πρεσβυτέρων
  choice: മൂപ്പന്മാർ
  rationale: അംഗീകൃത യഹൂദ സാമൂഹിക-രാഷ്ട്രീയ നേതാക്കളെ സൂചിപ്പിക്കുന്ന സ്ഥാപനപരമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: παραγίνεται എന്ന ചരിത്രവർത്തമാനത്തിന്റെ അവതരണം
  choice: മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലമായ ‘അവിടെയെത്തി’ ഉപയോഗിച്ചു
  alternative: ഗ്രീക്കിന്റെ ദൃശ്യത അനുകരിച്ച് ‘എത്തുന്നു’ എന്ന വർത്തമാനകാലം ഉപയോഗിക്കുക
  rationale: മൂലത്തിലെ വർത്തമാനകാലം രംഗത്തിന് സജീവത നൽകുന്നു; എന്നാൽ തുടർച്ചയായ മലയാള ഭൂതകാല ആഖ്യാനത്തിൽ ‘എത്തി’ കൂടുതൽ സ്വാഭാവികമാണ്. അടിക്കുറിപ്പ് മൂലരൂപത്തിന്റെ പ്രത്യേകത രേഖപ്പെടുത്തുന്നു.
- issue: നേതാക്കളോടൊപ്പമുള്ള παρά എന്ന മുൻവാക്കിന്റെ ബന്ധം
  choice: ‘അടുക്കൽനിന്നുള്ളവർ’ എന്നു നൽകി ഉറവിടം/അധികാരബന്ധം സൂക്ഷിച്ചു
  alternative: ‘അയച്ചവർ’ എന്നു വ്യക്തമായ നിയോഗം സൂചിപ്പിക്കുക
  rationale: വാക്യം ജനക്കൂട്ടത്തിന്റെ ഉറവിടമോ അധികാരബന്ധമോ വ്യക്തമാക്കുന്നു; അയച്ച നടപടിയുടെ രീതി നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ അധികവിവരം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശാസ്ത്രിമാർ’, ‘മൂപ്പന്മാർ’, ‘മഹാപുരോഹിതന്മാർ’ എന്നീ പരിചിതമായ വേദപുസ്തക-സ്ഥാപനപദങ്ങൾ നിലനിർത്തി. ഗ്രീക്ക് വാക്യത്തിലെ നീണ്ട ഏകഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; സംഭവക്രമവും ബന്ധങ്ങളും മാറ്റിയിട്ടില്ല.
