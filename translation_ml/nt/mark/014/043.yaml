revisions:
- from: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ, ഉടനെ പന്ത്രണ്ടുപേരിൽ ഒരുവനായ യൂദാസ് അവിടെയെത്തി[a]. അവനോടൊപ്പം വാളുകളും വടികളുമായി[b] ഒരു ജനക്കൂട്ടവും[c] വന്നു; അവർ മഹാപുരോഹിതന്മാരുടെയും ശാസ്ത്രിമാരുടെയും മൂപ്പന്മാരുടെയും അടുക്കൽനിന്നുള്ളവരായിരുന്നു[d].
  to: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഉടനെ പന്ത്രണ്ടുപേരിൽ ഒരുവനായ യൂദാസ് അവിടെയെത്തി[a]. അവനോടൊപ്പം വാളുകളും വടികളുമായി[b] മഹാപുരോഹിതന്മാരിൽനിന്നും ശാസ്ത്രിമാരിൽനിന്നും മൂപ്പന്മാരിൽനിന്നും വന്ന ഒരു ജനക്കൂട്ടവും[c][d] വന്നു.
  rationale: The revision preserves every source element while attaching the final ‘from’ phrase directly to the crowd, as in the Greek. It does not impose the stronger interpretation ‘sent by,’ though that remains appropriately noted as an alternative. The footnote anchors are retained and placed directly after their relevant words or phrase.
