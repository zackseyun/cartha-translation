reference: Mark 14:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “നിങ്ങൾ എല്ലാവരും ഇടറിപ്പോകും[a]. എന്തെന്നാൽ, ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: ‘ഞാൻ ഇടയനെ അടിക്കും; ആടുകൾ ചിതറിപ്പോകും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, “നിങ്ങൾ എല്ലാവരും ഇടറും” അല്ലെങ്കിൽ “നിങ്ങൾ എല്ലാവരും ഇടറാൻ ഇടയാക്കപ്പെടും.” സന്ദർഭത്തിൽ ഇത് യേശുവിനെ ഉപേക്ഷിച്ചുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്ക് യോജിച്ച് ഭൂതകാലം ഉപയോഗിച്ചു; സംഭവത്തിന്റെ അർഥത്തിൽ മാറ്റമില്ല.
- source_word: σκανδαλισθήσεσθε
  choice: ഇടറിപ്പോകും
  rationale: ക്രിയയുടെ ‘ഇടറുക/വീഴ്ചവരുക’ എന്ന രൂപകം നിലനിർത്തുകയും, സന്ദർഭത്തിലെ ശിഷ്യന്മാരുടെ പരാജയവും യേശുവിനെ ഉപേക്ഷിക്കലും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; കർത്തരി-കർമണി ഭാവത്തിലെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന സമ്പൂർണ കർമണി സൂത്രവാക്യത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: Πατάξω
  choice: ഞാൻ ... അടിക്കും
  rationale: ഭാവികാലവും പ്രഥമപുരുഷ കർത്താവും പ്രഹരത്തിന്റെ ശക്തിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ποιμένα
  choice: ഇടയനെ
  rationale: ഏകവചനത്തിലുള്ള ഇടയരൂപകം കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: τὰ πρόβατα
  choice: ആടുകൾ
  rationale: കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന രൂപകം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: διασκορπισθήσονται
  choice: ചിതറിപ്പോകും
  rationale: ഇടയൻ അടിക്കപ്പെട്ടതിനെ തുടർന്ന് ആട്ടിൻകൂട്ടം പല ദിശകളിലായി പിരിയുന്ന ദൃശ്യവും ഭാവികാലവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: σκανδαλισθήσεσθε എന്ന പദം ശിഷ്യന്മാരുടെ പ്രതികരണവുമായി ബന്ധപ്പെടുത്തി വിവർത്തനം ചെയ്യുന്നത്
  choice: ഇടറിപ്പോകും
  alternative: എന്നെ ഉപേക്ഷിച്ചുപോകും; ഇടറിക്കപ്പെടും
  rationale: ‘ഇടറിപ്പോകും’ എന്നത് മൂലപദത്തിന്റെ രൂപകം നിലനിർത്തുകയും സന്ദർഭത്തിലെ പരാജയവും പിരിഞ്ഞുപോകലും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. ‘ഉപേക്ഷിച്ചുപോകും’ എന്നത് സന്ദർഭാർത്ഥം കൂടുതൽ വ്യക്തമാക്കുമെങ്കിലും മൂലത്തിലുള്ള അർത്ഥവ്യാപ്തിയെ ചുരുക്കാം; ‘ഇടറിക്കപ്പെടും’ കർമണി രൂപം കൂടുതൽ നേരിട്ട് കാണിച്ചാലും മലയാളത്തിൽ അസ്വാഭാവികമാണ്. അതിനാൽ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. മർക്കോസിന്റെ ഗ്രീക്ക് ചരിത്രവർത്തമാനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനഭൂതകാലമായി നൽകി. തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ പ്രവാചകസ്വരവും ഇടയൻ–ആടുകൾ എന്ന രൂപകവും സംരക്ഷിച്ചു.
