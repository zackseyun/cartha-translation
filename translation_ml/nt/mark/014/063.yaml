  to: 'അപ്പോൾ മഹാപുരോഹിതൻ തന്റെ വസ്ത്രങ്ങൾ[a] കീറി പറഞ്ഞു[b]: “ഇനിയും നമുക്ക് സാക്ഷികളുടെ എന്ത് ആവശ്യമുണ്ട്?”'
