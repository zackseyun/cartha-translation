  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: ml
  text: 'അപ്പോൾ മഹാപുരോഹിതൻ തന്റെ വസ്ത്രങ്ങൾ[a] കീറി പറഞ്ഞു[b]: “ഇനിയും നമുക്ക് സാക്ഷികളുടെ എന്ത് ആവശ്യമുണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ അങ്കികൾ.”
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണ്: “പറയുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: വിചാരണയ്ക്ക് നേതൃത്വം നൽകുന്ന ഏക ഔദ്യോഗിക സ്ഥാനധാരിയെ സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ സ്ഥാപിതവും കൃത്യവുമായ പദം.
- source_word: διαρρήξας
  choice: കീറിക്കൊണ്ട്
  rationale: വസ്ത്രങ്ങൾ കീറുന്ന പ്രവൃത്തിയെയും തുടർന്ന് പറയുന്ന വാക്കുകളുമായുള്ള അതിന്റെ അടുത്ത ബന്ധത്തെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: തന്റെ വസ്ത്രങ്ങൾ
  rationale: χίτων എന്നത് അങ്കി പോലുള്ള പ്രത്യേക വസ്ത്രത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ ബഹുവചനത്തെ നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായി ആചാരവസ്ത്രം എന്നു നിർണയിക്കാത്ത സ്വാഭാവിക വിവർത്തനം.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു; മൂലരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Τί ἔτι χρείαν ἔχομεν μαρτύρων
  choice: ഇനിയും നമുക്ക് സാക്ഷികളെക്കൊണ്ട് എന്ത് ആവശ്യം?
  rationale: ἔτι എന്നതിലെ ‘ഇനിയും’ എന്ന ആശയവും χρείαν ἔχομεν എന്ന ചോദ്യത്തിന്റെ ശക്തിയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: മഹാപുരോഹിതൻ വസ്ത്രങ്ങൾ കീറിയ പ്രവൃത്തിയുടെ അർത്ഥം
  choice: വസ്ത്രങ്ങൾ കീറിയെന്ന പ്രവൃത്തി മാത്രം രേഖപ്പെടുത്തി; അതിന്റെ കാരണം വിശദീകരിച്ചില്ല.
  alternative: ദൈവദൂഷണം കേട്ടതിലുള്ള ദുഃഖമോ രോഷമോ പ്രകടിപ്പിച്ചതായി വ്യാഖ്യാനിച്ച് ചേർക്കുക.
  rationale: ഈ വാക്യം ആ പ്രവൃത്തിയുടെ അർത്ഥം തുറന്നു പറയുന്നില്ല. അതിനാൽ ദുഃഖം, രോഷം, അല്ലെങ്കിൽ ദൈവദൂഷണാരോപണം എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ആഖ്യാനത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘മഹാപുരോഹിതൻ’ എന്ന സ്ഥാപിത ബൈബിൾപദം നിലനിർത്തി; മറ്റു ഘടകങ്ങളിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ ഉപയോഗിച്ചു.
