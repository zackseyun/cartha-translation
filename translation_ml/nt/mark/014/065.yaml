id: MRK.14.65
reference: Mark 14:65
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: ml
  text: ചിലർ അവന്റെമേൽ തുപ്പാനും അവന്റെ മുഖം മൂടാനും[a] അവനെ മുഷ്ടികൊണ്ട് അടിക്കാനും അവനോട്, “പ്രവചിക്കൂ!” എന്നു പറയാനും തുടങ്ങി. കാവൽക്കാർ അവനെ പ്രഹരിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ കണ്ണുകെട്ടാനും.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “അവന്റെ മുഖം മൂടാനും” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കാവൽക്കാർ അവനെ പ്രഹരങ്ങളോടെ ഏറ്റെടുത്തു.” ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ ഇങ്ങനെയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό
  choice: തുടങ്ങി
  rationale: തുടർന്നുവരുന്ന ക്രിയാനാമങ്ങളോടൊപ്പമുള്ള ἄρχομαι എന്ന പദത്തിന്റെ ആരംഭസൂചക അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τινες
  choice: ചിലർ
  rationale: കൂട്ടത്തിലെ ആരെന്ന് വ്യക്തമാക്കാത്ത ചില വ്യക്തികളെ ചുരുക്കമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: ἐμπτύειν αὐτῷ
  choice: അവന്റെമേൽ തുപ്പാൻ
  rationale: ദത്തിവോടുകൂടിയ ക്രിയ നേരിട്ടുള്ള അപമാനകരമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവന്റെമേൽ തുപ്പുക’ സ്വാഭാവികമാണ്.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: അവന്റെ മുഖം മൂടാൻ
  rationale: ഗ്രീക്കിലെ ‘അവന്റെ മുഖം മൂടുക’ എന്ന പ്രകടമായ വാക്കുകളോട് ചേർന്നുനിൽക്കുന്നു; ഉദ്ദേശ്യം കണ്ണുകെട്ടലായിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κολαφίζειν αὐτὸν
  choice: അവനെ മുഷ്ടികൊണ്ട് ഇടിക്കാൻ
  rationale: κολαφίζω സാധാരണയായി മുഷ്ടികൊണ്ടുള്ള പ്രഹരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘അടിക്കുക’ എന്നതിലധികം കൃത്യത നൽകുന്നു.
- source_word: λέγειν αὐτῷ· Προφήτευσον
  choice: അവനോട്, “പ്രവചിക്കൂ!” എന്നു പറയാൻ
  rationale: വിശദീകരണം ചേർക്കാതെ പരിഹാസരൂപത്തിലുള്ള നേരിട്ടുള്ള ആജ്ഞ അതേപടി നിലനിർത്തുന്നു.
- source_word: ὑπηρέται
  choice: കാവൽക്കാർ
  rationale: ഈ ന്യായവിചാരണാ സാഹചര്യത്തിൽ ഗാർഹിക ദാസന്മാരെയല്ല, കീഴുദ്യോഗസ്ഥരായ കാവൽക്കാരെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: ῥαπίσμασιν
  choice: അടിച്ചുകൊണ്ട്
  rationale: കൈകൊണ്ടോ മറ്റുവിധത്തിലോ ഏൽപ്പിച്ച പ്രഹരങ്ങളെ സൂചിപ്പിക്കാൻ അമിതകൃത്യത ഒഴിവാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἔλαβον
  choice: ഏറ്റെടുത്തു
  rationale: ‘പ്രഹരങ്ങളാൽ അവനെ സ്വീകരിച്ചു/ഏറ്റെടുത്തു’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അസാധാരണവും നിന്ദാസൂചകവുമായ ഭാവം പരമാവധി നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വ്യക്തിത്വത്തിന്റെ പശ്ചാത്തലത്തിൽ Προφήτευσον എന്ന പരിഹാസാജ്ഞയുടെ വിവർത്തനം
  choice: “പ്രവചിക്കൂ!”
  alternative: “ഞങ്ങളോടു പ്രവചിക്കൂ!” / “നീ പ്രവാചകനാണെന്നു കാണിക്കൂ!”
  rationale: മൂലപാഠം വെറും ആജ്ഞ മാത്രമാണ് നൽകുന്നത്. അതിനാൽ അതിലെ ആഖ്യാനപരമായ വിരോധാഭാസം നിലനിർത്തിക്കൊണ്ട് വിശദീകരണപരമോ സിദ്ധാന്തപരമോ ആയ വാക്കുകൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പീഡനത്തിന്റെ കഠിനത മൃദൂകരിക്കാതെയും ഗ്രീക്ക് അവസാനപ്രയോഗത്തിന്റെ അസാധാരണത പൂർണമായി സ്വാഭാവികമാക്കി മറച്ചുകളയാതെയും optimal-equivalence പിന്തുടരുന്നു.
