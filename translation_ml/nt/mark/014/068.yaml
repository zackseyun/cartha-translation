language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അത് നിഷേധിച്ചുകൊണ്ട് പറഞ്ഞു: “നീ പറയുന്നത് എന്താണെന്ന് എനിക്ക് അറിയുകയുമില്ല, മനസ്സിലാകുകയുമില്ല.” പിന്നെ അവൻ പുറത്തേക്ക്, മുൻമുറ്റത്തേക്കു പോയി; ഒരു പൂവൻകോഴി കൂവി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ഒരു പൂവൻകോഴി കൂവി” എന്ന വാക്യഭാഗമില്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: അവൻ അത് നിഷേധിച്ചു
  rationale: ക്രിയയ്ക്ക് ഇവിടെ ‘നിഷേധിക്കുക, സമ്മതിക്കാതിരിക്കുക’ എന്ന അർഥമാണ്. സന്ദർഭത്തിലെ ആരോപണമാണ് പരോക്ഷമായ കർമം; യേശുവിനെ നേരിട്ട് കർമമായി ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാകും.
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: എനിക്ക് അറിയുകയുമില്ല, മനസ്സിലാകുകയുമില്ല
  rationale: രണ്ടു ക്രിയകളിലൂടെയുള്ള പത്രോസിന്റെ ശക്തമായ നിഷേധം നിലനിർത്തുന്നു. οἶδα എന്നതിന് ‘അറിയുക’ എന്നും ἐπίσταμαι എന്നതിന് ഇവിടെ ‘മനസ്സിലാക്കുക’ എന്നും സ്വാഭാവികമായി നൽകാം.
- source_word: σὺ τί λέγεις
  choice: നീ പറയുന്നത് എന്താണെന്ന്
  rationale: ‘നീ എന്തു പറയുന്നു’ എന്ന മൂലഘടനയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു; ‘നീ എന്താണ് ഉദ്ദേശിക്കുന്നത്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം ഒഴിവാക്കുന്നു.
- source_word: ἐξῆλθεν ἔξω
  choice: അവൻ പുറത്തേക്ക് ... പോയി
  rationale: ക്രിയയുടെയും ദിശാസൂചക ക്രിയാവിശേഷണത്തിന്റെയും ഊന്നൽ മലയാളത്തിൽ ‘പുറത്തേക്ക് പോയി’ എന്നു സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: προαύλιον
  choice: മുൻമുറ്റം
  rationale: അകത്തെ മുറ്റത്തിനു മുമ്പിലുള്ള ഭാഗത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘മുറ്റം’ എന്നു മാത്രം പറയുന്നതിനെക്കാൾ സ്ഥലപരമായ സൂക്ഷ്മത ‘മുൻമുറ്റം’ നിലനിർത്തുന്നു.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: ഒരു കോഴി കൂവി
  rationale: ഗ്രീക്കിലെ സാധാരണ പ്രയോഗത്തിനുള്ള സ്വാഭാവിക മലയാളരൂപമാണിത്; നിർദേശകപദമില്ലാത്ത നാമത്തെ ‘ഒരു കോഴി’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: καὶ ἀλέκτωρ ἐφώνησεν എന്ന വാക്യഭാഗം ഉൾപ്പെടുത്തൽ
  choice: ‘ഒരു കോഴി കൂവി’ എന്ന് മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
  alternative: ചില കൈയെഴുത്തുപ്രതികളെ പിന്തുടർന്ന് ഈ വാക്യഭാഗം ഒഴിവാക്കുക.
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ ഈ വാക്യഭാഗം പാഠഭേദസൂചനയോടെ ഉൾപ്പെട്ടതിനാൽ മുഖ്യപാഠത്തിൽ വിവർത്തനം ചെയ്തു; സാക്ഷ്യങ്ങളിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പത്രോസിന്റെ ഇരട്ട നിഷേധവും προαύλιον എന്ന പദത്തിന്റെ സ്ഥലപരമായ വ്യത്യാസവും കഴിയുന്നത്ര സ്വാഭാവികമായി നിലനിർത്തി.
