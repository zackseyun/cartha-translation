  to: 'എന്നാൽ അവൻ ശാപങ്ങൾ വിളിച്ചുപറയാനും ആണയിടാനും തുടങ്ങി[a]: “നിങ്ങൾ പറയുന്ന ഈ മനുഷ്യനെ എനിക്ക് അറിയില്ല.”'
  rationale: The revision makes the curse language idiomatic in modern standard Malayalam while retaining the source text’s deliberate lack of an explicit object. The footnote continues to document both the simpler lexical alternative and the possible contextual sense of self-imprecation without placing either interpretation in the main text.
