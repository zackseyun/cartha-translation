  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ ശാപങ്ങൾ വിളിച്ചുപറയാനും ആണയിടാനും തുടങ്ങി[a]: “നിങ്ങൾ പറയുന്ന ഈ മനുഷ്യനെ എനിക്ക് അറിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശപിക്കാൻ’; ഒരുപക്ഷേ, ‘സ്വന്തത്തിന്മേൽ ശാപം വരുത്താൻ.’ ഗ്രീക്കിൽ ശാപം ആരുടെമേൽ വരുത്തുന്നതാണെന്ന് വ്യക്തമാക്കിയിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: എന്നാൽ അവൻ
  rationale: δέ ഇവിടെ മുമ്പത്തെ സംഭവത്തിൽനിന്നുള്ള നേരിയ വൈരുധ്യത്തോടുകൂടിയ കഥാഗതിവികാസം സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἤρξατο
  choice: തുടങ്ങി
  rationale: പൂരക ക്രിയകളോടൊപ്പമുള്ള ἄρχωയുടെ ആരംഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀναθεματίζειν
  choice: ശാപം വിളിച്ചുവരുത്താൻ
  rationale: വെറും മോശം വാക്കുകൾ പറയുക എന്നതിലുപരി ശാപം ആവാഹിക്കുന്നതിന്റെ ശക്തി നിലനിർത്തുന്നു; ശാപത്തിന്റെ ലക്ഷ്യം ഗ്രീക്കിൽ വ്യക്തമല്ലാത്തതിനാൽ അത് നിർണ്ണയിക്കുന്നില്ല.
- source_word: ὀμνύναι
  choice: ആണയിടാൻ
  rationale: ഔപചാരികമായി സത്യംചെയ്യുകയോ ശപഥമെടുക്കുകയോ ചെയ്യുന്ന അർഥം നൽകുന്നു; സാധാരണ അസഭ്യഭാഷ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ὅτι
  choice: നേരിട്ടുള്ള ഉദ്ധരണി
  rationale: ഇവിടെ ὅτι ആണയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണി സ്വാഭാവികമാണ്.
- source_word: Οὐκ οἶδα
  choice: എനിക്ക് അറിയില്ല
  rationale: അറിവോ പരിചയമോ നിഷേധിക്കുന്ന ഗ്രീക്കിന്റെ നേരിട്ടുള്ളതും തീക്ഷ്ണവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: ഈ മനുഷ്യനെ
  rationale: τοῦτον എന്ന സൂചകപദത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ഗ്രീക്കിൽ നിർബന്ധമില്ലാത്ത അവഹേളനസ്വരം ചേർക്കുന്നില്ല.
- source_word: ὃν λέγετε
  choice: നിങ്ങൾ പറയുന്ന
  rationale: ചുറ്റുമുള്ളവർ പരാമർശിക്കുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ἀναθεματίζειν എന്നതിലെ ശാപത്തിന്റെ സ്വഭാവവും ലക്ഷ്യവും
  choice: ശാപം വിളിച്ചുവരുത്തിയെന്ന് പറയുക; അത് യേശുവിനെയോ പത്രോസിനെയോ ലക്ഷ്യമിട്ടതാണെന്ന് വ്യക്തമാക്കാതിരിക്കുക.
  alternative: ‘ശപിക്കാൻ തുടങ്ങി’ അല്ലെങ്കിൽ ‘സ്വന്തത്തിന്മേൽ ശാപം വരുത്താൻ തുടങ്ങി.’
  rationale: ആണയോടുകൂടിയ സന്ദർഭത്തിൽ സ്വയം ശപിക്കുന്നതാകാം എന്ന വ്യാഖ്യാനം സാദ്ധ്യമാണ്; എങ്കിലും ഗ്രീക്ക് പാഠം ശാപത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠം ആ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി. ‘ആണയിടുക’ ഔപചാരിക ശപഥത്തിന്റെ അർഥം നൽകുന്നു; ‘ശാപം വിളിച്ചുവരുത്തുക’ മൂലപദത്തിന്റെ ശക്തിയും ലക്ഷ്യത്തെക്കുറിച്ചുള്ള അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
