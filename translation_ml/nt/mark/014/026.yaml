  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: ml
  text: അവർ സ്തുതിഗീതം പാടിയശേഷം[a] ഒലിവുമലയിലേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, കൂടുതൽ ഔപചാരികമായി, ‘പാടിയിട്ട്.’ ഗ്രീക്കിലെ ഭൂതകാല കൃദന്തരൂപം അവർ പുറപ്പെടുന്നതിനു മുമ്പ് ഈ പ്രവൃത്തി നടന്നതെന്നു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: —
  rationale: ഗ്രീക്കിലെ ലളിതമായ ആഖ്യാനബന്ധം മലയാളത്തിൽ വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ പ്രത്യേകമായി ‘പിന്നെ’ എന്നു ചേർത്തില്ല; അങ്ങനെ അധികമായ കാലക്രമസൂചന ഒഴിവാക്കി.
- source_word: ὑμνήσαντες
  choice: സ്തുതിഗീതം പാടിയശേഷം
  rationale: ὑμνέω എന്ന ക്രിയയുടെ സ്തുതിഗാനം ആലപിക്കുക എന്ന അർഥവും, പ്രധാനക്രിയയ്ക്കു മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξῆλθον
  choice: പുറപ്പെട്ടു
  rationale: സന്ദർഭത്തിൽ ഒരു സ്ഥലത്തുനിന്ന് ലക്ഷ്യസ്ഥാനത്തേക്കു പോയതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘പുറത്തേക്കു പോയി’ എന്ന അത്യന്തം അക്ഷരാർഥപരമായ രൂപത്തേക്കാൾ മലയാളത്തിൽ ഒഴുക്കുള്ളതാണ്.
- source_word: εἰς
  choice: -ലേക്കു
  rationale: ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന εἰς മലയാളത്തിലെ ദിശാവിഭക്തിയാൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ഒലിവുമല
  rationale: ഈ ഭൂമിശാസ്ത്രനാമത്തിന്റെ മലയാളത്തിൽ വ്യക്തവും സ്ഥാപിതവുമായ സംയുക്തരൂപം; ὄρος എന്നതിന്റെ ‘മല’ എന്ന അർഥവും ἐλαία എന്നതിന്റെ ‘ഒലിവ്’ എന്ന അർഥവും നിലനിർത്തുന്നു.
