source:
  edition: SBLGNT
  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അത്യന്തം ഊന്നിപ്പറഞ്ഞുകൊണ്ടിരുന്നു[a]: “നിന്നോടൊപ്പം മരിക്കേണ്ടിവന്നാൽ പോലും[b], ഞാൻ നിന്നെ ഒരിക്കലും തള്ളിപ്പറയുകയില്ല[c].” എല്ലാവരും അതുതന്നെ പറഞ്ഞുകൊണ്ടിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ഏറ്റവും ശക്തമായി പറഞ്ഞുകൊണ്ടിരുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നിന്നോടൊപ്പം മരിക്കുക എനിക്ക് ആവശ്യമായാൽ.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ഞാൻ തീർച്ചയായും നിന്നെ തള്ളിപ്പറയുകയില്ല.” ഗ്രീക്കിൽ ശക്തമായ നിഷേധപ്രയോഗമാണുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς
  choice: കൂടുതൽ ശക്തമായി
  rationale: മുൻപത്തെ പ്രസ്താവനയെക്കാൾ തീവ്രമായി സംസാരിച്ചുവെന്ന വർധിത ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐλάλει
  choice: ഉറപ്പിച്ചുപറഞ്ഞു
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവവും സന്ദർഭത്തിലെ ശക്തമായ എതിർവാദവും ചേർത്ത് അറിയിക്കുന്നു.
- source_word: Ἐὰν δέῃ με
  choice: മരിക്കേണ്ടിവന്നാലും
  rationale: δέῃ സൂചിപ്പിക്കുന്ന അനിവാര്യത നിലനിർത്തുകയും മലയാളത്തിലെ സമ്മതാർഥക ഉപാധിവാക്യമായി സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: συναποθανεῖν σοι
  choice: നിന്നോടൊപ്പം മരിക്കുക
  rationale: συν- എന്ന ഘടകത്തിലെ ‘ഒരുമിച്ച്’ എന്ന ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐ μή
  choice: ഒരിക്കലും ... ഇല്ല
  rationale: ഗ്രീക്കിലെ ശക്തമായ നിഷേധം ആധുനിക മലയാളത്തിലെ ഊന്നലുള്ള സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: ἀπαρνήσομαι
  choice: തള്ളിപ്പറയുകയില്ല
  rationale: യേശുവുമായുള്ള ബന്ധം നിഷേധിക്കുന്നതെന്ന കഥാസന്ദർഭത്തിലെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ὡσαύτως
  choice: അതുതന്നെ
  rationale: മറ്റു ശിഷ്യന്മാർ പത്രോസിന്റെ പ്രസ്താവനയുടെ അതേ ഉള്ളടക്കം പറഞ്ഞുവെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: πάντες
  choice: മറ്റെല്ലാവരും
  rationale: സന്ദർഭത്തിൽ ശേഷിച്ച ശിഷ്യന്മാരെ ഉൾക്കൊള്ളുന്ന സമഗ്രത വ്യക്തമാക്കുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലം സൂചിപ്പിക്കുന്ന തുടരുന്ന കൂട്ടപ്രസ്താവന നിലനിർത്തുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ നിഷേധിക്കില്ലെന്ന പ്രതിജ്ഞയുടെ ശക്തി
  choice: “ഞാൻ നിന്നെ ഒരിക്കലും തള്ളിപ്പറയുകയില്ല”
  alternative: “ഞാൻ തീർച്ചയായും നിന്നെ തള്ളിപ്പറയുകയില്ല”
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധവും ഭാവികാല ക്രിയയും ചേർന്ന ഊന്നൽ നിലനിർത്തുന്നു; പത്രോസിന്റെ ആത്മവിശ്വാസവും പിന്നീട് സംഭവിക്കുന്ന പരാജയവും തമ്മിലുള്ള കഥാപരമായ പിരിമുറുക്കം വ്യാഖ്യാനിച്ച് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘തള്ളിപ്പറയുക’ എന്നത് മതവിഭാഗപരമായ പ്രത്യേക വ്യാഖ്യാനമില്ലാതെ കഥാസന്ദർഭത്തിലെ ബന്ധനിഷേധം വ്യക്തമാക്കുന്നു.
