    rationale: Although “ആകാശം” can render οὐρανός in some contexts, this allusive, exalted Danielic phrase calls for “സ്വർഗ്ഗം,” preserving the apocalyptic and heavenly sense expressed in the Greek and reflected in the English audit trail.
