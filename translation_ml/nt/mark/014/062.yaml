id: MRK.14.62
reference: Mark 14:62
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: ml
  text: 'യേശു പറഞ്ഞു: “ഞാൻ ആകുന്നു.[a] മനുഷ്യപുത്രൻ ശക്തിയുടെ[b] വലത്തുഭാഗത്ത് ഇരിക്കുന്നതും സ്വർഗ്ഗത്തിലെ മേഘങ്ങളോടുകൂടെ വരുന്നതും നിങ്ങൾ കാണും.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ തന്നെയാണ്.” ഗ്രീക്കിൽ “ഞാൻ ആകുന്നു” എന്നു മാത്രമാണ് ഉള്ളത്.
    reason: alternative_reading
  - marker: b
    text: “ശക്തി” എന്നത് ഇവിടെ ദൈവത്തെ ഭക്തിപൂർവം സൂചിപ്പിക്കുന്ന പരോക്ഷപ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: സങ്കീർത്തനം 110:1; ദാനീയേൽ 7:13 എന്നിവയുടെ പ്രതിധ്വനികൾ ഇതിലുണ്ട്.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: ഞാൻ ആകുന്നു
  rationale: പ്രകടമായ വിധേയപദമില്ലാത്ത ഗ്രീക്ക് പ്രയോഗത്തെ കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് മഹാപുരോഹിതന്റെ ചോദ്യത്തിനുള്ള ഉറച്ച മറുപടിയാണെങ്കിലും, ‘ഞാൻ തന്നെയാണ്’ എന്നു വ്യാഖ്യാനിച്ച് ചേർക്കാതെ മൂലത്തിലെ ഗൗരവവും സാധ്യതയുള്ള അധിക അനുരണനവും സംരക്ഷിക്കുന്നു.
- source_word: ὄψεσθε
  choice: നിങ്ങൾ കാണും
  rationale: ഭാവികാലത്തിലെ നേരിട്ടുള്ള പ്രവചനസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്ഥിരമായ സ്വയംവിശേഷണവും ദാനീയേൽ 7-ലെ അനുരണനവും നിലനിർത്തുന്ന സ്ഥാപിത ബൈബിൾ പ്രയോഗമാണിത്.
- source_word: ἐκ δεξιῶν
  choice: വലത്തുഭാഗത്ത്
  rationale: ബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ തുല്യരൂപം.
- source_word: τῆς δυνάμεως
  choice: ശക്തിയുടെ
  rationale: ദൈവത്തെ നേരിട്ട് നാമകരണം ചെയ്യാതെ സൂചിപ്പിക്കുന്ന മൂലത്തിലെ ഭക്തിപൂർവമായ പരോക്ഷപ്രയോഗം സംരക്ഷിക്കുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καθήμενον
  choice: ഇരിക്കുന്നതും
  rationale: സിംഹാസനാരോഹണത്തിന്റെയും അധികാരസ്ഥാനത്തിന്റെയും ആശയം സന്ദർഭത്തിൽ നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളരൂപം നൽകുന്നു.
- source_word: ἐρχόμενον
  choice: വരുന്നതും
  rationale: ദാനീയേലിലെ അന്ത്യകാലദർശനത്തിന്റെ അനുരണനം നിലനിർത്തുന്ന നേരിട്ടുള്ള വിവർത്തനം.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: ആകാശത്തിലെ മേഘങ്ങളോടുകൂടെ
  rationale: ഗ്രീക്കിന്റെ ദൃശ്യരൂപവും ദാനീയേൽ 7:13-ലെ മഹത്ത്വമേറിയ പശ്ചാത്തലവും സംരക്ഷിക്കുന്നു.
- source_word: καὶ ... καὶ
  choice: … ഇരിക്കുന്നതും … വരുന്നതും
  rationale: രണ്ട് സമാന്തര അവകാശവാദങ്ങളെയും മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ഉം … -ഉം’ ഘടനയിലൂടെ ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: Ἐγώ εἰμι എന്നത് ലളിതമായ സമ്മതമായോ വിപുലീകരിച്ച തിരിച്ചറിയലായോ വിവർത്തനം ചെയ്യണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘ഞാൻ ആകുന്നു’
  alternative: ‘ഞാൻ തന്നെയാണ്’
  rationale: ഗ്രീക്കിൽ പ്രകടമായ വിധേയപദമില്ല. ഈ രൂപം സന്ദർഭത്തിലെ സമ്മതാർഥവും കൂടുതൽ ആഴമുള്ള അനുരണനത്തിനുള്ള സാധ്യതയും ഒരുപോലെ തുറന്നുവെക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘തന്നെ’ നിർബന്ധമായി ചേർക്കുന്നില്ല.
- issue: τῆς δυνάμεως ആരെയാണു സൂചിപ്പിക്കുന്നതെന്ന് വിവർത്തനത്തിൽ എത്രത്തോളം വ്യക്തമാക്കണം
  choice: ‘ദൈവം’ എന്നു പകരംവയ്ക്കാതെ ‘ശക്തി’ എന്ന പരോക്ഷപ്രയോഗം നിലനിർത്തുക
  alternative: ‘ദൈവത്തിന്റെ’ അല്ലെങ്കിൽ ‘സർവശക്തന്റെ’
  rationale: മൂലപാഠം ദൈവത്തെ ഭക്തിപൂർവമായ ഒരു പരോക്ഷനാമത്തിലൂടെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനെ നേരിട്ട് ‘ദൈവം’ എന്നു മാറ്റുന്നത് മൂലത്തിലെ ഭാഷാശൈലിയും വിചാരണാസന്ദർഭത്തിലെ സ്വരവും ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. സ്ഥാപിതമായ ‘മനുഷ്യപുത്രൻ’ നിലനിർത്തി; ‘ശക്തി’ എന്ന അപൂർവ പരോക്ഷപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി. ഗ്രീക്കിലെ രണ്ട് പങ്കാളിത്തക്രിയകളെ മലയാളത്തിലെ സമാന്തരമായ ‘ഇരിക്കുന്നതും … വരുന്നതും’ എന്ന ഘടനയിൽ അവതരിപ്പിച്ചു.
