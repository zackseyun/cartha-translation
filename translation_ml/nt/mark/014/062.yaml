  to: 'യേശു പറഞ്ഞു: “ഞാൻ ആകുന്നു.[a] മനുഷ്യപുത്രൻ ശക്തിയുടെ[b] വലത്തുഭാഗത്ത് ഇരിക്കുന്നതും സ്വർഗ്ഗത്തിലെ മേഘങ്ങളോടുകൂടെ വരുന്നതും നിങ്ങൾ കാണും.”[c]'
  rationale: “ആകാശത്തിലെ” എന്നത് “സ്വർഗ്ഗത്തിലെ” എന്നു തിരുത്തി, οὐρανός എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ സ്വർഗീയവും അന്ത്യകാലപരവുമായ അർഥവും ദാനീയേൽ 7:13-ലെ സൂചനയും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് a ഗ്രീക്കിൽ വ്യക്തമായ വിധേയപദമില്ലെന്ന കാര്യം കൂടുതൽ കൃത്യമായി പറയുന്നു; അടിക്കുറിപ്പ് c സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിച്ചു. മറ്റെല്ലാ പ്രധാന പദപ്രയോഗങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
