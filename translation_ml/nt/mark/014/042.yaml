  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: ml
  text: എഴുന്നേൽക്കൂ, നമുക്കു പോകാം. ഇതാ, എന്നെ ഒറ്റിക്കൊടുക്കുന്നവൻ അടുത്തെത്തിയിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘എന്നെ കൈമാറുന്നവൻ അടുത്തെത്തിയിരിക്കുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: എഴുന്നേൽക്കൂ
  rationale: ബഹുവചന ആജ്ഞാരൂപം. സന്ദർഭത്തിൽ ഉറക്കത്തിൽനിന്ന് ഉണരുക എന്നതിലുപരി എഴുന്നേറ്റ് നീങ്ങാനുള്ള ആഹ്വാനമാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ഇത് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄγωμεν
  choice: നമുക്കു പോകാം
  rationale: ആഹ്വാനാർഥത്തിലുള്ള ഒന്നാംപുരുഷ ബഹുവചന ഉപവാക്യരൂപം; കൂട്ടായി നീങ്ങാനുള്ള നിർദേശം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἰδού
  choice: ഇതാ
  rationale: തുടർന്ന് പറയുന്നതിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യാക്ഷേപകത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: ὁ παραδιδούς με
  choice: എന്നെ ഒറ്റിക്കൊടുക്കുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാന കർത്തൃവാചക കൃദന്തരൂപം. യൂദാസിന്റെ പ്രവൃത്തിയിലെ വഞ്ചനാഭാവം സന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ ‘ഒറ്റിക്കൊടുക്കുന്നവൻ’ തിരഞ്ഞെടുത്തു; ‘എന്നെ ഏല്പിക്കുന്നവൻ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἤγγικεν
  choice: അടുത്തെത്തിയിരിക്കുന്നു
  rationale: സമീപിക്കൽ പൂർത്തിയായി അതിന്റെ ഫലം ഇപ്പോൾ നിലനിൽക്കുന്നതായി സൂചിപ്പിക്കുന്ന perfect രൂപം. ‘അടുത്തെത്തിയിരിക്കുന്നു’ ഈ കാലഭാവവും ആസന്നസാന്നിധ്യവും കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: പീഡാനുഭവസന്ദർഭത്തിൽ παραδίδωμι എന്നതിന്റെ വിവർത്തനം
  choice: ഒറ്റിക്കൊടുക്കുന്നവൻ
  alternative: എന്നെ ഏല്പിക്കുന്നവൻ
  rationale: യൂദാസിന്റെ ബന്ധപരവും ധാർമികവുമായ വഞ്ചന സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘ഒറ്റിക്കൊടുക്കുന്നവൻ’ സ്വാഭാവികമാണ്. എന്നാൽ ‘ഏല്പിക്കുക/കൈമാറുക’ എന്ന അടിസ്ഥാനാർഥം ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സഹിതം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എഴുന്നേൽക്കൂ’ ബഹുവചനസന്ദർഭത്തിൽ പൊതുവായി ഉപയോഗിക്കാവുന്ന മാന്യ ആജ്ഞാരൂപമാണ്. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
