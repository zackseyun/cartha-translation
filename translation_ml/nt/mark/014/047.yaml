id: MRK.14.47
reference: Mark 14:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: ml
  text: എന്നാൽ അരികെ നിന്നിരുന്നവരിൽ ഒരാൾ തന്റെ വാൾ ഊരി മഹാപുരോഹിതന്റെ അടിമയെ[a] വെട്ടി, അയാളുടെ ചെവി അറുത്തുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “ദാസനെ”; ഗ്രീക്ക്: δοῦλος.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: എന്നാൽ ... ഒരാൾ
  rationale: δέ എന്നതിന്റെ നേരിയ വിരുദ്ധത/ആഖ്യാനത്തുടർച്ച ‘എന്നാൽ’കൊണ്ട് സൂചിപ്പിക്കുകയും εἷς ... τις എന്ന അനിശ്ചിത പ്രയോഗം ‘ഒരാൾ’ എന്നു സ്വാഭാവികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τῶν παρεστηκότων
  choice: അരികെ നിന്നിരുന്നവരിൽ
  rationale: παρίστημι എന്നതിന്റെ സ്ഥലസംബന്ധമായ അർഥവും ആ കൂട്ടത്തിൽനിന്നുള്ള ഒരാൾ എന്ന partitive genitive-ഉം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: തന്റെ വാൾ ഊരി
  rationale: ആയുധം ഉറയിൽനിന്ന് പുറത്തെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന σπάομαι സന്ദർഭാനുസൃതമായി ‘ഊരി’ എന്നു നൽകി; ഗ്രീക്കിലെ article മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥസൂചനയായി ‘തന്റെ’ എന്നു പ്രത്യക്ഷപ്പെടുന്നു.
- source_word: ἔπαισεν
  choice: വെട്ടി
  rationale: παίω അടിസ്ഥാനമായി ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്നാണെങ്കിലും, വാളുകൊണ്ടുള്ള പ്രഹാരവും തുടർന്ന് ചെവി അറുത്തുപോയ ഫലവും ഉള്ളതിനാൽ ‘വെട്ടി’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: മഹാപുരോഹിതന്റെ അടിമയെ
  rationale: δοῦλος സൂചിപ്പിക്കുന്ന അധീന സാമൂഹികസ്ഥാനം മൃദൂകരിക്കാതെ ‘അടിമ’ എന്നു നൽകി; ἀρχιερεύς എന്നതിന് നിലവാരമുള്ള ‘മഹാപുരോഹിതൻ’ ഉപയോഗിച്ചു.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: അയാളുടെ ചെവി അറുത്തുകളഞ്ഞു
  rationale: അക്രമസന്ദർഭത്തിൽ ἀφαιρέω എന്നത് ചെവി വേർപെടുത്തിയ ഫലം സൂചിപ്പിക്കുന്നതിനാൽ ‘അറുത്തുകളഞ്ഞു’ സ്വാഭാവികമാണ്. ὠτάριον എന്ന diminutive രൂപം മലയാളത്തിൽ പ്രത്യേകമായി ‘ചെറിയ ചെവി’ എന്നു നൽകേണ്ടതില്ല; മർക്കോസിൽ ഇല്ലാത്ത ‘വലതുചെവി’ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: δοῦλος എന്ന സാമൂഹികപദത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: ഇവിടെ മഹാപുരോഹിതനോടുള്ള ഉടമസ്ഥതയോ ശക്തമായ അധീനബന്ധമോ മുൻനിൽക്കുന്നതിനാൽ ‘അടിമ’ സാമൂഹിക യാഥാർഥ്യം കൂടുതൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു. ‘സേവകൻ’ ആ നിലയെ മൃദൂകരിക്കാൻ ഇടയുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. വാക്യത്തിലെ വേഗമേറിയ ആഖ്യാനക്രമം നിലനിർത്തിയിട്ടുണ്ട്; സമാന്തര സുവിശേഷങ്ങളിൽനിന്നുള്ള വിവരങ്ങൾ ചേർത്തിട്ടില്ല.
