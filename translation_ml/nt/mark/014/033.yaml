  to: അവൻ പത്രോസിനെയും യാക്കോബിനെയും യോഹന്നാനെയും തന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോയി; അവൻ അതിയായി പരിഭ്രമിക്കാനും[a] വ്യാകുലപ്പെടാനും തുടങ്ങി.
