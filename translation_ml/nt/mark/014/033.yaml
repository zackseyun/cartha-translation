  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: ml
  text: അവൻ പത്രോസിനെയും യാക്കോബിനെയും യോഹന്നാനെയും തന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോയി; അവൻ അതിയായി പരിഭ്രമിക്കാനും[a] വ്യാകുലപ്പെടാനും തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘വല്ലാതെ ഞെട്ടാനും വ്യാകുലപ്പെടാനും.’ ആദ്യ ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ തീവ്രമായ ഞെട്ടൽ, പരിഭ്രമം, അല്ലെങ്കിൽ ക്ലേശം എന്ന അർഥം വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: കൂട്ടിക്കൊണ്ടുപോയി
  rationale: തിരഞ്ഞെടുത്ത ശിഷ്യന്മാരെ തന്നോടൊപ്പം കൊണ്ടുപോകുന്നു എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാള ആഖ്യാനശൈലിക്ക് യോജിച്ച ഭൂതകാലത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: μετ’ αὐτοῦ
  choice: തന്നോടൊപ്പം
  rationale: പത്രോസും യാക്കോബും യോഹന്നാനും യേശുവിനോടൊപ്പം പോയി എന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἤρξατο
  choice: തുടങ്ങി
  rationale: തുടർന്നുള്ള രണ്ട് ക്രിയകൾ സൂചിപ്പിക്കുന്ന അവസ്ഥ ആരംഭിച്ചതെന്ന ഗ്രീക്ക് ക്രിയയുടെ പ്രവേശനാർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐκθαμβεῖσθαι
  choice: അതിയായി സംഭ്രമിക്കാൻ
  rationale: ഈ സന്ദർഭത്തിലെ ശക്തമായ ഞെട്ടൽ, ഭയം, മാനസിക അസ്വസ്ഥത എന്നിവ ഉൾക്കൊള്ളുന്ന പദം; വെറും ആശ്ചര്യം എന്ന മൃദുവായ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല. അർഥപരിധിയിലെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀδημονεῖν
  choice: വ്യാകുലപ്പെടാൻ
  rationale: കടുത്ത ആന്തരിക അസ്വസ്ഥതയും മനോവേദനയും സൂചിപ്പിക്കുന്നു; മുൻക്രിയയുമായി ലയിപ്പിക്കാതെ രണ്ടാമത്തെ വ്യത്യസ്ത പദമായി നിലനിർത്തുന്നു.
- source_word: καὶ ... καὶ
  choice: -നെയും ... -നെയും ... -നെയും; തുടർന്ന്
  rationale: പേരുകളുടെ സഞ്ചയസ്വഭാവം മലയാളത്തിലെ ‘-നെയും’ ആവർത്തനത്തിലൂടെ നിലനിർത്തുന്നു; വാക്യത്തിന്റെ തുടർച്ച സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ അവസാനത്തെ ബന്ധകം ‘തുടർന്ന്’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ഗെത്ത്ശെമനെയിലെ യേശുവിന്റെ മാനസികാവസ്ഥയുടെ വിവർത്തനം
  choice: ‘അതിയായി സംഭ്രമിക്കാനും വ്യാകുലപ്പെടാനും തുടങ്ങി’ എന്നു യഥാർഥവും തീവ്രവുമായ മാനുഷിക ക്ലേശമായി വിവർത്തനം ചെയ്യുന്നു.
  alternative: ‘ആശ്ചര്യപ്പെടാനും അസ്വസ്ഥനാകാനും തുടങ്ങി’ എന്ന മൃദുവായ ഭാഷയോ ‘ഭീതിയിൽ മുങ്ങി അതിവേദനപ്പെടാനും തുടങ്ങി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ഭാഷയോ ഉപയോഗിക്കുക.
  rationale: മൂലപാഠത്തിലെ രണ്ട് ശക്തമായ ക്രിയകളെയും വേർതിരിച്ചു നിലനിർത്തി യേശുവിന്റെ യഥാർഥ മാനുഷിക ക്ലേശത്തിന്റെ ഗൗരവം പ്രകടമാക്കുന്നു; അതേസമയം അതിന്റെ കാരണം സംബന്ധിച്ച ദൈവശാസ്ത്രപരമായ വിശദീകരണം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു; മൂലത്തിലെ രണ്ട് വികാരക്രിയകളുടെ വ്യത്യാസവും തീവ്രതയും നിലനിർത്തിയിരിക്കുന്നു.
