reference: Mark 14:61
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ മൗനം പാലിച്ചുകൊണ്ടിരുന്നു; ഒന്നും മറുപടി പറഞ്ഞില്ല. വീണ്ടും മഹാപുരോഹിതൻ അവനോടു ചോദ്യം ചെയ്തുകൊണ്ട് പറഞ്ഞു: “നീ മശീഹാ[a], വാഴ്ത്തപ്പെട്ടവന്റെ പുത്രൻ[b] ആണോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ക്രിസ്തു.” ഗ്രീക്കിലെ Χριστός (ക്രിസ്റ്റോസ്) ഇവിടെ യഹൂദരുടെ മശീഹാപ്രതീക്ഷയുമായി ബന്ധപ്പെട്ട സ്ഥാനപ്പേരാണ്.
    reason: alternative_reading
  - marker: b
    text: “വാഴ്ത്തപ്പെട്ടവൻ” എന്നത് ദൈവത്തെ ആദരപൂർവം പരാമർശിക്കുന്ന ഒരു യഹൂദ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: മൗനം പാലിച്ചു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന മൗനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമായി ആ നിലപാട് അറിയിക്കുന്നു.
- source_word: ἀπεκρίνατο οὐδέν
  choice: ഒന്നും ഉത്തരം പറഞ്ഞില്ല
  rationale: οὐδέν നൽകുന്ന സമ്പൂർണ നിഷേധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മഹാപുരോഹിതന്റെ ചോദ്യം ആവർത്തിക്കപ്പെടുന്നതു സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: യഹൂദരുടെ പരമോന്നത പുരോഹിതസ്ഥാനത്തിനുള്ള പ്രചാരത്തിലുള്ള കൃത്യമായ മലയാളപദം.
- source_word: ἐπηρώτα
  choice: ചോദ്യംചെയ്തുകൊണ്ട്
  rationale: തുടർച്ചയായ ചോദ്യംചെയ്യലിന്റെ ഭാവവും ന്യായവിചാരണാസന്ദർഭവും പ്രകടമാക്കുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: മർക്കോസിന്റെ ചരിത്രവർത്തമാനത്തെ അക്ഷരാർത്ഥത്തിൽ അനുകരിച്ചാൽ മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ, വിവരണത്തിന്റെ ഭൂതകാലപ്രവാഹത്തിന് യോജിച്ച സ്വാഭാവിക രൂപം ഉപയോഗിച്ചു.
- source_word: χριστός
  choice: മശീഹാ
  rationale: യഹൂദ മശീഹാപ്രതീക്ഷയുടെ പശ്ചാത്തലത്തിൽ ഇത് വ്യക്തിനാമമല്ല, അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ്.
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: വാഴ്ത്തപ്പെട്ടവന്റെ പുത്രൻ
  rationale: ദൈവത്തെ നേരിട്ട് പേരെടുത്തു പറയാതെ ആദരപൂർവം സൂചിപ്പിക്കുന്ന യഹൂദ പ്രയോഗത്തിന്റെ പരോക്ഷത നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന മശീഹാസ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: മഹാപുരോഹിതന്റെ ചോദ്യത്തിൽ പദം യഹൂദ മശീഹാപ്രതീക്ഷയുമായി ബന്ധപ്പെട്ട സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; അതിനാൽ ‘മശീഹാ’ സന്ദർഭം കൂടുതൽ സുതാര്യമാക്കുന്നു.
- issue: τοῦ εὐλογητοῦ എന്ന ആദരസൂചക ദൈവപരാമർശം
  choice: വാഴ്ത്തപ്പെട്ടവൻ
  alternative: ദൈവം
  rationale: മൂലപാഠത്തിലെ പരോക്ഷവും ആദരപൂർവവുമായ യഹൂദ ദൈവപരാമർശം നിലനിർത്തുന്നു; ‘ദൈവം’ എന്നു മുഖ്യപാഠത്തിൽ ചേർത്താൽ സാംസ്കാരികവും ദൈവശാസ്ത്രപരവുമായ നൂവൻസ് നഷ്ടപ്പെടും.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വിചാരണാസന്ദർഭത്തിന്റെ ഔപചാരികതയ്ക്കായി ‘ചോദ്യംചെയ്തുകൊണ്ട്’ എന്നും, ദൈവത്തെക്കുറിച്ചുള്ള യഹൂദ ആദരസൂചക പരോക്ഷപ്രയോഗം സംരക്ഷിക്കാൻ ‘വാഴ്ത്തപ്പെട്ടവൻ’ എന്നും ഉപയോഗിച്ചു.
