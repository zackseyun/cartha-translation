source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറയുന്നു: “എന്റെ പ്രാണൻ മരണത്തോളം അത്യന്തം ദുഃഖിതമായിരിക്കുന്നു.[a][b] ഇവിടെത്തന്നെ തങ്ങുവിൻ; ജാഗരിച്ചിരിക്കുവിൻ.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വളരെ ദുഃഖിതമായിരിക്കുന്നു” അല്ലെങ്കിൽ “ദുഃഖത്താൽ ഞെരുങ്ങിയിരിക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “മരിക്കത്തക്കവിധം” അല്ലെങ്കിൽ “മരണത്തിന്റെ വക്കോളം.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “ഉണർന്നിരിക്കുവിൻ”; ഈ കൽപ്പനയിൽ ഉറങ്ങാതിരിക്കുന്നതും ജാഗ്രതയോടെ കാവലിരിക്കുന്നതും ഉൾപ്പെടാം.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാല ശൈലി നിലനിർത്താൻ വർത്തമാനകാലം ഉപയോഗിച്ചു.
- source_word: Περίλυπός
  choice: അതിദുഃഖം നിറഞ്ഞ്
  rationale: അതിതീവ്രമായ ദുഃഖവും മനോവ്യഥയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ψυχή
  choice: പ്രാണൻ
  rationale: യേശുവിന്റെ ആന്തരികജീവനെയും സമഗ്ര വ്യക്തിത്വത്തെയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ ആഴം നിലനിർത്തുന്നു; ‘ആത്മാവ്’ എന്നത് πνεῦμα എന്ന പദവുമായി അനാവശ്യമായി കലരാൻ ഇടയുള്ളതിനാൽ ഒഴിവാക്കി.
- source_word: ἕως θανάτου
  choice: മരണത്തോളം എത്തിയിരിക്കുന്നു
  rationale: ദുഃഖത്തിന്റെ അങ്ങേയറ്റം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; അത് ‘മരിക്കുന്നതുവരെ’ എന്ന കാലപരിധിയായി മാത്രം ചുരുക്കുന്നില്ല.
- source_word: μείνατε ὧδε
  choice: ഇവിടെത്തന്നെ നിന്നു
  rationale: ശിഷ്യന്മാർ ആ സ്ഥലത്ത് തുടരണമെന്ന കൽപ്പന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: γρηγορεῖτε
  choice: ജാഗരിച്ചിരിക്കുവിൻ
  rationale: ശാരീരികമായി ഉണർന്നിരിക്കുന്നതും ജാഗ്രതയോടെ കാവലിരിക്കുന്നതുമായ ഇരു സൂചനകളും തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: ψυχή എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: പ്രാണൻ
  alternative: ഉള്ളം; ജീവൻ
  rationale: യേശുവിന്റെ യഥാർഥ മാനുഷിക മനോവ്യഥയെ പ്രകടമാക്കുമ്പോൾ പദത്തെ വെറും വികാരമോ ശാരീരികജീവനോ ആയി ചുരുക്കാതെ അതിന്റെ വ്യക്തിത്വപരമായ ആഴം സംരക്ഷിക്കുന്നു.
- issue: γρηγορεῖτε എന്ന കൽപ്പനയുടെ വ്യാപ്തി
  choice: ജാഗരിച്ചിരിക്കുവിൻ
  alternative: ഉണർന്നിരിക്കുവിൻ; കാവലിരിക്കുവിൻ
  rationale: കൽപ്പനയിൽ അക്ഷരാർഥത്തിലുള്ള ഉറക്കമില്ലായ്മയും വിശാലമായ ജാഗ്രതയും ഉൾപ്പെടാമെന്ന അർഥസമ്മർദം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘പറയുന്നു’ എന്ന ചരിത്രവർത്തമാനകാലവും ‘ഇരിക്കുവിൻ’ എന്ന മാന്യമായ ബഹുവചന കൽപ്പനാരൂപവും മൂലപാഠത്തിന്റെ സജീവതയും ഗൗരവവും നിലനിർത്തുന്നു.
