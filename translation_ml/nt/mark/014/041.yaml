id: MRK.14.41
reference: Mark 14:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ml
  text: 'അവൻ മൂന്നാം പ്രാവശ്യം വന്ന് അവരോടു പറയുന്നു: “ഇനിയും ഉറങ്ങി വിശ്രമിക്കുകയാണോ?[a] മതി![b] സമയം വന്നിരിക്കുന്നു. ഇതാ, മനുഷ്യപുത്രൻ പാപികളുടെ കൈകളിൽ ഏൽപ്പിക്കപ്പെടുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇനി ഉറങ്ങി വിശ്രമിച്ചുകൊള്ളുക.” ഗ്രീക്ക് വാക്യം പരിഹാസപരമായ പ്രസ്താവനയായോ അനുമതിയായോ, “ഇനിയും ഉറങ്ങി വിശ്രമിക്കുകയാണോ?” എന്ന അലങ്കാരചോദ്യമായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: “മതി!” എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ദുഷ്കരമാണ്. “മതിയായി” എന്നും, ഇവിടെ സാധ്യത കുറവാണെങ്കിലും “പണം മുഴുവൻ ലഭിച്ചിരിക്കുന്നു” എന്ന വാണിജ്യാർഥത്തിലും ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: അവൻ മൂന്നാം പ്രാവശ്യം വന്ന്
  rationale: ചരിത്രവർത്തമാനത്തിന്റെ സജീവത മലയാളത്തിൽ സ്വാഭാവികമായ സംഭവവിവരണരൂപത്തിൽ നൽകുന്നു; τὸ τρίτον എന്നതിന്റെ നിർദിഷ്ടത ‘മൂന്നാം പ്രാവശ്യം’ നിലനിർത്തുന്നു.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: ഇനിയും ഉറങ്ങി വിശ്രമിക്കുകയാണോ?
  rationale: വാക്യത്തിന്റെ സന്ദർഭത്തിലുള്ള ശാസനാത്മകമായ അലങ്കാരചോദ്യവായന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ഗ്രീക്കിലെ രൂപം പരിഹാസപരമായ അനുമതിയായും വായിക്കാമെന്നത് അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀπέχει
  choice: മതി!
  rationale: ദുഷ്കരമായ ഈ പ്രയോഗത്തിന് സന്ദർഭോചിതവും സംക്ഷിപ്തവുമായ അർഥം; ‘മതിയായി’ എന്ന വാക്യരൂപവും സാധ്യതയുള്ളതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ἦλθεν ἡ ὥρα
  choice: ആ നാഴിക വന്നിരിക്കുന്നു
  rationale: ὥραയുടെ നിയുക്തസമയത്തെ സൂചിപ്പിക്കുന്ന ദൈവശാസ്ത്രപരവും കഥാപരവുമായ ഭാവം ‘നാഴിക’ നിലനിർത്തുന്നു; പൂർത്തിയായ വരവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് നിർദ്ദേശകത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളസമാനപദം.
- source_word: παραδίδοται
  choice: ഏൽപ്പിക്കപ്പെടുന്നു
  rationale: ‘ഒറ്റിക്കൊടുക്കപ്പെടുന്നു’ എന്ന് യൂദാസിന്റെ വഞ്ചനയിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ, മറ്റൊരാളുടെ അധികാരത്തിലേക്കു കൈമാറപ്പെടുക എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണത്തിന്റെ പതിവായ ശീർഷകരൂപവും അതിന്റെ പ്രതിധ്വനികളും സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: പാപികളുടെ കൈകളിൽ
  rationale: മറ്റുള്ളവരുടെ അധികാരത്തിന് കീഴിലാകുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ ഗ്രീക്ക് പ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: Καθεύδετε ... καὶ ἀναπαύεσθε എന്നതിന്റെ വാക്യബലം
  choice: 'ശാസനാത്മകമായ ചോദ്യം: ‘ഇനിയും ഉറങ്ങി വിശ്രമിക്കുകയാണോ?’'
  alternative: 'പരിഹാസപരമായ അനുമതി/കല്പന: ‘ഇനി ഉറങ്ങി വിശ്രമിച്ചുകൊള്ളുക.’'
  rationale: ആദ്യകാല കൈയെഴുത്തുപ്രതികളിലെ വിരാമചിഹ്നങ്ങൾ ഇതു തീർപ്പാക്കുന്നില്ല. സന്ദർഭത്തിൽ ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമാണെങ്കിലും മറ്റൊരു യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: ἀπέχει എന്ന ദുഷ്കരപ്രയോഗത്തിന്റെ അർഥം
  choice: മതി!
  alternative: ‘മതിയായി’ അല്ലെങ്കിൽ, ഇവിടെ സാധ്യത കുറവായ, ‘പണം മുഴുവൻ ലഭിച്ചിരിക്കുന്നു’ എന്ന വാണിജ്യാർഥം
  rationale: ഉടൻ സംഭവിക്കുന്ന കഥാപരമായ വഴിത്തിരിവിനോട് ‘മതി!’ നന്നായി ചേരുന്നു; അനുമാനാധിഷ്ഠിതമായ സാങ്കേതിക അർഥം മുഖ്യപാഠത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: παραδίδοται എന്നതിന്റെ പരിധി
  choice: ഏൽപ്പിക്കപ്പെടുന്നു
  alternative: ഒറ്റിക്കൊടുക്കപ്പെടുന്നു
  rationale: പ്രവർത്തകനെ യൂദാസിലേക്കു മാത്രം ചുരുക്കാതെ, പീഡാനുഭവവിവരണത്തിലെ കൈമാറ്റത്തിന്റെ വിശാലമായ കഥാപരവും ദൈവശാസ്ത്രപരവുമായ പരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും കഥാപരമായി സജീവവുമായ ശൈലി. ‘മനുഷ്യപുത്രൻ’, ‘നാഴിക’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ തിരുവെഴുത്തുസംബന്ധിയായ പ്രതിധ്വനി കാത്തുസൂക്ഷിക്കുന്നു. യഥാർഥമായ വ്യാകരണ-പദാർഥ അനിശ്ചിതത്വങ്ങൾ മുഖ്യപാഠത്തെ ഭാരപ്പെടുത്താതെ അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
