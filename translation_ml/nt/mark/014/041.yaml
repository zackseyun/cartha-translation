revisions:
- from: 'അവൻ മൂന്നാം പ്രാവശ്യം വന്ന് അവരോടു പറഞ്ഞു: “ഇനിയും ഉറങ്ങി വിശ്രമിക്കുകയാണോ?[a] മതി![b] ആ നാഴിക വന്നിരിക്കുന്നു. ഇതാ, മനുഷ്യപുത്രൻ പാപികളുടെ കൈകളിൽ ഏൽപ്പിക്കപ്പെടുന്നു.”'
  to: 'അവൻ മൂന്നാം പ്രാവശ്യം വന്ന് അവരോടു പറയുന്നു: “ഇനിയും ഉറങ്ങി വിശ്രമിക്കുകയാണോ?[a] മതി![b] സമയം വന്നിരിക്കുന്നു. ഇതാ, മനുഷ്യപുത്രൻ പാപികളുടെ കൈകളിൽ ഏൽപ്പിക്കപ്പെടുന്നു.”'
  rationale: ‘നാഴിക’ എന്ന പദം ആധുനിക ഉപയോഗത്തിൽ വരുത്താവുന്ന സമയ-അളവുസംബന്ധിയായ ആശയക്കുഴപ്പം ഒഴിവാക്കി ἦλθεν ἡ ὥραയ്ക്ക് ‘സമയം വന്നിരിക്കുന്നു’ എന്നു നൽകി. കഥാവിവരണത്തിലെ ഗ്രീക്ക് വർത്തമാനകാലം ‘പറയുന്നു’ എന്നതിലൂടെ നിലനിർത്തി. Καθεύδετε ... ἀναπαύεσθε, ἀπέχει, പരδίδοται എന്നിവയിലെ യഥാർഥ വ്യാഖ്യാന-പദാർഥ അനിശ്ചിതത്വങ്ങൾ യഥാക്രമം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പുകളിലും സംരക്ഷിച്ചിരിക്കുന്നു.
