translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മാളികമുറി’ പോലുള്ള പഴയ പ്രയോഗത്തിനു പകരം ‘മുകളിലത്തെ നിലയിലെ മുറി’ എന്ന സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന രൂപം ഉപയോഗിച്ചു; ἐστρωμένον എന്നതിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
