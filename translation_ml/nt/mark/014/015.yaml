source:
  edition: SBLGNT
  text: καὶ αὐτὸς ὑμῖν δείξει ἀνάγαιον μέγα ἐστρωμένον ἕτοιμον· ⸀καὶ ἐκεῖ ἑτοιμάσατε ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/015.yaml
  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: ml
  text: അവൻതന്നെ നിങ്ങൾക്ക് ക്രമീകരിച്ചിട്ടുള്ളതും സജ്ജമായതുമായ മുകളിലത്തെ നിലയിലെ ഒരു വലിയ മുറി[a] കാണിച്ചുതരും; അവിടെ നമുക്കുവേണ്ടി ഒരുക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രമീകരിച്ചിട്ടുള്ളതും തയ്യാറായിരിക്കുന്നതുമായ മുകളിലത്തെ നിലയിലെ ഒരു വലിയ മുറി.” ἐστρωμένον എന്ന പദത്തിന് മുറി ഉപയോഗത്തിനായി ക്രമീകരിച്ചോ സജ്ജീകരിച്ചോ ഇരിക്കുന്നു എന്ന അർഥമാകാം; വെറും ഫർണിച്ചർ ഉള്ള മുറി എന്ന അർഥം മാത്രമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: അയാൾതന്നെ
  rationale: പ്രത്യയത്തിന്റെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് മുൻവാക്യത്തിൽ പരാമർശിച്ച വ്യക്തിയിലേക്കു സ്വാഭാവികമായി വിരൽചൂണ്ടുന്നു.
- source_word: δείξει
  choice: കാണിച്ചുതരും
  rationale: ഭാവികാലക്രിയയുടെ അർഥവും, ശിഷ്യന്മാരെ മുറിയിലേക്കു നയിച്ചു കാണിക്കുമെന്ന സന്ദർഭസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀνάγαιον μέγα
  choice: മുകളിലത്തെ നിലയിൽ ... ഒരു വലിയ മുറി
  rationale: വീടിന്റെ മുകൾഭാഗത്തുള്ള വിശാലമായ മുറിയെന്ന അർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐστρωμένον
  choice: വിരിച്ചൊരുക്കിയതും
  rationale: στρώννυμι എന്ന ക്രിയയുടെ ‘വിരിക്കുക/ക്രമീകരിക്കുക’ എന്ന ദൃശ്യാർഥം നിലനിർത്തുന്നു; മുറിയിൽ വെറും ഉപകരണങ്ങൾ ഉണ്ടായിരുന്നു എന്നു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἕτοιμον
  choice: സജ്ജവുമായ
  rationale: മുറി ഉപയോഗത്തിനായി തയ്യാറായിരുന്നുവെന്ന അർഥം നൽകുകയും തുടർന്നുള്ള ἑτοιμάσατε എന്ന കല്പനയിൽനിന്ന് പദപരമായി വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: സ്ഥലസൂചകമായ ലളിതവും കൃത്യവുമായ തുല്യപദം.
- source_word: ἑτοιμάσατε
  choice: ഒരുക്കുക
  rationale: ബഹുവചനത്തിലുള്ള കല്പനയുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു; പെസഹ ഒരുക്കങ്ങളാണ് സന്ദർഭമെങ്കിലും അവയെ മൂലപാഠത്തിനപ്പുറം വിശദീകരിക്കുന്നില്ല.
- source_word: ἡμῖν
  choice: നമുക്കുവേണ്ടി
  rationale: സർവനാമത്തിന്റെ പരിധി വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
