- from: അയാൾതന്നെ നിങ്ങൾക്ക് മുകളിലത്തെ നിലയിൽ വിരിച്ചൊരുക്കിയതും സജ്ജവുമായ ഒരു വലിയ മുറി[a] കാണിച്ചുതരും; അവിടെ നമുക്കുവേണ്ടി ഒരുക്കുക.
  to: അവൻതന്നെ നിങ്ങൾക്ക് ക്രമീകരിച്ചിട്ടുള്ളതും സജ്ജമായതുമായ മുകളിലത്തെ നിലയിലെ ഒരു വലിയ മുറി[a] കാണിച്ചുതരും; അവിടെ നമുക്കുവേണ്ടി ഒരുക്കുക.
