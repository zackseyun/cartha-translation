reference: Mark 14:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: ml
  text: യേശു ബെഥാന്യയിൽ കുഷ്ഠരോഗിയായ ശിമോന്റെ വീട്ടിൽ ചാരിക്കിടക്കുമ്പോൾ, വളരെ വിലയേറിയ ശുദ്ധമായ[a] നാർദ് സുഗന്ധതൈലം നിറച്ച ഒരു അലബാസ്റ്റർ ഭരണിയുമായി ഒരു സ്ത്രീ വന്നു. അവൾ ആ ഭരണി പൊട്ടിച്ച് തൈലം അവന്റെ തലയിൽ ഒഴിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അസലായ’ എന്നും പരിഭാഷപ്പെടുത്താം; ‘ശുദ്ധമായ’ എന്നു പരിഭാഷപ്പെടുത്തിയ πιστικῆς എന്ന ഗ്രീക്ക് വിശേഷണത്തിന്റെ കൃത്യമായ അർഥം വിവാദവിധേയമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: യേശു ... മേശയ്ക്കരികിൽ ചാരിയിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് പശ്ചാത്തലസാഹചര്യം സൂചിപ്പിക്കുന്നു. κατακειμένου എന്നതിലെ ചാരിക്കിടക്കുന്ന ഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ ദൃശ്യം സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു; ഭക്ഷണം കഴിക്കുകയായിരുന്നു എന്ന് പാഠത്തിൽ ഇല്ലാത്ത വിവരം നേരിട്ട് ചേർക്കുന്നില്ല.
- source_word: Βηθανίᾳ
  choice: ബെഥാന്യയിൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: കുഷ്ഠരോഗിയായ ശിമോന്റെ വീട്ടിൽ
  rationale: ഗ്രീക്ക് പാഠം ശിമോനെ ‘കുഷ്ഠരോഗി’ എന്നു വിശേഷിപ്പിക്കുന്നു. ‘മുൻ കുഷ്ഠരോഗി’ എന്നു മാറ്റുന്നത് പാഠത്തിൽ ഇല്ലാത്ത അനുമാനം ചേർക്കും.
- source_word: γυνὴ
  choice: ഒരു സ്ത്രീ
  rationale: ഈ ഘട്ടത്തിൽ മർക്കോസ് സ്ത്രീയെ തിരിച്ചറിയിക്കുന്നില്ല; അനിശ്ചിത പരാമർശം നിലനിർത്തുന്നു.
- source_word: ἀλάβαστρον
  choice: ഒരു അലബാസ്റ്റർ ഭരണി
  rationale: പദം അലബാസ്റ്റർകൊണ്ടുള്ള സുഗന്ധതൈലപാത്രത്തെ സൂചിപ്പിക്കുന്നു. വസ്തുവിന്റെ പ്രത്യേകത നഷ്ടപ്പെടുത്താതെ ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ലിപ്യന്തരണവും പൊതുവായ പാത്രപദവും ഉപയോഗിച്ചു.
- source_word: μύρου νάρδου
  choice: നാർദ് സുഗന്ധതൈലം
  rationale: μύρον സുഗന്ധമുള്ള തൈലത്തെയും νάρδος അതിന്റെ പ്രത്യേക സസ്യജന്യ ഇനത്തെയും സൂചിപ്പിക്കുന്നു. ‘സുഗന്ധതൈലം’ അതിന്റെ സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πιστικῆς
  choice: ശുദ്ധമായ[a]
  rationale: അർഥം വിവാദവിധേയമാണെങ്കിലും സന്ദർഭത്തിൽ അസലായതോ കലർപ്പില്ലായ്മയോ സൂചിപ്പിക്കുന്ന സാധാരണ വ്യാഖ്യാനം ‘ശുദ്ധമായ’ എന്നതാണ്. അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: πολυτελοῦς
  choice: വളരെ വിലയേറിയ
  rationale: ഉയർന്ന സാമ്പത്തികമൂല്യം സൂചിപ്പിക്കുകയും തുടർന്നുള്ള പ്രതികരണത്തിനുള്ള പശ്ചാത്തലം വ്യക്തമാക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: അവൾ ആ ഭരണി പൊട്ടിച്ച്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാശൃംഖലയായി അവതരിപ്പിക്കുന്നു; ‘തകർത്തു തരിപ്പണമാക്കി’ എന്ന അതിശയോക്തി ഒഴിവാക്കുന്നു.
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: തൈലം അവന്റെ തലയിൽ ഒഴിച്ചു
  rationale: തലയുടെമേൽ ഒഴിച്ച പ്രവൃത്തി നേരായും വ്യക്തമായും നൽകുന്നു; ‘തൈലം’ എന്ന ആവർത്തനം മലയാളത്തിലെ അവ്യക്തത ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘കുഷ്ഠരോഗിയായ ശിമോൻ’ എന്ന വിശേഷണം സജീവരോഗത്തെ സൂചിപ്പിക്കാതിരിക്കാൻ മയപ്പെടുത്തണമോ
  choice: കുഷ്ഠരോഗിയായ ശിമോൻ
  alternative: മുമ്പ് കുഷ്ഠരോഗിയായിരുന്ന ശിമോൻ
  rationale: മൂലപാഠം യാതൊരു വിശദീകരണവുമില്ലാതെ ഈ വിശേഷണം നൽകുന്നു. ചരിത്രപരമായി സാദ്ധ്യമായാലും ‘മുമ്പ്’ എന്നു ചേർക്കുന്നത് മൂലപാഠത്തിനു പുറത്തുള്ള അനുമാനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പരമ്പരാഗതമായി പരിചിതമായ പേരുകൾ നിലനിർത്തി; അപരിചിതമായ വസ്തുവിന് ‘അലബാസ്റ്റർ ഭരണി’ എന്ന സുതാര്യമായ രൂപം ഉപയോഗിച്ചു. ദൈവിക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിൽ മൂലപാഠത്തിലില്ലാത്ത പ്രത്യേക ബഹുമാനരൂപം ചേർത്തിട്ടില്ല.
