  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: ml
  text: പ്രധാന പുരോഹിതന്മാരും മുഴുവൻ ന്യായസഭയും[a] യേശുവിനെ വധിക്കാൻ അവനെതിരായ സാക്ഷിമൊഴി അന്വേഷിച്ചുകൊണ്ടിരുന്നു; എന്നാൽ അവർ ഒരു സാക്ഷിമൊഴിയും കണ്ടെത്തുന്നില്ലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: ‘മുഴുവൻ സൻഹെദ്രിൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: പ്രധാന പുരോഹിതന്മാരും
  rationale: δέയുടെ മൃദുവായ ആഖ്യാനബന്ധം പ്രത്യേക കാലസൂചകപദം ചേർക്കാതെ മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക തുടർച്ചയിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: ἀρχιερεῖς
  choice: പ്രധാന പുരോഹിതന്മാർ
  rationale: യെരൂശലേമിലെ പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന് വ്യക്തവും ആധുനികവുമായ മലയാളം.
- source_word: ὅλον τὸ συνέδριον
  choice: ന്യായസഭ മുഴുവനും
  rationale: ഭരണ-ന്യായാധികാരമുള്ള സഭ എന്ന അർഥം വിവർത്തനം ചെയ്യുകയും ὅλον എന്നതിന്റെ സമഗ്രത നിലനിർത്തുകയും ചെയ്യുന്നു; ചരിത്രനാമമായ ‘സൻഹെദ്രിൻ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐζήτουν
  choice: അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപർഫെക്റ്റ് ക്രിയയുടെ തുടർച്ചയായ ശ്രമഭാവം നിലനിർത്തുന്നു.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: യേശുവിനെതിരായ
  rationale: κατά + genitive ഇവിടെ പ്രതിവിരുദ്ധമായ നിയമസന്ദർഭം സൂചിപ്പിക്കുന്നു.
- source_word: μαρτυρίαν
  choice: സാക്ഷിമൊഴി
  rationale: വിചാരണാസന്ദർഭത്തിലെ സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സാക്ഷിയായ വ്യക്തിയുമായി ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: യേശുവിനെ വധിക്കേണ്ടതിന്
  rationale: εἰς + articular infinitive സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം നിലനിർത്തുകയും θανατόωയുടെ ഔപചാരികമായ വധാർത്ഥം പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ οὐχ ηὕρισκον
  choice: എന്നാൽ അങ്ങനെയൊന്നും അവർ കണ്ടെത്തിയില്ല
  rationale: മുൻപുള്ള അന്വേഷണവും അതിന്റെ പരാജയവും തമ്മിലുള്ള സ്വാഭാവികമായ വിരോധബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അങ്ങനെയൊന്നും’ എന്നത് മുമ്പ് പറഞ്ഞ സാക്ഷിമൊഴിയെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: συνέδριον എന്ന സഭയുടെ തിരിച്ചറിയൽ
  choice: പ്രധാനപാഠത്തിൽ ‘ന്യായസഭ’
  alternative: ‘സൻഹെദ്രിൻ’
  rationale: ഗ്രീക്ക് പദത്തിന്റെ പ്രവർത്തനപരമായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; നിർദിഷ്ട ചരിത്രനാമം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിയമസന്ദർഭ ശൈലി. തുടർച്ചയായ അന്വേഷണം ‘അന്വേഷിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി; വായനാസൗകര്യത്തിനായി അവസാനത്തെ ഗ്രീക്ക് ഇംപർഫെക്റ്റ് സ്വാഭാവികമായ ഭൂതകാലത്തിൽ അവതരിപ്പിച്ചു.
