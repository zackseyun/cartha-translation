id: MRK.14.22
reference: Mark 14:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: ml
  text: 'അവർ ഭക്ഷിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അവൻ അപ്പം എടുത്ത്, അതിന്മേൽ അനുഗ്രഹം ചൊല്ലി, മുറിച്ച്, അവർക്കു കൊടുത്തു; പിന്നെ അവൻ പറഞ്ഞു: “എടുക്കുക; ഇത് എന്റെ ശരീരം ആകുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘ഇത് എന്റെ ശരീരത്തെ പ്രതിനിധാനം ചെയ്യുന്നു’ / ‘ഇത് എന്റെ ശരീരം എന്നാണ് അർഥം’ എന്നും വ്യാഖ്യാനിക്കാം. ഗ്രീക്കിലെ അക്ഷരാർഥം: ‘ഇത് എന്റെ ശരീരം ആകുന്നു.’'
    reason: മൂലഗ്രീക്കിന്റെ നേരിട്ടുള്ള വാചകം നിലനിർത്തിക്കൊണ്ട് നിലവിലുള്ള വ്യാഖ്യാനസാധ്യതകൾ വായനക്കാരനെ അറിയിക്കുന്നു.
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: അവർ ഭക്ഷിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തോടുകൂടിയ genitive absolute ഒരേ സമയത്ത് തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം ആ തുടർച്ചയും സമകാലികതയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: λαβὼν ἄρτον
  choice: അവൻ അപ്പം എടുത്ത്
  rationale: ആഖ്യാനക്രമത്തിൽ aorist participle മലയാളത്തിൽ സംയോജക ക്രിയാരൂപമായി സ്വാഭാവികമാണ്. ἄρτον നിർദേശകമില്ലാത്തതിനാൽ ‘ഒരു അപ്പം’ എന്നതിലുപരി ‘അപ്പം’ എന്നു നൽകി അനാവശ്യമായ കൃത്യത ഒഴിവാക്കി.
- source_word: εὐλογήσας
  choice: അതിന്‍മേൽ അനുഗ്രഹം ചൊല്ലി
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ εὐλογέω അപ്പത്തിന്മേൽ അനുഗ്രഹവചനം ചൊല്ലുന്നതിനെ സൂചിപ്പിക്കാം. ‘അതിന്‍മേൽ’ എന്നത് സന്ദർഭം വ്യക്തമാക്കുന്നു; നന്ദിപറച്ചിൽ മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἔκλασεν
  choice: മുറിച്ച്
  rationale: വിതരണത്തിനായി അപ്പം മുറിക്കുന്ന പ്രവൃത്തിയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ മുൻപറഞ്ഞ അപ്പം വീണ്ടും ആവർത്തിക്കാതെ ക്രിയാക്രമം സ്വാഭാവികമായി തുടരുന്നു.
- source_word: ἔδωκεν αὐτοῖς
  choice: അവർക്കു കൊടുത്തു
  rationale: സന്ദർഭത്തിൽ അപ്പമാണ് ഉൾക്കൊള്ളുന്ന കർമം; ‘വിതരണം ചെയ്തു’ എന്ന വ്യാഖ്യാനാത്മക വികസനം കൂടാതെ ലളിതമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Λάβετε
  choice: വാങ്ങുവിൻ
  rationale: ശിഷ്യന്മാരോടുള്ള ബഹുവചന ആജ്ഞയെ നേരിട്ട് അവതരിപ്പിക്കുന്നു. അപ്പം കൈക്കൊള്ളാനുള്ള ക്ഷണം മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ പ്രകടമാക്കുന്നു.
- source_word: τοῦτό ἐστιν
  choice: ഇത് ... ആകുന്നു
  rationale: സാധാരണ copula ഘടനയെ നേരിട്ട് നിലനിർത്തുന്നു; ‘അർഥമാക്കുന്നു’ എന്നോ ‘പ്രതിനിധാനം ചെയ്യുന്നു’ എന്നോ ഉള്ള വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τὸ σῶμά μου
  choice: എന്റെ ശരീരം
  rationale: σῶμα എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ശരീരം’ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ തർക്കം പരിഭാഷയിൽ മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: അന്ത്യഅത്താഴത്തിലെ യേശുവിന്റെ പ്രഖ്യാപനത്തിന്റെ അർഥം
  choice: τοῦτό ἐστιν τὸ σῶμά μου എന്നത് ‘ഇത് എന്റെ ശരീരം ആകുന്നു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഇത് എന്റെ ശരീരത്തെ പ്രതിനിധാനം ചെയ്യുന്നു’ / ‘ഇത് എന്റെ ശരീരം എന്നാണ് അർഥം.’
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ സാധാരണ copula ആയ ἐστιν ആണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ കൂദാശാസംബന്ധമായ വ്യത്യസ്ത വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ മുഖ്യവാചകത്തിലൂടെ ഉറപ്പിക്കാതെ, മൂലവാചകത്തിന്റെ ഭാഷയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനക്രമവും തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവവും പാലിച്ചു. ‘വാങ്ങുവിൻ’, ‘ആകുന്നു’ എന്നീ രൂപങ്ങൾ മാന്യമായ ബഹുവചന ആജ്ഞയും പ്രഖ്യാപനത്തിന്റെ ഔപചാരിക ഭാവവും നിലനിർത്തുന്നു; അതേസമയം അത്യന്തം പുരാതനമായ ശൈലി ഒഴിവാക്കി.
