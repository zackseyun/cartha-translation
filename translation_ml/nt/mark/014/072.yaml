revisions:
- from: ഉടനെ കോഴി രണ്ടാം പ്രാവശ്യം കൂവി. അപ്പോൾ പത്രോസ്, “കോഴി രണ്ടുവട്ടം കൂവുന്നതിനുമുമ്പ് നീ എന്നെ മൂന്നുവട്ടം നിഷേധിക്കും” എന്ന് യേശു തന്നോടു പറഞ്ഞ വാക്ക് ഓർത്തു. അവൻ മനമിടിഞ്ഞ് കരഞ്ഞു.[a]
  to: ഉടനെ കോഴി രണ്ടാമതും കൂവി. പത്രോസ്, “കോഴി രണ്ടുവട്ടം കൂവുന്നതിനുമുമ്പ് നീ എന്നെ മൂന്നുവട്ടം തള്ളിപ്പറയും” എന്ന് യേശു തന്നോടു പറഞ്ഞ വാക്ക് ഓർത്തു. അവൻ മനമിടിഞ്ഞ് കരഞ്ഞു.[a]
