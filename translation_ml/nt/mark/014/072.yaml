source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: ml
  text: ഉടനെ കോഴി രണ്ടാമതും കൂവി. പത്രോസ്, “കോഴി രണ്ടുവട്ടം കൂവുന്നതിനുമുമ്പ് നീ എന്നെ മൂന്നുവട്ടം തള്ളിപ്പറയും” എന്ന് യേശു തന്നോടു പറഞ്ഞ വാക്ക് ഓർത്തു. അവൻ മനമിടിഞ്ഞ് കരഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മനമിടിഞ്ഞ്” എന്നു പരിഭാഷപ്പെടുത്തിയ ἐπιβαλών എന്ന പദത്തിന്റെ അർഥം ഇവിടെ ഉറപ്പില്ല. “അതിനെക്കുറിച്ച് ചിന്തിച്ചപ്പോൾ അവൻ കരഞ്ഞു” എന്നും, തല മൂടുന്നതുപോലുള്ള ഒരു ശാരീരിക ചേഷ്ടയെ സൂചിപ്പിക്കുന്നതായും ഇതിനെ വ്യാഖ്യാനിച്ചിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ ആഖ്യാനത്തിലെ അടിയന്തരത നിലനിർത്തുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἐκ δευτέρου
  choice: രണ്ടാം പ്രാവശ്യം
  rationale: പ്രവൃത്തി രണ്ടാമതാണെന്ന വ്യക്തമായ എണ്ണൽ അർത്ഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: കോഴി കൂവി
  rationale: കോഴിയുടെ ശബ്ദത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἀνεμνήσθη
  choice: ഓർത്തു
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞത് ഓർമവന്നതിനെ ലളിതമായും നേരിട്ടും അറിയിക്കുന്നു.
- source_word: τὸ ῥῆμα
  choice: വാക്ക്
  rationale: ῥῆμα എന്നതിന്റെ ഔപചാരിക സമീപ്യം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള ഉദ്ധരണി അതിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: കോഴി രണ്ടുവട്ടം കൂവുന്നതിനുമുമ്പ്
  rationale: πρίν സഹിതമുള്ള കാലസൂചനയും δὶς എന്ന എണ്ണൽ അർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τρίς με ἀπαρνήσῃ
  choice: നീ എന്നെ മൂന്നുവട്ടം നിഷേധിക്കും
  rationale: ἀπαρνέομαι എന്നതിന്റെ നിരാകരണം/തള്ളിപ്പറയൽ എന്ന ബന്ധപരമായ ശക്തി അമിതവ്യാഖ്യാനമില്ലാതെ നൽകുന്നു.
- source_word: ἐπιβαλών
  choice: മനമിടിഞ്ഞ്
  rationale: ദുഷ്കരമായ ഈ കൃദന്തരൂപം സന്ദർഭത്തിലെ വികാരത്തകർച്ചയായി വായിക്കാവുന്ന വിധത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: ἔκλαιεν
  choice: കരഞ്ഞു
  rationale: തുടർച്ചാസൂചനയുള്ള അപൂർണ്ണഭൂതകാലത്തെ മലയാള ആഖ്യാനത്തിൽ ലളിതവും മാന്യവുമായ രീതിയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐπιβαλών എന്ന ദുഷ്കരമായ കൃദന്തരൂപത്തിന്റെ വിവർത്തനം
  choice: “മനമിടിഞ്ഞ്” എന്നു വിവർത്തനം ചെയ്തു.
  alternative: “അതിനെക്കുറിച്ച് ചിന്തിച്ചപ്പോൾ,” “പുറത്തേക്കു പാഞ്ഞ്,” അല്ലെങ്കിൽ “തല മൂടിക്കൊണ്ട്” എന്നിങ്ങനെ വ്യാഖ്യാനിക്കപ്പെട്ടിട്ടുണ്ട്.
  rationale: പത്രോസിന്റെ പ്രതികരണത്തെ ഒരു നിർദിഷ്ട ശാരീരിക ചേഷ്ടയായി ഉറപ്പിക്കാതെ വികാരപരമായ തകർച്ച പ്രകടമാക്കുന്നു; ഗ്രീക്കിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. “നിഷേധിക്കും” എന്നത് പരിചിതമായ ബൈബിൾഭാഷയും ഇന്നത്തെ സ്വാഭാവിക പ്രയോഗവും തമ്മിലുള്ള സമതുലനം പാലിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ദുഷ്കരപ്രയോഗത്തിനു പിന്നാലെ വാക്യത്തിൽ നൽകിയിരിക്കുന്നു.
