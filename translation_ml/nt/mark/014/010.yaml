source:
  edition: SBLGNT
  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: ml
  text: പന്ത്രണ്ടുപേരിൽ ഒരാളായ യൂദാ ഇസ്കര്യോത്ത്, യേശുവിനെ അവർക്ക് ഏൽപ്പിച്ചുകൊടുക്കാൻ പ്രധാന പുരോഹിതന്മാരുടെ അടുക്കലേക്കു പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശുവിനെ അവർക്ക് ഒറ്റിക്കൊടുക്കാൻ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് “ഏൽപ്പിച്ചുകൊടുക്കുക” എന്നർഥമുണ്ട്; യൂദായുടെ കാര്യത്തിൽ ഈ ഏൽപ്പിച്ചുകൊടുക്കൽ വഞ്ചനയുടെ പ്രവൃത്തിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല)
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ വാക്യം നേരിട്ട് ആരംഭിക്കുന്നത് ഗ്രീക്കിലെ ലളിതമായ ബന്ധകത്തിന്റെ പ്രവർത്തനം മതിയായ വിധത്തിൽ നൽകുന്നു; ‘അപ്പോൾ’ എന്നു ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചന ശക്തമാകാം.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: യൂദാ ഈസ്കര്യോത്ത്
  rationale: വ്യക്തിനാമവും വിശേഷണനാമവും മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: പന്ത്രണ്ടുപേരിൽ ഒരാളായ
  rationale: യേശുവിന്റെ അംഗീകൃത പന്ത്രണ്ടംഗ ശിഷ്യവൃന്ദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടന ഉപയോഗിച്ചു.
- source_word: ἀπῆλθεν
  choice: ചെന്ന്
  rationale: ലളിതമായ ആഖ്യാനചലനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പുറപ്പെട്ടുപോയി’ എന്നതുപോലെ വേർപാടിന്റെ ആശയം അമിതമാക്കുന്നില്ല.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: മഹാപുരോഹിതന്മാരുടെ അടുക്കൽ
  rationale: ബഹുവചനമായ ἀρχιερεῖς യെരൂശലേമിലെ പ്രധാന പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്നു; സ്ഥാപിതവും മനസ്സിലാക്കാൻ എളുപ്പവുമായ മലയാളപ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: ἵνα
  choice: …ഉദ്ദേശിച്ചു
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: παραδοῖ
  choice: ഏൽപ്പിച്ചുകൊടുക്കാൻ
  rationale: ‘കൈമാറുക/ഏൽപ്പിച്ചുകൊടുക്കുക’ എന്ന വിശാലമായ പദാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ വഞ്ചനാഭാവം മുഖ്യപാഠത്തിൽ മാത്രം നിർബന്ധിച്ച് ചുരുക്കുന്നില്ല.
- source_word: αὐτὸν … αὐτοῖς
  choice: യേശുവിനെ അവർക്ക്
  rationale: ഗ്രീക്കിൽ സർവനാമമായിരിക്കുമ്പോഴും മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അവനെ’ എന്നതിന് പകരം പരാമർശിതനായ യേശുവിന്റെ പേര് വ്യക്തമാക്കി; സ്വീകരിക്കുന്നവരെ ‘അവർക്ക്’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: വഞ്ചനാസന്ദർഭത്തിൽ παραδοῖ എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: യേശുവിനെ അവർക്ക് ഏൽപ്പിച്ചുകൊടുക്കാൻ
  alternative: യേശുവിനെ അവർക്ക് ഒറ്റിക്കൊടുക്കാൻ
  rationale: യൂദായുടെ പ്രവൃത്തി വഞ്ചനയായിരുന്നെങ്കിലും παραδίδωμι എന്ന ക്രിയയ്ക്ക് ‘കൈമാറുക/ഏൽപ്പിച്ചുകൊടുക്കുക’ എന്ന വിശാലമായ അർഥമുണ്ട്; പീഡാനുഭവവിവരണത്തിലുടനീളമുള്ള ഈ പദത്തിന്റെ ബന്ധവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്താൻ വിശാലമായ അർഥം മുഖ്യപാഠത്തിൽ നൽകി, വഞ്ചനാഭാവം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മഹാപുരോഹിതന്മാർ’ പോലുള്ള പരിചിതമായ ബൈബിൾ പദം നിലനിർത്തിയപ്പോൾ വാക്യഘടന സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം [a] മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
