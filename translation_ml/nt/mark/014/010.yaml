revisions:
- from: പന്ത്രണ്ടുപേരിൽ ഒരാളായ യൂദാ ഈസ്കര്യോത്ത് മഹാപുരോഹിതന്മാരുടെ അടുക്കൽ ചെന്ന്, യേശുവിനെ അവർക്ക് ഏൽപ്പിച്ചുകൊടുക്കാൻ ഉദ്ദേശിച്ചു.[a]
  to: പന്ത്രണ്ടുപേരിൽ ഒരാളായ യൂദാ ഇസ്കര്യോത്ത്, യേശുവിനെ അവർക്ക് ഏൽപ്പിച്ചുകൊടുക്കാൻ പ്രധാന പുരോഹിതന്മാരുടെ അടുക്കലേക്കു പോയി.[a]
