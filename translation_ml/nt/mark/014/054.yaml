source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: ml
  text: പത്രോസ് ദൂരത്തുനിന്ന് അവനെ പിന്തുടർന്ന് മഹാപുരോഹിതന്റെ മുറ്റത്തിനകത്തോളം ചെന്നു. അവൻ കാവൽക്കാരോടൊപ്പം ഇരുന്ന് തീക്കരികിൽ[a] കുളിർ മാറ്റിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെളിച്ചത്തിനരികിൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘വെളിച്ചത്തോട്/വെളിച്ചത്തിനരികിൽ’ എന്നാണ്; ഇവിടെ മുറ്റത്തെ തീയുടെയോ അതിന്റെ വെളിച്ചത്തിന്റെയോ സമീപത്തെയാണു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: അകലം പാലിച്ച്
  rationale: പത്രോസ് ദൂരത്തുനിന്ന് ജാഗ്രതയോടെ പിന്തുടർന്നുവെന്ന സ്ഥലപരവും ആഖ്യാനപരവുമായ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἠκολούθησεν αὐτῷ
  choice: അവനെ പിന്തുടർന്ന്
  rationale: ആഖ്യാനത്തിലെ ലളിതമായ ഭൂതകാലപ്രവർത്തനം മലയാളവാക്യത്തിന്റെ ഒഴുക്കിനനുസരിച്ച് ക്രിയാവിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἕως ἔσω εἰς
  choice: മുറ്റത്തിനകത്തുവരെ ചെന്നു
  rationale: പത്രോസ് മഹാപുരോഹിതന്റെ വസതിയിലെ മുറ്റത്തിന്റെ അകത്തോളം പ്രവേശിച്ചുവെന്ന ശക്തമായ സ്ഥലസൂചന നിലനിർത്തുന്നു; വീടിനകത്ത് കയറിയെന്ന അർഥം വരുത്തുന്നില്ല.
- source_word: αὐλήν
  choice: മുറ്റം
  rationale: ഈ സന്ദർഭത്തിൽ വസതിയോടു ചേർന്ന അടച്ച നടുമുറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദമാണിത്.
- source_word: ἀρχιερέως
  choice: മഹാപുരോഹിതൻ
  rationale: സുവിശേഷങ്ങളിലെ പീഡാനുഭവവിവരണത്തിൽ ἀρχιερεύς എന്ന പദത്തിനുള്ള സ്ഥാപിതവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ἦν συγκαθήμενος
  choice: ഒപ്പം ഇരുന്ന്
  rationale: തുടർന്നുകൊണ്ടിരുന്ന പശ്ചാത്തലപ്രവർത്തനം വ്യക്തമാക്കുകയും σύν എന്ന ഘടകത്തിന്റെ ‘ഒപ്പം’ എന്ന ആശയം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: കാവൽക്കാരോടൊപ്പം
  rationale: അറസ്റ്റിന്റെയും വിചാരണയുടെയും ഈ സന്ദർഭത്തിൽ ഇവർ വെറും ഗൃഹഭൃത്യരല്ല, അധികാരികളുടെ കീഴിൽ സുരക്ഷാ ചുമതലയുള്ള ഉദ്യോഗസ്ഥരാണ്; ‘കാവൽക്കാർ’ അവരുടെ സന്ദർഭോചിതമായ പങ്ക് വ്യക്തമാക്കുന്നു.
- source_word: θερμαινόμενος
  choice: കുളിർ മാറ്റിക്കൊണ്ടിരുന്നു
  rationale: തീയുടെ ചൂടേറ്റ് സ്വയം ചൂടാക്കുന്ന തുടർച്ചയായ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πρὸς τὸ φῶς
  choice: തീയുടെ വെളിച്ചത്തിൽ
  rationale: φῶς എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘വെളിച്ചം’ നിലനിർത്തുകയും ചൂടിന്റെ ഉറവിടം മുറ്റത്തെ തീയാണെന്ന സന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ നീണ്ട സംയുക്തവാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കാതെ, ബന്ധിതമായ രണ്ട് പ്രവൃത്തികളായി ഒഴുക്കോടെ നൽകിയിരിക്കുന്നു. ‘തീ’യും ‘വെളിച്ചം’യും തമ്മിലുള്ള മൂലപാഠപരമായ സൂക്ഷ്മത മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
