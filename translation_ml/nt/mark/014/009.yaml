language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ലോകമെങ്ങും സുവാർത്ത[a] പ്രസംഗിക്കപ്പെടുന്നിടത്തെല്ലാം, ഇവൾ ചെയ്തതും അവളെ ഓർക്കാനായി[b] പറയപ്പെടും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “സുവിശേഷം.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അവൾക്കൊരു സ്മാരകമായി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: ഗൗരവവും ആധികാരികതയും നിറഞ്ഞ പ്രസ്താവനയുടെ ആമുഖമാണിത്. ആധുനിക മലയാളത്തിൽ അതിന്റെ ശക്തി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇത് മൃദുവായ വ്യവഹാരബന്ധകമാണ്; മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിൽ അതിന്റെ ബന്ധകപ്രവർത്തനം വ്യക്തമായതിനാൽ വേറൊരു സംയോജകപദം ചേർത്തില്ല.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പ്രസ്താവനയുടെ ഗൗരവവും കൃത്യമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ὅπου ἐὰν
  choice: ഇടത്തെല്ലാം
  rationale: വ്യവസ്ഥ നിറവേറുന്ന ഏതു സ്ഥലത്തെയും സൂചിപ്പിക്കുന്ന അനിശ്ചിതവും പൊതുവുമായ അർഥം നൽകുന്നു.
- source_word: κηρυχθῇ
  choice: പ്രസംഗിക്കപ്പെടുന്ന
  rationale: κηρύσσω സൂചിപ്പിക്കുന്ന പരസ്യമായ പ്രഖ്യാപനത്തിന്റെ ആശയം മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ ഈ പ്രയോഗം നൽകുന്നു.
- source_word: τὸ εὐαγγέλιον
  choice: ഈ സുവാർത്ത
  rationale: εὐαγγέλιον എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘നല്ല വാർത്ത’ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു. നിർദ്ദിഷ്ട ആർട്ടിക്കിളിന്റെ ബലം സന്ദർഭോചിതമായി ‘ഈ’ എന്നതിലൂടെ പ്രകടമാക്കി; പരമ്പരാഗതമായ ‘സുവിശേഷം’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: ലോകമെങ്ങും
  rationale: ലോകവ്യാപകമായ പരിധി സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: സുവാർത്തയുടെ പ്രസംഗത്തോടൊപ്പം ഇവളുടെ പ്രവൃത്തിയും പറയപ്പെടുമെന്ന കൂട്ടിച്ചേർക്കൽ ‘ചെയ്തതും’ എന്നതിലെ പ്രത്യയത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ὃ ἐποίησεν αὕτη
  choice: ഇവൾ ചെയ്തതും
  rationale: സ്ത്രീലിംഗ ഏകവചന നിർദ്ദേശകസർവനാമത്തെ ‘ഇവൾ’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘സ്ത്രീ’ എന്ന നാമം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: λαληθήσεται
  choice: പറയപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുകയും അവളുടെ പ്രവൃത്തി വാചികമായി അനുസ്മരിക്കപ്പെടുമെന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: അവളുടെ ഓർമ്മയ്ക്കായി
  rationale: അവളെ ഓർക്കുന്നതിനായുള്ള അനുസ്മരണാർഥം വ്യക്തമായി നൽകുന്നു; കൂടുതൽ നാമരൂപസമീപമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: εὐαγγέλιον എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഈ സുവാർത്ത
  alternative: ഈ സുവിശേഷം
  rationale: മൂലപദത്തിന്റെ സാധാരണ അർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ മുഖ്യപാഠത്തിൽ നൽകി; ക്രൈസ്തവ ഉപയോഗത്തിൽ സ്ഥാപിതമായ സാങ്കേതികപദം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. ഇതിലൂടെ പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: αὕτη എന്ന സ്ത്രീലിംഗ നിർദ്ദേശകസർവനാമത്തിന്റെ അവതരണം
  choice: ഇവൾ
  alternative: ഈ സ്ത്രീ
  rationale: മൂലത്തിലെ നിർദ്ദേശകസ്വഭാവവും സ്ത്രീലിംഗവും നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ സൂചിതയായ വ്യക്തി വ്യക്തമായതിനാൽ ‘സ്ത്രീ’ എന്ന നാമം ചേർക്കേണ്ടതില്ല.
- issue: εἰς μνημόσυνον αὐτῆς എന്നതിലെ ലക്ഷ്യവും സ്മാരകഭാവവും
  choice: അവളുടെ ഓർമ്മയ്ക്കായി
  alternative: അവൾക്കുള്ള ഒരു സ്മാരകമായി
  rationale: ഗ്രീക്ക് പ്രയോഗം അനുസ്മരണത്തിന്റെ ഉദ്ദേശ്യത്തെയോ സ്മാരകസ്വഭാവത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ അനുസ്മരണപ്രയോഗം നൽകി, നാമരൂപത്തിലുള്ള സ്മാരകവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. യേശുവിന്റെ ഔപചാരിക പ്രഖ്യാപനത്തിന്റെ ഭാരം നിലനിർത്തിക്കൊണ്ട് വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് തൊട്ടുപിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
