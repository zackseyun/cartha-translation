source:
  edition: SBLGNT
  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: ml
  text: “ദൈവദൂഷണം നിങ്ങൾ കേട്ടല്ലോ. നിങ്ങൾക്ക് എന്തു തോന്നുന്നു?[a]” അവരെല്ലാവരും അവൻ മരണശിക്ഷയ്ക്ക് അർഹനാണെന്ന് വിധിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ വിധി എന്താണ്?”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവൻ മരണത്തിന് ബാധ്യനാണെന്ന് വിധിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: നിങ്ങൾ കേട്ടല്ലോ
  rationale: അവർ ഇപ്പോൾത്തന്നെ കേട്ട വാക്കുകളിലേക്കു മഹാപുരോഹിതൻ ശ്രദ്ധ ക്ഷണിക്കുന്ന സന്ദർഭബലം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τῆς βλασφημίας
  choice: ആ ദൈവദൂഷണം
  rationale: നിർദിഷ്ടമായി ഇപ്പോൾ ഉന്നയിച്ച കുറ്റാരോപണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ നിർദ്ദേശകമായ ‘ആ’ ഉപയോഗിച്ചു; ‘ദൈവദൂഷണം’ മത-നിയമപരമായ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: τί ὑμῖν φαίνεται
  choice: നിങ്ങൾക്ക് എന്തു തോന്നുന്നു?
  rationale: ഗ്രീക്ക് പ്രയോഗം അഭിപ്രായമോ വിധിയോ ചോദിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും മൂലവാചകത്തിന്റെ രൂപത്തോട് അടുത്തതുമായ വിവർത്തനം.
- source_word: πάντες
  choice: അവരെല്ലാവരും
  rationale: πάντες ഊന്നിപ്പറയുന്ന ഏകകണ്ഠത വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: κατέκριναν
  choice: വിധിച്ചു
  rationale: ഇവിടെ പദം പ്രതികൂലമായ ന്യായവിധി പ്രസ്താവിക്കുന്ന നിയമപരമായ അർഥത്തിലാണ്; തുടർന്നുള്ള മരണശിക്ഷാർഹതയോടൊപ്പം ‘വിധിച്ചു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἔνοχον εἶναι θανάτου
  choice: അവൻ മരണശിക്ഷയ്ക്ക് അർഹനാണെന്ന്
  rationale: മരണത്തിന് ബാധ്യനോ മരണദണ്ഡം അർഹിക്കുന്നവനോ ആണെന്ന ന്യായവിധി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ‘മരണത്തിനു കുറ്റക്കാരൻ’ എന്ന അസ്വാഭാവിക അക്ഷരാർഥം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: വിചാരണാസന്ദർഭത്തിലെ βλασφημία എന്ന കുറ്റാരോപണം
  choice: ദൈവദൂഷണം
  alternative: ദൈവത്തെ ദുഷിച്ചുള്ള സംസാരം
  rationale: ഇത് ന്യായസഭ ഉന്നയിക്കുന്ന കുറ്റാരോപണമാണെന്ന ആഖ്യാനപരമായ സംഘർഷം നിലനിർത്തുന്നു; ആരോപണം നീതിയുള്ളതാണെന്ന ആഖ്യാതാവിന്റെ അംഗീകാരം ഇതിൽ ചേർക്കുന്നില്ല.
- issue: ἔνοχον εἶναι θανάτου എന്നതിന്റെ നിയമപരമായ ബലം
  choice: മരണശിക്ഷയ്ക്ക് അർഹനാണെന്ന്
  alternative: മരണത്തിനു ബാധ്യനാണെന്ന്
  rationale: അവർ യേശുവിനെ മരണദണ്ഡത്തിന് അർഹനെന്നു വിധിച്ചതാണ് വാചകം പറയുന്നത്; ശിക്ഷ നടപ്പാക്കിയെന്നോ അന്തിമമായി ശിക്ഷ വിധിച്ചെന്നോ അതിലധികം സൂചിപ്പിക്കാതെ നിയമപരമായ ബലം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. വിചാരണാസന്ദർഭത്തിന്റെ ഔപചാരികത നിലനിർത്തിക്കൊണ്ട് അത്യന്തം അക്ഷരാർഥപരവും അസ്വാഭാവികവുമായ നിയമഭാഷ ഒഴിവാക്കി.
