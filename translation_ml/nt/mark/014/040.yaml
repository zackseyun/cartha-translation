  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: ml
  text: അവൻ വീണ്ടും വന്ന് അവരെ ഉറങ്ങുന്നതായി കണ്ടു; കാരണം, അവരുടെ കണ്ണുകൾ ഭാരപ്പെട്ടിരുന്നു. അവനോട് എന്ത് മറുപടി പറയണമെന്ന് അവർക്കറിയില്ലായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν ἐλθὼν
  choice: വീണ്ടും വന്ന്
  rationale: ആവർത്തിച്ചുള്ള വരവിനെ സൂചിപ്പിക്കുന്ന πάλιν എന്നതും മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള ἐλθών എന്ന ക്രിയാവിശേഷണരൂപവും സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: അവർ ഉറങ്ങുന്നതു കണ്ടു
  rationale: καθεύδοντας സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന ഉറക്കാവസ്ഥയെ മലയാളത്തിലെ സ്വാഭാവികമായ ക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: അവരുടെ കണ്ണുകൾ ഉറക്കഭാരത്താൽ അടഞ്ഞുപോകുകയായിരുന്നു
  rationale: καταβαρυνόμενοι എന്ന പദത്തിലെ ഭാരപ്പെടുന്ന ദൃശ്യബിംബം ‘ഉറക്കഭാരത്താൽ’ എന്നതിലൂടെ നിലനിർത്തുകയും, കണ്ണുകൾ അടഞ്ഞുപോകുന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ സന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ᾔδεισαν
  choice: അവർക്ക് അറിയില്ലായിരുന്നു
  rationale: അറിവില്ലായ്മയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന οἶδα എന്ന ക്രിയയുടെ ലളിതവും കൃത്യവുമായ പരിഭാഷ.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: അവനോട് എന്ത് ഉത്തരം പറയണമെന്ന്
  rationale: അവനിലേക്കു directed ആയ മറുപടിയെയും പരോക്ഷചോദ്യത്തിന്റെ ആശയത്തെയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ വിശദീകരണബന്ധം അർധവിരാമത്തിലൂടെ നിലനിർത്തി; ഉറക്കത്തിന്റെ ഭാരം വ്യക്തമാക്കാൻ ‘ഉറക്കഭാരത്താൽ’ ഉപയോഗിച്ചു.
