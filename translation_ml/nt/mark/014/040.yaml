revisions:
- from: അവൻ വീണ്ടും വന്ന് അവർ ഉറങ്ങുന്നതു കണ്ടു; അവരുടെ കണ്ണുകൾ ഉറക്കഭാരത്താൽ അടഞ്ഞുപോകുകയായിരുന്നു[a]. അവനോട് എന്ത് ഉത്തരം പറയണമെന്ന് അവർക്ക് അറിയില്ലായിരുന്നു.
  to: അവൻ വീണ്ടും വന്ന് അവരെ ഉറങ്ങുന്നതായി കണ്ടു; കാരണം, അവരുടെ കണ്ണുകൾ ഭാരപ്പെട്ടിരുന്നു. അവനോട് എന്ത് മറുപടി പറയണമെന്ന് അവർക്കറിയില്ലായിരുന്നു.
  rationale: The revision replaces the interpretively expanded description of eyes closing with a closer rendering of καταβαρυνόμενοι (“were weighed down/heavy”) and explicitly translates γάρ as “കാരണം.” The footnote retains the alternative sense and explains the Greek image. The footnote anchor is removed from the revised text because the revised wording itself directly reflects the primary lexical sense; the supplied footnote remains available as a lexical alternative without requiring an in-text marker.
