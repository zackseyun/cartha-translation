    issue: ‘പുതുതായി’ for καινόν
    rationale: In current Malayalam, ‘പുതുതായി’ commonly has the temporal sense ‘recently’ or ‘freshly.’ καινόν is an adjective modifying the drink/pronoun and principally expresses newness in quality; it may allow ‘anew,’ but should not be reduced to a temporal adverb. ‘പുതിയതായിട്ട്’ more directly represents the adjective while leaving the precise nature of the newness unspecified.
