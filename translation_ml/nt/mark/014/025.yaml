source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ദൈവരാജ്യത്തിൽ ഞാൻ അത് പുതിയതായിട്ട് കുടിക്കുന്ന ആ ദിവസംവരെ, മുന്തിരിവള്ളിയുടെ ഫലത്തിൽനിന്ന് ഇനി ഒരിക്കലും ഞാൻ കുടിക്കുകയില്ല.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുന്തിരിവള്ളിയുടെ ഫലത്തിൽനിന്ന് ഇനി മേലാൽ ഞാൻ കുടിക്കുകയേയില്ല.” ഗ്രീക്കിൽ അത്യന്തം ഊന്നിയ നിഷേധമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “മുന്തിരിവള്ളിയുടെ ഫലം” എന്നതാണ് ഇവിടത്തെ ഗ്രീക്ക് പ്രയോഗം; അതായത്, ഭക്ഷണവേളയിൽ ഉപയോഗിച്ച മുന്തിരിവള്ളിയിൽനിന്നുള്ള പാനീയം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “വീണ്ടും.” ഗ്രീക്ക് വിശേഷണം “പുതിയത്” എന്ന് അർഥമാക്കാം; ദൈവരാജ്യത്തിലെ ഭാവിയിലെ പുതുമയും അത് സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഗൗരവമുള്ള പ്രഖ്യാപനസൂത്രത്തിന്റെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സുതാര്യവും സ്വാഭാവികവുമായ രൂപം നൽകുന്നു.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: ഇനി ഒരിക്കലും ഞാൻ കുടിക്കുകയില്ല
  rationale: οὐκέτι എന്നതിലെ ‘ഇനി മേലാൽ ഇല്ല’ എന്ന കാലസൂചനയും οὐ μὴ എന്ന ഊന്നിയ ഭാവിനിഷേധവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: മുന്തിരിവള്ളിയുടെ ഫലത്തിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിലുള്ള പാനീയത്തെ ‘വീഞ്ഞ്’ എന്നു കൂടുതൽ പ്രത്യേകമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: ആ ദിവസംവരെ
  rationale: കാലപരിധിയും ἐκείνης എന്ന നിർദേശകത്തിന്റെ ഊന്നലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὅταν αὐτὸ πίνω
  choice: ഞാൻ അത് ... കുടിക്കുന്ന
  rationale: αὐτό മുമ്പ് പറഞ്ഞ മുന്തിരിവള്ളിയുടെ ഫലത്തിൽനിന്നുള്ള പാനീയത്തെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു; ὅταν-നുശേഷമുള്ള ക്രിയയുടെ ഭാവിസൂചന മലയാളത്തിലെ സന്ദർഭം നൽകുന്നു.
- source_word: καινὸν
  choice: പുതുതായി
  rationale: പുതിയ ഗുണമോ അവസ്ഥയോ എന്ന ആശയത്തെയും ‘വീണ്ടും/പുതിയ രീതിയിൽ’ എന്ന സാധ്യതയെയും പൂർണമായി അടച്ചുകളയാതെ മലയാളത്തിൽ വായിക്കാവുന്ന രൂപം.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിൽ
  rationale: പുതിയനിയമത്തിലെ സ്ഥിരമായ ദൈവശാസ്ത്രപരമായ പ്രയോഗം സംക്ഷിപ്തവും കൃത്യവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: καινὸν എന്നതിന്റെ അർഥം
  choice: ‘പുതുതായി’ എന്നു നൽകി, പുതുമയുടെ ഗുണപരമായ അർഥവും വീണ്ടും കുടിക്കൽ എന്ന അർഥസാധ്യതയും തുറന്നുവെച്ചു.
  alternative: വീണ്ടും; പുതിയ ഗുണമുള്ളതായി
  rationale: വാക്യം ആ പുതുമയുടെ സ്വഭാവം വിശദീകരിക്കുന്നില്ല; അതിനാൽ ദൈവരാജ്യത്തിലെ ഭാവിപൂർത്തീകരണത്തെ അതിലധികം നിർവചിക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: ‘മുന്തിരിവള്ളിയുടെ ഫലം’ എന്നതിന്റെ സൂചിതവസ്തു
  choice: മൂലപാഠത്തിലെ ഇടിയം നിലനിർത്തി.
  alternative: വീഞ്ഞ്
  rationale: സന്ദർഭത്തിൽ പാനീയത്തെയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും, ഗ്രീക്ക് നേരിട്ട് ‘വീഞ്ഞ്’ എന്നു പറയുന്നില്ല; അതിനാൽ വിവർത്തനം അനാവശ്യമായി കൂടുതൽ പ്രത്യേകമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘സത്യമായി’, ‘ദൈവരാജ്യം’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി. ഊന്നിയ നിഷേധവും καινὸν എന്നതിലെ ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
