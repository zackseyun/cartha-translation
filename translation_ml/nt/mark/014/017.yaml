translation:
  language: ml
  text: സന്ധ്യയായപ്പോൾ, അവൻ ആ പന്ത്രണ്ടുപേരോടൊപ്പം[a] വരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പന്ത്രണ്ടുപേർ’ ഇവിടെ യേശുവിന്റെ അപ്പൊസ്തലസംഘത്തെ സൂചിപ്പിക്കുന്ന ഒരു സ്ഥിരപ്രയോഗമായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: സന്ധ്യയായപ്പോൾ എന്ന വാക്യാരംഭത്തിൽ പ്രത്യേകം പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഗ്രീക്ക് ആഖ്യാനത്തിലെ സാധാരണ ബന്ധകമാണ്. മലയാളത്തിൽ ‘സന്ധ്യയായപ്പോൾ’ എന്ന കാലസൂചകാരംഭം തന്നെ സംഭവക്രമം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നതിനാൽ ‘പിന്നെ’ എന്ന വ്യാഖ്യാനാത്മക പദം ചേർത്തില്ല.
- source_word: ὀψίας γενομένης
  choice: സന്ധ്യയായപ്പോൾ
  rationale: കാലസാഹചര്യം സൂചിപ്പിക്കുന്ന genitive absolute-ന്റെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു; ‘വന്നു’ എന്ന് ഭൂതകാലത്തിലാക്കി മിനുക്കിയിട്ടില്ല.
- source_word: μετὰ τῶν δώδεκα
  choice: ആ പന്ത്രണ്ടുപേരോടൊപ്പം
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന കൂടെയുണ്ടാകൽ കൃത്യമായി നൽകുന്നു. ‘ആ’ എന്നത് ഗ്രീക്കിലെ നിർദ്ദിഷ്ടതയും സന്ദർഭത്തിൽ അറിയപ്പെടുന്ന യേശുവിന്റെ പന്ത്രണ്ടുപേരടങ്ങിയ സംഘവുമാണെന്ന സൂചനയും നൽകുന്നു; ‘ശിഷ്യന്മാർ’ അല്ലെങ്കിൽ ‘അപ്പൊസ്തലന്മാർ’ എന്ന് മുഖ്യവാചകത്തിൽ വിശദീകരിച്ചിട്ടില്ല.
theological_decisions:
- issue: ‘പന്ത്രണ്ടുപേർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ഈ ഘട്ടത്തിൽ യൂദാസിനെയും ഉൾക്കൊള്ളുന്ന യേശുവിന്റെ അടുത്ത പന്ത്രണ്ടംഗസംഘം
  alternative: ‘പന്ത്രണ്ടു ശിഷ്യന്മാർ’ അല്ലെങ്കിൽ ‘പന്ത്രണ്ടു അപ്പൊസ്തലന്മാർ’ എന്ന് തുറന്നു പറയുക
  rationale: മൂലപാഠം ‘പന്ത്രണ്ടുപേർ’ എന്നു മാത്രം പറയുന്നു. അതിനാൽ സംഘത്തിന്റെ പരിചിതമായ തിരിച്ചറിയൽ നിലനിർത്തിക്കൊണ്ട്, മുഖ്യവാചകത്തിൽ അധിക വ്യാഖ്യാനം ചേർത്തില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘വരുന്നു’ എന്ന ചരിത്രവർത്തമാനകാലം ഗ്രീക്കിന്റെ ആഖ്യാനസജീവത നിലനിർത്തുന്നു. മലയാളത്തിൽ വലിയക്ഷരംകൊണ്ട് സംഘനാമം വേർതിരിക്കാനാകാത്തതിനാൽ അതിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
