lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: പത്രോസ് … ആയിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തോടുകൂടിയ genitive absolute ഇവിടെ പശ്ചാത്തലം നൽകുന്ന കാലസൂചക ഉപവാക്യമാണ്; സ്വാഭാവിക മലയാളത്തിൽ തുടരുന്ന സാഹചര്യത്തെ ഇത് വ്യക്തമാക്കുന്നു.
- source_word: κάτω
  choice: താഴെ
  rationale: താഴ്ന്ന സ്ഥലനിലയെ സൂചിപ്പിക്കുന്ന പദം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν τῇ αὐλῇ
  choice: മുറ്റത്ത്
  rationale: മഹാപുരോഹിതന്റെ വസതിക്കുള്ളിലെ തുറന്ന നടുമുറ്റത്തെയാണ് αὐλή ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആ സന്ദർഭത്തിൽ ‘മുറ്റം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἔρχεται
  choice: അവിടെ വന്നു
  rationale: ഗ്രീക്കിലെ historical present മലയാളകഥനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലമായി നൽകിയിരിക്കുന്നു; ‘അവിടെ’ എന്നത് പത്രോസ് ഉണ്ടായിരുന്ന മുറ്റത്തേക്കുള്ള വരവ് വ്യക്തമാക്കുന്നു.
- source_word: μία τῶν παιδισκῶν
  choice: വേലക്കാരികളിൽ ഒരുവൾ
  rationale: παιδίσκη ഒരു വീട്ടിലെ സ്ത്രീപരിചാരികയെയോ അടിമസ്ത്രീയെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘വേലക്കാരി’ ഉപയോഗിച്ച് നിയമസ്ഥിതിയെ സംബന്ധിച്ച സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ ἀρχιερέως
  choice: മഹാപുരോഹിതന്റെ
  rationale: ജനിറ്റീവ് രൂപം മഹാപുരോഹിതന്റെ വീട്ടുജീവനക്കാരിലൊരാളെന്ന ബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഉടമസ്ഥതാരൂപം അത് സംക്ഷിപ്തമായി നൽകുന്നു.
