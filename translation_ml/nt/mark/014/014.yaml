source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: ml
  text: 'അവൻ എവിടെ പ്രവേശിച്ചാലും, അവിടത്തെ വീട്ടുടമയോടു പറയുക: ‘ഗുരു പറയുന്നു: “എന്റെ ശിഷ്യന്മാരോടൊപ്പം പെസഹ ഭക്ഷിക്കാനുള്ള എന്റെ അതിഥിമുറി[a] എവിടെയാണ്?”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘താമസമുറി’ അല്ലെങ്കിൽ ‘മുറി’; ഗ്രീക്കുപദം താമസിക്കാനുള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ഇവിടെ അത് വാണിജ്യസത്രത്തെക്കാൾ ഒരു സ്വകാര്യവീട്ടിലെ അതിഥിമുറിയായിരിക്കാനാണ് സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: അവൻ ഏതു വീട്ടിൽ പ്രവേശിച്ചാലും
  rationale: ὅπου + ἐάν എന്ന പ്രയോഗത്തിന്റെ അനിശ്ചിത ആപേക്ഷിക അർഥം ‘ഏതു ... ആയാലും’ എന്നു സ്വാഭാവികമായി നൽകുന്നു. സന്ദർഭത്തിൽ പ്രവേശിക്കുന്നത് ഒരു വീടായതിനാൽ ‘വീട്ടിൽ’ എന്നു വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: εἴπατε
  choice: പറയുക
  rationale: രണ്ടു ശിഷ്യന്മാരോടുള്ള ബഹുവചന ആജ്ഞയാണ്; നേരിട്ടുള്ള സംഭാഷണത്തിന് ‘പറയുക’ യോജിക്കുന്നു.
- source_word: οἰκοδεσπότῃ
  choice: വീട്ടുടമയോട്
  rationale: വീടിന്റെയോ കുടുംബത്തിന്റെയോ ചുമതലയുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘വീട്ടുടമ’ ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: Ὁ διδάσκαλος
  choice: ഗുരു
  rationale: യേശുവിനെ തിരിച്ചറിയാവുന്ന അധ്യാപകപദവിയായി സൂചിപ്പിക്കുന്നു; ‘ഗുരു’ സാധാരണ മലയാള ബൈബിൾഭാഷയിലും ആധുനിക പ്രയോഗത്തിലും സ്വാഭാവികമാണ്.
- source_word: λέγει
  choice: ചോദിക്കുന്നു
  rationale: അക്ഷരാർഥം ‘പറയുന്നു’ എന്നാണെങ്കിലും പിന്നാലെ നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ മലയാളത്തിൽ ‘ചോദിക്കുന്നു’ എന്നത് സംഭാഷണപ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κατάλυμά μου
  choice: എന്റെ അതിഥിമുറി
  rationale: സ്വകാര്യവീട്ടിൽ അതിഥികൾക്കായി ഒരുക്കിയ താമസമുറിയെയാണ് ഇവിടെ സാധ്യതയേറിയതായി സൂചിപ്പിക്കുന്നത്; μου എന്ന ഉടമസ്ഥസർവനാമവും നിലനിർത്തുന്നു.
- source_word: τὸ πάσχα
  choice: പെസഹ
  rationale: ഇവിടെ ‘ഭക്ഷിക്കുക’ എന്ന ക്രിയയോടൊപ്പം വരുന്നതിനാൽ പെസഹാഭോജനത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ക്രൈസ്തവപ്രയോഗത്തിൽ ‘പെസഹ’ പരിചിതമാണ്.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: എന്റെ ശിഷ്യന്മാരോടൊപ്പം
  rationale: യേശുവുമായുള്ള പഠന-അനുഗമനബന്ധം μαθηταί എന്ന പദത്തിൽ നിലനിർത്തുന്നു.
- source_word: φάγω
  choice: ഭക്ഷിക്കാനുള്ള
  rationale: സ്ഥലം തേടുന്നതുമായി ബന്ധപ്പെട്ട ഉദ്ദേശ്യത്തെയോ പ്രതീക്ഷിത പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കുന്ന സബ്ജങ്ക്റ്റീവ് ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യഘടനയായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ διδάσκαλος എന്ന സ്വയംസൂചന
  choice: ഗുരു
  alternative: ഉപദേഷ്ടാവ്
  rationale: ഗ്രീക്കിലെ സാധാരണ അധ്യാപകപദവി നിലനിർത്തുന്നു; ‘യജമാനൻ’ പോലുള്ള കൂടുതൽ അധികാരസൂചനയുള്ള പദം ചേർത്ത് അർഥം ശക്തിപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്നതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ നേരിട്ടുള്ള ഉദ്ധരണിക്കുള്ളിലെ ചോദ്യം വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു; ‘അതിഥിമുറി’യെ നിയന്ത്രിക്കുന്ന ഉദ്ദേശ്യഘടനയായി ‘ഭക്ഷിക്കാനുള്ള’ ഉപയോഗിച്ചു.
