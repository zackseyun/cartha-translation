revisions:
- from: പെസഹയും പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവവും വരാൻ രണ്ടു ദിവസം മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ.[a] മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും യേശുവിനെ വഞ്ചനയിലൂടെ പിടികൂടി[c] കൊല്ലാൻ എങ്ങനെ കഴിയുമെന്ന് അന്വേഷിച്ചുകൊണ്ടിരുന്നു.[b]
  to: പെസഹയും പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവവും[b] വരാൻ ഇനി രണ്ടു ദിവസമേ ഉണ്ടായിരുന്നുള്ളൂ.[a] മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും അവനെ വഞ്ചനയിലൂടെ പിടികൂടി[c] എങ്ങനെ കൊല്ലാമെന്ന് അന്വേഷിച്ചുകൊണ്ടിരുന്നു.
  rationale: The revision preserves the draft’s faithful terminology and sense while (1) moving [b] to the expression explained by that note, (2) rendering the Greek pronoun without adding the name, (3) making the temporal phrase more idiomatic, and (4) expressing πῶς as a question of method rather than capability. No disputed textual or theological issue requires further qualification.
