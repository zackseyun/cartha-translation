id: MRK.14.1
reference: Mark 14:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: ml
  text: പെസഹയും പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവവും[b] വരാൻ ഇനി രണ്ടു ദിവസമേ ഉണ്ടായിരുന്നുള്ളൂ.[a] മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും അവനെ വഞ്ചനയിലൂടെ പിടികൂടി[c] എങ്ങനെ കൊല്ലാമെന്ന് അന്വേഷിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘രണ്ടു ദിവസത്തിനു ശേഷം.’ പെസഹയും പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവവും അടുത്തെത്തിയിരുന്നു എന്നാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘പുളിപ്പില്ലാത്തവ’; പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണിത്.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘അറസ്റ്റുചെയ്ത്’; ‘ബലമായി പിടിച്ച്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: …ഉണ്ടായിരുന്നു / …ഇരുന്നു
  rationale: δέയുടെ മൃദുവായ ആഖ്യാനബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ പ്രകടമാക്കുന്നു; ഉറവിടത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: τὸ πάσχα
  choice: പെസഹ
  rationale: യഹൂദ ഉത്സവത്തിന്റെ മലയാളത്തിൽ പരിചിതവും നേരിട്ടുള്ളതുമായ പേര്.
- source_word: τὰ ἄζυμα
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവം
  rationale: അക്ഷരാർഥത്തിൽ ‘പുളിപ്പില്ലാത്തവ’ എന്നാണെങ്കിലും, ഈ ഉത്സവസന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവമാണ്; വായനക്കാർക്കായി സൂചിത നാമം വ്യക്തമാക്കുന്നു.
- source_word: μετὰ δύο ἡμέρας
  choice: വരാൻ രണ്ടു ദിവസം മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ
  rationale: ‘രണ്ടു ദിവസത്തിനു ശേഷം’ എന്ന അക്ഷരാർഥത്തെ, ഉത്സവങ്ങൾ ആസന്നമാണെന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐζήτουν
  choice: അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലത്തിന്റെ തുടർച്ചയായ ശ്രമം നിലനിർത്തുന്നു.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഒരൊറ്റ മഹാപുരോഹിതനെയല്ല, മുൻനിര പുരോഹിത അധികാരികളെയാണ് ബഹുവചനരൂപം സൂചിപ്പിക്കുന്നത്.
- source_word: οἱ γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: നേരിട്ടുള്ളതും മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതവുമായ തുല്യപദം.
- source_word: πῶς
  choice: എങ്ങനെ കഴിയുമെന്ന്
  rationale: അവർ ആലോചിച്ച മാർഗം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: ἐν δόλῳ
  choice: വഞ്ചനയിലൂടെ
  rationale: രഹസ്യത മാത്രമല്ല, ചതിയുടെയും വഞ്ചനയുടെയും ധാർമിക ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: κρατήσαντες
  choice: പിടികൂടി
  rationale: പിടിച്ചെടുക്കുക, കസ്റ്റഡിയിലെടുക്കുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്നു; ‘അറസ്റ്റുചെയ്യുക’ എന്ന ഔദ്യോഗികത മാത്രം നിർബന്ധിക്കാതെ ഉറവിടത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
- source_word: ἀποκτείνωσιν
  choice: കൊല്ലാൻ
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള ശക്തി അലങ്കാരമില്ലാതെ നൽകുന്നു.
theological_decisions:
- issue: പെസഹയും പുളിപ്പില്ലാത്ത അപ്പവും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടു പേരുകളും വേർതിരിച്ച് ‘പെസഹയും പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവവും’ എന്നു നൽകുക
  alternative: ഇവ രണ്ടും ചേർത്ത് ഒരൊറ്റ ഉത്സവനാമമായി നൽകുക
  rationale: മാർക്കോസ് രണ്ടു പ്രയോഗങ്ങളും പ്രത്യേകം പറയുന്നു. അവയുടെ അടുത്ത ബന്ധം അംഗീകരിക്കുമ്പോഴും ഉറവിടത്തിലെ വ്യത്യാസം ഇല്ലാതാക്കുന്നില്ല.
- issue: നേതാക്കളുടെ പദ്ധതിയുടെ ധാർമിക സ്വഭാവം
  choice: ἐν δόλῳ എന്നത് ‘വഞ്ചനയിലൂടെ’ എന്നു വ്യക്തമായി നൽകുക
  alternative: ‘രഹസ്യമായി’ അല്ലെങ്കിൽ ‘ഒളിച്ചുകൊണ്ട്’
  rationale: ഗ്രീക്ക് പദം രഹസ്യതയെക്കാൾ ചതിയെയും വഞ്ചനയെയും സൂചിപ്പിക്കുന്നു; അതിന്റെ ധാർമിക ഭാരം സംരക്ഷിക്കുന്നു.
- issue: κρατήσαντες എന്നതിലെ പിടികൂടൽ/അറസ്റ്റ് സൂക്ഷ്മത
  choice: മുഖ്യവാചകത്തിൽ ‘പിടികൂടി’
  alternative: ‘അറസ്റ്റുചെയ്ത്’ അല്ലെങ്കിൽ ‘ബലമായി പിടിച്ച്’
  rationale: അധികാരികളുടെ കസ്റ്റഡിയിലെടുക്കൽ സന്ദർഭത്തിൽ ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, ഗ്രീക്ക് ക്രിയയുടെ വിശാലത സംരക്ഷിക്കുന്നു; പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പെസഹ’, ‘മുഖ്യപുരോഹിതന്മാർ’, ‘ശാസ്ത്രിമാർ’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്കുകൾക്കരികിൽ ചേർത്തിരിക്കുന്നു; സാംസ്കാരിക അടിക്കുറിപ്പ് [b] ‘പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവം’ എന്ന പ്രയോഗത്തോടാണ് ആശയപരമായി ബന്ധപ്പെട്ടിരിക്കുന്നത്.
