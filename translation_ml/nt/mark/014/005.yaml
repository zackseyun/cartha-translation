translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള ഉദ്ധരണിയുടെ സമാപനം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘എന്ന് അവർ പറഞ്ഞു’ ചേർത്തിരിക്കുന്നു; ഇത് ഗ്രീക്കിൽ അന്തർലീനമായ സംസാരപ്രവൃത്തിയെ വെളിപ്പെടുത്തുന്നു. ‘ദിനാർ’ ചരിത്രനാണയനാമമായി നിലനിർത്തി.
