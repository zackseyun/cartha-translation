  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: ml
  text: “കാരണം, ഈ സുഗന്ധതൈലം മുന്നൂറ് ദിനാറിലധികം വിലയ്ക്ക് വിറ്റ് ദരിദ്രർക്കു കൊടുക്കാമായിരുന്നല്ലോ!” എന്ന് അവർ പറഞ്ഞു. അവർ അവളെ കഠിനമായി ശകാരിച്ചു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സുഗന്ധതൈലം” എന്നതിന് “സുഗന്ധലേപനം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “കഠിനമായി ശകാരിച്ചു” എന്നതിന് “കടുത്ത ഭാഷയിൽ കുറ്റപ്പെടുത്തി” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ ശക്തമായ അതൃപ്തിയോ കടുത്ത ശാസനയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: സുഗന്ധതൈലം
  rationale: സുഗന്ധമുള്ള വിലയേറിയ തൈലമോ ലേപനവസ്തുവോ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἠδύνατο ... πραθῆναι
  choice: വിൽക്കാമായിരുന്നല്ലോ
  rationale: നടപ്പാകാതെ പോയ സാധ്യതയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കർത്തൃരഹിതമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: മുന്നൂറിലധികം ദിനാറിന്
  rationale: ἐπάνωയുടെ ‘കവിഞ്ഞ്’ എന്ന അളവുസൂചനയും പുരാതന നാണയത്തിന്റെ ചരിത്രപരമായ പേരും സംരക്ഷിക്കുന്നു.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: ദരിദ്രർക്കു കൊടുക്കാമായിരുന്നു
  rationale: ദരിദ്രരെ ഒരു സാമൂഹിക വിഭാഗമായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ലളിതവും വിശ്വസ്തവുമായ പരിഭാഷ.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: അവളെ കഠിനമായി ശകാരിച്ചു
  rationale: ക്രിയയിൽ അടങ്ങിയിരിക്കുന്ന ശക്തമായ അതൃപ്തിയും നേരിട്ടുള്ള കടുത്ത വാക്കുതാക്കീതും പ്രകടമാക്കുന്നു.
- source_word: γὰρ
  choice: -ല്ലോ
  rationale: മുൻവാക്യത്തിലെ പരാതിക്കുള്ള വിശദീകരണമോ ന്യായീകരണമോ സംഭാഷണസഹജമായി അടയാളപ്പെടുത്തുന്നു.
