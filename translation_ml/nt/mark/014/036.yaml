  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: ml
  text: 'അവൻ ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു[a]: “അബ്ബാ[b], പിതാവേ, അങ്ങേക്ക് എല്ലാം സാധ്യമാണ്. ഈ പാനപാത്രം[c] എന്നിൽനിന്ന് നീക്കണമേ. എങ്കിലും ഞാൻ ഇച്ഛിക്കുന്നതല്ല, അങ്ങ് ഇച്ഛിക്കുന്നതു തന്നെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവൻ പറഞ്ഞു.” ഗ്രീക്കിലെ അപൂർണഭൂതകാലം തുടർന്നോ ആവർത്തിച്ചോ പറഞ്ഞതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “അബ്ബാ” എന്നത് പിതാവിനെ അഭിസംബോധന ചെയ്യാനുള്ള ഒരു അരമായ പദമാണ്; അതിനോടൊപ്പം ഗ്രീക്കിലുള്ള “പിതാവേ” എന്നതും മൂലപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: “പാനപാത്രം” ഇവിടെ അവനുവേണ്ടി നിശ്ചയിക്കപ്പെട്ട കഷ്ടാനുഭവത്തിന്റെ ബൈബിൾരൂപകമാണ്; മർക്കോസ് 10:38 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർന്നോ ആവർത്തിച്ചോ നടന്ന സംസാരത്തെ സൂചിപ്പിക്കാം; മലയാളത്തിലെ ഈ പ്രയോഗം ആ കാലഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Αββα ὁ πατήρ
  choice: അബ്ബാ, പിതാവേ
  rationale: അരമായ അഭിസംബോധനയായ ‘അബ്ബാ’ അതേപടി നിലനിർത്തുകയും പിന്നാലെയുള്ള ഗ്രീക്ക് വിശദീകരണത്തെ ‘പിതാവേ’ എന്ന നേരിട്ടുള്ള അഭിസംബോധനയായി നൽകുകയും ചെയ്യുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘എന്റെ’ ചേർത്തിട്ടില്ല.
- source_word: πάντα δυνατά σοι
  choice: അങ്ങേക്ക് എല്ലാം സാധ്യമാണ്
  rationale: സമഗ്രമായ അർഥവ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: παρένεγκε
  choice: നീക്കണമേ
  rationale: പാനപാത്രം തന്നിൽനിന്ന് അകറ്റണമെന്ന അപേക്ഷയെ മലയാള പ്രാർഥനാസന്ദർഭത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: τὸ ποτήριον τοῦτο
  choice: ഈ പാനപാത്രം
  rationale: വരാനിരിക്കുന്ന കഷ്ടാനുഭവത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾരൂപകം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπ’ ἐμοῦ
  choice: എന്നിൽനിന്ന്
  rationale: അകറ്റലിന്റെ ഉറവിടമോ സ്ഥാനമോ സൂചിപ്പിക്കുന്ന ἀπόയുടെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: എങ്കിലും ഞാൻ ഇച്ഛിക്കുന്നതല്ല, അങ്ങ് ഇച്ഛിക്കുന്നതു തന്നെ
  rationale: θέλωയുടെ ഇച്ഛയെന്ന ഭാരം നിലനിർത്തുന്നു; ഗ്രീക്കിലെ രണ്ടാം ഖണ്ഡത്തിൽ വിട്ടുപോയിരിക്കുന്ന ക്രിയ മലയാളത്തിലും അനാവശ്യമായി വികസിപ്പിക്കാതെ വിരുദ്ധസമാന്തരത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ അരമായയും ഗ്രീക്കും ഒരുമിച്ച് വരുന്നത്
  choice: അബ്ബാ, പിതാവേ
  alternative: അബ്ബാ, എന്റെ പിതാവേ
  rationale: മൂലപാഠം അരമായ അഭിസംബോധനയും അതിന്റെ ഗ്രീക്ക് വിശദീകരണവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു. ‘എന്റെ’ എന്നു ചേർക്കുന്നത് ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ഉടമസ്ഥസൂചന ഇറക്കുമതി ചെയ്യുന്നതിനാൽ ഒഴിവാക്കി.
- issue: ‘പാനപാത്രം’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: ഈ പാനപാത്രം
  alternative: ഈ കഷ്ടാനുഭവം
  rationale: സന്ദർഭത്തിൽ അത് യേശുവിന് നിശ്ചയിക്കപ്പെട്ട കഷ്ടാനുഭവത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, രൂപകം നേരിട്ട് വ്യാഖ്യാനിച്ചു മാറ്റാതെ അതിന്റെ തിരുവെഴുത്താന്തരബന്ധവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
- issue: യേശുവിന്റെ ഇച്ഛയും പിതാവിന്റെ ഇച്ഛയും തമ്മിലുള്ള വിരുദ്ധസമാന്തരത
  choice: ഞാൻ ഇച്ഛിക്കുന്നതല്ല, അങ്ങ് ഇച്ഛിക്കുന്നതു തന്നെ
  alternative: എന്റെ ഇഷ്ടമല്ല, അങ്ങയുടെ ഇഷ്ടം നടക്കട്ടെ
  rationale: മൂലത്തിലെ τίയും θέλωയും പ്രതിഫലിപ്പിക്കുകയും ‘നടക്കട്ടെ’ പോലുള്ള വ്യക്തമല്ലാത്ത ക്രിയ ചേർത്ത് വാക്യത്തിന്റെ തുറന്ന ഘടനയെ അമിതമായി പരിഹരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സ്വാഭാവികവുമായ പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്/അങ്ങേക്ക്’ സ്വീകരിച്ചു; അത്യന്തം പുരാതനമായ പദപ്രയോഗങ്ങളും വിഭാഗീയ സവിശേഷതകളും ഒഴിവാക്കി. മൂലത്തിലെ രൂപകവും അവസാന ഖണ്ഡത്തിലെ സംക്ഷിപ്തതയും പരമാവധി നിലനിർത്തി.
