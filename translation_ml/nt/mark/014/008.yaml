  text: ὃ ⸀ἔσχεν ἐποίησεν, προέλαβεν μυρίσαι ⸂τὸ σῶμά μου⸃ εἰς τὸν ἐνταφιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: ml
  text: അവൾക്കു കഴിയുന്നത് അവൾ ചെയ്തു[a]; എന്റെ ശരീരത്തിൽ ശവസംസ്കാരത്തിനായി അവൾ മുൻകൂട്ടി സുഗന്ധതൈലം പുരട്ടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവൾക്കുണ്ടായിരുന്നത് അവൾ ചെയ്തു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: അവൾക്കു കഴിയുന്നതു അവൾ ചെയ്തു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവൾക്കുണ്ടായിരുന്നത് അവൾ ചെയ്തു’ എന്നാകാമെങ്കിലും, ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം അവൾ തന്റെ കഴിവിനൊത്തതു ചെയ്തു എന്നതാണ്. മുഖ്യവാചകം ഈ പ്രയോഗാർഥം നൽകുകയും അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: προέλαβεν
  choice: മുൻകൂട്ടി
  rationale: സംസ്കാരത്തിനു മുമ്പേ ഈ പ്രവൃത്തി ചെയ്തുവെന്ന കാലപരമായ മുൻകൂർഭാവം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ചലനാർഥം ചേർക്കുന്നില്ല.
- source_word: μυρίσαι
  choice: സുഗന്ധതൈലം പൂശി
  rationale: μυρίζω ഇവിടെ സുഗന്ധദ്രവ്യമോ തൈലമോ ശരീരത്തിൽ പുരട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അഭിഷേകം ചെയ്തു’ എന്നതിനേക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സംസ്കാരത്തിനുള്ള ഒരുക്കത്തിന്റെ സാഹചര്യത്തിന് യോജിച്ചതുമാണ്.
- source_word: τὸ σῶμά μου
  choice: എന്റെ ശരീരം
  rationale: മൂലപദസമുച്ചയത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക പരിഭാഷ.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: സംസ്കാരത്തിനായി
  rationale: അടക്കം ചെയ്യുന്നതിനുള്ള ഒരുക്കം എന്ന ഉദ്ദേശ്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഈ ഉപവാക്യത്തിൽ പ്രത്യേകം പറയാത്ത സ്ത്രീലിംഗ കർത്താവിനെ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കണോ
  choice: ‘അവൾ’ എന്നു വ്യക്തമാക്കി
  alternative: കർത്താവിനെ ആവർത്തിക്കാതെ ക്രിയാരൂപം മാത്രം ഉപയോഗിക്കുക
  rationale: ഗ്രീക്ക് ക്രിയകൾ മൂന്നാംപുരുഷ ഏകവചനമാണെങ്കിലും ഉടൻമുമ്പുള്ള സന്ദർഭം സ്ത്രീയെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു. സ്വാഭാവികവും ആശയക്കുഴപ്പമില്ലാത്തതുമായ മലയാളത്തിനായി ‘അവൾ’ ചേർക്കുന്നത് പുതിയ ദൈവശാസ്ത്രവിവരം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: προέλαβεν എന്നതിൽ ചലനാർഥം ഉൾപ്പെടുത്തണോ
  choice: മുൻകൂട്ടി ചെയ്ത പ്രവൃത്തി എന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി
  alternative: ‘അവൾ മുൻകൂട്ടി വന്നു’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: ഇവിടെ ക്രിയ മുൻകാല പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ‘വന്നു’ എന്ന ചലനാർഥം മൂലത്തിൽ നിർബന്ധിതമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘സുഗന്ധതൈലം പൂശി’ എന്നത് സംസ്കാരത്തിനുള്ള ശരീരസജ്ജീകരണത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു; ‘സംസ്കാരം’ ഇവിടെ ശവസംസ്കാരം/അടക്കം എന്ന സന്ദർഭാർഥത്തിലാണ്.
