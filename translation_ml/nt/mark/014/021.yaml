id: MRK.14.21
reference: Mark 14:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: ml
  text: കാരണം, മനുഷ്യപുത്രൻ തന്നെക്കുറിച്ച് എഴുതിയിരിക്കുന്നതുപോലെ പോകുന്നു; എന്നാൽ ആരിലൂടെ മനുഷ്യപുത്രൻ ഒറ്റിക്കൊടുക്കപ്പെടുന്നുവോ, ആ മനുഷ്യന് കഷ്ടം! ആ മനുഷ്യൻ ജനിക്കാതിരുന്നെങ്കിൽ അവന് നന്നായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ആരിലൂടെ മനുഷ്യപുത്രൻ കൈമാറപ്പെടുന്നുവോ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: സന്ദർഭത്തിൽ പ്രത്യേക ബന്ധകപദമില്ലാതെ
  rationale: മുൻവാക്യത്തിന്റെ വിശദീകരണം തുടരുന്ന ὅτι മലയാളത്തിൽ നിർബന്ധമായി ‘എന്തെന്നാൽ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്ഥിരമായ സ്വയംവിശേഷണം അക്ഷരാർഥത്തോടെയും ദാനീയേൽസംബന്ധമായ അനുരണനസാധ്യതയോടെയും നിലനിർത്തുന്നു.
- source_word: ὑπάγει
  choice: പോകുന്നു
  rationale: നിയുക്തമായ അന്തിമഫലത്തിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലരൂപം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: തന്നെക്കുറിച്ച് എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: καθώς എന്ന താരതമ്യബലവും γέγραπται എന്ന നിലനിൽക്കുന്ന ലിഖിതസാക്ഷ്യത്തിന്റെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: οὐαὶ
  choice: അയ്യോ കഷ്ടം!
  rationale: പ്രവാചകീയമായ ദുഃഖപ്രഖ്യാപനവും വിധിയുടെ ഗൗരവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി എത്തിക്കുന്നു.
- source_word: δι’ οὗ
  choice: ഒറ്റിക്കൊടുക്കുന്ന
  rationale: διάയുടെ ഏജൻസിബന്ധം മലയാളത്തിലെ ക്രിയാപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: παραδίδοται
  choice: ഒറ്റിക്കൊടുക്കുന്ന
  rationale: യൂദാസിന്റെ വഞ്ചനയാണ് അടിയന്തര സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ ഈ പദം ധാർമ്മികവും സംഭവപരവുമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: ജനിക്കാതിരുന്നെങ്കിൽ അവന് നന്നായിരുന്നു
  rationale: വസ്തുതാവിരുദ്ധമായ വിലയിരുത്തൽ മലയാളത്തിൽ സ്വാഭാവികമായ ഉപാധിവാക്യമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: παραδίδοται എന്ന പദത്തിന്റെ പീഡാനുഭവസന്ദർഭത്തിലെ അർഥം
  choice: ഒറ്റിക്കൊടുക്കുന്ന
  alternative: കൈമാറപ്പെടുന്ന / ഏല്പിക്കപ്പെടുന്ന
  rationale: ഉടൻസന്ദർഭത്തിൽ യൂദാസിന്റെ വഞ്ചന മുൻനിൽക്കുന്നതിനാൽ ‘ഒറ്റിക്കൊടുക്കുന്ന’ വ്യക്തമാണ്; അതേസമയം ദൈവിക പദ്ധതിയുമായി ബന്ധപ്പെട്ട വിപുലമായ ‘കൈമാറൽ’ അർഥം പൂർണമായി നിഷേധിക്കുന്നില്ല.
- issue: ദൈവിക പദ്ധതിയും മനുഷ്യന്റെ ഉത്തരവാദിത്വവും
  choice: എഴുതിയിരിക്കുന്നതുപോലെ പോകുന്നു; എന്നാൽ ... ആ മനുഷ്യന് അയ്യോ കഷ്ടം
  alternative: ഒരുവശം മാത്രം ഊന്നുന്ന വ്യാഖ്യാനപരമായ പുനരാഖ്യാനം
  rationale: തിരുവെഴുത്തനുസൃതമായ മനുഷ്യപുത്രന്റെ യാത്രയും ഒറ്റിക്കൊടുക്കുന്നവന്റെ ഉത്തരവാദിത്വവും ഒരുപോലെ നിലനിർത്തി മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളം; ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘മനുഷ്യപുത്രൻ’ എന്ന സ്ഥാപിത ബൈബിൾപദവും ‘അയ്യോ കഷ്ടം’ എന്ന പ്രവാചകീയ പ്രഖ്യാപനശൈലിയും നിലനിർത്തി.
