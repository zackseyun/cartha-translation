revisions:
- from: മനുഷ്യപുത്രൻ തന്നെക്കുറിച്ച് എഴുതിയിരിക്കുന്നതുപോലെ പോകുന്നു; എന്നാൽ മനുഷ്യപുത്രനെ ഒറ്റിക്കൊടുക്കുന്ന ആ മനുഷ്യന് അയ്യോ കഷ്ടം! ആ മനുഷ്യൻ ജനിക്കാതിരുന്നെങ്കിൽ അവന് നന്നായിരുന്നു.
  to: കാരണം, മനുഷ്യപുത്രൻ തന്നെക്കുറിച്ച് എഴുതിയിരിക്കുന്നതുപോലെ പോകുന്നു; എന്നാൽ ആരിലൂടെ മനുഷ്യപുത്രൻ ഒറ്റിക്കൊടുക്കപ്പെടുന്നുവോ, ആ മനുഷ്യന് കഷ്ടം! ആ മനുഷ്യൻ ജനിക്കാതിരുന്നെങ്കിൽ അവന് നന്നായിരുന്നു.[a]
  rationale: The revision restores the explanatory force of ὅτι, represents διὰ with the agent expression 'ആരിലൂടെ,' and preserves the passive force of παραδίδοται. It maintains the source's tension between what is written concerning the Son of Man and the woe pronounced on the betrayer. The lexical footnote records the broader 'handed over' sense of παραδίδωμι. The footnote anchor is placed at the end of the sentence containing the relevant clause, which is acceptable Malayalam Bible-note practice.
