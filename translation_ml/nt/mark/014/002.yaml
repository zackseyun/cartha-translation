    text: അഥവാ, “ജനങ്ങളുടെ ഇടയിൽ.” ഗ്രീക്കിലെ τοῦ λαοῦ എന്ന ഷഷ്ഠീവിഭക്തി, കലഹം ജനങ്ങളിൽനിന്ന് ഉയരുമെന്നോ ജനങ്ങളുടെ ഇടയിൽ ഉണ്ടാകുമെന്നോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
