  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγον ⸀γάρ· Μὴ ἐν τῇ ἑορτῇ, μήποτε ⸂ἔσται θόρυβος⸃ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: ml
  text: 'എന്തെന്നാൽ, അവർ പറഞ്ഞുകൊണ്ടിരുന്നു: “പെരുന്നാൾകാലത്ത് വേണ്ട; എങ്ങാനും ജനങ്ങളിൽനിന്ന് ഒരു കലഹം ഉണ്ടായേക്കാം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ സംസാരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ കാര്യത്തിന് വിശദീകരണം നൽകുന്ന ബന്ധകശക്തി വ്യക്തമാക്കുന്നു.
- source_word: Μὴ
  choice: വേണ്ട
  rationale: ‘അതു ചെയ്യരുത്’ എന്ന അന്തർലീനമായ ആശയം ചുരുക്കത്തിൽ അവതരിപ്പിക്കുന്ന ഗ്രീക്കിലെ അപൂർണ നിഷേധപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐν τῇ ἑορτῇ
  choice: പെരുന്നാളിനിടെ
  rationale: ἐν എന്നതിന്റെ കാലസൂചക അർഥവും ഉത്സവകാലയളവിനുള്ള സൂചനയും വ്യക്തമായി നൽകുന്നു.
- source_word: μήποτε
  choice: അല്ലെങ്കിൽ
  rationale: ഭയപ്പെടുന്ന സാധ്യതാപരമായ ഫലം അവതരിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἔσται
  choice: ഉണ്ടായേക്കാം
  rationale: ഭാവിയിൽ സംഭവിക്കാമെന്ന ആശങ്കയെ സാധ്യതാഭാവത്തോടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: θόρυβος
  choice: കലഹം
  rationale: ശബ്ദകോലാഹലത്തോടുകൂടിയ പൊതുക്രമക്കേടിനെ സൂചിപ്പിക്കുന്നു; ‘ലഹള’യേക്കാൾ കുറച്ച് അതിശയോക്തിയോടെ സാഹചര്യത്തിലെ സംഘർഷസാധ്യത അറിയിക്കുന്നു.
- source_word: τοῦ λαοῦ
  choice: ജനങ്ങളിൽനിന്ന്
  rationale: ഷഷ്ഠീവിഭക്തി കലഹത്തിന്റെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നുവെന്ന പ്രധാന വായന നിലനിർത്തുന്നു; ജനങ്ങളുടെ ഇടയിൽ സംഭവിക്കുക എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ഗ്രീക്കിലെ ചുരുക്കമുള്ള ആലോചനാഭാഷ ‘പെരുന്നാളിനിടെ വേണ്ട’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു; ഷഷ്ഠീവിഭക്തിയിലെ യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
