    rationale: ‘...സമയത്ത്’ is redundant after an imperfect-background expression; ‘ബലിയർപ്പിച്ചുകൊണ്ടിരുന്നപ്പോൾ’ is smoother and preserves the ongoing aspect.
  - severity: low
