  terminology: ‘പുളിപ്പില്ലാത്ത അപ്പം,’ ‘പെസഹാക്കുഞ്ഞാട്,’ and ‘പെസഹാഭക്ഷണം’ are appropriate modern-standard Malayalam terms. The distinct contextual senses of πάσχα are maintained, and the lexical-alternative footnote remains correctly anchored after the sacrificial clause.
