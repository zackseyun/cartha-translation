id: MRK.14.12
reference: Mark 14:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: ml
  text: 'പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഒന്നാം ദിവസം, പെസഹാക്കുഞ്ഞാടിനെ ബലിയർപ്പിച്ചുകൊണ്ടിരുന്നപ്പോൾ,[a] അവന്റെ ശിഷ്യന്മാർ അവനോട് ചോദിച്ചു: “നീ പെസഹാഭക്ഷണം കഴിക്കാനായി ഞങ്ങൾ എവിടെ പോയി ഒരുക്കണമെന്നാണ് നീ ആഗ്രഹിക്കുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ പെസഹാ ബലിയർപ്പിച്ചപ്പോൾ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “പെസഹാ” എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് ബലിയർപ്പിക്കപ്പെട്ട പെസഹാക്കുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഒന്നാം ദിവസം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയെ സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘പെരുന്നാൾ’ എന്ന പദം പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: പെസഹാക്കുഞ്ഞാടിനെ ബലിയർപ്പിച്ചിരുന്ന സമയത്ത്
  rationale: θύω എന്ന ‘ബലിയർപ്പിക്കുക’ ക്രിയയോടൊപ്പം πάσχα ഇവിടെ ബലിമൃഗമായ പെസഹാക്കുഞ്ഞാടിനെയാണ് സൂചിപ്പിക്കുന്നത്. അപൂർണ്ണ ഭൂതകാലമായ ἔθυον പ്രവൃത്തി നടന്നുകൊണ്ടിരുന്ന പശ്ചാത്തലം പ്രകടമാക്കുന്നു.
- source_word: λέγουσιν
  choice: ചോദിച്ചു
  rationale: ചരിത്രവർത്തമാനകാലത്തെ സ്വാഭാവിക മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമാക്കി. തുടർന്നുള്ള വാക്കുകൾ ചോദ്യമായതിനാൽ ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ‘ചോദിച്ചു’ സന്ദർഭോചിതമാണ്.
- source_word: Ποῦ θέλεις
  choice: എവിടെ ... എന്നാണ് നീ ആഗ്രഹിക്കുന്നത്
  rationale: θέλω ആഗ്രഹമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ചോദ്യം സ്വാഭാവികമായി ഒഴുകുന്ന വിധത്തിലാണ് ഘടന.
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: ഞങ്ങൾ എവിടെ പോയി ഒരുക്കണം
  rationale: പോയതിനുശേഷം ഒരുക്കുക എന്ന പ്രവൃത്തിക്രമം നിലനിർത്തിക്കൊണ്ട് കൃതന്തത്തെ സ്വാഭാവിക മലയാള ക്രിയാശൃംഖലയാക്കി.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: നീ പെസഹാഭക്ഷണം കഴിക്കേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യബന്ധം ‘കഴിക്കേണ്ടതിന്’ എന്നു പ്രകടമാക്കുന്നു. ഇവിടെ πάσχα ബലിയർപ്പിക്കപ്പെടുന്ന മൃഗത്തെയല്ല, കഴിക്കുന്ന പെസഹാഭക്ഷണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: വാക്യത്തിലെ πάσχα എന്ന പദത്തിന്റെ രണ്ടു പ്രയോഗങ്ങളുടെ സൂചന
  choice: ആദ്യത്തേത് ബലിമൃഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പെസഹാക്കുഞ്ഞാട്’; രണ്ടാമത്തേത് ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പെസഹാഭക്ഷണം’
  alternative: രണ്ടിടത്തും ‘പെസഹാ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക
  rationale: 'ഓരോ പ്രയോഗത്തിന്റെയും സമീപക്രിയയാണ് അർത്ഥനിറം നിർണയിക്കുന്നത്: θύωയോടൊപ്പം ബലിമൃഗവും φάγῃςയോടൊപ്പം ഭക്ഷണവും. ഇത് ദൈവശാസ്ത്രപരമായ സമന്വയമല്ല, സന്ദർഭാധിഷ്ഠിതമായ പദാർഥവ്യക്തീകരണമാണ്.'
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സഭാപാരമ്പര്യത്തിൽ പരിചിതമായ ‘പെസഹാ’ നിലനിർത്തിയെങ്കിലും അതിന്റെ രണ്ടു സന്ദർഭാർഥങ്ങളും സാധാരണ വായനക്കാർക്കായി വ്യക്തമാക്കിയിരിക്കുന്നു.
