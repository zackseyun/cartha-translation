id: MRK.14.23
reference: Mark 14:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: ml
  text: അവൻ ഒരു പാനപാത്രം[a] എടുത്ത് നന്ദി പറഞ്ഞശേഷം അവർക്കു കൊടുത്തു; എല്ലാവരും അതിൽനിന്നു കുടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആ പാനപാത്രം.’ ഗ്രീക്കിൽ ‘പാനപാത്രം’ എന്നതിന് നിർദേശക ഉപപദമില്ല; എന്നാൽ ഭക്ഷണസന്ദർഭം ഒരു പ്രത്യേക പാനപാത്രത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: എടുത്ത്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള അനുബന്ധപ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാള ക്രിയാവിനയെച്ചിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: ποτήριον
  choice: ഒരു പാനപാത്രം
  rationale: ഗ്രീക്കിൽ നിർദേശക ഉപപദമില്ലാത്തതിനാൽ ‘ഒരു പാനപാത്രം’ എന്നത് രൂപപരമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; സന്ദർഭം ഒരു പ്രത്യേക പാത്രത്തെ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: εὐχαριστήσας
  choice: നന്ദി പറഞ്ഞശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പായി നടന്ന നന്ദിപറച്ചിൽ വ്യക്തമായി അറിയിക്കുന്നു; പിൽക്കാല ആരാധനാക്രമപരമായ സാങ്കേതികപദങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: ἔδωκεν αὐτοῖς
  choice: അവർക്കു കൊടുത്തു
  rationale: മുമ്പ് പറഞ്ഞ പാനപാത്രം തന്നെയാണ് കൊടുത്തതെന്ന് മലയാളത്തിൽ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ അധിക സർവനാമം ആവശ്യമില്ല.
- source_word: ἔπιον
  choice: കുടിച്ചു
  rationale: അയോറിസ്റ്റ് ക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാള സമാനപദം.
- source_word: ἐξ αὐτοῦ
  choice: അതിൽനിന്നു
  rationale: നപുംസകലിംഗ സർവനാമം പാനപാത്രത്തിലേക്കാണ് മടങ്ങിച്ചൂണ്ടുന്നത്; മലയാളത്തിൽ ‘അതിൽനിന്നു’ അത് വ്യക്തമായി പറയുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: ഓരോരുത്തരും കുടിച്ചു എന്ന ഊന്നൽ ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: εὐχαριστήσας എന്ന പദത്തിന്റെ കുർബാനാസംബന്ധമായ സാധ്യത
  choice: നന്ദി പറഞ്ഞശേഷം
  alternative: ആശീർവദിച്ചശേഷം; കൃതജ്ഞതാസ്തോത്രം ചൊല്ലിയശേഷം
  rationale: εὐχαριστέω നേരിട്ട് നന്ദി പറയുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിന്റെ പിൽക്കാല കൂദാശാപരമായ പ്രാധാന്യം അംഗീകരിക്കാമെങ്കിലും അതിനെ വിവർത്തനത്തിൽ സാങ്കേതിക ആരാധനാപദമായി മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘പാനപാത്രം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും തിരുവെഴുത്തിന്റെ ഗൗരവത്തിനു യോജിച്ചതുമാണ്; ക്രിയകളുടെ ക്രമം ഗ്രീക്ക് വാക്യത്തിലെ സംഭവക്രമം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
