  yaml_path: translation/nt/mark/014/052.yaml
  text: But he left the linen cloth behind and fled naked[a][b].
translation:
  language: ml
  text: എന്നാൽ അവൻ ആ ലിനൻ തുണി വിട്ടുകളഞ്ഞ് നഗ്നനായി ഓടിപ്പോയി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ലിനൻ തുണി” (σινδόνα) എന്നതിന് “ലിനൻ വിരി” എന്നോ “ലിനൻ വസ്ത്രം” എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: “നഗ്നനായി” (γυμνός) എന്ന പദത്തിന് ചില സന്ദർഭങ്ങളിൽ “വേണ്ടത്ര വസ്ത്രമില്ലാതെ” എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ അവൻ ആ വസ്ത്രം ഇല്ലാതെ രക്ഷപ്പെട്ടുവെന്നതാണ് നേരിട്ടുള്ള അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പിടിച്ചുവെക്കാനുള്ള ശ്രമവും യുവാവിന്റെ രക്ഷപ്പെടലും തമ്മിലുള്ള ലഘുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: καταλιπὼν
  choice: ഉപേക്ഷിച്ച്
  rationale: വസ്ത്രം അവിടെ വിട്ടുകളഞ്ഞ ശേഷമുള്ള രക്ഷപ്പെടലിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: σινδόνα
  choice: ചണവസ്ത്രം
  rationale: σινδών എന്നത് ചണനൂൽകൊണ്ടുള്ള തുണിയെയോ ശരീരത്തിൽ ചുറ്റിയ വസ്ത്രത്തെയോ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ ധരിച്ചിരുന്നതായതിനാൽ ‘ചണവസ്ത്രം’ സ്വാഭാവികമാണ്, എന്നാൽ അതിന്റെ കൃത്യരൂപം നിർണയിക്കുന്നില്ല.
- source_word: γυμνὸς
  choice: നഗ്നനായി
  rationale: ഇവിടെ വസ്ത്രം വിട്ടുകളഞ്ഞ് രക്ഷപ്പെടുന്നതാണ് നേരിട്ടുള്ള സന്ദർഭം; അതിനാൽ പദത്തിന്റെ പ്രാഥമിക അർഥം നിലനിർത്തുന്നു.
- source_word: ἔφυγεν
  choice: ഓടിപ്പോയി
  rationale: φεύγω സൂചിപ്പിക്കുന്ന അടിയന്തരമായ പലായനം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ചണവസ്ത്രം’ വസ്തുവിന്റെ സ്വഭാവം സൂചിപ്പിക്കുമ്പോഴും അതിന്റെ കൃത്യമായ രൂപം അമിതമായി നിർവചിക്കുന്നില്ല.
