  terminology: Replace “ചണവസ്ത്രം” and its footnote alternatives because they risk identifying the fabric as jute/hemp rather than linen. The rendering “നഗ്നനായി” is appropriate here; the explanatory footnote preserves the relevant semantic nuance without weakening the immediate contextual sense.
