- from: 'എന്നാൽ പത്രോസ് അവനോടു പറഞ്ഞു: “എല്ലാവരും ഇടറിപ്പോയാലും[a], ഞാൻ ഇടറിപ്പോകില്ല.”'
  to: 'എന്നാൽ പത്രോസ് അവനോടു പറഞ്ഞു: “എല്ലാവരും ഇടറിപ്പോയാലും[a], ഞാനോ ഇടറിപ്പോകില്ല.”'
