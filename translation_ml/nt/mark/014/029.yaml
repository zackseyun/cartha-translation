id: MRK.14.29
reference: Mark 14:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസ് അവനോടു പറഞ്ഞു: “എല്ലാവരും ഇടറിപ്പോയാലും[a], ഞാനോ ഇടറിപ്പോകില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇടറിയാലും” അല്ലെങ്കിൽ “ഇടറാൻ ഇടയായാലും.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഇടറുക, ഇടറാൻ ഇടയാകുക, വിരക്തനാകുക, പിന്മാറുക എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: യേശുവിന്റെ മുൻപ്രവചനത്തോടുള്ള പത്രോസിന്റെ എതിർപ്രതികരണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἔφη αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സാധാരണ സംഭാഷണക്രിയയും യേശുവിനെ സൂചിപ്പിക്കുന്ന സർവനാമവും നിലനിർത്തുന്നു.
- source_word: Εἰ καὶ πάντες
  choice: എല്ലാവരും ... പോയാലും
  rationale: സോപാധിക-വിട്ടുവീഴ്ചാഭാവമുള്ള പ്രയോഗത്തിന്റെ ‘even if all’ എന്ന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: σκανδαλισθήσονται
  choice: ഇടറിപ്പോയാലും
  rationale: ശാരീരിക ഇടർച്ച മാത്രമല്ല, പരീക്ഷണത്തിൽ പരാജയപ്പെടുകയോ പിന്മാറുകയോ ചെയ്യുന്ന ആശയവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന മലയാളപ്രയോഗം; മൂലത്തിലെ അർത്ഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: ഞാൻ ഇടറിപ്പോകില്ല
  rationale: ഗ്രീക്കിലെ അപൂർണവാക്യത്തിൽ മുൻക്രിയ മനസ്സിലാക്കി ചേർക്കുകയും പത്രോസ് സ്വയം മറ്റുള്ളവരിൽനിന്നു വേർതിരിക്കുന്ന ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വപരാജയത്തിന്റെ പശ്ചാത്തലത്തിൽ σκανδαλισθήσονται എന്നതിന്റെ അർത്ഥം
  choice: ഇടറിപ്പോയാലും
  alternative: വീണുപോയാലും; പിന്മാറിപ്പോയാലും
  rationale: ശിഷ്യന്മാരുടെ പരാജയത്തിന്റെയും ഉപേക്ഷണത്തിന്റെയും ഗൗരവം സൂചിപ്പിക്കുമ്പോഴും ഇത് അന്തിമ വിശ്വാസത്യാഗമാണെന്ന വ്യാഖ്യാനം വാക്യത്തിലേക്ക് നിർബന്ധമായി ചേർക്കുന്നില്ല; മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർത്ഥവ്യാപ്തിയും കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികവും ഗ്രീക്കിലെ അപൂർണമായ അവസാനപ്രയോഗത്തിന്റെ അർത്ഥം വ്യക്തവുമാക്കുന്നു.
