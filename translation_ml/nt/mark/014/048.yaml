source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “ഒരു കൊള്ളക്കാരന്റെ[a] നേരെ എന്നപോലെ, എന്നെ പിടിക്കാനായി വാളുകളും വടികളുമായി നിങ്ങൾ പുറപ്പെട്ടുവന്നുവോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കവർച്ചക്കാരൻ,” “നിയമബാഹ്യൻ,” അല്ലെങ്കിൽ “കലാപകാരി.” λῃστής എന്ന ഗ്രീക്ക് പദം വെറും കള്ളനെ മാത്രമല്ല, അക്രമിയായ കൊള്ളക്കാരനെയോ ചില സന്ദർഭങ്ങളിൽ കലാപകാരിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പതിവ് വാക്യപ്രയോഗത്തിന്റെ രണ്ടു ഘടകങ്ങളും അനാവശ്യമായ ആവർത്തനമില്ലാതെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: ഒരു കൊള്ളക്കാരനെ പിടിക്കാനെന്നപോലെ
  rationale: യേശുവിനെ ആയുധധാരികൾ നേരിടേണ്ട അപകടകാരിയായ കുറ്റവാളിയായി കണക്കാക്കിയെന്ന താരതമ്യഭാവം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λῃστὴν
  choice: കൊള്ളക്കാരൻ
  rationale: പിടിച്ചുപറിയോ ആയുധബലമുള്ള കൊള്ളയോ ചെയ്യുന്ന ആളെന്ന മുഖ്യ അർഥം നൽകുന്നു; കള്ളൻ എന്നതിനെക്കാൾ ഗ്രീക്ക് പദത്തിന്റെ അക്രമപരമായ ഭാവം നന്നായി സൂചിപ്പിക്കുന്നു. കലാപകാരി എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐξήλθατε
  choice: നിങ്ങൾ വന്നിരിക്കുന്നുവോ
  rationale: യേശുവിനെ പിടിക്കാൻ സംഘം പുറപ്പെട്ടു വന്ന് ഇപ്പോൾ അവിടെ എത്തിയിരിക്കുന്ന സാഹചര്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: വാളുകളും വടികളുമായി
  rationale: μάχαιρα എന്ന ആയുധത്തിന് സാധാരണമായ ‘വാൾ’ എന്നും, ആയുധമായി ഉപയോഗിക്കുന്ന ξύλον എന്നതിന് സന്ദർഭോചിതമായ ‘വടി’ എന്നും നൽകുന്നു.
- source_word: συλλαβεῖν με
  choice: പിടിക്കാൻ
  rationale: അറസ്റ്റുചെയ്യുക എന്ന നിയമപരമായ ആശയം സന്ദർഭത്തിൽ ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, ഗ്രീക്കിലെ ‘പിടിക്കുക/കസ്റ്റഡിയിലെടുക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം ലളിതമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: λῃστής എന്ന പദം സാധാരണ കൊള്ളക്കാരനെയോ സായുധ കവർച്ചക്കാരനെയോ കലാപകാരിയെയോ സൂചിപ്പിക്കാവുന്നതാണ്
  choice: മുഖ്യപാഠത്തിൽ ‘കൊള്ളക്കാരൻ’; വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ
  alternative: കവർച്ചക്കാരൻ, സായുധ കൊള്ളക്കാരൻ, നിയമബാഹ്യൻ, കലാപകാരി
  rationale: വാക്യം യേശുവിനെക്കുറിച്ച് ഒരു പ്രത്യേക രാഷ്ട്രീയ തിരിച്ചറിയൽ ഉറപ്പിക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠം സ്വാഭാവികമായി വായിക്കാവുന്നതാക്കുകയും ചരിത്രപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. മൂലത്തിലെ ആക്ഷേപഭാവമുള്ള ചോദ്യം നിലനിർത്തിയിരിക്കുന്നു; ‘മറുപടിയായി പറഞ്ഞു’ എന്ന പ്രയോഗം ഗ്രീക്ക് വിവരണസൂത്രത്തെ മലയാളത്തിൽ അമിത ആവർത്തനമില്ലാതെ അവതരിപ്പിക്കുന്നു.
