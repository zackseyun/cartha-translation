    issue: The comparative phrase obscures the source contrast.
    rationale: Ὡς ἐπὶ λῃστὴν modifies the armed coming-out against Jesus. The draft's “ഒരു കൊള്ളക്കാരനെ പിടിക്കാനെന്നപോലെ” can be read as merely comparing the intended arrest action to catching a robber, rather than asking why they have treated Jesus as one.
  - severity: low
    issue: Footnote anchor is positioned at the end of the question rather than at λῃστής/‘കൊള്ളക്കാരൻ.’
    rationale: Moving the marker to the lexical item makes its referent unambiguous.
  - severity: low
