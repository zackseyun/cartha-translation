  to: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “ഒരു കൊള്ളക്കാരന്റെ[a] നേരെ എന്നപോലെ, എന്നെ പിടിക്കാനായി വാളുകളും വടികളുമായി നിങ്ങൾ പുറപ്പെട്ടുവന്നുവോ?”'
