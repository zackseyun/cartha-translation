id: MRK.14.20
reference: Mark 14:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “പന്ത്രണ്ടുപേരിൽ ഒരുവൻ—എന്നോടൊപ്പം കിണ്ണത്തിൽ[a] മുക്കുന്നവൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “തളികയിൽ.” ഗ്രീക്ക് τρύβλιον ഭക്ഷണത്തിനുപയോഗിക്കുന്ന കിണ്ണത്തെയോ തളികയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: അവൻ ... പറഞ്ഞു
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, ആഖ്യാനം തുടരുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതിരിക്കുന്നത് സ്വാഭാവികമായ ഒഴുക്ക് നൽകുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകളുടെ അവതാരികയെ ലളിതമായും കൃത്യമായും നിലനിർത്തുന്നു.
- source_word: Εἷς τῶν δώδεκα
  choice: പന്ത്രണ്ടുപേരിൽ ഒരുവൻ
  rationale: യേശുവിന്റെ അടുത്ത ശിഷ്യവൃന്ദത്തിൽപ്പെട്ട ഒരാളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ എണ്ണപ്രയോഗമാണിത്.
- source_word: ὁ ἐμβαπτόμενος
  choice: മുക്കുന്നവൻതന്നെ
  rationale: വർത്തമാനകാല പങ്കുപദത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയും തിരിച്ചറിയൽബലവും നിലനിർത്താൻ ‘മുക്കുന്നവൻ’ എന്നും നിർദേശക ഊന്നലിന് ‘തന്നെ’ എന്നും ഉപയോഗിച്ചു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടൊപ്പം
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന സഹവർത്തിത്വം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τὸ τρύβλιον
  choice: പാത്രത്തിൽ
  rationale: τρύβλιον ഭക്ഷണത്തിനുപയോഗിക്കുന്ന കിണ്ണമോ തളികയോ ആയിരിക്കാം; പൊതുവായ ‘പാത്രം’ ഈ യഥാർഥ പദാർഥവ്യാപ്തി നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘മുക്കുക’ എന്ന ക്രിയയോടൊപ്പം സ്ഥലസൂചകമായ ‘-ത്തിൽ’ സ്വാഭാവികമാണ്, εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ചലനം ക്രിയയിൽതന്നെ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ദ്രോഹിയുടെ തിരിച്ചറിയൽ എത്രത്തോളം നിർദിഷ്ടമാണ്
  choice: “പന്ത്രണ്ടുപേരിൽ ഒരുവൻ—എന്നോടൊപ്പം പാത്രത്തിൽ മുക്കുന്നവൻതന്നെ” എന്ന നിർദിഷ്ട വിവരണം നിലനിർത്തി.
  alternative: ഒരു പ്രത്യേക ശിഷ്യന്റെ പേര് ചേർക്കുക, അല്ലെങ്കിൽ ഒരേ സമയം മുക്കുകയാണെന്ന് കൂടുതൽ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം പേര് പറയുന്നില്ല; പങ്കുപദം നൽകുന്ന തിരിച്ചറിയൽ മാത്രം സംരക്ഷിക്കുകയും അതിലധികം വ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള വാക്യഘടന ഉപയോഗിച്ചു. ‘പാത്രം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; മൂലപദത്തിലെ കിണ്ണം/തളിക എന്ന അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
