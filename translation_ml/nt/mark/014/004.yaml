translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള ചോദ്യത്തിൽ സ്വാഭാവികമായ മലയാളവാക്യക്രമം ഉപയോഗിച്ചു; ഗ്രീക്കിലെ അർഥവൈവിധ്യം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
