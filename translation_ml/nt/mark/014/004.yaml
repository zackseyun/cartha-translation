id: MRK.14.4
reference: Mark 14:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἀγανακτοῦντες πρὸς ⸀ἑαυτούς· Εἰς τί ἡ ἀπώλεια αὕτη τοῦ μύρου γέγονεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: ml
  text: 'എന്നാൽ ചിലർ തങ്ങൾക്കിടയിൽ രോഷത്തോടെ പറഞ്ഞു: “ഈ സുഗന്ധതൈലം ഇങ്ങനെ പാഴാക്കിയത് എന്തിന്?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പരസ്പരം” എന്നോ “തങ്ങളുടെ ഉള്ളിൽത്തന്നെ” എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം കൂട്ടത്തിനുള്ളിലെ പരസ്പരപരാതിയെയോ ഓരോരുത്തരുടെയും ഉള്ളിലെ പ്രതികരണത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “സുഗന്ധലേപനം” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ μύρον സുഗന്ധമുള്ള എണ്ണയെയോ ലേപനവസ്തുവിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: എന്നാൽ ...
  rationale: δέ ഇവിടെ സ്ത്രീയുടെ പ്രവൃത്തിയോടുള്ള പ്രതികരണപരമായ വൈരുധ്യം സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണ്; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τινες
  choice: ചിലർ
  rationale: ആരെന്ന് വ്യക്തമാക്കാത്ത ബഹുവചന സർവനാമത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἀγανακτοῦντες
  choice: രോഷത്തോടെ പറഞ്ഞു
  rationale: ക്രിയാവിശേഷണരൂപം ശക്തമായ അസന്തോഷവും ധാർമികരോഷത്തിന്റെ ഭാവവും നൽകുന്നു; തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകളുമായി ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: πρὸς ἑαυτούς
  choice: തങ്ങൾക്കിടയിൽ
  rationale: കൂട്ടത്തിനുള്ളിലെ പരസ്പരപരാതി എന്ന സന്ദർഭസാധ്യതയെ സ്വാഭാവികമായി നൽകുന്നു; ഉള്ളിൽത്തന്നെയുള്ള പ്രതികരണം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Εἰς τί
  choice: എന്തിന്
  rationale: ഉദ്ദേശ്യമോ ഫലമോ ചോദിക്കുന്ന പ്രയോഗത്തിന് സാധാരണ മലയാളത്തിലെ സ്വാഭാവിക തുല്യം.
- source_word: ἡ ἀπώλεια αὕτη
  choice: ഇങ്ങനെ പാഴാക്കിയത്
  rationale: ἀπώλεια എന്നതിന്റെ നഷ്ടം/നാശം എന്ന അടിസ്ഥാനഭാവം ഇവിടെ വിലയേറിയ സുഗന്ധതൈലം ചെലവഴിച്ചതിനെ വിമർശിക്കുന്ന ‘പാഴാക്കൽ’ എന്ന അർഥത്തിൽ സന്ദർഭോചിതമാണ്.
- source_word: τοῦ μύρου
  choice: ഈ സുഗന്ധതൈലം
  rationale: μύρον സുഗന്ധമുള്ള എണ്ണയെയോ ലേപനതൈലത്തെയോ സൂചിപ്പിക്കുന്നു; ‘സുഗന്ധതൈലം’ ആ വസ്തുവിന്റെ എണ്ണസ്വഭാവവും സുഗന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: γέγονεν
  choice: പാഴാക്കിയത്
  rationale: പൂർത്തിയായ സംഭവത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ ചോദ്യം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; പദാനുപദമായ ‘സംഭവിച്ചിരിക്കുന്നു’ എന്ന അസ്വാഭാവികത ഒഴിവാക്കി.
