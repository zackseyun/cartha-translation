source:
  edition: SBLGNT
  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: ml
  text: അവൻ അല്പം മുന്നോട്ടു ചെന്നിട്ട്[a] നിലത്തുവീണു; സാധ്യമെങ്കിൽ ആ വേള അവനിൽനിന്ന് കടന്നുപോകണമെന്നു പ്രാർത്ഥിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അല്പംകൂടി അപ്പുറത്തേക്കു ചെന്നിട്ട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: അല്പം മുന്നോട്ടു ചെന്നിട്ട്
  rationale: മറ്റുള്ളവരിൽനിന്ന് കുറച്ചു ദൂരം മുന്നോട്ടു നീങ്ങിയെന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; കൃതകമായ താരതമ്യപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: നിലത്തു വീണു
  rationale: നടന്നുകൊണ്ടിരിക്കുന്ന പശ്ചാത്തലത്തിൽ സംഭവിച്ച പ്രവൃത്തി എന്ന നിലയിൽ ഗ്രീക്ക് അപൂർണകാലത്തെ മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: προσηύχετο
  choice: പ്രാർഥിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἵνα
  choice: എന്നു
  rationale: ഇവിടെ പ്രാർഥനയുടെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഘടകമായി സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിക്കുന്നു; ഉദ്ദേശ്യഭാവം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: εἰ δυνατόν ἐστιν
  choice: കഴിയുമെങ്കിൽ
  rationale: സാധ്യതയെക്കുറിച്ചുള്ള നിബന്ധന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: ആ നാഴിക തന്നിൽനിന്ന് ഒഴിഞ്ഞുപോകണം
  rationale: παρέρχομαι എന്നതിന്റെ കടന്നുപോകുക/ഒഴിഞ്ഞുപോകുക എന്ന ആശയവും αὐτοῦ എന്നതിന്റെ വ്യക്തിപരമായ ബന്ധവും നിലനിർത്തുന്നു; ἡ ὥραയെ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ 'ആ നാഴിക' എന്നു നൽകുന്നു.
theological_decisions:
- issue: '''ἡ ὥρα'' എന്ന പ്രയോഗത്തിന്റെ അർഥം'
  choice: '''ആ നാഴിക'' എന്ന പ്രതീകസാന്ദ്രമായ പ്രയോഗം നിലനിർത്തി'
  alternative: '''ആ സമയം''; ''കഷ്ടാനുഭവത്തിന്റെ സമയം'''
  rationale: യേശുവിന്റെ വരാനിരിക്കുന്ന കഷ്ടാനുഭവവും മരണവും സൂചിപ്പിക്കുന്ന ദൈവശാസ്ത്രഭാരം ഈ പ്രയോഗത്തിനുണ്ട്. അതിനെ വിശദീകരണപരമായ പരാവർത്തനത്തിലൂടെ ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ മൂലപാഠത്തിന്റെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. 'നാഴിക' ഇവിടെ ഘടികാരമാനത്തിന്റെ സാങ്കേതിക അർഥത്തിലല്ല, നിർണയിക്കപ്പെട്ട വേള എന്ന വചനസാന്ദ്രമായ അർഥത്തിലാണ്.
