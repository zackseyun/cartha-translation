id: MRK.14.60
reference: Mark 14:60
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: ml
  text: 'അപ്പോൾ മഹാപുരോഹിതൻ എഴുന്നേറ്റ് നടുവിലേക്കു വന്ന്[a] യേശുവിനോട് ചോദിച്ചു: “നീ ഒന്നും മറുപടി പറയുന്നില്ലേ? ഇവർ[b] നിനക്കെതിരെ എന്താണ് സാക്ഷ്യം പറയുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നടുവിൽ നിന്നുകൊണ്ട്.” ഈ പ്രയോഗം മഹാപുരോഹിതൻ സഭയുടെ മധ്യസ്ഥാനത്തേക്കു നീങ്ങി നിന്നതായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “ഇവർ” എന്ന ചൂണ്ടുപേര് പുല്ലിംഗ ബഹുവചനമാണ്; അവിടെ ഉണ്ടായിരുന്ന പുരുഷസാക്ഷികളെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: source_language_clarification
lexical_decisions:
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റ്
  rationale: ἀνίστημι എന്ന ക്രിയയുടെ കർത്തൃവാചക ഭൂതകാല ക്രിയാവിശേഷണരൂപം ഇവിടെ മഹാപുരോഹിതൻ ഇരുന്നിടത്തുനിന്ന് എഴുന്നേൽക്കുന്ന ശാരീരിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: ഈ ന്യായവിചാരണാസന്ദർഭത്തിൽ അധ്യക്ഷനായിരുന്ന യഹൂദ മഹാപുരോഹിതനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപദം.
- source_word: εἰς μέσον
  choice: നടുവിലേക്കു വന്ന്
  rationale: εἰς എന്ന ദിശാസൂചക മുൻപ്രത്യയത്തിന്റെ ചലനഭാവവും μέσον എന്നതിന്റെ മധ്യസ്ഥാനാർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു; മലയാളത്തിൽ വെറും ‘നടുവിൽ’ എന്നതിനെക്കാൾ ചലനം വ്യക്തമാണ്.
- source_word: ἐπηρώτησεν
  choice: ചോദിച്ചു
  rationale: ἐπερωτάω എന്നത് ചോദിക്കുക, ചോദ്യംചെയ്യുക എന്നീ അർഥങ്ങൾക്കിടയിൽ നിൽക്കുന്നു. ന്യായവിചാരണാസന്ദർഭം തന്നെ ശക്തി നൽകുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ചോദിച്ചു’ എന്നത് അനാവശ്യമായി ‘ചോദ്യംചെയ്തു’ എന്ന കടുപ്പം ചേർക്കുന്നില്ല.
- source_word: ἀποκρίνῃ οὐδέν
  choice: നീ ഒന്നും മറുപടി പറയുന്നില്ലേ?
  rationale: ഇരട്ട നിഷേധഘടനയുടെ ഊന്നലും മഹാപുരോഹിതന്റെ നേരിട്ടുള്ള വെല്ലുവിളിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὗτοί
  choice: ഇവർ
  rationale: സന്നിഹിതരായ സാക്ഷികളെ ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചന സർവനാമം. ഗ്രീക്കിൽ രൂപം പുല്ലിംഗമാണെങ്കിലും മലയാളത്തിൽ ‘ഇവർ’ സ്വാഭാവികമാണ്; ലിംഗവിവരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καταμαρτυροῦσιν
  choice: നിനക്കെതിരെ ... സാക്ഷ്യം പറയുന്നത്
  rationale: καταμαρτυρέω എന്നതിലെ നിയമപരമായ ‘ഒരാൾക്കെതിരെ സാക്ഷ്യം പറയുക’ എന്ന ആശയവും വർത്തമാനകാല പ്രവർത്തനവും സംരക്ഷിക്കുന്നു; ‘കുറ്റപ്പെടുത്തുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: οὗτοί എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ അവതരണം
  choice: മുഖ്യവാചകത്തിൽ ‘ഇവർ’; ഗ്രീക്കിലെ പുല്ലിംഗസൂചന അടിക്കുറിപ്പിൽ
  alternative: ‘ഈ പുരുഷന്മാർ’
  rationale: മലയാളത്തിലെ ചൂണ്ടുപേരായ ‘ഇവർ’ വ്യാകരണലിംഗം അടയാളപ്പെടുത്തുന്നില്ല; ‘ഈ പുരുഷന്മാർ’ എന്നു മുഖ്യവാചകത്തിൽ പറയുന്നത് അസ്വാഭാവികവും ഗ്രീക്കിലെ സൂചനയെ ആവശ്യത്തിലധികം പ്രകടമാക്കുന്നതുമാകും. എന്നാൽ സാക്ഷികൾ പുരുഷന്മാരാണെന്ന മൂലഭാഷാവിവരം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ന്യായവിചാരണയുടെ ഭാവം സന്ദർഭത്തിലൂടെ നിലനിർത്തിയെങ്കിലും അനാവശ്യമായി നിയമസാങ്കേതികമോ പുരാതനമോ ആയ പദങ്ങൾ ചേർത്തിട്ടില്ല. ചോദ്യങ്ങളുടെ മൂർച്ചയും മൂലവാക്യത്തിലെ അർഥതുറപ്പില്ലായ്മയും സംരക്ഷിച്ചു.
