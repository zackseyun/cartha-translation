source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸀εὐθὺς προσελθὼν αὐτῷ λέγει· ⸀Ῥαββί, καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: ml
  text: അവൻ വന്നയുടനെ യേശുവിന്റെ അടുത്തേക്കു ചെന്നു, “റബ്ബീ!” എന്നു പറഞ്ഞു, അവനെ ഗാഢമായി ചുംബിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വീണ്ടും വീണ്ടും ചുംബിച്ചു” എന്നും വിവർത്തനം ചെയ്യാം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ സാധാരണ ‘ചുംബിച്ചു’ എന്നതിനെക്കാൾ ഊന്നലുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: വന്ന ഉടനെ
  rationale: കാലസൂചകമായ ഭൂതകാല കൃദന്തത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള εὐθὺς-ന്റെ ഉടനടിത്തവും ചേർത്ത് വ്യക്തമാക്കുന്നു.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ വേഗമേറിയ ആഖ്യാനശൈലിയും പ്രവർത്തിയുടെ തൽക്ഷണതയും വ്യക്തമാക്കുന്നു.
- source_word: προσελθὼν αὐτῷ
  choice: യേശുവിന്റെ അടുത്തുചെന്ന്
  rationale: ശാരീരികമായി സമീപിച്ചതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. αὐτῷ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി സന്ദർഭത്തിൽ യേശുവായതിനാൽ പേര് ഉപയോഗിക്കുന്നത് മലയാളത്തിൽ വ്യക്തത നൽകുന്നു.
- source_word: λέγει
  choice: എന്നു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ സ്വാഭാവിക മലയാള ആഖ്യാനത്തിന് യോജിച്ച ഭൂതകാലത്തിൽ നൽകുന്നു.
- source_word: Ῥαββί
  choice: റബ്ബീ
  rationale: ചരിത്ര-സാംസ്കാരിക അഭിസംബോധനയായ ശീർഷകം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുന്നു.
- source_word: κατεφίλησεν
  choice: ഗാഢമായി ചുംബിച്ചു
  rationale: ലളിതമായ ‘ചുംബിച്ചു’ എന്നതിനെക്കാൾ ഊന്നലുള്ള καταφιλέω എന്ന ക്രിയയുടെ ബലം നൽകുന്നു; എന്നാൽ ആവർത്തനം നിർബന്ധമായി നിശ്ചയിക്കുന്നില്ല.
theological_decisions:
- issue: യൂദാസ് യേശുവിനെ Ῥαββί എന്നു അഭിസംബോധന ചെയ്യുന്നത്
  choice: റബ്ബീ
  alternative: ഗുരുവേ
  rationale: മൂലപാഠത്തിലുള്ള സെമിറ്റിക് ശീർഷകവും സംഭവത്തിന്റെ ചരിത്രപരമായ ഭാവവും നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ അധിക അർഥം ചേർക്കുന്നില്ല.
- issue: κατεφίλησεν എന്ന ഊന്നൽযুক্ত ക്രിയയുടെ സ്വഭാവം
  choice: ഗാഢമായി ചുംബിച്ചു
  alternative: വീണ്ടും വീണ്ടും ചുംബിച്ചു
  rationale: ക്രിയയുടെ ഊന്നൽ സംരക്ഷിക്കുമ്പോഴും അത് നിർബന്ധമായും ആവർത്തനമെന്നോ പ്രത്യേക വികാരമെന്നോ തീർപ്പാക്കാതെ പാഠത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ചെറുവാക്യത്തിന്റെ ആഖ്യാനവേഗം നിലനിർത്തുകയും ഗ്രീക്ക് ക്രിയയുടെ ഊന്നൽ അടിക്കുറിപ്പിലൂടെ വിശദീകരിക്കുകയും ചെയ്തു.
