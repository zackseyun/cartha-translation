translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വിചാരണാസന്ദർഭത്തിന്റെ ഗൗരവവും നിയമപരമായ ഭാവവും നിലനിർത്തുന്ന ഭാഷ. ‘കള്ളസാക്ഷ്യം’ എന്ന പരിചിതമായ പ്രയോഗം ψευδομαρτυρέωയുടെ നിയമപരമായ അർത്ഥം സംരക്ഷിക്കുന്നു.
