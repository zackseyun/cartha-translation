  text: πολλοὶ γὰρ ἐψευδομαρτύρουν κατ’ αὐτοῦ, καὶ ἴσαι αἱ μαρτυρίαι οὐκ ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: ml
  text: കാരണം, പലരും അവനെതിരെ കള്ളസാക്ഷ്യം പറഞ്ഞുകൊണ്ടിരുന്നു; അവരുടെ സാക്ഷ്യങ്ങൾ തമ്മിൽ പൊരുത്തപ്പെട്ടിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: ‘കാരണം, പലരും അവനെതിരെ കള്ളസാക്ഷ്യം പറഞ്ഞുകൊണ്ടിരുന്നു; ആ സാക്ഷ്യങ്ങൾ ഒരുപോലെയായിരുന്നില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: പലരും
  rationale: വിശേഷണം ഇവിടെ നാമപദമായി പ്രവർത്തിച്ച് അനേകം ആളുകളെ സൂചിപ്പിക്കുന്നു. മൂലത്തിൽ ‘സാക്ഷികൾ’ എന്ന് പ്രത്യേകം ഇല്ലാത്തതിനാൽ അത് മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: γὰρ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിലും മുൻസന്ദർഭത്തോടുള്ള ബന്ധത്തിലും സ്വാഭാവികമായി വ്യക്തമാകുന്നു; ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമായി തോന്നും.
- source_word: ἐψευδομαρτύρουν
  choice: കള്ളസാക്ഷ്യം പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: നിയമപരമായ സാക്ഷ്യത്തിന്റെ അർത്ഥം ‘കള്ളസാക്ഷ്യം’ നിലനിർത്തുന്നു; അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചയായ/ആവർത്തിച്ച പ്രവർത്തനം ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ പ്രകടമാക്കുന്നു.
- source_word: κατ’ αὐτοῦ
  choice: അവനെതിരെ
  rationale: ഈ വിചാരണാസന്ദർഭത്തിൽ κατά + genitive യേശുവിനെതിരായി ഉന്നയിച്ച പ്രതികൂല സാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἴσαι
  choice: തമ്മിൽ പൊരുത്തപ്പെട്ടില്ല
  rationale: പദശഃ ‘തുല്യമായ’ എന്നാണെങ്കിലും സാക്ഷ്യങ്ങളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ അവ പരസ്പരം ഒത്തുവന്നില്ല എന്നതാണ് ആശയം. സ്വാഭാവികമായ നിയമസന്ദർഭഭാഷയിൽ ‘പൊരുത്തപ്പെടുക’ അത് വ്യക്തമാക്കുന്നു.
- source_word: αἱ μαρτυρίαι
  choice: അവരുടെ സാക്ഷ്യങ്ങൾ
  rationale: നിശ്ചയാർഥക ലേഖനം മുമ്പ് പറഞ്ഞവരുടെ സാക്ഷ്യങ്ങളിലേക്കു ചൂണ്ടുന്നു; മലയാളത്തിൽ ‘അവരുടെ’ എന്നു പറയുന്നത് ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἦσαν
  choice: പൊരുത്തപ്പെട്ടില്ല
  rationale: ἴσαιയോടു ചേർന്ന നിഷേധരൂപം മലയാളത്തിൽ ‘പൊരുത്തപ്പെട്ടില്ല’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
