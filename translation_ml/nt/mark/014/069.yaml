source:
  edition: SBLGNT
  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: ml
  text: 'ആ വേലക്കാരി അവനെ കണ്ടപ്പോൾ, അടുത്തുനിന്നവരോട് വീണ്ടും പറഞ്ഞുതുടങ്ങി: “ഇവൻ അവരിൽ ഒരാളാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: വേലക്കാരി
  rationale: ഒരു യുവതിയായ വീട്ടുവേലക്കാരിയെയോ ദാസിയെയോ സൂചിപ്പിക്കുന്നു. അടിമസ്ഥിതി നിർബന്ധമായി മുൻനിർത്താതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പദമാണ് ‘വേലക്കാരി’.
- source_word: ἰδοῦσα
  choice: അവനെ കണ്ടപ്പോൾ
  rationale: സംസാരത്തിനു കാരണമായ സാഹചര്യം സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി നൽകിയിരിക്കുന്നു.
- source_word: ἤρξατο πάλιν λέγειν
  choice: വീണ്ടും പറഞ്ഞുതുടങ്ങി
  rationale: ἤρξατο എന്നതിന്റെ ആരംഭാർഥവും πάλιν എന്നതിന്റെ ‘വീണ്ടും’ എന്ന അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοῖς παρεστῶσιν
  choice: അടുത്തുനിന്നവരോട്
  rationale: അവിടെ സമീപത്തു നിന്നിരുന്ന ആളുകളെയാണ് participle സൂചിപ്പിക്കുന്നത്; സ്ഥലസാമീപ്യവും സാന്നിധ്യവും സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: Οὗτος
  choice: ഇവൻ
  rationale: പത്രോസിനെ നേരിട്ട് ചൂണ്ടിക്കാണിക്കുന്ന പുരുഷലിംഗ ഏകവചന demonstrative-ന് സ്വാഭാവികമായ മലയാള സമാനപദം.
- source_word: ἐξ αὐτῶν
  choice: അവരിൽ ഒരാളാണ്
  rationale: യേശുവിനോടു ബന്ധപ്പെട്ട ആ കൂട്ടത്തിലെ അംഗമാണെന്ന ആശയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
