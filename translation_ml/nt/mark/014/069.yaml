  source_fidelity: 'The Malayalam accurately represents all principal elements of the Greek: the servant girl, her seeing him, the ingressive and repetitive sense of ἤρξατο πάλιν λέγειν, her address to those present nearby, and the assertion that he belongs to the group. “വേലക്കാരി” is a suitable modern contextual rendering of παιδίσκη; while the Greek can carry a young-girl nuance, specifying this in Malayalam would be stylistically awkward and is not required by the immediate context.'
