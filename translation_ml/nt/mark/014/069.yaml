  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലപാഠത്തിലെ ‘വീണ്ടും’ എന്നും ‘പറഞ്ഞുതുടങ്ങി’ എന്നും ഉള്ള ഘടകങ്ങൾ ഒഴിവാക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
