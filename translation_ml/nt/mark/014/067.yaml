source:
  edition: SBLGNT
  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: ml
  text: 'തീ കായുന്ന പത്രോസിനെ കണ്ട അവൾ അവനെ ഉറ്റുനോക്കി പറയുന്നു: “നീയും നസറായനായ യേശുവിനോടൊപ്പം ഉണ്ടായിരുന്നല്ലോ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θερμαινόμενον
  choice: തീ കാഞ്ഞുകൊണ്ടിരിക്കുന്നതു
  rationale: തണുപ്പകറ്റാൻ തീയുടെ ചൂടേൽക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐμβλέψασα αὐτῷ
  choice: അവനെ സൂക്ഷിച്ചുനോക്കി
  rationale: വെറുതെ നോക്കുക എന്നതിലുപരി ശ്രദ്ധയോടെ ഉറ്റുനോക്കുക എന്ന ഗ്രീക്ക് ക്രിയയുടെ ശക്തി പകർത്തുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ എന്നാണ് രൂപം; എന്നാൽ ഭൂതകാല ആഖ്യാനത്തിന്റെ സ്വാഭാവിക മലയാളക്രമത്തിനായി ‘പറഞ്ഞു’ എന്നു നൽകി, അർത്ഥത്തിൽ മാറ്റമുണ്ടാക്കിയിട്ടില്ല.
- source_word: τοῦ Ναζαρηνοῦ ... τοῦ Ἰησοῦ
  choice: നസറായനായ യേശു
  rationale: ‘നസറായൻ’ എന്ന ഭൂമിശാസ്ത്രപരമായ വിശേഷണം യേശുവിനോടു ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μετά
  choice: ഒപ്പം
  rationale: ബന്ധവും സഹവാസവും സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: സ്ത്രീയുടെ വാക്കിലെ പ്രസ്താവനാഭാവം
  choice: “നീയും ... ഉണ്ടായിരുന്നല്ലോ”
  alternative: “നീയും ... ഉണ്ടായിരുന്നുവല്ലോ” / “നീയും ... കൂടെയായിരുന്നു”
  rationale: ഗ്രീക്ക് വാചകം ചോദ്യം എന്നതിലുപരി തിരിച്ചറിവോടെയുള്ള ആരോപണപ്രസ്താവനയാണ്; ‘അല്ലോ’ ആ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘തീ കായുക’, ‘സൂക്ഷിച്ചുനോക്കുക’ എന്നീ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാപരമായ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി.
