source:
  edition: SBLGNT
  text: ⸀ἤρξαντο λυπεῖσθαι καὶ λέγειν αὐτῷ εἷς κατὰ εἷς· Μήτι ⸀ἐγώ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: ml
  text: അവർ ദുഃഖിതരാകാനും അവനോട് ഓരോരുത്തരായി, “ഞാനല്ലല്ലോ?” എന്നു പറയാനും തുടങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ μήτι എന്ന കണം ‘അല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യമാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: തുടങ്ങി
  rationale: പൂരക അനന്തക്രിയകളോടുകൂടിയ ἄρχω പ്രവർത്തനങ്ങളുടെ ആരംഭം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തുടങ്ങി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: λυπεῖσθαι
  choice: ദുഃഖിതരാകാൻ
  rationale: ഈ രൂപം ദുഃഖത്തിലാകുന്നതോ മനോവേദന അനുഭവിക്കുന്നതോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ഗൗരവവും ആരംഭഭാവവും നിലനിർത്തുന്നു.
- source_word: καὶ λέγειν
  choice: എന്നു പറയുകയും ചെയ്തു
  rationale: λέγω അടിസ്ഥാനമായി ‘പറയുക’ എന്നാണ്; ഉള്ളടക്കം ചോദ്യമായിരുന്നാലും ‘ചോദിക്കുക’ എന്നു പ്രത്യേകവൽക്കരിക്കാതെ ഉറവിടക്രിയയെ പിന്തുടരുന്നു.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: സന്ദർഭത്തിൽ സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു; ഉറവിടത്തിലെ സർവനാമരൂപം അനാവശ്യ വിശദീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: εἷς κατὰ εἷς
  choice: ഓരോരുത്തരായി
  rationale: ശിഷ്യന്മാർ വ്യക്തിപരമായി ഒന്നിനു പിന്നാലെ പ്രതികരിച്ചതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: Μήτι ἐγώ;
  choice: ഞാനല്ലല്ലോ?
  rationale: μήτι നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യം അവതരിപ്പിക്കുന്നു. ‘ഞാനല്ലല്ലോ?’ എന്നത് ഗ്രീക്കിലെ സംക്ഷിപ്തതയും ‘അല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ ചോദ്യത്തിന്റെ ഭാവം
  choice: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ‘ഞാനല്ലല്ലോ?’ എന്ന രൂപം
  alternative: ‘ഞാനാണോ?’
  rationale: μήτι എന്ന കണം ‘അല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്നതായി സൂചിപ്പിക്കുന്നു. ‘ഞാനാണോ?’ എന്നു മാത്രം പറഞ്ഞാൽ പ്രതിഷേധമോ പരിഭ്രമമോ കലർന്ന ഈ സൂക്ഷ്മഭാവം നഷ്ടപ്പെടും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ക്രമവും ‘പറയുക’ എന്ന പൊതുവായ ക്രിയയും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട്, μήτιയുടെ നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഭാവം മലയാളത്തിലെ ‘അല്ലല്ലോ’ രൂപത്തിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു.
