revisions:
- from: അവർ ദുഃഖിതരാകാൻ തുടങ്ങി; ഓരോരുത്തരായി അവനോട്, “ഞാനല്ലല്ലോ?”[a] എന്നു പറയുകയും ചെയ്തു.
  to: അവർ ദുഃഖിതരാകാനും അവനോട് ഓരോരുത്തരായി, “ഞാനല്ലല്ലോ?” എന്നു പറയാനും തുടങ്ങി.[a]
  rationale: The revision makes ‘തുടങ്ങി’ govern both ‘ദുഃഖിതരാകാനും’ and ‘പറയാനും,’ matching the syntax and inceptive aspect of ἤρξαντο with its two complementary infinitives. It retains the natural Malayalam rendering ‘ഞാനല്ലല്ലോ?’ for the negative-expectation question and replaces the potentially ambiguous proposed literal alternative in the footnote with a precise grammatical explanation.
