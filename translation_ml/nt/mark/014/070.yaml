source:
  edition: SBLGNT
  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ വീണ്ടും അതു നിഷേധിച്ചു. കുറച്ചുകഴിഞ്ഞ്, അരികെ നിന്നവർ വീണ്ടും പത്രോസിനോട് പറഞ്ഞു: “നീ തീർച്ചയായും അവരിൽ ഒരുവനാണ്; നീയും ഗലീലക്കാരനല്ലോ, നിന്റെ സംസാരരീതിയും[a] സമാനമാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ഉച്ചാരണം.’ ഗ്രീക്ക് പദം സംസാരരീതി, പ്രാദേശിക ഭാഷാഭേദം, അല്ലെങ്കിൽ ഉച്ചാരണം എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘നിന്റെ സംസാരരീതിയും സമാനമാണ്’ എന്ന ഭാഗം ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: വീണ്ടും അതു നിഷേധിച്ചു
  rationale: ഇംപെർഫെക്റ്റ് രൂപം സന്ദർഭത്തിൽ ആവർത്തിച്ചോ തുടർന്നോ ഉണ്ടായ നിഷേധത്തെ സൂചിപ്പിക്കുന്നു. ‘വീണ്ടും’ ആ ആവർത്തനം വ്യക്തമാക്കുന്നു; ‘അതു’ എന്നത് മുമ്പുള്ള ആരോപണത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗമാണ്.
- source_word: μετὰ μικρὸν
  choice: കുറച്ചുകഴിഞ്ഞപ്പോൾ
  rationale: ചുരുങ്ങിയ സമയത്തിനുശേഷം എന്ന അർഥമുള്ള പ്രയോഗത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: οἱ παρεστῶτες
  choice: അരികെ നിന്നവർ
  rationale: സന്നിഹിതരായിരുന്നവരെ സൂചിപ്പിക്കുന്നതോടൊപ്പം മൂലത്തിലെ സ്ഥലസംബന്ധിയായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ഇംപെർഫെക്റ്റിന് തുടരുന്നോ ആവർത്തിക്കുന്നോ ആയ സംസാരത്തിന്റെ ഭാവമുണ്ടെങ്കിലും, ‘വീണ്ടും’ എന്ന ക്രിയാവിശേഷണം അത് വ്യക്തമാക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ ലളിതമായ ഭൂതകാലം കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: Ἀληθῶς
  choice: തീർച്ചയായും
  rationale: ഉറപ്പോടെയുള്ള പ്രസ്താവനയുടെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξ αὐτῶν εἶ
  choice: അവരിൽ ഒരുവനാണ്
  rationale: യേശുവിനോടു ബന്ധപ്പെട്ട കൂട്ടത്തിൽ പത്രോസും ഉൾപ്പെടുന്നു എന്ന ആരോപണം വ്യക്തവും വ്യാഖ്യാനാതിരേകമില്ലാതെയും അറിയിക്കുന്നു.
- source_word: καὶ γὰρ Γαλιλαῖος εἶ
  choice: നീയും ഗലീലക്കാരനല്ലോ
  rationale: γάρ നൽകുന്ന കാരണഭാവം ‘അല്ലോ’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുകയും καίയുടെ ‘നീയും’ എന്ന അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἡ λαλιά σου
  choice: നിന്റെ സംസാരരീതി
  rationale: λαλιά എന്നത് സംസാരം, സംസാരശൈലി, പ്രാദേശിക ഉച്ചാരണം എന്നിവയെ സൂചിപ്പിക്കാം. ‘സംസാരരീതി’ ഈ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ὁμοιάζει
  choice: അവരുടേതുപോലെയാണ്
  rationale: ‘സാദൃശ്യമുണ്ട്’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. താരതമ്യവസ്തു ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ ഗലീലക്കാരായ ആ കൂട്ടത്തിന്റെ സംസാരരീതിയാണെന്ന് ഗ്രഹിക്കാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു; λαλιάയുടെ അർഥവ്യാപ്തിയും അവസാന വാക്യഭാഗത്തെ പാഠഭേദവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
