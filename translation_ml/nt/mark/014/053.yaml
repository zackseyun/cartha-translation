  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: ml
  text: അവർ യേശുവിനെ മഹാപുരോഹിതന്റെ അടുക്കലേക്കു കൊണ്ടുപോയി. മുഖ്യപുരോഹിതന്മാരും മൂപ്പന്മാരും ശാസ്ത്രിമാരും എല്ലാവരും ഒന്നിച്ചുകൂടുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഇവിടെ ‘ഒന്നിച്ചുകൂടുന്നു’ എന്ന വർത്തമാനകാലരൂപമാണ്; ഭൂതകാലവിവരണത്തിനിടയിലെ ഈ ചരിത്രവർത്തമാനം രംഗത്തിന് സജീവത നൽകുന്നു.
    reason: historical_present
lexical_decisions:
- source_word: ἀπήγαγον
  choice: കൊണ്ടുപോയി
  rationale: ἀπάγω എന്ന ക്രിയയുടെ ‘നയിച്ചുകൊണ്ടുപോകുക/കൊണ്ടുപോകുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; കാവൽസാഹചര്യം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: ἀρχιερέα
  choice: മഹാപുരോഹിതൻ
  rationale: ഏകവചനത്തിലുള്ള പദം ഇവിടെ അധ്യക്ഷനായ മഹാപുരോഹിതനെയാണ് സൂചിപ്പിക്കുന്നത്; പിന്നാലെയുള്ള ബഹുവചനസംഘത്തിൽനിന്ന് വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: συνέρχονται
  choice: ഒന്നിച്ചുകൂടുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി, ഭൂതകാലവിവരണത്തിനുള്ളിലെ ദൃശ്യതീവ്രത മലയാളത്തിലും പ്രകടമാക്കുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: ഒത്തുകൂടിയ നേതൃത്വസംഘങ്ങളുടെ സമഗ്രതയെ സൂചിപ്പിക്കുന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ബഹുവചനത്തിൽ മഹാപുരോഹിതവർഗത്തിലെ നേതാക്കളെ സൂചിപ്പിക്കുന്നു; ഏകവചനത്തിലെ മഹാപുരോഹിതനുമായി ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: πρεσβύτεροι
  choice: മൂപ്പന്മാർ
  rationale: വയസ്സിനെ മാത്രം അല്ല, അംഗീകൃത സാമൂഹിക-മതനേതൃത്വസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പതിവും കൃത്യവുമായ പ്രയോഗം.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: എഴുത്തിലും തിരുവെഴുത്തുവ്യാഖ്യാനത്തിലും പ്രാവീണ്യമുള്ള ഔദ്യോഗിക വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന, സുവിശേഷസന്ദർഭത്തിൽ പരിചിതമായ മലയാളപദം.
theological_decisions:
- issue: ഭൂതകാലവിവരണത്തിലെ ചരിത്രവർത്തമാനകാലമായ συνέρχονται
  choice: ‘ഒന്നിച്ചുകൂടുന്നു’ എന്ന വർത്തമാനകാലരൂപം നിലനിർത്തി
  alternative: ‘ഒന്നിച്ചുകൂടി’ എന്ന ഭൂതകാലരൂപം ഉപയോഗിക്കുക
  rationale: മൂലഗ്രീക്കിലെ പെട്ടെന്നുള്ള കാലമാറ്റവും അതിന്റെ വിവരണാത്മക സജീവതയും സംരക്ഷിക്കുന്നു. ഇത് ഉപദേശപരമായ വ്യത്യാസമല്ല; മൂലരൂപത്തിലെ സാഹിത്യസവിശേഷത നിലനിർത്താനുള്ള തീരുമാനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. മൂലത്തിലെ ചരിത്രവർത്തമാനം മുഖ്യവാചകത്തിൽ നിലനിർത്തുകയും അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്തു.
