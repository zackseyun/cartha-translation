review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the adversative force, the temporal sequence, the passive resurrection expression, Jesus’ going ahead of the disciples, and the destination Galilee. The plural addressee is retained.
  naturalness: The main wording is understandable and appropriately formal, but separating the postpositional temporal expression improves modern Malayalam readability. “നിങ്ങളെക്കാൾ മുമ്പായി” is more explicit and idiomatic for going ahead of someone than “നിങ്ങൾക്കു മുമ്പായി.”
  terminology: “ഉയിർപ്പിക്കപ്പെട്ട” appropriately preserves the Greek passive resurrection wording without specifying an agent. “ഗലീലയിലേക്കു” is natural for εἰς. The footnote should use Malayalam technical terminology rather than the untranslated English “infinitive,” and should provide a genuinely distinct alternative.
  issues:
  - severity: low
    issue: Temporal phrase is written as a single compound
    rationale: “ഉയിർപ്പിക്കപ്പെട്ട ശേഷം” is clearer and more natural in modern standard Malayalam than “ഉയിർപ്പിക്കപ്പെട്ടശേഷം.”
  - severity: low
    issue: Footnote repeats the main wording and includes an untranslated technical term
    rationale: The stated alternative should differ meaningfully in aspectual phrasing, and “ഇൻഫിനിറ്റീവ്” is preferable to English “infinitive” in Malayalam prose.
  revised_text: എന്നാൽ, ഞാൻ ഉയിർപ്പിക്കപ്പെട്ട ശേഷം, നിങ്ങളെക്കാൾ മുമ്പായി ഗലീലയിലേക്കു പോകും.
  revised_footnotes:
