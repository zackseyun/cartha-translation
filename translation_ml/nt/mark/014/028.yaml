  text: ἀλλὰ μετὰ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: ml
  text: എന്നാൽ, ഞാൻ ഉയിർപ്പിക്കപ്പെട്ട ശേഷം, നിങ്ങളെക്കാൾ മുമ്പായി ഗലീലയിലേക്കു പോകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുമ്പുള്ള ചിതറിപ്പോകുമെന്ന പ്രവചനത്തോട് വ്യക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗം.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: ഞാൻ ഉയിർപ്പിക്കപ്പെട്ടശേഷം
  rationale: μετάയോടുകൂടിയ articular infinitive സൂചിപ്പിക്കുന്ന കാലക്രമമായ ‘ശേഷം’ എന്ന അർഥവും ἐγερθῆναίയുടെ passive രൂപവും നിലനിർത്തുന്നു.
- source_word: ἐγερθῆναί
  choice: ഉയിർപ്പിക്കപ്പെട്ട
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിലെ passive രൂപം സംരക്ഷിക്കുകയും ‘ഞാൻ ഉയിർത്തെഴുന്നേറ്റശേഷം’ എന്നു active/intransitive ആക്കി വ്യാഖ്യാനപരമായി മിനുക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: προάξω
  choice: മുമ്പായി ... പോകും
  rationale: മറ്റുള്ളവരെക്കാൾ മുമ്പ് ലക്ഷ്യസ്ഥാനത്തേക്കു പോകുക എന്ന ദിശാസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘നയിക്കും’ എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: ὑμᾶς
  choice: നിങ്ങൾക്കു
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തെ മലയാളത്തിൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ഗലീലയിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἐγερθῆναί με എന്നതിലെ പുനരുത്ഥാനപ്രയോഗം
  choice: ഞാൻ ഉയിർപ്പിക്കപ്പെട്ടശേഷം
  alternative: ഞാൻ ഉയിർത്തെഴുന്നേറ്റശേഷം
  rationale: ഗ്രീക്കിലെ aorist passive infinitive സംരക്ഷിച്ച് ആരാണ് ഉയിർപ്പിക്കുന്നത് എന്നു വാക്യത്തിൽ ചേർക്കാതെ genuine passive ഭാവവും പുനരുത്ഥാനസൂചനയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കർമണിപ്രയോഗം അല്പം ഔപചാരികമാണെങ്കിലും മൂലഭാഷയിലെ പ്രധാന രൂപഭേദം സംരക്ഷിക്കാൻ ഇവിടെ യോജിച്ചതാണ്.
