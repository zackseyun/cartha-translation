id: MRK.14.6
reference: Mark 14:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു പറഞ്ഞു: “അവളെ വിട്ടേക്കൂ. നിങ്ങൾ എന്തിനാണ് അവളെ ബുദ്ധിമുട്ടിക്കുന്നത്? അവൾ എനിക്കുവേണ്ടി[a] മനോഹരമായ ഒരു പ്രവൃത്തി[b] ചെയ്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “എന്നിൽ”; സന്ദർഭത്തിൽ “എന്നോട്” എന്നോ “എന്റെമേൽ” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “നല്ല ഒരു പ്രവൃത്തി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: അവളെ വിട്ടേക്കൂ
  rationale: ഇടപെടലും ശല്യപ്പെടുത്തലും ഉടൻ നിർത്തണമെന്ന ആജ്ഞയുടെ സംരക്ഷണാത്മക ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: നിങ്ങൾ എന്തിനാണ് അവളെ ബുദ്ധിമുട്ടിക്കുന്നത്?
  rationale: κόπους παρέχετε എന്ന പ്രയോഗം അവൾക്കു പ്രയാസമോ ശല്യമോ ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ബുദ്ധിമുട്ടിക്കുന്നത്’ ശാസനയുടെ ഭാവം കുറയ്ക്കാതെ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: καλὸν ἔργον
  choice: മനോഹരമായ ഒരു പ്രവൃത്തി
  rationale: καλός എന്ന പദത്തിലെ നല്ലത്, മനോഹരം, ശ്രേഷ്ഠം, ഉചിതം എന്നീ അർഥഛായകളിൽ, ഈ ഭക്തിപൂർവമായ പ്രവൃത്തിയുടെ ഭംഗിയും ഔചിത്യവും ‘മനോഹരമായ’ എന്നത് പ്രകടമാക്കുന്നു; ‘നല്ല’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἠργάσατο
  choice: ചെയ്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെ ഇപ്പോഴത്തെ വിലയിരുത്തലുമായി ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐν ἐμοί
  choice: എനിക്കുവേണ്ടി
  rationale: യേശുവിനെ ലക്ഷ്യമാക്കി ചെയ്ത പ്രവൃത്തി എന്ന ബന്ധാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിലെ ‘എന്നിൽ’ എന്ന രൂപവും ‘എന്റെമേൽ’ എന്ന സന്ദർഭസാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: സ്ത്രീയെ വിമർശിച്ചവരോടുള്ള യേശുവിന്റെ പ്രതികരണത്തിലെ മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: καλὸν ἔργον എന്നതിൽ സ്ത്രീയുടെ പ്രവൃത്തിക്കു നൽകുന്ന വിലയിരുത്തൽ
  choice: മനോഹരമായ ഒരു പ്രവൃത്തി
  alternative: നല്ല ഒരു പ്രവൃത്തി; ശ്രേഷ്ഠമായ ഒരു പ്രവൃത്തി
  rationale: പ്രവൃത്തിയുടെ നന്മയും സന്ദർഭോചിതമായ ഭംഗിയും നിലനിർത്തുന്നു; പ്രത്യേക പുണ്യസിദ്ധാന്തമോ കൂദാശാവ്യാഖ്യാനമോ ചേർക്കുന്നില്ല.
- issue: ἐν ἐμοί എന്ന പ്രയോഗത്തിന്റെ ബന്ധാർഥം
  choice: എനിക്കുവേണ്ടി
  alternative: എന്നിൽ; എന്നോട്; എന്റെമേൽ
  rationale: പ്രവൃത്തി യേശുവിലേക്കു വ്യക്തിപരമായി തിരിഞ്ഞതാണെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; അഭിഷേകത്തിന്റെ ഭൗതിക ദിശ മാത്രം നിർബന്ധിച്ച് വ്യക്തമാക്കാതെ മൂലത്തിലെ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. ‘വിട്ടേക്കൂ’ ആജ്ഞയുടെ അടിയന്തരതയും സംരക്ഷണഭാവവും സൂക്ഷിക്കുന്നു; ‘മനോഹരമായ ഒരു പ്രവൃത്തി’ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ καλός എന്ന പദത്തിന്റെ സമൃദ്ധമായ അർഥഛായ നിലനിർത്തുന്നു.
