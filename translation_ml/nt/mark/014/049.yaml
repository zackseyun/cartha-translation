revisions:
- from: ദിവസവും ഞാൻ ദേവാലയത്തിൽ നിങ്ങളുടെ ഇടയിൽ ഉപദേശിച്ചുകൊണ്ടിരുന്നു; എന്നിട്ടും നിങ്ങൾ എന്നെ പിടിച്ചില്ല.[a] എന്നാൽ തിരുവെഴുത്തുകൾ നിവൃത്തിയാകേണ്ടതിന് ഇങ്ങനെ സംഭവിക്കുന്നു.[b]
  to: ദിവസേന ഞാൻ ദേവാലയത്തിൽ നിങ്ങളോടുകൂടെ ഉപദേശിച്ചുകൊണ്ടിരുന്നു; നിങ്ങൾ എന്നെ പിടികൂടിയില്ല.[a] എന്നാൽ, തിരുവെഴുത്തുകൾ നിവൃത്തിയാകേണ്ടതിന് ഇതെല്ലാം സംഭവിച്ചു.[b]
  rationale: 'The revision removes the added concessive force of ‘എന്നിട്ടും,’ renders Jesus’ presence with the group more directly, and replaces the present-tense explanatory addition with a minimal contextual completion of the Greek elliptical purpose clause. It preserves the source’s theological restraint: Scripture is fulfilled, without specifying an agent or imposing a stronger deterministic claim.'
