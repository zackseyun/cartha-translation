source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: ml
  text: ദിവസേന ഞാൻ ദേവാലയത്തിൽ നിങ്ങളോടുകൂടെ ഉപദേശിച്ചുകൊണ്ടിരുന്നു; നിങ്ങൾ എന്നെ പിടികൂടിയില്ല.[a] എന്നാൽ, തിരുവെഴുത്തുകൾ നിവൃത്തിയാകേണ്ടതിന് ഇതെല്ലാം സംഭവിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പിടികൂടിയില്ല’ എന്നതിന് ‘അറസ്റ്റ് ചെയ്തില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ ഈ ഭാഗം അപൂർണ്ണമായ ഉദ്ദേശ്യവാക്യമാണ്: അക്ഷരാർഥത്തിൽ, ‘എന്നാൽ തിരുവെഴുത്തുകൾ നിവൃത്തിയാകേണ്ടതിന്.’ സന്ദർഭത്തിൽനിന്ന് സൂചിപ്പിക്കപ്പെടുന്ന മുഖ്യവാക്യം വ്യക്തമാക്കാനാണ് ‘ഇതെല്ലാം സംഭവിച്ചു’ എന്നു ചേർത്തിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: ദിവസവും
  rationale: ഓരോ ദിവസവും എന്ന ആവർത്തനാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: ഞാൻ നിങ്ങളുടെ ഇടയിൽ ... ഇരുന്നു
  rationale: യേശു അവരുടെ മുമ്പിൽ പരസ്യമായി സന്നിഹിതനായിരുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെയും അങ്കണങ്ങളെയും സൂചിപ്പിക്കുന്നു; പൊതുവായ മലയാളപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: διδάσκων
  choice: ഉപദേശിച്ചുകൊണ്ടിരുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപത്തിലെ തുടർച്ചയായ പ്രവർത്തനം മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οὐκ ἐκρατήσατέ με
  choice: നിങ്ങൾ എന്നെ പിടിച്ചില്ല
  rationale: κρατέω എന്നതിന്റെ പിടികൂടുക/അറസ്റ്റ് ചെയ്യുക എന്നീ അർഥസാധ്യതകൾക്കിടയിൽ വിശാലത നിലനിർത്തുന്നു.
- source_word: ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί
  choice: എന്നാൽ തിരുവെഴുത്തുകൾ നിവൃത്തിയാകേണ്ടതിന് ഇങ്ങനെ സംഭവിക്കുന്നു
  rationale: ഗ്രീക്കിലെ അപൂർണ്ണമായ ഉദ്ദേശ്യവാക്യം വായനാസൗകര്യത്തിനായി കുറഞ്ഞ തോതിൽ പൂർത്തിയാക്കുന്നു; തിരുവെഴുത്തുകളുടെ നിവൃത്തിയെന്ന ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അപൂർണ്ണമായ ἀλλ’ ἵνα വാക്യവും ദൈവിക ഉദ്ദേശ്യവും
  choice: എന്നാൽ തിരുവെഴുത്തുകൾ നിവൃത്തിയാകേണ്ടതിന് ഇങ്ങനെ സംഭവിക്കുന്നു
  alternative: എന്നാൽ തിരുവെഴുത്തുകൾ നിവൃത്തിയാകേണ്ടതിന്
  rationale: മൂലത്തിൽ മുഖ്യക്രിയ സൂചിതമായിരിക്കെ പ്രസ്താവിച്ചിട്ടില്ല. മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കാൻ ‘ഇങ്ങനെ സംഭവിക്കുന്നു’ ചേർക്കുന്നു; എന്നാൽ ദൈവിക നിർണയത്തെ മൂലത്തേക്കാൾ ശക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദേവാലയം’ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പദമാണ്; ഇവിടെ അത് അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെയും സൂചിപ്പിക്കുന്നു.
