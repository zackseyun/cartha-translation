source:
  edition: SBLGNT
  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: ml
  text: ഒരു യുവാവ് നഗ്നശരീരത്തിന്മേൽ ഒരു ലിനൻ തുണി[a] മാത്രം ധരിച്ച് അവനെ പിന്തുടരുന്നുണ്ടായിരുന്നു; അവർ അവനെ പിടിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ലിനൻ വിരിപ്പ്.’ ഗ്രീക്കിലെ σινδών എന്ന പദം ലിനൻ തുണിയെയോ വിരിപ്പുപോലുള്ള വസ്ത്രത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: ഒരു യുവാവ്
  rationale: νεανίσκος എന്നത് യുവാവിനെ സൂചിപ്പിക്കുന്നു; τις നൽകുന്ന അനിശ്ചിതത്വം മലയാളത്തിലെ ‘ഒരു’ സ്വാഭാവികമായി നിലനിർത്തുന്നു. ‘ഒരു പ്രത്യേക യുവാവ്’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽക്കാൾ അധിക ഊന്നൽ വരാം.
- source_word: συνηκολούθει
  choice: പിന്തുടരുന്നുണ്ടായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തി ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവനെ
  rationale: സന്ദർഭത്തിൽ സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു; പേര് മൂലവാക്യത്തിൽ ഇല്ലാത്തതിനാൽ സർവനാമം തന്നെ നിലനിർത്തി.
- source_word: περιβεβλημένος
  choice: ധരിച്ച്
  rationale: περιβάλλω-യുടെ കൃതന്തം ഇവിടെ ശരീരത്തിനുചുറ്റും വസ്ത്രം ധരിച്ചിരിക്കുന്ന അവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്; ‘ധരിച്ച്’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: σινδόνα
  choice: ഒരു ചണവസ്ത്രം
  rationale: σινδών ചണനൂൽകൊണ്ടുള്ള തുണിയെയോ വിരിപ്പുപോലുള്ള വസ്ത്രത്തെയോ സൂചിപ്പിക്കാം. പ്രധാനവാചകത്തിൽ പൊതുവായ ‘ചണവസ്ത്രം’ ഉപയോഗിച്ച് രൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: ἐπὶ γυμνοῦ
  choice: നഗ്നശരീരത്തിനുമേൽ ... മാത്രം
  rationale: വസ്ത്രം ശരീരത്തിൽ നേരിട്ട് ധരിച്ചിരുന്നുവെന്നും മറ്റൊന്നും ധരിച്ചിരുന്നില്ലെന്നും ഈ ഘടന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κρατοῦσιν
  choice: അവർ ... പിടിച്ചു
  rationale: κρατέω ഇവിടെ ബലമായി പിടികൂടുന്നതാണ്; ‘അറസ്റ്റ് ചെയ്തു’ എന്ന നിയമപരമായ അധികവ്യാഖ്യാനം ഒഴിവാക്കി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാളകഥനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകി.
- source_word: αὐτόν
  choice: അവനെ
  rationale: ഇത് പുതുതായി പരിചയപ്പെടുത്തിയ യുവാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
