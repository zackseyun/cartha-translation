  terminology: Replace ‘ചണവസ്ത്രം’ and ‘ചണവിരിപ്പ്’ with ‘ലിനൻ തുണി’ and ‘ലിനൻ വിരിപ്പ്.’ This preserves the specific linen material without falsely identifying it as jute. The footnote retains the unresolved question of the cloth’s precise form.
  issues:
  - severity: medium
    issue: ‘ചണവസ്ത്രം’ identifies the fabric as jute.
