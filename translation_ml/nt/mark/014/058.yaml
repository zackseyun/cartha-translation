  terminology: ‘ദൈവാലയം,’ ‘കൈകൊണ്ടുണ്ടാക്കിയ,’ and ‘കൈകൊണ്ടുണ്ടാക്കാത്ത’ are accurate, appropriately formal, and preserve the deliberate Greek contrast. ‘മറ്റൊന്ന്’ naturally carries the implied noun without unwarranted interpretation.
  issues:
  - severity: medium
    issue: Direct-quotation and indirect-speech forms are mixed.
