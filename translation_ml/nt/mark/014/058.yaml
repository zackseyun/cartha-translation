id: MRK.14.58
reference: Mark 14:58
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: ml
  text: 'എന്ന്: “ഞങ്ങൾ അവൻ പറയുന്നതു കേട്ടു: ‘ഞാൻ കൈകൊണ്ടുണ്ടാക്കിയ ഈ ദൈവാലയം[a] തകർക്കും; മൂന്നു ദിവസത്തിനുള്ളിൽ കൈകൊണ്ടുണ്ടാക്കാത്ത മറ്റൊന്ന് പണിയും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൈകൊണ്ടുണ്ടാക്കിയ”, “കൈകൊണ്ടുണ്ടാക്കാത്ത” എന്നീ പ്രയോഗങ്ങൾ χειροποίητον, ἀχειροποίητον എന്നീ ഗ്രീക്ക് പദങ്ങൾ തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: എന്നു
  rationale: സാക്ഷിമൊഴിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന പ്രഖ്യാപനാർഥക പ്രയോഗം; കാരണാർഥകമായ ‘എന്തുകൊണ്ടെന്നാൽ’ അല്ല.
- source_word: Ἡμεῖς
  choice: ഞങ്ങൾ
  rationale: സാക്ഷികളുടെ സ്വയം ഊന്നിപ്പറച്ചിൽ നിലനിർത്താൻ വ്യക്തമായ സർവനാമം ചേർത്തു.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: അവൻ പറയുന്നത് ഞങ്ങൾ കേട്ടു
  rationale: ജെനിറ്റീവ് പാർട്ടിസിപ്പിൾ ഘടനയുടെ തുടർച്ചാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καταλύσω
  choice: ഞാൻ തകർക്കും
  rationale: ഒരു കെട്ടിടത്തെ പൊളിച്ചുകളയുക/നശിപ്പിക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ναὸν τοῦτον
  choice: ഈ ദൈവാലയം
  rationale: ναός എന്നതിന്റെ ദൈവാലയസംബന്ധമായ അർഥവും τοῦτον എന്ന സൂചനാഭാവവും നിലനിർത്തുന്നു.
- source_word: χειροποίητον
  choice: കൈകൊണ്ടുണ്ടാക്കിയ
  rationale: ἀχειροποίητον എന്ന വിപരീതപദവുമായി രൂപപരവും ആശയപരവുമായ സമാന്തരത സംരക്ഷിക്കുന്നു.
- source_word: διὰ τριῶν ἡμερῶν
  choice: മൂന്നു ദിവസത്തിനുള്ളിൽ
  rationale: διά + genitive ഇവിടെ പ്രവർത്തനം സംഭവിക്കുന്ന കാലപരിധിയെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘മൂന്നു ദിവസത്തിൽ’ എന്നും സാധ്യമാണ്.
- source_word: ἄλλον
  choice: മറ്റൊന്ന്
  rationale: ആദ്യത്തേതിനു പകരമായി മറ്റൊരു ദൈവാലയം എന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ἀχειροποίητον
  choice: കൈകൊണ്ടുണ്ടാക്കാത്ത
  rationale: χειροποίητον എന്നതോടുള്ള ഉദ്ദേശ്യപൂർവമായ വിരോധം അതേ പദരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἰκοδομήσω
  choice: ഞാൻ പണിയും
  rationale: ‘വീണ്ടും പണിയും’ എന്ന അധിക അർഥം ചേർക്കാതെ οἰκοδομέωയുടെ അടിസ്ഥാനാർഥം നൽകുന്നു.
theological_decisions:
- issue: ഈ പ്രസ്താവന ശത്രുതാപരമായ സാക്ഷിമൊഴിയുടെ ഭാഗമാണെന്നത് വിവർത്തനത്തിൽ എങ്ങനെ കാണിക്കണം
  choice: വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ ഉദ്ധരിച്ച സാക്ഷിമൊഴിയായി നിലനിർത്തി
  alternative: ഇത് യേശുവിന്റെ വാക്കുകളുടെ വളച്ചൊടിക്കലാണെന്ന് പരാവർത്തനത്തിലൂടെ വ്യക്തമാക്കുക
  rationale: വാക്യം സാക്ഷികൾ അവകാശപ്പെട്ടത് റിപ്പോർട്ട് ചെയ്യുന്നു; മറ്റു ഭാഗങ്ങളുമായി സമന്വയിപ്പിക്കുന്ന വിശദീകരണം മൂലപാഠത്തിൽ ചേർക്കരുത്.
- issue: ദൈവാലയത്തെക്കുറിച്ചുള്ള ‘കൈകൊണ്ടുണ്ടാക്കിയ’ / ‘കൈകൊണ്ടുണ്ടാക്കാത്ത’ വൈരുധ്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ അനുരണനം
  choice: മൂലത്തിലെ ദൃശ്യമായ പദവൈരുധ്യം അതേപടി സംരക്ഷിച്ചു
  alternative: ‘മനുഷ്യനിർമിതം’ / ‘ദൈവികം’ എന്ന വ്യാഖ്യാനപരമായ ഭാഷ ഉപയോഗിക്കുക
  rationale: വൈരുധ്യത്തിന് ദൈവശാസ്ത്രപരമായ പ്രാധാന്യം ഉണ്ടായേക്കാമെങ്കിലും അതിന്റെ അർഥം വിവർത്തനം മുൻകൂട്ടി തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭാഷ. സാക്ഷികളുടെ ഊന്നൽ നിലനിർത്താൻ ‘ഞങ്ങൾ’ വ്യക്തമായി ചേർത്തിരിക്കുന്നു. ഉദ്ധരണിക്കുള്ളിലെ ഭാവികാല ക്രിയകളെ മലയാളത്തിലെ പരോക്ഷ ഉദ്ധരണിരീതിയായ ‘എന്നും ... എന്നും’ ഉപയോഗിച്ച് ബന്ധിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
