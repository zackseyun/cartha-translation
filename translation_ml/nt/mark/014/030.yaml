id: MRK.14.30
reference: Mark 14:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറയുന്നു: “സത്യമായി ഞാൻ നിന്നോടു പറയുന്നു: ഇന്ന്, ഈ രാത്രിയിൽത്തന്നെ, കോഴി രണ്ടുപ്രാവശ്യം കൂവുന്നതിനുമുമ്പ് നീ മൂന്നുപ്രാവശ്യം എന്നെ തള്ളിപ്പറയും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി ആഖ്യാനത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: Ἀμὴν λέγω σοι
  choice: സത്യമായി ഞാൻ നിന്നോടു പറയുന്നു
  rationale: സഗൗരവമായ ഉറപ്പുപറച്ചിലിന്റെ ശക്തിയും നേരിട്ടുള്ള ഏകവചന അഭിസംബോധനയും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃
  choice: ഇന്ന്, ഈ രാത്രിയിൽത്തന്നെ
  rationale: ഗ്രീക്കിലുള്ള രണ്ട് കാലസൂചനകളും ഒഴിവാക്കാതെ, രണ്ടാമത്തേതിന്റെ ഊന്നൽ ‘-ത്തന്നെ’ വഴി പ്രകടമാക്കുന്നു.
- source_word: δὶς ἀλέκτορα φωνῆσαι
  choice: കോഴി രണ്ടുപ്രാവശ്യം കൂവുന്നതിനുമുമ്പ്
  rationale: കോഴിയുടെ കൂവലിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; മർക്കോസിലെ നിർണായകമായ ‘രണ്ടുപ്രാവശ്യം’ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: τρίς ⸂με ἀπαρνήσῃ⸃
  choice: നീ മൂന്നുപ്രാവശ്യം എന്നെ തള്ളിപ്പറയും
  rationale: വ്യക്തിയെ അറിയില്ലെന്നോ ബന്ധമില്ലെന്നോ നിരാകരിക്കുന്ന അർഥം ‘തള്ളിപ്പറയും’ വ്യക്തമായി നൽകുന്നു; പ്രകടമായ σὺ ‘നീ’യായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: σήμερον എന്നും ταύτῃ τῇ νυκτί എന്നും ചേർന്ന കാലപ്രയോഗം
  choice: ‘ഇന്ന്, ഈ രാത്രിയിൽത്തന്നെ’ എന്നിങ്ങനെ രണ്ടും നിലനിർത്തി
  alternative: ‘ഈ രാത്രിയിൽത്തന്നെ’ എന്നു മാത്രം ചുരുക്കുക
  rationale: മൂലപാഠത്തിലെ ആവർത്തനാത്മക ഊന്നലും പ്രവചനത്തിന്റെ അടിയന്തരതയും നഷ്ടപ്പെടാതിരിക്കാൻ രണ്ടും വിവർത്തനം ചെയ്തു.
- issue: മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം
  choice: ‘യേശു ... പറയുന്നു’
  alternative: ‘യേശു ... പറഞ്ഞു’
  rationale: λέγει എന്ന വർത്തമാനകാലരൂപം ശൈലിപരമായി സംരക്ഷിച്ചു; മലയാളത്തിൽ ഇത് ഗ്രഹിക്കാവുന്നതും സജീവവുമാണ്.
- issue: ἀπαρνέομαι എന്ന ക്രിയയുടെ ബന്ധനിരാകരണ അർഥം
  choice: ‘എന്നെ തള്ളിപ്പറയും’
  alternative: ‘എന്നെ അറിയില്ലെന്നു പറയും’ അഥവാ ‘എന്നെ നിഷേധിക്കും’
  rationale: പത്രോസ് പറയാനിരിക്കുന്ന കൃത്യമായ വാക്കുകൾ മുൻകൂട്ടി ചേർക്കാതെ, വ്യക്തിയുമായുള്ള ബന്ധം നിരാകരിക്കുന്ന വിശാലമായ അർഥം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ചരിത്രവർത്തമാനകാലവും ‘ഇന്ന്, ഈ രാത്രിയിൽത്തന്നെ’ എന്ന മൂലപാഠത്തിലെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു. ഈ വാക്യത്തിന് ആവശ്യമായ പ്രത്യേക പാഠഭേദക്കുറിപ്പില്ല; നൽകിയ ഇംഗ്ലീഷ് കുറിപ്പിലെ വാചകം പ്രധാനപാഠത്തിന്റെ തന്നെയുള്ള പുനരാവർത്തനമായതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
