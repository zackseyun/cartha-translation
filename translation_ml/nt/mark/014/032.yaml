source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: ml
  text: 'അവർ ഗെത്ത്ശെമനേ എന്നു പേരുള്ള ഒരു സ്ഥലത്ത് എത്തി. അവൻ തന്റെ ശിഷ്യന്മാരോട് പറഞ്ഞു: “ഞാൻ പ്രാർഥിക്കുന്നതുവരെ ഇവിടെ ഇരിക്കൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: എത്തി
  rationale: വിവരണത്തിൽ ചരിത്രവർത്തമാനകാലമായി വന്നിരിക്കുന്ന ഗ്രീക്ക് രൂപം മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാല ആഖ്യാനരീതിയിൽ നൽകി.
- source_word: χωρίον
  choice: സ്ഥലം
  rationale: സ്വത്ത്, ഭൂവിഭാഗം, തോട്ടം തുടങ്ങിയ പ്രത്യേക അർഥങ്ങൾ നിർബന്ധിക്കാതെ χωρίον എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: ഗെത്ത്ശെമന എന്നു പേരുള്ള
  rationale: ഗ്രീക്ക് ഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം മലയാളത്തിൽ അതേപടി നൽകിയാൽ കാലമാറ്റം അസ്വാഭാവികമാകാം; തുടർച്ചയായ ഭൂതകാല ആഖ്യാനം കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: μαθηταῖς
  choice: ശിഷ്യന്മാരോട്
  rationale: ഗുരു-ശിഷ്യബന്ധം കൃത്യമായി സൂചിപ്പിക്കുന്ന, സുവിശേഷങ്ങളിൽ പരിചിതമായ മലയാളപദം.
- source_word: Καθίσατε
  choice: ഇരിക്കൂ
  rationale: നേരിട്ടുള്ള കല്പനയെ മാന്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: സ്ഥലസൂചകമായ ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള തുല്യപദം.
- source_word: ἕως προσεύξωμαι
  choice: ഞാൻ പ്രാർഥിക്കുന്നതുവരെ
  rationale: ἕως കൂടിയുള്ള aorist subjunctive സൂചിപ്പിക്കുന്ന സമയപരിധി നിലനിർത്തുന്നു; ‘പ്രാർഥിക്കുമ്പോൾ’ എന്നത് ദൈർഘ്യത്തിന് അനാവശ്യ ഊന്നൽ നൽകും.
