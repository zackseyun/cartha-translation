  yaml_path: translation/nt/mark/014/059.yaml
  text: And not even in this way was their testimony consistent[a].
translation:
  language: ml
  text: ഇങ്ങനെയായിട്ടുപോലും അവരുടെ സാക്ഷ്യം തമ്മിൽ യോജിച്ചില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ സാക്ഷ്യം പൊരുത്തപ്പെട്ടില്ല’; കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘അവരുടെ സാക്ഷ്യം തുല്യമായിരുന്നില്ല.’
    reason: ἴση എന്ന പദം അക്ഷരാർഥത്തിൽ ‘തുല്യമായ’ എന്നാണ്; ഈ ന്യായവ്യവഹാരസന്ദർഭത്തിൽ സാക്ഷിമൊഴികൾ തമ്മിൽ യോജിക്കുകയോ പൊരുത്തപ്പെടുകയോ ചെയ്തില്ല എന്നതാണ് ഉദ്ദേശ്യം.
lexical_decisions:
- source_word: καὶ
  choice: എന്നിട്ടും
  rationale: മുൻവാക്യത്തിലെ സാക്ഷിമൊഴികളുടെ പൊരുത്തക്കേടുമായി വാക്യത്തെ ബന്ധിപ്പിക്കുന്നു; οὐδὲയോടൊപ്പമുള്ള സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാള ആഖ്യാനബന്ധം നൽകുന്നു.
- source_word: οὐδὲ
  choice: പോലും ... ഇല്ല
  rationale: ഊന്നലോടുകൂടിയ നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: തൊട്ടുമുമ്പ് വിവരിച്ച ആരോപണരീതിയിലേക്കോ സാക്ഷിമൊഴിയുടെ രൂപത്തിലേക്കോ തിരിച്ചുചൂണ്ടുന്ന നിർദ്ദേശാർഥം നിലനിർത്തുന്നു.
- source_word: ἴση
  choice: പൊരുത്തപ്പെട്ട
  rationale: അക്ഷരാർഥം ‘തുല്യമായ’ എന്നാണെങ്കിലും, പല സാക്ഷികളുടെ മൊഴികൾ തമ്മിൽ ഒത്തിരുന്നില്ല എന്ന ന്യായവ്യവഹാരസന്ദർഭത്തിലെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἦν
  choice: ഇല്ല
  rationale: ἴσηയോടുകൂടിയ ഭൂതകാലാവസ്ഥയെ മലയാളത്തിലെ ‘പൊരുത്തപ്പെട്ടില്ല’ എന്ന ക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളിക്കുന്നു.
- source_word: ἡ μαρτυρία
  choice: സാക്ഷ്യം
  rationale: ന്യായവ്യവഹാരസന്ദർഭത്തിൽ μαρτυρία സാക്ഷിമൊഴിയെയോ സാക്ഷ്യത്തെയോ സൂചിപ്പിക്കുന്നു; ഏകവചനരൂപവും നിലനിർത്തുന്നു.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: ജനിറ്റീവ് ബഹുവചനത്തിന്റെ ഉടമസ്ഥതാസംബന്ധം നേരിട്ട് നൽകുന്നു.
