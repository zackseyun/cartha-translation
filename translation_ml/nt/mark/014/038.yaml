reference: Mark 14:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ml
  text: “ഉണർന്നിരിക്കുകയും പ്രാർഥിക്കുകയും ചെയ്യുക, നിങ്ങൾ പ്രലോഭനത്തിൽ[a] അകപ്പെടാതിരിക്കേണ്ടതിന്. ആത്മാവ് സന്നദ്ധമാണെങ്കിലും, ജഡം ബലഹീനമാണ്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പരീക്ഷണത്തിൽ” അല്ലെങ്കിൽ “കഷ്ടപരീക്ഷയിൽ”; ഗ്രീക്ക് πειρασμόν എന്ന പദത്തിന് ഈ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: ഉണർന്നിരിക്കുക
  rationale: ബഹുവചന വർത്തമാനകാല ആജ്ഞ; ഗെത്ത്ശെമനെയിലെ സാഹചര്യത്തിൽ ഉറങ്ങാതെ ഉണർന്നിരിക്കുക എന്ന നേരിട്ടുള്ള അർഥവും ജാഗ്രത പാലിക്കുക എന്ന ധ്വനിയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: προσεύχεσθε
  choice: പ്രാർഥിക്കുക
  rationale: തുടർച്ചയായ പ്രവൃത്തിയിലേക്കുള്ള ബഹുവചന ആജ്ഞയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἵνα μὴ ἔλθητε
  choice: അകപ്പെടാതിരിക്കേണ്ടതിന്
  rationale: ἵνα μή സഹിതമുള്ള ഉപവാക്യത്തിന്റെ പ്രതിരോധാത്മക ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു. പദശഃ ‘പ്രവേശിക്കുക’ എന്നതിനെക്കാൾ πειρασμόν-നോടൊപ്പം ‘അകപ്പെടുക’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: εἰς πειρασμόν
  choice: പ്രലോഭനത്തിൽ
  rationale: πειρασμός എന്ന പദത്തിന്റെ പ്രലോഭനം, പരീക്ഷണം, കഷ്ടപരീക്ഷ എന്നീ അർഥസാധ്യതകളിൽ ഈ മുന്നറിയിപ്പിന്റെ സാഹചര്യത്തിന് ‘പ്രലോഭനം’ ഏറ്റവും യോജിക്കുന്നു; വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τὸ μὲν πνεῦμα
  choice: ആത്മാവ് സന്നദ്ധംതന്നെ
  rationale: ഇവിടെ πνεῦμα ജഡത്തോടുള്ള വൈരുധ്യത്തിൽ മനുഷ്യന്റെ ആന്തരിക മനോഭാവത്തെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. μέν-ന്റെ ഊന്നൽ ‘തന്നെ’ വഴി സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: πρόθυμον
  choice: സന്നദ്ധം
  rationale: സന്നദ്ധത, മനസ്സൊരുക്കം, ഉത്സുകത എന്നിവ സൂചിപ്പിക്കുന്ന πρόθυμος-ന് ഈ പ്രസംഗസന്ദർഭത്തിൽ ‘സന്നദ്ധം’ സംക്ഷിപ്തവും മാന്യവുമായ തുല്യപദമാണ്.
- source_word: ἡ δὲ σὰρξ
  choice: എന്നാൽ ജഡം
  rationale: σάρξ-നെ ‘പാപസ്വഭാവം’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കാതെ, മനുഷ്യന്റെ ദൗർബല്യത്തെ സൂചിപ്പിക്കുന്ന ആത്മാവ്–ജഡം വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἀσθενής
  choice: ബലഹീനമാണ്
  rationale: ആന്തരിക സന്നദ്ധതയ്ക്കു വിപരീതമായ മനുഷ്യദൗർബല്യത്തെ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: πνεῦμα എന്നതിന്റെ സൂചിതാർഥം
  choice: മനുഷ്യാത്മാവ് / ആന്തരിക സന്നദ്ധത
  alternative: പരിശുദ്ധാത്മാവ്
  rationale: ഉറക്കത്തോടു പോരാടുന്ന ശിഷ്യരോടുള്ള അഭിസംബോധനയും ‘ജഡം’ എന്നതിനോടുള്ള നേരിട്ടുള്ള വൈരുധ്യവും മനുഷ്യന്റെ ആന്തരിക മനോഭാവത്തെയാണ് കൂടുതൽ സാധ്യതയുള്ളതാക്കുന്നത്. എന്നിരുന്നാലും പരിഭാഷയിൽ വിശദീകരണം ചേർക്കാതെ ‘ആത്മാവ്’ എന്ന പദം തന്നെ നിലനിർത്തുന്നു.
- issue: σάρξ എന്നതിന്റെ അവതരണം
  choice: ജഡം
  alternative: ശരീരം; പാപസ്വഭാവം
  rationale: ഇവിടെ ഊന്നൽ പ്രത്യേകമായ ഒരു പാപസ്വഭാവസിദ്ധാന്തത്തിലല്ല, മനുഷ്യന്റെ ദൗർബല്യത്തിലാണ്. ‘ജഡം’ മൂലപദത്തിന്റെ രൂപകപരവും മാനവശാസ്ത്രപരവുമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: πειρασμός എന്നതിന്റെ അർഥപരിധി
  choice: പ്രലോഭനം
  alternative: പരീക്ഷണം; കഷ്ടപരീക്ഷ
  rationale: ശിഷ്യന്മാർ വീഴാൻ സാധ്യതയുള്ള സാഹചര്യത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിൽ ‘പ്രലോഭനം’ യോജിക്കുന്നു; എന്നാൽ ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഉണർന്നിരിക്കുക’ സന്ദർഭത്തിലെ ശാരീരിക ജാഗരണവും ആത്മീയ ജാഗ്രതയുടെ ധ്വനിയും നിലനിർത്തുന്നു. ‘ആത്മാവ്–ജഡം’ എന്ന ഘടന വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സൂക്ഷിക്കുന്നു.
