lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനവും ആഖ്യാനത്തിലെ തുടർച്ചയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀπελθὼν
  choice: മാറിപ്പോയി
  rationale: മറ്റുള്ളവരിൽനിന്ന് അകന്നുപോകുന്ന മുൻപ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: προσηύξατο
  choice: പ്രാർഥിച്ചു
  rationale: പ്രσεύχομαι എന്ന ക്രിയയുടെ സാധാരണവും വ്യക്തവുമായ മലയാള പരിഭാഷയാണ്; ഗ്രീക്കിലെ മധ്യമപ്രയോഗം ഇവിടെ വേറിട്ട് അടയാളപ്പെടുത്തേണ്ടതില്ല.
- source_word: τὸν αὐτὸν λόγον
  choice: അതേ വാക്കുകൾ
  rationale: λόγος ഏകവചനത്തിലാണെങ്കിലും ഇവിടെ മുമ്പ് നടത്തിയ പ്രാർഥനയുടെ ഉള്ളടക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അതേ വാക്കുകൾ’ മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കി ആവർത്തിച്ച പ്രാർഥന സ്വാഭാവികമായി അറിയിക്കുന്നു, അതേസമയം അടിക്കുറിപ്പ് ഏകവചന രൂപം സൂചിപ്പിക്കുന്നു.
- source_word: εἰπών
  choice: പറഞ്ഞ്
  rationale: പ്രാർഥന എങ്ങനെ നടത്തിയെന്നു വ്യക്തമാക്കുന്ന അനുബന്ധ പ്രവൃത്തിയായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
