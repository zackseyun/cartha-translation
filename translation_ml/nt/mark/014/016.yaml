source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: ml
  text: ശിഷ്യന്മാർ പുറപ്പെട്ടു നഗരത്തിലേക്കു ചെന്നു; അവൻ അവരോടു പറഞ്ഞതുപോലെതന്നെ അവർ കണ്ടെത്തി; അവർ പെസഹ[a] ഒരുക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പെസഹാഭോജനം.’ ഗ്രീക്കുപദം പെസഹയെ പൊതുവായി, അല്ലെങ്കിൽ ഈ സന്ദർഭത്തിൽ ഒരുക്കിക്കൊണ്ടിരുന്ന പെസഹാഭോജനത്തെ, സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: പുറപ്പെട്ടു
  rationale: മുമ്പുണ്ടായിരുന്ന സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: യേശുവിനെ അനുഗമിക്കുകയും അവനിൽനിന്ന് പഠിക്കുകയും ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന സുവിശേഷങ്ങളിലെ പതിവുപദം.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: നഗരത്തിൽ ചെന്നു
  rationale: നഗരത്തിനകത്തേക്കുള്ള യാത്ര വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ഗ്രീക്കിലെ ചലനദിശ സംരക്ഷിക്കുന്നു.
- source_word: πόλιν
  choice: നഗരം
  rationale: πόλις എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം; സന്ദർഭത്തിൽ യെരൂശലേമിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും പേര് മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: εὗρον
  choice: അവർ കണ്ടു
  rationale: പ്രതീക്ഷിച്ച സാഹചര്യങ്ങൾ യേശു പറഞ്ഞതുപോലെ തന്നെയാണെന്ന് അവർ കണ്ടെത്തിയെന്ന അർഥം നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമായ കർമം ഇല്ലാത്തതിനാൽ മലയാളത്തിലും അത് പ്രത്യേകം ചേർത്തിട്ടില്ല.
- source_word: καθὼς εἶπεν αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞിരുന്നതുപോലെതന്നെ
  rationale: καθώς സൂചിപ്പിക്കുന്ന കൃത്യമായ പൊരുത്തവും, മുമ്പ് നൽകിയ നിർദേശത്തെ സൂചിപ്പിക്കുന്ന കാലബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡτοίμασαν
  choice: ഒരുക്കി
  rationale: ആവശ്യമായ ക്രമീകരണങ്ങൾ ചെയ്തു സജ്ജമാക്കി എന്ന ἑτοιμάζωയുടെ അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὸ πάσχα
  choice: പെസഹ
  rationale: യഹൂദ പെസഹയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിത മലയാളപദം; ഉത്സവത്തെയോ ഈ സന്ദർഭത്തിലെ പെസഹാഭോജനത്തെയോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്കിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὸ πάσχα എന്നതിന്റെ സന്ദർഭാർഥം
  choice: പെസഹ
  alternative: പെസഹാഭോജനം
  rationale: മൂലപദം പെസഹയെ പൊതുവായും സന്ദർഭത്തിൽ അതിന്റെ ഭക്ഷണത്തെയും സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിൽ വിശാലമായ പദം നിലനിർത്തി, കൂടുതൽ നിർദ്ദിഷ്ടമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നത് യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ തുടർച്ചയായ καί ഘടന മുഴുവനായി അനുകരിക്കാതെ, വായനാസൗകര്യത്തിനായി വാക്യവും അർധവിരാമവും ഉപയോഗിച്ചു. യെരൂശലേം എന്നു സന്ദർഭത്തിൽ വ്യക്തമായാലും മൂലപാഠത്തിൽ പേര് ഇല്ലാത്തതിനാൽ ‘നഗരം’ എന്നതുതന്നെ നിലനിർത്തി.
