review_pass:
  verdict: revise
  source_fidelity: The translation accurately renders the poor's continual presence, the indefinite temporal condition ('whenever you wish'), the ability to benefit them, and the contrast with Jesus. However, 'ഉണ്ടായിരിക്കുകയില്ല' is most naturally read as a straightforward future negation ('will not be'), whereas the Greek uses a present-form contrast, 'you do not always have me.' A Malayalam form that preserves the non-future, nonabsolute contrast is preferable.
  naturalness: The wording is clear, modern, and appropriately dignified. 'നിങ്ങളോടുകൂടെ' is natural in this register. Replacing the final verb with 'ഉണ്ടായിരിക്കില്ല' improves idiomatic flow while retaining the source's aspectual ambiguity.
  terminology: '''ദരിദ്രർ'' appropriately represents τοὺς πτωχούς, and ''അവർക്കു നന്മ ചെയ്യാൻ'' suitably conveys εὖ ποιῆσαι without restricting the meaning to monetary aid. The footnote correctly explains that the phrase concerns beneficial action rather than mere goodwill.'
  issues:
  - severity: medium
    issue: The final clause uses 'ഉണ്ടായിരിക്കുകയില്ല.'
    rationale: This construction tends to state a future absence and can sound more absolute than οὐ πάντοτε ἔχετε ('you do not always have'). 'ഉണ്ടായിരിക്കില്ല' more naturally expresses 'will not/not always be present' without unnecessarily converting the Greek present into an explicit future form.
  revised_text: ദരിദ്രർ എപ്പോഴും നിങ്ങളോടുകൂടെ ഉണ്ടല്ലോ; നിങ്ങൾ ആഗ്രഹിക്കുമ്പോഴെല്ലാം അവർക്കു നന്മ ചെയ്യാൻ[a] നിങ്ങൾക്കു കഴിയും. എന്നാൽ ഞാൻ എപ്പോഴും നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കില്ല.
