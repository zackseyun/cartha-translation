id: MRK.14.7
reference: Mark 14:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: ml
  text: ദരിദ്രർ എപ്പോഴും നിങ്ങളോടുകൂടെ ഉണ്ടല്ലോ; നിങ്ങൾ ആഗ്രഹിക്കുമ്പോഴെല്ലാം അവർക്കു നന്മ ചെയ്യാൻ[a] നിങ്ങൾക്കു കഴിയും. എന്നാൽ ഞാൻ എപ്പോഴും നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർക്കു നന്മ ചെയ്യുക’ എന്ന ഗ്രീക്ക് പ്രയോഗം അവരോടു വെറും സദ്ഭാവം തോന്നുക എന്നല്ല, അവർക്കു ഗുണകരമായി പ്രവർത്തിക്കുക എന്നാണ് അർഥമാക്കുന്നത്.
    reason: lexical_clarification
lexical_decisions:
- source_word: πάντοτε γὰρ
  choice: എപ്പോഴും ... ഉണ്ടല്ലോ
  rationale: γάρ മുൻവാക്യത്തെ വിശദീകരിക്കുന്നതിനാൽ, മലയാളത്തിലെ സ്വാഭാവിക വിശദീകരണഭാവമായ ‘ഉണ്ടല്ലോ’ ഉപയോഗിച്ചു; πάντοτε എന്നതിന്റെ കാലവ്യാപ്തി ‘എപ്പോഴും’ നിലനിർത്തുന്നു.
- source_word: τοὺς πτωχοὺς
  choice: ദരിദ്രർ
  rationale: സാമ്പത്തികമായി ദരിദ്രരായ ആളുകളെ സൂചിപ്പിക്കുന്ന നാമവൽക്കരിച്ച വിശേഷണം; ‘ദരിദ്രർ’ സംക്ഷിപ്തവും മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: നിങ്ങളോടുകൂടെ ഉണ്ടല്ലോ
  rationale: അവരുടെ തുടർച്ചയായ സാന്നിധ്യവും സമീപ്യതയും വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘ഉണ്ടായിരിക്കുക’ എന്ന ഘടനയാണ് സ്വാഭാവികം.
- source_word: ὅταν θέλητε
  choice: നിങ്ങൾ ആഗ്രഹിക്കുമ്പോഴെല്ലാം
  rationale: ὅταν സഹിതമുള്ള subjunctive സൂചിപ്പിക്കുന്ന അനിശ്ചിതവും ആവർത്തിക്കാവുന്നതുമായ സമയബന്ധം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: δύνασθε
  choice: നിങ്ങൾക്കു കഴിയും
  rationale: കഴിവിനെയും അവസരത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: അവർക്കു നന്മ ചെയ്യാൻ
  rationale: εὖ ποιέω എന്ന പ്രയോഗത്തിന്റെ ‘അവർക്കു ഗുണകരമായി പ്രവർത്തിക്കുക’ എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ദാനധർമ്മത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἐμὲ δὲ οὐ πάντοτε ἔχετε
  choice: എന്നാൽ ഞാൻ എപ്പോഴും നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കുകയില്ല
  rationale: δέയുടെ വൈരുധ്യം ‘എന്നാൽ’കൊണ്ട് വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ വർത്തമാനരൂപം മലയാളത്തിൽ അക്ഷരാർഥമായി നൽകിയാൽ അസ്വാഭാവികമാകുന്നതിനാൽ, പരിമിതമായ ഭാവിസാന്നിധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന ഘടന സ്വീകരിച്ചു.
theological_decisions:
- issue: ദരിദ്രരോടുള്ള കരുതലിനെ യേശു വിലകുറച്ചുകാണുന്നു എന്ന തെറ്റിദ്ധാരണ
  choice: ദരിദ്രർക്കു നന്മ ചെയ്യാനുള്ള തുടർച്ചയായ അവസരവും യേശുവിന്റെ പരിമിതമായ ശാരീരിക സാന്നിധ്യവും തമ്മിലുള്ള കാലപരമായ വൈരുധ്യം നിലനിർത്തി.
  alternative: യേശു ദരിദ്രരോടുള്ള കരുതൽ തള്ളിക്കളഞ്ഞ് തന്നോടുള്ള ഭക്തിയെ മാത്രം മുൻനിർത്തുന്നു എന്ന വായന.
  rationale: ‘നിങ്ങൾ ആഗ്രഹിക്കുമ്പോഴെല്ലാം അവർക്കു നന്മ ചെയ്യാൻ നിങ്ങൾക്കു കഴിയും’ എന്ന വാക്യം അവരോടുള്ള ഉപകാരപ്രവർത്തനത്തെ വ്യക്തമായി അംഗീകരിക്കുന്നു. അതിനാൽ കരുണയുടെ ബാധ്യത നിഷേധിക്കാതെ പാഠത്തിലെ സാഹചര്യപരമായ വൈരുധ്യം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നിങ്ങളോടുകൂടെ’ എന്ന രൂപം വാക്യത്തിന്റെ ഇരുഭാഗങ്ങളിലുമുള്ള സാന്നിധ്യവൈരുധ്യം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
