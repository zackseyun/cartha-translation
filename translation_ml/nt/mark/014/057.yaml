  to: 'ചിലർ എഴുന്നേറ്റ് അവനെതിരെ കള്ളസാക്ഷ്യം പറഞ്ഞുകൊണ്ടിരുന്നു[a]; അവർ ഇങ്ങനെ പറഞ്ഞു:'
  rationale: The revision makes the imperfect false-testimony verb explicit with “പറഞ്ഞുകൊണ്ടിരുന്നു,” retains the legal adversative sense “അവനെതിരെ,” and uses a natural Malayalam speech introduction for λέγοντες. It avoids adding the temporal nuance of “അപ്പോൾ” to the simple connective καί.
