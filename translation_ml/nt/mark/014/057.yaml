  yaml_path: translation/nt/mark/014/057.yaml
  text: And some stood up and were giving false testimony against him[a], saying,
translation:
  language: ml
  text: 'ചിലർ എഴുന്നേറ്റ് അവനെതിരെ കള്ളസാക്ഷ്യം പറഞ്ഞുകൊണ്ടിരുന്നു[a]; അവർ ഇങ്ങനെ പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെതിരെ വ്യാജസാക്ഷ്യം വഹിച്ചുകൊണ്ടിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: അപ്പോൾ
  rationale: മർക്കോസിന്റെ ലളിതമായ ആഖ്യാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ തുടർസംഭവമായി അവതരിപ്പിക്കുന്നു.
- source_word: τινες
  choice: ചിലർ
  rationale: ആരെന്നു വ്യക്തമാക്കാത്ത ബഹുവചനസൂചന സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἀναστάντες
  choice: എഴുന്നേറ്റുനിന്ന്
  rationale: വിചാരണാസന്ദർഭത്തിൽ സാക്ഷ്യം പറയാനായി എഴുന്നേറ്റുനിൽക്കുന്ന പ്രവൃത്തി വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐψευδομαρτύρουν
  choice: കള്ളസാക്ഷ്യം പറഞ്ഞുകൊണ്ട്
  rationale: നിയമപരമായ സാക്ഷ്യത്തിന്റെ അർത്ഥം നിലനിർത്തുകയും അപൂർണ്ണഭൂതകാലക്രിയ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തിയെ ‘കൊണ്ട്’ എന്ന രൂപത്തിലൂടെ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: κατ’ αὐτοῦ
  choice: അവനെതിരെ
  rationale: κατά + genitive എന്നതിന്റെ ഈ നിയമപരമായ സന്ദർഭത്തിലെ പ്രതികൂല അർത്ഥം കൃത്യമായി നൽകുന്നു.
- source_word: λέγοντες
  choice: 'ഇങ്ങനെ പറഞ്ഞു:'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന സാക്ഷ്യമൊഴിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തെ സ്വാഭാവിക മലയാള ഉദ്ധരണിയാമുഖമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമസന്ദർഭഭാഷ ഉപയോഗിച്ചു. ‘കള്ളസാക്ഷ്യം പറയുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; കൂടുതൽ പദാനുപദമായ ‘വ്യാജസാക്ഷ്യം വഹിക്കുക’ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
