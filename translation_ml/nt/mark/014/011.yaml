id: MRK.14.11
reference: Mark 14:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: ml
  text: അവർ അതു കേട്ടപ്പോൾ സന്തോഷിച്ചു; അവന് പണം[a] കൊടുക്കാമെന്ന് വാഗ്ദാനം ചെയ്തു. അവനെ തക്ക അവസരത്തിൽ എങ്ങനെ ഒറ്റിക്കൊടുക്കാം[b] എന്ന് അവൻ അന്വേഷിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെള്ളി.’ ഗ്രീക്ക് പദം അക്ഷരാർഥത്തിൽ വെള്ളിയെയോ പൊതുവായി പണത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കൈമാറാം.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘കൈമാറുക’ എന്ന അർഥമുണ്ടാകാം; യൂദാസിന്റെ വഞ്ചനാപരമായ പ്രവൃത്തിയുടെ സന്ദർഭമാണ് ഇവിടെ ‘ഒറ്റിക്കൊടുക്കുക’ എന്ന പരിഭാഷയ്ക്ക് അടിസ്ഥാനം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: അവർ അതു കേട്ടപ്പോൾ
  rationale: δέ സഹിതമുള്ള കർത്തൃവാചക പങ്കുപദം മുൻസന്ദർഭത്തോടു ബന്ധപ്പെടുത്തി സമയബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സന്ദർഭത്തിൽനിന്ന് ‘അതു’ ചേർത്തിരിക്കുന്നു.
- source_word: ἐχάρησαν
  choice: സന്തോഷിച്ചു
  rationale: χαίρω എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ അർഥം സന്തോഷിക്കുകയെന്നതാണ്; അവരുടെ പ്രതികരണത്തിന്റെ ശക്തി ലളിതവും നേരിട്ടുമായി നിലനിർത്തുന്നു.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: അവന് പണം കൊടുക്കാമെന്ന് വാഗ്ദാനം ചെയ്തു
  rationale: ἐπαγγέλλομαι എന്നത് വാഗ്ദാനം ചെയ്യുക എന്ന അർഥം നൽകുന്നു. ἀργύριον ഇവിടെ തുകയോ നാണയങ്ങളോ വ്യക്തമാക്കാതെ പ്രതിഫലമായി നൽകുന്ന പണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀργύριον
  choice: പണം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘വെള്ളി’ ആകാമെങ്കിലും കൊയ്നേ ഗ്രീക്കിൽ ഇത് പൊതുവായി പണത്തെയും സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ ‘പണം’ ആധുനിക മലയാളത്തിൽ ഏറ്റവും വ്യക്തമാണ്.
- source_word: ἐζήτει
  choice: അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന ശ്രമത്തെയോ തിരച്ചിലിനെയോ സൂചിപ്പിക്കുന്നു. ‘അന്വേഷിച്ചുകൊണ്ടിരുന്നു’ ആ ദൈർഘ്യസ്വഭാവം നിലനിർത്തുന്നു; ആരംഭഘട്ടമെന്ന ആശയം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: പ്രവൃത്തി നടപ്പാക്കാനുള്ള രീതിയോ മാർഗമോ അന്വേഷിക്കുന്നതിനെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: εὐκαίρως
  choice: തക്ക അവസരത്തിൽ
  rationale: അനുകൂലമോ യോജിച്ചതോ ആയ സമയം/അവസരം എന്ന ആശയം നൽകുന്നു; വാക്യത്തിൽ പറയാത്ത അധിക സാഹചര്യങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: παραδοῖ
  choice: ഒറ്റിക്കൊടുക്കാം
  rationale: παραδίδωμι അടിസ്ഥാനമായി കൈമാറുക എന്ന അർഥം വഹിക്കുമെങ്കിലും യൂദാസിന്റെ വഞ്ചനാപരമായ പ്രവർത്തനസന്ദർഭത്തിൽ ‘ഒറ്റിക്കൊടുക്കുക’ അതിന്റെ നൈതികവും ബന്ധപരവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യൂദാസിന്റെ പ്രവൃത്തിയിൽ παραδίδωμι എന്നതിന്റെ പരിഭാഷ
  choice: ഒറ്റിക്കൊടുക്കുക
  alternative: കൈമാറുക
  rationale: അടിസ്ഥാനക്രിയ നിഷ്പക്ഷമായി ‘കൈമാറുക’ എന്നും അർഥമാക്കാം. എന്നാൽ ഈ കഥാസന്ദർഭത്തിൽ യൂദാസ് യേശുവിന്റെ എതിരാളികളുമായി രഹസ്യമായി സഹകരിക്കുന്നതിനാൽ ‘ഒറ്റിക്കൊടുക്കുക’ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; അതേസമയം പദത്തിന്റെ വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘അന്വേഷിച്ചുകൊണ്ടിരുന്നു’ അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം സൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പുകൾ മുഖ്യപാഠത്തിലെ യഥാക്രമമായ പദങ്ങളോടു ചേർത്തിരിക്കുന്നു.
