id: MRK.14.50
reference: Mark 14:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀφέντες αὐτὸν ⸂ἔφυγον πάντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: ml
  text: അവനെ വിട്ട് എല്ലാവരും ഓടിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: '[പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: മുൻ സംഭവത്തോടുള്ള ലളിതമായ ആഖ്യാനബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിലൂടെ വ്യക്തമാകുന്നു; ‘പിന്നെ’ അല്ലെങ്കിൽ ‘അങ്ങനെ’ എന്നു ചേർത്താൽ ഗ്രീക്കിൽ ഇല്ലാത്ത കാലക്രമമോ നിഗമനഭാവമോ വരാം.
- source_word: ἀφέντες
  choice: വിട്ട്
  rationale: ἀφίημι എന്ന ക്രിയയുടെ ഭൂതകാല പ്രവർത്തക കൃദന്തരൂപം ഇവിടെ ഒരാളെ പിന്നിൽ വിട്ടുകളയുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിട്ട്’ എന്നത് സംക്ഷിപ്തവും സ്വാഭാവികവും; ‘ഉപേക്ഷിച്ച്’ എന്നത് സാധ്യമായെങ്കിലും കൂടുതൽ ശക്തമായ വ്യാഖ്യാനനിറം നൽകും.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: കൂടെ ഉണ്ടായിരുന്നവരുടെ പിന്മാറ്റത്തിന്റെ സമ്പൂർണത വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔφυγον
  choice: ഓടിപ്പോയി
  rationale: φεύγω ഇവിടെ അപകടത്തിൽനിന്നുള്ള പലായനത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘ഓടിപ്പോയി’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; ‘പലായനം ചെയ്തു’ കൂടുതൽ ഔപചാരികമാണ്.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ വിട്ടുപോകലിന്റെ വ്യാപ്തി
  choice: എല്ലാവരും ഓടിപ്പോയി
  alternative: അവരെല്ലാം ഓടിപ്പോയി
  rationale: ഈ നിമിഷത്തിൽ യേശുവിനൊപ്പമുണ്ടായിരുന്നവരുടെ പിന്മാറ്റം സമ്പൂർണമായിരുന്നുവെന്ന വാചകത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ഗ്രീക്ക് പാഠത്തിനപ്പുറം ആരെയെല്ലാം ഉൾപ്പെടുത്തുന്നു എന്ന് വിപുലീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന, സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഉപേക്ഷിച്ച്’ എന്നതിലെ ശക്തമായ വ്യാഖ്യാനഭാവവും ‘പലായനം ചെയ്തു’ എന്നതിലെ അമിത ഔപചാരികതയും ഒഴിവാക്കി.
