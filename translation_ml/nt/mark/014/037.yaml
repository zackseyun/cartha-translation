id: MRK.14.37
reference: Mark 14:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: ml
  text: 'അവൻ വന്ന് അവരെ ഉറങ്ങുന്നതായി കാണുന്നു. അവൻ പത്രോസിനോട് പറയുന്നു: “ശിമോനേ, നീ ഉറങ്ങുകയാണോ? ഒരു മണിക്കൂർ ഉണർന്നിരിക്കാൻ നിനക്കു കഴിഞ്ഞില്ലേ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഒരു മണിക്കൂർ കാവലിരിക്കാനെങ്കിലും നിനക്കു കഴിഞ്ഞില്ലേ?”'
    reason: γρηγορέω ഇവിടെ ‘ഉണർന്നിരിക്കുക’ എന്ന തൽക്ഷണ അർഥം നൽകുമ്പോഴും, ജാഗ്രതയോടെ കാവലിരിക്കുക എന്ന അർഥസൂക്ഷ്മതയും വഹിക്കാം.
lexical_decisions:
- source_word: ἔρχεται
  choice: വന്ന്
  rationale: മർക്കോസിന്റെ ചരിത്രവർത്തമാനത്തിന്റെ സജീവത തുടർന്നുള്ള ‘കാണുന്നു’, ‘പറയുന്നു’ എന്നീ വർത്തമാനക്രിയകളിലൂടെ നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാശൃംഖല ഉപയോഗിച്ചു.
- source_word: εὑρίσκει
  choice: കാണുന്നു
  rationale: ഇവിടെ ‘അവർ ഉറങ്ങുന്നതായി കണ്ടെത്തുന്നു’ എന്നതിനെക്കാൾ ‘അവർ ഉറങ്ങുന്നതു കാണുന്നു’ എന്നത് സ്വാഭാവികവും εὑρίσκωയുടെ സന്ദർഭാർഥം കൃത്യമായി നൽകുന്നതുമാണ്.
- source_word: καθεύδοντας
  choice: ഉറങ്ങുന്നതു
  rationale: ഉറക്കത്തിന്റെ തുടരുന്ന പ്രവൃത്തിയെ ക്രിയാത്മകമായി നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മൂലത്തിലെ ചരിത്രവർത്തമാനം നിലനിർത്തി മർക്കോസിന്റെ സജീവമായ ആഖ്യാനശൈലി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τῷ Πέτρῳ
  choice: പത്രോസിനോട്
  rationale: സംഭാഷണത്തിന്റെ സ്വാഭാവിക മലയാള ദാതൃരൂപം; തുടർന്ന് വരുന്ന ‘ശിമോൻ’ എന്ന വ്യക്തിപേരിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: Σίμων
  choice: ശിമോനേ
  rationale: നേരിട്ടുള്ള സംബോധനമായതിനാൽ മലയാളത്തിലെ സംബോധനരൂപം ഉപയോഗിച്ചു; ‘പത്രോസ്’ എന്ന മുൻപരാമർശത്തിൽനിന്ന് വേർതിരിച്ചു.
- source_word: καθεύδεις
  choice: നീ ഉറങ്ങുകയാണോ
  rationale: വർത്തമാനകാലത്തെ നേരിട്ടുള്ള ശാസനയും ഉടനടിയുള്ള സാഹചര്യവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἴσχυσας
  choice: നിനക്കു കഴിഞ്ഞില്ലേ
  rationale: ഈ സന്ദർഭത്തിൽ ἰσχύω ശാരീരിക ശക്തിയെക്കാൾ കഴിവ്/സാമർഥ്യം സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികമായ ചോദ്യം ഉപയോഗിച്ചു.
- source_word: μίαν ὥραν
  choice: ഒരു മണിക്കൂർ
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി രേഖപ്പെടുത്തുന്നു.
- source_word: γρηγορῆσαι
  choice: ഉണർന്നിരിക്കാൻ
  rationale: ഉറങ്ങുന്നതുമായുള്ള തൽക്ഷണ വൈരുധ്യം മുൻനിർത്തുന്നു; ‘ജാഗരിച്ചിരിക്കുക/കാവലിരിക്കുക’ എന്ന ജാഗ്രതാഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മർക്കോസിന്റെ ചരിത്രവർത്തമാനം
  choice: 'പ്രധാന ആഖ്യാനക്രിയകൾ വർത്തമാനകാലത്തിൽ നിലനിർത്തി: ‘കാണുന്നു’, ‘പറയുന്നു’.'
  alternative: 'എല്ലാ ക്രിയകളും ഭൂതകാലത്തിലാക്കുക: ‘വന്നു’, ‘കണ്ടു’, ‘പറഞ്ഞു’.'
  rationale: മൂലഗ്രീക്കിലെ സജീവമായ ആഖ്യാനഭാവം മലയാളത്തിന്റെ സ്വാഭാവികത നഷ്ടപ്പെടുത്താതെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: γρηγορέω എന്ന ക്രിയയുടെ സന്ദർഭാർഥം
  choice: ഉണർന്നിരിക്കാൻ
  alternative: ജാഗരിച്ചിരിക്കാൻ / കാവലിരിക്കാൻ
  rationale: ഇവിടെ ഉറങ്ങുന്നതുമായുള്ള നേരിട്ടുള്ള വൈരുധ്യം കാരണം ഉണർന്നിരിക്കലാണ് മുഖ്യാർഥം. അതേസമയം ജാഗ്രതയോടെ കാത്തിരിക്കുകയെന്ന വിപുലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചരിത്രവർത്തമാനം വായനാസൗകര്യത്തോടെ നിലനിർത്താൻ ആദ്യ ക്രിയയെ ‘വന്ന്’ എന്ന ബന്ധക്രിയയായും തുടർന്നുള്ളവയെ വർത്തമാനകാലമായും നൽകി. സംബോധനത്തിൽ ‘ശിമോനേ’ ഉപയോഗിച്ചു.
