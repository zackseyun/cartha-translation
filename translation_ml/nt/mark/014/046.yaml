lexical_decisions:
- source_word: οἱ δὲ
  choice: അപ്പോൾ അവർ
  rationale: οἱ എന്നത് ഇവിടെ ‘അവർ’ എന്ന നാമപ്രയോഗമായും δέ കഥയിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള മൃദുവായ നീക്കമായും വരുന്നു. ‘അപ്പോൾ അവർ’ സ്വാഭാവികമായ ആഖ്യാനതുടർച്ച നൽകുന്നു; ശക്തമായ വിരോധഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: അവന്റെമേൽ കൈവെച്ച്
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം ഒരാളെ പിടിക്കാനോ കസ്റ്റഡിയിലെടുക്കാനോ കൈവയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ശൈലിയാണ്. മലയാളത്തിലെ ‘മേൽ കൈവയ്ക്കുക’ അതിന്റെ രൂപകവും ശത്രുതാപരമായ സന്ദർഭവും നിലനിർത്തുന്നു; പിന്നാലെയുള്ള ക്രിയയുമായി അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ἐκράτησαν αὐτόν
  choice: അവനെ പിടികൂടി
  rationale: κρατέω ഇവിടെ ബലമായി പിടിച്ച് നിയന്ത്രണത്തിലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പിടികൂടി’ അറസ്റ്റിന്റെ സന്ദർഭാർഥം ഉൾക്കൊള്ളുമ്പോഴും ഔപചാരിക നിയമനടപടി എന്ന ആശയം അതിയായി ചുമത്തുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രണ്ടു ഘട്ടങ്ങൾ—കൈവയ്ക്കലും പിടികൂടലും—വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
