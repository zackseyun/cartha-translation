  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: ml
  text: ‘ഇത് കർത്താവിൽനിന്ന് ഉണ്ടായതാണ്; നമ്മുടെ ദൃഷ്ടിയിൽ അത്ഭുതകരവുമാണ്.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സങ്കീർത്തനം 118:23-ൽനിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘ഇത് കർത്താവിനാൽ ഉണ്ടായതാണ്.’ ഗ്രീക്ക് പ്രയോഗത്തിന് ഉറവിടത്തെയോ കാരണകർത്താവിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: കർത്താവിൽനിന്ന്
  rationale: ജനിറ്റീവിനോടുകൂടിയ παρά ഇവിടെ ഉറവിടത്തെയോ കാരണകർത്താവിനെയോ സൂചിപ്പിക്കാം. ‘കർത്താവിൽനിന്ന്’ എന്നത് ഉറവിടത്തിന്റെ ഭാവം നേരിട്ട് നിലനിർത്തുന്നു; കർത്താവിന്റെ പ്രവർത്തനഫലമെന്ന ആശയവും സന്ദർഭത്തിൽ തുറന്നുവെക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: പുതിയനിയമത്തിലെ κύριος എന്ന പദത്തിന് സ്വാഭാവികവും മാന്യവുമായ പതിവു മലയാളരൂപം. സങ്കീർത്തന ഉദ്ധരണിയിൽ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ഗ്രീക്ക് പാഠത്തിലെ പദപ്രയോഗം പിന്തുടരുന്നു.
- source_word: ἐγένετο
  choice: സംഭവിച്ചു
  rationale: γίνομαι എന്ന വിശാലാർഥമുള്ള ക്രിയ ഇവിടെ ഒരു കാര്യം കർത്താവിൽനിന്ന് ഉണ്ടായിവന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സംഭവിച്ചു’ സ്വാഭാവിക മലയാളമാണ്; παρά κυρίου ചേർന്നതിനാൽ യാദൃച്ഛികതയല്ല, കർത്താവിൽനിന്നുള്ള സംഭവമാണെന്ന ഭാവം വ്യക്തമാണ്.
- source_word: αὕτη
  choice: ഇത്
  rationale: മുൻവാക്യത്തിലെ നിരസിക്കപ്പെട്ട കല്ല് മൂലക്കല്ലായിത്തീർന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന സർവനാമം. ‘ഈ കല്ല്’ എന്നു ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യക്തമാക്കലായതിനാൽ ‘ഇത്’ നിലനിർത്തുന്നു.
- source_word: θαυμαστὴ
  choice: അത്ഭുതകരമാണ്
  rationale: θαυμαστός എന്നത് വിസ്മയകരമായതോ ശ്രദ്ധേയമായതോ എന്ന അർഥം നൽകുന്നു. ‘അത്ഭുതകരം’ തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ ഗൗരവവും ആധുനിക മലയാളത്തിലെ വ്യക്തതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: നമ്മുടെ കണ്ണുകൾക്ക്
  rationale: ‘നമ്മുടെ ദൃഷ്ടിയിൽ/നമുക്ക്’ എന്നർഥമുള്ള ദൃശ്യരൂപകം. ‘നമ്മുടെ കണ്ണുകൾക്ക്’ എന്ന രൂപം മൂലത്തിലെ കണ്ണുകളുടെ പ്രതിച്ഛായ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്.
theological_decisions:
- issue: ദൈവത്തെ സൂചിപ്പിക്കുന്ന സങ്കീർത്തന ഉദ്ധരണിയിലെ κύριος
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: അടിസ്ഥാന ഹീബ്രു സങ്കീർത്തനത്തിൽ ദൈവനാമമുണ്ടെങ്കിലും മാർക്കോസിന്റെ ഗ്രീക്ക് പാഠം κυρίου എന്നാണ്. അതിനാൽ പുതിയനിയമ പാഠത്തിലെ രൂപം പിന്തുടർന്ന് ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി; ഹീബ്രു പശ്ചാത്തലം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തില്ല.
- issue: παρὰ κυρίου എന്നതിലെ ഉറവിടം-കാരണകർത്തൃത്വം ദ്വയാർഥം
  choice: കർത്താവിൽനിന്ന്
  alternative: കർത്താവിനാൽ
  rationale: παρά + ജനിറ്റീവ് സാധാരണയായി ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ ദൈവിക പ്രവർത്തനത്തിന്റെ കാരണകർത്തൃത്വവും ഉൾക്കൊള്ളാം. മുഖ്യപാഠം ഉറവിടഭാവം മുൻനിർത്തുകയും അടിക്കുറിപ്പ് കാരണകർത്തൃത്വപരമായ മറ്റൊരു വായന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ തിരുവെഴുത്ത് ശൈലി. ഉദ്ധരണിയുടെ കാവ്യഗൗരവം നിലനിർത്തിയിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
