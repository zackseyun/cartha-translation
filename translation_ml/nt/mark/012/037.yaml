  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: ml
  text: ദാവീദ് തന്നേ അവനെ ‘കർത്താവ്’ എന്നു വിളിക്കുന്നു; അങ്ങനെയെങ്കിൽ അവൻ ദാവീദിന്റെ മകൻ[b] ആകുന്നത് എങ്ങനെ[a]? വലിയ ജനക്കൂട്ടം അവനെ സന്തോഷത്തോടെ കേട്ടുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവൻ എവിടെനിന്നാണ് അവന്റെ മകൻ?’'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ ‘മകൻ’ എന്നത് ‘ദാവീദിന്റെ മകൻ’ എന്ന മശീഹീയ പദവിയെ പ്രതിധ്വനിപ്പിക്കുന്നു; ഈ പദത്തിന് ‘വംശജൻ’ എന്ന വിശാലമായ അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: ദാവീദുതന്നെ
  rationale: αὐτός എന്നതിന്റെ ഊന്നൽ നിലനിർത്തി ദാവീദ് വ്യക്തിപരമായി ഇങ്ങനെ വിളിക്കുന്നു എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγει αὐτὸν κύριον
  choice: അവനെ ‘കർത്താവ്’ എന്നു വിളിക്കുന്നു
  rationale: ഇവിടെ λέγει വെറും ‘പറയുന്നു’ എന്നതിലുപരി ഒരാളെ ഒരു പദവികൊണ്ട് വിശേഷിപ്പിക്കുന്നതാണ്; κύριος എന്ന തിരുവെഴുത്തുപരവും ക്രിസ്തുശാസ്ത്രപരവുമായ പദത്തിന്റെ ശക്തി ‘കർത്താവ്’ നിലനിർത്തുന്നു.
- source_word: καὶ πόθεν αὐτοῦ ἐστιν υἱός
  choice: അങ്ങനെയെങ്കിൽ അവൻ ദാവീദിന്റെ മകൻ ആകുന്നത് എങ്ങനെ?
  rationale: πόθεν അക്ഷരാർഥത്തിൽ ‘എവിടെനിന്ന്’ എന്നാണെങ്കിലും ഇവിടെ യുക്തിപരമായ ‘എങ്ങനെ’ എന്ന ചോദ്യമാണ്. αὐτοῦ എന്ന സർവനാമത്തിന്റെ സൂചന സാധാരണ വായനക്കാരന് വ്യക്തമായിരിക്കാനായി ‘ദാവീദിന്റെ’ എന്നു ആവർത്തിച്ചു.
- source_word: ὁ πολὺς ὄχλος
  choice: വലിയൊരു ജനക്കൂട്ടം
  rationale: നിരവധി ആളുകളടങ്ങിയ ജനക്കൂട്ടം എന്ന അർഥം, സാമൂഹികവർഗത്തെക്കുറിച്ചുള്ള അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ, ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἤκουεν αὐτοῦ
  choice: യേശുവിന്റെ വാക്കുകൾ കേട്ടുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയയുടെ തുടരുന്ന ഭാവം ‘കേട്ടുകൊണ്ടിരുന്നു’ നിലനിർത്തുന്നു. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ αὐτοῦ-യുടെ സൂചകം ‘യേശുവിന്റെ’ എന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: ἡδέως
  choice: സന്തോഷത്തോടെ
  rationale: കേൾക്കുന്നതിലുള്ള പ്രസാദവും ആനന്ദവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദാവീദ് മശീഹയെ ‘കർത്താവ്’ എന്നു വിളിക്കുന്നതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി
  choice: ‘കർത്താവ്’ എന്ന നേരിട്ടുള്ള പദവിയും വിശദീകരിക്കാത്ത അലങ്കാരചോദ്യവും നിലനിർത്തി.
  alternative: ‘ദാവീദ് മശീഹയെ കർത്താവ് എന്നു വിളിക്കുന്നു’ എന്ന് ‘മശീഹ’ ചേർത്ത് വ്യക്തമാക്കുക.
  rationale: മശീഹ ദാവീദിന്റെ വംശജൻ മാത്രമല്ലെന്ന സംഘർഷം വാക്യം സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, അതിന്റെ പൂർണ സിദ്ധാന്തപരമായ വിശദീകരണം പരിഭാഷയിൽ ചേർക്കാതെ മൂലവാക്യത്തിന്റെ തുറന്ന യുക്തിപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: υἱός എന്നതിന്റെ മശീഹീയ പ്രയോഗം
  choice: മകൻ
  alternative: വംശജൻ
  rationale: ‘വംശജൻ’ വംശപരമായ അർഥം വ്യക്തമാക്കുമെങ്കിലും, ‘ദാവീദിന്റെ മകൻ’ എന്ന അംഗീകൃത മശീഹീയ പദവിയുമായുള്ള ബന്ധവും യേശുവിന്റെ ചോദ്യത്തിലെ വാചിക വൈരുധ്യവും ‘മകൻ’ കൂടുതൽ നന്നായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ദാവീദുതന്നെ’ ഊന്നൽ സംരക്ഷിക്കുന്നു; ‘കർത്താവ്’ തിരുവെഴുത്തുപരമായ പദവിയുടെ ഭാരം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
