  to: “ഗുരുവേ, ഒരാളുടെ സഹോദരൻ മരിച്ച് ഭാര്യയെ ശേഷിപ്പിക്കുകയും സന്താനമൊന്നും ശേഷിപ്പിക്കാതിരിക്കുകയും ചെയ്താൽ[b], അവന്റെ സഹോദരൻ ആ ഭാര്യയെ വിവാഹം കഴിച്ച് മരിച്ച സഹോദരനുവേണ്ടി സന്തതി ജനിപ്പിക്കണം[c] എന്ന് മോശെ ഞങ്ങൾക്കായി എഴുതിയിട്ടുണ്ട്.[a]”
