id: MRK.12.19
reference: Mark 12:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: ml
  text: “ഗുരുവേ, ഒരാളുടെ സഹോദരൻ മരിച്ച് ഭാര്യയെ ശേഷിപ്പിക്കുകയും സന്താനമൊന്നും ശേഷിപ്പിക്കാതിരിക്കുകയും ചെയ്താൽ[b], അവന്റെ സഹോദരൻ ആ ഭാര്യയെ വിവാഹം കഴിച്ച് മരിച്ച സഹോദരനുവേണ്ടി സന്തതി ജനിപ്പിക്കണം[c] എന്ന് മോശെ ഞങ്ങൾക്കായി എഴുതിയിട്ടുണ്ട്.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ പരാമർശിക്കുന്നത് ആവർത്തനപുസ്തകം 25:5-ലെ മോശെയുടെ നിയമമാണ്.
    reason: cross_reference
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഒരു കുട്ടിയെയും ശേഷിപ്പിക്കാതിരുന്നാൽ.” ചില വിവർത്തനങ്ങൾ “മക്കളെ ശേഷിപ്പിക്കാതിരുന്നാൽ” എന്നു നൽകുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: “തന്റെ സഹോദരനുവേണ്ടി വിത്ത് ഉയർത്തണം.” മരിച്ച സഹോദരന്റെ പേരിൽ സന്തതി ജനിപ്പിക്കേണ്ട നിയമപരമായ പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന പദം. ആധുനിക മലയാളത്തിൽ അധ്യാപനഭൂമികയും ആദരവും സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘യജമാനനേ’ എന്നത് മൂലത്തിൽ ഇല്ലാത്ത അധികാരസൂചന നൽകാം.
- source_word: Μωϋσῆς
  choice: മോശെ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: ἔγραψεν ἡμῖν
  choice: ഞങ്ങൾക്കായി എഴുതിയിട്ടുണ്ട്
  rationale: ἡμῖν എന്ന ദത്തി ഇവിടെ പ്രയോജനത്തെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു. ഇസ്രായേലിനായി നൽകിയ നിയമത്തെ ഉദ്ധരിക്കുന്ന സന്ദർഭത്തിൽ ‘ഞങ്ങൾക്കായി’ സ്വാഭാവികവും വിശ്വസ്തവുമാണ്.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: ഒരാളുടെ സഹോദരൻ മരിച്ചാൽ
  rationale: τινος എന്ന അനിശ്ചിത ഷഷ്ഠിയെ ‘ഒരാളുടെ’ എന്നു പൊതുവായി വിവർത്തനം ചെയ്യുന്നു; ἀδελφός എന്ന പുരുഷബന്ധപദം അതേപടി നിലനിർത്തുന്നു.
- source_word: καταλίπῃ γυναῖκα
  choice: ഭാര്യയെ ശേഷിപ്പിക്കുകയും
  rationale: മരണസന്ദർഭത്തിൽ καταλείπω എന്നത് പിന്നിൽ ശേഷിപ്പിക്കുക എന്നാണ്. γυνή ഇവിടെ ഭാര്യയെ സൂചിപ്പിക്കുന്നു.
- source_word: μὴ ἀφῇ τέκνον
  choice: സന്താനമൊന്നും ശേഷിപ്പിക്കാതിരിക്കുകയും
  rationale: τέκνον ഏകവചനമാണെങ്കിലും നിഷേധവാക്യത്തിൽ മലയാളത്തിലെ ‘സന്താനമൊന്നും’ സ്വാഭാവികമായി ഒരു കുട്ടിപോലും ഇല്ലെന്ന അർഥം നൽകുന്നു.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: അവന്റെ സഹോദരൻ ആ ഭാര്യയെ സ്വീകരിച്ച്
  rationale: നിയമപരമായ വിവാഹസന്ദർഭത്തിലെ ‘ഭാര്യയെ സ്വീകരിക്കുക’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ‘വിധവയെ വിവാഹം കഴിക്കുക’ കൂടുതൽ വ്യാഖ്യാനപരമായ പര്യായമാണ്.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: സന്തതിയെ നിലനിർത്തണം
  rationale: ‘വിത്തിനെ എഴുന്നേൽപ്പിക്കുക’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ അപാരദർശകമാണ്. മരിച്ച സഹോദരന്റെ വംശപരമ്പര തുടരുക എന്ന ലേവിരേറ്റ് വിവാഹപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: മരിച്ച സഹോദരനുവേണ്ടി
  rationale: ദത്തി സൂചിപ്പിക്കുന്ന പ്രയോജനം ‘വേണ്ടി’ എന്ന് നൽകുന്നു. മുൻവ്യവസ്ഥയിൽ മരണം പറഞ്ഞിരിക്കുന്നതിനാൽ ‘മരിച്ച’ എന്ന ആവർത്തനം മലയാളത്തിൽ സൂചിതബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലേവിരേറ്റ് വിവാഹനിയമത്തിലെ പ്രയോഗം വ്യാഖ്യാനാതിരേകമില്ലാതെ അവതരിപ്പിക്കൽ
  choice: ‘ആ ഭാര്യയെ സ്വീകരിച്ച് മരിച്ച സഹോദരനുവേണ്ടി സന്തതിയെ നിലനിർത്തണം’
  alternative: ‘ആ വിധവയെ വിവാഹം കഴിച്ച് മരിച്ച സഹോദരനുവേണ്ടി മക്കളെ ജനിപ്പിക്കണം’
  rationale: മൂലത്തിലെ ‘ഭാര്യയെ സ്വീകരിക്കുക’, ‘വിത്തിനെ എഴുന്നേൽപ്പിക്കുക’ എന്നീ നിയമപരമായ പ്രയോഗങ്ങളുടെ കുടുംബ-വംശപരമ്പരാസംബന്ധിയായ അർഥം വ്യക്തമാക്കുന്നു; എന്നാൽ നിർദിഷ്ട സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ലിംഗസൂചനയുള്ള ബന്ധപദങ്ങൾ
  choice: ‘സഹോദരൻ’, ‘ഭാര്യ’ എന്നീ മൂലത്തിലെ ലിംഗസൂചനകൾ നിലനിർത്തി
  alternative: ‘സഹോദരവ്യക്തി’, ‘ജീവിതപങ്കാളി’ തുടങ്ങിയ ലിംഗനിരപേക്ഷ പദങ്ങൾ
  rationale: ἀδελφός, γυνή എന്നിവ പുരുഷ-സ്ത്രീ വിവാഹനിയമസന്ദർഭത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ അവയെ ലിംഗനിരപേക്ഷമാക്കുന്നത് മൂലത്തിന്റെ പ്രത്യേകത ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-വിവരണ ശൈലി. ‘ഗുരുവേ’, ‘ഞങ്ങൾക്കായി’, ‘സന്തതിയെ നിലനിർത്തണം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ അഭിസംബോധന, ദത്തി, ലേവിരേറ്റ് വിവാഹപ്രയോഗം എന്നിവ സംരക്ഷിക്കുന്നതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
