reference: Mark 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: ml
  text: അനുയോജ്യമായ സമയത്ത്, മുന്തിരിത്തോട്ടത്തിലെ ഫലങ്ങളിൽനിന്ന് കുറെ കൃഷിക്കാരിൽനിന്ന് സ്വീകരിക്കാനായി അദ്ദേഹം ഒരു അടിമയെ[a] അവരുടെ അടുക്കലേക്ക് അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദാസനെ.’ ഗ്രീക്ക് പദമായ δοῦλος യജമാനന്റെ ഉടമസ്ഥതയ്ക്കു കീഴിലുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: ἀποστέλλω എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; ലളിതവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: γεωργοὺς / γεωργῶν
  choice: മുന്തിരിത്തോട്ടത്തിലെ കൃഷിക്കാർ
  rationale: γεωργός ഭൂമിയിൽ കൃഷിചെയ്യുന്നവനെ സൂചിപ്പിക്കുന്നു; മുന്തിരിത്തോട്ടത്തിന്റെ പശ്ചാത്തലം വ്യക്തമാക്കിക്കൊണ്ട് പാട്ടക്കാർ എന്ന ആശയം അനാവശ്യമായി ചേർക്കാതിരിക്കുന്നു.
- source_word: τῷ καιρῷ
  choice: വിളവെടുപ്പുകാലം വന്നപ്പോൾ
  rationale: καιρός ഇവിടെ അനുയോജ്യമായ വിളവുകാലത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പരിഭാഷ.
- source_word: δοῦλον
  choice: അടിമ
  rationale: δοῦλος സൂചിപ്പിക്കുന്ന യജമാനന്റെ ഉടമസ്ഥതയ്ക്കു കീഴിലുള്ള സാമൂഹികപദവി നേരിട്ട് നിലനിർത്തുന്നു; ‘ദാസൻ’ എന്ന പരമ്പരാഗത പദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἵνα ... λάβῃ
  choice: വാങ്ങാനായി
  rationale: ἵνα ഉപവാക്യത്തിന്റെ ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παρὰ τῶν γεωργῶν
  choice: കൃഷിക്കാരിൽനിന്ന്
  rationale: παρά + genitive സൂചിപ്പിക്കുന്ന ഉറവിടം ‘-ൽനിന്ന്’ എന്ന വിഭക്തിയിലൂടെ കൃത്യമായി നൽകുന്നു.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: അതിന്റെ ഫലത്തിൽ കുറെ
  rationale: ἀπό + genitive നൽകുന്ന അംശാർഥം ‘കുറെ’ എന്നു വ്യക്തമാക്കി; ‘തന്റെ ഓഹരി’ എന്ന മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത ആശയം ചേർക്കുന്നില്ല.
- source_word: ἀμπελῶνος
  choice: മുന്തിരിത്തോട്ടം
  rationale: ἀμπελών എന്ന പദത്തിന്റെ വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാളരൂപം.
