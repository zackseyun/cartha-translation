  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മുന്തിരിത്തോട്ടത്തിലെ കൃഷിക്കാർ’ എന്നു നൽകി തൊഴിൽസന്ദർഭം വ്യക്തമാക്കിയെങ്കിലും പാട്ടക്കാരെന്ന സാമൂഹികപങ്ക് മൂലപദത്തിൽനിന്ന് അധികമായി നിർണ്ണയിച്ചിട്ടില്ല.
