id: MRK.12.9
reference: Mark 12:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: ml
  text: മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമ[a] എന്തു ചെയ്യും? അയാൾ വന്ന് ആ പാട്ടക്കൃഷിക്കാരെ നശിപ്പിക്കുകയും മുന്തിരിത്തോട്ടം മറ്റുള്ളവർക്കു കൊടുക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മുന്തിരിത്തോട്ടത്തിന്റെ കർത്താവ്’ അല്ലെങ്കിൽ ‘മുന്തിരിത്തോട്ടത്തിന്റെ യജമാനൻ’; ഗ്രീക്കിൽ ‘മുന്തിരിത്തോട്ടത്തിന്റെ κύριος.’ ഇവിടെ ഈ പദം ഉപമയിലെ മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ποιήσει
  choice: എന്തു ചെയ്യും?
  rationale: ഗ്രീക്കിലെ ചോദ്യം ഭാവികാലത്തിൽ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു; പാഠത്തിൽ ഇല്ലാത്ത ബന്ധകപദം ചേർക്കുന്നില്ല.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമ
  rationale: ഉപമയിലെ മുന്തിരിത്തോട്ടത്തിന്റെ സ്വത്തുടമയെയാണ് κύριος ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘കർത്താവ്’ എന്ന ദൈവശാസ്ത്രപരമായ അർഥം അനാവശ്യമായി വരാതിരിക്കാനും ഉടമസ്ഥത വ്യക്തമാക്കാനും ‘ഉടമ’ യോജിക്കുന്നു.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: മുന്തിരിത്തോട്ടം
  rationale: ἀμπελών എന്ന കാർഷികപദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: ἐλεύσεται
  choice: വന്ന്
  rationale: തുടർന്നുള്ള ഭാവികാല ക്രിയകളോടു ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം നൽകുന്നു; വരുമെന്ന ആശയം പൂർണമായി നിലനിർത്തുന്നു.
- source_word: ἀπολέσει
  choice: നശിപ്പിക്കുകയും
  rationale: ἀπόλλυμι സൂചിപ്പിക്കുന്ന നിർണായക ന്യായവിധിയുടെ കാഠിന്യം നിലനിർത്തുന്നു; ‘കൊല്ലുക’ എന്ന കൂടുതൽ ഇടുങ്ങിയ അർഥത്തിലേക്ക് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: τοὺς γεωργούς
  choice: ആ പാട്ടക്കൃഷിക്കാരെ
  rationale: ഇവർ വെറും കൂലിപ്പണിക്കാരല്ല, മറ്റൊരാളുടെ മുന്തിരിത്തോട്ടം പാട്ടത്തിനെടുത്തു കൃഷിചെയ്യുന്നവരാണ്; ‘പാട്ടക്കൃഷിക്കാർ’ കാർഷികതയും പാട്ടബന്ധവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: δώσει
  choice: കൊടുക്കുകയും ചെയ്യും
  rationale: δίδωμι എന്ന ക്രിയയുടെ വിശാലവും നേരിട്ടുള്ളതുമായ അർഥം നിലനിർത്തുന്നു; ‘ഏൽപ്പിക്കുക’ അല്ലെങ്കിൽ ‘പാട്ടത്തിനു നൽകുക’ എന്നു അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: ἄλλοις
  choice: മറ്റുള്ളവർക്കു
  rationale: ഗ്രീക്കിലെ തുറന്ന സൂചന അതേപടി നിലനിർത്തുന്നു; ‘മറ്റു കൃഷിക്കാർക്ക്’ എന്നു പാഠത്തിൽ ഇല്ലാത്ത നാമം പൂരിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ഉപമയിലെ ദൈവേതര സൂചനയിൽ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഉടമ
  alternative: കർത്താവ്; യജമാനൻ
  rationale: ഉടൻ പ്രത്യക്ഷമായ കഥാസന്ദർഭത്തിൽ മുന്തിരിത്തോട്ടത്തിന്റെ സ്വത്തുടമയാണ് ഉദ്ദേശ്യം. ‘ഉടമ’ എന്നു നൽകുന്നത് സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ഉപമയുടെ വിശാലമായ ദൈവശാസ്ത്രസൂചനകൾ പദത്തിൽ മുൻകൂട്ടി അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ചോദ്യം-ഉത്തരം ഘടനയും ഭാവികാലവും സംരക്ഷിച്ചു. ‘അയാൾ’ എന്ന സർവനാമം മനുഷ്യനായ ഉടമയെ സ്വാഭാവികമായി തിരിച്ചുസൂചിപ്പിക്കുന്നു.
