id: MRK.12.8
reference: Mark 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λαβόντες ⸂ἀπέκτειναν αὐτόν, καὶ ἐξέβαλον αὐτὸν⸃ ἔξω τοῦ ἀμπελῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: ml
  text: അവർ അവനെ പിടിച്ച് കൊന്നു; പിന്നെ മുന്തിരിത്തോട്ടത്തിനു പുറത്തേക്ക് എറിഞ്ഞുകളഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സമാന്തരമായ ഉപമാപാരമ്പര്യത്തെ അടിസ്ഥാനമാക്കി ‘മുന്തിരിത്തോട്ടത്തിനു പുറത്തേക്ക് എറിഞ്ഞശേഷം കൊന്നു’ എന്ന ക്രമം ചില വായനക്കാർ പ്രതീക്ഷിച്ചേക്കാം. എന്നാൽ ഇവിടെ മർക്കോസിന്റെ ഗ്രീക്ക് പാഠം ‘കൊന്നു; പിന്നെ മുന്തിരിത്തോട്ടത്തിനു പുറത്തേക്ക് എറിഞ്ഞുകളഞ്ഞു’ എന്നാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: അവനെ പിടിച്ച്
  rationale: പ്രധാന ക്രിയകൾക്കു മുമ്പുള്ള λαμβάνω എന്ന ക്രിയയുടെ aorist participle ഇവിടെ തുടർച്ചയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘പിടിച്ച്’ എന്നത് സ്വാഭാവികമാണ്; എന്നാൽ മൂലപദത്തിൽ ഇല്ലാത്ത അമിതമായ ബലപ്രയോഗത്തിന്റെ ആശയം ചേർക്കുന്നില്ല.
- source_word: ἀπέκτειναν
  choice: കൊന്നു
  rationale: ἀποκτείνω എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കൊല്ലുക’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഈ ഉപമയിലെ കടുത്ത സംഭവക്രമത്തിന് യോജിച്ചതുമാണ്.
- source_word: ἐξέβαλον
  choice: എറിഞ്ഞുകളഞ്ഞു
  rationale: ἐκβάλλω ഇവിടെ പുറത്തേക്കെറിയുക/തള്ളിക്കളയുക എന്ന ശക്തമായ പുറത്താക്കൽ സൂചിപ്പിക്കുന്നു. ‘എറിഞ്ഞുകളഞ്ഞു’ അതിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: മുന്തിരിത്തോട്ടത്തിനു പുറത്തേക്ക്
  rationale: ἔξω + genitive, ἐξέβαλον എന്ന ചലനക്രിയയോടൊപ്പം, തോട്ടത്തിന്റെ ഉള്ളിൽനിന്ന് പുറത്തേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു.
- source_word: ἀμπελῶνος
  choice: മുന്തിരിത്തോട്ടം
  rationale: ἀμπελών എന്ന പദത്തിന്റെ ഈ ഉപമാസന്ദർഭത്തിലെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപമാണ് ‘മുന്തിരിത്തോട്ടം’.
theological_decisions:
- issue: കൊലയും മുന്തിരിത്തോട്ടത്തിനു പുറത്തേക്കെറിയലും വരുന്ന ക്രമം
  choice: അവർ ആദ്യം അവനെ കൊന്നു; പിന്നെ മുന്തിരിത്തോട്ടത്തിനു പുറത്തേക്ക് എറിഞ്ഞുകളഞ്ഞു.
  alternative: സമാന്തര ഉപമാപാരമ്പര്യം പ്രതീക്ഷിക്കുന്നതുപോലെ ആദ്യം പുറത്താക്കി, പിന്നെ കൊന്നു എന്നു നൽകുക.
  rationale: മർക്കോസ് 12:8-ലെ SBLGNT ഗ്രീക്ക് പാഠം പിടിക്കൽ, കൊല്ലൽ, പുറത്തേക്കെറിയൽ എന്ന ക്രമത്തിലാണ്. സമാന്തരവിവരണങ്ങളുമായി ഏകീകരിക്കാതെ ആ ക്രമം അതേപടി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. സംഭവങ്ങളുടെ വേഗമുള്ള തുടർച്ച സ്വാഭാവികമായി നൽകുകയും ഗ്രീക്ക് പാഠത്തിലെ ക്രമം മാറ്റാതിരിക്കുകയും ചെയ്തു.
