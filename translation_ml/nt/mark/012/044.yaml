id: MRK.12.44
reference: Mark 12:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: ml
  text: കാരണം, അവരെല്ലാവരും തങ്ങളുടെ മിച്ചത്തിൽനിന്നാണ് ഇട്ടത്; എന്നാൽ ഇവൾ തന്റെ ദാരിദ്ര്യത്തിൽനിന്ന് തനിക്കുണ്ടായിരുന്നതെല്ലാം—ജീവിക്കാൻ അവൾക്കുണ്ടായിരുന്ന വക മുഴുവനും[a]—ഇട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവളുടെ ഉപജീവനം മുഴുവനും.”'
    reason: βίος എന്ന പദത്തിന് ‘ജീവിക്കാൻ ഉണ്ടായിരുന്ന വക’ എന്ന സന്ദർഭോചിത അർഥത്തോടൊപ്പം ‘ഉപജീവനം’ എന്ന സംക്ഷിപ്ത പരിഭാഷയും സാധ്യമാണ്.
lexical_decisions:
- source_word: πάντες
  choice: അവരെല്ലാവരും
  rationale: സമ്പന്നരായ സംഭാവകരെ ഒരു കൂട്ടമായി സൂചിപ്പിക്കുകയും ഗ്രീക്കിലെ സമഗ്രത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ യേശു നടത്തിയ വിലയിരുത്തലിന്റെ വിശദീകരണമാണ് ഈ വാക്യമെന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: തങ്ങളുടെ മിച്ചത്തിൽനിന്ന്
  rationale: ആവശ്യത്തിനുമപ്പുറം ശേഷിക്കുന്നതിൽനിന്ന് കൊടുത്തു എന്ന ആശയം സ്വാഭാവികവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: ἔβαλον / ἔβαλεν
  choice: ഇട്ടത് / ഇട്ടു
  rationale: ഭണ്ഡാരത്തിൽ നാണയങ്ങൾ ഇടുന്ന ഭൗതിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന βάλλωയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: αὕτη δὲ
  choice: എന്നാൽ ഇവൾ
  rationale: മറ്റുള്ളവരും വിധവയും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്ത്രീയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇവൾ’ സ്വാഭാവികമാണ്.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: തന്റെ ദാരിദ്ര്യത്തിൽനിന്ന്
  rationale: ὑστέρησις സൂചിപ്പിക്കുന്ന കുറവും സാമ്പത്തിക ഞെരുക്കവും ഈ സന്ദർഭത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: πάντα ὅσα εἶχεν
  choice: തനിക്കുണ്ടായിരുന്നതെല്ലാം
  rationale: ഗ്രീക്കിലെ സമഗ്രവും ഊന്നലുള്ളതുമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: തന്റെ ഉപജീവനം മുഴുവനും
  rationale: ഇവിടെ βίος ജൈവജീവനെയല്ല, ജീവിക്കാനുള്ള സാമ്പത്തിക വകയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഉപജീവനം’ ആ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: വിധവയുടെ വഴിപാടിനെക്കുറിച്ചുള്ള വാക്യത്തിൽ βίος എന്നതിന്റെ അർഥം
  choice: ജീവിക്കാനുള്ള സാമ്പത്തിക വക, അഥവാ ‘ഉപജീവനം’
  alternative: അവളുടെ ജീവിതം മുഴുവനും
  rationale: സന്ദർഭം പണവഴിപാടിനെക്കുറിച്ചുള്ളതാണ്; βίος ഉപജീവനമാർഗത്തെയോ ജീവിതച്ചെലവിനുള്ള വകയെയോ സൂചിപ്പിക്കാം. അതിനാൽ അവൾ അക്ഷരാർഥത്തിൽ തന്റെ ജീവൻ കൊടുത്തുവെന്ന ധാരണ വരുത്താതെ അവളുടെ കൊടുക്കലിന്റെ സമഗ്രത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘മിച്ചം—ദാരിദ്ര്യം’ എന്ന വൈരുധ്യവും ‘ഇട്ടത്—ഇട്ടു’ എന്ന മൂലപാഠത്തിലെ ആവർത്തനവും സംരക്ഷിച്ചിരിക്കുന്നു.
