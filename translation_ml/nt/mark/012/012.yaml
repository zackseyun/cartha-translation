revisions:
- from: അവർ യേശുവിനെ പിടികൂടാൻ ശ്രമിച്ചു. എന്നാൽ ജനക്കൂട്ടത്തെ അവർ ഭയപ്പെട്ടു; കാരണം, തങ്ങൾക്കെതിരെയാണ് യേശു ആ ഉപമ പറഞ്ഞതെന്ന് അവർ മനസ്സിലാക്കിയിരുന്നു.[a] അതുകൊണ്ട് അവർ യേശുവിനെ വിട്ട് അവിടെനിന്നു പോയി.
