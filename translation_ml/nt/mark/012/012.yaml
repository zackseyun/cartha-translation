id: MRK.12.12
reference: Mark 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: ml
  text: അവർ യേശുവിനെ പിടികൂടാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു, എന്നാൽ ജനക്കൂട്ടത്തെ ഭയപ്പെട്ടു; കാരണം, ആ ഉപമ തങ്ങൾക്കെതിരെയാണ്[a] യേശു പറഞ്ഞതെന്ന് അവർ മനസ്സിലാക്കിയിരുന്നു. അതുകൊണ്ട് അവർ യേശുവിനെ വിട്ട് പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “തങ്ങളെക്കുറിച്ചാണ്” അഥവാ “തങ്ങളോടാണ്.”
    reason: πρὸς αὐτούς എന്ന പദബന്ധത്തിന് സന്ദർഭത്തിൽ ‘തങ്ങൾക്കെതിരെയാണ്’ എന്ന അർഥം യോജിക്കുന്നുവെങ്കിലും, കൂടുതൽ നിഷ്പക്ഷമായ ദിശാസൂചനയുള്ള ഈ സാധ്യതകളും നിലനിൽക്കുന്നു.
lexical_decisions:
- source_word: ἐζήτουν
  choice: ശ്രമിച്ചു
  rationale: അപൂർണഭൂതകാലം തുടരുകയോ ഫലിക്കാതെ പോകുകയോ ചെയ്ത ശ്രമത്തെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘പിടികൂടാൻ ശ്രമിച്ചു’ അത് വ്യക്തമാക്കുന്നു.
- source_word: κρατῆσαι
  choice: പിടികൂടാൻ
  rationale: ഇവിടെ ക്രിയയ്ക്ക് പിടിച്ചെടുക്കുക എന്ന അർഥമാണ്. ഔപചാരികമായ നിയമനടപടി സൂചിപ്പിക്കാവുന്ന ‘അറസ്റ്റുചെയ്യാൻ’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തെ അവർ ഭയപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ ക്രിയയും നേരിട്ടുള്ള കർമവും ലളിതമായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἔγνωσαν
  choice: മനസ്സിലാക്കിയിരുന്നു
  rationale: ഉപമയുടെ ലക്ഷ്യം അവർ തിരിച്ചറിഞ്ഞെന്ന സന്ദർഭാർഥം നൽകുകയും, യേശു ഉപമ പറഞ്ഞത് ഈ തിരിച്ചറിവിനു മുമ്പാണെന്ന കാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πρὸς αὐτοὺς
  choice: തങ്ങൾക്കെതിരെയാണ്
  rationale: ശത്രുതാപരമായ സന്ദർഭത്തിൽ ഉപമ അവരെ പ്രതികൂലമായി ലക്ഷ്യമിട്ടുവെന്ന ശക്തി നൽകുന്നു; കൂടുതൽ നിഷ്പക്ഷമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τὴν παραβολὴν
  choice: ആ ഉപമ
  rationale: തൊട്ടുമുമ്പ് പറഞ്ഞ ഉപമയെയാണ് നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ ചൂണ്ടിക്കാണിക്കുന്നത്; മലയാളത്തിൽ ‘ആ’ സ്വാഭാവികമാണ്.
- source_word: ἀφέντες αὐτὸν
  choice: യേശുവിനെ വിട്ട്
  rationale: അവനെ പിടിക്കാനുള്ള ശ്രമം ഉപേക്ഷിച്ച് അവിടെനിന്ന് മാറിയെന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἀπῆλθον
  choice: അവിടെനിന്നു പോയി
  rationale: കഥാഗതിയിലെ സ്ഥലമാറ്റം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: πρὸς αὐτούς എന്നതിന്റെ ദിശാസൂചന
  choice: തങ്ങൾക്കെതിരെയാണ്
  alternative: തങ്ങളെക്കുറിച്ചാണ് / തങ്ങളോടാണ്
  rationale: സന്ദർഭത്തിലെ വിരോധവും പിടികൂടാനുള്ള ശ്രമവും ‘എതിരായി’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും πρός എന്ന പദബന്ധത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. സർവനാമപരാമർശത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ αὐτόν എന്നിടത്ത് ‘യേശുവിനെ’ എന്നും ഉപമ പറഞ്ഞ കർത്താവായി ‘യേശു’ എന്നും വ്യക്തമാക്കി; ഗ്രീക്കിൽ പേര് ആവർത്തിക്കുന്നില്ല.
