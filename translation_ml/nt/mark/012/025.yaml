source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: ml
  text: എന്തെന്നാൽ, മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുമ്പോൾ അവർ വിവാഹം കഴിക്കുകയോ വിവാഹത്തിനു നൽകപ്പെടുകയോ ചെയ്യുന്നില്ല; മറിച്ച് സ്വർഗത്തിലുള്ള[a] ദൂതന്മാരെപ്പോലെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വർഗങ്ങളിൽ.’ ഗ്രീക്കിൽ ഇത് ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: എന്തെന്നാൽ, ... ഉയിർത്തെഴുന്നേൽക്കുമ്പോൾ
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’ എന്നും ὅταν നൽകുന്ന കാലസൂചന ‘...ചെയ്യുമ്പോൾ’ എന്നും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുമ്പോൾ
  rationale: ἐκ νεκρῶν എന്നത് ‘മരിച്ചവരിൽനിന്ന്’ എന്നു കൃത്യമായി നൽകുകയും, സജീവരൂപത്തിലുള്ള ἀναστῶσιν എന്നതിന് മലയാളത്തിലെ സ്വാഭാവികമായ പുനരുത്ഥാനപ്രയോഗമായ ‘ഉയിർത്തെഴുന്നേൽക്കുക’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: വിവാഹം കഴിക്കുകയോ വിവാഹം ചെയ്തുകൊടുക്കപ്പെടുകയോ ചെയ്യുന്നില്ല
  rationale: രണ്ട് വ്യത്യസ്ത ഗ്രീക്ക് ക്രിയകളെയും ഒന്നാക്കി ചുരുക്കാതെ, വിവാഹത്തിൽ പ്രവേശിക്കുന്നതും മറ്റൊരാളാൽ വിവാഹം ചെയ്തുകൊടുക്കപ്പെടുന്നതും തമ്മിലുള്ള സജീവ–നിഷ്ക്രിയ വ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἀλλ’ εἰσὶν
  choice: മറിച്ച് ... ആണ്
  rationale: ἀλλά സൂചിപ്പിക്കുന്ന ശക്തമായ വൈരുധ്യം ‘മറിച്ച്’ എന്ന പദം വ്യക്തമായി നൽകുന്നു.
- source_word: ὡς ἄγγελοι
  choice: ദൂതന്മാരെപ്പോലെയാണ്
  rationale: ὡς ഇവിടെ സാദൃശ്യം സൂചിപ്പിക്കുന്നു; ഉയിർത്തെഴുന്നേറ്റവർ ദൂതന്മാരായി മാറുന്നു എന്ന അർഥം വരാതിരിക്കാൻ ‘പോലെ’ നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗത്തിലുള്ള
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനസൂചന ‘സ്വർഗത്തിലുള്ള’ എന്നതാണ്; മൂലരൂപത്തിന്റെ ബഹുവചനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റവരും ദൂതന്മാരും തമ്മിലുള്ള താരതമ്യത്തിന്റെ സ്വഭാവം
  choice: ഉയിർത്തെഴുന്നേറ്റവർ ദൂതന്മാരെപ്പോലെയാണ്
  alternative: ഉയിർത്തെഴുന്നേറ്റവർ ദൂതന്മാരായി മാറുന്നു
  rationale: ὡς എന്ന താരതമ്യകണം സാദൃശ്യമാണ് സൂചിപ്പിക്കുന്നത്, സ്വഭാവപരമായ ഐക്യമോ രൂപാന്തരമോ അല്ല. അതിനാൽ വാക്യം താരതമ്യം മാത്രം പ്രസ്താവിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വിശദീകരണബന്ധം, സജീവ–നിഷ്ക്രിയ ക്രിയാഭേദം, ദൂതന്മാരോടുള്ള സാദൃശ്യം എന്നിവ സാധ്യമായത്ര വ്യക്തമായി സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ് അതുമായി ബന്ധപ്പെട്ട ‘സ്വർഗത്തിലുള്ള’ എന്ന പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
