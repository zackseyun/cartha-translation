id: MRK.12.13
reference: Mark 12:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: ml
  text: അവർ അവനെ വാക്കുകൊണ്ട് കുടുക്കേണ്ടതിന് പരീശന്മാരിൽ ചിലരെയും ഹെരോദിയന്മാരിൽ ചിലരെയും അവന്റെ അടുക്കലേക്ക് അയയ്ക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ പറഞ്ഞതിലൂടെ അവനെ കുടുക്കേണ്ടതിന്.” ഗ്രീക്ക് ക്രിയ വേട്ടയാടി പിടിക്കുന്നതിന്റെ രൂപകമാണ്; അവസാന പദപ്രയോഗം അവന്റെ സംസാരത്തിലൂടെ അവനെ കുടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: അയയ്ക്കുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു; മർക്കോസിന്റെ സജീവമായ ആഖ്യാനശൈലി മലയാളത്തിലും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: പരീശന്മാരിൽ ചിലരെയും ഹെരോദാപക്ഷക്കാരിൽ ചിലരെയും
  rationale: τινας എന്ന പദത്തോടുകൂടിയ വിഭാഗസൂചക ഷഷ്ഠീവിഭക്തി ഇരുകൂട്ടങ്ങളിൽനിന്നും ചിലരെ അയച്ചുവെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: Φαρισαίων
  choice: പരീശന്മാർ
  rationale: യഹൂദമതത്തിലെ ഈ വിഭാഗത്തിന് ആധുനിക മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ പേരാണ്.
- source_word: Ἡρῳδιανῶν
  choice: ഹെരോദാപക്ഷക്കാർ
  rationale: ഹെരോദാവുമായി ബന്ധപ്പെട്ട കൂട്ടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ വെറും ലിപ്യന്തരണത്തേക്കാൾ സ്വാഭാവികവും അർത്ഥവത്തുമായ മലയാളപ്രയോഗം.
- source_word: ἵνα
  choice: കുടുക്കേണ്ടതിന്
  rationale: തുടർന്നുള്ള പ്രവൃത്തിയുടെ ഉദ്ദേശ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀγρεύσωσιν
  choice: കുടുക്കുക
  rationale: വേട്ടയിൽ ഇരയെ പിടിക്കുക എന്ന രൂപകം ഉൾക്കൊള്ളുന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ ആലങ്കാരിക അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λόγῳ
  choice: വാക്കിൽ
  rationale: ഏകവചനവും ഉപാധി/മാധ്യമം സൂചിപ്പിക്കുന്ന ദത്തിവും ചുരുക്കമായി നിലനിർത്തുന്നു; അവന്റെ സംസാരത്തിലൂടെ അവനെ കുടുക്കുക എന്ന അർത്ഥസാധ്യത തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: ബഹുവചന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: അവർ
  alternative: മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും മൂപ്പന്മാരും; അധികാരികൾ
  rationale: ഈ വാക്യം കർത്താവിനെ വീണ്ടും വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മുൻസന്ദർഭത്തിൽനിന്ന് പ്രത്യേക തിരിച്ചറിയൽ മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ ഗ്രീക്കിലെ വ്യക്തമാക്കാത്ത ബഹുവചനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനഭാഷ. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലവും λόγῳ എന്ന പദത്തിന്റെ സംക്ഷിപ്തമായ അനിശ്ചിതത്വവും നിലനിർത്തിയിരിക്കുന്നു.
