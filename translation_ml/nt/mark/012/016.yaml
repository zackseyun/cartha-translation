  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തിയിരിക്കുന്നു; ഗ്രീക്കിൽ പ്രകടമല്ലാത്ത നാണയത്തെ ‘ഒരെണ്ണം’ എന്ന സൂചനയിലൂടെ മാത്രം അവതരിപ്പിക്കുന്നു.
