  text: οἱ δὲ ἤνεγκαν. καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή; οἱ δὲ εἶπαν αὐτῷ· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: ml
  text: 'അവർ ഒരെണ്ണം കൊണ്ടുവന്നു.[a] അവൻ അവരോടു ചോദിക്കുന്നു: “ഈ രൂപവും ലിഖിതവും ആരുടേതാണ്?” അവർ അവനോടു പറഞ്ഞു: “കൈസറുടേത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവർ അതു കൊണ്ടുവന്നു.” മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ദിനാർ എന്ന നാണയമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: അവർ ഒരെണ്ണം കൊണ്ടുവന്നു
  rationale: φέρω എന്ന ക്രിയയുടെ അർഥം ‘കൊണ്ടുവരുക’ എന്നാണ്. കർമം ഗ്രീക്കിൽ പ്രകടമായി പറഞ്ഞിട്ടില്ലെങ്കിലും മുൻസന്ദർഭത്തിലെ ദിനാറാണ് ഉദ്ദേശിക്കുന്നത്. ‘ഒരെണ്ണം’ എന്നു പറയുന്നത് നാണയം എന്നു അനാവശ്യമായി വാക്യത്തിൽ ചേർക്കാതെ ആ സൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λέγει
  choice: അവൻ അവരോടു ചോദിക്കുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ആഖ്യാനശൈലിയിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു. തുടർന്നുള്ള വാക്കുകൾ ചോദ്യമായതിനാൽ ‘പറയുന്നു’ എന്നതിനെക്കാൾ ‘ചോദിക്കുന്നു’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: Τίνος
  choice: ആരുടേതാണ്
  rationale: ബന്ധമോ ഉടമസ്ഥതയോ ചോദിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണരൂപത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: εἰκών
  choice: രൂപം
  rationale: നാണയത്തിൽ പതിച്ചിരിക്കുന്ന വ്യക്തിരൂപത്തെ സൂചിപ്പിക്കുന്ന, ലളിതവും സന്ദർഭോചിതവുമായ പദം.
- source_word: ἐπιγραφή
  choice: ലിഖിതം
  rationale: നാണയത്തിൽ കൊത്തിയിട്ടിരിക്കുന്ന എഴുത്തിനെ കൃത്യമായും മാന്യമായും സൂചിപ്പിക്കുന്നു.
- source_word: Καίσαρος
  choice: കൈസറുടേത്
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണരൂപത്തിന്റെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാള ഉത്തരം.
