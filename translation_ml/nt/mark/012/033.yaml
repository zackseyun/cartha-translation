  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: ml
  text: മുഴുവൻ ഹൃദയത്തോടും മുഴുവൻ വിവേകത്തോടും മുഴുവൻ ശക്തിയോടുംകൂടെ അവനെ സ്നേഹിക്കുന്നതും, തന്നെപ്പോലെ തന്റെ അയൽക്കാരനെ സ്നേഹിക്കുന്നതും, എല്ലാ സർവാംഗഹോമങ്ങളെയും[a] യാഗങ്ങളെയുംക്കാൾ ശ്രേഷ്ഠമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സർവാംഗഹോമം’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന ഗ്രീക്ക് പദം, ബലിവസ്തു മുഴുവനായും യാഗപീഠത്തിൽ അഗ്നിയിൽ ദഹിപ്പിക്കുന്ന ഒരു പ്രത്യേക ഹോമത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: സ്നേഹിക്കുന്നതും
  rationale: നാമവാചകസ്വഭാവമുള്ള ഗ്രീക്ക് infinitive-ന്റെ ക്രിയാത്മകതയും സമാന്തരഘടനയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: സർവനാമം മുൻസന്ദർഭത്തിലെ ദൈവത്തെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിലെ സർവനാമരൂപം തന്നെ നിലനിർത്തുന്നു.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: പൂർണഹൃദയത്തോടും
  rationale: ഹൃദയത്തിന്റെ സമഗ്രമായ അർപ്പണത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: συνέσεως
  choice: പൂർണമായ വിവേകത്തോടും
  rationale: σύνεσις എന്നത് വെറും ബൗദ്ധികശേഷിയേക്കാൾ ഗ്രഹണവും തിരിച്ചറിവും ഉൾക്കൊള്ളുന്നതിനാൽ ‘വിവേകം’ യോജിക്കുന്നു.
- source_word: ἰσχύος
  choice: പൂർണശക്തിയോടുംകൂടെ
  rationale: ഒരാളുടെ മുഴുവൻ ശേഷിയെയും ബലത്തെയും സൂചിപ്പിക്കുന്ന സുതാര്യമായ പ്രയോഗം.
- source_word: πλησίον
  choice: തന്റെ അയൽക്കാരനെ
  rationale: ഏകവചനത്തിന്റെ പൊതുവായ നൈതിക അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὡς ἑαυτόν
  choice: തന്നെപ്പോലെ
  rationale: നേരിട്ടുള്ള ദ്വിതീയപുരുഷ അഭിസംബോധന ചേർക്കാതെ പൊതുവായ പ്രതിഫലനാർഥം സംരക്ഷിക്കുന്നു.
- source_word: περισσότερόν ἐστιν
  choice: ശ്രേഷ്ഠമാണ്
  rationale: താരതമ്യത്തിൽ വ്യക്തമായ മേന്മയുണ്ടെന്ന് അറിയിക്കുന്നു; യാഗങ്ങളെ അസാധുവാക്കുന്നു എന്ന അധിക നിഗമനം ചേർക്കുന്നില്ല.
- source_word: ὁλοκαυτωμάτων
  choice: സർവാംഗഹോമങ്ങളെക്കാളും
  rationale: യാഗവസ്തു മുഴുവനായി അഗ്നിയിൽ ദഹിപ്പിക്കുന്ന പ്രത്യേക തരം ഹോമത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ കൃത്യത നിലനിർത്തുന്നു.
- source_word: θυσιῶν
  choice: യാഗങ്ങളെക്കാളും
  rationale: പൊതുവായ ബലിയർപ്പണങ്ങളെയോ യാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘യാഗങ്ങൾ’ വ്യക്തവും മാന്യവുമായ പദമാണ്.
theological_decisions:
- issue: സ്നേഹകല്പനകളും യാഗാരാധനയും തമ്മിലുള്ള ബന്ധം
  choice: ദൈവത്തെ പൂർണമായി സ്നേഹിക്കുന്നതും അയൽക്കാരനെ തന്നെപ്പോലെ സ്നേഹിക്കുന്നതും എല്ലാ സർവാംഗഹോമങ്ങളെയും യാഗങ്ങളെയുംക്കാൾ ശ്രേഷ്ഠമാണെന്ന് വാക്യം പറയുന്നു.
  alternative: ഈ വാക്യം യാഗക്രമത്തെ പൂർണമായി അസാധുവാക്കുന്നു എന്നോ സ്നേഹത്തെയും യാഗത്തെയും തുല്യനിലയിൽ വെക്കുന്നു എന്നോ വായിക്കുക.
  rationale: περισσότερόν ἐστιν വ്യക്തമായ മേന്മ സൂചിപ്പിക്കുന്നു; എന്നാൽ യാഗക്രമം റദ്ദാക്കിയതായി വാക്യം തന്നെ പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ സമാന്തരഘടനയും ‘അവനെ’ എന്ന സർവനാമവും പൊതുവായ നൈതിക പ്രയോഗവും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘സർവാംഗഹോമം’ എന്ന പദത്തിനരികിൽ സ്ഥാപിച്ചു.
