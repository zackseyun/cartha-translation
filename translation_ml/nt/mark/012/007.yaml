id: MRK.12.7
reference: Mark 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ οἱ γεωργοὶ ⸂πρὸς ἑαυτοὺς εἶπαν⸃ ὅτι Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτόν, καὶ ἡμῶν ἔσται ἡ κληρονομία.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: ml
  text: 'എന്നാൽ ആ പാട്ടക്കൃഷിക്കാർ പരസ്പരം പറഞ്ഞു[a]: ‘ഇവനാണ് അവകാശി. വരൂ, നമുക്ക് ഇവനെ കൊല്ലാം; അവകാശം നമ്മുടേതാകും[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തമ്മിൽ പറഞ്ഞു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവകാശം നമുക്കുള്ളതായിരിക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: എന്നാൽ ആ പാട്ടക്കൃഷിക്കാർ
  rationale: δέയുടെ മൃദുവായ വിരുദ്ധഭാവം ‘എന്നാൽ’ എന്നും, ἐκεῖνοι എന്ന സൂചകഭാവം ‘ആ’ എന്നും നിലനിർത്തുന്നു. മുന്തിരിത്തോട്ടം പാട്ടത്തിനെടുത്ത് കൃഷി ചെയ്യുന്നവരെന്ന സാമൂഹികബന്ധം γεωργοί എന്ന പദത്തിന് സന്ദർഭത്തിൽ ഉള്ളതിനാൽ ‘പാട്ടക്കൃഷിക്കാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: പരസ്പരം പറഞ്ഞു
  rationale: സംഘത്തിനുള്ളിലെ പരസ്പര ആലോചനയും സംസാരവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെറും മനസ്സിലുള്ള ചിന്തയായി തെറ്റിദ്ധരിക്കപ്പെടുന്നത് ഒഴിവാക്കുന്നു.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: ഇവനാണ് അവകാശി
  rationale: Οὗτος എന്ന സമീപസൂചകത്തിന്റെ അടിയന്തരത ‘ഇവൻ’ നിലനിർത്തുന്നു; κληρονόμος എന്നതിന് സ്വാഭാവികമായ നിയമ-കുടുംബ പദം ‘അവകാശി’ ആണ്.
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: വരൂ, നമുക്ക് ഇവനെ കൊല്ലാം
  rationale: δεῦτε എന്ന ആഹ്വാനവും ഒന്നാംപുരുഷ ബഹുവചനത്തിലുള്ള ആഹ്വാനാർഥക നിർദേശവും നേരിട്ട് പകർത്തുന്നു. ‘കൊലപ്പെടുത്താം’ എന്നതിനെക്കാൾ ‘കൊല്ലാം’ സാധാരണവും മൂലപദത്തോട് ചേർന്നതുമാണ്.
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: അപ്പോൾ അവകാശം നമ്മുടേതാകും
  rationale: καί ഇവിടെ പദ്ധതിയുടെ പ്രതീക്ഷിച്ച ഫലം മുന്നോട്ടുവയ്ക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകി. ἡμῶν എന്ന ഊന്നിയ ഉടമസ്ഥഭാവം ‘നമ്മുടേതാകും’ നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘അവന്റെ’ എന്ന പദം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ഉപമയിലെ γεωργοί എന്നവരുടെ സാമൂഹികപങ്ക്
  choice: പാട്ടക്കൃഷിക്കാർ
  alternative: കൃഷിക്കാർ; കുടിയാന്മാർ; മുന്തിരിത്തോട്ടം കൃഷി ചെയ്യുന്നവർ
  rationale: ഇവർ ഉടമസ്ഥരല്ല, ഉടമയ്ക്ക് ഉത്തരവാദികളായി ഭൂമി ഏറ്റെടുത്തു കൃഷി ചെയ്യുന്നവരാണ് എന്ന ഉപമയുടെ നിർണായകബന്ധം ഈ പദം വ്യക്തമാക്കുന്നു; അതേസമയം അധികമായ ഉപമാവ്യാഖ്യാനം വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ മൂർച്ചയും ദുഷ്ടമായ ആലോചനയുടെ നേരിട്ടുള്ള സ്വഭാവവും മൃദൂകരിക്കാതെ നിലനിർത്തി.
