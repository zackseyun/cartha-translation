id: MRK.12.35
reference: Mark 12:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: ml
  text: 'യേശു ദൈവാലയത്തിൽ പഠിപ്പിച്ചുകൊണ്ടിരിക്കെ ഇങ്ങനെ പറഞ്ഞു: “മശീഹാ[a] ദാവീദിന്റെ പുത്രനാണെന്ന് ശാസ്ത്രിമാർ പറയുന്നത് എങ്ങനെ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.” ഗ്രീക്കിലെ Χριστός (ക്രിസ്റ്റോസ്) എന്ന പദവി ഇവിടെ മശീഹാ എന്ന അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: ഇങ്ങനെ പറഞ്ഞു എന്ന വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: ἀποκρίνομαι പലപ്പോഴും ‘മറുപടി പറയുക’ എന്നാണെങ്കിലും, ഇവിടെ നേരത്തേ ഉന്നയിച്ച വ്യക്തമായ ചോദ്യമില്ല; ഒരു സാഹചര്യത്തോടോ ചിന്താധാരയോടോ പ്രതികരിച്ച് സംസാരിക്കുന്നതിനെ ഇത് സൂചിപ്പിക്കാം. മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞുകൊണ്ട്’ എന്ന് യാന്ത്രികമായി ചേർക്കുന്നത് അസ്വാഭാവികമായതിനാൽ പ്രസംഗാരംഭത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിൽ അതിന്റെ പ്രവർത്തനം ഉൾക്കൊള്ളിച്ചു.
- source_word: ἔλεγεν
  choice: പറഞ്ഞു
  rationale: അപൂർണ്ണഭൂതകാലരൂപത്തിന് തുടരുന്ന പ്രവർത്തിയുടെ ഭാവമുണ്ടെങ്കിലും, നേരിട്ടുള്ള ചോദ്യത്തെ പരിചയപ്പെടുത്തുന്ന മലയാള ആഖ്യാനത്തിൽ ‘പറഞ്ഞു’ സ്വാഭാവികമാണ്; സമകാലികമായ പഠിപ്പിക്കൽ ‘പഠിപ്പിച്ചുകൊണ്ടിരിക്കെ’ എന്നതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: διδάσκων
  choice: പഠിപ്പിച്ചുകൊണ്ടിരിക്കെ
  rationale: വർത്തമാന കൃദന്തരൂപം യേശു സംസാരിച്ച സമയത്ത് നടന്നുകൊണ്ടിരുന്ന പഠിപ്പിക്കലിനെ സൂചിപ്പിക്കുന്നു. ഈ സമകാലികത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രം അല്ല, ദൈവാലയസമുച്ചയത്തെയും സൂചിപ്പിക്കാം. ‘ദൈവാലയം’ സാധാരണ വായനക്കാർക്ക് പരിചിതവും സന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണ്.
- source_word: Πῶς
  choice: എങ്ങനെ
  rationale: ചോദ്യം ശാസ്ത്രിമാരുടെ പ്രസ്താവനയെ വെല്ലുവിളിക്കുന്നതാണെങ്കിലും, ഗ്രീക്കിലെ ‘എങ്ങനെ’ എന്ന തുറന്ന രൂപം നിലനിർത്തുന്നു; ‘എങ്ങനെ പറയാൻ കഴിയും’ എന്ന് വിവർത്തനം ചെയ്ത് അതിന്റെ വാദാത്മക ശക്തി മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷങ്ങളിലെ γραμματεῖς എന്ന ചരിത്രപരമായ വിഭാഗത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പദമാണിത്; ‘നിയമാധ്യാപകർ’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ Χριστός ഒരു വ്യക്തിനാമംപോലെ അല്ല, യെഹൂദ മശീഹാപ്രതീക്ഷയുടെ പദവിയായി ഉപയോഗിച്ചിരിക്കുന്നു. അതിനാൽ പ്രധാന പാഠത്തിൽ ‘മശീഹാ’ നൽകി, ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: υἱὸς Δαυίδ
  choice: ദാവീദിന്റെ പുത്രൻ
  rationale: ഇത് വെറും വംശപരമ്പരയെക്കാൾ അംഗീകൃതമായ മശീഹാപദവിയെക്കുറിച്ചുള്ള പ്രസ്താവനയാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ നിർദ്ദിഷ്ട പ്രയോഗം ഉപയോഗിച്ചു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ വിവർത്തനം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ സംവാദം യെഹൂദരുടെ മശീഹാപ്രതീക്ഷയുടെ പശ്ചാത്തലത്തിലാണ്; അതിനാൽ പദവിയെന്ന അർഥം നേരിട്ട് വ്യക്തമാക്കുന്ന ‘മശീഹാ’ പ്രധാന പാഠത്തിൽ യോജിക്കുന്നു. പരമ്പരാഗത ഗ്രീക്ക്-ആധാരിത രൂപമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ദാവീദിന്റെ പുത്രൻ എന്ന പ്രസ്താവനയുടെ വാദാത്മക സ്വഭാവം
  choice: ‘എങ്ങനെ’ എന്ന ചോദ്യം തുറന്ന നിലയിൽ നിലനിർത്തി
  alternative: ‘എങ്ങനെ പറയാൻ കഴിയും’ എന്ന് ശക്തമായ നിഷേധസൂചന ചേർക്കുക
  rationale: Πῶς പ്രസ്താവനയെ ചോദ്യം ചെയ്യുന്നു; എന്നാൽ ഈ വാക്യം മാത്രം നോക്കി അത് പൂർണനിഷേധമാണെന്ന് വിവർത്തനത്തിൽ തീർപ്പാക്കരുത്. തുടർന്നുള്ള വചനങ്ങൾ ഉന്നയിക്കുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം അതേപടി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പഠിപ്പിച്ചുകൊണ്ടിരിക്കെ’ എന്ന പ്രയോഗം വാക്യത്തിന്റെ കാലബന്ധം സ്വാഭാവികമാക്കുന്നു; ചോദ്യം വ്യാഖ്യാനിച്ച് ശക്തിപ്പെടുത്താതെ ഗ്രീക്കിലെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
