id: MRK.12.10
reference: Mark 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: ml
  text: “ഈ തിരുവെഴുത്തുപോലും നിങ്ങൾ വായിച്ചിട്ടില്ലേ? ‘പണിയുന്നവർ തള്ളിക്കളഞ്ഞ കല്ല് തന്നെയാണ് മൂലക്കല്ലായിത്തീർന്നത്[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “മൂലയുടെ തല”; പരമ്പരാഗതമായി “പ്രധാന മൂലക്കല്ല്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφὴν
  choice: തിരുവെഴുത്ത്
  rationale: പുതിയനിയമത്തിലെ γραφή ഇവിടെ സാധാരണ എഴുത്തല്ല, വിശുദ്ധഗ്രന്ഥത്തിലെ ഒരു വചനഭാഗമാണ്; ‘തിരുവെഴുത്ത്’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐδὲ ... ἀνέγνωτε
  choice: പോലും നിങ്ങൾ വായിച്ചിട്ടില്ലേ?
  rationale: οὐδέയുടെ ഊന്നൽ ‘പോലും’ നിലനിർത്തുന്നു; ഭൂതകാലക്രിയയുള്ള വാചാടോപചോദ്യം മലയാളത്തിൽ ‘വായിച്ചിട്ടില്ലേ?’ എന്നു സ്വാഭാവികമാണ്.
- source_word: Λίθον
  choice: കല്ല്
  rationale: സങ്കീർത്തനം 118:22-ലെ ഉദ്ധരണിയിൽ ഒരു നിർദിഷ്ട പ്രതീകാത്മക കല്ലാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ സന്ദർഭം ആ നിർദിഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: ἀπεδοκίμασαν
  choice: തള്ളിക്കളഞ്ഞ
  rationale: പരിശോധിച്ചശേഷം അംഗീകരിക്കാതിരിക്കുക എന്ന സൂക്ഷ്മതയുള്ള പദത്തിന് ഇവിടെ വ്യക്തവും സ്വാഭാവികവുമായ തുല്യം ‘തള്ളിക്കളഞ്ഞ’ ആണ്.
- source_word: οἱ οἰκοδομοῦντες
  choice: പണിയുന്നവർ
  rationale: വർത്തമാനകൃഡന്തത്തിന്റെ സജീവത നിലനിർത്തുകയും കെട്ടിടനിർമാണരൂപകം വ്യക്തമായി സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οὗτος ἐγενήθη
  choice: തന്നെയാണ് ... ആയിത്തീർന്നത്
  rationale: οὗτος എന്ന ചൂണ്ടിക്കാട്ടലിന്റെ ഊന്നൽ ‘തന്നെയാണ്’ നൽകുന്നു; ἐγενήθηയുടെ സംഭവിച്ച മാറ്റവും ഫലമായ നിലയും ‘ആയിത്തീർന്നത്’ പ്രകടമാക്കുന്നു.
- source_word: εἰς κεφαλὴν γωνίας
  choice: മൂലക്കല്ല്
  rationale: അക്ഷരാർഥത്തിൽ ‘മൂലയുടെ തല’ എന്ന ദുഷ്കരമായ പ്രയോഗം കോണിലെ പ്രധാന കല്ലിനെ സൂചിപ്പിക്കുന്നു; ‘മൂലക്കല്ല്’ സ്ഥാപിതവും വായനാസൗകര്യമുള്ളതുമായ തുല്യമാണ്, എന്നാൽ നിർമാണത്തിലെ കൃത്യസ്ഥാനം സംബന്ധിച്ച സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 118:22-ലെ കല്ലിന്റെ മശീഹാപരമായ പ്രയോഗം
  choice: കല്ല്, പണിയുന്നവർ, മൂലക്കല്ല് എന്നീ രൂപകങ്ങൾ വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: പ്രധാനവാക്യത്തിൽ കല്ലിനെ മശീഹാ അഥവാ യേശു എന്നു നേരിട്ട് തിരിച്ചറിയുക.
  rationale: സന്ദർഭം ഈ വചനം യേശുവിൽ പ്രയോഗിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം ഉദ്ധരണിയുടെ രൂപകം തന്നെയാണ് നൽകുന്നത്; അതിനാൽ വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ ശക്തിയും സംഘർഷവും സംരക്ഷിക്കുന്നു.
- issue: κεφαλὴ γωνίας സൂചിപ്പിക്കുന്ന നിർമാണകല്ലിന്റെ സ്വഭാവം
  choice: പ്രധാനവാക്യത്തിൽ ‘മൂലക്കല്ല്’ ഉപയോഗിച്ച് പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥം നൽകി; മറ്റൊരു നിർമാണസാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘മൂലയുടെ തലക്കല്ല്’ എന്ന അക്ഷരാർഥപ്രയോഗമോ ‘മേൽക്കല്ല്’ എന്ന ഏകാർത്ഥനിർണ്ണയമോ ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് പ്രയോഗം പ്രധാന കോണുകല്ലിനെയോ മുകളിലെ കോണം പൂർത്തിയാക്കുന്ന കല്ലിനെയോ സൂചിപ്പിക്കാമെന്ന ചർച്ചയുണ്ട്; പ്രധാനവാക്യത്തിൽ അസ്വാഭാവികത ഒഴിവാക്കി യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഈ തിരുവെഴുത്തുപോലും’ എന്ന ക്രമം οὐδέയുടെ ശാസനാത്മക ഊന്നൽ നൽകുന്നു. സങ്കീർത്തനോദ്ധരണിയുടെ കാവ്യാത്മക സംക്ഷിപ്തതയും രൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
