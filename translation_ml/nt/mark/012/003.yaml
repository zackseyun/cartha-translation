  source_fidelity: 'ഗ്രീക്കിലെ പ്രവൃത്തിക്രമം കൃത്യമായി പ്രതിഫലിക്കുന്നു: λαβόντες = «പിടിച്ച്», ἔδειραν = «അടിച്ചു», ἀπέστειλαν = «പറഞ്ഞയച്ചു», κενόν = «വെറുംകൈയോടെ». «വെറുംകൈയോടെ» ദാസൻ ആവശ്യപ്പെട്ട ഫലം ഒന്നും ലഭിക്കാതെ അയക്കപ്പെട്ടതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിനേക്കാൾ അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.'
  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമാണ്. അർദ്ധവിരാമം ക്രമാനുസൃതമായ പ്രവൃത്തികളെ വ്യക്തമായി വേർതിരിക്കുന്നു. «പറഞ്ഞയച്ചു» ഇവിടെ സന്ദർഭോചിതമായി ‘sent away’ എന്ന അർഥം നൽകുന്നു.
  terminology: «അടിച്ചു» δέρω എന്ന പൊതുവായ മർദനാർഥം കാത്തുസൂക്ഷിക്കുന്നു; ‘ചമ്മട്ടികൊണ്ട് അടിച്ചു’ പോലുള്ള അതിസവിശേഷമായ അർഥം ചേർക്കുന്നില്ല. പേരുകളോ പ്രത്യേക ദൈവശാസ്ത്രപദങ്ങളോ ഈ വാക്യത്തിലില്ല.
