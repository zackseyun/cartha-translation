id: MRK.12.21
reference: Mark 12:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: ml
  text: രണ്ടാമനും അവളെ ഭാര്യയായി സ്വീകരിച്ചു; അവനും സന്തതി ശേഷിപ്പിക്കാതെ മരിച്ചു. മൂന്നാമനും അങ്ങനെതന്നെ ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: രണ്ടാമനും
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ക്രമസംഖ്യ ഇവിടെ നാമപദമായി പ്രവർത്തിക്കുന്നു. സഹോദരൻ എന്നത് സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത ആ പദം ചേർത്തിട്ടില്ല.
- source_word: ἔλαβεν αὐτήν
  choice: അവളെ ഭാര്യയായി സ്വീകരിച്ചു
  rationale: λαμβάνω എന്നതിന് അടിസ്ഥാനമായി ‘എടുക്കുക/സ്വീകരിക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ ലേവിരാറ്റ് വിവാഹസന്ദർഭത്തിൽ അവളെ ഭാര്യയാക്കുന്നതാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ ‘അവളെ എടുത്തു’ അസ്വാഭാവികവും തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതുമായതിനാൽ സന്ദർഭാർഥം വ്യക്തമായി നൽകി.
- source_word: ἀπέθανεν
  choice: മരിച്ചു
  rationale: അലങ്കാരമോ മൃദൂകരണവുമില്ലാത്ത നേരിട്ടുള്ള ആഖ്യാനപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: μὴ καταλιπὼν
  choice: ശേഷിപ്പിക്കാതെ
  rationale: μή ചേർന്ന എയോറിസ്റ്റ് കൃദന്തത്തിന്റെ അനുബന്ധസാഹചര്യാർഥം സ്വാഭാവികമായ മലയാള ക്രിയാവിശേഷണരൂപത്തിൽ നൽകി.
- source_word: σπέρμα
  choice: സന്തതി
  rationale: ഇവിടെ σπέρμα അക്ഷരാർഥത്തിലുള്ള വിത്തിനെയല്ല, ജനിച്ചുവരുന്ന വംശത്തെയോ മക്കളെയോ സൂചിപ്പിക്കുന്നു. ഏകവചനമായ ‘കുഞ്ഞ്’ എന്ന് ചുരുക്കാതെ വ്യാപ്തി കാത്തുസൂക്ഷിക്കാൻ ‘സന്തതി’ തിരഞ്ഞെടുത്തു.
- source_word: ὁ τρίτος ὡσαύτως
  choice: മൂന്നാമനും അങ്ങനെതന്നെ ചെയ്തു
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ആവർത്തനസൂചന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാകാൻ മുൻപറഞ്ഞ പ്രവർത്തനം സൂചിപ്പിക്കുന്ന ‘ചെയ്തു’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ സംക്ഷിപ്തത സാധ്യമായത്ര നിലനിർത്തിക്കൊണ്ട്, ‘ἔλαβεν αὐτήν’ എന്ന വിവാഹസന്ദർഭപ്രയോഗം മലയാളത്തിൽ തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ അർഥം തുറന്നുപറഞ്ഞിരിക്കുന്നു.
