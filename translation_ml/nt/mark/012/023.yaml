source:
  edition: SBLGNT
  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: ml
  text: പുനരുത്ഥാനത്തിൽ, അവർ ഉയിർത്തെഴുന്നേൽക്കുമ്പോൾ[a], അവൾ അവരിൽ ആരുടെ ഭാര്യയായിരിക്കും? കാരണം, ആ ഏഴുപേർക്കും അവൾ ഭാര്യയായിരുന്നല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവർ വീണ്ടും ഉയിർത്തെഴുന്നേൽക്കുമ്പോൾ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “അവർ ഉയിർത്തെഴുന്നേൽക്കുമ്പോൾ” എന്നാണ്; പുനരുത്ഥാനത്തിന്റെ സന്ദർഭമാണ് അതിന്റെ അർഥം വ്യക്തമാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστασις
  choice: പുനരുത്ഥാനം
  rationale: സദൂക്യരുമായുള്ള സംവാദത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇത് ഭാവിയിലെ പുനരുത്ഥാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ തുല്യപദമാണ് ‘പുനരുത്ഥാനം’.
- source_word: ὅταν ἀναστῶσιν
  choice: അവർ ഉയിർത്തെഴുന്നേൽക്കുമ്പോൾ
  rationale: ὅταν എന്നതിനോടുകൂടിയ aorist subjunctive ഭാവികാലസൂചനയുള്ള സമയവാക്യമാണ്. ‘വീണ്ടും’ എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും ഗ്രീക്കിൽ അത് പ്രത്യേകം പറഞ്ഞിട്ടില്ല.
- source_word: τίνος αὐτῶν
  choice: അവരിൽ ആരുടെ
  rationale: ചോദ്യസർവനാമത്തിന്റെ genitive രൂപവും partitive genitive-ഉം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവരിൽ ആരുടെ’ എന്നു വരുന്നു.
- source_word: ἔσται γυνή
  choice: ഭാര്യയായിരിക്കും
  rationale: ഭാവികാലത്തിലെ വൈവാഹികബന്ധമാണ് ഈ predicate construction സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ആരുടെ ഭാര്യയായിരിക്കും?’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: γυνή
  choice: ഭാര്യ
  rationale: രണ്ട് പ്രയോഗങ്ങളിലും സന്ദർഭം വിവാഹബന്ധമായതിനാൽ പൊതുവായ ‘സ്ത്രീ’ എന്നതിനു പകരം ‘ഭാര്യ’ ആവശ്യമാണ്.
- source_word: οἱ γὰρ ἑπτὰ
  choice: കാരണം, ആ ഏഴുപേർക്കും
  rationale: γάρ ചോദ്യത്തിനുള്ള വിശദീകരണകാരണം നൽകുന്നു. മുൻസന്ദർഭത്തിൽ ഏഴുപേരെ തിരിച്ചറിഞ്ഞിരിക്കുന്നതിനാൽ ‘ആ ഏഴുപേർ’ മതിയാകുന്നു.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: ആ ഏഴുപേർക്കും അവൾ ഭാര്യയായിരുന്നു
  rationale: ἔχω + accusative + γυναῖκα എന്ന പ്രയോഗം വിവാഹസംഭവത്തേക്കാൾ ഭാര്യയായിരുന്ന ബന്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ രൂപം അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി പകരുന്നു.
theological_decisions:
- issue: സദൂക്യരുമായുള്ള തർക്കത്തിലെ പുനരുത്ഥാനഭാഷ
  choice: പുനരുത്ഥാനത്തിൽ ... അവർ ഉയിർത്തെഴുന്നേൽക്കുമ്പോൾ
  alternative: മരിച്ചവരുടെ പുനരുത്ഥാനത്തിൽ ... അവർ വീണ്ടും ഉയിർത്തെഴുന്നേൽക്കുമ്പോൾ
  rationale: വാക്യം ഭാവിയിലെ പുനരുത്ഥാനത്തെ മുൻകൂട്ടി അംഗീകരിക്കുന്നുവെങ്കിലും ‘മരിച്ചവരിൽനിന്ന്’, ‘വീണ്ടും’ എന്നീ ആശയങ്ങൾ ഇവിടെ ഗ്രീക്കിൽ തുറന്നുപറയുന്നില്ല. അതിനാൽ സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ അവകാശവാദം നിലനിർത്തിക്കൊണ്ട് വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ഭാഷയാണ് ഉപയോഗിച്ചത്. ‘ഏഴുപേർക്കും അവൾ ഭാര്യയായിരുന്നു’ എന്ന സ്വാഭാവിക മലയാളരൂപം ഗ്രീക്കിലെ ബന്ധാവസ്ഥ സംരക്ഷിക്കുന്നു.
