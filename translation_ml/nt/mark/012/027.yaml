reference: Mark 12:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: ml
  text: അവൻ മരിച്ചവരുടെ ദൈവമല്ല; ജീവനുള്ളവരുടെ ദൈവമാണ്. നിങ്ങൾ വലിയ തെറ്റിലാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεὸς
  choice: ദൈവം
  rationale: സന്ദർഭം അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യാക്കോബിന്റെയും ദൈവത്തെക്കുറിച്ചായതിനാൽ, നിർദേശകപദമില്ലാത്ത θεός ഇവിടെ ‘ഒരു ദൈവം’ എന്നല്ല, ദൈവിക നാമപദമായ ‘ദൈവം’ എന്നാണ് പരിഭാഷപ്പെടുത്തുന്നത്.
- source_word: νεκρῶν
  choice: മരിച്ചവരുടെ
  rationale: ബഹുവചന ഷഷ്ഠീവಿಭക്തി നാമസമാനമായി ഉപയോഗിച്ചിരിക്കുന്നു; ‘മരിച്ചവർ’ എന്നത് ജീവനുള്ളവരുമായുള്ള നേർവിരുദ്ധത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀλλὰ ζώντων
  choice: ജീവനുള്ളവരുടെ
  rationale: ζώντων നാമസമാനമായി ഉപയോഗിച്ച വർത്തമാനകാല കൃദന്തമാണ്; ‘ജീവനുള്ളവർ’ എന്നത് മരിച്ചവരുമായുള്ള വിരോധം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: πολὺ
  choice: വളരെ
  rationale: πλανᾶσθε എന്ന ക്രിയയുടെ തീവ്രത വർധിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗം; ആധുനിക മലയാളത്തിൽ ‘വളരെ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πλανᾶσθε
  choice: തെറ്റിപ്പോകുന്നു
  rationale: ഈ മധ്യ/കർമണി രൂപം ഇവിടെ ഗുരുതരമായ ധാരണാപിശകിൽ ആയിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തെറ്റിപ്പോകുന്നു’ എന്നത് ബാഹ്യവഞ്ചനയെന്നോ മനഃപൂർവമായ വഴിതെറ്റലെന്നോ മാത്രം നിർണയിക്കാതെ രൂപത്തിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: οὐκ ἔστιν
  choice: അവൻ ... അല്ല
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ കർത്തൃസർവനാമമില്ലെങ്കിലും തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിലെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി ‘അവൻ’ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: ദൈവസന്നിധിയിലെ തുടർജീവിതത്തെയും പുനരുത്ഥാനത്തെയും കുറിച്ചുള്ള യേശുവിന്റെ വാദത്തിന്റെ സൂചന
  choice: ‘മരിച്ചവർ’ എന്നും ‘ജീവനുള്ളവർ’ എന്നും ഉള്ള വിരോധം മാത്രം നേരിട്ട് നിലനിർത്തി; പുനരുത്ഥാനമോ ഇടക്കാലാവസ്ഥയോ വിശദീകരിക്കുന്ന വ്യാഖ്യാനപരമായ വാക്കുകൾ ചേർത്തില്ല.
  alternative: ‘ദൈവത്തെ സംബന്ധിച്ചിടത്തോളം എല്ലാവരും ജീവിച്ചിരിക്കുന്നു’ എന്ന വിശദീകരണപരമായ പരാവർത്തനം.
  rationale: വാക്യം പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള യേശുവിന്റെ വാദത്തെ പിന്തുണയ്ക്കുന്നുവെങ്കിലും, മൂലപാഠം പറയുന്നതിലധികം സിദ്ധാന്തപരമായ നിഗമനം പരിഭാഷയിൽ ചേർക്കരുത്; അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംക്ഷിപ്തതയും സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള മലയാളം. ‘ദൈവമാണ്’ എന്ന സമാപനരൂപം മലയാളത്തിൽ ആവശ്യമായ വിരോധവും പൂർണ്ണതയും നൽകുന്നു; അനാവശ്യമായ മതവിഭാഗപരമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
