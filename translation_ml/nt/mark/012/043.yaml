source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: ml
  text: 'യേശു തന്റെ ശിഷ്യന്മാരെ തന്റെ അടുക്കലേക്കു വിളിച്ച് അവരോടു പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു, ഭണ്ഡാരത്തിൽ[a] പണം ഇടുന്ന എല്ലാവരെക്കാളും കൂടുതൽ ഈ ദരിദ്രയായ വിധവ ഇട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “വഴിപാടുപെട്ടിയിൽ” അഥവാ “ഭണ്ഡാരപ്പെട്ടിയിൽ.” ഗ്രീക്കുപദം ദേവാലയത്തിലെ ഭണ്ഡാരപാത്രത്തെയോ ഭണ്ഡാരമേഖലയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: അടുത്തേക്കു വിളിച്ച്
  rationale: മധ്യപ്രയോഗത്തിലുള്ള കൃതന്തം യേശു ശിഷ്യന്മാരെ തന്റെ അടുത്തേക്കു വിളിച്ചുകൂട്ടിയതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയകളുടെ ക്രമവും ബന്ധവും നിലനിർത്തുന്നു.
- source_word: μαθητὰς
  choice: ശിഷ്യന്മാർ
  rationale: യേശുവിനെ അനുഗമിക്കുകയും അവനിൽനിന്ന് പഠിക്കുകയും ചെയ്യുന്നവർക്കുള്ള സ്ഥാപിതവും സ്വാഭാവികവുമായ പുതിയനിയമ പദം.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: പ്രസ്താവനയുടെ ഗൗരവവും ഉറപ്പും നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തമായ അവതരണം.
- source_word: χήρα αὕτη ἡ πτωχὴ
  choice: ഈ ദരിദ്രയായ വിധവ
  rationale: പ്രദർശകസർവനാമവും ‘ദരിദ്ര’ എന്ന നേരിട്ടുള്ള അർഥവും നിലനിർത്തുന്നു; മൂലപാഠത്തേക്കാൾ കടുത്ത സാമ്പത്തികാവസ്ഥ സൂചിപ്പിക്കുന്ന പദം ചേർക്കുന്നില്ല.
- source_word: πλεῖον πάντων
  choice: എല്ലാവരെക്കാളും കൂടുതൽ
  rationale: മറ്റു സംഭാവകരെ മുഴുവനായും ഉൾക്കൊള്ളുന്ന താരതമ്യം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘കൂടുതൽ’ എന്നതിന്റെ മാനദണ്ഡം വാക്യത്തിൽ വ്യാഖ്യാനിച്ചു തീർക്കുന്നില്ല.
- source_word: ἔβαλεν / τῶν βαλλόντων
  choice: ഇട്ടിരിക്കുന്നു / ഇടുന്ന
  rationale: വിധവയുടെ പൂർത്തിയായ പ്രവൃത്തിയും മറ്റുള്ളവരുടെ തുടരുന്ന പ്രവൃത്തിയും തമ്മിലുള്ള ക്രിയാഭാവ വ്യത്യാസം സാധ്യമായത്ര സ്വാഭാവികമായി നിലനിർത്തുന്നു; പണമാണ് ഇടുന്നതെന്ന് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: γαζοφυλάκιον
  choice: ഭണ്ഡാരം
  rationale: ദേവാലയത്തിലെ കാണിക്ക സ്വീകരിക്കുന്ന പെട്ടിയെയോ ഭണ്ഡാരമേഖലയെയോ സൂചിപ്പിക്കാൻ ചുരുക്കവും സ്ഥാപിതവുമായ പദം; നിർദിഷ്ട ഭൗതിക അർഥവൈകല്യം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിധവയുടെ സംഭാവനയെക്കുറിച്ചുള്ള യേശുവിന്റെ വിലയിരുത്തൽ
  choice: ‘എല്ലാവരെക്കാളും കൂടുതൽ’ എന്ന താരതമ്യം വ്യാഖ്യാനപരമായ വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: അവൾ പണത്തുകയായി എല്ലാവരിലും അധികം കൊടുത്തു എന്നോ, ത്യാഗത്തിന്റെ അളവിൽ മാത്രം അധികം കൊടുത്തു എന്നോ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: അടുത്ത വാക്യം അവളുടെ ദാരിദ്ര്യത്തെയും മറ്റുള്ളവരുടെ സമൃദ്ധിയെയും അടിസ്ഥാനമാക്കി താരതമ്യം വിശദീകരിക്കുന്നു. ഈ വാക്യം മാത്രം പരിഭാഷയിൽ ആ വിശദീകരണം മുൻകൂട്ടി ചേർക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സംഭാഷണത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ സഭാപരമായ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘ഭണ്ഡാരം’ എന്ന പദത്തിനരികിൽ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
