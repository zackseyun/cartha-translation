source:
  edition: SBLGNT
  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: ml
  text: വിധവമാരുടെ വീടുകൾ വിഴുങ്ങുകയും കപടഭാവത്തിൽ[a] ദീർഘനേരം പ്രാർഥിക്കുകയും ചെയ്യുന്ന ഇവർ കൂടുതൽ കഠിനമായ ശിക്ഷാവിധി[b] ഏറ്റുവാങ്ങും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കാണിക്കാനായി’ അല്ലെങ്കിൽ ‘പ്രദർശനത്തിനായി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കൂടുതൽ കഠിനമായ ന്യായവിധി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: വിഴുങ്ങുകയും
  rationale: മറ്റുള്ളവരുടെ സ്വത്ത് നിർദയമായി കൈക്കലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിലെ ശക്തമായ രൂപകം നിലനിർത്തുന്നു; വെറും ‘ചൂഷണം ചെയ്യുക’ എന്ന വിശദീകരണത്തിലേക്ക് അതിനെ ചുരുക്കുന്നില്ല.
- source_word: οἰκίας
  choice: വീടുകൾ
  rationale: ഗ്രീക്കിലെ മൂർത്തമായ പദപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ കുടുംബസ്വത്തോ ഉപജീവനമാർഗമോ ഉൾപ്പെടാമെങ്കിലും അത് മുഖ്യപാഠത്തിൽ വിശദീകരിച്ച് അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: χηρῶν
  choice: വിധവമാരുടെ
  rationale: ബലഹീനമായ സാമൂഹിക നിലയിലുള്ള ഇരകളെ സൂചിപ്പിക്കുന്ന ബഹുവചന ഷഷ്ഠീബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: προφάσει
  choice: ആളുകളെ കാണിക്കാനായി
  rationale: പുറമേയുള്ള മതഭക്തിയുടെ പ്രകടനവും കപടമായ ഉദ്ദേശ്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക പ്രയോഗം; കൂടുതൽ ഔപചാരികമായ ‘കപടഭാവമായി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: μακρὰ
  choice: ദീർഘനേരം
  rationale: പ്രാർഥനയുടെ നീണ്ട ദൈർഘ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: προσευχόμενοι
  choice: പ്രാർഥിക്കുകയും ചെയ്യുന്ന
  rationale: ഗ്രീക്കിലെ വർത്തമാന കൃദന്തരൂപത്തെ മുൻവിവരണത്തോടു സമാന്തരമായി നിലനിർത്തുന്നു.
- source_word: λήμψονται
  choice: ഏറ്റുവാങ്ങും
  rationale: വിധിന്യായസന്ദർഭത്തിലെ ഭാവികാല ‘സ്വീകരിക്കുക’ എന്ന ആശയം ഗൗരവമുള്ള, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: περισσότερον
  choice: കൂടുതൽ കഠിനമായ
  rationale: താരതമ്യത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ശിക്ഷാവിധിയുടെ വർധിച്ച ഗൗരവമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: κρίμα
  choice: ശിക്ഷാവിധി
  rationale: ഇവിടെ വെറും വിലയിരുത്തലല്ല, കുറ്റത്തോടു ബന്ധപ്പെട്ട പ്രതികൂല വിധിയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു; വിശാലമായ ‘ന്യായവിധി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മതകാപട്യത്തിനെതിരായ മുന്നറിയിപ്പിൽ κρίμα എന്ന പദത്തിന്റെ ശക്തി
  choice: ശിക്ഷാവിധി
  alternative: ന്യായവിധി
  rationale: ‘കൂടുതൽ’ എന്ന താരതമ്യത്തോടുകൂടിയ സന്ദർഭം ശിക്ഷാത്മകമായ ദൈവിക വിധിയെ സൂചിപ്പിക്കുന്നു. എന്നാൽ അന്ത്യന്യായവിധിയെക്കുറിച്ചുള്ള വിശദമായ ഒരു സിദ്ധാന്തം പാഠത്തിലേക്ക് ചേർക്കാതെ, വിശാലമായ പദസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വീടുകൾ വിഴുങ്ങുക’ എന്ന ശക്തമായ മൂലഭാഷാരൂപകം നിലനിർത്തി; കപടപ്രാർഥനയുടെ ഉദ്ദേശ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാകുന്ന വിധത്തിൽ അവതരിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
