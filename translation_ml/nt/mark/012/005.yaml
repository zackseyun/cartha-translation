revisions:
- from: പിന്നെ അവൻ മറ്റൊരാളെ അയച്ചു; അവനെയും അവർ കൊന്നു. വേറെ പലരെയും അയച്ചു; അവരിൽ ചിലരെ അവർ അടിക്കുകയും മറ്റു ചിലരെ കൊല്ലുകയും ചെയ്തു.
  to: പിന്നെ അവൻ മറ്റൊരാളെ അയച്ചു; അവനെയും അവർ കൊന്നു. പിന്നെ അവൻ മറ്റു പലരെയും അയച്ചു; അവരിൽ ചിലരെ അടിച്ചു, മറ്റു ചിലരെ കൊന്നു.
  rationale: The revision preserves the Greek narrative sequence and its distributive contrast (‘some … others’), while using more idiomatic modern standard Malayalam. The supplied second ‘അയച്ചു’ represents the readily inferred verb in the Greek elliptical phrase and makes the Malayalam sentence complete and clear. No footnote is needed, since the compressed Greek participial construction is naturally represented by finite verbs without material loss of meaning.
