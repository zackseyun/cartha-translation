id: MRK.12.5
reference: Mark 12:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: ml
  text: പിന്നെ അവൻ മറ്റൊരാളെ അയച്ചു; അവനെയും അവർ കൊന്നു. പിന്നെ അവൻ മറ്റു പലരെയും അയച്ചു; അവരിൽ ചിലരെ അടിച്ചു, മറ്റു ചിലരെ കൊന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: മറ്റൊരാളെ
  rationale: മുമ്പ് അയച്ച ദാസന്മാരുടെ തുടർച്ചയിൽ അയച്ച മറ്റൊരു ദാസനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: അയയ്ക്കുക എന്ന ലളിതമായ ആഖ്യാനപ്രവർത്തിയെ അതേപടി അവതരിപ്പിക്കുന്നു.
- source_word: κἀκεῖνον
  choice: അവനെയും
  rationale: καί + ἐκεῖνον എന്ന സംയോജനത്തിലെ കൂട്ടിച്ചേർക്കൽഭാവവും വ്യക്തിയെ ചൂണ്ടിക്കാണിക്കുന്ന അർത്ഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀπέκτειναν
  choice: അവർ കൊന്നു
  rationale: കൊല്ലുക എന്ന നേരിട്ടുള്ള അർത്ഥവും സംഭവത്തിലെ അക്രമത്തിന്റെ തീവ്രതയും നിലനിർത്തുന്നു.
- source_word: πολλοὺς ἄλλους
  choice: വേറെ പലരെയും
  rationale: തുടർന്ന് അയയ്ക്കപ്പെട്ട അനേകം ദാസന്മാരെ സൂചിപ്പിക്കുന്ന പദസമുച്ചയം സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: അവരിൽ ചിലരെ ... മറ്റു ചിലരെ
  rationale: പലരോടും വ്യത്യസ്തമായി ചെയ്ത പ്രവൃത്തികളെ വിഭജിച്ചു കാണിക്കുന്ന ഗ്രീക്ക് സഹബന്ധഘടന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δέροντες
  choice: അടിക്കുകയും
  rationale: ഔപചാരികമായ ചാട്ടവാറടിയെന്ന് അനാവശ്യമായി നിർണ്ണയിക്കാതെ δέρω എന്നതിന്റെ വിശാലമായ അക്രമാർഥം നൽകുന്നു.
- source_word: ἀποκτέννοντες
  choice: കൊല്ലുകയും ചെയ്തു
  rationale: വർത്തമാന കൃദന്തരൂപത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ സംഗ്രഹാഖ്യാനമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: കൃദന്തങ്ങളുള്ള സംഗ്രഹവാക്യത്തിന്റെ അവതരണം
  choice: അവരിൽ ചിലരെ അവർ അടിക്കുകയും മറ്റു ചിലരെ കൊല്ലുകയും ചെയ്തു
  alternative: ചിലരെ അടിച്ചും ചിലരെ കൊന്നും
  rationale: ഇത് ഉപദേശപരമായ തീരുമാനമല്ല, വാക്യഘടനാപരമായതാണ്. ഗ്രീക്ക് കൃദന്തങ്ങൾ പല ദാസന്മാർക്കു നേരെയുണ്ടായ ആവർത്തിത പ്രവൃത്തികളെ വിഭജിച്ചു സംഗ്രഹിക്കുന്നു; മലയാളത്തിലെ സമാപികാക്രിയയോടുകൂടിയ ഈ രൂപം ആ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്രോതസ്സിലെ വിതരണഘടനയും അക്രമത്തിന്റെ വർധനയും നിലനിർത്തിയിട്ടുണ്ട്; വ്യക്തമാക്കേണ്ട യഥാർത്ഥ പാഠഭേദമോ അർത്ഥസന്ദിഗ്ധതയോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
