revisions:
- from: 'പുനരുത്ഥാനം ഇല്ല എന്നു പറയുന്ന സദൂക്യർ അവന്റെ അടുക്കൽ വന്ന് ഇങ്ങനെ ചോദിച്ചുതുടങ്ങി:'
  to: 'പുനരുത്ഥാനം ഇല്ലെന്ന് പറയുന്ന സദൂക്യർ അവന്റെ അടുക്കൽ വന്ന് അവനോടു ഇങ്ങനെ ചോദിച്ചുതുടങ്ങി:'
  rationale: The revision preserves the draft’s faithful terminology and inceptive rendering of the imperfect while explicitly translating αὐτόν as “അവനോടു.” No footnote is needed.
  reviewer_model: gpt-5.6-terra
