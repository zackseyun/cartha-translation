source:
  edition: SBLGNT
  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: ml
  text: 'പുനരുത്ഥാനം ഇല്ലെന്ന് പറയുന്ന സദൂക്യർ അവന്റെ അടുക്കൽ വന്ന് അവനോടു ഇങ്ങനെ ചോദിച്ചുതുടങ്ങി:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: സദൂക്യർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: ἀνάστασιν
  choice: പുനരുത്ഥാനം
  rationale: മരിച്ചവർ വീണ്ടും ഉയിർത്തെഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പദം.
- source_word: ἐπηρώτων
  choice: ചോദിച്ചുതുടങ്ങി
  rationale: അപൂർണ ഭൂതകാലരൂപത്തിന്റെ തുടർച്ചയെയോ ആരംഭഘട്ടത്തെയോ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുകയും ഇംഗ്ലീഷ് പരിശോധനാപാളിയിലെ ‘began questioning’ എന്ന സൂക്ഷ്മത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സദൂക്യരുടെ പുനരുത്ഥാനനിഷേധം
  choice: പുനരുത്ഥാനം ഇല്ല എന്നു പറയുന്ന
  alternative: പുനരുത്ഥാനം ഇല്ലെന്ന് വിശ്വസിക്കുന്ന
  rationale: λέγουσιν എന്നത് അക്ഷരാർഥത്തിൽ ‘പറയുന്നു’ എന്നാണ്; ‘വിശ്വസിക്കുന്നു’ എന്ന് വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ മൂലപാഠത്തിന്റെ പ്രസ്താവന സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സ്വാഭാവികവും മാന്യവുമായ മലയാളം. തുടർന്നുവരുന്ന നേരിട്ടുള്ള പ്രസ്താവനയിലേക്ക് നയിക്കുന്നതിനായി വാക്യാവസാനത്തിൽ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
