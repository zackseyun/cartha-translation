translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് ഖണ്ഡവാക്യം ഒറ്റയ്ക്ക് വായിക്കുമ്പോൾ വ്യാകരണപരമായി ആശ്രിതമായതിനാൽ, മുൻവാക്യത്തിലെ ആഗ്രഹം വ്യക്തമാക്കാൻ ‘അവർ ആഗ്രഹിക്കുന്നു’ ചേർത്തിരിക്കുന്നു; ഇത് സന്ദർഭാർഥം വ്യക്തമാക്കുന്ന പൂരകമാണ്.
