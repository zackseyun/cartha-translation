source:
  edition: SBLGNT
  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: ml
  text: അവൻ വീണ്ടും അവരുടെ അടുക്കൽ മറ്റൊരു ദാസനെ അയച്ചു[a]. അവർ ആ ദാസനെ തലയിൽ അടിക്കുകയും[b] അവനെ അപമാനിക്കുകയും ചെയ്തു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മറ്റൊരു അടിമയെ.’ ഗ്രീക്കിലെ ദൂലോസ് എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ദാസൻ’ എന്നും ‘അടിമ’ എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെയുള്ള അപൂർവമായ ക്രിയ തല ലക്ഷ്യമാക്കിയ അക്രമത്തെ സൂചിപ്പിക്കുന്നു. അതിന് ‘അവന്റെ തലയിൽ മുറിവേൽപ്പിച്ചു’ എന്നും അർഥമാകാം; ഇവിടെ ‘ശിരഛേദം ചെയ്തു’ എന്നല്ല.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവനോട് ലജ്ജാകരമായി പെരുമാറി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ഉപമയിലെ ആവർത്തിച്ചുള്ള നടപടിയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: അയയ്ക്കുക എന്ന സാധാരണ അർഥം നൽകുന്ന ഭൂതകാല ആഖ്യാനരൂപം മലയാളത്തിൽ ലളിതമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: πρὸς αὐτοὺς
  choice: അവരുടെ അടുക്കൽ
  rationale: അയയ്ക്കുക എന്ന ക്രിയയോടൊപ്പം ലക്ഷ്യസ്ഥാനത്തെയും ആളുകളെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἄλλον δοῦλον
  choice: മറ്റൊരു ദാസനെ
  rationale: യജമാനനോടുള്ള അധീനബന്ധം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു; അടിമ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: κἀκεῖνον
  choice: അവർ അവന്റെ
  rationale: ‘ആ ഒരുവനെയും’ എന്ന തുടർച്ചയുടെ ആശയം സന്ദർഭവും വാക്യബന്ധവും വ്യക്തമാക്കുന്നതിനാൽ, മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐκεφαλίωσαν
  choice: അവന്റെ തലയിൽ അടിച്ചു
  rationale: അപൂർവമായ ഈ ക്രിയ തല ലക്ഷ്യമാക്കിയ അക്രമത്തെ സൂചിപ്പിക്കുന്നു; ശിരഛേദം എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἠτίμασαν
  choice: അവനെ അപമാനിച്ചു
  rationale: മാനഹാനിക്കും ലജ്ജാകരമായ പെരുമാറ്റത്തിനുമുള്ള ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
