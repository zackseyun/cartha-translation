  terminology: ‘ദാസൻ’ is an acceptable contextual rendering of δοῦλος, with ‘അടിമ’ correctly retained as an alternative. ‘അപമാനിക്കുക’ suitably conveys ἠτίμασαν. The lexical note on ἐκεφαλίωσαν appropriately avoids the unsupported sense ‘beheaded.’
