    issue: The translation weakens the resumptive/emphatic reference in κἀκεῖνον.
    rationale: ‘അവർ അവന്റെ തലയിൽ...’ is understandable, but ‘ആ ദാസനെ’ better represents ‘that one also’ and clearly identifies the object of both actions.
