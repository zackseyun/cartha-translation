translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ അപൂർവ ക്രിയയുടെ അനിശ്ചിതത്വവും δοῦλος എന്ന പദത്തിന്റെ സാമൂഹിക അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിരിക്കുന്നു.
