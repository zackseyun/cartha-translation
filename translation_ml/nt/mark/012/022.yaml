translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. കുടുംബവംശത്തിന്റെ തുടർച്ച എന്ന അർഥത്തിൽ ‘സന്തതി’ ഉപയോഗിച്ചു; മൂലത്തിലെ ‘വിത്ത്’ എന്ന രൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
