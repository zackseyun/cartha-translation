  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: ml
  text: ആ ഏഴുപേരും സന്തതിയൊന്നും ശേഷിപ്പിച്ചില്ല.[a] എല്ലാവർക്കും ഒടുവിൽ, ആ സ്ത്രീയും മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘വിത്ത് ശേഷിപ്പിച്ചില്ല’; അതായത്, സന്തതിയെയോ പിൻതലമുറയെയോ ശേഷിപ്പിച്ചില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: ആ ഏഴുപേരും
  rationale: നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്ന സംഖ്യ മുൻസന്ദർഭത്തിലെ ഏഴ് സഹോദരന്മാരെ സൂചിപ്പിക്കുന്നു. ‘ആ ഏഴുപേരും’ എന്നത് ആ സൂചനയും എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: സന്തതിയൊന്നും ശേഷിപ്പിച്ചില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘വിത്ത് ശേഷിപ്പിച്ചില്ല’ എന്നാണെങ്കിലും ഇവിടെ σπέρμα വംശതുടർച്ചയെയോ സന്താനത്തെയോ സൂചിപ്പിക്കുന്നു. ‘സന്തതിയൊന്നും ശേഷിപ്പിച്ചില്ല’ എന്നത് മൂലപ്രയോഗത്തിന്റെ ആശയം വ്യക്തവും മാന്യവുമായി നൽകുന്നു.
- source_word: ἔσχατον πάντων
  choice: എല്ലാവരുടെയും പിന്നാലെ, ഒടുവിൽ
  rationale: ഈ പ്രയോഗം സംഭവക്രമത്തിൽ മറ്റെല്ലാവർക്കും ശേഷമുള്ള അവസാന ഘട്ടത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ക്രമവും ഊന്നലും വ്യക്തമായി നിലനിർത്താൻ ഈ രൂപം സ്വീകരിച്ചു.
- source_word: καὶ ἡ γυνὴ
  choice: ആ സ്ത്രീയും
  rationale: καί-യുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-യും’ വഴി നിലനിർത്തുന്നു; നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ മുൻപ് പരാമർശിച്ച സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπέθανεν
  choice: മരിച്ചു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം മയപ്പെടുത്താതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
