source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: ml
  text: 'അവൻ വിവേകപൂർവം ഉത്തരം പറഞ്ഞതായി കണ്ട യേശു അവനോടു പറഞ്ഞു: “നീ ദൈവരാജ്യത്തിൽനിന്ന് അകലെയല്ല”[a]. അതിനുശേഷം യേശുവിനോടു ചോദ്യം ചെയ്യാൻ ഇനി ആരും ധൈര്യപ്പെട്ടില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീ ദൈവരാജ്യത്തിന് അടുത്താണ്” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് വാചകം സാമീപ്യമാണ് സൂചിപ്പിക്കുന്നത്; രാജ്യത്തിൽ പ്രവേശിച്ചതായി വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: കണ്ട
  rationale: സംഭാഷകന്റെ ഉത്തരം യേശു വിലയിരുത്തിയെന്ന നിരീക്ഷണഭാവം നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാള പ്രയോഗം.
- source_word: νουνεχῶς
  choice: വിവേകപൂർവം
  rationale: ചിന്താപൂർവമായ ബോധത്തോടും നല്ല വിവേചനത്തോടും കൂടിയ മറുപടി എന്ന അർഥം മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀπεκρίθη
  choice: ഉത്തരം പറഞ്ഞതു
  rationale: യേശുവിന്റെ തുടർന്നുള്ള പ്രസ്താവനയ്ക്കുമുമ്പ് നടന്ന മറുപടിയെ മലയാളത്തിൽ വ്യക്തമായ ക്രമത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: നീ ... അകലെയല്ല
  rationale: മൂലത്തിലെ സ്ഥലസാമീപ്യരൂപകം സംരക്ഷിക്കുകയും രാജ്യത്തിൽ ഇതിനകം പ്രവേശിച്ചുവെന്ന ശക്തമായ നിഗമനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: ഭരണവും രാജ്യവും ഉൾക്കൊള്ളാവുന്ന സുവിശേഷങ്ങളിലെ പരിചിതവും സന്ദർഭോചിതവുമായ മലയാള പദം.
- source_word: οὐκέτι
  choice: അതിനുശേഷം ... ഇല്ല
  rationale: ആ നിമിഷംമുതൽ ചോദ്യം ചെയ്യൽ തുടർന്നില്ലെന്ന കാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐτόλμα
  choice: ധൈര്യപ്പെട്ടില്ല
  rationale: ചെയ്യാൻ തുനിയുകയോ സാഹസപ്പെടുകയോ ചെയ്തില്ലെന്ന ക്രിയയുടെ ഭാവം നേരിട്ട് നൽകുന്നു.
- source_word: ἐπερωτῆσαι
  choice: ചോദ്യം ചോദിക്കാൻ
  rationale: കേവലം എന്തെങ്കിലും ചോദിക്കുക എന്നതിലുപരി ഒരാളെ ചോദ്യം ചെയ്യുക എന്ന സന്ദർഭഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശാസ്ത്രിയുടെ ദൈവരാജ്യത്തോടുള്ള നില
  choice: “ദൈവരാജ്യത്തിൽനിന്ന് അകലെയല്ല” എന്ന് പരിഭാഷപ്പെടുത്തി; അവൻ ഇതിനകം രാജ്യത്തിൽ പ്രവേശിച്ചുവെന്ന് സൂചിപ്പിച്ചില്ല.
  alternative: “ദൈവരാജ്യത്തിന് അടുത്താണ്”
  rationale: ഗ്രീക്ക് വാചകം സാമീപ്യം പ്രസ്താവിക്കുന്നുവെങ്കിലും രാജ്യത്തിന്റെ കൈവശമോ അതിലേക്കുള്ള പ്രവേശനമോ ഉറപ്പിക്കുന്നില്ല. അതിനാൽ യേശുവിന്റെ അഭിനന്ദനവും ശേഷിക്കുന്ന അകലവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ശൈലി. “വിവേകപൂർവം,” “അകലെയല്ല,” “ധൈര്യപ്പെട്ടില്ല” എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിന്റെ അർഥഭേദങ്ങൾ നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികത ഉറപ്പാക്കുന്നു.
