id: MRK.12.36
reference: Mark 12:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: ml
  text: 'ദാവീദ് തന്നേ പരിശുദ്ധാത്മാവിൽ[a] ഇങ്ങനെ പറഞ്ഞു: ‘കർത്താവ് എന്റെ കർത്താവിനോടു പറഞ്ഞു: “ഞാൻ നിന്റെ ശത്രുക്കളെ നിന്റെ കാലുകൾക്കു കീഴിൽ ആക്കുന്നതുവരെ നീ എന്റെ വലതുഭാഗത്ത് ഇരിക്കൂ.”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരിശുദ്ധാത്മാവിനാൽ.’ ഈ ഉദ്ധരണി സങ്കീർത്തനം 110:1-ൽ നിന്നുള്ളതാണ്. അതിന്റെ എബ്രായപാഠത്തിൽ ആദ്യത്തെ ‘കർത്താവ്’ ദൈവനാമമായ YHWH-നെ (പരമ്പരാഗതമായി ‘യഹോവ’) പ്രതിനിധീകരിക്കുന്നു; രണ്ടാമത്തേത് ദാവീദിന്റെ കർത്താവിനെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading_and_cross_reference
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: ദാവീദുതന്നെ
  rationale: αὐτός എന്ന പദത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘-തന്നെ’കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാനരൂപം നിലനിർത്തുകയും പ്രചോദനത്തിന്റെ കൃത്യമായ രീതി അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κύριος / τῷ κυρίῳ μου
  choice: കർത്താവ് / എന്റെ കർത്താവിനോട്
  rationale: ഗ്രീക്കിലെ κύριος എന്ന ആവർത്തനം നിലനിർത്തുന്നു; സങ്കീർത്തനത്തിലെ എബ്രായ പശ്ചാത്തലത്തിലുള്ള വ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Κάθου ἐκ δεξιῶν μου
  choice: നീ എന്റെ വലത്തുഭാഗത്ത് ഇരിക്കുക
  rationale: രാജകീയ സ്ഥാനാരോഹണസന്ദർഭത്തിലെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ἕως ἂν θῶ
  choice: ഞാൻ ... ആക്കുന്നതുവരെ
  rationale: ഭാവിയിലെ പരിധിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: നിന്റെ കാൽക്കീഴിൽ
  rationale: ‘പാദപീഠം’ എന്ന സങ്കീർത്തനത്തിലെ വിപുലമായ രൂപം ചേർക്കാതെ മർക്കോസിന്റെ ‘കാലുകൾക്കു കീഴിൽ’ എന്ന വാചകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ ആത്മപ്രേരിത വചനത്തിന്റെ അവതരണം
  choice: ദാവീദുതന്നെ പരിശുദ്ധാത്മാവിൽ ... പറഞ്ഞു
  alternative: ദാവീദുതന്നെ പരിശുദ്ധാത്മാവിനാൽ ... പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ἐν എന്നത് നേരിട്ട് പ്രതിഫലിപ്പിച്ച് പരിശുദ്ധാത്മാവിന്റെ പങ്ക് ഉറപ്പാക്കുന്നു; എന്നാൽ പ്രചോദനത്തിന്റെ രീതി കൂടുതൽ കൃത്യമായി നിർവചിക്കുന്നില്ല.
- issue: സങ്കീർത്തനം 110:1-ന്റെ ക്രിസ്തുശാസ്ത്രപരമായ പ്രാബല്യം
  choice: കർത്താവ് എന്റെ കർത്താവിനോട്
  alternative: യഹോവ എന്റെ കർത്താവിനോട്
  rationale: മർക്കോസിന്റെ ഗ്രീക്ക് പാഠത്തിൽ രണ്ടിടത്തും κύριος ഉള്ളതിനാൽ മുഖ്യപാഠത്തിൽ ആവർത്തനം സംരക്ഷിക്കുന്നു; എബ്രായ മൂലത്തിലെ ദൈവനാമവ്യത്യാസം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ എന്നത് ഉദ്ധരണിയിലെ ദൈവിക പ്രസ്താവനയ്ക്ക് യോജിച്ച മാന്യരൂപമായി ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളിൽ സൂചികകളും ഉള്ളടക്കവും തമ്മിൽ ഉണ്ടായിരുന്ന സ്ഥാനമാറ്റം തിരുത്തി, രണ്ടും [a] എന്ന ഏക അടിക്കുറിപ്പിൽ സുതാര്യമായി ചേർത്തു.
