language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: ml
  text: 'ശാസ്ത്രി അവനോടു പറഞ്ഞു: “ഗുരുവേ, അങ്ങ് നന്നായി, സത്യമായി പറഞ്ഞിരിക്കുന്നു: അവൻ ഏകനാണ്[a], അവനല്ലാതെ മറ്റാരുമില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, സന്ദർഭം കൂടുതൽ വ്യക്തമാക്കി: “ദൈവം ഏകനാണ്.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “അവൻ ഏകനാണ്” എന്നാണുള്ളത്; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: ശാസ്ത്രി
  rationale: സുവിശേഷങ്ങളിലെ തോറാ പണ്ഡിതരുടെ അംഗീകൃത വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന γραμματεύς എന്ന പദത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥാപിതവും സംക്ഷിപ്തവുമായ സമാനപദം.
- source_word: Καλῶς
  choice: നന്നായി പറഞ്ഞു
  rationale: യേശുവിന്റെ മുൻമറുപടിയെ അംഗീകരിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗം സ്വാഭാവികമായ മലയാള സംഭാഷണശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: διδάσκαλε
  choice: ഗുരുവേ
  rationale: അഭിസംബോധനയിൽ διδάσκαλος എന്നതിന്റെ സ്വാഭാവികവും ആദരസൂചകവുമായ ആധുനിക മലയാളരൂപം.
- source_word: ἐπ’ ἀληθείας
  choice: സത്യമായി
  rationale: യേശുവിന്റെ പ്രസ്താവന സത്യമാണെന്ന് ഉറപ്പിക്കുന്ന ക്രിയാവിശേഷണാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἶπες
  choice: നീ ... പറഞ്ഞിരിക്കുന്നു
  rationale: ഇപ്പോൾത്തന്നെ പറഞ്ഞ വാക്കിനുള്ള പ്രസക്തി സംഭാഷണത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന മലയാള പൂർത്തകാലരൂപം.
- source_word: ὅτι
  choice: എന്നു
  rationale: ഇവിടെ കാരണമല്ല, പറഞ്ഞതിന്റെ ഉള്ളടക്കമാണ് ὅτι പരിചയപ്പെടുത്തുന്നത്; മലയാളത്തിൽ ഉദ്ധരണിയുള്ളടക്കത്തിന്റെ സ്വാഭാവിക സമാപകമാണ് ‘എന്നു’.
- source_word: εἷς ἐστιν
  choice: അവൻ ഏകനാണ്
  rationale: ഗ്രീക്കിൽ ‘ദൈവം’ വീണ്ടും വ്യക്തമാക്കിയിട്ടില്ല; മുൻസന്ദർഭത്തിൽനിന്നുള്ള സൂചിത കർത്താവിനെ ‘അവൻ’ എന്ന രൂപത്തിൽ നിലനിർത്തുകയും ഏകത്വം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἔστιν ἄλλος
  choice: മറ്റാരുമില്ല
  rationale: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘മറ്റാരുമില്ല’ സ്വാഭാവിക മലയാളമാണ്; നിഷേധാത്മക അസ്തിത്വപ്രസ്താവന സംക്ഷിപ്തമായി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: πλὴν αὐτοῦ
  choice: അവനല്ലാതെ
  rationale: ഒഴിവാക്കലും അനന്യതയും സൂചിപ്പിക്കുന്ന πλήν + genitive എന്ന ഘടനയുടെ നേരിട്ടുള്ള സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: εἷς ἐστιν എന്നതിലെ സൂചിത കർത്താവ്
  choice: പ്രധാനവാചകത്തിൽ ‘അവൻ ഏകനാണ്’ എന്നു നൽകി, ‘ദൈവം’ എന്ന നാമം ചേർക്കാതെ ഗ്രീക്കിലെ സംക്ഷിപ്തത നിലനിർത്തി.
  alternative: ‘ദൈവം ഏകനാണ്’ അല്ലെങ്കിൽ ‘ഏകദൈവമേ ഉള്ളൂ’.
  rationale: മുൻസന്ദർഭം ഇസ്രായേലിന്റെ ഏകദൈവത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് θεός എന്നു ആവർത്തിക്കുന്നില്ല. അതിനാൽ സൂചിത കർത്താവിനെ നിലനിർത്തുന്നത് മൂലപാഠത്തോടുള്ള സുതാര്യതയും അതിലെ യഥാർഥ സംക്ഷിപ്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ സംഭാഷണശൈലി. ‘ശാസ്ത്രി’ എന്ന സ്ഥാപിത ബൈബിൾ പദം നിലനിർത്തി; ഗ്രീക്കിലെ സൂചിത കർത്താവിനെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
