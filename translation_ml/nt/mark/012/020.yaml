  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ വേദപാഠത്തിന് യോജിച്ച മാന്യമായ ശൈലി പാലിച്ചു. മൂലപാഠത്തിലെ വിവാഹപ്രയോഗം അക്ഷരാർഥമായി പകർത്താതെ അതിന്റെ അർത്ഥം സ്വാഭാവികമായി നൽകി; ‘സന്തതി’ എന്ന പദത്തിലൂടെ σπέρμαയുടെ വിശാലമായ കുടുംബപരമായ അർത്ഥം നിലനിർത്തി.
