  text: ἑπτὰ ἀδελφοὶ ἦσαν· καὶ ὁ πρῶτος ἔλαβεν γυναῖκα, καὶ ἀποθνῄσκων οὐκ ἀφῆκεν σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: ml
  text: ഏഴു സഹോദരന്മാർ ഉണ്ടായിരുന്നു. ഒന്നാമൻ ഒരു സ്ത്രീയെ ഭാര്യയായി സ്വീകരിച്ചു; അവൻ മരിച്ചപ്പോൾ സന്തതിയൊന്നും ശേഷിപ്പിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിത്തൊന്നും ശേഷിപ്പിച്ചില്ല.’ ഇവിടെ ‘വിത്ത്’ എന്ന ഗ്രീക്ക് പദം സന്തതിയെയോ പിൻതലമുറയെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: ഏഴു സഹോദരന്മാർ ഉണ്ടായിരുന്നു
  rationale: അസ്തിത്വസൂചകമായ ഗ്രീക്ക് വാക്യഘടന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുമ്പോഴും, സന്ദർഭത്തിൽ പുരുഷസഹോദരന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത് എന്നത് നിലനിർത്തുന്നു.
- source_word: ὁ πρῶτος
  choice: ഒന്നാമൻ
  rationale: സഹോദരന്മാരുടെ ക്രമത്തിലെ ആദ്യത്തെയാളെ സൂചിപ്പിക്കുന്നു; ‘മൂത്തവൻ’ എന്നു പറഞ്ഞാൽ മൂലപാഠത്തിൽ നിർബന്ധമല്ലാത്ത പ്രായസൂചന ചേർന്നുപോകും.
- source_word: ἔλαβεν γυναῖκα
  choice: ഒരു സ്ത്രീയെ ഭാര്യയായി സ്വീകരിച്ചു
  rationale: വിവാഹബന്ധത്തിൽ പ്രവേശിച്ചു എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർത്ഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘ഭാര്യയെ എടുത്തു’ എന്ന അക്ഷരാർഥപ്രയോഗം ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികമാണ്.
- source_word: ἀποθνῄσκων
  choice: അവൻ മരിച്ചപ്പോൾ
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ കാലസംബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ഉപവാക്യമായി നൽകുന്നു.
- source_word: οὐκ ἀφῆκεν σπέρμα
  choice: സന്തതിയൊന്നും ശേഷിപ്പിച്ചില്ല
  rationale: മരണാനന്തരം മക്കളെയോ വംശപരമ്പരയെയോ ശേഷിപ്പിക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു. σπέρμα എന്നതിന്റെ അക്ഷരാർഥമായ ‘വിത്ത്’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
