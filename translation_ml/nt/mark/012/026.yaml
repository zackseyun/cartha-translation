id: MRK.12.26
reference: Mark 12:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: ml
  text: മരിച്ചവരെക്കുറിച്ച്—അവർ ഉയിർപ്പിക്കപ്പെടുന്നു എന്നതിനെക്കുറിച്ച്—മോശയുടെ പുസ്തകത്തിൽ, മുൾപ്പടർപ്പിനെക്കുറിച്ചുള്ള ഭാഗത്ത്[a], ദൈവം മോശയോട്, ‘ഞാൻ അബ്രാഹാമിന്റെ ദൈവവും യിസ്ഹാക്കിന്റെ ദൈവവും യാക്കോബിന്റെ ദൈവവും ആകുന്നു’ എന്നു പറഞ്ഞത് എങ്ങനെയെന്ന് നിങ്ങൾ വായിച്ചിട്ടില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുൾപ്പടർപ്പിന്റെ അടുക്കൽ”; ഈ ഗ്രീക്ക് പ്രയോഗം മുൾപ്പടർപ്പിന്റെ സംഭവത്തെ അടിസ്ഥാനമാക്കി തിരുവെഴുത്തിലെ ഭാഗത്തെ തിരിച്ചറിയിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: മരിച്ചവർ ... എന്ന കാര്യത്തെക്കുറിച്ചാകട്ടെ
  rationale: περί + genitive ചർച്ചാവിഷയം അവതരിപ്പിക്കുന്നു. δέ-യുടെ ലഘുവായ വിഷയമാറ്റം ‘-ആകട്ടെ’ എന്ന പ്രയോഗം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; അനാവശ്യമായ ശക്തമായ വൈരുധ്യം സൃഷ്ടിക്കുന്നില്ല.
- source_word: ὅτι ἐγείρονται
  choice: ഉയിർപ്പിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല passive രൂപം നിലനിർത്തുകയും മരിച്ചവരുടെ പുനരുത്ഥാനത്തെ പൊതുസത്യമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു. ‘ഉയിർത്തെഴുന്നേൽക്കുന്നു’ എന്ന കർത്തൃപ്രധാന രൂപത്തേക്കാൾ ഗ്രീക്കിലെ passive ഭാവം ഇതിൽ വ്യക്തമാണ്.
- source_word: οὐκ ἀνέγνωτε
  choice: നിങ്ങൾ വായിച്ചിട്ടില്ലയോ?
  rationale: തിരുവെഴുത്തിനെക്കുറിച്ചുള്ള പരിചയം ഓർമിപ്പിക്കുന്ന യേശുവിന്റെ ആലങ്കാരിക ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: മോശയുടെ പുസ്തകത്തിൽ
  rationale: βίβλος എന്നത് പുസ്തകത്തെയോ ചുരുളിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ മോശയുടെ എഴുത്തുകളെ സൂചിപ്പിക്കുന്ന ലളിതവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: ἐπὶ τοῦ βάτου
  choice: മുൾപ്പടർപ്പിനെക്കുറിച്ചുള്ള ഭാഗത്ത്
  rationale: മുൾപ്പടർപ്പിന്റെ സംഭവത്തെ അടിസ്ഥാനമാക്കി തിരുവെഴുത്തിലെ ഭാഗം തിരിച്ചറിയിക്കുന്ന പ്രയോഗമായി ഇതിനെ അവതരിപ്പിക്കുന്നു; സ്ഥലസൂചനയായി മാത്രം ചുരുക്കുന്നില്ല.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: ദൈവം മോശയോട് എങ്ങനെ പറഞ്ഞുവെന്ന് ... ‘...’ എന്ന് അവിടുന്ന് പറഞ്ഞു
  rationale: πῶς ഉദ്ധരണിയുടെ ഉള്ളടക്കത്തിലേക്കു നയിക്കുന്നു; αὐτῷ എന്ന സർവനാമത്തിന്റെ സൂചന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘മോശയോട്’ എന്നു തുറന്നുപറയുന്നു. λέγων ഉദ്ധരണിയിലേക്ക് സ്വാഭാവികമായി മാറ്റുന്നു.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: ഞാൻ അബ്രാഹാമിന്റെ ദൈവവും യിസ്ഹാക്കിന്റെ ദൈവവും യാക്കോബിന്റെ ദൈവവും ആകുന്നു
  rationale: ‘ദൈവം’ എന്ന പദത്തിന്റെ ആവർത്തനവും വർത്തമാനകാലമായ ‘ആകുന്നു’ എന്നതും നിലനിർത്തുന്നു; യേശുവിന്റെ വാദത്തിൽ ഈ രണ്ടിനും പ്രാധാന്യമുണ്ട്.
theological_decisions:
- issue: ὅτι ἐγείρονται എന്നതിലെ പുനരുത്ഥാനഭാഷ
  choice: ഉയിർപ്പിക്കപ്പെടുന്നു
  alternative: ഉയിർത്തെഴുന്നേൽക്കുന്നു
  rationale: passive രൂപം സംരക്ഷിക്കുന്നതിനാൽ ഉയിർപ്പിക്കൽ മരിച്ചവരിൽ സ്വയം സംഭവിക്കുന്നതായി പറയാതെ ഗ്രീക്ക് വാചകത്തിന്റെ ദൈവപ്രവർത്തനസാധ്യത നിലനിർത്തുന്നു; എന്നാൽ പ്രവർത്തകനെ വാചകത്തിൽ ചേർക്കുന്നില്ല.
- issue: ദൈവത്തിന്റെ സ്വയംപരിചയപ്പെടുത്തലിലെ വർത്തമാനകാലവും ആവർത്തനവും
  choice: ഞാൻ അബ്രാഹാമിന്റെ ദൈവവും യിസ്ഹാക്കിന്റെ ദൈവവും യാക്കോബിന്റെ ദൈവവും ആകുന്നു
  alternative: ഞാൻ അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യാക്കോബിന്റെയും ദൈവമാണ്
  rationale: സംക്ഷിപ്തമായ ബദൽ സ്വാഭാവികമാണെങ്കിലും ഗ്രീക്കിലെ ‘ദൈവം’ എന്ന ആവർത്തനവും ‘ഞാൻ ... ആകുന്നു’ എന്ന വ്യക്തമായ വർത്തമാനകാലവും യേശുവിന്റെ തുടർന്നുള്ള വാദത്തിന് പ്രസക്തമാണ്; അതിനാൽ അവ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘അവിടുന്ന്’ ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്നു; അതേസമയം മൂലപാഠത്തിലെ ആവർത്തനവും വർത്തമാനകാലവും സംരക്ഷിച്ചിട്ടുണ്ട്.
