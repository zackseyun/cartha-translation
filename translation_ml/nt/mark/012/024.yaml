id: MRK.12.24
reference: Mark 12:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “നിങ്ങൾ തിരുവെഴുത്തുകളെയോ ദൈവത്തിന്റെ ശക്തിയെയോ അറിയാത്തതുകൊണ്ടല്ലേ തെറ്റിപ്പോകുന്നത്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തിരുവെഴുത്തുകളെയോ ദൈവത്തിന്റെ ശക്തിയെയോ അറിയാത്തതിനാലല്ലേ നിങ്ങൾ വഴിതെറ്റുന്നത്?”'
    reason: πλανᾶσθε എന്ന പദത്തിന്റെ ‘തെറ്റിലാകുക/വഴിതെറ്റുക’ എന്ന അർഥവ്യാപ്തിയും ഗ്രീക്ക് വാക്യഘടനയുടെ മറ്റൊരു സ്വാഭാവിക അവതരണവും രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: യേശു അവരോടു പറഞ്ഞു
  rationale: φημί നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന സാധാരണ ‘പറയുക’ എന്ന അർഥത്തിലാണ്; സന്ദർഭത്തിൽ ഇല്ലാത്ത ‘മറുപടി പറഞ്ഞു’ എന്ന ഭാവം ചേർക്കുന്നില്ല.
- source_word: Οὐ διὰ τοῦτο
  choice: അതുകൊണ്ടല്ലേ
  rationale: οὐ ചേർന്ന ചോദ്യം സമ്മതം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്; διὰ τοῦτοയുടെ കാരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πλανᾶσθε
  choice: തെറ്റിപ്പോകുന്നത്
  rationale: ഇവിടെ ക്രിയയ്ക്ക് ‘തെറ്റിലാകുക/വഴിതെറ്റുക’ എന്ന അർഥവ്യാപ്തിയുണ്ട്. ‘തെറ്റിപ്പോകുക’ ബൗദ്ധികമായ തെറ്റിൽ മാത്രം അർഥം ചുരുക്കാതെയും പുറമേനിന്നുള്ള വഞ്ചന ഉറപ്പിക്കാതെയും ശാസനയുടെ ശക്തി കാക്കുന്നു.
- source_word: μὴ εἰδότες
  choice: അറിയാത്തതുകൊണ്ട്
  rationale: നിഷേധിത കർത്തൃവാചകത്തിന്റെ കാരണബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰς γραφὰς
  choice: തിരുവെഴുത്തുകൾ
  rationale: യഹൂദ-ആദിമക്രൈസ്തവ പ്രയോഗത്തിലെ അംഗീകൃത വിശുദ്ധലിഖിതങ്ങളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്; ‘തിരുവെഴുത്തുകൾ’ നിലവാരമുള്ള മലയാള പദമാണ്.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ശക്തിയെയോ
  rationale: μηδέ മുമ്പുള്ള നിഷേധത്തോട് ചേർന്ന് ‘...യെയോ ...യെയോ അറിയാത്ത’ എന്ന മലയാള സമാന്തരഘടന സൃഷ്ടിക്കുന്നു; δύναμις കൃത്യമായി ‘ശക്തി’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: πλανᾶσθε സൂചിപ്പിക്കുന്ന തെറ്റിന്റെ സ്വഭാവം
  choice: തെറ്റിപ്പോകുന്നത്
  alternative: തെറ്റിദ്ധരിക്കുന്നത് / വഴിതെറ്റിക്കപ്പെടുന്നത്
  rationale: ഗ്രീക്ക് പദം തെറ്റിലാകുക മുതൽ വഴിതെറ്റിക്കപ്പെടുക വരെയുള്ള അർഥങ്ങൾ അനുവദിക്കുന്നു. തിരുവെഴുത്തും ദൈവശക്തിയും അറിയാത്തതാണ് അവരുടെ തെറ്റിന്റെ കാരണമെന്ന് സന്ദർഭം പറയുന്നു; അത് കേവലം ബൗദ്ധിക തെറ്റായോ പുറമേനിന്നുള്ള വഞ്ചനയായോ പരിഭാഷ ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്നതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അലങ്കാരചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുകയും ഗ്രീക്കിലെ കാരണബന്ധം മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ചേർക്കുകയും ചെയ്തു.
