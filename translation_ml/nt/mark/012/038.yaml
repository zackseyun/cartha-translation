source:
  edition: SBLGNT
  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: ml
  text: 'അവൻ തന്റെ ഉപദേശത്തിൽ ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “നീണ്ട മേലങ്കികൾ ധരിച്ച് ചുറ്റിനടക്കാനും[b] ചന്തസ്ഥലങ്ങളിൽ അഭിവാദനങ്ങൾ ലഭിക്കാനും ആഗ്രഹിക്കുന്ന ശാസ്ത്രിമാരെക്കുറിച്ച് ജാഗ്രത പാലിക്കുവിൻ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശാസ്ത്രിമാരെ സൂക്ഷിക്കുവിൻ” എന്നും “ശാസ്ത്രിമാർക്കെതിരെ കരുതലോടിരിക്കുവിൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “നീണ്ട മേലങ്കികൾ” എന്നത് പദവിയും പൊതുമാന്യതയും പ്രകടമാക്കുന്ന ശ്രദ്ധേയമായ പുറംവസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: തന്റെ ഉപദേശത്തിൽ
  rationale: യേശുവിന്റെ സംസാരത്തിന്റെ സന്ദർഭവും മേഖലയുമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ഗ്രീക്ക് ഘടനയോട് അടുത്തുനിൽക്കുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന അഥവാ ആവർത്തിച്ചുള്ള സംസാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ അതിന്റെ ക്രിയാഭാവം നിലനിർത്തുന്നു.
- source_word: Βλέπετε ἀπὸ
  choice: ജാഗ്രത പാലിക്കുവിൻ
  rationale: ἀπό ചേർന്ന ആജ്ഞാരൂപത്തിന് ചിലരിൽനിന്ന് സൂക്ഷിച്ചുനിൽക്കുക എന്ന മുന്നറിയിപ്പിന്റെ ശക്തിയുണ്ട്. ബഹുവചന ആജ്ഞയും ഗൗരവവും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: γραμματέων
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിലെ γραμματεῖς എന്ന പദത്തിനുള്ള പാരമ്പര്യപരവും തിരിച്ചറിയാവുന്നതുമായ നേരിട്ടുള്ള മലയാളപദമാണിത്; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘ന്യായപ്രമാണോപദേഷ്ടാക്കൾ’ എന്നതിനെ ഒഴിവാക്കുന്നു.
- source_word: τῶν θελόντων
  choice: ആഗ്രഹിക്കുന്ന
  rationale: അവരുടെ സ്വഭാവസവിശേഷമായ ഇഷ്ടമോ മോഹമോ വ്യക്തമാക്കുകയും അർത്ഥത്തെ മൃദൂകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: നീണ്ട മേലങ്കികൾ ധരിച്ച് ചുറ്റിനടക്കാൻ
  rationale: στολή ദീർഘവും ശ്രദ്ധേയവുമായ പുറങ്കുപ്പായത്തെ സൂചിപ്പിക്കാം; ‘നീണ്ട മേലങ്കികൾ’ ആ വസ്ത്രരൂപം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: ἀσπασμοὺς
  choice: അഭിവാദനങ്ങൾ
  rationale: പൊതുസ്ഥലത്ത് ലഭിക്കുന്ന ആദരസൂചകമായ വന്ദനത്തെ സന്ദർഭം സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുന്നു.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ചന്തസ്ഥലങ്ങളിൽ
  rationale: ἀγοραί വ്യാപാരത്തിന്റെയും പൊതുകൂടിച്ചേരലിന്റെയും ഇടങ്ങളായിരുന്നു; ‘ചന്തസ്ഥലങ്ങൾ’ ഈ പൊതു പശ്ചാത്തലം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ശാസ്ത്രിമാരെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിന്റെ പരിധി
  choice: പൊതുമാന്യത തേടുന്നവരായി തുടർന്നുള്ള വിശേഷണം നിർവചിക്കുന്ന ശാസ്ത്രിമാരെക്കുറിച്ചുള്ള ധാർമിക മുന്നറിയിപ്പ്
  alternative: എല്ലാ ശാസ്ത്രിമാരെയും ഒരു വർഗമായി സമ്പൂർണമായി കുറ്റപ്പെടുത്തൽ
  rationale: ഗ്രീക്കിൽ ‘ശാസ്ത്രിമാർ’ എന്ന നാമത്തെ ‘ആഗ്രഹിക്കുന്നവർ’ എന്ന പങ്കാളിത്തരൂപം വിശേഷിപ്പിക്കുന്നു. മലയാളത്തിൽ കോമയില്ലാതെ വിശേഷണം നാമത്തോട് ചേർത്തതിലൂടെ ആ നിയന്ത്രകബന്ധം നിലനിർത്തുന്നു; എന്നാൽ മൂലത്തിലെ വർഗനാമം മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പാലിക്കുവിൻ’ എന്ന ബഹുവചന ആജ്ഞ പ്രസംഗത്തിന്റെ ഔന്നത്യം നിലനിർത്തുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചു.
