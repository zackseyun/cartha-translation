id: MRK.12.17
reference: Mark 12:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരോടു പറഞ്ഞു: “കൈസറുടേത് കൈസർക്കും ദൈവത്തിന്റേത് ദൈവത്തിനും തിരിച്ചുനൽകുക.[a]” അവർ അവനെക്കുറിച്ച് അത്യന്തം ആശ്ചര്യപ്പെട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കൈസറിനുള്ളത് കൈസർക്കും ദൈവത്തിനുള്ളത് ദൈവത്തിനും നൽകുക.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് ‘തിരിച്ചുകൊടുക്കുക,’ ‘ബാധ്യതയായത് നൽകുക,’ ‘അർഹിക്കുന്നതു നൽകുക’ എന്നീ അർഥങ്ങൾ വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: കൊടുത്തുതീർക്കുക
  rationale: ഈ ക്രിയയ്ക്ക് തിരികെ കൊടുക്കുക, ബാധ്യതയായത് നൽകുക, അടച്ചുതീർക്കുക എന്നീ അർഥവ്യാപ്തികളുണ്ട്. ‘കൊടുത്തുതീർക്കുക’ എന്നത് അവകാശപ്പെട്ടതോ നൽകേണ്ടതോ നൽകുക എന്ന ശക്തി സൂക്ഷിക്കുന്നു; നികുതിയിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: കൈസറുടേത് കൈസർക്കും
  rationale: ജനിറ്റീവ് ഘടന സൂചിപ്പിക്കുന്ന ഉടമസ്ഥത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുകയും ഗ്രീക്കിലെ സംക്ഷിപ്ത സമാന്തരഘടന പുനരാവിഷ്കരിക്കുകയും ചെയ്യുന്നു.
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: ദൈവത്തിന്റേത് ദൈവത്തിനും
  rationale: ആദ്യ ഖണ്ഡത്തോടുള്ള ഉദ്ദേശ്യപൂർവമായ സമാന്തരതയും ദൈവത്തിന്റെ അവകാശത്തെക്കുറിച്ചുള്ള തുറന്ന വ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- source_word: ἐξεθαύμαζον
  choice: അത്യന്തം ആശ്ചര്യപ്പെട്ടു
  rationale: ἐκθαυμάζω എന്ന ശക്തിപ്പെടുത്തിയ ക്രിയ പ്രകടിപ്പിക്കുന്ന തീവ്രമായ വിസ്മയം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπ’ αὐτῷ
  choice: അവനെക്കുറിച്ച്
  rationale: ἐπί + ദത്തിവ് വിസ്മയത്തിന്റെ വിഷയമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കാം. ഈ പരിഭാഷ യേശുവിനെ നേരിട്ടുള്ള കേന്ദ്രമായി നിലനിർത്തുന്നു; വിസ്മയം വാക്കുകളെക്കുറിച്ചുമാത്രമാണെന്ന് നിർണ്ണയിക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: സംഭാഷണത്തിലെ ലഘുവായ വൈരുധ്യവും യേശുവിന്റെ മറുപടിയിലേക്കുള്ള മാറ്റവും പ്രകടമാക്കുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: അധിക വ്യാഖ്യാനം ചേർക്കാതെ ഗ്രീക്കിലെ സംഭാഷണപരിചയം നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: പൗരാധികാരത്തോടുള്ള ബാധ്യതയും ദൈവത്തോടുള്ള ബാധ്യതയും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ട് സമാന്തര ഖണ്ഡങ്ങളും നേരിട്ട് പരിഭാഷപ്പെടുത്തി അവയുടെ വ്യത്യാസവും സംഘർഷസാധ്യതയും തുറന്നുവയ്ക്കുന്നു.
  alternative: ഇത് ഭരണാധികാരത്തിനുള്ള വിപുലമായ അംഗീകാരമായോ കൈസറിന്റെ അവകാശങ്ങളുടെ പരോക്ഷമായ ചുരുക്കമായോ വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം കൈസർക്കും ദൈവത്തിനും നൽകേണ്ടത് ഉണ്ടെന്ന് പറയുന്നു; എന്നാൽ സമഗ്രമായ രാഷ്ട്രീയ ദൈവശാസ്ത്രം നിർവചിക്കുന്നില്ല. അതിനാൽ പിൽക്കാല സിദ്ധാന്തം ചേർക്കാതെ സമാന്തരതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കൈസർ’ എന്ന ചരിത്രപദവി നിലനിർത്തി. ഗ്രീക്കിലെ സംക്ഷിപ്ത സമാന്തരത മലയാളത്തിലും കഴിയുന്നത്ര സൂക്ഷിച്ചു; അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
