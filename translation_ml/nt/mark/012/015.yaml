id: MRK.12.15
reference: Mark 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: ml
  text: 'എന്നാൽ അവരുടെ കാപട്യം അറിഞ്ഞ് അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്തിന് എന്നെ പരീക്ഷിക്കുന്നു?[a] ഒരു ദെനാറിയസ് കൊണ്ടുവരുവിൻ; എനിക്കത് കാണാൻ.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ എന്തിന് എന്നെ പ്രലോഭിപ്പിക്കുന്നു?”
    reason: lexical_alternative
  - marker: b
    text: ദെനാറിയസ് റോമൻ വെള്ളിനാണയമായിരുന്നു; സാധാരണയായി അത് ഒരു ദിവസത്തെ കൂലിയ്ക്ക് തുല്യമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: εἰδὼς
  choice: അറിഞ്ഞുകൊണ്ട്
  rationale: യേശുവിന് അവരുടെ ഉള്ളിലെ ഉദ്ദേശ്യം അറിയാമായിരുന്നുവെന്ന ജ്ഞാനാത്മക അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὑπόκρισιν
  choice: കപടഭക്തി
  rationale: ആത്മാർഥതയുടെ വേഷമണിഞ്ഞ ദുഷ്ടലക്ഷ്യം എന്ന സന്ദർഭാർഥവും ഗ്രീക്കുപദത്തിന്റെ ധാർമിക ഭാരംവുമാണ് ഈ പദം നൽകുന്നത്.
- source_word: Τί με πειράζετε
  choice: നിങ്ങൾ എന്തിന് എന്നെ പരീക്ഷിക്കുന്നു?
  rationale: Τί ഇവിടെ കാരണാർഥത്തിൽ ‘എന്തിന്’ എന്നാണ്; πειράζετε എന്നത് കുടുക്കാനുള്ള വിരോധപരമായ പരിശോധനയെ സൂചിപ്പിക്കുന്നു.
- source_word: φέρετέ μοι
  choice: കൊണ്ടുവരൂ
  rationale: സംസാരിക്കുന്നവന്റെ അടുക്കലേക്ക് വസ്തു എത്തിക്കാനുള്ള ബഹുവചന ആജ്ഞ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δηνάριον
  choice: ഒരു ദെനാറിയോസ് നാണയം
  rationale: ചരിത്രപരമായ നാണയനാമം നിലനിർത്തുകയും സാധാരണ വായനക്കാരനുവേണ്ടി അത് നാണയമാണെന്ന് വാചകത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἵνα ἴδω
  choice: ഞാൻ അതൊന്നു കാണട്ടെ
  rationale: ഉദ്ദേശ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അത്’ എന്നത് ദെനാറിയോസിനെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
theological_decisions:
- issue: πειράζετε എന്ന പദത്തിലെ യേശുവിന്റെ ആരോപണം
  choice: എന്നെ പരീക്ഷിക്കുന്നു
  alternative: എന്നെ പ്രലോഭിപ്പിക്കുന്നു / എന്നെ പരീക്ഷണത്തിൽ ആക്കുന്നു
  rationale: സന്ദർഭത്തിൽ ഇത് നിഷ്പക്ഷമായ ചോദ്യം ചെയ്യലല്ല, യേശുവിനെ വാക്കിൽ കുടുക്കാനുള്ള വിരോധപരമായ പരീക്ഷണമാണ്. ‘പ്രലോഭിപ്പിക്കുന്നു’ എന്നത് പാപത്തിലേക്ക് ആകർഷിക്കൽ എന്ന കുറുകിയ അർഥം അനാവശ്യമായി വരുത്താം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചരിത്രനാമമായ δηνάριον ലിപ്യന്തരണം ചെയ്ത് ‘നാണയം’ ചേർത്തു. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പ് സൂചകങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലപദങ്ങളോടു യുക്തമായി [a] പരീക്ഷിക്കുന്നു എന്നതിനും [b] ദെനാറിയോസ് എന്നതിനും പിന്നാലെ സ്ഥാപിച്ചു.
