  terminology: ‘ദെനാറിയസ്’ δηνάριον-ന്റെ സ്ഥിരവും തിരിച്ചറിയാവുന്നതുമായ ലിപ്യന്തരണമാണ്. ‘കാപട്യം’ എന്നത് സന്ദർഭത്തിന് യോജിച്ച, മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർക്കാത്ത പദമാണ്. ‘പരീക്ഷിക്കുന്നു’ πειράζετε-യുടെ ശത്രുതാപരമായ പരീക്ഷണം/കുടുക്കൽ എന്ന ഭാവം നിലനിർത്തുന്നു; അടിക്കുറിപ്പിലെ ‘പ്രലോഭിപ്പിക്കുന്നു’ സാധ്യമായ ലെക്സിക്കൽ ബദലായി സൂക്ഷിക്കാം.
