id: MRK.12.31
reference: Mark 12:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: ml
  text: 'രണ്ടാമത്തേത് ഇതാണ്: “നിന്നെപ്പോലെതന്നെ നിന്റെ അയൽക്കാരനെയും സ്നേഹിക്കണം.” ഇവയെക്കാൾ വലിയ മറ്റൊരു കൽപ്പനയുമില്ല.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: രണ്ടാമത്തേത് ഇതാണ്
  rationale: ഗ്രീക്കിൽ ‘കല്പന’ എന്ന നാമം അധ്യാഹരിച്ചിട്ടുള്ള സംക്ഷിപ്ത പ്രയോഗമാണിത്. മലയാളത്തിൽ സ്വാഭാവികമായി ആ അർഥം നൽകുകയും ‘രണ്ടാമത്തേത്’ എന്ന ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: Ἀγαπήσεις
  choice: സ്നേഹിക്കണം
  rationale: തിരുവെഴുത്തിൽനിന്നുള്ള ഉദ്ധരണിയിൽ ഭാവികാല നിർദേശരൂപം കല്പനയുടെ ബലത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. ആ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὸν πλησίον σου
  choice: നിന്റെ അയൽക്കാരനെ
  rationale: πλησίον എന്ന പദത്തിന്റെ തിരുവെഴുത്തുപരവും നൈതികവുമായ അർഥവും ലേവ്യപുസ്തകം 19:18-ലേക്കുള്ള ബന്ധവും നിലനിർത്തുന്ന സാധാരണ മലയാളപ്രയോഗമാണിത്.
- source_word: ὡς σεαυτόν
  choice: നിന്നെപ്പോലെതന്നെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത താരതമ്യം വിശദീകരണവാക്കുകൾ കൂട്ടിച്ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘തന്നെ’ താരതമ്യത്തിന്റെ ഊന്നൽ വ്യക്തമാക്കുന്നു.
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: ഇവയെക്കാൾ വലിയ മറ്റൊരു കല്പനയുമില്ല
  rationale: μείζων എന്ന താരതമ്യവും τούτων എന്ന ബഹുവചന സൂചനയും അസ്തിത്വനിഷേധത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἐντολή
  choice: കല്പന
  rationale: തോറായിലെ കല്പനകളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിന് യോജിച്ച തിരുവെഴുത്തുപരവും ഗൗരവമുള്ളതുമായ പദമാണിത്.
theological_decisions:
- issue: അവസാന വാക്യത്തിലെ τούτων (‘ഇവ’) എന്നതിന്റെ സൂചിതവിഷയം
  choice: ‘ഇവ’ എന്ന ബഹുവചനരൂപം നിലനിർത്തി, സന്ദർഭത്തിലെ രണ്ടു കല്പനകളെയും ഒരുമിച്ച് സൂചിപ്പിക്കാൻ അനുവദിച്ചു
  alternative: ഉടൻ മുമ്പ് പറഞ്ഞ രണ്ടാമത്തെ കല്പനയെ മാത്രം പൊതുവായ അർഥത്തിൽ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുക
  rationale: ഗ്രീക്കിലെ ബഹുവചന സർവനാമം സന്ദർഭത്തിൽ ചർച്ചചെയ്ത രണ്ടു കല്പനകളിലേക്കും സ്വാഭാവികമായി വിരൽചൂണ്ടുന്നു. പരിഭാഷയിൽ അതിനെ ഏകവചനമാക്കാതെയും വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതെയും മൂലത്തിലെ രൂപവും സാധ്യതയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും തിരുവെഴുത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമായ ഭാഷയാണ് ഉപയോഗിച്ചത്. ഉദ്ധരണിയിലെ കല്പനാഭാവം ‘സ്നേഹിക്കണം’ എന്ന സ്വാഭാവിക രൂപത്തിലൂടെ അറിയിച്ചു; τούτων എന്ന ബഹുവചനത്തിലെ സൂചന മുഖ്യവാചകത്തിൽ ‘ഇവ’ ആയി സംരക്ഷിച്ചു.
