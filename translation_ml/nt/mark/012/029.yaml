id: MRK.12.29
reference: Mark 12:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: ml
  text: 'യേശു ഉത്തരം പറഞ്ഞു: “ഒന്നാമത്തേത് ഇതാണ്: ‘ഇസ്രായേലേ, കേൾക്കുക; നമ്മുടെ ദൈവമായ കർത്താവ്[a], കർത്താവ് ഏകനാണ്[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വരി ശെമാ എന്നറിയപ്പെടുന്ന ആവർത്തനപുസ്തകം 6:4 ഉദ്ധരിക്കുന്നു. ഇവിടെ “കർത്താവ്” എന്നത് സെപ്റ്റുവജിന്റിൽ ദൈവനാമമായ YHWH-ക്കു പകരം ഉപയോഗിച്ച κύριος എന്ന പദമാണ്.
    reason: cross_reference
  - marker: b
    text: 'മറ്റുവിധത്തിൽ: “നമ്മുടെ ദൈവമായ കർത്താവ് ഏക കർത്താവാണ്,” അല്ലെങ്കിൽ “കർത്താവാണ് നമ്മുടെ ദൈവം, കർത്താവ് മാത്രമേയുള്ളൂ.” ഗ്രീക്ക് ആവർത്തനപുസ്തകം 6:4-നെ പ്രതിധ്വനിപ്പിക്കുന്നതിനാൽ ദൈവത്തിന്റെ ഏകത്വത്തിനോ അനന്യതയ്ക്കോ, അല്ലെങ്കിൽ രണ്ടിനുമോ ഊന്നൽ നൽകാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ഉത്തരം പറഞ്ഞു
  rationale: സംഭാഷണത്തിലെ പ്രതികരണസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Πρώτη
  choice: ഒന്നാമത്തേത്
  rationale: സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന ‘കല്പന’ എന്ന നാമം കൂട്ടിച്ചേർക്കാതെ, സ്ത്രീലിംഗത്തിൽ നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: Ἄκουε
  choice: കേൾക്കുക
  rationale: ആവർത്തനപുസ്തകം 6:4-ലെ ശെമാ ഉദ്ധരണിയുടെ ആഹ്വാനസ്വരവും ഉടമ്പടിസംബന്ധമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: Ἰσραήλ
  choice: ഇസ്രായേലേ
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള സംബോധന മലയാളത്തിലെ സ്വാഭാവിക സംബോധനരൂപത്തിൽ നൽകുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പുതിയനിയമത്തിലെ κύριος എന്ന പദത്തിന്റെ പതിവ് മലയാളരൂപം; ഇവിടെ സെപ്റ്റുവജിന്റിൽ ദൈവനാമമായ YHWH-നെ പ്രതിനിധീകരിക്കുന്ന പശ്ചാത്തലം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ θεὸς ἡμῶν
  choice: നമ്മുടെ ദൈവമായ
  rationale: ‘നമ്മുടെ ദൈവം’ എന്ന ബന്ധം മലയാളവാക്യഘടനയിൽ വ്യക്തവും സ്വാഭാവികവുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: εἷς
  choice: ഏകൻ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകത്വപ്രഖ്യാപനം ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘ഒരുവൻ മാത്രം’ എന്നു വികസിപ്പിച്ച് പ്രത്യേകതയുടെ ആശയം നിർബന്ധമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ശെമായുടെ അവസാന ഭാഗത്തിലെ ഏകത്വവും അനന്യതയും സംബന്ധിച്ച അർഥസാന്ദ്രത
  choice: നമ്മുടെ ദൈവമായ കർത്താവ്, കർത്താവ് ഏകനാണ്
  alternative: കർത്താവാണ് നമ്മുടെ ദൈവം, കർത്താവ് മാത്രമേയുള്ളൂ; അല്ലെങ്കിൽ നമ്മുടെ ദൈവമായ കർത്താവ് ഏക കർത്താവാണ്
  rationale: κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν എന്ന ഗ്രീക്ക് ക്രമത്തോട് അടുത്തുനിൽക്കുകയും ദൈവത്തിന്റെ ഏകത്വമോ അനന്യതയോ രണ്ടുംകൂടിയോ എന്ന ഊന്നൽ ഏകപക്ഷീയമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു. മറ്റു സാധ്യമായ വായനകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ശെമായുടെ ഉദ്ധരണിസ്വരം നിലനിർത്താൻ “കേൾക്കുക” എന്നും നേരിട്ടുള്ള സംബോധനയ്ക്ക് “ഇസ്രായേലേ” എന്നും ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
