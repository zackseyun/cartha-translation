id: MRK.12.14
reference: Mark 12:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: ml
  text: 'അവർ വന്ന് അവനോട് പറഞ്ഞു: “ഗുരോ, അങ്ങ് സത്യസന്ധനാണെന്നും ആരെയും വകവെക്കാറില്ലെന്നും ഞങ്ങൾക്കറിയാം. കാരണം അങ്ങ് മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല,[a] മറിച്ച് ദൈവത്തിന്റെ വഴി സത്യത്തിൽ പഠിപ്പിക്കുന്നു. കൈസർക്കു ആളോഹരി നികുതി[b] കൊടുക്കുന്നത് നിയമാനുസൃതമാണോ അല്ലയോ? ഞങ്ങൾ അതു കൊടുക്കണമോ, കൊടുക്കാതിരിക്കണമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആളുകളോട് പക്ഷപാതം കാണിക്കുന്നില്ല” അല്ലെങ്കിൽ “പുറമേയുള്ള നില കണ്ട് സ്വാധീനിക്കപ്പെടുന്നില്ല.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം റോമാക്കാർ ചുമത്തിയിരുന്ന ആളോഹരി അഥവാ ജനസംഖ്യാ നികുതിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: ഗുരോ
  rationale: ആദരപൂർവമായ നേരിട്ടുള്ള സംബോധനമായി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും യേശുവിന്റെ അധ്യാപകപങ്ക് വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: ἀληθὴς
  choice: സത്യവാൻ
  rationale: ഒരു വ്യക്തി സത്യം പറയുന്നവനും സത്യസന്ധനുമാണെന്ന ഗ്രീക്ക് വിശേഷണത്തിന്റെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: ആരെയും വകവെക്കാറില്ല
  rationale: ആളുകളുടെ സ്ഥാനമോ അഭിപ്രായമോ സ്വാധീനിക്കാത്തവൻ എന്ന ആശയം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള മുഖം നോക്കാത്തതിനെക്കുറിച്ചുള്ള വാക്യം അതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: അങ്ങ് മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല
  rationale: മൂലത്തിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; പക്ഷപാതം കാണിക്കുകയോ പുറമേയുള്ള നില കണ്ട് സ്വാധീനിക്കപ്പെടുകയോ ചെയ്യാത്തത് എന്ന പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπ’ ἀληθείας
  choice: സത്യമായി
  rationale: ‘പഠിപ്പിക്കുന്നു’ എന്ന ക്രിയയെ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണപ്രയോഗം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വഴി
  rationale: മൂലത്തിലെ ‘വഴി’ എന്ന ബൈബിൾ ദൃശ്യരൂപവും ദൈവബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: ἔξεστιν
  choice: നിയമാനുസൃതമാണോ
  rationale: അനുവദനീയതയെക്കുറിച്ചുള്ള ധാർമിക-നിയമപരമായ ചോദ്യത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: കൈസർക്കു ആളോഹരി നികുതി കൊടുക്കുന്നത്
  rationale: δοῦναι ഇവിടെ നികുതി അടയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കൊടുക്കുന്നത്’ സ്വാഭാവികമാണ്; κῆνσος റോമൻ ആളോഹരി നികുതിയാണെന്ന ചരിത്രപരമായ പ്രത്യേകതയും നിലനിർത്തുന്നു.
- source_word: Καίσαρι
  choice: കൈസർക്കു
  rationale: റോമൻ ഭരണാധികാരിയുടെ പദവി/പേര് മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: ഞങ്ങൾ അതു കൊടുക്കണമോ, കൊടുക്കാതിരിക്കണമോ
  rationale: ഗ്രീക്കിലെ ആവർത്തനവും കെണിപോലുള്ള ചോദ്യത്തിന്റെ മൂർച്ചയും നിലനിർത്തുന്നു; ‘അതു’ നികുതിയെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: മനുഷ്യരുടെ മുഖം നോക്കുക എന്ന പക്ഷപാതസംബന്ധിയായ പ്രയോഗം
  choice: മൂലത്തിലെ ദൃശ്യരൂപമായ ‘മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല’ പ്രധാന പാഠത്തിൽ നിലനിർത്തി; പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘ആളുകളോട് പക്ഷപാതം കാണിക്കുന്നില്ല’ അല്ലെങ്കിൽ ‘പുറമേയുള്ള നില കണ്ട് സ്വാധീനിക്കപ്പെടുന്നില്ല’.
  rationale: ഇവിടെ പ്രത്യേകമായ ഒരു സിദ്ധാന്തനിലപാട് അടിച്ചേൽപ്പിക്കാതെ, മൂലഭാഷയിലെ രൂപകവും അതിന്റെ യഥാർഥ പ്രയോഗാർഥവും ഒരുപോലെ സുതാര്യമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യേശുവിനോടുള്ള നേരിട്ടുള്ള പ്രസംഗത്തിൽ ‘അങ്ങ്’ ഉപയോഗിച്ച് ആദരം സൂചിപ്പിച്ചു. മൂലത്തിലെ ആവർത്തനവും നിയമപരമായ ചോദ്യഭാവവും ഉദ്ദേശപൂർവം നിലനിർത്തി.
