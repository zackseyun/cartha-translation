revisions:
- from: 'അവർ വന്ന് അവനോട് പറഞ്ഞു: “ഗുരോ, അങ്ങ് സത്യവാനാണെന്നും ആരെയും വകവെക്കാറില്ലെന്നും ഞങ്ങൾക്കറിയാം. കാരണം അങ്ങ് മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല,[a] മറിച്ച് ദൈവത്തിന്റെ വഴി സത്യമായി പഠിപ്പിക്കുന്നു. കൈസർക്കു ആളോഹരി നികുതി[b] കൊടുക്കുന്നത് നിയമാനുസൃതമാണോ അല്ലയോ? ഞങ്ങൾ അതു കൊടുക്കണമോ, കൊടുക്കാതിരിക്കണമോ?”'
  to: 'അവർ വന്ന് അവനോട് പറഞ്ഞു: “ഗുരോ, അങ്ങ് സത്യസന്ധനാണെന്നും ആരെയും വകവെക്കാറില്ലെന്നും ഞങ്ങൾക്കറിയാം. കാരണം അങ്ങ് മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല,[a] മറിച്ച് ദൈവത്തിന്റെ വഴി സത്യത്തിൽ പഠിപ്പിക്കുന്നു. കൈസർക്കു ആളോഹരി നികുതി[b] കൊടുക്കുന്നത് നിയമാനുസൃതമാണോ അല്ലയോ? ഞങ്ങൾ അതു കൊടുക്കണമോ, കൊടുക്കാതിരിക്കണമോ?”'
  rationale: 'രണ്ട് ചെറിയ ശൈലീപരിഷ്കാരങ്ങൾ മാത്രമാണ് നിർദേശിക്കുന്നത്: ἀληθὴς-ന് ‘സത്യസന്ധനാണ്’ എന്നും ἐπ’ ἀληθείας-ന് ‘സത്യത്തിൽ’ എന്നും. ഇവ അർഥം മാറ്റുന്നില്ല; ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികതയും വ്യക്തിപരമായ വിശേഷണത്തിന്റെ സൂക്ഷ്മതയും മെച്ചപ്പെടുത്തുന്നു. അടിക്കുറിപ്പുകളുടെ ആങ്കറുകളും ഉള്ളടക്കവും നിലനിർത്തിയിരിക്കുന്നു.'
