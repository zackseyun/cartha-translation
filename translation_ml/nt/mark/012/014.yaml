  revision_rationale: 'രണ്ട് ചെറിയ ശൈലീപരിഷ്കാരങ്ങൾ മാത്രമാണ് നിർദേശിക്കുന്നത്: ἀληθὴς-ന് ‘സത്യസന്ധനാണ്’ എന്നും ἐπ’ ἀληθείας-ന് ‘സത്യത്തിൽ’ എന്നും. ഇവ അർഥം മാറ്റുന്നില്ല; ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികതയും വ്യക്തിപരമായ വിശേഷണത്തിന്റെ സൂക്ഷ്മതയും മെച്ചപ്പെടുത്തുന്നു. അടിക്കുറിപ്പുകളുടെ ആങ്കറുകളും ഉള്ളടക്കവും നിലനിർത്തിയിരിക്കുന്നു.'
