  revised_text: 'അവർ വന്ന് അവനോട് പറഞ്ഞു: “ഗുരോ, അങ്ങ് സത്യസന്ധനാണെന്നും ആരെയും വകവെക്കാറില്ലെന്നും ഞങ്ങൾക്കറിയാം. കാരണം അങ്ങ് മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല,[a] മറിച്ച് ദൈവത്തിന്റെ വഴി സത്യത്തിൽ പഠിപ്പിക്കുന്നു. കൈസർക്കു ആളോഹരി നികുതി[b] കൊടുക്കുന്നത് നിയമാനുസൃതമാണോ അല്ലയോ? ഞങ്ങൾ അതു കൊടുക്കണമോ, കൊടുക്കാതിരിക്കണമോ?”'
