  source_fidelity: പ്രധാന അർഥവും വാക്യഘടനയും ഗ്രീക്ക് മൂലത്തോട് വിശ്വസ്തമാണ്. κῆνσον എന്ന റോമൻ ആളോഹരി/ജനസംഖ്യാനികുതിയും, കൈസർക്കു നൽകുന്നതിനെക്കുറിച്ചുള്ള നിയമപരമായ ചോദ്യവും, ആവർത്തിച്ചുള്ള അവസാന ചോദ്യവും ശരിയായി പ്രതിഫലിക്കുന്നു. എന്നാൽ ἀληθὴς-ന് ‘സത്യവാൻ’ എന്നത് ആധുനിക സാധാരണ ഉപയോഗത്തിൽ അല്പം അസ്വാഭാവികവും ‘സത്യസന്ധൻ/സത്യം പറയുന്നവൻ’ എന്ന വ്യക്തിപരമായ അർഥത്തേക്കാൾ വ്യത്യസ്ത നിഴൽ നൽകാവുന്നതുമാണ്.
  naturalness: ‘സത്യസന്ധനാണ്’ ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്. ἐπ’ ἀληθείας-നെ ‘സത്യത്തിൽ’ എന്നു നൽകുന്നത് ‘ദൈവത്തിന്റെ വഴി ... പഠിപ്പിക്കുന്നു’ എന്ന ഘടനയിൽ കൂടുതൽ സുഗമവും മൂലത്തിലെ ‘in truth’ എന്ന ഭാവത്തോടും അടുത്തതുമാണ്. മറ്റു പ്രയോഗങ്ങൾ വായനയോഗ്യമാണ്.
  terminology: ‘ഗുരോ,’ ‘ദൈവത്തിന്റെ വഴി,’ ‘കൈസർ,’ ‘ആളോഹരി നികുതി,’ ‘നിയമാനുസൃതം’ എന്നിവ യോജിച്ചതാണ്. ‘മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല’ എന്ന മൂലരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്താം; അതിന്റെ പക്ഷപാത-സൂചന അടിക്കുറിപ്പിൽ ഉചിതമായി വിശദീകരിച്ചിരിക്കുന്നു.
