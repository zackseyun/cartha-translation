source:
  edition: SBLGNT
  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: ml
  text: അവൻ ഭണ്ഡാരത്തിന്[a] എതിർവശത്ത് ഇരുന്ന്, ജനക്കൂട്ടം ഭണ്ഡാരത്തിലേക്ക് പണം ഇടുന്നതെങ്ങനെയെന്ന് നോക്കിക്കൊണ്ടിരുന്നു. ധനികരായ പലരും ധാരാളം ഇടുന്നുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കാണിക്കപ്പെട്ടി’ / ‘ഭണ്ഡാരപ്പെട്ടി’; ഗ്രീക്ക് പദം ദേവാലയഭണ്ഡാരത്തെയോ അതുമായി ബന്ധപ്പെട്ട പണം സ്വീകരിക്കുന്ന പെട്ടികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: ഇരുന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള രംഗസജ്ജീകരണ പ്രവർത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘ഇരുന്നശേഷം’ എന്നതിലധികം കർശനമായ കാലക്രമം ചുമത്തുന്നില്ല.
- source_word: κατέναντι
  choice: എതിർവശത്ത്
  rationale: നേരെ മറുവശത്തുള്ള സ്ഥാനത്തെ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: γαζοφυλάκιον
  choice: ഭണ്ഡാരം
  rationale: ദേവാലയത്തിലെ ധനഭണ്ഡാരമോ അതുമായി ബന്ധപ്പെട്ട കാണിക്കപ്പെട്ടികളോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; പ്രത്യേക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐθεώρει
  choice: നോക്കിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചയായ നിരീക്ഷണഭാവം നിലനിർത്തുന്നു.
- source_word: πῶς
  choice: എങ്ങനെയെന്ന്
  rationale: ജനങ്ങൾ പണം ഇടുന്നു എന്ന വസ്തുത മാത്രമല്ല, അവർ അത് എങ്ങനെ ചെയ്യുന്നു എന്ന രീതിയിലേക്കുള്ള ശ്രദ്ധ നിലനിർത്തുന്നു.
- source_word: ὄχλος
  choice: ജനക്കൂട്ടം
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ കൂട്ടത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: βάλλει / ἔβαλλον
  choice: ഇടുന്നത് / ഇട്ടു
  rationale: പണം ഭണ്ഡാരത്തിൽ നിക്ഷേപിക്കുന്ന സാഹചര്യത്തിൽ βάλλω എന്നതിന്റെ സ്വാഭാവിക മലയാളപ്രയോഗം; ആദ്യ ക്രിയയിലെ തുടരുന്ന പ്രവർത്തി ‘ഇടുന്നത്’ എന്നും രണ്ടാമത്തേത് ആഖ്യാനത്തിൽ ‘ഇട്ടു’ എന്നും നൽകി.
- source_word: χαλκόν
  choice: പണം
  rationale: അക്ഷരാർഥത്തിൽ ചെമ്പ്/വെങ്കലവും ഈ സന്ദർഭത്തിൽ ചെമ്പുനാണയങ്ങളുമാണെങ്കിലും, മലയാളത്തിൽ ‘പണം’ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; നാണയത്തിന്റെ ലോഹത്തെ അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: πολλοὶ πλούσιοι
  choice: ധനികരായ പലരും
  rationale: വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം പൊതുവായി സമ്പന്നരായ ആളുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിരപേക്ഷവും സ്വാഭാവികവുമായ രൂപം സ്വീകരിച്ചു.
- source_word: πολλά
  choice: ധാരാളം
  rationale: പണത്തിന്റെ വലിയ അളവിനെ മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ തുടർച്ചയായ നിരീക്ഷണം ‘നോക്കിക്കൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി; γαζοφυλάκιον എന്ന പദത്തിന്റെ യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
