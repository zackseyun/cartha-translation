translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചരിത്രനാണയങ്ങളുടെ പേരുകൾ മൂലപാഠത്തോടുള്ള സുതാര്യതയ്ക്കായി നിലനിർത്തി; അവയുടെ അർഥം അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു.
