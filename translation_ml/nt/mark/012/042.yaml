  yaml_path: translation/nt/mark/012/042.yaml
  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: ml
  text: ഒരു ദരിദ്രയായ വിധവ വന്ന് രണ്ട് ലെപ്താ നാണയങ്ങൾ[a][b] ഇട്ടു; അതായത് ഒരു കൊദ്രാന്തേസ്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ലെപ്തോൻ വളരെ ചെറിയ മൂല്യമുള്ള ഒരു നാണയമായിരുന്നു; രണ്ട് ലെപ്താ ഒരു റോമൻ കൊദ്രാന്തേസിന് തുല്യമായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “ചെറിയ രണ്ട് നാണയങ്ങൾ.” ഇവ സാധാരണയായി ചെമ്പുനാണയങ്ങളായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: c
    text: കൊദ്രാന്തേസ് ഒരു റോമൻ നാണയമാണ്; ഗ്രീക്ക് മൂലപാഠത്തിലും ഈ നാണയപ്പേരാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: വന്ന്
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ഭൂതകാല പങ്കാളിത്തരൂപം മലയാളത്തിലെ സ്വാഭാവികമായ ക്രിയാശൃംഖലയായി ‘വന്ന് ... ഇട്ടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: μία
  choice: ഒരു
  rationale: ഇവിടെ സംഖ്യയ്ക്ക് ഊന്നൽ നൽകുന്നതിനെക്കാൾ കഥയിൽ ഒരാളെ പരിചയപ്പെടുത്തുകയാണ്; അതിനാൽ ‘ഒരു’ സ്വാഭാവികമാണ്.
- source_word: χήρα πτωχὴ
  choice: ദരിദ്രയായ ഒരു വിധവ
  rationale: χήρα എന്നത് ‘വിധവ’ എന്നും πτωχή എന്നത് ‘ദരിദ്രയായ’ എന്നും നേരിട്ട് നൽകുന്നു; ‘അഗതിയായ’ എന്നത് ദാരിദ്ര്യത്തിന്റെ തോത് അനാവശ്യമായി നിർണയിച്ചേക്കാം.
- source_word: ἔβαλεν
  choice: ഇട്ടു
  rationale: വഴിപാടുപെട്ടിയിൽ നാണയം നിക്ഷേപിക്കുന്ന സന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമായ പ്രയോഗം; ‘എറിഞ്ഞു’ എന്നത് അനാവശ്യമായ ശക്തി സൂചിപ്പിക്കാം.
- source_word: λεπτὰ δύο
  choice: രണ്ടു ലെപ്താ നാണയങ്ങൾ
  rationale: ചരിത്രപരമായ നാണയനാമം നിലനിർത്തുകയും മലയാളവായനക്കാർക്ക് അത് നാണയമാണെന്ന് ഉടൻ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὅ ἐστιν
  choice: അവ ചേർന്നാൽ ... ആണ്
  rationale: നപുംസക ഏകവചനമായ ബന്ധസർവനാമം രണ്ടു ലെപ്തായുടെ സംയുക്ത മൂല്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ മൂല്യസമത്വം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κοδράντης
  choice: ഒരു കൊദ്രാന്തേസ്
  rationale: ഗ്രീക്കിൽ ഉപയോഗിച്ചിരിക്കുന്ന റോമൻ നാണയത്തിന്റെ ചരിത്രനാമം ലിപ്യന്തരണം ചെയ്ത് സംരക്ഷിക്കുന്നു; ആധുനിക നാണയമൂല്യവുമായി തെറ്റിദ്ധരിപ്പിക്കുന്ന സമീകരണം ഒഴിവാക്കുന്നു.
