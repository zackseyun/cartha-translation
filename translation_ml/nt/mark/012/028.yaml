id: MRK.12.28
reference: Mark 12:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: ml
  text: 'അപ്പോൾ ശാസ്ത്രിമാരിൽ ഒരാൾ അടുത്തുവന്നു. അവർ തമ്മിൽ വാദപ്രതിവാദം നടത്തുന്നതു കേൾക്കുകയും യേശു അവർക്കു നന്നായി ഉത്തരം നൽകിയെന്നു മനസ്സിലാക്കുകയും ചെയ്തിട്ട്, അയാൾ യേശുവിനോട് ചോദിച്ചു: “എല്ലാറ്റിലും ഒന്നാമത്തെ കല്പന ഏതാണ്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എല്ലാറ്റിലും പ്രമുഖമായ കല്പന” അല്ലെങ്കിൽ “എല്ലാറ്റിലും ഏറ്റവും പ്രധാനപ്പെട്ട കല്പന.”
    reason: πρώτη എന്ന പദത്തിന് ക്രമത്തിലെ ‘ഒന്നാമത്തെ’ എന്നതിനൊപ്പം സ്ഥാനത്തിലോ പ്രാധാന്യത്തിലോ ‘പ്രമുഖമായത്’ എന്ന അർഥവും വരാം.
lexical_decisions:
- source_word: γραμματέων
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ യഹൂദനിയമത്തിലും തിരുവെഴുത്തുകളിലും പ്രാവീണ്യമുള്ള അംഗീകൃത വിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥാപിതവും നേരിട്ടുള്ളതുമായ പദമാണിത്.
- source_word: προσελθὼν
  choice: അടുത്തുവന്നു
  rationale: യേശുവിന്റെ അടുക്കലേക്കുള്ള സമീപനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: അവർ തമ്മിൽ വാദപ്രതിവാദം നടത്തുന്നതു കേൾക്കുകയും
  rationale: συζητέω എന്നത് ചർച്ചയെയോ തർക്കാത്മക സംവാദത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ ശത്രുത അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ പൊതുസംവാദത്തിന്റെ തീവ്രത അറിയിക്കുന്നു.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: യേശു അവർക്കു നന്നായി ഉത്തരം നൽകിയെന്നു മനസ്സിലാക്കുകയും
  rationale: കലῶς എന്നതിന്റെ ലളിതമായ അർഥം ‘നന്നായി’ എന്നു നിലനിർത്തുന്നു; ‘ശരിയായി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം ഒഴിവാക്കുന്നു. സർവനാമക്കുഴപ്പം ഒഴിവാക്കാൻ യേശുവിന്റെ പേര് ഉപയോഗിച്ചു.
- source_word: ἐπηρώτησεν
  choice: ചോദിച്ചു
  rationale: ἐπερωτάω എന്ന സാധാരണ ക്രിയയുടെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: Ποία
  choice: ഏതാണ്
  rationale: പല കല്പനകളിൽ ഒന്നിനെ തിരിച്ചറിയാൻ ആവശ്യപ്പെടുന്ന ചോദ്യത്തിന്റെ സ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐντολή
  choice: കല്പന
  rationale: തിരുവെഴുത്തിന്റെയും മോശൈകനിയമത്തിന്റെയും പശ്ചാത്തലത്തിൽ സ്ഥാപിതമായ മലയാളപദം.
- source_word: πρώτη πάντων
  choice: എല്ലാറ്റിലും ഒന്നാമത്തെ
  rationale: πρώτη എന്നതിന്റെ ‘ഒന്നാമത്തെ’ എന്ന രൂപം നിലനിർത്തി, ക്രമത്തിലെ ആദ്യത്തേതോ സ്ഥാനത്തിൽ പ്രമുഖമായതോ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: πρώτη എന്ന പദം കല്പനകളുടെ ക്രമമോ പ്രാധാന്യമോ സൂചിപ്പിക്കുന്നുണ്ടോ എന്നത്
  choice: എല്ലാറ്റിലും ഒന്നാമത്തെ
  alternative: എല്ലാറ്റിലും പ്രമുഖമായത്; എല്ലാറ്റിലും ഏറ്റവും പ്രധാനപ്പെട്ടത്
  rationale: ഗ്രീക്കിലെ ‘ഒന്നാമത്തെ’ എന്ന ഭാഷ നേരിട്ട് നിലനിർത്തുന്നു; അതേസമയം പദം സ്ഥാനപ്രാധാന്യവും സൂചിപ്പിക്കാമെന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകുന്നു. ഇതിലൂടെ ചോദ്യത്തിലെ യഥാർഥ അർഥപിരിമുറുക്കം മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘ശാസ്ത്രിമാർ’, ‘കല്പന’ എന്നീ സ്ഥാപിത തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തി. ഗ്രീക്കിൽ ആവർത്തിക്കുന്ന സർവനാമങ്ങൾ മലയാളത്തിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതിരിക്കാൻ ‘യേശു’ എന്ന പേര് വ്യക്തീകരണമായി ചേർത്തു.
