source:
  edition: SBLGNT
  text: ἔτι ⸂ἕνα εἶχεν, υἱὸν ἀγαπητόν· ἀπέστειλεν⸃ αὐτὸν ⸂ἔσχατον πρὸς αὐτοὺς⸃ λέγων ὅτι Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: ml
  text: അവന് ഇനിയും ഒരാൾ ഉണ്ടായിരുന്നു—പ്രിയപ്പെട്ട ഒരു മകൻ.[a] ‘അവർ എന്റെ മകനെ ആദരിക്കും’[b] എന്നു പറഞ്ഞുകൊണ്ട്, അവൻ അവനെ അവസാനമായി അവരുടെ അടുത്തേക്ക് അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വളരെ സ്നേഹിച്ച ഒരു മകൻ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ആദരിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തിയ ക്രിയയ്ക്ക് ‘അവന്റെ മുമ്പിൽ ലജ്ജിക്കും’ അല്ലെങ്കിൽ ‘അവനോട് ബഹുമാനം കാണിക്കും’ എന്നും അർഥമാകാം; ഇവിടെ സന്ദർഭം ആദരവ് കാണിക്കുക എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: അവന് ഇനിയും ഒരാൾ ഉണ്ടായിരുന്നു
  rationale: മുമ്പ് അയച്ച ദാസന്മാർക്കുശേഷം അയയ്ക്കാൻ ഒരാൾ ശേഷിച്ചിരുന്നു എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: υἱὸν ἀγαπητόν
  choice: ഒരു പ്രിയപുത്രൻ
  rationale: ἀγαπητός എന്നതിന്റെ ‘പ്രിയപ്പെട്ട/വളരെ സ്നേഹിക്കപ്പെട്ട’ എന്ന ഭാരം സംക്ഷിപ്തമായി സൂക്ഷിക്കുകയും മർക്കോസിലെ പ്രിയപുത്രൻ എന്ന പ്രതിധ്വനി വിശദീകരിച്ചുചേർക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: അയയ്ക്കുക എന്ന സാധാരണ വിവരണാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἔσχατον πρὸς αὐτούς
  choice: അവസാനം അവനെ അവരുടെ അടുക്കലേക്ക്
  rationale: ἔσχατον എന്ന പദത്തിന്റെ ക്രമത്തിലെ അന്തിമത്വവും മകന്റെ ഉച്ചസ്ഥായിയിലുള്ള സ്ഥാനവും നിലനിർത്തുന്നു.
- source_word: λέγων ὅτι
  choice: എന്നു പറഞ്ഞുകൊണ്ട്
  rationale: ഉടമയുടെ പ്രതീക്ഷയെ നേരിട്ടുള്ള ഉദ്ധരണിയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἐντραπήσονται
  choice: ആദരിക്കും
  rationale: സന്ദർഭത്തിൽ മറ്റൊരാളോടു ബഹുമാനം അഥവാ ആദരവ് കാണിക്കുക എന്ന അർഥം മുൻനിൽക്കുന്നു; ലജ്ജിക്കുക എന്ന അടിസ്ഥാനാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τὸν υἱόν μου
  choice: എന്റെ മകനെ
  rationale: ഉടമസ്ഥസൂചന നേരിട്ട് നിലനിർത്തി ഉപമയിലെ പുത്രകേന്ദ്രിതമായ ഭാരം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ ‘പ്രിയപുത്രൻ’ എന്ന പ്രയോഗത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ പ്രതിധ്വനി
  choice: പ്രിയപുത്രൻ
  alternative: വളരെ സ്നേഹിച്ച മകൻ
  rationale: മർക്കോസിന്റെ വിശാലമായ വിവരണത്തിൽ യേശുവിനെ പ്രിയപുത്രനായി അവതരിപ്പിക്കുന്നതുമായുള്ള സ്വാഭാവിക പ്രതിധ്വനി നിലനിർത്തുന്നു; എന്നാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് പദക്രമം യാന്ത്രികമായി പകർത്താതെ, ശേഷിച്ചിരുന്ന ഏക വ്യക്തിയും അവനെ അവസാനമായി അയച്ചതും വ്യക്തമായി പ്രകടമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
