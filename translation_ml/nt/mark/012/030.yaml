  - severity: low
    issue: The alternative ‘ഗ്രഹണശേഷി’ is overly technical.
    rationale: ‘ബുദ്ധി’ is a natural Malayalam lexical alternative for διάνοια (‘understanding’) and is more suitable for a public Bible footnote.
