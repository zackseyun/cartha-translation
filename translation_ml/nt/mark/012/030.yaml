source:
  edition: SBLGNT
  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: ml
  text: നിന്റെ ദൈവമായ കർത്താവിനെ നിന്റെ മുഴുവൻ ഹൃദയംകൊണ്ടും നിന്റെ മുഴുവൻ ആത്മാവുകൊണ്ടും നിന്റെ മുഴുവൻ മനസ്സുകൊണ്ടും നിന്റെ മുഴുവൻ ശക്തികൊണ്ടും സ്നേഹിക്കണം.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ മുഴുവൻ ആത്മാവുകൊണ്ടും’ എന്നതിന് ‘നിന്റെ മുഴുവൻ ജീവനുകൊണ്ടും’ എന്നും വിവർത്തനം ചെയ്യാം (ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ മുഴുവൻ മനസ്സുകൊണ്ടും’ എന്നതിന് ‘നിന്റെ മുഴുവൻ ബുദ്ധികൊണ്ടും’ എന്നും വിവർത്തനം ചെയ്യാം (διανοίας).
    reason: lexical_alternative
  - marker: c
    text: ‘നിന്റെ മുഴുവൻ ശക്തികൊണ്ടും’ എന്നതിന് ‘നിന്റെ മുഴുവൻ ബലംകൊണ്ടും’ എന്നും വിവർത്തനം ചെയ്യാം (ἰσχύος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: സ്നേഹിക്കണം
  rationale: ഉദ്ധരിക്കപ്പെട്ട കല്പനയിൽ ഭാവികാല നിർദേശകക്രിയയ്ക്ക് കല്പനാത്മക ബലമുണ്ട്. ആധുനിക മലയാളത്തിൽ ‘സ്നേഹിക്കണം’ ഈ ബാധ്യത സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: κύριον τὸν θεόν σου
  choice: നിന്റെ ദൈവമായ കർത്താവിനെ
  rationale: ‘കർത്താവ്’ κύριος എന്നതിന്റെ മാന്യവും പതിവുമായ സമാനപദമാണ്; ‘നിന്റെ ദൈവമായ’ എന്ന ഘടന ഉടമ്പടിസൂത്രത്തിന്റെ ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐξ ὅλης
  choice: പൂർണ…ത്തോടും / പൂർണ…നോടും
  rationale: ἐξ എന്നതിന്റെ അക്ഷരാർഥം ‘നിന്ന്/പുറത്തുനിന്ന്’ എന്നാണെങ്കിലും, വ്യക്തിയുടെ ശേഷികളോടു ചേർന്ന ഈ പ്രയോഗത്തിൽ മുഴുവൻ വ്യക്തിത്വത്തോടെയുള്ള സ്നേഹമാണ് ഉദ്ദേശ്യം. ആവർത്തിക്കുന്ന ‘പൂർണ’ ὅλης എന്നതിന്റെ സമഗ്രതയും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: καρδίας
  choice: ഹൃദയം
  rationale: വികാരത്തിന്റെയും ഇച്ഛയുടെയും ആന്തരിക കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ വിവർത്തനം.
- source_word: ψυχῆς
  choice: പ്രാണൻ
  rationale: ψυχήയ്ക്ക് പ്രാണൻ, ജീവൻ, സ്വയം എന്നീ അർഥവ്യാപ്തികളുണ്ട്. പട്ടികയിലെ വ്യത്യസ്ത പദങ്ങളെ ലയിപ്പിക്കാതെ നിലനിർത്താനും മലയാള ബൈബിൾഭാഷയിൽ ഗ്രഹിക്കാവുന്ന വിധം അവതരിപ്പിക്കാനും ‘പ്രാണൻ’ തിരഞ്ഞെടുത്തു.
- source_word: διανοίας
  choice: മനസ്സ്
  rationale: ചിന്തിക്കുകയും ഗ്രഹിക്കുകയും ചെയ്യുന്ന ശേഷിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപദം; ‘ഹൃദയം’ എന്നതിൽനിന്നുള്ള വ്യത്യാസവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἰσχύος
  choice: ശക്തി
  rationale: ἰσχύς സൂചിപ്പിക്കുന്ന ബലം/ശേഷി വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ ‘ശക്തി’ എന്ന് നൽകിയിരിക്കുന്നു.
- source_word: καὶ … καὶ … καὶ … καὶ
  choice: …ത്തോടും …നോടും …ത്തോടും …യോടുംകൂടെ
  rationale: ഗ്രീക്കിലെ ആവർത്തിക്കുന്ന καίയുടെ സഞ്ചിതവും ഊന്നലുള്ളതുമായ ഘടന മലയാളത്തിലെ ആവർത്തിക്കുന്ന ‘-ഉം’ വഴി നിലനിർത്തി.
theological_decisions:
- issue: കല്പനയിലെ κύριος എന്ന ദൈവനാമസംബന്ധിയായ പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: യഹോവ / നാഥൻ
  rationale: ഗ്രീക്ക് പാഠം κύριος എന്നാണ് വായിക്കുന്നത്. അതിനാൽ ദൈവനാമത്തിന്റെ ഒരു പ്രത്യേക പുനർനിർമാണം പാഠത്തിലേക്ക് കൊണ്ടുവരാതെ പുതിയനിയമപ്രയോഗത്തോട് ചേർന്ന ‘കർത്താവ്’ സ്വീകരിച്ചു.
- issue: നാലു മാനവശേഷികളെ സൂചിപ്പിക്കുന്ന പദങ്ങളുടെ വേർതിരിവ്
  choice: ഹൃദയം / പ്രാണൻ / മനസ്സ് / ശക്തി
  alternative: ഹൃദയം / ജീവൻ / ഗ്രഹണം / ബലം
  rationale: മുഴുവൻ വ്യക്തിയോടെയുള്ള ഭക്തിയാണ് ആകെ ആശയമെങ്കിലും, പാഠത്തിലെ നാലു വ്യത്യസ്ത പദങ്ങളെ ഒരു പൊതുപ്രസ്താവനയായി ലയിപ്പിച്ചില്ല. അവയുടെ അർഥവ്യാപ്തിയും വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പൂർണ’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ὅλης എന്ന പദത്തിന്റെ നാലുതവണത്തെ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു; സംയുക്തമായ ‘-ഉം’ രൂപങ്ങൾ ആവർത്തിക്കുന്ന καίയുടെ താളം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
