id: MRK.12.1
reference: Mark 12:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: ml
  text: 'അവൻ അവരോടു ഉപമകൾ പറഞ്ഞുകൊണ്ട് തുടങ്ങി: “ഒരു മനുഷ്യൻ ഒരു മുന്തിരിത്തോട്ടം നട്ടു; അതിനു ചുറ്റും ഒരു വേലി കെട്ടി[a], മുന്തിരിച്ചക്കിന്റെ താഴത്തെ കുഴി കുഴിച്ചു[b], ഒരു ഗോപുരം പണിതു. പിന്നെ അത് കൃഷിക്കാർക്ക് പാട്ടത്തിനു കൊടുത്തു[c][d], പോയി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിനു ചുറ്റും ഒരു മുൾവേലി വെച്ചു.” ഗ്രീക്കിലെ φραγμός എന്ന പദം വേലി, മുൾവേലി, അല്ലെങ്കിൽ മറ്റൊരു തരത്തിലുള്ള ചുറ്റുമറയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മുന്തിരിച്ചക്കിന്റെ താഴത്തെ തൊട്ടി കുഴിച്ചു.” ഗ്രീക്കിലെ ὑπολήνιον മുന്തിരി ചവിട്ടിയ നീര് ഒഴുകിച്ചേരുന്ന മുന്തിരിച്ചക്കിന്റെ താഴത്തെ തൊട്ടി അഥവാ കുഴിയെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “കൃഷിക്കാർക്ക് വാടകയ്ക്കു കൊടുത്തു” അല്ലെങ്കിൽ “മുന്തിരിത്തോട്ടക്കാർക്ക് പാട്ടത്തിനു കൊടുത്തു.”
    reason: lexical_alternative
  - marker: d
    text: മുന്തിരിത്തോട്ടം നട്ട്, അതിനു ചുറ്റുമറ ഒരുക്കി, മുന്തിരിച്ചക്കിനുള്ള താഴത്തെ കുഴി കുഴിച്ച്, ഗോപുരം പണിയുന്ന ഈ ദൃശ്യം യെശയ്യാവ് 5:1–2-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: സംസാരിക്കാൻ തുടങ്ങി
  rationale: ആരംഭത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐν παραβολαῖς
  choice: ഉപമകളിലൂടെ
  rationale: യേശു ഉപമകളെ ആശയവിനിമയമാർഗമായി ഉപയോഗിച്ചതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: Ἀμπελῶνα
  choice: ഒരു മുന്തിരിത്തോട്ടം
  rationale: ἀμπελών എന്ന കൃഷിപദത്തിന്റെ നേരിട്ടുള്ള, സാധാരണ മലയാള പരിഭാഷ.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: കഥയിലെ പുരുഷനായ ഭൂവുടമയെ സൂചിപ്പിക്കുന്നതോടൊപ്പം ഗ്രീക്ക് പദത്തിന്റെ സാധാരണ അർഥവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: περιέθηκεν φραγμόν
  choice: അതിനു ചുറ്റും ഒരു വേലി കെട്ടി
  rationale: φραγμός സൂചിപ്പിക്കുന്ന സംരക്ഷണാതിർത്തിയെ വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അത് വേലിയോ മുൾവേലിയോ ആയിരിക്കാമെന്ന വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ὤρυξεν ὑπολήνιον
  choice: മുന്തിരിച്ചക്കിനായി ഒരു ചവിട്ടുകുഴി കുഴിച്ചു
  rationale: ὑπολήνιον മുന്തിരി ചവിട്ടുന്ന സംവിധാനത്തിന്റെ താഴത്തെ കുഴി അഥവാ സംഭരണത്തൊട്ടിയെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും ‘ചക്ക്’ എന്നു പറയുന്നതിനെക്കാൾ ഈ പ്രത്യേകത വ്യക്തമാക്കുന്നു.
- source_word: ᾠκοδόμησεν πύργον
  choice: ഒരു കാവൽഗോപുരം പണിതു
  rationale: മുന്തിരിത്തോട്ടത്തിലെ πύργος നിരീക്ഷണത്തിനും കാവലിനുമുള്ള ഗോപുരമാണെന്ന സാഹചര്യാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: അത് കുടിയാൻ കൃഷിക്കാർക്ക് പാട്ടത്തിനു കൊടുത്തു
  rationale: ἐκδίδωμι സൂചിപ്പിക്കുന്ന പാട്ടബന്ധവും, γεωργοί ഭൂവുടമയുടെ തോട്ടം കൃഷി ചെയ്യുന്ന കുടിയാന്മാരാണെന്ന സാമൂഹികബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: ἀπεδήμησεν
  choice: ദൂരദേശത്തേക്കു പോയി
  rationale: സ്വദേശത്തുനിന്നോ വാസസ്ഥലത്തുനിന്നോ കുറേക്കാലത്തേക്ക് അകലെ പോകുക എന്ന ἀποδημέωയുടെ അർഥം നൽകുന്നു; യാത്രയുടെ ദൈർഘ്യം അനാവശ്യമായി നിശ്ചയിക്കുന്നില്ല.
theological_decisions:
- issue: ἄνθρωπος എന്ന പദത്തിന്റെ അവതരണം
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരാൾ
  rationale: ഇവിടെ പൊതുവായ മനുഷ്യവർഗമല്ല, കഥയിലെ ഒരു പുരുഷ ഭൂവുടമയാണ് ഉദ്ദേശ്യം; അതിനാൽ ലിംഗവും കഥാചിത്രവും നിലനിർത്തി.
- issue: γεωργοῖς എന്നതിലെ പാട്ടക്കൃഷിബന്ധം
  choice: കുടിയാൻ കൃഷിക്കാർ
  alternative: കൃഷിക്കാർ / മുന്തിരിത്തോട്ടക്കാർ
  rationale: തോട്ടം അവരുടേതല്ലെന്നും ഉടമയിൽനിന്ന് പാട്ടത്തിനെടുത്തതാണെന്നും തുടർന്നുള്ള ഉപമയ്ക്ക് നിർണായകമാണ്; എന്നാൽ അവരുടെ കരാറിന്റെ കൂടുതൽ വിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
- issue: യെശയ്യാവ് 5:1–2-ലേക്കുള്ള പ്രതിധ്വനി
  choice: വിവർത്തനത്തിൽ നേരിട്ട് വിശദീകരിക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു
  alternative: പ്രധാനവാക്യത്തിൽ വ്യാഖ്യാനപരമായി വ്യക്തമാക്കുക
  rationale: മുന്തിരിത്തോട്ടം നട്ട് ചുറ്റുമതിൽ ഒരുക്കി ചക്കും ഗോപുരവും പണിയുന്ന ദൃശ്യക്രമം യെശയ്യാവ് 5-നെ ഓർമിപ്പിക്കുന്നു; വായനക്കാരൻ ബന്ധം കാണാൻ സഹായിക്കുമ്പോഴും ഉപമയുടെ തിരിച്ചറിയൽ മുൻകൂട്ടി നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. കൃഷിസംബന്ധമായ പുരാതന ദൃശ്യങ്ങൾ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങളിലൂടെ നൽകി; അപരിചിതമായ സാങ്കേതിക പ്രത്യേകതകൾ അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു. വാക്യത്തിന്റെ ഗൗരവവും ഉപമയുടെ സംക്ഷിപ്തമായ പുരോഗതിയും നിലനിർത്തി.
