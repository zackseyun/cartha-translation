  text: Καὶ ἐξῆλθεν πάλιν παρὰ τὴν θάλασσαν· καὶ πᾶς ὁ ὄχλος ἤρχετο πρὸς αὐτόν, καὶ ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: ml
  text: അവൻ വീണ്ടും കടൽത്തീരത്തിനരികിലൂടെ പോയി; ജനക്കൂട്ടം മുഴുവനും അവന്റെ അടുക്കൽ വന്നുകൊണ്ടിരുന്നു[a], അവൻ അവരെ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വന്നുകൊണ്ടിരുന്നു”, “പഠിപ്പിച്ചുകൊണ്ടിരുന്നു” എന്നീ ക്രിയകൾ ഭൂതകാലത്തിൽ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് imperfect രൂപങ്ങളെ പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത പുറപ്പെടൽസ്ഥലം ചേർക്കുന്നില്ല.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: പ്രവൃത്തിയുടെ ആവർത്തനം ലളിതവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: παρὰ τὴν θάλασσαν
  choice: കടൽത്തീരത്തേക്കു
  rationale: παρά + accusative ഇവിടെ കടലിനരികിലേക്കോ കടൽത്തീരത്തോടു ചേർന്നോ ഉള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ദിശാസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πᾶς ὁ ὄχλος
  choice: ജനക്കൂട്ടം മുഴുവനും
  rationale: ഏകവചനത്തിലുള്ള കൂട്ടനാമത്തോടുകൂടിയ πᾶς ὁ എന്ന പ്രയോഗത്തിന്റെ സമഗ്രത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἤρχετο
  choice: വന്നുകൊണ്ടിരുന്നു
  rationale: ഭൂതകാലത്തിലെ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് imperfect-ന്റെ ഭാവം നിലനിർത്തുന്നു; ആവർത്തനം നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: πρὸς αὐτόν
  choice: അവന്റെ അടുക്കൽ
  rationale: ഒരു വ്യക്തിയിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്ന πρός എന്നതിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: ἐδίδασκεν
  choice: പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: ഗ്രീക്ക് imperfect സൂചിപ്പിക്കുന്ന തുടരുന്ന ഭൂതകാലപ്രവൃത്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: αὐτούς
  choice: അവരെ
  rationale: മുൻപറഞ്ഞ ജനക്കൂട്ടത്തിലെ ആളുകളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
