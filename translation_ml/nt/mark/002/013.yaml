  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്ക് ക്രിയകളുടെ തുടരുന്ന ഭാവം മലയാളത്തിലെ ‘-കൊണ്ടിരുന്നു’ രൂപങ്ങളിലൂടെ സംരക്ഷിച്ചു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത സ്ഥലമോ സംഭവവിശദാംശമോ ചേർത്തിട്ടില്ല.
