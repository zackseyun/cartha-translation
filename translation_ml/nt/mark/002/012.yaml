  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: ml
  text: അവൻ എഴുന്നേറ്റു, ഉടനെ പായ എടുത്ത് എല്ലാവരുടെയും കൺമുന്നിൽകൂടി പുറത്തേക്കു പോയി. അങ്ങനെ എല്ലാവരും അതിശയിച്ചുപോയി ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി. “ഇങ്ങനെയൊന്ന് ഞങ്ങൾ ഒരിക്കലും കണ്ടിട്ടില്ല”[a] എന്ന് അവർ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഇങ്ങനെ ഞങ്ങൾ ഒരിക്കലും കണ്ടിട്ടില്ല.” തങ്ങൾക്കു മുമ്പൊരിക്കലും ഇത്തരമൊരു അനുഭവം ഉണ്ടായിട്ടില്ലെന്നാണ് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: എഴുന്നേറ്റു
  rationale: സൗഖ്യം പ്രാപിച്ച മനുഷ്യൻ യേശുവിന്റെ കല്പന അനുസരിച്ച് എഴുന്നേൽക്കുന്നതാണ് സന്ദർഭത്തിലെ നേരിട്ടുള്ള അർഥം. ഗ്രീക്കിലെ രൂപം പാസീവായും ഗ്രഹിക്കാമെങ്കിലും, മലയാളത്തിലെ ‘എഴുന്നേറ്റു’ സ്വാഭാവികമായി ഈ ശാരീരിക പ്രവൃത്തിയെ അറിയിക്കുകയും അനാവശ്യമായ പുനരുത്ഥാനസൂചന ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: εὐθύς
  choice: ഉടനെ
  rationale: മാർക്കോസിന്റെ വിവരണത്തിലെ തൽക്ഷണതയും വേഗവും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἄρας
  choice: എടുത്ത്
  rationale: പായ ഉയർത്തി കൈയിൽ എടുത്തുകൊണ്ടുപോകുന്ന പ്രവൃത്തിയെ സന്ദർഭാനുസൃതമായി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: κράβαττον
  choice: പായ
  rationale: ഇത് സാധാരണ കിടക്കയെയോ ഉറങ്ങാനുള്ള വിരിപ്പിനെയോ സൂചിപ്പിക്കുന്നു. ‘കട്ടിൽ’ എന്നതിനെക്കാൾ ‘പായ’ സാധാരണ വായനക്കാർക്ക് ഈ സന്ദർഭത്തിൽ വ്യക്തവും അമിതവ്യാഖ്യാനമില്ലാത്തതുമാണ്.
- source_word: ἔμπροσθεν πάντων
  choice: എല്ലാവരുടെയും മുമ്പിലൂടെ
  rationale: അവൻ സകലരുടെയും കൺമുന്നിലൂടെ പുറത്തുപോയെന്ന പരസ്യസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: അങ്ങനെ എല്ലാവരും അതിശയിച്ചുപോയി
  rationale: സംഭവത്തിന്റെ ഫലമായി എല്ലാവരും അത്യന്തം വിസ്മയിച്ചുവെന്ന അർഥം നൽകുന്നു; ‘അതിശയിച്ചുപോയി’ എന്നത് ἐξίστασθαιയുടെ ശക്തി സാധാരണ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δοξάζειν τὸν θεόν
  choice: ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി
  rationale: ദൈവത്തിനു മഹത്ത്വം നൽകുന്ന പ്രതികരണത്തെ ബൈബിൾശൈലിയിലുള്ളതും മനസ്സിലാക്കാവുന്നതുമായ ഭാഷയിൽ സംരക്ഷിക്കുന്നു.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: ഇങ്ങനെയൊന്ന് ഞങ്ങൾ ഒരിക്കലും കണ്ടിട്ടില്ല
  rationale: ‘ഇങ്ങനെ ഒരിക്കലും കണ്ടിട്ടില്ല’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ, ഈ സംഭവം തങ്ങൾക്ക് മുമ്പൊരിക്കലും അനുഭവപ്പെട്ടിട്ടില്ലെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἠγέρθη എന്ന പദത്തിലെ സാധ്യതയുള്ള പുനരുത്ഥാനസൂചന
  choice: ഉടൻ സംഭവിച്ച സൗഖ്യത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘എഴുന്നേറ്റു’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘എഴുന്നേൽപ്പിക്കപ്പെട്ടു’
  rationale: ἐγείρω മറ്റിടങ്ങളിൽ പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ പക്ഷാഘാതബാധിതൻ യേശുവിന്റെ കല്പന അനുസരിച്ച് ശാരീരികമായി എഴുന്നേൽക്കുന്നതാണ് മുഖ്യമായ അർഥം. പാസീവ് രൂപം കൃത്രിമമായി നിലനിർത്തുന്നത് ഈ വാക്യത്തിൽ മുൻനിരയിലില്ലാത്ത ദൈവശാസ്ത്രസൂചന സൃഷ്ടിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. മാർക്കോസിന്റെ വേഗമുള്ള ആഖ്യാനഭാവം ‘ഉടനെ’ എന്ന പദത്തിലൂടെ നിലനിർത്തി; പൊതുവായ ബൈബിൾപ്രയോഗമായ ‘ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി’ സംരക്ഷിച്ചു.
