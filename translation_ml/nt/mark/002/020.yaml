source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: ml
  text: എന്നാൽ, മണവാളൻ അവരിൽനിന്ന് എടുത്തുമാറ്റപ്പെടുന്ന നാളുകൾ വരും; അപ്പോൾ അവർ ആ ദിവസത്തിൽ ഉപവസിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക് പ്രയോഗം ഏകവചനത്തിലാണ്: ‘ആ ദിവസത്തിൽ’; ‘ആ ദിവസങ്ങളിൽ’ എന്നല്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: എന്നാൽ ... നാളുകൾ വരും
  rationale: മുൻസാഹചര്യത്തോടുള്ള വൈരുധ്യം δέ അനുസരിച്ച് ‘എന്നാൽ’ കൊണ്ടും, ‘നാളുകൾ വരും’ എന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളരീതിയിലും നിലനിർത്തുന്നു.
- source_word: ὅταν
  choice: '...പ്പെടുന്ന'
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സന്ദർഭത്തെ സൂചിപ്പിക്കുന്ന ὅταν ഇവിടെ ‘എപ്പോൾ’ എന്ന ആവർത്തനാർഥത്തേക്കാൾ, ‘...പ്പെടുന്ന’ എന്ന സമയബന്ധിത ഘടനയിൽ സ്വാഭാവികമായി വരുന്നു.
- source_word: ἀπαρθῇ
  choice: എടുത്തുമാറ്റപ്പെടുന്ന
  rationale: അപ്രതീക്ഷിതമോ ബലപ്രയോഗപരമോ ആയ നീക്കലിന്റെ ഭാവം ഉൾക്കൊള്ളുന്ന നിഷ്ക്രിയരൂപം നിലനിർത്തുന്നു; പ്രവർത്തകനെ വ്യക്തമാക്കുന്നില്ല.
- source_word: ἀπ’ αὐτῶν
  choice: അവരിൽനിന്ന്
  rationale: മണവാളനും കൂടെയുള്ളവരും തമ്മിലുള്ള വേർപാടിനെ സംക്ഷിപ്തമായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: ὁ νυμφίος
  choice: മണവാളൻ
  rationale: വിവാഹരൂപകം നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ മാന്യവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പദം.
- source_word: καὶ τότε
  choice: അപ്പോൾ
  rationale: മണവാളൻ എടുത്തുമാറ്റപ്പെട്ടതിന് ശേഷമുള്ള ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: νηστεύσουσιν
  choice: അവർ ഉപവസിക്കും
  rationale: νηστεύω എന്ന മതപരമായ ആചാരത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്ന സ്ഥാപിത മലയാളപദം ഉപയോഗിക്കുന്നു.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ആ നാളിൽ
  rationale: ഗ്രീക്കിലെ ഏകവചനം കൃത്യമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി സമയത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിനെ മണവാളനായി രൂപകപരമായി തിരിച്ചറിയുന്നത്
  choice: ‘മണവാളൻ’ എന്ന രൂപകം വിശദീകരിക്കാതെ നിലനിർത്തി.
  alternative: ‘ഞാൻ അവരിൽനിന്ന് എടുത്തുമാറ്റപ്പെടുമ്പോൾ’ എന്ന് പരാവർത്തനം ചെയ്യുക.
  rationale: സന്ദർഭത്തിൽ യേശു തന്നെക്കുറിച്ചാണ് പറയുന്നതെന്ന് വ്യക്തമാണെങ്കിലും, ഗ്രീക്ക് പാഠം നേരിട്ടുള്ള സ്വയംതിരിച്ചറിയലിനു പകരം രൂപകം ഉപയോഗിക്കുന്നു; അതിനാൽ അതിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര ശക്തി നിലനിർത്തുന്നു.
- issue: മണവാളൻ നീക്കപ്പെടുന്നതിന്റെ സ്വഭാവം
  choice: പ്രവർത്തകനെയോ മരണത്തെയോ വ്യക്തമാക്കാതെ ‘എടുത്തുമാറ്റപ്പെടുന്ന’ എന്ന നിഷ്ക്രിയരൂപം ഉപയോഗിച്ചു.
  alternative: ‘മരണത്തിലൂടെ എടുത്തുമാറ്റപ്പെടുന്ന’ അല്ലെങ്കിൽ ‘ബലമായി എടുത്തുകൊണ്ടുപോകപ്പെടുന്ന’.
  rationale: ഇത് യേശുവിന്റെ മരണത്തെ മുൻകൂട്ടി സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാമെങ്കിലും, ഈ വാക്യം പ്രവർത്തകനെയോ നീക്കലിന്റെ രീതിയെയോ വ്യക്തമാക്കുന്നില്ല; ആ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന. വിവാഹരൂപകവും നിഷ്ക്രിയക്രിയയും ഗ്രീക്ക് പാഠത്തിനനുസരിച്ച് നിലനിർത്തി; ‘ആ നാളിൽ’ എന്ന ഏകവചനത്തിന് പാഠപരമായ പ്രാധാന്യമുള്ളതിനാൽ അടിക്കുറിപ്പ് ചേർത്തു.
