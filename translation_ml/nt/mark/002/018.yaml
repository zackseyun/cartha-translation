id: MRK.2.18
reference: Mark 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: ml
  text: 'യോഹന്നാന്റെ ശിഷ്യന്മാരും പരീശന്മാരും ഉപവസിക്കുകയായിരുന്നു. അവർ വന്ന് അവനോടു[a] പറഞ്ഞു: “യോഹന്നാന്റെ ശിഷ്യന്മാരും പരീശന്മാരുടെ ശിഷ്യന്മാരും ഉപവസിക്കുന്നു; എന്നാൽ നിന്റെ ശിഷ്യന്മാർ ഉപവസിക്കാത്തത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചിലർ വന്ന് അവനോടു പറഞ്ഞു.” ‘വരുന്നു’, ‘പറയുന്നു’ എന്നീ ക്രിയകളുടെ കർത്താവ് ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: ഉപവസിക്കുകയായിരുന്നു
  rationale: അപൂർണഭൂതകാല εἰμίയും വർത്തമാനകൃതന്തവും ചേർന്ന പരിവർത്തിത ക്രിയാരൂപം ഭൂതകാലത്തിലെ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: യോഹന്നാന്റെ ശിഷ്യന്മാർ
  rationale: ബന്ധം സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് മലയാളത്തിലെ ഉടമസ്ഥബന്ധരൂപത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: οἱ Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ പേരാണ്.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: വന്ന് ... ചോദിച്ചു
  rationale: മർക്കോസിന്റെ ചരിത്രവർത്തമാനങ്ങൾ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകി. നേരിട്ടുള്ള വാക്കുകൾ ചോദ്യം ആയതിനാൽ λέγουσιν എന്നത് സന്ദർഭോചിതമായി ‘ചോദിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Διὰ τί
  choice: എന്തുകൊണ്ട്
  rationale: കാരണത്തെക്കുറിച്ചുള്ള ചോദ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: പരീശന്മാരുടെ ശിഷ്യന്മാർ
  rationale: ജനിറ്റീവ് ബന്ധം കൃത്യമായി നിലനിർത്തുന്നു; ആദ്യ പരാമർശത്തിലെ ‘പരീശന്മാർ’ എന്നതിൽനിന്ന് വ്യത്യസ്തമായി അവരുടെ ശിഷ്യരെ വ്യക്തമാക്കുന്നു.
- source_word: νηστεύουσιν
  choice: ഉപവസിക്കുന്നു
  rationale: ഇവിടത്തെ വർത്തമാനകാലം പതിവായ ആചാരത്തെയോ നിലവിലെ പ്രവർത്തിയെയോ ഉൾക്കൊള്ളാൻ കഴിയും; ലളിത വർത്തമാനരൂപം ആ തുറന്ന അർഥപരിധി നിലനിർത്തുന്നു.
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: എന്നാൽ നിന്റെ ശിഷ്യന്മാർ
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം ‘എന്നാൽ’ എന്നും σοίയുടെ ഉടമസ്ഥഭാവം ‘നിന്റെ’ എന്നും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ἔρχονται καὶ λέγουσιν എന്നതിലെ പറയാത്ത കർത്താവിന്റെ തിരിച്ചറിയൽ
  choice: ‘ചിലർ’ എന്നു പൊതുവായി നൽകി, ഒരു പ്രത്യേക കൂട്ടത്തെ തിരിച്ചറിഞ്ഞില്ല.
  alternative: മുൻവാക്യത്തിലെ യോഹന്നാന്റെ ശിഷ്യന്മാരും പരീശന്മാരുമാണ് വന്നതെന്ന് വ്യക്തമാക്കുക; അല്ലെങ്കിൽ കർത്താവിനെ പറയാതെ ‘വന്ന് ചോദിച്ചു’ എന്നു മാത്രം നൽകുക.
  rationale: ഗ്രീക്കിൽ ക്രിയകളുടെ കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല. മലയാളത്തിൽ പൂർണമായും കർത്താവില്ലാത്ത പ്രയോഗം ആശയക്കുഴപ്പം സൃഷ്ടിക്കാവുന്നതിനാൽ ‘ചിലർ’ എന്ന പൊതുരൂപം ഉപയോഗിച്ചു; ആരാണെന്ന് വാചകം പറയാത്തതു നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഉപവസിക്കുക’, ‘ശിഷ്യന്മാർ’, ‘പരീശന്മാർ’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന ബൈബിൾ പദങ്ങൾ നിലനിർത്തി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ഭൂതകാല ആഖ്യാനമായി നൽകി; പ്രസംഗത്തിലെ വർത്തമാനകാല വൈരുധ്യം അതേപടി സൂക്ഷിച്ചു.
