  to: 'യോഹന്നാന്റെ ശിഷ്യന്മാരും പരീശന്മാരും ഉപവസിക്കുകയായിരുന്നു. അവർ വന്ന് അവനോടു[a] പറഞ്ഞു: “യോഹന്നാന്റെ ശിഷ്യന്മാരും പരീശന്മാരുടെ ശിഷ്യന്മാരും ഉപവസിക്കുന്നു; എന്നാൽ നിന്റെ ശിഷ്യന്മാർ ഉപവസിക്കാത്തത് എന്തുകൊണ്ട്?”'
  rationale: ഗ്രീക്കിലെ പറയാത്ത ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ ‘അവർ’ എന്ന് നൽകിയിരിക്കുന്നു. ഇത് വ്യക്തികളുടെ ഒരു പ്രത്യേക ഉപസമൂഹമാണെന്ന ‘ചിലർ’ എന്ന സൂചന ഒഴിവാക്കുകയും, സന്ദർഭത്തിൽ കർത്താവ് ആരാണെന്നുള്ള മൂലപാഠത്തിന്റെ അനിശ്ചിതത്വം സംരക്ഷിക്കുകയും ചെയ്യുന്നു. ‘പറഞ്ഞു’ എന്നത് നേരിട്ടുള്ള ഉദ്ധരണിക്ക് സ്വാഭാവികവും λέγουσιν-നോട് അടുത്തതുമാണ്.
