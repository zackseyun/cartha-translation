    rationale: ἔρχονται καὶ λέγουσιν എന്ന ക്രിയകളുടെ കർത്താവ് ഗ്രീക്കിൽ തിരിച്ചറിയിക്കപ്പെട്ടിട്ടില്ല; ബഹുവചനസൂചന മാത്രമുണ്ട്. ‘ചിലർ’ എന്നു പറയുന്നത് എണ്ണം/ഉപസമൂഹഭാവം ചേർക്കുന്നു. ‘അവർ’ എന്ന അനിർദ്ദിഷ്ട സർവനാമം ഈ തുറന്നത്വം കൂടുതൽ നന്നായി സംരക്ഷിക്കുന്നു.
