reference: Mark 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: ml
  text: 'പരീശന്മാരുടെ ശാസ്ത്രിമാർ[a] അവൻ പാപികളോടും ചുങ്കക്കാരോടുംകൂടെ ഭക്ഷണം കഴിക്കുന്നതു കണ്ടപ്പോൾ അവന്റെ ശിഷ്യന്മാരോട് പറഞ്ഞുകൊണ്ടിരുന്നു: “അവൻ ചുങ്കക്കാരോടും പാപികളോടുംകൂടെ ഭക്ഷണം കഴിക്കുന്നത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരീശന്മാരുടെ ശാസ്ത്രിമാർ’ എന്നത് പരീശന്മാരുമായി ബന്ധപ്പെട്ട ശാസ്ത്രിമാർ എന്നോ പരീശന്മാരായ ശാസ്ത്രിമാർ എന്നോ മനസ്സിലാക്കാം.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ തിരുവെഴുത്തിലും ന്യായപ്രമാണത്തിലും പ്രാവീണ്യമുള്ള അംഗീകൃത വിദഗ്ധരെ സൂചിപ്പിക്കുന്ന പതിവായ മലയാള പദം.
- source_word: τῶν Φαρισαίων
  choice: പരീശന്മാരുടെ
  rationale: ജനിറ്റീവ് ഘടനയെ നേരിട്ട് നിലനിർത്തി, ശാസ്ത്രിമാർക്ക് പരീശന്മാരുമായുള്ള ബന്ധമോ അംഗത്വമോ സൂചിപ്പിക്കുന്നു; അവർ നിർബന്ധമായും പരീശന്മാർ തന്നെയാണെന്ന് കൂടുതൽ വ്യക്തമായി തീരുമാനിക്കുന്നില്ല.
- source_word: ἰδόντες
  choice: കണ്ടപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തിന്റെ സാഹചര്യകാലാർഥം സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി നൽകുന്നു.
- source_word: ὅτι ἐσθίει
  choice: ഭക്ഷണം കഴിക്കുന്നതു
  rationale: നടന്നുകൊണ്ടിരുന്ന രംഗം സൂചിപ്പിക്കുന്ന ഇംപെർഫെക്റ്റ് ഭാവം മലയാളത്തിലെ വർത്തമാന കൃതന്തഘടനയിൽ സാഹചര്യാനുസൃതമായി പ്രകടമാക്കുന്നു.
- source_word: μετὰ
  choice: -ഓടുംകൂടെ
  rationale: സഹവാസത്തെയും ഒരുമിച്ചുള്ള ഭക്ഷണത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; മേശക്കൂട്ടായ്മ എന്ന വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἁμαρτωλῶν
  choice: പാപികൾ
  rationale: വാക്യത്തിലെ സാമൂഹിക-മതപരമായ മുദ്രകുത്തലിന്റെ ശക്തി മയപ്പെടുത്താതെ നേരിട്ടുള്ള തുല്യപദം ഉപയോഗിക്കുന്നു.
- source_word: τελωνῶν
  choice: ചുങ്കക്കാർ
  rationale: സുവിശേഷസന്ദർഭത്തിലെ നികുതി/ചുങ്കം പിരിക്കുന്ന, സാമൂഹികമായി നിന്ദിക്കപ്പെട്ട വിഭാഗത്തിനുള്ള പരിചിതമായ മലയാള പദം.
- source_word: ἔλεγον
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റിന്റെ തുടർച്ചയോ ആവർത്തനമോ നിലനിർത്തുന്നു; പിന്നാലെയുള്ള വാക്കുകൾ ചോദ്യം ആയതിനാൽ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികം.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരോട്
  rationale: ഗുരു-ശിഷ്യബന്ധം കൃത്യമായി നിലനിർത്തുന്ന പതിവായ മലയാള പ്രയോഗം.
- source_word: Ὅτι
  choice: എന്തുകൊണ്ട്
  rationale: ഇവിടെ പരാതിസ്വഭാവമുള്ള ചോദ്യത്തെ പരിചയപ്പെടുത്തുന്ന ὅτιയുടെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐσθίει
  choice: ഭക്ഷണം കഴിക്കുന്നത്
  rationale: പ്രവൃത്തിയുടെ അപൂർണ്ണ/സ്വഭാവപരമായ ഭാവം തുറന്നുവെക്കുന്ന സ്വാഭാവിക ചോദ്യം; ‘വിരുന്നിൽ പങ്കുചേരുന്നു’ എന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ഒരുമിച്ചുള്ള ഭക്ഷണത്തിന്റെ സാമൂഹിക-മതപരമായ പ്രാധാന്യം
  choice: ‘പാപികളോടും ചുങ്കക്കാരോടുംകൂടെ ഭക്ഷണം കഴിക്കുന്നു’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ചുങ്കക്കാരോടും പാപികളോടും ഭക്ഷണകൂട്ടായ്മ പങ്കിടുന്നു’ എന്നിങ്ങനെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പറയാം.
  rationale: യേശു മുദ്രകുത്തപ്പെട്ടവരോടു സഹവസിക്കുന്നതിലുള്ള സംഘർഷം ഗ്രീക്ക് സാധാരണ ‘ഭക്ഷിക്കുക’ എന്ന ക്രിയയും ‘കൂടെ’ എന്ന ബന്ധവുംകൊണ്ടാണ് അവതരിപ്പിക്കുന്നത്. സാമൂഹിക അർഥം മുഖ്യവാക്യത്തിൽ വിശദീകരിക്കാതെ കഥാസന്ദർഭം വെളിപ്പെടുത്താൻ അനുവദിക്കുന്നു.
- issue: τῶν Φαρισαίων എന്ന ജനിറ്റീവിന്റെ ബന്ധം
  choice: ‘പരീശന്മാരുടെ ശാസ്ത്രിമാർ’ എന്നു നൽകി ബന്ധത്തിന്റെ യഥാർഥ സ്വഭാവം തുറന്നുവെച്ചു.
  alternative: ‘പരീശന്മാരായ ശാസ്ത്രിമാർ’ എന്നു നൽകി എല്ലാവരെയും പരീശന്മാരായി വ്യക്തമായി തിരിച്ചറിയാം.
  rationale: ജനിറ്റീവ് അംഗത്വമോ ബന്ധമോ സൂചിപ്പിക്കാം. മൂലത്തിലുള്ള ഈ പരിമിതമായ അനിശ്ചിതത്വം കൂടുതൽ നിർണ്ണയിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശാസ്ത്രിമാർ,’ ‘ചുങ്കക്കാർ,’ ‘ശിഷ്യന്മാർ’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി. ഗ്രീക്കിലെ പട്ടികാക്രമം ആദ്യ പരാമർശത്തിൽ ‘പാപികൾ—ചുങ്കക്കാർ’ എന്നും ചോദ്യത്തിൽ ‘ചുങ്കക്കാർ—പാപികൾ’ എന്നും സംരക്ഷിച്ചു.
