  terminology: ‘ശബ്ബത്ത്’ is the established Malayalam biblical term. ‘മനുഷ്യൻ’ appropriately retains the Greek singular representative expression, while the footnote clearly supplies the inclusive referential sense. No doctrinally loaded or unnatural terminology has been introduced.
