source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “ശബ്ബത്ത് മനുഷ്യനുവേണ്ടിയാണ്[a] ഉണ്ടായത്; മനുഷ്യൻ ശബ്ബത്തിനുവേണ്ടിയല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മനുഷ്യവർഗത്തിനുവേണ്ടിയാണ്.” ഗ്രീക്കിൽ ഏകവചനമായ ἄνθρωπος (“മനുഷ്യൻ”) മനുഷ്യരെ പൊതുവായി പ്രതിനിധീകരിച്ചാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം നടന്നുകൊണ്ടിരുന്ന അല്ലെങ്കിൽ ആവർത്തിച്ചിരുന്ന സംസാരത്തെ സൂചിപ്പിക്കാം; മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ആ കാലഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: σάββατον
  choice: ശബ്ബത്ത്
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ഏകവചനം ശബ്ബത്ത് ദിനത്തെയോ സ്ഥാപനത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ശബ്ബത്ത്’ എന്നത് മലയാളത്തിലെ പരിചിതവും സംക്ഷിപ്തവുമായ പദമാണ്.
- source_word: διὰ τὸν ἄνθρωπον
  choice: മനുഷ്യനുവേണ്ടിയാണ്
  rationale: കർമകാരകത്തോടുകൂടിയ διά ഉദ്ദേശ്യമോ പ്രയോജനമോ സൂചിപ്പിക്കുന്നു. ഏകവചനമായ ἄνθρωπος ഇവിടെ മനുഷ്യരെ പൊതുവായി പ്രതിനിധീകരിക്കുന്നു; ‘മനുഷ്യൻ’ ആ ഏകവചനവും പൊതുവായ അർഥവും നിലനിർത്തുന്നു.
- source_word: ἐγένετο
  choice: ഉണ്ടായത്
  rationale: γίνομαι എന്ന പദത്തിന്റെ ‘ഉണ്ടാകുക/നിലവിൽ വരുക’ എന്ന അർഥം ഇത് സ്വാഭാവികമായി നൽകുന്നു; പ്രത്യേകമായി ‘നിർമിക്കപ്പെട്ടു’ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: മനുഷ്യൻ ശബ്ബത്തിനുവേണ്ടിയല്ല
  rationale: മൂലത്തിലെ വിപരീതസമാന്തര ഘടനയും സംക്ഷിപ്തമായ വിധിപ്രസ്താവവും മലയാളത്തിൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൊതുപ്രതിനിധിയായ ഏകവചന ἄνθρωπος
  choice: പ്രധാനവാചകത്തിൽ ‘മനുഷ്യൻ’
  alternative: ‘മനുഷ്യവർഗം’ അല്ലെങ്കിൽ ‘മനുഷ്യർ’
  rationale: ഈ വചനം എല്ലാ മനുഷ്യരെയും സംബന്ധിക്കുന്ന ഒരു പൊതുതത്ത്വമാണ് പറയുന്നത്. ‘മനുഷ്യൻ’ മലയാളത്തിൽ ലിംഗഭേദമില്ലാതെ മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കാനും മൂലത്തിലെ ഏകവചന സമാന്തരഘടന നിലനിർത്താനും കഴിയും; ഉൾക്കൊള്ളുന്ന സമൂഹാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന രൂപം ആഖ്യാനത്തിലെ അപൂർണഭൂതകാലഭാവം സൂക്ഷിക്കുന്നു; രണ്ടു വിരുദ്ധഖണ്ഡങ്ങളുടെയും വാചകസമാന്തര്യം നിലനിർത്തിയിരിക്കുന്നു.
