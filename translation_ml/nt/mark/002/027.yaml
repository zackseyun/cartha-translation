  source_fidelity: 'The Malayalam faithfully represents every element of the Greek: καὶ ἔλεγεν αὐτοῖς is conveyed with the imperfective ‘അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു’; the purpose/benefit force of διὰ + accusative is retained in ‘...വേണ്ടി’; ἐγένετο is naturally rendered ‘ഉണ്ടായത്’; and the antithetical elliptical second clause is preserved without adding an explicit verb. The singular representative sense of ἄνθρωπος and the rhetorical symmetry are maintained.'
