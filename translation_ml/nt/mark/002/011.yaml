source:
  edition: SBLGNT
  text: Σοὶ λέγω, ⸀ἔγειρε ἆρον τὸν κράβαττόν σου καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: ml
  text: '“ഞാൻ നിന്നോടു പറയുന്നു: എഴുന്നേൽക്കുക, നിന്റെ പായ എടുത്തുകൊണ്ട് നിന്റെ വീട്ടിലേക്കു പോകുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: ഞാൻ നിന്നോടു പറയുന്നു
  rationale: മുൻസ്ഥാനത്തുള്ള ദ്വിതീയപുരുഷ ദത്തിവിഭക്തി സർവനാമത്തിന്റെ നേരിട്ടുള്ള വ്യക്തിപരമായ അഭിസംബോധന നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ അധിക ഊന്നൽ ചേർക്കാതെ അവതരിപ്പിച്ചു.
- source_word: ἔγειρε
  choice: എഴുന്നേൽക്കുക
  rationale: തളർവാതരോഗിയോടുള്ള നേരിട്ടുള്ള ആജ്ഞയെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἆρον
  choice: എടുത്തുകൊണ്ട്
  rationale: പായ ഉയർത്തിയെടുത്തശേഷം അതുമായി പോകുക എന്ന തുടർച്ചയായ പ്രവർത്തനക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κράβαττόν
  choice: പായ
  rationale: κράβαττος സാധാരണയായി ലളിതവും കൊണ്ടുനടക്കാവുന്നതുമായ കിടപ്പുപായയെയോ കിടക്കവിരിയെയോ സൂചിപ്പിക്കുന്നു; ‘കിടക്ക’ എന്നു പറഞ്ഞാൽ ഭാരമുള്ള കട്ടിൽ എന്ന ധാരണ വരാം.
- source_word: ὕπαγε
  choice: പോകുക
  rationale: ആജ്ഞാശൃംഖലയിലെ ലളിതവും നേരിട്ടുള്ളതുമായ ഗതിക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς τὸν οἶκόν σου
  choice: നിന്റെ വീട്ടിലേക്കു
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചനയും οἶκος എന്ന മൂർത്തമായ ‘വീട്’ എന്ന അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സൗഖ്യപ്പെടുത്തൽ കല്പനയുടെ സ്വരവും ശക്തിയും
  choice: വ്യക്തിപരവും നേരിട്ടും അധികാരപൂർണവുമായ കല്പനയായി അവതരിപ്പിച്ചു.
  alternative: പരമ്പരാഗതമായി കൂടുതൽ ഔപചാരികമായ ‘എഴുന്നേറ്റ് നിന്റെ കിടക്ക എടുത്ത് വീട്ടിലേക്കു പോക’ എന്ന രൂപം.
  rationale: മൂലവാക്യത്തിലെ ആജ്ഞകളുടെ ഉടനടിയുള്ള ശക്തി നിലനിർത്തുന്നു; സൗഖ്യത്തെക്കുറിച്ച് വാക്യത്തിൽ തുറന്നുപറയാത്ത അധിക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പായ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളും അടിക്കുറിപ്പുകളും തമ്മിൽ പൊരുത്തക്കേടുള്ളതിനാൽ, ഗ്രീക്ക് മൂലപാഠം സ്വതന്ത്രമായി വ്യക്തമായിരിക്കുന്ന ഈ വാക്യത്തിൽ അനാവശ്യ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
