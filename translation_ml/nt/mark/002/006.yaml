  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες τῶν γραμματέων ἐκεῖ καθήμενοι καὶ διαλογιζόμενοι ἐν ταῖς καρδίαις αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: ml
  text: 'എന്നാൽ ശാസ്ത്രിമാരിൽ ചിലർ അവിടെ ഇരുന്നുകൊണ്ട് തങ്ങളുടെ ഹൃദയങ്ങളിൽ[a] ആലോചിക്കുകയായിരുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തങ്ങളുടെ ഉള്ളിൽ’ അല്ലെങ്കിൽ ‘തങ്ങളുടെ മനസ്സിൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥമായി ‘തങ്ങളുടെ ഹൃദയങ്ങളിൽ’ എന്നാണ്; ഉള്ളിലെ ചിന്തയെ സൂചിപ്പിക്കുന്ന ഒരു ബൈബിൾപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: എന്നാൽ ... ആയിരുന്നു
  rationale: δέ ഇവിടെ മറ്റൊരു കൂട്ടത്തിന്റെ ഉള്ളിലെ പ്രതികരണത്തിലേക്കുള്ള മൃദുവായ വിവരണപരമായ തിരിവ് സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ സ്വാഭാവികമായി ആ വ്യത്യാസം പ്രകടമാക്കുന്നു.
- source_word: τινες τῶν γραμματέων
  choice: ശാസ്ത്രിമാരിൽ ചിലർ
  rationale: τινες എന്ന പദത്തോടുകൂടിയ ഭാഗിക ഷഷ്ഠീവിഭക്തി ആ കൂട്ടത്തിലെ ചിലരെ മാത്രമാണ് സൂചിപ്പിക്കുന്നത്. സുവിശേഷസന്ദർഭത്തിൽ γραμματεῖς എന്നതിന് ‘ശാസ്ത്രിമാർ’ എന്നത് പരിചിതവും യോജിച്ചതുമായ പദമാണ്.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: സ്ഥലത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ പരിഭാഷ.
- source_word: καθήμενοι
  choice: ഇരുന്നുകൊണ്ട്
  rationale: അവരുടെ ഇരിപ്പുനിലയും അതോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന ഉള്ളിലെ ആലോചനയും പങ്കാളിത്തരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: διαλογιζόμενοι
  choice: ആലോചിക്കുകയായിരുന്നു
  rationale: ഇവിടെ പദം ശബ്ദമായി പറയാത്ത ഉള്ളിലെ വിചാരമോ നിരൂപണമോ സൂചിപ്പിക്കുന്നു. ‘ആലോചിക്കുകയായിരുന്നു’ അതിന്റെ തുടരുന്ന സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: തങ്ങളുടെ ഹൃദയങ്ങളിൽ
  rationale: ഉള്ളിലെ ചിന്തയുടെ സ്ഥാനമായി ‘ഹൃദയം’ പറയുന്ന ബൈബിൾപ്രയോഗം സംരക്ഷിക്കുന്നു; അതിനെ നേരിട്ട് ‘മനസ്സിൽ’ എന്നു മാറ്റി ആശയലോകം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: καρδίαις എന്ന നരവംശശാസ്ത്രപരമായ ബൈബിൾപ്രയോഗം
  choice: തങ്ങളുടെ ഹൃദയങ്ങളിൽ
  alternative: തങ്ങളുടെ ഉള്ളിൽ / തങ്ങളുടെ മനസ്സിൽ
  rationale: മൂലപാഠത്തിൽ ഹൃദയം വികാരത്തിന്റെ മാത്രം സ്ഥാനമല്ല, ഉള്ളിലെ ചിന്തയുടെയും നിരൂപണത്തിന്റെയും കേന്ദ്രവുമാണ്. ‘ഹൃദയങ്ങളിൽ’ എന്നത് നിലനിർത്തുന്നത് ആ ബൈബിൾ ആശയലോകത്തെ സംരക്ഷിക്കുകയും ആധുനികമായ മനസ്സ്–ഹൃദയം വേർതിരിവ് പാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘ശാസ്ത്രിമാർ,’ ‘ഹൃദയങ്ങളിൽ’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിക്കൊണ്ട് വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
