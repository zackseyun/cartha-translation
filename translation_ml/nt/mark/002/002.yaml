source:
  edition: SBLGNT
  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: ml
  text: അനേകർ ഒരുമിച്ചുകൂടി; അങ്ങനെ വാതിലിനരികിൽപോലും ഇനി ഇടമില്ലായിരുന്നു. അവൻ അവരോടു വചനം[a] പറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സന്ദേശം.’ ഗ്രീക്കിൽ, ‘വചനം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: അനേകർ അവിടെ ഒരുമിച്ചുകൂടി
  rationale: ക്രിയയുടെ സമാഹരണാർഥവും συν- ഘടകത്തിന്റെ ഒരുമിച്ചുകൂടൽഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു. ഗ്രീക്കിലെ കർമണിപ്രയോഗം മലയാളത്തിൽ അക്ഷരാർഥമായി നിലനിർത്തുന്നത് കൃത്രിമമാകുന്നതിനാൽ സ്വാഭാവികമായ അകർമക രൂപം സ്വീകരിച്ചു; ‘അവിടെ’ സന്ദർഭത്തിൽ സൂചിതമായ കൂടിച്ചേരൽസ്ഥലം വ്യക്തമാക്കുന്നു.
- source_word: ὥστε μηκέτι χωρεῖν
  choice: അതിനാൽ ... ഇടമില്ലാതായി
  rationale: ὥστε സൂചിപ്പിക്കുന്ന ഫലബന്ധവും μηκέτι χωρεῖν എന്നതിലെ സ്ഥലം തീർന്നുപോയെന്ന ആശയവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: വാതിലിനരികിൽപോലും
  rationale: വാതിലിനോടു ചേർന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സംക്ഷിപ്തമായും കൃത്യമായും അവതരിപ്പിക്കുന്നു.
- source_word: ἐλάλει αὐτοῖς
  choice: അവരോടു ... സംസാരിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപർഫെക്റ്റിന്റെ തുടർച്ചാഭാവം ‘സംസാരിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; ‘പ്രസംഗിച്ചു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുന്നു.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: ഗ്രീക്കിലെ λόγος എന്ന പദത്തിന്റെ രൂപപരമായ സുതാര്യത നിലനിർത്തുകയും ഇവിടെ ഉദ്ദേശിക്കുന്നത് അറിയിക്കപ്പെട്ട സന്ദേശമാണെന്ന സാധ്യത തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ദൈവത്തിന്റെ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശു സംസാരിച്ച τὸν λόγον എന്നതിന്റെ അർഥം
  choice: വചനം
  alternative: സന്ദേശം; ദൈവവചനം
  rationale: ‘വചനം’ ഗ്രീക്ക് പദപ്രയോഗത്തോട് അടുത്തുനിൽക്കുകയും ‘സന്ദേശം’ എന്ന സന്ദർഭാർഥം വായനക്കാർക്ക് ഗ്രഹിക്കാനാവുന്നവിധം നിലനിർത്തുകയും ചെയ്യുന്നു. ‘ദൈവവചനം’ എന്നു നൽകിയാൽ ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ഘടകം ചേർക്കപ്പെടും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്നു ചെറുവാക്യങ്ങളാക്കി; ഫലബന്ധവും തുടരുന്ന പ്രവൃത്തിഭാവവും സംരക്ഷിച്ചു.
