revisions:
- from: അനേകർ അവിടെ ഒരുമിച്ചുകൂടി. അതിനാൽ വാതിലിനരികിൽപോലും ഇടമില്ലാതായി. യേശു അവരോടു വചനം[a] സംസാരിച്ചുകൊണ്ടിരുന്നു.
  to: അനേകർ ഒരുമിച്ചുകൂടി; അങ്ങനെ വാതിലിനരികിൽപോലും ഇനി ഇടമില്ലായിരുന്നു. അവൻ അവരോടു വചനം[a] പറഞ്ഞുകൊണ്ടിരുന്നു.
  rationale: The revision removes details not expressed in the verse, renders μηκέτι explicitly as «ഇനി», retains the result relationship introduced by ὥστε, and uses an idiomatic Malayalam verb phrase for the ongoing act of speaking τὸν λόγον. The footnote preserves the viable contextual alternative while keeping «വചനം» in the main text.
