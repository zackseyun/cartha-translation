  terminology: “കഫർന്നഹൂം,” “വീണ്ടും,” and “വീട്ടിലുണ്ട്” are suitable. The note should not call “ഒരു വീട്ടിൽ” strictly literal, since the Greek expression has no indefinite article; it should identify “വീട്ടിൽ” as the literal spatial sense and explain that ownership is not specified.
