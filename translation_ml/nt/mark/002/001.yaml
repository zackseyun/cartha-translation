  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: ml
  text: കുറെ ദിവസങ്ങൾക്കുശേഷം യേശു വീണ്ടും കഫർന്നഹൂമിൽ പ്രവേശിച്ചപ്പോൾ, അവൻ വീട്ടിലുണ്ടെന്ന്[a] അറിയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “വീട്ടിൽ” അഥവാ “ഒരു വീട്ടിൽ.” ഇത് യേശുവിന്റെ സ്വന്തം വീടാണെന്ന് ഗ്രീക്ക് പാഠം വ്യക്തമാക്കുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: പ്രവേശിച്ചപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle-നെ സ്വാഭാവികമായ മലയാളത്തിൽ കാലസംബന്ധിയായ ഉപവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മടങ്ങിവരവിനെയോ ആവർത്തനത്തെയോ സൂചിപ്പിക്കുന്ന സാധാരണ ക്രിയാവിശേഷണാർഥം നിലനിർത്തുന്നു.
- source_word: Καφαρναούμ
  choice: കഫർന്നഹൂം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം സ്വീകരിക്കുന്നു.
- source_word: δι’ ἡμερῶν
  choice: കുറെ ദിവസങ്ങൾക്കുശേഷം
  rationale: എത്ര ദിവസമെന്ന് നിർണ്ണയിക്കാതെ ഒരു ഇടവേള കഴിഞ്ഞുവെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἠκούσθη
  choice: വാർത്ത പരന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കേൾക്കപ്പെട്ടു’ എന്ന കൃത്രിമപ്രയോഗത്തിനു പകരം, അനിശ്ചിത കർത്താവുള്ള വാർത്താവ്യാപനഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν οἴκῳ
  choice: വീട്ടിലുണ്ടെന്ന്
  rationale: ‘വീട്ടിൽ/ഒരു വീട്ടിനുള്ളിൽ’ എന്നും ‘സ്വന്തം താമസസ്ഥലത്ത്’ എന്നും ഗ്രഹിക്കാവുന്ന പ്രയോഗം; പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ പൊതുരൂപം നൽകി സാധ്യതകൾ അടച്ചുപൂട്ടുന്നില്ല.
- source_word: ἐστίν
  choice: ഉണ്ടെന്ന്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല indirect discourse മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν οἴκῳ എന്നത് യേശുവിന്റെ സ്വന്തം വീട് എന്നു നിർണ്ണയിക്കണമോ, ഒരു വീട്ടിൽ എന്നു പൊതുവായി വായിക്കണമോ
  choice: വീട്ടിലുണ്ടെന്ന്
  alternative: ഒരു വീട്ടിലുണ്ടെന്ന് / സ്വന്തം വീട്ടിലുണ്ടെന്ന്
  rationale: മൂലപദം ഉടമസ്ഥത വ്യക്തമാക്കുന്നില്ല. അതിനാൽ യേശുവിന് അവിടെ സ്വന്തം വീടുണ്ടായിരുന്നുവെന്ന് പാഠത്തിൽ ചേർക്കാതെ, യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാർത്ത അറിയപ്പെടുന്നതിനെ ‘വാർത്ത പരന്നു’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിച്ചു; മൂലത്തിലെ സ്ഥലസംബന്ധമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
