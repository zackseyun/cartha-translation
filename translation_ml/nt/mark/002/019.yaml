revisions:
- from: 'യേശു അവരോടു പറഞ്ഞു: “മണവാളൻ തങ്ങളോടുകൂടെ ഉള്ളപ്പോൾ വിവാഹാഘോഷത്തിൽ പങ്കെടുക്കുന്നവർക്ക്[a] ഉപവസിക്കാൻ കഴിയുമോ? മണവാളൻ തങ്ങളോടുകൂടെ ഉള്ളിടത്തോളം അവർക്ക് ഉപവസിക്കാൻ കഴിയുകയില്ല.”'
  to: 'യേശു അവരോടു പറഞ്ഞു: “മണവാളൻ അവരോടുകൂടെ ഉള്ളപ്പോൾ വിവാഹാഘോഷത്തിൽ പങ്കെടുക്കുന്നവർക്ക് ഉപവസിക്കാൻ കഴിയുകയില്ലല്ലോ? അവർക്കു മണവാളൻ കൂടെയുള്ളിടത്തോളം അവർക്ക് ഉപവസിക്കാൻ കഴിയുകയില്ല.”'
