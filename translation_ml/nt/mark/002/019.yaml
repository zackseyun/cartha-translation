id: MRK.2.19
reference: Mark 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “മണവാളൻ അവരോടുകൂടെ ഉള്ളപ്പോൾ വിവാഹാഘോഷത്തിൽ പങ്കെടുക്കുന്നവർക്ക് ഉപവസിക്കാൻ കഴിയുകയില്ലല്ലോ? അവർക്കു മണവാളൻ കൂടെയുള്ളിടത്തോളം അവർക്ക് ഉപവസിക്കാൻ കഴിയുകയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: ഉപവസിക്കാൻ കഴിയുമോ?
  rationale: μήയോടുകൂടിയ ചോദ്യം നിഷേധാത്മകമായ ഉത്തരം പ്രതീക്ഷിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ ആലങ്കാരികചോദ്യരൂപം ഈ സൂചന വ്യക്തമാക്കുന്നു.
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: വിവാഹാഘോഷത്തിൽ പങ്കെടുക്കുന്നവർ
  rationale: അക്ഷരാർഥത്തിൽ ‘വിവാഹമുറിയുടെ മക്കൾ’ എന്ന സെമിറ്റിക് സ്വഭാവമുള്ള പ്രയോഗമാണിത്; വിവാഹാഘോഷവുമായി ബന്ധപ്പെട്ടവരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പങ്കെടുക്കുന്നവർ’ അതിനെ അനാവശ്യമായി വരന്റെ അടുത്ത കൂട്ടുകാരിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἐν ᾧ ... ἐστιν
  choice: ഉള്ളപ്പോൾ
  rationale: ഇവിടെ ഘടനയ്ക്ക് സ്ഥലപരമായതിലധികം കാലപരമായ അർഥമാണ്; ‘ഉള്ളപ്പോൾ’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: മണവാളൻ
  rationale: വിവാഹരൂപകവും അതിന്റെ തിരുവെഴുത്തുപരമായ അനുരണനവും നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ മനസ്സിലാകുന്ന പദം.
- source_word: μετ’ αὐτῶν
  choice: തങ്ങളോടുകൂടെ
  rationale: μετά + genitive ഇവിടെ സഹവാസം/കൂടെ ഉണ്ടായിരിക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: ὅσον χρόνον
  choice: ഉള്ളിടത്തോളം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: മണവാളൻ തങ്ങളോടുകൂടെ ഉള്ളിടത്തോളം
  rationale: ഗ്രീക്കിൽ ‘അവർക്കു മണവാളനെ കൂടെയുണ്ട്’ എന്ന ഘടനയാണെങ്കിലും, മലയാളത്തിൽ ‘തങ്ങളോടുകൂടെ ഉള്ളിടത്തോളം’ സ്വാഭാവികവും അതേ സാന്നിധ്യ-കാല ആശയം വ്യക്തമായി വഹിക്കുന്നതുമാണ്.
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: യേശു അവരോടു പറഞ്ഞു
  rationale: കഥനപരമായ ആമുഖത്തിന്റെ നേരിട്ടും മാന്യവുമായ മലയാളരൂപം; വാക്യത്തിന്റെ തുടക്കത്തിലെ καί മലയാളത്തിൽ നിർബന്ധമായി പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല.
theological_decisions:
- issue: യേശുവിനെ മണവാളനായി സൂചിപ്പിക്കുന്ന രൂപകം
  choice: രൂപകം വിശദീകരിച്ചു തീർക്കാതെ ‘മണവാളൻ’ എന്നു നിലനിർത്തി.
  alternative: മിശിഹായെയോ ദൈവിക മണവാളനെയോ വ്യക്തമായി പറഞ്ഞ് വ്യാഖ്യാനാത്മകമായി വിവർത്തനം ചെയ്യുക.
  rationale: വാക്യം യേശുവിന്റെ സ്വയംസൂചനയിൽ മണവാളന്റെ രൂപകം ഉപയോഗിക്കുന്നുവെങ്കിലും അതിന്റെ ദൈവശാസ്ത്രപരമായ അർഥം തുറന്നുപറയുന്നില്ല. അതിനാൽ വിവർത്തനം രൂപകവും അതിലെ വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘മണവാളൻ’, ‘ഉപവസിക്കുക’ എന്നിവ തിരുവെഴുത്തിന്റെ രൂപകാത്മക-മതപരമായ ഭാവം നിലനിർത്തുന്നു; അപാരദർശകമായ മൂലഭാഷാ പ്രയോഗം പ്രധാനവാചകത്തിൽ അർഥസമ്പന്നമായി നൽകി, അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
