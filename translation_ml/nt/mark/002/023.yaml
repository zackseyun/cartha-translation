source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: ml
  text: ഒരു ശബ്ബത്തുനാളിൽ അവൻ ധാന്യവയലുകളിലൂടെ[a] കടന്നുപോകുകയായിരുന്നു. അവന്റെ ശിഷ്യന്മാർ ധാന്യക്കതിരുകൾ[c] പറിച്ചുകൊണ്ട് മുന്നോട്ടു നീങ്ങിത്തുടങ്ങി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “വിളഞ്ഞുനിൽക്കുന്ന ധാന്യത്തിനിടയിലൂടെ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “വഴി ഉണ്ടാക്കാൻ തുടങ്ങി”; ഇവിടെ കതിരുകൾ പറിച്ചുകൊണ്ട് വയലിലൂടെ നീങ്ങിപ്പോയി എന്ന അർഥമുള്ള ശൈലീപ്രയോഗം.
    reason: lexical_alternative
  - marker: c
    text: മൂലപദം ധാന്യത്തിന്റെ കതിരിനെയോ കതിരിന്റെ തലയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐγένετο
  choice: ഒരു ശബ്ബത്തുനാളിൽ … കടന്നുപോകുകയായിരുന്നു
  rationale: സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് ആഖ്യാനപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി; ‘അങ്ങനെ സംഭവിച്ചു’ എന്ന കൃത്രിമമായ പദാനുപദരൂപം ഒഴിവാക്കി.
- source_word: ἐν τοῖς σάββασιν
  choice: ഒരു ശബ്ബത്തുനാളിൽ
  rationale: ഗ്രീക്കിൽ ബഹുവചനരൂപമാണെങ്കിലും, കൊയ്നേ പ്രയോഗത്തിൽ ഇവിടെ ഒരു ശബ്ബത്തുദിവസത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: παραπορεύεσθαι
  choice: കടന്നുപോകുകയായിരുന്നു
  rationale: തുടർന്നുകൊണ്ടിരുന്ന സഞ്ചാരത്തെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: διὰ τῶν σπορίμων
  choice: ധാന്യവയലുകളിലൂടെ
  rationale: വിതച്ച വയലുകളെയോ വിളഞ്ഞുനിൽക്കുന്ന ധാന്യത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം.
- source_word: ὁδὸν ποιεῖν
  choice: മുന്നോട്ടു നീങ്ങിത്തുടങ്ങി
  rationale: അക്ഷരാർഥം ‘വഴി ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ വയലിലൂടെ നീങ്ങിപ്പോകുക എന്ന ശൈലീപ്രയോഗമാണ്; ശിഷ്യന്മാർ പാത നിർമിച്ചു എന്ന അനാവശ്യ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τίλλοντες
  choice: പറിച്ചുകൊണ്ട്
  rationale: കതിരുകൾ കൈകൊണ്ട് പറിച്ചെടുക്കുന്ന പ്രവൃത്തിയെ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοὺς στάχυας
  choice: ധാന്യക്കതിരുകൾ
  rationale: ധാന്യത്തിന്റെ കതിരുകളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: αὐτὸν / αὐτοῦ
  choice: അവൻ / അവന്റെ
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിക്കപ്പെട്ട യേശുവിനെ സൂചിപ്പിക്കുന്ന സർവനാമങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി.
theological_decisions:
- issue: ശബ്ബത്ത് സംബന്ധിച്ച ഏകവചന-ബഹുവചന പ്രയോഗം
  choice: ഒരു ശബ്ബത്തുനാളിൽ
  alternative: ശബ്ബത്തുനാളുകളിൽ
  rationale: ἐν τοῖς σάββασιν രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ഇവിടെ അത് ഒരു ശബ്ബത്തുദിവസത്തെ സൂചിപ്പിക്കുന്ന കൊയ്നേ ശൈലിയാണ്; ഇത് ഭാഷാപരമായ തീരുമാനമാണ്, ഉപദേശപരമായ വ്യാഖ്യാനമല്ല.
- issue: ὁδὸν ποιεῖν എന്ന പ്രയോഗവും ശബ്ബത്ത് വിവാദത്തിന്റെ സ്വഭാവവും
  choice: മുന്നോട്ടു നീങ്ങിത്തുടങ്ങി
  alternative: വഴി ഉണ്ടാക്കിത്തുടങ്ങി
  rationale: ശിഷ്യന്മാർ പാത നിർമിക്കുകയായിരുന്നു എന്നു വാചകം അതിശയോക്തിയായി സൂചിപ്പിക്കാതിരിക്കാൻ ശൈലീപ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വീകരിച്ചു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പദാനുപദ കൃത്രിമത്വം ഒഴിവാക്കിയെങ്കിലും ശബ്ബത്ത്, വയലിലൂടെയുള്ള സഞ്ചാരം, കതിരുകൾ പറിക്കൽ എന്നീ കഥാപരവും വിവാദത്തിന് അടിത്തറയിടുന്നതുമായ ഘടകങ്ങൾ വ്യക്തമായി നിലനിർത്തി.
