source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: ml
  text: 'ഉടനെ യേശു, അവർ തങ്ങളുടെ ഉള്ളിൽ ഇങ്ങനെ ചിന്തിച്ചുകൊണ്ടിരിക്കുന്നുവെന്ന് തന്റെ ആത്മാവിൽ ഗ്രഹിച്ച്[a], അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ ഹൃദയങ്ങളിൽ ഈ കാര്യങ്ങൾ ചിന്തിക്കുന്നത് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ ആത്മാവിൽ അറിഞ്ഞ്” എന്നും “തന്റെ ഉള്ളിൽ തിരിച്ചറിഞ്ഞ്” എന്നും പരിഭാഷപ്പെടുത്താം. യേശു ഇത് ഗ്രഹിച്ച രീതി ഗ്രീക്ക് പാഠം വ്യക്തമായി നിർവചിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ വിവരണത്തിലെ വേഗവും സജീവതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπιγνοὺς
  choice: ഗ്രഹിച്ച്
  rationale: വ്യക്തമായി മനസ്സിലാക്കുക, തിരിച്ചറിയുക, ബോധ്യപ്പെടുക എന്നീ അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്നു; അറിവിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: തന്റെ ആത്മാവിൽ
  rationale: ദത്തിവിന്റെ വ്യാപ്തി/കരണം എന്നീ സാധ്യതകളിൽ ഒന്നിനെ തീർച്ചപ്പെടുത്താതെ ഗ്രീക്ക് പ്രയോഗം അടുത്തായി നിലനിർത്തുന്നു.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: അവരുടെ ചിന്തയുടെ രീതിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: διαλογίζονται
  choice: ചിന്തിച്ചുകൊണ്ടിരിക്കുന്നുവെന്ന്
  rationale: ഇവിടെ വാക്കാലുള്ള തർക്കമല്ല, ആന്തരികമായ ആലോചനയാണ് സന്ദർഭം; അതിനാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: ἐν ἑαυτοῖς
  choice: ഉള്ളിൽ
  rationale: അവർ പരസ്പരം സംസാരിച്ചതല്ല, തങ്ങളുടെ ഉള്ളിൽ ആലോചിച്ചതാണെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: ഈ കാര്യങ്ങൾ ചിന്തിക്കുന്നത് എന്തിന്?
  rationale: ചോദ്യത്തിലെ τί സന്ദർഭത്തിൽ കാരണമന്വേഷിക്കുന്നതിനാൽ ‘എന്തിന്’ സ്വാഭാവികമാണ്; ταῦτα ‘ഈ കാര്യങ്ങൾ’ എന്നു വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളിൽ
  rationale: ചിന്തയും ഉദ്ദേശ്യവും ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗമായ ‘ഹൃദയം’ നിലനിർത്തുകയും ഗ്രീക്കിലെ ബഹുവചനം പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘തന്റെ ആത്മാവിൽ ഗ്രഹിച്ച്’ എന്നതിൽ യേശുവിന്റെ അറിവിന്റെ സ്വഭാവം
  choice: യേശു അവരുടെ ആന്തരികചിന്ത ഗ്രഹിച്ചു എന്ന് പറയുകയും, അതിന്റെ രീതി നിർവചിക്കാതിരിക്കുകയും ചെയ്തു.
  alternative: ഇത് ദൈവിക സർവജ്ഞതയുടെ നേരിട്ടുള്ള പ്രസ്താവനയെന്നോ, കേവലം മാനുഷികമായ സൂക്ഷ്മബോധമെന്നോ വ്യാഖ്യാനിക്കാം.
  rationale: അവരുടെ ഉള്ളിലെ ചിന്ത യേശു അറിഞ്ഞുവെന്ന് വാക്യം വ്യക്തമാക്കുന്നു. എന്നാൽ τῷ πνεύματι αὐτοῦ എന്ന പ്രയോഗം ആ അറിവിന്റെ കൃത്യമായ രീതി നിർബന്ധമായി നിർവചിക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ആത്മാവിൽ,’ ‘ഹൃദയങ്ങളിൽ’ എന്നീ മൂലപാഠസന്നിഹിതമായ പദങ്ങൾ നിലനിർത്തി; എന്നാൽ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
