source:
  edition: SBLGNT
  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: ml
  text: അവൻ അതുവഴി കടന്നുപോകുമ്പോൾ, അൽഫായിയുടെ മകനായ ലേവിയെ ചുങ്കപ്പിരിവുകേന്ദ്രത്തിൽ[a] ഇരിക്കുന്നതായി കണ്ടു. അവൻ ലേവിയോട്, “എന്നെ അനുഗമിക്കുക” എന്നു പറയുന്നു. ലേവി എഴുന്നേറ്റ് അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വഴിച്ചുങ്കച്ചാവടിയിൽ.” ഗ്രീക്ക് പദം നികുതിയോ വഴിച്ചുങ്കമോ കസ്റ്റംസ് തീരുവയോ പിരിച്ചിരുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: അതുവഴി കടന്നുപോകുമ്പോൾ
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടർന്നുകൊണ്ടിരിക്കുന്ന പശ്ചാത്തലപ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἶδεν
  choice: കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാല അർഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘ശ്രദ്ധിച്ചു’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: Λευὶν
  choice: ലേവി
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണരീതിയിൽ നൽകുന്നു.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: അൽഫായിയുടെ മകനായ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക ഷഷ്ഠിവിഭക്തി ഇവിടെ പിതൃബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: καθήμενον
  choice: ഇരിക്കുന്നതു
  rationale: യേശു കണ്ട സമയത്ത് ലേവിയുടെ നിലയെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തം സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ τὸ τελώνιον
  choice: ചുങ്കപ്പിരിവുസ്ഥലത്ത്
  rationale: നികുതിയോ ചുങ്കമോ പിരിച്ചിരുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന τελώνιον എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്ന, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പ്രയോഗം.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി വിവരണത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: Ἀκολούθει μοι
  choice: എന്നെ അനുഗമിക്കുക
  rationale: ആജ്ഞയുടെ നേരിട്ടുള്ള രൂപവും ശിഷ്യത്വത്തിലേക്കുള്ള വിളിയുടെ തുടർച്ചാസൂചനയും അധിക പദങ്ങൾ ചേർക്കാതെ നൽകുന്നു.
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റ്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തനക്രമം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἠκολούθησεν αὐτῷ
  choice: അവനെ അനുഗമിച്ചു
  rationale: യേശുവിന്റെ ആജ്ഞയിലെയും ലേവിയുടെ പ്രതികരണത്തിലെയും ഒരേ ക്രിയാസംബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: മർക്കോസിന്റെ വിവരണത്തിലെ ചരിത്രവർത്തമാനകാലം
  choice: λέγει എന്നത് ‘പറയുന്നു’ എന്നു വർത്തമാനകാലത്തിൽ നിലനിർത്തുന്നു.
  alternative: ചുറ്റുമുള്ള ഭൂതകാലക്രിയകളോട് ഒത്താക്കി ‘പറഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠത്തിലെ കാലമാറ്റവും അതിലൂടെ ലഭിക്കുന്ന വിവരണസജീവതയും സംരക്ഷിക്കുന്നു; പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ചുങ്കപ്പിരിവുസ്ഥലം’ ചരിത്രസന്ദർഭം വ്യക്തമാക്കുമ്പോഴും ഗ്രീക്ക് പദത്തെ ഒരു പ്രത്യേകതരം നികുതിയിലേക്കു മാത്രം ചുരുക്കുന്നില്ല. ആവർത്തിച്ചുള്ള ‘അവൻ’ മൂലമുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ രണ്ടാം വാക്യത്തിൽ ‘ലേവിയോട്’ എന്നും അവസാന വാക്യത്തിൽ ‘ലേവി’ എന്നും പേര് ആവർത്തിച്ചു.
