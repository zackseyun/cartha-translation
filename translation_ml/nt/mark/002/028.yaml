id: MRK.2.28
reference: Mark 2:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: ml
  text: അതുകൊണ്ട് മനുഷ്യപുത്രൻ ശബ്ബത്തിനുപോലും കർത്താവാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതുകൊണ്ട് മനുഷ്യപുത്രൻ ശബ്ബത്തിന്റെയും കർത്താവാണ്.” ഗ്രീക്കിലെ സംയോജകപദം ‘-ഉം/കൂടി’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ അവന്റെ അധികാരത്തിന്റെ വ്യാപ്തിക്ക് ഊന്നൽ നൽകുന്ന ‘പോലും’ എന്ന അർത്ഥമാകാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനമാണ് ഈ സംയോജകം അവതരിപ്പിക്കുന്നത്; ആ യുക്തിബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ഇവിടെ അധികാരവും ആധിപത്യവും സൂചിപ്പിക്കുന്ന ശക്തമായ പദമാണ്; മനുഷ്യപുത്രനെക്കുറിച്ചുള്ള ക്രിസ്തുശാസ്ത്രപരമായ പ്രസ്താവനയുടെ ഭാരം നിലനിർത്തുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിലെ യേശുവിന്റെ സ്ഥാപിതമായ സ്വയംവിശേഷണം നിലനിർത്തുകയും അതിന്റെ ദാനീയേൽസംബന്ധവും ക്രിസ്തുശാസ്ത്രപരവുമായ അനുരണനങ്ങൾ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ
  choice: പോലും
  rationale: ഇവിടെ καί-യ്ക്ക് ആരോഹകമായ ഊന്നൽ ഉണ്ടാകാം; മനുഷ്യപുത്രന്റെ കർത്തൃത്വം ശബ്ബത്തേക്കും വ്യാപിക്കുന്നു എന്ന അതിശയകരമായ പരിധി ‘പോലും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σαββάτου
  choice: ശബ്ബത്തിന്റെ
  rationale: വിവാദത്തിന്റെ പശ്ചാത്തലമായ ശബ്ബത്തിനെ സൂചിപ്പിക്കുന്ന ഏകവചന ഷഷ്ഠീവിഭക്തിയുടെ നേരായ മലയാളരൂപമാണ്.
theological_decisions:
- issue: ശബ്ബത്തിന്മേലുള്ള മനുഷ്യപുത്രന്റെ അധികാരത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി
  choice: ‘ശബ്ബത്തിനുപോലും കർത്താവാകുന്നു’ എന്ന് ശക്തമായി നിലനിർത്തി.
  alternative: ‘ശബ്ബത്തിനെ സംബന്ധിച്ച് അധികാരമുണ്ട്’ എന്ന മൃദുവായ പരാവർത്തനം.
  rationale: κύριος പരിമിതമായ അനുമതിയെക്കാൾ കർത്തൃത്വമാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; മൂലപാഠത്തിനപ്പുറം വിശദീകരണം ചേർക്കാതെ അവകാശവാദത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
- issue: ‘മനുഷ്യപുത്രൻ’ എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: യേശുവിന്റെ ശീർഷകമായ ‘മനുഷ്യപുത്രൻ’ നിലനിർത്തി.
  alternative: ‘മനുഷ്യൻ’ അല്ലെങ്കിൽ ‘മാനുഷികനായവൻ’ എന്ന പൊതുവായ വ്യാഖ്യാനം.
  rationale: മർക്കോസിൽ ഇത് യേശുവിനെ സ്വയം സൂചിപ്പിക്കുന്ന ശീർഷകമായി പ്രവർത്തിക്കുകയും ദാനീയേൽസംബന്ധമായ സാധ്യതയുള്ള അനുരണനം വഹിക്കുകയും ചെയ്യുന്നു; ആ അർത്ഥസംഘർഷം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മനുഷ്യപുത്രൻ,’ ‘ശബ്ബത്ത്,’ ‘കർത്താവ്’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ‘പോലും’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച് καί-യുടെ സാധ്യതയുള്ള ആരോഹക ഊന്നൽ പ്രകടിപ്പിക്കുകയും പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
