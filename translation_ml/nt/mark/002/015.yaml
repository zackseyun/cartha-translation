- from: പിന്നെ, അവൻ തന്റെ വീട്ടിൽ[a] ഭക്ഷണത്തിനിരിക്കുമ്പോൾ, അനേകം ചുങ്കപ്പിരിവുകാരും പാപികളും യേശുവിനോടും അവന്റെ ശിഷ്യന്മാരോടുംകൂടെ ഭക്ഷണത്തിനിരുന്നു. അവർ അനേകരായിരുന്നു; അവർ അവനെ അനുഗമിച്ചുപോന്നിരുന്നു.
  to: പിന്നെ, അവൻ അവന്റെ വീട്ടിൽ[a] ഭക്ഷണത്തിനിരുന്നപ്പോൾ, അനേകം ചുങ്കപ്പിരിവുകാരും പാപികളും യേശുവിനോടും അവന്റെ ശിഷ്യന്മാരോടുംകൂടെ ഭക്ഷണത്തിനിരുന്നു. കാരണം, അവർ അനേകരായിരുന്നു; അവർ അവനെ അനുഗമിച്ചുപോന്നിരുന്നു.
  rationale: ‘തന്റെ വീട്ടിൽ’ എന്നത് ‘അവന്റെ വീട്ടിൽ’ എന്ന് മാറ്റി ഗ്രീക്കിലെ അവ്യക്തമായ ഉടമസ്ഥസർവനാമം നിലനിർത്തി. γάρ-ന്റെ വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘കാരണം’ ചേർത്തു. മറ്റു ഭാഗങ്ങൾ മൂലപാഠത്തിനും ആധുനിക നിലവാരമലയാള പ്രയോഗത്തിനും യോജിച്ചതാണ്.
