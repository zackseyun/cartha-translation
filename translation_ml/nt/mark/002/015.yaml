id: MRK.2.15
reference: Mark 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: ml
  text: പിന്നെ, അവൻ അവന്റെ വീട്ടിൽ[a] ഭക്ഷണത്തിനിരുന്നപ്പോൾ, അനേകം ചുങ്കപ്പിരിവുകാരും പാപികളും യേശുവിനോടും അവന്റെ ശിഷ്യന്മാരോടുംകൂടെ ഭക്ഷണത്തിനിരുന്നു. കാരണം, അവർ അനേകരായിരുന്നു; അവർ അവനെ അനുഗമിച്ചുപോന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ലേവിയുടെ വീട്ടിൽ’; ചിലർ ‘യേശുവിന്റെ വീട്ടിൽ’ എന്നു മനസ്സിലാക്കുന്നു. ഗ്രീക്കിൽ ‘അവന്റെ വീട്ടിൽ’ എന്നു മാത്രമേ ഉള്ളൂ.
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: പിന്നെ
  rationale: മർക്കോസിന്റെ ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലം സ്വാഭാവികമായ മലയാള കഥനക്രമത്തിൽ മുന്നോട്ടുള്ള നീക്കമായി അവതരിപ്പിക്കുന്നു; ‘സംഭവിച്ചു’ എന്ന പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
- source_word: κατακεῖσθαι
  choice: ഭക്ഷണത്തിനിരിക്കുമ്പോൾ
  rationale: പുരാതന വിരുന്നിലെ ചാരിക്കിടന്നുള്ള ഭക്ഷണഭാവമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വെറും ‘കിടക്കുക’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി ഭക്ഷണസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: തന്റെ വീട്ടിൽ
  rationale: ഗ്രീക്കിലെ ഏകവചന സർവനാമത്തിന്റെ ഉടമസ്ഥത നിലനിർത്തുന്നു; വീട് ലേവിയുടേതോ യേശുവിന്റേതോ എന്ന് മുഖ്യപാഠത്തിൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: τελῶναι
  choice: ചുങ്കപ്പിരിവുകാർ
  rationale: റോമൻ ഭരണക്രമത്തിലെ നികുതി/ചുങ്കം പിരിച്ചവരെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിലും പൊതുവായ ഉപയോഗത്തിലും വ്യക്തമായ പദം.
- source_word: ἁμαρτωλοὶ
  choice: പാപികൾ
  rationale: മൂലപാഠത്തിലെ നേരിട്ടുള്ള സാമൂഹിക-മതപരമായ വിശേഷണം വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: συνανέκειντο
  choice: യേശുവിനോടും അവന്റെ ശിഷ്യന്മാരോടുംകൂടെ ഭക്ഷണത്തിനിരുന്നു
  rationale: കൂടെ വിരുന്നിൽ പങ്കെടുത്തതും ഭക്ഷണസന്ദർഭവും വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ അസ്വാഭാവികമായ ശരീരഭാവവിവരണം ഒഴിവാക്കുന്നു.
- source_word: μαθηταῖς
  choice: ശിഷ്യന്മാർ
  rationale: പഠിതാക്കളും ഗുരുവിനെ അനുഗമിക്കുന്നവരുമെന്ന ബന്ധം സൂക്ഷിക്കുന്ന സ്ഥിരപ്രയോഗം.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: അവർ അനേകരായിരുന്നു
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം അർദ്ധവിരാമത്തിലൂടെ സ്വാഭാവികമായി ബന്ധിപ്പിച്ചുകൊണ്ട് സംഖ്യാബാഹുല്യം നിലനിർത്തുന്നു.
- source_word: ἠκολούθουν αὐτῷ
  choice: അവർ അവനെ അനുഗമിച്ചുപോന്നിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചയോ പതിവോ സൂചിപ്പിക്കുന്ന ഭാവം ‘-പോന്നിരുന്നു’ വഴി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവന്റെ വീട്’ (αὐτοῦ) ആരുടേത് എന്നത്
  choice: മുഖ്യപാഠത്തിൽ ‘തന്റെ വീട്ടിൽ’ എന്ന് അവ്യക്തത നിലനിർത്തി.
  alternative: ‘ലേവിയുടെ വീട്ടിൽ’ അല്ലെങ്കിൽ ‘യേശുവിന്റെ വീട്ടിൽ’ എന്ന് വ്യക്തമായി നിർണ്ണയിക്കുക.
  rationale: ഗ്രീക്ക് സർവനാമത്തിന്റെ സമീപസന്ദർഭത്തിലെ പൂർവപദം നിർവിവാദമല്ല. പൊതുവേ ലേവിയുടെ വീട് എന്നു മനസ്സിലാക്കപ്പെടുന്നുവെങ്കിലും യേശുവിന്റെ വീട് എന്നും ഗ്രഹിക്കാം; അതിനാൽ മൂലപാഠത്തിലെ യഥാർത്ഥ അവ്യക്തത പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാതന ഭക്ഷണരീതിയായ ചാരിക്കിടക്കൽ പദാനുപദമായി പറഞ്ഞ് ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതെ, ഭക്ഷണത്തിൽ ഇരിക്കുക എന്ന സാധാരണ മലയാളപ്രയോഗം ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനൊപ്പം ചേർത്തിരിക്കുന്നു.
