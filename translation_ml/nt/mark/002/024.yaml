    issue: ἔλεγον is rendered as “ചോദിച്ചുകൊണ്ടിരുന്നു.”
    rationale: Although the direct speech is phrased as a question, the Greek verb is λέγω (“say”), not a verb meaning “ask.” Rendering it as “പറയുകയായിരുന്നു” retains both the lexical sense and the imperfective aspect without adding interpretation.
  - severity: low
