source:
  edition: SBLGNT
  text: καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: ml
  text: 'പരീശന്മാർ അവനോടു പറയുകയായിരുന്നു: “നോക്കൂ, ശബ്ബത്തിൽ അനുവദനീയമല്ലാത്തത് അവർ ചെയ്യുന്നത് എന്തുകൊണ്ട്[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നോക്കൂ, ശബ്ബത്തിൽ അനുവദനീയമല്ലാത്ത എന്താണ് അവർ ചെയ്യുന്നത്?” ഗ്രീക്കിലെ τί എന്ന പദം ‘എന്ത്’ എന്നും വായിക്കാം; എന്നാൽ സന്ദർഭത്തിൽ ‘എന്തുകൊണ്ട്’ എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: പരീശന്മാർ...
  rationale: ആഖ്യാനബന്ധം മലയാളത്തിൽ വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ പ്രത്യേകമായി ‘പിന്നെ’ എന്ന കാലസൂചന ചേർത്തില്ല; ‘അപ്പോൾ’ എന്നും ചേർത്തില്ല, കാരണം ഗ്രീക്കിൽ അത്തരം വ്യക്തമായ കാലന്യൂനതയില്ല.
- source_word: οἱ Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: സംഘനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: ἔλεγον
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന/ആവർത്തിക്കുന്ന ഭാവം ‘-കൊണ്ടിരുന്നു’ സൂക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ പറയുന്നത് ഒരു ചോദ്യം ആയതിനാൽ ‘ചോദിച്ചു’ എന്ന ആശയം സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: ദാതൃവിഭക്തിയിലെ പരോക്ഷകർമം സ്വാഭാവിക മലയാളത്തിൽ ‘അവനോടു’ എന്നു നൽകി; പരാമർശം യേശുവിനെയാണ്.
- source_word: Ἴδε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞാരൂപം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τί
  choice: എന്തുകൊണ്ട്
  rationale: പരാതിയുടെ സന്ദർഭത്തിൽ τί ക്രിയാവിശേഷണപരമായി ‘എന്തുകൊണ്ട്’ എന്ന അർഥം നൽകുന്നതാണ് ഏറ്റവും സാധ്യതയുള്ളത്; ‘എന്ത്’ എന്ന ഔപചാരിക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ποιοῦσιν
  choice: അവർ ചെയ്യുന്നത്
  rationale: നേരിട്ടുള്ള ചോദ്യത്തിൽ നടക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τοῖς σάββασιν
  choice: ശബ്ബത്തിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം ഏകവചന ശബ്ബത്തുദിനത്തെ സൂചിപ്പിക്കുന്ന പതിവ് പ്രയോഗമാണ്; മലയാളത്തിൽ ഏകവചനം സ്വാഭാവികം.
- source_word: ὃ οὐκ ἔξεστιν
  choice: അനുവദനീയമല്ലാത്തത്
  rationale: നിയമപരവും മതപരവുമായ അനുമതിയുടെ ആശയം നിലനിർത്തുന്നു; ഇത് തിരുവെഴുത്തിലെ നിയമമാണോ പാരമ്പര്യവ്യാഖ്യാനമാണോ എന്ന് വിവർത്തനം മുൻകൂട്ടി തീരുമാനിക്കുന്നില്ല.
theological_decisions:
- issue: പരീശന്മാരുടെ എതിർപ്പിന്റെ നിയമപരമായ അടിസ്ഥാനം
  choice: ‘അനുവദനീയമല്ലാത്തത്’ എന്നു പരിഭാഷപ്പെടുത്തി, വിലക്കിന്റെ ഉറവിടം വ്യക്തമാക്കാതെ വിട്ടു.
  alternative: ‘നിയമവിരുദ്ധമായത്’ / ‘ന്യായപ്രമാണത്തിന് വിരുദ്ധമായത്’
  rationale: οὐκ ἔξεστιν അനുമതിയില്ലായ്മയെയാണ് പറയുന്നത്; ഇത് മോശെയുടെ ന്യായപ്രമാണത്തെയോ പരീശപാരമ്പര്യത്തെയോ മറ്റൊരു ഹലാഖിക വ്യാഖ്യാനത്തെയോ പ്രത്യേകമായി ചൂണ്ടിക്കാണിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. അപൂർണഭൂതകാലത്തിന്റെ ഭാവം ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ സൂക്ഷിച്ചു. ‘അനുവദനീയമല്ലാത്തത്’ നിയമ-മതപരമായ ശക്തി നിലനിർത്തുമ്പോഴും ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
