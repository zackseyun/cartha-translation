id: MRK.2.17
reference: Mark 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: ml
  text: 'അതു കേട്ടപ്പോൾ യേശു അവരോടു പറയുന്നു: “ശക്തിയുള്ളവർക്കല്ല[a], രോഗികൾക്കാണ് വൈദ്യനെ ആവശ്യം. നീതിമാന്മാരെയല്ല[b], പാപികളെയാണ് വിളിക്കാൻ ഞാൻ വന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആരോഗ്യമുള്ളവർക്ക്”; ഗ്രീക്ക് പദം അക്ഷരാർഥത്തിൽ ശക്തിയോ നല്ല നിലയോ ഉള്ളവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: സന്ദർഭത്തിൽ “നീതിമാന്മാർ” എന്നത് നീതിമാന്മാരായി കണക്കാക്കപ്പെടുന്നവരെയോ സ്വയം അങ്ങനെ കരുതുന്നവരെയോ പരിഹാസസൂചനയോടെ ഉദ്ദേശിച്ചിരിക്കാം; എന്നാൽ ഗ്രീക്ക് പാഠം ലളിതമായി “നീതിമാന്മാർ” എന്നുമാത്രമാണ് പറയുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: അതു കേട്ടപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിലെ പരാതി കേട്ടതിനെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ സ്വാഭാവികമായ കാലബന്ധത്തോടെ നൽകുന്നു; ഗ്രീക്കിൽ സൂചിതമായ കർമം സന്ദർഭത്തിൽനിന്ന് ‘അത്’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു.
- source_word: οἱ ἰσχύοντες
  choice: ശക്തിയുള്ളവർ
  rationale: ἰσχύω എന്ന പദത്തിന്റെ ‘ശക്തിയുള്ള/സുഖസ്ഥിതിയിലുള്ള’ എന്ന അടിസ്ഥാനാർഥം സൂക്ഷിക്കുന്നു; വൈദ്യസംബന്ധമായ സന്ദർഭത്തിൽ ‘ആരോഗ്യമുള്ളവർ’ എന്നും മനസ്സിലാക്കാം.
- source_word: ἰατροῦ
  choice: വൈദ്യനെ
  rationale: ദൃഷ്ടാന്തത്തിന്റെ ഗൗരവവും ആധുനിക മലയാളത്തിലെ വ്യക്തതയും നിലനിർത്തുന്ന പദം.
- source_word: οἱ κακῶς ἔχοντες
  choice: രോഗികൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘മോശമായ നിലയിലുള്ളവർ’ എന്ന പ്രയോഗം ഇവിടെ രോഗാവസ്ഥയെ സൂചിപ്പിക്കുന്ന സാധാരണ ഗ്രീക്ക് പ്രയോഗമാണ്.
- source_word: καλέσαι
  choice: വിളിക്കാൻ
  rationale: ‘വിളിക്കുക’ എന്നത് ക്ഷണവും ആഹ്വാനവും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: δικαίους
  choice: നീതിമാന്മാർ
  rationale: ഗ്രീക്ക് പദത്തെ വ്യാഖ്യാനപരമായി ‘സ്വയം നീതിമാന്മാരെന്ന് കരുതുന്നവർ’ എന്നു മാറ്റാതെ നേരിട്ട് നൽകുന്നു.
- source_word: ἁμαρτωλούς
  choice: പാപികൾ
  rationale: സുവിശേഷസന്ദർഭത്തിലെ അംഗീകൃത ധാർമിക-മതപരമായ വിഭാഗനാമം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ‘നീതിമാന്മാർ’ എന്നത് പരിഹാസപരമായാണോ നേരിട്ടാണോ വായിക്കേണ്ടത്
  choice: പ്രധാനപാഠത്തിൽ ‘നീതിമാന്മാർ’ എന്ന് മാറ്റമില്ലാതെ നിലനിർത്തി
  alternative: ‘സ്വയം നീതിമാന്മാരെന്ന് കരുതുന്നവർ’
  rationale: സന്ദർഭത്തിൽ പരിഹാസസൂചന ഉണ്ടായേക്കാമെങ്കിലും ഗ്രീക്ക് പാഠം ലളിതമായി ‘നീതിമാന്മാർ’ എന്നാണ് പറയുന്നത്; വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: ἀκούσας എന്നതിന്റെ സൂചിത കർമം
  choice: മുൻസന്ദർഭത്തെ സൂചിപ്പിച്ച് ‘അതു’ ചേർത്തു
  alternative: ‘കേട്ടപ്പോൾ’ എന്ന് കർമം പറയാതിരിക്കുക
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മലയാളത്തിൽ മുൻസന്ദർഭവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘അതു’ സഹായിക്കുന്നു; പുതിയ ആശയമൊന്നും ചേർക്കുന്നില്ല.
- issue: മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം
  choice: ‘പറയുന്നു’ എന്നു നിലനിർത്തി
  alternative: ‘പറഞ്ഞു’
  rationale: λέγει എന്ന വർത്തമാനകാലരൂപം കഥയുടെ സജീവത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി; വൈദ്യദൃഷ്ടാന്തത്തിന്റെ പഴമൊഴിസ്വഭാവവും മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലവും സംരക്ഷിച്ചു.
