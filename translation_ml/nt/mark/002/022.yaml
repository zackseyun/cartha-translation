id: MRK.2.22
reference: Mark 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: ml
  text: പുതിയ വീഞ്ഞ് ആരും പഴയ തോൽക്കുടങ്ങളിൽ ഒഴിക്കാറില്ല. അങ്ങനെ ചെയ്താൽ വീഞ്ഞ് തോൽക്കുടങ്ങളെ പൊട്ടിക്കും; വീഞ്ഞും തോൽക്കുടങ്ങളും നശിച്ചുപോകും. പുതിയ വീഞ്ഞ് പുതിയ തോൽക്കുടങ്ങൾക്കുള്ളതാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βάλλει
  choice: ഒഴിക്കാറില്ല
  rationale: വീഞ്ഞ് ഒരു പാത്രത്തിലാക്കുന്ന സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായ ദ്രവ-വിശിഷ്ട പ്രയോഗം ‘ഒഴിക്കുക’ ആണ്; ഗ്രീക്ക് ക്രിയ പൊതുവായതാണെങ്കിലും ഇവിടെ ഉദ്ദേശിക്കുന്ന പ്രവൃത്തി വ്യക്തമായി നൽകുന്നു.
- source_word: οἶνον νέον
  choice: പുതിയ വീഞ്ഞ്
  rationale: അടുത്തിടെ ഉണ്ടാക്കിയതും പുളിച്ചുപൊങ്ങിക്കൊണ്ടിരിക്കുന്നതുമായ വീഞ്ഞിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്ന നേരിട്ടുള്ള പ്രയോഗം.
- source_word: ἀσκοὺς
  choice: തോൽക്കുടങ്ങൾ
  rationale: വീഞ്ഞ് സൂക്ഷിക്കാൻ ഉപയോഗിച്ചിരുന്ന മൃഗത്തോൽകൊണ്ടുള്ള പാത്രത്തെ സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: παλαιούς
  choice: പഴയ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥവും അവസാനത്തെ καινούς എന്ന പദത്തോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു; ‘ജീർണിച്ച’ എന്ന വ്യാഖ്യാനാത്മക അർഥം ചേർക്കുന്നില്ല.
- source_word: ῥήξει
  choice: പൊട്ടിക്കും
  rationale: പുളിപ്പിന്റെ സമ്മർദം തോൽക്കുടത്തെ പിളർത്തുന്ന ഫലം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπόλλυται
  choice: നശിച്ചുപോകും
  rationale: വീഞ്ഞ് നഷ്ടപ്പെടുകയും ഉപയോഗശൂന്യമാകുകയും ചെയ്യുന്ന സന്ദർഭാർഥം ഉൾക്കൊള്ളുന്നു; ‘നഷ്ടപ്പെടും’ എന്ന സാധ്യതയേക്കാൾ തോൽക്കുടങ്ങൾക്കും വീഞ്ഞിനും ഒരുപോലെ ചേരുന്നു.
- source_word: καινούς
  choice: പുതുമയുള്ള
  rationale: νέος എന്ന ‘പുതിയ’ വീഞ്ഞിൽനിന്ന് വ്യത്യസ്തമായി καινός സൂചിപ്പിക്കുന്ന പുതുമയോ ഉപയോഗിക്കാത്ത നിലയോ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: പുതിയ വീഞ്ഞ് പുതുമയുള്ള തോൽക്കുടങ്ങൾക്കുള്ളതാണ്
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് സമാപനവാക്യത്തിന്റെ പഴമൊഴിസദൃശമായ സംക്ഷിപ്തത നിലനിർത്തുന്നു; കല്പനയോ നിർബന്ധമോ അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: അവസാനത്തെ ക്രിയാരഹിത വാക്യഘടകത്തിന്റെ സ്വഭാവം
  choice: 'ഒരു പൊതുതത്ത്വമായി: ‘പുതിയ വീഞ്ഞ് പുതുമയുള്ള തോൽക്കുടങ്ങൾക്കുള്ളതാണ്’'
  alternative: ‘പുതിയ വീഞ്ഞ് പുതുമയുള്ള തോൽക്കുടങ്ങളിൽ ഒഴിക്കണം’ / ‘പുതിയ വീഞ്ഞ് പുതുമയുള്ള തോൽക്കുടങ്ങളിൽ ഒഴിക്കുന്നു’
  rationale: ഗ്രീക്കിൽ അവസാന വാക്യഘടകത്തിന് വ്യക്തമായ ക്രിയയില്ല. അതിനാൽ നിർബന്ധമോ കല്പനയോ ചേർക്കാതെ പഴമൊഴിസദൃശമായ പൊതുതത്ത്വമായി വിവർത്തനം ചെയ്യുന്നത് യഥാർഥമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സാംസ്കാരിക ദൃശ്യരൂപം നിലനിർത്താൻ ‘തോൽക്കുടങ്ങൾ’ ഉപയോഗിച്ചു. മൂലപാഠത്തിൽ അടിക്കുറിപ്പ് ആവശ്യപ്പെടുന്നത്ര നിർണായകമായ അർഥഭേദം ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകളില്ല.
