id: MRK.2.21
reference: Mark 2:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: ml
  text: ഇനിയും ചുരുക്കാത്ത തുണിക്കഷണം ആരും പഴയ വസ്ത്രത്തിൽ തുന്നിച്ചേർക്കുന്നില്ല[a]. അങ്ങനെ ചെയ്താൽ, ആ പുതിയ കഷണം പഴയ വസ്ത്രത്തിൽനിന്ന് വലിഞ്ഞുമാറി[b], കൂടുതൽ മോശമായ കീറൽ ഉണ്ടാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സംസ്കരിക്കാത്ത തുണി’ എന്നും പരിഭാഷപ്പെടുത്താം. പിന്നീട് ചുരുങ്ങാതിരിക്കേണ്ടതിനായി ഇനിയും സംസ്കരിച്ചിട്ടില്ലാത്ത, അതിനാൽ പിന്നീട് ചുരുങ്ങാവുന്ന തുണിയെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘നിറയ്ക്കുന്ന കഷണം അതിൽനിന്ന് എടുത്തുകളയുന്നു—പുതിയത് പഴയതിൽനിന്ന്.’ പുതിയ കഷണം പഴയ വസ്ത്രത്തിൽനിന്ന് വലിഞ്ഞുമാറി കീറൽ വഷളാക്കുന്നു എന്നാണ് ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: കഷണം
  rationale: വസ്ത്രത്തിലെ കീറൽ അടയ്ക്കാൻ മുകളിൽ തുന്നിച്ചേർക്കുന്ന തുണിക്കഷണമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭം അതിന്റെ ഒട്ടുകഷണസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ῥάκους ἀγνάφου
  choice: ചുരുങ്ങാത്ത തുണിയുടെ
  rationale: പൂർണമായി സംസ്കരിക്കാത്തതിനാൽ പിന്നീട് ചുരുങ്ങാനിടയുള്ള തുണിയെയാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘ചുരുങ്ങാത്ത തുണി’ പ്രായോഗിക ഫലം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπιράπτει
  choice: തുന്നിച്ചേർക്കുന്നില്ല
  rationale: തുന്നി ഘടിപ്പിക്കുക എന്ന മൂർത്തമായ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: ἱμάτιον παλαιόν
  choice: പഴയ വസ്ത്രത്തിൽ
  rationale: ἱμάτιον എന്ന പൊതുവായ വസ്ത്രപദത്തെ മേലങ്കിയെന്നു അനാവശ്യമായി പ്രത്യേകീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: εἰ δὲ μή
  choice: അങ്ങനെ ചെയ്താൽ
  rationale: മുൻപു പറഞ്ഞതിന് വിരുദ്ധമായി പ്രവർത്തിച്ചാലുണ്ടാകുന്ന ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: αἴρει
  choice: വലിഞ്ഞുമാറി
  rationale: പുതിയ കഷണം പഴയ വസ്ത്രത്തിൽനിന്ന് വലിഞ്ഞ് വേർപെടുന്ന സന്ദർഭാർഥം നൽകുന്നു; അക്ഷരാർഥമായ ‘എടുത്തുകളയുന്നു’ എന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: τὸ πλήρωμα
  choice: ആ പുതിയ കഷണം
  rationale: കീറൽ നിറയ്ക്കുന്ന കഷണം എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള τὸ καινόν എന്ന ‘പുതിയത്’ എന്ന വിശേഷണവും ഉൾക്കൊള്ളുന്നു.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: ആ പുതിയ കഷണം പഴയ വസ്ത്രത്തിൽനിന്ന്
  rationale: ‘പുതിയത് പഴയതിൽനിന്ന്’ എന്ന ഗ്രീക്ക് വൈരുധ്യം വ്യക്തമായ മലയാള നാമങ്ങളിലൂടെ നിലനിർത്തുന്നു.
- source_word: χεῖρον σχίσμα γίνεται
  choice: കീറൽ കൂടുതൽ വലുതാകും
  rationale: മുമ്പുണ്ടായിരുന്ന കീറൽ കൂടുതൽ മോശമോ വലുതോ ആകുന്ന ഫലം സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
