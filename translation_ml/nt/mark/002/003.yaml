translation:
  language: ml
  text: അവർ, നാലുപേർ ചുമന്ന ഒരു പക്ഷാഘാതബാധിതനായ ഒരാളെ, യേശുവിന്റെ അടുക്കലേക്ക് കൊണ്ടുവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘നാലുപേരാൽ’ എന്നുമാത്രമാണുള്ളത്; അവർ പുരുഷന്മാരാണെന്ന് പ്രത്യേകം പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അപ്പോൾ
  rationale: മുൻവിവരണത്തോടുള്ള ബന്ധം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ സൂചിപ്പിക്കുന്നു; ഇവിടെ ഇത് ശക്തമായ കാലക്രമവ്യാഖ്യാനം നൽകുന്നില്ല.
- source_word: ἔρχονται
  choice: അവർ ... കൊണ്ടുവന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലമായി നൽകി; φέροντες എന്ന അനുബന്ധക്രിയയുമായി ചേർത്താണ് പരിഭാഷ.
- source_word: φέροντες πρὸς αὐτὸν
  choice: യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: ചലനത്തിന്റെ ലക്ഷ്യം സന്ദർഭത്തിൽ യേശുവാണെന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: παραλυτικὸν
  choice: തളർവാതരോഗിയായ ഒരു മനുഷ്യനെ
  rationale: നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ അർഥം വ്യക്തമാക്കുകയും വ്യക്തിയെ രോഗാവസ്ഥയിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്ന ആധുനിക പ്രയോഗം.
- source_word: αἰρόμενον
  choice: ചുമന്നുകൊണ്ടുവന്ന
  rationale: മറ്റുള്ളവർ അയാളെ ശാരീരികമായി എടുത്തുകൊണ്ടുവന്നു എന്ന കർമണിവാചക ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑπὸ τεσσάρων
  choice: നാലുപേർ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘നാലുപേരാൽ/നാലുപേർ’ എന്നത്രമേ ഉള്ളൂ; വ്യക്തികളെ സൂചിപ്പിക്കുന്ന മലയാളത്തിലെ ‘പേർ’ ലിംഗം കൂട്ടിച്ചേർക്കാതെ സ്വാഭാവികമായി ആ അപൂർണത സംരക്ഷിക്കുന്നു.
