id: MRK.2.7
reference: Mark 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: ml
  text: “ഇയാൾ എന്തിനാണ് ഇങ്ങനെ സംസാരിക്കുന്നത്? ദൈവദൂഷണം ചെയ്യുകയാണ്! ഒരേയൊരു ദൈവത്തിനല്ലാതെ പാപങ്ങൾ ക്ഷമിക്കാൻ ആർക്ക് കഴിയും?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവത്തിനല്ലാതെ പാപങ്ങൾ ക്ഷമിക്കാൻ ആർക്ക് കഴിയും?”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ... οὕτως λαλεῖ
  choice: ഇങ്ങനെ സംസാരിക്കുന്നത് എന്തിന്?
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിലെ Τί ഇവിടെ വാക്കുകളുടെ ഉള്ളടക്കം ചോദിക്കുന്ന ‘എന്ത്’ എന്നതിലുപരി, ഇങ്ങനെ സംസാരിക്കുന്നതിന്റെ കാരണം ചോദിക്കുന്ന ‘എന്തിന്’ എന്ന അർഥത്തിലാണ്. οὕτως എന്നതിന്റെ ‘ഇങ്ങനെ’ എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: οὗτος
  choice: ഇയാൾ
  rationale: യേശുവിനെ കുറിച്ചുള്ള അകലം കലർന്ന പരാമർശം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘ഇവൻ’ എന്നതിലൂടെ മൂലത്തിൽ ഉള്ളതിലധികം നിന്ദ ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: βλασφημεῖ
  choice: ദൈവദൂഷണം പറയുകയാണ്
  rationale: വർത്തമാനകാലത്തിലുള്ള ഉടനടിയുള്ള ആരോപണവും ദൈവത്തിനെതിരായ ദൂഷണം എന്ന സന്ദർഭാർഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: τίς δύναται
  choice: ആർക്ക് കഴിയും?
  rationale: കഴിവിനെയും അധികാരത്തെയും ചോദ്യം ചെയ്യുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἀφιέναι ἁμαρτίας
  choice: പാപങ്ങൾ ക്ഷമിക്കാൻ
  rationale: പാപസന്ദർഭത്തിൽ ἀφίημι എന്ന ക്രിയയുടെ സ്ഥാപിതമായ അർഥം ‘ക്ഷമിക്കുക’ എന്നാണ്.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: ദൈവം ഒരുവനല്ലാതെ
  rationale: ദൈവത്തിന്റെ ഏകത്വത്തിനും ‘ദൈവം മാത്രം’ എന്ന ഒഴിവാക്കൽഭാവത്തിനും ഇടയിലെ ഗ്രീക്ക് ഘടനാപരമായ സൂക്ഷ്മത നിലനിർത്തുന്നു.
theological_decisions:
- issue: οὗτος എന്നതിലെ അവജ്ഞയുടെ തീവ്രത
  choice: ഇയാൾ
  alternative: ഇവൻ
  rationale: ശാസ്ത്രിമാരുടെ അകലം കലർന്ന എതിർപ്പ് അറിയിക്കുമ്പോഴും ഗ്രീക്കിൽ വ്യക്തമാക്കിയതിലധികം നിന്ദ ചേർക്കുന്നില്ല.
- issue: βλασφημεῖ എന്ന ആരോപണത്തിന്റെ സ്വഭാവം
  choice: ദൈവദൂഷണം പറയുകയാണ്!
  alternative: ഇത് ദൈവദൂഷണമാണ്!
  rationale: ആരോപണം യേശുവിന്റെ സംസാരത്തോടു നേരിട്ട് ബന്ധിപ്പിക്കുകയും, കഥയിലെ ക്രിസ്തുശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനം തന്നെ തീർപ്പാക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- issue: εἰ μὴ εἷς ὁ θεός എന്നതിലെ ഏകത്വവും ഒഴിവാക്കലും
  choice: ദൈവം ഒരുവനല്ലാതെ
  alternative: ദൈവത്തിനല്ലാതെ
  rationale: ‘ദൈവം മാത്രം’ എന്ന അർഥത്തോടൊപ്പം εἷς എന്ന ‘ഒരുവൻ’ ഘടകവും മുഖ്യപാഠത്തിൽ പ്രകടമാക്കുന്നു; കൂടുതൽ സ്വാഭാവികമായ പകരംവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു; അനാവശ്യമായ മതവിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കുന്നു.
