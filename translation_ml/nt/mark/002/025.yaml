source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Οὐδέποτε ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε χρείαν ἔσχεν καὶ ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ദാവീദിന് ആവശ്യമുണ്ടാകുകയും അവനും അവനോടുകൂടെ ഉണ്ടായിരുന്നവരും വിശക്കുകയും ചെയ്തപ്പോൾ അവൻ എന്തു ചെയ്തുവെന്ന് നിങ്ങൾ ഒരിക്കലും വായിച്ചിട്ടില്ലേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: ആവശ്യം നേരിടുകയും
  rationale: ‘ആവശ്യം ഉണ്ടായി’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ആവശ്യത്തിന്റെ സ്വഭാവം മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു കൂടുതൽ നിർവചിച്ചിട്ടില്ല.
- source_word: ἐπείνασεν
  choice: വിശന്നുപോകുകയും ചെയ്തപ്പോൾ
  rationale: ദാവീദിന് യഥാർഥത്തിൽ വിശപ്പുണ്ടായി എന്ന ക്രിയാർഥം നിലനിർത്തുന്നു; ‘ആവശ്യം’ എന്ന മുൻപ്രയോഗത്തിൽ ഇത് ലയിപ്പിക്കുന്നില്ല.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ
  choice: അവനും കൂടെയുണ്ടായിരുന്നവരും
  rationale: വിശപ്പ് ദാവീദിനും അവന്റെ കൂട്ടാളികൾക്കും ബാധകമാണെന്ന ഗ്രീക്ക് വാക്യഘടന വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: നിങ്ങൾ ഒരിക്കലും വായിച്ചിട്ടില്ലേ?
  rationale: പ്രതിവാദസ്വഭാവമുള്ള നിഷേധാത്മക ചോദ്യത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളപ്രയോഗവും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. മൂലപാഠത്തിലെ ആവർത്തനാത്മക ഊന്നൽ സംരക്ഷിച്ചുകൊണ്ട് അനാവശ്യ വ്യാഖ്യാനം ഒഴിവാക്കി.
