source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: ml
  text: 'അവരുടെ വിശ്വാസം കണ്ടപ്പോൾ യേശു തളർവാതരോഗിയോട് പറയുന്നു: “മകനേ[a], നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കുഞ്ഞേ”; ഗ്രീക്കിലെ τέκνον സ്നേഹപൂർവമായ അഭിസംബോധനയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം മുഖ്യക്രിയയോടുള്ള സമയബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കണ്ടപ്പോൾ’ സ്വാഭാവികമായും വ്യക്തമായും ആ ബന്ധം നിലനിർത്തുന്നു.
- source_word: πίστιν αὐτῶν
  choice: അവരുടെ വിശ്വാസം
  rationale: πίστις ഇവിടെ യേശുവിന്റെ അടുക്കൽ ആ മനുഷ്യനെ കൊണ്ടുവന്നവരിൽ പ്രകടമായ വിശ്വാസത്തെയോ ആശ്രയത്തെയോ സൂചിപ്പിക്കുന്നു; αὐτῶν എന്ന ബഹുവചന സർവനാമത്തിന്റെ വ്യാപ്തി നിർണ്ണയിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ വിവരണത്തിലെ ചരിത്രവർത്തമാനകാലത്തിന്റെ സജീവത നിലനിർത്താൻ വർത്തമാനകാലം ഉപയോഗിച്ചു.
- source_word: παραλυτικῷ
  choice: തളർവാതരോഗിയോട്
  rationale: നാമമായി ഉപയോഗിച്ച വിശേഷണം തളർവാതം ബാധിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണിത്.
- source_word: Τέκνον
  choice: മകനേ
  rationale: τέκνον സ്നേഹപൂർവമായ അഭിസംബോധനയാണ്. ഈ പുരുഷനെ അഭിസംബോധന ചെയ്യുന്ന സന്ദർഭത്തിൽ ‘മകനേ’ സ്വാഭാവികമാണ്; മൂലപദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘കുഞ്ഞേ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗം ക്ഷമ ഇപ്പോഴുള്ള യാഥാർഥ്യമായി പ്രഖ്യാപിക്കുന്നു. ‘ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നത് ദൈവിക കർത്താവിനെ വ്യക്തമാക്കാതെ കർമണിരൂപവും പ്രഖ്യാപനത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പാപക്ഷമാപ്രഖ്യാപനത്തിന്റെ സ്വഭാവം
  choice: ‘നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന നേരിട്ടുള്ള പ്രഖ്യാപനം
  alternative: ‘നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെടുന്നു’
  rationale: ഗ്രീക്ക് വർത്തമാനകാല കർമണിരൂപം ക്ഷമയെ നിലവിലുള്ള യാഥാർഥ്യമായി അവതരിപ്പിക്കുന്നു. ക്ഷമയുടെ കർത്താവിനെയോ കൃത്യമായ സമയക്രമത്തെയോ പരിഭാഷ അധികമായി നിർവചിക്കുന്നില്ല.
- issue: ‘അവരുടെ വിശ്വാസം’ എന്നതിന്റെ വ്യാപ്തി
  choice: ആ വിശ്വാസം ആരുടേതാണെന്ന് കൂടുതൽ വിശദീകരിക്കാതെ ബഹുവചനം നിലനിർത്തുക
  alternative: ചുമന്നുകൊണ്ടുവന്നവരുടെ വിശ്വാസം
  rationale: αὐτῶν എന്നത് ബഹുവചനമാണെങ്കിലും അതിൽ തളർവാതരോഗി ഉൾപ്പെടുന്നുണ്ടോ എന്ന് വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല; അതിനാൽ യഥാർഥമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം ‘പറയുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി; ദൈവശാസ്ത്രപരമായ വിശദീകരണം വാക്യത്തിലേക്ക് ചേർത്തിട്ടില്ല.
