source:
  edition: SBLGNT
  text: καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: ml
  text: ജനക്കൂട്ടം നിമിത്തം അവനെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവരാൻ കഴിയാതിരുന്നതിനാൽ[a], യേശു ഉണ്ടായിരുന്നിടത്തെ മേൽക്കൂര അവർ തുറന്നുനീക്കി. അതു കുത്തിത്തുറന്നശേഷം, തളർവാതം ബാധിച്ച മനുഷ്യൻ കിടന്നിരുന്ന പായ അവർ താഴേക്കിറക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവനെ അവന്റെ അടുക്കൽ കൊണ്ടുവരാൻ’; ‘അവനെ’ തളർവാതം ബാധിച്ച മനുഷ്യനെയും ‘അവന്റെ’ യേശുവിനെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: കഴിയാതിരുന്നതിനാൽ
  rationale: തുടർന്നുള്ള പ്രവൃത്തിക്കു കാരണമായ സാഹചര്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കൃത്തരൂപത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: προσενέγκαι αὐτῷ
  choice: അവനെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവരാൻ
  rationale: ഗ്രീക്കിൽ നേരിട്ടുള്ള കർമവും പരോക്ഷ കർമവും ഉണ്ട്. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായ യേശുവിന്റെ പേര് ഉപയോഗിച്ചു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: διὰ τὸν ὄχλον
  choice: ജനക്കൂട്ടം നിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു; ὄχλος എന്നതിന് സ്വാഭാവികവും കൃത്യവുമായ പദം ‘ജനക്കൂട്ടം’ ആണ്.
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: മേൽക്കൂര അവർ നീക്കിക്കളഞ്ഞു
  rationale: അപൂർവമായ ἀποστεγάζω മേൽക്കൂരയുടെ ആവരണം നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; നിർമ്മാണസാമഗ്രി അനുമാനിക്കാതെ പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: ὅπου ἦν
  choice: യേശു ഉണ്ടായിരുന്ന സ്ഥലത്തെ
  rationale: ദ്വാരം ഉണ്ടാക്കിയ സ്ഥലം യേശു ഉണ്ടായിരുന്ന ഇടത്തിനു മുകളിലാണെന്ന സന്ദർഭബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξορύξαντες
  choice: അതു കുത്തിത്തുറന്നശേഷം
  rationale: മേൽക്കൂരയിലെ വസ്തുക്കൾ നീക്കി അതിലൂടെ തുറവുണ്ടാക്കിയ ശാരീരിക പ്രവൃത്തി, ഉപയോഗിച്ച സാമഗ്രി അനാവശ്യമായി നിർണ്ണയിക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: χαλῶσι
  choice: താഴേക്കിറക്കി
  rationale: ക്രിയയുടെ അർഥം ‘താഴ്ത്തുക/താഴേക്കിറക്കുക’ എന്നാണ്. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാള കഥനശൈലിയിൽ സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകി.
- source_word: κράβαττον
  choice: പായ
  rationale: വലിയ കട്ടിലിനേക്കാൾ ലളിതമായ കിടപ്പുപായയെയോ കിടക്കവിരിയെയോ സൂചിപ്പിക്കുന്ന പദമാണിത്; ‘പായ’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: ὁ παραλυτικὸς
  choice: തളർവാതം ബാധിച്ച മനുഷ്യൻ
  rationale: നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ അർഥം രോഗിയെ അവന്റെ രോഗാവസ്ഥയിലേക്ക് ചുരുക്കാതെ, വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
