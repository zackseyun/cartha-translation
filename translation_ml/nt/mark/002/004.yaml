translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. പുരാതന മേൽക്കൂരയുടെ നിർമ്മാണരീതി സംബന്ധിച്ച അനുമാനങ്ങൾ വാചകത്തിൽ ചേർത്തിട്ടില്ല; ഗ്രീക്കിലെ ആവർത്തിക്കുന്ന സർവനാമം വായനാസൗകര്യത്തിനായി വ്യക്തമാക്കിയെങ്കിലും അതിന്റെ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
