  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: ml
  text: 'എന്നാൽ, ഭൂമിയിൽ പാപങ്ങൾ ക്ഷമിക്കാൻ മനുഷ്യപുത്രന്[a] അധികാരമുണ്ടെന്ന് നിങ്ങൾ അറിയേണ്ടതിന്—അവൻ പക്ഷാഘാതം ബാധിച്ച മനുഷ്യനോടു[b] പറയുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മനുഷ്യനായവൻ.” “മനുഷ്യപുത്രൻ” എന്ന ഗ്രീക്ക് പദവിക്ക് മനുഷ്യനെ സൂചിപ്പിക്കുന്ന പ്രയോഗാർഥവും ദാനിയേൽ 7-ലേക്കുള്ള സൂചനയും ഉണ്ടായേക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “അവൻ പക്ഷാഘാതക്കാരനോടു പറയുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: എന്നാൽ ... അറിയേണ്ടതിന്
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യവും ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰδῆτε
  choice: നിങ്ങൾ അറിയേണ്ടതിന്
  rationale: വരാനിരിക്കുന്ന സൗഖ്യപ്പെടുത്തൽ മുഖേന ലഭിക്കേണ്ട അറിവിനെ സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യപ്രയോഗമാണിത്.
- source_word: ἐξουσίαν ἔχει
  choice: അധികാരമുണ്ട്
  rationale: കേവലമായ കഴിവിനേക്കാൾ പാപങ്ങൾ ക്ഷമിക്കാനുള്ള നിയമസാധുവായ അവകാശവും പ്രഭുത്വവും ἐξουσία ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണമായ ഈ പദവിയുടെ മാനുഷിക അർഥസാധ്യതയും ദാനിയേൽ 7-ലേക്കുള്ള സൂചനയും തുറന്നുവെക്കുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: സ്വർഗീയ മണ്ഡലത്തോടു വേർതിരിച്ചുള്ള ഭൂമിയിലെ അധികാരപ്രയോഗമാണ് സന്ദർഭത്തിൽ സ്വാഭാവികമായ അർഥം.
- source_word: ἀφιέναι ἁμαρτίας
  choice: പാപങ്ങൾ ക്ഷമിക്കാൻ
  rationale: ഈ സന്ദർഭത്തിൽ ἀφίημι പാപം മോചിപ്പിക്കുക അഥവാ ക്ഷമിക്കുക എന്ന സ്ഥിരപ്രയോഗാർഥത്തിലാണ്.
- source_word: λέγει τῷ παραλυτικῷ
  choice: അവൻ പക്ഷാഘാതം ബാധിച്ച മനുഷ്യനോടു പറയുന്നു
  rationale: ചരിത്രവർത്തമാനകാലമായ λέγει-യെ ‘പറയുന്നു’ എന്നു നിലനിർത്തുകയും substantival παραλυτικός-നെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വ്യക്തികേന്ദ്രിത ഭാഷയിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന യേശുവിന്റെ പദവിയുടെ വിവർത്തനം
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: പരമ്പരാഗതവും മൂലപാഠത്തോടു ചേർന്നതുമായ പദവി നിലനിർത്തുന്നത് അതിന്റെ സാധാരണ മാനുഷിക ഭാവവും ദാനിയേൽ 7-ലെ ദർശനസൂചനയും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ അർഥതുറപ്പിനെ സംരക്ഷിക്കുന്നു.
- issue: പാപങ്ങൾ ക്ഷമിക്കുന്നതുമായി ബന്ധപ്പെട്ട ἐξουσίαയുടെ അർഥം
  choice: അധികാരം
  alternative: ശക്തി; അവകാശം
  rationale: ഇവിടെ അവകാശവാദം ഒരു പ്രവൃത്തി ചെയ്യാനുള്ള ശേഷിയെക്കുറിച്ച് മാത്രമല്ല, പാപങ്ങൾ ക്ഷമിക്കാനുള്ള സാധുവായ പ്രഭുത്വത്തെക്കുറിച്ചുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ ഇടയ്ക്കു മുറിഞ്ഞ വാക്യഘടന em dash ഉപയോഗിച്ച് നിലനിർത്തി; ‘പറയുന്നു’ എന്ന ചരിത്രവർത്തമാനവും സംരക്ഷിച്ചു. മുഖ്യപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
