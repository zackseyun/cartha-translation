id: MRK.2.26
reference: Mark 2:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: ml
  text: മഹാപുരോഹിതനായ അബ്യാഥാരിന്റെ കാലത്ത്[a] അവൻ ദൈവത്തിന്റെ ആലയത്തിൽ കടന്ന്, പുരോഹിതന്മാർക്കല്ലാതെ ആർക്കും ഭക്ഷിക്കാൻ അനുവാദമില്ലാത്ത സന്നിധിയപ്പങ്ങൾ[b] ഭക്ഷിക്കുകയും, കൂടെയുണ്ടായിരുന്നവർക്കും കൊടുക്കുകയും ചെയ്തത് എങ്ങനെയാണ്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അബ്യാഥാർ മഹാപുരോഹിതനായിരുന്ന കാലത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പ്രയോഗം മഹാപുരോഹിതനായ അബ്യാഥാരുമായി ബന്ധപ്പെട്ട കാലഘട്ടത്തെയോ വിവരണത്തിന്റെ പശ്ചാത്തലത്തെയോ വിശാലമായി സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘സന്നിധിയപ്പം’ എന്നത് വിശുദ്ധമന്ദിരത്തിൽ ദൈവസന്നിധിയിൽ വെച്ചിരുന്ന വിശുദ്ധ അപ്പമാണ്; പരമ്പരാഗതമായി ഇത് ‘കാഴ്ചയപ്പം’ എന്നും അറിയപ്പെടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: എങ്ങനെയെന്ന്
  rationale: മുൻസന്ദർഭത്തിലെ ‘വായിച്ചിട്ടില്ലേ?’ എന്ന ചോദ്യവുമായി സ്വാഭാവികമായി ചേരുകയും ദാവീദ് ചെയ്തത് വിവരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: ദൈവഭവനത്തിൽ പ്രവേശിച്ച്
  rationale: ‘ദൈവത്തിന്റെ ഭവനം’ എന്ന ആശയം സംക്ഷിപ്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: മഹാപുരോഹിതനായ അബ്യാഥാരിന്റെ കാലത്ത്
  rationale: ἐπί + genitive എന്ന പ്രയോഗത്തിന്റെ വിശാലമായ കാലസൂചന നിലനിർത്തുന്നു; അബ്യാഥാർ അന്നുതന്നെ ഔദ്യോഗികമായി മഹാപുരോഹിതനായിരുന്നു എന്ന് പരിഭാഷയിൽ കൂടുതൽ കൃത്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: ἄρτους τῆς προθέσεως
  choice: സന്നിധിയപ്പം
  rationale: ദൈവസന്നിധിയിൽ സമർപ്പിച്ചുവെച്ച വിശുദ്ധ അപ്പത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദം.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ τοὺς ἱερεῖς
  choice: പുരോഹിതന്മാർക്കല്ലാതെ ഭക്ഷിക്കാൻ അനുവാദമില്ലാത്ത
  rationale: നിയമപരവും ആരാധനാക്രമപരവുമായ അനുമതിയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: കൂടെയുണ്ടായിരുന്നവർക്കും കൊടുക്കുകയും ചെയ്തത്
  rationale: ‘അവനോടുകൂടെ ഉണ്ടായിരുന്നവർ’ എന്ന ഗ്രീക്ക് അർത്ഥം ലളിതമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വസ്തു വ്യക്തമായതിനാൽ ‘അപ്പം’ വീണ്ടും ചേർക്കുന്നില്ല.
theological_decisions:
- issue: അബ്യാഥാരിനെക്കുറിച്ചുള്ള കാലപ്രയോഗവും 1 ശമൂവേൽ 21-ലെ സമാന്തരവിവരണവുമായി അതിനുള്ള ബന്ധവും
  choice: പ്രധാനപാഠത്തിൽ ‘മഹാപുരോഹിതനായ അബ്യാഥാരിന്റെ കാലത്ത്’ എന്നു നൽകി.
  alternative: ‘അബ്യാഥാർ മഹാപുരോഹിതനായിരുന്ന കാലത്ത്’; അല്ലെങ്കിൽ ‘മഹാപുരോഹിതനായ അബ്യാഥാരുമായി ബന്ധപ്പെട്ട വിവരണഭാഗത്തിൽ.’
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന് വിശാലമായ കാലസൂചനയോ ആ വ്യക്തിയുമായി ബന്ധപ്പെട്ട വിവരണപശ്ചാത്തലമോ സൂചിപ്പിക്കാനാകാം. അതിനാൽ ചരിത്രപരമായ സംഘർഷം പരിഭാഷയിൽ നിശ്ശബ്ദമായി പരിഹരിക്കാതെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച ചോദ്യത്തിന്റെ തുടർച്ചയായതിനാൽ, സ്വതന്ത്രമായി വായിക്കുമ്പോഴും ചോദ്യരൂപം വ്യക്തമാകാൻ ‘നിങ്ങൾ വായിച്ചിട്ടില്ലേ?’ ചേർത്തിരിക്കുന്നു; അത് മാർക്കോസ് 2:25-ൽ നിന്നുള്ള വ്യാകരണപരമായ ആശ്രിതഘടകമാണ്.
