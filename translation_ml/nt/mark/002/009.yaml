id: MRK.2.9
reference: Mark 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: ml
  text: തളർവാതം ബാധിച്ച മനുഷ്യനോട്, ‘നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’[a] എന്നു പറയുന്നതോ, ‘എഴുന്നേറ്റ് നിന്റെ പായ എടുത്ത് നടക്കുക’ എന്നു പറയുന്നതോ—ഏതാണ് എളുപ്പം?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെടുന്നു.’ ഗ്രീക്ക് ക്രിയ ക്ഷമയുടെ നിലവിലെ അവസ്ഥയ്ക്കു ഊന്നൽ നൽകുന്നതായും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: ഏതാണ് എളുപ്പം?
  rationale: താരതമ്യചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰπεῖν
  choice: എന്നു പറയുന്നത്
  rationale: രണ്ടു നേരിട്ടുള്ള ഉദ്ധരണികളെയും ഒരേ രീതിയിൽ അവതരിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ പ്രയോഗം.
- source_word: τῷ παραλυτικῷ
  choice: തളർവാതം ബാധിച്ച മനുഷ്യനോട്
  rationale: രോഗാവസ്ഥ വ്യക്തമാക്കുകയും വ്യക്തിയെ രോഗനാമത്തിൽ മാത്രം വിളിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാല രൂപം സൂചിപ്പിക്കാവുന്ന ക്ഷമിക്കപ്പെട്ട നിലയ്ക്ക് ഊന്നൽ നൽകുന്നു; ക്ഷമിക്കുന്ന കർത്താവിനെ ഗ്രീക്കുപോലെ വ്യക്തമാക്കാതെ വിടുന്നു.
- source_word: Ἔγειρε
  choice: എഴുന്നേറ്റ്
  rationale: കല്പനയുടെ സ്വാഭാവികവും സമകാലികവുമായ മലയാളരൂപം.
- source_word: ἆρον τὸν κράβαττόν σου
  choice: നിന്റെ പായ എടുത്ത്
  rationale: κράβαττος എന്നത് എളുപ്പത്തിൽ എടുത്തുകൊണ്ടുപോകാവുന്ന ലളിതമായ കിടപ്പുപായയെ സൂചിപ്പിക്കുന്നു; αἴρωയുടെ എടുത്തുയർത്തുന്ന അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: περιπάτει
  choice: നടക്കുക
  rationale: കല്പനാക്രമത്തിൽ സ്വാഭാവികമായി ചേരുന്ന നേരിട്ടുള്ള വിവർത്തനം.
theological_decisions:
- issue: പാപക്ഷമയുടെ പ്രഖ്യാപനത്തിന്റെ കാലഭാവവും കർത്തൃത്വവും
  choice: നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെടുന്നു
  rationale: തിരഞ്ഞെടുത്ത രൂപം ക്ഷമയുടെ ഫലമായി നിലവിലുള്ള അവസ്ഥയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. അതേസമയം ദൈവിക കർമണി രൂപത്തിലുള്ള പരോക്ഷ കർത്തൃത്വത്തെ വിശദീകരിച്ച് ചേർക്കാതെ, യേശുവിന്റെ അധികാരത്തെക്കുറിച്ചുള്ള ആഖ്യാനത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാചകക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും രണ്ടു പ്രസ്താവനകളുടെ താരതമ്യഘടനയും ചോദ്യംചെയ്യുന്ന ഊന്നലും സംരക്ഷിച്ചിട്ടുണ്ട്.
