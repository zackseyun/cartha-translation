id: MRK.16.6
reference: Mark 16:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറയുന്നു: “പരിഭ്രമിക്കരുത്. ക്രൂശിക്കപ്പെട്ട നസറായനായ യേശുവിനെയാണ് നിങ്ങൾ അന്വേഷിക്കുന്നത്[a]. അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു; അവൻ ഇവിടെയില്ല[b]. ഇതാ, അവർ അവനെ കിടത്തിയ സ്ഥലം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നസറായനായ” എന്നത് “നസറെത്തിൽനിന്നുള്ള” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ നസറെത്ത് എന്ന സ്ഥലനാമത്തിൽനിന്നുണ്ടായ ഒരു വിശേഷണപദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: '“അവൻ ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ passive രൂപത്തിലാണ്: “അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: പരിഭ്രമിക്കേണ്ട
  rationale: ശക്തമായ അമ്പരപ്പും ഭയജന്യമായ മനോവിഭ്രാന്തിയും സൂചിപ്പിക്കുന്ന ക്രിയയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ναζαρηνὸν
  choice: നസറായനായ
  rationale: നസറെത്ത് എന്ന സ്ഥലനാമത്തിൽനിന്നുള്ള ഗ്രീക്ക് വിശേഷണരൂപത്തെ ഒരു സ്ഥാനവിശേഷണമായി നിലനിർത്തുന്നു.
- source_word: ἐσταυρωμένον
  choice: ക്രൂശിക്കപ്പെട്ട
  rationale: പൂർത്തിയായ സംഭവത്തിന്റെ നിലനിൽക്കുന്ന പ്രസക്തി സൂചിപ്പിക്കുന്ന perfect participle-ന്റെ passive രൂപവും സംക്ഷിപ്തതയും സംരക്ഷിക്കുന്നു.
- source_word: ἠγέρθη
  choice: അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ aorist passive രൂപം സംരക്ഷിക്കുകയും കർത്താവിനെ പ്രത്യേകം വിശദീകരിക്കാതെ ദൈവിക പ്രവർത്തനത്തിന്റെ സൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ζητεῖτε
  choice: നിങ്ങൾ അന്വേഷിക്കുന്നത്
  rationale: വർത്തമാനകാലത്തിലെ തുടരുന്ന തിരച്ചിലിനെ സാഹചര്യത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἴδε
  choice: ഇതാ
  rationale: ശ്രദ്ധയെ ഒരു ദൃശ്യസ്ഥാനത്തേക്ക് ശക്തമായി തിരിക്കുന്ന നിർദേശക പ്രയോഗം ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τόπος
  choice: സ്ഥലം
  rationale: കല്ലറയ്ക്കുള്ളിലെ നിർദിഷ്ട ഇടത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സാധാരണ മലയാള തത്തുല്യം.
- source_word: ἔθηκαν
  choice: കിടത്തിയ
  rationale: മൃതശരീരം കല്ലറയിൽ വെച്ചതിനെ മലയാളത്തിലെ ശവസംസ്കാരസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക ക്രിയയാൽ അവതരിപ്പിക്കുന്നു.
- source_word: λέγει αὐταῖς
  choice: അവൻ അവരോടു പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം മലയാളത്തിലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനവാക്യത്തിന്റെ വാച്യവും ക്രിയാരൂപവും
  choice: അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: അവൻ ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു / അവൻ ഉയിർപ്പിക്കപ്പെട്ടു
  rationale: ἠγέρθη എന്നത് passive രൂപമായതിനാൽ അതു സംരക്ഷിക്കുന്നു; ആരാണ് ഉയിർപ്പിച്ചതെന്ന് പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെ പുനരുത്ഥാനപ്രഖ്യാപനം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ചരിത്രവർത്തമാനകാലവും പുനരുത്ഥാനക്രിയയുടെ passive രൂപവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
