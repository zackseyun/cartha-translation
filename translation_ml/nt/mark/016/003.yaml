id: MRK.16.3
reference: Mark 16:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: ml
  text: 'അവർ തമ്മിൽ പറഞ്ഞുകൊണ്ടിരുന്നു: “കല്ലറയുടെ പ്രവേശനത്തിൽനിന്ന്[a] ആ കല്ല് നമുക്കുവേണ്ടി ആര് ഉരുട്ടിമാറ്റും?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കല്ലറയുടെ വാതിലിൽനിന്ന്.”
    reason: θύρα എന്ന ഗ്രീക്ക് പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘പ്രവേശനം’ എന്നും ‘വാതിൽ’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം വഴിയിലുടനീളമുള്ളതോ ആവർത്തിച്ചുള്ളതോ ആയ സംഭാഷണത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ വെറും ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ക്രിയയുടെ ദൈർഘ്യഭാവം ഇത് നിലനിർത്തുന്നു.
- source_word: πρὸς ἑαυτάς
  choice: അവർ തമ്മിൽ
  rationale: പദശഃ ‘തങ്ങളോടുതന്നെ’ എന്നാണെങ്കിലും, സ്ത്രീകൾ പരസ്പരം സംസാരിക്കുകയായിരുന്നു എന്ന സന്ദർഭോചിതമായ പരസ്പരാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘അവർ തമ്മിൽ’ വ്യക്തമാക്കുന്നു.
- source_word: Τίς
  choice: ആര്
  rationale: പ്രവൃത്തി ചെയ്യാൻ കഴിയുന്ന വ്യക്തിയെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀποκυλίσει
  choice: ഉരുട്ടിമാറ്റും
  rationale: തടസ്സമായി കിടക്കുന്ന കല്ലിനെ ഉരുട്ടി മാറ്റുന്ന വ്യക്തമായ ദൃശ്യാർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἡμῖν
  choice: നമുക്കുവേണ്ടി
  rationale: ഈ ദത്തിവ് സ്ത്രീകളുടെ പ്രയോജനത്തിനായി അഥവാ അവരുടെ പേരിൽ പ്രവൃത്തി ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: τὸν λίθον
  choice: ആ കല്ല്
  rationale: നിശ്ചയാർഥക ഘടകം സന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്ന കല്ലിനെ സൂചിപ്പിക്കുന്നു; ‘വലിയ’ എന്ന വിശേഷണം ഈ വാക്യത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: ἐκ τῆς θύρας
  choice: പ്രവേശനവാതിൽക്കൽനിന്ന്
  rationale: θύραയ്ക്ക് ‘വാതിൽ’ എന്നും ‘പ്രവേശനം’ എന്നും അർഥമുണ്ട്. കല്ലറയുടെ തുറവാണ് ഉദ്ദേശിക്കുന്നത്; ‘പ്രവേശനവാതിൽ’ ഇരുവശവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: τοῦ μνημείου
  choice: കല്ലറയുടെ
  rationale: ഈ സന്ദർഭത്തിൽ μνημεῖον മൃതദേഹം അടക്കിയ കല്ലറയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘കല്ലറ’ വ്യക്തവും പതിവുമായ പദമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന ഭാവം ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നു നിലനിർത്തി. θύρα എന്നതിലെ ‘വാതിൽ/പ്രവേശനം’ വ്യത്യാസം സംയുക്തമായ ‘പ്രവേശനവാതിൽ’ കൊണ്ടു സ്വാഭാവികമായി ഉൾപ്പെടുത്തിയതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
