  text: ἐκείνη πορευθεῖσα ἀπήγγειλεν τοῖς μετ’ αὐτοῦ γενομένοις πενθοῦσι καὶ κλαίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: ml
  text: അവൾ പോയി, അവനോടുകൂടെ ഉണ്ടായിരുന്നതും ദുഃഖിക്കുകയും കരയുകയും ചെയ്തുകൊണ്ടിരുന്നതുമായവരോട് ഇക്കാര്യം അറിയിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: അവൾ
  rationale: മുൻവാക്യത്തിലെ മഗ്ദലക്കാരി മറിയയെയാണ് ഈ നിർദേശസർവനാമം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘അവൾ’ സ്വാഭാവികമാണ്.
- source_word: πορευθεῖσα
  choice: പോയി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തനക്രമം സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ ‘പോയി’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀπήγγειλεν
  choice: ഇക്കാര്യം അറിയിച്ചു
  rationale: ക്രിയയ്ക്ക് ‘അറിയിക്കുക/വാർത്ത അറിയിക്കുക’ എന്ന അർഥമുണ്ട്. ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻസന്ദർഭത്തിലെ പ്രത്യക്ഷപ്പെടലിനെ ‘ഇക്കാര്യം’ സൂചിപ്പിക്കുന്നു.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്നവരോട്
  rationale: യേശുവിനോടൊപ്പം കഴിഞ്ഞിരുന്ന സംഘത്തെ നേരായും സ്വാഭാവികമായും തിരിച്ചറിയിക്കുന്നു; ‘ശിഷ്യന്മാർ’ എന്നു പരിമിതപ്പെടുത്തി മൂലപാഠത്തേക്കാൾ അധികം വ്യക്തമാക്കുന്നില്ല.
- source_word: πενθοῦσι καὶ κλαίουσιν
  choice: ദുഃഖിച്ചും കരഞ്ഞുംകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: രണ്ട് വർത്തമാന കൃദന്തങ്ങളും സന്ദേശം ലഭിച്ചവരുടെ അന്നത്തെ തുടരുന്ന അവസ്ഥ വ്യക്തമാക്കുന്നു; πενθέωയിലെ വിലാപദുഃഖവും κλαίωയിലെ കരച്ചിലും വേർതിരിച്ചു നിലനിർത്തുന്നു.
