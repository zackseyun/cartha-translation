id: MRK.16.9
reference: Mark 16:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: ml
  text: അവൻ ഉയിർത്തെഴുന്നേറ്റശേഷം[a], ആഴ്ചയുടെ ഒന്നാം ദിവസം അതിരാവിലെ, അവൻ ഏഴ് ഭൂതങ്ങളെ പുറത്താക്കിയിരുന്ന മഗ്ദലക്കാരിയായ മറിയയ്ക്ക് ആദ്യം പ്രത്യക്ഷനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മർക്കോസ് 16:9–20 ചില ആദ്യകാല കൈയെഴുത്തുപ്രതികളിൽ ഇല്ല; മറ്റു പ്രതികളിൽ ഈ വാക്യങ്ങൾ കാണപ്പെടുന്നു, ചിലപ്പോൾ വ്യത്യാസങ്ങളോടുകൂടെ.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: ഉയിർത്തെഴുന്നേറ്റശേഷം
  rationale: അഒറിസ്റ്റ് കൃതന്തം മുഖ്യക്രിയയായ ἐφάνη-യ്ക്കു മുമ്പുണ്ടായ സംഭവത്തെ സൂചിപ്പിക്കുന്നു; പുനരുത്ഥാനസന്ദർഭത്തിൽ ‘ഉയിർത്തെഴുന്നേറ്റശേഷം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇത് മൃദുവായ വ്യവഹാരബന്ധകമാണ്. മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിൽ പ്രത്യേകമായി ‘എന്നാൽ/പിന്നെ’ ചേർക്കാതെ ബന്ധം നിലനിൽക്കുന്നു; ശക്തമായ വിരോധാർഥം ഇറക്കുമതി ചെയ്യുന്നത് ഒഴിവാക്കി.
- source_word: πρωῒ
  choice: അതിരാവിലെ
  rationale: പുലർച്ചെയിലെ ആദ്യസമയത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: πρώτῃ σαββάτου
  choice: ആഴ്ചയുടെ ഒന്നാം ദിവസം
  rationale: കൊയ്നേ യഹൂദ-ക്രൈസ്തവ പ്രയോഗത്തിലെ ആഴ്ചയുടെ ആദ്യദിവസം എന്ന കാലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐφάνη
  choice: പ്രത്യക്ഷനായി
  rationale: പുനരുത്ഥാനദർശനങ്ങളുടെ സന്ദർഭത്തിൽ ‘പ്രത്യക്ഷനായി’ എന്നത് രൂപത്തിന്റെ സംഭവാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: പ്രത്യക്ഷപ്പെടലുകളുടെ ക്രമം സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണാർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: മഗ്ദലക്കാരി മറിയയ്ക്ക്
  rationale: മഗ്ദല സ്വദേശിനിയെന്ന വിശേഷണം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും ദാതൃവിഭക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: παρ’ ἧς
  choice: താൻ … പുറത്താക്കിയിരുന്ന
  rationale: ഭൂതങ്ങൾ ആരിൽനിന്നാണ് പുറത്താക്കപ്പെട്ടതെന്ന് ബന്ധവാക്യത്തിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκβεβλήκει
  choice: പുറത്താക്കിയിരുന്ന
  rationale: പ്രത്യക്ഷപ്പെടലിനു മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പ്ലൂപർഫെക്റ്റിന്റെ മുൻകാലബന്ധം ‘-യിരുന്ന’ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: ἑπτὰ δαιμόνια
  choice: ഏഴ് ഭൂതങ്ങളെ
  rationale: സുവിശേഷങ്ങളിലെ ഭൂതോച്ചാടനസന്ദർഭത്തിലുള്ള δαιμόνια എന്ന പദത്തിന് സാധാരണവും നേരിട്ടുള്ളതുമായ മലയാളസമം ഉപയോഗിക്കുന്നു; സംഖ്യ അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മർക്കോസ് 16:9 ഉൾപ്പെടുന്ന ദീർഘസമാപനത്തിന്റെ പാഠവിമർശനസ്ഥിതി
  choice: നൽകിയിരിക്കുന്ന SBLGNT ഗ്രീക്ക് പാഠപ്രകാരം വാക്യം വിവർത്തനം ചെയ്ത്, വിവാദമായ പാഠഭാഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ അറിയിക്കുക.
  alternative: ചില പുരാതന കൈയെഴുത്തുപ്രതികൾ മർക്കോസ് 16:8-ൽ അവസാനിക്കുന്നതിനാൽ 16:9–20 പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്താതിരിക്കുക; മറ്റു പ്രതികളിൽ ഈ ഭാഗം വ്യത്യാസങ്ങളോടെ കാണുന്നു.
  rationale: നൽകിയ ഗ്രീക്ക് പാഠത്തിൽ വാക്യം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും ഇരട്ട ചതുരക്കുറികൾ അതിന്റെ പാഠവിമർശനപ്രശ്നം സൂചിപ്പിക്കുന്നു. വാക്യം വിവർത്തനം ചെയ്യുകയും യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുകയും ചെയ്യുന്നത് തെളിവിനെ മൗനമായി തീർപ്പാക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, മാന്യവും സ്വാഭാവികവുമായ ശൈലി. പാഠത്തിൽ ഇല്ലാത്ത ശക്തമായ ബന്ധകമോ വ്യാഖ്യാനാത്മക ദൈവശാസ്ത്രവിശദീകരണമോ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘ഉയിർത്തെഴുന്നേറ്റശേഷം’ എന്ന ഭാഗത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
