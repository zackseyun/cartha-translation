theological_decisions:
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: മുൻസന്ദർഭമനുസരിച്ച് ഉയിർത്തെഴുന്നേറ്റ യേശുവാണ് ശിഷ്യരോടൊപ്പം പ്രവർത്തിക്കുന്നത്.
  alternative: ദൈവത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
  rationale: 16:19-ലെ ‘കർത്താവ്’ യേശുവിനെ സൂചിപ്പിക്കുന്നു; എങ്കിലും മുഖ്യപാഠത്തിൽ ‘കർത്താവ്’ എന്ന ശീർഷകം മാത്രമാണ് നിലനിർത്തിയത്.
- issue: അടയാളങ്ങളുടെ പ്രവർത്തനം
  choice: അടയാളങ്ങൾ പ്രഖ്യാപിത സന്ദേശത്തെ ദൈവികമായി ഉറപ്പിക്കുന്ന മാർഗമായി അവതരിപ്പിക്കപ്പെടുന്നു.
  alternative: സാധൂകരണാർഥം ഊന്നാതെ, അടയാളങ്ങൾ പ്രസംഗത്തെ തുടർന്ന് സംഭവിച്ചു എന്ന വായന.
  rationale: ‘സന്ദേശത്തെ ഉറപ്പിച്ചുകൊണ്ട്’ എന്ന ക്രിയാഭാഗം ‘അടയാളങ്ങളിലൂടെ’ എന്ന ഉപകരണഭാഗവുമായി വ്യാകരണപരമായി ബന്ധപ്പെടുന്നു; അടയാളങ്ങൾ എത്രകാലം തുടരണം എന്നതിനെക്കുറിച്ച് വാക്യത്തിന് അതീതമായ അവകാശവാദം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പ്രസംഗിച്ചു’ സഭാപരമായി പരിചിതമാണെങ്കിലും ഇവിടെ പൊതുവായ പരസ്യപ്രഖ്യാപനത്തിന്റെ അർഥത്തിലാണ്. മൂലത്തിലെ ἐπακολουθούντων എന്ന പദത്തിന്റെ യഥാർഥ ബന്ധത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
