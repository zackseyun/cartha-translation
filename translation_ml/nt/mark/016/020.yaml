source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: ml
  text: അവർ പുറപ്പെട്ട് എല്ലായിടത്തും പ്രസംഗിച്ചു. കർത്താവ് അവരോടൊപ്പം പ്രവർത്തിക്കുകയും തുടർന്നുവന്ന അടയാളങ്ങളിലൂടെ സന്ദേശത്തെ[a] ഉറപ്പിക്കുകയും ചെയ്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വചനത്തെ.’ ഇവിടെ ഗ്രീക്ക് പദമായ λόγος പ്രഖ്യാപിക്കപ്പെട്ട സന്ദേശത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘തുടർന്നുവന്ന അടയാളങ്ങൾ’ എന്നത് ‘കൂടെവന്ന അടയാളങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ അടയാളങ്ങൾ സന്ദേശത്തെയോ പ്രസംഗകരെയോ അനുഗമിച്ചു എന്നത് ഗ്രീക്ക് വാക്യം പ്രത്യേകം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
