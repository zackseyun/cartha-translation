revisions:
- from: പിന്നീട്[a], പതിനൊന്നുപേർ ഭക്ഷണത്തിനിരിക്കുമ്പോൾ യേശു അവർക്കു പ്രത്യക്ഷനായി. ഉയിർപ്പിക്കപ്പെട്ടശേഷം തന്നെ കണ്ടവരെ അവർ വിശ്വസിക്കാതിരുന്നതിനാൽ, അവരുടെ അവിശ്വാസത്തെയും ഹൃദയകാഠിന്യത്തെയും അവൻ ശാസിച്ചു.[b]
  to: പിന്നീട്[a], പതിനൊന്നുപേർ ഭക്ഷണത്തിനായി ചാരിക്കിടന്നിരുന്നപ്പോൾ, അവൻ അവർക്കു പ്രത്യക്ഷനായി. ഉയിർപ്പിക്കപ്പെട്ട അവനെ കണ്ടവരെ അവർ വിശ്വസിക്കാതിരുന്നതിനാൽ, അവരുടെ അവിശ്വാസത്തെയും ഹൃദയകാഠിന്യത്തെയും അവൻ ശാസിച്ചു.[b][c]
  rationale: The revision resolves the ambiguous reflexive construction, represents the meal-reclining posture more fully, and retains the passive resurrection wording. It also adds a lexical-alternative footnote for the disputed stylistic choice between a passive ‘raised’ expression and an active-style ‘risen’ expression, without altering the source meaning or introducing doctrinal interpretation.
