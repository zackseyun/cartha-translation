id: MRK.16.14
reference: Mark 16:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: ml
  text: പിന്നീട്[a], പതിനൊന്നുപേർ ഭക്ഷണത്തിനായി ചാരിക്കിടന്നിരുന്നപ്പോൾ, അവൻ അവർക്കു പ്രത്യക്ഷനായി. ഉയിർപ്പിക്കപ്പെട്ട അവനെ കണ്ടവരെ അവർ വിശ്വസിക്കാതിരുന്നതിനാൽ, അവരുടെ അവിശ്വാസത്തെയും ഹൃദയകാഠിന്യത്തെയും അവൻ ശാസിച്ചു.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിനുശേഷം.’
    reason: lexical_alternative
  - marker: b
    text: ‘ഭക്ഷണത്തിനായി ചാരിക്കിടന്നിരുന്നപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം, ഭക്ഷണം കഴിക്കുമ്പോൾ ചാരിക്കിടക്കുന്ന അന്നത്തെ പതിവ് ശരീരഭാവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘അവൻ ഉയിർത്തെഴുന്നേറ്റതായി കണ്ടവരെ.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘ഉയിർപ്പിക്കപ്പെട്ട അവനെ കണ്ടവരെ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: പിന്നീട്
  rationale: തുടർന്നുണ്ടായ പ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്ന കാലക്രിയാവിശേഷണം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സംഭവക്രമം നിലനിർത്തുന്നു.
- source_word: ἀνακειμένοις
  choice: ഭക്ഷണത്തിനിരിക്കുമ്പോൾ
  rationale: പുരാതനകാലത്തെ ഭക്ഷണവേളയിലെ ചാരിക്കിടക്കുന്ന പതിവ് ഭാവം അക്ഷരാർഥത്തിൽ അനുകരിക്കാതെ, സന്ദർഭത്തിലെ ഭക്ഷണസാഹചര്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; സാംസ്കാരിക വിശദാംശം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τοῖς ἕνδεκα
  choice: പതിനൊന്നുപേർ
  rationale: യൂദാസിന്റെ നഷ്ടത്തിനുശേഷമുള്ള അപ്പൊസ്തലസംഘത്തെ ലളിതമായും കൃത്യമായും സൂചിപ്പിക്കുന്നു; αὐτοῖς വേറിട്ട മലയാള സർവനാമമായ ‘അവർക്കു’ എന്നതിൽ പ്രതിഫലിക്കുന്നു.
- source_word: ἐφανερώθη
  choice: പ്രത്യക്ഷനായി
  rationale: ഉയിർപ്പിനുശേഷമുള്ള പ്രത്യക്ഷതയുടെ സന്ദർഭത്തിൽ ഗ്രീക്ക് നിഷ്ക്രിയരൂപത്തിന്റെ സ്വാഭാവിക മലയാള സമാനപ്രയോഗം.
- source_word: ὠνείδισεν
  choice: ശാസിച്ചു
  rationale: ശക്തമായ വാക്കാലുള്ള കുറ്റപ്പെടുത്തൽ വ്യക്തവും മാന്യവുമായ സമകാലിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἀπιστίαν
  choice: അവിശ്വാസം
  rationale: ലഭിച്ച സാക്ഷ്യം വിശ്വസിക്കാതിരുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന നാമരൂപം.
- source_word: σκληροκαρδίαν
  choice: ഹൃദയകാഠിന്യം
  rationale: പ്രതിരോധിക്കുന്ന ആന്തരിക മനോഭാവത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകം നിലനിർത്തുന്നു; ‘ദുശ്ശാഠ്യം’ എന്ന വ്യാഖ്യാനാത്മക ലഘൂകരണം ഒഴിവാക്കുന്നു.
- source_word: θεασαμένοις
  choice: കണ്ടവരെ
  rationale: ഉയിർപ്പിക്കപ്പെട്ട യേശുവിനെ നേരിൽ കണ്ട സാക്ഷികളെ ലളിതമായും നേരിട്ടും സൂചിപ്പിക്കുന്നു.
- source_word: ἐγηγερμένον
  choice: ഉയിർപ്പിക്കപ്പെട്ടശേഷം
  rationale: ἐγείρω എന്ന ക്രിയയുടെ perfect passive participle-ലുള്ള നിഷ്ക്രിയതയും ഉയിർപ്പിന്റെ പൂർത്തിയായ അവസ്ഥയും കഴിയുന്നത്ര സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὐκ ἐπίστευσαν
  choice: അവർ വിശ്വസിക്കാതിരുന്നതിനാൽ
  rationale: ὅτι അവതരിപ്പിക്കുന്ന കാരണബന്ധവും പ്രത്യക്ഷതയ്ക്കുമുമ്പുണ്ടായ വിശ്വസിക്കാതിരിക്കലും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ἐγηγερμένον എന്നതിലെ ഉയിർപ്പിന്റെ നിഷ്ക്രിയ പ്രയോഗം
  choice: ഉയിർപ്പിക്കപ്പെട്ടശേഷം തന്നെ കണ്ടവർ
  alternative: ഉയിർത്തെഴുന്നേറ്റവനായി തന്നെ കണ്ടവർ
  rationale: ഗ്രീക്ക് perfect passive participle-നെ സജീവമോ സ്വപ്രേരിതമോ ആയ രൂപത്തിലേക്ക് മാറ്റാതെ നിഷ്ക്രിയത നിലനിർത്തുന്നു; പ്രവർത്തകനെ വാക്യത്തിൽ ചേർത്ത് വ്യാഖ്യാനം വികസിപ്പിക്കുന്നില്ല.
- issue: σκληροκαρδία എന്നതിന്റെ രൂപകശക്തി
  choice: ഹൃദയകാഠിന്യം
  alternative: ദുശ്ശാഠ്യം
  rationale: ആത്മീയ പ്രതിരോധത്തെക്കുറിച്ചുള്ള ബൈബിൾ രൂപകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാള വാക്യങ്ങളാക്കി; കാരണബന്ധവും ആശയക്രമവും നിലനിർത്തി. ‘ഹൃദയകാഠിന്യം’ എന്ന ബൈബിൾ രൂപകവും ‘ഉയിർപ്പിക്കപ്പെട്ട’ എന്ന നിഷ്ക്രിയ ഉയിർപ്പുപ്രയോഗവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
