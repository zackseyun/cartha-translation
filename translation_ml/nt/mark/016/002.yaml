  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്കിലെ പദക്രമം യാന്ത്രികമായി പകർത്താതെ സമയസൂചനകൾ വ്യക്തമായി ക്രമപ്പെടുത്തി; ചരിത്രവർത്തമാനകാലവും സമയബന്ധത്തിലെ യഥാർഥമായ ചെറിയ അവ്യക്തതയും നിലനിർത്തി.
