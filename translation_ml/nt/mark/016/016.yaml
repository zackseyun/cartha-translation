  source_fidelity: The Malayalam accurately reflects the two substantival aorist participles, their coordination in the first clause, the future passive outcomes, and the contrast introduced by δέ. “വിശ്വസിക്കുകയും സ്നാനം ഏൽക്കുകയും ചെയ്തവൻ” preserves the description of the person who believed and was baptized without turning baptism into an explicitly stated causal mechanism. “അവിശ്വസിച്ചവൻ” retains the verbal contrast with “വിശ്വസിച്ചവൻ.”
  naturalness: The wording is clear, idiomatic modern standard Malayalam with an appropriately dignified scriptural register. “സ്നാനം ഏൽക്കുക” is an established and natural ecclesial expression for receiving baptism. “ശിക്ഷാവിധിക്കു വിധേയനാകും” is somewhat formal, but it is natural and suitably conveys the adverse judicial result.
  terminology: “രക്ഷിക്കപ്പെടും” appropriately conveys σωθήσεται in its soteriological context. “സ്നാനം ഏൽക്കുക” preserves the passive sense of βαπτισθείς. “ശിക്ഷാവിധിക്കു വിധേയനാകും” adequately represents κατακριθήσεται as condemnation/adverse sentence, without importing a particular doctrinal interpretation.
