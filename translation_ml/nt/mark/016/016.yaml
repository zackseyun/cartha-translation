  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: ml
  text: വിശ്വസിക്കുകയും സ്നാനം ഏൽക്കുകയും ചെയ്തവൻ രക്ഷിക്കപ്പെടും[a][b]; എന്നാൽ അവിശ്വസിച്ചവൻ ശിക്ഷാവിധിക്കു വിധേയനാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “വിശ്വസിക്കുകയും സ്നാനം ഏൽക്കുകയും ചെയ്യുന്നവൻ രക്ഷിക്കപ്പെടും; എന്നാൽ വിശ്വസിക്കാത്തവൻ ശിക്ഷാവിധിക്കു വിധേയനാകും.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “വിശ്വസിച്ചും സ്നാനം ഏറ്റും കഴിഞ്ഞവൻ.”'
    reason: aspectual_alternative
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: വിശ്വസിച്ചവൻ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന ഏകവചന ഭൂതകാല പങ്കാളിത്തരൂപം ഭാവിയിലെ ഫലത്തിനു മുമ്പുള്ള വിശ്വാസപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘വിശ്വസിച്ചവൻ’ പ്രതിനിധാന ഏകവചനവും പൂർത്തിയായ പ്രവൃത്തിയുടെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: βαπτισθεὶς
  choice: സ്നാനം ഏൽക്കുകയും ചെയ്തവൻ
  rationale: ഭൂതകാല നിഷ്ക്രിയ പങ്കാളിത്തരൂപത്തിന്റെ മുൻകാലബന്ധവും നിഷ്ക്രിയഭാവവും ‘സ്നാനം ഏൽക്കുക’ വ്യക്തമാക്കുന്നു; ആദ്യ പങ്കാളിത്തരൂപത്തോടൊപ്പം ചേർന്ന് ഒരേ വ്യക്തിയെ വിശേഷിപ്പിക്കുന്നു.
- source_word: σωθήσεται
  choice: രക്ഷിക്കപ്പെടും
  rationale: ഭാവികാല നിഷ്ക്രിയരൂപവും ഈ സന്ദർഭത്തിലെ രക്ഷാസംബന്ധമായ അർഥവും നേരിട്ട് പകരുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ὁ δὲ ἀπιστήσας
  choice: എന്നാൽ അവിശ്വസിച്ചവൻ
  rationale: ἀπιστέω എന്ന ക്രിയയുടെ നിഷേധാത്മക വൈരുധ്യം ‘അവിശ്വസിക്കുക’ നേരിട്ട് നിലനിർത്തുന്നു. ‘എന്നാൽ’ രണ്ടു ഫലങ്ങൾക്കിടയിലെ δέയുടെ വൈരുധ്യബലം വ്യക്തമാക്കുന്നു.
- source_word: κατακριθήσεται
  choice: ശിക്ഷാവിധിക്കു വിധേയനാകും
  rationale: പ്രതികൂല ന്യായവിധിയെയും അതിന്റെ അപലപനഫലത്തെയും സൂചിപ്പിക്കുന്ന ഭാവികാല നിഷ്ക്രിയരൂപം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: καὶ
  choice: -ഉം ... -ഉം / ‘കയും’ സംയോജനം
  rationale: രണ്ട് പങ്കാളിത്തപ്രവൃത്തികളെയും ലളിതമായി ഏകോപിപ്പിക്കുന്ന ഗ്രീക്ക് സംയോജകത്തിന്റെ ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ആദ്യവും രണ്ടാമത്തെയും വാക്യഭാഗങ്ങൾക്കിടയിലെ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസം, സ്നാനം, രക്ഷ എന്നിവ തമ്മിലുള്ള ബന്ധം
  choice: രക്ഷിക്കപ്പെടുന്ന വ്യക്തിയുടെ വിവരണമായി വിശ്വാസവും സ്നാനവും രണ്ടും നേരിട്ട് ചേർത്തുപറയുന്നു; സ്നാനത്തെ രക്ഷയുടെ കാര്യകാരണമായി പ്രത്യേകം വ്യാഖ്യാനിക്കുകയോ അതിന്റെ ബന്ധം ദുർബലപ്പെടുത്തുകയോ ചെയ്യുന്നില്ല.
  alternative: സ്നാനം ഉപകരണപരമായി അനിവാര്യമാണെന്ന് കൂടുതൽ ശക്തമായി വ്യാഖ്യാനിക്കുക; അല്ലെങ്കിൽ സ്നാനത്തെ യാദൃച്ഛികവും പ്രസക്തിയില്ലാത്തതുമായ ഘടകമായി ചുരുക്കുക.
  rationale: ഗ്രീക്ക് ആദ്യ വാക്യഭാഗത്തിൽ വിശ്വസിച്ചതും സ്നാനം ഏറ്റതും ചേർത്ത് രക്ഷിക്കപ്പെടുന്ന വ്യക്തിയെ വിവരിക്കുന്നു; എന്നാൽ രണ്ടാം ഭാഗത്തിൽ ശിക്ഷാവിധിയുടെ കാരണംപോലെ എടുത്തുപറയുന്നത് അവിശ്വാസമാണ്, സ്നാനം ഏൽക്കാതിരുന്നതല്ല. അതിനാൽ വാചകത്തിലെ സിദ്ധാന്തപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: പ്രതിനിധാനപരമായ പുല്ലിംഗ ഏകവചനഘടന
  choice: ‘ചെയ്തവൻ’ എന്ന ഏകവചന പ്രതിനിധാനരൂപം ഉപയോഗിക്കുന്നു.
  alternative: ‘വിശ്വസിക്കുന്നവർ’ എന്ന ബഹുവചനം അല്ലെങ്കിൽ ‘ആരെങ്കിലും’ എന്ന പൊതുപദപ്രയോഗം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ നാമപദപ്രവർത്തിയുള്ള പുല്ലിംഗ ഏകവചന പങ്കാളിത്തരൂപങ്ങൾ പൊതുവായ പ്രതിനിധാനബലമുള്ളവയാണ്. മലയാളത്തിലെ ‘-വൻ’ രൂപം വചനഘടന നിലനിർത്തുന്നു; ഇത് പുരുഷന്മാർക്കു മാത്രമുള്ള പരാമർശമായി ഉദ്ദേശിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘സ്നാനം ഏൽക്കുക’ സഭാപരമായി പരിചിതവും βαπτισθεὶς എന്ന നിഷ്ക്രിയരൂപത്തിന് യോജിച്ചതുമാണ്. ‘ശിക്ഷാവിധിക്കു വിധേയനാകും’ പ്രതികൂല ന്യായവിധിയുടെ ആശയം വ്യക്തമായി നൽകുന്നു.
