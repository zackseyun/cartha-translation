id: MRK.16.12
reference: Mark 16:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: ml
  text: ഇതിനുശേഷം, അവരിൽ രണ്ടുപേർ നാട്ടിൻപുറത്തേക്കു നടന്നുപോകുമ്പോൾ, അവൻ മറ്റൊരു രൂപത്തിൽ[a] അവർക്കു പ്രത്യക്ഷനായി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വ്യത്യസ്തമായ രൂപത്തിൽ.”
    reason: lexical_alternative
  - marker: b
    text: “നാട്ടിൻപുറത്തേക്ക്” എന്നതിനു പകരം “ഒരു വയലിലേക്ക്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: ഇതിനുശേഷം
  rationale: μετά + accusative സൂചിപ്പിക്കുന്ന കാലക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; δέ ഇവിടെ ആഖ്യാനത്തിന്റെ പുനരാരംഭമാണ്.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: അവരിൽ രണ്ടുപേർക്ക്
  rationale: വലിയ കൂട്ടത്തിൽ ഉൾപ്പെട്ട രണ്ടുപേരെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ വിഭക്തിപ്രയോഗം ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: περιπατοῦσιν … πορευομένοις
  choice: നടന്നുപോകുമ്പോൾ
  rationale: ഒരേസമയം നടക്കുന്ന രണ്ടു പങ്കുപദങ്ങളുടെയും—നടക്കുക, ലക്ഷ്യത്തിലേക്കു പോകുക—അർഥം അനാവശ്യ ആവർത്തനമില്ലാതെ ഒരുമിച്ചു നൽകുന്നു.
- source_word: ἐφανερώθη
  choice: പ്രത്യക്ഷനായി
  rationale: ഈ പുനരുത്ഥാനാനന്തര സന്ദർഭത്തിൽ φανερόω-യുടെ കർമണിപ്രയോഗം പ്രത്യക്ഷപ്പെടുക എന്ന സ്വാഭാവിക അർഥത്തിലാണ്.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: മറ്റൊരു രൂപത്തിൽ
  rationale: ἑτέρα സൂചിപ്പിക്കുന്ന വ്യത്യസ്തതയും μορφή സൂചിപ്പിക്കുന്ന രൂപം/ബാഹ്യപ്രത്യക്ഷതയും വിശദീകരിച്ചു തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: εἰς ἀγρόν
  choice: നാട്ടിൻപുറത്തേക്ക്
  rationale: ἀγρός ഒറ്റ വയലിനെയും ഗ്രാമപ്രദേശത്തെയും സൂചിപ്പിക്കാം; ഈ ആഖ്യാനസന്ദർഭത്തിൽ ഗ്രാമപ്രദേശം എന്ന സാധ്യതയുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐν ἑτέρᾳ μορφῇ വിവരിക്കുന്ന പുനരുത്ഥാന പ്രത്യക്ഷതയുടെ സ്വഭാവം
  choice: മറ്റൊരു രൂപത്തിൽ
  alternative: വ്യത്യസ്തമായ രൂപത്തിൽ / വ്യത്യസ്തമായ ഭാവത്തിൽ
  rationale: രൂപത്തിലെ മാറ്റം എങ്ങനെ സംഭവിച്ചു എന്നോ അത് ദർശകരുടെ ഗ്രഹണവുമായി എങ്ങനെ ബന്ധപ്പെട്ടിരുന്നു എന്നോ വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വിശദീകരണം ചേർക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ആധുനികവും മാന്യവുമായ മലയാളം. ഗ്രീക്ക് പങ്കുപദങ്ങളുടെ ആവർത്തനം ‘നടന്നുപോകുമ്പോൾ’ എന്ന ഒറ്റ സ്വാഭാവിക പ്രയോഗത്തിൽ ഉൾപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
