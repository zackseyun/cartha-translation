id: MRK.16.7
reference: Mark 16:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: ml
  text: 'എന്നാൽ നിങ്ങൾ പോയി[a] അവന്റെ ശിഷ്യന്മാരോടും പത്രോസിനോടും പറയുക: ‘അവൻ നിങ്ങൾക്കു മുമ്പായി ഗലീലയിലേക്കു[b] പോകുന്നു. അവിടെ നിങ്ങൾ അവനെ കാണും—അവൻ നിങ്ങളോടു പറഞ്ഞതുപോലെതന്നെ.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ ശിഷ്യന്മാർ’ എന്നതിൽനിന്ന് പത്രോസിനെ വേർതിരിച്ച് പ്രത്യേകം പേരെടുത്തുപറയുന്നു. തന്റെ നിഷേധത്തിനുശേഷമുള്ള പത്രോസിന്റെ പുനഃസ്ഥാപനത്തെ ഇത് സൂചിപ്പിക്കാമെങ്കിലും, ഗ്രീക്ക് മൂലപാഠം ‘പ്രത്യേകിച്ച് പത്രോസിനോട്’ എന്നു വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: ‘ഗലീലയിലേക്കു’ എന്നതിനെ ‘ഗലീലയിലേക്ക്’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ ഗ്രീക്ക് മുൻവിന്യാസപദം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ദിശയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുമ്പുള്ള സാഹചര്യത്തിൽനിന്ന് കല്പിക്കപ്പെടുന്ന പ്രവർത്തനത്തിലേക്കുള്ള ശക്തമായ വൈരുധ്യവും മാറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὑπάγετε
  choice: നിങ്ങൾ പോയി
  rationale: ബഹുവചന കല്പനയുടെ അടിയന്തരത നിലനിർത്തിക്കൊണ്ട്, തുടർന്നുള്ള ‘പറയുക’ എന്ന കല്പനയുമായി സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: εἴπατε
  choice: പറയുക
  rationale: ദത്തിവിലുള്ള സന്ദേശസ്വീകർത്താക്കളെയും തുടർന്നുള്ള സന്ദേശത്തിന്റെ ഉള്ളടക്കത്തെയും ചേർത്ത് അവതരിപ്പിക്കാൻ യോജിച്ച സാധാരണ മലയാളപ്രയോഗം.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരോട്
  rationale: യേശുവിന്റെ ശിഷ്യന്മാർ എന്ന ഉടമസ്ഥബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: καὶ τῷ Πέτρῳ
  choice: പത്രോസിനോടും
  rationale: ഗ്രീക്കിലെ ലളിതമായ ഏകോപനം സംരക്ഷിക്കുന്നു; ‘പ്രത്യേകിച്ച്’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ὅτι
  choice: നേരിട്ടുള്ള ഉദ്ധരണിയായി
  rationale: അറിയിക്കേണ്ട സന്ദേശത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: Προάγει ὑμᾶς
  choice: അവൻ നിങ്ങൾക്കു മുമ്പായി ... പോകുന്നു
  rationale: യേശു അവർക്കു മുന്നേ പോകുന്നു എന്ന ദിശാസൂചനയും വർത്തമാനകാലഭാവവും നിലനിർത്തുന്നു.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ഗലീലയിലേക്കു
  rationale: εἰς-ന്റെ ലക്ഷ്യദിശ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ഗലീലയിൽ പ്രവേശിച്ച്’ എന്നു അതിവ്യക്തമാക്കുന്നില്ല.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: ഗലീലയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സ്ഥലക്രിയാവിശേഷണം.
- source_word: αὐτὸν ὄψεσθε
  choice: നിങ്ങൾ അവനെ കാണും
  rationale: ഭാവികാലത്തിലുള്ള കാണൽ/സമ്മുഖീകരണം ലളിതമായും കൃത്യമായും നൽകുന്നു.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: അവൻ നിങ്ങളോടു പറഞ്ഞതുപോലെതന്നെ
  rationale: യേശുവിന്റെ മുൻവാക്കുമായി കൃത്യമായ പൊരുത്തം സൂചിപ്പിക്കുന്ന καθώς-ന്റെ ബലം ‘പോലെതന്നെ’ വഴി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവന്റെ ശിഷ്യന്മാർ’ എന്നതിനു ശേഷം പത്രോസിനെ പ്രത്യേകം പരാമർശിക്കുന്നത്
  choice: ‘അവന്റെ ശിഷ്യന്മാരോടും പത്രോസിനോടും’ എന്ന ലളിതമായ ഏകോപനം നിലനിർത്തി.
  alternative: ‘അവന്റെ ശിഷ്യന്മാരോട്, പ്രത്യേകിച്ച് പത്രോസിനോട്’ അല്ലെങ്കിൽ ‘പത്രോസ് ഉൾപ്പെടെയുള്ള അവന്റെ ശിഷ്യന്മാരോട്’.
  rationale: പത്രോസിന്റെ പ്രത്യേക പരാമർശത്തിന് പുനഃസ്ഥാപനവുമായി ബന്ധപ്പെട്ട കഥാപരവും ഇടയപരവുമായ പ്രാധാന്യം ഉണ്ടാകാം; എന്നാൽ ഗ്രീക്ക് ‘പ്രത്യേകിച്ച്’ എന്നോ ‘ഉൾപ്പെടെ’ എന്നോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സൂചനയും സംഘർഷവും വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കല്പനയുടെ ചലനാത്മകതയ്ക്കായി ‘പോയി ... പറയുക’ ഉപയോഗിച്ചു. പത്രോസിനെ പ്രത്യേകം പേരെടുത്തുപറയുന്നതിലെ വ്യാഖ്യാനസാധ്യത മുഖ്യവാചകത്തിൽ പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
