  source_fidelity: മുഖ്യവാചകം ഗ്രീക്ക് പാഠത്തിന്റെ കല്പനകളെയും (‘പോയി ... പറയുക’), പത്രോസിന്റെ പ്രത്യേക പരാമർശത്തെയും, യേശു ശിഷ്യന്മാർക്കു മുമ്പായി ഗലീലയിലേക്കു പോകുന്നതെയും, അവിടെ അവർ അവനെ കാണുമെന്ന വാഗ്ദാനത്തെയും കൃത്യമായി നൽകുന്നു. ‘നിങ്ങൾക്കു മുമ്പായി’ προάγει ὑμᾶς എന്ന ആശയം യോജ്യമായി സംരക്ഷിക്കുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. ‘അവൻ നിങ്ങളോടു പറഞ്ഞതുപോലെതന്നെ’ എന്ന പ്രയോഗം καθώς-ന്റെ പൊരുത്തഭാവം വ്യക്തമായി നൽകുന്നു.
  terminology: ‘ശിഷ്യന്മാർ,’ ‘പത്രോസ്,’ ‘ഗലീല’ എന്നിവ സ്ഥിരവും യോജ്യവുമായ പ്രയോഗങ്ങളാണ്. ‘പ്രത്യേകിച്ച്’ പോലുള്ള വ്യാഖ്യാനവാക്കുകൾ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ καὶ τῷ Πέτρῳ എന്ന ലളിതമായ ഏകോപനം നിലനിർത്തിയിരിക്കുന്നു.
  issues:
