- from: 'എന്നാൽ നിങ്ങൾ പോയി[a] അവന്റെ ശിഷ്യന്മാരോടും പത്രോസിനോടും പറയുക: ‘അവൻ നിങ്ങൾക്കു മുമ്പായി ഗലീലയിലേക്കു പോകുന്നു. അവിടെ നിങ്ങൾ അവനെ കാണും[b]—അവൻ നിങ്ങളോടു പറഞ്ഞതുപോലെതന്നെ.’'
  to: 'എന്നാൽ നിങ്ങൾ പോയി[a] അവന്റെ ശിഷ്യന്മാരോടും പത്രോസിനോടും പറയുക: ‘അവൻ നിങ്ങൾക്കു മുമ്പായി ഗലീലയിലേക്കു[b] പോകുന്നു. അവിടെ നിങ്ങൾ അവനെ കാണും—അവൻ നിങ്ങളോടു പറഞ്ഞതുപോലെതന്നെ.’'
  rationale: ഗ്രീക്ക് പാഠത്തോടും ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലോടും മുഖ്യവാചകം വിശ്വസ്തമാണ്. അടിക്കുറിപ്പ് b-യുടെ ആങ്കർ അതിന്റെ യഥാർത്ഥ പരാമർശമായ ‘ഗലീലയിലേക്കു’ എന്ന പദത്തിലേക്കു മാറ്റി; അടിക്കുറിപ്പിന്റെ മലയാളവും ലക്ഷ്യദിശയെക്കുറിച്ചുള്ള അതിന്റെ പരിമിതമായ ലെക്സിക്കൽ കുറിപ്പിനൊത്തു ചെറുതായി വ്യക്തമാക്കി.
