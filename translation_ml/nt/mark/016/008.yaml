id: MRK.16.8
reference: Mark 16:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: ml
  text: അവർ കല്ലറയിൽനിന്ന് പുറത്തുവന്ന് ഓടിപ്പോയി; വിറയലും അമ്പരപ്പും അവരെ പിടികൂടിയിരുന്നു. അവർ ആരോടും ഒന്നും പറഞ്ഞില്ല; കാരണം അവർ ഭയപ്പെട്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികൾ ‘ഹ്രസ്വാന്ത്യം’ എന്നു വിളിക്കപ്പെടുന്ന ഈ ഭാഗം ചേർക്കുന്നു: “തങ്ങളോടു കൽപിച്ചിരുന്നതെല്ലാം അവർ പത്രോസിനോടൊപ്പമുണ്ടായിരുന്നവരെ ചുരുക്കമായി അറിയിച്ചു. അതിനുശേഷം യേശു തന്നെയും അവരിലൂടെ കിഴക്കുമുതൽ പടിഞ്ഞാറുവരെ നിത്യരക്ഷയുടെ വിശുദ്ധവും നശിക്കാത്തതുമായ പ്രഘോഷണം അയച്ചു. ആമേൻ.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: പുറത്തുവന്ന്
  rationale: സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന ഭൂതകാല ക്രിയാവിശേഷണരൂപം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἔφυγον
  choice: ഓടിപ്പോയി
  rationale: φεύγωയുടെ പെട്ടെന്നുള്ള രക്ഷപ്പെടൽ എന്ന ശക്തി സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: μνημείου
  choice: കല്ലറയിൽനിന്ന്
  rationale: ഉയിർത്തെഴുന്നേൽപ്പിന്റെ വിവരണസന്ദർഭത്തിൽ μνημεῖον എന്നതിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: εἶχεν αὐτὰς
  choice: അവരെ പിടികൂടിയിരുന്നു
  rationale: വികാരാവസ്ഥകൾ അവരെ ശക്തമായി കീഴടക്കിയെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: τρόμος
  choice: വിറയൽ
  rationale: ഭയം മൂലമുള്ള ശരീരവിറയലിനെ നേരിട്ട് സൂചിപ്പിക്കുകയും പിന്നീടുള്ള ഭയപ്രസ്താവനയുമായി അനാവശ്യമായി ലയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἔκστασις
  choice: അമ്പരപ്പ്
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്ന ഞെട്ടലോടുകൂടിയ വിസ്മയാവസ്ഥയെ നൽകുന്നു; ആധുനികമായി തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘പരമാനന്ദം’ ഒഴിവാക്കുന്നു.
- source_word: οὐδενὶ οὐδὲν
  choice: ആരോടും ഒന്നും പറഞ്ഞില്ല
  rationale: ഗ്രീക്കിലെ ഊന്നലുള്ള സമ്പൂർണ നിഷേധം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐφοβοῦντο
  choice: അവർ ഭയപ്പെട്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടരുന്ന ഭയാവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: അവസാന വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു; വാക്യത്തിന്റെ പെട്ടെന്നുള്ള സമാപനം അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: മർക്കോസ് 16:8-നുശേഷമുള്ള ചതുരബ്രാക്കറ്റിലുള്ള ഹ്രസ്വാന്ത്യത്തിന്റെ പാഠസ്ഥാനം
  choice: പ്രധാനവാക്യത്തിൽ ഉൾപ്പെടുത്താതെ പാഠഭേദമായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
  alternative: ഹ്രസ്വാന്ത്യം പ്രധാനവാക്യത്തിൽ ഉൾപ്പെടുത്തുക, അല്ലെങ്കിൽ ഇരുവിധ അന്ത്യങ്ങളും പ്രധാനപാഠത്തിൽ അച്ചടിക്കുക.
  rationale: SBLGNT ഈ ഭാഗം ഇരട്ട ചതുരബ്രാക്കറ്റിൽ നൽകുന്നത് മുഖ്യപാഠത്തിന്റെ ഭാഗമല്ലെന്ന സമ്പാദകവിധിയെ സൂചിപ്പിക്കുന്നു. അതേസമയം കൈയെഴുത്തുപ്രതി സാക്ഷ്യം സുതാര്യമാക്കാൻ മുഴുവൻ പാഠഭേദവും അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്കിലെ ഭയം, ശരീരവിറയൽ, ഞെട്ടലോടുകൂടിയ അമ്പരപ്പ് എന്നിവ വേർതിരിച്ചു നിലനിർത്തുന്നു. അവസാന γάρ-ന്റെ വിശദീകരണസ്വഭാവം ‘കാരണം’ വഴി നൽകുമ്പോഴും വാക്യത്തിന്റെ അസാധാരണമായ പെട്ടെന്നുള്ള അവസാനത്തെ വിശദീകരിച്ച് മിനുക്കുന്നില്ല.
