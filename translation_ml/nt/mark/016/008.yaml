  verdict: revise
  source_fidelity: 'മുഖ്യപാഠം ഗ്രീക്ക് വാക്യക്രമവും അർത്ഥവും നന്നായി പ്രതിഫലിപ്പിക്കുന്നു: സ്ത്രീകൾ കല്ലറയിൽനിന്ന് പുറത്തുവന്ന് ഓടിപ്പോയി; വിറയലും അമ്പരപ്പും അവരെ പിടികൂടി; അവർ ആരോടും ഒന്നും പറഞ്ഞില്ല, കാരണം അവർ ഭയപ്പെട്ടിരുന്നു. എന്നാൽ പാഠഭേദക്കുറിപ്പിൽ κήρυγμα എന്നത് സാധാരണ ‘സന്ദേശം’ എന്നതിലുപരി ഔദ്യോഗികമായ ‘പ്രഘോഷണം/പ്രഖ്യാപനം’ ആണ്; അതിന്റെ വിശുദ്ധവും നശിക്കാത്തതുമായ സ്വഭാവം സംരക്ഷിക്കണം.'
  naturalness: ‘വിറയലും അമ്പരപ്പും അവരെ പിടികൂടിയിരുന്നു,’ ‘ആരോടും ഒന്നും പറഞ്ഞില്ല,’ ‘അവർ ഭയപ്പെട്ടിരുന്നു’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. ‘ഓടിപ്പോയി’ ഇവിടെ φεύγωയുടെ അടിയന്തരമായ പിന്മാറ്റം ഉചിതമായി അറിയിക്കുന്നു.
  terminology: ‘കല്ലറ,’ ‘വിറയൽ,’ ‘അമ്പരപ്പ്,’ ‘നിത്യരക്ഷ’ എന്നിവ യോജിച്ചതാണ്. പാഠഭേദത്തിലെ ‘സന്ദേശം’ മാറ്റി ‘പ്രഘോഷണം’ ഉപയോഗിക്കുന്നത് κήρυγμαയുടെ പ്രഖ്യാപനസ്വഭാവം കൂടുതൽ കൃത്യമായി നൽകുന്നു. പാഠഭേദം മുഴുവൻ വാക്യത്തിന്റേതായതിനാൽ അടിക്കുറിപ്പുചിഹ്നം ‘കല്ലറ’യോടല്ല, വാക്യാന്ത്യത്തിൽ വരണം.
