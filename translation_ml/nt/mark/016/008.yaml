  to: അവർ കല്ലറയിൽനിന്ന് പുറത്തുവന്ന് ഓടിപ്പോയി; വിറയലും അമ്പരപ്പും അവരെ പിടികൂടിയിരുന്നു. അവർ ആരോടും ഒന്നും പറഞ്ഞില്ല; കാരണം അവർ ഭയപ്പെട്ടിരുന്നു.[a]
