id: MRK.16.18
reference: Mark 16:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: ml
  text: അവർ പാമ്പുകളെ കൈയിലെടുക്കും; മാരകമായ എന്തെങ്കിലും കുടിച്ചാലും അത് അവരെ ഒരുവിധത്തിലും ഉപദ്രവിക്കുകയില്ല. അവർ രോഗികളുടെമേൽ കൈകൾ വെക്കും; രോഗികൾ സുഖം പ്രാപിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില ആദ്യകാല കൈയെഴുത്തുപ്രതികളിൽ മർക്കോസ് 16:9–20 ഇല്ല; ഈ വാക്യം മർക്കോസിന്റെ ദീർഘസമാപ്തിയിൽ ഉൾപ്പെടുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ὄφεις
  choice: പാമ്പുകളെ
  rationale: സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗ്രീക്കിലെ അർഥം നേരിട്ട് നൽകുന്നതുമായ പദം.
- source_word: ἀροῦσιν
  choice: കൈയിലെടുക്കും
  rationale: αἴρω എന്നതിന്റെ ‘എടുക്കുക/ഉയർത്തുക’ എന്ന അർഥം പാമ്പുകളോടുള്ള ശാരീരിക പ്രവർത്തനമായി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κἂν
  choice: കുടിച്ചാലും
  rationale: καὶ ἐάν എന്ന നിബന്ധനാപ്രയോഗത്തിലെ concessive ഭാവം മലയാളത്തിലെ ‘-ആലും’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: θανάσιμόν τι
  choice: മാരകമായ എന്തെങ്കിലും
  rationale: ‘വിഷം’ എന്നു ചുരുക്കാതെ, മരണകാരണമാകാവുന്ന എന്തിനെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്കിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: οὐ μὴ ... βλάψῃ
  choice: ഒരുവിധത്തിലും ഉപദ്രവിക്കുകയില്ല
  rationale: οὐ μή എന്ന ഊന്നിയ നിഷേധവും βλάπτω എന്നതിന്റെ വിശാലമായ ‘ഹാനി വരുത്തുക’ എന്ന അർഥവും ഒരുമിച്ച് നൽകുന്നു.
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: രോഗികളുടെമേൽ കൈകൾ വെക്കും
  rationale: കൈകൾ ഒരാളുടെമേൽ വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം വ്യക്തവും ബൈബിൾഭാഷയ്ക്ക് യോജിച്ചതുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: καλῶς ἕξουσιν
  choice: അവർ സുഖം പ്രാപിക്കും
  rationale: അക്ഷരാർഥത്തിലെ ‘നന്നായിരിക്കും’ എന്നതിനേക്കാൾ രോഗികളുടെ സാഹചര്യത്തിൽ ഫലം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അസുഖത്തിൽനിന്നുള്ള സുഖപ്രാപ്തിയാണ് സന്ദർഭാർഥം.
theological_decisions:
- issue: വാഗ്ദാനം ചെയ്യുന്ന സംരക്ഷണത്തിന്റെയും സൗഖ്യത്തിന്റെയും സ്വഭാവം
  choice: വിശ്വാസികളോടൊപ്പമുള്ള അടയാളങ്ങളെക്കുറിച്ചുള്ള ഭാവികാല പ്രസ്താവനയായി വാക്യം നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ഇവ എല്ലാ കാലത്തുമുള്ള എല്ലാ വിശ്വാസികൾക്കും നിർബന്ധമായ മാനദണ്ഡമാണെന്നോ, അപ്പൊസ്തലിക കാലത്തേക്കു മാത്രമാണെന്നോ, പൂർണമായും പ്രതീകാത്മകമാണെന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ഈ വ്യാഖ്യാനപരമായ പരിധികളൊന്നും നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ സമുദായവിശേഷമായ നിലപാട് ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: മർക്കോസ് 16:9–20-ന്റെ പാഠവിമർശനസ്ഥിതി
  choice: നൽകിയിരിക്കുന്ന SBLGNT പാഠം വിവർത്തനം ചെയ്ത്, ദീർഘസമാപ്തിയുടെ കൈയെഴുത്തുപ്രതി പ്രശ്നം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: വാക്യം ഒഴിവാക്കുക അല്ലെങ്കിൽ മുഖ്യപാഠത്തിൽ ബ്രാക്കറ്റിലാക്കുക.
  rationale: നൽകിയ ഉറവിടവാക്യം വിവർത്തനം ചെയ്യേണ്ടതുണ്ട്; അതേസമയം ചില ആദ്യകാല കൈയെഴുത്തുപ്രതികളിൽ ഈ ഭാഗം ഇല്ലെന്ന സുപ്രധാന പാഠവ്യത്യാസം വായനക്കാരനിൽനിന്ന് മറയ്ക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘മാരകമായ എന്തെങ്കിലും’ എന്ന പ്രയോഗം ഉറവിടത്തിന്റെ വിശാലതയും ‘ഒരുവിധത്തിലും’ എന്നത് ഊന്നിയ നിഷേധവും നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
