  to: 'വിശ്വസിച്ചവരോടൊപ്പം ഈ അടയാളങ്ങൾ ഉണ്ടായിരിക്കും[a]: എന്റെ നാമത്തിൽ അവർ ഭൂതങ്ങളെ പുറത്താക്കും; പുതിയ ഭാഷകളിൽ[b] സംസാരിക്കും.'
