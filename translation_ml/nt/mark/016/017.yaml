  edition: SBLGNT
  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: ml
  text: 'വിശ്വസിച്ചവരോടൊപ്പം ഈ അടയാളങ്ങൾ ഉണ്ടായിരിക്കും[a]: എന്റെ നാമത്തിൽ അവർ ഭൂതങ്ങളെ പുറത്താക്കും; പുതിയ ഭാഷകളിൽ[b] സംസാരിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അനുഗമിക്കും’ അഥവാ ‘പിന്തുടരും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ ഇവിടെ ഈ അടയാളങ്ങൾ വിശ്വസിച്ചവരോടൊപ്പം ഉണ്ടായിരിക്കും എന്ന ആശയം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘നാവുകൾ’ എന്ന പദമാണ്; അതിന് ഭാഷകൾ എന്നും അർഥമുണ്ടാകാം. ഇവിടെ പറയുന്നത് സാധാരണ മനുഷ്യഭാഷകളെയാണോ മറ്റൊരു തരത്തിലുള്ള സംസാരത്തെയാണോ എന്ന് വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: അടയാളങ്ങൾ
  rationale: അത്ഭുതപ്രവൃത്തികൾ സാക്ഷ്യപ്പെടുത്തുന്ന ചിഹ്നങ്ങളാണെന്ന ഗ്രീക്ക് പദത്തിന്റെ സൂചന നിലനിർത്തുന്നു; ‘അത്ഭുതങ്ങൾ’ എന്നു മാത്രം പറയുന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: τοῖς πιστεύσασιν
  choice: വിശ്വസിച്ചവരെ
  rationale: വിശ്വാസത്തിലേക്കു വന്നവരെ പൊതുവായി സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു.
- source_word: ταῦτα
  choice: ഈ
  rationale: തുടർന്ന് പറയുന്ന അടയാളങ്ങളുടെ പട്ടികയിലേക്കു വിരൽചൂണ്ടുന്ന demonstrative നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: παρακολουθήσει
  choice: അനുഗമിക്കും
  rationale: അടയാളങ്ങൾ വിശ്വസിച്ചവരോടൊപ്പം ഉണ്ടാകുമെന്ന ആശയം നൽകുന്നു. വെറും കാലക്രമത്തിൽ പിന്നാലെ വരുന്നു എന്ന ധാരണയിൽ ഒതുക്കാതിരിക്കാൻ അടിക്കുറിപ്പിൽ അർഥവ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ അധികാരത്തിൽ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സ്ഥാപിതവുമായ പ്രയോഗം.
- source_word: δαιμόνια
  choice: ഭൂതങ്ങളെ
  rationale: δαιμόνια എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘അശുദ്ധാത്മാക്കൾ’ എന്ന വ്യത്യസ്ത പ്രയോഗം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἐκβαλοῦσιν
  choice: പുറത്താക്കും
  rationale: ബലമായി നീക്കിക്കളയുക എന്ന അർഥം ഭൂതോച്ചാടനസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: γλώσσαις
  choice: ഭാഷകളിൽ
  rationale: γλῶσσα എന്നതിന് ‘നാവ്’ എന്നും ‘ഭാഷ’ എന്നും അർഥമുണ്ട്. മലയാളത്തിൽ ‘നാവുകളിൽ സംസാരിക്കും’ അസ്വാഭാവികവും ശരീരാവയവത്തെക്കുറിച്ചുള്ള തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതുമാകുന്നതിനാൽ ‘ഭാഷകളിൽ’ ഉപയോഗിച്ച്, പ്രതിഭാസത്തിന്റെ സ്വഭാവം നിർവചിക്കപ്പെടുന്നില്ലെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: λαλήσουσιν
  choice: സംസാരിക്കും
  rationale: λαλέω എന്ന സാധാരണ സംസാരക്രിയയെ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καιναῖς
  choice: പുതിയ
  rationale: തരത്തിലോ ഗുണത്തിലോ ഉള്ള പുതുമയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘അപരിചിതമായ’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘പുതിയ ഭാഷകളിൽ സംസാരിക്കും’ എന്നതിലെ γλώσσαις സൂചിപ്പിക്കുന്ന പ്രതിഭാസം
  choice: മനുഷ്യഭാഷകളോ പ്രത്യേക ആത്മീയ ഉച്ചാരണങ്ങളോ എന്ന് മുഖ്യവാക്യത്തിൽ നിർണ്ണയിക്കാതെ ‘ഭാഷകളിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി അടിക്കുറിപ്പിൽ ഗ്രീക്കിന്റെ അർഥവ്യാപ്തി സൂചിപ്പിച്ചു.
  alternative: ‘പുതിയ നാവുകളിൽ’ അല്ലെങ്കിൽ ‘പുതിയ അന്യഭാഷകളിൽ’
  rationale: ഗ്രീക്ക് പദത്തിന് ‘നാവുകൾ’ എന്നും ‘ഭാഷകൾ’ എന്നും അർഥമുണ്ടെങ്കിലും ഇവിടെ പ്രതിഭാസത്തിന്റെ കൃത്യസ്വഭാവം വാക്യം നിർവചിക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അനുഗമിക്കും’ എന്നത് ബൈബിൾഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ‘ഭാഷകളിൽ’ സ്വാഭാവിക മലയാളമാണ്; ഗ്രീക്കിലെ രൂപകവും വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വവും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
