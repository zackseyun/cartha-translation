id: MRK.16.5
reference: Mark 16:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: ml
  text: അവർ കല്ലറയ്ക്കുള്ളിൽ കടന്നപ്പോൾ, വലത്തുവശത്ത് വെള്ള അങ്കി ധരിച്ച ഒരു യുവാവ്[a] ഇരിക്കുന്നത് കണ്ടു; അവർ അത്യന്തം പരിഭ്രമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൂതൻ.’ ഇവിടെ മർക്കോസ് അവനെ ‘യുവാവ്’ എന്നു വിവരിക്കുന്നു; എന്നാൽ വിശാലമായ സന്ദർഭവും സമാന്തര വിവരണങ്ങളും അവൻ ഒരു ദൂതനാണെന്നു സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: കടന്നപ്പോൾ
  rationale: സ്ത്രീലിംഗ ബഹുവചനത്തിലുള്ള aorist participle സന്ദർഭത്തിലെ സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു. പ്രധാന ക്രിയയോടുള്ള കാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘കടന്നപ്പോൾ’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: μνημεῖον
  choice: കല്ലറ
  rationale: അടക്കം ചെയ്ത സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഈ പദത്തിന് പുനരുത്ഥാനസന്ദർഭത്തിൽ വ്യക്തവും പതിവുമായ മലയാളപ്രയോഗം.
- source_word: νεανίσκον
  choice: ഒരു യുവാവ്
  rationale: ഗ്രീക്ക് പദം നേരിട്ട് ഒരു യുവപുരുഷനെയാണ് വിശേഷിപ്പിക്കുന്നത്; ഈ വാക്യം തന്നെ അവനെ ദൂതൻ എന്നു വ്യക്തമാക്കാത്തതിനാൽ വിവരണാത്മകത നിലനിർത്തുന്നു.
- source_word: καθήμενον
  choice: ഇരിക്കുന്നത്
  rationale: യുവാവിന്റെ നിലയെ വിവരിക്കുന്ന വർത്തമാനകാല participle സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐν τοῖς δεξιοῖς
  choice: വലത്തുവശത്ത്
  rationale: കല്ലറയ്ക്കുള്ളിലെ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: വെള്ള അങ്കി ധരിച്ച
  rationale: ധരിച്ചിരിക്കുന്ന നിലയെ സൂചിപ്പിക്കുന്ന perfect participle-ഉം നീണ്ടതോ പ്രത്യേകതയുള്ളതോ ആയ വസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന στολή-യും ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: στολή
  choice: അങ്കി
  rationale: സാധാരണ വസ്ത്രത്തേക്കാൾ പ്രത്യേകമായ പുറംവസ്ത്രം/നീണ്ട വസ്ത്രം എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐξεθαμβήθησαν
  choice: അത്യന്തം പരിഭ്രമിച്ചു
  rationale: വെറും അതിശയത്തേക്കാൾ ശക്തമായ ഞെട്ടലും സംഭ്രമവും ഈ ക്രിയയിൽ ഉണ്ട്; പൂർണ ഭീതിയെന്ന അർഥം അമിതമായി ചേർക്കാതെ അതിന്റെ തീവ്രത പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: νεανίσκος എന്ന വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: മുഖ്യപാഠത്തിൽ ‘യുവാവ്’ എന്ന വിവരണാത്മക പദം നിലനിർത്തി.
  alternative: ദൂതൻ
  rationale: വിശാലമായ സന്ദർഭവും സമാന്തര വിവരണങ്ങളും ദൂതസന്ദേശവാഹകനെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും, മർക്കോസ് 16:5-ൽ ഉപയോഗിച്ചിരിക്കുന്ന പദം νεανίσκος ആണ്. അതിനാൽ വ്യാഖ്യാനത്തെ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ മാർക്കോസിന്റെ വിവരണം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ participial ബന്ധം ‘കടന്നപ്പോൾ’ എന്ന കാലവാക്യത്തിലൂടെ വ്യക്തമായി നൽകി; വ്യക്തിയുടെ തിരിച്ചറിയലിലുള്ള വിവരണാത്മക അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
