source:
  edition: SBLGNT
  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: ml
  text: അങ്ങനെ, കർത്താവായ യേശു അവരോടു സംസാരിച്ചശേഷം സ്വർഗത്തിലേക്ക് ഉയർത്തപ്പെടുകയും ദൈവത്തിന്റെ വലതുഭാഗത്ത് ഇരിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὲν οὖν
  choice: അങ്ങനെ
  rationale: ഈ കണികാസമുച്ചയം മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനവും തുടർന്നുള്ള സംഭവത്തിലേക്കുള്ള മാറ്റവും സൂചിപ്പിക്കുന്നു. ആ ഇരട്ടധ്വനി സ്വാഭാവികമായ മലയാളത്തിൽ ‘അങ്ങനെ’ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: κύριος Ἰησοῦς
  choice: കർത്താവായ യേശു
  rationale: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേര് ‘കർത്താവ്’ എന്നു നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണഘടനയ്ക്കായി ‘കർത്താവായ യേശു’ എന്നു നൽകി.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: അവരോടു സംസാരിച്ചശേഷം
  rationale: μετά + articular infinitive സൂചിപ്പിക്കുന്ന കാലക്രമം ‘ശേഷം’ കൊണ്ടും αὐτοῖς എന്ന ദാതൃപ്രയോഗം ‘അവരോടു’ കൊണ്ടും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀνελήμφθη
  choice: എടുക്കപ്പെട്ടു
  rationale: ക്രിയയുടെ aorist passive രൂപം നിലനിർത്തുന്നു; പ്രവർത്തകനെ പാഠം വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിലും ചേർത്തിട്ടില്ല.
- source_word: εἰς τὸν οὐρανόν
  choice: സ്വർഗത്തിലേക്ക്
  rationale: εἰς + accusative സൂചിപ്പിക്കുന്ന ലക്ഷ്യദിശ ‘-ത്തിലേക്ക്’ എന്ന രൂപത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκάθισεν
  choice: ഇരുന്നു
  rationale: ഇരിക്കുന്ന നില സ്വീകരിച്ച പൂർത്തിയായ പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇരുന്നു’ എന്നു പറയുന്നു; ‘സിംഹാസനമേറ്റു’ പോലുള്ള വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കി.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വലത്തുഭാഗത്ത്
  rationale: ἐκ δεξιῶν എന്ന സ്ഥിരപ്രയോഗം അക്ഷരാർഥത്തിലുള്ള ‘വലത്തുനിന്ന്’ എന്നല്ല, സ്ഥാനസൂചനയായ ‘വലത്തുഭാഗത്ത്’ എന്നാണ് അർഥമാക്കുന്നത്.
theological_decisions:
- issue: സ്വർഗാരോഹണവും ഉയർത്തപ്പെട്ട സ്ഥാനവും doctrinal overstatement ഇല്ലാതെ നൽകൽ
  choice: സ്വർഗത്തിലേക്ക് എടുക്കപ്പെട്ടു; ദൈവത്തിന്റെ വലത്തുഭാഗത്ത് ഇരുന്നു
  alternative: സ്വർഗത്തിലേക്ക് സ്വീകരിക്കപ്പെട്ടു; ദൈവത്തിന്റെ വലതുഭാഗത്ത് തന്റെ ഇരിപ്പിടം സ്വീകരിച്ചു
  rationale: ഗ്രീക്ക് പാഠത്തിലെ passive ascension ഭാഷയും വലത്തുഭാഗത്തെ ഇരിപ്പും നേരിട്ട് നിലനിർത്തുന്നു; പ്രവർത്തകനെയോ സിംഹാസനം, അധികാരാരോഹണം തുടങ്ങിയ വിശദീകരണങ്ങളെയോ പാഠത്തിന് പുറത്തുനിന്ന് ചേർക്കുന്നില്ല.
- issue: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: കർത്താവായ യേശു
  alternative: യജമാനനായ യേശു
  rationale: ‘കർത്താവ്’ പുതിയനിയമത്തിലെ κύριος എന്ന സ്ഥാനപ്പേരിന്റെ ദൈവശാസ്ത്രഭാരവും മലയാള ക്രൈസ്തവപ്രയോഗത്തിലെ പരിചിതത്വവും നിലനിർത്തുന്നു; വെറും സാമൂഹിക സ്ഥാനമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. മൂലത്തിലെ ക്രമവും passive രൂപവും സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി participial temporal clause ഉപയോഗിച്ചു. പാഠഭേദമോ ആവശ്യമായ വിശദീകരണകുറിപ്പോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ നൽകിയിട്ടില്ല.
