source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ലോകമെങ്ങും പോയി സകല സൃഷ്ടിയോടും[a] സുവാർത്ത[b] പ്രസംഗിക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഓരോ സൃഷ്ടജീവിയോടും.” ഗ്രീക്ക് പ്രയോഗം സമഷ്ടിപരമായി “സകല സൃഷ്ടിയോടും” എന്നോ വിതരണപരമായി “ഓരോ സൃഷ്ടജീവിയോടും” എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “നല്ല വാർത്ത.” ‘സുവാർത്ത’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന്റെ അക്ഷരാർഥം “നല്ല വാർത്ത” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: പോയി
  rationale: പ്രധാന ആജ്ഞയായ κηρύξατε-നു മുമ്പിലുള്ള aorist participle ഇവിടെ അനുബന്ധ ആജ്ഞയുടെ ശക്തി വഹിക്കുന്നു. മലയാളത്തിൽ ‘പോയി ... പ്രസംഗിക്കുവിൻ’ എന്ന പ്രയോഗം സ്വാഭാവികമായി ആ നിയോഗശക്തി നിലനിർത്തുന്നു.
- source_word: κόσμον ἅπαντα
  choice: ലോകമെങ്ങും
  rationale: κόσμος ദൗത്യത്തിന്റെ വ്യാപ്തിയായ ലോകത്തെ സൂചിപ്പിക്കുന്നു; ἅπας അതിന്റെ സമഗ്രത ഊന്നിപ്പറയുന്നു. ‘ലോകമെങ്ങും’ ആ സാർവത്രിക വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κηρύξατε
  choice: പ്രസംഗിക്കുവിൻ
  rationale: κηρύσσω അധികാരപൂർവമായ പരസ്യപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു. ‘പ്രസംഗിക്കുവിൻ’ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ആജ്ഞാരൂപമാണ്; സഭയ്ക്കുള്ളിലെ പ്രസംഗം എന്നതിലേക്കു മാത്രം ഇവിടെ ചുരുക്കിയിട്ടില്ല.
- source_word: τὸ εὐαγγέλιον
  choice: സുവാർത്ത
  rationale: εὐαγγέλιον എന്നതിന്റെ അർത്ഥം ‘നല്ല വാർത്ത’ എന്നതാണ്. ‘സുവാർത്ത’ ആ അർത്ഥവും സ്ഥാപിതമായ ക്രൈസ്തവ പ്രയോഗവും ഒരുമിച്ച് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πάσῃ τῇ κτίσει
  choice: സകല സൃഷ്ടിയോടും
  rationale: κτίσις എന്നതിന് ‘സൃഷ്ടി’ എന്നും ‘സൃഷ്ടജീവി’ എന്നും അർത്ഥമാകാം. ‘സകല സൃഷ്ടിയോടും’ ഗ്രീക്കിലെ വിശാലവും സമഷ്ടിപരവുമായ പ്രയോഗം ചുരുക്കാതെ നിലനിർത്തുന്നു; വിതരണപരമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: λέγωയും αὐτοῖς എന്ന പരോക്ഷകർമവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവികമായ കഥനപ്രയോഗമാണിത്.
theological_decisions:
- issue: πάσῃ τῇ κτίσει എന്ന നിയോഗവാക്യത്തിന്റെ വ്യാപ്തി
  choice: സകല സൃഷ്ടിയോടും
  alternative: ഓരോ സൃഷ്ടജീവിയോടും
  rationale: ഈ ഗ്രീക്ക് പദസമുച്ചയം സമഷ്ടിപരമായോ സാർവത്രികമായോ ‘സകല സൃഷ്ടി’ എന്നും വിതരണപരമായി ‘ഓരോ സൃഷ്ടജീവി’ എന്നും ഗ്രഹിക്കാം. മുഖ്യവാചകത്തിലെ വിശാലരൂപം അതിന്റെ സാർവത്രിക ദിശയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; മനുഷ്യരെ മാത്രം സൂചിപ്പിക്കുന്നതായി മുൻകൂട്ടി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. ‘പ്രസംഗിക്കുവിൻ’ എന്ന മാന്യമായ ബഹുവചന ആജ്ഞാരൂപം നിയോഗത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
