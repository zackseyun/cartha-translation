reference: Mark 16:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: ml
  text: ശബ്ബത്ത് കഴിഞ്ഞപ്പോൾ മഗ്ദലേന മറിയയും യാക്കോബിന്റെ അമ്മയായ മറിയയും[a] ശലോമിയും അവനെ അഭിഷേകം ചെയ്യാൻ സുഗന്ധദ്രവ്യങ്ങൾ വാങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, ‘യാക്കോബിന്റേത് ആയ മറിയ’ എന്നാണ്; യാക്കോബുമായുള്ള ബന്ധത്താൽ തിരിച്ചറിയപ്പെടുന്ന മറിയ എന്ന സംക്ഷിപ്തപ്രയോഗം. മർക്കൊസിന്റെ സമീപസന്ദർഭത്തിൽ ഇത് യാക്കോബിന്റെ അമ്മയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: ശബ്ബത്ത് കഴിഞ്ഞപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് മുഖ്യപ്രവൃത്തിക്ക് മുമ്പുള്ള സമയം സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ആ കാലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: മഗ്ദലക്കാരി മറിയ
  rationale: മഗ്ദല സ്വദേശിനിയെന്ന തിരിച്ചറിയൽ മലയാളത്തിൽ സ്വാഭാവികവും പരിചിതവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: യാക്കോബിന്റെ മറിയ
  rationale: ഗ്രീക്ക് വാചകം മറിയയെ യാക്കോബുമായുള്ള ബന്ധംകൊണ്ട് തിരിച്ചറിയിക്കുന്നുവെങ്കിലും ബന്ധത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: Σαλώμη
  choice: ശലോമ
  rationale: വ്യക്തിനാമത്തിന്റെ അംഗീകൃത മലയാള ലിപ്യന്തരണം.
- source_word: ἠγόρασαν
  choice: വാങ്ങി
  rationale: ലളിതമായ ആഖ്യാനക്രിയയ്ക്ക് സ്വാഭാവികമായ നേരിട്ടുള്ള മലയാള തുല്യം.
- source_word: ἀρώματα
  choice: സുഗന്ധദ്രവ്യങ്ങൾ
  rationale: ശവസംസ്കാരത്തിൽ ഉപയോഗിക്കുന്ന സുഗന്ധമുള്ള വസ്തുക്കളെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സ്വാഭാവികവുമായ പദം.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: അവനെ അഭിഷേകം ചെയ്യാൻ ചെന്നെത്തുന്നതിനായി
  rationale: ἵνα ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; ἐλθοῦσαι സൂചിപ്പിക്കുന്ന ആദ്യം ചെന്നെത്തി പിന്നെ അഭിഷേകം ചെയ്യുന്ന പ്രവർത്തനക്രമവും നിലനിർത്തുന്നു.
- source_word: ἀλείψωσιν
  choice: അഭിഷേകം ചെയ്യാൻ
  rationale: എണ്ണയോ സുഗന്ധവസ്തുവോ പുരട്ടുക എന്ന ക്രിയയുടെ നേരിട്ടുള്ള തുല്യം; ശവസംസ്കാരസന്ദർഭത്തിലും യോജിക്കുന്നു.
theological_decisions:
- issue: Μαρία ἡ τοῦ Ἰακώβου എന്ന അപൂർണ്ണ ബന്ധപ്രയോഗം
  choice: യാക്കോബിന്റെ മറിയ
  alternative: യാക്കോബിന്റെ അമ്മ മറിയ
  rationale: മൂലഗ്രീക്ക് ബന്ധം വ്യക്തമാക്കാതെ ‘യാക്കോബിന്റെ [മറിയ]’ എന്നു മാത്രമാണ് പറയുന്നത്. സുവിശേഷപരമ്പരയിൽ ‘അമ്മ’ എന്ന ധാരണ സാധാരണമാണെങ്കിലും അത് മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നത് യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ബന്ധാവ്യക്തത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചിരിക്കുന്നു.
