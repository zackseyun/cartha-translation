translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ഉരുട്ടിമാറ്റപ്പെട്ടിരിക്കുന്നതായി’ എന്ന രൂപം അല്പം ഔപചാരികമാണെങ്കിലും ഗ്രീക്ക് പൂർണ്ണ നിഷ്ക്രിയത്തിന്റെ ഫലാവസ്ഥ കൃത്യമായി സംരക്ഷിക്കുന്നു.
