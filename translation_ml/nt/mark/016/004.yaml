source:
  edition: SBLGNT
  text: καὶ ἀναβλέψασαι θεωροῦσιν ὅτι ⸀ἀποκεκύλισται ὁ λίθος, ἦν γὰρ μέγας σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: ml
  text: അവർ തല ഉയർത്തി നോക്കിയപ്പോൾ[a], കല്ല് ഉരുട്ടിമാറ്റപ്പെട്ടുകിടക്കുന്നതായി കണ്ടു; കാരണം, അത് അത്യന്തം വലുതായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “അവർ ശ്രദ്ധിച്ചു: കല്ല് ഉരുട്ടിമാറ്റപ്പെട്ടുകിടക്കുന്നു.” ഗ്രീക്കിലെ പൂർണ്ണകാല ക്രിയ, അവർ കണ്ട സമയത്ത് കല്ല് ഇതിനകം ഉരുട്ടിമാറ്റപ്പെട്ട നിലയിലായിരുന്നു എന്നതിന് ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: തല ഉയർത്തിനോക്കിയപ്പോൾ
  rationale: സ്ത്രീകൾ കല്ലറയുടെ ഭാഗത്തേക്ക് ദൃഷ്ടി ഉയർത്തിയെന്ന ക്രിയാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഗ്രീക്കിലെ മുൻകാല പങ്കാളിക്രിയയുടെ സാഹചര്യബന്ധവും നിലനിർത്തുന്നു.
- source_word: θεωροῦσιν
  choice: കണ്ടു
  rationale: ദൃശ്യമായി ശ്രദ്ധിച്ചറിഞ്ഞതിനെ കഥനസന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: —തായി
  rationale: അവർ കണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിലെ സ്വാഭാവികമായ പൂരകപ്രത്യയത്തിലൂടെ ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀποκεκύλισται
  choice: ഉരുട്ടിമാറ്റപ്പെട്ടിരിക്കുന്നതായി
  rationale: പൂർണ്ണ നിഷ്ക്രിയരൂപം സൂചിപ്പിക്കുന്ന, മുമ്പേ പൂർത്തിയായ പ്രവൃത്തിയും അതിന്റെ ഫലമായി തുടരുന്ന അവസ്ഥയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ὁ λίθος
  choice: കല്ല്
  rationale: കല്ലറ അടച്ചിരുന്ന കല്ലിനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: അത് അത്യന്തം വലുതായിരുന്നു
  rationale: μέγας എന്നതിന്റെ വലുപ്പസൂചനയും σφόδραയുടെ ശക്തമായ തീവ്രതയും വ്യക്തമായി പകരുന്നു; γάρ നൽകുന്ന വിശദീകരണബന്ധം അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: καὶ
  choice: അവർ…നോക്കിയപ്പോൾ
  rationale: മുൻവാക്യത്തിൽ നിന്നുള്ള കഥനത്തുടർച്ച മലയാളത്തിലെ വാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; വേറിട്ട ‘പിന്നെ’ ചേർത്ത് കാലക്രമം അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
