id: MRK.16.13
reference: Mark 16:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: ml
  text: അവർ പോയി ശേഷിച്ചവരോട് ആ വിവരം അറിയിച്ചു[a]. എന്നാൽ അവരും ഇവരെ വിശ്വസിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മറ്റുള്ളവരോട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: അവർ
  rationale: ‘അവരും/ആ ആളുകളും’ എന്ന ആശയം സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ രണ്ടുപേരെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ലിംഗം അനാവശ്യമായി വ്യക്തമാക്കാതെ ‘അവർ’ സ്വാഭാവികമാണ്; οὐδέയിലെ കൂട്ടിച്ചേർക്കൽഭാവം അവസാന വാക്യത്തിലെ ‘അവരും’ വഴി വ്യക്തമായി വരുന്നു.
- source_word: ἀπελθόντες
  choice: പോയി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പുറപ്പെടലിനെ മലയാളത്തിലെ ക്രിയാശൃംഖല സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπήγγειλαν
  choice: ആ വിവരം അറിയിച്ചു
  rationale: ἀπαγγέλλω എന്നത് അറിയിക്കുക/റിപ്പോർട്ട് ചെയ്യുക എന്നാണ്. ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ അവർ അനുഭവിച്ച സംഭവമാണ്; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘ആ വിവരം’ ചേർത്തിരിക്കുന്നു.
- source_word: τοῖς λοιποῖς
  choice: ശേഷിച്ചവരോട്
  rationale: λοιπός ഇവിടെ കൂട്ടത്തിൽ ശേഷിച്ചവരെ സൂചിപ്പിക്കുന്നു. ‘ശേഷിച്ചവർ’ മൂലപദത്തിന്റെ അർഥം നേരിട്ട്, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐδὲ
  choice: എന്നാൽ അവരും ... ഇല്ല
  rationale: οὐδέ മുമ്പത്തെ അവിശ്വാസവുമായി ബന്ധിപ്പിച്ച് ‘ഇവരും വിശ്വസിച്ചില്ല’ എന്ന കൂട്ടിച്ചേർക്കൽ നൽകുന്നു; മലയാളത്തിൽ ‘എന്നാൽ അവരും’ കഥയിലെ വിരുദ്ധമാറ്റവും additive ഭാവവും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκείνοις
  choice: ഇവരെ
  rationale: ദാതിവ് ബഹുവചനം വിവരം അറിയിച്ച രണ്ടുപേരെയാണ് സൂചിപ്പിക്കുന്നത്. റിപ്പോർട്ട് സ്വീകരിച്ചവരുടെ കാഴ്ചപ്പാടിൽ മലയാളത്തിലെ ‘ഇവരെ’ വ്യക്തമായ പരാമർശമാണ്.
- source_word: ἐπίστευσαν
  choice: വിശ്വസിച്ചില്ല
  rationale: ഇവിടെ πιστεύω സാക്ഷ്യം സത്യമെന്ന് അംഗീകരിക്കുന്ന സാധാരണ കഥനാർഥത്തിലാണ്; ‘വിശ്വസിക്കുക’ അതിനെ കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: കഥനസന്ദർഭത്തിലെ πιστεύωയുടെ വിവർത്തനം
  choice: വിശ്വസിച്ചില്ല
  alternative: ആശ്രയിച്ചില്ല
  rationale: ഇവിടെ വ്യക്തിപരമായ ആശ്രയമല്ല, രണ്ടുപേരുടെ സാക്ഷ്യം അംഗീകരിക്കാതിരുന്നതാണ് ഉദ്ദേശ്യം. അതിനാൽ ദൈവശാസ്ത്രപരമായ അധികഭാരം ചേർക്കാതെ ‘വിശ്വസിച്ചില്ല’ എന്നു നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘റിപ്പോർട്ട് ചെയ്തു’ എന്ന വായ്പാപദത്തിനു പകരം സ്വാഭാവികമായ ‘അറിയിച്ചു’ ഉപയോഗിച്ചു. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
