  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: ml
  text: അവരും, അവൻ ജീവനോടിരിക്കുന്നുവെന്നും[a] അവൾ അവനെ കണ്ടുവെന്നും[b] കേട്ടപ്പോൾ, വിശ്വസിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ ജീവിക്കുന്നു.’ ഗ്രീക്കിൽ ക്രിയ വർത്തമാനകാലത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവൻ അവളാൽ കാണപ്പെട്ടു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: അവരോ
  rationale: καί + ἐκεῖνοι മുൻവിവരണവുമായി ബന്ധം തുടരുകയും മുമ്പ് പറഞ്ഞ കൂട്ടത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. ‘അവരോ’ ഈ തുടർച്ചയും വിഷയമാറ്റത്തിലെ ഊന്നലും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀκούσαντες
  choice: കേട്ടപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തം ഇവിടെ കാലസംബന്ധിയായ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; ‘കേട്ടപ്പോൾ’ സംഭവക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്നും … എന്നും
  rationale: കേട്ട വാർത്തയുടെ രണ്ടു ഏകോപിത ഉള്ളടക്കഘടകങ്ങളെ മലയാളത്തിലെ പരോക്ഷവാക്യരീതിയിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ζῇ
  choice: ജീവനോടിരിക്കുന്നുവെന്ന്
  rationale: വർത്തമാനകാല ക്രിയ യേശു ജീവിച്ചിരിക്കുന്നു എന്ന തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ജീവനോടിരിക്കുന്നു’ പുനരുത്ഥാനസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: καὶ
  choice: … എന്നും … എന്നും
  rationale: രണ്ട് റിപ്പോർട്ട് ചെയ്ത വസ്തുതകളെയും മലയാളത്തിലെ ഏകോപിത പരോക്ഷവാക്യഘടനയിലൂടെ ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐθεάθη
  choice: അവൾ അവനെ കണ്ടു
  rationale: θεάομαι എന്ന ക്രിയയുടെ അയോറിസ്റ്റ് പാസീവ് രൂപത്തിന്റെ ആശയം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തൃപ്രയോഗത്തിലൂടെ നൽകുന്നു; പാസീവ് രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὑπ’ αὐτῆς
  choice: അവൾ
  rationale: സർവനാമം മുൻസന്ദർഭത്തിലെ സ്ത്രീയെ സൂചിപ്പിക്കുന്നു. പേരിനെ വ്യാഖ്യാനപരമായി ചേർക്കാതെ അതേ സൂചന നിലനിർത്തുന്നു.
- source_word: ἠπίστησαν
  choice: വിശ്വസിച്ചില്ല
  rationale: വാർത്തയെ അവർ അംഗീകരിക്കാതിരുന്നതിനെ നേരിട്ടും അധിക വ്യാഖ്യാനഭാരം കൂടാതെയും അറിയിക്കുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനാനന്തര ജീവനെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലപ്രയോഗം
  choice: അവൻ ജീവനോടിരിക്കുന്നു
  alternative: അവൻ ജീവിക്കുന്നു
  rationale: ζῇ വർത്തമാനകാലത്തിലാണ്; അതിനാൽ യേശു ജീവിച്ചിരിക്കുന്നതായി കേട്ടുവെന്ന അർത്ഥം തുടരുന്ന നിലയായി സംരക്ഷിച്ചു. മലയാളത്തിലെ പരോക്ഷവാക്യത്തിൽ കാലത്തെ ഭൂതകാലത്തിലാക്കേണ്ട ആവശ്യമില്ല.
- issue: മറിയ യേശുവിനെ കണ്ടതിന്റെ വ്യാകരണപരമായ ദൃഷ്ടികോണം
  choice: അവൾ അവനെ കണ്ടു
  alternative: അവൻ അവളാൽ കാണപ്പെട്ടു
  rationale: ഗ്രീക്ക് പാസീവ് രൂപം യേശു അവളാൽ കാണപ്പെട്ടുവെന്ന് പറയുന്നു. മുഖ്യവാചകത്തിൽ സ്വാഭാവിക മലയാളത്തിനായി കർത്തൃപ്രയോഗം ഉപയോഗിച്ചെങ്കിലും, ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്ന് മാറ്റി സ്വയം വെളിപ്പെടുത്തൽ എന്ന അധിക ആശയം ചേർത്തിട്ടില്ല; മൂലരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യവും സ്വാഭാവികവുമായ ശൈലി. ഗ്രീക്കിലെ പാസീവ് പ്രയോഗത്തിന്റെ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
