- from: അവർ മൂറും ചേർത്ത വീഞ്ഞ് അദ്ദേഹത്തിന് കൊടുക്കാൻ ശ്രമിച്ചു[a]; എന്നാൽ അദ്ദേഹം അത് സ്വീകരിച്ചില്ല.[b]
  to: അവർ അദ്ദേഹത്തിന് മൂർ ചേർത്ത വീഞ്ഞ് കൊടുക്കുകയായിരുന്നു[a]; എന്നാൽ അദ്ദേഹം അത് സ്വീകരിച്ചില്ല.[b]
