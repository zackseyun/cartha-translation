base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: ml
  text: അവർ അദ്ദേഹത്തിന് മൂർ ചേർത്ത വീഞ്ഞ് കൊടുക്കുകയായിരുന്നു[a]; എന്നാൽ അദ്ദേഹം അത് സ്വീകരിച്ചില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവർ അദ്ദേഹത്തിന് മൂർ ചേർത്ത വീഞ്ഞ് വാഗ്ദാനം ചെയ്തു.’'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ യേശുവിനെ വീണ്ടും സൂചിപ്പിക്കുന്ന ഒരു ബന്ധസർവനാമപ്രയോഗം ഉപയോഗിക്കുന്നു; അതിന്റെ അർഥം ഇവിടെ ‘എന്നാൽ അദ്ദേഹം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδουν
  choice: കൊടുക്കാൻ ശ്രമിച്ചു
  rationale: അപൂർണഭൂതകാലരൂപം തുടരുന്നോ ശ്രമിച്ചോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ യേശു പാനം സ്വീകരിക്കാത്തതിനാൽ, ‘കൊടുക്കാൻ ശ്രമിച്ചു’ എന്നത് പ്രവൃത്തിയുടെ ശ്രമസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘കൊടുത്തുകൊണ്ടിരുന്നു’ എന്നും സാധ്യമാണ്.
- source_word: ἐσμυρνισμένον οἶνον
  choice: മൂറും ചേർത്ത വീഞ്ഞ്
  rationale: σμυρνίζω എന്ന ക്രിയാരൂപം മൂർ ചേർത്ത് തയ്യാറാക്കിയതിനെ സൂചിപ്പിക്കുന്നു. ‘മൂറും ചേർത്ത വീഞ്ഞ്’ ഘടകവും കലർത്തലും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὃς δὲ
  choice: എന്നാൽ അദ്ദേഹം
  rationale: ὃς രൂപത്തിൽ ബന്ധസർവനാമമാണെങ്കിലും ഇവിടെ യേശുവിനെ വീണ്ടും എടുത്തുപറയുന്ന resumptive പ്രയോഗമാണ്; δέയുടെ നേരിയ വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἔλαβεν
  choice: അത് സ്വീകരിച്ചില്ല
  rationale: λαμβάνωയ്ക്ക് ‘എടുക്കുക/സ്വീകരിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. പാനം വാഗ്ദാനം ചെയ്യുന്ന സന്ദർഭത്തിൽ ‘സ്വീകരിച്ചില്ല’ സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്; ഗ്രീക്കിൽ സൂചിതമായ കർമം ‘അത്’ എന്നു ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: യേശു പാനം നിരസിച്ചതിന്റെ കാരണം
  choice: നിരസിച്ച പ്രവൃത്തി മാത്രം വിവരിക്കുക; കാരണം ചേർക്കാതിരിക്കുക.
  alternative: വേദന മന്ദമാക്കുന്ന പാനം അദ്ദേഹം നിരസിച്ചു എന്നു വ്യാഖ്യാനിച്ച് പറയുക.
  rationale: മൂറും ചേർത്ത വീഞ്ഞ് നൽകിയതും അദ്ദേഹം അത് സ്വീകരിക്കാതിരുന്നതും മാത്രമാണ് വാക്യം പറയുന്നത്. നിരസിച്ചതിന്റെ ഉദ്ദേശ്യമോ പാനത്തിന്റെ ഫലമോ മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനം അതു നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യേശുവിനെ സൂചിപ്പിക്കാൻ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. ‘മൂർ’ എന്ന വസ്തുനാമം നിലനിർത്തി; ദൈവശാസ്ത്രപരമായ കാരണം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
