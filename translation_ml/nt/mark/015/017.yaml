id: MRK.15.17
reference: Mark 15:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: ml
  text: അവർ അവനെ ധൂമ്രവസ്ത്രം[a] ധരിപ്പിച്ചു; മുള്ളുകൾകൊണ്ട് ഒരു കിരീടം മെടഞ്ഞ് അത് അവന്റെമേൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ ധൂമ്രനിറത്തിൽ അണിയിച്ചു.’ ഗ്രീക്കിൽ ഇവിടെ ‘മേലങ്കി’ എന്നോ മറ്റേതെങ്കിലും പ്രത്യേക വസ്ത്രം എന്നോ വ്യക്തമാക്കുന്നില്ല; സന്ദർഭം വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: ധരിപ്പിച്ചു
  rationale: മറ്റൊരാളെ വസ്ത്രം അണിയിക്കുക എന്ന കാരകാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πορφύραν
  choice: ധൂമ്രവസ്ത്രം
  rationale: πορφύρα ധൂമ്രനിറമുള്ള തുണിയെയോ വസ്ത്രത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ധരിക്കാനുള്ള വസ്തുവായതിനാൽ ‘വസ്ത്രം’ എന്നു വ്യക്തമാക്കിയെങ്കിലും ‘മേലങ്കി’ എന്ന പ്രത്യേക രൂപം ചേർത്തിട്ടില്ല.
- source_word: πλέξαντες
  choice: മെടഞ്ഞശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെന്ന aorist participle-ന്റെ ക്രമബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀκάνθινον στέφανον
  choice: മുള്ളുകൊണ്ട് ഒരു കിരീടം
  rationale: മുള്ളുകളാൽ നിർമിച്ചതെന്ന അർഥവും രാജത്വത്തെ പരിഹസിക്കുന്ന സന്ദർഭത്തിലെ ‘കിരീടം’ എന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: περιτιθέασιν αὐτῷ
  choice: അത് അവന്റെ തലയിൽ വെച്ചു
  rationale: കിരീടം ധരിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ലക്ഷ്യസ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘തലയിൽ’ എന്നു വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ പൊതുവായി ‘അവന്റെമേൽ വെക്കുന്നു’ എന്നാണ്.
theological_decisions:
- issue: യേശുവിനെ അപമാനിക്കുന്നതിലെ പരിഹാസരാജത്വ ദൃശ്യഭാവം
  choice: στέφανος എന്നതിന് ‘കിരീടം’
  alternative: ‘പുഷ്പചക്രം’ അല്ലെങ്കിൽ ‘മാല’
  rationale: ധൂമ്രവസ്ത്രത്തോടൊപ്പം സൈനികർ രാജത്വത്തെ പരിഹസിക്കുന്നതാണ് സന്ദർഭം. ‘കിരീടം’ ആ ദൃശ്യഭാവം വ്യാഖ്യാനാത്മക സിദ്ധാന്തം ചേർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘ധൂമ്രവസ്ത്രം’ രാജകീയ നിറത്തിന്റെ സൂചന നിലനിർത്തുന്നു; ‘മേലങ്കി’ എന്നതുപോലുള്ള ഉറവിടത്തിൽ വ്യക്തമല്ലാത്ത പ്രത്യേക വസ്ത്രരൂപം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
