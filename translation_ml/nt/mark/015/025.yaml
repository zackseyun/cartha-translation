source:
  edition: SBLGNT
  text: Ἦν δὲ ὥρα τρίτη καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: ml
  text: മൂന്നാം മണി[a] ആയിരുന്നു; അവർ അവനെ ക്രൂശിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യഹൂദരുടെ സാധാരണ സമയക്കണക്കനുസരിച്ച്, അതായത് രാവിലെ ഏകദേശം ഒൻപത് മണി.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν
  choice: ആയിരുന്നു
  rationale: εἰμί എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം ഇവിടെ സമയം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ആയിരുന്നു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: δὲ
  choice: ;
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ്. പ്രത്യേകമായ ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർക്കാതെ വാക്യഘടനയിലൂടെ ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: ὥρα τρίτη
  choice: മൂന്നാം മണി
  rationale: പുരാതന സമയനിർദേശം അതിന്റെ സാംസ്കാരിക രൂപത്തിൽ നിലനിർത്തുന്നു; ആധുനിക ഘടികാരസമയത്തിലേക്കുള്ള ഏകദേശ പരിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐσταύρωσαν
  choice: അവർ ... ക്രൂശിച്ചു
  rationale: ക്രൂശിക്കൽ എന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സജീവ ഭൂതകാലക്രിയയ്ക്ക് നേരിട്ടും പരിചിതവുമായ മലയാളരൂപം.
- source_word: αὐτόν
  choice: അവനെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
theological_decisions:
- issue: കാലക്രമവുമായി ബന്ധപ്പെട്ട സമയപ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: മുഖ്യപാഠത്തിൽ ‘മൂന്നാം മണി’ നിലനിർത്തുക
  alternative: ‘രാവിലെ ഏകദേശം ഒൻപത് മണി’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകുക
  rationale: മൂലവാക്യം പുരാതന സമയനിർദേശം തന്നെയാണ് നൽകുന്നത്. അതിനെ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നത് കാലക്രമത്തെ സമന്വയിപ്പിക്കുന്ന ഏതെങ്കിലും വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെയും യഥാർഥ പാഠത്തിലെ സാധ്യതയുള്ള സംഘർഷം മറച്ചുവയ്ക്കാതെയും ഇരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മൂന്നാം മണി’ എന്ന മൂലസാംസ്കാരിക പ്രയോഗം സംരക്ഷിക്കുകയും വിശദീകരണം അടിക്കുറിപ്പിലാക്കുകയും ചെയ്തു.
