id: MRK.15.29
reference: Mark 15:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: ml
  text: 'അതുവഴി കടന്നുപോയവർ അവനെ അധിക്ഷേപിച്ചുകൊണ്ട് തല കുലുക്കി പറഞ്ഞു: “ഹാ! ദൈവാലയം പൊളിച്ച് മൂന്നു ദിവസത്തിനുള്ളിൽ പണിയുന്നവനേ,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: അതുവഴി കടന്നുപോയവർ
  rationale: സംഭവസ്ഥലത്തിനരികിലൂടെ കടന്നുപോകുന്നവരെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലസദൃശമായ പങ്കുപദത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐβλασφήμουν
  choice: അവനെ അധിക്ഷേപിച്ചു
  rationale: ഇവിടെ യേശുവിനെ ലക്ഷ്യമാക്കിയ നിന്ദാപരമായ സംസാരമാണ്; സാങ്കേതികമായി ‘ദൈവദൂഷണം ചെയ്തു’ എന്നു പറയാതെ സന്ദർഭോചിതമായ അധിക്ഷേപത്തിന്റെ അർഥം നൽകുന്നു. ഗ്രീക്കിലെ അപൂർണകാലത്തിന്റെ തുടരുന്ന പ്രവൃത്തി സമീപവാക്യഘടനയിൽ പ്രകടമാകുന്നു.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: തല കുലുക്കിക്കൊണ്ട്
  rationale: പരിഹാസവും നിന്ദയും പ്രകടിപ്പിക്കുന്ന ശരീരഭാഷയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Οὐὰ
  choice: ഹാ!
  rationale: ഈ സന്ദർഭത്തിലെ പരിഹാസസ്വരമുള്ള ആശ്ചര്യോദ്ഗാരം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ὁ καταλύων
  choice: പൊളിച്ച് … പണിയുന്നവനേ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പങ്കുപദത്തെ നേരിട്ടുള്ള സംബോധനയായി നൽകുന്നു; ദൈവാലയത്തെ സംബന്ധിച്ച് καταλύω എന്നതിന്റെ നശിപ്പിക്കൽ/പൊളിക്കൽ അർഥം വ്യക്തമാണ്.
- source_word: τὸν ναὸν
  choice: ദൈവാലയം
  rationale: ναός കൂടുതൽ പ്രത്യേകമായി വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ ആരോപണത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ദൈവാലയം’ അനുയോജ്യം; പ്രത്യേക അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: മൂന്നു ദിവസത്തിനുള്ളിൽ പണിയുന്നവനേ
  rationale: ഗ്രീക്ക് ക്രിയ നേരിട്ട് ‘പണിയുക’ എന്നാണ്; സന്ദർഭം ‘വീണ്ടും പണിയുക’ എന്നു സൂചിപ്പിക്കാമെങ്കിലും അത് മുഖ്യപാഠത്തിൽ ചേർത്ത് വ്യാഖ്യാനം ഉറപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവാലയത്തെക്കുറിച്ചുള്ള വാക്കിന്റെ സൂചന
  choice: പരിഹസിക്കുന്നവരുടെ ആരോപണം/സൂചന എന്ന നിലയിൽ വാക്കുകൾ നേരിട്ട് പരിഭാഷപ്പെടുത്തി; ദൈവാലയം യേശുവിന്റെ ശരീരമാണെന്ന യോഹന്നാനിലെ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവന്നില്ല.
  alternative: യേശു തന്റെ ശരീരത്തെക്കുറിച്ച് രൂപകമായി പറഞ്ഞതാണെന്ന് പരിഭാഷയിൽത്തന്നെ വ്യക്തമാക്കുക.
  rationale: മർക്കോസ് ഇവിടെ ക്രൂശിനരികിലെ വഴിപോക്കരുടെ പരിഹാസമാണ് അവതരിപ്പിക്കുന്നത്. ഈ വാക്യം സ്വയം പറയുന്നതിലധികം അന്തർഗ്രന്ഥപരമോ ദൈവശാസ്ത്രപരമോ ആയ അർഥം മുഖ്യപാഠം തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. പരിഹാസത്തിന്റെ സ്വരം ‘ഹാ!’ എന്നും സംബോധനരൂപമായ ‘വനേ’ എന്നും നിലനിർത്തി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം കോമ വെച്ചു.
