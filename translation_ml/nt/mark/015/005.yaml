lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ കുറ്റാരോപണങ്ങളോടും പ്രതികരണങ്ങളോടും ഉള്ള മൃദുവായ വൈരുധ്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὐκέτι
  choice: പിന്നെ ... ഇല്ല
  rationale: മുമ്പുണ്ടായിരുന്ന മറുപടി പറയൽ അവസാനിച്ചുവെന്ന കാലപരമായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐδὲν
  choice: ഒന്നിനും
  rationale: നിഷേധക്രിയയോടൊപ്പം ചേർന്ന് യേശുവിന്റെ മൗനം സമ്പൂർണമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἀπεκρίθη
  choice: ഉത്തരം പറഞ്ഞില്ല
  rationale: ചോദ്യംചെയ്യലിന്റെയും ന്യായവിചാരണയുടെയും പശ്ചാത്തലത്തിൽ വ്യക്തവും സാധാരണവുമായ പ്രയോഗമാണ്.
- source_word: ὥστε
  choice: അതിനാൽ
  rationale: യേശുവിന്റെ മൗനത്തിന്റെ ഫലമായാണ് പീലാത്തോസിന്റെ ആശ്ചര്യം ഉണ്ടായതെന്ന ഫലസൂചന സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: θαυμάζειν
  choice: ആശ്ചര്യപ്പെട്ടു
  rationale: പീലാത്തോസിന്റെ പ്രതികരണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ക്രിയയുടെ ഫലസംബന്ധം നിലനിർത്തുന്നു.
- source_word: Πιλᾶτον
  choice: പീലാത്തോസ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
