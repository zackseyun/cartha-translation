id: MRK.15.2
reference: Mark 15:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: ml
  text: 'പീലാത്തോസ് അവനോട് ചോദിച്ചു: “നീ യെഹൂദന്മാരുടെ രാജാവാണോ?” അവൻ അവനോടു മറുപടി പറഞ്ഞു: “നീ തന്നെയാണ് പറയുന്നത്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നീ പറയുന്നു”; കൂടുതൽ വിശദമായി, “അങ്ങനെ പറയുന്നത് നീയാണ്.” യേശുവിന്റെ ചുരുക്കമായ മറുപടിയിൽ ഒരു പരിധിവരെ അവ്യക്തത നിലനിൽക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: ചോദിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘ചോദിക്കുക’ സ്വാഭാവികമായി നൽകുന്നു; ഔപചാരികമായ ചോദ്യംചെയ്യലിന്റെ ശക്തി അനാവശ്യമായി കൂട്ടുന്നില്ല.
- source_word: Σὺ εἶ
  choice: നീ ... ആണോ?
  rationale: പ്രത്യക്ഷചോദ്യത്തിന്റെ രൂപവും ഗ്രീക്കിലെ ഊന്നിയ സർവനാമവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: βασιλεὺς
  choice: രാജാവ്
  rationale: രാജകീയവും രാഷ്ട്രീയവുമായ കുറ്റാരോപണത്തിന്റെ കൃത്യമായ പദമാണ്; വിശാലമായ ‘ഭരണാധികാരി’ എന്നതിനെക്കാൾ യോജിക്കുന്നു.
- source_word: Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ
  rationale: ‘യെഹൂദന്മാരുടെ രാജാവ്’ എന്നത് പീലാത്തോസിന്റെ മുമ്പിൽ ഉന്നയിച്ച അംഗീകൃത രാഷ്ട്രീയ ആരോപണരൂപം വ്യക്തമാക്കുന്നു; ‘യെഹൂദ്യരുടെ’ എന്ന ഭൂമിശാസ്ത്രപരമായ സാധ്യത ഇവിടെ കുറച്ച് യോജിക്കുന്നു.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: മറുപടിയായി അവനോട് പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പങ്കാളിക്രിയയും ചരിത്രവർത്തമാനവും വാക്കുതോറും അനുകരിച്ച് അസ്വാഭാവികമാക്കാതെ, സംഭവത്തിന്റെ അർഥം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Σὺ λέγεις
  choice: നീ തന്നെയാണ് പറയുന്നത്
  rationale: മറുപടിയുടെ ചുരുക്കവും പരോക്ഷതയും നിലനിർത്തുന്നു; വ്യക്തമായ ‘അതെ’ ചേർത്ത് അതിനെ പൂർണ സമ്മതമാക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: Σὺ λέγεις എന്ന യേശുവിന്റെ മറുപടിയുടെ ഭാവം
  choice: ‘നീ തന്നെയാണ് പറയുന്നത്’ എന്ന നിയന്ത്രിതവും ഭാഗികമായി അവ്യക്തവുമായ രൂപം
  alternative: ‘അതെ, നീ പറഞ്ഞതുപോലെതന്നെ’ എന്ന വ്യക്തമായ സമ്മതം; അല്ലെങ്കിൽ അക്ഷരാർഥത്തിൽ ‘നീ പറയുന്നു’
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ‘അതെ’ ഇല്ല. അതിനാൽ മറുപടിയെ നിരുപാധിക സമ്മതമോ നിഷേധമോ ആക്കാതെ, ആ വിശേഷണം പീലാത്തോസിന്റെ വാക്കുകളായി തിരിച്ചുവയ്ക്കുന്ന ഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വായനാസൗകര്യത്തിനായി ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാളത്തിലെ ഭൂതകാല ആഖ്യാനരൂപത്തിൽ നൽകിയിരിക്കുന്നു. ‘നീ തന്നെയാണ് പറയുന്നത്’ എന്ന പ്രയോഗം സംഭാഷണത്തിലെ ഊന്നലും ഉദ്ദേശപൂർവമായ അവ്യക്തതയും കാത്തുസൂക്ഷിക്കുന്നു.
