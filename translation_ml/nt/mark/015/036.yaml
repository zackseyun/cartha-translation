id: MRK.15.36
reference: Mark 15:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: ml
  text: 'അപ്പോൾ ഒരാൾ ഓടിച്ചെന്ന് ഒരു സ്പോഞ്ച് പുളിച്ച വീഞ്ഞിൽ[b] മുക്കി, അത് ഒരു ഞാങ്ങണയിൽ വെച്ച് അവന് കുടിക്കാൻ കൊടുത്തുകൊണ്ട് പറഞ്ഞു: “വിടൂ[a]; ഏലിയാവ് അവനെ താഴെയിറക്കാൻ വരുന്നുണ്ടോ എന്നു നമുക്കു നോക്കാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാത്തിരിക്കൂ.”
    reason: lexical_alternative
  - marker: b
    text: “പുളിച്ച വീഞ്ഞ്” എന്നത് സാധാരണക്കാർ ഉപയോഗിച്ചിരുന്ന വിലകുറഞ്ഞ, അമ്ലരുചിയുള്ള വീഞ്ഞുപാനീയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക ഗൃഹോപയോഗ വിനാഗിരി എന്ന അർത്ഥം നിർബന്ധമല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: δραμὼν
  choice: ഓടിച്ചെന്ന്
  rationale: ആദ്യമായി നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് കൃദന്തം; മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനക്രമത്തിൽ തുടർപ്രവൃത്തികളുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: τις καὶ
  choice: ഒരാൾ
  rationale: τις അജ്ഞാതനായ ഒരാളെ സൂചിപ്പിക്കുന്നു; καί-യെ വേറിട്ട് ‘കൂടി’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഇവിടെ മലയാളത്തിൽ അനാവശ്യവും അസ്വാഭാവികവുമാണ്.
- source_word: γεμίσας σπόγγον ὄξους
  choice: ഒരു പഞ്ഞിക്കഷണം പുളിച്ച വീഞ്ഞിൽ മുക്കി
  rationale: ὄξος വിലകുറഞ്ഞ അമ്ലരുചിയുള്ള വീഞ്ഞുപാനീയമാണ്; ആധുനിക ഗൃഹോപയോഗ വിനാഗിരിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘പുളിച്ച വീഞ്ഞ്’ ഉപയോഗിച്ചു. സ്പോഞ്ച് ദ്രാവകത്തിൽ നിറയ്ക്കുന്ന പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി ‘മുക്കി’ എന്നു പറയുന്നു.
- source_word: περιθεὶς καλάμῳ
  choice: അത് ഒരു ഞാങ്ങണയിൽ വെച്ച്
  rationale: κάλαμος എന്നതിന്റെ സസ്യദണ്ഡസംബന്ധമായ അർത്ഥം ‘ഞാങ്ങണ’ നിലനിർത്തുന്നു; സ്പോഞ്ച് അതിൽ ഘടിപ്പിച്ചുവെന്ന പ്രവൃത്തി ‘വെച്ച്’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐπότιζεν αὐτόν
  choice: അവനു കുടിക്കാൻ കൊടുത്തുകൊണ്ട്
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ പുരോഗമനമോ ശ്രമമോ സൂചിപ്പിക്കുന്ന ഭാവം ‘കൊടുത്തുകൊണ്ട്’ നിലനിർത്തുന്നു; കുടിപ്പിച്ചുവെന്ന് പൂർത്തീകരണം അനിവാര്യമായി പ്രസ്താവിക്കുന്നില്ല.
- source_word: Ἄφετε
  choice: വിടൂ
  rationale: മറ്റുള്ളവർ തൽക്കാലം ഇടപെടാതെ നിൽക്കണമെന്ന ബഹുവചന ആജ്ഞയുടെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ രൂപം. ‘കാത്തിരിക്കൂ’ എന്ന സന്ദർഭോചിത അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: ഏലിയാവ് ... വരുന്നുണ്ടോ എന്നു നമുക്കു നോക്കാം
  rationale: ‘നമുക്കു നോക്കാം’ എന്ന ആഹ്വാനഭാവവും ἔρχεται എന്ന വർത്തമാനകാലത്തിന്റെ തത്സമയത്വവും നിലനിർത്തുന്നു.
- source_word: καθελεῖν αὐτόν
  choice: അവനെ താഴെയിറക്കാൻ
  rationale: ക്രൂശുപശ്ചാത്തലത്തിൽ ഉയർന്നിടത്തുനിന്ന്, ഇവിടെ ക്രൂശിൽനിന്ന്, ഇറക്കുന്നതാണ് καθαιρέω സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: Ἄφετε എന്ന വാക്കിൽ സംസാരിക്കുന്നവന്റെ ഉദ്ദേശ്യം
  choice: മറ്റുള്ളവരോട് തൽക്കാലം ഇടപെടാതെ ‘വിടൂ’ എന്ന ആജ്ഞയായി പ്രധാനപാഠത്തിൽ നൽകി.
  alternative: “കാത്തിരിക്കൂ” എന്നും പരിഭാഷപ്പെടുത്താം.
  rationale: ἀφίημι എന്നതിന്റെ നേരിട്ടുള്ള ‘വിടുക/ഒഴിവാക്കുക’ എന്ന ഭാവം പ്രധാനപാഠത്തിൽ സൂക്ഷിക്കുകയും സന്ദർഭത്തിൽ സാധ്യമായ ഇടിയോമാറ്റിക് അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തതിനാൽ അവ്യക്തത അനാവശ്യമായി പരിഹരിക്കപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ തുടർച്ചയായ കൃദന്തരൂപങ്ങളെ സ്വാഭാവികമായ ആഖ്യാനക്രമത്തിൽ അവതരിപ്പിച്ചു; ἐπότιζεν എന്ന ഇംപെർഫെക്റ്റിന്റെ തുറന്ന പുരോഗമന/ശ്രമഭാവം ‘കുടിക്കാൻ കൊടുത്തുകൊണ്ട്’ എന്നതിലൂടെ സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
