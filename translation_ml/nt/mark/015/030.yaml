- from: കുരിശിൽനിന്ന് ഇറങ്ങിവന്ന് നിന്നെത്തന്നെ രക്ഷിക്കൂ![a]
  to: കുരിശിൽനിന്ന് ഇറങ്ങി നിന്നെത്തന്നെ രക്ഷിക്കൂ![a]
  rationale: The revision removes the unexpressed directional element ‘വന്ന്’ while retaining a natural Malayalam participial construction. The footnote preserves the syntactic ambiguity of καταβάς in relation to σῶσον and supplies the coordinate-imperative alternative without imposing a single interpretation.
  reviewer_model: gpt-5.6-terra
