  yaml_path: translation/nt/mark/015/030.yaml
  text: Save yourself[a], coming down from the cross!
translation:
  language: ml
  text: കുരിശിൽനിന്ന് ഇറങ്ങി നിന്നെത്തന്നെ രക്ഷിക്കൂ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിന്നെത്തന്നെ രക്ഷിക്കൂ; കുരിശിൽനിന്ന് ഇറങ്ങിവരൂ!” ഗ്രീക്കിലെ കൃതന്തരൂപം ഇറങ്ങിവരുന്നതിനെ രക്ഷിക്കാനുള്ള മാർഗമായോ മുഖ്യആജ്ഞയോടൊപ്പമുള്ള പ്രവൃത്തിയായോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶσον
  choice: രക്ഷിക്കൂ
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള ഭൂതകാല ആജ്ഞാരൂപം; പരിഹാസരൂപത്തിലുള്ള വെല്ലുവിളിയായി പ്രവർത്തിക്കുന്നു. ‘രക്ഷിക്കൂ’ എന്നത് നേരിട്ടുള്ള അർഥവും രക്ഷാഭാഷയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: σεαυτόν
  choice: നിന്നെത്തന്നെ
  rationale: σῶσον എന്ന ക്രിയയുടെ പ്രതിഫലക കർമം. പരിഹാസത്തിലെ ‘സ്വയം’ എന്ന ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καταβάς
  choice: ഇറങ്ങിവന്ന്
  rationale: καταβαίνω എന്ന ക്രിയയുടെ ഭൂതകാല സജീവ കൃദന്തരൂപം. പ്രധാന ആജ്ഞയോടു ചേർന്ന അനുബന്ധപ്രവൃത്തിയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഉപാധി, മുൻകാലപ്രവൃത്തി, അല്ലെങ്കിൽ രണ്ടാമത്തെ ആജ്ഞ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: കുരിശിൽനിന്ന്
  rationale: കുരിശിൽനിന്നുള്ള താഴേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പരിഭാഷ.
theological_decisions:
- issue: καταβάς എന്ന കൃദന്തരൂപവും σῶσον എന്ന ആജ്ഞയും തമ്മിലുള്ള ബന്ധം
  choice: ‘കുരിശിൽനിന്ന് ഇറങ്ങിവന്ന് നിന്നെത്തന്നെ രക്ഷിക്കൂ!’ എന്ന അനുബന്ധപ്രവൃത്തി വായന
  alternative: ‘കുരിശിൽനിന്ന് ഇറങ്ങിവന്ന് നിന്നെത്തന്നെ രക്ഷിക്കൂ’ എന്നത് ‘കുരിശിൽനിന്ന് ഇറങ്ങിവന്ന്/ഇറങ്ങുന്നതിലൂടെ രക്ഷിക്കൂ’ എന്നും ‘നിന്നെത്തന്നെ രക്ഷിക്കൂ; കുരിശിൽനിന്ന് ഇറങ്ങിവരൂ’ എന്നും ഗ്രഹിക്കാം.
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ആജ്ഞ–കൃദന്ത ഘടന ബന്ധം പൂർണമായി നിർവചിക്കുന്നില്ല. മുഖ്യപാഠം മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും അടിക്കുറിപ്പ് യഥാർഥ വ്യാകരണാത്മക അനിശ്ചിതത്വം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷ. ‘നിന്നെത്തന്നെ’ പരിഹാസത്തിലെ പ്രതിഫലക ഊന്നൽ സൂക്ഷിക്കുന്നു; ‘ഇറങ്ങിവന്ന്’ ഗ്രീക്ക് കൃദന്തരൂപത്തിന്റെ സംക്ഷിപ്തത മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ പുനരാവിഷ്കരിക്കുന്നു.
