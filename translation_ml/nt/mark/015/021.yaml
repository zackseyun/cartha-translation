source:
  edition: SBLGNT
  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: ml
  text: നാട്ടിൻപുറത്തുനിന്ന് വന്ന് വഴിയിലൂടെ കടന്നുപോകുകയായിരുന്ന, അലക്സാണ്ടറുടെയും രൂഫൊസിന്റെയും പിതാവായ കുറേനക്കാരനായ ശിമോൻ എന്ന ഒരാളെ അവർ യേശുവിന്റെ ക്രൂശ് ചുമക്കാൻ നിർബന്ധിച്ചു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നാട്ടിൻപുറത്തുനിന്ന്” എന്നതിന് “വയലിൽനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “നിർബന്ധിച്ചു” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയ നിർബന്ധിത സേവനത്തിനായി ഒരാളെ പിടിച്ചുനിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: ശിമോൻ ചുമന്നത് ക്രൂശിന്റെ കുറുകെമരമായിരുന്നുവെന്ന് ചിലർ മനസ്സിലാക്കുന്നു; എന്നാൽ ഗ്രീക്കിൽ പൊതുവായി “ക്രൂശ്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: നിർബന്ധിച്ചു
  rationale: നിർബന്ധിത സേവനത്തിനായി ഒരാളെ പിടിച്ചുനിർത്തുന്ന ആശയം ഈ ക്രിയയ്ക്കുണ്ട്; വെറും അഭ്യർഥനയെന്നതിനെക്കാൾ ബലപ്രയോഗത്തിന്റെ അർഥം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: παράγοντά τινα
  choice: അതുവഴി കടന്നുപോകുകയായിരുന്നു
  rationale: παράγοντα എന്ന വർത്തമാനകാല കൃദന്തം വഴിയിലൂടെ കടന്നുപോകുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടനയ്ക്കായി ശിമോനെ നേരിട്ട് വിഷയമാക്കി.
- source_word: Σίμωνα Κυρηναῖον
  choice: കുറേനക്കാരൻ ശിമോൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നൽകി; Κυρηναῖον എന്ന ഭൂമിശാസ്ത്രപരമായ വിശേഷണം കുറേനയിൽ നിന്നുള്ളവൻ എന്ന അർഥത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: നാട്ടിൻപുറത്തുനിന്ന് വന്ന്
  rationale: ἀγρός വയൽ, കൃഷിസ്ഥലം, നാട്ടിൻപുറം എന്നീ അർഥങ്ങൾ നൽകാം. സ്ഥലസൂചനയെ അനാവശ്യമായി ‘വയൽ’ എന്നു ചുരുക്കാതെ സന്ദർഭത്തിന് യോജിച്ച വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: അലക്സാണ്ടറിന്റെയും രൂഫൊസിന്റെയും പിതാവായ
  rationale: ശിമോനെ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ പ്രയോഗം നേരിട്ട് നിലനിർത്തി; ഈ പേരുകൾ വായനക്കാർക്ക് പരിചിതമായിരുന്നുവെന്ന അനുമാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἵνα ἄρῃ
  choice: ചുമക്കാൻ
  rationale: നിർബന്ധിച്ചതിന്റെ ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യരൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു; ἄρῃ ഇവിടെ ക്രൂശ് എടുത്തു വഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: σταυρὸν
  choice: ക്രൂശ്
  rationale: ഗ്രീക്ക് പദം പൊതുവായി ‘ക്രൂശ്’ എന്നാണ് പറയുന്നത്; ചരിത്രപരമായ പുനർനിർമാണത്തെ ആശ്രയിച്ച് ‘കുറുകെമരം’ എന്നു അർഥം ചുരുക്കിയിട്ടില്ല.
- source_word: αὐτοῦ
  choice: യേശുവിന്റെ
  rationale: സന്ദർഭത്തിൽ സർവനാമത്തിന്റെ വ്യക്തമായ സൂചിതൻ യേശുവാണ്. മലയാളത്തിൽ രണ്ട് പുരുഷന്മാരെ പരാമർശിക്കുന്നതിനാൽ ‘അവന്റെ’ എന്നത് ആശയക്കുഴപ്പം സൃഷ്ടിക്കാം; അതുകൊണ്ട് സൂചിതനെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശിമോന്റെമേൽ ചുമത്തിയ നിർബന്ധത്തിന്റെ സ്വഭാവം
  choice: അധികാരികൾ ശിമോനെ ക്രൂശ് ചുമക്കാൻ നിർബന്ധിച്ചു.
  alternative: അവർ നിർബന്ധമില്ലാതെ ശിമോനോട് ആവശ്യപ്പെട്ടു അല്ലെങ്കിൽ അവനെ സേവനത്തിന് ചേർത്തു.
  rationale: ἀγγαρεύω നിർബന്ധിത സേവനത്തിനോ ബലമായി സേവനത്തിൽ ഏർപ്പെടുത്തുന്നതിനോ ഉപയോഗിക്കുന്ന ക്രിയയാണ്; അതിന്റെ ബലപ്രയോഗസ്വഭാവം മയപ്പെടുത്തരുത്.
- issue: ശിമോൻ ചുമന്ന വസ്തുവിന്റെ കൃത്യത
  choice: മുഖ്യവാചകത്തിൽ ‘ക്രൂശ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കുറുകെമരം’ എന്നു കൂടുതൽ കൃത്യമായി നിർവചിക്കുക.
  rationale: ചരിത്രപരമായി ക്രൂശിന്റെ കുറുകെമരം ഉദ്ദേശിച്ചിരിക്കാമെങ്കിലും ഗ്രീക്ക് വാചകം σταυρός എന്ന പൊതുപദമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ഉറവിടത്തേക്കാൾ അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ ദീർഘമായ ഘടന രണ്ട് വാക്യങ്ങളാക്കി സ്വാഭാവികമാക്കി; നിർബന്ധത്തിന്റെ ശക്തിയും ἀγρός, σταυρός എന്നീ പദങ്ങളിലെ യഥാർഥ അർഥവ്യാപ്തിയും നിലനിർത്തി.
