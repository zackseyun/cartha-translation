  text: οἱ δὲ πάλιν ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/013.yaml
  text: But they cried out again, “Crucify him!”
translation:
  language: ml
  text: 'എന്നാൽ അവർ വീണ്ടും ഉറക്കെ വിളിച്ചു: “അവനെ ക്രൂശിക്കുക!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: അവർ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന ബഹുവചന നിർദേശകപദം മുമ്പ് പരാമർശിച്ച കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവർ’ എന്നു നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: പീലാത്തൊസിന്റെ മുൻചോദ്യത്തോടുള്ള മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു; ‘എന്നാൽ’ അതിനെ അതിശയിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനം നേരിട്ട് സൂചിപ്പിക്കുന്ന പദമാണ്; ‘വീണ്ടും’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἔκραξαν
  choice: ഉറക്കെ വിളിച്ചു
  rationale: κράζω ഉച്ചത്തിലുള്ള വിളിയെ സൂചിപ്പിക്കുന്നു; ‘ഉറക്കെ വിളിച്ചു’ തീവ്രതയും ആധുനിക മലയാളത്തിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: Σταύρωσον
  choice: ക്രൂശിക്കുക
  rationale: പീലാത്തൊസിനോടു പറയുന്ന ഏകവചന നേരിട്ടുള്ള കല്പനയാണ്; പരോക്ഷമായ ‘ക്രൂശിപ്പിക്കുക’ എന്നതിനെക്കാൾ ഗ്രീക്ക് രൂപത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം ലളിതമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ജനക്കൂട്ടത്തിന്റെ ഉച്ചത്തിലുള്ള ആവർത്തിച്ച ആവശ്യം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
