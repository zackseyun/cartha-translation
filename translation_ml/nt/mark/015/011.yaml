  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: ml
  text: എന്നാൽ, പകരം[b] ബറബ്ബാസിനെ അവർക്കു വിട്ടയക്കേണ്ടതിന് മഹാപുരോഹിതന്മാർ ജനക്കൂട്ടത്തെ ഇളക്കിവിട്ടു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനക്കൂട്ടത്തെ പ്രേരിപ്പിച്ചു.’ ഈ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരു കൂട്ടത്തെ ഉദ്ദേശിച്ച പ്രവൃത്തിയിലേക്കു ഉത്തേജിപ്പിക്കുക എന്ന അർഥമുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മറിച്ച്.’ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്ന മറ്റൊരാൾക്കു പകരം ബറബ്ബാസിനെ വിട്ടയക്കണമെന്ന മുൻഗണനയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: എന്നാൽ
  rationale: δέ ഇവിടെ മുൻസന്ദർഭത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἀρχιερεῖς
  choice: മഹാപുരോഹിതന്മാർ
  rationale: യെരൂശലേമിലെ പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന് മലയാള ബൈബിൾഭാഷയിൽ വ്യക്തവും പരിചിതവുമായ പ്രയോഗം.
- source_word: ἀνέσεισαν
  choice: ഇളക്കിവിട്ടു
  rationale: ഒരു കൂട്ടത്തെ ഉദ്ദേശിച്ച പ്രവൃത്തിയിലേക്ക് ഉത്തേജിപ്പിക്കുക എന്ന ἀνασείωയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തെ
  rationale: ὄχλος എന്നതിന് ആധുനികവും വ്യക്തവുമായ സാധാരണ മലയാളപദം.
- source_word: ἵνα
  choice: വിട്ടുകൊടുക്കേണ്ടതിന്
  rationale: തുടർന്നുള്ള ക്രിയയുടെ ഉദ്ദേശ്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: μᾶλλον
  choice: പകരം
  rationale: സന്ദർഭത്തിൽ സൂചിതമായ മറ്റൊരാളെക്കാൾ ബറബ്ബാസിനുള്ള മുൻഗണന വ്യക്തമാക്കുന്നു; സൂചിത താരതമ്യപദം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τὸν Βαραββᾶν
  choice: ബറബ്ബാസിനെ
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ പതിവായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ἀπολύσῃ
  choice: വിട്ടുകൊടുക്കേണ്ടതിന്
  rationale: ἵναയ്ക്ക് ശേഷമുള്ള എയോറിസ്റ്റ് സബ്ജങ്ക്റ്റീവ് പ്രകടിപ്പിക്കുന്ന ഉദ്ദേശിച്ച ഫലം നൽകുന്നു; പീലാത്തൊസാണ് സൂചിത കർത്താവ്.
- source_word: αὐτοῖς
  choice: തങ്ങൾക്കു
  rationale: മഹാപുരോഹിതന്മാർ ഇളക്കിവിട്ട ജനക്കൂട്ടത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; ദാതൃ/ഗുണഭോക്തൃബന്ധം നിലനിർത്തുന്നു.
