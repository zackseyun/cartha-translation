translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ സൂചിത കർത്താവായ പീലാത്തൊസിനെയോ താരതമ്യത്തിലെ സൂചിത മറ്റൊരാളെയോ മുഖ്യവാചകത്തിൽ അനാവശ്യമായി ചേർത്തിട്ടില്ല; μᾶλλον എന്നതിലെ താരതമ്യസമ്മർദം ‘പകരം’ വഴി നിലനിർത്തി.
