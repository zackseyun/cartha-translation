source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: ml
  text: അവർ അവനെ പരിഹസിച്ചശേഷം, നീലാങ്കി[a] ഊരിമാറ്റി അവന്റെ സ്വന്തം വസ്ത്രങ്ങൾ ധരിപ്പിച്ചു. പിന്നെ അവനെ ക്രൂശിക്കാനായി[b] പുറത്തേക്കു കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ആ പർപ്പിൾ’; സന്ദർഭത്തിൽ പർപ്പിൾനിറമുള്ള വസ്ത്രമാണ് ഉദ്ദേശിക്കുന്നത്. ‘പർപ്പിൾവസ്ത്രം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവനെ ക്രൂശിക്കേണ്ടതിന്’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ഉപവാക്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: പരിഹസിച്ചുകഴിഞ്ഞപ്പോൾ
  rationale: ക്രിയയിലെ നിന്ദാപരമായ പരിഹാസവും ὅτε കൊണ്ടുള്ള കാലബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: ആ ധൂമ്രവസ്ത്രം ഊരിമാറ്റി
  rationale: ἐκδύω വസ്ത്രം ഒരാളിൽനിന്ന് ഊരുന്നതിനെ സൂചിപ്പിക്കുന്നു; πορφύρα ഇവിടെ സന്ദർഭത്തിൽ ധൂമ്രനിറമുള്ള പരിഹാസരാജവസ്ത്രമാണ്.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: അവന്റെ സ്വന്തം വസ്ത്രങ്ങൾ ധരിപ്പിച്ചു
  rationale: τὰ ἴδιαയിലെ ‘സ്വന്തം’ എന്ന ഊന്നൽ നിലനിർത്തുകയും ἐνδύωയുടെ മറ്റൊരാളെ വസ്ത്രം ധരിപ്പിക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐξάγουσιν
  choice: പുറത്തേക്കു കൊണ്ടുപോകുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തിന്റെ ആഖ്യാനസജീവത നിലനിർത്തുന്നു; കാവൽക്കാർ യേശുവിനെ കൊണ്ടുപോകുന്ന സന്ദർഭത്തിന് യോജിച്ച പ്രയോഗമാണിത്.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: അവനെ ക്രൂശിക്കാനായി
  rationale: ἵνα ഉപവാക്യത്തിലെ ഉദ്ദേശ്യം മലയാളത്തിലെ സ്വാഭാവികമായ ഉദ്ദേശ്യരൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: σταυρώσωσιν
  choice: ക്രൂശിക്കുക
  rationale: ക്രൂശിക്കൽ എന്ന പ്രത്യേക വധരീതിയെ കൃത്യവും പരിചിതവുമായ പദത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ക്രൂശിക്കപ്പെടുന്നതിനു മുമ്പുള്ള യേശുവിന്റെ അപമാനത്തിന്റെ ആഖ്യാനവിവരണം
  choice: പരിഹാസം, ധൂമ്രവസ്ത്രം ഊരിമാറ്റൽ, സ്വന്തം വസ്ത്രങ്ങൾ ധരിപ്പിക്കൽ, ക്രൂശിക്കാനായി പുറത്തേക്കു കൊണ്ടുപോകൽ എന്നിവ നേരിട്ടുള്ള ചരിത്രാഖ്യാനമായി വിവർത്തനം ചെയ്തു.
  alternative: സംഭവങ്ങളുടെ രാജത്വപ്രതീകമോ പ്രായശ്ചിത്തപരമായ അർഥമോ വ്യാഖ്യാനമായി വാചകത്തിൽ ചേർക്കുക.
  rationale: മൂലവാക്യം സംഭവങ്ങളെ നേരിട്ട് വിവരിക്കുന്നു; അതിലുള്ള അപമാനം നിലനിർത്തുമ്പോഴും വാചകത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ἐξάγουσιν എന്ന ചരിത്രവർത്തമാനകാലം
  choice: ‘കൊണ്ടുപോകുന്നു’ എന്ന വർത്തമാനകാലം നിലനിർത്തി.
  alternative: മലയാള ആഖ്യാനക്രമത്തിനനുസരിച്ച് ‘കൊണ്ടുപോയി’ എന്ന് ഭൂതകാലമാക്കുക.
  rationale: മൂലഗ്രീക്കിലെ പെട്ടെന്നുള്ള ചരിത്രവർത്തമാനം ആഖ്യാനത്തിന് നൽകുന്ന സജീവത സംരക്ഷിക്കുന്നു; അതേസമയം ഇത് കാലമാറ്റമായി വായിക്കപ്പെടാനുള്ള സാധ്യത അടിക്കുറിപ്പില്ലാതെ സഹിക്കാവുന്നതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ധൂമ്രവസ്ത്രം’, ‘ക്രൂശിക്കുക’ തുടങ്ങിയ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ പദങ്ങൾ നിലനിർത്തി; അനാവശ്യമായ പുരാതനപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
