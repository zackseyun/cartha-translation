  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി. മുഖ്യവാചകത്തിൽ സന്ദർഭത്തിൽ സൂചിതമായ പീലാത്തൊസിനെയും ‘ചെയ്യണമെന്ന്’ എന്ന പൂരകത്തെയും വ്യക്തമാക്കി വായനാസൗകര്യം കൂട്ടിയിരിക്കുന്നു; അടിക്കുറിപ്പിൽ ഗ്രീക്ക് ഘടനയോട് കൂടുതൽ അടുത്ത രൂപം നൽകിയിരിക്കുന്നു.
