  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: ml
  text: അവർ അവനെ ക്രൂശിക്കുന്നു; അവന്റെ വസ്ത്രങ്ങൾ അവർ തമ്മിൽ പങ്കിടുന്നു—ആർ എന്ത് എടുക്കണമെന്ന് തീരുമാനിക്കാൻ അവയുടെമേൽ നറുക്കിടുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവയുടെമേൽ നറുക്കിട്ട്, ആർ എന്ത് എടുക്കണമെന്ന് തീരുമാനിക്കാൻ.”
    reason: ἐπ’ αὐτὰ τίς τί ἄρῃ എന്നതിന്റെ കൂടുതൽ രൂപസാദൃശ്യമുള്ള വിവർത്തനസാധ്യത; ‘ആർ എന്ത്’ എന്ന വിതരണാർഥം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: σταυροῦσιν
  choice: ക്രൂശിക്കുന്നു
  rationale: മർക്കോസിന്റെ ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലത്തിന്റെ സജീവത നിലനിർത്തുന്നു; മലയാളത്തിലും സന്ദർഭത്തിൽ സ്വാഭാവികമായി വായിക്കാം.
- source_word: διαμερίζονται
  choice: പങ്കിട്ടെടുക്കുന്നു
  rationale: വസ്ത്രങ്ങൾ ഭാഗങ്ങളാക്കി ഓരോരുത്തരും കൈവശമാക്കുന്നതെന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἱμάτια
  choice: വസ്ത്രങ്ങൾ
  rationale: വസ്ത്രങ്ങളുടെ വിവിധ ഇനങ്ങളെ ഉൾക്കൊള്ളുന്ന നേരിട്ടുള്ളതും മാന്യവുമായ പൊതുപദം.
- source_word: βάλλοντες κλῆρον
  choice: നറുക്കിടുന്നു
  rationale: വിഹിതം യാദൃച്ഛികമായി നിശ്ചയിക്കുന്ന പ്രവൃത്തിക്കുള്ള സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐπ’ αὐτὰ
  choice: അവയ്ക്കായി
  rationale: നറുക്കിടൽ വസ്ത്രങ്ങളുടെ വിഭജനത്തെ സംബന്ധിക്കുന്നതാണെന്ന് സൂചിപ്പിക്കുമ്പോൾ ഗ്രീക്കിലെ ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τίς τί ἄρῃ
  choice: ആർക്ക് ഏത് എടുക്കാമെന്നു നിശ്ചയിക്കാൻ
  rationale: τίς τί എന്ന ഇരട്ട വിതരണാർഥം—ഏത് വ്യക്തിക്ക് ഏത് വസ്തു—വ്യക്തമായി നൽകുന്നു; സബ്ജങ്ക്റ്റീവിന്റെ നിർണയിക്കപ്പെടുന്ന ഫലവും സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: പീഡാനുഭവവിവരണത്തിലെ ചരിത്രവർത്തമാനകാലം
  choice: “ക്രൂശിക്കുന്നു” എന്ന വർത്തമാനകാലം നിലനിർത്തി.
  alternative: “ക്രൂശിച്ചു” എന്ന ഭൂതകാലം.
  rationale: മർക്കോസിന്റെ ഗ്രീക്ക് ആഖ്യാനത്തിന്റെ സജീവതയും വാക്യഘടനയും പ്രതിഫലിപ്പിക്കുന്നു; ഇത് പ്രത്യേകമായ ഒരു ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: നറുക്കിന്റെ കൃത്യമായ പ്രവർത്തനം
  choice: ആർക്ക് ഏത് വസ്ത്രം എടുക്കാമെന്ന് നിശ്ചയിക്കുന്ന മാർഗമായി അവതരിപ്പിച്ചു.
  alternative: “അവയുടെമേൽ നറുക്കിട്ട്, ആർ എന്ത് എടുക്കുമെന്ന് അറിയാൻ” എന്ന കൂടുതൽ രൂപസാദൃശ്യമുള്ള വിവർത്തനം.
  rationale: ഗ്രീക്കിലെ τίς τί ἄρῃ എന്ന വാചകത്തിന്റെ വിതരണാർഥം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പിൽ കൂടുതൽ രൂപസാദൃശ്യമുള്ള സാധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. “ക്രൂശിക്കുന്നു” എന്ന ചരിത്രവർത്തമാനകാലം മൂലപാഠത്തിന്റെ സജീവത നിലനിർത്തുന്നു. “നറുക്കിടുന്നു” സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗമാണ്; അടിക്കുറിപ്പ് ഗ്രീക്ക് ഘടനയോട് കൂടുതൽ അടുത്ത മറ്റൊരു രൂപം നൽകുന്നു.
