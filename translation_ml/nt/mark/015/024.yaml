    rationale: ‘ആർക്ക് ഏത് എടുക്കാമെന്നു’ can mean ‘who is allowed to take which,’ whereas τίς τί ἄρῃ expresses the lot’s determination of who takes what. ‘ആർ എന്ത് എടുക്കണമെന്ന് തീരുമാനിക്കാൻ’ more directly preserves this sense.
  - severity: low
