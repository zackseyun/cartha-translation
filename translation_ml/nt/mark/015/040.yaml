  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: ml
  text: അകലത്തുനിന്ന് നോക്കിക്കൊണ്ടിരുന്ന സ്ത്രീകളും ഉണ്ടായിരുന്നു. അവരിൽ മഗ്ദലക്കാരിയായ മറിയയും, ചെറിയ യാക്കോബിന്റെയും[b] യോസേസിന്റെയും[c] അമ്മയായ മറിയയും, ശലോമിയും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “ചെറിയ യാക്കോബ്” എന്നതിലെ ഗ്രീക്ക് വിശേഷണം പ്രായത്തിൽ ഇളയവൻ, ശരീരത്തിൽ ചെറിയവൻ, അല്ലെങ്കിൽ താരതമ്യേന കുറഞ്ഞ പ്രാധാന്യമുള്ളവൻ എന്നിങ്ങനെയും സൂചിപ്പിക്കാം; ഉദ്ദേശിച്ചിരിക്കുന്ന വ്യത്യാസം വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെയുള്ള ഗ്രീക്ക് പേര് യോസേസ് എന്നാണ്; അത് യോസേഫ് എന്ന പേരിൽനിന്ന് വ്യത്യസ്തമായ രൂപമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ γυναῖκες
  choice: സ്ത്രീകളും അവിടെ ഉണ്ടായിരുന്നു
  rationale: δέയുടെ നേരിയ ആഖ്യാനമാറ്റവും καίയുടെ ഉൾപ്പെടുത്തൽഭാവവും സ്വാഭാവികമായ മലയാളവാക്യത്തിൽ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ വ്യക്തമായ ‘അവിടെ’ ചേർക്കുന്നത് സ്ഥലം വ്യക്തമാക്കുന്നു, പുതിയ അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: അകലത്തുനിന്ന് നോക്കിക്കൊണ്ടിരുന്ന
  rationale: ἀπὸ μακρόθεν എന്ന സ്ഥലപരമായ അർഥവും θεωροῦσαι എന്ന വർത്തമാന കൃദന്തരൂപത്തിലെ തുടർച്ചയായ നിരീക്ഷണഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν αἷς
  choice: അവരിൽ
  rationale: വലിയ സ്ത്രീസംഘത്തിനുള്ളിൽ പേരെടുത്തുപറയുന്നവരെ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് ബന്ധവാക്യത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: മഗ്ദലക്കാരി മറിയ
  rationale: സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന ἡ Μαγδαληνήയെ മലയാളത്തിൽ വ്യക്തമായ വിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: ഇളയ യാക്കോബിന്റെയും യോസേസിന്റെയും അമ്മയായ മറിയ
  rationale: μήτηρ രണ്ടു ഷഷ്ഠീവ്യാകരണ നാമങ്ങളോടും ബന്ധപ്പെടുന്നതു വ്യക്തമാക്കുന്നു; τοῦ μικροῦയുടെ സാധ്യതകളിൽ വായനാസൗകര്യമുള്ള ‘ഇളയ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Ἰωσῆτος
  choice: യോസേസ്
  rationale: ഗ്രീക്കിലെ Ἰωσῆς എന്ന പ്രത്യേക നാമരൂപം ‘യോസേഫ്’ എന്നാക്കി ഏകീകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: Σαλώμη
  choice: ശലോമ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ പ്രചാരമുള്ള മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: τοῦ μικροῦ എന്ന യാക്കോബിന്റെ വിശേഷണത്തിന്റെ കൃത്യമായ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ഇളയ’
  alternative: ‘ചെറിയവൻ’ അല്ലെങ്കിൽ ‘അപ്രധാനൻ/കുറഞ്ഞവൻ’ എന്ന ആശയം
  rationale: μικρός പ്രായം, ശരീരവലുപ്പം, അല്ലെങ്കിൽ താരതമ്യേന കുറഞ്ഞ സ്ഥാനം എന്നിവ സൂചിപ്പിക്കാം. വ്യക്തിയെ വേർതിരിച്ചറിയിക്കുന്ന വിശേഷണമായി ‘ഇളയ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; എന്നാൽ മൂലപാഠം കാരണം വ്യക്തമാക്കാത്തതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: മറിയയുടെ മക്കളുടെ തിരിച്ചറിയൽ
  choice: യാക്കോബും യോസേസും മറിയയുടെ മക്കളാണെന്ന വ്യാകരണബന്ധം മാത്രം വ്യക്തമാക്കുന്നു
  alternative: മറ്റു സുവിശേഷപാത്രങ്ങളുമായോ യേശുവിന്റെ കുടുംബവുമായി ഇവരെ വ്യക്തമായി സമീകരിക്കൽ
  rationale: ഈ വാക്യം അത്തരം കൂടുതൽ തിരിച്ചറിയൽ നൽകുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമോ സഭാപാരമ്പര്യപരമോ ആയ സമീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ കാഴ്ചയെ ‘നോക്കിക്കൊണ്ടിരുന്ന’ എന്നു പ്രകടിപ്പിച്ചു. പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു; മൂലപാഠത്തിലെ പേരുവ്യത്യാസവും μικρός എന്ന പദത്തിന്റെ യഥാർഥ അവ്യക്തതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
