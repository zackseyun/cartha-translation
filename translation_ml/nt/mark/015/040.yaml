- from: അകലത്തുനിന്ന് നോക്കിക്കൊണ്ടിരുന്ന സ്ത്രീകളും അവിടെ ഉണ്ടായിരുന്നു.[a] അവരിൽ മഗ്ദലക്കാരി മറിയയും, ഇളയ യാക്കോബിന്റെയും യോസേസിന്റെയും അമ്മയായ മറിയയും,[b][c] ശലോമയും ഉണ്ടായിരുന്നു.
