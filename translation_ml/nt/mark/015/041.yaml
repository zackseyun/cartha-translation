source:
  edition: SBLGNT
  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: ml
  text: ഈ സ്ത്രീകൾ, അവൻ ഗലീലയിൽ ആയിരുന്നപ്പോൾ, പതിവായി അവനെ അനുഗമിക്കുകയും അവനു സേവനം[a] ചെയ്യുകയും ചെയ്തിരുന്നു. അവനോടൊപ്പം യെരൂശലേമിലേക്കു കയറിപ്പോയ[b] മറ്റു പല സ്ത്രീകളും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ പരിചരിച്ചു.” ഗ്രീക്ക് ക്രിയ പ്രായോഗിക സേവനത്തെയോ പിന്തുണയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവനോടൊപ്പം യെരൂശലേമിലേക്കു കയറിപ്പോയ.” യെരൂശലേമിലേക്കുള്ള യാത്രയെ ‘കയറുക’ എന്നു പറയുന്ന പതിവ് ബൈബിൾപ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: ഈ സ്ത്രീകൾ
  rationale: മുൻവാക്യത്തിൽ പേരെടുത്ത സ്ത്രീകളിലേക്കുള്ള ബന്ധസർവനാമത്തിന്റെ സൂചന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: അവൻ ഗലീലയിൽ ആയിരുന്നപ്പോൾ
  rationale: കാലസൂചനയും സ്ഥലസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἠκολούθουν
  choice: പതിവായി അനുഗമിക്കുകയും ... ചെയ്തിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായോ പതിവായോ ഉള്ള മുൻകാല പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: διηκόνουν αὐτῷ
  choice: അവനു സേവനം ചെയ്യുകയും ചെയ്തിരുന്നു
  rationale: പ്രായോഗിക പരിചരണവും പിന്തുണയും ഉൾക്കൊള്ളാവുന്ന διακονέω എന്ന ക്രിയയുടെ വിശാലത നിലനിർത്തുന്നു; പിൽക്കാല സഭാപദവിയുടെ അർഥം ഇതിൽ ആരോപിക്കുന്നില്ല.
- source_word: ἄλλαι πολλαὶ
  choice: മറ്റു പല സ്ത്രീകളും
  rationale: സ്ത്രീലിംഗ ബഹുവചനസന്ദർഭം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: അവനോടൊപ്പം ... കയറിവന്ന
  rationale: പ്രധാന പ്രസ്താവനയ്ക്കു മുമ്പുണ്ടായ കൂട്ടയാത്രയും യെരൂശലേമിലേക്കു ‘കയറുക’ എന്ന ബൈബിൾപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിലേക്കു
  rationale: നഗരത്തിലേക്കുള്ള ലക്ഷ്യദിശയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: διηκόνουν സൂചിപ്പിക്കുന്ന സ്ത്രീകളുടെ സേവനത്തിന്റെ സ്വഭാവം
  choice: അവനു സേവനം ചെയ്യുക
  alternative: അവനെ പരിചരിക്കുക / അവനു ശുശ്രൂഷ ചെയ്യുക
  rationale: പ്രായോഗിക സഹായം, പരിചരണം, പിന്തുണ എന്നിവയ്ക്കുള്ള സാധ്യത തുറന്നുവെക്കുന്നു; അതിനെ വീട്ടുജോലിയായി ചുരുക്കുകയോ ഔദ്യോഗിക സഭാശുശ്രൂഷയായി വ്യാഖ്യാനിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. അപൂർണഭൂതകാലത്തിന്റെ പതിവുസ്വഭാവം ‘പതിവായി ... ചെയ്തിരുന്നു’ എന്ന ഘടനയിലൂടെ വ്യക്തമാക്കി. മൂലപാഠത്തിലെ യെരൂശലേമിലേക്കു ‘കയറുക’ എന്ന സാംസ്കാരിക-ബൈബിൾ ഭാഷാശൈലി നിലനിർത്തി.
