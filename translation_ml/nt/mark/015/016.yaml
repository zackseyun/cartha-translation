id: MRK.15.16
reference: Mark 15:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: ml
  text: പിന്നെ സൈനികർ അവനെ അങ്കണത്തിനകത്തേക്ക്—അതായത്, പ്രെത്തോറിയത്തിലേക്ക്—കൊണ്ടുപോയി[a]. അവർ സൈനികഗണത്തെ മുഴുവനും വിളിച്ചുകൂട്ടി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഗവർണറുടെ ആസ്ഥാനം.”
    reason: lexical_alternative
  - marker: b
    text: “സൈനികഗണം” ഒരു റോമൻ കോഹോർട്ട് എന്ന സൈനികവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ റോമൻ അധികാരത്തിൻകീഴിലുള്ള സൈനികരുടെ സംഘത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: പിന്നെ
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: στρατιῶται
  choice: പടയാളികൾ
  rationale: റോമൻ അധികാരത്തിൻകീഴിലുള്ള വ്യക്തിഗത സൈനികരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപദം.
- source_word: ἀπήγαγον
  choice: കൊണ്ടുപോയി
  rationale: ഒരാളെ ഒരു നിർദിഷ്ട സ്ഥാനത്തേക്കു നയിച്ചുകൊണ്ടുപോകുക എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു.
- source_word: ἔσω τῆς αὐλῆς
  choice: അങ്കണത്തിനകത്തേക്ക്
  rationale: ἔσω എന്നതിന്റെ അകത്തേക്കുള്ള ദിശയും αὐλή എന്നതിന്റെ അങ്കണം എന്ന അർഥവും അനാവശ്യമായ സ്ഥലവിവരങ്ങൾ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὅ ἐστιν πραιτώριον
  choice: പ്രെത്തോറിയം എന്നറിയപ്പെടുന്ന
  rationale: റോമൻ ഭരണ-സൈനിക പശ്ചാത്തലമുള്ള ചരിത്രപരമായ പദം ലിപ്യന്തരണം ചെയ്തും ഗ്രീക്കിലെ വിശദീകരണസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിച്ചും നൽകുന്നു.
- source_word: συγκαλοῦσιν
  choice: വിളിച്ചുകൂട്ടി
  rationale: ഒരുമിച്ച് സമ്മേളിക്കാൻ വിളിക്കുക എന്ന സംയുക്തപദത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം സ്വാഭാവിക മലയാള ആഖ്യാനത്തിനായി ഭൂതകാലത്തിൽ നൽകി.
- source_word: ὅλην τὴν σπεῖραν
  choice: സൈനികഗണത്തെ മുഴുവനും
  rationale: σπεῖρα ഒരു റോമൻ സൈനികവിഭാഗമാണെന്ന ആശയം സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; കൃത്യമായ ചരിത്രവിശദീകരണം അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ചരിത്രപദമായ πραιτώριον ‘പ്രെത്തോറിയം’ എന്നു നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. σπεῖρα സാങ്കേതികമായി അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ ‘സൈനികഗണം’ എന്നു പരിഭാഷപ്പെടുത്തി ചരിത്രവിവരം അടിക്കുറിപ്പിലാക്കി.
