revisions:
- from: പിന്നെ പടയാളികൾ അവനെ പ്രെത്തോറിയം എന്നറിയപ്പെടുന്ന അങ്കണത്തിനകത്തേക്കു കൊണ്ടുപോയി[a]. അവർ സൈനികഗണത്തെ മുഴുവനും വിളിച്ചുകൂട്ടി[b].
  to: പിന്നെ സൈനികർ അവനെ അങ്കണത്തിനകത്തേക്ക്—അതായത്, പ്രെത്തോറിയത്തിലേക്ക്—കൊണ്ടുപോയി[a]. അവർ സൈനികഗണത്തെ മുഴുവനും വിളിച്ചുകൂട്ടി[b].
