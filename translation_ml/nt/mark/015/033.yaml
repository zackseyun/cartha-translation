source:
  edition: SBLGNT
  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: ml
  text: ആറാം മണിക്കൂർ ആയപ്പോൾ[b], ദേശം മുഴുവൻ[a] ഒൻപതാം മണിക്കൂർ വരെ ഇരുട്ട് പരന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭൂമി മുഴുവൻ.” ഗ്രീക്ക് പദത്തിന് “ദേശം” എന്നും “ഭൂമി” എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: അതായത്, ഏകദേശം ഉച്ചമുതൽ ഉച്ചകഴിഞ്ഞ് മൂന്നുമണിവരെ.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: ആറാം മണിക്കൂർ ആയപ്പോൾ
  rationale: ഗ്രീക്കിലെ genitive absolute കാലസൂചനയായി സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു. പുരാതന സമയഗണന മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും ആധുനിക സമയത്തിന് അടിക്കുറിപ്പിൽ വിശദീകരണം നൽകുകയും ചെയ്യുന്നു.
- source_word: σκότος
  choice: ഇരുട്ട്
  rationale: σκότος എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാള തുല്യപദമാണിത്.
- source_word: ἐγένετο
  choice: ഇരുട്ടായി
  rationale: ഇരുട്ട് സംഭവിച്ചു/വ്യാപിച്ചു എന്ന eventive അർഥം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ നൽകുന്നു; അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: ദേശം മുഴുവൻ
  rationale: γῆ എന്നത് ‘ദേശം’ എന്നും ‘ഭൂമി’ എന്നും അർഥമാകാം. സന്ദർഭത്തിൽ ‘ദേശം’ സ്വാഭാവികമാണെങ്കിലും യഥാർഥ പദാർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἕως ὥρας ἐνάτης
  choice: ഒൻപതാം മണിക്കൂർവരെ
  rationale: ആറാം മണിക്കൂർ എന്ന ആദ്യ സമയസൂചനയോടുള്ള ഏകീകരണം നിലനിർത്തുകയും മൂലപാഠത്തിന്റെ സമയപ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ക്രൂശീകരണസമയത്തെ ഇരുട്ടിന്റെ വ്യാപ്തി സൂചിപ്പിക്കുന്ന γῆ
  choice: ദേശം
  alternative: ഭൂമി
  rationale: γῆ-യ്ക്ക് പ്രാദേശികമായ ‘ദേശം’ എന്നും വിശാലമായ ‘ഭൂമി’ എന്നും അർഥസാധ്യതയുണ്ട്. മുഖ്യപാഠത്തിൽ ‘ദേശം’ ഉപയോഗിക്കുന്നത് ആഗോള വ്യാപ്തി ഉറപ്പിച്ചു പറയുന്നത് ഒഴിവാക്കുന്നു; ‘ഭൂമി’ എന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നത് ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും പദസന്ദിഗ്ധതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പുരാതന സമയഗണന മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ച് വായനാസഹായം അടിക്കുറിപ്പിൽ നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
