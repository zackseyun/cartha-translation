  text: Καὶ ἤδη ὀψίας γενομένης, ἐπεὶ ἦν παρασκευή, ὅ ἐστιν ⸀προσάββατον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/042.yaml
  text: And when evening had already come[a], since it was the Preparation Day—that is[c][b], the day before the Sabbath—
translation:
  language: ml
  text: നേരം ഇതിനകം വൈകുന്നേരമായിരുന്നു.[a] അന്ന് ഒരുക്കനാൾ ആയിരുന്നതിനാൽ—അതായത്, ശബ്ബത്തിന്റെ തലേദിവസം[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇതിനകം വൈകുന്നേരമായപ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ഒരുക്കം’; ശബ്ബത്തിന് മുമ്പുള്ള ഒരുക്കദിവസത്തെ സൂചിപ്പിക്കുന്ന പദം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘ശബ്ബത്തിന്റെ തലേന്ന്’; ഈ പദം ശബ്ബത്തിന് മുമ്പുള്ള ദിവസത്തെ, പരമ്പരാഗതമായി വെള്ളിയാഴ്ചയെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: നേരം ഇതിനകം വൈകുന്നേരമായിരുന്നു
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു. ἤδηയുടെ ‘ഇതിനകം’ എന്ന അർഥവും γενομένηςയുടെ അവസ്ഥാമാറ്റഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρασκευή
  choice: ഒരുക്കനാൾ
  rationale: ഇവിടെ പൊതുവായ ഒരുക്കമല്ല, ശബ്ബത്തിന് മുമ്പുള്ള അംഗീകൃത ഒരുക്കദിനമാണ് ഉദ്ദേശിക്കുന്നത്. ‘ഒരുക്കനാൾ’ ചുരുക്കവും കലണ്ടർപരമായ അർഥം വഹിക്കുന്നതുമാണ്.
- source_word: προσάββατον
  choice: ശബ്ബത്തിന്റെ തലേദിവസം
  rationale: ὅ ἐστιν എന്ന വിശദീകരണവാക്യം παρασκευήയുടെ അർഥം വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു. ‘വെള്ളിയാഴ്ച’ എന്നു നിർണ്ണയിക്കുന്നതിനെക്കാൾ ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ഇതു കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐπεὶ
  choice: ആയിരുന്നതിനാൽ
  rationale: കഥാസന്ദർഭത്തിൽ കാരണവും വിശദീകരണവും അവതരിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὅ ἐστιν
  choice: അതായത്
  rationale: വിശദീകരണസൂത്രവാക്യത്തിന്റെ വ്യക്തവും സാധാരണവുമായ മലയാളരൂപം.
- source_word: Καὶ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: മലയാള കഥനത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി വാക്യാരംഭത്തിലെ ബന്ധകത്തെ പരോക്ഷമായി ഉൾപ്പെടുത്തി; ഗ്രീക്കിലെ തുടർച്ചാസ്വഭാവം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ അപൂർണ്ണമായി തുടരുന്ന വാക്യഘടന ദീർഘരേഖയിലൂടെ നിലനിർത്തി; അടുത്ത വാക്യഭാഗത്തിലേക്കുള്ള ഒഴുക്ക് സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
