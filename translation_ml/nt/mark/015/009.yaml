source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: ml
  text: 'എന്നാൽ പീലാത്തോസ് അവരോടു മറുപടി പറഞ്ഞു: “ഞാൻ യെഹൂദന്മാരുടെ[a] രാജാവിനെ നിങ്ങൾക്കു വിട്ടയക്കണമെന്നു നിങ്ങൾ ആഗ്രഹിക്കുന്നുവോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദ്യക്കാരുടെ രാജാവിനെ.” ഗ്രീക്ക് പദമായ Ἰουδαίων എന്നതിന് “യെഹൂദന്മാർ” എന്നും “യെഹൂദ്യക്കാർ” എന്നും അർഥമാകാം. എന്നാൽ പീഡാനുഭവവിവരണത്തിലെ ഈ സ്ഥിരമായ രാജപദവിയിൽ “യെഹൂദന്മാർ” എന്ന വിവർത്തനമാണ് പരമ്പരാഗതവും സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ചതും.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള നേരിയ വ്യത്യാസവും ആഖ്യാനത്തിലെ വഴിത്തിരിവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: അവരോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ മറുപടി പറയുന്ന പ്രവൃത്തിയും തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകളും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു; λέγων എന്നതിനെ വേർതിരിച്ച് അക്ഷരാർഥത്തിൽ ആവർത്തിക്കുന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: Θέλετε
  choice: നിങ്ങൾ ആഗ്രഹിക്കുന്നത്
  rationale: ഇവിടെ θέλω ആഗ്രഹമോ ഇച്ഛയോ പ്രകടിപ്പിക്കുന്നു; ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘എന്നാണോ നിങ്ങൾ ആഗ്രഹിക്കുന്നത്?’ എന്ന ഘടന ഉപയോഗിച്ചു.
- source_word: ἀπολύσω
  choice: ഞാൻ ... വിട്ടുതരണമെന്നാണോ
  rationale: തടവുകാരനെ മോചിപ്പിക്കുന്ന ന്യായാധിപത്യസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘വിട്ടുതരുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: പീലാത്തോസിന്റെ മോചനപ്രവൃത്തിയുടെ ഗുണഭോക്താക്കളെയോ സ്വീകരിക്കുന്നവരെയോ സൂചിപ്പിക്കുന്ന ദത്തിവ് നിലനിർത്തുന്നു.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ രാജാവിനെ
  rationale: പീഡാനുഭവവിവരണത്തിലെ സ്ഥിരമായ രാഷ്ട്രീയ രാജപദവി നിലനിർത്തുന്നു. മലയാളത്തിൽ ബഹുമാനസൂചക ബഹുവചനം ഒഴിവാക്കി ‘രാജാവിനെ’ എന്നു നൽകുന്നത് സന്ദർഭത്തിന് യോജിക്കുന്നു.
theological_decisions:
- issue: τὸν βασιλέα τῶν Ἰουδαίων എന്ന പദവിയുടെ വിവർത്തനം
  choice: യെഹൂദന്മാരുടെ രാജാവ്
  alternative: യെഹൂദ്യരുടെ രാജാവ്
  rationale: Ἰουδαῖοι എന്നതിന് ജനവിഭാഗത്തെയോ യെഹൂദ്യപ്രദേശക്കാരെയോ സൂചിപ്പിക്കാനാകുമെങ്കിലും, പീഡാനുഭവവിവരണത്തിലെ ഈ സ്ഥിരമായ രാഷ്ട്രീയപദവിയിൽ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥം ‘യെഹൂദന്മാരുടെ രാജാവ്’ എന്നതാണ്. ഇത് വിവർത്തകൻ ചേർക്കുന്ന വിശ്വാസപ്രഖ്യാപനമല്ല; കഥയിലെ പരിഹാസവും രാഷ്ട്രീയ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് ഘടനയുടെ അർഥബന്ധങ്ങൾ സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ അസ്വാഭാവികമായ ‘മറുപടി പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന ആവർത്തനം ഒഴിവാക്കി. നേരിട്ടുള്ള ചോദ്യം വ്യക്തവും സംസാരഭാഷയോട് ചേർന്നതുമായ രീതിയിൽ നൽകിയിരിക്കുന്നു.
