source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος πάλιν ⸀ἐπηρώτα αὐτὸν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; ἴδε πόσα σου ⸀κατηγοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: ml
  text: 'എന്നാൽ പീലാത്തൊസ് വീണ്ടും അവനോടു ചോദിച്ചു: “നീ ഒന്നും മറുപടി പറയുന്നില്ലേ? നോക്കൂ, അവർ നിന്റെമേൽ എത്ര കുറ്റങ്ങളാണ് ചുമത്തുന്നത്!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നോക്കൂ, അവർ നിനക്കെതിരെ എത്ര കാര്യങ്ങൾ ആരോപിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ആഖ്യാനത്തിന്റെ മുന്നേറ്റത്തിൽ നേരിയ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; യേശുവിന്റെ മൗനത്തോടുള്ള പീലാത്തൊസിന്റെ പ്രതികരണത്തിലേക്കുള്ള സ്വാഭാവിക മാറ്റം.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ചോദ്യം ആവർത്തിച്ചതിനെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἐπηρώτα
  choice: ചോദിച്ചു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടർന്നോ ആവർത്തിച്ചോ ചോദിച്ചതിനെ സൂചിപ്പിക്കാം; πάλιν എന്നതോടൊപ്പം മലയാളത്തിലെ സ്വാഭാവികമായ ‘വീണ്ടും ... ചോദിച്ചു’ ആ ഭാവം നൽകുന്നു.
- source_word: λέγων
  choice: 'ചോദിച്ചു:'
  rationale: ഗ്രീക്കിലെ സംസാരപരിചയപ്പെടുത്തുന്ന കൃതന്തം മലയാളത്തിൽ പ്രത്യേകമായി ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ആവർത്തിക്കാതെ നേരിട്ടുള്ള ഉദ്ധരണിയിലേക്കുള്ള ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: നീ ഒന്നും മറുപടി പറയുന്നില്ലേ?
  rationale: οὐκ...οὐδέν എന്ന നിഷേധഘടനയും യേശുവിന്റെ മൗനത്തെ സമ്മർദത്തോടെ ചോദ്യം ചെയ്യുന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἴδε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞ; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുമാണ്.
- source_word: πόσα
  choice: എത്രയെത്ര കുറ്റങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘എത്ര കാര്യങ്ങൾ’ എന്നാണെങ്കിലും ന്യായവിചാരണാസന്ദർഭവും κατηγοροῦσιν എന്ന ക്രിയയും കുറ്റാരോപണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘എത്രയെത്ര’ അനേകതയ്ക്കുള്ള ഊന്നൽ പകരുന്നു.
- source_word: σου κατηγοροῦσιν
  choice: അവർ നിന്റെമേൽ ... കുറ്റങ്ങളാണ് ചുമത്തുന്നത്
  rationale: κατηγορέω എന്നതിന്റെ നിയമപരമായ ‘കുറ്റം ചുമത്തുക/ആരോപിക്കുക’ എന്ന അർഥവും വർത്തമാനകാലത്തിലെ തുടരുന്ന പ്രവൃത്തിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നിയമസന്ദർഭം വ്യക്തമാക്കാൻ ‘കുറ്റങ്ങൾ ചുമത്തുന്നു’ ഉപയോഗിച്ചു; മൂലത്തിലെ കൂടുതൽ അക്ഷരാർഥപരമായ ‘എത്ര കാര്യങ്ങൾ’ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
