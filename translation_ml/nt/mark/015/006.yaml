source:
  edition: SBLGNT
  text: Κατὰ δὲ ἑορτὴν ἀπέλυεν αὐτοῖς ἕνα δέσμιον ⸂ὃν παρῃτοῦντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: ml
  text: പെരുന്നാൾതോറും അവർ ആവശ്യപ്പെടുന്ന ഒരു തടവുകാരനെ അവർക്കുവേണ്ടി അവൻ വിട്ടയയ്ക്കാറുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: പെരുന്നാൾതോറും
  rationale: κατά സഹിതമുള്ള കാലസൂചനയും തുടർന്നുള്ള അപൂർണ്ണകാല ക്രിയയുടെ പതിവാർഥവും ചേർന്ന് ഓരോ പെരുന്നാളിലും നടന്നിരുന്ന ആചാരത്തെ സൂചിപ്പിക്കുന്നു. ദുർബലമായ δέ മലയാളത്തിൽ വേറൊരു ബന്ധകപദം ചേർക്കാതെ സ്വാഭാവികമായി കൈകാര്യം ചെയ്തു.
- source_word: ἀπέλυεν
  choice: വിട്ടയയ്ക്കാറുണ്ടായിരുന്നു
  rationale: അപൂർണ്ണകാല ക്രിയ ഇവിടെ കഴിഞ്ഞകാലത്തെ പതിവ് പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളരൂപം ആ ആവർത്തനസ്വഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കുവേണ്ടി
  rationale: ദാതിവ് ഇവിടെ ജനങ്ങൾക്ക് പ്രയോജനമായി നടത്തിയ മോചനത്തെ സൂചിപ്പിക്കുന്നു; 'അവർക്കുവേണ്ടി' അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἕνα δέσμιον
  choice: ഒരു തടവുകാരനെ
  rationale: ἕνα എന്ന സംഖ്യാബോധം 'ഒരു'യിൽ നിലനിർത്തി; നീതിന്യായസന്ദർഭത്തിൽ δέσμιος എന്നതിന് 'തടവുകാരൻ' സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ὃν παρῃτοῦντο
  choice: അവർ ആവശ്യപ്പെടുന്ന
  rationale: παραιτέομαι ഇവിടെ ആരെയെങ്കിലും വിട്ടുകിട്ടാൻ ആവശ്യപ്പെടുക എന്ന അർഥത്തിലാണ്. പ്രധാനക്രിയയിലെ പതിവാർഥവുമായി പൊരുത്തപ്പെടുന്ന ബന്ധവാക്യരൂപമാണിത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണം. വാക്യത്തിലെ പതിവ് പ്രവർത്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനായി 'പെരുന്നാൾതോറും' എന്നും 'വിട്ടയയ്ക്കാറുണ്ടായിരുന്നു' എന്നും ഉപയോഗിച്ചു; മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർത്തിട്ടില്ല.
