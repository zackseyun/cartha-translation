id: MRK.15.39
reference: Mark 15:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: ml
  text: യേശുവിന്റെ എതിർവശത്ത് നിന്നിരുന്ന ശതാധിപൻ, യേശു ഇങ്ങനെ അന്ത്യശ്വാസം വിട്ടത് കണ്ടപ്പോൾ, “സത്യമായും ഈ മനുഷ്യൻ ദൈവപുത്രനായിരുന്നു[a]” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സത്യമായും ഈ മനുഷ്യൻ ദൈവത്തിന്റെ ഒരു പുത്രനായിരുന്നു.” ഗ്രീക്ക് പ്രയോഗത്തിന് ഗുണപരമായോ അനിശ്ചിതമായോ അർഥമുണ്ടാകാം; എന്നാൽ മർക്കോസിന്റെ ആഖ്യാനസന്ദർഭത്തിൽ അത് “ദൈവപുത്രൻ” എന്ന ശീർഷകത്തിന്റെ ശക്തി വഹിക്കുന്നതായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: കണ്ടപ്പോൾ
  rationale: ἰδών എന്ന ഭൂതകാല കൃദന്തത്തിന്റെ കാലസൂചകബന്ധം സ്വാഭാവികമായി നൽകുന്നു; δέയുടെ നേരിയ ബന്ധകശക്തി മലയാളവാക്യഘടനയിൽ പ്രത്യേകം പദമില്ലാതെയും വ്യക്തമാകുന്നു.
- source_word: κεντυρίων
  choice: ശതാധിപൻ
  rationale: റോമൻ സൈന്യത്തിലെ ഈ പദവിക്ക് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ തുല്യപദം.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: അവന് അഭിമുഖമായി നിന്നിരുന്ന
  rationale: παρεστηκώς സൂചിപ്പിക്കുന്ന നിലവിലുള്ള നിൽപ്പും ἐξ ἐναντίας സൂചിപ്പിക്കുന്ന നേർക്കുനേർ സ്ഥാനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: അവൻ ഇങ്ങനെ അന്ത്യശ്വാസം വലിച്ചതു
  rationale: ἐξέπνευσεν എന്നതിലെ ശ്വാസം വിടുന്നതിന്റെയും മരിക്കുന്നതിന്റെയും സജീവചിത്രം ‘അന്ത്യശ്വാസം വലിച്ചു’ എന്ന പ്രയോഗം നൽകുന്നു; οὕτως ‘ഇങ്ങനെ’ എന്നു വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ἀληθῶς
  choice: സത്യമായും
  rationale: ഉറപ്പോടെയും ഗൗരവത്തോടെയും നടത്തുന്ന പ്രഖ്യാപനത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ഈ മനുഷ്യൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ മനുഷ്യപരാമർശം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: υἱὸς θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: വാക്യസന്ദർഭത്തിൽ ഗുണപരമോ നിർദിഷ്ടമോ ആയ അർഥം വഹിക്കാവുന്ന അനാർത്രസ് പദബന്ധത്തെ മലയാളത്തിലെ സ്വാഭാവിക ക്രിസ്തുശീർഷകമായി നൽകുന്നു; ‘ഒരു ദൈവപുത്രൻ’ എന്ന അനിർദിഷ്ട സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἦν
  choice: ആയിരുന്നു
  rationale: εἰμίയുടെ അപൂർണഭൂതകാലരൂപത്തെ അതിന്റെ ഭൂതകാല മൂല്യത്തോടെ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: υἱὸς θεοῦ എന്ന പ്രയോഗത്തിന്റെ നിർദിഷ്ട/ഗുണപര/അനിർദിഷ്ട ശക്തി
  choice: ദൈവപുത്രൻ
  alternative: ഒരു ദൈവപുത്രൻ
  rationale: മർക്കോസിന്റെ ആഖ്യാനത്തിൽ ‘ദൈവപുത്രൻ’ പ്രധാന ക്രിസ്തുശീർഷകമായി പ്രവർത്തിക്കുന്നു. എന്നാൽ ഗ്രീക്കിൽ പദത്തിന് നിർദിഷ്ട ഉപപദമില്ലാത്തതിനാൽ അനിർദിഷ്ട വായന വ്യാകരണപരമായി അസാധ്യമല്ല; അതിനാൽ ആ യഥാർഥ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ശതാധിപൻ’ എന്ന പരിചിത ബൈബിൾപദം നിലനിർത്തി; അപരിചിതരായ വായനക്കാർക്കും സന്ദർഭത്തിൽ ഇത് ഒരു സൈനികപദവിയാണെന്ന് ഗ്രഹിക്കാം. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പ് υἱὸς θεοῦ എന്നതിലെ യഥാർഥ വ്യാഖ്യാനതുറപ്പ് സംരക്ഷിക്കുന്നു.
