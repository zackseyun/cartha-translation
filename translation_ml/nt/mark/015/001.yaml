id: MRK.15.1
reference: Mark 15:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: ml
  text: ഉടനെ, അതിരാവിലെ, മുഖ്യപുരോഹിതന്മാരും മൂപ്പന്മാരും ശാസ്ത്രിമാരും മുഴുവൻ ഭരണസമിതിയും[a] കൂടിയാലോചന നടത്തി. പിന്നെ അവർ യേശുവിനെ കെട്ടി കൊണ്ടുപോയി പീലാത്തോസിന് ഏൽപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുഴുവൻ സൻഹെദ്രിൻ.’ ഗ്രീക്കിലെ συνέδριον യഹൂദരുടെ ഭരണസമിതിയെ സൂചിപ്പിക്കുന്നു.
    reason: ചരിത്രപരമായ സ്ഥാപനനാമത്തിന്റെ മറ്റൊരു പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: εὐθὺς
  choice: -ത്തന്നെ
  rationale: പ്രവർത്തനം വൈകാതെ നടന്നുവെന്ന മർക്കോസിന്റെ ആഖ്യാനവേഗം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കാൻ സമയപദത്തോടു ചേർത്തു.
- source_word: πρωῒ
  choice: അതിരാവിലെ
  rationale: ദിവസത്തിന്റെ ആദ്യസമയമെന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: συμβούλιον ποιήσαντες
  choice: കൂടിയാലോചന നടത്തി
  rationale: വെറും പദ്ധതി തയ്യാറാക്കൽ എന്നതിലുപരി ഔപചാരികമായ ആലോചന നടന്നുവെന്ന ആശയം പകർന്നുനൽകുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: അധികാരസ്ഥാനത്തുള്ള പ്രമുഖ പുരോഹിതന്മാരെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന് അനുയോജ്യം; ഒന്നിലധികം മഹാപുരോഹിതന്മാർ ഔദ്യോഗിക സ്ഥാനത്തുണ്ടായിരുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: πρεσβυτέρων
  choice: മൂപ്പന്മാർ
  rationale: ഈ ഭരണസന്ദർഭത്തിൽ അംഗീകൃത സമുദായനേതാക്കളെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ പദം.
- source_word: γραμματέων
  choice: ശാസ്ത്രിമാർ
  rationale: യഹൂദധർമ്മശാസ്ത്രത്തിൽ പ്രാവീണ്യമുള്ള ഔദ്യോഗിക പണ്ഡിതരെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാളപ്രയോഗം.
- source_word: ὅλον τὸ συνέδριον
  choice: ന്യായാധിപസഭ മുഴുവനും
  rationale: യഹൂദരുടെ ഭരണ-ന്യായ സമിതിയെന്ന സ്ഥാപനാർഥം വായനക്കാരന് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; ചരിത്രനാമമായ ‘സൻഹെദ്രിൻ’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δήσαντες
  choice: ബന്ധിച്ചു
  rationale: യേശുവിനെ കെട്ടിയശേഷമാണ് കൊണ്ടുപോയതെന്ന ക്രിയാക്രമം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπήνεγκαν
  choice: കൊണ്ടുപോയി
  rationale: കാവലിൽ ഒരു സ്ഥലത്തുനിന്ന് മാറ്റിക്കൊണ്ടുപോയെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ചുമന്നുകൊണ്ടുപോയി എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: παρέδωκαν
  choice: ഏൽപ്പിച്ചു
  rationale: യേശുവിനെ റോമൻ അധികാരിയുടെ കസ്റ്റഡിയിലേക്കു കൈമാറിയ ഔപചാരിക പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: Πιλάτῳ
  choice: പീലാത്തോസിന്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം, ദാതൃവിഭക്തിയോടെ.
theological_decisions:
- issue: συνέδριον എന്ന സ്ഥാപനപദത്തിന്റെ സൂചന
  choice: പ്രധാനവാചകത്തിൽ ‘ന്യായാധിപസഭ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘സൻഹെദ്രിൻ’ എന്നു ലിപ്യന്തരണം ചെയ്യുക.
  rationale: ഇത് പ്രധാനമായും ചരിത്രപരമായ ഭരണ-ന്യായസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്നു. അർഥം ഉടൻ മനസ്സിലാകുന്ന വിവർത്തനം പ്രധാനവാചകത്തിൽ നൽകി, കൂടുതൽ നിർദിഷ്ടമായ ചരിത്രനാമം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: പീഡാനുഭവവിവരണത്തിലെ παρέδωκαν എന്ന ക്രിയയുടെ ശക്തി
  choice: ന്യായപരവും കസ്റ്റഡിയുമായി ബന്ധപ്പെട്ട കൈമാറ്റം സൂചിപ്പിക്കാൻ ‘ഏൽപ്പിച്ചു’ എന്നു നൽകി.
  alternative: ‘ഒറ്റിക്കൊടുത്തു’ അല്ലെങ്കിൽ ‘കൈമാറി’.
  rationale: ഈ വാക്യത്തിൽ റോമൻ അധികാരിയായ പീലാത്തോസിന് യേശുവിനെ ഏൽപ്പിക്കുന്നതാണ് നേരിട്ടുള്ള ആശയം. ‘ഒറ്റിക്കൊടുത്തു’ എന്നു നൽകിയാൽ ഇവിടെ ആവശ്യപ്പെടാത്ത ദ്രോഹവ്യാഖ്യാനം മുൻകൂട്ടി ചേർക്കപ്പെടാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതിരാവിലെത്തന്നെ’ എന്ന പ്രയോഗം εὐθὺς, πρωῒ എന്നീ രണ്ടിന്റെയും സമയ-ത്വരാഭാവം ഒരുമിച്ച് നിലനിർത്തുന്നു. ഗ്രീക്കിലെ പങ്കാളിക്രിയകളുടെ നീണ്ട ഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; സംഭവക്രമം മാറ്റിയിട്ടില്ല. ഇംഗ്ലീഷ് consultation layer-ൽ [a] അടയാളം ‘immediately’ എന്നതിനു പിന്നാലെ വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് συνέδριον-നെക്കുറിച്ചായതിനാൽ ഉറവിടബന്ധം അനുസരിച്ച് അടയാളം ‘ന്യായാധിപസഭ’യ്ക്കു പിന്നാലെ സ്ഥാപിച്ചു.
