translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. നീണ്ട ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിലെ രണ്ട് സ്വാഭാവിക വാക്യങ്ങളാക്കി; പ്രവർത്തകനെ വ്യക്തമാക്കാൻ സന്ദർഭത്തിൽനിന്ന് ‘യേശുവിനെ’ ചേർത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
