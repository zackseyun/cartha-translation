id: MRK.15.46
reference: Mark 15:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: ml
  text: അവൻ ഒരു ലിനൻ തുണി[a] വാങ്ങിയശേഷം യേശുവിനെ താഴെയിറക്കി, ആ തുണിയിൽ പൊതിഞ്ഞ്, പാറയിൽനിന്ന് വെട്ടിയുണ്ടാക്കിയ ഒരു കല്ലറയിൽ കിടത്തി[b]. പിന്നെ കല്ലറയുടെ പ്രവേശനകവാടത്തിനു നേരെ[c] ഒരു കല്ല് ഉരുട്ടിവെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലിനൻ വിരി’ അല്ലെങ്കിൽ ‘ശവക്കച്ച’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി, ‘പാറയിൽനിന്ന് വെട്ടിയെടുത്ത കല്ലറ’ എന്നും പറയാറുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: ‘കല്ലറയുടെ വാതിലിനു നേരെ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദത്തിന് ‘വാതിൽ’ എന്നും ‘പ്രവേശനം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: ചണവസ്ത്രം / ആ വസ്ത്രം
  rationale: σινδών എന്നത് ചണനാരുകൊണ്ടുള്ള തുണിയെയോ വസ്ത്രത്തെയോ സൂചിപ്പിക്കുന്നു; സംസ്കാരസന്ദർഭത്തിൽ പൊതിയാൻ ഉപയോഗിച്ച വസ്ത്രമാണെങ്കിലും ‘ശവക്കച്ച’ എന്നു വിവർത്തനം ചെയ്താൽ മൂലത്തിൽ വ്യക്തമാക്കാത്ത പ്രത്യേക ഉപയോഗം അമിതമായി നിർണ്ണയിക്കപ്പെടും.
- source_word: καθελών
  choice: താഴെയിറക്കി
  rationale: ക്രൂശിൽനിന്ന് യേശുവിന്റെ ശരീരം ഇറക്കിയ പ്രവൃത്തിയാണ് സന്ദർഭം വ്യക്തമാക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: ἐνείλησεν
  choice: പൊതിഞ്ഞ്
  rationale: ചുറ്റിപ്പൊതിയുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; കെട്ടിയെന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: ἔθηκεν
  choice: കിടത്തി
  rationale: ശരീരം കല്ലറയിൽ വെച്ചതിനെ മലയാളത്തിൽ മാന്യവും സന്ദർഭോചിതവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: μνημείῳ / μνημείου
  choice: കല്ലറ / കല്ലറയുടെ
  rationale: ഇവിടെ μνημεῖον പാറയിൽ വെട്ടിയുണ്ടാക്കിയ സംസ്കാരസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കല്ലറ’ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: λελατομημένον ἐκ πέτρας
  choice: പാറയിൽ വെട്ടിയുണ്ടാക്കിയ
  rationale: പാറയിൽനിന്ന് വെട്ടിയെടുത്ത് ഇതിനകം നിർമ്മിക്കപ്പെട്ട നിലയെ perfect passive participle സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: προσεκύλισεν
  choice: ഉരുട്ടിവെച്ചു
  rationale: കല്ല് ഉരുട്ടി കവാടത്തോട് ചേർത്ത് അടച്ചുവെച്ച പ്രവൃത്തി മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: കല്ലറയുടെ പ്രവേശനകവാടത്തോട്
  rationale: θύρα എന്നതിന് വാതിൽ എന്നും പ്രവേശനസ്ഥലം എന്നും അർഥമാകാം; പാറക്കല്ലറയുടെ സാഹചര്യത്തിൽ ‘പ്രവേശനകവാടം’ ആധുനിക വായനക്കാരന് ഉദ്ദേശ്യം വ്യക്തമായി നൽകുകയും മൂലത്തിലെ സാദ്ധ്യമായ അർഥപരിധി അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀγοράσας
  choice: വാങ്ങിയശേഷം
  rationale: പ്രധാന പ്രവൃത്തികൾക്കു മുമ്പായി വസ്ത്രം വാങ്ങിയെന്ന aorist participle-ന്റെ കാലക്രമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
