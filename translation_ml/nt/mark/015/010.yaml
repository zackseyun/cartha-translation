  text: ἐγίνωσκεν γὰρ ὅτι διὰ φθόνον παραδεδώκεισαν αὐτὸν οἱ ἀρχιερεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, മുഖ്യപുരോഹിതന്മാർ അസൂയ നിമിത്തം യേശുവിനെ ഏൽപ്പിച്ചുകൊടുത്തതാണെന്ന് പീലാത്തൊസിന് അറിയാമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈർഷ്യകൊണ്ട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: അറിഞ്ഞിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം പീലാത്തൊസിന്റെ നിലനിന്നിരുന്ന ബോധ്യത്തെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അറിഞ്ഞിരുന്നു’ എന്നു നൽകുന്നു.
- source_word: γὰρ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: γάρ മുൻവാക്യത്തിനുള്ള വിശദീകരണകാരണം അവതരിപ്പിക്കുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിലെ കാരണഘടനയായ ‘നിമിത്തമാണ് ... എന്ന്’ ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു; ‘എന്തെന്നാൽ’ ചേർത്താൽ സന്ദർഭമില്ലാതെ അസ്വാഭാവികമാകും.
- source_word: ὅτι
  choice: എന്ന്
  rationale: പീലാത്തൊസ് അറിഞ്ഞിരുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന അനുബന്ധഘടകമായി ‘എന്ന്’ സ്വാഭാവികമാണ്.
- source_word: διὰ φθόνον
  choice: അസൂയ നിമിത്തമാണ്
  rationale: accusative-നോടുകൂടിയ διά കാരണം സൂചിപ്പിക്കുന്നു; φθόνος ഇവിടെ മറ്റൊരാളോടുള്ള അസൂയയെ സൂചിപ്പിക്കുന്നു. ഊന്നൽഘടന മൂലകാരണത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: παραδεδώκεισαν
  choice: ഏൽപ്പിച്ചുകൊടുത്തത്
  rationale: പീലാത്തൊസിന്റെ അറിവിനു മുമ്പേ പൂർത്തിയായ കൈമാറ്റത്തെ സൂചിപ്പിക്കുന്ന pluperfect ആണ്. നിയമപരമായ സന്ദർഭത്തിലെ കൈമാറ്റം സംരക്ഷിക്കാനും ‘ഒറ്റിക്കൊടുത്തു’ എന്ന അധിക അർഥം ഒഴിവാക്കാനും ഈ പ്രയോഗം യോജിക്കുന്നു.
- source_word: αὐτὸν
  choice: യേശുവിനെ
  rationale: സർവനാമത്തിന്റെ സൂചിത വ്യക്തി യേശുവാണ്; ഒറ്റവാക്യമായും വ്യക്തത ലഭിക്കാൻ പേര് ഉപയോഗിക്കുന്നു.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഇത് ഏക മഹാപുരോഹിതനെയല്ല, പുരോഹിതനേതൃത്വത്തിലുള്ള പ്രമുഖ അധികാരികളെ സൂചിപ്പിക്കുന്ന ബഹുവചനമാണ്.
theological_decisions:
- issue: മുഖ്യപുരോഹിതന്മാരുടെ ഉദ്ദേശ്യം
  choice: യേശുവിനെ ഏൽപ്പിച്ചുകൊടുത്തതിന്റെ കാരണം അസൂയയാണെന്ന പീലാത്തൊസിന്റെ അറിവ് വാക്യം നേരിട്ട് പ്രസ്താവിക്കുന്നു.
  alternative: ‘അസൂയ’യ്ക്കു പകരം ‘ഈർഷ്യ’ എന്നു നൽകാം.
  rationale: φθόνος സൂചിപ്പിക്കുന്ന പ്രേരണയെ അധികമായി വ്യാഖ്യാനിക്കാതെയും ലഘൂകരിക്കാതെയും പ്രസ്താവിക്കുന്നു; ഇത് വാക്യത്തിലെ പീലാത്തൊസിന്റെ വിലയിരുത്തലായി തന്നെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മുഖ്യപുരോഹിതന്മാർ’ സഭാസന്ദർഭത്തിൽ പരിചിതവും ബഹുവചനത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്നതുമാണ്. ഗ്രീക്ക് പദക്രമം യാന്ത്രികമായി പകർത്താതെ കാരണം, പ്രവൃത്തി, അറിവ് എന്നീ ബന്ധങ്ങൾ വ്യക്തമായി ക്രമീകരിച്ചു.
