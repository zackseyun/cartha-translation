  to: എന്തെന്നാൽ, മുഖ്യപുരോഹിതന്മാർ അസൂയ നിമിത്തം യേശുവിനെ ഏൽപ്പിച്ചുകൊടുത്തതാണെന്ന് പീലാത്തൊസിന് അറിയാമായിരുന്നു.[a]
