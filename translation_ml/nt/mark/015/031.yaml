  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘മുഖ്യപുരോഹിതന്മാർ’, ‘ശാസ്ത്രിമാർ’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അപൂർണ ഭൂതകാലഭാവത്തിന് ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ഉപയോഗിച്ചു.
