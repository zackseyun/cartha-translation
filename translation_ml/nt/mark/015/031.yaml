  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: ml
  text: 'അതുപോലെതന്നെ മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരോടൊപ്പം അവനെ പരിഹസിച്ചുകൊണ്ട് തമ്മിൽ ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു[a]: “മറ്റുള്ളവരെ അവൻ രക്ഷിച്ചു; തന്നെത്തന്നെ രക്ഷിക്കാൻ അവനു കഴിയുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശാസ്ത്രിമാരോടൊപ്പം അവർ തമ്മിൽ പരിഹസിച്ചുകൊണ്ട് പറഞ്ഞു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദക്രമം പരസ്പരസംസാരത്തിനാണോ പരസ്പരപരിഹാസത്തിനാണോ കൂടുതൽ ഊന്നൽ നൽകുന്നതെന്ന് പൂർണമായി വ്യക്തമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിലെ പരിഹാസത്തോടുള്ള സമാന്തരബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഒരേ സമയത്ത് ഒന്നിലധികം മഹാപുരോഹിതന്മാർ ഉണ്ടായിരുന്നുവെന്ന് സൂചിപ്പിക്കാതെ, പ്രമുഖ പുരോഹിതാധികാരികളെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ പ്രയോഗം.
- source_word: ἐμπαίζοντες
  choice: അവനെ പരിഹസിച്ചുകൊണ്ട്
  rationale: ക്രിയയുടെ നിന്ദാപരമായ പരിഹാസഭാവം നൽകുന്നു; ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ യേശുവാണ് പരിഹാസത്തിന്റെ ലക്ഷ്യമെന്നത് മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി വ്യക്തമാക്കുന്നു.
- source_word: πρὸς ἀλλήλους
  choice: തമ്മിൽ
  rationale: അവർ പരസ്പരം സംസാരിച്ചുവെന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; പരസ്പരം ഒരാളെയൊരാൾ പരിഹസിച്ചു എന്ന തെറ്റായ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: μετὰ τῶν γραμματέων
  choice: ശാസ്ത്രിമാരോടൊപ്പം
  rationale: മുഖ്യപുരോഹിതന്മാരോടൊപ്പം ശാസ്ത്രിമാരും ഈ പരിഹാസത്തിൽ പങ്കുചേർന്നുവെന്ന അർഥം നൽകുന്നു.
- source_word: ἔλεγον
  choice: ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചയോ ആവർത്തനമോ സൂചിപ്പിക്കുന്ന ഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἄλλους
  choice: മറ്റുള്ളവരെ
  rationale: യേശു രക്ഷിച്ച അഥവാ വിടുവിച്ച മറ്റു വ്യക്തികളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പ്രയോഗം.
- source_word: ἔσωσεν ... σῶσαι
  choice: രക്ഷിച്ചു ... രക്ഷിക്കാൻ
  rationale: ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനവും പരിഹാസത്തിലെ ദൈവശാസ്ത്രപരമായ വിരോധാഭാസവും മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: ἑαυτὸν
  choice: തന്നെത്തന്നെ
  rationale: സ്വയം എന്ന പ്രത്യാവർത്തക ഊന്നൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐ δύναται
  choice: അവനു കഴിയുന്നില്ല
  rationale: കഴിവില്ലെന്ന പരിഹാസവാദം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: σῴζω എന്ന ക്രിയ രണ്ടു ഉപവാക്യങ്ങളിലും ഒരേവിധം പരിഭാഷപ്പെടുത്തൽ
  choice: രക്ഷിച്ചു ... രക്ഷിക്കാൻ
