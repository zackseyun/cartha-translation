  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘തലയോട്ടിയുടെ സ്ഥലം’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ Κρανίου Τόπος എന്ന ഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
