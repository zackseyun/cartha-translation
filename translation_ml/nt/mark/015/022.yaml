source:
  edition: SBLGNT
  text: καὶ φέρουσιν αὐτὸν ἐπὶ ⸀τὸν ⸀Γολγοθᾶν τόπον, ὅ ἐστιν ⸀μεθερμηνευόμενον Κρανίου Τόπος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: ml
  text: അവർ അവനെ ഗോൽഗോഥാ എന്ന സ്ഥലത്തേക്കു കൊണ്ടുവന്നു. അതിന്റെ പരിഭാഷ “തലയോട്ടിയുടെ സ്ഥലം” എന്നാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρουσιν
  choice: കൊണ്ടുവന്നു
  rationale: ചരിത്രവർത്തമാനകാലത്തെ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകുന്നു. ക്രിയ അവനെ എടുത്തുകൊണ്ടുപോയി എന്നോ നടത്തിക്കൊണ്ടുപോയി എന്നോ അനാവശ്യമായി നിർണയിക്കാതെ ലക്ഷ്യസ്ഥാനത്തെത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: ഗോൽഗോഥാ എന്ന സ്ഥലത്തേക്കു
  rationale: ἐπί + accusative സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനവും τόπος എന്ന ‘സ്ഥലം’ എന്ന പദവും നിലനിർത്തുന്നു. മലയാളത്തിൽ സ്ഥലനാമം സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘എന്ന’ ചേർത്തിരിക്കുന്നു; ഇത് പുതിയ അർത്ഥവിവരം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: Γολγοθᾶν
  choice: ഗോൽഗോഥാ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: μεθερμηνευόμενον
  choice: അതിന്റെ പരിഭാഷ … എന്നാണ്
  rationale: മറ്റൊരു ഭാഷയിലെ പദപ്രയോഗമായി മാറ്റിനൽകുന്ന പങ്കിനെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: Κρανίου Τόπος
  choice: തലയോട്ടിയുടെ സ്ഥലം
  rationale: κρανίον എന്നതിന്റെ ‘തലയോട്ടി’ എന്ന അർത്ഥവും genitive ബന്ധവും നിലനിർത്തുന്നു. മലയാളത്തിലെ -യുടെ രൂപം ഇംഗ്ലീഷിലെ article വ്യത്യാസം നിർബന്ധമായി അടിച്ചേൽപ്പിക്കാതെ സ്വാഭാവികമായി പ്രയോഗിക്കാം.
