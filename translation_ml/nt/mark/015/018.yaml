  text: καὶ ἤρξαντο ἀσπάζεσθαι αὐτόν· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/018.yaml
  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: ml
  text: 'അവർ അവനെ അഭിവാദ്യം ചെയ്യാൻ തുടങ്ങി[a]: “യഹൂദന്മാരുടെ രാജാവേ[b], ജയ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വന്ദനം ചെയ്യാൻ തുടങ്ങി.” ഗ്രീക്ക് ക്രിയയ്ക്ക് സാധാരണ അഭിവാദ്യം ചെയ്യുക എന്നർഥമുണ്ടാകാം; ഇവിടെ അത് പരിഹാസപൂർവമായ ഔപചാരിക അഭിവാദനമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യെഹൂദ്യരുടെ രാജാവേ.” ഗ്രീക്ക് പദം യഹൂദന്മാരെയോ യെഹൂദ്യരെയോ സൂചിപ്പിക്കാം; പീഡാനുഭവവിവരണത്തിലെ ഈ രാജകീയ ശീർഷകത്തിന്റെ പതിവായ അർഥം കണക്കിലെടുത്ത് “യഹൂദന്മാർ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അവർ… ചെയ്തുതുടങ്ങി എന്ന വാക്യബന്ധം
  rationale: മർക്കോസിന്റെ ലളിതമായ തുടർച്ച നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യാരംഭത്തിനായി καὶ വേറിട്ട് ‘പിന്നെ’ എന്നു വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: ἤρξαντο
  choice: ചെയ്തുതുടങ്ങി
  rationale: ഇൻഫിനിറ്റീവിനോടൊപ്പമുള്ള ἄρχομαιയുടെ ആരംഭാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀσπάζεσθαι
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: സാധാരണ അഭിവാദനവും ഈ സന്ദർഭത്തിലെ ഔപചാരികമായ പരിഹാസവന്ദനവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന പദം; ‘വന്ദിക്കുക’ എന്നതിനെക്കാൾ ഇവിടെ സൈനികരുടെ പ്രകടനപരമായ അഭിവാദ്യം നന്നായി സൂചിപ്പിക്കുന്നു.
- source_word: Χαῖρε
  choice: ജയജയ
  rationale: ഇവിടെ അക്ഷരാർഥമായ ‘സന്തോഷിക്കുക’ എന്നതല്ല, രാജാവിനോടുള്ള ഔപചാരിക അഭിവാദനത്തെ പരിഹാസമായി അനുകരിക്കുന്ന വിളിയാണ്. ‘ജയജയ’ ആ സ്വരവും പരിഹാസപരമായ രാജകീയ ഭാവവും ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: യഹൂദന്മാരുടെ രാജാവേ
  rationale: βασιλεῦ എന്ന സംബോധനരൂപവും പീഡാനുഭവവിവരണത്തിൽ പതിവായ ‘King of the Jews’ എന്ന അർഥവും നേരിട്ട് നൽകുന്നു; Ἰουδαίων എന്നതിന് ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള പരിഹാസപരമായ രാജകീയ അഭിവാദനത്തിന്റെ സ്വരവും രാജത്വസൂചനയും
  choice: “യഹൂദന്മാരുടെ രാജാവേ, ജയജയ!” എന്ന പരിഹാസരാജകീയ വിളി
  alternative: “യഹൂദന്മാരുടെ രാജാവേ, വന്ദനം!”
  rationale: പടയാളികൾ യേശുവിന്റെ രാജത്വത്തെ പരിഹസിച്ച് രാജകീയ അഭിവാദനം അനുകരിക്കുന്നതാണ് സന്ദർഭം. ‘ജയജയ’ ഔപചാരികതയും പരിഹാസവും നിലനിർത്തുന്നു; അതേസമയം പാഠത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മർക്കോസിന്റെ ചുരുങ്ങിയ ആഖ്യാനഗതിയും സൈനികരുടെ പരിഹാസസ്വരവും നിലനിർത്തി. ‘ജയജയ’ അല്പം ഔപചാരികമായ രാജകീയ വിളിയായതിനാൽ ഈ പ്രത്യേക സന്ദർഭത്തിന് യോജിക്കുന്നു.
