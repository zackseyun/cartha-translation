  text: And the chief priests were accusing him of many things[a].
translation:
  language: ml
  text: പ്രധാനപുരോഹിതന്മാർ അവന്റെമേൽ പല ആരോപണങ്ങൾ ഉന്നയിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘അവനെ പല കാര്യങ്ങളിൽ കുറ്റപ്പെടുത്തിക്കൊണ്ടിരുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തില്ല
  rationale: മുൻവാക്യത്തോടുള്ള ലളിതമായ ആഖ്യാനബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ ‘എന്നിട്ട്’ പോലൊരു പദം ചേർക്കുന്നത് അനാവശ്യമാണ്.
- source_word: κατηγόρουν
  choice: കുറ്റങ്ങളും ആരോപിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ കുറ്റാരോപണം ‘ആരോപിച്ചുകൊണ്ടിരുന്നു’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: αὐτοῦ
  choice: അവന്റെമേൽ
  rationale: κατηγορέω എന്ന ക്രിയയോടുകൂടിയ ജനിറ്റീവ് കുറ്റാരോപണം ആരെതിരെയാണെന്ന് സൂചിപ്പിക്കുന്നു; ‘അവന്റെമേൽ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: οἱ ἀρχιερεῖς
  choice: പ്രധാനപുരോഹിതന്മാർ
  rationale: ഇത് ഒരേസമയം പല മഹാപുരോഹിതന്മാരെ സൂചിപ്പിക്കുന്നതല്ല, യെഹൂദ പുരോഹിതനേതൃത്വത്തിലെ പ്രമുഖ അധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πολλά
  choice: പല കുറ്റങ്ങളും
  rationale: പല കാര്യങ്ങളെക്കുറിച്ചുള്ള കുറ്റാരോപണങ്ങളെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പ്രത്യേക നിയമപരമായ കുറ്റപത്രങ്ങളെന്ന് അമിതമായി നിർവചിക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാസ്വഭാവം വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
