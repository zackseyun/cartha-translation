    issue: The response element in ἀποκριθεὶς is omitted.
    rationale: ‘ചോദിച്ചു’ conveys that Pilate asks a question but not that he is responding to the crowd’s preceding statement. Adding ‘മറുപടിയായി’ preserves this discourse feature without wooden repetition.
