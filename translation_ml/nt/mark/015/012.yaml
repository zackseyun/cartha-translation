id: MRK.15.12
reference: Mark 15:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: ml
  text: 'പീലാത്തൊസ് വീണ്ടും അവരോടു മറുപടിയായി ചോദിച്ചു: “അങ്ങനെയെങ്കിൽ, നിങ്ങൾ യെഹൂദന്മാരുടെ രാജാവ് എന്നു വിളിക്കുന്നവനെ ഞാൻ എന്തു ചെയ്യണമെന്ന് നിങ്ങൾ ആഗ്രഹിക്കുന്നു?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: നടന്നുകൊണ്ടിരിക്കുന്ന സംഭാഷണത്തിൽ പീലാത്തൊസ് ആവർത്തിച്ചു സംസാരിക്കുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: ചോദിച്ചു
  rationale: ഇത് മറുപടിയായുള്ള തുടർചോദ്യമായതിനാൽ, ഗ്രീക്കിലെ വിവരണശൈലിയെ പദാനുപദമായി അനുകരിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നേരിട്ടുള്ള ചോദ്യത്തെ അവതരിപ്പിക്കുന്നു.
- source_word: Τί οὖν
  choice: അങ്ങനെയെങ്കിൽ ... എന്ത്
  rationale: οὖν മുൻപത്തെ ജനക്കൂട്ടത്തിന്റെ ആവശ്യത്തിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെയെങ്കിൽ’ ആ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: θέλετε
  choice: നിങ്ങൾ ആഗ്രഹിക്കുന്നത്
  rationale: ഈ സന്ദർഭത്തിൽ ജനക്കൂട്ടം എന്ത് നടപടി വേണമെന്ന് അഭിലഷിക്കുന്നു എന്ന അർഥമാണ്.
- source_word: ποιήσω
  choice: ഞാൻ എന്തു ചെയ്യണമെന്നാണ്
  rationale: θέλετε-യോടു ചേർന്ന aorist subjunctive-നെ മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷ ആഗ്രഹഘടനയായി നൽകുന്നു.
- source_word: ὃν λέγετε
  choice: നിങ്ങൾ ... എന്നു വിളിക്കുന്നവനെ
  rationale: യേശുവിനെക്കുറിച്ചുള്ള വിശേഷണം ജനക്കൂട്ടത്തിന്റേതാണെന്ന ഗ്രീക്ക് relative clause-ന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ രാജാവ്
  rationale: പീഡാനുഭവവിവരണത്തിലെ രാഷ്ട്രീയ-വിവരണാത്മക പദവി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പീലാത്തൊസിന്റെ വാക്കുകൾ യേശുവിന്റെ രാജത്വത്തെ അംഗീകരിക്കുന്നതായോ ജനക്കൂട്ടത്തിന്റെ വിശേഷണത്തെ ഉദ്ധരിക്കുന്നതായോ അവതരിപ്പിക്കണമോ
  choice: “നിങ്ങൾ യെഹൂദന്മാരുടെ രാജാവ് എന്നു വിളിക്കുന്നവനെ” എന്ന് നൽകി, ആ പദവി ജനക്കൂട്ടത്തിന്റെ പ്രയോഗമാണെന്ന അകലം നിലനിർത്തി.
  alternative: “യെഹൂദന്മാരുടെ രാജാവെന്നു നിങ്ങൾ പറയുന്ന അവനെ”
  rationale: ὃν λέγετε എന്നത് ‘നിങ്ങൾ’ പറയുന്നതിന് ഊന്നൽ നൽകുന്നു. അതിനാൽ പീലാത്തൊസിന്റെ വ്യക്തിപരമായ സമ്മതമോ നിഷേധമോ വിവർത്തനം ചേർത്തു നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മറുപടി പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ പോലുള്ള കൃത്രിമ പദാനുപദഘടന ഒഴിവാക്കി, സന്ദർഭത്തിന് യോജിച്ച ‘ചോദിച്ചു’ ഉപയോഗിച്ചു.
