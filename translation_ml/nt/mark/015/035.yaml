source:
  edition: SBLGNT
  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: ml
  text: അവിടെ നിന്നിരുന്നവരിൽ ചിലർ അതു കേട്ടപ്പോൾ, “നോക്കൂ, അവൻ ഏലിയാവിനെ വിളിക്കുന്നു.”[a] എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നോക്കൂ, അവൻ ഏലിയാവിനെ സഹായത്തിനായി വിളിക്കുന്നു.”
    reason: φωνεῖ എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ഒരാളെ സഹായത്തിനായി വിളിക്കുക എന്ന അർഥസൂചന ഉണ്ടാകാം; എന്നാൽ അത് മുഖ്യപാഠത്തേക്കാൾ വ്യാഖ്യാനപരമാണ്.
lexical_decisions:
- source_word: καί
  choice: അവിടെ നിന്നിരുന്നവരിൽ
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ വാക്യാരംഭത്തിലെ καί പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: τινες τῶν παρεστηκότων
  choice: അവിടെ നിന്നിരുന്നവരിൽ ചിലർ
  rationale: സംഭവസ്ഥലത്ത് സമീപം നിന്നിരുന്നവരിലെ നിർദിഷ്ടമല്ലാത്ത ഒരു വിഭാഗത്തെ സ്വാഭാവികവും ദൃശ്യവുമായ രീതിയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀκούσαντες
  choice: അതു കേട്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തിയെ കാലബന്ധത്തോടെ വ്യക്തമാക്കുന്നു; ‘അതു’ മുൻവാക്യത്തിലെ യേശുവിന്റെ നിലവിളിയെ സന്ദർഭത്തിൽനിന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചയോ ആവർത്തനമോ സൂചിപ്പിക്കുന്ന ഭാവം അമിതമായി നിർവചിക്കാതെ നിലനിർത്തുന്നു.
- source_word: Ἴδε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞാരൂപത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക തത്തുല്യം.
- source_word: Ἠλίαν
  choice: ഏലിയാവിനെ
  rationale: പ്രവാചകന്റെ പേരിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപം; പ്രത്യക്ഷ കർമവിഭക്തി നിലനിർത്തുന്നു.
- source_word: φωνεῖ
  choice: വിളിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള പ്രസ്താവനയെ സ്വാഭാവികമായി നൽകുന്നു; ‘സഹായത്തിനായി വിളിക്കുന്നു’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: കണ്ടുനിന്നവർ യേശുവിന്റെ നിലവിളിയെ ഏലിയാവിനോടുള്ള അപേക്ഷയായി തെറ്റിദ്ധരിച്ചതിനെ തുറന്നുപറയണമോ
  choice: “അവൻ ഏലിയാവിനെ വിളിക്കുന്നു” എന്ന ഉപരിതല പ്രസ്താവന നിലനിർത്തുക
  alternative: “അവൻ ഏലിയാവിനെ വിളിച്ചപേക്ഷിക്കുന്നു” അഥവാ “ഏലിയാവിനെ സഹായത്തിനായി വിളിക്കുന്നു”
  rationale: ഗ്രീക്ക് വാചകം കണ്ടുനിന്നവരുടെ വാക്കുകളാണ് രേഖപ്പെടുത്തുന്നത്; അവരുടെ തെറ്റിദ്ധാരണയെ ആഖ്യാതാവ് പ്രത്യേകം വിശദീകരിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനവികാസം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; അപൂർണ്ണ ഭൂതകാലത്തിന്റെ ഭാവം ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
