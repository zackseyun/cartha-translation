  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: ml
  text: ദേവാലയത്തിലെ തിരശ്ശീല[a][b] മുകളിൽനിന്ന് താഴെവരെ രണ്ടായി കീറിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദേവാലയത്തിലെ മറശ്ശീല.’
    reason: lexical_alternative
  - marker: b
    text: ‘ദേവാലയം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം കൂടുതൽ പ്രത്യേകമായി ദേവാലയത്തിന്റെ ഉള്ളിലെ വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അപ്പോൾ
  rationale: മുൻവിവരണത്തോടു സംഭവത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്ന ആഖ്യാനപ്രയോഗം; ഗ്രീക്കിലെ ലളിതമായ ബന്ധകത്തിന്റെ പ്രവാഹം നിലനിർത്തുന്നു.
- source_word: καταπέτασμα
  choice: തിരശ്ശീല
  rationale: ദേവാലയത്തിനുള്ളിലെ തൂക്കിയ മറയെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദം.
- source_word: ναοῦ
  choice: ദേവാലയത്തിലെ
  rationale: ναός ഇവിടെ വിശാലമായ ദേവാലയപരിസരത്തേക്കാൾ പ്രത്യേകമായി വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കാമെങ്കിലും, മുഖ്യവാക്യത്തിൽ പരിചിതവും വായനാസൗകര്യമുള്ളതുമായ ‘ദേവാലയം’ നിലനിർത്തി ആ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: ἐσχίσθη
  choice: കീറിപ്പോയി
  rationale: തിരശ്ശീല കീറലിന് വിധേയമായി എന്ന ഗ്രീക്ക് കർമണിപ്രയോഗത്തിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പ്രവർത്തകനെ വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: εἰς δύο
  choice: രണ്ടായി
  rationale: രണ്ടു ഭാഗങ്ങളായി വിഭജിക്കപ്പെട്ടുവെന്ന അർത്ഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: മുകളിൽനിന്ന് താഴെവരെ
  rationale: കീറലിന്റെ ദിശയും മുഴുവൻ വ്യാപ്തിയും ഗ്രീക്കിലുള്ളതുപോലെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദേവാലയത്തിലെ തിരശ്ശീല കീറിയതിന്റെ വ്യാഖ്യാനപരമായ പ്രാധാന്യം
  choice: സംഭവം മാത്രം വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി; അതിന്റെ പ്രതീകാത്മക അർത്ഥം മുഖ്യവാക്യത്തിൽ വിശദീകരിച്ചില്ല.
  alternative: ഇത് ദൈവസന്നിധിയിലേക്കുള്ള പ്രവേശനത്തെയോ ദേവാലയക്രമത്തിന്മേലുള്ള ന്യായവിധിയെയോ സൂചിപ്പിക്കുന്നു എന്നു പരിഭാഷയിൽ വ്യക്തമാക്കുക.
  rationale: വാക്യം സംഭവം രേഖപ്പെടുത്തുന്നുവെങ്കിലും അതിന്റെ ദൈവശാസ്ത്രപരമായ അർത്ഥം തുറന്നു പറയുന്നില്ല; അതിനാൽ യഥാർത്ഥ വ്യാഖ്യാനസാധ്യതകളും സംഘർഷവും പരിഭാഷയിൽ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കീറിപ്പോയി’ എന്ന പ്രയോഗം പ്രവർത്തകനെ നിർണ്ണയിക്കാതെ ഗ്രീക്ക് കർമണിയുടെ സ്വാഭാവിക മലയാളരൂപം നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടുണ്ട്.
