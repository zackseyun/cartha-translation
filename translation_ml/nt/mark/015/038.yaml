  terminology: «തിരശ്ശീല» suitably represents καταπέτασμα, with «മറശ്ശീല» offered as a lexical alternative. «ദേവാലയം» is natural for ναός, and the note appropriately preserves the possible narrower sense of the inner sanctuary without imposing an interpretation.
