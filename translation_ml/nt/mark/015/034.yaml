source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: ml
  text: 'ഒമ്പതാം മണിക്കൂറിൽ യേശു ഉച്ചത്തിൽ നിലവിളിച്ചു: “എലോയി, എലോയി, ലെമാ സബഖ്താനി?”[a] എന്നു പരിഭാഷപ്പെടുത്തിയാൽ, “എന്റെ ദൈവമേ, എന്റെ ദൈവമേ, എന്തിനാണ് നീ എന്നെ ഉപേക്ഷിച്ചത്?”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിലും പല പരിഭാഷാപാരമ്പര്യങ്ങളിലും ‘ലെമാ’ എന്നതിനു പകരം ‘ലാമാ’ എന്ന രൂപം കാണുന്നു.
    reason: textual_variant
  - marker: b
    text: യേശുവിന്റെ ഈ വാക്കുകൾ സങ്കീർത്തനം 22:1-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: 'അല്ലെങ്കിൽ: “എന്തുകൊണ്ടാണ് നീ എന്നെ ഉപേക്ഷിച്ചത്?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: ഒമ്പതാം മണിക്കൂറിൽ
  rationale: മർക്കോസ് ഉപയോഗിക്കുന്ന പുരാതന സമയപ്രയോഗം വ്യാഖ്യാനിച്ച് ‘ഉച്ചകഴിഞ്ഞ് മൂന്നുമണിക്ക്’ എന്നു മാറ്റാതെ ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: ἐβόησεν ... φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ നിലവിളിച്ചു
  rationale: ക്രിയയുടെയും അതിനെ ശക്തിപ്പെടുത്തുന്ന പ്രയോഗത്തിന്റെയും അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: എലോയി, എലോയി, ലെമാ സബക്താനി?
  rationale: മർക്കോസ് സംരക്ഷിച്ച സെമിറ്റിക് വാക്കുകൾ മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്യുകയും തുടർന്ന് അവയുടെ പരിഭാഷ നൽകുകയും ചെയ്യുന്നു; SBLGNTയിലെ λεμά അനുസരിച്ച് ‘ലെമാ’ സ്വീകരിച്ചു.
- source_word: μεθερμηνευόμενον
  choice: എന്നു പറഞ്ഞാൽ
  rationale: ഇവിടെ സെമിറ്റിക് വാക്കുകളുടെ അർഥപരിഭാഷ അവതരിപ്പിക്കുന്ന പങ്ക് സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰς τί
  choice: എന്തിനാണ്
  rationale: കാരണമോ ഉദ്ദേശ്യമോ ചോദിക്കാവുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്; മൂലത്തിലെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: ἐγκατέλιπές με
  choice: നീ എന്നെ ഉപേക്ഷിച്ചത്
  rationale: ἐγκαταλείπω സൂചിപ്പിക്കുന്ന കൈവിടൽ/ഉപേക്ഷിക്കൽ എന്ന ശക്തമായ അർഥവും സങ്കീർത്തനം 22:1-ന്റെ പ്രതിധ്വനിയും ഗൗരവത്തോടെ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ നിലവിളിയും സങ്കീർത്തനം 22:1-ഉം തമ്മിലുള്ള ബന്ധം
  choice: ഉപേക്ഷിക്കപ്പെട്ടതിന്റെ നേരിട്ടുള്ള നിലവിളിയായി വാചകം നിലനിർത്തി, സങ്കീർത്തനബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
  alternative: ദൈവശാസ്ത്രപരമായ വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കുകയോ ഉപേക്ഷിക്കപ്പെട്ടതിന്റെ ശക്തി മൃദൂകരിക്കുകയോ ചെയ്യുക.
  rationale: വാക്യത്തിലെ യഥാർഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുകയും വ്യക്തമായ തിരുവെഴുത്തുപ്രതിധ്വനി വായനക്കാരനെ അറിയിക്കുകയും ചെയ്യുന്നു.
- issue: യേശുവിന്റെ സെമിറ്റിക് വാക്കുകളുടെ അവതരണം
  choice: ലിപ്യന്തരിച്ച വാക്കുകളും അവയുടെ മലയാളപരിഭാഷയും രണ്ടും നിലനിർത്തുന്നു.
  alternative: അർഥം മാത്രം പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ മത്തായിയുടെ ‘ഏലി, ഏലി’ എന്ന രൂപത്തിലേക്ക് ഏകീകരിക്കുക.
  rationale: മർക്കോസിന്റെ സാഹിത്യരീതിയെ കൃത്യമായി പിന്തുടരുകയും സമാന്തര സുവിശേഷവുമായി അനാവശ്യമായി സമന്വയിപ്പിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പുരാതന സമയപ്രയോഗവും മർക്കോസ് നൽകിയ സെമിറ്റിക് നിലവിളിയും നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പുകളുടെ എല്ലാ ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
