reference: Mark 15:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: ml
  text: അരിമഥ്യയിൽ നിന്നുള്ള യോസേഫ്, ആദരണീയനായ ഒരു സഭാംഗവും ദൈവരാജ്യത്തിനായി താനും കാത്തിരുന്നവനുമായിരുന്നു. അവൻ തുനിഞ്ഞ്[a] പീലാത്തോസിന്റെ അടുക്കൽ ചെന്നു യേശുവിന്റെ ശരീരം അപേക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തുനിഞ്ഞ്’ എന്നതിന് ‘ധൈര്യത്തോടെ’ എന്നും വിവർത്തനം ചെയ്യാം; പീലാത്തോസിനെ സമീപിക്കുന്നതിൽ യോസേഫ് കാണിച്ച ധൈര്യത്തിന് ഗ്രീക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: അരിമഥ്യയിൽനിന്നുള്ള
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ഉത്ഭവസ്ഥലം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εὐσχήμων βουλευτής
  choice: ആദരണീയനായ ഒരു ന്യായാധിപസഭാംഗം
  rationale: εὐσχήμων എന്നതിലെ ബഹുമാനവും സാമൂഹികപ്രാധാന്യവും ‘ആദരണീയനായ’ എന്നു നൽകുന്നു; βουλευτής ഒരു സഭയിലെ അംഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്ക് പദം സൻഹെദ്രിൻ എന്നു വ്യക്തമാക്കാത്തതിനാൽ ആ പേര് ചേർത്തിട്ടില്ല.
- source_word: ὃς καὶ αὐτὸς ἦν προσδεχόμενος
  choice: താനും കാത്തിരുന്ന
  rationale: καὶ αὐτός എന്ന ഊന്നൽ ‘താനും’ എന്നതിലൂടെ നിലനിർത്തുകയും, അപൂർണ്ണകാല പര്യയപ്രയോഗത്തിലെ തുടർച്ചയായ പ്രതീക്ഷ ‘കാത്തിരുന്ന’ എന്നതിലൂടെ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിനായി
  rationale: കേന്ദ്ര സുവിശേഷപ്രയോഗമായ ‘ദൈവരാജ്യം’ നേരിട്ട് നിലനിർത്തുന്നു; προσδέχομαι എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ ‘-ത്തിനായി കാത്തിരിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: τολμήσας
  choice: ധൈര്യം സംഭരിച്ച്
  rationale: പീലാത്തോസിനെ സമീപിക്കുന്നതിലെ സാഹസവും ധൈര്യവും പ്രകടമാക്കുന്നു; ‘ധൈര്യത്തോടെ’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ ‘ദൃഢനിശ്ചയം എടുത്ത്/തുനിഞ്ഞ്’ എന്ന ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: പീലാത്തോസിന്റെ സന്നിധിയിൽ ചെന്ന്
  rationale: അകത്തു പ്രവേശിച്ച് ഭരണാധികാരിയുടെ മുമ്പിൽ ചെല്ലുന്ന ദിശാഭാവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ ശരീരം ചോദിച്ചു
  rationale: അപേക്ഷിച്ചതിന്റെ അർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുകയും ഗൗരവമുള്ള ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐλθὼν
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്യാതെ ‘ചെന്ന്’ എന്ന മുഖ്യചലനക്രിയയിൽ ഉൾപ്പെടുത്തി
  rationale: ἐλθών, εἰσῆλθεν എന്നീ ചലനപ്രയോഗങ്ങൾ വേർതിരിച്ച് നൽകിയാൽ മലയാളത്തിൽ ആവർത്തനം ഉണ്ടാകും; ആദ്യ പങ്കാളിക്രിയയുടെ ചലനഭാവം ‘ചെന്ന്’ എന്നതിൽ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: βουλευτής സൂചിപ്പിക്കുന്ന സഭയുടെ തിരിച്ചറിയൽ
  choice: ‘ന്യായാധിപസഭാംഗം’ എന്നു നൽകി; ‘സൻഹെദ്രിൻ’ എന്നു പേരെടുത്തില്ല
  alternative: സൻഹെദ്രിൻ അംഗം
  rationale: സന്ദർഭത്തിൽ യഹൂദസഭയായിരിക്കാനാണ് സാധ്യത; എന്നാൽ മൂലപദം സഭയുടെ പേര് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ചരിത്രപരമായ സാധ്യതയെ മുഖ്യവാചകത്തിൽ ഉറപ്പാക്കിയിട്ടില്ല.
- issue: τολμήσας എന്നതിന്റെ ശക്തി
  choice: ‘ധൈര്യം സംഭരിച്ച്’
  alternative: ധൈര്യത്തോടെ; തുനിഞ്ഞ്
  rationale: യോസേഫിന്റെ പ്രവൃത്തിയിൽ ഉൾപ്പെട്ട അപകടസാധ്യതയും ധീരമായ തീരുമാനവും സംരക്ഷിക്കുന്നു; കാരണം എന്തെന്ന് വാക്യം പറയാത്തതിനാൽ അത് വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദീർഘമായ വിശേഷണശൃംഖല ഡാഷുകൾക്കുള്ളിൽ ക്രമപ്പെടുത്തി; ‘സൻഹെദ്രിൻ’ പോലുള്ള മൂലത്തിൽ പേരെടുത്തിട്ടില്ലാത്ത സാങ്കേതിക നിർണ്ണയം ഒഴിവാക്കി.
