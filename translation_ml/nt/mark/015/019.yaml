  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: ml
  text: അവർ ഞാങ്ങണകൊണ്ട് അവന്റെ തലയിൽ അടിച്ചുകൊണ്ടിരുന്നു; അവന്റെമേൽ തുപ്പിക്കൊണ്ടിരുന്നു; മുട്ടുകുത്തി അവനെ വണങ്ങിക്കൊണ്ടുമിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ ആരാധിച്ചുകൊണ്ടുമിരുന്നു.’ ഗ്രീക്കിലെ ക്രിയയ്ക്ക് ‘മുമ്പിൽ കുനിയുക,’ ‘ആദരവ് അർപ്പിക്കുക,’ ‘ആരാധിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ അത് പടയാളികൾ രാജകീയ ബഹുമാനം പരിഹാസപൂർവം അനുകരിച്ചതിനെ വിവരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: വീണ്ടും വീണ്ടും അടിക്കുകയും
  rationale: അപൂർണ ഭൂതകാലക്രിയ ആവർത്തിച്ചുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: അവന്റെ തലയിൽ
  rationale: സ്വത്തുബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ‘അടിക്കുക’ എന്ന ക്രിയയോടൊപ്പം സ്ഥാനസൂചകവിഭക്തി ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: καλάμῳ
  choice: ഒരു കോൽകൊണ്ട്
  rationale: κάλαμος ഞാങ്ങണയെയോ ഞാങ്ങണപോലുള്ള കോലിനെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിലെ പ്രഹരോപകരണം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കാൻ ‘കോൽ’ തിരഞ്ഞെടുത്തു.
- source_word: ἐνέπτυον αὐτῷ
  choice: അവന്റെമേൽ തുപ്പുകയും ചെയ്തു
  rationale: ദത്തിവിഭക്തിയോടുള്ള ക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുകൊണ്ടിരുന്ന അപമാനപ്രവൃത്തിയും വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: τιθέντες τὰ γόνατα
  choice: മുട്ടുകുത്തി
  rationale: അക്ഷരാർഥത്തിൽ ‘മുട്ടുകൾ വെച്ചുകൊണ്ട്’; മുട്ടുകുത്തുക എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: προσεκύνουν αὐτῷ
  choice: അവനെ നമസ്കരിച്ചു
  rationale: προσκυνέω കുനിഞ്ഞ് ആദരിക്കൽ, പ്രണാമം, ആരാധന എന്നിവ സൂചിപ്പിക്കാം. പരിഹാസപരമായ രാജകീയാഭിവാദ്യത്തിന്റെ സന്ദർഭത്തിൽ ‘നമസ്കരിച്ചു’ ശരീരഭാവവും വ്യാജബഹുമാനവും നിലനിർത്തുന്നു; ‘ആരാധിച്ചു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പരിഹാസസന്ദർഭത്തിൽ προσκυνέω വിവർത്തനം ചെയ്യുന്നത്
  choice: അവനെ നമസ്കരിച്ചു
  alternative: അവനെ ആരാധിച്ചു; അവന്റെ മുമ്പിൽ കുനിഞ്ഞു
  rationale: പടയാളികൾ യേശുവിന് യഥാർഥ ഭക്തി അർപ്പിക്കുകയല്ല, രാജാവിനുള്ള ആദരം പരിഹാസമായി അനുകരിക്കുകയാണ്. ‘നമസ്കരിച്ചു’ ഈ സന്ദർഭാർഥം അനാവശ്യമായി തീർപ്പാക്കാതെ നൽകുന്നു; ‘ആരാധിച്ചു’ എന്ന നിഘണ്ടുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ആവർത്തിത പ്രവൃത്തിയെ ‘വീണ്ടും വീണ്ടും’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു. ‘നമസ്കരിച്ചു’ എന്നത് ഇവിടെ ആരാധനയെന്ന അർഥം നിർബന്ധിക്കാതെ പരിഹാസപരമായ പ്രണാമം പ്രകടിപ്പിക്കുന്നു.
