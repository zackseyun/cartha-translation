revisions:
- from: അവർ ഒരു കോൽകൊണ്ട് അവന്റെ തലയിൽ വീണ്ടും വീണ്ടും അടിക്കുകയും അവന്റെമേൽ തുപ്പുകയും ചെയ്തു; മുട്ടുകുത്തി അവനെ നമസ്കരിച്ചു.[a]
  to: അവർ ഞാങ്ങണകൊണ്ട് അവന്റെ തലയിൽ അടിച്ചുകൊണ്ടിരുന്നു; അവന്റെമേൽ തുപ്പിക്കൊണ്ടിരുന്നു; മുട്ടുകുത്തി അവനെ വണങ്ങിക്കൊണ്ടുമിരുന്നു.[a]
