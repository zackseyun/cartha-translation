language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: ml
  text: 'അവനെതിരായ കുറ്റാരോപണം രേഖപ്പെടുത്തിയ ലിഖിതം ഇങ്ങനെയായിരുന്നു: “യെഹൂദന്മാരുടെ രാജാവ്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദ്യരുടെ രാജാവ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: ലിഖിതം
  rationale: ക്രൂശിന്മേലോ അതിനു മുകളിലോ സ്ഥാപിച്ച എഴുത്തിനെ സൂചിപ്പിക്കുന്ന ഔപചാരികവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: αἰτία
  choice: അവന്റെമേൽ ചുമത്തിയ കുറ്റം
  rationale: ഈ ന്യായവ്യവഹാരസന്ദർഭത്തിൽ പദം കുറ്റാരോപണത്തെയോ ഔദ്യോഗിക കുറ്റത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നിയമപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπιγεγραμμένη
  choice: രേഖപ്പെടുത്തിയ ... ഇങ്ങനെയായിരുന്നു
  rationale: ἦν എന്ന ക്രിയയോടുകൂടിയ പരിപ്രാസ്തിക പൂർണകാലരൂപം എഴുത്ത് രേഖപ്പെടുത്തി നിലനിന്നിരുന്നുവെന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന ഉപയോഗിച്ചു.
- source_word: βασιλεὺς
  choice: രാജാവ്
  rationale: കുറ്റപത്രത്തിൽ നൽകിയ രാജകീയ പദവി നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ
  rationale: സുവിശേഷങ്ങളിലെ പീഡാനുഭവവിവരണങ്ങളിൽ കാണുന്ന സ്ഥിരമായ രാഷ്ട്രീയ-ജനവിഭാഗ പദവിയെ പരിചിതമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു; ഭൂമിശാസ്ത്രപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ക്രൂശിലെ പദവിയിൽ Ἰουδαίων എന്നതിന്റെ പരിഭാഷ
  choice: യെഹൂദന്മാരുടെ
  alternative: യെഹൂദ്യരുടെ
  rationale: വാക്യം യേശുവിനെതിരായ റോമൻ കുറ്റാരോപണത്തിലെ പദവിയാണ് റിപ്പോർട്ട് ചെയ്യുന്നത്. പരിചിതമായ ജനവിഭാഗസൂചന മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യർ’ എന്ന അർഥം സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ കുറ്റാരോപണസ്വഭാവവും ഔദ്യോഗിക ലിഖിതത്തിന്റെ ഭാവവും നിലനിർത്തി.
