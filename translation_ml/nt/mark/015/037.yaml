  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: ml
  text: എന്നാൽ യേശു ഉച്ചത്തിൽ നിലവിളിച്ച്[a] അന്ത്യശ്വാസം വിട്ടു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വലിയൊരു നിലവിളി പുറപ്പെടുവിച്ച്’ അല്ലെങ്കിൽ ‘ഉച്ചത്തിൽ ശബ്ദമുയർത്തി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മരിച്ചു’; അക്ഷരാർഥത്തിൽ, ‘ശ്വാസം പുറത്തുവിട്ടു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: δέ ഒരു മൃദുവായ ബന്ധകമാണെങ്കിലും, ഇവിടെ സംഭവവിവരണത്തിലെ നിർണായകമായ തിരിവും മുൻസന്ദർഭത്തോടുള്ള ഗൗരവമുള്ള വൈരുധ്യവും സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘എന്നാൽ’ അനുയോജ്യമാണ്.
- source_word: ἀφεὶς
  choice: നിലവിളിച്ച്
  rationale: ἀφίημι എന്ന ക്രിയയുടെ കർത്തൃവാചക ഭൂതകാല കൃദന്തരൂപം ഇവിടെ ശബ്ദം പുറപ്പെടുവിക്കുക എന്ന പ്രയോഗാർഥത്തിലാണ്. φωνὴν μεγάλην എന്നതോടൊപ്പം ചേർത്ത് ‘നിലവിളിച്ച്’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: φωνὴν μεγάλην
  choice: ഉച്ചത്തിൽ നിലവിളിച്ച്
  rationale: φωνή എന്നതിന് ശബ്ദം, സ്വരം, നിലവിളി എന്നീ അർഥങ്ങൾ വരാം. പീഡാനുഭവസന്ദർഭത്തിൽ ἀφεὶς എന്നതോടൊപ്പം ‘നിലവിളി’ യോജിക്കുന്നു; μεγάλην ശബ്ദത്തിന്റെ ശക്തി സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉച്ചത്തിൽ’ എന്നു നൽകി.
- source_word: ἐξέπνευσεν
  choice: അന്ത്യശ്വാസം വിട്ടു
  rationale: ἐκπνέω അക്ഷരാർഥത്തിൽ ശ്വാസം പുറത്തുവിടുന്നതിനെയും പ്രയോഗാർഥത്തിൽ മരിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു. ‘അന്ത്യശ്വാസം വിട്ടു’ എന്നത് മരണത്തെ വ്യക്തമായി അറിയിക്കുമ്പോഴും മൂലപദത്തിലെ ശ്വാസത്തിന്റെ ദൃശ്യബിംബവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: ὁ δὲ Ἰησοῦς
  choice: എന്നാൽ യേശു
  rationale: ഗ്രീക്കിൽ വ്യക്തിനാമത്തോടൊപ്പമുള്ള നിർദ്ദേശകപദം മലയാളത്തിൽ പ്രത്യേകം പ്രതിനിധീകരിക്കേണ്ടതില്ല; δέയുടെ ബന്ധകഭാവം ‘എന്നാൽ’ എന്നതിലൂടെ നൽകി.
theological_decisions:
- issue: യേശുവിന്റെ മരണത്തെ അധികമായ ദൈവശാസ്ത്ര സൂചനകൾ ചേർക്കാതെ വിവർത്തനം ചെയ്യുക
  choice: അന്ത്യശ്വാസം വിട്ടു
  alternative: മരിച്ചു; ആത്മാവിനെ ഏല്പിച്ചു
  rationale: വാക്യം യേശുവിന്റെ മരണത്തെ സംക്ഷിപ്തമായ സംഭവവിവരണമായി പറയുന്നു. ‘അന്ത്യശ്വാസം വിട്ടു’ എന്നത് ഗ്രീക്ക് ക്രിയയിലെ ശ്വാസബിംബം നിലനിർത്തുന്നു. ‘ആത്മാവിനെ ഏല്പിച്ചു’ എന്നത് ഈ ക്രിയയിൽ നേരിട്ട് ഇല്ലാത്ത ആശയം ചേർക്കുകയും മറ്റു സുവിശേഷങ്ങളിലെ ഭാഷയുമായി സമന്വയിപ്പിക്കുകയും ചെയ്യുന്നതിനാൽ സ്വീകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭവവിവരണശൈലി സ്വീകരിച്ചു. വാക്യത്തിന്റെ സംക്ഷിപ്തതയും ക്ലൈമാക്സിലെ ശക്തിയും നിലനിർത്തി; മറ്റു സുവിശേഷങ്ങളിൽ നിന്നുള്ള വ്യാഖ്യാനാത്മക പദപ്രയോഗങ്ങൾ ചേർത്തിട്ടില്ല.
