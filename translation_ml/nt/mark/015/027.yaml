  source_fidelity: The draft accurately represents σύν αὐτῷ, Mark’s historical present σταυροῦσιν, the two λῃσταί, and the paired positions at Jesus’ right and left. The lexical footnote appropriately preserves the possible broader and politically charged senses of λῃσταί without imposing them on the text.
  naturalness: The wording is generally modern and clear. Replacing the bare locatives “വലത്തും … ഇടത്തും” with “വലതുവശത്തും … ഇടതുവശത്തും” makes the spatial sense explicit and more idiomatic in a formal narrative context. Repeating “അവന്റെ” removes any momentary ambiguity while naturally reflecting the Greek pronoun’s scope over both phrases.
