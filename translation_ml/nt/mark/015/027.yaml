source:
  edition: SBLGNT
  text: καὶ σὺν αὐτῷ σταυροῦσιν δύο λῃστάς, ἕνα ἐκ δεξιῶν καὶ ἕνα ἐξ εὐωνύμων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: ml
  text: അവനോടൊപ്പം അവർ രണ്ടു കവർച്ചക്കാരെയും[a] ക്രൂശിക്കുന്നു—ഒരാളെ അവന്റെ വലതുവശത്തും മറ്റൊരാളെ അവന്റെ ഇടതുവശത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൊള്ളക്കാർ’; ഈ പദം രാഷ്ട്രീയ സൂചനയോടെ മനസ്സിലാക്കുന്നുവെങ്കിൽ, ‘കലാപകാരികൾ’ എന്നും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: അവനോടൊപ്പം
  rationale: സύν + ദത്തിവ് കൂടെയുണ്ടായിരിക്കുക എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പ്രയോഗം.
- source_word: σταυροῦσιν
  choice: അവർ ... ക്രൂശിക്കുന്നു
  rationale: വർത്തമാനകാല കർത്തരി മൂന്നാം പുരുഷ ബഹുവചനം. മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: δύο λῃστάς
  choice: രണ്ടു കവർച്ചക്കാരെ
  rationale: λῃστής കവർച്ചക്കാരൻ, കൊള്ളക്കാരൻ, ആയുധധാരിയായ വഴിക്കവർച്ചക്കാരൻ എന്നീ അർഥങ്ങൾക്കിടയിൽ വരാം. രാഷ്ട്രീയ കലാപകാരികൾ എന്ന കൂടുതൽ നിർദിഷ്ടമായ അർഥം മുഖ്യപാഠത്തിൽ ചുമത്താതെ പൊതുവായ അർഥം സ്വീകരിക്കുന്നു.
- source_word: ἕνα ἐκ δεξιῶν
  choice: ഒരാളെ അവന്റെ വലത്ത്
  rationale: ക്രൂശിക്കപ്പെട്ടവരുടെ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവും.
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: മറ്റൊരാളെ ഇടത്ത്
  rationale: εὐώνυμος ഇവിടെ ഇടതുവശത്തെ സൂചിപ്പിക്കുന്നു. αὐτοῦ സമാന്തരമായ രണ്ടു സ്ഥാനപ്രയോഗങ്ങൾക്കും ബാധകമായതിനാൽ ആദ്യത്തേതിലെ ‘അവന്റെ’ രണ്ടാമത്തേതിലും അർഥപരമായി തുടരുന്നു.
theological_decisions:
- issue: ക്രൂശിക്കൽ വിവരണത്തിലെ λῃσταί എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കവർച്ചക്കാർ
  alternative: കൊള്ളക്കാർ; ഒരുപക്ഷേ രാഷ്ട്രീയ സൂചന ഉദ്ദേശിച്ചിട്ടുണ്ടെങ്കിൽ കലാപകാരികൾ
  rationale: ഈ പദം അക്രമാസക്തരായ കവർച്ചക്കാരെയോ കൊള്ളസംഘക്കാരെയോ സൂചിപ്പിക്കാം; ചില സന്ദർഭങ്ങളിൽ കലാപപ്രവർത്തനത്തിന്റെ രാഷ്ട്രീയ നിഴലും ഉണ്ടാകാം. എന്നാൽ ഈ വാക്യം മാത്രം രാഷ്ട്രീയ അർഥം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ വിശാലമായ അർഥം മുഖ്യപാഠത്തിലും സാധ്യതകൾ അടിക്കുറിപ്പിലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം സംരക്ഷിച്ചു; λῃστής എന്ന പദത്തിന്റെ സാധ്യതാവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
