source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: ml
  text: ജനക്കൂട്ടത്തെ തൃപ്തിപ്പെടുത്താൻ ആഗ്രഹിച്ച പീലാത്തോസ്[a] ബറബ്ബാസിനെ അവർക്കു മോചിപ്പിച്ചു; യേശുവിനെ ചാട്ടവാറടിപ്പിച്ചശേഷം, ക്രൂശിക്കപ്പെടേണ്ടതിന് അവനെ കൈമാറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘ജനക്കൂട്ടത്തെ പ്രസാദിപ്പിക്കാൻ.’ അക്ഷരാർഥം: ‘ജനക്കൂട്ടത്തിന് മതിയായതു ചെയ്യാൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: ആഗ്രഹിച്ച
  rationale: പീലാത്തോസിന്റെ മനസ്സോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്ന കൃ participle-നെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ആലോചനയുടെ തീവ്രത അനാവശ്യമായി കൂട്ടുന്നില്ല.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: ജനക്കൂട്ടത്തെ തൃപ്തിപ്പെടുത്താൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘ജനക്കൂട്ടത്തിന് മതിയായതു ചെയ്യുക’ എന്ന ഗ്രീക്ക് പ്രയോഗം സന്ദർഭത്തിൽ അവരുടെ ആവശ്യം നിറവേറ്റി അവരെ തൃപ്തിപ്പെടുത്തുക എന്ന രാഷ്ട്രീയ അനുനയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπέλυσεν
  choice: വിട്ടുകൊടുത്തു
  rationale: തടവുകാരനായ ബറബ്ബാസിനെ മോചിപ്പിച്ചു ജനക്കൂട്ടത്തിന് വിട്ടുകൊടുത്തുവെന്ന ന്യായവിധിസന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: ദാതൃവിഭക്തി ജനക്കൂട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മോചനതീരുമാനം അവരുടെ പക്ഷത്തായി നടപ്പാക്കിയെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: παρέδωκεν
  choice: ഏല്പിച്ചുകൊടുത്തു
  rationale: യേശുവിനെ മറ്റുള്ളവരുടെ അധികാരത്തിലേക്ക് കൈമാറിയെന്ന παραδίδωμι എന്ന പീഡാനുഭവപ്രധാന ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: φραγελλώσας
  choice: ചാട്ടവാറുകൊണ്ട് അടിപ്പിച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കുമുമ്പ് നടന്ന പ്രവൃത്തി വ്യക്തമാക്കുകയും പീലാത്തോസ് നേരിട്ട് അടിച്ചതല്ല, അടിക്കാൻ കല്പിച്ചതാണെന്ന സന്ദർഭസഹജമായ കാരണകർത്തൃഭാവം പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἵνα σταυρωθῇ
  choice: ക്രൂശിക്കാനായി
  rationale: ἵνα ഉപവാക്യത്തിന്റെ ഉദ്ദേശ്യ/ഫലസൂചനയെ ‘ഏല്പിച്ചുകൊടുത്തു’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: Βαραββᾶν
  choice: ബറബ്ബാസ്
  rationale: മലയാളത്തിലെ പ്രചാരമുള്ള ബൈബിൾ നാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: Ἰησοῦν
  choice: യേശു
  rationale: മലയാളത്തിലെ സ്ഥിരപ്രയോഗമായ നാമരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι എന്ന പ്രയോഗത്തിൽ പീലാത്തോസിന്റെ ഉദ്ദേശ്യം
  choice: ജനക്കൂട്ടത്തിന്റെ ആവശ്യം നിറവേറ്റി അവരെ തൃപ്തിപ്പെടുത്തുക
  alternative: ജനക്കൂട്ടത്തെ പ്രസാദിപ്പിക്കുക; ജനക്കൂട്ടത്തിന് മതിയായതു ചെയ്യുക
  rationale: ഈ പ്രയോഗം ദയാപൂർവമായ സേവനത്തേക്കാൾ രാഷ്ട്രീയ അനുനയത്തെ സൂചിപ്പിക്കുന്നു. ‘തൃപ്തിപ്പെടുത്താൻ’ എന്നത് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥവും വിവരണത്തിലെ ധാർമിക സംഘർഷവും അധിക വ്യാഖ്യാനം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ചാട്ടവാറുകൊണ്ട് അടിപ്പിച്ചശേഷം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ഏല്പിച്ചുകൊടുത്തു’ പീഡാനുഭവവിവരണത്തിലെ കൈമാറ്റത്തിന്റെ ശക്തി നിലനിർത്തുന്നു. പാദക്കുറിപ്പിന്റെ [a] അടയാളം ബന്ധപ്പെട്ട പ്രയോഗത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
