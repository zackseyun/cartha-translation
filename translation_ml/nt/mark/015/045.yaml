  text: καὶ γνοὺς ἀπὸ τοῦ κεντυρίωνος ἐδωρήσατο τὸ ⸀πτῶμα τῷ Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/045.yaml
  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: ml
  text: ശതാധിപനിൽനിന്ന് വിവരം അറിഞ്ഞശേഷം, പീലാത്തോസ് മൃതദേഹം[a] യോസേഫിന് വിട്ടുകൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശവം.”
    reason: πτῶμα എന്ന പദത്തിന്റെ കൂടുതൽ നേരിട്ടുള്ള ശവാർഥം രേഖപ്പെടുത്തുന്ന പദവികല്പം.
lexical_decisions:
- source_word: γνοὺς
  choice: വിവരം അറിഞ്ഞശേഷം
  rationale: γινώσκωയുടെ അരിസ്റ്റ് കൃദന്തരൂപം ഇവിടെ കാലസൂചകവും സാഹചര്യസൂചകവുമാണ്; ശതാധിപനിൽനിന്ന് അറിഞ്ഞതിനു പിന്നാലെയാണ് പീലാത്തോസ് നടപടി സ്വീകരിച്ചതെന്ന ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിൽ നേരിട്ടുള്ള കർമം ഇല്ലാത്തതിനാൽ ‘വിവരം’ പൊതുവായ അർഥപൂരകമായി മാത്രം ഉപയോഗിക്കുന്നു.
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: ശതാധിപനിൽനിന്ന്
  rationale: ἀπό + ഷഷ്ഠി വിവരത്തിന്റെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. കൃത്യമായ ചരിത്രപദവിയായ centurion-ന് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ‘ശതാധിപൻ’ നിലനിർത്തുന്നു.
- source_word: ἐδωρήσατο
  choice: വിട്ടുകൊടുത്തു
  rationale: δωρέομαι ഇവിടെ ഔദ്യോഗിക അധികാരത്തോടെ മൃതദേഹം യോസേഫിന് കൈമാറാൻ അനുവദിച്ചുവെന്ന ആശയം നൽകുന്നു; ‘വിട്ടുകൊടുത്തു’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: πτῶμα
  choice: മൃതശരീരം
  rationale: πτῶμα ജീവനറ്റ ശരീരത്തെ, അഥവാ ശവത്തെ, വ്യക്തമായി സൂചിപ്പിക്കുന്നു. ‘മൃതശരീരം’ അർഥകൃത്യതയും മാന്യമായ ആഖ്യാനശൈലിയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: τῷ Ἰωσήφ
  choice: യോസേഫിന്
  rationale: ദത്തിവിഭക്തി കൈമാറ്റത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: വാക്യത്തിലെ പരോക്ഷ കർത്താവിനെ മലയാളത്തിൽ വ്യക്തമാക്കൽ
  choice: പീലാത്തോസ്
  alternative: അവൻ
  rationale: ഗ്രീക്കിൽ മുൻസന്ദർഭത്തിൽനിന്ന് കർത്താവ് പീലാത്തോസാണെന്ന് വ്യക്തമാണ്. ഒറ്റവാക്യമായി വായിക്കുമ്പോഴും ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് ആവർത്തിക്കുന്നു; ഇതിലൂടെ പുതിയ ദൈവശാസ്ത്രവിവരം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ചരിത്രപരമായ ഔദ്യോഗിക പദവിക്ക് ‘ശതാധിപൻ’ ഉപയോഗിച്ചു; മൃതദേഹത്തെ സംബന്ധിച്ച പദപ്രയോഗത്തിൽ അർഥകൃത്യതയും വായനാസൗകര്യവും സംതുലിതമാക്കി.
