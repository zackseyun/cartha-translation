  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: ml
  text: എന്നാൽ, യേശു ഇതിനകം മരിച്ചിരുന്നോ എന്ന് പീലാത്തോസ് അതിശയിച്ചു.[a] അദ്ദേഹം ശതാധിപനെ വിളിച്ചുവരുത്തി, യേശു മരിച്ചിട്ട് കുറച്ചുനേരമായിരുന്നോ എന്ന് ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യേശു ഇതിനകം മരിച്ചുകഴിഞ്ഞിരുന്നു എന്നതിൽ പീലാത്തോസ് അതിശയിച്ചു.”'
    reason: ഗ്രീക്കിലെ εἰയെ പരോക്ഷചോദ്യമായി നിലനിർത്തിയാണ് മുഖ്യപാഠം വിവർത്തനം ചെയ്യുന്നത്; ആശ്ചര്യത്തിന്റെ ഉള്ളടക്കം സൂചിപ്പിക്കുന്ന മലയാള നിർമാണവും സാധ്യമാണ്.
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: ആശ്ചര്യപ്പെട്ടു
  rationale: യേശു ഇത്ര വേഗം മരിച്ചതിനെക്കുറിച്ചുള്ള പീലാത്തോസിന്റെ വിസ്മയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰ ἤδη τέθνηκεν
  choice: യേശു ഇതിനകം മരിച്ചുകഴിഞ്ഞെന്നതിൽ
  rationale: εἰ ഇവിടെ ആശ്ചര്യത്തിന്റെ കാരണമായ പരോക്ഷചോദ്യത്തെ സൂചിപ്പിക്കുന്നു; perfect രൂപം മരണം സംഭവിച്ചുകഴിഞ്ഞതും അതിന്റെ നില തുടരുന്നതും പ്രകടമാക്കുന്നു.
- source_word: προσκαλεσάμενος
  choice: വിളിച്ചുവരുത്തി
  rationale: പീലാത്തോസ് ശതാധിപനെ തന്റെ സന്നിധിയിലേക്കു വിളിപ്പിച്ചുവെന്ന ക്രമവും അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κεντυρίωνα
  choice: ശതാധിപനെ
  rationale: റോമൻ സൈനികപദവിയുടെ പതിവായും ചരിത്രപരമായി കൃത്യമായും ഉള്ള മലയാള പദമാണ്.
- source_word: ἐπηρώτησεν
  choice: ചോദിച്ചു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ലളിതവും സ്വാഭാവികവുമായ കഥനഭാഷയിൽ നൽകുന്നു.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: മരിച്ചിട്ട് കുറച്ചുനേരമായോ എന്ന്
  rationale: πάλαι ഇവിടെ വളരെക്കാലം മുമ്പ് എന്നല്ല, മരണം സംഭവിച്ചിട്ട് ഇതിനകം കുറച്ചുനേരമായോ എന്ന അന്വേഷണമാണ്; മലയാളത്തിൽ ഈ സമയദൈർഘ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
