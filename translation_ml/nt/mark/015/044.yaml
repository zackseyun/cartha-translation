    issue: The first εἰ clause is rendered as a declarative-content construction.
    rationale: «യേശു ഇതിനകം മരിച്ചുകഴിഞ്ഞെന്നതിൽ» means roughly 'at the fact that Jesus had already died.' The Greek reads more directly, 'he was amazed whether/if he had already died.' Malayalam can retain this indirect-question form naturally.
  - severity: low
    issue: The existing footnote’s wording does not match the best literal alternative for the revised first clause.
