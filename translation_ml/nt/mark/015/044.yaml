translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; ഗ്രീക്കിൽ സർവനാമങ്ങൾ മാത്രമുള്ളിടത്ത് ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘യേശു’ ഒരിക്കൽ ആവർത്തിച്ചു.
