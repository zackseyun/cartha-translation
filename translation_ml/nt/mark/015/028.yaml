id: MRK.15.28
reference: Mark 15:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: robinson-pierpont-2005-byzantine
  text: Καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα, Καὶ μετὰ ἀνόμων ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/028.yaml
  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: ml
  text: അങ്ങനെ[a], “അവൻ നിയമലംഘകരോടൊപ്പം എണ്ണപ്പെട്ടു” എന്നു പറയുന്ന തിരുവെഴുത്ത് നിറവേറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം ഏറ്റവും പഴക്കമുള്ള ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ—നാലാം നൂറ്റാണ്ടിലെ സീനായിറ്റിക്കസ്, വത്തിക്കാനസ് എന്നിവ ഉൾപ്പെടെ—കാണുന്നില്ല; ആദ്യകാല കോപ്റ്റിക് പരിഭാഷകളിലും ഇത് ഇല്ല. എന്നാൽ ബൈസന്റൈൻ ഭൂരിപക്ഷ പാഠപരമ്പരയിലും ലത്തീൻ പാരമ്പര്യത്തിലും ഇത് സംരക്ഷിക്കപ്പെട്ടിട്ടുണ്ട്. യെശയ്യാവ് 53:12 ഉദ്ധരിക്കുന്ന ലൂക്കോസ് 22:37-നോട് ഒത്തുചേർക്കാൻ പിൽക്കാല പകർപ്പെഴുത്തുകാർ ഇത് ചേർത്തതായിരിക്കാം.
    reason: textual_critical
lexical_decisions:
- source_word: πληρόω (ἐπληρώθη)
  choice: നിറവേറി
  rationale: പ്രവചനാത്മകമായ തിരുവെഴുത്തിലെ പ്രഖ്യാപനം യാഥാർഥ്യമായതായി സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പദം.
- source_word: ἄνομος (ἀνόμων)
  choice: നിയമലംഘകർ
  rationale: അക്ഷരാർഥമായ ‘നിയമമില്ലാത്തവർ/നിയമവിരുദ്ധർ’ എന്ന ആശയവും യെശയ്യാവ് 53:12-ലെ നൈതിക-ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു; ‘കുറ്റവാളികൾ’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: λογίζομαι (ἐλογίσθη)
  choice: എണ്ണപ്പെട്ടു
  rationale: മറ്റുള്ളവരോടൊപ്പം ഒരേ വിഭാഗത്തിൽ ഉൾപ്പെടുത്തി കണക്കാക്കപ്പെട്ടു എന്ന കർമണി അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: γραφή
  choice: തിരുവെഴുത്ത്
  rationale: ഒരു വിശുദ്ധലിഖിതവാക്യത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ആധുനിക മലയാളത്തിലെ പരിചിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: Καὶ
  choice: അങ്ങനെ / ഉദ്ധരണിയിൽ ‘അവൻ’ മുമ്പ് പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ആദ്യത്തെ Καὶ സന്ദർഭബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘അങ്ങനെ’ എന്നു നൽകി. ഉദ്ധരണിയുടെ തുടക്കത്തിലെ രണ്ടാമത്തെ Καὶ സെമിറ്റിക് ഉദ്ധരണിശൈലിയുടെ ഭാഗമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു നൽകുന്നത് കൃത്രിമമാകും.
theological_decisions:
- issue: ἀνόμων എന്ന പദത്തിന്റെ വർഗീകരണം
  choice: നിയമലംഘകർ
  alternative: കുറ്റവാളികൾ / അധർമികൾ
  rationale: ഈ പദം വെറും റോമൻ നിയമപ്രകാരമുള്ള കുറ്റവാളികളെ മാത്രമല്ല, നിയമം ലംഘിക്കുന്നവരെ എന്ന വിശാലമായ അർഥം വഹിക്കുന്നു; അതിനാൽ പ്രവചനത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ഗ്രീക്കിലെ കർമണിരൂപങ്ങളും പ്രവചനനിറവേറ്റലിന്റെ ഭാഷയും സംരക്ഷിച്ചു; അനാവശ്യമായ സഭാപാരമ്പര്യ-സവിശേഷ പദങ്ങൾ ഒഴിവാക്കി.
