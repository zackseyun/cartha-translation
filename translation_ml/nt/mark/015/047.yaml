  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: ml
  text: മഗ്ദലക്കാരി മറിയയും യോസെയുടെ അമ്മയായ മറിയയും അവനെ എവിടെ വെച്ചിരിക്കുന്നുവെന്ന് നോക്കിക്കൊണ്ടിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യോസെയുടെ മറിയ.” ഗ്രീക്ക് പാഠം ഈ മറിയയെ യോസെയുമായുള്ള ബന്ധംകൊണ്ടാണ് തിരിച്ചറിയിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: യും ...യും
  rationale: കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേകമായ ‘പിന്നെ’ ചേർക്കാതെ സംയോജകഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: മഗ്ദലക്കാരി മറിയ
  rationale: മഗ്ദലയിൽ നിന്നുള്ള മറിയയെ തിരിച്ചറിയിക്കുന്ന വിശേഷണം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: യോസെയുടെ അമ്മയായ മറിയ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക ഷഷ്ഠിയെ മർക്കോസിന്റെ സന്ദർഭപ്രയോഗമനുസരിച്ച് മാതൃബന്ധമായി വ്യക്തമാക്കുന്നു; അക്ഷരാർഥത്തിലെ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐθεώρουν
  choice: നോക്കിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചയായ നിരീക്ഷണഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ποῦ
  choice: എവിടെയാണ്
  rationale: സ്ഥലം സൂചിപ്പിക്കുന്ന ചോദനക്രിയാവിശേഷണത്തെ ആശ്രിതവാക്യത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τέθειται
  choice: വെച്ചതെന്ന്
  rationale: τίθημι എന്ന ക്രിയയുടെ പൂർണ്ണ നിഷ്ക്രിയരൂപം സൂചിപ്പിക്കുന്ന പൂർത്തിയായ പ്രവൃത്തിയും അതിന്റെ ഫലാവസ്ഥയും സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിലെ വ്യാകരണഘടനയിൽ കർത്താവായ ‘അവനെ’ ചേർക്കുന്നു.
theological_decisions:
- issue: നിഷ്ക്രിയക്രിയയിൽ ഗ്രീക്കിൽ പറയാതിരിക്കുന്ന കർമം
  choice: ‘അവനെ’ എന്നു വ്യക്തമാക്കി
  alternative: ‘ശരീരം’ എന്നു നൽകുക, അല്ലെങ്കിൽ പരാമർശം അപ്രകടമായി വിടുക
  rationale: സന്ദർഭത്തിൽ യേശുവാണ് പരാമർശിക്കപ്പെടുന്നത്. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ വാക്യത്തിനായി ‘അവനെ’ എന്നത് അനുയോജ്യം; ‘ശരീരം’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ ഇല്ലാത്ത വസ്തുവൽക്കരണം വരാം.
- issue: Μαρία ἡ Ἰωσῆτος എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: പ്രധാന പാഠത്തിൽ ‘യോസെയുടെ അമ്മയായ മറിയ’
  alternative: ‘യോസെയുടെ മറിയ’
  rationale: മർക്കോസ് 15:40-ലെ അടുത്ത തിരിച്ചറിയൽപ്രയോഗം മാതൃബന്ധത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; എങ്കിലും ഗ്രീക്ക് ഇവിടെ ‘അമ്മ’ എന്ന പദം നേരിട്ട് പറയാത്തതിനാൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘നോക്കിക്കൊണ്ടിരുന്നു’ തുടർച്ചയായ നിരീക്ഷണം പ്രകടിപ്പിക്കുന്നു; ‘വെച്ചതെന്ന്’ സംസ്കാരപരമായി സ്വാഭാവികമായ ശവസംസ്കാരസന്ദർഭപ്രയോഗമാണ്.
