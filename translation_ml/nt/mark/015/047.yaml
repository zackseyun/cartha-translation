  revised_text: മഗ്ദലക്കാരി മറിയയും യോസെയുടെ അമ്മയായ മറിയയും അവനെ എവിടെ വെച്ചിരിക്കുന്നുവെന്ന് നോക്കിക്കൊണ്ടിരുന്നു[a].
