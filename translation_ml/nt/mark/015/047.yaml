  source_fidelity: ‘യോസെയുടെ അമ്മയായ മറിയ’ is a contextually well-supported clarification of Μαρία ἡ Ἰωσῆτος, and the footnote appropriately preserves the more literal relational wording. ‘നോക്കിക്കൊണ്ടിരുന്നു’ conveys the imperfect ἐθεώρουν well. However, ‘അവനെ എവിടെയാണ് വെച്ചതെന്ന്’ uses an active construction and chiefly presents the laying as a completed event; it does not adequately represent the Greek perfect passive τέθειται and its resulting state.
  naturalness: The draft is generally clear modern Malayalam. Recasting the final dependent clause as ‘അവനെ എവിടെ വെച്ചിരിക്കുന്നുവെന്ന്’ is natural in this context and more clearly communicates that they were observing the place where he had been laid and remained.
  terminology: ‘മഗ്ദലക്കാരി മറിയ’ is an intelligible modern rendering of Mary Magdalene. ‘യോസെയുടെ അമ്മയായ മറിയ’ accords with the nearby Markan identification (15:40) without making a doctrinal claim. The footnote’s literal alternative should remain, since ‘അമ്മയായ’ is supplied from context rather than stated in this verse’s Greek phrase.
  issues:
