translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ ‘കലാപകാരികൾ/കലാപം’ എന്ന പദബന്ധം കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു; δεδεμένος എന്നത് വ്യാഖ്യാനിച്ച് ‘തടവിലായിരുന്നു’ എന്നു മാത്രം മാറ്റാതെ ‘ബന്ധിക്കപ്പെട്ടിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
