source:
  edition: SBLGNT
  text: ἦν δὲ ὁ λεγόμενος Βαραββᾶς μετὰ τῶν ⸀στασιαστῶν δεδεμένος οἵτινες ἐν τῇ στάσει φόνον πεποιήκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: ml
  text: ബറബ്ബാസ് എന്നു വിളിക്കപ്പെട്ടവൻ കലാപകാരികളോടൊപ്പം ബന്ധിക്കപ്പെട്ടിരുന്നു; അവർ ആ കലാപത്തിൽ കൊലപാതകം ചെയ്തവരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കലാപകാരികളോടൊപ്പം’ എന്നതിന് ‘വിപ്ലവകാരികളോടൊപ്പം’ എന്നും ‘ആ കലാപത്തിൽ’ എന്നതിന് ‘ആ ലഹളയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഒരു കലാപത്തിൽ പങ്കെടുത്തവരെയും ആ കലാപത്തെയും സൂചിപ്പിക്കാൻ ഗ്രീക്കിൽ ഒരേ മൂലത്തിൽനിന്നുള്ള ബന്ധമുള്ള പദങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ബന്ധിക്കപ്പെട്ടിരുന്നു
  rationale: δέ-യുടെ മൃദുവായ ആഖ്യാനബന്ധം മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ വാക്യപ്രവാഹത്തിലൂടെ സൂചിപ്പിക്കുന്നു; ἦν, δεδεμένος എന്നിവ ചേർന്ന നിലയെ ‘ബന്ധിക്കപ്പെട്ടിരുന്നു’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ λεγόμενος Βαραββᾶς
  choice: ബറബ്ബാസ് എന്നു വിളിക്കപ്പെട്ട ഒരാൾ
  rationale: തിരിച്ചറിയൽ നൽകുന്ന ഗ്രീക്ക് പ്രയോഗം നിന്ദാസൂചനയില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μετὰ τῶν στασιαστῶν
  choice: കലാപകാരികളോടൊപ്പം
  rationale: στασιασταί എന്നത് കലാപത്തിലോ വിപ്ലവശ്രമത്തിലോ പങ്കെടുത്തവരെ സൂചിപ്പിക്കുന്നു; ‘കലാപകാരികൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും തുടർന്നുള്ള στάσις എന്ന പദവുമായി ബന്ധം പുലർത്തുന്നതുമാണ്.
- source_word: δεδεμένος
  choice: ബന്ധിക്കപ്പെട്ടിരുന്നു
  rationale: δέω എന്ന ക്രിയയുടെ ബന്ധിക്കപ്പെട്ട അവസ്ഥയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; തടവിലായിരുന്നു എന്ന ആശയം സന്ദർഭത്തിൽ ഉണ്ടെങ്കിലും അത് മാത്രം പറഞ്ഞ് മൂലത്തിലെ ദൃശ്യഭാവം നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: οἵτινες
  choice: അവർ ... നടത്തിയവരായിരുന്നു
  rationale: കലാപകാരികളെക്കുറിച്ചുള്ള വിവരണാത്മക ഉപവാക്യം മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐν τῇ στάσει
  choice: കലാപത്തിൽ
  rationale: στάσις ഇവിടെ സംഘടിതമായ എഴുന്നേറ്റുനിൽപ്പോ കലാപമോ സൂചിപ്പിക്കുന്നു; മുൻപുള്ള στασιασταί-യുമായുള്ള പദബന്ധവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: φόνον πεποιήκεισαν
  choice: കൊലപാതകം നടത്തിയവരായിരുന്നു
  rationale: മുൻപ് പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന രൂപവും φόνος എന്നതിന്റെ കുറ്റകൃത്യഭാവവും നിലനിർത്തുന്നു.
