id: MRK.15.32
reference: Mark 15:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: ml
  text: “ഇസ്രായേലിന്റെ രാജാവായ മശീഹ ഇപ്പോൾ കുരിശിൽനിന്ന് ഇറങ്ങിവരട്ടെ; അപ്പോൾ ഞങ്ങൾ കണ്ടു വിശ്വസിക്കാം.” അവനോടൊപ്പം കുരിശിക്കപ്പെട്ടവരും അവനെ നിന്ദിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ χριστός
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός ഒരു പേരുപോലെയല്ല, രാജകീയമായി അഭിഷിക്തനായവനെ സൂചിപ്പിക്കുന്ന പദവിയായാണ് പരിഹാസത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ ആ അർഥം നിലനിർത്തുന്ന ‘മശീഹ’ സ്വീകരിച്ചു.
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ രാജാവ്
  rationale: ഗ്രീക്കിലെ പദവിസംബന്ധിയായ ജനിറ്റീവ് ഘടന നേരായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: ഇപ്പോൾ കുരിശിൽനിന്ന് ഇറങ്ങിവരട്ടെ
  rationale: മൂന്നാംപുരുഷ ആജ്ഞാരൂപത്തിലെ വെല്ലുവിളിയും νῦν നൽകുന്ന ഉടനടിത്തവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: അപ്പോൾ ഞങ്ങൾ കണ്ടു വിശ്വസിക്കാം
  rationale: പരിഹാസപരമായ വെല്ലുവിളിയിലെ ഉദ്ദേശ്യ/ഫലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘കാണുകയും വിശ്വസിക്കുകയും ചെയ്യാം’ എന്നതിനെക്കാൾ സംസാരഭാഷയ്ക്ക് ചേർന്ന സംക്ഷിപ്തരൂപം.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: അവനോടൊപ്പം കുരിശിക്കപ്പെട്ടവർ
  rationale: യേശുവിനൊപ്പം അതേ ശിക്ഷ അനുഭവിച്ചവരെ സൂചിപ്പിക്കുന്ന പാസീവ് പങ്കുപദത്തിന്റെ അർഥം അനാവശ്യ വിശദീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ὠνείδιζον αὐτόν
  choice: അവനെ നിന്ദിച്ചുകൊണ്ടിരുന്നു
  rationale: ὀνειδίζωയുടെ നിന്ദിക്കുക/അധിക്ഷേപിക്കുക എന്ന അർഥവും ഇംപെർഫെക്റ്റിന്റെ തുടരുന്ന പ്രവൃത്തിയും വ്യക്തമായി പകർത്തുന്നു.
theological_decisions:
- issue: പരിഹാസസന്ദർഭത്തിലെ Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ ഈ പദം യഹൂദ രാജകീയ-അഭിഷിക്ത പ്രതീക്ഷയെ ഉന്നയിക്കുന്ന പദവിയാണ്; ‘മശീഹ’ ആ പദവിയുടെ അർഥഭാരം കൂടുതൽ നേരിട്ട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പരിഹാസത്തിന്റെ കൂർമ്മതയും പ്രവൃത്തിയുടെ തുടർച്ചയും നിലനിർത്തി; മതവിഭാഗവിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
