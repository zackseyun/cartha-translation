id: MRK.15.14
reference: Mark 15:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: ml
  text: 'എന്നാൽ പീലാത്തോസ് അവരോടു ചോദിച്ചുകൊണ്ടിരുന്നു: “എന്തിന്? അവൻ എന്തു തിന്മയാണ് ചെയ്തത്?” എന്നാൽ അവർ അതിലും അധികമായി വിളിച്ചുകൂവി: “അവനെ ക്രൂശിക്കുക!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ പറയുന്നത് ചോദ്യമായതിനാൽ ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ സ്വാഭാവികവും ഭാവസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: എന്തിന്? അവൻ എന്തു തിന്മയാണ് ചെയ്തത്?
  rationale: γάρ ഇവിടെ ജനക്കൂട്ടത്തിന്റെ ആവശ്യത്തിന്റെ കാരണം ചോദിക്കുന്ന പ്രതിവാദസ്വഭാവമുള്ള ഘടകമാണ്. വേർതിരിച്ച ‘എന്തിന്?’ എന്ന ചോദ്യം അതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; κακόν എന്നതിന്റെ ധാർമിക ശക്തി ‘തിന്മ’ നിലനിർത്തുന്നു.
- source_word: κακόν
  choice: തിന്മ
  rationale: നിയമപരവും ധാർമികവുമായ കുറ്റാരോപണത്തിന്റെ ഗൗരവം കുറയ്ക്കാതെ κακόν എന്നതിന്റെ ‘ദോഷം/തിന്മ’ എന്ന ശക്തി പ്രകടിപ്പിക്കുന്നു.
- source_word: περισσῶς
  choice: കൂടുതൽ ഉച്ചത്തിൽ
  rationale: ജനക്കൂട്ടത്തിന്റെ പ്രതികരണം ശക്തിപ്പെട്ടുവെന്ന ആശയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἔκραξαν
  choice: നിലവിളിച്ചു
  rationale: κράζω സൂചിപ്പിക്കുന്ന ഉച്ചത്തിലുള്ള പരസ്യമായ വിളി ശക്തമായി പകർത്തുന്നു.
- source_word: Σταύρωσον αὐτόν
  choice: അവനെ ക്രൂശിക്കുക!
  rationale: പീലാത്തോസിനോടുള്ള നേരിട്ടുള്ള ഏകവചന ആജ്ഞയുടെ രൂപവും ശക്തിയും നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: രണ്ടിടത്തുമുള്ള ആശയവൈരുധ്യം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: പീലാത്തോസിന്റെ ചോദ്യത്തിലെ κακόν എന്ന പദത്തിന്റെ ധാർമിക ശക്തി
  choice: ‘തിന്മ’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘തെറ്റ്’ അല്ലെങ്കിൽ ‘കുറ്റം’
  rationale: ‘തിന്മ’ മൂലപദത്തിന്റെ ധാർമിക ഭാരം നിലനിർത്തുന്നു; അതേസമയം യേശുവിന്റെ നിരപരാധിത്വത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: γάρ എന്നതിന്റെ ചോദ്യത്തിലെ പ്രവർത്തനം
  choice: ‘എന്തിന്?’ എന്ന സ്വതന്ത്ര പ്രതിവാദചോദ്യമായി പ്രകടിപ്പിച്ചു
  alternative: ‘അവൻ എന്തു തിന്മയാണ് ചെയ്തിരിക്കുന്നത്?’ എന്നു മാത്രം നൽകുക
  rationale: γάρ ആവശ്യത്തിന്റെ അടിസ്ഥാനത്തെ വെല്ലുവിളിക്കുന്ന സ്വഭാവം വഹിക്കുന്നു. മലയാളത്തിൽ ‘എന്തിന്?’ ചേർക്കുന്നത് ആ ഘടകം വ്യക്തമാക്കുകയും മൂലത്തിലെ ചോദ്യഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പീലാത്തോസിന്റെ തുടരുന്ന ചോദ്യം, ജനക്കൂട്ടത്തിന്റെ വർധിച്ച ഉച്ചത്തിലുള്ള പ്രതികരണം, നേരിട്ടുള്ള ആജ്ഞ എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
