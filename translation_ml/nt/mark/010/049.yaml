source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: ml
  text: 'യേശു നിന്നിട്ട്[a] പറഞ്ഞു: “അവനെ വിളിക്കൂ.” അവർ ആ അന്ധനെ വിളിച്ച് അവനോട് പറഞ്ഞു: “ധൈര്യപ്പെടൂ[b]; എഴുന്നേൽക്കൂ, അവൻ നിന്നെ വിളിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യാത്ര നിർത്തി.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “നിന്നിട്ട്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “മനസ്സുറപ്പിക്കൂ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: നിന്നിട്ട്
  rationale: ἵστημι എന്ന ക്രിയയുടെ കർത്തൃവാചക ഭൂതകാല കൃദന്തം ഇവിടെ നടന്നുകൊണ്ടിരുന്ന യേശു നിന്നു എന്ന ആശയം നൽകുന്നു. ‘നിന്നിട്ട്’ മൂലരൂപത്തിന്റെ ദൃശ്യഭാവവും സന്ദർഭത്തിലെ ‘യാത്ര നിർത്തി’ എന്ന അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Φωνήσατε αὐτόν
  choice: അവനെ വിളിക്കൂ
  rationale: φωνέω ഇവിടെ ഒരാളെ അടുത്തേക്കു വിളിക്കുക എന്ന അർഥത്തിലാണ്. നേരിട്ടുള്ള കല്പനയും തുടർന്നുള്ള അതേ ക്രിയയുടെ ആവർത്തനവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: φωνοῦσι
  choice: വിളിച്ച്
  rationale: യേശുവിന്റെ കല്പനയിൽ വന്ന φωνέω എന്ന ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹം നൽകുന്നു.
- source_word: τὸν τυφλὸν
  choice: ആ അന്ധനെ
  rationale: τυφλός ഇവിടെ നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു. സന്ദർഭത്തിൽ നേരത്തേ പരാമർശിക്കപ്പെട്ട പുരുഷനെ സൂചിപ്പിക്കാൻ ‘ആ അന്ധനെ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: Θάρσει
  choice: ധൈര്യമായിരിക്കൂ
  rationale: ഈ ഏകവചന കല്പന പ്രോത്സാഹനവും ആശ്വാസവും നൽകുന്നു. ‘ധൈര്യമായിരിക്കൂ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: ἔγειρε
  choice: എഴുന്നേൽക്കൂ
  rationale: ἔγειρε ഇവിടെ ഇരുന്ന നിലയിൽനിന്ന് എഴുന്നേൽക്കാനുള്ള നേരിട്ടുള്ള ആഹ്വാനമാണ്. ‘എഴുന്നേൽക്കൂ’ അതിന്റെ പ്രവർത്തനാത്മകത സ്വാഭാവികമായി പകരുന്നു.
- source_word: φωνεῖ σε
  choice: അവൻ നിന്നെ വിളിക്കുന്നു
  rationale: വർത്തമാനകാലരൂപം വിളി ഇപ്പോൾ നടക്കുന്നതിന്റെ അടിയന്തരത അറിയിക്കുന്നു. മലയാളത്തിലെ ‘വിളിക്കുന്നു’ അതിനെ നേരായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
