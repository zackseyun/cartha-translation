translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. φωνέω എന്ന ക്രിയയുടെ ആവർത്തനം ‘വിളിക്കുക’ എന്ന പദത്തിലൂടെ നിലനിർത്തി. മൂലപാഠത്തിലെ തുടർച്ചയായ καί ബന്ധങ്ങൾ മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ രണ്ടാം ഘട്ടത്തിൽ കൃദന്തരൂപം ഉപയോഗിച്ചെങ്കിലും സംഭവക്രമം മാറ്റിയിട്ടില്ല.
