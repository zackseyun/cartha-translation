  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂αὐτὴ ἀπολύσασα τὸν ἄνδρα αὐτῆς γαμήσῃ ἄλλον⸃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: ml
  text: അവൾ തന്റെ ഭർത്താവിനെ വിവാഹമോചനം ചെയ്ത്[a] മറ്റൊരു പുരുഷനെ വിവാഹം കഴിച്ചാൽ, അവൾ വ്യഭിചാരം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘തന്റെ ഭർത്താവിനെ വിട്ടയച്ച്.’ ഈ വിവാഹസന്ദർഭത്തിൽ അതിന്റെ അർഥം ‘വിവാഹമോചനം ചെയ്ത്’ എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അവൾ
  rationale: മുൻവാക്യത്തിലെ സമാന്തര പ്രസ്താവനയോടുള്ള ബന്ധം മലയാളത്തിലെ വാക്യസന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു; ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ കൃത്രിമമായ ‘കൂടാതെ’ ഒഴിവാക്കി.
- source_word: ἐὰν
  choice: ചെയ്താൽ
  rationale: നിബന്ധന സൂചിപ്പിക്കുന്ന ἐὰν മലയാളത്തിലെ സ്വാഭാവിക നിബന്ധനാപ്രത്യയമായ ‘-ആൽ’കൊണ്ട് പ്രകടിപ്പിച്ചു.
- source_word: αὐτὴ
  choice: അവൾ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സ്ത്രീലിംഗ കർത്താവിനെ നിലനിർത്തുന്നു.
- source_word: ἀπολύσασα
  choice: വിവാഹമോചനം ചെയ്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞയയ്ക്കുക/വിട്ടയയ്ക്കുക’ എന്നായാലും വിവാഹസന്ദർഭത്തിൽ വിവാഹബന്ധം വേർപെടുത്തുക എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: തന്റെ ഭർത്താവിനെ
  rationale: ἀνήρ ഇവിടെ വിവാഹസന്ദർഭത്തിൽ ‘ഭർത്താവ്’ എന്നാണ്; αὐτῆς-ന്റെ പ്രത്യാവർത്തനബന്ധം മലയാളത്തിൽ ‘തന്റെ’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: γαμήσῃ ἄλλον
  choice: മറ്റൊരു പുരുഷനെ വിവാഹം കഴിച്ചാൽ
  rationale: ἄλλον പുരുഷലിംഗമായതിനാൽ മറ്റൊരു പുരുഷൻ എന്ന ലിംഗനിർദ്ദിഷ്ടത നിലനിർത്തി.
- source_word: μοιχᾶται
  choice: അവൾ വ്യഭിചാരം ചെയ്യുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം; വ്യക്തിയെ ‘വ്യഭിചാരിണി’ എന്നു മുദ്രകുത്തുന്നതിനുപകരം പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വാക്യത്തിലെ ലിംഗനിർദ്ദിഷ്ടത നിലനിർത്തണമോ
  choice: സ്ത്രീ കർത്താവും പുരുഷനായ മറ്റൊരു വിവാഹപങ്കാളിയും വ്യക്തമായി നിലനിർത്തി
  alternative: ‘ഒരാൾ തന്റെ പങ്കാളിയെ ഉപേക്ഷിച്ച് മറ്റൊരാളെ വിവാഹം കഴിച്ചാൽ’ എന്ന ലിംഗനിരപേക്ഷ രൂപം
  rationale: αὐτὴ, τὸν ἄνδρα αὐτῆς, ἄλλον എന്നിവ ഗ്രീക്കിൽ വ്യക്തമായി ലിംഗനിർദ്ദിഷ്ടമാണ്; മുൻവാക്യത്തിലെ പുരുഷനെക്കുറിച്ചുള്ള സമാന്തരതയും ഇതിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: ἀπολύω എന്നത് അക്ഷരാർഥത്തിലോ വിവാഹനിയമപരമായ അർഥത്തിലോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘വിവാഹമോചനം ചെയ്യുക’
  alternative: ‘ഭർത്താവിനെ പറഞ്ഞയയ്ക്കുക’ അഥവാ ‘വിട്ടയയ്ക്കുക’
  rationale: വിവാഹസന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് വിവാഹബന്ധത്തിന്റെ വേർപാടാണ്. പ്രധാനവാചകത്തിൽ അതിന്റെ സന്ദർഭാർഥം നൽകി, അക്ഷരസമീപമായ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ നിബന്ധനയും ലിംഗനിർദ്ദിഷ്ടതയും പ്രവൃത്തികേന്ദ്രമായ വിധിപ്രസ്താവനയും സംരക്ഷിച്ചു.
