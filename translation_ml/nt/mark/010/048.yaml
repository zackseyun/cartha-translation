id: MRK.10.48
reference: Mark 10:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: ml
  text: 'പലരും അവനെ മിണ്ടാതിരിക്കാൻ ശാസിച്ചുകൊണ്ടിരുന്നു; എന്നാൽ അവൻ അതിലുമധികം നിലവിളിച്ചുകൊണ്ടിരുന്നു: “ദാവീദിന്റെ പുത്രാ[a], എന്നോടു കരുണ കാണിക്കണമേ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദാവീദിന്റെ പുത്രൻ” രാജകീയവും മിശിഹായികവുമായ ഒരു സ്ഥാനപ്പേരാണ്; അതിന്റെ അർഥം “മിശിഹാ” എന്നും വ്യക്തമാക്കാം, എങ്കിലും ഇവിടെ ഗ്രീക്കിലെ പദരൂപം നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: ശാസിച്ചുകൊണ്ടിരുന്നു
  rationale: ക്രിയയുടെ അപൂർണ ഭൂതകാലരൂപം ആവർത്തിച്ചോ തുടർന്നുകൊണ്ടിരുന്നോ ചെയ്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ശാസിക്കുക’ എന്നത് ജനക്കൂട്ടത്തിന്റെ ശക്തമായ വിലക്കിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πολλοὶ
  choice: പലരും
  rationale: ഗ്രീക്കിൽ വിശേഷണം നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നു. ‘പലരും’ എന്നത് ‘ജനക്കൂട്ടം’ പോലുള്ള കൂടുതൽ നിർദിഷ്ടമായ ആശയം ചേർക്കാതെ നേരിട്ട് അർഥം നൽകുന്നു.
- source_word: ἵνα σιωπήσῃ
  choice: മിണ്ടാതിരിക്കാൻ
  rationale: ശാസിച്ചതിന്റെ ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πολλῷ μᾶλλον
  choice: അതിലുമധികം
  rationale: താരതമ്യപ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമായി ഇല്ലാത്ത ‘കൂടുതൽ ഉറക്കെ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: ἔκραζεν
  choice: നിലവിളിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചയും κράζω എന്ന ക്രിയയുടെ അടിയന്തരവും ശക്തവുമായ വിളിയും സംരക്ഷിക്കുന്നു.
- source_word: Υἱὲ Δαυίδ
  choice: ദാവീദിന്റെ പുത്രാ
  rationale: രാജകീയ-മിശിഹായിക പ്രാധാന്യമുള്ള അഭിസംബോധനയുടെ മൂലപദരൂപം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἐλέησόν με
  choice: എന്നോടു കരുണ കാണിക്കണമേ
  rationale: അടിയന്തരമായ അപേക്ഷയെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘കരുണ’ എന്ന പദം മൂലത്തിലെ ἐλεέω എന്ന ക്രിയയുടെ അർഥവും ദൈവശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദാവീദിന്റെ പുത്രൻ’ എന്ന അഭിസംബോധനയുടെ മിശിഹായിക പ്രാധാന്യം
  choice: ‘ദാവീദിന്റെ പുത്രാ’ എന്ന പദരൂപം അതേപടി വിവർത്തനം ചെയ്യുന്നു.
  alternative: ‘മിശിഹായേ’ എന്ന് അർഥവ്യാഖ്യാനം ചെയ്ത് വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം Υἱὲ Δαυίδ എന്ന അഭിസംബോധന നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘മിശിഹാ’ എന്ന് മാറ്റുന്നത് വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കും; പദരൂപം നിലനിർത്തുന്നത് അതിന്റെ രാജകീയവും മിശിഹായികവുമായ സൂചന വായനക്കാർക്ക് ഗ്രഹിക്കാൻ അവസരം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. രണ്ട് അപൂർണ ഭൂതകാലക്രിയകളുടെയും തുടർച്ച ‘-ച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചിക അതു വിശദീകരിക്കുന്ന ‘ദാവീദിന്റെ പുത്രാ’ എന്ന സ്ഥാനപ്പേരിനോടു ചേർത്തിരിക്കുന്നു.
