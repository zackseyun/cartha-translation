  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ സംക്ഷിപ്തത നിലനിർത്തി; സന്ദർഭവിവരം അനാവശ്യമായി മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
