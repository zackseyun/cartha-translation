  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: ml
  text: അതു കേട്ടപ്പോൾ, പത്തുപേരും യാക്കോബിനോടും യോഹന്നാനോടും[a] നീരസപ്പെടാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യാക്കോബിനെയും യോഹന്നാനെയും കുറിച്ച്’ എന്നും ‘യാക്കോബും യോഹന്നാനും നിമിത്തം’ എന്നും വിവർത്തനം ചെയ്യാം. നീരസത്തിന്റെ ലക്ഷ്യമോ അതിനുള്ള കാരണമോ സൂചിപ്പിക്കാൻ ഗ്രീക്ക് പദപ്രയോഗത്തിനു കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: അതു കേട്ടപ്പോൾ
  rationale: ഗ്രീക്കിലെ ബന്ധകമായ Καὶ, തുടർന്നുള്ള കാലസൂചക കൃതന്തത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹത്തിനായി പ്രത്യേകമായി വിവർത്തനം ചെയ്യാതെ വാക്യബന്ധത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: ἀκούσαντες
  choice: അതു കേട്ടപ്പോൾ
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി നൽകി; സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന കർമം ‘അതു’ എന്നു ചേർത്തു.
- source_word: οἱ δέκα
  choice: പത്തുപേരും
  rationale: മൂലപാഠത്തിലെ ‘പത്തുപേർ’ എന്ന പ്രയോഗം മാത്രം നിലനിർത്തി; സന്ദർഭത്തിൽ വ്യക്തമായിരുന്നാലും ‘മറ്റു’ എന്നും ‘ശിഷ്യന്മാർ’ എന്നും കൂട്ടിച്ചേർത്തില്ല. ‘-ഉം’ ആഖ്യാനത്തിലെ വിഷയമാറ്റവും കൂട്ടത്തിന്റെ സമഗ്ര പ്രതികരണവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἤρξαντο
  choice: തുടങ്ങി
  rationale: പ്രതികരണത്തിന്റെ ആരംഭം വ്യക്തമാക്കുന്ന ingressive അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἀγανακτεῖν
  choice: നീരസപ്പെടാൻ
  rationale: ἀγανακτέω സൂചിപ്പിക്കുന്ന ശക്തമായ അതൃപ്തിയും രോഷകലർന്ന എതിർപ്പും സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; വെറും ‘കോപിക്കുക’ എന്നതിലേക്കു അർഥം ചുരുക്കുന്നില്ല.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: യാക്കോബിനോടും യോഹന്നാനോടും
  rationale: വികാരപ്രതികരണത്തോടൊപ്പം περί അതിന്റെ ലക്ഷ്യത്തെയോ കാരണസന്ദർഭത്തെയോ സൂചിപ്പിക്കാം. പ്രധാന പാഠത്തിൽ ഈ നീരസം ഇരുവരിലേക്കും തിരിഞ്ഞതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി; വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: Ἰακώβου
  choice: യാക്കോബ്
  rationale: Ἰάκωβος എന്ന പേരിന്റെ മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ രൂപം; വിഭക്തിയോടെ ‘യാക്കോബിനോട്’.
- source_word: Ἰωάννου
  choice: യോഹന്നാൻ
  rationale: Ἰωάννης എന്ന പേരിന്റെ മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ രൂപം; വിഭക്തിയോടെ ‘യോഹന്നാനോട്’.
