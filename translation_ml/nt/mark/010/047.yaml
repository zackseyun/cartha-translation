  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: ml
  text: 'യേശു നസറായനാണെന്ന് കേട്ടപ്പോൾ[a] അവൻ ഉറക്കെ നിലവിളിച്ചുകൊണ്ട് പറയാൻ തുടങ്ങി: “ദാവീദിന്റെ പുത്രനായ യേശുവേ, എന്നോടു കരുണ കാണിക്കണമേ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നസറെത്തിലെ യേശു.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “നസറായനായ യേശു” എന്നാണ്; കൂടുതൽ വ്യക്തമായ ഭൂമിശാസ്ത്രപ്രയോഗത്തിനുപകരം ഒരു വിശേഷണാത്മക അഭിധാനമാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: കേട്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle-ന്റെ കാലസംബന്ധമായ അർഥവും സംഭവക്രമവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ναζαρηνός
  choice: നസറായൻ
  rationale: ഭൂമിശാസ്ത്രപരമായി കൂടുതൽ വിശദമാക്കുന്ന ‘നസറെത്തിൽനിന്നുള്ളവൻ’ എന്നതിനു പകരം ഗ്രീക്കിലെ വിശേഷണാത്മകമായ അഭിധാനം നിലനിർത്തുന്നു.
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: ഉറക്കെ വിളിച്ചുപറയാൻ തുടങ്ങി
  rationale: തുടക്കത്തെ സൂചിപ്പിക്കുന്ന ἤρξατο നിലനിർത്തുന്നു; κράζειν καὶ λέγειν എന്ന ഇരട്ടപ്രയോഗത്തിന്റെ ഉച്ചത്തിലുള്ള അടിയന്തര അഭ്യർഥന സ്വാഭാവിക മലയാളത്തിലെ സംയുക്തക്രിയയിലൂടെ നൽകുന്നു.
- source_word: Υἱὲ Δαυὶδ
  choice: ദാവീദിന്റെ പുത്രനായ
  rationale: വംശപരവും രാജകീയ-മശീഹാപരവുമായ അനുരണനമുള്ള അഭിസംബോധനയുടെ അക്ഷരരൂപം നിലനിർത്തുന്നു.
- source_word: ἐλέησόν με
  choice: എന്നോടു കരുണ കാണിക്കണമേ
  rationale: ആജ്ഞാരൂപത്തിലുള്ള ഗൗരവമേറിയ അപേക്ഷയെ ഇന്നത്തെ മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἰησοῦ
  choice: യേശുവേ
  rationale: പേരിന്റെ അംഗീകൃത മലയാളരൂപവും അഭിസംബോധനാവിഭക്തിയും ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘ദാവീദിന്റെ പുത്രൻ’ എന്ന അഭിസംബോധനയുടെ മശീഹാപരമായ ശക്തി
  choice: ‘ദാവീദിന്റെ പുത്രനായ യേശുവേ’ എന്ന് മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘ദാവീദിന്റെ വംശജനായ യേശുവേ’
  rationale: ഗ്രീക്ക് പദരൂപവും മർക്കോസിന്റെ വിവരണത്തിലെ രാജകീയ-മശീഹാപരമായ അനുരണനവും നിലനിർത്തുന്നു; അതിനെ കേവലം വംശാവലിയായി ചുരുക്കുന്നില്ല.
- issue: Ναζαρηνός എന്നതിന്റെ രൂപം
  choice: ‘നസറായൻ’ എന്ന അഭിധാനം ഉപയോഗിച്ചു.
  alternative: ‘നസറെത്തിലെ യേശു’ / ‘നസറെത്തിൽനിന്നുള്ള യേശു’
  rationale: മൂലപാഠത്തിലുള്ള വിശേഷണാത്മക അഭിധാനം സംരക്ഷിക്കുന്നു; വ്യക്തമായ ഭൂമിശാസ്ത്രപ്രയോഗം ചേർത്ത് അർഥം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും വായിച്ചുപറയാൻ അനുയോജ്യവുമായ ശൈലി. ‘നസറായൻ,’ ‘ദാവീദിന്റെ പുത്രൻ’ എന്നീ മൂലപാഠസവിശേഷതകൾ സംരക്ഷിച്ചിരിക്കുന്നു; ഉച്ചത്തിലുള്ള അപേക്ഷ ‘ഉറക്കെ വിളിച്ചുപറയാൻ തുടങ്ങി’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകിയിരിക്കുന്നു.
