id: MRK.10.24
reference: Mark 10:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: ml
  text: എന്നാൽ ശിഷ്യന്മാർ അവന്റെ വാക്കുകളിൽ വിസ്മയിച്ചുകൊണ്ടിരുന്നു. യേശു വീണ്ടും അവരോടു മറുപടി പറഞ്ഞു:[a] “മക്കളേ, ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുക എത്ര പ്രയാസമാണ്!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ ഇങ്ങനെ വായിക്കുന്നു: “മക്കളേ, സമ്പത്തിൽ ആശ്രയിക്കുന്നവർക്ക് ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുക എത്ര പ്രയാസമാണ്!”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: വിസ്മയിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലരൂപം ശിഷ്യന്മാരുടെ തുടർന്നുനിന്ന പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു; ‘വിസ്മയിച്ചുകൊണ്ടിരുന്നു’ ക്രിയയുടെ ശക്തിയും ദൈർഘ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: അവന്റെ വാക്കുകളിൽ
  rationale: ἐπί + ദത്തിവ് ഇവിടെ അവരുടെ വിസ്മയത്തിന്റെ ആധാരമോ വിഷയമോ സൂചിപ്പിക്കുന്നു; ‘അവന്റെ വാക്കുകളിൽ’ സംക്ഷിപ്തവും ഗ്രീക്കിനോട് അടുത്തതുമാണ്.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തിച്ചോ പുതുതായി തുടർന്നോ സംസാരിക്കുന്നതിനെ πάλιν സൂചിപ്പിക്കുന്നു; ‘വീണ്ടും’ ആ ആഖ്യാനബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀποκριθεὶς λέγει
  choice: അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘ഉത്തരം നൽകി പറയുന്നു’ എന്ന ആഖ്യാനപ്രയോഗം മലയാളത്തിൽ അക്ഷരാർഥമായി നൽകിയാൽ കൃത്രിമമാകും. സന്ദർഭത്തിൽ മുൻപ്രതികരണത്തോടുള്ള മറുപടി ‘വീണ്ടും അവരോടു പറഞ്ഞു’ എന്ന സ്വാഭാവിക രൂപത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: Τέκνα
  choice: മക്കളേ
  rationale: τέκνα സ്നേഹവും അടുപ്പവും പ്രകടിപ്പിക്കുന്ന അഭിസംബോധനയാണ്. ‘മക്കളേ’ ഉടമസ്ഥസൂചന ചേർക്കാതെ ആ ഊഷ്മളത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πῶς δύσκολόν ἐστιν
  choice: എത്ര പ്രയാസമാണ്
  rationale: πῶς ഇവിടെ ആശ്ചര്യസൂചകമായി തീവ്രത നൽകുന്നു; ‘എത്ര പ്രയാസമാണ്’ ആ ഊന്നലും δύσκολον എന്നതിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുക
  rationale: ഇത് പ്രയാസമുള്ള കാര്യം എന്തെന്ന് വ്യക്തമാക്കുന്ന അനന്തരൂപഘടകമാണ്; ‘ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുക’ വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: ‘സമ്പത്തിൽ ആശ്രയിക്കുന്നവർക്ക്’ എന്ന ദീർഘവായന മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തണമോ എന്നത്
  choice: SBLGNT-യിലെ ഹ്രസ്വവായനയായ ‘ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുക എത്ര പ്രയാസമാണ്’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
  alternative: ‘മക്കളേ, സമ്പത്തിൽ ആശ്രയിക്കുന്നവർ ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുക എത്ര പ്രയാസമാണ്!’
  rationale: നൽകപ്പെട്ട മൂലഭാഷാപാഠം ഹ്രസ്വവായനയാണ്. ദീർഘവായന പ്രസ്താവനയുടെ പരിധി സമ്പത്തിൽ ആശ്രയിക്കുന്നവരിലേക്ക് ചുരുക്കുന്നതിനാൽ വ്യാഖ്യാനപരമായ ഭേദം സൃഷ്ടിക്കുന്നു; അതിനെ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ പാഠഭേദമായി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘മക്കളേ’ എന്ന അഭിസംബോധന യേശുവിന്റെ സ്നേഹപൂർവമായ സ്വരം നിലനിർത്തുന്നു. ഹ്രസ്വവായനയിലെ ശക്തമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു.
