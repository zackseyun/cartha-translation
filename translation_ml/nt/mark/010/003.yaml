id: MRK.10.3
reference: Mark 10:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു മറുപടി പറഞ്ഞു: “മോശെ നിങ്ങളോട് എന്താണ് കല്പിച്ചത്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പരീക്ഷണചോദ്യത്തോടുള്ള സംഭാഷണപരമായ തിരിവും നേരിയ വൈരുധ്യവും സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമായി δέ ഇവിടെ പ്രവർത്തിക്കുന്നു.
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ഈ പതിവ് പ്രയോഗത്തിന്റെ പ്രതികരണസ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, അനാവശ്യ ആവർത്തനമില്ലാത്ത സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: പറച്ചിലിന്റെ അഭിസംബോധിതരെ സൂചിപ്പിക്കുന്ന പരോക്ഷ കർമം മലയാളത്തിൽ ‘അവരോടു’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Τί
  choice: എന്താണ്
  rationale: മോശെ നൽകിയ കല്പനയുടെ ഉള്ളടക്കം ചോദിക്കുന്ന നേരിട്ടുള്ള ചോദ്യത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ὑμῖν
  choice: നിങ്ങളോട്
  rationale: കല്പനയുടെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന ദത്തിവ് സർവനാമം മലയാളത്തിൽ ‘നിങ്ങളോട്’ എന്നു നൽകുന്നു.
- source_word: ἐνετείλατο
  choice: കല്പിച്ചത്
  rationale: ἐντέλλομαι എന്ന പദത്തിലെ അധികാരപൂർവമായ നിയമനിർദേശത്തിന്റെ ഭാവം ‘കല്പിക്കുക’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Μωϋσῆς
  choice: മോശെ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ വ്യാപകവും ആധുനിക വായനക്കാർക്ക് പരിചിതവുമായ രൂപം.
theological_decisions:
- issue: യേശുവിന്റെ മറുപടിയിലെ മോശെയുടെ അധികാരത്തെക്കുറിച്ചുള്ള പരാമർശം
  choice: 'മനുഷ്യ മധ്യസ്ഥനായ മോശെയുടെ പേര് മാത്രമായി നിലനിർത്തി: ‘മോശെ നിങ്ങളോട് എന്താണ് കല്പിച്ചത്?’'
  alternative: ‘മോശെയുടെ ന്യായപ്രമാണം നിങ്ങളോട് എന്താണ് കല്പിക്കുന്നത്?’ / ‘മോശെയിലൂടെ ദൈവം നിങ്ങളോട് എന്താണ് കല്പിച്ചത്?’
  rationale: ഗ്രീക്ക് മൂലപാഠം മോശെയെ വ്യക്തമായി പേരെടുത്തുപറയുന്നു; ‘ന്യായപ്രമാണം’ എന്നോ ‘മോശെയിലൂടെ ദൈവം’ എന്നോ വിശദീകരിക്കുന്നില്ല. അതിനാൽ പാഠത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. നിയമപരമായ അധികാരഭാവം നിലനിർത്താൻ ‘കല്പിച്ചു’ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ പ്രതികരണപ്രയോഗം ചുരുക്കാതെ സ്വാഭാവികമായി ‘മറുപടി പറഞ്ഞു’ എന്നു നൽകി.
