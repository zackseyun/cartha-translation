id: MRK.10.17
reference: Mark 10:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: ml
  text: 'അവൻ വഴിയിലേക്കു പുറപ്പെടുമ്പോൾ[a], ഒരാൾ ഓടിവന്ന് അവന്റെ മുമ്പിൽ മുട്ടുകുത്തി ചോദിച്ചു: “നല്ല ഗുരുവേ, നിത്യജീവൻ അവകാശമായി ലഭിക്കാൻ ഞാൻ എന്തു ചെയ്യണം?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ യാത്ര പുറപ്പെടുമ്പോൾ.” ഗ്രീക്ക് പ്രയോഗം വഴിയിലേക്കു പോകുന്നതിനെയോ യാത്ര ആരംഭിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: അവൻ വഴിയിലേക്കു പുറപ്പെടുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് പ്രധാന സംഭവത്തോടൊപ്പം നടക്കുന്ന പശ്ചാത്തലപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. εἰς ὁδόν എന്നത് വഴിയിലേക്കു പോകുന്നതായോ യാത്ര പുറപ്പെടുന്നതായോ മനസ്സിലാക്കാം; പ്രധാന പാഠം ചലനവും ദൃശ്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: προσδραμὼν
  choice: ഓടിവന്ന്
  rationale: ആ മനുഷ്യന്റെ വേഗവും അടിയന്തരതയും ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: εἷς
  choice: ഒരാൾ
  rationale: ഇവിടെ εἷς നാമപ്രയോഗമായി ഒരു വ്യക്തിയെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘ഒരാൾ’ ലിംഗം അനാവശ്യമായി ആവർത്തിക്കാതെ വ്യക്തിത്വം നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗമാണ്; സന്ദർഭത്തിൽ ആ വ്യക്തി പുരുഷനാണെന്നത് തുടർന്നുള്ള വിവരണത്തിൽ വ്യക്തമാണ്.
- source_word: γονυπετήσας αὐτόν
  choice: അവന്റെ മുമ്പിൽ മുട്ടുകുത്തി
  rationale: ആദരവോടെയോ അപേക്ഷാഭാവത്തോടെയോ മുട്ടുകുത്തുന്ന ശരീരഭാവം നേരിട്ട് വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലുള്ളതിലധികം തീവ്രത ചേർക്കുന്നില്ല.
- source_word: ἐπηρώτα αὐτόν
  choice: ചോദിച്ചു
  rationale: ഇംപർഫെക്റ്റിന് തുടരുന്ന പ്രവൃത്തിയുടെ ഭാവമുണ്ടാകാമെങ്കിലും, ഈ കഥനസന്ദർഭത്തിൽ മലയാളത്തിലെ ലളിത ഭൂതകാലം ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: Διδάσκαλε ἀγαθέ
  choice: നല്ല ഗുരുവേ
  rationale: διδάσκαλος എന്ന അധ്യാപകപദവിയും ἀγαθός എന്ന വിശേഷണവും നേരിട്ട് നിലനിർത്തുന്നു; അടുത്ത വാക്യത്തിലെ മറുപടിക്ക് പ്രാധാന്യമുള്ള ‘നല്ല’ എന്ന പദം സംരക്ഷിക്കുന്നു.
- source_word: τί ποιήσω
  choice: ഞാൻ എന്തു ചെയ്യണം
  rationale: ആവശ്യമായ പ്രവൃത്തി ഏതെന്ന ആലോചനാത്മക ചോദ്യത്തിന്റെ പ്രായോഗിക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἵνα ζωὴν αἰώνιον κληρονομήσω
  choice: നിത്യജീവൻ അവകാശമാക്കാൻ
  rationale: ἵναയുടെ ഉദ്ദേശബന്ധം ഇൻഫിനിറ്റീവ് ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; κληρονομέωയുടെ അവകാശം ലഭിക്കുക എന്ന അർത്ഥം ‘നേടുക’ എന്നതിലേക്കു പരത്താതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള അഭിസംബോധന
  choice: നല്ല ഗുരുവേ
  alternative: നല്ല യജമാനനേ
  rationale: ഗ്രീക്കിൽ διδάσκαλε ആണ്, κύριε അല്ല. അതിനാൽ മൂലപാഠം പറയുന്നതിലും ശക്തമായ അധികാരപദവി ചേർക്കാതെ ‘ഗുരു’ ഉപയോഗിക്കുകയും അടുത്ത വാക്യത്തിലെ സംവാദത്തിന് നിർണായകമായ ‘നല്ല’ നിലനിർത്തുകയും ചെയ്തു.
- issue: κληρονομήσω എന്നതിലെ അവകാശഭാഷ
  choice: അവകാശമാക്കാൻ
  alternative: നേടാൻ
  rationale: ‘അവകാശമാക്കുക’ അവകാശിയായി ലഭിക്കുന്നതെന്ന ഗ്രീക്ക് പദത്തിന്റെ രൂപകവും ദൈവശാസ്ത്രപരമായ ഭാവവും സംരക്ഷിക്കുന്നു; അത് മനുഷ്യപ്രവൃത്തിയാൽ സമ്പാദിക്കുന്നുവെന്ന ആശയം പരിഭാഷ തന്നെ തീർപ്പാക്കുന്നില്ല.
- issue: εἷς എന്ന പദത്തിന്റെ അവതരണം
  choice: ഒരാൾ
  alternative: ഒരു മനുഷ്യൻ
  rationale: ഗ്രീക്ക് രൂപം പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും, ഒരു വ്യക്തിയെ കഥയിൽ അവതരിപ്പിക്കാൻ ആധുനിക മലയാളത്തിൽ ‘ഒരാൾ’ സ്വാഭാവികമാണ്. ഇത് ആ വ്യക്തിയുടെ ലിംഗത്തെ നിഷേധിക്കുന്നില്ല; അതേസമയം അസ്വാഭാവികമായ ലിംഗചൂണ്ടൽ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് സുലഭവുമായ മലയാളം. കഥനത്തിന്റെ വേഗം നിലനിർത്താൻ ‘ഓടിവന്ന്’, ‘മുട്ടുകുത്തി’, ‘ചോദിച്ചു’ എന്നീ ക്രിയകൾ നേരിട്ടുള്ള ക്രമത്തിൽ നൽകിയിരിക്കുന്നു. യഥാർത്ഥ ഗ്രീക്ക് പ്രയോഗത്തിലെ യാത്ര/വഴി എന്ന ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
