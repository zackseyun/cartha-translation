id: MRK.10.15
reference: Mark 10:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: ml
  text: '“സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ദൈവരാജ്യത്തെ ഒരു കുട്ടിയെപ്പോലെ[a] സ്വീകരിക്കാത്തവൻ അതിൽ തീർച്ചയായും പ്രവേശിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു കുട്ടിയായി” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പ്രയോഗം കുട്ടിസദൃശമായ വിനയം, വിശ്വാസം, അല്ലെങ്കിൽ ആശ്രിതത്വം എന്നിവയെ സൂചിപ്പിക്കാം; എന്നാൽ ഗ്രീക്ക് വാക്യം ഏത് സൂക്ഷ്മാർഥമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: ഗൗരവവും ആധികാരികതയും നിറഞ്ഞ വചനത്തിന്റെ ആമുഖശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഇവിടെ ഗ്രീക്കിൽ ഒറ്റ ἀμήν മാത്രമാണുള്ളത്.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: വർത്തമാനകാല ക്രിയയെയും ദ്വിതീയപുരുഷ ബഹുവചന സർവനാമത്തെയും നേരിട്ടും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὃς ἂν
  choice: ആരായാലും / ...വൻ
  rationale: ബന്ധസർവനാമത്തോടുകൂടിയ ἄν നൽകുന്ന അനിശ്ചിതവും സാമാന്യവുമായ അർഥം മലയാളത്തിലെ നിഷേധാത്മക ബന്ധവാക്യമായ ‘സ്വീകരിക്കാത്തവൻ’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: μὴ δέξηται
  choice: സ്വീകരിക്കാത്തവൻ
  rationale: δέχομαι എന്നതിലെ സ്വീകരിക്കൽ/കൈക്കൊള്ളൽ എന്ന ആശയം നിലനിർത്തുന്നു; ദൈവരാജ്യം മനുഷ്യൻ നേടിയെടുക്കുന്നതല്ല, സ്വീകരിക്കുന്നതാണ് എന്ന രൂപകം അനാവശ്യമായി വിശദീകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തെ
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ സ്ഥിരവും പരിചിതവുമായ പ്രയോഗം; ദൈവത്തിന്റെ ഭരണവും രാജ്യവും ഉൾക്കൊള്ളുന്ന ഉറവിടപദത്തിന്റെ വ്യാപ്തി അമിതമായി ചുരുക്കുന്നില്ല.
- source_word: ὡς παιδίον
  choice: ഒരു കുട്ടിയെപ്പോലെ
  rationale: ὡς എന്ന ഉപമാസൂചനയും παιδίον എന്ന സാധാരണ നാമവും വ്യക്തമായി നൽകുന്നു; വിനയം, വിശ്വാസം, ആശ്രിതത്വം എന്നിവയിൽ ഏതെങ്കിലും ഒന്നിനെ മാത്രം നിർണ്ണയിക്കുന്നില്ല.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: തീർച്ചയായും പ്രവേശിക്കുകയില്ല
  rationale: οὐ μή കൂടിയ aorist subjunctive-ന്റെ ശക്തമായ നിഷേധം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἰς αὐτήν
  choice: അതിൽ
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം ദൈവരാജ്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഒരു രാജ്യത്തിൽ ‘പ്രവേശിക്കുക’ എന്നത് സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ദൈവരാജ്യത്തെ ‘ഒരു കുട്ടിയെപ്പോലെ’ സ്വീകരിക്കുക എന്നതിന്റെ അർഥം
  choice: ഉപമയെ വിശദീകരിക്കാതെ തുറന്ന നിലയിൽ നിലനിർത്തുക
  alternative: കുട്ടിയുടെ വിനയത്തോടെ / വിശ്വാസത്തോടെ / ആശ്രിതത്വത്തോടെ സ്വീകരിക്കുക
  rationale: ഗ്രീക്ക് വാക്യം താരതമ്യം വ്യക്തമാക്കുന്നുവെങ്കിലും ഉദ്ദേശിക്കുന്ന കുട്ടിസദൃശ ഗുണം ഏതെന്ന് നിർവചിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക വ്യാഖ്യാനപാരമ്പര്യം പാഠത്തിൽ ചേർക്കാതെ ഉറവിടത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്നത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സത്യമായി’, ‘ദൈവരാജ്യം’, ‘തീർച്ചയായും പ്രവേശിക്കുകയില്ല’ എന്നീ രൂപങ്ങൾ വചനത്തിന്റെ ഗൗരവവും ഊന്നലും നിലനിർത്തുന്നു. അടിക്കുറിപ്പിന്റെ സൂചകം ബന്ധപ്പെട്ട ഉപമയ്ക്കു പിന്നാലെയല്ല, വാക്യാവസാനത്ത് നൽകിയിട്ടുണ്ടെങ്കിലും പ്രധാനപാഠത്തിൽ വ്യക്തമായി ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
