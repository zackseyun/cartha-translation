  terminology: “കുട്ടികൾ,” “ദൈവരാജ്യം,” and “ഇങ്ങനെയുള്ളവരുടേതാണ്” are suitable. The latter preserves the generic/representative reference without adding claims about children’s innocence or salvation. The footnote is unnecessary because it merely repeats the main-text wording and does not provide a meaningful lexical alternative.
