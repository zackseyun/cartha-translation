id: MRK.10.14
reference: Mark 10:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു ഇതു കണ്ടപ്പോൾ നീരസപ്പെട്ടു അവരോടു പറഞ്ഞു: “കുട്ടികൾ എന്റെ അടുക്കൽ വരാൻ അനുവദിക്കൂ; അവരെ തടയരുത്. കാരണം ദൈവരാജ്യം ഇങ്ങനെയുള്ളവരുടേതാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: എന്നാൽ യേശു ഇതു കണ്ടപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ ശിഷ്യന്മാരുടെ ശാസനയോടുള്ള മൃദുവായ വൈരുധ്യം δὲ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന പ്രവൃത്തിയെ മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘ഇതു’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἠγανάκτησεν
  choice: രോഷാകുലനായി
  rationale: ശക്തമായ അതൃപ്തിയും ധാർമിക രോഷവും പ്രകടിപ്പിക്കുന്ന പദം; നിയന്ത്രണമില്ലാത്ത കോപം എന്ന അതിശയോക്തി ഒഴിവാക്കുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സാധാരണ സംഭാഷണസൂത്രത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: കുട്ടികൾ എന്റെ അടുക്കൽ വരാൻ അനുവദിക്കൂ
  rationale: Ἄφετε ഇവിടെ അനുവദിക്കുക എന്ന ആജ്ഞയാണ്; παιδίαയെ അടിസ്ഥാന അർഥമായ ‘കുട്ടികൾ’ എന്നു നൽകുന്നു, മൂലത്തിൽ നിർബന്ധമില്ലാത്ത ചെറുപ്പസൂചന ചേർക്കുന്നില്ല.
- source_word: μὴ κωλύετε αὐτά
  choice: അവരെ തടയരുത്
  rationale: പ്രവേശനം തടസ്സപ്പെടുത്തരുതെന്ന നേരിട്ടുള്ള ആജ്ഞയെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: കാരണം ... ഇങ്ങനെയുള്ളവരുടേതാണ്
  rationale: τοιούτων ഈ കുട്ടികളെ പ്രതിനിധികളാക്കി ‘ഇത്തരത്തിലുള്ളവർ’ എന്നു സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയുടെ അർഥം മലയാളത്തിൽ ഉടമസ്ഥതാസൂചകമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: സ്ഥാപിതവും സുതാര്യവുമായ ബൈബിൾപ്രയോഗം; ദൈവത്തിന്റെ രാജത്വം/ഭരണം ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ ആശയം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: ‘ഇങ്ങനെയുള്ളവരുടേതാണ് ദൈവരാജ്യം’ എന്നതിന്റെ വ്യാപ്തി
  choice: സന്നിഹിതരായ കുട്ടികളെ മാത്രം അല്ല, അവരെപ്പോലെയുള്ളവരെ പ്രതിനിധിപരമായി സൂചിപ്പിക്കുന്ന വായന
  alternative: വാക്ക് അക്ഷരാർഥത്തിൽ ‘ഇങ്ങനെയുള്ളവരുടേതാണ് ദൈവരാജ്യം’ എന്ന ഘടനയിൽ വിടുക, അല്ലെങ്കിൽ അത് കുട്ടികൾക്കു മാത്രമാണെന്നു വായിക്കുക
  rationale: τοιούτων എന്നത് സ്വാഭാവികമായി ‘ഇത്തരത്തിലുള്ളവർ’ എന്നാണ്. കുട്ടികളുടെ നിരപരാധിത്വം, രക്ഷ, അല്ലെങ്കിൽ മറ്റു ഉപദേശപരമായ നിഗമനങ്ങൾ വാക്യം വ്യക്തമായി പ്രസ്താവിക്കാത്തതിനാൽ അവ വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള ആജ്ഞകളുടെ ശക്തി നിലനിർത്തുകയും, മൂലത്തിൽ ഇല്ലാത്ത ശിശുസ്വഭാവം, നിരപരാധിത്വം, രക്ഷ എന്നിവയെക്കുറിച്ചുള്ള വ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്തു.
