  text: ἀπὸ δὲ ἀρχῆς κτίσεως ἄρσεν καὶ θῆλυ ἐποίησεν ⸀αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/006.yaml
  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: ml
  text: എന്നാൽ സൃഷ്ടിയുടെ ആരംഭം മുതൽ അവരെ ആണും പെണ്ണുമായി ഉണ്ടാക്കി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരെ ആണും പെണ്ണുമായി സൃഷ്ടിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഗ്രീക്കിലെ ക്രിയയുടെ നേരിട്ടുള്ള അർത്ഥം ‘ഉണ്ടാക്കി’ എന്നാണ്; ‘സൃഷ്ടിച്ചു’ എന്നത് ജനനപുസ്തകത്തിലെ പശ്ചാത്തലം പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക് പദക്രമത്തോട് കൂടുതൽ അടുത്തതായി: ‘ആണും പെണ്ണുമായി അവരെ ഉണ്ടാക്കി.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ
  choice: മുതൽ
  rationale: ഇവിടെ കാലത്തിലെ ആരംഭബിന്ദുവാണ് സൂചിപ്പിക്കുന്നത്; ‘ആരംഭംമുതൽ’ എന്നത് സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: വിവാഹമോചനത്തെക്കുറിച്ചുള്ള മുൻപ്രസ്താവനയ്ക്കു വിരുദ്ധമായി സൃഷ്ടിയിലെ ആദിമക്രമത്തിലേക്കു തിരിയുന്നതിനാൽ വൈരുധ്യഭാവം നിലനിർത്തുന്നു.
- source_word: ἀρχῆς κτίσεως
  choice: സൃഷ്ടിയുടെ ആരംഭം
  rationale: ജനനപുസ്തക പശ്ചാത്തലം അനാവശ്യമായി വികസിപ്പിക്കാതെ ‘സൃഷ്ടിയുടെ ആരംഭം’ എന്ന ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἄρσεν καὶ θῆλυ
  choice: ആണും പെണ്ണുമായി
  rationale: മൂലപാഠത്തിലെ ജൈവ-സൃഷ്ടിപരമായ ജോടിയെ ‘പുരുഷനും സ്ത്രീയും’ എന്ന സാമൂഹികമോ ബന്ധപരമോ ആയ പദങ്ങളിലേക്കു മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐποίησεν
  choice: ഉണ്ടാക്കി
  rationale: ποιέω എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘ഉണ്ടാക്കുക’ എന്ന അർത്ഥം നിലനിർത്തുന്നു; ജനനപുസ്തക പശ്ചാത്തലത്തെ ആശ്രയിച്ച് അതിനെ നേരിട്ട് ‘സൃഷ്ടിച്ചു’ എന്നു മാറ്റുന്നില്ല.
- source_word: αὐτούς
  choice: അവരെ
  rationale: മൂലപാഠത്തിലെ ബഹുവചന സർവനാമം അധിക ഊന്നൽ ചേർക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ജനനപുസ്തക ഉദ്ധരണിയിലെ ലിംഗപദങ്ങളുടെ പരിഭാഷ
  choice: ആണും പെണ്ണുമായി
  alternative: പുരുഷനും സ്ത്രീയുമായി
  rationale: ἄρσεν, θῆλυ എന്നീ പദങ്ങൾ സൃഷ്ടിയിലെ ആൺ-പെൺ വ്യത്യാസത്തെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്; പിന്നീടുള്ള സാമൂഹികമോ ബന്ധപരമോ ആയ വിഭാഗങ്ങൾ ചേർക്കാതെ ആ ഭാവം നിലനിർത്തുന്നു.
- issue: ക്രിയയുടെ ദൈവിക കർത്താവ്
  choice: മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമാക്കാതെ ‘ഉണ്ടാക്കി’
  alternative: ദൈവം അവരെ ഉണ്ടാക്കി / അവൻ അവരെ ഉണ്ടാക്കി
  rationale: ഗ്രീക്കിൽ കർത്താവ് സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കപ്പെടുന്നതാണ്; ‘ദൈവം’ എന്നു ചേർക്കുന്നത് വ്യാഖ്യാനപരമായ വിപുലീകരണവും ‘അവൻ’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമായ സർവനാമപ്രയോഗവുമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആരംഭംമുതൽ’ എന്ന ചേർത്തെഴുത്ത് സ്വാഭാവിക കാലപ്രയോഗമാണ്. മുഖ്യവാചകത്തിൽ മലയാളത്തിന് സ്വാഭാവികമായ കർമം–പൂരകം–ക്രിയ ക്രമം സ്വീകരിച്ചു; ഗ്രീക്ക് പദക്രമം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
