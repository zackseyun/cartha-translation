  text: οἱ δὲ εἶπαν· ⸂Ἐπέτρεψεν Μωϋσῆς⸃ βιβλίον ἀποστασίου γράψαι καὶ ἀπολῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “വിവാഹമോചനപത്രം[a] എഴുതി അവളെ വിട്ടയയ്ക്കാൻ[b] മോശെ അനുവദിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിവാഹമോചനരേഖ.’ ഗ്രീക്ക് പ്രയോഗം വിവാഹമോചനത്തിനുള്ള എഴുത്തുപരമായ നിയമരേഖയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവളെ വിവാഹമോചനം ചെയ്യാൻ.’ അക്ഷരാർഥത്തിൽ ‘അവളെ വിട്ടയയ്ക്കാൻ’; ഇവിടെ വിവാഹമോചനസന്ദർഭത്തിലാണ് ഈ പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: അവർ പറഞ്ഞു
  rationale: മുമ്പ് പരാമർശിച്ച പരീശന്മാരെയാണ് നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് നിർദേശകം സൂചിപ്പിക്കുന്നത്. δέ ഇവിടെ സംഭാഷണത്തിന്റെ തുടർച്ചയെയോ നേരിയ വൈരുധ്യത്തെയോ അടയാളപ്പെടുത്തുന്നു; സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ ‘അവർ പറഞ്ഞു’ എന്നു നൽകുന്നത് മതിയാകും.
- source_word: Ἐπέτρεψεν
  choice: അനുവദിച്ചു
  rationale: ἐπιτρέπω അനുമതി നൽകുക എന്നർഥമാണ്. തുടർന്നുള്ള സന്ദർഭത്തിൽ അനുമതിയും കല്പനയും തമ്മിലുള്ള വ്യത്യാസം നിർണായകമായതിനാൽ ‘അനുവദിച്ചു’ എന്നു കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: Μωϋσῆς
  choice: മോശെ
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സ്വാഭാവികവുമായ വ്യക്തിനാമരൂപം.
- source_word: βιβλίον ἀποστασίου
  choice: വിവാഹമോചനപത്രം
  rationale: ആവർത്തനം 24:1-ൽ സൂചിപ്പിക്കുന്ന ഔപചാരികമായ എഴുത്തുരേഖയാണിത്. ‘വിവാഹമോചനപത്രം’ ആ നിയമപരമായ അർഥം വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: γράψαι
  choice: എഴുതിക്കൊടുത്ത്
  rationale: γράψαι എന്നത് ‘എഴുതുക’ എന്നാണ്. മലയാളത്തിൽ നിയമരേഖ സ്ത്രീക്ക് നൽകി വേർപിരിയുന്ന നടപടിയെ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എഴുതിക്കൊടുത്ത്’ എന്നു നൽകുന്നു; ‘കൊടുത്ത്’ എന്ന ആശയം സന്ദർഭത്തിൽ നിന്ന് പൂരിപ്പിച്ചതാണ്.
- source_word: καὶ ἀπολῦσαι
  choice: അവളെ പറഞ്ഞയയ്ക്കാൻ
  rationale: വിവാഹസന്ദർഭത്തിൽ ἀπολύω ഭാര്യയെ വിട്ടയയ്ക്കുക അഥവാ വിവാഹമോചനം ചെയ്യുക എന്നാണ്. ‘പറഞ്ഞയയ്ക്കാൻ’ എന്നത് ഗ്രീക്കിലെ വിടുതൽ/അയയ്ക്കൽ ദൃശ്യഭാവം നിലനിർത്തുന്നു; സ്ത്രീലിംഗ കർമം ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ നിന്ന് മലയാളത്തിൽ ‘അവളെ’ ചേർക്കുന്നു.
theological_decisions:
- issue: വിവാഹമോചനനിയമത്തിൽ മോശെയുടെ നിർദേശത്തിന്റെ സ്വഭാവം
  choice: മോശെ വിവാഹമോചനം അനുവദിച്ചു
  alternative: മോശെ വിവാഹമോചനപത്രം എഴുതാൻ കല്പിച്ചു
  rationale: Ἐπέτρεψεν എന്ന ക്രിയ വ്യക്തമായി അനുമതിയെയാണ് സൂചിപ്പിക്കുന്നത്, കല്പനയെയല്ല. മനുഷ്യരുടെ ഹൃദയകാഠിന്യം നിമിത്തമുള്ള ഇളവും ദൈവത്തിന്റെ സൃഷ്ട്യുദ്ദേശ്യവും യേശു വേർതിരിക്കുന്ന ഉടൻതുടർന്നുള്ള സന്ദർഭത്തിന് ഈ വ്യത്യാസം പ്രധാനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും മാന്യമായും വായിക്കാവുന്ന ശൈലി. നിയമപരമായ സൂക്ഷ്മതയ്ക്കായി ‘വിവാഹമോചനപത്രം,’ അനുമതി-കല്പന വ്യത്യാസത്തിനായി ‘അനുവദിച്ചു,’ മൂലത്തിലെ ദൃശ്യഭാവത്തിനായി ‘പറഞ്ഞയയ്ക്കാൻ’ എന്നിവ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
