revisions:
- from: 'അവൻ അവരോടു പറയുന്നു: “സ്വന്തം ഭാര്യയെ ഉപേക്ഷിച്ച് മറ്റൊരു സ്ത്രീയെ വിവാഹം കഴിക്കുന്നവൻ അവൾക്കെതിരായി വ്യഭിചാരം ചെയ്യുന്നു.”'
  to: 'അവൻ അവരോടു പറയുന്നു: “സ്വന്തം ഭാര്യയുമായി വിവാഹമോചനം ചെയ്ത് മറ്റൊരു സ്ത്രീയെ വിവാഹം കഴിക്കുന്നവൻ ആ ഭാര്യക്കെതിരായി വ്യഭിചാരം ചെയ്യുന്നു.”'
  rationale: The revision replaces the semantically broad ‘ഉപേക്ഷിച്ച്’ with the precise modern term ‘വിവാഹമോചനം ചെയ്ത്.’ It also makes ‘her’ explicit as ‘ആ ഭാര്യ’ to ensure that the offense is understood as directed against the first wife, corresponding to ἐπ’ αὐτήν. No footnote is needed, since ‘മറ്റൊരു സ്ത്രീ’ already expresses the feminine referent of ἄλλην.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the Markan historical present ('പറയുന്നു'), the indefinite general condition, the explicit reference to another woman, and the force of ἐπ’ αὐτήν as an offense against the divorced wife. However, 'ഉപേക്ഷിച്ച്' can mean abandoning or leaving and does not reliably convey the marital/legal sense of ἀπολύσῃ in this context.
  naturalness: The sentence is otherwise clear and idiomatic modern standard Malayalam. Replacing 'ഉപേക്ഷിച്ച്' with 'വിവാഹമോചനം ചെയ്ത്' makes the intended meaning precise without making the phrasing unnatural.
  terminology: ‘വിവാഹമോചനം ചെയ്യുക’ is the suitable contemporary Malayalam term for divorce. ‘വ്യഭിചാരം ചെയ്യുന്നു’ accurately renders μοιχᾶται. ‘ആ ഭാര്യക്കെതിരായി’ clarifies the antecedent of αὐτήν while retaining the Greek’s emphasis.
  issues:
  - severity: medium
    issue: ‘ഉപേക്ഷിച്ച്’ is used for ἀπολύσῃ.
    rationale: In Malayalam, ‘ഉപേക്ഷിക്കുക’ commonly means abandon, forsake, or leave; it can obscure the specific divorce sense required by the marital context and by the source’s legal-relational action.
  revised_text: 'അവൻ അവരോടു പറയുന്നു: “സ്വന്തം ഭാര്യയുമായി വിവാഹമോചനം ചെയ്ത് മറ്റൊരു സ്ത്രീയെ വിവാഹം കഴിക്കുന്നവൻ ആ ഭാര്യക്കെതിരായി വ്യഭിചാരം ചെയ്യുന്നു.”'
