id: MRK.10.11
reference: Mark 10:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറയുന്നു: “സ്വന്തം ഭാര്യയുമായി വിവാഹമോചനം ചെയ്ത് മറ്റൊരു സ്ത്രീയെ വിവാഹം കഴിക്കുന്നവൻ ആ ഭാര്യക്കെതിരായി വ്യഭിചാരം ചെയ്യുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ ആഖ്യാനത്തിൽ പതിവായ ഗ്രീക്ക് ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു; മലയാളത്തിലും ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: ദത്തിവ് സർവനാമത്തെ സ്വാഭാവികമായ പരോക്ഷ കർമമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Ὃς ἂν
  choice: …ചെയ്യുന്നവൻ
  rationale: അനിശ്ചിതവും പൊതുവുമായ വ്യവസ്ഥയെ മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യഘടനയിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπολύσῃ
  choice: ഉപേക്ഷിച്ച്
  rationale: വിവാഹസന്ദർഭത്തിൽ ഭാര്യയെ വിട്ടയക്കുകയോ വിവാഹബന്ധം വേർപെടുത്തുകയോ ചെയ്യുന്നതാണ് അർഥം; ‘ഉപേക്ഷിക്കുക’ നിയമപരവും ബന്ധപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: സ്വന്തം ഭാര്യയെ
  rationale: ഉടമസ്ഥസൂചനയും വിവാഹമോചനസന്ദർഭവും കാരണം γυνή ഇവിടെ ‘ഭാര്യ’ എന്നാണ്.
- source_word: γαμήσῃ ἄλλην
  choice: മറ്റൊരു സ്ത്രീയെ വിവാഹം കഴിക്കുന്നവൻ
  rationale: ἄλλην സ്ത്രീലിംഗമായതിനാൽ സൂചിപ്പിക്കപ്പെട്ട ‘സ്ത്രീ’ മലയാളത്തിൽ വ്യക്തമാക്കുന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: μοιχᾶται
  choice: വ്യഭിചാരം ചെയ്യുന്നു
  rationale: ഈ സന്ദർഭത്തിലെ ക്രിയയുടെ സാധാരണവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: ἐπ’ αὐτήν
  choice: അവൾക്കെതിരായി
  rationale: പ്രവൃത്തി ഉപേക്ഷിക്കപ്പെട്ട ഭാര്യയോടു ചെയ്യുന്ന അനീതിയാണെന്ന ദിശാത്മക/ബന്ധപരമായ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐπ’ αὐτήν എന്ന പ്രയോഗം ഭാര്യയ്ക്കെതിരെ ചെയ്ത തെറ്റിനെ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘അവൾക്കെതിരായി വ്യഭിചാരം ചെയ്യുന്നു’ എന്ന് നിലനിർത്തി
  alternative: ‘വ്യഭിചാരം ചെയ്യുന്നു’; ‘മറ്റേ സ്ത്രീയോടൊപ്പം വ്യഭിചാരം ചെയ്യുന്നു’
  rationale: ഗ്രീക്കിലുള്ള ἐπ’ αὐτήν ഒഴിവാക്കാതെ, ഭർത്താവിന്റെ നടപടി ഭാര്യയ്ക്കെതിരായ കുറ്റവുമാണെന്ന പാഠത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- issue: Ὃς ἂν എന്ന പൊതുവായ പുരുഷലിംഗ ഏകവചനത്തിന്റെ അവതരണം
  choice: ‘…ചെയ്യുന്നവൻ’ എന്ന പൊതുവ്യവസ്ഥാപരമായ ഘടന
  alternative: ‘ഏതൊരു പുരുഷനും’
  rationale: വ്യാകരണപരമായ പുരുഷലിംഗം മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുമ്പോഴും ‘ഏതൊരു പുരുഷനും’ എന്ന് അനാവശ്യമായി കൂടുതൽ ഊന്നുന്നില്ല; ‘സ്വന്തം ഭാര്യ’ ഉടൻതന്നെ സന്ദർഭം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ചരിത്രവർത്തമാനകാലം നിലനിർത്തി. ‘മറ്റൊരു സ്ത്രീ’ എന്ന് തുറന്നുപറയുന്നതിനാൽ ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പിന് മലയാളത്തിൽ ആവശ്യമില്ല.
