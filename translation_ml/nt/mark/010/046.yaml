id: MRK.10.46
reference: Mark 10:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: ml
  text: അവർ യെരീഹോവിൽ എത്തി[a]. അവൻ തന്റെ ശിഷ്യന്മാരോടും വലിയൊരു ജനക്കൂട്ടത്തോടും[b]കൂടെ യെരീഹോവിൽനിന്ന് പുറപ്പെട്ടുപോകുമ്പോൾ, തിമായിയുടെ മകനായ ബർത്തിമായി എന്ന അന്ധനായ യാചകൻ വഴിയരികിൽ[c] ഇരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘അവർ എത്തുന്നു’ എന്ന ചരിത്രവർത്തമാനകാലമാണ്; സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിക്കായി ഇവിടെ ഭൂതകാലം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഗണ്യമായൊരു ജനക്കൂട്ടം.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘പാതയുടെ സമീപത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: എത്തി
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, സംഭവവിവരണം സ്വാഭാവികമായ മലയാളത്തിൽ ഭൂതകാലത്തിൽ നൽകുന്നു; സംഭവക്രമവും ആഖ്യാനത്തിന്റെ ചലനവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: അവൻ ... പുറപ്പെട്ടുപോകുമ്പോൾ
  rationale: ഈ genitive absolute സമകാലികമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടുപോകുമ്പോൾ’ എന്നത് സമയബന്ധവും പുറത്തേക്കുള്ള ചലനവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ὄχλου ἱκανοῦ
  choice: വലിയൊരു ജനക്കൂട്ടം
  rationale: ഇവിടെ ἱκανός ജനക്കൂട്ടത്തിന്റെ ശ്രദ്ധേയമായ വലുപ്പത്തെ സൂചിപ്പിക്കുന്നു. ‘വലിയൊരു ജനക്കൂട്ടം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: തിമായിയുടെ മകനായ ബർത്തിമായി
  rationale: പേരും അതിന്റെ വിശദീകരണമായ പിതൃനാമബന്ധവും മൂലപാഠത്തിൽ ഉള്ളതുപോലെ നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമമാണ് സ്വീകരിച്ചത്.
- source_word: τυφλὸς
  choice: അന്ധനായ
  rationale: വിശേഷണത്തിന്റെ നേരിട്ടുള്ളതും സാധാരണവുമായ മലയാള പരിഭാഷ.
- source_word: προσαίτης
  choice: യാചകൻ
  rationale: ഭിക്ഷ യാചിച്ച് ജീവിക്കുന്നയാളെ സൂചിപ്പിക്കുന്ന വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളപദം.
- source_word: παρὰ τὴν ὁδόν
  choice: വഴിയരികിൽ
  rationale: παρά ഇവിടെ വഴിയോടു ചേർന്നുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു. ‘വഴിയരികിൽ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: Ἰεριχώ
  choice: യെരീഹോ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
theological_decisions:
- issue: ബർത്തിമായിയുടെ ആഖ്യാനപരമായ തിരിച്ചറിയൽ
  choice: ‘ബർത്തിമായി’ എന്ന പേരും ‘തിമായിയുടെ മകൻ’ എന്ന വിശദീകരണവും മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: പേരോ പിതൃനാമവിശദീകരണമോ ഒന്ന് മാത്രം നൽകുക.
  rationale: മൂലവാക്യം രണ്ടും നൽകുന്നതിനാൽ ഒന്നും ഒഴിവാക്കാതെ സൂക്ഷിക്കുന്നത് മാർക്കോസിന്റെ ആഖ്യാനവിശദാംശം പൂർണമായി നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ അധികനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പേരുകളും സ്ഥലനാമവും പരിചിതമായ മലയാളരൂപത്തിൽ നൽകിയിരിക്കുന്നു. നീണ്ട ഗ്രീക്ക് വാക്യഘടനയുടെ സമയബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ള ക്രമം സ്വീകരിച്ചു.
