  source_fidelity: 'ഗ്രീക്ക് വാക്യത്തിലെ സംഭവക്രമവും ബന്ധങ്ങളും വിശ്വസ്തമായി നിലനിർത്തിയിരിക്കുന്നു: അവർ യെരീഹോവിൽ എത്തുന്നു/എത്തി; യേശു ശിഷ്യന്മാരും ഗണ്യമായ ജനക്കൂട്ടവുമൊത്ത് യെരീഹോവിൽനിന്ന് പുറപ്പെടുമ്പോൾ ബർത്തിമായി വഴിയരികിൽ ഇരിക്കുകയായിരുന്നു. ‘തിമായിയുടെ മകനായ ബർത്തിമായി,’ ‘അന്ധനായ,’ ‘യാചകൻ’ എന്നിവ മൂലപാഠത്തിലെ തിരിച്ചറിയൽവിവരങ്ങൾ നഷ്ടപ്പെടുത്തുന്നില്ല.'
