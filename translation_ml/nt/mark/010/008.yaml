revisions:
- from: “ഇരുവരും ഒരു ശരീരമായിത്തീരും.” അതുകൊണ്ട് അവർ ഇനി രണ്ടല്ല, ഒരു ശരീരമാണ്.
  to: “ഇരുവരും ഒരു ദേഹമായിത്തീരും.” അതുകൊണ്ട് അവർ ഇനി രണ്ടല്ല, ഒരു ദേഹമാണ്.
  rationale: 'Only the recurring rendering of σάρξ has been adjusted, from “ശരീരം” to “ദേഹം,” to preserve the established Malayalam biblical expression and the Genesis echo. The future-result construction, duality, inference, and adversative conclusion remain unchanged. No footnote is required: the directional/resultative force of εἰς is adequately expressed by “ആയിത്തീരും.”'
  reviewer_model: gpt-5.6-terra
