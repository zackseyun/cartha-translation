id: MRK.10.8
reference: Mark 10:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: ml
  text: “ഇരുവരും ഒരു ദേഹമായിത്തീരും.” അതുകൊണ്ട് അവർ ഇനി രണ്ടല്ല, ഒരു ദേഹമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται
  choice: ആയിത്തീരും
  rationale: εἰμί എന്ന ക്രിയയുടെ ഭാവികാലരൂപമാണെങ്കിലും, εἰς + ദ്വിതീയാവിഭക്തി ഇവിടെ ഫലമായി ഉണ്ടാകുന്ന ഐക്യത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ ‘ആയിത്തീരും’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: οἱ δύο
  choice: ഇരുവരും
  rationale: ലേഖനത്തോടുകൂടിയ സംഖ്യാവാചകം വ്യക്തമായ ദ്വിത്വത്തെ ഊന്നുന്നു; ‘ഇരുവരും’ അത് സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς σάρκα μίαν
  choice: ഒരു ശരീരമായിത്തീരും
  rationale: εἰς സൂചിപ്പിക്കുന്ന ഫലാവസ്ഥ ‘ആയിത്തീരും’ എന്ന ക്രിയയിൽ ഉൾക്കൊള്ളുന്നു. ‘ഒരു ശരീരം’ എന്ന തിരുവെഴുത്തുപരമായ വിവാഹപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: σάρκα / σάρξ
  choice: ശരീരം
  rationale: ഇവിടെ σάρξ പാപസ്വഭാവമല്ല, ഉല്പത്തി ഉദ്ധരണിയിലെ ദാമ്പത്യ ഐക്യപ്രയോഗമാണ്. ആധുനിക മലയാളത്തിൽ ‘ഒരു ശരീരം’ ഈ പ്രയോഗം വ്യക്തവും മാന്യവുമായി അറിയിക്കുന്നു.
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള ഫലമോ നിഗമനമോ അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐκέτι
  choice: ഇനി ... അല്ല
  rationale: മുമ്പുണ്ടായിരുന്ന അവസ്ഥ അവസാനിച്ചതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀλλὰ μία σάρξ
  choice: ഒരു ശരീരമാണ്
  rationale: ‘രണ്ടല്ല’ എന്നതിനോടുള്ള ശക്തമായ വിരോധം നിലനിർത്തുകയും ഉല്പത്തി ഉദ്ധരണിയുടെ പ്രധാന പ്രയോഗം ആവർത്തിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശു ഉദ്ധരിക്കുന്ന ‘ഒരു ശരീരം’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: വ്യാഖ്യാനവിപുലീകരണം കൂടാതെ ‘ഒരു ശരീരം’ എന്ന് നിലനിർത്തുക
  alternative: ഒരു വ്യക്തി; ലൈംഗികമായി ഒന്നായവർ; ഒരേ ദേഹം
  rationale: ഈ പ്രയോഗത്തിന് ദാമ്പത്യപരവും ഉടമ്പടിപരവും മാനവശാസ്ത്രപരവുമായ വ്യാപ്തിയുണ്ട്; വാക്യം അതിനെ ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ സമൃദ്ധിയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. εἰς എന്നതിന്റെ ദിശാത്മക ഭാവം ‘ആയിത്തീരും’ എന്നതിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തിയതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
