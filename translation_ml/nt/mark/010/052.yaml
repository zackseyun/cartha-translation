id: MRK.10.52
reference: Mark 10:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “പോകുക; നിന്റെ വിശ്വാസം[c] നിന്നെ രക്ഷിച്ചിരിക്കുന്നു[a].” ഉടൻതന്നെ അവന് കാഴ്ച തിരിച്ചുകിട്ടി; അവൻ വഴിയിൽ[b] യേശുവിനെ അനുഗമിച്ചുകൊണ്ടിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിന്നെ സൗഖ്യമാക്കിയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘നിന്നെ സുഖപ്പെടുത്തിയിരിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് സൗഖ്യമാക്കുക എന്നും രക്ഷിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പാതയിൽ.’
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘വിശ്വാസം’ എന്നത് ‘ആശ്രയം’ എന്നും പ്രകടിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὕπαγε
  choice: പോകുക
  rationale: പുറപ്പെടാനുള്ള നേരിട്ടുള്ള കല്പനയാണ്. ഗ്രീക്കിൽ ഇല്ലാത്ത ‘നിന്റെ വഴി’ എന്ന ഉടമസ്ഥഭാവം ചേർക്കാതെ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഈ സന്ദർഭത്തിൽ യേശുവിലുള്ള ആശ്രയവും ഉറച്ച വിശ്വാസവുമാണ് സൂചിപ്പിക്കുന്നത്. ‘ആശ്രയം’ സാധ്യമെങ്കിലും പ്രധാന പദത്തിന്റെ തുടർച്ച നിലനിർത്താൻ ‘വിശ്വാസം’ സ്വീകരിച്ചു.
- source_word: σέσωκέν
  choice: രക്ഷിച്ചിരിക്കുന്നു
  rationale: σῴζω എന്ന ക്രിയയ്ക്ക് രക്ഷിക്കുക, സൗഖ്യമാക്കുക എന്നീ അർഥങ്ങൾ വരാം. തൊട്ടുപിന്നാലെ കാഴ്ച വീണ്ടെടുക്കുന്നത് ശാരീരിക സൗഖ്യം വ്യക്തമാക്കുന്നുവെങ്കിലും, ക്രിയയുടെ വിശാലമായ അർഥവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: εὐθύς
  choice: ഉടൻതന്നെ
  rationale: മർക്കോസിന്റെ ദ്രുതഗതിയുള്ള ആഖ്യാനശൈലി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνέβλεψεν
  choice: കാഴ്ച തിരിച്ചുകിട്ടി
  rationale: അന്ധനായിരുന്ന വ്യക്തിക്ക് കാഴ്ച പുനഃസ്ഥാപിക്കപ്പെട്ടുവെന്ന സന്ദർഭോചിതമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἠκολούθει
  choice: അനുഗമിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയാരൂപത്തിലെ തുടരുന്ന പ്രവൃത്തിയുടെ ഭാവം മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν τῇ ὁδῷ
  choice: വഴിയിൽ
  rationale: യാത്രയുടെ യഥാർഥ പശ്ചാത്തലവും മർക്കോസിലെ ശിഷ്യത്വവുമായി ബന്ധപ്പെട്ടേക്കാവുന്ന ‘വഴി’ എന്ന സൂചനയും ഒരുപോലെ തുറന്നുവെക്കുന്നു.
- source_word: καὶ ὁ Ἰησοῦς
  choice: യേശു
  rationale: മലയാളത്തിലെ സ്വാഭാവിക വാക്യാരംഭത്തിനായി തുടക്കത്തിലെ καί പ്രത്യേകം വിവർത്തനം ചെയ്തില്ല; ആഖ്യാനബന്ധം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: യേശുവിന്റെ പ്രഖ്യാപനത്തിലെ σῴζω എന്ന ക്രിയയുടെ അർഥം
  choice: ‘രക്ഷിച്ചിരിക്കുന്നു’ എന്ന് വിശാലമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സൗഖ്യമാക്കിയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘സുഖപ്പെടുത്തിയിരിക്കുന്നു’
  rationale: ഈ ക്രിയയ്ക്ക് രക്ഷയും സൗഖ്യവും സൂചിപ്പിക്കാനാകും. കാഴ്ച വീണ്ടെടുത്തത് ശാരീരിക സൗഖ്യം വ്യക്തമാക്കുമ്പോഴും യേശുവിന്റെ വാക്കുകൾ അതിലേറെ വിശാലമാണ്; അതിനാൽ അർഥം ശാരീരിക രോഗശാന്തിയിലേക്കു മാത്രം ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘രക്ഷിച്ചിരിക്കുന്നു’ എന്ന പ്രയോഗം മൂലത്തിലെ പെർഫെക്റ്റ് രൂപത്തിന്റെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു; ‘അനുഗമിച്ചുകൊണ്ടിരുന്നു’ തുടരുന്ന പ്രവൃത്തി വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു ചേർത്തു.
