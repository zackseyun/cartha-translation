id: MRK.10.9
reference: Mark 10:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: ml
  text: അതുകൊണ്ട്, ദൈവം കൂട്ടിച്ചേർത്തതിനെ മനുഷ്യൻ[a] വേർപിരിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു മനുഷ്യനും’ / ‘ഒരു വ്യക്തിയും.’ ഗ്രീക്കിൽ ഏകവചനമായ ‘മനുഷ്യൻ’ എന്ന പദം പൊതുവായ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: കൂട്ടിച്ചേർത്തതിനെ
  rationale: നപുംസക ഏകവചന ബന്ധസർവനാമം മുമ്പ് വിവരിച്ച വിവാഹബന്ധത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ക്രിയയോടു ചേർന്ന ഈ രൂപം ‘ദൈവം കൂട്ടിച്ചേർത്തതിനെ’ എന്ന സ്വാഭാവിക ഘടന നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പുള്ള ദൈവിക വിവാഹക്രമത്തിൽനിന്നുള്ള നിഗമനത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: വാക്യത്തിലെ കർത്താവിനെ നേരായും സാധാരണ മലയാള ബൈബിൾ ഭാഷയ്ക്ക് യോജിച്ചും അവതരിപ്പിക്കുന്നു.
- source_word: συνέζευξεν
  choice: കൂട്ടിച്ചേർത്തു
  rationale: συζεύγνυμι എന്ന ക്രിയയിലെ ഒന്നിച്ചു ബന്ധിപ്പിക്കുക അഥവാ നുകത്തിൽ ചേർക്കുക എന്ന ആശയം നിലനിർത്തുന്നു; ‘നുകത്തിൽ ചേർത്തു’ എന്ന രൂപത്തേക്കാൾ വിവാഹസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἄνθρωπος
  choice: മനുഷ്യൻ
  rationale: ഗ്രീക്കിലെ ഏകവചന പൊതുപ്രതിനിധിയായ പ്രയോഗം മലയാളത്തിലും നിലനിർത്തുന്നു. ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μὴ χωριζέτω
  choice: വേർപിരിക്കരുത്
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നിരോധനശക്തി വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: വിവാഹത്തെക്കുറിച്ചുള്ള വചനത്തിൽ ἄνθρωπος എന്ന പദത്തിന്റെ പൊതുവായ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘മനുഷ്യൻ’ എന്ന് നൽകി, അത് പൊതുവായ മനുഷ്യസൂചനയാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ഒരു വ്യക്തിയും’ അല്ലെങ്കിൽ ‘ഒരു മനുഷ്യനും’
  rationale: ഗ്രീക്ക് ഏകവചനത്തിലെ പൊതുപ്രതിനിധി രൂപം സംരക്ഷിക്കുമ്പോഴും വിലക്ക് പുരുഷന്മാർക്കു മാത്രമുള്ളതാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘നുകത്തിൽ ചേർത്തു’ എന്ന അക്ഷരാർഥരൂപത്തിന് പകരം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘കൂട്ടിച്ചേർത്തു’ സ്വീകരിച്ചു; നിരോധനം ‘വേർപിരിക്കരുത്’ എന്ന് നേരിട്ട് പ്രകടിപ്പിച്ചു.
