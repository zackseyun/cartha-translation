source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: ml
  text: 'അവർ അവനോട്, “ഞങ്ങൾക്കു കഴിയും”[a] എന്നു പറഞ്ഞു. എന്നാൽ യേശു അവരോട് പറഞ്ഞു: “ഞാൻ കുടിക്കുന്ന പാനപാത്രം നിങ്ങൾ കുടിക്കും; ഞാൻ ഏൽക്കുന്ന സ്നാനം[b] നിങ്ങൾക്കും ഏൽക്കേണ്ടിവരും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾക്ക് അതിനു കഴിവുണ്ട്.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “പാനപാത്രം,” “സ്നാനം” എന്നിവ യേശു നേരിടാനിരിക്കുന്ന കഷ്ടാനുഭവത്തിന്റെയും വിധിയുടെയും രൂപകങ്ങളാണ്; അവന്റെ ശിഷ്യന്മാരും അതിൽ പങ്കുചേരും.
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: ഞങ്ങൾക്കു കഴിയും
  rationale: കഴിവ് പ്രകടിപ്പിക്കുന്ന വർത്തമാനകാലരൂപം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ശിഷ്യന്മാരുടെ ആത്മവിശ്വാസമുള്ള മറുപടിയും നിലനിർത്തുന്നു.
- source_word: ποτήριον
  choice: പാനപാത്രം
  rationale: ദുഃഖാനുഭവത്തെയും നിയോഗിക്കപ്പെട്ട വിധിയെയും സൂചിപ്പിക്കുന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: πίνω / πίεσθε
  choice: ഞാൻ കുടിക്കുന്ന / നിങ്ങൾ കുടിക്കും
  rationale: ഗ്രീക്കിലെ വർത്തമാന–ഭാവികാല സമാന്തരതയും പാനപാത്രരൂപകവും നിലനിർത്തുന്നു.
- source_word: βάπτισμα
  choice: സ്നാനം
  rationale: പദത്തിന്റെ പതിവായ ബൈബിൾപ്രയോഗം നിലനിർത്തുകയും ഇവിടെ അതിനുള്ള രൂപകാർഥം സന്ദർഭത്തിനും അടിക്കുറിപ്പിനും വിടുകയും ചെയ്യുന്നു.
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: ഞാൻ ഏൽക്കുന്ന / നിങ്ങൾക്കും ഏൽക്കേണ്ടിവരും
  rationale: ‘സ്നാനം കഴിക്കപ്പെടുക’ എന്ന അസ്വാഭാവിക മലയാളം ഒഴിവാക്കി, ഒരാൾക്കു സംഭവിക്കുന്ന അനുഭവമെന്ന നിഷ്ക്രിയഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘സ്നാനം’ എന്ന നാമരൂപം മുൻപിൽ നിലനിർത്തിയതിനാൽ മൂലത്തിലെ പദബന്ധവും വായനക്കാരന് വ്യക്തമാണ്.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: എന്നാൽ യേശു അവരോട് പറഞ്ഞു
  rationale: δέ സൂചിപ്പിക്കുന്ന ശിഷ്യന്മാരുടെ ആത്മവിശ്വാസമുള്ള അവകാശവാദവും യേശുവിന്റെ പ്രതികരണവും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പാനപാത്രവും സ്നാനവും എന്ന രൂപകങ്ങൾ
  choice: രണ്ടു രൂപകങ്ങളും മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അവയുടെ ദുഃഖാനുഭവസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: മുഖ്യപാഠത്തിൽ നേരിട്ട് ‘കഷ്ടത’യോ ‘മരണം’യോ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരവും തിരുവെഴുത്താന്തരവുമായ പ്രതിധ്വനി സംരക്ഷിക്കാനും രൂപകത്തിന്റെ വ്യാപ്തി ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കാനും.
- issue: സ്നാനകർമവുമായുള്ള ബന്ധം
  choice: βάπτισμα എന്നത് ‘സ്നാനം’ എന്നു തന്നെയാക്കി, സന്ദർഭത്തിൽ അത് കഷ്ടാനുഭവത്തിന്റെ രൂപകമാണെന്ന് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: കർമപരമായ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘മുക്കൽ’ അല്ലെങ്കിൽ ‘കഠിനാനുഭവം’ എന്നു നൽകുക.
  rationale: ഗ്രീക്ക് പദത്തിന്റെ പ്രത്യക്ഷരൂപം സംരക്ഷിക്കുമ്പോഴും ഈ വാക്യത്തിൽ ഉദ്ദേശിക്കുന്നത് കഷ്ടാനുഭവമാണെന്നത് വായനക്കാരന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പാനപാത്രം’, ‘സ്നാനം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി. നിഷ്ക്രിയരൂപം അക്ഷരാർഥത്തിൽ അനുകരിച്ച് ഭാഷ കൃത്രിമമാക്കാതെ ‘ഏൽക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗം ഉപയോഗിച്ചു.
