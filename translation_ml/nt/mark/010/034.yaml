id: MRK.10.34
reference: Mark 10:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: ml
  text: അവർ അവനെ പരിഹസിക്കുകയും അവന്റെമേൽ തുപ്പുകയും അവനെ ചമ്മട്ടികൊണ്ട് അടിക്കുകയും കൊല്ലുകയും ചെയ്യും. മൂന്നു ദിവസം കഴിഞ്ഞ്[a] അവൻ ഉയിർത്തെഴുന്നേൽക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മൂന്നു ദിവസത്തിനകം.’ മർക്കോസിന്റെ ഗ്രീക്ക് പാഠത്തിൽ ‘മൂന്നു ദിവസം കഴിഞ്ഞ്’ എന്നാണ്; മറ്റു ഭാഗങ്ങളിൽ ഈ സമയം ‘മൂന്നാം ദിവസം’ എന്നു പറയുന്നു.
    reason: സമയപ്രയോഗത്തിന്റെ സാധ്യതയുള്ള വ്യാഖ്യാനവും സമാന്തര ഭാഗങ്ങളിലെ വ്യത്യസ്ത പദപ്രയോഗവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: പരിഹസിക്കും
  rationale: അവജ്ഞയോടെയുള്ള പരിഹാസത്തെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: അവന്റെമേൽ തുപ്പും
  rationale: അവനെ അപമാനിക്കാൻ അവന്റെ നേരെ നടത്തിയ പ്രവൃത്തിയാണെന്ന് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നു; ‘അവന്റെമേൽ തുപ്പും’ അത് വ്യക്തമായി പകരുന്നു.
- source_word: μαστιγώσουσιν
  choice: ചമ്മട്ടികൊണ്ട് അടിക്കും
  rationale: ശിക്ഷാരൂപത്തിലുള്ള ചമ്മട്ടിയടിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി മനസ്സിലാകുന്ന ഭാഷയിൽ പകരുന്നു.
- source_word: ἀποκτενοῦσιν
  choice: കൊല്ലും
  rationale: നിയമപരമോ ധാർമികമോ ആയ അധിക സൂചനകൾ ചേർക്കാതെ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: മൂന്നു ദിവസം കഴിഞ്ഞ്
  rationale: μετά എന്ന പദത്തിന്റെ കാലസൂചകമായ അടിസ്ഥാനാർഥമായ ‘ശേഷം/കഴിഞ്ഞ്’ നേരിട്ട് സംരക്ഷിക്കുന്നു; സമാന്തര ഭാഗങ്ങളിലെ ‘മൂന്നാം ദിവസം’ എന്ന രൂപവുമായി നിശ്ശബ്ദമായി ഒത്തുചേർക്കുന്നില്ല.
- source_word: ἀναστήσεται
  choice: ഉയിർത്തെഴുന്നേൽക്കും
  rationale: ഭാവികാല മധ്യരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ അകർമക പുനരുത്ഥാനപ്രയോഗമായി പകരുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘വീണ്ടും’ എന്ന പദമോ കർമണിപ്രയോഗമോ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പുനരുത്ഥാനത്തിന്റെ ക്രിയാരൂപം
  choice: അവൻ ഉയിർത്തെഴുന്നേൽക്കും
  alternative: അവൻ ഉയിർപ്പിക്കപ്പെടും / അവൻ വീണ്ടും ഉയിർത്തെഴുന്നേൽക്കും
  rationale: ἀναστήσεται എന്ന ഭാവികാല മധ്യരൂപത്തിന്റെ അകർമകസ്വഭാവം നിലനിർത്തുന്നു. യേശുവിനെ പിതാവ് ഉയിർപ്പിച്ചു എന്നു പറയുന്ന മറ്റു പുതിയനിയമ വാക്യങ്ങളെ നിഷേധിക്കാതെയും ഈ വാക്യത്തെ കർമണിയാക്കി മാറ്റാതെയും വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു; ‘വീണ്ടും’ ഗ്രീക്കിൽ വ്യക്തമല്ല.
- issue: പുനരുത്ഥാനത്തിന്റെ സമയപ്രയോഗം
  choice: മൂന്നു ദിവസം കഴിഞ്ഞ്
  alternative: മൂന്നാം ദിവസം / മൂന്നു ദിവസത്തിനകം
  rationale: മർക്കോസിന്റെ μετὰ τρεῖς ἡμέρας എന്ന പ്രത്യേക പ്രയോഗം അതേപടി സംരക്ഷിക്കുന്നു; മറ്റു സുവിശേഷഭാഗങ്ങളിലെ സമയപ്രയോഗവുമായി വ്യാഖ്യാനപരമായി സമന്വയിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ആവർത്തിച്ചുള്ള ഗ്രീക്ക് καί-ബന്ധനങ്ങളെ മലയാളത്തിലെ ‘-കയും’ ഘടനയിലൂടെ സ്വാഭാവികമായി കൂട്ടിച്ചേർത്തു. സമയസൂചക അടിക്കുറിപ്പിന്റെ അടയാളം അതുമായി ബന്ധപ്പെട്ട ‘മൂന്നു ദിവസം കഴിഞ്ഞ്’ എന്ന വാക്കുകൾക്കു പിന്നാലെ വെച്ചു.
