  terminology: ‘പരിഹസിക്കുക,’ ‘ചമ്മട്ടികൊണ്ട് അടിക്കുക,’ ‘കൊല്ലുക,’ ‘ഉയിർത്തെഴുന്നേൽക്കുക’ എന്നിവ വ്യക്തവും സന്ദർഭോചിതവുമാണ്. ‘അവന്റെമേൽ തുപ്പുക’ അപമാനത്തിന്റെ ഉദ്ദേശ്യദിശ വ്യക്തമാക്കുന്നു. പുനരുത്ഥാനപ്രയോഗത്തിൽ ഗ്രീക്കിൽ ഇല്ലാത്ത ‘വീണ്ടും’ ചേർത്തിട്ടില്ല; കർമണിരൂപവും അടിച്ചേൽപ്പിച്ചിട്ടില്ല.
