source:
  edition: SBLGNT
  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: ml
  text: 'സെബെദിയുടെ പുത്രന്മാരായ യാക്കോബും യോഹന്നാനും അവന്റെ അടുക്കൽ വന്ന്[a] അവനോട് പറഞ്ഞു: “ഗുരുവേ, ഞങ്ങൾ അങ്ങയോട് എന്തു ചോദിച്ചാലും അത് ഞങ്ങൾക്കുവേണ്ടി ചെയ്യണമെന്ന് ഞങ്ങൾ ആഗ്രഹിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ സമീപിച്ചു.” ഗ്രീക്ക് ക്രിയ അവന്റെ അടുത്തേക്കുള്ള ചലനത്തെ കൂടുതൽ അക്ഷരാർഥത്തിൽ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται
  choice: അവന്റെ അടുക്കൽ വന്ന്
  rationale: യേശുവിന്റെ അടുത്തേക്കുള്ള ചലനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വർത്തമാനകാലരൂപത്തെ ആഖ്യാനസന്ദർഭത്തിന് യോജിച്ച ഭൂതകാലമായി അവതരിപ്പിക്കുന്നു.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: സെബെദിയുടെ പുത്രന്മാരായ
  rationale: ഗ്രീക്കിലെ സമാനാധികരണ തിരിച്ചറിയൽ നിലനിർത്തുന്ന, ഗൗരവമുള്ള സ്വാഭാവിക പ്രയോഗം.
- source_word: λέγοντες αὐτῷ
  choice: അവനോട് പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കൃദന്തരൂപം മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ സമാപികാക്രിയയായി നൽകുന്നു.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: പഠിപ്പിക്കുന്നവൻ എന്ന അർഥമുള്ള അഭിസംബോധനയ്ക്ക് മലയാളത്തിൽ സാധാരണവും ഗൗരവമുള്ളതുമായ തുല്യപദം.
- source_word: θέλομεν
  choice: ഞങ്ങൾ ആഗ്രഹിക്കുന്നു
  rationale: അവരുടെ നേരിട്ടുള്ള ഇച്ഛയെ വ്യക്തമാക്കുന്നു; ‘ഞങ്ങൾക്കു വേണം’ എന്നതിനേക്കാൾ ഈ വാക്യഘടനയിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: ഞങ്ങൾ അങ്ങയോട് എന്തു ചോദിച്ചാലും
  rationale: ὃ ἐάν നൽകുന്ന അനിശ്ചിതവും വ്യാപകവുമായ ‘whatever’ അർഥം ‘എന്തു...ചോദിച്ചാലും’ എന്ന ഘടനയിൽ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ποιήσῃς ἡμῖν
  choice: അതു ഞങ്ങൾക്കുവേണ്ടി ചെയ്തുതരണമെന്ന്
  rationale: ποιέωയുടെ വിശാലമായ ‘ചെയ്യുക’ എന്ന അർഥം നിലനിർത്തുകയും ἡμῖν സൂചിപ്പിക്കുന്ന പ്രയോജനബന്ധം ‘ഞങ്ങൾക്കുവേണ്ടി’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ മാന്യരൂപമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; വിവരണത്തിൽ മൂലഭാഷയിലെ മൂന്നാംപുരുഷരൂപം അനുസരിച്ച് ‘അവൻ’ നിലനിർത്തി.
