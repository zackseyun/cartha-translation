id: MRK.10.36
reference: Mark 10:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τί θέλετε ⸀ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/036.yaml
  text: And he said to them, “What do you want me to do for you?”
translation:
  language: ml
  text: അവൻ അവരോട്, “ഞാൻ നിങ്ങൾക്കുവേണ്ടി എന്തു ചെയ്യണമെന്നാണ് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്?” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: അവൻ
  rationale: ഗ്രീക്കിൽ ὁ δὲ ആഖ്യാനം തുടരുന്ന പ്രയോഗമാണ്; മലയാളത്തിൽ പ്രത്യേക വൈരുധ്യം സൂചിപ്പിക്കാതെ കർത്താവിനെ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അവൻ’ മതിയാകുന്നു.
- source_word: εἶπεν
  choice: എന്നു പറഞ്ഞു
  rationale: λέγω എന്ന സാധാരണ സംസാരക്രിയയുടെ നേരിട്ടുള്ള തുല്യമാണ്; ചോദ്യം ഉദ്ധരണിയുടെ രൂപത്തിലൂടെ തന്നെ വ്യക്തമാകുന്നതിനാൽ ‘ചോദിച്ചു’ എന്നു മാറ്റിയിട്ടില്ല.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: ബഹുവചന ദത്തിവ് സർവനാമത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘അവരോട്’ എന്നു നൽകിയിരിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ഇരുവരോടും’ ചേർത്തിട്ടില്ല.
- source_word: Τί
  choice: എന്തു
  rationale: ചോദ്യസർവനാമത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: θέλετε
  choice: നിങ്ങൾ ആഗ്രഹിക്കുന്നത്
  rationale: θέλω ആഗ്രഹമോ ഇച്ഛയോ സൂചിപ്പിക്കുന്നു; മാന്യവും നിലവാരമുള്ളതുമായ മലയാളത്തിൽ ‘ആഗ്രഹിക്കുന്നത്’ പ്രസക്തമാണ്.
- source_word: ποιήσω
  choice: ഞാൻ ... ചെയ്യണമെന്നാണ്
  rationale: θέλετε-യോടൊപ്പമുള്ള ഒന്നാംപുരുഷ ഏകവചന എയോറിസ്റ്റ് സബ്ജങ്ക്റ്റീവ്, അവർ യേശുവിൽനിന്ന് ആഗ്രഹിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഞാൻ ... ചെയ്യണമെന്നാണ്’ അതിനെ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: 'ഇവിടെ ദത്തിവ് പ്രയോജനാർത്ഥകമാണ്: അവരുടെ നന്മയ്ക്കോ അഭ്യർത്ഥനപ്രകാരമോ ചെയ്യുന്ന പ്രവൃത്തി. അതിനാൽ ‘നിങ്ങൾക്കുവേണ്ടി’ എന്നു വിവർത്തനം ചെയ്തു.'
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവും നേരിട്ടുള്ളതുമായ സംഭാഷണശൈലി. മൂലത്തിലെ ചോദ്യം, വ്യക്തിവചനങ്ങൾ, പ്രയോജനാർത്ഥക ദത്തിവ് എന്നിവ വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
