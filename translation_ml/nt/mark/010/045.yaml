id: MRK.10.45
reference: Mark 10:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ml
  text: എന്തെന്നാൽ, മനുഷ്യപുത്രൻ പോലും ശുശ്രൂഷിക്കപ്പെടാനല്ല, ശുശ്രൂഷിക്കാനും അനേകർക്കു പകരമായി തന്റെ ജീവൻ മോചനവിലയായി നൽകാനുമാണ് വന്നത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: എന്തെന്നാൽ … പോലും
  rationale: γάρ-ന്റെ വിശദീകരണസ്വഭാവം ‘എന്തെന്നാൽ’ എന്നും καί നൽകുന്ന ഊന്നൽ ‘പോലും’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്ഥിരമായ സ്വയംവിശേഷണവും ദാനീയേൽപുസ്തകവുമായുള്ള അന്തർപാഠബന്ധവും സംരക്ഷിക്കുന്ന പരിചിതമായ രൂപം.
- source_word: οὐκ ἦλθεν
  choice: വന്നത് … അല്ല
  rationale: തുടർന്നുള്ള ഉദ്ദേശ്യസൂചക ക്രിയാരൂപങ്ങളോടു ചേർന്ന് ഗ്രീക്കിലെ വരവിനെയും നിഷേധത്തെയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: διακονηθῆναι / διακονῆσαι
  choice: ശുശ്രൂഷിക്കപ്പെടാൻ / ശുശ്രൂഷിക്കാൻ
  rationale: നിഷ്ക്രിയ-സജീവ രൂപങ്ങളിലെ വാചകവൈരുധ്യം ഒരേ മലയാളപദമൂലം ഉപയോഗിച്ച് നിലനിർത്തുന്നു.
- source_word: δοῦναι
  choice: നൽകാൻ
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം നേരിട്ട് നൽകുന്നു; ‘ഏൽപ്പിക്കുക’ പോലുള്ള കൂടുതൽ സവിശേഷമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: തന്റെ ജീവൻ
  rationale: ഇവിടെ ψυχή ശരീരാതീതമായ ‘ആത്മാവ്’ മാത്രമല്ല, മരണത്തിന് വിട്ടുകൊടുക്കുന്ന ജീവനെ സൂചിപ്പിക്കുന്നു.
- source_word: λύτρον
  choice: മോചനവില
  rationale: വിടുതലിനായി നൽകുന്ന വില എന്ന λύτρον-ന്റെ അർഥം വ്യക്തവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: ἀντὶ πολλῶν
  choice: അനേകർക്കു പകരമായി
  rationale: ἀντί സാധാരണയായി സൂചിപ്പിക്കുന്ന പകരംവെക്കൽ അഥവാ വിനിമയഭാവം മലയാളത്തിൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മോചനവിലയെക്കുറിച്ചുള്ള വാക്യത്തിൽ ἀντί-യുടെ ശക്തി
  choice: മുഖ്യപാഠത്തിൽ ‘അനേകർക്കു പകരമായി’ എന്ന് നൽകി പകരംവെക്കൽ/വിനിമയഭാവം നിലനിർത്തുക.
  alternative: ‘അനേകർക്കുവേണ്ടി’
  rationale: ἀντί-യുടെ ഏറ്റവും സ്വാഭാവികമായ അർഥം ‘പകരമായി’ എന്നതാണ്. അതേസമയം സന്ദർഭാനുസൃതമായി മലയാളത്തിൽ ഉപയോഗിക്കപ്പെടുന്ന വിശാലമായ ‘വേണ്ടി’ എന്ന അവതരണം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നത് അർഥപരിധി പരിശോധനയോഗ്യമാക്കുന്നു; പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം വിശദീകരിച്ച് അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മനുഷ്യപുത്രൻ’, ‘ശുശ്രൂഷ’, ‘മോചനവില’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി.
