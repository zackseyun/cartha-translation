id: MRK.10.1
reference: Mark 10:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: ml
  text: അവിടെനിന്ന് എഴുന്നേറ്റ്, അവൻ യെഹൂദ്യപ്രദേശത്തേക്കും യോർദാന്നദിക്കപ്പുറത്തേക്കും[a] വരുന്നു. ജനക്കൂട്ടങ്ങൾ വീണ്ടും അവന്റെ അടുക്കൽ വന്നുചേരുന്നു; തന്റെ പതിവുപോലെ അവൻ വീണ്ടും അവരെ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യോർദാന്നദിക്കപ്പുറത്തുള്ള യെഹൂദ്യപ്രദേശത്തേക്ക്” എന്നും ഈ വാക്യഘടന മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: മുൻപ് പറഞ്ഞ സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ സ്ഥലക്രിയാവിശേഷണപ്രയോഗം.
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റ്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തനക്രമം നിലനിർത്തുന്നു; ഇവിടെ ഉയിർത്തെഴുന്നേൽപ്പ് അല്ല, എഴുന്നേറ്റ് പുറപ്പെടുന്നതാണ് അർഥം.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: യെഹൂദ്യപ്രദേശം
  rationale: ὅρια എന്ന പദത്തിന്റെ പ്രദേശം/ഭൂപ്രദേശം എന്ന സന്ദർഭാർഥം നൽകുന്നു; കൃത്യമായ അതിർത്തിരേഖയെ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: യോർദാനക്കരയ്ക്കപ്പുറം
  rationale: യോർദാൻ നദിയുടെ മറുകരയിലുള്ള പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: συμπορεύονται
  choice: വന്നുചേരുന്നു
  rationale: ജനക്കൂട്ടങ്ങൾ യേശുവിന്റെ അടുക്കലേക്ക് ഒരുമിച്ചു നീങ്ങിവരുന്നതെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മർക്കോസിന്റെ ആവർത്തനശൈലി നിലനിർത്താൻ ഈ വാക്യത്തിലെ രണ്ടു പ്രാവശ്യവും പരിഭാഷപ്പെടുത്തി.
- source_word: ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: ബഹുവചനവും വലിയ കൂട്ടങ്ങളുടെ ആശയവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: πρὸς αὐτόν
  choice: അവന്റെ അടുക്കൽ
  rationale: ഒരു വ്യക്തിയിലേക്കുള്ള ചലനത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς εἰώθει
  choice: തന്റെ പതിവുപോലെ
  rationale: പതിവായി ചെയ്തിരുന്ന പ്രവൃത്തിയെന്ന ഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐδίδασκεν αὐτούς
  choice: അവരെ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ തുടർച്ചയുള്ളതോ പതിവായതോ ആയ ഭൂതകാലപ്രവർത്തനഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലം
  choice: “വരുന്നു”, “വന്നുചേരുന്നു” എന്ന വർത്തമാനരൂപങ്ങൾ നിലനിർത്തി
  alternative: “വന്നു”, “വന്നുചേർന്നു” എന്ന ഭൂതകാലരൂപങ്ങൾ
  rationale: മർക്കോസിന്റെ സജീവമായ ആഖ്യാനശൈലി മലയാളത്തിൽ വായിക്കാവുന്ന പരിധിയിൽ നിലനിർത്തുന്നു.
- issue: καὶ πέραν τοῦ Ἰορδάνου എന്ന ഭൂമിശാസ്ത്രവാക്യഘടന
  choice: യെഹൂദ്യപ്രദേശവും യോർദാനക്കരയ്ക്കപ്പുറവും എന്ന രണ്ടു സമാന്തര വിവരണങ്ങളായി പ്രധാനപാഠത്തിൽ നൽകി
  alternative: യോർദാനക്കരയ്ക്കപ്പുറത്തുള്ള യെഹൂദ്യപ്രദേശം എന്ന ഒറ്റ സംയുക്ത ലക്ഷ്യസ്ഥലമായി വായിക്കുക
  rationale: ഗ്രീക്കിലെ ചുരുക്കിയ വാക്യഘടന അനുവദിക്കുന്ന രണ്ടാമത്തെ വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ച്, പ്രധാനപാഠം പദക്രമത്തോട് അടുത്തുനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലവും ഭൂമിശാസ്ത്രപരമായ വാക്യഘടനയിലെ യഥാർഥ അവ്യക്തതയും സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ഭൂമിശാസ്ത്രവാക്യത്തിന്റെ പിന്നാലെ വെച്ചു.
