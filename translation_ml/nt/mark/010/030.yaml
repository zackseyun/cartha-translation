id: MRK.10.30
reference: Mark 10:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: ml
  text: ഇപ്പോൾ ഈ കാലത്ത് നൂറിരട്ടിയായി—വീടുകളും സഹോദരന്മാരും സഹോദരിമാരും അമ്മമാരും മക്കളും വയലുകളും—പീഡനങ്ങളോടുകൂടെ ലഭിക്കാതിരിക്കുകയില്ല; വരാനിരിക്കുന്ന യുഗത്തിൽ നിത്യജീവനും ലഭിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβῃ
  choice: ലഭിക്കും / ലഭിക്കാതിരിക്കുകയില്ല
  rationale: പ്രതിഫലത്തിന്റെ വാഗ്ദാനസന്ദർഭത്തിൽ ‘സ്വീകരിക്കുക’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ‘ലഭിക്കുക’ യോജിക്കുന്നു. ἐὰν μή എന്ന ഘടനയുടെ നിഷേധാത്മക ഊന്നൽ ‘ലഭിക്കാതിരിക്കുകയില്ല’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: ἑκατονταπλασίονα
  choice: നൂറിരട്ടിയായി
  rationale: അളവിലെ നൂറുമടങ്ങ് വർധന നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: ഇപ്പോൾ ഈ കാലത്ത്
  rationale: വർത്തമാനകാലത്തെ വരാനിരിക്കുന്ന യുഗത്തോട് എതിർനിർത്തുന്ന ഉറവിടത്തിലെ സമയസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οἰκίας
  choice: വീടുകൾ
  rationale: മൂർത്തമായ ബഹുവചന പ്രതിച്ഛായ നിലനിർത്തുന്ന നേരിട്ടുള്ള സമാനപദം.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: സഹോദരന്മാരും സഹോദരിമാരും
  rationale: ഗ്രീക്കിൽ പുരുഷ-സ്ത്രീ സഹോദരങ്ങളെ പ്രത്യേകം പറയുന്നതിനാൽ ആ വേർതിരിവ് സംരക്ഷിച്ചു.
- source_word: μητέρας
  choice: അമ്മമാർ
  rationale: സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ബഹുവചന രൂപം; കുടുംബബന്ധങ്ങളുടെ പട്ടികയിലെ ഉറവിടപദത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τέκνα
  choice: മക്കൾ
  rationale: ആൺ-പെൺ വ്യത്യാസമില്ലാതെ സന്തതികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: ἀγρούς
  choice: വയലുകൾ
  rationale: കൃഷിയിടങ്ങളെ സൂചിപ്പിക്കുന്ന മൂർത്തവും കൃത്യവുമായ പദം.
- source_word: μετὰ διωγμῶν
  choice: പീഡനങ്ങളോടുകൂടെ
  rationale: ഇപ്പോഴത്തെ അനുഗ്രഹത്തോടൊപ്പം കഷ്ടതയും തുടരുന്നു എന്ന നിർണായകമായ സംഘർഷം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: വരാനിരിക്കുന്ന യുഗത്തിൽ
  rationale: αἰών എന്നത് ഭൗതിക ലോകത്തേക്കാൾ ഒരു യുഗത്തെ സൂചിപ്പിക്കുന്നു; വർത്തമാനകാലത്തോടുള്ള അന്ത്യകാലപരമായ വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: ഈ സന്ദർഭത്തിലെ സ്ഥിരപ്രയോഗവും അന്ത്യകാലപരമായ അർഥവും കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ഇപ്പോഴത്തെ കാലത്തിലെ വാഗ്ദത്ത പ്രതിഫലത്തിന്റെ സ്വഭാവം
  choice: വീടുകൾ, കുടുംബബന്ധങ്ങൾ, വയലുകൾ എന്നിവ യഥാർത്ഥമായ ഇപ്പോഴത്തെ പ്രതിഫലമായി നേരിട്ട് അവതരിപ്പിക്കുകയും ‘പീഡനങ്ങളോടുകൂടെ’ എന്നത് പൂർണമായി നിലനിർത്തുകയും ചെയ്തു.
  alternative: വാഗ്ദാനത്തെ പൂർണമായും ആത്മീയ അനുഗ്രഹങ്ങളാക്കി ചുരുക്കുക, അല്ലെങ്കിൽ കഷ്ടതയെ മറച്ചുവെച്ച് ഭൗതിക സമൃദ്ധിക്ക് മാത്രം ഊന്നൽ നൽകുക.
  rationale: ഗ്രീക്ക് പാഠം സമൃദ്ധമായ പ്രതിഫലവും തുടർന്നുള്ള പീഡനവും ഒരുമിച്ച് പറയുന്നു; പരിഭാഷ ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിച്ചുകളയരുത്.
- issue: കുടുംബബന്ധങ്ങളിലെ ലിംഗസൂചന
  choice: ἀδελφοὺς, ἀδελφὰς എന്നിവയെ യഥാക്രമം ‘സഹോദരന്മാർ’, ‘സഹോദരിമാർ’ എന്നു പ്രത്യേകം പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടിനെയും ചേർത്ത് ഒരു ലിംഗനിരപേക്ഷ കൂട്ടപ്പദം ഉപയോഗിക്കുക.
  rationale: ഉറവിടം പുരുഷ-സ്ത്രീ സഹോദരങ്ങളെ വ്യക്തമായി വേർതിരിച്ചു പട്ടികപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന ഘടനയുടെ തുടർച്ചയായതിനാൽ ἐὰν μήയുടെ നിഷേധാത്മക ഊന്നൽ നിലനിർത്തിയെങ്കിലും, അവസാനത്തെ നിത്യജീവനെ മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാൻ ‘ലഭിക്കും’ എന്നു വ്യക്തമാക്കി.
