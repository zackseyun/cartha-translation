- from: ഇപ്പോൾ ഈ കാലത്ത് വീടുകളും സഹോദരന്മാരും സഹോദരിമാരും അമ്മമാരും മക്കളും വയലുകളും—പീഡനങ്ങളോടുകൂടെ—നൂറിരട്ടിയായി ലഭിക്കാതിരിക്കുകയില്ല; വരാനിരിക്കുന്ന യുഗത്തിൽ നിത്യജീവനും ലഭിക്കും.
