id: MRK.10.33
reference: Mark 10:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: ml
  text: “ഇതാ, നാം യെരൂശലേമിലേക്കു കയറിപ്പോകുകയാണ്. മനുഷ്യപുത്രൻ മുഖ്യപുരോഹിതന്മാർക്കും ശാസ്ത്രിമാർക്കും കൈമാറപ്പെടും[a]; അവർ അവനെ മരണശിക്ഷയ്ക്കു വിധിക്കുകയും വിജാതീയർക്കു കൈമാറുകയും ചെയ്യും[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഏൽപ്പിക്കപ്പെടും.” വാക്യത്തിന്റെ അവസാനത്തും ഇതേ ഗ്രീക്ക് ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ജനതകൾക്കു” അല്ലെങ്കിൽ “രാഷ്ട്രങ്ങൾക്കു.” ഇവിടെ യഹൂദരല്ലാത്ത അധികാരികളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: എന്നു പറഞ്ഞു
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച യേശുവിന്റെ വാക്കുകളുടെ ഉള്ളടക്കം ഈ വാക്യം തുടരുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ധരണിയാരംഭം നൽകാൻ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘പറഞ്ഞു’ ചേർത്തു; കാരണാർഥം നൽകിയിട്ടില്ല.
- source_word: Ἰδοὺ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരസൂചകത്തിന്റെ ഊന്നൽ ആധുനികവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἀναβαίνομεν
  choice: നാം ... കയറിപ്പോകുകയാണ്
  rationale: യെരൂശലേമിലേക്കുള്ള ഉയർച്ചയും ഇപ്പോൾ പുരോഗമിക്കുന്ന യാത്രയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: വാക്കിന്റെ അക്ഷരാർഥവും ദാനീയേൽപുസ്തകവുമായി ബന്ധപ്പെട്ട പ്രതിധ്വനിയും യേശുവിന്റെ സ്വയംവിശേഷണത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും സംരക്ഷിക്കുന്ന സ്ഥാപിത പ്രയോഗം.
- source_word: παραδοθήσεται
  choice: ഏല്പിക്കപ്പെടും
  rationale: മറ്റുള്ളവരുടെ അധികാരത്തിലേക്ക് കൈമാറപ്പെടുക എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ‘ഒറ്റിക്കൊടുക്കപ്പെടും’ എന്നു പറഞ്ഞ് പ്രവർത്തകനെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: മുഖ്യപുരോഹിതന്മാർക്കും
  rationale: ഒരൊറ്റ മഹാപുരോഹിതനെയല്ല, പുരോഹിതനേതൃത്വത്തിലുള്ള ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: τοῖς γραμματεῦσιν
  choice: ശാസ്ത്രിമാർക്കും
  rationale: ഗ്രന്ഥജ്ഞരായ നിയമവിദഗ്ധരെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാള പദം.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: അവർ അവനെ മരണത്തിനു വിധിക്കുകയും
  rationale: ഔപചാരികമായ പ്രതികൂല ന്യായവിധിയും അതിന്റെ ശിക്ഷയായ മരണവും വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: παραδώσουσιν
  choice: ഏല്പിച്ചുകൊടുക്കുകയും
  rationale: ആദ്യത്തെ παραδίδωμι രൂപവുമായി പദബന്ധം നിലനിർത്തിക്കൊണ്ട് തുടർന്നുള്ള അധികാരകൈമാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοῖς ἔθνεσιν
  choice: ജനതകൾക്കു
  rationale: ἔθνη എന്നതിന്റെ അടിസ്ഥാനമായ ‘ജനതകൾ’ എന്ന അർഥം സംരക്ഷിക്കുകയും, സന്ദർഭത്തിൽ യഹൂദരല്ലാത്ത അധികാരികളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന സ്വയംവിശേഷണം
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: പരമ്പരാഗതമായ അക്ഷരാർഥ വിവർത്തനം ഗ്രീക്ക് രൂപവും ദാനീയേൽ പ്രതിധ്വനിയും ക്രിസ്തുശാസ്ത്രപരമായ തുറന്നത്വവും സംരക്ഷിക്കുന്നു.
- issue: τοῖς ἔθνεσιν എന്നതിന്റെ അർഥം
  choice: ജനതകൾക്കു
  alternative: വിജാതീയർക്കു
  rationale: ഗ്രീക്കിന്റെ പദസാധ്യത തുറന്നുവെക്കുന്നു; അതേസമയം ഈ പീഡാനുഭവസന്ദർഭത്തിൽ യഹൂദേതര അധികാരികളിലേക്കുള്ള കൈമാറ്റമാണ് ഉദ്ദേശ്യമെന്നത് അടിക്കുറിപ്പിലൂടെ അറിയിക്കുന്നു.
- issue: παραδίδωμι എന്ന ക്രിയയുടെ ആവർത്തനം
  choice: ഏല്പിക്കപ്പെടും / ഏല്പിച്ചുകൊടുക്കും
  alternative: ഒറ്റിക്കൊടുക്കപ്പെടും / കൈമാറും
  rationale: ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനവും അധികാരകൈമാറ്റത്തിന്റെ ശൃംഖലയും നിലനിർത്തുന്നു; ആദ്യ സംഭവത്തെ യൂദാസിന്റെ വഞ്ചനയായി മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കയറിപ്പോകുകയാണ്’ യാത്രയുടെ പുരോഗതിയും യെരൂശലേമിലേക്കുള്ള ഉയർച്ചയും സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിൽ ‘ജനതകൾ’ ഉപയോഗിച്ച് ഗ്രീക്കിന്റെ രൂപം സംരക്ഷിക്കുകയും ചരിത്രസന്ദർഭം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
