id: MRK.10.28
reference: Mark 10:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: ml
  text: 'പത്രോസ് അവനോടു പറഞ്ഞുതുടങ്ങി: “ഇതാ, ഞങ്ങൾ എല്ലാം ഉപേക്ഷിച്ച് നിന്നെ അനുഗമിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: പറഞ്ഞുതുടങ്ങി
  rationale: ആരംഭക്രിയയും പൂരകമായ അനന്തക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒറ്റ ക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ Πέτρος
  choice: പത്രോസ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: സന്ദർഭത്തിൽ സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠം പേര് ആവർത്തിക്കാത്തതിനാൽ സർവനാമം നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരസൂചകത്തിന്റെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ἡμεῖς
  choice: ഞങ്ങൾ
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന ഒന്നാംപുരുഷ ബഹുവചന സർവനാമം പത്രോസിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἀφήκαμεν πάντα
  choice: എല്ലാം ഉപേക്ഷിച്ച്
  rationale: ἀφίημι ഇവിടെ വിട്ടുപോരുക/ഉപേക്ഷിക്കുക എന്ന അർഥത്തിലാണ്; πάνταയുടെ സമഗ്രത ‘എല്ലാം’ എന്നതിലൂടെ നിലനിർത്തുന്നു. ‘ത്യജിക്കുക’ എന്നത് അനാവശ്യമായ ആത്മീയ ഭാവം ചേർക്കാം.
- source_word: ἠκολουθήκαμέν σοι
  choice: അങ്ങയെ അനുഗമിച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണകാലത്തിന്റെ കഴിഞ്ഞ പ്രവൃത്തിയും തുടരുന്ന പ്രസക്തിയും മലയാളത്തിലെ പൂർണരൂപം വ്യക്തമാക്കുന്നു; ബഹുമാനസൂചകമായ ‘അങ്ങയെ’ യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വത്തിനായി എല്ലാം ഉപേക്ഷിച്ചുവെന്ന പത്രോസിന്റെ അവകാശവാദം
  choice: പത്രോസിന്റെ വാക്കുകളായി നേരിട്ട് അവതരിപ്പിച്ചു; ശരിവയ്ക്കുകയോ മയപ്പെടുത്തുകയോ ചെയ്തില്ല.
  alternative: ‘ഞങ്ങൾ എല്ലാം ത്യജിച്ചിരിക്കുന്നു’ എന്നു ആത്മീയവൽക്കരിക്കുക, അല്ലെങ്കിൽ യേശുവിന്റെ തുടർന്നുള്ള മറുപടി മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്ന വിധത്തിൽ പരാവർത്തനം ചെയ്യുക.
  rationale: ഈ വാക്യം പത്രോസിന്റെ ഊന്നലുള്ള പ്രസ്താവനയാണ്; ആ പ്രസ്താവനയെക്കുറിച്ചുള്ള ആഖ്യാതാവിന്റെ ദൈവശാസ്ത്രപരമായ വിധിയല്ല. അതിനാൽ മൂലപാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുലഭവുമായ മലയാളം. ‘ഇതാ’ ബൈബിൾ ആഖ്യാനത്തിന് യോജിച്ചെങ്കിലും അതിപുരാതനമല്ല; ‘പറഞ്ഞുതുടങ്ങി’ സ്വാഭാവികമായ വിവരണശൈലി നിലനിർത്തുന്നു.
