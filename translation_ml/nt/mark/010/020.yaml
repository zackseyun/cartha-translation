source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτῷ· Διδάσκαλε, ταῦτα πάντα ἐφυλαξάμην ἐκ νεότητός μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: ml
  text: 'അവൻ യേശുവിനോടു പറഞ്ഞു: “ഗുരുവേ, ഞാൻ എന്റെ ചെറുപ്പം മുതൽ ഇവയെല്ലാം പാലിച്ചിട്ടുണ്ട്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη αὐτῷ
  choice: യേശുവിനോട് പറഞ്ഞു
  rationale: ἔφη എന്നത് സാധാരണ സംഭാഷണക്രിയയായ ‘പറഞ്ഞു’ എന്നാണ്. αὐτῷ എന്ന സർവനാമത്തിന്റെ സന്ദർഭപരമായ സൂച്യം യേശുവായതിനാൽ, മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പേര് ഉപയോഗിച്ചു.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: പഠിപ്പിക്കുന്നവനെ അഭിസംബോധന ചെയ്യുന്ന διδάσκαλε എന്ന പദത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം; ‘യജമാനനേ’ എന്നതുപോലെ അധികാരാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ταῦτα πάντα
  choice: ഇവയെല്ലാം
  rationale: മുമ്പ് പറഞ്ഞ കല്പനകളെ സൂചിപ്പിക്കുന്ന സമഗ്രപ്രയോഗം; മലയാളത്തിൽ ‘ഇവയെല്ലാം’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: ἐφυλαξάμην
  choice: പാലിച്ചുപോന്നിരിക്കുന്നു
  rationale: കല്പനകളുടെ പശ്ചാത്തലത്തിൽ φυλάσσω എന്നതിന് ‘പാലിക്കുക’ യോജിക്കുന്നു. ചെറുപ്പംമുതൽ ഇപ്പോഴോളം തുടരുന്നുവെന്ന പ്രസ്താവനയുടെ ഭാവം മലയാളത്തിൽ ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: ἐκ νεότητός μου
  choice: എന്റെ ചെറുപ്പംമുതൽ
  rationale: കാലത്തിന്റെ ആരംഭബിന്ദു സൂചിപ്പിക്കുന്ന ἐκ-പ്രയോഗം കൃത്യമായി നൽകുന്നു; νεότης എന്നത് ബാല്യത്തേക്കാൾ വിശാലമായി യൗവനകാലത്തെയും ചെറുപ്പത്തെയും സൂചിപ്പിക്കാം.
- source_word: ὁ δὲ
  choice: അവൻ
  rationale: δέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിൽ വേറൊരു ബന്ധകപദം ചേർക്കാതെ ‘അവൻ’ എന്നു തുടങ്ങുന്നത് സ്വാഭാവികമായ തുടർച്ച നൽകുന്നു.
theological_decisions:
- issue: കല്പനകൾ പാലിച്ചുവെന്ന ആളുടെ അവകാശവാദത്തിന്റെ വിലയിരുത്തൽ
  choice: അവകാശവാദം പറഞ്ഞതുപോലെതന്നെ അവതരിപ്പിച്ചു
  alternative: അവകാശവാദത്തെ സംശയാസ്പദമാക്കുന്നോ പൂർണ അനുസരണമായി വ്യാഖ്യാനിക്കുന്നോ ആയ ഭാഷ ചേർക്കുക
  rationale: ഗ്രീക്ക് വാക്യം പ്രസ്താവന മാത്രം രേഖപ്പെടുത്തുന്നു; അതിന്റെ സത്യാവസ്ഥയെക്കുറിച്ചോ രക്ഷാശാസ്ത്രപരമായ അർഥത്തെക്കുറിച്ചോ ഇവിടെ വിധിനിർണയം നടത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾ ആഖ്യാനശൈലി. ‘പാലിച്ചുപോന്നിരിക്കുന്നു’ എന്ന രൂപം ദീർഘകാല അനുസരണത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
