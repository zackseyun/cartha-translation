    issue: Aspectual nuance in «പാലിച്ചുപോന്നിരിക്കുന്നു»
    rationale: This progressive/periphrastic form may suggest ongoing habitual observance. «പാലിച്ചിട്ടുണ്ട്» naturally renders the speaker's completed-and-currently-relevant claim without adding that emphasis.
  - severity: low
    issue: Orthographic spacing in «ചെറുപ്പംമുതൽ»
    rationale: Modern standard Malayalam normally writes this as «ചെറുപ്പം മുതൽ».
