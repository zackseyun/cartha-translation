id: MRK.10.10
reference: Mark 10:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: ml
  text: പിന്നെ, വീട്ടിൽ ശിഷ്യന്മാർ ഈ കാര്യത്തെക്കുറിച്ച് അവനോടു വീണ്ടും ചോദിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീണ്ടും’ എന്നത് ചോദിക്കുന്നതിനോടു ചേർത്ത് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു. അതിനെ ‘വീട്ടിൽ’ എന്ന ഘടകത്തോടു ചേർത്ത്, ‘വീണ്ടും വീട്ടിൽ’ എന്നും മനസ്സിലാക്കാം.
    reason: source_ambiguity
lexical_decisions:
- source_word: Καὶ
  choice: പിന്നെ
  rationale: മുൻ സംഭവവുമായി ഈ രംഗത്തെ ബന്ധിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനബന്ധകമായി സ്വാഭാവികമായ മലയാളം; കൃത്യമായ കാലക്രമത്തെ അമിതമായി നിർവചിക്കുന്നില്ല.
- source_word: εἰς τὴν οἰκίαν
  choice: വീട്ടിൽവെച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘വീട്ടിലേക്കു’ എന്ന ചലനാർഥമുണ്ടെങ്കിലും, ഇവിടെ സ്വകാര്യമായ വീട്ടുസാഹചര്യത്തിൽ നടന്ന സംഭാഷണമാണ് ഉദ്ദേശിക്കുന്നത്. ‘വീട്ടിൽവെച്ച്’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ സാഹചര്യം അറിയിക്കുന്നു; ആരുടെ വീടാണെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ‘വീണ്ടും’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു. പ്രധാന പാഠത്തിൽ ഇത് ചോദിക്കുന്ന പ്രവൃത്തിയോടു ചേർത്തിരിക്കുന്നു; എന്നാൽ വാക്യത്തിലെ അതിന്റെ ബന്ധം വ്യാകരണപരമായി അനിശ്ചിതമായതിനാൽ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: യേശുവിന്റെ അറിയപ്പെടുന്ന ശിഷ്യസംഘത്തെ സൂചിപ്പിക്കുന്നു. ‘അവന്റെ’ എന്ന് മൂലപാഠത്തിൽ ഇല്ലാത്തത് ചേർക്കാതെ സന്ദർഭം ആശ്രയിച്ചിരിക്കുന്നു.
- source_word: περὶ τούτου
  choice: ഇതേ കാര്യത്തെക്കുറിച്ച്
  rationale: മുൻ സന്ദർഭത്തിലെ വിവാഹമോചനവിഷയത്തെയാണ് τούτου ചൂണ്ടിക്കാണിക്കുന്നത്. ‘ഇതേ കാര്യം’ ആ മുൻപരാമർശം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἐπηρώτων
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടരുന്ന അഥവാ ആവർത്തിച്ച ചോദ്യംചെയ്യൽ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; മൂലത്തിൽ വ്യക്തമായി ഇല്ലാത്ത ‘ചോദിക്കാൻ തുടങ്ങി’ എന്ന ആരംഭാർഥം ചേർക്കുന്നില്ല.
- source_word: αὐτόν
  choice: അവനോടു
  rationale: സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ചോദിക്കുക’ എന്ന ക്രിയയോടു സ്വാഭാവികമായി ചേരുന്ന രൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്വകാര്യമായ വീട്ടുസാഹചര്യം സ്വാഭാവികമായി അറിയിച്ചു; ആരുടെ വീടാണെന്നോ ശിഷ്യന്മാർ ചോദിക്കാൻ ‘തുടങ്ങി’ എന്നോ മൂലപാഠത്തിൽ ഇല്ലാത്ത വിവരങ്ങൾ ചേർത്തിട്ടില്ല.
