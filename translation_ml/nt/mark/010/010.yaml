  terminology: ‘ശിഷ്യന്മാർ,’ ‘കാര്യത്തെക്കുറിച്ച്,’ and ‘അവനോടു ചോദിച്ചുകൊണ്ടിരുന്നു’ are appropriate, neutral, and idiomatic. ‘വീട്ടിൽ’ preserves the unspecified house without adding ownership.
