reference: Mark 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവനോടു പറഞ്ഞു: “നീ എന്നെ നല്ലവൻ എന്നു വിളിക്കുന്നത് എന്തിന്?[a] ഒരുവനായ ദൈവമല്ലാതെ ആരും നല്ലവനല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എന്തിനുവേണ്ടിയാണ് നീ എന്നെ നല്ലവൻ എന്നു വിളിക്കുന്നത്?”'
    reason: τί എന്ന പദത്തിന്റെ അക്ഷരാർഥപരമായ ‘എന്ത്/എന്തിനുവേണ്ടി’ എന്ന ഭാവം കാണിക്കുന്ന പദസംബന്ധിയായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻ അഭിസംബോധനയ്ക്കുള്ള യേശുവിന്റെ പ്രതികരണത്തിലെ മൃദുവായ വ്യത്യാസവും സംഭാഷണത്തിലെ തിരിവും സൂചിപ്പിക്കുന്നു.
- source_word: εἶπεν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: പരോക്ഷ കർമത്തോടുകൂടിയ λέγω എന്ന ക്രിയയുടെ സുതാര്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: Τί
  choice: എന്തിന്
  rationale: τί എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘എന്ത്’ ആണെങ്കിലും, ഇവിടെ ക്രിയയോടൊപ്പം കാരണത്തെ ചോദിക്കുന്ന പ്രയോഗമായതിനാൽ ആധുനിക മലയാളത്തിൽ ‘എന്തിന്’ സ്വാഭാവികമാണ്; അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: με λέγεις ἀγαθόν
  choice: നീ എന്നെ നല്ലവൻ എന്നു വിളിക്കുന്നത്
  rationale: με എന്ന കർമവും ἀγαθόν എന്ന വിധേയപൂരകവും നിലനിർത്തി, ‘call me good’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: നല്ലവൻ / നല്ലവൻ
  rationale: രണ്ടിടത്തും ഒരേ മലയാളപദം ഉപയോഗിച്ച് മൂലത്തിലെ ആവർത്തനവും വാക്ചാതുര്യവും സംരക്ഷിക്കുന്നു; പുരുഷനെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘നല്ലവൻ’ സ്വാഭാവികമാണ്.
- source_word: οὐδεὶς
  choice: ആരുമില്ല
  rationale: സാർവത്രിക നിഷേധം വ്യക്തവും സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰ μὴ εἷς
  choice: ഒരുവനല്ലാതെ
  rationale: ഒരേയൊരാളെ വേർതിരിക്കുന്ന exceptive construction-ന്റെ ഊന്നൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: മലയാളത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക നാമരൂപം; ഗ്രീക്കിലെ നിർദേശക ഉപപദം പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല.
theological_decisions:
- issue: നന്മയെക്കുറിച്ചുള്ള യേശുവിന്റെ വാക്കുകളുടെ ക്രിസ്തുശാസ്ത്രപരമായ സൂചന
  choice: യേശു പറഞ്ഞ ചോദ്യംയും ദൈവത്തിന്റെ ഏകത്വത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയും വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലുകളില്ലാതെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: യേശു തന്റെ ദൈവത്വം നിഷേധിക്കുന്നു എന്നോ ഇവിടെ അതിനെ പരസ്യമായി അവകാശപ്പെടുന്നു എന്നോ സൂചിപ്പിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം ഉളവാക്കുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷവും യഥാർഥ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു; പാഠം പറയുന്നതിലധികം ഒരു നിഗമനവും പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നല്ലവൻ’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ വാക്ചാതുര്യം കാത്തുസൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ചോദ്യത്തിനുശേഷം മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
