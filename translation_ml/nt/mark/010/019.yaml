  to: 'നിനക്കു കൽപ്പനകൾ അറിയാം: ‘കൊല ചെയ്യരുത്[a]; വ്യഭിചാരം ചെയ്യരുത്; മോഷ്ടിക്കരുത്; കള്ളസാക്ഷ്യം പറയരുത്; മറ്റുള്ളവർക്ക് അവകാശപ്പെട്ടത് അപഹരിക്കരുത്[b]; നിന്റെ അപ്പനെയും അമ്മയെയും ബഹുമാനിക്കുക.’'
  rationale: The revision removes an added confirmatory particle and improves the rendering of ἀποστερήσῃς by expressing deprivation of what is rightfully due to others, without restricting the command to a particular mechanism such as fraud, withholding, or overt robbery. Footnote anchors and their lexical alternatives remain intact.
