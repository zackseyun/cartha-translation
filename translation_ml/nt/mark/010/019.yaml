id: MRK.10.19
reference: Mark 10:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: ml
  text: 'നിനക്കു കൽപ്പനകൾ അറിയാം: ‘കൊല ചെയ്യരുത്[a]; വ്യഭിചാരം ചെയ്യരുത്; മോഷ്ടിക്കരുത്; കള്ളസാക്ഷ്യം പറയരുത്; മറ്റുള്ളവർക്ക് അവകാശപ്പെട്ടത് അപഹരിക്കരുത്[b]; നിന്റെ അപ്പനെയും അമ്മയെയും ബഹുമാനിക്കുക.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊല്ലരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ നിയമവിരുദ്ധമായ മനുഷ്യവധത്തെ, അഥവാ കൊലയെ, കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘കൊല ചെയ്യരുത്’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘വഞ്ചിക്കരുത്,’ ‘അവകാശപ്പെട്ടത് നിഷേധിക്കരുത്,’ അല്ലെങ്കിൽ ‘കവർന്നെടുക്കരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം. മറ്റൊരാൾക്ക് ന്യായമായി അവകാശപ്പെട്ടത് പിടിച്ചുവയ്ക്കുകയോ ചൂഷണത്തിലൂടെ നഷ്ടപ്പെടുത്തുകയോ ചെയ്യുന്നതാണ് ഈ പദത്തിന്റെ ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: കൽപ്പനകൾ
  rationale: പത്തു കൽപ്പനകളോടുള്ള വ്യക്തമായ സൂചന നിലനിർത്തുന്ന, മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ പദം.
- source_word: οἶδας
  choice: നിനക്കറിയാമല്ലോ
  rationale: οἶδα വർത്തമാനകാല അർഥത്തിലാണ്; സന്ദർഭത്തിലെ ഓർമ്മപ്പെടുത്തൽഭാവവും സംവാദത്തിന്റെ സ്വാഭാവികതയും ‘അറിയാമല്ലോ’ പ്രകടമാക്കുന്നു.
- source_word: Μὴ φονεύσῃς
  choice: കൊല ചെയ്യരുത്
  rationale: φονεύω നിയമവിരുദ്ധമായ മനുഷ്യവധത്തെ സൂചിപ്പിക്കുന്നു; ‘കൊല ചെയ്യുക’ എന്നത് പൊതുവായ ‘കൊല്ലുക’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: Μὴ μοιχεύσῃς
  choice: വ്യഭിചാരം ചെയ്യരുത്
  rationale: വിവാഹബന്ധത്തിലെ ലൈംഗിക അവിശ്വസ്തതയെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും വ്യക്തവുമായ മലയാള നിയമ-ധാർമിക പ്രയോഗം.
- source_word: Μὴ κλέψῃς
  choice: മോഷ്ടിക്കരുത്
  rationale: κλέπτω എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള സമാനപ്രയോഗം.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: കള്ളസാക്ഷ്യം പറയരുത്
  rationale: വെറും കള്ളം പറയുന്നതിലുപരി, ψευδομαρτυρέωയിലെ സാക്ഷ്യപരവും നിയമപരവുമായ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: Μὴ ἀποστερήσῃς
  choice: അന്യായമായി അപഹരിക്കരുത്
  rationale: മറ്റൊരാൾക്ക് അവകാശപ്പെട്ടത് പിടിച്ചുവയ്ക്കുകയോ തട്ടിയെടുക്കുകയോ ചെയ്യുന്ന ἀποστερέωയുടെ വിശാല അർഥം നിലനിർത്തുന്നു; ‘വഞ്ചിക്കരുത്’ മാത്രം പറഞ്ഞാൽ നഷ്ടപ്പെടുത്തൽ എന്ന ആശയം മങ്ങാം.
- source_word: Τίμα
  choice: ബഹുമാനിക്കുക
  rationale: τιμάω ഇവിടെ വെറും ആദരവുഭാവത്തേക്കാൾ ശക്തമായ, മാതാപിതാക്കൾക്കു നൽകേണ്ട മാനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: നിന്റെ അപ്പനെയും അമ്മയെയും
  rationale: ഇരുവർക്കും ബാധകമായ possessive സ്വാഭാവിക മലയാളത്തിൽ ഒരിക്കൽ മാത്രം നൽകി, മാതാപിതാക്കളുടെ ജോടിയായ പരാമർശം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പത്തു കൽപ്പനകളുടെ ഉദ്ധരണി/സൂചന എങ്ങനെ അവതരിപ്പിക്കണം
  choice: പരിചിതമായ കൽപ്പനാശൈലി നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്ക് പദങ്ങളുടെ കൃത്യത പിന്തുടരുക
  alternative: പരമ്പരാഗതമായെങ്കിലും കൂടുതൽ വ്യാപകാർഥമുള്ള ‘കൊല്ലരുത്’ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ സ്വതന്ത്രമായ ആധുനിക പരാവർത്തനം നൽകുക
  rationale: വാക്യം കൽപ്പനകളുടെ പട്ടികയായതിനാൽ തിരിച്ചറിയാവുന്ന കൽപ്പനാഭാഷ ആവശ്യമാണ്. അതോടൊപ്പം φονεύωയെ ‘കൊല ചെയ്യുക’ എന്നും ἀποστερέωയെ അവകാശപ്പെട്ടത് അന്യായമായി അപഹരിക്കുക എന്നും അവതരിപ്പിക്കുന്നത് മൂലഭാഷയിലെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള കൽപ്പനാശൈലി. ‘അപ്പൻ’ എന്നത് നേരിട്ടുള്ള കുടുംബസംബോധനയിൽ സ്വാഭാവികമാണ്; വാക്യഘടന ചുരുക്കവും ഓർമ്മിക്കാവുന്നതുമായിരിക്കുന്നു. ഉദ്ധരണിക്കുള്ളിലെ എല്ലാ കൽപ്പനകളും ഏകീകൃത നിരോധനരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
