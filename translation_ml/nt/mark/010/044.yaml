id: MRK.10.44
reference: Mark 10:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: ml
  text: നിങ്ങളിൽ ഒന്നാമനാകാൻ ആഗ്രഹിക്കുന്നവൻ എല്ലാവരുടെയും അടിമയായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എല്ലാവരുടെയും ദാസൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം δοῦλος (ദൂലോസ്) ആണ്; മുൻവാക്യത്തിലെ ‘ശുശ്രൂഷകൻ’ എന്ന പദത്തെക്കാൾ ശക്തമായി ഇത് അധീനതയും താഴ്ന്ന നിലയും സൂചിപ്പിക്കുന്നു. ആ വ്യത്യാസം നിലനിർത്താനാണ് ഇവിടെ ‘അടിമ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: ആഗ്രഹിക്കുന്നവൻ
  rationale: അനിശ്ചിതമായ പൊതുവ്യവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; θέλω എന്ന പദത്തിന്റെ ഇച്ഛാഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: ശിഷ്യസമൂഹത്തിനുള്ളിലെ സ്ഥാനമാനത്തെ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിന് സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: πρῶτος
  choice: ഒന്നാമൻ
  rationale: സ്ഥാനത്തിലും പ്രാമുഖ്യത്തിലും ‘ആദ്യൻ’ എന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: ഭാവികാലരൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിലെ നിർദേശാത്മക ശക്തിയെ ‘വേണം’ എന്നു മാറ്റി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: πάντων
  choice: എല്ലാവരുടെയും
  rationale: δοῦλος എന്ന പദത്തോടുള്ള ബന്ധവും സാർവത്രിക വ്യാപ്തിയും വ്യക്തമാക്കുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: മുൻവാക്യത്തിലെ διάκονος എന്ന ‘ശുശ്രൂഷകൻ/സേവകൻ’ എന്നതിനെക്കാൾ ശക്തമായ, താഴ്ന്നതും അധീനവുമായ നില സൂചിപ്പിക്കുന്ന വ്യത്യാസം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വത്തെക്കുറിച്ചുള്ള വചനത്തിൽ δοῦλος എന്നതിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: സാമൂഹിക പ്രാമുഖ്യത്തിനായുള്ള ആഗ്രഹത്തെ സമ്പൂർണമായ സ്വയംതാഴ്ത്തലുമായി യേശു വിരുദ്ധമായി നിർത്തുന്നു. 43-ാം വാക്യത്തിലെ διάκονος-നേക്കാൾ ശക്തമായ δοῦλος എന്ന പദത്തെ ‘അടിമ’ എന്നു നൽകുന്നത് ഈ തീവ്രത മങ്ങാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘ഒന്നാമൻ’ സ്ഥാനപ്രാമുഖ്യത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘അടിമ’ എന്ന ശക്തമായ പദം മൂലഭാഷയിലെ ഉദ്ദേശ്യപൂർവമായ തീവ്രത നിലനിർത്തുന്നു.
