source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: ml
  text: 'യേശു അവരെ നോക്കിക്കൊണ്ട് പറഞ്ഞു: “മനുഷ്യർക്ക് ഇത് അസാധ്യമാണ്; എന്നാൽ ദൈവത്തിന് അസാധ്യമല്ല. കാരണം, ദൈവത്തിന് എല്ലാം സാധ്യമാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: അവരെ നോക്കിക്കൊണ്ട്
  rationale: ശ്രദ്ധയോടെ അവരിലേക്കു നോക്കുക എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Παρὰ ἀνθρώποις
  choice: മനുഷ്യർക്ക്
  rationale: παρά എന്നതിന്റെ കഴിവിനെയോ സാധ്യമായതിനെയോ സൂചിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിൽ ദത്തിവ് രൂപത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു; പൊതുവായ ἀνθρώποις എന്നതിന് ലിംഗസമാവേശിയായ ‘മനുഷ്യർ’ ഉപയോഗിക്കുന്നു.
- source_word: ἀδύνατον
  choice: അസാധ്യമാണ്
  rationale: മനുഷ്യരുടെ ശേഷിക്കപ്പുറമാണെന്ന ശക്തമായ പ്രസ്താവന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀλλ’ οὐ παρὰ θεῷ
  choice: എന്നാൽ ദൈവത്തിന് അസാധ്യമല്ല
  rationale: ഗ്രീക്കിലെ അപൂർണവാക്യഘടന മലയാളത്തിൽ വ്യക്തമായി പൂർത്തിയാക്കുമ്പോഴും മുൻപത്തെ ‘അസാധ്യം’ തന്നെയാണ് നിഷേധിക്കപ്പെടുന്നത് എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: πάντα γὰρ δυνατὰ παρὰ τῷ θεῷ
  choice: കാരണം, ദൈവത്തിന് എല്ലാം സാധ്യമാണ്
  rationale: γάρ-ന്റെ കാരണസൂചകബലം ‘കാരണം’ എന്നു വ്യക്തമാക്കുകയും πάντα എന്ന സമഗ്രപ്രയോഗം ‘എല്ലാം’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന് എല്ലാം സാധ്യമാണ്’ എന്ന പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: ഉറവിടത്തിലെ സമഗ്രമായ ‘എല്ലാം’ നിയന്ത്രണവാക്യം ചേർക്കാതെ നിലനിർത്തി.
  alternative: സന്ദർഭത്തിലെ രക്ഷയെക്കുറിച്ചുള്ള കാര്യങ്ങൾക്കു മാത്രമായി വാചകത്തെ പരിമിതപ്പെടുത്തുക.
  rationale: πάντα എന്ന പദം വിപുലമാണ്; സന്ദർഭം അർഥഗ്രഹണത്തിന് സഹായിക്കുന്നുവെങ്കിലും പരിഭാഷയിൽ ഉറവിടം പറയാത്ത ഒരു വ്യക്തമായ പരിധി ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ കൃത്രിമമായ അത്യുച്ച രജിസ്റ്ററോ വിഭാഗീയ പദപ്രയോഗമോ ഒഴിവാക്കി.
