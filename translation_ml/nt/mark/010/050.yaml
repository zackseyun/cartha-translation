  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: ml
  text: അവൻ തന്റെ മേലങ്കി വലിച്ചെറിഞ്ഞ്[a] ചാടിയെഴുന്നേറ്റ് യേശുവിന്റെ അടുക്കൽ ചെന്നു.
  philosophy: optimal-equivalence
