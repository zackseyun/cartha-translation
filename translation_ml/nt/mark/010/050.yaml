  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. തുടർച്ചയായ രണ്ടു പങ്കുപദങ്ങൾ ഗ്രീക്കിലെ വേഗമേറിയ പ്രവർത്തനക്രമം നിലനിർത്തുന്നു.
