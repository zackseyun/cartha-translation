  revision_rationale: ഭാവികാലമായ εἰσελεύσονται-ന്റെ അർഥം «പ്രവേശിക്കുക എത്ര പ്രയാസമായിരിക്കും» എന്നതിലൂടെ നിലനിർത്തി. ഇത് പ്രയാസത്തെ ഊന്നിപ്പറയുന്നു; അസാധ്യമാണെന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല. മറ്റ് പ്രധാന പദങ്ങളും അടിക്കുറിപ്പിന്റെ നങ്കൂരവും നിലനിർത്തിയിരിക്കുന്നു.
