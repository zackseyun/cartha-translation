id: MRK.10.23
reference: Mark 10:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: ml
  text: 'ചുറ്റും നോക്കിയശേഷം യേശു തന്റെ ശിഷ്യന്മാരോടു പറയുന്നു: “സമ്പത്തുള്ളവർ[a] ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുക എത്ര പ്രയാസമായിരിക്കും!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പണമോ വസ്തുവകകളോ ഉള്ളവർ,” “ധനമുള്ളവർ.”
    reason: χρήματα എന്ന പദത്തിന് പണം, വസ്തുവകകൾ, സമ്പത്ത് എന്നീ അർഥവ്യാപ്തികൾ ഉള്ളതിനാൽ.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: ചുറ്റും നോക്കിയിട്ട്
  rationale: ആവർത്തിച്ച് ചുറ്റും നോക്കുക എന്ന ആശയം നൽകുന്ന ക്രിയയും മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പങ്കാളിക്രിയയുടെ ക്രമവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാല ശൈലി നിലനിർത്തുന്നു.
- source_word: Πῶς δυσκόλως
  choice: എത്ര പ്രയാസമാണ്
  rationale: പ്രവേശനത്തിലെ കടുത്ത പ്രയാസത്തെ ഊന്നുന്ന ആശ്ചര്യവാചക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; അസാധ്യമാണെന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: സമ്പത്തുള്ളവർ
  rationale: ഒരു സ്ഥിരമായ സാമൂഹികവിഭാഗത്തിന്റെ പേര് മാത്രം ഉപയോഗിക്കാതെ, പണമോ വസ്തുവകകളോ കൈവശമുള്ളവരെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയാപദപ്രയോഗത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: χρήματα
  choice: സമ്പത്ത്
  rationale: പണം മാത്രമല്ല, ഭൗതിക വസ്തുവകകളും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലമായ പദമാണ്.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: മർക്കോസിലെ രാജത്വ/രാജ്യം എന്ന ഭാഷയും പതിവായ തിരുവെഴുത്തുപ്രയോഗവും സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: εἰσελεύσονται
  choice: പ്രവേശിക്കുന്നത്
  rationale: ഭാവികാല ക്രിയയുടെ സാഹചര്യാർഥം പൊതുസത്യത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ഘടനയിൽ നൽകുന്നു; ‘പ്രവേശിക്കുക’ എന്ന മുഖ്യ ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: സമ്പത്തുള്ളവർക്ക് ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നത് അസാധ്യമാണോ അത്യന്തം പ്രയാസമാണോ എന്നത്
  choice: അത്യന്തം പ്രയാസമാണെന്ന പ്രസ്താവനയായി വിവർത്തനം ചെയ്തു
  alternative: പ്രായോഗികമായി അസാധ്യമാണെന്നു വ്യക്തമാക്കുന്ന ശക്തമായ വ്യാഖ്യാനപരമായ പരിഭാഷ
  rationale: ഗ്രീക്കിലെ δυσκόλως പ്രയാസത്തെയാണ് സൂചിപ്പിക്കുന്നത്, അസാധ്യതയെ അല്ല. അതിനാൽ ഈ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം കൂടുതൽ തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം ‘പറയുന്നു’ എന്നതിലൂടെ നിലനിർത്തി; സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു.
