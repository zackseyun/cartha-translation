review_pass:
  verdict: revise
  source_fidelity: 'മുഖ്യഅർഥം കൃത്യമാണ്: യേശു അവരെ തന്റെ അടുക്കലേക്കു വിളിച്ചതും, വിജാതീയരുടെ/ജനതകളുടെ അംഗീകൃത ഭരണാധികാരികളുടെ ആധിപത്യവും അവരുടെ പ്രമുഖരുടെ അധികാരപ്രയോഗവും ശരിയായി പ്രതിഫലിക്കുന്നു. എന്നാൽ നിലവിലെ ‘നടത്തുന്നതും ... പ്രയോഗിക്കുന്നതും നിങ്ങൾക്കറിയാമല്ലോ’ എന്ന നാമവത്കൃത ഘടന ഗ്രീക്കിലെ രണ്ടു സമാന്തര ക്രിയകളുടെ നേരിട്ടുള്ള പ്രസ്താവനയെ അല്പം മങ്ങിക്കുന്നു.'
  naturalness: ‘യേശു അവരെ അടുത്തേക്കു വിളിച്ച്’ സ്വാഭാവികമാണ്. എന്നാൽ ‘... നടത്തുന്നതും ... പ്രയോഗിക്കുന്നതും നിങ്ങൾക്കറിയാമല്ലോ’ എന്നതിനു പകരം ‘... നടത്തുന്നുവെന്നും ... പ്രയോഗിക്കുന്നുവെന്നും നിങ്ങൾക്കറിയാം’ എന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ തെളിമയോടെയും സ്വാഭാവികമായും വായിക്കപ്പെടും.
  terminology: ‘വിജാതീയർ’ τῶν ἐθνῶν എന്നതിനു സന്ദർഭാനുസൃതമായ തിരഞ്ഞെടുപ്പാണ്; ‘ജനതകൾ’ എന്ന ബദൽ അടിക്കുറിപ്പിൽ ഉചിതമായി നൽകിയിട്ടുണ്ട്. ‘ഭരണാധികാരികളായി കണക്കാക്കപ്പെടുന്നവർ,’ ‘ആധിപത്യം നടത്തുക,’ ‘പ്രമുഖർ,’ ‘അധികാരം പ്രയോഗിക്കുക’ എന്നിവ സ്രോതസ്സിലെ സൂക്ഷ്മതയും സമാന്തരതയും പൊതുവേ സംരക്ഷിക്കുന്നു.
  issues:
