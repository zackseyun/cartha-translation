revisions:
- from: 'യേശു അവരെ അടുത്തേക്കു വിളിച്ച് അവരോടു പറഞ്ഞു: “വിജാതീയരുടെ[b] ഭരണാധികാരികളായി കണക്കാക്കപ്പെടുന്നവർ[a] അവരുടെമേൽ ആധിപത്യം നടത്തുന്നതും അവരുടെ പ്രമുഖർ അവരുടെമേൽ അധികാരം പ്രയോഗിക്കുന്നതും നിങ്ങൾക്കറിയാമല്ലോ.”'
  to: 'യേശു അവരെ അടുത്തേക്കു വിളിച്ച് അവരോടു പറഞ്ഞു: “വിജാതീയരുടെ[b] ഭരണാധികാരികളായി കണക്കാക്കപ്പെടുന്നവർ[a] അവരുടെമേൽ ആധിപത്യം നടത്തുന്നുവെന്നും അവരുടെ പ്രമുഖർ അവരുടെമേൽ അധികാരം പ്രയോഗിക്കുന്നുവെന്നും നിങ്ങൾക്കറിയാം.”'
  rationale: അർഥത്തിലോ വ്യാഖ്യാനത്തിലോ മാറ്റം വരുത്താതെ, ഗ്രീക്കിലെ സമാന്തരമായ രണ്ടു ക്രിയകളെ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമായ നേരിട്ടുള്ള ക്രിയാരൂപങ്ങളാക്കി. നിലവിലുള്ള അടിക്കുറിപ്പുകളുടെ ആങ്കറുകളും ഉള്ളടക്കവും സ്രോതസ്സിനൊത്തതിനാൽ നിലനിർത്തി.
