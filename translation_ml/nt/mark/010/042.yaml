id: MRK.10.42
reference: Mark 10:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: ml
  text: 'യേശു അവരെ അടുത്തേക്കു വിളിച്ച് അവരോടു പറഞ്ഞു: “വിജാതീയരുടെ[b] ഭരണാധികാരികളായി കണക്കാക്കപ്പെടുന്നവർ[a] അവരുടെമേൽ ആധിപത്യം നടത്തുന്നുവെന്നും അവരുടെ പ്രമുഖർ അവരുടെമേൽ അധികാരം പ്രയോഗിക്കുന്നുവെന്നും നിങ്ങൾക്കറിയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിജാതീയരെ ഭരിക്കുന്നവരെന്നു തോന്നുന്നവർ.”
    reason: δοκοῦντες എന്ന പദത്തിന് ‘കണക്കാക്കപ്പെടുന്നവർ’ എന്നും ‘തോന്നുന്നവർ’ എന്നും അർഥസാധ്യതകളുണ്ട്.
  - marker: b
    text: അഥവാ, “ജനതകളുടെ.”
    reason: ἔθνη എന്ന പദം സന്ദർഭാനുസരണം ‘വിജാതീയർ’ എന്നോ പൊതുവായി ‘ജനതകൾ’ എന്നോ വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: അവരെ അടുത്തേക്കു വിളിച്ച്
  rationale: മധ്യമപ്രയോഗത്തിലുള്ള ക്രിയ ഒരാളെ തന്റെ അടുത്തേക്കു വിളിക്കുന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായും ബന്ധസൂചന നിലനിർത്തിയും ഇതു പ്രകടിപ്പിക്കുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലം സ്വാഭാവികമാണ്; പ്രസംഗപ്രവർത്തനത്തിന്റെ അർഥം മാറുന്നില്ല.
- source_word: Οἴδατε
  choice: നിങ്ങൾക്കറിയാമല്ലോ
  rationale: οἶδα ഇവിടെ വർത്തമാനകാല അർഥമുള്ള സ്ഥിരമായ അറിവിനെ സൂചിപ്പിക്കുന്നു. ‘-ല്ലോ’ യേശു ശിഷ്യന്മാർ അറിയുന്ന യാഥാർഥ്യം ഓർമിപ്പിക്കുന്ന സംഭാഷണഭാവം നൽകുന്നു.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: ഭരണാധികാരികളായി കണക്കാക്കപ്പെടുന്നവർ
  rationale: δοκέω പൊതുവായി അങ്ങനെ കരുതപ്പെടുക/അംഗീകരിക്കപ്പെടുക എന്ന അർഥം വഹിക്കാം. അവരുടെ അധികാരം വെറും ഭാവനയാണെന്ന് തീർപ്പാക്കാതെ ഗ്രീക്കിലെ വിലയിരുത്തൽസൂചന ഇതു നിലനിർത്തുന്നു.
- source_word: τῶν ἐθνῶν
  choice: വിജാതീയരുടെ
  rationale: യഹൂദസന്ദർഭത്തിൽ ἔθνη യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കാം. ‘വിജാതീയർ’ ആ സന്ദർഭവ്യത്യാസം സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു; ‘ജനതകൾ’ എന്ന വിശാല അർഥവും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κατακυριεύουσιν
  choice: ആധിപത്യം നടത്തുന്നു
  rationale: സാധാരണ ഭരിക്കുന്നതിലുപരി മേൽക്കോയ്മയോടെ കീഴടക്കി ഭരിക്കുന്ന പ്രതികൂലഭാവം ഈ പ്രയോഗം നൽകുന്നു.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: അവരുടെ പ്രമുഖർ
  rationale: μέγαλοι ഇവിടെ സാമൂഹികമായോ രാഷ്ട്രീയമായോ പ്രാധാന്യവും ശക്തിയും ഉള്ളവരെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത പ്രത്യേക ഔദ്യോഗിക പദവി ചേർക്കാതെ അതു വ്യക്തമാക്കുന്നു.
- source_word: κατεξουσιάζουσιν
  choice: അധികാരം പ്രയോഗിക്കുന്നു
  rationale: അധികാരം മറ്റുള്ളവരുടെമേൽ ചെലുത്തുന്നതാണ് ക്രിയയുടെ അടിസ്ഥാനഭാവം. സമാന്തരമായ മുൻക്രിയയിലെ അടിച്ചമർത്തൽസൂചനയുമായി വ്യത്യാസവും ഇതു നിലനിർത്തുന്നു.
theological_decisions:
- issue: τῶν ἐθνῶν എന്നതിന്റെ സൂചിതവിഭാഗം
  choice: വിജാതീയർ
  alternative: ജനതകൾ
  rationale: മർക്കോസിന്റെ യഹൂദപശ്ചാത്തലത്തിൽ യഹൂദരല്ലാത്ത ജനങ്ങളുടെ ഭരണരീതിയോടുള്ള താരതമ്യം പ്രസക്തമാണ്. എന്നാൽ പദത്തിന്റെ വിശാലമായ ‘ജനതകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: δοκοῦντες എന്നതിന്റെ ഭാവം
  choice: കണക്കാക്കപ്പെടുന്നവർ
  alternative: ഭരിക്കുന്നവരെന്നു തോന്നുന്നവർ
  rationale: അവർക്ക് യഥാർഥ അധികാരമില്ലെന്ന് വാക്യം നിർബന്ധമായി പറയുന്നില്ല. പൊതുഅംഗീകാരമോ പ്രത്യക്ഷതയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിലെ യഥാർഥ അനിശ്ചിതത്വം മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർന്ന് സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ആധിപത്യം നടത്തുന്നു’ എന്നും ‘അധികാരം പ്രയോഗിക്കുന്നു’ എന്നും നൽകി സമാന്തരക്രിയകളുടെ ബന്ധവും സൂക്ഷ്മവ്യത്യാസവും നിലനിർത്തി. അടിക്കുറിപ്പുസൂചകങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
