reference: Mark 10:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ ഹൃദയകാഠിന്യം[b] നിമിത്തം അദ്ദേഹം[a] ഈ കല്പന[c] നിങ്ങൾക്കു എഴുതി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, മുൻവാക്യത്തിൽ പരാമർശിച്ച മോശെ.
    reason: cross_reference
  - marker: b
    text: അല്ലെങ്കിൽ ‘ഹൃദയത്തിന്റെ കാഠിന്യം.’
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘ആജ്ഞ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: സംഭാഷണത്തിലെ നേരിയ വൈരുധ്യവും മോശെയെക്കുറിച്ചുള്ള പരാമർശത്തോടുള്ള യേശുവിന്റെ പ്രതികരണവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Πρὸς
  choice: നിമിത്തമാണ്
  rationale: ഇവിടെ πρός ആ അവസ്ഥയെ പരിഗണിച്ചുള്ള കാരണബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിമിത്തമാണ്’ ആ ഭാവം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: σκληροκαρδίαν
  choice: ഹൃദയകാഠിന്യം
  rationale: ഗ്രീക്കിലെ ഹൃദയത്തിന്റെ കാഠിന്യം എന്ന രൂപകം നിലനിർത്തുകയും ധാർഷ്ട്യം അല്ലെങ്കിൽ പിടിവാശി എന്നൊന്നിലേക്ക് അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἔγραψεν
  choice: അദ്ദേഹം എഴുതിയത്
  rationale: ഗ്രീക്കിൽ കർത്താവ് പരോക്ഷമാണ്; മുൻവാക്യത്തിലെ മോശെയെയാണ് സൂചിപ്പിക്കുന്നത്. പേരിനെ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ഈ പരോക്ഷത നിലനിർത്തുന്നു.
- source_word: ἐντολήν
  choice: കല്പന
  rationale: അധികാരപൂർവമായ നിയമനിർദേശം എന്ന അർഥവും മോശൈക നിയമത്തെക്കുറിച്ചുള്ള ഔപചാരിക ഭാവവും നൽകുന്നു.
- source_word: ταύτην
  choice: ഈ
  rationale: ചർച്ചയിലുള്ള പ്രത്യേക നിയമനിർദേശത്തെ ചൂണ്ടിക്കാണിക്കുന്ന സർവനാമത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
theological_decisions:
- issue: ‘എഴുതി’ എന്ന ക്രിയയുടെ കർത്താവായി മോശെയുടെ പേര് വ്യക്തമാക്കണമോ
  choice: മുൻവാക്യത്തിലെ മോശെയെ സൂചിപ്പിക്കുന്ന ‘അദ്ദേഹം’ നിലനിർത്തി
  alternative: ‘മോശെ എഴുതിയത്’ എന്നു പേര് വ്യക്തമാക്കുക
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം മോശെയുടെ പേര് ആവർത്തിക്കുന്നില്ല. ‘അദ്ദേഹം’ എന്നു നൽകുന്നത് സന്ദർഭബന്ധം കാത്തുസൂക്ഷിക്കുകയും മൂലപാഠത്തിലില്ലാത്ത ഊന്നൽ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: σκληροκαρδία എന്ന പദത്തിന്റെ ബൈബിൾപരവും ധാർമികവുമായ രൂപകം എങ്ങനെ നിലനിർത്തണം
  choice: ‘ഹൃദയകാഠിന്യം’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘കടുത്ത ഹൃദയം’ അല്ലെങ്കിൽ ‘പിടിവാശി’
  rationale: ‘ഹൃദയകാഠിന്യം’ മൂലപാഠത്തിലെ രൂപകവും അതിന്റെ ധാർമിക ഗൗരവവും നിലനിർത്തുന്നു; അതേസമയം പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ വാക്യത്തിന്റെ ഔപചാരികവും തിരുവെഴുത്തുസംബന്ധവുമായ ഭാവം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ വിശദീകരിക്കുന്ന പദത്തോടു ചേർത്തിരിക്കുന്നു.
