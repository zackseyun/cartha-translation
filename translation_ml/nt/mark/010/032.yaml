reference: Mark 10:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: ml
  text: അവർ യെരൂശലേമിലേക്കു കയറിപ്പോകുന്ന വഴിയിലായിരുന്നു[a]. യേശു അവരുടെ മുമ്പിൽ നടന്നുകൊണ്ടിരുന്നു. അവർ അമ്പരന്നിരുന്നു; പിന്നാലെ നടന്നവർ ഭയപ്പെട്ടിരുന്നു. യേശു പന്ത്രണ്ടുപേരെയും വീണ്ടും കൂടെ കൂട്ടിക്കൊണ്ട്[b], തനിക്കു സംഭവിക്കാനിരിക്കുന്ന കാര്യങ്ങൾ അവരോടു പറയാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യാത്രാമധ്യേ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വീണ്ടും മാറ്റിനിർത്തി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: വഴിയിലായിരുന്നു
  rationale: യാത്രയുടെ മൂർത്തമായ പശ്ചാത്തലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘യാത്രാമധ്യേ’ എന്ന അർഥവും സന്ദർഭത്തിൽ സാധ്യമാണ്.
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിലേക്കു കയറിപ്പോകുന്ന
  rationale: യെരൂശലേമിലേക്കുള്ള ഉയർന്നുപോകലും പരമ്പരാഗത തീർഥയാത്രാ പ്രയോഗവും ‘കയറിപ്പോകുക’ സംരക്ഷിക്കുന്നു.
- source_word: προάγων αὐτούς
  choice: അവരുടെ മുമ്പിൽ നടന്നുകൊണ്ടിരുന്നു
  rationale: യേശു സംഘത്തിനു മുന്നിലായിരുന്നുവെന്ന സ്ഥാനം നേരിട്ട് വ്യക്തമാക്കുന്നു; ‘അവരെ നയിച്ചു’ എന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: ἐθαμβοῦντο
  choice: അവർ അമ്പരന്നിരുന്നു
  rationale: ശക്തമായ വിസ്മയമോ അമ്പരപ്പോ സൂചിപ്പിക്കുകയും ഭയത്തെ സൂചിപ്പിക്കുന്ന അടുത്ത ക്രിയയിൽനിന്ന് വികാരം വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: പിന്നാലെ വന്നവർ
  rationale: ആ സംഘം ആരൊക്കെയെന്ന് അനാവശ്യമായി നിർണ്ണയിക്കാതെ പങ്കാളിപദത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐφοβοῦντο
  choice: ഭയപ്പെട്ടിരുന്നു
  rationale: തുടർന്നുനിന്ന ഭയാവസ്ഥയെ അലങ്കാരമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: പന്ത്രണ്ടുപേരെയും ... കൂടെ കൂട്ടിക്കൊണ്ട്
  rationale: παραλαμβάνω എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘കൂടെ സ്വീകരിക്കുക/കൂട്ടിക്കൊണ്ടുപോകുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘മാറ്റിനിർത്തി’ എന്ന സന്ദർഭവ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: പ്രവർത്തനത്തിന്റെ ആവർത്തനം ലളിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἤρξατο ... λέγειν
  choice: പറയാൻ തുടങ്ങി
  rationale: ആരംഭഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: തനിക്കു സംഭവിക്കാനിരിക്കുന്ന കാര്യങ്ങൾ
  rationale: സമീപഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; വിധിനിശ്ചയം എന്ന കൂടുതൽ ശക്തമായ ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: വിവരണത്തിലെ രണ്ടു വിഭാഗങ്ങളുടെ വൈകാരിക പ്രതികരണങ്ങൾ
  choice: ἐθαμβοῦντο എന്നത് ‘അമ്പരന്നിരുന്നു’ എന്നും ἐφοβοῦντο എന്നത് ‘ഭയപ്പെട്ടിരുന്നു’ എന്നും വ്യത്യസ്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടിനെയും പൊതുവായി വിസ്മയത്തിന്റെയോ ഭയത്തിന്റെയോ രൂപങ്ങളായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്കിൽ രണ്ടു വ്യത്യസ്ത ക്രിയകളുണ്ട്. അവയെ വേർതിരിക്കുന്നത് വികാരങ്ങളെ സമീകരിക്കാതെ വിവരണത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
- issue: παραλαβών എന്നതിൽ സ്വകാര്യമായി മാറ്റിനിർത്തിയെന്ന ആശയം വ്യക്തമാക്കണമോ
  choice: ‘കൂടെ കൂട്ടിക്കൊണ്ട്’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ‘മാറ്റിനിർത്തി’ എന്ന് സന്ദർഭാർത്ഥം വ്യക്തമാക്കുക.
  rationale: മൂലക്രിയ സ്വതവേ ‘മാറ്റിനിർത്തുക’ എന്ന് നിർബന്ധിക്കുന്നില്ല. സ്വകാര്യ ഉപദേശത്തിന്റെ സന്ദർഭം സാധ്യമെങ്കിലും, മുഖ്യപാഠം അതിനെ ഏക അർഥമായി ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി ചെറുവാക്യങ്ങളാക്കി; ആശയബന്ധവും അപൂർണ്ണകാലത്തിന്റെ തുടർച്ചാഭാവവും നിലനിർത്തി. ‘യെരൂശലേം’, ‘പന്ത്രണ്ടുപേർ’ എന്നീ പരിചിത ബൈബിൾ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു.
