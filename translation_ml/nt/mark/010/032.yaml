    issue: ‘പിന്നാലെ വന്നവർ’ may imply later arrivals.
    rationale: οἱ ... ἀκολουθοῦντες denotes those following, not specifically those who came later. In this walking context, ‘പിന്നാലെ നടന്നവർ’ is more precise and idiomatic.
