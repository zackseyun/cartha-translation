  text: οἱ δὲ περισσῶς ἐξεπλήσσοντο λέγοντες πρὸς ⸀ἑαυτούς· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: ml
  text: 'അവർ അത്യന്തം വിസ്മയിച്ച് പരസ്പരം പറഞ്ഞു: “അങ്ങനെയെങ്കിൽ ആർക്കാണ് രക്ഷിക്കപ്പെടാൻ കഴിയുക?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: അവർ
  rationale: സന്ദർഭത്തിൽ ഇത് ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്നു. δέ നൽകുന്ന തുടർച്ച മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ പ്രത്യേകം ബന്ധകപദമില്ലാതെയും വ്യക്തമാകുന്നു.
- source_word: περισσῶς
  choice: അത്യന്തം
  rationale: പ്രതികരണത്തിന്റെ അതിശക്തമായ അളവ് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξεπλήσσοντο
  choice: വിസ്മയിച്ച്
  rationale: ശക്തമായ അമ്പരപ്പ് എന്ന അർഥം നൽകുന്നു; തുടർന്ന് വരുന്ന സമകാലിക സംസാരക്രിയയുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: λέγοντες πρὸς ἑαυτούς
  choice: പരസ്പരം പറഞ്ഞു
  rationale: ബഹുവചന സംഭാഷണസന്ദർഭത്തിൽ πρὸς ἑαυτούς എന്നത് പരസ്പരസംസാരത്തെ സൂചിപ്പിക്കുന്നു. 'തങ്ങളോടുതന്നെ' എന്ന അക്ഷരാർഥപരമായ രൂപത്തേക്കാൾ ഇതാണ് ഇവിടെ സ്വാഭാവികം.
- source_word: Καὶ τίς
  choice: അങ്ങനെയെങ്കിൽ ആർക്ക്
  rationale: മുൻപത്തെ പ്രസ്താവനയിൽനിന്നുള്ള നിഗമനാത്മക ചോദ്യഭാവം മലയാളത്തിൽ 'അങ്ങനെയെങ്കിൽ' വ്യക്തമായി കൈമാറുന്നു.
- source_word: δύναται σωθῆναι
  choice: രക്ഷിക്കപ്പെടാൻ കഴിയുക
  rationale: δύναται എന്ന സാധ്യശേഷിയും σωθῆναι എന്ന ദൈവിക രക്ഷയെ സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: σωθῆναι എന്ന രക്ഷാഭാഷയുടെ വ്യാപ്തി
  choice: രക്ഷിക്കപ്പെടാൻ
  alternative: വിടുവിക്കപ്പെടാൻ
  rationale: ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നതിനെക്കുറിച്ചുള്ള സമീപസന്ദർഭം കണക്കിലെടുത്ത്, താൽക്കാലിക വിടുതൽ മാത്രമല്ല ദൈവത്തിന്റെ രക്ഷ എന്ന വിപുലമായ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. ഗ്രീക്കിലെ ശക്തമായ വിസ്മയവും നിഗമനാത്മക ചോദ്യവും സംക്ഷിപ്തമായി നിലനിർത്തിയിരിക്കുന്നു.
