id: MRK.10.31
reference: Mark 10:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ⸀οἱ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: ml
  text: എന്നാൽ ആദ്യരായ പലരും അവസാനരാകും; അവസാനരായവർ ആദ്യരാകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: പലരും
  rationale: ഈ വിശേഷണം ഇവിടെ നാമരൂപത്തിൽ ഉപയോഗിച്ച് ഒരു വിശാലമായ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; എല്ലാവരെയും ഉൾക്കൊള്ളുന്നില്ല. ‘പലരും’ എന്നത് ആളുകളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും അനാവശ്യമായ വിശദീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: δέ ഇവിടെ നേരിയ വൈരുധ്യമോ ആശയമാറ്റമോ അടയാളപ്പെടുത്തുന്നു. മുൻവാക്യത്തിലെ വാഗ്ദാനത്തിനു പിന്നാലെയുള്ള സ്ഥാനമാറ്റത്തിന്റെ തത്ത്വം വ്യക്തമാക്കാൻ ‘എന്നാൽ’ യോജിക്കുന്നു.
- source_word: ἔσονται
  choice: ആകും
  rationale: εἰμί എന്ന ക്രിയയുടെ ഭാവികാലരൂപമാണിത്. ആധുനിക മലയാളത്തിൽ ലളിതമായ ഭാവികാല സംയോജകക്രിയയായി ‘ആകും’ സ്വാഭാവികമാണ്.
- source_word: πρῶτοι
  choice: ആദ്യരായ
  rationale: ഇവിടെ πρῶτοι ക്രമത്തെക്കാൾ സ്ഥാനമോ മുൻനിലയോ സൂചിപ്പിക്കുന്നു. ‘ആദ്യർ’ എന്ന പദം വിപരീതസമാന്തരതയും സൂക്തരൂപവും നിലനിർത്തുന്നു.
- source_word: ἔσχατοι
  choice: അവസാനരാകും
  rationale: πρῶτοι എന്നതിനോടുള്ള നേരിട്ടുള്ള വിപരീതമായി ἔσχατοι സ്ഥാനത്തിലോ നിലയിലോ അവസാനമുള്ളവരെ സൂചിപ്പിക്കുന്നു. ‘അവസാനർ’ ആ വിരോധം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: οἱ ἔσχατοι
  choice: അവസാനരായവർ
  rationale: നിശ്ചയോപപദം വിശേഷണത്തെ നാമരൂപമാക്കുന്നു. ‘അവസാനരായവർ’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: καὶ
  choice: ;
  rationale: καὶ രണ്ട് സമാന്തര ഭാഗങ്ങളെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ അർദ്ധവിരാമം ഉപയോഗിക്കുന്നത് ആവർത്തിച്ചുള്ള ‘കൂടാതെ/ഉം’ ഒഴിവാക്കി സൂക്തത്തിന്റെ മുറുക്കവും സമാന്തരഘടനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്ഥാനമാറ്റവചനത്തിന്റെ സ്വഭാവം
  choice: അന്ത്യകാലപരമായ സ്ഥാനമാറ്റത്തിന്റെ പൊതുതത്ത്വമായി തുറന്ന സൂക്തരൂപത്തിൽ നിലനിർത്തുക.
  alternative: ‘ആദ്യർ’, ‘അവസാനർ’ എന്നിവയെ സമ്പന്നർ-ദരിദ്രർ, ശിഷ്യർ-പുറത്തുള്ളവർ, അല്ലെങ്കിൽ രക്ഷിക്കപ്പെട്ടവർ-രക്ഷിക്കപ്പെടാത്തവർ എന്നിങ്ങനെ പ്രത്യേക വിഭാഗങ്ങളായി നിർവചിക്കുക.
  rationale: വാക്യം ഒരു വിശാലമായ വിരോധാഭാസതത്ത്വം പ്രസ്താവിക്കുന്നുവെങ്കിലും വിഭാഗങ്ങളെ കൃത്യമായി നിർവചിക്കുന്നില്ല; πολλοὶ എന്നത് ഇതിനെ ഓരോ വ്യക്തിക്കും ബാധകമായ സമ്പൂർണനിയമമാക്കുന്നതും തടയുന്നു. അതിനാൽ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംഘർഷവും വിവർത്തനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘ആദ്യർ/അവസാനർ’ എന്ന നേരിട്ടുള്ള വിപരീതം സൂക്തത്തിന്റെ ചുരുക്കവും ഊന്നലും നിലനിർത്തുന്നു. വിശദീകരണപരമായ പദങ്ങൾ ചേർത്തിട്ടില്ല; അതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
