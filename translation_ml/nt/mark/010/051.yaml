source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: ml
  text: 'യേശു അവനോടു മറുപടിയായി ചോദിച്ചു: “ഞാൻ നിനക്കുവേണ്ടി എന്തു ചെയ്യണമെന്നാണ് നീ ആഗ്രഹിക്കുന്നത്?” അന്ധൻ അവനോടു പറഞ്ഞു: “റബ്ബൂനി[a], എനിക്കു വീണ്ടും കാഴ്ച ലഭിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘റബ്ബൂനി’ എന്നത് ‘എന്റെ ഗുരുവേ’ അല്ലെങ്കിൽ ‘എന്റെ യജമാനനേ’ എന്നർഥമുള്ള അരമായ ഭാഷയിലെ അഭിസംബോധനയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: ചോദിച്ചു
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘മറുപടിയായി പറഞ്ഞു’ എന്ന ഘടനയാണെങ്കിലും ഇവിടെ തുടർന്നുവരുന്നത് ഒരു ചോദ്യമാണ്. ആധുനിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു പറയുന്നത് സംഭാഷണത്തിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു; മറുപടി എന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: Τί σοι θέλεις ποιήσω
  choice: ഞാൻ നിനക്കുവേണ്ടി എന്തു ചെയ്യണമെന്നാണ് നീ ആഗ്രഹിക്കുന്നത്?
  rationale: σοι എന്ന ദാതിവിഭക്തിയുടെ ഗുണഭോക്തൃഭാവം ‘നിനക്കുവേണ്ടി’ എന്നും θέλεις എന്ന ഇച്ഛാഭാവം ‘ആഗ്രഹിക്കുന്നത്’ എന്നും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὁ τυφλὸς
  choice: അന്ധൻ
  rationale: വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികവും വ്യക്തിപരവുമായ മലയാളരൂപമാണിത്.
- source_word: Ραββουνι
  choice: റബ്ബൂനി
  rationale: ഗ്രീക്ക് മൂലപാഠം സംരക്ഷിച്ചിരിക്കുന്ന അരമായ അഭിസംബോധനയുടെ ചരിത്രപരവും വികാരപരവുമായ സവിശേഷത നിലനിർത്താൻ ലിപ്യന്തരണം ചെയ്തു; അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἵνα ἀναβλέψω
  choice: എനിക്കു വീണ്ടും കാഴ്ച ലഭിക്കണം
  rationale: രോഗശാന്തിയുടെ ഈ സന്ദർഭത്തിൽ ἀναβλέπω എന്നത് ‘വീണ്ടും കാണുക/കാഴ്ച വീണ്ടെടുക്കുക’ എന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ അപേക്ഷയുടെ ഉദ്ദേശ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന രൂപമാണിത്.
theological_decisions:
- issue: Ραββουνι എന്ന അഭിസംബോധനയുടെ പരിഭാഷ
  choice: മുഖ്യപാഠത്തിൽ ‘റബ്ബൂനി’ നിലനിർത്തി അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു
  alternative: ‘എന്റെ ഗുരുവേ’ അല്ലെങ്കിൽ ‘എന്റെ യജമാനനേ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  rationale: മൂലഗ്രീക്ക് ഒരു സാധാരണ ഗ്രീക്ക് പദവി ഉപയോഗിക്കാതെ സെമിറ്റിക് അഭിസംബോധന ലിപ്യന്തരം ചെയ്യുന്നു. അതിന്റെ പാഠസ്വഭാവവും അഭിസംബോധനയുടെ ഊഷ്മളതയും നിലനിർത്തിക്കൊണ്ട് വായനക്കാരന് അർഥം വ്യക്തമാക്കാൻ അടിക്കുറിപ്പ് ഉചിതമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ പങ്കാളിക്രിയയും ‘പറഞ്ഞു’ എന്ന ആവർത്തനവും യാന്ത്രികമായി പകർത്താതെ സ്വാഭാവിക മലയാളവാക്യഘടന ഉപയോഗിച്ചു; എന്നാൽ ദാതിവിഭക്തി, ഇച്ഛാഭാവം, വീണ്ടും കാഴ്ച ലഭിക്കണമെന്ന അപേക്ഷ എന്നിവ സംരക്ഷിച്ചു.
