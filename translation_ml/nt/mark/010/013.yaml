source:
  edition: SBLGNT
  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: ml
  text: അവൻ കുട്ടികളെ തൊടുന്നതിനായി, ആളുകൾ അവരെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നുകൊണ്ടിരുന്നു[a]. എന്നാൽ ശിഷ്യന്മാർ ആ ആളുകളെ ശാസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചെറിയ കുട്ടികളെ.’ παιδία എന്ന ഗ്രീക്കുപദം പൊതുവായി കുട്ടികളെയും, അതിൽ ചെറിയ കുട്ടികളെയും, സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: കൊണ്ടുവന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം കഴിഞ്ഞകാലത്തെ തുടർച്ചയായതോ ആവർത്തിച്ചിരുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ προσφέρω എന്നതിന് ഒരാളുടെ അടുക്കൽ കൊണ്ടുവരുക എന്ന അർഥമാണ്.
- source_word: παιδία
  choice: കുട്ടികളെ
  rationale: παιδία പൊതുവായി കുട്ടികളെ സൂചിപ്പിക്കാം; ചെറിയ കുട്ടികളും ഇതിൽ ഉൾപ്പെടാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികവും വിശാലവുമായ 'കുട്ടികൾ' അനുയോജ്യമാണ്.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: അവൻ അവരെ തൊടേണ്ടതിന്
  rationale: ἵνα സഹിതമുള്ള വിധിലിംഗം ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു. ἅπτομαι എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ 'തൊടുക' നിലനിർത്തുന്നു; സമാന്തരവിവരണങ്ങളിൽ നിന്നുള്ള 'കൈ വെക്കുക' ഇവിടെ ചേർക്കുന്നില്ല.
- source_word: ἐπετίμησαν
  choice: ശാസിച്ചു
  rationale: ἐπιτιμάω ശക്തമായി ശാസിക്കുകയോ കുറ്റപ്പെടുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആ ശക്തി മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ 'ശാസിച്ചു' പ്രകടിപ്പിക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവരെ
  rationale: സർവനാമം ഏറ്റവും സ്വാഭാവികമായി കുട്ടികളെ കൊണ്ടുവന്ന ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്. എന്നാൽ ഗ്രീക്കിലെ സർവനാമരൂപംപോലെ മലയാളത്തിലും 'അവരെ' എന്ന് വെച്ച് സന്ദർഭത്തിൽനിന്ന് പൂർവപദം ഗ്രഹിക്കാനാകുന്ന വിധം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: കുട്ടികളെ കൊണ്ടുവരുന്ന പ്രവൃത്തിയും ശിഷ്യന്മാരുടെ പ്രതികരണവും തമ്മിലുള്ള ലഘുവായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാർ ശാസിച്ചത് ആരെ എന്നത്
  choice: കുട്ടികളെ കൊണ്ടുവന്ന ആളുകളെ ശിഷ്യന്മാർ ശാസിച്ചു
  alternative: ശിഷ്യന്മാർ കുട്ടികളെ ശാസിച്ചു
  rationale: προσέφερον എന്ന ക്രിയയുടെ പരോക്ഷമായി സൂചിപ്പിക്കപ്പെട്ട കർത്താവായ കൊണ്ടുവന്ന ആളുകളാണ് αὐτοῖς എന്നതിന്റെ ഏറ്റവും യോജിച്ച പൂർവപദം. അടുത്ത വാക്യത്തിലെ തടയുന്ന പ്രവൃത്തിയോടുള്ള യേശുവിന്റെ പ്രതികരണവും ഇതിന് അനുകൂലമാണ്; എങ്കിലും മുഖ്യപാഠത്തിൽ സർവനാമം നിലനിർത്തിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ച/ആവർത്തനഭാവം 'കൊണ്ടുവന്നുകൊണ്ടിരുന്നു' എന്ന രൂപത്തിൽ നിലനിർത്തി. 'തൊടുക' എന്ന നേരിട്ടുള്ള പദം ഉപയോഗിച്ച് സമാന്തരവിവരണങ്ങളിൽ നിന്നുള്ള വിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
