language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “നിന്റെ മഹിമയിൽ ഞങ്ങളിൽ ഒരാൾ നിന്റെ വലത്തും മറ്റൊരാൾ നിന്റെ ഇടത്തും ഇരിക്കാൻ ഞങ്ങൾക്ക് അനുവദിച്ചുതരണമേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν ἵνα
  choice: ഞങ്ങൾക്ക് അനുവദിച്ചുതരണമേ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഞങ്ങൾക്ക് തരണമേ, അങ്ങനെ…’ എന്ന ഘടനയുടെ അപേക്ഷാഭാവവും തുടർന്നുള്ള ഉദ്ദേശ്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: εἷς ... καὶ εἷς
  choice: ഞങ്ങളിൽ ഒരാൾ ... മറ്റൊരാൾ
  rationale: സംസാരിക്കുന്ന രണ്ടുപേരിൽ ഓരോരുത്തരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ സമാന്തരഘടന നിലനിർത്തുന്നു.
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: നിന്റെ വലത്തും ... നിന്റെ ഇടത്തും
  rationale: ബഹുമാനസ്ഥാനങ്ങളെ സൂചിപ്പിക്കുന്ന ദിശാപദങ്ങൾ ലളിതവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐν τῇ δόξῃ σου
  choice: നിന്റെ മഹത്ത്വത്തിൽ
  rationale: δόξα എന്ന പദത്തിന്റെ രാജകീയവും വെളിപ്പെടുന്നതുമായ മഹിമാസൂചനയെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നിന്റെ മഹത്ത്വത്തിൽ’ എന്നതിന്റെ സ്വഭാവം
  choice: നിന്റെ മഹത്ത്വത്തിൽ
  alternative: നിന്റെ മഹത്ത്വരാജ്യത്തിൽ
  rationale: മൂലപാഠത്തിൽ ‘രാജ്യം’ എന്ന പദമില്ല. രാജകീയ പശ്ചാത്തലം സാദ്ധ്യമാണെങ്കിലും അതിനെ പരിഭാഷയിൽ ചേർത്ത് അർഥം നിർണ്ണയിക്കാതെ മൂലത്തിലെ തുറന്ന അർഥം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അപേക്ഷയുടെ വിനയഭാവത്തിന് ‘അനുവദിച്ചുതരണമേ’ ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാപരമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
