  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: ml
  text: ഒരു ധനികൻ ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നതിനെക്കാൾ ഒട്ടകം സൂചിക്കണ്ണിലൂടെ കടക്കുന്നത് എളുപ്പമാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൂചിക്കണ്ണ്’ എന്നു പറയുന്നത് തുന്നൽസൂചിയിലെ ദ്വാരത്തെയാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഒട്ടകം’ എന്നതിനു പകരം ‘കയർ’ എന്നു ചിലർ നിർദേശിച്ചിട്ടുണ്ടെങ്കിലും ഇവിടത്തെ ഗ്രീക്ക് പാഠത്തിൽ ‘ഒട്ടകം’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: എളുപ്പമാണ്
  rationale: താരതമ്യാർഥമുള്ള പദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; വാക്യത്തിലെ അതിശയോക്തിപരമായ താരതമ്യം നിലനിർത്തുന്നു.
- source_word: κάμηλον
  choice: ഒട്ടകം
  rationale: സ്രോതസ്സിലെ κάμηλος എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘ഒട്ടകം’ തന്നെയാണ്; ദൃശ്യമാകുന്ന അസാധ്യതയുടെ ചിത്രം മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: സൂചിക്കണ്ണിലൂടെ
  rationale: തുന്നൽസൂചിയിലെ ദ്വാരത്തെയാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘സൂചിക്കണ്ണ്’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: διελθεῖν
  choice: കടക്കുന്നത്
  rationale: ‘കടന്നുപോകുക’ എന്ന അർഥം ചിത്രത്തിന്റെ ഭൗതിക സ്വഭാവത്തിന് യോജിച്ച ലളിതമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πλούσιον
  choice: ഒരു ധനികൻ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു; ‘ഒരു ധനികൻ’ അതിന്റെ വ്യാകരണരൂപവും പ്രതിനിധാനപരമായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നത്
  rationale: സുവിശേഷങ്ങളിലെ മുഖ്യപ്രയോഗമായ ‘ദൈവരാജ്യം’ നിലനിർത്തുകയും εἰσελθεῖν എന്നതിന് സ്വാഭാവികമായി ‘പ്രവേശിക്കുക’ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഒട്ടകം–സൂചിക്കണ്ണ് ദൃശ്യത്തിന്റെ വ്യാഖ്യാനം
  choice: ഒട്ടകവും യഥാർഥ സൂചിക്കണ്ണും ഉൾപ്പെടുന്ന ശക്തമായ അതിശയോക്തിചിത്രം അതേപടി നിലനിർത്തി.
  alternative: ‘സൂചിവാതിൽ’ എന്ന പേരിലുള്ള ചെറിയ കവാടത്തെക്കുറിച്ചുള്ള പരാമർശമായി കാണുക, അല്ലെങ്കിൽ ‘ഒട്ടകം’ എന്നതിനു പകരം ‘കയർ’ എന്നു വായിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം അത്യന്തം അസാധ്യമായ ഒരു ദൃശ്യം തന്നെയാണ് അവതരിപ്പിക്കുന്നത്. പിൽക്കാല വിശദീകരണങ്ങൾ ചേർത്ത് അതിന്റെ ശക്തിയോ ദൈവരാജ്യപ്രവേശത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കമോ മയപ്പെടുത്തരുത്.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ പദക്രമം മലയാളത്തിൽ സ്വാഭാവികമായ താരതമ്യഘടനയാക്കി; വാക്യത്തിന്റെ ഊന്നലും കടുത്ത അതിശയോക്തിയും നിലനിർത്തി. ‘ധനികൻ’ വ്യാകരണപരമായ പുല്ലിംഗ ഏകവചനം പ്രതിഫലിപ്പിക്കുമ്പോഴും പ്രസ്താവനയ്ക്ക് പ്രതിനിധാനപരമായ വ്യാപ്തിയുണ്ട്.
