id: MRK.10.29
reference: Mark 10:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: ml
  text: 'യേശു പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: എന്റെയും സുവിശേഷത്തിന്റെയും നിമിത്തം വീടോ സഹോദരന്മാരെയോ സഹോദരിമാരെയോ അമ്മയെയോ അപ്പനെയോ മക്കളെയോ വയലുകളെയോ വിട്ടുപോയ ആരുംതന്നെ ഇല്ല—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: പറഞ്ഞു
  rationale: φημίയുടെ ഭൂതകാലരൂപം ഇവിടെ യേശുവിന്റെ വാക്കുകൾ ലളിതമായി അവതരിപ്പിക്കുന്നു; അധികമായ അർത്ഥനിറം ചേർക്കാതെ സ്വാഭാവികമായ മലയാളം.
- source_word: Ἀμὴν
  choice: സത്യമായി
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ വചനാരംഭ സൂത്രവാക്യത്തിന്റെ ഗൗരവവും ഉറപ്പും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള, ഗൗരവപൂർണമായ പ്രഖ്യാപനരീതി നിലനിർത്തുന്നു.
- source_word: οὐδείς ἐστιν ὃς
  choice: ആരുംതന്നെ ഇല്ല
  rationale: അസ്തിത്വസൂചകമായ സാർവത്രിക നിഷേധം മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀφῆκεν
  choice: വിട്ടുപോയ
  rationale: ശിഷ്യത്വത്തിനായി വിട്ടിറങ്ങുന്നതിന്റെ ആശയം നൽകുന്നു; കുടുംബബാധ്യതകളെ പൂർണമായി ഉപേക്ഷിച്ചു എന്ന അതിശക്തമായ അർത്ഥം ചുമത്തുന്നില്ല.
- source_word: οἰκίαν
  choice: വീട്
  rationale: വാസസ്ഥലത്തെയോ സ്വത്തിനെയോ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള, സാധാരണ മലയാള തുല്യം.
- source_word: ἀδελφοὺς
  choice: സഹോദരന്മാർ
  rationale: തുടർന്ന് സ്ത്രീലിംഗരൂപം പ്രത്യേകം വരുന്നതിനാൽ പുരുഷ സഹോദരങ്ങളെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു.
- source_word: ἀδελφὰς
  choice: സഹോദരിമാർ
  rationale: സ്ത്രീ സഹോദരങ്ങളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള തുല്യം.
- source_word: μητέρα
  choice: അമ്മ
  rationale: ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള തുല്യം.
- source_word: πατέρα
  choice: അപ്പൻ
  rationale: അമ്മ എന്ന പദത്തോടൊപ്പം സ്വാഭാവികമായി ചേരുന്ന, സാധാരണ ആധുനിക മലയാളത്തിലുള്ള ബന്ധനാമം.
- source_word: τέκνα
  choice: മക്കൾ
  rationale: ലിംഗഭേദമില്ലാതെ സന്തതികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം.
- source_word: ἀγρούς
  choice: വയലുകൾ
  rationale: കൃഷിചെയ്യുന്ന നിലങ്ങളെയോ കൃഷിയിടങ്ങളെയോ സൂചിപ്പിക്കുന്ന konkreteവും മൂലപദത്തോട് അടുത്തതുമായ തുല്യം.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: എന്റെയും സുവിശേഷത്തിന്റെയും നിമിത്തം
  rationale: രണ്ട് കാരണങ്ങളെയും സമാന്തരമായി നിലനിർത്തി, ആവർത്തനം അനാവശ്യമായി ഭാരപ്പെടുത്താതെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: കുടുംബത്തെയും സ്വത്തിനെയും വിട്ടുപോകുന്നതിനെ കുടുംബബാധ്യതകളുടെ സമ്പൂർണ ഉപേക്ഷയായി അതിശയിപ്പിക്കാതിരിക്കുക
  choice: വിട്ടുപോയ
  alternative: ഉപേക്ഷിച്ച / പരിത്യജിച്ച
  rationale: ἀφίημι ഇവിടെ ശിഷ്യത്വത്തിന്റെ വിലയായി ആളുകളെയോ സ്വത്തിനെയോ വിട്ടിറങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉപേക്ഷിച്ച’ എന്നത് ധാർമിക ഉത്തരവാദിത്വം തള്ളിക്കളഞ്ഞുവെന്ന അധിക അർത്ഥം നൽകാം; ‘വിട്ടുപോയ’ മൂലവചനത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
- issue: യേശുവിനുവേണ്ടിയും സുവിശേഷത്തിനുവേണ്ടിയും എന്ന ഇരട്ട പ്രേരണ
  choice: എന്റെയും സുവിശേഷത്തിന്റെയും നിമിത്തം
  alternative: എന്നെക്കുറിച്ചുള്ള സുവിശേഷത്തിനുവേണ്ടി
  rationale: ഗ്രീക്ക് രണ്ട് ἕνεκεν ഘടകങ്ങളിലൂടെ യേശുവിനെയും സുവിശേഷത്തെയും വേർതിരിച്ചെങ്കിലും ബന്ധമുള്ള കാരണങ്ങളായി പറയുന്നു; അവയെ ഒന്നാക്കി വ്യാഖ്യാനിക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ വചനപ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘അമ്മ/അപ്പൻ’ ജനസാധാരണ ബന്ധഭാഷയായി തെരഞ്ഞെടുത്തു. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാനം ദീർഘരേഖ ഉപയോഗിച്ച് തുടർച്ച സൂചിപ്പിച്ചു.
