source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരോടു പറഞ്ഞു: “നിങ്ങൾ ചോദിക്കുന്നത് എന്താണെന്ന് നിങ്ങൾ അറിയുന്നില്ല. ഞാൻ കുടിക്കുന്ന പാനപാത്രം കുടിക്കാനോ,[a] ഞാൻ സ്നാനം ഏൽക്കുന്ന സ്നാനം ഏൽക്കാനോ[b] നിങ്ങൾക്കു കഴിയുമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാനപാത്രം’ ഒരാൾക്കായി നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്ന അനുഭവത്തെയോ ഓഹരിയെയോ സൂചിപ്പിക്കുന്ന ബൈബിൾരൂപകമാണ്; ഇവിടെ പ്രത്യേകിച്ച് യേശുവിന്റെ വരാനിരിക്കുന്ന കഷ്ടതയെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: 'അർഥം കൂടുതൽ തുറന്നുപറഞ്ഞാൽ: ‘ഞാൻ അനുഭവിക്കുന്ന സ്നാനം അനുഭവിക്കാനോ?’ ഗ്രീക്കിൽ ഊന്നലിനായി ‘സ്നാനം’ എന്ന ഒരേ പദകുടുംബം ആവർത്തിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: എന്നാൽ യേശു അവരോടു പറഞ്ഞു
  rationale: δέ ഇവിടെ അവരുടെ അഭ്യർഥനയോടുള്ള യേശുവിന്റെ തിരുത്തൽ നിറഞ്ഞ പ്രതികരണത്തിലേക്കുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: നിങ്ങൾ ചോദിക്കുന്നത് എന്താണെന്ന് നിങ്ങൾ അറിയുന്നില്ല
  rationale: οἶδα എന്നതിന്റെ അടിസ്ഥാനമായ ‘അറിയുക’ എന്ന അർഥം നിലനിർത്തുകയും αἰτέωയെ സ്വാഭാവികമായ ‘ചോദിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: δύνασθε
  choice: നിങ്ങൾക്കു കഴിയുമോ
  rationale: δύναμαι സൂചിപ്പിക്കുന്ന കഴിവിനെയും ശേഷിയെയും ആധുനിക മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: ഞാൻ കുടിക്കുന്ന പാനപാത്രം കുടിക്കാനോ
  rationale: ‘പാനപാത്രം’ എന്ന ബൈബിൾരൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ക്രിയാപദ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: ἢ
  choice: -ഓ ... -ഓ
  rationale: SBLGNTയിലെ വിഭാജകമായ ἢ മലയാളത്തിലെ സ്വാഭാവികമായ ഐച്ഛികചോദ്യഘടനയിലൂടെ പ്രകടമാക്കുന്നു; ‘ഉം’ എന്നു ചേർത്ത് സമാന്തരവാക്യവുമായി ഏകീകരിക്കുന്നില്ല.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: ഞാൻ സ്നാനം ഏൽക്കുന്ന സ്നാനം ഏൽക്കാനോ
  rationale: βάπτισμα/βαπτίζω എന്ന ഒരേ പദകുടുംബത്തിന്റെ ഊന്നിപ്പറയുന്ന ആവർത്തനം ‘സ്നാനം/സ്നാനം ഏൽക്കുക’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; ‘അനുഭവിക്കുക’ എന്ന വ്യാഖ്യാനപരമായ പരാവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘പാനപാത്രം’, ‘സ്നാനം’ എന്നീ രൂപകങ്ങൾ
  choice: രണ്ടു രൂപകങ്ങളും മുഖ്യപാഠത്തിൽ അതേപടി നിലനിർത്തി, കഷ്ടതയെന്ന സൂചന അടിക്കുറിപ്പിൽ മാത്രം വ്യക്തമാക്കുന്നു.
  alternative: ‘ഞാൻ അനുഭവിക്കുന്ന കഷ്ടത നിങ്ങൾക്കും അനുഭവിക്കാമോ?’ എന്നതുപോലെ വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം യേശുവിന്റെ വരാനിരിക്കുന്ന കഷ്ടതയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിനെ ഇവിടെ പൂർണമായി വിശദീകരിക്കുന്നില്ല. രൂപകങ്ങൾ നിലനിർത്തുന്നത് അവയുടെ തിരുവെഴുത്തുപരമായ അനുരണനവും ദൈവശാസ്ത്രപരമായ വിശാലതയും സംരക്ഷിക്കുന്നു.
- issue: δύνασθε എന്ന ചോദ്യത്തിലെ കഴിവിന്റെ സ്വഭാവം
  choice: ‘നിങ്ങൾക്കു കഴിയുമോ?’ എന്ന തുറന്ന ചോദ്യം നിലനിർത്തുന്നു.
  alternative: ‘നിങ്ങൾ അതിനു തയ്യാറാണോ?’ എന്നു മനോഭാവമോ സന്നദ്ധതയോ ആയി വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പദം കഴിവിനെയാണ് നേരിട്ട് ചോദിക്കുന്നത്; സന്നദ്ധതയായി മാത്രം ചുരുക്കുന്നത് അർഥപരിധി അനാവശ്യമായി നിയന്ത്രിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പാനപാത്രം’ എന്ന തിരുവെഴുത്തുപരമായ പദവും ‘സ്നാനം ഏൽക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗവും ഉപയോഗിച്ച് മൂലത്തിലെ രൂപകങ്ങളും ആവർത്തനവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
