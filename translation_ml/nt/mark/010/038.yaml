  to: 'എന്നാൽ യേശു അവരോടു പറഞ്ഞു: “നിങ്ങൾ ചോദിക്കുന്നത് എന്താണെന്ന് നിങ്ങൾ അറിയുന്നില്ല. ഞാൻ കുടിക്കുന്ന പാനപാത്രം കുടിക്കാനോ,[a] ഞാൻ സ്നാനം ഏൽക്കുന്ന സ്നാനം ഏൽക്കാനോ[b] നിങ്ങൾക്കു കഴിയുമോ?”'
