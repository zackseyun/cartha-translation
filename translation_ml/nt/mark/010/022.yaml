source:
  edition: SBLGNT
  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: ml
  text: എന്നാൽ, ആ വാക്കുകേട്ട്[b] അവന്റെ മുഖം മങ്ങി[a]; അവൻ ദുഃഖിച്ചുകൊണ്ട് പോയി. കാരണം, അവന് അനേകം സ്വത്തുക്കൾ ഉണ്ടായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവൻ നിരാശനായി” അല്ലെങ്കിൽ “അവൻ വിഷാദഭരിതനായി”; ഗ്രീക്ക് പദം മുഖഭാവം ദൃശ്യമായി ഇരുണ്ടതാകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ആ വാക്കിനാൽ” അല്ലെങ്കിൽ “ആ പ്രസ്താവനയിൽ”; ഗ്രീക്ക് പ്രയോഗം അവന്റെ പ്രതികരണത്തിനുള്ള സന്ദർഭത്തെയോ കാരണത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “വളരെയധികം സ്വത്തുക്കൾ” അല്ലെങ്കിൽ “അനേകം വസ്തുവകകൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: അവന്റെ മുഖം മങ്ങി
  rationale: ഈ ക്രിയാരൂപം ദൃശ്യമായി ഇരുണ്ടതോ വിഷാദഭരിതമായതോ ആയ മുഖഭാവത്തെ സൂചിപ്പിക്കുന്നു. ‘മുഖം മങ്ങി’ എന്നത് ആ ദൃശ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; വെറും ‘നിരാശനായി’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ചിത്രാത്മകത സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ τῷ λόγῳ
  choice: ആ വാക്കു കേട്ടപ്പോൾ
  rationale: ഈ പ്രയോഗം പ്രതികരണത്തിന്റെ സന്ദർഭമോ കാരണമോ സൂചിപ്പിക്കാം. ‘ആ വാക്കു കേട്ടപ്പോൾ’ എന്നത് λόγῳ എന്ന ഏകവചനത്തെ നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി സന്ദർഭബന്ധം പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു; വ്യക്തമായ കാരണബന്ധം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: ἀπῆλθεν
  choice: അവിടെനിന്നു പോയി
  rationale: കഥയിലെ അകന്നുപോകുന്ന ചലനം ആധുനിക മലയാളത്തിൽ ലളിതമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: λυπούμενος
  choice: ദുഃഖിച്ചുകൊണ്ട്
  rationale: വിട്ടുപോകുമ്പോഴും തുടരുന്ന ദുഃഖത്തെ വർത്തമാനകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്നു. ‘ദുഃഖിച്ചുകൊണ്ട്’ ആ തുടർച്ചയായ അവസ്ഥ സംരക്ഷിക്കുന്നു.
- source_word: κτήματα πολλά
  choice: വളരെയധികം സ്വത്തുക്കൾ
  rationale: κτήματα സ്വത്തോ ഉടമസ്ഥതയിലുള്ള വസ്തുക്കളോ സൂചിപ്പിക്കുന്നു; πολλά അവയുടെ വലിയ അളവിനെയോ സമൃദ്ധിയെയോ വ്യക്തമാക്കുന്നു. ‘വളരെയധികം സ്വത്തുക്കൾ’ സ്വാഭാവികവും വിശാലാർത്ഥമുള്ളതുമാണ്.
- source_word: ἦν γὰρ ἔχων
  choice: കാരണം, അവന് ... ഉണ്ടായിരുന്നു
  rationale: തുടർച്ചയായ ഉടമസ്ഥാവസ്ഥയെ മലയാളത്തിലെ സ്വാഭാവിക കൈവശപ്രയോഗത്തിലൂടെ അവതരിപ്പിക്കുന്നു; γάρ നൽകുന്ന വിശദീകരണബന്ധം ‘കാരണം’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വാക്കിനോടുള്ള ആ മനുഷ്യന്റെ മാനസിക പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ദൃശ്യമായി മുഖം മങ്ങുന്നതും ദുഃഖത്തോടെ മടങ്ങുന്നതും മാത്രം വിവർത്തനത്തിൽ പറയുന്നു.
  alternative: അവൻ കോപിച്ചു എന്നോ മനഃപൂർവം മത്സരിച്ചു എന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം വിഷാദഭാവവും തുടരുന്ന ദുഃഖവും വിവരിക്കുന്നു; കോപമോ മത്സരമോ വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ ധാർമ്മിക വിധി കൂട്ടിച്ചേർക്കാതെ കഥയിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘മുഖം മങ്ങി’ എന്ന സ്വാഭാവിക ദൃശ്യപ്രയോഗം മൂലപാഠത്തിന്റെ ഭാവം നിലനിർത്തുന്നു. പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കനുസരിച്ച് ക്രമപ്പെടുത്തി; കാരണവും വികാരത്തിന്റെ തുടർച്ചയും വ്യക്തമായി സൂക്ഷിച്ചു.
