id: MRK.10.40
reference: Mark 10:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: ml
  text: എന്നാൽ എന്റെ വലത്തോ ഇടത്തോ ഇരിക്കാനുള്ള സ്ഥാനം നൽകുന്നത് എനിക്കുള്ളതല്ല[a]; അത് ആർക്കുവേണ്ടി ഒരുക്കപ്പെട്ടിരിക്കുന്നുവോ അവർക്കാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അത് നൽകേണ്ടത് ഞാനല്ല.’
    reason: ‘οὐκ ἔστιν ἐμὸν δοῦναι’ എന്നതിന് ‘എനിക്കു നൽകാനുള്ളതല്ല’ എന്നതിനുപകരം, നൽകുന്നതിന്റെ ചുമതലയെയോ അധികാരപരിധിയെയോ മുൻനിർത്തുന്ന സ്വാഭാവിക മലയാളവായന.
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: ഇരിക്കാൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ക്രിയാനാമരൂപം ഇവിടെ ഇരിക്കുന്ന സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ക്രിയയുടെ സ്വഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക രൂപം ‘ഇരിക്കാൻ’ ആണ്.
- source_word: ἐκ δεξιῶν μου
  choice: എന്റെ വലത്ത്
  rationale: യേശുവിന്റെ വലതുവശത്തെ സ്ഥാനമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘കൈ’ ചേർക്കാതെ സ്ഥലാർഥം നിലനിർത്തുന്നു.
- source_word: ἢ ἐξ εὐωνύμων
  choice: അല്ലെങ്കിൽ ഇടത്ത്
  rationale: εὐωνύμων എന്നത് ഈ പ്രയോഗത്തിൽ ഇടതുവശം എന്നാണ്; ‘വലത്ത്’ എന്നതിനോട് സമാന്തരമായ മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: അനുവാദം നൽകുന്നത് എനിക്കുള്ളതല്ല
  rationale: δοῦναι ഇവിടെ ആ സ്ഥാനത്ത് ഇരിക്കാൻ നൽകുന്ന അവകാശമോ അനുവാദമോ സൂചിപ്പിക്കുന്നു. ‘എനിക്കുള്ളതല്ല’ എന്നത് പ്രസ്താവനയിലെ പരിമിതി വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀλλ’ οἷς
  choice: അത് ആർക്കുവേണ്ടി ... അവർക്കുള്ളതാണ്
  rationale: ഗ്രീക്കിൽ മുൻവാക്യത്തിൽനിന്ന് അർഥം പൂരിപ്പിക്കേണ്ട അപൂർണഘടനയുണ്ട്; മലയാളത്തിൽ അതിന്റെ വിരുദ്ധത വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἡτοίμασται
  choice: ഒരുക്കിയിരിക്കുന്നുവോ
  rationale: പൂർണ ഭൂതകാല കർമണി രൂപം പൂർത്തിയായ ഒരുക്കത്തിന്റെയും തുടരുന്ന ഫലത്തിന്റെയും ആശയം നൽകുന്നു; ‘ഒരുക്കിയിരിക്കുന്നു’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈ വാക്കുകൾ യേശുവിന്റെ അധികാരത്തെ നിരുപാധികമായി നിഷേധിക്കുന്നുവോ, അതോ സന്ദർഭത്തിലെ നൽകൽ സംബന്ധിച്ച പരിമിതിയാണോ എന്ന ചോദ്യം
  choice: ‘അനുവാദം നൽകുന്നത് എനിക്കുള്ളതല്ല’ എന്ന് വിശദീകരണയോഗ്യതകളില്ലാതെ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പിതാവിന്റെ ഇഷ്ടത്തിൽനിന്ന് വേറിട്ട് നൽകുന്നത് എനിക്കുള്ളതല്ല’ എന്ന വിശദീകരണം ചേർക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം പരിമിതി പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ ദൈവശാസ്ത്രപരമായ കാരണം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പിതാവിന്റെ ഇഷ്ടത്തെക്കുറിച്ചുള്ള സമന്വയവാക്യം ചേർക്കാതെ മൂലപാഠത്തിലെ സംഘർഷവും അവ്യക്തതയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വലത്തോ ഇടത്തോ’ എന്ന സമാന്തരപ്രയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; മൂലത്തിൽ ഇല്ലാത്ത ‘കൈ’ ചേർത്തിട്ടില്ല. ‘അനുവാദം’ സന്ദർഭത്തിലെ സ്ഥാനദാനം വ്യക്തമാക്കുന്നു, എന്നാൽ ആരാണ് ഒരുക്കിയതെന്ന് പാഠം പറയാത്തതിനാൽ കർത്താവിനെ ചേർത്തിട്ടില്ല.
