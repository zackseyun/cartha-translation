- from: എന്നാൽ എന്റെ വലത്തോ ഇടത്തോ ഇരിക്കാൻ അനുവാദം നൽകുന്നത് എനിക്കുള്ളതല്ല[a]; അത് ആർക്കുവേണ്ടി ഒരുക്കിയിരിക്കുന്നുവോ അവർക്കുള്ളതാണ്.
  to: എന്നാൽ എന്റെ വലത്തോ ഇടത്തോ ഇരിക്കാനുള്ള സ്ഥാനം നൽകുന്നത് എനിക്കുള്ളതല്ല[a]; അത് ആർക്കുവേണ്ടി ഒരുക്കപ്പെട്ടിരിക്കുന്നുവോ അവർക്കാണ്.
  rationale: ‘അനുവാദം’ ഒഴിവാക്കി, മൂലത്തിലെ ‘നൽകുക’ എന്ന അർഥം സന്ദർഭാനുസൃതമായി ‘ഇരിക്കാനുള്ള സ്ഥാനം നൽകുക’ എന്നു വ്യക്തമാക്കി. അവസാനത്തെ ഗ്രീക്ക് അപൂർണഘടനയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നതിനായി ‘അത് ... അവർക്കാണ്’ എന്നു പരിഷ്കരിച്ചു. ഒരുക്കിയത് ആരാണെന്ന് പാഠം പറയാത്തതിനാൽ കർത്താവിനെ ചേർത്തിട്ടില്ല.
