  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ ഇടയിൽ അങ്ങനെയല്ല[a]. പകരം, നിങ്ങളുടെ ഇടയിൽ വലിയവനാകാൻ ആഗ്രഹിക്കുന്നവൻ നിങ്ങളുടെ സേവകനായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നാൽ നിങ്ങളുടെ ഇടയിൽ ഇതു പ്രകാരമല്ല.”
    reason: lexical_alternative
  - marker: b
    text: '“ആയിരിക്കും” എന്ന ഭാവികാലക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ “ആയിരിക്കണം” എന്ന നിർദേശാർഥവും ഉണ്ടാകാം: നിങ്ങളുടെ ഇടയിൽ വലിയവനാകാൻ ആഗ്രഹിക്കുന്നവൻ നിങ്ങളുടെ സേവകനായിരിക്കണം.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: എന്നാൽ നിങ്ങളുടെ ഇടയിൽ അങ്ങനെ ആയിരിക്കരുത്
  rationale: δέയുടെ വൈരുധ്യഭാവം ‘എന്നാൽ’ എന്നു നൽകുന്നു. οὐχ οὕτως ... ἐστιν എന്നത് സമൂഹത്തിനുള്ള മാനദണ്ഡമായി പറയുന്ന സന്ദർഭമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘അങ്ങനെ ആയിരിക്കരുത്’ എന്നു നൽകി; ഗ്രീക്ക് വാക്യത്തിന്റെ കൂടുതൽ രൂപസമീപമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ἀλλ’
  choice: പകരം
  rationale: ലൗകിക അധികാരരീതിക്കു വിരുദ്ധമായ യേശുവിന്റെ തിരുത്തൽ ശക്തമായി വ്യക്തമാക്കുന്നു.
- source_word: ὃς ἂν θέλῃ
  choice: ആഗ്രഹിക്കുന്നവൻ
  rationale: ἄν സഹിതമുള്ള സബ്ജങ്ക്റ്റീവ് പൊതുവായ അനിശ്ചിത നിബന്ധനയെ സൂചിപ്പിക്കുന്നു; θέλωയുടെ ഇച്ഛാഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μέγας γενέσθαι
  choice: വലിയവനാകാൻ
  rationale: γενέσθαιയിലെ ‘ആയിത്തീരുക’ എന്ന ഭാവവും μέγας എന്ന പദത്തിലെ സ്ഥാനപരമായ ‘വലിയവൻ’ എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: സമൂഹത്തിനകത്തെ ബന്ധവും സ്ഥാനവും സൂചിപ്പിക്കുന്ന പ്രയോഗം; രണ്ടു പ്രാവശ്യവും ഒരേ രീതിയിൽ വിവർത്തനം ചെയ്തു.
- source_word: ἔσται ὑμῶν διάκονος
  choice: നിങ്ങളുടെ ശുശ്രൂഷകനായിരിക്കും
  rationale: ἔσταιയുടെ ഭാവികാലരൂപം നിലനിർത്തുന്നു. διάκονος ഇവിടെ സഭാപദവിയെയല്ല, മറ്റുള്ളവർക്കായി സേവിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ശുശ്രൂഷകൻ’ തിരഞ്ഞെടുത്തു; നിർബന്ധാർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: യേശുവിന്റെ നിർദേശത്തിൽ ἔσται എന്ന ഭാവികാലക്രിയയുടെ ശക്തി
  choice: ‘നിങ്ങളുടെ ശുശ്രൂഷകനായിരിക്കും’ എന്ന് ഭാവികാലരൂപത്തിൽ വിവർത്തനം ചെയ്തു
  alternative: ‘നിങ്ങളുടെ ശുശ്രൂഷകനായിരിക്കണം’
  rationale: സന്ദർഭത്തിൽ ഭാവികാലത്തിന് നിയമാത്മകമോ നിർദേശാത്മകമോ ആയ ശക്തി ഉണ്ടാകാം. എങ്കിലും മുഖ്യപാഠത്തിൽ ഗ്രീക്ക് രൂപം സംരക്ഷിക്കുകയും നിർബന്ധാർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
- issue: διάκονος എന്ന പദത്തിന്റെ അർഥം
  choice: ശുശ്രൂഷകൻ
  alternative: ദാസൻ / സേവകൻ
  rationale: ഇവിടെ വിനീതമായി മറ്റുള്ളവർക്കായി സേവിക്കുന്നവനെയാണ് സൂചിപ്പിക്കുന്നത്; പിന്നീട് രൂപപ്പെട്ട ഔദ്യോഗിക സഭാപദവി നിർബന്ധമായി ഉദ്ദേശിക്കുന്നില്ല. δοῦλος എന്ന അടിമത്തപദവുമായി ഇതിനെ കലർത്താതിരിക്കാനും ‘ശുശ്രൂഷകൻ’ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വലിയവൻ’ എന്ന സ്ഥാനഭാഷയും ‘ശുശ്രൂഷകൻ’ എന്ന സേവനഭാഷയും തമ്മിലുള്ള വിരോധാഭാസം നിലനിർത്തി. മുഖ്യവാക്യത്തിലെ രണ്ടു അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട സ്ഥാനങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
