  text: καὶ ἐναγκαλισάμενος αὐτὰ ⸂κατευλόγει τιθεὶς τὰς χεῖρας ἐπ’ αὐτά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/016.yaml
  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: ml
  text: അവൻ അവരെ തന്റെ കൈകളിൽ എടുത്ത്, അവരുടെ മേൽ കൈകൾ വെച്ചുകൊണ്ട്, അവരെ അനുഗ്രഹിച്ചുകൊണ്ടിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ കൈകളിൽ എടുത്ത്” എന്നതിന് “ആലിംഗനം ചെയ്ത്” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയ ആരെയെങ്കിലും തന്റെ കൈകളിലേക്ക് എടുക്കുന്നതിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അനുഗ്രഹിച്ചുകൊണ്ടിരുന്നു” എന്ന ഗ്രീക്ക് ക്രിയാരൂപം തുടർച്ചയായോ ആവർത്തിച്ചോ, ഒരുപക്ഷേ ഊഷ്മളമായോ അനുഗ്രഹിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: കൈകളിലെടുത്ത്
  rationale: ആരെയെങ്കിലും കൈകളിലേക്കെടുക്കുക എന്ന ക്രിയയുടെ സവിശേഷ അർഥവും യേശുവിന്റെ വാത്സല്യപൂർവമായ ശാരീരിക പ്രവൃത്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κατευλόγει
  choice: അനുഗ്രഹിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയയുടെ തുടർച്ചയെയോ ആവർത്തനത്തെയോ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; തീവ്രതയുടെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: അവരുടെമേൽ കൈകൾ വെച്ചുകൊണ്ട്
  rationale: അനുഗ്രഹത്തോടൊപ്പം നടന്ന പ്രവൃത്തിയെ പങ്കാളിക്രിയയുടെ ബന്ധം കാത്തുകൊണ്ട് വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: αὐτὰ ... αὐτά
  choice: അവരെ ... അവരെ
  rationale: സമീപസന്ദർഭത്തിലെ കുട്ടികളെയാണ് സർവനാമങ്ങൾ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ മനുഷ്യരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക സർവനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: καὶ
  choice: അവൻ
  rationale: മലയാളത്തിലെ സ്വാഭാവിക വാക്യാരംഭത്തിനായി സംയോജകത്തെ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ ആഖ്യാനതുടർച്ച നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുട്ടികളോടുള്ള യേശുവിന്റെ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: കൈകളിലെടുക്കൽ, കൈകൾ വെക്കൽ, അനുഗ്രഹിക്കൽ എന്നീ മൂർത്തമായ പ്രവൃത്തികൾ മാത്രം നേരിട്ട് നിലനിർത്തി.
  alternative: ഇതിനെ ഒരു പ്രത്യേക കർമമായോ കൂദാശാപരമായ ചടങ്ങായോ വ്യാഖ്യാനിക്കുക.
  rationale: മൂലവാക്യം വാത്സല്യപൂർവമായ സ്വീകരണവും അനുഗ്രഹവും ചിത്രീകരിക്കുന്നു; പിൽക്കാല സിദ്ധാന്തപരമായ വിഭാഗങ്ങൾ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. “കൈകളിലെടുത്ത്” എന്നത് സ്നേഹപൂർവമായ ശാരീരിക പ്രവൃത്തിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; “അനുഗ്രഹിച്ചുകൊണ്ടിരുന്നു” അപൂർണഭൂതകാലത്തിന്റെ പ്രവാഹം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
