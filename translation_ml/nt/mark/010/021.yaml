id: MRK.10.21
reference: Mark 10:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: ml
  text: 'യേശു അവനെ നോക്കി, അവനെ സ്നേഹിച്ചു; അവനോടു പറഞ്ഞു: “നിനക്ക് ഒരു കാര്യം കുറവുണ്ട്: പോയി, നിനക്കുള്ളതെല്ലാം[a] വിറ്റ് ദരിദ്രർക്കു കൊടുക്കുക; നിനക്കു സ്വർഗത്തിൽ നിധി ലഭിക്കും; വന്ന് എന്നെ അനുഗമിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിനക്കുള്ളതൊക്കെയും.” ὅσα ἔχεις എന്ന ഗ്രീക്ക് പ്രയോഗം “നിനക്കുള്ളതെല്ലാം” എന്നോ “നിനക്കുള്ളതൊക്കെയും” എന്നോ പരിഭാഷപ്പെടുത്താം; സന്ദർഭം അവന്റെ സ്വത്തുക്കളുടെ മുഴുവൻ വ്യാപ്തിയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας
  choice: ഉറ്റുനോക്കി
  rationale: ഈ കൃന്ദന്തം ശ്രദ്ധയോടെ ഒരാളിലേക്കു ദൃഷ്ടി തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉറ്റുനോക്കി’ എന്നത് അതിന്റെ ശ്രദ്ധാപൂർവമായ ഭാവം സ്വാഭാവികമായി നൽകുന്നു; അതിരുകടന്ന വികാരാർഥം ചേർക്കുന്നില്ല.
- source_word: ἠγάπησεν αὐτόν
  choice: അവനെ സ്നേഹിച്ചു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. ഇതിനെ വെറും ദയയോ സൗഹൃദപരമായ പെരുമാറ്റമോ ആക്കി ദുർബലപ്പെടുത്തുന്നില്ല; സാങ്കേതികമായ പിൽക്കാല ദൈവശാസ്ത്രാർഥവും ചുമത്തുന്നില്ല.
- source_word: Ἕν σε ὑστερεῖ
  choice: നിനക്ക് ഒരു കാര്യം കുറവുണ്ട്
  rationale: നപുംസകലിംഗ ഏകവചനം നാമാർത്ഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ഒരു കാര്യം’ എന്നു വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്. ὑστερεῖ സൂചിപ്പിക്കുന്ന ഇപ്പോഴുള്ള കുറവ് നേരിട്ടുള്ള അഭിസംബോധനയായി നിലനിർത്തുന്നു.
- source_word: ὕπαγε
  choice: പോയി
  rationale: പുറപ്പെട്ടുപോകാനുള്ള ലളിതമായ ആജ്ഞ. പിന്നാലെയുള്ള ആജ്ഞകളുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘പോയി’ ഉപയോഗിച്ചു.
- source_word: ὅσα ἔχεις
  choice: നിനക്കുള്ളതെല്ലാം
  rationale: പ്രയോഗത്തിന് ‘നിനക്കുള്ളതൊക്കെയും’ എന്നും ‘നിനക്കുള്ളതെല്ലാം’ എന്നും അർഥമാകാം. സന്ദർഭത്തിലെ സമഗ്രമായ വ്യാപ്തി വ്യക്തമാക്കുന്നതിനൊപ്പം ഗ്രീക്കിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: πώλησον
  choice: വിറ്റ്
  rationale: വിൽക്കുക എന്ന നേരിട്ടുള്ള വാണിജ്യാർഥം. ബന്ധിത ആജ്ഞാക്രമത്തിൽ മലയാളത്തിന് സ്വാഭാവികമായ കൃദ്യന്തരൂപം ഉപയോഗിച്ചു.
- source_word: δὸς τοῖς πτωχοῖς
  choice: ദരിദ്രർക്കു കൊടുക്കുക
  rationale: πτωχοῖς സാമ്പത്തികമായി ദരിദ്രരായ ആളുകളെ സൂചിപ്പിക്കുന്നു. ‘ദരിദ്രർ’ സാമൂഹിക വിഭാഗത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: സ്വർഗത്തിൽ നിക്ഷേപം
  rationale: ഭാവിയിൽ ലഭിക്കുന്ന സ്വർഗീയ സമ്പത്ത് എന്ന രൂപകം സംക്ഷിപ്തമായും പരിചിതമായും നിലനിർത്തുന്നു. ഏകവചനമായ οὐρανῷ അനുസരിച്ച് ‘സ്വർഗത്തിൽ’ എന്നു നൽകി.
- source_word: δεῦρο
  choice: വന്ന്
  rationale: സംസാരിക്കുന്നവന്റെ അടുക്കലേക്കുള്ള വരവിന്റെ ആഹ്വാനം. തുടർന്നുള്ള ആജ്ഞയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀκολούθει μοι
  choice: എന്നെ അനുഗമിക്കുക
  rationale: യേശുവിനെ ശിഷ്യനായി പിന്തുടരാനുള്ള ആഹ്വാനം വ്യക്തമായി നൽകുന്നു. വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചാഭാവം ‘അനുഗമിക്കുക’ എന്ന പ്രയോഗത്തിലും ശിഷ്യത്വസന്ദർഭത്തിലും ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ആ മനുഷ്യനോടുള്ള യേശുവിന്റെ സ്നേഹത്തിന്റെ അർഥം
  choice: ‘അവനെ സ്നേഹിച്ചു’ എന്ന നേരിട്ടുള്ള പ്രസ്താവന
  alternative: ഇത് വെറും പുറമേയുള്ള ദയയായി ദുർബലപ്പെടുത്തുക, അല്ലെങ്കിൽ സാങ്കേതികമായ തിരഞ്ഞെടുപ്പുസ്നേഹമായി വ്യാഖ്യാനിക്കുക
  rationale: ἠγάπησεν αὐτόν യഥാർഥ സ്നേഹത്തെ വ്യക്തമായി പ്രസ്താവിക്കുന്നു. മനുഷ്യന്റെ തുടർന്നുള്ള പ്രതികരണവുമായി നിലനിൽക്കുന്ന വികാരപരവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കം പരിഭാഷ പരിഹരിച്ചുകളയുന്നില്ല.
- issue: സ്വത്തുക്കളെക്കുറിച്ചുള്ള ആജ്ഞയുടെ വ്യാപ്തി
  choice: ‘നിനക്കുള്ളതെല്ലാം’ എന്ന സമഗ്രമായ പ്രയോഗം
  alternative: ഇത് പൊതുവായ ദാനശീലത്തിനുള്ള ആഹ്വാനമായി മയപ്പെടുത്തുക, അല്ലെങ്കിൽ മൂലപാഠത്തേക്കാൾ വിശദമായ വ്യാഖ്യാനം ചേർക്കുക
  rationale: ὅσα ἔχεις സന്ദർഭത്തിൽ ആ മനുഷ്യന്റെ കൈവശമുള്ളതിന്റെ മുഴുവൻ വ്യാപ്തിയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. പരിഭാഷ ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സാധ്യമായ പദപ്രയോഗഭേദം രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ‘ഉറ്റുനോക്കി’, ‘സ്നേഹിച്ചു’, ‘അനുഗമിക്കുക’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ വ്യക്തിപരവും ശിഷ്യത്വപരവുമായ ഭാവം നിലനിർത്തുന്നു. ആജ്ഞാക്രമം സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി; മൂലപാഠത്തിലെ ശക്തി മയപ്പെടുത്തിയിട്ടില്ല.
