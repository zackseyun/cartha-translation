id: MRK.10.2
reference: Mark 10:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: ml
  text: 'അവർ അവനെ പരീക്ഷിച്ചുകൊണ്ട് അവനോടു ചോദിച്ചുകൊണ്ടിരുന്നു: “ഒരു പുരുഷന് ഭാര്യയെ വിവാഹമോചനം ചെയ്യാൻ നിയമാനുസൃതമാണോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഒരു ഭർത്താവിന് തന്റെ ഭാര്യയെ വിവാഹമോചനം ചെയ്യാൻ നിയമാനുസൃതമാണോ?”
    reason: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമാകാം; γυνή ഈ വിവാഹസന്ദർഭത്തിൽ ‘ഭാര്യ’യെ സൂചിപ്പിക്കുന്നു. ദാമ്പത്യബന്ധം കൂടുതൽ വ്യക്തമായി പറയുന്ന സ്വാഭാവിക പകരംവായന.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ ചോദ്യം സൂചിപ്പിക്കുന്നു; അതിനാൽ ലളിതഭൂതകാലത്തേക്കാൾ ഈ രൂപം യോജിക്കുന്നു.
- source_word: ἔξεστιν
  choice: നിയമാനുസൃതമാണോ
  rationale: വിവാഹമോചനത്തെക്കുറിച്ചുള്ള നിയമപരമായ അനുവദനീയതയാണ് സന്ദർഭം; വെറും ‘അനുവദിച്ചിട്ടുണ്ടോ’ എന്നതിലുപരി നിയമപരമായ ഭാവം ഇത് വ്യക്തമാക്കുന്നു.
- source_word: ἀνδρὶ
  choice: ഒരു പുരുഷൻ
  rationale: പദത്തിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമാകാം. ഗ്രീക്കിലെ പൊതുവായ ഏകവചനരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: γυναῖκα
  choice: ഭാര്യയെ
  rationale: ἀπολῦσαι എന്ന വിവാഹമോചനസന്ദർഭത്തിൽ γυνή ഇവിടെ പൊതുവായ ‘സ്ത്രീ’യെയല്ല, ഭാര്യയെയാണ് സൂചിപ്പിക്കുന്നത്; അനിശ്ചിതത്വം മലയാളത്തിൽ സ്വാഭാവികമായി സന്ദർഭം വഹിക്കുന്നു.
- source_word: ἀπολῦσαι
  choice: ഉപേക്ഷിക്കുന്നത്
  rationale: വിവാഹബന്ധം അവസാനിപ്പിക്കുക എന്ന നിയമസന്ദർഭത്തിലെ അർഥം നൽകുന്നു. ആധുനിക മലയാളത്തിൽ ‘വിവാഹമോചനം ചെയ്യുക’ കൂടുതൽ സാങ്കേതികമാണ്; ‘ഉപേക്ഷിക്കുക’ മൂലക്രിയയിലെ അയച്ചുകളയൽഭാവവും നിലനിർത്തുന്നു.
- source_word: πειράζοντες
  choice: പരീക്ഷിച്ചുകൊണ്ട്
  rationale: യേശുവിനെ വിരോധപരമായി പരിശോധിക്കുന്ന അനുബന്ധക്രിയയെ നേരിട്ട് പകർത്തുന്നു; ‘കെണിയിൽപ്പെടുത്താൻ ശ്രമിച്ച്’ എന്നു പറഞ്ഞ് ഉദ്ദേശ്യം അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: Καὶ
  choice: അവർ
  rationale: ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിനായി ആരംഭത്തിലെ ബന്ധകം തുറന്നുപറഞ്ഞിട്ടില്ല; തുടർച്ചയായ വിവരണത്തിന്റെ ബന്ധം വാക്യക്രമം വഹിക്കുന്നു.
theological_decisions:
- issue: ἀνδρὶ എന്ന പദം ‘പുരുഷൻ’ എന്നോ ‘ഭർത്താവ്’ എന്നോ പരിഭാഷപ്പെടുത്തൽ
  choice: ഒരു പുരുഷൻ
  alternative: ഒരു ഭർത്താവ്
  rationale: ഗ്രീക്ക് പദത്തിന്റെ പൊതുവായ പുരുഷലിംഗ ഏകവചനരൂപം സംരക്ഷിക്കുന്നു; വിവാഹസന്ദർഭം ‘ഭാര്യയെ ഉപേക്ഷിക്കുന്നത്’ എന്നതിലൂടെ വ്യക്തമാണ്. സാധ്യതയുള്ള ദാമ്പത്യവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമവാദത്തിന്റെ ഭാവം ‘നിയമാനുസൃതമാണോ’ എന്നും അപൂർണ ഭൂതകാലം ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ എന്നും പ്രകടമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
