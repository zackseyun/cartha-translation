id: MRK.10.7
reference: Mark 10:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: ml
  text: ഇക്കാരണത്താൽ ഒരു പുരുഷൻ തന്റെ പിതാവിനെയും മാതാവിനെയും വിട്ട് തന്റെ ഭാര്യയോടു പറ്റിച്ചേരും,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ ഭാര്യയോടു മുറുകെപ്പറ്റിച്ചേരും.’ ഗ്രീക്ക് ക്രിയ ദൃഢമായ അടുപ്പത്തെ ഊന്നിപ്പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: ഇക്കാരണത്താൽ
  rationale: തുടർന്നുവരുന്ന പ്രസ്താവനയുടെ കാരണം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: καταλείψει
  choice: വിട്ട്
  rationale: മാതാപിതാക്കളുടെ കുടുംബപരിസരം വിട്ടുപോകുക എന്ന നേരിട്ടുള്ള ഭാവികാല ആശയം മലയാളത്തിലെ വാക്യഘടനയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു പുരുഷൻ
  rationale: ἄνθρωπος പൊതുവായി ‘മനുഷ്യൻ’ എന്നർഥമാകാമെങ്കിലും, ഇവിടെ ‘തന്റെ ഭാര്യ’ എന്ന വിവാഹസന്ദർഭം പുരുഷപക്ഷത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: തന്റെ അപ്പനെയും അമ്മയെയും
  rationale: രണ്ടു മാതാപിതാക്കളെയും ഏകോപിത കർമമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ആവർത്തിച്ചുള്ള ഉടമസൂചകം ആവശ്യമില്ല.
- source_word: προσκολληθήσεται
  choice: ചേർന്നിരിക്കും
  rationale: വിവാഹത്തിലെ ദൃഢവും നിലനിൽക്കുന്നതുമായ അടുപ്പം സൂചിപ്പിക്കുന്നു; ഗ്രീക്ക് ക്രിയയുടെ ബന്ധനിഷ്ഠമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: തന്റെ ഭാര്യയോടു
  rationale: വിവാഹസന്ദർഭത്തിൽ γυνή എന്നത് ‘ഭാര്യ’ എന്നാണ്; മലയാള ക്രിയയോടു ചേരുന്ന സ്വാഭാവിക വിഭക്തിരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: വിവാഹ ഉദ്ധരണിയിലെ ലിംഗനിർദിഷ്ട പ്രതിനിധാനം
  choice: ഒരു പുരുഷൻ ... തന്റെ ഭാര്യ
  alternative: ഒരു വ്യക്തി ... തന്റെ ജീവിതപങ്കാളി
  rationale: ഉല്പത്തി ഉദ്ധരണിയുടെ ഈ രൂപം പുരുഷനെയും അവന്റെ ഭാര്യയെയും വ്യക്തമായി പരാമർശിക്കുന്നു; സന്ദർഭത്തിൽ നിർദിഷ്ടമായ ലിംഗം പൊതുവൽക്കരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സുഗമവും മൂലത്തിലെ കുടുംബബന്ധത്തിന് യോജിച്ചതുമാണ്. ‘ചേർന്നിരിക്കും’ എന്നത് വിവാഹബന്ധത്തിലെ അടുത്ത ഐക്യം വ്യക്തമാക്കുന്നു; അടുപ്പത്തിന്റെ കൂടുതൽ അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
