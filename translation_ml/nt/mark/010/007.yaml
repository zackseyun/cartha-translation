  to: ഇക്കാരണത്താൽ ഒരു പുരുഷൻ തന്റെ പിതാവിനെയും മാതാവിനെയും വിട്ട് തന്റെ ഭാര്യയോടു പറ്റിച്ചേരും,[a]
