id: MRK.5.33
reference: Mark 5:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: ml
  text: എന്നാൽ ആ സ്ത്രീ ഭയന്ന് വിറച്ചുകൊണ്ട്, തനിക്കു സംഭവിച്ചത് എന്തെന്ന് അറിഞ്ഞ്, വന്ന് അവന്റെ മുമ്പിൽ വീണു; അവൾ അവനോട് സത്യം മുഴുവനും പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ അന്വേഷണത്തിൽനിന്ന് സ്ത്രീയുടെ പ്രതികരണത്തിലേക്കുള്ള നേരിയ വൈരുധ്യവും ആഖ്യാനമാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: ἡ γυνὴ
  choice: ആ സ്ത്രീ
  rationale: ആഖ്യാനത്തിൽ മുമ്പേ പരിചയപ്പെടുത്തിയ സ്ത്രീയെയാണ് നിർദ്ദിഷ്ടമായി സൂചിപ്പിക്കുന്നത്.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: ഭയന്ന് വിറച്ചുകൊണ്ട്
  rationale: രണ്ട് ഗ്രീക്ക് കൃദന്തരൂപങ്ങളുടെയും സജീവമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰδυῖα
  choice: അറിഞ്ഞ്
  rationale: ഇത് കാരണാർഥമാണെന്ന് നിർബന്ധമായി വ്യക്തമാക്കാതെ, സാഹചര്യബന്ധമുള്ള കൃദന്തരൂപത്തിന്റെ അർഥതുറപ്പ് സംരക്ഷിക്കുന്നു.
- source_word: ὃ γέγονεν αὐτῇ
  choice: തനിക്കു സംഭവിച്ചത് എന്തെന്ന്
  rationale: അവൾ അനുഭവിച്ച സൗഖ്യസംഭവത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം.
- source_word: ἦλθεν
  choice: വന്ന്
  rationale: ലളിതമായ ആഖ്യാനചലനം അധിക വ്യാഖ്യാനം കൂടാതെ നൽകുന്നു.
- source_word: προσέπεσεν αὐτῷ
  choice: അവന്റെ മുമ്പിൽ വീണു
  rationale: ബഹുമാനം, ഭയം, അപേക്ഷ എന്നിവ സൂചിപ്പിക്കാവുന്ന ശരീരഭാവം നിലനിർത്തുന്നു; ആരാധനയെന്ന പ്രത്യേക ദൈവശാസ്ത്രാർഥം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: അവൾ അവനോട് സത്യം മുഴുവനും പറഞ്ഞു
  rationale: ഒന്നും മറച്ചുവയ്ക്കാതെ പൂർണവിവരം പറഞ്ഞുവെന്ന πᾶσαν എന്ന ഊന്നൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: προσέπεσεν αὐτῷ എന്നതിലെ യേശുവിന്റെ മുമ്പിലുള്ള ശരീരഭാവം
  choice: അവന്റെ മുമ്പിൽ വീണു
  alternative: അവന്റെ കാൽക്കൽ വീണു / അവന്റെ മുമ്പിൽ സാഷ്ടാംഗം വീണു
  rationale: മൂലക്രിയ ബഹുമാനം, ഭയം, നിരാശ, അപേക്ഷ എന്നിവയോടെയുള്ള വീഴ്ചയെ സൂചിപ്പിക്കാം. സ്ഥാനം ‘കാൽക്കൽ’ എന്ന് കൂടുതൽ നിർദ്ദിഷ്ടമാക്കാതെയും ഇതിനെ ആരാധനയായി വ്യാഖ്യാനിക്കാതെയും പ്രവർത്തിയെ അതിന്റെ തുറപ്പോടെ അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് കൃദന്തരൂപങ്ങളുടെ ക്രമവും മാനസികാവസ്ഥയുടെ തീവ്രതയും കഴിയുന്നത്ര നിലനിർത്തി. ഈ വാക്യത്തിന് അനിവാര്യമായ പാഠഭേദമോ വിശദീകരണ അടിക്കുറിപ്പോ ആവശ്യമില്ല.
