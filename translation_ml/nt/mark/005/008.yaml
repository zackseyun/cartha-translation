  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: ml
  text: 'കാരണം, അവൻ അവനോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “അശുദ്ധാത്മാവേ, ആ മനുഷ്യനിൽനിന്ന് പുറത്തുവരിക!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അശുദ്ധാത്മാവേ, ആ മനുഷ്യനിൽനിന്ന് പുറത്തുപോകുക!” ഗ്രീക്ക് ക്രിയയെ ‘പുറത്തുപോകുക’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നതിനാലാണ്
  rationale: അപൂർണ ഭൂതകാലരൂപം കഴിഞ്ഞകാലത്തിലെ തുടരുന്ന അല്ലെങ്കിൽ ആവർത്തിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; γάρ-ന്റെ വിശദീകരണബന്ധവും ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: -തിനാലാണ്
  rationale: മുൻവാക്യത്തിന് വിശദീകരണപശ്ചാത്തലം നൽകുന്ന ബന്ധം മലയാളത്തിലെ കാരണസൂചക ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ദത്തിവിഭക്തി സർവനാമത്തെ നേരിട്ട് പിന്തുടരുന്നു; കഥാസന്ദർഭത്തിൽ ഉടൻ സൂചിപ്പിക്കപ്പെടുന്നത് ആ മനുഷ്യനാണ്, കല്പനയുടെ ലക്ഷ്യം അവനിലുള്ള അശുദ്ധാത്മാവായിരിക്കുമ്പോഴും.
- source_word: Ἔξελθε
  choice: പുറത്തുവരിക
  rationale: നേരിട്ടുള്ള കല്പനയെ മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ἐκ എന്നതോടൊപ്പം ഉള്ളിൽനിന്നുള്ള പുറപ്പെടൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: അശുദ്ധാത്മാവേ
  rationale: രൂപപരമായി നിർദേശക ആർട്ടിക്കിളോടുകൂടിയ നാമപദമാണെങ്കിലും ഇവിടെ നേരിട്ടുള്ള സംബോധനയായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിലെ സംബോധനവിഭക്തി അത് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: ഈ മനുഷ്യനിൽനിന്ന്
  rationale: ἐκ ഉള്ളിൽനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ നിർദ്ദിഷ്ടനായ പുരുഷനെ മലയാളത്തിൽ സ്വാഭാവികമായി തിരിച്ചറിയാൻ ‘ഈ മനുഷ്യൻ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ഭൂതോച്ചാടനസന്ദർഭത്തിലെ πνεῦμα ἀκάθαρτον എന്ന പ്രയോഗം
  choice: അശുദ്ധാത്മാവ്
  alternative: ദുരാത്മാവ്
  rationale: ഗ്രീക്ക് പാഠം അക്ഷരാർഥത്തിൽ ‘അശുദ്ധാത്മാവ്’ എന്നാണ് പറയുന്നത്; ‘ദുരാത്മാവ്’ ദോഷസ്വഭാവം മാത്രം മുൻനിർത്തുന്ന വ്യാഖ്യാനപരമായ പദമായതിനാൽ മൂലപാഠത്തിലെ അശുദ്ധിയുടെ ആശയം നിലനിർത്തുന്നു.
- issue: αὐτῷ ആരെ സൂചിപ്പിക്കുന്നു എന്നതിലെ സന്ദർഭപരമായ പിരിമുറുക്ക്
  choice: അവനോട്
  alternative: അതോട് / അശുദ്ധാത്മാവിനോട്
  rationale: സർവനാമത്തിന്റെ പുല്ലിംഗരൂപവും കഥയുടെ ഉടൻ ലഭ്യമായ സൂചകവും നിലനിർത്തുന്നു; അതേസമയം ഉദ്ധരിച്ച കല്പന അശുദ്ധാത്മാവിനോടുള്ളതാണെന്ന് സംബോധനം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. തുടർച്ച സൂചിപ്പിക്കുന്ന അപൂർണ ഭൂതകാലവും നേരിട്ടുള്ള സംബോധനവും സംരക്ഷിച്ചു; ‘അശുദ്ധാത്മാവ്’ എന്ന സുവിശേഷപരമായ പദപ്രയോഗം വ്യാഖ്യാനാതിശയമില്ലാതെ നിലനിർത്തി.
