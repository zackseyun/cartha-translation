id: MRK.5.6
reference: Mark 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: ml
  text: അവൻ ദൂരത്തുനിന്ന് യേശുവിനെ കണ്ടിട്ട് ഓടി അവന്റെ മുമ്പിൽ കുമ്പിട്ടു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ ആരാധിച്ചു’ അല്ലെങ്കിൽ ‘അവന് പ്രണാമം അർപ്പിച്ചു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ആരാധനയെയോ കുമ്പിടൽ അല്ലെങ്കിൽ സാഷ്ടാംഗപ്രണാമം പോലുള്ള ആദരപ്രകടനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ aorist participle ഇവിടെ മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള സംഭവത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ കാലബന്ധം വ്യക്തമാക്കാൻ ‘കണ്ടപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἀπὸ μακρόθεν
  choice: ദൂരത്തുനിന്ന്
  rationale: സ്ഥലപരമായ അകലം സൂചിപ്പിക്കുന്ന പ്രയോഗം; ആധുനിക മലയാളത്തിൽ ലളിതവും വ്യക്തവുമാണ്.
- source_word: ἔδραμεν
  choice: ഓടിവന്ന്
  rationale: τρέχω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ഓട്ടം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള പ്രവർത്തനവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘വന്ന്’ ചേർത്തു, എന്നാൽ അധിക തീവ്രത വരുത്തിയില്ല.
- source_word: προσεκύνησεν αὐτόν
  choice: അവന്റെ മുമ്പിൽ കുമ്പിട്ടു
  rationale: προσκυνέω ആരാധനയെയോ ആദരസൂചകമായ സാഷ്ടാംഗപ്രണാമത്തെയോ കുമ്പിടലിനെയോ സൂചിപ്പിക്കാം. ദൃശ്യമായ പ്രവൃത്തി വ്യക്തമാക്കിക്കൊണ്ട് പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിർബന്ധമായി തീർപ്പാക്കാതിരിക്കാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: καὶ
  choice: വാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി
  rationale: ഗ്രീക്കിലെ ലളിതമായ ആഖ്യാനബന്ധം മലയാളത്തിലെ ക്രമാനുസൃതമായ വാക്യഘടനയിലൂടെ പ്രകടമാകുന്നു; തുടക്കത്തിൽ പ്രത്യേകം ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘കൂടാതെ’ ചേർക്കുന്നത് അനാവശ്യമാണ്.
- source_word: τὸν Ἰησοῦν
  choice: യേശുവിനെ
  rationale: നേരിട്ടുള്ള കർമമായി വ്യക്തിനാമത്തിന് മലയാളത്തിലെ കർമവിഭക്തി ചേർത്തു.
theological_decisions:
- issue: προσεκύνησεν എന്നത് യേശുവിനോടുള്ള വ്യക്തമായ ആരാധനയായി പരിഭാഷപ്പെടുത്തണമോ
  choice: പ്രധാന പാഠത്തിൽ ‘അവന്റെ മുമ്പിൽ കുമ്പിട്ടു’
  alternative: ‘അവനെ ആരാധിച്ചു’ അല്ലെങ്കിൽ ‘അവന് ആദരവോടെ പ്രണാമം ചെയ്തു’
  rationale: മൂലക്രിയയ്ക്ക് ആരാധനയുടെയും പ്രണാമത്തിന്റെയും അർഥസാധ്യതകളുണ്ട്. ഈ സന്ദർഭത്തിൽ ‘ആരാധിച്ചു’ എന്നു മാത്രം പറഞ്ഞാൽ മൂലപാഠം തുറന്നുവെക്കുന്ന സൂക്ഷ്മത നേരത്തേ തീർപ്പാക്കും. അതിനാൽ ദൃശ്യമായ പ്രവൃത്തി പ്രധാന പാഠത്തിൽ നൽകി, മറ്റു അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘കുമ്പിട്ടു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും മൂലത്തിലെ ആരാധന/പ്രണാമം എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
