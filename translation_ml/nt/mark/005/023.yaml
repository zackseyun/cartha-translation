id: MRK.5.23
reference: Mark 5:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: ml
  text: 'അവൻ യേശുവിനോട് ഏറെ അപേക്ഷിച്ചുകൊണ്ട് പറഞ്ഞു: “എന്റെ കുഞ്ഞുമകൾ മരണാസന്നയായിരിക്കുന്നു. അങ്ങ് വന്ന് അവളുടെമേൽ കൈകൾ വെക്കണമേ, അവൾ രക്ഷപ്പെടുകയും[a] ജീവിക്കുകയും ചെയ്യേണ്ടതിന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സൗഖ്യം പ്രാപിക്കുകയും” അല്ലെങ്കിൽ “സുഖം പ്രാപിക്കുകയും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് രക്ഷപ്പെടുക, സൗഖ്യം പ്രാപിക്കുക എന്നീ അർഥങ്ങൾ വരാം; ഈ സന്ദർഭത്തിൽ ശാരീരിക സൗഖ്യമാണ് ഉടൻ ഉദ്ദേശിക്കപ്പെടുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ αὐτὸν πολλὰ
  choice: അവൻ യേശുവിനോട് ഏറെ അപേക്ഷിച്ചുകൊണ്ട്
  rationale: παρακαλεῖ ഇവിടെ അടിയന്തരമായ യാചനയെ സൂചിപ്പിക്കുന്നു; πολλά അതിന്റെ തീവ്രത വർധിപ്പിക്കുന്നു. ‘ഏറെ അപേക്ഷിച്ചുകൊണ്ട്’ എന്നത് ആവർത്തനം ഉറപ്പിച്ചുപറയാതെ ആ തീവ്രത സ്വാഭാവികമായി നൽകുന്നു.
- source_word: θυγάτριόν μου
  choice: എന്റെ കുഞ്ഞുമകൾ
  rationale: ദിമിന്യൂട്ടീവ് രൂപം മകളുടെ ചെറുപ്പവും പിതാവിന്റെ സ്നേഹഭാവവും സൂചിപ്പിക്കാം. ‘കൊച്ചുമകൾ’ എന്നത് മലയാളത്തിൽ granddaughter എന്നർഥം വരാനിടയുള്ളതിനാൽ ‘കുഞ്ഞുമകൾ’ തെരഞ്ഞെടുത്തു.
- source_word: ἐσχάτως ἔχει
  choice: മരണാസന്നയായിരിക്കുന്നു
  rationale: ഈ പ്രയോഗം അവൾ മരണത്തിന്റെ വക്കിലാണെന്ന അടിയന്തരാവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: അങ്ങ് വന്ന് അവളുടെമേൽ കൈകൾ വെക്കണമേ
  rationale: പങ്കാളിക്രിയയും തുടർന്നുള്ള അഭ്യർഥനയും മലയാളത്തിൽ സ്വാഭാവികമായ വിനയപൂർവ അഭ്യർഥനയായി നൽകി; χεῖρας എന്ന ബഹുവചനം ‘കൈകൾ’ എന്നു നിലനിർത്തി.
- source_word: σωθῇ
  choice: രക്ഷപ്പെട്ട്
  rationale: σῴζω എന്ന ക്രിയയ്ക്ക് രക്ഷപ്പെടുക, സൗഖ്യം പ്രാപിക്കുക എന്നീ അർഥങ്ങൾ വരാം. മുഖ്യപാഠത്തിൽ വിശാലമായ പദാർഥം നിലനിർത്തി, ശാരീരിക സൗഖ്യത്തിന്റെ സന്ദർഭോചിത അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ζήσῃ
  choice: ജീവിക്കട്ടെ
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘ജീവിക്കുക’ നിലനിർത്തുന്നു; ഇവിടെ രക്ഷപ്പെടുന്നതിന്റെ ഫലമായി അവൾ ജീവിക്കണമെന്ന അഭ്യർഥനയാണ്.
theological_decisions:
- issue: രോഗസൗഖ്യത്തിന്റെ സന്ദർഭത്തിലെ σωθῇ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: രക്ഷപ്പെട്ട്
  alternative: സൗഖ്യം പ്രാപിച്ച് / സുഖം പ്രാപിച്ച്
  rationale: സന്ദർഭം ശാരീരിക സൗഖ്യത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് ക്രിയയുടെ ‘രക്ഷിക്കുക’ എന്ന വിശാലമായ പദബന്ധം ഇല്ലാതാക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി. സന്ദർഭോചിതമായ വൈദ്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യേശുവിനോടുള്ള അഭ്യർഥനയിൽ ‘അങ്ങ്’ എന്നും ‘വെക്കണമേ’ എന്നും ഉപയോഗിച്ച് ബഹുമാനവും നിരാശാഭരിതമായ അപേക്ഷയുടെ ഭാവവും നിലനിർത്തി. ‘കൊച്ചുമകൾ’ granddaughter ആയി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ ഒഴിവാക്കി.
