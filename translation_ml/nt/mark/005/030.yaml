- from: ഉടനെ യേശു, തന്നിൽനിന്ന് ശക്തി പുറപ്പെട്ടുപോയെന്ന് ഉള്ളിൽത്തന്നെ അറിഞ്ഞ്, ജനക്കൂട്ടത്തിനിടയിൽ തിരിഞ്ഞ്, “എന്റെ ഉടുപ്പുകളിൽ[a] തൊട്ടത് ആര്?” എന്നു ചോദിച്ചു.
