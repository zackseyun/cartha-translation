id: MRK.5.30
reference: Mark 5:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: ml
  text: ഉടനെ യേശു, തന്നിൽനിന്ന് ശക്തി പുറപ്പെട്ടുപോയെന്ന് ഉള്ളിൽത്തന്നെ അറിഞ്ഞ്, ജനക്കൂട്ടത്തിനിടയിൽ തിരിഞ്ഞ്, “എന്റെ ഉടുപ്പുകളെ[a] തൊട്ടത് ആരാണ്?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വസ്ത്രങ്ങളെ.”
    reason: ἱμάτια എന്ന ബഹുവചനപദത്തിന് കൂടുതൽ ഔപചാരികമായ മലയാള പദപ്രയോഗം നൽകുന്ന ശാബ്ദിക ബദൽ.
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ ദ്രുതഗതിയുള്ള ആഖ്യാനശൈലിയും കാലസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: ഉള്ളിൽത്തന്നെ അറിഞ്ഞ്
  rationale: ബാഹ്യനിരീക്ഷണത്തിലൂടെയല്ല, യേശുവിന്റെ ആന്തരികമായ വ്യക്തമായ അറിവാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν
  choice: തന്നിൽനിന്ന് ശക്തി പുറപ്പെട്ടുപോയെന്ന്
  rationale: δύναμις എന്നതിനെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘ശക്തി’ എന്നു നൽകുകയും, അറിവിനു മുമ്പേ സംഭവിച്ച പ്രവൃത്തിയെ ‘പുറപ്പെട്ടുപോയെന്ന്’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: ജനക്കൂട്ടത്തിനിടയിൽ തിരിഞ്ഞ്
  rationale: ജനക്കൂട്ടത്തിന്റെ നടുവിലായിരിക്കെ യേശു ശാരീരികമായി തിരിഞ്ഞതിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἔλεγεν
  choice: ചോദിച്ചു
  rationale: തുടർന്നുവരുന്നത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ മലയാളത്തിലെ സംഭാഷണാവതരണത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികമാണ്; അപൂർണ്ണകാലത്തിന്റെ ആവർത്തനഭാവം സന്ദർഭം നിർബന്ധിക്കുന്നില്ല.
- source_word: ἥψατο τῶν ἱματίων
  choice: എന്റെ ഉടുപ്പുകളിൽ തൊട്ടത്
  rationale: ἅπτω എന്നതിന്റെ സന്ദർഭോചിത അർഥം ‘തൊടുക’ എന്നാണ്; ബഹുവചനമായ ἱμάτιαയെ സാധാരണക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ‘ഉടുപ്പുകൾ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: യേശുവിൽനിന്ന് δύναμις പുറപ്പെട്ടതിനെക്കുറിച്ചുള്ള വിവരണം
  choice: ശക്തി യേശുവിൽനിന്ന് യഥാർഥത്തിൽ പുറപ്പെട്ടതായി ആഖ്യാനം പറയുന്ന നേരിട്ടുള്ള രൂപം നിലനിർത്തി.
  alternative: ‘സൗഖ്യമാക്കുന്ന ശക്തി’ എന്ന് വിശദീകരിക്കുകയോ, അത് ഒരു ആത്മനിഷ്ഠ അനുഭവം മാത്രമായിരുന്നുവെന്ന് സൂചിപ്പിക്കുകയോ ചെയ്യുക.
  rationale: മൂലപാഠം ‘ശക്തി’ എന്നു മാത്രമാണ് പറയുന്നത്. അത്ഭുതത്തിന്റെ പ്രവർത്തനരീതി സംബന്ധിച്ച സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കാതെയും ആഖ്യാനത്തിന്റെ അവകാശവാദം ദുർബലപ്പെടുത്താതെയും അതേ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഉള്ളിൽത്തന്നെ അറിഞ്ഞ്’ എന്നത് മൂലത്തിലെ ആന്തരിക അവബോധം നിലനിർത്തുന്നു; ‘ശക്തി’ എന്ന പദം അനാവശ്യമായ ദൈവശാസ്ത്ര വിശദീകരണമില്ലാതെ സൂക്ഷിച്ചിട്ടുണ്ട്.
