review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys εὐθύς (‘ഉടനെ’), Jesus’ inward recognition, the power having gone out from him, his turning amid the crowd, and the question concerning his plural garments. ‘ശക്തി’ appropriately preserves δύναμις without importing an explanation.
  naturalness: The wording is generally fluent modern Malayalam. However, ‘എന്റെ ഉടുപ്പുകളിൽ തൊട്ടത് ആര്?’ uses a locative form where Malayalam more naturally expresses the garments as the direct object of ‘touch.’ ‘എന്റെ ഉടുപ്പുകളെ തൊട്ടത് ആരാണ്?’ is clearer and idiomatic.
  terminology: ‘യേശു,’ ‘ശക്തി,’ ‘ജനക്കൂട്ടം,’ and ‘ഉടുപ്പുകൾ’ are suitable for a modern, respectful register. The footnote’s formal lexical alternative should match the revised direct-object construction.
  issues:
  - severity: low
    issue: The final question uses ‘ഉടുപ്പുകളിൽ’ rather than a direct-object form.
    rationale: The Greek genitive τῶν ἱματίων functions as the object of ἥψατο (‘touched’). Although the locative may be understood, Malayalam ‘ഉടുപ്പുകളെ/വസ്ത്രങ്ങളെ തൊടുക’ more directly and naturally expresses the intended relationship.
  revised_text: ഉടനെ യേശു, തന്നിൽനിന്ന് ശക്തി പുറപ്പെട്ടുപോയെന്ന് ഉള്ളിൽത്തന്നെ അറിഞ്ഞ്, ജനക്കൂട്ടത്തിനിടയിൽ തിരിഞ്ഞ്, “എന്റെ ഉടുപ്പുകളെ[a] തൊട്ടത് ആരാണ്?” എന്നു ചോദിച്ചു.
