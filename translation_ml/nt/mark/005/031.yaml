- from: 'അവന്റെ ശിഷ്യന്മാർ അവനോട് പറഞ്ഞുകൊണ്ടിരുന്നു: “ജനക്കൂട്ടം നിന്നെ ഞെരുക്കുന്നത് നീ കാണുന്നല്ലോ; എന്നിട്ടും ‘ആരാണ് എന്നെ തൊട്ടത്?’ എന്നു നീ ചോദിക്കുന്നുവോ?”[a]'
  to: 'അവന്റെ ശിഷ്യന്മാർ അവനോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “ജനക്കൂട്ടം നിന്നെ ഞെരുക്കിക്കൊണ്ടിരിക്കുന്നത് നീ കാണുന്നല്ലോ; എന്നിട്ടും ‘ആരാണ് എന്നെ തൊട്ടത്?’ എന്നു നീ പറയുന്നുവോ?”'
