reference: Mark 5:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔλεγον αὐτῷ οἱ μαθηταὶ αὐτοῦ· Βλέπεις τὸν ὄχλον συνθλίβοντά σε, καὶ λέγεις· Τίς μου ἥψατο;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: ml
  text: 'അവന്റെ ശിഷ്യന്മാർ അവനോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “ജനക്കൂട്ടം നിന്നെ ഞെരുക്കിക്കൊണ്ടിരിക്കുന്നത് നീ കാണുന്നല്ലോ; എന്നിട്ടും ‘ആരാണ് എന്നെ തൊട്ടത്?’ എന്നു നീ പറയുന്നുവോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയ ongoing അല്ലെങ്കിൽ ആവർത്തിച്ചുള്ള സംസാരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: യേശുവിനോടുള്ള പഠന-അനുഗമനബന്ധം സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പദം.
- source_word: Βλέπεις
  choice: നീ കാണുന്നല്ലോ
  rationale: വർത്തമാനകാല പ്രസ്താവനയെയും ശിഷ്യന്മാർ ചൂണ്ടിക്കാണിക്കുന്ന വ്യക്തമായ സാഹചര്യത്തെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὄχλον
  choice: ജനക്കൂട്ടം
  rationale: സന്ദർഭത്തിന് യോജിച്ച, വ്യക്തവും ആധുനികവുമായ മലയാളപ്രയോഗം.
- source_word: συνθλίβοντά
  choice: ഞെരുക്കുന്നത്
  rationale: ചുറ്റുമുള്ള ജനങ്ങൾ ശരീരപരമായി അമർത്തിക്കൂടുന്ന ശക്തിയും അടുപ്പവും പദം പ്രകടിപ്പിക്കുന്നു; ‘തകർക്കുന്നു’ എന്ന അതിശയോക്തി ഒഴിവാക്കുന്നു.
- source_word: λέγεις
  choice: ചോദിക്കുന്നുവോ
  rationale: λέγεις അക്ഷരാർഥത്തിൽ ‘പറയുന്നു’ എന്നാണെങ്കിലും തുടർന്ന് ഉദ്ധരിക്കുന്നത് ഒരു ചോദ്യം ആയതിനാൽ, മലയാളത്തിലെ സ്വാഭാവിക നേരിട്ടുള്ള സംഭാഷണത്തിൽ ‘ചോദിക്കുന്നുവോ’ എന്ന് നൽകുന്നു.
- source_word: Τίς μου ἥψατο
  choice: ആരാണ് എന്നെ തൊട്ടത്?
  rationale: ἅπτομαι ഇവിടെ നടന്ന ഒരു നിർദിഷ്ട സ്പർശത്തെ സൂചിപ്പിക്കുന്നു; ‘തൊട്ടത്’ ഏറ്റവും സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ശിഷ്യന്മാരുടെ ആശ്ചര്യവും നേരിയ അവിശ്വാസഭാവവും ‘കാണുന്നല്ലോ’, ‘എന്നിട്ടും’ എന്നീ പ്രയോഗങ്ങളിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
