  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: ml
  text: 'യേശു അവനെ അനുവദിച്ചില്ല; പകരം അവനോട് പറഞ്ഞു: “നിന്റെ വീട്ടിലേക്കും നിന്റെ ആളുകളുടെ അടുക്കലേക്കും[a] പോകുക. കർത്താവ്[b] നിനക്കുവേണ്ടി ചെയ്തതും നിന്നോടു കരുണ കാണിച്ചതും അവരോട് അറിയിക്കുക[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം, ‘നിനക്കുള്ളവരുടെ അടുക്കൽ.’ കുടുംബം, ബന്ധുക്കൾ, അടുത്ത സഹചാരികൾ എന്നിവരെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ചിലർ ഇവിടെ ‘കർത്താവ്’ എന്നത് പ്രത്യേകമായി ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു; മറ്റുചിലർ ദൈവത്തിന്റെ കരുണയും യേശുവിന്റെ സ്വന്തം അധികാരവും പ്രവൃത്തിയും തമ്മിലുള്ള ബന്ധം മർക്കോസ് മനപ്പൂർവം നിലനിർത്തുന്നതായി കാണുന്നു.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘കർത്താവ് നിനക്കുവേണ്ടി എത്രമാത്രം ചെയ്തുവെന്നും നിന്നോടു കരുണ കാണിച്ചുവെന്നും അവരോട് അറിയിക്കുക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: അനുവദിച്ചില്ല
  rationale: ഈ സന്ദർഭത്തിൽ ἀφίημι എന്നത് ‘അനുവദിക്കുക’ എന്ന അർഥത്തിലാണ്; ‘ക്ഷമിക്കുക’ എന്ന പതിവർഥമല്ല.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ എന്നാണ്; സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിക്കായി ഭൂതകാലം ഉപയോഗിച്ചു.
- source_word: Ὕπαγε
  choice: പോകുക
  rationale: ഒരു ലക്ഷ്യസ്ഥാനത്തേക്കു മടങ്ങിപ്പോകാനുള്ള കല്പന ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εἰς τὸν οἶκόν σου
  choice: നിന്റെ വീട്ടിലേക്ക്
  rationale: οἶκος ഇവിടെ കെട്ടിടത്തെ മാത്രം അല്ല, സ്വന്തം ഗൃഹപരിസരത്തെയും സൂചിപ്പിക്കാം; ‘വീട്ടിലേക്ക്’ ഈ വ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρὸς τοὺς σούς
  choice: നിന്റെ സ്വന്തക്കാരുടെ അടുക്കൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിനക്കുള്ളവരുടെ അടുക്കൽ’ എന്നാണ്. കുടുംബം, ബന്ധുക്കൾ, അടുത്ത ആളുകൾ എന്നിവരെ ഉൾക്കൊള്ളാവുന്ന വിശാലത ‘സ്വന്തക്കാർ’ നിലനിർത്തുന്നു.
- source_word: ἀπάγγειλον
  choice: അറിയിക്കുക
  rationale: സംഭവിച്ചതിനെക്കുറിച്ച് തിരികെച്ചെന്ന് വിവരിക്കുക എന്ന അർഥം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ὅσα
  choice: ചെയ്തതെല്ലാം
  rationale: ὅσα ചെയ്ത കാര്യങ്ങളുടെ ഉള്ളടക്കവും വ്യാപ്തിയും സൂചിപ്പിക്കുന്നു. ‘ചെയ്തതെല്ലാം’ മലയാളത്തിൽ വ്യക്തമാണ്; ‘എത്രമാത്രം’ എന്ന വായന കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὁ κύριός σοι
  choice: കർത്താവ് നിനക്കുവേണ്ടി
  rationale: κύριος എന്നത് ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്തു. σοι എന്ന ദത്തിവിഭക്തി ‘നിനക്കുവേണ്ടി’ എന്നു ക്രിയയോടു ചേർത്തത് അനുഗ്രഹകരമായ പ്രവൃത്തിയുടെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: ἠλέησέν σε
  choice: നിന്നോടു കരുണ കാണിച്ചതും
  rationale: ἐλεάω എന്ന ക്രിയയിലെ കരുണാപ്രവൃത്തിയും അതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശു ചെയ്ത പ്രവൃത്തിയുടെ പശ്ചാത്തലത്തിൽ κύριος എന്ന പദത്തിന്റെ സൂചന
  choice: കർത്താവ്
  alternative: ദൈവം
  rationale: ‘ദൈവം’ എന്നു വ്യക്തമാക്കി ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ, മൂലപാഠത്തിലെ κύριος എന്ന പദത്തിന്റെ സ്വാഭാവിക തുല്യമായി ‘കർത്താവ്’ നിലനിർത്തുന്നു. ഇതിലൂടെ ദൈവത്തിന്റെ കരുണയും യേശുവിന്റെ അധികാരവും പ്രവൃത്തിയും തമ്മിലുള്ള ബന്ധം വായനക്കാരൻ പരിഗണിക്കാനുള്ള ഇടം ശേഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘സ്വന്തക്കാർ,’ ‘കർത്താവ്,’ ‘കരുണ കാണിച്ചു’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ വ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നതുമാണ്.
