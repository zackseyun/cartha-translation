revisions:
- from: 'യേശു അവനെ അനുവദിച്ചില്ല; പകരം അവനോട് പറഞ്ഞു: “നിന്റെ വീട്ടിലേക്ക്, നിന്റെ സ്വന്തക്കാരുടെ അടുക്കൽ[a] പോകുക. കർത്താവ്[b] നിനക്കുവേണ്ടി ചെയ്തതെല്ലാം[c], നിന്നോടു കരുണ കാണിച്ചതും അവരോട് അറിയിക്കുക.”'
  to: 'യേശു അവനെ അനുവദിച്ചില്ല; പകരം അവനോട് പറഞ്ഞു: “നിന്റെ വീട്ടിലേക്കും നിന്റെ ആളുകളുടെ അടുക്കലേക്കും[a] പോകുക. കർത്താവ്[b] നിനക്കുവേണ്ടി ചെയ്തതും നിന്നോടു കരുണ കാണിച്ചതും അവരോട് അറിയിക്കുക[c].”'
  rationale: The revision preserves every semantic component of the Greek while making the two destinations naturally parallel in Malayalam and, crucially, placing both coordinated divine actions under ‘അറിയിക്കുക.’ It retains ‘കർത്താവ്’ and the interpretive footnote so that the source text's theological referential openness is not resolved in translation. Footnote markers are all anchored once and correspond to their relevant phrases.
  reviewer_model: gpt-5.6-terra
