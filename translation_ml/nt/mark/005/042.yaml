source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: ml
  text: ഉടനെ പെൺകുട്ടി എഴുന്നേറ്റ് നടക്കാൻ തുടങ്ങി[a], കാരണം അവൾക്ക് പന്ത്രണ്ടു വയസ്സായിരുന്നു. ഉടനെ അവർ അത്യന്തം വിസ്മയിച്ചുപോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എഴുന്നേറ്റു” അല്ലെങ്കിൽ “ഉയർന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഈ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തോട് അടുത്ത്, “അവർ വലിയ വിസ്മയത്താൽ വിസ്മയിച്ചു.” തീവ്രമായ വിസ്മയം പ്രകടിപ്പിക്കാൻ ഗ്രീക്കിൽ സജാതീയപദങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ വിവരണത്തിലെ ദ്രുതഗതി സ്വാഭാവികവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: ἀνέστη
  choice: എഴുന്നേറ്റ്
  rationale: ഇവിടെ പെൺകുട്ടി ശരീരമായി എഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ജീവൻ തിരിച്ചുകിട്ടിയതു വ്യക്തമാണെങ്കിലും പദത്തിൽ ആവശ്യത്തിലധികം പുനരുത്ഥാനസാങ്കേതികത ചുമത്തുന്നില്ല.
- source_word: τὸ κοράσιον
  choice: പെൺകുട്ടി
  rationale: പന്ത്രണ്ടു വയസ്സെന്ന വിവരം വാക്യത്തിൽ തന്നെയുള്ളതിനാൽ പ്രായമോ ലഘുത്വമോ അധികമായി നിർണ്ണയിക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: περιεπάτει
  choice: നടക്കാൻ തുടങ്ങി
  rationale: അപൂർണ്ണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന ആരംഭിച്ചും തുടർന്നും നടന്ന പ്രവൃത്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: അവൾക്ക് പന്ത്രണ്ടു വയസ്സായിരുന്നു
  rationale: പ്രായം പറയുന്നതിനുള്ള സ്വാഭാവിക മലയാളപ്രയോഗം; γάρ നൽകുന്ന വിശദീകരണബന്ധം വാക്യക്രമത്താൽ വ്യക്തമാണ്.
- source_word: ἐξέστησαν ... ἐκστάσει μεγάλῃ
  choice: അവർ അത്യന്തം വിസ്മയിച്ചുപോയി
  rationale: സജാതീയ ക്രിയ-നാമപ്രയോഗത്തിന്റെ തീവ്രത മലയാളത്തിൽ അസ്വാഭാവിക ആവർത്തനമില്ലാതെ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀνέστη എന്ന പദത്തിലെ സാധ്യതയുള്ള പുനരുത്ഥാനസൂചന
  choice: എഴുന്നേറ്റ്
  alternative: ഉയർത്തെഴുന്നേറ്റ്
  rationale: സന്ദർഭം ജീവൻ തിരിച്ചുകിട്ടിയ അത്ഭുതമാണെന്ന് വ്യക്തമാക്കുന്നു; എങ്കിലും ക്രിയയ്ക്ക് സാധാരണയായി എഴുന്നേൽക്കുക എന്ന അർഥവും ഉള്ളതിനാൽ മുഖ്യപാഠം അതിലധികം സാങ്കേതികമായ ദൈവശാസ്ത്രഭാരം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രണ്ടു εὐθὺς പദങ്ങളും ‘ഉടനെ’ എന്നു നിലനിർത്തി. തീവ്രവിസ്മയം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സജാതീയപ്രയോഗം മുഖ്യപാഠത്തിൽ സ്വാഭാവിക മലയാളമാക്കി, അടിക്കുറിപ്പിൽ രൂപസവിശേഷത രേഖപ്പെടുത്തി.
