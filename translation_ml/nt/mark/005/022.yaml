source:
  edition: SBLGNT
  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: ml
  text: സിനഗോഗ് നേതാക്കളിൽ ഒരാളായ യായീർ വന്നു. യേശുവിനെ കണ്ടപ്പോൾ അവൻ യേശുവിന്റെ കാൽക്കൽ വീണു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘വരുന്നു … വീഴുന്നു’ എന്ന വർത്തമാനകാലരൂപങ്ങളാണ്; സംഭവത്തെ സജീവമായി അവതരിപ്പിക്കാൻ മർക്കോസ് ഉപയോഗിക്കുന്ന ആഖ്യാനവർത്തമാനമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: വന്നു
  rationale: മർക്കോസ് ഉജ്ജ്വലമായ ആഖ്യാനത്തിനായി വർത്തമാനകാലരൂപം ഉപയോഗിക്കുന്നുവെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാല ആഖ്യാനത്തിന് ‘വന്നു’ യോജിക്കുന്നു.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: യഹൂദപ്പള്ളിയുടെ നേതാക്കളിൽ ഒരാൾ
  rationale: ഭാഗസൂചകമായ ഗ്രീക്ക് പ്രയോഗവും യഹൂദപ്പള്ളിയുടെ ഭരണനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു; ‘പള്ളിപ്രമാണി’യെക്കാൾ ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: ὀνόματι Ἰάϊρος
  choice: യായീറോസ്
  rationale: പേരിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ വിശേഷണബന്ധമായി സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
- source_word: ἰδὼν αὐτὸν
  choice: അവനെ കണ്ടപ്പോൾ
  rationale: ഏകകാലികമോ തുടർന്നുണ്ടാകുന്നതോ ആയ പ്രവർത്തനക്രമം വ്യക്തമാക്കുന്ന സ്വാഭാവിക കാലവാക്യമായി കർത്തൃവാചകത്തെ പരിഭാഷപ്പെടുത്തി; αὐτόν എന്ന സർവനാമം അനാവശ്യമായി പേരാക്കി മാറ്റിയില്ല.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: അവന്റെ കാൽക്കൽ വീണു
  rationale: ശാരീരികമായി ഒരാളുടെ മുമ്പിൽ കാൽക്കൽ വീഴുന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ആരാധനയെന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിനോടുള്ള യായീറോസിന്റെ ശരീരഭാവത്തിന്റെ അർഥം
  choice: അവന്റെ കാൽക്കൽ വീണു
  alternative: അവനെ ആരാധിച്ചു / അവന്റെ മുമ്പിൽ മുട്ടുകുത്തി
  rationale: ഗ്രീക്ക് വാചകം കാൽക്കൽ വീഴുന്ന പ്രവൃത്തിയാണ് വിവരിക്കുന്നത്. അത് ആദരവോ അപേക്ഷയോ നിരാശാഭരിതമായ അഭ്യർഥനയോ സൂചിപ്പിക്കാം; ഇവിടെ ആരാധനയ്ക്കുള്ള പ്രത്യേക പദം ഇല്ലാത്തതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സാധ്യത വിവർത്തനം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ മലയാളം. ‘സിനഗോഗ്’ എന്ന കടമെടുത്ത പദത്തിനുപകരം വ്യക്തമായ ‘യഹൂദപ്പള്ളി’ ഉപയോഗിച്ചു; പഴയ ശൈലിയിലുള്ള ‘പള്ളിപ്രമാണി’ ഒഴിവാക്കി. ഒരേ വാക്യത്തിൽ ആവർത്തിക്കുന്ന സർവനാമങ്ങൾ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതിരിക്കാൻ രണ്ടാമത്തെ ഉപവാക്യത്തിൽ ‘യായീറോസ്’ വീണ്ടും വ്യക്തമാക്കി.
