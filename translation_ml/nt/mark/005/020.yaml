  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: ml
  text: അവൻ പോയി, യേശു തനിക്കുവേണ്ടി എത്രമാത്രം ചെയ്തുവെന്ന്[a] ദെക്കപ്പൊലിയിൽ പ്രഖ്യാപിച്ചുതുടങ്ങി; എല്ലാവരും ആശ്ചര്യപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശു തനിക്കുവേണ്ടി ചെയ്തതെല്ലാം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: പോയി
  rationale: സംഭവസ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἤρξατο κηρύσσειν
  choice: പ്രസംഗിച്ചുതുടങ്ങി
  rationale: ἤρξατο എന്നതിന്റെ ആരംഭാർഥവും κηρύσσειν എന്നതിന്റെ പരസ്യമായി അറിയിക്കൽ എന്ന അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഔപചാരിക മതപ്രഭാഷണം എന്ന അർഥത്തിൽ മാത്രം ഒതുങ്ങുന്നില്ല.
- source_word: ἐν τῇ Δεκαπόλει
  choice: ദെക്കപ്പൊലിയിൽ
  rationale: ἐν എന്നതിന്റെ നേരിട്ടുള്ള സ്ഥലാർഥം സംരക്ഷിക്കുന്നു; പ്രദേശമൊട്ടാകെ എന്ന ആശയം വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ὅσα
  choice: ചെയ്തതെത്രയെന്ന്
  rationale: ὅσα സൂചിപ്പിക്കുന്ന അളവ്/വ്യാപ്തി മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു; ‘ചെയ്തതെല്ലാം’ എന്നതും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐποίησεν αὐτῷ
  choice: തനിക്കുവേണ്ടി ചെയ്ത
  rationale: ദാതൃവിഭക്തിയായ αὐτῷ ഇവിടെ അവന്റെ നന്മയ്ക്കായി ചെയ്തതു സൂചിപ്പിക്കുന്നു; ഹാനികരമായി ‘അവനോട് ചെയ്തത്’ എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: മനുഷ്യരുടെ സമഗ്രസമൂഹത്തെ സൂചിപ്പിക്കുന്ന πάντες എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐθαύμαζον
  choice: ആശ്ചര്യപ്പെട്ടു
  rationale: ആളുകളുടെ വിസ്മയം ആധുനികവും മാന്യവുമായ ഭാഷയിൽ അറിയിക്കുന്നു; ഗ്രീക്കിലെ അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചാസൂചന സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വ്യക്തിത്വവുമായി ബന്ധപ്പെട്ട് ആ മനുഷ്യന്റെ പ്രഖ്യാപനത്തിന്റെ വ്യാപ്തി
  choice: യേശു തനിക്കുവേണ്ടി ചെയ്തതിനെക്കുറിച്ച് ആ മനുഷ്യൻ പ്രസംഗിച്ചുവെന്ന് വാചകം നേരിട്ട് പറയുന്നു; അധിക ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കുന്നില്ല.
  alternative: യേശുവിന്റെ ദൈവിക അധികാരം തുറന്നുപറയുന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ.
  rationale: വാക്യം യേശുവിന്റെ അസാധാരണ ശക്തിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും വ്യക്തമായ സിദ്ധാന്തനിഗമനം പ്രസ്താവിക്കുന്നില്ല; അതിനാൽ ആഖ്യാനത്തിലെ ദൈവശാസ്ത്രപരമായ മുറുക്ക് അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദെക്കപ്പൊലി’ എന്ന ചരിത്രപരമായ സ്ഥലനാമം ലിപ്യന്തരിച്ചു; ‘പ്രസംഗിച്ചു’ എന്നത് ഇവിടെ പൊതുവായി പരസ്യമായി അറിയിക്കുക എന്ന അർഥത്തിലാണ്.
