source:
  edition: SBLGNT
  text: Καὶ ἦλθον εἰς τὸ πέραν τῆς θαλάσσης εἰς τὴν χώραν τῶν ⸀Γερασηνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: ml
  text: അവർ കടലിന്റെ മറുകരയിലേക്ക്, ഗെരസേന്യരുടെ[a] പ്രദേശത്തേക്ക്, എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ഗദരേന്യരുടെ’ എന്നും, മറ്റു ചിലതിൽ ‘ഗെർഗെസേന്യരുടെ’ എന്നും വായനയുണ്ട്.
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: അവർ … എത്തി
  rationale: ഗ്രീക്കിലെ സാധാരണ ആഖ്യാനബന്ധകമായ Καὶ വാക്യപ്രവാഹത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ഒറ്റവാക്യമായ മലയാളത്തിൽ നിർബന്ധിതമായ ‘പിന്നെ’ ചേർക്കാതെ മാർക്കോസിന്റെ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: ἦλθον
  choice: അവർ … എത്തി
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ബഹുവചന ഭൂതകാലരൂപം യേശുവിനെയും കൂടെയുള്ളവരെയും സൂചിപ്പിക്കുന്നു; ലക്ഷ്യസ്ഥാനത്തെത്തിയെന്ന സന്ദർഭത്തിൽ ‘എത്തി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: εἰς τὸ πέραν τῆς θαλάσσης
  choice: കടലിന്റെ മറുകരയിലുള്ള
  rationale: τὸ πέραν എന്നത് എതിർകരയെ സൂചിപ്പിക്കുന്നു. θαλάσσης എന്നതിന് ഉറവിടപദം മാനിച്ച് ‘കടൽ’ നിലനിർത്തുന്നു; ഭൂമിശാസ്ത്രപരമായി ഇത് ഒരു തടാകമാണെങ്കിലും ‘തടാകം’ എന്ന് മാറ്റുന്നില്ല.
- source_word: εἰς τὴν χώραν
  choice: പ്രദേശത്ത്
  rationale: χώρα ഇവിടെ ആധുനിക രാഷ്ട്രം എന്ന അർഥത്തിലുള്ള ‘രാജ്യം’ അല്ല, ഒരു ഭൂപ്രദേശം അഥവാ ജില്ലയാണ്; അതിനാൽ ‘പ്രദേശം’ വ്യക്തമാണ്.
- source_word: Γερασηνῶν
  choice: ഗെരസേന്യരുടെ
  rationale: SBLGNT-യിലെ ജനനാമരൂപം പിന്തുടർന്ന് ഗെരസാ പ്രദേശവുമായി ബന്ധപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന ‘ഗെരസേന്യർ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ഭൂതബാധിതനെക്കുറിച്ചുള്ള വിവരണത്തിലെ സ്ഥലനാമത്തിന്റെ പാഠഭേദം
  choice: ഗെരസേന്യർ
  alternative: ഗദരേന്യർ; ഗെർഗെസേന്യർ
  rationale: SBLGNT മുഖ്യപാഠം Γερασηνῶν എന്നാണ്. പ്രധാന പാഠം അത് പിന്തുടരുന്നു; പ്രാധാന്യമുള്ള കൈയെഴുത്തുപ്രതി ഭേദങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു, അതുവഴി ഭൂമിശാസ്ത്രപരമായോ ദൈവശാസ്ത്രപരമായോ പ്രശ്നം വിവർത്തനത്തിൽ നിശ്ശബ്ദമായി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കടൽ’ എന്ന സുവിശേഷപരമായ ഉറവിടപ്രയോഗവും സ്ഥലനാമത്തിലെ പാഠഭേദവും നിലനിർത്തിയിരിക്കുന്നു.
