source:
  edition: SBLGNT
  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: ml
  text: 'അവൻ അവനോട് ചോദിച്ചുകൊണ്ടിരുന്നു: “നിന്റെ പേരെന്താണ്?” അവൻ അവനോട് പറയുന്നു: “എന്റെ പേര് ലെഗിയോൻ[a] എന്നാണ്; കാരണം ഞങ്ങൾ അനേകരാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ലെഗിയോൻ” എന്നത് ഗ്രീക്കിൽ സ്വീകരിക്കപ്പെട്ട ഒരു ലത്തീൻ സൈനികപദമാണ്; അത് റോമൻ സൈന്യത്തിലെ ഒരു വലിയ സേനാവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ ഇത് സംസാരിക്കുന്ന ഭൂതത്തിന്റെ പ്രസ്താവിത നാമമാണ്; അനേകരുണ്ടെന്ന ആശയവും ഇത് സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ തുടരുന്ന അഥവാ ആവർത്തിച്ചുള്ള ഭാവം ലളിതഭൂതകാലമാക്കി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: Τί ὄνομά σοι
  choice: നിന്റെ പേരെന്താണ്?
  rationale: ὄνομα + ദത്തിവ് സർവനാമം എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: λέγει αὐτῷ
  choice: അവൻ അവനോട് പറയുന്നു
  rationale: ചരിത്രവർത്തമാനകാലം നിലനിർത്തി മർക്കോസിന്റെ സജീവമായ ആഖ്യാനശൈലി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Λεγιὼν
  choice: ലെഗിയോൻ
  rationale: ഇവിടെ ഇത് പൊതുനാമമായി വിവർത്തനം ചെയ്യേണ്ടതല്ല; പ്രസ്താവിക്കപ്പെട്ട പേര്/വിശേഷണം എന്ന നിലയിൽ ഗ്രീക്കിലെ ലത്തീൻ സൈനികപദത്തിന്റെ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: ὄνομά μοι
  choice: എന്റെ പേര് ... എന്നാണ്
  rationale: ദത്തിവ് സർവനാമത്തോടുകൂടിയ ഗ്രീക്ക് നാമവാക്യത്തിന്റെ സ്വാഭാവിക മലയാള സമാനരൂപം.
- source_word: ὅτι πολλοί ἐσμεν
  choice: കാരണം ഞങ്ങൾ അനേകരാണ്
  rationale: ὅτι പേരിന്റെ കാരണം വ്യക്തമാക്കുന്നു; ഏകവചനത്തിൽനിന്ന് പ്രഥമപുരുഷ ബഹുവചനത്തിലേക്കുള്ള നിർണായക മാറ്റവും കൃത്യമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സംസാരിക്കുന്നവന്റെ സ്വയംപരാമർശത്തിൽ ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റം
  choice: “എന്റെ പേര് ലെഗിയോൻ” എന്ന ഏകവചനവും “ഞങ്ങൾ അനേകരാണ്” എന്ന ബഹുവചനവും ഒരുപോലെ നിലനിർത്തി.
  alternative: പിരിമുറുക്കം കുറയ്ക്കാൻ “ഞങ്ങളുടെ പേര് ലെഗിയോൻ” എന്ന് ഏകീകരിക്കുക.
  rationale: ഒരാൾക്കുള്ളിലൂടെ സംസാരിക്കുന്ന അനേകം ഭൂതങ്ങളുടെ നാടകീയമായ ബഹുത്വം സൂചിപ്പിക്കുന്ന ഗ്രീക്കിലെ ഏകവചന-ബഹുവചന മാറ്റം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനഭാഷ. ഗ്രീക്കിലെ അപൂർണ ഭൂതകാലവും ചരിത്രവർത്തമാനകാലവും കഴിയുന്നത്ര വ്യക്തമായി നിലനിർത്തിയിട്ടുണ്ട്; സർവനാമങ്ങളുടെ ആവർത്തനം ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതെ മൂലവാക്യത്തിന്റെ ഘടന പ്രതിഫലിപ്പിക്കുന്നു.
