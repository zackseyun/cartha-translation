revisions:
- from: 'അവൻ അവളോടു പറഞ്ഞു: “മകളേ, നിന്റെ വിശ്വാസം നിന്നെ രക്ഷിച്ചിരിക്കുന്നു.[a] സമാധാനത്തോടെ പോകുക; നിന്റെ കഷ്ടതയിൽനിന്ന് സൗഖ്യമുള്ളവളായിരിക്കുക.[b]”'
  to: 'അവൻ അവളോടു പറഞ്ഞു: “മകളേ, നിന്റെ വിശ്വാസം നിന്നെ രക്ഷിച്ചിരിക്കുന്നു.[a] സമാധാനത്തോടെ പോകുക; നിന്റെ രോഗബാധയിൽനിന്ന് സൗഖ്യമായിരിക്കുക.[b]”'
