    issue: The rendering ‘കഷ്ടതയിൽനിന്ന് സൗഖ്യമുള്ളവളായിരിക്കുക’ is stylistically strained and ‘കഷ്ടത’ is semantically too general in this healing context.
    rationale: μάστιξ literally denotes a scourge but functions here as a vivid designation for the woman’s illness/affliction. ‘രോഗബാധ’ supplies the contextual referent, and a revised predicate gives natural Malayalam without erasing the Greek distinction between σῴζω and ὑγιής.
