id: MRK.5.34
reference: Mark 5:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: ml
  text: 'അവൻ അവളോടു പറഞ്ഞു: “മകളേ, നിന്റെ വിശ്വാസം നിന്നെ രക്ഷിച്ചിരിക്കുന്നു.[a] സമാധാനത്തോടെ പോകുക; നിന്റെ രോഗബാധയിൽനിന്ന് സൗഖ്യമായിരിക്കുക.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ വിശ്വാസം നിന്നെ സൗഖ്യമാക്കിയിരിക്കുന്നു” അല്ലെങ്കിൽ “നിന്നെ സുഖപ്പെടുത്തിയിരിക്കുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് രക്ഷ, വിടുതൽ, രോഗസൗഖ്യം എന്നീ അർഥങ്ങൾ വരാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “സുഖമായിരിക്കുക” അല്ലെങ്കിൽ “പൂർണസൗഖ്യത്തിൽ ഇരിക്കുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: മകളേ
  rationale: സംബോധനാരൂപം നേരിട്ട് നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ഉടമസ്ഥപദം ചേർക്കാതെ ആർദ്രതയും കുടുംബബന്ധത്തിന്റെ സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഇവിടെ യേശുവിലുള്ള സ്ത്രീയുടെ ആശ്രയവും വിശ്വാസപരമായ പ്രതികരണവുമാണ് സൂചിപ്പിക്കുന്നത്; പ്രധാന ദൈവശാസ്ത്രപദത്തിന്റെ സ്ഥിരതയും നിലനിർത്തുന്നു.
- source_word: σέσωκέν
  choice: രക്ഷിച്ചിരിക്കുന്നു
  rationale: σῴζω എന്ന ക്രിയയുടെ രക്ഷ, സൗഖ്യം എന്നീ വിശാല അർഥസാധ്യതകൾ ചുരുക്കാതെ സൂക്ഷിക്കുന്നു. പൂർണ്ണകാലത്തിന്റെ നിലവിലുള്ള ഫലം ‘രക്ഷിച്ചിരിക്കുന്നു’ എന്ന രൂപത്തിൽ പ്രതിഫലിക്കുന്നു.
- source_word: ὕπαγε εἰς εἰρήνην
  choice: സമാധാനത്തോടെ പോകുക
  rationale: പിരിഞ്ഞുപോകുമ്പോഴുള്ള സമാധാനത്തിന്റെയും ക്ഷേമത്തിന്റെയും അവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἴσθι ὑγιὴς
  choice: സൗഖ്യമുള്ളവളായിരിക്കുക
  rationale: ക്രിയാവാക്യം രോഗശാന്തിയുടെ സംഭവത്തെക്കാൾ സൗഖ്യാവസ്ഥയിൽ തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ സ്ഥിതിവാചകമായ പരിഭാഷ സ്വീകരിച്ചു.
- source_word: μάστιγός
  choice: കഷ്ടത
  rationale: അക്ഷരാർഥത്തിലെ ‘ചമ്മട്ടി/പ്രഹരം’ എന്ന രൂപകത്തിന്റെ പശ്ചാത്തലത്തിൽ, ഇവിടെ സ്ത്രീയെ പീഡിപ്പിച്ച ഗുരുതര രോഗബാധയെ വിശാലമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
theological_decisions:
- issue: σῴζω എന്ന പദത്തിൽ രക്ഷയും രോഗസൗഖ്യവും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: രക്ഷിച്ചിരിക്കുന്നു
  alternative: സൗഖ്യമാക്കിയിരിക്കുന്നു / സുഖപ്പെടുത്തിയിരിക്കുന്നു
  rationale: തുടർന്നുള്ള ἴσθι ὑγιὴς ശരീരസൗഖ്യത്തെ പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ, ആദ്യക്രിയയെ ‘രക്ഷിച്ചു’ എന്ന് നൽകുന്നത് ഗ്രീക്കിലെ വ്യത്യാസവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
- issue: πίστις എന്നതിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം / വിശ്വസ്തത
  rationale: ഈ സന്ദർഭത്തിൽ സ്ത്രീ യേശുവിൽ ആശ്രയിച്ച് സമീപിച്ചതാണ് പ്രധാനം; ദീർഘകാല വിശ്വസ്തതയല്ല. ‘വിശ്വാസം’ അർഥവും പ്രധാന പദത്തിന്റെ സ്ഥിരതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ശൈലി. ‘മകളേ’ എന്ന അടുപ്പമുള്ള സംബോധനവും ‘രക്ഷിച്ചിരിക്കുന്നു’ എന്ന വിശാല ദൈവശാസ്ത്രപദവും നിലനിർത്തി; ἴσθι ὑγιὴς എന്ന സ്ഥിതിവാചക നിർദേശത്തിന് ‘സൗഖ്യമുള്ളവളായിരിക്കുക’ ഉപയോഗിച്ചു.
