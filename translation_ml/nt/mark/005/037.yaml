source:
  edition: SBLGNT
  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: ml
  text: പത്രോസിനെയും യാക്കോബിനെയും യാക്കോബിന്റെ സഹോദരനായ യോഹന്നാനെയും അല്ലാതെ മറ്റാരെയും തന്നോടൊപ്പം വരാൻ അവൻ അനുവദിച്ചില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: അനുവദിച്ചില്ല
  rationale: ക്രിയാനിഷേധത്തോടും infinitive-നോടും ചേർന്ന ഈ പ്രയോഗം ‘അനുവദിക്കുക’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി നിഷേധരൂപത്തിൽ അവതരിപ്പിച്ചു.
- source_word: οὐδένα
  choice: മറ്റാരെയും
  rationale: εἰ μὴ അവതരിപ്പിക്കുന്ന ഒഴിവാക്കലുമായി ചേർന്ന്, തിരഞ്ഞെടുത്ത മൂവരൊഴികെ ആരെയും അനുവദിച്ചില്ലെന്ന സമ്പൂർണ വിലക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: μετ’ αὐτοῦ
  choice: തന്നോടൊപ്പം
  rationale: കർത്താവ് യേശുവാണെന്ന സന്ദർഭം നിലനിർത്തിക്കൊണ്ട്, കൂടെ പോകുന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: συνακολουθῆσαι
  choice: വരാൻ
  rationale: μετ’ αὐτοῦ എന്നതിനൊപ്പം ചേർന്നപ്പോൾ ‘തന്നോടൊപ്പം വരാൻ’ എന്നത്, ഒപ്പം പിന്തുടരുക/കൂടെ പോകുക എന്ന സന്ദർഭാർഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: ഇവിടെ നിബന്ധനയല്ല, ഒഴിവാക്കലാണ് സൂചിപ്പിക്കുന്നത്; ‘അല്ലാതെ’ അതിനെ വ്യക്തമായി നൽകുന്നു.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: പത്രോസിനെയും യാക്കോബിനെയും ... യോഹന്നാനെയും
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള സംയോജനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘-യെയും’ ഏകോപനത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: യാക്കോബിന്റെ സഹോദരനായ
  rationale: യോഹന്നാനെ തിരിച്ചറിയിക്കുന്ന appositional വിശേഷണം സുതാര്യമായി നിലനിർത്തുന്നു.
