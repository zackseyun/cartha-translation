  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ സമ്പൂർണ വിലക്കും മൂന്നു ശിഷ്യന്മാർക്കുള്ള ഒഴിവാക്കലും വ്യക്തമായി സംരക്ഷിച്ചു.
