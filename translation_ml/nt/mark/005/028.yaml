language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὅτι ⸂Ἐὰν ἅψωμαι κἂν τῶν ἱματίων αὐτοῦ⸃ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: ml
  text: 'കാരണം, അവൾ പറഞ്ഞുകൊണ്ടിരുന്നു: “അവന്റെ വസ്ത്രങ്ങളിൽ ഒന്നിൽപോലും തൊട്ടാൽ ഞാൻ സൗഖ്യം പ്രാപിക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ: “ഞാൻ രക്ഷിക്കപ്പെടും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് “രക്ഷിക്കപ്പെടുക,” “സൗഖ്യം പ്രാപിക്കുക,” “സുഖപ്പെടുക” എന്നീ അർഥങ്ങൾ വരാം; ഈ സന്ദർഭം ശാരീരിക സൗഖ്യത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലക്രിയയുടെ തുടർച്ചയോ ആവർത്തനമോ സൂചിപ്പിക്കുന്ന ഭാവം നിലനിർത്തുന്നു; ഇത് ഉച്ചരിച്ച വാക്കുകളാണോ ഉള്ളിലെ ചിന്തയാണോ എന്ന് അനാവശ്യമായി തീരുമാനിക്കുന്നില്ല.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ അവളുടെ പ്രവൃത്തിക്കുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: നേരിട്ടുള്ള ഉദ്ധരണിയായി
  rationale: അവൾ പറഞ്ഞതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണി സ്വാഭാവികമാണ്.
- source_word: ἐὰν ἅψωμαι
  choice: തൊട്ടാൽ
  rationale: ഉപാധിയെ സ്വാഭാവികമായ മലയാള വ്യവസ്ഥാവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: κἂν τῶν ἱματίων αὐτοῦ
  choice: അവന്റെ വസ്ത്രങ്ങളിൽ ഒന്നു ... പോലും
  rationale: വസ്ത്രങ്ങൾ എന്ന ബഹുവചനവും ‘ഒന്നെങ്കിലും/വെറും’ എന്ന ലഘൂകരണ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: σωθήσομαι
  choice: ഞാൻ സൗഖ്യം പ്രാപിക്കും
  rationale: രക്തസ്രാവത്തിൽനിന്നുള്ള ശാരീരിക സൗഖ്യമാണ് ഉടൻ പ്രസക്തമായ അർഥം. അതേസമയം ‘രക്ഷിക്കപ്പെടും’ എന്ന വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സൗഖ്യവിവരണത്തിലെ σωθήσομαι എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഞാൻ സൗഖ്യം പ്രാപിക്കും
  alternative: ഞാൻ രക്ഷിക്കപ്പെടും / ഞാൻ സുഖപ്പെടും
  rationale: സന്ദർഭം ശാരീരിക രോഗശാന്തിയിലേക്കാണ് നേരിട്ട് വിരൽചൂണ്ടുന്നത്. എന്നാൽ σῴζω എന്ന ക്രിയയിൽ രക്ഷയും സൗഖ്യവും തമ്മിലുള്ള അർഥവ്യാപ്തി ഉള്ളതിനാൽ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘വസ്ത്രം’ എന്ന പൊതുപദം ബഹുവചനത്തിൽ നിലനിർത്തി; ‘അങ്കി’ പോലുള്ള കൂടുതൽ നിർദ്ദിഷ്ടമായ പദം ഒഴിവാക്കി. അപൂർണകാലഭാവം ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
