translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ മൃദുവായ δέ-യ്ക്ക് പ്രത്യേക ബന്ധകപദം നിർബന്ധിച്ച് ചേർക്കാതെ മലയാള വാക്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിൽ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
