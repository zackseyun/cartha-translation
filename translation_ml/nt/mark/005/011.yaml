  to: അവിടെ മലയുടെ സമീപം പന്നികളുടെ ഒരു വലിയ കൂട്ടം മേഞ്ഞുകൊണ്ടിരുന്നു.[a][b]
  rationale: The revision replaces an awkward verb with the idiomatic animal-feeding verb മേഞ്ഞുകൊണ്ടിരുന്നു, while preserving the participle’s ongoing action and avoiding unsupported specification beyond the immediate setting. It also replaces an imprecise footnote alternative with a valid formal synonym.
