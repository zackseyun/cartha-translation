  text: ἦν δὲ ἐκεῖ πρὸς τῷ ὄρει ἀγέλη χοίρων μεγάλη βοσκομένη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/011.yaml
  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: ml
  text: അവിടെ മലയുടെ സമീപം പന്നികളുടെ ഒരു വലിയ കൂട്ടം മേഞ്ഞുകൊണ്ടിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മലയുടെ അരികെ.’ πρὸς τῷ ὄρει എന്ന ഗ്രീക്ക് പ്രയോഗം മലയുടെ സമീപത്തോ അരികിലോ ഉള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പന്നികൾ’ എന്നതിന് ഔപചാരികമായി ‘ശൂകരങ്ങൾ’ എന്നും പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ഉണ്ടായിരുന്നു / തീറ്റിക്കൊണ്ടിരുന്നു
  rationale: ἦν എന്ന അസ്തിത്വക്രിയയും δέ എന്ന മൃദുവായ ആഖ്യാനബന്ധകവും മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കുന്നു; δέ-യ്ക്കായി അനാവശ്യമായ ശക്തമായ വിരോധപദം ചേർത്തിട്ടില്ല.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: സ്ഥലസൂചകമായ ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: πρὸς τῷ ὄρει
  choice: മലയുടെ അരികെ
  rationale: ദത്തിവിനോടുകൂടിയ πρός ഇവിടെ മലയുടെ സമീപത്തോ അരികിലോ ഉള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; കൃത്രിമമായ അതിസൂക്ഷ്മത ഒഴിവാക്കുന്നു.
- source_word: ἀγέλη
  choice: കൂട്ടം
  rationale: മൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന സാധാരണയും വായനാസൗഹൃദവുമായ മലയാളപദം.
- source_word: χοίρων
  choice: പന്നികളുടെ
  rationale: χοῖρος എന്നതിന്റെ ആധുനികവും നേരിട്ടുമായ മലയാള തുല്യം; പഴക്കമുള്ളതോ അത്യന്തം ഔപചാരികമോ ആയ പര്യായം ഒഴിവാക്കി.
- source_word: μεγάλη
  choice: വലിയ
  rationale: കൂട്ടത്തിന്റെ വലുപ്പമോ എണ്ണമോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക വിശേഷണം.
- source_word: βοσκομένη
  choice: തീറ്റിക്കൊണ്ടിരുന്നു
  rationale: കൂട്ടം അപ്പോൾ ഭക്ഷിച്ചുകൊണ്ടിരുന്ന തുടർച്ചയായ പ്രവൃത്തി വ്യക്തമാക്കുന്നു; പുല്ല് മാത്രം മേയുന്നതായി അർത്ഥം ചുരുക്കുന്നില്ല.
