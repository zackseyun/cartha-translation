revisions:
- from: അനേകം വൈദ്യന്മാരുടെ ചികിത്സയിൽ[a] വളരെ കഷ്ടം അനുഭവിക്കുകയും തനിക്കുണ്ടായിരുന്നതെല്ലാം[b] ചെലവഴിക്കുകയും ചെയ്തിട്ടും യാതൊരു പ്രയോജനവും ലഭിക്കാതെ, മറിച്ച് അവളുടെ നില കൂടുതൽ വഷളായിത്തീരുകയും ചെയ്തിരുന്നു.
  to: അനേകം വൈദ്യന്മാരുടെ ചികിത്സയിൽ വളരെ കഷ്ടം അനുഭവിക്കുകയും തനിക്കുണ്ടായിരുന്നതെല്ലാം ചെലവഴിക്കുകയും യാതൊരു പ്രയോജനവും ലഭിക്കാതെ, മറിച്ച് അവളുടെ സ്ഥിതി കൂടുതൽ വഷളാകുകയും ചെയ്തിരുന്നു.
