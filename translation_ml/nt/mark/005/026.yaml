reference: Mark 5:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: ml
  text: അനേകം വൈദ്യന്മാരുടെ ചികിത്സയിൽ വളരെ കഷ്ടം അനുഭവിക്കുകയും തനിക്കുണ്ടായിരുന്നതെല്ലാം ചെലവഴിക്കുകയും യാതൊരു പ്രയോജനവും ലഭിക്കാതെ, മറിച്ച് അവളുടെ സ്ഥിതി കൂടുതൽ വഷളാകുകയും ചെയ്തിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: വളരെ കഷ്ടം അനുഭവിക്കുകയും
  rationale: πάσχω എന്നതിന്റെ അനുഭവപരമായ അർത്ഥവും മുൻകാല സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന എഒറിസ്റ്റ് കൃതന്തത്തിന്റെ ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: അനേകം വൈദ്യന്മാരുടെ ചികിത്സയിൽ
  rationale: ὑπό + ഷഷ്ഠി വൈദ്യന്മാരുടെ പ്രവർത്തനകാരകത്വത്തെയോ അവരുടെ ചികിത്സകൾക്ക് അവൾ വിധേയയായിരുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; പ്രധാന പാഠത്തിലെ ഈ രൂപം രണ്ടാമത്തെ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δαπανήσασα
  choice: ചെലവഴിക്കുകയും
  rationale: സമാന്തര എഒറിസ്റ്റ് കൃതന്തത്തിന്റെ അർത്ഥം അതിശയോക്തിയില്ലാതെ നേരിട്ട് നൽകുന്നു.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: തനിക്കുണ്ടായിരുന്നതെല്ലാം
  rationale: അവളുടെ കൈവശമുണ്ടായിരുന്ന എല്ലാം എന്ന ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: യാതൊരു പ്രയോജനവും ലഭിക്കാതെ
  rationale: ὠφελέω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം ചികിത്സകളിൽനിന്ന് അവൾക്ക് ഒരു ഗുണവും ലഭിച്ചില്ലെന്ന നിലയിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀλλὰ μᾶλλον
  choice: മറിച്ച്
  rationale: പ്രയോജനം ലഭിക്കാതിരുന്നത് മാത്രമല്ല, വിപരീതഫലമുണ്ടായി എന്ന ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: അവളുടെ നില കൂടുതൽ വഷളായിത്തീരുകയും
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കൂടുതൽ മോശമായ അവസ്ഥയിലേക്കു വരുക’ എന്ന പ്രയോഗത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ കൃതന്തശൃംഖല മലയാളത്തിലെ ‘ചെയ്യുകയും … ചെയ്തിട്ടും … ചെയ്യുകയും ചെയ്തിരുന്നു’ എന്ന ഘടനയിൽ സ്വാഭാവികമാക്കി; വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുമെന്ന സ്വഭാവവും നിലനിർത്തി.
