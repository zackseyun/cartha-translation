id: MRK.5.16
reference: Mark 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: ml
  text: അതു കണ്ടവർ പിശാചുബാധിതനായ മനുഷ്യന്[a] സംഭവിച്ചതെങ്ങനെയെന്നും പന്നികളെക്കുറിച്ചും അവരോടു വിവരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പിശാച് ബാധിച്ചിരുന്ന മനുഷ്യന്’; ‘ദുരാത്മാവ് ബാധിച്ചിരുന്ന മനുഷ്യന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: വിവരിച്ചു
  rationale: സംഭവം വിശദമായി പറഞ്ഞറിയിക്കുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἱ ἰδόντες
  choice: അതു കണ്ടവർ
  rationale: സംഭവത്തിനു സാക്ഷികളായവരെ സൂചിപ്പിക്കുന്ന നാമീകൃത കൃദന്തരൂപം നിലനിർത്തുന്നു; മലയാളത്തിൽ ആവശ്യമായ കർമസൂചനയായി ‘അതു’ ചേർത്തിരിക്കുന്നു.
- source_word: πῶς ἐγένετο
  choice: സംഭവിച്ചതെങ്ങനെയെന്ന്
  rationale: സംഭവത്തിന്റെ രീതിയോ ഗതിയോ വിവരിച്ചുവെന്ന πῶς എന്ന പദത്തിന്റെ അർഥം സംരക്ഷിക്കുന്നു; ‘എന്തു സംഭവിച്ചു’ എന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: τῷ δαιμονιζομένῳ
  choice: പിശാചുബാധിതനായ മനുഷ്യന്
  rationale: പൈശാചിക ബാധയ്ക്ക് വിധേയനായ വ്യക്തിയെ വ്യക്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു; വ്യക്തിയെ വെറും ഒരു വിശേഷണനാമമായി മാത്രം അവതരിപ്പിക്കാതിരിക്കാൻ ‘മനുഷ്യൻ’ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: περὶ τῶν χοίρων
  choice: പന്നികളെക്കുറിച്ചും
  rationale: περί + സമ്പാദികയുടെ ‘കുറിച്ച്’ എന്ന അർഥവും καί നൽകുന്ന കൂട്ടിച്ചേർക്കലും സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: δαιμονιζομένῳ എന്ന പദത്തിലെ പൈശാചിക ബാധയുടെ അവതരണം
  choice: പിശാചുബാധിതനായ മനുഷ്യൻ
  alternative: പിശാച് ബാധിച്ചിരുന്ന മനുഷ്യൻ; ദുരാത്മാവ് ബാധിച്ചിരുന്ന മനുഷ്യൻ
  rationale: മർക്കോസിന്റെ ആഖ്യാനത്തിൽ യഥാർഥമായ പൈശാചിക ബാധയാണ് അവതരിപ്പിക്കുന്നത്. തിരഞ്ഞെടുത്ത രൂപം അതിനെ മനശ്ശാസ്ത്രപരമായ അവസ്ഥയായി ലഘൂകരിക്കാതെയും ബാധയുടെ കൃത്യമായ സ്വഭാവത്തെക്കുറിച്ച് മൂലപാഠത്തേക്കാൾ കൂടുതൽ സിദ്ധാന്തവത്കരിക്കാതെയും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘വിവരിച്ചു’ എന്നത് διηγήσαντο എന്ന പദത്തിന്റെ വിശദമായി പറഞ്ഞറിയിക്കുന്ന ഭാവം നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിന് അനുസൃതമാണ്.
