reference: Mark 5:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: ml
  text: അവർ അവനെ പരിഹാസത്തോടെ ചിരിക്കുകയായിരുന്നു[a]. എന്നാൽ അവൻ എല്ലാവരെയും പുറത്താക്കിയശേഷം, കുട്ടിയുടെ അപ്പനെയും അമ്മയെയും തന്നോടുകൂടെയുണ്ടായിരുന്നവരെയും[b] കൂട്ടിക്കൊണ്ടുപോയി, കുട്ടി ഉണ്ടായിരുന്നിടത്ത് പ്രവേശിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ പരിഹസിച്ചു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് അപഹാസത്തോടെയുള്ള ചിരിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അവനോടൊപ്പം ഉണ്ടായിരുന്ന ശിഷ്യന്മാർ.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: പരിഹസിച്ചു ചിരിക്കുകയായിരുന്നു
  rationale: അപഹാസത്തോടെയുള്ള ചിരി എന്ന ക്രിയയുടെ അർഥവും അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാസ്വഭാവവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: αὐτοῦ
  choice: അവനെ
  rationale: καταγελάω എന്ന ക്രിയയോടൊപ്പമുള്ള ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിയുടെ സ്വാഭാവിക മലയാള അർഥം ‘അവനെ നോക്കി/അവനെ പരിഹസിച്ച്’ എന്നതാണ്; ഇവിടെ സംക്ഷിപ്തമായി ‘അവനെ’ എന്നു നൽകി.
- source_word: ἐκβαλὼν πάντας
  choice: എല്ലാവരെയും പുറത്താക്കിയശേഷം
  rationale: കൃദന്തരൂപം മുഖ്യക്രിയകൾക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘പുറത്താക്കി’ എന്നത് ശക്തി നിലനിർത്തുമ്പോഴും ഭൂതോച്ചാടനത്തെ അനാവശ്യമായി ധ്വനിപ്പിക്കുന്നില്ല.
- source_word: παραλαμβάνει
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: തിരഞ്ഞെടുത്തവരെ തന്നോടൊപ്പം കൊണ്ടുപോകുന്നു എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള ചരിത്രവർത്തമാനമായ ‘ചെല്ലുന്നു’യോട് ചേർന്നു നിൽക്കുന്നു.
- source_word: παιδίου / παιδίον
  choice: കുട്ടി / കുട്ടിയുടെ
  rationale: സന്ദർഭത്തിൽ യായീറൊസിന്റെ മകളാണെങ്കിലും ഈ വാക്യത്തിലെ ലിംഗനിരപേക്ഷമായ παιδίον എന്ന പദത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: തന്നോടുകൂടെയുണ്ടായിരുന്നവർ
  rationale: യേശുവിനോടൊപ്പം വന്നവരെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മുഖ്യപാഠത്തിൽ അവരുടെ തിരിച്ചറിയൽ അധികമായി വ്യക്തമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: εἰσπορεύεται
  choice: അകത്തേക്കു ചെല്ലുന്നു
  rationale: അകത്തേക്കുള്ള ചലനം വ്യക്തമായി നൽകുകയും മർക്കോസിന്റെ ചരിത്രവർത്തമാനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: കുട്ടി ഉണ്ടായിരുന്നിടത്തേക്ക്
  rationale: കുട്ടി കിടന്നിരുന്നു എന്ന് മൂലപാഠത്തിൽ ഇല്ലാത്ത വിവരം ചേർക്കാതെ സ്ഥലസൂചന മാത്രം നൽകുന്നു.
theological_decisions:
- issue: ആഖ്യാനകാലവും സജീവതയും
  choice: മുഖ്യ ആഖ്യാനക്രിയയിലെ ചരിത്രവർത്തമാനം ‘ചെല്ലുന്നു’ എന്നു നിലനിർത്തി
  alternative: എല്ലാം ഭൂതകാലത്തിലാക്കി ‘ചെന്നു’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: മർക്കോസ് പതിവായി ഉപയോഗിക്കുന്ന ചരിത്രവർത്തമാനം ആഖ്യാനത്തിന് നൽകുന്ന സജീവത മലയാളത്തിലും വായനാസൗകര്യം നഷ്ടമാകാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അപ്പൻ’, ‘അമ്മ’ എന്നീ സാധാരണ ബന്ധപദങ്ങൾ കുട്ടിയെ കേന്ദ്രീകരിച്ചുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികത നിലനിർത്തുന്നു; ചരിത്രവർത്തമാനം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിട്ടുണ്ട്.
