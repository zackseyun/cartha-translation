id: MRK.5.18
reference: Mark 5:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: ml
  text: യേശു പടകിൽ കയറിക്കൊണ്ടിരിക്കുമ്പോൾ, മുമ്പ് ഭൂതബാധിതനായിരുന്ന[a] മനുഷ്യൻ തന്നോടൊപ്പം ഇരിക്കണമെന്നു യേശുവിനോട് അപേക്ഷിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂതബാധിതനായ മനുഷ്യൻ.’
    reason: δαιμονισθείς എന്നതിന് മുമ്പത്തെ അവസ്ഥ വ്യക്തമാക്കാതെയുള്ള സംക്ഷിപ്ത പര്യായപ്രയോഗം.
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον
  choice: അവൻ പടകിൽ കയറിക്കൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം മുഖ്യക്രിയയോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കയറിക്കൊണ്ടിരിക്കുമ്പോൾ’ ആ കാലസൂക്ഷ്മത സ്വാഭാവികമായി നിലനിർത്തുന്നു. ഗലീലക്കടൽ പശ്ചാത്തലത്തിൽ πλοῖον എന്നതിന് ‘പടക്’ യോജിക്കുന്നു.
- source_word: παρεκάλει
  choice: അപേക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്ന അപേക്ഷയെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം അതിന്റെ ദൈർഘ്യവും ഗൗരവവും അതിശയോക്തിയില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: ὁ δαιμονισθείς
  choice: മുമ്പ് ഭൂതബാധിതനായിരുന്ന മനുഷ്യൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ച കൃദന്തം ഇതിനുമുമ്പ് ഭൂതബാധയിൽനിന്ന് വിടുവിക്കപ്പെട്ട മനുഷ്യനെ സൂചിപ്പിക്കുന്നു. ‘മുമ്പ്’ എന്നത് കഥാസന്ദർഭത്തിലെ മുൻകാലാവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: അദ്ദേഹത്തോടൊപ്പം കഴിയണമെന്നു
  rationale: ἵνα സഹിതമുള്ള വിധിലിംഗരൂപം അപേക്ഷയുടെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു. ‘കഴിയുക’ എന്നത് കൂടെയായിരിക്കുക എന്ന ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു; കൂടെ യാത്രചെയ്യുക എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: δαιμονισθείς എന്ന പദത്തിലെ ഭൂതാത്മീയ പീഡനത്തിന്റെ സ്വഭാവം
  choice: ഭൂതബാധിതനായിരുന്ന
  alternative: ഭൂതത്തിന്റെ അധികാരത്തിൻ കീഴിലായിരുന്ന
  rationale: സുവിശേഷകഥയിലെ യഥാർഥ ഭൂതാത്മീയ അധീനതയെ ‘ഭൂതബാധിതൻ’ എന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപ്രയോഗം അറിയിക്കുന്നു; അതിനെ വെറും രോഗമോ രൂപകമോ ആയി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആദ്യത്തെ ‘അവൻ’ മൂലപാഠത്തിലെ സർവനാമം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘അദ്ദേഹം’ യേശുവിനെയും അപേക്ഷിക്കുന്ന മനുഷ്യനെയും തമ്മിൽ വ്യക്തമായി വേർതിരിക്കാൻ സഹായിക്കുന്നു.
