revisions:
- from: അവൻ പടകിൽ കയറിക്കൊണ്ടിരിക്കുമ്പോൾ, മുമ്പ് ഭൂതബാധിതനായിരുന്ന[a] മനുഷ്യൻ അദ്ദേഹത്തോടൊപ്പം കഴിയണമെന്നു അദ്ദേഹത്തോട് അപേക്ഷിച്ചുകൊണ്ടിരുന്നു.
  to: യേശു പടകിൽ കയറിക്കൊണ്ടിരിക്കുമ്പോൾ, മുമ്പ് ഭൂതബാധിതനായിരുന്ന[a] മനുഷ്യൻ തന്നോടൊപ്പം ഇരിക്കണമെന്നു യേശുവിനോട് അപേക്ഷിച്ചുകൊണ്ടിരുന്നു.
  rationale: ‘തന്നോടൊപ്പം ഇരിക്കണം’ എന്ന പ്രയോഗം μετ’ αὐτοῦ ᾖ എന്നതിലെ വ്യക്തിപരമായ ‘കൂടെ ഇരിക്കുക/ആയിരിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു. യേശുവിനെ ആദ്യമായി വ്യക്തമാക്കുന്നതും അപേക്ഷയുടെ അഭിസംബോധിതനെ വ്യക്തമാക്കുന്നതും സർവനാമസൂചനയിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു. ‘അപേക്ഷിച്ചുകൊണ്ടിരുന്നു’ അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ച നിലനിർത്തുന്നു.
