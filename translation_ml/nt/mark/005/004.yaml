  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: ml
  text: കാരണം, അവനെ പലപ്പോഴും കാൽവിലങ്ങുകളും ചങ്ങലകളുംകൊണ്ട് ബന്ധിച്ചിരുന്നതും, അവൻ ചങ്ങലകൾ വലിച്ചുപൊട്ടിച്ചതും കാൽവിലങ്ങുകൾ തകർത്തുകളഞ്ഞതും, അവനെ അടക്കാൻ[a] ആർക്കും ശക്തിയില്ലാതിരുന്നതും കൊണ്ടാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മെരുക്കാൻ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘മെരുക്കുക’ എന്നും, കൂടുതൽ പൊതുവായി ‘കീഴടക്കുക’ അഥവാ ‘നിയന്ത്രണത്തിലാക്കുക’ എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: കാരണം, അവനെ ... ബന്ധിച്ചിരുന്നെങ്കിലും
  rationale: διάയോടുകൂടിയ articular infinitive മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള കാരണം നൽകുന്നു. തുടർന്നുള്ള പരാജയപ്പെട്ട ബന്ധനശ്രമങ്ങളോടുള്ള വിരുദ്ധബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘എങ്കിലും’ കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: πολλάκις
  choice: പലപ്പോഴും
  rationale: ആവർത്തിച്ച് സംഭവിച്ചതിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: πέδαις / τὰς πέδας
  choice: കാൽവിലങ്ങുകൾ / കാൽവിലങ്ങുകളെ
  rationale: πέδη പൊതുവായ ചങ്ങലയെയല്ല, പ്രത്യേകിച്ച് കാലിൽ ഇടുന്ന വിലങ്ങിനെയാണ് സൂചിപ്പിക്കുന്നത്; ἅλυσις എന്ന വേറിട്ട പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: ചങ്ങലകൾ / ചങ്ങലകളെ
  rationale: ἅλυσις എന്നത് ചങ്ങലയെ സൂചിപ്പിക്കുന്നു; കാൽവിലങ്ങുകളിൽനിന്ന് വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തി.
- source_word: δεδέσθαι
  choice: ബന്ധിച്ചിരുന്നെങ്കിലും
  rationale: perfect infinitive മുൻകാലത്തെ ആവർത്തിച്ച ബന്ധനവും അതിന്റെ ഫലസ്ഥിതിയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഭൂതകാല തുടർച്ചാരൂപം കഥാപശ്ചാത്തലത്തിന് യോജിക്കുന്നു.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: അവൻ ... വലിച്ചുപൊട്ടിക്കുകയും
  rationale: διασπάω ബലമായി വലിച്ചുപിരിച്ചോ പൊട്ടിച്ചോ കളയുന്നതിനെ സൂചിപ്പിക്കുന്നു; ὑπό + genitive കാണിക്കുന്ന കർത്തൃത്വം മലയാളത്തിൽ സജീവവാക്യമായി സ്വാഭാവികമായി നൽകി.
- source_word: συντετρῖφθαι
  choice: തകർത്തുകളയുകയും
  rationale: συντρίβω ശക്തമായി തകർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തകർത്തുകളയുക’ ആ ശക്തിയും പൂർണതയും വായനാസൗകര്യത്തോടെ പ്രകടമാക്കുന്നു.
- source_word: οὐδεὶς ἴσχυεν
  choice: ആർക്കും ശക്തിയുണ്ടായിരുന്നില്ല
  rationale: ἰσχύωയിലെ ശക്തി/ശേഷി എന്ന ഊന്നൽ വെറും ‘കഴിഞ്ഞില്ല’ എന്നതിലുപരി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: δαμάσαι
  choice: കീഴടക്കാൻ
  rationale: δαμάζωയ്ക്ക് മെരുക്കുക, കീഴടക്കുക, നിയന്ത്രണത്തിലാക്കുക എന്നീ അർത്ഥങ്ങളുണ്ട്. ഈ മനുഷ്യനെ ബലമായി നിയന്ത്രിക്കുന്ന സന്ദർഭത്തിൽ ‘കീഴടക്കുക’ സ്വാഭാവികവും മാനുഷികവുമാണ്; അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യന്റെ അവസ്ഥയുടെയും അസാധാരണ ശക്തിയുടെയും കാരണം
  choice: അവനെ ബന്ധിക്കാനും കീഴടക്കാനും മനുഷ്യർ പരാജയപ്പെട്ടതായി വിവരണാത്മകമായി മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: പിശാചുബാധമൂലമുള്ള ശക്തിയെന്ന് ഈ വാക്യത്തിൽത്തന്നെ വിശദീകരിക്കുകയോ ‘മെരുക്കുക’ പോലുള്ള കൂടുതൽ നാടകീയ ഭാഷ ഉപയോഗിക്കുകയോ ചെയ്യുക.
  rationale: ഗ്രീക്ക് വാക്യം പരാജയപ്പെട്ട ബന്ധനശ്രമങ്ങളും അവനെ നിയന്ത്രിക്കാനാകാത്തതും വിവരിക്കുന്നു; അതിന്റെ കാരണം ഈ വാക്യത്തിൽ പ്രത്യേകം വ്യാഖ്യാനിക്കുന്നില്ല. അതിനാൽ ചുറ്റുമുള്ള കഥയുമായി പൊരുത്തം നിലനിർത്തിക്കൊണ്ട് അധിക ദൈവശാസ്ത്ര വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘കാൽവിലങ്ങുകൾ’ എന്നും ‘ചങ്ങലകൾ’ എന്നും പറഞ്ഞ് ഗ്രീക്കിലെ രണ്ട് നിയന്ത്രണോപകരണങ്ങൾ വേർതിരിച്ചു. അമിതമായി പഴഞ്ചനായ ‘പാദബന്ധനം’ പോലുള്ള പദങ്ങളും മൃഗപരിശീലനധ്വനി മുൻനിർത്തുന്ന മുഖ്യപാഠവും ഒഴിവാക്കി.
