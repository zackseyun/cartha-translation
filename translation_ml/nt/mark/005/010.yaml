  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ παρεκάλει αὐτὸν πολλὰ ἵνα μὴ ⸀αὐτὰ ἀποστείλῃ ἔξω τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: ml
  text: അവരെ ആ പ്രദേശത്തിനു പുറത്തേക്ക് അയച്ചുകളയരുതെന്ന് അവൻ യേശുവിനോട് പലവട്ടം അപേക്ഷിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവരെ ആ ഭൂപ്രദേശത്തിനു പുറത്തേക്ക് അയയ്ക്കരുതെന്ന് അവൻ യേശുവിനോട് വീണ്ടുംവീണ്ടും അപേക്ഷിച്ചു.’'
    reason: παρεκάλει πολλὰ, ἔξω τῆς χώρας എന്നീ പ്രയോഗങ്ങൾക്ക് സാധുവായ കൂടുതൽ പദാനുപദമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: παρεκάλει
  choice: അപേക്ഷിച്ചു
  rationale: ഭൂതോച്ചാടനത്തിന്റെ ഈ സന്ദർഭത്തിൽ παρακαλέω തീവ്രമായ യാചനയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അപേക്ഷിച്ചു’ ആ അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πολλὰ
  choice: വീണ്ടുംവീണ്ടും
  rationale: παρεκάλει-യോടൊപ്പം ക്രിയാവിശേഷണമായി വരുന്ന πολλὰ അപേക്ഷയുടെ ആവർത്തിത സ്വഭാവം ശക്തിപ്പെടുത്തുന്നു. ‘വീണ്ടുംവീണ്ടും’ അത് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἵνα μὴ
  choice: അയച്ചുകളയരുതെന്ന്
  rationale: അപേക്ഷയുടെ ഉള്ളടക്കമായ നിഷേധം മലയാളത്തിലെ സ്വാഭാവിക പരോക്ഷവാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: αὐτὰ
  choice: അവരെ
  rationale: നപുംസകലിംഗ ബഹുവചന സർവനാമം അശുദ്ധാത്മാക്കളെ/ഭൂതങ്ങളെ സൂചിപ്പിക്കുന്നു. വ്യക്തിസ്വഭാവമുള്ള പ്രവർത്തകരായതിനാൽ മലയാളത്തിൽ ‘അവരെ’ സ്വാഭാവികമാണ്; ബഹുവചനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀποστείλῃ
  choice: അയച്ചുകളയുക
  rationale: ἀποστέλλω-യുടെ ‘അയയ്ക്കുക/അയച്ചുകളയുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; ‘ഓടിക്കുക’ എന്നതിലുണ്ടാകാവുന്ന അധിക ബലപ്രയോഗഭാവം ചേർക്കുന്നില്ല.
- source_word: ἔξω τῆς χώρας
  choice: ആ പ്രദേശത്തുനിന്ന്
  rationale: χώρα ഇവിടെ ആധുനിക രാഷ്ട്രമല്ല, പ്രാദേശിക ഭൂവിഭാഗമാണ്. ‘പ്രദേശം’ ഈ ഭൂമിശാസ്ത്രപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ഭൂതങ്ങളുടെ സംഭാഷണത്തിൽ ഏകവചന ക്രിയാകർത്താവും ബഹുവചന സർവനാമവും തമ്മിലുള്ള മാറ്റം
  choice: ഏകവചന വക്താവിനെ ‘അവൻ’ എന്നും ബഹുവചനത്തെ ‘അവരെ’ എന്നും നിലനിർത്തി.
  alternative: എണ്ണത്തിലെ മാറ്റം മിനുക്കി ഒരു കൂട്ടത്തെ മാത്രം സൂചിപ്പിക്കുന്ന രീതിയിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം ഒരു ഏകവചന വക്താവും അനേകം ഭൂതങ്ങളും തമ്മിലുള്ള സംഘർഷം ഉദ്ദേശപൂർവം നിലനിർത്തുന്നു. പരിഭാഷ അത് യോജിപ്പിച്ച് ഇല്ലാതാക്കുന്നില്ല. സന്ദർഭത്തിൽ ‘അവൻ’ ആരോടാണ് അപേക്ഷിച്ചതെന്നു വ്യക്തമാക്കാൻ ‘യേശുവിനോട്’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ ഏകവചന വക്താവ്/ബഹുവചന ഭൂതങ്ങൾ എന്ന മാറ്റം സംരക്ഷിച്ചിരിക്കുന്നു. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോട് പൊരുത്തപ്പെടുന്നു.
