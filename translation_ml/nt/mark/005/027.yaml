source:
  edition: SBLGNT
  text: ⸀ἀκούσασα περὶ τοῦ Ἰησοῦ, ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν ἥψατο τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/027.yaml
  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: ml
  text: യേശുവിനെക്കുറിച്ച് കേട്ടിട്ട്, അവൾ ജനക്കൂട്ടത്തിൽ അവന്റെ പിന്നിൽനിന്ന് വന്ന് അവന്റെ വസ്ത്രത്തിൽ[a] തൊട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മേൽവസ്ത്രത്തിൽ.” ഗ്രീക്കിലെ ἱμάτιον എന്ന പദം പൊതുവായി ഒരു വസ്ത്രത്തെയും പലപ്പോഴും മേൽവസ്ത്രത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα
  choice: കേട്ടിട്ട്
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ആ ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘കേട്ടിട്ട്’ വ്യക്തമാക്കുന്നു.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: യേശുവിനെക്കുറിച്ചു
  rationale: περί + genitive ഇവിടെ യേശുവിനെ സംബന്ധിച്ച വാർത്തയെയോ വിവരത്തെയോ സൂചിപ്പിക്കുന്നു; ‘യെക്കുറിച്ചു’ അതിന്റെ സാധാരണ മലയാളപ്രയോഗമാണ്.
- source_word: ἐλθοῦσα
  choice: വന്ന്
  rationale: പ്രധാനപ്രവൃത്തിയിലേക്കു നയിക്കുന്ന aorist participle-ന്റെ തുടർച്ച മലയാളത്തിലെ വിനയെച്ചരൂപമായ ‘വന്ന്’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ὄχλῳ
  choice: ജനക്കൂട്ടത്തിനിടയിലൂടെ
  rationale: ἐν ഇവിടെ ജനക്കൂട്ടത്തിനുള്ളിലെ സാഹചര്യവും സമീപനത്തിന്റെ പശ്ചാത്തലവും നൽകുന്നു; മലയാളവാക്യത്തിൽ അവൾ കൂട്ടത്തിനകത്തുകൂടി സമീപിച്ചുവെന്ന ആശയം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ὄπισθεν
  choice: പിന്നിൽനിന്ന്
  rationale: യേശുവിന്റെ പിന്നിൽനിന്നുള്ള സമീപനം സൂചിപ്പിക്കുന്നു; സന്ദർഭം പരാമർശവിഷയം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേക സർവനാമം ചേർക്കാതെ അർഥം വ്യക്തമാണ്.
- source_word: ἥψατο
  choice: തൊട്ടു
  rationale: ഈ രോഗശാന്തിവിവരണത്തിൽ ἅπτω-യുടെ middle aorist രൂപം സാധാരണയായി സ്പർശിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; പിടിച്ചുവെന്നോ മുറുകെപ്പിടിച്ചുവെന്നോ അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: അവന്റെ വസ്ത്രത്തിൽ
  rationale: ἱμάτιον ഒരു വസ്ത്രത്തെയും പലപ്പോഴും മേൽവസ്ത്രത്തെയും സൂചിപ്പിക്കാം; ‘വസ്ത്രം’ അതിന്റെ വിശാലതയും ഏകവചനവും നിലനിർത്തുന്നു. ‘തൊടുക’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ അധികരണരൂപം സ്വാഭാവികമാണ്.
