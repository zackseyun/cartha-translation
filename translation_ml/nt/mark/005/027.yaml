  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പങ്കാളിക്രിയകളുടെ ക്രമം ‘കേട്ടിട്ട് … വന്ന് … തൊട്ടു’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ നിലനിർത്തിയിരിക്കുന്നു.
