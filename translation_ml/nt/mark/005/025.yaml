  rationale: രക്തം ഒഴുകുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യക്തവും മാന്യവും ആധുനികവുമായ മലയാളരൂപം.
- source_word: δώδεκα ἔτη
