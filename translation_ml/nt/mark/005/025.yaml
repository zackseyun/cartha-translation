  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. മൂലത്തിലെ സംക്ഷിപ്ത പങ്കാളിത്തപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യമായി നൽകിയിരിക്കുന്നു; വാക്യത്തിന്റെ ആഖ്യാനബന്ധം ‘യും’ എന്നതിലൂടെ സൂക്ഷിച്ചിരിക്കുന്നു.
