  naturalness: The narrative and direct address are natural modern standard Malayalam. ‘എനിക്കും നിനക്കും തമ്മിൽ എന്ത്?’ appropriately retains the terse force of the underlying idiom, with clarification in a note. The adjuration is made slightly more idiomatic by omitting the unnecessary ‘പറയുന്നു.’
  terminology: ‘അത്യുന്നതനായ ദൈവത്തിന്റെ പുത്രൻ’ accurately preserves the full divine title. ‘പീഡിപ്പിക്കരുതേ’ better conveys βασανίζω without importing an explicit judicial-punishment sense.
  issues:
