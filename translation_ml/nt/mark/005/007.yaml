    issue: ‘ദണ്ഡിപ്പിക്കരുതേ’ for μή με βασανίσῃς
    rationale: ‘ദണ്ഡിപ്പിക്കുക’ means punish or penalize, whereas βασανίζω here is ‘torment’/‘cause severe distress.’ Although punishment may be inferred from the wider narrative, it is not stated by this verb and should not replace its suffering-oriented sense.
