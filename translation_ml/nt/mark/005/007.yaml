    rationale: ‘ദൈവത്തെക്കൊണ്ട് നിന്നോട് ആണയിടുന്നു’ itself is a complete and more direct Malayalam rendering of ὁρκίζω σε τὸν θεόν; adding ‘പറയുന്നു’ is unnecessary.
