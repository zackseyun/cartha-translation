source:
  edition: SBLGNT
  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: ml
  text: 'അവൻ ഉറക്കെ നിലവിളിച്ചുകൊണ്ട് പറഞ്ഞു: “അത്യുന്നതനായ ദൈവത്തിന്റെ പുത്രനായ യേശുവേ, എനിക്കും നിനക്കും തമ്മിൽ എന്ത്?[a] ദൈവത്തെക്കൊണ്ട് നിന്നോട് ആണയിടുന്നു:[b] എന്നെ പീഡിപ്പിക്കരുതേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിനക്ക് എന്നോട് എന്ത് കാര്യം?” അകലം, എതിർപ്പ്, അല്ലെങ്കിൽ പരസ്പരബന്ധനിരാകരണം പ്രകടിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദൈവത്തിന്റെ പേരിൽ നിന്നോട് അപേക്ഷിക്കുന്നു” അല്ലെങ്കിൽ “ദൈവസന്നിധിയിൽ നിന്നെ ആണയിടുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ശപഥപൂർവമായ ഗൗരവമുള്ള അഭ്യർഥനയുടെയോ ആജ്ഞയുടെയോ ഭാവമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: ഉറക്കെ നിലവിളിച്ചുകൊണ്ട്
  rationale: ഉച്ചത്തിലുള്ള, തീവ്രമായ നിലവിളി എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; കർത്തൃക്രിയയ്ക്കു മുൻപുള്ള aorist participle-ന്റെ സാഹചര്യബന്ധവും നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: മർക്കോസിലെ ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ഭൂതകാലത്തിലേക്ക് മാറ്റുന്നു; സംഭവത്തിന്റെ അർഥമോ സജീവതയോ നഷ്ടപ്പെടുന്നില്ല.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: എനിക്കും നിനക്കും തമ്മിൽ എന്ത്?
  rationale: അകലം, എതിർപ്പ്, ബന്ധനിരാകരണം എന്നിവ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക്/സെമിറ്റിക് പ്രയോഗത്തിന്റെ ചുരുക്കവും മൂർച്ചയും നിലനിർത്തുന്നു; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: അത്യുന്നതനായ ദൈവത്തിന്റെ പുത്രനായ യേശുവേ
  rationale: യേശുവിനോടുള്ള നേരിട്ടുള്ള സംബോധനയും ‘അത്യുന്നതനായ ദൈവം’ എന്ന ദൈവിക വിശേഷണവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: ദൈവത്തെക്കൊണ്ട് നിന്നോട് ആണയിട്ടു പറയുന്നു
  rationale: ὁρκίζω എന്ന ക്രിയയുടെ ശപഥബന്ധിതവും ഗൗരവമുള്ളതുമായ അഭ്യർഥനയുടെ ശക്തി നിലനിർത്തുന്നു; വെറും ‘അപേക്ഷിക്കുന്നു’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: μή με βασανίσῃς
  choice: എന്നെ ദണ്ഡിപ്പിക്കരുതേ
  rationale: βασανίζω സൂചിപ്പിക്കുന്ന കഠിന പീഡനത്തിന്റെ ആശയം സന്ദർഭോചിതമായി നൽകുന്നു; അന്തിമശിക്ഷ എന്ന പ്രത്യേക വ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: അശുദ്ധാത്മാവ് യേശുവിന്റെ തിരിച്ചറിവ് പ്രഖ്യാപിക്കുന്നത്
  choice: അത്യുന്നതനായ ദൈവത്തിന്റെ പുത്രനായ യേശുവേ
  alternative: അത്യുന്നതന്റെ പുത്രനായ യേശുവേ
  rationale: മൂലപാഠത്തിലെ θεοῦ എന്ന ‘ദൈവം’ വ്യക്തമായി നിലനിർത്തുകയും ക്രിസ്തുവിനെക്കുറിച്ചുള്ള പ്രഖ്യാപനത്തെ ദുർബലപ്പെടുത്താതെയും പിന്നീട് രൂപപ്പെട്ട വ്യാഖ്യാനങ്ങൾ ചേർക്കാതെയും നൽകുന്നു.
- issue: അശുദ്ധാത്മാവ് ദൈവത്തെ മുൻനിർത്തി യേശുവോട് ആണയിടുന്നതിലെ സംഘർഷം
  choice: ദൈവത്തെക്കൊണ്ട് നിന്നോട് ആണയിട്ടു പറയുന്നു
  alternative: ദൈവത്തിന്റെ പേരിൽ നിന്നോട് അപേക്ഷിക്കുന്നു
  rationale: ഒരു അശുദ്ധാത്മാവ് ദൈവത്തെ ആധാരമാക്കി യേശുവിനോട് solemn charge ഉന്നയിക്കുന്ന പാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം മായ്ച്ചുകളയാതെ നിലനിർത്തുന്നു.
- issue: βασανίσῃς എന്നതിന്റെ ശിക്ഷാത്മക/പീഡനാത്മക വ്യാപ്തി
  choice: ദണ്ഡിപ്പിക്കരുതേ
  alternative: പീഡിപ്പിക്കരുതേ
  rationale: സന്ദർഭത്തിലെ ശിക്ഷാഭീതിയും കഠിനവേദനയും ഉൾക്കൊള്ളുന്ന മലയാളപദം തെരഞ്ഞെടുത്തു; പീഡനത്തിന്റെ കൃത്യരീതി പാഠം നിർണ്ണയിക്കുന്നതിലധികം വ്യക്തമാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സംബോധനയിൽ ‘യേശുവേ’ എന്നും അപേക്ഷയിൽ ‘ദണ്ഡിപ്പിക്കരുതേ’ എന്നും ഉപയോഗിച്ച് രംഗത്തിന്റെ തീവ്രത നിലനിർത്തി. അപൂർവമായ മതസാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി; എന്നാൽ ὁρκίζω-യുടെ ശപഥഭാവം ‘ആണയിട്ടു പറയുന്നു’ എന്ന പ്രയോഗത്തിൽ സംരക്ഷിച്ചു.
