revisions:
- from: അവൻ അവനോടൊപ്പം പോയി. ഒരു വലിയ ജനക്കൂട്ടം അവനെ അനുഗമിച്ചുകൊണ്ട് അവന്റെ ചുറ്റും തിക്കിത്തിരക്കിക്കൊണ്ടിരുന്നു.[a]
  to: അവൻ അവനോടൊപ്പം പോയി. വലിയൊരു ജനക്കൂട്ടം അവനെ പിന്തുടരുകയും അവനെ ഞെരുക്കിക്കൊണ്ടിരിക്കുകയും ചെയ്തു.[a]
  rationale: The revision makes the crowd’s physical pressure on Jesus explicit, preserving the force and direct-object construction of συνέθλιβον αὐτόν. It also retains the imperfect, ongoing sense of both the crowd’s following and pressing.
