  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഇംപെർഫെക്റ്റ് ക്രിയകളുടെ തുടരുന്ന ഭാവം ‘-കൊണ്ട്’, ‘-ക്കൊണ്ടിരുന്നു’ എന്നീ രൂപങ്ങളിലൂടെ നിലനിർത്തി.
