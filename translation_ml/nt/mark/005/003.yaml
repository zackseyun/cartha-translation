source:
  edition: SBLGNT
  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: ml
  text: അയാൾ കല്ലറകളുടെ ഇടയിലാണ് താമസിച്ചിരുന്നത്.[a] ചങ്ങലകൊണ്ടുപോലും അയാളെ ബന്ധിക്കാൻ ആർക്കും ഇനിമേൽ കഴിഞ്ഞിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “അയാൾക്ക് കല്ലറകളിലായിരുന്നു വാസം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: താമസിച്ചിരുന്നത്
  rationale: ‘വാസം ഉണ്ടായിരുന്നു’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവവും സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τοῖς μνήμασιν
  choice: കല്ലറകളുടെ ഇടയിൽ
  rationale: μνῆμα ഇവിടെ ശവസംസ്കാരത്തിനുള്ള കല്ലറയെ സൂചിപ്പിക്കുന്നു. ബഹുവചനവും പ്രദേശപരമായ അർഥവും നിലനിർത്തുന്നു; അയാൾ എല്ലായ്പോഴും ഒരു കല്ലറയ്ക്കുള്ളിലായിരുന്നു എന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: οὐδὲ ἁλύσει
  choice: ചങ്ങലകൊണ്ടുപോലും
  rationale: ἅλυσις എന്ന ഏകവചനവും οὐδέ നൽകുന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: οὐκέτι
  choice: ഇപ്പോൾ ... കഴിഞ്ഞിരുന്നില്ല
  rationale: മുമ്പ് സാധ്യമായിരുന്ന അവസ്ഥ അവസാനിച്ചുവെന്ന οὐκέτιയുടെ സൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
  choice: അയാളെ ബന്ധിക്കാൻ ആർക്കും കഴിഞ്ഞിരുന്നില്ല
  rationale: തുടർന്നുനിന്ന അസാധ്യതയും δέωയുടെ ശാരീരികമായി കെട്ടിയിടുക എന്ന അടിസ്ഥാന അർഥവും വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശവകുടീരം’ എന്നതിനെക്കാൾ പൊതുവായി ഗ്രഹിക്കപ്പെടുന്ന ‘കല്ലറ’ തിരഞ്ഞെടുത്തു; ഗ്രീക്കിലെ നീണ്ട ബന്ധവാക്യം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
