source:
  edition: SBLGNT
  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: ml
  text: 'അകത്ത് കടന്നശേഷം അവൻ അവരോടു പറയുന്നു: “നിങ്ങൾ ബഹളം വെക്കുകയും കരയുകയും ചെയ്യുന്നത് എന്തിന്? കുട്ടി മരിച്ചിട്ടില്ല; ഉറങ്ങുകയാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുട്ടി മരിച്ചില്ല; ഉറങ്ങുന്നു.” തുടർന്ന് കുട്ടിയെ ഉയിർപ്പിക്കാനിരിക്കുന്നതിന്റെ വെളിച്ചത്തിൽ, യേശു ‘ഉറക്കം’ എന്ന പദം മരണത്തിന്റെ രൂപകമായി ഉപയോഗിച്ചിരിക്കാം.
    reason: ക്രിയാകാലത്തിന്റെ മറ്റൊരു സ്വാഭാവിക പരിഭാഷയും ‘ഉറക്കം’ എന്ന പ്രയോഗത്തിലെ ഉദ്ദേശപൂർവമായ ആശയസംഘർഷവും സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: εἰσελθὼν
  choice: അകത്തു കടന്നശേഷം
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പായി നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγει
  choice: അവൻ അവരോടു പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ആഖ്യാനശൈലിയിലുള്ള ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു.
- source_word: Τί
  choice: എന്തിന്
  rationale: ഇവിടെയുള്ള ചോദ്യം ശാസനയുടെ ഭാവത്തിൽ കാരണമന്വേഷിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘എന്തിന്’ സ്വാഭാവികമാണ്.
- source_word: θορυβεῖσθε
  choice: നിങ്ങൾ ബഹളം വെക്കുകയും
  rationale: ശബ്ദകോലാഹലവും അസ്വസ്ഥതയും സൃഷ്ടിക്കുന്ന പ്രവൃത്തിയെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: κλαίετε
  choice: കരയുകയും
  rationale: അനാവശ്യമായി ആചാരപരമായ വിലാപം നിർദേശിക്കാതെ സാധാരണവും മാന്യവുമായ പദപ്രയോഗം നൽകുന്നു.
- source_word: παιδίον
  choice: കുട്ടി
  rationale: സന്ദർഭത്തിൽ പെൺകുട്ടിയാണെങ്കിലും ഗ്രീക്കിലെ പൊതുവായ ‘കുട്ടി’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: οὐκ ἀπέθανεν
  choice: മരിച്ചിട്ടില്ല
  rationale: സംഭവിച്ചിട്ടില്ലെന്ന നിഷേധത്തോടൊപ്പം അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καθεύδει
  choice: ഉറങ്ങുകയാണ്
  rationale: വർത്തമാനകാല പ്രവൃത്തിയും യേശുവിന്റെ ഉറക്കരൂപകവും വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വാക്കുകൾ മരണത്തെ അക്ഷരാർഥത്തിൽ നിഷേധിക്കുന്നതായോ മരണത്തെ ഉറക്കമെന്ന രൂപകത്തിൽ പറയുന്നതായോ വിവർത്തനം ചെയ്യണോ എന്നത്
  choice: ‘കുട്ടി മരിച്ചിട്ടില്ല; ഉറങ്ങുകയാണ്’ എന്ന സംഘർഷഭരിതമായ വാക്കുകൾ വിശദീകരണം ചേർക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘കുട്ടി സ്ഥിരമായി മരിച്ചിട്ടില്ല; ഉറങ്ങുന്നതേയുള്ളൂ’ എന്നോ ‘താൻ അവളെ ഉയിർപ്പിക്കുമെന്നതിനാൽ അവൾ മരിച്ചിട്ടില്ല’ എന്നോ വ്യാഖ്യാനിച്ച് പറയുക.
  rationale: ഗ്രീക്ക് വാചകം ഈ ആശയപരമായ പിരിമുറുക്കം തുറന്ന നിലയിൽ വെക്കുന്നു; അതിനാൽ അത് രൂപകമോ മുൻകൂട്ടിയുള്ള പ്രസ്താവനയോ അക്ഷരാർഥ നിഷേധമോ എന്നു വിവർത്തനം തന്നെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം ‘പറയുന്നു’ എന്നതിലൂടെ നിലനിർത്തി; ദുഃഖാചരണരംഗത്തിലെ ശബ്ദകോലാഹലം ‘ബഹളം വെക്കുക’ എന്ന സാധാരണ പ്രയോഗത്തിൽ അവതരിപ്പിച്ചു.
