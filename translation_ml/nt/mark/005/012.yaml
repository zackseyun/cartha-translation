id: MRK.5.12
reference: Mark 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: ml
  text: 'അവർ അവനോട് ഇങ്ങനെ അപേക്ഷിച്ചു: “ഞങ്ങൾ അവയിൽ പ്രവേശിക്കാനായി ഞങ്ങളെ പന്നികളിലേക്ക് അയയ്ക്കണമേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: അപേക്ഷിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ παρακαλέω ശക്തമായ അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു. ‘അപേക്ഷിച്ചു’ എന്നത് ആ വിനയപൂർവമായ തീവ്രതയും ആധുനിക മലയാളത്തിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: αὐτὸν
  choice: അവനോട്
  rationale: സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അപേക്ഷിച്ചു’ എന്ന ക്രിയയോടൊപ്പം ‘അവനോട്’ സ്വാഭാവികമാണ്.
- source_word: λέγοντες
  choice: 'അപേക്ഷിച്ചു:'
  rationale: ഗ്രീക്കിലെ പങ്കാളിത്തക്രിയ അപേക്ഷയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ഉദ്ധരണിക്ക് മുമ്പുള്ള ദ്വിബിന്ദുവിലൂടെ ഇത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന് വേർതിരിക്കുന്നത് അനാവശ്യമായി ഭാരമുള്ളതാണ്.
- source_word: Πέμψον
  choice: അയയ്ക്കണമേ
  rationale: πέμπω എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘അയയ്ക്കുക’ എന്നാണ്. അഭ്യർഥനയുടെ ഭാവം ‘-ണമേ’ എന്ന രൂപം നൽകുന്നു; വെറും അനുമതി ചോദിക്കുന്നതായി പരാവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: ἡμᾶς
  choice: ഞങ്ങളെ
  rationale: ഒന്നാം പുരുഷ ബഹുവചന കർമസർവനാമത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: εἰς τοὺς χοίρους
  choice: പന്നികളിലേക്ക്
  rationale: χοῖρος എന്നത് പന്നിയെ സൂചിപ്പിക്കുന്നു. ‘പന്നികൾ’ സാധാരണ ആധുനിക മലയാളമാണ്; εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യദിശ ‘-ലേക്ക്’ കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: ഞങ്ങൾ … പ്രവേശിക്കട്ടെ
  rationale: ἵνα അവതരിപ്പിക്കുന്ന ഉദ്ദേശ്യം മലയാളത്തിലെ ‘-ട്ടെ’ ഘടന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: ഞങ്ങൾ അവയിൽ പ്രവേശിക്കട്ടെ
  rationale: εἰσέρχομαι എന്നതിന്റെ ‘പ്രവേശിക്കുക’ എന്ന അർഥം വ്യക്തമായി നിലനിർത്തുന്നു. αὐτούς പന്നികളെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘അവയിൽ’ എന്ന് ഉപയോഗിച്ചു.
theological_decisions:
- issue: സംസാരിക്കുന്നവർ യേശുവിനോടു നടത്തുന്ന അഭ്യർഥനയുടെ സ്വഭാവം
  choice: അവർ യേശുവിന്റെ അധികാരത്തിന് വിധേയരായി, പന്നികളിലേക്ക് അയയ്ക്കപ്പെടാൻ അപേക്ഷിക്കുന്നതായി പാഠം അവതരിപ്പിക്കുന്നു.
  alternative: അധികാരത്തിന്റെ ഊന്നൽ കൂടാതെ, അവർ സ്ഥലംമാറ്റം മാത്രം അഭ്യർഥിക്കുന്നു എന്ന ദുർബലമായ വായന.
  rationale: ‘അപേക്ഷിച്ചു’, ‘അയയ്ക്കണമേ’ എന്നീ രൂപങ്ങൾ അശുദ്ധാത്മാക്കളുടെ മേലുള്ള യേശുവിന്റെ അധികാരം കഥയിൽ പ്രകടമാകുന്നതുപോലെ സൂചിപ്പിക്കുന്നു; എന്നാൽ പാഠത്തിനപ്പുറമുള്ള സിദ്ധാന്തവാദങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവും സംക്ഷിപ്തവുമായ കഥനശൈലി. ഉദ്ധരണിയിലെ ‘അയയ്ക്കണമേ’ അപേക്ഷയുടെ തീവ്രത നിലനിർത്തുന്നു; ‘പ്രവേശിക്കട്ടെ’ ഉദ്ദേശ്യബന്ധം വായനാസൗകര്യത്തോടെ നൽകുന്നു. ഇംഗ്ലീഷ് അടിക്കുറിപ്പിലെ ‘swine’ എന്നത് ഇംഗ്ലീഷിനുള്ളിലെ ശൈലീവ്യത്യാസം മാത്രമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
