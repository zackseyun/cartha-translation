source:
  edition: SBLGNT
  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: ml
  text: അവയെ മേയിച്ചിരുന്നവർ ഓടിപ്പോയി പട്ടണത്തിലും നാട്ടിൻപുറങ്ങളിലും[a] വിവരം അറിയിച്ചു; സംഭവിച്ചത് എന്തെന്നു കാണാൻ ആളുകൾ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വയലുകളിൽ.’ ഗ്രീക്ക് പദം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ വിവർത്തനം ചെയ്യാം; എന്നാൽ ഇവിടെ അത് പട്ടണത്തിനു ചുറ്റുമുള്ള ഗ്രാമപ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: മേയിച്ചിരുന്നവർ
  rationale: പന്നിക്കൂട്ടത്തെ പരിപാലിച്ച് മേയിച്ചിരുന്നവരെയാണ് വർത്തമാനകാല കൃദന്തം സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: αὐτούς
  choice: അവയെ
  rationale: സർവനാമം മുൻവാക്യത്തിലെ പന്നികളെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ സർവനാമരൂപം നിലനിർത്തുന്നു.
- source_word: ἔφυγον
  choice: ഓടിപ്പോയി
  rationale: പെട്ടെന്നുണ്ടായ ഭീതിപൂർവമായ പലായനത്തിന്റെ ആഖ്യാനശക്തി സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ἀπήγγειλαν
  choice: വിവരം അറിയിച്ചു
  rationale: കണ്ട സംഭവത്തെ മറ്റുള്ളവരോടു റിപ്പോർട്ട് ചെയ്തു എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εἰς τὴν πόλιν
  choice: പട്ടണത്തിൽ
  rationale: അറിയിക്കൽ നടന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നവിധം εἰς എന്നതിനെ മലയാള ശൈലിക്കനുസരിച്ച് സ്ഥലസൂചകമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: εἰς τοὺς ἀγρούς
  choice: നാട്ടിൻപുറങ്ങളിൽ
  rationale: പട്ടണത്തോടുള്ള വൈരുധ്യത്തിൽ ἀγροί ചുറ്റുമുള്ള ഗ്രാമപ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘വയലുകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἦλθον
  choice: ആളുകൾ വന്നു
  rationale: ഗ്രീക്കിൽ ബഹുവചന കർത്താവ് പരോക്ഷമാണ്; വാർത്ത കേട്ടവരെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, പ്രത്യേകൊരു കൂട്ടത്തെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἰδεῖν
  choice: കാണാൻ
  rationale: വരവിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τί ἐστιν τὸ γεγονός
  choice: സംഭവിച്ചത് എന്തെന്നു
  rationale: സംഭവിച്ച കാര്യം എന്താണെന്ന് അന്വേഷിക്കുന്ന ഗ്രീക്ക് ഘടനയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പകർത്തുന്നു.
