  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യത്തിന്റെ തുടർച്ച നിലനിർത്താൻ അർധവിരാമം പ്രയോഗിച്ചു; അവ്യക്തമായ ബഹുവചന കർത്താവിനെ ‘ആളുകൾ’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
