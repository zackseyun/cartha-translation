id: MRK.5.29
reference: Mark 5:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: ml
  text: ഉടൻതന്നെ അവളുടെ രക്തസ്രാവത്തിന്റെ ഉറവ വറ്റിപ്പോയി[a]; ആ പീഡയിൽനിന്ന്[b] താൻ സൗഖ്യം പ്രാപിച്ചിരിക്കുന്നുവെന്ന് അവൾ ശരീരത്തിൽത്തന്നെ അറിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളുടെ രക്തത്തിന്റെ ഉറവ വറ്റിപ്പോയി.’ ഗ്രീക്കിൽ ഒരു നീരുറവയുടെയോ സ്രോതസ്സിന്റെയോ സജീവമായ രൂപകമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആ കഠിനവ്യാധിയിൽനിന്ന്’ അല്ലെങ്കിൽ ‘ആ യാതനയിൽനിന്ന്.’ ഗ്രീക്ക് പദത്തിന് അക്ഷരാർഥത്തിൽ ‘ചാട്ടവാർ’ എന്നും രൂപകമായി കഠിനമായ പീഡ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടൻതന്നെ
  rationale: മർക്കോസിന്റെ വിവരണത്തിലെ അടിയന്തരത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξηράνθη
  choice: വറ്റിപ്പോയി
  rationale: ക്രിയയുടെ ‘വറ്റിപ്പോകുക’ എന്ന ദൃശ്യബിംബം നിലനിർത്തുകയും രക്തസ്രാവം അവസാനിച്ചതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πηγὴ τοῦ αἵματος αὐτῆς
  choice: അവളുടെ രക്തസ്രാവത്തിന്റെ ഉറവ
  rationale: πηγή എന്ന പദത്തിന്റെ ‘ഉറവ/സ്രോതസ്സ്’ എന്ന സജീവ രൂപകം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് രക്തസ്രാവത്തിന്റെ ശാരീരിക ഉറവയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἔγνω τῷ σώματι
  choice: അവൾ ശരീരത്തിൽത്തന്നെ അറിഞ്ഞു
  rationale: ἔγνω എന്നതിലെ അറിവിനെയും τῷ σώματι സൂചിപ്പിക്കുന്ന ശാരീരിക അനുഭവത്തെയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ἴαται
  choice: സൗഖ്യം പ്രാപിച്ചിരിക്കുന്നുവെന്ന്
  rationale: പൂർണമായ സൗഖ്യവും അതിന്റെ തുടരുന്ന ഫലവും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് perfect രൂപത്തിന്റെ അർഥം മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀπὸ τῆς μάστιγος
  choice: ആ പീഡയിൽനിന്ന്
  rationale: μάστιξ എന്ന പദത്തിന്റെ അക്ഷരാർഥമായ ‘ചാട്ടവാർ’ ഇവിടെ രൂപകമായി കഠിനമായ വേദനയെയോ രോഗപീഡയെയോ സൂചിപ്പിക്കുന്നു; ‘പീഡ’ ആ തീവ്രത നിലനിർത്തുന്നു.
theological_decisions:
- issue: സൗഖ്യത്തിന്റെ സ്വഭാവം
  choice: രക്തസ്രാവം വസ്തുനിഷ്ഠമായി അവസാനിച്ചതും സ്ത്രീ അത് ശരീരത്തിൽ അറിഞ്ഞതും രണ്ടും വ്യക്തമാക്കി.
  alternative: യഥാർഥ സൗഖ്യത്തെക്കാൾ അവളുടെ വ്യക്തിപരമായ അനുഭവത്തിന് മാത്രം ഊന്നൽ നൽകുക.
  rationale: ഗ്രീക്ക് പാഠം ശാരീരിക മാറ്റത്തെയും അതിനെക്കുറിച്ചുള്ള സ്ത്രീയുടെ ഉൾബോധത്തെയും ചേർത്തുപറയുന്നു; സൗഖ്യത്തിന്റെ കാരണക്രമത്തെക്കുറിച്ച് പാഠത്തിലില്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘രക്തസ്രാവത്തിന്റെ ഉറവ’ എന്ന രൂപകം മൂലപാഠത്തിന്റെ ദൃശ്യത നിലനിർത്തുന്നു; ‘ശരീരത്തിൽത്തന്നെ അറിഞ്ഞു’ എന്ന പ്രയോഗം ബോധത്തെയും ശാരീരിക അനുഭവത്തെയും വേർതിരിക്കാതെ അവതരിപ്പിക്കുന്നു.
