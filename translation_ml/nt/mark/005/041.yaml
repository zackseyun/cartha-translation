source:
  edition: SBLGNT
  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: ml
  text: 'അവൻ കുട്ടിയുടെ കൈ പിടിച്ച് അവളോടു പറഞ്ഞു: “തലീഥാ കൂം” എന്നതിന്റെ അർഥം: “കൊച്ചുപെൺകുട്ടീ, നിന്നോടു ഞാൻ പറയുന്നു, എഴുന്നേൽക്കുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില ഇംഗ്ലീഷ് പരിഭാഷകൾ പരമ്പരാഗത ലിപ്യന്തരത്തെ പിന്തുടർന്ന് അരമായ ഭാഷയിലെ ഈ പ്രയോഗം ‘തലീഥാ കും’ എന്നു നൽകുന്നു. ഇവിടെ ഗ്രീക്ക് പാഠത്തിലുള്ള κουμ എന്ന രൂപത്തെ പിന്തുടർന്ന് ‘കൂം’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: ആ ബാലികയുടെ കൈപിടിച്ച്
  rationale: κρατέω കൂടെയുള്ള ഷഷ്ഠീവ്യാകരണപ്രയോഗം കൈയിൽ പിടിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കൈപിടിച്ച്’ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ച സൗമ്യമായ പ്രയോഗവുമാണ്; παιδίον-നെ സന്ദർഭത്തിലെ പെൺകുട്ടിയെ സൂചിപ്പിക്കുന്ന ‘ബാലിക’യായി നൽകി.
- source_word: λέγει αὐτῇ
  choice: അവളോട് പറഞ്ഞു
  rationale: മർക്കോസിന്റെ ചരിത്രവർത്തമാനത്തെ മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കായി ഭൂതകാലത്തിൽ നൽകി; αὐτῇ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ταλιθα κουμ
  choice: തലീഥാ കൂം
  rationale: ഗ്രീക്ക് പാഠത്തിൽ സംരക്ഷിക്കപ്പെട്ട അരമായ പ്രയോഗം ലിപ്യന്തരണം ചെയ്തു; തുടർന്ന് മർക്കോസ് തന്നിരിക്കുന്ന പരിഭാഷയും നിലനിർത്തി.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: അതിന്റെ പരിഭാഷ
  rationale: അരമായ വാക്കുകളുടെ വിവർത്തനം പരിചയപ്പെടുത്തുന്ന മർക്കോസിന്റെ വിശദീകരണം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Τὸ κοράσιον
  choice: കൊച്ചുപെൺകുട്ടീ
  rationale: κοράσιον എന്ന പദത്തിലെ പെൺലിംഗവും ചെറുപ്പം/വാത്സല്യം സൂചിപ്പിക്കുന്ന ഭാവവും സംബോധനരൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: σοὶ λέγω
  choice: നിന്നോടു ഞാൻ പറയുന്നു
  rationale: ഗ്രീക്കിൽ ഊന്നിപ്പറഞ്ഞിരിക്കുന്ന σοὶ ഒഴിവാക്കാതെ, നേരിട്ടുള്ള solemn പ്രസ്താവനയായി നിലനിർത്തുന്നു.
- source_word: ἔγειρε
  choice: എഴുന്നേൽക്കുക
  rationale: ἐγείρω എന്ന ആജ്ഞയുടെ ഇവിടെ പ്രസക്തമായ ‘എഴുന്നേൽക്കുക’ എന്ന അർഥം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ അരമായ വാക്കുകൾ മുഖ്യപാഠത്തിൽ നിലനിർത്തൽ
  choice: ‘തലീഥാ കൂം’ എന്നു ലിപ്യന്തരണം ചെയ്ത് പിന്നാലെ മർക്കോസിന്റെ പരിഭാഷയും നൽകുന്നു.
  alternative: അരമായ വാക്കുകൾ ഒഴിവാക്കി മലയാളപരിഭാഷ മാത്രം നൽകുക; അല്ലെങ്കിൽ പരമ്പരാഗതമായ ‘തലീഥാ കും’ എന്ന രൂപം ഉപയോഗിക്കുക.
  rationale: മൂലപാഠം യേശുവിന്റെ സെമിറ്റിക് ഉച്ചാരണം സംരക്ഷിച്ചശേഷം അതിനെ വ്യാഖ്യാനിക്കുന്നു. രണ്ടും നിലനിർത്തുന്നത് ആഖ്യാനത്തിന്റെ സവിശേഷതയും അർഥവ്യക്തതയും ഒരുമിച്ച് കാക്കുന്നു; κουμ എന്ന പാഠരൂപത്തിന് ‘കൂം’ അടുത്ത ലിപ്യന്തരമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, മാന്യമായ മലയാളം. ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലം ഉപയോഗിച്ചു; നേരിട്ടുള്ള വചനത്തിൽ ഗ്രീക്കിലെ ഊന്നലും ആജ്ഞയുടെ ഗൗരവവും സംരക്ഷിച്ചു.
