revisions:
- from: 'അവൻ ആ ബാലികയുടെ കൈപിടിച്ച് അവളോട് പറഞ്ഞു: “തലീഥാ കൂം,” അതിന്റെ പരിഭാഷ: “കൊച്ചുപെൺകുട്ടീ, നിന്നോടു ഞാൻ പറയുന്നു, എഴുന്നേൽക്കുക.”[a]'
