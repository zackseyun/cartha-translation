id: MRK.5.2
reference: Mark 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: ml
  text: അവൻ പടകിൽനിന്ന് ഇറങ്ങിയ ഉടനെ, അശുദ്ധാത്മാവുള്ള[a] ഒരു മനുഷ്യൻ കല്ലറകളിൽനിന്ന് വന്ന് അവനെ എതിരേറ്റു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അശുദ്ധാത്മാവ് ബാധിച്ച.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “അശുദ്ധാത്മാവുള്ള” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ ἐκ τοῦ πλοίου
  choice: അവൻ പടകിൽനിന്ന് ഇറങ്ങിയ
  rationale: Aorist participle in the genitive absolute is naturally expressed as a temporal construction in Malayalam; “പടക്” fits the Galilean setting.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: Preserves Mark’s vivid sense of immediacy in clear, natural Malayalam.
- source_word: ὑπήντησεν αὐτῷ
  choice: വന്ന് അവനെ എതിരേറ്റു
  rationale: Expresses movement from the tombs and the act of meeting Jesus without making the encounter necessarily hostile.
- source_word: ἐκ τῶν μνημείων
  choice: കല്ലറകളിൽനിന്ന്
  rationale: A contextually precise and ordinary Malayalam rendering of the plural “tombs.”
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: Accurately represents the singular male person in the narrative.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: അശുദ്ധാത്മാവുള്ള
  rationale: Stays close to the Greek association expressed by ἐν and avoids building the more interpretive idea “possessed” directly into the main text.
theological_decisions:
- issue: Demonic-affliction language in ἐν πνεύματι ἀκαθάρτῳ
  choice: അശുദ്ധാത്മാവുള്ള
  alternative: അശുദ്ധാത്മാവ് ബാധിച്ച
  rationale: The main rendering preserves the Greek wording and its ambiguity rather than specifying a fully developed category of possession; the interpretive alternative is supplied in a footnote.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. “എതിരേറ്റു” എന്നത് ഇവിടെ കണ്ടുമുട്ടാനെത്തിയെന്ന അർഥത്തിലാണ്; ശത്രുത നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
