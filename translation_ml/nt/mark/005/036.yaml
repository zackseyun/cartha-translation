source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു, പറയപ്പെട്ടുകൊണ്ടിരുന്ന കാര്യം കേട്ടിട്ട്,[a] സിനഗോഗ് മുഖ്യനോടു പറയുന്നു: “ഭയപ്പെടേണ്ട; മാത്രം വിശ്വസിക്കുക.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പറഞ്ഞത് അവഗണിച്ച്.” παρακούσας എന്ന ഗ്രീക്ക് പദത്തിന് ഇവിടെ ‘കേൾക്കുക’ എന്നോ ‘പറഞ്ഞതിനു ചെവികൊടുക്കാതിരിക്കുക’ എന്നോ അർത്ഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “വിശ്വാസം വെക്കുക മാത്രം” അല്ലെങ്കിൽ “ആശ്രയിക്കുക മാത്രം.” ഗ്രീക്ക് ക്രിയ πιστεύω ആണ്; വർത്തമാനകാല ആജ്ഞയായതിനാൽ “വിശ്വസിച്ചുകൊണ്ടിരിക്കുക” എന്ന തുടർച്ചാഭാവവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: കേട്ടിട്ട്
  rationale: സന്ദർഭത്തിൽ യേശു യായീറിനോടു പറഞ്ഞുകൊണ്ടിരുന്ന വിവരം കേട്ട് ഉടൻ പ്രതികരിക്കുന്നതിനാൽ ‘കേട്ടിട്ട്’ എന്നത് ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് നിലനിർത്തുന്നു. ‘അവഗണിച്ച്’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: τὸν λόγον λαλούμενον
  choice: പറഞ്ഞുകൊണ്ടിരുന്ന വാക്ക്
  rationale: ഗ്രീക്കിലെ നാമവും വർത്തമാന കൃദന്തരൂപവും കഴിയുന്നത്ര ദൃശ്യമാക്കിക്കൊണ്ട്, സന്ദർഭത്തിൽ പറയപ്പെട്ടുകൊണ്ടിരുന്ന വാർത്തയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാല പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἀρχισυναγώγῳ
  choice: പള്ളിപ്രമാണി
  rationale: സിനഗോഗിന്റെ മേൽനോട്ടം വഹിച്ചിരുന്ന നേതാവിനെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദം.
- source_word: Μὴ φοβοῦ
  choice: ഭയപ്പെടേണ്ട
  rationale: നിഷേധാത്മക ആജ്ഞയുടെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μόνον
  choice: മാത്രം
  rationale: യേശു ആവശ്യപ്പെടുന്ന പ്രതികരണത്തെ പരിമിതപ്പെടുത്തുന്ന μόνον എന്ന പദത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക തുല്യം.
- source_word: πίστευε
  choice: വിശ്വസിക്കുക
  rationale: πιστεύω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള മലയാള തുല്യം. ‘ആശ്രയിക്കുക/വിശ്വാസം വെക്കുക’ എന്നീ സന്ദർഭസാധ്യമായ ഭാവങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: παρακούσας എന്നതിന്റെ അർത്ഥശക്തി
  choice: യേശു പറഞ്ഞുകൊണ്ടിരുന്ന വിവരം കേട്ടു
  alternative: യേശു പറഞ്ഞത് അവഗണിച്ചു
  rationale: ഇരു അർത്ഥങ്ങളും പദസാധ്യതകളാണ്. തുടർന്നുള്ള നേരിട്ടുള്ള പ്രതികരണം ‘കേട്ടു’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ യഥാർഥ വ്യാഖ്യാനസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: πίστευε എന്ന ആജ്ഞയുടെ പരിഭാഷ
  choice: വിശ്വസിക്കുക
  alternative: വിശ്വാസം വെക്കുക; ആശ്രയിക്കുക; വിശ്വസിച്ചുകൊണ്ടിരിക്കുക
  rationale: ‘വിശ്വസിക്കുക’ ക്രിയയുടെ നേരിട്ടുള്ള തുല്യമാണ്; വിശ്വാസം, ആശ്രയം, തുടർച്ച എന്നീ ഭാവങ്ങളിൽ ഒന്നിനെ മാത്രം മുഖ്യവാചകത്തിൽ നിർബന്ധമായി ഉറപ്പിക്കാതെ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം ‘പറയുന്നു’ എന്നു നിലനിർത്തി. ‘പള്ളിപ്രമാണി’ പരിചിതമായ മലയാള ബൈബിൾ പദമായി ഉപയോഗിച്ചു; സന്ദിഗ്ധമായ παρακούσας, πιστεύω എന്നീ പദങ്ങളുടെ വ്യത്യസ്ത ഭാവങ്ങൾ അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
