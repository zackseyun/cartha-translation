- from: 'എന്നാൽ യേശു, പറഞ്ഞുകൊണ്ടിരുന്ന വാക്ക് കേട്ടിട്ട്,[a] പള്ളിപ്രമാണിയോടു പറയുന്നു: “ഭയപ്പെടേണ്ട; വിശ്വസിക്കുക മാത്രം.”[b]'
  to: 'എന്നാൽ യേശു, പറയപ്പെട്ടുകൊണ്ടിരുന്ന കാര്യം കേട്ടിട്ട്,[a] സിനഗോഗ് മുഖ്യനോടു പറയുന്നു: “ഭയപ്പെടേണ്ട; മാത്രം വിശ്വസിക്കുക.”[b]'
