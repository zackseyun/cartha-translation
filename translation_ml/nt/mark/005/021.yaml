    reason: cultural_note
  revision_rationale: The revision moves the note marker to the term it explains and refines the crowd’s relation to Jesus from ‘around him’ to ‘to/at him.’ No doctrinal or historical interpretation has been added, and the Greek temporal and spatial relationships are retained.
