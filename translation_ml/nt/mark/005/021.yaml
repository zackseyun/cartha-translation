id: MRK.5.21
reference: Mark 5:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: ml
  text: യേശു വീണ്ടും പടകിൽ മറുകരയിലേക്കു കടന്നശേഷം, വലിയൊരു ജനക്കൂട്ടം അവന്റെ അടുക്കൽ കൂടിവന്നു. അവൻ കടൽത്തീരത്തായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ഗലീലക്കടൽ; ഇതൊരു തടാകമാണെങ്കിലും സുവിശേഷങ്ങളിൽ പതിവായി ‘കടൽ’ എന്നു വിളിക്കപ്പെടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: കടന്നശേഷം
  rationale: ജനക്കൂട്ടം കൂടിവന്നതിനു മുമ്പാണ് യേശു കടന്നതെന്ന പൂർവകാലബന്ധം സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ πλοίῳ
  choice: പടകിൽ
  rationale: മൂലത്തിലെ ഉപാധി/സ്ഥലസൂചന വ്യക്തമായി നിലനിർത്തുന്നു; ഗലീലക്കടലിലെ ചെറുജലവാഹനത്തിന് ആധുനിക മലയാളത്തിൽ ‘പടക്’ സ്വാഭാവികമാണ്.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: പ്രവൃത്തി ആവർത്തിക്കുന്നുവെന്ന മൂലപാഠത്തിന്റെ സൂചന നേരിട്ട് നൽകുന്നു.
- source_word: εἰς τὸ πέραν
  choice: മറുകരയിലേക്ക്
  rationale: തടാകം കടന്ന് എതിർകരയിലെത്തുന്നതിനെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: συνήχθη
  choice: കൂടിവന്നു
  rationale: രൂപത്തിൽ പാസീവായിരുന്നാലും സന്ദർഭത്തിലെ ജനക്കൂട്ടത്തിന്റെ ഒത്തുചേരൽ മലയാളത്തിൽ സ്വാഭാവികമായ അകർമകപ്രയോഗത്തിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὄχλος πολὺς
  choice: വലിയൊരു ജനക്കൂട്ടം
  rationale: ജനക്കൂട്ടത്തിന്റെ വലുപ്പം വ്യക്തമായി നൽകുന്ന ആധുനികവും വായനാസൗകര്യമുള്ളതുമായ പ്രയോഗം.
- source_word: ἐπ’ αὐτόν
  choice: അവന്റെ ചുറ്റും
  rationale: യേശുവിന്റെ അടുത്തേക്ക് ജനങ്ങൾ ഒന്നിച്ചുകൂടി അവനെ ചുറ്റിയെന്ന സ്ഥലപരമായ അർത്ഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: παρὰ τὴν θάλασσαν
  choice: കടൽത്തീരത്ത്
  rationale: ജലാശയത്തിന്റെ അരികിലുള്ള സ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: θάλασσαν
  choice: കടൽ
  rationale: മൂലഗ്രീക്കിലെ ‘കടൽ’ എന്ന പദം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഇത് യഥാർത്ഥത്തിൽ ഗലീലക്കടൽ എന്നു പതിവായി വിളിക്കപ്പെടുന്ന തടാകമാണെന്ന വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ നീണ്ട വാക്യത്തെ വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; സംഭവക്രമവും അർത്ഥബന്ധവും നിലനിർത്തി.
