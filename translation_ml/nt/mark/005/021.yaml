revisions:
- from: യേശു വീണ്ടും പടകിൽ മറുകരയിലേക്കു കടന്നശേഷം[a], വലിയൊരു ജനക്കൂട്ടം അവന്റെ ചുറ്റും കൂടിവന്നു. അവൻ കടൽത്തീരത്തായിരുന്നു.
  to: യേശു വീണ്ടും പടകിൽ മറുകരയിലേക്കു കടന്നശേഷം, വലിയൊരു ജനക്കൂട്ടം അവന്റെ അടുക്കൽ കൂടിവന്നു. അവൻ കടൽത്തീരത്തായിരുന്നു[a].
  rationale: The revision moves the note marker to the term it explains and refines the crowd’s relation to Jesus from ‘around him’ to ‘to/at him.’ No doctrinal or historical interpretation has been added, and the Greek temporal and spatial relationships are retained.
