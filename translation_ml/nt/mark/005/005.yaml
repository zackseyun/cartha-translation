  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ തുടർച്ചാഭാവം വാക്യാവസാനത്തിലെ ‘ചെയ്തുകൊണ്ടിരുന്നു’ എന്ന ഘടനയിൽ സംയുക്തമായി പ്രകടിപ്പിച്ചിരിക്കുന്നു.
