reference: Mark 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: ml
  text: അവൻ അവർക്കു അനുവാദം നൽകി. അപ്പോൾ അശുദ്ധാത്മാക്കൾ പുറത്തുവന്ന് പന്നികളിൽ കടന്നു. ആ പന്നിക്കൂട്ടം—ഏകദേശം രണ്ടായിരം എണ്ണം—ചെങ്കുത്തായ ചരിവിലൂടെ[a] കടലിലേക്കു[b] പാഞ്ഞിറങ്ങി; അവ കടലിൽ മുങ്ങിമരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുത്തനെയുള്ള കരയിലൂടെ’ അല്ലെങ്കിൽ ‘ചെങ്കുത്തായ പാറക്കെട്ടിലൂടെ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദം കുത്തനെയുള്ള ചരിവിനെയോ അഗാധമായ പാറക്കെട്ടിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘കടൽ.’ ഇവിടെ ഗലീലക്കടലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: അവൻ അവയ്ക്ക് അനുവാദം നൽകി
  rationale: ἐπιτρέπω എന്നതിലെ അനുവാദം നൽകുക എന്ന അർഥവും αὐτοῖς എന്ന ബഹുവചന ദാതൃവിഭക്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: അശുദ്ധാത്മാക്കൾ
  rationale: മർക്കോസിലെ സ്ഥിരപ്രയോഗമായ ഈ പദസമുച്ചയത്തിന്റെ ആത്മീയവും അശുദ്ധിയുമായി ബന്ധപ്പെട്ടതുമായ അർഥതലങ്ങൾ സംരക്ഷിക്കുന്നു.
- source_word: ἐξελθόντα ... εἰσῆλθον εἰς τοὺς χοίρους
  choice: പുറത്തുവന്ന് പന്നികളിൽ കടന്നു
  rationale: ആത്മാക്കൾ മനുഷ്യനിൽനിന്ന് പുറത്തുവന്ന് പന്നികളിൽ പ്രവേശിക്കുന്ന സംഭവക്രമം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: ആ പന്നിക്കൂട്ടം ... പാഞ്ഞിറങ്ങി
  rationale: കൂട്ടത്തെ ഏകകമായി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗവും പെട്ടെന്നുള്ള ശക്തമായ ചലനവും നിലനിർത്തുന്നു.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: ചെങ്കുത്തായ ചരിവിലൂടെ
  rationale: κρημνός ചെങ്കുത്തായ ചരിവിനെയോ കുത്തനെയുള്ള കരയെയോ സൂചിപ്പിക്കാം; പൂർണമായും ലംബമായ പാറക്കെട്ട് എന്നു നിർബന്ധിക്കാതെ ഭൂപ്രകൃതി വ്യക്തമാക്കുന്നു.
- source_word: ὡς δισχίλιοι
  choice: ഏകദേശം രണ്ടായിരം എണ്ണം
  rationale: ὡς സംഖ്യയെ ഏകദേശമാക്കുന്നതിനാൽ കൃത്യസംഖ്യയായി അവതരിപ്പിക്കാതെ അതിന്റെ ഏകദേശസ്വഭാവം സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὴν θάλασσαν
  choice: കടലിലേക്ക്
  rationale: θάλασσα എന്ന മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഗലീലക്കടലാണെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπνίγοντο ἐν τῇ θαλάσσῃ
  choice: അവ കടലിൽ മുങ്ങിച്ചത്തു
  rationale: അപൂർണഭൂതകാല ക്രിയ സൂചിപ്പിക്കുന്ന സംഭവവും അതിന്റെ മരണഫലവും മലയാള ആഖ്യാനത്തിൽ വ്യക്തമായി നൽകുന്നു; കടൽ എന്ന ആവർത്തനവും മൂലപാഠത്തെ അനുസരിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവയ്ക്ക്’ എന്ന സർവനാമത്തിന്റെ സൂചിതവിഷയം
  choice: അശുദ്ധാത്മാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്
  alternative: പന്നികളെയാണ് സൂചിപ്പിക്കുന്നത്
  rationale: തൊട്ടുമുമ്പുള്ള അപേക്ഷയുടെ സന്ദർഭത്തിൽ അനുമതി ചോദിച്ച അശുദ്ധാത്മാക്കളാണ് αὐτοῖς എന്നതിന്റെ സ്വാഭാവിക സൂചിതവിഷയം.
- issue: ‘അശുദ്ധാത്മാക്കൾ’ എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: വ്യക്തിത്വമുള്ള ആത്മീയ സത്തകളെ സൂചിപ്പിക്കുന്ന ഭാഷ നിലനിർത്തി
  alternative: വ്യക്തിത്വമില്ലാത്ത ദുഷ്ടശക്തികൾ
  rationale: πνεύματα എന്ന പദവും അവയുടെ പ്രവർത്തനങ്ങളും കഥയിൽ വ്യക്തിത്വമുള്ള ആത്മീയ സത്തകളെയാണ് അവതരിപ്പിക്കുന്നത്; അതിലുപരി സിദ്ധാന്തപരമായ വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ സംഭവക്രമം, ഏകദേശസംഖ്യ, ‘കടൽ’ എന്ന ആവർത്തനം എന്നിവ നിലനിർത്തി. ലഭിച്ച ഇംഗ്ലീഷ് കരടിൽ [a] ചിഹ്നം അനുമതി വാക്യത്തിനു പിന്നാലെയുണ്ടായിരുന്നെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് κρημνός എന്ന പദത്തെക്കുറിച്ചായതിനാൽ പ്രസക്തമായ ‘ചെങ്കുത്തായ ചരിവിലൂടെ’ എന്നിടത്തേക്ക് മാറ്റി; [b] ‘കടൽ’ എന്നിടത്ത് നിലനിർത്തി.
