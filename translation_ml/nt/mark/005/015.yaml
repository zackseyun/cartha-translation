id: MRK.5.15
reference: Mark 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: ml
  text: അവർ യേശുവിന്റെ അടുക്കൽ വന്നു. ഭൂതബാധിതനായിരുന്ന ആ മനുഷ്യനെ—ലെഗ്യോൻ ബാധിച്ചിരുന്നവനെ—വസ്ത്രം ധരിച്ച് സുബോധമുള്ളവനായി ഇരിക്കുന്നതു അവർ കണ്ടു; അവർ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: വന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായി നൽകി.
- source_word: θεωροῦσιν
  choice: കണ്ടപ്പോൾ
  rationale: ദൃശ്യമായി നിരീക്ഷിച്ചതെന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, തുടർന്നുള്ള ഭയപ്രതികരണവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: δαιμονιζόμενον
  choice: ഭൂതബാധിതനായിരുന്ന ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ മുമ്പ് ഭൂതബാധിതനായിരുന്ന അറിയപ്പെടുന്ന മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; സൗഖ്യാനന്തരാവസ്ഥ വ്യക്തമാക്കാൻ ‘ആയിരുന്ന’ ചേർത്തു.
- source_word: καθήμενον
  choice: അവിടെ ഇരിക്കുന്നത്
  rationale: ദൃശ്യത്തിന്റെ പശ്ചാത്തലഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘അവിടെ’ മൂലത്തിൽ വ്യക്തമായി ഇല്ലാത്തതിനാൽ അതിനെക്കുറിച്ച് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἱματισμένον
  choice: വസ്ത്രം ധരിച്ച്
  rationale: മുമ്പത്തെ അവസ്ഥയ്ക്കു വിരുദ്ധമായ, വസ്ത്രം ധരിച്ച പുനഃസ്ഥാപിതാവസ്ഥ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: σωφρονοῦντα
  choice: സുബോധത്തോടെ
  rationale: മാനസികസ്ഥൈര്യവും ആത്മനിയന്ത്രണവും വീണ്ടെടുത്ത അവസ്ഥയെ ചികിത്സാപരമായ അതിവ്യാഖ്യാനം കൂടാതെ സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: ἐσχηκότα
  choice: ഉണ്ടായിരുന്നവൻ
  rationale: പൂർണ്ണകാല കൃതന്തം മുമ്പുണ്ടായിരുന്നെങ്കിലും ഇപ്പോൾ അവസാനിച്ച അവസ്ഥയിലൂടെ ആ മനുഷ്യനെ തിരിച്ചറിയിക്കുന്നു.
- source_word: λεγιῶνα
  choice: ലെഗ്യോൻ
  rationale: മുൻവാക്യത്തിലെ ഭൂതങ്ങളുടെ സ്വയംപരാമർശത്തെ തിരിച്ചുസൂചിപ്പിക്കുന്ന നാമസദൃശമായ പദമായി ലിപ്യന്തരണം ചെയ്തു; സൈനിക ‘സേനാവിഭാഗം’ എന്ന സാധാരണ അർഥവും പശ്ചാത്തലത്തിൽ നിലനിൽക്കുന്നു.
- source_word: ἐφοβήθησαν
  choice: അവർ ഭയപ്പെട്ടു
  rationale: പ്രതികരണത്തെ അതിശയോക്തിയില്ലാതെ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദemonic affliction വിവരണം
  choice: ഭൂതബാധിതനായിരുന്ന ആ മനുഷ്യൻ
  alternative: ഭൂതം ബാധിച്ച മനുഷ്യൻ
  rationale: വാചകം യഥാർഥ ഭൂതബാധയാണ് അവതരിപ്പിക്കുന്നത്; അതിനെ വെറും രോഗമായി മയപ്പെടുത്താതെയും പഴഞ്ചൻ പ്രയോഗം ഉപയോഗിക്കാതെയും നൽകുന്നു.
- issue: λεγιών ഒരു വിശേഷണമോ പേരോ
  choice: ലെഗ്യോൻ
  alternative: ലെഗ്യോൻ എന്ന ഭൂതസമൂഹം / സേനാവിഭാഗം
  rationale: മുൻസന്ദർഭത്തിലെ സ്വയംനാമകരണത്തെ മാനിച്ച് നാമസദൃശമായി നിലനിർത്തുന്നു; എന്നാൽ അത് അനേകം ഭൂതങ്ങളെ സൂചിപ്പിക്കുന്ന സൈനികരൂപകമാണെന്ന അർഥസാധ്യത അടച്ചുപൂട്ടുന്നില്ല.
- issue: ἐσχηκότα സൂചിപ്പിക്കുന്ന കാലബന്ധം
  choice: ഉണ്ടായിരുന്നവൻ
  alternative: ഉണ്ടായിരുന്ന ആ മനുഷ്യൻ
  rationale: ഭൂതബാധ ഇപ്പോഴും തുടരുന്നു എന്ന് തോന്നിക്കാതെ, ആ മുൻഅവസ്ഥയിലൂടെ മനുഷ്യനെ തിരിച്ചറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘സുബോധത്തോടെ’ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കുമ്പോഴും σωφρονεῖν എന്ന പദത്തിലെ മാനസികസ്ഥൈര്യവും ആത്മനിയന്ത്രണവും നിലനിർത്തുന്നു. ‘ലെഗ്യോൻ’ മുൻസന്ദർഭത്തോടുള്ള ബന്ധം കാത്തുസൂക്ഷിക്കുന്നു.
