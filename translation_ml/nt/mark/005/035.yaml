id: MRK.5.35
reference: Mark 5:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: ml
  text: 'അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, സിനഗോഗിന്റെ നേതാവിന്റെ വീട്ടിൽനിന്ന്[a] ചിലർ വന്ന് പറഞ്ഞു: “താങ്കളുടെ മകൾ മരിച്ചുപോയി. ഇനിയും ഗുരുവിനെ ബുദ്ധിമുട്ടിക്കുന്നത്[b] എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ ‘സിനഗോഗിന്റെ നേതാവിൽനിന്ന്’; ഇവിടെ അദ്ദേഹത്തിന്റെ വീടോ വീട്ടുകാരോ ഉദ്ദേശിക്കപ്പെടുന്നു.
    reason: previous_rendering
  - marker: b
    text: അഥവാ ‘ശല്യപ്പെടുത്തുന്നത്’ അല്ലെങ്കിൽ ‘പ്രയാസപ്പെടുത്തുന്നത്’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഒരേ സമയത്ത് നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ἔτι എന്നതിന്റെ ‘ഇനിയും’ എന്ന കാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔρχονται
  choice: ചിലർ വന്ന്
  rationale: ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലക്രമത്തിൽ അവതരിപ്പിക്കുന്നു. ക്രിയയുടെ ബഹുവചനം വ്യക്തമാക്കാൻ സന്ദർഭാനുസൃതമായി ‘ചിലർ’ ചേർത്തിരിക്കുന്നു.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: സിനഗോഗിന്റെ നേതാവിന്റെ വീട്ടിൽനിന്ന്
  rationale: പദശഃ ‘സിനഗോഗിന്റെ നേതാവിൽനിന്ന്’ എന്നാണ്; എന്നാൽ നേതാവ് യേശുവിനോടൊപ്പമാണെന്ന സന്ദർഭത്തിൽ ഈ പ്രയോഗം അദ്ദേഹത്തിന്റെ വീട്ടെയോ വീട്ടുകാരെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘വീട്ടിൽനിന്ന്’ എന്ന് വ്യക്തമാക്കുന്നു.
- source_word: Ἡ θυγάτηρ σου ἀπέθανεν
  choice: താങ്കളുടെ മകൾ മരിച്ചുപോയി
  rationale: മരണം സംഭവിച്ചുകഴിഞ്ഞതും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; σου എന്ന ഏകവചന അഭിസംബോധനയ്ക്ക് സന്ദർഭോചിതമായ ആദരരൂപം ഉപയോഗിക്കുന്നു.
- source_word: τί ἔτι σκύλλεις
  choice: ഇനിയും ... ബുദ്ധിമുട്ടിക്കുന്നത് എന്തിന്?
  rationale: തുടർന്നും ഒരാളെ പ്രയാസപ്പെടുത്തുകയോ അദ്ദേഹത്തിന്മേൽ ബാധ്യത ചുമത്തുകയോ ചെയ്യുന്നതാണ് σκύλλω ഇവിടെ സൂചിപ്പിക്കുന്നത്. ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി ക്രമീകരിച്ചിരിക്കുന്നു.
- source_word: τὸν διδάσκαλον
  choice: ഗുരുവിനെ
  rationale: διδάσκαλος എന്ന പദത്തിന്റെ അധ്യാപകൻ/ഗുരു എന്ന അർഥം നിലനിർത്തുന്നു; യേശു എന്ന പേര് ചേർത്ത് വക്താക്കളുടെ കാഴ്ചപ്പാട് വികസിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ‘ഗുരു’ ആരെന്ന സൂചന
  choice: യേശുവിന്റെ പേര് ചേർക്കാതെ ‘ഗുരു’ എന്ന പദവി മാത്രം നിലനിർത്തി.
  alternative: ‘യേശുവിനെ’ അല്ലെങ്കിൽ ‘യജമാനനെ’
  rationale: ഗ്രീക്ക് പാഠം പേരിനു പകരം διδάσκαλος എന്ന പദവിയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വക്താക്കളുടെ കാഴ്ചപ്പാടും പാഠത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ മിതത്വവും അതേപടി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സംഭാഷണത്തിൽ യായീറൊസിനോടുള്ള ഏകവചന ആദരസൂചനയായി ‘താങ്കളുടെ’ ഉപയോഗിച്ചു; ‘സിനഗോഗ്’ എന്ന പരിചിതമായ മത-ചരിത്രപദം നിലനിർത്തി.
