source:
  edition: SBLGNT
  text: καὶ διεστείλατο αὐτοῖς πολλὰ ἵνα μηδεὶς γνοῖ τοῦτο, καὶ εἶπεν δοθῆναι αὐτῇ φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: ml
  text: ഇക്കാര്യം ആരും അറിയരുതെന്ന് അവൻ അവരോട് വളരെ കർശനമായി കൽപ്പിച്ചു[a]. അവൾക്കു ഭക്ഷിക്കാൻ എന്തെങ്കിലും കൊടുക്കണമെന്നും അവൻ പറഞ്ഞു[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ അവർക്കു വീണ്ടുംവീണ്ടും കർശനമായ നിർദേശം നൽകി’ അല്ലെങ്കിൽ ‘അവൻ അവരെ ശക്തമായി നിർദേശിച്ചു.’ ഗ്രീക്കിലെ പ്രയോഗത്തിൽ അക്ഷരാർഥത്തിൽ ‘വളരെ/പലത്’ എന്നർഥമുള്ള ഒരു തീവ്രതാസൂചക പദമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവൾക്കു ഭക്ഷിക്കാൻ കൊടുക്കണമെന്ന്’; മലയാളത്തിൽ സ്വാഭാവികമായി, ‘അവൾക്കു ഭക്ഷിക്കാൻ എന്തെങ്കിലും കൊടുക്കണമെന്ന്.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവൾക്കു ഭക്ഷിക്കാൻ എന്തെങ്കിലും നൽകപ്പെടണമെന്ന് അവൻ പറഞ്ഞു.’
    reason: previous_rendering
lexical_decisions:
- source_word: διεστείλατο ... πολλὰ
  choice: വളരെ കർശനമായി കല്പിച്ചു
  rationale: διαστέλλομαι ഇവിടെ ശക്തമായ നിർദേശം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; πολλὰ ആ നിർദേശത്തിന്റെ തീവ്രത വർധിപ്പിക്കുന്നു. ഈ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അർഥവും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: സന്നിഹിതരായിരുന്നവരെ സൂചിപ്പിക്കുന്ന ദാതൃവിഭക്തി മലയാളത്തിൽ ‘അവരോട്’ എന്ന് സ്വാഭാവികമായി വരുന്നു.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: ഇക്കാര്യം ആരും അറിയരുതെന്ന്
  rationale: ἵνα സഹിതമുള്ള ഉപവാക്യം കല്പനയുടെ ലക്ഷ്യവും നിരോധനസ്വഭാവവും പ്രകടിപ്പിക്കുന്നു. γνοῖ ഇവിടെ കാര്യം അറിയുക അഥവാ അറിഞ്ഞെത്തുക എന്ന അർഥത്തിലാണ്.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: മൂലപദത്തിന്റെ സാധാരണ അർഥം നേരിട്ട് നിലനിർത്തുന്നു; തുടർന്നുള്ള ആശ്രിതവാക്യം സന്ദർഭത്തിലെ നിർദേശഭാവം വ്യക്തമാക്കുന്നു.
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: അവൾക്കു ഭക്ഷിക്കാൻ എന്തെങ്കിലും കൊടുക്കണമെന്ന്
  rationale: ഗ്രീക്കിൽ കർമണിപ്രയോഗത്തിലുള്ള അനന്തക്രിയയാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവികമായ അനിശ്ചിത കർത്തൃപ്രയോഗം ഉപയോഗിക്കുന്നു. φαγεῖν-ന് സന്ദർഭം ആവശ്യപ്പെടുന്ന ‘എന്തെങ്കിലും’ എന്ന സൂചിത കർമം ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ കല്പനയുടെ പരിധിയും മിശിഹാരഹസ്യ പ്രമേയവും
  choice: സംഭവം ആരും അറിയരുതെന്ന ശക്തമായ കല്പനയായി മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ഈ കല്പനയെ മർക്കോസിലെ വിപുലമായ ‘മിശിഹാരഹസ്യ’ പ്രമേയത്തിന്റെ വിശദീകരണമായി വികസിപ്പിക്കുക.
  rationale: വാക്യം നൽകുന്നതിലപ്പുറം ദൈവശാസ്ത്രപരമായ കാരണം ചേർക്കാതെ, കല്പനയുടെ ശക്തിയും അതിലെ നിലനിൽക്കുന്ന സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വളരെ കർശനമായി കല്പിച്ചു’ എന്നത് മൂലത്തിലെ തീവ്രത നിലനിർത്തുന്നു; രണ്ടാമത്തെ വാക്യത്തിൽ സ്വാഭാവിക മലയാളത്തിനായി സജീവസദൃശമായ അനിശ്ചിത കർത്തൃഘടന ഉപയോഗിച്ചെങ്കിലും ഗ്രീക്കിലെ കർമണിരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
