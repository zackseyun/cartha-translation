  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളോടു പറയുന്നതു എല്ലാവരോടും പറയുന്നു: ജാഗരിച്ചിരിക്കുവിൻ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാവലിരിക്കുവിൻ” അല്ലെങ്കിൽ “ജാഗ്രതയോടെ ഇരിക്കുവിൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: പറയുന്നതു
  rationale: നപുംസകലിംഗ ഏകവചന ബന്ധസർവനാമം substantival ആയി വന്നിരിക്കുന്നു; λέγωയോടു ചേർത്ത് ‘പറയുന്നതു’ എന്നു നൽകുന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഞാൻ പറയുന്ന കാര്യം’ എന്ന വിശാലമായ അർഥം സൂക്ഷിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിലെ വാക്യബന്ധത്തിൽ അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ ‘എന്നാൽ’ പോലൊരു പദം ചേർത്ത് അനാവശ്യ വിരോധം സൃഷ്ടിച്ചിട്ടില്ല.
- source_word: ὑμῖν
  choice: നിങ്ങളോടു
  rationale: രണ്ടാംപുരുഷ ബഹുവചന ദത്തിവിഭക്തി ആദ്യം സന്നിഹിതരായ ശിഷ്യരെ അഭിസംബോധന ചെയ്യുന്നു; ‘നിങ്ങളോടു’ ആ ബഹുവചനവും അഭിസംബോധനയുടെ ദിശയും വ്യക്തമാക്കുന്നു.
- source_word: λέγω ... λέγω
  choice: പറയുന്നതു ... പറയുന്നു
  rationale: ഗ്രീക്കിലെ ആവർത്തനവും വാക്യത്തിന്റെ ഊന്നലുള്ള സമാന്തരഘടനയും മലയാളത്തിൽ നിലനിർത്തുന്നു; കാലരൂപഭേദം മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കനുസൃതമാണ്.
- source_word: πᾶσιν
  choice: എല്ലാവരോടും
  rationale: വിശാലവും ഉൾക്കൊള്ളുന്നതുമായ ദത്തിവിഭക്തി ബഹുവചനത്തിന്റെ ശക്തി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘മനുഷ്യർ’ പോലുള്ള നാമം ചേർത്തിട്ടില്ല.
- source_word: γρηγορεῖτε
  choice: ജാഗരിച്ചിരിക്കുവിൻ
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞാരൂപം തുടർച്ചയായ ജാഗ്രത ആവശ്യപ്പെടുന്നു. ഈ പ്രയോഗം ഉറങ്ങാതിരിക്കുക എന്ന രൂപകത്തിന്റെ നേരിട്ടുള്ള ഭാവവും ആത്മീയ ജാഗ്രതയുടെ സന്ദർഭാർഥവും ഒരുമിച്ച് തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പ്രബോധനത്തിന്റെ വ്യാപ്തി
  choice: ആദ്യം ‘നിങ്ങൾ’ എന്നു അഭിസംബോധന ചെയ്തവരോടു പറഞ്ഞത് ‘എല്ലാവരോടും’ ബാധകമാണെന്ന് വ്യക്തമായി വിപുലീകരിക്കുന്നു.
  alternative: വിവരണസന്ദർഭത്തിലെ ഉടൻ കേട്ടിരുന്ന ശിഷ്യന്മാർക്കു മാത്രമുള്ള പ്രബോധനമായി ഗ്രഹിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം ὑμῖν (‘നിങ്ങളോട്’) എന്നും πᾶσιν (‘എല്ലാവരോടും’) എന്നും വ്യക്തമായി വേർതിരിക്കുന്നു; അതിനാൽ സർവവ്യാപകമായ പ്രയോഗം ചുരുക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ മനസ്സിലാകുന്നതും തിരുവെഴുത്തുവായനയ്ക്കു യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജാഗരിച്ചിരിക്കുവിൻ’ എന്നത് അല്പം ഔപചാരികമായെങ്കിലും വ്യക്തവും സന്ദർഭോചിതവുമാണ്; ഏകവാക്യത്തിലെ ആവർത്തനം മൂലപാഠത്തിന്റെ ഊന്നലിനായി സൂക്ഷിച്ചു.
