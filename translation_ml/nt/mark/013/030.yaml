source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇതെല്ലാം സംഭവിക്കുന്നതുവരെ ഈ തലമുറ[a] തീർച്ചയായും കടന്നുപോകുകയില്ല[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ ജനം’ അല്ലെങ്കിൽ ‘ഈ വംശം’ എന്നും പരിഭാഷപ്പെടുത്താം; γενεά എന്ന ഗ്രീക്ക് പദത്തിന് വിശാലമായ അർഥങ്ങൾ ഉണ്ടാകാമെങ്കിലും ഇവിടെ ‘തലമുറ’ എന്നതാണ് ഏറ്റവും സ്വാഭാവികം.
    reason: lexical_alternative
  - marker: b
    text: ‘തീർച്ചയായും കടന്നുപോകുകയില്ല’ എന്നത് ഗ്രീക്കിലെ ശക്തമായ നിഷേധപ്രയോഗത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: ഗൗരവവും ആധികാരികതയും നിറഞ്ഞ വചനത്തിന്റെ ആമുഖമായി പ്രവർത്തിക്കുന്ന പദം; ആധുനിക മലയാളത്തിൽ അതിന്റെ അർഥവും ഊന്നലും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനാസൂത്രം ഗ്രീക്കിനോടു ചേർന്നുനിൽക്കുകയും മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐ μὴ παρέλθῃ
  choice: തീർച്ചയായും കടന്നുപോകുകയില്ല
  rationale: οὐ μήയും aorist subjunctive-ഉം ചേർന്ന ശക്തമായ നിഷേധം ‘തീർച്ചയായും ... ഇല്ല’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἡ γενεὰ αὕτη
  choice: ഈ തലമുറ
  rationale: ഇവിടെ γενεάയുടെ ഏറ്റവും സ്വാഭാവികമായ കാലസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു; വ്യാഖ്യാനവിവാദം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: μέχρις οὗ
  choice: വരെ
  rationale: സംഭവങ്ങൾ നടക്കുന്നതുവരെയുള്ള കാലപരിധി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ταῦτα πάντα
  choice: ഇതെല്ലാം
  rationale: മുമ്പ് പരാമർശിച്ച എല്ലാ സംഭവങ്ങളെയും കൂട്ടമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: γένηται
  choice: സംഭവിക്കുന്ന
  rationale: അന്ത്യകാലപ്രഭാഷണത്തിലെ സംഭവങ്ങൾ നടക്കുന്നതിനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാലപ്രഭാഷണത്തിലെ ‘ഈ തലമുറ’ (ἡ γενεὰ αὕτη) എന്നതിന്റെ അർഥം
  choice: വ്യാഖ്യാനവികാസമില്ലാതെ ‘ഈ തലമുറ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഈ ജനം/ഈ വംശം’; അല്ലെങ്കിൽ അടയാളങ്ങൾ കാണുന്ന ഭാവിതലമുറ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ വായന ‘ഈ തലമുറ’ എന്നാണ്. ഏറെ വിവാദമുള്ള ഈ വാക്കിന്റെ വ്യാഖ്യാനപരമായ സംഘർഷം ഏതെങ്കിലും അന്ത്യകാലസിദ്ധാന്തത്തിന് അനുകൂലമായി പരിഭാഷയിൽ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ള നേരിട്ടുള്ള വാക്യഘടന ഉപയോഗിച്ചു. മൂലത്തിലെ ഊന്നലും ‘ഈ തലമുറ’ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനപരമായ സംഘർഷവും നിലനിർത്തി.
