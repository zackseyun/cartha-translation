review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the warning force of μή, the suddenness of ἐξαίφνης, and the literal image of sleeping (καθεύδοντας). However, εὕρῃ means “find,” not merely “see,” and the Malayalam wording with കാണാതിരിക്കേണ്ടതിന് weakens that specific nuance.
  naturalness: The current phrase “നിങ്ങൾ ഉറങ്ങുന്നതായി കാണാതിരിക്കേണ്ടതിന്” is understandable but somewhat stiff and less idiomatic in this warning context. “നിങ്ങളെ ഉറങ്ങുന്നവരായി കണ്ടെത്താതിരിക്കേണ്ടതിന്” is natural modern standard Malayalam and directly conveys being found in a sleeping state.
  terminology: No theological terminology or proper names occur. “ഉറങ്ങുന്നവരായി” preserves the Greek participial image without resolving whether it is literal or figurative.
  issues:
  - severity: medium
    issue: εὕρῃ is rendered as കാണുക rather than കണ്ടെത്തുക.
    rationale: The Greek verb εὑρίσκω here means “find/discover,” especially in the sense of arriving and finding someone in a particular condition. കണ്ടെത്തുക preserves this source nuance more closely.
  revised_text: അവൻ പെട്ടെന്ന് വന്ന് നിങ്ങളെ ഉറങ്ങുന്നവരായി കണ്ടെത്താതിരിക്കേണ്ടതിന്.
  revised_footnotes: []
  revision_rationale: The revision replaces “കാണാതിരിക്കേണ്ടതിന്” with “കണ്ടെത്താതിരിക്കേണ്ടതിന്” to reflect εὕρῃ accurately, and recasts the object-complement as “നിങ്ങളെ ഉറങ്ങുന്നവരായി,” a more direct and idiomatic Malayalam equivalent of “find you sleeping.” The dependent warning construction and the ambiguity of “sleeping” are retained.
