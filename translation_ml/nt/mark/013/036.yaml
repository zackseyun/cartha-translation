  yaml_path: translation/nt/mark/013/036.yaml
  text: lest, coming suddenly, he find you sleeping.
translation:
  language: ml
  text: അവൻ പെട്ടെന്ന് വന്ന് നിങ്ങളെ ഉറങ്ങുന്നവരായി കണ്ടെത്താതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαίφνης
  choice: പെട്ടെന്ന്
  rationale: അപ്രതീക്ഷിതവും പൊടുന്നനെയുള്ള വരവിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καθεύδοντας
  choice: ഉറങ്ങുന്നതായി
  rationale: വാക്യത്തിലെ നേരിട്ടുള്ള ഉറക്കത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ജാഗ്രതക്കുറവ് എന്ന വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: μὴ ... εὕρῃ
  choice: കാണാതിരിക്കേണ്ടതിന്
  rationale: ഗ്രീക്കിലെ നിരോധക/പ്രതിരോധക ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മുൻവാക്യത്തിലെ ജാഗരൂകരായിരിക്കാനുള്ള ആഹ്വാനവുമായി ബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉറക്കം അക്ഷരാർഥത്തിലോ രൂപകാർഥത്തിലോ
  choice: ഉറങ്ങുന്നതായി
  alternative: ജാഗ്രതയില്ലാത്തവരായി
  rationale: മൂലപാഠം ഉറക്കം എന്ന ദൃശ്യഭാഷയാണ് ഉപയോഗിക്കുന്നത്. അതിന്റെ രൂപകസാധ്യത വിശദീകരിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
- issue: കർത്താവിന്റെ അപ്രതീക്ഷിത വരവ്
  choice: അവൻ പെട്ടെന്ന് വന്ന്
  alternative: അവൻ അപ്രതീക്ഷിതമായി വന്നിട്ട്
  rationale: ἐλθών എന്ന പങ്കുപദത്തിന്റെയും ἐξαίφνης എന്ന ക്രിയാവിശേഷണത്തിന്റെയും ബന്ധം ലളിതമായ മലയാള ക്രിയാശൃംഖലയിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഈ വാക്യം മുൻസന്ദർഭത്തെ ആശ്രയിക്കുന്നതിനാൽ ഗ്രീക്കിലെ μὴ ഘടന മലയാളത്തിൽ ഉദ്ദേശ്യ/പ്രതിരോധ രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
