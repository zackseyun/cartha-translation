source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: ml
  text: 'അത്തിവൃക്ഷത്തിൽനിന്ന് ഉപമ പഠിക്കൂ: അതിന്റെ കൊമ്പ് ഇതിനകം മൃദുവാകുകയും ഇലകൾ തളിർക്കുകയും ചെയ്യുമ്പോൾ[a], വേനൽ അടുത്തിരിക്കുന്നുവെന്ന് നിങ്ങൾ അറിയുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉപമ’ എന്നതിന് ‘പാഠം’ എന്നോ ‘ദൃഷ്ടാന്തം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: അത്തിവൃക്ഷത്തിൽനിന്ന്
  rationale: ἀπό + genitive അറിവിന്റെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ നേരിയ ബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ വാക്യപ്രവാഹത്തിലൂടെ അതിന്റെ ബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μάθετε
  choice: പഠിക്കൂ
  rationale: μανθάνω എന്ന ക്രിയയുടെ aorist imperative രൂപം ഉപദേശം സ്വീകരിക്കാനുള്ള ആഹ്വാനമാണ്; ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: τὴν παραβολήν
  choice: ഈ ഉപമ
  rationale: παραβολή ഇവിടെ അത്തിവൃക്ഷത്തിൽനിന്നെടുത്ത സാദൃശ്യപാഠമാണ്. ‘ഉപമ’ സുവിശേഷപരമായ പദതുടർച്ചയും താരതമ്യത്തിന്റെ സ്വഭാവവും നിലനിർത്തുന്നു; നിർദ്ദേശകമായ ‘ഈ’ മലയാളത്തിൽ പ്രസ്തുത ഉപമയെ സ്വാഭാവികമായി ചൂണ്ടിക്കാട്ടുന്നു.
- source_word: ὅταν
  choice: തളിർക്കുമ്പോൾ
  rationale: ὅταν + subjunctive പൊതുവായ കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ുമ്പോൾ’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: അതിന്റെ കൊമ്പ് ഇളയതായിത്തീർന്ന്
  rationale: κλάδος ‘കൊമ്പ്’ എന്നും ἁπαλός പുതിയ വളർച്ചയുടെ മൃദുത്വം/ഇളമ സൂചിപ്പിക്കുന്നതുമാണ്. ‘ഇളയതായിത്തീർന്ന്’ പുതിയ വളർച്ചയുടെ സ്വാഭാവിക സസ്യചിത്രം നൽകുന്നു; γένηται സൂചിപ്പിക്കുന്ന അവസ്ഥാമാറ്റവും നിലനിർത്തുന്നു. ἤδηയുടെ ആരംഭിച്ചുകഴിഞ്ഞ അവസ്ഥ മലയാളത്തിലെ ഈ പൂർത്തീകരണപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ἐκφύῃ τὰ φύλλα
  choice: ഇലകൾ തളിർക്കുമ്പോൾ
  rationale: ἐκφύω മുളയ്ക്കുക, പുറത്തുവരുക എന്ന സസ്യവളർച്ചയെ സൂചിപ്പിക്കുന്നു; ‘ഇലകൾ തളിർക്കുക’ സാധാരണവും ചിത്രസമ്പന്നവുമായ മലയാളമാണ്.
- source_word: γινώσκετε
  choice: നിങ്ങൾ അറിയുന്നു
  rationale: ഇത് present indicative ആണ്, imperative അല്ല; അടയാളത്തിൽനിന്ന് ആളുകൾ തിരിച്ചറിയുന്ന വസ്തുതയെ പ്രസ്താവിക്കുന്നു.
- source_word: ἐγγὺς
  choice: അടുത്തിരിക്കുന്നുവെന്ന്
  rationale: ἐγγύς കാലപരമായ സമീപതയെ സൂചിപ്പിക്കുന്നു; ‘അടുത്തിരിക്കുന്നു’ ലളിതവും വ്യക്തവുമാണ്.
- source_word: τὸ θέρος
  choice: വേനൽ
  rationale: θέρος എന്നതിന്റെ പ്രാഥമിക അർത്ഥം ‘വേനൽക്കാലം’ ആണ്; കൊയ്ത്തുകാലം എന്ന സാദ്ധ്യത ഇവിടെ അത്തിവൃക്ഷത്തിന്റെ ഋതുചിത്രത്തേക്കാൾ കുറവാണ്.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ παραβολή എന്ന പദത്തിന്റെ അർത്ഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ഉപമ’ എന്നു നൽകി.
  alternative: പാഠം; ദൃഷ്ടാന്തം
  rationale: യേശുവിന്റെ ഉപദേശത്തിലെ സ്ഥിരമായ സുവിശേഷപദപ്രയോഗം നിലനിർത്തുകയും അതിനെ വിശദമായ അലങ്കാരവ്യാഖ്യാനമായി നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു. ഇവിടെ ഒരു സാദൃശ്യത്തിൽനിന്നുള്ള പാഠമാണ് ഉദ്ദേശ്യമെന്നത് സന്ദർഭം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സസ്യവളർച്ചയുടെ ചിത്രം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കാൻ ‘കൊമ്പ് ഇളയതായിത്തീർന്ന് ഇലകൾ തളിർക്കുമ്പോൾ’ എന്നു നൽകി. അടിക്കുറിപ്പുകുറി [a] പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
