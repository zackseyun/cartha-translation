review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the comparative link ('അതുപോലെ നിങ്ങളും'), the future-contingent sense of ὅταν, the plural scope of ταῦτα, the imperative force of γινώσκετε, and the unresolved subject of ἐγγύς ἐστιν. However, 'എത്തിയിരിക്കുന്നുവെന്ന്' adds an aspectual notion of having arrived that is not expressed by Greek ἐστιν ('is').
  naturalness: The phrase 'അത് അടുത്ത്, വാതിലുകൾക്കരികെ എത്തിയിരിക്കുന്നുവെന്ന്' is syntactically and idiomatically strained in modern Malayalam. A coordinated expression, 'അത് അടുത്താണെന്നും വാതിലുകൾക്കൽ തന്നെയാണെന്നും,' naturally conveys the Greek idiom of extreme nearness without adding 'arrived.'
  terminology: ‘വാതിലുകൾക്കൽ’ preserves the plural θύραις while remaining natural Malayalam. ‘അത്’ appropriately maintains the Greek’s unstated subject; the personal alternative remains in the footnote without making an interpretive decision in the main text.
  issues:
  - severity: medium
    issue: The main text adds 'എത്തിയിരിക്കുന്ന' ('has arrived').
    rationale: ἐγγύς ἐστιν means 'is near'; it does not state that the implicit referent has arrived. This addition also makes the clause awkward in Malayalam.
  - severity: low
    issue: The wording of the nearness/doors idiom is unnatural.
    rationale: The Greek phrase is an idiom for immediate nearness. Coordinating 'അടുത്താണെന്നും' and 'വാതിലുകൾക്കൽ തന്നെയാണെന്നും' is clear modern Malayalam and retains the rhetorical force.
  revised_text: അതുപോലെ നിങ്ങളും, ഇവ സംഭവിച്ചുകൊണ്ടിരിക്കുന്നത് കാണുമ്പോൾ, അത് അടുത്താണെന്നും വാതിലുകൾക്കൽ തന്നെയാണെന്നും അറിയുക.[a]
