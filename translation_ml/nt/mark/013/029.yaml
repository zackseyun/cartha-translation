  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: ml
  text: അതുപോലെ നിങ്ങളും, ഇവ സംഭവിച്ചുകൊണ്ടിരിക്കുന്നത് കാണുമ്പോൾ, അത് അടുത്താണെന്നും വാതിലുകൾക്കൽ തന്നെയാണെന്നും അറിയുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ അടുത്താണെന്നും വാതിലുകൾക്കൽ തന്നെയാണെന്നും.” ഗ്രീക്കിൽ കർത്താവിനെ വ്യക്തമായി പറഞ്ഞിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: അതുപോലെ നിങ്ങളും
  rationale: οὕτως മുൻപുള്ള അത്തിവൃക്ഷത്തിന്റെ ഉപമയുമായി വാക്യത്തെ ബന്ധിപ്പിക്കുന്നു; καὶ ὑμεῖς ശിഷ്യന്മാരെ അതിനോട് ചേർത്തു ഊന്നിപ്പറയുന്നു. ‘അതുപോലെ നിങ്ങളും’ ഈ ബന്ധവും ഊന്നലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὅταν ἴδητε
  choice: കാണുമ്പോൾ
  rationale: ὅταν + aorist subjunctive ഭാവിയിലെ ഒരു സാഹചര്യം സൂചിപ്പിക്കുന്നു. ഈ പ്രവചനസന്ദർഭത്തിൽ ‘കാണുമ്പോൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ταῦτα γινόμενα
  choice: ഇവ സംഭവിക്കുന്നത്
  rationale: ταῦτα എന്ന ബഹുവചനത്തെ ‘ഇവ’ എന്നു നിലനിർത്തുന്നു; γινόμενα സംഭവങ്ങൾ നടന്നുവരുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സംഭവിക്കുന്നത്’ വ്യക്തമായ ആധുനിക പ്രയോഗമാണ്.
- source_word: γινώσκετε
  choice: അറിയുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം അടയാളങ്ങൾ കണ്ടു ശരിയായ നിഗമനത്തിലെത്താൻ ആവശ്യപ്പെടുന്നു. ‘അറിയുക’ നേരിട്ടുള്ള ആജ്ഞാഭാവം സൂക്ഷിക്കുന്നു.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: അത് അടുത്ത് ... എത്തിയിരിക്കുന്നുവെന്ന്
  rationale: ഗ്രീക്കിൽ ἐστιν എന്ന ക്രിയയ്ക്ക് വ്യക്തമായ കർത്താവില്ല. വരാനിരിക്കുന്ന സംഭവം അല്ലെങ്കിൽ പൂർത്തീകരണം അടുത്തുവെന്ന പൊതുവായ അർഥത്തിൽ ‘അത്’ ചേർക്കുന്നു; ‘അവൻ’ എന്ന വ്യക്തിപരമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ θύραις
  choice: വാതിലുകൾക്കരികെ
  rationale: θύραις എന്ന ബഹുവചനം നിലനിർത്തുകയും അത്യന്തം സമീപസ്ഥിതിയെന്ന പ്രയോഗാർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു. ‘വാതിലുകൾക്കരികെ എത്തിയിരിക്കുന്നു’ മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി എത്തിക്കുന്നു.
theological_decisions:
- issue: ἐστιν (‘അടുത്താണ്’) എന്നതിന്റെ പരാമർശിക്കാത്ത കർത്താവ്
  choice: പ്രധാന പാഠത്തിൽ സംഭവത്തെയോ വരാനിരിക്കുന്ന പൂർത്തീകരണത്തെയോ സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘അത്’ ഉപയോഗിക്കുക.
  alternative: ‘അവൻ അടുത്ത്, വാതിലുകൾക്കരികെ എത്തിയിരിക്കുന്നു’ എന്നു വ്യക്തിപരമായി വിവർത്തനം ചെയ്യുക.
  rationale: മൂലഗ്രീക്ക് കർത്താവിനെ വ്യക്തമാക്കുന്നില്ല. ‘അത്’ എന്നത് പാഠം പറയുന്നതിലധികം നിർണയിക്കാതെ അവ്യക്തത നിലനിർത്തുന്നു; മനുഷ്യപുത്രനോടു ബന്ധിപ്പിക്കുന്ന ‘അവൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അത്തിവൃക്ഷത്തിന്റെ ഉപമയുമായുള്ള ബന്ധം, ബഹുവചനമായ ‘വാതിലുകൾ,’ കർത്താവിന്റെ യഥാർഥ അവ്യക്തത എന്നിവ സംരക്ഷിച്ചിരിക്കുന്നു.
