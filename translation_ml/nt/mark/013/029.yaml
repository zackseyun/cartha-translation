- from: അതുപോലെ നിങ്ങളും, ഇവ സംഭവിക്കുന്നതു കാണുമ്പോൾ, അത് അടുത്ത്, വാതിലുകൾക്കരികെ എത്തിയിരിക്കുന്നുവെന്ന് അറിയുക.[a]
  to: അതുപോലെ നിങ്ങളും, ഇവ സംഭവിച്ചുകൊണ്ടിരിക്കുന്നത് കാണുമ്പോൾ, അത് അടുത്താണെന്നും വാതിലുകൾക്കൽ തന്നെയാണെന്നും അറിയുക.[a]
  rationale: The revision removes the unsupported perfective sense of ‘has arrived,’ improves Malayalam idiom, and preserves the source text’s unstated subject. It also retains the plural ‘വാതിലുകൾ’ and aligns the footnote’s personal alternative with the revised main-text wording.
