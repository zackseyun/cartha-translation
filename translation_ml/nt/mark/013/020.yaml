id: MRK.13.20
reference: Mark 13:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: ml
  text: കർത്താവ് ആ ദിവസങ്ങൾ ചുരുക്കിയിരുന്നില്ലെങ്കിൽ, ഒരു മനുഷ്യനും രക്ഷിക്കപ്പെടുമായിരുന്നില്ല.[a] എന്നാൽ താൻ തിരഞ്ഞെടുത്തവരായ തിരഞ്ഞെടുക്കപ്പെട്ടവർക്കുവേണ്ടി അവൻ ആ ദിവസങ്ങൾ ചുരുക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ആരും.” അക്ഷരാർഥം: “സകല ജഡവും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: ചുരുക്കി
  rationale: ദിവസങ്ങളുടെ ദൈർഘ്യം കുറയ്ക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പരിഭാഷ നിലനിർത്തി.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന ദൈവിക അഭിസംബോധനയ്ക്കുള്ള സ്ഥാപിതവും മാന്യവുമായ മലയാളപദം.
- source_word: τὰς ἡμέρας
  choice: ആ ദിവസങ്ങൾ
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച കഷ്ടകാലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ നിർദ്ദേശകമായ ‘ആ’ ചേർത്തത് സ്വാഭാവികമാണ്; കാലഘട്ടത്തെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: οὐκ ἂν ἐσώθη
  choice: രക്ഷിക്കപ്പെടുമായിരുന്നില്ല
  rationale: ἄν ഉൾപ്പെടുന്ന സംഭവിക്കാത്ത നിബന്ധനാഫലം സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ജീവൻ നിലനിർത്തപ്പെടുക എന്നതാണ് ഉടനെയുള്ള അർഥമെങ്കിലും σῴζωയുടെ ‘രക്ഷിക്കുക’ എന്ന പദശക്തി നിലനിർത്തുന്നു.
- source_word: πᾶσα σάρξ
  choice: ഒരു ജഡവും
  rationale: നിഷേധവാക്യത്തിൽ ‘ഒരു ജഡവും’ എന്നത് ‘no flesh’ എന്ന ബൈബിൾപ്രയോഗത്തിന്റെ രൂപകത്വവും ഗൗരവവും നിലനിർത്തുന്നു; വ്യക്തമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവർക്കുവേണ്ടി
  rationale: διά + accusative ഇവിടെ അവരുടെ നിമിത്തം/നന്മയ്ക്കായി എന്ന ആശയം നൽകുന്നു; ‘വേണ്ടി’ സ്വാഭാവികമായി അത് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκλεκτούς
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  rationale: തിരഞ്ഞെടുപ്പ് സംബന്ധിച്ച പ്രത്യേക സഭാപരമായ വ്യാഖ്യാനം ചേർക്കാതെ ഗ്രീക്ക് പദത്തിന്റെ അർഥം സുതാര്യമായി നൽകുന്നു.
- source_word: οὓς ἐξελέξατο
  choice: താൻ തിരഞ്ഞെടുത്ത
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു; ‘തിരഞ്ഞെടുക്കപ്പെട്ടവർ’ എന്ന നാമരൂപത്തോടുള്ള അനാവശ്യ ആവർത്തനം ഭാഗികമായി ലഘൂകരിക്കാൻ ‘തിരഞ്ഞെടുത്ത’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ‘രക്ഷിക്കപ്പെടുക’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘രക്ഷിക്കപ്പെടുക’ നിലനിർത്തി; ഉടനെയുള്ള സന്ദർഭത്തിൽ മനുഷ്യജീവൻ നാശത്തിൽനിന്ന് സംരക്ഷിക്കപ്പെടുന്നതാണ് മുൻനിലയിൽ.
  alternative: ‘ജീവനോടെ ശേഷിക്കുക’ അല്ലെങ്കിൽ ‘അതിജീവിക്കുക’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക.
  rationale: കഷ്ടദിവസങ്ങൾ ചുരുക്കുന്നതും മനുഷ്യർ നശിച്ചുപോകാതിരിക്കുന്നതുമാണ് സന്ദർഭം. എങ്കിലും σῴζωയുടെ വിശാലമായ പദശക്തി ചുരുക്കാതിരിക്കാൻ ‘രക്ഷിക്കപ്പെടുക’ നിലനിർത്തുന്നു.
- issue: ‘തിരഞ്ഞെടുക്കപ്പെട്ടവർ’ ആരെന്നത്
  choice: വാക്യം നൽകുന്ന വിശേഷണം അതേപടി നിലനിർത്തി; തിരഞ്ഞെടുപ്പിന്റെ സ്വഭാവത്തെക്കുറിച്ച് കൂടുതൽ നിർവചിച്ചില്ല.
  alternative: കൂട്ടായ തിരഞ്ഞെടുപ്പോ വ്യക്തിഗത മുൻനിശ്ചയമോ എന്ന ഏതെങ്കിലും പ്രത്യേക ദൈവശാസ്ത്രവായന വ്യക്തമാക്കുക.
  rationale: ദൈവം തിരഞ്ഞെടുത്ത ഒരു ജനത്തെ വാക്യം പരാമർശിക്കുന്നു; എന്നാൽ തിരഞ്ഞെടുപ്പിനെക്കുറിച്ചുള്ള വിശാലമായ തർക്കങ്ങൾ ഈ വാക്യം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും മനസ്സിലാകുന്ന ശൈലി. ‘ഒരു ജഡവും’ എന്ന ബൈബിൾസവിശേഷമായ പ്രയോഗം മൂലപാഠത്തിന്റെ ദൃശ്യശക്തിക്കായി നിലനിർത്തി, സാധാരണ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. ‘തിരഞ്ഞെടുക്കപ്പെട്ട തിരഞ്ഞെടുക്കപ്പെട്ടവർ’ പോലുള്ള ആവർത്തനം ഒഴിവാക്കി; ‘താൻ തിരഞ്ഞെടുത്ത തിരഞ്ഞെടുക്കപ്പെട്ടവർ’ എന്ന ഘടന ഗ്രീക്കിലെ പദബന്ധവും ഊന്നലും സംരക്ഷിക്കുന്നു.
