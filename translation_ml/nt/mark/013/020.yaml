revisions:
- from: കർത്താവ് ആ ദിവസങ്ങൾ ചുരുക്കിയില്ലായിരുന്നെങ്കിൽ, ഒരു ജഡവും രക്ഷിക്കപ്പെടുമായിരുന്നില്ല.[a] എന്നാൽ താൻ തിരഞ്ഞെടുത്ത തിരഞ്ഞെടുക്കപ്പെട്ടവർക്കുവേണ്ടി അവിടുന്ന് ആ ദിവസങ്ങൾ ചുരുക്കി.
