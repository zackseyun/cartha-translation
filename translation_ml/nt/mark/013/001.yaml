id: MRK.13.1
reference: Mark 13:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: ml
  text: 'അവൻ ദേവാലയസമുച്ചയത്തിൽനിന്ന്[a] പുറത്തേക്കു പോകുമ്പോൾ, അവന്റെ ശിഷ്യന്മാരിൽ ഒരാൾ അവനോട് പറയുന്നു: “ഗുരുവേ, നോക്കൂ! എത്ര വിസ്മയകരമായ കല്ലുകൾ! എത്ര വിസ്മയകരമായ കെട്ടിടങ്ങൾ!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ ἱερόν എന്ന പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദേവാലയസമുച്ചയത്തെയോ അതിന്റെ പരിസരത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “എത്ര വലിയ കല്ലുകൾ! എത്ര വലിയ കെട്ടിടങ്ങൾ!” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് വിശേഷണം ആശ്ചര്യമോ പ്രശംസയോ പ്രകടിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: അവൻ ... പുറത്തേക്കു പോകുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തോടുകൂടിയ genitive absolute, മുഖ്യസംഭവത്തോടൊപ്പം പുരോഗമിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമായി അതു നിലനിർത്തുന്നു.
- source_word: τοῦ ἱεροῦ
  choice: ദേവാലയസമുച്ചയത്തിൽനിന്ന്
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രം അല്ല, മുഴുവൻ ദേവാലയപരിസരവും കെട്ടിടസമുച്ചയവും സൂചിപ്പിക്കുന്നു; തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ വിശാലമായ അർഥം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം ഭൂതകാലത്തിലേക്കു മിനുക്കാതെ നിലനിർത്തുന്നു.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരിൽ ഒരാൾ
  rationale: ഭാഗസൂചക പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: അഭിസംബോധനയായ ‘Teacher’ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἴδε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞാരൂപം; ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: ποταποὶ ... καὶ ποταπαὶ
  choice: എത്ര വിസ്മയകരമായ ... എത്ര വിസ്മയകരമായ ...
  rationale: ποταπός ഇവിടെ ഗുണത്തെയോ തരത്തെയോ കുറിച്ചുള്ള ആശ്ചര്യവും പ്രശംസയും പ്രകടിപ്പിക്കുന്നു; ആവർത്തനം മൂലപാഠത്തിലെ സമാന്തര ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: λίθοι
  choice: കല്ലുകൾ
  rationale: ദേവാലയനിർമാണത്തിലെ കല്ലുകളെ സൂചിപ്പിക്കുന്ന ലളിതവും നേരിട്ടുമായ പദം.
- source_word: οἰκοδομαί
  choice: കെട്ടിടങ്ങൾ
  rationale: ദേവാലയസമുച്ചയത്തിലെ വിവിധ നിർമിതികളെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ പദം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ മാന്യമായ മലയാളം. മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം ‘പറയുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി. ആശ്ചര്യത്തിന്റെ സ്വരം മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ഗാരവാക്യങ്ങളിലൂടെ പ്രകടിപ്പിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
