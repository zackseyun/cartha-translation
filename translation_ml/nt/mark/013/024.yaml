lexical_decisions:
- source_word: Ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തോടുള്ള ശക്തമായ വൈരുധ്യവും പുതിയ ഘട്ടത്തിലേക്കുള്ള മാറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ആ നാളുകളിൽ
  rationale: ഗ്രീക്കിലെ കാലസൂചക പ്രയോഗവും അതിന്റെ അന്ത്യകാലസംബന്ധിയായ ഭാവവും ചുരുക്കത്തോടെയും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: ആ കഷ്ടതയ്ക്കുശേഷം
  rationale: μετάയുടെ കാലാർഥമായ ‘ശേഷം’ എന്നും demonstrative ആയ ἐκείνηνന്റെ വ്യക്തതയും നിലനിർത്തുന്നു. θλῖψις സൂചിപ്പിക്കുന്ന ദുരിതം, സമ്മർദം, പീഡനം എന്നീ അർഥവ്യാപ്തികൾക്കു ‘കഷ്ടത’ സ്വാഭാവികവും മതവിഭാഗപരമായ വ്യാഖ്യാനം ചുമത്താത്തതുമായ പദമാണ്.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: സൂര്യൻ ഇരുണ്ടുപോകും
  rationale: ഭാവികാലത്തെ വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി ആകാശീയ ഇരുട്ടിനെ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു. ഗ്രീക്കിലെ രൂപം passive ആണെങ്കിലും ‘ഇരുട്ടാക്കപ്പെടും’ ഇവിടെ അസ്വാഭാവികവും അനാവശ്യമായി പ്രവർത്തകനെ മുൻനിർത്തുന്നതുമാകും.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: ചന്ദ്രൻ തന്റെ വെളിച്ചം നൽകുകയുമില്ല
  rationale: δίδωμι എന്ന ‘നൽകുക’ എന്ന ദൃശ്യഭാഷ നിലനിർത്തുന്നു; φέγγος എന്നത് സന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘വെളിച്ചം’ എന്നാണ്.
theological_decisions:
- issue: അന്ത്യകാലപ്രഭാഷണത്തിൽ θλῖψις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കഷ്ടത
  alternative: ദുരിതം; പീഡനം
  rationale: ‘കഷ്ടത’ സന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; അതേസമയം ഒരു പ്രത്യേക അന്ത്യകാലക്രമമോ മതവിഭാഗപരമായ സാങ്കേതിക അർഥമോ വാചകത്തിൽ ചേർക്കുന്നില്ല. മറ്റു സാധുവായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: σκοτισθήσεται എന്ന passive രൂപത്തിന്റെ മലയാളാവിഷ്കാരം
  choice: ഇരുണ്ടുപോകും
  alternative: ഇരുട്ടാക്കപ്പെടും
  rationale: ‘ഇരുണ്ടുപോകും’ ആകാശീയ അടയാളത്തിന്റെ അർഥം വ്യക്തവും ഗൗരവപൂർണവുമായി നൽകുന്നു. ‘ഇരുട്ടാക്കപ്പെടും’ രൂപപരമായി കൂടുതൽ അടുത്തതാണെങ്കിലും ആധുനിക മലയാളത്തിൽ കൃത്രിമമായി കേൾക്കുകയും വാചകം വ്യക്തമാക്കാത്ത ഒരു പ്രവർത്തകനെ ഊന്നിപ്പറയുകയും ചെയ്യാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവപൂർണവുമായ ശൈലി. അന്ത്യകാല ദൃശ്യഭാഷയുടെ തീവ്രത നിലനിർത്തിയിട്ടുണ്ടെങ്കിലും മതവിഭാഗപരമായ സാങ്കേതിക പദാവലി ഒഴിവാക്കിയിരിക്കുന്നു. വായനാസൗകര്യത്തിനായി രണ്ട് സമാന്തര ആകാശീയ അടയാളങ്ങൾ അർധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചിരിക്കുന്നു.
