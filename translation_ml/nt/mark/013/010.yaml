  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰς πάντα τὰ ἔθνη ⸂πρῶτον δεῖ⸃ κηρυχθῆναι τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: ml
  text: സുവാർത്ത ആദ്യം സകല ജനതകളോടും പ്രസംഗിക്കപ്പെടേണ്ടതാണ്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നല്ല വാർത്ത.’ ഗ്രീക്കിലെ εὐαγγέλιον എന്ന പദത്തിന്റെ അക്ഷരാർഥം ‘നല്ല വാർത്ത’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സകല ജനതകളുടെയിടയിലും’; ചില സന്ദർഭങ്ങളിൽ ἔθνη എന്നതിന് ‘വിജാതീയർ’ എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: വാക്യാരംഭത്തിലെ ബന്ധം പ്രത്യേകം പദമായി പരിഭാഷപ്പെടുത്താതെ സ്വാഭാവികമായ തുടർച്ചയായി സൂചിപ്പിച്ചു
  rationale: ഗ്രീക്കിലെ καὶ മുൻവാക്യത്തോടുള്ള തുടർച്ച കാണിക്കുന്നു. മലയാളത്തിൽ ഇവിടെ ‘കൂടാതെ’ അല്ലെങ്കിൽ ‘എന്നാൽ’ ചേർത്താൽ അനാവശ്യമായ ഊന്നലോ വിരുദ്ധഭാവമോ ഉണ്ടാകാം; അതിനാൽ ബന്ധം സ്വാഭാവിക വാക്യത്തുടർച്ചയിൽ നിലനിർത്തി.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: സകല ജനതകളോടും
  rationale: εἰς എന്നത് ഇവിടെ പ്രഖ്യാപനത്തിന്റെ ദിശയെയോ വ്യാപ്തിയെയോ സൂചിപ്പിക്കുന്നു; ‘-ഓടും’ മലയാളത്തിൽ സന്ദേശം അഭിമുഖീകരിക്കുന്ന സമൂഹങ്ങളെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ἔθνη എന്നതിന്റെ ദേശീയ-ജനവിഭാഗ വ്യാപ്തി ‘ജനതകൾ’ നിലനിർത്തുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: കാലക്രമത്തിലെ മുൻഗണന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; തുടർന്നുള്ള സംഭവക്രമത്തെ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: δεῖ
  choice: പ്രസംഗിക്കപ്പെടേണ്ടതാണ്
  rationale: ‘-പ്പെടേണ്ടതാണ്’ അനിവാര്യത വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ആ അനിവാര്യതയുടെ ഉറവിടം ദൈവികമാണെന്ന് വാക്യം തുറന്നു പറയാത്തതിനാൽ അത് വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
- source_word: κηρυχθῆναι
  choice: പ്രസംഗിക്കപ്പെടുക
  rationale: പൊതുവായി സന്ദേശം വിളംബരം ചെയ്യുന്നതാണ് ക്രിയയുടെ അർഥം. ‘പ്രസംഗിക്കുക’ മലയാള ബൈബിൾ-സഭാ ഉപയോഗത്തിൽ പരിചിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാണ്; കർമണിപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: τὸ εὐαγγέλιον
  choice: സുവാർത്ത
  rationale: εὐαγγέλιον എന്നതിന്റെ ‘നല്ല വാർത്ത’ എന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായ സ്ഥാപിത മലയാളപദമായ ‘സുവാർത്ത’ നൽകുന്നു.
theological_decisions:
- issue: ἔθνη എന്നതിന്റെ വ്യാപ്തി
  choice: സകല ജനതകളോടും
  alternative: സകല ജാതികളുടെയിടയിലും / സകല വിജാതീയരോടും
  rationale: ἔθνη ജനതകളെയോ ചില സന്ദർഭങ്ങളിൽ വിജാതീയരെയോ സൂചിപ്പിക്കാം. ഇവിടെ ആഗോള വ്യാപ്തി നിലനിർത്തുകയും യഹൂദർ-വിജാതീയർ എന്ന പരിമിത വ്യത്യാസം വാക്യത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: δεῖ സൂചിപ്പിക്കുന്ന അനിവാര്യത
  choice: പ്രസംഗിക്കപ്പെടേണ്ടതാണ്
  alternative: പ്രസംഗിക്കപ്പെടുന്നത് അനിവാര്യമാണ്
  rationale: അനിവാര്യതയുടെ ശക്തി നിലനിർത്തുന്നു; എന്നാൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ ഉറവിടം വാക്യത്തിൽ തുറന്നു പറയാത്തതിനാൽ വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സുവാർത്ത’, ‘പ്രസംഗിക്കപ്പെടേണ്ടതാണ്’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ച് മൂലത്തിലെ പൊതു പ്രഖ്യാപനവും അനിവാര്യതയും നിലനിർത്തി. ‘സകല ജനതകളോടും’ എന്ന പ്രയോഗം ദിശയും ആഗോള വ്യാപ്തിയും പ്രകടമാക്കുന്നു; പകരംവായനകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
