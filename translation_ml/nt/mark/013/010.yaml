  source_fidelity: ഗ്രീക്കിലെ χρονക്രമസൂചകമായ πρῶτον (‘ആദ്യം’), അനിവാര്യതയായ δεῖ (‘പ്രസംഗിക്കപ്പെടേണ്ടതാണ്’), κηρυχθῆναι-യുടെ കർമണിപ്രയോഗം, εἰς πάντα τὰ ἔθνη-യുടെ സാർവത്രിക ജനതാവ്യാപ്തി എന്നിവ വിവർത്തനം വിശ്വസ്തമായി നിലനിർത്തുന്നു. വാക്യാരംഭത്തിലെ καὶ മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ പ്രത്യേക പദമില്ലാതെ വിട്ടത് അർഥനഷ്ടമുണ്ടാക്കുന്നില്ല.
  naturalness: ‘സുവാർത്ത ആദ്യം സകല ജനതകളോടും പ്രസംഗിക്കപ്പെടേണ്ടതാണ്’ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ പ്രയോഗമാണ്. ‘സകല’യും ‘പ്രസംഗിക്കപ്പെടേണ്ടതാണ്’യും അല്പം ഔപചാരിക ശൈലിയാണെങ്കിലും ഈ സന്ദർഭത്തിലെ തിരുവെഴുത്തു രജിസ്റ്ററിന് യോജിച്ചതാണ്.
  terminology: ‘സുവാർത്ത’ εὐαγγέλιον-ന് സ്ഥാപിതവും അർഥസുതാര്യവുമായ മലയാള സമാനപദമാണ്. ‘ജനതകൾ’ ἔθνη-യുടെ ദേശീയ/ജനവിഭാഗപരമായ വ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു; അതിനെ അനാവശ്യമായി ‘വിജാതീയർ’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല. അടിക്കുറിപ്പുകൾ ‘നല്ല വാർത്ത,’ ‘ജനതകളുടെയിടയിൽ,’ ‘വിജാതീയർ’ എന്നീ യുക്തിസഹമായ പകരം സാധ്യതകൾ രേഖപ്പെടുത്തുന്നു.
