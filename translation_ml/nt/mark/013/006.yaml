source:
  edition: SBLGNT
  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: ml
  text: പലരും എന്റെ നാമത്തിൽ വന്ന്, ‘ഞാൻ തന്നെയാണ്’[a] എന്നു പറയും; അവർ പലരെയും വഴിതെറ്റിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഞാൻ ആകുന്നു.’ ഗ്രീക്കിൽ വിധേയപദം വ്യക്തമായി പറഞ്ഞിട്ടില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: പലരും
  rationale: വിശേഷണം നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, അനിശ്ചിതമായ ഒരു വലിയ കൂട്ടം ആളുകളെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐλεύσονται
  choice: വന്ന്
  rationale: ഭാവികാലക്രിയയുടെ അർഥം തുടർന്നുള്ള ‘പറയും’ എന്ന ക്രിയയോടു ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായ ഭാവികാല ക്രിയാശൃംഖലയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ പേര് അവകാശപ്പെട്ടോ ആ പേരുമായുള്ള ബന്ധമോ അധികാരമോ ഉന്നയിച്ചോ വരുന്നതെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പരിധി നിലനിർത്തുന്ന പതിവായ മലയാളരൂപം.
- source_word: λέγοντες
  choice: എന്നു പറയും
  rationale: വരുന്നതിനോടൊപ്പമുള്ള പ്രസ്താവനയെ വ്യാഖ്യാനഭാരം ചേർക്കാതെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ὅτι Ἐγώ εἰμι
  choice: ‘ഞാൻ തന്നെയാണ്’[a]
  rationale: ഗ്രീക്കിൽ വിധേയപദം വ്യക്തമാക്കിയിട്ടില്ല. ‘തന്നെയാണ്’ എന്ന രൂപം സ്വയം തിരിച്ചറിയിക്കുന്ന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുമ്പോഴും ആരാണ് അല്ലെങ്കിൽ എന്താണ് എന്നത് പാഠത്തിൽ ചേർത്തു തീർപ്പാക്കുന്നില്ല; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πολλοὺς
  choice: പലരെയും
  rationale: ക്രിയയുടെ കർമമായി വരുന്ന അനിശ്ചിതമായ അനേകം ആളുകളെ കൃത്യമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: πλανήσουσιν
  choice: വഴിതെറ്റിക്കും
  rationale: സത്യത്തിൽനിന്നോ ശരിയായ വഴിയിൽനിന്നോ തെറ്റിച്ചുകൊണ്ടുപോകുക എന്ന πλανάωയുടെ രൂപകാത്മക ശക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: വ്യാജ അവകാശവാദികളുടെ പശ്ചാത്തലത്തിൽ Ἐγώ εἰμι എന്നതിന്റെ പരിഭാഷ
  choice: ഞാൻ തന്നെയാണ്
  alternative: ഞാൻ ആകുന്നു
  rationale: സന്ദർഭം ഒരു സ്വയംതിരിച്ചറിയിക്കൽ അവകാശവാദത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം വിധേയപദം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ‘ഞാൻ അവനാണ്’ എന്നിങ്ങനെ ഒരു നിർദിഷ്ട വിധേയപദം ചേർക്കാതെ, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപം മുഖ്യപാഠത്തിലും കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിലും നൽകുന്നു; ഇതിലൂടെ പാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ തുറന്ന നിലയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. ‘നാമത്തിൽ’ എന്ന ബൈബിൾപരിചിത പ്രയോഗവും ‘വഴിതെറ്റിക്കും’ എന്ന സജീവ രൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
