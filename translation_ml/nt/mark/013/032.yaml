  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: ml
  text: “എന്നാൽ, ആ ദിവസത്തെക്കുറിച്ചോ ആ മണിക്കൂറിനെക്കുറിച്ചോ ആർക്കും അറിയില്ല—സ്വർഗത്തിലെ ദൂതന്മാർക്കുപോലും, പുത്രന്നുപോലും; പിതാവിന് മാത്രമേ അറിയൂ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുത്രന്നുപോലും’ എന്നത് പുത്രന്റെ അവതാരദൗത്യത്തെയോ മനുഷ്യസ്വഭാവത്തെയോ സംബന്ധിച്ചാണെന്ന് ചില വ്യാഖ്യാതാക്കൾ മനസ്സിലാക്കുന്നു. ആ വിശദീകരണം പ്രധാനവാചകത്തിൽ ചേർക്കാതെ ഗ്രീക്കുപാഠത്തിന്റെ വാക്കുകൾ പരിഭാഷ നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: എന്നാൽ ... കുറിച്ച്
  rationale: περί + genitive വിഷയത്തെ അവതരിപ്പിക്കുന്നു; δέ മുൻവാക്യങ്ങളിൽനിന്നുള്ള മൃദുവായ മാറ്റമോ വൈരുധ്യമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എന്നാൽ ... കുറിച്ച്’ ഇവ രണ്ടും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: ആ ദിവസത്തെയോ ആ മണിക്കൂറിനെയോ
  rationale: രണ്ട് സമയസൂചനകളുടെയും വേർതിരിവും ആവർത്തിച്ചിരിക്കുന്ന നിർദേശകഭാവവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐδεὶς οἶδεν
  choice: ആരും അറിയുന്നില്ല
  rationale: οἶδα രൂപത്തിൽ perfect ആയിരുന്നാലും ഇവിടെ വർത്തമാനകാല അർഥമായ ‘അറിയുന്നു’ എന്നതാണ്; നിഷേധത്തോടുകൂടിയ മലയാളപ്രയോഗം ‘ആരും അറിയുന്നില്ല’ സ്വാഭാവികമാണ്.
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: സ്വർഗത്തിലുള്ള ദൂതന്മാരും അറിയുന്നില്ല
  rationale: οὐδέ നിഷേധപരമ്പര ശക്തമായി തുടരുന്നു; ἐν οὐρανῷ ദൂതന്മാരുടെ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
- source_word: οὐδὲ ὁ υἱός
  choice: പുത്രനും അറിയുന്നില്ല
  rationale: ഗ്രീക്കിലെ വ്യക്തവും ദൈവശാസ്ത്രപരമായി സംഘർഷമുള്ളതുമായ പ്രസ്താവന മയപ്പെടുത്താതെയും വിശദീകരണം ചേർക്കാതെയും നിലനിർത്തുന്നു; ‘പുത്രൻ’ പദവി തന്നെയാണ് ഉപയോഗിച്ചത്.
- source_word: εἰ μὴ ὁ πατήρ
  choice: പിതാവുമാത്രം അറിയുന്നു
  rationale: മുൻ നിഷേധത്തിനു ശേഷമുള്ള ഏക അപവാദത്തെ εἰ μή സൂചിപ്പിക്കുന്നു; ‘മാത്രം’ പ്രത്യേകത വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദിവസമോ മണിക്കൂറോ പുത്രൻ അറിയുന്നില്ലെന്ന ക്രിസ്തുശാസ്ത്രപരമായ പ്രസ്താവന
  choice: ‘പുത്രനും അറിയുന്നില്ല’ എന്ന മൂലപാഠത്തിന്റെ നേരായ അർഥം പ്രധാനവാചകത്തിൽ നിലനിർത്തി.
  alternative: ‘മനുഷ്യസ്വഭാവത്തിൽ’ അല്ലെങ്കിൽ ‘അവതാരദൗത്യത്തിൽ’ എന്ന വ്യാഖ്യാനപരമായ യോഗ്യത പ്രധാനവാചകത്തിൽ ചേർക്കുക.
  rationale: SBLGNT പാഠത്തിൽ οὐδὲ ὁ υἱός വ്യക്തമായി ഉൾപ്പെട്ടിരിക്കുന്നു. യഥാർഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിക്കാതെ, സാധ്യമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ നിഷേധപരമ്പര മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ക്രിയ ആവർത്തിച്ച് നൽകി; ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം പ്രധാനവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
