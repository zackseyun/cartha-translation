  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: ml
  text: അപ്പോൾ അവൻ ദൂതന്മാരെ അയക്കുകയും തിരഞ്ഞെടുക്കപ്പെട്ടവരെ[a] നാലു കാറ്റുകളിൽനിന്ന്[b]—ഭൂമിയുടെ അറ്റംമുതൽ ആകാശത്തിന്റെ അറ്റംവരെ[c]—ഒരുമിച്ചുകൂട്ടുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘വൃതന്മാരെ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നാലു കാറ്റുകൾ’ എന്നത് എല്ലാ ദിക്കുകളെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: അവസാനഭാഗം കൂടുതൽ വ്യാഖ്യാനപരമായി ‘ഭൂമിയുടെ ഏറ്റവും അകലെയുള്ള അറ്റംമുതൽ ആകാശത്തിന്റെ ഏറ്റവും അകലെയുള്ള അറ്റംവരെ’ എന്നോ ‘ആകാശത്തിന്റെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ’ എന്നോ പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: അന്ത്യകാലപ്രഭാഷണത്തിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന കാലസൂചക ക്രിയാവിശേഷണത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ἀποστελεῖ
  choice: അയച്ച്
  rationale: പ്രധാന ഭാവിക്രിയയായ ‘ഒരുമിച്ചുകൂട്ടും’ എന്നതിനോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ദൂതന്മാരെ നിയോഗിച്ച് അയയ്ക്കുന്നതെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἀγγέλους
  choice: ദൂതന്മാരെ
  rationale: ഈ അന്ത്യകാലസന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരേക്കാൾ സ്വർഗീയ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπισυνάξει
  choice: ഒരുമിച്ചുകൂട്ടും
  rationale: ചിതറിക്കിടക്കുന്നവരെ ഒരു ഇടത്തേക്ക് കൂട്ടിച്ചേർക്കുക എന്ന ἐπισυνάγωയുടെ ശക്തി വ്യക്തമായി പകരുന്നു.
- source_word: ἐκλεκτούς
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവരെ
  rationale: ദൈവത്താൽ തിരഞ്ഞെടുക്കപ്പെട്ടവരെന്ന അർഥം സുതാര്യമായി നൽകുന്നു; പിൽക്കാല സിദ്ധാന്തവ്യവസ്ഥകളിലെ സാങ്കേതിക പദപ്രയോഗം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: നാലു കാറ്റുകളിൽനിന്ന്
  rationale: എല്ലാ ദിക്കുകളിൽനിന്നും എന്ന അർഥമുള്ള ബൈബിൾപ്രതീകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἀπ’ ἄκρου γῆς
  choice: ഭൂമിയുടെ അറ്റംമുതൽ
  rationale: ἄκρον സൂചിപ്പിക്കുന്ന അതിരോ അങ്ങേയറ്റമോ എന്ന സ്ഥലബിംബം നിലനിർത്തുന്നു.
- source_word: ἕως ἄκρου οὐρανοῦ
  choice: ആകാശത്തിന്റെ അറ്റംവരെ
  rationale: മുൻപുള്ള ‘ഭൂമിയുടെ അറ്റം’ എന്ന പ്രയോഗത്തോടുള്ള സമാന്തരതയും സമഗ്രവ്യാപ്തിയുടെ ബിംബവും സംരക്ഷിക്കുന്നു; ഇവിടെ സ്ഥലപരമായ οὐρανός എന്നതിന് ‘ആകാശം’ സ്വാഭാവികമാണ്.
- source_word: καὶ τότε ... καὶ
  choice: അപ്പോൾ ... അയച്ച് ... ഒരുമിച്ചുകൂട്ടും
  rationale: മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ രണ്ടു പ്രവർത്തനങ്ങളുടെ ക്രമവും ബന്ധവും നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ആവർത്തിച്ച καί യാന്ത്രികമായി പകർത്തുന്നില്ല.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിലെ ἐκλεκτούς എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  alternative: വൃതന്മാർ
  rationale: ആരെ തിരഞ്ഞെടുക്കുന്നു, തിരഞ്ഞെടുപ്പിന്റെ സിദ്ധാന്തപരമായ രീതി എന്ത് എന്നിവ വാക്യം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ദൈവിക തിരഞ്ഞെടുപ്പിന്റെ ആശയം നിലനിർത്തിക്കൊണ്ട് പിൽക്കാല മതശാസ്ത്രസങ്കേതമായി ചുരുക്കാതെ സുതാര്യമായ പദം ഉപയോഗിച്ചു.
- issue: കൂട്ടിച്ചേർക്കലിന്റെ ഭൂമിശാസ്ത്രപരവും ആകാശീയവുമായ വ്യാപ്തി
  choice: നാലു കാറ്റുകളിൽനിന്ന്—ഭൂമിയുടെ അറ്റംമുതൽ ആകാശത്തിന്റെ അറ്റംവരെ
  alternative: എല്ലാ ദിക്കുകളിൽനിന്നും / ആകാശത്തിന്റെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ
  rationale: ഗ്രീക്കിലെ ദിക്കുകളെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും ഭൂമി-ആകാശ അതിരുകളെ ചേർത്ത സമഗ്രവ്യാപ്തിയുടെ ബിംബവും വ്യാഖ്യാനപരമായി ലഘൂകരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നാലു കാറ്റുകൾ’ എന്നും ‘ഭൂമിയുടെ അറ്റംമുതൽ ആകാശത്തിന്റെ അറ്റംവരെ’ എന്നും ഉള്ള അപോകലിപ്റ്റിക് ബിംബങ്ങൾ ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു; അവയുടെ അർഥസഹായം അടിക്കുറിപ്പുകളിൽ നൽകി.
