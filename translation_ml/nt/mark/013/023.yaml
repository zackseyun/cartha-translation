  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ βλέπετε· ⸀προείρηκα ὑμῖν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ ജാഗ്രതയോടിരിക്കുക[a]; ഞാൻ എല്ലാം നിങ്ങളോടു മുൻകൂട്ടി പറഞ്ഞിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സൂക്ഷിച്ചുകൊള്ളുക” അല്ലെങ്കിൽ “കരുതിയിരിക്കുക.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഞാൻ എല്ലാം നിങ്ങളോടു നേരത്തേ പറഞ്ഞിട്ടുണ്ട്” അല്ലെങ്കിൽ “ഞാൻ നിങ്ങൾക്കു എല്ലാറ്റിനെക്കുറിച്ചും മുൻകൂട്ടി മുന്നറിയിപ്പ് നൽകിയിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: വ്യക്തമായി ചേർത്തിരിക്കുന്ന ബഹുവചന സർവനാമത്തിന്റെ ഊന്നലും മുൻവാക്യത്തോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള വൈരുധ്യാത്മക മാറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: βλέπετε
  choice: ജാഗ്രതയോടിരിക്കുക
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞയുടെ തുടർച്ചയായ സൂക്ഷ്മതയും മുന്നറിയിപ്പിന്റെ ഭാവവും നൽകുന്നു; അക്ഷരാർഥമായ ‘നോക്കുക’ ഇവിടെ ആശയം വ്യക്തമാക്കില്ല.
- source_word: προείρηκα
  choice: മുൻകൂട്ടി പറഞ്ഞിരിക്കുന്നു
  rationale: മുൻകൂട്ടി പറയുക എന്ന സംയുക്തക്രിയയുടെ അർഥവും ഇപ്പോഴും പ്രസക്തമായ മുൻപ്രസ്താവന സൂചിപ്പിക്കുന്ന പൂർണ്ണകാലഭാവവും നിലനിർത്തുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങളോടു
  rationale: പറയൽക്രിയയുടെ പരോക്ഷ കർമമായ ‘നിങ്ങൾക്ക്/നിങ്ങളോടു’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πάντα
  choice: എല്ലാം
  rationale: ‘സകല കാര്യങ്ങളും/എല്ലാം’ എന്ന സമഗ്രതയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ സന്ദർഭപരിധി വാചകത്തിൽ കൃത്രിമമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ മുന്നറിയിപ്പിന്റെയും മുൻകൂട്ടിയുള്ള വെളിപ്പെടുത്തലിന്റെയും വ്യാപ്തി
  choice: ‘എല്ലാം’ എന്ന സമഗ്രപദം നിലനിർത്തി, അതിന്റെ വ്യാപ്തി സന്ദർഭം നിർണ്ണയിക്കാൻ വിടുന്നു.
  alternative: ‘ഇക്കാര്യങ്ങളെല്ലാം’ എന്നു വിവർത്തനം ചെയ്ത് ഉടൻ മുമ്പുള്ള മുന്നറിയിപ്പുകളിലേക്കു മാത്രം അർഥം ചുരുക്കുക.
  rationale: πάντα സമഗ്രമാണ്; എന്നാൽ എല്ലാ ഭാവിവിശദാംശങ്ങളെയും കുറിച്ചുള്ള സമ്പൂർണ വെളിപ്പെടുത്തൽ എന്നാണ് വാചകം നിർബന്ധമായി പറയുന്നത് എന്നില്ല. അതിനാൽ യഥാർഥമായ സന്ദർഭപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ജാഗ്രതയോടിരിക്കുക’ മുന്നറിയിപ്പിന്റെ അടിയന്തരതയും തുടർച്ചയായ ജാഗ്രതയും അറിയിക്കുന്നു; ‘മുൻകൂട്ടി പറഞ്ഞിരിക്കുന്നു’ മൂലത്തിലെ പൂർണ്ണകാലത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി സൂക്ഷിക്കുന്നു.
