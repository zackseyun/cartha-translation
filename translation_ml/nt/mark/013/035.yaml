id: MRK.13.35
reference: Mark 13:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: ml
  text: അതുകൊണ്ട് ജാഗരൂകരായിരിക്കൂ[a], വീടിന്റെ യജമാനൻ എപ്പോൾ വരുമെന്ന് നിങ്ങൾ അറിയുന്നില്ല—വൈകുന്നേരത്തിലോ, അർധരാത്രിയിലോ, കോഴി കൂവുന്ന നേരത്തോ[b], അല്ലെങ്കിൽ രാവിലെയോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉണർന്നിരിക്കൂ” അല്ലെങ്കിൽ “കാവലോടെ ഇരിക്കൂ.” ജാഗ്രത കൈവിടാതെ സന്നദ്ധരായി തുടരുക എന്ന ആശയമാണ് ആജ്ഞയ്ക്കുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: “കോഴി കൂവുന്ന നേരം” എന്നു പറയുന്നത് കോഴിയുടെ കൂവലുമായി ബന്ധപ്പെടുത്തി തിരിച്ചറിഞ്ഞിരുന്ന രാത്രികാവൽസമയത്തെയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: ജാഗരൂകരായിരിക്കൂ
  rationale: ബഹുവചന ആജ്ഞാരൂപം ഉറങ്ങാതിരിക്കുക എന്ന അക്ഷരാർഥത്തോടൊപ്പം ജാഗ്രതയോടെയും കരുതലോടെയും കാത്തിരിക്കുക എന്ന സന്ദർഭാർഥവും വഹിക്കുന്നു. മലയാളത്തിൽ ഈ രണ്ടു വശങ്ങളും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പുള്ള ഉപദേശത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐκ οἴδατε ... πότε
  choice: എപ്പോൾ ... എന്ന് നിങ്ങൾ അറിയുന്നില്ല
  rationale: അറിയുക എന്ന ക്രിയയുടെ നിഷേധവും പരോക്ഷമായ കാലചോദ്യവും അധിക വിശദീകരണമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: വീടിന്റെ യജമാനൻ
  rationale: ഗൃഹസംബന്ധമായ ദൃഷ്ടാന്തത്തിൽ κύριος സൂചിപ്പിക്കുന്ന അധികാരമുള്ള വീട്ടധിപനെ വ്യക്തമാക്കുന്നു; ഇവിടെ നേരിട്ടുള്ള ദൈവിക സ്ഥാനപ്പേരായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ ‘കർത്താവ്’ ഒഴിവാക്കി.
- source_word: ἔρχεται
  choice: വരും
  rationale: ഗ്രീക്ക് വർത്തമാനരൂപത്തിന് സന്ദർഭത്തിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവിവരവാണ് അർഥം; മലയാളത്തിൽ ‘വരും’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὀψὲ
  choice: വൈകുന്നേരത്തിൽ
  rationale: രാത്രികാവലുകളുടെ ക്രമത്തിൽ ആദ്യത്തെ വൈകുന്നേരസമയത്തെ സൂചിപ്പിക്കുന്നു; അവ്യക്തമായ ‘വൈകി’ എന്നതിനേക്കാൾ കൃത്യമാണ്.
- source_word: μεσονύκτιον
  choice: അർധരാത്രിയിൽ
  rationale: കാലക്രമത്തിലെ അർധരാത്രിയെ നേരിട്ടും സാധാരണ മലയാളത്തിലും പറയുന്നു.
- source_word: ἀλεκτοροφωνίας
  choice: കോഴി കൂവുന്ന നേരത്ത്
  rationale: കോഴിയുടെ കൂവലുമായി ബന്ധപ്പെടുത്തി തിരിച്ചറിഞ്ഞിരുന്ന രാത്രികാവൽസമയത്തെ ആധുനിക വായനക്കാരന് ഉടൻ മനസ്സിലാകുന്ന രീതിയിൽ നൽകുന്നു.
- source_word: πρωΐ
  choice: പുലർച്ചെ
  rationale: രാത്രിയുടെ അവസാന കാവൽ കഴിഞ്ഞ് എത്തുന്ന അതിരാവിലെ സമയത്തെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഗൃഹദൃഷ്ടാന്തത്തിനുള്ളിലെ κύριος എന്ന പദം യേശുവിനെ പരോക്ഷമായി സൂചിപ്പിക്കാമെങ്കിലും വാക്യത്തിൽ വീട്ടധിപനെ സൂചിപ്പിക്കുന്നത്
  choice: വീടിന്റെ യജമാനൻ
  alternative: വീടിന്റെ കർത്താവ് / വീട്ടുടമ
  rationale: ദൃഷ്ടാന്തത്തിന്റെ ഉപരിതലതലത്തിൽ ഇത് വീട്ടിലെ അധികാരമുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സാധാരണ ഗൃഹപ്രയോഗമാണ്. ‘യജമാനൻ’ ആ അധികാരം സംരക്ഷിക്കുകയും ‘കർത്താവ്’ എന്ന നേരിട്ടുള്ള ദൈവിക സ്ഥാനപ്പേരിലേക്കു വാക്യത്തെ അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു; അതേസമയം ദൃഷ്ടാന്തത്തിന്റെ വിശാലമായ ക്രിസ്തുസൂചന നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. നാല് രാത്രിസമയങ്ങളുടെ ക്രമം വ്യക്തമായി നിലനിർത്തി; സാങ്കേതികമായി അപരിചിതമായ ഒരു ഒറ്റപ്പദത്തിനുപകരം ‘കോഴി കൂവുന്ന നേരം’ എന്ന സാധാരണ പ്രയോഗം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
