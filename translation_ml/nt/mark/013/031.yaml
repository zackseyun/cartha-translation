source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ml
  text: ആകാശവും ഭൂമിയും ഒഴിഞ്ഞുപോകും; എന്നാൽ എന്റെ വാക്കുകൾ ഒരിക്കലും ഒഴിഞ്ഞുപോകുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, കൂടുതൽ പരമ്പരാഗതമായി, ‘ഒരിക്കലും കടന്നുപോകുകയില്ല’ അല്ലെങ്കിൽ ‘യാതൊരു വിധത്തിലും ഒഴിഞ്ഞുപോകുകയില്ല.’ ഗ്രീക്കിൽ ഇവിടെ ശക്തമായ നിഷേധപ്രയോഗമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: ആകാശം
  rationale: γῆയോടു ചേർന്ന ‘ആകാശവും ഭൂമിയും’ എന്ന പ്രയോഗത്തിൽ ഇത് ദൃശ്യമായ ആകാശത്തെ മാത്രം അല്ല, സൃഷ്ടലോകത്തിന്റെ ആകാശമണ്ഡലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ആകാശം’ സ്വാഭാവികവും വ്യാപകവുമാണ്.
- source_word: ἡ γῆ
  choice: ഭൂമി
  rationale: ‘ആകാശവും ഭൂമിയും’ എന്ന സ്ഥിരജോടിയിൽ ഒരു പ്രത്യേക ദേശമല്ല, ഭൂമിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: παρελεύσονται
  choice: ഒഴിഞ്ഞുപോകും
  rationale: παρέρχομαι ഇവിടെ ഇല്ലാതാകുക അഥവാ അവസാനിച്ചുപോകുക എന്ന അന്ത്യകാലസംബന്ധിയായ അർഥം വഹിക്കുന്നു. ‘ഒഴിഞ്ഞുപോകും’ ആ അർഥം സ്വാഭാവികമായി നൽകുകയും അതിന്റെ രീതി അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ആകാശഭൂമികളുടെ അസ്ഥിരതയും യേശുവിന്റെ വാക്കുകളുടെ സ്ഥിരതയും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം പ്രകടമാക്കുന്നു.
- source_word: οἱ λόγοι μου
  choice: എന്റെ വാക്കുകൾ
  rationale: യേശുവിന്റെ അരുളപ്പാടുകളെയോ പ്രസ്താവനകളെയോ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: οὐ μὴ παρελεύσονται
  choice: ഒരിക്കലും ഒഴിഞ്ഞുപോകുകയില്ല
  rationale: ഭാവികാലക്രിയയോടുകൂടിയ οὐ μή ശക്തമായ നിഷേധമാണ്. ‘ഒരിക്കലും ... ഇല്ല’ അതിന്റെ ഊന്നൽ വ്യക്തവും സ്വാഭാവികവുമായി മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വാക്കുകളെക്കുറിച്ചുള്ള ഊന്നിയ നിഷേധത്തിന്റെ ശക്തി
  choice: ‘ഒരിക്കലും ഒഴിഞ്ഞുപോകുകയില്ല’ എന്ന് വ്യക്തമായ ഊന്നലോടെ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തീർച്ചയായും ഒഴിഞ്ഞുപോകുകയില്ല’ / ‘യാതൊരു വിധത്തിലും ഒഴിഞ്ഞുപോകുകയില്ല’
  rationale: സൃഷ്ടലോകം ഒഴിഞ്ഞുപോകുന്നതും യേശുവിന്റെ വാക്കുകൾ സ്ഥിരമായി നിലനിൽക്കുന്നതും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം ഗ്രീക്ക് പാഠം പ്രകടമാക്കുന്നു. ‘ഒരിക്കലും’ എന്നത് വ്യാഖ്യാനപരമായ അധികഭാരം ചേർക്കാതെ οὐ μήയുടെ ഉറച്ച നിഷേധം കേൾപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. പരിചിതമായ ‘ആകാശവും ഭൂമിയും’ എന്ന ജോടിയും സമാന്തരമായ ‘ഒഴിഞ്ഞുപോകും/ഒഴിഞ്ഞുപോകുകയില്ല’ എന്ന ഘടനയും മൂലപാഠത്തിന്റെ വൈരുധ്യവും താളവും നിലനിർത്തുന്നു.
