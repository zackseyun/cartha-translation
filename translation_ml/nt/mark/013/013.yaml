id: MRK.13.13
reference: Mark 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ml
  text: എന്റെ നാമം നിമിത്തം എല്ലാവരും നിങ്ങളെ വെറുക്കും. എന്നാൽ അവസാനംവരെ സഹിച്ചുനിൽക്കുന്നവൻ[a] രക്ഷിക്കപ്പെടും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവസാനംവരെ ഉറച്ചുനിൽക്കുന്നവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘വിടുവിക്കപ്പെടും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദത്തിന് ‘വിടുവിക്കപ്പെടും’ എന്നും ‘രക്ഷിക്കപ്പെടും’ എന്നും അർഥമാകാം; സന്ദർഭം അതിന്റെ പൂർണ അർഥവ്യാപ്തി തുറന്നുവെക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: എല്ലാവരും നിങ്ങളെ വെറുക്കും
  rationale: ἔσεσθε ചേർന്ന കർമണി പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തരി വാക്യമായി നൽകി; πάντων എന്നതിന്റെ വ്യാപകത ‘എല്ലാവരും’ എന്നു നിലനിർത്തുന്നു.
- source_word: διὰ τὸ ὄνομά μου
  choice: എന്റെ നാമം നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണം നിലനിർത്തുന്നു; ‘നാമം’ യേശുവിന്റെ വ്യക്തിത്വം, അധികാരം, അവനോടുള്ള ബന്ധം എന്നിവ ഉൾക്കൊള്ളുന്ന ബൈബിൾപ്രയോഗമാണ്.
- source_word: ὁ δὲ ὑπομείνας
  choice: എന്നാൽ ... സഹിച്ചുനിൽക്കുന്നവൻ
  rationale: ὑπομένω എന്നതിലെ സമ്മർദത്തിനിടയിലും ഉറച്ചുനിൽക്കുക/സഹിക്കുക എന്ന അർഥവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς τέλος
  choice: അവസാനംവരെ
  rationale: പരീക്ഷയുടെ അവസാനമോ ജീവിതാവസാനമോ യുഗാന്ത്യമോ എന്നു നിർണയിക്കാതെ മൂലത്തിലെ തുറന്ന അർഥം കാക്കുന്നു.
- source_word: οὗτος
  choice: വാക്യഘടനയിൽ പ്രത്യേകമായി ആവർത്തിച്ചില്ല
  rationale: മൂലത്തിലെ പുനരുക്ത ഊന്നൽ മലയാളത്തിലെ ‘...വൻ’ ഘടനയിൽ മതിയായ രീതിയിൽ പ്രകടമാകുന്നു; ‘അവൻതന്നെ’ എന്നു ചേർത്താൽ അർഥത്തെ അനാവശ്യമായി ശക്തമാക്കാം.
- source_word: σωθήσεται
  choice: രക്ഷിക്കപ്പെടും
  rationale: σῴζω എന്നതിലെ വിടുതലിന്റെയും അന്തിമ രക്ഷയുടെയും അർഥസാധ്യതകൾ പൂർണമായി ചുരുക്കാതെ പരമ്പരാഗതവും വ്യക്തവുമായ പദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: സഹിച്ചുനിൽക്കുന്നതിനെക്കുറിച്ചുള്ള വചനത്തിൽ σωθήσεται എന്നതിന്റെ അർഥം
  choice: രക്ഷിക്കപ്പെടും
  alternative: വിടുവിക്കപ്പെടും
  rationale: വെറും താൽക്കാലിക രക്ഷയിലേക്കോ ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിലെ സ്ഥിരോത്സാഹസിദ്ധാന്തത്തിലേക്കോ വാക്യത്തെ ചുരുക്കാതെ ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും സംഘർഷവും നിലനിർത്തുന്നു.
- issue: πάντων എന്നതിന്റെ വ്യാപ്തി
  choice: എല്ലാവരും
  alternative: എല്ലാ മനുഷ്യരും
  rationale: മൂലത്തിലെ ശക്തമായ സർവവ്യാപക പ്രയോഗം വിശദീകരിച്ച് മൃദുവാക്കാതെ നിലനിർത്തുന്നു; അതിന്റെ സന്ദർഭപരമായ സ്വഭാവം വായനക്കാരൻ ഗ്രഹിക്കാൻ അനുവദിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നാമം നിമിത്തം’ എന്ന ബൈബിൾശൈലി നിലനിർത്തിയെങ്കിലും വാക്യക്രമം സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
