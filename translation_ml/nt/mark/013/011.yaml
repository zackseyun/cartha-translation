id: MRK.13.11
reference: Mark 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: ml
  text: അവർ നിങ്ങളെ കൊണ്ടുപോയി കൈമാറുമ്പോൾ, എന്തു പറയണമെന്നു മുൻകൂട്ടി ഉത്കണ്ഠപ്പെടരുത്. ആ സമയത്ത് നിങ്ങൾക്കു എന്തു നൽകപ്പെടുന്നുവോ അതു പറയുക. എന്തെന്നാൽ, സംസാരിക്കുന്നത് നിങ്ങളല്ല, പരിശുദ്ധാത്മാവാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅταν
  choice: അവർ ... ഏൽപ്പിക്കുമ്പോൾ
  rationale: ὅταν ഭാവിയിലെ പ്രതീക്ഷിക്കപ്പെടുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘-ുമ്പോൾ’ സ്വാഭാവികമായി ആ ബന്ധം നൽകുന്നു; തുടക്കത്തിലെ καί വേർതിരിച്ച് ‘കൂടാതെ’ എന്നു ചേർക്കാതെ പ്രസംഗതുടർച്ചയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: അവർ നിങ്ങളെ കൊണ്ടുപോയി അധികാരികൾക്ക് ഏൽപ്പിക്കുമ്പോൾ
  rationale: ἄγωσιν നിർബന്ധിതമായി കൊണ്ടുപോകുന്നതും παραδιδόντες കസ്റ്റഡിയിലോ വിചാരണയ്ക്കായോ കൈമാറുന്നതും സൂചിപ്പിക്കുന്നു. സന്ദർഭം വ്യക്തമാക്കാൻ ‘അധികാരികൾക്ക്’ ചേർത്തിരിക്കുന്നു; ഇത് ഗ്രീക്കിൽ പരോക്ഷമായി ഉദ്ദേശിക്കപ്പെട്ട ലക്ഷ്യമാണ്, ദ്രോഹം എന്ന കൂടുതൽ ഇടുങ്ങിയ അർഥം ഒഴിവാക്കുന്നു.
- source_word: μὴ προμεριμνᾶτε
  choice: മുൻകൂട്ടി ഉത്കണ്ഠപ്പെടരുത്
  rationale: προ-യിലെ ‘മുൻകൂട്ടി’ എന്ന കാലസൂചനയും μεριμνάωയിലെ ആശങ്ക/ഉത്കണ്ഠയും നിലനിർത്തുന്നു.
- source_word: τί λαλήσητε
  choice: എന്തു പറയണമെന്ന്
  rationale: λαλέω ഇവിടെ സാധാരണയായി പറയുക/സംസാരിക്കുക എന്ന അർഥത്തിലാണ്. ‘എന്തു സംസാരിക്കണമെന്ന്’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: നിങ്ങൾക്കു നൽകപ്പെടുന്നത് എന്തോ
  rationale: ദാതാവിനെ വ്യക്തമാക്കാത്ത ദൈവിക കർമണി പ്രയോഗവും ἐάν നൽകുന്ന തുറന്ന അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ആ നാഴികയിൽ
  rationale: നിർണായക സമയത്തെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള ‘hour’ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τοῦτο λαλεῖτε
  choice: അതുതന്നെ പറയുക
  rationale: τοῦτοയുടെ ഊന്നൽ ‘അതുതന്നെ’ വഴി വ്യക്തമാക്കുന്നു; ലഭിക്കുന്നതു കൃത്യമായി പറയണമെന്ന നിർദേശം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: എന്തെന്നാൽ, സംസാരിക്കുന്നത് നിങ്ങളല്ല
  rationale: ὑμεῖς എന്ന ഊന്നിയ സർവനാമവും തുടർന്നുള്ള വിരുദ്ധതയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ആധുനിക മലയാള ക്രൈസ്തവ ഭാഷയിലെ സാധാരണവും ഗൗരവമുള്ളതുമായ പദം.
theological_decisions:
- issue: പീഡനസമയത്തെ പ്രചോദിത സംസാരത്തിലെ ദൈവികവും മാനുഷികവുമായ പ്രവർത്തനം
  choice: ശിഷ്യന്മാർ പറയേണ്ടതു പറയുന്ന യഥാർഥ വക്താക്കളായി തുടരുമ്പോഴും, ആ സംസാരത്തിന്റെ നിർണായക ഉറവിടവും പ്രവർത്തകനുമായി പരിശുദ്ധാത്മാവിനെ വാക്യം തിരിച്ചറിയുന്നു.
  alternative: ശിഷ്യന്മാരെ പൂർണമായും നിഷ്ക്രിയ ഉപകരണങ്ങളാക്കുന്ന യാന്ത്രിക നിർദേശവായന; അല്ലെങ്കിൽ പരിശുദ്ധാത്മാവിനെ പൊതുവായ ദൈവിക സ്വാധീനമായി മാത്രം കാണുന്ന വായന.
  rationale: ‘നിങ്ങൾക്കു നൽകപ്പെടുന്നത്’ എന്ന കർമണിയും ‘സംസാരിക്കുന്നത് നിങ്ങളല്ല, പരിശുദ്ധാത്മാവാണ്’ എന്ന വിരുദ്ധതയും ദൈവിക പ്രവർത്തനത്തെ ഊന്നുന്നു; അതേസമയം ‘പറയുക’ എന്ന കല്പന മനുഷ്യരുടെ സജീവ പങ്ക് നിലനിർത്തുന്നു. വിവർത്തനം ഈ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘നാഴിക’ എന്ന പദം മൂലത്തിലെ ὥραയുടെ ഗൗരവം നിലനിർത്തുന്നു; ശേഷിക്കുന്ന വാക്യഘടന അനാവശ്യമായ പദാനുപദ കാഠിന്യം ഒഴിവാക്കുന്നു.
