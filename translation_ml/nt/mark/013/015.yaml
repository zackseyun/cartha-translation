id: MRK.13.15
reference: Mark 13:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: ml
  text: വീടിന്റെ മട്ടുപ്പാവിലുള്ളവൻ താഴേക്ക് ഇറങ്ങുകയോ തന്റെ വീട്ടിൽനിന്ന് എന്തെങ്കിലും എടുക്കാൻ അകത്തേക്ക് കടക്കുകയോ അരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മട്ടുപ്പാവ്’ എന്നത് അന്നത്തെ വീടുകളുടെ പരന്ന മേൽക്കൂരഭാഗത്തെ സൂചിപ്പിക്കുന്നു; അത് താമസത്തിനും മറ്റു ദൈനംദിന ആവശ്യങ്ങൾക്കും ഉപയോഗിച്ചിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: വീടിന്റെ മട്ടുപ്പാവിലുള്ളവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ആ സ്ഥലത്തുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു. അന്നത്തെ വീടുകളുടെ പരന്നതും ഉപയോഗയോഗ്യവുമായ മേൽഭാഗത്തെ ‘മട്ടുപ്പാവ്’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μὴ καταβάτω
  choice: താഴേക്ക് ഇറങ്ങുകയോ ... അരുത്
  rationale: നിഷേധാത്മക മൂന്നാംപുരുഷ ആജ്ഞയെ മലയാളത്തിൽ സ്വാഭാവികവും ശക്തവുമായ വിലക്കായി അവതരിപ്പിക്കുന്നു.
- source_word: μηδὲ εἰσελθάτω
  choice: അകത്തേക്ക് കടക്കുകയോ അരുത്
  rationale: μηδέ രണ്ടാമത്തെ വിലക്കിനെ ആദ്യത്തോടു ബന്ധിപ്പിക്കുന്നു; ലക്ഷ്യസ്ഥാനം വീട്ടിനകമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ‘അകത്തേക്ക്’ ചേർത്തത് സ്വാഭാവിക മലയാളത്തിന് യോജിക്കുന്നു.
- source_word: τι ἆραι
  choice: എന്തെങ്കിലും എടുക്കാൻ
  rationale: അനിശ്ചിത സർവനാമത്തോടുകൂടിയ അനന്തക്രിയ ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; അടിയന്തര സാഹചര്യത്തിൽ യാതൊരു വസ്തുവും എടുക്കരുതെന്ന വ്യാപക വിലക്ക് നിലനിർത്തുന്നു.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: തന്റെ വീട്ടിൽനിന്ന്
  rationale: ἐκ അകത്തുനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു. αὐτοῦ ഇവിടെ വാക്യത്തിലെ വ്യക്തിയിലേക്കുതന്നെ മടങ്ങുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രതിഫലക സർവനാമമായ ‘തന്റെ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: പൊതുവായ പ്രാബല്യമുള്ള നിർദേശത്തിലെ പ്രതിനിധാനപരമായ പുല്ലിംഗ ഏകവചനം
  choice: മട്ടുപ്പാവിലുള്ളവൻ ... തന്റെ വീട്
  alternative: മട്ടുപ്പാവിലുള്ളവർ ... അവരുടെ വീട്
  rationale: ഗ്രീക്ക് പുല്ലിംഗ ഏകവചനരൂപം പൊതുവായ അർഥത്തിൽ ഉപയോഗിക്കുന്നു. മലയാളത്തിലും ഏകവചന പ്രതിനിധാനരൂപം നിലനിർത്തി; ‘തന്റെ’ എന്നത് വ്യക്തിയുടെ സ്വന്തം വീടെന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആജ്ഞാരൂപം. ‘മേൽക്കൂര’ എന്ന പൊതുപദത്തേക്കാൾ ചരിത്ര-സാംസ്കാരിക പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘മട്ടുപ്പാവ്’ തിരഞ്ഞെടുത്തു.
