  terminology: ‘മട്ടുപ്പാവ്’ δῶμα എന്ന പ്രാപ്യമായ, പരന്ന മേൽക്കൂരാഭാഗത്തിന്റെ സാംസ്കാരിക അർഥം നന്നായി നൽകുന്നു. ‘തന്റെ’ എന്ന പ്രതിഫലകപ്രയോഗം αὐτοῦ-വിന്റെ അതേ വ്യക്തിയിലേക്കുള്ള സൂചനയും പ്രതിനിധാനപരമായ ഏകവചനവും നിലനിർത്തുന്നു.
