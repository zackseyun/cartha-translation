  source_fidelity: ഗ്രീക്കിലെ രണ്ടു നിരോധനങ്ങളും (μὴ καταβάτω, μηδὲ εἰσελθάτω) അവയ്ക്കു പിന്നാലെയുള്ള ഉദ്ദേശപ്രയോഗവും (τι ἆραι) കൃത്യമായി പ്രതിഫലിക്കുന്നു. ‘തന്റെ വീട്ടിൽനിന്ന്’ ἐκ τῆς οἰκίας αὐτοῦ എന്നതിലെ വീട്ടിനകത്തുനിന്നുള്ള എന്തെങ്കിലും എടുക്കുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
