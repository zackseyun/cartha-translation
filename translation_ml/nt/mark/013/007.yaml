id: MRK.13.7
reference: Mark 13:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: ml
  text: നിങ്ങൾ യുദ്ധങ്ങളെക്കുറിച്ചും യുദ്ധവാർത്തകളെക്കുറിച്ചും[a] കേൾക്കുമ്പോൾ പരിഭ്രമിക്കരുത്. ഇവ സംഭവിക്കേണ്ടതാണ്; എന്നാൽ അവസാനം ഇനിയും വന്നിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യുദ്ധങ്ങളെക്കുറിച്ചുള്ള അഭ്യൂഹങ്ങൾ.’ ഗ്രീക്ക് പദത്തിന് യുദ്ധങ്ങളെപ്പറ്റി കേൾക്കുന്ന വാർത്തകൾ, റിപ്പോർട്ടുകൾ, അല്ലെങ്കിൽ അഭ്യൂഹങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: എന്നാൽ ... കേൾക്കുമ്പോൾ
  rationale: ὅταν ഭാവിസംബന്ധമായ കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; δέ മൃദുവായ വ്യവഹാരബന്ധമോ നേരിയ വൈരുധ്യമോ നൽകുന്നു. ‘എന്നാൽ ... കേൾക്കുമ്പോൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ രണ്ടും നിലനിർത്തുന്നു.
- source_word: ἀκούσητε
  choice: നിങ്ങൾ ... കേൾക്കുമ്പോൾ
  rationale: ὅταν-നോടൊപ്പമുള്ള aorist subjunctive ഇവിടെ ഭാവിയിൽ സംഭവിക്കാവുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കേൾക്കുമ്പോൾ’ അതിനെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: πολέμους
  choice: യുദ്ധങ്ങളെക്കുറിച്ച്
  rationale: πόλεμος എന്നതിന്റെ നേരിട്ടുള്ള ബഹുവചന അർഥം ‘യുദ്ധങ്ങൾ’ ആണ്; ‘കേൾക്കുക’ എന്ന ക്രിയയോടൊപ്പം ‘യുദ്ധങ്ങളെക്കുറിച്ച്’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἀκοὰς πολέμων
  choice: യുദ്ധവാർത്തകളെക്കുറിച്ച്
  rationale: ἀκοή ഇവിടെ കേട്ടറിവ്, വാർത്ത, റിപ്പോർട്ട്, അല്ലെങ്കിൽ അഭ്യൂഹം എന്ന വിശാലമായ അർഥപരിധിയുള്ളതാണ്. ‘യുദ്ധവാർത്തകൾ’ സ്ഥിരീകരിക്കപ്പെട്ടതോ സ്ഥിരീകരിക്കപ്പെടാത്തതോ എന്നത് അനാവശ്യമായി നിശ്ചയിക്കാതെ പൊതുവായ അർഥം നൽകുന്നു.
- source_word: μὴ θροεῖσθε
  choice: പരിഭ്രമിക്കരുത്
  rationale: θροέομαι ഭയന്ന് അസ്വസ്ഥരാകുക, നടുങ്ങുക, പരിഭ്രമിക്കുക എന്നീ ആശയങ്ങൾ നൽകുന്നു. ‘പരിഭ്രമിക്കരുത്’ ആന്തരിക കലക്കവും ഭീതിയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δεῖ γενέσθαι
  choice: ഇവ സംഭവിക്കേണ്ടതാണ്
  rationale: δεῖ ആവശ്യകത സൂചിപ്പിക്കുകയും γενέσθαι സംഭവിക്കുക എന്നർഥം നൽകുകയും ചെയ്യുന്നു. സന്ദർഭത്തിൽനിന്നുള്ള ബഹുവചന സൂചനയായി ‘ഇവ’ ചേർക്കുന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: എങ്കിലും അവസാനം ഇനിയും വന്നിട്ടില്ല
  rationale: ἀλλά വൈരുധ്യം സൂചിപ്പിക്കുന്നു; οὔπω ‘ഇനിയും ഇല്ല’ എന്നും τέλος ‘അവസാനം’ എന്നും അർഥമാക്കുന്നു. മലയാളത്തിൽ ‘വന്നിട്ടില്ല’ ചേർക്കുന്നത് അർഥം മാറ്റാതെ സ്വാഭാവികമായ വാക്യം നൽകുന്നു.
theological_decisions:
- issue: δεῖ γενέσθαι എന്നതിലെ അന്ത്യകാലസംബന്ധിയായ ആവശ്യകത
  choice: ‘സംഭവിക്കേണ്ടതാണ്’ എന്നു പരിഭാഷപ്പെടുത്തി ആവശ്യകതയുടെ ബലം നിലനിർത്തി.
  alternative: ‘സംഭവിക്കണം’ / ‘സംഭവിക്കുക അനിവാര്യമാണ്’
  rationale: വാക്യം ആവശ്യകത പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനരീതി വിശദീകരിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക അന്ത്യകാലക്രമമോ നിർണയവാദമോ ഇറക്കുമതി ചെയ്യാതെ ഗ്രീക്കിന്റെ ബലം സംരക്ഷിക്കുന്നു.
- issue: τὸ τέλος എന്നതിന്റെ അന്ത്യകാല സൂചന
  choice: ‘അവസാനം’ എന്ന് തുറന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ലോകാവസാനം’ / ‘യുഗാവസാനം’
  rationale: സന്ദർഭം അന്ത്യകാലപരമാണെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പദം ഏത് പ്രത്യേക ‘അവസാനം’ എന്ന് വിശദീകരിക്കുന്നില്ല. കൂടുതൽ നിർദ്ദിഷ്ടമായ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. പരമ്പരാഗത പരിചിതത്വം പരിഗണിച്ചെങ്കിലും ἀκοή എന്ന പദത്തിന്റെ വിശാലത മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
