  text: βλέπετε ⸀ἀγρυπνεῖτε, οὐκ οἴδατε γὰρ πότε ὁ καιρός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: ml
  text: ജാഗ്രതയോടെയിരിക്കുക; ഉണർന്നിരിക്കുക. കാരണം, ആ സമയം[a] എപ്പോഴാണെന്നു നിങ്ങൾ അറിയുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിയമിക്കപ്പെട്ട സമയം’ അല്ലെങ്കിൽ ‘കാലഘട്ടം.’ ഗ്രീക്കിലെ καιρός പലപ്പോഴും നിർണായകമോ നിയമിക്കപ്പെട്ടതോ ആയ ഒരു സമയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: ജാഗ്രതയോടെയിരിക്കുക
  rationale: കാഴ്ചയെക്കുറിച്ചല്ല, അപകടസാധ്യത തിരിച്ചറിഞ്ഞ് ജാഗരൂകരായിരിക്കാനുള്ള ബഹുവചന ആജ്ഞയാണ്. തുടർന്നുള്ള ἀγρυπνεῖτε എന്ന പദത്തിലെ ഉറക്കമൊഴിഞ്ഞ കാവൽഭാവത്തിൽനിന്ന് ഇതിനെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀγρυπνεῖτε
  choice: ഉണർന്നിരിക്കുക
  rationale: ഉറങ്ങാതെ ഇരിക്കുക എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് തുടർച്ചയായ ജാഗ്രത സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: οὐκ οἴδατε
  choice: നിങ്ങൾ അറിയുന്നില്ല
  rationale: അറിയുക എന്ന ക്രിയയുടെ ലളിതമായ നിഷേധരൂപം; മൂലത്തിൽ ഇല്ലാത്ത ഉറപ്പിനെക്കുറിച്ചുള്ള ആശയം ചേർത്തിട്ടില്ല.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻപുള്ള ആജ്ഞകൾക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: πότε
  choice: എപ്പോഴാണെന്ന്
  rationale: സമയത്തെക്കുറിച്ചുള്ള പരോക്ഷചോദ്യത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ὁ καιρός
  choice: ആ സമയം
  rationale: സന്ദർഭത്തിൽ പ്രസക്തമായ നിർണായക സമയത്തെ സൂചിപ്പിക്കുന്നു; 'നിയമിക്കപ്പെട്ട സമയം' എന്നു മുഖ്യവാചകത്തിൽ പറഞ്ഞ് അർത്ഥം അതിയായി നിർണ്ണയിക്കുന്നത് ഒഴിവാക്കി.
- source_word: ἐστιν
  choice: ആണ്
  rationale: പരോക്ഷചോദ്യത്തിലെ സ്വാഭാവിക മലയാള ക്രിയാരൂപമായി πότεയോടു ചേർത്ത് നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിലെ καιρός എന്ന പദത്തിന്റെ സൂക്ഷ്മാർഥം
  choice: ആ സമയം
  alternative: നിയമിക്കപ്പെട്ട സമയം; കാലഘട്ടം
  rationale: καιρός നിർണായകമോ നിശ്ചിതമോ ആയ സമയത്തെ സൂചിപ്പിക്കാം. മുഖ്യവാചകം ഗ്രീക്കിലെ വിശാലത നിലനിർത്തുന്നു; കൂടുതൽ വ്യക്തമാക്കുന്ന സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. അഭിസംബോധന ബഹുവചനമാണെന്ന് ‘നിങ്ങൾ’ വ്യക്തമാക്കുന്നു. രണ്ട് വ്യത്യസ്ത ആജ്ഞകളുടെ സൂക്ഷ്മവ്യത്യാസം ‘ജാഗ്രതയോടെയിരിക്കുക’ എന്നും ‘ഉണർന്നിരിക്കുക’ എന്നും നിലനിർത്തിയിരിക്കുന്നു.
