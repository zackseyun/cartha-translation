  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: ml
  text: അപ്പോൾ മനുഷ്യപുത്രൻ വലിയ ശക്തിയോടും മഹിമയോടുംകൂടെ മേഘങ്ങളിൽ വരുന്നത് അവർ കാണും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മേഘങ്ങളോടുകൂടെ വരുന്നത്.’ ഗ്രീക്കിൽ അക്ഷരാർഥമായി ‘മേഘങ്ങളിൽ’ എന്നാണ്; മറ്റൊരു വിവർത്തനം ദാനീയേൽ 7:13-ലെ പ്രതിധ്വനി കൂടുതൽ വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: അവർ കാണും
  rationale: ὁράωയുടെ ഭാവികാലരൂപത്തിന്റെ നേരായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സംഭവം ദൃശ്യമായിരിക്കുമെന്ന ആശയം അധിക വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ദാനീയേൽ 7-ലെ പശ്ചാത്തലവും അംഗീകൃതമായ ശീർഷകസ്വഭാവവും നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതമായ പ്രയോഗം.
- source_word: ἐρχόμενον
  choice: വരുന്നത്
  rationale: വർത്തമാനകാല പങ്കാളിക്രിയയുടെ ചലനാത്മകത നിലനിർത്തുകയും മലയാളവാക്യഘടനയിൽ ‘കാണും’ എന്ന ക്രിയയോടു സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: ἐν νεφέλαις
  choice: മേഘങ്ങളിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാനമായ ‘-യിൽ’ അർഥവും ബഹുവചനമായ νεφέλαις എന്നതും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ഗ്രീക്കിൽ നിർദേശകപദമില്ലാത്തതിനാൽ മലയാളത്തിലും അനാവശ്യ നിർണ്ണയം ചേർക്കുന്നില്ല.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: മഹാശക്തിയോടുംകൂടെ
  rationale: μετάയുടെ സഹവർത്തിത്വഭാവവും πολλῆς സൂചിപ്പിക്കുന്ന ശക്തിയുടെ മഹത്വവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ δόξης
  choice: മഹത്ത്വത്തോടുംകൂടെ
  rationale: δόξയുടെ ദൈവിക തേജസ്സും മഹിമയും ഉൾക്കൊള്ളുന്ന ബൈബിൾപരമായ അർഥം ‘മഹത്ത്വം’ സ്വാഭാവികമായി വഹിക്കുന്നു; മുൻപുള്ള μετάയുടെ അർഥവ്യാപ്തി ഇതിലേക്കും ബാധകമാകുന്നു.
theological_decisions:
- issue: അന്ത്യകാല ശീർഷകവും മേഘാഗമന ദൃശ്യവും
  choice: ‘മനുഷ്യപുത്രൻ’ എന്ന ശീർഷകവും ‘മേഘങ്ങളിൽ വരുന്നത്’ എന്ന ദൃശ്യവും വിശദീകരണവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: ‘മനുഷ്യനായവൻ’ എന്നു ചലനാത്മകമായി പരിഭാഷപ്പെടുത്തുകയോ ദാനീയേൽ 7-ലെ സൂചന മുഖ്യവാചകത്തിൽ തുറന്നു വിശദീകരിക്കുകയോ ചെയ്യാം.
  rationale: വാക്യം ദാനീയേൽ 7:13-നെ ശക്തമായി പ്രതിധ്വനിപ്പിക്കുന്നുവെങ്കിലും ആ സൂചന പരിഭാഷയിൽ വിശദീകരിച്ച് തീർക്കാതെ വായനക്കാരന് തിരിച്ചറിയാവുന്നവിധം സംരക്ഷിക്കണം. ഇതിലൂടെ ഗ്രീക്കിലെ ക്രിസ്തുശാസ്ത്രപരവും അന്ത്യകാലപരവുമായ സംഘർഷവും വ്യാപ്തിയും നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾശൈലി. ‘മനുഷ്യപുത്രൻ,’ ‘മഹാശക്തി,’ ‘മഹത്ത്വം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും അന്തർപാഠബന്ധങ്ങൾ സംരക്ഷിക്കുന്നതുമാണ്.
