revisions:
- from: എന്നാൽ നിങ്ങൾ സ്വയം സൂക്ഷിച്ചുകൊള്ളുക. അവർ നിങ്ങളെ ന്യായസഭകൾക്ക് ഏൽപ്പിക്കും; പള്ളികളിൽവെച്ച് നിങ്ങളെ അടിക്കും. ഞാൻ നിമിത്തം നിങ്ങൾ നാടുവാഴികളുടെയും രാജാക്കന്മാരുടെയും മുമ്പിൽ നിൽക്കും—അവർക്കൊരു സാക്ഷ്യമായി.[a]
  to: എന്നാൽ നിങ്ങൾ നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുക. അവർ നിങ്ങളെ ന്യായസമിതികൾക്കു കൈമാറും; സിനഗോഗുകളിൽവെച്ച് നിങ്ങൾ അടിക്കപ്പെടും. എന്നെ നിമിത്തം നാടുവാഴികളുടെയും രാജാക്കന്മാരുടെയും മുമ്പിൽ നിങ്ങൾ നിൽക്കേണ്ടിവരും—അവർക്കൊരു സാക്ഷ്യമായി.[a]
  rationale: The revision replaces the ambiguous ‘പള്ളികൾ’ with ‘സിനഗോഗുകൾ,’ improves the causal phrase to idiomatic Malayalam, and expresses the Greek passive/compelled setting without adding interpretation. The principal rendering ‘അവർക്കൊരു സാക്ഷ്യമായി’ and its footnote preserve the textual ambiguity of the witness phrase rather than deciding that it is necessarily condemnatory.
