id: MRK.13.9
reference: Mark 13:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുക. അവർ നിങ്ങളെ ന്യായസമിതികൾക്കു കൈമാറും; സിനഗോഗുകളിൽവെച്ച് നിങ്ങൾ അടിക്കപ്പെടും. എന്നെ നിമിത്തം നാടുവാഴികളുടെയും രാജാക്കന്മാരുടെയും മുമ്പിൽ നിങ്ങൾ നിൽക്കേണ്ടിവരും—അവർക്കൊരു സാക്ഷ്യമായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർക്കുള്ള ഒരു സാക്ഷ്യത്തിനായി’; ഈ പ്രയോഗത്തിന് ‘അവർക്കെതിരായ സാക്ഷ്യമായി’ എന്ന അർഥവും ഉണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: എന്നാൽ നിങ്ങൾ സ്വയം സൂക്ഷിച്ചുകൊള്ളുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ ജാഗ്രതാഭാവവും ὑμεῖς ἑαυτούς എന്ന ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παραδώσουσιν
  choice: ഏൽപ്പിക്കും
  rationale: പീഡനത്തിന്റെ നിയമപരമായ പശ്ചാത്തലത്തിൽ അധികാരികളുടെ കൈയിൽ ഏൽപ്പിക്കപ്പെടുന്നതിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: συνέδρια
  choice: ന്യായസഭകൾ
  rationale: യെരൂശലേമിലെ മഹാസൻഹെദ്രിൻ മാത്രമല്ല, പ്രാദേശിക ഭരണ-ന്യായ സമിതികളെയും ഉൾക്കൊള്ളാവുന്ന ബഹുവചന അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: συναγωγάς
  choice: പള്ളികൾ
  rationale: മലയാള ക്രൈസ്തവ ബൈബിൾ പ്രയോഗത്തിൽ യഹൂദരുടെ സിനഗോഗുകളെ സൂചിപ്പിക്കുന്ന പരിചിതമായ പദം; ഇവിടെ ശിക്ഷ നടപ്പാക്കുന്ന സ്ഥാപനപരമായ ഇടമാണ് ഉദ്ദേശ്യം.
- source_word: δαρήσεσθε
  choice: നിങ്ങളെ അടിക്കും
  rationale: ശാരീരികമായി മർദിക്കപ്പെടുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; പ്രത്യേകമായ ചാട്ടവാറടിയെന്നതിലേക്കു അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: നാടുവാഴികളുടെയും രാജാക്കന്മാരുടെയും മുമ്പിൽ നിൽക്കും
  rationale: അധികാരികളുടെ മുമ്പിലുള്ള ഔപചാരിക ഹാജരാകലും ഗ്രീക്കിലെ വ്യത്യസ്ത പദവികളും നിലനിർത്തുന്നു.
- source_word: ἕνεκεν ἐμοῦ
  choice: ഞാൻ നിമിത്തം
  rationale: യേശുവുമായുള്ള ബന്ധമാണ് പീഡനത്തിന്റെ കാരണം എന്ന ആശയം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: അവർക്കൊരു സാക്ഷ്യമായി
  rationale: സാക്ഷ്യം അവരിലേക്കു ലക്ഷ്യമിടുന്നു എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; അത് നിർബന്ധമായും അവർക്കെതിരായ കുറ്റസാക്ഷ്യമാണെന്ന് മുഖ്യവാചകത്തിൽ തീരുമാനിക്കുന്നില്ല.
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς എന്ന സാക്ഷ്യവാക്യത്തിന്റെ ദിശയും സ്വഭാവവും
  choice: അവർക്കൊരു സാക്ഷ്യമായി
  alternative: അവർക്കെതിരായ സാക്ഷ്യമായി
  rationale: αὐτοῖς എന്ന ദാതിവ് സാക്ഷ്യം ആ അധികാരികളിലേക്കാണെന്നു സ്വാഭാവികമായി വായിക്കാം; ചില സന്ദർഭങ്ങളിൽ പ്രതികൂലമോ കുറ്റവിധിപരമോ ആയ ഭാവം സാധ്യമെങ്കിലും ഇവിടെ അത് നിർബന്ധമല്ല. അതിനാൽ മുഖ്യവാചകം വിശാലമായ അർഥം സൂക്ഷിക്കുകയും മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമ-പീഡന പശ്ചാത്തലം വ്യക്തമായി സൂക്ഷിച്ചുകൊണ്ട് അനാവശ്യമായ മതവിഭാഗീയ വ്യാഖ്യാനം ഒഴിവാക്കി. ‘പള്ളി’ ഇവിടെ യഹൂദ സിനഗോഗിനെയാണ് സൂചിപ്പിക്കുന്നത്.
