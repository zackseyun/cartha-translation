  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: ml
  text: എന്നാൽ, അത് ശീതകാലത്ത് സംഭവിക്കാതിരിക്കാൻ പ്രാർഥിക്കുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, സന്ദർഭം കൂടുതൽ വ്യക്തമാക്കി: ‘നിങ്ങളുടെ പലായനം ശീതകാലത്ത് സംഭവിക്കാതിരിക്കാൻ.’ മർക്കോസിന്റെ ഗ്രീക്ക് പ്രയോഗം മത്തായി 24:20-ലെ സമാന്തരവാക്യത്തേക്കാൾ സംക്ഷിപ്തമാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: പ്രാർഥിക്കുവിൻ
  rationale: വർത്തമാനകാല മധ്യ/ഡീപോണന്റ് ആജ്ഞാരൂപം, ബഹുവചനം. മലയാളത്തിൽ ബഹുവചനത്തെ വ്യക്തമാക്കുന്ന, മാന്യവും സ്വാഭാവികവുമായ ലളിത ആജ്ഞാരൂപം ഉപയോഗിച്ചു; ‘തുടർന്ന് പ്രാർഥിക്കുവിൻ’ എന്നു പറഞ്ഞാൽ ക്രിയയുടെ aspect അനാവശ്യമായി കൂടുതൽ വ്യക്തമാക്കപ്പെടും.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻ മുന്നറിയിപ്പിനോടു ബന്ധിപ്പിക്കുന്ന ലഘുവായ പ്രതിയോഗാത്മക പരിവർത്തനം സൂചിപ്പിക്കുന്നു. ‘എന്നാൽ’ ആ ബന്ധവും ഭാവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἵνα μὴ
  choice: '...ആതിരിക്കാൻ'
  rationale: നിഷേധത്തോടുകൂടിയ പ്രാർഥനയുടെ ഉള്ളടക്കം/ഉദ്ദേശ്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സംഭവിക്കാതിരിക്കാൻ പ്രാർഥിക്കുവിൻ’ എന്ന ഘടന സ്വാഭാവികമാണ്.
- source_word: γένηται
  choice: അത് ... സംഭവിക്കുക
  rationale: γίνομαι എന്ന ക്രിയയുടെ aorist middle subjunctive രൂപം. സന്ദർഭത്തിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന സംഭവത്തെയോ സാഹചര്യത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിലെ സംക്ഷിപ്തത ‘അത് സംഭവിക്കുക’ എന്ന അനിർദിഷ്ട പ്രയോഗത്തിലൂടെ നിലനിർത്തി.
- source_word: χειμῶνος
  choice: ശീതകാലത്ത്
  rationale: കാലത്തെ സൂചിപ്പിക്കുന്ന adverbial genitive. ‘ശീതകാലത്ത്’ എന്നത് ആധുനിക നിലവാര മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
theological_decisions:
- issue: γένηται എന്നതിന്റെ പരോക്ഷമായ വിഷയം
  choice: മുൻസന്ദർഭത്തിലെ പ്രതീക്ഷിക്കപ്പെടുന്ന സംഭവത്തെയോ പലായനസാഹചര്യത്തെയോ പൊതുവായി സൂചിപ്പിക്കുന്ന ‘അത്’ എന്ന പ്രയോഗം
  alternative: ‘നിങ്ങളുടെ പലായനം ശീതകാലത്ത് സംഭവിക്കാതിരിക്കാൻ’
  rationale: മർക്കോസിന്റെ ഗ്രീക്കിൽ ‘നിങ്ങളുടെ പലായനം’ എന്ന് വ്യക്തമായി ഇല്ല; മത്തായി 24:20-ലെ സമാന്തരവാക്യത്തിൽ അത് കൂടുതൽ വ്യക്തമാക്കിയിട്ടുണ്ട്. സമാന്തരവാക്യത്തിലെ പദങ്ങൾ മർക്കോസിലേക്കു ചേർക്കാതെ, മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും യഥാർഥ അവ്യക്തതയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രാർഥിക്കുവിൻ’ എന്ന രൂപം തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച മാന്യത നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതാണ്. മൂലത്തിലെ elliptical ഘടന പ്രധാനവാക്യത്തിൽ സംരക്ഷിച്ച്, സന്ദർഭപരമായ വ്യക്തമായ വായന അടിക്കുറിപ്പിൽ നൽകി.
