  terminology: “നക്ഷത്രങ്ങൾ,” “ആകാശം/ആകാശങ്ങൾ,” and “ശക്തികൾ” are suitable modern-standard Malayalam choices. “ശക്തികൾ” properly leaves δυνάμεις unspecified rather than deciding for angels, celestial bodies, or cosmic forces. The footnotes preserve the lexical and interpretive ambiguity without doctrinally narrowing it.
