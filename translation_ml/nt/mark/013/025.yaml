id: MRK.13.25
reference: Mark 13:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: ml
  text: നക്ഷത്രങ്ങൾ ആകാശത്തുനിന്ന് വീണുകൊണ്ടിരിക്കും[a]; ആകാശങ്ങളിലുള്ള ശക്തികൾ കുലുക്കപ്പെടും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വർഗത്തിൽനിന്ന്.” ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് “ആകാശം” എന്നോ “സ്വർഗം” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ആകാശങ്ങളിലുള്ള ശക്തികൾ” എന്നത് സ്വർഗീയ ശക്തികളെയോ പ്രപഞ്ചശക്തികളെയോ ആകാശങ്ങളുടെ ഘടനകളെയോ സൂചിപ്പിക്കാം; ഗ്രീക്ക് ഇതിനെക്കാൾ വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: നക്ഷത്രങ്ങൾ
  rationale: സാധാരണ ജ്യോതിശാസ്ത്രപരവും പ്രപഞ്ചപരവുമായ അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: ἔσονται ... πίπτοντες
  choice: വീണുകൊണ്ടിരിക്കും
  rationale: εἰμί എന്നതിന്റെ ഭാവികാലരൂപവും വർത്തമാനകർത്തൃവാചക ഭാഗധാതുവും ചേർന്ന പ്രയോഗത്തിലെ തുടരുന്ന, സജീവമായ ഭാവിക്രിയ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ആകാശത്തുനിന്ന്
  rationale: നക്ഷത്രങ്ങൾ വീഴുന്നതെന്ന അടുത്ത സന്ദർഭത്തിൽ οὐρανός എന്നതിന്റെ ദൃശ്യമായ ‘ആകാശം’ എന്ന അർഥം സ്വാഭാവികമാണ്; ‘സ്വർഗം’ എന്നതും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
- source_word: δυνάμεις
  choice: ശക്തികൾ
  rationale: സ്വർഗീയ അധികാരങ്ങൾ, പ്രപഞ്ചശക്തികൾ, ആകാശഘടനകൾ എന്നിവയിൽ ഒന്നായി അർഥം പരിമിതപ്പെടുത്താതെ δύναμις എന്ന ബഹുവചനത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: ആകാശങ്ങളിലുള്ള
  rationale: ഗ്രീക്കിലെ ബഹുവചനം പ്രതിഫലിപ്പിക്കുകയും വചനത്തിന്റെ പ്രപഞ്ചവ്യാപകമായ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: σαλευθήσονται
  choice: കുലുക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്ന, അന്ത്യകാലസന്ദർഭത്തിന് യോജിച്ച പരിഭാഷ.
theological_decisions:
- issue: ‘ആകാശങ്ങളിലുള്ള ശക്തികൾ’ എന്നതിന്റെ സൂചന
  choice: ‘ശക്തികൾ’ എന്നു പൊതുവായി പരിഭാഷപ്പെടുത്തി അർഥവ്യാപ്തി നിലനിർത്തി.
  alternative: സ്വർഗീയ ജീവികൾ; പ്രപഞ്ചശക്തികൾ; ആകാശത്തിലെ ഘടനകൾ അല്ലെങ്കിൽ ഘടകങ്ങൾ.
  rationale: ഗ്രീക്കുപ്രയോഗം ഇവയിൽ ഒന്നിനെ വ്യക്തമായി നിർണയിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായി അർഥം ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അപോകലിപ്റ്റിക് പ്രപഞ്ചഭാവം നിലനിർത്താൻ ‘ആകാശങ്ങൾ’ എന്ന ബഹുവചനവും ക്രിയയുടെ തുടരുന്ന ഭാവം പ്രകടമാക്കാൻ ‘വീണുകൊണ്ടിരിക്കും’ എന്ന രൂപവും ഉപയോഗിച്ചു.
