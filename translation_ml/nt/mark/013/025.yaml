  source_fidelity: 'Greek word order and sense are faithfully represented: οἱ ἀστέρες ... ἐκ τοῦ οὐρανοῦ πίπτοντες is conveyed as stars falling from the sky, with the ongoing/vivid future force of the periphrastic construction retained in “വീണുകൊണ്ടിരിക്കും.” The singular “ആകാശത്തുനിന്ന്” appropriately reflects τοῦ οὐρανοῦ, while “ആകാശങ്ങളിലുള്ള” reflects the later plural τοῖς οὐρανοῖς. “കുലുക്കപ്പെടും” accurately renders the future passive σαλευθήσονται.'
