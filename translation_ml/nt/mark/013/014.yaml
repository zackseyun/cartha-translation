id: MRK.13.14
reference: Mark 13:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: ml
  text: എന്നാൽ പാടില്ലാത്തിടത്ത് “ശൂന്യമാക്കുന്ന മ്ലേച്ഛത” നിൽക്കുന്നതു നിങ്ങൾ കാണുമ്പോൾ—വായിക്കുന്നവൻ മനസ്സിലാക്കട്ടെ[a]—അപ്പോൾ യെഹൂദ്യയിലുള്ളവർ മലകളിലേക്ക് ഓടിപ്പോകട്ടെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ “നിൽക്കുന്ന” എന്ന പദം പുല്ലിംഗത്തിലാണ്; അതിനാൽ ഈ “മ്ലേച്ഛത”യ്ക്കു പിന്നിൽ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായും വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “ശൂന്യമാക്കുന്ന മ്ലേച്ഛത” എന്ന പ്രയോഗം ദാനീയേലിലെ ഭാഷയെ പ്രതിധ്വനിപ്പിക്കുന്നു; കാണുക ദാനീ. 9:27; 11:31; 12:11.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: എന്നാൽ ... കാണുമ്പോൾ
  rationale: ὅταν സൂചിപ്പിക്കുന്ന കാലസംബന്ധമായ സാഹചര്യം ‘കാണുമ്പോൾ’ സ്വാഭാവികമായി നൽകുന്നു; δέയെ മുൻവാക്യത്തോടുള്ള മൃദുവായ വഴിത്തിരിവായി ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἴδητε
  choice: നിങ്ങൾ കാണുമ്പോൾ
  rationale: ὁράωയുടെ ദ്വിതീയപുരുഷ ബഹുവചനരൂപം നേരിട്ട്, സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: “ശൂന്യമാക്കുന്ന മ്ലേച്ഛത”
  rationale: ദാനീയേലിലെ പ്രയോഗവുമായുള്ള ബന്ധം നിലനിർത്തുകയും, βδέλυγμα എന്നതിന്റെ മതപരമായി അറപ്പുളവാക്കുന്ന അശുദ്ധതയും ἐρήμωσις എന്നതിന്റെ ശൂന്യമാക്കൽ/നശീകരണ ഫലവും സംക്ഷിപ്തമായി അറിയിക്കുകയും ചെയ്യുന്നു. ചരിത്രപരമായ നിർദിഷ്ട സൂചന പരിഭാഷയിൽ തീരുമാനിക്കുന്നില്ല.
- source_word: ἑστηκότα
  choice: നിൽക്കുന്നതു
  rationale: ἵστημιയുടെ perfect participle ഇപ്പോൾ നിലകൊള്ളുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘നിൽക്കുന്നതു’ ദൃശ്യതയും നിലനിൽക്കുന്ന അവസ്ഥയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ὅπου οὐ δεῖ
  choice: പാടില്ലാത്തിടത്ത്
  rationale: δεῖ ഇവിടെ യോജ്യതയില്ലായ്മ/അനുചിതത്വം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സർവനാമം നിർബന്ധമല്ലാത്തതിനാൽ ‘അത്/അവൻ’ എന്ന് തീരുമാനിക്കാതെ മൂലത്തിലെ ആശയക്കുഴപ്പം സ്വാഭാവികമായി നിലനിർത്താം.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: വായിക്കുന്നവൻ മനസ്സിലാക്കട്ടെ
  rationale: മൂലത്തിലെ parenthetical exhortation-ഉം മൂന്നാംപുരുഷ ആജ്ഞാഭാവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τότε
  choice: അപ്പോൾ
  rationale: അടയാളത്തിനു പിന്നാലെയുള്ള നടപടിയെ വ്യക്തമാക്കുന്ന സ്വാഭാവിക കാലസൂചകം.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: യെഹൂദ്യയിലുള്ളവർ
  rationale: ഭൂമിശാസ്ത്രപരമായ നിർദിഷ്ടത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: φευγέτωσαν
  choice: ഓടിപ്പോകട്ടെ
  rationale: വർത്തമാനകാല മൂന്നാംപുരുഷ ബഹുവചന ആജ്ഞയുടെ അടിയന്തരത മലയാളത്തിലെ ‘-ട്ടെ’ ആജ്ഞാരൂപത്തിൽ നൽകുന്നു; ‘ഓടിപ്പോകുക’ അപകടത്തിൽനിന്നുള്ള പലായനം വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὰ ὄρη
  choice: മലകളിലേക്ക്
  rationale: ὄρη എന്നതിന്റെ നേരിട്ടുള്ള ഭൂമിശാസ്ത്രപരമായ അർഥം നൽകുന്നു.
theological_decisions:
- issue: τὸ βδέλυγμα τῆς ἐρημώσεως എന്ന ദാനീയേൽ-പ്രതിധ്വനിയുള്ള പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: “ശൂന്യമാക്കുന്ന മ്ലേച്ഛത” എന്ന ഉറവിടസമീപവും അർഥഗ്രാഹ്യവുമായ പ്രയോഗം നിലനിർത്തി; ചരിത്രപരമായ സൂചന നിർണ്ണയിച്ചില്ല.
  alternative: “ശൂന്യതയുടെ മ്ലേച്ഛത”; “നാശകരമായ അശുദ്ധവസ്തു”
  rationale: ഇത് വസ്തുവോ പ്രവൃത്തിയോ വ്യക്തിയോ എന്നത് വിവാദവിഷയമാണ്. മുഖ്യവാക്യത്തിൽ ഒരു പ്രത്യേക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ ദാനീയേലുമായുള്ള ബന്ധവും അന്ത്യകാലപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
- issue: നപുംസകലിംഗമായ βδέλυγμα-യോടൊപ്പം വരുന്ന പുല്ലിംഗ participle ἑστηκότα
  choice: മലയാളത്തിൽ ‘പാടില്ലാത്തിടത്ത് ... നിൽക്കുന്നതു’ എന്നു നൽകി ലിംഗസൂചന നിർബന്ധമായി തീർപ്പാക്കാതെ നിലനിർത്തി; വ്യക്തിപരമായ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
  alternative: “അവൻ നിൽക്കാൻ പാടില്ലാത്തിടത്ത് നിൽക്കുന്നതു”
  rationale: ഗ്രീക്ക് രൂപം ഒരു വ്യക്തിപരമായോ വ്യക്തിവൽക്കരിക്കപ്പെട്ടതായോ ഉള്ള സൂചന നൽകാം; എന്നാൽ അത് നിർണായകമല്ല. മലയാളത്തിലെ സർവനാമരഹിത ഘടന വായനാസൗകര്യത്തോടൊപ്പം യഥാർഥ ആശയക്കുഴപ്പം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മ്ലേച്ഛത’ ബൈബിൾസംബന്ധമായ മത-അശുദ്ധിയുടെ ശക്തി നിലനിർത്തുന്നു; ഉദ്ധരണിച്ചിഹ്നങ്ങൾ ദാനീയേൽ-പ്രതിധ്വനിയുള്ള സ്ഥിരപ്രയോഗത്തെ തിരിച്ചറിയാൻ സഹായിക്കുന്നു. Parenthetical exhortation ദീർഘരേഖകൾക്കിടയിൽ നൽകി.
