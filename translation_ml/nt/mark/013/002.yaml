  terminology: ‘കെട്ടിടങ്ങൾ,’ ‘കല്ല്,’ and ‘ഇടിച്ചുതകർക്കുക’ are appropriate. The main text rightly does not add ‘temple’ beyond the Greek; this remains in a footnote.
