reference: Mark 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “ഈ വലിയ കെട്ടിടങ്ങൾ[a] നീ കാണുന്നുവോ? ഇവിടെ മറ്റൊരു കല്ലിന്മേൽ ശേഷിക്കുന്ന ഒരു കല്ലുപോലും ഇടിച്ചുതകർക്കപ്പെടാതെ[c] ഇരിക്കുകയില്ല.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ വലിയ ദേവാലയക്കെട്ടിടങ്ങൾ.” സന്ദർഭം ദേവാലയസമുച്ചയമാണെങ്കിലും ഗ്രീക്കിൽ ‘കെട്ടിടങ്ങൾ’ എന്നു മാത്രമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ഒരു കല്ല് മറ്റൊരു കല്ലിന്മേൽ ശേഷിക്കുകയില്ല” എന്നത് സമ്പൂർണ നാശത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “നശിപ്പിക്കപ്പെടാതെ” അല്ലെങ്കിൽ “താഴെയിടപ്പെടാതെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: നീ കാണുന്നുവോ?
  rationale: വർത്തമാനകാല സൂചകക്രിയ ഇവിടെ നേരിട്ടുള്ള ചോദ്യമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ചോദ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μεγάλας οἰκοδομάς
  choice: മഹത്തായ കെട്ടിടങ്ങൾ
  rationale: οἰκοδομάς എന്നത് പൊതുവായി ‘കെട്ടിടങ്ങൾ’ എന്നാണ്; μεγάλας വലുപ്പത്തെയും പ്രൗഢിയെയും സൂചിപ്പിക്കാവുന്നതിനാൽ ‘മഹത്തായ’ രണ്ടും തുറന്നുവെക്കുന്നു.
- source_word: οὐ μὴ ἀφεθῇ
  choice: ശേഷിക്കുകയേയില്ല
  rationale: οὐ μή ചേർന്ന പ്രയോഗത്തിലെ ശക്തമായ ഭാവിനിഷേധം മലയാളത്തിലെ ‘-യേയില്ല’ എന്ന ഊന്നലിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: സ്ഥലസൂചകമായ ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ പരിഭാഷ.
- source_word: λίθος ἐπὶ λίθον
  choice: ഒരു കല്ലിന്മേൽ മറ്റൊരു കല്ല്
  rationale: സമ്പൂർണ നാശത്തെ ചിത്രീകരിക്കുന്ന മൂലപാഠത്തിലെ ദൃശ്യരൂപവും ശൈലിയും നിലനിർത്തുന്നു.
- source_word: καταλυθῇ
  choice: ഇടിച്ചുതകർക്കപ്പെടാതെ
  rationale: കെട്ടിടം പൊളിച്ചിടുകയോ തകർക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ഭൗതിക അർഥം വ്യക്തമായി നൽകുന്നു; relative clause-ന്റെ നിഷേധഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: യേശു അവനോടു പറഞ്ഞു
  rationale: വിവരണപ്രവാഹത്തിൽ καί നിർബന്ധമായി ‘പിന്നെ’ എന്നു കാലപരമായി വ്യക്തമാക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ സംഭാഷണാരംഭം നൽകുന്നു.
theological_decisions:
- issue: പ്രവചനത്തിൽ സൂചിപ്പിക്കപ്പെടുന്ന കെട്ടിടങ്ങളുടെ പരിധി
  choice: മുഖ്യപാഠത്തിൽ ‘കെട്ടിടങ്ങൾ’ എന്നു പൊതുവായി നിലനിർത്തുക
  alternative: ‘ദേവാലയക്കെട്ടിടങ്ങൾ’ എന്നു വ്യക്തമാക്കുക
  rationale: സന്ദർഭം ദേവാലയസമുച്ചയമാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും ഗ്രീക്കിൽ οἰκοδομάς എന്ന പൊതുപദം മാത്രമാണുള്ളത്. അതിനാൽ മുഖ്യപാഠത്തിൽ അധിക വ്യാഖ്യാനം ചേർക്കാതെ, സന്ദർഭപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷ. ‘ശേഷിക്കുകയേയില്ല’ ശക്തമായ ഗ്രീക്ക് നിഷേധത്തെ സ്വാഭാവികമായി ഊന്നുന്നു. മൂലത്തിലെ relative-clause ഘടന പരമാവധി നിലനിർത്തിയിരിക്കുന്നു.
