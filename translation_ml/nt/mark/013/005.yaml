source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂ἤρξατο λέγειν αὐτοῖς⸃· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു അവരോടു പറഞ്ഞുതുടങ്ങി: “ആരും നിങ്ങളെ വഴിതെറ്റിക്കാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആരും നിങ്ങളെ വഞ്ചിക്കാതിരിക്കാൻ ജാഗ്രത പാലിക്കുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ലഘുവായ ആഖ്യാനബന്ധകമായ δέ ഇവിടെ സംഭവക്രമം സ്വാഭാവികമായി തുടരുന്നു; ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നില്ല.
- source_word: ἤρξατο λέγειν
  choice: പറഞ്ഞുതുടങ്ങി
  rationale: മർക്കോസിൽ പതിവായ ആഖ്യാനപ്രയോഗത്തിന്റെ ആരംഭഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘മറുപടി പറഞ്ഞു’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: സന്ദർഭത്തിൽ ശിഷ്യന്മാരെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, ഗ്രീക്കിലുള്ള സർവനാമരൂപം അതേപടി നിലനിർത്തുന്നു.
- source_word: Βλέπετε
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിലെ തുടർച്ചയായ ജാഗ്രതയുടെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: ആരും നിങ്ങളെ വഴിതെറ്റിക്കാതിരിക്കാൻ
  rationale: μήയും ഉപവിധിരൂപവും ചേർന്നുള്ള തടയൽസ്വഭാവമുള്ള മുന്നറിയിപ്പ് പ്രകടമാക്കുന്നു. πλανάωയിലെ വഞ്ചനയും ശരിയായ വഴിയിൽനിന്നുള്ള വ്യതിചലനവും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർത്ഥം ‘വഴിതെറ്റിക്കുക’ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: πλανήσῃ എന്ന മുന്നറിയിപ്പിന്റെ സ്വഭാവം
  choice: വഞ്ചനയിലൂടെ ശരിയായ വഴിയിൽനിന്നു തെറ്റിക്കപ്പെടുന്നതിനെതിരായ മുന്നറിയിപ്പ്
  alternative: ബൗദ്ധികമായ വഞ്ചനയ്ക്കെതിരായ മുന്നറിയിപ്പ് മാത്രമായി വായിക്കൽ
  rationale: πλανάω വെറും തെറ്റായ വിവരം നൽകുന്നതിലുപരി അലഞ്ഞുപോകുകയോ ശരിയായ വഴിയിൽനിന്നു തെറ്റിക്കപ്പെടുകയോ ചെയ്യുന്ന ആശയവും വഹിക്കുന്നു. ‘വഴിതെറ്റിക്കുക’ ഈ വിശാലമായ ധാർമിക-ദൈവശാസ്ത്ര ശക്തി അധിക വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആഖ്യാനത്തിന്റെ ലാളിത്യവും യേശുവിന്റെ മുന്നറിയിപ്പിലെ അടിയന്തരതയും നിലനിർത്തുന്നു; പഴഞ്ചൻ പ്രയോഗങ്ങളും വിഭാഗീയ പദാവലിയും ഒഴിവാക്കുന്നു.
