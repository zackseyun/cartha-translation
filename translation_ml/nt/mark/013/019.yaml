id: MRK.13.19
reference: Mark 13:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: ml
  text: ആ നാളുകൾ, ദൈവം സൃഷ്ടിച്ച സൃഷ്ടിയുടെ ആരംഭംമുതൽ ഇന്നുവരെ ഉണ്ടായിട്ടില്ലാത്ത തരത്തിലുള്ള കഷ്ടകാലമായിരിക്കും[a]; ഇനിയൊരിക്കലും അങ്ങനെയൊന്ന് ഉണ്ടാകുകയുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ നാളുകളിൽ ഉണ്ടാകുന്ന കഷ്ടം, ദൈവം സൃഷ്ടിച്ച സൃഷ്ടിയുടെ ആരംഭംമുതൽ ഇന്നുവരെ ഒരിക്കലും ഉണ്ടായിട്ടില്ലാത്തതായിരിക്കും; ഇനിയൊരിക്കലും ഉണ്ടാകുകയുമില്ല.”
    reason: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ വിധേയഘടന മലയാളത്തിൽ ‘ആ നാളുകൾ ... കഷ്ടകാലമായിരിക്കും’ എന്നോ ‘ആ നാളുകളിൽ ഉണ്ടാകുന്ന കഷ്ടം ...’ എന്നോ സ്വാഭാവികമായി തുറന്നുപറയാം.
lexical_decisions:
- source_word: θλῖψις
  choice: കഷ്ടകാലം
  rationale: അസാധാരണമായ വ്യാപ്തിയുള്ള കടുത്ത ദുരിതത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘കഷ്ടകാലം’ എന്നത് ആ നാളുകൾ ഒരു ദുരിതഘട്ടമായിരിക്കുമെന്ന ഗ്രീക്കിലെ സംക്ഷിപ്ത പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത ‘മഹാ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: ഉണ്ടായിട്ടില്ലാത്ത തരത്തിലുള്ള
  rationale: വരാനിരിക്കുന്ന കഷ്ടകാലത്തിന്റെ സമാനതയില്ലായ്മ വ്യക്തമാക്കുന്ന താരതമ്യഘടനയാണ് ഇത്. ഗ്രീക്കിലെ ആവർത്തനഭാവം പദാനുപദമായി അനുകരിക്കാതെ അതിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: സൃഷ്ടിയുടെ ആരംഭംമുതൽ
  rationale: κτίσις എന്ന പദത്തിന്റെ സൃഷ്ടിവ്യാപ്തി നിലനിർത്തുകയും തുടർന്നുള്ള സ്രഷ്ടാവിനെക്കുറിച്ചുള്ള ബന്ധവാക്യവുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: ദൈവം സൃഷ്ടിച്ച സൃഷ്ടിയുടെ
  rationale: മലയാളത്തിൽ അല്പം ആവർത്തനമായി കേൾക്കുന്നുവെങ്കിലും, ദൈവം സ്രഷ്ടാവാണെന്ന് വ്യക്തമാക്കുന്ന മൂലപാഠത്തിലെ ബന്ധവാക്യം ഒഴിവാക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ἕως τοῦ νῦν
  choice: ഇന്നുവരെ
  rationale: കാലപരിധി ലളിതവും കൃത്യവുമായി അറിയിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: οὐ μὴ γένηται
  choice: ഇനിയൊരിക്കലും അങ്ങനെയൊന്ന് ഉണ്ടാകുകയുമില്ല
  rationale: οὐ μή എന്ന ശക്തമായ ഭാവിനിഷേധം ‘ഇനിയൊരിക്കലും ... ഇല്ല’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു. ‘അങ്ങനെയൊന്ന്’ മുൻപറഞ്ഞ സമാനതയില്ലാത്ത കഷ്ടകാലത്തെ തിരികെ സൂചിപ്പിക്കുന്നു.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: ആ നാളുകൾ ... കഷ്ടകാലമായിരിക്കും
  rationale: ‘ആ നാളുകൾ’ തന്നെയാണ് കഷ്ടത്തിന്റെ കാലഘട്ടമാകുക എന്ന ഗ്രീക്കിലെ നാമിക വിധേയഘടന നിലനിർത്തുന്ന, മലയാളത്തിൽ ഗ്രാഹ്യമായ രൂപം.
theological_decisions:
- issue: ‘സൃഷ്ടി’ എന്ന ഭാഷയുടെ വ്യാപ്തി
  choice: ‘ദൈവം സൃഷ്ടിച്ച സൃഷ്ടിയുടെ ആരംഭംമുതൽ’ എന്ന് നിലനിർത്തി.
  alternative: ‘ലോകാരംഭംമുതൽ’ എന്ന കൂടുതൽ സ്വതന്ത്രമായ പ്രയോഗം.
  rationale: κτίσις, κτίζω എന്നീ പദങ്ങളും ദൈവം കർത്താവായുള്ള ബന്ധവാക്യവും മൂലപാഠത്തിൽ വ്യക്തമാണ്. അതിനാൽ പരാമർശത്തെ പ്രാദേശികമോ ഉടമ്പടിസംബന്ധമായോ ആയ ഒരു ആരംഭത്തിലേക്ക് ചുരുക്കാതെ സൃഷ്ടിവ്യാപ്തി സംരക്ഷിച്ചു.
- issue: കഷ്ടകാലത്തിന്റെ കാലാന്ത്യ വ്യാഖ്യാനം
  choice: അതിന്റെ അസമാനതയും ഭാവിയിൽ ആവർത്തിക്കില്ലെന്ന ശക്തമായ നിഷേധവും മാത്രം വ്യക്തമാക്കി.
  alternative: ഒരു പ്രത്യേക കാലാന്ത്യക്രമത്തോടോ ചരിത്രസംഭവത്തോടോ ഇത് തുറന്നുപറഞ്ഞ് ഒതുക്കുക.
  rationale: വാക്യം കഷ്ടത്തിന്റെ അപൂർവതയെ ശക്തമായി പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിനെ ഒരു പ്രത്യേക വ്യാഖ്യാനപദ്ധതിയിലേക്കു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല. ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില വിവർത്തനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദുരിതപീഡനം’ പോലുള്ള കൃത്രിമ പദങ്ങളും മൂലത്തിൽ ഇല്ലാത്ത ‘മഹാ’ എന്ന വർധകവും ഒഴിവാക്കി. ‘ദൈവം സൃഷ്ടിച്ച സൃഷ്ടി’ എന്ന ഉദ്ദേശ്യപൂർവമായ ആവർത്തനം മൂലപാഠത്തിന്റെ സൃഷ്ടിഭാഷ സംരക്ഷിക്കാനാണ്.
