id: MRK.13.12
reference: Mark 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: ml
  text: സഹോദരൻ സഹോദരനെ മരണത്തിന് ഏൽപ്പിക്കും[a]; പിതാവ് തന്റെ കുട്ടിയെയും മരണത്തിന് ഏൽപ്പിക്കും. മക്കൾ മാതാപിതാക്കൾക്കെതിരെ എഴുന്നേറ്റ് അവരെ വധിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒറ്റിക്കൊടുക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘ഏൽപ്പിക്കുക’, ‘കൈമാറുക’, സന്ദർഭത്തിൽ ‘ഒറ്റിക്കൊടുക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: ഏല്പിക്കും
  rationale: അധികാരികൾക്ക് കൈമാറുക എന്ന മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വഞ്ചന ഉൾപ്പെട്ടേക്കാമെങ്കിലും അത് മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: ἀδελφὸς ἀδελφὸν
  choice: സഹോദരൻ സഹോദരനെ
  rationale: ഗ്രീക്കിലെ ഏകവചനവും ശക്തമായ ആവർത്തനവും അതേപടി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: εἰς θάνατον
  choice: മരണത്തിന്
  rationale: കൈമാറ്റത്തിന്റെ ഉദ്ദേശ്യമോ ഫലമോ മരണമാണെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: πατὴρ τέκνον
  choice: പിതാവ് സ്വന്തം കുഞ്ഞിനെയും
  rationale: πατήρ എന്ന പുരുഷലിംഗസൂചന നിലനിർത്തുകയും τέκνον എന്ന ലിംഗനിരപേക്ഷ കുടുംബപദം ‘കുഞ്ഞ്’ എന്നു നൽകുകയും ചെയ്യുന്നു; മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ‘സ്വന്തം’ ചേർത്തിരിക്കുന്നു.
- source_word: τέκνα / γονεῖς
  choice: മക്കൾ / മാതാപിതാക്കൾ
  rationale: കുടുംബബന്ധം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വിശാലവുമായ മലയാള തുല്യപദങ്ങൾ.
- source_word: ἐπαναστήσονται ἐπὶ
  choice: എതിരെ എഴുന്നേറ്റ്
  rationale: ശത്രുതാപൂർവം എതിർത്തുനിൽക്കുക എന്ന ദൃശ്യാത്മകതയും ഔപചാരിക ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: θανατώσουσιν αὐτούς
  choice: അവരെ കൊല്ലിക്കും
  rationale: θανατόω ഇവിടെ വെറും ആക്രമണം മാത്രമല്ല, മരണത്തിനിടയാക്കുകയോ വധിപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം; ‘കൊല്ലിക്കും’ പീഡനസന്ദർഭത്തിലെ കാരണക/വധാർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രതിനിധാനപരമായ കുടുംബപ്രസ്താവനകളിലെ ലിംഗസൂചന
  choice: ആദ്യ രണ്ടു ഖണ്ഡങ്ങളിൽ ‘സഹോദരൻ’, ‘പിതാവ്’ എന്നീ നിർദിഷ്ട പദങ്ങൾ നിലനിർത്തി; τέκνα/γονεῖς എന്ന വിശാല പദങ്ങളെ ‘മക്കൾ/മാതാപിതാക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: എല്ലാ കുടുംബപദങ്ങളെയും ലിംഗനിരപേക്ഷമായി ‘സഹോദരങ്ങളിൽ ഒരാൾ’, ‘രക്ഷിതാവ്’ എന്നിങ്ങനെ നൽകുക.
  rationale: ἀδελφός, πατήρ എന്നിവ ഇവിടെ നിർദിഷ്ട പുരുഷലിംഗ രൂപങ്ങളാണ്; τέκνον, γονεῖς എന്നിവ കൂടുതൽ വിശാലമാണ്. അതിനാൽ മൂലപാഠത്തിലെ വ്യത്യാസം സംരക്ഷിച്ചു.
- issue: παραδίδωμι എന്ന പദത്തിലെ കൈമാറ്റം/വഞ്ചന എന്ന അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ഏല്പിക്കും’; ‘ഒറ്റിക്കൊടുക്കും’ എന്ന സന്ദർഭസാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ.
  alternative: മുഖ്യപാഠത്തിൽ ‘ഒറ്റിക്കൊടുക്കും’.
  rationale: ‘ഏല്പിക്കും’ അധികാരികൾക്കോ മരണത്തിനോ കൈമാറുന്ന പ്രവൃത്തിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘ഒറ്റിക്കൊടുക്കും’ ബന്ധവഞ്ചനയുടെ വ്യാഖ്യാനാത്മക ഭാവം കൂടുതൽ ശക്തമാക്കുന്നു. യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ കഠിനമായ കുടുംബവിരോധവും ആവർത്തനവും നിലനിർത്തി; രണ്ടാം ഖണ്ഡത്തിലെ ഒഴിവാക്കിയ ക്രിയ മലയാളത്തിൽ ‘അങ്ങനെതന്നെ ഏല്പിക്കും’ എന്നു വ്യക്തമാക്കി.
