revisions:
- from: “ഇവ എപ്പോൾ സംഭവിക്കും? ഇവയെല്ലാം പൂർത്തിയാകാനിരിക്കുമ്പോൾ അതിന്റെ അടയാളം എന്തായിരിക്കും? ഞങ്ങളോടു പറയണമേ,”[a]
  to: “ഞങ്ങളോടു പറയേണമേ, ഇവ എപ്പോൾ സംഭവിക്കും? ഇവയെല്ലാം പൂർത്തിയാകാനിരിക്കുമ്പോൾ അടയാളം എന്തായിരിക്കും?”
  rationale: The revision removes the unexpressed and ambiguous possessive ‘അതിന്റെ,’ retains the plural reference ‘ഇവയെല്ലാം’ and the impending/prospective nuance of μέλλῃ (‘പൂർത്തിയാകാനിരിക്കുമ്പോൾ’), and places the disciples’ request first, as in the Greek. The redundant register footnote is omitted.
  reviewer_model: gpt-5.6-terra
