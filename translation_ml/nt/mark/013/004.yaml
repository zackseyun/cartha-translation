id: MRK.13.4
reference: Mark 13:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: ml
  text: “ഞങ്ങളോടു പറയേണമേ, ഇവ എപ്പോൾ സംഭവിക്കും? ഇവയെല്ലാം പൂർത്തിയാകാനിരിക്കുമ്പോൾ അടയാളം എന്തായിരിക്കും?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: ഞങ്ങളോടു പറയണമേ
  rationale: ആജ്ഞാരൂപത്തിന്റെ അഭ്യർഥനാസ്വരം സ്വാഭാവികവും ആദരസൂചകവുമായ മലയാളത്തിൽ നൽകുന്നു; ἡμῖν എന്ന പരോക്ഷ കർമവും വ്യക്തമാക്കുന്നു.
- source_word: πότε ταῦτα ἔσται
  choice: ഇവ എപ്പോൾ സംഭവിക്കും?
  rationale: ἔσται അക്ഷരാർഥത്തിൽ ‘ആയിരിക്കും’ എന്നാണെങ്കിലും സംഭവങ്ങളെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘സംഭവിക്കും’ സ്വാഭാവികമാണ്; ταῦταയുടെ ബഹുവചനസൂചന ‘ഇവ’ നിലനിർത്തുന്നു.
- source_word: τί τὸ σημεῖον
  choice: അതിന്റെ അടയാളം എന്തായിരിക്കും?
  rationale: σημεῖον എന്നതിന് സാധാരണവും സന്ദർഭോചിതവുമായ ‘അടയാളം’ ഉപയോഗിക്കുന്നു; ഭാവികാല അർഥം മുൻവാക്യത്തിൽനിന്നും സന്ദർഭത്തിൽനിന്നും പൂരിപ്പിക്കുന്നു.
- source_word: ὅταν μέλλῃ
  choice: പൂർത്തിയാകാനിരിക്കുമ്പോൾ
  rationale: μέλλω + infinitive നൽകുന്ന വരാനിരിക്കുന്നതോ ആസന്നമായതോ ആയ പ്രവൃത്തിയുടെ ഭാവം ‘-ാനിരിക്കുമ്പോൾ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: ഇവയെല്ലാം പൂർത്തിയാകുക
  rationale: πάντα ചേർന്ന ταῦταയെ ‘ഇവയെല്ലാം’ എന്നു നൽകുന്നു; συντελεῖσθαιയുടെ കർമണിപ്രയോഗവും സമാപ്തിയിലെത്തുന്ന അർഥവും ‘പൂർത്തിയാകുക’ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: μέλλῃ + infinitive എന്ന പ്രയോഗത്തിന്റെ കാലാന്ത്യസംബന്ധിയായ ഭാവം
  choice: ‘പൂർത്തിയാകാനിരിക്കുമ്പോൾ’ എന്ന ആസന്ന/പ്രതീക്ഷിത ഭാവം നിലനിർത്തി.
  alternative: ‘ഇവയെല്ലാം പൂർത്തിയാകുമ്പോൾ’
  rationale: μέλλω നൽകുന്ന prospective nuance ലളിതഭാവിയാക്കി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു; അതേസമയം സംഭവങ്ങളുടെ കാലക്രമത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം സിദ്ധാന്തപരമായി നിർണയിക്കുന്നില്ല.
- issue: സൂചനയുടെ ഏകവചനവും ബന്ധവും
  choice: ‘അതിന്റെ അടയാളം’
  alternative: ‘അടയാളം’ / ‘എന്ത് അടയാളം’
  rationale: σημεῖον ഏകവചനമായി നിലനിർത്തുകയും ‘ഇവയെല്ലാം പൂർത്തിയാകാനിരിക്കുന്ന’ സാഹചര്യത്തോടുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ഗ്രീക്ക് വാക്യക്രമത്തിലെ അഭ്യർഥന ആദ്യം വരുന്നതിനു പകരം മലയാളത്തിൽ ചോദ്യങ്ങൾക്കു ശേഷം വരുന്നത് കൂടുതൽ സ്വാഭാവികമായതിനാൽ പുനഃക്രമീകരിച്ചു. μέλλῃയുടെ ആസന്നതാഭാവം മുഖ്യപാഠത്തിൽ തന്നെ നിലനിർത്തി.
