id: MRK.13.17
reference: Mark 13:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: ml
  text: എന്നാൽ ആ നാളുകളിൽ ഗർഭിണികൾക്കും മുലയൂട്ടുന്നവർക്കും അയ്യോ കഷ്ടം!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: അയ്യോ കഷ്ടം
  rationale: വരാനിരിക്കുന്ന ദുരിതത്തെക്കുറിച്ചുള്ള വിലാപത്തിന്റെയും മുന്നറിയിപ്പിന്റെയും ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിൽനിന്നുള്ള മൃദുവായ ആശയമാറ്റം സൂചിപ്പിക്കുന്നു; അതിരുകടന്ന വൈരുധ്യം സൃഷ്ടിക്കുന്നില്ല.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: ഗർഭിണികൾക്കും
  rationale: ‘ഗർഭത്തിൽ ഉള്ളവർ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാള അർഥം നൽകുന്നു; സ്ത്രീലിംഗ ബഹുവചന സൂചനയും നിലനിർത്തുന്നു.
- source_word: θηλαζούσαις
  choice: മുലയൂട്ടുന്നവർക്കും
  rationale: കുഞ്ഞിനെ മുലയൂട്ടുന്ന സ്ത്രീകളെയാണ് ഗ്രീക്ക് വർത്തമാന കൃദന്തം സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽ കുഞ്ഞ് എന്ന കർമം വ്യക്തമായതിനാൽ മലയാളത്തിൽ അത് പ്രത്യേകം ചേർക്കാതെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ആ നാളുകളിൽ
  rationale: സമീപസന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന കാലഘട്ടത്തിലേക്കുള്ള നേരിട്ടുള്ള ബന്ധം ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: οὐαί എന്നതിന്റെ സ്വഭാവം
  choice: വിലാപവും മുന്നറിയിപ്പും ചേർന്ന ‘അയ്യോ കഷ്ടം’
  alternative: ശാപപ്രഖ്യാപനമായി മാത്രം പരിഭാഷപ്പെടുത്തുക
  rationale: ഇവിടെ ദുരിതത്തിലാകുന്ന സ്ത്രീകൾക്കെതിരായ ശാപത്തേക്കാൾ അവരുടെ അവസ്ഥയെക്കുറിച്ചുള്ള ദുഃഖഭരിതമായ മുന്നറിയിപ്പാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഗ്രീക്കിലെ ഗൗരവം മൃദൂകരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗം. മൂലത്തിലെ സംക്ഷിപ്തതയും പ്രവചനാത്മകമായ വികാരശക്തിയും സംരക്ഷിച്ചു; മലയാളത്തിൽ ആവശ്യമില്ലാത്ത വിശദീകരണപരമായ പദങ്ങൾ ചേർത്തിട്ടില്ല.
