source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: ml
  text: എന്തെന്നാൽ വ്യാജ മശീഹമാരും[a] വ്യാജപ്രവാചകന്മാരും ഉയർന്നുവരും; തിരഞ്ഞെടുക്കപ്പെട്ടവരെ, സാധ്യമെങ്കിൽ[b], വഴിതെറ്റിക്കാനായി അവർ അടയാളങ്ങളും അത്ഭുതങ്ങളും പ്രവർത്തിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വ്യാജക്രിസ്തുക്കൾ.” ഗ്രീക്കിലെ ഈ സംയുക്തപദം ക്രിസ്തോസ് എന്ന പദത്തെ അടിസ്ഥാനമാക്കിയുള്ളതാണ്; ഇവിടെ അതിന് “മശീഹ” എന്ന പദവിയുടെ അർഥമാണുള്ളത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “അതു സാധ്യമാകുമെങ്കിൽ.” തിരഞ്ഞെടുക്കപ്പെട്ടവരെ യഥാർഥത്തിൽ വഴിതെറ്റിക്കാൻ കഴിയുമോ എന്ന് ഗ്രീക്ക് വാചകം വ്യക്തമായി തീർപ്പാക്കുന്നില്ല; വഞ്ചകരുടെ ലക്ഷ്യമാണ് അത് വ്യക്തമാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: ഉയർന്നുവരും
  rationale: ഈ സന്ദർഭത്തിൽ വ്യക്തികൾ രംഗത്തുവരുന്നതോ പ്രത്യക്ഷപ്പെടുന്നതോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. ദൈവം അവരെ എഴുന്നേൽപ്പിക്കുന്നു എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കിക്കൊണ്ട് പ്രവചനാത്മക മുന്നറിയിപ്പിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന് കാരണം വിശദീകരിക്കുന്ന ബന്ധകശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ψευδόχριστοι
  choice: വ്യാജമശീഹമാർ
  rationale: Χριστός ഇവിടെ പേരുപോലെയല്ല, ‘മശീഹ’ എന്ന പദവിയായാണ് സംയുക്തപദത്തിൽ വരുന്നത്. അതിനാൽ യഹൂദ മശീഹാപ്രതീക്ഷയുടെ പശ്ചാത്തലവും പദത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: ψευδοπροφῆται
  choice: വ്യാജപ്രവാചകന്മാർ
  rationale: സംയുക്തനാമത്തിന്റെ നേരിട്ടുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പരിഭാഷ.
- source_word: δώσουσιν σημεῖα καὶ τέρατα
  choice: അടയാളങ്ങളും അത്ഭുതങ്ങളും പ്രവർത്തിക്കും
  rationale: ‘നൽകും’ എന്ന പദാനുപദ രൂപത്തേക്കാൾ മലയാളത്തിൽ ഈ കൂട്ടുപദത്തോടൊപ്പം ‘പ്രവർത്തിക്കും’ സ്വാഭാവികമാണ്; എന്നാൽ സംഭവങ്ങളുടെ യാഥാർഥ്യമോ ദൈവിക ഉറവിടമോ പരിഭാഷ സ്വയം വിധിക്കുന്നില്ല.
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: വഴിതെറ്റിക്കാനായി
  rationale: ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ഗ്രീക്ക് ഘടനയും സത്യത്തിൽനിന്ന് അകറ്റുന്നുവെന്ന ദൃശ്യാർഥവും ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: εἰ δυνατόν
  choice: സാധ്യമെങ്കിൽ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത നിബന്ധന അതേ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു; അത് സാധ്യമാണെന്നോ അസാധ്യമാണെന്നോ പരിഭാഷ തീരുമാനിക്കുന്നില്ല.
- source_word: τοὺς ἐκλεκτούς
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവരെ
  rationale: ദൈവശാസ്ത്രപരമായ പ്രാധാന്യം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രൂപം.
theological_decisions:
- issue: ψευδόχριστοι എന്ന പദത്തിലെ Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: വ്യാജമശീഹമാർ
  alternative: വ്യാജക്രിസ്തുക്കൾ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമമായി അല്ല, അവകാശപ്പെടുന്ന മശീഹാപദവിയായാണ് പ്രവർത്തിക്കുന്നത്. ‘മശീഹ’ അർഥം കൂടുതൽ സുതാര്യമാക്കുന്നു; പരമ്പരാഗത മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: εἰ δυνατόν തിരഞ്ഞെടുക്കപ്പെട്ടവർ വഴിതെറ്റിക്കപ്പെടാനുള്ള സാധ്യതയെക്കുറിച്ച് എന്ത് സൂചിപ്പിക്കുന്നു
  choice: സാധ്യമെങ്കിൽ
  alternative: അതു സാധ്യമാകുമെങ്കിൽ
  rationale: മൂലപാഠം നിബന്ധന ഉന്നയിക്കുന്നുവെങ്കിലും അന്തിമമായി വഴിതെറ്റിക്കൽ സാധ്യമാണോ എന്ന് വ്യക്തമായി തീർപ്പാക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘അടയാളങ്ങളും അത്ഭുതങ്ങളും’ എന്ന പരിചിതമായ ബൈബിൾ കൂട്ടുപദം നിലനിർത്തി. അവസാന ഭാഗത്തിന്റെ ഗ്രീക്ക് ക്രമത്തോടു ചേർന്ന് ‘സാധ്യമെങ്കിൽ’ എന്നത് ‘തിരഞ്ഞെടുക്കപ്പെട്ടവരെ’ എന്ന കർമത്തിന് മുമ്പിൽ വെച്ചതിനാൽ മൂലത്തിലെ നിബന്ധനാത്മക അനിശ്ചിതത്വം സംരക്ഷിക്കപ്പെടുന്നു.
