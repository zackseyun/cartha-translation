id: MRK.13.34
reference: Mark 13:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: ml
  text: അത് സ്വന്തം വീട് വിട്ട് യാത്രയ്ക്കുപോയ ഒരു മനുഷ്യനെപ്പോലെയാണ്. അവൻ തന്റെ അടിമകൾക്ക് അധികാരം നൽകി, ഓരോരുത്തനും അവനവന്റെ ജോലി ഏൽപ്പിച്ചു, വാതിൽകാവൽക്കാരനോട് ഉണർന്നിരിക്കാൻ കല്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉണർന്നിരിക്കുക” എന്നതിന് “ജാഗരൂകനായിരിക്കുക” എന്നും അർത്ഥമാകാം.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ὡς
  choice: അത് ... പോലെയാണ്
  rationale: മുൻപുള്ള ആഹ്വാനത്തോട് ഈ ഉപമയെ ബന്ധിപ്പിക്കുന്ന ഗ്രീക്ക് താരതമ്യപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἄνθρωπος ἀπόδημος
  choice: യാത്രപോയ ഒരു മനുഷ്യൻ
  rationale: സ്വന്തം സ്ഥലത്തുനിന്ന് അകലെ യാത്രയിലായിരിക്കുന്ന പുരുഷകഥാപാത്രത്തെ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: സ്വന്തം വീട് വിട്ട്
  rationale: അയാളുടെ വീട് വിട്ടുപോയെന്ന അർത്ഥവും കർത്താവിനോടുള്ള ബന്ധവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν
  choice: തന്റെ അടിമകൾക്ക് അധികാരം നൽകി
  rationale: δίδωμι എന്നതിന്റെ 'നൽകുക' എന്ന നേരിട്ടുള്ള അർത്ഥവും ἐξουσίαയുടെ ഏൽപ്പിക്കപ്പെട്ട അധികാരവും, δοῦλος സൂചിപ്പിക്കുന്ന യജമാനാധീന നിലയും സംരക്ഷിക്കുന്നു.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: ഓരോരുത്തനും അവനവന്റെ ജോലി ഏൽപ്പിച്ചു
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത ഘടന മലയാളത്തിൽ ഗ്രഹിക്കാൻ ആവശ്യമായ ക്രിയ വ്യക്തമാക്കുന്നു; ഓരോ വ്യക്തിക്കും അവരവരുടെ ജോലി എന്ന വിതരണാർഥം നിലനിർത്തുന്നു.
- source_word: τῷ θυρωρῷ
  choice: വാതിൽകാവൽക്കാരനോട്
  rationale: വീടിന്റെ വാതിൽ കാത്തുസൂക്ഷിക്കുന്ന വ്യക്തിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: ഉണർന്നിരിക്കാൻ കല്പിച്ചു
  rationale: കല്പനയുടെ അധികാരഭാവവും γρηγορέωയുടെ അക്ഷരാർഥമായ ഉണർന്നിരിക്കലും ഈ പ്രസംഗത്തിലെ ജാഗ്രതാഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: വീട്ടുപശ്ചാത്തലത്തിലെ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: ഈ ഉപമയിൽ യജമാനന്റെ അധികാരത്തിൻ കീഴിലുള്ള ബന്ധിത വീട്ടുജോലിക്കാരെയാണ് പദം സൂചിപ്പിക്കുന്നത്. 'അടിമകൾ' സാമൂഹിക യാഥാർഥ്യം മയപ്പെടുത്താതെ പ്രകടിപ്പിക്കുന്നു; മറ്റു മലയാള പദങ്ങൾ ബന്ധത്തിന്റെ ശക്തി കുറയ്ക്കാം.
- issue: γρηγορῇ എന്നതിലെ അക്ഷരാർഥവും രൂപകാർഥവും
  choice: ഉണർന്നിരിക്കാൻ
  alternative: ജാഗരൂകനായിരിക്കാൻ / കാവലിരിക്കാനായി
  rationale: അക്ഷരാർഥമായ ഉറങ്ങാതിരിക്കലും ശിഷ്യന്മാരോടുള്ള ആത്മീയ ജാഗ്രതാഹ്വാനവും ഒരുമിച്ച് കേൾക്കാൻ കഴിയുന്ന വിധം യഥാർഥ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ പങ്കാളിക്രിയകളുടെ നീണ്ട ഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ഉപമയുടെ ക്രമവും അധികാരബന്ധവും സംരക്ഷിച്ചു.
