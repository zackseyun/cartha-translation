id: MRK.13.8
reference: Mark 13:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: ml
  text: എന്തെന്നാൽ, ജനത ജനതയ്ക്കെതിരെയും രാജ്യം രാജ്യത്തിനെതിരെയും എഴുന്നേൽക്കും. പലയിടങ്ങളിലും ഭൂകമ്പങ്ങൾ ഉണ്ടാകും; ക്ഷാമങ്ങളും ഉണ്ടാകും. ഇവ പ്രസവവേദനകളുടെ ആരംഭമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രസവകാല വേദനകൾ.’ ഗ്രീക്കിലെ ദൃശ്യരൂപം പ്രസവത്തോടനുബന്ധിച്ച വേദനകളുടേതാണ്; തുടർന്നുവരുന്നതിനു മുമ്പുള്ള കഷ്ടതകളെ സൂചിപ്പിക്കാൻ അത് ഇവിടെ രൂപകമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: എഴുന്നേൽക്കും
  rationale: ἐγείρω എന്ന ക്രിയയുടെ ഭാവികാല കർമണിപ്രയോഗം ഇവിടെ ഒരു ജനവിഭാഗം മറ്റൊന്നിനെതിരെ പൊരുതാൻ ഉയരുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. മലയാളത്തിൽ ‘എഴുന്നേൽക്കും’ ഈ സംഘർഷഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: ജനത ജനതയ്ക്കെതിരെ
  rationale: ἔθνος എന്നത് ജനതയെയോ രാഷ്ട്രത്തെയോ സൂചിപ്പിക്കാം. βασιλείαയോടുള്ള സമാന്തരപ്രയോഗത്തിൽ ‘ജനത’ മനുഷ്യസമൂഹത്തെ സൂചിപ്പിക്കുകയും ‘രാജ്യം’ എന്ന അടുത്ത പദത്തിൽനിന്ന് ആവശ്യമായ വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: രാജ്യം രാജ്യത്തിനെതിരെ
  rationale: ഇവിടെ βασιλεία രാജഭരണം എന്ന അമൂർത്ത ആശയമല്ല, രാഷ്ട്രീയ അധികാരപരിധിയായ രാജ്യമാണ്. ഈ വിവർത്തനം മൂലത്തിലെ സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
- source_word: σεισμοὶ
  choice: ഭൂകമ്പങ്ങൾ
  rationale: ഈ സന്ദർഭത്തിൽ σεισμός ഭൂകമ്പത്തെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്; ‘ഭൂകമ്പങ്ങൾ’ സാധാരണവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: κατὰ τόπους
  choice: പലയിടങ്ങളിലും
  rationale: κατάയും ബഹുവചനമായ τόπουςഉം ചേർന്നത് വിവിധ സ്ഥലങ്ങളിലായുള്ള സംഭവങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘പലയിടങ്ങളിലും’ അതിന്റെ വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λιμοί
  choice: ക്ഷാമങ്ങൾ
  rationale: λιμός സാധാരണ വിശപ്പിനേക്കാൾ വ്യാപകമായ ആഹാരക്ഷാമത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘ക്ഷാമങ്ങൾ’ നേരിട്ടും കൃത്യവുമാണ്.
- source_word: ἀρχὴ
  choice: ആരംഭം
  rationale: ഇവ തുടക്കഘട്ടമാണെന്ന ആശയം ‘ആരംഭം’ വ്യക്തമായി നൽകുന്നു; ഇതിനു ശേഷമുള്ളതെന്തെന്ന് വിവർത്തനം നിർവചിക്കുന്നില്ല.
- source_word: ὠδίνων
  choice: പ്രസവവേദനകളുടെ
  rationale: ὠδίν പ്രസവവുമായി ബന്ധപ്പെട്ട വേദനകളെ സൂചിപ്പിക്കുകയും ഇവിടെ വരാനിരിക്കുന്നതിനുമുമ്പുള്ള കഷ്ടതയുടെ രൂപകമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്നു. ‘പ്രസവവേദനകൾ’ ആ ദൃശ്യരൂപം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ταῦτα
  choice: ഇവ
  rationale: മുൻപു പറഞ്ഞ ഒന്നിലധികം സംഭവങ്ങളെയാണ് ταῦτα ചൂണ്ടിക്കാണിക്കുന്നത്; മലയാളത്തിൽ ‘ഇവ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ἀρχὴ ὠδίνων എന്ന അന്ത്യകാലരൂപകം
  choice: ഇവ പ്രസവവേദനകളുടെ ആരംഭമാണെന്ന് രൂപകത്തോടെതന്നെ അവതരിപ്പിച്ചു.
  alternative: ഇവ വെറും കഷ്ടതകളുടെ തുടക്കമാണെന്ന് രൂപകം ഒഴിവാക്കി പറയുക; അല്ലെങ്കിൽ ഒരു നിർദിഷ്ട അന്ത്യകാലക്രമം സൂചിപ്പിക്കുന്നതായി വിശദീകരിക്കുക.
  rationale: മൂലപാഠം കഷ്ടതയെ പ്രസവവേദനയോട് ഉപമിക്കുന്നു; എന്നാൽ തുടർന്നുവരുന്നതിന്റെ സ്വഭാവമോ കൃത്യമായ അന്ത്യകാലക്രമമോ ഇവിടെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ രൂപകവും അതിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ‘ജനത ... ജനത’, ‘രാജ്യം ... രാജ്യം’ എന്ന സമാന്തരഘടന നിലനിർത്തി; വാക്യം വ്യക്തമായി വായിക്കാനായി വിഭക്തിപ്രത്യയങ്ങൾ ചേർത്തു. γάρ എന്ന ബന്ധപദം ‘എന്തെന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം സംരക്ഷിച്ചു.
