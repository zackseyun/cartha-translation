id: MRK.13.16
reference: Mark 13:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: ml
  text: വയലിലുള്ളവൻ തന്റെ മേലങ്കി എടുക്കാൻ തിരിച്ചുപോകരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പുറവസ്ത്രം.’
    reason: ἱμάτιον എന്നതിന് ‘മേലങ്കി’യ്ക്കു പുറമേ ‘പുറവസ്ത്രം’ എന്ന പൊതുവായ അർത്ഥവികൽപവും ഉണ്ട്.
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: വയലിലുള്ളവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പ്രയോഗം വയലിലുള്ള ഒരു വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഏകവചനരൂപം സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: ἀγρός
  choice: വയൽ
  rationale: സന്ദർഭത്തിൽ കൃഷിസ്ഥലമോ വയലോ ആണ് ഉദ്ദേശ്യം; ‘വയൽ’ നേരിട്ടും സാധാരണക്കാർക്ക് വ്യക്തമായും അർത്ഥം നൽകുന്നു.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: പിന്നിലേക്കു തിരിയരുത്
  rationale: μή ചേർന്ന aorist imperative-ന്റെ അടിയന്തരമായ നിരോധനശക്തി കാത്തുസൂക്ഷിക്കുകയും εἰς τὰ ὀπίσω എന്ന ദിശാസൂചന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἆραι
  choice: എടുക്കാൻ
  rationale: 'ഇവിടെ infinitive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു: മേലങ്കി കൈക്കലാക്കുന്നതിനായി മടങ്ങുക. ‘എടുക്കാൻ’ സ്വാഭാവികവും അർത്ഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാത്തതുമാണ്.'
- source_word: ἱμάτιον
  choice: മേലങ്കി
  rationale: ἱμάτιον സാധാരണയായി പുറമേ ധരിക്കുന്ന വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘മേലങ്കി’ മലയാളത്തിൽ കൃത്യവും ഗ്രഹിക്കാൻ എളുപ്പവുമാണ്.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: വിഷയത്തിലേക്കുതന്നെ മടങ്ങുന്ന ഉടമസ്ഥത മലയാളത്തിൽ ‘തന്റെ’ എന്ന പ്രതിഫലന സർവനാമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ഏകവചനബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൊതുവായ പുല്ലിംഗ ഏകവചന പരാമർശം
  choice: ‘വയലിലുള്ളവൻ ... തന്റെ മേലങ്കി’ എന്ന ഏകവചന പൊതുപരാമർശം നിലനിർത്തി.
  alternative: ‘വയലിലുള്ളവർ ... അവരുടെ മേലങ്കികൾ’ എന്ന ബഹുവചനമോ ‘വയലിലുള്ള വ്യക്തി’ എന്ന ലിംഗനിഷ്പക്ഷമായ വിശദീകരണമോ.
  rationale: ഗ്രീക്ക് പാഠം പുല്ലിംഗ ഏകവചന ആർട്ടിക്കിൾ പ്രയോഗവും ഏകവചന സർവനാമവും ഉപയോഗിക്കുന്നു. മലയാളത്തിലെ രൂപം ഈ വ്യാകരണഘടന നിലനിർത്തുന്നു; എന്നാൽ പ്രസ്താവനയെ പുരുഷന്മാർക്കു മാത്രമായി പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. വാക്യത്തിന്റെ അടിയന്തരമായ നിരോധനഭാവവും ഏകവചന ഘടനയും സംരക്ഷിച്ചു.
