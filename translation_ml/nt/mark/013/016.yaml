revisions:
- from: വയലിലുള്ളവൻ തന്റെ മേലങ്കി എടുക്കാൻ പിന്നിലേക്കു തിരിയരുത്.[a]
  to: വയലിലുള്ളവൻ തന്റെ മേലങ്കി എടുക്കാൻ തിരിച്ചുപോകരുത്.[a]
  rationale: The revision clarifies that the prohibited action is returning to retrieve the garment, not simply turning around. It also makes the lexical footnote more accurate and natural in Malayalam.
