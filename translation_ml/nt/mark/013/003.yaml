reference: Mark 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: ml
  text: 'അവൻ ദൈവാലയത്തിന് എതിരെയുള്ള ഒലിവുമലയിൽ ഇരിക്കുമ്പോൾ, പത്രോസും യാക്കോബും യോഹന്നാനും അന്ത്രെയാസും സ്വകാര്യമായി അവനോടു ചോദിച്ചുകൊണ്ടിരുന്നു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: അവൻ ... ഇരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തത്തോടുകൂടിയ genitive absolute, പശ്ചാത്തലത്തിൽ നടന്നുകൊണ്ടിരിക്കുന്ന സാഹചര്യപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇരിക്കുമ്പോൾ’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ഒലിവുമലയിൽ
  rationale: സ്ഥിതിയെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ εἰς സ്ഥലാർത്ഥത്തിലാണ്; അറിയപ്പെടുന്ന ഭൂമിശാസ്ത്രനാമം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: ദൈവാലയത്തിന് എതിരെയുള്ള
  rationale: κατέναντι ‘എതിർവശത്ത്/അഭിമുഖമായി’ എന്ന സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നു. ἱερόν മുഴുവൻ ദൈവാലയസമുച്ചയത്തെ സൂചിപ്പിക്കാമെങ്കിലും, സന്ദർഭത്തിൽ ‘ദൈവാലയം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐπηρώτα
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: Imperfect രൂപം തുടരുന്ന അല്ലെങ്കിൽ ആവർത്തിച്ച ചോദ്യംചെയ്യലിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: κατ’ ἰδίαν
  choice: സ്വകാര്യമായി
  rationale: മറ്റുള്ളവരിൽനിന്ന് വേറിട്ട്, സ്വകാര്യമായി എന്ന അർത്ഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: പത്രോസും യാക്കോബും യോഹന്നാനും അന്ത്രയോസും
  rationale: പേരുകളുടെ പരമ്പരയിലെ ആവർത്തിത καί മലയാളത്തിലെ ‘-ഉം’ ഘടനയിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള ചോദ്യത്തിലേക്ക് നീളുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു. ἱερόν എന്ന പദത്തിന്റെ ‘ദൈവാലയസമുച്ചയം’ എന്ന സൂക്ഷ്മത ഈ സന്ദർഭത്തിൽ അർത്ഥവ്യത്യാസം സൃഷ്ടിക്കാത്തതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
