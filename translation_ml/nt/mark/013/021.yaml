id: MRK.13.21
reference: Mark 13:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: ml
  text: പിന്നെ ആരെങ്കിലും നിങ്ങളോട്, “നോക്കൂ, മശീഹാ[a] ഇവിടെ!” എന്നോ, “നോക്കൂ, അവിടെ!” എന്നോ പറഞ്ഞാൽ അതു വിശ്വസിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.”
    reason: χριστός എന്ന പദത്തിന്റെ പരമ്പരാഗത പകരംവിവർത്തനം നൽകുന്നു.
lexical_decisions:
- source_word: καὶ τότε
  choice: പിന്നെ
  rationale: മുൻപ്രസംഗത്തോടുള്ള ബന്ധവും തുടർന്നുള്ള സമയസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: ആരെങ്കിലും നിങ്ങളോട് … പറഞ്ഞാൽ
  rationale: പൊതുവായ വ്യവസ്ഥാസ്വഭാവവും അനിശ്ചിതനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന τις എന്ന പദവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ἴδε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞാരൂപത്തെ ആധുനികവും ശക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: സമീപസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ὧδε എന്ന ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള തുല്യപദമാണ്.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ χριστός ഇവിടെ വ്യക്തിനാമത്തേക്കാൾ അഭിഷിക്തനായ വിടുതൽദാതാവിന്റെ പദവിയായി പ്രവർത്തിക്കുന്നു; അതിനാൽ ശീർഷകഭാവം നിലനിർത്താൻ ‘മശീഹാ’ തെരഞ്ഞെടുത്തു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: ὧδε എന്നതോടുള്ള സമീപ–ദൂര സ്ഥലവ്യത്യാസം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: μὴ πιστεύετε
  choice: അതു വിശ്വസിക്കരുത്
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല; ഇവിടെ മുന്നറിയിപ്പ് പറയുന്ന വ്യക്തിയെക്കാൾ ഉന്നയിക്കപ്പെടുന്ന അവകാശവാദം വിശ്വസിക്കരുതെന്നതാണ്. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘അതു’ ചേർത്തു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: അന്ത്യകാല അവകാശവാദങ്ങളുടെ ഈ സന്ദർഭത്തിൽ പദം യേശുവിന്റെ പേരുപോലെ അല്ല, അഭിഷിക്തനായ രക്ഷകന്റെ പദവിയായാണ് ഉപയോഗിക്കുന്നത്. ‘മശീഹാ’ ആ പദവിസ്വഭാവം വ്യക്തമാക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: πιστεύετε എന്നതിന്റെ സൂചിത കർമം
  choice: അവകാശവാദത്തെ സൂചിപ്പിക്കുന്ന ‘അതു’
  alternative: അവനെ വിശ്വസിക്കരുത്
  rationale: ഗ്രീക്ക് കർമത്തെ വ്യക്തമാക്കാത്തതിനാൽ മുന്നറിയിപ്പ് പ്രസ്താവനയെയോ അവകാശവാദത്തെയോ ലക്ഷ്യമിടുന്നതായി തുറന്ന നിലയിൽ വയ്ക്കുന്നു; ‘അവനെ’ എന്നു പറഞ്ഞാൽ പ്രസംഗിക്കുന്ന വ്യക്തിയിലേക്കു മാത്രം അർത്ഥം ചുരുങ്ങും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഇതാ’ എന്ന അല്പം ഔപചാരികമായ രൂപത്തിനു പകരം ശ്രദ്ധ ക്ഷണിക്കുന്ന സ്വാഭാവികമായ ‘നോക്കൂ’ ഉപയോഗിച്ചു.
