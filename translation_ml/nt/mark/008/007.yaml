  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶχον ἰχθύδια ὀλίγα· καὶ εὐλογήσας ⸀αὐτὰ εἶπεν ⸂καὶ ταῦτα παρατιθέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: ml
  text: അവരുടെ പക്കൽ കുറച്ച് ചെറുമീനുകളും ഉണ്ടായിരുന്നു. അവയെ അനുഗ്രഹിച്ചശേഷം, ഇവയും വിളമ്പാൻ അവൻ പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰχθύδια
  choice: ചെറുമീനുകൾ
  rationale: ദിമിന്യൂട്ടീവ് രൂപം മീനുകളുടെ ചെറിയ വലുപ്പം സൂചിപ്പിക്കുന്നു; ആ സൂക്ഷ്മത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὀλίγα
  choice: കുറച്ച്
  rationale: എണ്ണാവുന്ന വസ്തുക്കളുടെ പരിമിതമായ എണ്ണം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εὐλογήσας
  choice: അനുഗ്രഹിച്ചശേഷം
  rationale: എഒറിസ്റ്റ് കൃദന്തത്തിന്റെ മുൻകാലപ്രവൃത്തി വ്യക്തമാക്കുകയും εὐλογέω എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: αὐτά
  choice: അവയെ
  rationale: നപുംസകലിംഗ ബഹുവചന സർവനാമം മുമ്പു പറഞ്ഞ ചെറുമീനുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: καὶ ταῦτα
  choice: ഇവയും
  rationale: καί എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽബലവും ταῦτα എന്ന സൂചനാസർവനാമത്തിന്റെ ഊന്നലും ചുരുക്കമായും സ്വാഭാവികമായും പകരുന്നു.
- source_word: παρατιθέναι
  choice: വിളമ്പാൻ
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ παρατίθημι എന്നത് ഭക്ഷണം മുന്നിൽ വെക്കുക, അഥവാ വിളമ്പുക, എന്നർഥം നൽകുന്നു; മലയാളത്തിൽ 'വിളമ്പാൻ' സ്വാഭാവികവും സജീവവുമായ പ്രയോഗമാണ്.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; അനന്തക്രിയാരൂപം സന്ദർഭത്തിൽ നിർദേശം സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ മാന്യമായ ശൈലി. ഗ്രീക്കിലെ രണ്ട് καί ബന്ധങ്ങളെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ പുനഃക്രമീകരിച്ചു. παρατιθέναι എന്നതിലെ പരോക്ഷ കൽപ്പനാഭാവം 'വിളമ്പാൻ ... പറഞ്ഞു' എന്ന ഘടനയിൽ സംരക്ഷിച്ചു; കർത്താവ് ശിഷ്യന്മാരാണെന്ന് പാഠത്തിൽ പ്രത്യേകം ചേർത്തിട്ടില്ല.
