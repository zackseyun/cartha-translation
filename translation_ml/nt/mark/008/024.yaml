source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: ml
  text: 'അവൻ മേലോട്ടു നോക്കി പറഞ്ഞു: “ഞാൻ മനുഷ്യരെ കാണുന്നു; അവർ നടക്കുന്ന മരങ്ങളെപ്പോലെ എനിക്കു കാണപ്പെടുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: നോക്കിയിട്ട്
  rationale: സന്ദർഭത്തിൽ കണ്ണുതുറന്ന്/വീണ്ടും കാഴ്ച ലഭിച്ച് നോക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി, അനാവശ്യമായി ‘മുകളിലേക്ക്’ എന്ന അർഥം ഉറപ്പിക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: τοὺς ἀνθρώπους
  choice: മനുഷ്യരെ
  rationale: പൊതുവായ ബഹുവചനമായ ‘ആളുകളെ/മനുഷ്യരെ’ എന്ന അർഥം; ദൃശ്യവിവരണത്തിന് ‘മനുഷ്യരെ’ യോജിക്കുന്നു.
- source_word: ὅτι
  choice: ;
  rationale: ഇവിടെ ആദ്യ പ്രസ്താവനയെ തുടർന്നുള്ള തിരിച്ചറിയൽ-വിശദീകരണത്തിന് തുടക്കം കുറിക്കുന്നു. ‘കാരണം’ എന്നു കർശനമായി കാരണം സൂചിപ്പിക്കുന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായ വിശദീകരണബന്ധം വിരാമചിഹ്നത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ὡς δένδρα
  choice: മരങ്ങൾപോലെ
  rationale: മങ്ങിയ കാഴ്ചയിൽ മനുഷ്യരുടെ രൂപം മരങ്ങളോട് സാദൃശ്യമുള്ളതായി തോന്നുന്നതിനെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: περιπατοῦντας
  choice: നടക്കുന്നതായി
  rationale: നടക്കുന്നവർ മനുഷ്യരാണെന്ന ഗ്രീക്ക് വാക്യഘടനയിലെ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: സൗഖ്യം ലഭിച്ച ഘട്ടത്തിലെ ഭാഗികമായ കാഴ്ചയുടെ വിവരണം
  choice: അവർ മരങ്ങൾപോലെ നടക്കുന്നതായി എനിക്കു കാണാം
  alternative: മരങ്ങൾ നടക്കുന്നതുപോലെ മനുഷ്യരെ ഞാൻ കാണുന്നു
  rationale: മനുഷ്യരെ കാണുന്നുണ്ടെങ്കിലും അവരുടെ രൂപം മരങ്ങൾപോലെ തോന്നുന്നു എന്ന മൂലവാക്യത്തിലെ അസാധാരണവും ഭാഗികവുമായ ദൃശ്യാനുഭവം വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ഉദ്ധരണിയിലെ മങ്ങിയ കാഴ്ചയുടെ സ്വാഭാവികവും അല്പം അസാധാരണവുമായ വിവരണം സംരക്ഷിച്ചിട്ടുണ്ട്.
