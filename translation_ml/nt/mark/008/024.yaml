revisions:
- from: 'അവൻ നോക്കിയിട്ട് പറഞ്ഞു: “ഞാൻ മനുഷ്യരെ കാണുന്നു; അവർ മരങ്ങൾപോലെ നടക്കുന്നതായി എനിക്കു കാണാം.”'
  to: 'അവൻ മേലോട്ടു നോക്കി പറഞ്ഞു: “ഞാൻ മനുഷ്യരെ കാണുന്നു; അവർ നടക്കുന്ന മരങ്ങളെപ്പോലെ എനിക്കു കാണപ്പെടുന്നു.”'
  rationale: 'The revision preserves the Greek''s vivid, somewhat awkward description of partially restored sight: the people are visible, but they appear like trees that are walking. It also retains the directional nuance of ἀναβλέψας and uses natural modern standard Malayalam without adding an interpretive explanation.'
