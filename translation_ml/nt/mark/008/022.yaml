revisions:
- from: അവർ ബേത്ത്സയിദയിൽ എത്തി. ആളുകൾ ഒരു അന്ധനെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്ന്, അവനെ തൊടണമെന്ന് യേശുവിനോട് അപേക്ഷിച്ചു.
  to: അവർ ബേത്ത്സയിദയിൽ എത്തി. അവർ ഒരു അന്ധനെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു; അവനെ തൊടണമെന്ന് യേശുവിനോട് അപേക്ഷിച്ചു.
  rationale: A revision is needed to remove the unsupported specification ‘ആളുകൾ.’ ‘ബേത്ത്സയിദയിൽ എത്തി’ is an idiomatic Malayalam rendering of movement to a named destination. Jesus is named in the second sentence solely to resolve referential ambiguity inherent in Malayalam pronouns; no additional participant or theological interpretation is introduced.
