id: MRK.8.22
reference: Mark 8:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: ml
  text: അവർ ബേത്ത്സയിദയിൽ എത്തി. അവർ ഒരു അന്ധനെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു; അവനെ തൊടണമെന്ന് യേശുവിനോട് അപേക്ഷിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: എത്തി
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലം ഇവിടെ ചരിത്രവർത്തമാനമാണ്; സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലമായ ‘എത്തി’ സംഭവക്രമം വ്യക്തമായി നൽകുന്നു.
- source_word: εἰς Βηθσαϊδάν
  choice: ബേത്ത്സയിദയിൽ
  rationale: ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന εἰς മലയാളത്തിൽ ‘ബേത്ത്സയിദയിൽ എത്തി’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ പകർന്നു; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: φέρουσιν
  choice: കൊണ്ടുവന്ന്
  rationale: ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനരീതിയിൽ ഭൂതകാലബന്ധമുള്ള രൂപത്തിൽ നൽകി. ‘കൊണ്ടുവന്നു’ എന്നത് വിശാലമായ അർഥം നിലനിർത്തുന്നു; ചുമന്നുവെന്ന രീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: τυφλὸν
  choice: ഒരു അന്ധനെ
  rationale: വിശേഷണം ഇവിടെ നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന പുരുഷലിംഗ ഏകവചനമാണ്; ‘ഒരു അന്ധനെ’ സംക്ഷിപ്തവും സ്വാഭാവികവും മൂലപാഠസമ്മതവുമാണ്.
- source_word: παρακαλοῦσιν
  choice: അപേക്ഷിച്ചു
  rationale: സാധാരണ ചോദിക്കലിനെക്കാൾ ഗൗരവമുള്ള അഭ്യർഥനയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘അപേക്ഷിച്ചു’ ആ വിനയവും തീവ്രതയും മാന്യമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: അവനെ തൊടണമെന്ന്
  rationale: ἵνα സഹിതമുള്ള ഉപവാക്യം അഭ്യർഥനയുടെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘തൊടണമെന്ന് ... അപേക്ഷിച്ചു’ എന്ന ഘടന സ്വാഭാവികമാണ്; ἅπτομαι എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘തൊടുക’ നിലനിർത്തി.
- source_word: καὶ
  choice: അവർ ...; ആളുകൾ ... -ന്ന്
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ച καί ലളിതമായ സംഭവബന്ധം സൃഷ്ടിക്കുന്നു. ഓരോ വാക്യവും ‘എന്നിട്ട്/പിന്നെ’ എന്നു വ്യാഖ്യാനിക്കാതെ, മലയാളത്തിലെ വാക്യക്രമവും ബന്ധകക്രിയാരൂപവും ഉപയോഗിച്ച് ആ പരസ്പരബന്ധിതമായ ആഖ്യാനപ്രവാഹം നിലനിർത്തി.
- source_word: αὐτῷ / αὐτόν
  choice: യേശുവിന്റെ അടുക്കൽ / യേശുവിനോട്
  rationale: ഗ്രീക്കിലെ സർവനാമങ്ങളുടെ സൂചിത വ്യക്തി സന്ദർഭത്തിൽ യേശുവാണ്. മലയാളത്തിൽ തുടർച്ചയായ ‘അവൻ/അവനെ’ രൂപങ്ങൾ ആശയക്കുഴപ്പം സൃഷ്ടിക്കുന്നതിനാൽ പേര് ആവർത്തിച്ച് പരാമർശങ്ങളെ വ്യക്തമാക്കി; പുതിയ വിവരമൊന്നും ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അന്ധൻ’ എന്ന പരമ്പരാഗതവും വ്യാപകമായി മനസ്സിലാകുന്നതുമായ പദം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം സ്വാഭാവിക മലയാള ഭൂതകാല ആഖ്യാനമായി നൽകി; സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ ‘യേശു’ എന്ന പേര് വ്യക്തമാക്കി.
