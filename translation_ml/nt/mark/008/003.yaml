id: MRK.8.3
reference: Mark 8:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀπολύσω αὐτοὺς νήστεις εἰς οἶκον αὐτῶν, ἐκλυθήσονται ἐν τῇ ὁδῷ· ⸂καί τινες⸃ αὐτῶν ⸀ἀπὸ μακρόθεν ⸀ἥκασιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: ml
  text: അവരെ വിശന്നവരായി അവരുടെ വീടുകളിലേക്ക് പറഞ്ഞയച്ചാൽ, അവർ വഴിയിൽ തളർന്നുവീഴും; കൂടാതെ, അവരിൽ ചിലർ ദൂരെനിന്ന് വന്നവരാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολύσω
  choice: പറഞ്ഞയച്ചാൽ
  rationale: ജനക്കൂട്ടത്തെ മടക്കി അയക്കുന്നതാണ് സന്ദർഭം; ‘വിട്ടയക്കുക’ എന്നതിലുപരി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: νήστεις
  choice: വിശന്നവരായി
  rationale: മതപരമായ മനഃപൂർവ ഉപവാസമെന്നല്ല, ഭക്ഷണമില്ലാത്ത അവസ്ഥയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: εἰς οἶκον αὐτῶν
  choice: വീടുകളിലേക്കു
  rationale: ഓരോരുത്തരും താന്താങ്ങളുടെ വീട്ടിലേക്കു പോകുന്ന വിതരണാർഥം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐκλυθήσονται
  choice: തളർന്നുവീഴും
  rationale: ശക്തി ക്ഷയിച്ച് യാത്രയിൽ വീണുപോകാവുന്ന ഗൗരവമുള്ള അവസ്ഥയെ കൃത്യവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐν τῇ ὁδῷ
  choice: വഴിയിൽ
  rationale: യാത്രയ്ക്കിടയിൽ എന്ന അർഥം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: καί τινες αὐτῶν
  choice: അവരിൽ ചിലർ
  rationale: ജനക്കൂട്ടത്തിലെ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἀπὸ μακρόθεν
  choice: ദൂരെനിന്നു
  rationale: അവർ സഞ്ചരിച്ചുവന്ന ദൂരത്തെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἥκασιν
  choice: വന്നവരാണ്
  rationale: ദൂരെനിന്നു വന്ന് ഇപ്പോൾ അവിടെയുള്ളവരെന്ന ഗ്രീക്ക് പൂർണകാലത്തിന്റെ നിലവിലെ ഫലം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യക്രമത്തിന്റെ ഊന്നൽ കഴിയുന്നത്ര നിലനിർത്തിയിട്ടും വായനാസൗകര്യത്തിനായി മലയാളത്തിന്റെ സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു.
