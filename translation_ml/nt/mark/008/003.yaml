  terminology: ‘പറഞ്ഞയച്ചാൽ,’ ‘വിശന്നവരായി,’ ‘തളർന്നുവീഴും,’ and ‘ദൂരെനിന്ന് വന്നവരാണ്’ are suitable contextual renderings. ‘അവരുടെ വീടുകളിലേക്ക്’ makes the possessive force of αὐτῶν explicit while remaining natural.
  issues:
