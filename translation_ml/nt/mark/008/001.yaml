  text: Ἐν ἐκείναις ταῖς ἡμέραις ⸂πάλιν πολλοῦ⸃ ὄχλου ὄντος καὶ μὴ ἐχόντων τί φάγωσιν, ⸀προσκαλεσάμενος τοὺς ⸀μαθητὰς λέγει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: ml
  text: ആ ദിവസങ്ങളിൽ വീണ്ടും ഒരു വലിയ ജനക്കൂട്ടം ഉണ്ടായിരിക്കുകയും അവർക്കു ഭക്ഷിക്കാൻ ഒന്നും ഇല്ലാതിരിക്കുകയും ചെയ്തപ്പോൾ, യേശു ശിഷ്യന്മാരെ വിളിച്ച് അവരോടു പറയുന്നു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “അവരോടു പറയുന്നു”; മർക്കോസ് പലപ്പോഴും കഴിഞ്ഞ സംഭവങ്ങൾ വിവരിക്കുമ്പോൾ ഇത്തരത്തിലുള്ള വർത്തമാനകാലം ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: കാലസാഹചര്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: πάλιν πολλοῦ ὄχλου ὄντος
  choice: വീണ്ടും ഒരു വലിയ ജനക്കൂട്ടം ഉണ്ടായിരിക്കുകയും
  rationale: πάλιν സൂചിപ്പിക്കുന്ന ആവർത്തനവും genitive absolute നൽകുന്ന പശ്ചാത്തലസാഹചര്യവും നിലനിർത്തുന്നു.
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: അവർക്കു ഭക്ഷിക്കാൻ ഒന്നും ഇല്ലാതിരിക്കുകയും
  rationale: ജനക്കൂട്ടത്തിനാണ് ഭക്ഷണം ഇല്ലാത്തത് എന്ന അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: προσκαλεσάμενος τοὺς μαθητάς
  choice: ശിഷ്യന്മാരെ അടുത്തേക്ക് വിളിച്ച്
  rationale: προσκαλέομαι എന്ന ക്രിയയിലെ തന്റെ അടുക്കലേക്കു വിളിക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; സന്ദർഭത്തിൽ വ്യക്തമാകുന്ന യേശു എന്ന കർത്താവിനെ ചേർക്കുന്നു.
- source_word: λέγει αὐτοῖς
  choice: അവരോടു പറയുന്നു
  rationale: മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം മിനുക്കി ഭൂതകാലമാക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മർക്കോസിലെ ചരിത്രവർത്തമാനകാലം
  choice: “അവരോടു പറയുന്നു” എന്ന വർത്തമാനകാലം നിലനിർത്തി
  alternative: “അവരോടു പറഞ്ഞു” എന്ന ഭൂതകാലം
  rationale: ഇത് ഉപദേശപരമായ വ്യത്യാസമല്ല; ഗ്രീക്ക് ആഖ്യാനത്തിന്റെ സജീവമായ ശൈലി സംരക്ഷിക്കുന്ന വിവർത്തനതീരുമാനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നീണ്ട ഗ്രീക്ക് പശ്ചാത്തലഘടന മലയാളത്തിലെ ‘ഉണ്ടായിരിക്കുകയും … ഇല്ലാതിരിക്കുകയും ചെയ്തപ്പോൾ’ എന്ന ഘടനയിൽ നിലനിർത്തി. തുടർന്നുവരുന്ന യേശുവിന്റെ വാക്കുകളിലേക്കുള്ള തുറന്ന അവസാനമായി ദ്വിബിന്ദു ഉപയോഗിച്ചു.
