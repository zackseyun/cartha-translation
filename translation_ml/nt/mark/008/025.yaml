reference: Mark 8:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: ml
  text: പിന്നെ അവൻ വീണ്ടും ആ മനുഷ്യന്റെ കണ്ണുകളിന്മേൽ കൈകൾ വെച്ചു[a]. അപ്പോൾ അയാൾ വ്യക്തമായി കണ്ടു; അയാളുടെ കാഴ്ച വീണ്ടുകിട്ടി, സകലവും തെളിമയോടെ കണ്ടുകൊണ്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിലെ പാഠം, ‘അയാൾ സൂക്ഷിച്ചുനോക്കി; അയാളുടെ കാഴ്ച വീണ്ടുകിട്ടി; അയാൾ സകലവും വ്യക്തമായി കണ്ടു’ എന്നിങ്ങനെ പരിഭാഷപ്പെടുത്താവുന്ന വാക്കുകളെ പ്രതിഫലിപ്പിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അഥവാ, ‘അയാൾക്ക് സകലവും വ്യക്തമായി കാണാമായിരുന്നു.’ അവസാന വാക്യഭാഗത്തിൽ തുടരുന്ന അവസ്ഥ സൂചിപ്പിക്കുന്ന ഒരു ക്രിയയും തെളിഞ്ഞ കാഴ്ച സൂചിപ്പിക്കുന്ന ഒരു ക്രിയാവിശേഷണവും ചേർന്നിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: പിന്നെ ... വീണ്ടും
  rationale: εἶτα സൂചിപ്പിക്കുന്ന തുടർച്ചയും πάλιν സൂചിപ്പിക്കുന്ന ആവർത്തനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ആ മനുഷ്യന്റെ കണ്ണുകളിൽ കൈകൾ വെച്ചു
  rationale: കൈകൾ എന്ന ബഹുവചനവും കണ്ണുകളിലേക്കുള്ള നേരിട്ടുള്ള ശാരീരിക പ്രവൃത്തിയും സംരക്ഷിക്കുന്നു; സർവനാമക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ആ മനുഷ്യന്റെ’ എന്നു പറയുന്നു.
- source_word: διέβλεψεν
  choice: വ്യക്തമായി കണ്ടു
  rationale: διαβλέπω ഇവിടെ കാഴ്ച തെളിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു; മറ്റൊരു പാഠപരമ്പരയിൽ നിന്നുള്ള ‘സൂക്ഷിച്ചുനോക്കി’ എന്ന ആശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἀπεκατέστη
  choice: കാഴ്ച പൂർണമായി വീണ്ടുകിട്ടി
  rationale: മുൻപുണ്ടായിരുന്ന ശരിയായ നിലയിലേക്കുള്ള പുനഃസ്ഥാപനം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; സന്ദർഭം കാഴ്ചയെക്കുറിച്ചായതിനാൽ അതിനെ തുറന്നു പറയുന്നു.
- source_word: ἐνέβλεπεν
  choice: കണ്ടുകൊണ്ടിരുന്നു
  rationale: ഇംപർഫെക്റ്റ് ക്രിയയുടെ തുടരുന്ന/ഫലാവസ്ഥാപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: τηλαυγῶς
  choice: തെളിമയോടെ
  rationale: വ്യക്തവും വേർതിരിച്ചറിയാവുന്നതുമായ കാഴ്ചയെ സൂചിപ്പിക്കുന്നു; ദൂരക്കാഴ്ചയുടെ സാധ്യത നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: ἅπαντα
  choice: സകലവും
  rationale: നപുംസക ബഹുവചനത്തിന്റെ സമഗ്രത സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: രണ്ടു ഘട്ടങ്ങളിലായുള്ള സൗഖ്യത്തിന്റെ ആഖ്യാനരൂപം
  choice: വീണ്ടും കൈവെക്കൽ, വ്യക്തമായി കാണൽ, കാഴ്ച വീണ്ടുകിട്ടൽ, തുടർന്ന് തെളിമയോടെ കണ്ടുകൊണ്ടിരിക്കൽ എന്ന ക്രമം നിലനിർത്തി.
  alternative: എല്ലാ ക്രിയകളെയും ഒരൊറ്റ നിമിഷത്തിൽ പൂർത്തിയായ സംഭവമായി ലളിതമാക്കുക.
  rationale: ഗ്രീക്കിലെ ക്രിയാക്രമവും അവസാനത്തെ ഇംപർഫെക്റ്റും പുരോഗമനപരമായ ആഖ്യാനം സൃഷ്ടിക്കുന്നു; അതിനെ നിലനിർത്തുന്നത് വാക്യത്തിലെ ഉദ്ദേശ്യപൂർവമായ പിരിമുറുക്കം മായ്ച്ചുകളയാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. യേശുവിനെയും സൗഖ്യം പ്രാപിച്ച മനുഷ്യനെയും സൂചിപ്പിക്കുന്ന സർവനാമങ്ങൾ തമ്മിൽ ആശയക്കുഴപ്പം വരാതിരിക്കാൻ ‘ആ മനുഷ്യന്റെ’, ‘അയാൾ’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു. ക്രിയാക്രമവും ഇംപർഫെക്റ്റ് ഭാവവും സാധ്യമായത്ര വായനാസൗകര്യത്തോടെ സംരക്ഷിച്ചു.
