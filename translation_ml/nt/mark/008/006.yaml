id: MRK.8.6
reference: Mark 8:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: ml
  text: അവൻ ജനക്കൂട്ടത്തോട് ഭക്ഷണത്തിനായി നിലത്തു ചാരിക്കിടക്കാൻ[a] നിർദേശിച്ചു. പിന്നെ ഏഴ് അപ്പങ്ങൾ എടുത്ത്, നന്ദി പറഞ്ഞശേഷം അവ നുറുക്കി; ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ വെക്കാൻ[b] അവൻ അവ ശിഷ്യന്മാർക്കു കൊടുത്തുകൊണ്ടിരുന്നു. അവർ അവ ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇരിക്കാൻ.’ ഗ്രീക്ക് ക്രിയ കൂടുതൽ കൃത്യമായി ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിളമ്പാൻ.’ ഗ്രീക്കിന്റെ അക്ഷരാർഥം ‘മുമ്പിൽ വെക്കുക’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: നിർദേശിച്ചു
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന അർഥം നിലനിർത്തുന്നു; മലയാള ആഖ്യാനത്തിലെ സ്വാഭാവികതയ്ക്കായി വർത്തമാനകാലരൂപം ഭൂതകാലത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: ἀναπεσεῖν
  choice: ഭക്ഷണത്തിനായി ചാരിയിരിക്കാൻ
  rationale: വെറുതെ ഇരിക്കുക എന്നതിലുപരി ഭക്ഷണവേളയിൽ ചാരിയിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പ്രത്യേകത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: നിലത്ത്
  rationale: ഈ സന്ദർഭത്തിൽ ആളുകൾ ഇരിക്കുകയോ ചാരിയിരിക്കുകയോ ചെയ്യുന്ന ഭൂതലമാണ് ഉദ്ദേശ്യം.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ഏഴ് അപ്പങ്ങൾ
  rationale: ഭക്ഷണം പങ്കിടുന്ന ഈ സന്ദർഭത്തിൽ ἄρτοι എന്ന ബഹുവചനത്തിന് സാധാരണയും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: εὐχαριστήσας
  choice: നന്ദി പറഞ്ഞശേഷം
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ‘ദൈവത്തോട്’ എന്ന് കൂട്ടിച്ചേർക്കാതെ നന്ദിപ്രകടനം മാത്രം പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἔκλασεν
  choice: അവ നുറുക്കി
  rationale: മുൻപറഞ്ഞ അപ്പങ്ങളാണ് കർമം എന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അപ്പം പങ്കിടുന്ന സന്ദർഭത്തിന് ‘നുറുക്കി’ സ്വാഭാവികമാണ്.
- source_word: ἐδίδου
  choice: കൊടുത്തുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ തുടർച്ചയായോ ആവർത്തിച്ചോ നടന്ന പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: ἵνα παρατιθῶσιν
  choice: ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ വെക്കേണ്ടതിന്
  rationale: παρατίθημι എന്നതിന്റെ ‘മുമ്പിൽ വെക്കുക’ എന്ന ദൃശ്യാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് വിളമ്പുന്നതിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: παρέθηκαν
  choice: അവർ അവ ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ വെച്ചു
  rationale: മുൻക്രിയയുമായുള്ള പദസാമ്യം നിലനിർത്തുകയും ശിഷ്യന്മാരുടെ പൂർത്തിയായ പ്രവർത്തനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὄχλος
  choice: ജനക്കൂട്ടം
  rationale: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പരിഭാഷ.
theological_decisions:
- issue: ആഖ്യാനക്രമവും കർത്തൃഭോജനസംബന്ധമായ പ്രതിധ്വനിയും
  choice: ‘നന്ദി പറഞ്ഞശേഷം’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: കുർബാനയെയോ കർത്തൃഭോജനത്തെയോ വ്യക്തമാക്കുന്ന സാങ്കേതിക പദപ്രയോഗം ഉപയോഗിക്കുക.
  rationale: ഈ വാക്യത്തിലെ ഭാഷ സാധാരണ ഭക്ഷണവേളയുടേതാണ്; പിന്നീടുള്ള ക്രൈസ്തവ ആചാരങ്ങളെ ഓർമിപ്പിക്കാമെങ്കിലും ഇവിടെ വ്യക്തമാക്കാത്ത കൂദാശാസിദ്ധാന്തം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഭക്ഷണത്തിനായി ചാരിയിരിക്കാൻ’ എന്ന പ്രയോഗം പുരാതന ഭക്ഷണരീതിയുടെ അർഥം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പുകൾ പദാർഥപരമായ മറ്റു സാധ്യതകൾ സംരക്ഷിക്കുന്നു.
