reference: Mark 8:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: ml
  text: 'തന്റെ ശിഷ്യന്മാരോടുകൂടെ ജനക്കൂട്ടത്തെ വിളിച്ചുകൂട്ടി അവൻ അവരോടു പറഞ്ഞു: “ആരെങ്കിലും എന്റെ പിന്നാലെ വരാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ, അവൻ സ്വയം നിഷേധിക്കട്ടെ; തന്റെ ക്രൂശ് എടുക്കട്ടെ; എന്നെ അനുഗമിക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: അടുക്കൽ വിളിച്ചിട്ട്
  rationale: ആളുകളെ തന്റെ അടുക്കലേക്കു വിളിച്ചുകൂട്ടുന്ന അർഥവും പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തനക്രമവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: ജനക്കൂട്ടത്തെ തന്റെ ശിഷ്യന്മാരോടൊപ്പം
  rationale: ജനക്കൂട്ടവും ശിഷ്യന്മാരും ഒരുമിച്ച് അഭിസംബോധന ചെയ്യപ്പെട്ടതായി σύν സൂചിപ്പിക്കുന്ന അനുഗമനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Εἴ τις θέλει ὀπίσω μου ἐλθεῖν
  choice: ആരെങ്കിലും എന്റെ പിന്നാലെ വരാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ
  rationale: തുറന്ന ക്ഷണത്തിന്റെ വ്യവസ്ഥാഭാവവും ശിഷ്യത്വത്തിന്റെ ‘പിന്നാലെ വരുക’ എന്ന രൂപകവും നിലനിർത്തുന്നു; തുടർന്നുള്ള ἀκολουθείτω എന്നതിൽനിന്ന് പദപ്രയോഗം വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: അവൻ തന്നെത്തന്നെ ത്യജിച്ച്
  rationale: സ്വന്തം അവകാശവാദവും സ്വകേന്ദ്രിതത്വവും വിട്ടൊഴിയുന്ന ശക്തമായ ആത്മനിഷേധം സൂചിപ്പിക്കുന്നു; സാധാരണ സൗകര്യങ്ങൾ മാത്രം ഉപേക്ഷിക്കുന്നതായി ചുരുക്കുന്നില്ല. തുടർന്നുള്ള പ്രധാന ആജ്ഞയോടു ബന്ധിപ്പിക്കുന്ന മലയാളരൂപമാണ് ഉപയോഗിച്ചത്.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: തന്റെ ക്രൂശ് എടുത്തുകൊണ്ട്
  rationale: ക്രൂശിന്റെ ചരിത്രപരവും രൂപകാത്മകവുമായ ദൃശ്യത്തെ അക്ഷുണ്ണമായി സൂക്ഷിക്കുകയും വ്യക്തിപരമായ ചെലവ് സൂചിപ്പിക്കുന്ന αὐτοῦ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀκολουθείτω μοι
  choice: എന്നെ അനുഗമിക്കട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ ശിഷ്യത്വപരമായ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായ ആജ്ഞാരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വ ആജ്ഞകളുടെ ശക്തി
  choice: തുറന്ന വ്യവസ്ഥയ്ക്കു പിന്നാലെ ആത്മത്യാഗം, ക്രൂശെടുക്കൽ, അനുഗമിക്കൽ എന്നിവ ആജ്ഞാത്മകമായി അവതരിപ്പിച്ചു.
  alternative: എല്ലാ ഘടകങ്ങളിലും ‘വേണം’ ആവർത്തിക്കുന്ന കൂടുതൽ പദാനുപദ രൂപം
  rationale: ഗ്രീക്കിൽ വ്യവസ്ഥാവാക്യത്തിനു പിന്നാലെ മൂന്നാംപുരുഷ ആജ്ഞാരൂപങ്ങളാണുള്ളത്. മലയാളത്തിൽ ആജ്ഞാശക്തി നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കി.
- issue: σταυρός എന്നതിന്റെ അർഥം
  choice: ‘ക്രൂശ്’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഭാരം, കഷ്ടപ്പാട്, വധോപകരണം
  rationale: റോമൻ ക്രൂശിൽ വേരൂന്നിയ ദൃശ്യത്തെ പൊതുവായ ദുരിതമോ ഭാരമോ ആയി ചുരുക്കാതെയും അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി വിശദീകരിക്കാതെയും സംരക്ഷിക്കുന്നു.
- issue: ἀπαρνέομαι ἑαυτόν എന്നതിന്റെ വ്യാപ്തി
  choice: ‘തന്നെത്തന്നെ ത്യജിക്കുക’
  alternative: സ്വയം നിഷേധിക്കുക; സ്വന്തം സുഖങ്ങൾ ഉപേക്ഷിക്കുക
  rationale: ഇത് ചെറിയ ആത്മനിയന്ത്രണ പ്രവൃത്തികളായി ചുരുക്കപ്പെടാതിരിക്കാനും വ്യക്തി തന്നെക്കുറിച്ചുള്ള അവകാശവാദം വിട്ടൊഴിയുന്ന ശക്തി പ്രകടമാക്കാനും ‘ത്യജിക്കുക’ തെരഞ്ഞെടുത്തു; അതിന്റെ മുഴുവൻ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിർവചിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ക്രൂശ്’, ‘ശിഷ്യന്മാർ’, ‘അനുഗമിക്കുക’ തുടങ്ങിയ വ്യാപകമായി മനസ്സിലാകുന്ന ബൈബിൾപദങ്ങൾ നിലനിർത്തി. ഇംഗ്ലീഷ് കരടിലെ [a] അടിക്കുറിപ്പ് മുഖ്യവാക്യത്തിന്റെ പകരംവായനയുമായി പൊരുത്തപ്പെടാത്തതായി തോന്നുന്നതിനാൽ അത് പുനരാവർത്തിച്ചില്ല; പ്രസക്തമായ ക്രൂശ്-കുറിപ്പ് [a] ആയി ചേർത്തു.
