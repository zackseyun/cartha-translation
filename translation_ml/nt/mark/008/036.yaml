id: MRK.8.36
reference: Mark 8:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: ml
  text: ഒരു മനുഷ്യൻ ലോകം മുഴുവൻ നേടിയാലും തന്റെ ജീവൻ നഷ്ടപ്പെട്ടാൽ, അവന് എന്തു പ്രയോജനം?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ ആത്മാവ്.” ψυχή എന്ന ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് “ജീവൻ,” “ആത്മാവ്,” അല്ലെങ്കിൽ “സ്വയം” എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ഒരു മനുഷ്യൻ” എന്നത് ഇവിടെ പൊതുവായി ഏതൊരു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: τί γὰρ
  choice: എന്തു പ്രയോജനം?
  rationale: τί ചോദ്യം ഉന്നയിക്കുകയും γάρ മുൻപുള്ള ഉപദേശത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിലെ ഈ വാക്യഘടന ആ ബന്ധം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὠφελεῖ
  choice: പ്രയോജനം
  rationale: ὠφελέω എന്നതിന്റെ ഗുണം ചെയ്യുക, പ്രയോജനപ്പെടുക എന്ന അർഥം നിലനിർത്തുന്നു; നേടലും നഷ്ടവും ഉൾപ്പെടുന്ന സാമ്പത്തിക രൂപകത്തോടും ഇത് ചേരുന്നു.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യൻ
  rationale: ἄνθρωπος ഇവിടെ ഏകവചനത്തിലുള്ള പൊതുവായ മനുഷ്യനെ സൂചിപ്പിക്കുന്നു. ‘ഒരു മനുഷ്യൻ’ എന്നത് രൂപം നിലനിർത്തുകയും എല്ലാ മനുഷ്യർക്കും ബാധകമായ പ്രയോഗമായി സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: κερδῆσαι
  choice: നേടിയാലും
  rationale: κερδαίνω എന്നതിന്റെ നേടുക, ലാഭമുണ്ടാക്കുക എന്ന ആശയം നൽകുന്നു; സോപാധികമായ ഗ്രീക്ക് infinitive ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸν κόσμον ὅλον
  choice: ലോകം മുഴുവൻ
  rationale: κόσμος എന്നതിന്റെ സമഗ്രവ്യാപ്തിയും ὅλος നൽകുന്ന പൂർണതയും നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: ζημιωθῆναι
  choice: നഷ്ടപ്പെടുത്തിയാൽ
  rationale: ζημιόωയുടെ passive രൂപം നഷ്ടം അനുഭവിക്കുക, കൈവിട്ടുകളയുക എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘തന്റെ ജീവൻ നഷ്ടപ്പെടുത്തിയാൽ’ എന്നത് നേടൽ–നഷ്ടം വൈരുധ്യം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: തന്റെ ജീവൻ
  rationale: മർക്കോസ് 8:35–37-ലെ സന്ദർഭത്തിൽ ψυχή ഒരാളുടെ ജീവനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം. എന്നാൽ ‘ആത്മാവ്’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വത്തെക്കുറിച്ചുള്ള വചനത്തിൽ ψυχή എന്ന പദത്തിന്റെ ‘ജീവൻ’/‘ആത്മാവ്’ അർഥദ്വയസാധ്യത
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: തൊട്ടുമുമ്പുള്ള 8:35-ൽ ജീവൻ രക്ഷിക്കുകയും നഷ്ടപ്പെടുത്തുകയും ചെയ്യുന്നതിന്റെ വിരോധാഭാസമാണ് മുഖ്യം; അതിനാൽ ‘ജീവൻ’ സന്ദർഭസുസ്ഥിരത നൽകുന്നു. എങ്കിലും ψυχήക്ക് ‘ആത്മാവ്’ എന്ന അർഥവും വഹിക്കാനാകുന്നതിനാൽ ആ സത്യസന്ധമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാചകത്തിന്റെ അലങ്കാരപ്രശ്നസ്വഭാവവും നേടൽ–നഷ്ടം വൈരുധ്യവും നിലനിർത്തി; ψυχήയുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
