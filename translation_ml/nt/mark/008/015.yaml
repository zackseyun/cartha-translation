source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: ml
  text: 'അവൻ അവരോട് ഇങ്ങനെ വീണ്ടും വീണ്ടും മുന്നറിയിപ്പ് നൽകി: “ജാഗ്രത പാലിക്കുവിൻ; പരീശന്മാരുടെ പുളിമാവിനെയും ഹെരോദാവിന്റെ പുളിമാവിനെയും കുറിച്ച് ജാഗ്രത പാലിക്കുവിൻ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇവിടെ “പുളിമാവ്” എന്നത് പരീശന്മാരോടും ഹെരോദാവിനോടും ബന്ധപ്പെട്ട് വ്യാപിക്കുന്ന ദോഷകരമായ സ്വാധീനത്തിന്റെ രൂപകമായിരിക്കാം; എന്നാൽ ഈ വാക്യം അതിന്റെ കൃത്യമായ സ്വഭാവം വ്യക്തമാക്കുന്നില്ല. താരതമ്യം: മത്തായി 16:6, 12; ലൂക്കോസ് 12:1.'
    reason: metaphor_clarification_and_cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: വീണ്ടും വീണ്ടും മുന്നറിയിപ്പു നൽകി
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ഗൗരവമുള്ള മുന്നറിയിപ്പാണ്.
- source_word: λέγων
  choice: 'നൽകി:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ മുന്നറിയിപ്പിന്റെ ഉള്ളടക്കമായി സ്വാഭാവിക മലയാളത്തിൽ കോളൺ ഉപയോഗിച്ച് അവതരിപ്പിക്കുന്നു.
- source_word: Ὁρᾶτε
  choice: ജാഗ്രത പാലിക്കുവിൻ
  rationale: ഇവിടെ കാഴ്ചയല്ല, അപകടത്തെക്കുറിച്ചുള്ള ജാഗ്രതയാണ് ഉദ്ദേശ്യം.
- source_word: βλέπετε
  choice: സൂക്ഷിക്കുവിൻ
  rationale: അടുത്തടുത്തുള്ള രണ്ട് ആജ്ഞാരൂപങ്ങളുടെ ഊന്നൽ, വ്യത്യസ്തമായെങ്കിലും സമാനമായ രണ്ട് മലയാള മുന്നറിയിപ്പുകളിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἀπὸ
  choice: -നെയും ... സൂക്ഷിക്കുവിൻ
  rationale: മുന്നറിയിപ്പിന്റെ ക്രിയയോടൊപ്പം ഗ്രീക്കിലെ വേർപെട്ടുനിൽക്കൽ/ഒഴിവാക്കൽ ഭാവം സ്വാഭാവിക മലയാള കർമപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: ζύμης
  choice: പുളിമാവ്
  rationale: പെരുകി മുഴുവൻ മാവിലും വ്യാപിക്കുന്ന സ്വാധീനത്തിന്റെ രൂപകം നിലനിർത്തുന്ന, മലയാളത്തിൽ പരിചിതമായ പദമാണ്.
- source_word: Φαρισαίων
  choice: പരീശന്മാർ
  rationale: സംഘനാമത്തിന്റെ മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ രൂപം; ഷഷ്ഠിവിഭക്തിയിൽ ബന്ധം നിലനിർത്തുന്നു.
- source_word: Ἡρῴδου
  choice: ഹെരോദാവ്
  rationale: മൂലപാഠം ഹെരോദാവിനെ നേരിട്ട് പേരെടുത്തു പറയുന്നു; കുടുംബം, കക്ഷി, സ്വാധീനം എന്നീ വ്യാഖ്യാനങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘പുളിമാവ്’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘പുളിമാവ്’ എന്ന രൂപകം അതേപടി നിലനിർത്തുന്നു.
  alternative: ഉപദേശം; കപടഭക്തി; ദുഷിപ്പിക്കുന്ന സ്വാധീനം
  rationale: സമാന്തരവാക്യങ്ങൾ നിഷേധാത്മകവും വ്യാപിക്കുന്നതുമായ സ്വാധീനം സൂചിപ്പിച്ചാലും, മർക്കോസ് 8:15 അതിന്റെ കൃത്യമായ അർഥം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനസാധ്യത അടച്ചുപൂട്ടാതെ രൂപകം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആവർത്തിത മുന്നറിയിപ്പിന്റെ ഭാവം ‘വീണ്ടും വീണ്ടും’ എന്നതിലൂടെ പ്രകടമാക്കുകയും, ഇരട്ട ആജ്ഞയുടെ ഊന്നൽ ‘ജാഗ്രത പാലിക്കുവിൻ; ... സൂക്ഷിക്കുവിൻ’ എന്ന രൂപത്തിൽ നിലനിർത്തുകയും ചെയ്തു.
