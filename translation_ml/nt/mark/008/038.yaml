id: MRK.8.38
reference: Mark 8:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: ml
  text: കാരണം, ഈ വ്യഭിചാരിയും പാപിയുമായ തലമുറയിൽ എന്നെയും എന്റെ വാക്കുകളെയും കുറിച്ച് ആർ ലജ്ജിക്കുന്നുവോ, മനുഷ്യപുത്രൻ തന്റെ പിതാവിന്റെ മഹത്ത്വത്തിൽ വിശുദ്ധ ദൂതന്മാരോടുകൂടെ വരുമ്പോൾ അവനെക്കുറിച്ചും ലജ്ജിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വ്യഭിചാരിയും പാപിയുമായ തലമുറ’ എന്നതിന് ‘അവിശ്വസ്തവും പാപപൂർണവുമായ തലമുറ’ എന്നും അർത്ഥമാക്കാം. ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയെ വ്യഭിചാരമായി ചിത്രീകരിക്കുന്ന പ്രവാചകഭാഷയിലെ മൂർത്തമായ രൂപകം ഗ്രീക്കിൽ ഉള്ളതിനാൽ പ്രധാന പാഠത്തിൽ ‘വ്യഭിചാരിയായ’ എന്ന പദം നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: ലജ്ജിക്കുന്നുവോ / ലജ്ജിക്കും
  rationale: വ്യക്തിയെയോ അവന്റെ വാക്കുകളെയോ സംബന്ധിച്ച ലജ്ജയെ നേരിട്ട് പ്രകടിപ്പിക്കുകയും മനുഷ്യന്റെ ഇപ്പോഴത്തെ പ്രതികരണത്തിനും മനുഷ്യപുത്രന്റെ ഭാവിയിലെ പ്രതികരണത്തിനുമിടയിലെ പരസ്പരസാമ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λόγους
  choice: വാക്കുകൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം അതേപടി നിലനിർത്തുന്നു; ‘സന്ദേശം’ എന്ന ഏകവചനപരമായ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: γενεᾷ
  choice: തലമുറ
  rationale: ഇപ്പോഴുള്ള സാമൂഹിക-ധാർമ്മിക സമൂഹത്തെയും കാലസന്ദർഭത്തെയും സൂചിപ്പിക്കുന്ന സാധാരണവും സന്ദർഭോചിതവുമായ തർജമ.
- source_word: μοιχαλίδι
  choice: വ്യഭിചാരിയായ
  rationale: പ്രവാചകഭാഷയിലെ ഉടമ്പടിവിശ്വാസവഞ്ചനയെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ വ്യഭിചാരരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: ἁμαρτωλῷ
  choice: പാപിയായ
  rationale: ഗ്രീക്ക് വിശേഷണത്തിന്റെ നേരിട്ടുള്ള തുല്യപദം; ആവശ്യമില്ലാത്ത അധിക തീവ്രത ചേർക്കുന്നില്ല.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സ്ഥിരപ്രയോഗമായ ശീർഷകവും അതിന്റെ ദാനിയേൽസംബന്ധമായ ദൈവശാസ്ത്രപ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: δόξῃ
  choice: മഹത്ത്വം
  rationale: ദൈവിക ബഹുമാനം, പ്രഭ, തേജസ്സ് എന്നിവ ഉൾക്കൊള്ളുന്ന ഭാരമുള്ള ബൈബിൾപദമായി സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: വിശുദ്ധ ദൂതന്മാരോടുകൂടെ
  rationale: ആട്രിബ്യൂട്ടീവ് ഗ്രീക്ക് ഘടന സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘തന്റെ’ എന്ന ഉടമസ്ഥസൂചന ചേർക്കുന്നില്ല.
- source_word: ὃς γὰρ ἐὰν
  choice: ആർ ... ചെയ്യുന്നുവോ
  rationale: പൊതുവായ നിബന്ധനയുടെ അർത്ഥം മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യഘടനയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: ഈ ... തലമുറയിൽ
  rationale: ലജ്ജ പ്രകടമാകുന്ന സാമൂഹികവും ധാർമ്മികവുമായ പശ്ചാത്തലം സൂചിപ്പിക്കുന്ന ἐν എന്നതിന്റെ അർത്ഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘വ്യഭിചാരിയായ’ എന്നതിന്റെ രൂപകാർഥം
  choice: പ്രധാന പാഠത്തിൽ ‘വ്യഭിചാരിയായ’ നിലനിർത്തി, ആത്മീയവും ധാർമ്മികവുമായ അവിശ്വസ്തതയുടെ പ്രവാചകരൂപകമായി വായിക്കുക.
  alternative: ‘അവിശ്വസ്തമായ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് മൂർത്തമായ ധാർമ്മികപദം ഉപയോഗിക്കുന്നു; അതു നിലനിർത്തുന്നത് പ്രവാചകപരമായ അന്തർപാഠബന്ധവും ദൈവശാസ്ത്രഗൗരവവും സംരക്ഷിക്കുന്നു.
- issue: ‘മനുഷ്യപുത്രൻ’ എന്ന ശീർഷകത്തിന്റെ സൂചന
  choice: ‘മനുഷ്യപുത്രൻ’ എന്ന മിശിഹാസംബന്ധമായ ശീർഷകം നിലനിർത്തുക.
  alternative: ‘ഞാൻ’ അല്ലെങ്കിൽ ‘മിശിഹാ’ എന്നു പകരംവയ്ക്കുക.
  rationale: മൂലപാഠം പ്രത്യേകമായ ക്രിസ്തുശാസ്ത്ര-അന്ത്യകാല ശീർഷകം ഉപയോഗിക്കുന്നു; പകരംവാക്കുകൾ അതിന്റെ സൂചനയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും കുറയ്ക്കും.
- issue: αὐτόν എന്ന ഏകവചന സർവനാമം
  choice: ‘അവനെക്കുറിച്ചും’ എന്ന ഏകവചനരൂപം ഉപയോഗിക്കുക.
  alternative: ‘അവരെക്കുറിച്ചും’ എന്ന ബഹുവചന/ലിംഗനിരപേക്ഷ രൂപം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ പൊതുവാചകഘടനയോടൊപ്പമുള്ള ഏകവചന പുംലിംഗ സർവനാമത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘എന്നെയും എന്റെ വാക്കുകളെയുംകുറിച്ച്’ എന്ന ഘടന ആവർത്തിത ഗ്രീക്ക് ബന്ധത്തെ വ്യക്തമാക്കുന്നു; ‘വിശുദ്ധ ദൂതന്മാരോടുകൂടെ’ എന്നത് ബൈബിൾഗൗരവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
