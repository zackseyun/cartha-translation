  text: καὶ ἔλεγεν αὐτοῖς· ⸀Οὔπω συνίετε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “നിങ്ങൾ ഇനിയും മനസ്സിലാക്കുന്നില്ലേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: മലയാളത്തിൽ ഈ വാക്യം മുൻസന്ദർഭത്തോട് സ്വാഭാവികമായി ചേരുന്നതിനാൽ വാക്യാരംഭത്തിലെ ലളിത സംയോജകത്തെ പ്രത്യേകം ചേർക്കാതിരിക്കുന്നത് കൂടുതൽ സ്വാഭാവികമാണ്; ബന്ധം നഷ്ടപ്പെടുന്നില്ല.
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപത്തിന്റെ തുടർച്ചാത്മക സ്വഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: സന്ദർഭത്തിൽ ശിഷ്യന്മാരെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ഗ്രീക്കിൽ നാമം വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ സർവനാമം തന്നെയാണ് നിലനിർത്തിയത്.
- source_word: Οὔπω
  choice: ഇനിയും ... ഇല്ല
  rationale: ‘ഇതുവരെ ഇല്ല / ഇപ്പോഴും ഇല്ല’ എന്ന അർത്ഥം ചോദ്യത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: συνίετε
  choice: മനസ്സിലാക്കുന്നില്ലേ
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള വർത്തമാനകാല ക്രിയയുടെ മാനസിക ഗ്രഹണം എന്ന അർത്ഥം വ്യക്തവും സാധാരണവുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ചോദ്യത്തിൽ ‘ഇത്’ പോലുള്ള ഒരു കർമം ചേർക്കണമോ
  choice: കർമം വ്യക്തമാക്കാതെ ‘നിങ്ങൾ ഇനിയും മനസ്സിലാക്കുന്നില്ലേ?’ എന്നു നിലനിർത്തി.
  alternative: ‘നിങ്ങൾക്ക് ഇത് ഇനിയും മനസ്സിലാകുന്നില്ലേ?’
  rationale: ഗ്രീക്ക് പാഠത്തിൽ കർമം പ്രസ്താവിച്ചിട്ടില്ല. അത് ചേർക്കാതിരിക്കുന്നത് ചോദ്യത്തിന്റെ തുറന്ന വ്യാപ്തിയും ശാസനാത്മക ശക്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ച സൂക്ഷിക്കുന്നു; ‘അവരോടു’ എന്ന് ഉപയോഗിച്ച് സന്ദർഭത്തിൽ നിന്നുള്ള ‘ശിഷ്യന്മാർ’ എന്ന നാമം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
