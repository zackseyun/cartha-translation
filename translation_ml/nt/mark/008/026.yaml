source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: ml
  text: 'അവൻ അവനെ അവന്റെ വീട്ടിലേക്ക് അയച്ചുകൊണ്ട് പറഞ്ഞു: “ഗ്രാമത്തിലേക്ക് കടക്കുക പോലും അരുത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: യേശു ആ മനുഷ്യനെ അവന്റെ വീട്ടിലേക്കു പറഞ്ഞയയ്ക്കുന്നതാണ് സന്ദർഭം; ദൗത്യത്തിന് അയയ്ക്കുന്നു എന്ന അധിക അർഥം ചേർക്കാതെ സ്വാഭാവികമായി പ്രവർത്തി വ്യക്തമാക്കുന്നു.
- source_word: εἰς οἶκον αὐτοῦ
  choice: അവനെ വീട്ടിലേക്ക്
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘അവന്റെ വീട്ടിലേക്ക്’ എന്നാണ്. മലയാളത്തിൽ കർത്താവിന്റെയും കർമത്തിന്റെയും സർവനാമങ്ങൾ അടുത്തുവരുമ്പോൾ ഉണ്ടാകാവുന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അവനെ വീട്ടിലേക്ക് അയച്ചു’ എന്ന സ്വാഭാവിക പ്രയോഗം സ്വീകരിച്ചു; അവന്റെ സ്വന്തം വാസസ്ഥലമാണ് ലക്ഷ്യമെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: λέγων
  choice: പറഞ്ഞുകൊണ്ട്
  rationale: പ്രധാനക്രിയയോടു ചേർന്നുനിൽക്കുന്ന വർത്തമാന കൃന്തത്തിന്റെ ബന്ധം നിലനിർത്തുകയും തുടർന്നുള്ള വാക്കുകൾ അയയ്ക്കുന്നതിനോടൊപ്പമുള്ള നിർദേശമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Μηδὲ
  choice: കടക്കുകപോലും അരുത്
  rationale: μηδέ നൽകുന്ന ഊന്നിയ നിഷേധം ‘പോലും അരുത്’ എന്ന മലയാളപ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κώμην
  choice: ഗ്രാമം
  rationale: κώμη ചെറിയ ജനവാസകേന്ദ്രമായ ഗ്രാമത്തെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്; ‘ഗ്രാമം’ നേരിട്ടും സന്ദർഭോചിതവുമായ തർജമയാണ്.
- source_word: εἰσέλθῃς
  choice: കടക്കുക
  rationale: μηδέ-യോടുകൂടിയ നിരോധനാത്മക പ്രയോഗത്തിന്റെ ശക്തി മലയാളത്തിൽ ‘കടക്കുക ... അരുത്’ എന്നു സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകി.
theological_decisions:
- issue: ഗ്രാമത്തെക്കുറിച്ചുള്ള യേശുവിന്റെ വിലക്കിന്റെ പരിധി
  choice: ഗ്രാമത്തിൽ കടക്കരുതെന്ന നേരിട്ടുള്ള വിലക്ക് മാത്രം മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ചില കൈയെഴുത്തുപ്രതികളിലുള്ളതുപോലെ ഗ്രാമത്തിലെ ആരോടും പറയരുതെന്ന വിലക്കും ചേർക്കുക.
  rationale: SBLGNT മുഖ്യപാഠത്തിൽ ഗ്രാമത്തിൽ കടക്കരുതെന്ന വിലക്ക് മാത്രമാണുള്ളത്. ദൈർഘ്യമേറിയ പാഠപരമ്പരയിലെ വാചകം മുഖ്യപാഠത്തിൽ കലർത്താതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കടക്കുകപോലും അരുത്’ എന്ന പ്രയോഗം മൂലത്തിലെ ഊന്നിയ നിഷേധം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി എത്തിക്കുന്നു.
