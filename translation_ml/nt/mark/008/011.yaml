source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: ml
  text: ഫരിസേയർ പുറത്തുവന്ന് അവനോടു തർക്കിക്കാൻ തുടങ്ങി. അവനെ പരീക്ഷിച്ചുകൊണ്ട്, അവർ സ്വർഗത്തിൽനിന്നുള്ള ഒരു അടയാളം[a] അവനിൽനിന്ന് ആവശ്യപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആകാശത്തുനിന്നുള്ള ഒരു അടയാളം.’ ഇവിടെ ദൈവിക ഉറവിടമോ അംഗീകാരമോ ഉള്ള അടയാളമാണ് ഉദ്ദേശിക്കുന്നതെന്നതിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: പുറത്തുവന്നു
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ ചലനാർഥം നിലനിർത്തുന്നു; അവർ എവിടെനിന്നാണ് വന്നതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അത് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἤρξαντο συζητεῖν
  choice: തർക്കിക്കാൻ തുടങ്ങി
  rationale: ἤρξαντο എന്നതിന്റെ ആരംഭഭാവവും, പരീക്ഷിക്കാനുള്ള വൈരപരമായ സാഹചര്യത്തിൽ συζητέω സൂചിപ്പിക്കുന്ന വാദപ്രതിവാദഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτῷ
  choice: അവനുമായി
  rationale: συζητεῖν-നോടൊപ്പമുള്ള ദത്തിവ് പരസ്പര തർക്കത്തെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിലെ സർവനാമം പേരാക്കി വികസിപ്പിക്കുന്നില്ല.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: അവർ അവനോട് ആവശ്യപ്പെട്ടു
  rationale: ഇവിടെ ζητέω ഒരു അടയാളം ലഭിക്കണമെന്ന ആവശ്യം പ്രകടിപ്പിക്കുന്നു; παρά + ജനിറ്റീവ് സൂചിപ്പിക്കുന്ന ഉറവിടബന്ധം മലയാളത്തിലെ ‘അവനോട് ആവശ്യപ്പെട്ടു’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: σημεῖον
  choice: ഒരു അടയാളം
  rationale: അത്ഭുതപ്രവൃത്തിയെന്നതിലുപരി തെളിവായോ സ്ഥിരീകരണമായോ പ്രവർത്തിക്കുന്ന σημεῖον എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്നുള്ള
  rationale: ദൈവിക ഉറവിടമോ അംഗീകാരമോ ഉള്ള അടയാളം എന്ന സുവിശേഷസന്ദർഭത്തിലെ പ്രധാന സൂചന നിലനിർത്തുന്നു; പദപ്രയോഗത്തിന്റെ സാധ്യതയുള്ള ഭൗതിക അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πειράζοντες αὐτόν
  choice: അവനെ പരീക്ഷിച്ചുകൊണ്ട്
  rationale: πειράζω ഇവിടെ പാപത്തിലേക്ക് പ്രലോഭിപ്പിക്കൽ എന്നതിനെക്കാൾ വൈരപരമായി പരിശോധിക്കുകയോ കുടുക്കാൻ നോക്കുകയോ ചെയ്യുന്ന ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ‘പരീക്ഷിക്കുക’ ആ സംഘർഷം നിർവചിച്ചുതീർക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘സ്വർഗത്തിൽനിന്നുള്ള’ അടയാളത്തിന്റെ അർഥം
  choice: ദൈവിക ഉറവിടമോ അംഗീകാരമോ ഉള്ള അടയാളം
  alternative: ആകാശത്തുനിന്നുള്ള ഒരു അടയാളം
  rationale: യഹൂദ-സുവിശേഷസന്ദർഭത്തിൽ οὐρανός ദൈവിക ഉറവിടത്തെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത. എന്നിരുന്നാലും മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനപരമായ വിപുലീകരണം വരുത്താതെ ‘സ്വർഗത്തിൽനിന്നുള്ള’ എന്ന് നിലനിർത്തുകയും മറ്റൊരു സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ഗ്രീക്കിലെ പങ്കുപ്രയോഗങ്ങളുടെ ബന്ധം സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ പുനഃസംഘടിപ്പിച്ചിട്ടുണ്ടെങ്കിലും സംഭവക്രമവും വൈരപരമായ ഉദ്ദേശ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്.
