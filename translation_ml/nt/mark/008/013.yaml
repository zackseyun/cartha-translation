  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἐμβὰς⸃ ἀπῆλθεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/013.yaml
  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: ml
  text: അവരെ വിട്ട്, അവൻ പടകിൽ തിരികെ കയറി[a] മറുകരയിലേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവൻ വീണ്ടും പടകിൽ കയറി മറുകരയിലേക്കു പോയി.’ πάλιν എന്ന പദത്തിന് ‘തിരികെ’ എന്നും ‘വീണ്ടും’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς
  choice: വിട്ട്
  rationale: ἀφίημι എന്ന ക്രിയയുടെ ഭൂതകാല ക്രിയാവിശേഷണരൂപം ഇവിടെ ആളുകളെ വിട്ടുപോകുക എന്ന നേരിട്ടുള്ള അർഥത്തിലാണ്; ‘വിട്ട്’ എന്നത് മുഖ്യക്രിയയോടുള്ള ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: αὐτοὺς
  choice: അവരെ
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിലെ പരീശന്മാരെയാണ് ഈ സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: πάλιν
  choice: തിരികെ
  rationale: πάλιν എന്നതിന് ‘വീണ്ടും’ എന്നും ‘തിരികെ’ എന്നും അർഥമാകാം. യാത്രാസന്ദർഭത്തിൽ പടകിലേക്കുള്ള മടങ്ങിക്കയറൽ സൂചിപ്പിക്കാൻ ‘തിരികെ’ സ്വാഭാവികമാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐμβὰς
  choice: പടകിൽ ... കയറി
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘അകത്തു കയറി’ എന്നാണ്. സന്ദർഭത്തിൽ കയറുന്നത് പടകിലാണെന്ന് വ്യക്തമായതിനാൽ ‘പടക്’ വ്യക്തമാക്കുന്നത് വായനാസൗകര്യം നൽകുന്നു.
- source_word: ἀπῆλθεν
  choice: പോയി
  rationale: ἀπέρχομαι ഇവിടെ അവിടെനിന്നു പുറപ്പെട്ടു ലക്ഷ്യസ്ഥാനത്തേക്കു പോയതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ദിശാസൂചനയോടൊപ്പം ‘പോയി’ ലളിതവും കൃത്യവുമാണ്.
- source_word: εἰς τὸ πέραν
  choice: മറുകരയിലേക്ക്
  rationale: തടാകത്തിന്റെ അപ്പുറത്തുള്ള കരയിലേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന മർക്കോസിന്റെ പതിവുപ്രയോഗം മലയാളത്തിൽ ‘മറുകരയിലേക്ക്’ എന്ന് സ്വാഭാവികമായി വരുന്നു.
