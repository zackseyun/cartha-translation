source:
  edition: SBLGNT
  text: ὀφθαλμοὺς ἔχοντες οὐ βλέπετε καὶ ὦτα ἔχοντες οὐκ ἀκούετε; καὶ οὐ μνημονεύετε
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: ml
  text: കണ്ണുകളുണ്ടായിട്ടും നിങ്ങൾ കാണുന്നില്ലേ?[a] ചെവികളുണ്ടായിട്ടും നിങ്ങൾ കേൾക്കുന്നില്ലേ? നിങ്ങൾ ഓർക്കുന്നില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കണ്ണുകളുണ്ടായിട്ടും നിങ്ങൾ ഗ്രഹിക്കുന്നില്ലേ? ചെവികളുണ്ടായിട്ടും നിങ്ങൾ മനസ്സിലാക്കുന്നില്ലേ?” ഗ്രീക്കിൽ സാധാരണയായി ‘കാണുക’, ‘കേൾക്കുക’ എന്നർഥമുള്ള ക്രിയകളാണ്; സന്ദർഭത്തിൽ അവ ആന്തരികമോ ആത്മീയമോ ആയ ഗ്രഹണത്തെയും സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: കണ്ണുകളുണ്ടായിട്ടും
  rationale: ഗ്രീക്കിലെ കർത്തൃവാചക പങ്കാളിത്തപ്രയോഗത്തിന് സന്ദർഭത്തിൽ ഇളവുസൂചകമായ ഭാവമുണ്ട്. മലയാളത്തിൽ ‘ഉണ്ടായിട്ടും’ എന്നത് ആ വാഗ്‌ചാതുര്യവും ശാസനയുടെ മൂർച്ചയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: βλέπετε
  choice: നിങ്ങൾ കാണുന്നില്ലേ
  rationale: അടിസ്ഥാന അർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; സന്ദർഭം സൂചിപ്പിക്കുന്ന ആത്മീയ ഗ്രഹണശേഷിക്കുറവ് വാചകത്തിൽ തുറന്ന് വിശദീകരിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ὦτα ἔχοντες
  choice: ചെവികളുണ്ടായിട്ടും
  rationale: ആദ്യ ഭാഗത്തോടുള്ള ഗ്രീക്ക് സമാന്തരഘടന മലയാളത്തിലും ഒരേ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: ἀκούετε
  choice: നിങ്ങൾ കേൾക്കുന്നില്ലേ
  rationale: സാധാരണ ഇന്ദ്രിയക്രിയയായ ‘കേൾക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു; ‘മനസ്സിലാക്കുക’ അല്ലെങ്കിൽ ‘അനുസരിക്കുക’ എന്ന സാധ്യതയുള്ള ആശയം സന്ദർഭത്തിന് വിടുന്നു.
- source_word: μνημονεύετε
  choice: നിങ്ങൾ ഓർക്കുന്നില്ലേ
  rationale: മുമ്പുണ്ടായ സംഭവങ്ങൾ മനസ്സിൽ സൂക്ഷിക്കാത്തതിനെക്കുറിച്ചുള്ള യേശുവിന്റെ ശാസനയ്ക്ക് സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: καὶ
  choice: (ആദ്യ രണ്ട് ചോദ്യങ്ങൾക്കിടയിൽ പ്രത്യേകം പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല); മൂന്നാമത്തെ ചോദ്യത്തിൽ നേരിട്ടുള്ള തുടർച്ച
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ച καὶ ചോദ്യങ്ങൾക്ക് സഞ്ചിതബലം നൽകുന്നു. മലയാളത്തിൽ സമാന്തരവാക്യങ്ങളുടെ ക്രമവും അവസാന ചോദ്യത്തിന്റെ നേരിട്ടുള്ള തുടർച്ചയും അതേ ബലം സ്വാഭാവികമായി നൽകുന്നു; ഓരോ സ്ഥലത്തും ‘പിന്നെ/കൂടാതെ’ ചേർക്കുന്നത് കൃത്രിമമാകും.
- source_word: οὐ / οὐκ
  choice: ഇല്ലേ
  rationale: നിഷേധരൂപത്തിലുള്ള വാഗ്‌ചോദ്യങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന രൂപം; പ്രതീക്ഷിക്കുന്ന അനുകൂല ഉത്തരം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ചോദ്യഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘കാണുക’, ‘കേൾക്കുക’ എന്നിവയുടെ ഇന്ദ്രിയപരവും ആന്തരിക ഗ്രഹണപരവുമായ അർഥങ്ങൾ
  choice: പ്രധാന വാചകത്തിൽ ‘കാണുക’, ‘കേൾക്കുക’ എന്നീ നേരിട്ടുള്ള ക്രിയകൾ നിലനിർത്തി, ആത്മീയ മന്ദതയുടെ സൂചന സന്ദർഭത്തിലൂടെ പ്രവർത്തിക്കാൻ അനുവദിച്ചു.
  alternative: ‘ഗ്രഹിക്കുന്നില്ലേ’, ‘മനസ്സിലാക്കുന്നില്ലേ’ എന്ന് വിവർത്തനം ചെയ്ത് ആലങ്കാരിക അർഥം തുറന്നുപറയുക.
  rationale: ഗ്രീക്ക് സാധാരണ ഇന്ദ്രിയക്രിയകളാണ് ഉപയോഗിക്കുന്നത്; എന്നാൽ പ്രവാചകഭാഷയുടെ പശ്ചാത്തലത്തിൽ അവ ആന്തരിക ഗ്രഹണത്തെയും സൂചിപ്പിക്കാം. നേരിട്ടുള്ള പദങ്ങൾ നിലനിർത്തുന്നത് ഈ ഇരട്ടപ്രവർത്തനവും അന്തർഗ്രന്ഥബന്ധവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യംരൂപം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സമാന്തരതയും തുടർച്ചയായ ശാസനാത്മക ചോദ്യങ്ങളുടെ മൂർച്ചയും നിലനിർത്തി; വ്യാഖ്യാനപരമായ ‘ഗ്രഹിക്കുക/മനസ്സിലാക്കുക’ പ്രധാനവാചകത്തിലേക്ക് കൊണ്ടുവരാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
