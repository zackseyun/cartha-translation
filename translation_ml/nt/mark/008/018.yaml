  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ആവർത്തിച്ചുള്ള ചോദ്യരൂപം യേശുവിന്റെ തുടർച്ചയായ ശാസനയുടെ ഭാവം നിലനിർത്തുന്നു. ഓരോ καὶ-ക്കും വേർതിരിച്ച പദം ചേർക്കാതിരിക്കുന്നത് മലയാളശൈലിയിൽ അനാവശ്യമായ കൃത്രിമത ഒഴിവാക്കുന്നു.
  terminology: ‘കാണുക,’ ‘കേൾക്കുക,’ ‘ഓർക്കുക’ എന്നീ സാധാരണവും സന്ദർഭത്തിനു തുറന്നതുമായ പദങ്ങൾ ശരിയായി തിരഞ്ഞെടുത്തിരിക്കുന്നു. മുഖ്യവാചകത്തിൽ ആലങ്കാരിക/ആത്മീയ അർഥം അമിതമായി നിർവചിക്കാതെ, അടിക്കുറിപ്പിൽ ‘ഗ്രഹിക്കുക/മനസ്സിലാക്കുക’ എന്ന ബദൽ സൂചിപ്പിക്കുന്നത് ഉചിതമാണ്. അടിക്കുറിപ്പ് ആങ്കർ ശരിയായ സ്ഥാനത്തുണ്ട്.
