  text: καὶ ⸀ἠρώτα αὐτούς· Πόσους ἔχετε ἄρτους; οἱ δὲ εἶπαν· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/005.yaml
  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: ml
  text: 'അവൻ അവരോടു ചോദിച്ചു: “നിങ്ങളുടെ പക്കൽ എത്ര അപ്പങ്ങളുണ്ട്?” അവർ പറഞ്ഞു: “ഏഴ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: അവൻ
  rationale: ഗ്രീക്കിലെ ലളിതമായ ആഖ്യാനബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; പ്രത്യേകമായ കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: ἠρώτα αὐτούς
  choice: അവൻ അവരോടു ചോദിച്ചു
  rationale: അപൂർണഭൂതകാലരൂപത്തിന് ഇവിടെ സാധാരണ മലയാള ആഖ്യാനത്തിൽ ‘ചോദിച്ചു’ എന്ന പ്രയോഗം സ്വാഭാവികമാണ്; αὐτούς ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമമായി ‘അവരോടു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: Πόσους ἔχετε ἄρτους
  choice: നിങ്ങളുടെ പക്കൽ എത്ര അപ്പങ്ങളുണ്ട്?
  rationale: എണ്ണാവുന്ന അപ്പങ്ങളെക്കുറിച്ചുള്ള അളവുചോദ്യം വ്യക്തമായി നിലനിർത്തുന്നു; ἄρτους എന്ന ബഹുവചനം ‘അപ്പങ്ങൾ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: οἱ δὲ εἶπαν
  choice: അവർ പറഞ്ഞു
  rationale: δέ-യുടെ പ്രതികരണപരമായ വാക്യബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യമാറ്റത്തിലൂടെ പ്രകടമാകുന്നു; εἶπαν എന്നത് വ്യാഖ്യാനപരമായ ‘മറുപടി നൽകി’ എന്നതിനു പകരം നേരിട്ട് ‘പറഞ്ഞു’ എന്നു നിലനിർത്തി.
- source_word: Ἑπτά
  choice: ഏഴ്
  rationale: സംഖ്യാവാചകമായ നേരിട്ടുള്ള മറുപടി ലളിതമായി പുനരാവിഷ്കരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സംഭാഷണത്തിന്റെ ചുരുക്കവും മർക്കോസിന്റെ നേരിട്ടുള്ള ആഖ്യാനശൈലിയും നിലനിർത്തിയിരിക്കുന്നു.
