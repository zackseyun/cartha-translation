  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: ml
  text: “ജനക്കൂട്ടത്തോട് എനിക്ക് മനസ്സലിവ് തോന്നുന്നു; കാരണം, അവർ ഇതിനകം മൂന്നു ദിവസമായി എന്നോടൊപ്പം തുടരുന്നു, ഭക്ഷിക്കാൻ അവർക്കൊന്നുമില്ല.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: എനിക്ക് മനസ്സലിവ് തോന്നുന്നു
  rationale: ആഴമായ അനുകമ്പയെയും കരുണയെയും സൂചിപ്പിക്കുന്ന വർത്തമാനകാല ക്രിയയുടെ ഭാവം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പകരുന്നു.
- source_word: ἐπὶ τὸν ὄχλον
  choice: ഈ ജനക്കൂട്ടത്തോട്
  rationale: ἐπί + accusative ഇവിടെ അനുകമ്പയുടെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ജനക്കൂട്ടത്തോട്’ എന്നത് സ്വാഭാവികമാണ്. സന്ദർഭത്തിൽ സന്നിഹിതരായ കൂട്ടത്തെ സൂചിപ്പിക്കാൻ ‘ഈ’ ചേർത്തിരിക്കുന്നു.
- source_word: ὅτι
  choice: '[രണ്ടാമത്തെ സ്വതന്ത്രവാക്യമായി]'
  rationale: ὅτι കരുണയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ കാരണം വേറൊരു വാക്യമായി തുടർച്ചയായി പറയുന്നത് സ്വാഭാവികമാണ്; കാരണബന്ധം ആശയക്രമത്തിൽ വ്യക്തമാണ്.
- source_word: ἤδη
  choice: ഇതിനകം
  rationale: കാലയളവ് മൂന്നു ദിവസത്തിലെത്തിയെന്ന ഊന്നൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἡμέραι τρεῖς
  choice: മൂന്നു ദിവസമായി
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: προσμένουσίν μοι
  choice: എന്നോടൊപ്പം തുടരുന്നു
  rationale: προσμένω എന്ന ക്രിയയിലെ കൂടെ നിലനിൽക്കുക/തുടരുക എന്ന ആശയം പകരുകയും വർത്തമാനകാല രൂപം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: ഇവർക്കു ഭക്ഷിക്കാൻ ഒന്നുമില്ല
  rationale: ഭക്ഷണത്തിന്റെ അഭാവം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളം; τί + subjunctive എന്ന പ്രയോഗത്തിന്റെ അർഥം infinitive-സമാനമായ ‘ഭക്ഷിക്കാൻ’കൊണ്ട് നൽകുന്നു.
