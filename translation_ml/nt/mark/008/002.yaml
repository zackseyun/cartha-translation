revisions:
- from: “ഈ ജനക്കൂട്ടത്തോട് എനിക്ക് മനസ്സലിവ് തോന്നുന്നു. ഇവർ ഇതിനകം മൂന്നു ദിവസമായി എന്നോടൊപ്പം തുടരുന്നു; ഇവർക്കു ഭക്ഷിക്കാൻ ഒന്നുമില്ല.”
  to: “ജനക്കൂട്ടത്തോട് എനിക്ക് മനസ്സലിവ് തോന്നുന്നു; കാരണം, അവർ ഇതിനകം മൂന്നു ദിവസമായി എന്നോടൊപ്പം തുടരുന്നു, ഭക്ഷിക്കാൻ അവർക്കൊന്നുമില്ല.”
