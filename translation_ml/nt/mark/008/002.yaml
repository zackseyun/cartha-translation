translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള നേരിട്ടുള്ള സംഭാഷണശൈലി. ഗ്രീക്കിലെ വർത്തമാനകാല ‘തുടരുന്നു’ നിലനിർത്തി; വ്യാഖ്യാനപരമായോ സഭാവിഭാഗസവിശേഷമായോ പദങ്ങൾ ഒഴിവാക്കി.
