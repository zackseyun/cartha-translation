id: MRK.8.37
reference: Mark 8:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂τί γὰρ⸃ ⸀δοῖ ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: ml
  text: എന്തെന്നാൽ, ഒരു മനുഷ്യന് തന്റെ ജീവന് പകരമായി എന്തു കൊടുക്കാൻ കഴിയും?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ആത്മാവ്”; ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് “ജീവൻ,” “സ്വയം,” അല്ലെങ്കിൽ “ആത്മാവ്” എന്നർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: എന്തു
  rationale: τί ചോദ്യം അവതരിപ്പിക്കുന്നു; γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സന്ദർഭപ്രവാഹത്തിൽ ചോദ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δοῖ
  choice: കൊടുക്കാൻ കഴിയും
  rationale: δίδωμι എന്ന ക്രിയയുടെ aorist active subjunctive രൂപം ആലോചനാത്മകമായ അലങ്കാരചോദ്യത്തിൽ വരുന്നു; പ്രായോഗികമായ അസാധ്യതയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യന്
  rationale: ഏകവചനത്തിലുള്ള ἄνθρωπος ഇവിടെ പ്രതിനിധാനപരവും പൊതുവുമായ അർഥത്തിലാണ്; ‘ഒരു മനുഷ്യന്’ ഉറവിടരൂപവും പൊതുവായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἀντάλλαγμα
  choice: പകരമായി
  rationale: മടക്കമായി അഥവാ കൈമാറ്റമായി കൊടുക്കുന്ന ഒന്നിനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘പകരമായി’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: തന്റെ ജീവന്
  rationale: മർക്കോസ് 8:35–37-ലെ സന്ദർഭത്തിൽ ψυχή ജീവൻ, വ്യക്തിത്വം, ആത്മാവ് എന്നീ പാളികളുള്ള അർഥം വഹിക്കുന്നു. മുഖ്യപാഠത്തിൽ ‘ജീവൻ’ സന്ദർഭബന്ധവും വായനാസൗകര്യവും നൽകുന്നു; മറ്റു അർഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: രക്ഷാസംബന്ധിയായ ഈ വചനത്തിൽ ψυχή എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ജീവൻ
  alternative: ആത്മാവ്; സ്വയം/വ്യക്തിത്വം
  rationale: സന്ദർഭം ലോകം നേടുന്നതും ψυχή നഷ്ടപ്പെടുത്തുന്നതും തമ്മിൽ വിരുദ്ധമായി നിർത്തുന്നു. ‘ജീവൻ’ മുൻവാക്യങ്ങളുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു; എന്നാൽ പദത്തെ വെറും ജൈവജീവിതമായി ചുരുക്കാതിരിക്കാൻ ‘ആത്മാവ്’, ‘സ്വയം’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യം. ‘തന്റെ’ എന്നത് പൊതുവായ ഏകവചന മനുഷ്യനെ തിരിച്ചുസൂചിപ്പിക്കുന്നു; ψυχήയുടെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
