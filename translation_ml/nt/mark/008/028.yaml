base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “ചിലർ യോഹന്നാൻ സ്നാപകൻ എന്നും, മറ്റു ചിലർ ഏലിയാവ് എന്നും, വേറെ ചിലർ പ്രവാചകന്മാരിൽ ഒരാൾ എന്നും പറയുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “അവർ അവനോടു പറഞ്ഞു: ‘ചിലർ നീ യോഹന്നാൻ സ്നാപകനാണെന്നും, മറ്റു ചിലർ നീ ഏലിയാവാണെന്നും, വേറെ ചിലർ നീ പ്രവാചകന്മാരിൽ ഒരാളാണെന്നും പറയുന്നു.’” ഗ്രീക്കിൽ പിന്നീടുള്ള ഘടകങ്ങളിൽ ‘പറയുന്നു’ എന്ന ക്രിയയും ‘നീ ആകുന്നു’ എന്ന വിധേയഭാഗവും ആവർത്തിക്കുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: അവർ
  rationale: മുൻസന്ദർഭത്തിലെ ശിഷ്യന്മാരെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. δέ-യുടെ നേരിയ ബന്ധകഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പരോക്ഷമാക്കുന്നു.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: അവർ അവനോടു പറഞ്ഞു
  rationale: ഒരേ അർത്ഥമേഖലയിലുള്ള ക്രിയയും കൃദന്തവും ചേർന്ന ഗ്രീക്ക് റിപ്പോർട്ടിങ് ശൈലി മലയാളത്തിൽ അതേപടി ആവർത്തിച്ചാൽ കൃത്രിമമാകും; ‘അവനോടു പറഞ്ഞു’ എന്നത് അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: യോഹന്നാൻ സ്നാപകൻ
  rationale: ചരിത്രപുരുഷന്റെ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾനാമവും വിശേഷണവുമാണ്; ഇവിടെ ഒരു സഭാവിഭാഗത്തിന്റെ പേരെന്ന അർത്ഥമില്ല.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: മറ്റു ചിലർ ... വേറെ ചിലർ
  rationale: വ്യത്യസ്ത ജനവിഭാഗങ്ങൾ വ്യത്യസ്ത അഭിപ്രായങ്ങൾ പറഞ്ഞുവെന്ന വിതരണാത്മക വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ἠλίαν
  choice: ഏലിയാവ്
  rationale: മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: പ്രവാചകന്മാരിൽ ഒരാൾ എന്നും
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും അപൂർണ്ണവുമായ വാക്യഘടന സംരക്ഷിക്കുമ്പോഴും ‘എന്നും’ ചേർത്ത് റിപ്പോർട്ട് ചെയ്ത തിരിച്ചറിയലുകളുടെ പട്ടിക മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: προφητῶν
  choice: പ്രവാചകന്മാർ
  rationale: ഇസ്രായേലിന്റെ പ്രവാചകവ്യക്തികളെ സൂചിപ്പിക്കുന്ന സാധാരണവും മാന്യവുമായ മലയാളപദം.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള ജനാഭിപ്രായങ്ങളുടെ അവതരണം
  choice: ‘നീ ... ആകുന്നു’ എന്ന സൂചിത വിധേയഭാഗം ഓരോ ഇനത്തിലും തുറന്നെഴുതാതെ, തിരിച്ചറിയലുകളുടെ സംക്ഷിപ്ത പട്ടികയായി നിലനിർത്തി.
  alternative: “നീ യോഹന്നാൻ സ്നാപകനാണെന്നും, മറ്റു ചിലർ നീ ഏലിയാവാണെന്നും, വേറെ ചിലർ നീ പ്രവാചകന്മാരിൽ ഒരാളാണെന്നും.”
  rationale: മൂലഗ്രീക്ക് തുടർന്നുള്ള ഘടകങ്ങളിൽ വിധേയക്രിയ വ്യക്തമാക്കാതെ വിടുന്നു. അത് തുറന്നെഴുതുന്നത് അർത്ഥം വ്യക്തമാക്കുമെങ്കിലും മൂലത്തിലെ സംക്ഷിപ്തതയും വാക്യഘടനാപരമായ തുറന്ന സ്വഭാവവും കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ സംക്ഷിപ്ത പട്ടികാഭാവം നിലനിർത്തിയിരിക്കുന്നു; വായനാസൗകര്യത്തിനായി ഉദ്ധരണിക്കുള്ളിൽ ‘എന്നും’ ആവർത്തിക്കുന്നു.
