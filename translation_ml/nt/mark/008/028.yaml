- from: 'അവർ അവനോടു പറഞ്ഞു: “യോഹന്നാൻ സ്നാപകൻ എന്നും, മറ്റു ചിലർ ഏലിയാവ് എന്നും, വേറെ ചിലർ പ്രവാചകന്മാരിൽ ഒരാൾ എന്നും.”[a]'
  to: 'അവർ അവനോടു പറഞ്ഞു: “ചിലർ യോഹന്നാൻ സ്നാപകൻ എന്നും, മറ്റു ചിലർ ഏലിയാവ് എന്നും, വേറെ ചിലർ പ്രവാചകന്മാരിൽ ഒരാൾ എന്നും പറയുന്നു.”[a]'
