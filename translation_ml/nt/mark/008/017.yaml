    issue: Final verbal aspect and idiom
    rationale: Greek πεπωρωμένην ἔχετε describes a heart that has become hardened and remains so. Replacing 'കഠിനപ്പെട്ടിരിക്കുകയാണോ' with 'കഠിനപ്പെട്ടിരിക്കുന്നുവോ' better conveys this state in standard Malayalam.
