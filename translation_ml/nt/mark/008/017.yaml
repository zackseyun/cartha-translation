id: MRK.8.17
reference: Mark 8:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: ml
  text: 'അവരുടെ സംസാരം അറിഞ്ഞ് യേശു അവരോടു പറഞ്ഞു: “അപ്പം ഇല്ലെന്നതിനെക്കുറിച്ച് നിങ്ങൾ തമ്മിൽ ചർച്ച ചെയ്യുന്നത് എന്തിന്? ഇനിയും നിങ്ങൾ ഗ്രഹിക്കുകയോ മനസ്സിലാക്കുകയോ ചെയ്യുന്നില്ലേ? നിങ്ങളുടെ ഹൃദയം കഠിനപ്പെട്ടിരിക്കുന്നുവോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങളുടെ ഹൃദയങ്ങൾ കഠിനപ്പെട്ടിരിക്കുന്നുവോ?” ഗ്രീക്കിൽ ‘ഹൃദയം’ ഏകവചനത്തിലാണ്; അത് ശിഷ്യന്മാരുടെ ഹൃദയത്തെ കൂട്ടായോ ഓരോരുത്തരുടെയും ഹൃദയത്തെ വിതരണാർഥത്തിലോ സൂചിപ്പിക്കാം.'
    reason: source_ambiguity
lexical_decisions:
- source_word: γνοὺς
  choice: അവരുടെ സംസാരം അറിഞ്ഞ്
  rationale: അയോറിസ്റ്റ് കൃദന്തം യേശു ശിഷ്യന്മാരുടെ ചർച്ച അറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്ന കർമം ‘അവരുടെ സംസാരം’ എന്നു ചേർക്കുന്നത് സ്വാഭാവികമായിരിക്കുമ്പോഴും അർത്ഥം അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: διαλογίζεσθε
  choice: നിങ്ങൾ തമ്മിൽ ചർച്ച ചെയ്യുന്നത്
  rationale: ഇവിടെ പദം ശിഷ്യന്മാരുടെ പരസ്പര ആലോചനയെയോ വാദപ്രതിവാദത്തെയോ സൂചിപ്പിക്കുന്നു. ‘തമ്മിൽ ചർച്ച ചെയ്യുക’ ഉടനെയുള്ള സന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: ἄρτους
  choice: അപ്പം
  rationale: ഗ്രീക്കിൽ ബഹുവചനമായ ‘അപ്പങ്ങൾ’ ആണെങ്കിലും, ഭക്ഷണസാധനത്തെ പൊതുവായി സൂചിപ്പിക്കുമ്പോൾ മലയാളത്തിൽ ‘അപ്പം’ സ്വാഭാവികമാണ്; സന്ദർഭത്തിലെ കുറവ് ഇതിലൂടെ വ്യക്തമാണ്.
- source_word: νοεῖτε
  choice: ഗ്രഹിക്കുക
  rationale: മനസ്സുകൊണ്ട് തിരിച്ചറിയുക, ബോധ്യപ്പെടുക എന്ന ഭാവം നൽകുകയും തുടർന്നുള്ള συνίετε എന്ന പദത്തിൽനിന്നുള്ള സൂക്ഷ്മ വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: συνίετε
  choice: മനസ്സിലാക്കുക
  rationale: അർത്ഥം കൂട്ടിച്ചേർത്ത് മനസ്സിലാക്കുക എന്ന സാധാരണ അർത്ഥം നൽകുന്നു; മുൻപുള്ള ‘ഗ്രഹിക്കുക’ എന്ന ക്രിയയോടുള്ള വാക്ചാതുര്യമുള്ള ജോടിയും സംരക്ഷിക്കുന്നു.
- source_word: πεπωρωμένην
  choice: കഠിനപ്പെട്ടിരിക്കുകയാണ്
  rationale: പൂർണ്ണകാല നിഷ്ക്രിയ കൃദന്തം കഠിനത വന്നതും ആ അവസ്ഥ തുടരുന്നതും സൂചിപ്പിക്കുന്നു. ഈ രൂപം ആത്മീയ അസംവേദനയുടെ രൂപകം നിലനിർത്തുന്നു.
- source_word: καρδίαν
  choice: ഹൃദയം
  rationale: മനസ്സിലാക്കലും പ്രതികരണശേഷിയും ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിത്വത്തിന്റെ ഉറവിടം എന്ന ബൈബിൾ രൂപകം അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ ഹൃദയാവസ്ഥയെക്കുറിച്ചുള്ള അവസാന ചോദ്യം
  choice: നിങ്ങളുടെ ഹൃദയം കഠിനപ്പെട്ടിരിക്കുകയാണോ?
  alternative: നിങ്ങളുടെ ഹൃദയങ്ങൾ കഠിനപ്പെട്ടിരിക്കുകയാണോ? / നിങ്ങളുടെ ഹൃദയം കഠിനപ്പെട്ട നിലയിൽ നിങ്ങൾക്കുണ്ടോ?
  rationale: ἔχετε + കർമം + കൃദന്തം എന്ന ഗ്രീക്ക് ഘടന ഹൃദയം കഠിനപ്പെട്ട അവസ്ഥയിൽ ഉള്ളതാണോ എന്നു ചോദിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ അവസ്ഥാവാക്യം ഉപയോഗിച്ചെങ്കിലും, ഏകവചനമായ ‘ഹൃദയം’യും ചോദ്യം ഉയർത്തുന്ന ആത്മീയ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചോദ്യം-ശൈലി ഉപയോഗിച്ചു. ചരിത്രവർത്തമാനമായ λέγει മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലമായ ‘പറഞ്ഞു’ എന്നു നൽകി. ‘ഗ്രഹിക്കുക / മനസ്സിലാക്കുക’ എന്ന ജോടി രണ്ട് ഗ്രീക്ക് ക്രിയകളുടെയും ആവർത്തനാത്മകമായെങ്കിലും വ്യത്യസ്തമായ ഊന്നൽ സംരക്ഷിക്കുന്നു.
