  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: ml
  text: '“അയ്യായിരംപേർക്കായി ഞാൻ ആ അഞ്ച് അപ്പങ്ങൾ മുറിച്ചപ്പോൾ, മുറിച്ച കഷണങ്ങൾ നിറഞ്ഞ എത്ര കൊട്ടകൾ നിങ്ങൾ എടുത്തു?[a]” അവർ അവനോട് പറഞ്ഞു: “പന്ത്രണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എടുത്തു’ എന്നതിന് ‘ശേഖരിച്ചെടുത്തു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε
  choice: മുറിച്ചപ്പോൾ
  rationale: മുൻപ് നടന്ന അപ്പം വർധിപ്പിച്ച സംഭവത്തെ സൂചിപ്പിക്കുന്ന സമയോപവാക്യം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τοὺς πέντε ἄρτους
  choice: ആ അഞ്ച് അപ്പം
  rationale: എണ്ണാവുന്ന അപ്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സംഖ്യയ്ക്കുശേഷം ഏകവചനരൂപം സ്വാഭാവികമാണ്. നിർദ്ദേശകപദം മുമ്പ് പരാമർശിച്ച അപ്പങ്ങളെ തിരിച്ചറിയിക്കുന്നു.
- source_word: ἔκλασα
  choice: ഞാൻ ... മുറിച്ചപ്പോൾ
  rationale: κλάω അപ്പം വിഭജിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിലും സാധാരണ പ്രയോഗത്തിലും ‘അപ്പം മുറിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: അയ്യായിരംപേർക്കായി
  rationale: അപ്പം നൽകിയ ജനക്കൂട്ടത്തോടുള്ള ദിശ/പ്രയോജനം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ ‘പുരുഷന്മാർ’ എന്ന നാമം പ്രത്യേകം ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: πόσους κοφίνους
  choice: എത്ര കൊട്ടകൾ
  rationale: എണ്ണം ചോദിക്കുന്ന നേരിട്ടുള്ള ചോദ്യരൂപവും സാധാരണ മലയാളപദവും നിലനിർത്തുന്നു.
- source_word: κλασμάτων πλήρεις
  choice: മുറിച്ച കഷണങ്ങൾ നിറച്ച
  rationale: അപ്പം മുറിച്ചതിന്റെ ഫലമായ ശേഷിച്ച കഷണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നിറച്ച’ കൊട്ടകളുടെ നിറവിനെയും വ്യക്തമാക്കുന്നു.
- source_word: ἤρατε
  choice: നിങ്ങൾ എടുത്തത്
  rationale: αἴρω ഇവിടെ ശേഷിച്ച കഷണങ്ങൾ ശേഖരിച്ച് എടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: λέγουσιν αὐτῷ
  choice: അവർ അവനോട് പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Δώδεκα
  choice: പന്ത്രണ്ട്
  rationale: ചോദ്യത്തിനുള്ള നേരിട്ടുള്ള സംഖ്യാമാത്രമായ മറുപടി; ‘കൊട്ടകൾ’ ആവർത്തിക്കേണ്ടതില്ല.
theological_decisions:
- issue: πεντακισχιλίους എന്നതിന്റെ പ്രതിനിധാനപരമായ വ്യാപ്തി
  choice: അയ്യായിരംപേർക്കായി
  alternative: അയ്യായിരം പുരുഷന്മാർക്കായി
  rationale: ഗ്രീക്ക് രൂപം പുൽലിംഗമാണെങ്കിലും ഈ വാക്യത്തിൽ ‘പുരുഷന്മാർ’ എന്ന നാമം പ്രത്യേകം ചേർത്തിട്ടില്ല; അറിയപ്പെടുന്ന ജനക്കൂട്ടത്തെ സംഖ്യകൊണ്ട് വിളിക്കുന്ന പ്രയോഗമായതിനാൽ ലിംഗവിശദീകരണം മുഖ്യവാചകത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ നേരിട്ടും മാന്യവുമായ സംഭാഷണശൈലി. ഗ്രീക്ക് പദക്രമം യാന്ത്രികമായി അനുകരിക്കാതെ ചോദ്യത്തിന്റെ ഊന്നലും അപ്പം മുറിച്ചതും ശേഷിപ്പുകൾ എടുത്തതും തമ്മിലുള്ള ബന്ധവും നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
