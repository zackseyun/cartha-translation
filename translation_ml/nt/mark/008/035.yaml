id: MRK.8.35
reference: Mark 8:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: ml
  text: കാരണം, തന്റെ ജീവൻ രക്ഷിക്കാൻ ആഗ്രഹിക്കുന്നവൻ അതു നഷ്ടപ്പെടുത്തും; എന്നാൽ എനിക്കുവേണ്ടിയും സുവിശേഷത്തിനുവേണ്ടിയും തന്റെ ജീവൻ നഷ്ടപ്പെടുത്തുന്നവൻ അതു രക്ഷിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലുടനീളം ‘ജീവൻ’ എന്നതിന് പകരം ‘ആത്മാവ്’ എന്നും പരിഭാഷപ്പെടുത്താം; ψυχή എന്ന ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് ഈ രണ്ടർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: ജീവൻ
  rationale: ഈ ശിഷ്യത്വവചനത്തിൽ ഒരാളുടെ ഭൗമിക ജീവൻ/സ്വയം എന്ന അർഥമാണ് മുൻപന്തിയിൽ. ‘ജീവൻ’ എന്നു നൽകുന്നത് രക്ഷിക്കുക–നഷ്ടപ്പെടുത്തുക എന്ന വിരോധാഭാസം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘ആത്മാവ്’ എന്ന സാദ്ധ്യമായ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: σῶσαι / σώσει
  choice: രക്ഷിക്കാൻ / രക്ഷിക്കും
  rationale: σῴζωയുടെ രണ്ടു പ്രയോഗങ്ങൾക്കിടയിലെ പദബന്ധവും വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്താൻ ഒരേ ‘രക്ഷിക്കുക’ ക്രിയ ഉപയോഗിച്ചു.
- source_word: ἀπολέσει
  choice: നഷ്ടപ്പെടുത്തും
  rationale: ψυχήയോടൊപ്പമുള്ള ഈ സന്ദർഭത്തിൽ ‘നഷ്ടപ്പെടുത്തുക’ എന്നതാണ് സ്വാഭാവികം; ‘നശിപ്പിക്കുക’ അതിരുകടന്ന ശക്തിയുള്ളതും ‘കൈവിട്ടുകളയുക’ കൂടുതൽ വ്യാഖ്യാനാത്മകവുമാണ്.
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: എനിക്കുവേണ്ടിയും സുവിശേഷത്തിനുവേണ്ടിയും
  rationale: ἕνεκεν സൂചിപ്പിക്കുന്ന കാരണവും നിമിത്തവും വ്യക്തമായി സൂക്ഷിക്കുകയും, യേശുവിനോടും സുവിശേഷത്തോടും ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εὐαγγέλιον
  choice: സുവിശേഷം
  rationale: മർക്കോസിലെ മുഖ്യ ആശയപദവുമായി ബന്ധം സൂക്ഷിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ὃς ... ὃς
  choice: ആഗ്രഹിക്കുന്നവൻ ... നഷ്ടപ്പെടുത്തുന്നവൻ
  rationale: ഗ്രീക്കിലെ പൊതുവായ, അനിശ്ചിതമായ പ്രയോഗം മലയാളത്തിലെ ‘-ുന്നവൻ’ ഘടനയിലൂടെ സ്വാഭാവികമായും ഏകവചനമായും പുനരാവിഷ്കരിച്ചു.
- source_word: θέλῃ
  choice: ആഗ്രഹിക്കുന്ന
  rationale: ഇച്ഛയെയും മനസ്സോടെയുള്ള ഉദ്ദേശ്യത്തെയും വ്യക്തവും നിലവാരമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: αὐτοῦ / αὐτήν
  choice: തന്റെ / അതു
  rationale: പ്രതിനിധിക ഏകവചനത്തിന്റെ പ്രതിഫലനാത്മക ബന്ധം ‘തന്റെ’ എന്നും ‘ജീവൻ’ എന്ന മുൻപദത്തിലേക്കുള്ള സൂചന ‘അതു’ എന്നും നൽകി.
theological_decisions:
- issue: യേശുവിന്റെ വിരോധാഭാസവചനത്തിലെ ψυχήയുടെ മനുഷ്യസ്വഭാവസംബന്ധിയായ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ജീവൻ’
  alternative: ‘ആത്മാവ്’
  rationale: ഉടൻമുമ്പുള്ള പശ്ചാത്തലം സ്വയം നിഷേധിക്കൽ, ശിഷ്യത്വം, യേശുവിനും സുവിശേഷത്തിനുംവേണ്ടി ജീവൻ നഷ്ടപ്പെടുത്തൽ എന്നിവയാണ്. അതിനാൽ ‘ജീവൻ’ വചനത്തിന്റെ മുഖ്യശക്തി നൽകുന്നു; എന്നാൽ ψυχήയുടെ വിശാലമായ അർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ഗ്രീക്കിലെ പൊതുവായ പുല്ലിംഗ ഏകവചനം
  choice: ‘-ുന്നവൻ’ എന്ന ഏകവചന പൊതുപ്രയോഗം നിലനിർത്തുക
  alternative: ലിംഗഭേദമില്ലാത്ത ബഹുവചനരൂപം ഉപയോഗിക്കുക
  rationale: ഗ്രീക്ക് വാക്യം ഏകവചന പ്രതിനിധിക രൂപത്തിലാണ്. മലയാളത്തിലെ ഈ രൂപം വാക്യത്തിന്റെ പൊതുവായ പ്രയോഗശക്തി നിലനിർത്തുന്നു; ഇത് പുരുഷന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘രക്ഷിക്കുക–നഷ്ടപ്പെടുത്തുക’ എന്ന ആവർത്തനവും വിരോധാഭാസവും സൂക്ഷിച്ചു. യഥാർഥ ഗ്രീക്ക് വാചകത്തിൽ ἕνεκεν ഇരുവസ്തുക്കളെയും നിയന്ത്രിക്കുന്നതിനാൽ മലയാളത്തിൽ വ്യക്തതയ്ക്കും സ്വാഭാവികതയ്ക്കുമായി ‘-വേണ്ടിയും’ രണ്ടിടത്തും ആവർത്തിച്ചു.
