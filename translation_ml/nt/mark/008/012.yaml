id: MRK.8.12
reference: Mark 8:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: ml
  text: 'അവൻ തന്റെ ആത്മാവിൽ ആഴമായി നെടുവീർപ്പിട്ടുകൊണ്ട് പറയുന്നു: “ഈ തലമുറ ഒരു അടയാളം അന്വേഷിക്കുന്നത് എന്തിന്? സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഈ തലമുറയ്ക്ക് ഒരു അടയാളവും നൽകപ്പെടുകയില്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഈ തലമുറയ്ക്ക് ഒരു അടയാളം നൽകപ്പെടുമെങ്കിൽ.” ഒരു അടയാളവും നൽകപ്പെടുകയില്ല എന്നർഥമുള്ള ഗ്രീക്ക് ശപഥസദൃശമായ പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστενάξας
  choice: ദീർഘമായി നെടുവീർപ്പിട്ടുകൊണ്ട്
  rationale: ἀνα- എന്ന തീവ്രതയും ആഴത്തിലുള്ള വികാരപ്രകടനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; അതിനാടകീയമായ ‘ഞരങ്ങുക’ ഒഴിവാക്കുന്നു.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: തന്റെ ആത്മാവിൽ
  rationale: ഗ്രീക്കിലെ ദത്തിവിന്റെ വ്യാപ്തി/ബന്ധഭാവവും ‘ആത്മാവ്’ എന്ന മനുഷ്യസ്വഭാവസംബന്ധിയായ ഭാഷയും നിലനിർത്തുന്നു; വെറും ‘മനസ്സിൽ’ എന്ന് ചുരുക്കുന്നില്ല.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു.
- source_word: Τί
  choice: എന്തിന്
  rationale: ക്രിയയോടൊപ്പമുള്ള τί ഇവിടെ കാരണത്തെ ചോദിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്തിന്’ എന്നാണ്.
- source_word: γενεὰ
  choice: തലമുറ
  rationale: കൂട്ടായതും കാലപരവുമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്ന പതിവ് തുല്യപദം.
- source_word: ζητεῖ
  choice: അന്വേഷിക്കുന്നത്
  rationale: ‘ആവശ്യപ്പെടുക’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ‘തേടുക’ എന്ന അർഥം സൂക്ഷിക്കുകയും സന്ദർഭത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: σημεῖον
  choice: അടയാളം
  rationale: സാക്ഷ്യപ്പെടുത്തുന്ന അത്ഭുതസൂചനയുടെ ദൈവശാസ്ത്രപരമായ അർഥസാധ്യത അധികവാക്കുകൾ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവപൂർണമായ പ്രഖ്യാപനസൂത്രത്തിന്റെ ശക്തി വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: ഈ തലമുറയ്ക്ക് ഒരു അടയാളവും നൽകപ്പെടുകയില്ല
  rationale: εἰ ഉപയോഗിച്ചുള്ള സെമിറ്റിക് ശപഥസദൃശമായ അപൂർണപ്രയോഗം ശക്തമായ നിഷേധമാണ്; അതിന്റെ ഉദ്ദേശിച്ച അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ἀμὴν λέγω ὑμῖν എന്നതിന് ശേഷമുള്ള ശപഥസദൃശമായ εἰ വാക്യത്തിന്റെ വിവർത്തനം
  choice: 'ശക്തമായ നിഷേധമായി: ‘ഈ തലമുറയ്ക്ക് ഒരു അടയാളവും നൽകപ്പെടുകയില്ല.’'
  alternative: 'അക്ഷരാർഥത്തിൽ: ‘ഈ തലമുറയ്ക്ക് ഒരു അടയാളം നൽകപ്പെടുമെങ്കിൽ’'
  rationale: ഗ്രീക്ക് രൂപം അക്ഷരാർഥത്തിൽ ഉപാധിവാക്യംപോലെ തോന്നുമെങ്കിലും, ഇവിടെ അത് ശപഥസദൃശമായ പ്രയോഗമായി ഉറച്ച നിഷേധം അറിയിക്കുന്നു. മുഖ്യപാഠത്തിൽ അർഥം വ്യക്തമാക്കുകയും അടിക്കുറിപ്പിൽ രൂപം രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ആത്മാവിൽ’ എന്ന മൂലഭാഷാപരമായ മനുഷ്യസ്വഭാവസംബന്ധിയായ പദപ്രയോഗവും മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ എന്ന രൂപവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ശപഥസദൃശ നിഷേധവാക്യത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
