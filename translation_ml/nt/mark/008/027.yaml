id: MRK.8.27
reference: Mark 8:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: ml
  text: യേശു തന്റെ ശിഷ്യന്മാരോടൊപ്പം കൈസര്യ ഫിലിപ്പിയുടെ ഗ്രാമങ്ങളിലേക്കു പുറപ്പെട്ടു. വഴിയിൽവെച്ച് അദ്ദേഹം തന്റെ ശിഷ്യന്മാരോടു, “ഞാൻ ആരാണെന്നാണ് ആളുകൾ പറയുന്നത്?” എന്നു ചോദിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: ἐξέρχομαι എന്ന ക്രിയയിലെ പുറത്തേക്കുള്ള/യാത്രതിരിക്കുന്ന ചലനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ ‘പുറത്തുപോയി’ എന്നതിനെക്കാൾ യാത്രയുടെ ആരംഭം വ്യക്തമാക്കുന്നു.
- source_word: κώμας
  choice: ഗ്രാമങ്ങൾ
  rationale: κώμη സാധാരണയായി വലിയ നഗരമല്ലാത്ത ഗ്രാമത്തെയോ ചെറുകുടിയിരിപ്പിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: കൈസര്യ ഫിലിപ്പി
  rationale: സ്ഥലനാമം മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു; വിഭക്തിബന്ധം ‘കൈസര്യ ഫിലിപ്പിയുടെ’ എന്ന് പ്രകടമാക്കുന്നു.
- source_word: ἐν τῇ ὁδῷ
  choice: വഴിയിൽവെച്ച്
  rationale: യാത്രയ്ക്കിടയിലെ സംഭവമെന്ന അർഥവും മർക്കൊസിന്റെ യാത്രാവിവരണത്തിന്റെ ഭാവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐπηρώτα
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടരുന്ന പ്രവൃത്തിഭാവം സംരക്ഷിക്കുന്നു.
- source_word: λέγων αὐτοῖς
  choice: എന്നു
  rationale: ഗ്രീക്കിലെ ഉദ്ധരണി അവതരിപ്പിക്കുന്ന participial ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ധരണിഘടനയായി സംയോജിപ്പിച്ചു; അർഥഘടകമൊന്നും നഷ്ടപ്പെടുന്നില്ല.
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: ഞാൻ ആരാണെന്നാണ് ആളുകൾ പറയുന്നത്?
  rationale: τίνα ... εἶναι എന്നത് വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ചോദ്യമാണ്. ἄνθρωποι പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിരപേക്ഷമായ ‘ആളുകൾ’ യോജിക്കുന്നു.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: ശിഷ്യന്മാർ / ശിഷ്യന്മാരോട്
  rationale: μαθηταί എന്നതിന് പ്രചാരത്തിലുള്ള മതഗ്രന്ഥപരവും ആധുനികവുമായ പദം ‘ശിഷ്യന്മാർ’ ആണ്. ആദ്യപ്രയോഗത്തിൽ യേശുവിനോടുള്ള കൂട്ടായ്മയും രണ്ടാമത്തെ പ്രയോഗത്തിൽ സന്ദർഭവും ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്നതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി.
theological_decisions:
- issue: യേശുവിന്റെ ചോദ്യത്തിലെ പൊതുവാചകമായ ἄνθρωποι
  choice: ആളുകൾ
  alternative: മനുഷ്യർ / പുരുഷന്മാർ
  rationale: ഈ സന്ദർഭത്തിൽ പദം പൊതുജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു; ‘പുരുഷന്മാർ’ എന്ന് നൽകിയാൽ മൂലത്തിൽ ഇല്ലാത്ത ലിംഗപരമായ പരിമിതി വരും. ‘ആളുകൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അർഥകൃത്യവുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ തുടർച്ചാഭാവം ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി ക്രമീകരിച്ചെങ്കിലും സ്ഥലലക്ഷ്യം, യാത്രാമധ്യസ്ഥിതി, ചോദ്യം എന്നിവ സംരക്ഷിച്ചു.
