  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν ⸀δὲ ὡς τετρακισχίλιοι. καὶ ἀπέλυσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: ml
  text: അവർ ഏകദേശം നാലായിരം പേരായിരുന്നു. അവൻ അവരെ പറഞ്ഞയച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പിരിച്ചുവിട്ടു.’
    reason: ἀπολύω എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ‘പറഞ്ഞയച്ചു’ എന്നും ‘പിരിച്ചുവിട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: ἦσαν
  choice: ആയിരുന്നു
  rationale: ഇവിടെ εἰμί ജനക്കൂട്ടത്തിന്റെ എണ്ണം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നാലായിരം പേരായിരുന്നു’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: δὲ
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: δὲ മൃദുവായ വ്യവഹാരബന്ധകമാണ്. സ്വതന്ത്രമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചന ചേർക്കാതെ, മലയാളത്തിലെ വാക്യക്രമംകൊണ്ട് ബന്ധം നിലനിർത്തുന്നു.
- source_word: ὡς
  choice: ഏകദേശം
  rationale: സംഖ്യയോടൊപ്പമുള്ള ὡς ഏകദേശ കണക്കാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τετρακισχίλιοι
  choice: നാലായിരം പേർ
  rationale: ജനക്കൂട്ടത്തിന്റെ ഏകദേശ എണ്ണം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: വാക്യത്തുടർച്ചയായി പ്രകടിപ്പിച്ചു
  rationale: καὶ ലളിതമായ സംഭവത്തുടർച്ചയാണ് നൽകുന്നത്; മലയാളത്തിൽ പുതിയ വാക്യത്തിലേക്കുള്ള സ്വാഭാവിക തുടർച്ച അതിന്റെ ബന്ധകശക്തി വഹിക്കുന്നു.
- source_word: ἀπέλυσεν
  choice: പറഞ്ഞയച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ἀπολύω ജനക്കൂട്ടത്തെ പോകാൻ അനുവദിച്ച് യാത്രയാക്കുക എന്നർഥം നൽകുന്നു; ‘പറഞ്ഞയച്ചു’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: αὐτούς
  choice: അവരെ
  rationale: സർവനാമം മുമ്പ് പരാമർശിച്ച ജനക്കൂട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലപാഠത്തിൽ ഇല്ലാത്ത വ്യക്തമായ കാലസൂചന ഒഴിവാക്കി; ഏകദേശ സംഖ്യയും ജനക്കൂട്ടത്തെ യാത്രയാക്കുന്ന പ്രവർത്തിയും സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
