id: MRK.8.4
reference: Mark 8:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: ml
  text: 'അവന്റെ ശിഷ്യന്മാർ അവനോടു മറുപടി പറഞ്ഞു: “ഈ വിജനസ്ഥലത്ത് ഈ ആളുകളെ അപ്പംകൊണ്ട് തൃപ്തിപ്പെടുത്താൻ എവിടെനിന്നാണ് ആർക്കെങ്കിലും കഴിയുക?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഈ വിജനസ്ഥലത്ത് ഈ ആളുകൾക്ക് മതിവരുവോളം അപ്പം കൊടുക്കാൻ ആർക്കെങ്കിലും എങ്ങനെ കഴിയും?”'
    reason: Πόθεν അക്ഷരാർഥത്തിൽ ‘എവിടെനിന്ന്’ എന്നാണ്. മുഴുവൻ ചോദ്യത്തെ ഉറവിടത്തെക്കാൾ പ്രായോഗിക സാധ്യതയെ മുൻനിർത്തി ‘എങ്ങനെ’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: മറുപടി പറഞ്ഞു
  rationale: കഥനസന്ദർഭത്തിലെ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: ὅτι
  choice: നേരിട്ടുള്ള ഉദ്ധരണിയായി വിരാമചിഹ്നം
  rationale: സംസാരക്രിയയ്ക്കു ശേഷം നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേക പദത്തേക്കാൾ ഉദ്ധരണിചിഹ്നം സ്വാഭാവികമാണ്.
- source_word: Πόθεν
  choice: എവിടെനിന്ന്
  rationale: ലഭ്യതയുടെ ഉറവിടത്തെക്കുറിച്ചുള്ള ചോദ്യത്തെ മൂലപാഠത്തോട് അടുത്തുനിന്ന് നിലനിർത്തുന്നു; ‘എങ്ങനെ’ എന്ന വ്യാഖ്യാനപരമായ മാറ്റം ഒഴിവാക്കുന്നു.
- source_word: τούτους
  choice: ഈ ആളുകളെ
  rationale: പുരുഷലിംഗ ബഹുവചന സർവനാമം ജനക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; ലിംഗപരമായി അനാവശ്യമായി ചുരുക്കാതെ സൂചിതരെ വ്യക്തമാക്കുന്നു.
- source_word: δυνήσεταί τις
  choice: ആർക്കെങ്കിലും ലഭിക്കും
  rationale: ഭാവിയിലെ സാധ്യതയും അനിശ്ചിത വ്യക്തിയെയും മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യരൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘കഴിയും’ എന്ന കഴിവിന്റെ അർഥം പ്രസക്തിയിൽ ലഭ്യതയുമായി ചേർത്ത് നൽകുന്നു.
- source_word: ὧδε
  choice: ഈ ... സ്ഥലത്ത്
  rationale: ‘ഇവിടെ’ എന്ന സ്ഥാനസൂചനയെ ‘ഈ വിജനസ്ഥലത്ത്’ എന്ന സ്വാഭാവിക മലയാള ഘടനയിൽ ഉൾക്കൊള്ളിക്കുന്നു.
- source_word: χορτάσαι
  choice: തൃപ്തരാക്കാൻ
  rationale: വെറും ഭക്ഷണം കൊടുക്കുക എന്നതിലുപരി മതിവരുവോളം ഭക്ഷിപ്പിക്കുക എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἄρτων
  choice: അപ്പം
  rationale: ἄρτος എന്ന പദത്തിന്റെ നേരിട്ടുള്ള, സാധാരണ മലയാള സമാനപദം; ‘ഭക്ഷണം’ എന്നു പൊതുവൽക്കരിക്കുന്നില്ല.
- source_word: ἐπ’ ἐρημίας
  choice: വിജനസ്ഥലത്ത്
  rationale: ജനവാസമില്ലാത്തതോ ഒറ്റപ്പെട്ടതോ ആയ പ്രദേശം എന്ന അർഥം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. ഉറവിടത്തെക്കുറിച്ചുള്ള Πόθεν എന്ന ചോദ്യഭാവം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; കൂടുതൽ സ്വാഭാവികമായ ശേഷി-കേന്ദ്രിത വായന അടിക്കുറിപ്പിൽ നൽകി.
