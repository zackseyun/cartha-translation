  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: ml
  text: തന്നെക്കുറിച്ച് ആരോടും പറയരുതെന്ന് അവൻ അവർക്കു കർശനമായി മുന്നറിയിപ്പു നൽകി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരെ ശാസിച്ചു’ അല്ലെങ്കിൽ ‘അവരോടു കർശനമായി കല്പിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: കർശനമായി മുന്നറിയിപ്പു നൽകി
  rationale: ἐπιτιμάω എന്ന പദത്തിന് ‘ശാസിക്കുക’, ‘കർശനമായി ആജ്ഞാപിക്കുക’ എന്നീ അർഥങ്ങളുണ്ടാകാം. ഇവിടെ ശിഷ്യന്മാർ യേശുവിന്റെ തിരിച്ചറിവ് വെളിപ്പെടുത്തരുതെന്ന ശക്തമായ വിലക്കാണ് സന്ദർഭം; അതിനാൽ ആ ഗൗരവം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: αὐτοῖς
  choice: അവർക്ക്
  rationale: സമീപസന്ദർഭത്തിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്ന ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്ന ദത്തിവ് ബഹുവചന സർവനാമം.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: ആരോടും പറയരുതെന്ന്
  rationale: ആജ്ഞയെയോ മുന്നറിയിപ്പിനെയോ തുടർന്ന് വരുന്ന ἵνα സഹിതമുള്ള ഉപവാക്യം ഇവിടെ വിലക്കിന്റെ ഉള്ളടക്കം അറിയിക്കുന്നു. മലയാളത്തിൽ ‘ആരോടും പറയരുതെന്ന്’ എന്നത് അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: περὶ αὐτοῦ
  choice: തന്നെക്കുറിച്ച്
  rationale: περί + genitive എന്നതിന് ‘കുറിച്ച്’ എന്നാണ് ഇവിടെ അർഥം. മുഖ്യവാക്യത്തിലെ കർത്താവായ യേശുവിനെയാണ് αὐτοῦ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ പ്രതിഫലന സർവനാമമായ ‘തന്നെ’ ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വിലക്കിന്റെ ശക്തിയും മിശിഹാ-രഹസ്യവുമായി ബന്ധപ്പെട്ട വ്യാഖ്യാനവും
  choice: തിരിച്ചറിവ് വെളിപ്പെടുത്തരുതെന്ന ശക്തമായ മുന്നറിയിപ്പായി പരിഭാഷപ്പെടുത്തി; അതിന്റെ കാരണം സംബന്ധിച്ച ഒരു സിദ്ധാന്തവും വാക്യത്തിൽ ചേർത്തില്ല.
  alternative: ‘അവരെ ശാസിച്ചു’ അല്ലെങ്കിൽ ‘അവരോടു കർശനമായി കല്പിച്ചു’ എന്ന് പരിഭാഷപ്പെടുത്താം.
  rationale: വാക്യം ശക്തമായ ഒരു വിലക്ക് വ്യക്തമാക്കുന്നുവെങ്കിലും അതിന്റെ ദൈവശാസ്ത്രപരമായ കാരണം വിശദീകരിക്കുന്നില്ല. അതിനാൽ കല്പനയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് വ്യാഖ്യാനസിദ്ധാന്തം ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കർശനമായി’ എന്നത് വിലക്കിന്റെ ശക്തി നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ἐπετίμησεν എന്ന പദത്തിന്റെ യഥാർഥ അർഥപരിധി സംരക്ഷിക്കുന്നു.
