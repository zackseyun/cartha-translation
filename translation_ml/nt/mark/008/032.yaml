  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: ml
  text: അവൻ ഈ കാര്യം തുറന്നുപറഞ്ഞുകൊണ്ടിരുന്നു.[a] അപ്പോൾ പത്രോസ് അവനെ ഒരു വശത്തേക്കു കൂട്ടിക്കൊണ്ടുപോയി ശാസിക്കാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വ്യക്തമായി” അല്ലെങ്കിൽ “ധൈര്യത്തോടെ.” ഗ്രീക്ക് പദം മറച്ചുവെക്കാതെയുള്ള തുറന്ന, നിഷ്കപടമായ സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: തുറന്ന്
  rationale: മറച്ചുവെക്കാതെയും മടികൂടാതെയും വ്യക്തമായി സംസാരിക്കുന്നതിന്റെ ഭാവം നൽകുന്നു. സന്ദർഭത്തിൽ ധൈര്യത്തേക്കാൾ തുറന്നുപറച്ചിലിനും വ്യക്തതയ്ക്കുമാണ് ഊന്നൽ.
- source_word: τὸν λόγον
  choice: ഈ കാര്യം
  rationale: മുൻവാക്യത്തിൽ യേശു പറഞ്ഞ കഷ്ടാനുഭവം, നിരാകരണം, മരണം, ഉയിർത്തെഴുന്നേൽപ്പ് എന്നിവയുടെ ഉള്ളടക്കത്തിലേക്കാണ് ഇത് വിരൽചൂണ്ടുന്നത്. മലയാളത്തിൽ ‘ഈ കാര്യം’ സ്വാഭാവികമായി ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐλάλει
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: ഗ്രീക്കിലെ അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം സംരക്ഷിക്കുന്നു.
- source_word: προσλαβόμενος
  choice: മാറ്റിനിർത്തി
  rationale: പത്രോസ് യേശുവിനെ സ്വകാര്യമായി ഒരു വശത്തേക്ക് കൊണ്ടുപോയെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: അവനെ ശാസിക്കാൻ തുടങ്ങി
  rationale: ἄρχομαι കൂടിയ അനന്തക്രിയയുടെ ആരംഭഭാവവും ἐπιτιμάω എന്നതിന്റെ ശക്തമായ തിരുത്തൽ/ശാസനാഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പീഡാനുഭവപ്രവചനത്തോടനുബന്ധിച്ച παρρησίᾳ എന്ന പദത്തിന്റെ ശക്തി
  choice: തുറന്ന്
  alternative: വ്യക്തമായി; ധൈര്യത്തോടെ
  rationale: യേശു കാര്യം മറച്ചുവെക്കാതെ വ്യക്തമായി പറഞ്ഞുവെന്നതാണ് ഇവിടെ മുഖ്യമായ ഊന്നൽ. ‘ധൈര്യത്തോടെ’ എന്നത് സാധ്യമായെങ്കിലും ധൈര്യത്തിന്റെ ആശയം അനാവശ്യമായി മുൻനിരയിലെത്തിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘ഈ കാര്യം’ മുൻസന്ദർഭവുമായി സ്വാഭാവിക ബന്ധം സ്ഥാപിക്കുന്നു; അടിക്കുറിപ്പ് ഗ്രീക്ക് പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
