id: MRK.8.33
reference: Mark 8:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ തിരിഞ്ഞ് തന്റെ ശിഷ്യന്മാരെ നോക്കിയിട്ട് പത്രോസിനെ ശാസിച്ചു പറഞ്ഞു: “എന്റെ പിന്നാലെ പോ, സാത്താനേ! കാരണം, നീ ദൈവത്തിന്റെ കാര്യങ്ങളിലല്ല, മനുഷ്യരുടെ കാര്യങ്ങളിലാണ് മനസ്സുവെക്കുന്നത്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “മനുഷ്യർ” എന്നത് പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: ഗ്രീക്ക് ἀνθρώπων എന്ന പദത്തിന്റെ പൊതുവായ മാനവസൂചന വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: തിരിഞ്ഞ്
  rationale: സന്ദർഭത്തിലെ ശാരീരികമായ ദിശാമാറ്റം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ἰδὼν
  choice: നോക്കിയിട്ട്
  rationale: തിരിയലിനു പിന്നാലെ യേശു ശിഷ്യന്മാരെ ദൃഷ്ടിയിൽപ്പെടുത്തുന്ന ക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μαθητὰς
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ μαθητής എന്ന പദത്തിന്റെ സ്ഥിരവും സാങ്കേതികവുമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἐπετίμησεν
  choice: ശാസിച്ചു
  rationale: കടുത്ത വാക്കാലുള്ള ശാസന എന്ന ക്രിയയുടെ ശക്തി സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ λέγει
  choice: പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനമായ λέγειയെ മലയാള ആഖ്യാനത്തിലെ സ്വാഭാവിക ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ὕπαγε ὀπίσω μου
  choice: എന്റെ പിന്നിൽ പോകൂ
  rationale: പത്രോസ് മുന്നിൽ തടസ്സമായി നിൽക്കാതെ യേശുവിന്റെ പിന്നിലെ അനുയായിയുടെ സ്ഥാനത്തേക്കു മടങ്ങണമെന്ന കല്പനയുടെ രൂപവും ശക്തിയും നിലനിർത്തുന്നു.
- source_word: Σατανᾶ
  choice: സാത്താനേ
  rationale: വിളിവിഭക്തിയിലുള്ള പരമ്പരാഗത നാമരൂപം നിലനിർത്തുകയും അഭിസംബോധനയുടെ മൂർച്ച സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: φρονεῖς
  choice: മനസ്സുവെക്കുന്നത്
  rationale: വെറും ചിന്തയേക്കാൾ മനോഭാവം, അഭിമുഖത, താത്പര്യം എന്നിവ ഉൾക്കൊള്ളുന്ന φρονέωയുടെ വ്യാപ്തി നൽകുന്നു.
- source_word: τὰ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കാര്യങ്ങൾ
  rationale: വാക്യത്തിന്റെ വിശാലതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും അമിതമായി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: τὰ τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ കാര്യങ്ങൾ
  rationale: ദൈവത്തിന്റെ കാര്യങ്ങളോടു വിപരീതമായി മനുഷ്യർക്കു പൊതുവായ കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ലിംഗഭേദമില്ലാതെ ഉറവിടത്തിന്റെ പൊതുവായ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: “സാത്താൻ” എന്ന അഭിസംബോധനയുടെ സൂചിതൻ
  choice: യേശു പത്രോസിനെ നേരിട്ട് “സാത്താനേ” എന്നു ശാസിക്കുന്ന വാക്യരൂപം അതേപടി നിലനിർത്തി.
  alternative: പത്രോസിന്റെ പിന്നിലുള്ള സാത്താനോടാണ് യേശു സംസാരിക്കുന്നത്; അല്ലെങ്കിൽ “സാത്താൻ” എന്നത് വ്യക്തിത്വമില്ലാത്ത “എതിരാളി” എന്ന അർഥം മാത്രമാണ്.
  rationale: ἐπετίμησεν Πέτρῳ എന്നത് ശാസനയുടെ നേരിട്ടുള്ള ലക്ഷ്യമായി പത്രോസിനെ കാണിക്കുന്നു. എന്നാൽ പത്രോസ് അക്ഷരാർഥത്തിൽ സാത്താനാണെന്നോ മറ്റൊരു അദൃശ്യസാന്നിധ്യത്തോടാണ് യേശു സംസാരിക്കുന്നതെന്നോ പരിഭാഷ തീരുമാനിക്കുന്നില്ല.
- issue: τὰ τοῦ θεοῦ / τὰ τῶν ἀνθρώπων എന്ന വൈരുധ്യം
  choice: “ദൈവത്തിന്റെ കാര്യങ്ങൾ ... മനുഷ്യരുടെ കാര്യങ്ങൾ” എന്ന വിശാലമായ രൂപം നിലനിർത്തി.
  alternative: “ദൈവത്തിന്റെ താത്പര്യങ്ങൾ ... മനുഷ്യരുടെ താത്പര്യങ്ങൾ” എന്ന വ്യാഖ്യാനാത്മക രൂപം.
  rationale: ഉറവിടത്തിലെ നപുംസക ബഹുവചനപ്രയോഗം വിശാലവും ഉദ്ദേശപൂർവം തുറന്നതുമാണ്; “താത്പര്യങ്ങൾ” എന്നു ചുരുക്കുന്നത് അർഥപരിധി അനാവശ്യമായി പരിമിതപ്പെടുത്താം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. “സാത്താനേ” എന്ന കടുത്ത അഭിസംബോധനയും “ദൈവത്തിന്റെ കാര്യങ്ങൾ / മനുഷ്യരുടെ കാര്യങ്ങൾ” എന്ന ഉദ്ദേശപൂർവമായ വിശാലതയും മൃദൂകരിക്കാതെ നിലനിർത്തി.
