id: MRK.8.23
reference: Mark 8:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: ml
  text: അവൻ അന്ധന്റെ കൈയിൽ പിടിച്ച് അവനെ ഗ്രാമത്തിനു പുറത്തേക്കു കൊണ്ടുപോയി; അവന്റെ കണ്ണുകളിൽ തുപ്പി, അവന്റെമേൽ കൈകൾ വെച്ചശേഷം, “നിനക്കു എന്തെങ്കിലും കാണുന്നുണ്ടോ?” എന്ന് ചോദിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς
  choice: കൈപിടിച്ച്
  rationale: ജനിറ്റീവിനോടുകൂടിയ ἐπιλαμβάνομαι ഇവിടെ ഒരാളുടെ കൈയിൽ പിടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കൈപിടിച്ച്’ എന്നത് പ്രവർത്തിയുടെ മൂർത്തത നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: τοῦ τυφλοῦ
  choice: അന്ധന്റെ
  rationale: τυφλός ഇവിടെ നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു; പുരുഷനായ അന്ധനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐξήνεγκεν ... ἔξω τῆς κώμης
  choice: ഗ്രാമത്തിനു പുറത്തേക്കു കൂട്ടിക്കൊണ്ടുപോയി
  rationale: ἐκφέρω എന്നതിന്റെ പുറത്തേക്കുള്ള ചലനവും, കൈപിടിച്ചു നയിക്കുന്ന സന്ദർഭവും ഈ പ്രയോഗം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; κώμη ചെറുകുടിയേറ്റമായ ‘ഗ്രാമം’ എന്നാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: അവന്റെ കണ്ണുകളിൽ തുപ്പുകയും
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചന മായ്ച്ചുകളയാതെ ‘കണ്ണുകളിൽ’ എന്നു നൽകി, അസൽ വിവരണത്തിലെ ശക്തമായ ശാരീരിക പ്രവർത്തി നിലനിർത്തുന്നു. തുടർന്നുള്ള സമാന്തര പങ്കാളിത്തക്രിയയോട് ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം ഉപയോഗിച്ചു.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: അവന്റെമേൽ കൈകൾ വെക്കുകയും
  rationale: വാചകം പറയുന്ന ശാരീരിക സ്പർശം നേരിട്ട് നിലനിർത്തുന്നു; ഔപചാരികമായ ആചാരമോ സഭാപരമായ അർഥമോ ചേർക്കുന്നില്ല.
- source_word: ἐπηρώτα
  choice: ചോദിച്ചു
  rationale: ഇംപർഫെക്റ്റ് രൂപം ചോദിക്കുന്ന പ്രവർത്തിയെ അവതരിപ്പിക്കുന്നു; ഈ ഏക നേരിട്ടുള്ള ചോദ്യത്തിന്റെ കഥനസന്ദർഭത്തിൽ ‘ചോദിച്ചു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: Εἴ τι βλέπεις;
  choice: നിനക്ക് എന്തെങ്കിലും കാണുന്നുണ്ടോ?
  rationale: τι എന്ന അനിശ്ചിതത്വം ‘എന്തെങ്കിലും’ എന്നതിലൂടെ നിലനിർത്തുന്നു; βλέπεις എന്ന വർത്തമാനക്രിയയെ സ്വാഭാവിക മലയാള ചോദ്യമായി നൽകുന്നു.
theological_decisions:
- issue: സൗഖ്യമാക്കുന്ന പ്രവൃത്തികളുടെ ശാരീരികത
  choice: കണ്ണുകളിൽ തുപ്പുന്നതും കൈകൾ വെക്കുന്നതും ഉൾപ്പെടുന്ന മൂർത്തമായ ക്രമം അതേപടി നിലനിർത്തി.
  alternative: ശാരീരിക വിശദാംശങ്ങൾ മയപ്പെടുത്തുന്ന പരാവർത്തനം ഉപയോഗിക്കുക.
  rationale: അസൽ വാക്യം സൗഖ്യപ്രവൃത്തിയുടെ സ്പർശനീയവും അമ്പരപ്പിക്കുന്നതുമായ വിശദാംശങ്ങൾ മനപ്പൂർവം വിവരിക്കുന്നു; വിവർത്തനം അവയെ ശുചീകരിക്കരുത്.
- issue: കൈകൾ വെക്കുന്നതിന്റെ സാധ്യതയുള്ള ആചാരാർഥം
  choice: ‘അവന്റെമേൽ കൈകൾ വെക്കുകയും’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഔപചാരികമായ മതാചാരമോ സ്ഥാനാരോഹണമോ ആയി വ്യാഖ്യാനിക്കുക.
  rationale: ഈ സന്ദർഭത്തിൽ ഇത് യേശുവിന്റെ സൗഖ്യസ്പർശത്തിന്റെ വിവരണമാണ്; പിൽക്കാല സഭാപരമായ അർഥങ്ങൾ വാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ പ്രവർത്തനക്രമവും മൂർത്തമായ ശാരീരിക വിശദാംശങ്ങളും നിലനിർത്തി. അനാവശ്യ സാങ്കേതികമോ സഭാപരമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
