revisions:
- from: അവൻ അന്ധന്റെ കൈപിടിച്ച് ഗ്രാമത്തിനു പുറത്തേക്കു കൂട്ടിക്കൊണ്ടുപോയി. പിന്നെ അവന്റെ കണ്ണുകളിൽ തുപ്പുകയും അവന്റെമേൽ കൈകൾ വെക്കുകയും ചെയ്തിട്ട്, “നിനക്ക് എന്തെങ്കിലും കാണുന്നുണ്ടോ?” എന്നു ചോദിച്ചു.
  to: അവൻ അന്ധന്റെ കൈയിൽ പിടിച്ച് അവനെ ഗ്രാമത്തിനു പുറത്തേക്കു കൊണ്ടുപോയി; അവന്റെ കണ്ണുകളിൽ തുപ്പി, അവന്റെമേൽ കൈകൾ വെച്ചശേഷം, “നിനക്കു എന്തെങ്കിലും കാണുന്നുണ്ടോ?” എന്ന് ചോദിച്ചു.
