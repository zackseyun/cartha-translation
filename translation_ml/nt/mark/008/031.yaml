id: MRK.8.31
reference: Mark 8:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: ml
  text: മനുഷ്യപുത്രൻ അനേകം കഷ്ടങ്ങൾ സഹിക്കുകയും, മൂപ്പന്മാരാലും മുഖ്യപുരോഹിതന്മാരാലും ശാസ്ത്രിമാരാലും നിരസിക്കപ്പെടുകയും, കൊല്ലപ്പെടുകയും, മൂന്ന് ദിവസത്തിനുശേഷം ഉയിർത്തെഴുന്നേൽക്കുകയും വേണമെന്ന് അവൻ അവരെ പഠിപ്പിച്ചുതുടങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “മൂന്ന് ദിവസത്തിനുശേഷം.” ചില വിവർത്തനങ്ങൾ ഇതിനെ “മൂന്നാം ദിവസം” എന്നു നൽകുന്നു; എന്നാൽ മർക്കോസിന്റെ ഗ്രീക്ക് വാചകം “മൂന്ന് ദിവസത്തിനുശേഷം” എന്നാണ്.
    reason: മൂലത്തിലെ കാലപ്രയോഗം സമാന്തരഭാഗങ്ങളോട് ഒത്താക്കാതെ സംരക്ഷിക്കുന്നതിനുള്ള വിശദീകരണം.
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: പഠിപ്പിച്ചുതുടങ്ങി
  rationale: ആരംഭഭാവം സ്വാഭാവികമായ മലയാള ക്രിയാരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: δεῖ
  choice: വേണം / സഹിക്കേണ്ടതുണ്ട്
  rationale: ദൈവിക ആവശ്യകതയുടെ ശക്തി നിലനിർത്തുമ്പോഴും അതിന്റെ കാരണം വിവർത്തനത്തിൽ അധികമായി വിശദീകരിക്കുന്നില്ല.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിലെ സ്ഥിരമായ സ്ഥാനപ്പേരും ദാനിയേൽ ഗ്രന്ഥവുമായുള്ള അന്തർപാഠബന്ധവും നിലനിർത്തുന്നു.
- source_word: πολλὰ παθεῖν
  choice: അനേകം കഷ്ടങ്ങൾ സഹിക്കുക
  rationale: πολλά എന്ന ബഹുവചനത്തിന്റെ വ്യാപ്തിയും πάσχω എന്ന ക്രിയയുടെ കഷ്ടാനുഭവഭാവവും വ്യക്തമായി നൽകുന്നു.
- source_word: ἀποδοκιμασθῆναι
  choice: തള്ളിക്കളയപ്പെടുക
  rationale: അധികാരികൾ പരിശോധിച്ച് അംഗീകരിക്കാതെ നിരസിക്കുന്ന ഔദ്യോഗികഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: മൂപ്പന്മാരാൽ
  rationale: പ്രായമായ പുരുഷന്മാരെ പൊതുവായി അല്ല, യെഹൂദ നേതൃത്വവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ചരിത്രപരമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τῶν ἀρχιερέων
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ബഹുവചനത്തിൽ പ്രധാന പുരോഹിതവർഗത്തെ സൂചിപ്പിക്കുന്നു; ഒന്നിലധികം മഹാപുരോഹിതന്മാർ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τῶν γραμματέων
  choice: ശാസ്ത്രിമാർ
  rationale: നിയമപണ്ഡിതരായിരുന്ന ചരിത്രവിഭാഗത്തിനുള്ള സ്ഥാപിതമായ മലയാള പദം ഉപയോഗിക്കുന്നു.
- source_word: ἀποκτανθῆναι
  choice: കൊല്ലപ്പെടുക
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം നേരിട്ടും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: മൂന്ന് ദിവസത്തിനുശേഷം
  rationale: μετά + accusative എന്നതിന്റെ സാധാരണ അർഥം കൃത്യമായി നിലനിർത്തി സമാന്തരവാക്യങ്ങളോട് ഒത്താക്കുന്നില്ല.
- source_word: ἀναστῆναι
  choice: ഉയിർത്തെഴുന്നേൽക്കുക
  rationale: ഗ്രീക്കിലെ അകർമക രൂപം നിലനിർത്തുകയും പുനരുത്ഥാനസന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: δεῖ സൂചിപ്പിക്കുന്ന പീഡാനുഭവത്തിന്റെ ആവശ്യകത
  choice: വേണം / സഹിക്കേണ്ടതുണ്ട്
  alternative: അത്യാവശ്യമാണ്
  rationale: സംഭവങ്ങൾ അനിവാര്യമാണെന്ന ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു; എന്നാൽ ആ അനിവാര്യതയുടെ സംവിധാനം വാക്യത്തിൽ ഇല്ലാത്ത വിധം വിശദീകരിക്കുന്നില്ല.
- issue: μετὰ τρεῖς ἡμέρας എന്ന കാലപ്രയോഗം
  choice: മൂന്ന് ദിവസത്തിനുശേഷം
  alternative: മൂന്നാം ദിവസം
  rationale: മർക്കോസിന്റെ ഗ്രീക്ക് വാചകം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; മറ്റു സുവിശേഷങ്ങളിലെ പ്രയോഗത്തോട് നിശ്ശബ്ദമായി സമന്വയിപ്പിക്കുന്നില്ല.
- issue: ἀναστῆναι എന്ന ക്രിയയുടെ വാച്യഭേദം
  choice: ഉയിർത്തെഴുന്നേൽക്കുക
  alternative: ഉയിർപ്പിക്കപ്പെടുക
  rationale: മൂലത്തിലെ അകർമക infinitive നിലനിർത്തുന്നു; കർമണി രൂപത്തിലേക്ക് മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ചരിത്രപരമായ നേതൃത്വപദങ്ങൾക്കായി ‘മൂപ്പന്മാർ’, ‘മുഖ്യപുരോഹിതന്മാർ’, ‘ശാസ്ത്രിമാർ’ എന്നിവ നിലനിർത്തി. ഗ്രീക്കിലെ ദീർഘമായ പരമ്പര മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ ഏകവാക്യമായി സൂക്ഷിച്ചു.
