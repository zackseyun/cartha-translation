id: MRK.8.20
reference: Mark 8:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: ml
  text: നാലായിരം പേർക്കായി ആ ഏഴ് അപ്പങ്ങൾ ഉപയോഗിച്ചപ്പോൾ, അപ്പക്കഷണങ്ങൾ നിറഞ്ഞ എത്ര വലിയ കൊട്ടകൾ നിങ്ങൾ എടുത്തു ശേഖരിച്ചു?” അവർ അവനോടു, “ഏഴ്” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε καὶ
  choice: നുറുക്കിയപ്പോഴോ
  rationale: മുൻവാക്യത്തിലെ ആദ്യ അപ്പം നുറുക്കൽ സംഭവത്തോട് രണ്ടാമത്തേതിനെ ബന്ധിപ്പിക്കുന്ന καὶ-യുടെ താരതമ്യബന്ധവും ὅτε-യുടെ കാലാർഥവും മലയാളത്തിലെ ‘-പ്പോഴോ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τοὺς ἑπτὰ
  choice: ആ ഏഴ് അപ്പം
  rationale: ഗ്രീക്കിൽ ‘ഏഴ്’ മാത്രമാണെങ്കിലും സന്ദർഭം ഏഴ് അപ്പങ്ങളിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി സൂചിത നാമം ചേർത്തു. സംഖ്യയ്ക്കുശേഷം മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചനരൂപം ഉപയോഗിച്ചു.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: നാലായിരം പേർക്കായി
  rationale: εἰς ഇവിടെ ആഹാരം ലഭിച്ച സമൂഹത്തോടുള്ള ബന്ധമോ പ്രയോജനമോ സൂചിപ്പിക്കുന്നു; ‘പേർക്കായി’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πόσων σπυρίδων
  choice: എത്ര വലിയ കുട്ടകളാണ്
  rationale: σπυρίς വലിയ കുട്ടയെ സൂചിപ്പിക്കുകയും 8:19-ലെ κόφινος എന്ന ചെറിയ കുട്ടയ്ക്കുള്ള പദത്തിൽനിന്ന് വ്യത്യസ്തമാകുകയും ചെയ്യുന്നു; അതിനാൽ ‘വലിയ കുട്ട’ എന്ന് വ്യക്തമാക്കി.
- source_word: πληρώματα κλασμάτων
  choice: ശേഷിച്ച അപ്പക്കഷണങ്ങൾ നിറഞ്ഞ
  rationale: πληρώματα നിറഞ്ഞ അളവിനെയും κλάσματα നുറുക്കിയ അപ്പത്തിന്റെ കഷണങ്ങളെയും സൂചിപ്പിക്കുന്നു. ഭക്ഷണശേഷിപ്പുകൾ ശേഖരിക്കുന്ന സന്ദർഭം വ്യക്തമാക്കാൻ ‘ശേഷിച്ച’ എന്നും സൂചിതമായ ‘അപ്പം’ എന്നും ചേർത്തു.
- source_word: ἤρατε
  choice: നിങ്ങൾ എടുത്തത്
  rationale: αἴρω ഇവിടെ ശേഷിപ്പുകൾ എടുത്തു ശേഖരിക്കുന്ന പ്രവൃത്തിയാണ്; ‘എടുത്തത്’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: അവർ അവനോട് … എന്നു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ആഖ്യാനരൂപം മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല ആഖ്യാനമായി നൽകി.
- source_word: Ἑπτά
  choice: ഏഴ്
  rationale: ചോദ്യത്തിനുള്ള നേരിട്ടുള്ള സംഖ്യാത്മക മറുപടി അതേപടി നിലനിർത്തി.
