translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മുൻവാക്യത്തോടുള്ള താരതമ്യബന്ധം ‘-പ്പോഴോ’ വഴി സൂക്ഷിച്ചു; വലിയ കുട്ടയ്ക്കുള്ള പ്രത്യേക ഗ്രീക്ക് പദത്തിന്റെ വ്യത്യാസം മുഖ്യവാചകത്തിൽ തന്നെയാക്കി, അതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
