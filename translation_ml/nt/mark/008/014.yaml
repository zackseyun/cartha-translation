source:
  edition: SBLGNT
  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: ml
  text: അവർ അപ്പം കൊണ്ടുപോകാൻ മറന്നുപോയിരുന്നു[a]; ഒരു അപ്പം ഒഴികെ, വള്ളത്തിൽ അവരുടെ പക്കൽ അപ്പമൊന്നും ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “അപ്പങ്ങൾ കൊണ്ടുപോകാൻ.” ἄρτους എന്ന ബഹുവചനം ഓരോ അപ്പത്തെയും സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ പൊതുവായി അപ്പം അഥവാ യാത്രയ്ക്കുള്ള ഭക്ഷണസാധനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: മറന്നുപോയിരുന്നു
  rationale: ആഖ്യാനത്തിലെ ഇപ്പോഴത്തെ കുറവിന് മുമ്പുണ്ടായ മറവിയെ സൂചിപ്പിക്കാൻ ഭൂതകാലപൂർണരൂപം സ്വാഭാവികമാണ്.
- source_word: λαβεῖν
  choice: എടുക്കാൻ
  rationale: യാത്രയ്ക്കായി കൂടെ കൊണ്ടുപോകുക എന്ന സന്ദർഭാർഥം ഉൾക്കൊള്ളുന്ന ലളിതവും നേരിട്ടുള്ളതുമായ പ്രയോഗം.
- source_word: ἄρτους
  choice: അപ്പം
  rationale: ബഹുവചനരൂപം ഇവിടെ പൊതുവായി ഭക്ഷണസാധനമായ അപ്പത്തെ സൂചിപ്പിക്കാം; മലയാളത്തിൽ ദ്രവ്യനാമസദൃശമായ ഏകവചനപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: ഒരു അപ്പം മാത്രമല്ലാതെ
  rationale: εἰ μή ഇവിടെ നിബന്ധനയല്ല, ഒഴിവാക്കൽ സൂചിപ്പിക്കുന്നു; ἕνα ἄρτον എന്ന എണ്ണാവുന്ന ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: οὐκ εἶχον
  choice: വേറെ അപ്പം ഉണ്ടായിരുന്നില്ല
  rationale: ഒരൊറ്റ അപ്പം ഒഴികെ മറ്റൊന്നും ഇല്ലായിരുന്നുവെന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
- source_word: μεθ’ ἑαυτῶν
  choice: അവരുടെ പക്കൽ
  rationale: കൂടെ കൈവശം ഉണ്ടായിരിക്കുക എന്ന ആശയത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: ἐν τῷ πλοίῳ
  choice: വള്ളത്തിൽ
  rationale: ഗലീലക്കടലിലെ ചെറുജലവാഹനത്തെ സൂചിപ്പിക്കുന്ന πλοῖον എന്ന പദത്തിന് സന്ദർഭോചിതമായ സാധാരണ മലയാളം.
