- from: അവർ അപ്പം എടുക്കാൻ മറന്നുപോയിരുന്നു[a]. ഒരു അപ്പം മാത്രമല്ലാതെ വള്ളത്തിൽ അവരുടെ പക്കൽ വേറെ അപ്പം ഉണ്ടായിരുന്നില്ല.
  to: അവർ അപ്പം കൊണ്ടുപോകാൻ മറന്നുപോയിരുന്നു[a]; ഒരു അപ്പം ഒഴികെ, വള്ളത്തിൽ അവരുടെ പക്കൽ അപ്പമൊന്നും ഉണ്ടായിരുന്നില്ല.
  rationale: The revision preserves the source’s twofold wording—general bread/provisions first and one specific loaf second—while using idiomatic Malayalam for the exceptive clause and for taking provisions on a journey. The footnote is conformed to the revised wording and continues to explain the plural Greek noun.
