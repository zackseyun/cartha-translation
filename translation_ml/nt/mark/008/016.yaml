translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ തുടരുന്ന ചർച്ചാഭാവവും ὅτι അവതരിപ്പിക്കുന്ന ഉള്ളടക്കബന്ധവും നിലനിർത്തിയിരിക്കുന്നു.
