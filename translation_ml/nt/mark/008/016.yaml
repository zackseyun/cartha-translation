  yaml_path: translation/nt/mark/008/016.yaml
  text: And they were discussing with one another that they had no bread[a].
translation:
  language: ml
  text: തങ്ങൾക്ക് അപ്പം ഇല്ലെന്നു അവർ തമ്മിൽ ചർച്ച ചെയ്തുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘തങ്ങൾക്ക് അപ്പങ്ങൾ ഇല്ലെന്ന്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζοντο
  choice: ചർച്ച ചെയ്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം തുടരുന്ന പരസ്പര ആലോചനയെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആ ദൈർഘ്യഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς ἀλλήλους
  choice: പരസ്പരം
  rationale: ശിഷ്യന്മാർ തമ്മിലുള്ള പ്രത്യുത്തരപരമായ ആശയവിനിമയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: എന്ന കാര്യം
  rationale: ഇവിടെ ὅτι കാരണം സൂചിപ്പിക്കുന്നതല്ല, ചർച്ചയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതാണ്; ‘എന്ന കാര്യം’ ആ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἄρτους
  choice: അപ്പം
  rationale: ഗ്രീക്കിൽ ബഹുവചനമായ ‘അപ്പങ്ങൾ/അപ്പക്കഷണങ്ങൾ’ എന്ന ആശയം ഉണ്ടെങ്കിലും, ഈ സാഹചര്യത്തിൽ മലയാളത്തിൽ പൊതുവായി ‘അപ്പം’ എന്നു പറയുന്നതാണ് കൂടുതൽ സ്വാഭാവികം; എണ്ണപ്പെട്ട അപ്പങ്ങളെക്കുറിച്ചുള്ള സമീപസന്ദർഭം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὐκ ἔχουσιν
  choice: ഇല്ലെന്ന
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലരൂപം പരോക്ഷവാക്യത്തിനുള്ളിലാണ്; മലയാളത്തിലെ ഭൂതകാല ആഖ്യാനത്തിൽ ‘ഇല്ലെന്ന’ സ്വാഭാവികമായി അന്നത്തെ അവസ്ഥ പ്രകടിപ്പിക്കുന്നു, അനാവശ്യമായ കാലമാറ്റം നിർബന്ധിക്കുന്നില്ല.
