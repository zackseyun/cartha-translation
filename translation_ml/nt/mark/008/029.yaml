id: MRK.8.29
reference: Mark 8:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: ml
  text: 'അവൻ അവരോടു ചോദിച്ചു: “എന്നാൽ ഞാൻ ആരാണെന്നാണ് നിങ്ങൾ പറയുന്നത്?” പത്രോസ് അവനോടു മറുപടി പറഞ്ഞു: “അങ്ങാണ് മശീഹാ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.”
    reason: Χριστός എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേരിന്റെ പരമ്പരാഗത ലിപ്യന്തരണരൂപം നൽകുന്നു.
lexical_decisions:
- source_word: ἐπηρώτα
  choice: ചോദിച്ചു
  rationale: ഗ്രീക്കിലെ അപൂർണഭൂതകാലം പുരോഗമിക്കുന്നതോ ആവർത്തിക്കുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ ഒരൊറ്റ നേരിട്ടുള്ള ചോദ്യം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനരൂപമായ ‘ചോദിച്ചു’ ഉപയോഗിച്ചു; ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ ഈ സന്ദർഭത്തിൽ അനാവശ്യമായി ദീർഘമായ ചോദ്യംചെയ്യൽ സൂചിപ്പിച്ചേക്കാം.
- source_word: Ὑμεῖς δὲ
  choice: എന്നാൽ നിങ്ങൾ
  rationale: δέ മുൻപ് പറഞ്ഞ മറ്റുള്ളവരുടെ അഭിപ്രായത്തോടുള്ള വ്യത്യാസവും Ὑμεῖς ശിഷ്യന്മാർക്കുള്ള ഊന്നലും നൽകുന്നു; ‘എന്നാൽ നിങ്ങൾ’ രണ്ടും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τίνα με λέγετε εἶναι
  choice: ഞാൻ ആരാണെന്നാണ് പറയുന്നത്
  rationale: ഗ്രീക്കിലെ accusative-plus-infinitive ഘടനയുടെ അർത്ഥം സ്വാഭാവികമായ മലയാള പരോക്ഷവാക്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀποκριθεὶς ... λέγει αὐτῷ
  choice: അവനോടു മറുപടി പറഞ്ഞു
  rationale: കൃന്തക്രിയയും മർക്കോസിന്റെ ചരിത്രവർത്തമാനവും മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഒറ്റ ഭൂതകാല ക്രിയാപ്രയോഗമായി നൽകി.
- source_word: Σὺ εἶ
  choice: അങ്ങാണ്
  rationale: വ്യക്തമായ സർവനാമത്തിന്റെ ഊന്നൽ ‘-ആണ്’ ഘടനയിൽ നിലനിർത്തുന്നു; യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ മാന്യവും സ്വാഭാവികവുമായ ‘അങ്ങ്’ ഉപയോഗിക്കുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: χριστός ഇവിടെ വ്യക്തിനാമമല്ല, അഭിഷിക്തനായ പ്രതീക്ഷിത രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ്; അതിന്റെ യഹൂദ മശീഹാ പശ്ചാത്തലം നിലനിർത്താൻ ‘മശീഹാ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ സമ്മതവാക്യത്തിൽ Χριστός ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. ‘മശീഹാ’ അതിന്റെ യഹൂദ-തിരുവെഴുത്തുപരമായ അർത്ഥം വ്യക്തമാക്കുന്നു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. സംഭാഷണത്തിലെ വ്യത്യാസവും പത്രോസിന്റെ സമ്മതവാക്യത്തിലെ ഊന്നലും നിലനിർത്തിയിട്ടുണ്ട്.
