  text: ⸂καὶ ἔφαγον⸃ καὶ ἐχορτάσθησαν, καὶ ἦραν περισσεύματα κλασμάτων ἑπτὰ σπυρίδας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: ml
  text: അവർ ഭക്ഷിച്ചു തൃപ്തരായി; ശേഷിച്ച കഷണങ്ങൾ ഏഴു കൊട്ട നിറയെ അവർ എടുത്തുകൂട്ടി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘കൊട്ട’ എന്നു പരിഭാഷപ്പെടുത്തിയ σπυρίδες എന്ന ഗ്രീക്ക് പദം കൊട്ടകളെ സൂചിപ്പിക്കുന്നു; വലിയ വഹനക്കൊട്ടകളെയും ഇതു സൂചിപ്പിക്കാം. അയ്യായിരം പേരെ ഭക്ഷിപ്പിച്ച വിവരണത്തിൽ മർക്കോസ് മറ്റൊരു പദമാണ് ഉപയോഗിക്കുന്നത് (κόφινοι, 6:43).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: ഭക്ഷിച്ചു
  rationale: ἐσθίω എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനഭൂതകാല അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐχορτάσθησαν
  choice: തൃപ്തരായി
  rationale: ആവശ്യത്തിന് ഭക്ഷിച്ച് നിറഞ്ഞു എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു; വെറും ശാരീരിക നിറവ് എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἦραν
  choice: ശേഖരിച്ചു
  rationale: ശേഷിച്ച കഷണങ്ങൾ എടുത്തുകൂട്ടുന്ന സന്ദർഭത്തിൽ αἴρωയുടെ ഉദ്ദേശ്യാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: περισσεύματα κλασμάτων
  choice: ശേഷിച്ച കഷണങ്ങൾ
  rationale: ഭക്ഷണത്തിനുശേഷം അധികമായി ബാക്കിയായ പൊട്ടിയ ഭാഗങ്ങൾ എന്ന സംയുക്ത ആശയം ലളിതമായി പകർന്നു നൽകുന്നു.
- source_word: ἑπτὰ σπυρίδας
  choice: ഏഴു വലിയ കുട്ടകൾ നിറയെ
  rationale: σπυρίς സാധാരണ ചെറിയ കൊട്ടയേക്കാൾ വലിയ കുട്ടയെയോ വട്ടിയെയോ സൂചിപ്പിക്കാം. ക്രിയയുടെ നേരിട്ടുള്ള കർമമായ ‘ഏഴു കുട്ടകൾ’ എന്ന ഘടനയും അവയിൽ കഷണങ്ങൾ നിറഞ്ഞിരുന്നുവെന്ന സ്വാഭാവിക മലയാളപ്രയോഗവും ഇവിടെ സംയോജിപ്പിക്കുന്നു; വലിപ്പസൂചന അടിക്കുറിപ്പിലും വിശദീകരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കുട്ട’ എന്ന പദം σπυρίς സൂചിപ്പിക്കുന്ന വലിയ വഹനപാത്രത്തെ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; പദവ്യത്യാസം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
