revisions:
- from: അവർ ഭക്ഷിച്ചു തൃപ്തരായി; ശേഷിച്ച കഷണങ്ങൾ ഏഴു വലിയ കുട്ടകൾ നിറയെ അവർ ശേഖരിച്ചു.[a]
  to: അവർ ഭക്ഷിച്ചു തൃപ്തരായി; ശേഷിച്ച കഷണങ്ങൾ ഏഴു കൊട്ട നിറയെ അവർ എടുത്തുകൂട്ടി.[a]
  rationale: The revision avoids making basket size explicit in the main text, preserves the seven-basket measure with the natural expression ‘ഏഴു കൊട്ട നിറയെ,’ and renders ἦραν more closely and idiomatically as ‘എടുത്തുകൂട്ടി.’ The footnote retains the lexical qualification and Mark’s distinction from κόφινοι.
