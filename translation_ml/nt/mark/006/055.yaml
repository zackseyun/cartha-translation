source:
  edition: SBLGNT
  text: ⸂περιέδραμον ὅλην τὴν χώραν ἐκείνην καὶ⸃ ἤρξαντο ἐπὶ τοῖς κραβάττοις τοὺς κακῶς ἔχοντας περιφέρειν ὅπου ἤκουον ⸀ὅτι ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: ml
  text: അവർ ആ പ്രദേശമൊട്ടാകെ ഓടിനടന്നു; അവൻ എവിടെയുണ്ടെന്ന് കേട്ടോ അവിടേക്കെല്ലാം രോഗികളെ പായകളിൽ ചുമന്നുകൊണ്ടുപോകാൻ തുടങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കട്ടിലുകളിൽ’ അല്ലെങ്കിൽ ‘കിടക്കകളിൽ’; എടുത്തുകൊണ്ടുപോകാവുന്ന ലളിതമായ കിടക്കകളെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: ഓടിനടന്ന്
  rationale: പ്രദേശമാകെ വേഗത്തിലും വ്യാപകമായും സഞ്ചരിച്ചെന്ന സംയുക്തക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: ആ പ്രദേശമൊട്ടാകെ
  rationale: χώρα ഇവിടെ ഒരു ആധുനിക രാഷ്ട്രമല്ല, ചുറ്റുമുള്ള പ്രദേശമാണ്; ὅλην എന്ന സമഗ്രതയും ἐκείνην എന്ന സൂചനയും നിലനിർത്തുന്നു.
- source_word: ἤρξαντο ... περιφέρειν
  choice: ചുമന്നുകൊണ്ടുവരാൻ തുടങ്ങി
  rationale: ἤρξαντο പ്രവർത്തനത്തിന്റെ ആരംഭം വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ രോഗികളെ യേശു ഉണ്ടായിരുന്ന സ്ഥലങ്ങളിലേക്കു കൊണ്ടുവന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: കിടക്കകളിൽ
  rationale: κράβαττος ലളിതവും എടുത്തുകൊണ്ടുപോകാവുന്നതുമായ കിടക്ക, പായ, അല്ലെങ്കിൽ കട്ടിൽ സൂചിപ്പിക്കാം; പൊതുവായ അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തി വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοὺς κακῶς ἔχοντας
  choice: രോഗികളെ
  rationale: പദപ്രയോഗം അസുഖമുള്ളവരെ സൂചിപ്പിക്കുന്ന സാധാരണ ഗ്രീക്ക് പ്രയോഗമാണ്; മലയാളത്തിൽ ചുരുക്കവും വ്യക്തവുമായ രൂപം.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: അവൻ എവിടെയുണ്ടെന്നു കേട്ടോ അവിടേക്കെല്ലാം
  rationale: ജനങ്ങൾ യേശു ഉണ്ടെന്നു കേട്ട ഓരോ സ്ഥലത്തേക്കും രോഗികളെ കൊണ്ടുവന്നെന്ന ലക്ഷ്യസ്ഥാനസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
