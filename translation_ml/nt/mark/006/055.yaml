translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. അടിയന്തരത സൂചിപ്പിക്കാൻ ‘ഓടിനടന്ന്’ ഉപയോഗിച്ചു; മൂലത്തിലെ എടുത്തുകൊണ്ടുപോകാവുന്ന കിടക്കയുടെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
