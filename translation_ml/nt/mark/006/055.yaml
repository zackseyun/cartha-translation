revisions:
- from: അവർ ആ പ്രദേശമൊട്ടാകെ ഓടിനടന്ന്, അവൻ എവിടെയുണ്ടെന്നു കേട്ടോ അവിടേക്കെല്ലാം രോഗികളെ കിടക്കകളിൽ ചുമന്നുകൊണ്ടുവരാൻ തുടങ്ങി.[a]
  to: അവർ ആ പ്രദേശമൊട്ടാകെ ഓടിനടന്നു; അവൻ എവിടെയുണ്ടെന്ന് കേട്ടോ അവിടേക്കെല്ലാം രോഗികളെ പായകളിൽ ചുമന്നുകൊണ്ടുപോകാൻ തുടങ്ങി.[a]
