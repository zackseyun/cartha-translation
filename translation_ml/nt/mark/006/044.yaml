  text: καὶ ἦσαν οἱ φαγόντες ⸂τοὺς ἄρτους⸃ πεντακισχίλιοι ἄνδρες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: ml
  text: അപ്പങ്ങൾ ഭക്ഷിച്ചവർ അയ്യായിരം പുരുഷന്മാരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഇവിടെ ‘പുരുഷന്മാർ’ എന്നർഥമുള്ള പദമാണ്; പൊതുവായി ആളുകളെ സൂചിപ്പിക്കുന്ന പദമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: ആയിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിലുള്ള εἰμί ഇവിടെ ഭക്ഷിച്ചവരുടെ ആകെ എണ്ണം നേരിട്ട് പ്രസ്താവിക്കുന്ന ബന്ധകക്രിയയാണ്; മലയാളത്തിൽ ‘ആയിരുന്നു’ സ്വാഭാവികമായി അതു പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ φαγόντες
  choice: തിന്നവർ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഭൂതകാലകൃദന്തം, ഭക്ഷിച്ചെന്ന പൂർത്തിയായ പ്രവൃത്തിയാൽ കൂട്ടത്തെ തിരിച്ചറിയിക്കുന്നു; ‘തിന്നവർ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: τοὺς ἄρτους
  choice: അപ്പങ്ങൾ
  rationale: ἄρτος എന്നതിന് അപ്പം/റൊട്ടി എന്നർഥം വരാം; ഇവിടെ ബഹുവചനം ഭക്ഷണവിവരണത്തിലെ പ്രത്യേക അപ്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അപ്പങ്ങൾ’ ആ ദൃശ്യമായ വിവരണവിശദാംശം നിലനിർത്തുന്നു.
- source_word: πεντακισχίλιοι
  choice: അയ്യായിരം
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള ആധുനിക മലയാളരൂപം.
- source_word: ἄνδρες
  choice: പുരുഷന്മാർ
  rationale: ἀνήρ പൊതുവായ ‘ആളുകൾ’ എന്നതല്ല, പ്രത്യേകിച്ച് പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ലിംഗസവിശേഷത നിലനിർത്തുന്നു.
theological_decisions:
- issue: എണ്ണത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന ലിംഗസവിശേഷ പദം
  choice: ἄνδρες എന്നത് ‘പുരുഷന്മാർ’ എന്ന് മുഖ്യപാഠത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ആളുകൾ
  rationale: ഗ്രീക്ക് പദം പൊതുവായി വ്യക്തികളെ സൂചിപ്പിക്കുന്നതല്ല, പുരുഷന്മാരെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു. അതിനെ ലിംഗനിരപേക്ഷമാക്കാതെ മൂലപാഠത്തിന്റെ സവിശേഷത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന. സന്ദർഭത്തിലെ എണ്ണത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോൾ മൂലത്തിലെ ‘അപ്പങ്ങൾ’ എന്ന ബഹുവചനവും ‘പുരുഷന്മാർ’ എന്ന ലിംഗസവിശേഷതയും സംരക്ഷിച്ചിരിക്കുന്നു.
