- from: അവിടെ ഒരു വീര്യപ്രവൃത്തിയും ചെയ്യാൻ അവനു കഴിഞ്ഞില്ല[a]; എന്നാൽ ഏതാനും രോഗികളുടെമേൽ കൈകൾ വെച്ച് അവരെ സൗഖ്യമാക്കി.
  to: ഏതാനും രോഗികളുടെമേൽ കൈവെച്ച് അവരെ സൗഖ്യമാക്കിയതൊഴികെ, അവിടെ ഒരു ശക്തിപ്രവൃത്തിയൊന്നും[a] ചെയ്യാൻ അവനു കഴിഞ്ഞില്ല.
