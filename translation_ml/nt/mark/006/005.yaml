  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: ml
  text: ഏതാനും രോഗികളുടെമേൽ കൈവെച്ച് അവരെ സൗഖ്യമാക്കിയതൊഴികെ, അവിടെ ഒരു ശക്തിപ്രവൃത്തിയൊന്നും[a] ചെയ്യാൻ അവനു കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു അത്ഭുതവും’ അല്ലെങ്കിൽ ‘ഒരു ശക്തിയുടെ പ്രവൃത്തിയും’; ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഒരു ശക്തിയും’ എന്നാണ്. മർക്കോസിൽ ഇത് അത്ഭുതകരമായ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: ചെയ്യാൻ അവനു കഴിഞ്ഞില്ല
  rationale: നിഷേധത്തോടുകൂടിയ δύναμαι എന്ന ക്രിയയുടെ യഥാർഥ കഴിവില്ലായ്മാസൂചന നേരിട്ട് നിലനിർത്തുന്നു; അതിനെ വെറും മനസ്സില്ലായ്മയായി മയപ്പെടുത്തുന്നില്ല.
- source_word: ποιῆσαι
  choice: ചെയ്യാൻ
  rationale: ποιέω എന്ന പൊതുവായ ക്രിയയുടെ സ്വാഭാവികമായ മലയാളരൂപം; തുടർന്നുള്ള δύναμιν എന്ന പദത്തോടുള്ള ഗ്രീക്ക് പ്രയോഗവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: οὐδεμίαν δύναμιν
  choice: ഒരു വീര്യപ്രവൃത്തിയും
  rationale: മർക്കോസിൽ അത്ഭുതകരമായ ശക്തിപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന δύναμις എന്ന പദത്തിന്റെ ‘ശക്തി/വീര്യം’ എന്ന ബന്ധം കാത്തുകൊണ്ട്, ഒറ്റ അത്ഭുതപ്രവൃത്തിയെയും ഉദ്ദേശിക്കുന്ന സ്വാഭാവികമായ വിവർത്തനം.
- source_word: εἰ μὴ
  choice: എന്നാൽ
  rationale: മുൻപുള്ള സമ്പൂർണ നിഷേധത്തിന് പിന്നാലെ വരുന്ന പരിമിതമായ അപവാദം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὀλίγοις
  choice: ഏതാനും
  rationale: ചെറിയ എണ്ണത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: ἀρρώστοις
  choice: രോഗികളുടെ
  rationale: അസുഖമുള്ള ആളുകളെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സാധാരണവും മാന്യവുമായ പദം.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: കൈകൾ വെച്ച്
  rationale: കൈകൾ ശരീരത്തിന്മേൽ വെക്കുന്ന ഭൗതികപ്രവൃത്തി ലളിതമായും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: ἐθεράπευσεν
  choice: സൗഖ്യമാക്കി
  rationale: θεραπεύω എന്നതിന്റെ രോഗശാന്തിസന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായ ബൈബിൾ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: οὐκ ἐδύνατο എന്നത് യേശുവിന്റെ പരിമിതിയെ സൂചിപ്പിക്കുന്നതായി തോന്നാതിരിക്കാൻ മയപ്പെടുത്തണമോ
  choice: ‘ചെയ്യാൻ അവനു കഴിഞ്ഞില്ല’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തി
  alternative: ‘ചെയ്തില്ല’ അല്ലെങ്കിൽ ‘ചെയ്യാൻ മനസ്സായില്ല’
  rationale: ഗ്രീക്ക് പാഠം നിഷേധത്തോടുകൂടിയ δύναμαι ഉപയോഗിച്ച് കഴിവില്ലായ്മ വ്യക്തമായി പ്രസ്താവിക്കുന്നു. അതിനാൽ ദൈവശാസ്ത്രപരമായ വിശദീകരണം വിവർത്തനത്തിലേക്ക് ചേർത്ത് പാഠത്തിലെ സംഘർഷം നീക്കാതെ, അതിനെ അതേപടി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വീര്യപ്രവൃത്തി’ δύναμις എന്ന പദത്തിന്റെ ശക്തിസൂചന നിലനിർത്തുന്നു; കൂടുതൽ പരിചിതമായ ‘അത്ഭുതം’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു. ക്രിസ്തുശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള പ്രസ്താവന സംരക്ഷിച്ചിരിക്കുന്നു.
