  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. മൂലപാഠത്തിലെ കടൽ–കര വൈരുധ്യം നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
