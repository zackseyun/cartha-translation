  text: Καὶ ὀψίας γενομένης ἦν τὸ πλοῖον ἐν μέσῳ τῆς θαλάσσης, καὶ αὐτὸς μόνος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: ml
  text: സന്ധ്യയായപ്പോൾ പടവ് കടലിന്റെ നടുവിലായിരുന്നു; അവനോ തനിച്ച് കരയിലായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: സന്ധ്യയായപ്പോൾ
  rationale: കാലസാഹചര്യം സൂചിപ്പിക്കുന്ന genitive absolute പ്രയോഗം. സന്ധ്യയിലേക്കുള്ള മാറ്റം പൂർത്തിയായതായി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: πλοῖον
  choice: പടവ്
  rationale: ഗലീലക്കടലിന്റെ പശ്ചാത്തലത്തിൽ ചെറുതോ ഇടത്തരം വലുപ്പമുള്ള ജലയാനത്തെ സൂചിപ്പിക്കാൻ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പദം.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: കടലിന്റെ നടുവിൽ
  rationale: കരയിൽനിന്ന് അകലെ കടലിനുള്ളിലെ സ്ഥാനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: θάλασσα
  choice: കടൽ
  rationale: ഭൂമിശാസ്ത്രപരമായി തടാകമാണെങ്കിലും മൂലപാഠത്തിലെ θάλασσα എന്ന പദവും സുവിശേഷത്തിലെ പതിവുപയോഗവും പിന്തുടരുന്നു.
- source_word: αὐτὸς μόνος
  choice: അവനോ തനിച്ച്
  rationale: പടവിലുള്ളവരുമായി യേശുവിന്റെ സ്ഥിതി വ്യത്യസ്തമാണെന്ന ഊന്നലും അവന്റെ ഏകാന്തതയും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: കരയിൽ
  rationale: കടലിലുള്ള പടവിനോടുള്ള സ്ഥലപരമായ വൈരുധ്യം മലയാളത്തിൽ ഏറ്റവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഇവിടെ അർഥം തീരത്തുള്ള കരഭാഗമാണ്.
