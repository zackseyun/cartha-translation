    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: -ഉം / narrative coordination implicit in comma
  rationale: മുൻവാക്യത്തോടുള്ള ലളിതമായ ആഖ്യാനബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമവും കോമയുംകൊണ്ട് നിലനിർത്തുന്നു; പ്രത്യേകമായ കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: ἐξελθόντες
  choice: പുറപ്പെട്ടുപോയി
  rationale: ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ സമാപികാക്രിയയായി നൽകി; പ്രധാനക്രിയയ്ക്കു മുൻപുള്ള പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: ἐκήρυξαν
  choice: പ്രസംഗിച്ചു
  rationale: κηρύσσω എന്നതിലെ പരസ്യപ്രഖ്യാപനത്തിന്റെ ആശയം സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിധത്തിൽ നൽകുന്നു; ‘അറിയിച്ചു’ എന്നതിനെക്കാൾ പൊതുഘോഷണത്തിന്റെ ഭാരം നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: -ണമെന്ന്
  rationale: പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കമോ ഉദ്ദേശിച്ച പ്രതികരണമോ പരിചയപ്പെടുത്തുന്ന ἵνα-വാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷവാക്യരൂപത്തിൽ നൽകുന്നു.
- source_word: μετανοῶσιν
  choice: മാനസാന്തരപ്പെടണം
  rationale: μετανοέω സൂചിപ്പിക്കുന്ന മനസ്സിന്റെയും ജീവിതദിശയുടെയും ദൈവാഭിമുഖമായ മാറ്റം ‘മാനസാന്തരപ്പെടുക’ സംക്ഷിപ്തമായും ദൈവശാസ്ത്രഭാരം നഷ്ടപ്പെടുത്താതെയും നൽകുന്നു.
theological_decisions:
- issue: μετανοῶσιν എന്ന ബഹുവചനക്രിയയുടെ മറഞ്ഞിരിക്കുന്ന കർത്താവിനെ വ്യക്തമാക്കണോ
  choice: ആളുകൾ മാനസാന്തരപ്പെടണമെന്ന്
  alternative: അവർ മാനസാന്തരപ്പെടണമെന്ന്
  rationale: ഗ്രീക്കിൽ കർത്താവ് പ്രസംഗം കേൾക്കുന്നവരായി സന്ദർഭത്തിൽ ഗ്രഹിക്കപ്പെടുന്നു. മലയാളത്തിൽ ‘അവർ’ എന്നു പറഞ്ഞാൽ ശിഷ്യന്മാരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന ആശയക്കുഴപ്പം ഉണ്ടാകാം; ‘ആളുകൾ’ എന്നത് ഉപദേശപരമായ അധികവിവരം ചേർക്കാതെ ഉദ്ദേശിച്ച ശ്രോതാക്കളെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. സഭാപരമായ അമിതസാങ്കേതികത ഒഴിവാക്കിയെങ്കിലും μετανοέω എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രഭാരം നിലനിർത്താൻ ‘മാനസാന്തരപ്പെടുക’ ഉപയോഗിച്ചു.
