id: MRK.6.17
reference: Mark 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: ml
  text: കാരണം, ഹെരോദാവുതന്നെ ആളുകളെ അയച്ച് യോഹന്നാനെ പിടികൂടി തടവിൽ ബന്ധിച്ചു. തന്റെ സഹോദരനായ ഫിലിപ്പോസിന്റെ ഭാര്യയായ ഹെരോദ്യയെ അവൻ വിവാഹം കഴിച്ചിരുന്നതുകൊണ്ടായിരുന്നു ഇത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: ഹെരോദാവുതന്നെ
  rationale: Αὐτός നൽകുന്ന ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യക്രമവും അവസാനത്തെ ‘ഇത്’ എന്ന സൂചനയും വഴി വ്യക്തമാക്കുന്നു.
- source_word: ἀποστείλας ἐκράτησεν
  choice: ആളയച്ച് ... പിടിപ്പിച്ചു
  rationale: ἀποστείλας എന്ന മുൻക്രിയയും ഹെരോദാവ് പ്രതിനിധികളിലൂടെ യോഹന്നാനെ കസ്റ്റഡിയിലെടുത്തെന്ന കാര്യകർത്തൃബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ആളുകളെ’ എന്നത് ക്രിയയിൽ ഉൾക്കൊള്ളുന്ന അർത്ഥമാണ്.
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: തടവിൽ ബന്ധിച്ചിരുന്നു
  rationale: δέωയുടെ മൂർത്തമായ ‘ബന്ധിക്കുക’ എന്ന അർത്ഥവും φυλακήയുടെ തടവുസന്ദർഭവും നിലനിർത്തുന്നു; ചങ്ങല എന്ന വ്യക്തമാക്കാത്ത വിശദാംശം ചേർക്കുന്നില്ല.
- source_word: διὰ Ἡρῳδιάδα
  choice: ഹെരോദ്യയെ ... വിവാഹം കഴിച്ചിരുന്നതിനാലായിരുന്നു ഇത്
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണബന്ധം തുടർന്നുള്ള ὅτι-വാക്യവുമായി ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: തന്റെ സഹോദരനായ ഫിലിപ്പോസിന്റെ ഭാര്യ ഹെരോദ്യയെ
  rationale: γυνή ഇവിടെ ‘ഭാര്യ’ എന്നാണ്; αὐτοῦ ഹെരോദാവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തന്റെ സഹോദരനായ’ എന്ന പ്രയോഗം ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: അവൻ വിവാഹം കഴിച്ചിരുന്നതിനാൽ
  rationale: γαμέωയുടെ നേരിട്ടുള്ള അർത്ഥം നൽകുകയും, ഈ വിവാഹം തടവിലാക്കലിനു മുമ്പുള്ള കാരണസ്ഥിതിയാണെന്ന് മലയാളത്തിലെ ഭൂതപൂർവരൂപം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഹെരോദാവിന്റെ വിവാഹത്തിന്റെ ചരിത്ര-ധാർമ്മിക വിലയിരുത്തൽ
  choice: വിവാഹവും തടവിലാക്കലും തമ്മിലുള്ള കാരണബന്ധം മാത്രം വിവരണാത്മകമായി പറയുന്നു.
  alternative: വിവാഹം നിയമവിരുദ്ധമോ അധാർമ്മികമോ ആയിരുന്നെന്ന് ഈ വാക്യത്തിൽത്തന്നെ വിശദീകരിക്കുക.
  rationale: ഈ വാക്യം സംഭവത്തിന്റെ കാരണം പറയുന്നു; അതിന്റെ ധാർമ്മികവും ന്യായപ്രമാണപരവുമായ വിലയിരുത്തൽ തുടർന്നുള്ള സന്ദർഭത്തിലാണ് വരുന്നത്. അതിനാൽ ഇവിടെ ഉറവിടത്തിൽ ഇല്ലാത്ത വിധിനിർണയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ‘ഹെരോദാവുതന്നെ’ എന്ന രൂപം ഊന്നൽ നിലനിർത്തുന്നു; ‘ആളയച്ച് ... പിടിപ്പിച്ചു’ എന്നത് ഗ്രീക്ക് ക്രിയാസംബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
