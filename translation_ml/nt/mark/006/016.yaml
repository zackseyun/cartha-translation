reference: Mark 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: ml
  text: എന്നാൽ ഹെരോദാവ് ഇതു കേട്ടപ്പോൾ പറഞ്ഞു:[a] “ഞാൻ ശിരച്ഛേദം ചെയ്ത യോഹന്നാൻ—അവൻ തന്നെയാണ് ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നത്.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, അപൂർണ്ണഭൂതകാല ക്രിയയുടെ തുടർച്ചയോ ആവർത്തനമോ പ്രതിഫലിപ്പിച്ച്, “പറഞ്ഞുകൊണ്ടിരുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ, “ഉയിർപ്പിക്കപ്പെട്ടു.” “ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ കർമണിപ്രയോഗത്തിലാണ്: “ഉയിർപ്പിക്കപ്പെട്ടു/ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തത്തിന്റെ കാലസംബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ ഹെരോദാവ് കേട്ട വാർത്തകളെയാണ് ‘ഇതു’ സൂചിപ്പിക്കുന്നത്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ആഖ്യാനത്തിൽ ഹെരോദാവിന്റെ പ്രതികരണത്തിലേക്കുള്ള നേരിയ മാറ്റവും വൈരുധ്യവും സൂചിപ്പിക്കുന്നു.
- source_word: ἔλεγεν
  choice: പറഞ്ഞു
  rationale: മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ രൂപം; അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചയോ ആവർത്തനമോ ഉള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: ഞാൻ ശിരച്ഛേദം ചെയ്ത യോഹന്നാൻ
  rationale: ഗ്രീക്കിലെ മുൻനിരയിൽ വന്ന ബന്ധവാക്യത്തിന്റെ ഊന്നൽ കാത്തുകൊണ്ട് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി ക്രമീകരിക്കുന്നു.
- source_word: ἀπεκεφάλισα
  choice: ശിരച്ഛേദം ചെയ്ത
  rationale: ക്രിയയുടെ കൃത്യമായ അർഥമായ ‘തല വെട്ടിക്കളയുക’ എന്നത് മാന്യവും നേരിട്ടുമുള്ള പദത്തിൽ നൽകുന്നു.
- source_word: οὗτος
  choice: അവൻതന്നെയാണ്
  rationale: സൂചകസർവനാമത്തിന്റെ ഊന്നൽ ‘തന്നെ’ വഴി നിലനിർത്തുന്നു; വെറും ‘അവൻ’ എന്നതിനെക്കാൾ ഗ്രീക്ക് രൂപത്തിന്റെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: ἠγέρθη
  choice: ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തുകയും മരിച്ചവരിൽനിന്നുള്ള ജീവപ്രാപ്തിയുടെ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; പ്രവർത്തകനെ വാചകം വ്യക്തമാക്കാത്തതും അതേപടി വിടുന്നു.
theological_decisions:
- issue: ἠγέρθη എന്ന പദത്തിലെ പുനരുത്ഥാനഭാഷയും കർമണിപ്രയോഗവും
  choice: ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു / ഉയിർത്തെഴുന്നേറ്റു
  rationale: മൂലത്തിലെ കർമണിപ്രയോഗം സംരക്ഷിച്ച്, ഹെരോദാവിന്റെ നിഗമനത്തെ പ്രവർത്തകപ്രയോഗമാക്കി വ്യാഖ്യാനപരമായി മിനുക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘ശിരച്ഛേദം’ കൃത്യവും മാന്യവുമായ പദമായി ഉപയോഗിച്ചു; ‘അവൻതന്നെയാണ്’ οὗτος എന്നതിന്റെ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
