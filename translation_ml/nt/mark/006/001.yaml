source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: ml
  text: അവൻ അവിടെനിന്ന് പുറപ്പെട്ട് തന്റെ സ്വദേശത്തേക്കു വന്നു[a]. അവന്റെ ശിഷ്യന്മാരും അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ സ്വദേശത്തേക്കു വരുന്നു; അവന്റെ ശിഷ്യന്മാരും അവനെ അനുഗമിക്കുന്നു.’ ആഖ്യാനത്തിന് സജീവത നൽകാൻ ഗ്രീക്ക് ഇവിടെ വർത്തമാനകാലരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ പുറപ്പെട്ടുപോകുക എന്ന ചലനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: പുറപ്പെടുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സ്ഥലക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἔρχεται
  choice: വന്നു
  rationale: ഗ്രീക്കിൽ സജീവമായ ആഖ്യാനശൈലിക്കായി വർത്തമാനകാലം ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും, ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല ആഖ്യാനത്തിനായി ‘വന്നു’ എന്നു നൽകി; മൂലത്തിലെ വർത്തമാനകാലസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πατρίδα
  choice: സ്വദേശം
  rationale: πατρίς സ്വന്തം നാട്, പ്രദേശം, അല്ലെങ്കിൽ ജന്മസ്ഥലം എന്ന പരിധി വഹിക്കുന്നു. സന്ദർഭത്തിൽ നസറെത്ത് ഉദ്ദേശിക്കപ്പെടുന്നുവെങ്കിലും, ‘സ്വദേശം’ മൂലപദത്തിന്റെ അല്പം വിശാലമായ അർത്ഥപരിധി സംരക്ഷിക്കുന്നു.
- source_word: ἀκολουθοῦσιν
  choice: അനുഗമിച്ചു
  rationale: ἀκολουθέωയുടെ പിന്തുടരുക/ശിഷ്യനായി അനുഗമിക്കുക എന്ന ബന്ധപരമായ ഭാവം നിലനിർത്തുന്നു; ഗ്രീക്ക് വർത്തമാനകാലം മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലമായി നൽകി.
- source_word: μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ പഠിതാക്കളും അനുയായികളും എന്ന ഇരട്ടബന്ധം ഉൾക്കൊള്ളുന്ന സ്ഥാപിതവും ഗ്രാഹ്യവുമായ മലയാളപദം.
theological_decisions:
- issue: ἔρχεται, ἀκολουθοῦσιν എന്നീ ചരിത്രവർത്തമാനങ്ങളുടെ പരിഭാഷ
  choice: പ്രധാനവാചകത്തിൽ ‘വന്നു’, ‘അനുഗമിച്ചു’ എന്ന ഭൂതകാലരൂപങ്ങൾ
  alternative: ‘വരുന്നു ... അനുഗമിക്കുന്നു’ എന്ന വർത്തമാനകാലരൂപങ്ങൾ
  rationale: ഇത് ഉപദേശപരമായ തീരുമാനമല്ല, ആഖ്യാനശൈലിയെ സംബന്ധിക്കുന്നതാണ്. സ്വാഭാവികമായ ആധുനിക മലയാളവായനയ്ക്കായി ഭൂതകാലം ഉപയോഗിച്ചെങ്കിലും മൂലഗ്രീക്കിലെ സജീവമായ ചരിത്രവർത്തമാനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: πατρίδα എന്ന പദത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ പരിധി
  choice: സ്വദേശം
  alternative: സ്വന്തം പട്ടണം / ജന്മനാട്
  rationale: മർക്കോസ് 6-ന്റെ സന്ദർഭത്തിൽ നസറെത്ത് ഉദ്ദേശിക്കപ്പെടുന്നു; എങ്കിലും ഗ്രീക്ക് പദം പട്ടണത്തേക്കാൾ വിശാലമായി സ്വന്തം നാടിനെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം. അതിനാൽ അർത്ഥം അനാവശ്യമായി ചുരുക്കാത്ത ‘സ്വദേശം’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സ്വദേശം’ മൂലപദത്തിന്റെ അർത്ഥപരിധി സംരക്ഷിക്കുന്നു; ‘ശിഷ്യന്മാർ’, ‘അനുഗമിച്ചു’ എന്നിവ സുവിശേഷത്തിലെ ശിഷ്യത്വഭാഷ നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം [a] പ്രധാനവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
