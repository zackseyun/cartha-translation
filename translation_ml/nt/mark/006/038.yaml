source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: ml
  text: 'അവൻ അവരോടു ചോദിച്ചു: “നിങ്ങളുടെ പക്കൽ എത്ര അപ്പങ്ങളുണ്ട്? പോയി നോക്കൂ.” അവർ അന്വേഷിച്ചറിഞ്ഞശേഷം പറഞ്ഞു: “അഞ്ച് അപ്പവും രണ്ട് മീനും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: അപ്പങ്ങൾ
  rationale: ആ കാലത്തെ സാധാരണ അപ്പക്കഷണങ്ങളെയോ ചെറു അപ്പങ്ങളെയോ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπάγετε ἴδετε
  choice: പോയി നോക്കൂ
  rationale: തുടർച്ചയായ രണ്ട് ആജ്ഞകളുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളാവിഷ്കാരം.
- source_word: γνόντες
  choice: അന്വേഷിച്ചറിഞ്ഞശേഷം
  rationale: അവർ പോയി പരിശോധിച്ച് വിവരം അറിഞ്ഞു എന്ന സന്ദർഭാർഥം വ്യക്തമായി പകർന്നുകൊണ്ട് മുൻകാല ക്രിയാവിശേഷണത്തിന്റെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: ἰχθύας
  choice: മീൻ
  rationale: എണ്ണത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ഏകവചനരൂപം ഉപയോഗിക്കുന്നു; ഗ്രീക്കിലെ രണ്ട് മത്സ്യങ്ങൾ എന്ന അർഥം പൂർണമായി നിലനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലമായി അവതരിപ്പിച്ചു; സംഭാഷണത്തിന്റെ ചുരുക്കവും നേരിട്ടുള്ള സ്വഭാവവും നിലനിർത്തി.
