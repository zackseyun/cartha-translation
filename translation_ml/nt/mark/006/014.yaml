id: MRK.6.14
reference: Mark 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: ml
  text: 'ഹെരോദാരാജാവ് ഇതെക്കുറിച്ച് കേട്ടു; കാരണം യേശുവിന്റെ പേര് പരക്കെ അറിയപ്പെട്ടിരുന്നു. ജനങ്ങൾ പറഞ്ഞുകൊണ്ടിരുന്നത്: “സ്നാനം കഴിപ്പിക്കുന്ന യോഹന്നാൻ മരിച്ചവരിൽ നിന്ന് ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു[a]; അതുകൊണ്ടാണ് ആ ശക്തികൾ[b] അവനിൽ പ്രവർത്തിക്കുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പാരമ്പര്യമായി: “സ്നാപകയോഹന്നാൻ.” “ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു” എന്ന ഗ്രീക്ക് ക്രിയ കർമണി രൂപത്തിലാണ്; “മരിച്ചവരിൽ നിന്ന് ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.'
    reason: lexical_alternative_and_form_note
  - marker: b
    text: “അത്ഭുതശക്തികൾ” അല്ലെങ്കിൽ “ശക്തമായ പ്രവൃത്തികൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: ഹെരോദാ രാജാവ്
  rationale: മലയാളത്തിലെ സ്വാഭാവിക നാമക്രമം പാലിച്ചുകൊണ്ട് βασιλεύς എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘രാജാവ്’ നിലനിർത്തുന്നു.
- source_word: ἤκουσεν
  choice: ഇതെക്കുറിച്ച് കേട്ടു
  rationale: ക്രിയയുടെ കർമം ഗ്രീക്കിൽ സൂചിതമാണ്; മുൻസന്ദർഭത്തിലെ യേശുവിന്റെ പ്രവർത്തനത്തെയും പ്രസിദ്ധിയെയും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘ഇതെക്കുറിച്ച്’ ചേർത്തു.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: കാരണം യേശുവിന്റെ പേര് പരക്കെ അറിയപ്പെട്ടിരുന്നു
  rationale: ‘അവന്റെ പേര്’ എന്നത് ഈ ഒറ്റവാക്യത്തിൽ ആരെ സൂചിപ്പിക്കുന്നു എന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭസൂചിതനായ യേശുവിനെ വ്യക്തമാക്കുന്നു; ‘പേര് പരക്കെ അറിയപ്പെട്ടു’ എന്ന പ്രയോഗം പേര്/പ്രശസ്തി എന്ന ഗ്രീക്ക് ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔλεγον
  choice: ജനങ്ങൾ പറഞ്ഞുകൊണ്ടിരുന്നത്
  rationale: വ്യക്തമല്ലാത്ത ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ അനിശ്ചിത സമൂഹസൂചനയായി അവതരിപ്പിക്കുന്നു; അപൂർണകാലത്തിന്റെ തുടർച്ചയും നിലനിർത്തുന്നു.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: സ്നാനം കഴിപ്പിക്കുന്ന യോഹന്നാൻ
  rationale: ὁ βαπτίζων എന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ പ്രവർത്തനസ്വഭാവം പാരമ്പര്യപദവിയാക്കി മാറ്റാതെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ἐγείρω എന്ന ക്രിയയുടെ സമ്പൂർണകാല കർമണി രൂപം സംരക്ഷിക്കുന്നു; ഉയിർത്തെഴുന്നേൽപ്പിനെ കർത്തൃപ്രയോഗമാക്കി മാറ്റുന്നില്ല.
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻപ്രസ്താവനയെ തുടർന്നുള്ള പ്രവർത്തനത്തിന്റെ കാരണമായി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐνεργοῦσιν
  choice: പ്രവർത്തിക്കുന്നത്
  rationale: ഇപ്പോഴും സജീവമായിരിക്കുന്ന പ്രവർത്തനത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: αἱ δυνάμεις
  choice: ഈ ശക്തികൾ
  rationale: ‘ശക്തികൾ’, ‘അത്ഭുതശക്തികൾ’, ‘വീര്യപ്രവൃത്തികൾ’ എന്നീ സാധ്യതകളിൽ ഒന്നിനെ അമിതമായി നിർണ്ണയിക്കാതെ ഗ്രീക്കിലെ ബഹുവചന നാമം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ἐν എന്നതിന്റെ നേരിട്ടുള്ള സ്ഥാനാത്മക അർഥം സംരക്ഷിക്കുന്നു; വ്യാഖ്യാനാത്മകമായ ‘അവനിലൂടെ’ എന്നു മാറ്റുന്നില്ല.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേൽപ്പുസന്ദർഭത്തിലെ ἐγήγερται എന്ന കർമണി രൂപം
  choice: ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ കർമണി രൂപം വ്യക്തമായതിനാൽ അത് നിലനിർത്തുന്നു; ആരാണ് ഉയിർപ്പിച്ചത് എന്നത് വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: Ἰωάννης ὁ βαπτίζων എന്ന വിശേഷണം
  choice: സ്നാനം കഴിപ്പിക്കുന്ന യോഹന്നാൻ
  alternative: സ്നാപകയോഹന്നാൻ
  rationale: പാരമ്പര്യപദവിയെക്കാൾ ഗ്രീക്കിലെ കൃദന്തരൂപവും അതിന്റെ പ്രവർത്തനാത്മക അർഥവും മുൻനിർത്തുന്നു; പരിചിതമായ പാരമ്പര്യരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: αἱ δυνάμεις എന്നതിന്റെ അർഥപരിധി
  choice: ഈ ശക്തികൾ
  alternative: ഈ അത്ഭുതശക്തികൾ / ഈ വീര്യപ്രവൃത്തികൾ
  rationale: ഇവിടെ δύναμις ശക്തിയെയോ അത്ഭുതപ്രവൃത്തിയെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠം ആ അർഥവ്യാപ്തിയെ ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; കർമണി ഉയിർത്തെഴുന്നേൽപ്പുരൂപവും δύναμις എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
