id: MRK.6.22
reference: Mark 6:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: ml
  text: 'ഹെരോദ്യയുടെ മകൾ[a] അകത്തുവന്ന് നൃത്തം ചെയ്യുകയും ഹെരോദാവിനെയും വിരുന്നിൽ അവനോടൊപ്പം ചാരിക്കിടന്നിരുന്നവരെയും[b] സന്തോഷിപ്പിക്കുകയും ചെയ്തപ്പോൾ, രാജാവ് ആ പെൺകുട്ടിയോട് പറഞ്ഞു: “നിനക്ക് എന്തു വേണമെങ്കിലും എന്നോടു ചോദിക്കൂ; ഞാൻ അത് നിനക്കു തരാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിലും പാരമ്പര്യങ്ങളിലും ഇത് ‘അവന്റെ മകൾ ഹെരോദ്യ’ എന്നു മനസ്സിലാക്കപ്പെടുന്നു. ഇവിടെ പിന്തുടരുന്ന ഗ്രീക്ക് പാഠം ‘ഹെരോദ്യയുടെ മകൾ’ എന്നാണ് വായിക്കുന്നത്.
    reason: textual_variant
  - marker: b
    text: അഥവാ ‘അവനോടൊപ്പം ഭക്ഷണം കഴിച്ചിരുന്നവരെയും.’ വിരുന്നിൽ മേശയ്ക്കരികിൽ ചാരിക്കിടന്ന് ഭക്ഷണം കഴിച്ചിരുന്ന സഹവിരുന്നുകാരെയാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: അകത്തുവന്ന്
  rationale: ജനിതക അബ്സല്യൂട്ട് ഘടനയുടെ കാലസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വിരുന്ന് നടന്നിരുന്ന ഇടത്തേക്കുള്ള പ്രവേശനവും നിലനിർത്തുന്നു.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: ഹെരോദ്യയുടെ മകൾ
  rationale: പിന്തുടരുന്ന ഗ്രീക്ക് പാഠം പെൺകുട്ടിയെ ഹെരോദ്യയുടെ മകളായി തിരിച്ചറിയുന്നു. ‘സ്വന്തം’ എന്ന ഊന്നൽ മലയാളത്തിൽ അനാവശ്യമായി തോന്നുന്നതിനാൽ ലളിതമായ ബന്ധസൂചക പ്രയോഗം സ്വീകരിച്ചു; പാഠഭേദം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ὀρχησαμένης
  choice: നൃത്തം ചെയ്യുകയും
  rationale: പങ്കാളിക്രിയകളുടെ നിര മലയാളത്തിലെ സ്വാഭാവിക ഏകോപിത ഘടനയായി നൽകുന്നു.
- source_word: ἀρεσάσης
  choice: സന്തോഷിപ്പിക്കുകയും
  rationale: ἀρέσκω എന്നതിന്റെ നേരിട്ടുള്ള ‘പ്രസാദിപ്പിക്കുക/സന്തോഷിപ്പിക്കുക’ എന്ന ആശയം നൽകുന്നു; അതിരുകടന്ന വികാരതീവ്രത ചേർക്കുന്നില്ല.
- source_word: τοῖς συνανακειμένοις
  choice: വിരുന്നിൽ അവനോടൊപ്പം ചാരിക്കിടന്നിരുന്നവരെ
  rationale: പുരാതന വിരുന്നുകളിൽ മേശയ്ക്കരികിൽ ചാരിക്കിടന്ന് ഭക്ഷണം കഴിച്ചിരുന്ന സഹവിരുന്നുകാരെ സൂചിപ്പിക്കുന്ന ദൃശ്യരൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: രാജാവ് ... പറഞ്ഞു
  rationale: ഹെരോദാവ് സാങ്കേതികമായി ചതുർഭാഗാധിപനായിരുന്നുവെങ്കിലും മർക്കൊസിന്റെ βασιλεύς എന്ന പദം ചരിത്രപരമായി തിരുത്താതെ ‘രാജാവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τῷ κορασίῳ
  choice: ആ പെൺകുട്ടിയോട്
  rationale: κοράσιον എന്നതിന് ആധുനികവും സ്വാഭാവികവുമായ മലയാളം; ‘ആ’ മുമ്പ് പരാമർശിച്ച മകളിലേക്കുള്ള സൂചന വ്യക്തമാക്കുന്നു.
- source_word: Αἴτησόν με
  choice: എന്നോടു ചോദിക്കൂ
  rationale: അപേക്ഷ ഉന്നയിക്കാൻ ആവശ്യപ്പെടുന്ന ആജ്ഞാരൂപം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὃ ἐὰν θέλῃς
  choice: നിനക്ക് എന്തു വേണമെങ്കിലും
  rationale: തുറന്ന തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്ന അനിശ്ചിത ബന്ധവാക്യത്തിന്റെ വ്യാപ്തി കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: δώσω σοι
  choice: ഞാൻ അത് നിനക്കു തരാം
  rationale: മുൻപുള്ള ‘എന്തു വേണമെങ്കിലും’ എന്നതിനെ ‘അത്’ തിരിച്ചുപിടിക്കുന്നു; ഭാവിയിലെ വാഗ്ദാനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഹെരോദാവ് അന്തിപ്പാസിനെക്കുറിച്ചുള്ള βασιλεύς എന്ന വിശേഷണം
  choice: രാജാവ്
  alternative: ചതുർഭാഗാധിപൻ / ഭരണാധികാരി
  rationale: ചരിത്രപരമായ സാങ്കേതിക പദവി പകരംവെച്ച് മൂലപാഠത്തെ തിരുത്താതെ, മർക്കൊസിന്റെ കഥനത്തിലെ പദപ്രയോഗം അതേപടി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. പുരാതന വിരുന്നിലെ ചാരിക്കിടക്കുന്ന പതിവ് മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു. പാഠഭേദസൂചന ബന്ധപ്പെട്ട നാമവാക്യത്തിന് പിന്നാലെ വെച്ചു.
