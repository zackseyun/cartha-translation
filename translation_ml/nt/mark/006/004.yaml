reference: Mark 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “ഒരു പ്രവാചകൻ സ്വന്തം നാട്ടിലും[a] ബന്ധുക്കളുടെ ഇടയിലും[b] സ്വന്തം വീട്ടുകാരുടെ ഇടയിലും[c] അല്ലാതെ ബഹുമാനമില്ലാത്തവനല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വദേശം,’ ‘ജന്മദേശം’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം ഒരാളുടെ സ്വന്തം ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ നസറത്തിന്റെ പ്രാദേശിക സന്ദർഭത്തിൽ ‘സ്വന്തം നാട്’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സ്വജനങ്ങൾ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം ഒരാളുടെ ബന്ധുവൃന്ദത്തെയോ വംശബന്ധത്തിലുള്ളവരെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘സ്വന്തം വീട്ടിൽ’ എന്നും വരാം. ഗ്രീക്ക് പദത്തിന് ഭൗതിക വീടിനെയോ ആ വീട്ടിലെ കുടുംബാംഗങ്ങളെയോ സൂചിപ്പിക്കാം; ‘ബന്ധുക്കൾ’ എന്നതിൽനിന്നു വേർതിരിക്കാൻ ഇവിടെ ‘വീട്ടുകാർ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടരുന്ന വിവരണഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: προφήτης
  choice: പ്രവാചകൻ
  rationale: സന്ദർഭത്തിനു യോജിച്ച സ്ഥിരവും പൊതുവായി മനസ്സിലാകുന്നതുമായ മലയാള പദം.
- source_word: ἄτιμος
  choice: ബഹുമാനം ലഭിക്കാതിരിക്കുന്ന
  rationale: ‘ബഹുമാനമില്ലാത്തവൻ’ എന്ന നിലാവസ്ഥയെക്കാൾ, പ്രവാചകനു ബഹുമാനം നിഷേധിക്കപ്പെടുന്നു എന്ന ഗ്രീക്ക് ബഹുമാന-അപമാന വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: നിഷേധവാക്യത്തിലെ അപവാദാർഥം നിലനിർത്തുന്നു; നിബന്ധനാർഥമുള്ള ‘എങ്കിൽ അല്ലാതെ’ ഒഴിവാക്കുന്നു.
- source_word: πατρίδι
  choice: സ്വന്തം നാട്ടിൽ
  rationale: നസറത്ത് എന്ന ജന്മദേശീയ/സ്വദേശീയ പ്രദേശസന്ദർഭത്തിൽ ഒരാളുടെ സ്വന്തം ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: συγγενεῦσιν
  choice: ബന്ധുക്കളുടെ ഇടയിൽ
  rationale: ഒരേ വംശബന്ധത്തിലുള്ളവരെ സൂചിപ്പിക്കുകയും തുടർന്ന് വരുന്ന വീട്ടുകാരിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οἰκίᾳ
  choice: സ്വന്തം വീട്ടുകാരുടെ ഇടയിൽ
  rationale: ഭൗതിക കെട്ടിടമോ കുടുംബഗണമോ എന്ന അർഥസാധ്യതയിൽ, മുൻപുള്ള സാമൂഹിക വലയങ്ങളുടെ ക്രമാനുഗത ചുരുക്കം പരിഗണിച്ച് household/family എന്ന അർഥം മുഖ്യവാചകത്തിൽ തെരഞ്ഞെടുത്തു.
- source_word: καὶ ... καὶ ... καὶ
  choice: '...ലും ...ലും ...ലും'
  rationale: ഗ്രീക്കിലെ സഞ്ചിത ഘടന മലയാളത്തിലെ സമുച്ചയപ്രത്യയമായ ‘-ഉം’ ആവർത്തിച്ച് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രവാചകനുള്ള ബഹുമാനത്തെക്കുറിച്ചുള്ള യേശുവിന്റെ ചൊല്ലിന്റെ വ്യാപ്തി
  choice: യേശു തനിക്കു ബാധകമാക്കുന്ന പൊതുവായ ഒരു പ്രവാചകചൊല്ലായി മാത്രം വിവർത്തനം ചെയ്തു; മിശിഹാത്വമോ അവിശ്വാസമോ വിശദീകരിച്ച് ചേർത്തില്ല.
  alternative: യേശു താൻ നിരസിക്കപ്പെട്ട മിശിഹായാണെന്ന് തുറന്നുപറയുന്ന തരത്തിൽ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം പ്രവാചകന്റെ പരിചിത സാമൂഹിക വലയങ്ങളിലെ ബഹുമാനക്കുറവിനെപ്പറ്റിയുള്ള ചൊല്ലാണ്; സന്ദർഭം അത് യേശുവിനു ബാധകമാക്കുന്നെങ്കിലും അധിക സിദ്ധാന്തവിവരണം വാക്യത്തിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പഴഞ്ചൻ ‘ചാർച്ചക്കാർ,’ ‘ഭവനം’ തുടങ്ങിയ രൂപങ്ങൾ ഒഴിവാക്കി. ഗ്രീക്കിലെ നിഷേധം-അപവാദം ചേർന്ന പഴമൊഴിസ്വഭാവം ഉദ്ദേശപൂർവം നിലനിർത്തിയതിനാൽ വാക്യം സാധാരണ ഗദ്യത്തേക്കാൾ അല്പം ഔപചാരികമാണ്.
