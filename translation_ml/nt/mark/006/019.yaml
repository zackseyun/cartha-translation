id: MRK.6.19
reference: Mark 6:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ Ἡρῳδιὰς ἐνεῖχεν αὐτῷ καὶ ἤθελεν αὐτὸν ἀποκτεῖναι, καὶ οὐκ ἠδύνατο·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: ml
  text: എന്നാൽ ഹെരോദ്യാസ് അവനോടു പക വെച്ചിരുന്നു[a]; അവനെ കൊല്ലാൻ അവൾ ആഗ്രഹിച്ചിരുന്നു, എന്നാൽ അവൾക്കു കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനോടുള്ള വിരോധം ഉള്ളിൽ വളർത്തിക്കൊണ്ടിരുന്നു.” ഗ്രീക്കിലെ പ്രയോഗം തുടർന്നുനിന്ന ശത്രുതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യവും സംഭവവികാസവും സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ വിരുദ്ധബന്ധകമായി തിരഞ്ഞെടുത്തു.
- source_word: Ἡρῳδιὰς
  choice: ഹെരോദ്യ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- source_word: ἐνεῖχεν αὐτῷ
  choice: അവനോട് പകയുണ്ടായിരുന്നു
  rationale: ἐνέχω എന്ന പ്രയോഗം ഇവിടെ തുടർന്നുനിന്ന ശത്രുതയും വിരോധവും സൂചിപ്പിക്കുന്നു; അപൂർണ്ണഭൂതകാലത്തിന്റെ ദൈർഘ്യഭാവവും ഈ മലയാളപ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἤθελεν
  choice: ആഗ്രഹിച്ചു
  rationale: കൊല്ലാനുള്ള തുടർന്നുനിന്ന ഉദ്ദേശം ലളിതവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: അവനെ കൊല്ലാൻ
  rationale: നിയമപരമോ ധാർമ്മികമോ ആയ അധികനിറം ചേർക്കാതെ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: καὶ οὐκ ἠδύνατο
  choice: പക്ഷേ അതിന് അവൾക്കു കഴിഞ്ഞില്ല
  rationale: καί ഇവിടെ സന്ദർഭത്തിൽ വിരുദ്ധഭാവം വഹിക്കുന്നു; 'അതിന്' എന്നത് കൊല്ലാനുള്ള ഉദ്ദേശത്തെ വ്യക്തമായി തിരിച്ചുചൂണ്ടുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. തുടർന്നുനിന്ന വിരോധം വ്യക്തമാക്കാൻ സ്വാഭാവികമായ പ്രയോഗം സ്വീകരിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ആശയത്തിനു പിന്നാലെ ചേർത്തു.
