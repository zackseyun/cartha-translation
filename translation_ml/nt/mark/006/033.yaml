  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶδον αὐτοὺς ὑπάγοντας καὶ ⸀ἐπέγνωσαν πολλοί, καὶ πεζῇ ἀπὸ πασῶν τῶν πόλεων συνέδραμον ἐκεῖ καὶ προῆλθον ⸀αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: ml
  text: അവർ പോകുന്നതു പലരും കണ്ടു; അവരെ തിരിച്ചറിഞ്ഞു. എല്ലാ പട്ടണങ്ങളിൽനിന്നും[b] അവർ കാൽനടയായി[a] അവിടേക്കു ഓടിക്കൂടി, അവർക്കുമുമ്പേ എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കരമാർഗം”; ഇവിടെ വള്ളയാത്രയോടുള്ള വ്യത്യാസം ഊന്നിപ്പറയുന്നത് “കാൽനടയായി” എന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “എല്ലാ നഗരങ്ങളിൽനിന്നും”; ഗ്രീക്കിലെ പദത്തിന് സന്ദർഭമനുസരിച്ച് പട്ടണം അല്ലെങ്കിൽ നഗരം എന്നർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: കണ്ടു
  rationale: ആഖ്യാനക്രമത്തിൽ സാധാരണ ദൃശ്യഗ്രഹണത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὑπάγοντας
  choice: പോകുന്നതു
  rationale: മുൻസന്ദർഭത്തിൽ വള്ളത്തിലുള്ള യാത്ര വ്യക്തമാകുന്നതിനാൽ ഇവിടെ യാത്രാമാർഗം അധികമായി ചേർക്കാതെ ഗ്രീക്ക് ക്രിയയുടെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐπέγνωσαν
  choice: തിരിച്ചറിഞ്ഞു
  rationale: ഇവിടെ പുതുതായി അറിവു നേടുക എന്നതിലുപരി അവർ ആരാണെന്ന് തിരിച്ചറിയുക എന്ന സന്ദർഭാർഥമാണ്.
- source_word: πολλοί
  choice: പലരും
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: πεζῇ
  choice: കരമാർഗം
  rationale: വള്ളയാത്രയ്ക്കു വിരുദ്ധമായി കരയിലൂടെയുള്ള യാത്രയെ വ്യക്തമാക്കുന്നു; നടക്കുക മാത്രമെന്ന കർശന അർഥം ചുമത്തുന്നില്ല.
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: എല്ലാ പട്ടണങ്ങളിൽനിന്നും
  rationale: ഗലീലാ സന്ദർഭത്തിൽ πόλις എന്ന പദത്തിന് 'പട്ടണം' സ്വാഭാവികമാണ്; πασῶν എന്നതിന്റെ സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: συνέδραμον
  choice: ഓടിയെത്തി ... ഒരുമിച്ചുകൂടി
  rationale: സംയുക്തക്രിയയിലെ ഓട്ടവും പല ദിക്കുകളിൽനിന്നുള്ള ഒത്തുചേരലും മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: ലളിതമായ സ്ഥലസൂചകത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: προῆλθον αὐτούς
  choice: അവർക്കുമുമ്പേ എത്തി
  rationale: അവരെക്കാൾ മുമ്പ് ലക്ഷ്യസ്ഥാനത്ത് എത്തിയെന്ന താരതമ്യാർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ നീണ്ട ഏകവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ആദ്യത്തെ 'പലരും' എന്ന കർത്താവിൽനിന്ന് പട്ടണങ്ങളിൽനിന്നെത്തിയ ആളുകളിലേക്കുള്ള സ്വാഭാവിക തുടർച്ച നിലനിർത്താൻ രണ്ടാം വാക്യത്തിൽ 'ആളുകൾ' വ്യക്തമാക്കി.
