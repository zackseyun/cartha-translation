id: MRK.6.48
reference: Mark 6:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: ml
  text: തുഴയുന്നതിൽ അവർ പാടുപെടുന്നതു അവൻ കണ്ടു; കാറ്റ് അവർക്കു പ്രതികൂലമായിരുന്നു. ഏകദേശം രാത്രിയുടെ നാലാം യാമത്തിൽ[a] അവൻ കടലിന്മേൽ നടന്നുകൊണ്ട്[b] അവരുടെ അടുക്കൽ വരുന്നു. അവരെ കടന്നുപോകാൻ അവൻ ഉദ്ദേശിച്ചിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രാത്രിയുടെ നാലാം യാമം’ റോമൻ സമയക്കണക്കനുസരിച്ച് ഏകദേശം പുലർച്ചെ 3 മുതൽ 6 വരെയുള്ള സമയമാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘വെള്ളത്തിന്മേൽ നടന്നുകൊണ്ട്.’ ഗ്രീക്കിൽ ‘കടലിന്മേൽ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘അവരെ കടന്നുപോകാൻ’ എന്നത് അവരെ മറികടന്ന് പോകുക എന്ന ലളിതമായ അർഥത്തിലാകാം. എന്നാൽ ദൈവം ‘കടന്നുപോയി’ സ്വയം വെളിപ്പെടുത്തുന്ന പഴയനിയമ സംഭവങ്ങളെയും ഇത് പ്രതിധ്വനിപ്പിക്കാം (ഉദാ. പുറപ്പാട് 33:19, 22; 34:6; 1 രാജാക്കന്മാർ 19:11).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: കണ്ടു
  rationale: അയോറിസ്റ്റ് കൃദന്തത്തിന്റെ കാലബന്ധം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: തുഴയുമ്പോൾ അവർ പാടുപെടുന്നതു
  rationale: അവർ തുഴച്ചുകൊണ്ടിരിക്കുമ്പോഴുണ്ടായ കഠിനമായ ആയാസം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥമായ ‘പീഡിപ്പിക്കപ്പെടുക’ എന്ന പ്രയോഗത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: ἐναντίος αὐτοῖς
  choice: അവർക്കു പ്രതികൂലമായിരുന്നു
  rationale: കാറ്റ് അവരുടെ യാത്രയ്ക്ക് എതിരായിരുന്നുവെന്ന അർഥം സ്വാഭാവികവും കൃത്യവുമായി നൽകുന്നു.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: രാത്രിയുടെ നാലാം യാമത്തോടടുത്തപ്പോൾ
  rationale: പുരാതന സമയവിഭാഗം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും περὶ സൂചിപ്പിക്കുന്ന ഏകദേശത നൽകുകയും ചെയ്യുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം സംരക്ഷിക്കുന്നു.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: കടലിന്മേൽ നടന്നുകൊണ്ട്
  rationale: θάλασσα എന്നതിന്റെ ‘കടൽ’ എന്ന നേരിട്ടുള്ള അർഥവും ἐπίയുടെ ‘മേൽ’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: അവരെ കടന്നുപോകാൻ അവൻ ഉദ്ദേശിച്ചിരുന്നു
  rationale: θέλω ഇവിടെ സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യവും ‘കടന്നുപോകുക’ എന്ന പദസമുച്ചയത്തിന്റെ വ്യാഖ്യാനാത്മക തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘അവരെ കടന്നുപോകാൻ അവൻ ഉദ്ദേശിച്ചിരുന്നു’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള പ്രയോഗം നിലനിർത്തി
  alternative: അവരെ പിന്നിലാക്കി മുന്നോട്ടുപോകുക; അല്ലെങ്കിൽ ദൈവിക സ്വയംവെളിപ്പെടുത്തലിലെ ‘കടന്നുപോകൽ’ സൂചന
  rationale: ഗ്രീക്ക് വാചകം ഉദ്ദേശ്യം വിശദീകരിക്കുന്നില്ല. പഴയനിയമത്തിലെ ദൈവപ്രത്യക്ഷതകളുടെ പ്രതിധ്വനി സാധ്യതയുള്ളതിനാൽ ആ അർഥസമ്മർദം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നാലാം യാമം’ പോലുള്ള സാംസ്കാരിക പദം മൂലരൂപത്തിൽ സൂക്ഷിച്ച് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു; ചരിത്രവർത്തമാനകാലമായ ‘വരുന്നു’ നിലനിർത്തി.
