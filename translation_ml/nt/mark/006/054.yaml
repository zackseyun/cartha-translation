  text: καὶ ἐξελθόντων αὐτῶν ἐκ τοῦ πλοίου ⸀εὐθὺς ἐπιγνόντες αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/054.yaml
  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: ml
  text: അവർ പടകിൽനിന്ന് ഇറങ്ങിയപ്പോൾത്തന്നെ അവിടെയുള്ളവർ അവനെ തിരിച്ചറിഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവർ പടകിൽനിന്ന് ഇറങ്ങിയപ്പോൾ, ഉടൻ അവനെ തിരിച്ചറിഞ്ഞ്…” തിരിച്ചറിഞ്ഞവരുടെ കർത്താവ് ഗ്രീക്കിൽ തുറന്നുപറഞ്ഞിട്ടില്ല; സന്ദർഭം ആ പ്രദേശത്തുള്ള ആളുകളെയാണു സൂചിപ്പിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: അവർ ... ഇറങ്ങിയപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയെ സ്വാഭാവികമായ മലയാളത്തിലെ കാലസൂചക ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി; സന്ദർഭത്തിൽ പടകിൽനിന്ന് ഇറങ്ങുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πλοίου
  choice: പടകിൽനിന്ന്
  rationale: ഗലീലക്കടലിലെ ചെറുജലയാനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ ‘പടക്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: εὐθὺς
  choice: ഉടൻതന്നെ
  rationale: മർക്കോസിന്റെ വിവരണശൈലിയിൽ ആവർത്തിക്കുന്ന അടിയന്തരതയുടെ ഭാവം നിലനിർത്തുന്നു; മലയാളവാക്യത്തിൽ ‘ഇറങ്ങിയപ്പോൾത്തന്നെ’ എന്ന സംയോജനത്തിലൂടെ ഇത് സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: ἐπιγνόντες
  choice: തിരിച്ചറിഞ്ഞു
  rationale: കണ്ടപ്പോൾ മുമ്പേ അറിയുന്ന വ്യക്തിയാണെന്ന് മനസ്സിലാക്കുക എന്ന സന്ദർഭാർഥം ‘തിരിച്ചറിഞ്ഞു’ വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: സന്ദർഭത്തിൽ സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ സർവനാമരൂപം മലയാളത്തിലും നിലനിർത്തി.
- source_word: implicit subject of ἐπιγνόντες
  choice: അവിടെയുള്ളവർ
  rationale: ഗ്രീക്കിൽ ക്രിയാപദസമാനമായ കൃദന്തരൂപത്തിന്റെ കർത്താവ് വ്യക്തമായി നാമീകരിച്ചിട്ടില്ല. മുൻപുള്ള ജനിറ്റീവ് αὐτῶν അതിന്റെ വ്യാകരണകർത്താവാകാൻ കഴിയില്ല; തുടർന്നുള്ള സന്ദർഭം ആ പ്രദേശത്തുള്ള ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി ‘അവിടെയുള്ളവർ’ ചേർത്തു, അതിന്റെ മൂലപാഠസ്ഥിതി അടിക്കുറിപ്പിൽ അറിയിച്ചു.
theological_decisions:
- issue: യേശുവിനെ തിരിച്ചറിഞ്ഞവർ ആരെന്ന നിർണ്ണയം
  choice: അവിടെയുള്ളവർ അവനെ തിരിച്ചറിഞ്ഞു
  alternative: കർത്താവിനെ വ്യക്തമാക്കാതെ ‘ഉടൻ അവനെ തിരിച്ചറിഞ്ഞു’ എന്നു നൽകുക
  rationale: ഇത് ദൈവശാസ്ത്രപരമായ നിർണ്ണയത്തേക്കാൾ വ്യാകരണപരവും സന്ദർഭപരവുമായ തീരുമാനമാണ്. ἐπιγνόντες എന്ന നാമനിർദേശ ബഹുവചന കൃദന്തം ജനിറ്റീവ് അബ്സല്യൂട്ടിലെ αὐτῶν-നെ സ്വാഭാവികമായി ആശ്രയിക്കുന്നില്ല; അടുത്ത വാക്യത്തിൽ പ്രദേശവാസികൾ ഓടിച്ചെന്ന് പ്രവർത്തിക്കുന്നതും ഈ വായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും മൂലത്തിൽ കർത്താവ് പ്രസ്താവിച്ചിട്ടില്ലെന്ന അസ്പഷ്ടത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവിടെയുള്ളവർ’ എന്ന ചേർക്കൽ സാധാരണ വായനക്കാരന് കർത്താവ് വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് മൂലഗ്രീക്കിലെ അപൂർണമായ കർത്തൃസൂചനയും കൃദന്തരൂപത്തിന്റെ ഘടനയും സംരക്ഷിക്കുന്നു.
