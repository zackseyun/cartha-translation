translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ കാലസൂചക ഘടന മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ നൽകിയിരിക്കുന്നു; ഔപചാരിക വിരുന്നിന്റെയും അതിഥികളുടെ ഉന്നത പദവിയുടെയും ഭാവം നിലനിർത്തി.
