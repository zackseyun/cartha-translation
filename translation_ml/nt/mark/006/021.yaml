reference: Mark 6:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: ml
  text: അനുകൂലമായ ഒരു ദിവസം വന്നപ്പോൾ[a], ഹെരോദാവ് തന്റെ ജന്മദിനത്തിൽ തന്റെ പ്രഭുക്കന്മാർക്കും സൈനിക മേധാവികൾക്കും ഗലീലയിലെ പ്രമുഖരായ പുരുഷന്മാർക്കുമായി വിരുന്നൊരുക്കി[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൗകര്യപ്രദമായ ഒരു ദിവസം’ എന്നും ‘പറ്റിയ അവസരം ലഭിച്ച ദിവസം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം അനുയോജ്യമായതോ തന്ത്രപരമായി അനുകൂലമായതോ ആയ അവസരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അത്താഴം ഉണ്ടാക്കി’; അഥവാ, ‘അത്താഴവിരുന്ന് നടത്തി.’
    reason: lexical_alternative
  - marker: c
    text: ‘ഗലീലയിലെ ഒന്നാംനിരക്കാരായ പുരുഷന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ പ്രയോഗം പ്രദേശത്തെ ഉന്നതസ്ഥാനീയരായ പുരുഷനേതാക്കളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης ἡμέρας εὐκαίρου
  choice: അനുകൂലമായ ഒരു ദിവസം വന്നപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സാഹചര്യത്തെ അവതരിപ്പിക്കുന്നു; εὔκαιρος കാത്തിരുന്ന അവസരത്തിന് യോജിച്ച, തന്ത്രപരമായി അനുകൂലമായ ദിവസം എന്ന കഥാസന്ദർഭം നൽകുന്നു.
- source_word: ὅτε
  choice: തുടർന്നുള്ള സംഭവത്തിലൂടെ ഉൾക്കൊള്ളിച്ചു
  rationale: ഗ്രീക്കിൽ ഈ കാലസൂചകബന്ധം ‘അനുകൂലമായ ദിവസം’ ഏതാണ് എന്ന് വിശദീകരിക്കുന്നു. മലയാളത്തിൽ ഇരട്ട ‘എപ്പോൾ’ ഒഴിവാക്കി സ്വാഭാവികമായ വാക്യഘടനയിൽ ബന്ധം പ്രകടമാക്കി.
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: തന്റെ ജന്മദിനത്തിൽ
  rationale: γενέσια ജന്മദിനാചരണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: δεῖπνον ἐποίησεν
  choice: വിരുന്നൊരുക്കി
  rationale: അക്ഷരാർഥം ‘അത്താഴം ഉണ്ടാക്കി’ എന്നാണെങ്കിലും, ഉന്നതസ്ഥാനീയരായ അതിഥികൾക്കായി നടത്തിയ ഔപചാരിക സദ്യയെന്ന ആശയം ‘വിരുന്നൊരുക്കി’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: തന്റെ പ്രഭുക്കന്മാർക്ക്
  rationale: μεγιστᾶνες ഉന്നതസ്ഥാനമുള്ള രാജസഭാ പ്രമുഖരെയോ അധികാരികളെയോ സൂചിപ്പിക്കുന്നു; ‘പ്രഭുക്കന്മാർ’ അവരുടെ പദവിയും ഹെരോദാവുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: τοῖς χιλιάρχοις
  choice: സൈനിക മേധാവികൾക്ക്
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ആയിരത്തിന്റെ അധിപൻ എന്നാണെങ്കിലും ഇവിടെ മുതിർന്ന സൈനിക ഉദ്യോഗസ്ഥരെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രത്യേക റോമൻ പദവി അനാവശ്യമായി ചുമത്താതെ പ്രവർത്തനപരമായ അർഥം നൽകുന്നു.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: ഗലീലയിലെ പ്രമുഖർക്ക്
  rationale: πρῶτοι പ്രദേശത്തെ ഒന്നാംനിരയിലുള്ള, സ്വാധീനമുള്ള വ്യക്തികളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പ്രമുഖർ’ പദവിയും സാമൂഹിക പ്രാധാന്യവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Καὶ
  choice: വാക്യപ്രവാഹത്തിൽ പരോക്ഷമായി നിലനിർത്തി
  rationale: മർക്കോസിന്റെ ആഖ്യാനബന്ധം മുൻസന്ദർഭത്തിൽനിന്നുള്ള തുടർച്ചയിലാണ്; ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ നിർബന്ധിതമായ ‘പിന്നെ’ ചേർക്കാതെ മലയാളത്തിലെ പ്രവാഹത്തിലൂടെ തുടർച്ച പ്രകടമാക്കുന്നു.
- source_word: Ἡρῴδης
  choice: ഹെരോദാവ്
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
