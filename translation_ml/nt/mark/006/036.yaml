source:
  edition: SBLGNT
  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: ml
  text: അവർ ചുറ്റുമുള്ള നാട്ടിൻപുറങ്ങളിലേക്കും ഗ്രാമങ്ങളിലേക്കും പോയി തങ്ങൾക്കു ഭക്ഷിക്കാൻ എന്തെങ്കിലും വാങ്ങേണ്ടതിന് അവരെ പറഞ്ഞയയ്ക്കുക[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “അവരെ വിട്ടയയ്ക്കുക, അവർ ചുറ്റുമുള്ള കൃഷിപ്രദേശങ്ങളിലേക്കും ഗ്രാമങ്ങളിലേക്കും പോയി തങ്ങൾക്കുവേണ്ടി എന്തു ഭക്ഷിക്കാമോ അത് വാങ്ങേണ്ടതിന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλυσον
  choice: പറഞ്ഞയയ്ക്കുക
  rationale: ജനക്കൂട്ടത്തെ അവിടെനിന്ന് പോകാൻ അനുവദിച്ച് അയയ്ക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആജ്ഞയുടെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: … വാങ്ങട്ടെ
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥം മലയാളത്തിലെ സ്വാഭാവികമായ അനുവദനീയ/ഉദ്ദേശ്യസൂചക ക്രിയാരൂപത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἀπελθόντες
  choice: പോയി
  rationale: മുൻകൃത്യത്തെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ ക്രമാനുസൃതമായ ബന്ധവിനയെച്ചമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: ചുറ്റുമുള്ള നാട്ടിൻപുറങ്ങളിലും ഗ്രാമങ്ങളിലും
  rationale: κύκλῳ എന്നതിന്റെ ചുറ്റുമുള്ള എന്ന അർഥവും, ἀγροί എന്നതിന്റെ വയലുകൾ/കൃഷിയിടങ്ങൾ/ഗ്രാമപ്രദേശം എന്ന വ്യാപ്തിയും ‘നാട്ടിൻപുറങ്ങൾ’ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; κῶμαι ‘ഗ്രാമങ്ങൾ’ എന്നാണ്.
- source_word: ἀγοράσωσιν
  choice: വാങ്ങട്ടെ
  rationale: വിലകൊടുത്ത് സമ്പാദിക്കുക എന്ന സാധാരണ അർഥം വ്യക്തവും സമകാലികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἑαυτοῖς
  choice: തങ്ങൾക്കു
  rationale: പ്രവൃത്തിയുടെ ഗുണഭോക്താക്കൾ അവർ തന്നെയാണെന്ന reflexive dative ഭാവം നിലനിർത്തുന്നു.
- source_word: τί φάγωσιν
  choice: ഭക്ഷിക്കാൻ എന്തെങ്കിലും
  rationale: τίയുടെ അനിശ്ചിതഭാവം ‘എന്തെങ്കിലും’ എന്നും φάγωσιν എന്നതിനെ ‘ഭക്ഷിക്കാൻ’ എന്നും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
