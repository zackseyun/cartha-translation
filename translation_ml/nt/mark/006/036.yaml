translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. മുഖ്യവാചകത്തിൽ ഗ്രീക്കിന്റെ ഉദ്ദേശ്യവും പ്രവൃത്തിക്രമവും സ്വാഭാവികമായി നിലനിർത്തി; കൂടുതൽ ഔപചാരികമായ പദാനുപദ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
