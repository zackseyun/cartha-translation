- from: അവരെ പറഞ്ഞയയ്ക്കുക[a]; അവർ ചുറ്റുമുള്ള നാട്ടിൻപുറങ്ങളിലും ഗ്രാമങ്ങളിലും പോയി തങ്ങൾക്കു ഭക്ഷിക്കാൻ എന്തെങ്കിലും വാങ്ങട്ടെ.
  to: അവർ ചുറ്റുമുള്ള നാട്ടിൻപുറങ്ങളിലേക്കും ഗ്രാമങ്ങളിലേക്കും പോയി തങ്ങൾക്കു ഭക്ഷിക്കാൻ എന്തെങ്കിലും വാങ്ങേണ്ടതിന് അവരെ പറഞ്ഞയയ്ക്കുക[a].
  rationale: The revision explicitly marks the purposive force of ἵνα (“വാങ്ങേണ്ടതിന്”) while retaining the sequence conveyed by ἀπελθόντες (“പോയി”). “നാട്ടിൻപുറങ്ങൾ” remains an idiomatic collective rendering of ἀγροί in the main text; the footnote offers the more concrete “കൃഷിപ്രദേശങ്ങൾ” as an alternative without narrowing the main rendering.
