id: MRK.6.29
reference: Mark 6:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: ml
  text: അവന്റെ ശിഷ്യന്മാർ കേട്ടപ്പോൾ വന്ന് അവന്റെ മൃതദേഹം എടുത്ത് ഒരു കല്ലറയിൽ വെച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: സന്ദർഭത്തിൽ കാലസൂചന നൽകുന്ന aorist participle ആണ്; സ്വാഭാവിക മലയാളത്തിൽ സംഭവക്രമം വ്യക്തമാക്കാൻ ‘കേട്ടപ്പോൾ’ എന്നു നൽകി. കേട്ട കാര്യത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ആവശ്യമായ ‘ഇതു’ ചേർത്തു.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: μαθηταί എന്നതിന്റെ ബന്ധപരവും പതിവുമായ അർഥം ‘ശിഷ്യന്മാർ’ ആണ്. സമീപസന്ദർഭത്തിൽ ‘അവന്റെ’ എന്നത് യോഹന്നാൻ സ്നാപകനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἦλθον
  choice: വന്ന്
  rationale: ἔρχομαι എന്നതിന്റെ വരവ് എന്ന അർഥം നിലനിർത്തുകയും തുടർന്നുള്ള ക്രിയകളുമായി സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἦραν
  choice: എടുത്ത്
  rationale: αἴρω ഇവിടെ മൃതദേഹം എടുത്തുകൊണ്ടുപോകുന്നതിനുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘എടുത്ത്’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: πτῶμα
  choice: മൃതശരീരം
  rationale: πτῶμα ജീവനറ്റ ശരീരത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. ‘മൃതശരീരം’ ആ അർഥം നേരിട്ട്, മാന്യമായി, ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔθηκαν
  choice: വെച്ചു
  rationale: τίθημι എന്നതിന്റെ അടിസ്ഥാനമായ ‘വയ്ക്കുക’ എന്ന അർഥം ശവസംസ്കാരസന്ദർഭത്തിലും സ്വാഭാവികമായി ചേരുന്നു.
- source_word: ἐν μνημείῳ
  choice: ഒരു കല്ലറയിൽ
  rationale: μνημεῖον ഇവിടെ മൃതദേഹം സംസ്കരിക്കുന്ന കല്ലറയെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ-സാഹിത്യ രജിസ്റ്ററിലും സാധാരണ വായനയിലും ‘കല്ലറ’ വ്യക്തവും യോജിച്ചതുമാണ്.
theological_decisions:
- issue: ‘അവന്റെ ശിഷ്യന്മാർ’ എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതൻ
  choice: യോഹന്നാൻ സ്നാപകന്റെ ശിഷ്യന്മാർ
  alternative: യേശുവിന്റെ ശിഷ്യന്മാർ
  rationale: തൊട്ടുമുമ്പുള്ള വിവരണം യോഹന്നാന്റെ വധത്തെക്കുറിച്ചാണ്; അവന്റെ മൃതദേഹം ഏറ്റെടുത്ത് സംസ്കരിക്കുന്നവർ യോഹന്നാന്റെ ശിഷ്യന്മാരാണെന്ന് സമീപസന്ദർഭം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ തുടർച്ചയായ καί ഘടന മലയാളത്തിൽ participial ബന്ധങ്ങളായി സ്വാഭാവികമാക്കി; അർഥമോ സംഭവക്രമമോ മാറ്റിയിട്ടില്ല.
