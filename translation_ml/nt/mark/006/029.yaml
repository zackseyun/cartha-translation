- from: അവന്റെ ശിഷ്യന്മാർ ഇതു കേട്ടപ്പോൾ വന്ന് അവന്റെ മൃതദേഹം എടുത്ത് ഒരു കല്ലറയിൽ വെച്ചു.
  to: അവന്റെ ശിഷ്യന്മാർ കേട്ടപ്പോൾ വന്ന് അവന്റെ മൃതദേഹം എടുത്ത് ഒരു കല്ലറയിൽ വെച്ചു.
  rationale: Removed the supplied object ‘ഇതു’ to more closely reflect the Greek’s unexpressed object while retaining idiomatic Malayalam and the original sequence of events. The antecedent of ‘അവന്റെ’ remains John the Baptist from the immediate context.
