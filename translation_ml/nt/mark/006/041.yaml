id: MRK.6.41
reference: Mark 6:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: ml
  text: അവൻ അഞ്ച് അപ്പങ്ങളും രണ്ട് മീനുകളും എടുത്ത് സ്വർഗത്തിലേക്കു നോക്കി അനുഗ്രഹിച്ചു[a]. പിന്നെ അപ്പങ്ങൾ നുറുക്കി, ജനങ്ങളുടെ മുമ്പിൽ വെക്കാൻ[b] തന്റെ ശിഷ്യന്മാർക്കു കൊടുത്തുകൊണ്ടിരുന്നു. രണ്ട് മീനുകളും അവൻ എല്ലാവർക്കും വിഭജിച്ചുകൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നന്ദി പറഞ്ഞു.” ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം “അനുഗ്രഹിച്ചു” എന്നാണ്; ഭക്ഷണസന്ദർഭത്തിൽ അതിന് നന്ദിപറയുന്നതുമായി അർഥസാമ്യം ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ജനങ്ങൾക്കു വിളമ്പാൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: എടുത്ത്
  rationale: പ്രവർത്തനങ്ങളുടെ തുടർച്ച അവതരിപ്പിക്കുന്ന ഭൂതകാല കൃുദന്തരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ ക്രിയാശൃംഖലയായി നൽകി.
- source_word: τοὺς πέντε ἄρτους
  choice: ആ അഞ്ച് അപ്പം
  rationale: എണ്ണാവുന്ന അപ്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സംഖ്യയ്ക്കുശേഷം ഏകവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: τοὺς δύο ἰχθύας
  choice: രണ്ട് മീൻ
  rationale: എണ്ണത്തിനുശേഷമുള്ള സ്വാഭാവിക മലയാളരൂപം; വാക്യത്തിന്റെ അവസാനത്തിൽ ഗ്രീക്കിലെ ആവർത്തനം അനുസരിച്ച് ‘രണ്ട് മീനും’ എന്നു നിലനിർത്തി.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: സ്വർഗത്തിലേക്ക് നോക്കി
  rationale: മുകളിലേക്കുള്ള ദൃഷ്ടിയും οὐρανός എന്ന പദത്തിന്റെ ദൈവിക അനുരണനവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: εὐλόγησεν
  choice: അനുഗ്രഹിച്ചു
  rationale: ഗ്രീക്കിലെ ‘അനുഗ്രഹിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; വ്യക്തമായ കർമം ചേർക്കാതെ മൂലത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: അപ്പങ്ങൾ നുറുക്കി
  rationale: അപ്പങ്ങൾ പൊട്ടിച്ചു വിഭജനത്തിന് ഒരുക്കുന്ന ദൃശ്യമായ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐδίδου
  choice: കൊടുത്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചയോ ആവർത്തനമോ വ്യക്തമാക്കുന്നു.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാർക്ക്
  rationale: αὐτοῦ എന്ന ഉടമസ്ഥസൂചന വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: ജനങ്ങളുടെ മുമ്പിൽ വെക്കാൻ
  rationale: ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും παρατίθημι എന്നതിലെ ‘മുമ്പിൽ വെക്കുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു; αὐτοῖς എന്നതിന്റെ സന്ദർഭപരമായ സൂചന ജനക്കൂട്ടമാണ്.
- source_word: ἐμέρισεν πᾶσιν
  choice: എല്ലാവർക്കുമായി പങ്കിട്ടു
  rationale: വിഭജിച്ച് എല്ലാവർക്കും പങ്ക് ലഭിക്കുന്ന വിതരണം സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ഭക്ഷണസന്ദർഭത്തിലെ εὐλόγησεν എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: അനുഗ്രഹിച്ചു
  alternative: നന്ദി പറഞ്ഞു
  rationale: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത് εὐχαριστέω അല്ല, εὐλογέω ആണ്. ഭക്ഷണസന്ദർഭത്തിൽ നന്ദിപറയുന്ന ആശയം ഉൾപ്പെടാമെങ്കിലും ‘അനുഗ്രഹിച്ചു’ എന്നത് മൂലപദത്തോട് കൂടുതൽ സുതാര്യമാണ്. കർമം വ്യക്തമാക്കാതിരുന്നത് യേശു ഭക്ഷണത്തെ നേരിട്ട് അനുഗ്രഹിച്ചു എന്ന വ്യാഖ്യാനം നിർബന്ധമാക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ദൈർഘ്യമേറിയ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്നു മലയാളവാക്യങ്ങളാക്കി; പ്രവർത്തനക്രമവും ആവർത്തിച്ചുകൊടുക്കുന്ന ഭാവവും നിലനിർത്തി.
