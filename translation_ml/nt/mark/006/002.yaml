id: MRK.6.2
reference: Mark 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: ml
  text: 'ശബ്ബത്ത് വന്നപ്പോൾ അവൻ സിനഗോഗിൽ പഠിപ്പിക്കാൻ തുടങ്ങി. അവനെ കേട്ട പലരും വിസ്മയിച്ച് പറഞ്ഞു: “ഇയാൾക്ക് ഇതെല്ലാം എവിടെനിന്ന് കിട്ടി? ഇയാൾക്കു നൽകപ്പെട്ട ഈ ജ്ഞാനം എന്താണ്? ഇയാളുടെ കൈകളിലൂടെ ഇത്തരം ശക്തിയുള്ള പ്രവൃത്തികൾ നടക്കുന്നതെങ്ങനെ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: ശബ്ബത്ത് വന്നപ്പോൾ
  rationale: കാലസാഹചര്യം സൂചിപ്പിക്കുന്ന genitive absolute-ന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἤρξατο διδάσκειν
  choice: പഠിപ്പിക്കാൻ തുടങ്ങി
  rationale: ἄρχομαι + infinitive എന്ന ആരംഭസൂചക പ്രയോഗത്തെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: συναγωγῇ
  choice: സിനഗോഗിൽ
  rationale: ഇവിടെ യഹൂദരുടെ ആരാധനാസ്ഥലമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ സ്ഥാപനപരവും സ്ഥലപരവുമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: അവന്റെ വാക്കുകൾ കേട്ട പലരും
  rationale: കേൾവിയുടെ സന്ദർഭം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായ ‘അവന്റെ വാക്കുകൾ’ എന്ന കർമം ചേർത്തു; ‘പലരും’ οἱ πολλοί-യുടെ അർഥം നൽകുന്നു.
- source_word: ἐξεπλήσσοντο
  choice: ആശ്ചര്യപ്പെട്ടു
  rationale: ശക്തമായ വിസ്മയപ്രതികരണം ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: ഇയാൾക്ക് ഇതെല്ലാം എവിടെനിന്ന് കിട്ടി?
  rationale: Πόθεν ഉത്ഭവത്തെയോ ഉറവിടത്തെയോ ചോദിക്കുന്നു; ‘ഇയാൾ’ τούτῳ എന്നതിലെ അകലം പാലിക്കുന്ന സ്വരം നിലനിർത്തുന്നു.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: ഇയാൾക്കു നൽകപ്പെട്ടിരിക്കുന്ന ഈ ജ്ഞാനം എന്താണ്?
  rationale: നൽകപ്പെട്ട ജ്ഞാനത്തെക്കുറിച്ചുള്ള വിസ്മയഭരിതമായ ചോദ്യം നിലനിർത്തുകയും passive participle-ന്റെ ഭാവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: δυνάμεις
  choice: ശക്തിപ്രവൃത്തികൾ
  rationale: δύναμις എന്ന പദത്തിലെ ‘ശക്തി’ എന്ന ഘടകവും സന്ദർഭത്തിലെ അസാധാരണ പ്രവൃത്തികൾ എന്ന അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘അത്ഭുതങ്ങൾ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: ഇയാളുടെ കൈകളിലൂടെ ... നടക്കുന്നത്
  rationale: διά + genitive-ന്റെ ഉപകരണാർഥവും ‘കൈകളിലൂടെ’ എന്ന ഗ്രീക്ക് ദൃശ്യബിംബവും γινόμεναι-യുടെ സംഭവിക്കുന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: δυνάμεις എന്നതിന്റെ സ്വഭാവം
  choice: ശക്തിപ്രവൃത്തികൾ
  alternative: അത്ഭുതങ്ങൾ / വീര്യപ്രവൃത്തികൾ
  rationale: മർക്കോസിലെ സന്ദർഭം അസാധാരണ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും പദത്തിലെ ശക്തി എന്ന അടിസ്ഥാനഘടകത്തെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അത്ഭുതപ്രവൃത്തികൾ എന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: τούτῳ എന്നതിന്റെ സാമൂഹികസ്വരം
  choice: ഇയാൾക്ക് / ഇയാൾക്കു / ഇയാളുടെ
  alternative: അവന് / അവന്റെ
  rationale: പ്രഭാഷകരുടെ അകലം പാലിക്കുന്നതോ നേരിയ അവജ്ഞ സൂചിപ്പിക്കുന്നതോ ആയ demonstrative സ്വരം ‘ഇയാൾ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കടുത്ത നിന്ദ ചേർക്കുന്നില്ല.
- issue: δοθεῖσα എന്ന കർമണിപ്രയോഗത്തിലെ ദാതാവ്
  choice: നൽകപ്പെട്ടിരിക്കുന്ന
  alternative: ദൈവം നൽകിയ
  rationale: ഗ്രീക്ക് വാക്യം ദാതാവിനെ വ്യക്തമാക്കാത്തതിനാൽ ആരാണ് ജ്ഞാനം നൽകിയതെന്ന് വിവർത്തനം തീരുമാനിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും കഥനോചിതവുമായ ശൈലി സ്വീകരിച്ചു. ‘സിനഗോഗ്’ എന്ന പരിചിതമായ ചരിത്ര-മതപര പദം നിലനിർത്തി. ഗ്രീക്കിലെ ചോദ്യങ്ങളുടെ വിസ്മയവും അല്പം അകലം പാലിക്കുന്ന ജനക്കൂട്ടത്തിന്റെ സ്വരവും സ്വാഭാവികമായ മലയാളചോദ്യങ്ങളിലൂടെ അവതരിപ്പിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാളിയിൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘Sabbath’-നു ശേഷമുണ്ടായിരുന്നെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം δυνάμεις-നെക്കുറിച്ചായതിനാൽ പ്രസക്തമായ ‘ശക്തിപ്രവൃത്തികൾ’ എന്ന പദത്തിനു ശേഷമാണ് [a] ചേർത്തത്.
