  source_fidelity: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനമായ συνάγονται സ്വാഭാവിക ഭൂതകാലത്തിൽ «ഒരുമിച്ചുകൂടി» എന്നു നൽകിയിരിക്കുന്നു. πρὸς τὸν Ἰησοῦν എന്ന ചലനദിശ «യേശുവിന്റെ അടുക്കൽ» എന്നതിൽ വ്യക്തമാണ്. ἀπήγγειλαν-ന്റെ മടങ്ങിവന്ന് വിവരമറിയിക്കുന്ന ഭാവം «അറിയിച്ചു» ശരിയായി നൽകുന്നു. πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν എന്ന സമഗ്രവും സമാന്തരവുമായ ഘടന «തങ്ങൾ ചെയ്തതും പഠിപ്പിച്ചതും എല്ലാം» എന്നതിൽ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു.
