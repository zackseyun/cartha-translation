source:
  edition: SBLGNT
  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: ml
  text: അപ്പൊസ്തലന്മാർ യേശുവിന്റെ അടുക്കൽ ഒരുമിച്ചുകൂടി. തങ്ങൾ ചെയ്തതും പഠിപ്പിച്ചതും എല്ലാം അവർ അവനോട് അറിയിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: ഒരുമിച്ചുകൂടി
  rationale: ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു; കൂട്ടമായി വന്നുചേരുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἀπόστολοι
  choice: അപ്പൊസ്തലന്മാർ
  rationale: ഇവിടെ ദൗത്യത്തിനയയ്ക്കപ്പെട്ട പന്ത്രണ്ടുപേരുടെ അംഗീകൃത സ്ഥാനനാമമാണ്; പൊതുവായ ‘ദൂതന്മാർ’ എന്നതിനെക്കാൾ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: യേശുവിന്റെ അടുക്കൽ
  rationale: πρός + accusative സൂചിപ്പിക്കുന്ന യേശുവിലേക്കുള്ള വരവ് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀπήγγειλαν
  choice: അറിയിച്ചു
  rationale: ദൗത്യം കഴിഞ്ഞ് മടങ്ങിയെത്തിയവർ ചെയ്ത കാര്യങ്ങൾ വിവരിച്ചറിയിക്കുന്ന അർഥം നൽകുന്നു; അത്യന്തം ഔപചാരികമായ പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν
  choice: തങ്ങൾ ചെയ്തതും പഠിപ്പിച്ചതും എല്ലാം
  rationale: രണ്ട് സമാന്തര relative clauses-ഉം πάντα എന്നതിന്റെ സമഗ്രതയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരെ ἀπόστολοι എന്നു വിശേഷിപ്പിക്കുന്നത്
  choice: സ്ഥാനനാമമായി ‘അപ്പൊസ്തലന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘അയയ്ക്കപ്പെട്ടവർ’ അല്ലെങ്കിൽ ‘ദൂതന്മാർ’
  rationale: മർക്കോസിലെ ഈ സന്ദർഭത്തിൽ ദൗത്യത്തിനയയ്ക്കപ്പെട്ട പന്ത്രണ്ടുപേരുടെ പ്രത്യേക പങ്ക് സൂചിപ്പിക്കുന്ന അംഗീകൃത പദമാണിത്; പൊതുവായ അർഥത്തിലേക്ക് മാറ്റുന്നത് ആ സൂചന മങ്ങിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ രണ്ട് καί ബന്ധങ്ങളെ ഒരു നീണ്ട വാക്യമായി ഭാരപ്പെടുത്താതെ, അർഥബന്ധം നിലനിർത്തി രണ്ട് വാക്യങ്ങളാക്കി.
