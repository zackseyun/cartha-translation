reference: Mark 6:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: ml
  text: ഹെരോദാവ് യോഹന്നാനെ ഭയപ്പെട്ടിരുന്നു. യോഹന്നാൻ നീതിമാനും വിശുദ്ധനുമായ ഒരു മനുഷ്യനാണെന്ന് അറിഞ്ഞിരുന്നതിനാൽ അവൻ യോഹന്നാനെ കാത്തുസൂക്ഷിച്ചിരുന്നു. അവനെ കേൾക്കുമ്പോൾ അവൻ വളരെ ആശയക്കുഴപ്പത്തിലാകുമായിരുന്നു[a]; എന്നിട്ടും അവനെ സന്തോഷത്തോടെ കേൾക്കുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അവൻ വളരെ ആശയക്കുഴപ്പത്തിലാകുമായിരുന്നു’ എന്നതിനുപകരം ‘അവൻ പല കാര്യങ്ങളും ചെയ്യുമായിരുന്നു’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: ഭയപ്പെട്ടിരുന്നു
  rationale: അപൂർണകാലക്രിയ ഹെരോദാവിന് യോഹന്നാനോടുണ്ടായിരുന്ന തുടർച്ചയായ ഭയഭാവം സൂചിപ്പിക്കുന്നു. ആദരം എന്ന മൃദുവായ അർഥത്തിലേക്ക് ചുരുക്കാതെ മൂലപദത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു.
- source_word: εἰδὼς
  choice: അറിഞ്ഞിരുന്നതിനാൽ
  rationale: കർത്തൃവാചക പങ്കുപദത്തിന്റെ കാരണസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: നീതിമാനും വിശുദ്ധനുമായ ഒരു മനുഷ്യൻ
  rationale: δίκαιος എന്നതിന്റെ ധാർമിക നേരും ἅγιος എന്നതിന്റെ വിശുദ്ധസ്വഭാവവും വേർതിരിച്ചുതന്നെ നിലനിർത്തുന്നു.
- source_word: συνετήρει αὐτόν
  choice: അവൻ യോഹന്നാനെ സംരക്ഷിച്ചുപോന്നു
  rationale: സന്ദർഭത്തിൽ യോഹന്നാനെ ഉപദ്രവത്തിൽനിന്ന് കാത്തുസൂക്ഷിച്ചുവെന്ന അർഥമാണ് സ്വാഭാവികം; ആവർത്തിച്ചോ തുടർച്ചയായോ നടന്ന പ്രവൃത്തിയെ ‘സംരക്ഷിച്ചുപോന്നു’ പ്രകടമാക്കുന്നു.
- source_word: ἀκούσας αὐτοῦ
  choice: യോഹന്നാൻ പറയുന്നത് കേൾക്കുമ്പോൾ
  rationale: ഒരു വ്യക്തിയെ കേൾക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം ആ വ്യക്തിയുടെ വാക്കുകൾ കേൾക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πολλὰ ἠπόρει
  choice: വളരെ ആശയക്കുഴപ്പത്തിലായിരുന്നു
  rationale: SBLGNTയിലെ ἠπόρει എന്ന പാഠം അമ്പരപ്പും എന്തുചെയ്യണമെന്നറിയാത്ത അവസ്ഥയും സൂചിപ്പിക്കുന്നു; πολλὰ തീവ്രത നൽകുന്നു.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: സന്തോഷത്തോടെ അദ്ദേഹത്തെ കേട്ടിരുന്നു
  rationale: ἡδέως സൂചിപ്പിക്കുന്ന സന്തോഷത്തോടെയുള്ള സന്നദ്ധശ്രവണവും അപൂർണകാലത്തിന്റെ തുടർച്ചയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനെ കേട്ടശേഷമുള്ള ഹെരോദാവിന്റെ പ്രതികരണത്തെക്കുറിച്ചുള്ള പാഠഭേദം
  choice: SBLGNTയിലെ ἠπόρει അനുസരിച്ച് ‘വളരെ ആശയക്കുഴപ്പത്തിലായിരുന്നു’
  alternative: ἐποίει അനുസരിച്ച് ‘പല കാര്യങ്ങളും ചെയ്തിരുന്നു’
  rationale: വിമർശനാത്മക മൂലപാഠം ഹെരോദാവിന്റെ ഉള്ളിലെ സംഘർഷവും, അതിനിടയിലും യോഹന്നാനെ സന്തോഷത്തോടെ കേട്ടതുമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു. അർഥത്തെ ഗണ്യമായി മാറ്റുന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആവർത്തിക്കുന്ന സർവനാമങ്ങളിലെ അവ്യക്തത ഒഴിവാക്കാൻ ആവശ്യമായിടത്ത് ‘യോഹന്നാൻ’ ആവർത്തിച്ചു; അവസാനത്തിൽ ആദരസൂചകമായ ‘അദ്ദേഹത്തെ’ ഉപയോഗിച്ചത് സാധാരണ മലയാളപ്രയോഗത്തിനായി, ദൈവശാസ്ത്രപരമായ പദവിവ്യത്യാസം സൂചിപ്പിക്കാനല്ല.
