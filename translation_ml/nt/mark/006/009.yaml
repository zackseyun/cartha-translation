  text: ἀλλὰ ὑποδεδεμένους σανδάλια, καὶ μὴ ⸀ἐνδύσησθε δύο χιτῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/009.yaml
  text: but wear sandals[a], and do not put on two tunics.
translation:
  language: ml
  text: എന്നാൽ ചെരിപ്പുകൾ ധരിച്ചിരിക്കണം; രണ്ട് അങ്കികൾ എടുത്തണിയരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രണ്ട് അങ്കികൾ ധരിച്ചിരിക്കരുത്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയെ വസ്ത്രം എടുത്തണിയുന്ന പ്രവൃത്തിയായോ അത് ധരിച്ചിരിക്കുന്ന അവസ്ഥയായോ മനസ്സിലാക്കാം; മൂലപാഠത്തിലെ ക്രിയാപ്രവൃത്തിയോട് കൂടുതൽ അടുത്തുനിൽക്കുന്നതാണ് പ്രധാന പാഠം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻപുള്ള യാത്രാനിർദേശങ്ങളോടുള്ള വൈരുധ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ὑποδεδεμένους
  choice: ചെരിപ്പു ധരിച്ചിരിക്കണം
  rationale: ὑποδέομαι എന്ന ക്രിയയുടെ പൂർണകാല കർമണി/മധ്യ പങ്കാളിത്തരൂപം ചെരിപ്പണിഞ്ഞിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ആജ്ഞാസ്വഭാവമുള്ളതാണ്.
- source_word: σανδάλια
  choice: ചെരിപ്പു
  rationale: പുരാതനകാലത്തെ കാൽച്ചെരിപ്പിനെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക മലയാളപദം; ‘സാൻഡൽ’ എന്ന അനാവശ്യ ലിപ്യന്തരണം ഒഴിവാക്കുന്നു.
- source_word: μὴ ἐνδύσησθε
  choice: എടുത്തണിയരുത്
  rationale: μή ചേർന്ന aorist middle subjunctive നിരോധനത്തെ സൂചിപ്പിക്കുന്നു. വസ്ത്രം ധരിക്കുന്ന പ്രവൃത്തിയെ ‘എടുത്തണിയരുത്’ അടുത്തായി നിലനിർത്തുന്നു.
- source_word: δύο
  choice: രണ്ട്
  rationale: സംഖ്യ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: χιτῶνας
  choice: അങ്കികൾ
  rationale: ശരീരത്തോടു ചേർന്ന് ധരിച്ചിരുന്ന അടിസ്ഥാനവസ്ത്രമായ χιτών എന്നതിന്റെ ചരിത്രപരമായ അർഥം ‘ഷർട്ടുകൾ’ എന്ന കാലവിരുദ്ധമായ പദത്തേക്കാൾ കൃത്യമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. പുരാതന വസ്ത്രത്തെ സൂചിപ്പിക്കാൻ വ്യക്തവും പരിചിതവുമായ ‘അങ്കി’ തിരഞ്ഞെടുത്തു; വാക്യത്തിന്റെ ചുരുക്കവും നിർദേശസ്വഭാവവും നിലനിർത്തി.
