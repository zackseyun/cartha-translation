source:
  edition: SBLGNT
  text: καὶ ⸀ἐθαύμαζεν διὰ τὴν ἀπιστίαν αὐτῶν. Καὶ περιῆγεν τὰς κώμας κύκλῳ διδάσκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: ml
  text: അവരുടെ അവിശ്വാസം നിമിത്തം അവൻ ആശ്ചര്യപ്പെട്ടു.[a] പിന്നെ അവൻ ചുറ്റുമുള്ള ഗ്രാമങ്ങളിലൂടെ സഞ്ചരിച്ചുകൊണ്ട് ഉപദേശിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ അവിശ്വാസം നിമിത്തം അവൻ വിസ്മയിച്ചു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവൻ ഗ്രാമങ്ങൾതോറും ചുറ്റിസഞ്ചരിച്ച് ഉപദേശിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: ആശ്ചര്യപ്പെട്ടു
  rationale: θαυμάζωയുടെ വിസ്മയം/ആശ്ചര്യം എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. അപൂർണ്ണ ഭൂതകാലത്തിന്റെ ദൈർഘ്യഭാവം മലയാളത്തിൽ സന്ദർഭം വഹിക്കുന്നു; ഭാരമുള്ള കൃത്രിമ പ്രയോഗം ഒഴിവാക്കി.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: അവരുടെ അവിശ്വാസം നിമിത്തം
  rationale: Accusative-നോടുകൂടിയ διά ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു. ἀπιστίαയെ വിശ്വാസത്തിന്റെ വെറും ദൗർബല്യമായി മൃദൂകരിക്കാതെ ‘അവിശ്വാസം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: περιῆγεν
  choice: സഞ്ചരിച്ച് ... കൊണ്ടിരുന്നു
  rationale: περιάγωയുടെ സ്ഥലത്തുനിന്ന് സ്ഥലത്തേക്കുള്ള സഞ്ചാരവും imperfect രൂപത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവവും ചേർത്ത് പ്രകടമാക്കുന്നു.
- source_word: τὰς κώμας
  choice: ഗ്രാമങ്ങളിൽ
  rationale: κώμηയുടെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം ‘ഗ്രാമം’ ആണ്.
- source_word: κύκλῳ
  choice: ചുറ്റുമുള്ള
  rationale: അടുത്തുള്ള പ്രദേശങ്ങളിലൂടെയോ ഒരു ചുറ്റുപാതയിലൂടെയോ നീങ്ങുന്ന κύκλῳയുടെ സ്ഥലപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സാധ്യതയുള്ള ‘ചുറ്റിസഞ്ചരിച്ച്’ എന്ന വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: διδάσκων
  choice: ഉപദേശിച്ചുകൊണ്ടിരുന്നു
  rationale: വർത്തമാന കൃന്തത്തിന്റെ മുഖ്യക്രിയയോടൊപ്പമുള്ള തുടരുന്ന പ്രവർത്തനം മലയാളത്തിലെ ‘കൊണ്ടിരുന്നു’ ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശു അവരുടെ അവിശ്വാസത്തിൽ ആശ്ചര്യപ്പെട്ടുവെന്ന പ്രസ്താവന ദൈവശാസ്ത്രപരമായി മൃദൂകരിക്കണമോ
  choice: അവരുടെ അവിശ്വാസം നിമിത്തം അവൻ ആശ്ചര്യപ്പെട്ടു
  alternative: അവരുടെ അവിശ്വാസം കണ്ട് അവൻ വിസ്മയിച്ചു
  rationale: യേശുവിന്റെ പ്രതികരണത്തെക്കുറിച്ചുള്ള വാചകത്തിന്റെ നേരിട്ടുള്ള വിവരണം സംരക്ഷിക്കുന്നു. അജ്ഞതയെയോ അതിന്റെ വിരുദ്ധമായ ദൈവശാസ്ത്ര വിശദീകരണങ്ങളെയോ പരിഭാഷയിൽ ചേർക്കാതെ, മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നിമിത്തം’ കാരണബന്ധം കൃത്യമായി നിലനിർത്തുന്നു; ‘ഉപദേശിക്കുക’ ഇവിടെ പൊതുജനങ്ങൾക്ക് ഗ്രഹിക്കാവുന്ന ബൈബിൾപരമായ പഠിപ്പിക്കൽഭാവം നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
