translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. “വള്ളം,” “മറുകര,” “പറഞ്ഞയച്ചു” എന്നീ സാധാരണ പദങ്ങൾ ഉപയോഗിച്ചു. സ്ഥലനാമം ബേത്ത്സയിദ എന്നു ലിപ്യന്തരിച്ചു. ഗ്രീക്കിലെ ദിശ/ലക്ഷ്യസ്ഥാനം സംബന്ധിച്ച അർഥവ്യാപ്തിയും ἕως + വർത്തമാനകാലക്രിയയുടെ കാലബന്ധവും അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
