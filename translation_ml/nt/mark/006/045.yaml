reference: Mark 6:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: ml
  text: ഉടനെതന്നെ, അവൻ തന്റെ ശിഷ്യന്മാരെ വള്ളത്തിൽ കയറി തനിക്കുമുമ്പേ മറുകരയിലേക്കു, ബേത്ത്സയിദയുടെ ദിശയിൽ[a], പോകാൻ നിർബന്ധിച്ചു; അവൻതന്നെ ജനക്കൂട്ടത്തെ പറഞ്ഞയക്കുന്നതുവരെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബേത്ത്സയിദയിലേക്കു.” ഗ്രീക്കിലെ മുൻപ്രത്യയം പൊതുവായി ദിശയെയോ കൂടുതൽ നിർദിഷ്ടമായി ലക്ഷ്യസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ, “അവൻതന്നെ ജനക്കൂട്ടത്തെ പറഞ്ഞയക്കുന്നതുവരെ.” കാലസൂചക ഉപവാക്യത്തിലെ ക്രിയ വർത്തമാനകാലത്തിലാണ്; മലയാളത്തിൽ “പറഞ്ഞയക്കുന്നതുവരെ” എന്ന പ്രയോഗം ആ കാലബന്ധം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടനെതന്നെ
  rationale: മർക്കോസിന്റെ വിവരണത്തിലെ ദ്രുതഗതി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἠνάγκασεν
  choice: നിർബന്ധിച്ചു
  rationale: ശാരീരിക ബലപ്രയോഗം അനിവാര്യമായി സൂചിപ്പിക്കാതെ, ശക്തമായ സമ്മർദമോ നിർബന്ധമോ ഉള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരെ
  rationale: ഗുരു-ശിഷ്യബന്ധം വ്യക്തമാക്കുന്ന പതിവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: വള്ളത്തിൽ കയറി
  rationale: ഗലീലക്കടലിലെ ചെറുയാനത്തെ സൂചിപ്പിക്കാൻ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ പ്രയോഗം.
- source_word: προάγειν
  choice: തനിക്കുമുമ്പേ പോകാൻ
  rationale: ശിഷ്യന്മാർ യേശുവിനു മുമ്പായി പുറപ്പെടണം എന്ന ബന്ധപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: εἰς τὸ πέραν
  choice: മറുകരയിലേക്കു
  rationale: തടാകത്തിന്റെ എതിർവശത്തേക്കുള്ള കടന്നുപോകൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πρὸς Βηθσαϊδάν
  choice: ബേത്ത്സയിദയുടെ ദിശയിൽ
  rationale: πρός എന്നതിന്റെ ദിശാസൂചകത നിലനിർത്തുകയും ബേത്ത്സയിദയിൽ എത്തിച്ചേരുക തന്നെ നിർദിഷ്ട അന്തിമലക്ഷ്യമാണെന്ന് അതിയായി ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἕως
  choice: അതേസമയം
  rationale: ഈ സാഹചര്യത്തിൽ ശിഷ്യന്മാർ മുമ്പേ പോകുന്നതും യേശു ജനക്കൂട്ടത്തെ പറഞ്ഞയക്കുന്നതും തമ്മിലുള്ള കാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ ἕως എന്നതിന്റെ അക്ഷരാർഥപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: αὐτὸς
  choice: അവൻതന്നെ
  rationale: യേശു വ്യക്തിപരമായി പിന്നിൽ നിന്നു ജനക്കൂട്ടത്തെ പറഞ്ഞയച്ചുവെന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀπολύει τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തെ പറഞ്ഞയച്ചു
  rationale: സന്ദർഭത്തിലെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; വർത്തമാനകാല രൂപത്തിന്റെ സവിശേഷത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
