translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്തതയും സ്ഥലത്തിന്റെ ജനശൂന്യത സംബന്ധിച്ച അർഥവ്യാപ്തിയും സംരക്ഷിച്ചിട്ടുണ്ട്.
