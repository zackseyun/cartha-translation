  text: καὶ ἀπῆλθον ⸂ἐν τῷ πλοίῳ εἰς ἔρημον τόπον⸃ κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/032.yaml
  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: ml
  text: അവർ വള്ളത്തിൽ ഒരു വിജനസ്ഥലത്തേക്കു, മറ്റുള്ളവരിൽനിന്ന് വേറിട്ട്, പോയി[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനവാസമില്ലാത്ത ഒരു സ്ഥലത്തേക്ക്’ അല്ലെങ്കിൽ ‘ഒരു വനാന്തരസ്ഥലത്തേക്ക്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഏകാന്തമായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: പോയി
  rationale: മുമ്പുണ്ടായിരുന്ന സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലും തുടർന്നുള്ള സഞ്ചാരവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐν τῷ πλοίῳ
  choice: വള്ളത്തിൽ കയറി
  rationale: ഗലീലക്കടലിലെ ചെറുജലയാനത്തിന്റെ പശ്ചാത്തലത്തിൽ πλοῖον എന്നതിന് ‘വള്ളം’ യോജിക്കുന്നു; മലയാളത്തിൽ യാത്രാമാർഗം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘വള്ളത്തിൽ കയറി’ എന്നു നൽകി.
- source_word: εἰς ἔρημον τόπον
  choice: ഒരു വിജനസ്ഥലത്തേക്ക്
  rationale: ἔρημος ഇവിടെ മരുഭൂമി എന്ന നിർബന്ധിത ഭൂമിശാസ്ത്രാർഥത്തേക്കാൾ ജനവാസമില്ലാത്തതോ ഒറ്റപ്പെട്ടതോ ആയ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ‘വിജനസ്ഥലം’ ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: κατ’ ἰδίαν
  choice: തനിച്ചായി
  rationale: മറ്റുള്ളവരിൽനിന്ന് വേറിട്ട്, സ്വന്തം കൂട്ടമായി എന്ന ബഹുവചനസന്ദർഭത്തിലെ ആശയം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: καὶ
  choice: അവർ
  rationale: മലയാളത്തിലെ തുടർച്ചയായ ആഖ്യാനത്തിൽ വാക്യാരംഭത്തിലെ καί പ്രത്യേകം വിവർത്തനം ചെയ്യാതിരിക്കുന്നത് സ്വാഭാവികമാണ്; ബന്ധം വാക്യക്രമത്തിലൂടെ നിലനിൽക്കുന്നു.
