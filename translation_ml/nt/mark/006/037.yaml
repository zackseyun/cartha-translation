language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു: “നിങ്ങൾ തന്നെ അവർക്ക് കഴിക്കാൻ കൊടുക്കുക.” അവർ അവനോടു ചോദിച്ചു: “ഞങ്ങൾ പോയി ഇരുനൂറ് ദെനാരിക്ക് അപ്പം[a] വാങ്ങി അവർക്ക് കഴിക്കാൻ കൊടുക്കണമെന്നാണോ?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇരുനൂറ് ദെനാരിക്ക് അപ്പങ്ങൾ.” ἄρτους എന്ന ഗ്രീക്ക് പദത്തിന് “അപ്പം” എന്നും “അപ്പങ്ങൾ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഒരു ദെനാരി ഒരു തൊഴിലാളിയുടെയോ സൈനികന്റെയോ സാധാരണ ഒരു ദിവസത്തെ കൂലിയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ഇരട്ട ക്രിയാപ്രയോഗത്തിന്റെ മറുപടി എന്ന ഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Δότε
  choice: കൊടുക്കുക
  rationale: δίδωμι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ആജ്ഞാഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾതന്നെ
  rationale: വ്യക്തമായി ചേർത്തിരിക്കുന്ന സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: φαγεῖν
  choice: ഭക്ഷിക്കാൻ
  rationale: ‘അവർക്ക് ഭക്ഷിക്കാൻ കൊടുക്കുക’ എന്നത് മൂലത്തിലെ infinitive ഘടനയും അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἀπελθόντες
  choice: പോയി
  rationale: പ്രധാന ക്രിയയോട് അധീനമായ participle മലയാളത്തിൽ സ്വാഭാവികമായ തുടർക്രിയയായി നൽകുന്നു.
- source_word: ἀγοράσωμεν
  choice: വാങ്ങി ... കൊടുക്കണമെന്നാണോ
  rationale: ആലോചനാത്മകമായ subjunctive ചോദ്യത്തിന്റെ ഭാവം—‘അങ്ങനെ ചെയ്യണമെന്നാണോ?’—വ്യക്തമായി നൽകുന്നു.
- source_word: δηναρίων διακοσίων
  choice: ഇരുനൂറ് ദെനാരിക്ക്
  rationale: വില സൂചിപ്പിക്കുന്ന genitive ഘടനയെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἄρτους
  choice: അപ്പം
  rationale: ἄρτος എന്നത് പൊതുവായി അപ്പത്തെയോ പ്രത്യേക അപ്പങ്ങളെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘അപ്പം’ ഉപയോഗിച്ച് ‘അപ്പങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: അവർക്ക് ഭക്ഷിക്കാൻ കൊടുക്കുക
  rationale: യേശുവിന്റെ ആജ്ഞയിലെ ‘കൊടുക്കുക’ എന്ന ക്രിയയോടുള്ള വാചകസമാന്തര്യം നിലനിർത്തുകയും ‘പോഷിപ്പിക്കുക’ എന്ന വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ശിഷ്യന്മാരുടെ ചോദ്യത്തിലെ അതിശയവും എതിർപ്പിന്റെ സൂചനയും അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ ‘കൊടുക്കണമെന്നാണോ?’ എന്ന രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
