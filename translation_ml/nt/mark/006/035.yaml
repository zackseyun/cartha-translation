source:
  edition: SBLGNT
  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: ml
  text: 'നേരം ഇതിനകം വളരെ വൈകിയപ്പോൾ, അവന്റെ ശിഷ്യന്മാർ അവന്റെ അടുത്തുവന്ന് പറഞ്ഞു: “ഇത് ഒരു വിജനസ്ഥലമാണ്; നേരവും ഇതിനകം വളരെ വൈകിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: ഇതിനകം
  rationale: സമയം മുന്നേറിക്കഴിഞ്ഞുവെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; രണ്ടാമത്തെ പ്രയോഗത്തിൽ ഇത് നേരിട്ട് നിലനിർത്തി.
- source_word: ὥρας πολλῆς γενομένης
  choice: നേരം വളരെ വൈകിയപ്പോൾ
  rationale: സമയം ഏറെ വൈകിയതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് genitive absolute പ്രയോഗത്തിന്റെ സ്വാഭാവികവും അർഥനിഷ്ഠവുമായ മലയാളരൂപം.
- source_word: προσελθόντες αὐτῷ
  choice: അവന്റെ അടുത്തുവന്ന്
  rationale: ശിഷ്യന്മാർ യേശുവിനെ സമീപിച്ചതിനെ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: ἔλεγον
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ imperfect രൂപം പ്രസംഗത്തിന്റെ പശ്ചാത്തലഗതിയെ സൂചിപ്പിക്കാമെങ്കിലും, ഒറ്റ പ്രസ്താവന അവതരിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക കഥനരൂപമായ ‘പറഞ്ഞു’ ഉപയോഗിച്ചു; ആവർത്തനം അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: ഇത് ഒരു വിജനസ്ഥലമാണ്
  rationale: ἔρημος എന്നത് ഇവിടെ ജനവാസമില്ലാത്തതോ ഒറ്റപ്പെട്ടതോ ആയ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ‘വിജനസ്ഥലം’ ഈ ഭൗമസാഹചര്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καὶ ἤδη ὥρα πολλή
  choice: നേരവും ഇതിനകം വളരെ വൈകിയിരിക്കുന്നു
  rationale: ദിവസസമയം ഏറെ മുന്നേറിക്കഴിഞ്ഞുവെന്ന ആവർത്തിച്ച ഊന്നൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
