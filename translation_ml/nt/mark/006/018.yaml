  to: 'എന്തെന്നാൽ, യോഹന്നാൻ ഹെരോദാവിനോട് പറഞ്ഞുകൊണ്ടിരുന്നു: “നിന്റെ സഹോദരന്റെ ഭാര്യയെ നിന്റെ ഭാര്യയായി സ്വീകരിച്ചിരിക്കുന്നത് നിനക്കു നിയമാനുസൃതമല്ല.”[a]'
