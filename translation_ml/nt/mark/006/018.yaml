source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: ml
  text: 'എന്തെന്നാൽ, യോഹന്നാൻ ഹെരോദാവിനോട് പറഞ്ഞുകൊണ്ടിരുന്നു: “നിന്റെ സഹോദരന്റെ ഭാര്യയെ നിന്റെ ഭാര്യയായി സ്വീകരിച്ചിരിക്കുന്നത് നിനക്കു നിയമാനുസൃതമല്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിന്റെ സഹോദരന്റെ ഭാര്യയെ നിന്റെ ഭാര്യയായി സ്വീകരിച്ചിരിക്കുന്നത് നിനക്കു അനുവദനീയമല്ല.”
    reason: ἔξεστιν എന്ന പദത്തിന് നിയമസാധുതയെയും അനുവാദത്തെയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ യഥാർഥമായ പദവികൽപം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം മുൻകാലത്ത് തുടർന്നതോ ആവർത്തിച്ചതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ദൈർഘ്യസ്വഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തെ വിശദീകരിക്കുന്ന ബന്ധകത്തിന്റെ കാരണാത്മക-വിശദീകരണ ബലം വ്യക്തമായി നൽകുന്നു.
- source_word: Ἡρῴδῃ
  choice: ഹെരോദാവിനോട്
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ദത്തിവിഭക്തിയുടെ പ്രസംഗസ്വഭാവത്തിന് യോജിച്ച വിധത്തിൽ നൽകി.
- source_word: Οὐκ ἔξεστίν σοι
  choice: നീ ... നിയമാനുസൃതമല്ല
  rationale: അനുവദനീയമോ നിയമവിധേയമോ ആയതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ ധാർമിക-നിയമപരമായ ശക്തി നിലനിർത്തുന്നു; വാക്യത്തിൽ ഇല്ലാത്ത മോശൈകനിയമ പരാമർശം ചേർക്കുന്നില്ല.
- source_word: ἔχειν
  choice: സ്വന്തമാക്കുന്നത്
  rationale: അക്ഷരാർഥത്തിലെ ‘ഉണ്ടായിരിക്കുക/കൈവശംവെക്കുക’ എന്ന ആശയം വിവാഹബന്ധത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും കൈവശാവകാശമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: γυναῖκα
  choice: ഭാര്യയെ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമുണ്ടെങ്കിലും ‘നിന്റെ സഹോദരന്റെ’ എന്ന ബന്ധം ഇവിടെ വിവാഹാർഥം നിർണ്ണയിക്കുന്നു.
- source_word: τοῦ ἀδελφοῦ σου
  choice: നിന്റെ സഹോദരന്റെ
  rationale: കുറ്റപ്പെടുത്തലിന്റെ കേന്ദ്രമായ കുടുംബബന്ധം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ ശാസനയുടെ സ്വഭാവം
  choice: “നിയമാനുസൃതമല്ല” എന്ന ധാർമിക-നിയമപരമായ നിരോധനം
  alternative: “അനുവദനീയമല്ല” അല്ലെങ്കിൽ “ശരിയല്ല”
  rationale: ἔξεστιν അനുവദനീയതയെയും നിയമസാധുതയെയും കുറിക്കുന്നു. ലേവ്യനിയമങ്ങളുടെ പശ്ചാത്തലം സാധ്യതയുള്ളതായിരുന്നാലും വാക്യം അതിനെ തുറന്ന് ഉദ്ധരിക്കുന്നില്ല; അതിനാൽ നിയമപരമായ ബലം നിലനിർത്തി വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നത് അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാസ്വഭാവം നിലനിർത്തുന്നു. ‘നിയമാനുസൃതമല്ല’ എന്നത് പ്രവാചകശാസനയുടെ ധാർമിക-നിയമപരമായ ഗൗരവം സൂക്ഷിക്കുന്നു.
