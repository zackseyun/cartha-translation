id: MRK.6.15
reference: Mark 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: ml
  text: എന്നാൽ മറ്റുചിലർ, “അവൻ ഏലിയാവാണ്” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു. മറ്റുചിലർ, “അവൻ പ്രവാചകന്മാരിൽ ഒരാളെപ്പോലെയുള്ള ഒരു പ്രവാചകനാണ്[a]” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സാധ്യത കുറവാണെങ്കിലും, ഒരു പ്രത്യേക അന്ത്യകാല വ്യക്തിയെ ഉദ്ദേശിക്കുന്നതായി എടുത്താൽ “ആ പ്രവാചകനാണ്” എന്നും വിവർത്തനം ചെയ്യാം. എന്നാൽ തുടർന്ന് “പ്രവാചകന്മാരിൽ ഒരാളെപ്പോലെയുള്ള” എന്നു വരുന്നതിനാൽ ഇവിടെ ഗ്രീക്കിന് സ്വാഭാവികമായി “ഒരു പ്രവാചകനാണ്” എന്ന അർഥമാണ് ഉള്ളത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: എന്നാൽ മറ്റു ചിലർ / വേറെ ചിലരോ
  rationale: ἄλλοι വ്യത്യസ്ത ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; δέയുടെ മൃദുവായ വൈരുധ്യവും തുടർച്ചയും സ്വാഭാവികമായ മലയാളത്തിൽ ഈ പ്രയോഗങ്ങൾ നിലനിർത്തുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്നോ ആവർത്തിച്ചിരുന്നോ ആയ സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: “അവൻ ഏലിയാവാണ്”
  rationale: സംസാരക്രിയയ്ക്കുശേഷമുള്ള നേരിട്ടുള്ള ഉദ്ധരണി മലയാളത്തിൽ സ്വാഭാവികമാണ്; Ἠλίας എന്ന പേര് ഏലിയാവ് എന്നു നൽകി.
- source_word: προφήτης
  choice: ഒരു പ്രവാചകൻ
  rationale: ആർട്ടിക്കിൾ ഇല്ലാത്ത ഈ നാമപ്രയോഗവും പിന്നാലെയുള്ള താരതമ്യവാക്യവും ഇവിടെ പൊതുവായ അർഥത്തിലുള്ള ഒരു പ്രവാചകനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ὡς εἷς τῶν προφητῶν
  choice: പ്രവാചകന്മാരിൽ ഒരാളെപ്പോലെയുള്ള
  rationale: ὡς താരതമ്യം പ്രകടിപ്പിക്കുന്നു; പ്രവാചകന്മാരിൽ ഒരാളോടുള്ള സാദൃശ്യം ഈ രൂപം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: προφήτης എന്നത് പൊതുവായ ‘ഒരു പ്രവാചകൻ’ എന്നോ പ്രത്യേക അന്ത്യകാലപദവിയായ ‘ആ പ്രവാചകൻ’ എന്നോ വിവർത്തനം ചെയ്യണോ
  choice: ഒരു പ്രവാചകൻ
  alternative: ആ പ്രവാചകൻ
  rationale: ഗ്രീക്കിൽ ആർട്ടിക്കിൾ ഇല്ലാത്തതും ഉടനെ ὡς εἷς τῶν προφητῶν (‘പ്രവാചകന്മാരിൽ ഒരാളെപ്പോലെ’) എന്നു വിശദീകരിക്കുന്നതും പൊതുവായ പ്രവാചകതിരിച്ചറിയലിനാണ് കൂടുതൽ പിന്തുണ നൽകുന്നത്; സാധ്യത കുറഞ്ഞ മറ്റേ വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. തുടർച്ചയായ ജനാഭിപ്രായറിപ്പോർട്ടിനെ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നു നൽകി; രണ്ട് വ്യത്യസ്ത കൂട്ടങ്ങളെ ‘മറ്റു ചിലർ’ എന്നും ‘വേറെ ചിലരോ’ എന്നും തിരിച്ചറിവോടെ അവതരിപ്പിച്ചു.
