revisions:
- from: 'അവൾ ഉടനെ തിടുക്കത്തിൽ രാജാവിന്റെ അടുക്കൽ ചെന്ന് ചോദിച്ചു: “സ്നാപകനായ യോഹന്നാന്റെ തല ഇപ്പോൾത്തന്നെ ഒരു തളികയിൽ എനിക്കു തരണമെന്നാണ് എനിക്കു വേണ്ടത്.”'
  to: 'അവൾ ഉടനെ തിടുക്കത്തോടെ രാജാവിന്റെ സന്നിധിയിലേക്കു കടന്നുചെന്ന് ചോദിച്ചു: “സ്നാപകനായ യോഹന്നാന്റെ തല ഒരു തളികയിൽ ഇപ്പോൾത്തന്നെ എനിക്കു തരണം.”'
  rationale: ‘രാജാവിന്റെ സന്നിധിയിലേക്കു കടന്നുചെന്ന്’ preserves both the entry denoted by εἰσελθοῦσα and her movement toward the king. ‘എനിക്കു തരണം’ gives the direct, insistent force of Θέλω ἵνα ... δῷς μοι. ‘ഉടനെ’ and ‘ഇപ്പോൾത്തന്നെ’ retain the source text's separate indications of immediacy.
