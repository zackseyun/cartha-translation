id: MRK.6.25
reference: Mark 6:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: ml
  text: 'അവൾ ഉടനെ തിടുക്കത്തോടെ രാജാവിന്റെ സന്നിധിയിലേക്കു കടന്നുചെന്ന് ചോദിച്ചു: “സ്നാപകനായ യോഹന്നാന്റെ തല ഒരു തളികയിൽ ഇപ്പോൾത്തന്നെ എനിക്കു തരണം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: അടുക്കൽ ചെന്ന്
  rationale: രാജാവിന്റെ സന്നിധിയിലേക്കുള്ള അവളുടെ പ്രവേശനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള πρὸς τὸν βασιλέα എന്ന ഘടകവുമായി ചേർത്താണ് പരിഭാഷപ്പെടുത്തിയത്.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ ആഖ്യാനത്തിലെ അടിയന്തരതയും പ്രവർത്തനത്തിന്റെ തൽക്ഷണതയും നിലനിർത്തുന്നു.
- source_word: μετὰ σπουδῆς
  choice: തിടുക്കത്തിൽ
  rationale: വേഗത്തോടെയും അടിയന്തരതയോടെയും അവൾ ചെന്നുവെന്ന ആശയം നൽകുന്നു; സന്തോഷപൂർവമായ ഉത്സാഹം അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: βασιλέα
  choice: രാജാവ്
  rationale: ഹെരോദാവിന്റെ ഔദ്യോഗിക ചരിത്രപദവി എന്തായിരുന്നാലും മൂലപാഠത്തിലെ βασιλεύς എന്ന പദം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ᾐτήσατο
  choice: ചോദിച്ചു
  rationale: αἰτέω എന്ന ക്രിയയുടെ അഭ്യർഥനാസ്വഭാവം അതിശയോക്തിയില്ലാതെ നൽകുന്നു; ആവശ്യത്തിന്റെ കടുപ്പം ഉദ്ധരിച്ച വാക്കുകളിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: Θέλω
  choice: എനിക്കു വേണ്ടത്
  rationale: θέλω സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ഇച്ഛയെ ഔപചാരികവും മൃദുവുമായ ‘ഞാൻ ആഗ്രഹിക്കുന്നു’ എന്നതിനേക്കാൾ തുറന്ന ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα ... δῷς μοι
  choice: എനിക്കു തരണമെന്നാണ്
  rationale: അവൾക്കു വേണ്ടത് എന്താണെന്നു വിശദീകരിക്കുന്ന ἵνα-വാക്യത്തിന്റെ ഉള്ളടക്കം സ്വാഭാവികമായ മലയാളഘടനയിൽ നൽകുന്നു.
- source_word: ἐξαυτῆς
  choice: ഇപ്പോൾത്തന്നെ
  rationale: ആവശ്യം ഉടൻ നിറവേറ്റണമെന്ന ശക്തമായ സമയസൂചന നിലനിർത്തുന്നു; മുമ്പുള്ള εὐθὺς എന്നതിൽനിന്ന് ഇതിനെ വേർതിരിച്ചും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐπὶ πίνακι
  choice: ഒരു തളികയിൽ
  rationale: വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ πίναξ സൂചിപ്പിക്കുന്ന വിളമ്പാനുള്ള പരന്ന പാത്രത്തിന് സ്വാഭാവികമായ മലയാളപദം.
- source_word: κεφαλὴν
  choice: തല
  rationale: ആഖ്യാനത്തിന്റെ ഭീകരമായ വ്യക്തത മയപ്പെടുത്താതെ മൂലപദം നേരിട്ട് നൽകുന്നു.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: സ്നാപകനായ യോഹന്നാന്റെ
  rationale: βαπτιστής എന്ന വിശേഷണത്തിന്റെ പ്രവർത്തനപരമായ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: Ἰωάννου τοῦ βαπτιστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: സ്നാപകനായ യോഹന്നാൻ
  alternative: സ്നാപക യോഹന്നാൻ
  rationale: βαπτιστής എന്നത് യോഹന്നാന്റെ പ്രവർത്തനത്തെ വിവരിക്കുന്ന പദമാണ്. പ്രധാനപാഠത്തിലെ രൂപം അതിന്റെ വിവരണാത്മക സ്വഭാവം വ്യക്തമാക്കുന്നു; പരമ്പരാഗതമായ സംക്ഷിപ്തരൂപവും അർഥപരമായി സാധുവാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. εὐθὺς, ἐξαυτῆς എന്നീ രണ്ടു വ്യത്യസ്ത അടിയന്തരതാസൂചനകളും യഥാക്രമം ‘ഉടനെ’, ‘ഇപ്പോൾത്തന്നെ’ എന്നു നിലനിർത്തിയിരിക്കുന്നു. പെൺകുട്ടിയുടെ വാക്കുകളിലെ നേരിട്ടുള്ളതും കടുപ്പവും മയപ്പെടുത്താതിരിക്കാൻ ‘എനിക്കു വേണ്ടത്’ എന്ന പ്രയോഗം തിരഞ്ഞെടുത്തു.
