id: MRK.6.56
reference: Mark 6:56
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: ml
  text: അവൻ ഗ്രാമങ്ങളിലോ പട്ടണങ്ങളിലോ നാട്ടിൻപുറങ്ങളിലോ എവിടെ ചെന്നാലും, ആളുകൾ രോഗികളെ ചന്തസ്ഥലങ്ങളിൽ കിടത്തി, അവന്റെ വസ്ത്രത്തിന്റെ അറ്റത്തെങ്കിലും[a] തൊടാൻ കഴിയണമെന്നു അവനോട് യാചിച്ചു. അവനെ തൊട്ടവരെല്ലാം സൗഖ്യം പ്രാപിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വസ്ത്രത്തിന്റെ കര’ അല്ലെങ്കിൽ ‘വസ്ത്രത്തിലെ തൊങ്ങൽ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം വസ്ത്രത്തിന്റെ അറ്റത്തെയോ കരയെയോ സൂചിപ്പിക്കാം; യഹൂദസന്ദർഭത്തിൽ വസ്ത്രത്തിലെ തൊങ്ങലിനെയും ഓർമിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘രക്ഷിക്കപ്പെട്ടു’. ഇവിടെ രോഗികളുടെ ശാരീരിക സൗഖ്യത്തെയോ പുനഃസ്ഥാപനത്തെയോ ആണ് ക്രിയ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν
  choice: എവിടെ ചെന്നാലും
  rationale: ὅπου ἄν നൽകുന്ന അനിശ്ചിതവും പൊതുവ്യാപകവുമായ ആവർത്തനാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: κώμας ἢ πόλεις ἢ ἀγρούς
  choice: ഗ്രാമങ്ങളിലോ പട്ടണങ്ങളിലോ നാട്ടിൻപുറങ്ങളിലോ
  rationale: κώμαι, πόλεις, ἀγροί എന്നിവ യഥാക്രമം ഗ്രാമങ്ങൾ, പട്ടണങ്ങൾ/നഗരങ്ങൾ, ഗ്രാമീണ പ്രദേശങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ἀγρούς ഒറ്റപ്പെട്ട വയലുകളേക്കാൾ നാട്ടിൻപുറങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ചന്തസ്ഥലങ്ങളിൽ
  rationale: ἀγορά ചന്തയെയോ പൊതുചത്വരത്തെയോ സൂചിപ്പിക്കാം; രോഗികളെ പൊതുവായി കിടത്തിയിരുന്ന ഇടം എന്ന സാഹചര്യത്തിൽ ‘ചന്തസ്ഥലങ്ങൾ’ വ്യക്തമാണ്.
- source_word: ἐτίθεσαν
  choice: കിടത്തുകയും
  rationale: അപൂർണകാല ക്രിയ ആവർത്തിച്ചിരുന്ന പതിവ് പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ‘എവിടെ ചെന്നാലും’ എന്ന ഘടനയോടൊപ്പം ഈ ആവർത്തനാർഥം മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: τοὺς ἀσθενοῦντας
  choice: രോഗികളെ
  rationale: ദുർബലരോ രോഗികളോ ആയവരെ സൂചിപ്പിക്കുന്ന പങ്കുപദത്തിന് സാഹചര്യാനുസൃതമായ ലളിതമായ രൂപം.
- source_word: παρεκάλουν
  choice: അപേക്ഷിക്കുകയും ചെയ്തു
  rationale: ഇവിടെ παρακαλέω സാധാരണ അഭ്യർഥനയേക്കാൾ earnest entreaty സൂചിപ്പിക്കുന്നു; ‘അപേക്ഷിച്ചു’ മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: അറ്റത്തെങ്കിലും തൊടാൻ കഴിയണമെന്നു
  rationale: κἄν നൽകുന്ന ‘എങ്കിലും/കുറഞ്ഞപക്ഷം’ എന്ന ഏറ്റവും ചെറിയ അഭ്യർഥനയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: അവന്റെ വസ്ത്രത്തിന്റെ അറ്റം
  rationale: κράσπεδον വസ്ത്രത്തിന്റെ അറ്റം, കര, അല്ലെങ്കിൽ തൊങ്ങൽ എന്നിവയെ സൂചിപ്പിക്കാം. പ്രധാനവാചകത്തിൽ ‘അറ്റം’ അമിതമായി നിർണയിക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἥψαντο αὐτοῦ
  choice: അവനെ തൊട്ടവരെല്ലാം
  rationale: ഗ്രീക്കിൽ αὐτοῦ എന്ന സർവനാമം നേരിട്ട് ‘അവനെ’ എന്നാണ്; മുൻവാക്യത്തിലെ വസ്ത്രത്തിന്റെ അറ്റം വഴി എങ്ങനെയാണ് തൊട്ടതെന്നത് സാഹചര്യത്തിൽ വ്യക്തമാണ്.
- source_word: ἐσῴζοντο
  choice: സൗഖ്യം പ്രാപിച്ചു
  rationale: σῴζω എന്നതിന് രക്ഷിക്കുക, വിടുവിക്കുക, സൗഖ്യമാക്കുക എന്നീ അർഥങ്ങളുണ്ട്. രോഗികളെക്കുറിച്ചുള്ള ഈ സാഹചര്യത്തിൽ ശാരീരിക സൗഖ്യമാണ് മുൻനിരയിൽ.
theological_decisions:
- issue: ἐσῴζοντο എന്ന σῴζω ക്രിയയുടെ വിവർത്തനം
  choice: സൗഖ്യം പ്രാപിച്ചു
  alternative: രക്ഷിക്കപ്പെട്ടു
  rationale: ക്രിയയ്ക്ക് വിപുലമായ ‘രക്ഷ’ അർഥപരിധിയുണ്ടെങ്കിലും ഉടനെയുള്ള സന്ദർഭം രോഗികളുടെ ശാരീരിക സൗഖ്യമാണ്. മുഖ്യവാചകം സന്ദർഭാർഥം നൽകുന്നു; അടിക്കുറിപ്പ് മൂലപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- issue: അവർ തൊട്ടത് യേശുവിനെയോ വസ്ത്രത്തിന്റെ അറ്റത്തെയോ
  choice: അവനെ തൊട്ടവരെല്ലാം
  alternative: അതിനെ തൊട്ടവരെല്ലാം
  rationale: അവസാന ഉപവാക്യത്തിലെ αὐτοῦ വ്യാകരണപരമായി ‘അവനെ’ എന്നു സൂചിപ്പിക്കുന്നു. മുൻവാക്യം വസ്ത്രത്തിന്റെ അറ്റം തൊടുന്നതിനെ വ്യക്തമാക്കുന്നതിനാൽ രണ്ടു ആശയങ്ങളും നിർബന്ധമായി ഒറ്റയാക്കാതെ മൂലവാചകത്തിന്റെ ഘടന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ചിരുന്ന പ്രവർത്തനം ‘എവിടെ ചെന്നാലും’ എന്ന ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി. ‘ചന്തസ്ഥലം’, ‘വസ്ത്രത്തിന്റെ അറ്റം’, ‘സൗഖ്യം പ്രാപിച്ചു’ തുടങ്ങിയ സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ള പദങ്ങൾ തിരഞ്ഞെടുത്തു.
