  terminology: ‘ചന്തസ്ഥലങ്ങൾ,’ ‘വസ്ത്രത്തിന്റെ അറ്റം,’ and ‘സൗഖ്യം പ്രാപിച്ചു’ are appropriate. The footnote responsibly preserves κράσπεδον's range and notes the contextual physical sense of ἐσῴζοντο without imposing a theological reading.
