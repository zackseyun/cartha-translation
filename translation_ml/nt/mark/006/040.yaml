  yaml_path: translation/nt/mark/006/040.yaml
  text: And they reclined in groups of hundreds and of fifties[a].
translation:
  language: ml
  text: അവർ നൂറുപേരും അമ്പതുപേരും വീതമുള്ള കൂട്ടങ്ങളായി[a] ഇരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘തോട്ടത്തിലെ തടങ്ങൾ, തടങ്ങൾ’; ക്രമമായി നിരത്തിയ വിഭാഗങ്ങളുടെ ചിത്രം ഈ പദപ്രയോഗം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπεσαν
  choice: ഇരുന്നു
  rationale: ഭക്ഷണത്തിനായി സ്ഥാനംപിടിച്ച് ചാരിയിരിക്കുക എന്ന സൂക്ഷ്മാർഥം ക്രിയയ്ക്കുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം ‘ഇരുന്നു’ എന്നാണ്.
- source_word: πρασιαὶ πρασιαὶ
  choice: കൂട്ടങ്ങളായി
  rationale: പദത്തിന്റെ അക്ഷരാർഥം തോട്ടത്തിലെ ചതുരപ്പാത്തികളെയോ തടങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ ക്രമമായി തിരിച്ചിരുന്ന ജനക്കൂട്ടങ്ങളെയാണ് രൂപകമായി വിവരിക്കുന്നത്. ആവർത്തനത്തിന്റെ വിതരണാർഥം ‘കൂട്ടങ്ങളായി’ എന്നതിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; മൂലചിത്രം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κατὰ ἑκατὸν
  choice: നൂറും ... വീതമുള്ള
  rationale: κατάയും സംഖ്യയും ചേർന്ന പ്രയോഗം വിതരണക്രമം സൂചിപ്പിക്കുന്നു. ‘വീതമുള്ള’ എന്നത് നൂറുപേർ അടങ്ങിയ കൂട്ടങ്ങൾ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατὰ πεντήκοντα
  choice: അമ്പതും വീതമുള്ള
  rationale: മുൻപത്തെ സംഖ്യയോടു സമാന്തരമായി, അമ്പതുപേർ വീതമുള്ള കൂട്ടങ്ങളെയും വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന സ്വീകരിച്ചു. ‘നൂറും അമ്പതും വീതമുള്ള’ എന്ന ഏകോപിത പ്രയോഗം നൂറുപേരുള്ളതും അമ്പതുപേരുള്ളതുമായ കൂട്ടങ്ങൾ എന്ന ഗ്രീക്ക് വിതരണാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
