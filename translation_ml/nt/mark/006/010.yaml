source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “നിങ്ങൾ എവിടെയെങ്കിലും ഒരു വീട്ടിൽ പ്രവേശിച്ചാൽ, അവിടെനിന്നു പുറപ്പെടുന്നതുവരെ[a] ആ വീട്ടിൽത്തന്നെ താമസിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആ സ്ഥലം വിട്ടുപോകുന്നതുവരെ.” ഗ്രീക്കിൽ അക്ഷരാർഥമായി “അവിടെനിന്നു പുറപ്പെടുന്നതുവരെ” എന്നാണ്; സന്ദർഭത്തിൽ ഇത് അവർ ശുശ്രൂഷിച്ചിരുന്ന പ്രദേശം വിട്ടുപോകുന്നതിനെ സൂചിപ്പിച്ചേക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ സംസാരത്തെ സൂചിപ്പിക്കാം; മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ὅπου ἐὰν
  choice: എവിടെയെങ്കിലും
  rationale: അനിശ്ചിത സ്ഥാനബന്ധമായ ‘wherever’ എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: ഒരു വീട്ടിൽ പ്രവേശിച്ചാൽ
  rationale: εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള പ്രവേശനദിശ മലയാളത്തിലെ ‘വീട്ടിൽ പ്രവേശിക്കുക’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: οἰκίαν
  choice: ഒരു വീട്
  rationale: ഇവിടെ മുഖ്യമായി താമസിക്കുന്ന ഭൗതിക വീടാണ് ഉദ്ദേശിക്കുന്നത്; ‘ഭവനം’ എന്നതിനെക്കാൾ ‘വീട്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: ἐκεῖ μένετε
  choice: ആ വീട്ടിൽത്തന്നെ താമസിക്കുക
  rationale: ‘അവിടെ തുടരുക’ എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും വീടുമാറരുതെന്ന സന്ദർഭസൂചന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: അവിടെനിന്നു പുറപ്പെടുന്നതുവരെ
  rationale: ഗ്രീക്കിലെ ἐκεῖθεν എന്ന ‘അവിടെനിന്ന്’ എന്ന രൂപം നേരിട്ട് നിലനിർത്തുന്നു; ഇത് വീടിനെയോ ആ പ്രദേശത്തെയോ സൂചിപ്പിക്കാമെന്ന യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐκεῖθεν എന്നതിന്റെ പരിധി
  choice: പ്രധാനവാക്യത്തിൽ ‘അവിടെനിന്നു പുറപ്പെടുന്നതുവരെ’ എന്ന അവ്യക്തമായ സ്ഥാനസൂചന നിലനിർത്തി.
  alternative: ‘ആ സ്ഥലം വിട്ടുപോകുന്നതുവരെ’ അല്ലെങ്കിൽ ‘ആ വീട്ടിൽനിന്നു പുറപ്പെടുന്നതുവരെ’.
  rationale: ദൗത്യസന്ദർഭത്തിൽ ഒരേ വീട്ടിൽ താമസിച്ച് ആ പ്രദേശം വിടുന്നതുവരെ അവിടെ തുടരുക എന്ന വായന യുക്തിസഹമാണ്. എങ്കിലും ഗ്രീക്ക് പദം സ്വതവേ ‘അവിടെനിന്ന്’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; അതിനാൽ ഒരു വ്യാഖ്യാനം മാത്രം മുഖ്യവാക്യത്തിൽ ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന രൂപം ആഖ്യാനത്തിലെ അപൂർണകാലഭാവം സംരക്ഷിക്കുന്നു; ἐκεῖθεν എന്നതിലെ സന്ദർഭപരമായ അവ്യക്തത അടിക്കുറിപ്പോടെ നിലനിർത്തുന്നു.
