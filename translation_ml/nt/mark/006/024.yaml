id: MRK.6.24
reference: Mark 6:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: ml
  text: 'അവൾ പുറത്തേക്കു പോയി തന്റെ അമ്മയോടു ചോദിച്ചു: “ഞാൻ എന്താണ് ആവശ്യപ്പെടേണ്ടത്?” അമ്മ മറുപടി പറഞ്ഞു: “സ്നാനം നൽകുന്ന യോഹന്നാന്റെ തല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്നാപകനായ യോഹന്നാന്റെ തല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: പുറത്തേക്കു പോയി
  rationale: പ്രധാനക്രിയയായ ‘ചോദിച്ചു’ എന്നതിനുമുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle ആണ്. മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാശൃംഖലയിലൂടെ സമയക്രമം വ്യക്തമാക്കുന്നു.
- source_word: Τί αἰτήσωμαι
  choice: ഞാൻ എന്താണ് ചോദിക്കേണ്ടത്?
  rationale: ആലോചനാത്മകമായ aorist middle subjunctive, എന്ത് അഭ്യർഥിക്കണം എന്ന ചോദ്യം പ്രകടിപ്പിക്കുന്നു. ‘ചോദിക്കേണ്ടത്’ ഈ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μητρὶ αὐτῆς
  choice: അമ്മയോട്
  rationale: സന്ദർഭത്തിൽ കർത്താവായ പെൺകുട്ടിയുടെ അമ്മയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘അവളുടെ അമ്മയോട്’ എന്ന ആവർത്തനത്തേക്കാൾ ‘അമ്മയോട്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: κεφαλήν
  choice: തല
  rationale: ആവശ്യപ്പെട്ട വസ്തുവിനെ ഗ്രീക്ക് മൂലപാഠം നേരിട്ടും ഭീകരത മറച്ചുവയ്ക്കാതെയും പറയുന്നു; അതേ വ്യക്തത നിലനിർത്തുന്നു.
- source_word: τοῦ βαπτίζοντος
  choice: സ്നാപകനായ
  rationale: വർത്തമാനകാല കർത്തൃവാചക participle യോഹന്നാനെ അദ്ദേഹത്തിന്റെ സ്നാനം നൽകുന്ന പ്രവർത്തനത്താൽ തിരിച്ചറിയിക്കുന്നു. ‘സ്നാപകൻ’ മലയാളത്തിലെ സ്ഥാപിതവും സംക്ഷിപ്തവുമായ പദമാണ്; അതിന്റെ പ്രവർത്തനപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ βαπτίζων എന്ന വിശേഷണത്തിന്റെ പരിഭാഷ
  choice: സ്നാപകനായ യോഹന്നാൻ
  alternative: സ്നാനം നൽകുന്ന യോഹന്നാൻ
  rationale: ഇത് ഒരു സഭാവിഭാഗത്തിന്റെ പേരല്ല, യോഹന്നാനെ അദ്ദേഹത്തിന്റെ സ്നാനം നൽകുന്ന പ്രവർത്തനത്താൽ തിരിച്ചറിയിക്കുന്ന participial epithet ആണ്. സ്ഥാപിതമായ മലയാള പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, മൂലപദത്തിന്റെ സുതാര്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. ഗ്രീക്കിലെ participial sequence മലയാളത്തിൽ ‘പുറത്തേക്കു പോയി … ചോദിച്ചു’ എന്ന ക്രിയാശൃംഖലയായി നൽകിയിരിക്കുന്നു. അമ്മയുടെ മറുപടിയിലെ ഞെട്ടിപ്പിക്കുന്ന നേരിട്ടുള്ള ഭാഷ മയപ്പെടുത്താതെ സംരക്ഷിച്ചിട്ടുണ്ട്.
