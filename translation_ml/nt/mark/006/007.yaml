- from: അവൻ പന്ത്രണ്ടുപേരെയും അടുക്കൽ വിളിച്ച് അവരെ ഈരണ്ടുപേരായി[a] അയയ്ക്കാൻ തുടങ്ങി; അശുദ്ധാത്മാക്കളുടെമേൽ അവൻ അവർക്ക് അധികാരം[b] നൽകിക്കൊണ്ടിരുന്നു.
