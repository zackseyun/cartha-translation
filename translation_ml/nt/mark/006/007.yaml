reference: Mark 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: ml
  text: അവൻ പന്ത്രണ്ടുപേരെയും തന്റെ അടുക്കലേക്കു വിളിച്ച്, അവരെ രണ്ടുപേരെ വീതം[a] അയയ്ക്കാൻ തുടങ്ങി; അശുദ്ധാത്മാക്കളുടെമേൽ അവൻ അവർക്ക് അധികാരം[b] നൽകിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജോഡികളായി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അശുദ്ധാത്മാക്കളുടെമേൽ ശക്തി.’
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεῖται
  choice: അടുക്കൽ വിളിച്ച്
  rationale: മദ്ധ്യമപ്രയോഗത്തിലെ ‘തന്റെ അടുക്കലേക്ക് വിളിക്കുക’ എന്ന സൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. മർക്കോസിന്റെ ചരിത്രവർത്തമാനം തുടർന്നുള്ള ഭൂതകാലക്രിയയോട് മലയാളത്തിൽ കൃത്രിമമായ കാലമാറ്റം സൃഷ്ടിക്കാതിരിക്കാൻ ഭൂതകാലസംബന്ധിയായ വിനയെച്ചമായി നൽകി.
- source_word: τοὺς δώδεκα
  choice: പന്ത്രണ്ടുപേരെയും
  rationale: യേശു തിരഞ്ഞെടുത്ത പന്ത്രണ്ടുപേരെന്ന അംഗീകൃത സംഘസൂചന സന്ദർഭത്തിൽ വ്യക്തമാണ്; ‘ശിഷ്യന്മാർ’ എന്ന പദം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: അയയ്ക്കാൻ തുടങ്ങി
  rationale: ἄρχομαι + അനന്തക്രിയയുടെ ആരംഭാർഥം സ്വാഭാവികമായി പകരുന്നു; ദൗത്യത്തിനായി അയയ്ക്കുന്നതെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: δύο δύο
  choice: ഈരണ്ടുപേരായി
  rationale: ആവർത്തിച്ച സംഖ്യയുടെ വിതരണാർഥം മലയാളത്തിലെ സ്വാഭാവികമായ പ്രയോഗത്തിലൂടെ പകരുന്നു.
- source_word: ἐδίδου
  choice: നൽകിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന/സമകാലികമായ പ്രവർത്തനഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: വെറും ശക്തിയേക്കാൾ ഏല്പിക്കപ്പെട്ട അവകാശവും അധികാരവും സൂചിപ്പിക്കുന്ന ἐξουσίαയുടെ അർഥത്തിന് യോജിക്കുന്നു.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: അശുദ്ധാത്മാക്കളുടെമേൽ
  rationale: മർക്കോസിന്റെ പദപ്രയോഗം വ്യാഖ്യാനാത്മകമായി ‘ഭൂതങ്ങൾ’ എന്നു ചുരുക്കാതെ നിലനിർത്തുന്നു; ജനിറ്റീവ് ഇവിടെ അധികാരം ചെലുത്തുന്ന വിഷയത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων എന്നതിൽ പന്ത്രണ്ടുപേർക്കു നൽകുന്നതിന്റെ സ്വഭാവം
  choice: അശുദ്ധാത്മാക്കളുടെമേലുള്ള ഏല്പിക്കപ്പെട്ട അധികാരം
  alternative: അശുദ്ധാത്മാക്കളുടെമേലുള്ള ശക്തി
  rationale: ‘അധികാരം’ എന്നത് യേശു അവരെ അധികാരപ്പെടുത്തി അയയ്ക്കുന്നതിന്റെ ബന്ധപരവും ഏല്പിക്കപ്പെട്ടതുമായ സ്വഭാവം ‘ശക്തി’ എന്നതിനെക്കാൾ കൃത്യമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഈരണ്ടുപേരായി’ എന്നത് മൂലത്തിലെ വിതരണാത്മക ആവർത്തനം ചുരുക്കമായും സ്വാഭാവികമായും പകരുന്നു; കാലവ്യത്യാസവും അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
