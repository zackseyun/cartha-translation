translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള καὶ മലയാളത്തിൽ അനാവശ്യമായി കൃത്രിമമാകാതെ തുടർച്ചയായ രണ്ട് വാക്യങ്ങളായി നൽകിയിരിക്കുന്നു. രണ്ടാം വാക്യത്തിൽ ‘അയാൾ’ കാവൽസേനാംഗത്തെയും ‘യോഹന്നാന്റെ’ എന്നത് ഇരയെയും വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
