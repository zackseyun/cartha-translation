source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀποστείλας ὁ βασιλεὺς σπεκουλάτορα ἐπέταξεν ⸀ἐνέγκαι τὴν κεφαλὴν αὐτοῦ. ⸀καὶ ἀπελθὼν ἀπεκεφάλισεν αὐτὸν ἐν τῇ φυλακῇ
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/027.yaml
  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: ml
  text: ഉടനെ രാജാവ് വധശിക്ഷ നടപ്പാക്കുന്ന ഒരു കാവൽക്കാരനെ[a] അയച്ച് യോഹന്നാന്റെ തല കൊണ്ടുവരാൻ കൽപ്പിച്ചു. അയാൾ പോയി തടവറയിൽ വെച്ച് യോഹന്നാന്റെ തല വെട്ടിമാറ്റി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കാവൽസേനാംഗം” അല്ലെങ്കിൽ “അംഗരക്ഷകൻ”; ഭരണാധികാരിയുടെ കാവൽസേനയിലെ ഒരംഗത്തെ സൂചിപ്പിക്കുന്ന ലത്തീൻ വായ്പാപദമാണ് ഗ്രീക്കിൽ ഉപയോഗിച്ചിരിക്കുന്നത്. ഇവിടെ അയാൾ വധശിക്ഷ നടപ്പാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ ആഖ്യാനത്തിലെ ത്വരിതത്വം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: βασιλεὺς
  choice: രാജാവ്
  rationale: ഹെരോദാവിന്റെ ഔദ്യോഗിക പദവി ചരിത്രപരമായി ചതുർഭരണാധികാരി ആയിരുന്നെങ്കിലും, മൂലപാഠത്തിലെ βασιλεύς എന്ന ആഖ്യാനനാമം അതേപടി നിലനിർത്തുന്നു.
- source_word: σπεκουλάτορα
  choice: വധനിർവാഹകനെ
  rationale: ഭരണാധികാരിയുടെ കാവൽസേനയിലെ ഒരംഗത്തെ സൂചിപ്പിക്കുന്ന ലത്തീൻ വായ്പാപദമാണിത്; ഈ സന്ദർഭത്തിൽ അയാൾ വധശിക്ഷ നടപ്പാക്കുന്നതിനാൽ പ്രധാന പാഠത്തിൽ പ്രവർത്തനപരമായ അർഥം നൽകി, പദത്തിന്റെ വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: കൊണ്ടുവരാൻ കല്പിച്ചു
  rationale: ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: യോഹന്നാന്റെ തല
  rationale: ഗ്രീക്കിൽ സർവനാമമാണെങ്കിലും മലയാളത്തിൽ ഉദ്ദേശിക്കപ്പെടുന്ന വ്യക്തിയെ വ്യക്തമായി പറയുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു; മുൻസന്ദർഭം യോഹന്നാനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπεκεφάλισεν
  choice: തല വെട്ടിമാറ്റി
  rationale: ശിരച്ഛേദം എന്ന പ്രവൃത്തിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും നേരിട്ടും മനസ്സിലാകുന്ന മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐν τῇ φυλακῇ
  choice: തടവറയിൽവെച്ച്
  rationale: മുൻസന്ദർഭത്തിൽ സ്ഥാപിതമായ നിർദിഷ്ട തടവറയെ സൂചിപ്പിക്കുകയും വധം നടന്ന സ്ഥലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
