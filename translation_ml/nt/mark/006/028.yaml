  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ തുടർച്ചയായ കൈമാറ്റവും ആവർത്തിച്ച ക്രിയയും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചകം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
