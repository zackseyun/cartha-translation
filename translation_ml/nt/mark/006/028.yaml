source:
  edition: SBLGNT
  text: καὶ ἤνεγκεν τὴν κεφαλὴν αὐτοῦ ἐπὶ πίνακι καὶ ἔδωκεν αὐτὴν τῷ κορασίῳ, καὶ τὸ κοράσιον ἔδωκεν αὐτὴν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: ml
  text: അവൻ യോഹന്നാന്റെ തല ഒരു തളികയിൽ കൊണ്ടുവന്ന് പെൺകുട്ടിക്കു കൊടുത്തു; പെൺകുട്ടി അത് തന്റെ അമ്മയ്ക്ക് കൊടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു വിളമ്പുതളികയിൽ,’ ‘ഒരു ട്രേയിൽ,’ അല്ലെങ്കിൽ ‘ഒരു വിഭവപാത്രത്തിൽ’ എന്നുമാകാം. ഗ്രീക്കിലെ πίναξ എന്ന പദം ഭക്ഷണം വിളമ്പാനുള്ള തളികയെയോ പാത്രത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: കൊണ്ടുവന്നു
  rationale: വെട്ടിമാറ്റിയ തല വിരുന്നിടത്തേക്കു ഭൗതികമായി കൊണ്ടുവന്ന പ്രവൃത്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: യോഹന്നാന്റെ തല
  rationale: αὐτοῦ മുൻസന്ദർഭത്തിലെ യോഹന്നാനെ സൂചിപ്പിക്കുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോഴും വ്യക്തത നിലനിർത്താൻ പേര് ഉപയോഗിച്ചു; അർത്ഥത്തിൽ പുതിയ വിവരം ചേർക്കുന്നില്ല.
- source_word: ἐπὶ πίνακι
  choice: ഒരു വലിയ തളികയിൽ
  rationale: πίναξ ഭക്ഷണം വിളമ്പുന്ന തളികയെയോ പരന്ന പാത്രത്തെയോ സൂചിപ്പിക്കുന്നു. വിരുന്നിന്റെ സന്ദർഭത്തിൽ 'വലിയ തളിക' സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἔδωκεν
  choice: കൊടുത്തു
  rationale: രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള δίδωμι എന്ന ഒരേ ക്രിയയുടെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: പെൺകുട്ടിക്കു / പെൺകുട്ടി
  rationale: κοράσιον പ്രായം കുറഞ്ഞ പെൺകുട്ടിയെ സൂചിപ്പിക്കുന്നു; പഴഞ്ചനായ പദങ്ങൾ ഒഴിവാക്കി സാധാരണ ആധുനിക പദം തിരഞ്ഞെടുത്തു.
- source_word: τῇ μητρὶ αὐτῆς
  choice: തന്റെ അമ്മയ്ക്കും
  rationale: αὐτῆς പെൺകുട്ടിയുടെ അമ്മയെ സൂചിപ്പിക്കുന്നു. 'തന്റെ' എന്നത് മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; καί-യുടെ തുടർച്ചാഭാവം 'ഉം' മുഖേന പ്രകടമാക്കുന്നു.
