  text: οὐ γὰρ συνῆκαν ἐπὶ τοῖς ἄρτοις, ⸂ἀλλ’ ἦν⸃ αὐτῶν ἡ καρδία πεπωρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/052.yaml
  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: ml
  text: കാരണം, അപ്പങ്ങളെക്കുറിച്ച് അവർ ഗ്രഹിച്ചില്ല[b]; എന്നാൽ അവരുടെ ഹൃദയം കഠിനമായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ഹൃദയം തഴമ്പുപിടിച്ചിരുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അപ്പങ്ങളുടെ പ്രാധാന്യം അവർ ഗ്രഹിച്ചില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: ഗ്രഹിച്ചിരുന്നില്ല
  rationale: συνίημι ഇവിടെ വെറും അറിവിനേക്കാൾ, അപ്പങ്ങളുടെ സംഭവത്തിന്റെ അർഥവും പ്രാധാന്യവും മനസ്സിലാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഗ്രഹിച്ചിരുന്നില്ല’ ആ ബൗദ്ധികവും ആത്മീയവുമായ പരാജയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: അപ്പങ്ങളെക്കുറിച്ച്
  rationale: ἐπί + ദത്തിവ് ഇവിടെ അപ്പങ്ങൾ ഉൾപ്പെട്ട സംഭവത്തെയും അതിന്റെ പ്രാധാന്യത്തെയും സംബന്ധിച്ചുള്ള ഗ്രഹണത്തെ സൂചിപ്പിക്കുന്നു. ‘അപ്പങ്ങളെക്കുറിച്ച്’ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: ἄρτοις
  choice: അപ്പങ്ങൾ
  rationale: ബഹുവചനം മുമ്പത്തെ ഭക്ഷണവിതരണത്തിലെ നിർദിഷ്ട അപ്പങ്ങളിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; അതിനാൽ പൊതുവായ ‘അപ്പം’ എന്നതിനെക്കാൾ ‘അപ്പങ്ങൾ’ കൃത്യമാണ്.
- source_word: καρδία
  choice: ഹൃദയം
  rationale: καρδία മനുഷ്യന്റെ ആന്തരിക ഗ്രഹണശേഷിയും മനോഭാവവും ഉൾക്കൊള്ളുന്നു. ‘ഹൃദയം’ അതിന്റെ വിശാലമായ രൂപകാർഥം നിലനിർത്തുന്നു.
- source_word: πεπωρωμένη
  choice: കഠിനപ്പെട്ടിരുന്നു
  rationale: πωρόω കട്ടിയാകുക അഥവാ തഴമ്പുപിടിക്കുക എന്ന രൂപകത്തിലൂടെ ആത്മീയ സംവേദനക്ഷയത്തെ സൂചിപ്പിക്കുന്നു. ‘കഠിനപ്പെട്ടിരുന്നു’ അതിന്റെ സ്ഥിതിവിവരണവും കാരണത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- source_word: ἀλλ’ ἦν
  choice: എന്നാൽ … ആയിരുന്നു
  rationale: മുൻവാക്യത്തോട് വിരുദ്ധതയും തുടർന്നിരുന്ന അവസ്ഥയും സൂചിപ്പിക്കുന്ന ἀλλάയും അപൂർണ്ണഭൂതകാലമായ ἦνഉം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: αὐτῶν ἡ καρδία
  choice: അവരുടെ ഹൃദയം
  rationale: ഗ്രീക്കിലെ ഏകവചന കൂട്ടായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ശിഷ്യന്മാരുടെ പങ്കിട്ട ആന്തരിക അവസ്ഥയെ ഇത് സൂചിപ്പിക്കാം.
theological_decisions:
- issue: πεπωρωμένη സൂചിപ്പിക്കുന്ന ശിഷ്യന്മാരുടെ അവസ്ഥ
  choice: അവരുടെ ഹൃദയം കഠിനപ്പെട്ടിരുന്നു
  alternative: അവരുടെ ഹൃദയം തഴമ്പുപിടിച്ചിരുന്നു
  rationale: വാക്യം ആത്മീയ ഗ്രഹണശൂന്യതയെ വിവരിക്കുന്നുവെങ്കിലും അതിന്റെ അന്തിമകാരണം വ്യക്തമാക്കുന്നില്ല. ‘കഠിനപ്പെട്ടിരുന്നു’ എന്ന പ്രയോഗം ദൈവിക ന്യായവിധിയെന്നോ സ്വയം വരുത്തിയ അവസ്ഥയെന്നോ നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കാതെ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: αὐτῶν ἡ καρδίαയിലെ ഏകവചനത്തിന്റെ അവതരണം
  choice: അവരുടെ ഹൃദയം
  alternative: അവരുടെ ഹൃദയങ്ങൾ
  rationale: മൂലപാഠത്തിലെ കൂട്ടായ ഏകവചനം മലയാളത്തിൽ മനസ്സിലാകുന്നതിനാൽ അത് നിലനിർത്തി; ഇതിലൂടെ എല്ലാവർക്കും പൊതുവായിരുന്ന അവസ്ഥയും പ്രകടമാകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. γάρ എന്നത് മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം പ്രകടിപ്പിക്കുന്നതിനാൽ വാക്യം ഒറ്റയ്ക്ക് ഉദ്ധരിക്കുമ്പോഴും സ്വാഭാവികമാകാൻ തുടക്കത്തിൽ പ്രത്യേക ബന്ധപദം ചേർത്തിട്ടില്ല; പൂർണ്ണസന്ദർഭത്തിൽ ആവശ്യമെങ്കിൽ ‘കാരണം’ ഉപയോഗിക്കാം. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
