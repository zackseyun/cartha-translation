translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മീനിൽനിന്നും കുറെ’ എന്ന പ്രയോഗം മൂലത്തിലെ ഭാഗികത നിലനിർത്തുന്നു; ‘കഷണങ്ങൾ’ അപ്പത്തിന്റെ ശേഷിപ്പുകളാണെന്ന് മുൻസന്ദർഭം വ്യക്തമാക്കുന്നു.
