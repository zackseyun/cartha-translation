  text: καὶ ἦραν ⸂κλάσματα δώδεκα κοφίνων πληρώματα⸃ καὶ ἀπὸ τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/043.yaml
  text: And they picked up twelve basketfuls of broken pieces[a], and some of the fish.
translation:
  language: ml
  text: അവർ പന്ത്രണ്ട് കൊട്ട നിറയെ കഷണങ്ങൾ[a] ശേഖരിച്ചു, മീനിൽനിന്നും കുറെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കഷണങ്ങൾ നിറഞ്ഞ പന്ത്രണ്ട് കൊട്ടകൾ.’ ഗ്രീക്കുപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘കഷണങ്ങൾ,’ ‘പന്ത്രണ്ട് കൊട്ടകൾ,’ ‘നിറവുകൾ/നിറഞ്ഞ അളവുകൾ’ എന്നീ ആശയങ്ങൾ കൂട്ടിച്ചേർക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: ശേഖരിച്ചു
  rationale: ഭക്ഷണം നൽകിയശേഷം ശേഷിച്ച ഭാഗങ്ങൾ എടുത്തുകൂട്ടുന്ന പ്രവൃത്തിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘ശേഖരിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: κλάσματα
  choice: കഷണങ്ങൾ
  rationale: ഒടിച്ചോ മുറിച്ചോ വേർപെട്ട ഭാഗങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സന്ദർഭം അപ്പത്തെ വ്യക്തമാക്കുന്നതിനാൽ മൂലത്തിൽ ഇല്ലാത്ത ‘അപ്പ’ എന്ന വിശേഷണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: പന്ത്രണ്ട് കൊട്ട നിറയെ
  rationale: പന്ത്രണ്ട് കൊട്ടകളും അവ നിറഞ്ഞ അളവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ഗ്രീക്കിലെ ഘടനാപരമായ അസാധാരണത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: κόφινος
  choice: കൊട്ട
  rationale: കൈയിൽ കൊണ്ടുപോകാവുന്ന ഒരു കൊട്ടയെ സൂചിപ്പിക്കുന്നു; വലിപ്പം കൂടുതൽ നിർണ്ണയിക്കാതെ സാധാരണ മലയാളപദം ഉപയോഗിച്ചു.
- source_word: πληρώματα
  choice: നിറയെ
  rationale: കൊട്ടകൾ നിറയ്ക്കുന്ന അളവിനെയോ നിറഞ്ഞ ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കുന്ന അർഥം മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: മീനിൽനിന്നും കുറെ
  rationale: ἀπό ഇവിടെ മീനിൽനിന്നുള്ള ശേഷിപ്പുകളെ ഭാഗികമായി സൂചിപ്പിക്കുന്നു. ‘കുറെ’ എന്നത് ഈ partitive ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മീനുകളുടെ മുഴുവൻ അളവും ശേഖരിച്ചു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
