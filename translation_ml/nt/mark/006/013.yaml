id: MRK.6.13
reference: Mark 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: ml
  text: അവർ അനേകം ഭൂതങ്ങളെ പുറത്താക്കുകയും, അനേകം രോഗികൾക്ക് എണ്ണ പൂശുകയും അവരെ സുഖപ്പെടുത്തുകയും ചെയ്തിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαιμόνια
  choice: ഭൂതങ്ങളെ
  rationale: δαιμόνιον ദുഷ്ടാത്മീയ സത്തകളെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾഭാഷയിലും പൊതുപ്രയോഗത്തിലും ‘ഭൂതങ്ങൾ’ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപദമാണ്; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘അശുദ്ധാത്മാക്കൾ’ എന്ന പദപ്രയോഗം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: πολλὰ / πολλούς
  choice: അനേകം
  rationale: രണ്ടിടത്തുമുള്ള πολύς എന്ന പദത്തിന്റെ അളവുസൂചന ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἐξέβαλλον
  choice: പുറത്താക്കുകയും ... ചെയ്തിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം ആവർത്തിച്ചോ തുടർന്നോ നടന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ചെയ്തിരുന്നു’ എന്ന സമാപനക്രിയയോടുകൂടിയ ഏകോപിത ഘടന ഉപയോഗിച്ചു.
- source_word: ἤλειφον
  choice: എണ്ണ പൂശി
  rationale: ἀλείφω എന്നത് പുരട്ടുക/പൂശുക എന്ന പ്രവർത്തനമാണ്; എണ്ണയോടൊപ്പം ‘എണ്ണ പൂശി’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. മതചടങ്ങിന്റെ സാങ്കേതിക അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐλαίῳ
  choice: എണ്ണ
  rationale: ἔλαιον സാധാരണയായി എണ്ണയെയും പുരാതന സാഹചര്യത്തിൽ മിക്കവാറും ഒലിവെണ്ണയെയും സൂചിപ്പിക്കുന്നു. മൂലവാക്യം എണ്ണയുടെ ഇനം പ്രത്യേകം പറയാത്തതിനാൽ പ്രധാനപാഠത്തിൽ പൊതുവായ ‘എണ്ണ’ നിലനിർത്തുന്നു.
- source_word: ἀρρώστους
  choice: രോഗികളെ
  rationale: സുബ്സ്റ്റാന്റീവായി ഉപയോഗിച്ച ἄρρωστος എന്നതിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: ἐθεράπευον
  choice: സുഖപ്പെടുത്തുകയും ചെയ്തിരുന്നു
  rationale: θεραπεύωയുടെ രോഗശാന്തി എന്ന അർഥവും അപൂർണ്ണ ഭൂതകാലത്തിലെ ആവർത്തിത/തുടർച്ചയായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -ഉം / -ഉകയും
  rationale: ആവർത്തിക്കുന്ന καί പ്രവർത്തനങ്ങളെ ലളിതമായി ഏകോപിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക സമാന്തര ക്രിയാഘടന ഉപയോഗിച്ചു.
theological_decisions:
- issue: രോഗശാന്തിയുമായുള്ള എണ്ണപൂശലിന്റെ ബന്ധം
  choice: എണ്ണ പൂശലും സുഖപ്പെടുത്തലും നടന്ന പ്രവർത്തനങ്ങളായി വിവരണാത്മകമായി അവതരിപ്പിക്കുന്നു; എണ്ണ തന്നെയാണ് രോഗശാന്തി വരുത്തിയതെന്നോ ഇത് ഒരു കൂദാശാസംവിധാനമാണെന്നോ പറയുന്നില്ല.
  alternative: എണ്ണയ്ക്ക് സ്വതന്ത്രമായ രോഗശാന്തിശക്തിയുണ്ടായിരുന്നു; അല്ലെങ്കിൽ എണ്ണപൂശൽ യാതൊരു പങ്കുമില്ലാത്ത വെറും പ്രതീകം മാത്രമായിരുന്നു.
  rationale: വാക്യം പ്രവർത്തനങ്ങളെ ചേർത്ത് വിവരിക്കുന്നുവെങ്കിലും അവയുടെ ദൈവശാസ്ത്രപരമായ യന്ത്രവത്കരണം വിശദീകരിക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തിത അപൂർണ്ണ ഭൂതകാലത്തെ ‘ചെയ്തിരുന്നു’ എന്ന ഘടനയിലൂടെ സൂചിപ്പിച്ചു. ‘അഭിഷേകം ചെയ്തു’ എന്ന സഭാപരമായ സാങ്കേതികനിറം ഒഴിവാക്കി ‘എണ്ണ പൂശി’ എന്നു നൽകി. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് δαιμόνιαയോട് തെറ്റായി ബന്ധിപ്പിച്ചതായി തോന്നുന്നു; കൂടാതെ ‘with olive oil’ എന്നത് main text-ലെ ‘oil’ ന്റെ ലെക്സിക്കൽ വ്യക്തീകരണമാണെങ്കിലും മലയാള പ്രസിദ്ധീകരണപാഠത്തിന് അത്യാവശ്യമല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
