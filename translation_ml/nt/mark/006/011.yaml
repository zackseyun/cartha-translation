  rationale: The revision retains the source's indefinite reference to a 'place' and restores the unmarked dative force of αὐτοῖς as 'അവർക്കുള്ള.' The footnote records both the equally viable 'അവരോടുള്ള' phrasing and the contextually adverse implication, without putting an interpretive 'against' into the translated text. It also uses the more direct 'കാലുകൾക്കടിയിലെ പൊടി.'
