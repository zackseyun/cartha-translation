id: MRK.6.11
reference: Mark 6:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: ml
  text: ഏതെങ്കിലും സ്ഥലം നിങ്ങളെ സ്വീകരിക്കാതിരിക്കുകയോ നിങ്ങളുടെ വാക്കു കേൾക്കാതിരിക്കുകയോ ചെയ്താൽ, അവിടെനിന്ന് പുറപ്പെടുമ്പോൾ നിങ്ങളുടെ കാലുകൾക്കടിയിലെ പൊടി അവർക്കുള്ള സാക്ഷ്യമായി കുടഞ്ഞുകളയുക.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവരോടുള്ള സാക്ഷ്യമായി.” സന്ദർഭത്തിൽ ഇത് അവരെ നിരസിക്കുന്നതിനെതിരായ സാക്ഷ്യത്തിന്റെ ഭാവം ഉൾക്കൊള്ളാം; എന്നാൽ ഗ്രീക്കിൽ “എതിരായി” എന്ന് വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: കാലിലെ പൊടി കുടഞ്ഞുകളയുന്നത് നിരസണത്തോടുള്ള പ്രതികരണമായി വേർപിരിയലും മുന്നറിയിപ്പും പ്രകടമാക്കുന്ന പ്രതീകാത്മക പ്രവൃത്തിയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: ഏതു സ്ഥലത്തുള്ളവർ
  rationale: ഗ്രീക്കിൽ സ്ഥലം വ്യാകരണപരമായി കർത്താവായിരുന്നാലും സ്വീകരിക്കുകയും കേൾക്കുകയും ചെയ്യുന്നത് അവിടെയുള്ള ആളുകളാണ്. സ്വാഭാവിക മലയാളത്തിനായി ആ സൂചിത കർത്താവിനെ വ്യക്തമാക്കുന്നു; അനിശ്ചിതവും പൊതുവുമായ അർഥം ‘ഏതു’ നിലനിർത്തുന്നു.
- source_word: μὴ δέξηται ὑμᾶς
  choice: നിങ്ങളെ സ്വീകരിക്കാതിരിക്കുകയോ
  rationale: δέχομαι ഇവിടെ ദൂതന്മാരെ അതിഥികളായി സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സ്വീകരിക്കുക’ ആതിഥ്യവും അംഗീകാരവും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ പദമാണ്.
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: നിങ്ങളുടെ വാക്കു കേൾക്കാതിരിക്കുകയോ
  rationale: ἀκούω എന്നത് ഇവിടെ വെറും ശബ്ദം കേൾക്കുന്നതിലുപരി സന്ദേശം ശ്രദ്ധിച്ചു കേൾക്കുന്നതാണ്. ‘നിങ്ങളുടെ വാക്കു കേൾക്കുക’ മലയാളത്തിൽ ഈ സന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘അനുസരിക്കുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക അർഥം ഒഴിവാക്കുന്നു.
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: അവിടെനിന്നു പുറപ്പെടുമ്പോൾ
  rationale: വർത്തമാന കൃദന്തത്തിന്റെ കാലസംബന്ധമായ സാഹചര്യാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐκτινάξατε
  choice: കുടഞ്ഞുകളയുക
  rationale: പാദങ്ങളിൽ പറ്റിയ പൊടി കുലുക്കി നീക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: നിങ്ങളുടെ കാലടികൾക്കടിയിലെ പൊടി
  rationale: മൂലത്തിലെ ‘നിങ്ങളുടെ കാലുകൾക്കടിയിലെ പൊടി’ എന്ന ദൃശ്യരൂപം സംക്ഷിപ്തവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: അവർക്കെതിരായ സാക്ഷ്യമായി
  rationale: αὐτοῖς അക്ഷരാർഥത്തിൽ ‘അവർക്ക്/അവരോടു’ എന്നാണെങ്കിലും, നിരാകരണത്തിന്റെ സന്ദർഭത്തിൽ പ്രവൃത്തിയുടെ പ്രതികൂലമായ സാക്ഷ്യസ്വഭാവം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൊടി കുടഞ്ഞുകളയുന്ന പ്രവൃത്തിയുടെ സാക്ഷ്യസ്വഭാവം
  choice: സന്ദേശവാഹകരെ നിരസിച്ചവർക്കെതിരായ സാക്ഷ്യം
  alternative: അവർക്കുള്ള/അവരോടുള്ള സാക്ഷ്യം; അല്ലെങ്കിൽ പ്രധാനമായി ബന്ധവിമുക്തിയുടെ അടയാളം
  rationale: നിരാകരണത്തിന്റെ സന്ദർഭം പ്രതികൂലമായ സാക്ഷ്യം സൂചിപ്പിക്കുന്നു. എങ്കിലും εἰς μαρτύριον αὐτοῖς എന്ന പ്രയോഗം സ്വതവേ ‘എതിരായി’ എന്നു തുറന്നുപറയാത്തതിനാൽ ആ ഭാഷാപരമായ തുറന്ന നില അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കാലടികൾക്കടിയിലെ പൊടി’ മൂലത്തിലെ ദൃശ്യവിവരം നിലനിർത്തുന്നു; വാക്യഘടന മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിന് അനുസരിച്ച് ക്രമപ്പെടുത്തി.
