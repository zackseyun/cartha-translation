    issue: The place name is rendered ‘ഗന്നേസരം/ഗന്നേസരത്തിൽ.’
    rationale: Γεννησαρέτ begins with Greek epsilon (Ge-), so ‘ഗെന്നേസരത്ത്’ is the more faithful transliteration and accords with established Malayalam biblical usage.
  - severity: high
    issue: The text reads ‘പടகு കരയ്ക്കടുപ്പിച്ചു.’
    rationale: ‘പടகு’ is not modern standard Malayalam in this sentence. ‘പടകിനെ കരയ്ക്കടുപ്പിച്ചു’ corrects both the lexical form and object marking.
  revised_text: അവർ കടന്ന് കരയിലെത്തി, ഗെന്നേസരത്ത് വന്ന് പടകിനെ കരയ്ക്കടുപ്പിച്ചു.[a]
