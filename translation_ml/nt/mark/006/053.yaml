revisions:
- from: അവർ കടന്ന് കരയിലെത്തി, ഗന്നേസരത്തിൽ വന്നു പടகு കരയ്ക്കടുപ്പിച്ചു.[a]
  to: അവർ കടന്ന് കരയിലെത്തി, ഗെന്നേസരത്ത് വന്ന് പടകിനെ കരയ്ക്കടുപ്പിച്ചു.[a]
  rationale: The revision corrects the transliteration of Γεννησαρέτ and replaces the nonstandard ‘പടகு’ with idiomatic Malayalam ‘പടകിനെ.’ It preserves the Greek temporal sequence and the specific nautical sense of the final verb. The supplied boat remains contextually warranted and is explicitly reflected in the Malayalam verb construction.
