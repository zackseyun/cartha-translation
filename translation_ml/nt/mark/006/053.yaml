source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντες ⸂ἐπὶ τὴν γῆν ἦλθον εἰς⸃ Γεννησαρὲτ καὶ προσωρμίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: ml
  text: അവർ കടന്ന് കരയിലെത്തി, ഗെന്നേസരത്ത് വന്ന് പടകിനെ കരയ്ക്കടുപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നങ്കൂരമിട്ടു’ അല്ലെങ്കിൽ ‘കരയ്ക്കണഞ്ഞു’; ഈ ഗ്രീക്ക് ക്രിയയ്ക്ക് പടകിനെ കരയിലേക്കോ നങ്കൂരസ്ഥാനത്തേക്കോ കൊണ്ടുവന്ന് നിർത്തുക എന്ന നാവികാർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: കടന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് കൃദന്തരൂപം; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ ‘കടന്ന്’ എന്നു നൽകി.
- source_word: ἐπὶ τὴν γῆν ἦλθον εἰς Γεννησαρὲτ
  choice: കരയിലെത്തി, ഗന്നേസരത്തിൽ വന്നു
  rationale: വള്ളയാത്രയുടെ പശ്ചാത്തലത്തിൽ γῆ ‘കര’യെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ‘കരയിലെത്തി’ എന്നും ‘ഗന്നേസരത്തിൽ വന്നു’ എന്നും ഉള്ള ഇരട്ട ഘടന നിലനിർത്തി.
- source_word: Γεννησαρὲτ
  choice: ഗന്നേസരത്ത്
  rationale: സ്ഥലനാമം ആധുനിക മലയാളത്തിൽ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി; വിഭക്തിയോടുകൂടെ വാക്യത്തിൽ ‘ഗന്നേസരത്തിൽ’ എന്നു ഉപയോഗിച്ചു.
- source_word: προσωρμίσθησαν
  choice: പടகு കരയ്ക്കടുപ്പിച്ചു
  rationale: വള്ളം കരയിലേക്കോ നങ്കൂരമിടുന്ന ഇടത്തേക്കോ കൊണ്ടുവന്ന് നിർത്തുക എന്ന നാവികാർഥം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ പ്രത്യേകം പറയാത്ത ‘പടகு’ സന്ദർഭത്തിൽനിന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കിയതാണ്.
- source_word: καί
  choice: അവർ
  rationale: വാക്യാരംഭത്തിലെ ലളിത സംയോജകം മലയാളത്തിലെ തുടർച്ചയായ ആഖ്യാനത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ സ്വാഭാവിക വാക്യപ്രവാഹം സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. നാവികസന്ദർഭം വ്യക്തമാക്കാൻ ‘കര’യും ‘പടகு കരയ്ക്കടുപ്പിച്ചു’യും ഉപയോഗിച്ചു; പദശഃ ഘടനയും സ്വാഭാവികതയും തമ്മിൽ സമതുലനം പാലിച്ചു.
