id: MRK.6.46
reference: Mark 6:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: ml
  text: അവരോടു വിടപറഞ്ഞശേഷം, അവൻ പ്രാർഥിക്കാനായി മലയിലേക്കു പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποταξάμενος
  choice: യാത്ര പറഞ്ഞശേഷം
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ഈ കൃദന്തം ഇവിടെ ഒരാളോടു വിടപറഞ്ഞ് പിരിയുക എന്ന അർഥം നൽകുന്നു. ‘യാത്ര പറയുക’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; ‘പിരിഞ്ഞശേഷം’ എന്നത് വിടപറയുന്ന പ്രവൃത്തിയെ കുറച്ച് പരോക്ഷമാക്കും.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: ബഹുവചന ദത്തിവിഭക്തി സർവനാമം മുൻസന്ദർഭത്തിലെ ആളുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘യാത്ര പറയുക’ എന്ന പ്രയോഗത്തോടൊപ്പം ‘അവരോടു’ സ്വാഭാവികമാണ്.
- source_word: ἀπῆλθεν
  choice: പോയി
  rationale: ἀπέρχομαι എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം അവിടെനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. വിടപറഞ്ഞശേഷം എന്ന മുൻഘടകം പുറപ്പെടലിന്റെ ആശയം വ്യക്തമാക്കുന്നതിനാൽ ‘പോയി’ സ്വാഭാവികവും മതിയായതുമാണ്.
- source_word: εἰς τὸ ὄρος
  choice: മലയിലേക്കു
  rationale: നിശ്ചിത ഉപപദത്തോടെയുള്ള ὄρος എന്ന പദത്തെ നിർദിഷ്ടമായ ‘മല’യായി നിലനിർത്തുന്നു; ‘ഒരു മല’ എന്നു പൊതുവാക്കുകയോ പ്രതീകാത്മക അർഥം ചേർക്കുകയോ ചെയ്യുന്നില്ല.
- source_word: προσεύξασθαι
  choice: പ്രാർഥിക്കാനായി
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന അനന്തരൂപത്തെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി ‘പ്രാർഥിക്കാനായി’ എന്നു നൽകുന്നു.
- source_word: καὶ
  choice: വാക്യക്രമത്തിലൂടെ ബന്ധിപ്പിച്ചു
  rationale: മലയാളത്തിൽ മുൻവാക്യത്തോടുള്ള ലളിതമായ ആഖ്യാനബന്ധം പ്രത്യേകമായി ‘പിന്നെ’ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു; അങ്ങനെ ഗ്രീക്കിൽ ഇല്ലാത്ത ശക്തമായ കാലക്രമസൂചന ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘മല’യുടെ നിർദേശം
  choice: ‘മലയിലേക്കു’ എന്ന് നിർദിഷ്ട സ്ഥലമായി വിവർത്തനം ചെയ്തു; പ്രത്യേക പ്രതീകാത്മകമോ ദൈവശാസ്ത്രപരമോ ആയ അർഥം ചേർത്തില്ല.
  alternative: ‘ഒരു മലയിലേക്കു’ എന്നു പൊതുവാക്കുക, അല്ലെങ്കിൽ പ്രത്യേക വെളിപ്പാടിന്റെ സ്ഥലമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്കിൽ നിശ്ചിത ഉപപദമുണ്ടെങ്കിലും മലയുടെ പ്രതീകാത്മക പ്രാധാന്യം വാക്യം വിശദീകരിക്കുന്നില്ല. അതിനാൽ വ്യക്തമായ ആഖ്യാനവിശദാംശം മാത്രം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യാത്ര പറയുക’ സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന പ്രയോഗമാണ്; അടിക്കുറിപ്പിൽ കൂടുതൽ നേരിട്ടുള്ള ‘വിടപറയുക’ എന്ന പകരം നൽകിയിരിക്കുന്നു.
