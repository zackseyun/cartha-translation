  text: And they all ate and were satisfied.
translation:
  language: ml
  text: അവരെല്ലാവരും ഭക്ഷിച്ചു തൃപ്തരായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: ഭക്ഷിച്ചു
  rationale: ἐσθίω എന്ന സാധാരണ ഭക്ഷണക്രിയയുടെ ഏറിസ്റ്റ് രൂപം. അധികമായി കർമം ചേർക്കാതെ ലളിതവും മാന്യവുമായ മലയാളത്തിൽ പ്രവർത്തി വ്യക്തമാക്കുന്നു.
- source_word: πάντες
  choice: അവരെല്ലാവരും
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന ബഹുവചന വിശേഷണം സന്ദർഭത്തിലെ മുഴുവൻ ജനക്കൂട്ടത്തെയും സൂചിപ്പിക്കുന്നു. ‘അവരെല്ലാവരും’ സർവവ്യാപകതയും സ്വാഭാവിക മലയാളവാക്യഘടനയും നിലനിർത്തുന്നു.
- source_word: ἐχορτάσθησαν
  choice: തൃപ്തരായി
  rationale: χορτάζωയുടെ കർമണിപ്രയോഗരൂപം വയറുനിറയെ ഭക്ഷണം ലഭിച്ച് തൃപ്തരാകുക എന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു. ‘തൃപ്തരായി’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘നിറഞ്ഞു’ എന്നത് മലയാളത്തിൽ ഇവിടെ അവ്യക്തമോ അസ്വാഭാവികമോ ആകാം.
- source_word: καὶ ... καὶ
  choice: -ഉം ... -ഉം
  rationale: ആവർത്തിക്കുന്ന καί രണ്ടു ഘടകങ്ങളെയും നേരിട്ട് ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവരെല്ലാവരും ഭക്ഷിച്ചു തൃപ്തരായി’ എന്ന ഏകോപിത ഘടന കഥയുടെ ലളിതമായ മുന്നേറ്റം നിലനിർത്തുന്നു; തുടക്കത്തിലെ καί പ്രത്യേകം ‘പിന്നെ’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, സംക്ഷിപ്തവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ രണ്ടു പ്രവർത്തികളും ഫലക്രമവും അധിക വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തിയിരിക്കുന്നു.
