id: MRK.6.3
reference: Mark 6:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: ml
  text: “ഇവൻ തച്ചനല്ലേ—മറിയയുടെ മകനും യാക്കോബിന്റെയും യോസെയുടെയും യൂദയുടെയും ശിമോന്റെയും സഹോദരനും[a]? ഇവന്റെ സഹോദരിമാരും[a] ഇവിടെ നമ്മുടെ കൂടെയില്ലേ?” അങ്ങനെ അവർ അവനിൽ ഇടറിപ്പോയി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരൻ’, ‘സഹോദരിമാർ’ എന്നതിനു ‘അടുത്ത ബന്ധു’, ‘ബന്ധുക്കൾ’ എന്നും മനസ്സിലാക്കാം. ഗ്രീക്കുപദങ്ങൾ സാധാരണയായി സഹോദരങ്ങളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ചില ക്രൈസ്തവ പാരമ്പര്യങ്ങൾ ഇവിടെ അവരെ വിപുലമായ ബന്ധുക്കളായോ സവതി സഹോദരങ്ങളായോ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “അവർ അവനിൽ നീരസപ്പെട്ടു” അല്ലെങ്കിൽ “അവൻ നിമിത്തം അവർ ഇടറിപ്പോയി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: തച്ചൻ
  rationale: പദത്തിന് ‘ശില്പി’ അഥവാ ‘നിർമാണത്തൊഴിലാളി’ എന്ന വിശാല അർഥം സാധ്യമാണെങ്കിലും, ഈ ഗ്രാമീണ തിരിച്ചറിയൽസന്ദർഭത്തിൽ പരമ്പരാഗതവും ഏറ്റവും സാധ്യതയുള്ളതുമായ അർഥം ‘തച്ചൻ’ എന്നതാണ്.
- source_word: υἱὸς τῆς Μαρίας
  choice: മറിയയുടെ മകൻ
  rationale: നാട്ടുകാരുടെ വാക്കുകളിൽ യേശുവിനെ അമ്മയുടെ പേരിൽ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്കിലെ ശ്രദ്ധേയമായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: സഹോദരൻ / സഹോദരിമാർ
  rationale: ഗ്രീക്കുപദങ്ങളുടെ സാധാരണ അർഥം ഇതാണ്. ബന്ധത്തിന്റെ കൃത്യസ്വഭാവത്തെക്കുറിച്ചുള്ള പാരമ്പര്യവ്യത്യാസം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Ἰωσῆτος
  choice: യോസെ
  rationale: മൂലപാഠത്തിലെ വ്യത്യസ്ത ഗ്രീക്ക് നാമരൂപം ‘യോസേഫ്’ എന്നു ഏകീകരിക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ὧδε πρὸς ἡμᾶς
  choice: ഇവിടെ നമ്മുടെ കൂടെ
  rationale: പ്രസംഗകരോടൊപ്പമുള്ള പ്രാദേശികവും സാമൂഹികവുമായ സാന്നിധ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: അവനെച്ചൊല്ലി ഇടറി
  rationale: പ്രതികൂലമായി ഇടറുക/അംഗീകരിക്കാനാവാതെ വരുക എന്ന രൂപകാത്മക ശക്തി നിലനിർത്തുന്നു; വെറും വികാരപരമായ ‘നീരസപ്പെട്ടു’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ ‘സഹോദരൻ’, ‘സഹോദരിമാർ’ എന്നീ പദങ്ങളുടെ ബന്ധസൂചന
  choice: മുഖ്യവാചകത്തിൽ സാധാരണ കുടുംബബന്ധപദങ്ങളായ ‘സഹോദരൻ’, ‘സഹോദരിമാർ’ നിലനിർത്തി.
  alternative: അടുത്ത ബന്ധു/ബന്ധുക്കൾ, അല്ലെങ്കിൽ അർധസഹോദരങ്ങൾ എന്നു വ്യാഖ്യാനിക്കുക.
  rationale: ἀδελφός, ἀδελφή എന്നിവ സാധാരണയായി സഹോദരബന്ധം സൂചിപ്പിക്കുന്നു; എന്നാൽ ഇവിടെയുള്ള കൃത്യബന്ധത്തെക്കുറിച്ച് ക്രൈസ്തവ പാരമ്പര്യങ്ങളിൽ വ്യത്യസ്ത ധാരണകളുണ്ട്. വിവർത്തനം ആ തർക്കം തീർപ്പാക്കുന്നില്ല.
- issue: ‘മറിയയുടെ മകൻ’ എന്ന പ്രയോഗത്തിന്റെ സാമൂഹിക ഭാവം
  choice: വ്യാഖ്യാനപരമായ വിശേഷണം ചേർക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ഇത് നിന്ദാസൂചനയുള്ള പ്രയോഗമാണെന്ന് വാചകത്തിൽ വ്യക്തമാക്കുക.
  rationale: സന്ദർഭത്തിൽ സാമൂഹികമായ കുത്ത് ഉണ്ടായിരിക്കാമെങ്കിലും ഗ്രീക്ക് പാഠം അത് വിശദീകരിക്കുന്നില്ല; അതിനാൽ സാധ്യതയുള്ള ധ്വനി തുറന്നുവെക്കുന്നു.
- issue: ἐσκανδαλίζοντο എന്നതിന്റെ രൂപകാത്മക അർഥം
  choice: ‘അവനെച്ചൊല്ലി ഇടറി’ എന്നു നൽകി.
  alternative: ‘അവർ അവനിൽ നീരസപ്പെട്ടു’ അല്ലെങ്കിൽ ‘അവർ അവനെ അംഗീകരിച്ചില്ല’.
  rationale: ‘ഇടറി’ എന്നത് മൂലപദത്തിന്റെ രൂപകാത്മകതയും യേശുവിനെ അംഗീകരിക്കുന്നതിൽ വന്ന തടസ്സവും സംരക്ഷിക്കുന്നു; കൃത്യമായ പ്രതികരണം ഒറ്റ മനോഭാവമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. നാട്ടുകാരുടെ ചോദ്യങ്ങളിലെ പരിചയഭാവം ‘അല്ലേ’, ‘ഇല്ലേ’ എന്നിവകൊണ്ട് സൂക്ഷിച്ചു. പേരുകൾ മലയാള ബൈബിൾ ഉപയോഗവുമായി പൊതുവേ പൊരുത്തപ്പെടുത്തി; Ἰωσῆτος എന്ന പ്രത്യേക രൂപം ‘യോസെ’ ആയി നിലനിർത്തി.
