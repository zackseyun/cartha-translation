revisions:
- from: “ഇവൻ ആ തച്ചനല്ലേ—മറിയയുടെ മകനും യാക്കോബിന്റെയും യോസെയുടെയും യൂദയുടെയും ശിമോന്റെയും സഹോദരനും[a]? ഇവന്റെ സഹോദരിമാരും[a] ഇവിടെ നമ്മുടെ കൂടെയില്ലേ?” അങ്ങനെ അവർ അവനെച്ചൊല്ലി ഇടറി.[b]
