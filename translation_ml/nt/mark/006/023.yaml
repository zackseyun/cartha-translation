  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: ml
  text: 'അവൻ അവളോട് ശപഥം ചെയ്തു: “നീ എന്നോട് എന്തു ചോദിച്ചാലും, എന്റെ രാജ്യത്തിന്റെ പകുതിവരെ ഞാൻ നിനക്കു തരാം.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ രാജ്യത്തിന്റെ പകുതിവരെ” എന്നത് രാജകീയ ഔദാര്യത്തെ അതിശയോക്തിയായി പ്രകടിപ്പിക്കുന്ന പതിവുശൈലിയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: സത്യംചെയ്തു
  rationale: ὀμνύω എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം ഒരു ഉറച്ച ശപഥം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആ ഗൗരവവും വാഗ്ദാനത്തിന്റെ ബാധ്യതയും സ്വാഭാവികമായ മലയാളത്തിൽ ‘സത്യംചെയ്തു’ നിലനിർത്തുന്നു.
- source_word: αὐτῇ
  choice: അവളോട്
  rationale: സന്ദർഭത്തിലെ പെൺകുട്ടിയെയാണ് സ്ത്രീലിംഗ ഏകവചന ദത്തിവ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അഭിസംബോധനയുടെ ബന്ധം ‘അവളോട്’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: Ὅ τι ἐάν
  choice: എന്തു … ആലും
  rationale: ഈ അനിശ്ചിത ബന്ധവാക്യം അഭ്യർഥനയ്ക്ക് തുറന്ന പരിധി നൽകുന്നു. ‘എന്തു ചോദിച്ചാലും’ എന്ന മലയാളഘടന ആ വ്യാപ്തി ലളിതമായി പകരുന്നു.
- source_word: με αἰτήσῃς
  choice: നീ എന്നോട് … ചോദിച്ചാലും
  rationale: αἰτέω ഇവിടെ ഒരാളോട് എന്തെങ്കിലും ചോദിക്കുകയോ ആവശ്യപ്പെടുകയോ ചെയ്യുന്നതാണ്. ‘എന്നോട് ചോദിക്കുക’ നേരിട്ടുള്ള സംഭാഷണത്തിൽ സ്വാഭാവികമാണ്.
- source_word: δώσω σοι
  choice: ഞാൻ നിനക്കു തരാം
  rationale: ഭാവികാലക്രിയയും പരോക്ഷകർമവും ചേർന്ന വാഗ്ദാനത്തിന്റെ ശക്തി ‘ഞാൻ നിനക്കു തരാം’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἕως ἡμίσους
  choice: പകുതിവരെ
  rationale: ἕως ഇവിടെ സമയമല്ല, അളവിന്റെ പരമാവധി പരിധിയാണ് സൂചിപ്പിക്കുന്നത്. ‘പകുതിവരെ’ അതിനെ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: τῆς βασιλείας μου
  choice: എന്റെ രാജ്യത്തിന്റെ
  rationale: βασιλείαയ്ക്ക് ഭരണം, രാജാധികാരം, രാജ്യം എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. ഈ രാജസഭാസന്ദർഭത്തിലെ അതിശയോക്തിപരമായ വാഗ്ദാനത്തിൽ ഭൂപ്രദേശപരമായ ‘രാജ്യം’ ഏറ്റവും സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ഹെരോദാവിന്റെ വാക്കുകളിൽ βασιλεία എന്നതിന്റെ അർഥം
  choice: രാജ്യം
  alternative: ഭരണം / രാജാധികാരം
  rationale: ഗ്രീക്ക് പദത്തിന് ഭരണപ്രവർത്തനത്തെയും രാജകീയ അധികാരത്തെയും സൂചിപ്പിക്കാനാകുമെങ്കിലും, ‘രാജ്യത്തിന്റെ പകുതിവരെ’ എന്ന രാജകീയ വാഗ്ദാനസൂത്രം ഇവിടെ ഉദ്ദേശിക്കുന്ന അതിശയോക്തി ‘രാജ്യം’ കൂടുതൽ വ്യക്തമായി പകരുന്നു; സാങ്കേതികമായ ദൈവശാസ്ത്രാർഥം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘ശപഥംചെയ്തു’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘സത്യംചെയ്തു’ തിരഞ്ഞെടുത്തു; എന്നാൽ ശപഥത്തിന്റെ ഗൗരവം നിലനിർത്തി.
