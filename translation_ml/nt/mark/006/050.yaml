revisions:
- from: 'കാരണം, എല്ലാവരും അവനെ കണ്ടു പരിഭ്രാന്തരായി. എന്നാൽ അവൻ ഉടനെ അവരോടു സംസാരിച്ചു: “ധൈര്യപ്പെടുവിൻ; ഞാൻ ആകുന്നു; ഭയപ്പെടേണ്ടാ.”'
  to: 'കാരണം, എല്ലാവരും അവനെ കണ്ടു പരിഭ്രാന്തരായി. എന്നാൽ അവൻ ഉടനെ അവരോടു സംസാരിച്ചു; അവരോടു പറഞ്ഞു: “ധൈര്യപ്പെടുവിൻ; ഞാൻ ആകുന്നു; ഭയപ്പെടേണ്ട.”'
  rationale: The revision restores the distinct second speech-introduction represented by καὶ λέγει αὐτοῖς, while retaining the draft’s faithful rendering of ἐγώ εἰμι and its formal but accessible register. No footnote is needed, since the translation itself preserves the source ambiguity.
