id: MRK.6.50
reference: Mark 6:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: ml
  text: 'കാരണം, എല്ലാവരും അവനെ കണ്ടു പരിഭ്രാന്തരായി. എന്നാൽ അവൻ ഉടനെ അവരോടു സംസാരിച്ചു; അവരോടു പറഞ്ഞു: “ധൈര്യപ്പെടുവിൻ; ഞാൻ ആകുന്നു; ഭയപ്പെടേണ്ട.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: പരിഭ്രാന്തരായി
  rationale: കാഴ്ച മൂലമുണ്ടായ ശക്തമായ ഭയവും മനസ്സിലെ കലക്കവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: Θαρσεῖτε
  choice: ധൈര്യപ്പെടുവിൻ
  rationale: ഭയം വിട്ട് ധൈര്യം കൈക്കൊള്ളാനുള്ള ബഹുവചന ആഹ്വാനം dignified, direct Malayalam-ൽ നിലനിർത്തുന്നു.
- source_word: ἐγώ εἰμι
  choice: ഞാൻ ആകുന്നു
  rationale: ഗ്രീക്കിലെ തുറന്നതും ഊന്നലുള്ളതുമായ രൂപം സംരക്ഷിക്കുന്നു; ‘ഞാനാണ്’ അല്ലെങ്കിൽ ‘ഇതു ഞാനാണ്’ എന്നു വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനി ചുരുക്കുന്നില്ല.
- source_word: μὴ φοβεῖσθε
  choice: ഭയപ്പെടേണ്ടാ
  rationale: തുടരുന്ന ഭയം അവസാനിപ്പിക്കാനുള്ള ബഹുവചന നിരോധനം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐγώ εἰμι എന്ന പ്രയോഗത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ സാധ്യത
  choice: ഞാൻ ആകുന്നു
  alternative: ഞാനാണ് / ഇതു ഞാനാണ്
  rationale: സന്ദർഭത്തിൽ ഇത് സ്വയം തിരിച്ചറിയിക്കലായി മനസ്സിലാക്കാമെങ്കിലും, ‘ഞാൻ ആകുന്നു’ എന്ന രൂപം പഴയനിയമ ദൈവവെളിപ്പാടുമായുള്ള സാധ്യതയുള്ള പ്രതിധ്വനിയും മൂലപാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവം കൈവിടാത്ത മലയാളം. ഗ്രീക്കിലെ വർത്തമാനകാലമായ λέγει മലയാളത്തിൽ സ്വാഭാവികമായ കഥനക്രമത്തിനായി ‘സംസാരിച്ചു’ എന്ന ഏക ക്രിയയിൽ ഉൾക്കൊള്ളിച്ചു; അർത്ഥഭേദമുണ്ടാക്കുന്ന അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
