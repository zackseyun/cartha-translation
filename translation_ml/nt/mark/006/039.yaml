source:
  edition: SBLGNT
  text: καὶ ἐπέταξεν αὐτοῖς ⸀ἀνακλῖναι πάντας συμπόσια συμπόσια ἐπὶ τῷ χλωρῷ χόρτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/039.yaml
  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: ml
  text: അവൻ അവരോട് എല്ലാവരെയും പച്ചപ്പുല്ലിന്മേൽ കൂട്ടംകൂട്ടമായി[a] ഇരുത്താൻ കല്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഓരോ കൂട്ടമായി”; ആവർത്തിച്ചിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ആളുകളെ ഭക്ഷണത്തിനായി വെവ്വേറെ കൂട്ടങ്ങളായി ക്രമീകരിച്ചതിനെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “എല്ലാവരെയും ചാരിക്കിടത്താൻ അവരോട് കല്പിച്ചു.” ഇവിടെ “അവരോട്” എന്നത് ആജ്ഞ ലഭിച്ചവരെയും “എല്ലാവരെയും” എന്നത് ഇരുത്തപ്പെടേണ്ട ജനത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: grammar_clarification
lexical_decisions:
- source_word: ἐπέταξεν
  choice: കല്പിച്ചു
  rationale: ἐπιτάσσω അധികാരപൂർവമായ ആജ്ഞയെ സൂചിപ്പിക്കുന്നു; ‘കല്പിച്ചു’ അതിന്റെ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: ആജ്ഞ സ്വീകരിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന ദത്തിവ് സർവനാമം വേർതിരിച്ചുതന്നെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അവർ ശിഷ്യന്മാരാണെങ്കിലും അത് മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἀνακλῖναι πάντας
  choice: എല്ലാവരെയും … ഇരുത്താൻ
  rationale: അക്കൂസറ്റീവ് πάντας infinitive-ന്റെ പ്രവർത്തനത്തിന് വിധേയരായ മുഴുവൻ ജനത്തെയും സൂചിപ്പിക്കുന്നു. αὐτοῖς എന്ന ആജ്ഞ സ്വീകരിക്കുന്നവരിൽനിന്ന് അവരെ വേർതിരിക്കാൻ മലയാളത്തിലെ causative രൂപമായ ‘ഇരുത്താൻ’ ഉപയോഗിച്ചു. വിരുന്നിനായി ചാരിക്കിടക്കുന്ന ഭാവം മലയാളത്തിൽ അക്ഷരാർഥമായി പറഞ്ഞാൽ അസ്വാഭാവികമാകുന്നതിനാൽ ഭക്ഷണക്രമത്തിൽ ഇരുത്തുക എന്ന സ്വാഭാവിക പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: συμπόσια συμπόσια
  choice: കൂട്ടംകൂട്ടമായി
  rationale: ആവർത്തിച്ച ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിതരണാത്മക അർഥവും ക്രമീകരിച്ച വ്യത്യസ്ത കൂട്ടങ്ങളെന്ന ആശയവും മലയാളത്തിലെ ആവർത്തനരൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: പച്ചപ്പുല്ലിന്മേൽ
  rationale: χλωρός എന്നത് പച്ചയോ പുതുമയുള്ളതോ ആയ അവസ്ഥയും χόρτος ഇവിടെ പുല്ലും സൂചിപ്പിക്കുന്നു; ഈ സംയുക്തപ്രയോഗം നേരിട്ടും സ്വാഭാവികമായും അർഥം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആജ്ഞ സ്വീകരിക്കുന്നവർ (αὐτοῖς) എന്നും ഇരുത്തപ്പെടേണ്ട എല്ലാവരും (πάντας) എന്നും ഉള്ള വ്യാകരണവ്യത്യാസം വ്യക്തമായി സൂക്ഷിച്ചു. ഭക്ഷണസമയത്തെ reclining എന്ന സാംസ്കാരിക ഭാവം മുഖ്യവാചകത്തിൽ അസ്വാഭാവികമായി തോന്നാതിരിക്കാൻ ‘ഇരുത്താൻ’ ഉപയോഗിച്ച് അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
