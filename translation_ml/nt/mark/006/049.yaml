  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: ml
  text: എന്നാൽ, അവൻ കടലിന്മേൽ നടക്കുന്നതു അവർ കണ്ടപ്പോൾ, അതൊരു പ്രേതരൂപമാണെന്ന്[a] കരുതി നിലവിളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രേതം” അല്ലെങ്കിൽ “മായാരൂപം.” ഗ്രീക്കിലെ φάντασμα എന്ന പദം പ്രേതസദൃശമായ ഒരു പ്രത്യക്ഷരൂപത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: എന്നാൽ അവർ
  rationale: δέയുടെ നേരിയ വിരുദ്ധഭാവവും ശിഷ്യന്മാരുടെ പ്രതികരണത്തിലേക്കുള്ള ആഖ്യാനമാറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἰδόντες αὐτὸν
  choice: അവർ അവൻ ... കണ്ടപ്പോൾ
  rationale: Aorist participle-ന്റെ കാലസൂചകബലം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ഉപവാക്യമായി നൽകുന്നു; αὐτόν യേശുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: കടലിന്മേൽ നടക്കുന്നതു
  rationale: ἐπί + genitive ഇവിടെ വെള്ളത്തിന്റെ ഉപരിതലത്തിന്മേലുള്ള നടത്തത്തെ സൂചിപ്പിക്കുന്നു; θάλασσα എന്ന പദത്തിന്റെ രൂപപരമായ അർഥം ‘കടൽ’ എന്നു നിലനിർത്തുന്നു.
- source_word: ἔδοξαν
  choice: കരുതി
  rationale: δοκέω ഇവിടെ തെറ്റായ ധാരണയെയോ അനുമാനത്തെയോ സൂചിപ്പിക്കുന്നു; ‘കരുതി’ സാധാരണവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: ὅτι φάντασμά ἐστιν
  choice: അതൊരു പ്രേതരൂപമാണെന്ന്
  rationale: φάντασμα ശരീരരഹിതമായോ ഭീതിജനകമായോ തോന്നുന്ന ദൃശ്യരൂപത്തെ സൂചിപ്പിക്കുന്നു. ‘പ്രേതരൂപം’ apparition/phantom എന്ന അർഥവ്യാപ്തി നിലനിർത്തുകയും ഒരു യഥാർഥ മരിച്ചവന്റെ ആത്മാവ് എന്ന ആശയം അനാവശ്യമായി ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ ἀνέκραξαν
  choice: നിലവിളിച്ചു
  rationale: ἀνακράζω ശക്തമായ ഉച്ചത്തിലുള്ള വിളിയെ സൂചിപ്പിക്കുന്നു; ഭയത്തിന്റെ സന്ദർഭത്തിൽ ‘നിലവിളിച്ചു’ സ്വാഭാവികമാണ്, എന്നാൽ ശബ്ദത്തിന്റെ സ്വഭാവം അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: വെള്ളത്തിന്മേലുള്ള യേശുവിന്റെ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: കടലിന്മേൽ നടക്കുന്നതു
  alternative: കടൽത്തീരത്തുകൂടെ നടക്കുന്നതു
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ ἐπὶ τῆς θαλάσσης എന്നത് കടലിന്റെ ഉപരിതലത്തിന്മേലുള്ള നടത്തമാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; അത്ഭുതവിവരണത്തിന്റെ ലളിതാർഥം അലങ്കാരമില്ലാതെ നിലനിർത്തുന്നു.
- issue: φάντασμα എന്നതിന്റെ സ്വഭാവം
  choice: പ്രേതരൂപം
  alternative: പ്രേതം; മായാരൂപം
  rationale: മൂലപദം ഒരു ഭീതിജനകമായ പ്രത്യക്ഷരൂപത്തെ സൂചിപ്പിക്കുന്നു; അതിന്റെ അസ്തിത്വസ്വഭാവത്തെക്കുറിച്ച് വാക്യം ഉറപ്പിക്കുന്നതിലുപരി വിവർത്തനം ഉറപ്പിക്കാതിരിക്കാൻ ‘പ്രേതരൂപം’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കടലിന്മേൽ’ എന്ന പ്രയോഗം മൂലഭാഷയുടെ ദൃശ്യബലം നിലനിർത്തുന്നു; ‘പ്രേതരൂപം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപദത്തിന്റെ അർഥപരിധി അനാവശ്യമായി ചുരുക്കാത്തതുമാണ്.
