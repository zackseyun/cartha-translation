id: MRK.6.34
reference: Mark 6:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: ml
  text: അവൻ കരയ്ക്കിറങ്ങിയപ്പോൾ[a] വലിയൊരു ജനക്കൂട്ടത്തെ കണ്ടു. അവർ ഇടയനില്ലാത്ത ആടുകളെപ്പോലെ ആയിരുന്നതിനാൽ[b] അവന് അവരോടു മനസ്സലിവു തോന്നി. പിന്നെ അവൻ അവരെ പലതും പഠിപ്പിക്കാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ പുറത്തുവന്നപ്പോൾ.’ വള്ളത്തിലുള്ള യാത്രയുടെ സന്ദർഭത്തിൽ ഇവിടെ കരയ്ക്കിറങ്ങുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇടയനില്ലാത്ത ആടുകൾ’ എന്ന ദൃശ്യം വിശ്വസ്തമായ നേതൃത്വം ഇല്ലാത്ത ജനത്തെക്കുറിച്ചുള്ള ബൈബിൾഭാഷയെ പ്രതിധ്വനിപ്പിക്കുന്നു; സംഖ്യ 27:17; 1 രാജാക്കന്മാർ 22:17; യെഹെസ്കേൽ 34:5 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: കരയ്ക്കിറങ്ങിയപ്പോൾ
  rationale: പദശഃ ‘പുറത്തുവന്നപ്പോൾ’ എന്നാണെങ്കിലും, വള്ളത്തിലുള്ള യാത്രയുടെ സന്ദർഭത്തിൽ കരയിലേക്കിറങ്ങുന്നതാണ് സ്വാഭാവികമായ അർഥം.
- source_word: εἶδεν πολὺν ὄχλον
  choice: വലിയൊരു ജനക്കൂട്ടത്തെ കണ്ടു
  rationale: ὄχλος എന്നത് ‘ജനക്കൂട്ടം’ എന്നും πολύς അതിന്റെ വലുപ്പം സൂചിപ്പിക്കുന്നതുമാണ്; ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: അവന് അവരോടു മനസ്സലിവു തോന്നി
  rationale: ക്രിയ ആഴത്തിലുള്ള കരുണയെ സൂചിപ്പിക്കുന്നു. ‘മനസ്സലിവു തോന്നി’ എന്നത് വികാരത്തിന്റെ ആഴം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὅτι
  choice: ആയിരുന്നതിനാൽ
  rationale: യേശുവിന്റെ മനസ്സലിവിനുള്ള കാരണം വ്യക്തമാക്കുന്ന കാരണബന്ധം നിലനിർത്തുന്നു.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: ഇടയനില്ലാത്ത ആടുകളെപ്പോലെ
  rationale: മൂലത്തിലെ ഇടയ-ആട് രൂപകം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: ἤρξατο διδάσκειν αὐτοὺς πολλά
  choice: അവൻ അവരെ പല കാര്യങ്ങളും പഠിപ്പിക്കാൻ തുടങ്ങി
  rationale: ആരംഭത്തെ സൂചിപ്പിക്കുന്ന ഘടനയും πολλά എന്നതിലെ വൈവിധ്യമാർന്ന പഠിപ്പിക്കൽ ഉള്ളടക്കവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇടയനില്ലാത്ത ആടുകളുടെ രൂപകം
  choice: ‘ഇടയനില്ലാത്ത ആടുകളെപ്പോലെ’ എന്ന രൂപകം മുഖ്യവാക്യത്തിൽ അതേപടി നിലനിർത്തി.
  alternative: ‘ആത്മീയനേതൃത്വമില്ലാത്തവരെപ്പോലെ’ എന്ന് വ്യാഖ്യാനിച്ചു വികസിപ്പിക്കുക.
  rationale: ഈ പ്രയോഗം ദൈവജനത്തിന്റെയും അവരുടെ നേതാക്കളുടെയും പഴയനിയമ ഇടയപ്രതീതി പ്രതിധ്വനിപ്പിക്കാമെങ്കിലും, പരിഭാഷ അതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിർണയിക്കാതെ രൂപകം സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാപരമായ വായനയ്ക്ക് യോജിച്ച മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ കാരണബന്ധവും ഇടയരൂപകവും പഠിപ്പിക്കലിന്റെ വ്യാപ്തിയും നിലനിർത്തി.
