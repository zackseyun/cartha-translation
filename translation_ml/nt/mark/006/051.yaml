  text: καὶ ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον, καὶ ἐκόπασεν ὁ ἄνεμος. καὶ λίαν ⸂ἐκ περισσοῦ⸃ ἐν ἑαυτοῖς ⸀ἐξίσταντο,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: ml
  text: അവൻ അവരുടെ അടുക്കലേക്കു പടകിൽ കയറി; അപ്പോൾ കാറ്റ് ശമിച്ചു. അവർ ഉള്ളിൽ അത്യന്തം[a] വിസ്മയിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “അവർ ഉള്ളിൽ അളവറ്റവിധം അമ്പരന്നു”; ഗ്രീക്കിൽ തീവ്രത കൂട്ടുന്ന പദങ്ങൾ ഒന്നിനുമേൽ ഒന്നായി വരുന്നു: “വളരെ, അളവിനും അപ്പുറം.”'
    reason: lexical_alternative
  - marker: b
    text: “വിസ്മയിച്ചു” എന്നതിന് “തങ്ങളെത്തന്നെ മറക്കുംവിധം അമ്പരന്നു” എന്നും അർഥമാകാം; അവരുടെ വിസ്മയത്തിന്റെ അതിശക്തി ഇതു പ്രകടിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον
  choice: അവൻ അവരുടെ അടുക്കൽ പടകിൽ കയറി
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന ἀνέβηയും εἰς τὸ πλοῖονഉം ചേർന്ന് ഇവിടെ പടകിൽ പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; πρὸς αὐτούς എന്നത് അവൻ അവരുടെ അടുക്കലെത്തിയെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: കാറ്റ് ശമിച്ചു
  rationale: κοπάζω കാറ്റ് അടങ്ങുകയോ ശമിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ശമിച്ചു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; പൂർണമായി നിന്നുവെന്നതും ക്രമേണ കുറഞ്ഞുവെന്നതും തമ്മിലുള്ള സൂക്ഷ്മത അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: λίαν ἐκ περισσοῦ
  choice: അത്യന്തം
  rationale: ഗ്രീക്കിൽ തീവ്രത കൂട്ടിക്കാണിക്കുന്ന പദപ്രയോഗം മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ ശക്തമായി പ്രകടിപ്പിക്കുന്നു; മൂലത്തിലെ അസാധാരണമായ ഊന്നൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν ἑαυτοῖς
  choice: ഉള്ളിൽ
  rationale: ശിഷ്യരുടെ പ്രതികരണം അവരുടെ ആന്തരിക അനുഭവമായിരുന്നുവെന്ന പ്രതിഫലനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐξίσταντο
  choice: വിസ്മയിച്ചുപോയി
  rationale: ἐξίστημι ഇവിടെ അതിശക്തമായ അമ്പരപ്പോ വിസ്മയമോ സൂചിപ്പിക്കുന്നു. ‘വിസ്മയിച്ചുപോയി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മൂലത്തിന്റെ ശക്തിക്ക് യോജിച്ചതുമാണ്.
theological_decisions:
- issue: യേശുവിന്റെ പ്രവൃത്തിയോടുള്ള ശിഷ്യരുടെ പ്രതികരണത്തിന്റെ തീവ്രത
  choice: അവർ ഉള്ളിൽ അത്യന്തം വിസ്മയിച്ചുപോയി
  alternative: അവർ ഉള്ളിൽ അളവറ്റവിധം അമ്പരന്നുപോയി
  rationale: യേശുവിന്റെ അധികാരത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കാതെ, ശിഷ്യരുടെ അതിശക്തമായ പ്രതികരണം മാത്രം വിവരണാത്മകമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘പടക്’, ‘കാറ്റ് ശമിച്ചു’, ‘വിസ്മയിച്ചുപോയി’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പുകളുടെ മാർക്കർ ക്രമത്തിൽ ഉള്ളടക്കപരമായ പൊരുത്തക്കേട് തോന്നുന്നതിനാൽ, [a] തീവ്രതയേറിയ λίαν ἐκ περισσοῦ എന്ന പ്രയോഗത്തിനും [b] ἐξίσταντο എന്ന ക്രിയയുടെ ശക്തമായ പര്യായത്തിനും യുക്തിയായി ബന്ധിപ്പിച്ചിരിക്കുന്നു.
