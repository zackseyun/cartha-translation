revisions:
- from: രാജാവ് അത്യന്തം ദുഃഖിതനായെങ്കിലും, താൻ ചെയ്ത സത്യങ്ങളെയും വിരുന്നിനിരുന്നവരെയും[a] ഓർത്ത് അവളെ നിരസിക്കാൻ[b] അയാൾ ആഗ്രഹിച്ചില്ല.
  to: രാജാവ് അത്യന്തം ദുഃഖിതനായിത്തീർന്നെങ്കിലും, തന്റെ ശപഥങ്ങളും വിരുന്നിനിരുന്നവരും നിമിത്തം അവളെ നിരസിക്കാൻ അയാൾ ആഗ്രഹിച്ചില്ല.
