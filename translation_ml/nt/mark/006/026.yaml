    text: അഥവാ, ‘മേശയ്ക്കരികിൽ ചാരിക്കിടന്നവരും.’ ഗ്രീക്ക് പദം ഭക്ഷണസമയത്ത് പതിവായിരുന്ന ചാരിക്കിടക്കുന്ന ഇരിപ്പുരീതിയിൽ ഭക്ഷണം കഴിച്ചിരുന്നവരെ കൂടുതൽ അക്ഷരാർഥത്തിൽ സൂചിപ്പിക്കുന്നു.
