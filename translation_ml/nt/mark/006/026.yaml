  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: ml
  text: രാജാവ് അത്യന്തം ദുഃഖിതനായിത്തീർന്നെങ്കിലും, തന്റെ ശപഥങ്ങളും വിരുന്നിനിരുന്നവരും നിമിത്തം അവളെ നിരസിക്കാൻ അയാൾ ആഗ്രഹിച്ചില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος γενόμενος
  choice: അത്യന്തം ദുഃഖിതനായെങ്കിലും
  rationale: περίλυπος എന്ന പദത്തിന്റെ തീവ്രമായ ദുഃഖവും, മുഖ്യക്രിയയുമായുള്ള സന്ദർഭോചിതമായ concessive ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; γενόμενος സൂചിപ്പിക്കുന്ന അവസ്ഥാപ്രാപ്തി പ്രസംഗസന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ὁ βασιλεὺς
  choice: രാജാവ്
  rationale: മർക്കോസിന്റെ വിവരണത്തിൽ ഹെരോദാവിനെക്കുറിച്ച് ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള, പതിവായ മലയാളപരിഭാഷ.
- source_word: διὰ τοὺς ὅρκους
  choice: താൻ ചെയ്ത സത്യങ്ങളെ ... ഓർത്ത്
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ὅρκους എന്നതിനു നേർച്ചകളെക്കാൾ കൃത്യമായത് ‘സത്യങ്ങൾ’ ആണ്; അവ രാജാവ് ചെയ്തവയാണെന്നത് സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ἀνακειμένους
  choice: വിരുന്നിനിരുന്നവരെ
  rationale: ഔപചാരികമായി ചാരിക്കിടന്ന് ഭക്ഷണം കഴിച്ചിരുന്നവരെ സൂചിപ്പിക്കുന്ന പദം, ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമായി മനസ്സിലാകുന്ന വിധത്തിൽ ഭക്ഷണസന്ദർഭം നിലനിർത്തി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: οὐκ ἠθέλησεν
  choice: ആഗ്രഹിച്ചില്ല
  rationale: കഴിവില്ലായ്മയല്ല, മനസ്സില്ലായ്മയോ ഇച്ഛയോ ആണ് θέλω സൂചിപ്പിക്കുന്നത്.
- source_word: ἀθετῆσαι αὐτήν
  choice: അവളെ നിരസിക്കാൻ
  rationale: അവളുടെ അപേക്ഷ തള്ളിക്കളയുകയോ അവൾക്കു നൽകിയ വാക്ക് പാലിക്കാതിരിക്കുകയോ ചെയ്യാൻ രാജാവിനു മനസ്സില്ലായിരുന്നു എന്ന സന്ദർഭോചിത അർത്ഥം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: ദുഃഖവും തുടർന്നുള്ള തീരുമാനവും തമ്മിലുള്ള ബന്ധം
  choice: ‘ദുഃഖിതനായെങ്കിലും’ എന്ന concessive രൂപം
  alternative: ‘ദുഃഖിതനായി’ എന്ന കൂടുതൽ രൂപപരമായ അവതരണം
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ വിരുദ്ധസമുച്ചയം ഇല്ലെങ്കിലും, രാജാവിന്റെ ആഴമായ ദുഃഖത്തിനും അവളെ നിരസിക്കാതിരുന്നതിന്നും ഇടയിലെ പ്രസംഗപരമായ സംഘർഷം ഈ രൂപം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; അവന്റെ പ്രവൃത്തിയെ ന്യായീകരിക്കുന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ കാരണബന്ധവും മാനസിക സംഘർഷവും നിലനിർത്തുന്നു; പുരാതന വിരുന്നിരിപ്പിന്റെ വിശദാംശം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
