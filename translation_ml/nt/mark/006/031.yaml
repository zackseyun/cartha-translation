source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾതന്നെ ഒറ്റയ്ക്കു ഒരു വിജനസ്ഥലത്തേക്കു[a] വന്ന് അൽപ്പം വിശ്രമിക്കൂ.” ആളുകൾ അനേകർ വന്നും പോയുംകൊണ്ടിരുന്നതിനാൽ, ശിഷ്യന്മാർക്കു ഭക്ഷണം കഴിക്കാൻപോലും അവസരം ലഭിച്ചിരുന്നില്ല.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ഒറ്റപ്പെട്ട സ്ഥലം” അല്ലെങ്കിൽ “ജനവാസമില്ലാത്ത സ്ഥലം.” ഗ്രീക്കിലെ പദം ആധുനിക അർഥത്തിലുള്ള മരുഭൂമിയെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഭക്ഷണം കഴിക്കാൻപോലും സമയം ഉണ്ടായിരുന്നില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ഭൂതകാലം ഉപയോഗിച്ചു.
- source_word: Δεῦτε
  choice: വന്ന്
  rationale: ക്ഷണരൂപത്തിലുള്ള ആജ്ഞയാണ്; ജനക്കൂട്ടത്തിൽനിന്ന് വേറിട്ട സ്ഥലത്തേക്കുള്ള നീക്കത്തെ തുടർന്നുള്ള വാക്യഭാഗം വ്യക്തമാക്കുന്നു.
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: നിങ്ങൾ തനിച്ച്
  rationale: ഊന്നിപ്പറയുന്ന സർവനാമവും ‘വേറിട്ട്/സ്വകാര്യമായി’ എന്ന പ്രയോഗവും ചേർന്ന് ശിഷ്യന്മാർ മറ്റുള്ളവരിൽനിന്ന് മാറിനിൽക്കണമെന്ന ആശയം നൽകുന്നു.
- source_word: ἔρημον τόπον
  choice: ഒരു വിജനസ്ഥലം
  rationale: ജനവാസമില്ലാത്തതോ ഒറ്റപ്പെട്ടതോ ആയ സ്ഥലമാണ് ഉദ്ദേശിക്കുന്നത്; ആധുനിക അർഥത്തിലുള്ള മണൽമരുഭൂമി നിർബന്ധമല്ല.
- source_word: ἀναπαύσασθε ὀλίγον
  choice: അൽപ്പം വിശ്രമിക്കൂ
  rationale: പ്രവൃത്തിയിൽനിന്ന് കുറച്ചുനേരം മാറി ശക്തി വീണ്ടെടുക്കുക എന്ന മധ്യമാജ്ഞയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: വന്നും പോയുമിരുന്നവർ അനേകർ
  rationale: ആളുകളുടെ തുടർച്ചയായ വരവും പോക്കും അപൂർണ്ണഭൂതകാലസദൃശമായ മലയാളപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: ഭക്ഷണം കഴിക്കാൻപോലും അവസരം ലഭിച്ചിരുന്നില്ല
  rationale: εὐκαιρέω സമയം മാത്രമല്ല, അനുകൂല അവസരവും സൂചിപ്പിക്കുന്നു; οὐδέയുടെ ഊന്നൽ ‘പോലും’കൊണ്ട് പ്രകടമാക്കുന്നു.
