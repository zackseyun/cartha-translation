translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ἔρημος എന്നതിന് തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘മരുഭൂമി’ക്കു പകരം ‘വിജനസ്ഥലം’ ഉപയോഗിച്ചു. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട പദപ്രയോഗത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
