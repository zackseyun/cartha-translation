  to: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾതന്നെ ഒറ്റയ്ക്കു ഒരു വിജനസ്ഥലത്തേക്കു[a] വന്ന് അൽപ്പം വിശ്രമിക്കൂ.” ആളുകൾ അനേകർ വന്നും പോയുംകൊണ്ടിരുന്നതിനാൽ, ശിഷ്യന്മാർക്കു ഭക്ഷണം കഴിക്കാൻപോലും അവസരം ലഭിച്ചിരുന്നില്ല.[b]'
