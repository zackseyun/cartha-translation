source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν αὐτοῖς ἵνα μηδὲν αἴρωσιν εἰς ὁδὸν εἰ μὴ ῥάβδον μόνον, μὴ ⸂ἄρτον, μὴ πήραν⸃, μὴ εἰς τὴν ζώνην χαλκόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: ml
  text: യാത്രയ്ക്കായി ഒരു വടി മാത്രം ഒഴികെ മറ്റൊന്നും എടുക്കരുതെന്ന് അവൻ അവരോടു നിർദേശിച്ചു—അപ്പമോ സഞ്ചിയോ അരപ്പട്ടയിൽ ചെമ്പോ[a] വേണ്ട—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ചെമ്പ്’; ഇവിടെ ചെമ്പുനാണയങ്ങൾ, അതായത് അരപ്പട്ടയിൽ കൊണ്ടുനടന്ന പണം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: നിർദേശിച്ചു
  rationale: അധികാരത്തോടെ നൽകിയ നിർദേശം എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘കല്പിച്ചു’ എന്നതിനെക്കാൾ യാത്രാസംബന്ധമായ നിർദേശങ്ങളുടെ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: μηδὲν αἴρωσιν
  choice: മറ്റൊന്നും എടുക്കരുത്
  rationale: യാത്രയ്ക്കുള്ള സാധനങ്ങൾ കൂടെ കൊണ്ടുപോകരുത് എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; വടി എന്ന ഏക അപവാദം മുൻനിർത്തുന്നതിനാൽ ‘മറ്റൊന്നും’ എന്ന് വ്യക്തമാക്കി.
- source_word: εἰς ὁδὸν
  choice: യാത്രയ്ക്കായി
  rationale: വഴിയിലേക്കു എന്ന അക്ഷരാർഥത്തേക്കാൾ യാത്രയുടെ ഒരുക്കം എന്ന സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: ഒരു വടി മാത്രമല്ലാതെ
  rationale: ῥάβδον എന്നത് യാത്രക്കാരന്റെ വടിയെയും μόνον എന്നത് അതു മാത്രമാണ് അനുവദനീയമെന്ന ഊന്നലിനെയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἄρτον
  choice: അപ്പം
  rationale: പൊതുവായ ‘ഭക്ഷണം’ എന്നതിലേക്കു വിപുലീകരിക്കാതെ ഗ്രീക്കിലെ നിർദിഷ്ടമായ അപ്പത്തെ നിലനിർത്തുന്നു.
- source_word: πήραν
  choice: സഞ്ചി
  rationale: യാത്രയിൽ സാധനങ്ങളോ ഭക്ഷണമോ കരുതാനുള്ള സഞ്ചി എന്ന അർഥത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: ζώνην
  choice: അരപ്പട്ട
  rationale: പണം സൂക്ഷിക്കാവുന്ന അരയ്ക്കു ചുറ്റിയിരുന്ന പട്ടയെ ‘ബെൽറ്റ്’ എന്ന കടംപദമില്ലാതെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: χαλκόν
  choice: ചെമ്പ്
  rationale: ആദ്യം ലോഹത്തെ സൂചിപ്പിക്കുകയും സന്ദർഭത്തിൽ ചെമ്പുനാണയങ്ങളെയോ പണത്തെയോ അർഥമാക്കുകയും ചെയ്യുന്ന മൂലപദത്തിന്റെ രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; നാണയാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളിൽ അപ്പം/സഞ്ചി സംബന്ധിച്ച അടയാളങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടുന്നില്ല; ഗ്രീക്ക് മൂലത്തിൽ ആവശ്യമായ വിശദീകരണം χαλκόν എന്ന ‘ചെമ്പ്’ എന്ന പദത്തിനായതിനാൽ അതിന് മാത്രം [a] ചേർത്തു.
