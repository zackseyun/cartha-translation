    issue: Unwarranted contrastive enclitic in the second clause
    rationale: The ‘-ഓ’ in ‘സ്വീകരിക്കുന്നവനോ’ may introduce a contrastive nuance, whereas the Greek simply coordinates the clause with καί. The explicit final ‘not ... but’ supplies the intended contrast.
