source:
  edition: SBLGNT
  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: ml
  text: “ഇങ്ങനെയുള്ള കുട്ടികളിൽ ഒരാളെ എന്റെ നാമത്തിൽ സ്വീകരിക്കുന്നവൻ എന്നെ സ്വീകരിക്കുന്നു; എന്നെ സ്വീകരിക്കുന്നവൻ എന്നെയല്ല, എന്നെ അയച്ചവനെയാണ് സ്വീകരിക്കുന്നത്.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വീകരിക്കുന്നു’ എന്നതിന് പകരം വാക്യത്തിലുടനീളം ‘സ്വാഗതം ചെയ്യുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ ഓരോ പ്രയോഗത്തിലും ഒരേ ക്രിയയാണ് ആവർത്തിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: സ്വീകരിക്കുന്നവൻ
  rationale: അനിശ്ചിതമായ പൊതുവ്യവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: ഇങ്ങനെയുള്ള കുട്ടികളിൽ ഒരാളെ
  rationale: ἓν ... παιδίων എന്ന ഭാഗികബന്ധവും τοιούτων എന്ന ‘ഈ തരത്തിലുള്ള’ ഗുണസൂചനയും നിലനിർത്തുന്നു; ‘ഈ കുട്ടികളിൽ’ എന്ന് പറഞ്ഞ് അനാവശ്യമായ ദൃശ്യസൂചന ചേർക്കുന്നില്ല.
- source_word: δέξηται / δέχεται / δέχηται
  choice: സ്വീകരിക്കുക
  rationale: ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം വാക്യത്തിലുടനീളം നിലനിർത്തുകയും കുട്ടി—യേശു—അയച്ചവൻ എന്ന ബന്ധശൃംഖല വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ നാമത്തെ ആധാരമാക്കിയോ അവനോടുള്ള ബന്ധം നിമിത്തമോ ഉള്ള സ്വീകരണത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്ഥാപിതവുമായ മലയാളപ്രയോഗം.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: എന്നെയല്ല, ... എന്നാണ് സ്വീകരിക്കുന്നത്
  rationale: ഗ്രീക്കിലെ ശക്തമായ οὐκ ... ἀλλά വൈരുധ്യം വിശദീകരണപരമായി മൃദൂകരിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸν ἀποστείλαντά με
  choice: എന്നെ അയച്ചവനെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കർത്തൃവാചക പങ്കുപദത്തെ ബന്ധവാക്യസമാനമായ സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘എന്നെയല്ല, എന്നെ അയച്ചവനെ’ എന്ന അവസാന വൈരുധ്യത്തിന്റെ അർഥബലം
  choice: ‘എന്നെയല്ല, എന്നെ അയച്ചവനെയാണ് സ്വീകരിക്കുന്നത്’ എന്ന നേരിട്ടുള്ള വൈരുധ്യം നിലനിർത്തി.
  alternative: ‘എന്നെ മാത്രമല്ല, എന്നെ അയച്ചവനെയും സ്വീകരിക്കുന്നു’
  rationale: മൂലപാഠം ‘മാത്രമല്ല ... കൂടിയും’ എന്നു പറയുന്നില്ല. യേശുവിനെ സ്വീകരിക്കുന്നത് നിഷേധിക്കുകയല്ല, അവനെ സ്വീകരിക്കുന്നതിന്റെ പരമമായ ബന്ധപരമായ വ്യാപ്തി അയച്ചവനിലേക്കാണെന്ന് ഊന്നുന്ന വാക്യത്തിന്റെ യഥാർഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലുള്ള ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇങ്ങനെയുള്ള കുട്ടികളിൽ ഒരാളെ’ എന്ന രൂപം അല്പം ഔപചാരികമാണെങ്കിലും ഗ്രീക്കിലെ ഭാഗികബന്ധവും ‘ഈ തരത്തിലുള്ള’ എന്ന അർഥവും കൃത്യമായി സൂക്ഷിക്കുന്നു. നേരിട്ടുള്ള ഉദ്ധരണിയായി ചിഹ്നപ്പെടുത്തി.
