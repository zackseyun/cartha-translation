id: MRK.9.31
reference: Mark 9:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: ml
  text: 'കാരണം, അവൻ തന്റെ ശിഷ്യന്മാരെ പഠിപ്പിച്ചുകൊണ്ട് അവരോടു പറഞ്ഞിരുന്നത്: “മനുഷ്യപുത്രൻ മനുഷ്യരുടെ കൈകളിൽ ഏൽപ്പിക്കപ്പെടുന്നു[a]. അവർ അവനെ കൊല്ലും; കൊല്ലപ്പെട്ടശേഷം, മൂന്നു ദിവസം കഴിഞ്ഞ്[b] അവൻ ഉയിർത്തെഴുന്നേൽക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യരുടെ അധികാരത്തിന് ഏൽപ്പിക്കപ്പെടുന്നു.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “മനുഷ്യരുടെ കൈകളിലേക്ക്” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മൂന്നു ദിവസത്തിനുള്ളിൽ.” ഇവിടെ ഗ്രീക്ക് പാഠം “മൂന്നു ദിവസം കഴിഞ്ഞ്” എന്നാണ്; മറ്റു സ്ഥലങ്ങളിൽ ഇതേ ആശയം “മൂന്നാം ദിവസം” എന്നും പറയപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: പഠിപ്പിച്ചുകൊണ്ട്
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം പശ്ചാത്തലത്തിൽ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ തുടർച്ചാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരെ
  rationale: സുവിശേഷസന്ദർഭത്തിലെ ഗുരു-ശിഷ്യബന്ധം നിലനിർത്തുന്ന പതിവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: ἔλεγεν αὐτοῖς
  choice: അവരോടു പറഞ്ഞിരുന്നത്
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചയോ ആവർത്തനമോ സംരക്ഷിക്കുന്നു.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണവും ദാനീയേൽസംബന്ധിയായ സാധ്യതയുള്ള പ്രതിധ്വനിയും വ്യാഖ്യാനിച്ചുതീർക്കാതെ നിലനിർത്തുന്നു.
- source_word: παραδίδοται
  choice: ഏൽപ്പിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിന്റെ വരാനിരിക്കുന്നതും അരങ്ങേറിക്കൊണ്ടിരിക്കുന്നതുമായ ഭാവം നിലനിർത്തുന്നു; ‘ഒറ്റിക്കൊടുക്കപ്പെടുന്നു’ എന്ന് ചുരുക്കി അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: മനുഷ്യരുടെ കൈകളിൽ
  rationale: അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിലാകുക എന്ന മൂർത്തമായ ഗ്രീക്ക് ശൈലി സംരക്ഷിക്കുന്നു.
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: അവർ അവനെ കൊല്ലും
  rationale: വ്യക്തമായി പറയാത്ത മനുഷ്യകർത്താക്കളുള്ള ഭാവികാല ക്രിയയുടെ നേരിട്ടുള്ള അർഥം.
- source_word: ἀποκτανθεὶς
  choice: കൊല്ലപ്പെട്ടശേഷം
  rationale: കർമണി ഭൂതകാല കൃതന്തം പ്രധാനക്രിയയ്ക്കുമുമ്പുള്ള സംഭവക്രമം സൂചിപ്പിക്കുന്നതിനാൽ അത് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: മൂന്നു ദിവസം കഴിഞ്ഞ്
  rationale: μετάയും ദ്വിതീയാവിഭക്തിയും ചേർന്ന പ്രയോഗത്തിന്റെ സാധാരണ അർഥമായ ‘മൂന്നു ദിവസം കഴിഞ്ഞ്’ സംരക്ഷിക്കുന്നു; ‘മൂന്നാം ദിവസം’ എന്നു സമന്വയിപ്പിക്കുന്നില്ല.
- source_word: ἀναστήσεται
  choice: ഉയിർത്തെഴുന്നേൽക്കും
  rationale: ഭാവികാല മധ്യമരൂപത്തിന്റെ അകർമകമായ ‘എഴുന്നേൽക്കും/ഉയിർത്തെഴുന്നേൽക്കും’ എന്ന ഭാവം നൽകുന്നു; കർമണിയായ ‘ഉയിർപ്പിക്കപ്പെടും’ എന്ന് മാറ്റുന്നില്ല.
theological_decisions:
- issue: παραδίδοται എന്ന കർമണിപ്രയോഗത്തിന്റെ വ്യാപ്തിയും പ്രവർത്തകന്റെ അവ്യക്തതയും
  choice: ഏൽപ്പിക്കപ്പെടുന്നു
  alternative: ഒറ്റിക്കൊടുക്കപ്പെടുന്നു
  rationale: ഗ്രീക്ക് പദം ഒറ്റിക്കൊടുക്കൽ, പിടിച്ചുകൊടുക്കൽ, ദൈവാനുമതി എന്നിവയുമായി ബന്ധപ്പെട്ട അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്നു; പ്രവർത്തകനെ വ്യക്തമാക്കാതെ ആ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: Ὁ υἱὸς τοῦ ἀνθρώπουയും ἀνθρώπωνയും തമ്മിലുള്ള പദബന്ധം
  choice: മനുഷ്യപുത്രൻ … മനുഷ്യരുടെ കൈകളിൽ
  alternative: മനുഷ്യപുത്രൻ … ആളുകളുടെ കൈകളിൽ
  rationale: ഒരേ മൂലപദവുമായി ബന്ധപ്പെട്ട വാക്യത്തിലെ ശ്രാവ്യവും ആശയപരവുമായ വൈരുധ്യം മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- issue: ἀναστήσεται എന്ന ക്രിയയുടെ വാച്യം
  choice: അവൻ ഉയിർത്തെഴുന്നേൽക്കും
  alternative: അവൻ ഉയിർപ്പിക്കപ്പെടും
  rationale: ഇവിടെയുള്ള ഗ്രീക്ക് രൂപത്തെ കർമണിയായി മാറ്റാതെ അതിന്റെ അകർമക ഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. പ്രവചനവാക്യത്തിന്റെ ഗൗരവവും ഗ്രീക്കിലെ സംഭവക്രമവും നിലനിർത്തിയിട്ടുണ്ട്; ‘ഏൽപ്പിക്കപ്പെടുന്നു’ എന്നത് പ്രവർത്തകനെ അവ്യക്തമായി വിടുന്നു.
