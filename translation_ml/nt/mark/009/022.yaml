id: MRK.9.22
reference: Mark 9:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: ml
  text: പലപ്പോഴും അത് അവനെ തീയിലേക്കും വെള്ളങ്ങളിലേക്കും[a] എറിഞ്ഞിട്ടുണ്ട്—അവനെ നശിപ്പിക്കാനായി. എന്നാൽ അങ്ങേക്കു എന്തെങ്കിലും ചെയ്യാൻ കഴിയുമെങ്കിൽ, ഞങ്ങളോടു കരുണ തോന്നി ഞങ്ങളെ സഹായിക്കണമേ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെള്ളത്തിലേക്കും’; മൂലഗ്രീക്കിൽ ‘വെള്ളങ്ങൾ’ എന്ന ബഹുവചനമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഞങ്ങളോടു മനസ്സലിഞ്ഞ് ഞങ്ങളെ സഹായിക്കണമേ’ അല്ലെങ്കിൽ ‘ഞങ്ങളോടു ദയ കാണിച്ച് ഞങ്ങളെ സഹായിക്കണമേ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: പലപ്പോഴും
  rationale: ആവർത്തിച്ചുണ്ടായ സംഭവങ്ങളെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἔβαλεν
  choice: തള്ളിയിട്ടുണ്ട്
  rationale: ആവർത്തിച്ച ഭൂതകാലപ്രവൃത്തിയെ വർത്തമാനസംബന്ധത്തോടെ അവതരിപ്പിക്കുന്നു; പിതാവിന്റെ ഇതുവരെയുള്ള അനുഭവവിവരണത്തിന് യോജിക്കുന്നു.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: തീയിലേക്കും വെള്ളത്തിലേക്കും
  rationale: ആവർത്തിക്കുന്ന εἰς-ന്റെ ഊന്നൽ ‘-ലേക്കും ... -ലേക്കും’ എന്ന ഘടനയിൽ നിലനിർത്തുന്നു. ὕδατα ബഹുവചനമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു; പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായ മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: അവനെ നശിപ്പിക്കാനായി
  rationale: ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും ἀπόλλυμι എന്ന പദത്തെ ‘കൊല്ലുക’ എന്ന ശാരീരിക അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: എന്നാൽ അങ്ങേക്കു എന്തെങ്കിലും ചെയ്യാൻ കഴിയുമെങ്കിൽ
  rationale: τι എന്ന അനിശ്ചിതസർവനാമവും പിതാവിന്റെ മടിയും സംശയവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: βοήθησον ἡμῖν
  choice: ഞങ്ങളെ സഹായിക്കണമേ
  rationale: അടിയന്തരമായ അപേക്ഷയെ നേരിട്ടും ആദരപൂർവവും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: ഞങ്ങളോടു കരുണ തോന്നി
  rationale: ആഴമുള്ള അനുകമ്പയെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപത്തിന്റെ ആശയവും അപേക്ഷയുടെ വികാരതീവ്രതയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ കഴിവിനെക്കുറിച്ചുള്ള പിതാവിന്റെ മടിയും സംശയവും
  choice: ‘അങ്ങേക്കു എന്തെങ്കിലും ചെയ്യാൻ കഴിയുമെങ്കിൽ’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി
  alternative: ‘അങ്ങേക്കു കഴിയുമെങ്കിൽ’ എന്നോ കൂടുതൽ ഉറപ്പുള്ള അപേക്ഷയായോ മൃദൂകരിക്കുക
  rationale: ഗ്രീക്ക് വാചകത്തിലെ τιയും നിബന്ധനാപ്രയോഗവും പിതാവിന്റെ അനിശ്ചിതത്വം പ്രകടമാക്കുന്നു; തുടർന്നുള്ള വാക്യവുമായി ബന്ധപ്പെട്ട ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ എന്ന ആദരരൂപം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ വാക്യക്രമം കൃത്രിമമായി പകർത്താതെ, ഉദ്ദേശ്യവും പങ്കാളിക്രിയയുടെ ബന്ധവും വ്യക്തമായി നിലനിർത്തി.
