reference: Mark 9:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: ml
  text: 'കാരണം, നിങ്ങൾ മശിഹായുടേതാണെന്ന കാരണത്താൽ നിങ്ങൾക്കു ഒരു കപ്പ് വെള്ളം കുടിക്കാൻ കൊടുക്കുന്നവൻ ആരായാലും, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അയാൾ തന്റെ പ്രതിഫലം തീർച്ചയായും നഷ്ടപ്പെടുത്തുകയില്ല.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: ആരായാലും
  rationale: അനിശ്ചിത സാപേക്ഷ നിർമാണത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. γάρ മുൻവാക്യത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അസ്വാഭാവികമായ ‘എന്തെന്നാൽ’ ഒഴിവാക്കി വാക്യബന്ധം ആശയതലത്തിൽ നിലനിർത്തുന്നു.
- source_word: ποτίσῃ ὑμᾶς
  choice: നിങ്ങൾക്കു ... കുടിക്കാൻ തരുന്നവൻ
  rationale: ‘കുടിപ്പിക്കുക/കുടിക്കാൻ കൊടുക്കുക’ എന്ന ποτίζωയുടെ അർഥം, ποτήριον ὕδατος എന്ന നേരിട്ടുള്ള കർമത്തോടൊപ്പം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ποτήριον ὕδατος
  choice: ഒരു കപ്പ് വെള്ളം
  rationale: അളവിനെയും ലളിതമായ ആതിഥ്യപ്രവൃത്തിയെയും സാധാരണ ആധുനിക മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: നിങ്ങൾ മശിഹായുടേതാണെന്ന പേരിൽ
  rationale: ἐν ὀνόματι എന്ന പദപ്രയോഗം ഒഴിവാക്കാതെ ‘പേരിൽ’ എന്നു നിലനിർത്തുകയും, ὅτι χριστοῦ ἐστε എന്നതിനെ അതോടു ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു. ഗ്രീക്കിലെ അസാധാരണമായ ഘടനയുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലെ കാരണാർഥ വായനയിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവമുള്ള ഉറപ്പുവാക്യം മാന്യവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: തീർച്ചയായും നഷ്ടപ്പെടുത്തുകയില്ല
  rationale: οὐ μήയും aorist subjunctiveഉം ചേർന്ന ശക്തമായ നിഷേധം ‘തീർച്ചയായും ... ഇല്ല’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: തന്റെ പ്രതിഫലം
  rationale: μισθός ഇവിടെ കൂലിയേക്കാൾ ധാർമ്മികവും അന്തിമവുമായ പ്രതിഫലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രതിഫലം’ അനുയോജ്യമാണ്.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ ഉടമസ്ഥതാസൂചക പ്രയോഗം
  choice: മശിഹായുടേത്
  alternative: ക്രിസ്തുവിന്റേത്
  rationale: χριστοῦ ἐστε എന്നതിൽ Χριστός യേശുവിന്റെ പദവിയായി പ്രവർത്തിക്കുന്നു; അതിനാൽ മെസ്സിയാനിക അർഥം വ്യക്തമാക്കുന്ന ‘മശിഹാ’ ഉപയോഗിക്കുന്നു, ഒരു പേരുപോലെ മാത്രം വായിക്കാവുന്ന ‘ക്രിസ്തു’ ഒഴിവാക്കുന്നു.
- issue: ἐν ὀνόματι ὅτι എന്ന ഘടനയുടെ ബന്ധം
  choice: നിങ്ങൾ മശിഹായുടേതാണെന്ന പേരിൽ
  alternative: നിങ്ങൾ മശിഹായുടേതാകയാൽ
  rationale: മുഖ്യപാഠത്തിൽ ἐν ὀνόματι എന്ന ഘടകം ദൃശ്യമാക്കുന്നു; ὅτιയെ കാരണാർഥത്തിൽ ഗ്രഹിക്കാവുന്ന സ്വാഭാവിക വായന അടിക്കുറിപ്പിൽ നൽകുന്നു. ഇതിലൂടെ സ്രോതസ്സിലെ യഥാർഥ വ്യാകരണ-അർഥ പിരിമുറുക്ക് ഒറ്റവിധമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘കപ്പ്’, ‘പ്രതിഫലം’ തുടങ്ങിയ പ്രചാരത്തിലുള്ള പദങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ അസാധാരണമായ ἐν ὀνόματι ὅτι ഘടനയുടെ മുറുക്ക് മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
