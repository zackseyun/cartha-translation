  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: ml
  text: അവിടെ[a] അവരുടെ പുഴു ചാകുന്നില്ല, തീ അണയുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം ഏറ്റവും പുരാതനമായ ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ—നാലാം നൂറ്റാണ്ടിലെ സീനായിറ്റിക്കസ്, വത്തിക്കാനസ് എന്നിവ ഉൾപ്പെടെ—ആദ്യകാല കോപ്റ്റിക് പരിഭാഷകളിലും ഇല്ല. എന്നാൽ ബൈസന്റൈൻ ഭൂരിപക്ഷപാഠപരമ്പരയിലും ലത്തീൻ പാഠപരമ്പരയിലും ഇത് കാണപ്പെടുന്നു. 48-ാം വാക്യത്തിലെ (44-ാം വാക്യത്തിലെയും) അതേ വാക്കുകൾ ആവർത്തിച്ച് പിൽക്കാല പകർപ്പെഴുത്തിൽ ചേർന്നതാകാനാണ് സാധ്യത.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: പുഴു
  rationale: ചീഞ്ഞ വസ്തുക്കളെ തിന്നുന്ന പുഴുവിനെയോ ലാർവയെയോ സൂചിപ്പിക്കുന്നു. യെശയ്യാവ് 66:24-ലെ ഉദ്ധരണിയുമായുള്ള നേരിട്ടുള്ള ബന്ധവും പരമ്പരാഗത പ്രതിധ്വനിയും നിലനിർത്താൻ ‘പുഴു’ തെരഞ്ഞെടുത്തു.
- source_word: τελευτᾷ
  choice: ചാകുന്നില്ല
  rationale: τελευτάω എന്ന ക്രിയയ്ക്ക് ‘അവസാനിക്കുക’, ‘മരിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. പുഴുവിനെ കർത്താവാക്കിയിരിക്കുന്ന ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമായ ‘ചാകുന്നില്ല’ തുടർച്ചയായ വർത്തമാനഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: σβέννυται
  choice: കെട്ടുപോകുന്നതുമില്ല
  rationale: σβέννυμι തീ അണയുക, കെടുത്തപ്പെടുക എന്നർഥം നൽകുന്നു. ഗ്രീക്കിലെ കർമണ/മധ്യരൂപത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കാനും അണയാതെ തുടരുന്ന തീയുടെ ദൃശ്യം നിലനിർത്താനും ‘കെട്ടുപോകുന്നതുമില്ല’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സമാന്തരഘടനയും നിഷേധത്തിന്റെ തുടർച്ചയും നിലനിർത്തി; ‘അവരുടെ പുഴു’ എന്ന അസ്വസ്ഥത ഉണർത്തുന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ച് മൃദൂകരിച്ചിട്ടില്ല.
