  text: Πᾶς γὰρ πυρὶ ⸀ἁλισθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/049.yaml
  text: For everyone will be salted with fire[a][b].
translation:
  language: ml
  text: എന്തെന്നാൽ, എല്ലാവരും തീകൊണ്ട് ഉപ്പിടപ്പെടും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘എല്ലാവരും തീകൊണ്ട് സ്വാദുചേർക്കപ്പെടും.’ ഈ ദൃശ്യരൂപം വിധി, ശുദ്ധീകരണം, അല്ലെങ്കിൽ യാഗസംബന്ധമായ പ്രയോഗം എന്നിവയെ സൂചിപ്പിക്കാം; ലേവ്യർ 2:13 താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative
  - marker: b
    text: 'ചില കൈയെഴുത്തുപ്രതികൾ ഇങ്ങനെ കൂട്ടിച്ചേർക്കുന്നു: ‘എല്ലാ യാഗവും ഉപ്പുകൊണ്ട് ഉപ്പിടപ്പെടും.’'
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: എല്ലാവരും
  rationale: ഏകവചന പുൽലിംഗ കർത്തൃരൂപം ഇവിടെ നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, സന്ദർഭത്തിൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം ‘എല്ലാവരും’ ആണ്.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന് വിശദീകരണമായോ കാരണമായോ ഈ വാക്യം വരുന്നതു വ്യക്തമാക്കുന്നു.
- source_word: πυρὶ
  choice: തീകൊണ്ട്
  rationale: ദത്തിവ് ഇവിടെ ഉപകരണമോ മാധ്യമമോ സൂചിപ്പിക്കാം. ‘തീകൊണ്ട്’ എന്നത് ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു; രൂപകത്തിന്റെ അർഥം വിധി, ശുദ്ധീകരണം, യാഗം എന്നിവയിൽ ഒന്നായി ചുരുക്കുന്നില്ല.
- source_word: ἁλισθήσεται
  choice: ഉപ്പിടപ്പെടും
  rationale: ἁλίζω എന്ന ക്രിയയുടെ ഭാവികാല കർമണിപ്രയോഗം അക്ഷരാർഥത്തിൽ ഉപ്പിടുക എന്നാണ്. ‘തീകൊണ്ട് ഉപ്പിടപ്പെടും’ എന്ന അസാധാരണവും ഉദ്ദേശപൂർവവുമായ ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘തീകൊണ്ട് ഉപ്പിടപ്പെടും’ എന്ന രൂപകത്തിന്റെ വ്യാഖ്യാനം
  choice: വിധി, ശുദ്ധീകരണം, യാഗാർപ്പണം, ശിഷ്യത്വത്തിലെ പരിശോധന എന്നിവയിൽ ഏതെങ്കിലും ഒന്നിലേക്ക് അർഥം ചുരുക്കാതെ രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘എല്ലാവരും തീയിൽ ശുദ്ധീകരിക്കപ്പെടും’ അല്ലെങ്കിൽ ‘എല്ലാവരും അഗ്നിവിധിക്ക് വിധേയരാകും’ എന്നിങ്ങനെ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം സംക്ഷിപ്തവും പല സൂചനകളുള്ളതുമാണ്. തൊട്ടടുത്ത സന്ദർഭം ഒന്നിലധികം പരസ്പരബന്ധിത വ്യാഖ്യാനങ്ങൾക്ക് ഇട നൽകുന്നതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും യഥാർഥ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഉപ്പിടപ്പെടും’ അല്പം അസാധാരണമായി കേൾക്കുന്നുവെങ്കിലും മൂലപാഠത്തിലെ ശ്രദ്ധേയമായ രൂപകവും കർമണിപ്രയോഗവും കാത്തുസൂക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി.
