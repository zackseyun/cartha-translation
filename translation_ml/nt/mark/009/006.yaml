id: MRK.9.6
reference: Mark 9:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ᾔδει τί ⸀ἀποκριθῇ, ⸂ἔκφοβοι γὰρ ἐγένοντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: ml
  text: കാരണം, അവന് എന്തു മറുപടി പറയണമെന്ന് അറിയില്ലായിരുന്നു; കാരണം, അവർ അത്യന്തം ഭയന്നുപോയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾔδει
  choice: അറിയില്ലായിരുന്നു
  rationale: οἶδα ഇവിടെ അറിവിനെയോ ബോധ്യത്തെയോ സൂചിപ്പിക്കുന്നു; ഭൂതകാലസന്ദർഭത്തിൽ നിഷേധത്തോടുകൂടെ ‘അറിയില്ലായിരുന്നു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: τί ἀποκριθῇ
  choice: എന്തു മറുപടി പറയണമെന്ന്
  rationale: ἀποκρίνομαι വെറും ‘പറയുക’ എന്നതിലുപരി ‘മറുപടി പറയുക’ എന്നാണ്; τίയോടുകൂടിയ ആലോചനാത്മക ഭാവം ‘എന്തു ... എന്ന്’ എന്ന രൂപത്തിൽ വ്യക്തമാണ്.
- source_word: ἔκφοβοι
  choice: അത്യന്തം ഭയപ്പെട്ടുപോയിരുന്നു
  rationale: ἔκφοβος സാധാരണ ഭയത്തേക്കാൾ തീവ്രമായ അവസ്ഥയാണ്; ‘അത്യന്തം’ അതിന്റെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: ἐγένοντο
  choice: ഭയപ്പെട്ടുപോയിരുന്നു
  rationale: γίνομαι ഒരു അവസ്ഥയിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നു; ‘-പോയിരുന്നു’ എന്ന രൂപം വെറും നിലയല്ല, ഭയാവസ്ഥയിലായിത്തീർന്നതും പ്രകടമാക്കുന്നു.
- source_word: γὰρ ... γὰρ
  choice: കാരണം
  rationale: ആദ്യ γάρ മുൻവാക്യത്തിലെ പത്രോസിന്റെ സംസാരത്തിന് വിശദീകരണം നൽകുന്നു; രണ്ടാമത്തേത് അവന്റെ അറിവില്ലായ്മയ്ക്ക് കാരണം പറയുന്നു. മലയാളത്തിൽ രണ്ടും ആവർത്തിക്കുന്നത് കൃത്രിമമാകുന്നതിനാൽ ബന്ധം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് ഒരൊറ്റ ‘കാരണം’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ബഹുവചന ഉപവാക്യത്തിന്റെ കർത്താവ്
  choice: അവർ അത്യന്തം ഭയപ്പെട്ടുപോയിരുന്നു
  alternative: അവൻ അത്യന്തം ഭയപ്പെട്ടുപോയിരുന്നു
  rationale: ἔκφοβοι എന്ന വിശേഷണവും ἐγένοντο എന്ന ക്രിയയും ബഹുവചനത്തിലാണ്. സന്ദർഭത്തിൽ ഇത് പത്രോസിനെയും കൂടെയുള്ളവരെയും സൂചിപ്പിക്കുന്നു; ഏകവചനമാക്കാൻ ഗ്രീക്ക് വ്യാകരണം അടിസ്ഥാനമൊരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മറുപടി പറയുക’ എന്നത് മൂലത്തിലെ പ്രതികരണഭാവം നിലനിർത്തുന്നു; ‘അത്യന്തം ഭയപ്പെട്ടുപോയിരുന്നു’ തീവ്രതയും ഒരു അവസ്ഥയിലായിത്തീർന്നതും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
