  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. തുടർച്ചയായ പ്രവൃത്തികൾ മലയാളത്തിന്റെ സ്വാഭാവിക ക്രിയാശൃംഖലയിൽ അവതരിപ്പിച്ചു; ഗ്രീക്കിലെ സ്ഥലപരമായ ഊന്നലും ἐναγκαλισάμενος എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും നിലനിർത്തി.
