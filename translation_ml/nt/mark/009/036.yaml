source:
  edition: SBLGNT
  text: καὶ λαβὼν παιδίον ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν καὶ ἐναγκαλισάμενος αὐτὸ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: ml
  text: 'അവൻ ഒരു കുട്ടിയെ എടുത്ത് അവരുടെ നടുവിൽ നിർത്തി[a]. പിന്നെ ആ കുട്ടിയെ കൈകളിൽ ചേർത്തുപിടിച്ചുകൊണ്ട്[b] അവരോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ഇടയിൽ നിർത്തി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘നിൽക്കുമാറാക്കി’ എന്നാണ് അർഥം; സന്ദർഭത്തിൽ ‘നിർത്തി’ എന്നും ‘ഇടയിൽ നിർത്തി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആലിംഗനം ചെയ്തുകൊണ്ട്.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ കൈകളിലെടുക്കുക എന്നോ ആലിംഗനം ചെയ്യുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: എടുത്ത്
  rationale: ആദ്യ പ്രവൃത്തി മുഖ്യക്രിയയ്ക്കു മുമ്പ് നടക്കുന്നതായി സൂചിപ്പിക്കുന്ന aorist participle; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാശൃംഖലയായി ‘എടുത്ത്’ എന്നു നൽകി.
- source_word: παιδίον
  choice: ഒരു കുട്ടിയെ
  rationale: പദം പൊതുവായി ഒരു കുട്ടിയെ സൂചിപ്പിക്കുന്നു; പ്രായക്കുറവിന്റെ സൂക്ഷ്മാർഥം നിർബന്ധിച്ച് ‘കൊച്ചുകുട്ടി’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: ἔστησεν
  choice: നിർത്തി
  rationale: ἵστημι-യുടെ causative അർഥമായ ‘നിൽക്കുമാറാക്കി’ എന്ന മൂർത്തമായ പ്രവൃത്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν μέσῳ αὐτῶν
  choice: അവരുടെ നടുവിൽ
  rationale: സംഘത്തിന്റെ മധ്യത്തിലുള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്ഥലപരമായ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐναγκαλισάμενος
  choice: കൈകളിൽ ചേർത്തുപിടിച്ചുകൊണ്ട്
  rationale: കൈകളിലെടുക്കുക, ആലിംഗനം ചെയ്യുക എന്നീ അർഥസാധ്യതകൾ ഒരുമിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: λέγωയും അതിന്റെ പരോക്ഷ കർമവും മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
