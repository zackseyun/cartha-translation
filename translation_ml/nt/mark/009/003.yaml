source:
  edition: SBLGNT
  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: ml
  text: അവന്റെ വസ്ത്രങ്ങൾ മിന്നിത്തിളങ്ങുന്നതും അത്യന്തം വെളുത്തതുമായി തീർന്നു—ഭൂമിയിലെ ഒരു അലക്കുകാരനും[a] അവയെ ഇങ്ങനെ വെളുപ്പിക്കാൻ കഴിയാത്തവിധം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടത്തെ ഗ്രീക്ക് പദം തുണി ശുദ്ധീകരിക്കുകയും വെളുപ്പിക്കുകയും ചെയ്യുന്ന തൊഴിലാളിയെ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായി ഇതിനെ ‘വസ്ത്രശുദ്ധീകരകൻ’ എന്നും പറയാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάτια
  choice: വസ്ത്രങ്ങൾ
  rationale: പൊതുവായി ഉടുപ്പുകളെ സൂചിപ്പിക്കുന്ന പദം; പ്രത്യേകതരം മേലങ്കി എന്ന ആശയം അനാവശ്യമായി ചേർക്കാതെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: ἐγένετο
  choice: ആയിത്തീർന്നു
  rationale: രൂപാന്തരീകരണത്തിനിടയിൽ ഉണ്ടായ അവസ്ഥാമാറ്റം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: στίλβοντα
  choice: മിന്നിത്തിളങ്ങുന്നവ
  rationale: പ്രകാശം മിന്നുന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘മഹത്ത്വം’ പോലുള്ള വ്യാഖ്യാനപരമായ ദൈവശാസ്ത്രപദങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: λευκὰ λίαν
  choice: അത്യന്തം വെളുത്തവ
  rationale: λευκά എന്ന നിറപദത്തെയും λίαν നൽകുന്ന ശക്തമായ തീവ്രതയെയും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: γναφεύς
  choice: അലക്കുകാരൻ
  rationale: തുണി ശുദ്ധീകരിക്കുകയും വെളുപ്പിക്കുകയും ചെയ്യുന്ന തൊഴിലാളിയെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിലെ
  rationale: മാനുഷികമായ ഭൗമിക കഴിവിനോടുള്ള താരതമ്യം ചുരുക്കമായും നേരിട്ടും നൽകുന്നു.
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: അവയെ ഇങ്ങനെ വെളുപ്പിക്കാൻ കഴിയാത്തവിധം
  rationale: കഴിവില്ലായ്മയും ‘ഇങ്ങനെ/ഇത്രത്തോളം’ എന്ന താരതമ്യത്തിന്റെ തീവ്രതയും വ്യക്തമാക്കുന്നു; ‘അവയെ’ എന്നത് വസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായി പൂരിപ്പിച്ച കർമമാണ്.
theological_decisions:
- issue: രൂപാന്തരീകരണത്തിന്റെ ദൃശ്യഫലം
  choice: യേശുവിന്റെ വസ്ത്രങ്ങളിൽ ഉണ്ടായ അസാധാരണമായ ദൃശ്യപരിവർത്തനം മാത്രം വർണിക്കുക
  alternative: ‘മഹത്ത്വത്താൽ പ്രകാശിച്ചു’ എന്നതുപോലുള്ള വ്യാഖ്യാനപരമായ ഭാഷ ചേർക്കുക
  rationale: വാക്യം വസ്ത്രങ്ങളുടെ തിളക്കവും വെണ്മയും വർണിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രവ്യാഖ്യാനം ഈ വാക്യത്തിൽ നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘മിന്നിത്തിളങ്ങുന്നവയും അത്യന്തം വെളുത്തവയും’ എന്ന പ്രയോഗം മൂലത്തിലെ രണ്ട് വിവരണഘടകങ്ങളും തീവ്രതയും നിലനിർത്തുന്നു; നീണ്ട താരതമ്യം മലയാളത്തിൽ സുഗമമാക്കാൻ ഡാഷ് ഉപയോഗിച്ചു.
