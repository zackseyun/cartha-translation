  text: καὶ ἐπηρώτησεν ⸀αὐτούς· Τί συζητεῖτε πρὸς ⸀αὑτούς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/016.yaml
  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: ml
  text: 'അവൻ അവരോട് ചോദിച്ചു: “നിങ്ങൾ തമ്മിൽ എന്താണ് ചർച്ച ചെയ്യുന്നത്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ തമ്മിൽ എന്തിനെക്കുറിച്ചാണ് വാദിക്കുന്നത്?” സന്ദർഭമനുസരിച്ച് ഈ ക്രിയയ്ക്ക് ചർച്ച, സംവാദം, അല്ലെങ്കിൽ തർക്കം എന്ന അർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: ചോദിച്ചു
  rationale: നേരിട്ടുള്ള ചോദ്യം അവതരിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനസന്ദർഭത്തിൽ ἐπερωτάω എന്ന ക്രിയയുടെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: αὐτούς
  choice: അവരോട്
  rationale: സർവനാമത്തിന്റെ ബഹുവചനസൂചന നിലനിർത്തുകയും ഈ വാക്യം വ്യക്തമാക്കാത്ത ആളുകളെ പ്രത്യേകമായി തിരിച്ചറിയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: Τί
  choice: എന്താണ്
  rationale: ചർച്ചയുടെ കാരണമല്ല, അതിന്റെ വിഷയമോ ഉള്ളടക്കമോ ആണ് ഇവിടെ ചോദിക്കുന്നത്.
- source_word: συζητεῖτε
  choice: ചർച്ച ചെയ്യുന്നത്
  rationale: συζητέω എന്നതിന് ചർച്ച, വാദം, തർക്കം എന്നീ അർഥച്ചായകൾ ഉണ്ടാകാം. മുഖ്യപാഠത്തിലെ രൂപം ശത്രുതാഭാവം നിർബന്ധമാക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ശക്തമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πρὸς αὑτούς
  choice: നിങ്ങൾ തമ്മിൽ
  rationale: പരസ്പരമുള്ള ഇടപെടലിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളാവിഷ്കാരം.
- source_word: καὶ
  choice: —
  rationale: മലയാള ആഖ്യാനത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിനായി വാക്യാരംഭത്തിലെ καί പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്താതെ തുടർച്ചയിലൂടെ പ്രകടമാക്കി; ‘അപ്പോൾ’ എന്ന അധിക കാലസൂചന ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ സർവനാമത്തിന്റെ അവ്യക്തത നിലനിർത്തുന്നു; സംഭാഷണത്തിലെ സാധ്യതയുള്ള തർക്കഭാവം മുഖ്യപാഠത്തിൽ നിർബന്ധമാക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
