  text: Καὶ ⸂ἐλθόντες πρὸς τοὺς μαθητὰς εἶδον⸃ ὄχλον πολὺν περὶ αὐτοὺς καὶ γραμματεῖς συζητοῦντας ⸂πρὸς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: ml
  text: അവർ ശിഷ്യന്മാരുടെ അടുത്തെത്തിയപ്പോൾ, അവരുടെ ചുറ്റും ഒരു വലിയ ജനക്കൂട്ടത്തെയും ശിഷ്യന്മാരുമായി തർക്കിച്ചുകൊണ്ടിരുന്ന ശാസ്ത്രിമാരെയും കണ്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തർക്കിച്ചുകൊണ്ടിരുന്ന’ എന്നതിന് ‘വാദിച്ചുകൊണ്ടിരുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ചർച്ചയെയോ വാദപ്രതിവാദത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ സന്ദർഭം തർക്കഭാവം സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: ശിഷ്യന്മാരുടെ അടുത്തെത്തിയപ്പോൾ
  rationale: കർത്തൃക്രിയയായ εἶδον-നോടു സമയബന്ധം പുലർത്തുന്ന aorist participle സ്വാഭാവികമായ മലയാളത്തിൽ ‘എത്തിയപ്പോൾ’ എന്നു നൽകി; πρός സൂചിപ്പിക്കുന്ന വ്യക്തികളിലേക്കുള്ള ചലനം ‘അടുത്തെത്തി’ വ്യക്തമാക്കുന്നു.
- source_word: εἶδον
  choice: കണ്ടു
  rationale: ആഖ്യാനത്തിലെ ലളിതമായ aorist ക്രിയയുടെ നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ὄχλον πολύν
  choice: ഒരു വലിയ ജനക്കൂട്ടം
  rationale: ὄχλος എന്നതിന്റെ കൂട്ടാർഥവും πολύς സൂചിപ്പിക്കുന്ന വലുപ്പവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: περὶ αὐτούς
  choice: അവരുടെ ചുറ്റും
  rationale: περί ഇവിടെ സൂചിപ്പിക്കുന്ന സ്ഥലപരമായ അർഥം നേരിട്ട് പകർന്നു; ‘അവർ’ എന്നത് ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്നു.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷങ്ങളിൽ യഹൂദ തിരുവെഴുത്ത്-നിയമ വിദഗ്ധരെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും ഇപ്പോഴും മനസ്സിലാക്കാവുന്നതുമായ മലയാള പദം.
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: അവരുമായി തർക്കിച്ചുകൊണ്ടിരുന്ന
  rationale: സന്ദർഭത്തിലെ സംഘർഷഭാവം കണക്കിലെടുത്ത് συζητέω-യുടെ സംവാദം/വാദപ്രതിവാദം എന്ന അർഥപരിധിയിൽ ‘തർക്കിക്കുക’ തിരഞ്ഞെടുത്തു; അപൂർണ്ണകാലഭാവം ‘കൊണ്ടിരുന്ന’ വഴി പ്രകടമാക്കി.
