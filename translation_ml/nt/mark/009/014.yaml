  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുഗ്രാഹ്യവുമായ മലയാളം. ഗ്രീക്ക് വാക്യഘടനയിലെ വിവരക്രമം സാധ്യമായത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവികമായ സമയോപവാക്യവും ക്രിയാവിന്യാസവും ഉപയോഗിച്ചു.
