  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: ml
  text: 'അപ്പോൾ ഒരു മേഘം വന്ന് അവരെ നിഴലാൽ മൂടി. മേഘത്തിൽനിന്ന് ഒരു ശബ്ദം ഉണ്ടായി: “ഇവൻ എന്റെ പ്രിയപുത്രൻ; ഇവനെ ശ്രദ്ധിച്ചു കേൾക്കുക[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവന്റെ വാക്കു കേൾക്കുക.” ഈ കല്പന കേവലം ശബ്ദം കേൾക്കുന്നതല്ല, ശ്രദ്ധയോടെ ചെവികൊടുക്കുന്നതും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: വന്നു / ഉണ്ടായി
  rationale: മേഘത്തോടൊപ്പം പെട്ടെന്നുള്ള വരവിനെയും ശബ്ദത്തോടൊപ്പം സംഭവിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്ന സന്ദർഭാനുസൃതമായ സ്വാഭാവിക മലയാളപ്രയോഗങ്ങൾ; ഗ്രീക്കിലെ സംഭവാത്മകശക്തി നിലനിർത്തുന്നു.
- source_word: νεφέλη
  choice: മേഘം
  rationale: ദൈവസാന്നിധ്യത്തിന്റെ പശ്ചാത്തലസൂചന വ്യാഖ്യാനമായി വികസിപ്പിക്കാതെ സാധാരണ നിഘണ്ടുവർത്ഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἐπισκιάζουσα
  choice: നിഴലാൽ മൂടി
  rationale: നിഴൽ വീഴ്ത്തി മൂടുക എന്ന ദൃശ്യബിംബം നിലനിർത്തുകയും, വെറും ‘മൂടി’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തുനിൽക്കുകയും ചെയ്യുന്നു.
- source_word: αὐτοῖς
  choice: അവരെ
  rationale: ക്രിയയോടുള്ള ദത്തിവിഭക്തിബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി കർമരൂപത്തിൽ നൽകുന്നു.
- source_word: φωνή
  choice: ഒരു ശബ്ദം
  rationale: ഇവിടെ വ്യക്തമായി ഉച്ചരിക്കപ്പെട്ട സ്വർഗീയ വചനത്തെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘സംസാരിച്ചു’ എന്ന ക്രിയ ചേർക്കുന്നില്ല.
- source_word: ἐκ τῆς νεφέλης
  choice: മേഘത്തിൽനിന്ന്
  rationale: ἐκ എന്നതിന്റെ ഉറവിട/പുറത്തുനിന്നുള്ള അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὁ υἱός μου
  choice: എന്റെ പ്രിയപുത്രൻ
  rationale: ‘എന്റെ പുത്രൻ’ എന്ന ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; തുടർന്നുള്ള ἀγαπητός മലയാളത്തിൽ സംയുക്തമായി സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: ὁ ἀγαπητός
  choice: പ്രിയ
  rationale: സ്നേഹിക്കപ്പെട്ടവൻ എന്ന ശക്തി സംക്ഷിപ്തമായും മാന്യമായും നൽകുന്നു; അനാവശ്യമായ സിദ്ധാന്തവികാസം ഒഴിവാക്കുന്നു.
- source_word: ἀκούετε αὐτοῦ
  choice: ഇവനെ ശ്രദ്ധിച്ചു കേൾക്കുക
  rationale: കേവലം ശബ്ദം ഗ്രഹിക്കുന്നതല്ല, ശ്രദ്ധയോടെ ചെവികൊടുക്കുക എന്ന വർത്തമാനകാല കല്പനയുടെ ശക്തി പ്രകടമാക്കുന്നു; ‘അനുസരിക്കുക’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ തിരിച്ചറിയലിനെക്കുറിച്ചുള്ള ദൈവിക പ്രഖ്യാപനം
  choice: “ഇവൻ എന്റെ പ്രിയപുത്രൻ” എന്ന നേരിട്ടുള്ള പ്രഖ്യാപനം
  alternative: ബന്ധത്തെ വിശദീകരിക്കുന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം
  rationale: ഗ്രീക്ക് വാക്യം യേശുവിനെ ദൈവത്തിന്റെ പുത്രനായി നേരിട്ട് വെളിപ്പെടുത്തുന്നു; പാഠത്തിൽ ഇല്ലാത്ത സിദ്ധാന്തവിശദീകരണം ചേർക്കാതെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി നിലനിർത്തുന്നു.
- issue: ἀκούετε αὐτοῦ എന്ന കല്പനയുടെ വ്യാപ്തി
  choice: “ഇവനെ ശ്രദ്ധിച്ചു കേൾക്കുക”
  alternative: “ഇവന്റെ വാക്കു കേൾക്കുക” / “ഇവനെ അനുസരിക്കുക”
  rationale: കല്പനയിൽ ശ്രദ്ധയോടെ കേൾക്കുകയും അതിന് ചെവികൊടുക്കുകയും ചെയ്യുന്ന അർഥമുണ്ട്; എന്നാൽ ഗ്രീക്കിൽ ‘അനുസരിക്കുക’ എന്നർഥമുള്ള പ്രത്യേക ക്രിയ ഉപയോഗിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ദൈവിക പ്രഖ്യാപനത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ‘നിഴലാൽ മൂടി’ എന്ന പ്രയോഗം മൂലത്തിലെ ദൃശ്യബിംബം സംരക്ഷിക്കുന്നു; ഉദ്ധരണിയിൽ ലളിതവും ശക്തവുമായ കല്പനാരൂപം ഉപയോഗിച്ചു.
