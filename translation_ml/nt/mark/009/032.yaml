reference: Mark 9:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα, καὶ ἐφοβοῦντο αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/032.yaml
  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: ml
  text: എന്നാൽ അവർ ആ വാക്ക് മനസ്സിലാക്കിയില്ല[a]; അവനോടു ചോദിക്കാൻ അവർ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആ പ്രസ്താവന’ അല്ലെങ്കിൽ ‘ആ പറഞ്ഞത്.’ ഗ്രീക്കിലെ ῥῆμα എന്ന പദം സംസാരിച്ച വാക്കിനെയോ പറഞ്ഞതിനെയോ പ്രസ്താവനയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: എന്നാൽ അവർ
  rationale: δέ ഇവിടെ യേശുവിന്റെ മുൻപ്രസ്താവനയോടും ശിഷ്യന്മാരുടെ പ്രതികരണത്തോടും ഉള്ള നേരിയ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ οἱ എന്നത് ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവർ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἠγνόουν
  choice: അർഥം മനസ്സിലാക്കിയില്ല
  rationale: ἀγνοέω ഇവിടെ അറിയാതിരിക്കുക എന്നതിലുപരി പറഞ്ഞതിന്റെ അർഥം ഗ്രഹിക്കാതിരിക്കുക എന്ന ആശയമാണ് നൽകുന്നത്. അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർന്നുനിന്ന അവസ്ഥ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലപ്രയോഗത്തിലൂടെ അറിയിച്ചു.
- source_word: τὸ ῥῆμα
  choice: ആ വാക്ക്
  rationale: ῥῆμα ഇവിടെ യേശു തൊട്ടുമുമ്പ് പറഞ്ഞ സന്ദേശത്തെയോ പ്രസ്താവനയെയോ സൂചിപ്പിക്കുന്നു. ‘ആ വാക്ക്’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ്; പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: ἐφοβοῦντο
  choice: അവർ ഭയപ്പെട്ടു
  rationale: φοβέομαι ശിഷ്യന്മാരുടെ ഭയാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഭയപ്പെട്ടു’ എന്നത് സ്വാഭാവികമായി ആ ആശയം നൽകുന്നു.
- source_word: αὐτὸν
  choice: അവനോടു
  rationale: സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു; ἐπερωτῆσαι എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ ‘അവനോടു ചോദിക്കാൻ’ എന്ന ദത്തിവിഭക്തിപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: ἐπερωτῆσαι
  choice: ചോദിക്കാൻ
  rationale: ἐπερωτάω എന്നത് ചോദിക്കുക, അന്വേഷിക്കുക എന്നീ അർഥങ്ങൾ നൽകുന്നു; ഇവിടെ ‘ചോദിക്കാൻ’ ഏറ്റവും നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
