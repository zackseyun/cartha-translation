source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “ ‘നിനക്കു കഴിയുമെങ്കിൽ’ എന്നോ?[a] വിശ്വസിക്കുന്നവന് എല്ലാം സാധ്യമാണ്.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ആ ‘നിനക്കു കഴിയുമെങ്കിൽ’ എന്നതോ?” മുൻവാക്യത്തിൽ പിതാവ് പറഞ്ഞ വാക്കുകൾ യേശു ആവർത്തിച്ച് ചോദ്യം ചെയ്യുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “വിശ്വസിക്കുന്നവൻ” എന്നത് “വിശ്വാസമുള്ളവൻ” എന്നോ “ആശ്രയിക്കുന്നവൻ” എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: ‘നിനക്കു കഴിയുമെങ്കിൽ’ എന്നോ?
  rationale: നപുംസകലിംഗ നിർദേശകപദമായ Τὸ, പിതാവ് മുമ്പ് പറഞ്ഞ വാക്കുകളെ ഉദ്ധരിച്ച് ഊന്നലോടെ തിരിച്ചുപറയുന്നതായി സൂചിപ്പിക്കുന്നു. ഉദ്ധരിച്ച വാക്യശകലത്തിനുശേഷമുള്ള ‘എന്നോ?’ ആ വെല്ലുവിളിയുടെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: δύνῃ
  choice: നിനക്കു കഴിയുമെങ്കിൽ
  rationale: δύναμαι എന്നതിന് ‘കഴിയുക/പ്രാപ്തനായിരിക്കുക’ എന്നാണ് അർഥം; നേരിട്ടുള്ള സംഭാഷണത്തിൽ ‘നിനക്കു കഴിയുമെങ്കിൽ’ സ്വാഭാവികമാണ്.
- source_word: πάντα
  choice: എല്ലാം
  rationale: നപുംസക ബഹുവചനമായ πάνταയുടെ വ്യാപകതയും വാക്യത്തിന്റെ സംക്ഷിപ്തമായ ഊന്നലും ‘എല്ലാം’ നിലനിർത്തുന്നു.
- source_word: δυνατὰ
  choice: സാധ്യമാണ്
  rationale: ഈ വിധേയപ്രയോഗത്തിൽ δυνατός എന്നത് ‘സാധ്യമായത്’ എന്ന അർഥത്തിലാണ്.
- source_word: τῷ πιστεύοντι
  choice: വിശ്വസിക്കുന്നവന്
  rationale: വർത്തമാനകാല കൃദന്തരൂപം വിശ്വസിക്കുന്ന വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘വിശ്വാസിക്ക്’ എന്ന പേരുരൂപത്തേക്കാൾ കൃദന്തരൂപത്തിന്റെ ചലനാത്മകത ഇത് നിലനിർത്തുന്നു.
- source_word: πιστεύοντι
  choice: വിശ്വസിക്കുന്ന
  rationale: πιστεύωയുടെ നേരിട്ടുള്ള അർഥം ‘വിശ്വസിക്കുക’ എന്നാണ്; സന്ദർഭത്തിൽ ‘ആശ്രയിക്കുന്ന’ എന്നും മനസ്സിലാക്കാം, എന്നാൽ മുഖ്യപാഠത്തിൽ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘എല്ലാം സാധ്യമാണ്’ എന്നതിന്റെ വ്യാപ്തി
  choice: മൂലഗ്രീക്കിലുള്ള നിരുപാധികമായി കേൾക്കുന്ന പ്രസ്താവനയ്ക്ക് മുഖ്യപാഠത്തിൽ വിശദീകരണപരമായ പരിധികൾ ചേർത്തില്ല.
  alternative: ‘ദൈവത്തോടുകൂടെ, വിശ്വസിക്കുന്നവന് എല്ലാം സാധ്യമാണ്’ അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ ശക്തിയിൽ വിശ്വസിക്കുന്നവന് എല്ലാം സാധ്യമാണ്.’
  rationale: ഈ വാക്യത്തിൽ ഗ്രീക്ക് പാഠം ‘ദൈവത്തോടുകൂടെ’ എന്നു വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വിശ്വാസത്തെ സ്വതന്ത്രമായ മാനുഷിക ശക്തിയാക്കാതിരിക്കേണ്ട വിശാലമായ തിരുവെഴുത്തുസന്ദർഭം അംഗീകരിച്ചുകൊണ്ടുതന്നെ, ഈ വാക്യത്തിന്റെ ആലങ്കാരിക ശക്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും വിവർത്തനം ശമിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ വാക്യശകലവും ‘എന്നോ?’ എന്ന ചോദ്യംചെയ്യുന്ന രൂപവും യേശുവിന്റെ pointed echo നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
