id: MRK.9.47
reference: Mark 9:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: ml
  text: നിന്റെ കണ്ണ് നിന്നെ ഇടറാൻ ഇടയാക്കുന്നെങ്കിൽ, അതിനെ എറിഞ്ഞുകളയുക. രണ്ടു കണ്ണുകളോടെ ഗെഹെന്നയിലേക്ക്[a] എറിയപ്പെടുന്നതിനെക്കാൾ, ഒരു കണ്ണോടെ ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നതാണ് നിനക്കു നല്ലത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നരകത്തിലേക്ക്.’ ‘ഗെഹെന്ന’ എന്ന ഗ്രീക്കുപദത്തിന് ഹിന്നോം താഴ്വരയുമായി ബന്ധമുള്ള ഉത്ഭവമുണ്ട്; അത് അന്തിമ ന്യായവിധിയെ സൂചിപ്പിക്കാനും ഉപയോഗിക്കപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: ഇടറാൻ ഇടയാക്കുന്നെങ്കിൽ
  rationale: പാപത്തിലേക്കോ വീഴ്ചയിലേക്കോ നയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഇടർച്ചയുടെ രൂപകം നിലനിർത്തുന്നു; അർഥത്തെ ‘പാപം ചെയ്യിക്കുക’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἔκβαλε
  choice: എറിഞ്ഞുകളയുക
  rationale: ἐκβάλλω എന്ന ക്രിയയുടെ ശക്തമായ ‘പുറത്തേക്ക് എറിയുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘ചൂഴ്ന്നെടുക്കുക’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: καλόν
  choice: നിനക്കു നല്ലത്
  rationale: ഗ്രീക്കിലെ ‘നല്ലത് ... എന്നതിനെക്കാൾ’ എന്ന താരതമ്യഘടന നേരിട്ട് നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: μονόφθαλμον
  choice: ഒറ്റക്കണ്ണനായി
  rationale: ‘ഒരു കണ്ണ് മാത്രമുള്ളവനായി’ എന്ന മൂർത്തമായ അർഥം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: പുതിയനിയമത്തിലെ പ്രയോഗത്തിന്റെ പരിചിതത്വവും ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്ന സുതാര്യമായ പരിഭാഷയാണ്.
- source_word: βληθῆναι
  choice: എറിയപ്പെടുക
  rationale: βάλλωയുടെ കർമണിപ്രയോഗം കൃത്യമായി നൽകുകയും ἔκβαλε എന്ന മുൻക്രിയയോടുള്ള ശബ്ദബന്ധം ഭാഗികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γέενναν
  choice: ഗെഹെന്ന
  rationale: ഹിന്നോം താഴ്വരയുമായി ബന്ധപ്പെട്ട പ്രത്യേക യഹൂദ അന്ത്യന്യായ പദാവലി പൊതുവായ ‘നരകം’ എന്ന പദത്തിൽ ലയിപ്പിക്കാതെ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ γέεννα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഗെഹെന്ന
  alternative: നരകം
  rationale: മൂലപാഠം പൊതുവായ അധോലോകപദമല്ല, γέεννα എന്ന പ്രത്യേക പദമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ചരിത്രപരവും അന്ത്യന്യായപരവുമായ പ്രത്യേകത പ്രധാനപാഠത്തിൽ നിലനിർത്തി, വായനക്കാർക്കു പരിചിതമായ പകരം പദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ഇടർച്ചയുടെ രൂപകവും ‘എറിയുക/എറിയപ്പെടുക’ എന്ന ശക്തമായ സമാന്തരപ്രയോഗവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് സൂചിക അർഥപരമായി ബന്ധപ്പെട്ട ‘ഗെഹെന്ന’ എന്ന പദത്തിനുശേഷമാണ് നൽകിയിരിക്കുന്നത്.
