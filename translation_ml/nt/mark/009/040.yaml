  text: ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ἡμῶν, ὑπὲρ ἡμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/040.yaml
  text: For whoever is not against us is for us[a].
translation:
  language: ml
  text: കാരണം, നമുക്ക് എതിരല്ലാത്തവൻ നമ്മുടെ പക്ഷത്താണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമുക്കുവേണ്ടിയാണ്.’ ὑπὲρ ἡμῶν എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് ‘നമ്മുടെ പക്ഷത്ത്’ എന്നും ‘നമുക്കുവേണ്ടി’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: …വൻ
  rationale: സാമാന്യവും അനിശ്ചിതവുമായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന substantival relative pronoun മലയാളത്തിൽ ‘നമുക്ക് എതിരല്ലാത്തവൻ’ എന്ന ബന്ധവാക്യഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിന് വിശദീകരണം നൽകുന്ന ബന്ധം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ ‘കാരണം’ എന്നു നൽകി.
- source_word: οὐκ ἔστιν
  choice: അല്ലാത്തവൻ
  rationale: നിഷേധാത്മക copula ബന്ധവാക്യത്തിനുള്ളിൽ ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: καθ’ ἡμῶν
  choice: നമുക്ക് എതിര്
  rationale: κατά + genitive സൂചിപ്പിക്കുന്ന പ്രതിരോധമോ എതിർപ്പോ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ὑπὲρ ἡμῶν
  choice: നമ്മുടെ പക്ഷത്ത്
  rationale: വാക്യത്തിലെ ‘എതിര്’ എന്നതിനോടുള്ള സമാന്തരവിരുദ്ധത സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘നമുക്കുവേണ്ടി’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐστιν
  choice: ആണ്
  rationale: അവസാന copula നേരിട്ട് വർത്തമാനകാലത്തിൽ പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ‘നമുക്ക് എതിര്’/‘നമ്മുടെ പക്ഷത്ത്’ എന്ന പ്രയോഗങ്ങളുടെ വ്യാപ്തി
  choice: ഗ്രീക്കിലെ ഒന്നാംപുരുഷ ബഹുവചനബന്ധം മാറ്റാതെ നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന് എതിരല്ലാത്തവൻ ദൈവത്തിന്റെ പക്ഷത്താണ്’ അല്ലെങ്കിൽ ‘നമ്മുടെ ദൗത്യത്തെ എതിർക്കാത്തവൻ നമ്മുടെ പക്ഷത്താണ്.’
  rationale: മൂലപാഠം ‘നമുക്ക്’ എന്നാണ് പറയുന്നത്; ‘ദൈവം’ എന്നോ ‘ദൗത്യം’ എന്നോ വികസിപ്പിക്കുന്നത് വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കും. അതിനാൽ സന്ദർഭം നിർണ്ണയിക്കേണ്ട ദൈവശാസ്ത്രപരമായ വ്യാപ്തി തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എതിര്/പക്ഷം’ എന്ന സമാന്തരവിരുദ്ധത വായനാസൗകര്യത്തോടെ സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
