reference: Mark 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: ml
  text: 'ജനക്കൂട്ടത്തിൽനിന്ന് ഒരാൾ അവനോടു മറുപടി പറഞ്ഞു: “ഗുരുവേ, സംസാരിക്കാത്ത ഒരു ആത്മാവുള്ള എന്റെ മകനെ ഞാൻ അങ്ങയുടെ അടുക്കൽ കൊണ്ടുവന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “സംസാരിക്കാൻ കഴിയാതാക്കുന്ന ഒരു ആത്മാവുള്ള എന്റെ മകനെ ഞാൻ അങ്ങയുടെ അടുക്കൽ കൊണ്ടുവന്നു.”'
    reason: ἄλαλον എന്ന വിശേഷണം ആത്മാവിനെ നേരിട്ട് വിശേഷിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അത് മകനെ സംസാരിക്കാൻ കഴിയാത്തവനാക്കുന്ന ആത്മാവ് എന്ന ഫലാർത്ഥവും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: സുവിശേഷവിവരണത്തിലെ സാധാരണ പ്രതികരണക്രിയയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: ജനക്കൂട്ടത്തിൽ ഒരാൾ
  rationale: ഭാഗികത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗവും അനിശ്ചിത ഏകവചനവും നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഒരു മനുഷ്യൻ’ എന്നു ചേർക്കുന്നില്ല.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: അധ്യാപകനെ അഭിസംബോധന ചെയ്യുന്ന ദιδάσκαλος എന്ന പദത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: ἤνεγκα
  choice: കൊണ്ടുവന്നു
  rationale: ഗ്രീക്ക് എയോറിസ്റ്റിനെ സന്ദർഭോചിതമായ ലളിത ഭൂതകാലത്തിൽ നൽകുന്നു.
- source_word: υἱόν
  choice: മകനെ
  rationale: പ്രായം അനുമാനിക്കുന്ന ‘കുട്ടി’ എന്നതിനു പകരം മൂലത്തിലെ കുടുംബബന്ധം കൃത്യമായി സൂക്ഷിക്കുന്നു.
- source_word: πρὸς σέ
  choice: അങ്ങയുടെ അടുക്കൽ
  rationale: കൊണ്ടുവരുക എന്ന ക്രിയയോടൊപ്പം πρός സൂചിപ്പിക്കുന്ന ലക്ഷ്യത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അഭിസംബോധനയിലെ ആദരവും കാക്കുന്നു.
- source_word: ἔχοντα
  choice: ഉള്ള
  rationale: ‘എന്റെ മകൻ’ എന്നതിനെ വിശേഷിപ്പിക്കുന്ന വർത്തമാന കൃതന്തത്തിന്റെ ബന്ധം ചുരുക്കമായ മലയാള വിശേഷണഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: πνεῦμα ἄλαλον
  choice: സംസാരിക്കാത്ത ഒരു ആത്മാവ്
  rationale: ἄλαλον എന്നത് ആത്മാവിനെ വ്യാകരണപരമായി വിശേഷിപ്പിക്കുന്നതുപോലെ നേരിട്ട് നൽകുന്നു; ആത്മാവ് ബാലനെ സംസാരിക്കാൻ കഴിയാത്തവനാക്കുന്നു എന്ന സാദ്ധ്യമായ അർത്ഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഭൂതോച്ചാടനസന്ദർഭത്തിലെ πνεῦμα എന്ന പദത്തിന്റെ അർത്ഥം
  choice: ആത്മാവ്; സന്ദർഭം ദുഷ്ടാത്മാവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘ദുഷ്ട’ എന്നു ചേർക്കുന്നില്ല
  alternative: ദുഷ്ടാത്മാവ് / ഭൂതം
  rationale: മർക്കോസിന്റെ സന്ദർഭത്തിൽ ബാധിക്കുന്ന ദുഷ്ടാത്മാവാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്; എന്നാൽ ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം πνεῦμα (‘ആത്മാവ്’) എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ മുഖ്യപാഠം ആ പരിധി പാലിക്കുന്നു.
- issue: ἄλαλον ആത്മാവിന്റെ സ്വഭാവമോ മകന്റെ സംസാരശേഷിയിലുള്ള ഫലമോ
  choice: മുഖ്യപാഠത്തിൽ ‘സംസാരിക്കാത്ത ഒരു ആത്മാവ്’
  alternative: ‘സംസാരിക്കാൻ കഴിയാതാക്കുന്ന ഒരു ആത്മാവ്’
  rationale: ഗ്രീക്കിൽ വിശേഷണം നേരിട്ട് πνεῦμα എന്ന പദത്തോടാണ് ചേരുന്നത്. അതിന്റെ കാരണഫലപരമായ അർത്ഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. യേശുവിനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ‘ദുഷ്ടാത്മാവ്’ എന്നു വിശദീകരിച്ച് മൂലപാഠത്തെ കവിയാതെ, സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ സൂചന തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
