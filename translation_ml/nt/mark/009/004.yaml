id: MRK.9.4
reference: Mark 9:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: ml
  text: മോശെയോടുകൂടെ ഏലിയാവ് അവർക്കു പ്രത്യക്ഷനായി; അവർ യേശുവിനോടു സംസാരിച്ചുകൊണ്ടിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യേശുവിനോടു സംഭാഷണം നടത്തിക്കൊണ്ടിരുന്നു.”
    reason: συλλαλέω എന്ന ക്രിയയ്ക്ക് ‘സംസാരിക്കുക’ എന്നതിനോടൊപ്പം ‘സംഭാഷണം നടത്തുക’ എന്ന സ്വാഭാവികമായ പദപര്യായവുമുണ്ട്.
lexical_decisions:
- source_word: ὤφθη
  choice: പ്രത്യക്ഷനായി
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയരൂപം ഇവിടെ പ്രത്യക്ഷപ്പെടുക എന്ന അകർമക അർഥത്തിലാണ്; ദൃശ്യമായി എന്നതിനെക്കാൾ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: ഏലിയാവ് ആർക്കാണ് പ്രത്യക്ഷനായതെന്ന് സൂചിപ്പിക്കുന്ന സമ്പ്രദാനിക സർവനാമത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Ἠλίας
  choice: ഏലിയാവ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: σὺν Μωϋσεῖ
  choice: മോശെയോടുകൂടെ
  rationale: സഹവർത്തിത്വം വ്യക്തമാക്കുന്ന σὺν എന്ന പദത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: συλλαλοῦντες
  choice: സംസാരിച്ചുകൊണ്ടിരുന്നു
  rationale: പരസ്പര സംഭാഷണത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ തുടർച്ചയായ പ്രവൃത്തിഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῷ Ἰησοῦ
  choice: യേശുവിനോടു
  rationale: συλλαλέω സൂചിപ്പിക്കുന്ന പരസ്പര സംഭാഷണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: രൂപാന്തരീകരണരംഗത്തിൽ ഏലിയാവിന്റെയും മോശെയുടെയും പ്രത്യക്ഷതയുടെ സ്വഭാവം
  choice: ഏലിയാവ് മോശെയോടുകൂടെ പ്രത്യക്ഷനായി യേശുവിനോടു സംസാരിച്ചതായി വാക്യം നേരിട്ട് അവതരിപ്പിക്കുന്നു.
  alternative: ഇത് ദർശനം മാത്രമായിരുന്നുവെന്നോ പ്രതീകാത്മക പ്രതിനിധാനം മാത്രമായിരുന്നുവെന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് ആഖ്യാനം അവരുടെ പ്രത്യക്ഷതയും സംഭാഷണവും നേരിട്ട് പറയുന്നു; വിവർത്തനം അതിനെ ദുർബലപ്പെടുത്തുകയോ അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുകയോ ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രണ്ടു സംയോജിത ഉപവാക്യങ്ങൾ അർദ്ധവിരാമംകൊണ്ട് വ്യക്തമായി ബന്ധിപ്പിച്ചു; വിശദീകരണപരമായ കൂട്ടിച്ചേർക്കലുകൾ ഒഴിവാക്കി.
