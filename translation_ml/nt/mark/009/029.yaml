id: MRK.9.29
reference: Mark 9:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഈ ഇനം പ്രാർത്ഥനയിലൂടെയല്ലാതെ യാതൊന്നിനാലും പുറത്തുവരാൻ കഴിയില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പിൽക്കാലത്തെ ചില കൈയെഴുത്തുപ്രതികളിൽ “പ്രാർത്ഥനയും ഉപവാസവും” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: ഈ ഇനം
  rationale: γένος ഇവിടെ ഒരു വിഭാഗത്തെയോ ഇനത്തെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ അശുദ്ധാത്മാവാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെങ്കിലും, ഗ്രീക്കിൽ ‘ആത്മാവ്’ എന്ന് വീണ്ടും വ്യക്തമാക്കാത്തതിനാൽ സംക്ഷിപ്തതയും സന്ദർഭസൂചനയും നിലനിർത്തുന്നു.
- source_word: ἐν οὐδενὶ
  choice: മറ്റൊന്നിനാലും
  rationale: ἐν + οὐδενί ഇവിടെ മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘മറ്റൊന്നിനാലും’ എന്നത് യാതൊരു വേറൊരു ഉപാധിയാലും സാധ്യമല്ലെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δύναται ἐξελθεῖν
  choice: പുറത്തുവരുകയില്ല
  rationale: ഈ സന്ദർഭത്തിൽ δύναται ἐξελθεῖν അശുദ്ധാത്മാവിന് പുറത്തുവരാൻ കഴിയാത്തതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ നിഷേധഘടനയോടൊപ്പം ‘പുറത്തുവരുകയില്ല’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: εἰ μὴ ഏക അപവാദത്തെ അവതരിപ്പിക്കുന്നു. ‘അല്ലാതെ’ മുൻപുള്ള നിഷേധവുമായി ചേർന്ന് ‘പ്രാർഥന മാത്രമാണ് ഉപാധി’ എന്ന അർഥം നൽകുന്നു.
- source_word: ἐν προσευχῇ
  choice: പ്രാർഥനയാൽ
  rationale: ἐν προσευχῇ ഇവിടെ ഉപാധിയെ സൂചിപ്പിക്കുന്നു. ‘പ്രാർഥനയാൽ’ എന്നത് ആ ഉപാധിസംബന്ധം നേരിട്ടും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘ഉപവാസവും’ എന്ന വാക്കുകൾ മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തണമോ
  choice: ‘പ്രാർഥന’ മാത്രം മുഖ്യപാഠത്തിൽ
  alternative: ‘പ്രാർഥനയും ഉപവാസവും’
  rationale: നൽകിയ SBLGNT ഗ്രീക്ക് പാഠത്തിൽ προσευχῇ (‘പ്രാർഥന’) മാത്രമാണുള്ളത്. ‘ഉപവാസവും’ എന്ന ദീർഘവായന പിൽക്കാല കൈയെഴുത്തുപ്രതികളിൽ കാണുന്നതിനാൽ അതിനെ മുഖ്യപാഠത്തിലല്ല, പാഠഭേദക്കുറിപ്പിലാണ് നിലനിർത്തിയത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ‘ഈ ഇനം’ നിലനിർത്തി; സന്ദർഭത്തിൽ നിന്നു മനസ്സിലാകുന്ന ‘ആത്മാവ്’ എന്ന പദം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം വാക്യാവസാനത്ത് ചേർത്തിരിക്കുന്നു.
