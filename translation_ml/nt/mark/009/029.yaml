  to: 'അവൻ അവരോടു പറഞ്ഞു: “ഈ ഇനം പ്രാർത്ഥനയിലൂടെയല്ലാതെ യാതൊന്നിനാലും പുറത്തുവരാൻ കഴിയില്ല.”[a]'
