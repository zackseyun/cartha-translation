id: MRK.9.2
reference: Mark 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: ml
  text: ആറു ദിവസം കഴിഞ്ഞ്[a], യേശു പത്രോസിനെയും യാക്കോബിനെയും യോഹന്നാനെയും കൂട്ടി, അവരെ മാത്രമായി ഉയർന്ന ഒരു മലയിലേക്കു കയറ്റിക്കൊണ്ടുപോയി[b]. അവൻ അവരുടെ മുമ്പാകെ രൂപാന്തരപ്പെട്ടു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആറു ദിവസത്തിനുശേഷം.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “വേർപെട്ട്, അവരെ മാത്രം.” മറ്റാരും കൂടെയില്ലാതെ ഈ മൂന്നുപേരെ മാത്രമാണ് യേശു കൊണ്ടുപോയതെന്ന് ഊന്നിപ്പറയാൻ ഗ്രീക്കിൽ വേർതിരിവിനെ സൂചിപ്പിക്കുന്ന രണ്ടു പ്രയോഗങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അവന്റെ രൂപം മാറി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: ആറു ദിവസം കഴിഞ്ഞ്
  rationale: കാലക്രമത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്ന μετά + accusative എന്ന പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘ആറു ദിവസത്തിനുശേഷം’ എന്നതും സാധ്യമാണ്.
- source_word: παραλαμβάνει
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: ശിഷ്യന്മാരെ തന്നോടൊപ്പം കൊണ്ടുപോകുന്നു എന്ന അർഥം സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാളകഥനത്തിന്റെ സ്വാഭാവിക ഭൂതകാലരീതിയിൽ അവതരിപ്പിച്ചു.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: ഒരു ഉയർന്ന മലയിലേക്കു കയറ്റിക്കൊണ്ടുപോയി
  rationale: ἀναφέρει-യിലെ മുകളിലേക്കുള്ള ചലനവും εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: κατ’ ἰδίαν μόνους
  choice: അവരെ മാത്രം
  rationale: രണ്ടു ഗ്രീക്ക് പ്രയോഗങ്ങളും മറ്റാരും കൂടെയില്ലാതെ ഈ മൂന്നുപേരെ വേർതിരിച്ചു കൊണ്ടുപോയെന്ന ഊന്നൽ നൽകുന്നു; മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി, അടിക്കുറിപ്പിൽ പദഘടന വ്യക്തമാക്കി.
- source_word: μετεμορφώθη
  choice: അവന്റെ രൂപം മാറി
  rationale: രൂപാന്തരം സംഭവിച്ചു എന്ന ഗ്രീക്ക് ക്രിയയുടെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു; സംഭവത്തിന്റെ കാരണം, രീതി, സ്വഭാവം എന്നിവ പാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: ἔμπροσθεν αὐτῶν
  choice: അവരുടെ മുമ്പിൽവെച്ച്
  rationale: മൂന്നു ശിഷ്യന്മാരുടെ സാന്നിധ്യത്തിലും കാഴ്ചയിലുമാണ് സംഭവം നടന്നതെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ക്രിസ്തുശാസ്ത്രപരമായ സന്ദർഭത്തിൽ μετεμορφώθη എന്നതിന്റെ പരിഭാഷ
  choice: അവന്റെ രൂപം മാറി
  alternative: അവൻ രൂപാന്തരപ്പെട്ടു
  rationale: ക്രിയയെ ദൃശ്യമായ രൂപമാറ്റമായി അവതരിപ്പിക്കുമ്പോഴും അതിന്റെ തത്ത്വശാസ്ത്രപരമായ രീതി വിശദീകരിക്കുന്നില്ല. ‘രൂപാന്തരപ്പെട്ടു’ കൂടുതൽ ഔപചാരികമായ പരിഭാഷയാണ്; പ്രധാനപാഠത്തിലെ രൂപം സാധാരണ വായനക്കാർക്ക് കൂടുതൽ നേരിട്ട് ഗ്രഹിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. മാർക്കോസിന്റെ ഗ്രീക്ക് ചരിത്രവർത്തമാനം യാന്ത്രികമായി വർത്തമാനകാലത്തിലാക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലത്തിൽ നൽകി. വാക്യത്തിന്റെ അവസാനത്തിലെ ഗ്രീക്ക് കോമയ്ക്ക് പകരം മലയാളത്തിൽ സമ്പൂർണവാക്യചിഹ്നം ഉപയോഗിച്ചു.
