language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξάπινα περιβλεψάμενοι οὐκέτι οὐδένα εἶδον ⸂ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: ml
  text: പെട്ടെന്ന് ചുറ്റും നോക്കിയപ്പോൾ, തങ്ങളോടൊപ്പം യേശുവിനെ മാത്രമേ അവർ കണ്ടുള്ളൂ; മറ്റാരെയും ഇനി കണ്ടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: പെട്ടെന്ന്
  rationale: അപ്രതീക്ഷിതവും ഉടനടിയുമായ സംഭവമാറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: περιβλεψάμενοι
  choice: അവർ ചുറ്റും നോക്കിയപ്പോൾ
  rationale: ചുറ്റുപാടെല്ലാം നോക്കുക എന്ന ക്രിയയുടെ അർഥം മലയാളത്തിലെ കാലബന്ധമുള്ള ഉപവാക്യമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐκέτι οὐδένα ... ἀλλὰ
  choice: മറ്റാരെയും ... മാത്രമല്ലാതെ
  rationale: ‘ഇനി ആരെയും കണ്ടില്ല; എന്നാൽ/ഒഴികെ’ എന്ന ഗ്രീക്ക് വിരുദ്ധഘടനയുടെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν
  choice: തങ്ങളോടൊപ്പം യേശു മാത്രം
  rationale: μόνον എന്ന ഊന്നലും μεθ’ ἑαυτῶν എന്ന ‘അവരോടൊപ്പം’ എന്ന ബന്ധവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: രൂപാന്തരീകരണത്തിനു ശേഷം അവിടെ ശേഷിച്ച വ്യക്തിയെക്കുറിച്ചുള്ള ഊന്നൽ
  choice: യേശു മാത്രമല്ലാതെ മറ്റാരെയും കണ്ടില്ല
  alternative: യേശുവിനെയല്ലാതെ ആരെയും കണ്ടില്ല
  rationale: മൂലത്തിലെ μόνον (‘മാത്രം’) എന്ന വ്യക്തമായ ഊന്നൽ നഷ്ടപ്പെടാതെ സൂക്ഷിക്കുന്നു; അതിലപ്പുറം ഒരു വ്യാഖ്യാനപരമായ ദൈവശാസ്ത്ര നിഗമനവും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ സംഭവക്രമവും ‘യേശു മാത്രം’ എന്ന ഊന്നലും സംരക്ഷിച്ചിട്ടുണ്ട്.
