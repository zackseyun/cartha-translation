  text: οἱ δὲ ἐσιώπων, πρὸς ἀλλήλους γὰρ διελέχθησαν ἐν τῇ ὁδῷ τίς μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: ml
  text: എന്നാൽ അവർ മിണ്ടാതിരുന്നു; കാരണം, വഴിയിൽവെച്ച് തങ്ങളിൽ ആരാണ് വലിയവൻ[a] എന്ന് അവർ തമ്മിൽ തർക്കിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരാണ് ഏറ്റവും വലിയവൻ.” ഗ്രീക്കിൽ ഉപയോഗിച്ചിരിക്കുന്നത് താരതമ്യരൂപമാണ്; അതിശയോന്നതരൂപമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: മിണ്ടാതിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടർന്നുനിന്ന മൗനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മിണ്ടാതിരുന്നു’ ആ നില സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διελέχθησαν
  choice: തർക്കിച്ചിരുന്നു
  rationale: ആരാണ് വലിയവൻ എന്ന മത്സരാത്മകമായ വിഷയസന്ദർഭത്തിൽ നിഷ്പക്ഷമായ ‘ചർച്ചചെയ്തിരുന്നു’ എന്നതിനെക്കാൾ ‘തർക്കിച്ചിരുന്നു’ യോജിക്കുന്നു; മൗനത്തിനു മുമ്പ് നടന്ന പ്രവൃത്തിയെന്ന സമയബന്ധവും ഇത് വ്യക്തമാക്കുന്നു.
- source_word: πρὸς ἀλλήλους
  choice: അവർ തമ്മിൽ
  rationale: പരസ്പരമുള്ള ഇടപെടൽ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τῇ ὁδῷ
  choice: വഴിയിൽവെച്ച്
  rationale: യാത്രയ്ക്കിടയിൽ എന്ന സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τίς μείζων
  choice: തങ്ങളിൽ ആരാണ് വലിയവൻ
  rationale: മείζων എന്ന താരതമ്യരൂപത്തെ അതിശയോന്നതരൂപമാക്കി മാറ്റാതെ ‘വലിയവൻ’ എന്നു നിലനിർത്തുന്നു; കൂട്ടത്തിനുള്ളിലെ താരതമ്യം വ്യക്തമാക്കാൻ ‘തങ്ങളിൽ’ ചേർത്തിരിക്കുന്നു.
- source_word: οἱ δὲ
  choice: എന്നാൽ അവർ
  rationale: യേശുവിന്റെ മുൻചോദ്യത്തോടുള്ള ലഘുവായ വൈരുധ്യം δέ സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ യോജിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: അവർ മിണ്ടാതിരുന്നതിന്റെ കാരണം തുടർന്നുള്ള വാക്യഭാഗം നൽകുന്നതായി വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: താരതമ്യരൂപമായ μείζων ആണോ ആശയാനുസൃതമായ അതിശയോന്നതരൂപമോ
  choice: ആരാണ് വലിയവൻ
  alternative: ആരാണ് ഏറ്റവും വലിയവൻ
  rationale: ഗ്രീക്കിൽ താരതമ്യവിശേഷണമാണ് ഉള്ളത്. ശിഷ്യന്മാരുടെ സ്ഥാനമത്സരം വ്യക്തമാകുമ്പോഴും, മൂലപാഠത്തിലെ താരതമ്യരൂപവും അതിലുള്ള സ്വാഭാവിക ഭാഷാഭേദസാധ്യതയും വിവർത്തനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘മിണ്ടാതിരുന്നു’, ‘വഴിയിൽവെച്ച്’, ‘തർക്കിച്ചിരുന്നു’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ഗ്രീക്കിലെ താരതമ്യരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് ആശയാനുസൃതമായ അതിശയോന്നതരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
