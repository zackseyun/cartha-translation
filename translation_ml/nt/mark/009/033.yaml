  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: ml
  text: 'അവർ കഫർന്നഹൂമിൽ എത്തി. അവൻ വീട്ടിൽ ആയിരിക്കെ അവരോട് ചോദിച്ചുകൊണ്ടിരുന്നു: “വഴിയിൽവെച്ച് നിങ്ങൾ എന്തിനെക്കുറിച്ചാണ് ചർച്ച ചെയ്തുകൊണ്ടിരുന്നത്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വഴിയിൽവെച്ച് നിങ്ങൾ എന്തിനെക്കുറിച്ചാണ് തർക്കിച്ചുകൊണ്ടിരുന്നത്?” ഈ ക്രിയയ്ക്ക് ചർച്ച, വാദപ്രതിവാദം, തർക്കം എന്നീ അർഥങ്ങൾ വരാം; തങ്ങളിൽ ആരാണ് ഏറ്റവും വലിയവൻ എന്നതായിരുന്നു വിഷയം എന്ന് അടുത്ത വാക്യം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: എത്തി
  rationale: εἰς + സ്ഥലനാമം ചേർന്ന ഈ സന്ദർഭത്തിൽ യാത്രയുടെ ലക്ഷ്യസ്ഥാനത്തെത്തിയതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ബഹുവചന കർത്താവ് ‘അവർ’ നിലനിർത്തുന്നു.
- source_word: Καφαρναούμ
  choice: കഫർന്നഹൂം
  rationale: ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: ἐν τῇ οἰκίᾳ
  choice: വീട്ടിൽ
  rationale: നിശ്ചിതമായ വീടെന്ന മൂർത്തമായ പശ്ചാത്തലം നിലനിർത്തുന്നു; ‘സ്വന്തം വീട്ടിൽ’ എന്ന അനാവശ്യ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: γενόμενος
  choice: ആയപ്പോൾ
  rationale: പങ്കാളിക്രിയയുടെ കാലസംബന്ധമായ പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഏകവചനത്തിലെ സൂചിത കർത്താവിനെ ‘അവൻ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἐπηρώτα
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചയുള്ളതോ ആവർത്തിതമോ ആയ ഭാവം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: Τί
  choice: എന്തിനെക്കുറിച്ചാണ്
  rationale: ചർച്ചയുടെ വിഷയം ചോദിക്കുന്ന ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രൂപം.
- source_word: ἐν τῇ ὁδῷ
  choice: വഴിയിൽവെച്ച്
  rationale: യാത്രയ്ക്കിടയിൽ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: διελογίζεσθε
  choice: ചർച്ച ചെയ്തുകൊണ്ടിരുന്നത്
  rationale: ക്രിയയ്ക്ക് ചർച്ച, വാദപ്രതിവാദം, തർക്കം എന്നീ അർഥസാധ്യതകളുണ്ട്. അടുത്ത വാക്യത്തിൽ തർക്കസ്വഭാവം തെളിയുന്നുവെങ്കിലും ഇവിടെ അതിനെ മുൻകൂട്ടി തീർപ്പാക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἦλθον എന്ന ബഹുവചന ക്രിയയിൽനിന്ന് γενόμενος/ἐπηρώτα എന്ന ഏകവചനത്തിലേക്കുള്ള കർത്തൃമാറ്റം
  choice: ആഗമനത്തിന് ‘അവർ’ എന്നും വീട്ടിലായശേഷമുള്ള ചോദിക്കലിന് യേശുവിനെ സൂചിപ്പിക്കുന്ന ‘അവൻ’ എന്നും വിവർത്തനം ചെയ്തു.
  alternative: ‘അവർ കഫർന്നഹൂമിൽ എത്തി. യേശു വീട്ടിൽ പ്രവേശിച്ചശേഷം അവരോട് ചോദിച്ചു’ എന്ന് കർത്താവിനെയും പ്രവേശനത്തെയും കൂടുതൽ വ്യക്തമാക്കി നൽകുക.
  rationale: ഗ്രീക്കിലെ സ്വാഭാവികമായ കർത്തൃമാറ്റം നിലനിർത്തുകയും സന്ദർഭത്തിൽ ഏകവചന കർത്താവ് യേശുവാണെന്ന് വായനക്കാരന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു; ‘പ്രവേശിച്ചു’ എന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർവചിക്കുന്നതിനാൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ തുടർച്ചാഭാവം ‘ചോദിച്ചുകൊണ്ടിരുന്നു’, ‘ചർച്ച ചെയ്തുകൊണ്ടിരുന്നത്’ എന്നീ രൂപങ്ങളിലൂടെ നിലനിർത്തി; എന്നാൽ തർക്കത്തിന്റെ തീവ്രത മുഖ്യവാചകത്തിൽ മുൻകൂട്ടി നിർണ്ണയിക്കാതെ അടിക്കുറിപ്പിൽ പര്യായം നൽകി.
