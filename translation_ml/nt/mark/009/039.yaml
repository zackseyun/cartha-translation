language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു പറഞ്ഞു: “അവനെ തടയരുത്. കാരണം, എന്റെ നാമത്തിൽ ശക്തമായ ഒരു പ്രവൃത്തി[a] ചെയ്യുന്ന ഒരാൾക്ക് ഉടൻതന്നെ എന്നെക്കുറിച്ച് ദോഷമായി സംസാരിക്കാൻ[b] കഴിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു അത്ഭുതം” അല്ലെങ്കിൽ “ഒരു മഹത്തായ പ്രവൃത്തി”; ഗ്രീക്കിൽ “ശക്തി” (δύναμιν).
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “എന്നെ നിന്ദിക്കാൻ” അല്ലെങ്കിൽ “എന്നെ അധിക്ഷേപിക്കാൻ”; ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “എന്നെക്കുറിച്ച് ദോഷമായി പറയാൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: തടയരുത്
  rationale: μήയോടുകൂടിയ വർത്തമാനകാല ആജ്ഞാരൂപം ഇവിടെ ഒരു പ്രവൃത്തി തടയുന്നതിനുള്ള വിലക്കാണ്; ‘തടയരുത്’ ആ സന്ദർഭം സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
- source_word: δύναμιν
  choice: ഒരു ശക്തിപ്രവൃത്തി
  rationale: δύναμις എന്ന പദത്തിന്റെ ‘ശക്തി’ എന്ന അടിസ്ഥാനാർഥവും സുവിശേഷങ്ങളിലെ അസാധാരണമായ ശക്തിക്രിയ എന്ന പ്രയോഗവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘അത്ഭുതം’ എന്ന കൂടുതൽ നിർവചിതമായ വിവർത്തനത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ നാമം വിളിച്ചപേക്ഷിച്ചോ അവന്റെ അധികാരത്തെ ആശ്രയിച്ചോ ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ വ്യക്തവും പതിവുമായ പ്രയോഗം.
- source_word: ταχὺ
  choice: ഉടൻതന്നെ
  rationale: ക്രിയയുടെ രീതിയേക്കാൾ സമയസാമീപ്യമാണ് ഇവിടെ പ്രധാനമായത്; അതിനാൽ ‘വേഗത്തിൽ’ എന്നതിനെക്കാൾ ‘ഉടൻതന്നെ’ യോജിക്കുന്നു.
- source_word: κακολογῆσαί
  choice: എന്നെക്കുറിച്ച് ദോഷം പറയാൻ
  rationale: വാക്കുകളാൽ ദോഷമായി പറയുക, നിന്ദിക്കുക, അധിക്ഷേപിക്കുക എന്ന പദത്തിന്റെ പരിധി നിലനിർത്തുകയും ‘അപവാദം പറയുക’ പോലുള്ള കൂടുതൽ സവിശേഷമായ അർഥം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: കാരണം … ചെയ്യുന്ന ഒരാൾക്ക് … കഴിയില്ല
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മക പൊതുപ്രസ്താവന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ആരും ഇല്ല എന്ന ആശയം മാറ്റുന്നില്ല.
- source_word: δυνήσεται
  choice: കഴിയില്ല
  rationale: ഭാവികാലത്തിലെ കഴിവിനെയോ സാധ്യതയെയോ സൂചിപ്പിക്കുന്നു; ‘ഉടൻതന്നെ’ എന്ന സമയസൂചനയോടൊപ്പം മലയാളത്തിൽ ഭാവിസംബന്ധം വ്യക്തമാണ്.
theological_decisions:
- issue: യേശുവിന്റെ നാമത്തിൽ ചെയ്യപ്പെടുന്ന പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: δύναμιν എന്നത് ‘ഒരു ശക്തിപ്രവൃത്തി’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘ഒരു അത്ഭുതം’ അല്ലെങ്കിൽ ‘ഒരു മഹത്തായ പ്രവൃത്തി’
  rationale: മൂലപദത്തിലെ ശക്തി എന്ന ആശയവും അസാധാരണ പ്രവൃത്തി എന്ന സുവിശേഷപ്രയോഗവും സംരക്ഷിക്കുന്നു; അതിനെ ആധുനികമായ ഒരു ചുരുങ്ങിയ ‘അത്ഭുത’ ധാരണയിലേക്ക് പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: യേശുവിന്റെ നാമം ഉപയോഗിക്കുന്ന വ്യക്തിയുടെ യേശുവുമായുള്ള ബന്ധം
  choice: 'ഈ വാക്യം പറയുന്ന പരിമിതമായ കാര്യം മാത്രം നിലനിർത്തി: യേശുവിന്റെ നാമത്തിൽ ശക്തിപ്രവൃത്തി ചെയ്യുന്ന ഒരാൾ ഉടൻതന്നെ അവനെക്കുറിച്ച് ദോഷം പറയുകയില്ല.'
  alternative: ആ വ്യക്തി പൂർണശിഷ്യനാണെന്നോ വെറും അവസരവാദിയാണെന്നോ സൂചിപ്പിക്കുന്ന വ്യാഖ്യാനപരമായ ഭാഷ
  rationale: വാക്യം ആ വ്യക്തിയുടെ സമ്പൂർണ ശിഷ്യത്വനിലയെയോ ഉപദേശപരമായ അംഗീകാരത്തെയോ നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ അത്തരം നിഗമനങ്ങൾ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ശക്തിപ്രവൃത്തി’ മൂലപദബന്ധം നിലനിർത്തുന്ന സംയുക്തപദമാണ്; അടിക്കുറിപ്പ് സാധാരണ വായനക്കാർക്കായി അതിന്റെ മറ്റു സാധ്യതകൾ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ ഭാവികാലഘടന മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ പൊതുപ്രസ്താവനയായി അവതരിപ്പിച്ചെങ്കിലും ‘ഉടൻതന്നെ’യും ‘കഴിയില്ല’യും ഭാവിസാധ്യതയുടെ ആശയം നിലനിർത്തുന്നു.
