source:
  edition: robinson-pierpont-2005-byzantine
  text: ὅπου ὁ σκώληξ αὐτῶν οὐ τελευτᾷ, καὶ τὸ πῦρ οὐ σβέννυται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/044.yaml
  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: ml
  text: അവിടെ[a] അവരുടെ പുഴു ചാകുന്നില്ല; തീ കെട്ടുപോകുന്നതുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം ഏറ്റവും പുരാതനമായ ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ (നാലാം നൂറ്റാണ്ടിലെ സീനായിറ്റിക്കസും വത്തിക്കാനസും ഉൾപ്പെടെ)യും ആദ്യകാല കോപ്റ്റിക് വിവർത്തനങ്ങളിലും ഇല്ല. എന്നാൽ അഞ്ചാം നൂറ്റാണ്ടിലെ അലക്സാണ്ട്രിനസ്, ലത്തീൻ പാരമ്പര്യം, പിൽക്കാല ബൈസന്റൈൻ ഭൂരിപക്ഷ കൈയെഴുത്തുപ്രതികൾ എന്നിവയിൽ ഇത് കാണുന്നു. 48-ാം വാക്യത്തിലെ അതേ വാചകം പിൽക്കാലത്ത് ഒരു പകർപ്പെഴുത്തുകാരൻ ഇവിടെ ചേർത്തതാകാനാണ് സാധ്യത.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: പുഴു
  rationale: ചീഞ്ഞഴുകുന്ന വസ്തുക്കളിൽ ജീവിക്കുന്ന പുഴുവിനെയോ കീടപ്പുഴുവിനെയോ സൂചിപ്പിക്കുന്നു. യെശയ്യാവ് 66:24-ലെ ദൃശ്യഭാഷയും ഉദ്ധരണിയുടെ നേരിട്ടുള്ള സ്വഭാവവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദമാണ് ‘പുഴു’.
- source_word: τελευτᾷ
  choice: ചാകുന്നില്ല
  rationale: τελευτάω എന്നത് അവസാനിക്കുക അഥവാ മരിക്കുക എന്നാണ്; ഇവിടെ പുഴുവിനെക്കുറിച്ചായതിനാൽ സാധാരണ മലയാളത്തിൽ ‘ചാകുക’ ഏറ്റവും സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: σβέννυται
  choice: കെട്ടുപോകുന്നതുമില്ല
  rationale: ഇത് വർത്തമാനകാല കർമണി രൂപത്തിൽ ‘അണയ്ക്കപ്പെടുക/കെട്ടുപോകുക’ എന്ന ആശയം നൽകുന്നു. തീയെ സംബന്ധിച്ച് ‘കെട്ടുപോകുക’ സ്വാഭാവികമാണ്; തീ ആരെങ്കിലും അണയ്ക്കുന്നില്ല എന്നതിലുപരി അത് അണയാതെ തുടരുന്നു എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഭാവം സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവസാനമില്ലാത്ത പുഴുവിന്റെയും തീയുടെയും ദൃശ്യഭാഷ
  choice: രൂപകത്തെ വ്യാഖ്യാനിക്കാതെ നേരിട്ട് നിലനിർത്തി
  alternative: അന്തിമശിക്ഷയുടെ സ്വഭാവം വിശദീകരിക്കുന്ന വിധത്തിൽ വികസിപ്പിക്കുക
  rationale: വാക്യം യെശയ്യാവ് 66:24-ലെ ദൃശ്യഭാഷ ഉദ്ധരിക്കുന്നു; അതിന്റെ കൃത്യമായ തത്ത്വശാസ്ത്രപരമായ വ്യാപ്തി വിവർത്തനത്തിൽ തീർപ്പാക്കാതെ യഥാർത്ഥ ഭാഷയിലെ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുഴു ചാകുന്നില്ല’, ‘തീ കെട്ടുപോകുന്നതുമില്ല’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലത്തിലെ സമാന്തര ഘടനയും ദൃശ്യതീവ്രതയും നിലനിർത്തുന്നു.
