  text: καλὸν τὸ ἅλας· ἐὰν δὲ τὸ ἅλας ἄναλον γένηται, ἐν τίνι αὐτὸ ἀρτύσετε; ἔχετε ἐν ἑαυτοῖς ⸀ἅλα, καὶ εἰρηνεύετε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: ml
  text: ഉപ്പ് നല്ലതാണ്; എന്നാൽ ഉപ്പ് ഉപ്പുരസം നഷ്ടപ്പെട്ടാൽ, എന്തുകൊണ്ട് അതിന് രുചി വരുത്തും? നിങ്ങളിൽത്തന്നെ ഉപ്പ് ഉണ്ടായിരിക്കട്ടെ[a]; പരസ്പരം സമാധാനത്തോടെ കഴിയുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങളിൽത്തന്നെ ഉപ്പ് ഉണ്ടായിരിക്കട്ടെ’ എന്ന രൂപകം വിശുദ്ധി, ജ്ഞാനം, ഉടമ്പടിവിശ്വസ്തത, സംരക്ഷകസ്വാധീനം എന്നിവയെ സൂചിപ്പിക്കാമെന്നു വ്യാഖ്യാനിക്കപ്പെട്ടിട്ടുണ്ട്; എന്നാൽ ഇവിടെ അതിന്റെ അർത്ഥം വ്യക്തമായി നിർവചിച്ചിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: നല്ലതാണ്
  rationale: ഉപ്പിനെ പൊതുവായി അനുകൂലമായി വിലയിരുത്തുന്ന καλός എന്ന പദത്തിന്റെ പഴഞ്ചൊല്ലുസ്വഭാവവും വിശാലതയും നിലനിർത്തുന്നു.
- source_word: ἅλας / ἅλα
  choice: ഉപ്പ്
  rationale: രണ്ടിടത്തും ഒരേ പദം ഉപയോഗിച്ച് ഗ്രീക്കിലെ ആവർത്തനവും അവസാന കല്പനയിലെ രൂപകവും നിലനിർത്തുന്നു.
- source_word: ἄναλον γένηται
  choice: ഉപ്പുരസമില്ലാത്തതായിത്തീർന്നാൽ
  rationale: ἄναλος എന്നത് ‘ഉപ്പില്ലാത്ത/രുചിയില്ലാത്ത’ അവസ്ഥയെയും γένηται അവസ്ഥാമാറ്റത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ സംയുക്തപ്രയോഗമാണിത്.
- source_word: ἐν τίνι αὐτὸ ἀρτύσετε
  choice: എന്തുകൊണ്ട് അതിന് രുചി വരുത്തും?
  rationale: ἐν τίνι എന്ന ഉപാധിസൂചനയെ ‘എന്തുകൊണ്ട്’ എന്നും ἀρτύω എന്ന പാചകരൂപകത്തെ ‘രുചി വരുത്തുക’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔχετε ἐν ἑαυτοῖς ἅλα
  choice: നിങ്ങളിൽത്തന്നെ ഉപ്പ് ഉണ്ടായിരിക്കട്ടെ
  rationale: ഉപ്പിന്റെ രൂപകത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; ἐν ἑαυτοῖς എന്ന ആത്മവാചക ഊന്നൽ ‘നിങ്ങളിൽത്തന്നെ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: εἰρηνεύετε ἐν ἀλλήλοις
  choice: പരസ്പരം സമാധാനത്തോടെ കഴിയുക
  rationale: വർത്തമാനകാല കല്പന സൂചിപ്പിക്കുന്ന തുടരുന്ന സമാധാനജീവിതത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: അവസാന കല്പനയിലെ ‘ഉപ്പ്’ എന്ന രൂപകത്തിന്റെ അർത്ഥം
  choice: 'രൂപകം അതേപടി നിലനിർത്തി: ‘നിങ്ങളിൽത്തന്നെ ഉപ്പ് ഉണ്ടായിരിക്കട്ടെ’'
  alternative: ‘വിശുദ്ധി/ജ്ഞാനം/ഉടമ്പടിവിശ്വസ്തത നിങ്ങളിൽ ഉണ്ടായിരിക്കട്ടെ’ എന്ന് വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: വാക്യം രൂപകത്തിന് ഒരൊറ്റ നിർവചനം നൽകുന്നില്ല. അതിനാൽ അതിന്റെ യഥാർഥ അർത്ഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: εἰρηνεύετε എന്ന സമാധാനകല്പനയുടെ ഭാവം
  choice: തുടരുന്ന ജീവിതരീതിയായി ‘സമാധാനത്തോടെ കഴിയുക’
  alternative: ‘സമാധാനത്തിലായിരിക്കുക’
  rationale: രണ്ടും സാധുവാണെങ്കിലും, ഗ്രീക്ക് വർത്തമാനകാല കല്പനയുടെ തുടരുന്ന പ്രവൃത്തിഭാവം ‘കഴിയുക’ കൂടുതൽ സ്വാഭാവികമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഉപ്പുരസമില്ലാത്തതായിത്തീരുക’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ പദപ്രയോഗബന്ധം നിലനിർത്തുന്നു; ‘നിങ്ങളിൽത്തന്നെ’ ആന്തരിക/ആത്മവാചക ഭാവം സംരക്ഷിക്കുന്നു.
