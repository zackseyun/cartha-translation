revisions:
- from: അത് അവനെ പിടികൂടുമ്പോഴെല്ലാം അവനെ നിലത്തടിച്ചിടുന്നു. അവൻ നുരയ്ക്കുകയും പല്ലുകടിക്കുകയും മരവിച്ചുപോകുകയും ചെയ്യുന്നു.[a] അതിനെ പുറത്താക്കാൻ ഞാൻ അങ്ങയുടെ ശിഷ്യന്മാരോടു പറഞ്ഞു; എന്നാൽ അവർക്കു കഴിഞ്ഞില്ല.
  to: എവിടെവെച്ചായാലും അത് അവനെ പിടികൂടുമ്പോൾ, അത് അവനെ നിലത്തടിച്ചിടുന്നു. അവന്റെ വായിൽ നുര വരുകയും അവൻ പല്ലുകൾ കടിക്കുകയും ശരീരം കട്ടിപിടിച്ചുപോകുകയും ചെയ്യുന്നു.[a] അതിനെ പുറത്താക്കാൻ ഞാൻ അങ്ങയുടെ ശിഷ്യന്മാരോടു പറഞ്ഞു; എന്നാൽ അവർക്കു കഴിഞ്ഞില്ല.
  rationale: സ്ഥലസൂചനയുള്ള അനിശ്ചിത ആപേക്ഷികപ്രയോഗം ‘എവിടെവെച്ചായാലും’ കൊണ്ട് പുനഃസ്ഥാപിച്ചു. നുരയെക്കുറിച്ചുള്ള ക്രിയയ്ക്ക് സ്വാഭാവികവും വ്യക്തവുമായ ‘വായിൽ നുര വരുന്നു’ എന്ന പ്രയോഗം ഉപയോഗിച്ചു; മൂലപാഠം വ്യക്തമായി പറയാത്ത ‘വായിൽ’ എന്നത് നുരയ്ക്കുക എന്ന ലക്ഷണത്തിന്റെ സാധാരണ മലയാളപ്രയോഗമായതിനാൽ അർഥവിപുലീകരണമല്ല. ξηραίνεται-ന് സന്ദർഭോചിതമായ ‘ശരീരം കട്ടിപിടിച്ചുപോകുന്നു’ നൽകി, എന്നാൽ അക്ഷരാർഥപരവും മറ്റ് സാധ്യവുമായ വായനകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
