id: MRK.9.18
reference: Mark 9:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: ml
  text: എവിടെവെച്ചായാലും അത് അവനെ പിടികൂടുമ്പോൾ, അത് അവനെ നിലത്തടിച്ചിടുന്നു. അവന്റെ വായിൽ നുര വരുകയും അവൻ പല്ലുകൾ കടിക്കുകയും ശരീരം കട്ടിപിടിച്ചുപോകുകയും ചെയ്യുന്നു.[a] അതിനെ പുറത്താക്കാൻ ഞാൻ അങ്ങയുടെ ശിഷ്യന്മാരോടു പറഞ്ഞു; എന്നാൽ അവർക്കു കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വരണ്ടുപോകുന്നു,” “ശോഷിച്ചുപോകുന്നു,” അല്ലെങ്കിൽ “വാടിപ്പോകുന്നു.” ഗ്രീക്ക് പദത്തിന്റെ അക്ഷരാർഥം “വരണ്ടുപോകുന്നു” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: പിടികൂടുമ്പോഴെല്ലാം
  rationale: സ്ഥലത്തെക്കാൾ ആവർത്തിച്ചുണ്ടാകുന്ന സന്ദർഭമാണ് ഈ വാക്യത്തിൽ സ്വാഭാവികമായി ഉദ്ദേശിക്കപ്പെടുന്നത്; ‘എപ്പോഴൊക്കെ/ഓരോ തവണയും’ എന്ന അനിശ്ചിത ആവർത്തനഭാവം ‘-മ്പോഴെല്ലാം’ വ്യക്തമാക്കുന്നു.
- source_word: καταλάβῃ
  choice: പിടികൂടുന്നു
  rationale: ശത്രുതാപൂർവം കൈവശപ്പെടുത്തുകയോ പിടിമുറുക്കുകയോ ചെയ്യുന്ന പ്രവൃത്തിയെ ലളിതവും ശക്തവുമായി അറിയിക്കുന്നു.
- source_word: ῥήσσει
  choice: നിലത്തടിച്ചിടുന്നു
  rationale: ആത്മാവ് ബാലനെ അക്രമാസക്തമായി താഴെയിടുന്നതെന്ന സന്ദർഭാർഥം നൽകുന്നു; ശരീരം കീറുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἀφρίζει
  choice: നുരയ്ക്കുന്നു
  rationale: ഗ്രീക്കിലെ ‘നുരയ്ക്കുക’ എന്ന അർഥം അനാവശ്യമായ വിശദീകരണം ചേർക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τρίζει τοὺς ὀδόντας
  choice: പല്ലുകടിക്കുന്നു
  rationale: ശാരീരിക ലക്ഷണത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വിവരിക്കുന്നു.
- source_word: ξηραίνεται
  choice: മരവിച്ചുപോകുന്നു
  rationale: ലക്ഷണങ്ങളുടെ ഈ നിരയിൽ ശരീരം കട്ടിപിടിക്കുകയോ അനങ്ങാതാകുകയോ ചെയ്യുന്നതെന്ന സന്ദർഭാർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; പദത്തിന്റെ അക്ഷരാർഥവും മറ്റു സാധ്യതകളും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐκβάλωσιν
  choice: പുറത്താക്കാൻ
  rationale: അശുദ്ധാത്മാവിനെ പുറത്താക്കുന്ന പ്രവൃത്തിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: οὐκ ἴσχυσαν
  choice: അവർക്കു കഴിഞ്ഞില്ല
  rationale: പരാജയത്തിന്റെ കാരണം അധികമായി വ്യാഖ്യാനിക്കാതെ കഴിവില്ലായ്മയെ നേരിട്ട് അറിയിക്കുന്നു.
theological_decisions:
- issue: ἐκβάλωσιν എന്നതിനോടു ബന്ധപ്പെട്ട αὐτό എന്ന സർവനാമത്തിന്റെ സൂചിതം
  choice: ‘അതിനെ’ എന്നത് ബാലനെ ബാധിക്കുന്ന അശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ബാധയെയോ രോഗാവസ്ഥയെയോ പൊതുവായി സൂചിപ്പിക്കുന്നു എന്ന വായന.
  rationale: സമീപസന്ദർഭത്തിൽ ബാലനെ പിടികൂടുന്ന ശത്രുതാപരമായ ആത്മാവിനെയും അതിനെ പുറത്താക്കാനുള്ള ശ്രമത്തെയുമാണ് വിവരിക്കുന്നത്. ‘അതിനെ’ എന്ന നപുംസക സർവനാമം മൂലപാഠത്തിന്റെ രൂപവും സൂചിതത്തിലെ ചെറിയ പരോക്ഷതയും സംരക്ഷിക്കുന്നു.
- issue: ξηραίνεται എന്ന പദത്തിന്റെ കൃത്യമായ ശാരീരിക അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘മരവിച്ചുപോകുന്നു’ എന്ന് സന്ദർഭോചിതമായി നൽകി.
  alternative: ‘വരണ്ടുപോകുന്നു,’ ‘ശോഷിച്ചുപോകുന്നു,’ അല്ലെങ്കിൽ ‘ക്ഷയിച്ചുപോകുന്നു.’
  rationale: ഗ്രീക്ക് പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘വരണ്ടുപോകുക/വാടിപ്പോകുക’ ആണെങ്കിലും, ഇവിടെ അത് പിടിച്ചിലിനിടയിലെ ശരീരാവസ്ഥയായ കട്ടിപിടിക്കൽ സൂചിപ്പിക്കാം. ഉറപ്പില്ലാത്ത സൂക്ഷ്മാർഥം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യേശുവിനെ അഭിസംബോധന ചെയ്യുന്നതിൽ ‘അങ്ങയുടെ’ ഉപയോഗിച്ച് ആദരസൂചകഭാവം നിലനിർത്തി. ലക്ഷണങ്ങളുടെ വേഗമുള്ള നിര ചെറുവാക്യങ്ങളിലൂടെയും സമാന്തര ക്രിയാരൂപങ്ങളിലൂടെയും സംരക്ഷിച്ചു.
