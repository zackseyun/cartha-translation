reference: Mark 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു:[a] “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇവിടെ നിൽക്കുന്നവരിൽ ചിലർ ദൈവരാജ്യം ശക്തിയോടെ വന്നിരിക്കുന്നത് കാണുന്നതുവരെ ഒരിക്കലും മരണം രുചിക്കുകയില്ല.[b][c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘മരണം രുചിക്കുക’ എന്നത് ‘മരണം അനുഭവിക്കുക’ അഥവാ ‘മരിക്കുക’ എന്നർഥമുള്ള പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘ദൈവരാജ്യം ശക്തിയോടെ വന്നിരിക്കുന്നു’ എന്നത് രൂപാന്തരീകരണം, പുനരുത്ഥാനം, പെന്തെക്കൊസ്ത്, യെരൂശലേമിന്മേലുള്ള ന്യായവിധി, അല്ലെങ്കിൽ രാജ്യത്തിന്റെ ഭാവിയിലെ അന്തിമപൂർത്തീകരണം എന്നിവയിൽ ഏതിനെ സൂചിപ്പിക്കുന്നു എന്ന് വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപത്തിന്റെ തുടർച്ചയായ പ്രവൃത്തിഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ ലളിതഭൂതകാലവും സാധ്യമാണ്.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഗൗരവമേറിയ ഉറപ്പിക്കൽ സൂത്രവാക്യമായ Ἀμὴν-ന്റെ പ്രവർത്തനം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: ഇവിടെ നിൽക്കുന്നവരിൽ ചിലർ
  rationale: സന്നിഹിതരായ ആളുകളിൽ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഭാഗികബന്ധവും ἑστηκότων എന്ന രൂപത്തിന്റെ നിലാവസ്ഥയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: തീർച്ചയായും മരണം രുചിക്കുകയില്ല
  rationale: οὐ μή നൽകുന്ന ശക്തമായ നിഷേധം ‘തീർച്ചയായും … ഇല്ല’ എന്നതിലൂടെ പ്രകടമാക്കുകയും ‘മരണം രുചിക്കുക’ എന്ന മൂലരൂപകത്തെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἕως ἂν ἴδωσιν
  choice: കാണുന്നതുവരെ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന പരിധിയെ സൂചിപ്പിക്കുന്ന ἕως ἄν + ഉപവിധിരൂപത്തിന്റെ നേരായ മലയാള സമാനരൂപമാണിത്.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: ദൈവത്തിന്റെ രാജഭരണവും അതിന്റെ വെളിപ്പാടും ഉൾക്കൊള്ളാൻ കഴിയുന്ന, സുവിശേഷസാഹിത്യത്തിൽ സ്ഥാപിതമായ മലയാള പ്രയോഗം.
- source_word: ἐληλυθυῖαν
  choice: വന്നിരിക്കുന്നതു
  rationale: വരവ് പൂർത്തിയായതിന്റെ ഫലമായി നിലനിൽക്കുന്ന അവസ്ഥ സൂചിപ്പിക്കുന്ന സമ്പൂർണകാല പങ്കാളിരൂപത്തിന്റെ ഭാവം മലയാളത്തിൽ സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: ἐν δυνάμει
  choice: ശക്തിയോടെ
  rationale: ദൈവിക ശക്തിയുടെ പ്രകടനത്തെ സൂചിപ്പിക്കുമ്പോഴും അതിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കാത്ത സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ‘ദൈവരാജ്യം ശക്തിയോടെ വന്നിരിക്കുന്നു’ എന്നതിന്റെ കാലവും സൂചിത സംഭവവും
  choice: ഏത് പ്രത്യേക സംഭവമാണെന്ന് വിവർത്തനത്തിൽ നിർണ്ണയിക്കാതെ വാക്യം തുറന്ന നിലയിൽ വെച്ചു.
  alternative: രൂപാന്തരീകരണം, പുനരുത്ഥാനം/മഹത്ത്വീകരണം, പെന്തെക്കൊസ്ത്, യെരൂശലേമിന്റെ ന്യായവിധി, അല്ലെങ്കിൽ രാജ്യമഹിമയുടെ അന്തിമപൂർത്തീകരണം എന്നിങ്ങനെ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ഇവയിൽ ഏതെങ്കിലും സംഭവത്തെ പേരെടുത്തു പറയുന്നില്ല; അതിനാൽ യഥാർത്ഥ വ്യാഖ്യാനസാധ്യതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും വിവർത്തനം പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ദൈവരാജ്യം’ പോലുള്ള സ്ഥാപിത ബൈബിൾ പദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. ‘മരണം രുചിക്കുക’ എന്ന അപരിചിതമാകാവുന്ന രൂപകം മൂലപാഠത്തോടുള്ള അടുപ്പത്തിനായി സൂക്ഷിച്ച് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
