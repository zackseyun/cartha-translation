revisions:
- from: 'അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു:[a] “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇവിടെ നിൽക്കുന്നവരിൽ ചിലർ ദൈവരാജ്യം ശക്തിയോടെ വന്നിരിക്കുന്നതു കാണുന്നതുവരെ തീർച്ചയായും മരണം രുചിക്കുകയില്ല.[b][c]”'
  to: 'അവൻ അവരോടു പറഞ്ഞു:[a] “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇവിടെ നിൽക്കുന്നവരിൽ ചിലർ ദൈവരാജ്യം ശക്തിയോടെ വന്നിരിക്കുന്നത് കാണുന്നതുവരെ ഒരിക്കലും മരണം രുചിക്കുകയില്ല.[b][c]”'
  rationale: The revision improves idiomatic modern Malayalam without flattening the Greek aspect or resolving the disputed referent of the saying. ‘ഒരിക്കലും ... രുചിക്കുകയില്ല’ naturally conveys the force of οὐ μή, and ‘വന്നിരിക്കുന്നത്’ preserves the perfect participle’s sense of a kingdom whose arrival is realized when seen.
  reviewer_model: gpt-5.6-terra
