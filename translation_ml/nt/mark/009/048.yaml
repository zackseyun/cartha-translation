lexical_decisions:
- source_word: ὅπου
  choice: ഇരിക്കുന്നിടത്ത്
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ബന്ധക്രിയാവിശേഷണം; മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക ഘടനയ്ക്കായി ഉപവാക്യത്തിന്റെ അവസാനം നൽകി.
- source_word: ὁ σκώληξ αὐτῶν
  choice: അവരുടെ പുഴു
  rationale: σκώληξ എന്ന പദത്തിന്റെ വിശാലവും യെശയ്യാവ് 66:24-ലെ പ്രതിധ്വനിയോട് യോജിക്കുന്നതുമായ അർഥം ‘പുഴു’ സംരക്ഷിക്കുന്നു; αὐτῶν-ന്റെ ഉടമസ്ഥബന്ധവും നിലനിർത്തുന്നു.
- source_word: οὐ τελευτᾷ
  choice: ചാകാതെയും
  rationale: ജീവിയെ കർത്താവാക്കിയ സന്ദർഭത്തിൽ τελευτάω എന്നതിന്റെ സ്വാഭാവിക അർഥം ‘ചാകുക’ എന്നതാണ്; വർത്തമാനകാലത്തിലെ തുടരുന്ന നിഷേധം മലയാളത്തിൽ ഈ ഘടനയിലൂടെ വ്യക്തമാകുന്നു.
- source_word: τὸ πῦρ
  choice: തീ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളസമാനപദം.
- source_word: οὐ σβέννυται
  choice: കെട്ടുപോകാതെയും
  rationale: σβέννυται എന്ന വർത്തമാനകാല കർമണിപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘കെട്ടുപോകുക’ എന്ന് നൽകി; തീ അണയാത്ത നിലയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിയുടെ ദൃശ്യഭാഷയുടെ സ്വഭാവം
  choice: പുഴുവിന്റെയും തീയുടെയും മൂർത്തമായ ദൃശ്യഭാഷ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തി.
