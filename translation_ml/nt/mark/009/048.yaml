  rationale: വാക്യം യെശയ്യാവ് 66:24-നെ പ്രതിധ്വനിപ്പിച്ചുകൊണ്ട് ശക്തമായ ന്യായവിധിദൃശ്യം നൽകുന്നു; എന്നാൽ അതിന്റെ അടിസ്ഥാനത്തിൽ വിശാലമായ ഉപദേശവിവാദം പരിഭാഷ തന്നെ തീർപ്പാക്കുന്നില്ല.
