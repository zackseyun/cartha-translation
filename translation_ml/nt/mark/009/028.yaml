source:
  edition: SBLGNT
  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: ml
  text: 'അവൻ വീട്ടിൽ കയറിയപ്പോൾ, അവന്റെ ശിഷ്യന്മാർ വേറിട്ട് അവനോടു ചോദിച്ചുകൊണ്ടിരുന്നു: “അതിനെ[a] പുറത്താക്കാൻ ഞങ്ങൾക്ക് കഴിയാതിരുന്നത് എന്തുകൊണ്ടാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, പീഡിതനായ ആൺകുട്ടിയെയാണ് സൂചിപ്പിക്കുന്നതെന്നു കരുതിയാൽ, ‘അവനെ.’ ഗ്രീക്കിലെ സർവനാമം നപുംസകലിംഗമാണ്; സമീപസന്ദർഭത്തിൽ അത് ദുരാത്മാവിനെയാണ് കൂടുതൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: അവൻ ... പ്രവേശിച്ചപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിലുള്ള അയോറിസ്റ്റ് കൃദന്തം മുഖ്യക്രിയയ്ക്കുള്ള കാലപശ്ചാത്തലം നൽകുന്നു; മലയാളത്തിൽ ‘പ്രവേശിച്ചപ്പോൾ’ ഇത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς οἶκον
  choice: വീട്ടിൽ
  rationale: ഗ്രീക്കിൽ ആർട്ടിക്കിൾ ഇല്ലെങ്കിലും ആഖ്യാനസന്ദർഭത്തിലെ പരിചിതമായ വീടിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘വീട്ടിൽ’ എന്നു പറയുന്നു.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ μαθηταί എന്നതിന്റെ ബന്ധപരവും അഭ്യസനപരവുമായ അർഥം നിലനിർത്തുന്ന സ്ഥാപിതമായ മലയാളപ്രയോഗമാണ് ‘ശിഷ്യന്മാർ’.
- source_word: κατ’ ἰδίαν
  choice: സ്വകാര്യമായി
  rationale: മറ്റുള്ളവരിൽനിന്ന് വേറിട്ട് ചോദിച്ചതെന്ന ആശയം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐπηρώτων
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ പുരോഗമനസ്വഭാവം മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ആവർത്തനം നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: Ὅτι
  choice: എന്തുകൊണ്ടാണ്
  rationale: ഈ ചോദ്യസന്ദർഭത്തിൽ ὅτι കാരണമന്വേഷിക്കുന്ന ‘എന്തുകൊണ്ട്’ എന്ന അർഥത്തിലാണ്.
- source_word: ἡμεῖς οὐκ ἠδυνήθημεν
  choice: ഞങ്ങൾക്ക് ... കഴിയാതിരുന്നത്
  rationale: ശിഷ്യന്മാരുടെ കഴിവില്ലായ്മയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളചോദ്യഘടനയിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐκβαλεῖν
  choice: പുറത്താക്കാൻ
  rationale: ദുരാത്മാവിനെ ഒരാളിൽനിന്ന് നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ പ്രയോഗം.
- source_word: αὐτό
  choice: അതിനെ
  rationale: നപുംസകലിംഗ ഏകവചന സർവനാമം ആൺകുട്ടിയെക്കാൾ ദുരാത്മാവിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ‘അതിനെ’ ഈ വ്യത്യാസം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാനത്തെ αὐτό എന്ന സർവനാമത്തിന്റെ സൂചിതവിഷയം
  choice: ദുരാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി ‘അതിനെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: പീഡിതനായ ആൺകുട്ടിയെ സൂചിപ്പിക്കുന്നതായി ‘അവനെ’ എന്നു പരിഭാഷപ്പെടുത്താം.
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ സർവനാമവും ഭൂതോച്ചാടനസന്ദർഭവും ദുരാത്മാവിലേക്കാണ് കൂടുതൽ സ്വാഭാവികമായി വിരൽചൂണ്ടുന്നത്. എന്നാൽ മലയാളത്തിൽ ഈ വായന സ്വയം വ്യക്തമായതിനാൽ വ്യാഖ്യാനപരമായ അധികപദങ്ങൾ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ പുരോഗമനഭാവം ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തി; സഭാപാരമ്പര്യവിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
