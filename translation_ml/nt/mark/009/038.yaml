    rationale: ‘പുറത്താക്കുന്നതു’ is understandable but ‘പുറത്താക്കുന്നത്’ is the regular modern standard form. ‘അവനെ’ is stylistically more neutral than ‘അയാളെ’ in this formal narrative context.
