source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: ml
  text: 'യോഹന്നാൻ അവനോടു പറഞ്ഞു: “ഗുരോ, ഒരാൾ അങ്ങയുടെ നാമത്തിൽ ഭൂതങ്ങളെ പുറത്താക്കുന്നത് ഞങ്ങൾ കണ്ടു. അവൻ ഞങ്ങളെ അനുഗമിക്കാത്തതിനാൽ ഞങ്ങൾ അവനെ തടയാൻ ശ്രമിച്ചു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞങ്ങൾ അവനെ തടഞ്ഞുകൊണ്ടിരുന്നു.’ ഗ്രീക്കിലെ അപൂർണഭൂതകാലരൂപം ആവർത്തിച്ചോ തുടർന്നുകൊണ്ടിരുന്നോ ചെയ്ത പ്രവൃത്തിയെയും തടയാനുള്ള ശ്രമത്തെയും സൂചിപ്പിക്കാം; അതിനാലാണ് ‘തടയാൻ ശ്രമിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: യോഹന്നാൻ അവനോടു പറഞ്ഞു
  rationale: സാധാരണ ആഖ്യാനശൈലിയിലുള്ള ഭൂതകാല സംസാരക്രിയയായി ἔφηയെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; വ്യക്തമായ കർത്താവായ യോഹന്നാനെയും αὐτῷ എന്നതിലെ ‘അവനോട്’ എന്ന അർഥവും നിലനിർത്തി.
- source_word: Διδάσκαλε
  choice: ഗുരോ
  rationale: διδάσκαλος എന്ന അഭിസംബോധനയുടെ ‘ഗുരു/അധ്യാപകൻ’ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആദരസൂചകവുമായി നൽകുന്നു.
- source_word: εἴδομέν τινα
  choice: ഒരാൾ … ചെയ്യുന്നതു ഞങ്ങൾ കണ്ടു
  rationale: τινα വ്യക്തിയെ കൂടുതൽ നിർവചിക്കാതെ ‘ഒരാൾ’ എന്നു നൽകുന്നു; ക്രിയാവിശേഷണസ്വഭാവമുള്ള പങ്കാളിക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമം സ്വീകരിച്ചു.
- source_word: ἐν τῷ ὀνόματί σου
  choice: അങ്ങയുടെ നാമത്തിൽ
  rationale: യേശുവിന്റെ അധികാരത്തിൽ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ബൈബിൾ പ്രയോഗമായ ‘നാമത്തിൽ’ നിലനിർത്തി; അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: ഭൂതങ്ങളെ പുറത്താക്കുന്നതു
  rationale: ἐκβάλλωയുടെ പുറത്താക്കുക എന്ന അർഥവും δαιμόνιαയുടെ ഭൂതങ്ങൾ എന്ന സുവിശേഷസന്ദർഭത്തിലെ അർഥവും നേരിട്ട് നൽകുന്നു.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: ഞങ്ങൾ അയാളെ തടയാൻ ശ്രമിച്ചു
  rationale: അപൂർണഭൂതകാലമായ ἐκωλύομεν തുടരുന്ന പ്രവൃത്തിയെയോ വിജയിച്ചോ ഇല്ലയോ എന്ന് വ്യക്തമല്ലാത്ത ശ്രമത്തെയോ സൂചിപ്പിക്കാം; അതിനാൽ ‘ശ്രമിച്ചു’ എന്നത് സ്വാഭാവികമായി ആ ഭാവം പകരുന്നു, മറ്റു സാധ്യത footnote-ൽ നിലനിർത്തുന്നു.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: അയാൾ ഞങ്ങളെ അനുഗമിക്കാത്തതിനാൽ
  rationale: ἡμῖν എന്നത് വ്യക്തമായി ‘ഞങ്ങളെ/ഞങ്ങൾക്ക്’ എന്നാണ്; അതിനെ ‘അങ്ങയെ’ എന്നാക്കി വ്യാഖ്യാനപരമായി മാറ്റാതെ, ശിഷ്യസംഘത്തെ ചുറ്റിപ്പറ്റിയുള്ള യോഹന്നാന്റെ വാക്കുകളിലെ സംഘർഷം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിൽ ആ മനുഷ്യൻ ആരെയാണ് അനുഗമിക്കാത്തത്
  choice: ‘ഞങ്ങളെ അനുഗമിക്കാത്തതിനാൽ’ എന്ന് ἡμῖν നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അങ്ങയെ അനുഗമിക്കാത്തതിനാൽ’ അല്ലെങ്കിൽ ‘ഞങ്ങളുടെ കൂട്ടത്തിൽ ഒരാളല്ലാത്തതിനാൽ’.
  rationale: ഗ്രീക്കിൽ ‘ഞങ്ങളെ’ എന്നാണ് വ്യക്തമായി പറയുന്നത്. അതിനെ നിലനിർത്തുന്നത് ശിഷ്യരുടെ സംഘകേന്ദ്രിതമായ ആശങ്കയും തുടർന്നുള്ള യേശുവിന്റെ തിരുത്തലിന് പശ്ചാത്തലമാകുന്ന ആഖ്യാനപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു; ആഖ്യാനഭാഗത്ത് മൂലത്തിലെ αὐτῷ അനുസരിച്ച് ‘അവനോട്’ നിലനിർത്തി. ‘ഞങ്ങളെ അനുഗമിക്കുക’ എന്ന അല്പം അസ്വസ്ഥമാക്കുന്ന പ്രയോഗം മൂലത്തിലെ ശിഷ്യസംഘകേന്ദ്രിതമായ ഊന്നൽ സംരക്ഷിക്കാനാണ്.
