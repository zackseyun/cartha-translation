source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: ml
  text: 'അവൻ അവരോടു മറുപടിയായി പറയുന്നു: “വിശ്വസിക്കാത്ത തലമുറയേ,[a] എത്രകാലം ഞാൻ നിങ്ങളോടുകൂടെ ഇരിക്കും? എത്രകാലം ഞാൻ നിങ്ങളെ സഹിക്കും?[b] അവനെ എന്റെ അടുക്കൽ കൊണ്ടുവരൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിശ്വസ്തതയില്ലാത്ത തലമുറയേ.” ἄπιστος എന്ന ഗ്രീക്ക് പദത്തിന് വിശ്വാസമില്ലായ്മയെയോ വിശ്വസ്തതയില്ലായ്മയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “എത്രകാലം ഞാൻ നിങ്ങളെ സഹിച്ചുകൊള്ളും?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: അവൻ അവരോടു മറുപടിയായി പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്ക് കൃതന്തഘടനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: γενεὰ ἄπιστος
  choice: വിശ്വസിക്കാത്ത തലമുറയേ
  rationale: സന്ദർഭത്തിലെ വിശ്വാസക്കുറവ് വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക പ്രയോഗം. ἄπιστος എന്ന പദത്തിനുള്ള ‘വിശ്വസ്തതയില്ലാത്ത’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἕως πότε πρὸς ὑμᾶς ἔσομαι
  choice: എത്രകാലം ഞാൻ നിങ്ങളോടുകൂടെ ഇരിക്കും?
  rationale: തുടർന്നുള്ള സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ἀνέξομαι ὑμῶν
  choice: ഞാൻ നിങ്ങളെ സഹിക്കും
  rationale: യേശുവിന്റെ അസഹിഷ്ണുതയുടെയും വേദനയുടെയും ശക്തി അനാവശ്യമായി കടുപ്പിക്കാതെ ἀνέχομαι എന്നതിലെ സഹിക്കുക/പൊറുക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: φέρετε αὐτὸν πρός με
  choice: അവനെ എന്റെ അടുക്കൽ കൊണ്ടുവരൂ
  rationale: കല്പനയുടെയും യേശുവിലേക്കുള്ള ദിശയുടെയും അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ἄπιστος എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: വിശ്വസിക്കാത്ത
  alternative: വിശ്വസ്തതയില്ലാത്ത / അവിശ്വസ്തമായ
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ശക്തിയിലുള്ള വിശ്വാസക്കുറവാണ് മുൻനിരയിൽ. എന്നാൽ പദത്തിന് വിശ്വസ്തതയില്ലായ്മയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ ആ ദൈവശാസ്ത്രപരമായ അർഥസമ്മർദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ നിലനിർത്തി. അഭിസംബോധനയിലും ആവർത്തിച്ചുള്ള ചോദ്യങ്ങളിലും മൂലപാഠത്തിന്റെ വികാരതീവ്രത സംരക്ഷിച്ചു.
