  source_fidelity: The main translation accurately represents the historical present (λέγει), the rebuke of the ἄπιστος generation, both repeated temporal questions, the sense of ἀνέξομαι, and the imperative to bring the boy to Jesus. “ഇരിക്കും” is a natural rendering of continued presence in this context.
  naturalness: The Malayalam is fluent, modern, and appropriately serious. “അവരോടു മറുപടിയായി പറയുന്നു” and “അവനെ എന്റെ അടുക്കൽ കൊണ്ടുവരൂ” are natural narrative and command forms.
  terminology: “വിശ്വസിക്കാത്ത തലമുറ” appropriately conveys the contextual sense of ἄπιστος, while footnote a preserves the viable ‘faithless’ sense. The main rendering “സഹിക്കും” suitably renders ἀνέξομαι. Footnote b should not use “പൊറുക്കും,” which can suggest forgiveness rather than enduring/tolerating.
