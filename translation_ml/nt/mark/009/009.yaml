id: MRK.9.9
reference: Mark 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: ml
  text: അവർ മലയിൽനിന്ന് ഇറങ്ങിവരുമ്പോൾ, തങ്ങൾ കണ്ടത് ആരോടും പറയരുതെന്ന് അവൻ അവരോട് കർശനമായി കല്പിച്ചു—മനുഷ്യപുത്രൻ മരിച്ചവരുടെ ഇടയിൽനിന്ന്[b] ഉയിർത്തെഴുന്നേറ്റശേഷമല്ലാതെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യാവഹാരികമായി: “മനുഷ്യപുത്രൻ മരിച്ചവരുടെ ഇടയിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുന്നതുവരെ.”'
    reason: alternative_reading
  - marker: b
    text: 'ഗ്രീക്ക്: “മരിച്ചവരുടെ ഇടയിൽനിന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων
  choice: ഇറങ്ങിവരുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം മുഖ്യപ്രവൃത്തിയോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὄρους
  choice: മല
  rationale: ὄρος സാധാരണയായി മലയെ സൂചിപ്പിക്കുന്നു; രൂപാന്തരീകരണത്തിന്റെ കഥാസന്ദർഭത്തിനും ഇത് യോജിക്കുന്നു.
- source_word: διεστείλατο
  choice: കർശനമായി കല്പിച്ചു
  rationale: ഈ ക്രിയ ശക്തമായ നിർദേശം അഥവാ വിലക്ക് നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കർശനമായി കല്പിച്ചു’ അതിന്റെ ബലം ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα μηδενὶ ... διηγήσωνται
  choice: ആരോടും പറയരുതെന്ന്
  rationale: കല്പനയുടെ ഉള്ളടക്കവും μηδενί എന്ന നിഷേധാത്മക ദാതിവിന്റെ അർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἃ εἶδον
  choice: തങ്ങൾ കണ്ടത്
  rationale: നപുംസകലിംഗ ബഹുവചന ബന്ധസർവനാമത്തെ മലയാളത്തിൽ ഏകവചനസദൃശമായ ‘കണ്ടത്’ എന്നു നൽകുന്നത് സ്വാഭാവികമാണ്; ശിഷ്യന്മാരിലേക്കുള്ള പ്രത്യാവർത്തനബന്ധം ‘തങ്ങൾ’ വ്യക്തമാക്കുന്നു.
- source_word: εἰ μὴ ὅταν
  choice: …കഴിഞ്ഞാലല്ലാതെ
  rationale: അക്ഷരാർഥത്തിലെ ‘എപ്പോൾ അല്ലാതെ’ എന്ന അപവാദഘടനയും ഭാവിയിലെ ഒരു സംഭവം പൂർത്തിയായ ശേഷമുള്ള സമയപരിധിയും മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘വരെ’ എന്ന അർത്ഥസമീപമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ ഈ സ്വയംവിശേഷണം പരിഭാഷപ്പെടുത്തി നിലനിർത്തുകയും അതിന്റെ ദാനിയേൽഗ്രന്ഥസംബന്ധിയായ പ്രതിധ്വനി മായ്ച്ചുകളയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരുടെ ഇടയിൽനിന്ന്
  rationale: മരണാവസ്ഥയിൽനിന്ന് എന്നതിലുപരി മരിച്ചവരുടെ കൂട്ടത്തിൽനിന്നുള്ള ഉയിർപ്പെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: ἀναστῇ
  choice: ഉയിർത്തെഴുന്നേറ്റുകഴിഞ്ഞാൽ
  rationale: ὅταν എന്നതിനുശേഷമുള്ള aorist subjunctive, കല്പന നൽകിയ സമയത്തോട് താരതമ്യത്തിൽ ഭാവിയിൽ പൂർത്തിയാകുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ഈ രൂപം ആ പൂർത്തിത്വം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന വിശേഷണത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: പരമ്പരാഗതവും അർത്ഥസുതാര്യവുമായ ഈ രൂപം ഗ്രീക്ക് പ്രയോഗത്തെയും അതിന്റെ സാധ്യതയുള്ള ദാനിയേൽഗ്രന്ഥസൂചനയെയും സംരക്ഷിക്കുന്നു; അതിനെ ഒരു പൊതുവായ മനുഷ്യവിശേഷണമായി ചുരുക്കുന്നില്ല.
- issue: εἰ μὴ ὅταν എന്നതിന്റെ കാലസംബന്ധിയായ ബലം
  choice: ഉയിർത്തെഴുന്നേറ്റുകഴിഞ്ഞാലല്ലാതെ
  alternative: ഉയിർത്തെഴുന്നേൽക്കുന്നതുവരെ
  rationale: ഗ്രീക്കിലെ രൂപം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘എപ്പോൾ അല്ലാതെ’ എന്നതാണ്; പ്രായോഗിക അർത്ഥം ‘വരെ’ എന്നതിനോട് ചേർന്നുനിൽക്കുന്നു. മുഖ്യപാഠം അപവാദഘടന നിലനിർത്തുകയും മറ്റൊരു സ്വാഭാവിക വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കർശനമായി കല്പിച്ചു’ കല്പനയുടെ ബലം നിലനിർത്തുന്നു; ‘മനുഷ്യപുത്രൻ’ സ്ഥാപിതമായ ബൈബിൾ വിശേഷണമായി സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ഘടകങ്ങളോടു ചേർത്തിരിക്കുന്നു.
