  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: ml
  text: എന്നാൽ യേശു അവന്റെ കൈ പിടിച്ച്, അവനെ എഴുന്നേൽപ്പിച്ചു[a]; അവൻ എഴുന്നേറ്റുനിന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ ഉയർത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ ഗ്രീക്ക് ക്രിയ ഉറക്കത്തിൽനിന്നോ മരണത്തിൽനിന്നോ എഴുന്നേൽപ്പിക്കുന്ന സന്ദർഭങ്ങളിലും ഉപയോഗിക്കപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവൻ എഴുന്നേറ്റു’ അല്ലെങ്കിൽ ‘അവൻ നിവർന്നുനിന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മരിച്ചുപോയെന്ന ജനക്കൂട്ടത്തിന്റെ ധാരണയ്ക്കു പിന്നാലെയുള്ള യേശുവിന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന നേരിയ വൈരുധ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κρατήσας
  choice: പിടിച്ച്
  rationale: യേശു ബാലന്റെ കൈയിൽ ശരീരമായി പിടിച്ച പ്രവൃത്തിയെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; അതേസമയം ബലമായി പിടിച്ചെന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: τῆς χειρὸς αὐτοῦ
  choice: അവന്റെ കൈയിൽ
  rationale: χείρ എന്ന പദം സൂചിപ്പിക്കുന്ന ‘കൈ’ എന്ന പ്രത്യേക ശരീരഭാഗം മാറ്റാതെ, κρατέωയോടൊപ്പമുള്ള ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἤγειρεν
  choice: അവനെ എഴുന്നേൽപ്പിച്ചു
  rationale: നിലത്തുകിടന്ന ബാലനെ യേശു എഴുന്നേൽപ്പിച്ചതെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ഉറക്കത്തിൽനിന്നോ മരണത്തിൽനിന്നോ എഴുന്നേൽപ്പിക്കുന്നതിനും ഉപയോഗിക്കാവുന്ന ക്രിയയുടെ വിശാലമായ അനുരണനം പൂർണമായി ഇല്ലാതാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνέστη
  choice: അവൻ എഴുന്നേറ്റുനിന്നു
  rationale: യേശു എഴുന്നേൽപ്പിച്ചതിന്റെ ഫലമായി ബാലൻ എഴുന്നേറ്റ് നിവർന്നുനിന്നുവെന്ന പൂർത്തിയായ ചലനം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
theological_decisions:
- issue: ἤγειρεν / ἀνέστη എന്നീ ക്രിയകളിലെ പുനരുത്ഥാനഭാഷയുടെ സാധ്യതയുള്ള അനുരണനം
  choice: സന്ദർഭത്തിൽ സാധാരണ ശാരീരികമായി എഴുന്നേൽക്കുന്ന അർഥം മുൻനിർത്തി ‘എഴുന്നേൽപ്പിച്ചു / എഴുന്നേറ്റുനിന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഉയിർപ്പിച്ചു / ഉയിർത്തെഴുന്നേറ്റു’ എന്നിങ്ങനെ പുനരുത്ഥാനധ്വനി കൂടുതൽ ശക്തമാക്കുക, അല്ലെങ്കിൽ ‘എഴുന്നേൽക്കാൻ സഹായിച്ചു / എഴുന്നേറ്റു’ എന്ന് പറഞ്ഞ് ആ ധ്വനി പൂർണമായി മൃദൂകരിക്കുക.
  rationale: ഉടൻചുറ്റുമുള്ള സന്ദർഭം ഭൂതബാധയിൽനിന്നു മോചിതനായ ബാലനെ യേശു നിലത്തുനിന്ന് എഴുന്നേൽപ്പിക്കുന്നതാണ്; മരിച്ചവനിൽനിന്നുള്ള പുനരുത്ഥാനം ഇവിടെ വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല. എങ്കിലും ഗ്രീക്ക് ക്രിയകൾക്ക് മറ്റു സന്ദർഭങ്ങളിൽ ഉറക്കത്തിൽനിന്നോ മരണത്തിൽനിന്നോ എഴുന്നേൽക്കുന്നതിന്റെ അർഥമുണ്ടാകുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പുകളിൽ സൂചിപ്പിച്ച് വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ‘എഴുന്നേൽപ്പിച്ചു / എഴുന്നേറ്റുനിന്നു’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ബന്ധമുള്ള രണ്ടു ക്രിയകളെയും വേർതിരിച്ചുകാട്ടുന്നു; അർഥം അനാവശ്യമായി പുനരുത്ഥാനത്തിലേക്കു ചുരുക്കുന്നില്ല.
