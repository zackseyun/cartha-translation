    text: ‘അവനെ ഉയർത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ ഗ്രീക്ക് ക്രിയ ഉറക്കത്തിൽനിന്നോ മരണത്തിൽനിന്നോ എഴുന്നേൽപ്പിക്കുന്ന സന്ദർഭങ്ങളിലും ഉപയോഗിക്കപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
