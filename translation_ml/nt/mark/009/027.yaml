revisions:
- from: എന്നാൽ യേശു അവന്റെ കൈയിൽ പിടിച്ച് അവനെ എഴുന്നേൽപ്പിച്ചു[a]; അവൻ എഴുന്നേറ്റുനിന്നു[b].
  to: എന്നാൽ യേശു അവന്റെ കൈ പിടിച്ച്, അവനെ എഴുന്നേൽപ്പിച്ചു[a]; അവൻ എഴുന്നേറ്റുനിന്നു[b].
