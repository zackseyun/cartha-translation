revisions:
- from: അവർ ആ വാക്ക് തങ്ങൾക്കുള്ളിൽത്തന്നെ സൂക്ഷിച്ചു; മരിച്ചവരുടെ ഇടയിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുക എന്നത് എന്താണെന്ന് അവർ തമ്മിൽ ചർച്ചചെയ്തു.
  to: അവർ ആ വാക്ക് തങ്ങൾക്കിടയിൽത്തന്നെ സൂക്ഷിച്ചു; മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുക എന്നത് എന്താണെന്ന് അവർ പരസ്പരം ചർച്ചചെയ്തുകൊണ്ടിരുന്നു.
  rationale: The revision clarifies that the disciples kept the saying private within their group, not merely in their individual thoughts, and uses idiomatic modern Malayalam for the resurrection expression. The ongoing participial sense of συζητοῦντες is represented by «ചർച്ചചെയ്തുകൊണ്ടിരുന്നു». No footnote is needed, since the Malayalam rendering is both faithful and natural and no disputed textual issue is involved.
