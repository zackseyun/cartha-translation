id: MRK.9.10
reference: Mark 9:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον ἐκράτησαν πρὸς ἑαυτοὺς συζητοῦντες τί ἐστιν τὸ ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: ml
  text: അവർ ആ വാക്ക് തങ്ങൾക്കിടയിൽത്തന്നെ സൂക്ഷിച്ചു; മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുക എന്നത് എന്താണെന്ന് അവർ പരസ്പരം ചർച്ചചെയ്തുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν λόγον
  choice: ആ വാക്ക്
  rationale: മുൻവാക്യത്തിൽ യേശു പറഞ്ഞ നിർദേശത്തെയോ പ്രസ്താവനയെയോ സൂചിപ്പിക്കുന്നു. ‘വാക്ക്’ മലയാളത്തിൽ പ്രസ്താവന എന്ന വിപുലമായ അർഥവും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἐκράτησαν
  choice: സൂക്ഷിച്ചു
  rationale: κρατέω എന്നതിന്റെ ‘പിടിച്ചുവെക്കുക/കാത്തുസൂക്ഷിക്കുക’ എന്ന ആശയം πρὸς ἑαυτούς-നോടൊപ്പം ഇവിടെ കാര്യം സ്വന്തം വൃത്തത്തിനുള്ളിൽ നിലനിർത്തിയെന്ന അർഥം നൽകുന്നു.
- source_word: πρὸς ἑαυτοὺς
  choice: തങ്ങൾക്കുള്ളിൽത്തന്നെ
  rationale: അവർ അത് പുറത്തു പറയാതെ സ്വന്തം കൂട്ടത്തിനുള്ളിൽ സൂക്ഷിച്ചുവെന്നതും തുടർന്ന് പരസ്പരം ചർച്ചചെയ്തുവെന്നതും ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: συζητοῦντες
  choice: അവർ തമ്മിൽ ചർച്ചചെയ്തു
  rationale: പരസ്പരമുള്ള അന്വേഷണാത്മക സംഭാഷണമാണ് സൂചിപ്പിക്കുന്നത്; ‘തർക്കിച്ചു’ എന്നു പറഞ്ഞാൽ മൂലപാഠത്തിൽ നിർബന്ധമില്ലാത്ത സംഘർഷഭാവം വരാം.
- source_word: τί ἐστιν
  choice: എന്നത് എന്താണെന്ന്
  rationale: ‘അത് എന്താണ്’ എന്ന മൂലഘടന നിലനിർത്തിക്കൊണ്ട്, ശിഷ്യന്മാരുടെ ഗ്രഹിക്കാനാകാത്ത അവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: മരിച്ചവരുടെ ഇടയിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുക
  rationale: ἐκ νεκρῶν എന്നതിലെ ‘മരിച്ചവരുടെ ഇടയിൽനിന്ന്’ എന്ന സൂക്ഷ്മതയും ἀναστῆναι എന്ന പുനരുത്ഥാനഭാഷയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ ചർച്ചയിലെ പുനരുത്ഥാനഭാഷ
  choice: മരിച്ചവരുടെ ഇടയിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുക
  alternative: മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുക
  rationale: ‘ഇടയിൽനിന്ന്’ എന്നത് ἐκ νεκρῶν എന്ന പ്രയോഗത്തിന്റെ രൂപം കൂടുതൽ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു. ശിഷ്യന്മാർക്ക് അതിന്റെ അർഥം വ്യക്തമല്ലെന്ന പാഠത്തിലെ പിരിമുറുക്കം വിശദീകരിച്ചുതീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ തുടർച്ചയും ശിഷ്യന്മാരുടെ ആശയക്കുഴപ്പവും നിലനിർത്താൻ അർധവിരാമം ഉപയോഗിച്ചു.
