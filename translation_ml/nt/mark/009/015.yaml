  to: ഉടനെ, ജനക്കൂട്ടം മുഴുവനും അവനെ കണ്ടപ്പോൾ അത്യന്തം വിസ്മയിച്ചു[a]; അവർ അവന്റെ അടുക്കലേക്ക് ഓടിച്ചെന്ന് അവനെ അഭിവാദ്യം ചെയ്തു.
