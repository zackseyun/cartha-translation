reference: Mark 9:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: ml
  text: അത് നിലവിളിക്കുകയും അവനെ ശക്തമായി വിറപ്പിക്കുകയും ചെയ്തശേഷം അവനിൽനിന്ന് പുറത്തുവന്നു; ബാലൻ മരിച്ചവനെപ്പോലെയായി. അതിനാൽ പലരും, “അവൻ മരിച്ചുപോയി,” എന്നു പറയാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κράξας
  choice: നിലവിളിച്ചുകൊണ്ട്
  rationale: ശബ്ദത്തിന്റെ സ്വഭാവം ‘അലർച്ച’യെന്നോ ‘ചീറൽ’ എന്നോ അതിവ്യാഖ്യാനിക്കാതെ, ശക്തമായി വിളിച്ചുപറയുക എന്ന ക്രിയാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πολλὰ σπαράξας
  choice: അവനെ കഠിനമായി വിറപ്പിച്ചശേഷം
  rationale: ഭൂതബാധയുടെ ഈ സന്ദർഭത്തിൽ σπαράσσω ശരീരം കീറുക എന്നതിലുപരി ശക്തമായ ഞെരുക്കമോ വിറയലോ ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; πολλὰയുടെ തീവ്രത ‘കഠിനമായി’ എന്നതിൽ പ്രതിഫലിക്കുന്നു. കർമമായ ബാലനെ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἐξῆλθεν
  choice: അവനിൽനിന്ന് പുറത്തുവന്നു
  rationale: മുൻസന്ദർഭത്തിലെ അശുദ്ധാത്മാവാണ് അപ്രകടമായ കർത്താവ്. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ബാലനിൽനിന്നുള്ള പുറപ്പെടൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: ബാലൻ മരിച്ചവനെപ്പോലെയായി
  rationale: ὡσεὶ സൂചിപ്പിക്കുന്ന ഉപമയും പ്രത്യക്ഷാവസ്ഥയും സംരക്ഷിക്കുന്നു; ബാലൻ യഥാർഥത്തിൽ മരിച്ചുവെന്ന് വിവർത്തകൻ ഉറപ്പിക്കുന്നില്ല.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: അതുകൊണ്ട് പലരും … എന്നു പറഞ്ഞു
  rationale: τοὺς πολλούς എന്നത് നിർബന്ധമായി ‘ഭൂരിഭാഗം’ എന്നല്ല, സ്വാഭാവികമായി ‘പലരും’ എന്നാണ്. ഫലബന്ധം ‘അതുകൊണ്ട്’ വഴി വ്യക്തമാക്കുന്നു.
- source_word: ὅτι ἀπέθανεν
  choice: “അവൻ മരിച്ചുപോയി”
  rationale: കാഴ്ചക്കാരുടെ നിഗമനം നേരിട്ടുള്ള ഉദ്ധരണിയായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഇത് ആഖ്യാതാവിന്റെ പ്രഖ്യാപനമല്ല.
theological_decisions:
- issue: ബാലൻ യഥാർഥത്തിൽ മരിച്ചോ, മരിച്ചതുപോലെ മാത്രം കാണപ്പെട്ടോ
  choice: ആഖ്യാതാവ് ബാലൻ ‘മരിച്ചവനെപ്പോലെയായി’ എന്നു പറയുന്നു; മരണം കാഴ്ചക്കാരുടെ നിഗമനമായി മാത്രം അവതരിപ്പിക്കുന്നു.
  alternative: ബാലൻ താൽക്കാലികമായി യഥാർഥത്തിൽ മരിച്ചു.
  rationale: ὡσεὶ എന്ന താരതമ്യപദവും ‘പലരും പറഞ്ഞു’ എന്ന ജനക്കൂട്ടത്തിന്റെ പ്രതികരണവും യഥാർഥമരണം ആഖ്യാതാവ് ഉറപ്പിക്കുന്നില്ലെന്ന് കാണിക്കുന്നു. അതിനാൽ പുനരുത്ഥാനമെന്ന ആശയം ഈ വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ബാലൻ’ എന്നത് സർവനാമങ്ങളുടെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭാനുസൃതമായി ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ പ്രത്യക്ഷമരണവും യഥാർഥമരണവും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തി.
