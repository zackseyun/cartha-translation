id: MRK.9.12
reference: Mark 9:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഏലിയാവ് ആദ്യം വന്ന് എല്ലാം പുനഃസ്ഥാപിക്കുന്നു. മനുഷ്യപുത്രൻ അനേകം കഷ്ടങ്ങൾ അനുഭവിക്കുകയും നിന്ദിക്കപ്പെടുകയും[a] വേണമെന്ന് അവനെക്കുറിച്ച് എഴുതിയിരിക്കുന്നത് എങ്ങനെ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്ദിക്കപ്പെടുക” എന്നതിന് “അവജ്ഞയോടെ പരിഗണിക്കപ്പെടുക” അഥവാ “ഒന്നുമല്ലാത്തവനായി കണക്കാക്കപ്പെടുക” എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: സാധാരണ ആഖ്യാനശൈലിയിലുള്ള പ്രസ്താവനയായി സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
- source_word: Ἠλίας μὲν ἐλθὼν πρῶτον
  choice: ഏലിയാവ് ആദ്യം വന്ന്
  rationale: പങ്കാളിക്രിയയുടെ മുൻകാലബന്ധവും πρῶτον എന്നതിന്റെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀποκαθιστάνει πάντα
  choice: എല്ലാം പുനഃസ്ഥാപിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ പൊതുവായ/സജീവമായ പ്രസ്താവനാഭാവവും πάντα എന്നതിന്റെ വിശാലതയും സംരക്ഷിക്കുന്നു.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രനെക്കുറിച്ച് എഴുതിയിരിക്കുന്നത് എങ്ങനെ?
  rationale: തിരുവെഴുത്തിനെ സൂചിപ്പിക്കുന്ന γέγραπται എന്ന പ്രയോഗവും ഗ്രീക്കിലെ ചോദ്യരൂപവും നിലനിർത്തുന്നു.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിലെ സ്ഥാപിതവും അർത്ഥസമ്പന്നവുമായ പദവി വ്യാഖ്യാനവികാസമില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: πολλὰ πάθῃ
  choice: അനേകം കഷ്ടങ്ങൾ അനുഭവിക്കുകയും
  rationale: നപുംസക ബഹുവചനത്തിന്റെ അനേകതയും πάσχω എന്നതിന്റെ കഷ്ടാനുഭവ അർത്ഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: ἐξουδενηθῇ
  choice: നിന്ദിക്കപ്പെടുകയും
  rationale: വിലയില്ലാത്തവനായി കണക്കാക്കുക, അവജ്ഞയോടെ പെരുമാറുക എന്ന നിഷ്ക്രിയഭാവം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു; കൂടുതൽ പദാനുസൃതമായ അർത്ഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἵνα
  choice: വേണമെന്ന്
  rationale: എഴുതിയിരിക്കുന്നതിന്റെ ഉള്ളടക്കമായ തിരുവെഴുത്തുപരമായ അനിവാര്യത/പ്രതീക്ഷ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; കേവല ഉദ്ദേശ്യാർഥമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ഏലിയാവിന്റെ പുനഃസ്ഥാപനദൗത്യവും മനുഷ്യപുത്രന്റെ കഷ്ടാനുഭവവും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടാം വാക്യം യഥാർഥ ആലങ്കാരിക ചോദ്യമായി നിലനിർത്തി.
  alternative: ‘എന്നിട്ടും എങ്ങനെ...’ എന്നു വ്യക്തമായ വൈരുധ്യം ചേർക്കുക, അല്ലെങ്കിൽ ചോദ്യത്തെ വിശദീകരണപ്രസ്താവനയാക്കി മാറ്റുക.
  rationale: πῶς ... γέγραπται ...; എന്ന ഗ്രീക്ക് ഘടന ചോദ്യമാണ്. പുനഃസ്ഥാപനവും കഷ്ടാനുഭവവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനം തന്നെ പരിഹരിക്കരുത്.
- issue: ‘മനുഷ്യപുത്രൻ’ എന്ന പദവിയുടെ സൂചന
  choice: ‘മനുഷ്യപുത്രൻ’ എന്ന പദവി അതേപടി നിലനിർത്തി.
  alternative: ‘മശീഹാ’ എന്നോ ‘മനുഷ്യനായവൻ’ എന്നോ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പദപ്രയോഗത്തിന്റെ മശീഹീയവും അന്ത്യകാലപരവുമായ സാധ്യതകൾ തുറന്നുവെക്കാൻ സ്ഥാപിത പദവി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. തിരുവെഴുത്തുപരമായ പദവിയായി ‘മനുഷ്യപുത്രൻ’ നിലനിർത്തിയിരിക്കുന്നു. പ്രധാന പാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട പദമായ ‘നിന്ദിക്കപ്പെടുകയും’ എന്നതിനു പിന്നാലെ വാക്യാവസാനത്തിൽ നൽകിയിരിക്കുന്നു.
