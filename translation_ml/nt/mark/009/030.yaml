source:
  edition: SBLGNT
  text: Κἀκεῖθεν ἐξελθόντες ⸀παρεπορεύοντο διὰ τῆς Γαλιλαίας, καὶ οὐκ ἤθελεν ἵνα τις γνοῖ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: ml
  text: അവിടെനിന്ന് പുറപ്പെട്ട അവർ ഗലീലയിലൂടെ കടന്നുപോകുകയായിരുന്നു.[a] ആരും അറിയണമെന്ന് അവൻ ആഗ്രഹിച്ചില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗലീലയിലൂടെ കടന്നുപൊയ്ക്കൊണ്ടിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ അപൂർണ്ണകാലക്രിയ തുടരുന്ന ചലനത്തെ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
  - marker: b
    text: ആരും എന്ത് അറിയരുതെന്ന കാര്യം ഗ്രീക്ക് വ്യക്തമാക്കുന്നില്ല; സന്ദർഭത്തിൽ, അവൻ ഗലീലയിൽ ഉണ്ടായിരുന്നതോ അതിലൂടെ സഞ്ചരിച്ച വഴിയോ ഇതു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν
  choice: അവർ അവിടെനിന്ന്
  rationale: καί + ἐκεῖθεν മുൻസംഭവത്തോടുള്ള തുടർച്ചയും ആ സ്ഥലത്തുനിന്നുള്ള നീക്കവും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ സന്ദർഭതുടർച്ച സ്വാഭാവികമായി നിലനിൽക്കുന്നതിനാൽ വേറൊരു ‘പിന്നെ’ ചേർക്കാതെ ‘അവിടെനിന്ന്’ എന്നു നൽകി.
- source_word: ἐξελθόντες
  choice: പുറപ്പെട്ട്
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ aorist participle മുൻസ്ഥലം വിട്ടുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ട്’ എന്നത് അതിനെ ചുരുക്കമായും സ്വാഭാവികമായും മുഖ്യചലനക്രിയയോട് ബന്ധിപ്പിക്കുന്നു.
- source_word: παρεπορεύοντο
  choice: കടന്നുപോകുകയായിരുന്നു
  rationale: Imperfect രൂപം തുടരുന്ന ചലനത്തെ മുൻനിർത്തുന്നു. ‘കടന്നുപോകുകയായിരുന്നു’ പ്രദേശത്തിലൂടെയുള്ള പുരോഗമനയാത്രയും അപൂർണ്ണകാലഭാവവും നിലനിർത്തുന്നു.
- source_word: διὰ τῆς Γαλιλαίας
  choice: ഗലീലയിലൂടെ
  rationale: Genitive-നോടുകൂടിയ διά ഒരു പ്രദേശത്തിലൂടെയുള്ള ചലനമാണ് സൂചിപ്പിക്കുന്നത്; ‘ഗലീലയിലൂടെ’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: οὐκ ἤθελεν
  choice: ആഗ്രഹിച്ചു
  rationale: οὐκ ἤθελεν എന്ന നിഷേധാത്മക ഇച്ഛയെ, തുടർന്നുള്ള നിഷേധനിർദ്ദേശത്തോടൊപ്പം, മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആരും അറിയരുതെന്ന് ... ആഗ്രഹിച്ചു’ എന്നു നൽകി.
- source_word: ἵνα τις γνοῖ
  choice: ആരും അറിയരുതെന്ന്
  rationale: ἵνα + aorist subjunctive ഇവിടെ അറിവ് തടയാനുള്ള ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു. അറിയേണ്ട വിഷയം ഗ്രീക്കിലേതുപോലെ വ്യക്തമാക്കാതെ വിട്ടിരിക്കുന്നു.
theological_decisions:
- issue: ἤθελεν എന്ന ഏകവചനക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: ‘അവൻ’ എന്നു നൽകി; സന്ദർഭത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: കർത്താവിനെ ആവർത്തിക്കാതെ പൂർണമായി പരോക്ഷമായി വിടുക.
  rationale: ഏകവചനക്രിയ സന്ദർഭത്തിലെ യേശുവിലേക്കാണ് സ്വാഭാവികമായി മടങ്ങുന്നത്. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘അവൻ’ ആവശ്യമാണ്; ഇത് അധികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: γνοῖ എന്നതിന്റെ പ്രസ്താവിക്കാത്ത കർമം
  choice: എന്താണ് ആരും അറിയരുതെന്ന് പാഠത്തിൽ വ്യക്തമാക്കിയില്ല.
  alternative: യേശുവിന്റെ സാന്നിധ്യമോ യാത്രാമാർഗമോ ആരും അറിയരുതെന്ന് വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് മൂലപാഠം അറിവിന്റെ കർമം പ്രസ്താവിക്കുന്നില്ല. സന്ദർഭം ചില സാധ്യതകൾ നൽകുന്നെങ്കിലും അവയിൽ ഒന്നിനെ മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കുന്നത് യഥാർത്ഥ അസ്പഷ്ടത ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ആദ്യവാക്യത്തിലെ ‘പുറപ്പെട്ട്’ departure nuance വ്യക്തമാക്കുകയും ‘കടന്നുപോകുകയായിരുന്നു’ തുടരുന്ന ചലനം നിലനിർത്തുകയും ചെയ്യുന്നു. രണ്ടാംവാക്യം സ്വാഭാവിക മലയാളത്തിനായി നിഷേധത്തെ ἵνα-clause-ൽ അവതരിപ്പിക്കുമ്പോഴും മൂലത്തിലെ ഇച്ഛാഭാവവും പ്രസ്താവിക്കാത്ത കർമവും സംരക്ഷിക്കുന്നു.
