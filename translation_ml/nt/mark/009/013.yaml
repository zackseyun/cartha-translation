id: MRK.9.13
reference: Mark 9:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ഏലിയാവും വന്നിരിക്കുന്നു[a]; അവർ അവനോട് തങ്ങൾക്കിഷ്ടമുള്ളതെല്ലാം ചെയ്തു, അവനെക്കുറിച്ച് എഴുതിയിരിക്കുന്നതുപോലെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, സന്ദർഭത്തിൽ ഇത് യോഹന്നാൻ സ്നാപകനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കപ്പെടുന്നു; മർക്കോസ് 9:11–12 കാണുക; മത്തായി 11:14; 17:12–13 എന്നിവയും താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: ശിഷ്യന്മാരുടെ ഏലിയാവിനെക്കുറിച്ചുള്ള പ്രതീക്ഷയോടുള്ള വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: വ്യക്തിപരമായ അഭിസംബോധനയും നേരിട്ടുള്ള പ്രസ്താവനയുടെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: ഏലിയാവും വന്നുകഴിഞ്ഞു
  rationale: καὶ എന്നതിനെ ‘-വും’ കൊണ്ടും, പൂർത്തിയായ വരവിനെയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയെയും സൂചിപ്പിക്കുന്ന perfect രൂപമായ ἐλήλυθεν എന്നതിനെ ‘വന്നുകഴിഞ്ഞു’ കൊണ്ടും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐποίησαν αὐτῷ ὅσα ἤθελον
  choice: അവർ തങ്ങൾക്കിഷ്ടമുള്ളതെല്ലാം അവനോടു ചെയ്തു
  rationale: പ്രവർത്തിച്ചവരെ നിർവചിക്കാതെ ‘അവർ’ എന്നു നിലനിർത്തുകയും, ὅσα എന്നതിന്റെ നിയന്ത്രണമില്ലാത്ത വ്യാപ്തി ‘എല്ലാം’ എന്നു പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെതന്നെ
  rationale: തിരുവെഴുത്തിനെ സൂചിപ്പിക്കുന്ന പതിവ് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പൂർത്തിയായതും നിലവിൽ പ്രാബല്യമുള്ളതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπ’ αὐτόν
  choice: അവനെക്കുറിച്ച്
  rationale: γράφω എന്ന ക്രിയയോടൊപ്പമുള്ള ἐπί + accusative ഇവിടെ ഏറ്റവും സ്വാഭാവികമായി ‘അവനെക്കുറിച്ച്/അവനെ സംബന്ധിച്ച്’ എന്നാണ്; ‘അവനെതിരെ’ എന്ന സാധ്യത സന്ദർഭത്തിൽ കുറവാണ്.
theological_decisions:
- issue: ഈ വചനത്തിലെ ഏലിയാവിന്റെ തിരിച്ചറിയൽ
  choice: പ്രധാന പാഠത്തിൽ ‘ഏലിയാവ്’ എന്ന പേര് മാത്രം നിലനിർത്തി; യോഹന്നാൻ സ്നാപകനുമായുള്ള ബന്ധം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘യോഹന്നാൻ സ്നാപകന്റെ വ്യക്തിയിലും ശുശ്രൂഷയിലും ഏലിയാവ് വന്നു’ എന്ന തിരിച്ചറിയൽ പ്രധാന പാഠത്തിൽ ചേർക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ഏലിയാവിനെ മാത്രമാണ് നേരിട്ട് പേരെടുത്ത് പറയുന്നത്. സന്ദർഭം യോഹന്നാൻ സ്നാപകനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, അത് വിവർത്തനത്തിൽ ചേർത്ത് അവ്യക്തത തീർക്കാതെ വ്യാഖ്യാനാത്മക അടിക്കുറിപ്പായി നൽകുന്നതാണ് ഉചിതം.
- issue: ἐπ’ αὐτόν എന്നതിന്റെ അർത്ഥം
  choice: ‘അവനെക്കുറിച്ച്’
  alternative: ‘അവനെതിരെ’
  rationale: വ്യാകരണപരമായി ‘അവനെതിരെ’ എന്ന അർത്ഥം സാദ്ധ്യമാകാമെങ്കിലും, γέγραπται എന്ന തിരുവെഴുത്ത്-സൂചനാ പ്രയോഗത്തോടും സന്ദർഭത്തോടും ‘അവനെക്കുറിച്ച്’ കൂടുതൽ യോജിക്കുന്നു; പ്രധാന സാധ്യതയെ പാഠത്തിൽ സ്വീകരിക്കുമ്പോഴും പദത്തിന്റെ സാധ്യതാപരിധി അംഗീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വന്നുകഴിഞ്ഞു’ എന്ന രൂപം ഗ്രീക്ക് perfect-ന്റെ പൂർത്തിയായ വരവും ഇപ്പോഴത്തെ പ്രസക്തിയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി ക്രമീകരിച്ചിട്ടും മൂലപാഠത്തിലെ വൈരുധ്യം, ആവർത്തനഘടന, വ്യാഖ്യാനാത്മക തുറന്ന നില എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്.
