  naturalness: ‘വന്നുകഴിഞ്ഞു’ തെറ്റല്ലെങ്കിലും ഈ ഗൗരവമുള്ള സന്ദർഭത്തിൽ ‘വന്നിരിക്കുന്നു’ കൂടുതൽ സുഗമവും നിലവാരമലയാളത്തിന് യോജിച്ചതുമാണ്. ‘അവർ തങ്ങൾക്കിഷ്ടമുള്ളതെല്ലാം അവനോടു ചെയ്തു’ എന്നതിനു പകരം ‘അവർ അവനോട് തങ്ങൾക്കിഷ്ടമുള്ളതെല്ലാം ചെയ്തു’ എന്ന ക്രമം കൂടുതൽ സ്വാഭാവികമാണ്.
  terminology: ‘ഏലിയാവ്,’ ‘യോഹന്നാൻ സ്നാപകൻ,’ ‘എഴുതിയിരിക്കുന്നതുപോലെ’ എന്നിവ യോജിച്ച പ്രയോഗങ്ങളാണ്. എന്നാൽ അടിക്കുറിപ്പിലെ ‘വ്യക്തിയിലും ശുശ്രൂഷയിലും ഏലിയാവ് വന്നിരുന്നു’ എന്നത് വ്യാഖ്യാനത്തെ ഉറച്ച തിരിച്ചറിയലായി അവതരിപ്പിക്കുന്നു; മൂലവാക്യത്തിലെ തുറന്ന നില സംരക്ഷിക്കാൻ അതിനെ കൂടുതൽ സൂക്ഷ്മമായി പറയണം.
