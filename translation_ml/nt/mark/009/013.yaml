revisions:
- from: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ഏലിയാവും വന്നുകഴിഞ്ഞു[a]. അവനെക്കുറിച്ച് എഴുതിയിരിക്കുന്നതുപോലെതന്നെ, അവർ തങ്ങൾക്കിഷ്ടമുള്ളതെല്ലാം അവനോടു ചെയ്തു.'
