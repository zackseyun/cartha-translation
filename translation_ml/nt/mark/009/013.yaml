  rationale: വാക്യത്തിന്റെ ഗ്രീക്ക് ക്രമവും ബന്ധവും കൂടുതൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കാൻ ‘അവനെക്കുറിച്ച് എഴുതിയിരിക്കുന്നതുപോലെ’ എന്നത് പ്രവൃത്തിക്കുശേഷം സ്ഥാപിച്ചു. Perfect രൂപത്തിന്റെ ഫലപ്രസക്തി സ്വാഭാവികമായി നൽകാൻ ‘വന്നിരിക്കുന്നു’ സ്വീകരിച്ചു. അടിക്കുറിപ്പ് യോഹന്നാൻ സ്നാപകനെക്കുറിച്ചുള്ള സന്ദർഭവായന അറിയിക്കുമ്പോഴും, പ്രധാന പാഠത്തിൽ ഇല്ലാത്ത വിശദമായ തിരിച്ചറിയൽ ഉറപ്പിച്ച് ചേർക്കാതിരിക്കാൻ മൃദുവാക്കി.
