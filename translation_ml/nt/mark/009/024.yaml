id: MRK.9.24
reference: Mark 9:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: ml
  text: 'ഉടനെ കുട്ടിയുടെ അപ്പൻ നിലവിളിച്ചു പറഞ്ഞു: “ഞാൻ വിശ്വസിക്കുന്നു; എന്റെ അവിശ്വാസത്തിൽ എന്നെ സഹായിക്കണമേ!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ വിശ്വാസക്കുറവിൽ എന്നെ സഹായിക്കണമേ” എന്നും പരിഭാഷപ്പെടുത്താം. ἀπιστία എന്ന ഗ്രീക്ക് പദത്തിന് ‘അവിശ്വാസം’ എന്നും ‘വിശ്വാസത്തിന്റെ കുറവ്’ എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: ഉടനെ
  rationale: അപ്പന്റെ പ്രതികരണത്തിലെ തൽക്ഷണതയും മർക്കോസിന്റെ ആഖ്യാനത്തിലെ അടിയന്തരതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κράξας
  choice: നിലവിളിച്ചു
  rationale: ഉച്ചത്തിലുള്ളതും വികാരതീവ്രവുമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു; വെറും ‘വിളിച്ചു’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ ശക്തി പ്രകടമാക്കുന്നു.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: കുട്ടിയുടെ അപ്പൻ
  rationale: παιδίον എന്നതിന്റെ വിശാലമായ ‘കുട്ടി’ എന്ന അർഥം നിലനിർത്തുകയും ബന്ധത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἔλεγεν
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുമ്പോൾ ഗ്രീക്ക് അപൂർണ്ണകാലരൂപത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം; ആവർത്തനം അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
- source_word: Πιστεύω
  choice: ഞാൻ വിശ്വസിക്കുന്നു
  rationale: വിശ്വാസത്തെക്കുറിച്ചുള്ള ഉടൻപിന്നിലുള്ള വിരോധാഭാസവുമായി നേരിട്ടുള്ള പദബന്ധം നിലനിർത്തുന്നു.
- source_word: βοήθει
  choice: സഹായിക്കണമേ
  rationale: നേരിട്ടുള്ള സഹായാഭ്യർഥനയും വിനയപൂർവമായ അടിയന്തരതയും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μου τῇ ἀπιστίᾳ
  choice: എന്റെ അവിശ്വാസത്തിൽ എന്നെ
  rationale: ‘എന്റെ അവിശ്വാസത്തെ സഹായിക്കൂ’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കി, ദാതിവിന്റെ സഹായം ആവശ്യമുള്ള മേഖലയെന്ന ആശയം പ്രകടമാക്കുന്നു; ἀπιστίαയുടെ ‘അവിശ്വാസം/വിശ്വാസക്കുറവ്’ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Πιστεύωയും ἀπιστίᾳയും തമ്മിലുള്ള സംഘർഷം
  choice: “ഞാൻ വിശ്വസിക്കുന്നു; എന്റെ അവിശ്വാസത്തിൽ എന്നെ സഹായിക്കണമേ!” എന്ന വിരോധാഭാസം നിലനിർത്തി.
  alternative: “ഞാൻ വിശ്വസിക്കുന്നു; എന്റെ വിശ്വാസക്കുറവിൽ എന്നെ സഹായിക്കണമേ!”
  rationale: യഥാർഥ വിശ്വാസവും ശേഷിക്കുന്ന അവിശ്വാസവും ഒരേ അപേക്ഷയിൽ ഒത്തുനിൽക്കുന്ന വചനത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വികാരതീവ്രതയ്ക്കായി ‘നിലവിളിച്ചു’ എന്നും അപേക്ഷയുടെ ആദരപൂർവമായ സ്വരത്തിനായി ‘സഹായിക്കണമേ’ എന്നും ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
