  source_fidelity: 'The Malayalam accurately represents εὐθύς, κράξας, ὁ πατὴρ τοῦ παιδίου, and the direct plea. “എന്റെ അവിശ്വാസത്തിൽ എന്നെ സഹായിക്കണമേ” is a sound idiomatic rendering of βοήθει μου τῇ ἀπιστίᾳ: it retains the request for help without adding an interpretive notion such as overcoming unbelief.'
