id: MRK.9.43
reference: Mark 9:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: ml
  text: നിന്റെ കൈ നിനക്കു ഇടർച്ച വരുത്തുന്നുവെങ്കിൽ[a], അതു വെട്ടിക്കളയുക. രണ്ടു കൈകളുമുള്ളവനായി ഗെഹെന്നയിലേക്കു[b], അണയാത്ത തീയിലേക്കു പോകുന്നതിനെക്കാൾ, അംഗഭംഗം വന്നവനായി ജീവനിലേക്കു പ്രവേശിക്കുന്നതാണ് നിനക്കു നല്ലത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്നെ പാപം ചെയ്യാൻ ഇടയാക്കിയാൽ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ ഇടറിക്കുകയോ വീഴ്ത്തുകയോ പാപത്തിലേക്കു നയിക്കുകയോ ചെയ്യുക എന്നർഥമാകാം.'
    reason: lexical_alternative
  - marker: b
    text: ഗെഹെന്ന ദൈവിക ന്യായവിധിയുമായി ബന്ധപ്പെട്ട ഒരു സ്ഥലനാമത്തിന്റെ ഗ്രീക്ക് രൂപമാണ്; പരമ്പരാഗതമായി “നരകം” എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: ഇടറിച്ചാൽ
  rationale: ഇടറുക എന്ന രൂപകം നിലനിർത്തുകയും പാപത്തിലേക്കു നയിക്കുക എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπόκοψον
  choice: വെട്ടിക്കളയുക
  rationale: ആജ്ഞയുടെ ശക്തിയും മൂർത്തമായ ദേഹപ്രതിച്ഛായയും മയപ്പെടുത്താതെ പകർന്നു നൽകുന്നു.
- source_word: καλόν
  choice: നല്ലത്
  rationale: ἢ ചേർന്ന താരതമ്യഘടനയിൽ ‘നല്ലത്’ സ്വാഭാവികമായി ‘അതിനെക്കാൾ നല്ലത്’ എന്ന അർഥം നൽകുന്നു.
- source_word: κυλλόν
  choice: അംഗഭംഗം വന്നവനായി
  rationale: ഒരു അവയവം നഷ്ടപ്പെട്ട അവസ്ഥയെ സന്ദർഭോചിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: ജീവനിലേക്കു പ്രവേശിക്കുക
  rationale: അന്ത്യകാലസംബന്ധമായ ‘ജീവൻ’ എന്ന ആശയവും εἰς എന്ന ദിശാബോധവും നിലനിർത്തുന്നു.
- source_word: ἀπελθεῖν
  choice: പോകുക
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം; ഗെഹെന്നയിലേക്കുള്ള ദിശ ‘-ലേക്കു’ വ്യക്തമാക്കുന്നു.
- source_word: γέενναν
  choice: ഗെഹെന്ന
  rationale: പിന്നീടുള്ള വിശാലമായ ദൈവശാസ്ത്രപദത്തിൽ ലയിപ്പിക്കാതെ ഗ്രീക്കിലെ നിർദിഷ്ട സ്ഥലനാമം നിലനിർത്തുന്നു.
- source_word: ἄσβεστον
  choice: അണയാത്ത
  rationale: തീ അണയ്ക്കപ്പെടാത്തതോ അണയ്ക്കാനാവാത്തതോ എന്ന ഗ്രീക്ക് വിശേഷണത്തിന്റെ ശക്തി സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: രണ്ടു കൈകളുമുള്ളവനായി
  rationale: ഒരു കൈയില്ലാത്ത അവസ്ഥയുമായുള്ള മൂലപാഠത്തിലെ വ്യക്തമായ വൈരുധ്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: γέεννα എന്ന ന്യായവിധിപദത്തിന്റെ പരിഭാഷ
  choice: ഗെഹെന്ന
  alternative: നരകം
  rationale: യഹൂദ ന്യായവിധിചിത്രവുമായി ബന്ധപ്പെട്ട നിർദിഷ്ട ഗ്രീക്ക് സ്ഥലനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; പരിചിതമായ വ്യാഖ്യാനപരമായ സമാനപദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: കൈ വെട്ടിക്കളയുന്നതിനെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിന്റെ ശക്തി
  choice: മൂർത്തമായ ദേഹഭാഷ വ്യാഖ്യാനിച്ചു മയപ്പെടുത്താതെ നിലനിർത്തുക
  alternative: പാപം ഒഴിവാക്കുക എന്ന പൊതുവായ ആശയമായി പരാവർത്തനം ചെയ്യുക
  rationale: വചനത്തിലെ ഞെട്ടിക്കുന്ന പ്രതിച്ഛായ പാപത്തിന്റെയും ന്യായവിധിയുടെയും ഗൗരവം പ്രകടമാക്കുന്നു; പരിഭാഷ അത് വിശദീകരിച്ച് ഇല്ലാതാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ കടുത്ത ദേഹപ്രതിച്ഛായയും ‘ജീവൻ/ഗെഹെന്ന’ വൈരുധ്യവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
