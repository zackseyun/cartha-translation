id: MRK.9.35
reference: Mark 9:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: ml
  text: 'അവൻ ഇരുന്നശേഷം പന്ത്രണ്ടുപേരെയും വിളിച്ച് അവരോടു പറയുന്നു: “ഒരുവൻ ഒന്നാമനാകാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ, അവൻ എല്ലാവരിലും അവസാനത്തവനും എല്ലാവരുടെയും ശുശ്രൂഷകനും ആയിരിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: ഇരുന്നിട്ട്
  rationale: പഠിപ്പിക്കാനായി ഇരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാള ക്രിയാശൃംഖലയായി നൽകി.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം (‘says’) നിലനിർത്തി, വിവരണത്തിന്റെ തത്സമയഭാവം സംരക്ഷിക്കുന്നു.
- source_word: πρῶτος
  choice: ഒന്നാമൻ
  rationale: സ്ഥാനത്തിലും പ്രാധാന്യത്തിലും ‘ആദ്യൻ/ഒന്നാമൻ’ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἔσχατος
  choice: അവസാനത്തവൻ
  rationale: πρῶτος എന്നതിനോടുള്ള വാചകത്തിലെ നേരിട്ടുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: διάκονος
  choice: ശുശ്രൂഷകൻ
  rationale: മറ്റുള്ളവർക്കായി സേവിക്കുന്നവൻ എന്ന പൊതുവായ അർഥം നൽകുന്നു; ഇവിടെ സഭാപദവിയായ ‘ഡീക്കൻ’ എന്ന പ്രത്യേക അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: ἔσται
  choice: ആയിരിക്കണം
  rationale: ഭാവികാലരൂപത്തിന് ഈ സന്ദർഭത്തിലുള്ള നിബന്ധനാത്മക-ആജ്ഞാത്മക ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; വെറും ഭാവിപ്രവചനം എന്നാക്കി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ἔσται എന്ന ഭാവികാലത്തിന്റെ ശക്തി
  choice: ആയിരിക്കണം
  alternative: ആയിരിക്കും
  rationale: ശിഷ്യത്വത്തിലെ മഹത്വത്തിന്റെ വിപരീത മാനദണ്ഡം യേശു നിർദേശിക്കുന്ന സന്ദർഭത്തിൽ ഈ രൂപം ബാധ്യതയോ ആവശ്യകതയോ പ്രകടിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് രൂപം വ്യാകരണപരമായി ഭാവികാലമാണെന്നതിനാൽ ‘ആയിരിക്കും’ സാധ്യമായ മറ്റൊരു വായനയാണ്.
- issue: διάκονος എന്ന പദത്തിന്റെ പദവിസൂചന
  choice: ശുശ്രൂഷകൻ
  alternative: ഡീക്കൻ
  rationale: ‘എല്ലാവരുടെയും’ എന്ന ഘടന ഇവിടെ പൊതുസേവനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക സഭാപദവി ഇറക്കുമതി ചെയ്യാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനമായ λέγει ‘പറയുന്നു’ എന്നു നിലനിർത്തി. ‘പന്ത്രണ്ടുപേർ’ എന്നത് പ്രസിദ്ധമായ ശിഷ്യസംഘത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
