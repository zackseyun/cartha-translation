  terminology: “ശുശ്രൂഷകൻ” appropriately renders διάκονος here as one who serves, without importing the later ecclesial office sense of “ഡീക്കൻ.” “പന്ത്രണ്ടുപേർ” naturally identifies the Twelve in context.
