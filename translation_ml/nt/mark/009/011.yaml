id: MRK.9.11
reference: Mark 9:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: ml
  text: 'അവർ അവനോടു ചോദിച്ചുകൊണ്ടിരുന്നു: “ഏലിയാവ് ആദ്യം വരേണ്ടതാണെന്ന് ശാസ്ത്രിമാർ പറയുന്നത് എന്തുകൊണ്ടാണ്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഏലിയാവ് ആദ്യം വരേണ്ടതാണെന്ന് ശാസ്ത്രിമാർ ഇങ്ങനെ പറയുന്നത് എങ്ങനെയാണ്?”
    reason: Ὅτι ഈ ചോദ്യം തുടങ്ങുമ്പോൾ ‘എന്തുകൊണ്ട്’ എന്നോ ‘എങ്ങനെയാണ് അങ്ങനെ’ എന്നോ ഗ്രഹിക്കാവുന്ന സാധ്യത സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടരുന്ന അഥവാ ആവർത്തിച്ചുള്ള ചോദ്യം സൂചിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: λέγοντες
  choice: ചോദ്യത്തിന്റെ ഉള്ളടക്കം ഉദ്ധരണിയായി അവതരിപ്പിച്ചു
  rationale: മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്നു യാന്ത്രികമായി ചേർക്കുന്നതിനേക്കാൾ ദ്വിബിന്ദുവിലൂടെ ചോദ്യത്തിന്റെ ഉള്ളടക്കം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ὅτι
  choice: എന്തുകൊണ്ടാണ്
  rationale: ഇവിടെ ὅτι ചോദ്യം ആരംഭിക്കുന്ന പ്രയോഗമായി ‘എന്തുകൊണ്ട്/എങ്ങനെയാണ്’ എന്ന അർഥം നൽകുന്നു; മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘എന്തുകൊണ്ടാണ്’ സ്വീകരിച്ചു, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: യഹൂദ തിരുവെഴുത്തുകളിലും ന്യായപ്രമാണത്തിലും പ്രാവീണ്യമുള്ള ചരിത്രപരമായ വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പദമാണ്.
- source_word: Ἠλίαν
  choice: ഏലിയാവ്
  rationale: പ്രവാചകന്റെ പേരിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം ഉപയോഗിച്ചു.
- source_word: δεῖ
  choice: വരേണ്ടതാണ്
  rationale: ദൈവികമോ തിരുവെഴുത്തുസംബന്ധമോ ആയ അനിവാര്യതയെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ δεῖയുടെ നിർബന്ധാർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἐλθεῖν
  choice: വരുക
  rationale: പ്രവചനസന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗം.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: കാലക്രമത്തിലെ മുൻഗണന നേരിട്ട് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Ὅτι ആരംഭിക്കുന്ന ശിഷ്യന്മാരുടെ ചോദ്യത്തിന്റെ ഭാവം
  choice: ‘എന്തുകൊണ്ടാണ്’ എന്ന നേരിട്ടുള്ള ചോദ്യം
  alternative: ‘ഏലിയാവ് ആദ്യം വരേണ്ടതാണെന്ന് ശാസ്ത്രിമാർ പറയുന്നത് എങ്ങനെയാണ്?’
  rationale: ഗ്രീക്കിലെ ചോദ്യം കാരണം അന്വേഷിക്കുന്നതായോ ‘എങ്ങനെയാണ് അങ്ങനെ?’ എന്ന വിസ്മയചോദ്യമായോ ഗ്രഹിക്കാം. മുഖ്യപാഠം സ്വാഭാവിക മലയാളത്തിൽ കാരണം അന്വേഷിക്കുന്ന ഭാവം നൽകുന്നു; യഥാർഥമായ മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ഏലിയാവിന്റെ വരവിന്റെ സ്വഭാവം
  choice: ‘ഏലിയാവ് ആദ്യം വരേണ്ടതാണ്’ എന്ന പരിധിയിൽ നിലനിർത്തി
  alternative: ‘ഏലിയാവ് വീണ്ടും വരണം’ അഥവാ ‘മശീഹയ്ക്കുമുമ്പ് ഏലിയാവ് വരണം’
  rationale: ‘വീണ്ടും’ എന്നും ‘മശീഹയ്ക്കുമുമ്പ്’ എന്നും ഈ വാക്യത്തിൽ തുറന്നുപറയുന്നില്ല; അതിനാൽ അത്തരം വ്യാഖ്യാനവികാസം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശാസ്ത്രിമാർ’ എന്ന ചരിത്രപരമായി പരിചിതമായ പദം നിലനിർത്തി. ഗ്രീക്കിലെ λέγοντες പ്രത്യേകം ‘പറഞ്ഞുകൊണ്ട്’ എന്നു പകർത്താതെ, മലയാളത്തിലെ നേരിട്ടുള്ള ഉദ്ധരണിഘടന ഉപയോഗിച്ചു.
