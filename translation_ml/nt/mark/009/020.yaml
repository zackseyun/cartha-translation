id: MRK.9.20
reference: Mark 9:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: ml
  text: അവർ അവനെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു. ആത്മാവ് യേശുവിനെ കണ്ടപ്പോൾ, അത് ഉടനെ ബാലനെ കഠിനമായി പിടച്ചുകുലുക്കി; അവൻ നിലത്തുവീണ് നുരച്ചുകൊണ്ട് ഉരുണ്ടുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκαν αὐτὸν πρὸς αὐτόν
  choice: അവർ അവനെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: φέρω എന്ന ക്രിയ ഇവിടെ ബാലനെ യേശുവിന്റെ അടുത്തേക്കു കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള സർവനാമങ്ങൾ മലയാളത്തിൽ ആശയക്കുഴപ്പം ഉണ്ടാക്കുന്നതിനാൽ രണ്ടാമത്തെ αὐτόν-ന്റെ സൂചിത വ്യക്തിയായ യേശുവിന്റെ പേര് വ്യക്തമാക്കി.
- source_word: ἰδὼν αὐτόν
  choice: യേശുവിനെ കണ്ട ഉടനെ
  rationale: കാണുന്നത് ആത്മാവും കാണപ്പെടുന്നത് യേശുവുമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു; εὐθύς-ന്റെ തൽക്ഷണതയും ഈ ഘടന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: ഈ വാക്യത്തിൽ ഗ്രീക്ക് പാഠം ‘ആത്മാവ്’ എന്നു മാത്രമാണ് പറയുന്നത്; സന്ദർഭത്തിൽ അശുദ്ധാത്മാവാണെങ്കിലും ആ വിശേഷണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: συνεσπάραξεν αὐτόν
  choice: ബാലനെ കഠിനമായി കോച്ചിവലിച്ചു
  rationale: ക്രിയ ശക്തമായ ശരീരകോച്ചലിനെയോ ഞരക്കത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കോച്ചിവലിച്ചു’ സാധാരണ വായനക്കാർക്ക് ദൃശ്യവും സ്വാഭാവികവുമാണ്; കർത്താവും കർമവും വ്യക്തമാക്കാൻ ‘ബാലനെ’ ഉപയോഗിച്ചു.
- source_word: πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο
  choice: അവൻ നിലത്തുവീണ് ... ഉരുണ്ടു
  rationale: പങ്കുപദഘടനയെ സ്വാഭാവിക മലയാളത്തിലെ തുടർച്ചയായ പ്രവൃത്തികളായി അവതരിപ്പിക്കുന്നു; നിലത്തു വീണത് ആത്മാവല്ല, ബാലനാണെന്നും വ്യക്തമാക്കുന്നു.
- source_word: ἀφρίζων
  choice: നുരച്ചുകൊണ്ട്
  rationale: ഗ്രീക്കിൽ വായ് എന്നു വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ‘വായിൽനിന്ന്’ ചേർക്കാതെ സമകാലികമായ അവസ്ഥയെ സംക്ഷിപ്തമായി നിലനിർത്തി.
theological_decisions:
- issue: πνεῦμα എന്നതിന്റെ തിരിച്ചറിയൽ
  choice: മുഖ്യപാഠത്തിൽ ‘ആത്മാവ്’
  alternative: ‘അശുദ്ധാത്മാവ്’ അല്ലെങ്കിൽ ‘ഭൂതം’
  rationale: വിശാലസന്ദർഭം അതിനെ അശുദ്ധാത്മാവായി തിരിച്ചറിയുന്നുവെങ്കിലും ഈ വാക്യം τὸ πνεῦμα എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സർവനാമങ്ങളുടെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘യേശു’, ‘ബാലൻ’ എന്നീ സൂചിത നാമങ്ങൾ പരിമിതമായി വ്യക്തമാക്കി; മൂലത്തിൽ ഇല്ലാത്ത ‘അശുദ്ധ’ എന്നും ‘വായിൽനിന്ന്’ എന്നും ചേർത്തിട്ടില്ല.
