id: MRK.9.45
reference: Mark 9:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: ml
  text: നിന്റെ കാൽ നിനക്കു ഇടർച്ച വരുത്തുന്നുവെങ്കിൽ[a], അതു വെട്ടിക്കളയുക. രണ്ടു കാലുമുള്ളവനായി ഗെഹെന്നയിൽ[b] എറിയപ്പെടുന്നതിനെക്കാൾ മുടന്തനായി ജീവനിലേക്കു പ്രവേശിക്കുന്നതാണ് നിനക്കു നല്ലത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്നെ പാപത്തിലേക്കു നയിക്കുന്നുവെങ്കിൽ.” ‘ഇടർച്ച വരുത്തുക’ എന്നത് പാപത്തിലോ വീഴ്ചയിലോ അകപ്പെടുന്നതിനുള്ള രൂപകമാണ്.'
    reason: σκανδαλίζῃ എന്നതിന്റെ വ്യാഖ്യാനപരമായ ബദൽ പരിഭാഷ വ്യക്തമാക്കുന്നു.
  - marker: b
    text: 'അഥവാ: “നരകം.” ‘ഗെഹെന്ന’ എന്ന ഗ്രീക്ക് പദം ഹിന്നോം താഴ്വരയെയും ദൈവിക ന്യായവിധിയോടുള്ള അതിന്റെ ബന്ധങ്ങളെയും ഓർമിപ്പിക്കുന്നു.'
    reason: γέεννα എന്ന പദത്തിന്റെ പരിചിതമായ ബദൽ പരിഭാഷയും ചരിത്ര-ന്യായവിധി പശ്ചാത്തലവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: ഇടറിച്ചാൽ
  rationale: പാപത്തിലേക്കോ വീഴ്ചയിലേക്കോ നയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ഇടർച്ചയുടെ രൂപകം നിലനിർത്തുന്നു; ‘പാപം ചെയ്യിച്ചാൽ’ എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: ἀπόκοψον
  choice: വെട്ടിക്കളയുക
  rationale: ശക്തവും ദൃശ്യവുമായ ആജ്ഞയെ മയപ്പെടുത്താതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: καλόν ἐστίν
  choice: നല്ലത്
  rationale: ἢ കൊണ്ടുള്ള താരതമ്യഘടനയിൽ ‘നല്ലത്’ മലയാളത്തിൽ ‘അതിനെക്കാൾ നല്ലത്’ എന്ന താരതമ്യാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: ജീവനിലേക്കു പ്രവേശിക്കുക
  rationale: അന്ത്യകാലജീവനെ സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘നിത്യ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: χωλὸν
  choice: മുടന്തനായി
  rationale: കാലുമായി ബന്ധപ്പെട്ട നടക്കാനുള്ള വൈകല്യമാണ് χωλός ഇവിടെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
- source_word: βληθῆναι
  choice: എറിയപ്പെടുക
  rationale: βάλλωയുടെ കർമണിപ്രയോഗത്തെ നേരിട്ടും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും പകരുന്നു.
- source_word: γέενναν
  choice: ഗെഹെന്ന
  rationale: ഹിന്നോം താഴ്വരയോടും ദൈവിക ന്യായവിധിയോടും ബന്ധപ്പെട്ട പ്രത്യേക ഗ്രീക്ക് പദത്തിന്റെ ചരിത്രപരവും ആശയപരവുമായ സവിശേഷത സംരക്ഷിക്കുന്നു.
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: രണ്ടു കാലുമുള്ളവനായി
  rationale: മുടന്തനായി ജീവനിലേക്കു പ്രവേശിക്കുന്നതുമായുള്ള വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ γέεννα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഗെഹെന്ന
  alternative: നരകം
  rationale: മൂലപാഠത്തിലുള്ളത് പരലോകത്തിനുള്ള ഒരു പൊതുപദമല്ല, γέεννα എന്ന പ്രത്യേക പദമാണ്. അതിനാൽ മുഖ്യപാഠത്തിൽ ‘ഗെഹെന്ന’ നിലനിർത്തുകയും പരിചിതമായ വ്യാഖ്യാനപരമായ തുല്യപദം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വെട്ടിക്കളയുക’, ‘എറിയപ്പെടുക’ എന്നീ ശക്തമായ ദൃശ്യപ്രയോഗങ്ങൾ മയപ്പെടുത്തിയിട്ടില്ല. ‘ജീവൻ’ എന്നതിൽ മൂലപാഠത്തിന്റെ അന്ത്യകാലസൂചന നിലനിർത്തുന്നു; എന്നാൽ ‘നിത്യജീവൻ’ എന്ന് വിപുലീകരിക്കുന്നില്ല.
