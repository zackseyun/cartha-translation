  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: ml
  text: 'യേശു ഒരു ജനക്കൂട്ടം വേഗത്തിൽ കൂടിവരുന്നതു കണ്ടപ്പോൾ[a], ആ അശുദ്ധാത്മാവിനെ ശാസിച്ചു; അതിനോടു പറഞ്ഞു: “ഊമനും ബധിരനുമായ ആത്മാവേ, ഞാൻ നിന്നോടു കൽപ്പിക്കുന്നു: അവനിൽനിന്ന് പുറത്തുവരിക; ഇനി ഒരിക്കലും അവനിൽ പ്രവേശിക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ജനക്കൂട്ടം ഓടിക്കൂടുന്നതു.’ ആളുകൾ വേഗത്തിൽ ഒരുമിച്ചെത്തുന്നതാണ് ഗ്രീക്ക് ക്രിയ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: യേശു ... കണ്ടപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തരൂപം മുഖ്യക്രിയയുടെ സാഹചര്യം കാലസൂചനയോടെ അവതരിപ്പിക്കുന്നു. δέ മൃദുവായ ആഖ്യാനബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക വൈരുധ്യപദം ചേർക്കാതെ സ്വാഭാവികമായ കാലവാക്യമായി നൽകി.
- source_word: ἐπισυντρέχει ὄχλος
  choice: ഒരു ജനക്കൂട്ടം വേഗത്തിൽ കൂടിവരുന്നതു
  rationale: ക്രിയ ആളുകൾ പല ഭാഗത്തുനിന്നും വേഗത്തിൽ ഒരുമിച്ചെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇംപെർഫെക്റ്റ് രൂപത്തിലെ പുരോഗമനഭാവം ‘കൂടിവരുന്നതു’ എന്നതിലൂടെ നിലനിർത്തി.
- source_word: ἐπετίμησεν
  choice: ശാസിച്ചു
  rationale: സുവിശേഷങ്ങളിൽ യേശു ദുരാത്മാക്കളോട് അധികാരപൂർവം സംസാരിക്കുന്നതിന് പതിവായി ഉപയോഗിക്കുന്ന ക്രിയയുടെ ശക്തി ‘ശാസിച്ചു’ സ്വാഭാവികമായി പകരുന്നു.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: ആ അശുദ്ധാത്മാവിനെ
  rationale: ‘അശുദ്ധാത്മാവ്’ സുവിശേഷത്തിലെ അശുദ്ധി സംബന്ധമായ ആശയവും വ്യക്തിയായി അഭിസംബോധന ചെയ്യപ്പെടുന്ന ആത്മാവിനെയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: ഊമനും ബധിരനുമായ ആത്മാവേ
  rationale: ἄλαλος സംസാരിക്കാൻ കഴിയാത്തതിനെയും κωφός ഇവിടെ കേൾക്കാൻ കഴിയാത്തതിനെയും സൂചിപ്പിക്കുന്നു; രണ്ടു വിശേഷണങ്ങളുടെയും വ്യത്യാസം സംരക്ഷിച്ചു.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: ഞാൻ നിന്നോടു കല്പിക്കുന്നു
  rationale: ἐπιτάσσω അധികാരപൂർവമായ കല്പനയാണ്; വ്യക്തമാക്കിയ ἐγώയുടെ ഊന്നൽ ‘ഞാൻ’ നിലനിർത്തുന്നു.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: അവനിൽനിന്ന് പുറത്തുവരിക
  rationale: പുറത്തേക്കു വരാനുള്ള നേരിട്ടുള്ള കല്പനയെ ഔപചാരികവും വ്യക്തവുമായ മലയാളത്തിൽ പകർന്നു.
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: ഇനി ഒരിക്കലും അവനിൽ പ്രവേശിക്കരുത്
  rationale: μηκέτιയും നിരോധനാത്മക സബ്ജങ്റ്റീവും ഭാവിയിലെ പുനഃപ്രവേശനത്തെ നിർണായകമായി വിലക്കുന്നു; ‘ഇനി ഒരിക്കലും’ അതിന്റെ ശക്തി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അശുദ്ധാത്മാവിനെയും യേശുവിന്റെ അധികാരത്തെയും ചിത്രീകരിക്കൽ
  choice: ‘അശുദ്ധാത്മാവ്’, ‘ശാസിച്ചു’, ‘ഞാൻ നിന്നോടു കല്പിക്കുന്നു’ എന്നീ നേരിട്ടുള്ള ശക്തമായ പ്രയോഗങ്ങൾ
  alternative: ‘ദുഷ്ടാത്മാവ്’; ‘ആത്മാവിനോട് കഠിനമായി സംസാരിച്ചു’
  rationale: മൂലപാഠം ആത്മാവിനെ വ്യക്തിപരമായ സത്തയായി നേരിട്ട് അഭിസംബോധന ചെയ്യുകയും യേശുവിന്റെ അധികാരത്തിനു വിധേയമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു. രോഗാവസ്ഥയെന്നു മാത്രം മയപ്പെടുത്താതെയും പാഠത്തിനപ്പുറം വിശദീകരണം ചേർക്കാതെയും ഈ അവതരണം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘ആത്മാവേ’ എന്നും അധികാരപൂർവമായ കല്പനയിൽ ‘കല്പിക്കുന്നു’ എന്നും ഉപയോഗിച്ചു.
