  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ml
  text: 'പത്രോസ് മറുപടിയായി യേശുവിനോടു പറഞ്ഞു: “റബ്ബീ, നാം ഇവിടെ ഇരിക്കുന്നത് നല്ലതാണ്. നമുക്ക് മൂന്നു കൂടാരങ്ങൾ[a] ഉണ്ടാക്കാം—അങ്ങേക്ക് ഒന്ന്, മോശയ്ക്ക് ഒന്ന്, ഏലിയാവിന് ഒന്ന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പന്തലുകൾ” അല്ലെങ്കിൽ “താൽക്കാലിക പാർപ്പിടങ്ങൾ.” ഗ്രീക്കിലെ σκηνάς എന്ന പദം താൽക്കാലികമായി ഒരുക്കുന്ന കൂടാരങ്ങളെയോ മൂടിയ പാർപ്പിടങ്ങളെയോ സൂചിപ്പിക്കുന്നു. കൂടാരപ്പെരുന്നാളുമായോ തിരുനിവാസവുമായോ ബന്ധപ്പെട്ട ധ്വനികൾ അതിനുണ്ടാകാമെങ്കിലും, ഈ വാക്യം അവയെ വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: പ്രതികരിച്ച്
  rationale: പ്രത്യക്ഷമായൊരു ചോദ്യം മുമ്പില്ലെങ്കിലും, ആഖ്യാനഗ്രീക്കിലെ പതിവായ ഈ പ്രയോഗത്തിന്റെ പ്രതികരണഭാവം നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, ആധുനിക മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: Ῥαββί
  choice: റബ്ബീ
  rationale: ബഹുമാനപൂർവമായ സെമിറ്റിക് സംബോധന അതേപടി നിലനിർത്തുന്നു; ‘ഗുരോ’ എന്ന അർഥവിവർത്തനത്തെക്കാൾ മൂലരൂപത്തോട് സുതാര്യമാണ്.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: നാം ഇവിടെ ആയിരിക്കുന്നത് നല്ലതാണ്
  rationale: പത്രോസിന്റെ വിലയിരുത്തലും ഗ്രീക്കിലെ നിർവ്യക്ത ഘടനയും ലളിതമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ποιήσωμεν
  choice: നമുക്ക് ... ഉണ്ടാക്കാം
  rationale: ഒന്നാം പുരുഷ ബഹുവചന പ്രേരണാർഥക സബ്ജങ്ക്റ്റീവിന്റെ നിർദേശഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σκηνάς
  choice: കൂടാരങ്ങൾ
  rationale: താൽക്കാലികമായി ഒരുക്കുന്ന മൂടിയ പാർപ്പിടങ്ങളുടെ അടിസ്ഥാനാർഥം വ്യക്തമായി നൽകുന്നു; ഉത്സവപരമോ വിശുദ്ധമന്ദിരപരമോ ആയ സൂചന നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: അങ്ങേക്കു ഒന്ന്, മോശയ്ക്കു ഒന്ന്, ഏലിയാവിനു ഒന്ന്
  rationale: μίαν എന്ന പദത്തിന്റെ ആവർത്തനവും മൂലത്തിലെ സമാന്തരഘടനയും നിലനിർത്തുന്നു; യേശുവിനോടുള്ള നേരിട്ടുള്ള ആദരസംബോധനയ്ക്ക് ‘അങ്ങേക്ക്’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: σκηνάς എന്ന പദത്തിനുണ്ടാകാവുന്ന ഉത്സവപരമോ ആരാധനാസംബന്ധമോ ആയ ധ്വനി
  choice: പ്രധാനപാഠത്തിൽ ‘കൂടാരങ്ങൾ’
  alternative: ‘പന്തലുകൾ’, ‘താൽക്കാലിക പാർപ്പിടങ്ങൾ’, അല്ലെങ്കിൽ ആരാധനാസംബന്ധമായ അർഥം കൂടുതൽ സൂചിപ്പിക്കുന്ന ‘തിരുനിവാസങ്ങൾ’
  rationale: ഈ വാക്യം തന്നിൽ കൂടാരപ്പെരുന്നാളിനെയോ തിരുനിവാസദൈവശാസ്ത്രത്തെയോ വ്യക്തമായി പരാമർശിക്കുന്നില്ല. അതിനാൽ അടിസ്ഥാനാർഥം പ്രധാനപാഠത്തിൽ നൽകുകയും സാധ്യതയുള്ള മറ്റു ധ്വനികൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘റബ്ബീ’ മൂലപാഠത്തിന്റെ സെമിറ്റിക് പശ്ചാത്തലം നിലനിർത്തുന്നു; ‘അങ്ങേക്ക്’ നേരിട്ടുള്ള ആദരസംബോധനം വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘കൂടാരങ്ങൾ’ എന്ന പദത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
