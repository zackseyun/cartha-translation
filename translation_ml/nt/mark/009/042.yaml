id: MRK.9.42
reference: Mark 9:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: ml
  text: എന്നിൽ വിശ്വസിക്കുന്ന ഈ ചെറിയവരിൽ ഒരാളെ ആരെങ്കിലും ഇടറിച്ചാൽ, അവന്റെ കഴുത്തിൽ കഴുതകൊണ്ട് തിരിക്കുന്ന വലിയ തിരികല്ല് കെട്ടപ്പെട്ട് അവൻ കടലിൽ എറിയപ്പെട്ടിരിക്കുന്നതായിരുന്നു അവന് കൂടുതൽ നല്ലത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: ഇടറിച്ചാൽ
  rationale: പാപത്തിലേക്കോ വിശ്വാസവീഴ്ചയിലേക്കോ നയിക്കുക എന്ന ശക്തമായ അർഥം ഉൾക്കൊള്ളുമ്പോഴും ഗ്രീക്കിലെ ഇടർച്ചയുടെ രൂപകം നിലനിർത്തുന്നു.
- source_word: μικρῶν τούτων
  choice: ഈ ചെറിയവരിൽ
  rationale: കുട്ടികൾക്ക് മാത്രമായി പരിമിതപ്പെടുത്താതെ, ചെറുതോ ദുർബലരോ ആയി കണക്കാക്കപ്പെടുന്ന വിശ്വാസികളെയും ഉൾക്കൊള്ളുന്ന പ്രയോഗം.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: എന്നിൽ വിശ്വസിക്കുന്ന
  rationale: യേശുവിനെ വ്യക്തിപരമായ വിശ്വാസത്തിന്റെ ലക്ഷ്യമായി വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: അവനു കൂടുതൽ നല്ലത്
  rationale: μᾶλλον എന്ന താരതമ്യബലം തുറന്നുവെക്കുകയും മുന്നറിയിപ്പിന്റെ കടുപ്പം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μύλος ὀνικός
  choice: കഴുത തിരിക്കുന്ന ഒരു വലിയ തിരികല്ല്
  rationale: കൈകൊണ്ട് തിരിക്കുന്ന ചെറിയ കല്ലല്ല, കഴുതയാൽ തിരിക്കപ്പെട്ട വലിയ തിരികല്ലാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: അവന്റെ കഴുത്തിൽ ... കെട്ടി
  rationale: കഴുത്തിനു ചുറ്റും തിരികല്ല് സ്ഥാപിക്കുന്ന ദൃശ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: അവനെ കടലിൽ എറിഞ്ഞുകളയുന്നത്
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയപ്രയോഗവും അതിന്റെ ഭീകരമായ അന്തിമഫലവും വ്യക്തമായി കൈമാറുന്നു.
theological_decisions:
- issue: ‘ഈ ചെറിയവർ’ എന്നതിന്റെ സൂചിതവിഭാഗം
  choice: കുട്ടികൾക്ക് മാത്രമായി ചുരുക്കാതെ, യേശുവിൽ വിശ്വസിക്കുന്ന ചെറുതായി കണക്കാക്കപ്പെടുന്നവരെയോ ദുർബലരെയോ ഉൾക്കൊള്ളുന്ന വിശാലപ്രയോഗം
  alternative: കുട്ടികൾ മാത്രം; അല്ലെങ്കിൽ വിനീതരായ ശിഷ്യന്മാർ പൊതുവേ
  rationale: ‘എന്നിൽ വിശ്വസിക്കുന്ന’ എന്ന വിശേഷണം പ്രായവിഭാഗത്തിനപ്പുറം സൂചിപ്പിക്കുന്നു; അതേസമയം കുട്ടികളെ ഒഴിവാക്കുന്നില്ല. അതിനാൽ അവ്യക്തത പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ഇടറിക്കുക’ എന്ന ബൈബിൾപരിചിതമായ രൂപകം നിലനിർത്തിയിട്ടുണ്ട്; ‘കഴുത തിരിക്കുന്ന ഒരു വലിയ തിരികല്ല്’ എന്നത് അപരിചിതമായ പുരാതന വസ്തുവിനെ കുറിപ്പില്ലാതെ തന്നെ വ്യക്തമാക്കുന്നു.
