  source_fidelity: 'The Malayalam accurately represents the imperfect ἔλεγον through ‘ചോദിച്ചുകൊണ്ടിരുന്നു,’ appropriately rendering the speech as repeated/continuing questioning in its interrogative context. Both questions retain the source’s scope: the basis of authority, and the person who gave that authority for these actions. ‘ഇതൊക്കെ’ naturally conveys the plural ταῦτα without narrowing its reference.'
  naturalness: The wording is fluent modern standard Malayalam and maintains a suitably respectful biblical narrative register. ‘എന്ത് അധികാരത്താലാണ്’ and ‘നിനക്കു തന്നത് ആരാണ്?’ are idiomatic direct-question forms. ‘ഇങ്ങനെ’ is a natural discourse linker introducing the quoted questions and does not materially add interpretive content.
  terminology: ‘അധികാരം’ is the appropriate consistent rendering of ἐξουσία here, preserving the sense of authorization/jurisdiction rather than merely physical power. The translation remains neutral concerning the source of Jesus’ authority, as does the Greek text. Footnote markers are correctly anchored to the relevant expressions, and their alternatives are accurate.
