id: MRK.11.28
reference: Mark 11:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: ml
  text: 'അവർ അവനോട് ഇങ്ങനെ ചോദിച്ചുകൊണ്ടിരുന്നു[a]: “എന്ത് അധികാരത്താലാണ്[b] നീ ഇതൊക്കെ ചെയ്യുന്നത്? അല്ലെങ്കിൽ ഇതൊക്കെ ചെയ്യാനുള്ള ഈ അധികാരം നിനക്കു തന്നത് ആരാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “പറഞ്ഞുകൊണ്ടിരുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഏത് അധികാരത്തിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ഉദ്ധരിച്ച വാക്കുകൾ ചോദ്യങ്ങളായതിനാൽ മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നതിനെക്കാൾ ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ സ്വാഭാവികമാണ്; ‘ഇങ്ങനെ’ ഉദ്ധരണിയെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: എന്ത് അധികാരത്താലാണ്
  rationale: ἐν + ദത്തിവ് ഇവിടെ പ്രവർത്തനത്തിന്റെ അധികാരപരമായ അടിസ്ഥാനം ചോദിക്കുന്നു. ‘എന്ത് അധികാരത്താൽ’ എന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ ആ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: അധികാരം
  rationale: ക്ഷേത്രസന്ദർഭത്തിൽ ചോദ്യം ചെയ്യപ്പെടുന്നത് യേശുവിന്റെ നിയമാനുസൃതമായ അവകാശവും അധികാരവുമാണ്; ‘അധികാരം’ ശക്തി എന്നതിലുപരി ഈ അനുമതി/അവകാശഭാവവും ഉൾക്കൊള്ളുന്നു.
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: ഇതൊക്കെ ചെയ്യുന്നത് / ഇതൊക്കെ ചെയ്യാനുള്ള
  rationale: ബഹുവചനമായ ταῦτα യേശുവിന്റെ സമീപകാല പ്രവർത്തനങ്ങളെയും ഉപദേശത്തെയും വിശാലമായി സൂചിപ്പിക്കുന്നു. ‘ഇതൊക്കെ’ ആ കൂട്ടായ സൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: രണ്ടാമത്തെ ചോദ്യം ആദ്യത്തേതിന്റെ അടുത്ത ബന്ധമുള്ള മറ്റൊരു രൂപമായി അവതരിപ്പിക്കുന്നു.
- source_word: τίς σοι ἔδωκεν
  choice: നിനക്കു തന്നത് ആരാണ്
  rationale: ἔδωκεν എന്ന ഏറിസ്റ്റ് രൂപം നേരിട്ടുള്ള ചോദ്യത്തിൽ ലളിതമായ ഭൂതകാലമായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
- source_word: ἵνα ταῦτα ποιῇς
  choice: ഇതൊക്കെ ചെയ്യാനുള്ള
  rationale: ἵνα + ഉപവാക്യക്രിയ ഉദ്ദേശ്യമോ അനുവദിക്കപ്പെട്ട ലക്ഷ്യമോ സൂചിപ്പിക്കുന്നു. ‘അധികാരം’ എന്ന നാമത്തോടൊപ്പം ‘ചെയ്യാനുള്ള’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി അതേ ബന്ധം നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ അധികാരത്തിന്റെ ഉറവിടം
  choice: നേതാക്കളുടെ ചോദ്യം നിഷ്പക്ഷമായ വെല്ലുവിളിയായി നിലനിർത്തി; അധികാരത്തിന്റെ ഉറവിടം വാക്യത്തിൽ നിർണ്ണയിച്ചിട്ടില്ല.
  alternative: സന്ദർഭത്തെ ആശ്രയിച്ച് ‘ദൈവിക അധികാരം’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം എതിരാളികളുടെ ചോദ്യം മാത്രമാണ് രേഖപ്പെടുത്തുന്നത്; ആ അധികാരം ആരിൽനിന്നാണെന്ന് വിവർത്തനം തന്നെ മുൻകൂട്ടി തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നീ’ എന്ന ഏകവചന അഭിസംബോധന മൂലപാഠത്തിലെ രണ്ടാംപുരുഷ ഏകവചനം നിലനിർത്തുന്നു. തുടരുന്ന ചോദ്യം ചെയ്യലിന്റെ ഭാവം ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ വഴി സൂക്ഷിച്ചിരിക്കുന്നു.
