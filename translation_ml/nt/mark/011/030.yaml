  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων; ἀποκρίθητέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: ml
  text: യോഹന്നാന്റെ സ്നാനം സ്വർഗത്തിൽനിന്നായിരുന്നോ[a], അതോ മനുഷ്യരിൽനിന്നായിരുന്നോ[b]? എന്നോട് ഉത്തരം പറയുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിൽനിന്നായിരുന്നോ?’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘സ്വർഗത്തിൽനിന്ന്’ എന്നാണ്; ദൈവിക ഉത്ഭവമോ അധികാരമോ സൂചിപ്പിക്കുന്ന യെഹൂദ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘മനുഷ്യരിൽനിന്ന്’ എന്നത് മനുഷ്യരിൽനിന്നുള്ള, അതായത് കേവലം മാനുഷികമായ, ഉത്ഭവമോ അധികാരമോ എന്നാണ് അർഥമാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: യോഹന്നാന്റെ സ്നാനം
  rationale: Ἰωάννου എന്ന ബന്ധികരൂപം യോഹന്നാനുമായി ബന്ധപ്പെട്ട സ്നാനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ ഉടമസ്ഥപ്രയോഗം മൂലരൂപത്തിന്റെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐξ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്നുള്ളത്
  rationale: ദൈവിക ഉത്ഭവമോ അധികാരമോ സൂചിപ്പിക്കുന്ന യെഹൂദ ആദരസൂചക പ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ, ഗ്രീക്കിലെ ‘സ്വർഗത്തിൽനിന്ന്’ എന്ന രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξ ἀνθρώπων
  choice: മനുഷ്യരിൽനിന്നുള്ളത്
  rationale: ἀνθρώπων ഇവിടെ ലിംഗഭേദമില്ലാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘മനുഷ്യരിൽനിന്ന്’ എന്നത് സ്വർഗീയ ഉത്ഭവത്തിനോടുള്ള വൈരുധ്യവും മാനുഷിക ഉത്ഭവമോ അധികാരമോ എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: ἀποκρίθητέ μοι
  choice: എന്നോട് ഉത്തരം പറയുക
  rationale: അവരിൽനിന്ന് നേരിട്ടുള്ള മറുപടി ആവശ്യപ്പെടുന്ന ആജ്ഞയുടെ ശക്തി വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἦν ἢ
  choice: ആയിരുന്നോ ... അതോ ... ആയിരുന്നോ?
  rationale: ഉത്ഭവത്തെക്കുറിച്ചുള്ള രണ്ട് സാധ്യതകൾ തമ്മിലുള്ള ഗ്രീക്ക് ചോദ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘സ്വർഗത്തിൽനിന്ന്’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘സ്വർഗത്തിൽനിന്നുള്ളത്’ എന്ന മൂലപ്രയോഗം നിലനിർത്തുക
  alternative: ‘ദൈവത്തിൽനിന്നുള്ളത്’ എന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: ഈ യെഹൂദ ആദരസൂചക പ്രയോഗം ദൈവിക ഉത്ഭവമോ അധികാരമോ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ‘സ്വർഗം’ എന്ന വാക്ക് നിലനിർത്തുന്നത് യേശുവിന്റെ ചോദ്യത്തിന്റെ ഭാഷയും ദൈവശാസ്ത്രപരമായ സൂചനയും വ്യാഖ്യാനത്തിലൂടെ ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്വർഗത്തിൽനിന്ന്/മനുഷ്യരിൽനിന്ന്’ എന്ന സമാന്തരത നിലനിർത്തി മൂലപാഠത്തിലെ ശക്തമായ വൈരുധ്യം സംരക്ഷിച്ചിരിക്കുന്നു.
