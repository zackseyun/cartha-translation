  text: Εὐλογημένη ἡ ἐρχομένη ⸀βασιλεία τοῦ πατρὸς ἡμῶν Δαυίδ· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: ml
  text: “നമ്മുടെ പിതാവായ ദാവീദിന്റെ വരാനിരിക്കുന്ന രാജ്യം അനുഗൃഹീതം! അത്യുന്നതങ്ങളിൽ ഹോശന്നാ!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഹോശന്നാ’ എന്നത് അടിസ്ഥാനപരമായി ‘രക്ഷിക്കണമേ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ രക്ഷിക്കണമേ’ എന്ന അപേക്ഷയെ പ്രതിഫലിപ്പിക്കാം; എന്നാൽ ഇവിടെ അത് ആരാധനയിലെ സ്തുതിഘോഷമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: അനുഗൃഹീതം
  rationale: രാജ്യത്തെക്കുറിച്ചുള്ള ആരാധനാപരമായ ആശംസയും സ്തുതിഘോഷവും നിലനിർത്തുന്നു; ‘സ്തുതിക്കപ്പെട്ടത്’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ അനുഗ്രഹധ്വനി നേരിട്ട് പകരുന്നു.
- source_word: ἡ ἐρχομένη βασιλεία
  choice: വരുന്ന ... രാജ്യം
  rationale: വർത്തമാനകൃത്തിന്റെ ചലനാത്മകമായ ‘വന്നുകൊണ്ടിരിക്കുന്ന/വരുന്ന’ അർഥം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു; ‘വരുവാനുള്ള രാജ്യം’ എന്നത് ആവശ്യത്തിലധികം സ്ഥിരമായ ഭാവികാല വ്യാഖ്യാനം നൽകാം.
- source_word: βασιλεία
  choice: രാജ്യം
  rationale: ദാവീദിക രാജവാഴ്ചയുടെ മൂർത്തമായ പശ്ചാത്തലത്തിൽ സ്വാഭാവികവും വ്യാപകമായി മനസ്സിലാകുന്നതുമായ പദം; ‘ഭരണം’ എന്നത് അമൂർത്തമായ അധികാരപ്രയോഗത്തിലേക്ക് അർഥം ചുരുക്കാം.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: നമ്മുടെ പിതാവായ ദാവീദിന്റെ
  rationale: ദാവീദിനെ പൂർവപിതാവെന്ന ബഹുമാനസൂചകമായി അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: Ὡσαννὰ
  choice: ഹോശന്നാ
  rationale: പുതിയനിയമസന്ദർഭത്തിലെ സ്ഥിരമായ ആരാധനാഘോഷമായി ലിപ്യന്തരണം ചെയ്യുന്നു; അതിന്റെ അടിസ്ഥാന അപേക്ഷാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς ὑψίστοις
  choice: അത്യുന്നതങ്ങളിൽ
  rationale: ഏറ്റവും ഉയർന്ന സ്വർഗീയ മണ്ഡലത്തെ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും ബഹുവചനരൂപവും സംരക്ഷിക്കുന്നു; ‘അത്യുന്നത സ്വർഗങ്ങളിൽ’ എന്ന് വ്യാഖ്യാനിച്ച് പരിധി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ദാവീദിക രാജ്യത്തെക്കുറിച്ചുള്ള ഘോഷത്തിന്റെ സ്വഭാവം
  choice: ‘വരുന്ന നമ്മുടെ പിതാവായ ദാവീദിന്റെ രാജ്യം’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘വരുന്ന നമ്മുടെ പിതാവായ ദാവീദിന്റെ മശീഹാരാജ്യം’
  rationale: സന്ദർഭത്തിൽ മശീഹാപ്രതീക്ഷ ശക്തമാണെങ്കിലും ഗ്രീക്ക് പാഠത്തിൽ ‘മശീഹാരാജ്യം’ എന്ന് വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ വ്യാഖ്യാനപദം ചേർക്കാതെ മൂലപാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ സൂചനയും തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. ‘ഹോശന്നാ’ എന്ന പരിചിതമായ ലിപ്യന്തരണം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അതിന്റെ മൂലാർഥം അടിക്കുറിപ്പിൽ നൽകി. പദക്രമം ‘വരുന്ന നമ്മുടെ പിതാവായ ദാവീദിന്റെ രാജ്യം’ എന്നാക്കി ഗ്രീക്കിലെ ‘വരുന്ന രാജ്യം’ എന്ന ആശയവും ദാവീദുമായുള്ള ബന്ധവും വ്യക്തമായി സൂക്ഷിച്ചു.
