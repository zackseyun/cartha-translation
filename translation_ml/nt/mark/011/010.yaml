    rationale: Although readers can infer that “വരുന്ന” modifies “രാജ്യം,” its position before the entire possessive phrase is less natural in Malayalam and can momentarily obscure the modifier’s scope. Placing “വരാനിരിക്കുന്ന” immediately before “രാജ്യം” resolves this without adding a messianic gloss or materially changing the aspectual sense.
