  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ὀψὲ ἐγένετο, ⸀ἐξεπορεύοντο ἔξω τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: ml
  text: സന്ധ്യയാകുമ്പോഴെല്ലാം അവർ നഗരത്തിൽനിന്ന് പുറത്തേക്കു പോകുമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: ആകുമ്പോഴെല്ലാം
  rationale: തുടർന്നുവരുന്ന അപൂർണഭൂതകാല ക്രിയയോടൊപ്പം ഇത് ആവർത്തിച്ചിരുന്ന പതിവിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ വെറും ‘ആയപ്പോൾ’ എന്നതിനെക്കാൾ ‘ആകുമ്പോഴെല്ലാം’ യോജിക്കുന്നു.
- source_word: ὀψὲ ἐγένετο
  choice: സന്ധ്യയാകുമ്പോൾ
  rationale: ‘വൈകി/സന്ധ്യയായി’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐξεπορεύοντο
  choice: പുറത്തേക്കു പോകുമായിരുന്നു
  rationale: അപൂർണഭൂതകാല രൂപം സന്ദർഭത്തിൽ പതിവായി ആവർത്തിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: ἔξω τῆς πόλεως
  choice: നഗരത്തിനു പുറത്തേക്കു
  rationale: ἐξεπορεύοντο എന്ന ക്രിയയിലെ പുറത്തേക്കുള്ള ചലനവും ἔξω കൂടിയുള്ള ഷഷ്ഠീവിഭക്തിയുടെ അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πόλεως
  choice: നഗരം
  rationale: സന്ദർഭത്തിൽ യെരൂശലേം ഉദ്ദേശിക്കപ്പെടുന്നുവെങ്കിലും ഗ്രീക്കിൽ സ്ഥലനാമമല്ല, ‘നഗരം’ എന്നാണ്; അതിനാൽ മൂലപാഠത്തിന്റെ അനിർദ്ദിഷ്ടത സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവും അതേസമയം മാന്യവുമായ ഭാഷ. ‘പോകുമായിരുന്നു’ എന്നും ‘ആകുമ്പോഴെല്ലാം’ എന്നും ചേർത്ത് ആവർത്തിതമായ പതിവുപ്രവൃത്തി സൂക്ഷിച്ചു.
