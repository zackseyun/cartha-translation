  text: καὶ ⸀φέρουσιν τὸν πῶλον πρὸς τὸν Ἰησοῦν, καὶ ⸀ἐπιβάλλουσιν αὐτῷ τὰ ἱμάτια αὐτῶν, καὶ ἐκάθισεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: ml
  text: അവർ ആ കഴുതക്കുട്ടിയെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു; തങ്ങളുടെ മേലങ്കികൾ അതിന്റെമേൽ ഇട്ടു; അവൻ അതിന്മേൽ ഇരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: കഴുതക്കുട്ടി
  rationale: πῶλος എന്ന പദത്തിന് പൊതുവായി ചെറുമൃഗം/കുതിരക്കുട്ടി എന്നർഥമുണ്ടെങ്കിലും, ഈ സംഭവത്തിന്റെ സന്ദർഭവും മുൻവാക്യവും ഇത് കഴുതക്കുട്ടിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἐπιβάλλουσιν
  choice: വിരിച്ചു
  rationale: വസ്ത്രങ്ങൾ മൃഗത്തിന്റെ പുറത്ത് ഇടുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കുന്നു; ഗ്രീക്കിലെ മുകളിൽ ഇടുക എന്ന പ്രവർത്തനാർഥം നിലനിർത്തുന്നു.
- source_word: ἱμάτια
  choice: മേലങ്കികൾ
  rationale: പുറത്ത് ധരിക്കുന്ന വസ്ത്രങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: അവൻ അതിന്മേൽ ഇരുന്നു
  rationale: ഗ്രീക്ക് വാക്യത്തിന്റെ ലളിതമായ പ്രവർത്തനക്രമവും സർവനാമപ്രയോഗവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവർത്തനം. മൂലത്തിലെ മൂന്ന് പ്രവർത്തനങ്ങളുടെ ക്രമം നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായ വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി.
