id: MRK.11.17
reference: Mark 11:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: ml
  text: 'അവൻ അവരെ പഠിപ്പിച്ചുകൊണ്ട് ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “എന്റെ ഭവനം സകല ജനതകൾക്കും[a] പ്രാർഥനാഭവനം എന്നു വിളിക്കപ്പെടും എന്ന് എഴുതിയിട്ടില്ലേ? എന്നാൽ നിങ്ങൾ അതിനെ കൊള്ളക്കാരുടെ ഗുഹയാക്കിയിരിക്കുന്നു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സകല ജനങ്ങൾക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. “സകല ജനതകൾക്കും” എന്നത് യെശയ്യാവ് 56:7-നെ പ്രതിധ്വനിപ്പിക്കുകയും ഇസ്രായേലിന് അതീതമായ ജനതകളെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “കൊള്ളക്കാരുടെ ഗുഹ” എന്നത് യിരെമ്യാവ് 7:11-നെ പ്രതിധ്വനിപ്പിക്കുന്നു. ഇവിടെ ഉപയോഗിച്ച ഗ്രീക്ക് പദത്തിന് ചില സന്ദർഭങ്ങളിൽ “കവർച്ചക്കാർ” അല്ലെങ്കിൽ “കള്ളന്മാർ” എന്നും അർഥമാകാം.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: പഠിപ്പിച്ചുകൊണ്ട് ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: രണ്ട് ക്രിയകളുടെയും അപൂർണകാലസ്വഭാവം തുടരുന്ന പ്രവൃത്തിയായി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: Οὐ γέγραπται
  choice: എന്ന് എഴുതിയിട്ടില്ലേ?
  rationale: തിരുവെഴുത്തിന്റെ നിലവിലുള്ള അധികാരത്തെ സൂചിപ്പിക്കുന്ന പൂർണ നിഷ്ക്രിയരൂപത്തിന്റെ ചോദ്യബലം നിലനിർത്തുന്നു.
- source_word: Ὁ οἶκός μου
  choice: എന്റെ ഭവനം
  rationale: യെശയ്യാവ് 56:7-ലെ ഉദ്ധരണിയുടെ ‘house’ രൂപകവും വിശുദ്ധഭാവവും നിലനിർത്തുന്നു; ‘ക്ഷേത്രം’ എന്നു വിശദീകരിച്ചിട്ടില്ല.
- source_word: οἶκος προσευχῆς
  choice: പ്രാർഥനാഭവനം
  rationale: ജനസാധാരണയ്ക്ക് വ്യക്തവും ബൈബിൾഭാഷയിൽ പരിചിതവുമായ സ്വാഭാവിക സംയുക്തപദം.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: സകല ജനതകൾക്കും വേണ്ടിയുള്ള
  rationale: ἔθνη എന്നതിന്റെ ബഹുവചനവും യെശയ്യാവിലെ സാർവജനീന വ്യാപ്തിയും കാത്തുസൂക്ഷിക്കുന്നു; ദാതിവിന്റെ സന്ദർഭാർഥം ‘വേണ്ടിയുള്ള’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: πεποιήκατε
  choice: ആക്കിയിരിക്കുന്നു
  rationale: മുൻപ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന പൂർണകാലബലം നിലനിർത്തുന്നു.
- source_word: σπήλαιον λῃστῶν
  choice: കവർച്ചക്കാരുടെ ഗുഹ
  rationale: യിരെമ്യാവ് 7:11-ലെ പ്രവാചകപ്രതിധ്വനി നിലനിർത്തുന്നു; λῃστής എന്ന പദത്തെ അനാവശ്യമായി രാഷ്ട്രീയവൽക്കരിക്കാതെ വിശാലമായ അർഥം നൽകുന്നു.
theological_decisions:
- issue: പ്രവാചകഉദ്ധരണിയിലെ സാർവജനീന വ്യാപ്തി
  choice: സകല ജനതകൾക്കും വേണ്ടിയുള്ള
  alternative: സകല ജനങ്ങൾക്കും വേണ്ടിയുള്ള; സകല ജനതകളാലും
  rationale: πᾶσιν τοῖς ἔθνεσιν എന്നതിലെ ‘ജനതകൾ’ എന്ന നേരിട്ടുള്ള അർഥവും ഇസ്രായേലിന് അതീതമായ ദൈവാലയത്തിന്റെ ലക്ഷ്യവും നിലനിർത്തുന്നു; ദാതിവിന്റെ സാദ്ധ്യമായ വ്യത്യസ്ത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: λῃστῶν എന്ന ആരോപണത്തിന്റെ ശക്തി
  choice: കവർച്ചക്കാർ
  alternative: കൊള്ളക്കാർ; ആയുധധാരികളായ കൊള്ളക്കാർ
  rationale: യിരെമ്യാവ് 7:11-ന്റെ പ്രതിധ്വനിക്ക് അനുയോജ്യമായ അർഥം നൽകുന്നു; ഈ സന്ദർഭം നിർബന്ധിക്കാത്ത കലാപകാരി എന്ന രാഷ്ട്രീയസൂചന ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഉദ്ധരണിയുടെ പ്രവാചകപ്രതിധ്വനികൾ നിലനിർത്തിയിട്ടുണ്ട്; അപൂർണകാലത്തിന്റെ തുടർച്ചയും പൂർണകാലത്തിന്റെ നിലവിലുള്ള ഫലവും കഴിയുന്നത്ര സ്വാഭാവികമായി പ്രകടിപ്പിച്ചിരിക്കുന്നു.
