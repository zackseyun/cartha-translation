source:
  edition: SBLGNT
  text: καὶ ἀναμνησθεὶς ὁ Πέτρος λέγει αὐτῷ· Ῥαββί, ἴδε ἡ συκῆ ἣν κατηράσω ἐξήρανται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: ml
  text: 'പത്രോസ് ഓർത്തിട്ട് അവനോടു പറയുന്നു: “റബ്ബീ, നോക്കൂ! അങ്ങ് ശപിച്ച അത്തിവൃക്ഷം ഉണങ്ങിപ്പോയിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വാടിപ്പോയിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ ഉണങ്ങിപ്പോകുന്നതിനെയോ വാടിപ്പോകുന്നതിനെയോ സൂചിപ്പിക്കാം; പൂർണകാലരൂപം ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലാവസ്ഥയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: ഓർത്തുകൊണ്ട്
  rationale: ഓർമ വന്നതിനു പിന്നാലെ പത്രോസ് സംസാരിക്കുന്നുവെന്ന കൃന്ദന്തരൂപബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാല പ്രയോഗം ഭൂതകാലമാക്കി നിരപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: ഗ്രീക്കിലുള്ള സർവനാമരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: Ῥαββί
  choice: റബ്ബീ
  rationale: യഹൂദ പശ്ചാത്തലവും നേരിട്ടുള്ള അഭിസംബോധനയും സംരക്ഷിക്കാൻ ഗ്രീക്കിൽ ലിപ്യന്തരം ചെയ്തിരിക്കുന്ന സ്ഥാനപ്പേര് മലയാളത്തിലും ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: ἴδε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞാരൂപത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളം.
- source_word: συκῆ
  choice: അത്തിവൃക്ഷം
  rationale: സന്ദർഭത്തിൽ ഫലത്തെയല്ല, വൃക്ഷത്തെയാണ് നാമം സൂചിപ്പിക്കുന്നത്.
- source_word: κατηράσω
  choice: അങ്ങ് ശപിച്ച
  rationale: യേശുവിനോടുള്ള ഏകവചന അഭിസംബോധന മാന്യമായി പ്രകടിപ്പിക്കുമ്പോഴും മുൻപ് ചെയ്ത പ്രവൃത്തിയുടെ നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുന്നു.
- source_word: ἐξήρανται
  choice: ഉണങ്ങിപ്പോയിരിക്കുന്നു
  rationale: വൃക്ഷം ഉണങ്ങിപ്പോയ സംഭവവും അതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥയും ഗ്രീക്ക് പൂർണകാലത്തിനനുസരിച്ച് പ്രകടിപ്പിക്കുന്നു.
