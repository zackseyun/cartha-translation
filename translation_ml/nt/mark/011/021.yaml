translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ചരിത്രവർത്തമാനകാലം ‘പറയുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി; ‘റബ്ബീ’ യഹൂദ പശ്ചാത്തലം സംരക്ഷിക്കുന്നു. യേശുവിനോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
