  text: οἱ δὲ εἶπαν αὐτοῖς καθὼς ⸀εἶπεν ὁ Ἰησοῦς· καὶ ἀφῆκαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/006.yaml
  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: ml
  text: അവർ യേശു പറഞ്ഞതുപോലെതന്നെ അവരോടു പറഞ്ഞു; അവർ അവരെ പോകാൻ അനുവദിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ വിട്ടയച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് അനുവദിക്കുക, വിട്ടയയ്ക്കുക, പോകാൻ വിടുക എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ സമീപത്തുണ്ടായിരുന്നവർ ശിഷ്യന്മാർ കഴുതക്കുട്ടിയെ കൊണ്ടുപോകുന്നതു തടയാതിരുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: അവർ
  rationale: സന്ദർഭത്തിൽ ഇത് ശിഷ്യന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. δέ കഥയുടെ ഒഴുക്കിലുള്ള ലഘുവായ ബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: εἶπαν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: λέγω എന്ന സാധാരണ സംസാരക്രിയയെയും αὐτοῖς എന്ന പരോക്ഷകർമത്തെയും നേരായും സ്വാഭാവികമായും പകർന്നു.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: യേശു പറഞ്ഞതുപോലെതന്നെ
  rationale: καθώς സൂചിപ്പിക്കുന്ന കൃത്യമായ പൊരുത്തം ‘പോലെതന്നെ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; മുൻപ് നൽകിയ നിർദേശത്തെ മലയാളത്തിലെ ഭൂതകാലരൂപം സന്ദർഭത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀφῆκαν αὐτούς
  choice: അവർ അവരെ പോകാൻ അനുവദിച്ചു
  rationale: ἀφίημι ഇവിടെ ശിഷ്യന്മാരെ ഇനി തടയാതെ കഴുതക്കുട്ടിയുമായി പോകാൻ അനുവദിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പോകാൻ അനുവദിച്ചു’ ഈ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു; ക്രിയയുടെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ആവർത്തിച്ചുള്ള ബഹുവചന സർവനാമങ്ങൾ നിലനിർത്തിയെങ്കിലും, ‘അപ്പോൾ’ ചേർത്ത് സംഭവക്രമം സ്വാഭാവികമാക്കി.
