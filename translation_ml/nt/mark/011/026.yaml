    issue: Over-literal plural in “സ്വർഗങ്ങളിലുള്ള”
    rationale: Although οὐρανοῖς is plural in Greek, Malayalam normally uses singular “സ്വർഗത്തിൽ” in this conventional divine-location expression. The plural sounds stilted and does not communicate a necessary semantic distinction.
  - severity: low
    issue: Footnote wording “മിക്ക സുറിയാനി സാക്ഷ്യങ്ങളിലും” is awkward
    rationale: “സുറിയാനി സാക്ഷികളിൽ മിക്കതിലും” more directly and idiomatically expresses “most Syriac witnesses.”
