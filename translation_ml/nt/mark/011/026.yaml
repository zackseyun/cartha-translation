source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἰ δὲ ὑμεῖς οὐκ ἀφίετε, οὐδὲ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφήσει τὰ παραπτώματα ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: ml
  text: എന്നാൽ[a] നിങ്ങൾ ക്ഷമിക്കുന്നില്ലെങ്കിൽ, സ്വർഗത്തിലുള്ള നിങ്ങളുടെ പിതാവും നിങ്ങളുടെ അതിക്രമങ്ങൾ ക്ഷമിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം ഏറ്റവും പഴക്കമുള്ള ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ—നാലാം നൂറ്റാണ്ടിലെ സിനായിറ്റിക്കസും വത്തിക്കാനസും ഉൾപ്പെടെ—ആദ്യകാല കോപ്റ്റിക് പരിഭാഷകളിലും കാണുന്നില്ല. എന്നാൽ ബൈസന്റൈൻ ഭൂരിപക്ഷ പാരമ്പര്യത്തിലും ലത്തീൻ പാരമ്പര്യത്തിലും സുറിയാനി സാക്ഷികളിൽ മിക്കതിലും ഇത് കാണുന്നു. മത്തായി 6:15-ലെ യേശുവിന്റെ വാക്കുകളോട് ഒത്തുവരുത്താൻ പിൽക്കാല പകർപ്പെഴുത്തുകാർ ഇത് ചേർത്തതായിരിക്കാം.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: ക്ഷമിക്കുക
  rationale: മനുഷ്യർ പരസ്പരം ചെയ്ത തെറ്റുകളും ദൈവം മനുഷ്യരുടെ കുറ്റങ്ങളും വിട്ടുകൊടുക്കുന്നതും സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ, മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ സമാനപദമാണ് ‘ക്ഷമിക്കുക’.
- source_word: παράπτωμα
  choice: അതിക്രമങ്ങൾ
  rationale: ശരിയായ വഴിയിൽനിന്നുള്ള വ്യതിചലനമോ ലംഘനമോ എന്ന അർഥഭാവം നിലനിർത്തുകയും പൊതുവായ ‘പാപങ്ങൾ’ എന്ന പദത്തിൽനിന്ന് ഗ്രീക്ക് പദത്തിന്റെ പ്രത്യേകത വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിലുള്ള
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം മറച്ചുവയ്ക്കാതെ, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യരുടെ ക്ഷമയും പിതാവിന്റെ ക്ഷമയും തമ്മിലുള്ള നിബന്ധനാത്മക ബന്ധം
  choice: ‘നിങ്ങൾ ക്ഷമിക്കുന്നില്ലെങ്കിൽ ... പിതാവും ... ക്ഷമിക്കുകയില്ല’ എന്ന സമാന്തര ഘടന നിലനിർത്തി.
  alternative: ദൈവക്ഷമയുടെ സിദ്ധാന്തവുമായി പൊരുത്തപ്പെടുത്താൻ നിബന്ധനയുടെ ശക്തി മൃദുവാക്കുക.
  rationale: വാക്യത്തിലെ വ്യക്തമായ മുന്നറിയിപ്പും ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യാഖ്യാനത്തിലൂടെ ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ‘സ്വർഗങ്ങൾ’ എന്ന ബഹുവചനം നിലനിർത്തിയിട്ടുണ്ട്; വാക്യത്തിന്റെ നിബന്ധനാത്മക ശക്തി മൃദുവാക്കിയിട്ടില്ല.
