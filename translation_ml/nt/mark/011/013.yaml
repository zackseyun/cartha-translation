  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാക്യം സുഗമവും മാന്യമായ ആഖ്യാനരജിസ്റ്ററിലുള്ളതുമാണ്. ‘അടുത്തേക്കു ചെന്നു’ / ‘അടുത്തെത്തിയപ്പോൾ’ എന്ന ആവർത്തനം ശൈലീപരമായി അല്പം ശ്രദ്ധയിൽപ്പെടാമെങ്കിലും ഗ്രീക്കിലെ സമീപനവും പിന്നീട് എത്തിച്ചേരലും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നതിനാൽ തിരുത്തൽ അനിവാര്യമല്ല.
  terminology: ‘അത്തിവൃക്ഷം,’ ‘അത്തിപ്പഴം,’ ‘ഇലകളല്ലാതെ മറ്റൊന്നും’ എന്നിവ കൃത്യവും സ്വാഭാവികവുമാണ്. καιρός-നെ ‘കാലം’ എന്നു നൽകിയത് സന്ദർഭോചിതമാണ്. അടിക്കുറിപ്പിലെ ‘സമയം’ എന്ന ബദൽ ശരിയായ ലെക്സിക്കൽ സാധ്യതയാണ്; അതു മുഖ്യവാക്യത്തിന്റെ അർഥം മാറ്റുന്നില്ല.
