id: MRK.11.13
reference: Mark 11:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: ml
  text: അകലെ ഇലകളുള്ള ഒരു അത്തിവൃക്ഷം കണ്ട്, അതിൽ ഒരുപക്ഷേ എന്തെങ്കിലും കണ്ടുകിട്ടുമോ എന്നു നോക്കാൻ അവൻ അതിന്റെ അടുത്തേക്കു ചെന്നു. എന്നാൽ അടുത്തെത്തിയപ്പോൾ ഇലകളല്ലാതെ മറ്റൊന്നും കണ്ടില്ല; കാരണം അത് അത്തിപ്പഴത്തിന്റെ കാലമായിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അത്തിപ്പഴത്തിന്റെ സമയമായിരുന്നില്ല.”
    reason: καιρός എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘കാലം’ എന്നും ‘സമയം’ എന്നും സ്വാഭാവികമായി വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: ἰδὼν
  choice: കണ്ട്
  rationale: കാലസാഹചര്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കൃ.dantത്തെ സ്വാഭാവികമായ മലയാള ക്രിയാവിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; സംഭവക്രമം അനാവശ്യമായി കർശനമാക്കുന്നില്ല.
- source_word: συκῆν
  choice: ഒരു അത്തിവൃക്ഷം
  rationale: സാധാരണവും വ്യക്തവുമായ മലയാള തുല്യപദം.
- source_word: ἀπὸ μακρόθεν
  choice: അകലെ
  rationale: ദൂരത്തിൽനിന്നുള്ള കാഴ്ച എന്ന സ്ഥലസൂചന സ്വാഭാവികവും ചുരുക്കവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: ἔχουσαν φύλλα
  choice: ഇലകളുള്ള
  rationale: ‘ഇലകളുണ്ടായിരുന്ന’ എന്നതിനെക്കാൾ സംക്ഷിപ്തമായി ഗ്രീക്കിലെ വിശേഷണാത്മക പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: അതിൽ ഒരുപക്ഷേ എന്തെങ്കിലും കണ്ടുകിട്ടുമോ എന്നു നോക്കാൻ അവൻ അതിന്റെ അടുത്തേക്കു ചെന്നു
  rationale: εἰ ἄραയിലെ അനിശ്ചിത പ്രതീക്ഷ ‘ഒരുപക്ഷേ ... മോ’ എന്നതിലൂടെ നിലനിർത്തുകയും, ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: അടുത്തെത്തിയപ്പോൾ
  rationale: വൃക്ഷത്തിന്റെ അടുത്തേക്കുള്ള സമീപനവും സമയബന്ധവും ആവർത്തനം കൂടാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: ഇലകളല്ലാതെ മറ്റൊന്നും കണ്ടില്ല
  rationale: εἰ μὴയുടെ ഒഴിവാക്കൽ അർഥം കൃത്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: കാരണം അത് അത്തിപ്പഴത്തിന്റെ കാലമായിരുന്നില്ല
  rationale: καιρός എന്നത് സന്ദർഭത്തിൽ ഫലകാലത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ വിശദീകരണവാക്യം വികസിപ്പിക്കാതെയും വൈരുധ്യം പരിഹരിക്കാതെയും നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: അത്തിപ്പഴക്കാലത്തെക്കുറിച്ചുള്ള വിശദീകരണവാക്യത്തിന്റെ വ്യാഖ്യാനബലം
  choice: ‘കാരണം അത് അത്തിപ്പഴത്തിന്റെ കാലമായിരുന്നില്ല’ എന്ന നേരിട്ടുള്ള വിവർത്തനം
  alternative: കാർഷികരീതികളെ വിശദീകരിച്ച് യേശു എന്തുകൊണ്ട് ഫലം അന്വേഷിച്ചു എന്നു വ്യാഖ്യാനിക്കുന്ന വിപുലീകരണം
  rationale: ഫലം അന്വേഷിക്കുന്നതും അത്തിപ്പഴക്കാലമല്ലെന്ന ആഖ്യാതാവിന്റെ പ്രസ്താവനയും തമ്മിലുള്ള പിരിമുറുക്കം മൂലപാഠത്തിലുള്ളതുപോലെ നിലനിർത്തുന്നു; വിവർത്തനം അത് മയപ്പെടുത്തുകയോ പരിഹരിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ അനിശ്ചിതത്വവും വ്യാഖ്യാനപിരിമുറുക്കവും നിലനിർത്തി.
