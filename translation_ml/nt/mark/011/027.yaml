source:
  edition: SBLGNT
  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: ml
  text: അവർ വീണ്ടും യെരൂശലേമിൽ എത്തി. യേശു ദേവാലയാങ്കണത്തിൽ[a] നടന്നുകൊണ്ടിരിക്കുമ്പോൾ മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും മൂപ്പന്മാരും അദ്ദേഹത്തിന്റെ അടുക്കൽ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദേവാലയത്തിൽ’ അല്ലെങ്കിൽ ‘ദേവാലയപരിസരത്ത്’; ഗ്രീക്ക് പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: എത്തി / വന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായി നൽകി; ആദ്യ പ്രയോഗത്തിൽ സ്ഥലത്തെത്തൽ സൂചിപ്പിക്കാൻ ‘എത്തി’, രണ്ടാമത്തേതിൽ വ്യക്തിയുടെ അടുക്കലേക്കുള്ള ചലനം സൂചിപ്പിക്കാൻ ‘വന്നു’ ഉപയോഗിച്ചു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: യെരൂശലേമിലേക്കുള്ള ആവർത്തിച്ചുള്ള വരവ് നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ സ്ഥലനാമരൂപം.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയാങ്കണത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുസന്ദർശനം നടക്കുന്ന സ്ഥലമെന്ന ആശയം ‘ദേവാലയാങ്കണം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: περιπατοῦντος αὐτοῦ
  choice: യേശു ... നടന്നുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് നൽകുന്ന പശ്ചാത്തലപരവും തുടരുന്നതുമായ പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ ‘യേശു’ എന്ന് നൽകി.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഇവിടെ പ്രമുഖ പുരോഹിത അധികാരികളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്; ‘മുഖ്യപുരോഹിതന്മാർ’ അതിന്റെ സ്ഥാപിതമായ മലയാള തുല്യപദമാണ്.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: നിയമപണ്ഡിതരും പകർപ്പെഴുത്തുകാരുമായിരുന്ന അംഗീകൃത വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന, സുവിശേഷസന്ദർഭത്തിൽ പരിചിതമായ നേരിട്ടുള്ള തുല്യപദം.
- source_word: πρεσβύτεροι
  choice: മൂപ്പന്മാർ
  rationale: വെറും പ്രായമേറിയ പുരുഷന്മാരെയല്ല, അംഗീകൃത യഹൂദ നേതാക്കളെയാണ് ഈ സ്ഥാപനപരമായ സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: πρὸς αὐτόν
  choice: അദ്ദേഹത്തിന്റെ അടുക്കൽ
  rationale: യേശുവിലേക്കുള്ള സമീപനവും ചലനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἱερόν എന്ന പദത്തിന്റെ സ്ഥലസൂചന
  choice: ദേവാലയാങ്കണം
  alternative: ദേവാലയം / ദേവാലയപരിസരം
  rationale: ναός സൂചിപ്പിക്കുന്ന അകത്തെ വിശുദ്ധമന്ദിരമായി വായിക്കപ്പെടാതിരിക്കാനും വിശാലമായ ദേവാലയസമുച്ചയം വ്യക്തമാക്കാനും ഈ രൂപം തിരഞ്ഞെടുത്തു. ഇത് ഉപദേശപരമായ വ്യാഖ്യാനമല്ല, സന്ദർഭത്തെ ബാധിക്കുന്ന പദാർഥ-സ്ഥലപരമായ തീരുമാനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അദ്ദേഹം’ എന്ന സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ഉപവാക്യത്തിൽ ‘യേശു’ എന്ന് വ്യക്തമാക്കി. വാക്യക്രമം ഗ്രീക്ക് സംഭവക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സുഗമമാക്കി.
