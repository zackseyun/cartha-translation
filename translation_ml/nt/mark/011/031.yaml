reference: Mark 11:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: ml
  text: 'അവർ തമ്മിൽ ആലോചിച്ചുകൊണ്ട് പറഞ്ഞു: “നാം എന്തു പറയണം? ‘സ്വർഗത്തിൽനിന്നാണ്[a]’ എന്നു പറഞ്ഞാൽ, ‘പിന്നെ നിങ്ങൾ എന്തുകൊണ്ട് അവനെ വിശ്വസിച്ചില്ല?’ എന്ന് അവൻ പറയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സ്വർഗത്തിൽനിന്ന്” എന്നത് “ദൈവത്തിൽനിന്ന്” അഥവാ “ദൈവിക ഉത്ഭവമുള്ളത്” എന്നർഥമുള്ള യഹൂദ ആദരസൂചക പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: ആലോചിച്ചുകൊണ്ട്
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന വിചിന്തനത്തെയും കൂടിയാലോചനയെയും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: πρὸς ἑαυτοὺς
  choice: തമ്മിൽ
  rationale: ഓരോരുത്തരുടെയും ഉള്ളിലെ ചിന്തയല്ല, സംഘത്തിനുള്ളിലെ പരസ്പര ആലോചനയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: അവരുടെ ആലോചനയുടെ ഉള്ളടക്കം തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകളായി അവതരിപ്പിക്കുന്നു.
- source_word: Τί εἴπωμεν;
  choice: നാം എന്തു പറയണം?
  rationale: ആലോചനാത്മകമായ ഉപവാക്യത്തിന്റെ ‘എന്ത് മറുപടി നൽകണം’ എന്ന ഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐὰν εἴπωμεν
  choice: എന്നു പറഞ്ഞാൽ
  rationale: സാധാരണ സോപാധിക ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: Ἐξ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ദൈവിക ഉത്ഭവമോ അധികാരമോ സൂചിപ്പിക്കുന്ന യഹൂദ ആദരസൂചക പ്രയോഗത്തെ വ്യാഖ്യാനിച്ച് മാറ്റാതെ മൂലരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐρεῖ
  choice: എന്ന് അവൻ ചോദിക്കും
  rationale: മൂലപദത്തിന്റെ അടിസ്ഥാന അർഥം ‘പറയും’ എന്നാണെങ്കിലും തുടർന്നുവരുന്നത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിക്കും’ എന്നത് വാക്യത്തിന്റെ പ്രയോഗശക്തി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Διὰ τί οὖν
  choice: പിന്നെ എന്തുകൊണ്ട്
  rationale: അവരുടെ സങ്കൽപ്പിത ഉത്തരത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: നിങ്ങൾ അവനെ വിശ്വസിച്ചില്ല
  rationale: ദാതിവോടുകൂടിയ πιστεύω ഇവിടെ യോഹന്നാന്റെ സാക്ഷ്യം സത്യമെന്നു സ്വീകരിക്കാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അവനിൽ വിശ്വസിക്കുക’ എന്ന വേറിട്ട വ്യക്തിനിഷ്ഠ ഊന്നൽ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സ്നാനത്തിന്റെ ഉറവിടത്തെക്കുറിച്ചുള്ള ‘സ്വർഗത്തിൽനിന്ന്’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘സ്വർഗത്തിൽനിന്ന്’ നിലനിർത്തുക
  alternative: ‘ദൈവത്തിൽനിന്ന്’ എന്നു വ്യക്തമാക്കുക
  rationale: ഇത് ദൈവിക ഉത്ഭവമോ അധികാരമോ സൂചിപ്പിക്കുന്ന യഹൂദ ആദരസൂചക പ്രയോഗമാണ്. ‘സ്വർഗം’ നിലനിർത്തുന്നത് മൂലഭാഷയുടെ രൂപവും കഥയിലെ വാഗ്വൈഭവവും സംരക്ഷിക്കുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കൂട്ടായ ആലോചനയുടെ ഭാവവും സോപാധിക വാദത്തിന്റെ തർക്കക്രമവും സംരക്ഷിച്ചു.
