source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങൾ പ്രാർഥനയിൽ എന്തെല്ലാം ചോദിക്കുന്നുവോ, അവ ലഭിച്ചുകഴിഞ്ഞു എന്നു വിശ്വസിക്കുവിൻ[a]; അവ നിങ്ങൾക്കു ലഭിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിലോ വായനകളിലോ ‘ലഭിക്കുന്നു എന്നു വിശ്വസിക്കുവിൻ’ എന്നാണ് മനസ്സിലാക്കുകയോ പരിഭാഷപ്പെടുത്തുകയോ ചെയ്യുന്നത്. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പാഠം ‘ലഭിച്ചുകഴിഞ്ഞു’ എന്ന പൂർത്തിയായ പ്രവൃത്തിബോധമുള്ള വായനയാണ് നൽകുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള വിശ്വാസത്തെയും പ്രാർഥനയെയും കുറിച്ചുള്ള ഉപദേശത്തോട് ഈ വാക്കിനെ ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികമായ നിഗമനപ്രയോഗം.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ളതും അധികാരപൂർണവുമായ അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πάντα ὅσα
  choice: എന്തെല്ലാം
  rationale: ഗ്രീക്കിലെ സമഗ്രവും ബഹുവചനപരവുമായ വ്യാപ്തി മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: നിങ്ങൾ പ്രാർഥനയിൽ ... ചോദിക്കുന്നുവോ
  rationale: പ്രാർഥിക്കുകയും അപേക്ഷിക്കുകയും ചെയ്യുന്ന രണ്ടു ആശയങ്ങളും സ്വാഭാവിക മലയാളവാക്യത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: πιστεύετε
  choice: വിശ്വസിക്കുവിൻ
  rationale: തുടർന്നുവരുന്ന ഉള്ളടക്കവാക്യത്തോടു നേരിട്ട് ചേരുന്ന ആജ്ഞാരൂപം.
- source_word: ἐλάβετε
  choice: ലഭിച്ചുകഴിഞ്ഞു
  rationale: അയോറിസ്റ്റിന്റെ പൂർത്തിയായ പ്രവൃത്തിബോധവും ഭാവിയിലെ ഫലവുമായുള്ള ശ്രദ്ധേയമായ കാലപരമായ സംഘർഷവും സൂക്ഷിക്കുന്നു.
- source_word: ἔσται ὑμῖν
  choice: അവ നിങ്ങൾക്കു ലഭിക്കും
  rationale: ആവശ്യപ്പെട്ട കാര്യങ്ങൾ ഭാവിയിൽ അവർക്കുണ്ടാകുമെന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും ബഹുവചനസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വിശ്വാസവും പ്രാർഥനയുടെ ഉത്തരവും തമ്മിലുള്ള കാലപരമായ ബന്ധം
  choice: ‘ലഭിച്ചുകഴിഞ്ഞു എന്നു വിശ്വസിക്കുവിൻ; അവ നിങ്ങൾക്കു ലഭിക്കും’ എന്ന വിരോധാഭാസസദൃശമായ ക്രമം നിലനിർത്തി.
  alternative: ‘ലഭിക്കുന്നു എന്നു വിശ്വസിക്കുവിൻ’
  rationale: SBLGNT-യിൽ ἐλάβετε എന്ന അയോറിസ്റ്റ് രൂപമാണ്; അതിനാൽ പ്രത്യേക പ്രാർഥനാസിദ്ധാന്തം ചേർക്കാതെയും വാചകത്തിലെ യഥാർഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം മിനുക്കാതെയും പൂർത്തിയായ പ്രവൃത്തിബോധം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എന്തെല്ലാം ... അവ’ എന്ന ബന്ധം ഗ്രീക്കിലെ ബഹുവചനവ്യാപ്തി വ്യക്തമാക്കുന്നു; ‘പ്രാർഥനയിൽ ചോദിക്കുക’ എന്ന പ്രയോഗം രണ്ടു ഗ്രീക്ക് ക്രിയകളുടെയും അർഥം മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനമില്ലാതെ കൈമാറുന്നു.
