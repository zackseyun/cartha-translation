id: MRK.11.16
reference: Mark 11:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἤφιεν ἵνα τις διενέγκῃ σκεῦος διὰ τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/016.yaml
  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: ml
  text: ആലയാങ്കണങ്ങളിലൂടെ[a] ആരെയും ഒരു സാധനം[b] ചുമന്നുകൊണ്ടുപോകാൻ അവൻ അനുവദിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ആലയപരിസരത്തിലൂടെ.’ ഗ്രീക്ക് പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, വിശാലമായ ആലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ഒരു പാത്രം’ അഥവാ ‘ഒരു ഉപകരണം.’ ഗ്രീക്ക് പദം വിശാലാർഥമുള്ളതാണ്; ഏതു തരത്തിലുള്ള സാധനമാണെന്ന് അത് വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: അനുവദിച്ചില്ല
  rationale: ἀφίημι എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം ഇവിടെ പ്രവർത്തനം തുടരുന്ന സമയത്ത് യേശു അത് അനുവദിക്കാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അനുവദിച്ചില്ല’ സ്വാഭാവികമാണ്; സന്ദർഭം അതിന്റെ തുടർച്ചയായ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ἵνα τις διενέγκῃ
  choice: ആരെയും ... ചുമന്നുകൊണ്ടുപോകാൻ
  rationale: ἤφιεν എന്ന ക്രിയയ്ക്കുശേഷമുള്ള ἵνα-ഉപവാക്യം അനുവദിക്കാതിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ കർമം + ക്രിയാനാമഘടന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: διενέγκῃ
  choice: ചുമന്നുകൊണ്ടുപോകാൻ
  rationale: διαφέρω ഇവിടെ ഒരു പ്രദേശത്തിലൂടെ എന്തെങ്കിലും കൊണ്ടുപോകുക എന്ന അർഥത്തിലാണ്. ‘ചുമന്നുകൊണ്ടുപോകുക’ വഹിക്കലും കടന്നുപോകുന്ന ദിശാസൂചനയും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σκεῦος
  choice: ഒരു സാധനം
  rationale: σκεῦος പാത്രം, ഉപകരണം, വസ്തു എന്നിവയെ ഉൾക്കൊള്ളാവുന്ന വിശാലപദമാണ്. വസ്തുവിന്റെ ഇനം അനാവശ്യമായി നിർണയിക്കാതെ ‘സാധനം’ ആ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διὰ τοῦ ἱεροῦ
  choice: ആലയാങ്കണങ്ങളിലൂടെ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരമായ ναός എന്നതിലുപരി വിശാലമായ ആലയസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു. ‘ആലയാങ്കണങ്ങൾ’ പൊതുവായി സഞ്ചരിക്കാവുന്ന ആലയപരിസരത്തെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യെരൂശലേം ആലയവുമായി ബന്ധപ്പെട്ട ἱερόν എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: വിശാലമായ ആലയസമുച്ചയം എന്ന അർഥത്തിൽ ‘ആലയാങ്കണങ്ങൾ’
  alternative: ‘ആലയം’ അല്ലെങ്കിൽ ‘ആലയപരിസരം’
  rationale: വാക്യം അകത്തെ വിശുദ്ധമന്ദിരത്തിലൂടെയുള്ള സഞ്ചാരത്തെക്കുറിച്ചാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ἱερόν എന്ന പദത്തിന്റെ വിശാലമായ സ്ഥലസൂചന നിലനിർത്തുന്നു; ഇത് മതവിഭാഗപരമായ വ്യാഖ്യാനമല്ല, പദാർഥപരമായ വ്യത്യാസമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ആലയാങ്കണങ്ങൾ’ ἱερόν-ന്റെ വിശാലമായ സ്ഥലസൂചനയും ‘സാധനം’ σκεῦος-ന്റെ അനിർദിഷ്ടമായ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
