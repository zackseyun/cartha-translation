review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the solemn assertion, the indefinite ‘whoever,’ the addressed mountain, heart-level doubting, belief, and the present-tense force of γίνεται. However, ‘പൊങ്ങിപ്പോയി’ is intransitive (‘go up/float away’) and does not adequately render the passive imperative Ἄρθητι (‘be lifted/taken up’). The final ‘അവനുവേണ്ടി അങ്ങനെതന്നെ സംഭവിക്കും’ is more interpretive than the deliberately open ἔσται αὐτῷ.
  naturalness: Most of the Malayalam is clear and suitably dignified. ‘എടുത്തുയർത്തപ്പെട്ടു’ supplies the needed passive sense naturally enough in the paired command. ‘സംഭവിക്കുന്നുവെന്ന്’ is idiomatic Malayalam and retains the Greek present without an unnecessarily marked progressive construction. Placing each note marker directly after its relevant phrase improves readability and anchoring.
  terminology: ‘സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു,’ ‘ഈ മലയോട്,’ ‘ഹൃദയത്തിൽ സംശയിക്കാതെ,’ and ‘വിശ്വസിക്കുകയും’ are appropriate modern-standard Malayalam choices. The generic singular masculine forms are retained without imposing interpretation.
  issues:
  - severity: medium
    issue: ‘പൊങ്ങിപ്പോയി’ for Ἄρθητι
    rationale: This wording means ‘having gone/risen away’ rather than the passive command ‘be lifted up/taken up.’ It weakens both the passive morphology and the concrete removal image.
  - severity: low
    issue: Final result clause over-specifies the Greek
    rationale: ‘അവനുവേണ്ടി അങ്ങനെതന്നെ സംഭവിക്കും’ recasts ἔσται αὐτῷ (‘it will be for him’) as an event happening for his benefit. ‘അവന് അങ്ങനെ സംഭവിക്കും’ is closer while remaining natural.
  - severity: low
    issue: Footnote markers are detached from their referents
    rationale: Marker a should follow the expression for not doubting, and marker b should follow the present-tense belief clause, rather than both appearing at the end of the verse.
