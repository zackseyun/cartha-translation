source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ആരെങ്കിലും ഈ മലയോട്, ‘എടുത്തുയർത്തപ്പെട്ടു കടലിലേക്ക് എറിയപ്പെടുക’ എന്നു പറയുകയും, തന്റെ ഹൃദയത്തിൽ സംശയിക്കാതെ[a] താൻ പറയുന്നത് സംഭവിക്കുന്നുവെന്ന് വിശ്വസിക്കുകയും ചെയ്താൽ,[b] അവന് അങ്ങനെ സംഭവിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സംശയിക്കാതെ’ എന്നതിന് ‘ചാഞ്ചാടാതെ’ എന്നും ‘ഉള്ളിൽ ഭിന്നിച്ചുപോകാതെ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയയ്ക്ക് സംശയത്തോടൊപ്പം ആന്തരിക വിഭജനത്തിന്റെ ആശയവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘താൻ പറയുന്നത് സംഭവിക്കുന്നു’ അല്ലെങ്കിൽ ‘സംഭവിച്ചെത്തുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഭാവിയിലെ ഫലം പറയുന്ന വാക്യത്തിനു മുമ്പ് ഗ്രീക്കിൽ വർത്തമാനകാലരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ ഗൗരവപൂർവമായ ഉറപ്പിക്കൽസൂത്രത്തിന്റെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὃς ἂν εἴπῃ
  choice: ആരെങ്കിലും ... പറയുകയും
  rationale: ἄν സഹിതമുള്ള അനിശ്ചിത ബന്ധവാക്യത്തിന്റെ പൊതുവായ വ്യവസ്ഥാഭാവം മലയാളത്തിലെ ‘ആരെങ്കിലും’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: τῷ ὄρει τούτῳ
  choice: ഈ മലയോട്
  rationale: ὄρος എന്നതിന്റെ സാധാരണ അർഥവും τούτῳ എന്ന ചൂണ്ടുപദത്തിന്റെ ദൃശ്യസാന്നിധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: Ἄρθητι καὶ βλήθητι
  choice: പൊങ്ങിപ്പോയി ... എറിയപ്പെടുക
  rationale: രണ്ട് ആജ്ഞകളുടെയും നിഷ്ക്രിയഭാവം നിലനിർത്തിക്കൊണ്ട്, സ്ഥാനംവിട്ട് ഉയർത്തപ്പെടുകയും കടലിലേക്കു ചാടിക്കപ്പെടുകയും ചെയ്യുന്ന സജീവ ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: തന്റെ ഹൃദയത്തിൽ സംശയിക്കാതെ
  rationale: സന്ദർഭത്തിലെ സംശയം/ചാഞ്ചാട്ടം എന്ന മുഖ്യാർഥം വ്യക്തമാക്കുകയും καρδίαയെ ‘ഹൃദയം’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πιστεύῃ ὅτι ὃ λαλεῖ γίνεται
  choice: താൻ പറയുന്നത് സംഭവിച്ചുകൊണ്ടിരിക്കുന്നുവെന്ന് വിശ്വസിക്കുകയും
  rationale: πιστεύῃയെ ‘വിശ്വസിക്കുക’ എന്നും γίνεταιയുടെ വർത്തമാനകാലരൂപത്തെ പുരോഗമനഭാവത്തോടെയും അവതരിപ്പിക്കുന്നു; ഭാവികാലമാക്കി സമതലപ്പെടുത്തുന്നില്ല.
- source_word: ἔσται αὐτῷ
  choice: അത് അവനുവേണ്ടി അങ്ങനെതന്നെ സംഭവിക്കും
  rationale: ഭാവിയിലെ ഫലം വ്യക്തമാക്കുമ്പോഴും ഗ്രീക്കിലെ തുറന്ന സ്വഭാവം അതിരുകടന്ന് വിശദീകരിക്കാതിരിക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസത്തെയും വിശ്വാസപൂർവമായ വചനത്തെയും കുറിച്ചുള്ള യേശുവിന്റെ പ്രസ്താവനയുടെ സ്വഭാവം
  choice: പിന്നീടുള്ള ഉപദേശപരമായ നിയന്ത്രണങ്ങൾ ചേർക്കാതെ, സംശയമില്ലാത്ത വിശ്വാസത്തോടു ബന്ധിച്ച വ്യവസ്ഥാപരമായ വാഗ്ദാനമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് വെറും അതിശയോക്തിയായി ചുരുക്കുക, അല്ലെങ്കിൽ യാതൊരു നിയന്ത്രണവുമില്ലാത്ത സമ്പൂർണ വാഗ്ദാനമായി വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം ശക്തമായ അതിശയോക്തിദൃശ്യം ഉപയോഗിച്ചാലും അതിനെ വെറും രൂപകമെന്നോ പരിധിയില്ലാത്ത സിദ്ധാന്തസൂത്രമെന്നോ സ്വയം വിശദീകരിക്കുന്നില്ല; അതിനാൽ ഉള്ളിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: αὐτοῦ / αὐτῷ എന്ന ഏകവചന പുൽലിംഗരൂപങ്ങൾ
  choice: ‘തന്റെ’ എന്നും ‘അവനുവേണ്ടി’ എന്നും ഏകവചന പ്രതിനിധിപ്രയോഗം നിലനിർത്തി.
  alternative: ബഹുവചനമോ പൂർണ ലിംഗനിരപേക്ഷ രൂപമോ ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് വ്യാകരണത്തിലെ ഏകവചന പ്രതിനിധിഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു’ എന്നത് ഗൗരവമുള്ള പ്രസ്താവനാസൂത്രം നിലനിർത്തുന്നു. മുഖ്യപാഠത്തിൽ γίνεταιയുടെ വർത്തമാനകാലഭാവം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിരിക്കുന്നു; രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
