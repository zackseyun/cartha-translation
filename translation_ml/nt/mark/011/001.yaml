translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വാക്യത്തിൽ കർത്താവ് ഗ്രീക്കിൽ സർവനാമമായി മാത്രമുണ്ടെങ്കിലും മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘യേശു’ എന്നു വ്യക്തമാക്കി; ചരിത്രവർത്തമാനം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
