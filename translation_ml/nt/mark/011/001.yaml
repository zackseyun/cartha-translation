  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐγγίζουσιν εἰς Ἱεροσόλυμα εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ Ὄρος τῶν Ἐλαιῶν, ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: ml
  text: അവർ യെരൂശലേമിനോട് അടുത്തുവരുമ്പോൾ[a]—ഒലിവുമലയുടെ സമീപത്തുള്ള ബേത്ത്ഫഗെയുടെയും ബേഥാന്യയുടെയും ഭാഗത്ത്—യേശു തന്റെ ശിഷ്യന്മാരിൽ രണ്ടുപേരെ അയയ്ക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന പ്രയോഗങ്ങൾ തുടർച്ചയായി വരുന്നു. ഇതിനെ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘അവർ യെരൂശലേമിനോട്, ബേത്ത്ഫഗെയിലേക്കും ബേഥാന്യയിലേക്കും, ഒലിവുമലയുടെ ദിശയിൽ അടുക്കുമ്പോൾ’ എന്നും വിവർത്തനം ചെയ്യാം; ഈ സ്ഥലപ്രയോഗങ്ങളുടെ കൃത്യമായ ബന്ധം വ്യാഖ്യാനവിഷയമാണ്.
    reason: lexical_alternative
  - marker: b
    text: മാർക്കോസ് ആഖ്യാനത്തിൽ പലപ്പോഴും ചരിത്രവർത്തമാനകാലം ഉപയോഗിക്കുന്നു; അതിനാൽ ‘അയയ്ക്കുന്നു’ എന്നത് ‘അയച്ചു’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: അടുത്തുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല രൂപം മാർക്കോസിന്റെ സജീവമായ ആഖ്യാനശൈലിയുടെ ഭാഗമാണ്; മലയാളത്തിൽ പശ്ചാത്തലമായി തുടരുന്ന സമീപനചലനം സ്വാഭാവികമായി അറിയിക്കാൻ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിനോട്
  rationale: ἐγγίζωയോടൊപ്പം വരുന്ന εἰς ലക്ഷ്യസ്ഥാനത്തോടുള്ള സമീപനം സൂചിപ്പിക്കുന്നു; ‘യെരൂശലേമിനോട് അടുത്തുകൊണ്ടിരിക്കുമ്പോൾ’ സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: ബേത്ത്ഫഗെയിലും ബേഥാന്യയിലും എത്തിയപ്പോൾ
  rationale: ആവർത്തിക്കുന്ന εἰς യാത്രാമധ്യേ എത്തിയ പ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിച്ച്, സ്ഥലബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ഒലിവുമലയ്ക്കരികെയുള്ള
  rationale: πρός ഇവിടെ ദിശയെയോ സമീപസ്ഥിതിയെയോ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ സ്ഥലങ്ങളുടെ ഒലിവുമലയോടുള്ള സമീപബന്ധം നൽകുന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
- source_word: ἀποστέλλει
  choice: അയയ്ക്കുന്നു
  rationale: മാർക്കോസ് ഉപയോഗിക്കുന്ന ചരിത്രവർത്തമാനത്തെ നിലനിർത്തി ആഖ്യാനത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരിൽ രണ്ടുപേരെ
  rationale: ഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയും ഉടമസ്ഥബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പകരുന്നു.
- source_word: Βηθφαγὴ
  choice: ബേത്ത്ഫഗെ
  rationale: സ്ഥലനാമം ഗ്രീക്ക് ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: Βηθανίαν
  choice: ബേഥാന്യ
  rationale: സ്ഥലനാമം മലയാളത്തിലെ വ്യക്തവും പരിചിതവുമായ ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: ഒലിവുമല
  rationale: ഗ്രീക്ക് നാമസമുച്ചയത്തിന്റെ അർത്ഥം വ്യക്തമായി നൽകുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ സ്ഥലനാമരൂപം.
