id: MRK.11.32
reference: Mark 11:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: ml
  text: “എന്നാൽ, ‘മനുഷ്യരിൽനിന്ന്’ എന്നു പറഞ്ഞാലോ[a]?”—അവർ ജനക്കൂട്ടത്തെ ഭയപ്പെട്ടിരുന്നു; കാരണം എല്ലാവരും യോഹന്നാൻ യഥാർഥത്തിൽ ഒരു പ്രവാചകനായിരുന്നു എന്ന് കരുതിയിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യരിൽനിന്നുള്ളത്,” അല്ലെങ്കിൽ കൂടുതൽ വ്യാഖ്യാനപരമായി, “മാനുഷിക ഉറവിടത്തിൽനിന്ന്.”
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക് വാചകം ഇങ്ങനെയും പരിഭാഷപ്പെടുത്താം: “എല്ലാവരും യോഹന്നാനെ തീർച്ചയായും ഒരു പ്രവാചകനായി കണക്കാക്കിയിരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: എന്നാൽ … എന്നു പറഞ്ഞാലോ?
  rationale: അവരുടെ ആലോചനയിലെ മറുവശം സൂചിപ്പിക്കുന്ന adversative-ഉം deliberative subjunctive-ഉം സ്വാഭാവികമായ മലയാള ചോദ്യരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἐξ ἀνθρώπων
  choice: മനുഷ്യരിൽനിന്ന്
  rationale: യോഹന്നാന്റെ സ്നാനത്തിന്റെയോ അധികാരത്തിന്റെയോ ഉറവിടം മനുഷ്യരാണെന്ന അർഥം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ, ഗ്രീക്കിലെ ‘from human beings’ എന്ന രൂപം അടുത്തായി നിലനിർത്തുന്നു.
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: അവർ ജനക്കൂട്ടത്തെ ഭയപ്പെട്ടു
  rationale: സാഹചര്യത്തിൽ തുടരുന്ന ഭയത്തെ സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἅπαντες γὰρ εἶχον
  choice: കാരണം … എല്ലാവരും കരുതിയിരുന്നു
  rationale: γὰρ നൽകുന്ന കാരണബന്ധവും εἶχον എന്നതിന്റെ അഭിപ്രായം പുലർത്തുക എന്ന സന്ദർഭാർഥവും വ്യക്തമാക്കുന്നു.
- source_word: ὄντως ὅτι προφήτης ἦν
  choice: യഥാർഥത്തിൽ ഒരു പ്രവാചകനായിരുന്നു എന്ന്
  rationale: ὄντως എന്ന ഊന്നൽ നിലനിർത്തുകയും, ഈ വിലയിരുത്തൽ ജനങ്ങളുടെ ഉറച്ച ധാരണയായി വാക്യത്തിനുള്ളിൽ തന്നെ തുടരുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സ്നാനത്തിന്റെ ഉറവിടത്തെക്കുറിച്ചുള്ള Ἐξ ἀνθρώπων എന്ന പ്രയോഗം
  choice: മനുഷ്യരിൽനിന്ന്
  alternative: മനുഷ്യരിൽ നിന്നുള്ളത് / മാനുഷിക ഉറവിടത്തിൽനിന്ന്
  rationale: ദൈവിക ഉറവിടത്തിനും മാനുഷിക ഉറവിടത്തിനുമിടയിലെ വിരോധം നിലനിർത്തുന്നു; ‘മാനുഷിക ഉറവിടം’ എന്ന വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർത്ത് അർഥം അതിയായി തുറന്നുപറയുന്നില്ല.
- issue: യോഹന്നാനെക്കുറിച്ചുള്ള ജനങ്ങളുടെ വിലയിരുത്തലിൽ ὄντως എന്നതിന്റെ ബലം
  choice: യോഹന്നാൻ യഥാർഥത്തിൽ ഒരു പ്രവാചകനായിരുന്നു എന്ന് എല്ലാവരും കരുതിയിരുന്നു
  alternative: യോഹന്നാനെ എല്ലാവരും തീർച്ചയായും ഒരു പ്രവാചകനായി കണക്കാക്കിയിരുന്നു
  rationale: യോഹന്നാന്റെ പ്രവാചകസ്ഥാനത്തെക്കുറിച്ചുള്ള ജനങ്ങളുടെ ഉറച്ച ബോധ്യം റിപ്പോർട്ട് ചെയ്യുന്നു; അതിനെ വിവരണകർത്താവിന്റെ സ്വതന്ത്രമായ പുതിയ പ്രഖ്യാപനമാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആന്തരിക ആലോചനയുടെ ചോദ്യം, ജനക്കൂട്ടത്തോടുള്ള ഭയം, യോഹന്നാനെക്കുറിച്ചുള്ള ജനങ്ങളുടെ ഉറച്ച വിലയിരുത്തൽ എന്നിവ സംക്ഷിപ്തമായി നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
