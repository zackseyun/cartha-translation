id: MRK.11.12
reference: Mark 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: ml
  text: പിറ്റേന്ന് അവർ ബേഥാന്യയിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ അവനു വിശന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: '[പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല]'
  rationale: ഇവിടെ Καί ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘പിറ്റേന്ന്’ തന്നെ ആ തുടർച്ച സ്വാഭാവികമായി പ്രകടമാക്കുന്നതിനാൽ ‘പിന്നെ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർക്കുന്നത് അനാവശ്യമായ അർത്ഥഛായ ഉണ്ടാക്കാം.
- source_word: τῇ ἐπαύριον
  choice: പിറ്റേന്ന്
  rationale: അടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന ഈ കാലപ്രയോഗത്തിന് സ്വാഭാവികവും ആധുനികവുമായ മലയാളരൂപം.
- source_word: ἐξελθόντων αὐτῶν
  choice: അവർ ... പുറപ്പെട്ടപ്പോൾ
  rationale: αὐτῶν എന്ന ബഹുവചനം നിലനിർത്തുകയും, പ്രധാനക്രിയയോടു താരതമ്യേന മുൻപോ അതിനോടു ചേർന്നോ നടക്കുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് അബ്സല്യൂട്ടിനെ സ്വാഭാവികമായ കാലവാക്യമായി നൽകുകയും ചെയ്യുന്നു. സന്ദർഭം നിർബന്ധിക്കുന്നതിലധികം കൃത്യമായ കാലക്രമം ചുമത്തുന്നില്ല.
- source_word: ἀπὸ Βηθανίας
  choice: ബേഥാന്യയിൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന സ്ഥലത്തുനിന്നുള്ള നീക്കം നേരിട്ട് നൽകുന്നു; സ്ഥലപ്പേര് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: ἐπείνασεν
  choice: അവനു വിശന്നു
  rationale: πεινάω എന്ന ക്രിയയുടെ അയോറിസ്റ്റ് രൂപം ഇവിടെ വിശപ്പ് അനുഭവപ്പെട്ടതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു. ‘വിശന്നിരുന്നു’ എന്ന നിലാവസ്ഥയേക്കാൾ ക്രിയാത്മകമായ രൂപവും, ‘വിശപ്പുള്ളവനായിത്തീർന്നു’ എന്ന കൃത്രിമമായ വിവർത്തനത്തേക്കാൾ സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ἐπείνασεν എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: പേര് ചേർക്കാതെ ‘അവനു’ എന്നു നൽകി
  alternative: വ്യക്തതയ്ക്കായി ‘യേശുവിനു’ എന്നു ചേർക്കുക
  rationale: ഗ്രീക്കിൽ കർത്താവിന്റെ പേര് ഈ വാക്യത്തിൽ ആവർത്തിക്കുന്നില്ലെങ്കിലും സന്ദർഭത്തിൽ അത് യേശുവാണെന്ന് വ്യക്തമാണ്. ‘അവനു’ എന്നത് മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുകയും യേശുവിന്റെ യഥാർഥ മാനുഷിക വിശപ്പിനെ നേരിട്ട് പ്രസ്താവിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പിറ്റേന്ന്’, ‘പുറപ്പെട്ടപ്പോൾ’, ‘അവനു വിശന്നു’ എന്നീ സാധാരണ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
