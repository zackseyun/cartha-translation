  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: ml
  text: അവർ യെരൂശലേമിലെത്തി. അവൻ ദേവാലയത്തിൽ[a] പ്രവേശിച്ച്, ദേവാലയത്തിൽ വിൽക്കുകയും വാങ്ങുകയും ചെയ്തിരുന്നവരെ പുറത്താക്കാൻ തുടങ്ങി. നാണയം മാറ്റിക്കൊടുക്കുന്നവരുടെ മേശകളും പ്രാവുകളെ വിൽക്കുന്നവരുടെ ഇരിപ്പിടങ്ങളും അവൻ മറിച്ചിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേവാലയാങ്കണം’ അല്ലെങ്കിൽ ‘ദേവാലയപരിസരം’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: എത്തി
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായി നൽകി; സംഭവക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: εἰσελθὼν
  choice: പ്രവേശിച്ച്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള അനുബന്ധപ്രവൃത്തി മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാവിശേഷണരൂപത്തിൽ പ്രകടമാക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത അമിതമായ കാലവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: ദേവാലയത്തിൽ / അവിടെ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യപാഠത്തിൽ പരിചിതമായ ‘ദേവാലയം’ നിലനിർത്തി, കൃത്യമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി; ആവർത്തനം സ്വാഭാവികമാക്കാൻ രണ്ടാം പ്രയോഗം ‘അവിടെ’ എന്നു നൽകി.
- source_word: ἤρξατο ἐκβάλλειν
  choice: പുറത്താക്കാൻ തുടങ്ങി
  rationale: പ്രവൃത്തിയുടെ ആരംഭം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയും ἐκβάλλωയുടെ ശക്തമായ ഭാവവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: വിൽക്കുകയും വാങ്ങുകയും ചെയ്തിരുന്നവരെ
  rationale: രണ്ട് substantival participle-കളുടെയും സമാന്തരതയും നടന്നുകൊണ്ടിരുന്ന പ്രവർത്തനഭാവവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂക്ഷിക്കുന്നു.
- source_word: κολλυβιστῶν
  choice: നാണയം മാറ്റിക്കൊടുക്കുന്നവരുടെ
  rationale: ദേവാലയപരിസരത്തിൽ നാണയവിനിമയം നടത്തിയവരെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി തിരിച്ചറിയാവുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: καθέδρας
  choice: ഇരിപ്പിടങ്ങൾ
  rationale: കസേരയോ പീഠമോ എന്ന് അനാവശ്യമായി പ്രത്യേകീകരിക്കാതെ ഗ്രീക്ക് പദത്തിന്റെ വിശാല അർഥം നിലനിർത്തുന്നു.
- source_word: περιστερὰς
  choice: പ്രാവുകൾ
  rationale: യാഗസന്ദർഭത്തോട് യോജിക്കുന്നതും മലയാളത്തിൽ സ്വാഭാവികവുമായ പൊതുവായ പേര്.
- source_word: κατέστρεψεν
  choice: മറിച്ചിട്ടു
  rationale: മേശകളെയും ഇരിപ്പിടങ്ങളെയും മറിച്ചിടുന്ന ശക്തമായ പ്രവർത്തിയെ സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദേവാലയശുദ്ധീകരണ വിവരണത്തിലെ ἱερόν എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ദേവാലയം’; വിശാലമായ ദേവാലയസമുച്ചയം എന്ന അർഥം അടിക്കുറിപ്പിൽ
  alternative: ‘ദേവാലയാങ്കണം’ അല്ലെങ്കിൽ ‘ദേവാലയപരിസരം’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകുക
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം സൂചിപ്പിക്കുന്ന ναός അല്ല; വിശാലമായ ദേവാലയപ്രദേശമാണ്. പരിചിതവും വായനാസൗകര്യമുള്ളതുമായ ‘ദേവാലയം’ മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുമ്പോൾ അടിക്കുറിപ്പ് തെറ്റായ സ്ഥലധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ രണ്ട് വാക്യങ്ങളിലും കർത്താവ് മാറുന്നതിനാൽ, ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ രണ്ടാം വാക്യത്തിൽ ഗ്രീക്കിൽ അന്തർലീനമായ കർത്താവിനെ ‘യേശു’ എന്നു വ്യക്തമാക്കി. അവസാന ക്രിയയ്ക്ക് ‘അദ്ദേഹം’ ഉപയോഗിച്ച് സ്വാഭാവികമായ മലയാള പ്രവാഹം നിലനിർത്തി.
