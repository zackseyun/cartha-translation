  naturalness: The Malayalam is clear, modern, and appropriately dignified. Replacing “യേശു” with “അവൻ” keeps the flow natural while more closely matching the source. Repeating “ദേവാലയത്തിൽ” for the second occurrence makes the source’s repeated locative explicit and remains idiomatic.
  terminology: “ദേവാലയം” is a suitable main-text rendering of ἱερόν, with the footnote properly clarifying that the broader temple complex rather than only the inner sanctuary is intended. “നാണയം മാറ്റിക്കൊടുക്കുന്നവർ,” “ഇരിപ്പിടങ്ങൾ,” and “പ്രാവുകൾ” are accurate and natural choices.
