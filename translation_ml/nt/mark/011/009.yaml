revisions:
- from: മുമ്പിൽ നടന്നവരും പിന്നാലെ വന്നവരും ഇങ്ങനെ വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു:[a][b] “ഹോശന്നാ! കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ അനുഗൃഹീതൻ!”
  to: മുമ്പിൽ നടന്നവരും പിന്നാലെ അനുഗമിച്ചവരും ഇങ്ങനെ വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു:[a][b] “ഹോശന്നാ! കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ അനുഗ്രഹിക്കപ്പെട്ടവൻ!”
