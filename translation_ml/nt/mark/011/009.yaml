source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: ml
  text: മുമ്പിൽ നടന്നവരും പിന്നാലെ അനുഗമിച്ചവരും ഇങ്ങനെ വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു:[a][b] “ഹോശന്നാ! കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ അനുഗ്രഹിക്കപ്പെട്ടവൻ!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഹോശന്നാ” എന്നത് “രക്ഷിക്കണമേ” അല്ലെങ്കിൽ “ഇപ്പോൾ രക്ഷിക്കണമേ” എന്നതുപോലുള്ള അർഥമുള്ള എബ്രായ/അരമായ ലിറ്റർജിക്കൽ ഘോഷമാണ്; ഇവിടെ അത് സ്തുതിഘോഷമായും പ്രവർത്തിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ ഘോഷണം സങ്കീർത്തനം 118:26-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: മുമ്പിൽ നടന്നവർ
  rationale: യേശുവിനും ഘോഷയാത്രയ്ക്കും മുമ്പിലായി നീങ്ങിക്കൊണ്ടിരുന്ന കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന നാമവാചകമായി ഉപയോഗിച്ച വർത്തമാനകാല കൃദന്തത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἱ ἀκολουθοῦντες
  choice: പിന്നാലെ വന്നവർ
  rationale: മുമ്പിൽ നടന്നവരോടു സമാന്തരമായി, പിന്നിൽ അനുഗമിച്ച കൂട്ടത്തെ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἔκραζον
  choice: വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയയുടെ തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ പരസ്യഘോഷണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: Ὡσαννά
  choice: ഹോശന്നാ
  rationale: എബ്രായ/അരമായ ആരാധനാഘോഷപദത്തിന്റെ ലിപ്യന്തരണം നിലനിർത്തി അതിന്റെ തിരുവെഴുത്തുപരവും ഉത്സവപരവുമായ മുഴക്കം സംരക്ഷിക്കുന്നു; മൂലാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Εὐλογημένος
  choice: അനുഗൃഹീതൻ
  rationale: സങ്കീർത്തനം 118:26-ലെ അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ ഭാവം കാത്തുസൂക്ഷിക്കുന്ന, ആധുനിക മലയാളത്തിൽ മാന്യവും ഗ്രഹിക്കാവുന്നതുമായ പ്രയോഗം.
- source_word: ὁ ἐρχόμενος
  choice: വരുന്നവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ച വർത്തമാനകാല കൃദന്തത്തെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു; വാചകത്തിൽ ഇല്ലാത്ത ‘മശീഹാ’ എന്ന പദവി ചേർക്കുന്നില്ല.
- source_word: ἐν ὀνόματι κυρίου
  choice: കർത്താവിന്റെ നാമത്തിൽ
  rationale: കർത്താവിന്റെ അധികാരത്തിലും പ്രതിനിധിത്വത്തിലും വരുന്നതിനെ സൂചിപ്പിക്കുന്ന തിരുവെഴുത്തിലെ സ്ഥിരപ്രയോഗവും സങ്കീർത്തനപ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന് പദ്ധതിയുടെ സാധാരണ മലയാളപരിഭാഷ; ഉദ്ധരണിസദൃശമായ പ്രയോഗത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമാണ്.
theological_decisions:
- issue: ഘോഷണത്തിലെ മശീഹാപരമായ തിരിച്ചറിയൽ പരിഭാഷയിൽ തുറന്നുപറയണമോ
  choice: “കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ” എന്ന സങ്കീർത്തനസദൃശ വാചകം നിലനിർത്തി ‘മശീഹാ’ അല്ലെങ്കിൽ ‘രാജാവ്’ എന്നു ചേർത്തില്ല.
  alternative: “കർത്താവിന്റെ നാമത്തിൽ വരുന്ന മശീഹാ അനുഗൃഹീതൻ” എന്ന വ്യാഖ്യാനവികാസം.
  rationale: സന്ദർഭത്തിൽ ഈ ഘോഷണത്തിന് മശീഹാപരമായ പ്രാധാന്യമുണ്ടെങ്കിലും ഗ്രീക്ക് വാചകത്തിൽ ഇവിടെ ആ പദവി തുറന്നുപറയുന്നില്ല. അതിനാൽ തിരുവെഴുത്തുപരമായ മുഴക്കവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യാഖ്യാനചേർക്കലില്ലാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പൊതുവായനാശൈലി. ഘോഷത്തിന്റെ തിരുവെഴുത്തുപരമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തി.
