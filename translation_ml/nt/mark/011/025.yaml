source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: ml
  text: നിങ്ങൾ പ്രാർഥിച്ചുകൊണ്ടു നിൽക്കുമ്പോഴെല്ലാം, ആരോടെങ്കിലും നിങ്ങൾക്കു എന്തെങ്കിലും വിരോധമുണ്ടെങ്കിൽ, ക്ഷമിക്കുക; അങ്ങനെ സ്വർഗങ്ങളിൽ ഉള്ള[a] നിങ്ങളുടെ പിതാവും നിങ്ങളുടെ ലംഘനങ്ങൾ[b] ക്ഷമിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘സ്വർഗങ്ങളിൽ’ എന്നത് ബഹുവചനമാണ്. ‘സ്വർഗത്തിലുള്ള നിങ്ങളുടെ പിതാവ്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ലംഘനങ്ങൾ’ എന്നതിന് ‘അതിക്രമങ്ങൾ’ എന്നോ ‘കുറ്റങ്ങൾ’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε προσευχόμενοι
  choice: പ്രാർഥിച്ചുകൊണ്ട് നിൽക്കുമ്പോഴെല്ലാം
  rationale: στήκετε എന്നതിലെ നിൽക്കുന്ന ശരീരഭാവവും പ്രാർഥന അതോടൊപ്പം നടക്കുന്നു എന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀφίετε
  choice: ക്ഷമിക്കുക
  rationale: വ്യക്തികൾ തമ്മിലുള്ള വിരോധത്തിന്റെ പശ്ചാത്തലത്തിൽ ἀφίημι എന്നത് കുറ്റം വിട്ടുകളയുക, ക്ഷമിക്കുക എന്ന അർഥത്തിലാണ്; ഇവിടെ ‘ക്ഷമിക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: ആരോടെങ്കിലും നിങ്ങൾക്ക് എന്തെങ്കിലും വിരോധമുണ്ടെങ്കിൽ
  rationale: τι, τινος എന്നിവയുടെ അനിശ്ചിതവും വ്യാപകവുമായ അർഥം സൂക്ഷിക്കുകയും κατά τινος സൂചിപ്പിക്കുന്ന എതിർപ്പ്/പരാതി മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിൽ വസിക്കുന്ന നിങ്ങളുടെ പിതാവ്
  rationale: οὐρανοῖς എന്ന ബഹുവചനരൂപം ‘സ്വർഗങ്ങളിൽ’ എന്നു നിലനിർത്തുന്നു; ‘വസിക്കുന്ന’ എന്നത് ഗ്രീക്കിലെ സ്ഥാനസൂചന മലയാളത്തിൽ സുഗമമാക്കുന്നു.
- source_word: ἀφῇ
  choice: ക്ഷമിക്കട്ടെ
  rationale: ἵναയ്ക്കു ശേഷമുള്ള aorist subjunctive-ന്റെ ഉദ്ദേശ്യ/ഫലസാധ്യതാഭാവം മലയാളത്തിലെ ‘അങ്ങനെ ... ക്ഷമിക്കട്ടെ’ എന്ന ഘടനയിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: παραπτώματα
  choice: അതിക്രമങ്ങൾ
  rationale: παράπτωμα സൂചിപ്പിക്കുന്ന തെറ്റായ ചുവട്, ലംഘനം, കുറ്റം എന്നീ ആശയങ്ങളിൽ ‘അതിക്രമങ്ങൾ’ ഗൗരവവും ബന്ധപരമായ കുറ്റബോധവും നിലനിർത്തുന്നു; പൊതുവായ ‘പാപങ്ങൾ’ എന്ന പദത്തിലേക്ക് ലയിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: മനുഷ്യർ മറ്റുള്ളവരോട് ക്ഷമിക്കുന്നതും പിതാവ് അവരോട് ക്ഷമിക്കുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ‘ക്ഷമിക്കുക; അങ്ങനെ ... പിതാവും ... ക്ഷമിക്കട്ടെ’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: മറ്റുള്ളവരോടുള്ള ക്ഷമ ദൈവക്ഷമയുടെ തെളിവ് മാത്രമാണെന്നോ ഈ ബന്ധം ദുർബലമായ ഒരു ഫലസൂചന മാത്രമാണെന്നോ വ്യാഖ്യാനിച്ചുള്ള പരാവർത്തനം.
  rationale: ἵνα ... ἀφῇ മനുഷ്യന്റെ ക്ഷമയെയും പിതാവിന്റെ ക്ഷമയെയും യഥാർഥമായി ബന്ധിപ്പിക്കുന്നു. വിശാലമായ ഒരു സിദ്ധാന്തവ്യവസ്ഥ ഉപയോഗിച്ച് ആ പിരിമുറുക്കം നീക്കാതെ വാക്യത്തിൽ തന്നെയുള്ള ബന്ധം വിവർത്തനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രാർഥിച്ചുകൊണ്ട് നിൽക്കുമ്പോഴെല്ലാം’ എന്ന പ്രയോഗം പ്രാർഥനയിലെ നിൽക്കുന്ന ശരീരഭാവം ഒഴിവാക്കുന്നില്ല. മൂലത്തിലെ ബഹുവചനമായ ‘സ്വർഗങ്ങളിൽ’ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
