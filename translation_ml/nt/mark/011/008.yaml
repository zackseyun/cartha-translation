  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: ml
  text: അനേകർ തങ്ങളുടെ മേലങ്കികൾ വഴിയിൽ വിരിച്ചു; മറ്റുള്ളവർ വയലുകളിൽനിന്ന് വെട്ടിയെടുത്ത ഇലക്കൊമ്പുകൾ[a] വിരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൊമ്പുകൾ’; στιβάδας എന്ന ഗ്രീക്ക് പദം വെട്ടിയെടുത്ത ഇലക്കൂട്ടങ്ങളെയോ ഇലകളുള്ള കൊമ്പുകളെയോ പൊതുവായി സൂചിപ്പിക്കുന്നു; പ്രത്യേകമായി ഈന്തപ്പനക്കൊമ്പുകളെ സൂചിപ്പിക്കുന്നില്ല.
