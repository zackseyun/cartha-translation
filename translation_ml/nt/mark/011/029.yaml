id: MRK.11.29
reference: Mark 11:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരോടു പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു ഒരു ചോദ്യം ചോദിക്കും.[a] എനിക്കു ഉത്തരം പറയുക; അപ്പോൾ ഞാൻ ഏത് അധികാരത്താൽ ഈ കാര്യങ്ങൾ ചെയ്യുന്നു എന്നു നിങ്ങളോടു പറയും.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു കാര്യം”; അക്ഷരാർഥത്തിൽ “ഒരു വാക്ക്.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ഈ വാക്യഭാഗങ്ങൾ നേരിട്ട് ‘ഉത്തരം പറയുക, ഞാനും നിങ്ങളോടു പറയും’ എന്നിങ്ങനെ ബന്ധിപ്പിച്ചിരിക്കുന്നു.
    reason: structural_alternative
lexical_decisions:
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ നേതാക്കളുടെ ചോദ്യത്തോടുള്ള യേശുവിന്റെ പ്രതികരണത്തിലേക്കുള്ള മൃദുവായ വിവരണപരിവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ അടയാളപ്പെടുത്തുന്നു.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: മലയാളത്തിലെ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം.
- source_word: εἶπεν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: പരോക്ഷ കർമത്തോടുകൂടിയ λέγω എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ വിവർത്തനം.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: ഞാനും നിങ്ങളോട് ... ചോദിക്കാം
  rationale: ഭാവിക്രിയ ഇവിടെ യേശു ഉന്നയിക്കാൻ പോകുന്ന പ്രതിചോദ്യത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ പ്രതികരണഭാവം ‘ഞാനും’ വ്യക്തമാക്കുന്നു, ‘ചോദിക്കാം’ ആ പ്രസംഗസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἕνα λόγον
  choice: ഒരു ചോദ്യം
  rationale: λόγος അക്ഷരാർഥത്തിൽ ‘വാക്ക്’ എന്നായാലും, ഉടൻ ഉത്തരം ആവശ്യപ്പെടുന്ന ഈ സന്ദർഭത്തിൽ ഒരു ചോദ്യം അഥവാ വിഷയം എന്നാണ് അർഥം.
- source_word: ἀποκρίθητέ μοι
  choice: എനിക്ക് ഉത്തരം പറയുക
  rationale: ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്ന വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളം.
- source_word: ἐρῶ ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയാം
  rationale: വിവരം വെളിപ്പെടുത്തുമെന്ന വാഗ്ദാനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: എന്ത് അധികാരത്താലാണ്
  rationale: പ്രവൃത്തികളുടെ അടിസ്ഥാനം, അവകാശം, അംഗീകാരം എന്നിവയെ ചോദ്യം ചെയ്യുന്ന പ്രയോഗത്തിന്റെ ബലം നിലനിർത്തുന്നു.
- source_word: ταῦτα ποιῶ
  choice: ഞാൻ ഇതൊക്കെ ചെയ്യുന്നത്
  rationale: വിവാദവിഷയമായ യേശുവിന്റെ ഇപ്പോഴത്തെ പ്രവൃത്തികളെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐξουσία എന്നതിന്റെ സന്ദർഭാർഥം
  choice: അധികാരം
  alternative: അവകാശം; ശക്തി
  rationale: ആലയാധികാരികളുമായുള്ള തർക്കത്തിൽ വിഷയം വെറും കഴിവല്ല, യേശുവിന്റെ പ്രവൃത്തികൾക്കുള്ള സാധുവായ അധികാരമാണ്; അതിനാൽ ‘അധികാരം’ സ്ഥാപനപരവും ദൈവശാസ്ത്രപരവുമായ വിശാലത നിലനിർത്തുന്നു.
- issue: καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ഫലം ‘എന്നാൽ’കൊണ്ട് സൂചിപ്പിച്ചു
  alternative: ‘എനിക്ക് ഉത്തരം പറയുക; ഞാനും നിങ്ങളോടു പറയാം’ എന്ന സമാന്തര ബന്ധം
  rationale: ഗ്രീക്കിലെ καὶ പദങ്ങൾ വ്യവസ്ഥയെ ഔപചാരികമായി രേഖപ്പെടുത്തുന്നില്ലെങ്കിലും, സന്ദർഭത്തിൽ യേശു അവരുടെ മറുപടിക്ക് പിന്നാലെ തന്റെ അധികാരത്തെക്കുറിച്ച് പറയുമെന്ന ബന്ധം വ്യക്തമാണ്. ‘എന്നാൽ’ ഈ പ്രായോഗിക ബന്ധം വ്യക്തമാക്കുന്നു; കർശനമായ ‘എങ്കിൽ’ ചേർത്ത് അർഥം അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ മാന്യതയുള്ള മലയാളം. ഗ്രീക്കിലെ ചെറുവാക്യങ്ങളുടെ നേരിട്ടുള്ള സംഭാഷണഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധം ഉപയോഗിച്ചു; അടിക്കുറിപ്പുകളുടെ [a], [b] ചിഹ്നങ്ങൾ മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
