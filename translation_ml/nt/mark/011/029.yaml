revisions:
- from: 'അപ്പോൾ യേശു അവരോടു പറഞ്ഞു: “ഞാനും നിങ്ങളോട് ഒരു ചോദ്യം ചോദിക്കാം.[a] എനിക്ക് ഉത്തരം പറയുക; എന്നാൽ എന്ത് അധികാരത്താലാണ് ഞാൻ ഇതൊക്കെ ചെയ്യുന്നതെന്ന് ഞാൻ നിങ്ങളോടു പറയാം.[b]”'
  to: 'എന്നാൽ യേശു അവരോടു പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു ഒരു ചോദ്യം ചോദിക്കും.[a] എനിക്കു ഉത്തരം പറയുക; അപ്പോൾ ഞാൻ ഏത് അധികാരത്താൽ ഈ കാര്യങ്ങൾ ചെയ്യുന്നു എന്നു നിങ്ങളോടു പറയും.[b]”'
  rationale: The revision uses an unambiguous future for Jesus’ counter-question, removes an added reciprocal emphasis, and adopts standard formal-neutral Malayalam for the disputed actions. “അപ്പോൾ” expresses the contextually implicit consequence of their answering without imposing a formal conditional construction absent from the Greek. The second footnote is clarified to describe the paratactic Greek structure without suggesting that the authority clause is absent.
