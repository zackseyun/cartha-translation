id: MRK.11.5
reference: Mark 11:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καί τινες τῶν ἐκεῖ ἑστηκότων ἔλεγον αὐτοῖς· Τί ποιεῖτε λύοντες τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: ml
  text: 'അവിടെ നിന്നിരുന്നവരിൽ ചിലർ അവരോട് ഇങ്ങനെ പറയുകയായിരുന്നു: “ആ കഴുതക്കുട്ടിയെ[a] അഴിച്ചുകൊണ്ട് നിങ്ങൾ എന്താണ് ചെയ്യുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് പദമായ πῶλος പൊതുവായി ഒരു ഇളം മൃഗത്തെ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ അത് ഒരു കഴുതക്കുട്ടിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες
  choice: ചിലർ
  rationale: അവിടെ ഉണ്ടായിരുന്നവരിൽ വ്യക്തമാക്കാത്ത ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന അനിശ്ചിത ബഹുവചനം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: അവിടെ നിന്നിരുന്നവരിൽ
  rationale: ἐκεῖ എന്ന സ്ഥലസൂചനയും substantival participle നൽകുന്ന ‘അവിടെ നിന്നിരുന്നവർ’ എന്ന അർഥവും നേരായ, സ്വാഭാവികമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ἔλεγον
  choice: ഇങ്ങനെ പറയുകയായിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ പുരോഗമന/പശ്ചാത്തലഭാവം നിലനിർത്തുന്നു; നിർബന്ധമായ ആവർത്തനം സൂചിപ്പിക്കാതെ സംസാരപ്രവൃത്തിയെ അവതരിപ്പിക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: അഭിസംബോധന ചെയ്യപ്പെട്ട ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്ന ബഹുവചന ദത്തിവിഭക്തിയെ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: Τί ποιεῖτε
  choice: നിങ്ങൾ എന്താണ് ചെയ്യുന്നത്?
  rationale: ‘എന്തിന്’ എന്ന കാരണചോദ്യം ചേർക്കാതെ, അവരുടെ ഇപ്പോഴത്തെ പ്രവൃത്തിയെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യം നിലനിർത്തുന്നു.
- source_word: λύοντες
  choice: അഴിച്ചുകൊണ്ട്
  rationale: കെട്ടിയിട്ട മൃഗത്തിന്റെ കെട്ട് അഴിക്കുക എന്ന സന്ദർഭോചിത അർഥവും വർത്തമാന പങ്കാളിക്രിയയുടെ സമകാലികബന്ധവും പകർത്തുന്നു.
- source_word: τὸν πῶλον
  choice: ആ കഴുതക്കുട്ടിയെ[a]
  rationale: πῶλος പൊതുവായി ഇളം മൃഗത്തെ സൂചിപ്പിക്കാമെങ്കിലും ഈ സന്ദർഭത്തിൽ കഴുതക്കുട്ടിയെയാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം ഉപയോഗിച്ച് ഗ്രീക്കിലെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇങ്ങനെ പറയുകയായിരുന്നു’ ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; ചോദ്യത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവവും സംരക്ഷിച്ചിരിക്കുന്നു.
