translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. സ്ഥലസൂചനയിലെ ഗ്രീക്ക് വാക്യഘടനാപരമായ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യത നിലനിർത്തുകയും ചെയ്തു.
