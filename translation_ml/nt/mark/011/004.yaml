source:
  edition: SBLGNT
  text: ⸂καὶ ἀπῆλθον⸃ καὶ εὗρον πῶλον δεδεμένον ⸀πρὸς θύραν ἔξω ἐπὶ τοῦ ἀμφόδου, καὶ λύουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/004.yaml
  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: ml
  text: അവർ അവിടെനിന്നു പോയി, തെരുവിൽ ഒരു വാതിലിനരികെ പുറത്തു കെട്ടിയിട്ടിരുന്ന ഒരു ഇളം മൃഗത്തെ കണ്ടെത്തി[a]. അവർ അതിനെ അഴിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തെരുവിനു പുറത്തുള്ള ഒരു വാതിലിനരികെ.” ഗ്രീക്ക് പദപ്രയോഗത്തിൽ സ്ഥലബന്ധത്തിന് അല്പം വ്യത്യസ്തമായ ഊന്നൽ നൽകാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: അവിടെനിന്നു പോയി
  rationale: യേശു നിർദേശം നൽകിയ സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലിന്റെ ദിശാസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὗρον
  choice: കണ്ടെത്തി
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ εὑρίσκω എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: πῶλον
  choice: കഴുതക്കുട്ടി
  rationale: πῶλος പൊതുവേ ഒരു ഇളം വാഹനമൃഗത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ സംഭവത്തിന്റെ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് കഴുതക്കുട്ടിയെയാണ്; ആധുനിക മലയാളത്തിൽ ഇതാണ് ഏറ്റവും വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: δεδεμένον
  choice: കെട്ടിയിട്ടിരുന്ന
  rationale: പെർഫെക്റ്റ് പാസീവ് രൂപം സൂചിപ്പിക്കുന്ന, നേരത്തേ കെട്ടിയിട്ട് അങ്ങനെതന്നെ നിലനിന്നിരുന്ന അവസ്ഥ പ്രകടമാക്കുന്നു.
- source_word: πρὸς θύραν
  choice: ഒരു വാതിലിനരികെ
  rationale: πρός ഇവിടെ സാമീപ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘വാതിലിനരികെ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἔξω
  choice: പുറത്തുള്ള
  rationale: അകത്തല്ല, പുറത്താണ് മൃഗം കെട്ടിയിരുന്നതെന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: തെരുവിൽ
  rationale: ἄμφοδον തെരുവ്, ഇടവഴി, അല്ലെങ്കിൽ തുറന്ന പൊതുവഴി എന്ന ആശയം നൽകുന്നു; ‘തെരുവിൽ’ വായനാസൗകര്യമുള്ള തുല്യമാണ്.
- source_word: λύουσιν αὐτόν
  choice: അവർ അതിനെ അഴിച്ചു
  rationale: ചരിത്രവർത്തമാനകാലമായ λύουσιν മലയാള ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ഭൂതകാലത്തിൽ നൽകുന്നു; കെട്ട് അഴിക്കുന്ന പ്രവൃത്തിക്ക് ‘അഴിച്ചു’ യോജിക്കുന്നു.
