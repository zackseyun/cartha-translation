id: MRK.11.14
reference: Mark 11:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: ml
  text: 'അവൻ അതിനോടു പ്രതികരിച്ച് പറഞ്ഞു: “ഇനി ഒരിക്കലും ആരും നിന്നിൽനിന്ന് ഫലം തിന്നാതിരിക്കട്ടെ.” അവന്റെ ശിഷ്യന്മാർ ഇതു കേട്ടുകൊണ്ടിരുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കേട്ടുകൊണ്ടിരുന്നു” എന്നതിനു “കേട്ടു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: പ്രതികരിച്ച്
  rationale: മുമ്പ് ആരും സംസാരിച്ചതായി രേഖപ്പെടുത്തിയിട്ടില്ലെങ്കിലും, ഗ്രീക്കിലെ സാധാരണ ആഖ്യാനശൈലിയായ ‘ഉത്തരം പറഞ്ഞ്/പ്രതികരിച്ച്’ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: αὐτῇ
  choice: അതിനോടു
  rationale: ഗ്രീക്കിൽ ‘അത്തിവൃക്ഷം’ വ്യാകരണപരമായി സ്ത്രീലിംഗമാണെങ്കിലും മലയാളത്തിൽ വൃക്ഷത്തെ സ്വാഭാവികമായി നപുംസകലിംഗത്തിൽ പരാമർശിക്കുന്നു.
- source_word: Μηκέτι ... εἰς τὸν αἰῶνα
  choice: ഇനി ഒരിക്കലും
  rationale: ‘ഇനി മേലാൽ’ എന്ന ആശയവും ‘യുഗത്തോളം/എന്നേക്കും’ എന്ന ശക്തമായ കാലവ്യാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടമാക്കുന്നു.
- source_word: ἐκ σοῦ
  choice: നിന്നിൽനിന്ന്
  rationale: വൃക്ഷത്തോടുള്ള രണ്ടാംപുരുഷ നേരിട്ടുള്ള അഭിസംബോധനയുടെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: μηδεὶς
  choice: ആരും ... ഇല്ലാതിരിക്കട്ടെ
  rationale: നിഷേധാത്മക അനിശ്ചിത കർത്താവിനെയും ആശംസാ/ശാപവാക്യത്തിന്റെ ഘടനയെയും വ്യക്തമായി നൽകുന്നു.
- source_word: καρπὸν
  choice: ഫലം
  rationale: ഏകവചനം ഇവിടെ പൊതുവായ അർഥത്തിലാണ്; മലയാളത്തിൽ ‘ഫലം’ സ്വാഭാവികമാണ്.
- source_word: φάγοι
  choice: തിന്നാതിരിക്കട്ടെ
  rationale: അയോറിസ്റ്റ് ഒപ്റ്റേറ്റീവിന്റെ ആശംസാത്മകമോ ശാപപ്രഖ്യാപനപരമോ ആയ ഭാവം ഭാവികാല പ്രവചനമാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἤκουον
  choice: കേട്ടുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റിന്റെ തുടരുന്ന പ്രവർത്തനഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘ശ്രദ്ധിച്ചുകേൾക്കുകയായിരുന്നു’ എന്നും മനസ്സിലാക്കാം.
- source_word: μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: സ്വാഭാവികവും വ്യക്തവുമായ മലയാള ഉടമസ്ഥപ്രയോഗം.
theological_decisions:
- issue: അത്തിവൃക്ഷത്തോടുള്ള യേശുവിന്റെ വാക്കിന്റെ സ്വഭാവം
  choice: “ആരും ... തിന്നാതിരിക്കട്ടെ” എന്ന ശാപപ്രഖ്യാപനപരമായ ആശംസയായി പരിഭാഷപ്പെടുത്തി.
  alternative: “ആരും ഇനി ഒരിക്കലും നിന്നിൽനിന്ന് ഫലം തിന്നുകയില്ല” എന്ന ഭാവികാല പ്രവചനം.
  rationale: φάγοι എന്ന ഒപ്റ്റേറ്റീവ് ഒരു ലളിതമായ ഭാവികാല സൂചനയല്ല; ആഗ്രഹം/ശാപപ്രഖ്യാപനം സൂചിപ്പിക്കുന്നതിനാൽ ആ ഭാവം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ അല്പം അസാധാരണമായ ‘പ്രതികരിച്ച് പറഞ്ഞു’ എന്ന പ്രയോഗം മിനുക്കിമാറ്റാതെ സൂക്ഷിച്ചു; എന്നാൽ അനാവശ്യമായ അക്ഷരാർഥഭാരം ഒഴിവാക്കി.
