source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: ml
  text: അവൻ യെരൂശലേമിൽ എത്തി ദേവാലയപരിസരത്തിൽ പ്രവേശിച്ചു.[a] അവിടെയുള്ളതെല്ലാം ചുറ്റും നോക്കിയശേഷം, നേരം ഇതിനകം വൈകിയിരുന്നതിനാൽ,[b] പന്ത്രണ്ടുപേരോടൊപ്പം[c] ബേഥാന്യയിലേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദേവാലയം’ അല്ലെങ്കിൽ ‘ദേവാലയസമുച്ചയം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, വിശാലമായ ദേവാലയപരിസരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘നേരം ഇതിനകം വൈകിയിരിക്കെ’ അല്ലെങ്കിൽ ‘പകൽ ഇതിനകം ഏറെ വൈകിയതിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, യേശുവിന്റെ പന്ത്രണ്ട് ശിഷ്യന്മാർ.
    reason: referent_clarification
lexical_decisions:
- source_word: εἰσῆλθεν εἰς Ἱεροσόλυμα εἰς τὸ ἱερόν
  choice: യെരൂശലേമിൽ എത്തി ദേവാലയാങ്കണത്തിൽ പ്രവേശിച്ചു
  rationale: ആവർത്തിക്കുന്ന εἰς ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ രണ്ടു ബന്ധപ്പെട്ട ചലനങ്ങളായി അവതരിപ്പിക്കുന്നു. ἱερόν അകത്തെ വിശുദ്ധമന്ദിരമായ ναός അല്ല, വിശാലമായ ദേവാലയസമുച്ചയമാണ്; അതിനാൽ ‘ദേവാലയാങ്കണം’ സ്ഥലബോധം വ്യക്തമാക്കുന്നു.
- source_word: περιβλεψάμενος πάντα
  choice: അവിടെയുള്ളതെല്ലാം ചുറ്റും നോക്കിയശേഷം
  rationale: περιβλέπομαι സൂചിപ്പിക്കുന്ന ചുറ്റുമുള്ള നിരീക്ഷണവും, aorist participle നൽകുന്ന തുടർക്രമവും സ്വാഭാവികമായി നിലനിർത്തുന്നു. ‘അവിടെയുള്ള’ എന്നത് മലയാളത്തിലെ വ്യക്തതയ്ക്കായി സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: നേരം ഇതിനകം വൈകിയിരുന്നതിനാൽ
  rationale: Genitive absolute നൽകുന്ന കാലപരവും സാഹചര്യപരവും ആയ, ഇവിടെ പുറപ്പെടലിന്റെ കാരണമായും കേൾക്കാവുന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐξῆλθεν εἰς Βηθανίαν
  choice: ബേഥാന്യയിലേക്കു പുറപ്പെട്ടു
  rationale: ἐξέρχομαι എന്നതിലെ പുറത്തേക്കുള്ള ചലനവും ലക്ഷ്യസ്ഥാനമായ ബേഥാന്യയും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: μετὰ τῶν δώδεκα
  choice: പന്ത്രണ്ടുപേരോടൊപ്പം
  rationale: ഗ്രീക്കിലെ സംഖ്യാവാചക പ്രയോഗം ഔപചാരിക പദവിയായി മാറ്റാതെ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: τὸ ἱερόν എന്നതിന്റെ സ്ഥലസൂചന
  choice: ദേവാലയാങ്കണം
  alternative: ദേവാലയം / ദേവാലയസമുച്ചയം
  rationale: ἱερόν വിശാലമായ ദേവാലയപരിസരത്തെ സൂചിപ്പിക്കുന്നു; അകത്തെ വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കുന്ന ναός എന്ന പദവുമായി കലരാതിരിക്കാൻ ‘ദേവാലയാങ്കണം’ തിരഞ്ഞെടുത്തു.
- issue: οἱ δώδεκα എന്ന കൂട്ടത്തിന്റെ അവതരണം
  choice: പന്ത്രണ്ടുപേർ
  alternative: പന്ത്രണ്ട് ശിഷ്യന്മാർ / പന്ത്രണ്ട് അപ്പൊസ്തലന്മാർ
  rationale: മൂലപാഠം ഇവിടെ ‘പന്ത്രണ്ട്’ എന്നു മാത്രമാണ് പറയുന്നത്. അവരെ ശിഷ്യന്മാരോ അപ്പൊസ്തലന്മാരോ എന്നു മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുന്നത് അർത്ഥവ്യാഖ്യാനം ചേർക്കും; അതിനാൽ വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
- issue: ὀψὲ ἤδη οὔσης τῆς ὥρας എന്ന ഘടനയുടെ ബന്ധം
  choice: നേരം ഇതിനകം വൈകിയിരുന്നതിനാൽ
  alternative: നേരം ഇതിനകം വൈകിയിരിക്കെ / പകൽ ഏറെ വൈകിയതിനാൽ
  rationale: ഘടന സമയസാഹചര്യം നൽകുന്നു; സന്ദർഭത്തിൽ അത് പുറപ്പെടാനുള്ള കാരണമായും പ്രവർത്തിക്കുന്നു. മലയാളത്തിലെ ‘-തിനാൽ’ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു, എന്നാൽ അടിക്കുറിപ്പിൽ കാലസാഹചര്യപരമായ മറ്റൊരു വായനയും സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദേവാലയാങ്കണം’ സാധാരണ വായനക്കാരന് സ്ഥലവ്യത്യാസം മനസ്സിലാക്കാൻ സഹായിക്കുന്നു; വാക്യം അതിയായി സംസ്കൃതവൽക്കരിക്കാതെ മൂലത്തിലെ പ്രവർത്തനക്രമം നിലനിർത്തുന്നു.
