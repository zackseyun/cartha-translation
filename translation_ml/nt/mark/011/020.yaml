source:
  edition: SBLGNT
  text: Καὶ ⸂παραπορευόμενοι πρωῒ⸃ εἶδον τὴν συκῆν ἐξηραμμένην ἐκ ῥιζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: ml
  text: അവർ അതിരാവിലെ കടന്നുപോകുമ്പോൾ, അത്തിവൃക്ഷം വേരുമുതൽ ഉണങ്ങിപ്പോയതായി കണ്ടു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വേരുകളിൽനിന്ന് ഉണങ്ങിപ്പോയതായി.’
    reason: ἐκ ῥιζῶν എന്ന പ്രയോഗം ‘വേരുമുതൽ’ എന്നും കൂടുതൽ പദാനുപദമായി ‘വേരുകളിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അതിരാവിലെ’ എന്ന വാക്കില്ല.
    reason: πρωῒ എന്ന വാക്ക് SBLGNT-യിൽ പാഠഭേദസൂചനാ ബ്രാക്കറ്റുകൾക്കുള്ളിലാണ്.
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: അവർ അതുവഴി കടന്നുപോകുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം മുഖ്യക്രിയയോടൊപ്പം നടക്കുന്ന പശ്ചാത്തലപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. ‘കടന്നുപോകുമ്പോൾ’ ആ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ വഴിയെ സൂചിപ്പിക്കാൻ ‘അതുവഴി’ ചേർത്തിരിക്കുന്നു.
- source_word: πρωῒ
  choice: അതിരാവിലെ
  rationale: പ്രഭാതത്തിന്റെ ആദ്യസമയത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ തുല്യപ്രയോഗം.
- source_word: εἶδον
  choice: കണ്ടു
  rationale: കാഴ്ചയിലൂടെ ഗ്രഹിച്ചതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ലളിതമായ ഭൂതകാലപ്രയോഗം; ‘ശ്രദ്ധിച്ചു’ എന്നതുപോലുള്ള അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: συκῆν
  choice: അത്തിവൃക്ഷം
  rationale: കഥാസന്ദർഭത്തിലെ fig tree-ന് സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: ἐξηραμμένην
  choice: ഉണങ്ങിപ്പോയിരിക്കുന്നതായി
  rationale: പൂർണ്ണ കർമണി കൃദന്തം മുൻപ് സംഭവിച്ച ഉണങ്ങലിന്റെ ഇപ്പോഴുള്ള ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ഈ രൂപം ആ ഫലാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ ῥιζῶν
  choice: വേരുമുതൽ
  rationale: ഉണങ്ങൽ വേരുകളിൽനിന്ന് ആരംഭിച്ചതോ വേരുകളോളം വ്യാപിച്ചതോ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക പരിധി നിലനിർത്തുന്നു; ദിശയെ അനാവശ്യമായി കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ പശ്ചാത്തല കൃദന്തവും അത്തിവൃക്ഷത്തിന്റെ ഫലാവസ്ഥയും സംരക്ഷിച്ചിട്ടുണ്ട്. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നം സമയപ്രയോഗത്തിനു പിന്നാലെയാണെങ്കിലും അടിക്കുറിപ്പ് ἐκ ῥιζῶν എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ബന്ധപ്പെട്ട വാക്യഭാഗത്തോടാണ് ചിഹ്നം ചേർത്തത്.
