id: MRK.11.18
reference: Mark 11:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: ml
  text: മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും ഇതു കേട്ടു. അവർ അവനെ എങ്ങനെ നശിപ്പിക്കാമെന്ന് അന്വേഷിച്ചുകൊണ്ടിരുന്നു[a]. കാരണം, അവർ അവനെ ഭയപ്പെട്ടിരുന്നു; ജനക്കൂട്ടം മുഴുവനും അവന്റെ ഉപദേശത്തിൽ വിസ്മയഭരിതരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ എങ്ങനെ കൊല്ലാമെന്ന്” അല്ലെങ്കിൽ “അവനെ എങ്ങനെ വധിക്കാമെന്ന്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് പൊതുവായി “നശിപ്പിക്കുക” എന്നും അർത്ഥമാകാം; എന്നാൽ ഇവിടെ സന്ദർഭം വധോദ്ദേശ്യം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: ഇതു കേട്ടു
  rationale: കർമം ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും, മുൻസന്ദർഭത്തിലെ യേശുവിന്റെ പ്രവൃത്തികളെയും വാക്കുകളെയും സൂചിപ്പിക്കുന്ന ‘ഇതു’ മലയാളത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു; ഉള്ളടക്കം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: യെരൂശലേമിലെ പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും വ്യക്തവുമായ മലയാളപ്രയോഗം; ഒന്നിലധികം മഹാപുരോഹിതന്മാർ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷങ്ങളിലെ യഹൂദ നിയമപണ്ഡിതവർഗത്തിനുള്ള സ്ഥാപിതമായ മലയാളപദം; ‘നിയമോപദേഷ്ടാക്കൾ’ എന്നതിനെക്കാൾ ഗ്രീക്ക് പദത്തിന്റെ സാമൂഹിക-പണ്ഡിതപരമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἐζήτουν
  choice: അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ തുടരുന്ന ശ്രമമോ ആലോചനയോ പ്രകടമാക്കുന്നു.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: അവർ ലക്ഷ്യം നടപ്പാക്കാനുള്ള മാർഗം അന്വേഷിച്ചിരുന്നുവെന്ന ആലോചനാത്മക ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀπολέσωσιν
  choice: നശിപ്പിക്കാമെന്ന്
  rationale: ἀπόλλυμι എന്ന പദത്തിന്റെ വിശാലമായ ‘നശിപ്പിക്കുക’ എന്ന അർത്ഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ വധോദ്ദേശ്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐφοβοῦντο
  choice: ഭയപ്പെട്ടിരുന്നു
  rationale: അവരിൽ തുടരുന്ന ഭയാവസ്ഥയെ അപൂർണ ഭൂതകാലത്തിന് യോജിച്ച രീതിയിൽ പ്രകടമാക്കുന്നു.
- source_word: πᾶς ὁ ὄχλος
  choice: ജനക്കൂട്ടം മുഴുവനും
  rationale: കൂട്ടത്തെ സമഗ്രമായി ഊന്നിപ്പറയുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ἐξεπλήσσετο
  choice: വിസ്മയിച്ചുപോയിരുന്നു
  rationale: ശക്തവും തുടരുന്നതുമായ അത്ഭുതപ്രതികരണം സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: അവന്റെ ഉപദേശത്തിൽ
  rationale: അവരുടെ വിസ്മയത്തിന്റെ കാരണമോ ആധാരമോ യേശുവിന്റെ ഉപദേശമായിരുന്നുവെന്ന ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀπολέσωσιν എന്നതിലെ നേതാക്കളുടെ ഉദ്ദേശ്യത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘അവനെ ... നശിപ്പിക്കാമെന്ന്’
  alternative: ‘അവനെ എങ്ങനെ കൊല്ലാമെന്ന്’ / ‘അവനെ എങ്ങനെ വധിക്കാമെന്ന്’
  rationale: സന്ദർഭം വധോദ്ദേശ്യം ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘നശിപ്പിക്കുക’ എന്ന വിശാല അർത്ഥവുമുണ്ട്. അതിനാൽ മുഖ്യപാഠം പദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുകയും അടിക്കുറിപ്പ് സന്ദർഭസൂചന അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘മുഖ്യപുരോഹിതന്മാർ’, ‘ശാസ്ത്രിമാർ’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അപൂർണ ഭൂതകാലങ്ങളുടെ തുടർച്ച ‘അന്വേഷിച്ചുകൊണ്ടിരുന്നു’, ‘ഭയപ്പെട്ടിരുന്നു’, ‘വിസ്മയിച്ചുപോയിരുന്നു’ എന്നിവയിലൂടെ അറിയിച്ചു.
