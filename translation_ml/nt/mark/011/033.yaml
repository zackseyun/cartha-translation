id: MRK.11.33
reference: Mark 11:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: ml
  text: 'അവർ യേശുവിനോടു മറുപടി പറഞ്ഞു: “ഞങ്ങൾക്ക് അറിയില്ല.” യേശു അവരോടു പറഞ്ഞു: “ഞാൻ ഏത് അധികാരത്താലാണ് ഇവ ചെയ്യുന്നതെന്ന് ഞാനും നിങ്ങളോടു പറയുന്നില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: മറുപടിയായി
  rationale: അവരുടെ പ്രതികരണത്തെ മുഖ്യക്രിയയോടു ബന്ധിപ്പിക്കുന്ന ഗ്രീക്ക് കൃദന്തരൂപത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγουσιν / λέγει / λέγω
  choice: പറഞ്ഞു / പറയുന്നില്ല
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനമാണെങ്കിലും, മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലം ആദ്യ രണ്ടു പ്രയോഗങ്ങളിലും ഉപയോഗിച്ചു; പരോക്ഷചോദ്യത്തിനു മുമ്പുള്ള അവസാന പ്രയോഗം ‘പറയുക’ എന്നുതന്നെ നൽകി.
- source_word: Οὐκ οἴδαμεν
  choice: ഞങ്ങൾക്ക് അറിയില്ല
  rationale: ഇപ്പോഴുള്ള അറിവില്ലായ്മ സൂചിപ്പിക്കുന്ന നിഷേധരൂപം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: Οὐδὲ ἐγὼ
  choice: ഞാനും ... പറയുന്നില്ല
  rationale: അവരുടെ നിഷേധത്തിന് യേശു നൽകുന്ന സമാന്തര നിഷേധപ്രതികരണം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു; ‘എങ്കിൽ’ സന്ദർഭത്തിലെ പ്രതികരണബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ഏത് അധികാരത്താൽ
  rationale: പ്രവൃത്തികളുടെ അധികാരപരമായ അടിസ്ഥാനം അഥവാ അവകാശം സൂചിപ്പിക്കുന്ന ἐν-പ്രയോഗത്തിന് മലയാളത്തിൽ യോജിച്ച ഔപചാരിക രൂപം.
- source_word: ταῦτα
  choice: ഇതെല്ലാം
  rationale: യേശുവിന്റെ സമീപകാല പ്രവൃത്തികളെയും ഉപദേശത്തെയും കൂട്ടമായി സൂചിപ്പിക്കുന്ന നപുംസക ബഹുവചനത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ποιῶ
  choice: ഞാൻ ... ചെയ്യുന്നു
  rationale: ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ അർഥവും തുടരുന്ന പ്രവർത്തനസൂചനയും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശു അധികാരത്തിന്റെ ഉറവിടം വെളിപ്പെടുത്താതിരിക്കുന്നത്
  choice: ‘ഞാനും നിങ്ങളോടു പറയുന്നില്ല’ എന്ന നിഷേധസമാന്തര്യം നേരിട്ട് നിലനിർത്തി
  alternative: യേശു പറയാൻ വിസമ്മതിച്ചു എന്ന വ്യാഖ്യാനാത്മക വികസനം
  rationale: മൂലപാഠം കാരണം വിശദീകരിക്കാതെ അവരുടെ മറുപടിയോടു സമാന്തരമായ നിഷേധം മാത്രം നൽകുന്നു; അതിനാൽ ഉദ്ദേശ്യം വ്യാഖ്യാനിച്ച് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം അക്ഷരാർഥത്തിൽ പകർത്താതെ സ്വാഭാവിക മലയാള ആഖ്യാനഭൂതകാലമാക്കി; അവസാനത്തെ പരോക്ഷചോദ്യത്തിൽ വർത്തമാനകാലം നിലനിർത്തി.
