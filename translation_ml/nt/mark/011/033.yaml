revisions:
- from: 'അവർ യേശുവിനോട് മറുപടിയായി പറഞ്ഞു: “ഞങ്ങൾക്ക് അറിയില്ല.” അപ്പോൾ യേശു അവരോട് പറഞ്ഞു: “എങ്കിൽ, ഞാൻ ഇതെല്ലാം ഏത് അധികാരത്താൽ ചെയ്യുന്നു എന്നു ഞാനും നിങ്ങളോടു പറയുന്നില്ല.”'
  to: 'അവർ യേശുവിനോടു മറുപടി പറഞ്ഞു: “ഞങ്ങൾക്ക് അറിയില്ല.” യേശു അവരോടു പറഞ്ഞു: “ഞാൻ ഏത് അധികാരത്താലാണ് ഇവ ചെയ്യുന്നതെന്ന് ഞാനും നിങ്ങളോടു പറയുന്നില്ല.”'
  rationale: 'The revision removes interpretive discourse markers not present in the source while retaining the direct reciprocal structure: they say that they do not know, and Jesus says that he likewise will not tell them by what authority he does these things. The plural reference of ταῦτα is represented by “ഇവ.”'
