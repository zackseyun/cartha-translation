id: MRK.11.3
reference: Mark 11:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: ml
  text: ആരെങ്കിലും നിങ്ങളോട്, ‘നിങ്ങൾ എന്തിനാണ് ഇങ്ങനെ ചെയ്യുന്നത്?’ എന്നു ചോദിച്ചാൽ, ‘കർത്താവിന് ഇതിനെ ആവശ്യമുണ്ട്[a]; അവൻ ഉടനെ ഇതിനെ തിരികെ ഇങ്ങോട്ട് അയയ്ക്കും[b]’ എന്നു പറയുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യജമാനന് ഇതിനെ ആവശ്യമുണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ κύριος എന്ന പദത്തിന് ‘കർത്താവ്’ എന്നും ‘യജമാനൻ’ എന്നും അർഥമാകാം; ഇവിടെ സുവിശേഷസന്ദർഭം കണക്കിലെടുത്ത് ‘കർത്താവ്’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘അവൻ ഉടനെ ഇതിനെ തിരികെ ഇങ്ങോട്ട് അയയ്ക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ἀποστέλλει വർത്തമാനകാലരൂപമാണ്; സന്ദർഭത്തിൽ അത് ഭാവിയിൽ നടക്കാനിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതായി പ്രധാനപാഠം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: ആരെങ്കിലും നിങ്ങളോട് ... ചോദിച്ചാൽ
  rationale: ἐάν സഹിതമുള്ള ഉപാധിവാക്യത്തിന്റെ തുറന്ന ഭാവിസാധ്യത നിലനിർത്തുന്നു; ചോദ്യമാണ് പിന്നാലെ വരുന്നതിനാൽ മലയാളത്തിൽ ‘പറഞ്ഞാൽ’ എന്നതിനെക്കാൾ ‘ചോദിച്ചാൽ’ സ്വാഭാവികമാണ്.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: നിങ്ങൾ എന്തിനാണ് ഇങ്ങനെ ചെയ്യുന്നത്?
  rationale: τί ഇവിടെ പ്രവൃത്തിയെ ചോദ്യം ചെയ്യുന്ന പ്രയോഗമാണ്; ‘എന്തിനാണ്’ എന്നത് ആ വെല്ലുവിളിയുടെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: εἴπατε
  choice: എന്നു പറയുക
  rationale: ബഹുവചന ആജ്ഞയുടെ നേരിട്ടുള്ള അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: Ὁ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ ബഹുമാനപദവിയും മർക്കോസിന്റെ സുവിശേഷസന്ദർഭത്തിലെ യേശുവിലേക്കുള്ള സ്വാഭാവിക സൂചനയും നിലനിർത്തുന്നു.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: ഇതിനെ ആവശ്യമുണ്ട്
  rationale: മുൻവാക്യത്തിലെ കഴുതക്കുട്ടിയെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; ‘ആവശ്യമുണ്ട്’ χρείαν ἔχει എന്ന പ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിൽ പതിവായി കാണുന്ന തൽക്ഷണത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀποστέλλει
  choice: അയയ്ക്കും
  rationale: രൂപത്തിൽ വർത്തമാനകാലമായിരുന്നാലും സന്ദർഭത്തിൽ ഭാവിസൂചനയായി മനസ്സിലാക്കാവുന്നതിനാൽ മലയാള ഭാവികാലം ഉപയോഗിച്ചു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πάλιν ὧδε
  choice: വീണ്ടും ഇങ്ങോട്ട്
  rationale: πάλιν എന്നതിന്റെ ‘വീണ്ടും/തിരികെ’ എന്ന ആശയവും ὧδε എന്ന ദിശാസൂചനയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: κύριος എന്നതിന്റെ സൂചനയും ശക്തിയും
  choice: ‘കർത്താവ്’ എന്ന പദവിയായി പരിഭാഷപ്പെടുത്തി; സന്ദർഭത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘യജമാനൻ’ എന്ന സാധാരണ ഉടമസ്ഥതാ/അധികാര അർഥം.
  rationale: മർക്കോസിന്റെ ആഖ്യാനസന്ദർഭത്തിൽ നിർദേശം നൽകുന്ന യേശുവിലേക്കാണ് പദം സ്വാഭാവികമായി ചൂണ്ടുന്നത്. അതേസമയം κύριος എന്ന പദത്തിന്റെ സാധാരണ ‘യജമാനൻ’ അർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: ἀποστέλλει എന്ന വർത്തമാനകാലത്തിന്റെ കാലസൂചന
  choice: സന്ദർഭപരമായ ഭാവിയായി ‘അയയ്ക്കും’ എന്നു നൽകി.
  alternative: സജീവ/നാടകീയ വർത്തമാനമായി ‘അയയ്ക്കുന്നു’.
  rationale: വിശദീകരണം നൽകിയശേഷം നടക്കാനിരിക്കുന്ന പ്രവൃത്തിയാണ് ഇവിടെ പ്രതീക്ഷിക്കുന്നത്; എങ്കിലും ഗ്രീക്ക് വർത്തമാനരൂപത്തിന്റെ യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ നേരിട്ടുള്ള സംഭാഷണവും ഉപാധിവാക്യവും അടിയന്തരതയും നിലനിർത്തി. ‘ഇതിനെ’ എന്ന രൂപം കഴുതക്കുട്ടിയിലേക്കുള്ള സർവനാമസൂചന വ്യക്തമായി സൂക്ഷിക്കുന്നു; κύριος, ἀποστέλλει എന്നിവയിലെ യഥാർഥ അർഥവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
