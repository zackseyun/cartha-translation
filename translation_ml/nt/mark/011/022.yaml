  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “ദൈവത്തിൽ വിശ്വാസം വെക്കുവിൻ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ദൈവത്തിന്റെ വിശ്വാസം കൈവശം വെക്കുവിൻ.” ഇതിനെ “ദൈവത്തിന്റെ വിശ്വസ്തത” എന്നോ “ദൈവത്തിൽനിന്നുള്ള വിശ്വാസം” എന്നോ മനസ്സിലാക്കാനും കഴിയും.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... λέγει
  choice: മറുപടി പറഞ്ഞു
  rationale: സംസാരപ്രതികരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ഭൂതകാല ക്രിയയായി നൽകി; ചരിത്രവർത്തമാനത്തിന്റെ രൂപം യാന്ത്രികമായി നിലനിർത്തിയില്ല.
- source_word: Ἔχετε
  choice: വെക്കുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ മനോഭാവം സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘വിശ്വാസം വെക്കുവിൻ’ എന്നു നൽകി.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ പ്രധാന അർഥം ‘വിശ്വാസം’ ആണ്; ‘വിശ്വസ്തത’ എന്ന സാധ്യത ജനിറ്റീവ് ഘടനയോടൊപ്പം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: θεοῦ
  choice: ദൈവത്തിൽ
  rationale: πίστιν θεοῦ എന്ന ഘടന സന്ദർഭപരമായി ദൈവത്തെ ലക്ഷ്യമാക്കിയ വിശ്വാസം എന്ന objective genitive ആയി പ്രധാന പാഠത്തിൽ നൽകി; ഗ്രീക്കിലെ വ്യാകരണപരമായ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: πίστιν θεοῦ എന്നതിലെ അസ്പഷ്ടമായ ജനിറ്റീവ്
  choice: ദൈവത്തിൽ വിശ്വാസം
  alternative: കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ദൈവത്തിന്റെ വിശ്വാസം’; ‘ദൈവത്തിന്റെ വിശ്വസ്തത’ അല്ലെങ്കിൽ ‘ദൈവത്തിൽനിന്നുള്ള വിശ്വാസം’ എന്നും മനസ്സിലാക്കാം
  rationale: വാടിപ്പോയ അത്തിവൃക്ഷത്തെ തുടർന്നും പ്രാർഥനയെയും വിശ്വസിക്കലിനെയും കുറിച്ചുള്ള ഉപദേശത്തിന് മുമ്പുമായി വരുന്ന സന്ദർഭത്തിൽ, ദൈവത്തിലേക്കു തിരിയുന്ന വിശ്വാസത്തിനുള്ള ആഹ്വാനമാണ് ഏറ്റവും യോജിച്ചത്. എങ്കിലും ഗ്രീക്ക് ഘടനയിലെ യഥാർഥ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ആഖ്യാനശൈലി. ‘വിശ്വാസം വെക്കുവിൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്; അടിക്കുറിപ്പ് മൂലഭാഷയിലെ ദൈവശാസ്ത്രപരവും വ്യാകരണപരവുമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
