id: MRK.11.2
reference: Mark 11:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ എതിർവശത്തുള്ള ഗ്രാമത്തിലേക്കു പോകുവിൻ. അതിൽ പ്രവേശിച്ചയുടനെ, അതിന്റെമേൽ ഇതുവരെ ഒരു മനുഷ്യനും ഇരുന്നിട്ടില്ലാത്ത ഒരു കഴുതക്കുട്ടിയെ[a] കെട്ടിയിട്ടിരിക്കുന്നതായി നിങ്ങൾ കാണും.[b] അതിനെ അഴിച്ച് കൊണ്ടുവരുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ πῶλον എന്ന പദത്തിന് ഇളം മൃഗം എന്ന പൊതുവായ അർഥവും ഉണ്ടാകാം; ഈ സന്ദർഭത്തിൽ കഴുതക്കുട്ടിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “അതിന്റെമേൽ മനുഷ്യരിൽ ആരും ഇതുവരെ ഇരുന്നിട്ടില്ലാത്ത.” ഈ പ്രയോഗം ഒരു മനുഷ്യനും അതിനെ സവാരി ചെയ്തിട്ടില്ലെന്ന് വ്യക്തമാക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: പോകുവിൻ
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചന ആജ്ഞ; ആധുനിക മാനക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ രൂപം.
- source_word: κώμην τὴν κατέναντι ὑμῶν
  choice: നിങ്ങളുടെ എതിർവശത്തുള്ള ഗ്രാമം
  rationale: κώμη എന്നത് നഗരമല്ല, ഗ്രാമമാണ്; κατέναντι സ്ഥലപരമായി എതിർവശം സൂചിപ്പിക്കുന്നു.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτήν
  choice: അതിൽ പ്രവേശിച്ചയുടനെ
  rationale: പ്രവേശനത്തോടു ചേർന്ന ഉടൻ സംഭവിക്കുന്ന കണ്ടെത്തലിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὑρήσετε
  choice: നിങ്ങൾ കാണും
  rationale: εὑρίσκω ഇവിടെ അവിടെ കെട്ടിയിട്ടിരിക്കുന്ന മൃഗത്തെ കണ്ടെത്തുക/കാണുക എന്ന അർഥത്തിൽ; മലയാളത്തിൽ ‘കാണും’ സ്വാഭാവികമാണ്.
- source_word: πῶλον
  choice: കഴുതക്കുട്ടി
  rationale: πῶλος സ്വതവേ ഒരു ഇളം മൃഗത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ സവാരിസന്ദർഭത്തിലും തുടർന്നുള്ള വിവരണത്തിലും കഴുതയുടെ കുട്ടിയാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ ‘കഴുതക്കുട്ടി’ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: δεδεμένον
  choice: കെട്ടിയിട്ടിരിക്കുന്നതായി
  rationale: പൂർണ്ണ കർമണി കൃദന്തം മൃഗം കെട്ടപ്പെട്ട നിലയിൽ തുടരുന്നതു സൂചിപ്പിക്കുന്നു.
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: ഇതുവരെ ആരും കയറിയിട്ടില്ലാത്ത
  rationale: മനുഷ്യരിൽ ആരും ഇതുവരെ അതിന്റെമേൽ ഇരുന്ന് സവാരി ചെയ്തിട്ടില്ല എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘കയറിയിട്ടില്ലാത്ത’ മൃഗസവാരിയുടെ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: λύσατε αὐτὸν καὶ φέρετε
  choice: അതിനെ അഴിച്ച് കൊണ്ടുവരുവിൻ
  rationale: കെട്ടിയ മൃഗത്തെ അഴിക്കാനും തങ്ങളുടെ അടുക്കൽ കൊണ്ടുവരാനും ഉള്ള രണ്ട് ആജ്ഞകളും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി സ്വീകരിച്ചു. നേരിട്ടുള്ള പ്രസംഗത്തിലെ ബഹുവചന ആജ്ഞകൾക്ക് ‘പോകുവിൻ’, ‘കൊണ്ടുവരുവിൻ’ എന്നീ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ രൂപങ്ങൾ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലെ footnote-marker വിന്യാസം പകർത്താതെ, മലയാള പരിഭാഷയിൽ യഥാർഥ വിശദീകരണം ആവശ്യമായ മനുഷ്യസവാരി എന്ന വാചകഭാഗത്തോട് [a] ചേർത്തു.
