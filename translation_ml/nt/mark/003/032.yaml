source:
  edition: SBLGNT
  text: καὶ ἐκάθητο ⸂περὶ αὐτὸν ὄχλος⸃, ⸂καὶ λέγουσιν⸃ αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί ⸀σου ἔξω ζητοῦσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: ml
  text: 'ഒരു ജനക്കൂട്ടം യേശുവിനു ചുറ്റും ഇരിക്കുകയായിരുന്നു. അവർ അവനോടു പറഞ്ഞു: “ഇതാ, നിന്റെ അമ്മയും സഹോദരന്മാരും പുറത്തു നിന്നെ അന്വേഷിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്നെ തിരയുന്നു.” ഗ്രീക്കുപദത്തിന് “അന്വേഷിക്കുക,” “തിരയുക” എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ അവനെ നേരിൽ കണ്ടെത്താൻ ശ്രമിക്കുന്നതാണ് സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം പശ്ചാത്തലത്തിൽ തുടർന്നുകൊണ്ടിരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം ആ ദൈർഘ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: περὶ αὐτὸν ὄχλος
  choice: ഒരു ജനക്കൂട്ടം യേശുവിനു ചുറ്റും
  rationale: περί + accusative ഇവിടെ ചുറ്റുമുള്ള സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നു. സർവനാമത്തിന്റെ സൂച്യം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘യേശുവിനു’ എന്നു നൽകി.
- source_word: λέγουσιν
  choice: അവർ അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ വർത്തമാനരൂപം ആഖ്യാനത്തിലെ historical present ആണ്; സ്വാഭാവിക മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലം യോജിക്കുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗത്തിന്റെ ബലം പഴഞ്ചനാകാതെ നിലനിർത്തുന്ന സാധാരണ മലയാളരൂപം.
- source_word: μήτηρ
  choice: അമ്മ
  rationale: സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ ബന്ധപദം.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിൽ പുരുഷലിംഗ ബഹുവചനമായ സാധാരണ ബന്ധപദമാണ്; വ്യാഖ്യാനപരമായ വിപുലീകരണം കൂടാതെ അതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: ἔξω
  choice: പുറത്ത്
  rationale: സ്ഥലം സൂചിപ്പിക്കുന്ന ലളിതമായ ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: ζητοῦσίν σε
  choice: നിന്നെ അന്വേഷിക്കുന്നു
  rationale: ζητέω എന്നതിന് ‘അന്വേഷിക്കുക/തിരയുക’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ യേശുവിനെ കണ്ടെത്താൻ ശ്രമിക്കുന്നതെന്ന ഭൗതികസന്ദർഭത്തിന് ‘അന്വേഷിക്കുന്നു’ സ്വാഭാവികമാണ്, എന്നാൽ പദത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘സഹോദരന്മാർ’ എന്നതിന്റെ ബന്ധസൂചന
  choice: ἀδελφοί എന്നത് ‘സഹോദരന്മാർ’ എന്നു വ്യാഖ്യാനവിപുലീകരണം കൂടാതെ പരിഭാഷപ്പെടുത്തി.
  alternative: സഹോദരങ്ങൾ / അടുത്ത ബന്ധുക്കൾ
  rationale: വാക്യം സാധാരണ ബന്ധപദം മാത്രമാണ് ഉപയോഗിക്കുന്നത്; യേശുവിന്റെ കുടുംബബന്ധത്തെക്കുറിച്ചുള്ള സഭാവിഭാഗപരമായ നിഗമനം ഇതിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ തുടർച്ചയായ പശ്ചാത്തലപ്രവർത്തനം ‘ഇരിക്കുകയായിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി; historical present സ്വാഭാവിക മലയാള ഭൂതകാലമായി നൽകി.
