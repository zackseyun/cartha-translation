  source_fidelity: ഗ്രീക്ക് പാഠത്തിലെ അപൂർണഭൂതകാല പശ്ചാത്തലവിവരണം (ἐκάθητο) ‘ഇരിക്കുകയായിരുന്നു’ എന്നതിലൂടെ കൃത്യമായി നിലനിർത്തിയിരിക്കുന്നു. περὶ αὐτὸν എന്ന സ്ഥലബന്ധം ‘യേശുവിനു ചുറ്റും’ എന്ന് സ്വാഭാവികമായി നൽകിയിട്ടുണ്ട്. ചരിത്രവർത്തമാനം λέγουσιν ഭൂതകാല ആഖ്യാനരൂപമായ ‘പറഞ്ഞു’ എന്നു മാറ്റിയതും യോജിച്ചതാണ്. ‘അമ്മയും സഹോദരന്മാരും പുറത്തു നിന്നെ അന്വേഷിക്കുന്നു’ എന്നത് μήτηρ, ἀδελφοί, ἔξω, ζητοῦσίν σε എന്നിവയെ വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമാണ്. ‘ഇതാ’ ശ്രദ്ധ ക്ഷണിക്കുന്ന ἰδού-വിന്റെ ബലം മാന്യമായ ആഖ്യാനശൈലിയിൽ നൽകുന്നു. ‘പുറത്തു’ എന്ന രൂപവും പ്രയോഗയോഗ്യമാണ്; മാറ്റം ആവശ്യമായത്ര അസ്വാഭാവികതയില്ല.
