source:
  edition: SBLGNT
  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: ml
  text: അവൻ അനേകരെ സൗഖ്യമാക്കിയതിനാൽ, അതിന്റെ ഫലമായി കഠിനമായ ബാധകളുള്ളവരെല്ലാം[b] അവനെ തൊടാനായി അവന്റെമേൽ തിക്കിത്തിരക്കി വീഴുകയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെമേൽ പാഞ്ഞുവീഴുകയായിരുന്നു.” ജനങ്ങൾ ശക്തിയായി അവന്റെ അടുക്കലേക്ക് തള്ളിക്കയറിയതിനെ സൂചിപ്പിക്കുന്നതാണ് ഗ്രീക്ക് പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “രോഗങ്ങളുള്ളവർ” അല്ലെങ്കിൽ “വ്യാധികളുള്ളവർ.” ഗ്രീക്ക് പദത്തിന്റെ അക്ഷരാർഥം “ചാട്ടവാർപ്രഹരങ്ങൾ” എന്നാണ്; ഇവിടെ അത് കടുത്ത ബാധകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: അനേകരെ
  rationale: ക്രിയയുടെ കർമമായി വരുന്ന ബഹുവചനത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: -തിനാൽ
  rationale: മുൻസന്ദർഭത്തിലെ ജനക്കൂട്ടത്തിന്റെ പെരുമാറ്റത്തിനുള്ള വിശദീകരണകാരണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കാരണബന്ധമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐθεράπευσεν
  choice: സൗഖ്യമാക്കിയിരുന്നതിനാൽ
  rationale: യേശുവിന്റെ മുമ്പത്തെ സൗഖ്യമാക്കൽ പ്രവർത്തനമാണ് ഇപ്പോഴത്തെ തിരക്കിന് കാരണമെന്ന സന്ദർഭബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ὥστε
  choice: അതിന്റെ ഫലമായി വരുന്ന വാക്യഘടന
  rationale: ഗ്രീക്കിൽ ഉള്ള ഫലബന്ധം മലയാളത്തിലെ കാരണം-ഫലം ചേർന്ന വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐπιπίπτειν αὐτῷ
  choice: അവന്റെമേൽ തിക്കിത്തിരക്കി വീഴുകയായിരുന്നു
  rationale: ἐπιπίπτω എന്നതിന്റെ ശക്തമായ ‘മേൽ വീഴുക/പാഞ്ഞുചെല്ലുക’ എന്ന ഭാവവും ജനക്കൂട്ടം സമ്മർദത്തോടെ അടുക്കുന്നതും ഒരുമിച്ച് അറിയിക്കുന്നു.
- source_word: ἵνα αὐτοῦ ἅψωνται
  choice: അവനെ തൊടേണ്ടതിന്
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യവും ἅπτομαιയുടെ ശാരീരിക സ്പർശനാർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὅσοι
  choice: എല്ലാവരും
  rationale: ബന്ധവാചകത്തിന്റെ സമഗ്രത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἶχον μάστιγας
  choice: കഠിനമായ ബാധകളുള്ളവർ
  rationale: μάστιξ എന്ന പദത്തിന്റെ അക്ഷരാർഥമായ ‘ചാട്ടവാർ/പ്രഹരം’ എന്ന ദൃശ്യശക്തിയും രോഗമോ കടുത്ത കഷ്ടതയോ എന്ന രൂപകാർഥവ്യാപ്തിയും ‘കഠിനമായ ബാധകൾ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സൗഖ്യസന്ദർഭത്തിലെ μάστιγας എന്നതിന്റെ സ്വഭാവം
  choice: കഠിനമായ ബാധകൾ
  alternative: രോഗങ്ങൾ; വ്യാധികൾ; ചാട്ടവാർപ്രഹരങ്ങൾ
  rationale: ഇത് വെറും വൈദ്യശാസ്ത്രപരമായ രോഗനിർണയത്തിലേക്ക് അർഥം ചുരുക്കാതെ, കടുത്ത ദേഹപീഡയെയും കഷ്ടതയെയും സൂചിപ്പിക്കുന്ന പദത്തിന്റെ തീവ്രത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘തിക്കിത്തിരക്കി വീഴുകയായിരുന്നു’ എന്ന പ്രയോഗം ജനക്കൂട്ടത്തിന്റെ ശാരീരിക സമ്മർദവും മൂലപദത്തിന്റെ ശക്തിയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; അക്ഷരാർഥവും മറ്റ് സാധ്യതകളും അടിക്കുറിപ്പുകളിൽ നൽകുന്നു.
