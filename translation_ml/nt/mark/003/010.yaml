revisions:
- from: അവൻ അനേകരെ സൗഖ്യമാക്കിയിരുന്നതിനാൽ, കഠിനമായ ബാധകളുള്ളവരെല്ലാം അവനെ തൊടേണ്ടതിന് അവന്റെമേൽ തിക്കിത്തിരക്കി വീഴുകയായിരുന്നു.[a][b]
  to: അവൻ അനേകരെ സൗഖ്യമാക്കിയതിനാൽ, അതിന്റെ ഫലമായി കഠിനമായ ബാധകളുള്ളവരെല്ലാം[b] അവനെ തൊടാനായി അവന്റെമേൽ തിക്കിത്തിരക്കി വീഴുകയായിരുന്നു.[a]
  rationale: The revision makes the Greek cause-and-result sequence more explicit, uses an idiomatic Malayalam purpose construction, and relocates the two existing lexical footnote anchors to the relevant phrases. It retains the draft’s non-diagnostic rendering of μάστιγες and its forceful crowd imagery for ἐπιπίπτειν.
