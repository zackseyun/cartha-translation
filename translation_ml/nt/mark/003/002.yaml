id: MRK.3.2
reference: Mark 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: ml
  text: ശബ്ബത്തിൽ[a] അവൻ ആ മനുഷ്യനെ സുഖപ്പെടുത്തുമോ എന്നു അവർ അവനെ സൂക്ഷ്മമായി നിരീക്ഷിച്ചുകൊണ്ടിരുന്നു; അവനെ കുറ്റപ്പെടുത്തുന്നതിനായിരുന്നു അവരുടെ ഉദ്ദേശ്യം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഇവിടെ അക്ഷരാർഥത്തിൽ ‘ശബ്ബത്തുകളിൽ’ എന്ന ബഹുവചനരൂപമാണ്; അത് ‘ശബ്ബത്തുദിനത്തിൽ’ എന്ന അർഥത്തിൽ പതിവുപ്രയോഗമായി വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: സൂക്ഷ്മമായി നിരീക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ സംശയഭരിതവും വിരോധപരവുമായ നിരീക്ഷണവും ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἰ
  choice: -മോ എന്നു
  rationale: നിരീക്ഷിക്കുക എന്ന ക്രിയയ്ക്കു പിന്നാലെയുള്ള പരോക്ഷചോദ്യത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τοῖς σάββασιν
  choice: ശബ്ബത്തിൽ
  rationale: ഗ്രീക്കിൽ ബഹുവചനരൂപമാണെങ്കിലും കൊയ്നേ ഗ്രീക്കിൽ അത് ശബ്ബത്തുദിനത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാകാം; മലയാളത്തിൽ ഏകവചനം കൂടുതൽ സ്വാഭാവികമാണ്. രൂപപരമായ വിവരം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: θεραπεύσει αὐτόν
  choice: അവൻ ആ മനുഷ്യനെ സുഖപ്പെടുത്തുമോ
  rationale: ഭാവികാല ക്രിയയുടെ പരോക്ഷചോദ്യശക്തി '-മോ എന്നു' എന്ന ഘടനയിലൂടെ നിലനിർത്തുന്നു. രണ്ടാമത്തെ αὐτόν യേശുവിനെയല്ല, രോഗിയായ മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത് എന്നത് മലയാളത്തിൽ വ്യക്തതയ്ക്കായി തുറന്നുപറയുന്നു.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: അവനെ കുറ്റപ്പെടുത്താൻ ഇട കിട്ടേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യാർഥവും κατηγορέωയുടെ കുറ്റാരോപണാർഥവും നിലനിർത്തുന്നു; ഔപചാരികമായ നിയമനടപടി നടന്നുവെന്ന് അതിലുപരി സൂചിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: നിരീക്ഷിച്ചവരുടെ ഉദ്ദേശ്യം
  choice: യേശുവിനെ കുറ്റപ്പെടുത്താൻ കാരണം കണ്ടെത്താനുള്ള വിരോധപരമായ നിരീക്ഷണം
  alternative: അവനെ നിയമപരമായി വിചാരണ ചെയ്യുകയോ ശിക്ഷാനടപടിക്ക് വിധേയനാക്കുകയോ ചെയ്യുക
  rationale: κατηγορέωയ്ക്ക് ന്യായവ്യവഹാരപരമായ നിറം ഉണ്ടാകാമെങ്കിലും ഈ വാക്യം വ്യക്തമാക്കുന്നത് കുറ്റപ്പെടുത്താനുള്ള ഉദ്ദേശ്യം മാത്രമാണ്; വികസിതമായ ഔപചാരിക നിയമസാഹചര്യം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- issue: τοῖς σάββασιν എന്ന ബഹുവചനരൂപം
  choice: മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ഏകവചനം ‘ശബ്ബത്തിൽ’; ഗ്രീക്ക് ബഹുവചനം അടിക്കുറിപ്പിൽ
  alternative: ‘ശബ്ബത്തുകളിൽ’ എന്ന് രൂപാനുസൃതമായി പരിഭാഷപ്പെടുത്തുക
  rationale: ഇവിടെയുള്ള ബഹുവചനം ശബ്ബത്തുദിനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പതിവുപ്രയോഗമായി ഗ്രഹിക്കാം. മലയാളത്തിലെ അക്ഷരാർഥ ബഹുവചനം ഒന്നിലധികം ശബ്ബത്തുകളിൽ അവർ നിരീക്ഷിച്ചു എന്ന അനാവശ്യ ധാരണ സൃഷ്ടിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സൂക്ഷ്മമായി നിരീക്ഷിച്ചുകൊണ്ടിരുന്നു’ തുടർച്ചയായ ജാഗ്രതയുള്ള നിരീക്ഷണത്തെ വ്യക്തമാക്കുന്നു; ‘കുറ്റപ്പെടുത്താൻ ഇട കിട്ടേണ്ടതിന്’ വിരോധപരമായ ഉദ്ദേശ്യം പ്രകടമാക്കുമ്പോഴും ഔപചാരികമായ പ്രോസിക്യൂഷൻ എന്ന അധിക ആശയം ചുമത്തുന്നില്ല.
