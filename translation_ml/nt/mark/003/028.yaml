  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: ml
  text: '“സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: മനുഷ്യപുത്രന്മാർക്ക്[a] എല്ലാ പാപങ്ങളും, അവർ പറയുന്ന എത്ര ദൈവദൂഷണങ്ങളായാലും, ക്ഷമിക്കപ്പെടും;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മനുഷ്യർ” / “ആളുകൾ.” “മനുഷ്യപുത്രന്മാർ” എന്ന ഗ്രീക്ക് പ്രയോഗം മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: സത്യമായി
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ solemn introductory formula സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ‘ആമേൻ’ എന്ന ലിപ്യന്തരണം ഒഴിവാക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും വർത്തമാനകാല പ്രസ്താവനയുടെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: πάντα
  choice: എല്ലാ
  rationale: തുടർന്നുവരുന്ന ‘പാപങ്ങൾ’, ‘ദൈവദൂഷണം’ എന്നിവയെ സമഗ്രമായി ഉൾക്കൊള്ളുന്ന പ്രയോഗം.
- source_word: ἀφεθήσεται
  choice: ക്ഷമിക്കപ്പെടും
  rationale: പാപസന്ദർഭത്തിലെ ἀφίημι എന്ന ക്രിയയുടെ ഭാവികാല കർമണിപ്രയോഗം കൃത്യമായി നൽകുന്നു.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: മനുഷ്യപുത്രന്മാർക്ക്
  rationale: സ്രോതസ്സിലെ സെമിറ്റിക് ശൈലിയിലുള്ള ലിംഗസൂചക രൂപം നിലനിർത്തുന്നു; അതിന്റെ സർവമാനവിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰ ἁμαρτήματα
  choice: അവരുടെ എല്ലാ പാപങ്ങളും
  rationale: പ്രത്യേക പാപപ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന ബഹുവചനം; മലയാളവാക്യത്തിൽ ദാതൃബന്ധം വ്യക്തമാക്കാൻ ‘അവരുടെ’ ചേർത്തിരിക്കുന്നു.
- source_word: βλασφημίαι
  choice: ദൈവദൂഷണം
  rationale: പരിശുദ്ധാത്മാവിനെതിരായ സംസാരത്തെക്കുറിച്ചുള്ള സമീപസന്ദർഭത്തിലെ മതപരവും ദൈവശാസ്ത്രപരവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: അവർ പറയുന്ന ഏതൊരു ദൈവദൂഷണവും
  rationale: ἐάν സഹിതമുള്ള subjunctive-ന്റെ അനിശ്ചിതവും തുറന്നതുമായ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പരിശുദ്ധാത്മാവിനെതിരായ ദൈവദൂഷണത്തെക്കുറിച്ചുള്ള അടുത്ത വാക്യത്തിലെ മുന്നറിയിപ്പുമായി ഈ വാക്യത്തിലെ ക്ഷമയുടെ വ്യാപ്തിക്കുള്ള ബന്ധം
  choice: ഈ വാക്യത്തിലെ സമഗ്രമായ ക്ഷമാപ്രഖ്യാപനം അതിന്റെ സ്വന്തം വ്യാപ്തിയോടെ നിലനിർത്തി; അടുത്ത വാക്യത്തിലെ ഒഴിവ് ഇതിൽ മുൻകൂട്ടി ചേർത്തില്ല.
  alternative: ഈ വാക്യത്തിൽത്തന്നെ പരോക്ഷമായ ഒരു പരിധി ചേർക്കുക.
  rationale: സ്രോതസ്സ് ആദ്യം ക്ഷമയുടെ വിശാലത പ്രഖ്യാപിക്കുകയും പിന്നത്തെ വാക്യത്തിൽ ഒഴിവ് അവതരിപ്പിക്കുകയും ചെയ്യുന്നു; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനത്തിൽ മുൻകൂട്ടി പരിഹരിക്കരുത്.
- issue: τοῖς υἱοῖς τῶν ἀνθρώπων എന്ന പൊതുവായ പുരുഷലിംഗ പ്രയോഗം
  choice: പ്രധാനപാഠത്തിൽ ‘മനുഷ്യപുത്രന്മാർ’ നിലനിർത്തി അതിന്റെ ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: മനുഷ്യർ / ആളുകൾ / മനുഷ്യജനം
  rationale: സ്രോതസ്സിന്റെ സെമിറ്റിക് രൂപവും വ്യാകരണലിംഗവും നിലനിർത്തുന്നതിനൊപ്പം, അത് പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നില്ലെന്ന് വായനക്കാരന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മനുഷ്യപുത്രന്മാർ’ എന്ന അസാധാരണമായ സെമിറ്റിക് രൂപം സ്രോതസ്സിനോടുള്ള ഔപചാരിക വിശ്വസ്തതയ്ക്കായി നിലനിർത്തുകയും അടിക്കുറിപ്പിലൂടെ അർഥം വ്യക്തമാക്കുകയും ചെയ്തു. വാക്യാവസാനത്തിലെ ചിഹ്നമായി തുടർവാക്യവുമായി ബന്ധം സൂചിപ്പിക്കുന്ന സെമിക്കോളൺ നിലനിർത്തി.
