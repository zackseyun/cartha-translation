id: MRK.3.27
reference: Mark 3:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: ml
  text: എന്നാൽ, ബലവാനെ[b] ആദ്യം കെട്ടിയിടാതെ ആർക്കും അവന്റെ വീട്ടിൽ കടന്ന് അവന്റെ സാധനങ്ങൾ[a] കൊള്ളയടിക്കാൻ കഴിയുകയില്ല; അവനെ കെട്ടിയിട്ടശേഷം അവൻ ആ വീടു കൊള്ളയടിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ വസ്തുവകകൾ”; അക്ഷരാർഥത്തിൽ “അവന്റെ പാത്രങ്ങൾ/ഉപകരണങ്ങൾ.”
    reason: lexical_alternative
  - marker: b
    text: സന്ദർഭത്തിൽ “ബലവാൻ” എന്നത് സാത്താനെ കീഴടക്കുന്നതിനെക്കുറിച്ചുള്ള യേശുവിന്റെ ഉപമയുടെ ഭാഗമാണ്; മുഖ്യപാഠം ആ വ്യാഖ്യാനം നേരിട്ട് ചേർക്കാതെ ഉപമ നിലനിർത്തുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ ആരോപണത്തോടും യേശുവിന്റെ മറുപടിയോടും ഉള്ള വൈരുധ്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὐδεὶς δύναται
  choice: ആർക്കും ... കഴിയുകയില്ല
  rationale: അസാധ്യതയെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν
  choice: ബലവാന്റെ വീട്ടിൽ കടന്ന്
  rationale: ഗ്രീക്കിലെ ഗതിയും ക്രിയാനുക്രമവും ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: ബലവാൻ / ബലവാനെ
  rationale: വിശേഷണത്തിന്റെ നാമരൂപപ്രയോഗവും ആവർത്തനവും ഉപമയുടെ ദൃശ്യരൂപവും നിലനിർത്തുന്നു; വ്യാഖ്യാനമായി ‘സാത്താൻ’ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τὰ σκεύη αὐτοῦ
  choice: അവന്റെ സാധനങ്ങൾ
  rationale: σκεύη എന്നത് അക്ഷരാർഥത്തിൽ പാത്രങ്ങൾ/ഉപകരണങ്ങൾ എന്നാകാമെങ്കിലും ഈ കൊള്ളസന്ദർഭത്തിൽ വീട്ടിലുള്ള വസ്തുവകകളെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: διαρπάσαι / διαρπάσει
  choice: കൊള്ളയടിക്കാൻ / കൊള്ളയടിക്കാനാകൂ
  rationale: ബലമായി കൈക്കലാക്കുക എന്ന ക്രിയയുടെ ശക്തിയും കൊള്ളയുടെ ഉപമയും സൂക്ഷിക്കുന്നു.
- source_word: ἐὰν μὴ πρῶτον ... δήσῃ
  choice: ആദ്യം കെട്ടിയിടാതെ
  rationale: കൊള്ളയ്ക്ക് മുമ്പ് നിർബന്ധമായി നടക്കേണ്ട പ്രവൃത്തിയെന്ന വ്യവസ്ഥയും സമയക്രമവും കൃത്യമായി നൽകുന്നു.
- source_word: καὶ τότε
  choice: കെട്ടിയിട്ടശേഷമേ
  rationale: മുമ്പത്തെ വ്യവസ്ഥ നിറവേറ്റിയതിനുശേഷം മാത്രമേ തുടർപ്രവൃത്തി സാധ്യമാകൂ എന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: അവന്റെ വീട് കൊള്ളയടിക്കാനാകൂ
  rationale: ‘വീട്’ എന്ന മൂർത്തമായ ഉപമ നിലനിർത്തുന്നു; മുഴുവൻ വീട്ടുവകയെയോ അധീനമേഖലയെയോ സൂചിപ്പിക്കാവുന്ന അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘ബലവാൻ’ എന്ന പ്രയോഗത്തിന്റെ ഉപമാത്മക അർഥം
  choice: മുഖ്യപാഠത്തിൽ ഉപമ അതേപടി നിലനിർത്തുക
  alternative: ‘സാത്താൻ’ എന്നു നേരിട്ട് വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: സന്ദർഭത്തിൽ ബലവാൻ സാത്താനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം വ്യാഖ്യാനം തുറന്നുപറയാതെ ഉപമയാണ് അവതരിപ്പിക്കുന്നത്. അതിനാൽ മുഖ്യപാഠം ഉപമ സംരക്ഷിക്കുകയും വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ബലവാൻ,’ ‘കെട്ടിയിടുക,’ ‘കൊള്ളയടിക്കുക’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിലെ സജീവമായ ഉപമ നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
