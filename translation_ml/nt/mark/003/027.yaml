  terminology: '''ബലവാൻ,'' ''കെട്ടിയിടുക,'' and ''കൊള്ളയടിക്കുക'' preserve the metaphor well without importing its interpretation into the main text. ''സാധനങ്ങൾ'' is suitable in this context. The explanatory note is restrained and appropriately identifies the contextual metaphor.'
