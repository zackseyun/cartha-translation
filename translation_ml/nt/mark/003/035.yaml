id: MRK.3.35
reference: Mark 3:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവത്തിന്റെ ഇഷ്ടം ചെയ്യുന്ന ആരായാലും, ആ വ്യക്തി തന്നെയാണ് എന്റെ സഹോദരനും സഹോദരിയും അമ്മയും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: ചെയ്യുന്നവൻ ആരായാലും
  rationale: ആപേക്ഷിക സർവനാമം, ἄν, aorist subjunctive എന്നിവ ചേർന്ന് പൊതുവായ അനിശ്ചിത വ്യവസ്ഥ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ചെയ്യുന്നവൻ ആരായാലും’ എന്നത് സ്വാഭാവികമായി ‘whoever does’ എന്ന അർഥം നൽകുന്നു.
- source_word: γὰρ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: γάρ മുൻവാക്യത്തിനുള്ള വിശദീകരണമോ കാരണമോ നൽകുന്നു. എന്നാൽ ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ ‘എന്തെന്നാൽ’ എന്നു തുടങ്ങുന്നത് അസ്വാഭാവികമാകാം; വാക്യത്തിന്റെ വിശദീകരണസ്വഭാവം വാക്യഘടനയിൽ നിലനിൽക്കുന്നു.
- source_word: ποιήσῃ
  choice: ചെയ്യുന്ന
  rationale: ποιέω ഇവിടെ ദൈവത്തിന്റെ ഇഷ്ടം ചെയ്യുക, നടപ്പാക്കുക എന്ന നേരിട്ടുള്ള അർഥത്തിലാണ്. ‘ചെയ്യുന്ന’ ലളിതവും സ്വാഭാവികവും ആണ്.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഇഷ്ടം
  rationale: ഗ്രീക്കിലെ genitive ഘടന നേരിട്ട് നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പ്രയോഗം.
- source_word: οὗτος
  choice: അയാൾ തന്നെയാണ്
  rationale: οὗτος എന്ന ഊന്നലുള്ള demonstrative-ന്റെ ബലം ‘തന്നെയാണ്’ വഴി സംരക്ഷിക്കുന്നു. ‘അയാൾ’ ഏകവചന വ്യക്തിയെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള പുരുഷ-സ്ത്രീ ബന്ധപദങ്ങളോടൊപ്പം സ്വാഭാവികമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: എന്റെ സഹോദരനും സഹോദരിയും അമ്മയും
  rationale: മൂന്നു വ്യക്തമായ കുടുംബബന്ധപദങ്ങളും പൊതുവായ ‘കുടുംബാംഗം’ എന്നതിലേക്കു ചുരുക്കാതെ നിലനിർത്തുന്നു. ആവർത്തിക്കുന്ന καί-യുടെ സമാഹാരബലം മലയാളത്തിലെ ‘-ഉം’ ഘടനയിൽ പ്രതിഫലിക്കുന്നു.
- source_word: ἐστίν
  choice: ആണ്
  rationale: ഏകവചന കർത്താവിനോടു പൊരുത്തപ്പെടുന്ന ലളിതമായ copula; ഊന്നൽ കാരണം ‘തന്നെയാണ്’ എന്ന രൂപത്തിൽ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: മിശ്രലിംഗ കുടുംബബന്ധപദങ്ങളോടുകൂടിയ ഏകവചന കർത്താവ്
  choice: അയാൾ തന്നെയാണ്
  alternative: അവനാണ് / ആ വ്യക്തിയാണ്
  rationale: ഗ്രീക്ക് ഏകവചന subject-നെ നിലനിർത്തുകയും οὗτος-ന്റെ ഊന്നൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു. തുടർന്നുള്ള ‘സഹോദരനും സഹോദരിയും അമ്മയും’ എന്ന പട്ടിക ഈ പ്രസ്താവനയെ പുരുഷന്മാർക്ക് മാത്രമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: യേശുവിന്റെ കുടുംബഭാഷയുടെ സ്വഭാവം
  choice: സഹോദരൻ, സഹോദരി, അമ്മ എന്നീ ബന്ധപദങ്ങൾ അതേപടി നിലനിർത്തി
  alternative: കുടുംബാംഗം / ബന്ധു
  rationale: ദൈവത്തിന്റെ ഇഷ്ടം ചെയ്യുന്നതിന്റെ അടിസ്ഥാനത്തിൽ കുടുംബബന്ധത്തെ പുനർനിർവചിക്കുന്ന രൂപകാത്മകവും ദൈവശാസ്ത്രപരവുമായ ശക്തി പൊതുവൽക്കരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അയാൾ തന്നെയാണ്’ എന്നത് demonstrative ഊന്നൽ നിലനിർത്തുന്നു; ‘സഹോദരനും സഹോദരിയും അമ്മയും’ എന്ന ആവർത്തനഘടന മൂലവാക്യത്തിന്റെ അസാധാരണമായെങ്കിലും ഉദ്ദേശ്യപൂർവമായ കുടുംബപ്പട്ടിക സംരക്ഷിക്കുന്നു.
