source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: ml
  text: സാത്താൻ തനിക്കുതന്നെ എതിരായി എഴുന്നേറ്റ് ഭിന്നിച്ചുപോയെങ്കിൽ, അവന് നിലനിൽക്കാൻ കഴിയില്ല; അവന്റെ അന്ത്യം വന്നിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവന് ഒരു അന്ത്യമുണ്ട്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σατανᾶς
  choice: സാത്താൻ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: തനിക്കുതന്നെ എതിരായി എഴുന്നേറ്റ്
  rationale: പ്രതികൂലമായി എഴുന്നേൽക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐμερίσθη
  choice: ഭിന്നിച്ചുപോയെങ്കിൽ
  rationale: ആന്തരിക വിഭജനവും അതിന്റെ ഫലമായ അവസ്ഥയും സൂചിപ്പിക്കുന്ന കർമണി അർഥം നിലനിർത്തുന്നു.
- source_word: οὐ δύναται στῆναι
  choice: അവന് നിലനിൽക്കാൻ കഴിയില്ല
  rationale: വെറും നിൽപ്പ് എന്നതിലുപരി തുടർന്നുനിൽക്കാനോ നിലനിൽക്കാനോ കഴിയാത്തതിനെ സന്ദർഭോചിതമായി അറിയിക്കുന്നു.
- source_word: ἀλλὰ τέλος ἔχει
  choice: അവന്റെ അന്ത്യം വന്നിരിക്കുന്നു
  rationale: അക്ഷരാർഥമായ ‘അവന് ഒരു അന്ത്യം ഉണ്ട്’ എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിത ഫലം സംക്ഷിപ്തമായി നൽകുന്നു; അന്തിമകാലശാസ്ത്രപരമായ വിപുലീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സാത്താന്റെ അന്ത്യത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ സ്വഭാവം
  choice: യേശുവിന്റെ യുക്തിവാദത്തിനുള്ളിലെ അനിവാര്യ ഫലമായി ‘അവന്റെ അന്ത്യം വന്നിരിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവൻ അവസാനിച്ചുകൊണ്ടിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘അവന് ഒരു അന്ത്യമുണ്ട്.’
  rationale: വിഭജിക്കപ്പെട്ട സാത്താന്റെ ആധിപത്യത്തിന് നിലനിൽക്കാനാവില്ല എന്നതാണ് തത്സന്ദർഭത്തിലെ വാദം. ഈ വാക്യം മാത്രം ആശ്രയിച്ച് അന്തിമ പരാജയത്തെക്കുറിച്ചുള്ള വികസിത സിദ്ധാന്തപ്രഖ്യാപനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ നിബന്ധനാത്മക യുക്തിയും സംക്ഷിപ്തതയും നിലനിർത്തിയിരിക്കുന്നു.
