  issues:
  - severity: low
    issue: The initial connective καὶ is omitted.
    rationale: καὶ continues Jesus’ parallel argument from the preceding saying. Initial ‘അങ്ങനെ,’ naturally conveys this discourse connection without adding meaning.
  - severity: low
    issue: The lexical-alternative footnote uses ‘വീട്ടുകാർ’ and has imprecise wording about the metaphor.
    rationale: For οἰκία, ‘കുടുംബം’ is the closer Malayalam alternative for ‘household.’ The preference for ‘വീട്’ arises from the whole image of a house being unable to stand/endure.
