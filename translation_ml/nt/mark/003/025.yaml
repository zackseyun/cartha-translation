source:
  edition: SBLGNT
  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: ml
  text: അങ്ങനെ, ഒരു വീട് തനിക്കുതന്നെ എതിരായി വിഭജിക്കപ്പെട്ടാൽ[a], ആ വീടിനു നിലനിൽക്കാൻ കഴിയുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീട്’ (οἰκία) എന്നതിന് ‘കുടുംബം’ എന്നും അർഥമാകാം; എന്നാൽ വിഭജിക്കപ്പെട്ട ഒരു വീടിനു ‘നിലനിൽക്കാൻ’ കഴിയില്ലെന്ന രൂപകം ഇവിടെ ‘വീട്’ എന്ന അർഥത്തെ കൂടുതൽ അനുകൂലിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: വീട്
  rationale: οἰκίαയ്ക്ക് ‘വീട്’ എന്നും ‘വീട്ടുകാർ/കുടുംബം’ എന്നും അർഥമാകാം. എന്നാൽ σταθῆναι (‘നിലനിൽക്കുക’) എന്ന പ്രയോഗത്തോടുള്ള രൂപകം ഇവിടെ ‘വീട്’ എന്ന മൂർത്തമായ അർഥത്തെ അനുകൂലിക്കുന്നു.
- source_word: ἐφ’ ἑαυτὴν
  choice: തനിക്കുതന്നെ എതിരായി
  rationale: പ്രതിഫലന സർവനാമത്തോടുകൂടിയ ἐπί ഇവിടെ ആന്തരിക എതിർപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μερισθῇ
  choice: വിഭജിക്കപ്പെട്ടാൽ
  rationale: ἐὰν-നുശേഷമുള്ള aorist passive subjunctive ഒരു പൊതുവായ വ്യവസ്ഥ പ്രകടിപ്പിക്കുന്നു. ‘വിഭജിക്കപ്പെട്ടാൽ’ കർമണിപ്രയോഗവും ആന്തരിക പിളർപ്പിന്റെ ആശയവും നിലനിർത്തുന്നു.
- source_word: δυνήσεται
  choice: കഴിയുകയില്ല
  rationale: οὐ δυνήσεται ഭാവിയിലെ കഴിവില്ലായ്മയെ സൂചിപ്പിക്കുന്നു; ‘കഴിയുകയില്ല’ അതിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപമാണ്.
- source_word: σταθῆναι
  choice: നിലനിൽക്കാൻ
  rationale: ഇവിടെ ‘നിൽക്കുക’ എന്ന രൂപകം തകരാതെ തുടരുക, അതിജീവിക്കുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്നു. ‘നിലനിൽക്കാൻ’ ഈ രൂപകവും ആശയവും സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἡ οἰκία ἐκείνη
  choice: ആ വീട്
  rationale: ἐκείνη എന്ന നിർദേശകപദത്തിന്റെ ഊന്നൽ ‘ആ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: καὶ ἐὰν
  choice: …എങ്കിൽ/…ആൽ
  rationale: καί മുൻവാക്യത്തിലെ വാദത്തിന്റെ തുടർച്ചയും ἐὰν വ്യവസ്ഥയും അടയാളപ്പെടുത്തുന്നു. ഒറ്റവാക്യ ഉദ്ധരണിയിൽ മലയാളത്തിലെ ‘-ആൽ’ വ്യവസ്ഥ സ്വാഭാവികമാണ്; സന്ദർഭത്തിലെ തുടർച്ച അർഥത്തിൽ നിലനിൽക്കുന്നു.
