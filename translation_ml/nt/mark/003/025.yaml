translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘തനിക്കുതന്നെ എതിരായി’ ആന്തരിക വിഭജനത്തെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘നിലനിൽക്കാൻ’ കെട്ടിടരൂപകത്തോടൊപ്പം തുടർന്നുനിൽക്കുക എന്ന ആശയവും സൂക്ഷിക്കുന്നു.
