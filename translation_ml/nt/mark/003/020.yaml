  text: Καὶ ⸀ἔρχεται εἰς οἶκον· καὶ συνέρχεται πάλιν ⸀ὁ ὄχλος, ὥστε μὴ δύνασθαι αὐτοὺς ⸀μηδὲ ἄρτον φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: ml
  text: അവൻ ഒരു വീട്ടിലേക്കു വരുന്നു[a]. വീണ്ടും ജനക്കൂട്ടം കൂടിവരുന്നു; അങ്ങനെ അവർക്കു ഭക്ഷണം കഴിക്കാൻപോലും കഴിയുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീട്ടിലേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഒരു വീട്ടിലേക്ക്’ എന്നാണ്; എങ്കിലും ഈ പ്രയോഗത്തിന് സന്ദർഭാനുസരണം വീട്ടിലേക്ക് മടങ്ങിവരുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘അപ്പം കഴിക്കാൻപോലും’; അതായത്, ഭക്ഷണം കഴിക്കാൻപോലും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാല ശൈലി നിലനിർത്തുന്നു; മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ വർത്തമാനകാല ക്രിയയാണ്.
- source_word: εἰς οἶκον
  choice: ഒരു വീട്ടിലേക്കു
  rationale: οἶκον എന്ന പദത്തിന് നിർദ്ദിഷ്ട ഉപപദമോ ഉടമസ്ഥസൂചനയോ ഇല്ലാത്തതിനാൽ ‘ഒരു വീട്ടിലേക്കു’ എന്നു നൽകി; ‘വീട്ടിലേക്കു/സ്വന്തം വീട്ടിലേക്കു’ എന്ന് അതിനിർണ്ണയിക്കുന്നില്ല.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: വീണ്ടും ജനക്കൂട്ടം കൂടിവരുന്നു
  rationale: ജനക്കൂട്ടം ഒരിടത്ത് ഒത്തുചേരുന്നതും πάλιν സൂചിപ്പിക്കുന്ന ആവർത്തനവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: അതിനാൽ അവർക്കു ... കഴിയുന്നില്ല
  rationale: ὥστε + infinitive സൂചിപ്പിക്കുന്ന ഫലം വ്യക്തമാക്കുന്നു. αὐτούς ആരെല്ലാമെന്നത് പാഠം വിശദമായി നിർണ്ണയിക്കാത്തതിനാൽ ‘അവർക്കു’ എന്നു തന്നെയാക്കി.
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: ഭക്ഷണം കഴിക്കാൻപോലും
  rationale: ἄρτον അക്ഷരാർഥത്തിൽ ‘അപ്പം’ ആണെങ്കിലും ഇവിടെ ഭക്ഷണം/ഒരു നേരത്തെ ആഹാരം കഴിക്കുക എന്ന സാധാരണ പ്രയോഗാർഥമാണ്; ആ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
