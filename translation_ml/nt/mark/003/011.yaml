    text: അല്ലെങ്കിൽ, “അവന്റെ മുമ്പിലേക്ക് തങ്ങളെത്തന്നെ എറിഞ്ഞുവീണു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളുടെ മുമ്പിൽ കീഴടങ്ങിയോ അപേക്ഷിച്ചോ വീഴുക എന്ന അർഥവും വരാം.
