revisions:
- from: അശുദ്ധാത്മാക്കൾ അവനെ കാണുമ്പോഴെല്ലാം, അവന്റെ മുമ്പിൽ വീണ്[a], “നീ ദൈവപുത്രനാണ്” എന്നു നിലവിളിക്കുമായിരുന്നു.
  to: അശുദ്ധാത്മാക്കൾ അവനെ കാണുമ്പോഴെല്ലാം അവന്റെ മുമ്പിൽ വീഴുകയും, “നീ ദൈവത്തിന്റെ പുത്രനാണ്” എന്നു നിലവിളിക്കുകയും ചെയ്യുമായിരുന്നു.
  rationale: The revision preserves the source's iterative aspect and the noncommittal physical sense of προσπίπτω, while improving Malayalam clause coordination. It also renders the genitive title explicitly and smooths the lexical-alternative footnote. No theological interpretation has been added.
