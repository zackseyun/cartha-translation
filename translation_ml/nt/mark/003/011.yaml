id: MRK.3.11
reference: Mark 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: ml
  text: അശുദ്ധാത്മാക്കൾ അവനെ കാണുമ്പോഴെല്ലാം അവന്റെ മുമ്പിൽ വീഴുകയും, “നീ ദൈവത്തിന്റെ പുത്രനാണ്” എന്നു നിലവിളിക്കുകയും ചെയ്യുമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: അശുദ്ധാത്മാക്കൾ
  rationale: ἀκάθαρτα എന്ന പദത്തിന്റെ അശുദ്ധി എന്ന നേരിട്ടുള്ള അർഥവും സുവിശേഷങ്ങളിലെ സ്ഥിരമായ പ്രയോഗവും നിലനിർത്തുന്നു; ‘ദുരാത്മാക്കൾ’ എന്ന വ്യാഖ്യാനാത്മക പദത്തേക്കാൾ മൂലഭാഷയോട് അടുത്തതാണ്.
- source_word: ὅταν
  choice: കാണുമ്പോഴെല്ലാം
  rationale: തുടർന്നുവരുന്ന അപൂർണഭൂതകാല ക്രിയകളോടൊപ്പം ὅταν ആവർത്തിച്ചുണ്ടായ സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘-മ്പോഴെല്ലാം’ ഓരോ തവണയും സംഭവിച്ച പ്രതികരണം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐθεώρουν
  choice: കാണുമ്പോൾ
  rationale: θεωρέω നിരീക്ഷിച്ചു കാണുക എന്ന സൂക്ഷ്മത ഉൾക്കൊള്ളാമെങ്കിലും, ഈ കഥാസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘കാണുക’ മതിയാകുന്നു.
- source_word: προσέπιπτον αὐτῷ
  choice: അവന്റെ മുമ്പിൽ വീണ്
  rationale: യേശുവിന്റെ മുമ്പിൽ നിലത്തുവീഴുന്ന ശാരീരിക പ്രവൃത്തി വ്യക്തമാക്കുന്നു; അതിനെ ആരാധനയെന്നോ സ്വമേധയായുള്ള വണക്കം എന്നോ നിർണയിക്കുന്നില്ല.
- source_word: ἔκραζον λέγοντα
  choice: എന്നു നിലവിളിക്കുമായിരുന്നു
  rationale: κράζωയുടെ ശക്തമായ ശബ്ദപ്രകടനവും λέγοντα അവതരിപ്പിക്കുന്ന വാക്കുകളും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു; ‘-ക്കുമായിരുന്നു’ ആവർത്തനസ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: Σὺ εἶ
  choice: നീ … ആണ്
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന ഗ്രീക്ക് സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക നേരിട്ടുള്ള പ്രസ്താവനയിൽ നിലനിൽക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: പ്രയോഗത്തിന്റെ സ്ഥാനപരവും ക്രിസ്തുവിനെ സംബന്ധിച്ചതുമായ ഭാരം നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും വ്യക്തവുമായ രൂപമാണിത്.
theological_decisions:
- issue: അശുദ്ധാത്മാക്കൾ യേശുവിന്റെ മുമ്പിൽ വീണ പ്രവൃത്തിയെ ആരാധനയായി വിവർത്തനം ചെയ്യണമോ
  choice: ‘അവന്റെ മുമ്പിൽ വീണ്’ എന്ന് ശാരീരിക പ്രവൃത്തിയായി വിവർത്തനം ചെയ്തു.
  alternative: ‘അവനെ ആരാധിച്ചു’ അല്ലെങ്കിൽ ‘അവനെ വണങ്ങി’
  rationale: προσπίπτω എന്ന ക്രിയ ആദരം, അപേക്ഷ, കീഴടങ്ങൽ എന്നിവയിൽ ഒരാളുടെ മുമ്പിൽ വീഴുന്നതിനെ സൂചിപ്പിക്കാം. ഈ വാക്യം അതിനെ വ്യക്തമായി ആരാധനയെന്ന് നിർവചിക്കാത്തതിനാൽ, വിവർത്തനം ദൈവശാസ്ത്രപരമായ അർഥം മുൻകൂട്ടി തീരുമാനിക്കാതെ പ്രവൃത്തി മാത്രം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘കാണുമ്പോഴെല്ലാം’ എന്നും ‘നിലവിളിക്കുമായിരുന്നു’ എന്നും ഉപയോഗിച്ച് ഗ്രീക്കിലെ ആവർത്തനസ്വഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
