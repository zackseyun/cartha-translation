id: MRK.3.30
reference: Mark 3:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἔλεγον· Πνεῦμα ἀκάθαρτον ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/030.yaml
  text: because they were saying[a], “He has an unclean spirit.”
translation:
  language: ml
  text: കാരണം, “അവന് അശുദ്ധാത്മാവുണ്ട്” എന്ന് അവർ പറഞ്ഞുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യവഹാരഭാഷയിൽ: “അവനെ അശുദ്ധാത്മാവ് ബാധിച്ചിരിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ യേശു പറഞ്ഞ വിധിക്കുള്ള കാരണം ഇവിടെ നൽകുന്നതിനാൽ, കാരണസൂചകമായ അർഥം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർന്നോ ആവർത്തിച്ചോ നടന്ന പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ഒറ്റത്തവണ പറഞ്ഞുവെന്നതിലുപരി ഈ കാലഭാവം നിലനിർത്തുന്നു.
- source_word: Πνεῦμα ἀκάθαρτον
  choice: അശുദ്ധാത്മാവ്
  rationale: സുവിശേഷങ്ങളിൽ ദുഷ്ടാത്മാവിനെ സൂചിപ്പിക്കുന്ന പതിവുപദപ്രയോഗമാണിത്; ἀκάθαρτος എന്നതിന്റെ ‘അശുദ്ധ’ എന്ന അടിസ്ഥാനാർഥവും നിലനിർത്തുന്നു.
- source_word: ἔχει
  choice: ഉണ്ട്
  rationale: ഗ്രീക്കിൽ നേരിട്ട് ‘ഉണ്ട്/ഉള്ളവനാണ്’ എന്ന അർഥമാണ്. ബാധിച്ചിരിക്കുന്നു എന്ന വ്യാഖ്യാനവികാസം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ മൂലത്തിന്റെ സംക്ഷിപ്തത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെതിരായ ആരോപണത്തിന്റെ സ്വഭാവം
  choice: “അവന് അശുദ്ധാത്മാവുണ്ട്” എന്ന നേരിട്ടുള്ള ആരോപണം നിലനിർത്തുക
  alternative: “അവനെ അശുദ്ധാത്മാവ് ബാധിച്ചിരിക്കുന്നു”
  rationale: എതിരാളികളുടെ ഞെട്ടിക്കുന്ന ആരോപണം മൂലപാഠത്തിന്റെ അതേ നേരിട്ടുള്ള രൂപത്തിൽ നൽകുന്നു. ‘ബാധിച്ചിരിക്കുന്നു’ എന്നത് സന്ദർഭാർഥം വ്യക്തമാക്കുമെങ്കിലും ἔχει എന്ന ലളിതക്രിയയെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന രൂപം ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചയോ ആവർത്തനമോ സംരക്ഷിക്കുന്നു; ‘അശുദ്ധാത്മാവ്’ പുതിയനിയമത്തിലെ പരിചിതമായ പദപ്രയോഗം നിലനിർത്തുന്നു.
