reference: Mark 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: ml
  text: 'അവൻ അവരോട് ചോദിച്ചു: “ശബ്ബത്തിൽ[a] നന്മ ചെയ്യുന്നതോ തിന്മ ചെയ്യുന്നതോ, ജീവൻ രക്ഷിക്കുന്നതോ കൊല്ലുന്നതോ നിയമാനുസൃതമാണോ?” അവരോ മൗനം പാലിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ശബ്ബത്തുകളിൽ”; ഇവിടെ “ശബ്ബത്തിൽ” എന്ന അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന സാധാരണ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔξεστιν
  choice: നിയമാനുസൃതമാണോ
  rationale: ശബ്ബത്താചരണത്തെക്കുറിച്ചുള്ള നിയമപരവും ധാർമികവുമായ തർക്കസന്ദർഭത്തിൽ, നിയമമോ അംഗീകൃത ആചാരമോ അനുവദിക്കുന്നതെന്തെന്ന ചോദ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῖς σάββασιν
  choice: ശബ്ബത്തിൽ
  rationale: ഗ്രീക്കിൽ ബഹുവചനരൂപമാണെങ്കിലും, ഒരു ശബ്ബത്തുദിനത്തെ സൂചിപ്പിക്കാൻ ഉപയോഗിക്കുന്ന സാധാരണ കൊയ്നേ പ്രയോഗമാണിത്. സന്ദർഭത്തിൽ മലയാളത്തിലെ ഏകവചനം വ്യക്തവും സ്വാഭാവികവുമാണ്; രൂപപരമായ വിവരം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀγαθοποιῆσαι
  choice: നന്മ ചെയ്യുന്നതോ
  rationale: നല്ലതോ ഉപകാരപ്രദമായതോ ചെയ്യുക എന്ന ക്രിയാത്മക അർഥം ലളിതമായും നേരിട്ടും നൽകുന്നു.
- source_word: κακοποιῆσαι
  choice: തിന്മ ചെയ്യുന്നതോ
  rationale: ἀγαθοποιῆσαι എന്നതിനോടുള്ള നൈതിക വിരുദ്ധത നിലനിർത്തുന്നു; ഉപദ്രവിക്കുക എന്ന സന്ദർഭാർഥവും ഉൾക്കൊള്ളാൻ കഴിയുന്നു.
- source_word: ψυχὴν σῶσαι
  choice: ജീവൻ രക്ഷിക്കുന്നതോ
  rationale: കൊല്ലുക എന്ന തുടർന്നുള്ള വിരുദ്ധപ്രയോഗം കണക്കിലെടുക്കുമ്പോൾ ψυχή ഇവിടെ അഭൗതികമായ ആത്മാവിനേക്കാൾ ഒരാളുടെ ജീവനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀποκτεῖναι
  choice: കൊല്ലുന്നതോ
  rationale: മൂലക്രിയയുടെ അടിസ്ഥാനാർഥം അതേപടി നൽകുന്നു; ‘കൊലചെയ്യുക’ എന്ന കുറ്റനിയമപരമായ അധിക സൂചന ചേർക്കുന്നില്ല.
- source_word: ἐσιώπων
  choice: മൗനം പാലിച്ചു
  rationale: ചോദ്യത്തിന് മറുപടി നൽകാതെ തുടർന്നിരുന്ന അവരുടെ നിശ്ശബ്ദതയെ അപൂർണ്ണഭൂതകാലത്തിന്റെ വിവരണഭാവത്തോടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശബ്ബത്തിനെക്കുറിച്ചുള്ള നിയമ-ധാർമിക ചോദ്യത്തിന്റെ രൂപം
  choice: നന്മ/തിന്മ, ജീവൻ രക്ഷിക്കൽ/കൊല്ലൽ എന്നീ വിരുദ്ധജോടികളെ തുറന്ന ചോദ്യമായി നിലനിർത്തി
  alternative: യേശു നന്മ ചെയ്യുന്നതു മാത്രമാണ് നിയമാനുസൃതമെന്ന് പ്രസ്താവിച്ചതായി നേരിട്ട് വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യുക
  rationale: മൂലപാഠം ചോദ്യം തന്നെയാണ് അവതരിപ്പിക്കുന്നത്; അതിന്റെ വാഗ്മിത്വവും ധാർമിക പിരിമുറുക്കവും വിവർത്തനം മുൻകൂട്ടി പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: τοῖς σάββασιν എന്ന ബഹുവചന ശബ്ബത്ത് പ്രയോഗം
  choice: മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ഏകവചനം ‘ശബ്ബത്തിൽ’; ഗ്രീക്ക് ബഹുവചനം അടിക്കുറിപ്പിൽ
  alternative: ‘ശബ്ബത്തുകളിൽ’ എന്ന് രൂപപരമായി ബഹുവചനം നിലനിർത്തുക
  rationale: ഇവിടെ ഗ്രീക്ക് ബഹുവചനം സാധാരണ ഇടിയമാണ്; മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചാൽ പല ശബ്ബത്തുദിനങ്ങളെക്കുറിച്ചുള്ള പൊതുചോദ്യമെന്ന തെറ്റായ ധാരണയ്ക്കിടയാക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചരിത്രവർത്തമാനമായ λέγει സ്വാഭാവിക മലയാള ആഖ്യാനശൈലിയിൽ ‘ചോദിച്ചു’ എന്നു നൽകി; ചോദ്യം ഉന്നയിക്കുന്നതാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ഇത് സ്വാഭാവികമാണ്.
