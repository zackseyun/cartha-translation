source:
  edition: SBLGNT
  text: καὶ πολλὰ ἐπετίμα αὐτοῖς ἵνα μὴ ⸂αὐτὸν φανερὸν⸃ ⸀ποιήσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: ml
  text: തന്നെ പരസ്യമാക്കരുതെന്ന് അവൻ അവരോട് പലതവണ കർശനമായി താക്കീത് ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്നെ വെളിപ്പെടുത്തരുതെന്ന്,” “തന്നെ അറിയപ്പെടുമാറാക്കരുതെന്ന്,” അല്ലെങ്കിൽ കൂടുതൽ ഔപചാരികമായി, “തന്നെ പ്രകടമാക്കരുതെന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: പലതവണ
  rationale: ἐπετίμα എന്ന ക്രിയയോടൊപ്പം ക്രിയാവിശേഷണമായി ഉപയോഗിച്ചിരിക്കുന്ന നപുംസകലിംഗ ബഹുവചനം ആവർത്തിച്ചോ ശക്തമായോ ഉള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സ്വാഭാവികമായി ആവർത്തനഭാവം നൽകാൻ ‘പലതവണ’ തിരഞ്ഞെടുത്തു.
- source_word: ἐπετίμα
  choice: കർശനമായി കല്പിച്ചു
  rationale: അശുദ്ധാത്മാക്കളോടുള്ള ശക്തമായ വിലക്കും അധികാരപൂർവമായ ആജ്ഞയും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു. ‘ശാസിച്ചു’ എന്നത് സാധ്യമെങ്കിലും, ഇവിടെ ἵνα μὴ എന്ന വിലക്കിന്റെ ഉള്ളടക്കത്തോട് ‘കർശനമായി കല്പിച്ചു’ കൂടുതൽ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിലെ അശുദ്ധാത്മാക്കളെയാണ് ദത്തിവ് ബഹുവചന സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: ἵνα μὴ
  choice: ചെയ്യരുതെന്ന്
  rationale: കല്പനയുടെ ഉള്ളടക്കമായ വിലക്കിനെ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: തന്നെ പരസ്യമാക്കുക
  rationale: φανερὸν ποιέω എന്ന പ്രയോഗം ഒരാളെ വെളിപ്പെടുത്തുക, അറിയപ്പെടുമാറാക്കുക, പരസ്യമാക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ‘തന്നെ പരസ്യമാക്കുക’ പൊതുവായ വെളിപ്പെടുത്തലിന്റെ ഭാവം നിലനിർത്തുകയും യേശുവിന്റെ വ്യക്തിത്വത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അശുദ്ധാത്മാക്കളോടുള്ള യേശുവിന്റെ കല്പനയുടെ സ്വഭാവം
  choice: യേശുവിനെ പരസ്യമായി അറിയിക്കരുതെന്ന വിലക്കായി പരിഭാഷപ്പെടുത്തി; അവർ എന്ത് പദവി വെളിപ്പെടുത്തുമായിരുന്നു എന്ന് വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
  alternative: ‘ദൈവപുത്രനാണെന്ന് വെളിപ്പെടുത്തരുത്’ എന്ന് മുൻവാക്യത്തിലെ പ്രഖ്യാപനം ഇവിടെ വിശദമായി ആവർത്തിക്കുക; അല്ലെങ്കിൽ തിരിച്ചറിയൽ വെളിപ്പെടുത്തലിന് ഊന്നൽ നൽകാതെ പൊതുവായ മൗനകല്പനയായി മാത്രം പറയുക.
  rationale: അടുത്ത സന്ദർഭം യേശുവിന്റെ വ്യക്തിത്വത്തിന്റെ വെളിപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യം αὐτὸν φανερὸν ποιήσωσιν എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ ക്രിസ്തുശാസ്ത്രപരമായ വിശദീകരണം ഇറക്കുമതി ചെയ്യാതെ മൂലപാഠത്തിന്റെ പരിധിയും ഉദ്ദേശപൂർവമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘കർശനമായി കല്പിച്ചു’ അധികാരപൂർവമായ വിലക്ക് വ്യക്തമാക്കുന്നു; ‘പരസ്യമാക്കുക’ പൊതുവായ വെളിപ്പെടുത്തലിന്റെ അർഥപരിധി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ [a] ആയി ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
