  to: ജനക്കൂട്ടം കാരണം, ഒരു ചെറിയ വള്ളം തനിക്കായി സജ്ജമായി നിർത്തണമെന്ന് യേശു തന്റെ ശിഷ്യന്മാരോടു പറഞ്ഞു; ജനക്കൂട്ടം തന്നെ ഞെരുക്കാതിരിക്കേണ്ടതിന്.[a]
  rationale: The revision separates the crowd as the reason for keeping the boat ready from the purpose of avoiding physical pressure by the crowd. It preserves the source's ambiguity in the implicit subject of the final clause by explicitly identifying it as the crowd, as the context requires in Malayalam.
