translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രണ്ടു ἵνα ഘടകങ്ങളുടെ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ കാരണം/ഉദ്ദേശ്യം ആദ്യം വെച്ചു; യേശു എന്ന കർത്താവ് മുൻവാക്യസന്ദർഭത്തിൽ നിന്നു ലഭ്യമെങ്കിലും സ്വതന്ത്ര വാക്യവായനയ്ക്ക് വ്യക്തത നൽകാൻ പേര് ചേർത്തു. അടിക്കുറിപ്പുസൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
