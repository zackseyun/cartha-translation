source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: ml
  text: ജനക്കൂട്ടം കാരണം, ഒരു ചെറിയ വള്ളം തനിക്കായി സജ്ജമായി നിർത്തണമെന്ന് യേശു തന്റെ ശിഷ്യന്മാരോടു പറഞ്ഞു; ജനക്കൂട്ടം തന്നെ ഞെരുക്കാതിരിക്കേണ്ടതിന്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെമേൽ അമർത്താതിരിക്കേണ്ടതിന്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് അമർത്തുക, തിക്കിഞെരുക്കുക, അല്ലെങ്കിൽ സമ്മർദത്താൽ ചതയ്ക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: മലയാളത്തിൽ പരോക്ഷ നിർദേശത്തോടൊപ്പം സ്വാഭാവികമായി ചേരുന്ന സാധാരണ ക്രിയ; സന്ദർഭത്തിൽ നിർദേശത്തിന്റെ ഭാവം വാക്യഘടന വ്യക്തമാക്കുന്നു.
- source_word: μαθηταῖς
  choice: ശിഷ്യന്മാരോട്
  rationale: സുവിശേഷസന്ദർഭത്തിലെ ഗുരു–അനുയായി ബന്ധം കാത്തുസൂക്ഷിക്കുന്ന സ്ഥിരവും സ്വാഭാവികവുമായ മലയാള പദം.
- source_word: πλοιάριον
  choice: ഒരു ചെറിയ വള്ളം
  rationale: πλοιάριον എന്ന പദത്തിലെ ചെറുപ്പത്തിന്റെ സൂചന നിലനിർത്തുകയും ഗലീലക്കടൽസന്ദർഭത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: προσκαρτερῇ
  choice: ഒരുക്കി നിർത്തണമെന്ന്
  rationale: വള്ളം തുടർച്ചയായി സമീപത്ത് സജ്ജവും ലഭ്യവുമായി ഇരിക്കണമെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: αὐτῷ
  choice: തനിക്കായി
  rationale: വള്ളം യേശുവിന്റെ ഉപയോഗത്തിനായി ലഭ്യമായിരിക്കണമെന്ന ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διὰ τὸν ὄχλον
  choice: ജനക്കൂട്ടം ... എന്നതിനായി/ജനക്കൂട്ടം കാരണം
  rationale: വാക്യത്തിൽ ഉദ്ദേശ്യവാക്യവുമായി ചേർത്ത് ‘ജനക്കൂട്ടം തന്നെ ഞെരുക്കാതിരിക്കേണ്ടതിന്’ എന്നു നൽകിയിരിക്കുന്നു; ജനക്കൂട്ടം മൂലമുള്ള സാഹചര്യം വ്യക്തമാകുന്നു.
- source_word: θλίβωσιν
  choice: ഞെരുക്കാതിരിക്കേണ്ടതിന്
  rationale: ശാരീരികമായി അമർത്തുക, തിക്കിഞെരുക്കുക, ചതയ്ക്കുക എന്നീ അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; അതിശക്തമായ ‘ചതയ്ക്കുക’ മാത്രം തിരഞ്ഞെടുത്ത് അർഥം ചുരുക്കുന്നില്ല.
