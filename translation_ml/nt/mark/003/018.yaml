  naturalness: ‘കനാനായൻ എന്നു വിളിക്കപ്പെട്ട ശിമോൻ’ എന്നതിനെക്കാൾ ‘കനാനായനായ ശിമോൻ’ പട്ടികയിലെ മറ്റു വിശേഷണ-നാമഘടനകളോട് ചേർന്നുനിൽക്കുന്നതും കൂടുതൽ നേരിട്ടുള്ളതുമാണ്. ‘അന്ത്രയോസ്’ എന്ന രൂപം മലയാളത്തിലെ സാധാരണ സ്ഥാപിത നാമരൂപമായ ‘അന്ത്രെയാസ്’ ആക്കുന്നതും ഉചിതമാണ്.
  terminology: Καναναῖος-നെ പ്രധാനവാചകത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നത് മർക്കോസിന്റെ പ്രത്യേക പദരൂപത്തെ സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പിൽ അതിന്റെ സാധ്യതയുള്ള അരമായ പശ്ചാത്തലവും ലൂക്കോസ് 6:15-ലെ ‘തീക്ഷ്ണാഭിമാനി’ (ζηλωτής) എന്ന സമാന്തരവിശേഷണവും വ്യക്തമാക്കണം; അതിനെ കനാൻദേശ/കനാന്യ വംശസൂചനയായി ഉറപ്പിക്കരുത്.
