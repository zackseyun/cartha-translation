  to: അന്ത്രെയാസിനെയും ഫിലിപ്പോസിനെയും ബർത്തൊലൊമായിയെയും മത്തായിയെയും തോമസിനെയും അൽഫായിയുടെ മകനായ യാക്കോബിനെയും തദ്ദായിയെയും കനാനായനായ ശിമോനെയും[a]—
  rationale: പേരുകളുടെ പട്ടികയും വാക്യത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന ദീർഘരേഖയും നിലനിർത്തി. Καναναῖος-നെ പ്രധാനവാചകത്തിൽ അർത്ഥപരിഭാഷ ചെയ്യാതെ ലിപ്യന്തരണമായി സംരക്ഷിച്ചു; എന്നാൽ ഗ്രീക്കിൽ ഇല്ലാത്ത ‘വിളിക്കപ്പെട്ട’ ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചരിത്ര-ഭാഷാപരമായ അർത്ഥസാധ്യത കൂടുതൽ കൃത്യമായി അവതരിപ്പിക്കുന്നു.
