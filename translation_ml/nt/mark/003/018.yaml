id: MRK.3.18
reference: Mark 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: ml
  text: അന്ത്രെയാസിനെയും ഫിലിപ്പോസിനെയും ബർത്തൊലൊമായിയെയും മത്തായിയെയും തോമസിനെയും അൽഫായിയുടെ മകനായ യാക്കോബിനെയും തദ്ദായിയെയും കനാനായനായ ശിമോനെയും[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘കനനയോസ്’ (കനാനായൻ). ഇത് അരമായ ഭാഷയിലെ ‘തീക്ഷ്ണാഭിമാനി’ അഥവാ ‘ഉത്സാഹി’ എന്നർത്ഥമുള്ള പദത്തിന്റെ രൂപമായിരിക്കാം; ലൂക്കോസ് 6:15-ൽ ഈ ശിമോനെ ‘തീക്ഷ്ണാഭിമാനി’ എന്നു വിളിക്കുന്നു. അതിനാൽ ഇവിടെ ‘കനാന്യൻ’ എന്ന വംശീയമോ ഭൂമിശാസ്ത്രപരമോ ആയ സൂചന ഉദ്ദേശിക്കുന്നില്ലെന്നാണ് സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -യെയും / -നെയും
  rationale: ഗ്രീക്കിലെ ആവർത്തിതമായ καὶ കൊണ്ടുള്ള പട്ടികാശൈലി മലയാളത്തിൽ ഓരോ പേരോടും ചേർക്കുന്ന ‘-യെയും/-നെയും’ എന്ന സമുച്ചയപ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ἀνδρέαν
  choice: അന്ത്രയോസ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ഗ്രീക്ക് പേരുരൂപം സ്വീകരിച്ചു; വാക്യത്തിലെ കർമസ്ഥാനത്തിന് ‘അന്ത്രയോസിനെയും’ എന്നു രൂപപ്പെടുത്തി.
- source_word: Φίλιππον
  choice: ഫിലിപ്പോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം.
- source_word: Βαρθολομαῖον
  choice: ബർത്തൊലൊമായി
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന് മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണരൂപം.
- source_word: Μαθθαῖον
  choice: മത്തായി
  rationale: ആധുനിക മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ പേരുരൂപം.
- source_word: Θωμᾶν
  choice: തോമസ്
  rationale: മലയാളത്തിൽ വ്യാപകമായി ഉപയോഗിക്കുന്ന സ്വാഭാവിക പേരുരൂപം.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: അൽഫായിയുടെ മകനായ യാക്കോബ്
  rationale: ലേഖനപദത്തോടുകൂടിയ ജനിറ്റീവ് ഘടന പിതൃബന്ധം സൂചിപ്പിക്കുന്നു; അത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി തുറന്നുപറയുന്നു.
- source_word: Θαδδαῖον
  choice: തദ്ദായി
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: കനാനായൻ എന്നു വിളിക്കപ്പെട്ട ശിമോൻ
  rationale: മർക്കോസിലെ അപൂർവമായ Καναναῖος എന്ന വിശേഷണം നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും അതിനെ വംശീയമായ ‘കനാന്യൻ’ എന്നു തെറ്റിദ്ധരിക്കാതിരിക്കാൻ വിളിപ്പേരായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു; സാധ്യതയുള്ള അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ശിമോന്റെ Καναναῖος എന്ന വിശേഷണത്തിന്റെ അർത്ഥം
  choice: പ്രധാനവാചകത്തിൽ ‘കനാനായൻ’ എന്ന ശബ്ദരൂപം നിലനിർത്തി, സാധ്യതയുള്ള ‘തീക്ഷ്ണതയുള്ളവൻ/Zealot’ എന്ന അർത്ഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘തീക്ഷ്ണതയുള്ള ശിമോൻ’ അല്ലെങ്കിൽ ‘എരിവുകാരനായ ശിമോൻ’ എന്നു നേരിട്ട് അർത്ഥപരിഭാഷ ചെയ്യുക.
  rationale: ലൂക്കോസ് 6:15-ലെ ζηλωτής ഈ വിശേഷണത്തിന്റെ സാധ്യതയുള്ള അർത്ഥം വ്യക്തമാക്കുന്നുവെങ്കിലും, മർക്കോസ് ഇവിടെ വേറിട്ട ഗ്രീക്ക് രൂപമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ മൂലപാഠത്തിന്റെ രൂപവും ചരിത്രപരമായ അർത്ഥസാധ്യതയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഈ വാക്യം മുമ്പത്തെ വാക്യത്തിൽ ആരംഭിച്ച കർമപട്ടികയുടെ തുടർച്ചയായതിനാൽ പേരുകൾക്ക് ‘-യെയും/-നെയും’ ചേർത്തു; അവസാനത്തിലെ ദീർഘരേഖ പട്ടിക അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതു സൂചിപ്പിക്കുന്നു.
