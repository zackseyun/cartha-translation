translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. മർക്കൊസിന്റെ ചരിത്രവർത്തമാനകാലം സംരക്ഷിച്ചിരിക്കുന്നു. ഗ്രീക്കിൽ ഒരു മാത്രം ആജ്ഞാരൂപമുണ്ടെങ്കിലും അതിന്റെ എഴുന്നേൽക്കലും നടുവിലേക്കുള്ള ചലനവും മലയാളത്തിൽ സ്വാഭാവികമായി ‘എഴുന്നേറ്റ് ... വരിക’ എന്നു നൽകിയിരിക്കുന്നു.
