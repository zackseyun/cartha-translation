  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: ml
  text: 'അവൻ ശോഷിച്ച കൈയുള്ള ആ മനുഷ്യനോട് പറയുന്നു: “എഴുന്നേറ്റ് നടുവിലേക്ക് വരിക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നടുവിൽ നിൽക്കുക”; കൂടുതൽ സ്വാഭാവികമായി, “മുന്നോട്ടു വരിക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കൊസിന്റെ സജീവമായ ആഖ്യാനശൈലിയിലുള്ള ചരിത്രവർത്തമാനകാലം മലയാളത്തിലും വർത്തമാനകാലമായി നിലനിർത്തുന്നു.
- source_word: ἀνθρώπῳ
  choice: ആ മനുഷ്യനോട്
  rationale: സന്ദർഭത്തിലെ നിർദിഷ്ട പുരുഷനെ സ്വാഭാവികവും ലിംഗപരമായി കൃത്യവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: വരണ്ട കൈയുള്ള
  rationale: ഗ്രീക്ക് പങ്കാളിത്തപ്രയോഗത്തെ മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണഘടനയായി നൽകുന്നു; അവസ്ഥയെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ξηράν
  choice: വരണ്ട
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘ഉണങ്ങിയ/വരണ്ട’ എന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു; പ്രവർത്തനശേഷി നഷ്ടപ്പെട്ട കൈയെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിലും മലയാളത്തിൽ ഗ്രാഹ്യമാണ്.
- source_word: Ἔγειρε
  choice: എഴുന്നേറ്റ്
  rationale: ἐγείρω എന്ന ആജ്ഞയുടെ ‘എഴുന്നേൽക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς τὸ μέσον
  choice: നടുവിലേക്കു വരിക
  rationale: εἰς സൂചിപ്പിക്കുന്ന ചലനവും τὸ μέσον എന്നതിന്റെ ‘നടുവ്’ എന്ന സ്ഥലാർഥവും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ആജ്ഞയായി അവതരിപ്പിക്കുന്നു.
