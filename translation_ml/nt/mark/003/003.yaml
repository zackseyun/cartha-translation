- from: 'അവൻ വരണ്ട കൈയുള്ള ആ മനുഷ്യനോട് പറയുന്നു: “എഴുന്നേറ്റ് നടുവിലേക്കു വരിക.”'
  to: 'അവൻ ശോഷിച്ച കൈയുള്ള ആ മനുഷ്യനോട് പറയുന്നു: “എഴുന്നേറ്റ് നടുവിലേക്ക് വരിക.”[a]'
  rationale: «ശോഷിച്ച» replaces the potentially misleadingly literal «വരണ്ട» for ξηράν in its bodily-condition context. The command remains a natural Malayalam rendering that preserves both rising and movement to the middle. A footnote anchor has been added to retain the documented alternative rendering.
