revisions:
- from: പിന്നെ യേശു മലമുകളിലേക്കു കയറി. താൻ ആഗ്രഹിച്ചവരെ തന്റെ അടുക്കലേക്കു വിളിച്ചു[a]; അവർ അവന്റെ അടുക്കലേക്കു ചെന്നു[b].
  to: പിന്നെ യേശു മലയിൽ കയറി; താൻ ആഗ്രഹിച്ചവരെ[a] തന്റെ അടുക്കലേക്കു വിളിച്ചു, അവർ അവന്റെ അടുക്കലേക്കു ചെന്നു[b].
  rationale: The revision removes the unwarranted implication that Jesus reached the mountain's summit, while preserving the source's ascent and all other semantic elements. It also relocates footnote a to the phrase containing the emphatic αὐτός, without changing the verse's meaning or resolving its theological implications beyond the text.
