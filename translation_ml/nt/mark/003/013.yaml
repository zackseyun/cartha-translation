id: MRK.3.13
reference: Mark 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: ml
  text: പിന്നെ യേശു മലയിൽ കയറി; താൻ ആഗ്രഹിച്ചവരെ[a] തന്റെ അടുക്കലേക്കു വിളിച്ചു, അവർ അവന്റെ അടുക്കലേക്കു ചെന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻതന്നെ ആഗ്രഹിച്ചവരെ.” ഗ്രീക്കിൽ ‘അവൻതന്നെ’ എന്നതിന് ഊന്നലുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവർ അവന്റെ അടുക്കലേക്കു വന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβαίνει
  choice: കയറി
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലം ചരിത്രവർത്തമാനമാണ്; മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിക്കായി ഭൂതകാലം ഉപയോഗിച്ചു. കയറിപ്പോകുന്ന ദിശയും നിലനിർത്തുന്നു.
- source_word: εἰς τὸ ὄρος
  choice: മലമുകളിലേക്കു
  rationale: ἀναβαίνει എന്ന ക്രിയയോടൊപ്പം ഇത് മലയുടെ മുകളിലേക്കുള്ള കയറ്റത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: προσκαλεῖται
  choice: തന്റെ അടുക്കലേക്കു വിളിച്ചു
  rationale: മധ്യമപ്രയോഗത്തിലെ വ്യക്തിപരമായ പങ്കാളിത്തവും സ്വയം അടുക്കലേക്കു വിളിക്കുന്ന ബന്ധപരമായ ഭാവവും ഈ വിവർത്തനം സംരക്ഷിക്കുന്നു.
- source_word: οὓς ἤθελεν αὐτός
  choice: താൻ ആഗ്രഹിച്ചവരെ
  rationale: പ്രകടമായ αὐτός നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ ‘താൻ’ സ്വാഭാവികമായി വഹിക്കുന്നു. ‘ആഗ്രഹിച്ചവർ’ θέλω എന്നതിന്റെ അർഥം നിലനിർത്തുന്നു; തിരഞ്ഞെടുപ്പിനെക്കുറിച്ചുള്ള വിപുലമായ സിദ്ധാന്തം വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: അവർ അവന്റെ അടുക്കലേക്കു ചെന്നു
  rationale: ἀπέρχομαι എന്ന ക്രിയയിലെ ‘പോകുക/ചെല്ലുക’ എന്ന ചലനാർഥം ‘ചെന്നു’ സംരക്ഷിക്കുന്നു; πρὸς αὐτόν ലക്ഷ്യം വ്യക്തമാക്കുന്നു. ദൃഷ്ടികോണനുസരിച്ച് ‘വന്നു’ എന്നും സാധ്യമാണ്.
theological_decisions:
- issue: വിളിക്കപ്പെട്ടവരെ സംബന്ധിച്ച യേശുവിന്റെ വ്യക്തിപരമായ ഇഷ്ടത്തിനുള്ള ഊന്നൽ
  choice: താൻ ആഗ്രഹിച്ചവരെ
  alternative: അവൻ ആഗ്രഹിച്ചവരെ
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘താൻ’ മുഖേന സൂക്ഷിച്ചു; എന്നാൽ ഈ വാക്യം പറയുന്നതിലപ്പുറം തിരഞ്ഞെടുപ്പിനെക്കുറിച്ചുള്ള ഏതെങ്കിലും സഭാപരമായ സിദ്ധാന്തം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തതയ്ക്കായി സന്ദർഭത്തിൽ വ്യക്തമായ കർത്താവായ ‘യേശു’ ചേർത്തു; മൂലത്തിലെ ഊന്നലും ചലനദൃഷ്ടികോണത്തിലെ സാധ്യതയും അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
