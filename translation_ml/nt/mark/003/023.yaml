id: MRK.3.23
reference: Mark 3:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: ml
  text: 'അവരെ തന്റെ അടുക്കലേക്കു വിളിച്ചശേഷം, അദ്ദേഹം ഉപമകളാൽ അവരോടു പറഞ്ഞു: “സാത്താൻ എങ്ങനെ സാത്താനെ പുറത്താക്കാൻ കഴിയും?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: അവരെ അടുത്തേക്കു വിളിച്ചിട്ട്
  rationale: ആദ്യം അവരെ തന്റെ അടുക്കലേക്കു വിളിച്ചശേഷം സംസാരിച്ചുവെന്ന ക്രമം aorist middle participle സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ആ ക്രമം നിലനിർത്തുന്നു.
- source_word: ἐν παραβολαῖς
  choice: ഉപമകളിലൂടെ
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ παραβολή ദൃഷ്ടാന്തപരമായ താരതമ്യങ്ങളെയും ഉപമാപരമായ വാക്കുകളെയും സൂചിപ്പിക്കുന്നു. ബഹുവചനം ആശയപരമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം സ്വീകരിക്കുന്നു.
- source_word: ἔλεγεν
  choice: സംസാരിച്ചു
  rationale: ഗ്രീക്കിലെ imperfect സംസാരത്തിന്റെ പുരോഗമന സ്വഭാവം സൂചിപ്പിക്കാമെങ്കിലും, ഈ ആമുഖവാക്യത്തിൽ മലയാളത്തിലെ ലളിത ഭൂതകാലം കൂടുതൽ സ്വാഭാവികമാണ്; തുടർന്നുള്ള സംഭാഷണത്തിന്റെ ആരംഭവും ഇത് വ്യക്തമാക്കുന്നു.
- source_word: Πῶς δύναται
  choice: എങ്ങനെ ... കഴിയും?
  rationale: സാധ്യതയെ ചോദ്യം ചെയ്യുന്ന ശക്തമായ വാഗ്‌ചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: Σατανᾶς
  choice: സാത്താന്
  rationale: വ്യക്തിനാമം/പദവി മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം അനുസരിച്ച് നൽകുന്നു; കർത്താവായും കർമമായും ഒരേ രൂപം സാഹചര്യത്തിലൂടെ തിരിച്ചറിയാം.
- source_word: ἐκβάλλειν
  choice: പുറത്താക്കാൻ
  rationale: മർക്കോസിലെ ഭൂതോച്ചാടനസന്ദർഭത്തിൽ ἐκβάλλω സൂചിപ്പിക്കുന്ന പുറത്താക്കൽ എന്ന അർഥം വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: സാത്താന് തനിക്കെതിരെ പ്രവർത്തിക്കുന്നതിനെക്കുറിച്ചുള്ള യേശുവിന്റെ ചോദ്യത്തിന്റെ ശക്തി
  choice: “സാത്താന് എങ്ങനെ സാത്താനെ പുറത്താക്കാൻ കഴിയും?” എന്ന അസാധ്യത സൂചിപ്പിക്കുന്ന വാഗ്‌ചോദ്യമായി നിലനിർത്തി.
  alternative: “സാത്താന് സാത്താനെ പുറത്താക്കാൻ സാധിക്കുമോ?”
  rationale: ഗ്രീക്ക് ചോദ്യം സാധ്യതയെ വെല്ലുവിളിക്കുകയും ആരോപണത്തിലെ പൊരുത്തക്കേട് തുറന്നുകാട്ടുകയും ചെയ്യുന്നു. വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അതിന്റെ വാഗ്‌ചോദ്യശക്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യേശുവിനെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ “അദ്ദേഹം” ഉപയോഗിച്ചു. ഈ വാക്യത്തിന് അടിക്കുറിപ്പ് ആവശ്യമായ ഗൗരവമുള്ള പാഠഭേദമോ നിർബന്ധമായ വിശദീകരണമോ ഇല്ല.
