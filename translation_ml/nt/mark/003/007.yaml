source:
  edition: SBLGNT
  text: Καὶ ὁ Ἰησοῦς ⸂μετὰ τῶν μαθητῶν αὐτοῦ ἀνεχώρησεν⸃ πρὸς τὴν θάλασσαν· καὶ πολὺ πλῆθος ἀπὸ τῆς Γαλιλαίας ⸀ἠκολούθησεν, καὶ ἀπὸ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/007.yaml
  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: ml
  text: യേശു തന്റെ ശിഷ്യന്മാരോടൊപ്പം കടലിലേക്ക്[a][b] പിന്മാറി; ഗലീലയിൽനിന്ന് വലിയൊരു ജനക്കൂട്ടം അവനെ അനുഗമിച്ചു, യെഹൂദ്യയിൽനിന്നും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കടലിന്റെ ദിശയിലേക്ക്.’ ഗ്രീക്ക് മുൻപ്രത്യയം കടലിന്റെ ദിശയിലേക്കുള്ള നീക്കത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇത് ഗലീലക്കടലിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്ക് മൂലപാഠത്തിൽ ‘കടൽ’ എന്നു മാത്രമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: പിന്മാറി
  rationale: വെറുതെ ‘പോയി’ എന്നതിലുപരി സമ്മർദമോ എതിർപ്പോ ഉള്ള സാഹചര്യത്തിൽ അവിടെനിന്ന് മാറുന്ന ഭാവം ഈ ക്രിയയ്ക്കുണ്ട്; ‘പിന്മാറി’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരോടൊപ്പം
  rationale: സുവിശേഷസന്ദർഭത്തിൽ μαθηταί എന്നത് പഠിതാക്കൾ മാത്രമല്ല, യേശുവിനെ അനുഗമിക്കുന്നവരുമാണ്; ‘ശിഷ്യന്മാർ’ ഈ ബന്ധം കൃത്യമായി നൽകുന്നു.
- source_word: πρὸς τὴν θάλασσαν
  choice: കടലിലേക്ക്
  rationale: θάλασσα എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കടൽ’ നിലനിർത്തുന്നു; πρὸς ലക്ഷ്യസ്ഥാനത്തേക്കോ അതിന്റെ ദിശയിലേക്കോ ഉള്ള നീക്കം സൂചിപ്പിക്കാം.
- source_word: πολὺ πλῆθος
  choice: വലിയൊരു ജനക്കൂട്ടം
  rationale: വളരെ അധികം ആളുകൾ കൂടിയതെന്ന ഊന്നൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἠκολούθησεν
  choice: അവനെ അനുഗമിച്ചു
  rationale: ഇവിടെ ജനക്കൂട്ടം യേശുവിന്റെ പിന്നാലെ പോയതാണു സന്ദർഭാർഥം; മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി സൂചിത കർമമായ ‘അവനെ’ ചേർത്തിരിക്കുന്നു.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: ഗലീലയിൽനിന്ന്
  rationale: ജനക്കൂട്ടം വന്ന പ്രദേശത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: യെഹൂദ്യയിൽനിന്നും,
  rationale: സ്ഥലപ്പട്ടിക അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അപൂർണമായ തുടർച്ചയും അവസാനത്തിലെ വിരാമചിഹ്നവും നിലനിർത്തുന്നു.
