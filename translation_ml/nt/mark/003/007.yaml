translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ‘കടൽ’ നിലനിർത്തുകയും അതിന്റെ ഭൂമിശാസ്ത്രപരമായ സൂചന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്ന ഘടന അവസാനത്തിലെ കോമയിലൂടെ സംരക്ഷിച്ചു.
