source:
  edition: SBLGNT
  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: ml
  text: സെബെദിയുടെ മകനായ യാക്കോബിനെയും യാക്കോബിന്റെ സഹോദരനായ യോഹന്നാനെയും—അവർക്കു ബൊവനെർഗസ് എന്നു പേരിട്ടു[a]; അതിന്റെ അർഥം “ഇടിമക്കൾ” എന്നാണ്—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘പേരുകൾ’ എന്ന ബഹുവചനമാണ്; രണ്ടു സഹോദരന്മാർക്കും ഒരുമിച്ചു നൽകിയ ഒരു വിശേഷണപ്പേരിനെ അത് കൂട്ടായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: യാക്കോബ്
  rationale: Ἰάκωβος എന്ന പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾരൂപം; വ്യക്തിയെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: സെബെദിയുടെ മകൻ
  rationale: പിതൃബന്ധം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് article + genitive പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: Ἰωάννην
  choice: യോഹന്നാൻ
  rationale: Ἰωάννης എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥിരപ്പെട്ട രൂപം.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: യാക്കോബിന്റെ സഹോദരൻ
  rationale: ἀδελφός ഇവിടെ യഥാർഥ കുടുംബബന്ധത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: അവർക്കു അദ്ദേഹം ... എന്നു പേരിട്ടു
  rationale: പേരിടുക എന്ന സന്ദർഭത്തിലെ ἐπιτίθημι എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളസമം; ഗ്രീക്കിലെ ബഹുവചനമായ ὀνόματα കൂട്ടായ പ്രയോഗമായി മനസ്സിലാക്കുന്നു.
- source_word: Βοανηργές
  choice: ബോവനേർഗെസ്
  rationale: മൂലപാഠം വിദേശരൂപവും അതിന്റെ വിശദീകരണവും ഒരുമിച്ചു നിലനിർത്തുന്നതിനാൽ പേര് ലിപ്യന്തരണം ചെയ്തു.
- source_word: ὅ ἐστιν
  choice: അതിന്റെ അർഥം ... എന്നാണ്
  rationale: തുടർന്നുള്ള പദങ്ങൾ പേരിന്റെ വ്യാഖ്യാനമാണെന്ന് ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: Υἱοὶ Βροντῆς
  choice: ഇടിമക്കൾ
  rationale: ‘ഇടിയുടെ പുത്രന്മാർ’ എന്ന പദാനുപദരൂപത്തേക്കാൾ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളം; ശക്തമായ വിശേഷണപ്പേരിന്റെ ദൃശ്യത നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാക്കോബിനും യോഹന്നാനും നൽകിയ വിശേഷണപ്പേരിന്റെ അവതരണം
  choice: ‘ബോവനേർഗെസ്’ എന്ന ലിപ്യന്തരരൂപവും ‘ഇടിമക്കൾ’ എന്ന അർഥവിവരണവും രണ്ടും നിലനിർത്തി
  alternative: അർഥം മാത്രം വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ ‘ഇടിയുടെ പുത്രന്മാർ’ എന്നു പദാനുപദമായി നൽകുക
  rationale: മൂലപാഠം തന്നെ വിദേശനാമവും അതിന്റെ വ്യാഖ്യാനവും നൽകുന്നു. രണ്ടും നിലനിർത്തുന്നത് പാഠത്തിന്റെ രൂപവും അർഥവും സംരക്ഷിക്കുന്നു; പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ സമാപനഭാവം നൽകാതെ dash ഉപയോഗിച്ച് പരാന്തറ്റിക്കൽ വിശദീകരണം അടയാളപ്പെടുത്തി.
