source:
  edition: SBLGNT
  text: καὶ ⸂ἀποκριθεὶς αὐτοῖς λέγει⸃· Τίς ἐστιν ἡ μήτηρ μου ⸀ἢ οἱ ἀδελφοί ⸀μου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: ml
  text: 'അവരോടു മറുപടിയായി അവൻ പറയുന്നു[a]: “ആരാണ് എന്റെ അമ്മയും എന്റെ സഹോദരന്മാരും?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥമായി: “അവരോടു മറുപടി പറഞ്ഞുകൊണ്ട് അവൻ പറയുന്നു.” ഗ്രീക്കിൽ ഒരു കൃദന്തരൂപത്തിനു പിന്നാലെ ചരിത്രവർത്തമാനകാലം വരുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിലെ ഘടന കൂടുതൽ അക്ഷരാർഥമായി: “ആരാണ് എന്റെ അമ്മ, അല്ലെങ്കിൽ എന്റെ സഹോദരന്മാർ?” ഏകവചനക്രിയ ആദ്യ വിഷയമായ “അമ്മ”യോടു യോജിക്കുന്നു.'
    reason: source_structure
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς
  choice: അവരോടു മറുപടിയായി
  rationale: ഗ്രീക്കിലെ ഭൂതകാല കൃദന്തരൂപവും അതിന്റെ അഭിസംബോധിതരെയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; തുടർന്നുള്ള ചരിത്രവർത്തമാനകാലത്തോടുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: അവൻ പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ആഖ്യാനശൈലിയിലുള്ള ചരിത്രവർത്തമാനകാലം സംരക്ഷിക്കുന്നു.
- source_word: Τίς
  choice: ആരാണ്
  rationale: വ്യക്തികളുടെ തിരിച്ചറിയൽ ചോദിക്കുന്ന ഗ്രീക്ക് സർവനാമത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: μήτηρ
  choice: അമ്മ
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കുടുംബബന്ധപദം.
- source_word: ἢ
  choice: -യും … -ഉം
  rationale: ഗ്രീക്കിൽ വേർതിരിവ് സൂചിപ്പിക്കുന്ന ‘അല്ലെങ്കിൽ’ ആണെങ്കിലും, അമ്മയെയും സഹോദരന്മാരെയും ഒരുമിച്ച് തിരിച്ചറിയാൻ ചോദിക്കുന്ന ഈ സാഹചര്യത്തിൽ സ്വാഭാവിക മലയാളചോദ്യഘടന ഉപയോഗിച്ചു; മൂലഘടന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം വ്യാഖ്യാനപരമായി വിപുലീകരിക്കാതെ കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന കുടുംബബന്ധപദത്തിന്റെ വ്യാപ്തി
  choice: സഹോദരന്മാർ
  alternative: സഹോദരങ്ങൾ / സഹോദരീസഹോദരന്മാർ
  rationale: ഇവിടെ ഗ്രീക്ക് പദം പുല്ലിംഗ ബഹുവചനമാണ്. അതിനെ ലിംഗനിരപേക്ഷമായി വിപുലീകരിക്കാതെയും യേശുവിന്റെ കുടുംബബന്ധത്തെക്കുറിച്ചുള്ള ഏതെങ്കിലും സഭാപാരമ്പര്യനിലപാട് നിർബന്ധിക്കാതെയും മൂലത്തിലെ രൂപം സംരക്ഷിക്കുന്നു.
- issue: μήτηρ … ἢ οἱ ἀδελφοί എന്ന ചോദ്യത്തിന്റെ ഏകവചന-ബഹുവചന സംഘർഷം
  choice: ആരാണ് എന്റെ അമ്മയും എന്റെ സഹോദരന്മാരും?
  alternative: ആരാണ് എന്റെ അമ്മ, അല്ലെങ്കിൽ എന്റെ സഹോദരന്മാർ?
  rationale: ഗ്രീക്കിലെ ഏകവചന ക്രിയ ആദ്യ വിഷയമായ ‘അമ്മ’യോടു യോജിക്കുന്നു; ‘അല്ലെങ്കിൽ’ രണ്ടാമത്തെ അംഗത്തെ ചേർക്കുന്നു. അക്ഷരാർഥഘടന മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ അർത്ഥം തെളിഞ്ഞു നിൽക്കുന്ന ബഹുവചനസമാഹാരചോദ്യം പ്രധാനപാഠത്തിൽ നൽകി, മൂലഘടന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം ‘പറയുന്നു’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു. പ്രധാനചോദ്യത്തിൽ മലയാളത്തിന്റെ സ്വാഭാവിക സംയുക്തഘടന ഉപയോഗിക്കുകയും ഗ്രീക്കിലെ യഥാർഥ വ്യാകരണഘടന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
