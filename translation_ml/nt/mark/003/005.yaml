revisions:
- from: അദ്ദേഹം കോപത്തോടെ അവരെ ചുറ്റും നോക്കിയശേഷം, അവരുടെ ഹൃദയകാഠിന്യത്തിൽ[a] ദുഃഖിച്ചുകൊണ്ട് ആ മനുഷ്യനോട്, “കൈ നീട്ടുക” എന്നു പറയുന്നു. അയാൾ കൈ നീട്ടി; അവന്റെ കൈ പൂർവസ്ഥിതിയിലായി.
  to: അദ്ദേഹം കോപത്തോടെ അവരെ ചുറ്റും നോക്കി, അവരുടെ ഹൃദയകാഠിന്യം നിമിത്തം ദുഃഖിച്ചുകൊണ്ട് ആ മനുഷ്യനോടു, “കൈ നീട്ടുക” എന്നു പറയുന്നു. അയാൾ കൈ നീട്ടി; അവന്റെ കൈ പഴയപടിയായി.
  rationale: The revision explicitly renders the causal force of ἐπὶ τῇ πωρώσει and uses a more idiomatic Malayalam expression for restoration. It retains Mark’s historical present, both anger and grief, the concrete male referent, and the source’s singular ‘heart’ ambiguity through the footnote.
  reviewer_model: gpt-5.6-terra
