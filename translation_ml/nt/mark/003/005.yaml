id: MRK.3.5
reference: Mark 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: ml
  text: അദ്ദേഹം കോപത്തോടെ അവരെ ചുറ്റും നോക്കി, അവരുടെ ഹൃദയകാഠിന്യം നിമിത്തം ദുഃഖിച്ചുകൊണ്ട് ആ മനുഷ്യനോടു, “കൈ നീട്ടുക” എന്നു പറയുന്നു. അയാൾ കൈ നീട്ടി; അവന്റെ കൈ പഴയപടിയായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: ചുറ്റും നോക്കിയശേഷം
  rationale: മൂലപാഠത്തിലെ aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള നിരീക്ഷണപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ ക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μετ’ ὀργῆς
  choice: കോപത്തോടെ
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന അനുഗാമിയായ ഭാവം നേരായും സ്വാഭാവികമായും നൽകുന്നു; വികാരത്തിന്റെ തീവ്രത മയപ്പെടുത്തുന്നില്ല.
- source_word: συλλυπούμενος
  choice: ദുഃഖിച്ചുകൊണ്ട്
  rationale: വേദനയും ദുഃഖവും പ്രകടിപ്പിക്കുന്ന participle ആണിത്; കോപത്തോടൊപ്പം നിലനിൽക്കുന്ന ദുഃഖം മലയാളത്തിൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν
  choice: അവരുടെ ഹൃദയകാഠിന്യത്തിൽ
  rationale: ἐπί ഇവിടെ ദുഃഖത്തിന്റെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. πώρωσις എന്ന കാഠിന്യരൂപകം നിലനിർത്തുകയും ഏകവചനമായ καρδίαയുടെ കൂട്ടായ അർഥസാധ്യത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: λέγει
  choice: എന്നു പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം ഭൂതകാലമാക്കി സമതലപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: τῷ ἀνθρώπῳ
  choice: ആ മനുഷ്യനോട്
  rationale: സന്ദർഭത്തിലെ നിർദിഷ്ട പുരുഷനെയാണ് ἄνθρωπος സൂചിപ്പിക്കുന്നത്; അതിനാൽ വ്യക്തമായ സ്വാഭാവിക പരിഭാഷ.
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: കൈ നീട്ടുക
  rationale: നിർണായകമായ പ്രവൃത്തി ആവശ്യപ്പെടുന്ന aorist imperative-ന്റെ സ്വാഭാവിക മലയാളരൂപം; തുടർന്നുള്ള ക്രിയാപുനരാവർത്തനവും സാധ്യമാക്കുന്നു.
- source_word: ἐξέτεινεν
  choice: കൈ നീട്ടി
  rationale: കല്പനയിലെ ക്രിയയെ ആവർത്തിച്ച് ആ മനുഷ്യന്റെ പ്രതികരണം വ്യക്തമായി നൽകുന്നു.
- source_word: ἀπεκατεστάθη
  choice: പൂർവസ്ഥിതിയിലായി
  rationale: കൈ ശരിയായ മുൻസ്ഥിതിയിലേക്ക് പുനഃസ്ഥാപിക്കപ്പെട്ടു എന്ന ആശയം നൽകുന്നു; ‘സൗഖ്യമായി’ എന്ന കൂടുതൽ പരിമിതമായ വൈദ്യശാസ്ത്രസൂചന ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ കോപവും ദുഃഖവും
  choice: ‘കോപത്തോടെ’ എന്നും ‘ദുഃഖിച്ചുകൊണ്ട്’ എന്നും രണ്ടു വികാരങ്ങളും നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: കോപം ‘അമർഷം’ എന്നു മയപ്പെടുത്തുകയോ ദുഃഖത്തെ മാത്രം മുൻനിർത്തുകയോ ചെയ്യുക.
  rationale: മൂലപാഠം കോപവും ദുഃഖവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു. ഈ ധാർമ്മികവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കം വിശദീകരിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യേശുവിനെ ‘അദ്ദേഹം’ എന്നും ആ മനുഷ്യനെ ‘അയാൾ’ എന്നും വിളിച്ച് സൂചകങ്ങൾ വ്യക്തമായി വേർതിരിച്ചു; മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി.
