  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: ml
  text: ഇസ്കര്യോത്തായ യൂദാസും—യേശുവിനെ ഒറ്റിക്കൊടുത്തവനും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യേശുവിനെ ഏല്പിച്ചുകൊടുത്തവനും” അല്ലെങ്കിൽ “കൈമാറിയവനും” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘ഏല്പിക്കുക’ അല്ലെങ്കിൽ ‘കൈമാറുക’ എന്നർഥം വരാം; ഇവിടെ യൂദാസ് യേശുവിനോടു ചെയ്ത പ്രവൃത്തിയുടെ സന്ദർഭാർഥം കണക്കിലെടുത്ത് “ഒറ്റിക്കൊടുത്തവൻ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -നെയും
  rationale: മുമ്പുള്ള അപ്പൊസ്തലന്മാരുടെ പട്ടികയിലെ അവസാന പേരിനെ ബന്ധിപ്പിക്കുന്ന സമുച്ചയാർഥം മലയാളത്തിലെ ‘-നെയും’ എന്ന പ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു. പൂർണവാക്യമായി വായിക്കാനായി മുൻവാക്യത്തിൽനിന്ന് സൂചിതമായ ‘നിയമിച്ചു’ ചേർത്തിരിക്കുന്നു.
- source_word: Ἰούδαν
  choice: യൂദാസ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: Ἰσκαριώθ
  choice: ഇസ്കര്യോത്താവായ
  rationale: അനിശ്ചിതമായ വ്യുത്പത്തി വിവർത്തനം ചെയ്യാതെ, യൂദാസിനോടു ചേർന്ന പേരായി/വിശേഷണമായി പരമ്പരാഗത മലയാള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: ὃς
  choice: അവനാണ്
  rationale: യൂദാസിനെ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം സ്വാഭാവിക മലയാളത്തിൽ ഊന്നലോടെ അവതരിപ്പിക്കുന്നു.
- source_word: καὶ
  choice: തന്നെ
  rationale: ബന്ധവാക്യത്തിലെ καί നൽകുന്ന അധിക തിരിച്ചറിയിക്കൽ/ഊന്നൽ മലയാളത്തിൽ ‘തന്നെ’യിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: παρέδωκεν
  choice: ഒറ്റിക്കൊടുത്തത്
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ഏല്പിക്കുക/കൈമാറുക’ എന്നതാണെങ്കിലും, യൂദാസ് യേശുവിനോടു ചെയ്ത പ്രവൃത്തിയുടെ സന്ദർഭാർഥം മലയാളത്തിൽ ‘ഒറ്റിക്കൊടുക്കുക’ വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτόν
  choice: യേശുവിനെ
  rationale: സർവനാമത്തിന്റെ സൂചിതവ്യക്തി യേശുവാണ്; ഒറ്റപ്പെട്ട വാക്യഭാഗത്തിലും വ്യക്തതയ്ക്കായി പേര് ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: യൂദാസിന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന παραδίδωμι എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: ഒറ്റിക്കൊടുത്തത്
  alternative: ഏല്പിച്ചുകൊടുത്തത് / കൈമാറിയത്
  rationale: ഗ്രീക്ക് ക്രിയയ്ക്ക് നിഷ്പക്ഷമായി ‘കൈമാറുക’ എന്നർഥം വരാമെങ്കിലും, സുവിശേഷത്തിലെ യൂദാസ്-യേശു സന്ദർഭത്തിൽ വഞ്ചനാപരമായ ഏല്പിച്ചുകൊടുക്കലാണ് ഉദ്ദേശ്യം. മുഖ്യപാഠം ആ സന്ദർഭാർഥം നൽകുകയും കൂടുതൽ പദാനുപദമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നൽകിയ ഗ്രീക്ക് പാഠം മുൻവാക്യത്തിലെ അപ്പൊസ്തലപട്ടികയുടെ അവസാന ഘടകമായതിനാൽ, സ്വതന്ത്രമായി വായിക്കാവുന്ന വിധം സൂചിതമായ ‘നിയമിച്ചു’ ചേർത്തു; എന്നാൽ അർഥപരമായ മുഖ്യശ്രദ്ധ യൂദാസിന്റെ പേരിലും അവന്റെ പ്രവൃത്തിയിലുമാണ്.
