id: MRK.3.31
reference: Mark 3:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: ml
  text: അപ്പോൾ അവന്റെ അമ്മയും സഹോദരന്മാരും വന്നു. അവർ പുറത്തു നിന്നുകൊണ്ട് അവനോടു സന്ദേശം അയച്ചു; അവനെ വിളിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: അപ്പോൾ
  rationale: വാക്യാരംഭത്തിലെ καί ഇവിടെ കഥയുടെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: ἔρχονται
  choice: വന്നു
  rationale: ഗ്രീക്കിൽ ഇത് ആഖ്യാനപരമായ വർത്തമാനകാലമാണ്; മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലം സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: അവന്റെ അമ്മ
  rationale: ഉടമസ്ഥബന്ധം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: സഹോദരന്മാർ
  rationale: ἀδελφοί പുരുഷലിംഗ ബഹുവചനമായതിനാൽ ബന്ധത്തിന്റെ കൃത്യസ്വഭാവത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: ἔξω στήκοντες
  choice: പുറത്തു നിന്നുകൊണ്ട്
  rationale: അവർ അകത്തല്ലാതെ പുറത്തു നിലകൊണ്ടിരുന്ന അവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἀπέστειλαν πρὸς αὐτὸν καλοῦντες αὐτόν
  choice: അവനെ വിളിക്കാൻ ആളയച്ചു
  rationale: ἀπέστειλαν എന്നതിൽ ഒരാളെ അയയ്ക്കുന്ന ആശയവും καλοῦντες αὐτόν എന്നതിൽ യേശുവിനെ വിളിക്കുന്ന ഉദ്ദേശ്യവും ഉൾപ്പെടുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം സംക്ഷിപ്തവും സന്ദർഭോചിതവുമാണ്.
theological_decisions:
- issue: ‘അവന്റെ സഹോദരന്മാർ’ എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ‘സഹോദരന്മാർ’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  alternative: ജൈവസഹോദരന്മാർ എന്നോ വിശാലമായ ബന്ധുക്കൾ എന്നോ വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് പാഠം ἀδελφοί എന്നാണ് പറയുന്നത്; ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം ഈ വാക്യം നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ വിഭാഗീയ വ്യാഖ്യാനം ചേർക്കാതെ പാഠത്തിന്റെ ഭാഷ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യഘടന യാന്ത്രികമായി അനുകരിക്കാതെ, സംഭവക്രമവും പ്രവർത്തനബന്ധവും വ്യക്തമായി സൂക്ഷിച്ചു.
