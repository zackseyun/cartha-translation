id: MRK.3.24
reference: Mark 3:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: ml
  text: ഒരു രാജ്യം തനിക്കുതന്നെ എതിരായി പിളർന്നാൽ, ആ രാജ്യത്തിന് നിലനിൽക്കാൻ കഴിയുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: മുൻവാക്യത്തോടുള്ള ലളിതമായ ബന്ധം ഗ്രീക്കിൽ καί സൂചിപ്പിക്കുന്നു. എന്നാൽ ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ ‘ഒരു രാജ്യം’ എന്ന് നേരിട്ട് തുടങ്ങുന്നതാണ് സ്വാഭാവികം; ആശയബന്ധം നഷ്ടപ്പെടുന്നില്ല.
- source_word: ἐὰν
  choice: -ആൽ
  rationale: സബ്ജങ്ക്റ്റീവിനോടുകൂടിയ വ്യവസ്ഥാസൂചകം; പൊതുതത്ത്വം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള വ്യവസ്ഥാരൂപം.
- source_word: βασιλεία
  choice: രാജ്യം
  rationale: ഇവിടെ ഭരണപ്രവർത്തനം എന്ന അമൂർത്ത ആശയത്തേക്കാൾ, വിഭജിക്കപ്പെടാവുന്ന ഒരു സാമൂഹിക-രാഷ്ട്രീയ ഘടകമാണ് ദൃഷ്ടാന്തം.
- source_word: ἐφ’ ἑαυτὴν
  choice: തനിക്കുതന്നെ എതിരായി
  rationale: ആന്തരിക വിരോധം സൂചിപ്പിക്കുന്ന പ്രയോഗം; ഗ്രീക്കിലെ പ്രത്യാവർത്തക സർവനാമത്തിന്റെ ഊന്നൽ ‘തന്നെ’ നിലനിർത്തുന്നു.
- source_word: μερισθῇ
  choice: പിളർന്നാൽ
  rationale: μερίζω എന്ന ക്രിയയുടെ പാസീവ് ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; വിഭജനത്തിന്റെ കാരണക്കാരനെ വാചകം നിർണ്ണയിക്കുന്നില്ല.
- source_word: οὐ δύναται
  choice: കഴിയുകയില്ല
  rationale: കഴിവില്ലായ്മയെ വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: σταθῆναι
  choice: നിലനിൽക്കാൻ
  rationale: അക്ഷരാർഥമായ ‘നിൽക്കുക’ എന്ന രൂപകത്തിന്റെ ഇവിടെ ഉദ്ദേശിക്കുന്ന അർഥം—തുടർന്ന് ഉറച്ചുനിൽക്കുക, നിലനിൽക്കുക—സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡ βασιλεία ἐκείνη
  choice: ആ രാജ്യം
  rationale: ആവർത്തിച്ച നാമവും സൂചനാസർവനാമവും നിലനിർത്തി ഗ്രീക്കിലെ ഊന്നൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: വചനത്തിന്റെ സ്വഭാവം
  choice: യേശുവിന്റെ വാദത്തിനുള്ളിലെ പൊതുതത്ത്വമായി വിവർത്തനം ചെയ്യുന്നു.
  alternative: രാഷ്ട്രീയ സ്ഥാപനങ്ങളെയോ സാത്താനെയോ കുറിച്ചുള്ള വിപുലമായ സിദ്ധാന്തപ്രഖ്യാപനമായി വികസിപ്പിക്കുക.
  rationale: മൂലവാക്യം ഒരു ദൃഷ്ടാന്തപരമായ തത്ത്വം മാത്രമാണ് പ്രസ്താവിക്കുന്നത്; ഉടൻ ചുറ്റുമുള്ള വാദത്തിനപ്പുറമുള്ള ഉപദേശങ്ങൾ വിവർത്തനത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘തനിക്കുതന്നെ എതിരായി’ എന്നത് ആന്തരിക വിരോധവും പ്രത്യാവർത്തക ഊന്നലും വ്യക്തമാക്കുന്നു; ‘നിലനിൽക്കാൻ’ എന്നത് σταθῆναιയുടെ രൂപകാർഥം സാധാരണ വായനക്കാർക്ക് തെളിമയോടെ നൽകുന്നു.
