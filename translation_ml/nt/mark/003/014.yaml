source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ⸀δώδεκα, ἵνα ὦσιν μετ’ αὐτοῦ καὶ ἵνα ἀποστέλλῃ αὐτοὺς κηρύσσειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/014.yaml
  text: And he appointed twelve[a], so that they might be with him and so that he might send them out to preach[b],
translation:
  language: ml
  text: അവൻ പന്ത്രണ്ടുപേരെ നിയമിച്ചു[a], അവർ അവനോടുകൂടെ ഇരിക്കേണ്ടതിനും അവൻ അവരെ പ്രസംഗിക്കാൻ[b] അയയ്‌ക്കേണ്ടതിനുമായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികൾ ‘അവൻ അപ്പൊസ്തലന്മാർ എന്നും കൂടി പേരിട്ടവരെ’ എന്നു ചേർക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അഥവാ, ‘പ്രഘോഷിക്കാൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: നിയമിച്ചു
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘ഉണ്ടാക്കി’ എന്നാകാമെങ്കിലും, ഇവിടെ പന്ത്രണ്ടുപേരടങ്ങുന്ന ഒരു സംഘത്തെ നിയോഗിക്കുന്നതാണ് സന്ദർഭാർഥം. ‘നിയമിച്ചു’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δώδεκα
  choice: പന്ത്രണ്ടുപേരെ
  rationale: ഗ്രീക്കിൽ ‘പന്ത്രണ്ട്’ എന്നു മാത്രം വന്നിട്ടുണ്ടെങ്കിലും, മലയാളത്തിൽ മനുഷ്യരെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കാൻ ‘പന്ത്രണ്ടുപേരെ’ എന്നത് സ്വാഭാവികമാണ്; ‘പന്ത്രണ്ട് അപ്പൊസ്തലന്മാർ’ എന്ന പാഠഭേദം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: അവർ തന്നോടുകൂടെ ഉണ്ടായിരിക്കാനും
  rationale: ἵναയും ഉപവിധിക്രിയയും സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം നിലനിർത്തുന്നു. ‘തന്നോടുകൂടെ’ എന്നത് യേശുവിനെത്തന്നെ സൂചിപ്പിക്കുന്ന ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀποστέλλῃ
  choice: അവരെ ... അയയ്ക്കാനും
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തുന്നു; ‘അപ്പൊസ്തലന്മാരായി നിയോഗിക്കുക’ എന്ന സാങ്കേതിക ആശയം പാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
- source_word: κηρύσσειν
  choice: പ്രസംഗിക്കാൻ
  rationale: പൊതുവായി സന്ദേശം പ്രഖ്യാപിക്കുന്ന പ്രവൃത്തിയെ സുവിശേഷസന്ദർഭത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു; ‘പ്രഘോഷിക്കാൻ’ സാധുവായ മറ്റൊരു പരിഭാഷയാണ്.
theological_decisions:
- issue: മുഖ്യപാഠത്തിൽ അപ്പൊസ്തലൻ എന്ന പദവി പരോക്ഷമായി ചേർക്കണമോ
  choice: ‘അപ്പൊസ്തലന്മാർ’ എന്ന് മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
  alternative: ‘അവൻ അപ്പൊസ്തലന്മാർ എന്നു പേരിട്ട പന്ത്രണ്ടുപേരെ നിയമിച്ചു’ എന്ന ദീർഘപാഠം.
  rationale: നൽകിയ SBLGNT പാഠത്തിൽ ‘പന്ത്രണ്ട്’ എന്നു മാത്രമേയുള്ളൂ. ചില കൈയെഴുത്തുപ്രതികളിലെ ദീർഘവായന അടിക്കുറിപ്പിൽ അറിയിക്കുന്നത് പാഠസാക്ഷ്യവും പരിചിതമായ പാരമ്പര്യവായനയും സുതാര്യമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ രണ്ടു ഉദ്ദേശ്യങ്ങളും സമാന്തരമായി നിലനിർത്തി. [a], [b] എന്നീ അടിക്കുറിപ്പുസൂചകങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
