revisions:
- from: പരീശന്മാർ പുറത്തുപോയി ഉടനെ ഹെരോദാവിന്റെ പക്ഷക്കാരുമായി ചേർന്ന്, അവനെ എങ്ങനെ നശിപ്പിക്കാമെന്ന്[a] അവനെതിരെ ആലോചന തുടങ്ങി.
  to: പരീശന്മാർ പുറത്തുപോയി; ഉടനെ ഹെരോദാവിന്റെ പക്ഷക്കാരോടൊപ്പം അവനെതിരെ ആലോചന നടത്തിത്തുടങ്ങി—അവനെ എങ്ങനെ നശിപ്പിക്കാമെന്ന്[a].
  rationale: The revision changes only Malayalam syntax and idiom. It keeps ‘ഉടനെ’ for εὐθύς, the explanatory group designation for Ἡρῳδιανοί, the hostile force of κατ’ αὐτοῦ, the deliberative/purpose nuance of ὅπως, and the broader ‘നശിപ്പിക്കുക’ for ἀπολέσωσιν. The footnote anchor remains attached to the verb it qualifies.
