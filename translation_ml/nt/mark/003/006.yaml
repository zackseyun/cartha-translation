source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: ml
  text: പരീശന്മാർ പുറത്തുപോയി; ഉടനെ ഹെരോദാവിന്റെ പക്ഷക്കാരോടൊപ്പം അവനെതിരെ ആലോചന നടത്തിത്തുടങ്ങി—അവനെ എങ്ങനെ നശിപ്പിക്കാമെന്ന്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഈ സന്ദർഭത്തിൽ കൂടുതൽ വ്യക്തമായി, “കൊല്ലാമെന്ന്” അല്ലെങ്കിൽ “വധിക്കാമെന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: പുറത്തുപോയി
  rationale: അയോറിസ്റ്റ് കൃ定ന്തം മുഖ്യക്രിയയോടൊപ്പമുള്ള മുൻപ്രവർത്തിയായി സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ ആഖ്യാനത്തിലെ അടിയന്തരതയും വേഗവും സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: ഹെരോദാവിന്റെ പക്ഷക്കാരുമായി ചേർന്ന്
  rationale: μετάയുടെ സഹവർത്തിത്വാർഥം വ്യക്തമാക്കുന്നു; Ἡρῳδιανοί എന്നത് ഹെരോദാവിന്റെ ഭരണതാൽപര്യങ്ങളോട് ചേർന്ന സംഘത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന രൂപം തെരഞ്ഞെടുത്തു.
- source_word: συμβούλιον ἐδίδουν
  choice: ആലോചന തുടങ്ങി
  rationale: συμβούλιον διδόναι എന്ന പ്രയോഗത്തിന്റെ കൂടിയാലോചന/പദ്ധതി ആസൂത്രണം എന്ന അർഥം നൽകുകയും അപൂർണ്ണ ഭൂതകാലത്തിന്റെ ആരംഭപരമോ പുരോഗമനപരമോ ആയ ഭാവം ‘തുടങ്ങി’ വഴി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. ശത്രുതാപരമായ സ്വഭാവം ‘അവനെതിരെ’യും ലക്ഷ്യവാക്യവും വ്യക്തമാക്കുന്നു.
- source_word: κατ’ αὐτοῦ
  choice: അവനെതിരെ
  rationale: κατάയുടെ ഇവിടെ ഉള്ള പ്രതികൂലവും ശത്രുതാപരവുമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὅπως
  choice: എങ്ങനെ
  rationale: തുടർന്നുള്ള സബ്ജങ്ക്റ്റീവിനൊപ്പം ഉദ്ദേശ്യവും ആലോചനാത്മകമായ ‘എങ്ങനെ’ എന്ന ഭാവവും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπολέσωσιν
  choice: നശിപ്പിക്കാമെന്ന്
  rationale: ἀπόλλυμι എന്ന ക്രിയയുടെ നശിപ്പിക്കുക, ഇല്ലാതാക്കുക, കൊല്ലുക എന്നീ വിശാലമായ അർഥപരിധി ചുരുക്കാതെ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ മരണോദ്ദേശ്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: നേതാക്കളുടെ ഉദ്ദേശ്യം മുഖ്യവാക്യത്തിൽ തന്നെ ‘കൊല്ലുക’ എന്ന് വ്യക്തമാക്കണമോ
  choice: വിശാലമായ ‘നശിപ്പിക്കുക’ എന്ന പദം മുഖ്യവാക്യത്തിൽ നിലനിർത്തി.
  alternative: ‘കൊല്ലുക’ അല്ലെങ്കിൽ ‘വധിക്കുക’
  rationale: ἀπόλλυμι എന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘കൊല്ലുക’ എന്നതിലുപരി വിശാലമായ അർഥപരിധിയുണ്ട്. ഈ സന്ദർഭത്തിൽ യേശുവിനെ കൊല്ലാനുള്ള ഉദ്ദേശ്യം ശക്തമായി സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, മുഖ്യവാക്യത്തിൽ അതിനെ അനാവശ്യമായി ചുരുക്കാതെ യഥാർഥ ഭാഷാപരമായ പിരിമുറുക്കം നിലനിർത്തുകയും വ്യക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഹെരോദിയർ’ എന്ന അപരിചിത ലിപ്യന്തരണത്തിനു പകരം സംഘബന്ധം വ്യക്തമാക്കുന്ന ‘ഹെരോദാവിന്റെ പക്ഷക്കാർ’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ക്രിയയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
