  to: അവനുമായി അടുത്ത ബന്ധമുള്ളവർ ഇതു കേട്ടപ്പോൾ[a], അവനെ പിടിക്കാനായി പുറപ്പെട്ടു; കാരണം, “അവന് സ്വബോധം നഷ്ടപ്പെട്ടിരിക്കുന്നു” എന്ന് അവർ പറഞ്ഞുകൊണ്ടിരുന്നു.[b]
  rationale: മുഖ്യതിരുത്തൽ κρατῆσαι യുടെ പരിധിക്കപ്പുറമുള്ള ‘കൊണ്ടുപോകുക’ എന്ന ആശയം നീക്കുന്നതാണ്. അതോടൊപ്പം, οἱ παρ’ αὐτοῦ എന്ന അവ്യക്തമായ പ്രയോഗം കുടുംബമായി നിർണയിക്കാതെ കൂടുതൽ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിച്ചു. അടിക്കുറിപ്പു സൂചകങ്ങളും അവയുടെ സ്ഥാനങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
