id: MRK.3.21
reference: Mark 3:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: ml
  text: അവനുമായി അടുത്ത ബന്ധമുള്ളവർ ഇതു കേട്ടപ്പോൾ[a], അവനെ പിടിക്കാനായി പുറപ്പെട്ടു; കാരണം, “അവന് സ്വബോധം നഷ്ടപ്പെട്ടിരിക്കുന്നു” എന്ന് അവർ പറഞ്ഞുകൊണ്ടിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ കുടുംബക്കാർ’ അല്ലെങ്കിൽ ‘അവന്റെ സ്വന്തക്കാർ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പ്രയോഗം യേശുവിന്റെ വീട്ടിലോ അടുത്ത വലയത്തിലോ ഉൾപ്പെട്ടവരെ സൂചിപ്പിക്കാവുന്ന ശൈലിപ്രയോഗമാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘അവൻ സമനില തെറ്റിയിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: അവനോടടുത്തവർ
  rationale: ഈ പ്രയോഗം യേശുവിന്റെ വീട്ടുകാരെയോ കുടുംബാംഗങ്ങളെയോ അടുത്ത വലയത്തിലുള്ളവരെയോ സൂചിപ്പിക്കാവുന്ന ഒരു ഗ്രീക്ക് ശൈലിയാണ്. ‘അവനോടടുത്തവർ’ എന്നത് വ്യക്തമായി കുടുംബം എന്നു നിശ്ചയിക്കാതെ മൂലത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: ἀκούσαντες
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: എന്താണ് കേട്ടതെന്നത് വാക്യത്തിൽ തുറന്നുപറയാത്തതിനാൽ, മുൻസന്ദർഭത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന ‘ഇതു’ ചേർത്ത് aorist participle കാലസൂചനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἐξῆλθον
  choice: പുറപ്പെട്ടു
  rationale: അവർ ഉണ്ടായിരുന്ന സ്ഥലത്തുനിന്ന് യേശുവിന്റെ അടുക്കലേക്കു പ്രവർത്തനോദ്ദേശത്തോടെ പോയെന്ന ആഖ്യാനചലനം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: κρατῆσαι αὐτόν
  choice: അവനെ പിടിച്ചുകൊണ്ടുപോകാൻ
  rationale: κρατέω ബലമായി പിടിക്കുക എന്ന ആശയം നൽകുന്നു. സന്ദർഭത്തിൽ വെറും സ്പർശനമല്ല, അവനെ തങ്ങളുടെ നിയന്ത്രണത്തിലാക്കി കൊണ്ടുപോകാനുള്ള ഉദ്ദേശമാണെന്ന സൂചന സ്വാഭാവികമായി നൽകുന്നു; നിയമപരമായ അറസ്റ്റാണെന്ന് വ്യക്തമാക്കുന്നില്ല.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: Imperfect രൂപത്തിലെ തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ വാക്കുപറച്ചിൽ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐξέστη
  choice: സ്വബോധം നഷ്ടപ്പെട്ടിരിക്കുന്നു
  rationale: മാനസിക സമനില തെറ്റിയെന്ന ആരോപണം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഭ്രാന്തനായി’ എന്ന കൂടുതൽ കടുത്തതും രോഗനിർണയസ്വഭാവമുള്ളതുമായ പദപ്രയോഗം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: οἱ παρ’ αὐτοῦ എന്നവരുടെ തിരിച്ചറിയൽ
  choice: പ്രധാനപാഠത്തിൽ ‘അവനോടടുത്തവർ’ എന്നു പൊതുവായി നൽകി.
  alternative: ‘അവന്റെ കുടുംബക്കാർ’, ‘അവന്റെ സ്വന്തക്കാർ’, അല്ലെങ്കിൽ ‘അവന്റെ കൂട്ടത്തിലുള്ളവർ’.
  rationale: തുടർന്നുള്ള സന്ദർഭം യേശുവിന്റെ കുടുംബത്തെ ശക്തമായി സൂചിപ്പിച്ചാലും, ഇവിടെ ഉപയോഗിച്ച ഗ്രീക്ക് പ്രയോഗം നേരിട്ടുള്ള ബന്ധുത്വപദമല്ല. അതിനാൽ കുടുംബം എന്ന് ഉറപ്പിച്ചു പറഞ്ഞ് മൂലത്തിലെ അവ്യക്തത പരിഹരിക്കാതെ നിലനിർത്തി.
- issue: ἐξέστη എന്ന ആരോപണത്തിന്റെ ശക്തി
  choice: ‘അവന് സ്വബോധം നഷ്ടപ്പെട്ടിരിക്കുന്നു’.
  alternative: ‘അവൻ സമനില തെറ്റിയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘അവൻ സ്വസ്ഥനിലയിലല്ല’.
  rationale: ഈ വാക്ക് യേശുവിന്റെ മാനസികാവസ്ഥയെക്കുറിച്ചുള്ള അടുത്തവരുടെ കടുത്ത വിലയിരുത്തലാണ്. അതിനെ മൃദുവാക്കി വെറും ക്ഷീണമോ ആവേശമോ ആക്കാതെയും, ആധുനിക രോഗനിർണയം ചുമത്താതെയും പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അവനോടടുത്തവർ’ മൂലത്തിലെ തിരിച്ചറിയൽ-അവ്യക്തത സംരക്ഷിക്കുന്നു. ‘സ്വബോധം നഷ്ടപ്പെട്ടിരിക്കുന്നു’ ആരോപണത്തിന്റെ ശക്തി വ്യക്തമാക്കുമ്പോഴും അപമാനകരമായോ വൈദ്യപരമായ രോഗനിർണയം നടത്തുന്നതുപോലെയോ ഉള്ള ഭാഷ ഒഴിവാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
