id: MRK.3.34
reference: Mark 3:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος ⸂τοὺς περὶ αὐτὸν κύκλῳ⸃ καθημένους λέγει· Ἴδε ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: ml
  text: 'തന്റെ ചുറ്റും വട്ടമായി ഇരുന്നവരെ ചുറ്റും നോക്കിക്കൊണ്ട് അവൻ പറയുന്നു: “ഇതാ, എന്റെ അമ്മയും എന്റെ സഹോദരന്മാരും![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരങ്ങൾ.” ഗ്രീക്കിൽ അക്ഷരാർഥം “സഹോദരന്മാർ” എന്നാണ്; എന്നാൽ യേശുവിന്റെ ചുറ്റുമിരുന്ന വിശാലസംഘത്തിൽ സ്ത്രീകളും ഉൾപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: ചുറ്റും ... നോക്കിക്കൊണ്ട്
  rationale: യേശു ചുറ്റുമുള്ളവരിലേക്കു ദൃഷ്ടി തിരിക്കുന്ന മനഃപൂർവമായ പ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: ചുറ്റും തന്നെ വട്ടമിട്ടിരുന്നവരെ
  rationale: περὶ αὐτόν എന്ന ‘അവന്റെ ചുറ്റും’ എന്ന ആശയവും κύκλῳ എന്ന വൃത്താകാരമായ ക്രമീകരണത്തിന്റെ ഊന്നലും καθημένους എന്ന ഇരുന്ന നിലയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: അവൻ പറയുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം ഭൂതകാലമാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: Ἴδε
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും മുന്നിലുള്ളവരെ ചൂണ്ടിക്കാണിക്കുകയും ചെയ്യുന്ന പദത്തിന്റെ ശക്തി, അതിപുരാതനമായ ശൈലിയില്ലാതെ, നിലനിർത്തുന്നു.
- source_word: μήτηρ
  choice: അമ്മ
  rationale: സാധാരണവും സ്വാഭാവികവുമായ മലയാള കുടുംബബന്ധപദം.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; ചുറ്റുമിരുന്ന വിശാലസംഘത്തിൽ സ്ത്രീകളും ഉൾപ്പെട്ടിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സ്ത്രീകളും ഉണ്ടായിരിക്കാവുന്ന ശിഷ്യസംഘത്തെക്കുറിച്ച് പുല്ലിംഗ ബഹുവചനമായ ἀδελφοί ഉപയോഗിക്കുന്നത്
  choice: സഹോദരന്മാർ
  alternative: സഹോദരങ്ങൾ
  rationale: മൂലപാഠത്തിന്റെ വ്യാകരണരൂപം പ്രധാനപാഠത്തിൽ സൂക്ഷിക്കുകയും, പദം വിശാലമായ കുടുംബബന്ധത്തെ സൂചിപ്പിച്ചേക്കാമെന്ന യഥാർഥ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു; ഇതിലൂടെ ഏതെങ്കിലും വ്യാഖ്യാനം അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ മാന്യവും തിരുവെഴുത്തിന് യോജിച്ചതുമായ മലയാളം. മർക്കോസിന്റെ ചരിത്രവർത്തമാനകാലവും ദൃശ്യമായ വൃത്താകാര ക്രമീകരണവും നിലനിർത്തിയിരിക്കുന്നു.
