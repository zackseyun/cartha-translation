id: MRK.3.16
reference: Mark 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂ἐποίησεν τοὺς δώδεκα, καὶ⸃ ἐπέθηκεν ⸂ὄνομα τῷ Σίμωνι⸃ Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: ml
  text: അവൻ പന്ത്രണ്ടുപേരെ നിയമിച്ചു; ശിമോന് പത്രോസ്[a] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പത്രോസ്” എന്ന പേരിന് “പാറ” എന്നാണ് അർത്ഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: നിയമിച്ചു
  rationale: The verb literally can mean “made,” but here it denotes Jesus’ constituting or appointing the group of twelve. “നിയമിച്ചു” conveys that contextual force naturally without importing later ecclesiastical terminology.
- source_word: τοὺς δώδεκα
  choice: പന്ത്രണ്ടുപേരെ
  rationale: This directly and naturally identifies the group of twelve persons in Malayalam. No special capitalization is needed in Malayalam.
- source_word: ἐπέθηκεν ὄνομα
  choice: പേരിട്ടു
  rationale: The Greek idiom literally means “placed a name on.” The idiomatic Malayalam “പേരിട്ടു” clearly preserves the act of bestowing a name.
- source_word: Σίμωνι
  choice: ശിമോന്
  rationale: The personal name is transliterated according to established Malayalam biblical usage, with the dative relationship expressed naturally in Malayalam.
- source_word: Πέτρον
  choice: പത്രോസ്
  rationale: Because Πέτρος functions here as a bestowed personal name, it is transliterated rather than replaced by its lexical meaning. The meaning is retained in a footnote.
theological_decisions:
- issue: Rendering Jesus’ act toward the Twelve
  choice: പന്ത്രണ്ടുപേരെ നിയമിച്ചു
  alternative: പന്ത്രണ്ടുപേരെ ഉണ്ടാക്കി / പന്ത്രണ്ടുപേരായി നിശ്ചയിച്ചു
  rationale: The context concerns Jesus constituting the recognized group of twelve, not creating people in a generic sense. “നിയമിച്ചു” preserves the institutional force while remaining ordinary Malayalam.
- issue: Treatment of Πέτρος
  choice: പത്രോസ്
  alternative: പാറ
  rationale: Πέτρος is functioning as Simon’s personal name in the sentence. Transliteration preserves that function, while the semantic sense “rock” is supplied in a footnote without forcing an interpretation into the main text.
translation_notes:
  register: Modern standard Malayalam in a concise, dignified narrative register. The two coordinated Greek clauses are joined with a semicolon for natural readability. The footnote marker is placed immediately after “പത്രോസ്,” the word it explains.
