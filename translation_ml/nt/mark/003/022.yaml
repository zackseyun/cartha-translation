language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: ml
  text: യെരൂശലേമിൽനിന്ന് ഇറങ്ങിവന്ന ശാസ്ത്രിമാർ, “അവന് ബെയെൽസെബൂൽ ഉണ്ട്”[a][b] എന്നും, “ഭൂതങ്ങളുടെ അധിപതിയെക്കൊണ്ടാണ്[c] അവൻ ഭൂതങ്ങളെ പുറത്താക്കുന്നത്” എന്നും പറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “അവനെ ബെയെൽസെബൂൽ ബാധിച്ചിരിക്കുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: Βεελζεβούλ; പരമ്പരാഗതമായി “ബെയെൽസെബൂബ്” എന്നും എഴുതാറുണ്ട്.'
    reason: alternative_reading
  - marker: c
    text: അഥവാ “ഭൂതങ്ങളുടെ പ്രഭുവിനെക്കൊണ്ടാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ യെഹൂദനിയമം വ്യാഖ്യാനിക്കുകയും പഠിപ്പിക്കുകയും ചെയ്ത അംഗീകൃത പണ്ഡിതന്മാരെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. വെറും പകർപ്പെഴുത്തുകാരെന്ന ധാരണ ഒഴിവാക്കിക്കൊണ്ട് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ പദം നിലനിർത്തുന്നു.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: യെരൂശലേമിൽനിന്ന് ഇറങ്ങിവന്ന
  rationale: യെരൂശലേമിന്റെ ഉയർന്ന ഭൂമിശാസ്ത്രസ്ഥാനത്തുനിന്നുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന καταβαίνω എന്ന ക്രിയയുടെ ദിശാബോധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്നോ ആവർത്തിച്ചോ നടത്തിയ പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നു; ലളിതഭൂതകാലത്തേക്കാൾ ഈ രൂപം അതിന്റെ ഭാവം നന്നായി കൈമാറുന്നു.
- source_word: Βεελζεβοὺλ
  choice: ബെയെൽസെബൂൽ
  rationale: SBLGNT-യിലെ ഗ്രീക്ക് രൂപത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണമാണ്; പരമ്പരാഗതമായ ‘ബെയെൽസെബൂബ്’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἔχει
  choice: ഉണ്ട്
  rationale: ഗ്രീക്കിലെ ‘ഉണ്ട്/കൈവശമുണ്ട്’ എന്ന നേരിട്ടുള്ള പ്രയോഗം സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ബാധയെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും ആ വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: ഭൂതങ്ങളുടെ അധിപതിയെക്കൊണ്ടാണ്
  rationale: ഇവിടെയുള്ള ἐν ഉപകരണമോ പ്രവർത്തകമാധ്യമമോ സൂചിപ്പിക്കുന്നു. ‘അധിപതി’ ἄρχων എന്നതിലെ അധികാരഭാവം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δαιμονίων / δαιμόνια
  choice: ഭൂതങ്ങൾ / ഭൂതങ്ങളെ
  rationale: δαιμόνιον എന്ന പദത്തെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; വേറൊരു ഗ്രീക്ക് പ്രയോഗമായ ‘അശുദ്ധാത്മാക്കൾ’ ഇവിടെ കൊണ്ടുവരുന്നില്ല.
- source_word: ἐκβάλλει
  choice: പുറത്താക്കുന്നത്
  rationale: ബലമായി നീക്കിക്കളയുക എന്ന ക്രിയാഭാവം ഭൂതോച്ചാടനസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: Βεελζεβοὺλ ἔχει എന്ന ആരോപണത്തിന്റെ വ്യാഖ്യാനം
  choice: അവന് ബെയെൽസെബൂൽ ഉണ്ട്
  alternative: അവനെ ബെയെൽസെബൂൽ ബാധിച്ചിരിക്കുന്നു
  rationale: മുഖ്യവാക്യം ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അസാധാരണമായ നേരിട്ടുള്ള രൂപം സംരക്ഷിക്കുന്നു. ഭൂതബാധയെയോ അധീനതയെയോ സൂചിപ്പിക്കുന്ന കൂടുതൽ വ്യക്തമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നതിലൂടെ മൂലത്തിലെ വ്യാഖ്യാനസമ്മർദം നിലനിർത്തുന്നു.
- issue: ἄρχων എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഭൂതങ്ങളുടെ അധിപതി
  alternative: ഭൂതങ്ങളുടെ പ്രഭു
  rationale: ‘അധിപതി’ അധികാരവും ഭരണസ്ഥാനവും വ്യക്തമായി അറിയിക്കുന്ന ആധുനിക പദമാണ്. പരമ്പരാഗതമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘ശാസ്ത്രിമാർ’ പോലുള്ള സന്ദർഭപരമായി ഉറച്ച ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും വാക്യം അനാവശ്യമായി പ്രാചീനമാക്കിയിട്ടില്ല. ഗ്രീക്കിലെ ആവർത്തിതമായ καὶ ... καὶ ഘടന മലയാളത്തിലെ ‘എന്നും ... എന്നും’ എന്ന സമാന്തരരൂപത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു.
