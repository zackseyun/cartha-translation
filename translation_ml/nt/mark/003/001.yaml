  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν πάλιν ⸀εἰς συναγωγήν, καὶ ἦν ἐκεῖ ἄνθρωπος ἐξηραμμένην ἔχων τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: ml
  text: അവൻ വീണ്ടും ഒരു സിനഗോഗിലേക്കു പ്രവേശിച്ചു[a]. അവിടെ ശോഷിച്ച കൈയുള്ള ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, സമീപസന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്ന ഒരു പ്രത്യേക സിനഗോഗാണ് മർക്കോസ് ഉദ്ദേശിക്കുന്നതെങ്കിൽ, ‘ആ സിനഗോഗിലേക്കു’.
    reason: alternative_reading
  - marker: b
    text: ‘കൈ ഉണങ്ങിപ്പോയ’ അല്ലെങ്കിൽ ‘കൈ ചുരുങ്ങിയ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: പ്രവേശിച്ചു
  rationale: കഥനത്തിലെ ലളിതമായ പ്രവേശനക്രിയയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തിച്ചുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന πάλιν എന്ന പദത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക തർജമ.
- source_word: εἰς συναγωγήν
  choice: ഒരു സിനഗോഗിൽ
  rationale: ഗ്രീക്കിൽ നാമത്തിന് നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘പ്രവേശിച്ചു’ എന്ന ചലനക്രിയയോടൊപ്പം ‘-ൽ’ സ്വാഭാവികമാണ്.
- source_word: ἦν ἐκεῖ
  choice: അവിടെ ... ഉണ്ടായിരുന്നു
  rationale: ἐκεῖ എന്ന സ്ഥലസൂചനയും ἦν എന്ന അസ്തിത്വസൂചനയും ആവർത്തനഭാരം കൂടാതെ പൂർണ്ണമായി നൽകുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: സന്ദർഭത്തിലെ വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും മൂലപദത്തിന്റെ സാധാരണ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐξηραμμένην
  choice: ശോഷിച്ച
  rationale: ξηραίνω എന്ന ക്രിയയുടെ ‘ഉണങ്ങി/ക്ഷയിച്ച് പ്രവർത്തനശേഷി കുറഞ്ഞ’ ഭാവം സംക്ഷിപ്തമായി നൽകുന്നു; പൂർണ്ണ പങ്കാളിക്രിയയുടെ നിലനിൽക്കുന്ന അവസ്ഥയും അറിയിക്കുന്നു.
- source_word: ἔχων τὴν χεῖρα
  choice: കൈ ശോഷിച്ച
  rationale: ഗ്രീക്ക് പങ്കാളിക്രിയാ ഘടനയെ വാക്കിന് വാക്കായി കടുപ്പിക്കാതെ സ്വാഭാവിക മലയാള വിവരണമായി നൽകുന്നു.
