translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘സിനഗോഗ്’ എന്ന പരിചിതമായ ചരിത്ര-മതപര പദം നിലനിർത്തി. ഗ്രീക്കിലെ വാക്യാരംഭമായ καί മലയാളത്തിൽ നിർബന്ധിതമായ ‘പിന്നെ/കൂടാതെ’ ചേർക്കാതെ കഥനബന്ധത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി.
