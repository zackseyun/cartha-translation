translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഭൂമിശാസ്ത്രപട്ടികയുടെ സഞ്ചയാത്മക താളം നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തിച്ച ‘കൂടാതെ’ ഒഴിവാക്കി. മൂലത്തിലെ കൃദന്തരൂപത്തിന്റെ കാല/കാരണ അനിശ്ചിതത്വവും ὅσα-യുടെ വ്യാപ്തിസാധ്യതയും സംരക്ഷിച്ചു.
