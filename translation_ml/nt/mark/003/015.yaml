  text: καὶ ἔχειν ⸀ἐξουσίαν ἐκβάλλειν τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/015.yaml
  text: and to have authority to cast out demons[a].
translation:
  language: ml
  text: ഭൂതങ്ങളെ പുറത്താക്കാനുള്ള അധികാരം ഉണ്ടായിരിക്കാനും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഭൂതങ്ങളെ ഓടിച്ചുകളയാനുള്ള അധികാരം ഉണ്ടായിരിക്കാനും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ഉം
  rationale: മുൻവാക്യത്തിലെ സമാന്തരമായ അനന്തക്രിയാരൂപങ്ങളോട് ഈ ലക്ഷ്യവാക്യത്തെ ബന്ധിപ്പിക്കുന്ന സാധാരണ സംയോജകത്തെ മലയാളത്തിൽ അനുബന്ധപ്രത്യയമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἔχειν
  choice: ഉണ്ടായിരിക്കാനും
  rationale: ἔχω എന്ന ക്രിയയുടെ വർത്തമാനകാല സജീവ അനന്തക്രിയാരൂപം; മുൻസന്ദർഭത്തിലെ നിയമനലക്ഷ്യങ്ങളുടെ നിരയോട് ചേർന്ന് ‘ഉണ്ടായിരിക്കാനും’ എന്നത് നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: വെറും ശക്തിയേക്കാൾ, ഏല്പിക്കപ്പെട്ട അധികാരവും പ്രവർത്തിക്കാനുള്ള അവകാശവും സൂചിപ്പിക്കുന്നു; പന്ത്രണ്ടുപേരെ യേശു നിയോഗിക്കുന്ന സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: ἐκβάλλειν
  choice: പുറത്താക്കാൻ
  rationale: ബലമായി പുറത്തേക്കു നീക്കുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; ഭൂതോച്ചാടനസന്ദർഭത്തിൽ കൃത്യവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: τὰ δαιμόνια
  choice: ഭൂതങ്ങളെ
  rationale: മൂലപദം δαιμόνια തന്നെയാണ്; സമീപവാക്യങ്ങളിലെ ‘അശുദ്ധാത്മാക്കൾ’ എന്ന വ്യത്യസ്ത പ്രയോഗം ഇവിടെ ഇറക്കുമതി ചെയ്യാതെ കൃത്യമായ സമാനപദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ നിയോഗത്തിൽ ἐξουσίαയുടെ സ്വഭാവം
  choice: അധികാരം
  alternative: ശക്തി
  rationale: യേശു നൽകുന്ന നിയോഗവും അതനുസരിച്ച് പ്രവർത്തിക്കാനുള്ള അധികാരവുമാണ് വാക്യം ഊന്നുന്നത്; അതേസമയം ഭൂതങ്ങളെ പുറത്താക്കുന്ന പ്രവൃത്തിയുടെ അതിമാനുഷിക സ്വഭാവം നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഇത് മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന വാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ, καὶ എന്ന ബന്ധകത്തെ അവസാനത്തെ ‘-ഉം’ രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
