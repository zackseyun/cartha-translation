id: MRK.3.29
reference: Mark 3:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον, οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ ἔνοχός ἐστιν αἰωνίου ⸀ἁμαρτήματος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: ml
  text: എന്നാൽ, പരിശുദ്ധാത്മാവിനെതിരെ ദൂഷണം പറയുന്നവന് ഒരിക്കലും ക്ഷമ ലഭിക്കുകയില്ല[a]; മറിച്ച്, അവൻ നിത്യമായ പാപത്തിന്റെ കുറ്റക്കാരനാണ്[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘യുഗത്തേക്ക് ക്ഷമ അവനില്ല’; അതായത്, ‘ഒരിക്കലും ക്ഷമ ലഭിക്കുകയില്ല’ അല്ലെങ്കിൽ ‘എന്നേക്കും ക്ഷമയില്ല.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘നിത്യമായ പാപത്തിന് ബാധ്യനാണ്.’
    reason: lexical_alternative
  - marker: c
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘നിത്യമായ പാപം’ എന്നതിനു പകരം ‘നിത്യമായ ന്യായവിധി’ എന്നോ ‘നിത്യമായ ശിക്ഷാവിധി’ എന്നോ വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: എന്നാൽ ... പറയുന്നവന്
  rationale: ὃς കൂടെ ἄν ചേർന്നത് അനിശ്ചിതമായ പൊതുവ്യവസ്ഥ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘...പറയുന്നവന്’ എന്ന പ്രയോഗം അത് സ്വാഭാവികമായി നൽകുന്നു. δέ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ സ്വീകരിച്ചു.
- source_word: βλασφημήσῃ
  choice: ദൂഷണം പറയുന്ന
  rationale: βλασφημέω എന്നതിലെ നിന്ദാപരവും മതപരമായി ഗൗരവമുള്ളതുമായ അർഥം ‘ദൂഷണം പറയുക’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവിനെതിരെ
  rationale: ഇവിടെ εἰς ദൂഷണത്തിന്റെ ലക്ഷ്യം അടയാളപ്പെടുത്തുന്നു; ‘പരിശുദ്ധാത്മാവിനെതിരെ’ എന്നത് സ്വാഭാവികവും അർഥകൃത്യവുമാണ്.
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: ഒരിക്കലും ക്ഷമ ലഭിക്കുകയില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘യുഗത്തിലേക്ക് ക്ഷമ ഇല്ല’ എന്ന നെഗറ്റീവ് കാലപ്രയോഗം ‘ഒരിക്കലും’ എന്ന ആശയം നൽകുന്നു. ‘ക്ഷമ ലഭിക്കുകയില്ല’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ἔνοχός ἐστιν
  choice: കുറ്റക്കാരനാകുന്നു
  rationale: ἔνοχος കുറ്റക്കാരനായിരിക്കുകയോ ഒന്നിന് വിധേയൻ/ബാധ്യൻ ആയിരിക്കുകയോ എന്നർഥം നൽകാം. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘കുറ്റക്കാരനാകുന്നു’ സ്വീകരിച്ച് പകരംവായന അടിക്കുറിപ്പിൽ നൽകി.
- source_word: αἰωνίου ἁμαρτήματος
  choice: നിത്യമായ പാപത്തിന്
  rationale: നൽകിയ SBLGNT പാഠത്തിലെ ἁμαρτήματος ‘പാപം’ എന്നാണ്; αἰωνίου അതിനെ ‘നിത്യമായ’ എന്നു വിശേഷിപ്പിക്കുന്നു. κρίσεως എന്ന പാഠഭേദം മുഖ്യവാചകത്തിലേക്ക് കൊണ്ടുവരാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: ക്ഷമയില്ലാത്ത കുറ്റത്തിന്റെ സ്വഭാവം
  choice: ‘പരിശുദ്ധാത്മാവിനെതിരെ ദൂഷണം പറയുക’ എന്ന വാക്യത്തിന്റെ നേരിട്ടുള്ള രൂപം നിലനിർത്തി.
  alternative: ആത്മാവിന്റെ സാക്ഷ്യത്തെ ബോധപൂർവം നിരന്തരം നിരസിക്കൽ; ആത്മാവിന്റെ പ്രവൃത്തിയെ പൈശാചിക ശക്തിയുടേതായി ആരോപിക്കൽ.
  rationale: സന്ദർഭം വ്യാഖ്യാനത്തിന് സഹായിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ ഇല്ലാത്ത വിശദീകരണം വിവർത്തനത്തിൽ ചേർക്കുന്നത് ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കും.
- issue: വാക്യാന്ത്യത്തിലെ പാഠഭേദം
  choice: SBLGNTയിലെ ‘നിത്യമായ പാപം’ മുഖ്യവാചകത്തിൽ വിവർത്തനം ചെയ്തു.
  alternative: നിത്യമായ ന്യായവിധി; നിത്യശിക്ഷാവിധി.
  rationale: നൽകിയ മൂലപാഠം αἰωνίου ἁμαρτήματος എന്നാണ് വായിക്കുന്നത്; പ്രസക്തമായ പാഠഭേദം സുതാര്യതയ്ക്കായി അടിക്കുറിപ്പിൽ ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘ദൂഷണം’ എന്ന പദം മൂലത്തിലെ മതപരവും നിന്ദാപരവുമായ ഭാരം നിലനിർത്തുന്നു. മൂലപാഠത്തിന്റെ അനിശ്ചിതത്വങ്ങളും പാഠഭേദവും അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
