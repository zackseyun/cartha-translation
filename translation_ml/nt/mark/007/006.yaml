reference: Mark 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “കപടികളായ നിങ്ങളെക്കുറിച്ച് യെശയ്യാവ് നന്നായി പ്രവചിച്ചു. എഴുതിയിരിക്കുന്നതുപോലെ: ‘ഈ ജനം അധരങ്ങൾകൊണ്ട് എന്നെ ബഹുമാനിക്കുന്നു; എന്നാൽ അവരുടെ ഹൃദയം എന്നിൽനിന്ന് വളരെ അകലെയാണ്.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ എന്നത് പ്രത്യേകം ചേർക്കാതെ സന്ദർഭമാറ്റത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: δὲ ഇവിടെ നേരിയ വൈരുധ്യമോ ആഖ്യാനത്തിലെ തിരിച്ചുവരവോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവൻ അവരോടു പറഞ്ഞു’ എന്ന സ്വാഭാവിക തുടക്കം തന്നെ ഈ മാറ്റം വ്യക്തമാക്കുന്നതിനാൽ ‘എന്നാൽ’ ചേർത്താൽ അനാവശ്യമായ ഊന്നൽ ഉണ്ടാകാം.
- source_word: εἶπεν αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: λέγωയും ദത്തിവിഭക്തിയിലുള്ള പരോക്ഷ കർമവും നേരായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: Καλῶς ἐπροφήτευσεν
  choice: നന്നായി പ്രവചിച്ചു
  rationale: Καλῶς എന്നതിന്റെ വിലയിരുത്തൽശക്തി ‘നന്നായി’ നിലനിർത്തുന്നു; ‘ശരിയായി’ എന്നു നൽകി കൃത്യത എന്ന അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: കപടഭക്തരായ നിങ്ങളെക്കുറിച്ച്
  rationale: περὶ ὑμῶν എന്നത് ‘നിങ്ങളെക്കുറിച്ച്’ എന്നും appositional ആയ τῶν ὑποκριτῶν നേരിട്ടുള്ള അഭിസംബോധനയുടെ ശക്തിയോടെ ‘കപടഭക്തരായ’ എന്നും നൽകുന്നു. മതപരമായ പുറംഭാവവും ഉള്ളിലെ അസത്യവും ഈ സന്ദർഭത്തിൽ വ്യക്തമാക്കാൻ ‘കപടഭക്തർ’ സ്വാഭാവികമാണ്.
- source_word: ὡς γέγραπται ὅτι
  choice: 'എഴുതിയിരിക്കുന്നതുപോലെ:'
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി ആരംഭിക്കുന്ന പതിവ് സൂത്രവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ὅτι പ്രത്യേകം ‘എന്ന്’ ആയി ആവർത്തിക്കേണ്ടതില്ല.
- source_word: Οὗτος ὁ λαὸς
  choice: ഈ ജനം
  rationale: ഏകവചന കൂട്ടനാമവും പ്രവാചകീയമായ ഉദ്ധരണിശൈലിയും നിലനിർത്തുന്നു.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: അധരങ്ങൾകൊണ്ട് എന്നെ ബഹുമാനിക്കുന്നു
  rationale: χείλη എന്ന ശരീരരൂപകവും τιμάω എന്നതിന്റെ ‘ബഹുമാനിക്കുക’ എന്ന നേരായ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: എന്നാൽ അവരുടെ ഹൃദയം
  rationale: λαός എന്ന കൂട്ടത്തെ സൂചിപ്പിക്കാൻ αὐτῶν ബഹുവചനമാണെങ്കിലും καρδία ഏകവചനമാണ്. മലയാളത്തിലും ‘അവരുടെ ഹൃദയം’ സ്വാഭാവികമായി കൂട്ടായ ആന്തരിക നിലപാടിനെ സൂചിപ്പിക്കുന്നു.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: എന്നിൽനിന്ന് വളരെ അകലെയാണ്
  rationale: ബന്ധപരവും ആത്മീയവുമായ അകലം ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗം സ്ഥലപരമായ അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യെശയ്യാവ് 29:13-ലെ കുറ്റപ്പെടുത്തൽ യേശു തന്റെ എതിരാളികൾക്ക് നേരിട്ട് പ്രയോഗിക്കുന്നത്
  choice: ‘കപടഭക്തരായ നിങ്ങളെക്കുറിച്ച്’ എന്നും ‘ഈ ജനം’ എന്നും നേരിട്ടുള്ള കുറ്റപ്പെടുത്തൽ നിലനിർത്തി
  alternative: ശ്രോതാക്കളെ നേരിട്ട് കുറ്റപ്പെടുത്താതെ പൊതുവായ മനുഷ്യപ്രവണതയായി മൃദൂകരിക്കുക
  rationale: ഗ്രീക്ക് പാഠം യെശയ്യാവിന്റെ വാക്കുകൾ ഇപ്പോഴുള്ള ശ്രോതാക്കൾക്ക് നേരിട്ട് പ്രയോഗിക്കുന്നു. അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെയും അതിന്റെ കടുപ്പം കുറയ്ക്കാതെയും ആ ശക്തി സംരക്ഷിക്കണം.
- issue: ഏകവചനമായ ‘ഹൃദയം’ കൂട്ടായ ജനത്തെക്കുറിച്ച് ഉപയോഗിക്കുന്നത്
  choice: ‘അവരുടെ ഹൃദയം’ എന്ന ഏകവചന രൂപകം നിലനിർത്തി
  alternative: ‘അവരുടെ ഹൃദയങ്ങൾ’ എന്ന് വ്യക്തിഗത ബഹുവചനമാക്കുക
  rationale: മൂലപാഠത്തിലെ കൂട്ടായ ഏകവചനരൂപകം ദൈവത്തിൽനിന്നുള്ള ജനത്തിന്റെ ആന്തരിക അകലം അവതരിപ്പിക്കുന്നു; അതിനെ വ്യക്തിഗത ഹൃദയങ്ങളുടെ ബഹുവചനമായി നിർബന്ധമായി വ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പ്രവാചകീയ ഉദ്ധരണിയുടെ ഔപചാരിക ഭാവം നിലനിർത്താൻ ‘ഈ ജനം’, ‘അധരങ്ങൾ’, ‘ഹൃദയം’ എന്നിവ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ആവശ്യമില്ല; മലയാളത്തിലെ ‘അവരുടെ ഹൃദയം’ മൂലപാഠത്തിലെ കൂട്ടായ ഏകവചനത്തെ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
