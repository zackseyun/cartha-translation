revisions:
- from: 'അവൻ അവരോടു പറഞ്ഞു: “കപടഭക്തരായ നിങ്ങളെക്കുറിച്ച് യെശയ്യാവ് നന്നായി പ്രവചിച്ചു. എഴുതിയിരിക്കുന്നതുപോലെ: ‘ഈ ജനം അധരങ്ങൾകൊണ്ട് എന്നെ ബഹുമാനിക്കുന്നു; എന്നാൽ അവരുടെ ഹൃദയം എന്നിൽനിന്ന് വളരെ അകലെയാണ്.’”'
  to: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “കപടികളായ നിങ്ങളെക്കുറിച്ച് യെശയ്യാവ് നന്നായി പ്രവചിച്ചു. എഴുതിയിരിക്കുന്നതുപോലെ: ‘ഈ ജനം അധരങ്ങൾകൊണ്ട് എന്നെ ബഹുമാനിക്കുന്നു; എന്നാൽ അവരുടെ ഹൃദയം എന്നിൽനിന്ന് വളരെ അകലെയാണ്.’”'
  rationale: 'Two limited revisions improve source fidelity: ‘എന്നാൽ’ represents the opening δέ, and ‘കപടികളായ’ renders ὑποκριτῶν without adding the narrower concept ‘devotees.’ The wording of the Isaiah citation, including its collective singular ‘ഹൃദയം,’ is retained.'
  reviewer_model: gpt-5.6-terra
