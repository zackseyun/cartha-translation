source:
  edition: SBLGNT
  text: ⸀οὐκέτι ἀφίετε αὐτὸν οὐδὲν ποιῆσαι τῷ ⸀πατρὶ ἢ τῇ ⸀μητρί,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/012.yaml
  text: you no longer allow him to do anything for his father or mother,[a]
translation:
  language: ml
  text: അവന്റെ അപ്പനോ അമ്മയ്‌ക്കോ വേണ്ടി ഒന്നും ചെയ്യാൻ നിങ്ങൾ ഇനി അവനെ അനുവദിക്കുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ അപ്പനെയോ അമ്മയെയോ സഹായിക്കാൻ ഒന്നും ചെയ്യാൻ.’ ഈ സന്ദർഭത്തിൽ വിശാലമായ ഗ്രീക്ക് പ്രയോഗത്തിൽ പ്രായോഗികമോ സാമ്പത്തികമോ ആയ സഹായവും ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: പിന്നെ ... ഇല്ല
  rationale: മുമ്പുണ്ടായിരുന്ന അനുവാദം ഇനി ഇല്ലെന്ന കാലപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀφίετε
  choice: അനുവദിക്കുന്നില്ല
  rationale: ഇവിടെ ἀφίημι എന്നത് ‘ക്ഷമിക്കുക’ എന്നല്ല, ഒരു പ്രവൃത്തി ചെയ്യാൻ അനുവദിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: മാതാപിതാക്കൾക്കായി ഉപയോഗിക്കാവുന്ന എന്തോ ഉള്ള പുരുഷനെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ ഏകവചന കർമരൂപം നിലനിർത്തുന്നു.
- source_word: οὐδὲν ποιῆσαι
  choice: ഒന്നും ചെയ്യാൻ
  rationale: അനുവദിക്കാതിരിക്കുക എന്ന ക്രിയയോടൊപ്പം, ഏതൊരു പ്രവൃത്തിയും വിലക്കുന്നു എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: തന്റെ അപ്പനോ അമ്മയ്ക്കോവേണ്ടി
  rationale: ദത്തിവ് രൂപങ്ങൾ ഇവിടെ പ്രയോജനം ലഭിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലുള്ള ആ വ്യക്തിയുടെ സ്വന്തം മാതാപിതാക്കളാണെന്ന് ‘തന്റെ’ വ്യക്തമാക്കുന്നു; ‘വേണ്ടി’ മൂലത്തിലെ വിശാലമായ പ്രയോജനാർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: കൊർബാൻ സന്ദർഭത്തിൽ സാമ്പത്തിക സഹായം എന്ന ആശയം വാക്യത്തിൽ നേരിട്ട് വ്യക്തമാക്കണമോ
  choice: ‘ഒന്നും ചെയ്യാൻ’ എന്ന വിശാലമായ പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി
  alternative: ‘ഒരു സഹായവും ചെയ്യാൻ’ അല്ലെങ്കിൽ ‘പരിപാലനത്തിനായി ഒന്നും ചെയ്യാൻ’
  rationale: ഗ്രീക്ക് വാക്യം പ്രവൃത്തിയുടെ സ്വഭാവം പ്രത്യേകമായി പറയുന്നില്ല; ചുറ്റുപാട് ഭൗതികമോ സാമ്പത്തികമോ ആയ സഹായം സൂചിപ്പിക്കുന്നുവെങ്കിലും, അത് മുഖ്യവാചകത്തിൽ ചേർക്കുന്നത് മൂലപാഠത്തെ അനാവശ്യമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അപ്പൻ/അമ്മ’ സാധാരണ വായനക്കാർക്ക് ലളിതവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്. തുടക്കത്തിലെ ‘അങ്ങനെ’ മുൻവാക്യത്തിലെ നടപടിയുടെ ഫലം സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വേറിട്ട ബന്ധകപദമില്ലാത്തതിനാൽ ഇത് സന്ദർഭബന്ധം വ്യക്തമാക്കുന്ന ലഘു വ്യവഹാരഘടകമാണ്.
