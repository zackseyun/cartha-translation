id: MRK.7.4
reference: Mark 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: ml
  text: 'ചന്തയിൽനിന്ന് വന്നശേഷം തങ്ങളെത്തന്നെ കഴുകിയല്ലാതെ അവർ ഭക്ഷണം കഴിക്കാറില്ല.[a] പാലിക്കാനായി അവർ സ്വീകരിച്ച മറ്റു പല കാര്യങ്ങളും ഉണ്ട്: പാനപാത്രങ്ങളുടെയും കുടങ്ങളുടെയും ചെമ്പുപാത്രങ്ങളുടെയും ഭക്ഷണത്തിനുള്ള ചാരുകട്ടിലുകളുടെയും[b] കഴുകലുകൾ—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തങ്ങളെത്തന്നെ മുക്കിയല്ലാതെ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ പലപ്പോഴും “സ്നാനം നൽകുക” എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് ആചാരശുദ്ധിക്കായുള്ള കഴുകലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ഭക്ഷണത്തിനുള്ള ചാരുകട്ടിലുകൾ” എന്ന വാക്കുകൾ ചില കൈയെഴുത്തുപ്രതികളിൽ ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: ചന്ത
  rationale: പൊതുവ്യാപാരസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ἀγοράയ്ക്ക് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: βαπτίσωνται
  choice: തങ്ങളെത്തന്നെ കഴുകുക
  rationale: മധ്യപ്രയോഗത്തിന്റെ സ്വയംസംബന്ധിത അർഥം നിലനിർത്തുകയും, ആചാരപരമായ ശുദ്ധീകരണസന്ദർഭത്തിൽ സ്നാനത്തിന്റെ കൂദാശാഭാവം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു; മുക്കിക്കഴുകുക എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: παρέλαβον κρατεῖν
  choice: പാലിക്കേണ്ടതിനു സ്വീകരിച്ചു
  rationale: പാരമ്പര്യങ്ങൾ സ്വീകരിക്കുകയും തുടർന്നും പാലിക്കുകയും ചെയ്യുന്നതിലുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: βαπτισμοὺς
  choice: കഴുകുന്നത്
  rationale: പാത്രങ്ങളുടെ ആചാരപരമായ കഴുകലിനെ സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു; ‘സ്നാനങ്ങൾ’ എന്നത് ഇവിടെ തെറ്റായ മതാനുഷ്ഠാനബന്ധം സൃഷ്ടിക്കാം.
- source_word: ξεστῶν
  choice: കുടങ്ങൾ
  rationale: ξέστης സൂചിപ്പിക്കുന്ന ജാർ/പിച്ചർ വർഗത്തിലുള്ള പാത്രത്തിന് പൊതുവായും എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളപദം.
- source_word: χαλκίων
  choice: ചെമ്പുപാത്രങ്ങൾ
  rationale: ചെമ്പോ ചെമ്പുമിശ്രലോഹമോ കൊണ്ടുള്ള ഉപകരണങ്ങളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ലോഹസംബന്ധിത അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: κλινῶν
  choice: ഭക്ഷണത്തിനുള്ള ചാരുകട്ടിലുകൾ
  rationale: κλίνηയുടെ കിടക്ക/ചാരുകട്ടിൽ എന്ന അർഥവും ഭക്ഷണസന്ദർഭത്തിൽ അതിന്റെ ഉപയോഗവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: ἄλλα πολλά
  choice: മറ്റു പലതും
  rationale: ഗ്രീക്കിലെ വിശാലവും നിർവചിക്കാത്തതുമായ പ്രയോഗം ‘പാരമ്പര്യങ്ങൾ’ എന്നു അമിതമായി വ്യക്തമാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആചാരശുദ്ധിയുടെ സന്ദർഭത്തിൽ βαπτίσωνται / βαπτισμοὺς എന്നതിന്റെ അർഥം
  choice: ‘തങ്ങളെത്തന്നെ കഴുകുക’ / ‘കഴുകുന്നത്’
  alternative: ‘തങ്ങളെത്തന്നെ മുക്കുക’ / ‘മുക്കലുകൾ’; ‘സ്നാനം ചെയ്യുക’ / ‘സ്നാനങ്ങൾ’
  rationale: ഇവിടെ വിഷയം പരീശന്മാരുടെ ശുദ്ധീകരണാചാരങ്ങളാണ്, ക്രിസ്തീയ സ്നാനമല്ല. മുഖ്യപാഠത്തിലെ ‘കഴുകുക’ സന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു; ‘മുക്കുക’ എന്ന യഥാർഥ ലെക്സിക്കൽ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പുരാതന ഭക്ഷണരീതിയിലെ κλίνηയെ ‘മേശ’ എന്നു സമതലപ്പെടുത്താതെ ‘ഭക്ഷണത്തിനുള്ള ചാരുകട്ടിൽ’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു. വാക്യാവസാനത്തിലെ ദീർഘവിരാമം അടുത്ത വാക്യത്തിലേക്കുള്ള ഗ്രീക്ക് ഘടന പ്രതിഫലിപ്പിക്കുന്നു.
