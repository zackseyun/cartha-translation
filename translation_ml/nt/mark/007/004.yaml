  rationale: The revision restores the Greek syntax in which the washings of vessels and couches are named as received observances, while retaining the draft’s sound lexical choices and the textual-variant footnote. The revised lexical note states the immersion/baptize alternative idiomatically in Malayalam and keeps the ritual-purity sense in the main text.
