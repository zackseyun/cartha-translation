  text: അവന്റെ ശിഷ്യന്മാരിൽ ചിലർ അശുദ്ധമായ[a] കൈകളാൽ—അതായത്, കഴുകാത്ത കൈകളാൽ—അപ്പം കഴിക്കുന്നത് അവർ കണ്ടു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘സാധാരണമായ കൈകളാൽ’ എന്നാണ്; ഇവിടെ അത് വെറും അഴുക്കിനെയല്ല, ആചാരപരമായി അശുദ്ധമെന്ന കണക്കാക്കപ്പെട്ട കൈകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മലിനമായ കൈകളാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: അവർ കണ്ടു
  rationale: മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാകുന്ന പരീശന്മാരെയും ചില ശാസ്ത്രിമാരെയും കർത്താവാക്കി, ഗ്രീക്ക് കൃന്തത്തിന്റെ നിരീക്ഷണഭാവം സ്വാഭാവികമായ മലയാള ക്രിയാരൂപത്തിൽ നൽകി.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരിൽ ചിലർ
  rationale: τινάς സഹിതമുള്ള ഭാഗിക ഷഷ്ഠി ‘അവന്റെ ശിഷ്യന്മാരിൽ ചിലർ’ എന്നാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ὅτι
  choice: …കഴിക്കുന്നത്
  rationale: ὅτι കണ്ടതിന്റെ ഉള്ളടക്കമാണ് അവതരിപ്പിക്കുന്നത്; മലയാളത്തിൽ ക്രിയാനാമഘടന ഉപയോഗിക്കുന്നത് ‘അവർ കണ്ടു’ എന്നതിനോടൊപ്പം സ്വാഭാവികമാണ്.
- source_word: κοιναῖς χερσίν
  choice: അശുദ്ധമായ കൈകളാൽ
  rationale: κοινός എന്നതിന് അക്ഷരാർഥത്തിൽ ‘പൊതുവായ/സാധാരണ’ എന്നുണ്ടെങ്കിലും ഇവിടെ യഹൂദ ആചാരശുദ്ധിയുടെ പശ്ചാത്തലത്തിൽ ‘അശുദ്ധമായ’ എന്നാണ് അർഥം. ‘സാധാരണ കൈകൾ’ മലയാളത്തിൽ ഈ ആശയം വ്യക്തമാക്കാതെ തെറ്റിദ്ധരിപ്പിക്കും; ആചാരപരമായ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: അതായത്, കഴുകാത്ത കൈകളാൽ
  rationale: മർക്കോസിന്റെ വിശദീകരണം വ്യക്തമായി നിലനിർത്തുകയും ‘കൈകളാൽ’ ആവർത്തിച്ച് മുൻപ്രയോഗവുമായി ബന്ധം വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: ἐσθίουσιν
  choice: കഴിക്കുന്നത്
  rationale: കാണപ്പെട്ടുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉള്ളടക്കവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: τοὺς ἄρτους
  choice: അപ്പം
  rationale: ബഹുവചനരൂപം ഉണ്ടായിരുന്നാലും ഇവിടെ ഭക്ഷണമായ അപ്പത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗമാണിത്.
theological_decisions:
- issue: κοινός എന്ന പദത്തിലെ ആചാരശുദ്ധിസംബന്ധിയായ സൂക്ഷ്മത
  choice: മുഖ്യപാഠത്തിൽ ‘അശുദ്ധമായ’ എന്ന് നൽകി, അക്ഷരാർഥവും ആചാരപരമായ അർഥവും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘സാധാരണമായ കൈകളാൽ’ അല്ലെങ്കിൽ ‘മലിനമായ കൈകളാൽ’
  rationale: സന്ദർഭം വെറും ശാരീരിക അഴുക്കിനെക്കുറിച്ചല്ല, ആചാരപരമായി അശുദ്ധമെന്ന കണക്കാക്കലിനെക്കുറിച്ചാണ്. ‘അശുദ്ധമായ’ എന്നത് മലയാളത്തിൽ ഈ മതപരമായ അർഥം വഹിക്കുമ്പോൾ, തുടർന്നുള്ള ‘കഴുകാത്ത’ എന്ന വിശദീകരണം മൂലപാഠത്തിലെ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യം തുടർന്നുപോകുന്നതായി സൂചിപ്പിക്കാൻ മൂലപാഠത്തിലെ അവസാന ദീർഘവിരാമചിഹ്നം നിലനിർത്തി; വിശദീകരണഭാഗം ദീർഘവിരാമങ്ങൾക്കുള്ളിൽ നൽകി.
