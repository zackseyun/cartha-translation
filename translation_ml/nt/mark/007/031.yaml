source:
  edition: SBLGNT
  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: ml
  text: വീണ്ടും, സോരിന്റെ പ്രദേശത്തുനിന്ന് പുറപ്പെട്ട്, അവൻ സീദോൻവഴിയായി ദെക്കപ്പൊലി പ്രദേശത്തിന്റെ നടുവിലൂടെ ഗലീലക്കടലിലേക്കു വന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദെക്കപ്പൊലി പ്രദേശത്തിന്റെ ഇടയിലൂടെ” അല്ലെങ്കിൽ “ഇടയിൽകൂടി.” ἀνὰ μέσον എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് “നടുവിലൂടെ,” “ഇടയിലൂടെ,” അല്ലെങ്കിൽ “ഇടയിൽ” എന്നിങ്ങനെ അർഥമാകാം; ഇവിടെ വിവരിക്കുന്ന യാത്രാമാർഗം ഭൂമിശാസ്ത്രപരമായി വ്യക്തമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: പിന്നെ
  rationale: കഥയിലെ തുടർന്നുള്ള പുതിയ യാത്രയെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘വീണ്ടും’ എന്നതിനെക്കാൾ ‘പിന്നെ’ ഒഴുക്കുള്ളതാണ്.
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: സോർപ്രദേശം വിട്ട്
  rationale: മുൻകാലികമായ aorist participle യാത്രയുടെ ആദ്യഘട്ടമായി നൽകുന്നു; ὅρια ഇവിടെ അതിർത്തിരേഖയല്ല, പ്രദേശമാണ്.
- source_word: ἦλθεν διὰ Σιδῶνος εἰς τὴν θάλασσαν τῆς Γαλιλαίας
  choice: സീദോൻവഴിയായി ഗലീലക്കടലിലേക്കു വന്നു
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന ‘വഴിയായി/കൂടി’ എന്ന യാത്രാമാർഗവും ἦλθεν എന്ന ക്രിയയുടെ ‘വന്നു’ എന്ന അടിസ്ഥാനഭാവവും നിലനിർത്തുന്നു.
- source_word: ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως
  choice: ദെക്കപ്പൊലി പ്രദേശത്തിന്റെ നടുവിലൂടെ
  rationale: അസാധാരണമായ സ്ഥലവിവരണത്തിലെ ‘മധ്യത്തിലൂടെ/ഇടയിലൂടെ’ എന്ന ഭാവം പരത്തിക്കളയാതെ സൂക്ഷിക്കുന്നു; ὅρια പ്രദേശമെന്ന അർഥത്തിൽ എടുത്തിരിക്കുന്നു.
- source_word: Δεκαπόλεως
  choice: ദെക്കപ്പൊലി
  rationale: പത്തു നഗരങ്ങളടങ്ങിയതായി അറിയപ്പെട്ടിരുന്ന പ്രദേശത്തിന്റെ പാരമ്പര്യ മലയാള ഭൂനാമരൂപം ഉപയോഗിക്കുന്നു.
