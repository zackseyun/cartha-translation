translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഗദ്യശൈലി. ഗ്രീക്കിലെ ദീർഘമായ യാത്രാവിവരണം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി അർധവിരാമത്തോടെ വിഭജിച്ചു; രണ്ടാം ഖണ്ഡം പുതിയ വിവരമൊന്നും ചേർക്കാതെ ἀνὰ μέσον എന്ന പ്രയോഗത്തിന്റെ ബന്ധം വ്യക്തമാക്കുന്നു.
