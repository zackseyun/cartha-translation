revisions:
- from: പിന്നെ യേശു സോർപ്രദേശം വിട്ട് സീദോൻവഴിയായി ഗലീലക്കടലിലേക്കു വന്നു; ദെക്കപ്പൊലി പ്രദേശത്തിന്റെ നടുവിലൂടെയായിരുന്നു യാത്ര.[a]
  to: വീണ്ടും, സോരിന്റെ പ്രദേശത്തുനിന്ന് പുറപ്പെട്ട്, അവൻ സീദോൻവഴിയായി ദെക്കപ്പൊലി പ്രദേശത്തിന്റെ നടുവിലൂടെ ഗലീലക്കടലിലേക്കു വന്നു.[a]
  rationale: ‘വീണ്ടും’ πάλιν-ന്റെ വ്യക്തമായ ഭാവം നിലനിർത്തുന്നു. ദെക്കപ്പൊലിയെക്കുറിച്ചുള്ള പ്രയോഗം മുഖ്യയാത്രാവിവരണത്തിൽ ചേർത്തതിലൂടെ ഗ്രീക്ക് വാക്യഘടനയും വിവാദമായ സ്ഥലസൂചനയുടെ അവ്യക്തതയും സംരക്ഷിക്കുന്നു. പേരുകളോ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനങ്ങളോ കൂട്ടിച്ചേർത്തിട്ടില്ല.
