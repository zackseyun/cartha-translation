source:
  edition: SBLGNT
  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: ml
  text: ഇത് ആരോടും പറയരുതെന്ന് അവൻ അവരോടു കർശനമായി കല്പിച്ചു. എന്നാൽ അവൻ അവരോട് എത്രയധികം കല്പിച്ചുവോ, അത്രയധികം അവർ അത് പരക്കെ പ്രസിദ്ധപ്പെടുത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “എന്നാൽ അവൻ അവരോട് എത്ര കർശനമായി വിലക്കിയോ, അത്രയേറെ അവർ അത് പ്രസിദ്ധപ്പെടുത്തി”; അഥവാ, “അവർ അത് അതിലേറെ പ്രസിദ്ധപ്പെടുത്തി.”'
    reason: ὅσον ... μᾶλλον περισσότερον എന്ന താരതമ്യവും ഊന്നലും മലയാളത്തിൽ വ്യത്യസ്തമായി സ്വാഭാവികമായി അവതരിപ്പിക്കാം.
lexical_decisions:
- source_word: διεστείλατο
  choice: കർശനമായി കല്പിച്ചു
  rationale: διαστέλλομαι എന്ന ക്രിയ ഇവിടെ ഉറച്ച വിലക്ക് ഉൾക്കൊള്ളുന്ന നിർദേശം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കല്പിച്ചു’ അതിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘കർശനമായി’ സന്ദർഭത്തിലെ ഉറച്ച ഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: ഇത് ആരോടും പറയരുതെന്ന്
  rationale: കല്പനയുടെ ഉള്ളടക്കം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിൽ കർമം തുറന്നുപറഞ്ഞിട്ടില്ലെങ്കിലും, സംഭവിച്ച കാര്യം അറിയിക്കരുതെന്ന സന്ദർഭാർത്ഥം ‘ഇത്’ എന്നതിലൂടെ ലഭിക്കുന്നു.
- source_word: ὅσον ... διεστέλλετο
  choice: അവൻ അവരോട് എത്രയധികം കല്പിച്ചുവോ
  rationale: ὅσον എന്ന താരതമ്യഘടനയും imperfect ക്രിയയുടെ ആവർത്തിത സ്വഭാവവും ‘എത്രയധികം ... അത്രയധികം’ എന്ന മലയാള ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: μᾶλλον περισσότερον
  choice: അത്രയധികം ... പരക്കെ
  rationale: രണ്ട് വർധനസൂചക ക്രിയാവിശേഷണങ്ങളുടെയും ഊന്നൽ ഒരൊറ്റ മങ്ങിയ പദത്തിലേക്ക് ചുരുക്കാതെ, താരതമ്യഘടനയും ‘പരക്കെ’ എന്ന പദവും ചേർത്ത് പൊതുവ്യാപനവും വർധനയും പ്രകടമാക്കുന്നു.
- source_word: ἐκήρυσσον
  choice: അവർ അത് പരക്കെ പ്രസിദ്ധപ്പെടുത്തി
  rationale: κηρύσσω പൊതുവായി വിളംബരം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രസിദ്ധപ്പെടുത്തി’ പൊതുഘോഷണത്തിന്റെ അർത്ഥം നൽകുന്നു; ‘പ്രസംഗിച്ചു’ എന്ന മതസാങ്കേതിക ധ്വനി ഒഴിവാക്കുന്നു. ‘അത്’ സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചതാണ്.
theological_decisions:
- issue: മശീഹായുടെ രഹസ്യത്വം / യേശുവിന്റെ കല്പനയുടെ ശക്തി
  choice: ആരോടും പറയരുതെന്നത് യഥാർത്ഥവും ഉറച്ചതുമായ വിലക്കായി നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: വിലക്കിന്റെ കാരണം വിശദീകരിക്കുകയോ ‘മുന്നറിയിപ്പു നൽകി’ എന്നു വ്യാഖ്യാനാത്മകമായി മാറ്റുകയോ ചെയ്യുക.
  rationale: വാക്യം കല്പനയും അതിന് വിരുദ്ധമായ ജനങ്ങളുടെ പരസ്യപ്രഖ്യാപനവും തമ്മിലുള്ള സംഘർഷം മാത്രം അവതരിപ്പിക്കുന്നു. അതിന്റെ പിന്നിലെ ഉദ്ദേശ്യം വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമായ ഒരു പരിഹാരം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘കർശനമായി കല്പിച്ചു’ വിലക്കിന്റെ ഉറച്ച സ്വരം നിലനിർത്തുന്നു; ‘പരക്കെ പ്രസിദ്ധപ്പെടുത്തി’ പൊതുഘോഷണത്തിന്റെ അർത്ഥം നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
