source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: ml
  text: അവന്റെ ചെവികൾ തുറന്നു[a]; അവന്റെ നാവിന്റെ കെട്ട് അഴിഞ്ഞു[b]; അവൻ വ്യക്തമായി സംസാരിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ കേൾവി തുറന്നു.’ ഗ്രീക്കുപദം ചെവികളെയോ കേൾവിശക്തിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ നാവിന്റെ കെട്ട് അഴിഞ്ഞു’; അതായത്, അവന്റെ സംസാരതടസ്സം നീങ്ങി.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ശരിയായി’ അല്ലെങ്കിൽ ‘വ്യക്തമായോ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: തുറന്നു
  rationale: ἀνοίγω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിപ്രയോഗമാണ്. മലയാളത്തിൽ ‘ചെവികൾ തുറന്നു’ എന്ന സ്വാഭാവിക പ്രയോഗം കർമണാർത്ഥവും കേൾവിശക്തിയുടെ പെട്ടെന്നുള്ള പുനഃസ്ഥാപനവും വ്യക്തമാക്കുന്നു.
- source_word: αἱ ἀκοαί
  choice: അവന്റെ ചെവികൾ
  rationale: ἀκοαί എന്നത് കേൾവിശക്തിയെയോ ചെവികളെയോ സൂചിപ്പിക്കാം. ബഹുവചനവും സൗഖ്യദാനസന്ദർഭവും കണക്കിലെടുത്ത് പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ ‘ചെവികൾ’ സ്വീകരിച്ചു; മറ്റർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ἐλύθη
  choice: അഴിഞ്ഞു
  rationale: λύω എന്നതിന്റെ കർമണിരൂപം ബന്ധനം അഴിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കെട്ട് അഴിഞ്ഞു’ എന്ന മലയാളപ്രയോഗം ഉറവിടത്തിലെ ദൃശ്യരൂപവും സ്വാഭാവികതയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: അവന്റെ നാവിന്റെ കെട്ട്
  rationale: δεσμός എന്നത് കെട്ട്, ബന്ധനം, ചങ്ങല എന്നിവയെ സൂചിപ്പിക്കുന്നു. സംസാരതടസ്സം എന്ന വ്യാഖ്യാനത്തിലേക്ക് നേരിട്ട് മാറാതെ ഗ്രീക്കിലെ രൂപകം നിലനിർത്തുന്നു.
- source_word: ἐλάλει
  choice: അവൻ സംസാരിച്ചു
  rationale: λαλέω എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപമാണെങ്കിലും ഇവിടെ സൗഖ്യം ലഭിച്ചതിനു ശേഷമുള്ള സംസാരശേഷിയെ സ്വാഭാവികമായി അറിയിക്കാൻ ‘സംസാരിച്ചു’ യോജിക്കുന്നു. ‘സംസാരിക്കാൻ തുടങ്ങി’ എന്നത് ഉറവിടത്തിൽ വ്യക്തമല്ലാത്ത ആരംഭഭാവം ചേർക്കും.
- source_word: ὀρθῶς
  choice: വ്യക്തമായി
  rationale: ὀρθῶς എന്നതിന് ശരിയായി, യഥാവിധി, വ്യക്തമായി എന്നീ അർത്ഥങ്ങളുണ്ട്. സംസാരസൗഖ്യത്തിന്റെ സന്ദർഭത്തിൽ ‘വ്യക്തമായി’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: നാവുമായി ബന്ധപ്പെട്ട സൗഖ്യവാക്യം അക്ഷരാർഥരൂപകമായി വേണമോ വ്യാഖ്യാനാത്മകമായി വേണമോ അവതരിപ്പിക്കൽ
  choice: ‘അവന്റെ നാവിന്റെ കെട്ട് അഴിഞ്ഞു’ എന്ന ഉറവിടരൂപകം പ്രധാന പാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘അവന്റെ സംസാരതടസ്സം നീങ്ങി’ അല്ലെങ്കിൽ ‘അവന്റെ നാവ് സ്വതന്ത്രമായി.’
  rationale: വാക്യം അത്ഭുതകരമായ സൗഖ്യത്തെ വിവരിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം വൈദ്യശാസ്ത്രപരമായ പദത്തിനു പകരം വ്യക്തമായ ഒരു രൂപകം ഉപയോഗിക്കുന്നു. അതിനെ നിലനിർത്തുന്നത് പാഠത്തിന്റെ ദൃശ്യശക്തി സംരക്ഷിക്കുകയും വ്യാഖ്യാനം അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘നാവിന്റെ കെട്ട് അഴിഞ്ഞു’ എന്ന സ്വാഭാവിക രൂപകത്തിലൂടെ ഉറവിടത്തിലെ δεσμός–λύω പദബന്ധം സംരക്ഷിച്ചു. ആശയവ്യക്തതയ്ക്കായി ഓരോ അടിക്കുറിപ്പ് ചിഹ്നവും ബന്ധപ്പെട്ട പദഘടകത്തിനു പിന്നാലെ ചേർത്തു.
