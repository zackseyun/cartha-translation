source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “നിങ്ങളുടെ പാരമ്പര്യം കാത്തുസൂക്ഷിക്കുന്നതിനായി ദൈവത്തിന്റെ കൽപന നിങ്ങൾ എത്ര നന്നായി നിരസിക്കുന്നു!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങളുടെ പാരമ്പര്യം കാത്തുസൂക്ഷിക്കുന്നതിനായി ദൈവത്തിന്റെ കൽപന നിരസിക്കുന്നതിൽ നിങ്ങൾ നന്നായി ചെയ്യുന്നു.” ഇവിടെ ഗ്രീക്കിലെ ക്രിയാവിശേഷണം പ്രശംസയല്ല, പരിഹാസമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപത്തിന്റെ തുടർച്ചയെയോ ആവർത്തനത്തെയോ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Καλῶς
  choice: എത്ര ഭംഗിയായി
  rationale: ഇവിടെ പദം പ്രശംസയായല്ല, പരിഹാസത്തോടെയുള്ള ശാസനയായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; ഈ പ്രയോഗം ആ വ്യംഗ്യം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀθετεῖτε
  choice: തള്ളിക്കളയുന്നു
  rationale: അധികാരമുള്ള കല്പനയെ ബോധപൂർവം നിരസിക്കുകയോ പ്രാബല്യമില്ലാതാക്കുകയോ ചെയ്യുന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἐντολὴν
  choice: കല്പന
  rationale: ദൈവിക ആജ്ഞയുടെ ഗൗരവവും ബൈബിൾസന്ദർഭത്തിലെ പരിചിതമായ ഭാഷയും നിലനിർത്തുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചകപ്രയോഗം നേരിട്ട് നൽകുകയും ‘നിങ്ങളുടെ പാരമ്പര്യം’ എന്നതിനോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἵνα
  choice: കാത്തുസൂക്ഷിക്കേണ്ടതിന്
  rationale: പ്രവൃത്തിയുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ἵναയുടെ ലക്ഷ്യാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: παράδοσιν
  choice: പാരമ്പര്യം
  rationale: കൈമാറിക്കിട്ടിയ മനുഷ്യാചാരമോ ഉപദേശമോ എന്ന സന്ദർഭാർഥം സംക്ഷിപ്തവും പരിചിതവുമായ പദത്തിൽ നൽകുന്നു.
- source_word: τηρήσητε
  choice: കാത്തുസൂക്ഷിക്കുക
  rationale: പാരമ്പര്യം നിലനിർത്തുക/പാലിക്കുക എന്ന അർഥം നൽകുകയും ദൈവകല്പന ‘തള്ളിക്കളയുന്നു’ എന്നതിനോടുള്ള മൂർച്ചയുള്ള വൈരുധ്യം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വാക്കുകളുടെ സ്വരം
  choice: നേരിട്ടുള്ള പ്രശംസയല്ല, പരിഹാസത്തോടെയുള്ള ശാസന
  alternative: ‘ദൈവത്തിന്റെ കല്പന തള്ളിക്കളയുന്നതിൽ നിങ്ങൾ നന്നായി ചെയ്യുന്നു’ എന്ന അക്ഷരാർഥ പ്രശംസയായി വായിക്കൽ
  rationale: സന്ദർഭത്തിൽ മനുഷ്യപാരമ്പര്യത്തിനുവേണ്ടി ദൈവകല്പന നിരസിക്കുന്നതിനെ യേശു കുറ്റപ്പെടുത്തുകയാണ്. അതിനാൽ καλῶς എന്നതിലെ വ്യംഗ്യം നിലനിർത്തി, അംഗീകാരം സൂചിപ്പിക്കാത്തവിധം വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ അപൂർണകാലത്തിന്റെ തുടർച്ചയും καλῶς എന്ന പദത്തിന്റെ പരിഹാസസ്വരവും നിലനിർത്തിയിരിക്കുന്നു.
