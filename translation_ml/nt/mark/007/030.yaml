id: MRK.7.30
reference: Mark 7:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: ml
  text: അവൾ തന്റെ വീട്ടിലേക്കു ചെന്നപ്പോൾ, കുട്ടി കിടക്കയിൽ കിടക്കുന്നതും ഭൂതം പുറത്തുപോയിരിക്കുന്നതും കണ്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπελθοῦσα
  choice: ചെന്നപ്പോൾ
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള സംഭവത്തെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവിക മലയാളത്തിൽ കാലബന്ധമുള്ള ഉപവാക്യമായി നൽകി. പുറപ്പെട്ടുപോകൽ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: തന്റെ വീട്ടിലേക്കു
  rationale: അവളുടെ സ്വന്തം വാസസ്ഥലത്തിലേക്കുള്ള നീക്കത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പരാവർത്തക സർവനാമം കർത്താവുമായുള്ള ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εὗρεν
  choice: കണ്ടു
  rationale: εὑρίσκω എന്നതിന്റെ ഈ വിവരണസന്ദർഭത്തിലെ അർഥം, വീട്ടിലെത്തിയപ്പോൾ അവസ്ഥ നേരിൽ കണ്ടറിഞ്ഞു എന്നതാണ്; 'കണ്ടു' ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: παιδίον
  choice: കുട്ടി
  rationale: ഈ വാക്യത്തിലെ നപുംസകലിംഗമായ പൊതുപദം സംരക്ഷിക്കുന്നു; മുൻസന്ദർഭത്തിൽ കുട്ടി അവളുടെ മകളാണെന്നു വ്യക്തമാകുന്നു.
- source_word: βεβλημένον
  choice: കിടക്കുന്നതും
  rationale: βάλλω എന്ന ക്രിയയുടെ perfect passive participle ഇവിടെ കിടക്കമേലുള്ള ഫലാവസ്ഥയെ വിവരിക്കുന്നു. അക്രമമായി എറിയപ്പെട്ടുവെന്ന അനാവശ്യ സൂചന ഒഴിവാക്കി സ്വാഭാവികമായ നിലാവസ്ഥ നൽകി.
- source_word: ἐπὶ τὴν κλίνην
  choice: കിടക്കയിൽ
  rationale: കുട്ടിയുടെ കിടക്കമേലുള്ള സ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δαιμόνιον
  choice: ഭൂതം
  rationale: δαιμόνιον എന്ന പദത്തിന് സാധാരണ മലയാള ബൈബിൾ-ഭാഷയിലും പൊതുഭാഷയിലും മനസ്സിലാകുന്ന നേരിട്ടുള്ള തുല്യപദം.
- source_word: ἐξεληλυθός
  choice: വിട്ടുപോയിരിക്കുന്നതും
  rationale: ἐξέρχομαι എന്നതിന്റെ perfect participle സൂചിപ്പിക്കുന്ന പുറത്തുപോകലും അതിന്റെ തുടരുന്ന ഫലമായ അഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഭൂതബാധ നീങ്ങിയതിന്റെ വിവരണം
  choice: ഭൂതം വിട്ടുപോയിരിക്കുന്നതും
  alternative: ഭൂതം പുറത്തുപോയിരിക്കുന്നതും
  rationale: ഗ്രീക്ക് perfect participle ഭൂതം പുറത്തുപോയി ഇപ്പോൾ അവിടെ ഇല്ലെന്ന പൂർത്തിയായ ഫലാവസ്ഥ സൂചിപ്പിക്കുന്നു. 'വിട്ടുപോയിരിക്കുന്നു' മലയാളത്തിൽ ആ ഫലം സ്വാഭാവികമായി അറിയിക്കുന്നു; സംഭവത്തെ വിശദീകരിച്ച് വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ participial ഘടനകളെ സ്വാഭാവികമായ കാലോപവാക്യമായും സമാന്തര object clauses ആയും അവതരിപ്പിച്ചു; വാക്യത്തിലെ സംഭവക്രമവും പൂർത്തിയായ ഫലാവസ്ഥയും നിലനിർത്തി.
