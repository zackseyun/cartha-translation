id: MRK.7.21
reference: Mark 7:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഉള്ളിൽനിന്ന്—മനുഷ്യരുടെ ഹൃദയത്തിൽനിന്ന്—ദുഷിച്ച ചിന്തകൾ പുറപ്പെടുന്നു: ലൈംഗിക അധാർമിക പ്രവൃത്തികൾ[a], മോഷണങ്ങൾ, കൊലപാതകങ്ങൾ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഈ പദം ബഹുവചനത്തിലാണ്; വിവിധതരം അവിഹിത ലൈംഗിക പ്രവൃത്തികളെ വിശാലമായി സൂചിപ്പിക്കുന്നു. ‘ലൈംഗിക അധാർമികത’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσωθεν
  choice: ഉള്ളിൽനിന്ന്
  rationale: ബാഹ്യമായതും ആന്തരികമായതും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യവും ആന്തരിക ഉറവിടം എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻ പ്രസ്താവനയ്ക്കുള്ള വിശദീകരണകാരണം അവതരിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: καρδίας
  choice: ഹൃദയം
  rationale: മനുഷ്യന്റെ ധാർമികവും ഇച്ഛാപരവുമായ ആന്തരിക കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപരമായ രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ഇവിടെ പദം മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മനുഷ്യരുടെ’ എന്നത് ലിംഗഭേദമില്ലാതെ ആ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: ദുഷിച്ച ചിന്തകൾ
  rationale: ആന്തരികമായ ആലോചനകളെയും അവയുടെ ധാർമിക ദുഷ്ടതയെയും വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκπορεύονται
  choice: പുറപ്പെടുന്നു
  rationale: ആന്തരിക ഉറവിടത്തിൽനിന്ന് പുറത്തേക്കു വരുന്നു എന്ന ദൃശ്യരൂപവും വർത്തമാനകാല സ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: πορνεῖαι
  choice: ലൈംഗിക അധാർമിക പ്രവൃത്തികൾ
  rationale: അവിഹിതമായ ലൈംഗിക പ്രവൃത്തികളെ വിശാലമായി സൂചിപ്പിക്കുകയും ഗ്രീക്കിലെ ബഹുവചനത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: κλοπαί
  choice: മോഷണങ്ങൾ
  rationale: ദുർഗുണപ്പട്ടികയിലെ ബഹുവചനമായ മോഷണപ്രവൃത്തികളെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: φόνοι
  choice: കൊലപാതകങ്ങൾ
  rationale: വെറും കൊല്ലലുകളെന്ന വിശാല അർഥമല്ല, അധാർമികവും നിയമവിരുദ്ധവുമായ മനുഷ്യവധങ്ങളാണ് ഉദ്ദേശ്യമെന്ന ശക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀνθρώπων എന്ന പൊതുവായ മനുഷ്യസൂചന
  choice: മനുഷ്യരുടെ
  alternative: പുരുഷന്മാരുടെ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം ഇവിടെ പുരുഷന്മാരെ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല; മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവികവും കൃത്യവുമായ പൊതുപദം തെരഞ്ഞെടുത്തു.
- issue: πορνεῖαι എന്ന പദത്തിന്റെ വ്യാപ്തിയും ബഹുവചനവും
  choice: ലൈംഗിക അധാർമിക പ്രവൃത്തികൾ
  alternative: ലൈംഗിക അധാർമികത; വ്യഭിചാരങ്ങൾ
  rationale: ഒരു പ്രത്യേകതരം ലൈംഗിക പാപത്തിലേക്ക് അർഥം ചുരുക്കാതെ, വിവിധ അവിഹിത ലൈംഗിക പ്രവൃത്തികളെ ഉൾക്കൊള്ളുന്ന പദത്തിന്റെ വ്യാപ്തിയും ബഹുവചനരൂപവും സംരക്ഷിക്കുന്നു.
- issue: ഹൃദയം എന്ന മാനവശാസ്ത്രപരമായ രൂപകം
  choice: ഹൃദയം
  alternative: അന്തരംഗം
  rationale: മൂലപാഠത്തിലെ രൂപകം നിലനിർത്തുകയും മനുഷ്യന്റെ ചിന്ത, ഇച്ഛ, ധാർമിക പ്രവണത എന്നിവയുടെ ആന്തരിക കേന്ദ്രം എന്ന അർഥം വായനക്കാരന് തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘ഉള്ളിൽനിന്ന്—മനുഷ്യരുടെ ഹൃദയത്തിൽനിന്ന്—’ എന്ന ഘടന മൂലപാഠത്തിലെ ആവർത്തനാത്മക ഊന്നൽ നിലനിർത്തുന്നു; ദുർഗുണപ്പട്ടികയിലെ ബഹുവചനങ്ങളും സാധ്യമായത്ര സ്വാഭാവികമായി സംരക്ഷിച്ചു.
