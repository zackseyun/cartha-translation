id: MRK.7.5
reference: Mark 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: ml
  text: 'പരീശന്മാരും ശാസ്ത്രിമാരും അവനോടു ചോദിച്ചു: “നിന്റെ ശിഷ്യന്മാർ മൂപ്പന്മാരുടെ പാരമ്പര്യമനുസരിച്ച് നടക്കാതെ, അശുദ്ധമായ കൈകളാൽ[a] അപ്പം കഴിക്കുന്നത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘സാധാരണ കൈകളാൽ’; ഇവിടെ ആചാരപരമായി അശുദ്ധമായ കൈകളെ സൂചിപ്പിക്കുന്നു.
    reason: κοιναῖς എന്ന പദത്തിന്റെ അക്ഷരാർഥവും ഈ സന്ദർഭത്തിലെ ആചാരപരമായ അർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: ചോദിച്ചു
  rationale: ആഖ്യാനത്തിലെ വർത്തമാനകാലത്തെ സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു; ആവർത്തിച്ചുള്ള ചോദ്യം എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: യഹൂദനിയമപണ്ഡിതരുടെ അംഗീകൃത വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന, സുവിശേഷസന്ദർഭത്തിൽ പരിചിതമായ മലയാള പദം.
- source_word: περιπατοῦσιν
  choice: നടക്കുക
  rationale: ജീവിതചര്യയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അർഥം ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: മൂപ്പന്മാരുടെ പാരമ്പര്യമനുസരിച്ച്
  rationale: κατάയുടെ മാനദണ്ഡാനുസരണ അർഥവും πρεσβύτεροι എന്ന അധികാരപ്പെട്ട മുൻഗാമികളോടു ബന്ധപ്പെട്ട പദവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: κοιναῖς χερσὶν
  choice: അശുദ്ധമായ കൈകളാൽ
  rationale: ഇവിടെ κοινός ശാരീരികമായ അഴുക്കിനെയല്ല, ആചാരപരമായ അശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘അശുദ്ധമായ’ ആ വ്യവഹാരാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἄρτον
  choice: അപ്പം
  rationale: ഭക്ഷണത്തെ പൊതുവായി സൂചിപ്പിക്കാവുന്ന ഏകവചനമായ ‘അപ്പം’ എന്ന മൂലപദം നിലനിർത്തുന്നു.
theological_decisions:
- issue: κοινός സൂചിപ്പിക്കുന്ന ആചാരപരമായ സ്ഥിതി
  choice: ‘അശുദ്ധമായ’ എന്നു പരിഭാഷപ്പെടുത്തി; ഇത് ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘സാധാരണമായ’ അഥവാ ‘മലിനമായ’
  rationale: തർക്കവിഷയം ശുചിത്വമോ ധാർമികദോഷമോ അല്ല, പരീശന്മാരുടെ ശുദ്ധാചാരപാരമ്പര്യമാണ്. അതിനാൽ ആചാരപരമായ അർഥം സംരക്ഷിക്കുകയും തുടർന്നുള്ള വാദത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നടക്കുക’ എന്ന മൂലരൂപകം ഉദ്ദേശപൂർവം നിലനിർത്തി; ‘മൂപ്പന്മാർ’ സഭയിലെ പദവിയെ നിർബന്ധമായി സൂചിപ്പിക്കാതെ മുൻകാല അധികാരികളെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ ഉപയോഗിച്ചു.
