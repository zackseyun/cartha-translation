id: MRK.7.27
reference: Mark 7:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: ml
  text: 'അവൻ അവളോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “മക്കൾ ആദ്യം തൃപ്തിയായി ഭക്ഷിക്കട്ടെ; മക്കളുടെ അപ്പം എടുത്ത് ചെറിയ നായ്ക്കൾക്ക്[a] എറിഞ്ഞുകൊടുക്കുന്നത് നല്ലതല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വീട്ടിലെ നായ്ക്കൾക്ക്”; ലളിതമായി “നായ്ക്കൾക്ക്” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ ലഘുതാസൂചകമായ പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ അലഞ്ഞുതിരിയുന്ന നായകളെക്കാൾ ചെറിയതോ വീട്ടിൽ വളർത്തുന്നതോ ആയ നായകളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപത്തിന്റെ തുടർച്ചാസൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗവുമാണ്.
- source_word: Ἄφες
  choice: …ട്ടെ
  rationale: അനുവദിക്കുക എന്ന ആജ്ഞാർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന രൂപം.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: മക്കൾക്കുള്ള മുൻഗണന വ്യക്തമാക്കുന്നു; മറ്റുള്ളവർക്ക് പിന്നീട് ലഭിക്കാമെന്ന സാധ്യത ഇല്ലാതാക്കുന്നില്ല.
- source_word: χορτασθῆναι
  choice: തൃപ്തിയായി ഭക്ഷിക്കട്ടെ
  rationale: വയറുനിറയെ ഭക്ഷിച്ച് തൃപ്തരാകുക എന്ന ആശയം ഭക്ഷണരൂപകത്തിനുള്ളിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ τέκνα
  choice: മക്കൾ
  rationale: ലിംഗമോ പ്രായമോ അനാവശ്യമായി നിർണ്ണയിക്കാതെ കുടുംബരൂപകം നിലനിർത്തുന്നു.
- source_word: καλόν ἐστιν
  choice: നല്ലതല്ല
  rationale: καλόν എന്നതിന്റെ നേരിട്ടുള്ള മൂല്യനിർണ്ണയഭാവം കാത്തുസൂക്ഷിക്കുന്നു; ‘ഉചിതമല്ല’ എന്നും അർഥമാകാമെങ്കിലും അതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἄρτον
  choice: അപ്പം
  rationale: പൊതുവായ ‘ഭക്ഷണം’ എന്നു പരത്താതെ മൂലത്തിലെ ദൃശ്യമായ ഗൃഹഭക്ഷണരൂപകം നിലനിർത്തുന്നു.
- source_word: κυναρίοις
  choice: നായ്ക്കുട്ടികൾക്ക്
  rationale: ഗ്രീക്കിലെ ലഘുതാസൂചക രൂപം പ്രതിഫലിപ്പിക്കുന്നു; വീട്ടിനുള്ളിലോ വീട്ടിനോടു ചേർന്നോ ഉള്ള ചെറിയ നായകളുടെ ദൃശ്യം സൂചിപ്പിക്കാമെങ്കിലും അതിനെ മുഖ്യവാചകത്തിൽ നിർബന്ധിതമാക്കുന്നില്ല.
- source_word: βαλεῖν
  choice: എറിഞ്ഞുകൊടുക്കുന്നത്
  rationale: ‘എറിയുക’ എന്ന സജീവ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ലക്ഷ്യസ്വീകർത്താവിനോടുള്ള ബന്ധം സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: ‘മക്കൾ’, ‘നായ്ക്കുട്ടികൾ’ എന്നീ രൂപകങ്ങളുടെ സൂചിതർ
  choice: രൂപകങ്ങൾ വിശദീകരിക്കാതെ മുഖ്യവാചകത്തിൽ അതേപടി നിലനിർത്തി.
  alternative: ‘മക്കൾ’ എന്നത് യിസ്രായേല്യർ/യെഹൂദർ എന്നും ‘നായ്ക്കുട്ടികൾ’ എന്നത് ജനതകൾ എന്നും വിവർത്തനത്തിൽ തുറന്നുപറയുക.
  rationale: ഗ്രീക്ക് വാചകം സൂചിതരെ നേരിട്ട് പേരിടുന്നില്ല. വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നത് രൂപകത്തിന്റെ പ്രഭാവവും സന്ദർഭത്തിലെ വ്യാഖ്യാനാവകാശവും കുറയ്ക്കും.
- issue: πρῶτον എന്നതിലെ ക്രമപരമായ ദൈവശാസ്ത്രസമ്മർദം
  choice: ‘ആദ്യം’ എന്നു വ്യക്തമായി നിലനിർത്തി.
  alternative: വാചകം സുഗമമാക്കാൻ ക്രമസൂചന ഒഴിവാക്കുക.
  rationale: ഇവിടെ മക്കൾക്കുള്ള മുൻഗണനയാണ് പറയുന്നത്; മറ്റുള്ളവരുടെ സ്ഥിരമായ ഒഴിവാക്കൽ നിർബന്ധമായി പറയുന്നില്ല. ഈ തുറന്ന സമ്മർദം വിവർത്തനം പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. കുടുംബവും ഭക്ഷണവും സംബന്ധിച്ച മൂലരൂപകം കാത്തുസൂക്ഷിച്ചു; ദൈവശാസ്ത്രപരമായ സൂചിതരെ വിവർത്തനത്തിനുള്ളിൽ വിശദീകരിച്ചിട്ടില്ല.
