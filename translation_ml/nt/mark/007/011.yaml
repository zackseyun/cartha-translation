id: MRK.7.11
reference: Mark 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: ml
  text: 'എന്നാൽ നിങ്ങൾ പറയുന്നത്: ‘ഒരാൾ തന്റെ അപ്പനോടോ അമ്മയോടോ, “കൊർബാൻ”—അതായത്, ഒരു സമ്മാനം[a]—“എന്നിൽനിന്ന് നിനക്കു ലഭിക്കുമായിരുന്നതെന്തോ അത്” എന്നു പറഞ്ഞാൽ,’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊർബാൻ’ എന്നത് ദൈവത്തിനു സമ്മാനമായി സമർപ്പിച്ച ഒരു വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പദമാണ്. ‘സമ്മാനം’ എന്നതിന് ‘വഴിപാട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: എന്നാൽ നിങ്ങൾ പറയുന്നത്
  rationale: δὲ മുമ്പുള്ള ദൈവകല്പനയുമായുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; λέγετε-യുടെ വർത്തമാനകാല പൊതുപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ഇങ്ങനെ നൽകി.
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ ... എന്നു പറഞ്ഞാൽ
  rationale: ἐὰν + aorist subjunctive ഒരു സാദ്ധ്യതാപരമായ നിബന്ധനയാണ്; ἄνθρωπος-ന്റെ ഏകവചനവും പ്രതിനിധാനപരമായ പുരുഷരൂപവും നിലനിർത്തി.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: തന്റെ അപ്പനോടോ അമ്മയോടോ
  rationale: ദത്തിവ് അഭിസംബോധിതരെ സൂചിപ്പിക്കുന്നു; കുടുംബബന്ധങ്ങളുടെ വ്യക്തതയും ഗ്രീക്കിലെ സമാന്തരഘടനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Κορβᾶν
  choice: കൊർബാൻ
  rationale: ഗ്രീക്ക് പാഠം തന്നെ സംരക്ഷിക്കുന്ന സെമിറ്റിക് മതപരമായ പദം ലിപ്യന്തരിച്ചു; അർത്ഥം തുടർന്നുള്ള വിശദീകരണത്തിലും അടിക്കുറിപ്പിലും നൽകി.
- source_word: ὅ ἐστιν Δῶρον
  choice: അതായത്, ദൈവത്തിനുള്ള ഒരു സമ്മാനം
  rationale: δῶρον അടിസ്ഥാനമായി ‘സമ്മാനം’ എന്നാണ്; കൊർബാൻ എന്ന പശ്ചാത്തലം ലക്ഷ്യഭാഷാവായനക്കാരന് വ്യക്തമാക്കാൻ ‘ദൈവത്തിനുള്ള’ എന്നു നൽകിയിരിക്കുന്നു, എന്നാൽ സമർപ്പണത്തിന്റെ കൃത്യമായ നിയമയന്ത്രണം അധികമായി നിർവചിച്ചിട്ടില്ല.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: എന്നിൽനിന്ന് നിങ്ങൾക്കു ലഭിക്കുമായിരുന്ന സഹായം
  rationale: ὃ ἐὰν അനിശ്ചിതമായ ‘എന്തുതന്നെയായാലും’ എന്ന ആശയം നൽകുന്നു; ὠφεληθῇς മാതാപിതാവിന് ലഭിക്കേണ്ടിയിരുന്ന പ്രയോജനത്തെയോ സഹായത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ നാമപദഘടന ഉപയോഗിച്ചു.
theological_decisions:
- issue: Κορβᾶν എന്ന നേർച്ചാപദത്തിന്റെ വിവർത്തനം
  choice: പ്രധാനപാഠത്തിൽ ‘കൊർബാൻ’ നിലനിർത്തി, ‘ദൈവത്തിനുള്ള ഒരു സമ്മാനം’ എന്ന് വിശദീകരിച്ചു.
  alternative: ‘ദൈവത്തിനു സമർപ്പിച്ച വഴിപാട്’ എന്ന് നേരിട്ട് വിവർത്തനം ചെയ്യുക.
  rationale: മൂലഗ്രീക്ക് സെമിറ്റിക് പദം സംരക്ഷിച്ചശേഷം അതിനെ വിശദീകരിക്കുന്നു. അതേ രൂപം പിന്തുടരുന്നത് ചരിത്ര-മതപരമായ പ്രത്യേകത നിലനിർത്തുകയും നേർച്ചയുടെ പ്രവർത്തനരീതിയെക്കുറിച്ച് പാഠത്തിൽ ഇല്ലാത്ത സിദ്ധാന്തപരമായ വിശദാംശങ്ങൾ ചേർക്കാതിരിക്കയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യം 12-ാം വാക്യത്തിൽ വ്യാകരണപരമായി പൂർത്തിയാകുന്നതിനാൽ അവസാനത്തിൽ അപൂർണത സൂചിപ്പിക്കുന്ന ഘടന നിലനിർത്തി; ‘അപ്പൻ/അമ്മ’ സാധാരണവും ഗൗരവമുള്ളതുമായ കുടുംബബന്ധപദങ്ങളായി തെരഞ്ഞെടുത്തു.
