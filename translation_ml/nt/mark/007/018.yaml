id: MRK.7.18
reference: Mark 7:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങളും ഇങ്ങനെ വിവേകമില്ലാത്തവരാണോ? പുറത്തുനിന്ന് മനുഷ്യന്റെ ഉള്ളിലേക്കു കടക്കുന്നതൊന്നും അവനെ അശുദ്ധനാക്കാൻ[a] കഴിയില്ലെന്ന് നിങ്ങൾ ഗ്രഹിക്കുന്നില്ലേ,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മലിനനാക്കാൻ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ആചാരപരമായ അശുദ്ധിയുടെ അർഥനിറവുമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്ക് ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലം മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല ആഖ്യാനമായി നൽകി.
- source_word: Οὕτως καὶ ὑμεῖς
  choice: നിങ്ങളും ഇങ്ങനെ
  rationale: οὕτως, καί, ὑμεῖς എന്നിവയുടെ ഊന്നലും ശിഷ്യന്മാരോടുള്ള ആശ്ചര്യഭരിതമായ ശാസനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀσύνετοί
  choice: വിവേകമില്ലാത്തവർ
  rationale: തിരിച്ചറിവിന്റെയും ഗ്രഹണശേഷിയുടെയും അഭാവം സൂചിപ്പിക്കുകയും തുടർന്നുള്ള νοεῖτε എന്ന ആശയവുമായി ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: νοεῖτε
  choice: ഗ്രഹിക്കുന്നില്ലേ
  rationale: വെറും അറിവിനേക്കാൾ അർഥം മനസ്സിലാക്കുക എന്ന സന്ദർഭോചിതമായ ബൗദ്ധിക അർഥം നൽകുന്നു.
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: പുറത്തുനിന്ന് ... കടക്കുന്നതൊന്നും
  rationale: ഗ്രീക്കിലെ പൊതുവായ substantival participle-നെ സ്വാഭാവിക മലയാള നിഷേധവാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εἰς τὸν ἄνθρωπον
  choice: മനുഷ്യന്റെ ഉള്ളിലേക്ക്
  rationale: εἰς എന്ന അകത്തേക്കുള്ള ദിശ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ἄνθρωπος ഇവിടെ മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: κοινῶσαι
  choice: അശുദ്ധനാക്കാൻ
  rationale: ഈ സന്ദർഭത്തിലെ ആചാരപരമായ ശുദ്ധി-അശുദ്ധി ആശയം നേരിട്ട് സൂചിപ്പിക്കുന്നു; കേവലം ധാർമ്മിക മലിനീകരണമെന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: κοινόω എന്ന ശുദ്ധി-അശുദ്ധി പദപ്രയോഗം
  choice: അശുദ്ധനാക്കാൻ
  alternative: മലിനനാക്കാൻ
  rationale: വിവാദത്തിന്റെ പശ്ചാത്തലം ആചാരപരമായ ശുദ്ധിയുമായി ബന്ധപ്പെട്ടതിനാൽ ‘അശുദ്ധനാക്കുക’ ആ ആശയം കൂടുതൽ വ്യക്തമായി നൽകുന്നു; ‘മലിനനാക്കുക’ എന്ന വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. ശാസനയുടെ ഊന്നൽ ചോദ്യംരൂപത്തിൽ നിലനിർത്തി; വാക്യം അടുത്ത വാക്യത്തിലേക്ക് ആശയപരമായി തുടരുന്നുവെങ്കിലും മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ചോദ്യം സമ്പൂർണമായി അവതരിപ്പിച്ചു.
