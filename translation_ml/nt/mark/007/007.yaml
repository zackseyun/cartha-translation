id: MRK.7.7
reference: Mark 7:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: ml
  text: എന്നാൽ അവർ മനുഷ്യരുടെ കല്പനകളെ ഉപദേശങ്ങളായി പഠിപ്പിച്ചുകൊണ്ട് എന്നെ വ്യർഥമായി ആരാധിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മനുഷ്യരുടെ കല്പനകളായ ഉപദേശങ്ങൾ പഠിപ്പിച്ചുകൊണ്ട്.’
    reason: ഗ്രീക്കിൽ ‘ഉപദേശങ്ങൾ’ എന്നും ‘മനുഷ്യരുടെ കല്പനകൾ’ എന്നും തമ്മിലുള്ള ബന്ധം സംക്ഷിപ്തമാണ്; ഈ വായന ആ ഘടനയോട് കൂടുതൽ അടുത്ത ഒരു സാധ്യത നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: μάτην
  choice: വ്യർഥമായി
  rationale: ‘ഫലമില്ലാതെ’, ‘നിഷ്ഫലമായി’ എന്ന ആശയം നൽകുന്ന ക്രിയാവിശേഷണം. പ്രവാചകവചനത്തിലെ ശക്തമായ വിമർശനം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ അധരബഹുമാനവും ഹൃദയത്തിന്റെ അകൽച്ചയും തമ്മിലുള്ള വൈരുധ്യം ഇവിടെ തുടരുന്നതിനാൽ പ്രതിവിരുദ്ധബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: σέβονταί με
  choice: അവർ എന്നെ ... ആരാധിക്കുന്നു
  rationale: ദൈവത്തോടുള്ള ഭക്തിയെയും ആരാധനയെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘ആരാധിക്കുന്നു’ ഏറ്റവും വ്യക്തമായ മലയാളപ്രയോഗമാണ്; με എന്ന നേരിട്ടുള്ള കർമം ‘എന്നെ’ എന്നു നിലനിർത്തി.
- source_word: διδάσκοντες
  choice: അവർ ... പഠിപ്പിക്കുന്നത്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല കൃദന്തരൂപം അവരുടെ വ്യർഥമായ ആരാധനയുടെ സ്വഭാവം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ഉപവാക്യരൂപത്തിൽ അവതരിപ്പിച്ചു.
- source_word: διδασκαλίας
  choice: ഉപദേശങ്ങളായി
  rationale: മനുഷ്യരുടെ കല്പനകൾ അധികാരമുള്ള മതോപദേശങ്ങളുടെ നിലയിൽ പഠിപ്പിക്കപ്പെടുന്നു എന്ന ബന്ധം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ സംക്ഷിപ്തഘടനയെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἐντάλματα ἀνθρώπων
  choice: മനുഷ്യരുടെ കല്പനകൾ
  rationale: കല്പനകളുടെ ഉറവിടം മനുഷ്യരാണ് എന്ന ജനിറ്റീവ് ബന്ധം നിലനിർത്തുന്നു. ഇവിടെ ἀνθρώπων മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിരപേക്ഷമായ ‘മനുഷ്യർ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ദൈവാരാധനയും മനുഷ്യാധികാരത്തിൽനിന്നുള്ള കല്പനകളും തമ്മിലുള്ള വൈരുധ്യം
  choice: അവർ ഉപദേശങ്ങളായി പഠിപ്പിക്കുന്നത് മനുഷ്യരുടെ കല്പനകളാണ്
  alternative: മനുഷ്യരുടെ കല്പനകളാകുന്ന ഉപദേശങ്ങൾ പഠിപ്പിച്ചുകൊണ്ട്
  rationale: ഗ്രീക്ക് വാക്യഘടന മനുഷ്യരുടെ കല്പനകൾ ഉപദേശങ്ങളായി അവതരിപ്പിക്കപ്പെടുന്നു എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു. മുഖ്യപരിഭാഷ ഈ ബന്ധം വ്യക്തമായ മലയാളത്തിൽ അറിയിക്കുമ്പോൾ, അടിക്കുറിപ്പ് ഘടനയിലെ യഥാർഥ സാന്ദ്രതയും മറ്റൊരു സാധ്യബന്ധവും സംരക്ഷിക്കുന്നു; മനുഷ്യകല്പനകൾക്ക് ദൈവിക ഉപദേശത്തിന്റെ അധികാരം നൽകുമ്പോൾ ആരാധന വ്യർഥമാകുന്നു എന്ന വിമർശനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വ്യർഥമായി’, ‘ആരാധിക്കുന്നു’, ‘കല്പനകൾ’ എന്നിവ പ്രവാചകവചനത്തിന്റെ ഔപചാരിക ശക്തി നിലനിർത്തുന്നു; വാക്യത്തിന്റെ രണ്ടാം ഭാഗം സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഉപവാക്യമായി ക്രമപ്പെടുത്തി.
