revisions:
- from: എന്നാൽ അവർ എന്നെ വ്യർഥമായി ആരാധിക്കുന്നു; അവർ ഉപദേശങ്ങളായി പഠിപ്പിക്കുന്നത് മനുഷ്യരുടെ കല്പനകളാണ്.[a]
  to: എന്നാൽ അവർ മനുഷ്യരുടെ കല്പനകളെ ഉപദേശങ്ങളായി പഠിപ്പിച്ചുകൊണ്ട് എന്നെ വ്യർഥമായി ആരാധിക്കുന്നു.[a]
