id: MRK.7.15
reference: Mark 7:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: ml
  text: മനുഷ്യന്റെ പുറത്തുനിന്ന് അവന്റെ ഉള്ളിലേക്കു കടക്കുന്നതൊന്നും അവനെ അശുദ്ധനാക്കാൻ[a] കഴിയില്ല; മറിച്ച്, മനുഷ്യനിൽനിന്ന് പുറത്തുവരുന്നവയാണ് മനുഷ്യനെ അശുദ്ധനാക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മലിനനാക്കാൻ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ശുദ്ധി-അശുദ്ധി എന്ന അർഥത്തിലും വിശാലമായ നൈതിക അർഥത്തിലും പ്രയോഗമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: ഒന്നിനും ... കഴിയില്ല
  rationale: നപുംസക ഏകവചനമായ οὐδέν ഇവിടെ സമ്പൂർണ നിഷേധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ നിഷേധഘടനയായി അവതരിപ്പിച്ചു.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: ഒരു മനുഷ്യന്റെ പുറത്തുനിന്ന്
  rationale: ബാഹ്യ ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന ἔξωθεν എന്ന ആശയം നിലനിർത്തുകയും, തുടർന്നുള്ള ἐκ τοῦ ἀνθρώπου എന്ന ആന്തരിക-ബാഹ്യ വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: അവന്റെ ഉള്ളിലേക്കു കടക്കുന്നത്
  rationale: ദിശയും പ്രവേശനവും വ്യക്തമാക്കുന്ന പങ്കാളിക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിച്ചു.
- source_word: κοινῶσαι / κοινοῦντα
  choice: അശുദ്ധനാക്കാൻ / അശുദ്ധനാക്കുന്നത്
  rationale: ശുദ്ധി-അശുദ്ധി സന്ദർഭത്തിലെ പ്രധാന അർഥം നേരിട്ട് നൽകുന്നു; ഇതിന് ആചാരപരവും ധാർമികവുമായ പ്രതിധ്വനി നിലനിൽക്കുന്നു.
- source_word: ἀλλὰ
  choice: മറിച്ച്
  rationale: ലളിതമായ വിരോധത്തേക്കാൾ ശക്തമായ തിരുത്തൽസ്വഭാവമുള്ള വൈരുധ്യം പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: മനുഷ്യനിൽനിന്നു പുറത്തുവരുന്നവ
  rationale: നപുംസക ബഹുവചന ഘടനയെ ‘വരുന്നവ’ എന്നു നിലനിർത്തി; പുറത്തുനിന്ന് അകത്തേക്കും മനുഷ്യനിൽനിന്ന് പുറത്തേക്കുമുള്ള ഉദ്ദേശ്യപൂർവമായ വൈരുധ്യം സംരക്ഷിച്ചു.
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: ഒരു മനുഷ്യന്റെ / മനുഷ്യനെ
  rationale: ἄνθρωπος ഇവിടെ പൊതുവായി ഏതു മനുഷ്യനെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യൻ’ ഈ പ്രതിനിധാനപരമായ ഏകവചനത്തെ സ്വാഭാവികമായി കൈമാറുന്നു.
theological_decisions:
- issue: ശുദ്ധി-വിവാദത്തിന്റെ പശ്ചാത്തലത്തിൽ κοινόω എന്ന പദത്തിന്റെ അർഥം
  choice: അശുദ്ധനാക്കുക
  alternative: മലിനനാക്കുക
  rationale: ‘അശുദ്ധനാക്കുക’ ശുദ്ധി-അശുദ്ധി വിഭാഗങ്ങളെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; അതേസമയം തുടർന്നുള്ള നൈതിക സന്ദർഭത്തിലേക്കുള്ള അർഥവ്യാപ്തിയെ അനാവശ്യമായി തടയുന്നില്ല.
- issue: ἄνθρωπος എന്ന ഏകവചനത്തിന്റെ പൊതുവായ പ്രയോഗം
  choice: മനുഷ്യൻ
  alternative: വ്യക്തി
  rationale: ലിംഗപരമായി പരിമിതപ്പെടുത്താതെ മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുകയും ഗ്രീക്കിലെ ഏകവചനവും വാക്യത്തിലെ ആവർത്തനവും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ പുറത്തുനിന്ന് അകത്തേക്കുള്ളതും മനുഷ്യനിൽനിന്ന് പുറത്തേക്കുള്ളതുമായ സമാന്തര വൈരുധ്യം വ്യക്തമായി നിലനിർത്തി; ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം വാക്യത്തിലേക്ക് ചേർത്തിട്ടില്ല.
