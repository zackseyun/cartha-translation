id: MRK.7.1
reference: Mark 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: ml
  text: യെരൂശലേമിൽനിന്നു വന്ന പരീശന്മാരും ശാസ്ത്രിമാരിൽ ചിലരും അവന്റെ അടുക്കൽ വന്നുകൂടുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: -ഉം … -ഉം
  rationale: മലയാളത്തിലെ സംയുക്ത കർത്തൃഘടനയിൽ ‘പരീശന്മാരും … ചിലരും’ എന്ന രൂപം ഗ്രീക്കിലെ ബന്ധകഭാവം സ്വാഭാവികമായി വഹിക്കുന്നു; അനാവശ്യമായ കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: συνάγονται πρὸς αὐτὸν
  choice: അവന്റെ അടുക്കൽ വന്നുകൂടുന്നു
  rationale: ‘വന്നുകൂടുന്നു’ എന്ന പ്രയോഗം യേശുവിന്റെ അടുക്കലേക്കുള്ള ചലനവും അവിടെ ഒരുമിച്ചുകൂടുന്നതും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു. വർത്തമാനകാലരൂപം മർക്കോസിന്റെ ആഖ്യാനവർത്തമാനം നിലനിർത്തുന്നു.
- source_word: οἱ Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: സുവിശേഷസാഹിത്യത്തിൽ സ്ഥിരമായി ഉപയോഗിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: τινες τῶν γραμματέων
  choice: ശാസ്ത്രിമാരിൽ ചിലർ
  rationale: ഭാഗസൂചകമായ ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി കൃത്യമായി നിലനിർത്തുന്നു; എല്ലാവരെയുമല്ല, ആ കൂട്ടത്തിൽ ചിലരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐλθόντες
  choice: വന്ന
  rationale: മുഖ്യക്രിയയ്ക്കു മുമ്പുണ്ടായ വരവ് മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണക്രിയാരൂപത്തിൽ വ്യക്തമാക്കുന്നു; ഈ രൂപം പരീശന്മാരെയും ശാസ്ത്രിമാരിൽ ചിലരെയും ചേർത്ത് വിശേഷിപ്പിക്കുന്നു.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: യെരൂശലേമിൽനിന്നു
  rationale: ഉത്ഭവസ്ഥലം നേരിട്ട് പ്രകടിപ്പിക്കുന്ന സാധാരണ മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവന്റെ അടുക്കൽ വന്നുകൂടുന്നു’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കുമ്പോഴും ഗ്രീക്കിലെ ചലനവും കൂടിച്ചേരലും സംരക്ഷിക്കുന്നു.
