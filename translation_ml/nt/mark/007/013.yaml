source:
  edition: SBLGNT
  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: ml
  text: അങ്ങനെ, നിങ്ങൾ കൈമാറിയ പാരമ്പര്യത്താൽ ദൈവത്തിന്റെ വചനത്തെ അസാധുവാക്കുന്നു.[a][b] ഇതുപോലെയുള്ള മറ്റു പല കാര്യങ്ങളും നിങ്ങൾ ചെയ്യുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവത്തിന്റെ വചനത്തെ പ്രാബല്യമില്ലാത്തതാക്കുന്നു’ അല്ലെങ്കിൽ ‘ഫലശൂന്യമാക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങൾ പകർന്നുനൽകിയ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘ഇതുപോലെയുള്ള പല കാര്യങ്ങളും’.'
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: അസാധുവാക്കുന്നു
  rationale: ദൈവവചനത്തിന്റെ അധികാരത്തെയും പ്രാബല്യത്തെയും ഫലശൂന്യമാക്കുന്ന പ്രവൃത്തിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽ മുൻവാക്യത്തിലെ കുറ്റാരോപണം തുടരുന്നതിനാൽ ‘അങ്ങനെ’ ചേർത്ത് സ്വാഭാവികമായ സമാപകക്രിയയായി നൽകി.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: λόγος എന്നതിന് ഇവിടെ ‘വചനം’ എന്ന നേരിട്ടുള്ള അർഥം യോജിക്കുന്നു; ദൈവകല്പനയും മനുഷ്യപാരമ്പര്യവും തമ്മിലുള്ള വൈരുധ്യവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: τῇ παραδόσει ὑμῶν
  choice: നിങ്ങളുടെ പാരമ്പര്യത്താൽ
  rationale: 'ദത്തിവ് ഇവിടെ ഉപകരണാർഥകമാണ്: ദൈവവചനത്തെ അസാധുവാക്കാനുള്ള മാർഗമായി അവരുടെ പാരമ്പര്യം പ്രവർത്തിക്കുന്നു. ‘പാരമ്പര്യത്താൽ’ അത് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.'
- source_word: ᾗ παρεδώκατε
  choice: നിങ്ങൾ കൈമാറിയ
  rationale: പാരമ്പര്യം അവർ കൈമാറിയതാണെന്ന ബന്ധവാക്യത്തിന്റെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; παράδοσις–παραδίδωμι പദബന്ധവും മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: ഇതുപോലെയുള്ള മറ്റു പല കാര്യങ്ങളും
  rationale: ഗ്രീക്കിലെ ഭാഗികമായി ആവർത്തനസ്വഭാവമുള്ള ഊന്നൽ അസ്വാഭാവികമായ പദാവർത്തനം കൂടാതെ ‘ഇതുപോലെയുള്ള മറ്റു പല’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: ποιεῖτε
  choice: നിങ്ങൾ ചെയ്യുന്നു
  rationale: വർത്തമാനകാല ക്രിയ പതിവായോ തുടർന്നുകൊണ്ടിരിക്കുന്നതായോ ഉള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ലളിതവർത്തമാനം അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ കുറ്റാരോപണത്തിലെ ‘പാരമ്പര്യത്തിന്റെ’ സ്വഭാവം
  choice: മൂലപാഠത്തിലെ ‘നിങ്ങളുടെ പാരമ്പര്യം’ എന്ന നിഷ്പക്ഷ നാമപ്രയോഗം നിലനിർത്തി.
  alternative: ‘മനുഷ്യരുടെ പാരമ്പര്യം’ എന്ന് കൂടുതൽ വിശദമായി നൽകുക.
  rationale: ഈ വാക്യത്തിൽ ‘മനുഷ്യരുടെ’ എന്ന വിശേഷണം ഇല്ല. ഈ പ്രത്യേക പാരമ്പര്യം ദൈവവചനത്തിന് വിരുദ്ധമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ, മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വചനം’, ‘പാരമ്പര്യം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
