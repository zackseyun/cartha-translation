  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: ml
  text: 'അവർ അളവറ്റവിധം വിസ്മയിച്ചുകൊണ്ട് പറഞ്ഞു: “അവൻ എല്ലാം നന്നായി ചെയ്തിരിക്കുന്നു.[a] ബധിരർ കേൾക്കാനും സംസാരിക്കാൻ കഴിയാത്തവർ സംസാരിക്കാനും അവൻ ഇടയാക്കുന്നു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, കൂടുതൽ ഔപചാരികമായി, “അവൻ സകലവും നന്നായി ചെയ്തിരിക്കുന്നു.” ഈ വാക്കുകൾ ദൈവത്തിന്റെ പ്രവൃത്തികളെക്കുറിച്ചുള്ള തിരുവെഴുത്തുഭാഷയെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: ദൈവത്തിന്റെ പുനഃസ്ഥാപനത്തിൽ ബധിരർ കേൾക്കുകയും സംസാരിക്കാൻ കഴിയാത്തവരുടെ നാവ് ആനന്ദഗാനം പാടുകയും ചെയ്യുമെന്ന് പറയുന്ന യെശയ്യാവ് 35:5–6-നെ ഈ വാക്കുകൾ ഓർമിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: അളവറ്റവിധം
  rationale: അസാധാരണമായ തീവ്രത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐξεπλήσσοντο
  choice: വിസ്മയിച്ച്
  rationale: ജനക്കൂട്ടത്തിന്റെ ശക്തവും തുടരുന്നതുമായ അമ്പരപ്പ് സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Καλῶς πάντα πεποίηκεν
  choice: അവൻ എല്ലാം നന്നായി ചെയ്തിരിക്കുന്നു
  rationale: പൂർണമായ പ്രവൃത്തിയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് perfect-ന്റെ ഭാവം നിലനിർത്തുന്നു; 'എല്ലാം നന്നായി' എന്ന സമഗ്രമായ വിലയിരുത്തലും സംരക്ഷിക്കുന്നു.
- source_word: κωφοὺς
  choice: ബധിരരെ
  rationale: ഈ സൗഖ്യദാനസന്ദർഭത്തിൽ കേൾക്കാൻ കഴിയാത്തവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: ποιεῖ ἀκούειν
  choice: കേൾക്കാൻ ... ഇടയാക്കുന്നു
  rationale: ποιέω + infinitive എന്ന കാരകഘടനയെ അർത്ഥവ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀλάλους
  choice: സംസാരിക്കാൻ കഴിയാത്തവരെ
  rationale: സംസാരശേഷിയില്ലായ്മ വ്യക്തമായി അറിയിക്കുകയും ഇന്നത്തെ മാന്യമായ സാധാരണ ഭാഷാശൈലി പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: λαλεῖν
  choice: സംസാരിക്കാൻ
  rationale: സന്ദർഭത്തിലെ സാധാരണ അർത്ഥമായ 'സംസാരിക്കുക' നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: യെശയ്യാവ് 35:5–6-ലേക്കുള്ള സാധ്യതയുള്ള സൂചനയും 'എല്ലാം നന്നായി' എന്ന സൃഷ്ടിവിവരണസദൃശമായ പ്രതിധ്വനിയും
  choice: മുഖ്യവാചകത്തിൽ ഗ്രീക്കിനോട് ചേർന്ന ലളിതമായ പ്രസ്താവന നിലനിർത്തി, തിരുവെഴുത്തുപരമായ പ്രതിധ്വനികൾ അടിക്കുറിപ്പുകളിൽ സൂചിപ്പിച്ചു.
  alternative: സൂചനകളെ മുഖ്യവാചകത്തിൽ കൂടുതൽ പ്രകടമാക്കുന്ന വ്യാഖ്യാനപരമായ വിവർത്തനം നൽകുക.
  rationale: വാക്യം യേശുവിന്റെ പ്രവൃത്തികളെക്കുറിച്ചുള്ള ജനക്കൂട്ടത്തിന്റെ സാക്ഷ്യമായി തന്നെ നിൽക്കണം; സാധ്യതയുള്ള തിരുവെഴുത്തുസൂചനകൾ വിവർത്തനം അതിരുകടന്ന് ഉറപ്പിക്കരുത്.
translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ശക്തമായ വിസ്മയം, സമഗ്രമായ വിലയിരുത്തൽ, സൗഖ്യദാനത്തിന്റെ കാരകസ്വഭാവം എന്നിവ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലുണ്ടായിരുന്ന അടിക്കുറിപ്പ്-മാർക്കർ പൊരുത്തക്കേട് തിരുത്തി: ''എല്ലാം നന്നായി'' എന്നതിനു ശേഷം [a], യെശയ്യാവുസൂചനയുള്ള മുഴുവൻ സൗഖ്യപ്രസ്താവനയ്ക്കു ശേഷം [b] ചേർത്തു.'
