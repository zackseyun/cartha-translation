id: MRK.7.29
reference: Mark 7:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: ml
  text: 'അവൻ അവളോടു പറഞ്ഞു: “നീ ഈ വാക്ക് പറഞ്ഞതുകൊണ്ട് പൊയ്ക്കൊള്ളുക; ഭൂതം നിന്റെ മകളിൽനിന്ന് പുറത്തുപോയിരിക്കുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ വാക്ക് നിമിത്തം പൊയ്ക്കൊള്ളുക; ഭൂതം നിന്റെ മകളിൽനിന്ന് പുറത്തുപോയിരിക്കുന്നു.”
    reason: Διὰ τοῦτον τὸν λόγον എന്നതിന്റെ കൂടുതൽ പദാനുപദമായ കാരണാർഥപരിഭാഷ.
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: അവൻ അവളോടു പറഞ്ഞു
  rationale: καί എന്ന ആഖ്യാനബന്ധകത്തെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം ‘പിന്നെ’ എന്നു വ്യാഖ്യാനിക്കാതെ അവതരിപ്പിക്കുന്നു; ദാതിവ് αὐτῇ ‘അവളോടു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: നീ ഈ വാക്ക് പറഞ്ഞതുകൊണ്ട്
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണാർഥം ‘കൊണ്ട്’ എന്നതിലൂടെ നിലനിർത്തുന്നു. λόγος സ്ത്രീയുടെ തൊട്ടുമുമ്പത്തെ മറുപടിയെ സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘നീ ... പറഞ്ഞ’ എന്ന് സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്ന ഘടകം ചേർത്തു; ‘ഈ വാക്ക് നിമിത്തം’ എന്ന കൂടുതൽ രൂപപരമായ പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ὕπαγε
  choice: പൊയ്ക്കൊള്ളുക
  rationale: ഇവിടെ ὑπάγωയുടെ വർത്തമാന ആജ്ഞാരൂപം വിടവാങ്ങാൻ അനുവദിക്കുന്ന നിർദേശം ആകുന്നു. ‘പൊയ്ക്കൊള്ളുക’ ആ ഭാവം മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐξελήλυθεν
  choice: പുറത്തുപോയിരിക്കുന്നു
  rationale: പരിപൂർണകാലം പൂർത്തിയായ പ്രവൃത്തിയെയും തുടരുന്ന ഫലത്തെയും സൂചിപ്പിക്കുന്നു. ‘പുറത്തുപോയിരിക്കുന്നു’ ഭൂതോച്ചാടനസന്ദർഭത്തിലെ പുറത്തേക്കുള്ള ഗതിചിത്രവും ഇപ്പോഴത്തെ ഫലാവസ്ഥയും സംരക്ഷിക്കുന്നു.
- source_word: ἐκ τῆς θυγατρός σου
  choice: നിന്റെ മകളിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം/പുറത്തേക്കുള്ള നീക്കം ‘മകളിൽനിന്ന്’ എന്നതിലൂടെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τὸ δαιμόνιον
  choice: ഭൂതം
  rationale: δαιμόνιον വ്യക്തിപരമായ ദുഷ്ടാത്മസത്തയെ സൂചിപ്പിക്കുന്നു. ആധുനിക സാധാരണ മലയാളത്തിൽ ‘ഭൂതം’ നേരിട്ടും ഗ്രഹിക്കാവുന്നതുമായ സമാനപദമാണ്; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘അശുദ്ധാത്മാവ്’ എന്ന സമീപപദപ്രയോഗം ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: ഭൂതോച്ചാടനഭാഷയിലെ അതീന്ദ്രിയ അവകാശവാദം മയപ്പെടുത്താതെ അവതരിപ്പിക്കൽ
  choice: ഭൂതം നിന്റെ മകളിൽനിന്ന് പുറത്തുപോയിരിക്കുന്നു
  alternative: ദുഷ്ടാത്മാവ് നിന്റെ മകളെ വിട്ടുപോയിരിക്കുന്നു
  rationale: മൂലപാഠം δαιμόνιον എന്നു വ്യക്തമായി പേരിടുകയും അത് മകളിൽനിന്ന് പുറത്തുപോയതായി പറയുകയും ചെയ്യുന്നു. അതിനെ രോഗമോ രൂപകാത്മക ദുഷ്പ്രഭാവമോ ആയി ചുരുക്കാതെ വ്യക്തിപരമായ ഭൂതസൂചനയും പുറത്തേക്കുള്ള ചലനചിത്രവും പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ആഖ്യാനശൈലി. ‘നീ ഈ വാക്ക് പറഞ്ഞതുകൊണ്ട്’ സാധാരണ വായനക്കാർക്ക് സന്ദർഭബന്ധം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് ഗ്രീക്കിന്റെ ചുരുക്കവും യഥാരൂപവുമായ ഘടന സംരക്ഷിക്കുന്നു.
