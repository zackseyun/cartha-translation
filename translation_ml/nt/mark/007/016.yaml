  text: If anyone has ears to hear, let him hear.
translation:
  language: ml
  text: കേൾക്കാൻ ചെവിയുള്ളവൻ കേൾക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം ഏറ്റവും പുരാതനമായ ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിലും (നാലാം നൂറ്റാണ്ടിലെ സീനായിറ്റിക്കസ്, വത്തിക്കാനസ് എന്നിവ ഉൾപ്പെടെ) ആദ്യകാല കോപ്റ്റിക് പരിഭാഷകളിലും കാണുന്നില്ല. എന്നാൽ ബൈസന്റൈൻ ഭൂരിപക്ഷ പാരമ്പര്യത്തിലും ലത്തീൻ പാരമ്പര്യത്തിലും മിക്ക സുറിയാനി സാക്ഷ്യങ്ങളിലും ഇത് കാണുന്നു. മർക്കോസ് 4:9, 4:23 എന്നിവിടങ്ങളിലെ അതേ വാക്യം അനുകരിച്ച് പിൽക്കാലത്ത് ഒരു പകർപ്പെഴുത്തുകാരൻ ചേർത്തതായിരിക്കാം.
    reason: textual_critical
lexical_decisions:
- source_word: ὦτα
  choice: ചെവി
  rationale: ശാരീരിക അവയവത്തെ സൂചിപ്പിക്കുന്ന പദം ഇവിടെ ഗ്രഹിക്കാനും അനുസരിക്കാനുമുള്ള സന്നദ്ധതയുടെ രൂപകമായി ഉപയോഗിച്ചിരിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചന പ്രയോഗമായ ‘ചെവിയുള്ളവൻ’ തിരഞ്ഞെടുത്തു.
- source_word: ἀκουέτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ ആഹ്വാനാത്മക ശക്തി സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: Εἴ τις
  choice: കേൾക്കാൻ ചെവിയുള്ളവൻ
  rationale: ഗ്രീക്കിലെ ‘ആർക്കെങ്കിലും ... ഉണ്ടെങ്കിൽ’ എന്ന നിബന്ധനാപ്രയോഗം മലയാളത്തിലെ പതിവായ ‘... ഉള്ളവൻ’ എന്ന ആഹ്വാനരൂപത്തിൽ അർഥനിഷ്ഠമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഹ്വാനശൈലി. പരമ്പരാഗത ബൈബിൾ പ്രയോഗത്തിന്റെ പരിചിതത്വം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പഴയ ഭാഷാരൂപങ്ങൾ ഒഴിവാക്കി.
