  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: ml
  text: ഈ ദുഷ്ടകാര്യങ്ങളെല്ലാം ഉള്ളിൽനിന്നു പുറപ്പെടുകയും മനുഷ്യനെ അശുദ്ധനാക്കുകയും ചെയ്യുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒരു വ്യക്തിയെ’; ഗ്രീക്കിൽ ഏകവചനത്തിലുള്ള ‘മനുഷ്യനെ’ എന്ന പദം പൊതുവായി ഏതൊരു മനുഷ്യനെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: ഈ ദുഷ്ടകാര്യങ്ങളെല്ലാം
  rationale: πάντα + ταῦτα എന്ന സമഗ്രവും ഊന്നലുള്ളതുമായ പ്രയോഗം നിലനിർത്തുകയും മുൻവാക്യങ്ങളിൽ പറഞ്ഞ ദോഷങ്ങളെ മൂർത്തമായ ബഹുവചനമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἔσωθεν
  choice: ഉള്ളിൽനിന്നു
  rationale: ബാഹ്യമായ ഉറവിടത്തിനുപകരം മനുഷ്യന്റെ ആന്തരികതയിൽനിന്നുള്ള ഉത്ഭവം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: ἐκπορεύεται
  choice: പുറപ്പെടുകയും
  rationale: ഗ്രീക്കിൽ നപുംസകലിംഗ ബഹുവചന കർത്താവിനോടൊപ്പം ഏകവചന ക്രിയ വന്നിട്ടുണ്ടെങ്കിലും മലയാളത്തിൽ ബഹുവചന ആശയത്തോട് യോജിച്ച രൂപം ഉപയോഗിച്ചു; അകത്തുനിന്നുള്ള ചലനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: κοινοῖ
  choice: അശുദ്ധനാക്കുകയും ചെയ്യുന്നു
  rationale: മർക്കോസിലെ ശുദ്ധി-അശുദ്ധി പശ്ചാത്തലത്തിൽ κοινόω എന്നത് ‘സാധാരണമാക്കുക’ എന്നതിലുപരി മതപരവും ധാർമ്മികവുമായ അശുദ്ധീകരണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: τὸν ἄνθρωπον
  choice: മനുഷ്യനെ
  rationale: ἄνθρωπος ഇവിടെ ഒരു മനുഷ്യനെ പ്രതിനിധിപരമായി സൂചിപ്പിക്കുന്ന പൊതുപ്രയോഗമാണ്. മലയാളത്തിലെ ‘മനുഷ്യനെ’ ഏകവചനവും സർവമനുഷ്യർക്കും ബാധകമായ അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൊതുവായ മനുഷ്യാവസ്ഥയെ സൂചിപ്പിക്കുന്ന τὸν ἄνθρωπον എന്ന പ്രയോഗം
  choice: മനുഷ്യനെ
  alternative: ഒരു വ്യക്തിയെ
  rationale: ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിപരമായ രൂപം സംരക്ഷിക്കുമ്പോഴും പ്രസ്താവന പുരുഷന്മാർക്കു മാത്രം ബാധകമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു. ‘മനുഷ്യനെ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായ പൊതുമാനവ സൂചനയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ശുദ്ധി-അശുദ്ധി പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘അശുദ്ധനാക്കുന്നു’ ഉപയോഗിച്ചു; മൂലത്തിലെ അകത്ത്–പുറത്ത് വൈരുധ്യം സംരക്ഷിച്ചു.
