  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι οὐκ εἰσπορεύεται αὐτοῦ εἰς τὴν καρδίαν ἀλλ’ εἰς τὴν κοιλίαν, καὶ εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; —⸀καθαρίζων πάντα τὰ βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: ml
  text: കാരണം, അത് അവന്റെ ഹൃദയത്തിലേക്കല്ല, വയറ്റിലേക്കാണ് ചെല്ലുന്നത്; പിന്നെ കക്കൂസിലേക്ക് പുറപ്പെടുന്നു.” —ഇങ്ങനെ എല്ലാ ഭക്ഷണങ്ങളെയും ശുദ്ധീകരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, അവസാന വാക്യഭാഗത്തെ മർക്കോസിന്റെ വിശദീകരണക്കുറിപ്പായി കാണാതെ ദഹനപ്രക്രിയയെ സൂചിപ്പിക്കുന്നതായി എടുത്താൽ: “ഇങ്ങനെ എല്ലാ ഭക്ഷണങ്ങളെയും ശുദ്ധീകരിച്ചുകൊണ്ട്” അഥവാ “പുറത്താക്കിക്കൊണ്ട്.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: ഹൃദയം
  rationale: ആന്തരിക മനുഷ്യനും ദഹനവ്യവസ്ഥയും തമ്മിലുള്ള മൂലപാഠത്തിലെ വൈരുധ്യം നിലനിർത്താൻ അക്ഷരാർഥത്തിന് അടുത്തതും മലയാളത്തിൽ സ്വാഭാവികവുമായ പദം.
- source_word: κοιλίαν
  choice: വയറ്
  rationale: ഈ ദഹനസന്ദർഭത്തിൽ κοιλίαയുടെ സാധാരണ ശാരീരിക അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἀφεδρῶνα
  choice: കക്കൂസ്
  rationale: വിസർജനസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആധുനികവുമായ പദം; ‘അഴുക്കുചാൽ’ എന്നത് മൂലത്തിൽ ഇല്ലാത്ത മലിനജലസംവിധാനം സൂചിപ്പിച്ചേക്കാം.
- source_word: καθαρίζων
  choice: ശുദ്ധീകരിച്ചുകൊണ്ട്
  rationale: പുരുഷലിംഗ ഏകവചന വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുറന്ന വ്യാകരണഘടന നിലനിർത്തുന്നു; ‘ശുദ്ധമെന്ന് പ്രഖ്യാപിച്ചു’ എന്ന് വ്യാഖ്യാനം നേരിട്ട് പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: πάντα τὰ βρώματα
  choice: എല്ലാ ഭക്ഷണങ്ങളെയും
  rationale: πάνταയും ബഹുവചനമായ βρώματαയും പ്രതിഫലിപ്പിക്കുകയും ഭക്ഷ്യവിഭാഗങ്ങളെക്കുറിച്ചുള്ള സന്ദർഭത്തോട് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: ചർച്ചയിലുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഏകവചന സർവനാമം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: ചെല്ലുന്നു / പുറത്തുപോകുന്നു
  rationale: അകത്തേക്കുള്ള പ്രവേശനവും പുറത്തേക്കുള്ള നീക്കവും തമ്മിലുള്ള മൂലപാഠത്തിലെ ചലനവൈരുധ്യം ലളിതമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: καθαρίζων πάντα τὰ βρώματα എന്നതിന്റെ വ്യാഖ്യാനം
  choice: മർക്കോസിന്റെ വിശദീകരണക്കുറിപ്പായി വായിക്കാവുന്ന, എന്നാൽ കൂടുതൽ നേരിട്ടുള്ള ‘ഇങ്ങനെ എല്ലാ ഭക്ഷണങ്ങളെയും ശുദ്ധീകരിച്ചുകൊണ്ട്’
  alternative: ദഹനപ്രക്രിയയെ സൂചിപ്പിക്കുന്ന ‘ഇങ്ങനെ എല്ലാ ഭക്ഷണവും പുറത്താക്കി ശുദ്ധമാക്കുന്നു’
  rationale: καθαρίζων എന്ന പുരുഷലിംഗ ഏകവചന കൃദന്തം യേശുവിനെ സൂചിപ്പിക്കുന്ന മർക്കോസിന്റെ വിശദീകരണക്കുറിപ്പായി വ്യാപകമായി വായിക്കപ്പെടുന്നു. എന്നാൽ ഇത് ദഹന-വിസർജനപ്രക്രിയയോട് ബന്ധിപ്പിക്കുന്ന വ്യാകരണവായനയും സാധ്യമാണ്. മുഖ്യപാഠത്തിൽ പങ്കാളികൃത്തിന്റെ രൂപവും അർഥതുറപ്പും നിലനിർത്തി, യഥാർഥമായ ആശയഭിന്നത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ശരീരാവയവങ്ങളെയും വിസർജനസ്ഥലത്തെയും വ്യക്തമായി പറയുമ്പോഴും അനാവശ്യമായി സാങ്കേതികമോ പഴഞ്ചനോ ആയ പദങ്ങൾ ഒഴിവാക്കി. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച യേശുവിന്റെ ഉദ്ധരണിയുടെ തുടർച്ചയായതിനാൽ അവസാന ഉദ്ധരണിച്ചിഹ്നം മാത്രം നിലനിർത്തി.
