source:
  edition: SBLGNT
  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: ml
  text: ആ സ്ത്രീ ഗ്രീക്കുകാരിയും[a] ജന്മത്താൽ സുറോഫൊയ്നീക്യക്കാരിയുമായിരുന്നു[b]. തന്റെ മകളിൽനിന്ന് ഭൂതത്തെ പുറത്താക്കണമെന്ന് അവൾ യേശുവിനോട് വീണ്ടും വീണ്ടും അപേക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യഹൂദയല്ലാത്തവൾ.’ ഗ്രീക്ക് മൂലപാഠത്തിൽ ‘ഗ്രീക്കുകാരി’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് അവൾ യഹൂദയല്ലാത്തവളും ഗ്രീക്ക് സംസ്കാരവുമായി ബന്ധപ്പെട്ടവളുമാണെന്ന് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഉത്ഭവത്താൽ/വംശത്താൽ ഒരു സുറോഫൊയ്നീക്യക്കാരി’; അതായത് സുറോഫൊയ്നീക്യ വംശജ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: ഗ്രീക്കുകാരി
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ഗ്രീക്കുകാരി’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യെഹൂദയല്ലാത്തവൾ എന്ന സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: ജന്മത്താൽ സുറോഫൊയ്നീക്യക്കാരി
  rationale: വംശപരവും ഭൂമിശാസ്ത്രപരവുമായ ഉത്ഭവം സൂചിപ്പിക്കുന്ന τῷ γένει എന്ന പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἠρώτα
  choice: വീണ്ടുംവീണ്ടും അപേക്ഷിച്ചു
  rationale: അപൂർണഭൂതകാല രൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ അപേക്ഷ സംരക്ഷിക്കുന്നു; ‘യാചിച്ചു’ എന്നതിനെക്കാൾ മൂലക്രിയയുടെ ഭാവം അതിശയിപ്പിക്കാത്ത പ്രയോഗമാണിത്.
- source_word: ἵνα ... ἐκβάλῃ
  choice: പുറത്താക്കണമെന്ന്
  rationale: അവളുടെ അപേക്ഷയുടെ ഉള്ളടക്കം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുകയും ഭൂതോച്ചാടനസന്ദർഭത്തിലെ ἐκβάλλωയുടെ ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸ δαιμόνιον
  choice: ഭൂതത്തെ
  rationale: ‘അശുദ്ധാത്മാവ്’ എന്ന സമീപസന്ദർഭത്തിലെ വേറൊരു പദപ്രയോഗം ഇറക്കുമതി ചെയ്യാതെ δαιμόνιον നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: തന്റെ മകളിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ‘ഉള്ളിൽനിന്ന് പുറത്തേക്ക്’ എന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, ലഘുവായ ആഖ്യാനബന്ധമാണ്; മലയാളവാക്യത്തിന്റെ ഒഴുക്കിൽ അനാവശ്യമായ ‘എന്നാൽ/ഇപ്പോൾ’ ചേർക്കാതെ അതിന്റെ പ്രവർത്തനം കൈകാര്യം ചെയ്യുന്നു.
theological_decisions:
- issue: സ്ത്രീയുടെ ജനവിഭാഗപരമായ തിരിച്ചറിയൽ
  choice: ‘ഗ്രീക്കുകാരി’ എന്നും ‘ജന്മത്താൽ സുറോഫൊയ്നീക്യക്കാരി’ എന്നും ഉള്ള രണ്ട് വിശേഷണങ്ങളും നിലനിർത്തി.
  alternative: ‘യെഹൂദയല്ലാത്തവൾ, സുറോഫൊയ്നീക്യ വംശജ’
  rationale: സാംസ്കാരിക/മതപരവും വംശീയ/ഭൂമിശാസ്ത്രപരവുമായ തിരിച്ചറിയലിന്റെ രണ്ടു തലങ്ങൾ ഒന്നിലൊന്ന് ലയിപ്പിക്കാതെ മൂലപാഠത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- issue: മകളുടെ ബാധയുടെ സ്വഭാവം
  choice: ‘ഭൂതത്തെ പുറത്താക്കുക’
  alternative: ‘ദുഷ്ടാത്മാവിനെ നീക്കുക’
  rationale: δαιμόνιον എന്ന വ്യക്തമായ പദം മൃദൂകരിക്കാതെയും പുനർവ്യാഖ്യാനിക്കാതെയും മൂലപാഠത്തിലെ അതിഭൗതിക അവകാശവാദം നിലനിർത്തുന്നു.
- issue: അപേക്ഷ ആരോടാണെന്ന വ്യക്തത
  choice: ‘യേശുവിനോട്’
  alternative: ‘അവനോട്’
  rationale: αὐτόν അക്ഷരാർഥത്തിൽ ‘അവനോട്’ എന്നാണെങ്കിലും ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കാൻ സന്ദർഭത്തിലെ സൂചിതനായ യേശുവിന്റെ പേര് ഉപയോഗിച്ചു; പുതിയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഗ്രീക്കുകാരി’, ‘സുറോഫൊയ്നീക്യക്കാരി’ എന്നീ ചരിത്രപരമായ തിരിച്ചറിയലുകൾ നിലനിർത്തി; ആവർത്തിച്ച അപേക്ഷയെ ‘വീണ്ടുംവീണ്ടും അപേക്ഷിച്ചു’ എന്നു വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
