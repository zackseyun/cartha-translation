source:
  edition: SBLGNT
  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: ml
  text: കാരണം, പരീശന്മാരും എല്ലാ യെഹൂദന്മാരും മൂപ്പന്മാരുടെ പാരമ്പര്യം മുറുകെപ്പിടിച്ചുകൊണ്ട്, മുഷ്ടികൊണ്ട്[a] കൈകൾ കഴുകിയാലല്ലാതെ ഭക്ഷണം കഴിക്കാറില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുഷ്ടിയാൽ”; “മണിക്കട്ടുവരെ” അല്ലെങ്കിൽ “നന്നായി” എന്നുമാകാം. ഗ്രീക്ക് പദത്തിന്റെ അർഥം വിവാദമാണ്; ആചാരപരമായി കൈകൾ കഴുകുന്ന പ്രത്യേക രീതിയെയോ അതിന്റെ പരിധിയെയോ ഇത് സൂചിപ്പിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: -തിനാൽ / വിശദീകരണബന്ധം
  rationale: മുൻസന്ദർഭത്തെ വിശദീകരിക്കുന്ന γὰρ-ന്റെ ശക്തി മലയാളത്തിൽ വാക്യഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ഈ യെഹൂദ മതവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള പേരാണ്.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: എല്ലാ യെഹൂദരും
  rationale: മൂലത്തിലെ വ്യാപകമായ പ്രയോഗം ചുരുക്കാതെ നിലനിർത്തുന്നു; ഇത് സന്ദർഭത്തിലെ പൊതുവായ വിവരണമാണ്.
- source_word: ἐὰν μὴ
  choice: -യിട്ടല്ലാതെ
  rationale: നിഷേധാത്മക നിബന്ധനയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: πυγμῇ
  choice: മുഷ്ടികൊണ്ട്[a]
  rationale: വിവാദമുള്ള ദത്തിവുപ്രയോഗത്തിന്റെ അക്ഷരാർഥസാദ്ധ്യത മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും മറ്റു സാദ്ധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: νίψωνται τὰς χεῖρας
  choice: കൈ കഴുകുക
  rationale: ശരീരഭാഗം കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: οὐκ ἐσθίουσιν
  choice: ഭക്ഷണം കഴിക്കാറില്ല
  rationale: പതിവായ ആചാരത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κρατοῦντες
  choice: മുറുകെപ്പിടിക്കുന്നതിനാൽ
  rationale: പാരമ്പര്യത്തോടുള്ള ഉറച്ച അനുസരണം പ്രകടമാക്കുന്നു; കൃതന്തത്തിന്റെ സാഹചര്യബന്ധം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: പൂർവികരുടെ പാരമ്പര്യം
  rationale: πρεσβύτεροι ഇവിടെ പാരമ്പര്യം കൈമാറിയ മുൻകാല മതമൂപ്പന്മാരെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ സംക്ഷിപ്തരൂപം.
theological_decisions:
- issue: “എല്ലാ യെഹൂദരും” എന്നതിന്റെ വ്യാപ്തി
  choice: മൂലത്തിലെ വ്യാപകമായ പ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: യെഹൂദ്യർ എല്ലാവരും; അനേകം യെഹൂദർ
  rationale: πάντες എന്നത് ഒഴിവാക്കുകയോ മൃദൂകരിക്കുകയോ ചെയ്യുന്നത് മൂലപാഠത്തെ ചുരുക്കും. ഇത് ഓരോ വ്യക്തിയെയും കണക്കുപരമായി ഉൾപ്പെടുത്തുന്ന അവകാശവാദമെന്നതിലുപരി മർക്കോസിന്റെ പൊതുവായ വിശദീകരണമായി വായിക്കാം.
- issue: πυγμῇ എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ “മുഷ്ടികൊണ്ട്” എന്ന് നൽകി, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: കൈമുട്ടുവരെ; നന്നായി; ആചാരവിധിപ്രകാരം
  rationale: ഗ്രീക്ക് പദത്തിന്റെ കൃത്യമായ ആചാരപരമായ സൂചന വിവാദമാണ്. വ്യാഖ്യാനം നിശ്ചയിച്ച് അടിച്ചേൽപ്പിക്കാതെ അക്ഷരാർഥസാദ്ധ്യതയും മറ്റു വ്യാഖ്യാനങ്ങളും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വിവാദമുള്ള πυγμῇ എന്ന പദം അമിതമായി വ്യാഖ്യാനിക്കാതെ അടിക്കുറിപ്പോടെ നിലനിർത്തി. “പൂർവികർ” എന്നത് ഇവിടെ പാരമ്പര്യത്തിന്റെ മുൻകാല മതമൂപ്പന്മാരെ സൂചിപ്പിക്കുന്നു.
