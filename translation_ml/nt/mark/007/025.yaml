reference: Mark 7:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: ml
  text: എന്നാൽ, അവനെക്കുറിച്ചു കേട്ടയുടനെ, അശുദ്ധാത്മാവുണ്ടായിരുന്ന ചെറിയ മകളുടെ അമ്മയായ ഒരു സ്ത്രീ വന്ന് അവന്റെ കാൽക്കൽ വീണു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യ/തുടർച്ചാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εὐθὺς ἀκούσασα ... περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ചു കേട്ട ഉടനെ
  rationale: സ്ത്രീ യേശുവിനെക്കുറിച്ചുള്ള വാർത്ത കേട്ടതും തുടർന്നുണ്ടായ അടിയന്തര പ്രതികരണവും മാർക്കോസിന്റെ ദ്രുതഗതിയുള്ള ആഖ്യാനശൈലിയിൽ വ്യക്തമാക്കുന്നു.
- source_word: γυνὴ
  choice: ഒരു ... സ്ത്രീ
  rationale: നിശ്ചയാർഥക ഉപപദമില്ലാത്ത γυνή ഇവിടെ ആദ്യമായി രംഗത്തുവരുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു.
- source_word: θυγάτριον
  choice: ചെറിയ മകൾ
  rationale: ദൗഹിത്രി എന്നർഥം വരാവുന്ന ‘കൊച്ചുമകൾ’ ഒഴിവാക്കി, മകൾ എന്ന ബന്ധവും ഗ്രീക്കിലെ ലഘുത്വ/വാത്സല്യസൂചനയും നിലനിർത്തുന്നു.
- source_word: πνεῦμα ἀκάθαρτον
  choice: അശുദ്ധാത്മാവ്
  rationale: മാർക്കോസ് പതിവായി ഉപയോഗിക്കുന്ന പദപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ‘ഭൂതം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- source_word: ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: വന്ന് അവന്റെ കാൽക്കൽ വീണു
  rationale: പ്രവൃത്തികളുടെ ക്രമവും അടിയന്തര അപേക്ഷയുടെയും വിനയത്തിന്റെയും ദേഹഭാഷയും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: πνεῦμα ἀκάθαρτον എന്നതിന്റെ വിവർത്തനം
  choice: അശുദ്ധാത്മാവ്
  alternative: അശുദ്ധമായ ആത്മാവ്; ഭൂതം
  rationale: മാർക്കോസിന്റെ പ്രത്യേക പദപ്രയോഗവും അതിലെ ശുദ്ധി-അശുദ്ധി സൂചനയും നിലനിർത്തുന്നു. ‘ഭൂതം’ സാധ്യമായ ആശയവ്യാഖ്യാനമാണെങ്കിലും മൂലപദത്തിന്റെ നേരിട്ടുള്ള രൂപമല്ല.
- issue: θυγάτριον എന്ന ലഘുരൂപത്തിന്റെ അർഥസൂചന
  choice: ചെറിയ മകൾ
  alternative: മകൾ; ചെറിയ പെൺകുട്ടി
  rationale: കുട്ടിയുടെ പ്രായമോ വാത്സല്യഭാവമോ കൃത്യമായി വേർതിരിക്കാനാകാത്തതിനാൽ പ്രധാനപാഠത്തിൽ ലഘുരൂപത്തിന്റെ സൂചന സൂക്ഷിച്ച്, അതിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ചെറിയ മകൾ’ സാധാരണ സംസാരത്തിൽ അല്പം അപൂർവമായിരുന്നാലും, ‘കൊച്ചുമകൾ’ എന്നതിലൂടെ ‘ദൗഹിത്രി’ എന്ന തെറ്റായ അർഥം വരുന്നത് ഒഴിവാക്കുകയും ഗ്രീക്ക് ലഘുരൂപം സൂക്ഷിക്കുകയും ചെയ്യുന്നു. പ്രധാനവാക്യത്തിലെ പദക്രമം വായനാസൗകര്യത്തിനായി ക്രമപ്പെടുത്തിയെങ്കിലും പങ്കാളിവാക്യത്തിന്റെ ബന്ധവും ‘ഉടനെ’ എന്നതിലെ യഥാർഥ സൂക്ഷ്മതയും അടിക്കുറിപ്പിൽ നിലനിർത്തിയിട്ടുണ്ട്.
