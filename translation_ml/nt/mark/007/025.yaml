- from: എന്നാൽ, അവനെക്കുറിച്ചു കേട്ട ഉടനെ[c], അശുദ്ധാത്മാവ്[b] ബാധിച്ചിരുന്ന ഒരു ചെറിയ മകളുള്ള[a] സ്ത്രീ വന്ന് അവന്റെ കാൽക്കൽ വീണു.
  to: എന്നാൽ, അവനെക്കുറിച്ചു കേട്ടയുടനെ, അശുദ്ധാത്മാവുണ്ടായിരുന്ന ചെറിയ മകളുടെ അമ്മയായ ഒരു സ്ത്രീ വന്ന് അവന്റെ കാൽക്കൽ വീണു.
  rationale: The revision makes the daughter’s condition explicit with “അശുദ്ധാത്മാവുണ്ടായിരുന്ന” and identifies the woman naturally as her mother. It retains the source’s narrative sequence and the immediate force of εὐθὺς through “കേട്ടയുടനെ.” The unnecessary syntactic-ambiguity note is removed; the two lexical notes remain anchored to “ചെറിയ” and “അശുദ്ധാത്മാവ്,” respectively.
