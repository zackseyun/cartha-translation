source:
  edition: SBLGNT
  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: ml
  text: അവിടെനിന്ന് എഴുന്നേറ്റ് അദ്ദേഹം സോരിന്റെ പ്രദേശത്തേക്കു പോയി.[a] ഒരു വീട്ടിൽ കയറിയശേഷം, താൻ അവിടെയുണ്ടെന്ന് ആരും അറിയരുതെന്ന് അദ്ദേഹം ആഗ്രഹിച്ചു;[b] എങ്കിലും മറഞ്ഞിരിക്കാൻ അദ്ദേഹത്തിനു കഴിഞ്ഞില്ല.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സോരിന്റെ ഭൂപ്രദേശത്തേക്കു.” ഗ്രീക്കുപദം സോറുമായി ബന്ധപ്പെട്ട ജില്ലയെയോ അതിർത്തിപ്രദേശത്തെയോ സൂചിപ്പിക്കാം; അതിർത്തിരേഖയെ മാത്രം അല്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ആരും അറിയരുതെന്ന് അദ്ദേഹം ആഗ്രഹിച്ചു.” ഗ്രീക്കിൽ അറിയേണ്ട കാര്യം വ്യക്തമാക്കിയിട്ടില്ല; അദ്ദേഹത്തിന്റെ സാന്നിധ്യമോ എവിടെയാണെന്ന കാര്യമോ ഉദ്ദേശിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “മറ്റുള്ളവരുടെ ശ്രദ്ധയിൽപ്പെടാതിരിക്കാൻ അദ്ദേഹത്തിനു കഴിഞ്ഞില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: അവിടെനിന്ന്
  rationale: Ἐκεῖθεν മുൻസ്ഥലത്തുനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; δέ ലഘുവായ ആഖ്യാനബന്ധകമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം പദമായി ചേർക്കാതെ ഉൾക്കൊള്ളുന്നു.
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റ്
  rationale: ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയിലേക്കു നയിക്കുന്ന അയോറിസ്റ്റ് കൃദന്തത്തിന്റെ ക്രമാനുഗതവും ദൃശ്യവുമായ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀπῆλθεν
  choice: പോയി
  rationale: മുൻസ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ലളിതമായ ‘പോയി’ മലയാളത്തിൽ സ്വാഭാവികവും മതിയായതുമാണ്.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: സോരിന്റെ പ്രദേശത്തേക്കു
  rationale: ὅρια അതിർത്തിരേഖയെ മാത്രം അല്ല, സോറുമായി ബന്ധപ്പെട്ട പ്രദേശത്തെയോ ഭൂപ്രദേശത്തെയോ സൂചിപ്പിക്കാം; ‘പ്രദേശം’ ഈ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: ഒരു വീട്ടിൽ കയറിയശേഷം
  rationale: കൃദന്തം സമയക്രമം സൂചിപ്പിക്കുന്നു; നിർദേശകപദമില്ലാത്ത οἰκίαν ‘ഒരു വീട്’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: താൻ അവിടെയുണ്ടെന്ന് ആരും അറിയരുതെന്ന് അദ്ദേഹം ആഗ്രഹിച്ചു
  rationale: ഗ്രീക്കിൽ അറിയേണ്ട കാര്യം പരോക്ഷമാണ്. മലയാളത്തിൽ അർഥം വ്യക്തമാകാൻ അദ്ദേഹത്തിന്റെ സാന്നിധ്യം സൂചിപ്പിക്കുന്നു; ‘എവിടെയായിരുന്നു’ എന്നതുപോലെ അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: എങ്കിലും മറഞ്ഞിരിക്കാൻ അദ്ദേഹത്തിനു കഴിഞ്ഞില്ല
  rationale: λανθάνω ഇവിടെ മറ്റുള്ളവരുടെ ശ്രദ്ധയിൽപ്പെടാതിരിക്കുക എന്ന അർഥത്തിലാണ്; മുൻ ആഗ്രഹത്തോടുള്ള വൈരുധ്യം ‘എങ്കിലും’ വ്യക്തമാക്കുന്നു.
