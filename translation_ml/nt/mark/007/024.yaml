translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആഖ്യാനത്തിന്റെ ലാളിത്യവും ഗ്രീക്കിലെ പരോക്ഷ കർമത്തിന്റെ പരിധിയും നിലനിർത്തുന്നു; ‘അദ്ദേഹം’ എന്ന ആദരസൂചക സർവനാമം സ്വാഭാവിക മലയാള ബൈബിൾ ഗദ്യശൈലിയോട് യോജിക്കുന്നു.
