id: MRK.7.28
reference: Mark 7:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: ml
  text: 'എന്നാൽ അവൾ അവനോടു മറുപടി പറഞ്ഞു: “കർത്താവേ[a], മേശയ്ക്കടിയിലുള്ള ചെറിയ നായ്ക്കളും[b] കുട്ടികളുടെ നുറുക്കുകളിൽനിന്നു തിന്നുന്നുണ്ടല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അയ്യാ.” ഗ്രീക്കിലെ κύριε എന്ന പദം “കർത്താവേ” എന്ന ശീർഷകമായും ആദരപൂർവമായ സംബോധനയായും ഉപയോഗിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കുപദം ചെറിയ നായ്ക്കളെയോ വീട്ടിൽ വളർത്തുന്ന നായ്ക്കളെയോ സൂചിപ്പിക്കാം; അതിന്റെ ചെറുരൂപഭാവം നിലനിർത്താനാണ് “ചെറിയ നായ്ക്കൾ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: അവൾ അവനോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ മറുപടി പറയുക എന്ന സംയുക്ത പ്രയോഗം ആവർത്തനഭാരം കൂടാതെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ചരിത്രവർത്തമാനം മലയാള ആഖ്യാനശൈലിക്കനുസരിച്ച് ഭൂതകാലത്തിൽ നൽകി.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള നേരിട്ടുള്ള സംബോധനയിൽ κύριος എന്ന പദത്തിന്റെ പതിവായ ശീർഷകാർഥം നിലനിർത്തുന്നു; ആദരസൂചകമായ മറ്റൊരു അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: -ഉം … തിന്നുന്നുണ്ടല്ലോ
  rationale: ചെറിയ നായ്ക്കൾക്കും പങ്കു ലഭിക്കുന്നു എന്ന സ്ത്രീയുടെ ചേർത്തുപറയുന്ന, ഊന്നലുള്ള വാദം മലയാളത്തിലെ ‘-ഉം’ എന്നും ‘ഉണ്ടല്ലോ’ എന്നും ചേർത്ത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κυνάρια
  choice: ചെറിയ നായ്ക്കൾ
  rationale: നായയുടെ ചെറുരൂപത്തെയോ വീട്ടിൽ വളർത്തുന്ന ചെറിയ നായകളെയോ സൂചിപ്പിക്കാവുന്ന diminutive ഭാവം നിലനിർത്തുന്നു; ‘നായ്ക്കുട്ടികൾ’ എന്നു പറഞ്ഞ് പ്രായം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ὑποκάτω τῆς τραπέζης
  choice: മേശയ്ക്കടിയിലുള്ള
  rationale: സ്ഥലബന്ധം ലളിതവും കൃത്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐσθίουσιν
  choice: തിന്നുന്നുണ്ടല്ലോ
  rationale: ദൃഷ്ടാന്തത്തിലെ പതിവായ പ്രവൃത്തിയെ വർത്തമാനകാലത്തിൽ നിലനിർത്തുകയും സ്ത്രീയുടെ മറുപടിയിലെ സമ്മതിപ്പിക്കുന്ന ഊന്നൽ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπὸ τῶν ψιχίων τῶν παιδίων
  choice: കുട്ടികളുടെ നുറുക്കുകളിൽനിന്നു
  rationale: ψιχία എന്നതിന്റെ ‘നുറുക്കുകൾ/ചെറുകഷണങ്ങൾ’ എന്ന അർഥവും ἀπό എന്നതിന്റെ ഉറവിടമോ ഭാഗികമായി സ്വീകരിക്കലോ സൂചിപ്പിക്കുന്ന ഭാവവും സംരക്ഷിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഭക്ഷണം’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സ്ത്രീ യേശുവിനെ κύριε എന്നു സംബോധന ചെയ്യുന്നത്
  choice: കർത്താവേ
  alternative: യജമാനനേ / അങ്ങുന്നേ എന്ന ആദരസംബോധന
  rationale: κύριος യേശുവിന്റെ ശീർഷകമായും സാധാരണ ആദരസംബോധനയായും ഗ്രഹിക്കാവുന്നതാണ്. പ്രധാന പാഠത്തിൽ പതിവായ ‘കർത്താവേ’ നിലനിർത്തി, സന്ദർഭത്തിൽ സാധ്യമായ ആദരസംബോധനാർഥം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഉണ്ടല്ലോ’ സ്ത്രീയുടെ വാദത്തിലെ സമ്മതിപ്പിക്കുന്ന ഭാവം നൽകുന്നു; പരിഹാസമോ അതിരുകടന്ന വികാരഭാവമോ ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ പ്രധാന പാഠത്തിൽ നൽകിയിരിക്കുന്നു.
