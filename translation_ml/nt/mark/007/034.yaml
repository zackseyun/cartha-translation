id: MRK.7.34
reference: Mark 7:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: ml
  text: അവൻ സ്വർഗത്തിലേക്കു നോക്കി നെടുവീർപ്പിട്ടു[a]. എന്നിട്ട് അവനോട്, “എഫ്ഫഥാ”[b] എന്നു പറഞ്ഞു. അതിന്റെ അർഥം “തുറക്കപ്പെടുക” എന്നാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞരങ്ങി”; ഈ ക്രിയയ്ക്ക് ആഴമായ നെടുവീർപ്പോ ഞരക്കമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അരമായ ഭാഷയിലെ “എഫ്ഫഥാ” എന്ന വാക്കിന്റെ അർഥം “തുറക്കപ്പെടുക” എന്നാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναβλέψας
  choice: സ്വർഗത്തിലേക്കു നോക്കി
  rationale: മുകളിലേക്കുള്ള നോട്ടത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; തുടർന്ന് വരുന്ന εἰς τὸν οὐρανόν എന്ന പ്രയോഗവും ഇതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: εἰς τὸν οὐρανόν
  choice: സ്വർഗത്തിലേക്ക്
  rationale: ഈ പ്രാർഥനാസദൃശമായ സന്ദർഭത്തിൽ οὐρανός വെറും ആകാശത്തേക്കാൾ സ്വർഗത്തെ സൂചിപ്പിക്കുന്നതാണ്.
- source_word: ἐστέναξεν
  choice: നെടുവീർപ്പിട്ടു
  rationale: στενάζω എന്ന ക്രിയയ്ക്ക് നെടുവീർപ്പിടുക, ഞരങ്ങുക എന്നീ അർഥങ്ങളുണ്ടാകാം. വികാരത്തിന്റെ തീവ്രത അനാവശ്യമായി വർധിപ്പിക്കാതെ കേൾക്കാവുന്ന ആഴമുള്ള പ്രതികരണം അറിയിക്കാൻ ‘നെടുവീർപ്പിട്ടു’ യോജിക്കുന്നു.
- source_word: λέγει αὐτῷ
  choice: അവനോട് … പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനകാലമായ λέγει മലയാള ആഖ്യാനശൈലിക്ക് യോജിച്ച ഭൂതകാലത്തിൽ നൽകി; αὐτῷ എന്ന ദത്തിവിഭക്തിയിലെ വ്യക്തിപരമായ അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: Εφφαθα
  choice: എഫ്ഫഥാ
  rationale: മർക്കോസ് അരമായ ഉച്ചാരണം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുകയും ഉടൻ അതിന്റെ അർഥം നൽകുകയും ചെയ്യുന്നതിനാൽ മലയാളത്തിലും ശബ്ദരൂപം സംരക്ഷിക്കുന്നു.
- source_word: Διανοίχθητι
  choice: തുറക്കപ്പെടുക
  rationale: ഏകവചനത്തിലുള്ള അഒറിസ്റ്റ് കർമണിപ്രയോഗ ആജ്ഞയുടെ രൂപം കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: αὐτῷ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: അവനോട്—കേൾവിക്കുറവുള്ള മനുഷ്യനോട്
  alternative: അവന്റെ ചെവികളെയോ സംസാരശേഷിയെയോ പരോക്ഷമായി അഭിസംബോധന ചെയ്യുന്നു
  rationale: ഗ്രീക്കിലെ ദത്തിവിഭക്തി ഏറ്റവും സ്വാഭാവികമായി ആ മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്. ആജ്ഞ അവന്റെ തടസ്സപ്പെട്ട ശേഷികൾ തുറക്കപ്പെടുന്നതിനെ സംബന്ധിച്ചെങ്കിലും വിവർത്തനം വ്യക്തിപരമായ അഭിസംബോധന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ കർമണിപ്രയോഗ ആജ്ഞയും അരമായ ശബ്ദരൂപവും സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുണ്ടായിരുന്നതിനാൽ മലയാളത്തിൽ ചിഹ്നങ്ങൾ പ്രസക്തമായ വാക്കുകളോടു ചേർത്തു.
