  text: ἔλεγεν δὲ ὅτι Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον ἐκεῖνο κοινοῖ τὸν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/020.yaml
  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞുകൊണ്ടിരുന്നു: “മനുഷ്യനിൽനിന്നു പുറത്തുവരുന്നതാണ് മനുഷ്യനെ അശുദ്ധനാക്കുന്നത്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മനുഷ്യനെ മലിനമാക്കുന്നു.” ഗ്രീക്ക് ക്രിയ ഒരാളെ അശുദ്ധനോ മലിനനോ ആക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ശുദ്ധി-അശുദ്ധി ഭാഷയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന പ്രസംഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം ആ വശം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തില്ല
  rationale: ഇവിടെ ഇത് ദുർബലമായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർത്താൽ അനാവശ്യമായ വിരോധമോ കാലക്രമമോ തോന്നാം.
- source_word: ὅτι
  choice: നേരിട്ടുള്ള ഉദ്ധരണിയായി അവതരിപ്പിച്ചു
  rationale: പറച്ചിലിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ὅτι മലയാളത്തിൽ ഉദ്ധരണിചിഹ്നവും ദ്വിബിന്ദുവുംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: മനുഷ്യനിൽനിന്നു പുറത്തുവരുന്നത്
  rationale: നാമവൽക്കരിച്ച കൃദന്തരൂപത്തെ സ്വാഭാവികമായ മലയാള സംബന്ധവാക്യമായി നൽകി; ἐκ എന്ന ഉറവിടബോധവും നിലനിർത്തി.
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: മനുഷ്യൻ / മനുഷ്യനെ
  rationale: ἄνθρωπος ഇവിടെ പൊതുവായ പ്രതിനിധ്യാർഥത്തിലാണ്; മലയാളത്തിലെ ‘മനുഷ്യൻ’ ലിംഗവിശേഷത്തെ മുൻനിർത്താതെ മനുഷ്യവ്യക്തിയെ സൂചിപ്പിക്കുകയും മൂലത്തിലെ ഏകവചന ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐκεῖνο
  choice: ആണ്
  rationale: ഗ്രീക്കിലെ നിർദ്ദേശക സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘-താണ്’ എന്ന കേന്ദ്രീകരണഘടനയിലൂടെ സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: κοινοῖ
  choice: അശുദ്ധനാക്കുന്നു
  rationale: ശുദ്ധി-അശുദ്ധി പശ്ചാത്തലത്തിലുള്ള ‘അശുദ്ധമാക്കുക’ എന്ന അർഥം നേരിട്ട് വ്യക്തമാക്കുന്നു; ‘മലിനമാക്കുന്നു’ എന്ന നൈതിക/വ്യാപക പകരം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: κοινόω എന്ന പദത്തിലെ ശുദ്ധി-അശുദ്ധി ഭാഷ
  choice: അശുദ്ധനാക്കുന്നു
  alternative: മലിനമാക്കുന്നു
  rationale: സന്ദർഭത്തിലെ യഹൂദ ശുദ്ധിവിഭാഗത്തെ വ്യക്തമായി നിലനിർത്താൻ ‘അശുദ്ധനാക്കുന്നു’ തിരഞ്ഞെടുത്തു. അതേസമയം നൈതിക മലിനീകരണത്തിന്റെ വ്യാപക ധ്വനി നഷ്ടപ്പെടാതിരിക്കാൻ പകരം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ മൂലത്തിലെ അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം നിലനിർത്തുന്നു; ‘മനുഷ്യൻ’ എന്ന ആവർത്തനം ഗ്രീക്ക് വാക്യത്തിലെ ആലങ്കാരിക സമാന്തരത സംരക്ഷിക്കുന്നു.
