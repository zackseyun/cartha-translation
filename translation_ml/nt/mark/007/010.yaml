  to: 'കാരണം മോശെ പറഞ്ഞു: “നിന്റെ പിതാവിനെയും മാതാവിനെയും ബഹുമാനിക്കുക” എന്നും, “പിതാവിനെയോ മാതാവിനെയോ ദുഷിച്ചു പറയുന്നവൻ[a] നിശ്ചയമായും മരിക്കണം[b]” എന്നും.'
