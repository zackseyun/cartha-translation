id: MRK.7.10
reference: Mark 7:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ml
  text: 'കാരണം മോശെ പറഞ്ഞു: “നിന്റെ പിതാവിനെയും മാതാവിനെയും ബഹുമാനിക്കുക” എന്നും, “പിതാവിനെയോ മാതാവിനെയോ ദുഷിച്ചു പറയുന്നവൻ[a] നിശ്ചയമായും മരിക്കണം[b]” എന്നും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പിതാവിനെയോ മാതാവിനെയോ ശപിക്കുന്നവൻ.” ഈ ക്രിയയ്ക്ക് ദുഷിച്ചു പറയുക, അധിക്ഷേപിക്കുക, ശപിക്കുക എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മരണശിക്ഷ ലഭിക്കണം” അല്ലെങ്കിൽ “വധിക്കപ്പെടണം.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “മരണത്താൽ മരിക്കട്ടെ” എന്ന നിയമസൂത്രമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: മോശെ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിലും പൊതുപ്രയോഗത്തിലും ഉറച്ചുപോയ വ്യക്തിനാമരൂപം.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാദത്തിന് വിശദീകരണപരമായ അടിസ്ഥാനം നൽകുന്ന ബന്ധകത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἶπεν
  choice: പറഞ്ഞത്
  rationale: ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ലളിതമായ ഭൂതകാല റിപ്പോർട്ടിങ് രൂപം.
- source_word: Τίμα
  choice: ബഹുമാനിക്കുക
  rationale: കല്പനയുടെ ധാർമിക ഗൗരവവും മാതാപിതാക്കൾക്ക് അർഹമായ ആദരവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: നിന്റെ അപ്പനെയും അമ്മയെയും
  rationale: രണ്ട് ബന്ധങ്ങളെയും ഗ്രീക്കിലുള്ളതുപോലെ വ്യക്തമായി നിലനിർത്തുന്നു; സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: Ὁ κακολογῶν
  choice: ദുഷിക്കുന്നവൻ
  rationale: κακολογέω എന്നതിലെ ദുഷിച്ചു പറയുക, അധിക്ഷേപിക്കുക, ശപിക്കുക എന്നീ അർത്ഥവ്യാപ്തി ഒറ്റ അർത്ഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാതെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: πατέρα ἢ μητέρα
  choice: അപ്പനെയോ അമ്മയെയോ
  rationale: ἢ സൂചിപ്പിക്കുന്ന പര്യായബന്ധം നിലനിർത്തുകയും ഗ്രീക്കിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: θανάτῳ τελευτάτω
  choice: മരണശിക്ഷ അനുഭവിക്കണം
  rationale: നിയമപരമായ നിർബന്ധശക്തി വ്യക്തമായി നൽകുന്നു; പദാനുപദമായ ‘മരണത്താൽ മരിക്കട്ടെ’ എന്ന അസ്വാഭാവിക രൂപം ഒഴിവാക്കുന്നു. സജീവമായ ‘മരിക്കണം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: θανάτῳ τελευτάτω എന്ന നിയമശിക്ഷാസൂത്രത്തിന്റെ വിവർത്തനം
  choice: മരണശിക്ഷ അനുഭവിക്കണം
  alternative: നിശ്ചയമായും മരിക്കണം
  rationale: സന്ദർഭത്തിലെ നിയമപരമായ ശിക്ഷാഭാവം മലയാള വായനക്കാരന് വ്യക്തമായി നൽകുന്നു; അതേസമയം ഗ്രീക്ക് വ്യാകരണരൂപം നിർവഹിക്കുന്നവനെ വ്യക്തമാക്കാത്തതിനാൽ കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: κακολογῶν എന്ന ക്രിയയുടെ അർത്ഥവ്യാപ്തി
  choice: ദുഷിക്കുന്നവൻ
  alternative: ശപിക്കുന്നവൻ
  rationale: മാതാപിതാക്കളെക്കുറിച്ച് ദുഷിച്ചു പറയുക, അധിക്ഷേപിക്കുക, ശപിക്കുക എന്നിവ ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലത സംരക്ഷിക്കുന്നു; ഔപചാരിക ശാപത്തിൽ മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉദ്ധരണികളുടെ കല്പനാത്മകവും നിയമപരവുമായ ഗൗരവം നിലനിർത്തി; യഥാർത്ഥത്തിലെ അർത്ഥവ്യാപ്തിയും വ്യാകരണപരമായ അനിശ്ചിതത്വവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
