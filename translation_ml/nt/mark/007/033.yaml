  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου κατ’ ἰδίαν ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ καὶ πτύσας ἥψατο τῆς γλώσσης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: ml
  text: അവനെ ജനക്കൂട്ടത്തിൽനിന്ന് വേർതിരിച്ച് തനിച്ചു കൊണ്ടുപോയി, അവൻ തന്റെ വിരലുകൾ ആ മനുഷ്യന്റെ ചെവികളിൽ ഇട്ടു; തുപ്പിയശേഷം[b] അവന്റെ നാവിൽ തൊട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ഗ്രീക്കിൽ, ‘തുപ്പിയശേഷം അവന്റെ നാവിൽ തൊട്ടു’ എന്നാണ്; യേശു ഉമിനീർ ആ മനുഷ്യന്റെ നാവിൽ പുരട്ടിയെന്ന് അതിൽ വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: അവനെ ജനക്കൂട്ടത്തിൽനിന്ന് മാറ്റി ... കൊണ്ടുപോയിട്ട്
  rationale: ἀπολαμβάνομαι ഇവിടെ ആ മനുഷ്യനെ ജനക്കൂട്ടത്തിൽനിന്ന് വേർതിരിച്ചു മാറ്റിക്കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രവർത്തിയുടെ വേർതിരിക്കൽഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κατ’ ἰδίαν
  choice: സ്വകാര്യമായി
  rationale: മറ്റുള്ളവരിൽനിന്ന് അകന്ന്, പരസ്യമല്ലാതെ എന്ന ക്രിയാവിശേഷണാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: അവൻ തന്റെ വിരലുകൾ ആ മനുഷ്യന്റെ ചെവികളിൽ വെച്ചു
  rationale: βάλλω ഈ ശരീരപ്രവർത്തനസന്ദർഭത്തിൽ ‘വെക്കുക’ എന്നാണ്; ‘തള്ളിക്കയറ്റുക’ എന്ന അതിശക്തമായ ഭാവം ഒഴിവാക്കുന്നു. ആവർത്തിച്ചുള്ള αὐτοῦ ആരെ സൂചിപ്പിക്കുന്നു എന്നത് മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: πτύσας
  choice: തുപ്പിയശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പങ്കാളിക്രിയയുടെ ക്രമം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; തുപ്പിയത് എവിടെയാണെന്നോ ഉമിനീർ നാവിൽ പുരട്ടിയെന്നോ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: അവന്റെ നാവിൽ തൊട്ടു
  rationale: ἅπτομαι + genitive എന്ന പ്രയോഗത്തിന്റെ സാധാരണ അർഥമായ ‘തൊടുക’ കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സൗഖ്യപ്പെടുത്തൽ നടപടിയിലെ തുപ്പലിന്റെ പങ്ക്
  choice: തുപ്പിയെന്നും തുടർന്ന് നാവിൽ തൊട്ടെന്നും മാത്രം പറയുന്നു
  alternative: ഉമിനീർ ആ മനുഷ്യന്റെ നാവിൽ പുരട്ടിയെന്ന് വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് വാക്യം തുപ്പിയ സ്ഥലമോ ഉമിനീർ നാവിൽ പതിപ്പിച്ചതോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ നടപടിയുടെ പ്രതീകാത്മകമോ ഔഷധപരമോ ആയ അർഥം വിവർത്തനത്തിൽ ചേർക്കാതെ മൂലപാഠത്തിന്റെ നിയന്ത്രണം പാലിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സർവനാമക്കുഴപ്പം ഒഴിവാക്കാൻ രണ്ടാമത്തെ αὐτοῦ ‘ആ മനുഷ്യന്റെ’ എന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു; എന്നാൽ മൂലപാഠം പറയാത്ത പ്രവർത്തിയോ വ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
