id: MRK.7.17
reference: Mark 7:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: ml
  text: അവൻ ജനക്കൂട്ടത്തെ വിട്ട് ഒരു വീട്ടിൽ കയറിയപ്പോൾ, അവന്റെ ശിഷ്യന്മാർ ആ ഉപമയെക്കുറിച്ച്[a] അവനോടു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ വചനത്തെക്കുറിച്ച്’ അല്ലെങ്കിൽ ‘ആ ദൃഷ്ടാന്തത്തെക്കുറിച്ച്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം παραβολή ആണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: വാക്യത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിൽ പ്രത്യേകം പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മർക്കോസിന്റെ തുടർച്ചയായ ആഖ്യാനബന്ധം മലയാളത്തിലെ വാക്യക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പിന്നെ’ എന്നു ചേർത്താൽ ഗ്രീക്കിലുള്ളതിലധികം കാലക്രമസൂചന തോന്നാനിടയുണ്ട്.
- source_word: ὅτε
  choice: -പ്പോൾ
  rationale: ശിഷ്യന്മാർ ചോദിച്ച സന്ദർഭം സൂചിപ്പിക്കുന്ന കാലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: ഒരു വീട്ടിൽ കയറിയപ്പോൾ
  rationale: οἶκον എന്നതിന് നിർദേശകവാചകം ഇല്ലാത്തതിനാൽ ‘ഒരു വീട്’ എന്നു നൽകി; ‘കയറി’ എന്നത് വീട്ടിലേക്കുള്ള പ്രവേശനം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: ജനക്കൂട്ടത്തെ വിട്ട്
  rationale: വീട്ടിൽ പ്രവേശിച്ചതോടെ ജനക്കൂട്ടത്തിൽനിന്നുണ്ടായ വേർപാട് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπηρώτων
  choice: ചോദിച്ചു
  rationale: ഗ്രീക്കിലെ അപൂർണ്ണഭൂതകാലത്തിന് തുടർച്ചയോ ആവർത്തനമോ സൂചിപ്പിക്കാനാകുമെങ്കിലും, ഈ ആഖ്യാനസന്ദർഭത്തിൽ ലളിതഭൂതകാലം മലയാളത്തിൽ സ്വാഭാവികമാണ്; അനാവശ്യമായി ആവർത്തനം നിർണ്ണയിക്കുന്നില്ല.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: ഉടമസ്ഥബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τὴν παραβολήν
  choice: ആ ഉപമ
  rationale: παραβολή എന്ന ഗ്രീക്ക് പദത്തിന്റെ സാധാരണ അർഥം നേരിട്ട് നിലനിർത്തുന്നു; മുൻപുള്ള വാക്ക് ഹ്രസ്വവും രൂപകാത്മകവുമായതിനാൽ ‘വചനം’ എന്ന വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ παραβολή എന്ന പദം ഉപമയെയോ കൂടുതൽ വിശാലമായ രൂപകവചനത്തെയോ സൂചിപ്പിക്കുന്നുവോ എന്നത്
  choice: ആ ഉപമ
  alternative: ആ വചനം; ആ ദൃഷ്ടാന്തം
  rationale: ‘ഉപമ’ ഗ്രീക്ക് പദത്തിന്റെ സാധാരണ വിഭാഗനാമം നിലനിർത്തുകയും മർക്കോസ് യേശുവിന്റെ ഉപദേശത്തെ എങ്ങനെ അവതരിപ്പിക്കുന്നു എന്നത് ചുരുക്കിപ്പറയാതിരിക്കുകയും ചെയ്യുന്നു. സന്ദർഭം അനുവദിക്കുന്ന വിശാലമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഒരു വീട്ടിൽ’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ നിർദേശകവാചകമില്ലായ്മയും ‘ഉപമ’ എന്ന പദം മൂലപാഠത്തിലെ വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
