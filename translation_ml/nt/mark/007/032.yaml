source:
  edition: SBLGNT
  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: ml
  text: അവർ കേൾവിയില്ലാത്തവനും സംസാരിക്കാൻ ബുദ്ധിമുട്ടുള്ളവനുമായ ഒരാളെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു[a]. അവന്റെമേൽ കൈവയ്ക്കണമെന്നു അവർ യേശുവിനോട് യാചിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘കേൾവിയില്ലാത്തവനും ബുദ്ധിമുട്ടോടെ സംസാരിക്കുന്നവനുമായ ഒരാളെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: കൊണ്ടുവന്നു
  rationale: മർക്കോസിൽ സാധാരണമായ ചരിത്രവർത്തമാനകാലത്തെ മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കനുസരിച്ച് ഭൂതകാലത്തിൽ നൽകി.
- source_word: κωφόν
  choice: കേൾവിയില്ലാത്തവൻ
  rationale: തുടർന്നുള്ള μογιλάλον സംസാരവൈകല്യം വേർതിരിച്ചു സൂചിപ്പിക്കുന്നതിനാൽ κωφός ഇവിടെ കേൾവിയില്ലായ്മയെ സൂചിപ്പിക്കുന്നു; മൂകനെന്ന് വിവർത്തനം ചെയ്യുന്നത് അർഥം അതിരുകടത്തും.
- source_word: μογιλάλον
  choice: സംസാരിക്കാൻ പ്രയാസമുള്ളവൻ
  rationale: ഈ അപൂർവപദം പൂർണമായ സംസാരശേഷിയില്ലായ്മയല്ല, പ്രയാസപ്പെട്ടുള്ള സംസാരമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: παρακαλοῦσιν
  choice: അപേക്ഷിച്ചു
  rationale: സൗഖ്യത്തിനായുള്ള ഗൗരവമുള്ള അഭ്യർഥനയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: അവന്റെമേൽ കൈ വെക്കണമെന്ന്
  rationale: അഭ്യർഥനയുടെ ഉള്ളടക്കം സ്വാഭാവികമായി നൽകുകയും ഗ്രീക്കിലെ ഏകവചനമായ ‘കൈ’ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: αὐτῷ
  choice: യേശുവിന്റെ അടുക്കൽ / യേശുവിനോട്
  rationale: വാക്യത്തിന്റെ സന്ദർഭത്തിൽ സർവനാമത്തിന്റെ സൂചിതവ്യക്തി യേശുവാണെന്ന് വ്യക്തതയ്ക്കായി പേര് ഉപയോഗിച്ചു.
theological_decisions:
- issue: ആ മനുഷ്യന്റെ വൈകല്യത്തിന്റെ സ്വഭാവം
  choice: കേൾവിയില്ലായ്മയും സംസാരിക്കാനുള്ള പ്രയാസവും
  alternative: ബധിരനും മൂകനും
  rationale: κωφός, μογιλάλος എന്നീ വേറിട്ട പദങ്ങൾ കേൾവിയില്ലായ്മയ്ക്കൊപ്പം പ്രയാസപ്പെട്ടുള്ള സംസാരത്തെ സൂചിപ്പിക്കുന്നു; പൂർണ മൂകത്വം എന്നു പറയുന്നത് മൂലപാഠത്തേക്കാൾ ശക്തമായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തതയ്ക്കായി ആവർത്തിക്കുന്ന സർവനാമങ്ങൾക്കു പകരം ‘യേശു’ ഉപയോഗിച്ചു; വൈകല്യത്തെ അപമാനകരമല്ലാത്ത, അർഥകൃത്യമായ ഭാഷയിൽ അവതരിപ്പിച്ചു.
