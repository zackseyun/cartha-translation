    issue: The rendering of παρακαλοῦσιν is slightly understated.
    rationale: ‘അപേക്ഷിച്ചു’ can mean a routine request, whereas the Greek verb in this healing setting conveys an earnest appeal. ‘യാചിച്ചു’ more closely reflects the force.
