    rationale: ‘പ്രയാസപ്പെട്ടു സംസാരിക്കുന്ന’ is understandable but not the most natural formulation. ‘ബുദ്ധിമുട്ടോടെ സംസാരിക്കുന്ന’ is more idiomatic and preserves the lexical alternative.
