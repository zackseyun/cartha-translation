id: MRK.7.8
reference: Mark 7:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: ml
  text: ദൈവത്തിന്റെ കല്പന ഉപേക്ഷിച്ച് നിങ്ങൾ മനുഷ്യരുടെ പാരമ്പര്യം മുറുകെപ്പിടിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: ഉപേക്ഷിച്ച്
  rationale: പ്രധാനക്രിയയോടു ബന്ധപ്പെട്ട മുൻകാലമോ അനുബന്ധമോ ആയ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് കർത്തൃവാചക ക്രിയാവിശേഷണരൂപമാണിത്. ഇവിടെ ദൈവകല്പനയെ വിട്ടുകളയുന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ ‘ഉപേക്ഷിച്ച്’ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിലെ ശാസനയുടെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കല്പന
  rationale: ἐντολήയുടെ ദൈവികവും മതപരവുമായ ആജ്ഞാസ്വഭാവം ‘കല്പന’ സ്വാഭാവികമായി നൽകുന്നു; τοῦ θεοῦ ദൈവത്തിൽനിന്നുള്ളതും ദൈവത്തിന്റേതുമായ കല്പനയെന്ന ബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: κρατεῖτε
  choice: മുറുകെപ്പിടിക്കുന്നു
  rationale: κρατέω ഇവിടെ ഉറച്ചുനിൽക്കുകയോ ദൃഢമായി ചേർന്നുനിൽക്കുകയോ ചെയ്യുന്നതാണ്. ‘മുറുകെപ്പിടിക്കുന്നു’ ആ ശക്തമായ അനുസരണം മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: τὴν παράδοσιν
  choice: പാരമ്പര്യം
  rationale: παράδοσις തലമുറകളിലൂടെ കൈമാറിവന്ന ആചാരോപദേശത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘പാരമ്പര്യം’ സംക്ഷിപ്തവും സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യവുമാണ്.
- source_word: τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ἄνθρωπος ഇവിടെ പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നില്ല; ദൈവികമായതിനു വിരുദ്ധമായി മനുഷ്യരിൽനിന്നുള്ളതിനെ പൊതുവായി സൂചിപ്പിക്കുന്നു. അതിനാൽ ലിംഗനിഷ്പക്ഷവും മൂലഭാഷാനുസൃതവുമായ ‘മനുഷ്യരുടെ’ യോജിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ കല്പനയും മനുഷ്യരുടെ പാരമ്പര്യവും തമ്മിലുള്ള വൈരുധ്യം
  choice: ‘ദൈവത്തിന്റെ കല്പന’ എന്നും ‘മനുഷ്യരുടെ പാരമ്പര്യം’ എന്നും നേർക്കുനേർ നിർത്തി മൂലപാഠത്തിലെ ശക്തമായ വൈരുധ്യം നിലനിർത്തി.
  alternative: ‘ആളുകളുടെ പാരമ്പര്യം’ എന്നു വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ പാരമ്പര്യത്തെ പൊതുവായി അപലപിക്കുന്ന തരത്തിൽ ആശയം വികസിപ്പിക്കുക.
  rationale: ശാസനയുടെ ലക്ഷ്യം മനുഷ്യരിൽനിന്നുള്ള പാരമ്പര്യത്തിനു ദൈവകല്പനയെക്കാൾ മുൻഗണന നൽകുന്നതാണ്. എല്ലാ പാരമ്പര്യത്തെയും സ്വതവേ നിരാകരിക്കുന്ന ആശയം പാഠത്തിലേക്ക് ചേർക്കാതെ ഈ പ്രത്യേക വൈരുധ്യം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘കല്പന,’ ‘പാരമ്പര്യം’ എന്നീ പരിചിതമായ മതപര പദങ്ങൾ നിലനിർത്തിയപ്പോൾ ‘മനുഷ്യരുടെ’ എന്നത് ἀνθρώπων എന്ന പൊതുവായ മനുഷ്യസൂചന കൃത്യമായി പകരുന്നു.
