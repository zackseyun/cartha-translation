  text: Καὶ προσκαλεσάμενος ⸀πάλιν τὸν ὄχλον ἔλεγεν αὐτοῖς· ⸀Ἀκούσατέ μου πάντες καὶ ⸀σύνετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: ml
  text: 'അവൻ ജനക്കൂട്ടത്തെ വീണ്ടും തന്റെ അടുത്തേക്ക് വിളിച്ചുവരുത്തി അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “നിങ്ങളെല്ലാവരും എന്നെ ശ്രദ്ധിക്കൂ; മനസ്സിലാക്കുകയും ചെയ്യൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: അടുത്തേക്ക് വിളിച്ച്
  rationale: ജനക്കൂട്ടത്തെ തന്റെ അടുക്കലേക്ക് വിളിച്ചുവരുത്തുക എന്ന ഘടകകൃത്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള സമാനപദം.
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപത്തിന്റെ തുടർച്ചാസ്വഭാവം നിലനിർത്തുന്നു; വെറും ‘പറഞ്ഞു’ എന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: Ἀκούσατέ μου πάντες
  choice: നിങ്ങൾ എല്ലാവരും എന്റെ വാക്കു കേട്ട്
  rationale: πάντες എന്ന സമഗ്ര ആഹ്വാനവും μου എന്ന ബന്ധവും സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: σύνετε
  choice: മനസ്സിലാക്കുക
  rationale: ശ്രദ്ധിച്ചറിവിലേക്കുള്ള ബഹുവചന ആജ്ഞയുടെ സ്വാഭാവികവും കൃത്യവുമായ പരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് അപൂർണ ഭൂതകാലമായ ἔλεγεν-ന്റെ തുടർച്ചാഭാവം പ്രത്യേകം സംരക്ഷിച്ചിട്ടുണ്ട്.
