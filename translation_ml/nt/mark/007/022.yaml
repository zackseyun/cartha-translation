id: MRK.7.22
reference: Mark 7:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μοιχεῖαι⸃, πλεονεξίαι, πονηρίαι, δόλος, ἀσέλγεια, ὀφθαλμὸς πονηρός, βλασφημία, ὑπερηφανία, ἀφροσύνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: ml
  text: വ്യഭിചാരങ്ങൾ, അത്യാഗ്രഹം, ദുഷ്ടതകൾ, വഞ്ചന, നാണംകെട്ട പെരുമാറ്റം, ദുഷ്ടദൃഷ്ടി[a], ദൂഷണം[b], അഹങ്കാരം, മൂഢത.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അസൂയ’ അല്ലെങ്കിൽ ‘കഞ്ഞിക്കണ്ണ്’; അക്ഷരാർഥം ‘ദുഷ്ടമായ കണ്ണ്.’ അസൂയയോ മറ്റുള്ളവരോടുള്ള ദുഷ്ടമനോഭാവമോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അപവാദം’ അല്ലെങ്കിൽ ‘ദൈവദൂഷണം.’ ഗ്രീക്ക് പദത്തിന് മനുഷ്യരെ നിന്ദിക്കുന്ന സംസാരത്തെയും ദൈവത്തെ ദുഷിക്കുന്ന സംസാരത്തെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: വ്യഭിചാരങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും ആവർത്തിച്ചോ വിവിധരീതികളിലോ ഉള്ള വ്യഭിചാരപ്രവൃത്തികളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πλεονεξίαι
  choice: അത്യാഗ്രഹം
  rationale: കൂടുതൽ സ്വന്തമാക്കാനുള്ള പിടിച്ചുപറിക്കുന്ന മോഹം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πονηρίαι
  choice: ദുഷ്ടതകൾ
  rationale: മൂലപാഠത്തിലെ ബഹുവചനം സംരക്ഷിച്ച് ധാർമിക തിന്മയുടെ പല പ്രകടനങ്ങളെയും സൂചിപ്പിക്കുന്നു.
- source_word: δόλος
  choice: വഞ്ചന
  rationale: മനപ്പൂർവമുള്ള ചതിയും കപടതയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἀσέλγεια
  choice: നാണംകെട്ട പെരുമാറ്റം
  rationale: ലൈംഗിക അർഥത്തിൽ മാത്രം ഒതുക്കാതെ, ലജ്ജയില്ലാത്തതും നിയന്ത്രണമില്ലാത്തതുമായ പെരുമാറ്റം എന്ന വിശാല അർഥം നൽകുന്നു.
- source_word: ὀφθαλμὸς πονηρός
  choice: ദുഷ്ടദൃഷ്ടി
  rationale: ‘ദുഷ്ടമായ കണ്ണ്’ എന്ന മൂലരൂപകം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: βλασφημία
  choice: ദൂഷണം
  rationale: മനുഷ്യർക്കെതിരായ അപവാദമോ നിന്ദയോ ദൈവത്തിനെതിരായ ദൈവദൂഷണമോ ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലമായ പദം; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὑπερηφανία
  choice: അഹങ്കാരം
  rationale: സ്വയം ഉയർത്തുന്ന ഗർവത്തെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀφροσύνη
  choice: മൂഢത
  rationale: ബുദ്ധിശക്തിയുടെ കുറവല്ല, ധാർമികവും പ്രായോഗികവുമായ വിവേകശൂന്യതയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
theological_decisions:
- issue: βλασφημία എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ദൂഷണം
  alternative: ദൈവദൂഷണം; അപവാദം
  rationale: ഈ ദോഷപ്പട്ടികയിൽ മറ്റുള്ളവരെ നിന്ദിക്കുന്ന സംസാരത്തെ സൂചിപ്പിക്കാം; അതേസമയം ദൈവത്തിനെതിരായ നിന്ദയും ഗ്രീക്ക് പദത്തിൽ ഉൾപ്പെടാം. അതിനാൽ മുഖ്യപാഠത്തിൽ വിശാലമായ പദം ഉപയോഗിച്ച് ഇരുവശവും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ദോഷപ്പട്ടിക. ഗ്രീക്കിലെ ബഹുവചനങ്ങൾ സാധ്യമായിടത്ത് സംരക്ഷിച്ചു; അപരിചിതമായ പദാനുപദ രൂപങ്ങൾക്ക് പകരം സ്വാഭാവിക പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. രൂപകവും പ്രധാന അർഥദ്വയവും അടിക്കുറിപ്പുകളിലൂടെ തുറന്നുവെച്ചു.
