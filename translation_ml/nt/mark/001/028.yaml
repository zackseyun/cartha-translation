source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: ml
  text: അവനെക്കുറിച്ചുള്ള വാർത്ത ഉടൻതന്നെ ഗലീലയിലെ ചുറ്റുപാടുമുള്ള പ്രദേശമെങ്ങും പരന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെക്കുറിച്ചുള്ള വിവരം’ അല്ലെങ്കിൽ ‘അവന്റെ പ്രശസ്തി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഗലീലയുടെ ചുറ്റുപാടുമുള്ള പ്രദേശം മുഴുവനിലേക്കും എല്ലായിടത്തും.’
    reason: source_syntax
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: പരന്നു
  rationale: വാർത്ത പുറത്തേക്കു വ്യാപിക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിലെ ചലനഭാവം സന്ദർഭാനുസൃതമായി പ്രകടമാക്കുന്നു.
- source_word: ἀκοὴ
  choice: വാർത്ത
  rationale: ഇവിടെ ആളുകൾ യേശുവിനെക്കുറിച്ചു കേട്ട വിവരം/വർത്തമാനം എന്നാണ് അർഥം; ‘പ്രശസ്തി’ എന്നു വിവർത്തനം ചെയ്യുന്നത് പ്രശസ്തിയുടെ ആശയം അധികമായി ചേർക്കും.
- source_word: αὐτοῦ
  choice: അവനെക്കുറിച്ചുള്ള
  rationale: ജനിറ്റീവ് ഇവിടെ ഉടമസ്ഥതയെക്കാൾ വാർത്തയുടെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: εὐθὺς
  choice: ഉടൻതന്നെ
  rationale: മർക്കോസിന്റെ വിവരണത്തിലെ തൽക്ഷണത വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πανταχοῦ
  choice: ഇടങ്ങളിലെല്ലാം
  rationale: ‘എല്ലായിടത്തും’ എന്ന വ്യാപ്തി പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പദസമുച്ചയത്തോടു ചേർത്ത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: περίχωρον
  choice: ചുറ്റുമുള്ളിടങ്ങൾ
  rationale: ചുറ്റുപാടുള്ള പ്രദേശം/ജില്ല എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: ഗലീലപ്രദേശത്തെ ചുറ്റുമുള്ളിടങ്ങളിലെല്ലാം
  rationale: εἰς സൂചിപ്പിക്കുന്ന വ്യാപനത്തിന്റെ ദിശ/ഫലം മലയാളത്തിലെ ‘പരന്നു’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ὅλην എന്ന സമഗ്രവ്യാപ്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀκοὴ αὐτοῦ എന്നതിന്റെ അർഥം
  choice: അവനെക്കുറിച്ചുള്ള വാർത്ത
  alternative: അവന്റെ പ്രശസ്തി
  rationale: യേശുവിനെക്കുറിച്ചു കേട്ട വിവരം വേഗത്തിൽ വ്യാപിച്ചു എന്ന ആഖ്യാനാർത്ഥം നിലനിർത്തുന്നു; ‘പ്രശസ്തി’ എന്നു പറയുമ്പോൾ മൂലപദം നിർബന്ധിക്കാത്ത കീർത്തി/ജനപ്രീതി എന്ന ആശയം ശക്തമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ‘പുറപ്പെട്ടു/പുറത്തേക്കു പോയി’ എന്ന രൂപകത്തെ വാക്കിന് വാക്കായി പകർത്താതെ, വാർത്തയെക്കുറിച്ച് മലയാളത്തിൽ സ്വാഭാവികമായ ‘പരന്നു’ ഉപയോഗിച്ചു. ‘ഗലീലയുടെ ചുറ്റുമുള്ള പ്രദേശം’ എന്ന ഘടന ഗലീലയ്ക്കു പുറത്തുള്ള പ്രദേശമെന്ന തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാമെന്നതിനാൽ ‘ഗലീലപ്രദേശത്തെ ചുറ്റുമുള്ളിടങ്ങൾ’ എന്നു നൽകി; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
