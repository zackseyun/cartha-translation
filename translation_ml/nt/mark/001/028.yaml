- from: അവനെക്കുറിച്ചുള്ള വാർത്ത ഉടൻതന്നെ ഗലീലപ്രദേശത്തെ ചുറ്റുമുള്ളിടങ്ങളിലെല്ലാം പരന്നു.[a][b]
  to: അവനെക്കുറിച്ചുള്ള വാർത്ത ഉടൻതന്നെ ഗലീലയിലെ ചുറ്റുപാടുമുള്ള പ്രദേശമെങ്ങും പരന്നു.[a][b]
