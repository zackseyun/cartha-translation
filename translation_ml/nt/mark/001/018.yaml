    rationale: Since the note supplies an alternative specifically for εὐθύς, placing [a] after «ഉടനെ» makes its anchor unambiguous.
  revised_text: ഉടനെ[a] അവർ വലകൾ വിട്ട് അവനെ അനുഗമിച്ചു.
