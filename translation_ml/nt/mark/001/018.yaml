  text: καὶ ⸀εὐθὺς ἀφέντες τὰ ⸀δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: ml
  text: ഉടനെ[a] അവർ വലകൾ വിട്ട് അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, «തൽക്ഷണം».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -തന്നെ / വാക്യബന്ധത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി
  rationale: ഗ്രീക്കിലെ ലളിതമായ ബന്ധകത്തെ മലയാളത്തിൽ നിർബന്ധമായി ‘എന്നിട്ട്’ എന്നു വേർതിരിക്കുന്നത് അസ്വാഭാവികമാകാം; സംഭവക്രമവും മർക്കോസിന്റെ ദ്രുതഗതിയുള്ള വിവരണവും ‘ഉടനെതന്നെ’ എന്ന തുടക്കത്തിൽ നിലനിൽക്കുന്നു.
- source_word: εὐθὺς
  choice: ഉടനെതന്നെ
  rationale: പ്രവർത്തനത്തിന്റെ തൽക്ഷണതയും മർക്കോസിന്റെ വിവരണത്തിലെ അടിയന്തരതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀφέντες
  choice: ഉപേക്ഷിച്ച്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ മലയാളത്തിലെ ക്രിയാവിശേഷണരൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു. സന്ദർഭത്തിൽ വലകൾ വിട്ടുപോകുക എന്ന അർഥമാണ്; അതിരുകടന്ന വികാരഭാരം ചേർക്കുന്നില്ല.
- source_word: τὰ δίκτυα
  choice: വലകൾ
  rationale: നിശ്ചിത ആർട്ടിക്കിളിന് മലയാളത്തിൽ പ്രത്യേക പദം ആവശ്യമില്ല. ‘അവരുടെ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത ഉടമസ്ഥസൂചന ചേർത്തിട്ടില്ല.
- source_word: ἠκολούθησαν
  choice: അനുഗമിച്ചു
  rationale: ശാരീരികമായി പിന്നാലെ പോകുന്നതും ഉയർന്നുവരുന്ന ശിഷ്യത്വസൂചനയും ഒരുപോലെ നിലനിർത്തുന്ന, മാന്യവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: αὐτῷ
  choice: അവനെ
  rationale: മൂലത്തിലെ സർവനാമം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും പേര് പകരം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ἠκολούθησαν എന്നതിലെ ശിഷ്യത്വസൂചന
  choice: ‘അവനെ അനുഗമിച്ചു’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘അവന്റെ ശിഷ്യന്മാരായി’ / ‘അവനോടൊപ്പം പോയി’
  rationale: മൂലക്രിയയിലെ നേരിട്ടുള്ള പിന്തുടരലും ശിഷ്യത്വത്തിന്റെ വളർന്നുവരുന്ന അർഥവും നിലനിർത്തുന്നു; വ്യാഖ്യാനം വിപുലീകരിച്ച് മൂലവാചകത്തിനപ്പുറം പോകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ ലാളിത്യവും പ്രവർത്തനത്തിന്റെ ദ്രുതതയും സംരക്ഷിച്ചിരിക്കുന്നു.
