  naturalness: «ഉടനെതന്നെ» is understandable, but «ഉടനെ» is cleaner modern standard Malayalam and fully expresses the promptness of εὐθύς. «വലകൾ വിട്ട്» is more idiomatic here than «വലകൾ ഉപേക്ഷിച്ച്».
  terminology: «അനുഗമിച്ചു» is an appropriate formal-modern rendering of ἠκολούθησαν, retaining both the literal and emerging discipleship sense without expansion. The pronoun «അവനെ» correctly preserves αὐτῷ rather than supplying Jesus’ name.
