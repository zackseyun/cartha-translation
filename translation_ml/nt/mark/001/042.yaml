  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: ml
  text: ഉടനെ കുഷ്ഠം അവനെ വിട്ടുമാറി; അവൻ ശുദ്ധനായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശുദ്ധീകരിക്കപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ ശാരീരിക രോഗമുക്തിയോടൊപ്പം ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധിയും സൂചിപ്പിക്കുന്നു. ‘കുഷ്ഠം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്കുപദം ആധുനിക ഹാൻസൻസ് രോഗം മാത്രമല്ല, വിവിധ ത്വക്കുരോഗങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ വിവരണത്തിൽ പതിവായി കാണുന്ന തൽക്ഷണതയും വേഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: അവനെ വിട്ടുമാറി
  rationale: ‘അവനിൽനിന്ന് പോയി’ എന്ന അടിസ്ഥാനാർഥം മലയാളത്തിലെ രോഗസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἡ λέπρα
  choice: കുഷ്ഠം
  rationale: ബൈബിൾപരിഭാഷകളിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദം. എന്നാൽ ഗ്രീക്കുപദം ആധുനിക ഹാൻസൻസ് രോഗത്തിൽ മാത്രം ഒതുങ്ങണമെന്നില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκαθαρίσθη
  choice: അവൻ ശുദ്ധനായി
  rationale: രോഗമുക്തിയോടൊപ്പം ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണവും സൂചിപ്പിക്കുന്ന καθαρίζω എന്ന ക്രിയയുടെ ദ്വയാർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐκαθαρίσθη എന്നതിലെ ശാരീരിക രോഗമുക്തിയും ആചാരപരമായ ശുദ്ധിയും തമ്മിലുള്ള ബന്ധം
  choice: ‘അവൻ ശുദ്ധനായി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവൻ സുഖപ്പെട്ടു’ / ‘അവൻ ശുദ്ധീകരിക്കപ്പെട്ടു’
  rationale: ‘സുഖപ്പെട്ടു’ എന്നത് ആചാരപരമായ മാനം നഷ്ടപ്പെടുത്തും; ‘ശുദ്ധീകരിക്കപ്പെട്ടു’ എന്നത് മലയാളത്തിൽ ഇവിടെ അനാവശ്യമായി യാന്ത്രികമാണ്. ‘ശുദ്ധനായി’ എന്നത് ഇരുവശവും സ്വാഭാവികമായി തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തിച്ച καί മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ അർദ്ധവിരാമം ഉപയോഗിച്ചു; സംഭവങ്ങളുടെ ഉടനടിയുള്ള തുടർച്ച നിലനിർത്തി.
