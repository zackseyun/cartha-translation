  yaml_path: translation/nt/mark/001/043.yaml
  text: And after sternly warning him[a], he immediately sent him away[b],
translation:
  language: ml
  text: അവനോടു കർശനമായി മുന്നറിയിപ്പ് നൽകിയശേഷം[a], യേശു ഉടൻതന്നെ അവനെ പറഞ്ഞയച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനോടു കർശനമായി കൽപിച്ചശേഷം’; ഗ്രീക്ക് ക്രിയയ്ക്ക് ശക്തമായ അമർഷമോ കടുത്ത ശാസനയോ പ്രകടിപ്പിക്കുന്ന ഭാവവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവനെ പുറത്താക്കി’ / ‘തള്ളിപ്പുറത്താക്കി’; ഗ്രീക്ക് ക്രിയ നിഷ്പക്ഷമായ ‘പറഞ്ഞയച്ചു’ എന്നതിനേക്കാൾ ശക്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβριμησάμενος
  choice: കർശനമായി താക്കീതുചെയ്തശേഷം
  rationale: ഈ കൃുദന്തം ശക്തമായ വികാരത്തോടെയുള്ള കർശനമായ നിർദേശം, താക്കീത്, അല്ലെങ്കിൽ ശാസന എന്നിവ സൂചിപ്പിക്കാം. തുടർന്നുവരുന്ന കല്പനയുടെ പശ്ചാത്തലത്തിൽ, വ്യക്തിയോടുള്ള കുറ്റാരോപണം അനാവശ്യമായി സൂചിപ്പിക്കാതെ അതിന്റെ തീവ്രതയും നിർദേശാത്മക സ്വഭാവവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവനെ
  rationale: സൗഖ്യം ലഭിച്ച മനുഷ്യനെയാണ് ദത്തിവ് സർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘താക്കീതുചെയ്യുക’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായി കർമരൂപത്തിൽ നൽകി.
- source_word: εὐθύς
  choice: ഉടൻതന്നെ
  rationale: മർക്കോസിന്റെ ദ്രുതഗതിയുള്ള ആഖ്യാനശൈലിയും പ്രവൃത്തിയുടെ തൽക്ഷണതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐξέβαλεν
  choice: പറഞ്ഞയച്ചു
  rationale: ἐκβάλλω സാധാരണയായി ‘പുറത്താക്കുക’ അല്ലെങ്കിൽ ‘തള്ളിപ്പുറത്താക്കുക’ എന്ന ശക്തമായ അർഥം വഹിക്കുന്നു. ഇവിടെ ഭൂതത്തെയല്ല, സൗഖ്യം ലഭിച്ച മനുഷ്യനെയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ സന്ദർഭത്തിന് ചേരുന്ന ‘പറഞ്ഞയച്ചു’ മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുകയും മൂലക്രിയയുടെ കൂടുതൽ ശക്തമായ ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്തു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: അതേ മനുഷ്യനെ സൂചിപ്പിക്കുന്ന അക്കുസറ്റീവ് സർവനാമം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: καὶ
  choice: —
  rationale: ഗ്രീക്കിലെ ലളിതമായ ആഖ്യാനബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; പ്രത്യേകമായി ‘പിന്നെ’ ചേർത്ത് കാലക്രമാർഥം വർധിപ്പിച്ചില്ല.
theological_decisions:
- issue: സൗഖ്യം ലഭിച്ച മനുഷ്യനോടുള്ള യേശുവിന്റെ വാക്കിന്റെയും പ്രവൃത്തിയുടെയും സ്വരം
  choice: യേശു വളരെ കർശനമായി താക്കീതുചെയ്ത് അവനെ ഉടൻ പറഞ്ഞയച്ചു എന്ന ശക്തമായ സ്വരം നിലനിർത്തി.
  alternative: വികാരതീവ്രത കുറഞ്ഞ ഒരു ഉറച്ച നിർദേശം മാത്രമായി വിവർത്തനം ചെയ്യുക; അല്ലെങ്കിൽ ആ മനുഷ്യനെ വ്യക്തിപരമായി ശാസിച്ചതായി വ്യക്തമാക്കുക.
  rationale: ἐμβριμησάμενος, ἐξέβαλεν എന്നീ രണ്ടു പദങ്ങൾക്കും അസാധാരണമായ ശക്തിയുണ്ട്. എന്നാൽ യേശു പാപകരമായ കോപത്തോടെ പെരുമാറിയെന്നോ ആ മനുഷ്യനെ കുറ്റംവിധിച്ചെന്നോ പാഠം സ്വയം പറയുന്നില്ല. അതിനാൽ ശക്തിയും നിലനിൽക്കുന്ന അർഥസന്ദിഗ്ധതയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കർശനമായി താക്കീതുചെയ്തശേഷം’ എന്നത് മൂലപദത്തിന്റെ വികാരതീവ്രതയും നിർദേശാത്മകതയും ഒരുമിച്ച് നൽകുന്നു. ആവർത്തിക്കുന്ന ‘അവനെ’ മലയാളത്തിൽ അല്പം ഭാരമുള്ളതായാലും, ഗ്രീക്കിലെ രണ്ടു വ്യത്യസ്ത സർവനാമബന്ധങ്ങളും പ്രവർത്തനങ്ങളുടെ ലക്ഷ്യവും വ്യക്തമായി നിലനിർത്താൻ ഉപയോഗിച്ചു.
