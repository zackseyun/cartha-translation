  rationale: The revision makes the warning/charge sense primary, explicitly reflects the Greek dative relationship in natural Malayalam, and corrects the verbal orthography. It retains ‘പറഞ്ഞയച്ചു’ as the contextual main-text rendering of ἐξέβαλεν and preserves the stronger lexical alternatives in the anchored footnote.
