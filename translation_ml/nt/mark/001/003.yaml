source:
  edition: SBLGNT
  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: ml
  text: '“മരുഭൂമിയിൽ വിളിച്ചുപറയുന്ന ഒരാളുടെ ശബ്ദം: ‘കർത്താവിന്റെ വഴി ഒരുക്കുവിൻ[b][a]; അവന്റെ പാതകൾ നേരെയാക്കുവിൻ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'യെശയ്യാ ഉദ്ധരണിക്ക് മറ്റൊരു വിധത്തിൽ വിരാമചിഹ്നം നൽകിയാൽ: “വിളിച്ചുപറയുന്ന ഒരാളുടെ ശബ്ദം: ‘മരുഭൂമിയിൽ കർത്താവിന്റെ വഴി ഒരുക്കുവിൻ …’”'
    reason: alternative_reading
  - marker: b
    text: ‘കർത്താവ്’ എന്നത് ഗ്രീക്കിലെ kyriou എന്ന പദത്തിന്റെ പരിഭാഷയാണ്; ഈ ഉദ്ധരണി യെശയ്യാ 40:3-നെ പ്രതിധ്വനിപ്പിക്കുന്നു. അവിടത്തെ എബ്രായപാഠത്തിൽ ഇത് യഹ്‌വേ (YHWH)യെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: ശബ്ദം
  rationale: ഇവിടെ φωνή ഉച്ചരിക്കപ്പെടുന്ന മനുഷ്യശബ്ദത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ശബ്ദം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: βοῶντος
  choice: വിളിച്ചുപറയുന്ന ഒരാളുടെ
  rationale: ജനങ്ങളെ അഭിസംബോധന ചെയ്യുന്ന ശക്തമായ പ്രഖ്യാപനത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; ജനിറ്റീവ് കൃദന്തരൂപം φωνήയോടു ബന്ധപ്പെടുന്നതും വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: ἔρημος ജനവാസമില്ലാത്ത വരണ്ട പ്രദേശത്തെയും വിജനപ്രദേശത്തെയും സൂചിപ്പിക്കാം; യോഹന്നാന്റെ മാർക്കൊസിലെ പശ്ചാത്തലത്തോടും യെശയ്യാ ഉദ്ധരണിയോടും ‘മരുഭൂമി’ യോജിക്കുന്നു.
- source_word: Ἑτοιμάσατε
  choice: ഒരുക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്ന, dignified ആയ മലയാളപ്രയോഗം.
- source_word: τὴν ὁδὸν
  choice: വഴി
  rationale: യാത്രാമാർഗം എന്ന ദൃശ്യാർഥവും പ്രവാചകീയ രൂപകാർഥവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: ഗ്രീക്ക് ജനിറ്റീവിനെ ഔപചാരികമായി പ്രതിഫലിപ്പിക്കുകയും κύριος എന്ന പദത്തെ പതിവായ മലയാള ബൈബിൾ ശൈലിയിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: εὐθείας
  choice: നേരെ
  rationale: ഇവിടെ ധാർമ്മികമായ ‘നേരുള്ള’ എന്നതല്ല, പാതകൾ വളവില്ലാത്തതാക്കുക എന്ന ഭൗതിക-രൂപക ദൃശ്യമാണ്.
- source_word: ποιεῖτε
  choice: ആക്കുവിൻ
  rationale: εὐθείας എന്ന പൂരകത്തോടൊപ്പം ‘നേരെയാക്കുവിൻ’ എന്ന സ്വാഭാവിക സംയുക്തപ്രയോഗം രൂപപ്പെടുന്നു; ആജ്ഞാഭാവം നിലനിൽക്കുന്നു.
- source_word: τὰς τρίβους αὐτοῦ
  choice: അവന്റെ പാതകൾ
  rationale: τρίβος എന്നതിന്റെ ബഹുവചന പാതദൃശ്യം നിലനിർത്തുകയും αὐτοῦ വ്യക്തമായി പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യെശയ്യാ ഉദ്ധരണിയിലെ κύριος എബ്രായമൂലത്തിൽ YHWHയെ സൂചിപ്പിക്കുന്നത്
  choice: കർത്താവ്
  alternative: യഹോവ / സർവേശ്വരൻ എന്ന ദൈവനാമസൂചക വിവർത്തനം
  rationale: പ്രധാനപാഠം ഗ്രീക്ക് κύριος എന്ന പദത്തെ ‘കർത്താവ്’ എന്നു നൽകുന്നു. യെശയ്യാ 40:3-ലെ എബ്രായപാഠത്തിൽ ഇത് YHWHയെ സൂചിപ്പിക്കുന്നുവെന്ന പശ്ചാത്തലം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; അതുവഴി മാർക്കൊസിന്റെ ഗ്രീക്ക് രൂപത്തിലേക്ക് വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനി സംരക്ഷിക്കുന്നു.
- issue: ‘മരുഭൂമിയിൽ’ എന്ന പ്രയോഗത്തിന്റെ വാക്യബന്ധം
  choice: ‘വിളിച്ചുപറയുന്ന ഒരാൾ’ എന്നതിനോട് ബന്ധിപ്പിച്ചു
  alternative: ‘മരുഭൂമിയിൽ കർത്താവിന്റെ വഴി ഒരുക്കുവിൻ’
  rationale: മാർക്കൊസിലെ ഗ്രീക്ക് പദക്രമവും ഉടൻ ലഭിക്കുന്ന വാക്യഘടനയും ‘മരുഭൂമിയിൽ വിളിച്ചുപറയുന്ന’ എന്ന വായനയെ സ്വാഭാവികമാക്കുന്നു. എന്നാൽ യെശയ്യാ ഉദ്ധരണിയുടെ മറ്റൊരു വിരാമചിഹ്നക്രമം സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. ബഹുവചന ആജ്ഞകൾക്കായി ‘-വിൻ’ രൂപം ഉപയോഗിച്ചു; അത് ഔപചാരികത നിലനിർത്തുമ്പോഴും അത്യന്തം പ്രാചീനമല്ല. പ്രധാനപാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ലഭിച്ച ക്രമമായ [b][a] എന്നതിൽ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
