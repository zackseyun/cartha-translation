language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: ml
  text: 'യേശു അവരോട് പറഞ്ഞു: “എന്നെ അനുഗമിക്കൂ; ഞാൻ നിങ്ങളെ മനുഷ്യരെ പിടിക്കുന്ന മീൻപിടിത്തക്കാരാക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: എന്നെ അനുഗമിക്കൂ
  rationale: അക്ഷരാർഥത്തിലെ ‘എന്റെ പിന്നാലെ വരൂ’ എന്നത് ശിഷ്യത്വത്തിലേക്കുള്ള ആഹ്വാനമാണെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: ഞാൻ നിങ്ങളെ … ആക്കും
  rationale: ‘നിങ്ങൾ ആയിത്തീരാൻ ഞാൻ ഇടയാക്കും’ എന്ന ഗ്രീക്ക് ഘടനയുടെ കാരണകർത്തൃഭാവം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: മനുഷ്യരെ പിടിക്കുന്ന മീൻപിടിത്തക്കാർ
  rationale: മീൻപിടിത്തത്തിന്റെ രൂപകം നിലനിർത്തുകയും ἀνθρώπων എന്നത് മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിനെ പിന്തുടരുന്നതും അവൻ ശിഷ്യരെ രൂപപ്പെടുത്തുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: “എന്നെ അനുഗമിക്കൂ; ഞാൻ നിങ്ങളെ … ആക്കും”
  alternative: “എന്റെ പിന്നാലെ വരൂ; നിങ്ങൾ … ആയിത്തീരും”
  rationale: വാക്യത്തിലെ ആജ്ഞയും യേശുവിന്റെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ഒന്നാംപുരുഷ വാഗ്ദാനവും വേർതിരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ἀνθρώπων എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മനുഷ്യരെ
  alternative: പുരുഷന്മാരെ
  rationale: ഇവിടെ ഗ്രീക്ക് പദം ലിംഗഭേദമില്ലാതെ മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ അനാവശ്യമായ പുരുഷലിംഗപരിമിതി ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മീൻപിടിത്തരൂപകം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
