  source_fidelity: ഗ്രീക്ക് വാക്യത്തിലെ ആഹ്വാനം (Δεῦτε ὀπίσω μου), യേശുവിന്റെ ഭാവികാല വാഗ്ദാനം (ποιήσω), അതിന്റെ ഫലമായ ‘മനുഷ്യരുടെ മീൻപിടിത്തക്കാർ’ എന്ന രൂപകം (ἁλιεῖς ἀνθρώπων) എന്നിവ കൃത്യമായി നിലനിൽക്കുന്നു. ‘എന്നെ അനുഗമിക്കൂ’ ശിഷ്യത്വസന്ദർഭത്തിൽ സ്വാഭാവികവും അർഥവിശ്വസ്തവുമായ പ്രയോഗമാണ്. ἀνθρώπων-ന്റെ പൊതുമനുഷ്യസൂചനയെ ‘മനുഷ്യരെ’ എന്നു നൽകിയിരിക്കുന്നത് മൂലപാഠത്തോട് യോജിക്കുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വ്യക്തവും വായനാസൗകര്യമുള്ളതുമാണ്. ‘മനുഷ്യരെ പിടിക്കുന്ന മീൻപിടിത്തക്കാർ’ എന്ന പ്രയോഗം രൂപകത്തിന്റെ മനപ്പൂർവമായ അസാധാരണത നിലനിർത്തുന്നു; ഇത് വചനത്തിന്റെ ഉദ്ദേശ്യമായ മീൻപിടിത്ത-രൂപകത്തെ മങ്ങിക്കുന്നില്ല.
