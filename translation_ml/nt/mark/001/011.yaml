    rationale: The Greek begins with καί (‘and’), not a temporal adverb. “അപ്പോൾ” can imply a sequence or temporal nuance beyond the source and should be omitted.
  - severity: low
    issue: The plural ‘heavens’ alternative is not footnoted.
    rationale: The audit trail identifies singular ‘from heaven’ as a viable idiomatic alternative. A distinct anchor after “ആകാശങ്ങളിൽനിന്ന്” makes this lexical decision transparent.
  - severity: low
