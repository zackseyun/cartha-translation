source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: ml
  text: 'ആകാശങ്ങളിൽനിന്ന്[a] ഒരു ശബ്ദം വന്നു: “നീ എന്റെ പ്രിയ പുത്രൻ; നിന്നിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആകാശത്തുനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ ബഹുവചനം, “ആകാശങ്ങളിൽനിന്ന്,” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “നിന്നിൽ ഞാൻ പ്രസാദിച്ചു,” “നിന്നിൽ ഞാൻ ആനന്ദം കണ്ടെത്തി,” അല്ലെങ്കിൽ “നിന്നോട് എനിക്ക് പ്രസാദമുണ്ട്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: ഒരു ശബ്ദം ഉണ്ടായി
  rationale: ἐγένετο എന്ന സംഭവസൂചക പ്രയോഗത്തിന്റെ ആഖ്യാനബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν οὐρανῶν
  choice: ആകാശങ്ങളിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; മലയാളത്തിലും ഈ രൂപം ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: Σὺ εἶ
  choice: നീ ... ആകുന്നു എന്ന അർഥത്തിൽ ‘നീ എന്റെ ... പുത്രൻ’
  rationale: പ്രകടമായ Σὺ എന്ന സർവനാമത്തിന്റെ നേരിട്ടുള്ള അഭിസംബോധന ‘നീ’ കൊണ്ട് നിലനിർത്തുന്നു; മലയാളത്തിലെ നാമവാക്യത്തിൽ ‘ആകുന്നു’ ഒഴിവാക്കുന്നത് കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: എന്റെ പ്രിയപുത്രൻ
  rationale: പുത്രബന്ധവും സ്നേഹത്തിന്റെ വിശേഷണവും സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν σοὶ
  choice: നിന്നിൽ
  rationale: ἐν എന്നതിന്റെ ഏറ്റവും നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും ഗ്രീക്കിലെ രൂപകാത്മക പ്രയോഗം അനാവശ്യമായി ‘നിന്നോടു’ എന്നു മിനുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εὐδόκησα
  choice: ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു
  rationale: അഓറിസ്റ്റിന്റെ പൂർത്തീകരണഭാവത്തോടൊപ്പം ഇപ്പോഴുള്ള ദൈവിക അംഗീകാരവും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; കാലസൂചനയിലെ സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള ദൈവിക പ്രഖ്യാപനത്തിലെ പുത്രത്വവും സ്നേഹവും എങ്ങനെ നിലനിർത്തണം
  choice: നീ എന്റെ പ്രിയപുത്രൻ
  alternative: നീ എന്റെ പുത്രൻ, പ്രിയനായവൻ
  rationale: പുത്രത്വവും ദൈവിക സ്നേഹവും ഒരുപോലെ നിലനിർത്തുന്നു; വാക്യത്തിൽ ഇല്ലാത്ത പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രപദങ്ങൾ ചേർക്കുന്നില്ല.
- issue: οὐρανῶν എന്ന ബഹുവചനത്തെ ഏകവചനമാക്കി മിനുക്കണമോ
  choice: ആകാശങ്ങളിൽനിന്ന്
  alternative: ആകാശത്തുനിന്ന് / സ്വർഗത്തിൽനിന്ന്
  rationale: മൂലഭാഷയിലെ ബഹുവചനം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതിനാൽ അതുതന്നെ സംരക്ഷിക്കുന്നു.
- issue: εὐδόκησα എന്ന അഓറിസ്റ്റിന്റെ കാലവും ഭാവവും
  choice: ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു
  alternative: ഞാൻ പ്രസാദിച്ചു / എനിക്ക് നിന്നിൽ പ്രസാദമുണ്ട്
  rationale: പൂർത്തിയായ പ്രവൃത്തിയും തുടരുന്ന അംഗീകാരവും ഒരുമിച്ച് സൂചിപ്പിക്കാവുന്ന മലയാളരൂപം തിരഞ്ഞെടുത്തു; യഥാർഥ കാലഭാവത്തിലെ വലിച്ചിഴച്ചിൽ അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ദൈവിക പ്രഖ്യാപനശൈലി. ‘ആകാശങ്ങളിൽനിന്ന്’ എന്ന ബഹുവചനം മൂലപാഠത്തോടുള്ള അടുപ്പം കാത്തുസൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട അവസാന വാക്യത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
