review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders Jesus’ authoritative rebuke, addresses the unclean spirit as masculine singular, and distinguishes it from the man by retaining “out of him.” The commands accurately convey Φιμώθητι and ἔξελθε.
  naturalness: “മിണ്ടാതിരിക്കുക!” is understandable but has a comparatively formal/polite imperative form in contemporary Malayalam. “മിണ്ടരുത്!” is a more direct, idiomatic, and forceful command in this context. The revised footnote more explicitly preserves the literal ‘muzzle’ image.
  terminology: “ശാസിച്ചു,” “അവനെ,” and “അവനിൽനിന്ന് പുറത്തുവരിക” are appropriate modern-standard Malayalam choices. No theological terminology needs adjustment.
  issues:
  - severity: low
    issue: The imperative “മിണ്ടാതിരിക്കുക!” is less forceful in register than the Greek command.
    rationale: Φιμώθητι is an abrupt, stern command to be silent. “മിണ്ടരുത്!” is more idiomatic and direct without adding interpretation.
  - severity: low
    issue: The footnote’s “വായ്മൂടപ്പെടുക” does not as clearly retain the lexical image of being muzzled.
    rationale: φιμόω specifically evokes putting on a muzzle. “വായ്ക്ക് കടിഞ്ഞാണിടപ്പെടുക” better signals that image while remaining explicitly a literal alternative.
  revised_text: 'യേശു അവനെ ശാസിച്ചുകൊണ്ട് പറഞ്ഞു: “മിണ്ടരുത്![a] അവനിൽനിന്ന് പുറത്തുവരിക!”'
