  to: 'യേശു അവനെ ശാസിച്ചുകൊണ്ട് പറഞ്ഞു: “മിണ്ടരുത്![a] അവനിൽനിന്ന് പുറത്തുവരിക!”'
  rationale: The revision strengthens the first command’s natural Malayalam force and refines the lexical footnote to preserve the ‘muzzle’ imagery of φιμόω. It retains the draft’s accurate treatment of the spirit as the one addressed and the man as the one from whom it must come out.
