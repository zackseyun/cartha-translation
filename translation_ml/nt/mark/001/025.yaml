  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: ml
  text: 'യേശു അവനെ ശാസിച്ചുകൊണ്ട് പറഞ്ഞു: “മിണ്ടരുത്![a] അവനിൽനിന്ന് പുറത്തുവരിക!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “വായ്ക്ക് കടിഞ്ഞാണിടപ്പെടുക!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: ശാസിച്ചു
  rationale: അധികാരത്തോടെയുള്ള കഠിനമായ വിലക്കും ശാസനയും സൂചിപ്പിക്കുന്ന ἐπιτιμάω എന്ന ക്രിയയുടെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവനെ
  rationale: പുരുഷലിംഗ ഏകവചന സർവനാമം മുൻസന്ദർഭത്തിലെ അശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്ന് വരുന്ന ‘അവനിൽനിന്ന് പുറത്തുവരിക’ എന്ന കല്പന ആത്മാവിനെയും മനുഷ്യനെയും വേർതിരിക്കുന്നു.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ വർത്തമാന കൃതന്തം ശാസനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; ‘ശാസിച്ചുകൊണ്ട് പറഞ്ഞു’ എന്ന പ്രയോഗം ആ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Φιμώθητι
  choice: മിണ്ടാതിരിക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘വായ്ക്കു കടിഞ്ഞാണിടപ്പെടുക/വായ്മൂടപ്പെടുക’ എന്ന ദൃശ്യഭാവമുണ്ടെങ്കിലും, ഇവിടെ ശക്തമായി നിശ്ശബ്ദനാകാൻ കല്പിക്കുന്ന പ്രയോഗമാണ്; മുഖ്യവാചകത്തിൽ വ്യക്തവും കർക്കശവുമായ മലയാളം തെരഞ്ഞെടുത്തു.
- source_word: ἔξελθε
  choice: പുറത്തുവരിക
  rationale: ബാധിതനായ മനുഷ്യന്റെ ഉള്ളിൽനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കല്പനയാണ്.
- source_word: ἐξ αὐτοῦ
  choice: അവനിൽനിന്ന്
  rationale: ἐξ ഉള്ളിൽനിന്നുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവനിൽനിന്ന് പുറത്തുവരിക’ ഇത് വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ശാസന ആരോടാണ്
  choice: യേശു അശുദ്ധാത്മാവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നു.
  alternative: ഉടൻ കാണുന്ന വ്യാകരണപരമായ സൂചിതൻ ബാധിതനായ മനുഷ്യനാണെന്ന് വായിക്കുക.
  rationale: മുൻസന്ദർഭം മനുഷ്യനിൽ അശുദ്ധാത്മാവുണ്ടെന്ന് വ്യക്തമാക്കുന്നു; ‘അവനിൽനിന്ന് പുറത്തുവരിക’ എന്ന കല്പന അഭിസംബോധിതനായ ആത്മാവിനെയും ബാധിതനായ മനുഷ്യനെയും വേർതിരിക്കുന്നു. ഇതിന് അപ്പുറമുള്ള സിദ്ധാന്തപരമായ വിശദീകരണം വാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കല്പനകളുടെ പെട്ടെന്നുള്ള അധികാരഭാവം നിലനിർത്തി; അക്ഷരാർഥത്തിലെ ‘മസിൽ ഇടുക’ എന്ന മൃഗസംബന്ധിയായ ദൃശ്യഭാവം അസ്വാഭാവികമായി മുഖ്യവാചകത്തിൽ കൊണ്ടുവരാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
