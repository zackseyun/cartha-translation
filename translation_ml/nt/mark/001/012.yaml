  text: Καὶ εὐθὺς τὸ πνεῦμα αὐτὸν ἐκβάλλει εἰς τὴν ἔρημον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: ml
  text: ഉടനെ ആത്മാവ് അവനെ മരുഭൂമിയിലേക്കു തള്ളിവിടുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തള്ളിപ്പുറത്താക്കുന്നു’ എന്നോ ‘പുറത്തേക്ക് അയയ്ക്കുന്നു’ എന്നോ വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ ക്രിയ ശക്തമായതാണ്; ഭൂതങ്ങളെ പുറത്താക്കുന്നതിനെക്കുറിച്ച് മർക്കോസ് ഇതേ ക്രിയ പതിവായി ഉപയോഗിക്കുന്നതു താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: ഉടനെ എന്നതോടൊപ്പം സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹത്തിൽ ഉൾപ്പെടുത്തി
  rationale: വാക്യാരംഭത്തിലെ ലളിതമായ ബന്ധകമാണ്. മലയാളത്തിൽ ‘ഉടനെ’കൊണ്ട് വാക്യം തുടങ്ങുന്നത് മുൻസംഭവത്തോടുള്ള തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേകം ‘അപ്പോൾ’ ചേർത്തില്ല.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ ദ്രുതമായ ആഖ്യാനചലനവും സംഭവത്തിന്റെ അടിയന്തരതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: മുമ്പത്തെ സന്ദർഭത്തിൽ പരാമർശിച്ച ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിൽ ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ അത് ഇവിടെ ചേർത്തില്ല.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: നേരിട്ടുള്ള കർമസർവനാമം; സന്ദർഭത്തിൽ യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐκβάλλει
  choice: തള്ളിവിടുന്നു
  rationale: ‘പുറത്താക്കുക/തള്ളിപ്പുറത്താക്കുക’ എന്ന ശക്തമായ ക്രിയയുടെ ബലം നിലനിർത്തുന്നു; ‘നയിക്കുന്നു’ എന്ന മൃദുവായ പ്രയോഗം ഒഴിവാക്കുന്നു. ലക്ഷ്യസ്ഥാനം ‘മരുഭൂമിയിലേക്ക്’ എന്നു മുമ്പേ വരുന്നതിനാൽ മലയാളത്തിൽ ‘തള്ളിവിടുന്നു’ സ്വാഭാവികമാണ്.
- source_word: εἰς τὴν ἔρημον
  choice: മരുഭൂമിയിലേക്ക്
  rationale: ജനവാസമില്ലാത്ത വിജനപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പതിവും മനസ്സിലാക്കാൻ എളുപ്പവുമായ മലയാളപ്രയോഗം; മണൽനിറഞ്ഞ പ്രദേശം മാത്രം എന്ന അർഥത്തിലേക്ക് നിർബന്ധമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിനോടുള്ള ആത്മാവിന്റെ പ്രവർത്തനത്തിന്റെ ശക്തി
  choice: ‘തള്ളിവിടുന്നു’ എന്ന ശക്തമായ പ്രയോഗം
  alternative: ‘നയിക്കുന്നു’ അല്ലെങ്കിൽ ‘അയയ്ക്കുന്നു’
  rationale: ἐκβάλλει എന്ന ക്രിയയുടെ ശ്രദ്ധേയമായ ശക്തി സംരക്ഷിക്കുന്നു. യേശുവിന്റെ മരുഭൂമിയിലെ പരീക്ഷണം ദൈവിക മുൻകൈയെ തുടർന്നാണെന്ന വാചകത്തിലെ സംഘർഷം മറ്റു സുവിശേഷങ്ങളോടു പൊരുത്തപ്പെടുത്താൻ മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ വർത്തമാനകാല ആഖ്യാനരൂപം ‘തള്ളിവിടുന്നു’ എന്നു നിലനിർത്തി; ശക്തമായ ക്രിയയുടെ ഭാവം അടിക്കുറിപ്പിലൂടെ കൂടുതൽ വ്യക്തമാക്കി.
