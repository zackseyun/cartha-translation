  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: ml
  text: സ്നാപകനായ യോഹന്നാൻ മരുഭൂമിയിൽ പാപങ്ങളുടെ മോചനത്തിനായുള്ള മാനസാന്തരസ്നാനം പ്രഖ്യാപിച്ചുകൊണ്ട് പ്രത്യക്ഷനായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “സ്നാനം കഴിപ്പിക്കുന്ന യോഹന്നാൻ മരുഭൂമിയിൽ പ്രത്യക്ഷനായി; …” ഗ്രീക്കിലെ കർത്തൃവാചക കൃദ്ദന്തം യോഹന്നാന്റെ പ്രവർത്തനമായി കൂടുതൽ വ്യക്തമാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: പ്രത്യക്ഷനായി
  rationale: മർക്കോസിന്റെ ആഖ്യാനത്തിൽ ഒരു വ്യക്തി രംഗത്തെത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; അക്ഷരാർഥമായ ‘ഉണ്ടായി’ എന്നതിനെക്കാൾ സ്വാഭാവികം.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: സ്നാപകനായ യോഹന്നാൻ
  rationale: ὁ βαπτίζων യോഹന്നാനെ സ്നാനം കഴിപ്പിക്കുന്ന വ്യക്തിയായി തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിലെ സുപരിചിതമായ ബൈബിൾ ശീർഷകം സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: ἔρημος എന്നത് ജനവാസമില്ലാത്ത വനപ്രദേശത്തെയും വരണ്ട മരുപ്രദേശത്തെയും സൂചിപ്പിക്കാം; ‘മരുഭൂമി’ മലയാളത്തിൽ സന്ദർഭോചിതവും ബൈബിൾഭാഷയിൽ പരിചിതവുമാണ്.
- source_word: κηρύσσων
  choice: പ്രസംഗിച്ചു
  rationale: പരസ്യമായി വിളംബരം ചെയ്യുക എന്ന κηρύσσωയുടെ ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: βάπτισμα μετανοίας
  choice: മാനസാന്തരസ്നാനം
  rationale: മാനസാന്തരത്താൽ സവിശേഷമാകുന്ന സ്നാനം എന്ന ജനിറ്റീവ് ബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: പാപമോചനത്തിനായുള്ള
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യ/ഫലബന്ധം നിലനിർത്തുന്നു; സ്നാനത്തിന്റെ കൃത്യമായ ദൈവശാസ്ത്രപര പ്രവർത്തനം നിർവചിക്കുന്നില്ല. ഗ്രീക്കിലെ ബഹുവചനമായ ‘പാപങ്ങൾ’ മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തപ്രയോഗമായ ‘പാപമോചനം’ എന്നതിൽ പൊതുവായി ഉൾപ്പെടുന്നു.
theological_decisions:
- issue: സ്നാനം, മാനസാന്തരം, പാപമോചനം എന്നിവ തമ്മിലുള്ള ബന്ധം
  choice: ‘പാപമോചനത്തിനായുള്ള മാനസാന്തരസ്നാനം’ എന്ന ഉറവിടത്തിലെ ബന്ധം നിർവചിക്കാതെ നിലനിർത്തി.
  alternative: ‘പാപമോചനം ലഭിക്കേണ്ടതിന് മാനസാന്തരത്തിന്റെ അടയാളമായ സ്നാനം’ അല്ലെങ്കിൽ ‘പാപമോചനം വരുത്തുന്ന സ്നാനം’
  rationale: ഗ്രീക്ക് വാക്യം ഇവ തമ്മിൽ ബന്ധം സ്ഥാപിക്കുന്നുവെങ്കിലും സ്നാനം ഉപാധിയോ അടയാളമോ പ്രഖ്യാപനമോ ആണെന്ന് നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സ്നാപകൻ’, ‘മാനസാന്തരം’, ‘പാപമോചനം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; വാക്യഘടന മലയാളത്തിന് സ്വാഭാവികമാക്കി.
