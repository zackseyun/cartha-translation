- from: അവൻ ഗലീലക്കടലിന്റെ തീരത്തുകൂടെ നടന്നുപോകുമ്പോൾ, ശിമോനും ശിമോന്റെ സഹോദരനായ അന്ത്രയോസും കടലിൽ വല വീശുന്നത് കണ്ടു; അവർ മീൻപിടിത്തക്കാരായിരുന്നു.
  to: അവൻ ഗലീലക്കടലിന്റെ തീരത്തുകൂടെ നടന്നുപോകുമ്പോൾ, ശിമോനെയും ശിമോന്റെ സഹോദരനായ അന്ത്രയോസിനെയും കടലിൽ വല വീശുന്നതായി കണ്ടു; കാരണം അവർ മീൻപിടിത്തക്കാരായിരുന്നു.
