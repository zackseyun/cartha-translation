translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മുക്കുവർ’ എന്ന സാമൂഹികമായി അടയാളപ്പെടുത്തിയ പദത്തിനു പകരം തൊഴിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്ന ‘മീൻപിടിത്തക്കാർ’ ഉപയോഗിച്ചു.
