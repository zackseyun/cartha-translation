  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: ml
  text: അവൻ ഗലീലക്കടലിന്റെ തീരത്തുകൂടെ നടന്നുപോകുമ്പോൾ, ശിമോനെയും ശിമോന്റെ സഹോദരനായ അന്ത്രയോസിനെയും കടലിൽ വല വീശുന്നതായി കണ്ടു; കാരണം അവർ മീൻപിടിത്തക്കാരായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων παρὰ τὴν θάλασσαν
  choice: കടലിന്റെ തീരത്തുകൂടെ നടന്നുപോകുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം മുഖ്യക്രിയയോടൊപ്പം നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; παρά + accusative തീരത്തിനരികിലൂടെയുള്ള സഞ്ചാരത്തെ വ്യക്തമാക്കുന്നു.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: ഗലീലക്കടൽ
  rationale: θάλασσα എന്ന മൂലപദവും മലയാളത്തിലെ പ്രചാരമുള്ള ഭൂമിശാസ്ത്രനാമവും നിലനിർത്തുന്നു.
- source_word: εἶδεν
  choice: കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാലാർഥം അധിക വ്യാഖ്യാനം ചേർക്കാതെ നൽകുന്നു.
- source_word: Σίμωνα καὶ Ἀνδρέαν τὸν ἀδελφὸν Σίμωνος
  choice: ശിമോനും ശിമോന്റെ സഹോദരനായ അന്ത്രയോസും
  rationale: അന്ത്രയോസിനെ ശിമോന്റെ സഹോദരനായി തിരിച്ചറിയിക്കുന്ന appositional ഘടന സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ
  choice: കടലിൽ വല വീശുന്നത്
  rationale: ἀμφιβάλλω ഇവിടെ മീൻവല എറിയുന്നതിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വല വീശുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: അവർ മീൻപിടിത്തക്കാരായിരുന്നു
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യക്രമവും അർധവിരാമവുംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
