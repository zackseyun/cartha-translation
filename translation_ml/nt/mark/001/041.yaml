id: MRK.1.41
reference: Mark 1:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ὀργισθεὶς ἐκτείνας τὴν χεῖρα ⸂αὐτοῦ ἥψατο⸃ καὶ λέγει αὐτῷ· Θέλω, καθαρίσθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: ml
  text: 'അവൻ കോപിച്ച് കൈ നീട്ടി അവനെ തൊട്ടു; അവനോടു പറഞ്ഞു: “എനിക്ക് മനസ്സുണ്ട്; ശുദ്ധനാകുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: കോപത്തോടെ
  rationale: SBLGNT-യിൽ അച്ചടിച്ചിരിക്കുന്ന ὀργισθείς എന്ന പാഠത്തിന്റെ നേരായ അർഥം ‘കോപിച്ചുകൊണ്ട്/കോപത്തോടെ’ എന്നാണ്. മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിക്കായി ‘കോപത്തോടെ’ എന്നു നൽകി; കോപത്തിന്റെ കാരണം വ്യാഖ്യാനിച്ച് ചേർത്തിട്ടില്ല.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: കൈ നീട്ടി
  rationale: മൂലത്തിലെ വ്യക്തമായ ശാരീരിക പ്രവൃത്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു. ‘തന്റെ’ എന്നത് മലയാളത്തിൽ അനാവശ്യമായതിനാൽ ഒഴിവാക്കി.
- source_word: ἥψατο
  choice: അവനെ തൊട്ടു
  rationale: ഈ സന്ദർഭത്തിൽ ἅπτω എന്ന ക്രിയയുടെ മധ്യരൂപം സാധാരണയായി ‘തൊടുക’ എന്നാണ്; കുഷ്ഠരോഗിയുമായുള്ള ശാരീരിക സമ്പർക്കത്തിന്റെ പ്രാധാന്യവും ഇത് നിലനിർത്തുന്നു.
- source_word: λέγει αὐτῷ
  choice: അവനോട് … എന്നു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തെ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Θέλω
  choice: എനിക്ക് മനസ്സുണ്ട്
  rationale: ഈ സന്ദർഭത്തിൽ θέλω ഭാവികാലമല്ല, സന്നദ്ധതയാണ് സൂചിപ്പിക്കുന്നത്. ‘എനിക്ക് മനസ്സുണ്ട്’ എന്നത് രോഗിയുടെ അപേക്ഷയോടുള്ള യേശുവിന്റെ അനുകൂലമായ ഇച്ഛയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: καθαρίσθητι
  choice: ശുദ്ധനാകുക
  rationale: καθαρίζω എന്ന ക്രിയയുടെ നിഷ്ക്രിയ ആജ്ഞാരൂപം ഇവിടെ ശാരീരിക സൗഖ്യവും ആചാരപരമായ ശുദ്ധിയും ഉൾക്കൊള്ളുന്നു. ‘ശുദ്ധനാകുക’ ആ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വികാരം വിവരിക്കുന്ന കൃദന്തരൂപത്തിലെ പാഠഭേദം
  choice: SBLGNT-യിലെ ὀργισθείς എന്ന പാഠം മുഖ്യവാക്യത്തിൽ ‘കോപത്തോടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മനസ്സലിഞ്ഞ്’ / ‘കരുണ തോന്നി’ (σπλαγχνισθείς എന്ന പാഠഭേദം)
  rationale: നൽകിയിരിക്കുന്ന മൂലഭാഷാപാഠത്തിനാണ് മുൻഗണന. ഈ പാഠഭേദം യേശുവിന്റെ വികാരത്തെക്കുറിച്ചുള്ള അവതരണത്തെ ഗണ്യമായി ബാധിക്കുന്നതിനാൽ, കൂടുതൽ പരിചിതമായ മറ്റൊരു വായന മുഖ്യവാക്യത്തിൽ കലർത്താതെ അടിക്കുറിപ്പിൽ സുതാര്യമായി രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ പ്രവൃത്തികളുടെ ക്രമവും പാഠഭേദം സൃഷ്ടിക്കുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി; കോപത്തിന്റെ ലക്ഷ്യമോ കാരണമോ അനുമാനിച്ച് ചേർത്തിട്ടില്ല.
