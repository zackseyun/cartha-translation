revisions:
- from: അവൻ കോപത്തോടെ[a] കൈ നീട്ടി അവനെ തൊട്ടു; അവനോട്, “എനിക്ക് മനസ്സുണ്ട്; ശുദ്ധനാകുക” എന്നു പറഞ്ഞു.
  to: 'അവൻ കോപിച്ച് കൈ നീട്ടി അവനെ തൊട്ടു; അവനോടു പറഞ്ഞു: “എനിക്ക് മനസ്സുണ്ട്; ശുദ്ധനാകുക.”'
  rationale: The revision retains the SBLGNT reading and all narrative actions while improving Malayalam sentence flow. It neither specifies why Jesus was angry nor weakens the significant textual variant. The footnote remains anchored to the emotional participle and gives a clear modern-Malayalam equivalent for the alternative reading.
