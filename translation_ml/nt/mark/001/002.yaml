language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: ml
  text: 'പ്രവാചകനായ യെശയ്യാവിന്റെ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്നതുപോലെ:[a]


    “ഇതാ, ഞാൻ എന്റെ സന്ദേശവാഹകനെ നിനക്കു മുമ്പായി[c] അയക്കുന്നു;


    അവൻ നിന്റെ വഴി ഒരുക്കും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “പ്രവാചകനായ യെശയ്യാവിന്റെ പുസ്തകത്തിൽ” എന്നതിനുപകരം “പ്രവാചകന്മാരിൽ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: ഈ ഉദ്ധരണിയിൽ മലാഖി 3:1-ലെയും യെശയ്യാവ് 40:3-ലെയും വാക്കുകൾ ചേർന്നിരിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: അല്ലെങ്കിൽ, “നിന്റെ മുമ്പിൽ.” അക്ഷരാർഥത്തിൽ, “നിന്റെ മുഖത്തിനു മുമ്പായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തുടർന്നുവരുന്ന തിരുവെഴുത്ത് ഉദ്ധരണിയോടുള്ള പൊരുത്തം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് താരതമ്യപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് എഴുതപ്പെട്ടതും ഇപ്പോഴും പ്രാബല്യത്തിലുള്ള എഴുത്തായി നിലനിൽക്കുന്നതുമായ അവസ്ഥ സൂചിപ്പിക്കുന്ന പൂർണകാല കർമണി പ്രയോഗം മലയാളത്തിലെ പതിവായ ഉദ്ധരണിസൂത്രത്തിൽ നൽകുന്നു.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: യെശയ്യാ പ്രവാചകന്റെ ഗ്രന്ഥത്തിൽ
  rationale: പ്രവാചകന്റെ പേരിൽ അറിയപ്പെടുന്ന ഗ്രന്ഥത്തിനുള്ളിലെ ഉദ്ധരണിയാണെന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; പാഠത്തിലുള്ള യെശയ്യാ എന്ന നാമം നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രവാചകീയവും ഗൗരവമുള്ളതുമായ ഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀποστέλλω
  choice: അയക്കുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും പ്രഖ്യാപനത്തിന്റെ തത്സമയഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἄγγελόν
  choice: ദൂതൻ
  rationale: ഇവിടെ പദം സന്ദേശവാഹകനായ മുന്നോടിയെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വർഗീയ ദൂതൻ എന്ന അർഥം അനാവശ്യമായി നിർബന്ധിക്കാതെ പൊതുവായ അർഥം നൽകുന്നു.
- source_word: πρὸ προσώπου σου
  choice: നിന്റെ മുഖത്തിനു മുമ്പായി
  rationale: ‘നിനക്കു മുമ്പായി’ എന്ന ഇടിയോമാറ്റിക് അർഥത്തോടൊപ്പം മുഖം എന്ന ഉറവിടരൂപകവും പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: κατασκευάσει
  choice: ഒരുക്കും
  rationale: തയ്യാറാക്കുക, സജ്ജമാക്കുക എന്ന അർഥം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὴν ὁδόν σου
  choice: നിന്റെ വഴി
  rationale: വഴി എന്ന ദൃശ്യരൂപവും അതിന്റെ രൂപകാർഥസാധ്യതയും ഒരുപോലെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉദ്ധരണിയിൽ മലാഖി 3:1-നോടും യെശയ്യാവ് 40:3-നോടും ബന്ധമുള്ള വാക്കുകൾ ചേർന്നിട്ടുണ്ടെങ്കിലും ഉദ്ധരണിസൂത്രം യെശയ്യാവിനെ മാത്രം പേരെടുത്തു പറയുന്നു.
  choice: പ്രധാനപാഠത്തിൽ ‘യെശയ്യാ പ്രവാചകന്റെ ഗ്രന്ഥത്തിൽ’ എന്നു നിലനിർത്തി.
  alternative: ‘പ്രവാചകന്മാരുടെ ഗ്രന്ഥങ്ങളിൽ’
  rationale: SBLGNT-യിലെ സ്വീകരിച്ച പാഠം യെശയ്യാവിനെ പേരെടുത്തു പറയുന്നു. സംയുക്ത ഉദ്ധരണിയെന്ന പിരിമുറുക്കം പരിഭാഷയിൽ ഒത്തുതീർക്കാതെ, കൈയെഴുത്തുപ്രതി വ്യത്യാസവും ഉദ്ധരണിയുടെ പശ്ചാത്തലവും അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. ‘ഇതാ’, ‘ദൂതൻ’, ‘വഴി ഒരുക്കും’ എന്നീ പരിചിതവും സുലഭവുമായ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. ഉറവിടത്തിലെ ‘മുഖം’ എന്ന ദൃശ്യരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തി, കൂടുതൽ സ്വാഭാവികമായ പര്യായം അടിക്കുറിപ്പിൽ നൽകി.
