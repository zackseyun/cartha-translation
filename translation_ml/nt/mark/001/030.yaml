  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ πενθερὰ Σίμωνος κατέκειτο πυρέσσουσα, καὶ ⸀εὐθὺς λέγουσιν αὐτῷ περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: ml
  text: ശിമോന്റെ അമ്മായിയമ്മ പനി ബാധിച്ച് കിടക്കുകയായിരുന്നു. ഉടനെ അവർ അവളെക്കുറിച്ച് അവനോടു പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ ഇവിടെ ചരിത്രവർത്തമാനകാലമാണ്: അക്ഷരാർഥത്തിൽ, ‘അവർ അവനോടു പറയുന്നു.’ സജീവമായ കഥനത്തിനായി ഭൂതകാലസംഭവത്തെ വർത്തമാനകാലത്തിൽ അവതരിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ
  choice: അമ്മായിയമ്മ
  rationale: ശിമോന്റെ ഭാര്യയുടെ അമ്മയെ സൂചിപ്പിക്കുന്ന സാധാരണ ബന്ധപദം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവും.
- source_word: κατέκειτο
  choice: കിടക്കുകയായിരുന്നു
  rationale: തുടർന്നുകൊണ്ടിരുന്ന കിടക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന അപൂർണ്ണ ഭൂതകാലഭാവം നിലനിർത്തുന്നു; ‘കിടപ്പിലായിരുന്നു’ എന്നു പറഞ്ഞ് അവസ്ഥയുടെ തീവ്രത അനാവശ്യമായി കൂട്ടുന്നില്ല.
- source_word: πυρέσσουσα
  choice: പനി ബാധിച്ച്
  rationale: പനി അനുഭവിച്ചുകൊണ്ടിരുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: പ്രവർത്തനം വൈകാതെ നടന്നുവെന്ന അർഥവും മർക്കോസിന്റെ ദ്രുതഗതിയുള്ള ആഖ്യാനശൈലിയും നിലനിർത്തുന്നു.
- source_word: λέγουσιν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാളത്തിലെ സ്വാഭാവിക കഥനകാലമായ ഭൂതകാലത്തിൽ നൽകുന്നു; വർത്തമാനരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: περὶ αὐτῆς
  choice: അവളെക്കുറിച്ച്
  rationale: περί + genitive എന്നതിന്റെ ‘അവളെ സംബന്ധിച്ച്’ എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ശക്തമായ വിരോധമല്ല, കഥ മുന്നോട്ടു കൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; ‘എന്നാൽ’ എന്നത് അനാവശ്യ വിരോധം സൃഷ്ടിക്കുകയും ‘അപ്പോൾ’ വ്യക്തമായ കാലസൂചന ചേർക്കുകയും ചെയ്യാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. നീണ്ട സംയുക്തവാക്യം ഒഴിവാക്കി രണ്ടു വാക്യങ്ങളാക്കിയിരിക്കുന്നു. αὐτῷ എന്ന സർവനാമം ഉറവിടത്തോട് ചേർന്ന് ‘അവനോടു’ എന്നു നൽകിയിരിക്കുന്നു; സന്ദർഭത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നു.
