  source_fidelity: The Malayalam accurately conveys πενθερὰ Σίμωνος as “ശിമോന്റെ അമ്മായിയമ്മ,” the continuing state in κατέκειτο as “കിടക്കുകയായിരുന്നു,” πυρέσσουσα as suffering from fever, εὐθύς as “ഉടനെ,” and περὶ αὐτῆς as “അവളെക്കുറിച്ച്.” Rendering the Greek historical present λέγουσιν with Malayalam past-tense “പറഞ്ഞു” is idiomatic and is appropriately documented in the footnote. The mild connective δέ need not be separately represented in Malayalam.
