  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘സിനഗോഗ്’ എന്ന പ്രചാരത്തിലുള്ള വ്യക്തമായ പദം ഉപയോഗിച്ചു; മൂലത്തിലെ പ്രവർത്തനക്രമവും സഹഗമനവും സംരക്ഷിച്ചു.
