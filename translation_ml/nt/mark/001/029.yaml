source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: ml
  text: ഉടനെ അവർ സിനഗോഗിൽനിന്ന് പുറത്തുവന്ന് യാക്കോബിനും യോഹന്നാനുമൊത്ത് ശിമോന്റെയും അന്ത്രെയാസിന്റെയും വീട്ടിൽ പ്രവേശിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ ദ്രുതഗതിയുള്ള ആഖ്യാനശൈലി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τῆς συναγωγῆς
  choice: സിനഗോഗിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന അകത്തുനിന്ന് പുറത്തേക്കുള്ള നീക്കം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξελθόντες ἦλθον
  choice: പുറത്തുവന്ന് ... പ്രവേശിച്ചു
  rationale: ആദ്യം പുറത്തുവന്നതും തുടർന്ന് വീട്ടിനകത്ത് ചെന്നതുമായ പ്രവർത്തനക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς τὴν οἰκίαν
  choice: വീട്ടിൽ പ്രവേശിച്ചു
  rationale: εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ദിശയെ വെറും ‘വീട്ടിലേക്കു പോയി’ എന്നതിനെക്കാൾ വ്യക്തമായി നൽകുന്നു.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: ശിമോന്റെയും അന്ത്രയോസിന്റെയും
  rationale: രണ്ടുപേരുമായുള്ള വീടിന്റെ ബന്ധം ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിക്കനുസരിച്ച് നിലനിർത്തുന്നു.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: യാക്കോബിനോടും യോഹന്നാനോടുംകൂടെ
  rationale: μετάയുടെ സഹഗമനാർത്ഥം നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: ശിമോൻ / അന്ത്രയോസ് / യാക്കോബ് / യോഹന്നാൻ
  rationale: മലയാള ബൈബിൾ വായനയിൽ സുപരിചിതമായ പേരുരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
