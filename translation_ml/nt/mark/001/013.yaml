source:
  edition: SBLGNT
  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: ml
  text: അവൻ മരുഭൂമിയിൽ നാല്പതു ദിവസം സാത്താനാൽ പ്രലോഭിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നു[a]. അവൻ വന്യമൃഗങ്ങളോടുകൂടെ ആയിരുന്നു; ദൂതന്മാർ അവനെ ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സാത്താനാൽ പരീക്ഷിക്കപ്പെട്ടുകൊണ്ടിരുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് “പ്രലോഭിപ്പിക്കുക” എന്നും “പരീക്ഷിക്കുക” എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ സാത്താൻ പ്രവർത്തകനായി വ്യക്തമായി പറയപ്പെടുന്നതിനാൽ “പ്രലോഭിപ്പിക്കുക” എന്നതാണ് കൂടുതൽ യോജിച്ചത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: ഒറ്റപ്പെട്ട വനപ്രദേശത്തെയും വരണ്ട പ്രദേശത്തെയും സൂചിപ്പിക്കാവുന്ന പദമാണിത്. സുവിശേഷവിവരണത്തിലെ പതിവായതും സ്വാഭാവികവുമായ പ്രയോഗമായി ‘മരുഭൂമി’ ഭൂമിശാസ്ത്രപരവും തിരുവെഴുത്തുപരവുമായ പ്രതിധ്വനി നിലനിർത്തുന്നു; മണൽനിറഞ്ഞ മരുഭൂമിയെന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: τεσσεράκοντα ἡμέρας
  choice: നാല്പതു ദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ. പരീക്ഷണകാലങ്ങളെക്കുറിച്ചുള്ള തിരുവെഴുത്തുപരമായ പ്രതിധ്വനി വിശദീകരിച്ചു ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: πειραζόμενος
  choice: പ്രലോഭിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: πειράζω എന്നതിന് ‘പ്രലോഭിപ്പിക്കുക’ എന്നും ‘പരീക്ഷിക്കുക’ എന്നും അർഥമാകാം. ഇവിടെ പ്രവർത്തകൻ സാത്താനായതിനാൽ ദോഷത്തിലേക്കുള്ള പ്രലോഭനം എന്ന അർഥം കൂടുതൽ സ്വാഭാവികം; തുടരുന്ന പ്രവർത്തനം പങ്കാളിപദവും അപൂർണഭൂതകാല സന്ദർഭവും അനുസരിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: സാത്താനാൽ
  rationale: Σατανᾶς വ്യക്തിപരമായ അതീന്ദ്രിയ എതിരാളിയുടെ പരമ്പരാഗത നാമം/പദവിയാണ്; മലയാളത്തിലെ അംഗീകൃത ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: μετὰ τῶν θηρίων
  choice: വന്യമൃഗങ്ങളോടുകൂടെ
  rationale: θηρίον മെരുക്കപ്പെടാത്ത വന്യമൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ആ പശ്ചാത്തലത്തിന്റെ ഭീഷണിസാധ്യത വ്യാഖ്യാനിച്ചു കൂട്ടാതെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἄγγελοι
  choice: ദൂതന്മാർ
  rationale: ἄγγελος എന്നതിന് പൊതുവെ സന്ദേശവാഹകൻ എന്നർഥമുണ്ടെങ്കിലും സാത്താനും മരുഭൂമിയിലെ പ്രലോഭനവും അതീന്ദ്രിയ ശുശ്രൂഷയും ഉൾപ്പെടുന്ന സന്ദർഭം സ്വർഗീയ ദൂതന്മാരെയാണു സൂചിപ്പിക്കുന്നത്.
- source_word: διηκόνουν αὐτῷ
  choice: അവനെ ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു
  rationale: διακονέω സേവിക്കുക/ശുശ്രൂഷിക്കുക എന്നാണ്. ‘ശുശ്രൂഷിക്കുക’ സന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ച ‘-കൊണ്ടിരുന്നു’ വഴി വ്യക്തമാക്കുന്നു.
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: അവൻ ... ആയിരുന്നു. അവൻ ... ആയിരുന്നു; ...
  rationale: മർക്കോസിന്റെ സമാന്തരവും അനുക്രമവുമായ വാക്യഘടന പരമാവധി നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ ഭാരമായി തോന്നുന്ന ആവർത്തിച്ചുള്ള ആദിയിലുള്ള ‘യും’ ഒഴിവാക്കി വായനാസൗകര്യം ഉറപ്പാക്കുന്നു.
theological_decisions:
- issue: സാത്താനോടു ബന്ധപ്പെടുത്തി πειραζόμενος എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രലോഭിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നു
  alternative: പരീക്ഷിക്കപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: ഈ ക്രിയയ്ക്ക് പരീക്ഷണവും പ്രലോഭനവും സൂചിപ്പിക്കാം. എന്നാൽ സാത്താൻ പ്രവർത്തകനായി വ്യക്തമായി പറയപ്പെടുന്നതിനാൽ ഇവിടെ ‘പ്രലോഭിപ്പിക്കുക’ എന്ന ശത്രുതാപരമായ അർഥം കൂടുതൽ സാധ്യതയുള്ളതാണ്. എന്നിരുന്നാലും യഥാർഥമായ പദാർഥവൈകല്യം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മരുഭൂമി’, ‘സാത്താൻ’, ‘ദൂതന്മാർ’, ‘ശുശ്രൂഷിക്കുക’ എന്നീ സാധാരണ തിരുവെഴുത്തുപദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ തുടരുന്ന പ്രവർത്തനഭാവം ‘-കൊണ്ടിരുന്നു’ രൂപങ്ങളിലൂടെ നിലനിർത്തി; വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കി.
