- from: അതിരാവിലെ, ഇരുട്ട് മാറുംമുമ്പേ, അവൻ എഴുന്നേറ്റ് പുറത്തേക്കു പോയി; അവിടെനിന്ന് ഒരു വിജനസ്ഥലത്തേക്കു ചെന്നു[a]. അവിടെ അവൻ പ്രാർഥിച്ചുകൊണ്ടിരുന്നു.
