source:
  edition: SBLGNT
  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: ml
  text: വളരെ അതിരാവിലെ, ഇരുട്ടായിരിക്കെ, അവൻ എഴുന്നേറ്റ് പുറത്തിറങ്ങി, ഒരു വിജനസ്ഥലത്തേക്കു[a] പോയി; അവിടെ അവൻ പ്രാർഥിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആളൊഴിഞ്ഞ സ്ഥലത്തേക്ക്” അല്ലെങ്കിൽ “ഏകാന്തമായ സ്ഥലത്തേക്ക്” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ആൾപ്പാർപ്പില്ലാത്തതോ വിജനമോ വനപ്രദേശത്തോടു സാമ്യമുള്ളതോ ആയ ഒരു സ്ഥലത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: അതിരാവിലെ, ഇരുട്ട് മാറുംമുമ്പേ
  rationale: മൂന്നു പദങ്ങളും ചേർന്ന് സൂചിപ്പിക്കുന്ന അത്യന്തം നേരത്തെയുള്ള, ഇരുട്ട് നിലനിന്നിരുന്ന സമയത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀναστὰς
  choice: അവൻ എഴുന്നേറ്റ്
  rationale: മുഖ്യക്രിയകൾക്കു മുമ്പുള്ള അനുബന്ധപ്രവൃത്തിയും സംഭവക്രമവും നിലനിർത്തുന്നു.
- source_word: ἐξῆλθεν καὶ ἀπῆλθεν
  choice: പുറത്തേക്കു പോയി; അവിടെനിന്ന് ... ചെന്നു
  rationale: പുറത്തിറങ്ങുന്നതും തുടർന്ന് ആ സ്ഥലത്തുനിന്ന് അകലെ മറ്റൊരിടത്തേക്കു പോകുന്നതുമായ രണ്ടു ഘട്ടങ്ങൾ വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: εἰς ἔρημον τόπον
  choice: ഒരു വിജനസ്ഥലത്തേക്ക്
  rationale: ἔρημος എന്ന പദത്തിന്റെ ആൾപ്പാർപ്പില്ലാത്തതോ ആളൊഴിഞ്ഞതോ ആയ സ്ഥലമെന്ന അർഥം നൽകുന്നു; നിർബന്ധമായും ഔപചാരികമായ മരുഭൂമി എന്ന ആശയം വരുത്തുന്നില്ല.
- source_word: κἀκεῖ
  choice: അവിടെ
  rationale: καὶ ἐκεῖ എന്ന സംയുക്തരൂപത്തിന്റെ സ്ഥാനസൂചന ലളിതമായും വ്യക്തമായും നൽകുന്നു.
- source_word: προσηύχετο
  choice: അവൻ പ്രാർഥിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാല ക്രിയയുടെ തുടർച്ചയായ പ്രവൃത്തിഭാവം മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പ്രാർഥനയ്ക്കുള്ള ആഖ്യാനപരമായ ഊന്നൽ
  choice: യേശു വിജനസ്ഥലത്തേക്കു മാറിപ്പോയി പ്രാർഥിച്ചുകൊണ്ടിരുന്നു എന്ന സംഭവം നേരിട്ട് അവതരിപ്പിക്കുന്നു.
  alternative: ഇത് ശിഷ്യത്വത്തിന്റെ മാതൃകയാണെന്നോ യേശുവിന്റെ ആശ്രിതത്വത്തെക്കുറിച്ചുള്ള പ്രത്യേക ക്രിസ്തുശാസ്ത്ര നിഗമനമാണെന്നോ വിവർത്തനത്തിൽ തന്നെ ഊന്നിപ്പറയുക.
  rationale: ഗ്രീക്ക് വാക്യം സംഭവത്തെ വിവരിക്കുന്നു; അതിനപ്പുറമുള്ള ദൈവശാസ്ത്ര നിഗമനങ്ങൾ വാക്യത്തിന്റെ ഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ സമയഊന്നൽ, ചലനത്തിന്റെ രണ്ടു ഘട്ടങ്ങൾ, പ്രാർഥനയുടെ തുടർച്ചാഭാവം എന്നിവ സംരക്ഷിച്ചു.
