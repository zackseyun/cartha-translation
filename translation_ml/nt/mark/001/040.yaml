  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: ml
  text: 'കുഷ്ഠരോഗമുള്ള[a] ഒരാൾ അവന്റെ അടുക്കൽ വരുന്നു; അവനോട് അപേക്ഷിച്ചും മുട്ടുകുത്തിയും ഇങ്ങനെ പറയുന്നു: “നിനക്കു മനസ്സുണ്ടെങ്കിൽ എന്നെ ശുദ്ധനാക്കാൻ[b] നിനക്കു കഴിയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘കുഷ്ഠരോഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം ഇന്നത്തെ ഹാൻസൻസ് രോഗം മാത്രമല്ല, പലതരം ഗുരുതര ചർമരോഗങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_scope
  - marker: b
    text: അഥവാ “എന്നെ ശുദ്ധീകരിക്കാൻ.” ഈ ഗ്രീക്ക് ക്രിയയ്ക്ക് അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണത്തെയും ശാരീരിക പുനഃസ്ഥാപനത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: കുഷ്ഠരോഗമുള്ള ഒരാൾ
  rationale: ഗ്രീക്ക് വിശേഷണം നാമമായി ഉപയോഗിച്ച് ഗുരുതരമായ ചർമരോഗം ബാധിച്ച ഒരാളെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ വ്യക്തിയെ മുൻനിർത്തുന്ന ഈ പ്രയോഗം സ്വാഭാവികമാണ്; രോഗത്തിന്റെ ചരിത്രപരമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു.
- source_word: παρακαλῶν
  choice: അപേക്ഷിച്ച്
  rationale: സൗഖ്യത്തിനായുള്ള ആത്മാർഥമായ അഭ്യർഥനയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘യാചിച്ച്’ എന്നതിലുണ്ടാകാവുന്ന അതിശക്തമായ ഭാവം നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: γονυπετῶν
  choice: മുട്ടുകുത്തി
  rationale: മുട്ടുകുത്തുന്ന ശരീരഭാവം നേരിട്ടും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: Ἐὰν θέλῃς
  choice: നിനക്കു മനസ്സുണ്ടെങ്കിൽ
  rationale: ഭാവികാലത്തേക്കാൾ സന്നദ്ധതയെയാണ് θέλω ഇവിടെ സൂചിപ്പിക്കുന്നത്; ഉപാധിയുടെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: δύνασαί
  choice: നിനക്കു കഴിയും
  rationale: δύναμαι സൂചിപ്പിക്കുന്ന കഴിവിനെയോ ശക്തിയെയോ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καθαρίσαι
  choice: എന്നെ ശുദ്ധനാക്കാൻ
  rationale: സാധാരണ സൗഖ്യപ്പെടുത്തൽക്രിയയാക്കി ചുരുക്കാതെ ശാരീരിക പുനഃസ്ഥാപനവും അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണവും ഉൾക്കൊള്ളാവുന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുഷ്ഠരോഗസന്ദർഭത്തിലെ ശുദ്ധീകരണത്തിന്റെ സ്വഭാവം
  choice: എന്നെ ശുദ്ധനാക്കാൻ
  alternative: എന്നെ സുഖപ്പെടുത്താൻ
  rationale: മൂലപാഠം സാധാരണ ‘സുഖപ്പെടുത്തുക’ എന്ന ക്രിയയല്ല, ‘ശുദ്ധമാക്കുക’ എന്ന ക്രിയയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ശാരീരിക പുനഃസ്ഥാപനവും ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള മോചനവും തമ്മിലുള്ള ബന്ധം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ചരിത്രവർത്തമാനകാലം നിലനിർത്തിയിരിക്കുന്നു. യേശുവിനോടുള്ള നേരിട്ടുള്ള ഏകവചന അഭിസംബോധനയായി ‘നിനക്കു’ ഉപയോഗിച്ചിരിക്കുന്നു; ഗ്രീക്കിൽ പ്രത്യേക ബഹുമാനസൂചക സർവനാമവ്യത്യാസമില്ല. പങ്കാളിക്രിയകളുടെ ഭാരം കുറയ്ക്കാൻ വാക്യം രണ്ടായി വിഭജിച്ചെങ്കിലും പ്രവൃത്തികളുടെ ബന്ധവും ക്രമവും നിലനിർത്തിയിരിക്കുന്നു.
