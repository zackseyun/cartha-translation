id: MRK.1.15
reference: Mark 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: ml
  text: 'അവൻ ഇങ്ങനെ പറഞ്ഞു: “കാലം നിറവേറിയിരിക്കുന്നു; ദൈവത്തിന്റെ രാജ്യം[a] അടുത്തെത്തിയിരിക്കുന്നു. മനംതിരിയുക, സുവാർത്തയിൽ[b] വിശ്വസിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന്റെ ഭരണം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സുവിശേഷത്തിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: നിറവേറിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണ്ണകാലഭാവം നിലനിർത്തുകയും, ദൈവികമായി നിർണായകമായ സമയം പൂർത്തിയിലെത്തിയെന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: καιρὸς
  choice: കാലം
  rationale: സന്ദർഭത്തിൽ ഇത് നിർണായകമായോ നിശ്ചയിക്കപ്പെട്ടതായോ ഉള്ള സമയത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ മൂലപദത്തിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ ‘കാലം’ എന്ന വിശാലത നിലനിർത്തുന്നു.
- source_word: ἤγγικεν
  choice: അടുത്തെത്തിയിരിക്കുന്നു
  rationale: അടുത്തുവന്നതിന്റെ ഫലമായി ഇപ്പോൾ സമീപത്താണെന്ന പൂർണ്ണകാലഭാവം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു; കേവലം ഭാവിയിലെ ഒരു സംഭവം മാത്രമാണെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: βασιλεία τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ രാജ്യം
  rationale: ദൈവത്തിന്റെ ഭരണം എന്ന സജീവ അർഥവും രാജ്യത്തിന്റെ വിശാലമായ തിരുവെഴുത്തുപരമായ അർഥവ്യാപ്തിയും ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: μετανοεῖτε
  choice: മനംതിരിഞ്ഞ്
  rationale: ചിന്തയിലും ജീവിതദിശയിലും നിർണായകമായ തിരിവിനുള്ള ആഹ്വാനം സാധാരണ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വെറും അഭിപ്രായമാറ്റമായി ചുരുക്കുന്നില്ല.
- source_word: πιστεύετε
  choice: വിശ്വസിക്കുക
  rationale: ഗ്രീക്ക് വർത്തമാനകാല ആജ്ഞയുടെ ആഹ്വാനം മലയാളത്തിൽ സ്വാഭാവികമായ ലളിത ആജ്ഞാരൂപത്തിൽ നൽകുന്നു; വിശ്വാസവും ആശ്രയവും ഉൾക്കൊള്ളാവുന്ന പദമാണ്.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: സുവാർത്തയിൽ
  rationale: εὐαγγέλιον എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘നല്ല വാർത്ത’യെ സഭാപരമായ സാങ്കേതികപദത്തിൽ മാത്രം ഒതുക്കാതെ, മലയാളത്തിൽ സ്ഥാപിതവും ഗ്രഹിക്കാവുന്നതുമായ ‘സുവാർത്ത’ കൊണ്ട് നൽകുന്നു; ἐν എന്ന ബന്ധം ‘-യിൽ’ കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: λέγων
  choice: അവൻ ഇങ്ങനെ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ കർത്താവിനെയും തുടർന്നുവരുന്ന നേരിട്ടുള്ള പ്രസംഗത്തെയും മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്ന വിവരണരൂപം.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ദൈവത്തിന്റെ രാജ്യം
  alternative: ദൈവത്തിന്റെ ഭരണം
  rationale: ‘രാജ്യം’ എന്നത് ദൈവത്തിന്റെ രാജാധികാരം, ഭരണപ്രവർത്തനം, അതിന്റെ പരിധി എന്നിവയ്ക്കിടയിലെ മൂലവാചകത്തിന്റെ അർഥസമ്മർദം നിലനിർത്തുന്നു; ‘ഭരണം’ എന്ന സജീവമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: εὐαγγέλιον എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: സുവാർത്ത
  alternative: സുവിശേഷം
  rationale: സാധാരണ വായനക്കാർക്ക് അർഥം നേരിട്ട് ലഭിക്കുന്ന പ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വീകരിക്കുകയും, പരമ്പരാഗതമായി സ്ഥാപിതമായ ‘സുവിശേഷം’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: μετανοεῖτε καὶ πιστεύετε എന്ന ആഹ്വാനത്തിന്റെ കാലഭാവം
  choice: മനംതിരിഞ്ഞ് … വിശ്വസിക്കുക
  alternative: മനംതിരിഞ്ഞുകൊണ്ടിരിക്കുകയും വിശ്വസിച്ചുകൊണ്ടിരിക്കുകയും ചെയ്യുക
  rationale: വർത്തമാനകാല ആജ്ഞകൾക്ക് തുടർച്ചയുടെ ഭാവം സാധ്യമാണെങ്കിലും അത് നിർബന്ധമായി വികസിപ്പിക്കാതെ, പ്രഖ്യാപനസന്ദർഭത്തിലെ അടിയന്തരവും നിർണായകവുമായ ആഹ്വാനം സ്വാഭാവിക മലയാള ആജ്ഞാരൂപത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിറവേറിയിരിക്കുന്നു’, ‘അടുത്തെത്തിയിരിക്കുന്നു’ എന്നീ രൂപങ്ങൾ ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ പൂർത്തീകരണവും ഇപ്പോഴത്തെ ഫലവും പ്രകടമാക്കുന്നു. മുഖ്യവാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിന് തൊട്ടുപിന്നിൽ ചേർത്തിരിക്കുന്നു.
