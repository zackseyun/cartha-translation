source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἦν ἐν τῇ συναγωγῇ αὐτῶν ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ καὶ ἀνέκραξεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/023.yaml
  text: And immediately there was in their synagogue a man with an unclean spirit[a], and he cried out[b],
translation:
  language: ml
  text: 'ഉടനെതന്നെ അവരുടെ സിനഗോഗിൽ അശുദ്ധാത്മാവുള്ള[a] ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു. അവൻ ഉറക്കെ വിളിച്ചുപറഞ്ഞു[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “അശുദ്ധാത്മാവിൽ.”
    reason: lexical_alternative
  - marker: b
    text: ചില പരിഭാഷകൾ ഇതിനെ “അശുദ്ധാത്മാവ് ബാധിച്ചവൻ” എന്നു പരിഭാഷപ്പെടുത്തുന്നു; അത് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാഖ്യാനാത്മക വിപുലീകരണമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടനെതന്നെ
  rationale: മർക്കോസിന്റെ ദ്രുതഗതിയുള്ള ആഖ്യാനശൈലി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: ἦν
  choice: ഉണ്ടായിരുന്നു
  rationale: അനിശ്ചിത കർത്താവോടുകൂടിയ അസ്തിത്വാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: συναγωγῇ αὐτῶν
  choice: അവരുടെ സിനഗോഗിൽ
  rationale: αὐτῶν എന്ന സർവനാമം നിലനിർത്തുന്നു; ഈ യഹൂദ ആരാധനാസന്ദർഭത്തിൽ συναγωγή എന്നത് വ്യക്തമായി സൂചിപ്പിക്കാൻ പ്രചാരത്തിലുള്ള ‘സിനഗോഗ്’ ഉപയോഗിക്കുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: കഥയിലെ ഒരു നിർദിഷ്ട പുരുഷനെ സൂചിപ്പിക്കുന്ന പദം അനാവശ്യ വ്യാഖ്യാനം കൂടാതെ നേരിട്ട് നൽകുന്നു.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: അശുദ്ധാത്മാവുള്ള
  rationale: ഗ്രീക്കിലെ ‘അശുദ്ധാത്മാവിൽ’ എന്ന അപൂർവ ഘടനയുടെ ബന്ധാർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘ബാധിച്ച’ അല്ലെങ്കിൽ ‘ആവേശിച്ച’ എന്നു ചേർത്ത് വ്യാഖ്യാനം വിപുലീകരിക്കുന്നില്ല.
- source_word: ἀκαθάρτῳ
  choice: അശുദ്ധ
  rationale: ആചാരപരവും ധാർമികവുമായ അശുദ്ധിയുടെ അർഥനിറങ്ങൾ നിലനിർത്തുന്ന സ്ഥാപിത ബൈബിൾപ്രയോഗമാണ്.
- source_word: ἀνέκραξεν
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: ἀνακράζω സൂചിപ്പിക്കുന്ന ഉച്ചത്തിലുള്ള വിളി വ്യക്തമാക്കുന്നു; നിലവിളി എന്നതുപോലെ വികാരഭാവം അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ἐν πνεύματι ἀκαθάρτῳ എന്നതിലെ ദുഷ്ടാത്മബന്ധത്തിന്റെ അവതരണം
  choice: അശുദ്ധാത്മാവുള്ള
  alternative: അശുദ്ധാത്മാവിൽ; അശുദ്ധാത്മാവ് ബാധിച്ച
  rationale: മൂലത്തിലെ ബന്ധം വ്യക്തമായി അറിയിക്കുമ്പോഴും ‘ബാധിച്ച’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ഉടമസ്ഥത/ആവേശഭാഷ ഒഴിവാക്കുന്നു. അക്ഷരാർഥഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സിനഗോഗ്’, ‘അശുദ്ധാത്മാവ്’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകൾ ആരംഭിക്കുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ചേർത്തിരിക്കുന്നു.
