source:
  edition: SBLGNT
  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: ml
  text: അവൻ ഗലീല മുഴുവനിലൂടെയും സഞ്ചരിച്ച് അവരുടെ സിനഗോഗുകളിൽ പ്രസംഗിക്കുകയും ഭൂതങ്ങളെ പുറത്താക്കുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ വന്ന് ഗലീല മുഴുവനിലുമുള്ള അവരുടെ സിനഗോഗുകളിൽ പ്രസംഗിക്കുകയും ഭൂതങ്ങളെ പുറത്താക്കുകയും ചെയ്തു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘വന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ സന്ദർഭത്തിൽ അത് പ്രദേശമൊട്ടാകെയുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: സഞ്ചരിച്ച് … ചെയ്തു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം അടിസ്ഥാനമായി ‘വന്നു/പോയി’ എന്നു വരാമെങ്കിലും, ഗലീല മുഴുവൻ എന്ന പ്രദേശസൂചനയും തുടർന്നുള്ള വർത്തമാനകൃദന്തരൂപങ്ങളും ചേർന്ന ഈ സന്ദർഭത്തിൽ വിവിധ സ്ഥലങ്ങളിലൂടെയുള്ള സഞ്ചാരമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായി അത് ‘സഞ്ചരിച്ച്’ എന്നു പ്രകടമാക്കുന്നു; ‘വന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κηρύσσων
  choice: പ്രസംഗിക്കുകയും
  rationale: κηρύσσω പൊതുവായി പരസ്യമായി പ്രഖ്യാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സിനഗോഗ് പശ്ചാത്തലത്തിൽ ‘പ്രസംഗിക്കുക’ സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ തത്തുല്യമാണ്.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: അവരുടെ സിനഗോഗുകളിൽ
  rationale: εἰς അക്ഷരാർഥത്തിൽ ‘അകത്തേക്ക്’ എന്നു വരാമെങ്കിലും, ഇവിടെ പ്രസംഗപ്രവർത്തനം നടന്ന ഇടത്തെ സൂചിപ്പിക്കുന്നു. αὐτῶν എന്ന സർവനാമം ‘അവരുടെ’ എന്നു വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: ഗലീല മുഴുവനിലൂടെയും
  rationale: പ്രദേശമൊട്ടാകെയുള്ള സഞ്ചാരവ്യാപ്തിയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്. ὅλην എന്നതിന്റെ സമഗ്രത ‘മുഴുവനിലൂടെയും’ നിലനിർത്തുന്നു.
- source_word: τὰ δαιμόνια
  choice: ഭൂതങ്ങളെ
  rationale: δαιμόνια എന്നത് അശുദ്ധാത്മാക്കൾ എന്ന വിശാല പ്രയോഗമല്ല, ഭൂതങ്ങൾ എന്ന പ്രത്യേക പരാമർശമാണ്. മലയാള ബൈബിൾ ഭാഷയിലും പൊതുഭാഷയിലും ‘ഭൂതങ്ങൾ’ നേരിട്ടും ഗ്രഹിക്കാവുന്നതുമായ തത്തുല്യമാണ്.
- source_word: ἐκβάλλων
  choice: പുറത്താക്കുകയും
  rationale: ഭൂതബാധ ഒഴിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ἐκβάλλω ‘പുറത്താക്കുക’ എന്ന അർഥത്തിലാണ്. ഇത് അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കാതെ പ്രവർത്തനത്തെ വ്യക്തമായി പറയുന്നു.
theological_decisions:
- issue: τὰ δαιμόνια എന്നതിന്റെ സ്വഭാവം
  choice: വ്യക്തിത്വമുള്ള ആത്മീയ സത്തകളെ സൂചിപ്പിക്കുന്ന സാധാരണ അർഥത്തിൽ ‘ഭൂതങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ദുരാത്മാക്കൾ / അശുദ്ധാത്മാക്കൾ
  rationale: മൂലപദത്തിന്റെ ഏറ്റവും നേരിട്ടുള്ള തത്തുല്യം ‘ഭൂതങ്ങൾ’ ആണ്. യേശു അവയുടെമേൽ അധികാരം പ്രയോഗിക്കുന്നതായി വാക്യം അവതരിപ്പിക്കുന്നു; അതിനപ്പുറമുള്ള സിദ്ധാന്തവിവരണം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുഗ്രഹ്യവുമായ മലയാളം. ‘സിനഗോഗ്’ എന്ന ചരിത്രപരമായ സ്ഥലനാമം കൃത്യതയ്ക്കായി നിലനിർത്തി. കൃദന്തരൂപങ്ങളുടെ ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ഏകോപിത ക്രിയാവാക്യമായി അവതരിപ്പിച്ചു.
