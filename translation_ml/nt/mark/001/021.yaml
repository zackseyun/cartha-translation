  text: Καὶ εἰσπορεύονται εἰς Καφαρναούμ. καὶ ⸀εὐθὺς τοῖς σάββασιν ⸂ἐδίδασκεν εἰς τὴν συναγωγήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: ml
  text: അവർ കഫർന്നഹൂമിൽ പ്രവേശിച്ചു.[a] ശബ്ബത്തിൽ[b] ഉടൻതന്നെ അവൻ സിനഗോഗിൽ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ കഫർന്നഹൂമിൽ പ്രവേശിക്കുന്നു.” സജീവമായ ആഖ്യാനത്തിൽ മർക്കോസ് ചരിത്രവർത്തമാനകാലം പതിവായി ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ശബ്ബത്തുകളിൽ”; “ശബ്ബത്തിൽ” എന്ന അർഥമുള്ള പതിവായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അവൻ പഠിപ്പിച്ചുതുടങ്ങി” എന്നും “അവൻ പഠിപ്പിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് അപൂർണഭൂതകാലം തുടരുന്ന പ്രവർത്തനത്തെയോ പ്രവർത്തനത്തിന്റെ ആരംഭത്തെയോ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: പ്രവേശിച്ചു
  rationale: മർക്കോസിന്റെ സജീവമായ ആഖ്യാനശൈലിയിൽ ഉപയോഗിച്ചിരിക്കുന്ന ചരിത്രവർത്തമാനത്തെ സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു; εἰς ചേർന്ന ക്രിയയുടെ അകത്തേക്കുള്ള ചലനാർഥവും നിലനിർത്തുന്നു.
- source_word: Καφαρναούμ
  choice: കഫർന്നഹൂം
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: εὐθύς
  choice: ഉടൻതന്നെ
  rationale: മർക്കോസിന്റെ ആഖ്യാനത്തിലെ ത്വരയും സംഭവത്തിന്റെ ഉടനടിത്തവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τοῖς σάββασιν
  choice: ശബ്ബത്തിൽ
  rationale: ഗ്രീക്കിൽ ബഹുവചനരൂപമാണെങ്കിലും ഇവിടെ ഒരു ശബ്ബത്തിനെ സൂചിപ്പിക്കുന്ന പതിവായ കാലസൂചക പ്രയോഗമായതിനാൽ മലയാളത്തിൽ ഏകവചനമായി നൽകുന്നു.
- source_word: ἐδίδασκεν
  choice: പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന്റെ തുടർന്നുകൊണ്ടിരുന്ന പ്രവർത്തനഭാവം നേരിട്ട് നിലനിർത്തുന്നു; പ്രവർത്തനം ആരംഭിച്ചു എന്ന സാധ്യത വ്യാഖ്യാനക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: συναγωγήν
  choice: സിനഗോഗിൽ
  rationale: ഈ യഹൂദ പശ്ചാത്തലത്തിൽ പൊതുവായ ഒരു സമ്മേളനത്തെയല്ല, പ്രാദേശിക യഹൂദ ആരാധനാ-പഠനകേന്ദ്രത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; അതിനാൽ വ്യക്തമായ വായ്പാപദം ഉപയോഗിക്കുന്നു.
