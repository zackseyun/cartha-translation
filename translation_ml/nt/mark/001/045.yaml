id: MRK.1.45
reference: Mark 1:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: ml
  text: എന്നാൽ അവൻ പോയശേഷം, വളരെയേറെ പ്രഘോഷിക്കാനും ആ സന്ദേശം പ്രചരിപ്പിക്കാനും തുടങ്ങി. അതുമൂലം യേശുവിന് ഇനി ഒരു പട്ടണത്തിലും തുറന്നു പ്രവേശിക്കാൻ കഴിയാതെവന്നു; പകരം, അദ്ദേഹം പുറത്തുള്ള വിജനസ്ഥലങ്ങളിൽ താമസിച്ചു. ആളുകൾ എല്ലാദിക്കുകളിൽനിന്നും അദ്ദേഹത്തിന്റെ അടുക്കലേക്ക് വന്നുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: ആ കാര്യം എല്ലായിടത്തും പരസ്യമായി അറിയിക്കാൻ
  rationale: κηρύσσειν എന്നതിന് പരസ്യപ്രഖ്യാപനത്തിന്റെ ഭാവം നൽകി; πολλὰ ഇവിടെ അളവിനേക്കാൾ വ്യാപകതയെയോ ആവർത്തനത്തെയോ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: διαφημίζειν τὸν λόγον
  choice: വാർത്ത പ്രചരിപ്പിക്കാൻ
  rationale: τὸν λόγον സന്ദർഭത്തിൽ സുഖപ്രാപ്തിയെക്കുറിച്ചുള്ള വിവരം/വാർത്തയാണ്; διαφημίζειν അതിനെ വ്യാപകമായി പ്രചരിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: φανερῶς
  choice: പരസ്യമായി
  rationale: ഒളിവിലല്ലാതെ തുറന്ന നിലയിൽ എന്ന അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: വിജനസ്ഥലങ്ങളിൽ
  rationale: ἐρήμοις ജനവാസമില്ലാത്തതോ ഒറ്റപ്പെട്ടതോ ആയ ഇടങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘മരുഭൂമി’ എന്ന അതിസങ്കുചിത അർത്ഥം ഒഴിവാക്കി.
- source_word: ἤρχοντο
  choice: വന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലം തുടർച്ചയായോ ആവർത്തിച്ചോ നടന്ന വരവിനെ സൂചിപ്പിക്കുന്നതിനാൽ.
- source_word: πάντοθεν
  choice: എല്ലായിടത്തുനിന്നും
  rationale: എല്ലാ ദിക്കുകളിൽനിന്നുമുള്ള ജനപ്രവാഹം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: αὐτόν എന്ന സർവനാമത്തിന്റെ വ്യക്തീകരണം
  choice: യേശുവിന്
  alternative: അവന്
  rationale: ഗ്രീക്കിൽ സർവനാമമാണെങ്കിലും മലയാളത്തിൽ മുൻവാക്യത്തിലെ സുഖംപ്രാപിച്ച മനുഷ്യനുമായി ആശയക്കുഴപ്പം ഉണ്ടാകാം; സന്ദർഭം യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമായി അവതരിപ്പിച്ചു.
- issue: τὸν λόγον എന്നതിന്റെ അർത്ഥം
  choice: വാർത്ത
  alternative: വചനം / സന്ദേശം
  rationale: ഇവിടെ പൊതുവായ സുവിശേഷപ്രഘോഷണത്തേക്കാൾ, സംഭവിച്ച സൗഖ്യത്തെക്കുറിച്ചുള്ള വിവരം എന്ന സന്ദർഭാർഥം മുൻനിർത്തി; പ്രത്യേക സാങ്കേതിക ദൈവശാസ്ത്രാർഥം ഇറക്കുമതി ചെയ്തില്ല.
- issue: ἦν എന്ന ക്രിയയുടെ അവതരണം
  choice: താമസിച്ചു
  alternative: ആയിരുന്നു
  rationale: യേശു പട്ടണങ്ങൾക്ക് പുറത്തുള്ള വിജനസ്ഥലങ്ങളിൽ തുടരുകയായിരുന്നു എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; സ്ഥിരതാമസമെന്ന doctrinal നിഗമനം ഉദ്ദേശിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിന് മൂന്ന് മലയാളവാക്യങ്ങളാക്കി. ‘അദ്ദേഹം/അദ്ദേഹത്തിന്റെ’ ഉപയോഗം ആദരസൂചകമായ സാധാരണ മലയാളപ്രയോഗമാണ്.
