id: MRK.1.5
reference: Mark 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: ml
  text: യെഹൂദ്യപ്രദേശമൊട്ടാകെയും യെരൂശലേംനിവാസികളെല്ലാവരും അവന്റെ അടുക്കലേക്ക് പുറപ്പെട്ടുകൊണ്ടിരുന്നു; തങ്ങളുടെ പാപങ്ങൾ ഏറ്റുപറഞ്ഞ് അവർ യോർദ്ദാൻ നദിയിൽ അവനാൽ സ്നാനം ഏറ്റുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: ചെന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലം ഭൂതകാലത്തിലെ തുടർച്ചയായോ ആവർത്തിച്ചോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: യെഹൂദ്യപ്രദേശം മുഴുവനും
  rationale: χώρα എന്നത് പ്രദേശം, നാട്, ഗ്രാമപ്രദേശം എന്നീ അർഥങ്ങൾ നൽകാം. ഇവിടെ ഭൂമിശാസ്ത്രപരമായ സമഗ്രത വ്യക്തമാക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്; ഓരോ വ്യക്തിയെയും ഗണിതപരമായി ഉൾപ്പെടുത്തുന്നു എന്ന് നിർബന്ധിക്കുന്നില്ല.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: യെരൂശലേംനിവാസികൾ എല്ലാവരും
  rationale: നഗരത്തിലെ നിവാസികളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; πάντες എന്നതിന്റെ സമഗ്രമായ വാചകശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἐβαπτίζοντο
  choice: സ്നാനം ഏൽക്കുകയും ചെയ്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാല കർമണി രൂപത്തിന്റെ ആവർത്തനവും സ്വീകരിക്കുന്നവരുടെ നിലയും കഴിയുന്നത്ര വ്യക്തമാക്കുന്നു; സ്നാനരീതിയെക്കുറിച്ചുള്ള വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ὑπ’ αὐτοῦ
  choice: അവനാൽ
  rationale: സന്ദർഭത്തിൽ യോഹന്നാനെ സൂചിപ്പിക്കുന്ന സർവനാമം തന്നെയായി നിലനിർത്തുന്നു; പേര് അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: യോർദ്ദാൻ നദിയിൽ
  rationale: ποταμός എന്ന ‘നദി’ എന്ന പദം വ്യക്തമായി പരിഭാഷപ്പെടുത്തുകയും മലയാളത്തിലെ സ്വാഭാവിക നാമക്രമം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐξομολογούμενοι
  choice: ഏറ്റുപറഞ്ഞുകൊണ്ട്
  rationale: സ്നാനം ഏൽക്കുന്ന പ്രവൃത്തിയോടൊപ്പം നടന്ന പാപസമ്മതത്തെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയുടെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: തങ്ങളുടെ പാപങ്ങൾ
  rationale: പ്രധാനവാക്യത്തിലെ അതേ കർത്താക്കളിലേക്കു മടങ്ങുന്ന ഉടമസ്ഥബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യെഹൂദ്യയെയും യെരൂശലേമിനെയും സംബന്ധിച്ച ‘എല്ലാം/എല്ലാവരും’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: ‘മുഴുവനും’, ‘എല്ലാവരും’ എന്നീ പദങ്ങൾ നിലനിർത്തി, വിവരണാത്മകമായ സമഗ്രത അനുവദിച്ചു
  alternative: ‘യെഹൂദ്യയിൽനിന്നും യെരൂശലേമിൽനിന്നും അനേകർ’ എന്നു മൃദൂകരിക്കുക
  rationale: ഗ്രീക്കിലെ πᾶσα, πάντες എന്നിവയുടെ വാചകശക്തി പരിഭാഷയിൽ നിലനിൽക്കണം. അതേസമയം, ഇത് ഓരോ വ്യക്തിയെക്കുറിച്ചുമുള്ള ഗണിതപരമായ അവകാശവാദമായി നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കാതെ സാധാരണ കഥനത്തിലെ സമഗ്രപ്രയോഗമായി വായിക്കാം.
- issue: സ്നാനഭാഷയുടെ സ്വഭാവം
  choice: രീതിയോ ദൈവശാസ്ത്രപരമായ ഫലമോ വിശദീകരിക്കാതെ ‘സ്നാനം ഏൽക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘മുക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘കഴുകപ്പെട്ടു’ എന്നു നൽകുക
  rationale: βαπτίζω ഇവിടെ നടന്ന പ്രവൃത്തിയെ റിപ്പോർട്ട് ചെയ്യുന്നു; പ്രത്യേക രീതി നിർണ്ണയിക്കുന്നതോ പിൽക്കാല സഭാവിഭാഗങ്ങളുടെ ആശയങ്ങൾ ചേർക്കുന്നതോ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. തുടർച്ചയുള്ള അപൂർണകാലക്രിയകൾ വ്യക്തമാക്കാൻ ‘ചെന്നുകൊണ്ടിരുന്നു’, ‘ചെയ്തുകൊണ്ടിരുന്നു’ എന്നിവ ഉപയോഗിച്ചു. പരമ്പരാഗത ബൈബിൾ നാമരൂപങ്ങളായ ‘യെഹൂദ്യ’, ‘യെരൂശലേം’, ‘യോർദ്ദാൻ’ എന്നിവ വായനാസൗകര്യത്തിനായി നിലനിർത്തി.
