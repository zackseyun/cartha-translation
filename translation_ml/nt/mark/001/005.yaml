revisions:
- from: യെഹൂദ്യപ്രദേശം മുഴുവനും യെരൂശലേംനിവാസികൾ എല്ലാവരും അവന്റെ അടുക്കൽ ചെന്നുകൊണ്ടിരുന്നു. തങ്ങളുടെ പാപങ്ങൾ ഏറ്റുപറഞ്ഞുകൊണ്ട് അവർ യോർദ്ദാൻ നദിയിൽ അവനാൽ സ്നാനം ഏൽക്കുകയും ചെയ്തുകൊണ്ടിരുന്നു.
  to: യെഹൂദ്യപ്രദേശമൊട്ടാകെയും യെരൂശലേംനിവാസികളെല്ലാവരും അവന്റെ അടുക്കലേക്ക് പുറപ്പെട്ടുകൊണ്ടിരുന്നു; തങ്ങളുടെ പാപങ്ങൾ ഏറ്റുപറഞ്ഞ് അവർ യോർദ്ദാൻ നദിയിൽ അവനാൽ സ്നാനം ഏറ്റുകൊണ്ടിരുന്നു.
  rationale: The revision is limited to idiomatic and aspectually clear Malayalam. It retains the Greek narrative generalization (‘all’), the ongoing/repeated past sense of both imperfect verbs, baptism administered by the antecedent ‘him,’ the explicit river designation, and confession as an accompanying action. No interpretive claim about baptismal mode or significance is introduced.
