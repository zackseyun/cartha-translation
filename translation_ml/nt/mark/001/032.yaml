  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: ml
  text: സന്ധ്യയായപ്പോൾ, സൂര്യൻ അസ്തമിച്ച സമയത്ത്, അവർ എല്ലാ രോഗികളെയും ഭൂതബാധിതരെയും അവന്റെ അടുക്കലേക്ക് കൊണ്ടുവരികയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭൂതബാധിതർ’ എന്നതിന് ‘ദുഷ്ടാത്മാക്കളുടെ സ്വാധീനത്തിലായവർ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: സന്ധ്യയായപ്പോൾ
  rationale: കാലസൂചന നൽകുന്ന genitive absolute സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: സൂര്യൻ അസ്തമിച്ച സമയത്ത്
  rationale: ὅτε എന്നതിന്റെ ‘when’ എന്ന സമയബന്ധം നിലനിർത്തുന്നു; ‘ശേഷം’ എന്നു ചേർത്ത് മൂലപാഠത്തേക്കാൾ കർശനമായ ക്രമബന്ധം നിർണയിക്കുന്നില്ല.
- source_word: ἔφερον
  choice: കൊണ്ടുവരികയായിരുന്നു
  rationale: അപൂർണഭൂതകാലക്രിയ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πρὸς αὐτὸν
  choice: അവന്റെ അടുക്കൽ
  rationale: ഒരു വ്യക്തിയുടെ അടുത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന πρός എന്നതിന്റെ നേരായ വിവർത്തനം; ഗ്രീക്കിൽ ആവർത്തിക്കാത്ത ‘യേശു’ എന്ന പേര് ഇവിടെ ചേർക്കുന്നില്ല.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: രോഗികളായ എല്ലാവരെയും
  rationale: ‘മോശമായ അവസ്ഥയിൽ ഉള്ളവർ’ എന്ന പദപ്രയോഗത്തിന്റെ സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ അർഥം നൽകുന്നു; πάντας എന്നതിന്റെ സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: τοὺς δαιμονιζομένους
  choice: ഭൂതബാധിതരെയും
  rationale: ദുഷ്ടാത്മിക ബാധയെ അസുഖമായി മാത്രം ചുരുക്കാതെയും അതിന്റെ പ്രവർത്തനരീതി മൂലപാഠത്തിലധികം നിർവചിക്കാതെയും മലയാളത്തിൽ പ്രചാരമുള്ള സംക്ഷിപ്ത പദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: δαιμονιζομένους എന്നതിലെ ദുഷ്ടാത്മിക പ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: ഭൂതബാധിതർ
  alternative: ദുഷ്ടാത്മാക്കളുടെ സ്വാധീനത്തിലായിരുന്നവർ
  rationale: മൂലപാഠത്തിലെ യഥാർഥ ദുഷ്ടാത്മിക പ്രവർത്തനത്തെ നിലനിർത്തുന്നു. അതേസമയം ‘പൂർണമായി കൈവശപ്പെടുത്തിയവർ’ എന്നതുപോലുള്ള മൂലപാഠം വ്യക്തമായി പറയാത്ത പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ἔφερον എന്ന അപൂർണഭൂതകാലത്തിന്റെ ആഖ്യാനഭാവം
  choice: കൊണ്ടുവരികയായിരുന്നു
  alternative: കൊണ്ടുവന്നു
  rationale: ആളുകളെ തുടർച്ചയായി അവന്റെ അടുക്കൽ കൊണ്ടുവന്നുകൊണ്ടിരുന്ന ആഖ്യാനചലനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വാക്യത്തിലെ ആവർത്തിച്ചുള്ള രണ്ടു സമയസൂചനകളും ഗ്രീക്ക് ഘടനയെ മാനിച്ച് നിലനിർത്തിയിരിക്കുന്നു; തുടർച്ചയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കാൻ ‘കൊണ്ടുവരികയായിരുന്നു’ ഉപയോഗിച്ചു.
