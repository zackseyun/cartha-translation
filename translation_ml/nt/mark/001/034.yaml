source:
  edition: SBLGNT
  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: ml
  text: പലതരം രോഗങ്ങൾ ബാധിച്ചിരുന്ന അനേകരെ അവൻ സൗഖ്യമാക്കി; അനേകം ഭൂതങ്ങളെയും പുറത്താക്കി. ഭൂതങ്ങൾ അവനെ അറിഞ്ഞിരുന്നതിനാൽ, അവയെ സംസാരിക്കാൻ അവൻ അനുവദിച്ചിരുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: സൗഖ്യമാക്കി
  rationale: രോഗം മാറ്റുക, സുഖപ്പെടുത്തുക എന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: രോഗങ്ങൾ ബാധിച്ചിരുന്ന അനേകരെ
  rationale: κακῶς ἔχω എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ‘രോഗിയായിരിക്കുക’ എന്ന അർഥം അക്ഷരാർഥത്തിലെ അസ്വാഭാവികത ഒഴിവാക്കി വ്യക്തമാക്കുന്നു.
- source_word: ποικίλαις νόσοις
  choice: പലതരം രോഗങ്ങൾ
  rationale: ποικίλος സൂചിപ്പിക്കുന്ന വൈവിധ്യവും νόσος സൂചിപ്പിക്കുന്ന രോഗവും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: അനേകം ഭൂതങ്ങളെയും പുറത്താക്കി
  rationale: ἐκβάλλωയുടെ ബലപ്രയോഗത്തിലൂടെയുള്ള പുറത്താക്കൽ എന്ന ആശയം നിലനിർത്തുകയും ഭൂതോച്ചാടനസന്ദർഭത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἤφιεν λαλεῖν
  choice: സംസാരിക്കാൻ അവൻ അനുവദിച്ചില്ല
  rationale: അനുവദിക്കാതിരുന്ന തുടർച്ചയായ നടപടിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὅτι
  choice: അറിയാമായിരുന്നതിനാൽ
  rationale: ὅτι ഇവിടെ കാരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘കാരണം/ആയിരുന്നതിനാൽ’ എന്ന അർഥം വാക്യഘടനയിൽ ചേർത്തിരിക്കുന്നു.
- source_word: ᾔδεισαν αὐτόν
  choice: ഭൂതങ്ങൾക്ക് അവനെ അറിയാമായിരുന്നു
  rationale: ഗ്രീക്കിൽ ഉള്ള ലളിതമായ ‘അവനെ അറിഞ്ഞിരുന്നു’ എന്ന പ്രയോഗം കൂടുതൽ ക്രിസ്തുശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഭൂതങ്ങളുടെ അറിവിനെ വ്യക്തമായ ഒരു ക്രിസ്തുശാസ്ത്രപരമായ തിരിച്ചറിവായി വികസിപ്പിക്കണമോ എന്നത്
  choice: ഭൂതങ്ങൾക്ക് അവനെ അറിയാമായിരുന്നു
  alternative: അവൻ ആരാണെന്ന് ഭൂതങ്ങൾക്ക് അറിയാമായിരുന്നു
  rationale: മൂലപാഠത്തിൽ കർമമായി αὐτόν, ‘അവനെ,’ എന്നത് മാത്രമേ ഉള്ളൂ. സമീപസന്ദർഭത്തിൽനിന്നുള്ള വിശേഷണങ്ങളോ പദവികളോ ചേർക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഭൂതങ്ങൾ’ എന്ന പദം δαιμόνιαയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ആവർത്തനം ഒഴിവാക്കാൻ തുടർന്നുള്ള പരാമർശത്തിൽ ‘അവ’ ഉപയോഗിച്ചു.
