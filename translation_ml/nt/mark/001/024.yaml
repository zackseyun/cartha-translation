source:
  edition: SBLGNT
  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നസറായനായ യേശുവേ, ഞങ്ങൾക്കും നിനക്കും തമ്മിൽ എന്താണ്?[a] ഞങ്ങളെ നശിപ്പിക്കാൻ വന്നതാണോ? നീ ആരാണെന്ന് എനിക്കറിയാം—ദൈവത്തിന്റെ പരിശുദ്ധൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾക്ക് നിന്നോട് എന്ത് കാര്യം?” ഗ്രീക്കിലെ ഈ ശൈലി അകൽച്ചയോ എതിർപ്പോ പ്രകടിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ἡμῖν καὶ σοί
  choice: ഞങ്ങളും നീയും തമ്മിൽ എന്ത്?
  rationale: അക്ഷരാർഥത്തിൽ ‘ഞങ്ങൾക്കും നിനക്കും എന്ത്?’ എന്ന സെമിറ്റിക് സ്വാധീനമുള്ള പ്രയോഗമാണിത്. അകൽച്ചയോ എതിർപ്പോ സൂചിപ്പിക്കുന്ന അതിന്റെ സംക്ഷിപ്തവും തുറന്നതുമായ ഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു; അർഥവ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: നസറായനായ യേശുവേ
  rationale: Ναζαρηνέ എന്ന സംബോധനവിശേഷണം ‘നസറായൻ’ എന്ന രൂപത്തിൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും മലയാളത്തിലെ സ്വാഭാവിക സംബോധനക്രമം പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: ἦλθες
  choice: വന്നതാണോ?
  rationale: ഭൂതകാലത്തിലെ വരവിനെയും ഇപ്പോഴത്തെ സാഹചര്യത്തിലുള്ള അതിന്റെ പ്രസക്തിയെയും സ്വാഭാവികമായ മലയാളചോദ്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀπολέσαι
  choice: നശിപ്പിക്കാൻ
  rationale: ഈ ഭൂതോച്ചാടനസന്ദർഭത്തിൽ ἀπόλλυμι സൂചിപ്പിക്കുന്ന പൂർണനാശത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: ἡμᾶς
  choice: ഞങ്ങളെ
  rationale: മൂലത്തിലെ പ്രഥമപുരുഷ ബഹുവചന കർമരൂപം മാറ്റമില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: οἶδά σε τίς εἶ
  choice: നീ ആരാണെന്ന് എനിക്കറിയാം
  rationale: തിരിച്ചറിവിന്റെ നേരിട്ടുള്ള പ്രഖ്യാപനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പരിശുദ്ധൻ
  rationale: നിശ്ചയാർഥകമായ പദസമുച്ചയത്തിന്റെ സ്ഥാനപ്പേരുസ്വഭാവവും τοῦ θεοῦ എന്ന ജനിറ്റീവ് ബന്ധവും അധിക വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദുഷ്ടാത്മാവിന്റെ തിരിച്ചറിവിലെ ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേര്
  choice: ദൈവത്തിന്റെ പരിശുദ്ധൻ
  alternative: ദൈവത്തിന്റെ പരിശുദ്ധനായവൻ
  rationale: ὁ ἅγιος τοῦ θεοῦ എന്ന പ്രയോഗത്തെ വിപുലമായ സിദ്ധാന്തപ്രഖ്യാപനമാക്കി മാറ്റാതെ, തിരിച്ചറിയൽസ്ഥാനപ്പേരായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. മൂലത്തിലെ സംക്ഷിപ്തവും ഏറ്റുമുട്ടലോടുകൂടിയതുമായ ചോദ്യഭാവം സംരക്ഷിച്ചു; വ്യക്തമല്ലാത്ത ഇടിയത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകി.
