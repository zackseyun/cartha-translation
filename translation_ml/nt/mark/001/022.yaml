source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: ml
  text: അവർ അവന്റെ ഉപദേശത്തിൽ വിസ്മയിച്ചു; കാരണം, അവൻ അവരെ ശാസ്ത്രിമാരെപ്പോലെയല്ല, അധികാരമുള്ള ഒരാളെന്നപോലെ പഠിപ്പിച്ചിരുന്നതുകൊണ്ടാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അധികാരത്തോടെ പഠിപ്പിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: വിസ്മയിച്ചുപോയി
  rationale: ശക്തമായ ആശ്ചര്യപ്രതികരണത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അപൂർണ്ണകാലത്തിന്റെ തുടർച്ചാഭാവം പഠിപ്പിച്ചുകൊണ്ടിരുന്ന സാഹചര്യത്തിൽ വ്യക്തമാണ്.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: അവന്റെ ഉപദേശത്തിൽ
  rationale: διδαχήയുടെ പഠിപ്പിക്കലിനെയും അതിന്റെ ഉള്ളടക്കത്തെയും ഉൾക്കൊള്ളുന്ന, സഭാപരമായ പ്രത്യേക അർഥം അനാവശ്യമായി ചുമത്താത്ത സ്വാഭാവിക പ്രയോഗം.
- source_word: ἦν γὰρ διδάσκων
  choice: കാരണം, അവൻ അവരെ പഠിപ്പിച്ചിരുന്നത്
  rationale: ἦν + വർത്തമാനകൃതന്തം സൂചിപ്പിക്കുന്ന നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ മലയാളത്തിലെ ‘പഠിപ്പിച്ചിരുന്നത്’ എന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: അധികാരമുള്ള ഒരാളെപ്പോലെ
  rationale: ὡς എന്ന താരതമ്യവും ἐξουσία എന്ന അധികാരധാരണയും നേരിട്ട് നിലനിർത്തുന്നു; ‘അധികാരത്തോടെ’ എന്ന കൂടുതൽ സ്വാഭാവികമായ സാധ്യതയെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: യഹൂദനിയമത്തിൽ വിദഗ്ധരായ എഴുത്തുപണ്ഡിതരെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും സംക്ഷിപ്തവുമായ മലയാള പദം; വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ശാസ്ത്രിമാരിൽനിന്ന് വ്യത്യസ്തമായ യേശുവിന്റെ അധികാരത്തിന്റെ സ്വഭാവം
  choice: വാക്യം പറയുന്നതുപോലെ യേശു ‘അധികാരമുള്ള ഒരാളെപ്പോലെ’ പഠിപ്പിച്ചു എന്നു വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവിക അധികാരത്തോടെ’ എന്ന് വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ വാക്യം യേശുവിന്റെ പഠിപ്പിക്കൽ ശാസ്ത്രിമാരുടേതിൽനിന്ന് വ്യത്യസ്തമായിരുന്നെന്ന് വ്യക്തമാക്കുന്നു; എന്നാൽ ആ അധികാരത്തിന്റെ ഉറവിടമോ തത്ത്വശാസ്ത്രപരമായ സ്വഭാവമോ ഇവിടെ തുറന്നുപറയുന്നില്ല. അതിനാൽ ആ അർഥം പരിഭാഷയിൽ കൂട്ടിച്ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ തുടർച്ചാഭാവവും താരതമ്യഘടനയും സംരക്ഷിച്ചു; ‘ശാസ്ത്രിമാർ’ എന്ന ചരിത്രപരമായ പദം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട താരതമ്യപ്രയോഗത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
