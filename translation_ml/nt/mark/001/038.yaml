reference: Mark 1:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നമുക്ക് മറ്റിടങ്ങളിലേക്ക്, അടുത്തുള്ള ചെറുപട്ടണങ്ങളിലേക്കു പോകാം; അവിടെയും പ്രസംഗിക്കാനായി. കാരണം, ഇതിനായിട്ടാണ് ഞാൻ പുറപ്പെട്ടത്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ഉദ്ദേശ്യത്തിനായിട്ടാണ് ഞാൻ പുറപ്പെട്ടത്.’ ഈ വാക്കുകൾ യേശു ഇപ്പോഴുള്ള സ്ഥലത്തുനിന്ന് പുറപ്പെട്ടതിനെ മാത്രമോ, പ്രസംഗിക്കാനായി പുറപ്പെട്ടതെന്ന വിശാലമായ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: നമുക്ക് … പോകാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ ആഹ്വാനാത്മക പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ക്ഷണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀλλαχοῦ
  choice: മറ്റിടങ്ങളിലേക്ക്
  rationale: ഇപ്പോഴുള്ള സ്ഥലത്തുനിന്ന് വേറെയുള്ള സ്ഥലങ്ങളിലേക്കുള്ള നീക്കത്തെ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἐχομένας
  choice: അടുത്തുള്ള
  rationale: സ്ഥലങ്ങളെക്കുറിച്ച് ഉപയോഗിച്ചിരിക്കുന്ന ഈ പദം സമീപത്തുള്ളതോ തുടർന്നുവരുന്നതോ എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥം നൽകുന്നു.
- source_word: κωμοπόλεις
  choice: ചെറുപട്ടണങ്ങൾ
  rationale: ഗ്രാമത്തിനും പട്ടണത്തിനും ഇടയിലുള്ള ചെറിയ ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ഇരുവശവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: അവിടെയും ഞാൻ പ്രസംഗിക്കേണ്ടതിന്
  rationale: ἵνα നൽകുന്ന ഉദ്ദേശ്യഭാവവും καὶ ἐκεῖയിലെ ‘അവിടെയും’ എന്ന ഊന്നലും നിലനിർത്തുന്നു; κηρύσσωയ്ക്ക് സന്ദർഭോചിതമായ ‘പ്രസംഗിക്കുക’ ഉപയോഗിക്കുന്നു.
- source_word: εἰς τοῦτο
  choice: ഇതിനായിട്ടാണ്
  rationale: ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐξῆλθον
  choice: ഞാൻ പുറപ്പെട്ടത്
  rationale: ഒരു സ്ഥലത്തുനിന്ന് പുറപ്പെട്ടതെന്ന പ്രാദേശിക അർഥത്തിനും പ്രസംഗപ്രവർത്തനത്തിനായി പുറപ്പെട്ടതെന്ന വിശാലമായ സൂചനയ്ക്കും ഇടം നൽകുന്നു.
- source_word: λέγει αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള കഥനശൈലിക്ക് സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകുന്നു; അർഥത്തിൽ മാറ്റമില്ല.
theological_decisions:
- issue: ἐξῆλθον എന്നതിന്റെ വ്യാപ്തി
  choice: ‘ഞാൻ പുറപ്പെട്ടത്’ എന്നു പൊതുവായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഞാൻ ഈ സ്ഥലത്തുനിന്ന് പുറപ്പെട്ടത്’ അല്ലെങ്കിൽ ‘ഈ ദൗത്യത്തിനായി ഞാൻ വന്നത്.’
  rationale: യേശു ഇപ്പോഴുള്ള സ്ഥലത്തുനിന്ന് പുറപ്പെട്ടതിനെ മാത്രമോ തന്റെ പ്രസംഗദൗത്യത്തിന്റെ വിശാലമായ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നുവെന്നത് ഗ്രീക്കിൽ നിർണയിച്ചിട്ടില്ല. ഏതെങ്കിലും പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ ആ അർഥസാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ചെറുപട്ടണങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്; പദത്തിന്റെ കൃത്യമായ ജനവാസതല വ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു. അവസാനവാക്യത്തിലെ അർഥവ്യാപ്തി മനപ്പൂർവം തുറന്നുവെച്ചിരിക്കുന്നു.
