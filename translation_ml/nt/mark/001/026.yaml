id: MRK.1.26
reference: Mark 1:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: ml
  text: അശുദ്ധാത്മാവ് അവനെ കോച്ചിവലിപ്പിച്ച്, ഉച്ചത്തിൽ നിലവിളിച്ച്, അവനിൽനിന്ന് പുറത്തുവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαράξαν
  choice: കോച്ചിവലിപ്പിച്ച്
  rationale: ശരീരത്തെ ശക്തമായി കോച്ചിവലിപ്പിക്കുകയോ ഞെട്ടിവിറപ്പിക്കുകയോ ചെയ്യുന്ന പ്രവർത്തിയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികവും ദൃശ്യവുമായ പ്രയോഗം; ‘കീറിക്കൊണ്ട്’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: അശുദ്ധാത്മാവ്
  rationale: സുവിശേഷങ്ങളിലെ സ്ഥിരമായ പ്രയോഗം നിലനിർത്തുകയും ἀκάθαρτος എന്നതിലെ അശുദ്ധിയുടെ ഭാവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: φωνῆσαν
  choice: നിലവിളിച്ചുകൊണ്ട്
  rationale: ഉച്ചത്തിലുള്ള ശബ്ദപ്രകടനത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഭയം, കോപം തുടങ്ങിയ പ്രത്യേക വികാരം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ
  rationale: ശബ്ദത്തിന്റെ ശക്തി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രീതിവാചകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: അവനിൽനിന്ന് പുറത്തുവന്നു
  rationale: ആത്മാവ് ആ മനുഷ്യനെ വിട്ടുപോകുന്നതിന്റെ വ്യക്തിപരവും സ്ഥാനപരവുമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: καὶ ... καὶ
  choice: പ്രവൃത്തികളുടെ ഏകോപിത പരമ്പര
  rationale: ഗ്രീക്കിലെ ലളിതമായ ഏകോപനം മലയാളത്തിൽ പ്രവാഹമുള്ള ഒരു വാക്യമായി നൽകുന്നു; കോച്ചിവലിപ്പിക്കലും നിലവിളിയും പുറത്തുവരവിനോടു ബന്ധപ്പെട്ട മുൻകാല/സഹചര പ്രവർത്തികളായി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ബാധിച്ച സത്തയുടെ സ്വഭാവം
  choice: വ്യക്തിപരമായി പ്രവർത്തിക്കുന്ന അശുദ്ധാത്മാവ്
  alternative: വ്യക്തിത്വമില്ലാത്ത ദുഷ്ടശക്തി
  rationale: കോച്ചിവലിപ്പിക്കുകയും നിലവിളിക്കുകയും മനുഷ്യനിൽനിന്ന് പുറത്തുവരികയും ചെയ്യുന്ന കർത്താവായാണ് മർക്കോസിന്റെ വിവരണത്തിൽ ആത്മാവ് പ്രത്യക്ഷപ്പെടുന്നത്. പാഠത്തിനപ്പുറമുള്ള സിദ്ധാന്തവിവരണം ചേർക്കാതെ ആ വ്യക്തിപരമായ പ്രവർത്തനം പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ഗ്രീക്കിലെ പ്രവർത്തനക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാസംയോജനം ഉപയോഗിച്ചു.
