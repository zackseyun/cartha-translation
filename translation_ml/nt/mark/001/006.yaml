id: MRK.1.6
reference: Mark 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ἦν⸃ ὁ Ἰωάννης ἐνδεδυμένος τρίχας καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, καὶ ἔσθων ἀκρίδας καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: ml
  text: യോഹന്നാൻ ഒട്ടകത്തിന്റെ രോമംകൊണ്ടുള്ള വസ്ത്രം ധരിച്ചിരുന്നതും അരയിൽ തോൽപ്പട്ട കെട്ടിയിരുന്നതും ആയിരുന്നു[a]; അദ്ദേഹം ഭക്ഷിച്ചിരുന്നത് വെട്ടുക്കിളികളും കാട്ടുതേനും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യോഹന്നാന്റെ വസ്ത്രധാരണം 2 രാജാക്കന്മാർ 1:8-ലെ ഏലിയാവിന്റെ വിവരണത്തെ ഓർമിപ്പിക്കുന്നു. യോഹന്നാനെ വഴിയൊരുക്കുന്ന ഒരു പ്രവാചകനായി മർക്കോസ് അവതരിപ്പിക്കുന്നതിൽ ഈ സാദൃശ്യം പങ്കുവഹിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος τρίχας καμήλου
  choice: ഒട്ടകരോമംകൊണ്ടുള്ള വസ്ത്രം ധരിക്കുകയും
  rationale: പൂർണകാല കൃദന്തരൂപം വസ്ത്രം ധരിച്ചിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. τρίχας καμήλου എന്നത് ഒട്ടകത്തിന്റെ തോലല്ല, രോമംകൊണ്ടുള്ള വസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; സ്വാഭാവിക മലയാളത്തിനായി ‘വസ്ത്രം’ വ്യക്തമായി ചേർത്തു.
- source_word: ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ
  choice: അരയിൽ തോൽപ്പട്ട കെട്ടുകയും ചെയ്തിരുന്നു
  rationale: ζώνη അരപ്പട്ടയെയും δερματίνη തോൽകൊണ്ടുള്ളതെന്നും സൂചിപ്പിക്കുന്നു. ‘അരയിൽ’ എന്നത് ὀσφύς എന്ന ശരീരഭാഗത്തിന്റെ വ്യക്തവും ആധുനികവുമായ തുല്യപദമാണ്.
- source_word: ἔσθων
  choice: ഭക്ഷിച്ചിരുന്നു
  rationale: വർത്തമാനകാല കൃദന്തരൂപം യോഹന്നാന്റെ പതിവായോ തുടർന്നുകൊണ്ടിരുന്നതായോ ഉള്ള ആഹാരരീതിയെ ചിത്രീകരിക്കുന്നു; അപൂർണഭൂതകാല സ്വഭാവമുള്ള ഈ രൂപം മലയാളത്തിൽ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀκρίδας
  choice: വെട്ടുക്കിളി
  rationale: ഇവിടെ പദത്തിന്റെ സാധാരണ നിഘണ്ടുർഥം ഭക്ഷ്യമായി ഉപയോഗിച്ചിരുന്ന വെട്ടുക്കിളി എന്ന കീടമാണ്; സസ്യഭക്ഷണമെന്ന വ്യത്യസ്ത വ്യാഖ്യാനത്തിന് സന്ദർഭാധാരം ഇല്ല.
- source_word: μέλι ἄγριον
  choice: കാട്ടുതേൻ
  rationale: കാട്ടിൽ ലഭിക്കുന്ന തേൻ എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്ന, മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: καὶ ἦν
  choice: പ്രത്യേകമായ ആരംഭബന്ധകപദമില്ലാതെ വാക്യം ആരംഭിക്കുന്നു
  rationale: καί വിവരണത്തെ മുൻസന്ദർഭത്തോട് ബന്ധിപ്പിക്കുന്നു; എന്നാൽ മലയാളത്തിൽ തുടർച്ചയായി ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർക്കുന്നത് മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചന നൽകും. വാക്യക്രമവും ക്രിയാബന്ധവും വിവരണത്തിന്റെ തുടർച്ച വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ വസ്ത്രധാരണവും ഏലിയാവുമായുള്ള പ്രവാചകസാദൃശ്യവും
  choice: മുഖ്യപാഠത്തിൽ യോഹന്നാന്റെ വസ്ത്രവും ഭക്ഷണവും വിവരണാത്മകമായി മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: മുഖ്യപാഠത്തിൽത്തന്നെ യോഹന്നാനെ ഏലിയാവിനോടു വ്യക്തമായി ബന്ധപ്പെടുത്തുക.
  rationale: വസ്ത്രവിവരണം 2 രാജാക്കന്മാർ 1:8-ലെ ഏലിയാവിനെ ഓർമിപ്പിക്കുന്നുവെങ്കിലും മർക്കോസ് 1:6 ആ തിരിച്ചറിയൽ തുറന്നു പറയുന്നില്ല. അതിനാൽ അന്തർപാഠബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനം ചേർക്കാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒട്ടകരോമംകൊണ്ടുള്ള വസ്ത്രം’ എന്ന പ്രയോഗം ഒട്ടകത്തോൽ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു. ‘അദ്ദേഹം’ ആവർത്തിക്കുന്നത് രണ്ടാമത്തെ വിവരണഘടകത്തിന് വ്യക്തമായ കർത്താവിനെ നൽകുന്നു.
