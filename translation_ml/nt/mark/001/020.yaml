  source_fidelity: ഗ്രീക്ക് വാക്യത്തിലെ കാലസൂചന (εὐθύς), വിളി (ἐκάλεσεν), പിതാവായ സെബെദിയെ വള്ളത്തിൽ കൂലിക്കാരോടൊപ്പം വിട്ടുപോകൽ (ἀφέντες ... ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν), യേശുവിന്റെ പിന്നാലെ പോകൽ (ἀπῆλθον ὀπίσω αὐτοῦ) എന്നിവ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു. ‘പോയി’ എന്നത് ἀπῆλθον എന്നതിലെ പുറപ്പെടൽസൂചനയെ ഈ സന്ദർഭത്തിൽ മതിയായി വഹിക്കുന്നു.
