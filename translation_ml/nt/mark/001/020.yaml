source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: ml
  text: ഉടനെ അവൻ അവരെ വിളിച്ചു. അവർ തങ്ങളുടെ അപ്പനായ സെബെദിയെ കൂലിക്കാരോടൊപ്പം വള്ളത്തിൽ വിട്ടിട്ട് അവന്റെ പിന്നാലെ പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ പിന്നിൽ പോയി’ എന്നോ ‘അവനെ അനുഗമിച്ചു’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗത്തിന് ഭൗതികമായി പിന്നാലെ പോകുന്നതും ശിഷ്യത്വം ആരംഭിക്കുന്നതും സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ വിവരണത്തിലെ അടിയന്തരതയും കാലസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκάλεσεν
  choice: വിളിച്ചു
  rationale: καλέω എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘കല്പിച്ചു വിളിച്ചു’ എന്ന അധികാരഭാവമോ ‘ക്ഷണിച്ചു’ എന്ന മൃദുത്വമോ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἀφέντες
  choice: വിട്ടിട്ട്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള അനുബന്ധപ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘ഉപേക്ഷിച്ച്’ എന്ന കടുത്ത അർഥം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: πατέρα αὐτῶν Ζεβεδαῖον
  choice: തങ്ങളുടെ അപ്പനായ സെബെദിയെ
  rationale: ബന്ധവും വ്യക്തിനാമവും വ്യക്തമായി നൽകുന്നു; സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായ കുടുംബസംബോധനയായി ‘അപ്പൻ’ ഉപയോഗിക്കുന്നു.
- source_word: πλοίῳ
  choice: വള്ളത്തിൽ
  rationale: ഗലീലക്കടലിലെ മീൻപിടിത്തസന്ദർഭത്തിന് ‘കപ്പൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികവും യോജിച്ചതുമായ പദം.
- source_word: μισθωτῶν
  choice: കൂലിക്കാരോടൊപ്പം
  rationale: കൂലിക്കു ജോലി ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന μισθωτός എന്ന പദത്തിന്റെ ലളിതവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ἀπῆλθον
  choice: പോയി
  rationale: മുൻസ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ സന്ദർഭത്തിൽ വ്യക്തമാണ്; ‘പുറപ്പെട്ടുപോയി’ പോലുള്ള ഭാരമുള്ള രൂപം ആവശ്യമില്ല.
- source_word: ὀπίσω αὐτοῦ
  choice: അവന്റെ പിന്നാലെ
  rationale: യേശുവിന്റെ പിന്നിലൂടെയുള്ള ഭൗതികചലനവും അവനെ അനുഗമിക്കുന്ന ശിഷ്യത്വത്തിന്റെ ആരംഭവും ഒരേസമയം സൂചിപ്പിക്കാൻ കഴിയുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ὀπίσω αὐτοῦ എന്ന പ്രയോഗത്തിലെ ശിഷ്യത്വസൂചന
  choice: അവന്റെ പിന്നാലെ പോയി
  alternative: അവന്റെ പിന്നിൽ പോയി; അവനെ അനുഗമിച്ചു
  rationale: ഗ്രീക്ക് പ്രയോഗം ഭൗതികമായി ഒരാളുടെ പിന്നിൽ പോകുന്നതിനെയും ശിഷ്യനായി അനുഗമിക്കുന്നതിനെയും സൂചിപ്പിക്കാം. ‘പിന്നാലെ പോയി’ ഈ ഇരട്ടസാധ്യത നിലനിർത്തുന്നു; ശിഷ്യത്വാർഥം മാത്രം തിരഞ്ഞെടുത്ത് വ്യാഖ്യാനം ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘അപ്പൻ’, ‘വള്ളം’, ‘കൂലിക്കാർ’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ പ്രവർത്തനക്രമവും അർഥസന്ദിഗ്ധതയും സംരക്ഷിച്ചു.
