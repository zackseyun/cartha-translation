  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: ml
  text: യോഹന്നാൻ കൈമാറപ്പെട്ടശേഷം[a], യേശു ഗലീലയിലേക്കു വന്ന് ദൈവത്തിന്റെ സുവാർത്ത[b][c] പ്രഖ്യാപിച്ചു.
  philosophy: optimal-equivalence
