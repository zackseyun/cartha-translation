    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ സുവിശേഷം.’
    reason: lexical_alternative
  - marker: c
    text: ‘ദൈവത്തിന്റെ’ എന്നതിന് ദൈവത്തിൽനിന്നു വരുന്ന, ദൈവത്തിന്റേതായ, അല്ലെങ്കിൽ ദൈവത്തെ കേന്ദ്രീകരിച്ച സുവാർത്ത എന്നിങ്ങനെ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: ഏല്പിക്കപ്പെട്ടശേഷം
  rationale: μετάയോടുകൂടിയ articular infinitive കാലസൂചനയായി ‘ശേഷം’ എന്നർഥം നൽകുന്നു. παραδίδωμι എന്നതിന്റെ ‘കൈമാറുക/ഏല്പിക്കുക’ എന്ന വിശാലമായ അർഥവും മർക്കോസിലെ പിന്നീടുള്ള പീഡാനുഭവഭാഷയുമായുള്ള ബന്ധവും ‘അറസ്റ്റുചെയ്യപ്പെട്ടശേഷം’ എന്നതിനെക്കാൾ ഇത് സംരക്ഷിക്കുന്നു.
- source_word: Ἰωάννην
  choice: യോഹന്നാൻ
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ വ്യാപകമായി പരിചിതമായ പേരുരൂപം.
- source_word: ἦλθεν
  choice: വന്ന്
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ സ്വാഭാവിക ചലനാർഥം നൽകുന്നു; തുടർന്നുള്ള κηρύσσων-നോട് മലയാളത്തിൽ സുഗമമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ഗലീലയിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യദിശയും ചലനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κηρύσσων
  choice: പ്രഖ്യാപിച്ചു
  rationale: κηρύσσω പൊതുവായി വിളംബരം ചെയ്യുകയോ പ്രഖ്യാപിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രസംഗിച്ചു’ എന്നത് പ്രസംഗരൂപത്തിലേക്ക് അർഥം ചുരുക്കാനിടയുള്ളതിനാൽ ‘പ്രഖ്യാപിച്ചു’ തെരഞ്ഞെടുത്തു.
- source_word: εὐαγγέλιον
  choice: സുവാർത്ത
  rationale: εὐαγγέλιον എന്നതിന്റെ ‘നല്ല വാർത്ത’ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സഭാഭാഷയിൽ പരിചിതവുമായ ‘സുവാർത്ത’ വ്യക്തമാക്കുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: 'ഗ്രീക്കിലെ genitive-ന്റെ വിശാലത നിലനിർത്തുന്നു: ദൈവത്തിൽനിന്നുള്ളത്, ദൈവത്തിന്റേത്, ദൈവത്തെ കേന്ദ്രീകരിച്ചതെന്നിങ്ങനെ ബന്ധം മനസ്സിലാക്കാം; മുഖ്യപാഠം ഇവയിൽ ഒന്ന് മാത്രം നിശ്ചയിക്കുന്നില്ല.'
theological_decisions:
- issue: മർക്കോസിലെ പീഡാനുഭവവിവരണവുമായി παραδοθῆναι എന്ന പദത്തിനുള്ള ബന്ധം
  choice: ഏല്പിക്കപ്പെട്ടശേഷം
  alternative: അറസ്റ്റുചെയ്യപ്പെട്ടശേഷം
  rationale: ‘ഏല്പിക്കപ്പെട്ടു’ എന്നത് ശത്രുക്കളുടെ കയ്യിലേക്കുള്ള കൈമാറ്റത്തെ ഉൾക്കൊള്ളുന്നതിനൊപ്പം, യേശുവിനെ ‘ഏല്പിക്കുന്ന’ പിന്നീടുള്ള മർക്കോസിന്റെ ഭാഷയുമായുള്ള ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ അനുരണനം സംരക്ഷിക്കുന്നു.
- issue: τὸ εὐαγγέλιον τοῦ θεοῦ എന്നതിലെ genitive-ന്റെ വ്യാപ്തി
  choice: ദൈവത്തിന്റെ സുവാർത്ത
  alternative: ദൈവത്തിൽനിന്നുള്ള സുവാർത്ത / ദൈവത്തെക്കുറിച്ചുള്ള സുവാർത്ത
  rationale: മൂലപാഠത്തിലെ ബന്ധം ഒന്നിലധികം പരസ്പരബന്ധിത അർഥങ്ങൾ അനുവദിക്കുന്നു. ‘ദൈവത്തിന്റെ’ എന്ന രൂപം അവയിൽ ഒന്ന് മാത്രം തിരഞ്ഞെടുത്ത് അവ്യക്തത ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഏല്പിക്കപ്പെട്ടു’ എന്ന പദം മൂലത്തിലെ വിശാലതയും മർക്കോസിലെ പദാനുരണനവും കാത്തുസൂക്ഷിക്കുന്നു. ‘സുവാർത്ത’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും പരമ്പരാഗത ‘സുവിശേഷം’ എന്ന പദത്തേക്കാൾ വാർത്താസ്വഭാവം നേരിട്ട് വ്യക്തമാക്കുന്നതുമാണ്.
