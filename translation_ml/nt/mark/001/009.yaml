  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പരമ്പരാഗതമായി പരിചിതമായ ‘യേശു,’ ‘യോഹന്നാൻ,’ ‘സ്നാനം’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യമായ പുരാതനപ്രയോഗങ്ങളും സഭാവിഭാഗപരമായ വിശദീകരണങ്ങളും ഒഴിവാക്കി.
