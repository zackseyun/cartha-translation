source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: ml
  text: ആ ദിവസങ്ങളിൽ ഗലീലയിലെ നസറെത്തിൽനിന്ന് യേശു വന്നു; യോർദാനിൽ യോഹന്നാനാൽ സ്നാനം ഏറ്റു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോർദാനിലേക്കു.” ഗ്രീക്കിലെ മുൻപ്രത്യയം കൂടുതൽ പദാനുപദമായി ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: Καὶ ἐγένετο എന്നത് ഇവിടെ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന സാധാരണ ഗ്രീക്ക് ആഖ്യാനപ്രയോഗമാണ്. മലയാളത്തിൽ ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു യാന്ത്രികമായി ചേർക്കാതെ, കാലസൂചനയിലൂടെ സ്വാഭാവികമായി അതിന്റെ ആഖ്യാനധർമ്മം നിലനിർത്തുന്നു.
- source_word: ἦλθεν Ἰησοῦς
  choice: യേശു വന്നു
  rationale: അടിസ്ഥാന ഗതിക്രിയയായ ἦλθεν-നെ ലളിതവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: ഗലീലയിലെ നസറെത്തിൽനിന്ന്
  rationale: സ്ഥലങ്ങൾ തമ്മിലുള്ള ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐβαπτίσθη
  choice: സ്നാനം ഏറ്റു
  rationale: ഗ്രീക്കിലെ ഭൂതകാല കർമണിപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സ്നാനരീതിയെക്കുറിച്ച് വാക്യം പറയുന്നതിലും അധികമായ സഭാവിഭാഗപരമായ പ്രത്യേകത ചേർക്കുന്നില്ല.
- source_word: εἰς τὸν Ἰορδάνην
  choice: യോർദാനിൽ
  rationale: സ്നാനം നടന്ന സ്ഥലത്തെ സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ പറയുന്നു. εἰς എന്നതിന്റെ കൂടുതൽ പദാനുപദമായ ഗതിസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὑπὸ Ἰωάννου
  choice: യോഹന്നാനാൽ
  rationale: ὑπό + ഷഷ്ഠി കർമണിവാക്യത്തിലെ പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു; ‘യോഹന്നാനാൽ’ അതിനെ സംക്ഷിപ്തവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: βαπτίζω എന്ന പദത്തിന്റെ സഭാവിഭാഗപരമായി സംവേദനക്ഷമമായ പരിഭാഷ
  choice: സ്നാനം ഏറ്റു
  alternative: മുക്കപ്പെട്ടു
  rationale: വാക്യം സ്നാനസംഭവം അറിയിക്കുന്നുവെങ്കിലും രീതി നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല. ‘മുക്കപ്പെട്ടു’ എന്നു നൽകിയാൽ മൂലവാക്യം ആവശ്യപ്പെടുന്നതിലധികം പ്രത്യേകമായ ഒരു രീതിയെ മുൻനിർത്താൻ ഇടയുണ്ട്.
- issue: εἰς τὸν Ἰορδάνην എന്നതിലെ സ്ഥലമോ ഗതിയോ എന്ന സൂക്ഷ്മത
  choice: യോർദാനിൽ
  alternative: യോർദാനിലേക്കു / യോർദാനിനകത്തേക്ക്
  rationale: സന്ദർഭത്തിൽ സ്നാനം നടന്ന സ്ഥലം എന്ന വായന മലയാളത്തിൽ ഏറ്റവും സ്വാഭാവികമാണ്; എന്നാൽ εἰς എന്ന മുൻപ്രത്യയത്തിന്റെ കൂടുതൽ പദാനുപദമായ ‘into’ സൂക്ഷ്മത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
