source:
  edition: SBLGNT
  text: καὶ ⸀προβὰς ὀλίγον εἶδεν Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ αὐτοὺς ἐν τῷ πλοίῳ καταρτίζοντας τὰ δίκτυα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: ml
  text: കുറച്ചുകൂടി മുന്നോട്ടു പോയപ്പോൾ, സെബെദിയുടെ മകൻ യാക്കോബിനെയും അവന്റെ സഹോദരനായ യോഹന്നാനെയും യേശു കണ്ടു. അവർ വള്ളത്തിലിരുന്ന് വലകൾ നന്നാക്കുകയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വലകൾ ക്രമപ്പെടുത്തുകയായിരുന്നു” എന്നോ “വലകൾ ഒരുക്കുകയായിരുന്നു” എന്നോ പരിഭാഷപ്പെടുത്താം; എന്തെങ്കിലും ശരിയായ നിലയിലാക്കുക, അറ്റകുറ്റം തീർക്കുക, ഒരുക്കുക എന്നീ അർഥങ്ങൾ ഗ്രീക്ക് ക്രിയയ്ക്കുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: അവിടെനിന്ന് കുറച്ചുകൂടി മുന്നോട്ടു ചെന്നപ്പോൾ
  rationale: Aorist participle is rendered as a natural Malayalam temporal clause, while ὀλίγον retains the sense of continuing only a short distance.
- source_word: εἶδεν
  choice: യേശു കണ്ടു
  rationale: The simple narrative sense is preserved. Malayalam benefits from making the understood subject explicit; the preceding context identifies him as Jesus.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: സെബെദിയുടെ മകൻ യാക്കോബിനെ
  rationale: The Greek genitive construction identifies James by parentage; this is its direct and natural Malayalam equivalent.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: അവന്റെ സഹോദരനായ യോഹന്നാനെ
  rationale: αὐτοῦ most naturally refers to James, and the Malayalam phrasing clearly preserves that relationship.
- source_word: ἐν τῷ πλοίῳ
  choice: വള്ളത്തിൽ
  rationale: In this Galilean fishing setting, വള്ളം is natural modern Malayalam for the particular fishing boat in view.
- source_word: καταρτίζοντας
  choice: നന്നാക്കുകയായിരുന്നു
  rationale: In the context of fishing nets, the verb most naturally denotes restoring or putting them into proper condition; the footnote preserves the broader possibility of preparing or arranging them.
- source_word: τὰ δίκτυα
  choice: വലകൾ
  rationale: This is the ordinary Malayalam term for fishing nets. No possessive is added because the Greek has none explicitly.
- source_word: καὶ αὐτούς
  choice: അവരും
  rationale: Malayalam naturally recasts the accusative-plus-participle perception construction as a finite clause, while also retaining the emphatic sense that these men too were in a boat.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ഗ്രീക്കിലെ participial structure സ്വാഭാവികമായ കാലവാക്യമായും finite clause ആയും അവതരിപ്പിച്ചു. ആവർത്തിച്ചുള്ള καί ഘടന മലയാളത്തിലെ പ്രവാഹത്തിന് അനുസരിച്ച് വിഭജിച്ചെങ്കിലും സംഭവക്രമവും ‘അവരും’ എന്ന ഊന്നലും നിലനിർത്തി.
