translation:
  language: ml
  text: മശീഹയായ യേശുവിന്റെ സദ്വാർത്തയുടെ ആരംഭം[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സുവിശേഷം.’ εὐαγγέλιον എന്ന ഗ്രീക്ക് പദം ‘സദ്വാർത്ത’ എന്നും പരമ്പരാഗതമായി ‘സുവിശേഷം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
