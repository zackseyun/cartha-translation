    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: ആരംഭം
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് നാമപദപ്രയോഗത്തിന്റെ ശീർഷകസദൃശമായ ഭാവം നിലനിർത്തുന്നു; കഥയുടെയോ പ്രഖ്യാപനത്തിന്റെയോ തുടക്കം എന്ന ആശയം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: εὐαγγελίου
  choice: സദ്വാർത്ത
  rationale: εὐαγγέλιον എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം സാധാരണ ആധുനിക വായനക്കാർക്ക് നേരിട്ട് വ്യക്തമാക്കുന്നു; പരമ്പരാഗതമായ ‘സുവിശേഷം’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള മാനദണ്ഡരൂപത്തിൽ വ്യക്തിനാമം നൽകിയിരിക്കുന്നു.
- source_word: χριστοῦ
  choice: മശീഹയായ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ പേരിന്റെ ഭാഗമെന്നപോലെ ‘ക്രിസ്തു’ എന്നു മാത്രം ലിപ്യന്തരണം ചെയ്യാതെ ‘മശീഹ’ എന്ന പദവിയായി പരിഭാഷപ്പെടുത്തി; ‘-യായ’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി യേശുവിനെ ആ പദവിയാൽ തിരിച്ചറിയിക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്നത് പരിഭാഷപ്പെടുത്തിയ പദവിയായോ പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപത്തിലോ നൽകണോ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുവായ യേശു / യേശുക്രിസ്തു
  rationale: മർക്കോസ് 1:1-ൽ Χριστός മശീഹാപദവിയെ സൂചിപ്പിക്കുന്നു. ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് അതിന്റെ യഹൂദ പശ്ചാത്തലവും പദവിയുടെ അർഥവും വ്യക്തമാക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: τοῦ εὐαγγελίου Ἰησοῦ χριστοῦ എന്ന ജനിറ്റീവ് ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ‘യേശുവിന്റെ സദ്വാർത്ത’ എന്ന തുറന്ന ജനിറ്റീവ് ഘടന നിലനിർത്തി
  alternative: ‘യേശുവിനെക്കുറിച്ചുള്ള സദ്വാർത്ത’
  rationale: ഗ്രീക്ക് പ്രയോഗം യേശുവിനെക്കുറിച്ചുള്ള സദ്വാർത്തയെയും യേശുവിൽനിന്നുള്ളതോ അവനോടു ബന്ധപ്പെട്ടതോ ആയ സദ്വാർത്തയെയും ഉൾക്കൊള്ളാൻ കഴിയും. ‘യെക്കുറിച്ചുള്ള’ എന്നു മാത്രം നൽകിയാൽ ആ അർഥപരിധി ചുരുങ്ങും; മലയാളത്തിലെ ജനിറ്റീവ് രൂപം യഥാർത്ഥത്തിലെ സംക്ഷിപ്തതയും അർഥസാധ്യതയും കൂടുതൽ നന്നായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനദണ്ഡ മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ക്രിയയില്ലാത്ത, ശീർഷകസദൃശമായ സംക്ഷിപ്ത തുടക്കം നിലനിർത്തിയിരിക്കുന്നു. ‘സദ്വാർത്ത’ സാധാരണ വായനക്കാർക്ക് അർഥം നേരിട്ട് നൽകുന്നു; സഭാപാരമ്പര്യത്തിലെ ‘സുവിശേഷം’ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
