source:
  edition: SBLGNT
  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: ml
  text: 'അവൻ ഇങ്ങനെ പ്രസംഗിച്ചുകൊണ്ടിരുന്നു: “എന്നെക്കാൾ ശക്തനായവൻ എനിക്കു പിന്നാലെ വരുന്നു. കുനിഞ്ഞ് അവന്റെ ചെരിപ്പുകളുടെ വാറ് അഴിക്കാൻ ഞാൻ യോഗ്യനല്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യോഗ്യനല്ല” എന്നതിന് “തക്കവനല്ല” അല്ലെങ്കിൽ “പ്രാപ്തനല്ല” എന്നും പരിഭാഷപ്പെടുത്താം; വരുന്നവന്റെ മുമ്പിലുള്ള യോഹന്നാന്റെ ആഴമായ താഴ്മയാണ് പ്രയോഗം വ്യക്തമാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: പ്രസംഗിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്ന അഥവാ ആവർത്തിച്ച പ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രസംഗിക്കുക’ ആധുനിക മലയാളത്തിൽ പൊതുവായി ഗ്രഹിക്കാവുന്നതും സന്ദേശം പരസ്യമായി അറിയിക്കുന്ന ഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: λέγων
  choice: ഇങ്ങനെ
  rationale: പ്രധാന ക്രിയയോടു ചേർന്ന് ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് വർത്തമാന കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇങ്ങനെ’ എന്നു സംയോജിപ്പിച്ചു.
- source_word: Ἔρχεται
  choice: വരുന്നു
  rationale: സന്നിഹിതത്വവും ഉടൻ സംഭവിക്കുന്നതിന്റെ ഭാവവും നൽകുന്ന വർത്തമാനകാലപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὁ ἰσχυρότερός μου
  choice: എന്നെക്കാൾ ശക്തനായവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ താരതമ്യവിശേഷണം വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘ശക്തനായവൻ’ ἰσχυρός എന്നതിന്റെ ലളിതവും സ്വാഭാവികവുമായ അർഥം നൽകുന്നു.
- source_word: ὀπίσω μου
  choice: എനിക്കു പിന്നാലെ
  rationale: യോഹന്നാനുശേഷം വരുന്നു എന്ന കാലക്രമഭാവവും പിന്നിൽ വരുന്നു എന്ന സ്ഥാനഭാവവും മലയാളപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἱκανὸς
  choice: യോഗ്യനല്ല
  rationale: ഇവിടെ കേവല കഴിവില്ലായ്മയേക്കാൾ വരാനിരിക്കുന്നവന്റെ മുമ്പിലുള്ള അയോഗ്യതയും താഴ്മയുമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മറ്റ് സാദ്ധ്യാർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: κύψας λῦσαι
  choice: കുനിഞ്ഞ് ... അഴിക്കാൻ
  rationale: കുനിയുന്നതും തുടർന്ന് വാറ് അഴിക്കുന്നതുമായ ക്രമം സ്വാഭാവിക മലയാളത്തിൽ കൃദന്തവും ഉദ്ദേശ്യരൂപവുംകൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: അവന്റെ ചെരിപ്പുകളുടെ വാറ്
  rationale: പുരാതന പാദരക്ഷ കെട്ടിയിരുന്ന തോൽവാറിനെയാണ് ἱμάντα സൂചിപ്പിക്കുന്നത്; ‘ചെരിപ്പുകളുടെ വാറ്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
theological_decisions:
- issue: യോഹന്നാന്റെ പ്രസ്താവനയിലെ താഴ്മയുടെ തീവ്രത
  choice: യോഗ്യനല്ല
  alternative: പ്രാപ്തനല്ല / തക്കവനല്ല
  rationale: ἱκανός എന്നതിന് മതിയായവൻ, പ്രാപ്തൻ എന്നീ അർഥങ്ങൾ ഉണ്ടായാലും, മേലങ്കി വരുന്ന വ്യക്തിയുടെ ചെരിപ്പുവാറ് അഴിക്കാനുള്ള ദാസ്യപ്രവൃത്തിക്കുപോലും താൻ യോഗ്യനല്ലെന്ന വ്യക്തിപരമായ താഴ്മയാണ് ഈ സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്. ഇതിൽ പാഠത്തിന് അതീതമായ സിദ്ധാന്തവാദം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്കിലെ തുടർച്ചാഭാവം ‘പ്രസംഗിച്ചുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തി. ‘ചെരിപ്പ്’ സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്നതിനാൽ ഉപയോഗിച്ചു; വാറ് എന്ന വിശദീകരണം പുരാതന പാദരക്ഷയുടെ രൂപം വ്യക്തമാക്കുന്നു.
