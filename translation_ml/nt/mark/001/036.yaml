lexical_decisions:
- source_word: κατεδίωξεν
  choice: തിരഞ്ഞുപിടിക്കാൻ പിന്നാലെ ചെന്നു
  rationale: καταδιώκω എന്ന ക്രിയയ്ക്കുള്ള ഊർജസ്വലമായ പിന്തുടരൽ എന്ന ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; വെറും ‘അന്വേഷിച്ചു’ എന്നതിനെക്കാൾ ശക്തമാണ്, എന്നാൽ പ്രതികൂലമായ ‘വേട്ടയാടി’ എന്ന ഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: സമീപസന്ദർഭത്തിൽ ഈ സർവനാമം യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: Σίμων
  choice: ശിമോൻ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: οἱ μετ’ αὐτοῦ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്നവരും
  rationale: ‘അവനോടുകൂടെ ഉണ്ടായിരുന്നവർ’ എന്ന ഗ്രീക്ക് പ്രയോഗം വ്യാഖ്യാനപരമായ അധികവിവരം ചേർക്കാതെ വ്യക്തമായി നൽകുന്നു.
- source_word: καὶ
  choice: -ഉം … -ഉം
  rationale: വാക്യാരംഭത്തിലെ καί മുൻവിവരണത്തോടുള്ള ബന്ധവും ശിമോനെയും കൂടെയുള്ളവരെയും ചേർക്കുന്ന ഏകോപനവും മലയാളത്തിലെ സ്വാഭാവിക സംയോജകപ്രത്യയങ്ങളിലൂടെ പ്രകടമാക്കുന്നു.
