id: MRK.1.8
reference: Mark 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളെ വെള്ളംകൊണ്ട് സ്നാനപ്പെടുത്തി; എന്നാൽ അവൻ നിങ്ങളെ പരിശുദ്ധാത്മാവിൽ[a] സ്നാനപ്പെടുത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരിശുദ്ധാത്മാവുകൊണ്ട്.” ഗ്രീക്ക് ἐν എന്ന മുൻസർഗം ഈ രണ്ടു രീതിയിലും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിൽ സർവനാമം വ്യക്തമായി നൽകിയിരിക്കുന്നതിനാൽ, പിന്നാലെയുള്ള αὐτός എന്നതുമായുള്ള ഊന്നിയ വൈരുധ്യം നിലനിർത്താൻ ചേർത്തു.
- source_word: ἐβάπτισα
  choice: സ്നാനപ്പെടുത്തി
  rationale: βαπτίζω എന്നതിന്റെ ആചാരപരവും അന്തർപാഠപരവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ പ്രയോഗം; ‘മുക്കി’ എന്നത് രീതിയെ അനാവശ്യമായി പരിമിതപ്പെടുത്താം.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: ബഹുവചന ദ്വിതീയപുരുഷ കർമസർവനാമം സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: ὕδατι
  choice: വെള്ളംകൊണ്ട്
  rationale: ഉപകരണാർഥമുള്ള ദത്തിവ് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘വെള്ളത്തിൽ’ എന്ന സ്ഥലമോ മേഖലയോ സൂചിപ്പിക്കുന്ന വായനയും വ്യാകരണപരമായി സാധ്യമെങ്കിലും ഇവിടെ ഉപകരണാർഥം പ്രധാനപാഠത്തിൽ തെരഞ്ഞെടുത്തു.
- source_word: αὐτὸς
  choice: അവൻ
  rationale: യോഹന്നാനും വരാനിരിക്കുന്നവനും തമ്മിലുള്ള ഊന്നിയ വൈരുധ്യം ‘എന്നാൽ അവൻ’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: യോഹന്നാന്റെ സ്നാനവും വരാനിരിക്കുന്നവന്റെ സ്നാനവും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം പ്രകടിപ്പിക്കുന്നു.
- source_word: βαπτίσει
  choice: സ്നാനപ്പെടുത്തും
  rationale: ഭാവികാലം സംരക്ഷിക്കുകയും ἐβάπτισα എന്ന മുൻക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν
  choice: -യിൽ
  rationale: ἐν + ദത്തിവിന്റെ മേഖലാസൂചന ഇവിടെ ‘പരിശുദ്ധാത്മാവിൽ’ എന്ന് നേരിട്ട് നിലനിർത്തുന്നു. ഉപകരണാർഥത്തിൽ ‘പരിശുദ്ധാത്മാവുകൊണ്ട്’ എന്നും വിവർത്തനം ചെയ്യാം; അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: πνεύματι ἁγίῳ
  choice: പരിശുദ്ധാത്മാവ്
  rationale: മർക്കോസിലെ സന്ദർഭത്തിൽ ദൈവിക പരിശുദ്ധാത്മാവിനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിലെ സ്ഥിരവും മാന്യവുമായ പദം.
theological_decisions:
- issue: πνεύματι ἁγίῳ ദൈവിക പരിശുദ്ധാത്മാവിനെയാണോ അതോ വ്യക്തിത്വമില്ലാത്ത വിശുദ്ധശക്തിയെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: പരിശുദ്ധാത്മാവ്
  alternative: ഒരു വിശുദ്ധാത്മാവ് / വിശുദ്ധശക്തി
  rationale: യോഹന്നാന്റെ ജലസ്നാനവും ശക്തനായ വരാനിരിക്കുന്നവന്റെ സ്നാനവും തമ്മിലുള്ള മർക്കോസിന്റെ വൈരുധ്യത്തിൽ, ഈ പ്രയോഗം ദൈവിക പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം; വാക്യം പറയുന്നതിലധികം വിശദീകരണം ചേർത്തിട്ടില്ല.
- issue: ἐν πνεύματι ἁγίῳ എന്നതിലെ ἐν എങ്ങനെ വിവർത്തനം ചെയ്യണം
  choice: പരിശുദ്ധാത്മാവിൽ
  alternative: പരിശുദ്ധാത്മാവുകൊണ്ട്
  rationale: ഗ്രീക്ക് ἐν മേഖലയും ഉപകരണവും സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിൽ കൂടുതൽ ഔപചാരികമായി ‘-യിൽ’ നിലനിർത്തി; ഉപകരണാർഥമുള്ള സ്വാഭാവിക മലയാളവായന അടിക്കുറിപ്പിൽ നൽകി, വ്യാഖ്യാനസാധ്യതകൾ അനാവശ്യമായി ഒതുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ബൈബിൾശൈലി. ‘സ്നാനപ്പെടുത്തി’ എന്ന പരിചിത പദം ആചാരപരമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു. യോഹന്നാന്റെ ‘ഞാൻ’ എന്നും വരാനിരിക്കുന്നവന്റെ ‘അവൻ’ എന്നും തമ്മിലുള്ള ഊന്നിയ വൈരുധ്യം വ്യക്തമായി സൂക്ഷിച്ചു.
