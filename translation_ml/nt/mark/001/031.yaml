  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: ml
  text: അവൻ അവളുടെ അടുത്തേക്കു ചെന്ന്, അവളുടെ കൈപിടിച്ച് അവളെ എഴുന്നേൽപ്പിച്ചു; പനി അവളെ വിട്ടുമാറി, അവൾ അവർക്കു ശുശ്രൂഷ ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർക്കു ശുശ്രൂഷിക്കാൻ തുടങ്ങി.” ഗ്രീക്കിലെ അപൂർണ്ണഭൂതകാല ക്രിയ അവൾ ശുശ്രൂഷ ചെയ്തുകൊണ്ടിരുന്നതിനെ സൂചിപ്പിക്കാം; സൗഖ്യം ലഭിച്ചശേഷം അവൾ ശുശ്രൂഷിക്കാൻ തുടങ്ങി എന്നും സന്ദർഭം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: അടുത്തുചെന്ന്
  rationale: യേശു അവളുടെ അടുക്കലേക്കു നീങ്ങിയതും തുടർന്ന് പ്രധാന പ്രവൃത്തി ചെയ്തതുമായ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἤγειρεν
  choice: എഴുന്നേൽപ്പിച്ചു
  rationale: ἐγείρω എന്ന ക്രിയയുടെ ‘എഴുന്നേൽപ്പിക്കുക’ എന്ന ശക്തി നിലനിർത്തുന്നു; വെറും ‘എഴുന്നേൽക്കാൻ സഹായിച്ചു’ എന്ന് ദുർബലമാക്കുന്നില്ല.
- source_word: κρατήσας τῆς χειρός
  choice: അവളുടെ കൈപിടിച്ച്
  rationale: കൈയിൽ പിടിക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: പനി അവളെ വിട്ടുമാറി
  rationale: പനി അവളെ വിട്ടു എന്ന ഗ്രീക്ക് വാക്യഘടനയും രോഗം മാറിയെന്ന സ്വാഭാവിക മലയാള അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: διηκόνει
  choice: ശുശ്രൂഷിച്ചു
  rationale: διακονέω ഇവിടെ സന്നിഹിതരായവർക്കു സേവനം ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. ‘ശുശ്രൂഷിച്ചു’ മാന്യവും പൊതുവായി മനസ്സിലാകുന്നതുമാണ്; അപൂർണ്ണഭൂതകാലത്തിന്റെ ദൈർഘ്യമോ ആരംഭഭാവമോ മുഖ്യവാചകത്തിൽ അധികമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: αὐτοῖς
  choice: അവരെ
  rationale: ബഹുവചന സർവനാമം യേശുവിനെ മാത്രം അല്ല, അവിടെയുണ്ടായിരുന്ന സംഘത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ബഹുവചനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐγείρω എന്ന പദത്തിന് ഉയിർപ്പുസംബന്ധമായ അനുരണനം ഉണ്ടാകാവുന്നത്
  choice: എഴുന്നേൽപ്പിച്ചു
  alternative: എഴുന്നേൽക്കാൻ സഹായിച്ചു
  rationale: സന്ദർഭത്തിൽ ഇത് രോഗശയ്യയിൽനിന്ന് എഴുന്നേൽപ്പിക്കുന്ന പ്രവൃത്തിയാണ്. എങ്കിലും ക്രിയയുടെ ശക്തി നിലനിർത്തി, വ്യക്തമായ ഉയിർപ്പുപരാമർശം വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: διηκόνει എന്ന അപൂർണ്ണഭൂതകാലത്തിന്റെ ഭാവം
  choice: ശുശ്രൂഷിച്ചു
  alternative: ശുശ്രൂഷിക്കാൻ തുടങ്ങി
  rationale: സൗഖ്യം ലഭിച്ചതിന്റെ തൽഫലമായി സേവനം ആരംഭിച്ചുവെന്നത് സന്ദർഭത്തിൽ സാധ്യമാണ്; എന്നാൽ ഗ്രീക്ക് രൂപം തുടരുന്ന പ്രവൃത്തിയെയും ലളിതമായ ഭൂതകാല വിവരണത്തെയും അനുവദിക്കുന്നു. അതിനാൽ മുഖ്യവാചകം ഭാവം നിർബന്ധമായി തീർപ്പാക്കാതെ, വ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പ്രവർത്തനങ്ങളുടെ ക്രമം സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ആദ്യ രണ്ടു ഗ്രീക്ക് ഘടകങ്ങൾ ഒരൊറ്റ മലയാള വാക്യത്തിൽ ചേർത്തു. καί എന്ന ബന്ധകത്തിന് ഇവിടെ ഉടനടിത്തം നിർബന്ധമല്ലെങ്കിലും സംഭവക്രമം വ്യക്തമാക്കാൻ ‘ഉടനെ’ ഉപയോഗിച്ചു; വായനാസൗകര്യത്തിനായി അർദ്ധവിരാമവും ചേർത്തു.
