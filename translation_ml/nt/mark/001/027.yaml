reference: Mark 1:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: ml
  text: 'എല്ലാവരും വിസ്മയപ്പെട്ടു[a]. അങ്ങനെ അവർ പരസ്പരം ചർച്ച ചെയ്തു: “ഇതെന്താണ്? അധികാരത്തോടെയുള്ള ഒരു പുതിയ ഉപദേശം! അശുദ്ധാത്മാക്കളോടുപോലും അവൻ കല്പിക്കുന്നു; അവ അവനെ അനുസരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഇതെന്താണ്? അധികാരത്തോടെയുള്ള ഈ പുതിയ ഉപദേശം എന്താണ്?” ‘പുതിയ ഉപദേശം’ എന്നത് ചോദ്യത്തോട് കൂടുതൽ നേരിട്ട് ചേർത്ത് ഗ്രീക്ക് വാക്യത്തിന് വിരാമചിഹ്നം നൽകാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: വിസ്മയിച്ചു
  rationale: ശക്തമായ ആശ്ചര്യത്താൽ ബാധിക്കപ്പെട്ട പ്രതികരണമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്. ‘വിസ്മയിച്ചു’ സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമാണ്; മൂലത്തിലെ തീവ്രത അതിരുകടന്ന് വർധിപ്പിക്കുന്നില്ല.
- source_word: ἅπαντες
  choice: അവരെല്ലാവരും
  rationale: കൂട്ടത്തിലുള്ള എല്ലാവരെയും ഊന്നിപ്പറയുന്ന സമഗ്രത മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: അതുകൊണ്ട് അവർ പരസ്പരം ചർച്ചചെയ്തുകൊണ്ട്
  rationale: ὥστε ഫലത്തെ സൂചിപ്പിക്കുന്നു; συζητεῖν പരസ്പര ചർച്ചയെയോ ആലോചനയെയോ സൂചിപ്പിക്കുന്നു. ശത്രുതാപരമായ തർക്കം എന്ന ആശയം ചേർക്കാതെ കൂട്ടായ പ്രതികരണം നിലനിർത്തുന്നു.
- source_word: Τί ἐστιν τοῦτο;
  choice: ഇതെന്താണ്?
  rationale: മൂലത്തിലെ നേരിട്ടുള്ള, അമ്പരപ്പോടെയുള്ള ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: διδαχὴ καινή
  choice: ഒരു പുതിയ ഉപദേശം
  rationale: διδαχή ഇവിടെ പഠിപ്പിക്കൽ/ഉപദേശം എന്ന അർഥത്തിലാണ്. ‘സിദ്ധാന്തം’ എന്ന സാങ്കേതിക ഭാവം ഒഴിവാക്കി രംഗത്തിന് ചേരുന്ന ‘ഉപദേശം’ തെരഞ്ഞെടുത്തു.
- source_word: κατ’ ἐξουσίαν
  choice: അധികാരത്തോടെയുള്ള
  rationale: യേശുവിന്റെ ഉപദേശത്തിന്റെയും തുടർന്നുള്ള കല്പനയുടെയും അധികാരസ്വഭാവം പ്രകടമാക്കുന്നു; വാക്യഘടനയിലെ ബന്ധം പൂർണമായി അടച്ചുപൂട്ടാതെ സ്വാഭാവികമായ വായന നൽകുന്നു.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: അശുദ്ധാത്മാക്കളോട്
  rationale: ἀκάθαρτος എന്ന പദത്തിന്റെ അശുദ്ധതാസൂചന ‘അശുദ്ധ’ കാത്തുസൂക്ഷിക്കുന്നു; ‘ആത്മാക്കൾ’ സാധാരണ ബൈബിൾ-മലയാളത്തിലും ആധുനിക ഉപയോഗത്തിലും ഗ്രാഹ്യമാണ്.
- source_word: ἐπιτάσσει
  choice: കല്പിക്കുന്നു
  rationale: അധികാരപൂർവമായ ആജ്ഞയെ സൂചിപ്പിക്കുന്ന ശക്തമായതും സ്വാഭാവികവുമായ മലയാളക്രിയയാണ്.
- source_word: ὑπακούουσιν αὐτῷ
  choice: അവ അവനെ അനുസരിക്കുന്നു
  rationale: കല്പനയോടുള്ള അനുസരണപ്രതികരണം വ്യക്തമായി നൽകുന്നു. ‘അവ’ എന്ന സർവനാമം ആത്മാക്കളെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അധികാരത്തോടെ’ എന്ന ആശയത്തിന്റെ വാക്യഘടനാപരമായ ബന്ധം
  choice: ‘അധികാരത്തോടെയുള്ള ഒരു പുതിയ ഉപദേശം!’ എന്ന ആശ്ചര്യപ്രകടനമായി അവതരിപ്പിച്ചു; പിന്നാലെയുള്ള ആത്മാക്കളോടുള്ള കല്പന അതിന്റെ അധികാരസ്വഭാവം വിശദീകരിക്കുന്നു.
  alternative: ‘ഇതെന്താണ്? അധികാരത്തോടെയുള്ള ഈ പുതിയ ഉപദേശം എന്താണ്?’ എന്ന ഒറ്റ ചോദ്യമായി വായിക്കാം; അല്ലെങ്കിൽ ‘അധികാരത്തോടെ അവൻ അശുദ്ധാത്മാക്കളോടുപോലും കല്പിക്കുന്നു’ എന്ന് κατ’ ἐξουσίαν തുടർന്നുള്ള ക്രിയയോട് കൂടുതൽ നേരിട്ട് ബന്ധിപ്പിക്കാം.
  rationale: ഗ്രീക്ക് വാക്യത്തിന് വിരാമചിഹ്നവും ഘടനയും സംബന്ധിച്ച് ഒന്നിലധികം സാധുവായ വായനകൾ സാധ്യമാണ്. മുഖ്യവാചകം സ്വാഭാവികമായി നിലനിർത്തിക്കൊണ്ട് അടിക്കുറിപ്പിൽ ചോദ്യരൂപത്തിലുള്ള വായന രേഖപ്പെടുത്തി; അധികാരം ഉപദേശത്തിലും പ്രവൃത്തിയിലും പ്രകടമാകുന്ന സന്ദർഭബന്ധവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വിസ്മയിച്ചു’, ‘ഉപദേശം’, ‘കല്പിക്കുന്നു’, ‘അനുസരിക്കുന്നു’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ മൂലത്തിലെ അധികാരവും അശുദ്ധാത്മാക്കളെക്കുറിച്ചുള്ള ഭാഷയും കാത്തുസൂക്ഷിക്കുന്നു. പ്രധാന പാഠത്തിലെ [a] അടിക്കുറിപ്പ് ചോദ്യഘടനയിലെ യഥാർഥ ഗ്രീക്ക് അനിശ്ചിതത്വം രേഖപ്പെടുത്തുന്നു.
