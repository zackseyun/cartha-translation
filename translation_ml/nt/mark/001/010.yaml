source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: ml
  text: അവൻ വെള്ളത്തിൽനിന്ന് കയറിവരുമ്പോൾത്തന്നെ, ആകാശങ്ങൾ കീറിത്തുറക്കപ്പെടുന്നതും[a] ആത്മാവ് പ്രാവിനെപ്പോലെ അവന്റെമേൽ[b] ഇറങ്ങിവരുന്നതും അവൻ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആകാശങ്ങൾ പിളർന്നുപോകുന്നതും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ വെറും “തുറക്കപ്പെടുക” എന്നതിനെക്കാൾ ശക്തമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവന്റെ ഉള്ളിലേക്ക്.” ഗ്രീക്ക് εἰς എന്ന പദത്തിന് “ഉള്ളിലേക്ക്” എന്നർഥം വരാം; എന്നാൽ ഇവിടെ ആത്മാവിന്റെ ഇറങ്ങിവരവിനോടൊപ്പം “അവന്റെമേൽ” എന്നതാണ് സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ച പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ഉടൻ എന്ന സമയബോധം നൽകുന്ന ‘കയറിവരുമ്പോൾത്തന്നെ’
  rationale: മർക്കൊസിന്റെ സജീവമായ ആഖ്യാനവേഗവും സംഭവങ്ങൾ തമ്മിലുള്ള തൽക്ഷണബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: വെള്ളത്തിൽനിന്ന് കയറിവരുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം മുഖ്യക്രിയയോടു സമകാലികമാണെന്നത് ‘വരുമ്പോൾ’ വ്യക്തമാക്കുന്നു; ἐκ എന്നതിന്റെ ‘പുറത്തുനിന്ന്/നിന്ന്’ എന്ന ആശയം ‘വെള്ളത്തിൽനിന്ന്’ സൂക്ഷിക്കുന്നു.
- source_word: εἶδεν
  choice: അവൻ കണ്ടു
  rationale: ദർശനക്രിയയുടെ ലളിതവും നേരിട്ടുമുള്ള മലയാളരൂപം.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: ആകാശങ്ങൾ കീറിത്തുറക്കപ്പെടുന്നതും
  rationale: σχίζω എന്ന ശക്തമായ ക്രിയയുടെ നാടകീയത വെറും ‘തുറക്കപ്പെടുക’ എന്നതിലുപരി പ്രകടമാക്കുകയും കർമ്മണിപ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τοὺς οὐρανούς
  choice: ആകാശങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം സംരക്ഷിക്കുകയും വേദപുസ്തകീയമായ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ആത്മാവാണ് സൂചിതൻ; എന്നാൽ മൂലപാഠത്തിൽ ‘പരിശുദ്ധാത്മാവ്’ എന്നു വ്യക്തമാക്കാത്തതിനാൽ അധിക വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: ὡς περιστερὰν
  choice: പ്രാവിനെപ്പോലെ
  rationale: താരതമ്യം രൂപത്തെയോ ചലനത്തെയോ രണ്ടിനെയുമോ സൂചിപ്പിക്കുന്നുവെന്ന് നിർണയിക്കാതെ ഗ്രീക്കിലെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: καταβαῖνον
  choice: ഇറങ്ങിവരുന്നതും
  rationale: ചലനത്തിന്റെ ദിശയും തുടരുന്ന ദൃശ്യസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰς αὐτόν
  choice: തന്റെമേൽ
  rationale: εἰς എന്നതിന് ‘ഉള്ളിലേക്ക്’ എന്ന സാധ്യതയുണ്ടെങ്കിലും ആത്മാവിന്റെ ഇറങ്ങിവരവ് വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘തന്റെമേൽ’ സ്വാഭാവികവും യോജിച്ചതുമാണ്; മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: ‘ആത്മാവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ദൈവത്തിന്റെ ആത്മാവിനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കി ‘ആത്മാവ്’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘പരിശുദ്ധാത്മാവ്’
  rationale: സന്ദർഭം ദൈവത്തിന്റെ ആത്മാവിനെ തിരിച്ചറിയിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം τὸ πνεῦμα എന്നേ പറയുന്നുള്ളൂ; അതിനാൽ മൂലപാഠത്തെക്കാൾ കൂടുതൽ വ്യക്തമാക്കിയിട്ടില്ല.
- issue: പ്രാവിനോടുള്ള താരതമ്യത്തിന്റെ കൃത്യമായ ആശയം
  choice: ‘പ്രാവിനെപ്പോലെ’ എന്ന തുറന്ന താരതമ്യം നിലനിർത്തി
  alternative: ആത്മാവ് പ്രാവിന്റെ രൂപം ധരിച്ചു / പ്രാവിനെപ്പോലുള്ള രീതിയിൽ ഇറങ്ങി
  rationale: ὡς περιστερὰν എന്നത് താരതമ്യം സൂചിപ്പിക്കുന്നു; രൂപമാണോ ചലനമാണോ മറ്റേതെങ്കിലും സാദൃശ്യമാണോ എന്ന് പാഠം നിർണയിക്കുന്നില്ല.
- issue: εἰς αὐτόν എന്നതിലെ ദിശ
  choice: ‘തന്റെമേൽ’
  alternative: ‘തന്റെ ഉള്ളിലേക്ക്’
  rationale: ആത്മാവിന്റെ ഇറങ്ങിവരവിനോടൊപ്പം ‘മേൽ’ എന്നത് സന്ദർഭോചിതമായ പ്രയോഗമാണ്; എങ്കിലും εἰς എന്ന പദത്തിന്റെ ‘ഉള്ളിലേക്ക്’ എന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കയറിവരുമ്പോൾത്തന്നെ’ എന്ന പ്രയോഗം സമകാലികതയും തൽക്ഷണതയും ഒരുമിച്ചു നൽകുന്നു. ‘കീറിത്തുറക്കപ്പെടുക’ ദൃശ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘പ്രാവിനെപ്പോലെ’ മൂലപാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
