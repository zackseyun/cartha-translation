    issue: Ambiguous/reflexive Malayalam pronoun in ‘തന്റെമേൽ’
    rationale: In Malayalam, ‘തന്റെ’ is reflexive and normally points back to the relevant subject. Since ‘ആത്മാവ്’ is the subject of ‘ഇറങ്ങിവരുന്നതും,’ the phrase can mean ‘the Spirit descending upon itself,’ whereas εἰς αὐτόν refers to Jesus. ‘അവന്റെമേൽ’ makes the required referent clear.
