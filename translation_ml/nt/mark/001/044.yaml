language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “ശ്രദ്ധിക്കണം, ആരോടും ഒന്നും പറയരുത്. പകരം, പോയി നിന്നെത്തന്നെ പുരോഹിതനു കാണിക്കുക; നിന്റെ ശുദ്ധീകരണത്തിനായി മോശെ കല്പിച്ചവ അവർക്കുള്ള സാക്ഷ്യമായി[a] അർപ്പിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർക്കുള്ള തെളിവായി’ എന്നും വിവർത്തനം ചെയ്യാം. ഇത് പുരോഹിതന്മാർക്കോ മറ്റുള്ളവർക്കോ സമർപ്പിക്കുന്ന തെളിവിനെ സൂചിപ്പിക്കാം; ചിലർ ഇതിനെ കൂടുതൽ കടുത്ത അർത്ഥത്തിൽ ‘അവർക്കെതിരായ സാക്ഷ്യമായി’ എന്നും മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: ശ്രദ്ധിക്കണം
  rationale: തുടർന്നുവരുന്ന വിലക്കിനെ ശക്തമായി ഊന്നുന്ന മുന്നറിയിപ്പും ആഹ്വാനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: ആരോടും ഒന്നും പറയരുത്
  rationale: സ്വീകർത്താവിനെയും പറയേണ്ട കാര്യത്തെയും സമഗ്രമായി നിഷേധിക്കുന്ന ഗ്രീക്കിലെ ഇരട്ട നിഷേധത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἀλλὰ
  choice: പകരം
  rationale: ചെയ്യരുതാത്തതിൽനിന്ന് ചെയ്യേണ്ടതിലേക്കുള്ള തിരുത്തൽസ്വഭാവമുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ὕπαγε
  choice: പോയി
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന ലളിതമായ ആജ്ഞ സ്വാഭാവികമായി പകർന്നിരിക്കുന്നു.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: നിന്നെത്തന്നെ പുരോഹിതനു കാണിച്ചുകൊടുക്കുക
  rationale: പ്രതിഫലക സർവനാമവും പുരോഹിതന്റെ പരിശോധനയ്ക്കായി സ്വയം ഹാജരാകുന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: ἱερεῖ
  choice: പുരോഹിതനു
  rationale: നിയമപ്രകാരമുള്ള പരിശോധന നടത്തേണ്ട ബന്ധപ്പെട്ട പുരോഹിതാധികാരിയെയാണ് ഏകവചനം സൂചിപ്പിക്കുന്നത്.
- source_word: προσένεγκε
  choice: അർപ്പിക്കുക
  rationale: ശുദ്ധീകരണവുമായി ബന്ധപ്പെട്ട ആരാധനാപരവും യാഗപരവുമായ പശ്ചാത്തലത്തിൽ പൊതുവായ ‘കൊണ്ടുവരുക’ എന്നതിനെക്കാൾ യോജിക്കുന്നു.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: നിന്റെ ശുദ്ധീകരണത്തിനായി
  rationale: περί ഇവിടെ ബന്ധമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു; ആചാരപരമായ ശുദ്ധീകരണത്തിന്റെ പശ്ചാത്തലം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: മോശെ കല്പിച്ച വഴിപാടുകൾ
  rationale: നപുംസകലിംഗ ബഹുവചന സംബന്ധസർവനാമം സൂചിപ്പിക്കുന്ന കല്പിത വസ്തുക്കൾ യാഗാർപ്പണസന്ദർഭത്തിൽ വഴിപാടുകളാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: അവർക്കുള്ള സാക്ഷ്യമായി
  rationale: ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ സാക്ഷ്യ/തെളിവ് അർത്ഥം നിലനിർത്തുന്നു; ‘അവർക്കെതിരായി’ എന്ന കൂടുതൽ കടുത്ത അർത്ഥം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘അവർക്കുള്ള സാക്ഷ്യമായി’ എന്നതിലെ ‘അവർ’ ആരെന്നും സാക്ഷ്യത്തിന്റെ സ്വഭാവം എന്തെന്നും
  choice: പുരോഹിതന്മാരെയോ സമൂഹത്തിലെ മറ്റുള്ളവരെയോ സൂചിപ്പിക്കാവുന്ന വിധത്തിലും, തെളിവോ സാക്ഷ്യമോ എന്ന വിശാല അർത്ഥത്തിലും പ്രയോഗം തുറന്നുവെച്ചു.
  alternative: ‘അവർക്കെതിരായ സാക്ഷ്യമായി’ അല്ലെങ്കിൽ ‘പുരോഹിതന്മാർക്കുള്ള തെളിവായി’
  rationale: ഗ്രീക്ക് വാചകം ‘എതിരായി’ എന്ന് വ്യക്തമാക്കുന്നില്ല; സർവനാമത്തിന്റെ കൃത്യമായ സൂചനയും സാക്ഷ്യത്തിന്റെ അനുകൂലമോ പ്രതികൂലമോ ആയ ഭാവവും നിർബന്ധമായി തീർപ്പാക്കാതെ മൂലത്തിലെ അർത്ഥസാധ്യത നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആജ്ഞകളുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തിയിട്ടുണ്ട്; ആചാരപരമായ പശ്ചാത്തലം മനസ്സിലാകാൻ ‘വഴിപാടുകൾ’ ഉപയോഗിച്ചു. സാക്ഷ്യപ്രയോഗത്തിലെ യഥാർത്ഥ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
