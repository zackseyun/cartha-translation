id: MRK.1.37
reference: Mark 1:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂εὗρον αὐτὸν καὶ⸃ λέγουσιν αὐτῷ ὅτι Πάντες ⸂ζητοῦσίν σε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/037.yaml
  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: ml
  text: 'അവർ അവനെ കണ്ടെത്തി അവനോടു പറഞ്ഞു[a]: “എല്ലാവരും നിന്നെ തേടുകയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാവരും നിന്നെ അന്വേഷിക്കുകയാണ്.” ഗ്രീക്കിലെ ζητοῦσίν എന്ന പദം ‘അന്വേഷിക്കുകയാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഈ സന്ദർഭത്തിൽ ആളുകൾ യേശുവിനെ കണ്ടെത്താൻ ശ്രമിക്കുകയായിരുന്നു എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: കണ്ടെത്തി
  rationale: അന്വേഷണത്തിന്റെ വിജയകരമായ ഫലമാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ആഖ്യാനത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: λέγουσιν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാള ആഖ്യാനത്തിന്റെ സ്വാഭാവികമായ ഒഴുക്കിനായി ഭൂതകാലത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: ὅτι
  choice: ഉദ്ധരണിചിഹ്നം
  rationale: നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നതിനാൽ ‘എന്ന്’ ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായ നേരിട്ടുള്ള ഉദ്ധരണിയായി നൽകി.
- source_word: Πάντες
  choice: എല്ലാവരും
  rationale: സമീപസന്ദർഭത്തിലെ ജനങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; സന്ദർഭാതീതമായ സമ്പൂർണ സാർവത്രികത നിർബന്ധമായി അർഥമാക്കുന്നില്ല.
- source_word: ζητοῦσίν σε
  choice: നിന്നെ അന്വേഷിക്കുകയാണ്
  rationale: ζητέω എന്നതിന് അന്വേഷിക്കുക, തേടുക എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ഇവിടെ യേശുവിനെ കണ്ടെത്താൻ ആളുകൾ ശ്രമിക്കുന്ന ഭൗതികാന്വേഷണമാണ് പ്രധാനമായും ഉദ്ദേശിക്കുന്നത്; അതേസമയം ‘അന്വേഷിക്കുക’ മൂലപദത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: അവർ ... കണ്ടെത്തി ... പറഞ്ഞു
  rationale: καίയുടെ ലളിതമായ ബന്ധകസ്വഭാവം മലയാള വാക്യഘടനയിൽ സ്വാഭാവികമായി നിലനിർത്തി; അധികമായ കാലക്രമമോ കാരണബന്ധമോ ചേർത്തിട്ടില്ല.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: അവനെ / അവനോട് / നിന്നെ
  rationale: വ്യാകരണപരമായ കർത്തൃ-കർമബന്ധങ്ങൾക്കനുസരിച്ച് സർവനാമങ്ങൾ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം സ്വാഭാവിക മലയാളകഥനത്തിനായി ഭൂതകാലത്തിൽ നൽകി. ‘എല്ലാവരും’ എന്നത് സമീപസന്ദർഭത്തിലെ ജനങ്ങളെ സൂചിപ്പിക്കുന്ന സാധാരണ കൂട്ടപ്രയോഗമായി നിലനിർത്തി.
