  terminology: ‘ധാന്യം അളക്കുന്ന പാത്രം’ conveys μόδιος well without importing an English unit of measure. ‘കട്ടിൽ’ properly covers κλίνη in this household image. The footnotes accurately explain both the vivid active expression and the cultural measure/container.
