  source_fidelity: The draft accurately represents the imperfect ἔλεγεν, the personified active expression ἔρχεται ὁ λύχνος, both alternative locations introduced by ἤ, and the purposive passive τεθῇ. The generic Malayalam ‘വിളക്ക്’ appropriately conveys the proverbial force of the articular Greek noun.
