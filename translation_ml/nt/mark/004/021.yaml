id: MRK.4.21
reference: Mark 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “ധാന്യം അളക്കുന്ന പാത്രത്തിന്റെ[b] കീഴിലോ കട്ടിലിന്റെ കീഴിലോ വെക്കപ്പെടാനായിട്ടാണോ വിളക്ക് വരുന്നത്[a]? വിളക്കുതണ്ടിന്മേൽ വെക്കപ്പെടാനല്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ സ്വാഭാവികമായി, “വിളക്ക് കൊണ്ടുവരുന്നത്.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “വിളക്ക് വരുന്നു” എന്ന സജീവവും വ്യക്തിവൽക്കരിച്ചതുമായ പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ ഗ്രീക്കുപദം ഉണങ്ങിയ സാധനങ്ങൾ അളക്കാനുള്ള ഒരു അളവിനെയും അതിനുപയോഗിച്ച പാത്രത്തെയും സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായി ഇതിനെ “ബുഷൽ” എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്നോ ആവർത്തിച്ചിരുന്നോ ആയ സംസാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: Μήτι
  choice: …ആണോ?
  rationale: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ആദ്യ ആലങ്കാരികചോദ്യത്തിന്റെ ശക്തി സന്ദർഭവും പിന്നാലെയുള്ള ‘അല്ലേ?’ എന്ന ചോദ്യവും ചേർന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔρχεται ὁ λύχνος
  choice: വിളക്ക് വരുന്നത്
  rationale: മൂലത്തിലെ സജീവവും വ്യക്തിവൽക്കരിച്ചതുമായ ‘വിളക്ക് വരുന്നു’ എന്ന ദൃശ്യപ്രയോഗം വ്യാഖ്യാനിച്ച് ‘വിളക്ക് കൊണ്ടുവരുന്നത്’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: λύχνος
  choice: വിളക്ക്
  rationale: ഇത് അമൂർത്തമായ വെളിച്ചത്തെയല്ല, കൊണ്ടുനടക്കാവുന്ന എണ്ണവിളക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: μόδιον
  choice: ധാന്യം അളക്കുന്ന പാത്രം
  rationale: ഒരു ഉണങ്ങിയ അളവും അതിനുപയോഗിച്ച പാത്രവും സൂചിപ്പിക്കുന്ന സാംസ്കാരിക പദത്തിന്റെ പ്രവർത്തനം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: κλίνην
  choice: കട്ടിൽ
  rationale: ഗാർഹിക ദൃശ്യത്തിൽ കിടക്കയെയോ ചാരുകട്ടിലിനെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് സ്വാഭാവികവും പൊതുവേ മനസ്സിലാകുന്നതുമായ തർജമ.
- source_word: λυχνίαν
  choice: വിളക്കുപീഠം
  rationale: വിളക്ക് സ്ഥാപിക്കുന്ന പ്രത്യേക താങ്ങ് എന്ന മൂർത്തമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: τεθῇ
  choice: വെക്കപ്പെടുക
  rationale: τίθημι എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം നിലനിർത്തുകയും ഉദ്ദേശ്യാർഥമുള്ള ἵνα ഘടനയോട് സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: ἵνα ... τεθῇ
  choice: വെക്കപ്പെടാനാണ്
  rationale: ആലങ്കാരികചോദ്യത്തിനുള്ളിലെ ഉദ്ദേശ്യാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘വിളക്ക് വരുന്നു’ എന്ന മൂലത്തിലെ വ്യക്തിവൽക്കരണം നിലനിർത്തണമോ, ‘വിളക്ക് കൊണ്ടുവരപ്പെടുന്നു’ എന്നു വ്യാഖ്യാനിക്കണമോ
  choice: ‘വിളക്ക് വരുന്നത്’ എന്ന സജീവ ദൃശ്യം നിലനിർത്തി.
  alternative: ‘വിളക്ക് കൊണ്ടുവരുന്നത്’ അല്ലെങ്കിൽ ‘വിളക്ക് കൊണ്ടുവരപ്പെടുന്നത്’.
  rationale: പഴമൊഴിസ്വഭാവമുള്ള വചനത്തിന്റെ മനപ്പൂർവമായ ദൃശ്യതയും ആലങ്കാരിക ശക്തിയും മൂലത്തോട് അടുത്ത് നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സ്വാഭാവികമായ പകരം വായന നൽകുന്നു.
- issue: ὁ λύχνος എന്ന നിർദിഷ്ടരൂപം മലയാളത്തിൽ നിർദിഷ്ടമായോ പൊതുവായോ നൽകുക
  choice: പൊതുതത്ത്വം സൂചിപ്പിക്കുന്ന ‘വിളക്ക്’ എന്നു നൽകി.
  alternative: ‘ആ വിളക്ക്’.
  rationale: ഗ്രീക്കിൽ നിർദിഷ്ട ഉപപദമുണ്ടെങ്കിലും ഇത് ഒരു പ്രത്യേക വിളക്കിനെക്കാൾ പൊതുവായ പഴമൊഴിത്തത്ത്വമാണ്; മലയാളത്തിൽ ‘വിളക്ക്’ അതു സ്വാഭാവികമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഗദ്യശൈലി. മൂലത്തിലെ രണ്ട് ആലങ്കാരികചോദ്യങ്ങളും വ്യക്തിവൽക്കരണവും നിലനിർത്തി; പരിചയമില്ലാത്ത പുരാതന അളവുപേര് നേരിട്ട് കടമെടുക്കാതെ പാത്രത്തിന്റെ പ്രവർത്തനം വ്യക്തമാക്കി.
