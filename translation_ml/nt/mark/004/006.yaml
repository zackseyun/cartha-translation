  text: ⸂καὶ ὅτε ἀνέτειλεν ὁ ἥλιος⸃ ⸀ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: ml
  text: സൂര്യൻ ഉദിച്ചപ്പോൾ അതു വെയിലേറ്റു കരിഞ്ഞുപോയി; വേരില്ലാതിരുന്നതിനാൽ വാടിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉണങ്ങിപ്പോയി.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഉണങ്ങുക എന്നോ വാടുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: സൂര്യൻ ഉദിച്ചപ്പോൾ
  rationale: കാലസൂചന നൽകുന്ന ὅτε-ഉപവാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; καί ഇവിടെ ലളിതമായ ആഖ്യാനബന്ധമാണ്, അതിനാൽ പ്രത്യേകമായി ‘പിന്നെ’ എന്നു ചേർത്ത് അധിക കാലക്രമസൂചന നൽകുന്നില്ല.
- source_word: ἐκαυματίσθη
  choice: വെയിലേറ്റു കരിഞ്ഞുപോയി
  rationale: സൂര്യന്റെ ചൂടേറ്റ് കേടാകുക എന്ന καυματίζω എന്ന ക്രിയയുടെ നിഷ്ക്രിയാർഥം കൃഷിചിത്രത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: വേരില്ലാതിരുന്നതിനാൽ
  rationale: διάയോടുകൂടിയ articular infinitive സൂചിപ്പിക്കുന്ന കാരണബന്ധവും ῥίζαν എന്ന ഏകവചനവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐξηράνθη
  choice: വാടിപ്പോയി
  rationale: ξηραίνω ഇവിടെ ഉണങ്ങുക അഥവാ വാടുക എന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു; സസ്യത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ‘വാടിപ്പോയി’ സ്വാഭാവികമാണ്, എന്നാൽ ‘ഉണങ്ങിപ്പോയി’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
