translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ കാരണബന്ധവും കാർഷികദൃശ്യവും സംരക്ഷിച്ചിരിക്കുന്നു.
