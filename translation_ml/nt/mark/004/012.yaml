revisions:
- from: “അങ്ങനെ, അവർ കണ്ടുകൊണ്ടിരിക്കെ കാണുകയും എന്നാൽ ഗ്രഹിക്കാതിരിക്കുകയും[a], കേട്ടുകൊണ്ടിരിക്കെ കേൾക്കുകയും എന്നാൽ മനസ്സിലാക്കാതിരിക്കുകയും ചെയ്യേണ്ടതിന്[c]—അവർ ഒരുപക്ഷേ തിരിഞ്ഞുവരികയും[b] അവരോടു ക്ഷമിക്കപ്പെടുകയും ചെയ്യാതിരിക്കാൻ.”
  to: “അങ്ങനെ, അവർ കണ്ടുകൊണ്ടിരിക്കെ കാണുകയും എങ്കിലും തിരിച്ചറിയാതിരിക്കുകയും, കേട്ടുകൊണ്ടിരിക്കെ കേൾക്കുകയും എങ്കിലും മനസ്സിലാക്കാതിരിക്കുകയും ചെയ്യാൻ,[c] അവർ ഒരുപക്ഷേ തിരിഞ്ഞുവരികയും അവർക്കു ക്ഷമ ലഭിക്കുകയും ചെയ്യാതിരിക്കാൻ.”
  rationale: 'The revision corrects the polarity and syntax of the μήποτε clause, removes the unintended obligation conveyed by «ചെയ്യേണ്ടതിന്», and replaces an unidiomatic passive-forgiveness expression. It retains the source text’s repetition, its distinction between physical seeing and perception, the ambiguous repentance-related force of ἐπιστρέψωσιν, and the unresolved theological tension of the Isaiah echo. Footnote anchors are normalized: [c] marks the Isaiah allusion at the end of the echoed seeing/hearing sequence, [b] should be anchored immediately after «തിരിഞ്ഞുവരികയും», and [a] immediately after «തിരിച്ചറിയാതിരിക്കുകയും».'
