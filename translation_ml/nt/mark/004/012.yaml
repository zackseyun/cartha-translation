id: MRK.4.12
reference: Mark 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: ml
  text: “അങ്ങനെ, അവർ കണ്ടുകൊണ്ടിരിക്കെ കാണുകയും എങ്കിലും തിരിച്ചറിയാതിരിക്കുകയും, കേട്ടുകൊണ്ടിരിക്കെ കേൾക്കുകയും എങ്കിലും മനസ്സിലാക്കാതിരിക്കുകയും ചെയ്യാൻ,[c] അവർ ഒരുപക്ഷേ തിരിഞ്ഞുവരികയും അവർക്കു ക്ഷമ ലഭിക്കുകയും ചെയ്യാതിരിക്കാൻ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: യേശു ഇവിടെ യെശയ്യാവ് 6:9–10-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; ദൈവിക ന്യായവിധിയും ജനങ്ങളുടെ പ്രതികരണമില്ലായ്മയും തമ്മിലുള്ള പിരിമുറുക്ക് ഈ വാക്കുകൾ നിലനിർത്തുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: ചെയ്യേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം/ഫലം എന്ന രണ്ടുതല സാധ്യതയും പൂർണമായി തീർപ്പാക്കാതെ ഗ്രീക്കിലെ ഉദ്ദേശ്യസദൃശ ഘടന നിലനിർത്തുന്നു.
- source_word: βλέποντες βλέπωσι
  choice: കണ്ടുകൊണ്ടിരിക്കെ കാണുകയും
  rationale: കൃദ്യന്തവും ക്രിയയും ആവർത്തിക്കുന്ന മൂലഭാഷയിലെ ഊന്നലും വിരോധാഭാസസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: ἴδωσιν
  choice: ഗ്രഹിക്കുക
  rationale: βλέπω എന്ന ‘കാണുക’ എന്ന ക്രിയയിൽനിന്ന് വേർതിരിച്ച് യഥാർഥമായി തിരിച്ചറിയുക/ഉൾക്കൊള്ളുക എന്ന ആശയം നൽകുന്നു.
- source_word: ἀκούοντες ἀκούωσι
  choice: കേട്ടുകൊണ്ടിരിക്കെ കേൾക്കുകയും
  rationale: യെശയ്യാവിൽനിന്നുള്ള പ്രതിധ്വനിയിലെ ആവർത്തനവും ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: συνιῶσιν
  choice: മനസ്സിലാക്കുക
  rationale: മാനസികവും ആത്മീയവുമായ ഉൾക്കാഴ്ചയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: μήποτε
  choice: ഒരുപക്ഷേ … ചെയ്യാതിരിക്കാൻ
  rationale: മുന്നിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന പ്രതികൂല സാധ്യതയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ‘lest/perhaps’ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἐπιστρέψωσιν
  choice: തിരിഞ്ഞുവരിക
  rationale: മാനസാന്തരത്തിന്റെ സൂചന അനുവദിക്കുമ്പോഴും അതിനെ വ്യാഖ്യാനമായി മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതെ തിരിയുക/മടങ്ങിവരുക എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: ἀφεθῇ αὐτοῖς
  choice: അവരോടു ക്ഷമിക്കപ്പെടുക
  rationale: ക്ഷമിക്കുന്ന കർത്താവിനെയും ക്ഷമിക്കപ്പെടുന്ന വസ്തുവിനെയും വ്യക്തമാക്കാതെ മൂലത്തിലെ ഏകവചന ദൈവിക കർമണിപ്രയോഗം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἵνα, μήποτε എന്നീ പദങ്ങൾ ഉയർത്തുന്ന ദൈവിക ന്യായവിധിയും മനുഷ്യരുടെ പ്രതികരണമില്ലായ്മയും തമ്മിലുള്ള പിരിമുറുക്ക്
  choice: ഉദ്ദേശ്യസദൃശമായ ‘ചെയ്യേണ്ടതിന് … ചെയ്യാതിരിക്കാൻ’ എന്ന ഘടന നിലനിർത്തി
  alternative: ഇത് കേവലം ഫലമെന്നോ ആളുകളുടെ സ്വതന്ത്ര പ്രതികരണമില്ലായ്മ മാത്രമെന്നോ വിശദീകരിക്കുക
  rationale: ഗ്രീക്ക് വാക്യം മനപ്പൂർവം നിലനിർത്തുന്ന ദൈവിക ന്യായവിധി–മാനുഷിക പ്രതികരണം എന്ന പിരിമുറുക്ക് പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- issue: ἐπιστρέψωσιν എന്നതിന്റെ മാനസാന്തരസൂചന
  choice: മുഖ്യപാഠത്തിൽ ‘തിരിഞ്ഞുവരിക’; അടിക്കുറിപ്പിൽ ‘തിരിയുക/മാനസാന്തരപ്പെടുക’
  alternative: മുഖ്യപാഠത്തിൽ നേരിട്ട് ‘മാനസാന്തരപ്പെടുക’
  rationale: പ്രവാചകസന്ദർഭത്തിലെ മാനസാന്തരസൂചന അംഗീകരിക്കുമ്പോഴും ഗ്രീക്ക് ക്രിയയുടെ വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലത്തിലെ ആവർത്തനവും ഉദ്ദേശ്യം/ഫലം സംബന്ധിച്ച അവ്യക്തതയും ഉദ്ദേശപൂർവം നിലനിർത്തിയതിനാൽ വാക്യത്തിന് പ്രവാചകവചനസദൃശമായ സാന്ദ്രതയുണ്ട്.
