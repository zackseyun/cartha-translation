  text: εἴ τις ἔχει ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/023.yaml
  text: If anyone has ears to hear[a], let him hear.
translation:
  language: ml
  text: കേൾക്കാൻ ചെവികളുള്ളവൻ കേൾക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ τις
  choice: ചെവിയുള്ളവൻ
  rationale: ഗ്രീക്കിലെ വ്യവസ്ഥാപരമായ പൊതുവിളി മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഉള്ളവൻ’ ഘടനയിൽ അവതരിപ്പിക്കുന്നു; അഭിസംബോധന ഏവർക്കും ബാധകമാണ്.
- source_word: ἔχει ὦτα
  choice: ചെവിയുള്ളവൻ
  rationale: ‘ചെവികൾ ഉണ്ട്’ എന്ന പദാനുപദരൂപത്തേക്കാൾ സ്വാഭാവികമായ മലയാളപ്രയോഗം; മൂലത്തിലെ കേൾവിശേഷിയുടെ രൂപകം നിലനിർത്തുന്നു.
- source_word: ἀκούειν
  choice: കേൾക്കാൻ
  rationale: ഉദ്ദേശ്യമോ ശേഷിയോ സൂചിപ്പിക്കുന്ന infinitive-നെ സ്വാഭാവികമായി നൽകുകയും ആവർത്തിക്കുന്ന ‘കേൾക്കുക’ എന്ന ക്രിയ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀκουέτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; വെറും ശബ്ദഗ്രഹണമല്ല, ശ്രദ്ധയോടെയും സ്വീകരണത്തോടെയും കേൾക്കാനുള്ള ആഹ്വാനവും സന്ദർഭത്തിൽ തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: പൊതുവായ ഏകവചന അഭിസംബോധന
  choice: ചെവിയുള്ളവൻ കേൾക്കട്ടെ
  alternative: ആർക്കെങ്കിലും കേൾക്കാൻ ചെവിയുണ്ടെങ്കിൽ, അവർ കേൾക്കട്ടെ
  rationale: τις എന്ന അനിശ്ചിത ഏകവചനവും ἀκουέτω എന്ന ഏകവചന ആജ്ഞയും നിലനിർത്തുന്നു. മലയാളത്തിലെ ‘ഉള്ളവൻ’ ഇവിടെ പൊതുവായ പ്രതിനിധി ഏകവചനമാണ്; പുരുഷന്മാർക്ക് മാത്രമായി അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനികവും ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘കേൾക്കാൻ… കേൾക്കട്ടെ’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ἀκούειν/ἀκουέτω ആവർത്തനത്തെ സംരക്ഷിക്കുന്നു.
