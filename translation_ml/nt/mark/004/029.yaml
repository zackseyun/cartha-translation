id: MRK.4.29
reference: Mark 4:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: ml
  text: എന്നാൽ വിളവ് പാകമാകുമ്പോൾ[a], കൊയ്ത്തുകാലം വന്നെത്തിയതിനാൽ അയാൾ ഉടനെ അരിവാൾ പ്രയോഗിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിളവ് തന്നെത്തന്നെ ഏൽപ്പിക്കുമ്പോൾ.” ഗ്രീക്കിൽ സാധാരണയായി “ഏൽപ്പിക്കുക” എന്നർഥമുള്ള ക്രിയ വിളവിനെ കർത്താവാക്കി അസാധാരണമായി പ്രയോഗിച്ചിരിക്കുന്നു; ഇവിടെ വിളവ് കൊയ്യാൻ പാകമാകുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: എന്നാൽ ... ആകുമ്പോൾ
  rationale: ὅταν എന്ന അനിശ്ചിതകാലബന്ധവും δέ എന്ന ലഘുവായ പരിവർത്തന/വിരുദ്ധഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παραδοῖ
  choice: പാകമാകുമ്പോൾ
  rationale: സാധാരണയായി ‘ഏൽപ്പിക്കുക’ എന്നർഥമുള്ള παραδίδωμι ഇവിടെ വിളവിനെ കർത്താവാക്കി ഉപയോഗിച്ചിരിക്കുന്ന അപൂർവ പ്രയോഗമാണ്; സന്ദർഭത്തിൽ കൊയ്യാൻ തക്ക നിലയിലെത്തുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു. അസാധാരണമായ മൂലപ്രയോഗം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ καρπός
  choice: വിളവ്
  rationale: καρπός എന്നത് ഫലം എന്ന വിശാലാർഥം വഹിക്കുമെങ്കിലും അരിവാളും കൊയ്ത്തും ഉൾപ്പെടുന്ന വയൽസന്ദർഭത്തിൽ ‘വിളവ്’ യോജിച്ചതും പ്രത്യേക ധാന്യത്തിലേക്ക് അർഥം ചുരുക്കാത്തതുമാണ്.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: പ്രവർത്തനത്തിന്റെ തൽക്ഷണതയും മർക്കോസിന്റെ ഊർജസ്വലമായ ആഖ്യാനശൈലിയും വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: അരിവാൾ പ്രയോഗിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘അരിവാൾ അയക്കുന്നു’ എന്ന ഗ്രീക്ക് ശൈലി കൊയ്ത്ത് തുടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അരിവാൾ പ്രയോഗിക്കുന്നു’ ആ ആശയം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὅτι
  choice: '...തിനാൽ'
  rationale: ഉടനെയുള്ള പ്രവർത്തനത്തിന്റെ കാരണം വ്യക്തമാക്കുന്ന ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: παρέστηκεν
  choice: വന്നെത്തിയിരിക്കുന്നു
  rationale: കൊയ്ത്തുകാലം വന്നതും ഇപ്പോൾ സന്നിഹിതമായിരിക്കുന്നതും സൂചിപ്പിക്കുന്ന perfect രൂപത്തിന്റെ ഫലാവസ്ഥ നിലനിർത്തുന്നു.
- source_word: ὁ θερισμός
  choice: കൊയ്ത്തുകാലം
  rationale: ഈ സന്ദർഭത്തിൽ θερισμός കൊയ്ത്തിനുള്ള സമയം എത്തിയെന്ന ആശയം വഹിക്കുന്നു; മലയാളത്തിൽ ‘കൊയ്ത്തുകാലം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ദൈവരാജ്യത്തിന്റെ ഉപമയിലെ വിളവിന്റെ സജ്ജത
  choice: വിളവ് കൊയ്യാൻ തക്ക പാകത്തിലെത്തുന്നതായി കാർഷികരൂപകം നിലനിർത്തി; അതിന്റെ ദൈവശാസ്ത്രപരമായ സൂചന വ്യക്തമാക്കിയില്ല.
  alternative: ഇത് ന്യായവിധി, സുവിശേഷദൗത്യം, അല്ലെങ്കിൽ യുഗസമാപ്തി എന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷയിൽ തന്നെ വ്യക്തമാക്കുക.
  rationale: മൂലവാക്യം കാർഷികചിത്രം മാത്രം നൽകുന്നു. അതിനാൽ ഉപമയുടെ സാധ്യതയുള്ള ദൈവശാസ്ത്രപരമായ അർഥങ്ങളിൽ ഒന്നിനെ പരിഭാഷയിലൂടെ നിർബന്ധിക്കാതെ യഥാർഥ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കാർഷികപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയായി തിരഞ്ഞെടുത്തു; മൂലത്തിലെ അപൂർവമായ παραδοῖ പ്രയോഗം മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമാക്കുകയും അടിക്കുറിപ്പിൽ തുറന്നുകാട്ടുകയും ചെയ്തു.
