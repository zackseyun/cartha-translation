  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. വാക്യത്തിന്റെ കാർഷികദൃശ്യം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ വ്യാഖ്യാനം ഒഴിവാക്കി. പ്രധാനവാചകത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
