id: MRK.4.7
reference: Mark 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἄλλο ἔπεσεν εἰς τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ συνέπνιξαν αὐτό, καὶ καρπὸν οὐκ ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: ml
  text: മറ്റൊരു വിത്ത് മുള്ളുകൾക്കിടയിൽ[a] വീണു. മുള്ളുകൾ വളർന്നുവന്ന് അതിനെ ഞെരുക്കിക്കളഞ്ഞു; അത് ഫലം നൽകിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുള്ളുകൾക്കുള്ളിലേക്ക്.’ ഗ്രീക്ക് മുൻപ്രത്യയത്തിന്റെ അക്ഷരാർഥം ‘മുള്ളുകളിലേക്കു’ എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ ‘മുള്ളുകൾക്കിടയിൽ’ എന്നത് മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: വേറെ ചില വിത്തുകൾ
  rationale: നപുംസക ഏകവചനമായ ‘മറ്റൊന്ന്’ മുൻസന്ദർഭത്തിലെ വിത്തിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും പറയാൻ ‘വിത്തുകൾ’ ചേർത്തു; വിതയ്ക്കപ്പെട്ട വിത്തിന്റെ കൂട്ടമായ ദൃശ്യത്തിന് ‘ചില’ യോജിക്കുന്നു.
- source_word: ἔπεσεν
  choice: വീണു
  rationale: πίπτω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘വിതയ്ക്കപ്പെട്ടു’ എന്നു പറഞ്ഞ് സന്ദർഭവ്യാഖ്യാനം ക്രിയയിൽ ചേർക്കുന്നില്ല.
- source_word: εἰς τὰς ἀκάνθας
  choice: മുള്ളുകൾക്കിടയിൽ
  rationale: εἰς അക്ഷരാർഥത്തിൽ ‘അകത്തേക്ക്’ എന്നാണെങ്കിലും, മുള്ളുകൾ നിറഞ്ഞ സ്ഥലത്ത് വിത്തു വീഴുന്ന ദൃശ്യത്തിന് ആധുനിക മലയാളത്തിൽ ‘മുള്ളുകൾക്കിടയിൽ’ സ്വാഭാവികമാണ്.
- source_word: ἀνέβησαν
  choice: വളർന്നുവന്ന്
  rationale: ചെടികൾ മുളച്ചു ഉയർന്നുവളരുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പ്രക്രിയയെ അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: συνέπνιξαν
  choice: ഞെരുക്കിക്കളഞ്ഞു
  rationale: മുള്ളുകൾ വിത്തിൽനിന്നുള്ള ചെടിയുടെ വളർച്ച തടയുന്ന ശക്തമായ ദൃശ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ‘ശ്വാസംമുട്ടിച്ചു’ എന്നത് ഇവിടെ അമിതമായി അക്ഷരാർഥപരമാകും.
- source_word: αὐτό
  choice: അവയെ
  rationale: ഗ്രീക്കിൽ ഏകവചന സർവനാമമാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക അവതരണത്തിൽ ‘വിത്തുകൾ’ ബഹുവചനമായതിനാൽ അനുരൂപമായ ബഹുവചന സർവനാമം ഉപയോഗിച്ചു.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: അവ ഫലം നൽകിയില്ല
  rationale: ‘ഫലം കൊടുത്തില്ല’ എന്ന മൂലഘടനയോട് അടുത്തുനിൽക്കുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
