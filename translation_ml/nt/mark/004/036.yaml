  text: καὶ ἀφέντες τὸν ὄχλον παραλαμβάνουσιν αὐτὸν ὡς ἦν ἐν τῷ πλοίῳ, καὶ ἄλλα ⸀πλοῖα ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: ml
  text: ജനക്കൂട്ടത്തെ വിട്ട്, അവർ പടകിൽ ഉണ്ടായിരുന്ന യേശുവിനെ അതേപടി തങ്ങളോടൊപ്പം കൊണ്ടുപോയി[a]. മറ്റു പടകുകളും അവനോടൊപ്പം ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിലെ വാക്യഘടനയെ ‘അവൻ പടകിൽ ഉണ്ടായിരുന്നതുപോലെതന്നെ അവർ അവനെ തങ്ങളോടൊപ്പം കൊണ്ടുപോയി’ എന്നും മനസ്സിലാക്കാം. യേശു ഇതിനകം പടകിലായിരുന്നു എന്നതിനോ, കൂടുതൽ ഒരുക്കമില്ലാതെ അവനെ അതേപടി കൊണ്ടുപോയി എന്നതിനോ ഇവിടെ ഊന്നൽ ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തെ വിട്ടശേഷം
  rationale: ἀφέντες പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള അനുബന്ധപ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു. ഇവിടെ ഔപചാരികമായി ‘പിരിച്ചയച്ചു’ എന്നു വ്യക്തമാക്കാതെ, ജനക്കൂട്ടത്തെ വിട്ടുപോകുന്നതാണ് സ്വാഭാവികമായ അർഥം.
- source_word: παραλαμβάνουσιν αὐτόν
  choice: യേശുവിനെ ... അവർ കൂടെ കൊണ്ടുപോയി
  rationale: παραλαμβάνω ഇവിടെ ഒരാളെ തങ്ങളോടൊപ്പം കൊണ്ടുപോകുക എന്ന അർഥത്തിലാണ്. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായി നൽകി.
- source_word: ὡς ἦν ἐν τῷ πλοίῳ
  choice: പടകിൽ ഉണ്ടായിരുന്ന യേശുവിനെ അതേപടി
  rationale: യേശു ഇതിനകം പടകിലായിരുന്നു എന്ന സ്ഥലസൂചനയും, കൂടുതൽ ഒരുക്കമില്ലാതെ ‘അതേപടി’ കൊണ്ടുപോയി എന്ന സാധ്യതയും ഈ രൂപം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; വാക്യഘടനയിലെ സാധ്യതയുള്ള വ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἄλλα πλοῖα
  choice: വേറെ പടകുകളും
  rationale: ഗ്രീക്കിൽ വലിപ്പം സൂചിപ്പിക്കുന്ന വിശേഷണമില്ലാത്തതിനാൽ ‘ചെറിയ’ എന്നു ചേർക്കാതെ ലളിതമായി വിവർത്തനം ചെയ്തു.
- source_word: ἦν μετ’ αὐτοῦ
  choice: അവനോടൊപ്പം ഉണ്ടായിരുന്നു
  rationale: നപുംസകലിംഗ ബഹുവചന കർത്താവിനോടൊപ്പം ഗ്രീക്കിൽ ഏകവചന ക്രിയ വന്നിട്ടുണ്ടെങ്കിലും അർഥം ബഹുവചനമാണ്. μετ’ αὐτοῦ എന്നതിന്റെ ലളിതവും തുറന്നതുമായ അർഥം നിലനിർത്തി.
theological_decisions:
- issue: ὡς ἦν ἐν τῷ πλοίῳ എന്നതിന്റെ ബന്ധവും ഊന്നലും
  choice: യേശു പടകിൽ ഉണ്ടായിരുന്നുവെന്നും അവനെ ‘അതേപടി’ കൊണ്ടുപോയെന്നും പ്രധാനവാചകത്തിൽ സൂചിപ്പിച്ചു.
  alternative: ‘അവൻ പടകിൽ ഉണ്ടായിരുന്നതുപോലെതന്നെ അവർ അവനെ കൂടെ കൊണ്ടുപോയി’ എന്നിങ്ങനെ വാക്യഘടനയെ കൂടുതൽ അക്ഷരാർഥത്തിൽ നൽകാം.
  rationale: ഗ്രീക്ക് പദക്രമം യേശുവിന്റെ നിലവിലുള്ള സ്ഥിതിയിലോ, അവൻ ഇതിനകം പടകിലായിരുന്നുവെന്നതിലോ ഊന്നാം. ഇതിന് പ്രത്യേക സിദ്ധാന്തപരമായ തീർപ്പ് നൽകാതെ അടിക്കുറിപ്പിലൂടെ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ജനക്കൂട്ടം’, ‘പടക്’, ‘കൂടെ കൊണ്ടുപോയി’ തുടങ്ങിയ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
