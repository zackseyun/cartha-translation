source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν· Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ ⸀ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ദൈവരാജ്യം ഇങ്ങനെയാണ്: ഒരു മനുഷ്യൻ നിലത്ത് വിത്ത് വിതറുന്നതുപോലെ[a]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിലെ താരതമ്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നു. മറ്റൊരു പരിഭാഷ: “ദൈവരാജ്യം ഒരു മനുഷ്യൻ നിലത്ത് വിത്ത് വിതയ്ക്കുന്നതുപോലെയാണ്.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ അപൂർണഭൂതകാലരൂപം സംസാരിച്ചുകൊണ്ടിരുന്നതോ പതിവായി പറഞ്ഞിരുന്നതോ സൂചിപ്പിക്കാം. എന്നാൽ കഥനത്തിലെ സംഭാഷണപരിചയപ്പെടുത്തലായി ആധുനിക മലയാളത്തിൽ ‘പറഞ്ഞു’ സ്വാഭാവികമാണ്; ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ഇവിടെ അനാവശ്യമായി ദൈർഘ്യം ഊന്നിപ്പറയാം.
- source_word: Οὕτως
  choice: ഇങ്ങനെയാണ്
  rationale: തുടർന്നുവരുന്ന ഉപമയുടെ രീതി പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: ദൈവത്തിന്റെ ഭരണത്തെയും രാജ്യമെന്ന യാഥാർഥ്യത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന, സുവിശേഷഭാഷയിൽ സുപരിചിതമായ പ്രയോഗം.
- source_word: ὡς
  choice: പോലെ
  rationale: അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന താരതമ്യം തുറന്ന നിലയിൽ നിലനിർത്തുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ഉറവിടത്തിലെ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനത്തിലുള്ള പ്രതിനിധി കഥാപാത്രത്തെ നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: βάλῃ τὸν σπόρον
  choice: വിത്ത് വിതറുന്നതു
  rationale: βάλλω എന്നതിന് അടിസ്ഥാനമായി ‘എറിയുക’ എന്ന അർഥമുണ്ടെങ്കിലും കൃഷിസന്ദർഭത്തിൽ വിത്ത് വിതയ്ക്കുന്നതാണ് ഉദ്ദേശ്യം. ‘വിത്ത് വിതറുക’ ആ ചലനചിത്രവും സന്ദർഭാർഥവും ഒരുമിച്ച് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: നിലത്തിന്മേൽ
  rationale: ഇവിടെ γῆ പ്രപഞ്ചമായ ‘ഭൂമി’യെയല്ല, വിത്ത് വീഴുന്ന നിലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ἐπίയുടെ ഉപരിതലബന്ധവും ഈ രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അടുത്ത വാക്യത്തിലേക്കു തുടരുന്ന ചുരുക്കപ്പെട്ട ഉപമാഘടന
  choice: '‘ഇങ്ങനെയാണ്: ... പോലെ—’ എന്ന തുറന്ന ഘടന നിലനിർത്തി'
  alternative: ‘ഒരു മനുഷ്യൻ നിലത്ത് വിത്തു വിതയ്ക്കുന്നതുപോലെയാണ് ദൈവരാജ്യം’ എന്ന പൂർണവാക്യം
  rationale: Οὕτως ... ὡς എന്ന താരതമ്യം 27-ാം വാക്യത്തിലേക്കു തുടരുന്നു. അതിനെ ഈ വാക്യത്തിനുള്ളിൽ പൂർണമായി മിനുക്കിയാൽ ഉറവിടത്തിലെ കഥനപ്രവാഹവും ഉദ്ദേശ്യപൂർവമായ തുറന്ന നിലയും നഷ്ടപ്പെടും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യാവസാനത്തിലെ ദീർഘരേഖ ഉപമ 27-ാം വാക്യത്തിലേക്കു തുടരുന്നതായി സൂചിപ്പിക്കുന്നു; അടിക്കുറിപ്പുസൂചിക മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
