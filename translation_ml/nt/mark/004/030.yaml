- from: 'അവൻ തുടർന്ന് പറഞ്ഞു: “ദൈവരാജ്യത്തെ നാം എങ്ങനെ ഉപമിക്കണം? ഏത് ഉപമയിലൂടെ അതിനെ അവതരിപ്പിക്കണം[a]?”'
  to: 'അവൻ പറയുകയായിരുന്നു: “ദൈവരാജ്യത്തെ നാം എങ്ങനെ ഉപമിക്കണം? അല്ലെങ്കിൽ, ഏത് ഉപമയിലൂടെ അതിനെ അവതരിപ്പിക്കണം[a]?”'
