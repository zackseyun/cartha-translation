translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആദ്യത്തെ ബഹുവചനമായ ‘നാം’ ഗ്രീക്കിലെ deliberative subjunctive നിലനിർത്തുന്നു. ചോദ്യം രണ്ടായി പിരിച്ച് മലയാളത്തിലെ സ്വാഭാവിക വാക്യഗതി പാലിച്ചിരിക്കുന്നു.
