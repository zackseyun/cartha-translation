source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: ml
  text: 'അവൻ പറയുകയായിരുന്നു: “ദൈവരാജ്യത്തെ നാം എങ്ങനെ ഉപമിക്കണം? അല്ലെങ്കിൽ, ഏത് ഉപമയിലൂടെ അതിനെ അവതരിപ്പിക്കണം[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഏത് ഉപമയിൽ അതിനെ ആവിഷ്കരിക്കണം?” ἐν τίνι παραβολῇ θῶμεν എന്ന ഗ്രീക്ക് പ്രയോഗത്തിൽ ഉപമയെ ഒരു ഉപാധിയായോ ആശയം അവതരിപ്പിക്കുന്ന ചട്ടക്കൂടായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: തുടർന്ന് പറഞ്ഞു
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയുള്ള ആഖ്യാനഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വെറും ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ അതിന്റെ സന്ദർഭബന്ധവും നിലനിർത്തുന്നു.
- source_word: Πῶς
  choice: എങ്ങനെ
  rationale: താരതമ്യം ചെയ്യുന്ന രീതി ചോദിക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: ὁμοιώσωμεν
  choice: നാം ... ഉപമിക്കണം
  rationale: ആലോചനാത്മകമായ aorist subjunctive-ന്റെ ‘നാം എങ്ങനെ ചെയ്യണം?’ എന്ന ചോദ്യഭാവം നിലനിർത്തുന്നു.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: ‘ദൈവത്തിന്റെ രാജ്യം’ എന്ന ആശയം സംക്ഷിപ്തമായും മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതമായും നൽകുന്നു; രാജത്വത്തിന്റെയും ഭരണത്തിന്റെയും ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: ἐν τίνι ... παραβολῇ
  choice: ഏത് ഉപമയിലൂടെ
  rationale: ἐν + dative ഇവിടെ ഉപാധി സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മറ്റൊരു വായനാസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παραβολῇ
  choice: ഉപമ
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ സാഹിത്യരൂപത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പദം.
- source_word: αὐτὴν ... θῶμεν
  choice: അതിനെ അവതരിപ്പിക്കണം
  rationale: τίθημι എന്നതിന്റെ അക്ഷരാർഥമായ ‘വെക്കുക’ എന്നതിനു പകരം, ഉപമ മുഖേന ഒരു വിഷയം മുന്നോട്ടുവയ്ക്കുക എന്ന ഈ പ്രയോഗത്തിലെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
