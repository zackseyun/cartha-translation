revisions:
- from: അവൻ തനിച്ചായിരിക്കുമ്പോൾ[a], അവന്റെ ചുറ്റുമുണ്ടായിരുന്നവർ പന്ത്രണ്ടുപേരോടുകൂടെ ഉപമകളെക്കുറിച്ച് അവനോട് ചോദിച്ചുകൊണ്ടിരുന്നു.
