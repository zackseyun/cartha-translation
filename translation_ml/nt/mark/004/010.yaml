id: MRK.4.10
reference: Mark 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: ml
  text: അപ്പോൾ, അവൻ സ്വകാര്യമായി ഇരിക്കുമ്പോൾ[a], അവന്റെ ചുറ്റുമുണ്ടായിരുന്നവർ പന്ത്രണ്ടുപേരോടൊപ്പം ഉപമകളെക്കുറിച്ച് അവനോടു ചോദിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ തനിച്ചായിരിക്കുമ്പോൾ.” ഇവിടെ ഈ പ്രയോഗം ജനക്കൂട്ടത്തിൽനിന്ന് മാറിയ ഒരു സ്വകാര്യസാഹചര്യത്തെ സൂചിപ്പിക്കാം; യേശുവിനോടൊപ്പം അനുയായികളാരും ഇല്ലായിരുന്നു എന്നർഥം നിർബന്ധമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: അവൻ ... ആയിരിക്കുമ്പോൾ
  rationale: കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. വാക്യാരംഭത്തിലെ καί ഇവിടെ ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകമായി ‘എന്നിട്ട്’ എന്നു ചേർക്കാതെ മലയാള വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: ἐγένετο κατὰ μόνας
  choice: തനിച്ചായിരിക്കുമ്പോൾ
  rationale: κατὰ μόνας എന്ന പ്രയോഗത്തിന്റെ സ്വകാര്യമായോ ജനക്കൂട്ടത്തിൽനിന്ന് മാറിയോ ഉള്ള അവസ്ഥ എന്ന ആശയം ലളിതമായി നൽകുന്നു; സമീപത്ത് ശിഷ്യന്മാരാരും ഇല്ലായിരുന്നു എന്ന് നിർബന്ധമായി അർഥമാക്കാതിരിക്കാനായി അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: ἠρώτων
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ περὶ αὐτὸν
  choice: അവന്റെ ചുറ്റുമുണ്ടായിരുന്നവർ
  rationale: യേശുവിനെ ചുറ്റിപ്പറ്റിയിരുന്ന വിശാലമായ അനുയായിവൃന്ദത്തെ സൂചിപ്പിക്കുകയും അവരെ തുടർന്നുപറയുന്ന പന്ത്രണ്ടുപേരിൽ മാത്രം ഒതുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: σὺν τοῖς δώδεκα
  choice: പന്ത്രണ്ടുപേരോടുകൂടെ
  rationale: മറ്റു അനുയായികളോടൊപ്പം പന്ത്രണ്ടുപേരും ഉണ്ടായിരുന്നുവെന്ന σύν എന്ന പദത്തിന്റെ സഹവർത്തിത്വഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: τὰς παραβολάς
  choice: ഉപമകളെക്കുറിച്ച്
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു; ചോദ്യം ഉപമാപരമായ പഠിപ്പിക്കലുകളെ സംബന്ധിച്ചതാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ചോദിച്ചവരുടെ തിരിച്ചറിയൽ
  choice: യേശുവിന്റെ ചുറ്റുമുണ്ടായിരുന്ന വിശാലമായ അനുയായിവൃന്ദം പന്ത്രണ്ടുപേരോടുകൂടെ ചോദിച്ചു.
  alternative: പന്ത്രണ്ടുപേർ മാത്രം ചോദിച്ചു; അല്ലെങ്കിൽ പന്ത്രണ്ടുപേരിൽനിന്ന് വേറിട്ട ഒരു സ്വകാര്യ വൃന്ദം ചോദിച്ചു.
  rationale: οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα എന്ന ഘടന സ്വാഭാവികമായി പന്ത്രണ്ടുപേരും ഉൾപ്പെട്ട വിശാലമായ ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. വിവർത്തനം ഇരുകൂട്ടങ്ങളെയും ഒന്നാക്കി ചുരുക്കാതെ വാചകത്തിലെ വ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു.
- issue: ‘തനിച്ചായിരിക്കുക’ എന്നതിന്റെ പരിധി
  choice: ജനക്കൂട്ടത്തിന്റെ പൊതുസാഹചര്യത്തിൽനിന്ന് മാറി സ്വകാര്യമായി ഇരിക്കുക; അനുയായികളൊന്നും സമീപത്തില്ലെന്ന നിർബന്ധാർഥമില്ല.
  alternative: യേശു പൂർണമായും ഒറ്റയ്ക്കായിരുന്നു.
  rationale: അടുത്ത വാക്യഭാഗത്തിൽ അനുയായികൾ അവനോടു ചോദിക്കുന്നതിനാൽ κατὰ μόνας എന്ന പ്രയോഗം സ്വകാര്യസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നതാണ് സന്ദർഭോചിതം; എന്നിരുന്നാലും മൂലപ്രയോഗത്തിന്റെ ‘തനിച്ച്’ എന്ന നേരിട്ടുള്ള ഭാവം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പന്ത്രണ്ടുപേർ’ എന്ന പരിചിതമായ ബൈബിൾ പ്രയോഗവും ‘ഉപമകൾ’ എന്ന പൊതുവായി ഗ്രഹിക്കാവുന്ന പദവും ഉപയോഗിച്ചു; ഗ്രീക്കിലെ അപൂർണ്ണകാലത്തിന്റെ തുടരുന്ന ഭാവം ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു.
