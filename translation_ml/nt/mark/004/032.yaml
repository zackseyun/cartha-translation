id: MRK.4.32
reference: Mark 4:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: ml
  text: അത് വിതയ്ക്കപ്പെടുമ്പോൾ, അത് മുളച്ചുവരുകയും എല്ലാ തോട്ടച്ചെടികളേക്കാൾ വലുതായിത്തീരുകയും വലിയ കൊമ്പുകൾ പുറപ്പെടുവിക്കുകയും ചെയ്യുന്നു. അങ്ങനെ ആകാശത്തിലെ പക്ഷികൾക്ക്[a] അതിന്റെ തണലിൽ കൂടുകൂട്ടാൻ[b] കഴിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വാനിലെ പക്ഷികൾ’; പരമ്പരാഗതമായി, ‘ആകാശപ്പറവകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വസിക്കാൻ’ അല്ലെങ്കിൽ ‘പാർക്കാൻ.’ മഹാവൃക്ഷത്തിൽ പക്ഷികൾ അഭയം കണ്ടെത്തുന്ന പഴയനിയമചിത്രത്തിന്റെ പ്രതിധ്വനി ഈ വാക്കുകളിൽ ഉണ്ടായേക്കാം (ഉദാ., യെഹെസ്കേൽ 17:23; ദാനീയേൽ 4:12).
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: വിതയ്ക്കപ്പെടുമ്പോൾ
  rationale: ὅταν-നോടുകൂടിയ aorist passive subjunctive അനിശ്ചിതമായി ആവർത്തിക്കാവുന്ന സമയസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ പ്രയോഗം കർമണിഭാവവും വിത്തുവിതയ്ക്കുന്ന ദൃഷ്ടാന്തചിത്രവും നിലനിർത്തുന്നു.
- source_word: ἀναβαίνει
  choice: മുളച്ചുയർന്ന്
  rationale: കൃഷിസന്ദർഭത്തിൽ മണ്ണിൽനിന്ന് മുകളിലേക്കു വളർന്നുവരുന്നതാണ് അർഥം. ‘മുളച്ചുയർന്ന്’ എന്നത് ആ ചലനവും സസ്യവളർച്ചയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: γίνεται
  choice: വലുതാകുകയും
  rationale: γίνομαι ഫലമായി കൈവരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള താരതമ്യവിശേഷണത്തോടൊപ്പം ‘വലുതാകുന്നു’ എന്നത് വികസനഭാവം നിലനിർത്തുന്നു.
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: എല്ലാ തോട്ടച്ചെടികളെയുംകാൾ വലുത്
  rationale: λάχανα ഇവിടെ മരങ്ങളെയല്ല, തോട്ടത്തിൽ വളർത്തുന്ന ചെടികളെയാണ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിലെ താരതമ്യഘടന നേരിട്ട് നിലനിർത്താൻ ‘എല്ലാ ... ചെടികളെയുംകാൾ വലുത്’ എന്നു നൽകി.
- source_word: ποιεῖ κλάδους μεγάλους
  choice: വലിയ കൊമ്പുകൾ പുറപ്പെടുവിക്കുന്നു
  rationale: സസ്യം കൊമ്പുകൾ വളർത്തുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്ന പ്രയോഗമാണ് ‘കൊമ്പുകൾ പുറപ്പെടുവിക്കുന്നു’; ποιεῖ എന്നതിന്റെ അക്ഷരാർഥമായ ‘ഉണ്ടാക്കുന്നു’ ഇവിടെ കൃത്രിമമായി തോന്നും.
- source_word: ὥστε δύνασθαι
  choice: അങ്ങനെ ... കഴിയുന്നു
  rationale: ὥστε + infinitive ഫലത്തെ സൂചിപ്പിക്കുന്നു. ‘അങ്ങനെ ... കഴിയുന്നു’ കാരണം-ഫലബന്ധവും കഴിവിന്റെ ആശയവും വ്യക്തമായി നൽകുന്നു.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: അതിന്റെ തണലിൽ
  rationale: σκιάയ്ക്ക് ‘നിഴൽ’ എന്നും ‘തണൽ’ എന്നും അർഥമുണ്ടെങ്കിലും, പക്ഷികൾ അഭയം കണ്ടെത്തുന്ന ഈ സന്ദർഭത്തിൽ ‘തണൽ’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: οὐρανός ഇവിടെ ദൃശ്യമായ ആകാശത്തെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം. ‘ആകാശത്തിലെ പക്ഷികൾ’ മൂലപ്രയോഗത്തോട് അടുത്തതും ആധുനിക മലയാളത്തിൽ വ്യക്തവുമാണ്.
- source_word: κατασκηνοῦν
  choice: കൂടുകൂട്ടാൻ
  rationale: κατασκηνόω എന്നതിന് പാർക്കുക, വസിക്കുക, താവളമാക്കുക എന്നീ അർഥങ്ങളുണ്ട്. പക്ഷികളുടെ സന്ദർഭത്തിൽ ‘കൂടുകൂട്ടുക’ ചിത്രം സ്വാഭാവികമായി അറിയിക്കുന്നു; വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വലിയ കൊമ്പുകളുടെ തണലിൽ പക്ഷികൾ അഭയം കണ്ടെത്തുന്ന പഴയനിയമസാദൃശ്യം
  choice: പ്രധാനവാചകത്തിൽ ചിത്രം മാത്രം നിലനിർത്തി, അതിന്റെ ദൈവശാസ്ത്രപരമായ അർഥം വിശദീകരിക്കാതിരിക്കുക
  alternative: പഴയനിയമത്തിലെ മഹാവൃക്ഷചിത്രവുമായി കൂടുതൽ വാചികസാദൃശ്യം നിലനിർത്താൻ ‘വസിക്കാൻ’ അല്ലെങ്കിൽ ‘പാർക്കാൻ’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: യെഹെസ്കേൽ 17:23; ദാനീയേൽ 4:12 തുടങ്ങിയ ഭാഗങ്ങളിലെ വൃക്ഷത്തണലിൽ പക്ഷികൾ അഭയം കണ്ടെത്തുന്ന ചിത്രത്തിന്റെ പ്രതിധ്വനി ഇവിടെ ഉണ്ടായേക്കാം. എന്നാൽ ഗ്രീക്ക് വാചകം അതിനെ വ്യാഖ്യാനിക്കുന്നില്ല; അതിനാൽ പ്രധാനവാചകത്തിൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്രവായന ചേർക്കാതെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. കൃഷിദൃശ്യം വ്യക്തമായി നിലനിർത്താൻ ‘മുളച്ചുയർന്ന്,’ ‘തോട്ടച്ചെടികൾ,’ ‘കൊമ്പുകൾ പുറപ്പെടുവിക്കുന്നു’ എന്നീ സ്വാഭാവിക പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പുസൂചകങ്ങൾ അവയുടെ യഥാർഥ പദങ്ങളോടു പൊരുത്തപ്പെടുന്ന സ്ഥാനങ്ങളിലാക്കി.
