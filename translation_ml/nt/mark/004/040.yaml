  text: καὶ εἶπεν αὐτοῖς· Τί δειλοί ἐστε; ⸀οὔπω ἔχετε πίστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/040.yaml
  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്തിനാണ് ഇങ്ങനെ ഭയപ്പെടുന്നത്?[a] നിങ്ങൾക്ക് ഇനിയും വിശ്വാസമില്ലേ?[b][c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിങ്ങൾ എന്തിന് ഇങ്ങനെ ഭീരുക്കളായിരിക്കുന്നു?”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “നിങ്ങൾക്ക് ഇതുവരെ വിശ്വാസമില്ലേ?”'
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ “വിശ്വാസം” എന്നത് “ആശ്രയബോധം” എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: അവൻ
  rationale: മുൻവിവരണത്തോടുള്ള ലളിതമായ ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ പ്രത്യേകം ‘എന്നിട്ട്’ ചേർക്കാതെയും നിലനിൽക്കുന്നു; കർത്താവ് ക്രിയയോടൊപ്പം വ്യക്തമാക്കുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന സാധാരണവും സുതാര്യവുമായ മലയാളപ്രയോഗം.
- source_word: Τί
  choice: എന്തിന്
  rationale: വിശേഷണത്തോടും ‘ആകുക’ എന്ന ക്രിയയോടും ചേർന്ന ഈ ഗ്രീക്ക് ചോദ്യപ്രയോഗം കാരണത്തെ ചോദിക്കുന്ന ശാസനയായതിനാൽ ‘എന്തിന്’ സ്വാഭാവികമാണ്.
- source_word: δειλοί
  choice: ഭയപ്പെടുന്നു
  rationale: കൊടുങ്കാറ്റിന്റെ പശ്ചാത്തലത്തിൽ ശിഷ്യരുടെ ഭയത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; പദത്തിന്റെ ശക്തമായ ‘ഭീരുക്കൾ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐστε
  choice: ഇങ്ങനെ ...പ്പെടുന്നു
  rationale: ഗ്രീക്കിലെ നിലവിലുള്ള അവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായ വർത്തമാനപ്രയോഗമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὔπω
  choice: ഇനിയും ... ഇല്ലേ
  rationale: ‘ഇതുവരെ ഇല്ല’ എന്ന കാലസൂചനയും ശാസനാത്മകമായ ചോദ്യഭാവവും ഒരുമിച്ച് പകരുന്നു.
- source_word: ἔχετε
  choice: നിങ്ങൾക്ക് ... ഇല്ലേ
  rationale: ഉണ്ടായിരിക്കുക/കൈവശമുണ്ടാകുക എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവിക ദത്തിവാക്യഘടനയിൽ നൽകുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്ന നാമത്തിന്റെ പതിവും സുതാര്യവുമായ പരിഭാഷ; ഈ സന്ദർഭത്തിലെ ‘ആശ്രയം’ എന്ന അർഥനിറം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യരുടെ ഭയത്തെ സൂചിപ്പിക്കുന്ന δειλοί എന്ന പദത്തിന്റെ ശക്തി
  choice: ഭയപ്പെടുന്നു
  alternative: ഭീരുക്കളായിരിക്കുന്നു
  rationale: സന്ദർഭം കൊടുങ്കാറ്റിനിടയിലെ ഭയത്തെ നേരിട്ട് ചൂണ്ടിക്കാണിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് പദത്തിന്റെ കൂടുതൽ ശക്തമായ നൈതികനിറം മായ്ച്ചുകളയാതിരിക്കാൻ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: πίστις എന്നത് ഈ സന്ദർഭത്തിൽ വിശ്വാസമോ ആശ്രയമോ
  choice: വിശ്വാസം
  alternative: ആശ്രയം
  rationale: ഗ്രീക്ക് നാമത്തെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ പതിവ് പരിഭാഷ പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; യേശുവിലുള്ള ആശ്രയമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെടാവുന്നതെന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: οὔπωയുടെ കാലസൂചന
  choice: ഇനിയും വിശ്വാസമില്ലേ?
  alternative: നിങ്ങൾക്ക് ഇതുവരെ വിശ്വാസമില്ലേ?
  rationale: രണ്ടും ‘not yet’ എന്ന അർഥം നൽകുന്നു; പ്രധാനപാഠത്തിലെ രൂപം മലയാളത്തിൽ ചുരുക്കവും ശാസനാത്മക ചോദ്യത്തിന് സ്വാഭാവികവുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. യേശുവിന്റെ ശാസനയുടെ മൂർച്ച നിലനിർത്തുന്നതിനൊപ്പം, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ചോദ്യഘടന ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പ്രധാനപാഠസ്ഥാനങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
