id: MRK.4.33
reference: Mark 4:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: ml
  text: ഇത്തരം അനേകം ഉപമകളിലൂടെ, അവർക്ക് കേൾക്കാൻ കഴിയുന്നത്ര[b], അവൻ അവരോടു വചനം[a] പറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സന്ദേശം” അല്ലെങ്കിൽ “ഉപദേശം.”
    reason: lexical_alternative
  - marker: b
    text: “അവർക്ക് കേൾക്കാൻ കഴിയുന്ന അളവിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις παραβολαῖς πολλαῖς
  choice: ഇത്തരം അനേകം ഉപമകളിലൂടെ
  rationale: മുമ്പ് പറഞ്ഞ ഉപമകളുടെ സ്വഭാവത്തിലേക്കുള്ള സൂചനയും πολλαῖς എന്നതിന്റെ അളവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐλάλει αὐτοῖς
  choice: അവൻ അവരോടു ... പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: ἐλάλει എന്ന അപൂർണ്ണകാലത്തിന്റെ തുടരുന്ന/പതിവായ പ്രവർത്തനഭാവം ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ സംരക്ഷിക്കുന്നു; αὐτοῖς സ്വാഭാവികമായി ‘അവരോടു’ എന്നു നൽകി.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: യേശു അറിയിച്ച സന്ദേശത്തെയോ ഉപദേശത്തെയോ സൂചിപ്പിക്കുമ്പോഴും ഗ്രീക്കിലെ λόγος എന്ന പദത്തിന്റെ ബൈബിൾപരമായ പ്രതിധ്വനി നിലനിർത്തുന്നു.
- source_word: καθὼς ἠδύναντο ἀκούειν
  choice: അവർക്ക് കേൾക്കാൻ കഴിയുന്നത്ര
  rationale: καθὼς ഇവിടെ അളവിനെയോ ശേഷിക്കനുസൃതമായ പൊരുത്തത്തെയോ സൂചിപ്പിക്കുന്നു. ἀκούειν എന്നത് ‘മനസ്സിലാക്കുക’ എന്നു വ്യാഖ്യാനിച്ച് ശക്തമാക്കാതെ ‘കേൾക്കുക’ എന്ന അടിസ്ഥാനാർഥത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: τὸν λόγον എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: വചനം
  alternative: സന്ദേശം; ഉപദേശം
  rationale: ഇവിടെ യേശുവിന്റെ പ്രസംഗത്തിന്റെയും ഉപദേശത്തിന്റെയും ഉള്ളടക്കമാണ് ഉദ്ദേശിക്കുന്നത്. ‘വചനം’ മൂലപദത്തിന്റെ രൂപവും മർക്കോസിലെ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; എന്നാൽ അതിനെ സാങ്കേതികമായ ഒരു സിദ്ധാന്തപദമായി ചുരുക്കുന്നില്ല.
- issue: ἀκούειν എന്നതിലെ ഗ്രഹണസൂചന
  choice: കേൾക്കാൻ
  alternative: മനസ്സിലാക്കാൻ; സ്വീകരിക്കാൻ
  rationale: കേൾക്കൽ ഗ്രഹണത്തെയും സ്വീകരണത്തെയും ഉൾക്കൊള്ളാമെങ്കിലും, ഗ്രീക്ക് നേരിട്ട് പറയുന്നതിനെക്കാൾ ശക്തമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ആശയപിരിമുറുക്ക് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഉപമ’, ‘വചനം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; വാക്യത്തിന്റെ അർഥബന്ധം വ്യക്തമാക്കാൻ അളവുസൂചക ഉപവാക്യം മുഖ്യക്രിയയ്ക്ക് മുമ്പിൽ വെച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
