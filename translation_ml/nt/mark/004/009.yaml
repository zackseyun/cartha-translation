  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· ⸂Ὃς ἔχει⸃ ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞുകൊണ്ടിരുന്നു: “കേൾക്കാൻ ചെവിയുള്ളവൻ കേൾക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ഇവിടെ καὶ ലളിതമായ ആഖ്യാനബന്ധകമാണ്. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ മുൻവാക്യത്തോടുള്ള ബന്ധം വാക്യക്രമംകൊണ്ട് വ്യക്തമാകുന്നതിനാൽ ‘കൂടാതെ’ എന്നോ ‘പിന്നെ’ എന്നോ ചേർത്ത് അർഥനിറം വർധിപ്പിച്ചിട്ടില്ല.
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: λέγω എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടരുന്ന ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘പറഞ്ഞു’ എന്ന ലളിതഭൂതകാലത്തേക്കാൾ ഉറവിടത്തിന്റെ ദൃശ്യഭാവത്തോട് അടുത്തതാണ്, എന്നാൽ ആവർത്തനം അമിതമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: Ὃς ἔχει
  choice: ഉള്ളവൻ
  rationale: ഗ്രീക്കിലെ ഏകവചന പൊതുവാചകത്തിന്റെ സാരവും ചൊല്ലിന്റെ ചുരുക്കവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, പൊതുവായ ആഹ്വാനമാണ്.
- source_word: ὦτα
  choice: ചെവി
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും മലയാളത്തിലെ പതിവായ ‘കേൾക്കാൻ ചെവിയുള്ളവൻ’ എന്ന പ്രയോഗത്തിൽ ഏകവചനം സ്വാഭാവികവും പൊതുവായ ശേഷിയെ സൂചിപ്പിക്കുന്നതുമാണ്; ശരീരാവയവങ്ങളുടെ എണ്ണത്തിൽ അനാവശ്യ ഊന്നൽ ഒഴിവാക്കുന്നു.
- source_word: ἀκούειν
  choice: കേൾക്കാൻ
  rationale: ഉദ്ദേശ്യാർഥക ക്രിയാരൂപം നേരിട്ട് നൽകുകയും പിന്നാലെയുള്ള ἀκουέτω-യുമായുള്ള ‘കേൾക്കുക’ എന്ന പദാവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀκουέτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന വർത്തമാനകാല ആജ്ഞയുടെ ആഹ്വാനാത്മക ശക്തി മലയാളത്തിലെ ‘-ട്ടെ’ രൂപം സ്വാഭാവികമായി നൽകുന്നു; മുൻപത്തെ ‘കേൾക്കാൻ’ എന്നതുമായുള്ള ഉദ്ദേശപൂർവമായ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ചൊല്ലിലെ വ്യാകരണപരമായ പുല്ലിംഗ ഏകവചനത്തിന്റെ പൊതുവ്യാപ്തി
  choice: ‘കേൾക്കാൻ ചെവിയുള്ളവൻ കേൾക്കട്ടെ’ എന്ന പൊതുവാചക ഏകവചനരൂപം
  alternative: ‘കേൾക്കാൻ ചെവിയുള്ള ആരും കേൾക്കട്ടെ’
  rationale: Ὃς ἔχει ... ἀκουέτω എന്നത് വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും അർഥത്തിൽ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന പൊതുവായ ആഹ്വാനമാണ്. മലയാളത്തിലെ ‘ഉള്ളവൻ’ ഈ ചൊല്ലിന്റെ ഏകവചന ഘടനയും ഗൗരവവും കാത്തുസൂക്ഷിക്കുന്നു; പുരുഷന്മാരിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചൊല്ലുരൂപം. ഗ്രീക്കിലെ ‘കേൾക്കുക’ എന്ന പദാവർത്തനം സൂക്ഷിച്ചിട്ടുണ്ട്. വായനക്കാരന് എളുപ്പം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വാക്യം ചുരുക്കമായി നിലനിർത്തി.
