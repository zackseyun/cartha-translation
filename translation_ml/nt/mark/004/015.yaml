id: MRK.4.15
reference: Mark 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: ml
  text: 'വഴിയരികിലുള്ളവർ ഇവരാണ്: അവിടെ വചനം വിതയ്ക്കപ്പെടുന്നു. അവർ കേൾക്കുമ്പോൾത്തന്നെ സാത്താൻ വന്ന്, അവരിൽ വിതയ്ക്കപ്പെട്ട[a] വചനം എടുത്തുകളയുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരിലേക്കു വിതയ്ക്കപ്പെട്ട.’
    reason: εἰς αὐτούς എന്നതിന് ‘അവരിൽ’ എന്നും കൂടുതൽ ദിശാസൂചനയോടെ ‘അവരിലേക്കു’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν
  choice: ഇവരാണ്
  rationale: തിരിച്ചറിയൽ വ്യക്തമാക്കുന്നു. δέ ഇവിടെ നേരിയ ആശയബന്ധം മാത്രമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ സ്വാഭാവികമായി അത് നിലനിർത്താം.
- source_word: οἱ παρὰ τὴν ὁδόν
  choice: വഴിയരികിലുള്ളവർ
  rationale: παράയും കർമണിവിഭക്തിയും ചേർന്ന് വഴിയുടെ അരികിലുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു. ഉപമയിലെ സ്ഥലം ആളുകളെ പ്രതിനിധാനം ചെയ്യുന്നതാണെന്ന് ‘ഉള്ളവർ’ വ്യക്തമാക്കുന്നു.
- source_word: σπείρεται ὁ λόγος
  choice: വചനം വിതയ്ക്കപ്പെടുന്നു
  rationale: കർമണിപ്രയോഗവും വിതയ്ക്കൽരൂപകവും നിലനിർത്തുന്നു. λόγος എന്ന ആവർത്തിത പദത്തിന് ‘വചനം’ എന്നത് ദൈവശാസ്ത്രപരമായ അനാവശ്യ വിശദീകരണം ചേർക്കാതെ സന്ദേശത്തിന്റെ അർഥവും ബൈബിൾപ്രതിധ്വനിയും സൂക്ഷിക്കുന്നു.
- source_word: ὅταν ἀκούσωσιν
  choice: അവർ കേൾക്കുമ്പോൾത്തന്നെ
  rationale: ὅταν സഹിതമുള്ള aorist subjunctive പൊതുവായ കാലബന്ധം നൽകുന്നു; εὐθύς സൂചിപ്പിക്കുന്ന അടിയന്തരത ‘തന്നെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ Σατανᾶς
  choice: സാത്താൻ
  rationale: വ്യക്തിപരമായ ദുഷ്ടശക്തിയെ സൂചിപ്പിക്കുന്ന പേരായി ഗ്രീക്ക് പ്രയോഗത്തെ നേരിട്ട് പകർത്തുന്നു.
- source_word: αἴρει
  choice: എടുത്തുകളയുന്നു
  rationale: എടുക്കുക, നീക്കുക എന്ന αἴρωയുടെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘തട്ടിപ്പറിക്കുന്നു’ എന്നതുപോലെ മൂലത്തിൽ ഇല്ലാത്ത ശക്തമായ ഭാവം ചേർക്കുന്നില്ല.
- source_word: τὸν ἐσπαρμένον εἰς αὐτούς
  choice: അവരിൽ വിതയ്ക്കപ്പെട്ട വചനം
  rationale: വിശേഷണസ്വഭാവമുള്ള participle ‘വചനം’ എന്നതിനെ വിശേഷിപ്പിക്കുന്നു. εἰς αὐτούς ഇവിടെ ഉള്ളിലേക്കുള്ള സ്വീകരണത്തെ സൂചിപ്പിക്കാമെങ്കിലും ‘അവരിൽ’ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ആ അർഥം നൽകുന്നു; ദിശാസൂചനയുള്ള മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: ഉപമയുടെ വിശദീകരണത്തിൽ സാത്താന്റെ വ്യക്തിപരമായ പ്രവർത്തനം
  choice: വന്ന് വചനം എടുത്തുകളയുന്ന വ്യക്തിപരമായ ‘സാത്താൻ’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘എതിരാളി’ എന്ന പൊതുവായതോ വ്യക്തിത്വരഹിതമായതോ ആയ പ്രയോഗം.
  rationale: ὁ Σατανᾶς എന്ന നിർദിഷ്ട നാമം ഇവിടെ വ്യക്തിപരമായ ദുഷ്ടനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; അതിനെ ഒരു അമൂർത്ത ശക്തിയായി വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കരുത്.
- issue: εἰς αὐτούς എന്നതിലെ സ്ഥല-ദിശാ സൂക്ഷ്മത
  choice: മുഖ്യപാഠത്തിൽ ‘അവരിൽ’ എന്നു നൽകി.
  alternative: ‘അവരിലേക്കു’ എന്നു ദിശാസൂചനയോടെ നൽകുക.
  rationale: സന്ദർഭം കേൾവിക്കാരിൽ വചനം സ്വീകരിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. എന്നാൽ εἰς എന്നതിലെ ‘അകത്തേക്ക്’ എന്ന ചലനസൂചന പൂർണമായി ഇല്ലാതാക്കാതിരിക്കാൻ പകരം വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വിതയ്ക്കൽരൂപകവും ‘വചനം’ എന്ന ആവർത്തനവും ഗ്രീക്കിലെ വർത്തമാനകാല വിശദീകരണഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
