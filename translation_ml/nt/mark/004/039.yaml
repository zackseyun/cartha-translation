id: MRK.4.39
reference: Mark 4:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: ml
  text: അവൻ ഉണർന്നെഴുന്നേറ്റ് കാറ്റിനെ ശാസിച്ചു; കടലിനോട്[b], “നിശ്ശബ്ദമാകൂ! വായടച്ചിരിക്ക്!”[a] എന്നു പറഞ്ഞു. കാറ്റ് നിലച്ചു; വലിയ ശാന്തത ഉണ്ടായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ രണ്ടു കല്പനകളുണ്ട്: “നിശ്ശബ്ദമാകൂ! വായ്മൂടപ്പെടൂ!” രണ്ടാമത്തേത് അക്ഷരാർഥത്തിൽ ‘വായ്മൂടപ്പെടുക’ (be muzzled) എന്ന ശക്തമായ പദചിത്രമാണ്. പരമ്പരാഗതമായി: “ശാന്തമാകൂ! അടങ്ങൂ!”'
    reason: lexical_alternative
  - marker: b
    text: 'ഇത് ഗലീലക്കടലാണ്; ഗ്രീക്കിൽ: “കടൽ.”'
    reason: cultural_note
lexical_decisions:
- source_word: διεγερθεὶς
  choice: ഉണർന്നെഴുന്നേറ്റ്
  rationale: കാലസൂചനയുള്ള aorist participle സ്വാഭാവികമായ മലയാളത്തിൽ പകർത്തുന്നു; അവനെ ആരാണ് ഉണർത്തിയതെന്ന് മുഖ്യവാചകത്തിൽ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἐπετίμησεν
  choice: ശാസിച്ചു
  rationale: മർക്കോസിൽ അധികാരപൂർവമായ വിലക്കിനെയോ കർശന കല്പനയെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἀνέμῳ
  choice: കാറ്റിനെ
  rationale: മൂലപദം കൊടുങ്കാറ്റിനെയല്ല, നേരിട്ട് ‘കാറ്റ്’ എന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: θαλάσσῃ
  choice: കടലിനോട്
  rationale: ഭൂമിശാസ്ത്രപരമായി തടാകമാണെങ്കിലും ഗ്രീക്ക് പദമായ θάλασσαയുടെ നേരിട്ടുള്ള അർഥമായ ‘കടൽ’ നിലനിർത്തുന്നു.
- source_word: Σιώπα
  choice: നിശ്ശബ്ദമാകൂ!
  rationale: ഉടൻ നിശ്ശബ്ദമാകാനുള്ള നേരിട്ടുള്ള കല്പന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πεφίμωσο
  choice: അടങ്ങിക്കിടക്കൂ!
  rationale: കടലിനോടുള്ള ശക്തമായ നിയന്ത്രണകല്പന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘വായ് മൂടപ്പെടുക’ എന്ന പദചിത്രം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκόπασεν
  choice: നിലച്ചു
  rationale: കാറ്റ് പൂർണമായി അവസാനിച്ചതിനെ സംക്ഷിപ്തമായും നേരിട്ടും അറിയിക്കുന്നു.
- source_word: ἐγένετο
  choice: ഉണ്ടായി
  rationale: തുടർന്നുണ്ടായ അവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: γαλήνη μεγάλη
  choice: വലിയ ശാന്തത
  rationale: മർക്കോസിന്റെ ‘വലിയ’ എന്ന ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് മൂലവാക്യത്തിന് അടുത്തുനിൽക്കുന്നു.
theological_decisions:
- issue: കടലിനോടുള്ള യേശുവിന്റെ രണ്ടാമത്തെ കല്പനയിലെ ‘വായ് മൂടുക’ എന്ന ശക്തമായ പദചിത്രം മുഖ്യവാചകത്തിൽ എങ്ങനെ നൽകണം
  choice: സ്വാഭാവിക മലയാളത്തിൽ ‘അടങ്ങിക്കിടക്കൂ!’ എന്നു നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി
  alternative: ‘വായ് മൂടപ്പെട്ടിരിക്കുക!’
  rationale: φιμόωയിലെ നിയന്ത്രണത്തിന്റെയും അധികാരത്തിന്റെയും ശക്തി മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ അസ്വാഭാവികമായ മലയാളപ്രയോഗം ഒഴിവാക്കുകയും യഥാർഥ പദചിത്രം മറച്ചുവയ്ക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകുകയും ചെയ്യുന്നു.
- issue: θάλασσα എന്നത് ‘കടൽ’ എന്നോ ഭൂമിശാസ്ത്രപരമായി ‘തടാകം’ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: കടൽ
  alternative: തടാകം
  rationale: മൂലഭാഷയിലെ പദം നിലനിർത്തുകയും കടലിന്മേലുള്ള അധികാരം എന്ന ആഖ്യാനത്തിന്റെ വിശാലമായ പ്രതിധ്വനി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു; സ്ഥലം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. യേശുവിന്റെ കല്പനകൾ ചുരുക്കവും അധികാരപൂർവവുമാക്കി; അസ്വാഭാവികമായ അക്ഷരപരിഭാഷയുടെ വിശദാംശം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
