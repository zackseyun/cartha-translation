id: MRK.4.35
reference: Mark 4:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ἐν ἐκείνῃ τῇ ἡμέρᾳ ὀψίας γενομένης· Διέλθωμεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: ml
  text: 'അന്ന് സന്ധ്യയായപ്പോൾ, അവൻ അവരോടു പറയുന്നു: “നമുക്ക് അക്കരേക്ക് കടക്കാം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ ആഖ്യാനശൈലിയിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്താൻ വർത്തമാനകാലരൂപം ഉപയോഗിച്ചു; മലയാളത്തിലും ഇത് സ്വാഭാവികമായ ആഖ്യാനചലനം നൽകുന്നു.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: അന്നേ ദിവസം
  rationale: നിർദ്ദിഷ്ടമായ അതേ ദിവസത്തെയാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘അന്നേ ദിവസം’ ആ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὀψίας γενομένης
  choice: സന്ധ്യയായപ്പോൾ
  rationale: സമയസൂചന നൽകുന്ന genitive absolute ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Διέλθωμεν
  choice: നമുക്ക് ... കടക്കാം
  rationale: പ്രഥമപുരുഷ ബഹുവചനത്തിലെ ആഹ്വാനാർഥക subjunctive-ന്റെ അർഥം മലയാളത്തിലെ ‘നമുക്ക് ... കടക്കാം’ കൃത്യമായി നൽകുന്നു.
- source_word: εἰς τὸ πέραν
  choice: അക്കരേക്കു
  rationale: തടാകത്തിന്റെ മറുകര എന്ന സന്ദർഭാർഥം സംക്ഷിപ്തവും സാധാരണവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം ബോധപൂർവം നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് വാക്യത്തിന്റെ വിവർത്തനവികൽപത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്; അത് ഇംഗ്ലീഷ് പ്രധാനവാക്യത്തിലെ [a] സ്ഥാനവുമായി പൊരുത്തപ്പെടുന്നില്ല. മലയാളത്തിൽ ‘നമുക്ക് അക്കരേക്കു കടക്കാം’ തന്നെ സ്വാഭാവികവും കൃത്യവുമായതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
