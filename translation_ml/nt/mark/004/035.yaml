    issue: ‘അന്നേ ദിവസം’ is slightly emphatic.
    rationale: The Greek phrase means ‘on that day’ and does not itself require the added emphasis conveyed by Malayalam -േ in ‘അന്നേ.’ A neutral temporal expression better preserves the source’s force.
