  terminology: No theological terminology is present. ‘സന്ധ്യയായപ്പോൾ,’ ‘നമുക്ക്,’ and ‘അക്കരേക്ക്’ are clear, standard narrative Malayalam. Retaining ‘പറയുന്നു’ suitably reflects Mark’s historical present.
  issues:
