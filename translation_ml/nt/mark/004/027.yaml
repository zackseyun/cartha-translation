  terminology: '‘രാവും പകലും,’ ‘മുളച്ച് വളരുന്നു,’ and ‘അവനുതന്നെ’ are appropriate. The second footnote’s stated literal rendering should be corrected: ὡς οὐκ οἶδεν αὐτός concerns the manner/how of the growth, not ‘in a way unknown to him’ as a literal formulation.'
