id: MRK.4.27
reference: Mark 4:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: ml
  text: അവൻ രാവും പകലും ഉറങ്ങുകയും എഴുന്നേൽക്കുകയും ചെയ്യുന്നു; വിത്ത് മുളച്ച് വളരുന്നു[a]. അത് എങ്ങനെയെന്ന് അവനുതന്നെ അറിയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വളരുന്നു’ എന്നതിനുള്ള ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘നീളം കൂടുന്നു’ അഥവാ ‘ഉയരത്തിൽ വളരുന്നു’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ, ‘അവനുതന്നെ എങ്ങനെയെന്ന് അറിയുന്നില്ല’ എന്ന ആശയമാണ്; സന്ദർഭത്തിൽ വളർച്ച എങ്ങനെ സംഭവിക്കുന്നുവെന്ന് അവന് അറിയില്ലെന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: ഉറങ്ങുകയും
  rationale: വർത്തമാനകാല സബ്ജങ്‌ടീവ് ഇവിടെ ഉപമയിലെ ആവർത്തിച്ചുകൊണ്ടിരിക്കുന്ന സാധാരണ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ക്രിയാസമുച്ചയം ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐγείρηται
  choice: എഴുന്നേൽക്കുകയും ചെയ്യുന്നു
  rationale: മധ്യ/കർമണി രൂപം ഇവിടെ ഉറക്കത്തിൽനിന്ന് എഴുന്നേൽക്കുക എന്ന അകർമക അർഥത്തിലാണ്; പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കാത്ത സാധാരണ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: νύκτα καὶ ἡμέραν
  choice: രാവും പകലും
  rationale: കാലത്തിന്റെ തുടർച്ചയായ ചക്രത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ദ്വന്ദ്വപ്രയോഗമായി നിലനിർത്തുന്നു.
- source_word: ὁ σπόρος
  choice: വിത്താകട്ടെ
  rationale: നിശ്ചയാർഥക ലേഖനം ഉപമയിൽ മുമ്പ് വിതച്ച വിത്തിലേക്കു തിരിച്ചുചൂണ്ടുന്നു; ‘ആകട്ടെ’ വിത്തിന്റെ വളർച്ചയിലേക്കുള്ള വിഷയമാറ്റം വ്യക്തമാക്കുന്നു, എന്നാൽ പുതിയ ആശയം ചേർക്കുന്നില്ല.
- source_word: βλαστᾷ
  choice: മുളച്ചു
  rationale: ചെടിയുടെ വളർച്ച ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ ആധുനിക മലയാളപദം.
- source_word: μηκύνηται
  choice: വളരുന്നു
  rationale: മൂലക്രിയയിൽ നീളം കൂടുക അഥവാ ഉയരം പ്രാപിക്കുക എന്ന പ്രത്യേക സൂചനയുണ്ടെങ്കിലും, സസ്യത്തെക്കുറിച്ച് ‘വളരുന്നു’ എന്നതാണ് സ്വാഭാവിക മലയാളം; പ്രത്യേക സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: അത് എങ്ങനെയെന്ന് അവനുതന്നെ അറിയില്ല
  rationale: ഗ്രീക്ക് ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി അർഥവത്താക്കുന്നു; αὐτός നൽകുന്ന ഊന്നൽ ‘അവനുതന്നെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപമയിൽ വിത്തിന്റെ വളർച്ചയ്ക്കുള്ള പ്രവർത്തകശക്തി
  choice: വളർച്ച എങ്ങനെ സംഭവിക്കുന്നു എന്ന് വിതക്കാരന് അറിയില്ലെന്ന നിലയിൽ വാക്യം തുറന്നുവെക്കുന്നു; പ്രവർത്തകനെ പേരെടുത്തു പറയുന്നില്ല.
  alternative: ദൈവമാണ് വളർത്തുന്നതെന്ന് നേരിട്ട് ചേർക്കുക, അല്ലെങ്കിൽ ഇതിനെ വെറും സ്വാഭാവിക പ്രക്രിയയായി നിർവചിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം വിത്തിന്റെ വളർച്ചയും മനുഷ്യന്റെ അറിവില്ലായ്മയും മാത്രം വ്യക്തമാക്കുന്നു. അതിനാൽ ദൈവിക പ്രവർത്തനം ഇവിടെ നേരിട്ട് ചേർക്കുകയോ അതിനെ നിഷേധിക്കുന്ന വിധത്തിൽ പ്രകൃതിവാദപരമായി ചുരുക്കുകയോ ചെയ്യാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘രാവും പകലും’ എന്ന മൂലപാഠത്തിലെ ക്രമവും ‘അവനുതന്നെ’ എന്ന ഊന്നലും സംരക്ഷിച്ചു. വിത്തിന്റെ വളർച്ചയുടെ രീതി വിശദീകരിക്കാതെ ഉപമയിലെ മറഞ്ഞിരിക്കുന്ന ഭാവം നിലനിർത്തി.
