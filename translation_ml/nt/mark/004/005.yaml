source:
  edition: SBLGNT
  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: ml
  text: വേറൊരു വിത്ത് പാറക്കെട്ടുള്ള നിലത്ത്[a] വീണു. അവിടെ വളരെ മണ്ണില്ലായിരുന്നു. മണ്ണിന് ആഴമില്ലാത്തതിനാൽ അത് ഉടനെ മുളച്ചുപൊങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കല്ലുനിറഞ്ഞ നിലത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത് പാറയ്ക്കുമുകളിൽ നേർത്ത മണ്ണുപാളി മാത്രമുള്ള ഭൂപ്രദേശമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: വേറെ ചില വിത്തുകൾ
  rationale: നപുംസക ഏകവചന വിശേഷണം ഇവിടെ മുൻസന്ദർഭത്തിലെ വിത്തിനെ സൂചിപ്പിച്ച് നാമമായി ഉപയോഗിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ കൂട്ടസൂചനയ്ക്കായി ‘വിത്തുകൾ’ വ്യക്തമാക്കുന്നു.
- source_word: πετρῶδες
  choice: പാറക്കെട്ടുള്ള നിലം
  rationale: ചിതറിക്കിടക്കുന്ന കല്ലുകൾ മാത്രമല്ല, പാറമേൽ നേർത്ത മണ്ണുപാളിയുള്ള ഭൂപ്രദേശമാണ് സൂചന; ‘പാറക്കെട്ടുള്ള നിലം’ ഈ കാർഷിക ചിത്രം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γῆν πολλήν
  choice: മണ്ണ് അധികം
  rationale: γῆ ഇവിടെ പൊതുവായ ദേശമല്ല, വളർച്ചയ്ക്കാവശ്യമായ മണ്ണാണ്. ‘മണ്ണ് അധികമില്ലായിരുന്നു’ അളവിന്റെ ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: സംഭവത്തിന്റെ തൽക്ഷണത ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐξανέτειλεν
  choice: മുളച്ചുപൊങ്ങി
  rationale: കാർഷികസന്ദർഭത്തിൽ വിത്ത് മുളച്ച് മുകളിലേക്കു വരുന്നതിനെ കൃത്യവും സജീവവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: മണ്ണിന് ആഴമില്ലാത്തതിനാൽ
  rationale: διάയോടുകൂടിയ articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ കാരണവാചകരൂപം അർത്ഥവും നേർത്ത മണ്ണുപാളിയുടെ ചിത്രവും സംരക്ഷിക്കുന്നു.
- source_word: ὅπου
  choice: അവിടെ
  rationale: സ്ഥലബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ സ്വതന്ത്രവാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
