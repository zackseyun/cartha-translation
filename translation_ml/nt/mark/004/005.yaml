  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; വിത്തിനെ സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമസംബന്ധം നിലനിർത്തി.
