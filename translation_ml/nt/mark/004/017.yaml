  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: ml
  text: അവർക്കു തങ്ങളിൽത്തന്നെ വേരില്ല; അവർ കുറച്ചുകാലം മാത്രമേ നിലനിൽക്കൂ. പിന്നെ, വചനം നിമിത്തം കഷ്ടതയോ പീഡനമോ ഉണ്ടാകുമ്പോൾ അവർ ഉടനെ വിട്ടുമാറുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇടറിപ്പോകുന്നു,” “ഇടർച്ചയിലാകുന്നു,” അല്ലെങ്കിൽ “നീരസംകൊള്ളുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരു തടസ്സത്തിൽ തട്ടി വീഴുക, ഇടർച്ചയിലാകുക, അല്ലെങ്കിൽ നീരസംകൊള്ളുക എന്ന അർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: വേര്
  rationale: വിത്തിന്റെയും മണ്ണിന്റെയും ഉപമയിലുള്ള കാർഷികരൂപകം അതേപടി നിലനിർത്തുന്നു; ‘ആഴമുള്ള’ എന്നോ ‘ഉറച്ച’ എന്നോ മൂലപാഠത്തിലില്ലാത്ത ആശയം ചേർക്കുന്നില്ല.
- source_word: ἐν ἑαυτοῖς
  choice: തങ്ങളിൽത്തന്നെ
  rationale: പ്രത്യാവർത്തകമായ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πρόσκαιροί
  choice: കുറച്ചുകാലം മാത്രമേ നിലനിൽക്കൂ
  rationale: ഒരു കാലത്തേക്ക് മാത്രം നിലനിൽക്കുന്നതെന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സ്വഭാവചാഞ്ചല്യം പോലുള്ള അധിക മനശ്ശാസ്ത്രപരമായ ആശയം ചേർക്കുന്നില്ല.
- source_word: εἶτα
  choice: പിന്നെ
  rationale: തുടർന്ന് സംഭവിക്കുന്ന വികാസത്തെ ലളിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: കഷ്ടതയോ പീഡനമോ ഉണ്ടാകുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിനെ കാലസൂചകമായി പരിഭാഷപ്പെടുത്തുന്നു; θλῖψις-ലെ സമ്മർദവും ദുരിതവും ‘കഷ്ടത’യിലൂടെയും διωγμός-ന്റെ പ്രത്യേക അർഥം ‘പീഡനം’ വഴിയും നൽകുന്നു.
- source_word: διὰ τὸν λόγον
  choice: വചനം നിമിത്തം
  rationale: ഉപമയിൽ ആവർത്തിക്കുന്ന λόγος എന്ന പദത്തിന്റെ ബന്ധം നിലനിർത്തുകയും കാരണം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: മർക്കോസിന്റെ വിവരണശൈലിയിലെ അടിയന്തരത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σκανδαλίζονται
  choice: വിട്ടുമാറുന്നു
  rationale: കഷ്ടതയുടെയും പീഡനത്തിന്റെയും സമ്മർദത്തിൽ ആദ്യം സ്വീകരിച്ച വചനത്തിൽനിന്ന് പിന്മാറുന്നതിന്റെ ഗൗരവം സാഹചര്യാനുസൃതമായി പ്രകടിപ്പിക്കുന്നു; ഗ്രീക്ക് പദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വത്തിൽനിന്നുള്ള പിന്മാറ്റത്തിന്റെ സാഹചര്യത്തിൽ σκανδαλίζονται എന്നതിന്റെ പരിഭാഷ
  choice: വിട്ടുമാറുന്നു
  alternative: ഇടറിപ്പോകുന്നു; ഇടർച്ചയ്ക്കു കാരണമാകുന്നു; നീരസംകൊള്ളുന്നു
  rationale: വചനം ആദ്യം സ്വീകരിച്ചവർ സമ്മർദം വന്നപ്പോൾ നിലനിൽക്കാത്തതിനെ സന്ദർഭം സൂചിപ്പിക്കുന്നു. ‘വിട്ടുമാറുന്നു’ എന്നത് ഈ ഗൗരവം നൽകുന്നു; എന്നാൽ അന്തിമരക്ഷയെക്കുറിച്ച് മൂലപാഠത്തേക്കാൾ ശക്തമായ ഒരു സിദ്ധാന്തനിഗമനം അടിച്ചേൽപ്പിക്കുന്നില്ല. പദത്തിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. കാർഷികരൂപകവും ‘വചനം’ എന്ന ആവർത്തിത പദബന്ധവും നിലനിർത്തിയപ്പോൾ അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കി.
