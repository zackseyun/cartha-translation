  terminology: Agricultural terms are contextually accurate. 'മണ്ണ്' suitably represents cultivated ground in this parable; 'കതിര്' consistently renders στάχυς; and 'നിറഞ്ഞ ധാന്യമണി' communicates the sense of full grain without unnecessarily specifying wheat. No theological terminology is at issue.
