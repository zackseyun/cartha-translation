  source_fidelity: 'The translation accurately preserves the Greek sequence and imagery: the soil produces the crop ''by itself'' (αὐτομάτη), followed by shoot (χόρτον), ear/head (στάχυν), and full grain within the ear (πλήρης σῖτον ἐν τῷ στάχυϊ). ''തനിയെ'' appropriately conveys unassisted growth without importing a mechanical sense.'
