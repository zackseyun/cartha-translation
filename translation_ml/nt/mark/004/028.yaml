id: MRK.4.28
reference: Mark 4:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: ml
  text: 'മണ്ണ് തനിയെ വിളവുണ്ടാക്കുന്നു: ആദ്യം പച്ചനാമ്പ്, പിന്നെ കതിര്, അതിനുശേഷം കതിരിനുള്ളിൽ നിറഞ്ഞ ധാന്യമണി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: തനിയെ
  rationale: മനുഷ്യന്റെ ദൃശ്യമായ ഇടപെടലില്ലാതെ മണ്ണ് വിളവുണ്ടാക്കുന്നു എന്ന ആശയം സ്വാഭാവികവും യന്ത്രസദൃശമല്ലാത്തതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἡ γῆ
  choice: മണ്ണ്
  rationale: കൃഷിസന്ദർഭത്തിൽ വിള വളരുന്ന നിലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഭൂമി’യെക്കാൾ സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാണ്.
- source_word: καρποφορεῖ
  choice: വിളവുണ്ടാക്കുന്നു
  rationale: ധാന്യവിളയുടെ സന്ദർഭത്തിൽ ഫലം അഥവാ വിള ഉൽപ്പാദിപ്പിക്കുക എന്ന ക്രിയയുടെ അർഥം വ്യക്തമാക്കുന്നു; ‘ഫലം കായ്ക്കുന്നു’ എന്ന പ്രയോഗത്തേക്കാൾ ധാന്യകൃഷിക്ക് യോജിക്കുന്നു.
- source_word: πρῶτον χόρτον
  choice: ആദ്യം പച്ചനാമ്പ്
  rationale: ധാന്യച്ചെടിയുടെ ആദ്യമായി ദൃശ്യമാകുന്ന ഇളം പച്ച വളർച്ചയെയാണ് χόρτος ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘തണ്ട്’ എന്നു പറഞ്ഞാൽ വളർച്ചയുടെ പിന്നീടുള്ള ഘട്ടമെന്ന തെറ്റിദ്ധാരണ വരാം.
- source_word: εἶτα στάχυν
  choice: പിന്നെ കതിര്
  rationale: στάχυς ധാന്യം രൂപപ്പെടുന്ന കതിരിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ കൃഷിഭാഷയിൽ സ്വാഭാവികവും കൃത്യവുമായ പദമാണ്.
- source_word: πλήρης σῖτον
  choice: നിറഞ്ഞ ധാന്യമണി
  rationale: πλήρης എന്ന ‘നിറഞ്ഞ/പൂർണമായ’ ആശയം സംരക്ഷിച്ചുകൊണ്ട് σῖτος എന്ന ധാന്യത്തെ ഒറ്റ ഇനമായി പരിമിതപ്പെടുത്താതെ അവതരിപ്പിക്കുന്നു.
- source_word: ἐν τῷ στάχυϊ
  choice: കതിരിനുള്ളിൽ
  rationale: ധാന്യമണി കതിരിൽ സ്ഥിതിചെയ്യുന്നു എന്ന ആശയം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കൃഷിഭാഷ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ വളർച്ചാക്രമവും മണ്ണ് ‘തനിയെ’ വിളവുണ്ടാക്കുന്നു എന്ന ഊന്നലും നിലനിർത്തി. ഈ പരിഭാഷയിൽ വിശദീകരണം ആവശ്യമുള്ള യഥാർത്ഥ പാഠഭേദമോ നിർണായകമായ ലെക്സിക്കൽ അസ്പഷ്ടതയോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
