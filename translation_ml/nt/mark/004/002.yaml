  text: καὶ ἐδίδασκεν αὐτοὺς ἐν παραβολαῖς πολλά καὶ ἔλεγεν αὐτοῖς ἐν τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/002.yaml
  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: ml
  text: 'അവൻ ഉപമകളിലൂടെ അവരെ പല കാര്യങ്ങളും[a] പഠിപ്പിച്ചുകൊണ്ടിരുന്നു; തന്റെ ഉപദേശത്തിൽ അവൻ അവരോടു ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ ഉപമകളിലൂടെ അവരെ വളരെയധികം പഠിപ്പിച്ചുകൊണ്ടിരുന്നു.’ ഗ്രീക്കിലെ πολλά എന്ന പദം ‘പല കാര്യങ്ങളും’ എന്നോ കൂടുതൽ സംക്ഷിപ്തമായി ‘വളരെയധികം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയയുടെ തുടർച്ചയായ പ്രവർത്തനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν παραβολαῖς
  choice: ഉപമകളിലൂടെ
  rationale: ἐν + ദത്തിവിന്റെ മാധ്യമം/രീതി എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: πολλά
  choice: പല കാര്യങ്ങളും
  rationale: നപുംസകലിംഗ ബഹുവചനത്തിന്റെ ആശയപരമായ വ്യാപ്തി വ്യക്തമായി നൽകുന്നു; ‘വളരെയധികം’ എന്ന സംക്ഷിപ്ത സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നത്
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളിലേക്കു നയിക്കുന്ന അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: തന്റെ ഉപദേശത്തിൽ
  rationale: ഗ്രീക്ക് ഘടനയും διδαχήയുടെ ‘ഉപദേശം/പഠിപ്പിക്കൽ’ എന്ന അർഥവും അടുത്തായി നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: അവൻ
  rationale: മുൻവാക്യത്തോടുള്ള ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിലൂടെ നിലനിൽക്കുന്നതിനാൽ തുടക്കത്തിലെ καί പ്രത്യേകം ‘എന്നിട്ട്’ എന്നു ചേർക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: αὐτοὺς / αὐτοῖς
  choice: അവരെ / അവരോടു
  rationale: ആദ്യത്തേതിന്റെ കർമസ്ഥാനവും രണ്ടാമത്തേതിന്റെ സംബോധനലക്ഷ്യവും മലയാള വ്യാകരണത്തിൽ വേർതിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവവും അടുത്ത വാക്യത്തിലേക്കു തുറക്കുന്ന അവസാനത്തെ ദ്വിബിന്ദുവും നിലനിർത്തിയിരിക്കുന്നു.
