source:
  edition: SBLGNT
  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: ml
  text: അത് ഒരു കടുകുമണിപോലെയാണ്[a]; അത് നിലത്ത് വിതയ്ക്കപ്പെടുമ്പോൾ, നിലത്തുള്ള എല്ലാ വിത്തുകളെക്കാളും ചെറുതാണ്—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു കടുകുവിത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: അത് ... സദൃശമാണ്
  rationale: മുൻവാക്യത്തിലെ ദൈവരാജ്യത്തെക്കുറിച്ചുള്ള ചോദ്യത്തെ ആശ്രയിക്കുന്ന അപൂർണ്ണമായ ഉപമാപ്രയോഗമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണ്ണവാക്യത്തിനായി ‘അത്’ ചേർത്തു.
- source_word: κόκκῳ σινάπεως
  choice: ഒരു കടുകുമണി
  rationale: κόκκος എന്നത് ധാന്യമണിയെയോ വിത്തിനെയോ സൂചിപ്പിക്കാം; കടുകിനെക്കുറിച്ച് ആധുനിക മലയാളത്തിൽ ‘കടുകുമണി’ സ്വാഭാവികവും ദൃശ്യബിംബം നിലനിർത്തുന്നതുമാണ്.
- source_word: ὃς
  choice: അത്
  rationale: മുൻപുള്ള കടുകുമണിയിലേക്കുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി തുടർക്കുന്നു.
- source_word: ὅταν σπαρῇ
  choice: വിതയ്ക്കപ്പെടുമ്പോൾ
  rationale: അനിശ്ചിതമായ പൊതുകാലസൂചനയുള്ള ὅταν + aorist subjunctive നെ സന്ദർഭോചിതമായ പൊതുസത്യമായി അവതരിപ്പിക്കുന്നു; passive ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: നിലത്ത്
  rationale: കാർഷികസന്ദർഭത്തിലെ γῆ ലോകമൊട്ടാകെയല്ല, മണ്ണോ നിലമോ ആണ്; ἐπίയുടെ ഉപരിതലഭാവം ‘നിലത്ത്’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μικρότερον ὂν
  choice: ചെറുതായിരിക്കുന്ന
  rationale: വ്യക്തമായ comparative അർഥവും participial ഘടനയും കഴിയുന്നത്ര നിലനിർത്തുന്നു; ‘ഏറ്റവും ചെറുത്’ എന്ന superlative ആക്കുന്നില്ല.
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: നിലത്തുള്ള എല്ലാ വിത്തുകളെക്കാളും
  rationale: comparative genitive നെ ‘-യെക്കാളും’ എന്ന മലയാള താരതമ്യഘടനയിൽ അവതരിപ്പിക്കുകയും ആവർത്തിക്കുന്ന സ്ഥലപരിധി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കടുകുമണിയുടെ വലിപ്പത്തെക്കുറിച്ചുള്ള comparative–superlative വ്യത്യാസം
  choice: ‘എല്ലാ വിത്തുകളെക്കാളും ചെറുത്’ എന്ന comparative രൂപം
  alternative: ‘എല്ലാ വിത്തുകളിലും ഏറ്റവും ചെറുത്’
  rationale: ഗ്രീക്കിലെ μικρότερον comparative ആണ്; explicit superlative അല്ല. അതിനാൽ ഉറവിടത്തിലെ രൂപവും ഉപമയിലെ ആരംഭത്തിലെ ചെറുപ്പത്തിന്റെ ഊന്നലും നിലനിർത്തി, സസ്യശാസ്ത്രപരമായ അധിക അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ participial തുടർച്ചയും അടുത്ത വാക്യത്തിലേക്കുള്ള em dash-ഉം നിലനിർത്തി. ‘കടുകുമണി’ സാധാരണ മലയാളപ്രയോഗം; ‘കടുകുവിത്ത്’ അടിക്കുറിപ്പിൽ പകരമായി നൽകി. English POB-യിലെ [b] കുറിപ്പ് ഇംഗ്ലീഷ് പരിഭാഷയിലെ comparative രൂപത്തെ വിശദീകരിക്കുന്നതായതിനാൽ മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തിച്ചില്ല; പ്രധാനവാചകം തന്നെ ‘-യെക്കാളും ചെറുത്’ എന്ന് വ്യക്തമായി comparative നിലനിർത്തുന്നു.
