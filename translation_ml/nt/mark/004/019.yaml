id: MRK.4.19
reference: Mark 4:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: ml
  text: ഈ യുഗത്തിന്റെ ഉത്കണ്ഠകളും[a] സമ്പത്തിന്റെ വഞ്ചനയും മറ്റു കാര്യങ്ങളോടുള്ള മോഹങ്ങളും കടന്നുവന്ന് വചനത്തെ ഞെരുക്കുന്നു; അങ്ങനെ അത് ഫലമില്ലാത്തതായിത്തീരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ലോകത്തിന്റെ ഉത്കണ്ഠകൾ.’ ‘യുഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്കുപദത്തിന് ‘യുഗം’ എന്നും, വിപുലമായ അർഥത്തിൽ ഇപ്പോഴത്തെ ലോകക്രമം എന്നും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അത് ഫലമില്ലാത്തതായിത്തീരുന്നു.’ ഇവിടെ ‘അത്’ എന്നത് ഏറ്റവും സ്വാഭാവികമായി ‘വചനത്തെ’ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഉപമയുടെ ദൃശ്യഭാവത്തിൽ കേൾക്കുന്നവനെയോ വിത്ത്/ചെടിയെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാനും കഴിയും.
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: ചിന്തകൾ
  rationale: ഭാരപ്പെടുത്തുന്ന കരുതലുകളെയോ ഉത്കണ്ഠകളെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികവും അതിരുകടന്ന മനശ്ശാസ്ത്രവൽക്കരണം ഒഴിവാക്കുന്നതുമായ പദമാണ് ‘ചിന്തകൾ’.
- source_word: αἰῶνος
  choice: യുഗം
  rationale: കാലപരവും ധാർമികവുമായ നിലവിലെ ക്രമത്തെ സൂചിപ്പിക്കുന്ന αἰών എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു.
- source_word: ἀπάτη τοῦ πλούτου
  choice: സമ്പത്തിന്റെ വഞ്ചന
  rationale: സമ്പത്ത് തെറ്റിദ്ധരിപ്പിക്കുന്ന സ്വഭാവം നേരിട്ട് പ്രകടമാക്കുകയും ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയുടെ അർഥവ്യാപ്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: മറ്റു കാര്യങ്ങളോടുള്ള മോഹങ്ങൾ
  rationale: വചനത്തിനുപുറമേയുള്ള മറ്റു കാര്യങ്ങളിലേക്കു തിരിയുന്ന ആഗ്രഹങ്ങളുടെ വിശാലമായ പരിധി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰσπορευόμεναι
  choice: ഉള്ളിൽ കടന്ന്
  rationale: ഈ സ്വാധീനങ്ങൾ വ്യക്തിയുടെ ഉള്ളിലേക്കു കടന്നുവരുന്ന സജീവ ദൃശ്യഭാവം സൂക്ഷിക്കുന്നു.
- source_word: συμπνίγουσιν
  choice: ഞെരുക്കിക്കളയുന്നു
  rationale: വിത്തിനെയോ ചെടിയെയോ മുള്ളുകൾ ഞെരുക്കുന്ന ഉപമാചിത്രം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: പ്രഘോഷിക്കപ്പെട്ട സന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ബൈബിൾപരമായ പ്രതിധ്വനി നിലനിർത്തുന്ന പരിചിതമായ മലയാളപദമാണ്.
- source_word: ἄκαρπος γίνεται
  choice: ഫലമില്ലാത്തതായിത്തീരുന്നു
  rationale: ഫലം ഉണ്ടാകാത്ത അവസ്ഥയിലേക്കുള്ള പരിണാമം ഗ്രീക്കിനോട് അടുത്തായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: അവസാനത്തെ ഏകവചന ക്രിയയുടെയും വിശേഷണത്തിന്റെയും സൂചിത കർത്താവ്
  choice: സമീപസ്ഥമായ ഏകവചനപദമായ ‘വചനം’ സൂചിത കർത്താവായി സ്വീകരിച്ച് ‘അത് ഫലമില്ലാത്തതായിത്തീരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: കേൾക്കുന്നവൻ ഫലമില്ലാത്തവനാകുന്നു; അല്ലെങ്കിൽ വിത്ത്/ചെടി ഫലമില്ലാത്തതാകുന്നു.
  rationale: വ്യാകരണപരമായി τὸν λόγον ആണ് ഏറ്റവും അടുത്ത വ്യക്തമായ ഏകവചന antecedent; എന്നാൽ ഉപമയിൽ വചനം വിത്തായി ചിത്രീകരിക്കപ്പെടുന്നതിനാൽ മറ്റു ധാരണകൾക്കും സാധ്യതയുണ്ട്. പ്രധാനപാഠം ഏറ്റവും നേരിട്ടുള്ള ബന്ധം സൂക്ഷിക്കുകയും അടിക്കുറിപ്പ് അവ്യക്തത അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള ബന്ധകങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികയായി നൽകി. ‘യുഗം,’ ‘വചനം,’ ‘ഫലം’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ കാലപരവും ഉപമാപരവും ബൈബിൾപരവുമായ പ്രതിധ്വനികൾ സൂക്ഷിക്കുന്നു.
