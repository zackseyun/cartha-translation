id: MRK.4.20
reference: Mark 4:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: ml
  text: 'നല്ല മണ്ണിൽ വിതയ്ക്കപ്പെട്ടവർ ഇവരാണ്: അവർ വചനം കേൾക്കുകയും അതിനെ സ്വീകരിക്കുകയും ഫലം കായ്ക്കുകയും ചെയ്യുന്നു—മുപ്പതുമടങ്ങും അറുപതുമടങ്ങും നൂറുമടങ്ങും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അതിനെ അംഗീകരിക്കുകയും” അല്ലെങ്കിൽ “അതിനെ സ്വാഗതം ചെയ്യുകയും” എന്നും പരിഭാഷപ്പെടുത്താം (παραδέχονται).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: ഇവരാണ്
  rationale: മുമ്പ് വിവരിച്ച വിഭാഗങ്ങളിൽ അവസാനത്തേതിനെ ചൂണ്ടിക്കാണിക്കുന്നു; മലയാളത്തിൽ സമീപസന്ദർഭത്തിലെ ഈ വിഭാഗത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘ഇവർ’ യോജിക്കുന്നു.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: നല്ല മണ്ണിൽ വിതയ്ക്കപ്പെട്ടവർ
  rationale: വിത്തിന്റെയും മണ്ണിന്റെയും ഉപമാചിത്രവും ഗ്രീക്കിലെ കർമണി പ്രയോഗവും നിലനിർത്തുന്നു. മലയാള കാർഷികപ്രയോഗത്തിൽ ‘മണ്ണിൽ വിതയ്ക്കുക’ സ്വാഭാവികമാണ്.
- source_word: γῆν τὴν καλὴν
  choice: നല്ല മണ്ണ്
  rationale: ഈ ഉപമയിൽ γῆ കൃഷിയോഗ്യമായ മണ്ണിനെയാണ് സൂചിപ്പിക്കുന്നത്; καλὴν മറ്റു മണ്ണുകളോടുള്ള ഗുണപരമായ വ്യത്യാസം പ്രകടമാക്കുന്നു.
- source_word: ἀκούουσιν τὸν λόγον
  choice: വചനം കേൾക്കുന്നു
  rationale: ‘വചനം’ മാർക്കോസ് 4-ലെ ആവർത്തിത പദബന്ധവും അതിന്റെ അന്തർപാഠ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: παραδέχονται
  choice: അതിനെ സ്വീകരിക്കുന്നു
  rationale: അനുകൂലമായി കൈക്കൊള്ളുക/അംഗീകരിക്കുക എന്ന അർഥവ്യാപ്തി നൽകുന്നു; ‘അതിനെ’ എന്നത് വചനത്തെ വ്യക്തമായി തിരിച്ചുചൂണ്ടുന്നു.
- source_word: καρποφοροῦσιν
  choice: ഫലം കായ്ക്കുന്നു
  rationale: കാർഷിക രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ആത്മീയ ഫലത്തിന്റെ സ്വഭാവം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: മുപ്പതുമടങ്ങും അറുപതുമടങ്ങും നൂറുമടങ്ങും
  rationale: വിളവിന്റെ വർധനവാണ് ഉദ്ദേശ്യമെന്ന് വ്യക്തമാക്കുന്നു; ആവർത്തിക്കുന്ന καὶ-യുടെ താളം ‘-ഉം’ ഉപയോഗിച്ച് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വചനത്തോടുള്ള നല്ല മണ്ണിന്റെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: വചനം യഥാർഥമായി സ്വീകരിക്കുന്നതും അതിൽനിന്ന് ഫലം ഉണ്ടാകുന്നതും മാത്രം പ്രസ്താവിക്കുന്നു.
  alternative: ഇത് അന്തിമസ്ഥിരത അനിവാര്യമാണെന്നോ കേവലം പ്രാരംഭ പ്രതികരണമാണെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം കേൾക്കുക, സ്വീകരിക്കുക, ഫലം കായ്ക്കുക എന്നീ കാര്യങ്ങൾ പറയുന്നു; സ്ഥിരതയെയോ വിശ്വാസത്യാഗത്തെയോ സംബന്ധിച്ച ഒരു പ്രത്യേക സിദ്ധാന്തം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ഉപമയിലെ കാർഷികഭാഷയും മൂലപാഠത്തിലെ ക്രിയാക്രമവും സംരക്ഷിച്ചിട്ടുണ്ട്.
