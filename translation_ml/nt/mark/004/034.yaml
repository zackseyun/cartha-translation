source:
  edition: SBLGNT
  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: ml
  text: ഒരു ഉപമ കൂടാതെ അവൻ അവരോടു സംസാരിക്കാറില്ലായിരുന്നു; എന്നാൽ സ്വകാര്യമായി സ്വന്തം ശിഷ്യന്മാർക്ക് അവൻ എല്ലാം വിശദീകരിക്കുമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എല്ലാം വ്യാഖ്യാനിക്കുമായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് ‘വിശദീകരിക്കുക,’ ‘വ്യാഖ്യാനിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς παραβολῆς
  choice: ഉപമ കൂടാതെ
  rationale: ‘കൂടാതെ’ എന്ന പ്രയോഗം χωρίς എന്നതിന്റെ ‘ഇല്ലാതെ/കൂടാതെ’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഏകവചനമായ παραβολῆς-ന്റെ മൂർത്തമായ രൂപവും നിലനിർത്തുന്നു.
- source_word: οὐκ ἐλάλει
  choice: സംസാരിക്കാറില്ലായിരുന്നു
  rationale: അപൂർണഭൂതകാലം ഇവിടെ പതിവായി നടന്നിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ആ ആവർത്തനസ്വഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατ’ ἰδίαν
  choice: തനിച്ചായിരിക്കുമ്പോൾ
  rationale: പൊതുജനങ്ങളോടുള്ള സംസാരത്തിന് വിപരീതമായി സ്വകാര്യമായ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: തന്റെ സ്വന്തം ശിഷ്യന്മാർക്ക്
  rationale: ἰδίοις നൽകുന്ന ‘സ്വന്തം’ എന്ന ഊന്നൽ ഒഴിവാക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐπέλυεν
  choice: വിശദീകരിച്ചുകൊടുക്കുമായിരുന്നു
  rationale: ക്രിയയുടെ ‘വിശദീകരിക്കുക/വ്യാഖ്യാനിക്കുക’ എന്ന അർഥവും അപൂർണഭൂതകാലത്തിലെ പതിവുസ്വഭാവവും എളുപ്പം മനസ്സിലാകുന്ന മലയാളത്തിൽ നൽകുന്നു.
- source_word: πάντα
  choice: എല്ലാം
  rationale: ഗ്രീക്ക് പദത്തിന്റെ സമഗ്രമായെങ്കിലും സന്ദർഭംകൊണ്ട് കൃത്യമായി പരിമിതപ്പെടുത്താത്ത വ്യാപ്തി അതേപടി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സ്വകാര്യ വിശദീകരണത്തിന്റെ വ്യാപ്തി
  choice: πάντα എന്നത് പരിമിതപ്പെടുത്താതെ ‘എല്ലാം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘എല്ലാ ഉപമകളും’ അല്ലെങ്കിൽ ‘താൻ പറഞ്ഞതെല്ലാം’
  rationale: സന്ദർഭം ഉപമകളെയോ ഉപദേശത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്ക് മൂലപാഠം ‘എല്ലാം’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ പരിഭാഷയിൽ വ്യാപ്തി ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. രണ്ടു അപൂർണഭൂതകാല ക്രിയകളുടെയും പതിവുസ്വഭാവം ‘-ആറില്ലായിരുന്നു’, ‘-കൊടുക്കുമായിരുന്നു’ എന്നീ രൂപങ്ങളിലൂടെ പ്രകടമാക്കി; ‘തന്റെ സ്വന്തം’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
