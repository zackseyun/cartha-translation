revisions:
- from: ഉപമ കൂടാതെ അവൻ അവരോടു സംസാരിക്കാറില്ലായിരുന്നു; എന്നാൽ തനിച്ചായിരിക്കുമ്പോൾ തന്റെ സ്വന്തം ശിഷ്യന്മാർക്ക് എല്ലാം വിശദീകരിച്ചുകൊടുക്കുമായിരുന്നു.[a]
  to: ഒരു ഉപമ കൂടാതെ അവൻ അവരോടു സംസാരിക്കാറില്ലായിരുന്നു; എന്നാൽ സ്വകാര്യമായി സ്വന്തം ശിഷ്യന്മാർക്ക് അവൻ എല്ലാം വിശദീകരിക്കുമായിരുന്നു.[a]
  rationale: The revision removes the possible implication that Jesus was physically alone, uses a more idiomatic expression for private instruction, and preserves the Greek emphasis on his own disciples and the unrestricted scope of ‘everything.’
