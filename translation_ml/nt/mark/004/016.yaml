source:
  edition: SBLGNT
  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: ml
  text: 'അതുപോലെ, പാറനിറഞ്ഞ നിലത്ത്[a] വിതയ്ക്കപ്പെട്ടവർ ഇവരാണ്: അവർ വചനം കേൾക്കുമ്പോൾ ഉടൻതന്നെ സന്തോഷത്തോടെ അതു സ്വീകരിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പാറനിലത്ത്’ അല്ലെങ്കിൽ ‘പാറക്കെട്ടുകളുള്ള സ്ഥലങ്ങളിൽ.’
    reason: ἐπὶ τὰ πετρώδη എന്ന പദസമുച്ചയത്തിന്റെ സ്ഥലം/നിലം സംബന്ധിച്ച സാധുവായ ലെക്സിക്കൽ വ്യത്യാസങ്ങൾ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: ὁμοίως
  choice: അതുപോലെ
  rationale: മുമ്പത്തെ വിശദീകരണവുമായി ഈ കൂട്ടത്തെ ഉപമാപരമായി ബന്ധിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന്റെ പ്രഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὰ πετρώδη
  choice: പാറനിലത്ത്
  rationale: പാറയുള്ള അടിത്തറയാൽ സവിശേഷമായ നിലത്തെ സൂചിപ്പിക്കുന്ന കൃഷിചിത്രം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: σπειρόμενοι
  choice: വിതയ്ക്കപ്പെട്ടവർ
  rationale: വർത്തമാനകാല കർമണി ഭാഗധാതുവിനെ ഉപമയുടെ വിശദീകരണത്തിൽ ആളുകളെ സൂചിപ്പിക്കുന്ന വിശേഷണപ്രയോഗമായി നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കുന്നു.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: മർക്കോസിലെ ആവർത്തിതമായ λόγος എന്ന പദപ്രയോഗവും അതിന്റെ തിരുവെഴുത്തുസംബന്ധിയായ ധ്വനിയും നിലനിർത്തുന്നു; ഇവിടെ പ്രസംഗിക്കപ്പെട്ട സന്ദേശമാണ് ഉദ്ദേശ്യം.
- source_word: εὐθύς
  choice: ഉടൻതന്നെ
  rationale: εὐθύς എന്ന പദത്തിന്റെ തൽക്ഷണതയും മർക്കോസിന്റെ ഊന്നലും വ്യക്തമായി നൽകുന്നു.
- source_word: μετὰ χαρᾶς
  choice: സന്തോഷത്തോടെ
  rationale: സ്വീകരിക്കുന്ന രീതിയെ സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λαμβάνουσιν αὐτόν
  choice: അതു സ്വീകരിക്കുന്നു
  rationale: കേട്ട വചനത്തെ ഏറ്റുവാങ്ങുന്നു എന്ന അർഥം നൽകുകയും സ്ഥിരമായ വിശ്വാസമോ അന്തിമ അംഗീകാരമോ അനാവശ്യമായി സൂചിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉപമയുടെ വിശദീകരണത്തിലെ ‘വിതയ്ക്കപ്പെട്ടവർ’ എന്നതിന്റെ സൂചന
  choice: ‘പാറനിലത്ത് വിതയ്ക്കപ്പെട്ടവർ’ എന്ന ഉപമാഭാഷ അതേപടി നിലനിർത്തി.
  alternative: ‘ഹൃദയം പാറനിലംപോലെയുള്ളവർ’ എന്നു വ്യാഖ്യാനിച്ച് പറയുക.
  rationale: ഗ്രീക്ക് പാഠം വിതയ്ക്കൽചിത്രം നിലനിർത്തിക്കൊണ്ടുതന്നെ പ്രതിനിധീകരിക്കപ്പെടുന്ന ആളുകളെ തിരിച്ചറിയുന്നു. ഹൃദയത്തെക്കുറിച്ചുള്ള ഭാഷ ചേർക്കുന്നത് മൂലപാഠത്തിലില്ലാത്ത വ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കൃഷിചിത്രവും മൂലപാഠത്തിലെ ഉപമാത്മകമായ അസ്വാഭാവികതയുടെ ആവശ്യമായ അംശവും നിലനിർത്തിയിരിക്കുന്നു.
