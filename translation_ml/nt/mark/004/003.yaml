  text: Ἀκούετε. ἰδοὺ ἐξῆλθεν ὁ ⸀σπείρων σπεῖραι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/003.yaml
  text: Listen! Behold[a], the sower went out to sow.
translation:
  language: ml
  text: കേൾക്കൂ! ഇതാ, വിതയ്ക്കുന്നവൻ വിതയ്ക്കാൻ പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούετε
  choice: കേൾക്കൂ!
  rationale: വർത്തമാനകാല സജീവ ആജ്ഞാരൂപമായ ഈ ബഹുവചന ശ്രദ്ധാകൽപ്പനയുടെ നേരിട്ടുള്ള ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἰδού
  choice: ഇതാ,
  rationale: തുടർന്നുവരുന്ന കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരകണത്തിന്റെ അടയാളപ്പെടുത്തിയ കഥനശക്തി ‘ഇതാ’ സ്വാഭാവികമായും മാന്യമായും പകരുന്നു.
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: പുറത്തേക്കുള്ള നീക്കവും ഒരു പ്രവൃത്തിക്കായി യാത്ര തിരിക്കുന്ന സന്ദർഭാർഥവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁ σπείρων
  choice: വിതയ്ക്കുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃതന്തം വ്യക്തിയെ പ്രവർത്തനത്തിന്റെ അടിസ്ഥാനത്തിൽ സൂചിപ്പിക്കുന്നു; ‘വിതയ്ക്കുന്നവൻ’ ഗ്രീക്കിന്റെ രൂപവും അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: σπεῖραι
  choice: വിതയ്ക്കാൻ
  rationale: ἐξῆλθεν എന്ന ക്രിയയ്ക്കു പിന്നാലെയുള്ള ഉദ്ദേശ്യസൂചക അനന്തക്രിയയുടെ അർഥം മലയാളത്തിലെ ഉദ്ദേശ്യരൂപം നേരിട്ട് പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. തുടക്കത്തിലെ രണ്ട് ശ്രദ്ധാകൽപ്പനകളുടെ ഊന്നൽ നിലനിർത്താൻ ‘കേൾക്കൂ! ഇതാ’ എന്നു നൽകിയിരിക്കുന്നു; കൃഷിസന്ദർഭത്തിലെ ആവർത്തനം മൂലപാഠത്തിന് അനുസൃതമായി സംരക്ഷിച്ചു.
