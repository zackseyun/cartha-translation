id: MRK.4.38
reference: Mark 4:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: ml
  text: 'അവനോ വള്ളത്തിന്റെ അമരത്ത് തലയണയിൽ[a] ഉറങ്ങുകയായിരുന്നു; അവർ അവനെ ഉണർത്തി അവനോടു പറഞ്ഞു: “ഗുരുവേ, ഞങ്ങൾ നശിച്ചുപോകുന്നതിൽ അങ്ങേക്കു കരുതലില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തലയണപോലുള്ള കുഷനിൽ.” ഗ്രീക്ക് പദം തല ചായ്ക്കുന്ന തലയണയെയോ കുഷനെയോ സൂചിപ്പിക്കാം.
    reason: προσκεφάλαιον എന്ന പദത്തിന്റെ ‘pillow/head-cushion’ എന്ന സ്വാഭാവികമായ lexical range നിലനിർത്താൻ.
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: അവൻതന്നെ ... ആയിരുന്നു
  rationale: പ്രകടമായ αὐτός നൽകുന്ന ഊന്നലും മറ്റുള്ളവരുമായുള്ള വൈരുധ്യവും ‘അവൻതന്നെ’ നിലനിർത്തുന്നു.
- source_word: ἐν τῇ πρύμνῃ
  choice: വള്ളത്തിന്റെ അമരത്ത്
  rationale: πρύμνα വള്ളത്തിന്റെ പിൻഭാഗമായ stern-നെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ‘അമരം’ മലയാളത്തിലെ സ്വാഭാവികമായ നാവികപദമാണ്.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: തലയണമേൽ
  rationale: προσκεφάλαιον തല ചായ്ക്കാനുള്ള cushion/pillow ആണ്. ‘തലയണ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മൂലപദത്തിന്റെ ഉദ്ദേശ്യത്തോട് ചേർന്നതുമാണ്.
- source_word: καθεύδων
  choice: ഉറങ്ങുകയായിരുന്നു
  rationale: വിവരണസമയത്ത് തുടരുന്ന ഉറക്കാവസ്ഥയെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐγείρουσιν
  choice: ഉണർത്തി
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനശൈലിക്കനുസരിച്ച് ഭൂതകാലത്തിൽ നൽകുന്നു.
- source_word: λέγουσιν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനത്തെ മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനഭൂതകാലത്തിൽ വിവർത്തനം ചെയ്യുന്നു.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: διδάσκαλος എന്നതിന്റെ അധ്യാപകാർഥം സ്വാഭാവികവും ആദരസൂചകവുമായ മലയാള സംബോധനയിൽ നൽകുന്നു; ‘കർത്താവേ’ പോലുള്ള അധിക ദൈവശാസ്ത്രഭാവം ചേർക്കുന്നില്ല.
- source_word: οὐ μέλει σοι
  choice: അങ്ങേക്കു കരുതലില്ലേ
  rationale: ചോദ്യത്തിലെ കുറ്റപ്പെടുത്തലും ഉത്കണ്ഠയും നേരിട്ട് നിലനിർത്തുന്നു; σοι-യുടെ ഏകവചന ആദരസൂചക രൂപമായി ‘അങ്ങേക്ക്’ ഉപയോഗിക്കുന്നു.
- source_word: ὅτι ἀπολλύμεθα
  choice: ഞങ്ങൾ നശിച്ചുപോകുന്നതിൽ
  rationale: സംഭവിച്ചുകൊണ്ടിരിക്കുന്നതും ആസന്നവുമായ വിനാശത്തിന്റെ അടിയന്തരത നിലനിർത്തുന്നു; വെറും ‘മരിക്കാൻ പോകുന്നു’ എന്നു ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ ചോദ്യത്തിന്റെ ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ മൂർച്ച
  choice: “ഞങ്ങൾ നശിച്ചുപോകുന്നതിൽ അങ്ങേക്കു കരുതലില്ലേ?” എന്ന കുറ്റപ്പെടുത്തൽ കലർന്ന മൂർച്ചയുള്ള ചോദ്യം
  alternative: “ഞങ്ങൾ മരിക്കാൻ പോകുന്നത് അങ്ങേക്ക് വിഷയമല്ലേ?” എന്ന മൃദുവായ ചോദ്യം
  rationale: οὐ μέλει σοι എന്ന പ്രയോഗം വെറും വിവരാന്വേഷണമല്ല, അടിയന്തരവും കുറ്റപ്പെടുത്തൽ കലർന്നതുമായ ചോദ്യമാണ്. യേശുവിന്റെ മനോഭാവത്തെയോ ശിഷ്യരുടെ വിശ്വാസത്തെയോ വിശദീകരിച്ച് സംഘർഷം തീർക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘വള്ളം’, ‘അമരം’, ‘തലയണ’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങളാണ്. ഉറവിടത്തിൽ യഥാർത്ഥത്തിൽ ആവശ്യമായ വിവക്ഷാഭേദം പ്രധാനവാചകത്തിലെ ‘തലയണ’ കൊണ്ട് തന്നെ വ്യക്തമായതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
