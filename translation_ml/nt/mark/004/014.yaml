  text: The sower sows the word[a].
translation:
  language: ml
  text: വിതയ്ക്കുന്നവൻ വചനം[a] വിതയ്ക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സന്ദേശം.’ ഗ്രീക്കിലെ λόγος എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘വചനം’ എന്നോ ‘സന്ദേശം’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: വിതയ്ക്കുന്നവൻ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം വിതയ്ക്കുന്ന പ്രവൃത്തിയാൽ വിശേഷിപ്പിക്കപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘വിതയ്ക്കുന്നവൻ’ ഉപമയിലെ ദൃശ്യബിംബം നിലനിർത്തുകയും ‘കർഷകൻ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: λόγος എന്നതിന് ‘വചനം’, ‘സന്ദേശം’ തുടങ്ങിയ അർഥങ്ങൾ വരാം. ഇവിടെ ‘വചനം’ എന്നു നൽകുന്നത് മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; ദൈവവചനം എന്നോ സുവിശേഷം എന്നോ പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: σπείρει
  choice: വിതയ്ക്കുന്നു
  rationale: വർത്തമാനകാല നിർദേശക്രിയ ഇവിടെ ഉപമയുടെ പൊതുവായ പ്രവർത്തനം പ്രസ്താവിക്കുന്നു. ‘വിതയ്ക്കുന്നവൻ ... വിതയ്ക്കുന്നു’ എന്ന ആവർത്തനം σπείρω എന്ന ഒരേ ധാതുവിന്റെ ഗ്രീക്ക് പദപ്രയോഗം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉപമാവ്യാഖ്യാനത്തിലെ ‘വചനം’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാന പാഠത്തിൽ ‘വചനം’ എന്നു മാത്രം നൽകി.
  alternative: സന്ദേശം; ദൈവവചനം; സുവിശേഷം
  rationale: ഗ്രീക്ക് പാഠത്തിൽ τὸν λόγον എന്നു മാത്രമേയുള്ളൂ. സന്ദർഭം ദൈവിക സന്ദേശത്തിന്റെ പ്രഘോഷണത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ‘ദൈവവചനം’ എന്നോ ‘സുവിശേഷം’ എന്നോ വിപുലീകരിക്കുന്നത് ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത വ്യാഖ്യാനം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഉപമയിലെ വിതയ്ക്കൽബിംബവും മൂലപാഠത്തിലെ ധാതുപദാവർത്തനവും സ്വാഭാവികമായി നിലനിർത്തി.
