id: MRK.4.13
reference: Mark 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറയുന്നു: “ഈ ഉപമ നിങ്ങൾക്കു മനസ്സിലാകുന്നില്ലേ? പിന്നെ എങ്ങനെ എല്ലാ ഉപമകളും നിങ്ങൾ മനസ്സിലാക്കും?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഈ ഉപമ നിങ്ങൾ അറിയുന്നില്ലേ? എല്ലാ ഉപമകളും നിങ്ങൾ എങ്ങനെ അറിയും?” ഗ്രീക്കിൽ ഇവിടെ രണ്ട് വ്യത്യസ്ത ക്രിയകളാണുള്ളത്; രണ്ടിനും ഈ സന്ദർഭത്തിൽ ‘മനസ്സിലാക്കുക’ എന്ന അർഥഭാവമുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മർക്കോസിന്റെ സവിശേഷമായ ചരിത്രവർത്തമാനകാലവും അതിലൂടെ ലഭിക്കുന്ന ആഖ്യാനസജീവതയും നിലനിർത്തുന്നു.
- source_word: οἴδατε
  choice: മനസ്സിലാകുന്നില്ലേ
  rationale: οἶδα എന്നതിന് അടിസ്ഥാനമായി ‘അറിയുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ ഉപമയുടെ അർഥഗ്രഹണമാണ് സന്ദർഭം; സ്വാഭാവിക മലയാളത്തിൽ ‘മനസ്സിലാകുക’ അത് കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παραβολὴν
  choice: ഉപമ
  rationale: യേശുവിന്റെ ഈ പഠിപ്പിക്കൽരീതിയെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിലും പൊതുവ്യവഹാരത്തിലും സ്ഥാപിതമായ പദം.
- source_word: ταύτην
  choice: ഈ
  rationale: തൊട്ടുമുമ്പ് പറഞ്ഞ ഉപമയിലേക്കുള്ള നിർദേശകസർവനാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: καὶ πῶς
  choice: പിന്നെ എങ്ങനെ
  rationale: രണ്ടാമത്തെ ചോദ്യം ആദ്യത്തേതിൽനിന്നുള്ള നിഗമനമാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ καίയുടെ വെറും സംയോജനാർഥത്തെക്കാൾ ഇവിടെ ഉള്ള താർക്കിക പ്രഭാവം പ്രകടമാക്കുന്നു.
- source_word: πάσας τὰς παραβολὰς
  choice: എല്ലാ ഉപമകളും
  rationale: ബഹുവചനത്തോടുകൂടിയ πᾶς യേശുവിന്റെ ഉപമാപരമായ പഠിപ്പിക്കലുകളെ സമഗ്രമായി സൂചിപ്പിക്കുന്നു.
- source_word: γνώσεσθε
  choice: മനസ്സിലാക്കും
  rationale: γινώσκωയുടെ ഭാവികാലരൂപം ഇവിടെ ഉപമകളുടെ അർഥം ഗ്രഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആദ്യചോദ്യത്തിലെ οἴδατεയോടുള്ള വാഗ്‌രൂപപരമായ സമാന്തരതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: οἴδατεയും γνώσεσθεയും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടും സന്ദർഭാനുസൃതമായി ‘മനസ്സിലാകുക/മനസ്സിലാക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ആദ്യത്തേത് ‘അറിയുക’ എന്നും രണ്ടാമത്തേത് ‘മനസ്സിലാക്കുക’ എന്നും, അല്ലെങ്കിൽ രണ്ടും ‘അറിയുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
  rationale: ഇവിടെ വിഷയം ഉപമകളെക്കുറിച്ചുള്ള വെറും അറിവല്ല, അവയുടെ അർഥഗ്രഹണമാണ്. ഒരേ മലയാള അർഥമേഖല ഉപയോഗിക്കുന്നത് ചോദ്യങ്ങളുടെ വാഗ്‌രൂപപരമായ ശക്തി നിലനിർത്തുന്നു; ഗ്രീക്കിൽ രണ്ട് വ്യത്യസ്ത ക്രിയകളുണ്ടെന്ന വിവരം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചരിത്രവർത്തമാനകാലം നിലനിർത്തിയിട്ടുണ്ട്. ‘പിന്നെ എങ്ങനെ’ എന്ന പ്രയോഗം ചോദ്യങ്ങൾക്കിടയിലെ നിഗമനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
