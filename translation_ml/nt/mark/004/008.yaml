translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം നിലനിർത്തുകയും, വളർച്ചയുടെ ഘട്ടങ്ങളായ മുളച്ചുയരൽ, പെരുകൽ, ഫലധാരണം എന്നിവ വേർതിരിച്ചുകാണിക്കുകയും ചെയ്തു.
