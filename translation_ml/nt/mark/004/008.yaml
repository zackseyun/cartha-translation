source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλα ἔπεσεν εἰς τὴν γῆν τὴν καλήν, καὶ ἐδίδου καρπὸν ἀναβαίνοντα καὶ ⸀αὐξανόμενα, καὶ ἔφερεν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: ml
  text: മറ്റു വിത്തുകൾ നല്ല മണ്ണിൽ വീണു[a]. അവ ഫലം ഉത്പാദിപ്പിച്ചുകൊണ്ടിരുന്നു; വളർന്നുയരുകയും പെരുകുകയും ചെയ്ത്, മുപ്പതിരട്ടിയും അറുപതിരട്ടിയും നൂറിരട്ടിയും വിളവ് നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, സന്ദർഭത്തിൽനിന്ന് ‘വിത്തുകൾ’ എന്നു മനസ്സിലാക്കി, ‘മറ്റുള്ളവ നല്ല മണ്ണിൽ വീണു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: മറ്റു വിത്തുകൾ
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണം ഇവിടെ നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു; ഉപമയുടെ സന്ദർഭത്തിൽ മുമ്പു പറഞ്ഞ വിത്തുകളെയാണ് സൂചിപ്പിക്കുന്നത്. സ്വാഭാവികതയ്ക്കും വ്യക്തതയ്ക്കുമായി ‘വിത്തുകൾ’ ചേർത്തു.
- source_word: γῆν τὴν καλήν
  choice: നല്ല മണ്ണിൽ
  rationale: വിതയ്ക്കലിന്റെ കാർഷികസന്ദർഭത്തിൽ γῆ ഭൂവിഭാഗത്തെയല്ല, വിത്തു വളരുന്ന മണ്ണിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐδίδου καρπὸν
  choice: ഫലം തന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയയുടെ തുടർച്ചയായ പ്രവർത്തനഭാവം ‘തന്നുകൊണ്ടിരുന്നു’ നിലനിർത്തുന്നു.
- source_word: ἀναβαίνοντα
  choice: മുളച്ചുവളർന്ന്
  rationale: കാർഷികസന്ദർഭത്തിൽ ചെടി മണ്ണിൽനിന്ന് ഉയർന്നുവരുന്നതും വളരുന്നതുമാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ ‘മുളച്ചുവളർന്ന്’ സ്വാഭാവികമായി ഈ ദൃശ്യം നൽകുന്നു.
- source_word: αὐξανόμενα
  choice: പെരുകി
  rationale: ἀναβαίνοντα എന്ന മുകളിലേക്കുള്ള വളർച്ചയിൽനിന്ന് വേറിട്ട, തുടർന്നുള്ള വർധനയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: ἔφερεν
  choice: ഫലം തന്നുകൊണ്ടിരുന്നു
  rationale: ഫലം വഹിക്കുക/വിളവ് നൽകുക എന്ന തുടർച്ചയായ ഉൽപ്പാദനഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ἐδίδου καρπὸν എന്നതോടൊപ്പം മലയാളവാക്യത്തിൽ ഏകീകൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: ചിലത് മുപ്പതിരട്ടിയും ചിലത് അറുപതിരട്ടിയും ചിലത് നൂറിരട്ടിയും
  rationale: ഇത് വിളവിന്റെ ഗുണിതാനുപാതങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ആവർത്തിക്കുന്ന ἓν ഓരോ വിഭാഗത്തെയും വേർതിരിക്കുന്നതിനാൽ ‘ചിലത്’ എന്ന ആവർത്തനം അർത്ഥം വ്യക്തമായി നൽകുന്നു.
