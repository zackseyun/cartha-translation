id: MRK.4.11
reference: Mark 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “ദൈവരാജ്യത്തിന്റെ രഹസ്യം നിങ്ങൾക്കു നൽകപ്പെട്ടിരിക്കുന്നു; എന്നാൽ പുറത്തുള്ളവർക്കു എല്ലാം ഉപമകളായിട്ടാണ് വരുന്നത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: രഹസ്യം
  rationale: വെളിപ്പെടുത്തപ്പെടാതെ മനുഷ്യബുദ്ധിക്ക് ഗ്രഹിക്കാനാകാത്ത ദൈവിക സത്യത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും ദൈവശാസ്ത്രപരമായി തുറന്നതുമായ പദം.
- source_word: τοῖς ἔξω
  choice: പുറത്തുള്ളവർക്ക്
  rationale: ശിഷ്യവൃത്തത്തിന് പുറത്തുള്ളവരെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ സ്ഥലരൂപകവും വിഭാഗവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἐν παραβολαῖς
  choice: ഉപമകളിലൂടെയാണ്
  rationale: ἐν എന്നതിന്റെ മാധ്യമപരമായ ഭാവവും παραβολαί എന്ന യേശുവിന്റെ ഉപമാപരമായ പഠിപ്പിക്കലിന്റെ സ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γίνεται
  choice: സംഭവിക്കുന്നത്
  rationale: ‘ആകുന്നു’ എന്ന നിശ്ചലരൂപത്തേക്കാൾ മൂലത്തിലെ γίνομαι എന്ന സംഭവാത്മക ചലനം സംരക്ഷിക്കുന്നു; വ്യാഖ്യാനിച്ച് ‘പറയപ്പെടുന്നു’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: δέδοται
  choice: നൽകപ്പെട്ടിരിക്കുന്നു
  rationale: ദാനത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴുള്ള ഫലവും സൂചിപ്പിക്കുന്ന perfect passive രൂപം നിലനിർത്തുന്നു; ദാതാവിനെ മൂലപാഠംപോലെ വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവരാജ്യത്തിന്റെ രഹസ്യം ആർക്കാണ് നൽകപ്പെട്ടത് എന്നതിലെ ദൈവിക കർമ്മവാചകം
  choice: “നിങ്ങൾക്കു നൽകപ്പെട്ടിരിക്കുന്നു” എന്ന കർമ്മവാചകം നിലനിർത്തി
  alternative: “ദൈവം നിങ്ങൾക്കു നൽകിയിരിക്കുന്നു”
  rationale: മൂലപാഠം ദാതാവിനെ പരാമർശിക്കാതെ ദൈവിക കർമ്മവാചകം ഉപയോഗിക്കുന്നു; ദൈവമാണ് ദാതാവ് എന്ന സൂചനയുണ്ടെങ്കിലും അത് വിവർത്തനത്തിൽ തുറന്നുപറഞ്ഞിട്ടില്ല.
- issue: പുറത്തുള്ളവർക്ക് എല്ലാം ഉപമകളിൽ ‘സംഭവിക്കുന്നു’ എന്ന ദുഷ്കരമായ പ്രയോഗം
  choice: “എല്ലാം ഉപമകളിലൂടെയാണ് സംഭവിക്കുന്നത്”
  alternative: “എല്ലാം ഉപമകളായി പറയപ്പെടുന്നു”
  rationale: മൂലപാഠത്തിലെ γίνεται എന്ന വിശാലവും ദൈവശാസ്ത്രപരമായി സംഘർഷമുള്ളതുമായ പ്രയോഗം വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. “പറഞ്ഞുകൊണ്ടിരുന്നു” എന്നത് ἔλεγεν എന്ന അപൂർണ്ണകാലത്തിന്റെ തുടർച്ചാഭാവം നൽകുന്നു. പദക്രമം സ്വാഭാവിക മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തിയെങ്കിലും ‘നിങ്ങൾ’ എന്നും ‘പുറത്തുള്ളവർ’ എന്നും ഉള്ള വൈരുധ്യം വ്യക്തമായി സൂക്ഷിച്ചിട്ടുണ്ട്.
