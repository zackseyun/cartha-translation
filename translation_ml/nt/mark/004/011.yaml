- from: 'അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “ദൈവരാജ്യത്തിന്റെ രഹസ്യം നിങ്ങൾക്കു നൽകപ്പെട്ടിരിക്കുന്നു; എന്നാൽ പുറത്തുള്ളവർക്ക് എല്ലാം ഉപമകളിലൂടെയാണ് സംഭവിക്കുന്നത്.”'
  to: 'അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “ദൈവരാജ്യത്തിന്റെ രഹസ്യം നിങ്ങൾക്കു നൽകപ്പെട്ടിരിക്കുന്നു; എന്നാൽ പുറത്തുള്ളവർക്കു എല്ലാം ഉപമകളായിട്ടാണ് വരുന്നത്.”'
  rationale: The revision changes only the final expression. ‘ഉപമകളായിട്ടാണ് വരുന്നത്’ gives a natural Malayalam counterpart to the English audit trail’s ‘everything comes in parables,’ preserves the contrast with the disciples, and avoids turning the Greek into an overly explicit instrumental or narrowly speech-related statement.
