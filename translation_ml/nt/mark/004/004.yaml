  text: καὶ ἐγένετο ἐν τῷ σπείρειν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ἦλθεν τὰ πετεινὰ καὶ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: ml
  text: അവൻ വിതച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ചില വിത്തുകൾ വഴിയരികിൽ[a] വീണു. പക്ഷികൾ വന്ന് അവ തിന്നുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാതയോടുചേർന്ന്.” ഗ്രീക്ക് പ്രയോഗം വഴിയുടെയോ പാതയുടെയോ വശത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: അവൻ വിതച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐγένετο ἐν + articular infinitive എന്ന ആഖ്യാനപ്രയോഗത്തിന്റെ സമയബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘സംഭവിച്ചു’ എന്ന കൃത്രിമമായ പദാനുപദ വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ὃ μὲν
  choice: ചില വിത്തുകൾ
  rationale: വിതയ്ക്കപ്പെട്ട വിത്തിന്റെ ഒരു ഭാഗത്തെ വിഭജകമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: ἔπεσεν
  choice: വീണു
  rationale: πίπτω എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: παρὰ τὴν ὁδόν
  choice: വഴിയരികിൽ
  rationale: παρά + accusative ഇവിടെ വഴിയുടെ സമീപമോ വശമോ സൂചിപ്പിക്കുന്നു; കൃഷിയിടത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘വഴിയരികിൽ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: τὰ πετεινὰ
  choice: പക്ഷികൾ
  rationale: മൂലപാഠത്തിൽ ആകാശത്തെക്കുറിച്ചുള്ള അധിക വിശേഷണം ഇല്ലാത്തതിനാൽ ലളിതമായി ‘പക്ഷികൾ’ എന്നു നൽകുന്നു.
- source_word: κατέφαγεν
  choice: തിന്നുകളഞ്ഞു
  rationale: κατεσθίω എന്ന ക്രിയയിലെ പൂർണമായി തിന്നുതീർക്കുന്ന തീവ്രത സാധാരണ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτό
  choice: അവ
  rationale: ഗ്രീക്കിൽ വിത്തിന്റെ അംശത്തെ ഏകവചനസമാഹാരമായി പരാമർശിക്കുന്നുവെങ്കിലും, മലയാളത്തിലെ ‘ചില വിത്തുകൾ’ എന്ന സ്വാഭാവിക പ്രയോഗത്തോട് സംഖ്യാനുരൂപമായി ‘അവ’ ഉപയോഗിക്കുന്നു.
