  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: ml
  text: 'അവർ അത്യന്തം ഭയപ്പെട്ടു[a]. അവർ പരസ്പരം പറഞ്ഞു: “അപ്പോൾ ഇവൻ ആരാണ്—കാറ്റും കടലുംപോലും ഇവനെ അനുസരിക്കുന്നുവല്ലോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “അവർ വലിയൊരു ഭയം ഭയപ്പെട്ടു.” ഗ്രീക്കിൽ തീവ്രത ഊന്നിപ്പറയുന്ന ആവർത്തനപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: അവർ അത്യന്തം ഭയപ്പെട്ടു
  rationale: ക്രിയയോടൊപ്പം അതേ ധാതുവിൽനിന്നുള്ള നാമം ചേർത്ത ഗ്രീക്ക് പ്രയോഗം ഭയത്തിന്റെ തീവ്രത ഊന്നിപ്പറയുന്നു. അക്ഷരാർഥത്തിലുള്ള ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ ‘അത്യന്തം ഭയപ്പെട്ടു’ എന്നു നൽകി; രൂപസവിശേഷത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ἔλεγον
  choice: പറഞ്ഞു
  rationale: അപൂർണ്ണഭൂതകാലരൂപത്തിന് തുടരെയോ ആവർത്തിച്ചോ പറയുക എന്ന സൂചന ഉണ്ടാകാമെങ്കിലും, ഇവിടെ സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തിന് ലളിത ഭൂതകാലം മതിയാകുന്നു.
- source_word: πρὸς ἀλλήλους
  choice: പരസ്പരം
  rationale: ഒരാൾ മറ്റൊരാളോടു സംസാരിച്ചതെന്ന പരസ്പരബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: അപ്പോൾ ഇവൻ ആരാണ്
  rationale: ἄρα സംഭവത്തിൽനിന്നുള്ള ഞെട്ടലോടുകൂടിയ നിഗമനഭാവം നൽകുന്നു; ‘അപ്പോൾ’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: — … എന്നല്ലോ?
  rationale: ചോദ്യത്തിന് ആധാരമായ അതിശയകരമായ വസ്തുതയെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ദീർഘവിരാമവും ‘-വല്ലോ’ എന്ന ഊന്നലും ഉപയോഗിച്ചു; കാരണം/ഉള്ളടക്കം എന്ന ഗ്രീക്ക് ബന്ധം അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: കാറ്റും കടലുംപോലും
  rationale: ആദ്യ καί നൽകുന്ന ‘പോലും’ എന്ന ആശ്ചര്യ ഊന്നലും രണ്ടാമത്തേതിന്റെ ഏകോപനവും ഈ രൂപം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ὑπακούει αὐτῷ
  choice: ഇവനെ അനുസരിക്കുന്നു
  rationale: ὑπακούω ഇവിടെ യേശുവിന്റെ കല്പനയ്ക്ക് കാറ്റും കടലും കീഴടങ്ങുന്നതിനെ വ്യക്തിപരമായി ചിത്രീകരിക്കുന്നു; ‘അനുസരിക്കുക’ അതിന്റെ അധികാരഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: സൃഷ്ടിയുടെമേലുള്ള യേശുവിന്റെ അധികാരം
  choice: ശിഷ്യരുടെ അതിശയചോദ്യവും കാറ്റിന്റെയും കടലിന്റെയും അനുസരണവും നേരിട്ട് നിലനിർത്തി.
  alternative: യേശുവിന്റെ ദൈവിക വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള വ്യക്തമായ സിദ്ധാന്തപ്രസ്താവന ചേർക്കുക.
  rationale: വാക്യം അസാധാരണമായ അധികാരത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും നിഗമനം പ്രസ്താവിക്കാതെ ശിഷ്യരുടെ ചോദ്യമായിട്ടാണ് അവതരിപ്പിക്കുന്നത്; പരിഭാഷയും ആ സംഘർഷം സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ഊന്നലുകൾ ‘അത്യന്തം’, ‘പോലും’, ‘-വല്ലോ’ എന്നിവയിലൂടെ സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു; സിദ്ധാന്തപരമായ വിശദീകരണം വാക്യത്തിലേക്ക് ചേർത്തിട്ടില്ല.
