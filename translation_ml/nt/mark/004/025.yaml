id: MRK.4.25
reference: Mark 4:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: ml
  text: കാരണം, ആർക്കുണ്ടോ, അവന് കൂടുതൽ[a] നൽകപ്പെടും; ആർക്കില്ലയോ, അവനുള്ളതുപോലും അവനിൽനിന്ന് എടുത്തുകളയപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘അവന് നൽകപ്പെടും’ എന്നു മാത്രമാണ് ഉള്ളത്; ഈ ചൊല്ലിന്റെ വിരുദ്ധസമാന്തരതയിൽനിന്ന് ‘കൂടുതൽ’ എന്ന ആശയം സൂചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ഉള്ളവന് / ഇല്ലാത്തവനിൽനിന്ന്
  rationale: അനിശ്ചിത ബന്ധസർവനാമത്തിന്റെ പൊതുവായ, പഴഞ്ചൊല്ലുസദൃശമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നാമവിശേഷണരൂപങ്ങളിലൂടെ അറിയിച്ചു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിന് വിശദീകരണമോ അടിസ്ഥാനമോ നൽകുന്ന ബന്ധകശക്തി വ്യക്തമാക്കുന്നു.
- source_word: ἔχει
  choice: ഉള്ളവൻ / അവനുള്ളത്
  rationale: എന്താണ് ഉള്ളതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘ഉണ്ട്’ എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: δοθήσεται αὐτῷ
  choice: അവന് കൂടുതൽ നൽകപ്പെടും
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല; വിരുദ്ധസമാന്തരഘടന സൂചിപ്പിക്കുന്ന വർധന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘കൂടുതൽ’ ചേർത്തു.
- source_word: καὶ
  choice: -ഓ
  rationale: രണ്ടാം വിരുദ്ധഘടകത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്ന ഭാവം നൽകുന്നു.
- source_word: οὐκ ἔχει
  choice: ഇല്ലാത്തവൻ
  rationale: നിഷേധാത്മക ഉടമസ്ഥതയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὃ ἔχει
  choice: അവനുള്ളതുപോലും
  rationale: നപുംസകലിംഗ ബന്ധസർവനാമത്തിന്റെ അവ്യക്തമായ വസ്തുസൂചന നിലനിർത്തുകയും καίയുടെ ഊന്നൽ ‘പോലും’ വഴി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: അവനിൽനിന്ന് എടുത്തുകളയപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും ἀπό സൂചിപ്പിക്കുന്ന വേർപെടുത്തലും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: δοθήσεται എന്നതിലെ പരോക്ഷ കർമം
  choice: ‘കൂടുതൽ നൽകപ്പെടും’ എന്ന് വിവർത്തനം ചെയ്തു.
  alternative: ‘നൽകപ്പെടും’ എന്ന് കർമം ചേർക്കാതെ വിടുക.
  rationale: മൂലഗ്രീക്കിൽ കർമം വ്യക്തമല്ലെങ്കിലും വാക്യത്തിന്റെ വിരുദ്ധസമാന്തരഘടന വർധന സൂചിപ്പിക്കുന്നു; ‘കൂടുതൽ’ മലയാളത്തിലെ അർഥവ്യക്തതയ്ക്കായി ചേർത്തതാണ്, പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാനല്ല.
- issue: പൊതുവായ പുരുഷ ഏകവചന സൂചന
  choice: ‘ഉള്ളവൻ ... അവൻ’ എന്ന ഏകവചന പ്രതിനിധിരൂപം നിലനിർത്തി.
  alternative: ‘ഉള്ളവർ ... അവർ’ എന്ന ബഹുവചനരൂപം.
  rationale: മൂലപാഠത്തിലെ വ്യാകരണപരമായ പുരുഷ ഏകവചനവും പൊതുപ്രയോഗവും മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പഴഞ്ചൊല്ലുസദൃശ ശൈലി. ‘കൂടുതൽ’ മൂലപാഠത്തിൽ വ്യക്തമാക്കിയ കർമമല്ലെങ്കിലും മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനായി ചേർത്തു.
