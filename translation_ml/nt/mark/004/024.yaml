id: MRK.4.24
reference: Mark 4:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “നിങ്ങൾ കേൾക്കുന്നതെന്തെന്നു ശ്രദ്ധിക്കുക. നിങ്ങൾ അളക്കുന്ന അളവിൽ നിങ്ങൾക്കും അളന്നു ലഭിക്കും; നിങ്ങൾക്കു കൂടുതൽ ചേർത്തുനൽകപ്പെടുകയും ചെയ്യും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങൾക്കു കൂടുതൽ ചേർത്തുനൽകപ്പെടുകയും ചെയ്യും” എന്നത് യേശുവിന്റെ ഉപദേശം സ്വീകരിക്കുന്നവർക്ക് കൂടുതൽ ഗ്രാഹ്യം ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്നോ ആവർത്തിച്ചിരുന്നോ ആയ സംസാരത്തെ സൂചിപ്പിക്കാം; മലയാളത്തിൽ ഈ രൂപം ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Βλέπετε
  choice: ശ്രദ്ധിക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘നോക്കുക’ എന്നാണെങ്കിലും ഇവിടെ കേൾക്കുന്ന കാര്യത്തിൽ ജാഗ്രതയോടെയുള്ള ശ്രദ്ധ ആവശ്യപ്പെടുന്ന ആഹ്വാനമാണ്.
- source_word: τί ἀκούετε
  choice: നിങ്ങൾ കേൾക്കുന്നത് എന്താണെന്ന്
  rationale: τί എന്നത് ‘എന്ത്’ എന്നാണ്; ‘എങ്ങനെ കേൾക്കുന്നു’ എന്നു മാറ്റാതെ മർക്കോസിന്റെ പ്രത്യേക പദപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: നിങ്ങൾ ഏത് അളവുകൊണ്ട് അളക്കുന്നുവോ
  rationale: അളവിന്റെ മാനദണ്ഡമോ ഉപകരണമോ സൂചിപ്പിക്കുന്ന രൂപകത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μετρηθήσεται ὑμῖν
  choice: അതേ അളവുകൊണ്ട് നിങ്ങൾക്കും അളന്നുകിട്ടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും പ്രത്യുപകാരസ്വഭാവമുള്ള അളവിന്റെ രൂപകവും സംരക്ഷിക്കുന്നു; ‘അതേ അളവുകൊണ്ട്’ എന്നത് ഗ്രീക്ക് വാക്യഘടനയിൽ അന്തർനിഹിതമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: προστεθήσεται ὑμῖν
  choice: അതിലധികവും നിങ്ങൾക്കു ചേർത്തുതരും
  rationale: προστίθημι എന്ന ക്രിയയിലെ ‘ചേർക്കുക’ എന്ന ആശയം നിലനിർത്തുകയും സന്ദർഭത്തിലെ വർധന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അളവിനെക്കുറിച്ചുള്ള പരസ്പരപ്രതികരണവാക്യത്തിന്റെ വ്യാഖ്യാനം
  choice: യേശുവിന്റെ ഉപദേശം കേൾക്കുകയും സ്വീകരിക്കുകയും ചെയ്യുന്നതോടുള്ള പ്രതികരണത്തെ സൂചിപ്പിക്കാവുന്ന വിശാലമായ രൂപകമായി വിവർത്തനം ചെയ്തു.
  alternative: ഇത് ന്യായവിധിയെയോ ഔദാര്യത്തെയോ ആത്മീയ ഗ്രഹണത്തിന്റെ വർധനയെയോ മാത്രം സൂചിപ്പിക്കുന്നതായി പരിമിതപ്പെടുത്തുക.
  rationale: തൽസന്ദർഭം കേൾവിയെയും യേശുവിന്റെ സന്ദേശം സ്വീകരിക്കുന്നതിനെയും കുറിച്ചാണെങ്കിലും വാക്യം പ്രയോഗത്തിന്റെ പരിധി തുറന്നുവയ്ക്കുന്നു; അതിനാൽ ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും ഗൗരവമുള്ള ശൈലി പാലിച്ചു. ‘അളവ്’ എന്ന ആവർത്തിത രൂപകം നിലനിർത്തി; ലൂക്കോസ് 8:18-ലെ ‘എങ്ങനെ കേൾക്കുന്നു’ എന്ന വായനയുമായി മർക്കോസിനെ സമന്വയിപ്പിച്ചില്ല.
