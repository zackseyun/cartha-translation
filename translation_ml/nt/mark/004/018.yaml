id: MRK.4.18
reference: Mark 4:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: ml
  text: മുള്ളുകൾക്കിടയിൽ വിതയ്ക്കപ്പെട്ട മറ്റുള്ളവരുമുണ്ട്[a]; ഇവർ വചനം[b] കേട്ടവരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുള്ളുകളിലേക്ക്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സന്ദേശം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: മറ്റുള്ളവർ
  rationale: മുൻപ് പറഞ്ഞ വിഭാഗങ്ങളിൽനിന്ന് വേറിട്ട മറ്റൊരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന നാമവാചകപ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἰς τὰς ἀκάνθας
  choice: മുള്ളുകൾക്കിടയിൽ
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചനാപരമായ അർഥം ഇവിടെ കൃഷിസന്ദർഭത്തിൽ മുള്ളുകൾ നിറഞ്ഞ ഇടത്തിൽ വിതയ്ക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മുള്ളുകൾക്കിടയിൽ’ സ്വാഭാവികമാണ്. ‘മുള്ളുകളിലേക്ക്’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀκάνθας
  choice: മുള്ളുകൾ
  rationale: ഉപമയിലെ സസ്യസംബന്ധമായ ദൃശ്യത്തെ വ്യക്തമായും സാധാരണ മലയാളത്തിലും പകരുന്നു.
- source_word: σπειρόμενοι
  choice: വിതയ്ക്കപ്പെട്ട
  rationale: വർത്തമാനകാല കർമണി പങ്കാളിത്തരൂപത്തിന്റെ വിത്ത്-രൂപകം നിലനിർത്തുന്നു; മലയാളവാക്യത്തിൽ സ്വാഭാവികമായ പൂർത്തീകരിച്ച വിശേഷണരൂപം ഉപയോഗിക്കുന്നു.
- source_word: οὗτοί εἰσιν
  choice: ഇവർ ... ആണ്
  rationale: വിശദീകരണത്തിലെ പുനർതിരിച്ചറിയൽ സൂത്രം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: οἱ ... ἀκούσαντες
  choice: കേട്ടവർ
  rationale: തുടർന്ന് സംഭവിക്കുന്ന കാര്യങ്ങൾക്ക് മുമ്പുള്ള കേൾവിയെ സൂചിപ്പിക്കുന്ന aorist പങ്കാളിത്തരൂപം ലളിതമായ ഭൂതകാല വിശേഷണരൂപത്തിൽ പകരുന്നു.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: പ്രഖ്യാപിക്കപ്പെട്ട ദൈവിക സന്ദേശം എന്ന സന്ദർഭാർഥവും ബൈബിൾപ്രയോഗത്തിന്റെ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; ‘സന്ദേശം’ സാധുവായ മറ്റൊരു പരിഭാഷയാണ്.
theological_decisions:
- issue: ഉപമയുടെ വിശദീകരണത്തിൽ മനുഷ്യരെ വിത്തുമായി രൂപകപരമായി തിരിച്ചറിയുന്നത്
  choice: ‘മുള്ളുകൾക്കിടയിൽ വിതയ്ക്കപ്പെട്ട മറ്റുള്ളവർ’ എന്ന നേരിട്ടുള്ള വിത്ത്-രൂപകം നിലനിർത്തി
  alternative: ‘മുള്ളുനിറഞ്ഞ നിലത്തിൽ വിതയ്ക്കപ്പെട്ടവർ’ അല്ലെങ്കിൽ രൂപകം അഴിച്ചുപറയുന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ
  rationale: ഗ്രീക്ക് പാഠം മനുഷ്യരെ വിതയ്ക്കപ്പെട്ട വിത്തിനോടു നേരിട്ട് ഉപമിക്കുന്നു. അതിനെ വിശദീകരണപരമായി മാറ്റാതെ നിലനിർത്തുന്നത് ഉപമയുടെ സാഹിത്യഘടനയും ഉള്ളിലെ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘വചനം’ ബൈബിൾസന്ദർഭത്തിലെ പരിചിതപ്രയോഗമായി ഉപയോഗിച്ചെങ്കിലും സാധാരണ വായനക്കാർക്കായി ‘സന്ദേശം’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
