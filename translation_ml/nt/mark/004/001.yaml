id: MRK.4.1
reference: Mark 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: ml
  text: അവൻ വീണ്ടും കടൽത്തീരത്ത് പഠിപ്പിക്കാൻ തുടങ്ങി. വളരെ വലിയൊരു ജനക്കൂട്ടം അവന്റെ അടുക്കൽ വന്നുകൂടുന്നു[a]. അങ്ങനെ അവൻ ഒരു വള്ളത്തിൽ കയറി കടലിൽ ഇരുന്നു[b]; ജനക്കൂട്ടം മുഴുവനും കടലിനരികെ കരയിലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ അടുക്കൽ വന്നുകൂടിക്കൊണ്ടിരിക്കുന്നു.’ സജീവമായ ആഖ്യാനത്തിനായി മർക്കോസ് പലപ്പോഴും ഭൂതകാലസംഭവങ്ങൾ വർത്തമാനകാലത്തിൽ വിവരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അവൻ വള്ളത്തിൽ വെള്ളത്തിന്മേൽ ഇരുന്നു; ജനക്കൂട്ടം കരയിൽത്തന്നെ നിന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: യേശുവിന്റെ പഠിപ്പിക്കൽ പ്രവർത്തനം ആവർത്തിക്കുന്നുവെന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἤρξατο διδάσκειν
  choice: പഠിപ്പിക്കാൻ തുടങ്ങി
  rationale: ആരംഭത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയുടെ അർഥവും സ്വാഭാവിക മലയാള വാക്യക്രമവും നിലനിർത്തുന്നു.
- source_word: παρὰ τὴν θάλασσαν
  choice: കടൽത്തീരത്ത്
  rationale: കടലിനരികിലുള്ള സ്ഥലം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിലെ ‘കടൽ’ എന്ന പ്രയോഗം ‘തടാകം’ എന്നു പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: συνάγεται
  choice: വന്നുകൂടുന്നു
  rationale: മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുകയും യേശുവിന്റെ അടുക്കലേക്കുള്ള ചലനവും കൂടിച്ചേരലും പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὄχλος πλεῖστος
  choice: വളരെ വലിയൊരു ജനക്കൂട്ടം
  rationale: πλεῖστος എന്നതിന്റെ ശക്തമായ അളവാർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πρὸς αὐτόν
  choice: അവന്റെ അടുക്കൽ
  rationale: യേശുവിന്റെ ദിശയിലേക്കുള്ള ജനക്കൂട്ടത്തിന്റെ ചലനം നേരിട്ട് നൽകുന്നു.
- source_word: ὥστε
  choice: അതിനാൽ
  rationale: ജനക്കൂട്ടത്തിന്റെ വലുപ്പത്തിന്റെ ഫലമായി തുടർന്ന സംഭവം ഉണ്ടായെന്ന ഫലബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: ഒരു വള്ളത്തിൽ കയറി
  rationale: പങ്കുപദഘടനയെ മലയാളത്തിലെ സ്വാഭാവിക അനുക്രമക്രിയയായി നൽകുന്നു.
- source_word: πλοῖον
  choice: വള്ളം
  rationale: ഗലീലക്കടലിലെ സാഹചര്യത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: καθῆσθαι
  choice: ഇരുന്നു
  rationale: ഫലഘടനയിലെ പ്രധാന പ്രവൃത്തിയെ ലളിതവും നേരിട്ടുമായ ഭൂതകാലത്തിൽ നൽകുന്നു.
- source_word: ἐν τῇ θαλάσσῃ
  choice: കടലിൽ
  rationale: മൂലപാഠത്തിന്റെ സ്ഥലപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു; വള്ളത്തിലായതിനാൽ വെള്ളത്തിന്മേലാണെന്ന സാഹചര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πᾶς ὁ ὄχλος
  choice: ജനക്കൂട്ടം മുഴുവനും
  rationale: ഗ്രീക്കിലെ ഏകവചന കൂട്ടനാമത്തെയും സമഗ്രതയെയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς
  choice: കടൽത്തീരത്ത് കരയിൽ
  rationale: കടലിനോടു ചേർന്ന്, എന്നാൽ വെള്ളത്തിലല്ലാതെ കരയിലായിരുന്നു എന്ന സ്ഥലവ്യത്യാസം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ചരിത്രവർത്തമാനകാലമായ συνάγεται ‘വന്നുകൂടുന്നു’ എന്നു നിലനിർത്തി. ‘കടൽ’ എന്ന മൂലപാഠപ്രയോഗം സൂക്ഷിച്ചു; ‘കടലിൽ ഇരുന്നു’ എന്ന വാചകത്തിന്റെ സാഹചര്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
