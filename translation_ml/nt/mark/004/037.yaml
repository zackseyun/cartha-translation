  text: καὶ γίνεται λαῖλαψ ⸂μεγάλη ἀνέμου⸃, ⸂καὶ τὰ⸃ κύματα ἐπέβαλλεν εἰς τὸ πλοῖον, ὥστε ⸂ἤδη γεμίζεσθαι τὸ πλοῖον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: ml
  text: അപ്പോൾ വലിയൊരു കൊടുങ്കാറ്റ് ഉണ്ടായി[a]. തിരമാലകൾ വള്ളത്തിലേക്ക് വീണ്ടും വീണ്ടും അടിച്ചുകയറിക്കൊണ്ടിരുന്നു[b]; അതിനാൽ വള്ളം അപ്പോഴേക്കും നിറഞ്ഞുകൊണ്ടിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘വലിയൊരു കാറ്റിന്റെ കൊടുങ്കാറ്റ്.’'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തിരമാലകൾ വള്ളത്തിലേക്ക് അടിച്ചുകൊണ്ടിരുന്നു.’ ഗ്രീക്കിലെ അപൂർണഭൂതകാല ക്രിയ ആവർത്തിച്ചുകൊണ്ടിരുന്ന പ്രവർത്തനത്തെ ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘വള്ളം അപ്പോഴേക്കും നിറയുകയായിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: ഉണ്ടായി
  rationale: വർത്തമാനകാലരൂപം മർക്കോസിന്റെ സജീവമായ ചരിത്രവർത്തമാന പ്രയോഗമാണ്; മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനത്തിന് ഭൂതകാലമായ ‘ഉണ്ടായി’ യോജിക്കുന്നു, കൊടുങ്കാറ്റിന്റെ ആരംഭവും ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: വലിയൊരു കൊടുങ്കാറ്റ്
  rationale: λαῖλαψ ശക്തമായ കാറ്റോടുകൂടിയ പെട്ടെന്നുള്ള കൊടുങ്കാറ്റിനെയും μέγαλη അതിന്റെ വലിപ്പമോ തീവ്രതയോ സൂചിപ്പിക്കുന്നു. ‘വലിയൊരു കൊടുങ്കാറ്റ്’ മൂലപദങ്ങളുടെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κύματα
  choice: തിരമാലകൾ
  rationale: κῦμα എന്നതിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാള തത്തുല്യം.
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: വള്ളത്തിലേക്ക് വീണ്ടുംവീണ്ടും അടിച്ചുകയറിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയ ആവർത്തിച്ചുകൊണ്ടിരുന്ന പ്രവർത്തനത്തെ ചിത്രീകരിക്കുന്നു. ‘അടിച്ചുകയറുക’ തിരമാലകൾ വള്ളത്തെ പ്രഹരിക്കുകയും അതിനകത്തേക്കു കയറുകയും ചെയ്ത ആശയം ഒരുമിച്ച് നൽകുന്നു.
- source_word: πλοῖον
  choice: വള്ളം
  rationale: ഗലീലക്കടലിലെ ഈ ജലയാനത്തിന് ആധുനിക മലയാളത്തിൽ ‘വള്ളം’ സ്വാഭാവികമാണ്; ‘കപ്പൽ’ അനാവശ്യമായി വലിയ ജലയാനം സൂചിപ്പിക്കാം.
- source_word: ὥστε
  choice: അതിനാൽ
  rationale: ὥστε ഫലത്തെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അതിനാൽ’ മുൻപ്രവർത്തനത്തിന്റെ ഫലം വ്യക്തവും സംക്ഷിപ്തവുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἤδη
  choice: അപ്പോഴേക്കും
  rationale: നിറയുന്ന പ്രക്രിയ ഇതിനകം മുന്നേറിയിരുന്നുവെന്ന ἤδηയുടെ കാലസൂചന ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: വള്ളം ... നിറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: വർത്തമാന അനന്തരൂപം തുടരുന്ന ഫലപ്രക്രിയയെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ മധ്യ/കർമണി രൂപം മലയാളത്തിൽ അസ്വാഭാവികമായ കർമണിപ്രയോഗമാക്കാതെ ‘നിറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നു നൽകിയിരിക്കുന്നു; ‘വെള്ളം’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത പദം ചേർത്തിട്ടില്ല.
