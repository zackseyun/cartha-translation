id: MRK.4.22
reference: Mark 4:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: ml
  text: എന്തെന്നാൽ, വെളിപ്പെടാനല്ലാതെ മറഞ്ഞിരിക്കുന്നത് ഒന്നുമില്ല; വെളിച്ചത്തു വരാനല്ലാതെ മറച്ചുവെക്കപ്പെട്ടതായിത്തീർന്നതൊന്നുമില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “വെളിപ്പെടേണ്ടതിനല്ലാതെ മറഞ്ഞിരിക്കുന്നത് ഒന്നുമില്ല; വെളിച്ചത്തു വരേണ്ടതിനല്ലാതെ മറച്ചുവെക്കപ്പെട്ടതായിത്തീർന്നതൊന്നുമില്ല.” ഗ്രീക്കിലെ ἵνα ഉപവാക്യങ്ങൾക്ക് ഉദ്ദേശ്യത്തിന്റെയോ ഫലത്തിന്റെയോ ഭാവം നൽകാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κρυπτόν
  choice: മറഞ്ഞിരിക്കുന്നത്
  rationale: ഉദ്ദേശപൂർവമായ രഹസ്യവത്കരണം നിർബന്ധമായി സൂചിപ്പിക്കാതെ, കാണപ്പെടാതിരിക്കുന്നതെന്ന അടിസ്ഥാന അർഥം നൽകുന്നു.
- source_word: ἐὰν μὴ ἵνα φανερωθῇ
  choice: വെളിപ്പെടേണ്ടതിനല്ലാതെ
  rationale: ഒഴിവാക്കൽഭാവത്തോടൊപ്പം ἵναയുടെ ഉദ്ദേശ്യ/ഫല സൂചനയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπόκρυφον
  choice: മറച്ചുവെക്കപ്പെട്ടത്
  rationale: κρυπτόν എന്നതുമായുള്ള സമാന്തരത നിലനിർത്തിക്കൊണ്ട്, കാഴ്ചയിൽനിന്ന് മാറ്റിവെച്ച അവസ്ഥയുടെ കൂടുതൽ അടയാളപ്പെടുത്തിയ ഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἐγένετο
  choice: ഉണ്ടായിട്ടുമില്ല
  rationale: ഒരു മറച്ചുവെക്കപ്പെട്ട അവസ്ഥ നിലവിൽ വന്നതെന്ന γίνομαιയുടെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔλθῃ εἰς φανερόν
  choice: വെളിച്ചത്തുവരേണ്ടതിന്
  rationale: ‘പ്രത്യക്ഷമായതിലേക്കു വരുക’ എന്ന ചലനചിത്രവും ‘വെളിച്ചത്തുവരുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആവർത്തിക്കുന്ന ἵνα ഉപവാക്യങ്ങളിലെ ഉദ്ദേശ്യം/ഫലം എന്ന ദ്വയാർഥസാധ്യത
  choice: പ്രധാനപാഠത്തിൽ ‘വെളിപ്പെടേണ്ടതിന് / വെളിച്ചത്തുവരേണ്ടതിന്’ എന്ന് നൽകി ഉദ്ദേശ്യഭാവം മുൻനിർത്തുന്നു.
  alternative: ‘വെളിപ്പെടാനല്ലാതെ … വെളിച്ചത്തുവരാനല്ലാതെ’ എന്നത് ഉദ്ദേശ്യമോ ഫലമോ ആയി കേൾക്കാം.
  rationale: കോയ്നെ ഗ്രീക്കിലെ ἵνα സാധാരണയായി ഉദ്ദേശ്യം സൂചിപ്പിച്ചാലും ഫലഭാവത്തിലേക്കു ചായാം. ദൈവിക കാരണത്തെ അതിരുകടന്ന് നിർണ്ണയിക്കാതെ ഈ പിരിമുറുക്കം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സമാന്തരഘടനയും മറവ്–വെളിപ്പെടൽ വൈരുധ്യവും നിലനിർത്തി; അപൂർവമായ പദാനുപദ ഘടന ഒഴിവാക്കി.
