id: LUK.10.17
reference: Luke 10:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: ml
  text: 'പിന്നെ ആ എഴുപത്തിരണ്ടുപേർ[a] സന്തോഷത്തോടെ മടങ്ങിവന്ന് പറഞ്ഞു: “കർത്താവേ, അങ്ങയുടെ നാമത്തിൽ ഭൂതങ്ങൾപോലും ഞങ്ങൾക്കു കീഴടങ്ങുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “എഴുപത്തിരണ്ട്” എന്നതിനു പകരം “എഴുപത്” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: മടങ്ങിവന്ന്
  rationale: ദൗത്യം കഴിഞ്ഞുള്ള തിരിച്ചുവരവിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; തുടർന്ന് വരുന്ന സംസാരക്രിയയുമായി നന്നായി ബന്ധപ്പെടുന്നു.
- source_word: δὲ
  choice: പിന്നെ
  rationale: കഥയുടെ തുടർച്ചയും അടുത്ത സംഭവവികാസവും സൂചിപ്പിക്കുന്നു.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: ആ എഴുപത്തിരണ്ടുപേർ
  rationale: SBLGNT-യിലെ എഴുപത്തിരണ്ട് എന്ന വായന പിന്തുടരുന്നു; അറിയപ്പെടുന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: μετὰ χαρᾶς
  choice: സന്തോഷത്തോടെ
  rationale: അർഥം നഷ്ടപ്പെടാതെ മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാവിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ വർത്തമാന കൃദന്തരൂപം മലയാളത്തിലെ സ്വാഭാവിക കഥനക്രമത്തിൽ സമാപികാക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριε എന്ന പദത്തിന്റെ പതിവും മാന്യവുമായ മലയാളരൂപം.
- source_word: καὶ
  choice: പോലും
  rationale: ഇവിടെ ആശ്ചര്യത്തിന് ഊന്നൽ നൽകുന്ന ascensive അർഥം—‘ഭൂതങ്ങൾപോലും’—വ്യക്തമാക്കുന്നു.
- source_word: τὰ δαιμόνια
  choice: ഭൂതങ്ങൾ
  rationale: ശത്രുതാപരമായ ആത്മിക സത്തകളെ സൂചിപ്പിക്കുന്ന δαιμόνιαയുടെ നേരിട്ടുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ മലയാള പദം.
- source_word: ὑποτάσσεται
  choice: കീഴടങ്ങുന്നു
  rationale: വർത്തമാനകാലത്തിലെ വിധേയത്വത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിലെ മധ്യ/കർമണി രൂപഭേദം സന്ദർഭത്തിൽ തീർപ്പാക്കാതെ പ്രവർത്തനഫലം സംരക്ഷിക്കുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങൾക്കു
  rationale: ὑποτάσσωയോടു ചേർന്ന ദത്തിവിന്റെ ബന്ധം മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: ἐν τῷ ὀνόματί σου
  choice: അങ്ങയുടെ നാമത്തിൽ
  rationale: യേശുവിന്റെ നാമത്തോടു ബന്ധപ്പെട്ട അധികാരവും പ്രവർത്തനവും ഉൾക്കൊള്ളുന്ന പദപ്രയോഗം സംരക്ഷിക്കുന്നു; ‘അങ്ങയുടെ’ ആദരസൂചക അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യരുടെ എണ്ണത്തിലെ പാഠഭേദം
  choice: എഴുപത്തിരണ്ട്
  alternative: എഴുപത്
  rationale: നൽകിയ SBLGNT മൂലപാഠം ‘എഴുപത്തിരണ്ട്’ എന്നു വായിക്കുന്നു. പ്രധാനവും സുപരിചിതവുമായ ‘എഴുപത്’ എന്ന പാഠഭേദം മൗനമായി ഒഴിവാക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. നേരിട്ടുള്ള പ്രസംഗത്തിൽ യേശുവിനോടുള്ള ആദരം നിലനിർത്താൻ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. പാഠഭേദസൂചകം ബന്ധപ്പെട്ട സംഖ്യയ്ക്കു പിന്നാലെ വരേണ്ടതിനാൽ [a] പ്രധാനവാചകത്തിലെ ‘എഴുപത്തിരണ്ടുപേർ’ എന്നതിനു ഉടൻശേഷം ചേർക്കുന്നതാണ് ഉചിതം.
