  source_fidelity: The adversative, future comparison, and reference to the judgment are retained. However, the current Malayalam word order and predication can be read as saying that Tyre and Sidon themselves will be more bearable than the audience, rather than that the judgment will be more bearable for them. Supplying the understood subject, ‘the judgment,’ makes the Greek impersonal comparative construction clear.
