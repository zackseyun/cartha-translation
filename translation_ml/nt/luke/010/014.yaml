  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: ml
  text: എന്നാൽ ന്യായവിധിയിൽ നിങ്ങളെക്കാൾ സോരിനും സീദോനും ന്യായവിധി കൂടുതൽ സഹിക്കാവുന്നതായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൂടുതൽ താങ്ങാവുന്നതായിരിക്കും.”
    reason: ἀνεκτότερον എന്ന പദത്തിന്റെ സാധുവായ മറ്റൊരു മലയാള പദപ്രയോഗം നൽകുന്നു.
lexical_decisions:
- source_word: πλὴν
  choice: എന്നാൽ
  rationale: മുൻപത്തെ ശാസനയോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: സോരിനും സീദോനും
  rationale: താരതമ്യവിശേഷണത്തോടൊപ്പം വരുന്ന ദത്തിവ്, ന്യായവിധി ആർക്കാണ് കൂടുതൽ സഹിക്കാവുന്നതാകുക എന്നു സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ന്’ രൂപം അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀνεκτότερον
  choice: കൂടുതൽ സഹിക്കാവുന്നതായിരിക്കും
  rationale: ‘സഹിക്കാവുന്നത്/താങ്ങാവുന്നത്’ എന്ന താരതമ്യാർഥം കൃത്യമായി നൽകുകയും ന്യായവിധിയുടെ സാഹചര്യത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: ഭാവികാലത്തിലുള്ള εἰμί എന്ന ബന്ധകക്രിയയുടെ അർഥം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: ἐν τῇ κρίσει
  choice: ന്യായവിധിയിൽ
  rationale: നിശ്ചിതമായ ദൈവിക ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം അധിക വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἢ ὑμῖν
  choice: നിങ്ങളെക്കാൾ
  rationale: ഗ്രീക്കിലെ താരതമ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ‘-യെക്കാൾ’ രൂപത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: സന്ദർഭത്തിലെ κρίσις എന്നതിന്റെ സ്വഭാവം
  choice: ‘ന്യായവിധി’ എന്ന് പരിഭാഷപ്പെടുത്തി അന്തിമ ദൈവിക വിധിയുടെ സൂചന നിലനിർത്തുന്നു
  alternative: പൊതുവായ അർഥത്തിൽ ‘വിധി’
  rationale: മാനസാന്തരപ്പെടാത്ത പട്ടണങ്ങളെ സോരിനോടും സീദോനോടും താരതമ്യം ചെയ്യുന്ന സന്ദർഭം അന്തിമ ന്യായവിധിയിലേക്കാണ് ശക്തമായി വിരൽചൂണ്ടുന്നത്; എന്നാൽ മൂലപാഠത്തെക്കാൾ വിശദീകരിച്ച് ആശയം പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സ്ഥലനാമങ്ങൾക്ക് മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ‘സോർ/സീദോൻ’ പരമ്പരയിൽ, ഇവിടെ ദത്തിവ് ഘടനയ്ക്ക് അനുയോജ്യമായി ‘സോരിനും സീദോനും’ ഉപയോഗിച്ചു; താരതമ്യത്തിന്റെ അർഥം വ്യക്തമായി നിലനിർത്തി.
