  to: അയാളുടെ അടുത്തുചെന്ന്, മുറിവുകളിൽ എണ്ണയും വീഞ്ഞും ഒഴിച്ചുകൊണ്ട് അവ കെട്ടിവെച്ചു.[a] പിന്നെ അയാളെ തന്റെ സ്വന്തം മൃഗത്തിന്റെ പുറത്തു കയറ്റി, ഒരു യാത്രക്കാരുടെ താമസസ്ഥലത്തേക്ക് കൊണ്ടുപോയി പരിചരിച്ചു.
