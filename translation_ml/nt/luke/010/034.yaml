id: LUK.10.34
reference: Luke 10:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: ml
  text: അയാളുടെ അടുത്തുചെന്ന്, മുറിവുകളിൽ എണ്ണയും വീഞ്ഞും ഒഴിച്ചുകൊണ്ട് അവ കെട്ടിവെച്ചു.[a] പിന്നെ അയാളെ തന്റെ സ്വന്തം മൃഗത്തിന്റെ പുറത്തു കയറ്റി, ഒരു യാത്രക്കാരുടെ താമസസ്ഥലത്തേക്ക് കൊണ്ടുപോയി പരിചരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുറിവുകൾക്ക് കെട്ടിട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: അയാളുടെ അടുത്തുചെന്ന്
  rationale: പരിക്കേറ്റ മനുഷ്യന്റെ അടുത്തേക്കുള്ള ശാരീരിക സമീപനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; aorist participle-ന്റെ മുൻകാല/അനുബന്ധ പ്രവർത്തനഭാവവും നിലനിർത്തുന്നു.
- source_word: κατέδησεν
  choice: കെട്ടിവെച്ചു
  rationale: മുറിവുകൾ ബന്ധിച്ചുകെട്ടുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ആധുനിക വൈദ്യോപകരണമായ ‘ബാൻഡേജ്’ അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: τραύματα
  choice: മുറിവുകൾ
  rationale: ആക്രമണത്തിൽ ഉണ്ടായ ശാരീരിക മുറിവുകൾക്കുള്ള നേരിട്ടും സാധാരണവുമായ മലയാള പദം.
- source_word: ἐπιχέων
  choice: ഒഴിച്ച്
  rationale: മുറിവുകളുടെ മേൽ ദ്രാവകങ്ങൾ പകരുന്ന അനുബന്ധ പ്രവർത്തനം ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔλαιον
  choice: എണ്ണ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഒലിവെണ്ണയായിരിക്കാമെങ്കിലും മുഖ്യപാഠത്തിൽ അതിനെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: οἶνον
  choice: വീഞ്ഞ്
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള സമാനപദം; ഔഷധോപയോഗം എന്ന നിഗമനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐπιβιβάσας
  choice: പുറത്ത് കയറ്റി
  rationale: പരിക്കേറ്റയാളെ യാത്രാമൃഗത്തിന്മേൽ ഇരുത്തിയ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἴδιον
  choice: തന്റെ സ്വന്തം
  rationale: സ്വകാര്യ ഉടമസ്ഥതയ്ക്ക് ἴδιον നൽകുന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: κτῆνος
  choice: മൃഗം
  rationale: ചുമടെടുക്കാനോ സവാരിക്കോ ഉപയോഗിക്കുന്ന മൃഗത്തെ സൂചിപ്പിക്കുന്ന വിശാല പദം; പ്രത്യേക ഇനം അനുമാനിക്കുന്നില്ല.
- source_word: πανδοχεῖον
  choice: സത്രം
  rationale: യാത്രക്കാർക്ക് താമസിക്കാവുന്ന പൊതുവായ വഴിയമ്പലം/താമസസ്ഥലം എന്ന ചരിത്രസന്ദർഭം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐπεμελήθη
  choice: പരിചരിച്ചു
  rationale: വ്യക്തിപരമായ ശ്രദ്ധയോടെയുള്ള കരുതലും ശുശ്രൂഷയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സർവനാമപരാമർശം വ്യക്തമാക്കാൻ ‘അയാൾ’ ഉപയോഗിച്ചു. സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ ഭാഷ ഒഴിവാക്കി; ഗ്രീക്കിലെ പ്രവർത്തനക്രമവും ‘തന്റെ സ്വന്തം’ എന്ന ഊന്നലും നിലനിർത്തി.
