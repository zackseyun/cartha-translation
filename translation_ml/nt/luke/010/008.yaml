  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: ml
  text: നിങ്ങൾ ഏതു പട്ടണത്തിൽ പ്രവേശിച്ചാലും, അവിടെയുള്ളവർ നിങ്ങളെ സ്വീകരിക്കുന്നുവെങ്കിൽ[a], നിങ്ങൾക്കു മുന്നിൽ വെക്കുന്നതെല്ലാം ഭക്ഷിക്കുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളെ സ്വാഗതം ചെയ്യുന്നുവെങ്കിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിങ്ങൾക്കു മുന്നിൽ വെക്കപ്പെടുന്നവ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν εἰσέρχησθε
  choice: നിങ്ങൾ ഏതു പട്ടണത്തിൽ പ്രവേശിച്ചാലും
  rationale: ἣν ἂν എന്ന അനിശ്ചിത പൊതുവ്യവസ്ഥയെ ‘ഏതു ... ആയാലും’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ നിലനിർത്തുന്നു; εἰς, εἰσέρχομαι എന്നിവ സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള പ്രവേശനം ‘പ്രവേശിക്കുക’ വ്യക്തമാക്കുന്നു.
- source_word: δέχωνται ὑμᾶς
  choice: അവിടെയുള്ളവർ നിങ്ങളെ സ്വീകരിക്കുന്നെങ്കിൽ
  rationale: δέχομαι എന്നതിന് ഇവിടെ ‘സ്വീകരിക്കുക’ എന്നും ‘സ്വാഗതം ചെയ്യുക’ എന്നും അർഥമാകാം. പൊതുവ്യവസ്ഥയിൽ ആശ്രിതമായ ഈ ഘടകത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘എങ്കിൽ’ എന്നു നൽകി; ‘അവിടെയുള്ളവർ’ എന്നത് ഗ്രീക്കിലെ മൂന്നാംപുരുഷ ബഹുവചന കർത്താവിനെ സാഹചര്യത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐσθίετε
  choice: ഭക്ഷിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നിർദേശസ്വഭാവം ലളിതമായ ആജ്ഞാരൂപത്തിൽ നൽകുന്നു. ‘ഭക്ഷിക്കുക’ ആധുനികവും മാന്യവുമായ പൊതുമലയാളമാണ്.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: നിങ്ങൾക്കു മുന്നിൽ വെക്കുന്നതു
  rationale: παρατίθημι എന്ന പദത്തിന്റെ ‘മുന്നിൽ വെക്കുക’ എന്ന ദൃശ്യവും നിഷ്ക്രിയവുമായ ആശയം സംരക്ഷിക്കുന്നു. ഭക്ഷണസന്ദർഭത്തിൽ ‘വിളമ്പുന്നതു’ എന്നും പറയാമെങ്കിലും അത് അല്പം കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യവും സ്വാഭാവികവുമായ ശൈലി. പരമ്പരാഗതമായ ‘ഭക്ഷിക്കുവിൻ’ എന്ന രൂപത്തിനുപകരം നിലവിലെ നിർദേശരൂപമായ ‘ഭക്ഷിക്കുക’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ വാക്യാരംഭക καί ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
