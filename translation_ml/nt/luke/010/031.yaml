translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. ‘പുരോഹിതൻ’ എന്ന കർത്താവ് രണ്ടാം ഉപവാക്യത്തിൽ ആവർത്തിച്ചത് ‘അവൻ’ എന്ന സർവനാമത്തിന്റെ സാധ്യതയുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കാനാണ്. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ക്രിയയ്ക്കുശേഷം നൽകിയിരിക്കുന്നു.
