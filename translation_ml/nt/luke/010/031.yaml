source:
  edition: SBLGNT
  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: ml
  text: യാദൃച്ഛികമായി ഒരു പുരോഹിതൻ ആ വഴിയിലൂടെ ഇറങ്ങിപ്പോകുകയായിരുന്നു. അവനെ കണ്ടപ്പോൾ പുരോഹിതൻ മറുവശത്തുകൂടി കടന്നുപോയി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കടന്നുപോയി.” എന്നാൽ ഗ്രീക്ക് ക്രിയ മറുവശത്തുകൂടി കടന്നുപോകുന്നതിന്റെ ആശയം സൂചിപ്പിക്കുന്നു; അതിൽ മനഃപൂർവം ഒഴിവാക്കിയെന്ന ധ്വനിയുമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: യാദൃച്ഛികമായി
  rationale: സംഭവങ്ങളുടെ യാദൃച്ഛിക ഒത്തുചേരലിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ദൈവപരിപാലനത്തെയോ കേവല അനിശ്ചിതത്വത്തെയോ കുറിച്ചുള്ള ദാർശനിക നിലപാട് ഇതിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിലെ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്ന വിരുദ്ധാർഥസൂചന ചേർത്തിട്ടില്ല.
- source_word: ἱερεύς τις
  choice: ഒരു പുരോഹിതൻ
  rationale: τις സൂചിപ്പിക്കുന്ന പേരറിയാത്ത ഒരു വ്യക്തിയെ സ്വാഭാവിക മലയാളത്തിൽ ‘ഒരു’ എന്നു നൽകുന്നു; ‘ഒരു പ്രത്യേക പുരോഹിതൻ’ എന്നു പറഞ്ഞാൽ ഉദ്ദേശിക്കാത്ത ഊന്നൽ ഉണ്ടാകാം.
- source_word: κατέβαινεν
  choice: ഇറങ്ങിപ്പോകുകയായിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടരുന്ന പശ്ചാത്തലപ്രവർത്തനം സംരക്ഷിക്കുകയും യെരൂശലേമിൽനിന്നുള്ള താഴോട്ടുള്ള യാത്ര വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: ആ വഴിയിലൂടെ
  rationale: ὁδός-നോടൊപ്പമുള്ള ἐν ഇവിടെ സഞ്ചാരപാതയെ സൂചിപ്പിക്കുന്നു; ‘ആ വഴിയിലൂടെ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἰδὼν αὐτὸν
  choice: അവനെ കണ്ടപ്പോൾ
  rationale: അയാളെ കണ്ടതിനു പിന്നാലെയാണ് പുരോഹിതന്റെ നടപടി ഉണ്ടായതെന്ന കാലബന്ധം aorist participle-ൽനിന്ന് വ്യക്തമായി നൽകുന്നു.
- source_word: ἀντιπαρῆλθεν
  choice: മറുവശത്തുകൂടി കടന്നുപോയി
  rationale: വെറും കടന്നുപോകലിനേക്കാൾ, എതിർവശം പിടിച്ച് ഒഴിവാക്കിക്കടന്ന അർഥം സംയുക്തക്രിയയിൽ ഉണ്ട്. പ്രധാന പാഠത്തിൽ ആ സൂചന നിലനിർത്തുന്നു.
