id: LUK.10.41
reference: Luke 10:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: ml
  text: 'എന്നാൽ കർത്താവ് അവളോടു മറുപടി പറഞ്ഞു: “മാർത്താ, മാർത്താ, നീ പല കാര്യങ്ങളെക്കുറിച്ച് ഉത്കണ്ഠപ്പെടുകയും അസ്വസ്ഥയാകുകയും ചെയ്യുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീ പല കാര്യങ്ങളെക്കുറിച്ച് വിഷമിക്കുകയും കലങ്ങുകയും ചെയ്യുന്നു.’
    reason: μεριμνᾷς, θορυβάζῃ എന്നീ പദങ്ങളുടെ അടുത്ത അർഥവികല്പങ്ങൾ നൽകുന്നു.
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: പങ്കുപദവും ക്രിയയും ചേർന്നുള്ള സാധാരണ ഗ്രീക്ക് ആഖ്യാനപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ഒറ്റ ക്രിയാപദമായി നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മാർത്തയുടെ പരാതിയിൽനിന്ന് കർത്താവിന്റെ പ്രതികരണത്തിലേക്കുള്ള മൃദുവായ വൈരുധ്യവും മാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: αὐτῇ
  choice: അവളോടു
  rationale: മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്നതിനോടൊപ്പം പരോക്ഷ കർമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന ആദരസൂചകവും ക്രിസ്തുശാസ്ത്രപരവുമായ ശീർഷകത്തിന്റെ പതിവായ മലയാളരൂപം.
- source_word: Μάρθα Μάρθα
  choice: മാർത്താ, മാർത്താ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയിലെ ആർദ്രതയും ഊന്നലും നിലനിർത്താൻ ആവർത്തനം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: μεριμνᾷς
  choice: ഉത്കണ്ഠപ്പെടുന്നു
  rationale: ഉള്ളിലെ ആശങ്കയെയും മനോവ്യാകുലതയെയും സൂചിപ്പിക്കുന്ന ശക്തമായെങ്കിലും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദം.
- source_word: θορυβάζῃ
  choice: അസ്വസ്ഥയാകുന്നു
  rationale: ആശങ്കയിൽനിന്ന് വ്യത്യസ്തമായി ഉള്ളിലെ കലക്കമോ അസ്വസ്ഥതയോ സൂചിപ്പിക്കുന്നു.
- source_word: περὶ πολλά
  choice: പല കാര്യങ്ങളെക്കുറിച്ച്
  rationale: മാർത്തയുടെ ചിന്താവിഷയങ്ങളുടെ വ്യാപ്തി പൊതുവായി നിലനിർത്തുന്ന നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
theological_decisions:
- issue: യേശുവിനുള്ള κύριος എന്ന ശീർഷകത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഇവിടെ κύριος ആദരസൂചകമായ അർഥത്തോടൊപ്പം ലൂക്കോസിന്റെ ആഖ്യാനത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ അനുരണനവും വഹിക്കുന്നു; ‘യജമാനൻ’ അതിനെ പരിമിതപ്പെടുത്താം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യവും സ്വാഭാവികവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ആവർത്തനവും രണ്ട് വ്യത്യസ്ത മാനസികാവസ്ഥകളും നിലനിർത്തിയിരിക്കുന്നു.
