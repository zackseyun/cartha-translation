  terminology: ‘അയൽക്കാരൻ’ is the appropriate rendering of πλησίον here. ‘ആയിത്തീർന്നത്’ correctly retains the non-static aspect of γεγονέναι. ‘കള്ളന്മാർ’ is a suitable modern term for λῃσταί.
