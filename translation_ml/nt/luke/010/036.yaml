source:
  edition: SBLGNT
  text: ⸀τίς τούτων τῶν τριῶν πλησίον δοκεῖ σοι γεγονέναι τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/036.yaml
  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: ml
  text: ഈ മൂന്നുപേരിൽ ആരാണ് കള്ളന്മാരുടെ ഇടയിൽ അകപ്പെട്ടവന് അയൽക്കാരനായിത്തീർന്നതെന്ന് നിനക്കു തോന്നുന്നു?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ മൂന്നുപേരിൽ ആരാണ് കള്ളന്മാരുടെ ഇടയിൽ അകപ്പെട്ടവന്റെ അയൽക്കാരനായിരുന്നതെന്ന് നീ കരുതുന്നു?’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, ‘നിനക്കു തോന്നുന്നു, അയൽക്കാരനായിത്തീർന്നത്’ എന്നാണ്; അയൽക്കാരനായി പ്രവർത്തിക്കുന്നതിലെ ഊന്നൽ ഇതിൽ നിലനിൽക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς τούτων τῶν τριῶν
  choice: ഈ മൂന്നുപേരിൽ ആരാണ്
  rationale: നിർദിഷ്ടരായ മൂന്നുപേരിൽനിന്നുള്ള ഒരാളെ തിരഞ്ഞെടുക്കുന്ന ഭാഗികപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത കൂടുതൽ വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: πλησίον
  choice: അയൽക്കാരൻ
  rationale: ഇവിടെ പദം നാമമായി ഉപയോഗിച്ച് മറ്റൊരാളോട് അയൽക്കാരനായി പെരുമാറുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: δοκεῖ σοι
  choice: നിനക്കു തോന്നുന്നു
  rationale: δοκεῖ എന്നതിലെ ‘തോന്നുക’ എന്ന ആശയവും σοι എന്ന ദ്വിതീയപുരുഷ ഏകവചനവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: γεγονέναι
  choice: ആയിത്തീർന്നത്
  rationale: γίνομαι എന്ന ക്രിയയുടെ പൂർണ്ണകാല അനന്തക്രിയാരൂപത്തിലുള്ള ‘ആയിത്തീരുക’ എന്ന ചലനാത്മക അർഥം സംരക്ഷിക്കുന്നു; വെറും ‘ആയിരുന്നു’ എന്നു സ്ഥിരമായി അവതരിപ്പിക്കുന്നില്ല.
- source_word: τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς
  choice: കള്ളന്മാരുടെ കൈയിൽ അകപ്പെട്ടവന്
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘അവൻ’ എന്നു ലിംഗം വ്യക്തമാക്കാതെ ആർട്ടിക്കിളോടുകൂടിയ കൃതന്തത്തിന്റെ ‘ആ വ്യക്തി’ എന്ന സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: നല്ല ശമര്യക്കാരന്റെ ഉപമയിലെ ചോദ്യത്തിന്റെ ധാർമിക ഊന്നൽ
  choice: γεγονέναι എന്നത് ‘ആയിത്തീർന്നത്’ എന്നു പരിഭാഷപ്പെടുത്തി, അയൽക്കാരൻ ആരെന്നു തിരിച്ചറിയുന്നതിൽനിന്ന് അയൽക്കാരനായിത്തീരുന്നതിലേക്കുള്ള യേശുവിന്റെ പുനർക്രമീകരണം നിലനിർത്തുന്നു.
  alternative: ‘അയൽക്കാരനായിരുന്നു’ എന്ന സ്ഥിരമായ അവതരണം
  rationale: ഗ്രീക്ക് ക്രിയ വെറും അവസ്ഥയേക്കാൾ ആയിത്തീരലിനെ സൂചിപ്പിക്കുന്നു. അതിനാൽ വ്യാഖ്യാനം അധികമായി ചേർക്കാതെ വാക്യത്തിന്റെ ധാർമികവും ദൈവശാസ്ത്രപരവുമായ ശക്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യരൂപം. ‘നിനക്കു’ എന്ന ഏകവചന അഭിസംബോധന മൂലപാഠത്തിലെ σοι-യോട് ഒത്തുപോകുന്നു. ‘ആയിത്തീർന്നത്’ അല്പം ഔപചാരികമായെങ്കിലും നിർണായകമായ ഗ്രീക്ക് ക്രിയാഭാവം വ്യക്തമായി കാത്തുസൂക്ഷിക്കുന്നു.
