  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: ml
  text: അവിടെ സമാധാനത്തിന്റെ മകൻ ഉണ്ടെങ്കിൽ[a], നിങ്ങളുടെ സമാധാനം അവന്റെമേൽ വിശ്രമിക്കും; ഇല്ലെങ്കിൽ, അത് നിങ്ങളിലേക്കു മടങ്ങിവരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സമാധാനം സ്വീകരിക്കാൻ തയ്യാറുള്ള ഒരാൾ”—അതായത്, സമാധാനം കൊണ്ടുവരുന്ന സന്ദേശത്തോട് സ്വീകരണശീലമുള്ള ഒരാൾ.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: സമാധാനത്തിന്റെ ഒരു മകൻ
  rationale: സമാധാനത്താൽ വിശേഷിപ്പിക്കപ്പെടുന്നവനെയോ സമാധാനാശംസ സ്വീകരിക്കുന്നവനെയോ സൂചിപ്പിക്കുന്ന സെമിറ്റിക് ശൈലിയിലുള്ള പ്രയോഗമാണിത്. ഗ്രീക്കിലെ പുരുഷലിംഗ ഏകവചനവും മൂലഭാഷയുടെ പ്രയോഗഭംഗിയും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπαναπαήσεται
  choice: വസിക്കും
  rationale: ഒരാളുടെമേൽ വന്നു തങ്ങുക, വിശ്രമിക്കുക എന്ന ദൃശ്യഭാവം ഈ ക്രിയയ്ക്കുണ്ട്. ‘അവന്റെമേൽ വസിക്കും’ എന്നത് സമാധാനം സ്വീകർത്താവിന്റെമേൽ നിലകൊള്ളുന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: നിങ്ങളുടെ സമാധാനം
  rationale: ശിഷ്യന്മാർ ഉച്ചരിക്കുന്ന സമാധാനാശംസയെയോ അനുഗ്രഹത്തെയോ സൂചിപ്പിക്കുന്നു. അതിനെ വെറും ആശംസയായി പരിമിതപ്പെടുത്താതെ ഗ്രീക്കിലെ നേരിട്ടുള്ള ഉടമസ്ഥഘടന നിലനിർത്തുന്നു.
- source_word: εἰ δὲ μήγε
  choice: ഇല്ലെങ്കിൽ
  rationale: ഊന്നലുള്ള നിഷേധവ്യവസ്ഥയെ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀνακάμψει
  choice: മടങ്ങിവരും
  rationale: തിരികെ വരുക, മടങ്ങുക എന്ന അർഥം കൃത്യമായി നൽകുന്നു; സ്വീകർത്താവിൽ തങ്ങാത്ത സമാധാനം അയച്ചവരിലേക്കു മടങ്ങുന്ന ചിത്രം നിലനിർത്തുന്നു.
- source_word: ἐφ’ ὑμᾶς
  choice: നിങ്ങളിലേക്കു
  rationale: പദശഃ ‘നിങ്ങളുടെമേൽ’ എന്നാണെങ്കിലും ‘മടങ്ങിവരും’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ ‘നിങ്ങളിലേക്കു’ എന്നത് സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: അവിടെ ... ഉണ്ടെങ്കിൽ
  rationale: സ്ഥലസൂചനയും വ്യവസ്ഥയും വ്യക്തമായി നിലനിർത്തുന്നു. മുൻവാക്യത്തോടുള്ള καί എന്ന ബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: υἱὸς εἰρήνης എന്ന പുരുഷലിംഗ സെമിറ്റിക് പ്രയോഗം ലിംഗനിരപേക്ഷമാക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘സമാധാനത്തിന്റെ ഒരു മകൻ’ എന്നു നിലനിർത്തുക
  alternative: ‘സമാധാനമുള്ള ഒരാൾ’ അല്ലെങ്കിൽ ‘സമാധാനം സ്വീകരിക്കുന്ന ഒരാൾ’
  rationale: ഗ്രീക്ക് പാഠം പുരുഷലിംഗ ഏകവചനവും സവിശേഷമായ സെമിറ്റിക് പ്രയോഗവും ഉപയോഗിക്കുന്നു. അതിനാൽ ഉറവിടത്തിന്റെ രൂപവും അർഥവ്യാപ്തിയും മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച്, കൂടുതൽ സ്വാഭാവികമായ അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘സമാധാനത്തിന്റെ ഒരു മകൻ’ എന്ന മൂലഭാഷാസ്വഭാവമുള്ള പ്രയോഗം ഉദ്ദേശപൂർവം നിലനിർത്തിയതിനാൽ അതിന്റെ സ്വാഭാവിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
