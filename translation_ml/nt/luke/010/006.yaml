revisions:
- from: അവിടെ സമാധാനത്തിന്റെ ഒരു മകൻ ഉണ്ടെങ്കിൽ[a], നിങ്ങളുടെ സമാധാനം അവന്റെമേൽ വസിക്കും; ഇല്ലെങ്കിൽ, അത് നിങ്ങളിലേക്കു മടങ്ങിവരും.
