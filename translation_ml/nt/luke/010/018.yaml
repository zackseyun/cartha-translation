base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “സാത്താൻ മിന്നൽപോലെ സ്വർഗത്തിൽനിന്നു വീഴുന്നത് ഞാൻ കണ്ടുകൊണ്ടിരുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സാത്താൻ മിന്നൽപോലെ സ്വർഗത്തിൽനിന്നു വീഴുന്നത് ഞാൻ കണ്ടു.” ഗ്രീക്ക് അപൂർണഭൂതകാലക്രിയയെ ലളിതമായി “ഞാൻ കണ്ടു” എന്നും പരിഭാഷപ്പെടുത്താം; “ഞാൻ കണ്ടുകൊണ്ടിരുന്നു” എന്നത് അതിലെ തുടർച്ചാഭാവം കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: δέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധമാണ്; മലയാളത്തിൽ പ്രത്യേകം ‘പിന്നെ’ ചേർത്ത് സമയബന്ധം ശക്തമാക്കാതെ സ്വാഭാവികമായ വാക്യക്രമത്തിലൂടെ ബന്ധം നിലനിർത്തുന്നു. εἶπεν ലളിതമായ ഭൂതകാലമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Ἐθεώρουν
  choice: ഞാൻ കണ്ടുകൊണ്ടിരുന്നു
  rationale: θεωρέω എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപത്തിലുള്ള തുടർച്ചാഭാവം ‘കണ്ടുകൊണ്ടിരുന്നു’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘നോക്കിക്കൊണ്ടിരുന്നു’ എന്നതിനെക്കാൾ ദർശനം/കാണൽ എന്ന അർഥവ്യാപ്തിയും ഇത് നിലനിർത്തുന്നു.
- source_word: τὸν Σατανᾶν
  choice: സാത്താൻ
  rationale: വ്യക്തിപരമായ പേരോ സ്ഥാനനാമമോ ആയി ഉപയോഗിച്ചിരിക്കുന്ന Σατανᾶς എന്നതിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: ὡς ἀστραπὴν
  choice: മിന്നൽപോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്നു
  rationale: οὐρανός എന്നതിന് ‘ആകാശം’ എന്നും അർഥമുണ്ടെങ്കിലും, സാത്താന്റെ വീഴ്ചയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘സ്വർഗം’ ആത്മീയ-പ്രപഞ്ചശാസ്ത്രപരമായ സാധ്യത സംരക്ഷിക്കുന്നു.
- source_word: πεσόντα
  choice: വീഴുന്നത്
  rationale: Σατανᾶν എന്ന കർമത്തെ വിശേഷിപ്പിക്കുന്ന aorist participle-നെ മലയാളത്തിലെ സ്വാഭാവികമായ കർമപൂരകഘടനയായ ‘വീഴുന്നത്’ എന്നു നൽകി; സംഭവത്തെ കാണുന്നതെന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: സാത്താന്റെ വീഴ്ചയെക്കുറിച്ചുള്ള യേശുവിന്റെ പ്രസ്താവനയുടെ കാലപരവും ദൃശ്യപരവുമായ അർഥം
  choice: തുടർച്ചാഭാവത്തോടെ ‘വീഴുന്നത് ഞാൻ കണ്ടുകൊണ്ടിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി; സംഭവം എപ്പോൾ സംഭവിച്ചതാണെന്ന് നിർണ്ണയിച്ചിട്ടില്ല.
  alternative: ‘സാത്താൻ മിന്നൽപോലെ സ്വർഗത്തിൽനിന്നു വീഴുന്നത് ഞാൻ കണ്ടു.’
  rationale: ഗ്രീക്ക് അപൂർണഭൂതകാലം ദർശനത്തിന്റെ തുടരുന്ന സ്വഭാവം സൂചിപ്പിക്കാം; എന്നാൽ ഇത് ആദിമകാലത്തെ വീഴ്ചയെയോ ശിഷ്യന്മാരുടെ അന്നത്തെ ശുശ്രൂഷയെയോ ഭാവിയിലെ പരാജയത്തിന്റെ ദർശനത്തെയോ നിർബന്ധമായി നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
