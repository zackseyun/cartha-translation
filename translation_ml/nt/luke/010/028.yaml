id: LUK.10.28
reference: Luke 10:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Ὀρθῶς ἀπεκρίθης· τοῦτο ποίει καὶ ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “നീ ശരിയായി ഉത്തരം പറഞ്ഞു. ഇത് ചെയ്യുക; നീ ജീവിക്കും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വിശാലമായ സന്ദർഭം നിത്യജീവനെക്കുറിച്ചാണ് (ലൂക്കോസ് 10:25 കാണുക); എന്നാൽ ഇവിടെ ഗ്രീക്കിൽ ‘നീ ജീവിക്കും’ എന്നു മാത്രമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: അവൻ അവനോട് പറഞ്ഞു
  rationale: εἶπεν എന്ന ലളിതമായ ഭൂതകാലക്രിയയും αὐτῷ എന്ന പരോക്ഷകർമവും സ്വാഭാവികമായി പകരുന്നു. δέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകം പദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: Ὀρθῶς
  choice: ശരിയായി
  rationale: ‘കൃത്യമായി/ന്യായമായി’ എന്ന അർഥപരിധിയുള്ള ക്രിയാവിശേഷണം; നൽകിയ ഉത്തരത്തെ വിലയിരുത്തുന്ന സന്ദർഭത്തിൽ ‘ശരിയായി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἀπεκρίθης
  choice: നീ ഉത്തരം പറഞ്ഞിരിക്കുന്നു
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലെ പൂർത്തിയായ മറുപടിയെ, ഇപ്പോഴത്തെ വിലയിരുത്തലുമായി ബന്ധപ്പെടുത്തി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τοῦτο ποίει
  choice: ഇതു ചെയ്യുക
  rationale: τοῦτο മുമ്പ് ഉദ്ധരിച്ച കല്പനയെ സൂചിപ്പിക്കുന്നു. വർത്തമാനകാല ആജ്ഞയായ ποίει തുടർച്ചയായ അനുഷ്ഠാനത്തെ ഉൾക്കൊള്ളാമെങ്കിലും, ‘ഇതു ചെയ്യുക’ ആ അർഥസാധ്യത പരിമിതപ്പെടുത്താതെ ലളിതമായി പകരുന്നു.
- source_word: καὶ ζήσῃ
  choice: നീ ജീവിക്കും
  rationale: ζάωയുടെ ഭാവികാലരൂപത്തെ നേരിട്ട് പകരുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘നിത്യജീവൻ പ്രാപിക്കും’ എന്ന വികസനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ζήσῃ എന്നതിന്റെ വ്യാപ്തിയും നിത്യജീവന്റെ സന്ദർഭവും
  choice: നീ ജീവിക്കും
  alternative: നീ നിത്യജീവൻ പ്രാപിക്കും
  rationale: ലൂക്കോസ് 10:25-ലെ വിശാലസന്ദർഭം നിത്യജീവനെക്കുറിച്ചാണെങ്കിലും, ഈ വാക്യത്തിലെ ഗ്രീക്ക് ‘നീ ജീവിക്കും’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ മുഖ്യപാഠം മൂലത്തിന്റെ സംക്ഷിപ്തതയും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു; സന്ദർഭബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ശരിയായി’, ‘ഇതു ചെയ്യുക’, ‘നീ ജീവിക്കും’ എന്നീ ലളിതരൂപങ്ങൾ മൂലത്തിന്റെ നേരിട്ടുള്ള ശൈലിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
