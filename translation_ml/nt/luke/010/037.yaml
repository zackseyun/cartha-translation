source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അവനോടു കരുണ കാണിച്ചവൻ.” അപ്പോൾ യേശു അവനോടു പറഞ്ഞു: “പോകുക; നീയും അതുപോലെ ചെയ്യുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: അവനോടു കരുണ കാണിച്ചവൻ
  rationale: ‘കരുണ പ്രവർത്തിച്ചവൻ’ എന്ന സ്രോതസ്സിലെ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; τὸ ἔλεος എന്നതിലെ കരുണയും μετ’ αὐτοῦ എന്നതിലെ വ്യക്തിബന്ധവും നിലനിർത്തുന്നു.
- source_word: Πορεύου
  choice: പോകുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ളതും മാന്യവുമായ മലയാള പരിഭാഷ.
- source_word: καὶ σὺ ποίει ὁμοίως
  choice: നീയും അതുപോലെ ചെയ്യുക
  rationale: καὶ σὺ എന്ന ഊന്നൽ ‘നീയും’ എന്നു വ്യക്തമായി നിലനിർത്തുകയും ആവർത്തിതമോ തുടർച്ചയായതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കാവുന്ന ποίει എന്ന ആജ്ഞയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: καὶ σὺ എന്നതിലെ വ്യക്തിപരമായ ഊന്നൽ
  choice: നീയും
  alternative: അതുപോലെ ചെയ്യുക
  rationale: യേശു അഭിഭാഷകനോടു നേരിട്ട് ചുമത്തുന്ന വ്യക്തിപരമായ ആഹ്വാനം ഗ്രീക്കിൽ വ്യക്തമാണ്; അതിനെ ഒഴിവാക്കാതെ പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. ‘പോകുക’, ‘ചെയ്യുക’ എന്നീ രൂപങ്ങൾ dignified direct commands ആയി ഉപയോഗിച്ചു.
