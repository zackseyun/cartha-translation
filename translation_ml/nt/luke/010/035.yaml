- from: 'പിറ്റേന്ന്, അദ്ദേഹം രണ്ടു ദിനാറ നാണയങ്ങൾ[a] എടുത്ത് സത്രക്കാരനു കൊടുത്തിട്ട് പറഞ്ഞു: ‘ഇയാളെ പരിചരിക്കണം. ഇതിലധികം എന്തു ചെലവാക്കിയാലും ഞാൻ മടങ്ങിവരുമ്പോൾ നിനക്കു തിരികെ നൽകാം.’'
  to: 'പിറ്റേന്ന്, അദ്ദേഹം രണ്ടു ദിനാർ നാണയങ്ങൾ[a] എടുത്ത് സത്രക്കാരനു കൊടുത്തിട്ട് പറഞ്ഞു: ‘ഇയാളെ പരിചരിക്കുക. ഇതിനു പുറമെ എന്തു ചെലവായാലും ഞാൻ മടങ്ങിവരുമ്പോൾ നിനക്കു തിരിച്ചുതരും.’'
