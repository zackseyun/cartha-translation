source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: ml
  text: 'പിറ്റേന്ന്, അദ്ദേഹം രണ്ടു ദിനാർ നാണയങ്ങൾ[a] എടുത്ത് സത്രക്കാരനു കൊടുത്തിട്ട് പറഞ്ഞു: ‘ഇയാളെ പരിചരിക്കുക. ഇതിനു പുറമെ എന്തു ചെലവായാലും ഞാൻ മടങ്ങിവരുമ്പോൾ നിനക്കു തിരിച്ചുതരും.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഒരു ദിനാർ അക്കാലത്തെ സാധാരണ റോമൻ വെള്ളിനാണയമായിരുന്നു; അത് ഒരു തൊഴിലാളിയുടെ ഏകദേശം ഒരു ദിവസത്തെ കൂലിക്കു തുല്യമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: പിറ്റേന്ന്
  rationale: തുടർന്നുള്ള ദിവസത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കാലപ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκβαλών
  choice: എടുത്ത്
  rationale: കൈവശമുള്ള പണം പുറത്തെടുത്തതിനെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു; പദത്തിന്റെ അക്ഷരാർഥത്തിലെ അനാവശ്യമായ ബലപ്രയോഗഭാവം ഒഴിവാക്കുന്നു.
- source_word: δύο δηνάρια
  choice: രണ്ടു ദിനാറ നാണയങ്ങൾ
  rationale: ചരിത്രപരമായ നാണയനാമം നിലനിർത്തുകയും മലയാളവായനക്കാർക്ക് ഇത് പണനാണയമാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു; മൂലപാഠത്തെ ‘രണ്ടു ദിവസത്തെ കൂലി’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: πανδοχεῖ
  choice: സത്രക്കാരനു
  rationale: താമസസ്ഥലം നടത്തുകയും അതിഥികളെ നോക്കുകയും ചെയ്യുന്ന വ്യക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; കെട്ടിടത്തെയല്ല.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: ഇയാളെ പരിചരിക്കണം
  rationale: ശ്രദ്ധയോടെയുള്ള തുടർപരിചരണത്തിനുള്ള കൽപ്പന സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: ഇതിലധികം എന്തു ചെലവാക്കിയാലും
  rationale: ഇപ്പോൾ നൽകിയ തുകയ്ക്കു പുറമേ വന്നേക്കാവുന്ന, നിർണയിക്കപ്പെടാത്ത അധികച്ചെലവ് എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: ഞാൻ മടങ്ങിവരുമ്പോൾ
  rationale: ഗ്രീക്കിലെ കാലസൂചക infinitival construction സ്വാഭാവിക മലയാള കാലവാക്യമായി നൽകുന്നു.
- source_word: ἀποδώσω σοι
  choice: നിനക്കു തിരികെ നൽകാം
  rationale: സാമ്പത്തിക സന്ദർഭത്തിലെ തിരിച്ചടയ്ക്കൽ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; അമിതമായ സാങ്കേതികഭാഷ ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ചരിത്രപരമായ നാണയനാമം വിശദീകരണത്തോടുകൂടെ നിലനിർത്തി. നേരിട്ടുള്ള സംഭാഷണത്തിൽ സ്വാഭാവികമായ ഏകവചന അഭിസംബോധന ഉപയോഗിച്ചു.
