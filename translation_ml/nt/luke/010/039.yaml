  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആദ്യത്തെ καί വാക്യബന്ധമായി സ്വാഭാവികമായി ഉൾക്കൊള്ളുകയും ἣ καί എന്നതിനെ ‘അവളും’ എന്നു നൽകുകയും ചെയ്തു. അടിക്കുറിപ്പ് ചിഹ്നം പാഠഭേദം ബാധിക്കുന്ന ‘യേശുവിന്റെ’ എന്ന പദത്തോടു ചേർത്തിരിക്കുന്നു.
