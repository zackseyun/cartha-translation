id: LUK.10.16
reference: Luke 10:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: ml
  text: നിങ്ങളെ കേൾക്കുന്നവൻ എന്നെ കേൾക്കുന്നു; നിങ്ങളെ നിരസിക്കുന്നവൻ[a] എന്നെ നിരസിക്കുന്നു. എന്നാൽ എന്നെ നിരസിക്കുന്നവൻ എന്നെ അയച്ചവനെ നിരസിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘നിരസിക്കുന്നവൻ’ എന്നതിന് ‘അവഗണിക്കുന്നവൻ’ എന്നോ ‘തള്ളിക്കളയുന്നവൻ’ എന്നോ പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: ἀθετέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: കേൾക്കുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ പൊതുവായ, പ്രതിനിധിയായ ഏകവചനരൂപം നിലനിർത്തുന്നു.
- source_word: ὑμῶν / ἐμοῦ
  choice: നിങ്ങളെ / എന്നെ
  rationale: ἀκούω എന്ന ക്രിയയോടൊപ്പമുള്ള വ്യക്തിസൂചക സർവനാമങ്ങളെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘വാക്ക്’ അല്ലെങ്കിൽ ‘സന്ദേശം’ ചേർത്തിട്ടില്ല.
- source_word: ἀκούει
  choice: കേൾക്കുന്നു
  rationale: ἀκούων എന്ന പദവുമായുള്ള ആവർത്തനം നിലനിർത്തുകയും കേൾക്കുന്നതും സ്വീകരിക്കുന്നതും ഉൾക്കൊള്ളാവുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἀθετῶν / ἀθετεῖ
  choice: നിരസിക്കുന്നവൻ / നിരസിക്കുന്നു
  rationale: ἀθετέω എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ വ്യക്തിബന്ധപരമായ അർഥം വ്യക്തമായി നൽകുന്നു; ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനവും സൂക്ഷിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: അവസാന വാക്യഭാഗത്തിലേക്കുള്ള മൃദുവായ വൈരുധ്യവും ആശയത്തിന്റെ ഉച്ചകോടിയിലേക്കുള്ള പുരോഗതിയും സൂചിപ്പിക്കുന്നു.
- source_word: τὸν ἀποστείλαντά με
  choice: എന്നെ അയച്ചവനെ
  rationale: നാമവാചകമായി ഉപയോഗിച്ച ഭൂതകാല കൃദന്തത്തെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; മൂലത്തിൽ ഇല്ലാത്ത ‘പിതാവ്’ എന്ന വ്യക്തമായ തിരിച്ചറിയൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: യേശുവും അവൻ നിയോഗിച്ച ദൂതന്മാരും തമ്മിലുള്ള പ്രതിനിധിബന്ധം
  choice: ശിഷ്യന്മാരെ കേൾക്കുന്നതും നിരസിക്കുന്നതും യേശുവിനെ കേൾക്കുന്നതും നിരസിക്കുന്നതുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്ന വ്യക്തിപരമായ ശൃംഖല നിലനിർത്തി.
  alternative: ഇത് ശിഷ്യന്മാരുടെ സന്ദേശം കേൾക്കുകയോ നിരസിക്കുകയോ ചെയ്യുന്നതായി പരാവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം ‘നിങ്ങൾ’, ‘ഞാൻ’ എന്നീ വ്യക്തിസൂചക സർവനാമങ്ങളാണ് ഉപയോഗിക്കുന്നത്; ‘സന്ദേശം’ അല്ലെങ്കിൽ ‘ഉപദേശം’ എന്ന അമൂർത്ത നാമങ്ങൾ ഉപയോഗിക്കുന്നില്ല.
- issue: ‘എന്നെ അയച്ചവൻ’ എന്നതിന്റെ സൂചിത വ്യക്തി
  choice: ‘എന്നെ അയച്ചവൻ’ എന്ന സൂചന മൂലപാഠത്തിലെന്നപോലെ പരോക്ഷമായി നിലനിർത്തി.
  alternative: ‘എന്നെ അയച്ച പിതാവ്’ എന്ന് വ്യക്തമായി ചേർക്കുക.
  rationale: സന്ദർഭത്തിൽ ഇത് ദൈവപിതാവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ ഗ്രീക്ക് പാഠം ‘പിതാവ്’ എന്നു പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ഗ്രീക്ക് പാഠത്തിലെ വ്യക്തിപരമായ സർവനാമങ്ങളും ‘കേൾക്കുന്നു/നിരസിക്കുന്നു’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചു; അർഥവ്യാഖ്യാനമായി ‘സന്ദേശം’ അല്ലെങ്കിൽ ‘പിതാവ്’ ചേർത്തിട്ടില്ല.
