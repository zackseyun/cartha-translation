  terminology: “പ്രവാചകന്മാരും രാജാക്കന്മാരും” is accurate and established. “ആഗ്രഹിച്ചു” appropriately renders ἠθέλησαν. The lexical-alternative footnote is sound and its anchor is correctly placed.
  issues:
