id: LUK.10.24
reference: Luke 10:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ml
  text: 'കാരണം, ഞാൻ നിങ്ങളോടു പറയുന്നു: അനേകം പ്രവാചകന്മാരും രാജാക്കന്മാരും നിങ്ങൾ കാണുന്നതു കാണാനും നിങ്ങൾ കേൾക്കുന്നതു കേൾക്കാനും ആഗ്രഹിച്ചു; എന്നാൽ അവർ അതു കണ്ടില്ല, അതു കേട്ടതുമില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാണാനും കേൾക്കാനും മോഹിച്ചു” അല്ലെങ്കിൽ “കാണാനും കേൾക്കാനും കൊതിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: കാരണം, ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: λέγω with the dative is naturally expressed as ‘ഞാൻ നിങ്ങളോടു പറയുന്നു’; γάρ retains the explanatory link with the preceding beatitude through ‘കാരണം’.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: അനേകം പ്രവാചകന്മാരും രാജാക്കന്മാരും
  rationale: Preserves both historical categories directly and uses a dignified, familiar Malayalam quantitative expression.
- source_word: ἠθέλησαν
  choice: ആഗ്രഹിച്ചു
  rationale: Conveys θέλω as earnest desire without intensifying it to an explicit sense of deep longing.
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: നിങ്ങൾ കാണുന്നതു കാണാൻ
  rationale: Preserves the lexical distinction in Greek only as far as natural Malayalam permits; both verbs denote seeing here, and the relative construction is rendered idiomatically.
- source_word: καὶ οὐκ εἶδαν
  choice: എങ്കിലും അവർ അതു കണ്ടില്ല
  rationale: Makes the understood subject and object explicit for clear Malayalam while preserving the contrast and historical non-attainment.
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: നിങ്ങൾ കേൾക്കുന്നതു കേൾക്കാനും അവർ ആഗ്രഹിച്ചു; എങ്കിലും അവർ അതു കേട്ടില്ല
  rationale: Maintains the parallelism between seeing and hearing; repeats ‘ആഗ്രഹിച്ചു’ for natural clarity though it is supplied from the governing Greek verb.
theological_decisions:
- issue: ‘പ്രവാചകന്മാരും രാജാക്കന്മാരും’ എന്നവരുടെ തിരിച്ചറിയൽ
  choice: ചരിത്രപരമായ വിഭാഗങ്ങൾ വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തുന്നു.
  alternative: ‘പണ്ടത്തെ പ്രവാചകന്മാരും രാജാക്കന്മാരും’ അല്ലെങ്കിൽ ‘പ്രവാചകന്മാരും ഭരണാധികാരികളും’
  rationale: Greek text says ‘prophets and kings’ without adding ‘of old’ or broadening kings to rulers. The translation therefore preserves the contrast with the disciples without resolving the referents further.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കാരണം’ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സൂക്ഷിക്കുന്നു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു സമാന്തര ഘടകങ്ങളായി വിരാമചിഹ്നങ്ങളാൽ ക്രമപ്പെടുത്തി; അർത്ഥബന്ധം മാറ്റിയിട്ടില്ല.
