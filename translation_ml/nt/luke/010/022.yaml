revisions:
- from: എല്ലാം എന്റെ പിതാവ് എനിക്ക് ഏൽപ്പിച്ചിരിക്കുന്നു[a]. പുത്രൻ ആരാണെന്ന് പിതാവല്ലാതെ ആരും അറിയുന്നില്ല; പിതാവ് ആരാണെന്ന് പുത്രനും പുത്രൻ ആർക്കു പിതാവിനെ വെളിപ്പെടുത്താൻ ഇച്ഛിക്കുന്നുവോ അയാളുമല്ലാതെ ആരും അറിയുന്നില്ല[b].
  to: എല്ലാം എന്റെ പിതാവ് എനിക്ക് ഏൽപ്പിച്ചിരിക്കുന്നു[a]. പിതാവല്ലാതെ പുത്രൻ ആരാണെന്ന് ആരും അറിയുന്നില്ല; പുത്രനും, പുത്രൻ പിതാവിനെ വെളിപ്പെടുത്താൻ ഇച്ഛിക്കുന്ന[b] വ്യക്തിയും അല്ലാതെ പിതാവ് ആരാണെന്ന് ആരും അറിയുന്നില്ല.
  rationale: This revision makes only stylistic and footnote-anchor adjustments. It retains the source’s passive-transfer sense through a natural Malayalam active construction, the two exclusive-knowledge clauses, the singular indefinite recipient, and the Son’s unsoftened volitional agency in revelation.
