id: LUK.10.22
reference: Luke 10:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ml
  text: എല്ലാം എന്റെ പിതാവ് എനിക്ക് ഏൽപ്പിച്ചിരിക്കുന്നു[a]. പിതാവല്ലാതെ പുത്രൻ ആരാണെന്ന് ആരും അറിയുന്നില്ല; പുത്രനും, പുത്രൻ പിതാവിനെ വെളിപ്പെടുത്താൻ ഇച്ഛിക്കുന്ന[b] വ്യക്തിയും അല്ലാതെ പിതാവ് ആരാണെന്ന് ആരും അറിയുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘സകലവും എന്റെ പിതാവ് എനിക്ക് ഏൽപ്പിച്ചിരിക്കുന്നു.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ഇച്ഛിക്കുന്ന’ എന്നതിന് ‘തിരഞ്ഞെടുക്കുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: എല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചനമായ ഈ പദത്തിന്റെ സമഗ്രമായ വ്യാപ്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘സകലവും’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകും.
- source_word: παρεδόθη
  choice: ഏൽപ്പിച്ചിരിക്കുന്നു
  rationale: παραδίδωμι എന്ന ക്രിയയുടെ കൈമാറ്റം/ഏൽപ്പിക്കൽ എന്ന അടിസ്ഥാനാർഥവും പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലവും ഈ രൂപം പ്രകടമാക്കുന്നു; ‘ഭരമേൽപ്പിച്ചു’ എന്ന് പറഞ്ഞ് പരിപാലനച്ചുമതലയുടെ ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: എന്റെ പിതാവ് എനിക്ക്
  rationale: കർമണിപ്രയോഗത്തിലെ വ്യക്തിപരമായ കർത്താവിനെ ὑπό + genitive സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക കർത്തരിപ്രയോഗത്തിലേക്ക് മാറ്റിയെങ്കിലും പിതാവാണ് ഏൽപ്പിച്ചതെന്ന കർത്തൃത്വം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: γινώσκει
  choice: അറിയുന്നില്ല
  rationale: അറിയുക എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ അതുല്യമായ പരസ്പരജ്ഞാനം സൂചിപ്പിച്ചാലും ‘പൂർണമായി അറിയുന്നു’ എന്ന വ്യാഖ്യാനപരമായ തീവ്രത ചേർത്തിട്ടില്ല.
- source_word: τίς ἐστιν ὁ υἱὸς / τίς ἐστιν ὁ πατήρ
  choice: പുത്രൻ ആരാണെന്ന് / പിതാവ് ആരാണെന്ന്
  rationale: വ്യക്തിപരവും ബന്ധപരവുമായ ‘ആരാണ്’ എന്ന ചോദ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; ‘യഥാർഥത്തിൽ ആരാണ്’ പോലുള്ള വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: ὁ υἱός / ὁ πατήρ
  choice: പുത്രൻ / പിതാവ്
  rationale: സന്ദർഭത്തിലെ സവിശേഷമായ ക്രിസ്തുശാസ്ത്രപരവും ബന്ധപരവുമായ സ്ഥാനപ്പേരുകൾ മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: പുത്രൻ ആർക്കു പിതാവിനെ വെളിപ്പെടുത്താൻ ഇച്ഛിക്കുന്നുവോ അയാൾ
  rationale: സ്വീകർത്താവിനെ അനിശ്ചിതമായി സൂചിപ്പിക്കുന്ന ᾧ ἐάν എന്ന ഘടനയും പുത്രന്റെ ഇച്ഛയും വെളിപ്പെടുത്തുന്ന പ്രവർത്തനവും നിലനിർത്തുന്നു. മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാകുന്ന പിതാവിനെ മലയാളത്തിലെ വ്യക്തതയ്ക്കായി കർമമായി വ്യക്തമാക്കുന്നു.
- source_word: βούληται
  choice: ഇച്ഛിക്കുന്നുവോ
  rationale: പുത്രന്റെ നിർണായകമായ മനസ്സും ഇച്ഛയും ഔപചാരികതയില്ലാതെ വ്യക്തമാക്കുന്നു. ‘ആഗ്രഹിക്കുന്നു’ എന്നതിനെക്കാൾ തീരുമാനാത്മകമായ ഭാവം ഇതിലുണ്ട്; ‘തിരഞ്ഞെടുക്കുന്നു’ എന്നത് മലയാളത്തിൽ സ്വീകർത്താവിനെ തിരഞ്ഞെടുക്കുന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാൻ ഇടയുണ്ട്.
- source_word: ἀποκαλύψαι
  choice: വെളിപ്പെടുത്താൻ
  rationale: ദൈവിക വെളിപ്പെടുത്തലിന്റെ അർഥഭാരവും സാധാരണ വായനാസൗകര്യവും ഒരുമിച്ച് സംരക്ഷിക്കുന്ന പതിവായ മലയാള പദമാണ്.
theological_decisions:
- issue: പിതാവും പുത്രനും തമ്മിലുള്ള അതുല്യമായ പരസ്പരജ്ഞാനം
  choice: ‘ആരും അറിയുന്നില്ല ... അല്ലാതെ’ എന്ന വാക്യഘടന നേരിട്ട് നിലനിർത്തി.
  alternative: ‘പൂർണമായി അറിയുന്നില്ല’ അല്ലെങ്കിൽ ‘യഥാർഥമായി അറിയുന്നില്ല’ എന്നു തീവ്രമാക്കുക.
  rationale: വാക്യം പിതാവിന്റെയും പുത്രന്റെയും സവിശേഷമായ പരസ്പരജ്ഞാനം ശക്തമായി പ്രഖ്യാപിക്കുന്നു. എന്നാൽ γινώσκει എന്ന പദത്തിൽ ഇല്ലാത്ത വിശേഷണം ചേർക്കാതെ അതിന്റെ ദൈവശാസ്ത്രഭാരം വാക്യഘടനയിലൂടെ തന്നെ നിലനിർത്തുന്നു.
- issue: വെളിപ്പെടുത്തുന്നതിലുള്ള പുത്രന്റെ ഇച്ഛയും കർത്തൃത്വവും
  choice: ‘പുത്രൻ ... ഇച്ഛിക്കുന്നുവോ’ എന്നു നൽകി പുത്രന്റെ നിർണായക കർത്തൃത്വം സംരക്ഷിച്ചു.
  alternative: ‘ആഗ്രഹിക്കുന്നുവോ’, ‘തിരഞ്ഞെടുക്കുന്നുവോ’, അല്ലെങ്കിൽ പുത്രന്റെ കർത്തൃത്വം മൃദൂകരിക്കുന്ന പരാവർത്തനം.
  rationale: ഗ്രീക്ക് വാചകം പിതാവിനെ വെളിപ്പെടുത്തുന്നവനായി പുത്രനെ അവതരിപ്പിക്കുകയും ആ വെളിപ്പെടുത്തൽ പുത്രന്റെ ഇച്ഛയുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു. ഇതിനെ ഏതെങ്കിലും സിദ്ധാന്തവ്യവസ്ഥയിലേക്ക് വിപുലീകരിക്കാതെയും മൃദൂകരിക്കാതെയും പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘമായ സമാന്തരഘടന വായനാസൗകര്യത്തിനായി അർദ്ധവിരാമത്തോടെ നിലനിർത്തി. കർമണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തരിപ്രയോഗമാക്കിയെങ്കിലും പിതാവിന്റെ കർത്തൃത്വവും പുത്രന് ലഭിച്ച സമഗ്രമായ കൈമാറ്റവും മാറ്റിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
