  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: ml
  text: അതുപോലെ, ഒരു ലേവ്യനും ആ സ്ഥലത്തെത്തി[a]. അയാളെ കണ്ടപ്പോൾ, മറുവശത്തുകൂടി കടന്നുപോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ സ്ഥലത്ത് വന്നു’ എന്നോ ‘ആ ഇടത്തെത്തി’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ക്രിയയെ ‘കടന്നുപോയി’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്താനാകും; എന്നാൽ അതിന്റെ സംയുക്തരൂപം എതിർവശത്തുകൂടി ഒഴിഞ്ഞു കടന്നുപോയെന്ന ആശയം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: അതുപോലെ
  rationale: മുമ്പ് പറഞ്ഞ പുരോഹിതന്റെ പ്രവൃത്തിയോടു ലേവ്യന്റെ പ്രവൃത്തിയെ താരതമ്യപ്പെടുത്തുന്ന ക്രിയാവിശേഷണത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ഇത് മൃദുവായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിലെ വാക്യക്രമവും വിരാമചിഹ്നവും അതിന്റെ ബന്ധകശക്തി മതിയായവിധം അറിയിക്കുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: പുരോഹിതനോടൊപ്പം മറ്റൊരു സമാന്തര ഉദാഹരണമായി ലേവ്യനെ ചേർക്കുന്ന അർഥം നൽകുന്നു.
- source_word: Λευίτης
  choice: ഒരു ലേവ്യൻ
  rationale: യഹൂദരുടെ ചരിത്രപരവും മതപരവുമായ ഈ വിഭാഗനാമം വിശദീകരിച്ചു പൊതുവൽക്കരിക്കാതെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: κατὰ τὸν τόπον ἐλθὼν
  choice: ആ സ്ഥലത്തെത്തി
  rationale: സംഭവം നടന്ന സ്ഥലത്തേക്കോ അതിനരികിലേക്കോ ലേവ്യൻ വന്നെത്തിയെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മുൻസന്ദർഭത്തിലെ നിർദിഷ്ട സ്ഥലം ‘ആ’ എന്നതിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: ἰδὼν
  choice: അയാളെ കണ്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ദർശനത്തെ സമയബന്ധമായി വ്യക്തമാക്കുന്നു; കർമം മുൻസന്ദർഭത്തിൽനിന്ന് ‘അയാളെ’ എന്നു പൂരിപ്പിക്കുന്നു.
- source_word: ἀντιπαρῆλθεν
  choice: മറുവശത്തുകൂടി കടന്നുപോയി
  rationale: വെറുതെ കടന്നുപോകുന്നതിലുപരി എതിർവശത്തേക്കു മാറി ഒഴിഞ്ഞുപോകുന്ന സംയുക്തക്രിയയുടെ സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: Λευίτης എന്ന സാമൂഹിക-മതപരമായ തിരിച്ചറിയൽ
  choice: ലേവ്യൻ എന്ന വിഭാഗനാമം നിലനിർത്തി
  alternative: ദേവാലയശുശ്രൂഷകൻ; ലേവി ഗോത്രക്കാരൻ
  rationale: പുരോഹിതനോടു സമാന്തരമായി കഥയിൽ വരുന്ന വ്യക്തിയുടെ ചരിത്രപരമായ തിരിച്ചറിയൽ സംരക്ഷിക്കുകയും മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യവാചകത്തിലേക്ക് ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ἀντιπαρῆλθεν എന്ന ക്രിയയിലെ ഒഴിവാക്കലിന്റെ സൂചന
  choice: മറുവശത്തുകൂടി കടന്നുപോയി
  alternative: കടന്നുപോയി
  rationale: സംയുക്തക്രിയ സൂചിപ്പിക്കുന്ന എതിർവശത്തുകൂടിയുള്ള കടന്നുപോക്ക് പ്രകടമാക്കുന്നു; എന്നാൽ വ്യക്തിയുടെ ഉള്ളിലെ ഉദ്ദേശ്യം മുഖ്യവാചകത്തിൽ അധികമായി നിർവചിക്കുന്നില്ല.
