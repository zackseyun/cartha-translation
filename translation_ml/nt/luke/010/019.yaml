id: LUK.10.19
reference: Luke 10:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: ml
  text: ഇതാ, പാമ്പുകളുടെയും തേളുകളുടെയും മേൽ ചവിട്ടാനും ശത്രുവിന്റെ സകല ശക്തിയുടെയും മേൽ അധികാരവും ഞാൻ നിങ്ങൾക്കു നൽകിയിരിക്കുന്നു; ഒന്നും ഒരുവിധത്തിലും നിങ്ങളെ ഉപദ്രവിക്കുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒന്നും ഒരുവിധത്തിലും നിങ്ങളെ ഹാനിപ്പെടുത്തുകയില്ല” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ ഇവിടെ അതിശക്തമായ നിഷേധപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരസൂചകത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δέδωκα
  choice: നൽകിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണകാലഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: തുടർന്ന് വരുന്ന δύναμις എന്ന ‘ശക്തി’യിൽനിന്നുള്ള പദാർഥവ്യത്യാസം നിലനിർത്തുകയും ലഭിച്ച അധികാരത്തെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων
  choice: പാമ്പുകളുടെയും തേളുകളുടെയും മേൽ ചവിട്ടിനടക്കാൻ
  rationale: ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് πατεῖν എന്നതിന്റെ ചവിട്ടുക/നടക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ
  choice: ശത്രുവിന്റെ സകല ശക്തിയുടെയും മേൽ അധികാരം പ്രയോഗിക്കാൻ
  rationale: ἐξουσίαയും δύναμιςഉം തമ്മിലുള്ള ‘അധികാരം–ശക്തി’ വ്യത്യാസം സംരക്ഷിച്ച്, രണ്ടാമത്തെ ἐπί സൂചിപ്പിക്കുന്ന മേൽക്കോയ്മ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: οὐδὲν ὑμᾶς οὐ μὴ ἀδικήσῃ
  choice: ഒന്നും ഒരുവിധത്തിലും നിങ്ങളെ ഉപദ്രവിക്കുകയില്ല
  rationale: οὐδέν സഹിതമുള്ള οὐ μή എന്ന ശക്തമായ നിഷേധം ‘ഒരുവിധത്തിലും’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ശത്രു’ എന്നതിന്റെ സൂചിത വ്യക്തി
  choice: മുഖ്യവാചകത്തിൽ ‘ശത്രു’ എന്നു മാത്രം നിലനിർത്തി.
  alternative: സാത്താൻ; പിശാച്
  rationale: സന്ദർഭം സാത്താനിക എതിർപ്പിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും ഗ്രീക്ക് വാചകം τοῦ ἐχθροῦ (‘ശത്രുവിന്റെ’) എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ സൂചിത വ്യക്തിയെ വിവർത്തനത്തിൽ നിർണ്ണയിച്ചിട്ടില്ല.
- issue: 'പാമ്പുകളും തേളുകളും: അക്ഷരാർഥമോ പ്രതീകമോ'
  choice: മുഖ്യവാചകത്തിൽ ദൃശ്യബിംബം അക്ഷരാർഥത്തിൽ നിലനിർത്തി.
  alternative: ദുഷ്ടാത്മശക്തികളുടെ പ്രതീകം; അക്ഷരാർഥവും പ്രതീകാർഥവും ചേർന്ന ബിംബം
  rationale: പദങ്ങൾ നേരിട്ട് പാമ്പുകളെയും തേളുകളെയും സൂചിപ്പിക്കുന്നു; എന്നാൽ സന്ദർഭം ശത്രുതാപരമായ ആത്മീയ ശക്തികളെയും ഓർമിപ്പിക്കാം. വിവർത്തനം ഈ വ്യാഖ്യാനസാധ്യത തുറന്നുവെക്കുന്നു.
- issue: ദോഷം സംഭവിക്കില്ലെന്ന ഉറപ്പിന്റെ വ്യാപ്തി
  choice: ഗ്രീക്കിലെ ശക്തമായ നിഷേധം ‘ഒന്നും ഒരുവിധത്തിലും ... ഉപദ്രവിക്കുകയില്ല’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: സാധാരണ ജീവിതത്തിൽ ഒരു ശാരീരിക ദോഷവും ഒരിക്കലും സംഭവിക്കില്ലെന്ന സർവസാധാരണ വാഗ്ദാനമായി വിശദീകരിക്കുക
  rationale: വാചകത്തിന്റെ ഊന്നൽ സംരക്ഷിച്ചെങ്കിലും അതിന്റെ പ്രയോഗപരിധിയെക്കുറിച്ചുള്ള വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അധികാരം’–‘ശക്തി’ എന്ന പദവ്യത്യാസം മനപ്പൂർവം നിലനിർത്തി. ‘ചവിട്ടിനടക്കുക’ ദൃശ്യബിംബം വ്യക്തമായി നൽകുന്നു; ‘മെതിക്കുക’ എന്നത് അനാവശ്യമായി തീവ്രമാകുന്നതിനാൽ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
