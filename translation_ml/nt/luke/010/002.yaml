- from: 'അവൻ അവരോടു പറഞ്ഞു: “കൊയ്ത്ത് ധാരാളം; വേലക്കാരോ ചുരുക്കം. അതുകൊണ്ട്, തന്റെ കൊയ്ത്തിലേക്കു വേലക്കാരെ അയച്ചിറക്കണമെന്ന്[a] കൊയ്ത്തിന്റെ കർത്താവിനോടു പ്രാർഥിക്കുവിൻ.”'
  to: 'അവൻ അവരോടു പറഞ്ഞു: “കൊയ്ത്ത് ധാരാളം; വേലക്കാരോ ചുരുക്കം. അതുകൊണ്ട്, തന്റെ കൊയ്ത്തിലേക്കു വേലക്കാരെ അയച്ചുവിടണമെന്ന്[a] കൊയ്ത്തിന്റെ കർത്താവിനോടു പ്രാർഥിക്കുവിൻ.”'
  rationale: മൂലവാക്യത്തിന്റെ രൂപകവും ആജ്ഞാസ്വരവും നിലനിർത്തിക്കൊണ്ട്, ἐκβάλῃയുടെ വിവർത്തനം ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായ ‘അയച്ചുവിടുക’ എന്നു തിരുത്തി. ക്രിയയുടെ ശക്തമായ അർഥസാധ്യത പാഠത്തിലേക്ക് അതിരുകടന്ന് ചേർക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
