id: LUK.10.2
reference: Luke 10:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “കൊയ്ത്ത് ധാരാളം; വേലക്കാരോ ചുരുക്കം. അതുകൊണ്ട്, തന്റെ കൊയ്ത്തിലേക്കു വേലക്കാരെ അയച്ചുവിടണമെന്ന്[a] കൊയ്ത്തിന്റെ കർത്താവിനോടു പ്രാർഥിക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പുറത്തേക്കു ശക്തമായി അയച്ചുവിടണമെന്ന്’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് വെറും ‘അയയ്ക്കുക’ എന്നതിനെക്കാൾ ശക്തമായ അർഥം ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ അപൂർണഭൂതകാല ക്രിയയെ സ്വാഭാവികമായ മലയാളത്തിൽ സാധാരണ ഭൂതകാലമായി നൽകി; ആവർത്തനമോ തുടർച്ചയോ ഇവിടെ പ്രത്യേകം ഊന്നേണ്ടതില്ല.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തില്ല
  rationale: ഇവിടെ ഇത് നേരിയ ആഖ്യാനബന്ധകമാണ്; ‘അവൻ അവരോടു പറഞ്ഞു’ എന്ന മലയാളവാക്യത്തിന്റെ ഒഴുക്കിൽ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: θερισμός
  choice: കൊയ്ത്ത്
  rationale: കാർഷികരൂപകത്തെയും അതിന്റെ വിപുലമായ അർഥസാധ്യതയെയും ഒരുപോലെ നിലനിർത്തുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: πολύς
  choice: ധാരാളം
  rationale: കൊയ്ത്തിന്റെ സമൃദ്ധിയെ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐργάται
  choice: വേലക്കാർ
  rationale: കൊയ്ത്തുവേല ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന വ്യക്തവും പൊതുവായി മനസ്സിലാകുന്നതുമായ പദം.
- source_word: ὀλίγοι
  choice: ചുരുക്കം
  rationale: ‘ധാരാളം’ എന്നതിനോടുള്ള വൈരുധ്യം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: δεήθητε
  choice: പ്രാർഥിക്കുവിൻ
  rationale: ആത്മാർഥമായ അപേക്ഷ ഉൾക്കൊള്ളുന്ന ആജ്ഞാരൂപം മതപരമായ സന്ദർഭത്തിന് യോജിച്ച മാന്യമായ മലയാളത്തിൽ നൽകി.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപ്രസ്താവനയിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: അധികാരം, ഉടമസ്ഥത, ദൈവിക പ്രതിധ്വനി എന്നിവ നിലനിർത്തുന്ന സ്ഥാപിത മലയാളപ്രയോഗം.
- source_word: ὅπως
  choice: എന്ന്
  rationale: പ്രാർഥനയുടെ ഉള്ളടക്കം സ്വാഭാവികമായ മലയാള പരോക്ഷവാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐκβάλῃ
  choice: അയച്ചിറക്കുക
  rationale: വെറും ‘അയയ്ക്കുക’ എന്നതിനെക്കാൾ ശക്തമായ പുറത്തേക്കുള്ള നിയോഗസൂചന നൽകുന്നു; മൂലക്രിയയുടെ കൂടുതൽ ശക്തമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: തന്റെ കൊയ്ത്തിലേക്കു
  rationale: ഉടമസ്ഥതയും ‘അകത്തേക്ക്’ എന്ന ദിശാസൂചനയും നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘വയൽ’ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ‘കൊയ്ത്തിന്റെ കർത്താവ്’ എന്ന വിശേഷണത്തിന്റെ സൂചിതവ്യക്തിയും ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും
  choice: ‘കൊയ്ത്തിന്റെ കർത്താവ്’ എന്ന രൂപകം വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: ഇത് ദൈവത്തെ നേരിട്ട് വ്യാഖ്യാനിക്കുന്നതായോ യേശുവിന്റെ ദൈവിക അധികാരത്തെ പരോക്ഷമായി പ്രഖ്യാപിക്കുന്നതായോ വികസിപ്പിക്കുക.
  rationale: കൊയ്ത്തിന്റെ ഉടമയും വേലക്കാരെ നിയോഗിക്കുന്ന അധികാരിയുമായ ഒരാളെ വാക്യം അവതരിപ്പിക്കുന്നുവെങ്കിലും, ഇവിടെ സൂചിതവ്യക്തിയെയോ ക്രിസ്തുശാസ്ത്രപരമായ പ്രത്യാഘാതത്തെയോ തുറന്നു വിശദീകരിക്കുന്നില്ല; അതിനാൽ ഉള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു വ്യക്തമായതും തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച മാന്യതയുള്ളതുമായ ശൈലി. ‘പ്രാർഥിക്കുവിൻ’ എന്ന രൂപം ഗൗരവമുള്ള ബഹുവചന ആജ്ഞ നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാവിഭാഗസവിശേഷ പദങ്ങൾ ഒഴിവാക്കി.
