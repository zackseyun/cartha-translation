  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: ml
  text: ഇതിനുശേഷം, കർത്താവ് മറ്റു എഴുപത്തിരണ്ടുപേരെക്കൂടി[a] നിയമിച്ചു; താൻതന്നെ ചെല്ലാനിരുന്ന എല്ലാ പട്ടണങ്ങളിലേക്കും സ്ഥലങ്ങളിലേക്കും അവരെ രണ്ടുപേർ വീതം തനിക്കു മുമ്പായി അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘എഴുപത്തിരണ്ട്’ എന്നതിനുപകരം ‘എഴുപത്’ എന്നു കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: ഇതിനുശേഷം
  rationale: ബഹുവചന സൂചനയുടെ കാലക്രമപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἀνέδειξεν
  choice: നിയമിച്ച്
  rationale: വെളിപ്പെടുത്തുക എന്നതിലുപരി ഒരു ദൗത്യത്തിനായി ആളുകളെ നിയോഗിക്കുന്ന അർഥം സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവായ ബൈബിൾ മലയാള പരിഭാഷ; ഇവിടെ യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: വേറെ എഴുപത്തിരണ്ടുപേരെക്കൂടി
  rationale: ἑτέρους എന്നതിലെ ‘മറ്റുള്ളവർ/കൂടുതൽ പേർ’ എന്ന ആശയവും καί എന്നതിലെ കൂട്ടിച്ചേർക്കലും നിലനിർത്തുന്നു; SBLGNT-യിലെ എഴുപത്തിരണ്ട് എന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു.
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: അപ്പോസ്തലികമായ പ്രത്യേക അർഥം അനാവശ്യമായി ചേർക്കാതെ പ്രവർത്തിയെ നേരിട്ട് പറയുന്നു.
- source_word: ἀνὰ δύο δύο
  choice: ഈരണ്ടുപേരായി
  rationale: വിതരണാർഥമുള്ള ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘രണ്ടുപേർ വീതം’ എന്ന അർഥത്തോടെ നൽകുന്നു.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: തനിക്കു മുമ്പേ
  rationale: അവന്റെ വരവിനു മുന്നോടിയായി എന്ന തയ്യാറെടുപ്പിന്റെ ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: എല്ലാ പട്ടണങ്ങളിലേക്കും സ്ഥലങ്ങളിലേക്കും
  rationale: πόλις, τόπος എന്നീ രണ്ടു നാമങ്ങളും ലയിപ്പിക്കാതെ നിലനിർത്തുന്നു; ‘പട്ടണം’ ഈ സഞ്ചാരദൗത്യത്തിന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമാണ്.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: താൻ ചെല്ലാനിരുന്ന
  rationale: μέλλω സൂചിപ്പിക്കുന്ന അടുത്ത ഭാവി/ഉദ്ദേശ്യം നൽകുകയും αὐτός എന്ന ഊന്നൽ ‘താൻ’ വഴി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നിയമിക്കപ്പെട്ടവരുടെ എണ്ണത്തിലെ പാഠഭേദം
  choice: എഴുപത്തിരണ്ട്
  alternative: എഴുപത്
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ ἑβδομήκοντα δύο (‘എഴുപത്തിരണ്ട്’) എന്നാണ്. പ്രധാനപ്പെട്ട ‘എഴുപത്’ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു; ഇത് സിദ്ധാന്തപരമല്ല, പാഠവിമർശനപരമായ വിഷയമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ പ്രവാഹം പാലിച്ചുകൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം സ്വീകരിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട എണ്ണത്തിനുപിന്നാലെയല്ലാതെ വാക്യാവസാനത്ത് വെച്ചിട്ടുണ്ടെങ്കിലും പാഠഭേദം വ്യക്തമായി വിവരിക്കുന്നു.
