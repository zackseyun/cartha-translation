- from: ഇതിനുശേഷം കർത്താവ് വേറെ എഴുപത്തിരണ്ടുപേരെക്കൂടി നിയമിച്ച്, താൻ ചെല്ലാനിരുന്ന എല്ലാ പട്ടണങ്ങളിലേക്കും സ്ഥലങ്ങളിലേക്കും അവരെ ഈരണ്ടുപേരായി തനിക്കു മുമ്പേ അയച്ചു.[a]
