id: LUK.10.42
reference: Luke 10:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: ml
  text: എന്നാൽ കുറച്ചു കാര്യങ്ങൾ മാത്രമേ ആവശ്യമുള്ളൂ—അല്ലെങ്കിൽ ഒന്നു മാത്രം.[a] മറിയം നല്ല ഓഹരി[b] തിരഞ്ഞെടുത്തിരിക്കുന്നു; അത് അവളിൽനിന്ന് എടുത്തുകളയപ്പെടുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരേയൊരു കാര്യം മാത്രമാണ് ആവശ്യം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഭക്ഷണസന്ദർഭത്തിൽ കൂടുതൽ വ്യക്തമായി, ‘കുറച്ചു വിഭവങ്ങൾ മതി—അല്ലെങ്കിൽ ഒന്നു മാത്രം’ എന്നും ഗ്രീക്ക് വാചകം മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘നല്ല പങ്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന പദം ഭക്ഷണത്തിലെ ഒരു ഓഹരിയെയും യഥാർഥത്തിൽ വിലയേറിയതിലുള്ള ആലങ്കാരിക പങ്കിനെയും ഒരേസമയം സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων δέ ἐστιν χρεία ἢ ἑνός
  choice: എന്നാൽ കുറച്ചു കാര്യങ്ങൾ മാത്രമേ ആവശ്യമുള്ളൂ—അല്ലെങ്കിൽ ഒന്നു മാത്രം
  rationale: ἐστιν χρεία എന്ന പ്രയോഗത്തിന്റെ ആവശ്യകതാസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ὀλίγων എന്ന ബഹുവചനവും ἢ ἑνός എന്ന ഏകവചനവുമായുള്ള ചുരുക്കിയ വൈരുധ്യം നിലനിർത്തുന്നു; ഭക്ഷണവിഭവങ്ങളെയാണോ ഒരേയൊരു അത്യാവശ്യകാര്യത്തെയാണോ ഉദ്ദേശിക്കുന്നതെന്ന് മുഖ്യവാചകം തീരുമാനിക്കുന്നില്ല.
- source_word: Μαριὰμ
  choice: മറിയം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതവും ഗ്രീക്ക് നാമരൂപത്തോട് യോജിച്ചതുമായ രൂപം.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: നല്ല ഓഹരി
  rationale: ἀγαθή എന്നതിനെ താരതമ്യരൂപമാക്കാതെ ‘നല്ല’ എന്നു നേരിട്ട് നൽകുന്നു. μερίς എന്നതിന്റെ ‘ഓഹരി/പങ്ക്’ എന്ന അർഥം ഭക്ഷണത്തിലെ പങ്കിനെയും യഥാർഥ മൂല്യമുള്ളതിലെ പങ്കിനെയും സൂചിപ്പിക്കാവുന്ന ദ്വയാർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἐξελέξατο
  choice: തിരഞ്ഞെടുത്തിരിക്കുന്നു
  rationale: മറിയത്തിന്റെ ബോധപൂർവമായ തിരഞ്ഞെടുപ്പും അതിന്റെ നിലനിൽക്കുന്ന ഫലവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἥτις οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: അത് അവളിൽനിന്ന് എടുത്തുകളയപ്പെടുകയില്ല
  rationale: ബന്ധസർവനാമം മുൻപുള്ള ‘ഓഹരി’യിലേക്കു വ്യക്തമായി ചൂണ്ടുന്നു; ഭാവികാല കർമണിപ്രയോഗവും എടുത്തുമാറ്റാനാവാത്ത സ്ഥിരതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘കുറച്ചു കാര്യങ്ങൾ ... അല്ലെങ്കിൽ ഒന്നു’ എന്നതും മറിയത്തിന്റെ തിരഞ്ഞെടുപ്പും തമ്മിലുള്ള ബന്ധം
  choice: ഭക്ഷണസന്ദർഭത്തിലെ കുറച്ചു വിഭവങ്ങൾ/ഒരു വിഭവം എന്ന സൂചനയ്ക്കും ഒരേയൊരു അത്യാവശ്യകാര്യം എന്ന വിശാല അർഥത്തിനും ഇടം നൽകുന്ന വിധത്തിൽ വാചകം തുറന്നുവെച്ചു.
  alternative: ‘ഒരേയൊരു കാര്യം മാത്രമാണ് ആവശ്യം’ എന്നു മുഖ്യവാചകത്തിൽ നിർണയിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം പ്രായോഗികമായ ഭക്ഷണസജ്ജീകരണത്തെയും വിശാലമായ ആത്മീയ മുൻഗണനയെയും സൂചിപ്പിക്കാവുന്നതാണ്. അതിനാൽ വ്യാഖ്യാനപരമായ സംഘർഷം പരിഭാഷയിൽ തീർപ്പാക്കാതെ സംരക്ഷിച്ചു.
- issue: ἀγαθὴν എന്ന വിശേഷണത്തിന്റെ മൂല്യം
  choice: ‘നല്ല’
  alternative: ‘ഏറ്റവും നല്ല’ അല്ലെങ്കിൽ ‘മെച്ചപ്പെട്ട’
  rationale: മൂലപാഠത്തിൽ താരതമ്യരൂപമില്ല; അതിനാൽ സഹോദരിമാരുടെ പ്രവർത്തനങ്ങളെ പരിഭാഷ തന്നെ താരതമ്യവിധിക്ക് വിധേയമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഓഹരി’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും μερίς എന്ന പദത്തിന്റെ പങ്ക്/ഭാഗം എന്ന ദ്വയാർഥം നിലനിർത്തുന്നതുമാണ്. പ്രധാനവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
