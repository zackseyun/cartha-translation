id: LUK.10.7
reference: Luke 10:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: ml
  text: അതേ വീട്ടിൽത്തന്നെ താമസിക്കുക; അവർ നൽകുന്നതു ഭക്ഷിച്ചും കുടിച്ചും ഇരിക്കുക. കാരണം, തൊഴിലാളി തനിക്കുള്ള കൂലിക്ക് അർഹനാണ്.[a] ഒരു വീട്ടിൽനിന്ന് മറ്റൊരു വീട്ടിലേക്കു മാറിത്താമസിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തൊഴിലാളി തനിക്കു ലഭിക്കേണ്ട കൂലിക്ക് അർഹനാണ്.’
    reason: ‘തനിക്കുള്ള കൂലി’ എന്ന ബന്ധസൂചനയെ സന്ദർഭാനുസൃതമായി ‘തനിക്കു ലഭിക്കേണ്ട കൂലി’ എന്നു വ്യക്തമാക്കാവുന്ന ശാബ്ദിക ബദൽ.
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: അതേ വീട്ടിൽത്തന്നെ
  rationale: മുമ്പ് പറഞ്ഞ, അവരെ സ്വീകരിച്ച വീടിനെ αὐτῇ അനാഫോറികമായും ഊന്നലോടെയും സൂചിപ്പിക്കുന്നു. ‘അതേ ... തന്നെ’ എന്ന പ്രയോഗം ആ സൂചനയും ഒരിടത്തുതന്നെ തുടരണമെന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μένετε
  choice: താമസിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞ തുടർന്നുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; പാർപ്പിടത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘താമസിക്കുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἐσθίοντες καὶ πίνοντες
  choice: തിന്നുകയും കുടിക്കുകയും ചെയ്യുക
  rationale: കർത്തൃക്രിയയോടൊപ്പം തുടരുന്ന പ്രവൃത്തികളാണ് പങ്കാളിക്രിയകൾ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സമാന്തര ആജ്ഞാരൂപം അർഥം സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: τὰ παρ’ αὐτῶν
  choice: അവർ നൽകുന്നതു
  rationale: ആതിഥേയർ ലഭ്യമാക്കുന്ന ഭക്ഷണപാനീയങ്ങളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. സമീപസമാന്തര ഭാഗങ്ങളിൽ നിന്നുള്ള അധിക ആശയം ചേർക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἄξιος γὰρ ὁ ἐργάτης
  choice: കാരണം, വേലക്കാരൻ ... അർഹനാണ്
  rationale: γάρ മുമ്പത്തെ നിർദേശത്തിന്റെ കാരണം നൽകുന്നു. ἐργάτης എന്നതിന് സാധാരണക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ‘വേലക്കാരൻ’ ഉപയോഗിച്ചു; ἄξιος എന്നതിന്റെ യോഗ്യത/അവകാശസൂചന ‘അർഹൻ’ നിലനിർത്തുന്നു.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: തന്റെ കൂലിക്ക്
  rationale: μισθός ഇവിടെ വേലയ്ക്കുള്ള പ്രതിഫലമായ കൂലിയെ സൂചിപ്പിക്കുന്നു. αὐτοῦ എന്ന ഏകവചന പുൽലിംഗ സർവനാമത്തിന്റെ ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക പ്രതിബിംബസർവനാമമായ ‘തന്റെ’കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: വീടുതോറും മാറിത്താമസിക്കരുത്
  rationale: വ്യത്യസ്ത വീടുകളിലേക്കു പാർപ്പിടം മാറ്റുന്നതിനെ വിലക്കുകയാണ്. ‘മാറിത്താമസിക്കരുത്’ വെറും സന്ദർശനമല്ല, താമസസ്ഥലം മാറ്റലാണ് ഉദ്ദേശ്യമെന്നു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: τοῦ μισθοῦ αὐτοῦ എന്നതിലെ ഏകവചന പുൽലിംഗബന്ധം
  choice: വേലക്കാരൻ തന്റെ കൂലിക്ക് അർഹനാണ്
  alternative: വേല ചെയ്യുന്നവർ തങ്ങളുടെ കൂലിക്ക് അർഹരാണ്
  rationale: ഗ്രീക്കിൽ ὁ ἐργάτης, αὐτοῦ എന്നിവ ഏകവചന പുൽലിംഗത്തിലാണ്. പൊതുവായ പ്രമാണം ഉദ്ദേശിച്ചാലും, മൂലപാഠത്തിന്റെ വ്യാകരണരൂപം ബഹുവചനമാക്കി ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചു. ‘അതേ വീട്ടിൽത്തന്നെ’, ‘മാറിത്താമസിക്കരുത്’ എന്നീ പ്രയോഗങ്ങൾ ഒരിടത്ത് തുടരണമെന്ന ഊന്നൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ [a] അടയാളം ‘house’ എന്നതിന് ശേഷം നൽകിയിരുന്നെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം μισθός എന്ന ‘കൂലി’യെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ അടയാളം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനു ശേഷം ചേർത്തു.
