review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys remaining in the receiving house, accepting what the hosts supply, the rationale concerning a worker’s wages, and the prohibition on changing lodging. However, the participial eating-and-drinking clause is better represented as attendant action rather than as a second imperative, and ‘വീടുതോറും’ can suggest going to every house rather than moving from one lodging to another.
  naturalness: ‘അതേ വീട്ടിൽത്തന്നെ’ and ‘താമസിക്കുക’ are natural modern Malayalam. ‘അവർ നൽകുന്നതു ഭക്ഷിച്ചും കുടിച്ചും’ more naturally links the participial actions to remaining there. ‘ഒരു വീട്ടിൽനിന്ന് മറ്റൊരു വീട്ടിലേക്കു മാറിത്താമസിക്കരുത്’ is clearer and more idiomatic for the final prohibition.
  terminology: ‘തൊഴിലാളി’ is the standard modern term for ἐργάτης in this general maxim. ‘തനിക്കുള്ള കൂലിക്ക് അർഹനാണ്’ clearly preserves the singular masculine/reflexive relationship without imposing an interpretation. The footnote is retained and its anchor placed on the relevant phrase.
  issues:
  - severity: medium
    issue: The draft renders ἐσθίοντες καὶ πίνοντες as a second imperative.
    rationale: ‘തിന്നുകയും കുടിക്കുകയും ചെയ്യുക’ is intelligible, but the Greek participles describe accompanying activity while staying. ‘ഭക്ഷിച്ചും കുടിച്ചും’ preserves that relationship more closely in natural Malayalam.
  - severity: medium
    issue: ‘വീടുതോറും’ is potentially broader than the Greek expression.
    rationale: The Greek means changing lodging ‘from house to house’; ‘വീടുതോറും’ may mean ‘at every house’ or house-by-house. Explicitly saying ‘from one house to another’ removes this ambiguity.
  - severity: low
    issue: ‘വേലക്കാരൻ’ is less precise than a standard modern equivalent for ἐργάτης.
    rationale: ‘തൊഴിലാളി’ naturally conveys ‘worker/laborer’ without potentially suggesting a household servant.
  revised_text: അതേ വീട്ടിൽത്തന്നെ താമസിക്കുക; അവർ നൽകുന്നതു ഭക്ഷിച്ചും കുടിച്ചും ഇരിക്കുക. കാരണം, തൊഴിലാളി തനിക്കുള്ള കൂലിക്ക് അർഹനാണ്.[a] ഒരു വീട്ടിൽനിന്ന് മറ്റൊരു വീട്ടിലേക്കു മാറിത്താമസിക്കരുത്.
