revisions:
- from: അതേ വീട്ടിൽത്തന്നെ താമസിക്കുക; അവർ നൽകുന്നതു തിന്നുകയും കുടിക്കുകയും ചെയ്യുക. കാരണം, വേലക്കാരൻ തന്റെ കൂലിക്ക് അർഹനാണ്.[a] വീടുതോറും മാറിത്താമസിക്കരുത്.
  to: അതേ വീട്ടിൽത്തന്നെ താമസിക്കുക; അവർ നൽകുന്നതു ഭക്ഷിച്ചും കുടിച്ചും ഇരിക്കുക. കാരണം, തൊഴിലാളി തനിക്കുള്ള കൂലിക്ക് അർഹനാണ്.[a] ഒരു വീട്ടിൽനിന്ന് മറ്റൊരു വീട്ടിലേക്കു മാറിത്താമസിക്കരുത്.
  rationale: The revision preserves the Greek syntax more closely by making eating and drinking attendant actions, clarifies that the final command prohibits changing residences from one host household to another, and uses standard modern Malayalam terminology for ‘worker.’ No doctrinal interpretation has been added.
