id: LUK.10.27
reference: Luke 10:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: ml
  text: 'അവൻ ഉത്തരം പറഞ്ഞു: “നിന്റെ ദൈവമായ കർത്താവിനെ നിന്റെ മുഴുവൻ ഹൃദയത്തിൽനിന്ന്[a], നിന്റെ മുഴുവൻ ആത്മാവോടും, നിന്റെ മുഴുവൻ ശക്തിയോടും, നിന്റെ മുഴുവൻ മനസ്സോടും സ്നേഹിക്കണം; നിന്റെ അയൽക്കാരനെ നിന്നെപ്പോലെതന്നെ സ്നേഹിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പല മലയാള പരിഭാഷകളും ഇവിടെ ‘മുഴുവൻ ഹൃദയത്തോടെ’ എന്ന ആശയം നൽകുന്നു. എന്നാൽ ഗ്രീക്കിൽ ഹൃദയത്തെക്കുറിച്ച് ‘മുഴുവൻ ഹൃദയത്തിൽനിന്ന്’ (ἐξ) എന്നും തുടർന്നുള്ള പദങ്ങളെക്കുറിച്ച് ‘മുഴുവൻ …ഓടെ/യിൽ’ (ἐν) എന്നും വ്യത്യസ്തമായ പൂർവപ്രത്യയങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: അവൻ ഉത്തരം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കൃതന്തം + സമാപികാക്രിയ എന്ന പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള ആഖ്യാനരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἀγαπήσεις
  choice: സ്നേഹിക്കണം
  rationale: ഭാവികാല സൂചകരൂപം ഇവിടെ ഉദ്ധരിക്കപ്പെടുന്ന കല്പനയുടെ ബലം വഹിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘സ്നേഹിക്കണം’ അതിനെ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: κύριον τὸν θεόν σου
  choice: നിന്റെ ദൈവമായ കർത്താവിനെ
  rationale: κύριος എന്ന ദൈവിക പദവിക്ക് ‘കർത്താവ്’ എന്നും θεός എന്നതിന് ‘ദൈവം’ എന്നും നൽകി, രണ്ടിന്റെയും ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: നിന്റെ പൂർണഹൃദയത്തിൽനിന്നും
  rationale: ἐξ എന്നതിന്റെ ‘നിന്ന്/ഉള്ളിൽനിന്ന്’ എന്ന ദിശാബോധം നിലനിർത്തുകയും തുടർന്നുള്ള ἐν പ്രയോഗങ്ങളിൽനിന്നുള്ള വ്യത്യാസം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: നിന്റെ പൂർണാത്മാവോടും
  rationale: ψυχήയെ സാങ്കേതികമായി നിർവചിക്കാതെ പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ ‘ആത്മാവ്’ ഉപയോഗിക്കുന്നു; ‘ഓടും’ എന്നത് ഉപാധി/സഹവർത്തിത്വഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: നിന്റെ പൂർണശക്തിയോടും
  rationale: ἰσχύς എന്നതിന്റെ ശക്തി/ബലം എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: നിന്റെ പൂർണമനസ്സോടുംകൂടെ
  rationale: διάνοιαയുടെ ചിന്താശേഷി/മനസ്സ് എന്ന അർഥം ലളിതമായി നൽകുന്നു; പട്ടികയുടെ സമാപനം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: τὸν πλησίον σου ὡς σεαυτόν
  choice: നിന്റെ അയൽക്കാരനെ നിന്നെപ്പോലെതന്നെ
  rationale: πλησίον എന്ന ബന്ധപരമായ നൈതിക സംജ്ഞയ്ക്ക് സ്ഥാപിതമായ ‘അയൽക്കാരൻ’ ഉപയോഗിക്കുകയും ὡς എന്ന താരതമ്യബലം ‘പോലെതന്നെ’ കൊണ്ട് സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: തിരുവെഴുത്ത് ഉദ്ധരണിയിലെ κύριος എന്ന ദൈവിക പദവി
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കർത്താവ്’ ദൈവിക പദവിയുടെ ഭാരവും തിരുവെഴുത്തിലെ അനുരണനവും നിലനിർത്തുന്നു.
- issue: καρδία, ψυχή, ἰσχύς, διάνοια എന്നീ നാല് മനുഷ്യവശങ്ങൾ
  choice: ഹൃദയം, ആത്മാവ്, ശക്തി, മനസ്സ് എന്ന നാലംഗ നിര നിലനിർത്തി
  alternative: ‘മുഴുവൻ അസ്തിത്വത്തോടുംകൂടെ’ എന്ന് സംഗ്രഹിക്കുക
  rationale: ആകെ സമർപ്പണമാണ് വാക്യത്തിന്റെ ഉദ്ദേശ്യമെങ്കിലും, മൂലത്തിലെ ആവർത്തനസമൃദ്ധിയും ഓരോ പദത്തിനിടയിലെ യഥാർഥമായ അർഥവ്യാപ്തിയും സംഗ്രഹിച്ച് ഇല്ലാതാക്കുന്നില്ല.
- issue: Ἀγαπήσεις എന്ന ഭാവികാലരൂപത്തിന്റെ കല്പനാബലം
  choice: സ്നേഹിക്കണം
  alternative: നീ സ്നേഹിക്കും / സ്നേഹിക്കുക
  rationale: മലയാളത്തിൽ ഭാവികാലമായി മാത്രം നൽകിയാൽ പ്രവചനമായി തെറ്റിദ്ധരിക്കാം; ‘ണം’ രൂപം ഉദ്ധരിക്കപ്പെടുന്ന കല്പനയുടെ ബാധ്യത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ഉദ്ധരിക്കപ്പെട്ട കല്പനയുടെ ഗൗരവം നിലനിർത്തുന്നതിനൊപ്പം അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി. ആദ്യ പ്രയോഗത്തിലെ ἐξ–തുടർന്നുള്ള ἐν വ്യത്യാസം പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
