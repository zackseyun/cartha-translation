  source_fidelity: 'The Malayalam accurately represents the Greek: the dust is specified as coming from the hearers’ city and adhering to the envoys’ feet; ἀπομασσόμεθα is appropriately rendered as wiping away rather than shaking; the hostile/testimonial force of ὑμῖν is conveyed by “നിങ്ങൾക്കെതിരായി”; and ἤγγικεν is well represented by “അടുത്തുവന്നിരിക്കുന്നു,” preserving perfect-resultative nearness.'
