  terminology: “ദൈവരാജ്യം” is established, natural Malayalam biblical terminology for ἡ βασιλεία τοῦ θεοῦ. “പൊടി,” “പറ്റിപ്പിടിച്ച,” and “തുടച്ചുകളയുന്നു” are semantically precise and accessible. The notes are accurate, restrained, and correctly anchored.
