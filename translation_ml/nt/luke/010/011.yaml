id: LUK.10.11
reference: Luke 10:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: ml
  text: 'നിങ്ങളുടെ പട്ടണത്തിൽനിന്ന് ഞങ്ങളുടെ കാലുകളിൽ പറ്റിപ്പിടിച്ച പൊടിപോലും ഞങ്ങൾ നിങ്ങൾക്കെതിരായി തുടച്ചുകളയുന്നു.[a] എങ്കിലും ഇതു മനസ്സിലാക്കുക: ദൈവരാജ്യം അടുത്തുവന്നിരിക്കുന്നു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞങ്ങളുടെ കാലുകളിൽ പറ്റിപ്പിടിച്ച നിങ്ങളുടെ പട്ടണത്തിലെ പൊടിപോലും ഞങ്ങൾ നിങ്ങൾക്കെതിരായി തുടച്ചുകളയുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘കുടഞ്ഞുകളയുന്നു’ എന്നതിനെക്കാൾ പ്രത്യേകമായി ‘തുടച്ചുകളയുന്നു’ എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവരാജ്യം സമീപിച്ചിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പൂർണകാലം രാജ്യം അടുത്തുവന്നതും ആ വസ്തുതയ്ക്ക് ഇപ്പോഴും പ്രാബല്യമുള്ളതും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: പൊടി
  rationale: സാമാന്യമായ മണ്ണിനെയല്ല, പ്രത്യേകമായി പൊടിയെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്; പ്രതീകാത്മക പ്രവൃത്തിയുടെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: κολληθέντα
  choice: പറ്റിപ്പിടിച്ച
  rationale: കാലുകളിൽ പൊടി ചേർന്നുനിന്നതിനെ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: ἐκ τῆς πόλεως ὑμῶν
  choice: നിങ്ങളുടെ പട്ടണത്തിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τοὺς πόδας
  choice: ഞങ്ങളുടെ കാലുകളിൽ
  rationale: അക്ഷരാർഥത്തിൽ അല്പം അസ്വാഭാവികമായ ഗ്രീക്ക് പ്രയോഗം ഇവിടെ പൊടി ദൂതന്മാരുടെ കാലുകളിൽ പറ്റിയതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπομασσόμεθα
  choice: തുടച്ചുകളയുന്നു
  rationale: ഈ ക്രിയയുടെ പ്രത്യേക അർഥം കുടഞ്ഞുകളയുക എന്നതിനെക്കാൾ തുടച്ചുനീക്കുക എന്നതാണ്.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കെതിരായി
  rationale: ഈ സന്ദർഭത്തിൽ പ്രവൃത്തി നിരസിക്കുന്നവർക്കെതിരായ സാക്ഷ്യമായി ചെയ്യപ്പെടുന്നുവെന്ന ദിശാബോധം വ്യക്തമാക്കുന്നു.
- source_word: πλήν
  choice: എങ്കിലും
  rationale: ന്യായവിധിയുടെ അടയാളത്തിനുശേഷവും അറിഞ്ഞിരിക്കേണ്ട സത്യം ഊന്നിപ്പറയുന്ന ശക്തമായ വിരുദ്ധബന്ധം നിലനിർത്തുന്നു.
- source_word: γινώσκετε
  choice: മനസ്സിലാക്കുക
  rationale: തിരിച്ചറിയുകയും അംഗീകരിക്കുകയും ചെയ്യാനുള്ള വർത്തമാനകാല ആജ്ഞയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἤγγικεν
  choice: അടുത്തുവന്നിരിക്കുന്നു
  rationale: അടുത്തെത്തിയ സംഭവവും അതിന്റെ തുടരുന്ന പ്രസക്തിയും ഗ്രീക്ക് പൂർണകാലത്തിന് അനുസൃതമായി നിലനിർത്തുന്നു.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: സ്ഥിരവും സുതാര്യവുമായ മലയാള പ്രയോഗം; ദൈവത്തിന്റെ ഭരണത്തിന്റെ ആശയം അനാവശ്യമായി വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൊടി തുടച്ചുകളയുന്ന പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: നിരസിച്ച പട്ടണത്തിനെതിരായ സാക്ഷ്യവും ന്യായവിധിയുടെ പ്രതീകാത്മക അടയാളവും
  alternative: യാത്രയുമായി ബന്ധപ്പെട്ട ശുചീകരണപ്രവൃത്തി മാത്രം
  rationale: ὑμῖν എന്ന ദത്തിവും ദൗത്യപ്രസംഗത്തിന്റെ വിശാലസന്ദർഭവും ഇതിന് എതിരായ സാക്ഷ്യത്തിന്റെ സ്വഭാവമുണ്ടെന്ന് സൂചിപ്പിക്കുന്നു; ‘നിങ്ങൾക്കെതിരായി’ അത് വ്യാഖ്യാനാതിരേകമില്ലാതെ നിലനിർത്തുന്നു.
- issue: ദൈവരാജ്യം അടുത്തുവന്നതിന്റെ അർഥം
  choice: ദൈവരാജ്യം അടുത്തെത്തിയതും ആ അടുത്തുവരവിന് ഇപ്പോഴും പ്രാബല്യമുള്ളതും
  alternative: രാജ്യം ഭാവിയിൽ വരാനിരിക്കുന്നതു മാത്രം; അല്ലെങ്കിൽ ഇതിനകം പൂർണമായി സമാപ്തിയിലെത്തി
  rationale: ἤγγικεν എന്ന പൂർണകാലം സാക്ഷാത്കൃതമായ സമീപ്യത സൂചിപ്പിക്കുമ്പോഴും അന്തിമ സമാപ്തി സംഭവിച്ചുവെന്ന് നിർബന്ധിക്കുന്നില്ല; അന്ത്യകാലപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പട്ടണം’, ‘പറ്റിപ്പിടിച്ച’, ‘തുടച്ചുകളയുന്നു’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ദൈവരാജ്യം’ ബൈബിൾപരമായ ഗൗരവവും പരിചിതത്വവും നിലനിർത്തുന്നു.
