  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: ml
  text: അവർ യാത്രചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ, അവൻ ഒരു ഗ്രാമത്തിൽ പ്രവേശിച്ചു. മാർത്ത എന്നു പേരുള്ള ഒരു സ്ത്രീ അവനെ സ്വാഗതം ചെയ്തു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ അതിഥിയായി സ്വീകരിച്ചു.” ഒരാളെ ആതിഥ്യമരുളി സ്വീകരിക്കുക എന്ന ആശയം ഗ്രീക്ക് ക്രിയയ്ക്കുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: അവർ യാത്രചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐν + articular infinitive സമകാലികമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; αὐτούς ബഹുവചനമായതിനാൽ യാത്ര ചെയ്ത സംഘത്തെയാണ് ‘അവർ’ എന്നു പറയുന്നത്. δέ ഇവിടെ കഥയുടെ ഒഴുക്ക് മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലഘു ബന്ധകമായതിനാൽ പ്രത്യേകം പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: αὐτὸς
  choice: അവൻ
  rationale: യാത്ര ചെയ്ത ബഹുവചന സംഘത്തിൽനിന്ന് യേശുവിനെ വേർതിരിച്ചുകാണിക്കുന്ന സർവനാമം. സന്ദർഭത്തിൽ ‘അവൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്; ‘യേശു’ എന്നു ചേർക്കേണ്ട ആവശ്യമില്ല.
- source_word: εἰσῆλθεν εἰς κώμην τινά
  choice: ഒരു ഗ്രാമത്തിൽ പ്രവേശിച്ചു
  rationale: κώμη എന്നത് ഗ്രാമത്തെ സൂചിപ്പിക്കുന്നു; τινά നൽകുന്ന അനിശ്ചിതത്വം ‘ഒരു’ എന്നതിൽ നിലനിൽക്കുന്നു. εἰσῆλθεν എന്നതിന് ‘പ്രവേശിച്ചു’ കൃത്യവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: മാർത്ത എന്നു പേരുള്ള ഒരു സ്ത്രീ
  rationale: ὀνόματι എന്ന നാമനിർദേശ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്നു പേരുള്ള’ എന്ന് നൽകിയിരിക്കുന്നു. τις എന്നതിന്റെ അനിശ്ചിതത്വം ‘ഒരു’ സംരക്ഷിക്കുന്നു; δέ പുതിയ കഥാപാത്രത്തെ അവതരിപ്പിക്കുന്ന ലഘു കഥാബന്ധകമാണ്.
- source_word: ὑπεδέξατο αὐτόν
  choice: അവനെ സ്വാഗതം ചെയ്തു
  rationale: ὑποδέχομαι ഒരാളെ അതിഥിയായി സസ്നേഹം സ്വീകരിക്കുന്ന അർഥം വഹിക്കുന്നു. ‘സ്വാഗതം ചെയ്തു’ ആ ആതിഥേയഭാവം സ്വാഭാവികമായി നൽകുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘തന്റെ വീട്ടിലേക്ക്’ എന്ന ആശയം പ്രധാന വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
