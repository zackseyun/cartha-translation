translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ രണ്ടു വാക്യങ്ങളാക്കി; അർഥപരമായ വിവരങ്ങളൊന്നും ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് സൂചകം അത് വിശദീകരിക്കുന്ന ‘സ്വാഗതം ചെയ്തു’ എന്ന പ്രയോഗത്തിനുശേഷമാണ് നൽകിയിരിക്കുന്നത്.
