source:
  edition: SBLGNT
  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: ml
  text: എന്നാൽ യാത്രചെയ്തുകൊണ്ടിരുന്ന ഒരു ശമര്യക്കാരൻ അവൻ ഉണ്ടായിരുന്നിടത്ത് എത്തി; അവനെ കണ്ടപ്പോൾ അവനോടു കരുണ തോന്നി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവനോടു അനുകമ്പ തോന്നി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαμαρίτης
  choice: ഒരു ശമര്യക്കാരൻ
  rationale: വംശീയ-മതപരമായ തിരിച്ചറിയലും ഉപമയിലെ സാമൂഹിക വൈരുധ്യവും നിലനിർത്തുന്ന, മലയാളത്തിൽ പ്രചാരമുള്ള കൃത്യമായ പദം.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ പുരോഹിതന്റെയും ലേവ്യന്റെയും പ്രതികരണവുമായി ഉള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τις
  choice: ഒരു
  rationale: അനിശ്ചിത സർവനാമത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘ഒരു പ്രത്യേക’ എന്ന കൃത്രിമഭാവം ഒഴിവാക്കുന്നു.
- source_word: ὁδεύων
  choice: യാത്രചെയ്തുകൊണ്ടിരുന്ന
  rationale: പശ്ചാത്തലത്തിൽ തുടരുന്ന യാത്രയെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἦλθεν
  choice: എത്തി
  rationale: പരിക്കേറ്റവൻ ഉണ്ടായിരുന്ന സ്ഥലത്തേക്കുള്ള വരവും എത്തിച്ചേരലും സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
- source_word: κατ’ αὐτόν
  choice: അവൻ കിടന്നിരുന്ന സ്ഥലത്തെത്തി
  rationale: പരിക്കേറ്റവന്റെ സ്ഥാനത്തേക്കുള്ള നീക്കം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘കിടന്നിരുന്ന’ എന്നത് മുൻസന്ദർഭത്തിൽ നിലത്തുവിട്ടുപോയ അവന്റെ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἰδών
  choice: അവനെ കണ്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള കാഴ്ചയും പ്രതികരണവും തമ്മിലുള്ള സമയബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐσπλαγχνίσθη
  choice: മനസ്സലിഞ്ഞു
  rationale: ആഴത്തിലുള്ള കരുണയാൽ ഉള്ളിൽ ഉണർന്ന പ്രതികരണത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ശമര്യക്കാരന്റെ കരുണാപൂർണ പ്രതികരണത്തെ പിൽക്കാല ധാർമ്മികമോ ഉപദേശപരമോ ആയ വ്യാഖ്യാനം ചേർക്കാതെ വിവർത്തനം ചെയ്യുക
  choice: മനസ്സലിഞ്ഞു
  alternative: കരുണ തോന്നി
  rationale: ഗ്രീക്ക് ക്രിയയിലെ ആഴമുള്ള, ഉള്ളിൽനിന്നുള്ള അനുകമ്പയുടെ ശക്തി നിലനിർത്തുന്നു; അതേസമയം കൃപ, അയൽസ്നേഹം തുടങ്ങിയ വിശദീകരണങ്ങൾ വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. വാക്യത്തിലെ വൈരുധ്യവും കരുണയുടെ വൈകാരിക ശക്തിയും നിലനിർത്തി.
