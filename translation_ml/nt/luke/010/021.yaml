id: LUK.10.21
reference: Luke 10:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: ml
  text: 'അതേ സമയത്ത് അവൻ പരിശുദ്ധാത്മാവിൽ അത്യന്തം സന്തോഷിച്ച് പറഞ്ഞു: “പിതാവേ, സ്വർഗത്തിന്റെയും ഭൂമിയുടെയും കർത്താവേ, ഞാൻ അങ്ങയെ സ്തുതിക്കുന്നു[a]. കാരണം, അങ്ങ് ഈ കാര്യങ്ങൾ ജ്ഞാനികളിൽനിന്നും വിവേകികളിൽനിന്നും മറച്ചുവെക്കുകയും ശിശുക്കൾക്ക്[b] വെളിപ്പെടുത്തുകയും ചെയ്തു. അതേ, പിതാവേ, ഇങ്ങനെ ആയത് അങ്ങേക്കു പ്രസാദമായിരുന്നു[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞാൻ അങ്ങേക്കു നന്ദി പറയുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. പ്രാർഥനയിൽ ഈ ഗ്രീക്ക് ക്രിയയ്ക്ക് സ്തുതിയെയും നന്ദിയെയും സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “കുഞ്ഞുങ്ങൾക്ക്” അഥവാ “ശിശുക്കൾക്ക്.” ഇവിടെ വിനയമുള്ളവരെയോ സമൂഹത്തിൽ പ്രാധാന്യമില്ലാത്തവരായി കരുതപ്പെടുന്നവരെയോ രൂപകമായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: c
    text: “ഇങ്ങനെയായിരുന്നു അങ്ങയുടെ നല്ല ഇഷ്ടം” എന്നോ “ഇതായിരുന്നു അങ്ങയുടെ പ്രസാദം” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: അതേ സമയത്ത്
  rationale: ഗ്രീക്കിലെ സമയസൂചനയും ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἠγαλλιάσατο
  choice: അത്യന്തം സന്തോഷിച്ച്
  rationale: വെറും സന്തോഷത്തേക്കാൾ ശക്തമായ ആനന്ദം സൂചിപ്പിക്കുന്ന ക്രിയയുടെ തീവ്രത വ്യക്തമാക്കുന്നു.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിൽ
  rationale: നാമത്തിനും വിശേഷണത്തിനുമുള്ള നിർദ്ദേശകഘടന പരിശുദ്ധാത്മാവിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ദത്തിവിന്റെ വ്യാപ്തി/മാധ്യമം എന്ന തുറന്ന ഭാവം ‘-യിൽ’ നിലനിർത്തുന്നു.
- source_word: Ἐξομολογοῦμαί σοι
  choice: ഞാൻ അങ്ങയെ സ്തുതിക്കുന്നു
  rationale: പ്രാർഥനാസന്ദർഭത്തിൽ സ്തുതിയുടെയും നന്ദിയുടെയും അർഥസാധ്യതയുണ്ട്; മുഖ്യപാഠത്തിൽ സ്തുതി സ്വീകരിച്ച് നന്ദി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: പിതാവേ, സ്വർഗത്തിന്റെയും ഭൂമിയുടെയും കർത്താവേ
  rationale: രണ്ട് സംബോധനകളെയും ദൈവിക പരമാധികാരത്തിന്റെ ഭാവത്തെയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: σοφῶν καὶ συνετῶν
  choice: ജ്ഞാനികളിൽനിന്നും വിവേകികളിൽനിന്നും
  rationale: σοφός, συνετός എന്നീ പദങ്ങളുടെ വ്യത്യസ്തമായെങ്കിലും ബന്ധമുള്ള അർഥങ്ങൾ വിദ്യാഭ്യാസസ്ഥാനം അനാവശ്യമായി ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἀπεκάλυψας
  choice: വെളിപ്പെടുത്തുകയും ചെയ്തു
  rationale: ‘മറച്ചുവെച്ചു’ എന്നതുമായുള്ള വൈരുധ്യവും വെളിപ്പാടിന്റെ അർഥഭാരവും നിലനിർത്തുന്നു.
- source_word: νηπίοις
  choice: ശിശുക്കൾക്ക്
  rationale: മൂലപദത്തിന്റെ വ്യക്തമായ ശിശു-രൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു; രൂപകപ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: ഇങ്ങനെ ചെയ്യുന്നത് അങ്ങയുടെ സന്നിധിയിൽ പ്രസാദകരമായിരുന്നു
  rationale: εὐδοκίαയുടെ പ്രസാദം/നല്ല ഇഷ്ടം എന്ന അർഥവും ἔμπροσθέν σου എന്ന ‘അങ്ങയുടെ മുമ്പിൽ/സന്നിധിയിൽ’ ഭാവവും അനാവശ്യമായി ദൈവഹിതം എന്നു മാത്രം ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τῷ πνεύματι τῷ ἁγίῳ എന്നതിന്റെ സൂചിതൻ
  choice: പരിശുദ്ധാത്മാവിൽ
  alternative: ആത്മാവിൽ / തന്റെ ആത്മാവിൽ
  rationale: ഗ്രീക്കിലെ നിർദ്ദേശകഘടന ‘പരിശുദ്ധാത്മാവ്’ എന്ന വ്യക്തമായ വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; ‘-യിൽ’ ഉപയോഗിക്കുന്നത് പ്രവർത്തനമാധ്യമമോ അനുഭവമണ്ഡലമോ എന്ന സൂക്ഷ്മഭേദം തീർപ്പാക്കുന്നില്ല.
- issue: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου എന്നതിലെ ദൈവിക പ്രസാദവും ഹിതവും
  choice: ഇങ്ങനെ ചെയ്യുന്നത് അങ്ങയുടെ സന്നിധിയിൽ പ്രസാദകരമായിരുന്നു
  alternative: ഇങ്ങനെയായിരുന്നു അങ്ങയുടെ കൃപാപൂർണമായ ഹിതം / ഇതായിരുന്നു അങ്ങയുടെ പ്രസാദം
  rationale: ദൈവത്തിന്റെ അംഗീകാരമോ പ്രസാദമോ ഹിതമോ ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിക്കുന്നു; ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: മറയ്ക്കുകയും വെളിപ്പെടുത്തുകയും ചെയ്യുന്നതിൽ ദൈവം കർത്താവായി പ്രത്യക്ഷപ്പെടുന്നത്
  choice: സജീവ ക്രിയകളോടെ ദൈവത്തെ കർത്താവായി നിലനിർത്തി
  alternative: കാര്യങ്ങൾ മറഞ്ഞിരുന്നു / വെളിപ്പെട്ടു എന്ന കർമണിപ്രയോഗം
  rationale: ἀπέκρυψας, ἀπεκάλυψας എന്നീ സജീവക്രിയകളുടെ വ്യാകരണപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു. ദൈവത്തോടുള്ള ആദരസൂചകമായി ‘അങ്ങ്/അങ്ങയെ/അങ്ങയുടെ’ സ്വീകരിച്ചു. മൂലപാഠത്തിൽ പേര് ഇല്ലെങ്കിലും മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമാക്കാൻ ‘യേശു’ ചേർത്തു; വാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ സൂചിതൻ വ്യക്തമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിന് പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
