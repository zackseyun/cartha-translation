  to: 'അതേ സമയത്ത് അവൻ പരിശുദ്ധാത്മാവിൽ അത്യന്തം സന്തോഷിച്ച് പറഞ്ഞു: “പിതാവേ, സ്വർഗത്തിന്റെയും ഭൂമിയുടെയും കർത്താവേ, ഞാൻ അങ്ങയെ സ്തുതിക്കുന്നു[a]. കാരണം, അങ്ങ് ഈ കാര്യങ്ങൾ ജ്ഞാനികളിൽനിന്നും വിവേകികളിൽനിന്നും മറച്ചുവെക്കുകയും ശിശുക്കൾക്ക്[b] വെളിപ്പെടുത്തുകയും ചെയ്തു. അതേ, പിതാവേ, ഇങ്ങനെ ആയത് അങ്ങേക്കു പ്രസാദമായിരുന്നു[c].”'
