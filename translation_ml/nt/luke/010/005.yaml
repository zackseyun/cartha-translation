id: LUK.10.5
reference: Luke 10:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: ml
  text: നിങ്ങൾ ഏതു വീട്ടിൽ പ്രവേശിച്ചാലും, ആദ്യം “ഈ വീടിന് സമാധാനം” എന്നു പറയുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν … οἰκίαν
  choice: ഏതു വീട്ടിൽ … ആയാലും
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചകമായ അർഥം മലയാളത്തിലെ ‘പ്രവേശിക്കുക’ എന്ന ക്രിയയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ἣν … ἂν സൂചിപ്പിക്കുന്ന അനിശ്ചിത പൊതുവ്യവസ്ഥയെ ‘ഏതു … ആയാലും’ കൃത്യമായി നൽകുന്നു.
- source_word: εἰσέλθητε
  choice: നിങ്ങൾ … പ്രവേശിച്ചാലും
  rationale: ἄν സഹിതമുള്ള അനിശ്ചിത ആപേക്ഷികവാക്യത്തിലെ aorist subjunctive പൊതുവായ, ഭാവിനോക്കുള്ള സാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘പ്രവേശിച്ചാലും’ മലയാളത്തിൽ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἰκίαν
  choice: വീട്ടിൽ
  rationale: ഇവിടെ οἰκία ശിഷ്യന്മാർ പ്രവേശിക്കുന്ന വാസസ്ഥലത്തെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; ‘വീട്’ അതിന്റെ മൂർത്തമായ അർഥം നിലനിർത്തുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: പ്രവേശിച്ചശേഷം ചെയ്യേണ്ട ആദ്യകാര്യത്തെ സൂചിപ്പിക്കുന്ന ക്രമപ്രാധാന്യം നേരിട്ട് നൽകുന്നു.
- source_word: λέγετε
  choice: പറയുക
  rationale: നിർദേശിക്കപ്പെട്ട അഭിവാദ്യം ഉച്ചരിക്കാനുള്ള present imperative-ന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: Εἰρήνη
  choice: സമാധാനം
  rationale: അഭിവാദ്യവും അനുഗ്രഹവും ഒരുമിച്ചു വഹിക്കുന്ന εἰρήνηയുടെ അർഥം നിലനിർത്തുന്നു; ഗ്രീക്കിലെ സംക്ഷിപ്തത സംരക്ഷിക്കാൻ ‘ഉണ്ടാകട്ടെ’ പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: τῷ οἴκῳ τούτῳ
  choice: ഈ വീടിന്
  rationale: അനുഗ്രഹത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന dative-നെ ‘-ന്’ എന്ന വിഭക്തി സ്വാഭാവികമായി നൽകുന്നു. οἶκος ഇവിടെ വീടിനെയും അതുമായി ബന്ധപ്പെട്ട വീട്ടുകാരെയും ഉൾക്കൊള്ളാവുന്നതാണെങ്കിലും, പ്രവേശിക്കുന്ന വാസസ്ഥലവുമായി ഉള്ള പദബന്ധം നിലനിർത്താൻ ‘വീട്’ തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: സമാധാനവാക്യത്തിന്റെ സ്വഭാവം
  choice: “ഈ വീടിന് സമാധാനം” എന്ന സംക്ഷിപ്തമായ അഭിവാദ്യ-അനുഗ്രഹമായി പരിഭാഷപ്പെടുത്തി.
  alternative: “ഈ വീടിന് സമാധാനം ഉണ്ടാകട്ടെ” എന്നോ “ഈ വീടിന്മേൽ സമാധാനം” എന്നോ കൂടുതൽ വ്യക്തമായി നൽകാം.
  rationale: ഗ്രീക്ക് വാചകം ക്രിയയില്ലാത്ത സംക്ഷിപ്ത അനുഗ്രഹസൂത്രമാണ്; അത് വെറും സാധാരണ അഭിവാദ്യമായി ദുർബലപ്പെടുത്താതെയും ഗ്രീക്കിലില്ലാത്ത ആരാധനാക്രമഭാഷ ചേർക്കാതെയും അതിന്റെ അനുഗ്രഹസ്വഭാവവും തുറന്ന വ്യാകരണരൂപവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പ്രവേശിച്ചാലും’, ‘ആദ്യം’, ‘പറയുക’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. അനുഗ്രഹവാക്യത്തിലെ ക്രിയാരഹിത സംക്ഷിപ്തത മനപ്പൂർവം നിലനിർത്തിയതിനാൽ അതിന്റെ മറ്റു സ്വാഭാവിക വിപുലീകരണങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
