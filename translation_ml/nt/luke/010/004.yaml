id: LUK.10.4
reference: Luke 10:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: ml
  text: പണസഞ്ചിയോ യാത്രാസഞ്ചിയോ[a] ചെരിപ്പുകളോ കൊണ്ടുപോകരുത്; വഴിയിൽ ആരെയും അഭിവാദ്യം ചെയ്യരുത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യാത്രാസഞ്ചി’ എന്നത് ‘ഭക്ഷണസാധനങ്ങൾക്കുള്ള സഞ്ചി’ എന്നോ ലളിതമായി ‘സഞ്ചി’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇത് സാധാരണ മര്യാദ പൂർണമായി വിലക്കുന്നതല്ലായിരിക്കാം; അക്കാലത്തെ ദീർഘമായ സാമൂഹിക അഭിവാദ്യങ്ങൾക്കായി സമയം ചെലവഴിക്കാതെ ദൗത്യം അടിയന്തരമായി നിർവഹിക്കണമെന്നായിരിക്കാം ആശയം.
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: കൊണ്ടുപോകരുത്
  rationale: യാത്രയ്ക്കായി സാധനങ്ങൾ കൈവശം കൊണ്ടുപോകുന്നതിനെ വിലക്കുന്ന സന്ദർഭത്തിൽ βαστάζω എന്നതിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: βαλλάντιον
  choice: പണസഞ്ചി
  rationale: പണം സൂക്ഷിക്കുന്ന സഞ്ചിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘പണസഞ്ചി’ വ്യക്തവും ചരിത്രസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: πήραν
  choice: യാത്രാസഞ്ചി
  rationale: യാത്രയ്ക്കുള്ള ഭക്ഷണസാധനങ്ങളോ മറ്റു ആവശ്യവസ്തുക്കളോ വഹിക്കുന്ന സഞ്ചി എന്ന പ്രവർത്തനാർഥം വ്യക്തമാക്കുന്നു; ‘സഞ്ചി’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: ὑποδήματα
  choice: ചെരിപ്പുകൾ
  rationale: കാലിൽ ധരിക്കുന്ന വസ്തുക്കളെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദമാണിത്. പുരാതന പശ്ചാത്തലത്തിൽ ചെരിപ്പുകൾ സാധാരണയായി സാൻഡലുകളായിരുന്നെങ്കിലും, ഗ്രീക്കിലെ പൊതുവായ അർഥം നിലനിർത്താൻ ‘ചെരിപ്പുകൾ’ തെരഞ്ഞെടുത്തു.
- source_word: μηδένα
  choice: ആരെയും
  rationale: നിഷേധക്രിയയോടൊപ്പം ‘no one’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κατὰ τὴν ὁδόν
  choice: വഴിയിൽവെച്ച്
  rationale: യാത്രാമധ്യേ അഥവാ വഴിയിലൂടെ പോകുമ്പോൾ എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀσπάσησθε
  choice: അഭിവാദ്യം ചെയ്യരുത്
  rationale: ἀσπάζομαι എന്നതിന്റെ ‘അഭിവാദ്യം ചെയ്യുക’ എന്ന സാധാരണ അർഥം നേരിട്ടു നൽകുകയും കല്പനയുടെ ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യാത്രാമധ്യേ മറ്റുള്ളവരെ അഭിവാദ്യം ചെയ്യരുതെന്ന വിലക്കിന്റെ വ്യാപ്തി
  choice: ‘വഴിയിൽവെച്ച് ആരെയും അഭിവാദ്യം ചെയ്യരുത്’ എന്ന നേരിട്ടുള്ള വിലക്ക് പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘ദീർഘമായ അഭിവാദ്യങ്ങൾക്കായി യാത്ര വൈകിക്കരുത്’ എന്ന് ആശയവ്യാഖ്യാനത്തോടെ പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ നേരിട്ടുള്ള വിലക്കാണുള്ളത്. അത് മയപ്പെടുത്താതെ പ്രധാനപാഠത്തിൽ സൂക്ഷിക്കുകയും, ദൗത്യത്തിന്റെ അടിയന്തരതയും അന്നത്തെ ദീർഘമായ സാമൂഹിക അഭിവാദ്യരീതികളും സംബന്ധിച്ച സാധ്യതയുള്ള സൂചന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. വാക്യത്തിന്റെ നേരിട്ടുള്ള വിലക്കും യാത്രാസന്ദർഭവും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാളിയിലെ അടിക്കുറിപ്പ് സൂചകങ്ങളും അവയുടെ വിഷയങ്ങളും തമ്മിലുള്ള പൊരുത്തക്കേട് പരിഹരിച്ച്, പാഠത്തിൽ ആദ്യം വരുന്ന ‘യാത്രാസഞ്ചി’ക്ക് [a]യും പിന്നീട് വരുന്ന അഭിവാദ്യവിലക്കിന് [b]യും നൽകി.
