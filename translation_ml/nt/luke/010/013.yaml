id: LUK.10.13
reference: Luke 10:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: ml
  text: “കൊരസീനേ, നിനക്കു അയ്യോ! ബേത്ത്സയിദേ, നിനക്കു അയ്യോ! നിങ്ങളുടെയിടയിൽ നടന്ന ശക്തിപ്രവൃത്തികൾ[a] സോരിലും സീദോനിലും നടന്നിരുന്നെങ്കിൽ, അവർ ചാക്കുവസ്ത്രം ധരിച്ച് ചാരത്തിൽ ഇരുന്ന് പണ്ടേ മാനസാന്തരപ്പെട്ടേനെ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അത്ഭുതങ്ങൾ”; ഗ്രീക്കിൽ “ശക്തിപ്രവൃത്തികൾ” അഥവാ “ശക്തിയുടെ പ്രവൃത്തികൾ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ചാക്കുവസ്ത്രം ധരിച്ച് ചാരത്തിൽ ഇരുന്ന് അവർ പണ്ടേ അവരുടെ മനസ്സ് മാറ്റിയേനേ.”
    reason: previous_rendering
lexical_decisions:
- source_word: Οὐαί σοι
  choice: നിനക്കു ഹാ കഷ്ടം
  rationale: പ്രവാചകീയമായ വിലാപത്തിന്റെയും ന്യായവിധിപ്രഖ്യാപനത്തിന്റെയും സംയുക്തഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Χοραζίν / Βηθσαϊδά
  choice: കോരസീൻ / ബേത്‌സയിദ
  rationale: ഗ്രീക്ക് രൂപങ്ങളെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ വ്യക്തവും പ്രചാരമുള്ളതുമായ ലിപ്യന്തരണം; സംബോധനയിൽ കോരസീനേ, ബേത്‌സയിദേ എന്ന രൂപങ്ങൾ.
- source_word: δυνάμεις
  choice: ശക്തിപ്രവൃത്തികൾ
  rationale: ദൈവിക ശക്തി പ്രകടമാക്കുന്ന പ്രവൃത്തികൾ എന്ന ഗ്രീക്ക് പദത്തിന്റെ ഇരട്ട ഊന്നൽ നിലനിർത്തുന്നു; ‘അത്ഭുതങ്ങൾ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: നടന്നിരുന്നെങ്കിൽ ... നടന്ന
  rationale: γίνομαι എന്ന ക്രിയയുടെ സംഭവിക്കുക/നടക്കുക എന്ന ഭാവം സൂക്ഷിക്കുകയും കർത്താവിനെ അനാവശ്യമായി വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെയിടയിൽ
  rationale: ബഹുവചന അഭിസംബോധനയിൽ പട്ടണവാസികളുടെ ഇടയിൽ നടന്ന സംഭവങ്ങളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: πάλαι
  choice: പണ്ടേ
  rationale: പ്രതിഘടനാത്മക വാക്യത്തിലെ ‘വളരെ മുമ്പുതന്നെ’ എന്ന കാലസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐν σάκκῳ καὶ σποδῷ καθήμενοι
  choice: ചാക്കുടുത്ത് ചാരത്തിൽ ഇരുന്ന്
  rationale: അനുതാപത്തിന്റെ ദൃശ്യമായ പ്രവാചകീയ പ്രതീകവും ഇരിക്കുന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: μετενόησαν
  choice: മാനസാന്തരപ്പെടുമായിരുന്നു
  rationale: ലൂക്കോസിലെ ധാർമ്മിക-ആത്മീയ തിരിഞ്ഞുവരവിനെ സൂചിപ്പിക്കുന്ന പരിചിതമായ മലയാള ബൈബിൾപദം; പദത്തിന്റെ അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: δυνάμεις എന്ന പദത്തിൽ യേശുവിന്റെ പ്രവൃത്തികളുടെ സ്വഭാവം
  choice: ശക്തിപ്രവൃത്തികൾ
  alternative: അത്ഭുതങ്ങൾ
  rationale: ഗ്രീക്ക് പദം പ്രവൃത്തികളെയും അവയിൽ പ്രകടമാകുന്ന ശക്തിയെയും ഊന്നുന്നു; ‘അത്ഭുതങ്ങൾ’ സാധുവായെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- issue: മാനസാന്തരത്തിന്റെ ദൃശ്യരൂപം
  choice: ചാക്കുടുത്ത് ചാരത്തിൽ ഇരുന്ന് എന്ന മൂർത്തമായ ചിത്രം പ്രധാനവാചകത്തിൽ നിലനിർത്തി
  alternative: ചാക്കും ചാരവുമായി മാനസാന്തരപ്പെടുക
  rationale: καθήμενοι എന്ന പങ്കാളിക്രിയയിലെ ഇരിക്കുന്ന ഭാവം മായ്ച്ചുകളയാതെ, ദുഃഖത്തിന്റെയും അനുതാപത്തിന്റെയും ചരിത്രപരമായ പ്രതീകം സംരക്ഷിക്കുന്നു.
- issue: μετανοέω എന്നതിന്റെ അർത്ഥവ്യാപ്തി
  choice: മാനസാന്തരപ്പെടുക
  alternative: ചിന്ത മാറ്റുക
  rationale: സന്ദർഭത്തിലെ അനുതാപപരമായ തിരിഞ്ഞുവരവ് പ്രധാനവാചകത്തിൽ വ്യക്തമാക്കുന്നു; പദത്തിന്റെ ‘മനസ്സ്/ചിന്ത മാറ്റുക’ എന്ന ഘടകം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവവും പ്രവാചകീയ തീവ്രതയും നിലനിർത്തി. പട്ടണനാമങ്ങളിൽ ഗ്രീക്ക് സാക്ഷ്യത്തെ പിന്തുടർന്നു; പരമ്പരാഗത അനുതാപചിത്രം വിശദീകരിച്ച് ചുരുക്കാതെ സൂക്ഷിച്ചു.
