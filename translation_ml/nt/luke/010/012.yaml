source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളോടു പറയുന്നു: ആ ദിവസം സൊദോമിന്[a] ആ നഗരത്തിനേക്കാൾ കൂടുതൽ സഹിക്കാവുന്നതായിരിക്കും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൊദോം’ എന്ന സ്ഥലനാമം ഇവിടെ അവിടത്തെ ജനങ്ങളെ പ്രതിനിധീകരിക്കുന്നു.
    reason: metonymy_clarification
  - marker: b
    text: ‘ആ ദിവസം’ ദൈവിക ന്യായവിധിയുടെ ദിവസത്തെ സൂചിപ്പിക്കുന്നു; ചില സമാന്തര ഭാഗങ്ങളിൽ ഇത് വ്യക്തമായി പറയുന്നു. ‘കൂടുതൽ സഹിക്കാവുന്നത്’ എന്നതിന് ‘കൂടുതൽ താങ്ങാനാകുന്നത്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള ഗൗരവമേറിയ പ്രസ്താവനയുടെ ശക്തി നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: Σοδόμοις
  choice: സൊദോമിന്
  rationale: സ്ഥലനാമം അവിടത്തെ ജനങ്ങളെ പ്രതിനിധീകരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം അതിരുകടന്ന് വിശദീകരിക്കാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ആ ദിവസത്തിൽ
  rationale: മൂലത്തിലെ കാലസൂചന അതേപടി നിലനിർത്തുന്നു; പ്രധാന വാക്യത്തിൽ ‘ന്യായവിധിദിവസം’ എന്നു വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
- source_word: ἀνεκτότερον
  choice: കൂടുതൽ സഹിക്കാവുന്നതായിരിക്കും
  rationale: താരതമ്യരൂപത്തിന്റെ ‘കൂടുതൽ സഹിക്കത്തക്കത്/കൂടുതൽ പൊറുക്കാവുന്നത്’ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: ഭാവികാലത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: ആ നഗരത്തെക്കാൾ
  rationale: πόλις എന്നതിന് ‘നഗരം’ എന്നും താരതമ്യഘടനയ്ക്ക് ‘-ത്തെക്കാൾ’ എന്നും നൽകി ഗ്രീക്കിന്റെ സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ആ ദിവസം’ എന്നതിന്റെ സ്വഭാവം
  choice: പ്രധാന വാക്യത്തിൽ ‘ആ ദിവസത്തിൽ’ എന്നു മാത്രം നിലനിർത്തുക
  alternative: ‘ന്യായവിധിദിവസത്തിൽ’ എന്നു വിപുലീകരിക്കുക
  rationale: സന്ദർഭം ദൈവിക ന്യായവിധിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം തന്നെ ‘ആ ദിവസം’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: സൊദോമും ‘ആ നഗരവും’ തമ്മിലുള്ള താരതമ്യം
  choice: വിധിയുടെ സഹനീയതയിലെ താരതമ്യം അതേപടി നിലനിർത്തുക
  alternative: ഇരുപക്ഷത്തിന്റെയും കുറ്റമോ ശിക്ഷയോ വിശദീകരിച്ച് ചേർക്കുക
  rationale: മൂലവാക്യം നൽകുന്ന താരതമ്യം മാത്രം വിവർത്തനം ചെയ്യുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ കാരണം വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സംക്ഷിപ്തതയും ന്യായവിധിസംബന്ധമായ സൂചനയും നിലനിർത്തി; വ്യാഖ്യാനപരമായ വിപുലീകരണം പ്രധാന വാക്യത്തിൽ ഒഴിവാക്കി.
