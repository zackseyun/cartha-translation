review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the rhetorical question introduced by μή, the future passive force of both verbs, and the deliberate contrast between heaven and Hades. ‘പാതാളം’ is a viable contextual rendering of ᾅδης when qualified by the note distinguishing it from Gehenna.
  naturalness: The verse is clear and suitably solemn in modern standard Malayalam. Spacing the postpositional expression as ‘സ്വർഗം വരെ’ and ‘പാതാളം വരെ’ is more standard and readable than closing it to the preceding noun.
  terminology: ‘കഫർന്നഹൂം’ is an established Malayalam biblical form. ‘പാതാളം’ can carry broader underworld associations, so the explanatory note is important and should retain the Greek term as ‘ഹാദേസ്.’ ‘ഗെഹെന്ന’ should be clarified as ‘ഗെഹെന്നാ.’
  issues:
  - severity: low
    issue: Postposition spacing
    rationale: Modern standard Malayalam normally writes ‘വരെ’ separately in these noun-plus-postposition expressions.
  - severity: low
    issue: Footnote terminology/transliteration
    rationale: ‘ഹാദേസ്’ more closely represents ᾅδης in Malayalam, and ‘ഗെഹെന്നാ’ is the clearer transliteration of Γέεννα.
  revised_text: കഫർന്നഹൂമേ, നീ സ്വർഗം വരെ ഉയർത്തപ്പെടുമോ? നീ പാതാളം വരെ താഴ്ത്തപ്പെടും.[a]
