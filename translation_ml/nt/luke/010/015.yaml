id: LUK.10.15
reference: Luke 10:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: ml
  text: കഫർന്നഹൂമേ, നീ സ്വർഗം വരെ ഉയർത്തപ്പെടുമോ? നീ പാതാളം വരെ താഴ്ത്തപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മരിച്ചവരുടെ ലോകം വരെ.” ഗ്രീക്കിൽ “ഹാദേസ്”; ഇത് ഗെഹെന്നാ (“നരകം”) അല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: കഫർന്നഹൂം
  rationale: സ്ഥലനാമം മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു; സംബോധനയിൽ ‘കഫർന്നഹൂമേ’ എന്നു രൂപപ്പെടുത്തി.
- source_word: μὴ ... ὑψωθήσῃ
  choice: നീ ... ഉയർത്തപ്പെടുമോ?
  rationale: μή ചേർന്ന ചോദ്യം നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യമായി നിലനിർത്തുന്നു. ‘ഉയർത്തപ്പെടുക’ എന്നത് ക്രിയയുടെ കർമണിപ്രയോഗവും ഉയർന്ന നിലയിലേക്കുള്ള ഉയർച്ചയും സംരക്ഷിക്കുന്നു.
- source_word: ἕως οὐρανοῦ
  choice: സ്വർഗംവരെ
  rationale: ἕως സഹിതമുള്ള പരിധിബോധവും മുകളിലേക്കുള്ള ദൃശ്യരൂപവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἕως τοῦ ᾅδου
  choice: പാതാളംവരെ
  rationale: ᾅδης മരിച്ചവരുടെ ലോകത്തെ സൂചിപ്പിക്കുന്നു; ഗെഹെന്നയുമായി അതിനെ ലയിപ്പിക്കാതെ മലയാളത്തിൽ പരിചിതമായ ‘പാതാളം’ ഉപയോഗിച്ചു.
- source_word: καταβιβασθήσῃ
  choice: നീ ... താഴ്ത്തപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുകയും താഴേക്കിറക്കപ്പെടുന്നതിലെ അപമാനത്തിന്റെയും ന്യായവിധിയുടെയും ഭാവം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ᾅδης എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാതാളം
  alternative: മരിച്ചവരുടെ ലോകം; നരകം
  rationale: ᾅδης എന്നത് ഗെഹെന്നയല്ല. അതിനാൽ അന്തിമ ശിക്ഷാസ്ഥലം എന്ന ആശയം മുൻകൂട്ടി ചുമത്താവുന്ന ‘നരകം’ ഒഴിവാക്കി, മൂലപദത്തിന്റെ വ്യത്യാസം സൂക്ഷിക്കുന്ന ‘പാതാളം’ തിരഞ്ഞെടുത്തു; വിശദീകരണപരമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: μὴ ... ὑψωθήσῃ എന്ന ഘടന
  choice: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യം
  alternative: ‘നീ ഉയർത്തപ്പെടുകയില്ല’ എന്ന പ്രസ്താവന
  rationale: ഗ്രീക്ക് ചോദ്യരൂപം സംരക്ഷിക്കുന്നത് വാക്യത്തിന്റെ വാചാടോപശക്തിയും തുടർന്നുള്ള വിധിപ്രസ്താവനയുമായുള്ള സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘സ്വർഗംവരെ/പാതാളംവരെ’ എന്ന സമാന്തരഘടന മൂലത്തിലെ ലംബവൈരുധ്യം നിലനിർത്തുന്നു.
