id: LUK.10.9
reference: Luke 10:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: ml
  text: അവിടെയുള്ള രോഗികളെ സുഖപ്പെടുത്തുക. അവരോട്, “ദൈവരാജ്യം നിങ്ങൾക്ക് അടുത്തെത്തിയിരിക്കുന്നു[a]” എന്നു പറയുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ അടുത്തേക്ക് വന്നിരിക്കുന്നു.”
    reason: ἤγγικεν ἐφ’ ὑμᾶς എന്ന പ്രയോഗത്തിന്റെ ചലനവും സമീപത്വവും മറ്റൊരു സ്വാഭാവിക മലയാളരീതിയിൽ പ്രകടിപ്പിക്കുന്ന പദവികൽപം.
lexical_decisions:
- source_word: θεραπεύετε
  choice: സുഖപ്പെടുത്തുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം ശിഷ്യന്മാർ നിർവഹിക്കേണ്ട പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. രോഗസന്ദർഭത്തിൽ ‘സുഖപ്പെടുത്തുക’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്; ‘പരിചരിക്കുക’ എന്നത് അർഥത്തിൽ അതിവിശാലമാണ്.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: അവിടെയുള്ള രോഗികളെ
  rationale: ἀσθενεῖς എന്നതിന് ‘ദുർബലർ’ എന്നും ‘രോഗികൾ’ എന്നും അർഥമുണ്ടാകാം; θεραπεύετε എന്ന ക്രിയയോടൊപ്പം ഇവിടെ ശാരീരികരോഗമാണ് മുഖ്യമായ അർഥം. ἐν αὐτῇ മുൻവാക്യത്തിലെ പട്ടണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവിടെയുള്ള’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: λέγετε αὐτοῖς
  choice: അവരോട് … എന്നു പറയുക
  rationale: ഗ്രീക്കിലെ ലളിതവും നേരിട്ടുള്ളതുമായ സംസാരാജ്ഞയെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ἤγγικεν
  choice: അടുത്തെത്തിയിരിക്കുന്നു
  rationale: പൂർണകാലരൂപം സമീപിച്ചുകഴിഞ്ഞ സംഭവത്തെയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയെയും ഒരുമിച്ചു സൂചിപ്പിക്കുന്നു. ‘അടുത്തെത്തിയിരിക്കുന്നു’ ഈ രണ്ടു ഭാവങ്ങളും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐφ’ ὑμᾶς
  choice: നിങ്ങൾക്ക്
  rationale: ἐγγίζω എന്ന ക്രിയയോടൊപ്പം ഈ പ്രയോഗം കേൾക്കുന്നവരോടുള്ള സമീപനത്തെ സൂചിപ്പിക്കുന്നു. ‘നിങ്ങൾക്ക്’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘നിങ്ങളുടെമേൽ’ ഇവിടെ അനാവശ്യമായി കഠിനമോ പ്രതികൂലമോ ആയി തോന്നാം.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: ദൈവത്തിന്റെ രാജത്വത്തെയും രാജ്യത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന, സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ബൈബിൾപ്രയോഗമാണിത്.
theological_decisions:
- issue: ദൈവരാജ്യത്തിന്റെ സമീപനത്തെക്കുറിച്ചുള്ള പ്രഖ്യാപനത്തിന്റെ അർഥം
  choice: ദൈവരാജ്യം കേൾക്കുന്നവർക്ക് അടുത്തെത്തിയതായി പ്രഖ്യാപിക്കുന്നു; അത് ഇപ്പോൾ പൂർണമായി സാക്ഷാത്കരിച്ചുവെന്നോ ഭാവിയിൽ മാത്രമുള്ളതെന്നോ പരിഭാഷ തീരുമാനിക്കുന്നില്ല.
  alternative: ‘ദൈവരാജ്യം ഇപ്പോൾ പൂർണമായി വന്നിരിക്കുന്നു’ എന്നോ ‘അത് സമീപഭാവിയിൽ വരാനിരിക്കുകയാണ്’ എന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: Ἤγγικεν എന്ന പൂർണകാലരൂപം സംഭവിച്ച സമീപനവും ഇപ്പോഴത്തെ പ്രസക്തിയും സൂചിപ്പിക്കുന്നുവെങ്കിലും, ആരംഭിച്ച സാക്ഷാത്കാരവും ഭാവിയിലെ പൂർത്തീകരണവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം ഈ വാക്യം സ്വയം പൂർണമായി തീർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. മുൻവാക്യത്തിലെ പട്ടണത്തെ ‘അവിടെയുള്ള’ എന്ന പ്രയോഗംകൊണ്ട് സ്വാഭാവികമായി തിരിച്ചുസൂചിപ്പിച്ചു; ദൈവരാജ്യത്തിന്റെ ഇപ്പോഴത്തെ സമീപത്വവും ഭാവിയിലെ പൂർത്തീകരണവും തമ്മിലുള്ള പിരിമുറുക്കം വ്യാഖ്യാനിച്ച് തീർത്തിട്ടില്ല.
