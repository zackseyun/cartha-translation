review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Martha’s ongoing distraction, her approach to Jesus, the complaint that her sister left her serving alone, and the request for shared help. However, «പരിചരണകാര്യങ്ങളാൽ» can sound causally instrumental (“because of care-related matters”) and is less direct than the Greek’s involvement in much household service. «തനിച്ചു പരിചരിക്കാൻ» is also slightly less clear than a form that explicitly says she was left alone to do the serving.
  naturalness: The register is generally modern, respectful, and fluent. A small revision makes the opening more idiomatic and makes the ‘alone’ construction unambiguous in Malayalam.
  terminology: «കർത്താവേ» appropriately renders Κύριε. «സേവനം» is suitable here when qualified by the domestic context and avoids importing a formal ecclesial sense. «അങ്ങേക്കു കാര്യമില്ലേ?» naturally retains the complaint in οὐ μέλει σοι without excessive emotional strengthening.
  issues:
  - severity: low
    issue: «ഒട്ടേറെ പരിചരണകാര്യങ്ങളാൽ» is somewhat indirect and may imply cause rather than Martha’s preoccupation with much service.
    rationale: περὶ πολλὴν διακονίαν denotes being occupied with much serving. «ഒട്ടേറെ സേവനകാര്യങ്ങളിൽ ... ശ്രദ്ധ ചിതറിയിരുന്നു» more directly preserves that relation.
  - severity: low
    issue: «എന്നെ തനിച്ചു പരിചരിക്കാൻ വിട്ടിരിക്കുന്നതിൽ» can momentarily leave unclear whether ‘alone’ modifies Martha or the care activity.
    rationale: 'μόνην modifies ‘me’: Martha was left alone to serve. «എന്നെ തനിച്ചാക്കി സേവനം ചെയ്യാൻ വിട്ടിരിക്കുന്നതിൽ» states this clearly and naturally.'
