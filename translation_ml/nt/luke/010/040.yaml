revisions:
- from: 'എന്നാൽ ഒട്ടേറെ പരിചരണകാര്യങ്ങളാൽ മാർത്തയുടെ ശ്രദ്ധ ചിതറിപ്പോയിരുന്നു. അവൾ അടുത്തുവന്ന് പറഞ്ഞു: “കർത്താവേ, എന്റെ സഹോദരി എന്നെ തനിച്ചു പരിചരിക്കാൻ വിട്ടിരിക്കുന്നതിൽ അങ്ങേക്കു കാര്യമില്ലേ?[a] അതുകൊണ്ട്, എന്നെ സഹായിക്കാൻ അവളോടു പറയണമേ.”'
  to: 'എന്നാൽ, ഒട്ടേറെ സേവനകാര്യങ്ങളിൽ മാർത്തയുടെ ശ്രദ്ധ ചിതറിയിരുന്നു. അവൾ അടുത്തുചെന്ന് പറഞ്ഞു: “കർത്താവേ, എന്റെ സഹോദരി എന്നെ തനിച്ചാക്കി സേവനം ചെയ്യാൻ വിട്ടിരിക്കുന്നതിൽ അങ്ങേക്കു കാര്യമില്ലേ?[a] അതുകൊണ്ട്, അവൾ എന്നെ സഹായിക്കേണ്ടതിന് അവളോടു പറയണമേ.”'
  rationale: The revision retains every element of the Greek and the English audit trail while improving Malayalam idiom. It renders Martha as distracted amid much service rather than distracted causally by care-related matters, and it explicitly attaches ‘alone’ to Martha, as μόνην με requires. The respectful address and the domestic, non-ecclesial sense of διακονία are retained.
  reviewer_model: gpt-5.6-terra
