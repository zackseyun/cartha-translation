id: LUK.10.40
reference: Luke 10:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: ml
  text: 'എന്നാൽ, ഒട്ടേറെ സേവനകാര്യങ്ങളിൽ മാർത്തയുടെ ശ്രദ്ധ ചിതറിയിരുന്നു. അവൾ അടുത്തുചെന്ന് പറഞ്ഞു: “കർത്താവേ, എന്റെ സഹോദരി എന്നെ തനിച്ചാക്കി സേവനം ചെയ്യാൻ വിട്ടിരിക്കുന്നതിൽ അങ്ങേക്കു കാര്യമില്ലേ?[a] അതുകൊണ്ട്, അവൾ എന്നെ സഹായിക്കേണ്ടതിന് അവളോടു പറയണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ സഹോദരി എന്നെ മാത്രം സേവനം ചെയ്യാൻ വിട്ടിരിക്കുന്നതിൽ അങ്ങ് കരുതുന്നില്ലേ?”
    reason: οὐ μέλει σοι എന്നതിന് ‘അങ്ങേക്കു കാര്യമില്ലേ?’ എന്നും ‘അങ്ങ് കരുതുന്നില്ലേ?’ എന്നും സ്വാഭാവികമായ അർഥസാധ്യതകളുണ്ട്. μόνην എന്നത് മാർത്തയെ ‘തനിച്ച്/മാത്രം’ സേവനം ചെയ്യാൻ വിട്ടുവെന്ന ആശയം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: ശ്രദ്ധ ചിതറിപ്പോയിരുന്നു
  rationale: അപൂർണകാലത്തിലെ മധ്യ/കർമണി രൂപം, പല കാര്യങ്ങളിലേക്കു വലിച്ചിഴയ്ക്കപ്പെട്ടതുപോലെ തുടർന്നിരുന്ന ശ്രദ്ധാഭംഗത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ മറിയയുടെ ഏകാഗ്രശ്രദ്ധയുമായുള്ള വൈരുധ്യവും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: περὶ πολλὴν διακονίαν
  choice: ഒട്ടേറെ പരിചരണകാര്യങ്ങളാൽ
  rationale: ഇവിടെ διακονία ഔദ്യോഗിക ശുശ്രൂഷയല്ല, വീട്ടിലെ അതിഥിപരിചരണവുമായി ബന്ധപ്പെട്ട പ്രായോഗിക സേവനമാണ്. ‘പരിചരണകാര്യങ്ങൾ’ ആ സന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘ഒട്ടേറെ’ πολλήν എന്നതിന്റെ വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: ἐπιστᾶσα
  choice: അവൾ അടുത്തുവന്ന്
  rationale: സംസാരിക്കുന്നതിനുമുമ്പ് അടുത്തേക്കു വരുകയോ സമീപത്തു നിൽക്കുകയോ ചെയ്തതിനെ പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്നു. ‘അടുത്തുവന്ന്’ ആ ചലനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള ആദരപൂർവമായ സംബോധനയായ κύριε എന്നതിന്റെ പതിവും സന്ദർഭോചിതവുമായ മലയാളരൂപമാണിത്.
- source_word: οὐ μέλει σοι
  choice: അങ്ങേക്കു കാര്യമില്ലേ?
  rationale: ഒരു കാര്യം ഒരാളുടെ ശ്രദ്ധയ്ക്കോ പരിഗണനയ്ക്കോ വിഷയമാകുന്നില്ലേയെന്ന പരാതിഭാവമുള്ള ചോദ്യം ഈ പ്രയോഗം നിലനിർത്തുന്നു; വികാരത്തിന്റെ തീവ്രത അനാവശ്യമായി വർധിപ്പിക്കുന്നില്ല.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: എന്നെ തനിച്ചു പരിചരിക്കാൻ വിട്ടിരിക്കുന്നതിൽ
  rationale: μόνην എന്ന ‘തനിച്ച്’ എന്ന ആശയവും διακονεῖν എന്ന പ്രായോഗിക പരിചരണപ്രവൃത്തിയും നിലനിർത്തുന്നു. ‘ഉപേക്ഷിച്ചു’ എന്ന കൂടുതൽ കടുത്ത പദം ഒഴിവാക്കി.
- source_word: εἰπὲ οὖν αὐτῇ
  choice: അതുകൊണ്ട് ... അവളോടു പറയണമേ
  rationale: οὖν എന്ന നിഗമനബന്ധം ‘അതുകൊണ്ട്’ നിലനിർത്തുന്നു. കല്പനാരൂപത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവം സൂക്ഷിക്കുമ്പോഴും, കർത്താവിനോടുള്ള മലയാളത്തിലെ ആദരസംബോധനയ്ക്ക് യോജിച്ച ‘പറയണമേ’ ഉപയോഗിക്കുന്നു.
- source_word: συναντιλάβηται
  choice: എന്നെ സഹായിക്കാൻ
  rationale: മറ്റൊരാളോടൊപ്പം ചുമതല ഏറ്റെടുത്ത് സഹായിക്കുക എന്ന അർഥമാണ് ക്രിയയ്ക്കുള്ളത്. സന്ദർഭത്തിൽ പങ്കുചേർന്നുള്ള സഹായം വ്യക്തമായതിനാൽ ലളിതവും സ്വാഭാവികവുമായ ഈ രൂപം മതിയാകുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള മാർത്തയുടെ κύριε എന്ന സംബോധന
  choice: കർത്താവേ
  alternative: ഗുരുവേ / യജമാനനേ
  rationale: ‘കർത്താവേ’ ആദരപൂർവമായ നേരിട്ടുള്ള സംബോധനയും ലൂക്കോസിന്റെ രചനയിലെ യേശുവിനെക്കുറിച്ചുള്ള വിപുലമായ κύριος പ്രയോഗവും തുറന്നുവയ്ക്കുന്നു. ‘ഗുരുവേ’ എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തുന്നത് പദത്തിന്റെ അർഥപരിധി അനാവശ്യമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വീട്ടിലെ അതിഥിപരിചരണസന്ദർഭം വ്യക്തമാക്കാൻ ‘പരിചരണം’ ഉപയോഗിച്ചു; സഭാപരമായ ഔദ്യോഗിക ‘ശുശ്രൂഷ’ എന്ന ധ്വനി ഒഴിവാക്കി. യേശുവിനെ ‘അങ്ങ്’ എന്നു ആദരപൂർവം അഭിസംബോധന ചെയ്തു.
