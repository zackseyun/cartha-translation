id: LUK.10.23
reference: Luke 10:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: ml
  text: 'ശിഷ്യന്മാരോടു തിരിഞ്ഞ് അവരോടു പ്രത്യേകമായി പറഞ്ഞു: “നിങ്ങൾ കാണുന്നതു കാണുന്ന കണ്ണുകൾ അനുഗൃഹീതമാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: തിരിഞ്ഞ്
  rationale: സംസാരിക്കുന്നതിനുമുമ്പുള്ള യേശുവിന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാവിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: κατ’ ἰδίαν
  choice: സ്വകാര്യമായി
  rationale: മറ്റുള്ളവരിൽനിന്ന് വേർതിരിച്ച് ശിഷ്യന്മാരോടു മാത്രം പറഞ്ഞുവെന്ന അർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: μαθητάς
  choice: ശിഷ്യന്മാർ
  rationale: പഠിതാക്കളും അനുയായികളും എന്ന ബന്ധപരവും പ്രബോധനപരവുമായ അർഥം സൂക്ഷിക്കുന്ന പ്രമാണിക പുതിയനിയമ പദം.
- source_word: Μακάριοι
  choice: അനുഗൃഹീതം
  rationale: വെറും മാനസിക സന്തോഷമല്ല, ദൈവിക അനുഗ്രഹത്തിന്റെ നിലയെ പ്രഖ്യാപിക്കുന്ന beatitude-സ്വഭാവം നിലനിർത്തുന്നു; ഇവിടെ ബഹുവചനമായ ‘കണ്ണുകൾ’ എന്നതോടു ചേർന്ന വിധേയവിശേഷണമായി ഉപയോഗിക്കുന്നു.
- source_word: ὀφθαλμοὶ
  choice: കണ്ണുകൾ
  rationale: കാണാൻ കൃപലഭിച്ചവരെ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിലെ സജീവമായ metonymic ദൃശ്യരൂപം വിശദീകരിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: οἱ βλέποντες
  choice: കാണുന്ന
  rationale: കണ്ണുകളെ വിശേഷിപ്പിക്കുന്ന articular present participle-ന്റെ വിവരണാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἃ βλέπετε
  choice: നിങ്ങൾ കാണുന്നതു
  rationale: relative pronoun-ഉം present verb-ഉം ചേർന്ന പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം അനാവശ്യ വിപുലീകരണമില്ലാതെ നൽകുന്നു.
theological_decisions:
- issue: അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ ശക്തി
  choice: യേശുവിന്റെ പ്രവൃത്തികളും വെളിപ്പാടും കാണാനുള്ള ശിഷ്യന്മാരുടെ പ്രത്യേക ഭാഗ്യത്തെക്കുറിച്ചുള്ള അനുഗ്രഹപ്രഖ്യാപനം
  alternative: വെറും വികാരപരമായ സന്തോഷപ്രസ്താവന
  rationale: μακάριοι ഇവിടെ അനുഗ്രഹവാക്യസദൃശമായ ദൈവിക അനുകൂലതയെ പ്രഖ്യാപിക്കുന്നു; അതിനെ കേവലം ‘സന്തോഷമുള്ള’ എന്ന് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ‘കണ്ണുകൾ’ എന്ന ദൃശ്യരൂപവും κατ’ ἰδίαν എന്നതിന്റെ സ്വകാര്യ അഭിസംബോധനയും നിലനിർത്തിയിരിക്കുന്നു.
