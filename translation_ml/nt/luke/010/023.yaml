    text: അഥവാ “സ്വകാര്യമായി.”
    reason: lexical_alternative
  revision_rationale: The revision corrects plural agreement, improves the idiomatic Malayalam expression of Jesus turning to and addressing the disciples apart from others, and preserves the Greek imagery and beatitude force without interpretive expansion.
