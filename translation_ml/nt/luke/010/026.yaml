source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτόν· Ἐν τῷ νόμῳ τί γέγραπται; πῶς ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: ml
  text: 'അവൻ അവനോട് പറഞ്ഞു: “ന്യായപ്രമാണത്തിൽ എന്താണ് എഴുതിയിരിക്കുന്നത്? നീ അത് എങ്ങനെ വായിക്കുന്നു?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ അത് എങ്ങനെ വ്യാഖ്യാനിക്കുന്നു?” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ, “നീ അത് എങ്ങനെ വായിക്കുന്നു?” എന്നാണ്; മനസ്സിലാക്കുക അല്ലെങ്കിൽ വ്യാഖ്യാനിക്കുക എന്ന അർഥവും ഇതിൽ ഉൾപ്പെട്ടേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: അവൻ
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേക വൈരുധ്യം സൂചിപ്പിക്കാതെ സ്വാഭാവികമായി വിട്ടിരിക്കുന്നു. ആർട്ടിക്കിൾ സന്ദർഭത്തിൽ സർവനാമസമാനമായി കർത്താവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: εἶπεν πρὸς αὐτόν
  choice: അവൻ അവനോട് പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയെയും πρός + ദ്വിതീയാവിഭക്തി സൂചിപ്പിക്കുന്ന അഭിസംബോധിതനെയും അധിക അർഥം ചേർക്കാതെ നേരിട്ട് പകരുന്നു.
- source_word: Ἐν τῷ νόμῳ
  choice: ന്യായപ്രമാണത്തിൽ
  rationale: νόμος ഇവിടെ ഇസ്രായേലിന് ലഭിച്ച അംഗീകൃത തിരുവെഴുത്തായ ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും പ്രത്യേകവുമായ പ്രയോഗമാണിത്.
- source_word: τί γέγραπται
  choice: എന്താണ് എഴുതിയിരിക്കുന്നത്
  rationale: γέγραπται എന്ന സമ്പൂർണ്ണ നിഷ്ക്രിയരൂപം എഴുതപ്പെട്ടത് ഇപ്പോഴും രേഖയായി നിലനിൽക്കുന്നു എന്ന ഭാവം നൽകുന്നു; ഈ മലയാളരൂപം അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: വായനയുടെ രീതിയെയോ അതിലൂടെ ഗ്രഹിക്കുന്ന അർഥത്തെയോ തുറന്ന നിലയിൽ ചോദിക്കുന്ന πῶς എന്ന പദത്തിന്റെ നേരിട്ടുള്ള തുല്യപ്രയോഗം.
- source_word: ἀναγινώσκεις
  choice: നീ അത് എങ്ങനെ വായിക്കുന്നു
  rationale: ക്രിയയുടെ പ്രാഥമിക അർഥമായ ‘വായിക്കുക’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘മനസ്സിലാക്കുക/വ്യാഖ്യാനിക്കുക’ എന്ന സൂചന ഉണ്ടാകാമെന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: νόμος എന്ന പദത്തിന്റെ സൂചന
  choice: ഇസ്രായേലിന് ലഭിച്ച അംഗീകൃത തിരുവെഴുത്തായ ന്യായപ്രമാണം
  alternative: പൊതുവായ അർഥത്തിലുള്ള നിയമം; തോറാ
  rationale: സംഭാഷണം ന്യായപ്രമാണപണ്ഡിതനോടാണ്; അതിനാൽ പൊതുനിയമമല്ല, യഹൂദരുടെ തിരുവെഴുത്തിലെ ന്യായപ്രമാണമാണ് ഉദ്ദേശ്യം. ‘ന്യായപ്രമാണം’ ഈ പ്രത്യേകത നിലനിർത്തുന്നു.
- issue: πῶς ἀναγινώσκεις എന്നതിലെ വ്യാഖ്യാനസൂചന
  choice: മുഖ്യപാഠത്തിൽ ‘നീ അത് എങ്ങനെ വായിക്കുന്നു?’
  alternative: ‘നീ അത് എങ്ങനെ വ്യാഖ്യാനിക്കുന്നു?’
  rationale: ചോദ്യം വെറും ഉച്ചരിച്ചുവായനയെക്കാൾ ഗ്രഹിക്കലിനെയും വ്യാഖ്യാനത്തെയും ഉൾക്കൊള്ളാം; എങ്കിലും ഗ്രീക്ക് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘വായിക്കുക’ എന്നതാണ്. അതിനാൽ പാഠത്തിന്റെ അർഥവ്യാപ്തി ചുരുക്കാതെ അക്ഷരാർഥം മുഖ്യപാഠത്തിലും വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ തിരുവെഴുത്തുപദം പ്രത്യേകമായ യഹൂദ തിരുവെഴുത്തുസൂചന നിലനിർത്താൻ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തിച്ച സർവനാമങ്ങൾ അധിക തിരിച്ചറിയൽ ചേർക്കാതെ സംരക്ഷിച്ചു.
