id: LUK.10.3
reference: Luke 10:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: ml
  text: പോകുവിൻ; ഇതാ, ചെന്നായ്ക്കളുടെ നടുവിൽ കുഞ്ഞാടുകളെപ്പോലെ[a] ഞാൻ നിങ്ങളെ അയയ്ക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പരിചിത വിവർത്തനങ്ങളിൽ ‘ആടുകളെപ്പോലെ’ എന്നു കാണാം; എന്നാൽ ഇവിടെ ഗ്രീക്ക് മൂലപാഠം പ്രത്യേകമായി ‘കുഞ്ഞാടുകൾ’ എന്നാണ് പറയുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπάγετε
  choice: പോകുവിൻ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന വർത്തമാനകാല ആജ്ഞാരൂപം. ദൗത്യത്തിന് അയയ്ക്കുന്ന സന്ദർഭത്തിലെ ചുരുക്കവും ഗൗരവമുള്ളതുമായ കല്പനയായി ‘പോകുവിൻ’ സ്വാഭാവികമാണ്.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: തുടർന്ന് പറയുന്നതിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരകണം. ‘ഇതാ’ അതിന്റെ സൂചനാത്മക ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀποστέλλω
  choice: അയയ്ക്കുന്നു
  rationale: ഒന്നാം പുരുഷ ഏകവചന വർത്തമാനകാല ക്രിയ. ദൗത്യസന്ദർഭം വാക്യത്തിൽനിന്നുതന്നെ വ്യക്തമാകുന്നതിനാൽ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘നിയോഗിക്കുന്നു’ എന്നതിനെക്കാൾ ‘അയയ്ക്കുന്നു’ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന കർമസർവനാമം. ‘നിങ്ങളെ’ ബഹുവചനസംബോധന സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὡς
  choice: -പോലെ
  rationale: താദാത്മ്യമല്ല, ഉപമയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘-പോലെ’ ഈ താരതമ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: ἄρνας
  choice: കുഞ്ഞാടുകൾ
  rationale: ἀρήν എന്ന പദത്തിന്റെ ബഹുവചനം; പൊതുവായ ‘ആടുകൾ’ എന്നതിനു പകരം ‘കുഞ്ഞാടുകൾ’ എന്നു നൽകുന്നത് മൂലപാഠത്തിലെ പ്രായവും നിസ്സഹായതയും സൂചിപ്പിക്കുന്ന ദൃശ്യബിംബം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐν μέσῳ λύκων
  choice: ചെന്നായ്ക്കളുടെ നടുവിൽ
  rationale: ‘ചെന്നായ്ക്കളുടെ മധ്യത്തിൽ/നടുവിൽ’ എന്ന സ്ഥലബന്ധം നേരിട്ട് നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘നടുവിൽ’ സ്വാഭാവികവും ദൃശ്യബിംബം വ്യക്തമായി പകരുന്നതുമാണ്.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ ദൗത്യത്തെ വിവരിക്കുന്ന മൃഗോപമ
  choice: ‘ചെന്നായ്ക്കളുടെ നടുവിൽ കുഞ്ഞാടുകളെപ്പോലെ’ എന്ന ഉപമ അതേപടി നിലനിർത്തി.
  alternative: ‘ചെന്നായ്ക്കളുടെ ഇടയിൽ ആടുകളെപ്പോലെ’
  rationale: ഗ്രീക്കിൽ പൊതുവായ ‘ആടുകൾ’ എന്നർഥമുള്ള πρόβατα അല്ല, പ്രത്യേകമായി ‘കുഞ്ഞാടുകൾ’ എന്നർഥമുള്ള ἄρνας ആണ്. അതിനാൽ സമാനമായ മറ്റു വചനങ്ങളോടോ പരിചിതമായ വിവർത്തനങ്ങളോടോ ഒത്തുചേർക്കാതെ ഇവിടെ ഊന്നിപ്പറയുന്ന നിസ്സഹായത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പോകുവിൻ’ എന്നത് ബഹുവചന ആജ്ഞയുടെ സംക്ഷിപ്തതയും ദൗത്യവചനത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു; ‘ഇതാ’ ശ്രദ്ധാകർഷക കണത്തിന്റെ ഊന്നൽ പകരുന്നു. വാക്യക്രമം മലയാളത്തിലെ വായനാസൗകര്യത്തിന് അനുയോജ്യമാക്കിയെങ്കിലും മൂലപാഠത്തിലെ ഉപമയും സ്ഥലബന്ധവും സംരക്ഷിച്ചു.
