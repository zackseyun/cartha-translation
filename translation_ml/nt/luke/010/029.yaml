id: LUK.10.29
reference: Luke 10:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: ml
  text: 'എന്നാൽ, തന്നെത്തന്നെ നീതീകരിക്കാൻ ആഗ്രഹിച്ച അയാൾ യേശുവിനോട്: “എന്റെ അയൽക്കാരൻ[a] ആരാണ്?” എന്നു ചോദിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരെയാണ് എന്റെ അയൽക്കാരനായി കണക്കാക്കേണ്ടത്?”
    reason: πλησίον ഉപയോഗിച്ചുള്ള ചോദ്യം അയൽക്കാരന്റെ പരിധി നിർവചിക്കാനുള്ള ശ്രമമായി മനസ്സിലാക്കാവുന്നതാണ്; ഈ വ്യാഖ്യാനസാധ്യത മുഖ്യവാചകത്തെ മാറ്റാതെ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: θέλων
  choice: ആഗ്രഹിച്ച
  rationale: വർത്തമാനകാല കൃ非ന്തം അയാളുടെ ഉദ്ദേശ്യമോ പ്രേരണയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ കാരണസംബന്ധം നിലനിർത്തുന്നു.
- source_word: δικαιῶσαι ἑαυτὸν
  choice: തന്നെത്താൻ നീതീകരിക്കാൻ
  rationale: സ്വയം ശരിയാണെന്നു കാണിക്കാനുള്ള ശ്രമമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്. ‘നീതീകരിക്കുക’ എന്നത് δικαιόω എന്ന പദവുമായുള്ള ബന്ധം നിലനിർത്തുമ്പോഴും ഇവിടെ സാങ്കേതിക പൗലോസീയ അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: യേശുവിനോട് … എന്നു ചോദിച്ചു
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞു’ എന്നാണെങ്കിലും നേരിട്ടുള്ള വാക്യം ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: Καὶ
  choice: അപ്പോൾ
  rationale: തുടർചോദ്യം അവതരിപ്പിക്കുന്ന സംഭാഷണപ്രവാഹം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘പിന്നെ/അപ്പോൾ’ എന്ന ആശയസാധ്യത നിലനിർത്തുന്നു.
- source_word: τίς ἐστίν μου πλησίον
  choice: ആരാണ് എന്റെ അയൽക്കാരൻ
  rationale: πλησίον ഇവിടെ നാമസദൃശമായി ‘അയൽക്കാരൻ’ എന്ന അർഥത്തിൽ വരുന്നു; സമീപത്തെ തോറാ ഉദ്ധരണിയുമായുള്ള പദബന്ധവും നേരിട്ടുള്ള ചോദ്യരൂപവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: δικαιῶσαι ἑαυτόν എന്നതിന്റെ അർഥം
  choice: തന്നെത്താൻ നീതീകരിക്കാൻ
  alternative: താൻ ശരിയാണെന്നു കാണിക്കാൻ; മറ്റുള്ളവരുടെ മുമ്പിൽ സ്വയം ന്യായീകരിക്കാൻ
  rationale: നിയമ-ധാർമിക സംഭാഷണത്തിന്റെ പശ്ചാത്തലത്തിൽ, അയാൾ സ്വയം ശരിയാണെന്നു തെളിയിക്കാനോ കുറ്റമില്ലാത്തവനായി കാണിക്കാനോ ശ്രമിക്കുന്നതാണ്. വിവർത്തനം പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനി ഇല്ലാതാക്കുന്നില്ല; അതേസമയം സാങ്കേതികമായ നീതീകരണസിദ്ധാന്തം ഇവിടെ അടിച്ചേൽപ്പിക്കുന്നുമില്ല.
- issue: ‘എന്റെ അയൽക്കാരൻ’ എന്ന ചോദ്യത്തിന്റെ വ്യാപ്തി
  choice: നേരിട്ടുള്ള ‘ആരാണ് എന്റെ അയൽക്കാരൻ?’ എന്ന രൂപം
  alternative: ‘ആരെയാണ് എന്റെ അയൽക്കാരനായി കണക്കാക്കേണ്ടത്?’
  rationale: ഗ്രീക്കിന്റെ നേരിട്ടുള്ള രൂപം നിലനിർത്തുന്നു. ആരൊക്കെയാണ് ആ വിഭാഗത്തിൽ ഉൾപ്പെടുന്നത് എന്ന പ്രായോഗിക സൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു; മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനം ചേർത്ത് അനിശ്ചിതത്വം പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘തന്നെത്താൻ നീതീകരിക്കാൻ’ എന്ന പ്രയോഗം മൂലപദത്തിന്റെ രൂപവും സന്ദർഭത്തിലെ സ്വയം ന്യായീകരണഭാവവും നിലനിർത്തുന്നു; സംഭാഷണത്തിൽ ‘അപ്പോൾ’യും ‘ചോദിച്ചു’യും സ്വാഭാവിക പ്രവാഹം നൽകുന്നു.
