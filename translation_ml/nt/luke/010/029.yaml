  to: 'എന്നാൽ, തന്നെത്തന്നെ നീതീകരിക്കാൻ ആഗ്രഹിച്ച അയാൾ യേശുവിനോട്: “എന്റെ അയൽക്കാരൻ[a] ആരാണ്?” എന്നു ചോദിച്ചു.'
