id: LUK.10.30
reference: Luke 10:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: ml
  text: 'യേശു മറുപടിയായി പറഞ്ഞു: “ഒരാൾ യെരൂശലേമിൽനിന്ന് യെരീഹോയിലേക്ക് ഇറങ്ങിപ്പോകുകയായിരുന്നു. അയാൾ കവർച്ചക്കാരുടെ കയ്യിൽപ്പെട്ടു. അവർ അയാളുടെ വസ്ത്രങ്ങൾ ഉരിഞ്ഞെടുത്ത് അയാളെ മർദിച്ചു; പാതി മരിച്ച നിലയിൽ ഉപേക്ഷിച്ചിട്ടു പോയി.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ
  choice: മറുപടിയായി
  rationale: സംഭാഷണസന്ദർഭത്തിൽ യേശു ചോദ്യം ഏറ്റെടുത്ത് ഉത്തരം പറയുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ἄνθρωπός τις
  choice: ഒരാൾ
  rationale: അജ്ഞാതനായ ഒരു മനുഷ്യനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ തുല്യം.
- source_word: κατέβαινεν
  choice: ഇറങ്ങിപ്പോകുകയായിരുന്നു
  rationale: യെരൂശലേമിൽനിന്ന് യെരീഹോയിലേക്കുള്ള ഇറക്കം സൂചിപ്പിക്കുകയും അപൂർണ ഭൂതകാലത്തിന്റെ പുരോഗമനഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λῃσταῖς
  choice: കവർച്ചക്കാർ
  rationale: വഴിയിൽ ആക്രമിച്ച് കൊള്ളയടിക്കുന്നവരെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐκδύσαντες αὐτὸν
  choice: അയാളുടെ വസ്ത്രങ്ങൾ ഉരിഞ്ഞെടുത്ത്
  rationale: ഇരയുടെ വസ്ത്രങ്ങൾ ബലമായി എടുത്തുകളഞ്ഞുവെന്ന മൂലപാഠത്തിന്റെ വ്യക്തമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: πληγὰς ἐπιθέντες
  choice: അയാളെ മർദിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘പ്രഹരങ്ങൾ ഏൽപ്പിച്ചു’ എന്ന ആശയം സ്വാഭാവികവും ശക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἡμιθανῆ
  choice: പാതി മരിച്ച നിലയിൽ
  rationale: ‘അർധമൃതൻ’ എന്ന ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു; അയാൾ യഥാർഥത്തിൽ മരിച്ചുവെന്ന് പറയുന്നില്ല.
theological_decisions:
- issue: ആക്രമിക്കപ്പെട്ട മനുഷ്യന്റെ തിരിച്ചറിയൽ
  choice: ഒരാൾ
  alternative: ഒരു യഹൂദൻ
  rationale: മൂലപാഠം ആ മനുഷ്യന്റെ വംശമോ മതപരമായ തിരിച്ചറിയലോ വ്യക്തമാക്കുന്നില്ല; അതിനാൽ അത്തരം വിവരം വിവർത്തനത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. സ്ഥലനാമങ്ങൾക്ക് പ്രചാരത്തിലുള്ള ബൈബിൾ രൂപങ്ങളായ ‘യെരൂശലേം’, ‘യെരീഹോ’ എന്നിവ ഉപയോഗിച്ചു; അനാവശ്യമായി സംസ്കൃതവത്കരിച്ച പദങ്ങൾ ഒഴിവാക്കി.
