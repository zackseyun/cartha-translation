id: LUK.10.25
reference: Luke 10:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: ml
  text: 'അപ്പോൾ, ഇതാ, ന്യായപ്രമാണത്തിൽ പണ്ഡിതനായ ഒരാൾ എഴുന്നേറ്റ് യേശുവിനെ പരീക്ഷിച്ചുകൊണ്ട് ചോദിച്ചു: “ഗുരുവേ, നിത്യജീവൻ അവകാശമായി ലഭിക്കാൻ ഞാൻ എന്തു ചെയ്യണം?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: അപ്പോൾ ഇതാ
  rationale: ആഖ്യാനത്തിലെ തുടർച്ചയും ശ്രദ്ധ ക്ഷണിക്കുന്ന ἰδού എന്ന പ്രയോഗത്തിന്റെ സജീവതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: νομικός τις
  choice: ന്യായപ്രമാണപണ്ഡിതനായ ഒരാൾ
  rationale: ഇവിടെ νομικός ആധുനിക സിവിൽ അഭിഭാഷകനെയല്ല, മോശെയുടെ ന്യായപ്രമാണത്തിൽ വൈദഗ്ധ്യമുള്ള വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്ന വ്യക്തമായ പദപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: ἀνέστη
  choice: എഴുന്നേറ്റുനിന്ന്
  rationale: പ്രവൃത്തിയുടെ ദൃശ്യസ്വഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἐκπειράζων αὐτὸν
  choice: യേശുവിനെ പരീക്ഷിച്ചുകൊണ്ട്
  rationale: പ്രലോഭിപ്പിക്കുക എന്നതിലുപരി പരിശോധിക്കുകയോ കുടുക്കാൻ നോക്കുകയോ ചെയ്യുന്ന ഭാവം ഇവിടെ പ്രസക്തമാണ്; 'പരീക്ഷിച്ചുകൊണ്ട്' ആ അർഥവ്യാപ്തി തുറന്നുവെക്കുന്നു. സർവനാമത്തിന്റെ സൂചിതവ്യക്തി ഒറ്റവാക്യത്തിൽ വ്യക്തമാക്കാൻ 'യേശുവിനെ' എന്നു നൽകി.
- source_word: λέγων
  choice: ചോദിച്ചു
  rationale: തുടർന്നുവരുന്നത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ ഗ്രീക്ക് പങ്കുപദത്തെ സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ ക്രിയയായി പുനഃസംഘടിപ്പിച്ചു.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: അധ്യാപകനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ തുല്യപദം.
- source_word: τί ποιήσας
  choice: ഞാൻ എന്തു ചെയ്യണം
  rationale: പങ്കുപദവും ഭാവികാലക്രിയയും ചേർന്ന ഗ്രീക്ക് ഘടനയുടെ പ്രായോഗിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ചോദിക്കുന്നവന്റെ പ്രവൃത്തികേന്ദ്രിതമായ ചട്ടക്കൂട് മായ്ച്ചുകളയുന്നില്ല.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: സ്ഥിരപ്രയോഗവും കൃത്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പരിഭാഷ.
- source_word: κληρονομήσω
  choice: അവകാശമാക്കാൻ
  rationale: ലഭിക്കുക എന്ന പൊതുവായ അർഥത്തിലേക്ക് ചുരുക്കാതെ അവകാശം/പൈതൃകം ലഭിക്കുന്നതിന്റെ രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: രണ്ടാം ദേവാലയകാല യഹൂദ പശ്ചാത്തലത്തിലെ νομικός എന്ന പദത്തിന്റെ അർഥം
  choice: മോശെയുടെ ന്യായപ്രമാണത്തിൽ വൈദഗ്ധ്യമുള്ളയാളെ സൂചിപ്പിക്കാൻ 'ന്യായപ്രമാണപണ്ഡിതൻ' എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: '''അഭിഭാഷകൻ'' അല്ലെങ്കിൽ ''നിയമപണ്ഡിതൻ'''
  rationale: '''അഭിഭാഷകൻ'' ആധുനിക മതേതര കോടതിവൃത്തിയെ സൂചിപ്പിക്കാനിടയുണ്ട്. ''ന്യായപ്രമാണപണ്ഡിതൻ'' തോറാ വ്യാഖ്യാനത്തിലെ വൈദഗ്ധ്യം കൂടുതൽ കൃത്യമായി വ്യക്തമാക്കുന്നു.'
- issue: τί ποιήσας ... κληρονομήσω എന്നതിലെ പ്രവൃത്തിയും അവകാശവും തമ്മിലുള്ള സംഘർഷം
  choice: '''നിത്യജീവൻ അവകാശമാക്കാൻ ഞാൻ എന്തു ചെയ്യണം?'''
  alternative: '''നിത്യജീവൻ അവകാശമായി ലഭിക്കാൻ ഞാൻ എന്തു ചെയ്യണം?'''
  rationale: ചോദിക്കുന്നവന്റെ പ്രവൃത്തികേന്ദ്രിത രൂപീകരണവും 'അവകാശമാക്കുക' എന്ന പൈതൃകരൂപകവും ഒരുമിച്ച് നിലനിർത്തുന്നു; അവ തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. 'ന്യായപ്രമാണപണ്ഡിതൻ' എന്നത് സാങ്കേതിക അർഥം വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
