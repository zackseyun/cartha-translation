revisions:
- from: 'അപ്പോൾ ഇതാ, ന്യായപ്രമാണപണ്ഡിതനായ ഒരാൾ എഴുന്നേറ്റുനിന്ന് യേശുവിനെ പരീക്ഷിച്ചുകൊണ്ട് ചോദിച്ചു: “ഗുരുവേ, നിത്യജീവൻ അവകാശമാക്കാൻ ഞാൻ എന്തു ചെയ്യണം?”'
  to: 'അപ്പോൾ, ഇതാ, ന്യായപ്രമാണത്തിൽ പണ്ഡിതനായ ഒരാൾ എഴുന്നേറ്റ് യേശുവിനെ പരീക്ഷിച്ചുകൊണ്ട് ചോദിച്ചു: “ഗുരുവേ, നിത്യജീവൻ അവകാശമായി ലഭിക്കാൻ ഞാൻ എന്തു ചെയ്യണം?”'
  rationale: അവകാശമായി ലഭിക്കുക എന്ന പദപ്രയോഗത്തിലൂടെ κληρονομέωയുടെ പൈതൃക/അവകാശരൂപകം വ്യക്തമായി സംരക്ഷിച്ചു. ‘എഴുന്നേറ്റ്’ എന്നും ‘ന്യായപ്രമാണത്തിൽ പണ്ഡിതനായ’ എന്നും മാറ്റിയത് അർഥം മാറ്റാതെ ആധുനിക മലയാളത്തിന്റെ ഒഴുക്ക് മെച്ചപ്പെടുത്താനാണ്. യേശുവിനെ പേരെടുത്ത് പറയുന്നത് സമീപസന്ദർഭത്തിൽ വ്യക്തമായ αὐτόν എന്ന പരാമർശത്തെ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
