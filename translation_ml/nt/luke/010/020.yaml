id: LUK.10.20
reference: Luke 10:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: ml
  text: എങ്കിലും, ആത്മാക്കൾ നിങ്ങൾക്കു കീഴടങ്ങുന്നതിൽ സന്തോഷിക്കരുത്; നിങ്ങളുടെ പേരുകൾ സ്വർഗങ്ങളിൽ എഴുതപ്പെട്ടിരിക്കുന്നതിൽ സന്തോഷിക്കുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വർഗത്തിൽ’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്കിൽ ‘സ്വർഗങ്ങൾ’ എന്ന ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: എങ്കിലും
  rationale: ശിഷ്യരുടെ മുൻപത്തെ സന്തോഷത്തെ ശക്തമായി തിരുത്തുന്ന വൈരുധ്യഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τούτῳ μὴ χαίρετε ... χαίρετε δὲ
  choice: '... സന്തോഷിക്കരുത്; ... സന്തോഷിക്കുവിൻ'
  rationale: χαίρω എന്ന ഒരേ ക്രിയയുടെ ആവർത്തനവും നിരോധനവും ആഹ്വാനവും തമ്മിലുള്ള വാഗ്വൈഭവപരമായ വൈരുധ്യവും സംരക്ഷിക്കുന്നു; ἐν τούτῳ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ‘-തിൽ’ എന്ന ഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: τὰ πνεύματα
  choice: ആത്മാക്കൾ
  rationale: സന്ദർഭം ശത്രുതാപരമായ ആത്മീയ സത്തകളെ സൂചിപ്പിച്ചാലും, ഗ്രീക്ക് പദം നേരിട്ട് ‘ഭൂതങ്ങൾ’ എന്നോ ‘ദുരാത്മാക്കൾ’ എന്നോ പറയുന്നില്ല; അതിനാൽ അതിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: ὑμῖν ὑποτάσσεται
  choice: നിങ്ങൾക്കു കീഴടങ്ങുന്നു
  rationale: അവ അവരുടെ അധികാരത്തിനു വിധേയമാകുന്നു എന്ന വർത്തമാനകാല അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: നിങ്ങളുടെ പേരുകൾ
  rationale: ഗ്രീക്ക് ഉടമസ്ഥബന്ധത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐγγέγραπται
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർത്തിയായ എഴുത്തിന്റെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന perfect passive ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം നിലനിർത്തുന്നു; മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന ദൈവിക മണ്ഡലസൂചന നൽകുന്നു.
theological_decisions:
- issue: ആത്മാക്കളുടെ സ്വഭാവം
  choice: ആത്മാക്കൾ
  alternative: ദുരാത്മാക്കൾ / ഭൂതങ്ങൾ
  rationale: സന്ദർഭം ദുഷ്ട ആത്മീയ സത്തകളെയാണു സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഈ വാക്യത്തിലെ πνεύματα അത്ര കൃത്യമായി പരിമിതപ്പെടുത്തുന്നില്ല. അതിനാൽ മുഖ്യപാഠം അതിനെ നിർവചിച്ച് ചുരുക്കുന്നില്ല.
- issue: പേരുകൾ എഴുതപ്പെട്ടിരിക്കുന്ന സ്ഥലം
  choice: സ്വർഗങ്ങളിൽ
  alternative: സ്വർഗത്തിൽ
  rationale: οὐρανοῖς എന്ന ബഹുവചനം സംരക്ഷിച്ച് ഗ്രീക്ക് പ്രയോഗത്തെ ഏകവചനപരമ്പരയിലേക്കു മൗനമായി സാധാരണവത്കരിക്കാതിരിക്കുന്നു.
- issue: എഴുതപ്പെട്ടതിന്റെ കാലഭാവം
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  alternative: എഴുതിയിരിക്കുന്നു / രേഖപ്പെടുത്തിയിരിക്കുന്നു
  rationale: ἐγγέγραπται എന്ന perfect passive രൂപത്തിലെ പൂർത്തിയായ പ്രവൃത്തിയും തുടരുന്ന ഫലവും മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ആരാണ് എഴുതിയത് എന്നത് പാഠം പറയാത്തതിനാൽ കർത്താവിനെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സന്തോഷിക്കരുത് ... സന്തോഷിക്കുവിൻ’ എന്ന സമാന്തരഘടന മൂലപാഠത്തിലെ ആവർത്തനവും തിരുത്തൽഭാവവും നിലനിർത്തുന്നു. ‘കീഴടങ്ങുക’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും അധികാരത്തിനു വിധേയമാകുന്ന അർഥം കൃത്യമായി നൽകുന്നതുമാണ്.
