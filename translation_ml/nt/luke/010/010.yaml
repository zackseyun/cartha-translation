source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: ml
  text: 'എന്നാൽ ഏതെങ്കിലും പട്ടണത്തിൽ നിങ്ങൾ പ്രവേശിക്കുകയും അവിടെയുള്ളവർ നിങ്ങളെ സ്വീകരിക്കാതിരിക്കുകയും ചെയ്താൽ, പുറത്തിറങ്ങി അതിന്റെ തെരുവുകളിൽ[a] ചെന്നു പറയുക:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിശാലമായ പൊതുവീഥികളിൽ’ അല്ലെങ്കിൽ ‘പൊതുചത്വരങ്ങളിൽ.’ ഗ്രീക്കിലെ πλατείας തുറന്ന പൊതുവഴികളെയോ പൊതുസ്ഥലങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: എന്നാൽ നിങ്ങൾ ഏതൊരു പട്ടണത്തിൽ ... ആയാലും
  rationale: ἄν ചേർന്ന അനിശ്ചിത ബന്ധവാക്യം സംഭവിക്കാവുന്ന ഏതു പട്ടണത്തെയും പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഏതൊരു ... ആയാലും’ ആ തുറന്ന നിബന്ധനാസ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰσέλθητε
  choice: പ്രവേശിച്ചാലും
  rationale: അയോറിസ്റ്റ് സബ്ജങ്ക്റ്റീവിന്റെ നിബന്ധനാപരമായ അർഥം മുൻവാക്യഘടനയോടു ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: അവിടെയുള്ളവർ നിങ്ങളെ സ്വീകരിക്കാതിരുന്നാൽ
  rationale: δέχομαι ദൂതന്മാരെ സ്വീകരിക്കുക/സ്വാഗതം ചെയ്യുക എന്ന വിശാല അർഥം വഹിക്കുന്നു. ‘സ്വീകരിക്കുക’ ആ അർഥവും ദൗത്യസന്ദർഭത്തിലെ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; ബഹുവചന ക്രിയയുടെ കർത്താവിനെ മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘അവിടെയുള്ളവർ’ ചേർത്തു.
- source_word: ἐξελθόντες
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: εἴπατε എന്ന ആജ്ഞയ്ക്കു മുമ്പുള്ള സാഹചര്യപങ്കാളിത്തക്രിയയാണ്; പട്ടണത്തിലെ പൊതുസ്ഥലത്തേക്കു പുറത്തേക്കിറങ്ങുന്ന തുടർച്ചയായ പ്രവൃത്തി മലയാളത്തിൽ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: τὰς πλατείας αὐτῆς
  choice: ആ പട്ടണത്തിന്റെ തെരുവുകളിലേക്ക്
  rationale: πλατεῖα വിശാലമായ പൊതുവീഥികളെയോ തുറന്ന പൊതുസ്ഥലങ്ങളെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിൽ സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായ ‘തെരുവുകൾ’ ഉപയോഗിച്ച്, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εἴπατε
  choice: പറയുക
  rationale: λέγω എന്ന ക്രിയയുടെ അയോറിസ്റ്റ് ആജ്ഞാരൂപത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ തർജമ; അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്നു.
