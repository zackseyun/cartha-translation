  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ അനിശ്ചിത നിബന്ധനയും പ്രവർത്തനക്രമവും നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടന സ്വീകരിച്ചു.
