source:
  edition: SBLGNT
  text: καὶ γενόμενος ἐν ἀγωνίᾳ ἐκτενέστερον προσηύχετο· ⸄καὶ ἐγένετο⸅ ὁ ἱδρὼς αὐτοῦ ὡσεὶ θρόμβοι αἵματος καταβαίνοντες ἐπὶ τὴν γῆν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: ml
  text: അവൻ കഠിനവ്യഥയിലായി കൂടുതൽ തീവ്രമായി[a] പ്രാർഥിച്ചുകൊണ്ടിരുന്നു; അവന്റെ വിയർപ്പ് നിലത്തേക്കു വീഴുന്ന രക്തത്തുള്ളികൾപോലെയായി.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൂടുതൽ ആത്മാർഥമായി’ അല്ലെങ്കിൽ ‘കൂടുതൽ തീക്ഷ്ണമായി.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘രക്തത്തിന്റെ തുള്ളികൾ/കട്ടകൾപോലെ.’ ഇവിടെ ഉപമയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; വിയർപ്പ് തന്നെയാണ് രക്തം എന്ന് നേരിട്ട് പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ലൂക്കോസ് 22:43–44 ഇല്ല; മറ്റുള്ളവയിൽ അവ ഉൾപ്പെടുന്നു. ഈ പാഠസാക്ഷ്യത്തിലെ അനിശ്ചിതത്വം സൂചിപ്പിക്കാൻ SBLGNT ഈ വാക്യങ്ങൾ ബ്രാക്കറ്റിൽ അച്ചടിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: കഠിനവ്യഥയിലായി
  rationale: γενόμενος സൂചിപ്പിക്കുന്ന അവസ്ഥയിലേക്കുള്ള പ്രവേശനവും ἀγωνία സൂചിപ്പിക്കുന്ന തീവ്രമായ ആന്തരിക സംഘർഷവും വേദനയും സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκτενέστερον
  choice: കൂടുതൽ തീവ്രമായി
  rationale: താരതമ്യരൂപത്തിന്റെ ‘കൂടുതൽ’ എന്ന അർഥവും പ്രാർഥനയുടെ വർധിച്ച തീവ്രതയും നേരിട്ട് നിലനിർത്തുന്നു; ആത്മാർഥത എന്ന വ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: προσηύχετο
  choice: പ്രാർഥിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐγένετο ὁ ἱδρὼς αὐτοῦ
  choice: അവന്റെ വിയർപ്പ് ... പോലെയായി
  rationale: ἐγένετο സൂചിപ്പിക്കുന്ന ഫലാവസ്ഥയെ ‘പോലെയായി’ എന്ന രൂപത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὡσεὶ θρόμβοι αἵματος
  choice: രക്തത്തുള്ളികൾപോലെ
  rationale: ὡσεὶയുടെ ഉപമാസ്വഭാവം വ്യക്തമായി സംരക്ഷിക്കുന്നു. θρόμβοι കട്ടകളെയോ കട്ടിയുള്ള തുള്ളികളെയോ സൂചിപ്പിക്കാമെങ്കിലും ഈ സന്ദർഭത്തിലെ താഴേക്കു വീഴുന്ന ദൃശ്യത്തിന് ‘തുള്ളികൾ’ സ്വാഭാവികമാണ്.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: നിലത്തേക്കു വീഴുന്ന
  rationale: താഴോട്ടുള്ള ചലനവും ഭൂമിയിലേക്കുള്ള ദിശയും ലളിതവും ദൃശ്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: വിയർപ്പും രക്തവും തമ്മിലുള്ള താരതമ്യത്തിന്റെ സ്വഭാവം
  choice: വിയർപ്പ് രക്തത്തുള്ളികൾപോലെയായി എന്ന ഉപമ നിലനിർത്തി.
  alternative: വിയർപ്പ് യഥാർഥത്തിൽ രക്തമായി എന്നു പ്രസ്താവിക്കുക.
  rationale: ὡσεὶ വ്യക്തമായി ഒരു താരതമ്യം അടയാളപ്പെടുത്തുന്നതിനാൽ സാമ്യം മാത്രമാണ് പ്രധാനപാഠത്തിൽ പറയുന്നത്. അതിനെ യഥാർഥ രക്തമെന്ന വൈദ്യശാസ്ത്രപരമോ അത്ഭുതപരമോ ആയ അവകാശവാദമായി വിവർത്തനം ചെയ്യുന്നില്ല.
- issue: ലൂക്കോസ് 22:43–44-ന്റെ പാഠസാക്ഷ്യത്തിലെ അനിശ്ചിതത്വം
  choice: വാക്യം പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി പാഠഭേദം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: വാക്യം പ്രധാനപാഠത്തിൽനിന്ന് ഒഴിവാക്കുക.
  rationale: SBLGNT ഈ വാക്യങ്ങൾ ബ്രാക്കറ്റിൽ അച്ചടിച്ച് അവയുടെ പാഠസാക്ഷ്യത്തിലെ അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്നു. അതിനാൽ ഉൾപ്പെടുത്തലും സംശയാവസ്ഥയും ഒരുപോലെ സുതാര്യമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കഠിനവ്യഥ’, ‘തീവ്രമായി’, ‘പ്രാർഥിച്ചുകൊണ്ടിരുന്നു’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതും മൂലപാഠത്തിന്റെ തീവ്രതയും ക്രിയയുടെ തുടർച്ചയും സംരക്ഷിക്കുന്നതുമാണ്.
