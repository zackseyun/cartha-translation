id: LUK.22.51
reference: Luke 22:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: ml
  text: 'എന്നാൽ യേശു മറുപടിയായി പറഞ്ഞു: “മതി, ഇത്രയും മതി!” പിന്നെ അവൻ ആ മനുഷ്യന്റെ ചെവിയിൽ തൊട്ട് അവനെ സുഖപ്പെടുത്തി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: “മതി, ഇത്രയും മതി!”
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം സന്ദർഭത്തിൽ ശിഷ്യരുടെ അക്രമം അവസാനിപ്പിക്കാനുള്ള കൽപ്പനയായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു. ‘ഇത്രവരെ അനുവദിക്കൂ’ എന്ന കൂടുതൽ അക്ഷരാർഥ വായനയ്ക്കുള്ള സാധ്യത നിലനിൽക്കുന്നുവെങ്കിലും, മലയാളത്തിൽ സംഭാഷണത്തിന്റെ അടിയന്തരതയും തടയുന്ന ഭാവവും വ്യക്തമാക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: τοῦ ὠτίου
  choice: ആ മനുഷ്യന്റെ ചെവിയിൽ
  rationale: ὠτίον എന്നത് ‘ചെവി’ എന്നാണ്. αὐτόν എന്ന പുരുഷലിംഗ സർവനാമത്തിന്റെ വ്യക്തിസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്താൻ ഉടമയെ ‘ആ മനുഷ്യൻ’ എന്നു വ്യക്തമാക്കി.
- source_word: ἰάσατο αὐτόν
  choice: അവനെ സുഖപ്പെടുത്തി
  rationale: ക്രിയയുടെ മധ്യരൂപം ഇവിടെ സാധാരണ സജീവാർഥത്തിലാണ്; αὐτόν ചെവിയെയല്ല, മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: Ἐᾶτε ἕως τούτου എന്ന വാക്യത്തിന്റെ അർഥവ്യാപ്തി
  choice: അക്രമം ഉടൻ അവസാനിപ്പിക്കാനുള്ള വാക്കായി “മതി, ഇത്രയും മതി!”
  alternative: “ഇത്രവരെ അനുവദിക്കൂ” / “ഇതുവരെ വിടൂ”
  rationale: വാക്യം വ്യാകരണപരമായി ഒന്നിലധികം രീതിയിൽ ഗ്രഹിക്കാം. ഉടൻ മുമ്പുള്ള വാൾപ്രയോഗത്തോടുള്ള യേശുവിന്റെ പ്രതികരണമായി ‘മതി’ എന്ന വായന സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്; എന്നാൽ അതിനെ പ്രത്യേക സിദ്ധാന്തപരമായ പ്രസ്താവനയായി വികസിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. ‘എന്നാൽ’ δέ-യുടെ പ്രത്യയഭാവം സൂചിപ്പിക്കുന്നു; ‘മറുപടിയായി പറഞ്ഞു’ ἀποκριθεὶς…εἶπεν എന്ന സെമിറ്റിക് സ്വഭാവമുള്ള പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
