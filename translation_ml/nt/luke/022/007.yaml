id: LUK.22.7
reference: Luke 22:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦλθεν δὲ ἡ ἡμέρα τῶν ἀζύμων, ⸀ᾗ ἔδει θύεσθαι τὸ πάσχα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: ml
  text: പിന്നെ പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ദിവസം വന്നു. അന്നായിരുന്നു പെസഹാ[a] ബലിയർപ്പിക്കേണ്ടിയിരുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പെസഹാക്കുഞ്ഞാട്’ അല്ലെങ്കിൽ ‘പെസഹാബലി.’ ഗ്രീക്ക് പദം പെസഹാ ആചരണത്തെയോ, ഈ സന്ദർഭത്തിൽ പ്രത്യേകിച്ച് ബലിയർപ്പിക്കപ്പെടുന്ന മൃഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: വന്നു
  rationale: കാലമോ ദിവസമോ വന്നെത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പിന്നെ
  rationale: ഇവിടെ പദം ആഖ്യാനത്തിന്റെ തുടർച്ചയും അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കവും അടയാളപ്പെടുത്തുന്നു.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ദിവസം
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ‘ദിവസം’ നിലനിർത്തിക്കൊണ്ട് ഉത്സവവുമായി ബന്ധപ്പെട്ട പുളിപ്പില്ലാത്ത അപ്പത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ᾗ
  choice: അന്നായിരുന്നു
  rationale: മുൻപറഞ്ഞ ദിവസത്തെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ കാലബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἔδει
  choice: അർപ്പിക്കേണ്ടിയിരുന്നത്
  rationale: ആചാരക്രമപ്രകാരമുള്ള ആവശ്യകതയെയും ബാധ്യതയെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: θύεσθαι
  choice: ബലിയർപ്പിക്കപ്പെടുക / ബലിയർപ്പിക്കുക
  rationale: ബലിസന്ദർഭത്തിലെ θύω മൃഗത്തെ അറുത്ത് ബലിയർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളവാക്യത്തിൽ ‘പെസഹാ ബലിയർപ്പിക്കുക’ എന്ന സ്ഥിരപ്രയോഗം ആ ആചാരപരമായ അർഥം നൽകുന്നു.
- source_word: τὸ πάσχα
  choice: പെസഹാ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അത് പെസഹാബലിയെയോ ബലിമൃഗത്തെയോ സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ബലിസന്ദർഭത്തിൽ τὸ πάσχα സൂചിപ്പിക്കുന്നത്
  choice: പ്രധാനവാചകത്തിൽ ‘പെസഹാ’ എന്നു നൽകി ബലിയുടെ അർഥം ക്രിയയിലൂടെ പ്രകടിപ്പിച്ചു.
  alternative: ‘പെസഹാക്കുഞ്ഞാട്’ അല്ലെങ്കിൽ ‘പെസഹാബലി’
  rationale: πάσχα എന്ന പദം പെസഹാ ആചരണത്തെയും ഭക്ഷണത്തെയും ബലിമൃഗത്തെയും സൂചിപ്പിക്കാം. θύεσθαι ബലിസന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ പദത്തിന്റെ യഥാർഥ വിശാലത പ്രധാനവാചകത്തിൽ നിലനിർത്തുകയും കൂടുതൽ നിർദിഷ്ടമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പുളിപ്പില്ലാത്ത അപ്പം,’ ‘പെസഹാ,’ ‘ബലിയർപ്പിക്കുക’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന ബൈബിൾ-ആചാരപദങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
