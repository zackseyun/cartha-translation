id: LUK.22.12
reference: Luke 22:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀκεῖνος ὑμῖν δείξει ἀνάγαιον μέγα ἐστρωμένον· ἐκεῖ ἑτοιμάσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/012.yaml
  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: ml
  text: അയാൾ നിങ്ങൾക്ക് സജ്ജീകരിച്ചിട്ടുള്ള ഒരു വലിയ മുകളിലത്തെ മുറി[a] കാണിച്ചുതരും. അവിടെ ഒരുക്കങ്ങൾ ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരുക്കിവെച്ചിട്ടുള്ള ഒരു വലിയ മുകളിലത്തെ മുറി’ അല്ലെങ്കിൽ ‘വിരിപ്പുകളും ഇരിപ്പിടങ്ങളും സജ്ജമാക്കിയ ഒരു വലിയ മുകളിലത്തെ മുറി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνος
  choice: അയാൾ
  rationale: καί + ἐκεῖνος മുൻപ് പരാമർശിച്ച വീട്ടുടമയെ സൂചിപ്പിച്ച് നിർദേശങ്ങളുടെ തുടർച്ച കാണിക്കുന്നു. മലയാളത്തിൽ ‘അയാൾ’ വ്യക്തമായും സ്വാഭാവികമായും ആ സൂചന നൽകുന്നു; വാക്യാരംഭത്തിലെ καί പ്രത്യേകം ‘പിന്നെ’ എന്നു വിവർത്തനം ചെയ്യാതെ തുടർച്ചയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: δείξει ὑμῖν
  choice: നിങ്ങൾക്ക് … കാണിച്ചുതരും
  rationale: δείξει എന്ന ഭാവികാല ക്രിയയും ὑμῖν എന്ന പരോക്ഷകർമവും മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തു നൽകുന്നു.
- source_word: ἀνάγαιον μέγα
  choice: ഒരു വലിയ മുകളിലത്തെ മുറി
  rationale: ἀνάγαιον കെട്ടിടത്തിന്റെ മുകളിലത്തെ നിലയിലുള്ള മുറിയെയും μέγα അതിന്റെ വലിപ്പത്തെയും സൂചിപ്പിക്കുന്നു; ‘മുകളിലത്തെ മുറി’ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: ἐστρωμένον
  choice: സജ്ജീകരിച്ചിട്ടുള്ള
  rationale: στρώννυμι എന്ന ക്രിയയുടെ perfect passive participle മുറി വിരിപ്പുകളോ ഇരിപ്പിടങ്ങളോ മറ്റോ ഒരുക്കിവെച്ച നിലയിലാണെന്നു സൂചിപ്പിക്കുന്നു. ‘സജ്ജീകരിച്ചിട്ടുള്ള’ ആ പൂർത്തിയായ നിലവസ്ഥ നിലനിർത്തുന്നു; കൃത്യമായി എന്താണ് വിരിച്ചിട്ടുള്ളതെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: അവിടെ ഒരുക്കങ്ങൾ ചെയ്യുക
  rationale: ἐκεῖ എന്ന സ്ഥലസൂചനയും ബഹുവചന ആജ്ഞാരൂപമായ ἑτοιμάσατεയും വ്യക്തമായി നിലനിർത്തുന്നു. ‘ഒരുക്കങ്ങൾ ചെയ്യുക’ പെസഹാഭക്ഷണത്തിനായുള്ള തുടർതയ്യാറെടുപ്പുകളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ἐστρωμένον എന്ന പദത്തിന്റെ ‘വിരിച്ചിട്ടുള്ളത്/സജ്ജമാക്കിയിരിക്കുന്നത്/ഒരുക്കിയിരിക്കുന്നത്’ എന്ന അർത്ഥപരിധി മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു; ‘ഒരുക്കങ്ങൾ ചെയ്യുക’ എന്നത് ഇതിനകം സജ്ജീകരിച്ച മുറിയിൽ ശിഷ്യർ ചെയ്യേണ്ട തുടർതയ്യാറെടുപ്പുമായി വേർതിരിക്കുന്നു.
