  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: ml
  text: അപ്പോൾ സാത്താൻ ഇസ്കര്യോത്ത് എന്നു വിളിക്കപ്പെട്ട, പന്ത്രണ്ടുപേരുടെ എണ്ണത്തിൽ ഉൾപ്പെട്ട യൂദാസിൽ പ്രവേശിച്ചു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്കര്യോത്ത് എന്നറിയപ്പെട്ട യൂദാസ്.’
    reason: lexical_alternative
  - marker: b
    text: '‘പന്ത്രണ്ടുപേരിൽ ഒരാൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. അക്ഷരാർഥം: ‘പന്ത്രണ്ടുപേരുടെ എണ്ണത്തിൽ ഉൾപ്പെട്ട.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν … εἰς
  choice: …യിൽ പ്രവേശിച്ചു
  rationale: ക്രിയയോടൊപ്പമുള്ള εἰς വ്യക്തമാക്കുന്ന ‘ഒരാളുടെ ഉള്ളിലേക്കുള്ള പ്രവേശനം’ മലയാളത്തിലെ അധിവേശകപ്രത്യയവും ‘പ്രവേശിച്ചു’ എന്ന ക്രിയയും ചേർത്ത് നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ δέ വൈരുധ്യത്തേക്കാൾ ആഖ്യാനത്തിന്റെ അടുത്ത ഘട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനബന്ധം നൽകുന്നു.
- source_word: Σατανᾶς
  choice: സാത്താൻ
  rationale: പുതിയനിയമ മലയാളത്തിൽ സുപരിചിതമായ വ്യക്തിനാമ/സ്ഥാനപ്പേരിന്റെ ലിപ്യന്തരണം.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: ഇസ്കര്യോത്ത് എന്നു വിളിക്കപ്പെട്ടവൻ
  rationale: καλούμενον എന്ന വിശേഷണാത്മക കൃദന്തത്തിന്റെ തിരിച്ചറിയൽസ്വഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: പന്ത്രണ്ടുപേരുടെ എണ്ണത്തിൽ ഉൾപ്പെട്ടവൻ
  rationale: വെറും ‘പന്ത്രണ്ടുപേരിൽ ഒരാൾ’ എന്നു ചുരുക്കാതെ ἐκ τοῦ ἀριθμοῦ എന്ന പ്രയോഗത്തിലെ എണ്ണപ്പെട്ട സംഘത്തിൽ ഉൾപ്പെടുന്നുവെന്ന ഔപചാരിക സൂക്ഷ്മത നിലനിർത്തുന്നു.
theological_decisions:
- issue: യൂദാസിനോടുള്ള സാത്താന്റെ പ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: ‘യൂദാസിൽ പ്രവേശിച്ചു’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘യൂദാസിനെ സ്വാധീനിച്ചു’ അല്ലെങ്കിൽ ‘യൂദാസിനെ കീഴടക്കി.’
  rationale: Εἰσῆλθεν … εἰς എന്ന ഗ്രീക്ക് പ്രയോഗം പ്രവേശനത്തെ വ്യക്തമായി പറയുന്നു. അതിനെ മാനസിക സ്വാധീനമായി ദുർബലപ്പെടുത്താതെയും പിശാചുബാധയെയോ മനുഷ്യന്റെ ഉത്തരവാദിത്വത്തെയോ കുറിച്ചുള്ള അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെയും മൂലപാഠത്തിലെ ശക്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ദീർഘമായ യൂദാസിന്റെ തിരിച്ചറിയൽവാക്യം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി സമാന്തര വിശേഷണഘടനയായി നൽകിയിരിക്കുന്നു. മലയാളത്തിൽ വലിയക്ഷര–ചെറിയക്ഷര വ്യത്യാസമില്ലാത്തതിനാൽ ‘the Twelve’ എന്ന ഇംഗ്ലീഷ് ശൈലിവികൽപത്തിന് പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
