  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: ml
  text: അവർ അവനെ മൂടിയശേഷം[a], “പ്രവചിക്കൂ! നിന്നെ അടിച്ചത് ആരാണ്?” എന്നു പറഞ്ഞുകൊണ്ട് വീണ്ടും വീണ്ടും ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ കണ്ണുകെട്ടിയശേഷം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: അവനെ മൂടിയശേഷം
  rationale: ക്രിയാവിശേഷണം അവനെ മൂടുകയോ മറയ്ക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ കാഴ്ച തടഞ്ഞതാണെന്ന് വ്യക്തമെങ്കിലും, മുഖമോ കണ്ണുകളോ എന്ന് മൂലപദം നിർദിഷ്ടമാക്കാത്തതിനാൽ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐπηρώτων
  choice: വീണ്ടും വീണ്ടും ചോദിച്ചു
  rationale: അപൂർണ ഭൂതകാലരൂപം ആവർത്തിച്ചോ തുടർച്ചയായോ ചോദിച്ചതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ആവർത്തനസ്വഭാവം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞുകൊണ്ട്
  rationale: അവരുടെ പരിഹാസചോദ്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന വർത്തമാന ക്രിയാവിശേഷണത്തിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Προφήτευσον
  choice: പ്രവചിക്കൂ!
  rationale: പരിഹാസസ്വരമുള്ള ആജ്ഞയെ നേരിട്ടും സംക്ഷിപ്തമായും പകർത്തുന്നു; യേശുവിന്റെ പ്രവാചകപരമായ തിരിച്ചറിയലിനോടുള്ള പരിഹാസവും നിലനിർത്തുന്നു.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: നിന്നെ അടിച്ചത് ആരാണ്?
  rationale: ὁ παίσας എന്ന നാമവൽക്കരിച്ച ക്രിയാവിശേഷണത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘അടിച്ചത്’ എന്നു നൽകുന്നു; പ്രഹരത്തിന്റെ അർഥവും ചോദ്യം ചെയ്യുന്ന ഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ കണ്ണുകൾ കെട്ടിയെന്ന് വ്യക്തമായി പറയണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘അവനെ മൂടിയശേഷം’ എന്ന വിശാലമായ പ്രയോഗം നിലനിർത്തി
  alternative: ‘അവന്റെ കണ്ണുകൾ കെട്ടിയശേഷം’
  rationale: സന്ദർഭം കാഴ്ച തടഞ്ഞതായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് ക്രിയ കണ്ണുകളെയാണ് മൂടിയതെന്ന് പ്രത്യേകം പറയുന്നില്ല. അതിനാൽ മൂലപാഠത്തേക്കാൾ അധികമായ നിർദിഷ്ടത പ്രധാനപാഠത്തിൽ ചേർക്കാതെ, സാധാരണ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘വീണ്ടും വീണ്ടും’ എന്ന പ്രയോഗം അപൂർണ ഭൂതകാലത്തിന്റെ ആവർത്തനബലം വ്യക്തമാക്കുന്നു; ‘പ്രവചിക്കൂ!’ എന്നത് പരിഹാസപരമായ ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തി കാത്തുസൂക്ഷിക്കുന്നു.
