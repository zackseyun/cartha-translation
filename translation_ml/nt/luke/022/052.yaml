id: LUK.22.52
reference: Luke 22:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: ml
  text: 'എന്നാൽ, തനിക്കെതിരെ വന്ന മഹാപുരോഹിതന്മാരോടും ദേവാലയത്തിലെ കാവൽ ഉദ്യോഗസ്ഥന്മാരോടും മൂപ്പന്മാരോടും യേശു പറഞ്ഞു: “ഒരു കൊള്ളക്കാരന്റെ നേരെ പുറപ്പെടുന്നതുപോലെ വാളുകളും വടികളുമായി നിങ്ങൾ പുറപ്പെട്ടുവന്നുവോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: അറസ്റ്റിന്റെ നടപടിയിൽനിന്ന് യേശുവിന്റെ പ്രതികരണത്തിലേക്കുള്ള നേരിയ വൈരുധ്യവും ആഖ്യാനമാറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: തന്നെ പിടിക്കാൻ വന്ന
  rationale: ἐπί + accusative ഇവിടെ യേശുവിനെതിരെയുള്ള വൈരപരമായ നീക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അറസ്റ്റിന്റെ സന്ദർഭത്തിൽ ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀρχιερεῖς
  choice: മഹാപുരോഹിതന്മാർ
  rationale: പ്രധാന പുരോഹിതാധികാരികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പദം.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: ദേവാലയകാവൽസേനയുടെ ഉദ്യോഗസ്ഥന്മാർ
  rationale: ദേവാലയസുരക്ഷയുടെ ചുമതലയുള്ള അധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സേനാധിപന്മാർ’ എന്നതിലുപരി ആധുനിക വായനക്കാർക്ക് ചുമതല വ്യക്തമാക്കുന്നു.
- source_word: πρεσβυτέρους
  choice: മൂപ്പന്മാർ
  rationale: വയോധികരെ പൊതുവായി അല്ല, അംഗീകൃത യഹൂദ നേതാക്കളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: ഒരു കൊള്ളക്കാരനെ പിടിക്കാനെന്നപോലെ
  rationale: ὡς ἐπί എന്ന പ്രയോഗത്തിലെ താരതമ്യവും അറസ്റ്റിന്റെ ലക്ഷ്യഭാവവും നിലനിർത്തുന്നു; λῃστής എന്ന പദത്തിന്റെ സാധാരണ അർഥം ‘കൊള്ളക്കാരൻ’ ആയി നൽകുന്നു.
- source_word: ἐξήλθατε
  choice: നിങ്ങൾ വന്നിരിക്കുന്നുവോ
  rationale: ഇപ്പോൾ നടന്നെത്തിയ നടപടിയെ ചോദ്യം ചെയ്യുന്ന ഗ്രീക്ക് aorist-ന്റെ സന്ദർഭബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μαχαιρῶν
  choice: വാളുകൾ
  rationale: അറസ്റ്റ് സന്ദർഭത്തിലെ സാധാരണവും യോജിച്ചതുമായ അർഥം.
- source_word: ξύλων
  choice: വടികൾ
  rationale: അക്ഷരാർഥത്തിൽ മരവസ്തുക്കൾ എന്നായാലും ഇവിടെ ആയുധമായി ഉപയോഗിക്കുന്ന വടികളെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: λῃστής എന്ന പദത്തിന്റെ പരിധി
  choice: മുഖ്യപാഠത്തിൽ ‘കൊള്ളക്കാരൻ’
  alternative: ‘കവർച്ചക്കാരൻ’, ‘കൊള്ളസംഘക്കാരൻ’, അല്ലെങ്കിൽ ‘വിപ്ലവകാരിയായ നിയമലംഘകൻ’
  rationale: പദം കവർച്ചക്കാരനെയോ സായുധ കൊള്ളസംഘക്കാരനെയോ ചില സന്ദർഭങ്ങളിൽ കലാപകാരിയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ സാധാരണ അർഥം നൽകി, വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദേവാലയസുരക്ഷാ ഉദ്യോഗസ്ഥരുടെ പങ്ക് വ്യക്തമാക്കാൻ ‘ദേവാലയകാവൽസേനയുടെ ഉദ്യോഗസ്ഥന്മാർ’ എന്നു നൽകി. ഗ്രീക്ക് വാക്യത്തിലെ ചോദ്യംചെയ്യുന്ന ഭാവവും λῃστής എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
