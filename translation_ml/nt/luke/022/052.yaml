  source_fidelity: ‘തന്നെ പിടിക്കാൻ വന്ന’ എന്നത് അറസ്റ്റുസന്ദർഭത്തോട് യോജിക്കുന്നുവെങ്കിലും, παραγενομένους ἐπ’ αὐτόν എന്നതിലെ ‘തനിക്കെതിരെ/തന്റെ നേരെ വന്ന’ എന്ന നേരിട്ടുള്ള അർഥത്തെക്കാൾ ഉദ്ദേശ്യം വ്യക്തമായി ചേർക്കുന്നു. ‘പുറപ്പെട്ടുവന്നുവോ’ ἐξήλθατε എന്ന ക്രിയയെയും ὡς ἐπὶ λῃστὴν എന്ന പ്രയോഗത്തെയും കൂടുതൽ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു.
