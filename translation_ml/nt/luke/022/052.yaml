  to: 'എന്നാൽ, തനിക്കെതിരെ വന്ന മഹാപുരോഹിതന്മാരോടും ദേവാലയത്തിലെ കാവൽ ഉദ്യോഗസ്ഥന്മാരോടും മൂപ്പന്മാരോടും യേശു പറഞ്ഞു: “ഒരു കൊള്ളക്കാരന്റെ നേരെ പുറപ്പെടുന്നതുപോലെ വാളുകളും വടികളുമായി നിങ്ങൾ പുറപ്പെട്ടുവന്നുവോ?”'
