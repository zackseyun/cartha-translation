  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: ml
  text: അങ്ങനെ അവർ പോയി; അവൻ അവരോടു പറഞ്ഞിരുന്നതുപോലെതന്നെ കണ്ടു; അവർ പെസഹ[a] ഒരുക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പെസഹാഭക്ഷണം’ അല്ലെങ്കിൽ ‘പെസഹാക്കുഞ്ഞാട്.’ ഗ്രീക്ക് പദത്തിന് പെസഹാചരണത്തെ പൊതുവായി, അല്ലെങ്കിൽ അതിന്റെ ഭക്ഷണത്തെയോ യാഗവുമായി ബന്ധപ്പെട്ട ഘടകങ്ങളെയോ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες δὲ
  choice: അങ്ങനെ അവർ പോയി
  rationale: ആഓറിസ്റ്റ് കൃദന്തം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; δέ കഥയുടെ തുടർച്ചയാണ്. സ്വാഭാവിക മലയാളത്തിൽ ക്രമബദ്ധമായ സമാപികാക്രിയയായി പരിഭാഷപ്പെടുത്തി.
- source_word: εὗρον
  choice: കണ്ടെത്തി
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ കർമമില്ല. സന്ദർഭത്തിൽ യേശു വിവരിച്ചിരുന്ന കാര്യങ്ങൾ അങ്ങനെതന്നെ സംഭവിച്ചതായി അവർ കണ്ടെത്തി എന്ന ആശയം മലയാളത്തിലും കർമം കൂട്ടിച്ചേർക്കാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καθὼς εἰρήκει αὐτοῖς
  choice: അവൻ തങ്ങളോടു പറഞ്ഞിരുന്നതുപോലെതന്നെ
  rationale: καθώς സൂചിപ്പിക്കുന്ന കൃത്യമായ പൊരുത്തം ‘പോലെതന്നെ’ വ്യക്തമാക്കുന്നു; പ്ലൂപർഫെക്റ്റ് εἰρήκει മുൻപ് പറഞ്ഞിരുന്നതിനെ ‘പറഞ്ഞിരുന്നത്’ എന്നു നിലനിർത്തുന്നു.
- source_word: ἡτοίμασαν
  choice: ഒരുക്കി
  rationale: ആവശ്യമായ കാര്യങ്ങൾ സജ്ജമാക്കുക എന്ന അർഥം ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ‘ഒരുക്കി’ നൽകുന്നു.
- source_word: τὸ πάσχα
  choice: പെസഹ
  rationale: πάσχα പെസഹാചരണം മുഴുവനായോ അതിന്റെ ഭക്ഷണം, കുഞ്ഞാട് തുടങ്ങിയ ഘടകങ്ങളെയോ സൂചിപ്പിക്കാം. ‘പെസഹ’ എന്ന വിശാലപദം മൂലത്തിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സന്ദർഭത്തിലെ πάσχα എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: പെസഹ
  alternative: പെസഹാഭക്ഷണം; പെസഹാക്കുഞ്ഞാട്
  rationale: ഉടൻ വരുന്ന സന്ദർഭം ഭക്ഷണത്തിനുള്ള ഒരുക്കത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പദം അതിലൊതുങ്ങുന്നില്ല. മുഖ്യപാഠത്തിൽ വിശാലപദം നിലനിർത്തി അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നത് അനാവശ്യമായ വ്യാഖ്യാനനിർണ്ണയം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പെസഹ’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും അതിന്റെ സാധ്യതയുള്ള ഇടുങ്ങിയ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
