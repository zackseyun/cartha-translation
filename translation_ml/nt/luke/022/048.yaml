id: LUK.22.48
reference: Luke 22:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Ἰησοῦς δὲ⸃ εἶπεν αὐτῷ· Ἰούδα, φιλήματι τὸν υἱὸν τοῦ ἀνθρώπου παραδίδως;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവനോടു പറഞ്ഞു: “യൂദാ, ഒരു ചുംബനംകൊണ്ട് മനുഷ്യപുത്രനെ ഒറ്റിക്കൊടുക്കുന്നുവോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഒരു ചുംബനംകൊണ്ട് മനുഷ്യപുത്രനെ കൈമാറിക്കൊടുക്കുന്നുവോ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: സന്ദർഭത്തിലെ നേരിയ വൈരുധ്യം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളബന്ധപദം; യേശുവിന്റെ പ്രതികരണത്തിലേക്കുള്ള മാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: εἶπεν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: αὐτῷ എന്ന വ്യക്തമായ സർവനാമം നിലനിർത്തുകയും യൂദായോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Ἰούδα
  choice: യൂദാ
  rationale: സംബോധനാവിഭക്തിയുടെ ഭാവം മലയാളത്തിലെ ദീർഘാന്തരൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: φιλήματι
  choice: ഒരു ചുംബനംകൊണ്ട്
  rationale: ഉപകരണമോ മാർഗമോ സൂചിപ്പിക്കുന്ന ദത്തിവ് നിലനിർത്തുന്നു; പ്രവൃത്തിയുടെ മൂർത്തതയും വഞ്ചനാപരമായ വിരോധാഭാസവും അനാവശ്യ വ്യാഖ്യാനമില്ലാതെ പ്രകടമാക്കുന്നു.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രനെ
  rationale: സുവിശേഷങ്ങളിൽ യേശു സ്വയം ഉപയോഗിക്കുന്ന സ്ഥാപിതമായ ശീർഷകവും ദാനീയേൽപുസ്തകത്തോടുള്ള പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: παραδίδως
  choice: ഒറ്റിക്കൊടുക്കുന്നുവോ
  rationale: ഇവിടെ നടക്കുന്ന ശത്രുതാപരമായ കൈമാറ്റത്തെ സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു; വർത്തമാനകാലത്തിലെ പുരോഗമിക്കുന്ന പ്രവൃത്തിയും ചോദ്യഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπου എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: യേശുവിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ സ്വയംപരാമർശവും പ്രയോഗത്തിന്റെ അക്ഷരഘടനയും പഴയനിയമാന്തർപാഠബന്ധവും നിലനിർത്തുന്നു; പൊതുവായ മനുഷ്യപരാമർശമായി ചുരുക്കുന്നില്ല.
- issue: παραδίδως എന്ന ക്രിയയിലെ കൈമാറ്റവും വഞ്ചനയും തമ്മിലുള്ള അർത്ഥവ്യാപ്തി
  choice: ഒറ്റിക്കൊടുക്കുന്നുവോ
  alternative: കൈമാറിക്കൊടുക്കുന്നുവോ
  rationale: കഥാസന്ദർഭത്തിലെ വഞ്ചനാഭാവം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥപരമായ ‘കൈമാറിക്കൊടുക്കുക’ അടിക്കുറിപ്പിൽ നൽകി ഗ്രീക്കിലെ അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒറ്റിക്കൊടുക്കുക’ സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്നതാണ്; ‘മനുഷ്യപുത്രൻ’ സ്ഥാപിതമായ ബൈബിൾശീർഷകമായി നിലനിർത്തിയിരിക്കുന്നു.
