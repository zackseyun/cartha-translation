id: LUK.22.43
reference: Luke 22:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ὤφθη δὲ αὐτῷ ἄγγελος ⸀ἀπ’ οὐρανοῦ ἐνισχύων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: ml
  text: അപ്പോൾ സ്വർഗത്തിൽനിന്ന് ഒരു ദൂതൻ അവന് പ്രത്യക്ഷനായി[a], അവനെ ശക്തിപ്പെടുത്തിക്കൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികൾ 43–44 വാക്യങ്ങൾ ഒഴിവാക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ὤφθη
  choice: പ്രത്യക്ഷനായി
  rationale: ὁράω എന്ന ക്രിയയുടെ ഈ കർമണിപ്രയോഗം പ്രത്യക്ഷപ്പെടൽ സൂചിപ്പിക്കുന്ന പതിവ് പ്രയോഗമാണ്; ‘കാണപ്പെട്ടു’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി സംഭവം വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ δέ കഥയുടെ തുടർച്ചയും അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കവും അടയാളപ്പെടുത്തുന്നു; ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കാതെ അത് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτῷ
  choice: അവനു
  rationale: ὤφθηയോടുകൂടിയ ദത്തിവ് ആരുടെ മുമ്പാകെയാണ് പ്രത്യക്ഷപ്പെട്ടതെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: ἄγγελος
  choice: ഒരു ദൂതൻ
  rationale: സ്വർഗീയ പശ്ചാത്തലത്തിൽ ἄγγελος എന്നത് സാധാരണ സന്ദേശവാഹകനെയല്ല, സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπ’ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ദൂതന്റെ സ്വർഗീയ ഉത്ഭവം ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: ἐνισχύων
  choice: ശക്തിപ്പെടുത്തി
  rationale: പ്രത്യക്ഷപ്പെടലിനോടൊപ്പമുള്ള പ്രവർത്തനമാണ് പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ സമാപിക ക്രിയാഘടന വാക്യം സ്വാഭാവികമാക്കുകയും ശക്തി പകരുക എന്ന അടിസ്ഥാന അർത്ഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: നേരിട്ടുള്ള കർമം യേശുവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തമായി വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: ലൂക്കോസ് 22:43-ന്റെ പാഠസ്ഥിതി
  choice: നൽകിയിരിക്കുന്ന SBLGNT ഗ്രീക്ക് പാഠത്തെ അനുസരിച്ച് വാക്യം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
  alternative: ചില കൈയെഴുത്തുപ്രതികളിൽ 43–44 വാക്യങ്ങൾ ഇല്ല.
  rationale: സ്രോതസ്സായി നൽകിയ ഗ്രീക്ക് പാഠം വിവർത്തനം ചെയ്യുന്നതോടൊപ്പം, കൈയെഴുത്തുപ്രതി പരമ്പരയിലെ പ്രധാന പാഠവ്യത്യാസം അടിക്കുറിപ്പിൽ തുറന്നുപറയുന്നു; അതുവഴി തർക്കവിഷയം നിശ്ശബ്ദമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘പ്രത്യക്ഷനായി’, ‘ശക്തിപ്പെടുത്തി’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ അർത്ഥം വ്യക്തമായി നൽകുകയും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി മനസ്സിലാകുകയും ചെയ്യുന്നു.
