  to: അപ്പോൾ സ്വർഗത്തിൽനിന്ന് ഒരു ദൂതൻ അവന് പ്രത്യക്ഷനായി[a], അവനെ ശക്തിപ്പെടുത്തിക്കൊണ്ട്.
