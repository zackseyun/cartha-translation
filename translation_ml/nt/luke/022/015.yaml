id: LUK.22.15
reference: Luke 22:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഞാൻ കഷ്ടം അനുഭവിക്കുന്നതിനുമുമ്പ് നിങ്ങളോടൊപ്പം ഈ പെസഹ ഭക്ഷിക്കാൻ അതിയായി ആഗ്രഹിച്ചു.[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ആഗ്രഹത്തോടെ ഞാൻ ആഗ്രഹിച്ചു”; യേശുവിന്റെ ആഗ്രഹത്തിന്റെ തീവ്രത ഊന്നിപ്പറയുന്ന പ്രയോഗമാണ് ഗ്രീക്കിലുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: “ഈ പെസഹ” എന്നത് ഇവിടെ പ്രത്യേകിച്ച് പെസഹാഭോജനത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: സാധാരണ ആഖ്യാനത്തിലെ സംഭാഷണാരംഭം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: അതിയായി ആഗ്രഹിച്ചു
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള നാമവും ക്രിയയും ചേർന്ന ഗ്രീക്ക് ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി ശക്തമായ ആഗ്രഹമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῦτο τὸ πάσχα
  choice: ഈ പെസഹ
  rationale: ഗ്രീക്കിലെ പദപ്രയോഗം സംരക്ഷിക്കുന്നു; ‘ഭക്ഷിക്കാൻ’ എന്ന സന്ദർഭം പെസഹാഭോജനമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: φαγεῖν
  choice: ഭക്ഷിക്കാൻ
  rationale: ക്രിയയുടെ ലളിതവും നേരിട്ടുമായ അർഥം നൽകുന്നു.
- source_word: μεθ’ ὑμῶν
  choice: നിങ്ങളോടൊപ്പം
  rationale: കൂടെ പങ്കുചേരുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πρὸ τοῦ με παθεῖν
  choice: ഞാൻ കഷ്ടം അനുഭവിക്കുന്നതിനുമുമ്പ്
  rationale: πρό ചേർന്ന ക്രിയാനാമപ്രയോഗത്തിന്റെ മുൻകാലബന്ധവും യേശുവിന്റെ വരാനിരിക്കുന്ന പീഡാനുഭവവും കൃത്യമായി നൽകുന്നു; സംഭവങ്ങളെ അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: സന്ദർഭത്തിലെ πάσχα എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘ഈ പെസഹ’ എന്നു നിലനിർത്തി.
  alternative: ഈ പെസഹാഭോജനം
  rationale: ഭക്ഷിക്കുന്ന സന്ദർഭത്തിൽ പെസഹാഭോജനമാണ് ഉദ്ദേശിക്കുന്നത്; എങ്കിലും മൂലപാഠത്തിലെ വിശാലമായ പദപ്രയോഗം നിലനിർത്തുന്നത് ഉത്സവവും ഭക്ഷണവും തമ്മിലുള്ള ബന്ധം അനാവശ്യമായി ചുരുക്കാതിരിക്കുന്നു.
- issue: Ἐπιθυμίᾳ ἐπεθύμησα എന്ന ഊന്നൽപ്രയോഗത്തിന്റെ ശക്തി
  choice: അതിയായി ആഗ്രഹിച്ചു
  alternative: ആഗ്രഹത്തോടെ ഞാൻ ആഗ്രഹിച്ചു; അത്യന്തം ആഗ്രഹിച്ചു
  rationale: യേശുവിന്റെ ശക്തമായ വ്യക്തിപരമായ ആഗ്രഹം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അധിക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കഷ്ടം അനുഭവിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ πάσχω എന്ന പദത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
