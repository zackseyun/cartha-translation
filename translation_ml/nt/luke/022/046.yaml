source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ ഉറങ്ങുന്നത് എന്തിന്? എഴുന്നേറ്റ് പ്രാർഥിക്കൂ; നിങ്ങൾ പരീക്ഷയിൽ അകപ്പെടാതിരിക്കാൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί καθεύδετε;
  choice: നിങ്ങൾ ഉറങ്ങുന്നത് എന്തിന്?
  rationale: τί ഇവിടെ കാരണമന്വേഷിക്കുന്ന നേരിട്ടുള്ള ചോദ്യമാണ്; καθεύδετε എന്ന വർത്തമാനക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: ἀναστάντες
  choice: എഴുന്നേറ്റു
  rationale: ശിഷ്യർ ഉറങ്ങിക്കിടക്കുന്നതിനാൽ, പങ്കുപദത്തിന്റെ സന്ദർഭോചിതമായ അർഥം ‘എഴുന്നേറ്റു’ എന്നാണ്.
- source_word: προσεύχεσθε
  choice: പ്രാർഥിക്കൂ
  rationale: തുടർച്ചയായോ സാഹചര്യത്തിൽ പ്രസക്തമായോ ഉള്ള ആജ്ഞയെ സ്വാഭാവികമായ ബഹുവചന ആജ്ഞാരൂപത്തിൽ അവതരിപ്പിച്ചു.
- source_word: ἵνα μὴ εἰσέλθητε εἰς πειρασμόν
  choice: നിങ്ങൾ പരീക്ഷയിൽ അകപ്പെടാതിരിക്കട്ടെ
  rationale: εἰσέρχομαι εἰς എന്ന പ്രയോഗത്തിന്റെ ‘അകപ്പെടുക/പ്രവേശിക്കുക’ എന്ന ആശയവും ἵνα μὴ യുടെ നിഷേധാത്മക ഉദ്ദേശ്യവും നിലനിർത്തുന്നു; πειρασμός എന്ന പദത്തിന്റെ ‘പരീക്ഷ/പ്രലോഭനം’ എന്ന അർഥവ്യാപ്തി പൂർണമായി ഒതുക്കാതെ ‘പരീക്ഷ’ തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: πειρασμός എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: പരീക്ഷ
  alternative: പ്രലോഭനം
  rationale: ഗ്രീക്ക് പദത്തിന് പരീക്ഷയും പ്രലോഭനവും ഉൾക്കൊള്ളുന്ന അർഥവ്യാപ്തിയുണ്ട്. ഈ സന്ദർഭത്തിൽ വരാനിരിക്കുന്ന ആത്മീയ പ്രതിസന്ധിയെയും പാപത്തിലേക്കുള്ള വശീകരണത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കാവുന്നതിനാൽ കൂടുതൽ വിശാലമായ ‘പരീക്ഷ’ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ നേരിട്ടുള്ള ചോദ്യം, ആജ്ഞ, ഉദ്ദേശ്യവാക്യം എന്നിവ സംക്ഷിപ്തമായി നിലനിർത്തി.
