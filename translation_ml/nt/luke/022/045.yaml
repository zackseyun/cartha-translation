source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: ml
  text: അവൻ പ്രാർഥന കഴിഞ്ഞ് എഴുന്നേറ്റ് ശിഷ്യന്മാരുടെ അടുക്കൽ വന്നപ്പോൾ, അവർ ദുഃഖംനിമിത്തം ഉറങ്ങുന്നതായി കണ്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: പ്രാർഥന കഴിഞ്ഞ് എഴുന്നേറ്റ്
  rationale: പ്രാർഥനയിൽനിന്ന് എഴുന്നേറ്റതും തുടർന്ന് ശിഷ്യന്മാരുടെ അടുക്കൽ വന്നതുമായ ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ἀναστάς എന്ന aorist participle-ന്റെ മുൻകാലികതയും ἀπό എന്നതിന്റെ വേർപാട്/അവസാനബോധവും നിലനിർത്തുന്നു.
- source_word: ἐλθὼν πρὸς τοὺς μαθητάς
  choice: ശിഷ്യന്മാരുടെ അടുക്കൽ വന്നപ്പോൾ
  rationale: πρός സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം ‘അടുക്കൽ’ വ്യക്തമാക്കുന്നു. പങ്കുപദഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: μαθητάς
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ μαθητής എന്ന പദത്തിന് പതിവും കൃത്യവുമായ മലയാളപരിഭാഷയാണ് ‘ശിഷ്യൻ’.
- source_word: εὗρεν
  choice: കണ്ടു
  rationale: εὑρίσκω ഇവിടെ ഒരവസ്ഥയിൽ അവരെ കണ്ടെത്തുക/കാണുക എന്ന അർഥത്തിലാണ്. ‘ഉറങ്ങുന്നതായി കണ്ടു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭസൂക്ഷ്മവുമാണ്.
- source_word: κοιμωμένους αὐτούς
  choice: അവർ ... ഉറങ്ങുന്നതായി
  rationale: വർത്തമാന പങ്കുപദമായ κοιμωμένους, അവൻ വന്നപ്പോൾ അവർ ഉറങ്ങിക്കൊണ്ടിരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘ഉറങ്ങുന്നതായി’ അതിന്റെ പ്രവർത്തനാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῆς λύπης
  choice: ദുഃഖംനിമിത്തം
  rationale: ഇവിടെയുള്ള ἀπό കാരണത്തെ സൂചിപ്പിക്കുന്നു. ‘ദുഃഖംനിമിത്തം’ ഉറക്കത്തിന് ദുഃഖമാണ് കാരണമെന്ന് സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ ഉറക്കത്തിന് ദുഃഖവുമായുള്ള ബന്ധം
  choice: അവർ ദുഃഖംനിമിത്തം ഉറങ്ങുകയായിരുന്നു
  alternative: അവർ ദുഃഖിതരായിരിക്കെ ഉറങ്ങുകയായിരുന്നു
  rationale: ἀπὸ τῆς λύπης ഏറ്റവും സ്വാഭാവികമായി കാരണബന്ധം പ്രകടിപ്പിക്കുന്നു. അതിനപ്പുറം അവരുടെ മാനസികാവസ്ഥയെ വിശദീകരിക്കാതെ പാഠത്തിലുള്ള ബന്ധം മാത്രം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ പ്രവർത്തനക്രമം സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു; മതവിഭാഗപരമായ പ്രത്യേക പദപ്രയോഗങ്ങളോ വ്യാഖ്യാനവികാസങ്ങളോ ചേർത്തിട്ടില്ല.
