  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πλὴν ἰδοὺ ἡ χεὶρ τοῦ παραδιδόντος με μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: ml
  text: എന്നാൽ നോക്കൂ, എന്നെ ഒറ്റിക്കൊടുക്കുന്നവന്റെ കൈ എന്നോടുകൂടെ മേശപ്പുറത്തുണ്ട്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: എന്നാൽ
  rationale: മുൻവാക്യവുമായി വൈരുധ്യാത്മകമായ മാറ്റം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ἰδοὺ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടും ആധുനികവുമായ പ്രയോഗം; അത്യന്തം പുരാതനഭാവമുള്ള പദം ഒഴിവാക്കുന്നു.
- source_word: τοῦ παραδιδόντος με
  choice: എന്നെ ഒറ്റിക്കൊടുക്കുന്നവന്റെ
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ പുരോഗമനപരമായ ഭാവവും ദ്രോഹിച്ച് ഏല്പിക്കുന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്റെ കൈയോടൊപ്പം
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘എന്നോടൊപ്പം’ എന്നാണെങ്കിലും, ‘കൈ’ എന്ന കർത്താവിനോട് ബന്ധിപ്പിച്ച് മലയാളത്തിൽ ഉദ്ദേശിച്ച ദൃശ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐπὶ τῆς τραπέζης
  choice: മേശപ്പുറത്തുണ്ട്
  rationale: സ്ഥാനസൂചനയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: μετ’ ἐμοῦ എന്നതിന്റെ ബന്ധം
  choice: എന്റെ കൈയോടൊപ്പം
  alternative: എന്നോടൊപ്പം
  rationale: വാക്യത്തിലെ കർത്താവ് ‘കൈ’ ആയതിനാൽ രണ്ടുകൈകളും ഒരേ മേശപ്പുറത്തുള്ള ദൃശ്യം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഒറ്റിക്കൊടുക്കുന്നവൻ യേശുവിനൊപ്പം ഭക്ഷണമേശയിൽ ഇരിക്കുന്നു എന്ന ആശയം മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ഇതാ’ എന്നതിനുപകരം ശ്രദ്ധ ക്ഷണിക്കുന്ന ‘നോക്കൂ’ ഉപയോഗിച്ചു.
