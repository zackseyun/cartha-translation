id: LUK.22.4
reference: Luke 22:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: ml
  text: അവൻ പോയി, അവനെ എങ്ങനെ അവർക്കു കൈമാറാമെന്നതിനെക്കുറിച്ച് മുഖ്യപുരോഹിതന്മാരോടും ഉദ്യോഗസ്ഥന്മാരോടും[a][b] ആലോചിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ ഒറ്റിക്കൊടുക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘കൈമാറുക,’ ‘ഏല്പിക്കുക,’ അല്ലെങ്കിൽ ഈ സന്ദർഭത്തിൽ ‘ഒറ്റിക്കൊടുക്കുക’ എന്നർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഉദ്യോഗസ്ഥന്മാർ’ എന്നത് റോമൻ സൈനികരെയല്ല, സാധ്യതയേറിയവിധം ദേവാലയവുമായി ബന്ധപ്പെട്ട അധികാരികളെയോ ദേവാലയകാവൽസേനയിലെ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: അവിടെനിന്ന് പോയി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള സംഭവത്തെ സൂചിപ്പിക്കുന്ന aorist participle ആണ്. മലയാളത്തിൽ ക്രിയാശൃംഖലയായി നൽകുന്നത് സ്വാഭാവികവും സംഭവക്രമം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: συνελάλησεν
  choice: ആലോചിച്ചു
  rationale: ഒരുമിച്ചു സംസാരിക്കുക, കൂടിയാലോചിക്കുക എന്ന ആശയമുള്ള ക്രിയ. രഹസ്യമായ ക്രമീകരണത്തെക്കുറിച്ചുള്ള ചർച്ച എന്ന സന്ദർഭത്തിൽ ‘ആലോചിച്ചു’ സ്വാഭാവികമായി കൂട്ടായ ചർച്ചയുടെ ഭാവം നൽകുന്നു.
- source_word: ἀρχιερεῦσιν
  choice: മുഖ്യപുരോഹിതന്മാരോട്
  rationale: ഒരേ സമയം പല മഹാപുരോഹിതന്മാർ എന്നല്ല, യെഹൂദ പുരോഹിതനേതൃത്വത്തിലെ പ്രമുഖരെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്.
- source_word: στρατηγοῖς
  choice: ഉദ്യോഗസ്ഥന്മാരോട്
  rationale: ഈ ദേവാലയസന്ദർഭത്തിൽ റോമൻ സൈനികരെയല്ല, ദേവാലയകാവലുമായി ബന്ധപ്പെട്ട അധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭവിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: τὸ πῶς
  choice: എങ്ങനെ ... എന്നതിനെക്കുറിച്ച്
  rationale: ചർച്ചയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: παραδῷ
  choice: കൈമാറിക്കൊടുക്കാമെന്ന്
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കൈമാറുക/ഏല്പിക്കുക’ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിലെ ‘ഒറ്റിക്കൊടുക്കുക’ എന്ന വ്യാഖ്യാനാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: αὐτοῖς ... αὐτόν
  choice: അവനെ ... അവർക്കു
  rationale: ‘അവനെ’ എന്ന കർമവും ‘അവർക്കു’ എന്ന സ്വീകർത്താക്കളും വ്യക്തമായി വേർതിരിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: യൂദാസിന്റെ പ്രവൃത്തിയിൽ παραδῷ എന്നതിന്റെ പരിഭാഷ
  choice: അവനെ അവർക്കു കൈമാറിക്കൊടുക്കുക
  alternative: അവനെ ഒറ്റിക്കൊടുക്കുക
  rationale: സന്ദർഭം വഞ്ചനയാണെങ്കിലും ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘കൈമാറുക’, ‘ഏല്പിക്കുക’, സന്ദർഭത്തിൽ ‘ഒറ്റിക്കൊടുക്കുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്. മുഖ്യപാഠം വിശാലമായ ശാബ്ദിക അർഥം നിലനിർത്തുകയും വ്യാഖ്യാനപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആലോചിച്ചു’ കൂട്ടായ ചർച്ചയുടെ അർഥം നൽകുന്നു. ‘ഉദ്യോഗസ്ഥന്മാർ’ എന്ന പൊതുപദത്തിന്റെ ദേവാലയസംബന്ധിയായ പ്രത്യേകത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ ബന്ധപ്പെട്ട പദപ്രയോഗത്തിന് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
