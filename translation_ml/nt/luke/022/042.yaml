id: LUK.22.42
reference: Luke 22:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων· Πάτερ, εἰ βούλει ⸀παρένεγκε ⸂τοῦτο τὸ ποτήριον⸃ ἀπ’ ἐμοῦ· πλὴν μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: ml
  text: 'ഇങ്ങനെ പറഞ്ഞു: “പിതാവേ, അങ്ങേക്കു മനസ്സുണ്ടെങ്കിൽ, ഈ പാനപാത്രം[b] എന്നിൽനിന്ന് നീക്കണമേ[a]. എങ്കിലും, എന്റെ ഇഷ്ടമല്ല, അങ്ങയുടെ ഇഷ്ടം നിറവേറട്ടെ.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഈ പാനപാത്രം എന്നിൽനിന്ന് അകറ്റണമേ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘പാനപാത്രം’ എന്നത് ഒരാൾക്കു നിശ്ചയിക്കപ്പെട്ട ഓഹരിയെ, വിശേഷിച്ച് കഷ്ടപ്പാടിനെയോ ന്യായവിധിയെയോ, സൂചിപ്പിക്കുന്ന വേദപുസ്തകീയ രൂപകമാണ്.
    reason: cross_reference
  - marker: c
    text: 'അഥവാ: ‘ഞാൻ ഇച്ഛിക്കുന്നതല്ല, അങ്ങ് ഇച്ഛിക്കുന്നത് സംഭവിക്കട്ടെ.’'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: യേശുവിന്റെ പ്രാർഥനാവാക്കുകൾ അവതരിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപമാണിത്. മുൻവാക്യത്തോടുള്ള ബന്ധം സൂചിപ്പിച്ചുകൊണ്ടും മലയാളത്തിൽ സ്വാഭാവികമായും വായിക്കാനാകുന്നതിനാൽ ‘ഇങ്ങനെ പറഞ്ഞു’ എന്നു നൽകി.
- source_word: Πάτερ
  choice: പിതാവേ
  rationale: ദൈവത്തോടുള്ള നേരിട്ടുള്ള സംബോധനയാണ്. ‘പിതാവേ’ ആ അർഥവും ഗൗരവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἰ βούλει
  choice: അങ്ങേക്കു മനസ്സുണ്ടെങ്കിൽ
  rationale: βούλομαι ഇവിടെ ഇച്ഛയെയോ സന്നദ്ധതയെയോ സൂചിപ്പിക്കുന്നു. ഈ സോപാധിക അപേക്ഷ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: παρένεγκε … ἀπ’ ἐμοῦ
  choice: എന്നിൽനിന്ന് നീക്കണമേ
  rationale: παραφέρω എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം പാനപാത്രം യേശുവിൽനിന്ന് അകറ്റണമെന്ന അപേക്ഷയാണ്. ‘നീക്കണമേ’ അർഥം കൃത്യമായും ആദരപൂർവമായും നൽകുന്നു.
- source_word: τοῦτο τὸ ποτήριον
  choice: ഈ പാനപാത്രം
  rationale: കഷ്ടപ്പാടിനെയോ ന്യായവിധിയെയോ സൂചിപ്പിക്കുന്ന വേദപുസ്തകീയ രൂപകം വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതെ അതേ രൂപത്തിൽ നിലനിർത്തി.
- source_word: πλὴν
  choice: എങ്കിലും
  rationale: ആദ്യ അപേക്ഷയിൽനിന്ന് പിതാവിന്റെ ഇഷ്ടത്തിനു കീഴടങ്ങുന്നതിലേക്കുള്ള ശക്തമായ concessive തിരിവ് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: എന്റെ ഇഷ്ടമല്ല, അങ്ങയുടെ ഇഷ്ടം
  rationale: ഗ്രീക്കിലെ നാമരൂപത്തിലുള്ള വൈരുധ്യം ചുരുക്കുകയോ വിശദീകരിച്ചു തീർക്കുകയോ ചെയ്യാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: γινέσθω
  choice: നിറവേറട്ടെ
  rationale: പിതാവിന്റെ ഇഷ്ടം പ്രാബല്യത്തിൽ വരണമെന്ന മൂന്നാംപുരുഷ ആജ്ഞാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ഇഷ്ടവും പിതാവിന്റെ ഇഷ്ടവും തമ്മിലുള്ള ബന്ധം
  choice: ‘എന്റെ ഇഷ്ടമല്ല, അങ്ങയുടെ ഇഷ്ടം നിറവേറട്ടെ’ എന്ന നേരിട്ടുള്ള വൈരുധ്യം നിലനിർത്തി.
  alternative: ‘ഞാൻ ആഗ്രഹിക്കുന്നതല്ല, അങ്ങ് ആഗ്രഹിക്കുന്നത് സംഭവിക്കട്ടെ.’
  rationale: യേശു തന്റെ ഇഷ്ടത്തെ പിതാവിന്റെ ഇഷ്ടത്തിൽനിന്ന് വേർതിരിച്ചുപറയുകയും അതിനു കീഴടങ്ങുകയും ചെയ്യുന്ന വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ചു ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: ‘പാനപാത്രം’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘പാനപാത്രം’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘ഈ കഷ്ടപ്പാട്’ അല്ലെങ്കിൽ ‘ഈ യാതന’
  rationale: രൂപകത്തെ പ്രധാനവാചകത്തിൽ വ്യാഖ്യാനിച്ചാൽ അതിന്റെ വേദപുസ്തകാന്തരബന്ധവും അർഥവ്യാപ്തിയും ചുരുങ്ങും; അതിനാൽ വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തോടുള്ള ആദരസൂചക സംബോധനയായി ‘അങ്ങ്’ ഉപയോഗിച്ചു; പരമ്പരാഗതമായെങ്കിലും ഇന്നും പൊതുവായി മനസ്സിലാകുന്ന ‘പാനപാത്രം’ എന്ന രൂപകം നിലനിർത്തി.
