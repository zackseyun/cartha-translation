  terminology: ‘ഒരു മനുഷ്യൻ’ explicitly retains the masculine reference of ἄνθρωπος in this context. ‘വെള്ളം നിറച്ച ഒരു കുടം’ naturally expresses κεράμιον ὕδατος without asserting earthenware in the main text; that narrower possibility remains in the footnote.
  issues:
