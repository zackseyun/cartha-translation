translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ മാന്യത കൈവിടാത്ത ആഖ്യാനശൈലി. ശ്രദ്ധ ക്ഷണിക്കുന്ന Ἰδοὺയ്ക്ക് പഴമച്ചായമുള്ള പ്രയോഗം ഒഴിവാക്കി ‘ശ്രദ്ധിക്കൂ’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് അടയാളം ബന്ധപ്പെട്ട പദസമൂഹത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
