reference: Luke 22:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഇതാ, നിങ്ങൾ നഗരത്തിൽ പ്രവേശിക്കുമ്പോൾ, വെള്ളം നിറച്ച ഒരു കുടം[a] ചുമന്നുകൊണ്ടുപോകുന്ന ഒരു മനുഷ്യൻ നിങ്ങളെ കണ്ടുമുട്ടും. അവൻ പ്രവേശിക്കുന്ന വീട്ടിലേക്ക് അവനെ അനുഗമിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുടം’ എന്നു വിവർത്തനം ചെയ്ത ഗ്രീക്ക് പദം പ്രത്യേകിച്ച് ഒരു മൺപാത്രത്തെ സൂചിപ്പിക്കാനും കഴിയും; അതിനാൽ ‘വെള്ളം നിറച്ച ഒരു മൺകുടം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ശ്രദ്ധിക്കൂ
  rationale: ശ്രോതാക്കളുടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗമായി Ἰδοὺ ഇവിടെ പ്രവർത്തിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള ആഹ്വാനമാണ് ‘ശ്രദ്ധിക്കൂ’.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: നിങ്ങൾ നഗരത്തിൽ പ്രവേശിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ കാലസംബന്ധിയായ അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും, നഗരപ്രവേശനത്തോടനുബന്ധിച്ചാണ് കൂടിക്കാഴ്ചയെന്ന സൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: συναντήσει ὑμῖν
  choice: നിങ്ങളെ എതിരേൽക്കും
  rationale: സന്ദർഭത്തിൽ ആ മനുഷ്യൻ അവരുടെ വഴിയിൽ വന്നുചേരുമെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; മുൻകൂട്ടി നിശ്ചയിച്ച ഔപചാരിക കൂടിക്കാഴ്ച എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: ἄνθρωπος
  choice: ഒരാൾ
  rationale: മലയാളത്തിൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്. തുടർന്നുള്ള പുരുഷലിംഗ ഏകവചന സർവനാമമായ ‘അവൻ’ ആ വ്യക്തി പുരുഷനാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: κεράμιον ὕδατος
  choice: ഒരു കുടം വെള്ളം
  rationale: പാത്രവും അതിലെ വെള്ളവും സ്വാഭാവിക മലയാളക്രമത്തിൽ വ്യക്തമാക്കുന്നു. κεράμιον മൺപാത്രത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: βαστάζων
  choice: ചുമന്നുകൊണ്ടുപോകുന്ന
  rationale: പാത്രം വഹിച്ചുകൊണ്ട് സഞ്ചരിക്കുന്ന തുടരുന്ന പ്രവൃത്തി മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: അവനെ അനുഗമിക്കൂ
  rationale: അയാളുടെ പിന്നാലെ പോകാനുള്ള നേരിട്ടുള്ള കല്പനയെ മാന്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἰκίαν
  choice: വീട്
  rationale: ദിശാസൂചകമായ ഈ സന്ദർഭത്തിൽ οἰκίαയുടെ വ്യക്തവും സാധാരണവുമായ സമാനപദമാണ്.
- source_word: εἰς ἣν εἰσπορεύεται
  choice: അവൻ പ്രവേശിക്കുന്ന വീട്ടിലേക്ക്
  rationale: ആ മനുഷ്യൻ കടക്കുന്ന പ്രത്യേക വീടിനെ തിരിച്ചറിയിക്കുകയും εἰς എന്ന ദിശാബോധം ‘വീട്ടിലേക്ക്’ എന്നതിലൂടെ നിലനിർത്തുകയും ചെയ്യുന്നു.
