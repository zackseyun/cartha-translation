source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു: “പത്രോസേ, ഞാൻ നിന്നോടു പറയുന്നു: എന്നെ അറിയുന്നില്ലെന്ന് നീ മൂന്നുപ്രാവശ്യം പറഞ്ഞുതള്ളുന്നതുവരെ ഇന്ന് കോഴി കൂവുകയില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്നെ അറിയുന്നില്ലെന്ന് നീ മൂന്നുപ്രാവശ്യം പറഞ്ഞുതള്ളുന്നതിനുമുമ്പ് ഇന്ന് കോഴി കൂവുകയില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: എന്നാൽ അവൻ പറഞ്ഞു
  rationale: δέ ഇവിടെ സംഭാഷണത്തിലെ നേരിയ വൈരുധ്യവും പുതിയ പ്രതികരണവും സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Λέγω σοι
  choice: ഞാൻ നിന്നോടു പറയുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള നേരിട്ടുള്ള പ്രസ്താവനയുടെ ഊന്നൽ നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: Πέτρε
  choice: പത്രോസേ
  rationale: പേരിന്റെ അംഗീകരിക്കപ്പെട്ട മലയാളരൂപം സംബോധനാവിഭക്തിയിൽ നൽകി.
- source_word: οὐ φωνήσει ... ἀλέκτωρ
  choice: കോഴി കൂവുകയില്ല
  rationale: ἀλέκτωρ വിഷയമായതിനാൽ φωνήσει എന്നതിന് സന്ദർഭോചിതമായ അർഥം ‘കൂവുക’ എന്നാണ്; മലയാളത്തിൽ അനിശ്ചിത ഉപപദം ഇല്ലാത്തതിനാൽ ‘കോഴി’ സ്വാഭാവികമാണ്.
- source_word: σήμερον
  choice: ഇന്ന്
  rationale: കാലസൂചക ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἕως
  choice: വരെ
  rationale: നിഷേധപ്രസ്താവന നിലനിൽക്കുന്ന സമയപരിധി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയെ ‘നിഷേധിക്കുന്നതുവരെ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τρίς
  choice: മൂന്നുപ്രാവശ്യം
  rationale: ആവർത്തനത്തിന്റെ എണ്ണം വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളം.
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: നീ എന്നെ അറിയുന്നുവെന്നത് ... നിഷേധിക്കുക
  rationale: εἰδέναι ഒഴിവാക്കാതെ, നിഷേധത്തിന്റെ ഉള്ളടക്കം യേശുവിനെ അറിയുന്നു എന്ന വസ്തുതയാണെന്ന് വ്യക്തമാക്കുന്നു; വെറും ‘എന്നെ നിഷേധിക്കുക’ എന്നതിലേക്കു അർഥം വിപുലീകരിക്കുന്നില്ല.
theological_decisions:
- issue: പത്രോസ് നടത്തുമെന്ന് പ്രവചിക്കപ്പെട്ട നിഷേധത്തിന്റെ സ്വഭാവം
  choice: യേശുവിനെ അറിയുന്നുവെന്നത് പത്രോസ് മൂന്നുപ്രാവശ്യം നിഷേധിക്കുമെന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: പത്രോസ് യേശുവിനെ മൂന്നുപ്രാവശ്യം തള്ളിപ്പറയും.
  rationale: ഗ്രീക്കിലെ εἰδέναι നിഷേധത്തിന്റെ ഉള്ളടക്കം ‘എന്നെ അറിയുക’ എന്നാണെന്ന് വ്യക്തമാക്കുന്നു. അതിനാൽ പരിചയം നിഷേധിക്കുന്നതെന്ന പ്രത്യേക അർഥം നിലനിർത്തി; വിശ്വാസത്യാഗം പോലുള്ള കൂടുതൽ വിപുലമായ ദൈവശാസ്ത്രപരമായ ആശയം പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ‘പത്രോസേ’ എന്ന സംബോധനയും ‘ഞാൻ നിന്നോടു പറയുന്നു’ എന്ന സൂത്രവാക്യവും മൂലത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു. ‘തള്ളിപ്പറയുക’ എന്നതിനെക്കാൾ ‘നിഷേധിക്കുക’ ഇവിടെ εἰδέναι സൂചിപ്പിക്കുന്ന അറിവ്/പരിചയം നിഷേധിക്കുന്ന ഉള്ളടക്കത്തോട് കൂടുതൽ കൃത്യമായി ചേരുന്നു.
