  yaml_path: translation/nt/luke/022/009.yaml
  text: They said to him[a], “Where do you want us to prepare it?”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “ഞങ്ങൾ എവിടെ ഒരുക്കണമെന്നാണ് നീ ആഗ്രഹിക്കുന്നത്?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “ഞങ്ങൾ എവിടെ ഒരുക്കങ്ങൾ നടത്തണമെന്നാണ് നീ ആഗ്രഹിക്കുന്നത്?” ഒരുക്കേണ്ടത് മുൻസന്ദർഭത്തിൽ പറഞ്ഞ പെസഹാഭക്ഷണമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: അവർ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന നിർദേശകപദം സന്ദർഭത്തിലെ ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ ലഘുവായ ബന്ധകമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: εἶπαν αὐτῷ
  choice: അവർ അവനോട് ചോദിച്ചു
  rationale: εἶπαν എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, തുടർന്നുവരുന്നത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ ‘ചോദിച്ചു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും അർഥസത്യവുമാണ്; αὐτῷ ‘അവനോട്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: Ποῦ
  choice: എവിടെ
  rationale: സ്ഥലത്തെക്കുറിച്ചു ചോദിക്കുന്ന ക്രിയാവിശേഷണത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: θέλεις
  choice: നീ ആഗ്രഹിക്കുന്നത്
  rationale: θέλω ആഗ്രഹമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു. ‘നീ ആഗ്രഹിക്കുന്നത്’ ആ ആശയം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἑτοιμάσωμεν
  choice: ഞങ്ങൾ ... ഒരുക്കണമെന്നാണ്
  rationale: θέλεις എന്നതിനുശേഷമുള്ള ഒന്നാംപുരുഷ ബഹുവചന അയോറിസ്റ്റ് സബ്ജങ്ക്റ്റീവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ചോദ്യംരൂപത്തിൽ അവതരിപ്പിക്കുന്നു. ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല; മുൻസന്ദർഭത്തിൽ അത് പെസഹാഭക്ഷണമാണെന്ന് മനസ്സിലാകുന്നു.
