reference: Luke 22:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: ml
  text: ദിവസവും ഞാൻ നിങ്ങളോടൊപ്പം ദൈവാലയത്തിൽ ഉണ്ടായിരുന്നപ്പോൾ, നിങ്ങൾ എനിക്കെതിരെ കൈ നീട്ടിയില്ല[a]. എന്നാൽ ഇതു നിങ്ങളുടെ സമയവും ഇരുട്ടിന്റെ അധികാരവും ആകുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ എന്നെ പിടികൂടിയില്ല.’ ഗ്രീക്കിൽ അക്ഷരാർഥം, ‘എനിക്കെതിരെ കൈകൾ നീട്ടിയില്ല’; ഇവിടെ ശത്രുതാപരമായി പ്രവർത്തിച്ച് പിടികൂടുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇരുട്ടിന്റെ ശക്തിയും.’
    reason: alternative_rendering
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: ദിവസവും
  rationale: ഓരോ ദിവസവും ആവർത്തിച്ചുണ്ടായിരുന്നതിനെ സൂചിപ്പിക്കുന്ന വിതരണപ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: ഞാൻ നിങ്ങളോടൊപ്പം ... ഉണ്ടായിരുന്നപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ കാലസംബന്ധിയായ സാഹചര്യാർഥം സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, ദൈവാലയസമുച്ചയത്തെയും സൂചിപ്പിക്കുന്നു; പൊതുവായ മലയാളപ്രയോഗം ഈ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: നിങ്ങൾ എനിക്കെതിരെ കൈ നീട്ടിയില്ല
  rationale: ശത്രുതാപരമായി കൈ നീട്ടുക എന്ന ഗ്രീക്ക് ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു; അറസ്റ്റിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: എന്നാൽ ഇതു നിങ്ങളുടെ നാഴിക ... ആകുന്നു
  rationale: ὥραയുടെ കേവല ഘടികാരസമയത്തേക്കാൾ വിപുലമായ, നിർണായകമായ അവസരം എന്ന ഗൗരവം ‘നാഴിക’ നിലനിർത്തുന്നു.
- source_word: ἐξουσία
  choice: അധികാരം
  rationale: അവകാശം, അധികാരപരിധി, പ്രവർത്തനാധികാരം എന്നീ അർഥസാധ്യതകളെ ‘അധികാരം’ നിലനിർത്തുന്നു; വെറും ബലമായി ചുരുക്കുന്നില്ല.
- source_word: τοῦ σκότους
  choice: ഇരുട്ടിന്റെ
  rationale: ഇരുട്ടിനെ വ്യക്തിവൽക്കരിക്കുന്നതോ ഒരു മേഖലയായി അവതരിപ്പിക്കുന്നതോ ആയ രൂപകം വിശദീകരിച്ചു തീർക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഇരുട്ടിന്റെ അധികാരം’ എന്നതിനെ സാത്താന്റെ അധികാരമെന്നോ തിന്മയുടെ ആധിപത്യമെന്നോ തുറന്നുപറയണമോ
  choice: ഇരുട്ടിന്റെ അധികാരം
  alternative: ഇരുട്ടിന്റെ ശക്തി; സാത്താന്റെ അധികാരം; തിന്മയുടെ ആധിപത്യം
  rationale: മൂലപാഠം സാത്താനെ നേരിട്ട് പേരെടുത്തു പറയുന്നില്ല. അതിനാൽ രൂപകവും അതിലെ ആത്മീയ-ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൈവാലയം’, ‘നാഴിക’, ‘അധികാരം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ദൃശ്യവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
