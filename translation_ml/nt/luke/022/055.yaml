  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നടുമുറ്റം’, ‘അവരുടെ ഇടയിൽ’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന ഭാവം ‘ഇരിക്കുകയായിരുന്നു’ എന്നതിലൂടെ സൂക്ഷിച്ചിരിക്കുന്നു.
