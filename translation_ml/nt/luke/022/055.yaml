source:
  edition: SBLGNT
  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: ml
  text: അവർ നടുമുറ്റത്തിന്റെ മധ്യത്തിൽ തീ കൊളുത്തി ഒരുമിച്ച് ഇരുന്നശേഷം, പത്രോസ് അവരുടെ ഇടയിൽ ഇരിക്കുകയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പത്രോസ് അവരുടെ നടുവിൽ ഇരുന്നു.’ ഗ്രീക്കിലെ അപൂർണഭൂതകാലക്രിയയെ ലളിതമായി ‘ഇരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ നടന്നുകൊണ്ടിരുന്ന രംഗത്തെ ‘ഇരിക്കുകയായിരുന്നു’ കൂടുതൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: തീ കത്തിച്ച്
  rationale: അഒറിസ്റ്റ് കർത്തൃവാചക കൃദന്തം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. തീ കൊളുത്തുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘തീ കത്തിച്ച്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: πῦρ
  choice: തീ
  rationale: സന്ദർഭത്തിൽ അവിടെ കൊളുത്തിയ ഒരു പ്രത്യേക തീയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അനിശ്ചിത നിർദേശകപദം ചേർക്കാതെ ‘തീ’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: നടുമുറ്റത്തിന്റെ നടുവിൽ
  rationale: αὐλή മഹാപുരോഹിതന്റെ വസതിയിലെ തുറന്ന നടുമുറ്റത്തെയും ἐν μέσῳ അതിന്റെ മധ്യസ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: συγκαθισάντων
  choice: ഒരുമിച്ച് ഇരുന്നപ്പോൾ
  rationale: അഒറിസ്റ്റ് കൃദന്തവും σύν ഉപസർഗവും അവർ കൂട്ടമായി ഇരുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ കാലവാക്യഘടന രണ്ടു കൃദന്തങ്ങളെയും മുഖ്യസംഭവവുമായി വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐκάθητο
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: κάθημαι എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം തുടരുന്ന പശ്ചാത്തലപ്രവൃത്തിയെ ചിത്രീകരിക്കുന്നു; ‘ഇരിക്കുകയായിരുന്നു’ ആ ദൃശ്യാത്മകമായ തുടര്ച്ച നിലനിർത്തുന്നു.
- source_word: μέσος αὐτῶν
  choice: അവരുടെ ഇടയിൽ
  rationale: ജനിറ്റീവിനോടുകൂടിയ μέσος പത്രോസ് ആ കൂട്ടത്തിനുള്ളിൽ ഉണ്ടായിരുന്ന സ്ഥാനം സൂചിപ്പിക്കുന്നു. ‘അവരുടെ ഇടയിൽ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: δὲ
  choice: കാലവാക്യഘടനയിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ കഥ മുന്നോട്ടു കൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിലെ ‘...ഇരുന്നപ്പോൾ’ എന്ന ഘടന അതിന്റെ ആഖ്യാനബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ അധികമായി ‘എന്നാൽ/അപ്പോൾ’ ചേർത്തിട്ടില്ല.
