id: LUK.22.8
reference: Luke 22:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: ml
  text: 'അവൻ പത്രോസിനെയും യോഹന്നാനെയും അയച്ചു; അവരോടു പറഞ്ഞു: “പോയി നമുക്കുവേണ്ടി പെസഹ[a] ഒരുക്കുക, നമുക്കത് ഭക്ഷിക്കേണ്ടതിന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പെസഹാവിരുന്ന്”; ഗ്രീക്കുപദം പെസഹയെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ ഒരുക്കുന്നതും ഭക്ഷിക്കുന്നതുമായ സന്ദർഭം വിരുന്നിലേക്കാണ് ചൂണ്ടുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: ലളിതമായ ആഖ്യാനശൈലിയിൽ ‘അയച്ചു’ എന്നത് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰπών
  choice: പറഞ്ഞുകൊണ്ട്
  rationale: പ്രധാനക്രിയയോടുള്ള ഗ്രീക്ക് കൃതന്തത്തിന്റെ ബന്ധം നിലനിർത്തുകയും തുടർന്നുള്ള വാക്കുകൾ അവൻ അയച്ചപ്പോൾ നൽകിയ നിർദേശമാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: Πορευθέντες
  choice: നിങ്ങൾ പോയി
  rationale: രൂപത്തിൽ കൃതന്തമാണെങ്കിലും നിർദേശസന്ദർഭത്തിൽ പ്രാരംഭ കല്പനയുടെ ശക്തിയുണ്ട്; മലയാളത്തിൽ ‘നിങ്ങൾ പോയി’ സ്വാഭാവികമാണ്.
- source_word: ἑτοιμάσατε
  choice: ഒരുക്കുക
  rationale: ഭക്ഷണവും അനുബന്ധകാര്യങ്ങളും സജ്ജമാക്കുന്നതിനെ സൂചിപ്പിക്കാൻ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: ἡμῖν
  choice: നമുക്കുവേണ്ടി
  rationale: പ്രയോജനാർഥക ദാതിവിന്റെ അർഥം അധിക വ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: τὸ πάσχα
  choice: പെസഹ
  rationale: പദം പെസഹാചരണത്തെയോ വിരുന്നിനെയോ ബന്ധപ്പെട്ട യാഗഘടകത്തെയോ സൂചിപ്പിക്കാം; സന്ദർഭം ഭക്ഷണത്തിലേക്കാണ് ചൂണ്ടുന്നതെങ്കിലും ‘പെസഹ’ മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἵνα φάγωμεν
  choice: നാം അതു ഭക്ഷിക്കട്ടെ
  rationale: ἵνα സഹിതമുള്ള ഉപയുക്തിവിഭക്തിയുടെ ഉദ്ദേശ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘അതു’ എന്നത് സന്ദർഭത്തിൽ പെസഹയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘പെസഹ’ എന്നതിന്റെ സൂചിതാർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘പെസഹ’ എന്നു നിലനിർത്തി
  alternative: ‘പെസഹാവിരുന്ന്’ അല്ലെങ്കിൽ ‘പെസഹാക്കുഞ്ഞാട്’
  rationale: ഒരുക്കി ഭക്ഷിക്കുന്ന സന്ദർഭം വിരുന്നിനെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ അർഥപരിധി ചുരുക്കാതിരിക്കാൻ പ്രധാനപാഠത്തിൽ പൊതുവായ രൂപം നിലനിർത്തി; സാധ്യതയുള്ള വ്യക്തീകരണം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പെസഹ’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തി; വാക്യഘടന അനാവശ്യമായി പുരാതനമാക്കാതെ ഗ്രീക്ക് ബന്ധങ്ങൾ കഴിയുന്നത്ര സംരക്ഷിച്ചു.
