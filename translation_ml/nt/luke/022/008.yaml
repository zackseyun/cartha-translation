- from: 'അവൻ പത്രോസിനെയും യോഹന്നാനെയും അയച്ചുകൊണ്ട് പറഞ്ഞു: “നിങ്ങൾ പോയി നമുക്കുവേണ്ടി പെസഹ[a] ഒരുക്കുക; നാം അതു ഭക്ഷിക്കട്ടെ.”'
  to: 'അവൻ പത്രോസിനെയും യോഹന്നാനെയും അയച്ചു; അവരോടു പറഞ്ഞു: “പോയി നമുക്കുവേണ്ടി പെസഹ[a] ഒരുക്കുക, നമുക്കത് ഭക്ഷിക്കേണ്ടതിന്.”'
