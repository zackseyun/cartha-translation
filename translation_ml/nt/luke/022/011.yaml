id: LUK.22.11
reference: Luke 22:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: ml
  text: 'നിങ്ങൾ വീട്ടുടമയോടു പറയണം: ‘ഗുരു അങ്ങയോടു പറയുന്നു: “എന്റെ ശിഷ്യന്മാരോടൊപ്പം പെസഹ ഭക്ഷിക്കാനുള്ള അതിഥിമുറി എവിടെയാണ്?”’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘താമസസ്ഥലം.’ ഗ്രീക്കിലെ κατάλυμα താമസിക്കാനുള്ള സ്ഥലത്തെയോ അതിഥിമുറിയെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ അതിന് പ്രത്യേകമായി ‘സത്രം’ എന്ന അർഥമില്ല; ‘മുകളിലെ മുറി’ എന്ന വിവരം അടുത്ത വാക്യത്തിലാണ് നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: വീട്ടുടമയോട്
  rationale: οἰκοδεσπότης വീട്ടിലെ അധികാരമുള്ള തലവനെയോ ഉടമയെയോ സൂചിപ്പിക്കുന്നു. ‘വീട്ടുടമ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്; ഗ്രീക്കിലെ ആവർത്തനാത്മകമായ ‘വീടിന്റെ വീട്ടുതലവൻ’ എന്ന ഘടന മലയാളത്തിൽ ഇടർച്ചയുള്ളതിനാൽ സംക്ഷിപ്തമാക്കി.
- source_word: ὁ διδάσκαλος
  choice: ഗുരു
  rationale: διδάσκαλος ഇവിടെ യേശുവിനെ തിരിച്ചറിയിക്കുന്ന സ്ഥാനനാമമാണ്. ‘ഗുരു’ മലയാളത്തിൽ അധ്യാപകനെന്നതിലുപരി ശിഷ്യബന്ധവും ഉൾക്കൊള്ളുന്നതിനാൽ സന്ദർഭോചിതമാണ്; ‘യജമാനൻ’ എന്നത് ഗ്രീക്കിലെ അർഥം മാറ്റും.
- source_word: κατάλυμα
  choice: അതിഥിമുറി
  rationale: κατάλυμα താമസിക്കാനുള്ള ഇടമോ അതിഥികൾക്കുള്ള മുറിയോ ആകാം. ഗൃഹസന്ദർഭത്തിൽ ‘അതിഥിമുറി’ ഏറ്റവും സ്വാഭാവികമാണ്; ‘സത്രം’ തെറ്റിദ്ധരിപ്പിക്കാം, ‘മാളികമുറി’ എന്ന വിവരം അടുത്ത വാക്യത്തിലാണ് വരുന്നത്.
- source_word: τὸ πάσχα
  choice: പെസഹ
  rationale: πάσχα യഹൂദരുടെ പെസഹാചരണത്തെയോ പെസഹാഭക്ഷണത്തെയോ സൂചിപ്പിക്കാം. φάγω എന്ന ഭക്ഷണക്രിയയോടൊപ്പം ഇവിടെ ഭക്ഷണം മുൻനിലയിൽ നിൽക്കുന്നു; ‘പെസഹ ഭക്ഷിക്കാൻ’ എന്ന പ്രയോഗം ആ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: എന്റെ ശിഷ്യന്മാരോടൊപ്പം
  rationale: μαθητής സുവിശേഷസന്ദർഭത്തിൽ വെറും വിദ്യാർഥിയെയല്ല, ഗുരുവിനെ അനുഗമിക്കുന്ന ശിഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: φάγω
  choice: ഭക്ഷിക്കാൻ
  rationale: ὅπου + aorist subjunctive ഉദ്ദേശിക്കപ്പെട്ട പ്രവൃത്തിയുടെ സ്ഥലം ചോദിക്കുന്നു. മലയാളത്തിലെ infinitive രൂപമായ ‘ഭക്ഷിക്കാൻ’ ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു; സാധ്യതയോ അനുമതിയോ അനാവശ്യമായി അമിതമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: ἐρεῖτε
  choice: പറയണം
  rationale: ഭാവികാല സൂചകരൂപം ഇവിടെ നിർദേശപരമായ ശക്തിയോടെ ഉപയോഗിച്ചിരിക്കുന്നു. മലയാളത്തിൽ ‘പറയണം’ ആ പ്രായോഗിക നിർദേശം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: διδάσκαλος എന്ന യേശുവിന്റെ സ്വയംപരാമർശ സ്ഥാനനാമം
  choice: ഗുരു
  alternative: അധ്യാപകൻ; യജമാനൻ
  rationale: ‘ഗുരു’ ഗ്രീക്കിലെ പഠിപ്പിക്കുന്നവൻ എന്ന അർഥവും ശിഷ്യരുമായുള്ള ബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി വഹിക്കുന്നു. ‘യജമാനൻ’ κύριος എന്ന വേറൊരു ആശയം ഇറക്കുമതി ചെയ്യുന്നതിനാൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ ചോദ്യം മലയാളത്തിൽ നേരിട്ടുള്ള അഭിവാചകമായി രൂപപ്പെടുത്തി. ‘നിങ്ങൾ’ ബഹുവചന ശിഷ്യസംബോധനയും ‘നിങ്ങളോട്’ വീട്ടുടമയോടുള്ള മാന്യ ഏകവചനസംബോധനയും സന്ദർഭംകൊണ്ട് വേർതിരിയുന്നു.
