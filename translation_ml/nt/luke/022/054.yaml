  source_fidelity: 'The draft accurately represents the sequence: Jesus is seized, led away, and brought into the high priest’s house; Peter continues following at a spatial distance. The explicit object ‘അവനെ’ with Peter is a permissible clarification of the Greek’s understood object and adds no interpretation.'
  naturalness: The sequence ‘കൊണ്ടുപോയി … വീട്ടിനകത്തേക്കു കൊണ്ടുവന്നു’ is understandable, but ‘കൊണ്ടുവന്നു’ can introduce an unnecessary deictic sense (‘brought here’) after ‘കൊണ്ടുപോയി.’ Recasting the second verb as ‘അകത്തേക്കു കൊണ്ടുചെന്നു’ retains the distinct inward movement more idiomatically.
  terminology: ‘മഹാപുരോഹിതൻ’ is the established Malayalam equivalent for ἀρχιερεύς. ‘പിടികൂടി,’ ‘കൊണ്ടുപോയി,’ ‘കൊണ്ടുചെന്നു,’ and ‘പിന്തുടരുകയായിരുന്നു’ are suitable modern-standard narrative renderings. The footnote is correctly anchored to ‘അകലെനിന്ന്’ and appropriately presents lexical alternatives.
