source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: ml
  text: അവനെ പിടികൂടിയശേഷം അവർ അവനെ കൊണ്ടുപോയി മഹാപുരോഹിതന്റെ വീട്ടിനകത്തേക്കു കൊണ്ടുചെന്നു; എന്നാൽ പത്രോസ് അകലെനിന്ന്[a] അവനെ പിന്തുടരുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അകലം പാലിച്ച്”; പരമ്പരാഗതമായി “ദൂരെനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συλλαβόντες
  choice: പിടികൂടിയശേഷം
  rationale: സυλλαμβάνω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം മുഖ്യക്രിയകൾക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. നിയമപരമായ കസ്റ്റഡിയിലുള്ള പിടികൂടലിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἤγαγον
  choice: കൊണ്ടുപോയി
  rationale: കസ്റ്റഡിയിൽ ഒരിടത്തുനിന്ന് നയിച്ചുകൊണ്ടുപോകുന്ന ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰσήγαγον
  choice: വീട്ടിനകത്തേക്കു കൊണ്ടുവന്നു
  rationale: εἰσάγωയിലെ അകത്തേക്കുള്ള ദിശാബോധം വ്യക്തമായി നിലനിർത്തുകയും മുൻക്രിയയുമായുള്ള വ്യത്യാസം കാണിക്കുകയും ചെയ്യുന്നു.
- source_word: οἰκίαν
  choice: വീട്
  rationale: ഇവിടെ ഭൗതികമായ കെട്ടിടമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ സാധാരണവും നേരിട്ടുള്ളതുമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: ἀρχιερέως
  choice: മഹാപുരോഹിതന്റെ
  rationale: പുതിയനിയമത്തിലെ ἀρχιερεύς എന്ന സ്ഥാനപ്പേരിന്റെ സ്ഥാപിതവും കൃത്യവുമായ മലയാളരൂപമാണിത്.
- source_word: ἠκολούθει
  choice: പിന്തുടരുകയായിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം കഴിഞ്ഞകാലത്ത് തുടരുകയായിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ പുരോഗമനഭാവം നിലനിർത്തുന്നു.
- source_word: μακρόθεν
  choice: അകലെനിന്ന്
  rationale: സ്ഥലപരമായ അകലത്തെ ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: യേശുവിനെ അകത്തേക്കു കൊണ്ടുപോയതും പത്രോസ് അകലെനിന്ന് പിന്തുടർന്നതും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: അറസ്റ്റിനിടെ യേശുവുമായുള്ള പത്രോസിന്റെ ബന്ധത്തെക്കുറിച്ചുള്ള ആഖ്യാനവിവരണം
  choice: ἠκολούθει എന്നത് ‘പിന്തുടരുകയായിരുന്നു’ എന്നും μακρόθεν എന്നത് ‘അകലെനിന്ന്’ എന്നും വിവർത്തനം ചെയ്തു; പത്രോസിന്റെ മനോഭാവത്തെ വിലയിരുത്തുന്ന പദങ്ങൾ ചേർത്തില്ല.
  alternative: ‘പത്രോസ് അകലം പാലിച്ച് പിന്തുടർന്നു’ എന്നോ ‘ദൂരെനിന്ന് പിന്തുടർന്നുകൊണ്ടിരുന്നു’ എന്നോ നൽകാം.
  rationale: വാക്യം പത്രോസ് ശാരീരികമായി അകലെനിന്ന് പിന്തുടർന്നുവെന്ന് പറയുന്നു; എന്നാൽ അവന്റെ ഉദ്ദേശ്യമോ വികാരമോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആഖ്യാനത്തിലെ സംഘർഷം വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ തുടർച്ചയായ ചലനം ‘കൊണ്ടുപോയി … വീട്ടിനകത്തേക്കു കൊണ്ടുവന്നു’ എന്ന ക്രമത്തിൽ നിലനിർത്തി; പത്രോസിന്റെ പ്രവൃത്തിയിൽ മൂലത്തിൽ ഇല്ലാത്ത മാനസിക വിലയിരുത്തൽ ചേർത്തിട്ടില്ല.
