revisions:
- from: അവനെതിരെ ദൈവദൂഷണപരമായ മറ്റു പല കാര്യങ്ങളും അവർ പറഞ്ഞുകൊണ്ടിരുന്നു[a][b].
  to: അവർ അവനെതിരെ നിന്ദിച്ചുകൊണ്ട് മറ്റു പലതും പറഞ്ഞുകൊണ്ടിരുന്നു[a][b].
  rationale: The revision retains the iterative imperfect (‘പറഞ്ഞുകൊണ്ടിരുന്നു’), the sense of additional numerous utterances (‘മറ്റു പലതും’), and the hostile direction toward Jesus (‘അവനെതിരെ’). It renders βλασφημοῦντες with a broad, contextually fitting Malayalam expression rather than imposing the narrower sense ‘blasphemous’ in the main text; that stronger sense remains available in the note.
  reviewer_model: gpt-5.6-terra
