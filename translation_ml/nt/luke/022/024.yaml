  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ καὶ φιλονεικία ἐν αὐτοῖς, τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: ml
  text: അവരിൽ ആരാണ് വലിയവനെന്നു കണക്കാക്കപ്പെടുന്നത് എന്നതിനെച്ചൊല്ലി അവരുടെ ഇടയിൽ ഒരു തർക്കവും ഉടലെടുത്തു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവരിൽ ആരാണ് വലിയവനെന്നു തോന്നുന്നത്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് “തോന്നുക” എന്നും “കണക്കാക്കപ്പെടുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: ഉടലെടുത്തു
  rationale: ഒരു സാഹചര്യം പുതുതായി രൂപപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന γίνομαι എന്ന ക്രിയയുടെ സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, ആഖ്യാനത്തിന്റെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളവാക്യത്തിൽ നിർബന്ധിതമായ ഒരു സംയോജകം ചേർക്കാതെ തന്നെ ആ തുടർച്ച സ്വാഭാവികമാണ്.
- source_word: καὶ
  choice: തർക്കവും
  rationale: ‘-വും’ എന്ന ചേർപ്പ് സംഭവത്തിന്റെ അധികമായ സ്വഭാവം പ്രകടമാക്കി καίയുടെ ‘കൂടി/also’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: φιλονεικία
  choice: തർക്കം
  rationale: പദത്തിലെ മത്സരപരവും കലഹപരവുമായ ഭാവം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐν αὐτοῖς
  choice: അവരുടെ ഇടയിൽ
  rationale: കൂട്ടത്തിനകത്ത് ഉണ്ടായ തർക്കം എന്ന സാമൂഹിക-ബന്ധപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ τίς αὐτῶν
  choice: തങ്ങളിൽ ആരാണ് ... എന്നതിനെച്ചൊല്ലി
  rationale: തർക്കത്തിന്റെ വിഷയത്തെ അവതരിപ്പിക്കുന്ന നാമവത്കൃത പരോക്ഷചോദ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: δοκεῖ
  choice: കണക്കാക്കപ്പെടുന്നത്
  rationale: സംഘത്തിനുള്ളിലെ സ്ഥാനത്തെക്കുറിച്ചുള്ള വിലയിരുത്തൽ എന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘തോന്നുന്നത്’ എന്ന സാദ്ധ്യമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: εἶναι
  choice: ആണ് ... ആയി
  rationale: δοκεῖയുടെ പൂരകമായ ‘ആയിരിക്കുക’ എന്ന ആശയം മലയാളത്തിലെ സംയുക്തവാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: μείζων
  choice: വലിയവൻ
  rationale: ഗ്രീക്കിലെ താരതമ്യരൂപത്തെ ‘ഏറ്റവും വലിയവൻ’ എന്ന അതിശയോത്തരമായി ശക്തിപ്പെടുത്താതെ, വ്യക്തികളുടെ സ്ഥാനമഹത്ത്വത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ ഇടയിലെ സ്ഥാനമഹത്ത്വം
  choice: വലിയവൻ
  alternative: ഏറ്റവും വലിയവൻ; കൂടുതൽ പ്രാധാന്യമുള്ളവൻ
  rationale: μείζων താരതമ്യരൂപമാണ്; മൂലപാഠത്തിൽ ഇല്ലാത്ത അതിശയോത്തരാർഥം ചേർക്കാതെയും ‘പ്രാധാന്യം’ എന്നു വ്യാഖ്യാനിച്ച് അർഥപരിധി ചുരുക്കാതെയും ഭാഷയിലെ പിരിമുറുക്ക് നിലനിർത്തുന്നു.
- issue: δοκεῖ എന്ന ക്രിയയിലെ വിലയിരുത്തലോ തോന്നലോ എന്ന ദ്വയാർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘കണക്കാക്കപ്പെടുന്നത്’; അടിക്കുറിപ്പിൽ ‘തോന്നുന്നത്’
  alternative: പ്രധാനവാചകത്തിൽ ‘തോന്നുന്നത്’
  rationale: സംഘത്തിനുള്ളിലെ സാമൂഹിക വിലയിരുത്തൽ സന്ദർഭത്തിന് ‘കണക്കാക്കപ്പെടുന്നത്’ യോജിക്കുന്നു; എന്നാൽ ഗ്രീക്ക് ക്രിയയുടെ യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഉടലെടുത്തു’ തർക്കം ആരംഭിച്ചതിനെ വ്യക്തമാക്കുന്നു; ‘-വും’ καίയുടെ അധികാർഥം ചുരുക്കമായി വഹിക്കുന്നു. ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം ചേർക്കാതെ താരതമ്യവും ക്രിയയിലെ ദ്വയാർഥവും സംരക്ഷിച്ചിട്ടുണ്ട്.
