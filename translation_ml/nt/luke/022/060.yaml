id: LUK.22.60
reference: Luke 22:60
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസ് പറഞ്ഞു: “മനുഷ്യാ, നീ പറയുന്നത് എന്താണെന്ന് എനിക്ക് അറിയില്ല.” അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ, ഉടനെ ഒരു പൂവൻകോഴി കൂവി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു കോഴി കൂവി.”
    reason: ‘പൂവൻകോഴി’ മൂലപദത്തിന്റെ ലിംഗസൂചന വ്യക്തമാക്കുന്നു; ‘കോഴി’ എന്നത് മലയാളത്തിലെ കൂടുതൽ പൊതുവായ പരമ്പരാഗത പ്രയോഗമാണ്.
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻപത്തെ ആരോപണത്തോടും പത്രോസിന്റെ തുടർന്നുള്ള നിഷേധത്തോടുമുള്ള വൈരുധ്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Ἄνθρωπε
  choice: മനുഷ്യാ
  rationale: ഏകവചന സംബോധനയുടെ നേരിട്ടുള്ള, അല്പം പരുക്കനായ ഭാവം നിലനിർത്തുന്നു; കൂടുതൽ ആദരസൂചകമായ ‘സഹോദരാ’ അല്ലെങ്കിൽ ‘സാർ’ എന്ന വ്യാഖ്യാനപരമായ രൂപങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: οὐκ οἶδα
  choice: എനിക്ക് അറിയില്ല
  rationale: οἶδα എന്ന ക്രിയയുടെ വർത്തമാനാർഥത്തിലുള്ള നിഷേധം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὃ λέγεις
  choice: നീ പറയുന്നത് എന്താണെന്ന്
  rationale: പത്രോസ് ആ വ്യക്തിയുടെ വാക്കുകളെത്തന്നെ നിഷേധിക്കുന്നതെന്ന നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു; ‘നീ എന്താണ് ഉദ്ദേശിക്കുന്നത്’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: παραχρῆμα
  choice: ഉടനെ
  rationale: ഒട്ടും താമസമില്ലാതെ സംഭവിച്ചതിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ
  rationale: പത്രോസിന്റെ സംസാരവും കോഴി കൂവിയതും ഒരേ സമയത്ത് നടന്നുവെന്ന genitive absolute ഘടനയുടെ കാലബന്ധവും ἔτι നൽകുന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: ഒരു പൂവൻകോഴി കൂവി
  rationale: ἀλέκτωρ എന്നത് ആൺകോഴിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പൂവൻകോഴി’ കൃത്യമാണ്; ἐφώνησεν എന്നത് ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘കൂവി’ എന്നു നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പത്രോസിന്റെ മറുപടിയിലെ നേരിട്ടുള്ള ഭാവവും, അവൻ സംസാരിച്ചുകൊണ്ടിരിക്കെ തന്നെ കോഴി കൂവിയെന്ന സമയസമാപ്തിയും സംരക്ഷിച്ചിരിക്കുന്നു.
