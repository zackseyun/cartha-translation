id: LUK.22.63
reference: Luke 22:63
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ οἱ ἄνδρες οἱ συνέχοντες ⸀αὐτὸν ἐνέπαιζον αὐτῷ δέροντες,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: ml
  text: അവനെ പിടിച്ചുവെച്ചിരുന്ന പുരുഷന്മാർ അവനെ അടിച്ചുകൊണ്ട് പരിഹസിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ തടങ്കലിൽ വെച്ചിരുന്ന പുരുഷന്മാർ.’
    reason: συνέχω എന്ന പദം ഈ സന്ദർഭത്തിൽ പിടിച്ചുവെക്കുക എന്നതിനൊപ്പം തടങ്കലിൽ വെക്കുക എന്നും മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: συνέχοντες
  choice: പിടിച്ചുവെച്ചിരുന്ന
  rationale: ഈ സന്ദർഭത്തിൽ യേശുവിനെ തങ്ങളുടെ കാവലിൽ വിട്ടുപോകാൻ അനുവദിക്കാതെ പിടിച്ചുവെച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം ശാരീരികമായി പിടിച്ചുനിർത്തൽ, തടങ്കലിൽ വെക്കൽ എന്നീ സാധ്യതകൾ അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐνέπαιζον
  choice: പരിഹസിച്ചു
  rationale: ശത്രുതയോടെയും അവഹേളനത്തോടെയും കളിയാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: αὐτῷ
  choice: അവനെ
  rationale: ἐμπαίζω എന്ന ക്രിയയോടുള്ള ദാതൃവിഭക്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി നേരിട്ടുള്ള കർമമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: δέροντες
  choice: അടിച്ചുകൊണ്ട്
  rationale: പരിഹാസത്തോടൊപ്പം നടന്ന ശാരീരിക പ്രഹരങ്ങളെ സൂചിപ്പിക്കുന്നു; ചമ്മട്ടികൊണ്ടുള്ള അടിയെന്നോ ഔപചാരിക ശിക്ഷയെന്നോ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἄνδρες
  choice: പുരുഷന്മാർ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ പൊതുവായ ലിംഗനിർദ്ദിഷ്ട പദം അതേപടി നിലനിർത്തുന്നു; ‘കാവൽക്കാർ’ അല്ലെങ്കിൽ ‘പടയാളികൾ’ എന്ന് സന്ദർഭത്തിൽനിന്ന് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: Καὶ
  choice: —
  rationale: മലയാളത്തിലെ സ്വാഭാവികമായ തുടർച്ചയ്ക്കായി വാക്യാരംഭത്തിലെ ലളിത സംയോജകം പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല; മുൻവാക്യവുമായുള്ള ആഖ്യാനബന്ധം വാക്യക്രമത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: യേശുവിനെ ഉപദ്രവിച്ചവരുടെ തിരിച്ചറിയൽ
  choice: അവനെ പിടിച്ചുവെച്ചിരുന്ന പുരുഷന്മാർ
  alternative: അവനെ കാവലിൽ വെച്ചിരുന്ന കാവൽക്കാർ
  rationale: മൂലപാഠം ἄνδρες (‘പുരുഷന്മാർ’) എന്നാണ് പറയുന്നത്; സന്ദർഭം കാവൽചുമതലയുള്ളവരെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും വിവർത്തനം അവരുടെ ഔദ്യോഗിക സ്ഥാനം നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പുരുഷന്മാർ’ എന്നത് മൂലപാഠത്തിന്റെ കൃത്യതയ്ക്കായി നിലനിർത്തി; ‘അടിച്ചുകൊണ്ട്’ അനുബന്ധപ്രവൃത്തിയുടെ തുടർച്ച വ്യക്തമാക്കുന്നു.
