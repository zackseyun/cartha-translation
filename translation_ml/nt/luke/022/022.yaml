source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: ml
  text: കാരണം, മനുഷ്യപുത്രൻ നിശ്ചയിക്കപ്പെട്ടതുപോലെ പോകുന്നു; എങ്കിലും അവനെ ഒറ്റിക്കൊടുക്കുന്ന ആ മനുഷ്യന് അയ്യോ കഷ്ടം![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ ഏൽപ്പിച്ചുകൊടുക്കുന്നവൻ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് “ഒറ്റിക്കൊടുക്കുക” എന്നും “ഏൽപ്പിച്ചുകൊടുക്കുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: മുൻവാക്യത്തിന്റെ വിശദീകരണമായി വരുന്ന ὅτι-യുടെ ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ പരോക്ഷമായി വ്യക്തമാകുന്നു; ‘എന്തെന്നാൽ’ ചേർത്താൽ ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അസ്വാഭാവികത ഉണ്ടാകും.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണത്തിന്റെ സ്ഥാപിതമായ മലയാളരൂപവും അതിന്റെ തിരുവെഴുത്താന്തര പ്രതിധ്വനികളും നിലനിർത്തുന്നു.
- source_word: μέν ... πλὴν
  choice: …; എങ്കിലും
  rationale: μέν സൂചിപ്പിക്കുന്ന ആദ്യഭാഗവും πλὴν കൊണ്ടുവരുന്ന ശക്തമായ വൈരുധ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατὰ τὸ ὡρισμένον
  choice: നിശ്ചയിക്കപ്പെട്ടതുപോലെ
  rationale: മുൻകൂട്ടിയുള്ള നിർണയത്തോടുള്ള അനുരൂപതയും ഗ്രീക്കിലെ കർമണിപ്രയോഗവും നിലനിർത്തുന്നു; നിർണയിച്ച വ്യക്തിയെ മൂലപാഠത്തേക്കാൾ വ്യക്തമാക്കുന്നില്ല.
- source_word: πορεύεται
  choice: പോകുന്നു
  rationale: യേശു മരണത്തിലേക്കു നീങ്ങുന്ന ഗതിയെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ വർത്തമാനകാലപ്രയോഗം.
- source_word: οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: ആ മനുഷ്യന് അയ്യോ കഷ്ടം!
  rationale: പ്രവാചകീയമായ വിലാപവും ന്യായവിധിയുടെ ഗൗരവവും സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തമായി കൈമാറുന്നു.
- source_word: δι’ οὗ
  choice: …കൊടുക്കുന്ന
  rationale: മലയാളത്തിലെ ക്രിയാരൂപത്തിനുള്ളിൽ ഇടനിലക്കാരനായ മനുഷ്യന്റെ പങ്ക് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: παραδίδοται
  choice: ഒറ്റിക്കൊടുക്കുന്ന
  rationale: യൂദായുടെ വഞ്ചനാപരമായ പ്രവൃത്തിയെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; ‘ഏൽപ്പിച്ചുകൊടുക്കുക’ എന്ന കൂടുതൽ നിഷ്പക്ഷമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക നിർണയവും മനുഷ്യന്റെ ഉത്തരവാദിത്വവും തമ്മിലുള്ള ബന്ധം
  choice: ‘നിശ്ചയിക്കപ്പെട്ടതുപോലെ’ എന്ന ദൈവിക നിർണയവും ഒറ്റിക്കൊടുക്കുന്ന മനുഷ്യനോടുള്ള ‘അയ്യോ കഷ്ടം’ എന്ന പ്രഖ്യാപനവും ഒരുപോലെ നിലനിർത്തി.
  alternative: ദൈവിക നിർണയത്തെ മയപ്പെടുത്തുകയോ ഒറ്റിക്കൊടുക്കുന്നവന്റെ കുറ്റബോധത്തെ കുറയ്ക്കുകയോ ചെയ്യുന്ന പരിഭാഷ.
  rationale: ഗ്രീക്ക് പാഠം ഈ രണ്ടു സത്യങ്ങളെയും വൈരുധ്യത്തോടെ ചേർത്തുവയ്ക്കുന്നു; ഒരു പ്രത്യേക ദൈവശാസ്ത്രസംവിധാനത്തിന്റെ അനുകൂലമായി ആ സംഘർഷം പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മനുഷ്യപുത്രൻ’ എന്ന സ്ഥാപിത തിരുവെഴുത്തുപദം നിലനിർത്തി; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി.
