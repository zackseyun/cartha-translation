- from: 'എന്തെന്നാൽ, ഞാൻ നിങ്ങളോടു പറയുന്നു: എഴുതപ്പെട്ടിരിക്കുന്ന ഈ വചനം എന്നിൽ നിവൃത്തിയാകേണ്ടതാണ്: “അധർമ്മികളോടൊപ്പം അവൻ എണ്ണപ്പെട്ടു.”[a] എന്നെക്കുറിച്ചുള്ളത് അതിന്റെ പൂർത്തിയിലേക്കെത്തുകയാണ്.[b]'
  to: 'എന്തെന്നാൽ, എഴുതപ്പെട്ടിരിക്കുന്ന ഈ വചനം എന്നിൽ നിവൃത്തിയാകേണ്ടതാണെന്ന് ഞാൻ നിങ്ങളോടു പറയുന്നു: “നിയമലംഘകരോടൊപ്പം അവൻ എണ്ണപ്പെട്ടു.”[a] എന്നെക്കുറിച്ചുള്ള കാര്യം പൂർത്തിയിലേക്കെത്തുകയാണ്.[b]'
