source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, എഴുതപ്പെട്ടിരിക്കുന്ന ഈ വചനം എന്നിൽ നിവൃത്തിയാകേണ്ടതാണെന്ന് ഞാൻ നിങ്ങളോടു പറയുന്നു: “നിയമലംഘകരോടൊപ്പം അവൻ എണ്ണപ്പെട്ടു.”[a] എന്നെക്കുറിച്ചുള്ള കാര്യം പൂർത്തിയിലേക്കെത്തുകയാണ്.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, പരമ്പരാഗതമായി: “അതിക്രമക്കാരുടെ കൂട്ടത്തിൽ അവൻ എണ്ണപ്പെട്ടു” (യെശയ്യാവ് 53:12).'
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ: “എന്നെക്കുറിച്ചുള്ള കാര്യത്തിന് നിവൃത്തി വരുന്നു” / “എന്നെക്കുറിച്ചുള്ള കാര്യം അവസാനത്തിലേക്കെത്തുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: എന്തെന്നാൽ, ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: γάρ സൂചിപ്പിക്കുന്ന വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; λέγω ... ὑμῖν എന്നത് സ്വാഭാവികമായി ‘ഞാൻ നിങ്ങളോടു പറയുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: എഴുതപ്പെട്ടിരിക്കുന്ന ഈ വചനം
  rationale: പൂർണ്ണകാല കർമണി പങ്കാളിയുടെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കാൻ ‘എഴുതപ്പെട്ടിരിക്കുന്ന’ എന്നു നൽകി. ഗ്രീക്കിൽ ‘തിരുവെഴുത്ത്’ എന്ന നാമം നേരിട്ട് ഇല്ലാത്തതിനാൽ അതു ചേർക്കാതെ, മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘വചനം’ ഉപയോഗിച്ചു.
- source_word: δεῖ τελεσθῆναι ἐν ἐμοί
  choice: എന്നിൽ നിവൃത്തിയാകേണ്ടതാണ്
  rationale: δεῖ യുടെ അനിവാര്യത ‘വേണ്ടതാണ്’ എന്നതിലും, പ്രവചനവചനത്തിന്റെ പൂർത്തീകരണം τελεσθῆναιയ്ക്ക് ‘നിവൃത്തിയാകുക’ എന്നതിലും പ്രകടമാക്കുന്നു; ἐν ἐμοί എന്നത് വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘എന്നിൽ’ എന്നുതന്നെ നിലനിർത്തി.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: അധർമ്മികളോടൊപ്പം അവൻ എണ്ണപ്പെട്ടു
  rationale: ἄνομος എന്നത് നിയമലംഘകനെന്നതോടൊപ്പം ‘നിയമമില്ലാത്ത/അധർമ്മിയായ’ എന്ന അർത്ഥവും വഹിക്കുന്നു; ഇവിടെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘അധർമ്മികൾ’ തെരഞ്ഞെടുത്തു. ἐλογίσθη കർമണിയായി ‘എണ്ണപ്പെട്ടു’ എന്നു നൽകി.
- source_word: τὸ περὶ ἐμοῦ
  choice: എന്നെക്കുറിച്ചുള്ളത്
  rationale: യേശുവിനെ സംബന്ധിക്കുന്ന കാര്യങ്ങളെ സൂചിപ്പിക്കുന്ന ആർട്ടിക്കിൾ ചേർന്ന വാക്യഘടനയെ അധിക വ്യാഖ്യാനം കൂടാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τέλος ἔχει
  choice: അതിന്റെ പൂർത്തിയിലേക്കെത്തുകയാണ്
  rationale: τέλος ἔχει എന്ന പ്രയോഗത്തിൽ അന്ത്യം, സമാപനം, പൂർത്തീകരണം എന്നീ അർത്ഥസാധ്യതകളുണ്ട്. സന്ദർഭത്തിലെ മുന്നേറ്റവും പൂർത്തീകരണവും വ്യക്തമാക്കുമ്പോഴും ഒറ്റ അർത്ഥത്തിലേക്ക് അതിനെ പൂർണമായി ചുരുക്കാത്ത രൂപമാണിത്.
theological_decisions:
- issue: യെശയ്യാവ് 53:12-ലെ ഉദ്ധരണിയിൽ ἀνόμων എന്നതിന്റെ പരിഭാഷ
  choice: അധർമ്മികളോടൊപ്പം അവൻ എണ്ണപ്പെട്ടു
  alternative: അതിക്രമക്കാരുടെ കൂട്ടത്തിൽ അവൻ എണ്ണപ്പെട്ടു
  rationale: മൂലഗ്രീക്കിലെ ἀνόμων എന്നതിന് ‘അധർമ്മികൾ’ നേരിട്ടുള്ള തുല്യപദമാണ്. പരിചിതമായ യെശയ്യാ-പരിഭാഷാശൈലി വായനക്കാർക്കായി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: τέλος ἔχει എന്നതിലെ അന്ത്യം–പൂർത്തീകരണം അർത്ഥസംഘർഷം
  choice: അതിന്റെ പൂർത്തിയിലേക്കെത്തുകയാണ്
  alternative: അതിന് നിവൃത്തി വരുന്നു / അത് അവസാനത്തിലേക്കെത്തുന്നു
  rationale: യേശുവിനെക്കുറിച്ചുള്ള ദൈവികമായി നിർണയിക്കപ്പെട്ട സംഭവങ്ങൾ പര്യവസാനത്തിലേക്കു നീങ്ങുന്നു എന്ന സന്ദർഭബോധം നൽകുന്നു; അതേസമയം ‘അവസാനം’ എന്നതോ ‘നിവൃത്തി’ എന്നതോ മാത്രം നിർബന്ധിച്ച് അർത്ഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഉദ്ധരണിയുടെ തിരുവെഴുത്തുസ്വരം നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ പദപ്രയോഗം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
