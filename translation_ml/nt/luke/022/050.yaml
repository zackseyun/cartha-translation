  terminology: മഹാപുരോഹിതൻ and അടിമ appropriately render ἀρχιερεύς and δοῦλος in this literal social setting. The footnote retains the conventional alternative ദാസൻ. The name transliteration doulos should be presented in Malayalam script for a Malayalam footnote.
