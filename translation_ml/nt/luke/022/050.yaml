id: LUK.22.50
reference: Luke 22:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: ml
  text: അവരിൽ ഒരാൾ മഹാപുരോഹിതന്റെ അടിമയെ പ്രഹരിച്ചു; അയാളുടെ വലതുചെവി മുറിച്ചുമാറ്റി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മഹാപുരോഹിതന്റെ ദാസനെ.’ ഗ്രീക്കിലെ ദൂലൊസ് എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘അടിമ’ എന്നോ ‘ദാസൻ’ എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: വെട്ടി
  rationale: πατάσσω ശക്തമായ പ്രഹരത്തെ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ ആയുധംകൊണ്ടുള്ള പ്രഹരവും അതിന്റെ ഫലമായി ചെവി മുറിഞ്ഞുപോയതും സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘വെട്ടി’ അനുയോജ്യമാണ്.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: അവരിൽ ഒരാൾ
  rationale: εἷς τις എന്ന അനിശ്ചിത പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപമാണിത്; ആ വ്യക്തിയുടെ പേര് പറയാതെയുള്ള ലൂക്കോസിന്റെ അവതരണം ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: മഹാപുരോഹിതന്റെ അടിമയെ
  rationale: δοῦλος ഇവിടെ ഒരു വ്യക്തിയുടെ സാമൂഹികമായി അധീനമായ നിലയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അടിമ’ എന്ന് പരിഭാഷപ്പെടുത്തി; മൃദുവായ ‘ദാസൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἀφεῖλεν
  choice: മുറിച്ചുകളഞ്ഞു
  rationale: ἀφαιρέω അടിസ്ഥാനമായി ‘നീക്കുക/എടുത്തുകളയുക’ എന്നാണ്; ചെവിക്കേറ്റ ആയുധപ്രഹരത്തിന്റെ സന്ദർഭത്തിൽ ഫലം വ്യക്തവും സ്വാഭാവികവുമായി പറയാൻ ‘മുറിച്ചുകളഞ്ഞു’ ഉപയോഗിച്ചു.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: അയാളുടെ വലതുചെവി
  rationale: ശരീരഭാഗവും അതിന്റെ വശവും കൃത്യമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്. ഒരേ വാക്യത്തിലെ രണ്ട് പുരുഷന്മാരിൽ പരിക്കേറ്റ വ്യക്തിയെ വ്യക്തമായി സൂചിപ്പിക്കാൻ ‘അയാളുടെ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ
  rationale: ഇവിടെ δοῦλος ആലങ്കാരികമോ ദൈവശാസ്ത്രപരമോ അല്ല, അന്നത്തെ യഥാർഥ സാമൂഹിക അധീനനിലയെ സൂചിപ്പിക്കുന്ന പദമാണ്. അതിനാൽ ആ നില മറച്ചുവയ്ക്കാതെ ‘അടിമ’ എന്നു നൽകി; സാധാരണയായി ഉപയോഗിക്കപ്പെടുന്ന ‘ദാസൻ’ എന്ന പരിഭാഷ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘വലതുചെവി’ എന്ന സംയുക്തരൂപം സാധാരണ വായനയ്ക്ക് സ്വാഭാവികമാണ്; അടിക്കുറിപ്പ് സൂചിക മുഖ്യവാക്യത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
