reference: Luke 22:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: ml
  text: പ്രധാനപുരോഹിതന്മാരും ശാസ്ത്രിമാരും അവനെ എങ്ങനെ കൊല്ലാമെന്ന്[a] അന്വേഷിച്ചുകൊണ്ടിരുന്നു; കാരണം അവർ ജനത്തെ ഭയപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ എങ്ങനെ വധിക്കാമെന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം മുൻകാലത്തെ തുടർച്ചയായ ശ്രമത്തെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആ ദൈർഘ്യഭാവം നിലനിർത്തുന്നു.
- source_word: ἀρχιερεῖς
  choice: പ്രധാനപുരോഹിതന്മാർ
  rationale: യെരൂശലേമിലെ പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷവിവരണങ്ങളിൽ γραμματεῖς എന്ന പദത്തിന്റെ നേരിട്ടുള്ള പരമ്പരാഗത മലയാളരൂപം; വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുന്ന ‘നിയമപണ്ഡിതർ’ എന്നതിനെക്കാൾ മൂലത്തോട് അടുത്തത്.
- source_word: τὸ πῶς
  choice: എങ്ങനെ
  rationale: ‘എങ്ങനെ’ അഥവാ ‘ഏതു വിധത്തിൽ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἀνέλωσιν
  choice: കൊല്ലാമെന്ന്
  rationale: ഈ സന്ദർഭത്തിൽ ἀναιρέω ഒരാളെ മരണത്തിലൂടെ ഇല്ലാതാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഉദ്ദേശ്യത്തിന്റെ കാഠിന്യം മയപ്പെടുത്താതെ സ്വാഭാവികമായി പറയുന്നു.
- source_word: ἐφοβοῦντο
  choice: ഭയപ്പെട്ടിരുന്നു
  rationale: തുടർന്നുനിന്ന ഭയാവസ്ഥയെ അപൂർണ ഭൂതകാലത്തിന് യോജിച്ച വിധത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τὸν λαόν
  choice: ജനത്തെ
  rationale: λαός ഇവിടെ ഒരു കൂട്ടമായ ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ജനക്കൂട്ടം’ എന്നു പറഞ്ഞ് സന്നിഹിതരായ ഒരു പ്രത്യേക കൂട്ടത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: നേതാക്കളുടെ ഉദ്ദേശ്യവുമായി ബന്ധപ്പെട്ട ἀνέλωσιν എന്ന പദത്തിന്റെ ശക്തി
  choice: കൊല്ലാമെന്ന്
  alternative: മരണത്തിന് ഏൽപ്പിക്കാമെന്ന്; ഇല്ലാതാക്കാമെന്ന്
  rationale: മൂലപാഠത്തിലെ കൊലപ്പെടുത്താനുള്ള വ്യക്തമായ ഉദ്ദേശ്യം മയപ്പെടുത്താതെയും ഈ ഘട്ടത്തിൽ ഔപചാരികമായ വധനടപടി അനാവശ്യമായി നിർദേശിക്കാതെയും നിലനിർത്തുന്നു.
- issue: λαός എന്ന പദത്തിന്റെ പരാമർശവ്യാപ്തി
  choice: ജനത്തെ
  alternative: ജനക്കൂട്ടത്തെ
  rationale: പൊതുജനപ്രതികരണത്തെക്കുറിച്ചുള്ള നേതാക്കളുടെ ഭയം എന്ന വിവരണാത്മക സംഘർഷം നിലനിർത്തുകയും പരാമർശത്തെ ഒരു പ്രത്യേകമായി കൂടിയിരുന്ന ജനക്കൂട്ടത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘പ്രധാനപുരോഹിതന്മാർ’, ‘ശാസ്ത്രിമാർ’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; ക്രിയാരൂപങ്ങളിൽ ഗ്രീക്കിലെ തുടർച്ചാഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
