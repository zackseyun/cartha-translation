id: LUK.22.14
reference: Luke 22:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐγένετο ἡ ὥρα, ἀνέπεσεν καὶ ⸀οἱ ἀπόστολοι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/014.yaml
  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: ml
  text: ആ സമയം വന്നപ്പോൾ, അവൻ ഭക്ഷണത്തിനായി ചാരിക്കിടന്നു[a]; അപ്പൊസ്തലന്മാരും അവനോടൊപ്പം ചാരിക്കിടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ ക്രിയ പുരാതനകാലത്ത് ഭക്ഷണം കഴിക്കുമ്പോൾ പതിവായിരുന്ന ചാരിക്കിടക്കുന്ന ശരീരനിലയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: ആ സമയം വന്നപ്പോൾ
  rationale: നിശ്ചിതമായ ഒരു സന്ദർഭം വന്നെത്തിയെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ‘ആ’ എന്നത് നിർദിഷ്ടത സംരക്ഷിക്കുന്നു; ‘സമയം’ ഇവിടെ ‘നാഴിക’യെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: ἀνέπεσεν
  choice: ഭക്ഷണത്തിനായി ചാരിക്കിടന്നു
  rationale: പുരാതന ഭക്ഷണരീതിയിലെ ചാരിക്കിടക്കുന്ന ശരീരനിലയെ ക്രിയ സൂചിപ്പിക്കുന്നു. ‘ഇരുന്നു’ എന്നു മാത്രം പറയുന്നത് ചരിത്രപരമായ ഈ പ്രത്യേകത മറച്ചുകളയും; ഭക്ഷണസന്ദർഭം വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ അർഥം സ്വാഭാവികമാക്കുന്നു.
- source_word: οἱ ἀπόστολοι
  choice: അപ്പൊസ്തലന്മാർ
  rationale: അറിയപ്പെടുന്ന ശിഷ്യസംഘത്തെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമത്തിന്റെ നേരിട്ടുള്ള, പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: σὺν αὐτῷ
  choice: അവനോടൊപ്പം
  rationale: കൂട്ടായ സാന്നിധ്യം സൂചിപ്പിക്കുന്ന σύν എന്ന പദബന്ധത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: Καὶ
  choice: വാക്യഘടനയിൽ പ്രത്യേകം പദമായി ആവർത്തിച്ചിട്ടില്ല
  rationale: മുൻകഥനത്തോടുള്ള ലളിതമായ ബന്ധം മലയാളത്തിലെ തുടർച്ചയായ വാക്യക്രമം തന്നെ അറിയിക്കുന്നു; തുടക്കത്തിൽ ‘പിന്നെ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർത്താൽ ഗ്രീക്കിൽ ഇല്ലാത്ത അധിക കാലസൂചന തോന്നാം.
theological_decisions:
- issue: പെസഹാഭക്ഷണസന്ദർഭത്തിലെ ശരീരനില
  choice: ഭക്ഷണത്തിനായി ചാരിക്കിടന്നു
  alternative: ഭക്ഷണത്തിന് ഇരുന്നു
  rationale: ഗ്രീക്ക് ക്രിയയിൽ അടങ്ങിയിരിക്കുന്ന ചരിത്രപരമായ ഭക്ഷണരീതി നിലനിർത്തുന്നു; ഇതിലൂടെ പ്രത്യേകമായ ഒരു ആചാരശാസ്ത്രപരമോ സഭാവിഭാഗപരമോ ആയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ‘ആ സമയം’ എന്ന പ്രയോഗത്തിന്റെ നിശ്ചിതത്വം
  choice: ആ സമയം വന്നപ്പോൾ
  alternative: സമയം ആയപ്പോൾ
  rationale: നിർദിഷ്ട ലേഖനവും കഥയിലെ നിശ്ചയിക്കപ്പെട്ട സന്ദർഭബോധവും സംരക്ഷിക്കുന്നു; അതേസമയം അതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി പരിഭാഷയിൽ അധികമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ഗ്രീക്കിലെ രണ്ടാം ക്രിയയുടെ ലോപം മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ചാരിക്കിടന്നു’ എന്നു ആവർത്തിച്ചു.
