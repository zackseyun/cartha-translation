id: LUK.22.25
reference: Luke 22:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “യഹൂദേതര ജനതകളുടെ[a] രാജാക്കന്മാർ അവരുടെമേൽ ആധിപത്യം നടത്തുന്നു; അവരുടെമേൽ അധികാരം പ്രയോഗിക്കുന്നവർ ‘ഉപകാരദാതാക്കൾ’[b] എന്നു വിളിക്കപ്പെടുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജനതകളുടെ.”
    reason: lexical_alternative
  - marker: b
    text: “ഉപകാരദാതാക്കൾ” എന്നത് പൊതുജനനന്മ ചെയ്യുന്നവരായി കണക്കാക്കപ്പെട്ട ഭരണാധികാരികൾക്കോ ശക്തരായ രക്ഷാധികാരികൾക്കോ നൽകിയിരുന്ന ഒരു ബഹുമതിപ്പട്ടമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: രാജാക്കന്മാർ
  rationale: പൊതുവായ ഭരണാധികാരികളെക്കാൾ വ്യക്തമായി രാജാക്കന്മാരെ സൂചിപ്പിക്കുന്ന പദമായതിനാൽ അതിന്റെ രാഷ്ട്രീയ കൃത്യത നിലനിർത്തുന്നു.
- source_word: τῶν ἐθνῶν
  choice: യഹൂദേതരരുടെ
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികൾ എന്ന പശ്ചാത്തലത്തിൽ ἔθνη സാധാരണയായി യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘ജനതകളുടെ’ എന്ന വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κυριεύουσιν
  choice: ആധിപത്യം നടത്തുന്നു
  rationale: വെറും ഭരണം എന്നതിലുപരി മറ്റുള്ളവരുടെമേൽ മേൽക്കോയ്മ പ്രയോഗിക്കുന്നതിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐξουσιάζοντες
  choice: അധികാരം പ്രയോഗിക്കുന്നവർ
  rationale: അധികാരസ്ഥാനത്ത് ഇരിക്കുക മാത്രമല്ല, അധികാരം സജീവമായി വിനിയോഗിക്കുക എന്ന കൃദന്തരൂപത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: εὐεργέται
  choice: ‘ഉപകാരികൾ’
  rationale: നന്മ ചെയ്യുന്നവർ എന്ന അടിസ്ഥാനാർഥവും ഭരണാധികാരികൾക്കും ശക്തരായ രക്ഷാധികാരികൾക്കും നൽകിയിരുന്ന ബഹുമതിപ്പട്ടത്തിന്റെ സ്വഭാവവും സംക്ഷിപ്തമായി നൽകുന്നു; ഉദ്ധരണിച്ചിഹ്നങ്ങൾ പട്ടനാമപ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: καλοῦνται
  choice: എന്നു വിളിക്കപ്പെടുന്നു
  rationale: അവർ സ്വയം അവകാശപ്പെടുന്നു എന്ന് നിർബന്ധിക്കാതെ, മറ്റുള്ളവർ നൽകുന്ന പേരോ പട്ടമോ എന്ന കർമണിപ്രയോഗം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ ശിഷ്യന്മാരുടെ തർക്കത്തോടുള്ള മൃദുവായ വൈരുധ്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐθνῶν എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: യഹൂദേതരരുടെ
  alternative: ജനതകളുടെ
  rationale: ഈ വാക്യം യഹൂദേതര രാഷ്ട്രീയാധികാരത്തിന്റെ രീതിയെ യേശു ശിഷ്യന്മാർക്കു നൽകുന്ന മാതൃകയുമായി താരതമ്യം ചെയ്യുന്നു. അതിനാൽ സാധാരണ പുതിയനിയമാർഥം മുഖ്യപാഠത്തിൽ നൽകുകയും പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: εὐεργέται എന്നതിന്റെ വിലയിരുത്തൽഭാവം
  choice: ‘ഉപകാരികൾ’ എന്നു വിളിക്കപ്പെടുന്നു
  alternative: നന്മ ചെയ്യുന്നവർ എന്നു വിളിക്കപ്പെടുന്നു
  rationale: മൂലപാഠം ഈ പട്ടം യഥാർഥമായി അർഹിക്കുന്നുവോ പരിഹാസപരമാണോ എന്ന് തുറന്നുപറയുന്നില്ല. അതിനാൽ ഉദ്ധരണിച്ചിഹ്നങ്ങളിലൂടെ പട്ടനാമസ്വഭാവം സൂചിപ്പിക്കുമ്പോഴും വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘ആധിപത്യം നടത്തുന്നു’ എന്ന പ്രയോഗം κυριεύουσιν എന്നതിലെ മേൽക്കോയ്മയുടെ ഭാവം നൽകുന്നു. അടിക്കുറിപ്പ് സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ നേരിട്ട് ചേർത്തിരിക്കുന്നു.
