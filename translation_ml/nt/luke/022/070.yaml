id: LUK.22.70
reference: Luke 22:70
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: ml
  text: 'അപ്പോൾ അവരെല്ലാവരും ചോദിച്ചു: “അങ്ങനെയെങ്കിൽ, നീ ദൈവത്തിന്റെ പുത്രനാണോ?” അവൻ അവരോടു പറഞ്ഞു: “ഞാൻ ആണെന്ന് നിങ്ങൾതന്നെ പറയുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ സ്വാഭാവികമായി, “നിങ്ങൾ പറയുന്നതുപോലെതന്നെ” എന്നോ “നിങ്ങൾ അങ്ങനെ പറയുന്നു” എന്നോ പരിഭാഷപ്പെടുത്താം. സന്ദർഭത്തിൽ യേശുവിന്റെ വാക്കുകൾ സമ്മതസൂചകമായ മറുപടിയാണ്; എന്നാൽ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “ഞാൻ ആണെന്ന് നിങ്ങൾതന്നെ പറയുന്നു” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: അവരെല്ലാവരും
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന ബഹുവചന വിശേഷണം ആ സംഘത്തിലെ എല്ലാവരെയും സൂചിപ്പിക്കുന്നു; ‘അവരെല്ലാവരും’ കൂട്ടായ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അങ്ങനെയെങ്കിൽ
  rationale: മുൻസംഭാഷണത്തിൽനിന്നുള്ള നിഗമനം ചോദ്യംരൂപത്തിൽ അവതരിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ ‘അങ്ങനെയെങ്കിൽ’ അതിന്റെ അനുമാനാത്മക ബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പുത്രൻ
  rationale: ക്രിസ്തുവിനെക്കുറിച്ചുള്ള ഔപചാരിക സ്ഥാനനാമത്തിന്റെ പൂർണരൂപം നിലനിർത്തുന്നു; ‘ദൈവപുത്രൻ’ എന്ന ചുരുക്കത്തേക്കാൾ ഗ്രീക്ക് ഘടനയോട് അടുത്തതാണ്.
- source_word: ἔφη
  choice: പറഞ്ഞു
  rationale: ഇവിടെ പ്രത്യേകമായി ‘പ്രഖ്യാപിച്ചു’ എന്നോ ‘മറുപടി നൽകി’ എന്നോ വിപുലീകരിക്കേണ്ടതില്ല; സന്ദർഭത്തിൽ സാധാരണമായ പ്രസ്താവനാക്രിയ മതിയാകുന്നു.
- source_word: Ὑμεῖς
  choice: നിങ്ങൾതന്നെ
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം പ്രത്യേകം രേഖപ്പെടുത്തിയിരിക്കുന്നതിനാൽ അതിന്റെ ഊന്നൽ ‘തന്നെ’ ഉപയോഗിച്ച് നിലനിർത്തുന്നു.
- source_word: λέγετε
  choice: പറയുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള നേരിട്ടുള്ള പ്രസ്താവന മലയാളത്തിലും വർത്തമാനകാലത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: അവർ പറയുന്നതിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ὅτι എന്ന ബന്ധകത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യരൂപമാണിത്.
- source_word: ἐγώ εἰμι
  choice: ഞാൻ ആണ്
  rationale: ഗ്രീക്കിലെ ഹ്രസ്വവും ഗൗരവമുള്ളതുമായ പ്രയോഗം അനാവശ്യമായി വിശദീകരിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു; വാക്യത്തിൽ സന്ധിയോടെ ‘ഞാൻ ആണെന്ന്’ എന്നു വരുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ മറുപടി വ്യക്തമായ സമ്മതവാക്യമായോ പരോക്ഷവും പരിധിയുള്ളതുമായ മറുപടിയായോ പരിഭാഷപ്പെടുത്തണോ
  choice: “ഞാൻ ആണെന്ന് നിങ്ങൾതന്നെ പറയുന്നു” എന്ന ഗ്രീക്ക് ഘടന പ്രധാന പാഠത്തിൽ നിലനിർത്തുക
  alternative: “നിങ്ങൾ പറയുന്നതുപോലെതന്നെ” / “അതെ, നിങ്ങൾ പറയുന്നതു ശരിയാണ്”
  rationale: സന്ദർഭത്തിൽ മറുപടി സമ്മതസൂചകമായി പ്രവർത്തിക്കുന്നെങ്കിലും, ഗ്രീക്ക് അതിനെ നേരിട്ടുള്ള ‘അതെ’യായി വികസിപ്പിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സൂക്ഷ്മതയും വാചകത്തിലെ സംഘർഷവും നിലനിർത്തി, കൂടുതൽ പ്രയോഗസൗകര്യമുള്ള വായനകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചോദ്യം ചോദിക്കുന്ന മുഴുവൻ സംഘത്തെയും സൂചിപ്പിക്കാൻ ബഹുവചനമായ ‘നിങ്ങൾ’ ഉപയോഗിച്ചു. ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനനാമം ഔപചാരികമായി നിലനിർത്തുകയും, മറുപടിയിലെ ഗ്രീക്ക് അസ്പഷ്ടത ലളിതീകരിക്കാതെ സംരക്ഷിക്കുകയും ചെയ്തു.
