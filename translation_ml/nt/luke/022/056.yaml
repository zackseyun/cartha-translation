  terminology: “സേവികയായ പെൺകുട്ടി,” “സൂക്ഷിച്ചുനോക്കി,” and “അവനോടുകൂടെ ഉണ്ടായിരുന്നു” are clear, dignified, and do not overinterpret the social status or association. The source/audit-trail ambiguity concerning the location relative to the light should be retained in a Malayalam footnote.
