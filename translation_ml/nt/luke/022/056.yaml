  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: ml
  text: 'അപ്പോൾ ഒരു സേവികയായ പെൺകുട്ടി വെളിച്ചത്തിനരികെ ഇരുന്ന അവനെ കണ്ടിട്ട്, അവനെ സൂക്ഷിച്ചുനോക്കി പറഞ്ഞു: “ഇയാളും അവനോടുകൂടെ ഉണ്ടായിരുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοῦσα
  choice: കണ്ട്
  rationale: ὁράωയുടെ aorist participle ആയതിനാൽ, തുടർന്നുള്ള പ്രവൃത്തികളിലേക്കു സ്വാഭാവികമായി നയിക്കുന്ന മലയാള ക്രിയാവിനയെച്ചരൂപം തിരഞ്ഞെടുത്തു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ ശക്തമായ വിരോധമല്ല, കഥയിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: παιδίσκη τις
  choice: ഒരു വേലക്കാരിപ്പെൺകുട്ടി
  rationale: പദം യുവതിയായ സ്ത്രീസേവികയെയോ അടിമപ്പെൺകുട്ടിയെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ സാമൂഹിക അടിമസ്ഥിതിക്ക് അനാവശ്യ ഊന്നൽ നൽകാതെ, τις എന്ന അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- source_word: καθήμενον πρὸς τὸ φῶς
  choice: അവൻ വെളിച്ചത്തിനരികെ ഇരിക്കുന്നത്
  rationale: καθήμενον പത്രോസിന്റെ ഇരിപ്പിനെയും πρὸς τὸ φῶς വെളിച്ചസ്രോതസ്സിനോടുള്ള സമീപസ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു; തീയെന്ന് വാക്യത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: ἀτενίσασα αὐτῷ
  choice: അവനെ സൂക്ഷിച്ചുനോക്കി
  rationale: ശ്രദ്ധ കേന്ദ്രീകരിച്ചുള്ള ഉറച്ച നോട്ടത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Καὶ οὗτος
  choice: ഇയാളും
  rationale: καίയുടെ ‘കൂടി/ഉം’ എന്ന അർഥവും οὗτος എന്ന ചൂണ്ടിക്കാണിക്കുന്ന പ്രയോഗത്തിന്റെ തിരിച്ചറിയൽശക്തിയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: σὺν αὐτῷ ἦν
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: ബന്ധമോ കൂട്ടായ്മയോ കൂടുതൽ വ്യാഖ്യാനിക്കാതെ മൂലത്തിലെ ലളിതമായ പ്രസ്താവന നേരിട്ട് നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ ക്രിയാവിനയെച്ചങ്ങളുടെ ഒഴുക്ക് സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തി; സന്ദർഭത്തിൽ നിന്ന് ‘തീയുടെ വെളിച്ചം’ എന്നു വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
