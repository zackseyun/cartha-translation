id: LUK.22.47
reference: Luke 22:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: ml
  text: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഇതാ, ഒരു ജനക്കൂട്ടം വന്നു. പന്ത്രണ്ടുപേരിൽ ഒരുവനായ, യൂദാസ് എന്നു വിളിക്കപ്പെട്ടവൻ ആ ജനക്കൂട്ടത്തിനു മുന്നിൽ പോകുകയായിരുന്നു[a]. അവൻ യേശുവിന്റെ അടുത്തേക്കു ചെന്നു, അവനെ ചുംബിക്കാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അവരെ നയിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു’ / ‘അവർക്കു മുമ്പേ പോയിക്കൊണ്ടിരിക്കുകയായിരുന്നു.’'
    reason: προήρχετο αὐτούς എന്ന പ്രയോഗത്തിന് കൂട്ടത്തിനു മുമ്പായി നീങ്ങുക എന്നതോടൊപ്പം അവരെ നയിക്കുക എന്ന അർഥനിഴലും ഉണ്ടാകാം.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകൃന്നന്തരൂപത്തോടുകൂടിയ genitive absolute, തുടർന്ന് സംഭവിക്കുന്ന കാര്യത്തോടൊപ്പം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ഇനിയും ... സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ’ അതിന്റെ കാലപരവും തുടർച്ചാസൂചകവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ജനക്കൂട്ടത്തിന്റെ പെട്ടെന്നുള്ള പ്രത്യക്ഷതയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഖ്യാനസൂചകം; ഗ്രീക്കിലെ ദൃശ്യവൈവിദ്ധ്യം നിലനിർത്തുന്നു.
- source_word: ὄχλος
  choice: ഒരു ജനക്കൂട്ടം വന്നു
  rationale: ὄχλος എന്നതിന്റെ സാധാരണ അർഥം ‘ജനക്കൂട്ടം’ ആണ്. സന്ദർഭത്തിൽ സൂചിതമായ വരവ് മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ വാക്യമായി വ്യക്തമാക്കാൻ ‘വന്നു’ ചേർത്തിരിക്കുന്നു.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: യൂദാസ് എന്നു വിളിക്കപ്പെട്ടവൻ
  rationale: പങ്കാളിത്തരൂപത്തിലുള്ള തിരിച്ചറിയിക്കൽ അടുത്തായി നിലനിർത്തുന്നു; ‘എന്നു വിളിക്കപ്പെട്ടവൻ’ അധിക വിലയിരുത്തൽ ചേർക്കുന്നില്ല.
- source_word: εἷς τῶν δώδεκα
  choice: പന്ത്രണ്ടുപേരിൽ ഒരുവനായ
  rationale: യൂദാസ് പന്ത്രണ്ടുപേരിൽപ്പെട്ടവനാണെന്ന തിരിച്ചറിയലും അതിലെ ആഖ്യാനവൈരുധ്യവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: προήρχετο αὐτούς
  choice: അവരുടെ മുമ്പിൽ നടന്നുവരികയായിരുന്നു
  rationale: കൂട്ടത്തിനു മുമ്പായി നീങ്ങുന്നതും imperfect രൂപത്തിലെ തുടരുന്ന പ്രവൃത്തിയും പ്രകടമാക്കുന്നു; ഔപചാരികമായി ‘നയിച്ചു’ എന്ന അർഥം നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: യേശുവിനെ ... അടുത്തുചെന്നു
  rationale: ἐγγίζω സൂചിപ്പിക്കുന്ന സമീപനത്തെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: φιλῆσαι αὐτόν
  choice: അവനെ ചുംബിക്കാൻ
  rationale: ഈ സന്ദർഭത്തിൽ φιλέω ചുംബിക്കുന്ന പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; അഭിവാദ്യമെന്ന വിശദീകരണമോ വഞ്ചനയെന്ന വ്യാഖ്യാനമോ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യൂദാസിന്റെ പ്രവൃത്തിയുടെ ആഖ്യാനാവതരണം
  choice: സമീപിക്കലും ചുംബിക്കാനുള്ള ഉദ്ദേശ്യവും പാഠത്തിലുള്ളതുപോലെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘ചുംബനത്തിലൂടെ അവനെ ഒറ്റിക്കൊടുക്കാൻ’ എന്ന വ്യാഖ്യാനവികാസം.
  rationale: ചുറ്റുപാടിലുള്ള ഭാഗം ഒറ്റിക്കൊടുക്കലിനെ വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും, ഈ വാക്യം തന്നെ സമീപനവും ചുംബിക്കാനുള്ള ഉദ്ദേശ്യവുമാണ് വിവരിക്കുന്നത്. അതിനാൽ ധാർമ്മികമോ ദൈവശാസ്ത്രപരമോ ആയ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ മുൻകൂട്ടി ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷകപദം മൂലപാഠത്തിന്റെ ആഖ്യാനതീവ്രതയ്ക്കായി നിലനിർത്തി. [a] അടയാളം അത് വിശദീകരിക്കുന്ന ‘അവരുടെ മുമ്പിൽ നടന്നുവരികയായിരുന്നു’ എന്ന പ്രയോഗത്തിനു പിന്നാലെ വെച്ചു.
