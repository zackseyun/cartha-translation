  naturalness: ‘അവർക്കു മുന്നിൽ പോകുകയായിരുന്നു’ ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘യേശുവിന്റെ അടുത്തേക്കു ചെന്നു’ സമീപനത്തിന്റെ ദിശയെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
  terminology: ‘ജനക്കൂട്ടം,’ ‘പന്ത്രണ്ടുപേരിൽ ഒരുവൻ,’ ‘യൂദാസ്,’ ‘യേശു,’ ‘ചുംബിക്കുക’ എന്നിവ കൃത്യവും രജിസ്റ്ററിനു യോജിച്ചതുമാണ്. ‘ഇതാ’ ἰδού-യുടെ ആഖ്യാനശ്രദ്ധാകർഷണം നിലനിർത്തുന്നു.
  issues:
