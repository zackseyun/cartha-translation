  to: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഇതാ, ഒരു ജനക്കൂട്ടം വന്നു. പന്ത്രണ്ടുപേരിൽ ഒരുവനായ, യൂദാസ് എന്നു വിളിക്കപ്പെട്ടവൻ ആ ജനക്കൂട്ടത്തിനു മുന്നിൽ പോകുകയായിരുന്നു[a]. അവൻ യേശുവിന്റെ അടുത്തേക്കു ചെന്നു, അവനെ ചുംബിക്കാൻ.
  rationale: 'മുഖ്യപാഠത്തിലെ ഒരേയൊരു സുരക്ഷിത തിരുത്തൽ προήρχετο-യുടെ അർഥപരിധി സംരക്ഷിക്കാനാണ്: ‘നടന്നുവരികയായിരുന്നു’ എന്നതിനു പകരം ‘ആ ജനക്കൂട്ടത്തിനു മുന്നിൽ പോകുകയായിരുന്നു’ ഉപയോഗിച്ചു. അവസാനവാക്യത്തിലെ പദക്രമം യേശുവിനെ സമീപിച്ചതിനുശേഷമുള്ള ചുംബനോദ്ദേശ്യം വ്യക്തമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് അതേ വാക്യഘടകത്തിനുശേഷം തന്നെയാണ് നിലനിർത്തിയിരിക്കുന്നത്.'
