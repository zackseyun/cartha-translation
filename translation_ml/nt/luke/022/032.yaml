reference: Luke 22:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: ml
  text: എന്നാൽ നിന്റെ വിശ്വാസം ക്ഷയിച്ചുപോകാതിരിക്കാൻ ഞാൻ നിനക്കുവേണ്ടി പ്രാർഥിച്ചിട്ടുണ്ട്.[a] നീ മടങ്ങിവന്നശേഷം[b] നിന്റെ സഹോദരന്മാരെ ശക്തിപ്പെടുത്തുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ വിശ്വസ്തത” അല്ലെങ്കിൽ “നിന്റെ ആശ്രയം ക്ഷയിച്ചുപോകാതിരിക്കാൻ.” ഗ്രീക്ക് പദത്തിന് പരസ്പരം മുട്ടിച്ചേരുന്ന ഈ അർഥങ്ങൾ വഹിക്കാനാകും.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “നീ തിരിഞ്ഞുവന്നശേഷം” അല്ലെങ്കിൽ “നീ വീണ്ടും മടങ്ങിയശേഷം.” പത്രോസിന്റെ വരാനിരിക്കുന്ന വീഴ്ചയ്ക്കുശേഷമുള്ള പുനഃസ്ഥാപനത്തെ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: പ്രാർഥിച്ചിട്ടുണ്ട്
  rationale: ക്രിയ ആത്മാർഥമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു. യേശു ഇതിനകം നടത്തിയ പ്രാർഥനയുടെ ഇപ്പോഴത്തെ പ്രസക്തി സ്വാഭാവികമായ മലയാളത്തിൽ ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: περὶ σοῦ
  choice: നിനക്കുവേണ്ടി
  rationale: പ്രാർഥനാക്രിയയോടൊപ്പമുള്ള περί + genitive ഇവിടെ മധ്യസ്ഥപ്രാർഥനയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിനക്കുവേണ്ടി’ എന്നതാണ് സ്വാഭാവികം.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: ക്ഷയിച്ചുപോകാതിരിക്കേണ്ടതിന്
  rationale: ἐκλείπω എന്നതിന് ക്ഷയിക്കുക, നിലച്ചുപോകുക, പരാജയപ്പെടുക എന്നീ അർഥസാധ്യതകളുണ്ട്. പത്രോസിന്റെ വിശ്വാസം പൂർണമായി ഇല്ലാതാകുന്നു എന്ന് അതിശയിപ്പിക്കാതെ അതിന്റെ ദുർബലമാകൽ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: വിശ്വാസം, ആശ്രയം, വിശ്വസ്തത എന്നീ പരസ്പരം മുട്ടിച്ചേരുന്ന അർഥങ്ങൾ ഉൾക്കൊള്ളാൻ കഴിയുന്ന പതിവും വിശാലവുമായ മലയാളപദമാണിത്.
- source_word: ποτε
  choice: ശേഷം
  rationale: ഭാവിയിലെ ഒരു ഘട്ടത്തെ സൂചിപ്പിക്കുന്ന ποτέ, ἐπιστρέψας എന്ന പങ്കാളിക്രിയയോടൊപ്പം മലയാളത്തിൽ ‘മടങ്ങിവന്നശേഷം’ എന്ന് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἐπιστρέψας
  choice: മടങ്ങിവന്നശേഷം
  rationale: തിരിഞ്ഞുവരുക/മടങ്ങിവരുക എന്ന ദിശാരൂപകം നിലനിർത്തുകയും പത്രോസിന്റെ വീഴ്ചയ്ക്കുശേഷമുള്ള പുനഃസ്ഥാപനത്തിന്റെ സൂചന അനുവദിക്കുകയും ചെയ്യുന്നു; ‘മാനസാന്തരപ്പെട്ടശേഷം’ എന്ന കൂടുതൽ സാങ്കേതിക വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: στήρισον
  choice: ശക്തിപ്പെടുത്തുക
  rationale: മറ്റുള്ളവരെ ഉറപ്പിക്കുകയും ദൃഢരാക്കുകയും ചെയ്യാനുള്ള ആജ്ഞയെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀδελφούς
  choice: സഹോദരന്മാരെ
  rationale: സന്ദർഭത്തിലെ ഉടനെയുള്ള സൂചന യേശുവിന്റെ പുരുഷശിഷ്യന്മാരിലേക്കാണ്; അതിനാൽ ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പരീക്ഷയുടെ സന്ദർഭത്തിൽ πίστις എന്നതിലെ ‘വിശ്വാസം’–‘വിശ്വസ്തത’ അർഥവ്യാപ്തി
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഗ്രീക്ക് പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വിശാലത ചുരുക്കാതെ മുഖ്യവാചകത്തിൽ ‘വിശ്വാസം’ ഉപയോഗിച്ചു; മറ്റ് സാധ്യമായ സൂക്ഷ്മാർഥങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: പത്രോസിന്റെ ഭാവിസ്ഥിതിയുമായി ബന്ധപ്പെട്ട ἐπιστρέψας എന്നതിന്റെ അർഥം
  choice: മടങ്ങിവന്നശേഷം
  alternative: തിരിഞ്ഞുവന്നശേഷം; വീണ്ടും മടങ്ങിയശേഷം; മാനസാന്തരപ്പെട്ടശേഷം
  rationale: വീഴ്ചയ്ക്കുശേഷമുള്ള പുനഃസ്ഥാപനം സൂചിപ്പിക്കുമ്പോഴും, ഗ്രീക്ക് പദത്തേക്കാൾ ഇടുങ്ങിയ സാങ്കേതിക മാനസാന്തരഭാഷ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- issue: സന്ദർഭത്തിലെ ἀδελφούς എന്നതിന്റെ ലിംഗസൂചന
  choice: സഹോദരന്മാരെ
  alternative: സഹോദരീസഹോദരന്മാരെ; സഹവിശ്വാസികളെ
  rationale: ഉടനെയുള്ള സന്ദർഭം പുരുഷശിഷ്യരുടെ വൃത്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഏകവചന ‘നീ/നിന്റെ’ ഉപയോഗിച്ച് യേശു പത്രോസിനോട് നേരിട്ട് സംസാരിക്കുന്നതു നിലനിർത്തി. ‘ക്ഷയിച്ചുപോകുക’ വിശ്വാസം പൂർണമായി ഇല്ലാതാകുന്നു എന്നതിനെക്കാൾ അതിന്റെ തളർച്ചയെ സൂചിപ്പിക്കുന്നു; ‘മടങ്ങിവരുക’ പശ്ചാത്താപത്തിന്റെ സാധ്യത അനുവദിക്കുമ്പോഴും അതിനെ സാങ്കേതിക പദമായി നിർബന്ധിക്കുന്നില്ല.
