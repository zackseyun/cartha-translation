id: LUK.22.18
reference: Luke 22:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, ⸀οὐ μὴ πίω ἀπὸ τοῦ ⸂νῦν ἀπὸ τοῦ⸃ γενήματος τῆς ἀμπέλου ἕως ⸀οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: ml
  text: 'കാരണം, ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇനിമുതൽ ദൈവരാജ്യം വരുന്നതുവരെ മുന്തിരിവള്ളിയുടെ ഫലത്തിൽനിന്ന് ഞാൻ തീർച്ചയായും കുടിക്കുകയില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വീഞ്ഞ്.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “മുന്തിരിവള്ളിയുടെ ഫലം” എന്നാണ്; സാധാരണയായി വീഞ്ഞ് എന്ന പദം ഉപയോഗിക്കാതെ, പാനപാത്രത്തിലുള്ളത് സൂചിപ്പിക്കുന്ന വിശാലമായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: കാരണം, ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: λέγω with the dative is naturally rendered as direct address; γάρ preserves the explanatory connection with the preceding saying.
- source_word: οὐ μὴ πίω
  choice: ഞാൻ തീർച്ചയായും കുടിക്കുകയില്ല
  rationale: The emphatic οὐ μή with the aorist subjunctive expresses a strong future denial. തീർച്ചയായും ... കുടിക്കുകയില്ല conveys that emphasis without implying an unrestricted ‘never,’ since the following clause sets a temporal boundary.
- source_word: ἀπὸ τοῦ νῦν
  choice: ഇനിമുതൽ
  rationale: This is the natural modern Malayalam idiom for a starting point extending forward from the present.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: മുന്തിരിവള്ളിയുടെ ഫലത്തിൽനിന്ന്
  rationale: This closely preserves the broader source expression ‘produce/fruit of the vine’ rather than narrowing it explicitly to wine.
- source_word: ἕως οὗ
  choice: വരുന്നതുവരെ
  rationale: The suffix construction -വരെ naturally marks the temporal limit of the preceding emphatic negation.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: This established Malayalam expression preserves both royal rule and kingdom associations without specifying a particular stage or mode.
- source_word: ἔλθῃ
  choice: വരുന്നത്
  rationale: Within the Malayalam temporal construction വരുന്നതുവരെ, this naturally expresses the future-oriented subjunctive sense ‘until ... comes.’
theological_decisions:
- issue: Whether γενήματος τῆς ἀμπέλου should be rendered explicitly as wine
  choice: മുന്തിരിവള്ളിയുടെ ഫലം
  alternative: വീഞ്ഞ്
  rationale: The Greek uses the broader, formal expression ‘fruit/produce of the vine.’ Retaining it avoids narrowing the cup’s contents beyond what is explicit and preserves the meal expression’s resonance.
- issue: The force and timing of the kingdom’s coming
  choice: ദൈവരാജ്യം വരുന്നതുവരെ
  alternative: ദൈവരാജ്യം പൂർണമായി വരുന്നതുവരെ
  rationale: The source states a future temporal boundary but does not define the precise mode, fullness, or stage of the kingdom’s coming. The translation leaves that theological tension intact.
translation_notes:
  register: Modern standard Malayalam in a dignified but readily understandable register. The sentence order is adjusted slightly for natural Malayalam while preserving the explanatory γάρ, emphatic negation, temporal limit, and the source text’s broader vine-fruit expression.
