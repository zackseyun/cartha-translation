id: LUK.22.31
reference: Luke 22:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: ml
  text: “ശിമോനേ, ശിമോനേ, നോക്കൂ! നിങ്ങളെയെല്ലാം തനിക്കു വേണമെന്ന് സാത്താൻ ആവശ്യപ്പെട്ടിരിക്കുന്നു; ഗോതമ്പ് പാറ്റുന്നതുപോലെ നിങ്ങളെ പാറ്റാൻ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: നോക്കൂ!
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഈ പദത്തിന്റെ പ്രസംഗസന്ദർഭത്തിലെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξῃτήσατο
  choice: ആവശ്യപ്പെട്ടിരിക്കുന്നു
  rationale: ശക്തമായി ആവശ്യപ്പെടുക/തനിക്കായി ചോദിച്ചുവാങ്ങുക എന്ന ആശയം നൽകുന്നു; ആരോടാണ് ആവശ്യപ്പെട്ടത് എന്ന് മൂലപാഠം പറയാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: ὑμᾶς
  choice: നിങ്ങളെയെല്ലാം
  rationale: ഗ്രീക്കിലെ ബഹുവചനമായ ‘നിങ്ങളെ’ ശിമോൻ മാത്രം അല്ല, ശിഷ്യസംഘത്തെ ഉദ്ദേശിക്കുന്നുവെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοῦ σινιάσαι ὡς τὸν σῖτον
  choice: ഗോതമ്പുപോലെ പാറ്റേണ്ടതിന്
  rationale: ധാന്യം പാറ്റി വേർതിരിക്കുന്ന ദൃശ്യരൂപം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സാത്താന്റെ അപേക്ഷയുടെ അധികാരപരമായ ഭാവം
  choice: ആവശ്യപ്പെട്ടിരിക്കുന്നു
  alternative: അനുവാദം ചോദിച്ചിരിക്കുന്നു
  rationale: മൂലത്തിലെ ശക്തമായ ἐξῃτήσατο നിലനിർത്തുന്നു; ദൈവത്തോടാണ് അനുവാദം ചോദിച്ചതെന്നത് ഈ വാക്യത്തിൽ തുറന്നുപറയാത്തതിനാൽ വ്യാഖ്യാനമായി ചേർക്കുന്നില്ല.
- issue: ὑμᾶς എന്ന ബഹുവചനത്തിന്റെ വ്യാപ്തി
  choice: നിങ്ങളെയെല്ലാം
  alternative: നിന്നെ
  rationale: ശിമോനെ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്തിട്ടും സർവനാമം ബഹുവചനമാണ്; ഈ വ്യത്യാസവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ നേരിട്ടും ഗൗരവമുള്ളതുമായ അഭിസംബോധന. ‘ശിമോനേ’ എന്ന സംബോധനരൂപവും ആവർത്തനവും മുന്നറിയിപ്പിന്റെ അടിയന്തരത നിലനിർത്തുന്നു.
