id: LUK.22.67
reference: Luke 22:67
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “നീ മശീഹയാണെങ്കിൽ[a] ഞങ്ങളോടു പറയുക.” എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു പറഞ്ഞാൽ നിങ്ങൾ ഒരിക്കലും വിശ്വസിക്കുകയില്ല;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ക്രിസ്തു.”
    reason: സ്ഥാനപ്പേരിന്റെ പരമ്പരാഗതമായ മറ്റൊരു രൂപം നൽകുന്നു.
lexical_decisions:
- source_word: λέγοντες
  choice: അവർ പറഞ്ഞു
  rationale: മുൻവിവരണത്തോടു ബന്ധിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപമാണെങ്കിലും, ആധുനിക മലയാളത്തിൽ സംഭാഷണം സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ സമാപിക ക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: Εἰ σὺ εἶ
  choice: നീ ... ആണെങ്കിൽ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ഉപാധിരൂപം നേരിട്ടുള്ള ചോദ്യമാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹ
  rationale: യഹൂദരുടെ അഭിഷിക്തനായ പ്രതീക്ഷിത രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്ന് നൽകി.
- source_word: εἰπὸν ἡμῖν
  choice: ഞങ്ങളോടു പറയുക
  rationale: ആജ്ഞാരൂപത്തിന്റെ ശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: എന്നാൽ അവൻ അവരോടു പറഞ്ഞു
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യം ‘എന്നാൽ’ വഴി പ്രകടമാക്കുന്നു.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞാലും
  rationale: ഇവിടെ തുടർന്നുവരുന്ന നിഷേധാത്മക ഫലത്തോടുള്ള concessive ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുമ്പോഴും ഗ്രീക്കിലെ ഉപാധിബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: οὐ μὴ πιστεύσητε
  choice: നിങ്ങൾ ഒരിക്കലും വിശ്വസിക്കുകയില്ല
  rationale: οὐ μή എന്ന ഊന്നലുള്ള നിഷേധം ‘ഒരിക്കലും ... ഇല്ല’ എന്ന വ്യക്തമായ ആധുനിക മലയാളത്തിലൂടെ കൈമാറുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: വിചാരണയുടെ യഹൂദസന്ദർഭത്തിൽ അഭിഷിക്തനായ പ്രതീക്ഷിത വ്യക്തി എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം ‘മശീഹ’ വ്യക്തമായി നിലനിർത്തുന്നു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ഉപാധിരൂപവും ഊന്നലുള്ള നിഷേധവും നിലനിർത്തി; വാക്യാവസാനത്തിലെ അർധവിരാമം അടുത്ത വാക്യത്തിലേക്കുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നു.
