id: LUK.22.59
reference: Luke 22:59
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ διαστάσης ὡσεὶ ὥρας μιᾶς ἄλλος τις διϊσχυρίζετο λέγων· Ἐπ’ ἀληθείας καὶ οὗτος μετ’ αὐτοῦ ἦν, καὶ γὰρ Γαλιλαῖός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: ml
  text: 'ഏകദേശം ഒരു മണിക്കൂർ കഴിഞ്ഞപ്പോൾ, മറ്റൊരാൾ[a] തറപ്പിച്ചുപറഞ്ഞു: “തീർച്ചയായും ഇവനും അവനോടുകൂടെ ഉണ്ടായിരുന്നു; ഇവനും ഗലീലക്കാരനാണല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മറ്റൊരുവൻ.” ἄλλος τις എന്ന ഗ്രീക്ക് പ്രയോഗം അനിശ്ചിതമാണ്; എന്നാൽ സന്ദർഭം സംസാരിച്ചത് ഒരു പുരുഷനാണെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: ഏകദേശം ഒരു മണിക്കൂർ കഴിഞ്ഞപ്പോൾ
  rationale: സമയത്തിന്റെ കടന്നുപോകൽ സൂചിപ്പിക്കുന്ന genitive absolute ഘടനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ὡσεὶ എന്ന ഏകദേശാർഥവും നിലനിർത്തുന്നു.
- source_word: ἄλλος τις
  choice: മറ്റൊരാൾ
  rationale: ‘മറ്റൊരാൾ/വേറെയൊരാൾ’ എന്ന അനിശ്ചിതത്വം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്. സന്ദർഭത്തിൽ പുരുഷനാകാമെങ്കിലും മൂലപ്രയോഗത്തെക്കാൾ അധികമായി ലിംഗം നിർണ്ണയിക്കുന്നില്ല.
- source_word: διϊσχυρίζετο
  choice: തറപ്പിച്ചുപറഞ്ഞു
  rationale: ശക്തമായോ ഉറച്ചോ വാദിച്ചു പറഞ്ഞതെന്ന ക്രിയയുടെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: Ἐπ’ ἀληθείας
  choice: തീർച്ചയായും
  rationale: പ്രസ്താവനയുടെ സത്യതയെ ശക്തമായി ഉറപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: οὗτος
  choice: ഇവനും
  rationale: പത്രോസിനെ ചൂണ്ടിക്കാണിക്കുന്ന demonstrative ഭാവം ‘ഇവൻ’ നിലനിർത്തുന്നു; καί എന്ന ‘കൂടി’ എന്ന അർഥം ‘-ഉം’ വഴി പകരുന്നു.
- source_word: μετ’ αὐτοῦ ἦν
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: കൂട്ടായ്മയെയോ സഹവാസത്തെയോ സൂചിപ്പിക്കുന്ന ലളിതമായ മൂലവാക്യത്തെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നേരിട്ട് പകരുന്നു.
- source_word: καὶ γὰρ
  choice: ഇവനും … ആണല്ലോ
  rationale: γάρ നൽകുന്ന കാരണാത്മക പിന്തുണയും καί നൽകുന്ന ‘കൂടി’ എന്ന അർഥവും മലയാളത്തിലെ ‘-ഉം … ആണല്ലോ’ എന്ന സ്വാഭാവിക ഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: Γαλιλαῖός ἐστιν
  choice: ഗലീലക്കാരനാണ്
  rationale: പത്രോസിന്റെ പ്രാദേശിക തിരിച്ചറിയൽ നേരിട്ടും സാധാരണ മലയാളത്തിലും വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആരോപണത്തിന്റെ ഊന്നൽ ‘തറപ്പിച്ചുപറഞ്ഞു,’ ‘തീർച്ചയായും,’ ‘ആണല്ലോ’ എന്നീ പ്രയോഗങ്ങളിലൂടെ നിലനിർത്തിയിരിക്കുന്നു; മൂലത്തിലെ അനിശ്ചിതത്വം ‘മറ്റൊരാൾ’ എന്നതിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
