source:
  edition: SBLGNT
  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: ml
  text: നിങ്ങൾ എന്റെ രാജ്യത്തിൽ എന്റെ മേശയിൽ ഭക്ഷിക്കാനും കുടിക്കാനും, ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളെ ന്യായംവിധിച്ചുകൊണ്ട് സിംഹാസനങ്ങളിൽ ഇരിക്കാനും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ചെയ്യേണ്ടതിനാണ്
  rationale: മുൻവാക്യത്തിലെ വാഗ്ദാനത്തിൽനിന്ന് ഉരുത്തിരിയുന്ന ഉദ്ദേശ്യത്തെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്ന ἵναയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἔσθητε καὶ πίνητε
  choice: ഭക്ഷിക്കുകയും കുടിക്കുകയും
  rationale: ἵναയെ തുടർന്നുള്ള രണ്ടു ക്രിയകളെയും സ്വാഭാവികമായ മലയാള സമുച്ചയമായി അവതരിപ്പിക്കുന്നു; സാധ്യത/ഉദ്ദേശ്യഭാവം അവസാനത്തെ ‘ചെയ്യേണ്ടതിനാണ്’ വഹിക്കുന്നു.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: എന്റെ മേശയ്ക്കരികിൽ
  rationale: മേശയിലുള്ള കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; അക്ഷരാർഥത്തിലുള്ള ‘മേശയുടെമേൽ’ ഇവിടെ തെറ്റിദ്ധാരണയുണ്ടാക്കും.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: എന്റെ രാജ്യത്തിൽ
  rationale: വിരുന്നിന്റെയും സിംഹാസനങ്ങളുടെയും പശ്ചാത്തലത്തിൽ βασιλείαയുടെ രാജ്യ/രാജകീയ അധികാര അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: നിങ്ങൾ സിംഹാസനങ്ങളിൽ ഇരുന്ന്
  rationale: ഭാവികാല വാഗ്ദാനവും രാജകീയ-ന്യായാധിപത്യ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: κρίνοντες
  choice: ന്യായം വിധിക്കും
  rationale: κρίνωയുടെ ഏറ്റവും നേരിട്ടുള്ള ന്യായാധിപത്യ അർഥം നൽകുന്നു; ഭരിക്കുക എന്ന വിശാലമായ അധികാരഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളെ
  rationale: ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളെന്ന ഉടമ്പടിസംബന്ധമായ പരാമർശം സുതാര്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളെ ‘ന്യായം വിധിക്കുന്ന’ ശിഷ്യന്മാരുടെ ഭാവി ചുമതലയുടെ സ്വഭാവം
  choice: പ്രധാനപാഠത്തിൽ ന്യായാധിപത്യഭാഷയായ ‘ന്യായം വിധിക്കും’ നിലനിർത്തി.
  alternative: ‘ഭരിക്കും’ അല്ലെങ്കിൽ ‘ഭരണനിർവഹണം നടത്തും’.
  rationale: κρίνω എന്നതിന് ന്യായവിധിയുടെയും ഭരണാധികാരത്തിന്റെയും ഭാവങ്ങൾ ഉണ്ടാകാം. അതിനെ ശിക്ഷാവിധിയെന്നോ ഭരണചുമതലയെന്നോ മാത്രം ചുരുക്കാതെ, നേരിട്ടുള്ള അർഥം പ്രധാനപാഠത്തിലും വിശാല സാധ്യത അടിക്കുറിപ്പിലും നൽകി ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉദ്ദേശ്യഭാവമുള്ള ആദ്യഘടകവും ഉറപ്പുള്ള ഭാവികാല വാഗ്ദാനമായ രണ്ടാംഘടകവും അർധവിരാമംകൊണ്ട് വേർതിരിച്ചു. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാണിക്കുന്ന പദത്തിനുശേഷമാണ് [a] ചേർത്തിരിക്കുന്നത്.
