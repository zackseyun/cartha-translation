revisions:
- from: നിങ്ങൾ എന്റെ രാജ്യത്തിൽ എന്റെ മേശയ്ക്കരികിൽ ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്യേണ്ടതിനാണ്; നിങ്ങൾ സിംഹാസനങ്ങളിൽ ഇരുന്ന് ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളെ ന്യായം വിധിക്കും.[a]
  to: നിങ്ങൾ എന്റെ രാജ്യത്തിൽ എന്റെ മേശയിൽ ഭക്ഷിക്കാനും കുടിക്കാനും, ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളെ ന്യായംവിധിച്ചുകൊണ്ട് സിംഹാസനങ്ങളിൽ ഇരിക്കാനും.
  rationale: The revision replaces ‘beside my table’ with the natural Malayalam expression for table fellowship, and reshapes the dependent ἵνα clause so that it reads coherently as the continuation of the preceding promise. It retains the direct judicial rendering of κρίνοντες, while the footnote preserves its possible governing implication. The footnote marker is omitted from the revised text because it must be anchored to a specific expression; if the project requires an alternative-reading note here, place [a] immediately after «ന്യായംവിധിച്ചുകൊണ്ട്» and retain the supplied footnote.
