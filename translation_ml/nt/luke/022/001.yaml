id: LUK.22.1
reference: Luke 22:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: ml
  text: പെസഹ എന്നു വിളിക്കപ്പെടുന്ന പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ പെരുന്നാൾ[a] അടുത്തുവരികയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പെസഹയും പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ പെരുന്നാളും അടുത്ത ബന്ധമുള്ള ആചരണങ്ങളായിരുന്നു; യഹൂദരുടെ പ്രയോഗത്തിൽ ഇവയെ ഒരുമിച്ചോ, ഭാഗികമായി ഒരേ അർഥത്തിൽ വരുന്ന പേരുകളാലോ സൂചിപ്പിക്കാറുണ്ടായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: അടുത്തുവരികയായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം പെരുന്നാൾ അടുത്തെത്തിക്കൊണ്ടിരുന്നുവെന്ന തുടർച്ചയായ ഭാവം സൂചിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ഇത് മൃദുവായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ അധിക ബന്ധകപദമില്ലാതെയും സ്വാഭാവികമായി ആഖ്യാനമാറ്റം വ്യക്തമാകുന്നു.
- source_word: ἡ ἑορτὴ τῶν ἀζύμων
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ പെരുന്നാൾ
  rationale: യഹൂദമതത്തിലെ നിർദിഷ്ട ഉത്സവത്തിന്റെ പേര് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മലയാളത്തിൽ സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἡ λεγομένη
  choice: എന്നു വിളിക്കപ്പെടുന്നത്
  rationale: ഉത്സവത്തെ മറ്റൊരു പേരിലൂടെ വിശദീകരിക്കുന്ന കർത്തരിപ്രയോഗത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: Πάσχα
  choice: പെസഹ
  rationale: യഹൂദ ഉത്സവത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ പേരാണ്; അനാവശ്യമായി അർത്ഥവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ പെരുന്നാളും പെസഹയും തമ്മിലുള്ള ബന്ധം
  choice: 'ലൂക്കോസ് നൽകുന്ന വിശദീകരണാത്മക തിരിച്ചറിയൽ അതേപടി നിലനിർത്തി: “പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ പെരുന്നാൾ, പെസഹ എന്നു വിളിക്കപ്പെടുന്നത്.”'
  alternative: രണ്ട് ആചരണങ്ങളെയും കർശനമായി വേർതിരിക്കുന്ന വിധത്തിൽ കാലക്രമപരമായ വ്യത്യാസം പരിഭാഷയിൽ ഊന്നിപ്പറയുക.
  rationale: മൂലവാക്യം ഉത്സവകാലത്തെ പരസ്പരം മൂടിനിൽക്കുന്ന പേരുകളിലൂടെ വിവരിക്കുന്നു. സാങ്കേതിക വ്യത്യാസം നിർബന്ധിച്ചോ സമന്വയിപ്പിച്ചോ പറയാതെ ലൂക്കോസിന്റെ ഭാഷയിലെ ബന്ധവും സാധ്യതയുള്ള സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. “പെരുന്നാൾ,” “പെസഹ” എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; δέയ്ക്ക് കൃത്രിമമായ ഒരു ആരംഭബന്ധകം ചേർത്തിട്ടില്ല.
