id: LUK.22.40
reference: Luke 22:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γενόμενος δὲ ἐπὶ τοῦ τόπου εἶπεν αὐτοῖς· Προσεύχεσθε μὴ εἰσελθεῖν εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: ml
  text: 'അവൻ ആ സ്ഥലത്ത് എത്തിയപ്പോൾ അവരോടു പറഞ്ഞു: “നിങ്ങൾ പ്രലോഭനത്തിൽ[a] അകപ്പെടാതിരിക്കാൻ പ്രാർഥിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പരീക്ഷണം” അല്ലെങ്കിൽ “ശോധന.” ഗ്രീക്കുപദം ധാർമികമായ പ്രലോഭനത്തെയോ, കൂടുതൽ വിശാലമായി ഒരു പരീക്ഷണകാലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: എത്തിയപ്പോൾ
  rationale: γίνομαι എന്ന ക്രിയയുടെ aorist participle, ἐπὶ τοῦ τόπου എന്ന പ്രയോഗത്തോടൊപ്പം, ഒരു സ്ഥലത്തെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എത്തിയപ്പോൾ’ മുൻപുണ്ടായ സംഭവവും തുടർന്ന് പറഞ്ഞ വാക്കും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: —പ്പോൾ എന്ന കാലസംബന്ധിയായ ഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: δέ ഇവിടെ കഥയുടെ നേരിയ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ participle-നെ ‘എത്തിയപ്പോൾ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπὶ τοῦ τόπου
  choice: ആ സ്ഥലത്ത്
  rationale: സന്ദർഭത്തിൽ മുമ്പേ അറിയപ്പെടുന്ന സ്ഥലത്തെയാണ് definite article സൂചിപ്പിക്കുന്നത്. ‘ആ സ്ഥലത്ത്’ എത്തിച്ചേരലിന്റെ ലക്ഷ്യസ്ഥാനവും അറിയപ്പെട്ട സ്ഥലവും വ്യക്തമാക്കുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: λέγω എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; നിർദേശത്തിന്റെ ശക്തി അനാവശ്യമായി കൂട്ടുന്നില്ല.
- source_word: Προσεύχεσθε
  choice: പ്രാർഥിക്കൂ
  rationale: വർത്തമാനകാല imperative പ്രാർഥന തുടരേണ്ടതോ പതിവാക്കേണ്ടതോ ആയ സ്വഭാവം വഹിക്കാം. ആ ദൈർഘ്യം അമിതമായി വിശദീകരിക്കാതെ ആധുനികവും മാന്യവുമായ നിർദേശരൂപം ഉപയോഗിച്ചു.
- source_word: μὴ εἰσελθεῖν
  choice: അകപ്പെടാതിരിക്കാൻ
  rationale: വാക്കുതോറുമുള്ള ‘പ്രവേശിക്കാതിരിക്കാൻ’ മലയാളത്തിൽ ഈ ആശയസന്ദർഭത്തിൽ അസ്വാഭാവികമാണ്. ‘അകപ്പെടാതിരിക്കാൻ’ പ്രലോഭനത്തിന്റെ പിടിയിലേക്കു കടക്കാതിരിക്കുക എന്ന ലക്ഷ്യം സ്വാഭാവികമായി അറിയിക്കുന്നു, എങ്കിലും മൂലത്തിലെ ചലനരൂപകത്തിന്റെ മുഴുവൻ ഔപചാരികതയും ആവർത്തിക്കുന്നില്ല.
- source_word: πειρασμόν
  choice: പ്രലോഭനം
  rationale: ശിഷ്യർ നേരിടാനിരിക്കുന്ന ആത്മീയ വീഴ്ചയുടെ സന്ദർഭത്തിൽ ധാർമികമായ temptation എന്ന അർഥം ഏറ്റവും യോജിക്കുന്നു. എന്നാൽ ‘പരീക്ഷണം’ അല്ലെങ്കിൽ ‘ശോധന’ എന്ന വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: πειρασμός എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രലോഭനം
  alternative: പരീക്ഷണം അല്ലെങ്കിൽ ശോധന
  rationale: ഉടൻ വരാനിരിക്കുന്ന ആത്മീയ പരാജയത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പായതിനാൽ ‘പ്രലോഭനം’ സന്ദർഭത്തിന് യോജിക്കുന്നു. എന്നിരുന്നാലും ഗ്രീക്കുപദത്തിന് വിശാലമായ പരീക്ഷണകാലത്തെയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ ആ അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പ്രാർഥിക്കൂ’ സ്വാഭാവികമായ ബഹുവചന അഭിസംബോധനയാണ്; പഴയ ശൈലിയിലുള്ള ‘പ്രാർഥിപ്പിൻ’ ഒഴിവാക്കി.
