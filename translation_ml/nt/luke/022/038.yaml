id: LUK.22.38
reference: Luke 22:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ പറഞ്ഞു: “കർത്താവേ, ഇതാ, ഇവിടെ രണ്ടു വാളുകളുണ്ട്.” അവൻ അവരോടു പറഞ്ഞു: “അതു മതി.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മതി.” രണ്ട് വാളുകൾ മതിയെന്നതിനു പകരം ഈ സംസാരം അവസാനിപ്പിക്കണമെന്നായിരിക്കാം അർഥം.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: അപ്പോൾ അവർ പറഞ്ഞു
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണ്; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനപ്രവാഹം നൽകുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതും പുതിയനിയമത്തിലെ κύριος എന്ന സ്ഥാനനാമത്തിന്റെ പതിവ് അർഥവും നിലനിർത്തുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും മുന്നിലുള്ളത് ചൂണ്ടിക്കാണിക്കുകയും ചെയ്യുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μάχαιραι
  choice: വാളുകൾ
  rationale: μάχαιρα ഒരു വെട്ടായുധത്തെ സൂചിപ്പിക്കുന്നു; ‘കുറുവാൾ’ എന്നതുപോലുള്ള കൂടുതൽ നിർദിഷ്ട പദം മൂലപാഠത്തേക്കാൾ അർഥം ചുരുക്കാം.
- source_word: ὧδε δύο
  choice: ഇവിടെ രണ്ടു
  rationale: സ്ഥലസൂചകമായ ὧδε-യും സംഖ്യയും സ്വാഭാവിക മലയാള പദക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: Ἱκανόν ἐστιν
  choice: അതു മതി
  rationale: ‘മതി’ ἱκανόν എന്നതിന്റെ മതിയായത്/പര്യാപ്തമായത് എന്ന അർഥം നൽകുന്നു; ‘അതു’ എന്ന പ്രയോഗം രണ്ട് വാളുകളെയോ ഇപ്പോഴത്തെ സംഭാഷണത്തെയോ സൂചിപ്പിക്കാവുന്നതിനാൽ മൂലത്തിലെ സന്ദിഗ്ധത നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ἱκανόν ἐστιν എന്ന യേശുവിന്റെ മറുപടിയിലെ വ്യാഖ്യാനസന്ദിഗ്ധത
  choice: അതു മതി
  alternative: മതി; ഈ സംസാരം മതി
  rationale: ഗ്രീക്ക് വാക്യം ‘രണ്ട് വാളുകൾ മതി’ എന്ന നേരിട്ടുള്ള വിലയിരുത്തലായോ ‘ഈ സംസാരം മതി’ എന്ന സംഭാഷണം അവസാനിപ്പിക്കുന്ന പ്രയോഗമായോ മനസ്സിലാക്കാം. പ്രധാനപാഠം ഈ ദ്വയാർഥസാധ്യത പരിഹരിക്കാതെ നിലനിർത്തുകയും അടിക്കുറിപ്പ് മറ്റൊരു സാധ്യത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘ഇതാ’ തിരുവെഴുത്തുഭാഷയിൽ പരിചിതമാണെങ്കിലും പഴഞ്ചനല്ല; ‘അതു മതി’ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും വ്യാഖ്യാനസന്ദിഗ്ധതയും നിലനിർത്തുന്നു.
