id: LUK.22.20
reference: Luke 22:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: ml
  text: 'അത്താഴം കഴിച്ചശേഷം, അതുപോലെ പാനപാത്രമെടുത്ത് അദ്ദേഹം പറഞ്ഞു: “ഈ പാനപാത്രം, നിങ്ങൾക്കുവേണ്ടി ചൊരിയപ്പെടുന്ന എന്റെ രക്തത്തിലുള്ള പുതിയ ഉടമ്പടിയാണ്[a][b].”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉടമ്പടി” എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദം ചിലപ്പോൾ “നിയമപത്രം” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ രക്തത്താൽ സ്ഥാപിക്കപ്പെടുന്ന ഉടമ്പടിയാണ് സന്ദർഭം.
    reason: lexical_alternative
  - marker: b
    text: “നിങ്ങൾക്കുവേണ്ടി ചൊരിയപ്പെടുന്ന” എന്ന വാക്കുകൾ ഗ്രീക്കിൽ വാക്യത്തിന്റെ അവസാനം വരുന്നു. വ്യാകരണരൂപത്തിൽ അവയെ “പാനപാത്രം” എന്നതിനോടോ “രക്തം” എന്നതിനോടോ ബന്ധപ്പെടുത്തി വായിക്കാം; സന്ദർഭത്തിൽ യേശുവിന്റെ രക്തം ചൊരിയപ്പെടുന്നു എന്നതാണ് ഏറ്റവും സ്വാഭാവികമായ അർഥം.
    reason: syntactic_ambiguity
  - marker: c
    text: ചില പുരാതന കൈയെഴുത്തുപ്രതികളിൽ ഈ വാക്യം ഉൾപ്പെടുന്ന ഭാഗം കാണുന്നില്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ποτήριον
  choice: പാനപാത്രം
  rationale: സാധാരണ കുടിപ്പാത്രത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദം; ആരാധനാക്രമവുമായി പ്രത്യേകമായി ബന്ധപ്പെട്ട പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ὡσαύτως
  choice: അതുപോലെ
  rationale: മുൻവാക്യത്തിലെ അപ്പവുമായി ബന്ധപ്പെട്ട പ്രവൃത്തിയോടുള്ള ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: അത്താഴം കഴിച്ചശേഷം
  rationale: ഭക്ഷണം കഴിഞ്ഞുള്ള സമയക്രമം വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: λέγων
  choice: അദ്ദേഹം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കൃദന്തരൂപത്തിന്റെ ആശയബന്ധം മലയാളത്തിൽ സുഗമമായ സമാപികാക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: καινὴ διαθήκη
  choice: പുതിയ ഉടമ്പടി
  rationale: പഴയനിയമത്തിലെ ഉടമ്പടിയും രക്തവും സംബന്ധിച്ച പശ്ചാത്തലം നിലനിർത്തുന്നു; ‘നിയമപത്രം’ പോലുള്ള അന്ത്യപത്രസംബന്ധമായ അർഥം വരുത്തുന്നില്ല.
- source_word: ἐν τῷ αἵματί μου
  choice: എന്റെ രക്തത്തിലുള്ള
  rationale: ἐν എന്ന പൂർവപ്രയോഗത്തിന്റെ തുറന്ന അർഥപരിധി നിലനിർത്തി, ‘എന്റെ രക്തത്താൽ’ എന്ന് കാരണോപാധിയായി നിർണയിച്ചുപറയുന്നത് ഒഴിവാക്കുന്നു.
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: നിങ്ങൾക്കുവേണ്ടി ചൊരിയപ്പെടുന്ന
  rationale: ὑπέρ എന്നതിന്റെ അനുകൂല/പ്രതിനിധാനപരമായ ശക്തി അമിതമായി സിദ്ധാന്തവത്കരിക്കാതെ നൽകുന്നു; സന്ദർഭത്തിൽ ചൊരിയപ്പെടുന്നത് രക്തമാണെന്ന സ്വാഭാവിക ബോധം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: διαθήκη എന്ന പദത്തിന്റെ ഉടമ്പടിസന്ദർഭത്തിലുള്ള പരിഭാഷ
  choice: പുതിയ ഉടമ്പടി
  alternative: പുതിയ നിയമപത്രം / പുതിയ നിയമം
  rationale: രക്തത്താൽ സ്ഥാപിക്കപ്പെടുന്ന ഉടമ്പടിയെക്കുറിച്ചുള്ള തിരുവെഴുത്തുപശ്ചാത്തലമാണ് ഇവിടെ പ്രധാനം. ‘പുതിയ നിയമം’ മലയാളത്തിൽ ഗ്രന്ഥവിഭാഗമായ New Testament എന്ന അർഥവും ഉണർത്താം; അതിനാൽ ‘ഉടമ്പടി’ കൂടുതൽ കൃത്യമാണ്.
- issue: ἐκχυννόμενον എന്ന കൃദന്തത്തിന്റെ സൂചന
  choice: അർഥത്തിൽ ‘എന്റെ രക്തം’ എന്നതിനോടു ബന്ധപ്പെടുത്തി
  alternative: വ്യാകരണപരമായി മുഴുവൻ മുൻവാക്യത്തോടോ ‘പാനപാത്രം’ എന്നതിനോടോ നേരിട്ട് ബന്ധിപ്പിച്ച് വായിക്കുക
  rationale: ποτήριον, αἷμα എന്നിവ രണ്ടും ഗ്രീക്കിൽ നപുംസകലിംഗമായതിനാൽ രൂപപരമായ ബന്ധത്തിൽ യഥാർത്ഥ അവ്യക്തതയുണ്ട്. എന്നാൽ രക്തം ചൊരിയപ്പെടുന്നു എന്നതാണ് സന്ദർഭത്തിലെ സ്വാഭാവിക ആശയം; അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: അവസാന അത്താഴത്തിലെ പാനപാത്രവചനത്തിന്റെ കൈയെഴുത്തുപ്രതി വ്യത്യാസം
  choice: SBLGNT മുഖ്യപാഠം പരിഭാഷപ്പെടുത്തി
  alternative: വാക്യത്തിന്റെ മുഴുവൻ ഭാഗമോ അതിന്റെ വിപുലമായ സന്ദർഭമോ ഇല്ലാത്ത ചില പുരാതന സാക്ഷ്യങ്ങൾ
  rationale: നൽകിയ ഗ്രീക്ക് പാഠത്തിലെ വിമർശനചിഹ്നങ്ങൾ പാഠവ്യത്യാസം സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠം പിന്തുടരുകയും വ്യത്യാസം വായനക്കാരനെ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. മുൻവാക്യത്തിൽ നിന്നു സൂചിതമായ പ്രവൃത്തി മലയാളത്തിൽ പൂർണ്ണമാക്കാൻ ‘എടുത്ത്’ ചേർത്തിരിക്കുന്നു. സഭാചാരവിശേഷമുള്ള ‘കാസ’ പോലുള്ള പദങ്ങൾ ഒഴിവാക്കി ‘പാനപാത്രം’ ഉപയോഗിച്ചു.
