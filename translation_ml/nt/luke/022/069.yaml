  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: ml
  text: എന്നാൽ ഇനിമുതൽ മനുഷ്യപുത്രൻ ദൈവത്തിന്റെ ശക്തിയുടെ വലതുഭാഗത്ത് ഇരിക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവശക്തിയുടെ വലതുഭാഗത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: ഇനിമുതൽ
  rationale: പ്രസ്താവിക്കുന്ന അവസ്ഥ ആരംഭിക്കുന്ന സമയബിന്ദുവും അതിന്റെ തുടർച്ചയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: സന്ദർഭത്തിൽ യേശുവിന്റെ മറുപടിയിലെ വൈരുധ്യപരമായ വഴിത്തിരിവ് നിലനിർത്തുന്നു.
- source_word: ἔσται ... καθήμενος
  choice: ഇരിക്കും
  rationale: ഭാവികാലത്തിലുള്ള ഈ പര്യായക്രിയാരൂപം ഇരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ഇരിക്കും’ ഭാവികാലവും സിംഹാസനാസീനതയുടെ ആശയവും ലളിതമായി നൽകുന്നു; ‘ഉപവിഷ്ടനായിരിക്കും’ എന്നത് സാധാരണ വായനക്കാർക്ക് അനാവശ്യമായി സംസ്കൃതനിഷ്ഠമാണ്.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ദാനീയേൽ ഗ്രന്ഥത്തോടും അന്ത്യകാല ദർശനഭാഷയോടുമുള്ള ബന്ധം ഉൾപ്പെടെ, യേശുവിന്റെ സ്ഥാപിതമായ സ്വയംവിശേഷണം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐκ δεξιῶν
  choice: വലതുഭാഗത്ത്
  rationale: പരമമായ ബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῆς δυνάμεως τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ശക്തിയുടെ
  rationale: ‘ശക്തി’ എന്ന സാധാരണ നാമവും അതു ദൈവത്തിന്റേതാണെന്ന ഗ്രീക്ക് ജനിറ്റീവ് ബന്ധവും അതേപടി സൂക്ഷിക്കുന്നു; അതിനെ വ്യാഖ്യാനാത്മകമായി ‘സർവശക്തൻ’ എന്നു മാറ്റുന്നില്ല.
theological_decisions:
- issue: മനുഷ്യപുത്രന്റെ ഉന്നതീകരണവും ദൈവിക അധികാരത്തിലുള്ള സ്ഥാനവും
  choice: മനുഷ്യപുത്രൻ ദൈവത്തിന്റെ ശക്തിയുടെ വലതുഭാഗത്ത് ഇരിക്കും
  alternative: മനുഷ്യപുത്രൻ ശക്തിയുടെ വലതുഭാഗത്ത് ഇരിക്കും
  rationale: പ്രധാനപാഠം സങ്കീർത്തനം 110-ലെയും ദാനീയേൽ 7-ലെയും രാജകീയവും അന്ത്യകാലപരവുമായ പ്രതിധ്വനി നിലനിർത്തുന്നു; അതേസമയം ഗ്രീക്കിലുള്ള ‘ദൈവത്തിന്റെ’ എന്ന നിർദേശം ഒഴിവാക്കുന്നില്ല. ‘ശക്തി’ ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്ന പ്രയോഗമായി വായിക്കാവുന്നതാണെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഉപവിഷ്ടനായിരിക്കും’ പോലുള്ള അതിസംസ്കൃതനിഷ്ഠ രൂപങ്ങൾ ഒഴിവാക്കി, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘ഇരിക്കും’ ഉപയോഗിച്ചു. ‘മനുഷ്യപുത്രൻ’ എന്ന ബൈബിൾ പദവിയും ‘വലതുഭാഗം’ എന്ന അധികാരസ്ഥാനപ്രയോഗവും വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി.
