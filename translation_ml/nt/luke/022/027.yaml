reference: Luke 22:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: ml
  text: കാരണം, വലിയവൻ ആരാണ്—ഭക്ഷണമേശയിൽ ചാരിക്കിടക്കുന്നവനോ സേവിക്കുന്നവനോ? ഭക്ഷണമേശയിൽ ചാരിക്കിടക്കുന്നവനല്ലേ? എന്നാൽ സേവിക്കുന്നവനെപ്പോലെ ഞാൻ നിങ്ങളുടെ ഇടയിലുണ്ട്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: എന്തെന്നാൽ… ആരാണ് വലിയവൻ?
  rationale: γὰρ മുൻവാക്യവുമായി വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്തെന്നാൽ’ എന്നു നൽകി. μείζων എന്ന താരതമ്യപദത്തിന്റെ പദവിയെയും പ്രാധാന്യത്തെയും സംബന്ധിച്ച വിശാലത നിലനിർത്താൻ സ്വാഭാവികമായ ‘വലിയവൻ’ ഉപയോഗിച്ചു.
- source_word: ὁ ἀνακείμενος
  choice: വിരുന്നിൽ ചാരിയിരിക്കുന്നവൻ
  rationale: പുരാതന വിരുന്നുകളിൽ ഭക്ഷണം കഴിക്കുന്നവർ ചാരിക്കിടന്നിരുന്ന പതിവിനെ ἀνάκειμαι സൂചിപ്പിക്കുന്നു. വെറും ‘ഇരിക്കുന്നവൻ’ എന്നതിനെക്കാൾ മൂലഭാഷയിലെ ദൃശ്യഭാവം ഇതിൽ നിലനിൽക്കുന്നു; ‘വിരുന്നിൽ’ എന്നത് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: ὁ διακονῶν
  choice: പരിചരിക്കുന്നവൻ
  rationale: വിരുന്നിൽ ഭക്ഷണം കഴിക്കുന്നയാളോടു വിപരീതമായി സേവനം ചെയ്യുന്നയാളെ വർത്തമാനകാല കൃവിശേഷണരൂപം സൂചിപ്പിക്കുന്നു. ‘പരിചരിക്കുന്നവൻ’ പ്രവർത്തനത്തെ മുൻനിർത്തുകയും ‘ദാസൻ’ എന്ന പദത്തിലെ ബന്ധിതപദവിയുടെ അധിക അർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: οὐχὶ ὁ ἀνακείμενος;
  choice: വിരുന്നിൽ ചാരിയിരിക്കുന്നവനല്ലേ?
  rationale: οὐχί അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമായതിനാൽ മലയാളത്തിലെ ‘അല്ലേ?’ അതിന്റെ ബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐγὼ δὲ ἐν μέσῳ ὑμῶν εἰμι
  choice: എന്നാൽ ഞാൻ നിങ്ങളുടെ ഇടയിൽ
  rationale: δέ സാമൂഹിക പ്രതീക്ഷയും യേശുവിന്റെ മാതൃകയും തമ്മിലുള്ള വൈരുധ്യം അടയാളപ്പെടുത്തുന്നതിനാൽ ‘എന്നാൽ’ ഉപയോഗിച്ചു. ἐν μέσῳ ὑμῶν എന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ തുല്യരൂപമാണ് ‘നിങ്ങളുടെ ഇടയിൽ’.
- source_word: ὡς ὁ διακονῶν
  choice: പരിചരിക്കുന്നവനെപ്പോലെയാണ്
  rationale: ὡς രീതിയെയോ താരതമ്യത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പോലെയാണ്’ ആ താരതമ്യം തുറന്നുവയ്ക്കുന്നു; ‘പരിചരിക്കുന്നവൻ’ എന്ന ക്രിയാത്മക ആശയം ആവർത്തിക്കുന്നതിലൂടെ മൂലത്തിലെ ബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സ്വയംവിവരണത്തിലെ സേവനഭാഷ
  choice: എന്നാൽ ഞാൻ നിങ്ങളുടെ ഇടയിൽ പരിചരിക്കുന്നവനെപ്പോലെയാണ്.
  alternative: എന്നാൽ ഞാൻ നിങ്ങളുടെ ഇടയിൽ ഒരു ദാസനെപ്പോലെയാണ്.
  rationale: ഗ്രീക്കിൽ δοῦλος എന്ന ‘ദാസൻ’ നാമമല്ല, διακονῶν എന്ന ‘പരിചരിക്കുന്ന’ കൃവിശേഷണമാണ്. അതിനാൽ സേവനപ്രവർത്തനത്തെ പ്രകടിപ്പിക്കുന്ന പരിഭാഷയാണ് വിരുന്നുസന്ദർഭവും യേശുവിന്റെ താഴ്മയും കൃത്യമായി നിലനിർത്തുന്നത്; ബന്ധിതദാസ്യത്തിന്റെ കൂടുതൽ ശക്തമായ ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വിരുന്നിന്റെ സാംസ്കാരിക പശ്ചാത്തലം പ്രധാനവാക്യത്തിൽ സംക്ഷിപ്തമായി വ്യക്തമാക്കിയപ്പോൾ കൂടുതൽ പദാനുപദരൂപവും ആചാരവിശദീകരണവും അടിക്കുറിപ്പിൽ നൽകി. ‘ശുശ്രൂഷിക്കുക’ എന്ന സഭാപരമായ ധ്വനി ഉണ്ടാകാവുന്ന പദവും ‘ദാസൻ’ എന്ന അധിക പദവിയർഥമുള്ള നാമവും ഒഴിവാക്കി.
