revisions:
- from: എന്തെന്നാൽ, വിരുന്നിൽ ചാരിയിരിക്കുന്നവനോ[a] പരിചരിക്കുന്നവനോ—ആരാണ് വലിയവൻ? വിരുന്നിൽ ചാരിയിരിക്കുന്നവനല്ലേ? എന്നാൽ ഞാൻ നിങ്ങളുടെ ഇടയിൽ പരിചരിക്കുന്നവനെപ്പോലെയാണ്.
