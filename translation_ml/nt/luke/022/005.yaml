lexical_decisions:
- source_word: ἐχάρησαν
  choice: സന്തോഷിച്ചു
  rationale: χαίρω എന്ന ക്രിയയുടെ ഇവിടെ കാണുന്ന ഭൂതകാലരൂപം അവരുടെ സന്തോഷകരമായ പ്രതികരണം വ്യക്തമാക്കുന്നു. ‘സന്തോഷിച്ചു’ ആ ശക്തി സ്വാഭാവികവും മാന്യവുമായി പകരുന്നു.
- source_word: συνέθεντο
  choice: സമ്മതിച്ചു
  rationale: സന്ദർഭത്തിൽ συντίθεμαι ഒരു ധാരണയിലെത്തുക അഥവാ സമ്മതിക്കുക എന്നർഥം നൽകുന്നു. ‘സമ്മതിച്ചു’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്; ‘വാഗ്ദാനം ചെയ്തു’ എന്നത് സാധ്യമെങ്കിലും കൂടുതൽ വ്യാഖ്യാനപരമാണ്.
- source_word: αὐτῷ
  choice: അവന്
  rationale: ദത്തിവ് സർവനാമം δοῦναι എന്ന ക്രിയയുടെ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവന് ... കൊടുക്കുക’ സ്വാഭാവികമായി അതേ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἀργύριον
  choice: പണം
  rationale: ἀργύριον അക്ഷരാർഥത്തിൽ വെള്ളിയെ സൂചിപ്പിക്കാമെങ്കിലും ഇടപാടിന്റെ ഈ സന്ദർഭത്തിൽ പൊതുവായി പണം എന്നാണ് അർഥം. ആധുനിക വായനക്കാർക്ക് ‘പണം’ അർഥം വ്യക്തമായി നൽകുന്നു; ‘വെള്ളി’ എന്ന അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δοῦναι
  choice: കൊടുക്കാമെന്ന്
  rationale: ഈ അനന്തക്രിയാരൂപം അവർ സമ്മതിച്ചതിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ ഉദ്ധരണാത്മക ഘടനയിൽ ‘കൊടുക്കാമെന്ന്’ സ്വാഭാവികമാണ്; ‘നൽകാമെന്ന്’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് ലളിതവുമാണ്. ‘പ്രതിഫലം നൽകുക’ എന്ന ആശയം മൂലത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
