language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഞാൻ നിങ്ങളോടു പറയുന്നു: ദൈവരാജ്യത്തിൽ അത് നിവൃത്തിയാകുന്നതുവരെ ഞാൻ അത് തീർച്ചയായും ഭക്ഷിക്കുകയില്ല[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവരാജ്യത്തിൽ അത് നിവൃത്തിയാകുന്നതുവരെ ഞാൻ ഇനി ഒരിക്കലും അത് ഭക്ഷിക്കുകയില്ല.” ഭാവിയിൽ അത് ഭക്ഷിക്കുന്നതിനെ ഗ്രീക്ക് ശക്തമായി നിഷേധിക്കുന്നു. സന്ദർഭത്തിൽ സൂചിതമായ “വീണ്ടും” ചില വിവർത്തനങ്ങൾ വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ആ പദം ഗ്രീക്ക് വാചകത്തിൽ ഇല്ല.
    reason: lexical_alternative
  - marker: b
    text: “അത്” എന്നത് മുൻവാക്യത്തിൽ പറഞ്ഞ പെസഹയെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: എന്തെന്നാൽ, ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്തെന്നാൽ’ എന്നു നൽകി; λέγω ὑμῖν എന്ന പ്രയോഗം സ്വാഭാവികമായി ‘ഞാൻ നിങ്ങളോടു പറയുന്നു’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: ὅτι
  choice: ഉദ്ധരണിക്ക് ശേഷമുള്ള ആശയഘടന
  rationale: ഗ്രീക്കിൽ പ്രസ്താവനയുടെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ὅτι മലയാളത്തിൽ നേരിട്ടുള്ള പ്രസ്താവനയായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പ്രത്യേകമായി ‘എന്ന്’ ചേർക്കുന്നത് ഇവിടെ ഭാരമുള്ള ഘടനയാകും.
- source_word: οὐ μὴ φάγω
  choice: ഞാൻ തീർച്ചയായും ഭക്ഷിക്കുകയില്ല
  rationale: οὐ μή + aorist subjunctive ഭാവിയെക്കുറിച്ചുള്ള ഊന്നിയ നിഷേധമാണ്. ‘തീർച്ചയായും ... ഇല്ല’ അതിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: αὐτό
  choice: അത്
  rationale: സർവനാമത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ പെസഹയാണ് അതിന്റെ സന്ദർഭപരമായ സൂചിതവസ്തു. മുഖ്യവാചകത്തിൽ ‘പെസഹാഭക്ഷണം’ എന്നു വികസിപ്പിച്ചിട്ടില്ല.
- source_word: ἕως ὅτου
  choice: വരെ
  rationale: കാലപരിധി സൂചിപ്പിക്കുന്ന ഈ സംയുക്തപ്രയോഗത്തിന് മലയാളത്തിലെ സ്വാഭാവിക തുല്യം ‘വരെ’ ആണ്.
- source_word: πληρωθῇ
  choice: നിവൃത്തിയാകുന്നതു
  rationale: passive രൂപത്തിലെ പൂർത്തീകരണം/നിവൃത്തി എന്ന ആശയം സംരക്ഷിക്കുകയും രക്ഷാചരിത്രപരമായ ധ്വനി അനാവശ്യമായി വിശദീകരിക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിൽ
  rationale: βασιλείαയുടെ രാജത്വവും രാജ്യവും ഉൾക്കൊള്ളുന്ന പരിചിതമായ ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു; τοῦ θεοῦ ‘ദൈവ-’ എന്ന സ്വാഭാവിക മലയാളസമാസമായി നൽകി.
theological_decisions:
- issue: αὐτό (‘അത്’) എന്നതിന്റെ സൂചിതവസ്തു
  choice: മുഖ്യവാചകത്തിൽ ‘അത്’ നിലനിർത്തി; അടിക്കുറിപ്പിൽ മുൻവാക്യത്തിലെ പെസഹയിലേക്കുള്ള സൂചന വ്യക്തമാക്കി.
  alternative: മുഖ്യവാചകത്തിൽ ‘ഈ പെസഹാഭക്ഷണം’ എന്നു വ്യക്തമാക്കുക.
  rationale: അടുത്ത സന്ദർഭം പെസഹയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് ഇവിടെ സർവനാമം മാത്രമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ അമിതവ്യക്തീകരണം ഒഴിവാക്കി മൂലവാചകത്തിന്റെ സംക്ഷിപ്തത സംരക്ഷിച്ചു.
- issue: ‘ദൈവരാജ്യത്തിൽ നിവൃത്തിയാകുക’ എന്നതിന്റെ അർഥം
  choice: നിവൃത്തി എങ്ങനെ സംഭവിക്കുന്നു എന്ന് നിർവചിക്കാതെ മൂലവാചകത്തിന്റെ അന്ത്യകാലപരമായ ഭാഷ നിലനിർത്തി.
  alternative: ദൈവരാജ്യത്തിന്റെ വരവിലൂടെ നിവൃത്തിയാകുക; അല്ലെങ്കിൽ മശീഹായുടെ വിരുന്നിൽ നിവൃത്തിയാകുക.
  rationale: ഗ്രീക്ക് വാചകം നിവൃത്തിയുടെ കൃത്യമായ വിധമോ സംഭവമോ വിശദീകരിക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- issue: ഭാവിയിലെ ഭക്ഷണത്തെക്കുറിച്ചുള്ള ഊന്നിയ നിഷേധത്തിൽ ‘വീണ്ടും’ ഉൾപ്പെടുത്തണമോ
  choice: മുഖ്യവാചകത്തിൽ ‘വീണ്ടും’ ചേർത്തിട്ടില്ല; സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
  alternative: ‘ഇനി വീണ്ടും ഞാൻ അത് ഭക്ഷിക്കുകയില്ല’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: സന്ദർഭം ‘വീണ്ടും’ എന്ന ആശയം സൂചിപ്പിക്കാമെങ്കിലും അത് ഗ്രീക്കിൽ പ്രസ്താവിച്ചിട്ടില്ല. οὐ μήയുടെ ഊന്നൽ ‘തീർച്ചയായും ... ഇല്ല’ എന്നതിലൂടെ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഭക്ഷിക്കുകയില്ല’, ‘നിവൃത്തിയാകുക’, ‘ദൈവരാജ്യം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചു.
