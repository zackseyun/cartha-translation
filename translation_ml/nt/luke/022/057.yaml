source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἠρνήσατο λέγων· ⸂Οὐκ οἶδα αὐτόν, γύναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അത്[a] നിഷേധിച്ചുകൊണ്ട് പറഞ്ഞു: “സ്ത്രീയേ,[b] എനിക്ക് അവനെ അറിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “എന്നാൽ അവൻ നിഷേധിച്ചുകൊണ്ട് പറഞ്ഞു …” ഗ്രീക്കിൽ ‘നിഷേധിച്ചു’ എന്ന ക്രിയയുടെ കർമം വ്യക്തമാക്കിയിട്ടില്ല; സ്വാഭാവികമായ മലയാളത്തിനായി ‘അത്’ ചേർത്തിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “സ്ത്രീയേ” എന്നത് γύναι എന്ന സംബോധനരൂപത്തിന്റെ വിവർത്തനമാണ്. സംസാരിച്ച സ്ത്രീയെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതാണിത്; “അമ്മേ” തുടങ്ങിയ പദങ്ങൾ മൂലത്തിൽ വ്യക്തമാക്കാത്ത ബന്ധമോ ആദരഭാവമോ ചേർക്കും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσατο
  choice: അത് നിഷേധിച്ചുകൊണ്ട്
  rationale: ἀρνέομαι ഇവിടെ ഉന്നയിക്കപ്പെട്ട ആരോപണമോ അവകാശവാദമോ നിഷേധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സ്വാഭാവികമായ മലയാളത്തിനായി ‘അത്’ ചേർത്തിരിക്കുന്നു; ‘അവനെ തള്ളിപ്പറഞ്ഞു’ എന്നു വിവർത്തനം ചെയ്താൽ കർമത്തെ അനാവശ്യമായി യേശുവായി നിശ്ചയിക്കുകയും അർഥം ശക്തമാക്കുകയും ചെയ്യും.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: വർത്തമാന കൃദന്തം നിഷേധത്തിന്റെ വാക്കുകൾ അവതരിപ്പിക്കുന്നു. ‘നിഷേധിച്ചുകൊണ്ട് പറഞ്ഞു’ എന്ന ഘടന ഗ്രീക്കിലെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Οὐκ οἶδα
  choice: എനിക്ക് … അറിയില്ല
  rationale: അറിയുക എന്ന ക്രിയയുടെ നേരിട്ടുള്ള നിഷേധമാണ്. മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘എനിക്ക് അറിയില്ല’ എന്നാണ്.
- source_word: αὐτόν
  choice: അവനെ
  rationale: സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നതിനാൽ അതിനെ ലളിതമായി ‘അവനെ’ എന്നു വിവർത്തനം ചെയ്യുന്നു; ‘ഈ മനുഷ്യനെ’ എന്ന വിപുലീകരണം ഗ്രീക്കിൽ ഇല്ല.
- source_word: γύναι
  choice: സ്ത്രീയേ
  rationale: γύναι സ്ത്രീയെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന സംബോധനരൂപമാണ്. ‘സ്ത്രീയേ’ മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘അമ്മേ’ പോലുള്ള രൂപങ്ങൾ ബന്ധമോ ആദരഭാവമോ അധികമായി ചേർക്കും.
theological_decisions:
- issue: പത്രൊസിന്റെ നിഷേധത്തിന് വ്യക്തമായ കർമം ചേർക്കണമോ എന്നത്
  choice: സന്ദർഭത്തിൽ ഉന്നയിച്ച വാദത്തെ സൂചിപ്പിക്കാൻ ‘അത്’ ചേർത്തു.
  alternative: ‘എന്നാൽ അവൻ നിഷേധിച്ചുകൊണ്ട് പറഞ്ഞു’ എന്നിങ്ങനെ കർമമില്ലാതെ നൽകുക; അല്ലെങ്കിൽ ‘അവനെ തള്ളിപ്പറഞ്ഞുകൊണ്ട്’ എന്നു നൽകുക.
  rationale: ഗ്രീക്കിലെ ἠρνήσατο എന്നതിന് വ്യക്തമായ കർമമില്ല. കർമമില്ലാത്ത മലയാളം ഇവിടെ അസ്വാഭാവികമാകാം. ‘അത്’ ആരോപണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അവനെ’ എന്നു നൽകിയാൽ പത്രൊസ് ഈ സംഭാഷണത്തിൽ യേശുവിനെ നേരിട്ട് തള്ളിപ്പറഞ്ഞുവെന്ന വ്യാഖ്യാനം വാചകത്തിൽ അനാവശ്യമായി ഉറപ്പിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിഷേധിച്ചുകൊണ്ട് പറഞ്ഞു’ എന്ന ഘടന മൂലത്തിലെ പ്രധാനക്രിയയും കൃദന്തരൂപവും തമ്മിലുള്ള ബന്ധം സൂക്ഷിക്കുന്നു. നേരിട്ടുള്ള സംബോധനമായ ‘സ്ത്രീയേ’ അല്പം കടുപ്പമായി കേൾക്കാമെങ്കിലും മൂലത്തിലെ ഭാവം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
