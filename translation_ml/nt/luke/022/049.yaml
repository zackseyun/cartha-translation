  terminology: ‘കർത്താവേ’ appropriately renders Κύριε in direct address. ‘വാൾകൊണ്ട്’ is an idiomatic rendering of ἐν μαχαίρῃ. The footnote responsibly preserves the possible shorter-blade sense without forcing it into the verse.
