id: LUK.22.49
reference: Luke 22:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: ml
  text: 'അപ്പോൾ, അവന്റെ ചുറ്റുമുണ്ടായിരുന്നവർ സംഭവിക്കാൻ പോകുന്നതു കണ്ടിട്ട് അവനോടു ചോദിച്ചു: “കർത്താവേ, ഞങ്ങൾ വാൾകൊണ്ട് വെട്ടട്ടെയോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു വാൾകൊണ്ട്.” ഗ്രീക്ക് പദമായ μάχαιρα വാളിനെയോ നീളം കുറഞ്ഞ വാൾ/കഠാരയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: കണ്ടിട്ട്
  rationale: ὁράω എന്ന ക്രിയയുടെ aorist participle മുഖ്യക്രിയയോടുള്ള മുൻകാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οἱ περὶ αὐτὸν
  choice: അവന്റെ ചുറ്റുമുണ്ടായിരുന്നവർ
  rationale: യേശുവിനെ ചുറ്റിനിന്നവരെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം അതിൽ ഇല്ലാത്ത ‘ശിഷ്യന്മാർ’ എന്ന നിർവചനം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὸ ἐσόμενον
  choice: സംഭവിക്കാൻ പോകുന്നത്
  rationale: ഭാവിയിൽ ഉടൻ സംഭവിക്കാനിരിക്കുന്ന കാര്യത്തെ സൂചിപ്പിക്കുന്ന articular future participle-ന്റെ imminence സ്വാഭാവികമായി പകരുന്നു.
- source_word: εἶπαν
  choice: ചോദിച്ചു
  rationale: മൂലക്രിയയുടെ അടിസ്ഥാന അർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും പിന്നാലെയുള്ള നേരിട്ടുള്ള വാക്കുകൾ വ്യക്തമായ ചോദ്യമായതിനാൽ ആ സംഭാഷണപ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള നേരിട്ടുള്ള സംബോധനയിൽ κύριος എന്ന പദത്തിന്റെ ആദരവും ശീർഷകപരമായ ദൈവശാസ്ത്രഭാരവും നിലനിർത്തുന്നു.
- source_word: εἰ πατάξομεν
  choice: ഞങ്ങൾ ... വെട്ടട്ടെയോ?
  rationale: εἰ സഹിതമുള്ള future indicative ഇവിടെ ആലോചനാപരമായ ചോദ്യം അവതരിപ്പിക്കുന്നു; ആയുധം ഉപയോഗിച്ചുള്ള പ്രഹരത്തിന് ‘വെട്ടുക’ സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: ἐν μαχαίρῃ
  choice: വാൾകൊണ്ട്
  rationale: ἐν ഇവിടെ ഉപകരണാർഥത്തിലാണ്; μάχαιρα വാളിനെയോ ചെറിയ വാൾ/കഠാരയെയോ സൂചിപ്പിക്കാം.
theological_decisions:
- issue: യേശുവിനോടുള്ള സംബോധനയിലെ κύριος
  choice: കർത്താവ്
  alternative: ഗുരു / യജമാനൻ
  rationale: ‘കർത്താവ്’ എന്നത് ആദരസൂചക സംബോധനയും ശീർഷകത്തിന്റെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; വെറും സാമൂഹിക ബഹുമാനപദമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘വെട്ടട്ടെയോ?’ എന്നത് deliberative question-ന്റെ അടിയന്തരതയും ആയുധസന്ദർഭവും വ്യക്തമാക്കുന്നു; മൂലത്തിലെ വ്യക്തമായി പറയാത്ത കർത്തൃപരിചയം കൂടുതൽ നിർവചിച്ചിട്ടില്ല.
