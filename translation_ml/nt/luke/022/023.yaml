- from: തുടർന്ന്, അവരിൽ ആരായിരിക്കും ഇതു ചെയ്യാൻ പോകുന്നതെന്ന് അവർ തമ്മിൽ ചർച്ചചെയ്യാൻ തുടങ്ങി.[a]
  to: അവരിൽ ഇതു ചെയ്യാൻ പോകുന്നവൻ ആരായിരിക്കുമെന്ന് അവർ തമ്മിൽ ചർച്ച ചെയ്യാൻ തുടങ്ങി.[a]
  rationale: The revision removes the additional sense conveyed by “തുടർന്ന്,” uses standard spacing in “ചർച്ച ചെയ്യാൻ,” and gives the Greek article-plus-participle construction a natural Malayalam form. It retains the source text’s indirect “ഇതു ചെയ്യാൻ” in the main text and confines the identification of the act as betrayal to the footnote.
