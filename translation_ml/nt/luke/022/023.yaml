id: LUK.22.23
reference: Luke 22:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἤρξαντο συζητεῖν πρὸς ἑαυτοὺς τὸ τίς ἄρα εἴη ἐξ αὐτῶν ὁ τοῦτο μέλλων πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: ml
  text: അവരിൽ ഇതു ചെയ്യാൻ പോകുന്നവൻ ആരായിരിക്കുമെന്ന് അവർ തമ്മിൽ ചർച്ച ചെയ്യാൻ തുടങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരിൽ ആരാണ് ഇതു ചെയ്യാൻ പോകുന്നതെന്ന്.” ഇവിടെ “ഇതു” എന്നത് മുൻവാക്യത്തിൽ പറഞ്ഞ വഞ്ചനാപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: പരോക്ഷചോദ്യത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു രൂപവും “ഇതു” എന്നതിന്റെ സന്ദർഭപരമായ സൂചനയും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ἤρξαντο
  choice: തുടങ്ങി
  rationale: ἄρχω എന്ന ക്രിയയുടെ ingressive aorist രൂപവും പിന്നാലെയുള്ള infinitive-ഉം പ്രവർത്തനത്തിന്റെ ആരംഭം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തുടങ്ങി’ സ്വാഭാവികമായി ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: συζητεῖν
  choice: ചർച്ചചെയ്യാൻ
  rationale: συζητέω കൂട്ടമായി ചർച്ചചെയ്യുകയോ വാദിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം. ഇവിടെ ശത്രുതാപരമായ വാദം അനാവശ്യമായി സൂചിപ്പിക്കാതെ ‘ചർച്ചചെയ്യാൻ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: πρὸς ἑαυτούς
  choice: അവർ തമ്മിൽ
  rationale: സംഘത്തിനുള്ളിലെ പരസ്പര ആശയവിനിമയം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: അവരിൽ ആരായിരിക്കും
  rationale: അറിയപ്പെടുന്ന സംഘത്തിലെ ഏത് വ്യക്തിയെന്ന പരോക്ഷവും അനിശ്ചിതവുമായ ചോദ്യത്തെ ‘അവരിൽ ആരായിരിക്കും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ἄραയുടെ deliberative ഭാവം പ്രത്യേക പദം ചേർക്കാതെ ചോദ്യരൂപത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: μέλλων πράσσειν
  choice: ചെയ്യാൻ പോകുന്നത്
  rationale: μέλλω + infinitive അടുത്തതായി സംഭവിക്കാനിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ചെയ്യാൻ പോകുന്നത്’ ആ imminent ഭാവം സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഉദ്ദേശ്യം മാത്രം മുൻനിർത്തുന്നില്ല.
- source_word: τοῦτο
  choice: ഇതു
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ പ്രവൃത്തിയിലേക്കാണ് demonstrative വിരൽചൂണ്ടുന്നത്. ഗ്രീക്കിലുള്ള പരോക്ഷത നിലനിർത്താൻ ‘വഞ്ചിക്കുന്നത്’ എന്ന് മുഖ്യപാഠത്തിൽ വികസിപ്പിച്ചിട്ടില്ല.
theological_decisions:
- issue: ‘ഇതു ചെയ്യുക’ എന്നതിനെ വഞ്ചനയായി മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ഗ്രീക്കിലെ പൊതുവായ ‘ഇതു ചെയ്യാൻ’ എന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ‘അവനെ വഞ്ചിക്കാൻ പോകുന്നത്’ എന്ന് വ്യക്തമാക്കുക.
  rationale: മുൻവാക്യത്തിന്റെ സന്ദർഭം വഞ്ചനയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യം τοῦτο μέλλων πράσσειν എന്ന പരോക്ഷപ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ഉറവിടപാഠത്തിന്റെ ഭാവവും പ്രസ്താവനാതലവും മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അവരിൽ ആരായിരിക്കും’ എന്ന രൂപം ഗ്രീക്കിലെ പരോക്ഷചോദ്യവും അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു; ‘അവർ തമ്മിൽ’ reciprocal ആശയം സുതാര്യമാക്കുന്നു.
