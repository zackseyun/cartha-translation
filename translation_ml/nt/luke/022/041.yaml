id: LUK.22.41
reference: Luke 22:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἀπεσπάσθη ἀπ’ αὐτῶν ὡσεὶ λίθου βολήν, καὶ θεὶς τὰ γόνατα προσηύχετο
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: ml
  text: അവൻ അവരിൽനിന്ന് ഏകദേശം ഒരു കല്ലേറുദൂരം മാറിച്ചെന്ന് മുട്ടുകുത്തി പ്രാർഥിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: മാറിച്ചെന്ന്
  rationale: രൂപത്തിൽ കർമണി പ്രയോഗമാണെങ്കിലും സന്ദർഭത്തിൽ ശിഷ്യന്മാരിൽനിന്ന് സ്വയം അകന്നുപോകുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്. ‘മാറിച്ചെന്ന്’ ഉദ്ദേശ്യപൂർവമായ അകലം പാലിക്കലും ചലനവും ലളിതമായി അറിയിക്കുന്നു.
- source_word: ὡσεὶ λίθου βολήν
  choice: ഏകദേശം ഒരു കല്ലേറുദൂരം
  rationale: ὡσεὶ നൽകുന്ന ഏകദേശതയും λίθου βολήν എന്ന അളവുപ്രയോഗവും മലയാളത്തിലെ സ്വാഭാവികമായ ‘കല്ലേറുദൂരം’ എന്ന പദത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: θεὶς τὰ γόνατα
  choice: മുട്ടുകുത്തി
  rationale: അക്ഷരാർഥത്തിൽ ‘മുട്ടുകൾ വെച്ച്’ എന്നാണെങ്കിലും മുട്ടുകുത്തുന്ന ശരീരനിലയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലിയാണിത്. ‘മുട്ടുകുത്തി’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: προσηύχετο
  choice: പ്രാർഥിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘പ്രാർഥിച്ചുകൊണ്ടിരുന്നു’ ആ ദൈർഘ്യഭാവം സംരക്ഷിക്കുന്നു.
- source_word: αὐτὸς
  choice: അവൻ
  rationale: ഗ്രീക്കിൽ നേരിയ ഊന്നൽ ഉണ്ടെങ്കിലും ഇവിടെ ‘അവൻതന്നെ’ എന്നത് മലയാളത്തിൽ അനാവശ്യമായ അധിക ഊന്നൽ സൃഷ്ടിച്ചേക്കാം. കർത്താവിനെ ‘അവൻ’ വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: καὶ
  choice: —
  rationale: മുൻവാക്യത്തോടുള്ള തുടർച്ച ഗ്രീക്കിലെ καὶ സൂചിപ്പിക്കുന്നു. ഒറ്റ വാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ പ്രാരംഭ ‘എന്നിട്ട്/കൂടാതെ’ ചേർക്കാതെതന്നെ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹം ലഭിക്കുന്നു.
theological_decisions:
- issue: പ്രാർഥനയുടെ ശരീരനിലയും ക്രിസ്തുവിനെ അവതരിപ്പിക്കുന്ന രീതിയും
  choice: യേശു ശിഷ്യന്മാരിൽനിന്ന് അകന്ന് മുട്ടുകുത്തി തുടർച്ചയായി പ്രാർഥിക്കുന്നതായി അലങ്കാരമില്ലാതെ വിവർത്തനം ചെയ്തു.
  alternative: ഈ പ്രവൃത്തികൾക്ക് ഭക്തിപരമോ സിദ്ധാന്തപരമോ ആയ വിശദീകരണം വിവർത്തനത്തിൽ ചേർക്കുക.
  rationale: മൂലവാക്യം പ്രവർത്തിയും ശരീരനിലയും മാത്രമാണ് വിവരിക്കുന്നത്. അതിനാൽ അതിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അധിക ക്രിസ്തുശാസ്ത്രപരമോ ഭക്തിപരമോ ആയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കല്ലേറുദൂരം’, ‘മുട്ടുകുത്തി’, ‘പ്രാർഥിച്ചുകൊണ്ടിരുന്നു’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മൂലഭാഷയുടെ അർഥത്തോട് ചേർന്നതുമാണ്.
