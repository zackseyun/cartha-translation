reference: Luke 22:71
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ പറഞ്ഞു[a]: “നമുക്ക് ഇനിയും സാക്ഷ്യമൊഴി ആവശ്യമെന്ത്? അവന്റെ വായിൽനിന്ന് ഞങ്ങൾതന്നെ കേട്ടല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇനിയും സാക്ഷ്യമൊഴിയുടെ എന്താവശ്യമാണ് നമുക്കുള്ളത്?”'
    reason: τί ἔτι ... χρείαν എന്ന ഘടനയുടെ കൂടുതൽ പദാനുസൃതമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: അപ്പോൾ അവർ പറഞ്ഞു
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Τί ἔτι ἔχομεν μαρτυρίας χρείαν
  choice: നമുക്ക് ഇനിയും സാക്ഷ്യമൊഴി ആവശ്യമെന്ത്?
  rationale: τί ἔτι എന്ന പ്രയോഗത്തിന്റെ ആലങ്കാരിക ചോദ്യഭാവവും χρείαν ἔχειν എന്നതിന്റെ ‘ആവശ്യമുണ്ടാകുക’ എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μαρτυρίας
  choice: സാക്ഷ്യമൊഴി
  rationale: ന്യായവിചാരണാസന്ദർഭത്തിൽ μαρτυρία എന്നത് വ്യക്തിയുടെ സാക്ഷ്യപ്രസ്താവനയെ സൂചിപ്പിക്കുന്നു; ‘സാക്ഷ്യമൊഴി’ ആ നിയമപരമായ ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτοὶ γὰρ ἠκούσαμεν
  choice: നാം ... തന്നേ കേട്ടല്ലോ
  rationale: αὐτοί നൽകുന്ന ‘ഞങ്ങൾതന്നെ’ എന്ന ഊന്നൽ ‘നാം’ എന്നതിനോടൊപ്പം ‘തന്നേ’ ഉപയോഗിച്ച് പ്രകടമാക്കുന്നു; γάρ ഇവിടെ മുൻചോദ്യത്തിനുള്ള കാരണം നൽകുന്നു, മലയാളത്തിലെ ‘ല്ലോ’ ആ വിശദീകരണാത്മക ഉറപ്പ് സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: അവന്റെ സ്വന്തം വായിൽനിന്ന്
  rationale: പരോക്ഷവിവരമല്ല, അവൻ നേരിട്ട് പറഞ്ഞത് കേട്ടുവെന്ന ആശയം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ‘സ്വന്തം’ മൂലപാഠത്തിലെ സന്ദർഭപരമായ ഊന്നൽ പകർന്നു നൽകുന്നു.
theological_decisions:
- issue: അവർ കേട്ടതിന്റെ ഉള്ളടക്കം വിവർത്തനത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘നാം കേട്ടല്ലോ’ എന്ന് കർമം ചേർക്കാതെ നിലനിർത്തി
  alternative: ‘അവന്റെ അവകാശവാദം നാം കേട്ടല്ലോ’ അല്ലെങ്കിൽ ‘ആ സാക്ഷ്യം നാം കേട്ടല്ലോ’
  rationale: ἠκούσαμεν എന്ന ക്രിയയ്ക്ക് ഗ്രീക്കിൽ വ്യക്തമായ കർമപദമില്ല. ‘അവകാശവാദം’ അല്ലെങ്കിൽ ‘സാക്ഷ്യം’ ചേർക്കുന്നത് കേട്ടതിന്റെ സ്വഭാവത്തെ വ്യാഖ്യാനിച്ച് ഉറപ്പിക്കുമെന്നതിനാൽ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും അർഥതുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ഭാഷ. ന്യായവിചാരണാസന്ദർഭം കണക്കിലെടുത്ത് ‘സാക്ഷ്യമൊഴി’ തിരഞ്ഞെടുത്തു; വാക്യത്തിന്റെ ആലങ്കാരിക ചോദ്യഭാവവും നേരിട്ട് കേട്ടുവെന്ന ഊന്നലും നിലനിർത്തി.
