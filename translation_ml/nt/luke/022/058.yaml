id: LUK.22.58
reference: Luke 22:58
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: ml
  text: 'കുറച്ചു സമയം കഴിഞ്ഞ്, അവനെ കണ്ട മറ്റൊരുവൻ പറഞ്ഞു: “നീയും അവരിൽ ഒരുവനാണ്.” എന്നാൽ പത്രോസ് പറഞ്ഞു: “മനുഷ്യാ, ഞാനല്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ വ്യക്തമായി പറഞ്ഞാൽ, “ഞാൻ അവരിൽ ഒരുവനല്ല.” ഗ്രീക്കിൽ “ഞാനല്ല” എന്നു മാത്രമാണുള്ളത്; ഒഴിവാക്കിയിരിക്കുന്ന പൂരകം മുൻ ആരോപണത്തിൽനിന്ന് മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: കുറച്ചുസമയം കഴിഞ്ഞപ്പോൾ
  rationale: അല്പമായ ഒരു സമയ ഇടവേളയ്ക്കുശേഷം എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἕτερος
  choice: മറ്റൊരുവൻ
  rationale: പുരുഷലിംഗ ഏകവചനത്തിലുള്ള ‘മറ്റൊരാൾ’ എന്ന സൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἰδὼν αὐτὸν
  choice: അവനെ കണ്ട
  rationale: അയോറിസ്റ്റ് കൃഡന്തത്തിന്റെ പശ്ചാത്തല/അനുബന്ധ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἔφη
  choice: പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ സാധാരണ സംഭാഷണാവതരണത്തിന് യോജിച്ച ലളിതമായ തുല്യപദം.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: നീയും അവരിൽ ഒരുവനാണ്
  rationale: ἐξ αὐτῶν ഇവിടെ ഉത്ഭവത്തെക്കാൾ ആ കൂട്ടത്തിലെ അംഗത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഈ പ്രയോഗം ആരോപണത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: Ἄνθρωπε
  choice: മനുഷ്യാ
  rationale: നേരിട്ടുള്ള സംബോധനവും പത്രോസിന്റെ പെട്ടെന്നുള്ള പ്രതിരോധഭാവവും നിലനിർത്തുന്നു; ‘സാർ’ പോലുള്ള സാമൂഹിക ബഹുമാനസൂചന മൂലപാഠത്തിൽനിന്ന് ചേർക്കുന്നില്ല.
- source_word: οὐκ εἰμί
  choice: ഞാൻ അല്ല
  rationale: മൂലഗ്രീക്കിലെ ചുരുക്കവും മുൻ ആരോപണത്തിൽനിന്ന് പൂരിപ്പിക്കപ്പെടുന്ന അർഥവും അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ നിഷേധത്തിൽ ഒഴിവാക്കിയിരിക്കുന്ന പൂരകം
  choice: പ്രധാനപാഠത്തിൽ ‘ഞാൻ അല്ല’ എന്ന ഗ്രീക്ക് ദീർഘവാക്യലോപം നിലനിർത്തി.
  alternative: ‘ഞാൻ അവരിൽ ഒരുവനല്ല’ എന്ന് വ്യക്തമായി പൂരിപ്പിക്കുക.
  rationale: മൂലപാഠത്തിന്റെ പെട്ടെന്നുള്ള, സംക്ഷിപ്തമായ നിഷേധഭാവവും യഥാർഥമായ വ്യാകരണ അസ്പഷ്ടതയും സംരക്ഷിക്കുന്നു; ഉദ്ദേശിച്ച പൂരകം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘മനുഷ്യാ’ എന്ന സംബോധനം ഇന്നത്തെ സംസാരഭാഷയിൽ അല്പം അസാധാരണമായിരുന്നാലും, മൂലപാഠത്തിലെ നേരിട്ടും abrupt ആയ സ്വരം സംരക്ഷിക്കാൻ നിലനിർത്തി.
