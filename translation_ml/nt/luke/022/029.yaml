  yaml_path: translation/nt/luke/022/029.yaml
  text: And I appoint to you, just as my Father appointed to me, a kingdom.
translation:
  language: ml
  text: എന്റെ പിതാവ് എനിക്കു ഒരു രാജ്യം നിയമിച്ചുതന്നതുപോലെ, ഞാനും നിങ്ങൾക്കു ഒരു രാജ്യം നിയമിച്ചുതരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “എന്റെ പിതാവ് എനിക്കു ഒരു രാജ്യത്തിനായി ഉടമ്പടി ചെയ്തതുപോലെ, ഞാനും നിങ്ങൾക്കായി ഒരു രാജ്യത്തിനായി ഉടമ്പടി ചെയ്യുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് നിയമിച്ചുകൊടുക്കുക അഥവാ നൽകുക എന്ന അർഥത്തിനുപുറമേ, ഉടമ്പടി ചെയ്യുക എന്ന അർഥവും ഉണ്ടാകാം.'
    reason: alternative_reading
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “എന്റെ പിതാവ് എനിക്കു നിയമിച്ചുതന്നതുപോലെ, ഞാനും നിങ്ങൾക്കു ഒരു രാജ്യം നിയമിച്ചുതരുന്നു.”'
    reason: previous_rendering
lexical_decisions:
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: καί + ἐγώ എന്ന സംയുക്തരൂപത്തിലെ തുടർച്ചയും വ്യക്തിപരമായ ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διατίθεμαι
  choice: ഏല്പിച്ചുതരുന്നു
  rationale: ഒരു രാജ്യം മറ്റൊരാൾക്ക് ഔപചാരികമായി നൽകുകയോ ചുമതലപ്പെടുത്തുകയോ ചെയ്യുന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; നിയമബന്ധമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്ക്
  rationale: സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന ദത്തിവിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: καθὼς
  choice: …തുപോലെ
  rationale: യേശുവിന്റെ പ്രവൃത്തിയും പിതാവിന്റെ മുൻപ്രവൃത്തിയും തമ്മിലുള്ള കൃത്യമായ താരതമ്യം വ്യക്തമാക്കുന്നു.
- source_word: διέθετό
  choice: ഏല്പിച്ചുതന്നതുപോലെ
  rationale: രണ്ടു ഗ്രീക്ക് ക്രിയകളുടെയും ഒരേ പദമൂലവും സമാന്തരതയും ഒരേ മലയാളക്രിയ ഉപയോഗിച്ച് സംരക്ഷിക്കുന്നു; ഭൂതകാലപ്രവൃത്തിയും വ്യക്തമാകുന്നു.
- source_word: μοι
  choice: എനിക്ക്
  rationale: സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന ദത്തിവിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ὁ πατήρ μου
  choice: എന്റെ പിതാവ്
  rationale: പുത്രബന്ധം വ്യക്തമായി നിലനിർത്തുന്ന മാനകവും മാന്യവുമായ പ്രയോഗം.
- source_word: βασιλείαν
  choice: ഒരു രാജ്യം
  rationale: അനിർദ്ദിഷ്ടമായ βασιλείαν എന്ന ഏകവചനത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ലഭിക്കുന്ന രാജകീയ ഭരണപരിധിയുടെയും അധികാരത്തിന്റെയും ആശയം തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: διατίθεμαι എന്ന ക്രിയയിൽ നിയമബന്ധത്തിന്റെ അർഥം നേരിട്ട് ഉൾപ്പെടുത്തണമോ
  choice: ഏല്പിച്ചുതരുന്നു
  alternative: നിയമം ചെയ്ത് നൽകുന്നു
  rationale: ക്രിയയ്ക്ക് ക്രമീകരിക്കുക, ഏല്പിക്കുക, നിയമം സ്ഥാപിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. βασιλείαν എന്ന കർമവും പിതാവിന്റെ പ്രവൃത്തിയുമായുള്ള സമാന്തരതയും ഔപചാരികമായ നൽകലിനെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ നിയമബന്ധത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: βασιλείαν ഇരുക്രിയകൾക്കും പങ്കിടുന്ന കർമമായി കാണിക്കണമോ
  choice: പിതാവിന്റെ വാക്യഭാഗത്തിൽ കർമം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നവിധം വിട്ട്, മുഖ്യവാക്യത്തിൽ ‘ഒരു രാജ്യം’ എന്ന് നൽകുന്നു
  alternative: ‘എന്റെ പിതാവ് എനിക്ക് ഒരു രാജ്യം ഏല്പിച്ചുതന്നതുപോലെ, ഞാനും നിങ്ങൾക്ക് ഒന്ന് ഏല്പിച്ചുതരുന്നു’
  rationale: ഗ്രീക്കിലെ അവസാനസ്ഥാനത്തുള്ള ഏക കർമം ഇരുക്രിയകളോടും ബന്ധപ്പെടുന്നു. മലയാളത്തിലെ സ്വാഭാവികത കാത്തുകൊണ്ട് ഈ പങ്കിട്ട കർമത്തിന്റെ ഘടന കഴിയുന്നത്ര നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഏല്പിച്ചുതരുന്നു’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ക്രിയാസമാന്തരത നിലനിർത്തുന്നു; ‘രാജ്യം’ എന്ന പദം ഭരണവും രാജാധികാരവും ഉൾക്കൊള്ളാവുന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
