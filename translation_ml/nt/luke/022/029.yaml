- from: എന്റെ പിതാവ് എനിക്ക് ഏല്പിച്ചുതന്നതുപോലെ, ഞാനും നിങ്ങൾക്ക് ഒരു രാജ്യം ഏല്പിച്ചുതരുന്നു.[a][b]
  to: എന്റെ പിതാവ് എനിക്കു ഒരു രാജ്യം നിയമിച്ചുതന്നതുപോലെ, ഞാനും നിങ്ങൾക്കു ഒരു രാജ്യം നിയമിച്ചുതരുന്നു.[a][b]
  rationale: The revision replaces an entrustment-oriented verb with a formal-assignment verb suitable to the conferral of a kingdom, explicitly repeats the object for clear Malayalam syntax, and corrects the covenantal footnote so that it refers to making a covenant rather than making a law. The footnotes remain anchored at the end of the verse and retain both the covenantal and shared-object alternatives without resolving the semantic ambiguity dogmatically.
