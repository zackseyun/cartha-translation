source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, പണസഞ്ചിയുള്ളവൻ അത് എടുത്തുകൊള്ളട്ടെ; അതുപോലെ യാത്രാസഞ്ചിയും എടുത്തുകൊള്ളട്ടെ. ഇല്ലാത്തവൻ തന്റെ മേലങ്കി വിറ്റ് ഒരു വാൾ വാങ്ങട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ സാഹചര്യത്തോടുള്ള ശക്തമായ വൈരുധ്യവും ഇപ്പോഴത്തെ സമയസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἔχων βαλλάντιον ἀράτω
  choice: പണസഞ്ചിയുള്ളവൻ അത് എടുത്തുകൊള്ളട്ടെ
  rationale: βαλλάντιον പണം സൂക്ഷിക്കുന്ന സഞ്ചിയെ സൂചിപ്പിക്കുന്നു; ἀράτω യാത്രയ്ക്കായി കൂടെ എടുക്കുക എന്ന ആജ്ഞയായി വിവർത്തനം ചെയ്തു.
- source_word: ὁμοίως καὶ πήραν
  choice: അതുപോലെതന്നെ യാത്രാസഞ്ചിയുള്ളവൻ അതും എടുത്തുകൊള്ളട്ടെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ സമാന്തരപ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ക്രിയയും കർത്താവും പൂരിപ്പിച്ചു; πήρα യാത്രക്കാരന്റെ സഞ്ചിയാണ്.
- source_word: ὁ μὴ ἔχων
  choice: വാൾ ഇല്ലാത്തവൻ
  rationale: ഗ്രീക്കിൽ കർമം പ്രസ്താവിച്ചിട്ടില്ലെങ്കിലും തുടർന്ന് വരുന്ന ‘വാൾ വാങ്ങട്ടെ’ എന്ന ആജ്ഞയിൽനിന്ന് വാൾ എന്നാണ് സ്വാഭാവികമായി മനസ്സിലാകുന്നത്.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: തന്റെ മേലങ്കി
  rationale: ἱμάτιον സാധാരണയായി പുറമേ ധരിക്കുന്ന പ്രധാന വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘മേലങ്കി’ ആ അർഥം ചുരുക്കമായും മാന്യമായും നൽകുന്നു.
- source_word: μάχαιραν
  choice: ഒരു വാൾ
  rationale: μάχαιρα വാളിനെയോ താരതമ്യേന നീളം കുറഞ്ഞ വാളിനെയോ വലിയ കത്തിയെയോ സൂചിപ്പിക്കാം; പ്രധാന പാഠത്തിൽ ‘വാൾ’ അനാവശ്യമായ അതിസൂക്ഷ്മത ഒഴിവാക്കുന്ന വിശാലമായ പദമാണ്.
theological_decisions:
- issue: വാൾ വാങ്ങാനുള്ള യേശുവിന്റെ ആജ്ഞ അക്ഷരാർഥത്തിൽ മൃദൂകരിക്കണോ രൂപകമായി വ്യാഖ്യാനിക്കണോ എന്ന ചോദ്യം
  choice: ‘ഒരു വാൾ വാങ്ങട്ടെ’ എന്ന് നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
  alternative: ‘അപകടത്തെ നേരിടാൻ ഒരുങ്ങട്ടെ’ എന്നോ പൊതുവായി ‘ഒരു ആയുധം വാങ്ങട്ടെ’ എന്നോ വ്യാഖ്യാനാത്മകമായി നൽകുക.
  rationale: മൂലപാഠത്തിൽ μάχαιρα എന്ന വ്യക്തമായ പദവും നേരിട്ടുള്ള ആജ്ഞാരൂപങ്ങളും ഉണ്ട്. അക്രമം, സ്വരക്ഷണം, രൂപകാർഥം എന്നിവയെക്കുറിച്ചുള്ള വ്യാഖ്യാനപ്രശ്നം വിവർത്തനത്തിൽ തീർപ്പാക്കാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സമാന്തര ഘടന മലയാളത്തിൽ അപൂർണ്ണമാകാതിരിക്കാൻ രണ്ടാം ഘടകത്തിൽ കർത്താവും ക്രിയയും സ്വാഭാവികമായി പൂരിപ്പിച്ചു. ആജ്ഞയുടെ അക്ഷരാർഥം മൃദൂകരിക്കുകയോ അതിന്റെ ഉദ്ദേശ്യം വ്യാഖ്യാനത്തിലൂടെ നിർണയിക്കുകയോ ചെയ്തിട്ടില്ല.
