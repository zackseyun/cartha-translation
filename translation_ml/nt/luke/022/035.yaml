id: LUK.22.35
reference: Luke 22:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “പണസഞ്ചിയും യാത്രാസഞ്ചിയും[a] ചെരിപ്പും ഇല്ലാതെ ഞാൻ നിങ്ങളെ അയച്ചപ്പോൾ, നിങ്ങൾക്ക് എന്തെങ്കിലും കുറവുണ്ടായിരുന്നോ?” അവർ പറഞ്ഞു: “ഒന്നിന്റെയും കുറവുണ്ടായില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ചുമൽസഞ്ചി.”
    reason: πήρα യാത്രയിൽ സാധനങ്ങളോ ഭക്ഷണമോ വഹിക്കുന്ന സഞ്ചിയെ സൂചിപ്പിക്കാം; കൃത്യമായ സഞ്ചിവകയെ മൂലപദം നിർബന്ധമായി നിശ്ചയിക്കുന്നില്ല.
lexical_decisions:
- source_word: ἄτερ
  choice: ഇല്ലാതെ
  rationale: ഈ പദം ഇവിടെ പറഞ്ഞിരിക്കുന്ന വസ്തുക്കളുടെ അഭാവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അതു പ്രകടിപ്പിക്കുന്നത് ‘ഇല്ലാതെ’ എന്നാണ്.
- source_word: βαλλαντίου
  choice: പണസഞ്ചി
  rationale: പണം കൊണ്ടുനടക്കാനുള്ള സഞ്ചിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പണസഞ്ചി’ വ്യക്തവും ആധുനിക വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമാണ്.
- source_word: πήρας
  choice: യാത്രാസഞ്ചി
  rationale: യാത്രയിൽ സാധനങ്ങളോ ഭക്ഷണമോ കൊണ്ടുപോകാനുള്ള സഞ്ചിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; അതിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ ‘യാത്രാസഞ്ചി’ വ്യക്തമാക്കുന്നു.
- source_word: ὑποδημάτων
  choice: ചെരിപ്പ്
  rationale: പുരാതന യാത്രാസന്ദർഭത്തിലെ കാലണിയെ സൂചിപ്പിക്കുന്ന പൊതുവായതും സ്വാഭാവികവുമായ മലയാളപദമാണിത്.
- source_word: μή τινος ὑστερήσατε
  choice: നിങ്ങൾക്ക് എന്തെങ്കിലും കുറവുണ്ടായിരുന്നോ?
  rationale: ὑστερέω എന്നതിന്റെ ‘കുറവുണ്ടാകുക/ആവശ്യം നേരിടുക’ എന്ന അർഥം നിലനിർത്തുകയും നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് ചോദ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Οὐθενός
  choice: ഒന്നും ഇല്ലായിരുന്നു
  rationale: ഗ്രീക്കിലെ ഹ്രസ്വമായ ‘ഒന്നിന്റെയും അല്ല’ എന്ന മറുപടിയെ സന്ദർഭാനുസൃതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπέστειλα
  choice: ഞാൻ നിങ്ങളെ അയച്ചപ്പോൾ
  rationale: ദൗത്യത്തിനായി അയച്ചതെന്ന സന്ദർഭം ക്രിയയിൽ വ്യക്തമാണ്; മലയാളത്തിലെ ഈ പ്രയോഗം അതിനെ ലളിതമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ചോദ്യവും ചുരുങ്ങിയ മറുപടിയും നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘യാത്രാസഞ്ചി’ എന്ന പദത്തിനരികിൽ ചേർത്തു.
