reference: Luke 22:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: ml
  text: അവൻ പുറപ്പെട്ട് പതിവുപോലെ[a] ഒലിവുമലയിലേക്കു പോയി. ശിഷ്യന്മാരും അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “പതിവനുസരിച്ച്.” ആരുടെ പതിവാണെന്ന് ഗ്രീക്കിൽ പ്രത്യേകം പറഞ്ഞിട്ടില്ല; സന്ദർഭത്തിൽ അത് യേശുവിന്റെ പതിവിനെ സൂചിപ്പിക്കുന്നു.'
    reason: മൂലപ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും സന്ദർഭം നൽകുന്ന അർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: ἐξελθὼν
  choice: പുറപ്പെട്ട്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ἐξέρχομαι എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം. ‘പുറപ്പെട്ട്’ മുൻകൃത്യവും സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹവും നിലനിർത്തുന്നു.
- source_word: ἐπορεύθη
  choice: പോയി
  rationale: πορεύομαι എന്ന സാധാരണ സഞ്ചാരക്രിയയ്ക്ക് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പ്രയോഗം.
- source_word: κατὰ τὸ ἔθος
  choice: പതിവുപോലെ
  rationale: പതിവായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ആരുടെ പതിവാണെന്ന് മുഖ്യവാചകത്തിൽ അധികമായി ചേർക്കാതെ ഗ്രീക്കിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ഒലിവുമലയിലേക്ക്
  rationale: അംഗീകൃതമായ ഭൂമിശാസ്ത്രനാമം സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: ἠκολούθησαν
  choice: അനുഗമിച്ചു
  rationale: ἀκολουθέωയുടെ ‘പിന്തുടരുക/അനുഗമിക്കുക’ എന്ന അടിസ്ഥാനാർഥം ഇവിടെ ശാരീരികമായ സഞ്ചാരത്തെയും ശിഷ്യബന്ധത്തെയും ഉൾക്കൊള്ളുന്നു.
- source_word: οἱ μαθηταί
  choice: ശിഷ്യന്മാർ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസൂചകപദം ഇല്ലാത്തതിനാൽ ‘അവന്റെ ശിഷ്യന്മാർ’ എന്ന് കൂട്ടിച്ചേർക്കാതെ നിർദ്ദിഷ്ടസംഘത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: καὶ … δὲ καὶ
  choice: … ശിഷ്യന്മാരും
  rationale: ആദ്യ καί ആഖ്യാനബന്ധത്തിൽ മലയാളത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല; δὲ καὶയുടെ തുടർച്ചയും കൂട്ടിച്ചേർക്കൽഭാവവും ‘ശിഷ്യന്മാരും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പതിവ് യേശുവിന്റേതാണെന്ന് വ്യക്തമായി ചേർക്കണമോ
  choice: ‘പതിവുപോലെ’ എന്ന് മാത്രം നൽകി വ്യക്തിയെ മുഖ്യവാചകത്തിൽ നിർണ്ണയിക്കാതിരിക്കുക
  alternative: ‘തന്റെ പതിവുപോലെ’
  rationale: സന്ദർഭത്തിൽ പതിവ് യേശുവിന്റേതാണെന്ന് സ്വാഭാവികമായി മനസ്സിലാകുമെങ്കിലും κατὰ τὸ ἔθος എന്ന ഗ്രീക്ക് പ്രയോഗത്തിൽ ‘അവന്റെ/തന്റെ’ എന്ന ഉടമസ്ഥസൂചകം പ്രകടമല്ല. അതിനാൽ മൂലത്തിന്റെ സംക്ഷിപ്തതയും ചെറിയ വ്യാഖ്യാനതുറപ്പും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് സുഗമവുമായ ആഖ്യാനശൈലി. ‘അവൻ പുറപ്പെട്ട്’ എന്ന തുടക്കം ഗ്രീക്കിലെ കൃദന്തഘടനയെ അമിത ഔപചാരികതയില്ലാതെ പ്രതിഫലിപ്പിക്കുന്നു; രണ്ട് ചെറുവാക്യങ്ങളായി വിഭജിച്ചത് മലയാളത്തിലെ വായനാസൗകര്യത്തിനാണ്.
