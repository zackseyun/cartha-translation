  source_fidelity: ഗ്രീക്ക് വാക്യത്തിലെ ക്രമം, മുഖ്യക്രിയ, സ്ഥലനാമം, ശിഷ്യന്മാരുടെ അനുഗമനം എന്നിവ വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു. ‘പുറപ്പെട്ട്’ ἐξελθών-ന്റെ മുൻകൃത്യഭാവവും ‘പോയി’ ἐπορεύθη-യുടെ ലളിതമായ ആഖ്യാനാർഥവും യോജിച്ചവയാണ്. ‘പതിവുപോലെ’ κατὰ τὸ ἔθος-ന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു; ‘ശിഷ്യന്മാരും’ δὲ καὶയുടെ കൂട്ടിച്ചേർക്കൽഭാവം സ്വാഭാവികമായി നൽകുന്നു.
