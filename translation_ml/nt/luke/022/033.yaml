id: LUK.22.33
reference: Luke 22:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ യേശുവിനോട് പറഞ്ഞു: “കർത്താവേ, അങ്ങയോടൊപ്പം തടവറയിലേക്കും മരണത്തിലേക്കും പോകാൻ ഞാൻ തയ്യാറാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: എന്നാൽ അവൻ
  rationale: ὁ എന്നത് ഇവിടെ പത്രോസിനെ സൂചിപ്പിക്കുന്ന സർവനാമപ്രയോഗമാണ്; δέ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: εἶπεν αὐτῷ
  choice: യേശുവിനോട് പറഞ്ഞു
  rationale: αὐτῷ എന്നതിന്റെ സന്ദർഭപരമായ സൂചിതവ്യക്തി യേശുവാണ്. മലയാളത്തിൽ തുടർച്ചയായ സർവനാമങ്ങൾ മൂലമുള്ള അവ്യക്തത ഒഴിവാക്കാൻ പേര് വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയിൽ κύριος എന്ന ബഹുമാനപദത്തിന്റെയും ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകത്തിന്റെയും ഭാരം നിലനിർത്തുന്നു.
- source_word: μετὰ σοῦ
  choice: അങ്ങയോടൊപ്പം
  rationale: μετά + genitive സഹഗമനത്തെ സൂചിപ്പിക്കുന്നു. യേശുവിനോടുള്ള ആദരവുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് ‘അങ്ങ്’ യോജിക്കുന്നു.
- source_word: ἕτοιμός εἰμι
  choice: ഞാൻ തയ്യാറാണ്
  rationale: സന്നദ്ധതയും ഒരുക്കവും പ്രകടിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്.
- source_word: καὶ ... καὶ
  choice: …ലേക്കും …ലേക്കും
  rationale: ജയിലിനെയും മരണത്തെയും സമാന്തരമായി ഊന്നുന്ന paired καί ഘടന മലയാളത്തിലെ ആവർത്തിത ‘-ഉം’ പ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἰς φυλακὴν
  choice: തടവിലേക്ക്
  rationale: φυλακή ഇവിടെ കാവൽസ്ഥലത്തേക്കാൾ തടവിലാക്കപ്പെടുന്ന അവസ്ഥയെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; εἰς എന്നതിന്റെ ദിശാബോധവും ‘-ലേക്ക്’ നിലനിർത്തുന്നു.
- source_word: εἰς θάνατον
  choice: മരണത്തിലേക്ക്
  rationale: മരണംവരെ പോകാനുള്ള സന്നദ്ധതയാണ് സൂചിപ്പിക്കുന്നത്; ആദ്യ εἰς ഘടനയോടുള്ള സമാന്തരതയും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: πορεύεσθαι
  choice: പോകാൻ
  rationale: ἕτοιμός εἰμι എന്നതിന്റെ പൂരകമായ infinitive ഇവിടെ സഹഗമനമോ മുന്നോട്ടുള്ള ഗതിയോ സൂചിപ്പിക്കുന്നു; ‘പോകാൻ’ ഏറ്റവും സ്വാഭാവികമാണ്.
theological_decisions:
- issue: യേശുവിനുള്ള κύριος എന്ന ശീർഷകത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: ഗുരു / യജമാനൻ
  rationale: ‘കർത്താവ്’ ബഹുമാനപൂർവമായ അഭിസംബോധനയും ശീർഷകത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു; സന്ദർഭം അനുവദിക്കുന്നതിലധികം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. യേശുവിനോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സമാന്തര ഘടന ‘തടവിലേക്കും മരണത്തിലേക്കും’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
