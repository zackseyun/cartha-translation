  text: And after going outside, he wept bitterly.
translation:
  language: ml
  text: അവൻ പുറത്തേക്കു പോയി, കഠിനമായി കരഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല)
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ ഈ ലളിതമായ ബന്ധകത്തിന്റെ ആശയം വാക്യക്രമത്തിലൂടെ വ്യക്തമാകുന്നു; ‘പിന്നെ’ എന്നു ചേർത്താൽ ഗ്രീക്കിലുള്ളതിലധികം കാലക്രമസൂചന വരാം.
- source_word: ἐξελθὼν
  choice: പോയശേഷം
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ aorist participle മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘പോയശേഷം’ അത് സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔξω
  choice: പുറത്തേക്കു
  rationale: പുറത്തേക്കുള്ള ഗതിയും പുറത്തെ സ്ഥാനവും സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: ἔκλαυσεν
  choice: അവൻ പൊട്ടിക്കരഞ്ഞു
  rationale: κλαίω കരയുക/വിലപിക്കുക എന്നർഥം വഹിക്കുന്നു; πικρῶς എന്ന തീവ്രമായ രീതിസൂചനയോടൊപ്പം ‘പൊട്ടിക്കരഞ്ഞു’ ആഴമുള്ള ദുഃഖത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πικρῶς
  choice: പൊട്ടിക്കരഞ്ഞു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കഠിനമായി’ എന്ന അസ്വാഭാവിക പ്രയോഗത്തിനു പകരം, ക്രിയയോടു ചേർത്ത് കരച്ചിലിന്റെ തീവ്രത മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
