translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘പൊട്ടിക്കരഞ്ഞു’ എന്ന പ്രയോഗം πικρῶς എന്നതിന്റെ ഭാവതീവ്രത സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; അടിക്കുറിപ്പിൽ കൂടുതൽ പദാനുപദമായ രൂപം നൽകിയിരിക്കുന്നു.
