source:
  edition: SBLGNT
  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: ml
  text: 'അവൻ അപ്പം എടുത്ത്, നന്ദി അർപ്പിച്ചശേഷം, അതു മുറിച്ച് അവർക്കു കൊടുത്ത് പറഞ്ഞു: “ഇത് നിങ്ങൾക്കുവേണ്ടി നൽകപ്പെടുന്ന എന്റെ ശരീരമാണ്[c][b]. എന്നെ ഓർക്കുന്നതിനായി ഇതു തുടർന്നും ചെയ്യുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “നിങ്ങൾക്കുവേണ്ടി നൽകപ്പെടുന്ന എന്റെ ശരീരമാണ്. എന്നെ ഓർക്കുന്നതിനായി ഇതു തുടർന്നും ചെയ്യുക” എന്ന ഭാഗം ഇല്ല.
    reason: textual_variant
  - marker: b
    text: 'അല്ലെങ്കിൽ: “ഇത് നിങ്ങൾക്കുവേണ്ടി ഇപ്പോൾ നൽകപ്പെടുന്ന എന്റെ ശരീരമാണ്.”'
    reason: lexical_alternative
  - marker: c
    text: “ഇത് എന്റെ ശരീരമാണ്” എന്നത് ഗ്രീക്കിൽ എഴുതിയിരിക്കുന്നതുപോലെതന്നെ പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു. ചിലർ ഇതിനെ “ഇത് എന്റെ ശരീരത്തെ സൂചിപ്പിക്കുന്നു” എന്നു വ്യാഖ്യാനിക്കുന്നുണ്ടെങ്കിലും, ഗ്രീക്ക് പാഠത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നത് “ആണ്” എന്ന ക്രിയയാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: അപ്പം എടുത്ത്
  rationale: കഥനത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്ക് കൃതന്തത്തിന്റെ മുൻകാലപ്രവർത്തനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: εὐχαριστήσας
  choice: നന്ദി അർപ്പിച്ചശേഷം
  rationale: അപ്പം മുറിക്കുന്നതിനു മുമ്പുള്ള നന്ദിയർപ്പണം വ്യക്തമാക്കുന്നു; മൂലത്തിൽ നേരിട്ട് പറയാത്ത കർമം ചേർക്കുന്നില്ല.
- source_word: ἔκλασεν καὶ ἔδωκεν αὐτοῖς
  choice: അതു മുറിച്ച് അവർക്കു കൊടുത്തുകൊണ്ട്
  rationale: മലയാളത്തിൽ വ്യക്തതയ്ക്കായി സൂചിത കർമമായ ‘അതു’ ചേർക്കുന്നു; പ്രവർത്തനങ്ങളുടെ തുടർച്ച സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: ഇത് എന്റെ ശരീരമാണ്
  rationale: ἐστιν എന്ന ബന്ധകക്രിയയെ ‘ആണ്’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി, കർത്താവിന്റെ അത്താഴത്തെക്കുറിച്ചുള്ള വിവാദ വ്യാഖ്യാനങ്ങളിലൊന്നും വിവർത്തനത്തിലൂടെ നിർബന്ധിക്കുന്നില്ല.
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: നിങ്ങൾക്കുവേണ്ടി നൽകപ്പെടുന്നത്
  rationale: ഗ്രീക്കിലെ നിർദേശക-കൃതന്തഘടനയെ സ്വാഭാവികമായ അനുബന്ധപ്രസ്താവനയാക്കി; ὑπέρ എന്നതിന്റെ പ്രയോജനാർഥകവും പ്രതിനിധാനസാധ്യതയുള്ളതുമായ വ്യാപ്തി ‘വേണ്ടി’ നിലനിർത്തുന്നു.
- source_word: τοῦτο ποιεῖτε
  choice: ഇതു തുടർന്നും ചെയ്യുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിൽ ഈ സന്ദർഭത്തിൽ കാണുന്ന ആവർത്തിതമോ തുടരുന്നതോ ആയ ആചരണബലം വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: എന്നെ ഓർക്കുന്നതിനായി
  rationale: സ്വകാര്യമായ ഓർമമാത്രമല്ല, ഉദ്ദേശ്യപൂർവമായ അനുസ്മരണപ്രവൃത്തിയും സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളം.
theological_decisions:
- issue: ‘ഇത് എന്റെ ശരീരമാണ്’ എന്ന വാക്കുകളുടെ കർത്താവിന്റെ അത്താഴസന്ദർഭത്തിലെ അർഥം
  choice: ‘ഇത് എന്റെ ശരീരമാണ്’ എന്ന നേരിട്ടുള്ള വാചകം നിലനിർത്തി.
  alternative: ‘ഇത് എന്റെ ശരീരത്തെ സൂചിപ്പിക്കുന്നു’ അല്ലെങ്കിൽ ‘പ്രതിനിധാനം ചെയ്യുന്നു’.
  rationale: ഗ്രീക്കിൽ ἐστιν (‘ആണ്’) എന്നാണ് ഉള്ളത്. അതിനെ വ്യാഖ്യാനപരമായ മറ്റൊരു ക്രിയയാക്കി മാറ്റുന്നത് പാഠം സ്വയം തീർപ്പാക്കാത്ത ദൈവശാസ്ത്രവിവാദം വിവർത്തനത്തിലൂടെ തീർപ്പാക്കും.
- issue: ലൂക്കോസ് 22:19-ലെ ദീർഘവായനയുടെ പാഠവിമർശനസ്ഥിതി
  choice: SBLGNT-ൽ കോഷ്ഠകസൂചനയോടെ നൽകിയിരിക്കുന്ന ദീർഘഭാഗം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
  alternative: ‘ഇത് എന്റെ ശരീരമാണ്’ എന്നിടത്ത് അവസാനിക്കുന്ന ഹ്രസ്വവായന.
  rationale: നൽകിയ മൂലപാഠം ദീർഘവായനയെ പ്രവർത്തനപാഠമായി ഉൾക്കൊള്ളുന്നു; എന്നാൽ പ്രധാനപ്പെട്ട ഹ്രസ്വവായന അടിക്കുറിപ്പിൽ സുതാര്യമായി രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. പരിചിതമായ സഭാപദാവലിയുടെ അനാവശ്യ ഭാരം ഒഴിവാക്കി; അതേസമയം വചനത്തിന്റെ ആരാധനാപരമായ ഗൗരവവും യഥാർഥ ദൈവശാസ്ത്രവൈരുധ്യവും നിലനിർത്തി.
