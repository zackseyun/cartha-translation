revisions:
- from: 'അവൻ അപ്പം എടുത്ത്, നന്ദി അർപ്പിച്ചശേഷം, അതു മുറിച്ച് അവർക്കു കൊടുത്തുകൊണ്ട് പറഞ്ഞു: “ഇത് എന്റെ ശരീരമാണ്[c]—നിങ്ങൾക്കുവേണ്ടി നൽകപ്പെടുന്നത്[b]. എന്നെ ഓർക്കുന്നതിനായി ഇതു തുടർന്നും ചെയ്യുക.”[a]'
  to: 'അവൻ അപ്പം എടുത്ത്, നന്ദി അർപ്പിച്ചശേഷം, അതു മുറിച്ച് അവർക്കു കൊടുത്ത് പറഞ്ഞു: “ഇത് നിങ്ങൾക്കുവേണ്ടി നൽകപ്പെടുന്ന എന്റെ ശരീരമാണ്[c][b]. എന്നെ ഓർക്കുന്നതിനായി ഇതു തുടർന്നും ചെയ്യുക.”[a]'
  rationale: The revision corrects the Malayalam syntax of the clause corresponding to τὸ ὑπὲρ ὑμῶν διδόμενον while retaining its passive, present-participial force and its connection with “my body.” It also improves the action sequence in the narrative. The longer bracketed SBLGNT reading remains in the main text, and all three audit-trail footnotes remain anchored and aligned with the revised wording.
