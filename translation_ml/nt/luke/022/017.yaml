id: LUK.22.17
reference: Luke 22:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: ml
  text: 'ഒരു പാനപാത്രം[a] ഏറ്റുവാങ്ങി നന്ദി അർപ്പിച്ചശേഷം അദ്ദേഹം പറഞ്ഞു: “ഇതു എടുത്ത് നിങ്ങൾ തമ്മിൽ പങ്കിടുക[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആ പാനപാത്രം.” ഗ്രീക്കിൽ നിശ്ചിത ഉപപദമില്ലാതെ “ഒരു പാനപാത്രം” എന്നാണ്; എങ്കിലും ഭക്ഷണസന്ദർഭം ഒരു പ്രത്യേക പാനപാത്രത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിങ്ങൾ തമ്മിൽ ഇതു വിഭജിക്കുക” അല്ലെങ്കിൽ “വിതരണം ചെയ്യുക.” സന്ദർഭത്തിൽ ഈ ക്രിയയ്ക്ക് വിഭജിക്കുക, വിതരണം ചെയ്യുക, പങ്കിടുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεξάμενος
  choice: ഏറ്റുവാങ്ങി … ശേഷം
  rationale: δέχομαι എന്ന ക്രിയയുടെ aorist middle participle പ്രധാനക്രിയയായ ‘പറഞ്ഞു’ എന്നതിനുമുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ഏറ്റുവാങ്ങി … ശേഷം’ എന്നത് ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ποτήριον
  choice: ഒരു പാനപാത്രം
  rationale: ഗ്രീക്കിൽ നാമത്തിന് നിർദേശക ഉപപദമില്ല. അതിനാൽ ‘ഒരു പാനപാത്രം’ രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ഭക്ഷണസന്ദർഭം ഒരു പ്രത്യേക പാനപാത്രത്തെ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εὐχαριστήσας
  choice: നന്ദി അർപ്പിച്ചശേഷം
  rationale: സംസാരിക്കുന്നതിനുമുമ്പ് നന്ദി അർപ്പിച്ച പ്രവൃത്തിയാണ് participle സൂചിപ്പിക്കുന്നത്. പിൽക്കാല ആരാധനാക്രമത്തിലെ സാങ്കേതിക പദപ്രയോഗം ഇറക്കുമതി ചെയ്യാതെ സാധാരണ ആഖ്യാനഭാഷ നിലനിർത്തുന്നു.
- source_word: εἶπεν
  choice: അദ്ദേഹം പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ പരോക്ഷ കർമം വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ ‘അവരോടു’ എന്നു പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: Λάβετε
  choice: വാങ്ങി
  rationale: ഭക്ഷണമേശയിലെ ഭൗതിക പ്രവൃത്തിക്ക് സ്വാഭാവികമായ ആജ്ഞാരൂപം. തുടർന്നുള്ള ‘പങ്കിട്ടുകൊള്ളുക’ എന്ന ആജ്ഞയുമായി മലയാളത്തിൽ സുഗമമായി ചേരുന്നു.
- source_word: τοῦτο
  choice: ഇതു
  rationale: സർവനാമം മുമ്പ് പറഞ്ഞ പാനപാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ഗ്രീക്ക് നാമം ആവർത്തിക്കുന്നില്ല. ‘ഇതു’ ആ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: διαμερίσατε
  choice: പങ്കിട്ടുകൊള്ളുക
  rationale: ക്രിയയ്ക്ക് വിഭജിക്കുക, വിതരണം ചെയ്യുക, പങ്കിടുക എന്നീ അർഥസാധ്യതകളുണ്ട്. കൂട്ടത്തിനുള്ളിൽ വിതരണം ചെയ്യുന്നതിനെ ‘നിങ്ങൾ തമ്മിൽ പങ്കിട്ടുകൊള്ളുക’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἰς ἑαυτούς
  choice: നിങ്ങൾ തമ്മിൽ
  rationale: സംഘത്തിനുള്ളിലെ പരസ്പര വിതരണമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്. ‘നിങ്ങൾക്കുവേണ്ടി’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: εὐχαριστήσας, ποτήριον എന്നിവയ്ക്ക് പിൽക്കാല കുർബാനാസംബന്ധമായ സാങ്കേതിക ഭാഷ ഉപയോഗിക്കണമോ എന്നത്
  choice: ‘ഒരു പാനപാത്രം’, ‘നന്ദി അർപ്പിച്ചു’ എന്നീ സാധാരണ ആഖ്യാനപദങ്ങൾ
  alternative: ‘ആ പാനപാത്രം’ എന്നോ പ്രത്യേക കുർബാനാസാങ്കേതിക പദാവലി ഉപയോഗിച്ചോ പരിഭാഷപ്പെടുത്തുക
  rationale: വാക്യം യേശുവിന്റെ ഭക്ഷണമേശയിലെ പ്രവൃത്തി വിവരിക്കുന്നു; പിൽക്കാല സഭാപാരമ്പര്യത്തിലെ സാങ്കേതിക അർഥം ഗ്രീക്ക് നിർബന്ധമായി പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ ചരിത്രരംഗവും വാചകത്തിന്റെ പരിധിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പാനപാത്രം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമാണ്; വാക്യക്രമം ഗ്രീക്കിലെ പ്രവൃത്തികളുടെ അനുക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
