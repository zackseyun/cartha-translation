id: LUK.22.66
reference: Luke 22:66
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: ml
  text: നേരം പുലർന്നപ്പോൾ[a], ജനത്തിന്റെ മൂപ്പന്മാരുടെ സമിതി—മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും—ഒന്നിച്ചുകൂടി. അവർ യേശുവിനെ തങ്ങളുടെ സഭയിലേക്ക്[b] കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പകലായപ്പോൾ’ അല്ലെങ്കിൽ ‘പുലർച്ചെ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തങ്ങളുടെ സമിതിയിലേക്കു’ അല്ലെങ്കിൽ ‘തങ്ങളുടെ സഭയുടെ മുമ്പാകെ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം സഭയെയോ അതിന്റെ ഔപചാരിക സമ്മേളനത്തെയോ സമ്മേളനസ്ഥലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: നേരം പുലർന്നപ്പോൾ
  rationale: പകൽ വന്നെത്തിയ സമയത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘പകലായപ്പോൾ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: συνήχθη
  choice: ഒന്നിച്ചുകൂടി
  rationale: സമിതിയിലെ അംഗങ്ങൾ സമ്മേളിച്ചതെന്ന കൂട്ടായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിലെ രൂപം വ്യാകരണപരമായി കർമണിയായിരുന്നാലും മലയാളത്തിൽ ഈ കർത്തരിപ്രയോഗമാണ് കൂടുതൽ സുതാര്യം.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: ജനത്തിന്റെ മൂപ്പന്മാരുടെ സമിതി
  rationale: πρεσβυτέριον എന്നത് മൂപ്പന്മാരടങ്ങിയ സംഘടിത സമിതിയെ സൂചിപ്പിക്കുന്നു; ‘മൂപ്പന്മാർ’ എന്ന പദവും സ്ഥാപനപരമായ അർഥവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും
  rationale: രണ്ടു വിഭാഗങ്ങളെയും ബന്ധിപ്പിക്കുന്ന τε καί എന്ന ഘടനയും അവയുടെ പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ സ്ഥാനനാമങ്ങളും കൃത്യമായി നൽകുന്നു.
- source_word: ἀπήγαγον αὐτόν
  choice: അവർ യേശുവിനെ ... കൊണ്ടുപോയി
  rationale: ἀπάγω എന്നതിലെ ഒരു സ്ഥലത്തേക്കു നയിച്ചുകൊണ്ടുപോകുന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അവനെ’ എന്നതിനു പകരം ‘യേശുവിനെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: തങ്ങളുടെ ന്യായാധിപസഭയിലേക്കു
  rationale: συνέδριον എന്നത് ഇവിടെ ഭരണ-ന്യായാധികാരമുള്ള സഭയെയോ അതിന്റെ ഔപചാരിക സമ്മേളനത്തെയോ സൂചിപ്പിക്കാം. ‘ന്യായാധിപസഭ’ സ്ഥാപനപരമായ അർഥം നൽകുന്നു; സ്ഥലത്തേക്കോ സഭയുടെ മുമ്പാകെയോ എന്ന ദിശാഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യഹൂദ ഭരണസമിതിക്കുള്ള സ്ഥാപനപരമായ പദപ്രയോഗം
  choice: πρεσβυτέριον എന്നതിന് ‘മൂപ്പന്മാരുടെ സമിതി’ എന്നും συνέδριον എന്നതിന് ‘ന്യായാധിപസഭ’ എന്നും വ്യത്യസ്തമായി വിവർത്തനം ചെയ്തു.
  alternative: രണ്ടിനും ‘സമിതി’ എന്നു നൽകുക; അല്ലെങ്കിൽ συνέδριον എന്നത് ‘സൻഹെദ്രിൻ’ എന്നു ലിപ്യന്തരണം ചെയ്യുക.
  rationale: മൂലവാക്യത്തിലെ രണ്ടു ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ പദങ്ങളുടെ വ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു. ‘സൻഹെദ്രിൻ’ എന്ന ചരിത്രനാമം നേരിട്ട് ഇറക്കുമതി ചെയ്യാതെ സാധാരണ വായനക്കാരന് സ്ഥാപനത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു; അതേസമയം συνέδριον സഭയെയോ ഔപചാരിക സമ്മേളനത്തെയോ സൂചിപ്പിക്കാവുന്ന അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി. ഇടയ്ക്കുള്ള ഡാഷ് മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും മൂപ്പന്മാരുടെ സമിതിയിൽ ഉൾപ്പെട്ടവരാണെന്ന അനുബന്ധവിവരം വ്യക്തമാക്കുന്നു.
