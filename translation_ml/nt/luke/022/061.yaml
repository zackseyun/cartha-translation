reference: Luke 22:61
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: ml
  text: കർത്താവ് തിരിഞ്ഞ് പത്രോസിനെ നോക്കി[a]. അപ്പോൾ പത്രോസ്, “ഇന്ന് കോഴി കൂവുന്നതിനുമുമ്പ് നീ മൂന്നുപ്രാവശ്യം എന്നെ തള്ളിപ്പറയും” എന്ന് കർത്താവ് തന്നോടു പറഞ്ഞ വാക്ക് ഓർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പത്രോസിനെ ഉറ്റുനോക്കി”; ഗ്രീക്ക് ക്രിയ നേരിട്ടുള്ളതോ ശ്രദ്ധയോടുകൂടിയതോ ആയ നോട്ടത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: തിരിഞ്ഞ്
  rationale: കർത്താവിന്റെ നോട്ടത്തിനു മുമ്പുള്ള പ്രവൃത്തി സ്വാഭാവികമായ മലയാളത്തിൽ ക്രമത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: യേശുവിനെക്കുറിച്ചുള്ള κύριος എന്ന സ്ഥാനപ്പേരിന്റെ പുതിയനിയമപരമായ ശക്തിയും ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- source_word: ἐνέβλεψεν τῷ Πέτρῳ
  choice: പത്രോസിനെ നോക്കി
  rationale: നേരിട്ടോ ശ്രദ്ധയോടെയോ ഉള്ള നോട്ടം സൂചിപ്പിക്കാവുന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ലളിതമായ മുഖ്യപാഠത്തിൽ നൽകുന്നു; ശക്തമായ ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὑπεμνήσθη
  choice: ഓർത്തു
  rationale: രൂപത്തിന് ‘ഓർമിപ്പിക്കപ്പെട്ടു’ എന്ന ഭാവം സാധ്യമെങ്കിലും സന്ദർഭത്തിൽ പത്രോസ് ആ വാക്ക് ഓർത്തെടുക്കുന്നതാണ് പ്രധാനം; ‘ഓർത്തു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: τοῦ λόγου τοῦ κυρίου
  choice: കർത്താവ് ... പറഞ്ഞ വാക്ക്
  rationale: λόγος ഇവിടെ യേശു മുമ്പ് പറഞ്ഞ പ്രത്യേക വാക്കിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉദ്ധരണിയോടു ചേർത്ത ഈ ഘടന വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὡς εἶπεν αὐτῷ
  choice: തന്നോടു പറഞ്ഞ
  rationale: ὡς ഇവിടെ ഓർത്ത വാക്കിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; ‘തന്നോടു പറഞ്ഞ’ എന്നത് പത്രോസിനോടായിരുന്നു പ്രസ്താവനയെന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: കോഴി കൂവുന്നതിനുമുമ്പ്
  rationale: πρίν സഹിതമുള്ള infinitive മുൻകാലപരിധി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആർട്ടിക്കിൾ വ്യത്യാസം നിർബന്ധമല്ലാത്തതിനാൽ ‘കോഴി’ സ്വാഭാവികമാണ്.
- source_word: σήμερον
  choice: ഇന്ന്
  rationale: പ്രവചനത്തിന്റെ ഉടനടിത്ത്വം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἀπαρνήσῃ με
  choice: എന്നെ തള്ളിപ്പറയും
  rationale: ἀπαρνέομαι ഇവിടെ യേശുവുമായുള്ള ബന്ധം നിഷേധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘തള്ളിപ്പറയും’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും ശക്തവുമായ മലയാള പ്രയോഗമാണ്.
- source_word: τρίς
  choice: മൂന്നുപ്രാവശ്യം
  rationale: ആവർത്തനസംഖ്യയെ വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനുള്ള κύριος എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: ഗുരു / യജമാനൻ
  rationale: ‘കർത്താവ്’ എന്നത് ആഖ്യാനത്തിലെ സ്ഥാനപ്പേരും അതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും സംരക്ഷിക്കുന്നു; ‘ഗുരു’ അല്ലെങ്കിൽ ‘യജമാനൻ’ അർഥപരിധി അനാവശ്യമായി ചുരുക്കും.
- issue: ἀπαρνέομαι എന്ന ക്രിയയുടെ ബന്ധപരമായ ശക്തി
  choice: എന്നെ തള്ളിപ്പറയും
  alternative: എന്നെ അറിയില്ലെന്നു പറയും / എന്നെ നിഷേധിക്കും
  rationale: പത്രോസിന്റെ പ്രവൃത്തിയിൽ വാക്കാലുള്ള നിഷേധവും യേശുവുമായുള്ള ബന്ധത്തെ തള്ളിപ്പറയലും ഉൾപ്പെടുന്നു. ‘തള്ളിപ്പറയും’ ഈ ഇരട്ടഭാവം സിദ്ധാന്തപരമായ അധികവ്യാഖ്യാനം കൂടാതെ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്കിലെ participial ഘടന സ്വാഭാവികമായ അനുക്രമവാക്യങ്ങളാക്കി. ഉദ്ധരണിയുടെ പദക്രമം മലയാളത്തിലെ സ്വാഭാവിക രീതിയിൽ ക്രമീകരിച്ചെങ്കിലും ‘ഇന്ന്’, ‘കോഴി കൂവുന്നതിനുമുമ്പ്’, ‘മൂന്നുപ്രാവശ്യം’ എന്നീ ഘടകങ്ങൾ എല്ലാം സംരക്ഷിച്ചു.
