source:
  edition: SBLGNT
  text: καὶ ἐξωμολόγησεν, καὶ ἐζήτει εὐκαιρίαν τοῦ παραδοῦναι αὐτὸν ⸂ἄτερ ὄχλου αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: ml
  text: അവൻ സമ്മതിച്ചു; ജനക്കൂട്ടമില്ലാതെ യേശുവിനെ അവർക്ക് ഏൽപ്പിച്ചുകൊടുക്കാൻ[a] അനുകൂലമായ അവസരം അന്വേഷിച്ചുതുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒറ്റിക്കൊടുക്കാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘ഏൽപ്പിച്ചുകൊടുക്കുക’ അഥവാ ‘കൈമാറുക’ എന്നാണ്; എന്നാൽ യൂദാസിന്റെ പങ്ക് കണക്കിലെടുക്കുമ്പോൾ ‘ഒറ്റിക്കൊടുക്കുക’ എന്നത് സന്ദർഭോചിതമായ പരിഭാഷയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: സമ്മതിച്ചു
  rationale: മുൻസന്ദർഭത്തിൽ മുഖ്യപുരോഹിതന്മാരുടെയും ഉദ്യോഗസ്ഥരുടെയും നിർദേശത്തോട് യൂദാസ് അനുകൂലമായി പ്രതികരിക്കുന്നതിനാൽ, ഇവിടെ ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം ‘സമ്മതിച്ചു’ എന്നാണ്.
- source_word: ἐζήτει
  choice: അന്വേഷിച്ചുതുടങ്ങി
  rationale: അപൂർണ്ണകാല ക്രിയ സൂചിപ്പിക്കുന്ന ആരംഭിച്ചും തുടർന്നുമിരുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εὐκαιρίαν
  choice: പറ്റിയ അവസരം
  rationale: പ്രവൃത്തിക്ക് അനുകൂലവും യോജിച്ചതുമായ സന്ദർഭം എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: τοῦ παραδοῦναι
  choice: ഏല്പിച്ചുകൊടുക്കാൻ
  rationale: παραδίδωμι എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘കൈമാറുക/ഏല്പിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; യൂദാസിന്റെ പ്രവൃത്തിയിൽ ‘ഒറ്റിക്കൊടുക്കുക’ എന്ന സന്ദർഭാർഥവും സാധുവാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἄτερ ὄχλου
  choice: ജനക്കൂട്ടം ഇല്ലാത്തപ്പോൾ
  rationale: ജനക്കൂട്ടത്തിന്റെ അഭാവത്തിൽ എന്ന സാഹചര്യാർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്ക്
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ മുഖ്യപുരോഹിതന്മാരും ദേവാലയകാവൽസേനാധിപന്മാരുമാണ് കൈമാറ്റത്തിന്റെ സ്വീകർത്താക്കൾ എന്ന് ദത്തിവ് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: παραδίδωμι എന്ന പദത്തിൽ കൈമാറ്റവും വഞ്ചനയും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘ഏല്പിച്ചുകൊടുക്കുക’
  alternative: ‘ഒറ്റിക്കൊടുക്കുക’
  rationale: മൂലക്രിയയുടെ വിശാലമായ ‘കൈമാറുക’ എന്ന അർഥവും പീഡാനുഭവവിവരണത്തിലെ പദസാമ്യവും പ്രധാനപാഠത്തിൽ സൂക്ഷിക്കുന്നു; യൂദാസിന്റെ വഞ്ചനാപരമായ പങ്ക് അടിക്കുറിപ്പിലെ സ്വാഭാവിക ബദലിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യേശുവിനെ’ എന്ന പേര് ഗ്രീക്കിലെ αὐτόν എന്ന സർവനാമത്തിന്റെ സന്ദർഭസൂചന വ്യക്തമാക്കാൻ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ക്രിയാഭാഗത്തിനു ശേഷം ചേർത്തിരിക്കുന്നു.
