  text: Ὑμεῖς δέ ἐστε οἱ διαμεμενηκότες μετ’ ἐμοῦ ἐν τοῖς πειρασμοῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: ml
  text: എന്നാൽ എന്റെ പരീക്ഷണങ്ങളിൽ എന്നോടുകൂടെ നിലനിന്നവർ നിങ്ങളാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: നിങ്ങളാണ്
  rationale: വാക്യാരംഭത്തിലെ ബഹുവചന സർവനാമത്തിനുള്ള ഊന്നൽ ‘നിങ്ങളാണ്’ എന്ന പ്രയോഗം സ്വാഭാവികമായി പകരുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: οἱ διαμεμενηκότες
  choice: നിലനിന്നവർ
  rationale: διαμένω എന്ന ക്രിയയുടെ തുടർച്ചയും ഇതുവരെയുള്ള സ്ഥിരതയും സൂചിപ്പിക്കുന്നു; ആർട്ടിക്കിളോടുകൂടിയ കൃതന്തത്തിന്റെ കൂട്ടസൂചനയും നിലനിർത്തുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടുകൂടെ
  rationale: ബന്ധവും സഹവാസവും സൂചിപ്പിക്കുന്ന μετά + genitive എന്ന ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: എന്റെ പരീക്ഷകളിൽ
  rationale: πειρασμός എന്ന പദത്തിന്റെ പരീക്ഷണം/പ്രലോഭനം എന്നീ സാധ്യതകളിൽ മുഖ്യപാഠം വിശാലമായ ‘പരീക്ഷകൾ’ ഉപയോഗിക്കുന്നു; സന്ദർഭത്തിൽ യേശു നേരിട്ട കഷ്ടതകളും എതിർപ്പുകളും ഉൾപ്പെടുന്നു, പദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ സംബന്ധിച്ച πειρασμοῖς എന്ന പദത്തിന്റെ അർഥം
  choice: പരീക്ഷകൾ
  alternative: പ്രലോഭനങ്ങൾ; പരിശോധനകൾ
  rationale: ഇവിടെ ശിഷ്യന്മാർ യേശുവിന്റെ പ്രയാസകരമായ അനുഭവങ്ങളിൽ കൂടെ നിലനിന്നതാണു സന്ദർഭത്തിന്റെ ഊന്നൽ. എങ്കിലും ഗ്രീക്ക് പദത്തിന് പ്രലോഭനം എന്ന അർഥവും വരാവുന്നതിനാൽ ആ ദൈവശാസ്ത്രപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘എന്നോടുകൂടെ’ എന്നത് dignified biblical register നിലനിർത്തുന്നു; ‘നിങ്ങളാണ്’ മൂലത്തിലെ ഊന്നൽ സ്വാഭാവികമായി പകരുന്നു.
