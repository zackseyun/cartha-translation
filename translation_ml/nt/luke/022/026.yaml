  terminology: ‘വലിയവൻ’ താരതമ്യപരമായ സാമൂഹികമേന്മയെ, ‘ഇളയവൻ’ താരതമ്യപരമായ ജൂനിയർ സ്ഥാനത്തെ, ‘സേവിക്കുന്നവൻ’ διακονῶνന്റെ സജീവസേവനത്തെ യോജ്യമായി പ്രതിനിധീകരിക്കുന്നു. അടിക്കുറിപ്പ് b പ്രായസൂചനയെ മാത്രമായി ചുരുക്കാതെയുള്ള സാമൂഹിക അർഥം സഹായകരമായി വ്യക്തമാക്കുന്നു.
