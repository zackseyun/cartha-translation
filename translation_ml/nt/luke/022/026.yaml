id: LUK.22.26
reference: Luke 22:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളോ അങ്ങനെയാകരുത്[a]. മറിച്ച്, നിങ്ങളുടെ ഇടയിൽ വലിയവൻ ഇളയവനെപ്പോലെയും[b] നേതൃത്വം വഹിക്കുന്നവൻ സേവിക്കുന്നവനെപ്പോലെയും ആയിത്തീരട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നാൽ നിങ്ങളുടെ ഇടയിൽ അങ്ങനെയല്ല.” ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തമാണ്; മുമ്പ് പറഞ്ഞ അധികാരമോഹപരമായ രീതിയിൽനിന്ന് യേശുവിന്റെ ശിഷ്യരെ അത് ശക്തമായി വേർതിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: “ഇളയവൻ” എന്നത് പ്രായത്തിൽ കുറഞ്ഞവനെ മാത്രമല്ല, സമൂഹത്തിൽ കീഴ്നിലയിലുള്ളവനെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: എന്നാൽ നിങ്ങളോ അങ്ങനെയാകരുത്
  rationale: ὑμεῖς എന്ന സർവനാമത്തിന്റെ ഊന്നലും δὲ സൂചിപ്പിക്കുന്ന ശക്തമായ വൈരുധ്യവും നിലനിർത്തുന്നു. ഗ്രീക്കിലെ സംക്ഷിപ്തമായ പ്രയോഗത്തെ മുൻവാക്യത്തിലെ അധികാരമോഹപരമായ രീതിയോടുള്ള നിരോധനമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀλλ’
  choice: മറിച്ച്
  rationale: നിഷേധത്തിൽനിന്ന് യേശുവിന്റെ അനുകൂല നിർദേശത്തിലേക്കുള്ള ശക്തമായ വൈരുധ്യപരമായ മാറ്റം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ὁ μείζων
  choice: വലിയവൻ
  rationale: താരതമ്യരൂപമായ μείζων സൂചിപ്പിക്കുന്ന ഉയർന്ന സ്ഥാനമോ പ്രാധാന്യമോ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘ഏറ്റവും വലിയവൻ’ എന്ന അതിശയോക്തിരൂപം ഒഴിവാക്കുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: ശിഷ്യസമൂഹത്തിനുള്ളിലെ ബന്ധപരമായ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: γινέσθω
  choice: ആയിത്തീരട്ടെ
  rationale: γίνομαι എന്ന ക്രിയയുടെ ‘ആയിത്തീരുക/ഒരു നിലപാട് സ്വീകരിക്കുക’ എന്ന ചലനാത്മക അർഥവും ആജ്ഞാഭാവവും നിലനിർത്തുന്നു.
- source_word: ὡς ὁ νεώτερος
  choice: ഇളയവനെപ്പോലെ
  rationale: νεώτερος എന്ന താരതമ്യരൂപത്തെ ‘ഇളയവൻ’ എന്നു നൽകുന്നു; ഇത് പ്രായം മാത്രമല്ല, സാമൂഹികമായി കീഴ്നിലയിലുള്ളവനെയും സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἡγούμενος
  choice: നേതൃത്വം വഹിക്കുന്നവൻ
  rationale: പങ്കാളിത്തക്രിയയുടെ സജീവസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് സമൂഹത്തിനുള്ളിലെ നേതൃത്വത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; രാഷ്ട്രീയമോ സഭാസ്ഥാനപരമോ ആയ അമിതസൂചന ഒഴിവാക്കുന്നു.
- source_word: ὡς ὁ διακονῶν
  choice: സേവിക്കുന്നവനെപ്പോലെ
  rationale: διακονῶν എന്ന പദത്തിന്റെ സജീവമായ സേവനപ്രവൃത്തിയെ നിലനിർത്തുന്നു; സ്ഥാപനപരമായ പദവിയേക്കാൾ പ്രവൃത്തിക്കാണ് ഊന്നൽ നൽകുന്നത്.
theological_decisions:
- issue: പദവിയെയും നേതൃത്വത്തെയും കുറിച്ചുള്ള യേശുവിന്റെ നിർദേശം
  choice: ശിഷ്യസമൂഹത്തിനുള്ളിൽ സാമൂഹികമേന്മയെ വിനീതസേവനമായി മറിച്ചിടുന്ന ധാർമിക നിർദേശമായി പരിഭാഷപ്പെടുത്തി.
  alternative: സഭാപദവിയെയോ ഔദ്യോഗിക ഭരണാധികാരത്തെയോ കൂടുതൽ ശക്തമായി സൂചിപ്പിക്കുന്ന ഭാഷ ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ‘വലിയവനെയും’ ‘നേതൃത്വം വഹിക്കുന്നവനെയും’ യഥാക്രമം ‘ഇളയവനോടും’ ‘സേവിക്കുന്നവനോടും’ താരതമ്യം ചെയ്യുന്നു. അതിനാൽ വിനീതസേവനത്തിലേക്കുള്ള ആഹ്വാനം നിലനിർത്തുകയും പിൽക്കാല സഭാഘടനകൾ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിങ്ങളോ’ വൈരുധ്യത്തിന് ഊന്നൽ നൽകുന്നു; ‘ആയിത്തീരട്ടെ’ ഗ്രീക്ക് ആജ്ഞയുടെ ചലനാത്മകത നിലനിർത്തുന്നു. പദവികേന്ദ്രിതമോ സഭാസാങ്കേതികമോ ആയ ഭാഷ ഒഴിവാക്കി.
