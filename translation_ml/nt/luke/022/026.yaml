  source_fidelity: ഗ്രീക്ക് പാഠത്തിലെ ഊന്നലുള്ള വൈരുധ്യം (ὑμεῖς δὲ), സന്ദർഭാനുസൃത നിഷേധാത്മക നിർദേശം (οὐχ οὕτως), ശക്തമായ വിപരീതനിർദേശം (ἀλλ’), താരതമ്യരൂപങ്ങളായ ‘വലിയവൻ/ഇളയവൻ,’ γινέσθωയുടെ ആജ്ഞാഭാവവും ചലനാത്മകതയും, കൂടാതെ നേതൃത്വം വഹിക്കുന്നവനും സേവിക്കുന്നവനും തമ്മിലുള്ള സമാന്തരതയും പരിഭാഷ വിശ്വസ്തമായി നൽകുന്നു.
