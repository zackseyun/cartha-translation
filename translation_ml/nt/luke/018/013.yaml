source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: ml
  text: 'എന്നാൽ ചുങ്കക്കാരൻ അകലെ നിന്നുകൊണ്ട്, സ്വർഗത്തിലേക്ക് കണ്ണുകൾ ഉയർത്താൻപോലും മനസ്സില്ലാതെ, നെഞ്ചത്തടിച്ചുകൊണ്ടിരുന്നു. അവൻ പറഞ്ഞു: ‘ദൈവമേ, പാപിയായ എന്നോടു കരുണ കാണിക്കണമേ.[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നോടു പ്രസാദിക്കണമേ.” ഈ ക്രിയ പ്രായശ്ചിത്തത്തെയും ദൈവപ്രീതിയെയും സൂചിപ്പിക്കുന്ന പദങ്ങളുമായി ബന്ധപ്പെട്ടതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελώνης
  choice: ചുങ്കക്കാരൻ
  rationale: റോമൻ ഭരണസംവിധാനത്തിനുവേണ്ടി ചുങ്കം പിരിച്ചിരുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന, സുവിശേഷസന്ദർഭത്തിൽ പരിചിതവും സാമൂഹിക അപകീർത്തിയുടെ സൂചന നിലനിർത്തുന്നതുമായ മലയാളപദം.
- source_word: μακρόθεν
  choice: അകലെ
  rationale: സ്ഥലപരമായ അകലം ലളിതമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ വിനയഭാവം വ്യാഖ്യാനമായി ചേർക്കുന്നില്ല.
- source_word: ἑστὼς
  choice: നിന്നുകൊണ്ട്
  rationale: വർത്തമാനസംബന്ധിയായ കൃതന്തത്തിന്റെ പശ്ചാത്തലപ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: ഉയർത്താൻപോലും മനസ്സില്ലാതെ
  rationale: θέλω സൂചിപ്പിക്കുന്ന മനസ്സോ സന്നദ്ധതയോ നിലനിർത്തുന്നു; വെറും കഴിവില്ലായ്മയായി മാറ്റുന്നില്ല.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: സ്വർഗത്തിലേക്ക് കണ്ണുകൾ ഉയർത്താൻ
  rationale: ഗ്രീക്കിലെ ദിശയും ശരീരഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് പകരുന്നു.
- source_word: ἔτυπτε
  choice: നെഞ്ചത്തടിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായോ ആവർത്തിച്ചോ ഉള്ള പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: τὸ στῆθος αὐτοῦ
  choice: നെഞ്ച്
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ദുഃഖത്തിന്റെയും അനുതാപത്തിന്റെയും ശരീരഭാവം വ്യക്തമായി നൽകുന്നതുമാണ്.
- source_word: ἱλάσθητί μοι
  choice: എന്നോടു കരുണ തോന്നണമേ
  rationale: നേരിട്ടുള്ള പ്രാർഥനയിൽ സ്വാഭാവികവും ഗ്രഹിക്കാവുന്നതുമായ ഭാഷ ഉപയോഗിക്കുമ്പോഴും, പ്രായശ്ചിത്തം/ദൈവപ്രീതി സംബന്ധിച്ച പദബന്ധത്തിന്റെ കൂടുതൽ സാങ്കേതിക സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τῷ ἁμαρτωλῷ
  choice: പാപിയായ എന്നോട്
  rationale: ഗ്രീക്കിലെ നിർദ്ദിഷ്ട ഉപപദത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു; ‘ഒരു പാപിയായ എന്നോട്’ എന്നതിനെക്കാൾ ആത്മനിന്ദയുടെ വ്യക്തിപരമായ ശക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἱλάσθητί μοι എന്ന പ്രാർഥനയിലെ ദൈവകരുണയും പ്രായശ്ചിത്തബന്ധമുള്ള സൂചനയും എങ്ങനെ പകരണം
  choice: എന്നോടു കരുണ തോന്നണമേ
  alternative: എനിക്കു പ്രസാദമുള്ളവനാകണമേ; എനിക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യണമേ
  rationale: മുഖ്യവാചകത്തിൽ സാങ്കേതിക ദൈവശാസ്ത്രഭാഷ നിർബന്ധിക്കാതെ പ്രാർഥനയുടെ നേരിട്ടുള്ള അർത്ഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു. അതേസമയം, ക്രിയയുടെ പ്രായശ്ചിത്തം/ദൈവപ്രീതി സംബന്ധിച്ച പദപരമായ ബന്ധം അടിക്കുറിപ്പിൽ അറിയിച്ച് അർത്ഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘ചുങ്കക്കാരൻ’ എന്ന സുവിശേഷപരിചിത പദം നിലനിർത്തി. തുടർച്ചയായ പ്രവൃത്തിക്ക് ‘അടിച്ചുകൊണ്ടിരുന്നു’ എന്നും, τῷ ἁμαρτωλῷ എന്നതിന്റെ ഊന്നലിന് ‘പാപിയായ എന്നോട്’ എന്നും ഉപയോഗിച്ചു.
