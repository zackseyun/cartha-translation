id: LUK.18.18
reference: Luke 18:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: ml
  text: 'ഒരു ഭരണാധികാരി അവനോടു ചോദിച്ചു: “നല്ല ഗുരോ, ഞാൻ എന്തു ചെയ്താൽ നിത്യജീവൻ അവകാശമായി ലഭിക്കും?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: ചോദിച്ചു
  rationale: ἐπερωτάω എന്ന ക്രിയയുടെ സാധാരണ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു കൃത്യമായി വരുന്നു.
- source_word: τις ἄρχων
  choice: ഒരു ഭരണാധികാരി
  rationale: τις വ്യക്തിയെ അനിശ്ചിതമായി പരിചയപ്പെടുത്തുന്നു; ἄρχων അധികാരസ്ഥാനത്തുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു. പദവി അനാവശ്യമായി നിർവചിക്കാതെ ‘ഒരു ഭരണാധികാരി’ ഇരു ഘടകങ്ങളും നിലനിർത്തുന്നു.
- source_word: λέγων
  choice: 'ചോദിച്ചു:'
  rationale: മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്ന ക്രിയയ്ക്കു പിന്നാലെയുള്ള നേരിട്ടുള്ള ഉദ്ധരണി λέγων എന്ന പങ്കാളിക്രിയയുടെ ആശയം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ആവർത്തനം ഒഴിവാക്കി.
- source_word: Διδάσκαλε ἀγαθέ
  choice: നല്ല ഗുരോ
  rationale: διδάσκαλος അധ്യാപകനെ സൂചിപ്പിക്കുന്നു; അഭിസംബോധനയിൽ സ്വാഭാവികവും മാന്യവുമായ ‘ഗുരോ’ തെരഞ്ഞെടുത്തു. ἀγαθέ എന്ന വിശേഷണം അടുത്ത വാക്യത്തിൽ പ്രാധാന്യമുള്ളതിനാൽ ‘നല്ല’ എന്നു വ്യക്തമായി നിലനിർത്തി.
- source_word: τί ποιήσας
  choice: ഞാൻ എന്തു ചെയ്യണം
  rationale: അഓറിസ്റ്റ് പങ്കാളിക്രിയയും ഭാവികാല ക്രിയയും ചേർന്ന ചോദ്യം ആവശ്യമായ പ്രവൃത്തിയെക്കുറിച്ചാണ്. ‘എന്തു ചെയ്യണം’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം പ്രകടിപ്പിക്കുന്നു; മനുഷ്യപ്രവൃത്തിയാൽ രക്ഷ നേടാമെന്ന ആശയം വിവർത്തനം സ്വയം അംഗീകരിക്കുന്നില്ല.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: ഈ സന്ദർഭത്തിൽ ζωὴ αἰώνιος എന്ന സ്ഥിരമായ ആശയത്തിന് കൃത്യവും മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവുമായ പ്രയോഗമാണിത്.
- source_word: κληρονομήσω
  choice: അവകാശമാക്കാൻ
  rationale: κληρονομέωയിലെ പൈതൃകാവകാശത്തിന്റെ രൂപകം ‘ലഭിക്കാൻ’ എന്നതിനെക്കാൾ ‘അവകാശമാക്കാൻ’ വ്യക്തമായി സംരക്ഷിക്കുന്നു; ഉദ്ദേശ്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: നിത്യജീവനും മനുഷ്യപ്രവൃത്തിയും തമ്മിലുള്ള ബന്ധമായി ഭരണാധികാരി ചോദ്യം രൂപപ്പെടുത്തുന്നത്
  choice: നിത്യജീവൻ അവകാശമാക്കാൻ ഞാൻ എന്തു ചെയ്യണം?
  alternative: എന്തു ചെയ്തിട്ട് ഞാൻ നിത്യജീവൻ അവകാശമാക്കും?
  rationale: മൂലപാഠം ചോദിക്കുന്നയാളുടെ ചിന്തയെ ആവശ്യമായ പ്രവൃത്തിയുടെ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു. ലൂക്കോസിന്റെ സമഗ്രമായ രക്ഷാശാസ്ത്രം മുൻകൂട്ടി ചേർക്കാതെയും ഈ രൂപീകരണത്തെ തിരുത്താതെയും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഭരണാധികാരി’ സാമൂഹിക അധികാരം സൂചിപ്പിക്കുമ്പോഴും നിർദിഷ്ട പദവി അനുമാനിക്കുന്നില്ല. ‘ഗുരോ’ നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല; ഗ്രീക്ക് പങ്കാളിക്രിയയുടെ ആശയം മുഖ്യവാക്യത്തിൽ വ്യക്തമായി പ്രതിഫലിക്കുന്നു.
