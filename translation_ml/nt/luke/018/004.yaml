  yaml_path: translation/nt/luke/018/004.yaml
  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: ml
  text: 'കുറെക്കാലത്തേക്ക് അയാൾക്കു അതിനു മനസ്സില്ലായിരുന്നു, എന്നാൽ പിന്നീട് അയാൾ തന്നോടുതന്നെ പറഞ്ഞു: ‘ഞാൻ ദൈവത്തെ ഭയപ്പെടുകയുമില്ല, മനുഷ്യനെ മാനിക്കുകയുമില്ലെങ്കിലും,’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν
  choice: അതിനു മനസ്സില്ലായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം ഒരു കാലയളവോളം തുടർന്ന മനസ്സില്ലായ്മയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ അഭ്യർഥന അംഗീകരിക്കാൻ മനസ്സില്ലായിരുന്നു എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘നിരസിച്ചു’ എന്നതിലധികം അന്തിമത്വം വരുത്തുന്നില്ല.
- source_word: ἐπὶ χρόνον
  choice: കുറച്ചുകാലത്തേക്ക്
  rationale: നിശ്ചിത ദൈർഘ്യം പറയാതെ ഒരു കാലയളവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μετὰ ταῦτα δὲ
  choice: എന്നാൽ പിന്നീട്
  rationale: കഥയിലെ സമയക്രമവും നേരിയ വൈരുധ്യവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: അയാൾ തന്നോടുതന്നെ പറഞ്ഞു
  rationale: അന്തരംഗ സംഭാഷണമാണെന്നത് ‘ചിന്തിച്ചു’ എന്നതിനെക്കാൾ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: Εἰ καὶ
  choice: …എങ്കിലും
  rationale: ഇവിടെ ഉപാധിയല്ല, സമ്മതാത്മക വൈരുധ്യമാണ്; മലയാളത്തിലെ ‘എങ്കിലും’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: ഞാൻ ദൈവത്തെ ഭയപ്പെടുന്നില്ല
  rationale: φοβέομαι എന്നതിലെ ഭയം/ഭക്ത്യാദരവ് എന്ന അർഥവ്യാപ്തി പൂർണമായി തീർപ്പാക്കാതെ, ഉറവിടത്തിലെ ശക്തമായ ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: മനുഷ്യനെ മാനിക്കുന്നുമില്ല
  rationale: ἐντρέπομαι ഇവിടെ ഒരാളോടുള്ള പരിഗണനയോ മാനമോ കാണിക്കുക എന്ന അർഥത്തിലാണ്. ഏകവചന ἄνθρωπον മലയാളത്തിലും പൊതുവാചകമായ ‘മനുഷ്യനെ’ എന്നു നിലനിർത്താം.
theological_decisions:
- issue: φοβέομαι എന്ന പദത്തിലെ ഭയം–ഭക്ത്യാദരവ് അർഥവ്യാപ്തി
  choice: ദൈവത്തെ ഭയപ്പെടുന്നില്ല
  alternative: ദൈവത്തെ ആദരിക്കുന്നില്ല
  rationale: ന്യായാധിപന്റെ ധാർമിക കുറവ് പ്രസ്താവിക്കുന്ന സന്ദർഭത്തിൽ ‘ഭയപ്പെടുക’ ഉറവിടരൂപവും സ്ഥാപിതമായ ബൈബിൾപ്രയോഗവും സംരക്ഷിക്കുന്നു; ‘ആദരിക്കുക’ എന്നു മാത്രം പറഞ്ഞാൽ അർഥവ്യാപ്തി ചുരുങ്ങും.
- issue: പൊതുവാചകമായ ഏകവചന ἄνθρωπον
  choice: മനുഷ്യനെ
  alternative: ആരെയും
  rationale: ഗ്രീക്കിലെ ഏകവചനവും ‘ദൈവം/മനുഷ്യൻ’ എന്ന സമാന്തരവ്യത്യാസവും നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘മനുഷ്യനെ’ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കാൻ സ്വാഭാവികമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ന്യായാധിപനെ സൂചിപ്പിക്കാൻ സ്വാഭാവികമായ ‘അയാൾ’ ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
