  source_fidelity: 'ഗ്രീക്ക് മൂലത്തോടു വിശ്വസ്തമാണ്: Ἀμὴν λέγω ὑμῖν എന്ന ഉറപ്പുനൽകുന്ന ആമുഖം, οὐδείς ἐστιν ὃς ἀφῆκεν എന്ന നിഷേധാത്മക ആപേക്ഷികപ്രസ്താവന, ഒപ്പം വീടു, ഭാര്യ, സഹോദരന്മാർ, മാതാപിതാക്കൾ, മക്കൾ എന്ന പട്ടികയും ἕνεκεν τῆς βασιλείας τοῦ θεοῦ എന്ന ലക്ഷ്യവാചകവും നിലനിൽക്കുന്നു. ഇംഗ്ലീഷ് POB-യിലെ ‘a house’ എന്ന അനിശ്ചിതത്വം മലയാളത്തിലെ എണ്ണമില്ലാത്ത പൊതുപ്രയോഗമായ ‘വീടോ’ സ്വാഭാവികമായി വഹിക്കുന്നു.'
