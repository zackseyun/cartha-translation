source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ദൈവരാജ്യത്തിനുവേണ്ടി വീടോ ഭാര്യയെയോ സഹോദരന്മാരെയോ മാതാപിതാക്കളെയോ മക്കളെയോ വിട്ടുകളഞ്ഞ ആരുംതന്നെ ഇല്ല,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν
  choice: സത്യമായി
  rationale: യേശുവിന്റെ ഉറപ്പുനൽകുന്ന ആമുഖപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀφῆκεν
  choice: വിട്ടുകളഞ്ഞ
  rationale: വീട് അല്ലെങ്കിൽ കുടുംബബന്ധങ്ങൾ ദൈവരാജ്യത്തിനുവേണ്ടി ഉപേക്ഷിച്ചു/പിന്നിലാക്കി എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: οἰκίαν
  choice: വീട്
  rationale: ഇവിടെ പട്ടികയിലെ ഭൗതിക ഭവനം എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; ഗ്രീക്കിൽ അനിശ്ചിത ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ മലയാളത്തിൽ അനാവശ്യമായി ‘ഒരു’ ചേർക്കുന്നില്ല.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിനുവേണ്ടി
  rationale: കാരണം/ലക്ഷ്യം സൂചിപ്പിക്കുന്ന ἕνεκεν എന്ന പദത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ പരിഭാഷ.
theological_decisions:
- issue: ദൈവരാജ്യത്തിനുവേണ്ടിയുള്ള കുടുംബവിടൽ
  choice: വാക്യത്തിലെ നിബന്ധനാത്മക പ്രസ്താവന യാതൊരു വിശദീകരണവും ചേർക്കാതെ നിലനിർത്തി
  alternative: കുടുംബകടമകൾ ഉപേക്ഷിക്കാനുള്ള പൊതുവായ കല്പനയായി വ്യാഖ്യാനിക്കുക
  rationale: മൂലവാക്യം ഒരു പൊതുകല്പന നൽകുന്നില്ല; ദൈവരാജ്യത്തിനുവേണ്ടി നഷ്ടം സഹിച്ചവരെക്കുറിച്ചുള്ള യേശുവിന്റെ പ്രഖ്യാപനമാണ്, അതിന്റെ തുടർച്ച അടുത്ത വാക്യത്തിലാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് പട്ടികയുടെ ക്രമവും ആവർത്തിക്കുന്ന ‘ഓ’ ഘടനയും പരമാവധി നിലനിർത്തി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമയും ഉദ്ധരണി അടയാളവും അതനുസരിച്ച് നൽകിയിരിക്കുന്നു.
