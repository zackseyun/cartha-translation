source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: ml
  text: അവർ എപ്പോഴും പ്രാർഥിക്കുകയും മനസ്സുതളരാതിരിക്കുകയും വേണമെന്നു കാണിക്കാനായി അവൻ അവരോട് ഒരു ഉപമ പറഞ്ഞുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവർ എപ്പോഴും പ്രാർഥിക്കുകയും നിരുത്സാഹപ്പെടാതിരിക്കുകയും ചെയ്യേണ്ടതിന്റെ ആവശ്യകതയെക്കുറിച്ച്.”
    reason: πρὸς τὸ δεῖν എന്ന പ്രയോഗം ഉദ്ദേശ്യമായോ വിഷയ/ആവശ്യകതാസംബന്ധമായോ മനസ്സിലാക്കാം; ἐγκακεῖν എന്നതിന് ‘നിരുത്സാഹപ്പെടുക’ എന്നതും സാധുവായ പദാർഥപരമായ പരിഭാഷയാണ്.
lexical_decisions:
- source_word: Ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം പശ്ചാത്തലമൊരുക്കുന്ന അല്ലെങ്കിൽ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ലളിതഭൂതകാലത്തേക്കാൾ ഈ രൂപം ഗ്രീക്ക് ക്രിയയുടെ ഭാവം നന്നായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ മൃദുവായ വ്യവഹാരബന്ധകമാണ്. മലയാളത്തിൽ നിർബന്ധമായി ഒരു ബന്ധകപദം ചേർക്കാതെ സ്വാഭാവികമായി മാറ്റം സൂചിപ്പിക്കാം.
- source_word: παραβολὴν
  choice: ഒരു ഉപമ
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ παραβολή എന്ന സാഹിത്യരൂപത്തിന് പതിവും കൃത്യവുമായ മലയാളപദം.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: Ἔλεγεν എന്ന ക്രിയയുടെ ദത്തിവ് പരോക്ഷകർമ്മത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς τὸ δεῖν
  choice: വേണം എന്നതിനെക്കുറിച്ച്
  rationale: πρὸς τό + അനന്തക്രിയയുടെ ഉദ്ദേശ്യ/വിഷയസംബന്ധമായ അർഥവും δεῖν നൽകുന്ന ആവശ്യകതയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായ സ്ഥിരോത്സാഹത്തെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു; ഇടവിടാതെ വാക്കുകളാൽ പ്രാർഥിക്കണം എന്ന കൃത്രിമ അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: προσεύχεσθαι
  choice: പ്രാർഥിക്കുകയും
  rationale: പ്രാർഥിക്കുക എന്നതാണ് സന്ദർഭോചിതമായ സാധാരണ സമാനപദം.
- source_word: αὐτοὺς
  choice: അവർ
  rationale: അനന്തക്രിയകളുടെ കർത്താവായ ആക്ഷേപിക സർവനാമത്തെ മലയാളത്തിൽ വ്യക്തമായ കർത്തൃരൂപത്തിൽ നൽകുന്നു.
- source_word: μὴ ἐγκακεῖν
  choice: മനസ്സുതളരാതിരിക്കുകയും
  rationale: ധൈര്യം നഷ്ടപ്പെടുക, നിരുത്സാഹപ്പെടുക, മടുത്ത് പിന്മാറുക എന്നീ അർഥവ്യാപ്തികളെ പ്രാർഥനയിലെ സ്ഥിരോത്സാഹത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: നിരന്തര പ്രാർഥനയെക്കുറിച്ചുള്ള യേശുവിന്റെ ഉപദേശത്തിന്റെ ശക്തി
  choice: എപ്പോഴും പ്രാർഥിക്കുകയും മനസ്സുതളരാതിരിക്കുകയും വേണം
  alternative: എപ്പോഴും പ്രാർഥിക്കേണ്ടതിന്റെ ആവശ്യകത / പ്രാർഥിച്ചുകൊണ്ടിരിക്കുകയും നിരുത്സാഹപ്പെടാതിരിക്കുകയും ചെയ്യണം
  rationale: δεῖν ആവശ്യകതയോ ബാധ്യതയോ പ്രകടിപ്പിക്കുന്നു. ‘വേണം’ ആ ശക്തി നിലനിർത്തുന്നു; എന്നാൽ പ്രാർഥനയുടെ ഫലപ്രാപ്തിയെക്കുറിച്ചുള്ള ഏതെങ്കിലും പ്രത്യേക സഭാപരമായ സിദ്ധാന്തം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവവും സ്വാഭാവികതയും നിലനിർത്തി. ‘പ്രാർഥിക്കുക’, ‘ഉപമ’, ‘മനസ്സുതളരുക’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാപര സാങ്കേതികഭാഷ ഒഴിവാക്കി.
