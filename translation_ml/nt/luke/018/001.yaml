revisions:
- from: അവർ എപ്പോഴും പ്രാർഥിക്കുകയും മനസ്സുതളരാതിരിക്കുകയും വേണം എന്നതിനെക്കുറിച്ച് അവൻ അവരോട് ഒരു ഉപമ പറഞ്ഞുകൊണ്ടിരുന്നു.[a]
  to: അവർ എപ്പോഴും പ്രാർഥിക്കുകയും മനസ്സുതളരാതിരിക്കുകയും വേണമെന്നു കാണിക്കാനായി അവൻ അവരോട് ഒരു ഉപമ പറഞ്ഞുകൊണ്ടിരുന്നു.[a]
