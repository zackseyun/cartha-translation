source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: ml
  text: അവർക്കാകട്ടെ, ഇവയിൽ ഒന്നും മനസ്സിലായില്ല. ഈ വാക്ക്[a] അവരിൽനിന്ന് മറഞ്ഞിരുന്നു[b]; പറഞ്ഞുകൊണ്ടിരുന്ന കാര്യങ്ങൾ[c] അവർ ഗ്രഹിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഈ പ്രസ്താവന” അല്ലെങ്കിൽ “ഈ സന്ദേശം.”
    reason: lexical_alternative
  - marker: b
    text: “അവരിൽനിന്ന് മറഞ്ഞിരുന്നു” എന്ന നിഷ്ക്രിയപ്രയോഗം അതു മറച്ചത് ആരോ എന്തോ ആണെന്ന് വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: അഥവാ “പറഞ്ഞുകൊണ്ടിരുന്നത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: മനസ്സിലായില്ല
  rationale: യേശു മുമ്പ് പറഞ്ഞ കാര്യങ്ങൾ ബൗദ്ധികമായി മനസ്സിലാക്കാതിരുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐδὲν τούτων
  choice: ഇവയിൽ ഒന്നും
  rationale: മുമ്പ് പറഞ്ഞ പല കാര്യങ്ങളിലേക്കുള്ള ബഹുവചനസൂചന നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: τὸ ῥῆμα τοῦτο
  choice: ഈ വാക്ക്
  rationale: ῥῆμα എന്ന പദത്തിന്റെ ‘വാക്ക്/പ്രസ്താവന/സന്ദേശം’ എന്ന അർഥവ്യാപ്തി തുറന്നുവെച്ചുകൊണ്ട് ഗ്രീക്ക് രൂപത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: അവരിൽനിന്ന് മറഞ്ഞിരുന്നു
  rationale: മറച്ചത് ആരാണെന്നു വ്യക്തമാക്കാതെ, മറഞ്ഞ നിലയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർത്തകാല നിഷ്ക്രിയരൂപത്തിന്റെ ഫലം നിലനിർത്തുന്നു.
- source_word: ἐγίνωσκον
  choice: ഗ്രഹിച്ചില്ല
  rationale: സന്ദർഭത്തിൽ ‘അറിഞ്ഞില്ല’ എന്നതിലുപരി അർഥം ഉൾക്കൊള്ളാതിരുന്നതാണ് ഉദ്ദേശ്യം; അതേസമയം ആദ്യവാക്യത്തിലെ συνῆκαν-ന് നൽകിയ ‘മനസ്സിലായില്ല’ എന്ന പദം അതേപടി ആവർത്തിക്കാതെ ഗ്രീക്കിലെ പദവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: τὰ λεγόμενα
  choice: പറഞ്ഞുകൊണ്ടിരുന്ന കാര്യങ്ങൾ
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ പുരോഗമനഭാവവും പറഞ്ഞ ഉള്ളടക്കത്തോടുള്ള ബഹുവചനസൂചനയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ ഗ്രഹിക്കായ്മയുടെ സ്വഭാവം
  choice: ഗ്രഹിക്കായ്മയെ മൂന്നു വിധത്തിൽ വിവരിക്കുന്ന വാക്യഘടന നിലനിർത്തി; മറച്ചത് ആരാണെന്നു വ്യക്തമാക്കിയില്ല.
  alternative: ദൈവമാണ് മറച്ചതെന്ന് വ്യക്തമാക്കുക, അല്ലെങ്കിൽ അത് വെറും മാനസിക ആശയക്കുഴപ്പമാണെന്ന് വ്യാഖ്യാനിക്കുക.
  rationale: ‘അവരിൽനിന്ന് മറഞ്ഞിരുന്നു’ എന്ന നിഷ്ക്രിയപ്രയോഗത്തിൽ പ്രവർത്തകൻ പറയപ്പെട്ടിട്ടില്ല. അതിനാൽ ദൈവികപ്രവർത്തനമോ മാനസികകുഴപ്പമോ എന്ന് വിവർത്തനത്തിൽ തീരുമാനിക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ ഗൗരവമുള്ളതും വായിക്കാൻ സ്വാഭാവികവുമായ ശൈലി. ‘മനസ്സിലായില്ല/ഗ്രഹിച്ചില്ല’ എന്ന വ്യത്യാസം ഗ്രീക്കിലെ രണ്ട് ക്രിയകളുടെ സൂക്ഷ്മ വ്യത്യാസം സാധ്യമായത്ര നിലനിർത്തുന്നു; ‘അവരിൽനിന്ന് മറഞ്ഞിരുന്നു’ എന്നത് പ്രവർത്തകനെ ചേർക്കുന്നില്ല.
