id: LUK.18.19
reference: Luke 18:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവനോട് പറഞ്ഞു: “നീ എന്നെ നല്ലവൻ എന്നു വിളിക്കുന്നത് എന്തിന്? ഒരുവനായ ദൈവമല്ലാതെ ആരും നല്ലവനല്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: സന്ദർഭത്തിലെ നേരിയ പ്രതികരണസ്വഭാവവും തിരുത്തൽഭാവവും സൂചിപ്പിക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു; ‘അപ്പോൾ’ എന്നും സാധ്യമാണ്.
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: യേശു ... പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു; ‘മറുപടി പറഞ്ഞു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കി.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമം നിലനിർത്തുന്നു; ‘ആ മനുഷ്യനോട്’ എന്നു വികസിപ്പിക്കുന്നില്ല.
- source_word: Τί
  choice: എന്തിന്
  rationale: τί με λέγεις ἀγαθόν എന്ന പ്രയോഗത്തിൽ കാരണം ചോദിക്കുന്ന അർഥമാണ്; ആധുനിക മലയാളത്തിൽ ‘എന്തിന്’ സ്വാഭാവികം.
- source_word: με λέγεις ἀγαθόν
  choice: നീ എന്നെ നല്ലവൻ എന്നു വിളിക്കുന്നത്
  rationale: λέγεις എന്നതിന്റെ നേരിട്ടുള്ള അഭിസംബോധനയും ἀγαθόν എന്ന വിധേയവിശേഷണവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: നല്ലവൻ
  rationale: രണ്ടിടത്തും ഒരേ പദം ഉപയോഗിച്ച് ഗ്രീക്കിലെ ആവർത്തനം സംരക്ഷിക്കുന്നു; ‘ധാർമികമായി നല്ലവൻ’ എന്നു അർഥം ചുരുക്കുന്നില്ല.
- source_word: οὐδεὶς
  choice: ആരുമില്ല
  rationale: സാർവത്രിക നിഷേധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰ μὴ εἷς
  choice: ഒരുവനല്ലാതെ
  rationale: ഒരാളെ മാത്രം ഒഴിവാക്കുന്ന ഗ്രീക്ക് ഘടനയും εἷς എന്ന ഊന്നലും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: പരാമർശിക്കപ്പെടുന്ന ഏക ദൈവത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ചോദ്യത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ സൂചന
  choice: യേശു നല്ലവനാണെന്നതു നിഷേധിക്കുന്നതായോ തന്റെ ദൈവത്വം നേരിട്ട് അവകാശപ്പെടുന്നതായോ വ്യാഖ്യാനിക്കാതെ ചോദ്യം അതേ പിരിമുറുക്കത്തോടെ നിലനിർത്തി.
  alternative: യേശു പരമാർഥത്തിൽ നല്ലവനല്ലെന്ന് നിഷേധിക്കുന്ന പരാവർത്തനം; അല്ലെങ്കിൽ ഈ അഭിസംബോധനയിലൂടെ തന്റെ ദൈവത്വം നേരിട്ട് ഉറപ്പിക്കുന്ന പരാവർത്തനം.
  rationale: ഗ്രീക്ക് വാക്യം ചോദ്യം ഉന്നയിക്കുകയും നന്മയുടെ ഏക ഉറവിടമായി ദൈവത്തെ ചൂണ്ടിക്കാണിക്കുകയും ചെയ്യുന്നു; എന്നാൽ ക്രിസ്തുശാസ്ത്രപരമായ നിഗമനം ഈ വാക്യത്തിൽ തുറന്നുപറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നല്ലവൻ’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ ആശയബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു; അനാവശ്യമായ സഭാപരമോ സാങ്കേതികമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
