revisions:
- from: 'എന്നാൽ യേശു അവനോട് പറഞ്ഞു: “നീ എന്നെ നല്ലവൻ എന്നു വിളിക്കുന്നത് എന്തിന്? ദൈവം ഒരുവനല്ലാതെ നല്ലവൻ ആരുമില്ല.”'
  to: 'എന്നാൽ യേശു അവനോട് പറഞ്ഞു: “നീ എന്നെ നല്ലവൻ എന്നു വിളിക്കുന്നത് എന്തിന്? ഒരുവനായ ദൈവമല്ലാതെ ആരും നല്ലവനല്ല.”'
  rationale: 'The revision only regularizes the final clause into natural modern Malayalam. It retains the Greek sequence of thought: no one is good, except the one—God. It neither treats Jesus’ question as a denial of his goodness nor supplies a doctrinal conclusion not explicitly stated in the verse.'
