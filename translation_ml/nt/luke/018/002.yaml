  text: λέγων· Κριτής τις ἦν ἔν τινι πόλει τὸν θεὸν μὴ φοβούμενος καὶ ἄνθρωπον μὴ ἐντρεπόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/002.yaml
  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഒരു പട്ടണത്തിൽ ഒരു ന്യായാധിപൻ ഉണ്ടായിരുന്നു. അയാൾ ദൈവത്തെ ഭയപ്പെടുകയോ മനുഷ്യരെ മാനിക്കുകയോ ചെയ്തിരുന്നില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരെയും മാനിച്ചിരുന്നില്ല.” ഗ്രീക്കിൽ പൊതുവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന “മനുഷ്യൻ” എന്ന ഏകവചനപദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: അവൻ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ യേശുവിനെ കർത്താവായി എടുത്ത് ഉപമയുടെ ഉള്ളടക്കം സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്നു; ഗ്രീക്ക് വർത്തമാന കൃദന്തരൂപത്തിന്റെ ബന്ധം മലയാളത്തിൽ സമാപികക്രിയയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: Κριτής τις
  choice: ഒരു ന്യായാധിപൻ
  rationale: τις നൽകുന്ന അനിർദിഷ്ടത മലയാളത്തിലെ ‘ഒരു’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ഒരു പ്രത്യേക’ എന്നു വിവർത്തനം ചെയ്യുന്നത് അനാവശ്യമായ ഊന്നൽ സൃഷ്ടിക്കും.
- source_word: ἔν τινι πόλει
  choice: ഒരു പട്ടണത്തിൽ
  rationale: രണ്ടാമത്തെ τις-ന്റെ അനിർദിഷ്ടതയും കഥാപരമായ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: ദൈവത്തെ ഭയപ്പെടുകയോ
  rationale: ന്യായാധിപന്റെ സ്ഥിരസ്വഭാവം സൂചിപ്പിക്കുകയും ‘ദൈവത്തെ ഭയപ്പെടുക’ എന്ന ധാർമിക-മതപരമായ ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: മനുഷ്യരെ മാനിക്കുകയോ ചെയ്തിരുന്നില്ല
  rationale: ഏകവചനമായ ἄνθρωπον ഇവിടെ പൊതുവാചകമാണ്; മലയാളത്തിൽ ബഹുവചനമായ ‘മനുഷ്യരെ’ അതിന്റെ സർവസാധാരണ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു. ἐντρέπομαι ഇവിടെ മറ്റുള്ളവരോടുള്ള പരിഗണനയോ ആദരവോ കാണിക്കുക എന്ന അർത്ഥത്തിലാണ്.
theological_decisions:
- issue: ദൈവവും പൊതുവാചകമായ ἄνθρωπον-വും തമ്മിലുള്ള വിരുദ്ധജോടി
  choice: ദൈവത്തെ ഭയപ്പെടുകയോ മനുഷ്യരെ മാനിക്കുകയോ ചെയ്തിരുന്നില്ല
  alternative: ദൈവത്തെ ഭയപ്പെടുകയോ ആരെയും മാനിക്കുകയോ ചെയ്തിരുന്നില്ല
  rationale: ‘മനുഷ്യരെ’ എന്നത് ദൈവം–മനുഷ്യർ എന്ന മൂലപാഠത്തിലെ വിരുദ്ധത നിലനിർത്തുന്നു; ‘ആരെയും’ അർത്ഥം വ്യക്തമാക്കുന്ന സ്വാഭാവിക പര്യായമാണെങ്കിലും ആ വിരുദ്ധജോടി കുറച്ചുകൂടി മറയ്ക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഒരു പട്ടണത്തിൽ ഒരു ന്യായാധിപൻ’ എന്ന ലളിതമായ കഥാശൈലി നിലനിർത്തി; ആവർത്തിച്ചുള്ള അനിർദിഷ്ടതയെ മലയാളത്തിൽ അസ്വാഭാവികമാകാതെ സൂക്ഷിച്ചു.
