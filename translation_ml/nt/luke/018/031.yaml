id: LUK.18.31
reference: Luke 18:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: ml
  text: 'പിന്നെ പന്ത്രണ്ടുപേരെയും കൂട്ടിക്കൊണ്ട് അവൻ അവരോടു പറഞ്ഞു: “ഇതാ, നാം യെരൂശലേമിലേക്കു കയറിപ്പോകുന്നു. മനുഷ്യപുത്രനെക്കുറിച്ച് പ്രവാചകന്മാർ മുഖാന്തരം എഴുതപ്പെട്ടിരിക്കുന്നതെല്ലാം നിവൃത്തിയാകും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യപുത്രനുവേണ്ടി പ്രവാചകന്മാർ മുഖാന്തരം എഴുതപ്പെട്ടിരിക്കുന്നതെല്ലാം”; ഗ്രീക്ക് വാക്യഘടന ഇങ്ങനെ കൂടുതൽ അക്ഷരാർഥത്തിൽ പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഇവിടെ പ്രവാചകന്മാർ മനുഷ്യപുത്രനെക്കുറിച്ച് എഴുതിയത് എന്നാണ് സാധ്യതയേറിയ അർഥം.
    reason: alternative_reading
lexical_decisions:
- source_word: Παραλαβὼν
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: παραλαμβάνω എന്ന കൃദന്തരൂപം പന്ത്രണ്ടുപേരെ തന്നോടൊപ്പം കൂട്ടിയെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സ്വകാര്യമായ ഉപദേശത്തിന്റെ ഭാവമുണ്ടെങ്കിലും ‘മാറ്റിനിർത്തി’ എന്ന ആശയം മൂലപാഠത്തിൽ വ്യക്തമായി പറഞ്ഞിട്ടില്ല; അതിനാൽ സ്വാഭാവികവും സംയമിതവുമായ ‘കൂട്ടിക്കൊണ്ട്’ തെരഞ്ഞെടുത്തു.
- source_word: τοὺς δώδεκα
  choice: പന്ത്രണ്ടുപേരെയും
  rationale: ‘ശിഷ്യന്മാർ’ എന്നു ചേർക്കാതെ, യേശുവിന്റെ അടുത്ത സംഘത്തിനുള്ള അംഗീകൃത സംജ്ഞയായ ഗ്രീക്കിലെ ‘പന്ത്രണ്ടുപേർ’ അതേപടി നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തി ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀναβαίνομεν
  choice: കയറിപ്പോകുന്നു
  rationale: യെരൂശലേമിലേക്കുള്ള ഭൂമിശാസ്ത്രപരമായ കയറ്റവും വർത്തമാനകാലത്തിന്റെ ആഖ്യാനസജീവതയും സംരക്ഷിക്കുന്നു.
- source_word: Ἰερουσαλήμ
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട ബൈബിൾരൂപം ഉപയോഗിച്ചു.
- source_word: τελεσθήσεται
  choice: നിവൃത്തിയാകും
  rationale: ഭാവികാല കർമണിയുടെ അർഥവും പ്രവചനരചനകൾ ഉദ്ദേശിച്ച പൂർത്തീകരണത്തിലെത്തുമെന്ന ആശയവും മലയാളത്തിലെ പരിചിതവും സ്വാഭാവികവുമായ പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: πάντα τὰ γεγραμμένα
  choice: എഴുതപ്പെട്ടിരിക്കുന്നതെല്ലാം
  rationale: πάντα എന്ന സമഗ്രതയും γεγραμμένα എന്ന സമാപ്തകൃദന്തരൂപം സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന ലിഖിതസ്വഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: διὰ τῶν προφητῶν
  choice: പ്രവാചകന്മാർ മുഖാന്തരം
  rationale: διά + ജനിറ്റീവ് സൂചിപ്പിക്കുന്ന മാധ്യമത്വം/കർതൃത്വം സംരക്ഷിക്കുന്നു; ദൈവം പ്രവാചകന്മാരിലൂടെ സംസാരിച്ചെന്ന ബൈബിൾഭാവത്തിനും യോജിക്കുന്നു.
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രനെക്കുറിച്ച്
  rationale: ഡേറ്റീവ് രൂപത്തെ ഇവിടെ വിഷയസംബന്ധമായി ഗ്രഹിച്ച് സ്വാഭാവിക മലയാളത്തിൽ നൽകി; എന്നാൽ ‘മനുഷ്യപുത്രനുവേണ്ടി/മനുഷ്യപുത്രന്’ എന്ന കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിയുടെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മാനവൻ
  rationale: ഗ്രീക്ക് പദവിയുടെ ഘടനയും ദാനീയേൽ ഗ്രന്ഥത്തോടുള്ള സാധ്യതയുള്ള അന്തർപാഠബന്ധവും ‘മനുഷ്യപുത്രൻ’ സംരക്ഷിക്കുന്നു; പൊതുവായ മാനവസൂചനയായി അതിനെ ചുരുക്കുന്നില്ല.
- issue: τῷ υἱῷ τοῦ ἀνθρώπου എന്ന ഡേറ്റീവിന്റെ ബന്ധം
  choice: മനുഷ്യപുത്രനെക്കുറിച്ച്
  alternative: മനുഷ്യപുത്രനുവേണ്ടി / മനുഷ്യപുത്രന്
  rationale: സന്ദർഭത്തിൽ പ്രവാചകന്മാർ എഴുതിയ കാര്യങ്ങളുടെ വിഷയം മനുഷ്യപുത്രനാണെന്ന വായന ഏറ്റവും സ്വാഭാവികമാണ്. എങ്കിലും ഗ്രീക്ക് ഡേറ്റീവിന്റെ കൂടുതൽ അക്ഷരാർഥസാധ്യത യഥാർഥമായതിനാൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’, ‘നിവൃത്തിയാകും’, ‘മനുഷ്യപുത്രൻ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ പഴഞ്ചൻ വാക്യക്രമം ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട അവ്യക്തതയുള്ള വാക്യാവസാനത്തിൽ നൽകിയിരിക്കുന്നു.
