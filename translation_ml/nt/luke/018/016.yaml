language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരെ തന്റെ അടുക്കൽ വിളിച്ചുകൊണ്ട് പറഞ്ഞു: “കുട്ടികൾ എന്റെ അടുക്കൽ വരട്ടെ; അവരെ തടയരുത്. ദൈവരാജ്യം ഇങ്ങനെയുള്ളവരുടേതാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഇങ്ങനെയുള്ളവരുടേതാകുന്നു ദൈവരാജ്യം.”'
    reason: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയും വാക്യക്രമവും കൂടുതൽ അക്ഷരാർഥത്തിൽ കാണിക്കുന്ന പകരം വിവർത്തനം.
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: അവരെ തന്റെ അടുക്കൽ വിളിച്ചു
  rationale: മധ്യവാചകക്രിയയായ προσεκαλέσατο ഒരാളെ സ്വന്തം അടുക്കലേക്ക് വിളിക്കുക എന്ന ആശയം നൽകുന്നു; αὐτά മുൻസന്ദർഭത്തിലെ കുട്ടികളെ സൂചിപ്പിക്കുന്നു.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: കുട്ടികൾ എന്റെ അടുക്കൽ വരട്ടെ
  rationale: Ἄφετε ഇവിടെ അനുവദിക്കുക എന്ന അർഥമുള്ള കല്പനയാണ്; മലയാളത്തിൽ ‘വരട്ടെ’ അതിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ രൂപമാണ്.
- source_word: μὴ κωλύετε αὐτά
  choice: അവരെ തടയരുത്
  rationale: κωλύω എന്നത് തടയുക, വിലക്കുക, പ്രതിബന്ധമാകുക എന്നീ അർഥങ്ങൾ നൽകുന്നു; ‘തടയരുത്’ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: τῶν ... τοιούτων
  choice: ഇങ്ങനെയുള്ളവരുടേതാണ്
  rationale: τοιοῦτος സന്നിഹിതരായ കുട്ടികളെ മാതൃകയാക്കുന്ന ഒരു വർഗത്തെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആരെല്ലാമാണ് അതിൽ ഉൾപ്പെടുന്നതെന്ന് അധികമായി നിർവചിക്കാതെ ആ വ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണ ക്രൈസ്തവ പ്രയോഗത്തിലും സ്ഥാപിതവും വ്യക്തവുമായ സമാസരൂപം.
theological_decisions:
- issue: τῶν τοιούτων എന്നതിന്റെ വ്യാപ്തി
  choice: സന്നിഹിതരായ കുട്ടികളെ മാത്രം അല്ല, അവരെപ്പോലെയുള്ളവരെയും ഉൾക്കൊള്ളുന്ന ‘ഇങ്ങനെയുള്ളവർ’ എന്ന പ്രയോഗം
  alternative: യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്ന ആ കുട്ടികൾക്കു മാത്രമാണ് ദൈവരാജ്യം ഉള്ളത് എന്ന പരിമിത വായന
  rationale: ഗ്രീക്കിലെ τοιούτων പ്രത്യേക വ്യക്തികളെക്കാൾ അവരാൽ പ്രതിനിധീകരിക്കപ്പെടുന്ന തരത്തിലുള്ളവരെ സൂചിപ്പിക്കുന്നു. എന്നാൽ അവരിലെ ഏത് സവിശേഷതയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് ഈ വാക്യത്തിൽ വിവർത്തനം കൂട്ടിച്ചേർക്കുന്നില്ല.
- issue: τῶν ... ἐστίν എന്ന ബന്ധം
  choice: ‘ഇങ്ങനെയുള്ളവരുടേതാണ്’ എന്ന ഉടമസ്ഥത/ബന്ധസൂചക രൂപം
  alternative: ‘ഇങ്ങനെയുള്ളവരാൽ ദൈവരാജ്യം രൂപപ്പെട്ടിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ഇങ്ങനെയുള്ളവർക്കുവേണ്ടിയാണ് ദൈവരാജ്യം’
  rationale: ജനിറ്റീവ് ഘടനയുടെ സ്വാഭാവിക അർഥം രാജ്യം ഇങ്ങനെയുള്ളവരുമായി ബന്ധപ്പെട്ടതോ അവർക്കുള്ളതോ ആണെന്നതാണ്; അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ സ്വഭാവം കൂടുതൽ നിർണ്ണയിക്കാതെ ഈ രൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘തന്റെ അടുക്കൽ’, ‘എന്റെ അടുക്കൽ’, ‘ദൈവരാജ്യം’ എന്നീ പ്രയോഗങ്ങൾ സ്വാഭാവികമായ ബൈബിൾ ഗൗരവം നിലനിർത്തുന്നു. പ്രധാനവാചകത്തിലെ [a] അടിക്കുറിപ്പ് അടയാളം ബന്ധപ്പെട്ട അവകാശവാക്യത്തിനുശേഷം നൽകിയിരിക്കുന്നു.
