source:
  edition: SBLGNT
  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: ml
  text: അവനെ ചമ്മട്ടികൊണ്ട് അടിച്ചശേഷം അവർ അവനെ കൊല്ലും; മൂന്നാം ദിവസം അവൻ ഉയിർത്തെഴുന്നേൽക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ഉയിർപ്പിക്കപ്പെടും.” ഇവിടെ ഗ്രീക്കിൽ കൂടുതൽ നേരിട്ടുള്ള അർഥം “അവൻ ഉയിർത്തെഴുന്നേൽക്കും” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: ചമ്മട്ടികൊണ്ട് അടിച്ചശേഷം
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ സ്വാഭാവികമായി ‘അടിച്ചശേഷം’ എന്നു നൽകി. ‘ചമ്മട്ടികൊണ്ട്’ എന്നത് പീഡനരീതി വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἀποκτενοῦσιν
  choice: അവർ അവനെ കൊല്ലും
  rationale: ഭാവികാല സജീവ ബഹുവചനത്തിന്റെ ലളിതവും നേരിട്ടുമുള്ള അർഥം; ‘വധിക്കും’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്, ‘കൊലപ്പെടുത്തും’ നൽകാവുന്ന അധിക ധാർമിക ഊന്നൽ ഒഴിവാക്കുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: സന്ദർഭത്തിൽ യേശുവിനെയോ മനുഷ്യപുത്രനെയോ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: മൂന്നാം ദിവസം
  rationale: കാലസൂചനയുടെ സ്വാഭാവികവും പ്രമാണികവുമായ മലയാളരൂപം; മൂലത്തിൽ ഇല്ലാത്ത ‘അതിനു ശേഷം’ പോലുള്ള വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: ἀναστήσεται
  choice: അവൻ ഉയിർത്തെഴുന്നേൽക്കും
  rationale: ഭാവികാല മധ്യരൂപത്തെ ഇവിടെ അകർമകമായി ഗ്രഹിച്ച്, പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ബൈബിൾപ്രയോഗം തിരഞ്ഞെടുത്തു; കർത്താവിനെ വേറെയായി വ്യക്തമാക്കുന്ന കർമണിരൂപം ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: പുനരുത്ഥാനത്തിന്റെ ക്രിയാരൂപം
  choice: അവൻ ഉയിർത്തെഴുന്നേൽക്കും
  alternative: അവൻ ഉയിർപ്പിക്കപ്പെടും
  rationale: ഗ്രീക്കിലെ ἀναστήσεται ഇവിടെ നേരിട്ട് ‘അവൻ എഴുന്നേൽക്കും/ഉയിർത്തെഴുന്നേൽക്കും’ എന്ന അകർമക അർഥം നൽകുന്നു. ‘ഉയിർപ്പിക്കപ്പെടും’ എന്നത് മറ്റു വേദഭാഗങ്ങളിലെ ദൈവശാസ്ത്രവുമായി യോജിക്കുന്നുവെങ്കിലും, ഈ വാക്യത്തിലെ രൂപത്തെക്കാൾ വ്യക്തമായ കർമണിവായനയാണ്; അതിനാൽ അത് അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ ലളിതവും മാന്യവും നേരിട്ടുമുള്ള ശൈലി. ‘ചമ്മട്ടികൊണ്ട് അടിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ഉയിർത്തെഴുന്നേൽക്കും’ പുനരുത്ഥാനസന്ദർഭത്തിൽ സ്വാഭാവികവും ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം അനാവശ്യമായി തീർപ്പാക്കാത്തതുമാണ്.
