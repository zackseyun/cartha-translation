id: LUK.18.6
reference: Luke 18:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: ml
  text: 'അപ്പോൾ കർത്താവ് പറഞ്ഞു: “അനീതിയുള്ള ന്യായാധിപൻ പറയുന്നത് കേൾക്കൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ aorist രൂപം കഥനത്തിലെ ലളിതമായ ഭൂതകാല പ്രസ്താവനയായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: കഥനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന δέ-യുടെ ബന്ധകശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; കർശനമായ കാലക്രമം ഇതിലൂടെ നിർബന്ധിക്കുന്നില്ല.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: ലൂക്കോസിന്റെ കഥനത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന ബഹുമാനപദവും ഭാരമുള്ള ശീർഷകവുമായ κύριος-ന്റെ പതിവായ മലയാളരൂപം.
- source_word: Ἀκούσατε
  choice: കേൾക്കൂ
  rationale: ἀκούω എന്ന ക്രിയയുടെ aorist imperative-ന്റെ ശ്രദ്ധാപൂർവം കേൾക്കാനുള്ള ആജ്ഞാഭാവം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τί
  choice: പറയുന്നത്
  rationale: ന്യായാധിപന്റെ വാക്കുകളുടെ ഉള്ളടക്കത്തെയാണ് τί സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ‘പറയുന്നത് കേൾക്കൂ’ എന്ന ഘടന ‘what ... says’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ κριτὴς
  choice: ന്യായാധിപൻ
  rationale: മുമ്പത്തെ ഉപമയിൽ പരാമർശിച്ച വിധികർത്താവിനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമപ്രയോഗം.
- source_word: τῆς ἀδικίας
  choice: അനീതിയുള്ള
  rationale: ‘അനീതിയുടെ ന്യായാധിപൻ’ എന്ന അക്ഷരാർഥത്തിലുള്ള ഗുണസൂചക genitive മലയാളത്തിൽ സ്വാഭാവികമായ നൈതിക വിശേഷണമായി നൽകുന്നു; നിയമപരമായ പക്ഷപാതത്തിൽ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: λέγει
  choice: പറയുന്നത്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലത്തിന്റെ സജീവത മലയാളത്തിലെ നാമീകൃത വർത്തമാനപ്രയോഗത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ സൂചിപ്പിക്കുന്ന κύριος-ന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഈ സന്ദർഭത്തിൽ പദം യേശുവിനുള്ള ശീർഷകഭാരം വഹിക്കുന്നു; ‘യജമാനൻ’ എന്ന് നൽകിയാൽ സാമൂഹികബന്ധത്തിന്റെ അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുങ്ങാം.
- issue: τῆς ἀδικίας എന്ന ഗുണസൂചക genitive
  choice: അനീതിയുള്ള ന്യായാധിപൻ
  alternative: അനീതിയുടെ ന്യായാധിപൻ
  rationale: മൂലത്തിലെ നൈതിക വിലയിരുത്തൽ നിലനിർത്തിക്കൊണ്ട് ആ പദഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ന്യായാധിപൻ അനീതിയുടെ ഉടമയോ പ്രതിനിധിയോ ആണെന്ന അസ്വാഭാവിക ധ്വനി ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉപമയിലേക്കുള്ള കഥനബന്ധവും യേശുവിന്റെ നേരിട്ടുള്ള ആജ്ഞാഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തിയിരിക്കുന്നു.
