  yaml_path: translation/nt/luke/018/021.yaml
  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഇവയെല്ലാം ഞാൻ എന്റെ ചെറുപ്പം മുതൽ പാലിച്ചിട്ടുണ്ട്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, സന്ദർഭം കൂടുതൽ വ്യക്തമാക്കിക്കൊണ്ട്, “ഈ കല്പനകളെല്ലാം.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ഇവയെല്ലാം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: അവൻ പറഞ്ഞു
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേകം ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായി ആഖ്യാനം തുടരുന്നു.
- source_word: Ταῦτα πάντα
  choice: ഇവയെല്ലാം
  rationale: ഗ്രീക്കിൽ ‘കല്പനകൾ’ എന്ന നാമം വ്യക്തമാക്കിയിട്ടില്ല; മുൻവാക്യത്തിൽനിന്ന് അത് സന്ദർഭപരമായി മനസ്സിലാകുന്നതിനാൽ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: ἐφύλαξα
  choice: പാലിച്ചുപോന്നിട്ടുണ്ട്
  rationale: φυλάσσω ഇവിടെ കല്പനകൾ അനുസരിച്ച് പാലിക്കുക എന്ന അർഥത്തിലാണ്. ഗ്രീക്ക് എയോറിസ്റ്റ് രൂപമായിരുന്നാലും, ചെറുപ്പംമുതൽ ഇപ്പോൾവരെയുള്ള അവകാശവാദം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ഈ രൂപം യോജിക്കുന്നു.
- source_word: ἐκ νεότητος μου
  choice: എന്റെ ചെറുപ്പംമുതൽ
  rationale: ἐκ കാലത്തിലെ ആരംഭബിന്ദുവിനെ സൂചിപ്പിക്കുന്നു; νεότης എന്നത് ഇവിടെ ‘ചെറുപ്പം’ എന്ന് സ്വാഭാവികവും കൃത്യവുമായി പരിഭാഷപ്പെടുത്താം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ‘പാലിച്ചുപോന്നിട്ടുണ്ട്’ എന്ന പ്രയോഗം തുടർച്ചയുള്ള ജീവിതാവകാശവാദം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സൂചിതമായ ‘കല്പനകൾ’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
