  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യെരീഹോ’ എന്ന പരിചിതമായ മലയാള ബൈബിൾ സ്ഥലനാമരൂപം നിലനിർത്തി; ഗ്രീക്കിന്റെ അപൂർണകാല ദൃശ്യവിവരണം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
