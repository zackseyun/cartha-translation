reference: Luke 18:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: ml
  text: 'യേശു അവനെ കണ്ടിട്ട് പറഞ്ഞു: “സമ്പത്തുള്ളവർ ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നത് എത്ര പ്രയാസമാണ്!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ αὐτὸν ὁ Ἰησοῦς εἶπεν
  choice: യേശു അവനെ കണ്ടിട്ട് പറഞ്ഞു
  rationale: Ἰδών എന്ന aorist participle-ന്റെ മുൻകാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ ‘കണ്ടിട്ട്’ എന്നു നൽകി; δέ ഇവിടെ ലഘുവായ ആഖ്യാനബന്ധകമായതിനാൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ വാക്യപ്രവാഹത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: Πῶς δυσκόλως
  choice: എത്ര പ്രയാസമാണ്
  rationale: പ്രയാസത്തിന്റെ തീവ്രത പ്രകടിപ്പിക്കുന്ന ആശ്ചര്യോക്തിപരമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: സമ്പത്തുള്ളവർ
  rationale: χρήματα പണം മാത്രമല്ല, സ്വത്തും സമ്പത്തും ഉൾക്കൊള്ളാം; അതിനാൽ സന്ദർഭത്തിൽ വിശാലവും സ്വാഭാവികവുമായ ‘സമ്പത്ത്’ തിരഞ്ഞെടുത്തു.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται
  choice: ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നത്
  rationale: ഉറവിടത്തിലെ ‘ദൈവത്തിന്റെ രാജ്യം’ എന്ന ആശയം മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ ‘ദൈവരാജ്യം’ എന്ന രൂപത്തിൽ നൽകി; εἰσπορεύονται-യുടെ പ്രവേശനാർഥം വ്യക്തമായി സൂക്ഷിച്ചു.
theological_decisions:
- issue: സമ്പത്തുള്ളവർ ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നതിനെക്കുറിച്ചുള്ള വാക്കിന്റെ ശക്തി
  choice: പ്രവേശനം വളരെ പ്രയാസമാണെന്ന പൊതുപ്രസ്താവന
  alternative: സമ്പത്തുള്ളവർക്ക് പ്രവേശനം തികച്ചും അസാധ്യമാണെന്ന പ്രസ്താവന
  rationale: ഗ്രീക്ക് വാചകം ‘പ്രയാസം’ എന്നാണ് പറയുന്നത്; ഈ വാക്യം മാത്രം പറയുന്നതിനെ ‘അസാധ്യം’ എന്ന് ശക്തിപ്പെടുത്താതെ അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സമ്പത്തുള്ളവർ’ എന്നത് പണം മാത്രം സൂചിപ്പിക്കാതെ സ്വത്തുസമ്പത്തിന്റെ വിശാല അർഥം നൽകുന്നു.
