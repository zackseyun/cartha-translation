id: LUK.18.8
reference: Luke 18:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളോടു പറയുന്നു: അവിടുന്ന് അവർക്കുവേണ്ടി വേഗത്തിൽ നീതി നടപ്പാക്കും[a]. എന്നിരുന്നാലും, മനുഷ്യപുത്രൻ വരുമ്പോൾ ഭൂമിയിൽ ശരിക്കും വിശ്വാസം കണ്ടെത്തുമോ[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർക്കു നീതി നൽകും” അല്ലെങ്കിൽ “അവരുടെ പക്ഷം ന്യായീകരിക്കും.” ഗ്രീക്ക് പ്രയോഗത്തിന് ഒരാൾക്കുവേണ്ടി നീതി നടപ്പാക്കുക അല്ലെങ്കിൽ നിയമപരമായി അയാളുടെ പക്ഷം ന്യായീകരിക്കുക എന്ന അർത്ഥമുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: “വിശ്വാസം” എന്നതിനുപകരം “വിശ്വസ്തത” അല്ലെങ്കിൽ “ആശ്രയവിശ്വാസം” എന്നും അർത്ഥമാകാം. ഗ്രീക്ക് പദത്തിന് വിശ്വാസം, ആശ്രയം, വിശ്വസ്തത എന്നീ അർത്ഥസാധ്യതകളുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: അവർക്കു നീതി ലഭിക്കുമാറ് അവിടുന്ന് പ്രവർത്തിക്കും
  rationale: വിധവയ്ക്ക് ന്യായപരിഹാരം ലഭിക്കുന്ന സന്ദർഭത്തിൽ ἐκδίκησις എന്നത് പ്രതികാരത്തേക്കാൾ നീതി നടപ്പാകുന്നതോ ന്യായസ്ഥാപനം ലഭിക്കുന്നതോ സൂചിപ്പിക്കുന്നു. αὐτῶν എന്നത് നീതി ലഭിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: ἐν τάχει
  choice: വേഗത്തിൽ
  rationale: പ്രവർത്തനം ശീഘ്രമായി, താമസമില്ലാതെ നടക്കുമെന്ന ആശയം നിലനിർത്തുന്നു; നിർബന്ധമായും 'ഉടൻ' എന്ന കാലക്രമപ്രവചനം ചുമത്തുന്നില്ല.
- source_word: πλὴν
  choice: എന്നിരുന്നാലും
  rationale: മുൻപ്രസ്താവനയും തുടർന്നുള്ള അന്വേഷണാത്മക ചോദ്യവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണവും ദാനിയേൽ 7-ലെ പശ്ചാത്തലവും സംരക്ഷിക്കുന്ന സ്ഥാപിതമായ ബൈബിൾ പ്രയോഗം.
- source_word: ἐλθὼν
  choice: വരുമ്പോൾ
  rationale: പ്രധാനക്രിയയായ 'കണ്ടെത്തുമോ' എന്നതിനോടുള്ള കാലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἆρα
  choice: ചോദ്യത്തിന്റെ അന്വേഷണാത്മക ഭാവത്തിലൂടെ പ്രകടിപ്പിച്ചു
  rationale: ἆρα ചോദ്യത്തിന് ആലോചനാപരവും സംശയോന്മുഖവുമായ ഊന്നൽ നൽകുന്നു. മലയാളത്തിൽ പ്രത്യേകമായി 'ശരിക്കും' ചേർക്കുന്നത് അനാവശ്യമായ അർത്ഥഭാരം നൽകാൻ ഇടയുള്ളതിനാൽ ചോദ്യഘടനയിലൂടെ അതിന്റെ പ്രാബല്യം നിലനിർത്തി.
- source_word: τὴν πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ വിശ്വാസം, ആശ്രയം, വിശ്വസ്തത എന്നീ അർത്ഥസാധ്യതകൾ അനാവശ്യമായി ചുരുക്കാതെ വിശാലമായ മുഖ്യപരിഭാഷ തിരഞ്ഞെടുക്കുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: അന്ത്യകാലപരമായ പ്രസ്താവനയുടെ വിശാല വ്യാപ്തിക്ക് യോജിക്കുന്ന സ്വാഭാവിക മലയാളം; 'ദേശത്ത്' എന്ന കൂടുതൽ പരിമിതമായ സാധ്യത ഇവിടെ മുൻഗണിച്ചിട്ടില്ല.
theological_decisions:
- issue: πίστις എന്നത് വിശ്വാസമോ വിശ്വസ്തതയോ ആശ്രയമോ എന്ന അർത്ഥവ്യാപ്തി
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: മുഖ്യപാഠത്തിൽ ഗ്രീക്ക് പദത്തിന്റെ വിശാലത സംരക്ഷിക്കാൻ 'വിശ്വാസം' ഉപയോഗിച്ചു. നിലച്ചുപോകാത്ത പ്രാർഥനയിലൂടെ പ്രകടമാകുന്ന ആശ്രയമോ വിശ്വസ്തതയോ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ 'അവിടുന്ന്' ഉപയോഗിച്ചു. നിയമസന്ദർഭം വ്യക്തമാക്കാൻ പ്രതികാരധ്വനി കുറഞ്ഞ 'നീതി ലഭിക്കുമാറ് പ്രവർത്തിക്കും' തെരഞ്ഞെടുത്തു; മൂലത്തിലെ അന്വേഷണാത്മകവും ദൈവശാസ്ത്രപരമായി തുറന്നതുമായ അവസാനചോദ്യം അതേപടി നിലനിർത്തി.
