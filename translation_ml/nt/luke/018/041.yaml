  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: ml
  text: '“ഞാൻ നിനക്കുവേണ്ടി എന്തു ചെയ്യണമെന്നാണ് നീ ആഗ്രഹിക്കുന്നത്?” അവൻ പറഞ്ഞു: “കർത്താവേ[a], എനിക്ക് വീണ്ടും കാഴ്ച ലഭിക്കണമേ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യജമാനനേ” അല്ലെങ്കിൽ ആദരസൂചകമായി “സാർ”; ഗ്രീക്കിലെ κύριε ആദരപൂർവമായ ഒരു സംബോധനയായിരിക്കാം, എങ്കിലും ഈ പദ്ധതിയിൽ κύριος സാധാരണയായി “കർത്താവ്” എന്നാണ് പരിഭാഷപ്പെടുത്തുന്നത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “എന്റെ കാഴ്ച എനിക്കു വീണ്ടുകിട്ടണമേ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: എന്തു
  rationale: യേശു അയാളുടെ നിർദിഷ്ടമായ അപേക്ഷ എന്താണെന്നു ചോദിക്കുന്നതിനാൽ കാരണാർഥമായ ‘എന്തുകൊണ്ട്’ എന്നതല്ല, ചോദ്യംചെയ്യുന്ന സർവനാമമായ ‘എന്തു’ ആണ് സ്വാഭാവികം.
- source_word: σοι
  choice: നിനക്കുവേണ്ടി
  rationale: ποιήσω എന്ന ക്രിയയോടുള്ള ദത്തിവ് ഗുണഭോക്താവിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘നിനക്കുവേണ്ടി’ എന്നത് ഈ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: θέλεις
  choice: നീ ആഗ്രഹിക്കുന്നത്
  rationale: θέλω ഇച്ഛയെയോ ആഗ്രഹത്തെയോ സൂചിപ്പിക്കുന്നു; ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘എന്തു ചെയ്യണമെന്നാണ് നീ ആഗ്രഹിക്കുന്നത്?’ എന്നു നൽകി.
- source_word: ποιήσω
  choice: ഞാൻ ... ചെയ്യണമെന്ന്
  rationale: θέλεις-നോടു ചേർന്ന aorist subjunctive, സംസാരിക്കുന്നയാൾ എന്തു ചെയ്യണമെന്നാണ് അഭിസംബോധിതൻ ആഗ്രഹിക്കുന്നതെന്ന ആശയം നൽകുന്നു.
- source_word: ὁ δὲ εἶπεν
  choice: അവൻ പറഞ്ഞു
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, ലഘുവായ ആഖ്യാനബന്ധമാണ്; മലയാളത്തിൽ പ്രത്യേക സംയോജകം ചേർക്കാതിരിക്കുന്നത് സ്വാഭാവികമായ ഒഴുക്ക് നൽകുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്നതിനുള്ള പദ്ധതിയുടെ പതിവ് പരിഭാഷ നിലനിർത്തുന്നു; ആദരസംബോധനയും കൂടുതൽ ക്രിസ്തുശാസ്ത്രപരമായ സൂചനയും തമ്മിലുള്ള തുറന്ന അർഥസാധ്യത സംരക്ഷിക്കുന്നു.
- source_word: ἵνα
  choice: '...ണമേ'
  rationale: ഇവിടെ ἵνα അപേക്ഷയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ വിനയപൂർവമായ അഭ്യർഥനാരൂപം അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀναβλέψω
  choice: എനിക്ക് വീണ്ടും കാഴ്ച ലഭിക്കണമേ
  rationale: രോഗശാന്തിയുടെ സന്ദർഭത്തിൽ ἀναβλέπω കാഴ്ച വീണ്ടെടുക്കുക എന്ന അർഥം നൽകുന്നു; ‘വീണ്ടും കാഴ്ച ലഭിക്കുക’ ലളിതവും വ്യക്തവുമാണ്.
theological_decisions:
- issue: യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: യജമാനനേ / അങ്ങുന്നേ
  rationale: ‘കർത്താവേ’ ആദരസംബോധനയെന്ന സാധ്യതയും യേശുവിനെക്കുറിച്ചുള്ള കൂടുതൽ ആഴമുള്ള അംഗീകാരമെന്ന സാധ്യതയും ഒരുപോലെ തുറന്നുവയ്ക്കുന്നു; വെറും മര്യാദാസംബോധനയായി അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ചോദ്യം സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ നൽകി; മറുപടിയിൽ അപേക്ഷയുടെ വിനയവും സംക്ഷിപ്തതയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
