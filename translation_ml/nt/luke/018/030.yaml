id: LUK.18.30
reference: Luke 18:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: ml
  text: അവൻ തീർച്ചയായും ഈ കാലത്ത് അനേകമടങ്ങും, വരാനിരിക്കുന്ന യുഗത്തിൽ നിത്യജീവനും പ്രാപിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: അയാൾ
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച വ്യക്തിയിലേക്കു തിരിച്ചുചൂണ്ടുന്ന ബന്ധസർവനാമമാണിത്. മലയാളത്തിൽ ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ സ്വാഭാവികമായ തുടർച്ച ലഭിക്കാൻ ‘അയാൾ’ ഉപയോഗിച്ചു.
- source_word: οὐχὶ μὴ
  choice: തീർച്ചയായും
  rationale: ആവർത്തിത നിഷേധം ഇവിടെ ശക്തമായ ഉറപ്പാണ് പ്രകടിപ്പിക്കുന്നത്. മലയാളത്തിൽ അസ്വാഭാവികമായ ഇരട്ടനിഷേധം പകർത്താതെ അതിന്റെ ഊന്നൽ ‘തീർച്ചയായും’ എന്നു നൽകി.
- source_word: ἀπολάβῃ
  choice: പ്രാപിക്കും
  rationale: ലഭിക്കുക, തിരികെ ലഭിക്കുക, പ്രതിഫലമായി നേടുക എന്നീ അർഥസാധ്യതകൾ സന്ദർഭത്തിലുണ്ട്. ഇക്കാലത്തെ അനേകമടങ്ങുള്ള പ്രതിഫലത്തിനും വരാനിരിക്കുന്ന യുഗത്തിലെ നിത്യജീവനും ഒരുപോലെ ചേരുന്ന dignified Malayalam ആയി ‘പ്രാപിക്കും’ തിരഞ്ഞെടുത്തു.
- source_word: πολλαπλασίονα
  choice: അനേകമടങ്ങും
  rationale: അളവിൽ പെരുകിയ പ്രതിഫലം എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: ഈ കാലത്ത്
  rationale: നിലവിലെ നിർദിഷ്ട സമയത്തെ വരാനിരിക്കുന്ന യുഗത്തോടു വേർതിരിക്കുന്ന പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: വരാനിരിക്കുന്ന യുഗത്തിൽ
  rationale: ഇപ്പോഴത്തെ കാലവും ഭാവിയിലെ യുഗവും തമ്മിലുള്ള പുതിയനിയമത്തിലെ യുഗപരമായ വൈരുധ്യം ‘ഭാവിയിൽ’ എന്നു പരത്താതെ സൂക്ഷിക്കുന്നു.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപ്രയോഗം; അവസാനമില്ലാത്ത ജീവിതവും വരാനിരിക്കുന്ന യുഗവുമായി ബന്ധപ്പെട്ട ജീവനും ഉൾക്കൊള്ളുന്ന ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: αἰῶνι τῷ ἐρχομένῳ എന്ന യുഗാന്ത്യപ്രയോഗം
  choice: വരാനിരിക്കുന്ന യുഗത്തിൽ
  alternative: വരുവാനുള്ള യുഗത്തിൽ
  rationale: വെറും ഭാവികാലസൂചനയായി ചുരുക്കാതെ ഇപ്പോഴത്തെ യുഗവും വരാനിരിക്കുന്ന യുഗവും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- issue: ഇക്കാലത്തെ പ്രതിഫലവും വരാനിരിക്കുന്ന യുഗത്തിലെ നിത്യജീവനും തമ്മിലുള്ള ബന്ധം
  choice: ഒരേ ക്രിയയുടെ കീഴിൽ രണ്ടും സമാന്തരമായി അവതരിപ്പിച്ചു
  alternative: നിത്യജീവനെ വേറൊരു സ്വതന്ത്ര വാഗ്ദാനവാക്യമായി അവതരിപ്പിക്കുക
  rationale: ഗ്രീക്കിൽ ἀπολάβῃ എന്ന ഒരേയൊരു ക്രിയ πολλαπλασίονα, ζωὴν αἰώνιον എന്നീ രണ്ടു കർമങ്ങളെയും നിയന്ത്രിക്കുന്നു; ആ ഘടനയും അതിലെ ദൈവശാസ്ത്രപരമായ ബന്ധവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് മുഖ്യപാഠത്തിൽ ഇതിനകം ഉപയോഗിച്ചിരിക്കുന്ന അതേ അർഥം മാത്രം ആവർത്തിക്കുന്നതിനാൽ, ഗ്രീക്ക് സ്രോതസ്സിൽ പാഠഭേദമോ വേറിട്ട അർഥസാധ്യതയോ ഇല്ലാത്ത സാഹചര്യത്തിൽ അനാവശ്യ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
