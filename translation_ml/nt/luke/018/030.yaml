  naturalness: നിലവിലെ പദക്രമത്തിൽ ‘ഈ കാലത്ത് അനേകമടങ്ങും വരാനിരിക്കുന്ന യുഗത്തിൽ നിത്യജീവനും’ എന്ന ഭാഗം ഇടവേളകളില്ലാതെ വായിക്കുമ്പോൾ ഘടകങ്ങളുടെ സമാന്തരത ഉടൻ വ്യക്തമല്ല. ക്രിയയ്ക്കുശേഷം വരുന്ന ഉറപ്പുസൂചകം ഒഴിവാക്കി, രണ്ടു കാലസൂചനകളും സമാന്തരമായി ക്രമീകരിക്കുന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്.
