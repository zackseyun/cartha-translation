  to: 'അതു കേട്ടവർ പറഞ്ഞു: “അപ്പോൾ ആർക്കാണ് രക്ഷിക്കപ്പെടാൻ കഴിയുക?”'
  rationale: The revision changes only the reporting verb from ‘ചോദിച്ചു’ to ‘പറഞ്ഞു’ for closer fidelity to Εἶπαν. It retains the natural Malayalam construction for ‘who can be saved?’ and the contextual salvation terminology.
