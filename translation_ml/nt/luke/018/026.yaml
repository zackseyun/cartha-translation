id: LUK.18.26
reference: Luke 18:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἶπαν δὲ οἱ ἀκούσαντες· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/026.yaml
  text: Then those who heard it said, “And who can be saved?”
translation:
  language: ml
  text: 'അതു കേട്ടവർ പറഞ്ഞു: “അപ്പോൾ ആർക്കാണ് രക്ഷിക്കപ്പെടാൻ കഴിയുക?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: ചോദിച്ചു
  rationale: വാചികമായി ‘പറഞ്ഞു’ എന്നാണെങ്കിലും പിന്നാലെയുള്ളത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്ന് നൽകുന്നത് പ്രസംഗക്രിയയുടെ ഉദ്ദേശ്യം കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: വാക്യക്രമത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: δέ മുൻവാക്യത്തോടുള്ള പ്രതികരണപരമായ കഥാപുരോഗതി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വേറൊരു പദം ചേർക്കാതെ ‘അതു കേട്ടവർ ചോദിച്ചു’ എന്ന ക്രമം ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἱ ἀκούσαντες
  choice: അതു കേട്ടവർ
  rationale: നാമവൽക്കരിച്ച ഭൂതകാല കൃദന്തം കേട്ട ആളുകളെ സൂചിപ്പിക്കുന്നു; മുൻപറഞ്ഞ യേശുവിന്റെ വാക്കുകളാണ് കേട്ടതെന്ന സന്ദർഭസൂചന ‘അതു’ വഴി വ്യക്തമാക്കുന്നു.
- source_word: Καὶ
  choice: എങ്കിൽ
  rationale: ചോദ്യത്തിന്റെ തുടക്കത്തിലെ καί മുൻപ്രസ്താവനയോടുള്ള അമ്പരപ്പോടുകൂടിയ തുടർച്ചയാണ്; മലയാളത്തിൽ ‘എങ്കിൽ’ ആ പ്രതികരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു, പുതിയ നിഗമനം ചേർക്കാതെ.
- source_word: τίς
  choice: ആർക്ക്
  rationale: ഗ്രീക്കിൽ τίς കർത്തൃരൂപത്തിലാണെങ്കിലും σωθῆναι എന്ന കർമണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആർക്ക് രക്ഷിക്കപ്പെടാൻ കഴിയും?’ എന്ന ശേഷി-നിർമാണത്തിൽ ദാതൃരൂപം ആവശ്യപ്പെടുന്നു.
- source_word: δύναται
  choice: കഴിയും
  rationale: കഴിവിനെയോ സാധ്യതയെയോ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല ക്രിയയ്ക്ക് സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: σωθῆναι
  choice: രക്ഷിക്കപ്പെടാൻ
  rationale: കർമണി അനന്തക്രിയയുടെ രൂപവും, ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നതിനെക്കുറിച്ചുള്ള സന്ദർഭത്തിലെ രക്ഷാസംബന്ധമായ അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: σωθῆναι എന്നതിന്റെ സന്ദർഭാർഥം
  choice: രക്ഷിക്കപ്പെടാൻ
  alternative: വിടുവിക്കപ്പെടാൻ
  rationale: ചുറ്റുപാടുള്ള ഭാഗം ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നതും ധനവാന്റെ രക്ഷയുടെ പ്രയാസവും സംബന്ധിച്ചതാകയാൽ പൊതുവായ അപകടമോചനത്തേക്കാൾ രക്ഷാസംബന്ധമായ അർഥമാണ് പ്രധാനം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ആർക്ക് … കഴിയും?’ എന്നത് മലയാളത്തിലെ സ്വാഭാവിക ശേഷിപ്രയോഗമാണ്; ‘രക്ഷിക്കപ്പെടാൻ’ എന്ന കർമണിരൂപം മൂലപാഠത്തിലെ σωθῆναιയുടെ സ്വരൂപവും ദൈവിക പ്രവർത്തനത്തിന്റെ തുറന്ന സൂചനയും സംരക്ഷിക്കുന്നു.
