id: LUK.18.9
reference: Luke 18:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: ml
  text: തങ്ങൾ നീതിമാന്മാരാണെന്ന് തങ്ങളിൽത്തന്നെ ഉറച്ചു വിശ്വസിക്കുകയും മറ്റുള്ളവരെ നിസ്സാരരായി കാണുകയും ചെയ്ത ചിലരോട് അദ്ദേഹം ഈ ഉപമയും പറഞ്ഞു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മറ്റുള്ളവരെ അവജ്ഞയോടെ കാണുകയും’ / ‘മറ്റുള്ളവരെ താഴ്ത്തിക്കാണുകയും.’
    reason: ἐξουθενοῦντας എന്ന പദത്തിന്റെ ‘വിലയില്ലാത്തവരായി കരുതുക, അവജ്ഞയോടെ കാണുക’ എന്നീ അർഥഭാവങ്ങൾ സൂചിപ്പിക്കുന്ന പദാന്തരങ്ങൾ.
lexical_decisions:
- source_word: Εἶπεν
  choice: അദ്ദേഹം ... പറഞ്ഞു
  rationale: λέγω എന്നതിന് ‘പറയുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ട്; ‘ഈ ഉപമ പറഞ്ഞു’ എന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും ആഖ്യാനസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: δὲ
  choice: വാക്യക്രമത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഇവിടെ δέ ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; പ്രത്യേക മലയാളപദം ചേർത്താൽ അനാവശ്യമായ വൈരുധ്യമോ കാലക്രമമോ സൂചിപ്പിക്കാം.
- source_word: καὶ
  choice: ഈ ഉപമയും
  rationale: ക്രിയയോടു ചേർന്നുള്ള καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം മലയാളത്തിൽ ‘ഉപമയും’ എന്ന പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πρός τινας
  choice: ചിലരോട്
  rationale: സംസാരക്രിയയ്ക്കുശേഷം πρός വ്യക്തികളെ അഭിസംബോധന ചെയ്യുന്നവരായി സൂചിപ്പിക്കുന്നു.
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: സ്വയം ആശ്രയിക്കുകയും
  rationale: πεποιθότας സ്ഥിരമായ ആത്മവിശ്വാസാവസ്ഥയെയും ἐφ’ ἑαυτοῖς അതിന്റെ ആധാരം തങ്ങൾ തന്നെയാണെന്നും സൂചിപ്പിക്കുന്നു; ‘സ്വയം ആശ്രയിക്കുക’ സ്വാശ്രയത്തിന്റെ ഈ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: തങ്ങൾ നീതിമാന്മാരാണെന്ന്
  rationale: δίκαιοιയുടെ ധാർമിക-മതപരമായ അർഥവും അവരുടെ സ്വയംവിലയിരുത്തലും നിലനിർത്തുന്നു; വിമർശനഭാവം സന്ദർഭത്തിൽനിന്ന് വരാൻ അനുവദിക്കുന്നു.
- source_word: ἐξουθενοῦντας
  choice: നിസ്സാരരായി കാണുകയും
  rationale: ἐξουθενέω മറ്റുള്ളവരെ വിലയില്ലാത്തവരെന്നു കണക്കാക്കുക, അവജ്ഞയോടെ കാണുക എന്ന ഭാവം വഹിക്കുന്നു; ഈ തിരഞ്ഞെടുപ്പ് ആ വിലയിരുത്തൽഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοὺς λοιπούς
  choice: മറ്റുള്ളവരെ
  rationale: λοιποί ഇവിടെ സ്വന്തം കൂട്ടത്തിന് പുറത്തുള്ള ‘ശേഷിച്ചവരെ/മറ്റുള്ളവരെ’ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മറ്റുള്ളവരെ’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: τὴν παραβολὴν ταύτην
  choice: ഈ ഉപമ
  rationale: സുവിശേഷങ്ങളിലെ παραβολήയ്ക്ക് സ്ഥിരവും കൃത്യവുമായ മലയാളപദം ‘ഉപമ’ ആണ്.
theological_decisions:
- issue: സ്വനീതിയുടെ സന്ദർഭത്തിൽ δίκαιοι പരിഭാഷപ്പെടുത്തൽ
  choice: നീതിമാന്മാർ
  alternative: ശരിയായ നിലയിലുള്ളവർ / ന്യായമുള്ളവർ
  rationale: ഗ്രീക്ക് പദം തന്നെ നിന്ദാസൂചകമല്ല. ‘നീതിമാന്മാർ’ എന്നത് പ്രധാന ദൈവശാസ്ത്രപരമായ പദാവലി നിലനിർത്തുകയും അവരുടെ അവകാശവാദത്തിലെ വിമർശനവും വിരോധാഭാസവും സന്ദർഭത്തിന് വിടുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നീതിമാന്മാർ’, ‘ഉപമ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ദുഷ്കരമായ സംസ്കൃതാഭിമുഖ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
