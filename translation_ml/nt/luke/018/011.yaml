id: LUK.18.11
reference: Luke 18:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: ml
  text: 'പരീശൻ ഒറ്റയ്ക്കു നിന്നുകൊണ്ട്[a] ഇങ്ങനെ പ്രാർഥിച്ചുകൊണ്ടിരുന്നു: ‘ദൈവമേ, ഞാൻ മറ്റുള്ള മനുഷ്യരെപ്പോലെ—പിടിച്ചുപറിക്കാർ, അനീതിമാന്മാർ, വ്യഭിചാരികൾ—അല്ലാത്തതിനാലും, ഈ നികുതിപിരിവുകാരനെപ്പോലെപ്പോലും അല്ലാത്തതിനാലും ഞാൻ അങ്ങേക്കു നന്ദി പറയുന്നു.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിന്നുകൊണ്ട് തന്നോടുതന്നെ ഇങ്ങനെ പ്രാർഥിച്ചുകൊണ്ടിരുന്നു.’ πρὸς ἑαυτόν എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് അവൻ ഒറ്റയ്ക്കു നിന്നു എന്നോ, ഒരർഥത്തിൽ അവന്റെ പ്രാർഥന തന്നോടുതന്നെയായിരുന്നു എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: നിന്ന്
  rationale: ἵστημι എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം പ്രാർഥനയ്ക്കിടയിലെ ശരീരനിലയെ സാഹചര്യപരമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിന്ന്’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: πρὸς ἑαυτὸν
  choice: മറ്റുള്ളവരിൽനിന്ന് മാറിനിന്ന്
  rationale: പ്രയോഗത്തിന്റെ സ്ഥലപരമായ അർഥം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘തന്നോടുതന്നെ’ എന്ന പ്രതിഫലനാത്മക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ταῦτα
  choice: ഇങ്ങനെ
  rationale: തുടർന്ന് വരുന്ന പ്രാർഥനയുടെ ഉള്ളടക്കത്തിലേക്കു സ്വാഭാവികമായി വിരൽചൂണ്ടുന്നു. അക്ഷരാർഥമായ ‘ഈ കാര്യങ്ങൾ’ മലയാളത്തിൽ ഇവിടെ കൃത്രിമമായി തോന്നും.
- source_word: προσηύχετο
  choice: പ്രാർഥിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപത്തിലെ തുടരുന്ന പ്രവൃത്തിയുടെ ഭാവം മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: εὐχαριστῶ σοι
  choice: ഞാൻ അങ്ങേക്കു നന്ദി പറയുന്നു
  rationale: ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് യോജിച്ച, ആധുനികവും ആദരസൂചകവുമായ മലയാളപ്രയോഗം.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: മറ്റുള്ള മനുഷ്യരെപ്പോലെ
  rationale: λοιποί സൂചിപ്പിക്കുന്ന ‘ശേഷമുള്ള/മറ്റുള്ള’ എന്ന താരതമ്യവും ἄνθρωποι എന്നതിന്റെ പൊതുവായ മനുഷ്യസൂചനയും ലളിതമായി നൽകുന്നു.
- source_word: ἅρπαγες
  choice: പിടിച്ചുപറിക്കാർ
  rationale: ബലപ്രയോഗത്തിലൂടെയോ ചൂഷണത്തിലൂടെയോ മറ്റുള്ളവരുടെത് കൈക്കലാക്കുന്നവരെ സൂചിപ്പിക്കുന്ന ἅρπαξ എന്ന പദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἄδικοι
  choice: അനീതിമാന്മാർ
  rationale: നിയമപരമായ അന്യായത്തോടൊപ്പം ധാർമികമായ നീതിയില്ലായ്മയും ഉൾക്കൊള്ളുന്ന സാധാരണ ബൈബിൾ മലയാളപദം.
- source_word: μοιχοί
  choice: വ്യഭിചാരികൾ
  rationale: വിവാഹവിശ്വസ്തത ലംഘിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ നേരിട്ടുള്ള, മാന്യമായ പരിഭാഷ.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: ഈ നികുതിപിരിവുകാരനെപ്പോലും അല്ല
  rationale: ἢ καὶ നൽകുന്ന നിന്ദാപൂർവമായ ഊന്നൽ ‘പോലും’ വഴി സംരക്ഷിക്കുന്നു; τελώνης എന്നതിന് ഇന്നത്തെ വായനക്കാർക്ക് വ്യക്തമായ പദമാണ് ‘നികുതിപിരിവുകാരൻ’.
theological_decisions:
- issue: πρὸς ἑαυτόν എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ മറ്റുള്ളവരിൽനിന്ന് മാറിനിന്നു എന്ന സ്ഥലപരമായ അർഥം
  alternative: ‘നിന്നുകൊണ്ട് തന്നോടുതന്നെ ഇങ്ങനെ പ്രാർഥിച്ചു’ എന്ന പ്രതിഫലനാത്മക അർഥം
  rationale: ഗ്രീക്ക് പ്രയോഗം അവൻ വേറിട്ടുനിന്നു എന്നോ അവന്റെ പ്രാർഥന ഒരർഥത്തിൽ തന്നിലേക്കുതന്നെ തിരിഞ്ഞിരുന്നു എന്നോ സൂചിപ്പിക്കാം. വ്യാഖ്യാനപരമായ വിധി മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ രണ്ടാമത്തെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. പരീശന്റെ ആത്മപ്രശംസയും നികുതിപിരിവുകാരനോടുള്ള നിന്ദയും മയപ്പെടുത്താതെ, എന്നാൽ അനാവശ്യമായി കടുപ്പിക്കാതെയും അവതരിപ്പിച്ചിരിക്കുന്നു.
