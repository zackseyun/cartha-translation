id: LUK.18.14
reference: Luke 18:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: ml
  text: '“ഞാൻ നിങ്ങളോടു പറയുന്നു: ഈ മനുഷ്യൻ മറ്റേയാളെക്കാൾ നീതിമാനെന്നു വിധിക്കപ്പെട്ട് തന്റെ വീട്ടിലേക്ക് ഇറങ്ങിപ്പോയി[a]. എന്തെന്നാൽ, സ്വയം ഉയർത്തുന്ന ഏവനും താഴ്ത്തപ്പെടും; എന്നാൽ സ്വയം താഴ്ത്തുന്നവൻ ഉയർത്തപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മറ്റേയാളുമായി താരതമ്യം ചെയ്യുമ്പോൾ നീതിമാനെന്നു വിധിക്കപ്പെട്ട്.” ഈ ഗ്രീക്ക് പ്രയോഗം ഈ മനുഷ്യനെയും മറ്റേ ആരാധകനെയും തമ്മിൽ താരതമ്യം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: നീതിമാനായി വിധിക്കപ്പെട്ടവനായി
  rationale: δικαιόω എന്ന ക്രിയയുടെ perfect passive participle ആണിത്. ദൈവത്തിന്റെ അനുകൂല വിധിയും അതിന്റെ നിലനിൽക്കുന്ന ഫലവും സൂചിപ്പിക്കുന്ന നിയമവിധിസദൃശമായ അർഥം ഈ പ്രയോഗം നിലനിർത്തുന്നു; അതേസമയം പിൽക്കാല സിദ്ധാന്തവ്യവസ്ഥയെ വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: παρ’ ἐκεῖνον
  choice: മറ്റേയാളെക്കാൾ
  rationale: Accusative-നോടുകൂടിയ παρά ഇവിടെ താരതമ്യമോ വൈരുധ്യമോ സൂചിപ്പിക്കുന്നു. പരീശനെയും നികുതിപിരിവുകാരനെയും തമ്മിൽ വേർതിരിക്കുന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; താരതമ്യത്തിന്റെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: κατέβη
  choice: ഇറങ്ങിപ്പോയി
  rationale: ദേവാലയപ്രദേശത്തുനിന്നുള്ള താഴോട്ടുള്ള സഞ്ചാരത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘മടങ്ങിപ്പോയി’ എന്നതിനെക്കാൾ ഗ്രീക്ക് ക്രിയയുടെ രൂപത്തോട് അടുത്തതാണ്.
- source_word: οἶκον αὐτοῦ
  choice: തന്റെ വീട്ടിലേക്ക്
  rationale: οἶκος എന്നതിന്റെ സാധാരണ അർഥമായ ‘വീട്’ സ്വാഭാവികമായി നൽകുകയും αὐτοῦ എന്ന ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: സ്വയം ഉയർത്തുന്ന ഏവനും
  rationale: Articular participle പൊതുവായ ഒരു തത്ത്വം അറിയിക്കുന്നു. ‘സ്വയം’ reflexive അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ ഇത് അനാവശ്യമായ ലിംഗവിശേഷണം കൂടാതെ സ്വാഭാവികമാണ്.
- source_word: ταπεινωθήσεται
  choice: താഴ്ത്തപ്പെടും
  rationale: Future passive രൂപം അതേപടി സംരക്ഷിക്കുന്നു; പ്രവർത്തകനെ ഗ്രീക്കുപോലെ വ്യക്തമാക്കാതെ വിടുന്നു.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: എന്നാൽ സ്വയം താഴ്ത്തുന്നവൻ
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ടും ആദ്യ ഭാഗത്തോടുള്ള സമാന്തരഘടന കൊണ്ടും വ്യക്തമാക്കുന്നു.
- source_word: ὑψωθήσεται
  choice: ഉയർത്തപ്പെടും
  rationale: Future passive രൂപവും താഴ്ത്തപ്പെടുക/ഉയർത്തപ്പെടുക എന്ന വാക്യത്തിന്റെ സമാന്തരമായ മറിച്ചിടലും സംരക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള വിധിയുടെ കാരണം അവതരിപ്പിക്കുന്ന causal ബന്ധം dignified modern Malayalam-ൽ വ്യക്തമാക്കുന്നു.
- source_word: οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: മുൻവാക്യങ്ങളിലെ നികുതിപിരിവുകാരനെയാണ് സൂചിപ്പിക്കുന്നത്; മറ്റേയാളുമായുള്ള വ്യക്തിപരമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉപമയുടെ സമാപനത്തിലെ δικαιόω എന്നതിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ അനുകൂലമായ വിധിയെ സൂചിപ്പിക്കുന്ന ‘നീതിമാനായി വിധിക്കപ്പെട്ടവനായി’
  alternative: സാമൂഹികമോ പൊതുവായതോ ആയ അർഥത്തിൽ ‘നിർദോഷനെന്നു തെളിയിക്കപ്പെട്ട്’
  rationale: ദൈവസന്നിധിയിൽ സ്വയം നീതിമാനെന്നു കരുതുന്ന പരീശനെയും അനുതപിക്കുന്ന നികുതിപിരിവുകാരനെയും സന്ദർഭം വൈരുധ്യപ്പെടുത്തുന്നു. തിരുവാക്യത്തിന്റെ ദൈവശാസ്ത്രഭാരം നിലനിർത്തിക്കൊണ്ട്, അതിൽ പറയുന്നതിലപ്പുറമുള്ള സമ്പൂർണ സിദ്ധാന്തവ്യവസ്ഥ ചേർക്കാതെയാണ് വിവർത്തനം.
- issue: പൊതുവായ തത്ത്വവാക്യത്തിലെ masculine singular രൂപം
  choice: ലിംഗം നിർബന്ധമായി അടയാളപ്പെടുത്താത്ത സ്വാഭാവിക മലയാള ഏകവചനരൂപങ്ങൾ—‘ഏവനും’, ‘വൻ’, ‘സ്വയം’
  alternative: ബഹുവചനരൂപം ഉപയോഗിച്ച് ലിംഗനിരപേക്ഷമാക്കുക
  rationale: ഗ്രീക്കിലെ representative singular ഘടന മലയാളത്തിൽ ഏകവചനമായി സംരക്ഷിക്കാം; മലയാള സർവനാമഘടന കാരണം കൃത്രിമമായ പുരുഷലിംഗസൂചന ചേർക്കേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘നീതിമാനായി വിധിക്കപ്പെട്ടവനായി’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ forensic/resultative അർഥം സൂക്ഷിക്കുന്നു. വാക്യത്തിന്റെ താഴ്ത്തപ്പെടുക/ഉയർത്തപ്പെടുക എന്ന സമാന്തരഘടനയും ദൈവിക പ്രവർത്തകനെ പരോക്ഷമായി വിടുന്ന passive രൂപങ്ങളും നിലനിർത്തി.
