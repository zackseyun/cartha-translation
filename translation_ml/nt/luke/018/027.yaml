id: LUK.18.27
reference: Luke 18:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Τὰ ἀδύνατα παρὰ ἀνθρώποις δυνατὰ ⸂παρὰ τῷ θεῷ ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു: “മനുഷ്യർക്ക് അസാധ്യമായത് ദൈവത്തിന് സാധ്യമാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδύνατα
  choice: അസാധ്യമായത്
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണം നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നു. ‘അസാധ്യമായത്’ എന്ന ഏകവചനസദൃശമായ പൊതുപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാണ്; മനുഷ്യശേഷിക്കപ്പുറമുള്ള കാര്യങ്ങളുടെ വിഭാഗത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
- source_word: παρὰ ἀνθρώποις
  choice: മനുഷ്യർക്ക്
  rationale: ദത്തിവിനോടുകൂടിയ παρά ഇവിടെ ബന്ധമോ പരിഗണനാവലയം തന്നെയോ സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യർക്ക്’ എന്നത് ‘മനുഷ്യരുടെ കാര്യത്തിൽ/മനുഷ്യരുടെ കഴിവിൽ’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും പൊതുവായ മനുഷ്യസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δυνατὰ
  choice: സാധ്യമാണ്
  rationale: ἀδύνατα എന്നതിന്റെ പ്രതിപദമായി നാമപദസ്വഭാവത്തിൽ വരുന്ന ഈ പദത്തിന് ‘സാധ്യമാണ്’ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യമാണ്.
- source_word: παρὰ τῷ θεῷ
  choice: ദൈവത്തിന്
  rationale: παρὰ ἀνθρώποις എന്നതിനു സമാന്തരമായി, ദൈവത്തെ സംബന്ധിച്ചുള്ള സാധ്യതയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘ദൈവത്തിന്’ എന്നത് മലയാളത്തിൽ ആ വൈരുധ്യം വ്യക്തമായും സംക്ഷിപ്തമായും അവതരിപ്പിക്കുന്നു.
- source_word: ὁ δὲ εἶπεν
  choice: എന്നാൽ അവൻ പറഞ്ഞു
  rationale: δέ ഇവിടെ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യമോ പ്രതികരണപരമായ മാറ്റമോ സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക ആഖ്യാനബന്ധകമാണ്.
theological_decisions:
- issue: ദൈവത്തിന് സാധ്യമായതിന്റെ വ്യാപ്തി
  choice: മനുഷ്യരുടെ കഴിവിൽ അസാധ്യമായത് ദൈവത്തിന് സാധ്യമാണെന്ന താരതമ്യപ്രസ്താവനയായി നിലനിർത്തി.
  alternative: സങ്കൽപ്പിക്കാവുന്ന ഏതു കാര്യത്തെയും കുറിച്ചുള്ള പരിപൂർണ ദൈവിക ശേഷിയുടെ തത്ത്വചിന്താപരമായ പരമവാക്യമായി വികസിപ്പിക്കുക.
  rationale: ധനികൻ ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നതും രക്ഷയും സംബന്ധിച്ച സന്ദർഭത്തിൽ ഗ്രീക്ക് പാഠം മനുഷ്യന്റെ അശക്തിയെയും ദൈവത്തിന്റെ കഴിവിനെയും എതിർനിർത്തുന്നു. അതിനപ്പുറമുള്ള തത്ത്വചിന്താപരമായ നിർവചനങ്ങൾ പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും വാചികമായി സ്വാഭാവികവുമായ രൂപം. ‘മനുഷ്യർക്ക് … ദൈവത്തിന്’ എന്ന സമാന്തരഘടന മൂലപാഠത്തിലെ വൈരുധ്യം സംരക്ഷിക്കുന്നു. ഇംഗ്ലീഷിലെ ‘with/for’ വ്യത്യാസം മലയാളത്തിൽ വേറിട്ട അടിക്കുറിപ്പ് ആവശ്യപ്പെടാത്ത വിധം ‘-ക്ക്’ വിഭക്തിയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
