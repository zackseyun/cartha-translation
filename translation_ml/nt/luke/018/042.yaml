id: LUK.18.42
reference: Luke 18:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἀνάβλεψον· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “കാഴ്ച പ്രാപിക്ക[a]; നിന്റെ വിശ്വാസം നിന്നെ രക്ഷിച്ചിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വീണ്ടും കാഴ്ച പ്രാപിക്ക.” സൗഖ്യദാനസന്ദർഭത്തിൽ ഗ്രീക്ക് കല്പനയ്ക്ക് “വീണ്ടും കാണുക” എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിന്നെ സൗഖ്യമാക്കിയിരിക്കുന്നു” അല്ലെങ്കിൽ “നിന്നെ സുഖപ്പെടുത്തിയിരിക്കുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് രക്ഷയെയും സൗഖ്യത്തെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്താതെ ലളിതമായ ആഖ്യാനതുടർച്ചയിൽ ഉൾപ്പെടുത്തി)
  rationale: καί ഇവിടെ ആഖ്യാനത്തിലെ സാധാരണ ബന്ധകമാണ്. മുൻവാക്യവുമായി സ്വാഭാവികമായി ചേരുന്ന മലയാളത്തിൽ ‘പിന്നെ’ എന്ന അധിക വ്യാഖ്യാനഭാവം ചേർക്കാതെ വിട്ടിരിക്കുന്നു.
- source_word: εἶπεν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: സംസാരത്തിന്റെ ആമുഖവും ദത്തിവ് പരോക്ഷകർമവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Ἀνάβλεψον
  choice: കാഴ്ച പ്രാപിക്കുക
  rationale: ഈ സൗഖ്യദാനസന്ദർഭത്തിൽ ἀναβλέπω എന്നത് വെറുതെ ‘മുകളിലേക്കു നോക്കുക’ എന്നല്ല, കാഴ്ച ലഭിക്കുക അഥവാ വീണ്ടും ലഭിക്കുക എന്നതാണ്. മുൻപ് കാഴ്ച ഉണ്ടായിരുന്നുവെന്ന് മുഖ്യപാഠത്തിൽ നിർബന്ധമായി പ്രസ്താവിക്കാതെ സന്ദർഭാർഥം നൽകുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഇവിടെ ഈ പദം യേശുവിലുള്ള ആ മനുഷ്യന്റെ ആശ്രയപൂർവമായ വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു. സാധാരണവും ദൈവശാസ്ത്രപരമായി തുറന്നതുമായ മലയാളപദം തിരഞ്ഞെടുത്തു.
- source_word: σέσωκέν
  choice: രക്ഷിച്ചിരിക്കുന്നു
  rationale: σῴζω എന്ന പദത്തിന് രക്ഷിക്കുക, സൗഖ്യമാക്കുക എന്നീ അർഥങ്ങൾ വരാം. പൂർണ്ണകാലരൂപത്തിന്റെ നിലനിൽക്കുന്ന ഫലഭാവം ‘രക്ഷിച്ചിരിക്കുന്നു’ എന്നു നൽകുകയും ശാരീരിക സൗഖ്യവും വിശാലമായ രക്ഷയും തമ്മിലുള്ള ലൂക്കോസിലെ അർഥവ്യാപ്തി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സൗഖ്യദാനവിവരണത്തിൽ σῴζω എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: രക്ഷിച്ചിരിക്കുന്നു
  alternative: സൗഖ്യമാക്കിയിരിക്കുന്നു / സുഖപ്പെടുത്തിയിരിക്കുന്നു
  rationale: സന്ദർഭത്തിൽ ശാരീരിക സൗഖ്യം വ്യക്തമാണ്; എങ്കിലും പദം അതിലുപരിയായ രക്ഷയെയും ഉൾക്കൊള്ളാൻ കഴിയും. അതിനാൽ മുഖ്യപാഠം ഈ ദൈവശാസ്ത്രപരമായ അർഥപിരിമുറുക്ക് നിലനിർത്തുന്നു; സൗഖ്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കല്പനയ്ക്ക് ‘കാഴ്ച പ്രാപിക്കുക’ എന്ന ലളിതരൂപവും, ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കാൻ ‘രക്ഷിച്ചിരിക്കുന്നു’ എന്ന രൂപവും ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
