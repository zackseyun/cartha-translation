  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ നീണ്ട വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് മുഖ്യഖണ്ഡങ്ങളായി ക്രമപ്പെടുത്തി. തുടർന്നുവരുന്ന ചോദ്യത്തിലേക്കുള്ള ബന്ധം നിലനിർത്താൻ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
