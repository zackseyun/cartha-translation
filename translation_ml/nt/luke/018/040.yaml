  text: σταθεὶς δὲ ⸀ὁ Ἰησοῦς ἐκέλευσεν αὐτὸν ἀχθῆναι πρὸς αὐτόν. ἐγγίσαντος δὲ αὐτοῦ ἐπηρώτησεν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/040.yaml
  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: ml
  text: 'അപ്പോൾ യേശു നിന്നു[a]; അവനെ തന്റെ അടുക്കലേക്കു കൊണ്ടുവരാൻ കല്പിച്ചു[b]. അവൻ അടുത്തെത്തിയപ്പോൾ യേശു അവനോടു ചോദിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിർത്തി.” ഗ്രീക്ക് പദം യേശു നടന്നുകൊണ്ടിരുന്നിടത്ത് നിൽക്കുകയോ നിർത്തുകയോ ചെയ്തുവെന്ന ആശയം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നയിച്ചുകൊണ്ടുവരാൻ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘നയിക്കുക’ എന്നും ‘കൊണ്ടുവരുക’ എന്നും അർഥമാകാം; ഈ സന്ദർഭത്തിൽ ‘കൊണ്ടുവരാൻ’ കൂടുതൽ സ്വാഭാവികമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: σταθεὶς
  choice: നിന്നു
  rationale: ἵστημι എന്ന ക്രിയയുടെ ഈ അകർമക പ്രയോഗം യേശു യാത്ര നിർത്തിയെന്ന ആശയം നൽകുന്നു. ‘നിന്നു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്; സന്ദർഭം അതിനെ ‘നടത്തം നിർത്തി’ എന്ന അർഥത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. മുൻവാക്യത്തിലെ സംഭവത്തിൽനിന്നുള്ള സ്വാഭാവിക പുരോഗതി ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: ἐκέλευσεν
  choice: കല്പിച്ചു
  rationale: κελεύω അധികാരപൂർവമായ നിർദേശം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കല്പിച്ചു’ അതിന്റെ ശക്തി കാത്തുസൂക്ഷിക്കുന്ന, ഗൗരവമുള്ള സാധാരണ മലയാളപ്രയോഗമാണ്.
- source_word: ἀχθῆναι
  choice: കൊണ്ടുവരാൻ
  rationale: ἄγω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം ഒരാളെ യേശുവിന്റെ അടുക്കലേക്കു കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കൊണ്ടുവരാൻ’ സ്വാഭാവികമാണ്; ‘നയിച്ചുകൊണ്ടുവരാൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς αὐτόν
  choice: തന്റെ അടുക്കൽ
  rationale: πρός സഹിതമുള്ള ദ്വിതീയാവിഭക്തി യേശുവിലേക്കുള്ള ചലനമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘തന്റെ അടുക്കൽ’ ലക്ഷ്യവും യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നതെന്നും വ്യക്തമായി നൽകുന്നു.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: അവൻ അടുത്തെത്തിയപ്പോൾ
  rationale: ഈ genitive absolute ഘടന സമയബന്ധം പ്രകടിപ്പിക്കുന്നു. മുൻപ് പരാമർശിച്ച അന്ധനാണ് കർത്താവ്; ‘അടുത്തെത്തിയപ്പോൾ’ സ്വാഭാവികമായി അതു നൽകുന്നു.
- source_word: ἐπηρώτησεν αὐτόν
  choice: യേശു അവനോടു ചോദിച്ചു
  rationale: ἐπερωτάω ഇവിടെ സാധാരണയായി ‘ചോദിക്കുക’ എന്നാണ്. ഗ്രീക്കിൽ സർവനാമമായിരുന്ന കർത്താവിനെ മലയാളത്തിൽ ‘യേശു’ എന്നു ആവർത്തിക്കുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ സ്ഥാപിതമായ മലയാളരൂപം ഉപയോഗിച്ചു.
