id: LUK.18.5
reference: Luke 18:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: ml
  text: എങ്കിലും, ഈ വിധവ എന്നെ നിരന്തരം ശല്യപ്പെടുത്തുന്നതുകൊണ്ട്, ഞാൻ അവൾക്കു നീതി ലഭ്യമാക്കും[a]; അവൾ ഇടവിടാതെ വന്ന് എന്നെ വല്ലാതെ ക്ഷീണിപ്പിക്കാതിരിക്കാൻ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവളുടെ അവകാശം സ്ഥാപിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ചില സന്ദർഭങ്ങളിൽ ‘അവൾക്കുവേണ്ടി പ്രതികാരം ചെയ്യും’ എന്നും അർഥമാകാം; ഇവിടെ ഉദ്ദേശിക്കുന്നത് നിയമപരമായ നീതി നൽകുന്നതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: എങ്കിലും ... എന്നെ നിരന്തരം ശല്യപ്പെടുത്തുന്നതുകൊണ്ട്
  rationale: διά + articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു; γε അതിന് ഊന്നൽ നൽകുന്നു. വർത്തമാനകാല infinitive പ്രവൃത്തിയുടെ തുടർച്ചയായ സ്വഭാവം സൂചിപ്പിക്കുന്നതിനാൽ ‘നിരന്തരം ശല്യപ്പെടുത്തുന്നു’ എന്ന് സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: τὴν χήραν ταύτην
  choice: ഈ വിധവ
  rationale: Demonstrative-ഉം നാമവും നേരിട്ട് നിലനിർത്തുന്നു; ഉപമയിലെ അവളുടെ സാമൂഹിക ദുർബലത വ്യക്തമാക്കാൻ ‘വിധവ’ അനിവാര്യമാണ്.
- source_word: ἐκδικήσω αὐτήν
  choice: ഞാൻ അവൾക്കു നീതി ലഭ്യമാക്കും
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ ക്രിയ പ്രതികാരം ചെയ്യുക എന്നതിലുപരി അവളുടെ ന്യായമായ അവകാശം നടപ്പാക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: ἵνα μὴ
  choice: അല്ലെങ്കിൽ ... വലച്ചുകളയും
  rationale: ന്യായാധിപന്റെ തീരുമാനം പിന്നിലുള്ള ഒഴിവാക്കൽലക്ഷ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; അർഥപരമായി ‘അങ്ങനെ സംഭവിക്കാതിരിക്കാൻ’ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: εἰς τέλος ἐρχομένη
  choice: ഇടവിടാതെ വന്നുകൊണ്ട്
  rationale: εἰς τέλος ഇവിടെ ആവർത്തിച്ചും തുടർച്ചയായും വരുന്നതിനെ സൂചിപ്പിക്കുന്നതായി എടുത്തു; participle-ന്റെ സമകാലികവും ആവർത്തിതവുമായ ഭാവം മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὑπωπιάζῃ με
  choice: എന്നെ വല്ലാതെ വലച്ചുകളയും
  rationale: ക്രിയയുടെ അക്ഷരാർഥം കണ്ണിനു താഴെ അടിക്കുക എന്നാണെങ്കിലും, ഇവിടെ നിരന്തര ശല്യത്താൽ ക്ഷീണിപ്പിക്കുക എന്ന രൂപകാർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു. ‘വല്ലാതെ’ എന്നത് മൂലത്തിലെ ശക്തി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: നീതിയെക്കുറിച്ചുള്ള ഉപമയിൽ ἐκδικήσω എന്ന ക്രിയയുടെ അർഥം
  choice: അവൾക്കു നീതി ലഭ്യമാക്കും
  alternative: അവൾക്കുവേണ്ടി പ്രതികാരം ചെയ്യും / അവളുടെ നിരപരാധിത്വം തെളിയിക്കും
  rationale: ഇവിടെ വിഷയം അന്യായം ചെയ്തവനോട് വ്യക്തിപരമായി പ്രതികാരം ചെയ്യുന്നതല്ല, ന്യായാധിപൻ നിയമപരമായ പരിഹാരം നൽകുന്നതാണ്. ഈ പരിഭാഷ തുടർന്നുള്ള വാക്യങ്ങളിലെ ദൈവം നീതി നൽകുന്നു എന്ന ആശയബന്ധവും നിലനിർത്തുന്നു.
- issue: ὑπωπιάζῃ എന്നതിലെ അക്ഷരാർഥവും രൂപകാർഥവും
  choice: എന്നെ വല്ലാതെ വലച്ചുകളയും
  alternative: എന്റെ കണ്ണിനു താഴെ അടിക്കും
  rationale: വിധവയുടെ ആവർത്തിച്ചുള്ള അപേക്ഷയെപ്പറ്റിയുള്ള ന്യായാധിപന്റെ പരാതിയാണ് സന്ദർഭം; അതിനാൽ ക്ഷീണിപ്പിക്കുക/വലച്ചുകളയുക എന്ന രൂപകാർഥം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാണ്. അക്ഷരാർഥത്തിലെ ശക്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ന്യായാധിപന്റെ അസഹിഷ്ണുത സംസാരഭാഷാപരമായ അതിരുകടക്കലില്ലാതെ പ്രകടമാക്കി; നിയമപരവും രൂപകപരവുമായ അർഥവ്യത്യാസങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
