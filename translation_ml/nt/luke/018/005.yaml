- from: എങ്കിലും ഈ വിധവ എന്നെ നിരന്തരം ശല്യപ്പെടുത്തുന്നതുകൊണ്ട്, ഞാൻ അവൾക്കു നീതി ലഭ്യമാക്കും[a]; അല്ലെങ്കിൽ അവൾ ഇടവിടാതെ വന്നുകൊണ്ട് എന്നെ വല്ലാതെ വലച്ചുകളയും[b].’”
  to: എങ്കിലും, ഈ വിധവ എന്നെ നിരന്തരം ശല്യപ്പെടുത്തുന്നതുകൊണ്ട്, ഞാൻ അവൾക്കു നീതി ലഭ്യമാക്കും[a]; അവൾ ഇടവിടാതെ വന്ന് എന്നെ വല്ലാതെ ക്ഷീണിപ്പിക്കാതിരിക്കാൻ.”
