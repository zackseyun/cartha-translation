source:
  edition: SBLGNT
  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: ml
  text: എന്തെന്നാൽ, ഒരു ഒട്ടകം സൂചിക്കണ്ണിലൂടെ കടക്കുന്നത് ഒരു ധനികൻ ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നതിനെക്കാൾ എളുപ്പമാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘സൂചിയുടെ ദ്വാരത്തിലൂടെ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘സൂചിക്കണ്ണ്’ എന്നു പേരുള്ള ഇടുങ്ങിയ കവാടമെന്നോ ‘ഒട്ടകം’ എന്നതിനു പകരം ‘കയർ’ എന്ന അർഥമെന്നോ ചിലർ വ്യാഖ്യാനങ്ങൾ നിർദേശിച്ചിട്ടുണ്ട്. എന്നാൽ ഇവിടെയുള്ള ഗ്രീക്ക് പാഠത്തിൽ ‘ഒട്ടകം’ എന്നാണ് ഉള്ളത്.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: എളുപ്പം
  rationale: ἐστιν എന്ന ക്രിയയോടുകൂടിയ താരതമ്യപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘...യെക്കാൾ എളുപ്പം ... ആണ്’ എന്നു നൽകി.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം നിലനിർത്തുന്നു.
- source_word: κάμηλον
  choice: ഒരു ഒട്ടകം
  rationale: κάμηλος എന്നതിന്റെ സാധാരണവും പാഠസാക്ഷ്യത്താൽ പിന്തുണയ്ക്കപ്പെടുന്നതുമായ അർഥം ‘ഒട്ടകം’ തന്നെയാണ്; ‘കയർ’ പോലുള്ള വ്യാഖ്യാനങ്ങൾ മുഖ്യപാഠത്തിൽ കൊണ്ടുവന്നിട്ടില്ല.
- source_word: διὰ τρήματος βελόνης
  choice: സൂചിയുടെ ദ്വാരത്തിലൂടെ
  rationale: ‘സൂചിയുടെ തുറവ്/ദ്വാരം വഴി’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം; രൂപകത്തിന്റെ അസാധ്യത നിലനിർത്തുന്നു.
- source_word: εἰσελθεῖν
  choice: പ്രവേശിക്കുക / കടക്കുക
  rationale: 'രണ്ടിടത്തുമുള്ള അതേ ഗ്രീക്ക് ക്രിയയെ സന്ദർഭാനുസൃതമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകി: രാജ്യത്തിൽ ‘പ്രവേശിക്കുക,’ ദ്വാരത്തിലൂടെ ‘കടക്കുക.’'
- source_word: πλούσιον
  choice: ഒരു ധനികൻ
  rationale: പുരുഷലിംഗ ഏകവചനത്തിൽ നാമവൽക്കരിച്ച വിശേഷണത്തെ പ്രതിനിധാന ഏകവചനമായി കൃത്യമായി നൽകുന്നു.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിൽ
  rationale: ദിശാബോധം മലയാളത്തിലെ പ്രവേശനക്രിയയോടൊപ്പമുള്ള ‘-ത്തിൽ’ വിഭക്തിയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു; പ്രധാന ബൈബിൾപ്രയോഗമായ ‘ദൈവരാജ്യം’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഒട്ടകവും സൂചിദ്വാരവും ഉൾപ്പെടുന്ന ദൃശ്യത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘ഒരു ഒട്ടകം ... സൂചിയുടെ ദ്വാരത്തിലൂടെ’ എന്ന പാഠത്തിലെ അതിശയോക്തിപരമായ ദൃശ്യം അതേപടി നിലനിർത്തി.
  alternative: ‘സൂചിക്കണ്ണ്’ എന്നു പേരുള്ള ഇടുങ്ങിയ കവാടമെന്ന വ്യാഖ്യാനം; അല്ലെങ്കിൽ ‘ഒട്ടകം’ എന്നതിന് പകരം ‘കയർ’ എന്നു വായിക്കൽ.
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠം κάμηλον (‘ഒട്ടകം’) എന്നാണ് വായിക്കുന്നത്. ധനികൻ ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നതിലെ പ്രയാസം ഊന്നിപ്പറയുന്ന ഉദ്ദേശപൂർവമായ അസാധ്യദൃശ്യം വ്യാഖ്യാനപരമായി ലഘൂകരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. താരതമ്യത്തിന്റെ ഗ്രീക്ക് പദക്രമം മലയാളവായനയ്ക്ക് അനുയോജ്യമായി പുനഃക്രമീകരിച്ചെങ്കിലും അർഥവും അതിശയോക്തിയുടെ തീവ്രതയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
