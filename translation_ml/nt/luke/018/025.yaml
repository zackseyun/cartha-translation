  - severity: low
    issue: The main text uses a literal but less idiomatic expression for the needle’s eye.
    rationale: ‘സൂചിയുടെ ദ്വാരത്തിലൂടെ’ is accurate, but ‘സൂചിക്കണ്ണിലൂടെ’ is the conventional natural Malayalam expression. The literal phrasing can be preserved in footnote a.
