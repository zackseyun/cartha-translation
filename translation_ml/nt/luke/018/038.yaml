  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: ml
  text: 'അവൻ ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “യേശുവേ, ദാവീദിന്റെ പുത്രാ,[a] എന്നോടു കരുണ കാണിക്കണമേ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദാവീദിന്റെ പുത്രൻ” എന്നത് വാഗ്ദത്ത ദാവീദീയ രാജാവിനെ ഓർമിപ്പിക്കുന്ന മശീഹാ സ്ഥാനനാമമാണ്; കൂടുതൽ പൊതുവായി, “ദാവീദിന്റെ സന്തതി” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: βοάω എന്ന ക്രിയ സൂചിപ്പിക്കുന്ന ഉച്ചത്തിലുള്ള, അടിയന്തരമായ നിലവിളിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγων
  choice: വിളിച്ചുപറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന പങ്കാളിക്രിയയെ മലയാളത്തിൽ വേർതിരിച്ച് ആവർത്തിക്കാതെ, മുഖ്യക്രിയയോടു ചേർത്ത് നേരിട്ടുള്ള വാക്കുകൾ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ἰησοῦ
  choice: യേശുവേ
  rationale: വ്യക്തിനാമത്തിന്റെ സംബോധനരൂപം മലയാളത്തിലെ പതിവായ രൂപത്തിൽ നൽകുന്നു.
- source_word: υἱὲ Δαυίδ
  choice: ദാവീദിന്റെ പുത്രാ
  rationale: രാജകീയ-മശീഹാ ധ്വനിയുള്ള ബൈബിൾപരമായ സ്ഥാനനാമം നിലനിർത്തുകയും സംബോധനരൂപം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐλέησόν με
  choice: എന്നോടു കരുണ കാണിക്കണമേ
  rationale: കരുണാപൂർവമായ പ്രവർത്തനത്തിനായുള്ള നേരിട്ടും അടിയന്തരവുമായ അഭ്യർഥനയെ മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: υἱὲ Δαυίδ എന്ന പ്രയോഗത്തിന്റെ മശീഹാ-രാജകീയ പ്രാധാന്യം
  choice: “ദാവീദിന്റെ പുത്രാ” എന്ന സ്ഥാനനാമരൂപം
  alternative: “ദാവീദിന്റെ സന്തതിയേ”
  rationale: ലൂക്കോസിന്റെ സന്ദർഭത്തിൽ ഇത് കേവലം വംശപരമ്പര സൂചിപ്പിക്കുന്നതിലുപരി വാഗ്ദത്ത ദാവീദീയ രാജാവിനെ ഓർമിപ്പിക്കുന്ന അഭിസംബോധനയാണ്. സ്ഥാനനാമത്തിന്റെ ധ്വനി നിലനിർത്തുമ്പോഴും പാഠത്തിൽ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നിലവിളിയുടെ ശബ്ദവും അടിയന്തരതയും ‘ഉറക്കെ വിളിച്ചുപറഞ്ഞു’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; പ്രാർഥനാഭാവമുള്ള അഭ്യർഥനയിൽ ‘ണമേ’ രൂപം ഉപയോഗിക്കുന്നു.
