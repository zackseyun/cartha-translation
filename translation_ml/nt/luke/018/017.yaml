  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഒരു കുട്ടിയെപ്പോലെ[a] ദൈവരാജ്യം സ്വീകരിക്കാത്തവൻ അതിൽ ഒരിക്കലും പ്രവേശിക്കുകയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു കുട്ടിയായി” എന്നും പരിഭാഷപ്പെടുത്താം. കുട്ടിയുടെ സ്വീകരണസന്നദ്ധത, വിശ്വാസം, വിനയം, അല്ലെങ്കിൽ ആശ്രിതത്വം എന്നിവയിൽ ഏതിനാണ് ഊന്നൽ എന്നു ഗ്രീക്ക് പാഠം കൃത്യമായി വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: യേശുവിന്റെ ഗൗരവമേറിയ ഉറപ്പിക്കൽ സൂത്രവാക്യത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ആമേൻ’ എന്ന ലിപ്യന്തരണം ഇവിടെ കൂടുതൽ അപരിചിതമായി തോന്നാം.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധന കൃത്യവും മാന്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ὃς ἂν
  choice: സ്വീകരിക്കാത്തവൻ
  rationale: ഗ്രീക്കിലെ അനിശ്ചിത പൊതുനിബന്ധനയെ മലയാളത്തിലെ ബന്ധകക്രിയാരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μὴ δέξηται
  choice: സ്വീകരിക്കാത്തവൻ
  rationale: δέχομαι എന്നതിലെ സ്വീകരിക്കൽ/അംഗീകരിക്കൽ എന്ന ആശയം സംരക്ഷിക്കുന്നു; ‘ദൈവരാജ്യം’ എന്ന കർമത്തോടൊപ്പം ഇത് സ്വാഭാവികമാണ്.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: പരമ്പരാഗതവും സുതാര്യവുമായ മലയാളപ്രയോഗം; ദൈവത്തിന്റെ രാജത്വമെന്ന ചലനാത്മക അർഥത്തെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ὡς παιδίον
  choice: ഒരു കുട്ടിയെപ്പോലെ
  rationale: ὡς എന്ന ഉപമയും παιδίον എന്ന പദവും നിലനിർത്തുന്നു; വിനയം, വിശ്വാസം, ആശ്രിതത്വം, സ്വീകരണസന്നദ്ധത എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് മാത്രമെന്ന് നിർണ്ണയിക്കുന്നില്ല.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: ഒരിക്കലും പ്രവേശിക്കുകയില്ല
  rationale: οὐ μή ചേർന്ന ശക്തമായ നിഷേധത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς αὐτήν
  choice: അതിൽ
  rationale: സർവനാമം മുമ്പുള്ള ദൈവരാജ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രവേശനത്തിന്റെ ലക്ഷ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ഒരു കുട്ടിയെപ്പോലെ’ ദൈവരാജ്യം സ്വീകരിക്കുക എന്നതിന്റെ കൃത്യമായ അർഥം
  choice: ഉപമയെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ മുഖ്യപാഠത്തിൽ അതേപടി നിലനിർത്തി.
  alternative: കുട്ടിയുടെ വിനയത്തോടെ; കുട്ടിയുടെ വിശ്വാസത്തോടെ; ഒരു കുട്ടിയായ നിലയിൽ
  rationale: ഗ്രീക്ക് വാക്യം താരതമ്യം വ്യക്തമാക്കുന്നുവെങ്കിലും ഉദ്ദേശിച്ച പ്രത്യേക ഗുണം നിർവചിക്കുന്നില്ല. അതിനാൽ വിനയം, വിശ്വാസം, ആശ്രിതത്വം, സ്വീകരണസന്നദ്ധത എന്നിവയിൽ ഒന്നിനെ മാത്രം പാഠത്തിൽ ചേർക്കുന്നത് ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. വാക്യത്തിന്റെ ഗൗരവവും ശക്തമായ നിഷേധവും സംരക്ഷിച്ചിരിക്കുന്നു; ഉപമയിലെ യഥാർഥ വ്യാഖ്യാനതുറന്ന നിലയും നിലനിർത്തിയിരിക്കുന്നു.
