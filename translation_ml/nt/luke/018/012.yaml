lexical_decisions:
- source_word: νηστεύω
  choice: ഞാൻ ... ഉപവസിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയ ഇവിടെ പതിവായി ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്ഥിരമായ ആചാരമെന്ന അവകാശവാദം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: δὶς τοῦ σαββάτου
  choice: ആഴ്ചയിൽ രണ്ടുപ്രാവശ്യം
  rationale: പദാനുപദമായി ‘ശബ്ബത്തിന്റെ രണ്ടുപ്രാവശ്യം’ എന്നാണെങ്കിലും, കൊയ്നേ ഗ്രീക്കിൽ ഇത് ആഴ്ചയിലെ ആവൃത്തിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
- source_word: ἀποδεκατῶ
  choice: ദശാംശം കൊടുക്കുന്നു
  rationale: ക്രിയയുടെ അർഥം പത്തിലൊന്ന് നൽകുക എന്നതാണ്; ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πάντα ὅσα κτῶμαι
  choice: എനിക്കു ലഭിക്കുന്ന എല്ലാറ്റിന്റെയും
  rationale: κτῶμαι ഇവിടെ സ്വന്തമാക്കുക, നേടുക, ലഭിക്കുക എന്ന ചലനാത്മക അർഥത്തിലാണ്; ‘ലഭിക്കുന്ന’ എന്നത് വരുമാനവും മറ്റു സമ്പാദ്യങ്ങളും ഉൾക്കൊള്ളുന്ന സ്വാഭാവികമായ മലയാളമാണ്.
theological_decisions:
- issue: τοῦ σαββάτου എന്നതിന്റെ അർഥം
  choice: ആഴ്ചയിൽ
  alternative: ശബ്ബത്തിന്റെ / ശബ്ബത്തിൽ
  rationale: ഇത് ശബ്ബത്താചരണത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപ്രസ്താവനയല്ല, ഉപവാസത്തിന്റെ ആവൃത്തി സൂചിപ്പിക്കുന്ന കാലപ്രയോഗമാണ്. അക്ഷരാർഥപരമായ പരിഭാഷ ശബ്ബത്തുദിവസം തന്നെയാണ് ഉപവസിക്കുന്നതെന്ന തെറ്റിദ്ധാരണ സൃഷ്ടിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘ദശാംശം കൊടുക്കുന്നു’ എന്ന പ്രയോഗം മതപരമായ പശ്ചാത്തലത്തിൽ പരിചിതമാണെങ്കിലും മൂലക്രിയയിലെ ‘പത്തിലൊന്ന് നൽകുക’ എന്ന അർഥം മാത്രമാണ് ഇവിടെ വഹിക്കുന്നത്.
