source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀ὁ Πέτρος· Ἰδοὺ ἡμεῖς ⸂ἀφέντες τὰ ἴδια⸃ ἠκολουθήσαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: ml
  text: 'അപ്പോൾ പത്രോസ് പറഞ്ഞു: “ഇതാ, ഞങ്ങൾക്കു സ്വന്തമായവ[a] ഉപേക്ഷിച്ച് ഞങ്ങൾ അങ്ങയെ അനുഗമിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞങ്ങളുടേതായതെല്ലാം” അല്ലെങ്കിൽ “ഞങ്ങളുടെ സ്വന്തവസ്തുക്കൾ.” ഗ്രീക്ക് പ്രയോഗത്തിന് വിശാലമായ അർഥമാണുള്ളത്; പത്രോസും മറ്റുള്ളവരും കൃത്യമായി എന്തെല്ലാം ഉപേക്ഷിച്ചുവെന്ന് അത് വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: δέ ഇവിടെ നേരിയ മാറ്റത്തോടെയുള്ള ആഖ്യാനത്തുടർച്ച സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള പ്രവാഹം നൽകുന്നു. Εἶπεν എന്നതിന് ലളിതമായ ആഖ്യാനക്രിയയായ ‘പറഞ്ഞു’ യോജിക്കുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ἰδούവിന്റെ ഊന്നൽ, അമിതമായ പഴമയില്ലാതെ, ‘ഇതാ’ നിലനിർത്തുന്നു.
- source_word: ἡμεῖς
  choice: ഞങ്ങൾ
  rationale: പ്രകടമായ സർവനാമം നൽകുന്ന ഊന്നൽ നിലനിർത്താൻ ‘ഞങ്ങൾ’ നേരിട്ട് ഉൾപ്പെടുത്തി.
- source_word: ἀφέντες
  choice: ഉപേക്ഷിച്ച്
  rationale: ഇവിടെ സ്വന്തം വകയായിരുന്നവ വിട്ടുപോകുന്നതാണ് ആശയം. ‘ഉപേക്ഷിച്ച്’ അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘പരിത്യജിച്ച്’ എന്നത് അനാവശ്യമായി സാഹിത്യപരവും ശക്തവുമാകാം.
- source_word: τὰ ἴδια
  choice: ഞങ്ങൾക്കു സ്വന്തമായവ
  rationale: ഗ്രീക്ക് പ്രയോഗം വീടുകളിലേക്കോ വസ്തുവകകളിലേക്കോ മാത്രം ചുരുങ്ങാത്ത വിശാലമായ അർഥമുള്ളതാണ്. ‘ഞങ്ങൾക്കു സ്വന്തമായവ’ ആ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἠκολουθήσαμέν σοι
  choice: ഞങ്ങൾ അങ്ങയെ അനുഗമിച്ചിരിക്കുന്നു
  rationale: ἀκολουθέω ശിഷ്യത്വസൂചനയുള്ള സാധാരണ ‘അനുഗമിക്കുക’ എന്ന ക്രിയയാണ്. സമാപിച്ച പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിൽ ‘അനുഗമിച്ചിരിക്കുന്നു’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; σοι എന്ന ഏകവചനത്തെ ആദരസൂചകമായ ‘അങ്ങയെ’ എന്നു നൽകി.
