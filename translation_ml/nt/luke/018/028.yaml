translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന ഏകവചനത്തിന് ആദരസൂചകമായ ‘അങ്ങയെ’ ഉപയോഗിച്ചു. τὰ ἴδιαയുടെ ഉദ്ദേശപൂർവമായ വിശാലത പ്രധാനവാക്യത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
