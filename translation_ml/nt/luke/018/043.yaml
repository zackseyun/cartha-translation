  to: ഉടൻതന്നെ അവന് കാഴ്ച ലഭിച്ചു[a]; അവൻ ദൈവത്തെ മഹത്വപ്പെടുത്തിക്കൊണ്ട് യേശുവിനെ അനുഗമിച്ചുകൊണ്ടിരുന്നു[b]. ഇതു കണ്ട ജനമെല്ലാം ദൈവത്തെ സ്തുതിച്ചു.
  rationale: ഗ്രീക്കിലെ ἠκολούθει എന്ന അപൂർണഭൂതത്തിന്റെ പുരോഗമനസ്വഭാവം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നതിനായി ‘അനുഗമിച്ചു’ എന്നത് ‘അനുഗമിച്ചുകൊണ്ടിരുന്നു’ എന്നാക്കി. അതനുസരിച്ച് അടിക്കുറിപ്പിലെ പകരംവായന ലളിതഭൂതകാലരൂപമാക്കി മാറ്റി. കൂടാതെ ‘മഹത്വപ്പെടുത്തിക്കൊണ്ട്’ എന്ന ആധുനിക പ്രമാണരൂപം സ്വീകരിച്ചു. അർഥമോ സൂചിതമായ അവ്യക്തതയോ മാറ്റിയിട്ടില്ല.
