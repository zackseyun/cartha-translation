id: LUK.18.43
reference: Luke 18:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: ml
  text: ഉടൻതന്നെ അവന് കാഴ്ച ലഭിച്ചു[a]; അവൻ ദൈവത്തെ മഹത്വപ്പെടുത്തിക്കൊണ്ട് യേശുവിനെ അനുഗമിച്ചുകൊണ്ടിരുന്നു[b]. ഇതു കണ്ട ജനമെല്ലാം ദൈവത്തെ സ്തുതിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വീണ്ടും കണ്ടു” അല്ലെങ്കിൽ “കാഴ്ച വീണ്ടെടുത്തു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് കാഴ്ച വീണ്ടെടുക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യേശുവിനെ അനുഗമിച്ചു.” ഗ്രീക്ക് അപൂർണഭൂതം തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: ഉടൻതന്നെ
  rationale: കാലതാമസമില്ലാതെ സംഭവിച്ചതെന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνέβλεψεν
  choice: അവന് കാഴ്ച ലഭിച്ചു
  rationale: സൗഖ്യസന്ദർഭത്തിൽ കാഴ്ച പ്രാപിക്കുക അഥവാ വീണ്ടെടുക്കുക എന്ന അർഥം നൽകുന്നു; മുമ്പ് കാഴ്ച ഉണ്ടായിരുന്നുവെന്ന് അനാവശ്യമായി നിശ്ചയിക്കുന്നില്ല.
- source_word: ἠκολούθει
  choice: അനുഗമിച്ചു
  rationale: ഗ്രീക്ക് അപൂർണഭൂതം തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാമെങ്കിലും, മലയാള ആഖ്യാനത്തിൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്; കാലതുടർച്ചയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δοξάζων
  choice: മഹത്ത്വപ്പെടുത്തിക്കൊണ്ട്
  rationale: അനുഗമിക്കുന്നതിനോടൊപ്പം നടന്ന പ്രവൃത്തി നിലനിർത്തുകയും, പിന്നീടുള്ള αἶνον എന്ന സ്തുതിപദത്തിൽനിന്നുള്ള പദവ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: πᾶς ὁ λαός
  choice: ജനമെല്ലാം
  rationale: കൂട്ടായ ജനസമൂഹത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἰδών
  choice: ഇതു കണ്ട
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമായി പറഞ്ഞിട്ടില്ല; സന്ദർഭത്തിൽ അവർ കണ്ട സംഭവം സൂചിപ്പിക്കാൻ 'ഇതു' ചേർക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἔδωκεν αἶνον
  choice: സ്തുതിച്ചു
  rationale: '''സ്തുതി നൽകി'' എന്ന പദാനുപദ രൂപത്തേക്കാൾ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികം; ദൈവത്തോടുള്ള സ്തുതിയുടെ അർഥം പൂർണമായി നിലനിർത്തുന്നു.'
- source_word: θεός / θεῷ
  choice: ദൈവം / ദൈവത്തെ
  rationale: θεός എന്ന പദത്തിന്റെ പ്രമാണിക മലയാളരൂപം; ഇരുസ്ഥലത്തുമുള്ള ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: യേശുവിനെ
  rationale: മലയാളത്തിൽ സർവനാമസൂചന ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതിരിക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായ മുൻപദമായ യേശുവിന്റെ പേര് ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: കാഴ്ച ലഭിച്ചശേഷമുള്ള അനുഗമനത്തിന്റെ കാലസ്വഭാവം
  choice: യേശുവിനെ അനുഗമിച്ചു
  alternative: യേശുവിനെ അനുഗമിച്ചുകൊണ്ടിരുന്നു
  rationale: ἠκολούθει എന്ന അപൂർണഭൂതം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാം. എന്നാൽ മലയാള ആഖ്യാനത്തിൽ 'അനുഗമിച്ചു' സ്വാഭാവികമാണ്; മറ്റൊരു സാധ്യമായ കാലഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു, അതിലൂടെ ശിഷ്യത്വത്തെക്കുറിച്ചുള്ള അധിക വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ἰδών എന്ന പദത്തിന്റെ സൂചിത കർമം
  choice: ഇതു കണ്ട
  alternative: അവനെ അനുഗമിക്കുന്നതു കണ്ട
  rationale: ഗ്രീക്ക് പാഠം അവർ കണ്ടതിന്റെ കർമം തുറന്നുപറയുന്നില്ല. അതിനാൽ സൗഖ്യവും തുടർന്നുള്ള പ്രതികരണവും ഉൾക്കൊള്ളാവുന്ന 'ഇതു' എന്ന വിശാല സൂചന ഉപയോഗിച്ച് യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: ദൈവത്തോടുള്ള പ്രതികരണങ്ങൾക്കിടയിലെ പദവ്യത്യാസം
  choice: മഹത്ത്വപ്പെടുത്തിക്കൊണ്ട് ... സ്തുതിച്ചു
  alternative: സ്തുതിച്ചുകൊണ്ട് ... സ്തുതി നൽകി
  rationale: δοξάζων, αἶνον എന്നീ വ്യത്യസ്ത ഗ്രീക്ക് പദങ്ങളുടെ ഭേദം മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. 'മഹത്ത്വപ്പെടുത്തുക' എന്ന സഭാപരിചിത പദം സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്നതും δοξάζω–αἶνος പദവ്യത്യാസം നിലനിർത്തുന്നതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
