id: LUK.18.15
reference: Luke 18:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: ml
  text: ശിശുക്കളെപ്പോലും[a] അവന്റെ അടുക്കൽ കൊണ്ടുവരികയായിരുന്നു, അവൻ അവരെ തൊടാൻ വേണ്ടി[c]; എന്നാൽ ശിഷ്യന്മാർ അതു കണ്ടപ്പോൾ അവരെ ശാസിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘കുഞ്ഞുങ്ങളെ.’ ഗ്രീക്ക് പദം വളരെ ചെറിയ കുട്ടികളെ, പ്രത്യേകിച്ച് ശിശുക്കളെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ശിശുക്കളെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്നവരെ.
    reason: referent_clarification
  - marker: c
    text: സമാന്തരവിവരണങ്ങളിൽ യേശുവിന്റെ ഈ സ്പർശം കുട്ടികളെ അനുഗ്രഹിക്കുന്നതോടും അവരുടെമേൽ കൈവയ്ക്കുന്നതോടും ബന്ധപ്പെട്ടിരിക്കുന്നു (മത്തായി 19:13; മർക്കോസ് 10:13, 16 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: Προσέφερον
  choice: കൊണ്ടുവരികയായിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്നോ ആവർത്തിച്ചിരുന്നോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: ആദ്യത്തേത് പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല; രണ്ടാമത്തേത് ‘എന്നാൽ’
  rationale: ആദ്യ δὲ നേരിയ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ നിർബന്ധമായി ഒരു പദം ചേർക്കാതെ പ്രവാഹത്തിലൂടെ അതിന്റെ ധർമ്മം വ്യക്തമാകുന്നു. രണ്ടാമത്തേത് ശിഷ്യന്മാരുടെ പ്രതികരണവുമായി വരുന്ന വ്യത്യാസം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: καὶ τὰ βρέφη
  choice: ശിശുക്കളെപ്പോലും
  rationale: βρέφη വളരെ ചെറിയ കുട്ടികളെയോ കുഞ്ഞുങ്ങളെയോ സൂചിപ്പിക്കുന്നു; καὶ ഇവിടെ ഊന്നൽ നൽകുന്നതിനാൽ ‘പോലും’ ചേർത്തു.
- source_word: αὐτῷ
  choice: അവന്റെ അടുക്കൽ
  rationale: സന്ദർഭത്തിൽ സർവനാമം യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മൂലത്തിലെ സർവനാമരൂപം നിലനിർത്തി.
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: അവൻ അവരെ തൊടേണ്ടതിന്
  rationale: ἵνα ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ἅπτομαι എന്നത് ഇവിടെ നേരിട്ട് ‘തൊടുക’ എന്നാണ്. അനുഗ്രഹിക്കുക എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἰδόντες
  choice: അതു കണ്ടപ്പോൾ
  rationale: ക്രിയാവിശേഷണസ്വഭാവമുള്ള ഭൂതകാലകൃത്ത് ഇവിടെ സമയബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി; ‘അതു’ കൊണ്ടുവരുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: മൂലത്തിലെ നിർദ്ദിഷ്ട നാമപ്രയോഗത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐπετίμων
  choice: ശാസിച്ചു
  rationale: ἐπιτιμάω ശക്തമായ വിലക്കലോ ശാസനയോ സൂചിപ്പിക്കുന്നു; ‘ശാസിച്ചു’ ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτοῖς
  choice: അവരെ
  rationale: മൂലത്തിലെ സർവനാമം നിലനിർത്തുന്നു; ഏറ്റവും സ്വാഭാവികമായ മുൻപദം ശിശുക്കളെ കൊണ്ടുവന്ന ആളുകളാണ്, എന്നാൽ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: ശിശുക്കളോടുള്ള യേശുവിന്റെ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: അവരെ തൊടുക
  alternative: അവരെ അനുഗ്രഹിക്കുക / അവരുടെമേൽ കൈവയ്ക്കുക
  rationale: ലൂക്കോസിന്റെ ഉടനെയുള്ള ഗ്രീക്ക് ക്രിയ ἅπτηται എന്നത് ‘തൊടുക’ എന്നാണ്. സമാന്തരവിവരണങ്ങൾ ഈ പ്രവൃത്തിയെ അനുഗ്രഹത്തോടും കൈവയ്ക്കലോടും ബന്ധിപ്പിക്കുന്നുവെങ്കിലും ആ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിച്ച പ്രവൃത്തിയെ ‘കൊണ്ടുവരികയായിരുന്നു’ എന്നു നൽകി; ‘തൊടുക’ എന്ന മൂലപദത്തിന്റെ നിയന്ത്രിതമായ അർഥം നിലനിർത്തി. സർവനാമത്തിന്റെ സാധ്യതയുള്ള ആശയക്കുഴപ്പം മുഖ്യവാചകം വികസിപ്പിച്ച് പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
