revisions:
- from: ആളുകൾ ശിശുക്കളെപ്പോലും[a] അവന്റെ അടുക്കൽ കൊണ്ടുവരികയായിരുന്നു, അവൻ അവരെ തൊടേണ്ടതിന്[c]. എന്നാൽ ശിഷ്യന്മാർ അതു കണ്ടപ്പോൾ അവരെ ശാസിച്ചു[b].
  to: ശിശുക്കളെപ്പോലും[a] അവന്റെ അടുക്കൽ കൊണ്ടുവരികയായിരുന്നു, അവൻ അവരെ തൊടാൻ വേണ്ടി[c]; എന്നാൽ ശിഷ്യന്മാർ അതു കണ്ടപ്പോൾ അവരെ ശാസിച്ചു[b].
  rationale: The revision removes an unnecessary explicit subject in order to preserve the Greek's implicit plural subject, improves the idiomatic Malayalam purpose clause, and restores the narrative continuity of the verse. Footnote markers and all footnotes remain correctly anchored and retain their original functions.
