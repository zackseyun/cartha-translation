translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ന്യായാധിപനെ പരാമർശിക്കാൻ ആദരസൂചകമല്ലാത്തതും അവഹേളനപരമല്ലാത്തതുമായ ‘അയാൾ’ ഉപയോഗിച്ചു. ആവർത്തനഭാവം വ്യക്തമായി സൂചിപ്പിക്കുകയും നിയമപരമായ അർഥത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
