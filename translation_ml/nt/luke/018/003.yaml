source:
  edition: SBLGNT
  text: χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα· Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: ml
  text: ആ പട്ടണത്തിൽ ഒരു വിധവ ഉണ്ടായിരുന്നു. അവൾ അയാളുടെ അടുക്കൽ വീണ്ടുംവീണ്ടും വന്ന്, ‘എന്റെ എതിരാളിക്കെതിരെ എനിക്കു നീതി ലഭ്യമാക്കണമേ[a]’ എന്നു പറയുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ എതിരാളിയിൽനിന്ന് എനിക്കു ന്യായപരിഹാരം ലഭ്യമാക്കണമേ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ നിയമപരമായ നീതിയോ അവകാശസ്ഥാപനമോ ഉറപ്പാക്കുക എന്ന അർഥം നൽകാം; വ്യക്തിപരമായ പ്രതികാരം ചെയ്യുക എന്നത് നിർബന്ധമായും ഉദ്ദേശിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: വിധവ
  rationale: ഭർത്താവ് മരിച്ച സ്ത്രീയെ സൂചിപ്പിക്കുന്ന കൃത്യവും സാധാരണവുമായ മലയാളപദം; ഉപമയിലെ സാമൂഹിക പശ്ചാത്തലവും നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തില്ല
  rationale: ഇവിടെ ഇത് കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ലഘുബന്ധകമാണ്; മലയാളത്തിൽ ‘ആ പട്ടണത്തിൽ’ എന്ന തുടക്കം തന്നെ സ്വാഭാവികമായി ബന്ധം വ്യക്തമാക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു ചേർത്താൽ അനാവശ്യമായ വൈരുധ്യഭാവം ഉണ്ടാകും.
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: ആ പട്ടണത്തിൽ ... ഉണ്ടായിരുന്നു
  rationale: അസ്തിത്വാർഥവും സ്ഥലസൂചനയും സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; πόλις എന്നതിന് ഇവിടെ ‘പട്ടണം’ സാധാരണ വായനക്കാർക്ക് യോജിച്ച പദമാണ്.
- source_word: ἤρχετο πρὸς αὐτόν
  choice: അയാളുടെ അടുക്കൽ വീണ്ടുംവീണ്ടും വന്ന്
  rationale: അപൂർണകാല ക്രിയ സന്ദർഭത്തിൽ ആവർത്തിച്ചുള്ള വരവ് സൂചിപ്പിക്കുന്നു; ‘വീണ്ടുംവീണ്ടും’ വിധവയുടെ നിരന്തരശ്രമം വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: λέγουσα
  choice: എന്നു പറയുമായിരുന്നു
  rationale: ആവർത്തിച്ചുള്ള വരവിനോടൊപ്പം ആവർത്തിച്ച അപേക്ഷയും ഉണ്ടായിരുന്നുവെന്ന ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Ἐκδίκησόν με
  choice: എനിക്ക് നീതി നടത്തിത്തരണമേ
  rationale: ന്യായാധിപനോടുള്ള നിയമപരമായ പരിഹാരത്തിന്റെയോ നീതിനിർവഹണത്തിന്റെയോ അപേക്ഷയാണ് ഇവിടെ പ്രധാനമായത്; വ്യക്തിപരമായ പ്രതികാരമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: എന്റെ എതിരാളിക്കെതിരെ
  rationale: ἀντίδικος നിയമവ്യവഹാരത്തിലെ എതിർകക്ഷിയെയോ പ്രതിയോഗിയെയോ സൂചിപ്പിക്കാം; ‘എതിരാളി’ ഈ നിയമപരവും പൊതുവുമായ അർഥം നിലനിർത്തുന്നു.
