source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: ml
  text: 'മുന്നിൽ നടന്നിരുന്നവർ അവൻ മിണ്ടാതിരിക്കാൻ അവനെ ശാസിച്ചുകൊണ്ടിരുന്നു. എന്നാൽ അവൻ അതിലും അധികമായി നിലവിളിച്ചുകൊണ്ടിരുന്നു: “ദാവീദിന്റെ പുത്രാ, എന്നോടു കരുണ കാണിക്കണമേ!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: മുമ്പിൽ നടന്നുപോയിരുന്നവർ
  rationale: വർത്തമാന കർത്തൃവാചക കൃദന്തം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു; ജനക്കൂട്ടത്തിൽ മുന്നിലായി നടന്നിരുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്. അവരുടെ നേതൃത്വപങ്ക് അനുമാനിക്കാതെ സ്ഥാനപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐπετίμων
  choice: ശാസിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലം തുടരുന്ന അഥവാ ആവർത്തിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ശാസിക്കുക’ എന്നത് വെറും മുന്നറിയിപ്പിനെക്കാൾ ശക്തമായ ശാസനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἵνα σιγήσῃ
  choice: അവനെ നിശ്ശബ്ദനാക്കാൻ
  rationale: ἵνα + വിധിലിംഗം ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിലെ കാര്യകാരണരൂപം ആ ലക്ഷ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: αὐτὸς δὲ
  choice: എന്നാൽ അവൻ
  rationale: സന്ദർഭത്തിലെ വൈരുധ്യവും സർവനാമത്തിന്റെ ഊന്നലും ‘എന്നാൽ’ വഴി പ്രകടമാക്കുന്നു; അനാവശ്യമായി ‘അവൻ തന്നെയോ’ എന്നു ഭാരം കൂട്ടുന്നില്ല.
- source_word: πολλῷ μᾶλλον
  choice: പിന്നെയും അധികമായി
  rationale: തടയാൻ ശ്രമിച്ചിട്ടും അവന്റെ നിലവിളി കൂടുതൽ ശക്തമായി തുടർന്നു എന്ന താരതമ്യവർധന നിലനിർത്തുന്നു; മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘ഉച്ചത്തിൽ’ ചേർക്കുന്നില്ല.
- source_word: ἔκραζεν
  choice: നിലവിളിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലത്തിന്റെ തുടർച്ചാപരവും ആവർത്തനപരവുമായ ഭാവം ‘-കൊണ്ടിരുന്നു’ രൂപം പകർത്തുന്നു. ‘നിലവിളിക്കുക’ അടിയന്തരമായ ഉറച്ച വിളിയെ സൂചിപ്പിക്കുന്നു.
- source_word: Υἱὲ Δαυίδ
  choice: ദാവീദിന്റെ പുത്രാ
  rationale: സംബോധനരൂപത്തിലുള്ള ദാവീദീയ-മശീഹാ പദവി വിവർത്തനം ചെയ്ത് അതിന്റെ രാജകീയവും ക്രിസ്തുശാസ്ത്രപരവുമായ പ്രാധാന്യം നിലനിർത്തുന്നു.
- source_word: ἐλέησόν με
  choice: എന്നോടു കരുണ കാണിക്കണമേ
  rationale: അടിയന്തരമായ അപേക്ഷയും കരുണയ്ക്കായുള്ള അഭ്യർഥനയും മാന്യവും സാധാരണക്കാർക്ക് വ്യക്തവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: Υἱὲ Δαυίδ എന്നതിന്റെ മശീഹാ പ്രാധാന്യം
  choice: പ്രധാന പാഠത്തിൽ ‘ദാവീദിന്റെ പുത്രാ’ എന്ന പദവിയായി വിവർത്തനം ചെയ്തു.
  alternative: വെറും ആദരസംബോധനയായി വ്യാഖ്യാനിക്കുകയോ വിശദീകരണം ചേർക്കുകയോ ചെയ്യുക.
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനത്തിൽ ഇത് ദാവീദീയ-മശീഹാ അർഥസമ്പന്നമായ പദവിയാണ്. വ്യാഖ്യാനവികാസം ചേർക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നത് ആ പ്രാധാന്യം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി. അപൂർണകാല ക്രിയകളുടെ തുടർച്ച ‘ശാസിച്ചുകൊണ്ടിരുന്നു’, ‘നിലവിളിച്ചുകൊണ്ടിരുന്നു’ എന്നിവയിലൂടെ സൂക്ഷിച്ചു. സംഭാഷണത്തിലെ അപേക്ഷയ്ക്ക് ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും ഇന്നത്തെ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘കരുണ കാണിക്കണമേ’ ഉപയോഗിച്ചു.
