reference: Luke 18:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: ml
  text: 'കൽപ്പനകൾ നിനക്ക് അറിയാമല്ലോ: വ്യഭിചാരം ചെയ്യരുത്; കൊല ചെയ്യരുത്; മോഷ്ടിക്കരുത്; കള്ളസാക്ഷ്യം പറയരുത്; നിന്റെ അപ്പനെയും അമ്മയെയും ബഹുമാനിക്കുക.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: കൽപ്പനകൾ
  rationale: ഇവിടെ ἐντολή സുപരിചിതമായ പത്തു കൽപ്പനകളിലെ ആജ്ഞകളെ സൂചിപ്പിക്കുന്നതിനാൽ, ബൈബിൾപരവും നിയമപരവുമായ അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: οἶδας
  choice: നിനക്ക് അറിയാമല്ലോ
  rationale: οἶδα രൂപത്തിൽ പൂർണകാലമാണെങ്കിലും കൊയ്നേ ഗ്രീക്കിൽ വർത്തമാനാർഥത്തിലാണ്. സന്ദർഭത്തിൽ ഇതിനകം സുപരിചിതമായ കൽപ്പനകൾ ഓർമിപ്പിക്കുന്ന ഭാവവും ‘അറിയാമല്ലോ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Μὴ μοιχεύσῃς
  choice: വ്യഭിചാരം ചെയ്യരുത്
  rationale: μοιχεύω വിവാഹവിശ്വസ്തത ലംഘിക്കുന്ന വ്യഭിചാരത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ കൽപ്പനയുടെ ധാർമിക കൃത്യത നിലനിർത്തുന്നു.
- source_word: Μὴ φονεύσῃς
  choice: കൊല ചെയ്യരുത്
  rationale: φονεύω എല്ലാത്തരം കൊല്ലലിനെയുംക്കാൾ അന്യായമായ മനുഷ്യഹത്യയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കൊല ചെയ്യരുത്’ ആ വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: Μὴ κλέψῃς
  choice: മോഷ്ടിക്കരുത്
  rationale: κλέπτω എന്നതിന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാള തർജമ.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: കള്ളസാക്ഷ്യം പറയരുത്
  rationale: ψευδομαρτυρέω കള്ളസാക്ഷ്യം പറയുക അഥവാ വ്യാജമായി സാക്ഷ്യപ്പെടുത്തുക എന്നാണ്. പത്തു കൽപ്പനകളുമായുള്ള അന്തർപാഠബന്ധം നിലനിർത്താൻ പരമ്പരാഗതമായി തിരിച്ചറിയാവുന്ന ഈ പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: Τίμα
  choice: ബഹുമാനിക്കുക
  rationale: τιμάω ഇവിടെ മാതാപിതാക്കൾക്ക് അർഹമായ ബഹുമാനം നൽകുക എന്ന ഉടമ്പടിപരവും ധാർമികവുമായ അർഥത്തിലാണ്.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: നിന്റെ അപ്പനെയും അമ്മയെയും
  rationale: ഗ്രീക്ക് രണ്ടു മാതാപിതാക്കളെയും നേരിട്ട് പേരെടുത്തു പറയുന്നു. ‘അപ്പൻ’ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്; ആവർത്തിച്ച ഉടമസ്ഥസർവനാമം മലയാളത്തിൽ ആവശ്യമില്ല.
theological_decisions:
- issue: പത്തു കൽപ്പനകളുടെ ശൈലിയിലുള്ള നിരോധനങ്ങളുടെ പരിഭാഷ
  choice: ആധുനിക നേരിട്ടുള്ള നിരോധനരൂപം (‘ചെയ്യരുത്’) ഉപയോഗിച്ചു.
  alternative: പരമ്പരാഗത പ്രഖ്യാപനശൈലിയിലുള്ള രൂപം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിൽ നിരോധനാർഥകമായ aorist subjunctive രൂപങ്ങളാണ്. ‘ചെയ്യരുത്’ ഇന്നത്തെ മലയാളത്തിൽ ആജ്ഞയുടെ ശക്തി വ്യക്തമായി നൽകുന്നു; ഇത് ശൈലീപരമായ തീരുമാനമാണ്, ഉപദേശപരമായ വ്യാഖ്യാനമല്ല.
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനിക നിലവാരമലയാളം; അതേസമയം പത്തു കൽപ്പനകളുടെ ഗൗരവവും തിരിച്ചറിയാവുന്ന ബൈബിൾപദാവലിയും നിലനിർത്തി. നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് ഏകവചനമായ ‘നിനക്ക്/നിന്റെ’ ഉപയോഗിച്ചു.
