id: LUK.18.7
reference: Luke 18:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: ml
  text: ദൈവം രാവും പകലും തന്നോടു നിലവിളിക്കുന്ന തന്റെ തിരഞ്ഞെടുത്തവർക്ക് നീതി നടത്തിക്കൊടുക്കുകയില്ലയോ? അവരുടെ കാര്യത്തിൽ അവൻ ഏറെ താമസിക്കുമോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരോട് ദീർഘക്ഷമ കാണിക്കുന്നുവെങ്കിലും” എന്നും “അവരോട് അവൻ ദീർഘക്ഷമ കാണിക്കുന്നുണ്ടോ?” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം താമസത്തെക്കാൾ ക്ഷമയെയോ ദീർഘക്ഷമയെയോ സൂചിപ്പിക്കാനും കഴിയും.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: നീതി നടത്തിക്കൊടുക്കുക
  rationale: അന്യായാധിപന്റെയും നിരന്തരമായ അപേക്ഷയുടെയും പശ്ചാത്തലത്തിൽ, വ്യക്തിപരമായ പ്രതികാരത്തേക്കാൾ നിയമപരമായ നീതിയും അവകാശസ്ഥാപനവും സൂചിപ്പിക്കുന്നു.
- source_word: ἐκλεκτῶν
  choice: തിരഞ്ഞെടുത്തവർ
  rationale: വിശേഷണം നാമമായി പ്രയോഗിച്ചിരിക്കുന്നു. ദൈവം തിരഞ്ഞെടുത്തവരെ സൂചിപ്പിക്കുമ്പോഴും ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചുമത്തുന്നില്ല.
- source_word: βοώντων
  choice: നിലവിളിക്കുന്ന
  rationale: തീവ്രവും ആവർത്തിച്ചുകൊണ്ടിരിക്കുന്നതുമായ അപേക്ഷയുടെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἡμέρας καὶ νυκτός
  choice: രാവും പകലും
  rationale: നിരന്തരമായ അപേക്ഷ എന്ന കാലപരമായ ഊന്നൽ നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: അവരുടെ കാര്യത്തിൽ അവൻ ഏറെ താമസിക്കുമോ?
  rationale: വാക്യഭാഗം ക്ഷമയെയോ ദീർഘക്ഷമയെയോ, അല്ലെങ്കിൽ നടപടി വൈകിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം. അടുത്ത വാക്യത്തിലെ വേഗത്തിലുള്ള നീതിയുടെ ഉറപ്പിനോട് ചേർന്ന് പ്രധാന പാഠത്തിൽ താമസത്തിന്റെ അർത്ഥം നൽകിയെങ്കിലും മറ്റർത്ഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: οὐ μὴ ποιήσῃ
  choice: നടത്തിക്കൊടുക്കുകയില്ലയോ?
  rationale: ശക്തമായ നിഷേധം ഉൾക്കൊള്ളുന്ന ഈ അലങ്കാരചോദ്യം അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്നു; മലയാളത്തിലെ നിഷേധചോദ്യരൂപം ആ ശക്തി സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: θεὸς
  choice: ദൈവം
  rationale: സാധാരണവും സന്ദർഭോചിതവുമായ വിവർത്തനം.
theological_decisions:
- issue: μακροθυμεῖ ἐπ’ αὐτοῖς എന്നതിന്റെ അർത്ഥവും ദൈവത്തിന്റെ സ്വഭാവത്തോടും പ്രവർത്തനത്തോടുമുള്ള ബന്ധവും
  choice: പ്രധാന പാഠത്തിൽ ദൈവം നടപടി ഏറെ താമസിക്കുമോ എന്ന ചോദ്യമായി നൽകി.
  alternative: “അവരോടു ദീർഘക്ഷമ കാണിക്കുന്നുവെങ്കിലും” അല്ലെങ്കിൽ “അവരോടു അവൻ ദീർഘക്ഷമ കാണിക്കുന്നുണ്ടോ?”
  rationale: ഗ്രീക്ക് പ്രയോഗം ദീർഘക്ഷമയെ സൂചിപ്പിക്കാനും കഴിയും; എന്നാൽ തൊട്ടടുത്ത സന്ദർഭം ദൈവം വേഗത്തിൽ നീതി നടത്തുന്നതിനെ ഊന്നുന്നു. ആശയത്തിലെ യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ നീതിയുടെ ഭാവവും അലങ്കാരചോദ്യങ്ങളുടെ ശക്തിയും നിലനിർത്തി; സാങ്കേതിക സഭാപദാവലി ഒഴിവാക്കി.
