source:
  edition: SBLGNT
  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: ml
  text: രണ്ടു പുരുഷന്മാർ പ്രാർഥിക്കാൻ ദേവാലയത്തിലേക്കു കയറിപ്പോയി[a]; ഒരാൾ പരീശനും മറ്റേയാൾ നികുതിപിരിവുകാരനും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടത്തെ ഗ്രീക്ക് പദമായ ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദേവാലയസമുച്ചയത്തെയും അതിന്റെ അങ്കണങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: രണ്ടു പുരുഷന്മാർ
  rationale: ἄνθρωποι പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കാമെങ്കിലും, തുടർന്നുള്ള പുൽലിംഗ ഏകവചന പ്രയോഗങ്ങളും വ്യക്തികളുടെ തിരിച്ചറിയലും ഇവിടെ പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀνέβησαν
  choice: കയറിപ്പോയി
  rationale: ἀναβαίνω എന്നതിലെ ‘മുകളിലേക്കു പോകുക’ എന്ന ദിശാബോധം നിലനിർത്തുകയും ദേവാലയത്തിലേക്കുള്ള യാത്രയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς τὸ ἱερὸν
  choice: ദേവാലയത്തിലേക്കു
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പ്രധാനവാക്യത്തിൽ സ്വാഭാവികമായ ‘ദേവാലയം’ ഉപയോഗിച്ച് കൃത്യമായ സൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: προσεύξασθαι
  choice: പ്രാർഥിക്കാൻ
  rationale: അയോറിസ്റ്റ് മധ്യമവാചക അനന്തക്രിയ ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; ‘പ്രാർഥിക്കാൻ’ അതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപമാണ്.
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: ഒരാൾ ... മറ്റേയാൾ
  rationale: വിതരണപരമായ വിരുദ്ധജോടിയെ മലയാളത്തിൽ സ്വാഭാവികമായും കൃത്യമായും അവതരിപ്പിക്കുന്നു.
- source_word: Φαρισαῖος
  choice: പരീശൻ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിനുള്ള മലയാളത്തിലെ സ്ഥാപിതമായ പേരാണ്.
- source_word: τελώνης
  choice: നികുതിപിരിവുകാരൻ
  rationale: നികുതിയോ ചുങ്കമോ പിരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന τελώνης എന്ന പദത്തിന് വ്യക്തവും ആധുനികവുമായ മലയാളപരിഭാഷ.
theological_decisions:
- issue: ἱερόν എന്നതിനെ ναός എന്നതിൽനിന്ന് വേർതിരിച്ചു സൂചിപ്പിക്കൽ
  choice: പ്രധാനവാക്യത്തിൽ ‘ദേവാലയം’; അടിക്കുറിപ്പിൽ ‘ദേവാലയസമുച്ചയം/അങ്കണങ്ങൾ’ എന്ന വിശദീകരണം
  alternative: ദേവാലയസമുച്ചയത്തിലേക്ക്
  rationale: മൂലപദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല. വായനാസൗകര്യത്തിനായി പരിചിതമായ പദം പ്രധാനവാക്യത്തിൽ നിലനിർത്തി അതിന്റെ കൃത്യമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἄνθρωποι എന്നതിന്റെ ലിംഗസൂചന
  choice: പുരുഷന്മാർ
  alternative: ആളുകൾ
  rationale: പദം പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കാമെങ്കിലും ഈ സന്ദർഭത്തിലെ പുൽലിംഗ നിർദേശങ്ങളും കഥാപാത്രങ്ങളുടെ തിരിച്ചറിയലും രണ്ടു പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കയറിപ്പോയി’ എന്നത് മൂലത്തിലെ മുകളിലേക്കുള്ള സഞ്ചാരസൂചന നിലനിർത്തുന്നു; ‘പരീശൻ’, ‘നികുതിപിരിവുകാരൻ’ എന്നിവ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ രൂപങ്ങളാണ്.
