  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അവനോട് പറഞ്ഞു: “നസറായനായ യേശു ഇതുവഴി കടന്നുപോകുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നസറെത്തിൽനിന്നുള്ള യേശു ഇതുവഴി കടന്നുപോകുന്നു.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “നസറായനായ യേശു” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: അവർ അവനോട് പറഞ്ഞു
  rationale: വിവരം അറിയിക്കുക, പറയുക എന്ന അർഥമാണ് ഇവിടെ; അന്ധനായ മനുഷ്യന്റെ ചോദ്യത്തിനുള്ള സാധാരണ സംഭാഷണപരമായ മറുപടിയായി ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമായതിനാൽ വൈരുധ്യം അമിതമാക്കാതെ സംഭവക്രമം വ്യക്തമാക്കുന്നു.
- source_word: ὅτι
  choice: നേരിട്ടുള്ള ഉദ്ധരണി
  rationale: ὅτι പരോക്ഷവചനത്തെ പരിചയപ്പെടുത്തുന്നുവെങ്കിലും മലയാളത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണി സ്വാഭാവികവും ഉള്ളടക്കത്തിൽ വിശ്വസ്തവുമാണ്.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: മലയാളത്തിലെ അംഗീകൃത നാമരൂപം.
- source_word: ὁ Ναζωραῖος
  choice: നസറായനായ
  rationale: ഗ്രീക്കിലെ വിശേഷണാത്മകമായ സ്ഥാനനാമ-വിശേഷണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘നസറെത്തിൽനിന്നുള്ള’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: παρέρχεται
  choice: ഇതുവഴി കടന്നുപോകുന്നു
  rationale: ഇപ്പോൾ നടന്നുകൊണ്ടിരിക്കുന്ന ചലനത്തിന്റെ അടിയന്തരതയും സമീപത്തുകൂടി പോകുന്നുവെന്ന സന്ദർഭാർഥവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ സൂചിപ്പിക്കുന്ന Ναζωραῖος എന്ന വിശേഷണം
  choice: നസറായനായ
  alternative: നസറെത്തിൽനിന്നുള്ള
  rationale: ഇത് പ്രധാനമായും ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയൽവിശേഷണമാണ്; അധികമായ ക്രിസ്തുശാസ്ത്രപരമോ സമുദായപരമോ ആയ അർഥം ചേർക്കാതെ ഗ്രീക്ക് രൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘നസറായനായ’ എന്ന രൂപം മൂലപാഠത്തിലെ വിശേഷണപരമായ designation നിലനിർത്തുന്നു; കൂടുതൽ സാധാരണമായ ഭൂമിശാസ്ത്രപരമായ വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
