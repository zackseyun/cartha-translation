  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: ml
  text: കാരണം, അവൻ വിജാതീയർക്ക്[a] ഏൽപ്പിക്കപ്പെടുകയും പരിഹസിക്കപ്പെടുകയും അപമാനിക്കപ്പെടുകയും[b] അവന്റെമേൽ തുപ്പപ്പെടുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനതകൾക്ക്.’ ഇവിടെ ഇത് പ്രത്യേകിച്ച് യഹൂദരല്ലാത്തവരെ, അതായത് വിജാതീയരെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
