- from: അവൻ ജനതകളുടെ[a] കൈയിൽ ഏൽപ്പിക്കപ്പെടും; അവർ അവനെ പരിഹസിക്കുകയും അപമാനിക്കുകയും[b] അവന്റെമേൽ തുപ്പുകയും ചെയ്യും.
