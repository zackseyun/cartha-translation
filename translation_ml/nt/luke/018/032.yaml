    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: കൈയിൽ ഏൽപ്പിക്കപ്പെടും
  rationale: ഭാവികാല കർമണി രൂപം നിലനിർത്തുന്നു. ആരാണ് ഏൽപ്പിക്കുന്നത് എന്നത് വ്യക്തമാക്കാതെ, മറ്റുള്ളവരുടെ അധികാരത്തിലേക്ക് കൈമാറപ്പെടുക എന്ന വിശാലമായ അർഥം നൽകുന്നു; ‘വഞ്ചിക്കപ്പെടും’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: γὰρ
  choice: (പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: γάρ മുൻവാക്യത്തിന്റെ വിശദീകരണം അവതരിപ്പിക്കുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ ‘എന്തെന്നാൽ’ അസ്വാഭാവികമാകുന്നതിനാൽ, വിശദീകരണബന്ധം വാക്യത്തിന്റെ പ്രവചനാത്മക ഒഴുക്കിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: τοῖς ἔθνεσιν
  choice: ജനതകളുടെ കൈയിൽ
  rationale: ἔθνη എന്നതിന്റെ അടിസ്ഥാനമായ ‘ജനതകൾ’ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ യഹൂദരല്ലാത്തവരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു. ദാതൃവിഭക്തിയുടെ കൈമാറ്റസംബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘കൈയിൽ’ ചേർത്തു.
- source_word: ἐμπαιχθήσεται
  choice: പരിഹസിക്കുകയും
  rationale: അവഹേളനപരമായ കളിയാക്കലും പരിഹാസവും സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: ὑβρισθήσεται
  choice: അപമാനിക്കുകയും
  rationale: ὑβρίζω സൂചിപ്പിക്കുന്ന നിന്ദാകരവും ലജ്ജാകരവുമായ പെരുമാറ്റം ഉൾക്കൊള്ളുന്നു. ഇത് വാക്കുകൊണ്ടുള്ള അധിക്ഷേപത്തിൽ മാത്രം ഒതുക്കുന്നില്ല; വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐμπτυσθήσεται
  choice: അവന്റെമേൽ തുപ്പുകയും
  rationale: പ്രവൃത്തിയുടെ മൂർത്തമായ അപമാനം നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: കർമണി ക്രിയകളിലെ പരോക്ഷ കർത്തൃവിഷയത്തിന്റെ സൂചന
  choice: മുൻസന്ദർഭത്തിലെ മനുഷ്യപുത്രനെ സൂചിപ്പിച്ച് ‘അവൻ/അവനെ’ ചേർത്തു
  alternative: വ്യാകരണപരമായ വിഷയത്തെ പ്രകടമാക്കാതെ കർമണി രൂപങ്ങൾ മാത്രം ഉപയോഗിക്കുക
  rationale: ഗ്രീക്കിൽ ഈ വാക്യത്തിനുള്ളിൽ വിഷയം പ്രത്യേകം പറഞ്ഞിട്ടില്ലെങ്കിലും ലൂക്കോസ് 18:31-ൽനിന്ന് അത് വ്യക്തമാണ്. സ്വാഭാവിക മലയാളത്തിനായി സർവനാമം ചേർക്കുന്നത് പുതിയ ദൈവശാസ്ത്രപരമായ ഉള്ളടക്കം നൽകുന്നില്ല.
- issue: പീഡനപ്രവൃത്തികളുടെ കർത്താവ്
  choice: ആദ്യത്തെ കർമണി രൂപത്തിനു ശേഷം ‘അവർ’ ഉപയോഗിച്ച് ജനതകളെ പ്രവർത്തകരായി വ്യക്തമാക്കി
  alternative: എല്ലാ ക്രിയകളും കർമണി രൂപത്തിൽ നിലനിർത്തുക
  rationale: ഗ്രീക്കിലെ തുടർച്ചയായ കർമണി രൂപങ്ങളുടെ സ്വാഭാവിക അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ ഭാരമുള്ള ആവർത്തനം ഒഴിവാക്കുന്നു. ‘അവർ’ എന്നത് τοῖς ἔθνεσιν എന്ന അടുത്തുള്ള ബഹുവചന പരാമർശത്തിലേക്ക് തിരിച്ചുപോകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ കർമണി തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ആദ്യ ക്രിയയിൽ കർമണി നിലനിർത്തി, പിന്നത്തെ പ്രവൃത്തികൾ സകർമകമായി ബന്ധിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ പ്രധാനവാചകത്തിൽ നൽകിയിട്ടുണ്ട്.
