id: LUK.18.22
reference: Luke 18:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: ml
  text: 'ഇതു കേട്ടപ്പോൾ യേശു അവനോടു പറഞ്ഞു: “നിനക്ക് ഇനിയും ഒരു കാര്യം കുറവുണ്ട്:[a] നിനക്കുള്ളതെല്ലാം വിറ്റ് ദരിദ്രർക്കു പങ്കിട്ടുകൊടുക്കുക; അപ്പോൾ സ്വർഗങ്ങളിൽ നിനക്കു നിധിയുണ്ടാകും.[b] വന്ന് എന്നെ അനുഗമിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു കാര്യം ഇനിയും നിനക്കു കുറവായിരിക്കുന്നു.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, “ഒരു കാര്യം ഇനിയും നിനക്കു കുറവുണ്ട്.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “സ്വർഗങ്ങൾ” എന്ന ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: ഇതു കേട്ടപ്പോൾ യേശു
  rationale: Aorist participle and δέ are naturally expressed as a temporal clause. “ഇതു” supplies the contextual object without altering the sequence.
- source_word: Ἔτι ἕν σοι λείπει
  choice: നിനക്ക് ഇനിയും ഒരു കാര്യം കുറവുണ്ട്
  rationale: Preserves the Greek construction in which “one thing” is lacking for the man, while remaining natural in modern Malayalam.
- source_word: πάντα ὅσα ἔχεις πώλησον
  choice: നിനക്കുള്ളതെല്ലാം വിറ്റ്
  rationale: Conveys the comprehensive force of πάντα ὅσα and the decisive imperative πώλησον in concise Malayalam.
- source_word: διάδος πτωχοῖς
  choice: ദരിദ്രർക്കു പങ്കിട്ടുകൊടുക്കുക
  rationale: “പങ്കിട്ടുകൊടുക്കുക” preserves διαδίδωμι’s distributive sense rather than reducing it to generic giving.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: സ്വർഗങ്ങളിൽ നിനക്കു നിക്ഷേപമുണ്ടാകും
  rationale: Retains the source plural οὐρανοῖς and renders θησαυρός with the established, intelligible biblical term “നിക്ഷേപം.”
- source_word: δεῦρο ἀκολούθει μοι
  choice: പിന്നെ വന്ന് എന്നെ അനുഗമിക്കുക
  rationale: “വന്ന്” reflects δεῦρο, while “അനുഗമിക്കുക” naturally conveys the continuing discipleship force of the present imperative.
theological_decisions:
- issue: ശിഷ്യത്വവും സമ്പത്തിന്റെ പരിത്യാഗവും
  choice: ഈ വ്യക്തിയോടുള്ള യേശുവിന്റെ വ്യക്തവും പ്രായോഗികവുമായ കല്പനയും അതിന്റെ പരമലക്ഷ്യമായ ‘എന്നെ അനുഗമിക്കുക’ എന്ന വിളിയും അതേ ശക്തിയിൽ നിലനിർത്തി.
  alternative: ഇത് എല്ലാ വിശ്വാസികൾക്കും നൽകിയ സമ്പൂർണ സ്വത്തുത്യാഗത്തിന്റെ സർവത്രിക നിയമമാണെന്നോ, യാതൊരു സാമ്പത്തിക പ്രയോഗവുമില്ലാത്ത പ്രതീകാത്മക കല്പന മാത്രമാണെന്നോ വിവർത്തനത്തിൽ നിർണ്ണയിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം ഈ വ്യക്തിയോടു മൂർത്തമായ കല്പനകൾ നൽകുന്നു; എന്നാൽ ഈ ഒറ്റ വാക്യം അവയുടെ സർവത്രിക വ്യാപ്തി വിശദീകരിക്കുന്നില്ല. അതിനാൽ വിവർത്തനം ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. “പങ്കിട്ടുകൊടുക്കുക” വിതരണത്തിന്റെ സൂക്ഷ്മാർഥം നിലനിർത്തുന്നു; “സ്വർഗങ്ങളിൽ” മൂലപാഠത്തിലെ ബഹുവചനം സംരക്ഷിക്കുന്നു. കല്പനകളുടെ നേരിട്ടുള്ള ശക്തി മൃദൂകരിച്ചിട്ടില്ല.
