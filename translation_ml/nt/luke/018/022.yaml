    issue: ‘നിക്ഷേപം’ for θησαυρός
    rationale: In modern Malayalam, ‘നിക്ഷേപം’ commonly means an investment or bank deposit. θησαυρός here means ‘treasure’; ‘നിധി’ conveys this without importing a financial-investment sense.
  - severity: low
    issue: ‘പിന്നെ’ adds an explicit sequential nuance
    rationale: The Greek has καὶ δεῦρο (‘and come’), not an explicit ‘then.’ Malayalam can express the invitation naturally as ‘വന്ന്’ without this addition.
