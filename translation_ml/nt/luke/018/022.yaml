  naturalness: The wording is clear, modern, and appropriately dignified. ‘സ്വർഗങ്ങളിൽ നിനക്കു നിധിയുണ്ടാകും’ is both natural enough in this biblical register and preserves the Greek plural. Omitting ‘പിന്നെ’ avoids adding an explicit sequential adverb not present in the source.
