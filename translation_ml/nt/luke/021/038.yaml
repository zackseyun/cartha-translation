    rationale: Although contextually plausible, ‘his words’ is not expressed in Greek. «അവനെ കേൾക്കുക» is both natural Malayalam and closer to the genitive construction after ἀκούω.
  - severity: low
    issue: The cultural-note marker is placed at the end of the sentence rather than with «ദേവാലയത്തിൽ».
    rationale: The note specifically explains ἱερόν; placing its anchor immediately after the corresponding Malayalam term makes the reference clear.
