source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ λαὸς ὤρθριζεν πρὸς αὐτὸν ἐν τῷ ἱερῷ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: ml
  text: ജനമെല്ലാം അതിരാവിലെ ദേവാലയത്തിൽ[a] അവന്റെ അടുക്കൽ വന്ന് അവനെ കേൾക്കുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദമായ ἱερόν ദേവാലയത്തിന്റെ ഉള്ളിലെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെയോ അതിന്റെ പ്രാകാരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: ജനമെല്ലാം
  rationale: ജനസമൂഹത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കൂട്ടായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഓരോ വ്യക്തിയും ഒഴിവില്ലാതെ എന്ന അതിരുകടന്ന ഊന്നൽ ഇതിൽ നിർബന്ധിതമല്ല.
- source_word: ὤρθριζεν
  choice: അതിരാവിലെ ... വന്ന് ... കേൾക്കുമായിരുന്നു
  rationale: ὀρθρίζω എന്ന ക്രിയയിലെ അതിരാവിലെ വരുക/എത്തുക എന്ന കാലസൂചനയും അപൂർണഭൂതകാലത്തിലെ പതിവായി ആവർത്തിച്ച പ്രവൃത്തിയും ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: πρὸς αὐτόν
  choice: അവന്റെ അടുക്കൽ
  rationale: ഒരു വ്യക്തിയുടെ അടുത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന πρός + accusative എന്ന ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയത്തിൽ
  rationale: ἱερόν ദേവാലയസമുച്ചയത്തെയും പ്രാകാരങ്ങളെയും സൂചിപ്പിക്കുന്നു. വായനാസൗകര്യത്തിനായി മുഖ്യവാചകത്തിൽ സാധാരണ പ്രയോഗം നിലനിർത്തി, കൃത്യമായ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀκούειν αὐτοῦ
  choice: അവന്റെ വാക്കുകൾ കേൾക്കാൻ
  rationale: ഇവിടെ infinitive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. genitive സഹിതമുള്ള ἀκούω യേശുവിനെ കേൾക്കുക/ശ്രദ്ധിക്കുക എന്നർഥം നൽകുന്നു; മലയാളത്തിൽ ‘അവന്റെ വാക്കുകൾ കേൾക്കാൻ’ എന്നത് സ്വാഭാവികവും ഉദ്ദേശ്യം വ്യക്തവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘കേൾക്കുമായിരുന്നു’ എന്ന രൂപം ആവർത്തിച്ച പതിവിനെ പ്രകടമാക്കുന്നു; ‘ദേവാലയം’ എന്ന പരിചിതപദത്തിന്റെ സാങ്കേതിക പരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
