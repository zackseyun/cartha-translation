id: LUK.21.37
reference: Luke 21:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: ml
  text: പകൽസമയങ്ങളിൽ അവൻ ദൈവാലയത്തിൽ[a] പഠിപ്പിച്ചുകൊണ്ടിരുന്നു; രാത്രികളിലാകട്ടെ, അവൻ പുറത്തേക്കു പോയി ഒലിവുമല എന്നു വിളിക്കപ്പെടുന്ന മലയിൽ രാത്രി കഴിക്കുമായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ദൈവാലയം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം (ἱερόν) അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദൈവാലയസമുച്ചയത്തെയോ അതിന്റെ പരിസരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘രാത്രി തങ്ങുമായിരുന്നു’; ഈ ക്രിയയ്ക്ക് തുറസ്സായ സ്ഥലത്ത് രാത്രി കഴിക്കുക എന്ന സൂചനയും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: εἰμί എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപവും വർത്തമാനകൃദ്യന്തമായ διδάσκων-ഉം ചേർന്ന് തുടരുന്നതും പതിവായിരുന്നതുമായ പ്രവർത്തനം സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം ആ ദൈർഘ്യസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: τὰς ἡμέρας
  choice: പകൽസമയങ്ങളിൽ
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ബഹുവചന അക്കുസറ്റീവിനെയും പകലും രാത്രിയും തമ്മിലുള്ള ആവർത്തിത വൈരുധ്യത്തെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, ദൈവാലയസമുച്ചയമാകെ സൂചിപ്പിക്കുന്നു. പൊതുവായ മലയാളവായനയ്ക്ക് ‘ദൈവാലയത്തിൽ’ സ്വാഭാവികമാണ്; കൃത്യമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰς δὲ νύκτας
  choice: രാത്രികളിലാകട്ടെ
  rationale: ബഹുവചനം സൂചിപ്പിക്കുന്ന ആവർത്തിത രാത്രികാലപ്രവർത്തനവും δέ അടയാളപ്പെടുത്തുന്ന പകൽ-രാത്രി വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: ἐξερχόμενος
  choice: പുറത്തേക്കു പോയി
  rationale: പ്രധാനക്രിയയോടൊപ്പമുള്ള ആവർത്തിത പുറപ്പെടൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ηὐλίζετο
  choice: രാത്രി കഴിക്കുമായിരുന്നു
  rationale: αὐλίζομαι എന്നത് രാത്രി തങ്ങുക അല്ലെങ്കിൽ രാത്രി കഴിക്കുക എന്നർഥം നൽകുന്നു; ചില സന്ദർഭങ്ങളിൽ തുറസ്സായ സ്ഥലത്തെ താമസവും സൂചിപ്പിക്കാം. ഇവിടെ താമസരീതി അനാവശ്യമായി നിർണയിക്കാതെ പതിവായ പ്രവർത്തനം അറിയിക്കുന്നു.
- source_word: εἰς τὸ ὄρος
  choice: മലയിൽ
  rationale: εἰς ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും താമസിക്കുന്ന ക്രിയയോടൊപ്പം എത്തിച്ചേർന്ന സ്ഥലമാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ ‘മലയിൽ രാത്രി കഴിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: ഒലിവുമല എന്നു വിളിക്കപ്പെടുന്ന
  rationale: Ἐλαιῶν എന്നത് ‘ഒലിവുകളുടെ/ഒലിവുമരങ്ങളുടെ’ എന്ന സ്ഥലപ്പേരാണ്. മലയാളത്തിൽ പരിചിതമായ ‘ഒലിവുമല’ ഉപയോഗിക്കുകയും καλούμενον എന്ന ഘടകം ‘എന്നു വിളിക്കപ്പെടുന്ന’ എന്ന് വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ആവർത്തിതമായ പകൽ-രാത്രി പ്രവർത്തനത്തെ ‘പകൽസമയങ്ങളിൽ’, ‘രാത്രികളിലാകട്ടെ’, ‘കഴിക്കുമായിരുന്നു’ എന്നീ രൂപങ്ങൾകൊണ്ട് പ്രകടമാക്കി. മൂലത്തിലെ രണ്ടു വ്യത്യസ്ത മലസൂചനകളും—‘മല’യും ‘ഒലിവുമല’ എന്ന പേരും—ഒഴിവാക്കാതെ നിലനിർത്തി.
