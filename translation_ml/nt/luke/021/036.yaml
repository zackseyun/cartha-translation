id: LUK.21.36
reference: Luke 21:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: ml
  text: എന്നാൽ എല്ലായ്പോഴും ജാഗരൂകരായിരിക്കുക; സംഭവിക്കാനിരിക്കുന്ന ഈ സകല കാര്യങ്ങളിൽനിന്നും ഒഴിഞ്ഞുമാറാനും മനുഷ്യപുത്രന്റെ മുമ്പിൽ നിൽക്കാനും നിങ്ങൾക്കു ശക്തിയുണ്ടാകേണ്ടതിന്[a] പ്രാർഥിച്ചുകൊണ്ടിരിക്കുക.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “സംഭവിക്കാനിരിക്കുന്ന ഈ സകല കാര്യങ്ങളിൽനിന്നും ഒഴിഞ്ഞുമാറാൻ നിങ്ങൾ യോഗ്യരായി എണ്ണപ്പെടേണ്ടതിന്” എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അല്ലെങ്കിൽ, “സംഭവിക്കാൻ പോകുന്ന.”
    reason: lexical_alternative
  - marker: c
    text: “മനുഷ്യപുത്രന്റെ മുമ്പിൽ നിൽക്കുക” എന്നത് അദ്ദേഹത്തിന്റെ സന്നിധിയിൽ അംഗീകരിക്കപ്പെട്ടവരോ നീതീകരിക്കപ്പെട്ടവരോ ആയി നിൽക്കുന്നതിനെ സൂചിപ്പിക്കാം; എന്നാൽ ഗ്രീക്ക് പാഠം ഇത് വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: ജാഗരൂകരായിരിക്കുക
  rationale: ശാരീരികമായി ഉണർന്നിരിക്കുന്നതെന്ന രൂപകവും ആത്മീയ ജാഗ്രതയെന്ന സന്ദർഭാർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻപുള്ള മുന്നറിയിപ്പിനോടുള്ള മൃദുവായ വൈരുധ്യവും പ്രഭാഷണത്തിലെ മാറ്റവും നിലനിർത്തുന്നു.
- source_word: ἐν παντὶ καιρῷ
  choice: എല്ലായ്പോഴും
  rationale: തുടർച്ചയായ ജാഗ്രത എന്ന വിതരണാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: δεόμενοι
  choice: പ്രാർഥിച്ചുകൊണ്ടിരിക്കുക
  rationale: അപേക്ഷാപൂർവമായ പ്രാർഥനയെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടർച്ചാഭാവം നിലനിർത്തുന്നു.
- source_word: ἵνα κατισχύσητε
  choice: നിങ്ങൾക്കു ശക്തിയുണ്ടാകേണ്ടതിന്
  rationale: SBLGNT-യിലെ κατισχύσητε എന്ന പാഠം യോഗ്യതയെക്കാൾ ശക്തിയുണ്ടാകുക, പ്രാപ്തരാകുക എന്ന ആശയമാണ് നൽകുന്നത്.
- source_word: ἐκφυγεῖν
  choice: ഒഴിഞ്ഞുമാറാനും
  rationale: വരാനിരിക്കുന്ന സംഭവങ്ങളിൽനിന്ന് രക്ഷപ്പെടുക എന്ന അർഥം സന്ദർഭോചിതമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: സംഭവിക്കാനിരിക്കുന്ന ഈ കാര്യങ്ങളിൽനിന്നെല്ലാം
  rationale: μέλλω + infinitive-യിലെ ഭാവിസൂചന നിലനിർത്തുന്നു; ഗ്രീക്കിൽ നിർബന്ധമല്ലാത്ത അതിശക്തമായ ആസന്നത മലയാളത്തിൽ ചേർക്കുന്നില്ല.
- source_word: σταθῆναι
  choice: നിൽക്കാനും
  rationale: അംഗീകരിക്കപ്പെടുക, കുറ്റവിമുക്തനാക്കപ്പെടുക എന്നീ സാധ്യതയുള്ള സൂചനകൾ വിശദീകരിക്കാതെ ഗ്രീക്കിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: ἔμπροσθεν
  choice: മുമ്പിൽ
  rationale: വ്യക്തിയുടെ സന്നിധിയിലുള്ള നിലപാട് സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ തത്തുല്യം.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രന്റെ
  rationale: സുവിശേഷങ്ങളിൽ സ്ഥിരമായി ഉപയോഗിക്കുന്ന പദവിയുടെ സെമിറ്റിക് പശ്ചാത്തലവും ക്രിസ്തുശാസ്ത്രപരമായ സ്വഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യകാല സഹനവുമായി ബന്ധപ്പെട്ട κατισχύσητε എന്നതിന്റെ അർഥം
  choice: “നിങ്ങൾക്കു ശക്തിയുണ്ടാകേണ്ടതിന്” എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: “നിങ്ങൾ യോഗ്യരായി എണ്ണപ്പെടേണ്ടതിന്”
  rationale: SBLGNT κατισχύσητε എന്നാണ് വായിക്കുന്നത്; അത് ശക്തിയെയോ പ്രാപ്തിയെയോ സൂചിപ്പിക്കുന്നു. യോഗ്യരായി എണ്ണപ്പെടുക എന്നത് പ്രധാനപ്പെട്ട വ്യത്യസ്ത പാഠമായതിനാൽ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: “മനുഷ്യപുത്രന്റെ മുമ്പിൽ നിൽക്കാനും” എന്ന രൂപം വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: “മനുഷ്യപുത്രന്റെ മുമ്പിൽ അംഗീകരിക്കപ്പെട്ടവരായി നിൽക്കാനും”
  rationale: അന്ത്യവിധിയിലെ അംഗീകാരമോ നീതീകരണമോ ഈ പ്രയോഗം സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്ക് അത് തുറന്നു പറയുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അവ്യക്തതയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ ആജ്ഞാസ്വഭാവവും തുടർച്ചയായ പ്രാർഥനയുടെ ഭാവവും നിലനിർത്തി. പ്രസിദ്ധമായ വ്യത്യസ്ത പാഠവും ‘നിൽക്കുക’ എന്നതിലെ ദൈവശാസ്ത്രപരമായ സൂചനയും അടിക്കുറിപ്പുകളിൽ നൽകി; മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനവിസ്താരം ഒഴിവാക്കി.
