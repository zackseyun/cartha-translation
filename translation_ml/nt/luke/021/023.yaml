revisions:
- from: ആ നാളുകളിൽ ഗർഭിണികൾക്കും കുഞ്ഞുങ്ങളെ മുലയൂട്ടുന്നവർക്കും അയ്യോ കഷ്ടം! എന്തെന്നാൽ, ദേശത്തിന്മേൽ[a] വലിയ ദുരിതവും ഈ ജനത്തിനുനേരെ ക്രോധവും[b] ഉണ്ടാകും.
  to: ആ നാളുകളിൽ ഗർഭിണികൾക്കും കുഞ്ഞുങ്ങളെ മുലയൂട്ടുന്നവർക്കും അയ്യോ! എന്തെന്നാൽ ദേശത്തിന്മേൽ[a] വലിയ ദുരിതവും ഈ ജനത്തിനുനേരെ ക്രോധവും[b] ഉണ്ടാകും.
