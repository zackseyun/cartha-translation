id: LUK.21.23
reference: Luke 21:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: ml
  text: ആ നാളുകളിൽ ഗർഭിണികൾക്കും കുഞ്ഞുങ്ങളെ മുലയൂട്ടുന്നവർക്കും അയ്യോ! എന്തെന്നാൽ ദേശത്തിന്മേൽ[a] വലിയ ദുരിതവും ഈ ജനത്തിനുനേരെ ക്രോധവും[b] ഉണ്ടാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂമിയിന്മേൽ.’ ഗ്രീക്കിലെ γῆ എന്ന പദത്തിന് ‘ദേശം’ എന്നും ‘ഭൂമി’ എന്നും അർഥമാകാം; സമീപസന്ദർഭം യെരൂശലേമിനെയും യെഹൂദ്യയെയും കേന്ദ്രീകരിക്കുന്നതിനാൽ ഇവിടെ ‘ദേശം’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഈ ജനത്തിനായി ക്രോധം’ അല്ലെങ്കിൽ ‘ഈ ജനത്തിന്മേൽ ക്രോധം.’
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: അയ്യോ കഷ്ടം
  rationale: പ്രവാചകീയമായ വിലാപത്തിന്റെയും വരാനിരിക്കുന്ന ന്യായവിധിയുടെയും ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: ഗർഭിണികൾക്ക്
  rationale: ‘ഗർഭത്തിൽ ഉള്ളവർ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ταῖς θηλαζούσαις
  choice: കുഞ്ഞുങ്ങളെ മുലയൂട്ടുന്നവർക്ക്
  rationale: ക്രിയയിൽ സൂചിതമായ കർമം വ്യക്തമാക്കിക്കൊണ്ട് മാതൃത്വപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ആ നാളുകളിൽ
  rationale: കാലസൂചന ഗ്രീക്കിനോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀνάγκη μεγάλη
  choice: വലിയ ദുരിതം
  rationale: ഈ ദുരന്തസന്ദർഭത്തിൽ ἀνάγκη സൂചിപ്പിക്കുന്ന കടുത്ത ക്ലേശം/ആപത്ത് വ്യക്തമാക്കുന്നു; ‘ആവശ്യം’ എന്ന അപ്രസക്തമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ദേശത്തിന്മേൽ
  rationale: യെരൂശലേമിനെയും യെഹൂദ്യയെയും കേന്ദ്രീകരിക്കുന്ന സമീപസന്ദർഭത്തിൽ γῆയുടെ പ്രാദേശിക അർഥമായ ‘ദേശം’ സ്വീകരിക്കുന്നു; ‘ഭൂമി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὀργή
  choice: ക്രോധം
  rationale: ഗ്രീക്കിലെ ശക്തമായ കോപം/ന്യായവിധിപരമായ രോഷം എന്ന ആശയം നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ദൈവത്തിന്റെ’ എന്ന കർത്താവിനെ ചേർക്കുന്നില്ല.
- source_word: τῷ λαῷ τούτῳ
  choice: ഈ ജനത്തിനുനേരെ
  rationale: ക്രോധം ബാധിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന ഡേറ്റീവ് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: γῆയുടെയും ‘ഈ ജനം’ എന്നതിന്റെയും സൂചിതവ്യാപ്തി
  choice: സമീപസന്ദർഭം യെരൂശലേമിനെയും യെഹൂദ്യയെയും കുറിക്കുന്നതിനാൽ ‘ദേശം’ എന്ന പ്രാദേശിക വായന പ്രധാനവാചകത്തിൽ സ്വീകരിച്ചു.
  alternative: γῆയെ ‘ഭൂമി’ എന്നു നൽകി സാർവത്രിക വ്യാപ്തിയായി വായിക്കുക.
  rationale: പ്രാദേശിക സൂചനയ്ക്കാണ് സന്ദർഭത്തിൽ മുൻതൂക്കം; എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ സാർവത്രിക സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: ὀργήയുടെ സ്വഭാവവും കർത്താവും
  choice: ‘ക്രോധം’ എന്നു മാത്രം നൽകി, അതിനെ ദൈവക്രോധമെന്നു പ്രധാനവാചകത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല.
  alternative: ‘ദൈവത്തിന്റെ ക്രോധം’ അല്ലെങ്കിൽ ‘ന്യായവിധി’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: സന്ദർഭത്തിൽ ദൈവിക ന്യായവിധി സൂചിതമായിരിക്കാമെങ്കിലും ഗ്രീക്ക് വാക്യം കർത്താവിനെ തുറന്നു പറയുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അവ്യക്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അയ്യോ കഷ്ടം’ പ്രവാചകീയ വിലാപത്തിന്റെ ശക്തി നൽകുന്നു. ദൈവശാസ്ത്രപരമായി വ്യാഖ്യാനാതീതമായ വിവരങ്ങൾ ചേർക്കാതെ മൂലത്തിലെ അവ്യക്തതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
