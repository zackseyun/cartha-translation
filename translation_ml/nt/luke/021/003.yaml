  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഈ ദരിദ്രയായ വിധവ എല്ലാവരെക്കാളും അധികം ഇട്ടു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എല്ലാവരെക്കാളും അധികം എറിഞ്ഞു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: സത്യമായി
  rationale: യേശുവിന്റെ ഗൗരവവും ഊന്നലുമുള്ള പ്രസ്താവനയെ പരിചിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പ്രസ്താവനയുടെ ആധികാരിക ഭാവവും നിലനിർത്തുന്നു.
- source_word: χήρα
  choice: വിധവ
  rationale: ഭർത്താവ് മരിച്ച സ്ത്രീയെ സൂചിപ്പിക്കുന്ന കൃത്യവും സാധാരണവുമായ മലയാളപദം.
- source_word: πτωχή
  choice: ദരിദ്രയായ
  rationale: സാമ്പത്തിക ദാരിദ്ര്യത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘അഗതിയായ’ എന്നത് ദാരിദ്ര്യത്തിന്റെ തീവ്രത അനാവശ്യമായി നിർണയിച്ചേക്കാം.
- source_word: αὕτη
  choice: ഈ
  rationale: സംഭവസ്ഥലത്ത് ചൂണ്ടിക്കാണിക്കപ്പെടുന്ന പ്രത്യേക വിധവയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πλεῖον
  choice: അധികം
  rationale: അളവിലുള്ള താരതമ്യം ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: πάντων
  choice: എല്ലാവരെക്കാളും
  rationale: മറ്റു സംഭാവകരുമായുള്ള താരതമ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: ἔβαλεν
  choice: ഇട്ടു
  rationale: ഭണ്ഡാരത്തിൽ പണം ഇടുന്നതെന്ന സന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമാണ്; ഗ്രീക്ക് ക്രിയയുടെ അടിസ്ഥാന ഭൗതികഭാവവും പൂർണമായി നഷ്ടപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: വിധവയുടെ സംഭാവനയെക്കുറിച്ചുള്ള താരതമ്യപ്രസ്താവന
  choice: എല്ലാവരെക്കാളും അധികം ഇട്ടു
  alternative: മറ്റാരെക്കാളും അധികം ഇട്ടു
  rationale: πλεῖον πάντων മറ്റുള്ള സംഭാവകരെ ഒന്നാകെ താരതമ്യത്തിന്റെ അടിസ്ഥാനമാക്കുന്നു. അടുത്ത വാക്യത്തിൽ നൽകുന്ന അനുപാതപരമായ വിശദീകരണം ഈ വാക്യത്തിലേക്ക് മുൻകൂട്ടി ചേർക്കാതെ യേശുവിന്റെ വിലയിരുത്തലിലെ ഉദ്ദേശ്യപൂർവമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘സത്യമായി’ എന്നത് ഗൗരവമുള്ള ഊന്നൽ നൽകുന്നു; ‘ഇട്ടു’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കെ മൂലക്രിയയോട് അടുത്തുനിൽക്കുന്നു.
