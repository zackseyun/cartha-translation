  text: By your endurance you will gain your lives[a][b].
translation:
  language: ml
  text: നിങ്ങളുടെ സ്ഥിരസഹനത്താൽ നിങ്ങളുടെ ജീവൻ നേടുക[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിലെ പാഠഭേദമനുസരിച്ച്: “നിങ്ങളുടെ സ്ഥിരസഹനത്താൽ നിങ്ങൾ നിങ്ങളുടെ ജീവൻ നേടും.”'
    reason: textual_variant
  - marker: b
    text: അഥവാ “ആത്മാക്കളെ”; ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് “ജീവൻ,” “സ്വയം,” അല്ലെങ്കിൽ “ആത്മാവ്” എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονῇ
  choice: സ്ഥിരസഹനം
  rationale: പരീക്ഷകളുടെയും പീഡനത്തിന്റെയും മധ്യേ ഉറച്ചുനിൽക്കുന്ന സഹനമാണ് ὑπομονή ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘സ്ഥിരസഹനം’ ഈ സജീവമായ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: κτήσασθε
  choice: നേടുക
  rationale: SBLGNT-യിലെ രൂപം aorist middle imperative ആണ്. അതിനാൽ മുഖ്യപാഠത്തിൽ കല്പനാരൂപം നിലനിർത്തി. ‘നേടുക’ എന്നത് സ്വന്തമാക്കുക/കൈവരിക്കുക എന്ന ആശയം അമിതമായി വ്യാഖ്യാനിക്കാതെ നൽകുന്നു.
- source_word: ψυχὰς
  choice: ജീവൻ
  rationale: ψυχή എന്നതിന് സന്ദർഭമനുസരിച്ച് ജീവൻ, സ്വയം, ആത്മാവ് എന്നീ അർഥങ്ങൾ വരാം. പീഡനം, മരണം, അന്തിമരക്ഷ എന്നിവ ചർച്ച ചെയ്യുന്ന ഈ സന്ദർഭത്തിൽ വ്യക്തിയുടെ സമഗ്രജീവിതത്തെ സൂചിപ്പിക്കാൻ ‘ജീവൻ’ അനുയോജ്യമാണ്; ശരീരം–ആത്മാവ് എന്ന വിഭജനം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: ἐν
  choice: -ത്താൽ
  rationale: ദാതിവോടുകൂടിയ ἐν ഇവിടെ മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സ്ഥിരസഹനത്താൽ’ എന്ന പ്രയോഗം ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാല പീഡനത്തിന്റെ സന്ദർഭത്തിൽ ψυχή എന്നതിന്റെ അർഥം
  choice: വ്യക്തിയുടെ സമഗ്രമായ ‘ജീവൻ’
  alternative: ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘സ്വയം’
  rationale: ‘ജീവൻ’ എന്ന പരിഭാഷ ശാരീരിക അപകടവും അന്തിമസംരക്ഷണവും തമ്മിലുള്ള വചനത്തിലെ സംഘർഷം നിലനിർത്തുന്നു; രക്ഷയെ അമൂർത്തമായ ആത്മാവിൽ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: κτήσασθε എന്ന ക്രിയയുടെ കല്പനാരൂപവും ഭാവികാല പാഠഭേദവും
  choice: SBLGNT അനുസരിച്ച് ‘നേടുക’ എന്ന കല്പനാരൂപം
  alternative: ‘നേടും’ എന്ന ഭാവികാലരൂപം
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് മുഖ്യപാഠത്തിൽ കല്പനാരൂപമാണ്. ഫലസൂചകമായ ഭാവികാല വായന പ്രധാനപ്പെട്ട പാഠഭേദമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; മുഖ്യപാഠത്തിൽ അതിനെ നിശ്ശബ്ദമായി സ്വീകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് മുഖ്യപാഠത്തിലെ കല്പനാഭാവം നിലനിർത്തിയിട്ടുണ്ട്. ബഹുവചനമായ ψυχὰς ὑμῶν മലയാളത്തിൽ ഓരോ ശ്രോതാവിനെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവികമായ കൂട്ടായ പ്രയോഗമായി ‘നിങ്ങളുടെ ജീവൻ’ എന്നു നൽകിയിരിക്കുന്നു.
