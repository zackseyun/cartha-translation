revisions:
- from: “നിങ്ങൾ നോക്കിക്കൊണ്ടിരിക്കുന്ന ഈ കാര്യങ്ങളെക്കുറിച്ചാണെങ്കിൽ[a], ഒരു കല്ലിന്മേൽ മറ്റൊരു കല്ല് ശേഷിക്കാതെ എല്ലാം ഇടിച്ചുതകർക്കപ്പെടുന്ന ദിവസങ്ങൾ വരും[b].”
  to: “നിങ്ങൾ നോക്കിക്കൊണ്ടിരിക്കുന്ന ഈ കാര്യങ്ങൾ[a]—ഇടിച്ചുകളയപ്പെടാത്ത ഒരു കല്ലും മറ്റൊരു കല്ലിന്മേൽ ശേഷിക്കാത്ത ദിവസങ്ങൾ വരും[b].”
