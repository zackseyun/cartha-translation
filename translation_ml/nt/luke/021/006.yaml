id: LUK.21.6
reference: Luke 21:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: ml
  text: “നിങ്ങൾ നോക്കിക്കൊണ്ടിരിക്കുന്ന ഈ കാര്യങ്ങൾ[a]—ഇടിച്ചുകളയപ്പെടാത്ത ഒരു കല്ലും മറ്റൊരു കല്ലിന്മേൽ ശേഷിക്കാത്ത ദിവസങ്ങൾ വരും[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ കാണുന്ന ഈ കാര്യങ്ങൾ.” θεωρεῖτε എന്ന ക്രിയയ്ക്ക് പൊതുവായി ‘കാണുക’ എന്നും കൂടുതൽ പ്രത്യേകമായി ‘നോക്കുക, നിരീക്ഷിക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഇടിച്ചുകളയപ്പെടാത്ത ഒരു കല്ലും മറ്റൊരു കല്ലിന്മേൽ ശേഷിക്കുകയില്ല.” ഇത് സമ്പൂർണ നാശത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: നിങ്ങൾ നോക്കിക്കൊണ്ടിരിക്കുന്ന ഈ കാര്യങ്ങളെക്കുറിച്ചാണെങ്കിൽ
  rationale: മുന്നിൽ കൊണ്ടുവന്ന Ταῦταയുടെ വിഷയപ്രാധാന്യവും θεωρεῖτε എന്ന വർത്തമാനകാല ക്രിയയുടെ തുടർച്ചയായ ദർശനഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐλεύσονται ἡμέραι
  choice: ദിവസങ്ങൾ വരും
  rationale: വരാനിരിക്കുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἐν αἷς
  choice: '... ദിവസങ്ങൾ'
  rationale: മലയാളത്തിൽ ബന്ധവാക്യം പ്രത്യേകം പകർത്താതെ, ആ ദിവസങ്ങളിൽ സംഭവിക്കുന്ന കാര്യം മുൻനിർത്തി വാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
- source_word: οὐκ ἀφεθήσεται
  choice: ശേഷിക്കാതെ
  rationale: ഇവിടെ ἀφίημι എന്നതിന്റെ നിഷ്ക്രിയരൂപം ‘അവശേഷിക്കുക/വിട്ടേക്കപ്പെടുക’ എന്ന അർഥത്തിലാണ്; കെട്ടിടനാശത്തിന്റെ സന്ദർഭത്തിൽ ‘ശേഷിക്കാതെ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: λίθος ἐπὶ λίθῳ
  choice: ഒരു കല്ലിന്മേൽ മറ്റൊരു കല്ല്
  rationale: സമ്പൂർണ നാശത്തെ സൂചിപ്പിക്കുന്ന ദൃശ്യപ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ὃς οὐ καταλυθήσεται
  choice: എല്ലാം ഇടിച്ചുതകർക്കപ്പെടുന്ന
  rationale: καταλύω കെട്ടിടം പൊളിച്ചുനീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ നിഷേധാത്മക ബന്ധവാക്യത്തിന്റെ സമ്പൂർണതാബലം മലയാളത്തിൽ ‘എല്ലാം’ എന്നതിലൂടെ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദേവാലയനിർമിതികളെക്കുറിച്ചുള്ള യേശുവിന്റെ പ്രവചനത്തിന്റെ വ്യാപ്തിയും ശക്തിയും
  choice: കാണുന്ന നിർമിതികളുടെ സമ്പൂർണമായ ഭൗതികനാശത്തെക്കുറിച്ചുള്ള വ്യക്തമായ പ്രവചനമായി വിവർത്തനം ചെയ്തു; പ്രത്യേക അന്ത്യകാലവ്യവസ്ഥ ഒന്നും ചേർത്തിട്ടില്ല.
  alternative: ഇത് മുഖ്യമായും പ്രതീകാത്മകമായ ന്യായവിധിവചനമായി വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ ഒരു പ്രത്യേക പിൽക്കാല ദൈവശാസ്ത്രചട്ടക്കൂടുമായി ബന്ധിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം കല്ലുകൾ ഒന്നിന്മേൽ ഒന്നായി ശേഷിക്കാത്തവിധം ദൃശ്യമായ നിർമിതികൾ തകർക്കപ്പെടുന്നതിനെ നേരിട്ട് പറയുന്നു. വാക്യം പറയുന്നതിലധികം ദൈവശാസ്ത്രപരമായ വിശദീകരണം വിവർത്തനത്തിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവവും പ്രവചനസ്വരവും നിലനിർത്തുന്ന ശൈലി. ‘നോക്കിക്കൊണ്ടിരിക്കുന്ന’ ദർശനത്തിന്റെ തുടർച്ചയും ‘ഇടിച്ചുതകർക്കപ്പെടുന്ന’ കെട്ടിടനാശത്തിന്റെ ദൃശ്യശക്തിയും സൂക്ഷിക്കുന്നു.
