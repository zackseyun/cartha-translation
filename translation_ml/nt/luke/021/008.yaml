  source_fidelity: 'മുഖ്യവാചകം ഗ്രീക്കിന്റെ എല്ലാ പ്രധാന ഘടകങ്ങളും വിശ്വസ്തമായി നൽകുന്നു: ജാഗ്രതാനിർദേശം, വഴിതെറ്റിക്കപ്പെടാനുള്ള മുന്നറിയിപ്പ്, യേശുവിന്റെ പേരിൽ വരുന്നവരുടെ അവകാശവാദം, ‘ഞാൻ തന്നെയാണ്’ എന്ന സന്ദർഭനിർണിതമായ അപൂർണ സ്വയംതിരിച്ചറിയിക്കൽ, സമയം അടുത്തിരിക്കുന്നു എന്ന പ്രഖ്യാപനം, അവരെ പിന്തുടരരുതെന്ന വിലക്ക് എന്നിവ യഥാക്രമം സംരക്ഷിച്ചിരിക്കുന്നു. ‘ഞാൻ തന്നെയാണ്’ എന്നതിലൂടെ ‘Ἐγώ εἰμι’യുടെ സൂചിത കർമപൂരകം അമിതമായി ‘മശീഹാ’ എന്നു നിർണയിക്കാതെ പ്രതിഫലിക്കുന്നു.'
