id: LUK.21.8
reference: Luke 21:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നിങ്ങൾ വഴിതെറ്റിപ്പോകാതിരിക്കാൻ സൂക്ഷിക്കണം. പലരും എന്റെ പേരിൽ വന്ന്, ‘ഞാൻ തന്നെയാണ്[a]’ എന്നും ‘കാലം അടുത്തെത്തിയിരിക്കുന്നു’ എന്നും പറയും. അവരുടെ പിന്നാലെ പോകരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞാൻ ആകുന്നു.” അതായത്, പ്രതീക്ഷിക്കപ്പെട്ടിരുന്നവൻ—ഒരുപക്ഷേ മശീഹാ—താനാണെന്ന് വ്യാജമായി അവകാശപ്പെടുന്ന ഒരാൾ.
    reason: Ἐγώ εἰμι എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥമായ വിവർത്തനവും സന്ദർഭത്തിൽ സൂചിതമാകാവുന്ന തിരിച്ചറിയിക്കലും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: നിങ്ങൾ വഴിതെറ്റിപ്പോകാതിരിക്കാൻ സൂക്ഷിക്കണം
  rationale: Βλέπετε എന്ന ജാഗ്രതാനിർദേശം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും πλανάω എന്നതിലെ വഴിതെറ്റിക്കൽ എന്ന രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: എന്റെ പേരിൽ വന്ന്
  rationale: യേശുവിന്റെ പേരോ അധികാരമോ അവകാശപ്പെട്ടുള്ള വരവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും അർഥസമ്പന്നവുമായ മലയാളരൂപം.
- source_word: Ἐγώ εἰμι
  choice: ഞാൻ തന്നെയാണ്
  rationale: ഗ്രീക്കിൽ കർമപൂരകം വ്യക്തമാക്കിയിട്ടില്ല. സന്ദർഭത്തിലെ സ്വയംതിരിച്ചറിയിക്കൽ അവകാശവാദം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുമ്പോഴും ‘മശീഹാ’ എന്ന് വാചകത്തിൽ ചേർത്ത് അർഥം അതിയായി നിർണയിക്കുന്നില്ല.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: കാലം അടുത്തെത്തിയിരിക്കുന്നു
  rationale: καιρός എന്ന നിർണായക സമയസൂചനയും ἤγγικεν എന്ന പൂർണകാലരൂപത്തിന്റെ ഇപ്പോഴത്തെ സമീപ്യതയും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: അവരുടെ പിന്നാലെ പോകരുത്
  rationale: അത്തരക്കാരെ അനുഗമിക്കരുതെന്ന വിലക്കിനൊപ്പം ὀπίσω എന്ന ദിശാസൂചക രൂപകവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വ്യാജ അവകാശവാദികളുടെ സന്ദർഭത്തിൽ Ἐγώ εἰμι എന്നതിന്റെ വിവർത്തനം
  choice: ഞാൻ തന്നെയാണ്
  alternative: ഞാൻ ആകുന്നു; ഞാൻ മശീഹായാണ്
  rationale: ‘ഞാൻ തന്നെയാണ്’ സന്ദർഭത്തിൽ സൂചിതമായ തിരിച്ചറിയിക്കൽ അവകാശവാദം വ്യക്തമാക്കുന്നു; എന്നാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘മശീഹാ’ വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല. കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘വഴിതെറ്റിപ്പോകുക,’ ‘കാലം അടുത്തെത്തിയിരിക്കുന്നു,’ ‘പിന്നാലെ പോകരുത്’ എന്നിവ മൂലപാഠത്തിലെ രൂപകങ്ങളും കാലസൂചനയും നിലനിർത്തുന്നു.
