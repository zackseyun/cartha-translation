id: LUK.21.13
reference: Luke 21:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: ml
  text: ഇത് നിങ്ങൾക്കു സാക്ഷ്യം നൽകാനുള്ള അവസരമായി പരിണമിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇത് നിങ്ങൾക്കു സാക്ഷ്യമായിത്തീരും.’
    reason: μαρτύριον എന്നതിന് സാക്ഷ്യം നൽകുന്ന പ്രവൃത്തിയെയോ അതിന്റെ ഫലമായ സാക്ഷ്യത്തെയോ സൂചിപ്പിക്കാനാകുന്നതിനാൽ ഈ ചുരുക്കരൂപവും സാധ്യമാണ്.
lexical_decisions:
- source_word: ἀποβήσεται
  choice: പരിണമിക്കും
  rationale: ഭാവികാല മധ്യരൂപമായ ἀποβήσεται ഇവിടെ വെറും സംഭവത്തെയല്ല, മുൻപ് പറഞ്ഞ പീഡനങ്ങൾ ഒരു പ്രത്യേക ഫലത്തിലേക്ക് നയിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ഈ ദത്തിവ് ശിഷ്യന്മാർക്കു സംബന്ധിച്ചുണ്ടാകുന്ന ഫലമോ അവസരമോ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰς
  choice: -ആയി
  rationale: εἰς ഇവിടെ ഫലമോ ലക്ഷ്യമോ സൂചിപ്പിക്കുന്നു; ‘അവസരമായി പരിണമിക്കും’ എന്ന പ്രയോഗത്തിൽ ആ ബന്ധം സ്വാഭാവികമായി വരുന്നു.
- source_word: μαρτύριον
  choice: സാക്ഷ്യം നൽകാനുള്ള അവസരം
  rationale: സന്ദർഭത്തിൽ അധികാരികളുടെ മുമ്പിൽ ശിഷ്യന്മാർ സാക്ഷ്യം വഹിക്കുന്നതിലേക്കാണ് μαρτύριον സ്വാഭാവികമായി വിരൽചൂണ്ടുന്നത്. മലയാളത്തിൽ ‘സാക്ഷ്യം’ എന്നു മാത്രം പറഞ്ഞാൽ തെളിവ് എന്ന അർഥത്തിലേക്കു ചുരുങ്ങാൻ സാധ്യതയുള്ളതിനാൽ പ്രവർത്തനപരമായ അർഥം പ്രധാനവാക്യത്തിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: അധികാരികളുടെ മുമ്പിലുള്ള ശിഷ്യന്മാരുടെ കഷ്ടതയുടെ അർഥം
  choice: മുൻപ് പറഞ്ഞ സംഭവങ്ങൾ ശിഷ്യന്മാർക്കു സാക്ഷ്യം നൽകാനുള്ള അവസരമായി മാറും.
  alternative: ആ സംഭവങ്ങൾ അവരുടെ എതിരാളികൾക്കെതിരായ തെളിവായിത്തീരും.
  rationale: ലൂക്കോസിലെ അറസ്റ്റിന്റെയും ഭരണാധികാരികളുടെ മുമ്പിലെ വിചാരണയുടെയും പശ്ചാത്തലത്തിൽ, യേശുവിനെക്കുറിച്ചു ശിഷ്യന്മാർ സാക്ഷ്യം വഹിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികമായ അർഥം. എന്നാൽ അത് സുവിശേഷസാക്ഷ്യമാണോ ന്യായവിധിക്കുള്ള തെളിവാണോ എന്നു വാക്യം പൂർണമായി നിർണ്ണയിക്കാത്തതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘പരിണമിക്കും’ എന്നത് ഗൗരവമുള്ളതെങ്കിലും സ്വാഭാവികമായ ശൈലിയിൽ ഫലസൂചന നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് മൂലവാക്യത്തിലെ ലഘുതയും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
