source:
  edition: SBLGNT
  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: ml
  text: 'നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുക: മദ്യപാനത്തിന്റെ അതിരുകടന്ന ഉല്ലാസം[a], മദ്യലഹരി, ജീവിതത്തിലെ ആകുലതകൾ എന്നിവയാൽ നിങ്ങളുടെ ഹൃദയങ്ങൾ ഭാരപ്പെട്ടുപോകാതിരിക്കാനും, ആ ദിവസം പെട്ടെന്ന് നിങ്ങളുടെമേൽ വന്നുചേരാതിരിക്കാനും ജാഗ്രത പാലിക്കുക.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ ഗ്രീക്ക് പദം മദ്യപാനത്തിലെ അതിരുകടന്ന ഉല്ലാസത്തെയോ അമിതമദ്യപാനത്തിന്റെ പിറ്റേന്നത്തെ ദുഷ്ഫലങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: എന്നാൽ നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുക
  rationale: προσέχω എന്ന ജാഗ്രതാനിർദേശം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ἑαυτοῖς എന്ന ആത്മവാചക അർഥവും നിലനിർത്തുന്നു.
- source_word: μήποτε βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: നിങ്ങളുടെ ഹൃദയങ്ങൾ ഭാരപ്പെട്ടുപോകാതിരിക്കട്ടെ
  rationale: βαρέω എന്ന ക്രിയയിലെ ഭാരംകൊണ്ട് അമരുന്ന രൂപകം നിലനിർത്തുന്നു. ഇവിടെ ‘ഹൃദയങ്ങൾ’ വികാരം മാത്രമല്ല, ആന്തരിക ബോധവും ധാർമിക-ആത്മീയ ജാഗ്രതയും ഉൾക്കൊള്ളുന്നു.
- source_word: κραιπάλῃ
  choice: അമിതഭോഗം
  rationale: മദ്യത്തിലെ അതിരുകടന്ന ആസ്വാദനത്തെയും അതിന്റെ ദുഷ്ഫലങ്ങളെയും സൂചിപ്പിക്കാവുന്ന പദത്തിന്റെ വിശാലത നിലനിർത്താൻ ‘അമിതഭോഗം’ തിരഞ്ഞെടുത്തു; മദ്യപാനം അടുത്തായി പ്രത്യേകം പറയുന്നതിനാൽ അനാവശ്യ ആവർത്തനവും ഒഴിവാകുന്നു.
- source_word: μέθῃ
  choice: മദ്യപാനം
  rationale: ലഹരിയിലാകുന്ന മദ്യപാനാവസ്ഥയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക പദം.
- source_word: μερίμναις βιωτικαῖς
  choice: ജീവിതത്തിലെ ആകുലതകൾ
  rationale: ദൈനംദിന ഭൗതികജീവിതവുമായി ബന്ധപ്പെട്ട ഉത്കണ്ഠകളും കരുതലുകളും എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; ‘ലൗകികം’ പോലുള്ള അധിക നിഷേധാത്മക ധ്വനി ചേർക്കുന്നില്ല.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: പെട്ടെന്ന് നിങ്ങളുടെമേൽ വന്നെത്തും
  rationale: അപ്രതീക്ഷിതമായി ഒരാളുടെമേൽ എത്തിച്ചേരുക എന്ന ἐφίστημι + ἐπί പ്രയോഗത്തിന്റെ ശക്തിയും αἰφνίδιος നൽകുന്ന പെട്ടെന്നുള്ള വരവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: ആ ദിവസം
  rationale: ഗ്രീക്ക് പാഠത്തിലെ നിർവചനമില്ലാത്ത അന്തിമകാല സൂചന അതേപടി നിലനിർത്തുന്നു; ‘ന്യായവിധിദിവസം’ എന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ‘ആ ദിവസം’ എന്നതിന്റെ അന്തിമകാലപരമായ സൂചന
  choice: ആ ദിവസം
  alternative: ന്യായവിധിദിവസം
  rationale: പ്രഭാഷണസന്ദർഭത്തിൽ അന്തിമമായ ആ ദിവസമാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്; എങ്കിലും മൂലപാഠം നൽകുന്ന സംക്ഷിപ്തവും സൂചനാത്മകവുമായ പ്രയോഗം പരിഭാഷയിൽ വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- issue: μήποτε ബന്ധിപ്പിക്കുന്ന മുന്നറിയിപ്പിന്റെ വാക്യഘടന
  choice: ഹൃദയങ്ങൾ ഭാരപ്പെട്ടുപോകാതിരിക്കട്ടെ; അല്ലെങ്കിൽ ആ ദിവസം പെട്ടെന്ന് നിങ്ങളുടെമേൽ വന്നെത്തും
  alternative: ഹൃദയങ്ങൾ ഭാരപ്പെട്ടുപോകുകയും ആ ദിവസം പെട്ടെന്ന് നിങ്ങളുടെമേൽ വന്നെത്തുകയും ചെയ്യാതിരിക്കാൻ
  rationale: ഗ്രീക്കിൽ μήποτε-യുടെ വ്യാപ്തി ഹൃദയങ്ങൾ ഭാരപ്പെടുന്നതും ദിവസം പെട്ടെന്ന് വന്നെത്തുന്നതും ഉൾക്കൊള്ളുന്നതായി വായിക്കാം. മലയാളത്തിലെ ഈ രൂപം ജാഗ്രതക്കുറവിന്റെ ഫലമായി പെട്ടെന്നുള്ള ദിവസം വന്നെത്തുന്ന മുന്നറിയിപ്പ് വ്യക്തമായി നൽകുന്നു; ദിവസത്തിന്റെ വരവ് തന്നെയൊട്ടാകെ ഒഴിവാക്കാമെന്ന തെറ്റിദ്ധാരണ കുറയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഹൃദയങ്ങൾ ഭാരപ്പെടുക’ എന്ന മൂലരൂപകം സംരക്ഷിച്ചിരിക്കുന്നു; അന്തിമകാലപരമായ ‘ആ ദിവസം’ വിശദീകരിച്ച് അധിക ദൈവശാസ്ത്രപദം ചേർത്തിട്ടില്ല.
