id: LUK.21.12
reference: Luke 21:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: ml
  text: എന്നാൽ ഇവയെല്ലാം സംഭവിക്കുന്നതിനുമുമ്പ്, അവർ നിങ്ങളെ പിടികൂടി[a] പീഡിപ്പിക്കും; നിങ്ങളെ സിനഗോഗുകൾക്കും തടവറകൾക്കും ഏല്പിക്കുകയും രാജാക്കന്മാരുടെയും ഭരണാധികാരികളുടെയും മുമ്പാകെ കൊണ്ടുപോകുകയും ചെയ്യും—എന്റെ നാമം നിമിത്തം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നിങ്ങളുടെ മേൽ കൈവയ്ക്കും.’ ഇവിടെ അത് ശത്രുതയോടെ പിടികൂടുന്നതിനെയോ ദുരുപദ്രവം ചെയ്യുന്നതിനെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ നാമം നിമിത്തം’ എന്നത് ‘എന്റെ നാമത്തിനുവേണ്ടി’ എന്നും, കൂടുതൽ വ്യാഖ്യാനപരമായി ‘എന്നെ നിമിത്തം’ എന്നും പരിഭാഷപ്പെടുത്താം. മുഖ്യപാഠം യേശുവിന്റെ നാമത്തെ അവന്റെ വ്യക്തിയോടും അധികാരത്തോടും ബന്ധിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: എന്നാൽ ഇവയെല്ലാം സംഭവിക്കുന്നതിനുമുമ്പ്
  rationale: πρό + ജനിറ്റീവ് കാലപരമായ മുൻഗണന സൂചിപ്പിക്കുന്നു; δέ യുടെ വിരോധ/സംക്രമഭാവം ‘എന്നാൽ’ നിലനിർത്തുന്നു. സ്വാഭാവിക മലയാളത്തിനായി ‘സംഭവിക്കുന്ന’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: അവർ നിങ്ങളെ പിടികൂടി
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെമേൽ കൈവയ്ക്കും’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ശത്രുതാപരമായി പിടികൂടുക എന്ന പ്രയോഗാർഥമാണ്. ആധുനിക മലയാളത്തിൽ ‘പിടികൂടി’ അർഥം വ്യക്തമായി നൽകുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: διώξουσιν
  choice: പീഡിപ്പിക്കും
  rationale: ശിഷ്യന്മാർ യേശുവിന്റെ നാമംനിമിത്തം നേരിടുന്ന സംഘടിത എതിർപ്പാണ് സന്ദർഭം; അതിനാൽ സാധാരണ പിന്തുടരൽ എന്നതിനെക്കാൾ ‘പീഡിപ്പിക്കും’ യോജിക്കുന്നു.
- source_word: παραδιδόντες
  choice: ഏല്പിക്കുകയും
  rationale: പീഡനത്തിന്റെ ഭാഗമായി അധികാരികൾക്കോ സ്ഥാപനങ്ങൾക്കോ കൈമാറുന്നതിന്റെ നിയമപരവും ശത്രുതാപരവുമായ ഭാവം നൽകുന്നു.
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: സിനഗോഗുകൾക്കും തടവറകൾക്കും
  rationale: സ്ഥാപനനാമങ്ങൾ വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു. εἰς എന്നതിന്റെ ലക്ഷ്യഭാവം ദാതുവിഭക്തിയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: രാജാക്കന്മാരുടെയും ഭരണാധികാരികളുടെയും മുമ്പാകെ കൊണ്ടുപോകുകയും ചെയ്യും
  rationale: ἀπαγομένους വ്യാകരണപരമായി കർമണി പങ്കാളിക്രിയയാണെങ്കിലും, മലയാളത്തിൽ മുൻപത്തെ അനിശ്ചിത ബഹുവചന കർത്താവിനോടു ചേർത്ത സജീവരൂപം സ്വാഭാവികമാണ്. ἐπί ഇവിടെ അധികാരികളുടെ മുമ്പാകെയുള്ള ഹാജരാക്കലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: എന്റെ നാമംനിമിത്തം
  rationale: ἕνεκεν കാരണം/നിമിത്തം സൂചിപ്പിക്കുന്നു. ‘എന്റെ നാമം’ എന്ന ബൈബിൾപ്രയോഗം യേശുവിന്റെ വ്യക്തിത്വത്തോടും അധികാരത്തോടുമുള്ള ബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പീഡനസന്ദർഭത്തിലെ ‘എന്റെ നാമം’ എന്നതിന്റെ അർഥം
  choice: ‘എന്റെ നാമംനിമിത്തം’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
  alternative: ‘ഞാൻ നിമിത്തം’ അല്ലെങ്കിൽ ‘നിങ്ങൾ എന്റേതായതിനാൽ’
  rationale: τοῦ ὀνόματός μου എന്നത് യേശുവിന്റെ വ്യക്തിയെയും അധികാരത്തെയും അവനെക്കുറിച്ചുള്ള ഏറ്റുപറച്ചിലിനെയും ഉൾക്കൊള്ളുന്ന ദൈവശാസ്ത്രപരമായ ഭാരം വഹിക്കുന്നു. വ്യാഖ്യാനപരമായി ചുരുക്കാതെ മൂലപ്രയോഗം സംരക്ഷിക്കുന്നു.
- issue: ἀπαγομένους എന്ന കർമണി പങ്കാളിക്രിയയുടെ അവതരണം
  choice: സ്വാഭാവിക മലയാളത്തിനായി ‘അവർ ... കൊണ്ടുപോകുകയും ചെയ്യും’ എന്ന സജീവ ഘടന
  alternative: ‘കൊണ്ടുപോകപ്പെട്ടവരായി’ അല്ലെങ്കിൽ ‘കൊണ്ടുപോകപ്പെടുകയും’
  rationale: ആരാണ് പ്രവർത്തിക്കുന്നത് എന്നത് വാക്യത്തിലെ ‘അവർ’ വ്യക്തമാക്കുന്നതിനാൽ അർഥത്തിൽ മാറ്റമില്ല; അസ്വാഭാവികമായ മലയാള കർമണി ഘടന ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സിനഗോഗ്,’ ‘നാമംനിമിത്തം’ എന്നീ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിന്റെ സ്ഥാപനപരവും ദൈവശാസ്ത്രപരവുമായ ഭാവം നിലനിർത്താൻ ഉപയോഗിച്ചു; വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
