revisions:
- from: എന്നാൽ ഇവയെല്ലാം സംഭവിക്കുന്നതിനുമുമ്പ്, അവർ നിങ്ങളെ പിടികൂടി[a] പീഡിപ്പിക്കും; നിങ്ങളെ സിനഗോഗുകൾക്കും തടവറകൾക്കും ഏല്പിക്കുകയും രാജാക്കന്മാരുടെയും ഭരണാധികാരികളുടെയും മുമ്പാകെ കൊണ്ടുപോകുകയും ചെയ്യും—എന്റെ നാമംനിമിത്തം.[b]
  to: എന്നാൽ ഇവയെല്ലാം സംഭവിക്കുന്നതിനുമുമ്പ്, അവർ നിങ്ങളെ പിടികൂടി[a] പീഡിപ്പിക്കും; നിങ്ങളെ സിനഗോഗുകൾക്കും തടവറകൾക്കും ഏല്പിക്കുകയും രാജാക്കന്മാരുടെയും ഭരണാധികാരികളുടെയും മുമ്പാകെ കൊണ്ടുപോകുകയും ചെയ്യും—എന്റെ നാമം നിമിത്തം[b].
  rationale: The verse itself needs only minor orthographic and footnote-anchor adjustment. The substantive revision corrects footnote a’s misleading ‘betrayal’ sense and makes footnote b’s Malayalam alternative idiomatic, while retaining the source-text ambiguity and the main translation’s meaning.
