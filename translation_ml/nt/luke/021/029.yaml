  text: Καὶ εἶπεν παραβολὴν αὐτοῖς· Ἴδετε τὴν συκῆν καὶ πάντα τὰ δένδρα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/029.yaml
  text: 'And he told them a parable: “Look at the fig tree and all the trees[a].'
translation:
  language: ml
  text: 'അവൻ അവരോട് ഒരു ഉപമ പറഞ്ഞു: “അത്തിമരത്തെയും എല്ലാ മരങ്ങളെയും നോക്കുക.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അത്തിമരത്തെയും എല്ലാ മരങ്ങളെയും ശ്രദ്ധിക്കുക.”'
    reason: Ἴδετε എന്നതിന് ദൃശ്യമായി ‘നോക്കുക’ എന്നും ശ്രദ്ധാപൂർവം പരിഗണിക്കുക എന്ന ഭാവത്തിൽ ‘ശ്രദ്ധിക്കുക’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: Καὶ
  choice: അവൻ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യാരംഭത്തിനായി തുടർച്ച സൂചിപ്പിക്കുന്ന Καὶ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ, ഗ്രീക്കിൽ ക്രിയയിൽ ഉൾക്കൊള്ളുന്ന കർത്താവിനെ വ്യക്തമാക്കി; മുൻസന്ദർഭത്തിലെ ആഖ്യാനത്തുടർച്ച നിലനിൽക്കുന്നു.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: παραβολὴν എന്ന കർമത്തോടൊപ്പം ‘ഒരു ഉപമ പറഞ്ഞു’ എന്നത് സ്വാഭാവികവും അർത്ഥകൃത്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: παραβολὴν
  choice: ഒരു ഉപമ
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ παραβολή എന്ന സാഹിത്യ-പഠനരൂപത്തിന് ‘ഉപമ’ സ്ഥാപിതവും പൊതുവേ മനസ്സിലാകുന്നതുമായ തുല്യപദമാണ്.
- source_word: Ἴδετε
  choice: നോക്കുക
  rationale: ശ്രദ്ധ ഒരു ദൃശ്യദൃഷ്ടാന്തത്തിലേക്കു തിരിക്കുന്ന ബഹുവചന ആജ്ഞയെ സ്വാഭാവികമായും നേരിട്ടും അറിയിക്കുന്നു.
- source_word: τὴν συκῆν
  choice: അത്തിമരത്തെ
  rationale: συκῆ ഫലത്തെയല്ല, അത്തിവൃക്ഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πάντα τὰ δένδρα
  choice: എല്ലാ മരങ്ങളെയും
  rationale: ‘മറ്റു’ എന്ന ആശയം ചേർക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാപ്തി നേരിട്ട് നിലനിർത്തുന്നു.
