  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവരോട് ഒരു ഉപമ പറഞ്ഞു’ എന്ന സ്വാഭാവിക പദക്രമവും ബഹുവചന ആജ്ഞയ്ക്ക് മാന്യമായ ‘നോക്കുക’ എന്ന രൂപവും ഉപയോഗിച്ചു.
