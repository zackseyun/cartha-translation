id: LUK.21.33
reference: Luke 21:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ml
  text: ആകാശവും ഭൂമിയും കടന്നുപോകും; എന്നാൽ എന്റെ വാക്കുകൾ ഒരിക്കലും കടന്നുപോകുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: ആകാശവും ഭൂമിയും
  rationale: സൃഷ്ടലോകത്തിന്റെ സമഗ്രതയെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യുഗ്മപ്രയോഗമാണിത്; οὐρανός ഇവിടെ ദൃശ്യമായ ആകാശം മാത്രമല്ല, ഭൂമിയോടു ചേർന്നു പറയുന്ന ആകാശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: παρελεύσονται
  choice: ഒഴിഞ്ഞുപോകും
  rationale: παρέρχομαι ഇവിടെ ഇല്ലാതാകുക അഥവാ അവസാനിച്ചുപോകുക എന്ന അർഥത്തിലാണ്. ഒരേ ക്രിയ രണ്ടിടത്തും ഒരേവിധം വിവർത്തനം ചെയ്ത് വാക്യത്തിന്റെ സമാന്തരത നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ആകാശത്തിന്റെയും ഭൂമിയുടെയും അനിത്യതയും യേശുവിന്റെ വാക്കുകളുടെ സ്ഥിരതയും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം പ്രകടമാക്കുന്നു.
- source_word: οἱ λόγοι μου
  choice: എന്റെ വാക്കുകൾ
  rationale: λόγοι ഇവിടെ യേശുവിന്റെ അരുളപ്പാടുകളെയോ പ്രസ്താവനകളെയോ സൂചിപ്പിക്കുന്നു; ‘വാക്കുകൾ’ നേരിട്ടും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പരിഭാഷയാണ്.
- source_word: οὐ μὴ
  choice: ഒരിക്കലും … ഇല്ല
  rationale: ഭാവികാലക്രിയയോടൊപ്പമുള്ള οὐ μή ശക്തമായ നിഷേധമാണ്. ആ ഊന്നൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ഒരിക്കലും … ഇല്ല’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: യേശുവിന്റെ വാക്കുകളുടെ സ്ഥിരതയെക്കുറിച്ചുള്ള അവകാശവാദത്തിന്റെ ശക്തി
  choice: ‘ഒരിക്കലും ഒഴിഞ്ഞുപോകുകയില്ല’ എന്ന ശക്തമായ നിഷേധം
  alternative: ‘ഒഴിഞ്ഞുപോകുകയില്ല’ എന്ന ലളിതനിഷേധം
  rationale: ഗ്രീക്കിലെ οὐ μή സാധാരണ നിഷേധത്തേക്കാൾ ശക്തമാണ്. സൃഷ്ടലോകത്തിന്റെ അനിത്യാവസ്ഥയും യേശുവിന്റെ വാക്കുകളുടെ അചഞ്ചലസ്ഥിരതയും തമ്മിലുള്ള തീക്ഷ്ണമായ വൈരുധ്യം വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവപൂർണവുമായ ശൈലി. ‘കടന്നുപോകും’ എന്നത് വെറും സമീപത്തുകൂടി പോകുക എന്നർഥത്തിൽ തെറ്റിദ്ധരിക്കപ്പെടാൻ സാധ്യതയുള്ളതിനാൽ, അവസാനിച്ചുപോകുന്ന അർഥം വ്യക്തമാക്കുന്ന ‘ഒഴിഞ്ഞുപോകും’ തിരഞ്ഞെടുത്തു. മൂലത്തിലെ ആവർത്തനവും വൈരുധ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്.
