id: LUK.21.15
reference: Luke 21:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: ml
  text: എന്തെന്നാൽ, നിങ്ങളെ എതിർക്കുന്ന എല്ലാവർക്കും ചെറുത്തുനിൽക്കാനോ എതിർത്തുപറയാനോ കഴിയാത്ത വാക്കുകളും ജ്ഞാനവും ഞാൻ നിങ്ങൾക്കു നൽകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: വാക്കുകൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘വായ്’ എന്നാണെങ്കിലും, ഇവിടെ പ്രതിരോധസാക്ഷ്യത്തിനായി നൽകപ്പെടുന്ന സംസാരശേഷിയെയോ വാക്കുകളെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: σοφίαν
  choice: ജ്ഞാനം
  rationale: സംസാരത്തിൽ പ്രകടമാകുന്ന ദൈവദത്തമായ വിവേകവും ജ്ഞാനവും സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള തുല്യപദം.
- source_word: ἀντιστῆναι
  choice: ചെറുത്തുനിൽക്കാൻ
  rationale: പ്രസ്താവിക്കുന്ന സാക്ഷ്യത്തെ ഫലപ്രദമായി നേരിടുക എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἀντειπεῖν
  choice: എതിർത്തുപറയാൻ
  rationale: വാക്കാൽ മറുപടി പറഞ്ഞ് ഖണ്ഡിക്കുക എന്ന അർഥവ്യത്യാസം ‘ചെറുത്തുനിൽക്കാൻ’ എന്നതിൽനിന്ന് വേർതിരിച്ചു കാക്കുന്നു.
- source_word: οἱ ἀντικείμενοι ὑμῖν
  choice: നിങ്ങളെ എതിർക്കുന്നവർ
  rationale: ശിഷ്യന്മാർക്കെതിരെ നിലകൊള്ളുന്നവരെ ലളിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശു നൽകുന്നത് ‘വായ്’ ആണോ ‘വാക്കുകൾ’ ആണോ
  choice: വാക്കുകളും ജ്ഞാനവും
  alternative: വായും ജ്ഞാനവും
  rationale: ഗ്രീക്ക് രൂപകം യഥാർഥമാണെങ്കിലും ആധുനിക മലയാളത്തിൽ ‘വായ് നൽകും’ അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമാണ്; സന്ദർഭത്തിലെ വാഗ്ദാനത്തിന്റെ പ്രവർത്തനാർഥം ‘വാക്കുകൾ’ കൃത്യമായി നൽകുന്നു.
- issue: എതിരാളികൾക്ക് കഴിയാത്തത് വാക്കുകളെയും ജ്ഞാനത്തെയും സംബന്ധിച്ചാണോ
  choice: വാക്കുകളും ജ്ഞാനവും … ചെറുത്തുനിൽക്കാനോ എതിർത്തുപറയാനോ കഴിയാത്ത
  alternative: അതിനെ ചെറുത്തുനിൽക്കാനോ എതിർത്തുപറയാനോ കഴിയാത്ത
  rationale: ᾗ എന്ന ബന്ധസർവനാമത്തിന്റെ രൂപത്തിൽ വ്യാകരണപരമായ സംഘർഷമുണ്ടെങ്കിലും, നൽകപ്പെടുന്ന സംസാരവും ജ്ഞാനവും ചേർന്നതിനെ എതിരാളികൾ ഫലപ്രദമായി നേരിടാനാകില്ലെന്ന വാക്യത്തിന്റെ മൊത്തത്തിലുള്ള അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘എന്തെന്നാൽ’ γάρ എന്ന കാരണബന്ധം പ്രകടമാക്കുന്നു; ഇരട്ട ക്രിയകൾ തമ്മിലുള്ള അർഥവ്യത്യാസവും സംരക്ഷിച്ചിരിക്കുന്നു.
