source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: ml
  text: എന്നാൽ, യെരൂശലേം സൈന്യങ്ങളാൽ[a] വളയപ്പെട്ടിരിക്കുന്നത് നിങ്ങൾ കാണുമ്പോൾ, അതിന്റെ നാശം[b] അടുത്തെത്തിയിരിക്കുന്നു എന്ന് അപ്പോൾ അറിഞ്ഞുകൊള്ളുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൈനികപ്പാളയങ്ങളാൽ.’ ഗ്രീക്ക് പദത്തിന് പാളയങ്ങൾ എന്നോ പാളയമടിച്ച സൈന്യങ്ങൾ എന്നോ അർഥമാകാം; ഇവിടെ യെരൂശലേമിനെ ഉപരോധിക്കുന്ന സൈനികശക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘നാശം’ പ്രവാചകവിധിയുടെ ഭാഷയെ പ്രതിധ്വനിപ്പിക്കുന്നു; മത്തായി 24:15-ലെയും മർക്കോസ് 13:14-ലെയും ബന്ധപ്പെട്ട പ്രയോഗങ്ങൾ താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: എന്നാൽ ... കാണുമ്പോൾ
  rationale: ὅταν സഹിതമുള്ള ഉപവാക്യം ഭാവിയിലെ ഒരു സംഭവസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; δέ മുൻവാക്യങ്ങളിൽനിന്നുള്ള മൃദുവായ മാറ്റം/വ്യത്യാസം അടയാളപ്പെടുത്തുന്നു.
- source_word: ἴδητε
  choice: നിങ്ങൾ കാണുമ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ ആശയം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു; ὅταν-ഉപവാക്യത്തിന്റെ ഭാവിസാഹചര്യവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κυκλουμένην ὑπὸ στρατοπέδων
  choice: സൈന്യങ്ങളാൽ വളയപ്പെട്ടിരിക്കുന്നതു
  rationale: വർത്തമാന നിഷ്ക്രിയ കൃദന്തം യെരൂശലേമിന്റെ അന്നത്തെ അവസ്ഥയെ ചിത്രീകരിക്കുന്നു. στρατόπεδον പാളയങ്ങളെയോ പാളയമടിച്ച സൈന്യങ്ങളെയോ സൂചിപ്പിക്കാം; ഉപരോധസന്ദർഭത്തിൽ 'സൈന്യങ്ങൾ' അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: Ἰερουσαλήμ
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ സ്ഥലനാമരൂപം.
- source_word: τότε γνῶτε
  choice: അപ്പോൾ അറിഞ്ഞുകൊള്ളുക
  rationale: τότε-യുടെ സമയബന്ധവും γνῶτε എന്ന ആജ്ഞാരൂപത്തിന്റെ തിരിച്ചറിയാനുള്ള നിർദേശവും നിലനിർത്തുന്നു.
- source_word: ἤγγικεν
  choice: അടുത്തെത്തിയിരിക്കുന്നു
  rationale: ἐγγίζω-യുടെ പൂർണ്ണകാലം സമീപിച്ചെത്തിയതിന്റെ ഫലമായി ഇപ്പോൾ അടുത്തിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: അവളുടെ ശൂന്യമാക്കൽ
  rationale: ἐρήμωσις എന്നതിന്റെ നാശവും വിജനാവസ്ഥയിലാക്കലും ഉൾപ്പെടുന്ന പ്രവാചകവിധി-ധ്വനി നിലനിർത്തുന്നു. സ്ത്രീലിംഗമായ യെരൂശലേമിനെ 'അവൾ' എന്നു വ്യക്തിവൽക്കരിക്കുന്നത് മൂലപാഠത്തിന്റെ രൂപകഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യെരൂശലേമിന്മേൽ വരാനിരിക്കുന്ന വിധിയുടെ സ്വഭാവം
  choice: '''ശൂന്യമാക്കൽ'' എന്നു വിവർത്തനം ചെയ്ത് നഗരത്തിന്മേൽ അടുക്കുന്ന നാശാവസ്ഥയെ മാത്രം പ്രസ്താവിക്കുന്നു.'
  alternative: '''നാശം'' എന്നു കൂടുതൽ പൊതുവായി നൽകുക, അല്ലെങ്കിൽ പ്രധാനവാക്യത്തിൽത്തന്നെ ''ശൂന്യമാക്കുന്ന മ്ലേച്ഛത''യുമായി വ്യക്തമായി ബന്ധിപ്പിക്കുക.'
  rationale: ഈ വാക്യം സൈന്യങ്ങൾ നഗരത്തെ വളയുന്നതും അതിന്റെ ἐρήμωσις അടുത്തെത്തുന്നതുമാണ് പറയുന്നത്. ഒരു പ്രത്യേക അന്ത്യകാല വ്യാഖ്യാനം ചേർക്കാതെ പദത്തിന്റെ പ്രവാചകവിധി-ഭാരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള ബൈബിൾ ശൈലി പാലിച്ചു. 'അറിഞ്ഞുകൊള്ളുക' ആജ്ഞയുടെ ബലം നിലനിർത്തുന്നു; 'ശൂന്യമാക്കൽ' അപൂർവമെങ്കിലും മൂലപദത്തിന്റെ പ്രവാചകവും പ്രക്രിയാത്മകവുമായ ഭാരം 'നാശം' എന്നതിനെക്കാൾ നന്നായി സംരക്ഷിക്കുന്നു.
