  text: ὡς παγίς· ⸂ἐπεισελεύσεται γὰρ⸃ ἐπὶ πάντας τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: ml
  text: ഒരു കെണിപോലെ[a]. എന്തെന്നാൽ, ഭൂമുഖം മുഴുവൻ[c] വസിക്കുന്ന[b] എല്ലാവരുടെയും മേൽ അത് വന്നെത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു കുരുക്കുപോലെ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഇരിക്കുന്ന.’ ഇവിടെ ഗ്രീക്ക് പ്രയോഗം ഭൂമിയിൽ പാർക്കുന്നവരെയോ താമസിക്കുന്നവരെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘ഭൂമുഖം മുഴുവൻ’ എന്നതിന് ‘ദേശം മുഴുവൻ’ എന്നും വിവർത്തനം ചെയ്യാം; എന്നാൽ ഇവിടെ ‘ഭൂമി മുഴുവൻ’ എന്ന വ്യാപ്തിയാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς παγίς
  choice: ഒരു കെണിപോലെ
  rationale: παγίς എന്നത് ഇരയെ അപ്രതീക്ഷിതമായി കുടുക്കുന്ന കെണിയെയോ കുരുക്കിനെയോ സൂചിപ്പിക്കുന്നു. ആ ദൃശ്യത്തിന്റെ പെട്ടെന്നുള്ളതും ഒഴിവാകാനാവാത്തതുമായ സ്വഭാവം സാധാരണ മലയാളത്തിൽ ‘കെണി’ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπεισελεύσεται
  choice: അത് വന്നെത്തും
  rationale: ക്രിയയ്ക്ക് ഒരാളുടെമേൽ വന്നെത്തുക, ബാധിക്കുക എന്ന ആശയമുണ്ട്. മുൻവാക്യത്തിൽ പറഞ്ഞ ‘ആ ദിവസം’ ആണ് സന്ദർഭത്തിൽ സൂചിതമായ കർത്താവ്; മൂലപാഠത്തിലെപ്പോലെ ഇവിടെ ‘അത്’ എന്ന സർവനാമം നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള മുന്നറിയിപ്പിന് കാരണം നൽകുന്ന γάρ എന്ന ബന്ധകത്തിന്റെ വിശദീകരണശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπὶ πάντας
  choice: എല്ലാവരുടെയുംമേൽ
  rationale: ἐπίയും ദ്വിതീയാവിഭക്തിയും ഇവിടെ എല്ലാവരിലേക്കും വന്നുചേരുന്ന ചലനവും ബാധയും സൂചിപ്പിക്കുന്നു.
- source_word: τοὺς καθημένους
  choice: വസിക്കുന്ന
  rationale: κάθημαι അക്ഷരാർഥത്തിൽ ‘ഇരിക്കുക’ എന്നാണെങ്കിലും, ഈ ഭൂമിശാസ്ത്രപരമായ പ്രയോഗത്തിൽ താമസിക്കുക അഥവാ പാർക്കുക എന്നതാണ് ഉദ്ദേശ്യം. ‘വസിക്കുന്ന’ കൃതന്തഭാവവും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
- source_word: ἐπὶ πρόσωπον πάσης τῆς γῆς
  choice: ഭൂമുഖം മുഴുവൻ
  rationale: ‘ഭൂമിയുടെ മുഖത്തിന്മേൽ’ എന്ന സെമിറ്റിക് സ്വാധീനമുള്ള പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘ഭൂമുഖം’ എന്നു നൽകുന്നു; πάσης സർവവ്യാപകമായ പരിധി സൂചിപ്പിക്കുന്നതിനാൽ ‘മുഴുവൻ’ ചേർക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാല മുന്നറിയിപ്പിൽ γῆ എന്നതിന്റെ വ്യാപ്തി
  choice: ഭൂമുഖം മുഴുവൻ
  alternative: ദേശം മുഴുവൻ
  rationale: γῆ എന്നതിന് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാകാം. എന്നാൽ ‘ഭൂമുഖം മുഴുവൻ വസിക്കുന്ന എല്ലാവരും’ എന്ന സമഗ്രമായ പ്രയോഗം ഇവിടെ സാർവലൗകിക വ്യാപ്തിയെയാണ് കൂടുതൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും മറ്റൊരു സാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐπεισελεύσεται എന്ന ക്രിയയുടെ സൂചിത കർത്താവ്
  choice: അത്
  alternative: ആ ദിവസം
  rationale: മുൻവാക്യത്തിലെ ‘ആ ദിവസം’ തന്നെയാണ് സന്ദർഭപരമായ കർത്താവ്. എന്നാൽ ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം അതിനെ വീണ്ടും പേരെടുത്തു പറയാത്തതിനാൽ, വിവർത്തനവും സർവനാമം ഉപയോഗിച്ച് ആ ബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘കെണി,’ ‘വസിക്കുന്ന,’ ‘ഭൂമുഖം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതോടൊപ്പം ബൈബിൾഭാഷയുടെ ദൃശ്യശക്തിയും നിലനിർത്തുന്നു. വാക്യം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ഖണ്ഡമായതിനാൽ തുടക്കത്തിലെ ‘ഒരു കെണിപോലെ’ സ്വതന്ത്രവാക്യമായി തോന്നിയാലും ഉറവിടത്തിലെ ഘടന സംരക്ഷിച്ചു.
