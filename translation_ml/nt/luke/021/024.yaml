id: LUK.21.24
reference: Luke 21:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: ml
  text: അവർ വാളിന്റെ വായ്ത്തലയാൽ വീഴും; എല്ലാ ജനതകളിലേക്കും[a] തടവുകാരായി കൊണ്ടുപോകപ്പെടും. ജനതകളുടെ കാലങ്ങൾ[c] പൂർത്തിയാകുന്നതുവരെ യെരൂശലേം ജനതകളാൽ[b] ചവിട്ടിമെതിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാ വിജാതീയരുടെയും ഇടയിലേക്ക്’; ἔθνη എന്ന ഗ്രീക്ക് പദത്തിന് ‘ജനതകൾ’ എന്നും ‘വിജാതീയർ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യെരൂശലേം വിജാതീയരാൽ ചവിട്ടിമെതിക്കപ്പെടും.’
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘വിജാതീയരുടെ കാലങ്ങൾ പൂർത്തിയാകുന്നതുവരെ.’
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: വീഴും
  rationale: യുദ്ധസന്ദർഭത്തിൽ കൊല്ലപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപകാത്മക ശക്തി നിലനിർത്തുന്നു; പിന്നാലെയുള്ള വാൾ എന്ന പ്രയോഗം മരണവിധം വ്യക്തമാക്കുന്നു.
- source_word: στόματι μαχαίρης
  choice: വാളിന്റെ വായ്ത്തലയാൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘വാളിന്റെ വായാൽ’ എന്ന സെമിറ്റിക്-ഗ്രീക്ക് പ്രയോഗം. മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധത്തിൽ ‘വായ്ത്തല’ എന്നു നൽകി വാളിന്റെ മൂർച്ചയെന്ന ദൃശ്യബിംബം സംരക്ഷിക്കുന്നു.
- source_word: αἰχμαλωτισθήσονται
  choice: തടവുകാരായി കൊണ്ടുപോകപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും പിടിക്കപ്പെട്ടശേഷം അന്യദേശങ്ങളിലേക്കു കൊണ്ടുപോകപ്പെടുന്നതുമായ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: എല്ലാ ജനതകളിലേക്കും
  rationale: εἰς സൂചിപ്പിക്കുന്ന നീക്കവും വ്യാപനവും നിലനിർത്തുന്നു. ἔθνη എന്ന പദത്തിന്റെ ‘ജനതകൾ/വിജാതീയർ’ എന്ന അർഥസാധ്യതയിൽ പ്രധാനപാഠം ‘ജനതകൾ’ എന്നു നൽകി പദബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: Ἰερουσαλήμ
  choice: യെരൂശലേം
  rationale: ആധുനിക മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം.
- source_word: πατουμένη
  choice: ചവിട്ടിമെതിക്കപ്പെടും
  rationale: ἔσται-യോടു ചേർന്ന കർമണി കൃതന്തം തുടർച്ചയുള്ള ഭാവസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു; കീഴടക്കലിന്റെയും അപമാനത്തിന്റെയും ദൃശ്യബിംബം ഈ മലയാളപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ὑπὸ ἐθνῶν
  choice: ജനതകളാൽ
  rationale: അതേ വാക്യത്തിലെ ἔθνη എന്ന പദത്തിന് ഒരേ മലയാളപദം ഉപയോഗിച്ച് ശാബ്ദിക ഐക്യം നിലനിർത്തുന്നു; ‘വിജാതീയർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἄχρι οὗ
  choice: വരെ
  rationale: കാലപരിധി സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πληρωθῶσιν
  choice: പൂർത്തിയാകുക
  rationale: കർമണിഭാവവും നിശ്ചിത കാലഘട്ടം നിറവേറുക/തികയുക എന്ന തുറന്ന അർഥവും നിലനിർത്തുന്നു; പ്രത്യേക അന്ത്യകാലക്രമം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: καιροὶ ἐθνῶν
  choice: ജനതകളുടെ കാലങ്ങൾ
  rationale: καιροί എന്നതിലെ നിർണായകമായ കാലഘട്ടങ്ങൾ എന്ന ഭാവവും ജനതകളുമായുള്ള ഷഷ്ഠീവ്യാകരണബന്ധത്തിന്റെ അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ ἔθνη എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മൂന്നു സ്ഥാനങ്ങളിലും ‘ജനതകൾ’
  alternative: ‘വിജാതീയർ’ അഥവാ സന്ദർഭാനുസരിച്ച് ‘ജനതകൾ/വിജാതീയർ’
  rationale: ഒരേ ഗ്രീക്ക് പദത്തിന്റെ ശാബ്ദിക ഐക്യം സംരക്ഷിക്കുകയും, പരാമർശം രാഷ്ട്രീയ ജനതകളെയാണോ യഹൂദരല്ലാത്തവരെയാണോ പ്രത്യേകമായി ഉദ്ദേശിക്കുന്നത് എന്നത് പ്രധാനപാഠത്തിൽ മുൻകൂട്ടി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: καιροὶ ἐθνῶν എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: ‘ജനതകളുടെ കാലങ്ങൾ പൂർത്തിയാകുന്നതുവരെ’
  alternative: ‘വിജാതീയരുടെ കാലങ്ങൾ തികയുന്നതുവരെ’ അഥവാ ‘ജനതകൾക്കായി നിശ്ചയിച്ച കാലങ്ങൾ പൂർത്തിയാകുന്നതുവരെ’
  rationale: ഒരു നിശ്ചിത പരിധിയുള്ള കാലത്തെ സൂചിപ്പിക്കുന്ന ഭാരം നിലനിർത്തുന്നു; എന്നാൽ പ്രത്യേക അന്ത്യകാല വ്യവസ്ഥയോ ‘കാലങ്ങൾ’ ആരുടേതാണെന്ന വ്യാഖ്യാനമോ പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘വാളിന്റെ വായ്ത്തല’ എന്ന ദൃശ്യപ്രയോഗം മൂലപാഠത്തിന്റെ രൂപകം സൂക്ഷിക്കുന്നു; ബാക്കി വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ ബാധകമായ മൂന്നു ἔθνη പ്രയോഗങ്ങളോടു ചേർത്തിരിക്കുന്നു.
