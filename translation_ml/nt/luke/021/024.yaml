  source_fidelity: 'The Malayalam closely represents every major element of the Greek: death by the sword, captivity among all nations, Jerusalem''s being trampled by nations, and the temporal limit marked by the fulfillment of the nations'' times. The consistent rendering of ἔθνη as ‘ജനതകൾ’ appropriately preserves the lexical cohesion and the contextual ambiguity.'
