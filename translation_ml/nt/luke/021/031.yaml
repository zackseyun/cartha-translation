id: LUK.21.31
reference: Luke 21:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: ml
  text: അതുപോലെ നിങ്ങളും, ഇവ സംഭവിക്കുന്നത്[a] കാണുമ്പോൾ, ദൈവരാജ്യം[b] അടുത്തിരിക്കുന്നുവെന്ന് അറിഞ്ഞുകൊള്ളുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇവ നടക്കുന്നത്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദൈവത്തിന്റെ ഭരണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: അതുപോലെ നിങ്ങളും
  rationale: മുൻപുള്ള ഉപമയുടെ പ്രയോഗത്തിലേക്കുള്ള നിഗമനസ്വഭാവമുള്ള മാറ്റവും ὑμεῖς എന്ന വ്യക്തമായ സർവനാമത്തിന്റെ ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅταν ἴδητε
  choice: കാണുമ്പോൾ
  rationale: ὅταν കൂടിയുള്ള aorist subjunctive ഭാവിയിലെ ഒരു സന്ദർഭത്തെ സൂചിപ്പിക്കുന്നു; ‘കാണുമ്പോൾ’ പ്രവചനസന്ദർഭത്തിൽ സ്വാഭാവികവും അർഥവ്യക്തവുമാണ്.
- source_word: ταῦτα γινόμενα
  choice: ഇവ സംഭവിക്കുന്നത്
  rationale: ταῦτα മുൻപ് വിവരിച്ച അടയാളങ്ങളെ ചൂണ്ടിക്കാണിക്കുന്നു; γινόμενα അവ സംഭവിച്ചുകൊണ്ടിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സംഭവിക്കുന്നത്’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: γινώσκετε
  choice: അറിഞ്ഞുകൊള്ളുക
  rationale: ഇത് ശിഷ്യന്മാരോടുള്ള നിർദേശമായ present imperative ആണ്. ‘അറിഞ്ഞുകൊള്ളുക’ അടയാളങ്ങളുടെ പ്രാധാന്യം തിരിച്ചറിഞ്ഞ് മനസ്സിലാക്കണമെന്ന ഭാവം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἐγγύς ἐστιν
  choice: അടുത്തിരിക്കുന്നു
  rationale: സമീപതയെ സൂചിപ്പിക്കുന്ന ἐγγύς ἐστιν എന്ന പ്രയോഗം സമയപരമോ രൂപകപരമോ ആയ പരിധി അനാവശ്യമായി നിർണയിക്കാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: ‘ദൈവരാജ്യം’ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സ്വാഭാവികവുമാണ്; രാജ്യമെന്ന മേഖലയുടെയും ദൈവത്തിന്റെ രാജകീയ ഭരണത്തിന്റെയും അർഥസാധ്യതകൾ ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിൽ ‘ദൈവരാജ്യം’ എന്നതിന്റെ കൃത്യമായ സൂചന
  choice: വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ ‘ദൈവരാജ്യം’ എന്നു നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റെ ഭരണം’ അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ രാജകീയ ഭരണം അതിന്റെ പൂർത്തീകരണത്തിൽ അടുത്തിരിക്കുന്നു.’
  rationale: വിവരിച്ച അടയാളങ്ങളുമായി ബന്ധപ്പെടുത്തി ദൈവരാജ്യത്തിന്റെ സമീപത വാക്യം അറിയിക്കുന്നുണ്ടെങ്കിലും, അത് പ്രത്യക്ഷീകരണമോ പൂർത്തീകരണമോ നീതീകരണമോ എന്നത് മൂലപാഠം കൃത്യമായി നിർവചിക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതും അതേസമയം തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘അറിഞ്ഞുകൊള്ളുക’ നിർദേശഭാവം വ്യക്തമായി സൂക്ഷിക്കുന്നു; അനാവശ്യമായ പഴഞ്ചൊല്ലുകളോ സഭാവിഭാഗ-വിശേഷ പദപ്രയോഗങ്ങളോ ഒഴിവാക്കി.
