id: LUK.21.9
reference: Luke 21:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: ml
  text: എന്നാൽ യുദ്ധങ്ങളെയും അശാന്തികളെയും[a] കുറിച്ച് നിങ്ങൾ കേൾക്കുമ്പോൾ ഭയന്നുപോകരുത്; കാരണം ഇവ ആദ്യം സംഭവിക്കേണ്ടതാണ്. എന്നാൽ അവസാനം ഉടനെ വരികയില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കലാപങ്ങളെയും,’ ‘പ്രക്ഷോഭങ്ങളെയും,’ ‘ക്രമക്കേടുകളെയും.’
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘എന്നാൽ അവസാനം ഉടനെ അല്ല.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: എന്നാൽ ... കേൾക്കുമ്പോൾ
  rationale: ὅταν സൂചിപ്പിക്കുന്ന ഭാവികാലസംബന്ധിയായ അനിശ്ചിത സമയബന്ധം സ്വാഭാവികമായി ‘കേൾക്കുമ്പോൾ’ എന്നു നൽകി; δέ മുൻവാക്യത്തിൽനിന്നുള്ള മൃദുവായ തിരിവായി ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἀκούσητε
  choice: കുറിച്ച് നിങ്ങൾ കേൾക്കുമ്പോൾ
  rationale: യുദ്ധം, കലാപം തുടങ്ങിയ സംഭവങ്ങളെപ്പറ്റിയുള്ള വാർത്തകൾ കേൾക്കുക എന്ന സന്ദർഭാർത്ഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πολέμους
  choice: യുദ്ധങ്ങളെ
  rationale: ആയുധസംഘർഷങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന് നേരിട്ടും സാധാരണവുമായ തുല്യപദം.
- source_word: ἀκαταστασίας
  choice: കലാപങ്ങളെ
  rationale: സാമൂഹിക-രാഷ്ട്രീയ അസ്ഥിരത, പ്രക്ഷോഭം, ക്രമക്കേട് എന്നീ വിശാല അർത്ഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പദം; ഇതിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: μὴ πτοηθῆτε
  choice: ഭയന്നുപോകരുത്
  rationale: പെട്ടെന്ന് ഭീതിയിലോ പരിഭ്രാന്തിയിലോ ആകുന്നതിനെ വിലക്കുന്ന ശക്തി, അതിരുകടന്ന ഔപചാരികതയില്ലാതെ പ്രകടമാക്കുന്നു.
- source_word: δεῖ γὰρ ταῦτα γενέσθαι πρῶτον
  choice: ഇവ ആദ്യം സംഭവിക്കേണ്ടതാണ്
  rationale: δεῖയുടെ അനിവാര്യതയും πρῶτον സൂചിപ്പിക്കുന്ന ക്രമവും വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു; γάρയുടെ വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിലൂടെ പ്രകടമാണ്.
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: എങ്കിലും അവസാനം ഉടനെ വരികയില്ല
  rationale: മൂലത്തിലെ ക്രിയാരഹിതമായ സംക്ഷിപ്ത പ്രയോഗത്തിന്റെ അർത്ഥം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘വരികയില്ല’ ചേർത്തു; കലഹങ്ങൾക്കു പിന്നാലെ അന്ത്യം തൽക്ഷണം സംഭവിക്കില്ലെന്ന സമയപരമായ നിയന്ത്രണം മാത്രം പറയുന്നു.
theological_decisions:
- issue: അന്ത്യത്തിന്റെ സമയത്തെക്കുറിച്ചുള്ള പ്രസ്താവന
  choice: യുദ്ധങ്ങളും കലാപങ്ങളും ആദ്യം സംഭവിക്കേണ്ടവയാണ്; എന്നാൽ അവ കേൾക്കുന്നതുകൊണ്ട് അവസാനം ഉടനെ എത്തിയെന്നർത്ഥമില്ല.
  alternative: ഈ സംഭവങ്ങൾക്കു പിന്നാലെ അവസാനം ഉടൻ വരികയില്ല; അല്ലെങ്കിൽ അവ അവസാനത്തിനു മുമ്പുള്ള കാലഘട്ടത്തിലെ സംഭവങ്ങളാണ്, അവസാനം തന്നെയല്ല.
  rationale: ഒരു പ്രത്യേക അന്ത്യകാലക്രമം അടിച്ചേൽപ്പിക്കാതെ, കലഹവാർത്തകളെയും അന്ത്യത്തിന്റെ തൽക്ഷണ വരവിനെയും സമീകരിക്കരുതെന്ന വാക്യത്തിന്റെ മുന്നറിയിപ്പും സമയപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കലാപങ്ങൾ’ എന്നത് ἀκαταστασίαιയുടെ വിശാലമായ അസ്ഥിരതാ-അർത്ഥം മുഖ്യവാചകത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; അർത്ഥപരിധി അടിക്കുറിപ്പിൽ വികസിപ്പിച്ചിരിക്കുന്നു. ‘അവസാനം’ എന്നത് τὸ τέλοςയുടെ ഉദ്ദേശ്യപൂർവമായ അനിർദിഷ്ടത നിലനിർത്തുന്നു.
