    issue: ‘കലാപങ്ങളെയും’ is too narrow for ἀκαταστασίας.
    rationale: Although ‘കലാപം’ can refer to public disorder, its primary contemporary sense often suggests riot or revolt. The Greek term is broader and can include instability, disorder, and turmoil without specifying insurrection.
