  to: എന്നാൽ യുദ്ധങ്ങളെയും അശാന്തികളെയും[a] കുറിച്ച് നിങ്ങൾ കേൾക്കുമ്പോൾ ഭയന്നുപോകരുത്; കാരണം ഇവ ആദ്യം സംഭവിക്കേണ്ടതാണ്. എന്നാൽ അവസാനം ഉടനെ വരികയില്ല.[b]
