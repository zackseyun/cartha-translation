  rationale: The revision replaces a potentially misleading term for formal self-defense with standard Malayalam «പ്രതിരോധം» and smooths the inward-resolution idiom into natural modern usage. It preserves the imperative, inferential connection, plural addressees, and the prohibition against advance rehearsal or preparation.
