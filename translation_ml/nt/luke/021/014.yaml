  choice: ഉറപ്പിച്ചുകൊള്ളുക
  rationale: τίθημι എന്ന ക്രിയ ἐν ταῖς καρδίαις എന്ന പ്രയോഗത്തോടൊപ്പം ഇവിടെ ഉള്ളിൽ ദൃഢമായി തീരുമാനിക്കുക എന്ന ആശയം നൽകുന്നു. ‘ഉറപ്പിച്ചുകൊള്ളുക’ ആജ്ഞയുടെ ശക്തിയും സ്വാഭാവികമായ മലയാളപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
