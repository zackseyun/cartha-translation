    issue: «സ്വയം പ്രതിവാദിക്കാൻ» for ἀπολογηθῆναι
    rationale: This can suggest contradicting or arguing back rather than giving a defense. «സ്വന്തം പ്രതിരോധത്തിനായി» more accurately represents the formal defensive sense while retaining the self-referential meaning.
  - severity: low
    issue: «ഹൃദയങ്ങളിൽ ഉറപ്പിച്ചുകൊള്ളുക» is somewhat stiff in current Malayalam
    rationale: «മനസ്സിൽ ഉറപ്പിച്ചുകൊള്ളുക» is the normal Malayalam idiom for making a settled inward resolution; it retains the source idiom’s intended force.
