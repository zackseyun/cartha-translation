  rationale: ഗ്രീക്കിലെ ബഹുവചനവും ആന്തരിക ദൃഢനിശ്ചയത്തെ സൂചിപ്പിക്കുന്ന ഹൃദയരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: μὴ προμελετᾶν
  choice: മുൻകൂട്ടി തയ്യാറെടുക്കേണ്ടതില്ലെന്ന്
  rationale: προμελετάω മുൻകൂട്ടി ചിന്തിച്ചൊരുക്കുകയോ അഭ്യസിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ തിരഞ്ഞെടുപ്പ് അതിന്റെ വിശാലമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπολογηθῆναι
  choice: സ്വയം പ്രതിവാദിക്കാൻ
  rationale: ഔപചാരികമായോ നിയമപരമായോ സ്വന്തം പക്ഷം അവതരിപ്പിച്ച് പ്രതിരോധിക്കുന്ന ആശയം നൽകുന്നു; മധ്യമരൂപത്തിലെ സ്വയംസംബന്ധമായ ഭാവവും ‘സ്വയം’ വ്യക്തമാക്കുന്നു.
