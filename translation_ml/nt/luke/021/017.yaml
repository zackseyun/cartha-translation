translation:
  language: ml
  text: എന്റെ നാമം നിമിത്തം എല്ലാവരും നിങ്ങളെ വെറുക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നെ നിമിത്തം.’ ‘എന്റെ നാമം’ എന്ന പ്രയോഗം യേശുവിന്റെ വ്യക്തിത്വത്തെയും അധികാരത്തെയും അവനോടുള്ള കൂറ് ഏറ്റുപറയുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: നിങ്ങളെ വെറുക്കും
  rationale: εἰμίയുടെ ഭാവികാലരൂപവും വർത്തമാനകാല കർമണി പങ്കാളിത്തരൂപവും ചേർന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഭാവികാല കർമണി അർഥത്തോടെ നൽകുന്നു. പദാനുപദമായ ‘നിങ്ങൾ വെറുക്കപ്പെടുന്നവരായിരിക്കും’ എന്നതിനെക്കാൾ ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὑπὸ πάντων
  choice: എല്ലാവരും
  rationale: ὑπό + സമ്പ്രദാനസംബന്ധിയായ ബഹുവചനം പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ കർമണി അർഥമുള്ള സ്വാഭാവിക സകർമക വാക്യഘടനയിൽ ‘എല്ലാവരും’ പ്രവർത്താവായി നൽകുന്നു; πάντωνന്റെ വ്യാപകത നിലനിർത്തുന്നു.
- source_word: διὰ τὸ ὄνομά μου
  choice: എന്റെ നാമം നിമിത്തം
  rationale: διά + ദ്വിതീയാവിഭക്തി കാരണം സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ കാരണാർഥം വ്യക്തമായി നൽകുന്നു; ‘എന്റെ നാമം’ എന്ന മൂലപ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പീഡനസന്ദർഭത്തിലെ ‘എന്റെ നാമം’ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ‘എന്റെ നാമം’ എന്ന മൂലപ്രയോഗം പ്രധാനവാക്യത്തിൽ നിലനിർത്തി.
  alternative: ‘ഞാൻ നിമിത്തം’ അല്ലെങ്കിൽ ‘നിങ്ങൾ എന്റേതായതിനാൽ’
  rationale: τὸ ὄνομά μου എന്നത് യേശുവിന്റെ വ്യക്തിത്വം, അധികാരം, അവനോടുള്ള പരസ്യമായ കൂറ് എന്നിവയെ ഉൾക്കൊള്ളാം. അതിനെ ഒരേയൊരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കാൻ അക്ഷരാർഥത്തിന് സമീപമുള്ള പ്രയോഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പേര്’ എന്ന സാധാരണപദത്തിനുപകരം ബൈബിൾസന്ദർഭത്തിലെ വ്യക്തിത്വ-അധികാര ധ്വനി സൂക്ഷിക്കാൻ സ്വാഭാവികമായി പരിചിതമായ ‘നാമം’ തെരഞ്ഞെടുത്തു.
