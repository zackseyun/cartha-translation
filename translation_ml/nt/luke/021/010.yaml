id: LUK.21.10
reference: Luke 21:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: ml
  text: 'പിന്നെ അവൻ അവരോടു പറഞ്ഞു: “ജനത ജനതയ്ക്കെതിരെയും രാജ്യം രാജ്യത്തിനെതിരെയും എഴുന്നേൽക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഉയർന്നുവരും.”
    reason: ἐγείρω എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ മറ്റൊരു സ്വാഭാവിക അർഥസാധ്യത.
lexical_decisions:
- source_word: τότε
  choice: പിന്നെ
  rationale: മുൻസന്ദർഭത്തോടുള്ള കാലക്രമബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἔλεγεν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ അപൂർണഭൂതകാലരൂപം ഇവിടെ നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നതിനാൽ, മലയാള ആഖ്യാനശൈലിയിൽ സ്വാഭാവികമായ ലളിതഭൂതകാലം ഉപയോഗിച്ചു; ആവർത്തനമോ തുടർച്ചയോ അനാവശ്യമായി ഊന്നുന്നില്ല.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: പരോക്ഷ കർമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Ἐγερθήσεται
  choice: എഴുന്നേൽക്കും
  rationale: സംഘർഷസൂചകമായ ഈ പ്രയോഗത്തിൽ എതിർപ്പോടെ ഉയർന്നുവരുക എന്ന ആശയം നിലനിർത്തുന്നു; രൂപത്തിലെ മധ്യ/കർമണി സാധ്യതയെ മലയാളത്തിൽ കൃത്രിമമായി നിർബന്ധിക്കുന്നില്ല.
- source_word: ἔθνος
  choice: ജനത
  rationale: ഒരു ജനസമൂഹത്തെയും രാഷ്ട്രീയ കൂട്ടായ്മയെയും സൂചിപ്പിക്കുന്നു; ‘രാജ്യം’ എന്ന സമാന്തരപദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἐπ’ ἔθνος
  choice: ജനതയ്ക്കെതിരെ
  rationale: ἐπί + accusative ഇവിടെ ശത്രുതാപരമായ എതിർപ്പിനെ സൂചിപ്പിക്കുന്നു.
- source_word: βασιλεία
  choice: രാജ്യം
  rationale: ഇവിടെ അമൂർത്തമായ രാജത്വമല്ല, രാഷ്ട്രീയ അധീനപ്രദേശമോ ഭരണകൂടമോ ആണ് ഉദ്ദേശ്യം.
- source_word: ἐπὶ βασιλείαν
  choice: രാജ്യത്തിനെതിരെ
  rationale: ആവർത്തിത സംഘർഷസൂത്രത്തിലെ ശത്രുതാപരമായ ബന്ധം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: അന്ത്യകാല സംഘർഷസൂത്രം
  choice: ജനതകളും രാജ്യങ്ങളും തമ്മിലുള്ള സംഘർഷത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള പ്രവചനമായി പരിഭാഷപ്പെടുത്തി; പ്രത്യേക അന്ത്യകാല വ്യവസ്ഥിതി ചേർത്തിട്ടില്ല.
  alternative: ഇത് യെരൂശലേമിന്റെ പതനത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായോ അന്ത്യത്തിന്റെ വിശദമായ കാലക്രമമായോ നിർണ്ണയിക്കുക.
  rationale: വാക്യം തന്നെ പൊതുവായ രാഷ്ട്രീയ കലഹമാണ് പ്രസ്താവിക്കുന്നത്; വിശാലമായ യുഗാന്തചർച്ചകളെ പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. സമാന്തര ഘടന സംരക്ഷിച്ചിരിക്കുന്നു; വാക്യത്തിന്റെ യുഗാന്തശാസ്ത്രപരമായ വ്യാപ്തി നിർണ്ണയിച്ചിട്ടില്ല.
