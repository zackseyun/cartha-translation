source:
  edition: SBLGNT
  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഇവരെല്ലാവരും തങ്ങളുടെ സമൃദ്ധിയിൽനിന്ന് വഴിപാടുകളിൽ[a] ഇട്ടു; ഇവളാകട്ടെ തന്റെ കുറവിൽനിന്ന്[b], തനിക്കു ജീവിക്കാനുണ്ടായിരുന്നതെല്ലാം[c] ഇട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദാനങ്ങളിൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ദാനങ്ങൾ’; ഇവിടെ ദേവാലയത്തിൽ സമർപ്പിച്ച വഴിപാടുകളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തന്റെ ദാരിദ്ര്യത്തിൽനിന്ന്’ അല്ലെങ്കിൽ ‘തന്റെ ഞെരുക്കത്തിൽനിന്ന്.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘തന്റെ ഉപജീവനം മുഴുവനും’ അല്ലെങ്കിൽ ‘ജീവിക്കാനുള്ള തന്റെ വക മുഴുവനും.’ ഇവിടെ അർത്ഥം അവളുടെ അസ്തിത്വം മുഴുവനുമല്ല, ജീവിക്കാനുള്ള ഉപാധികൾ മുഴുവനുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: എന്തെന്നാൽ, ഇവരെല്ലാവരും
  rationale: γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്തെന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി; πάντες οὗτοι എന്നത് സ്വാഭാവികമായി ‘ഇവരെല്ലാവരും’ എന്നു നൽകി.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: തങ്ങളുടെ സമൃദ്ധിയിൽനിന്ന്
  rationale: περισσεύοντος സൂചിപ്പിക്കുന്ന അധികസമ്പത്തും സമൃദ്ധിയും നിലനിർത്തുകയും വിധവയുടെ ഇല്ലായ്മയോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: വഴിപാടുകളിൽ ഇട്ടു
  rationale: ἔβαλον എന്നതിലെ നിക്ഷേപിക്കുന്ന ഭൗതികപ്രവൃത്തി ‘ഇട്ടു’ എന്നു നിലനിർത്തി. ദേവാലയസന്ദർഭത്തിലെ δῶρα സ്വാഭാവിക മലയാളത്തിൽ ‘വഴിപാടുകൾ’ എന്നു നൽകി.
- source_word: αὕτη δὲ
  choice: ഇവളാകട്ടെ
  rationale: മുമ്പ് പരാമർശിച്ച വിധവയെയാണ് സ്ത്രീലിംഗ നിർദ്ദേശകസർവനാമം സൂചിപ്പിക്കുന്നത്; δέ-യുടെ വൈരുധ്യം ‘ആകട്ടെ’ വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: തന്റെ ഇല്ലായ്മയിൽനിന്ന്
  rationale: ὑστέρημα എന്നതിലെ കുറവ്, അഭാവം എന്നീ ആശയങ്ങൾ സമൃദ്ധിയോടുള്ള നേരിട്ടുള്ള വൈരുധ്യത്തോടെ നിലനിർത്തുന്നു; ‘ദാരിദ്ര്യം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം പ്രധാനപാഠത്തിൽ ഒഴിവാക്കി.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: ഉപജീവനത്തിനായി തനിക്കുണ്ടായിരുന്നതെല്ലാം
  rationale: ഈ സാമ്പത്തികസന്ദർഭത്തിൽ βίος അസ്തിത്വപരമായ ‘ജീവൻ’ എന്നതല്ല, ജീവിക്കാനുള്ള ഉപാധികളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: ἔβαλεν
  choice: ഇട്ടു
  rationale: നാണയങ്ങൾ നിക്ഷേപിച്ച പ്രവൃത്തിയുടെ ഭൗതികചിത്രം നിലനിർത്തുന്നു; വാക്യത്തിലെ ആവർത്തനവും ഗ്രീക്കിനനുസരിച്ച് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിധവയുടെ ദാനത്തിൽ βίος എന്നതിന്റെ അർത്ഥം
  choice: ജീവിക്കാനുള്ള ഭൗതിക ഉപാധികൾ എന്ന അർത്ഥത്തിൽ ‘ഉപജീവനത്തിനായി തനിക്കുണ്ടായിരുന്നതെല്ലാം’
  alternative: ‘അവളുടെ ജീവിതം മുഴുവൻ’
  rationale: സന്ദർഭം ധനദാനത്തെക്കുറിച്ചാണ്; ഇവിടെ βίος ഉപജീവനസാധനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ജീവിതം മുഴുവൻ’ എന്നത് അവൾ അക്ഷരാർഥത്തിൽ തന്റെ ജീവൻ അർപ്പിച്ചു എന്ന തെറ്റായ ധാരണ സൃഷ്ടിക്കാം.
- issue: τὰ δῶρα എന്നതിന്റെ സൂചന
  choice: ‘വഴിപാടുകൾ’
  alternative: ‘ദാനങ്ങൾ’ അല്ലെങ്കിൽ ‘ദേവാലയഭണ്ഡാരം’
  rationale: ദേവാലയസന്ദർഭത്തിൽ സമർപ്പിക്കപ്പെട്ട ദാനങ്ങൾ എന്ന ആശയം ‘വഴിപാടുകൾ’ സ്വാഭാവികമായി നൽകുന്നു. ‘ദേവാലയഭണ്ഡാരം’ എന്നു പറയുന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ പ്രത്യേകത ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘എന്തെന്നാൽ’ വിശദീകരണബന്ധവും ‘ഇവളാകട്ടെ’ വൈരുധ്യവും വ്യക്തമാക്കുന്നു. പ്രധാനപാഠം സ്വാഭാവികമാക്കിക്കൊണ്ട് സമൃദ്ധി–ഇല്ലായ്മ, വഴിപാടിലേക്കുള്ള നിക്ഷേപം, ഉപജീവനസാധനങ്ങൾ മുഴുവനും എന്ന മൂലപാഠഘടകങ്ങൾ സംരക്ഷിച്ചു.
