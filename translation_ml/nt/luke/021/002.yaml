lexical_decisions:
- source_word: εἶδεν
  choice: കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനാർഥം നേരിട്ട് നൽകുന്നു; ‘നിരീക്ഷിച്ചു’ എന്നത് ആവശ്യത്തിലധികം വ്യാഖ്യാനാത്മകമാകും.
- source_word: δέ
  choice: -യും
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ്. മുൻവാക്യത്തോടുള്ള തുടർച്ച മലയാളത്തിൽ ‘വിധവയെയും’ എന്ന പ്രയോഗം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τινα
  choice: ഒരു
  rationale: പരാമർശിക്കപ്പെടുന്ന വ്യക്തി നിർദിഷ്ടയല്ലെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: χήραν
  choice: വിധവ
  rationale: χήραയുടെ നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ മലയാളസമാനപദം.
- source_word: πενιχρὰν
  choice: ദരിദ്രയായ
  rationale: സാമ്പത്തിക ദാരിദ്ര്യത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘അഗതിയായ’ എന്നത് മൂലപദത്തേക്കാൾ ശക്തമായ അർഥം നൽകാം.
- source_word: βάλλουσαν
  choice: ഇടുന്ന
  rationale: ഭണ്ഡാരത്തിൽ പണം നിക്ഷേപിക്കുന്ന പ്രവൃത്തിക്ക് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികം; ‘എറിയുന്ന’ എന്ന അക്ഷരാർഥം ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കാം.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: മുൻസന്ദർഭത്തിൽ വ്യക്തമാക്കിയ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: λεπτὰ δύο
  choice: രണ്ടു ചെറിയ ചെമ്പുനാണയങ്ങൾ
  rationale: നാണയങ്ങളുടെ എണ്ണവും വളരെ കുറഞ്ഞ മൂല്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; ചരിത്രനാമമായ ‘ലെപ്താ’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
