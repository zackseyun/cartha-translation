  text: And not a hair from your head will perish[a].
translation:
  language: ml
  text: നിങ്ങളുടെ തലയിൽനിന്ന് ഒരു മുടിയിഴപോലും നശിച്ചുപോകുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിങ്ങളുടെ തലയിൽനിന്ന് ഒരു മുടിയിഴപോലും തീർച്ചയായും നശിച്ചുപോകുകയില്ല.” ശക്തമായ ഉറപ്പ് പ്രകടിപ്പിക്കാൻ ഗ്രീക്ക് മൂലപാഠം ഊന്നൽനൽകുന്ന ഇരട്ടനിഷേധം ഉപയോഗിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേക സംയോജകപദം ചേർക്കാതെ)
  rationale: മലയാളത്തിൽ മുൻവാക്യത്തോടുള്ള തുടർച്ച പദക്രമത്തിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു; ‘കൂടാതെ’ എന്നോ ‘എന്നാൽ’ എന്നോ ചേർത്താൽ ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ഊന്നലോ വൈരുധ്യമോ വരാം.
- source_word: θρὶξ
  choice: ഒരു മുടിയിഴപോലും
  rationale: ഏകവചനമായ ‘മുടിയിഴ’ നിലനിർത്തുകയും ‘പോലും’ ഉപയോഗിച്ച് οὐ μή എന്ന ശക്തമായ നിഷേധത്തിന്റെ സ്വാഭാവിക മലയാളഭാവം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: നിങ്ങളുടെ തലയിൽനിന്ന്
  rationale: ἐκ എന്നതിന്റെ ‘നിന്ന്’ എന്ന അർഥവും, ബഹുവചന അഭിസംബോധനയിൽ മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹവാചക ഏകവചനമായ ‘തല’യും നിലനിർത്തുന്നു.
- source_word: οὐ μὴ
  choice: പോലും ... നശിച്ചുപോകുകയില്ല
  rationale: അയോറിസ്റ്റ് സബ്ജങ്ക്റ്റീവിനോടുകൂടിയ ഇരട്ടനിഷേധത്തിന്റെ ശക്തമായ ഉറപ്പ് മലയാളത്തിൽ ‘പോലും’ എന്ന ഊന്നലും നിഷേധക്രിയയും ചേർത്ത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπόληται
  choice: നശിച്ചുപോകുകയില്ല
  rationale: ‘നഷ്ടപ്പെടുക’, ‘നശിക്കുക’ എന്നീ സാധ്യതകളിൽ, ഗൗരവമുള്ള ഭാഷാഭാവവും പൂർണമായ ഇല്ലായ്മ/നഷ്ടം എന്ന വിശാലതയും നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
theological_decisions:
- issue: സമീപസന്ദർഭത്തിലെ പീഡനത്തിന്റെയും ചിലരുടെ മരണത്തിന്റെയും പ്രവചനങ്ങളുമായുള്ള പ്രത്യക്ഷമായ സംഘർഷം
  choice: സമ്പൂർണ സംരക്ഷണത്തെക്കുറിച്ചുള്ള ശക്തമായ പഴഞ്ചൊൽസ്വഭാവമുള്ള ഉറപ്പായി വായിക്കാവുന്ന വിധത്തിൽ വാക്യം നിലനിർത്തി; അതിന്റെ പരിധി മുഖ്യപാഠത്തിൽ വിശദീകരിച്ചില്ല.
  alternative: ശാരീരിക പരിക്കോ മരണമോ ഒരിക്കലും സംഭവിക്കില്ലെന്ന അക്ഷരാർഥ വാഗ്ദാനമായി വ്യക്തമാക്കുക.
  rationale: അടുത്ത വാക്യസന്ദർഭം ചില ശിഷ്യന്മാർ കൊല്ലപ്പെടുമെന്ന് പറയുന്നു. അതിനാൽ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് വിവർത്തനത്തിൽ പരിഹരിക്കാതെ, ഗ്രീക്കിലെ ഉറപ്പും രൂപകസാധ്യതയും അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുടിയിഴപോലും’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ഗ്രീക്ക് വാക്യത്തിന്റെ ഊന്നൽ വഹിക്കുന്നതുമാണ്; സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് വിശദീകരിച്ച് തീർക്കുന്ന ഭാഷ ഒഴിവാക്കി.
