source:
  edition: SBLGNT
  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: ml
  text: 'ചിലർ ദൈവാലയത്തെക്കുറിച്ച്[a], അത് മനോഹരമായ കല്ലുകളും സമർപ്പിത ദാനങ്ങളും[b]കൊണ്ട് അലങ്കരിക്കപ്പെട്ടിരിക്കുന്നു എന്നു പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ, അദ്ദേഹം പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ ἱερόν എന്ന പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; ദൈവാലയപരിസരം മുഴുവനെയും പൊതുവായി സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘ദൈവത്തിന് സമർപ്പിച്ച സമ്മാനങ്ങൾ.’ ദൈവത്തിന് സമർപ്പിച്ച് ദൈവാലയത്തിൽ പ്രദർശിപ്പിച്ചിരുന്ന ദാനങ്ങളെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: ചിലർ ... സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയെ സ്വാഭാവികമായ കാലസാഹചര്യവാക്യമായി പരിഭാഷപ്പെടുത്തി; λεγόντων എന്ന വർത്തമാനകൃദന്തത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: τοῦ ἱεροῦ
  choice: ദൈവാലയത്തെക്കുറിച്ച്
  rationale: ἱερόν ഇവിടെ അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, ദൈവാലയപരിസരം പൊതുവായി സൂചിപ്പിക്കുന്നു. വായനാസൗകര്യത്തിനായി സാധാരണ പ്രയോഗമായ ‘ദൈവാലയം’ ഉപയോഗിച്ച് വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: λίθοις καλοῖς
  choice: മനോഹരമായ കല്ലുകൾ
  rationale: καλοῖς കല്ലുകളുടെ ദൃശ്യഭംഗിയും ശ്രദ്ധേയമായ ഗുണവും സൂചിപ്പിക്കുന്നു; ‘മനോഹരമായ’ എന്നത് ആ വിലയിരുത്തൽ സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: ἀναθήμασιν
  choice: സമർപ്പിത വഴിപാടുകൾ
  rationale: ദൈവത്തിന് സമർപ്പിച്ച് ദൈവാലയത്തിൽ പ്രദർശിപ്പിച്ചിരുന്ന സമ്മാനങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘സമർപ്പിത വഴിപാടുകൾ’ ആരാധനാസംബന്ധമായ അർഥം നിലനിർത്തുകയും ‘നേർച്ച’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κεκόσμηται
  choice: അലങ്കരിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണകാല കർമണിപ്രയോഗം പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം വ്യക്തമാക്കുന്നു; ഈ മലയാളരൂപം ദൈവാലയം അലങ്കരിക്കപ്പെട്ട നിലയിൽ ഉണ്ടായിരുന്നു എന്ന ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: εἶπεν
  choice: അദ്ദേഹം പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ കർത്താവിന്റെ പേര് ആവർത്തിക്കുന്നില്ല. അതിനാൽ ‘യേശു’ എന്നു കൂട്ടിച്ചേർക്കാതെ സന്ദർഭത്തിലെ പുരുഷകർത്താവിനെ മാന്യവും സ്വാഭാവികവുമായി സൂചിപ്പിച്ചു.
