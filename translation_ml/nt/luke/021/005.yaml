translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മൂലവാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്നതിനാൽ അവസാനത്തിൽ ദ്വിബിന്ദു നിലനിർത്തി. അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടുന്ന സ്ഥാനങ്ങളിലാണ് സൂചകങ്ങൾ നൽകിയിരിക്കുന്നത്.
