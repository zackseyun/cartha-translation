  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: ml
  text: എന്നാൽ ഇവ സംഭവിച്ചുതുടങ്ങുമ്പോൾ[a], നിവർന്നു നിൽക്കുകയും നിങ്ങളുടെ തലകൾ ഉയർത്തുകയും ചെയ്യുക[b]; കാരണം നിങ്ങളുടെ വീണ്ടെടുപ്പ്[c] അടുത്തുവരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഇവ സംഭവിക്കാൻ തുടങ്ങുമ്പോൾ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘മുകളിലേക്കു നോക്കി നിങ്ങളുടെ തലകൾ ഉയർത്തുക.’'
    reason: lexical_alternative
  - marker: c
    text: ‘വീണ്ടെടുപ്പ്’ എന്നത് ‘മോചനം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ സന്ദർഭത്തിൽ അത് സമീപിച്ചുവരുന്ന അന്തിമ മോചനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων δὲ τούτων γίνεσθαι
  choice: എന്നാൽ ഇവ സംഭവിച്ചുതുടങ്ങുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സമയസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; ἀρχομένων എന്ന ‘തുടങ്ങുക’ എന്ന ആശയവും γίνεσθαι എന്ന ‘സംഭവിക്കുക’ എന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. δέ മുൻപറഞ്ഞ ഭീതിയിൽനിന്ന് പ്രോത്സാഹനത്തിലേക്കുള്ള മൃദുവായ വിരോധാത്മക മാറ്റമായി ‘എന്നാൽ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: ἀνακύψατε
  choice: നിവർന്നുനിന്ന്
  rationale: കുനിഞ്ഞ നിലയിൽനിന്ന് ശരീരം നിവർത്തുക എന്ന ദൃശ്യവും ധൈര്യം വീണ്ടെടുക്കുക എന്ന സന്ദർഭസൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു; ഇതിനെ വെറും ‘മുകളിലേക്കു നോക്കുക’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: നിങ്ങളുടെ തലകൾ ഉയർത്തുക
  rationale: മൂലത്തിലെ ബഹുവചന ആജ്ഞയും പ്രത്യാശയുടെയും ആത്മവിശ്വാസത്തിന്റെയും ദൃശ്യരൂപവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: διότι
  choice: കാരണം
  rationale: തുടർന്നുവരുന്ന വാക്യം മുൻപത്തെ ആജ്ഞയ്ക്കുള്ള കാരണം നൽകുന്നതായി വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐγγίζει
  choice: അടുത്തുവരുന്നു
  rationale: വർത്തമാനകാല ക്രിയയിലെ സമീപിച്ചുകൊണ്ടിരിക്കുന്ന ചലനാത്മകത നിലനിർത്തുന്നു; ‘അടുത്താണ്’ എന്ന നിശ്ചല അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἀπολύτρωσις
  choice: വീണ്ടെടുപ്പ്
  rationale: മോചനത്തിന്റെയും രക്ഷയുടെയും ദൈവശാസ്ത്രപരമായ ആഴം നിലനിർത്തുന്ന പ്രചാരമുള്ള മലയാളപദമാണ്; സന്ദർഭത്തെ വെറും താൽക്കാലിക രക്ഷപ്പെടലായി പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: അന്ത്യകാലപ്രഭാഷണത്തിൽ ‘നിങ്ങളുടെ വീണ്ടെടുപ്പ്’ എന്നതിന്റെ അർഥം
  choice: ‘നിങ്ങളുടെ വീണ്ടെടുപ്പ്’ എന്നു തന്നെ നൽകി, യേശുവിന്റെ ശിഷ്യന്മാർക്കു സമീപിച്ചുവരുന്ന അന്തിമ മോചനം/നീതിസ്ഥാപനം എന്ന സന്ദർഭാർഥം നിലനിർത്തി.
  alternative: ഇത് ഉടനെയുള്ള ചരിത്രപ്രതിസന്ധിയിൽനിന്നുള്ള രക്ഷ മാത്രമായി നൽകുക; അല്ലെങ്കിൽ അന്ത്യകാലപരമായ അർഥമില്ലാത്ത പൂർണമായും ആന്തരിക-ആത്മീയ അനുഭവമായി നൽകുക.
  rationale: സമീപസന്ദർഭം ഭാവിയിലേക്കും അന്ത്യകാലസംഭവങ്ങളിലേക്കും ദൃഷ്ടി തിരിക്കുന്നു. അതേസമയം വിവർത്തനം മോചനത്തിന്റെ കൃത്യമായ രീതി വിശദീകരിച്ച് മൂലവാക്യത്തേക്കാൾ അധികം പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിവർന്നുനിന്ന് … തലകൾ ഉയർത്തുക’ എന്ന സമാന്തര പ്രയോഗം മൂലത്തിലെ രണ്ടു ആജ്ഞകളെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
