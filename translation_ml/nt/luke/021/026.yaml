reference: Luke 21:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: ml
  text: ജനവാസമുള്ള ലോകത്തിന്മേൽ[a] വരാനിരിക്കുന്ന സംഭവങ്ങളെക്കുറിച്ചുള്ള ഭയവും പ്രതീക്ഷയും നിമിത്തം ആളുകൾ തളർന്നുപോകും; കാരണം ആകാശങ്ങളിലെ ശക്തികൾ[b] കുലുക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലോകം’ എന്നോ ‘ഭൂമി’ എന്നോ വിവർത്തനം ചെയ്യാം; ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ജനവാസമുള്ള ലോകം.’
    reason: lexical_alternative
  - marker: b
    text: ‘സ്വർഗീയ ശക്തികൾ’ എന്നോ ‘ആകാശത്തിന്റെ ശക്തികൾ’ എന്നോ വിവർത്തനം ചെയ്യാം. ഈ പ്രയോഗം പ്രാപഞ്ചികമോ സ്വർഗീയമോ ആയ ശക്തികളെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: ബോധംകെട്ടുവീഴും
  rationale: ഭയം മൂലം ശക്തി ക്ഷയിച്ച് തളരുകയോ ബോധംകെട്ടുവീഴുകയോ ചെയ്യുന്ന ശാരീരിക-മാനസിക ആഘാതം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνθρώπων
  choice: ആളുകൾ
  rationale: ഗ്രീക്കിൽ പൊതുവായി മനുഷ്യരെയാണു സൂചിപ്പിക്കുന്നത്; പുരുഷന്മാരിൽ മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἀπὸ φόβου καὶ προσδοκίας
  choice: ഭയവും പ്രതീക്ഷയും നിമിത്തം
  rationale: ἀπό ഇവിടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു. προσδοκία എന്നതിന്റെ ‘പ്രതീക്ഷ/കാത്തിരിപ്പ്’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; അതിന്റെ ഭീതിജനക സ്വഭാവം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: τῶν ἐπερχομένων
  choice: വരാനിരിക്കുന്ന കാര്യങ്ങളെക്കുറിച്ചുള്ള
  rationale: നപുംസകലിംഗ ബഹുവചന substantival participle വരാനിരിക്കുന്ന സംഭവങ്ങളെയോ കാര്യങ്ങളെയോ സൂചിപ്പിക്കുന്നു; അതിന്റെ ബഹുവചന-സംഭവാർഥം നിലനിർത്തുന്നു.
- source_word: τῇ οἰκουμένῃ
  choice: ജനവാസമുള്ള ലോകത്തിന്മേൽ
  rationale: οἰκουμένη വെറും ഭൗതിക ഭൂമിയെക്കാൾ മനുഷ്യർ അധിവസിക്കുന്ന ലോകത്തെ സൂചിപ്പിക്കാം; ആ പ്രത്യേകത പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: ആകാശങ്ങളിലെ ശക്തികൾ
  rationale: ജ്യോതിർഗോളങ്ങൾ, പ്രാപഞ്ചിക ശക്തികൾ, സ്വർഗീയ ശക്തികൾ എന്നിവയിൽ ഒന്നായി അർഥം ചുരുക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: σαλευθήσονται
  choice: ഇളക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗത്തെയും പ്രാപഞ്ചിക കലക്കത്തിന്റെ ദൃശ്യത്തെയും അടുത്തായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: അപ്പോക്കലിപ്റ്റിക് സന്ദർഭത്തിലെ ‘ആകാശങ്ങളിലെ ശക്തികൾ’ എന്നതിന്റെ അർഥം
  choice: വ്യക്തമായി നിർവചിക്കാത്ത പ്രാപഞ്ചിക/സ്വർഗീയ പ്രയോഗമായി നിലനിർത്തി.
  alternative: ‘ആകാശഗോളങ്ങൾ’ എന്നോ ‘ദൂതശക്തികൾ’ എന്നോ മാത്രം വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പ്രയോഗം പ്രാപഞ്ചിക ഘടനകളെയോ ആകാശജ്യോതിസ്സുകളെയോ സ്വർഗീയ ശക്തികളെയോ അനുസ്മരിപ്പിക്കാം. വിവർത്തനം ഈ ദൈവശാസ്ത്രപരമായ തുറന്ന നില ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രതീക്ഷ’ സാധാരണയായി അനുകൂല ഭാവവും വഹിക്കാമെങ്കിലും ഇവിടെ ‘ഭയം’ എന്ന സമാന്തരപദവും അപ്പോക്കലിപ്റ്റിക് സന്ദർഭവും അതിനെ ആശങ്കയോടെയുള്ള കാത്തിരിപ്പായി വ്യക്തമാക്കുന്നു. വാക്യത്തിന്റെ കാരണബന്ധവും ഭാവികാലവും സംരക്ഷിച്ചിട്ടുണ്ട്.
