source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: എല്ലാം സംഭവിക്കുന്നതുവരെ ഈ തലമുറ[a] ഒരിക്കലും കടന്നുപോകുകയില്ല.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ ജനത’ എന്നോ ‘ഈ യുഗം’ എന്നോ മനസ്സിലാക്കാനും സാധ്യതയുണ്ട്; ഗ്രീക്ക് പദത്തിന് ഒന്നിലധികം അർഥസാധ്യതകളുണ്ടെങ്കിലും ‘ഈ തലമുറ’ എന്നതാണ് ഏറ്റവും നേരിട്ടുള്ള പരിഭാഷ.
    reason: alternative_reading
  - marker: b
    text: ‘എല്ലാം സംഭവിക്കുന്നതുവരെ’ എന്നതിന് ‘ഇവയെല്ലാം സംഭവിക്കുന്നതുവരെ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്; എന്നാൽ ഗ്രീക്കിൽ ഇവിടെ ‘ഇവ’ എന്ന പദമില്ല. ‘സംഭവിക്കുക’ എന്നതിന് ‘നടക്കുക’ അല്ലെങ്കിൽ ‘നിവൃത്തിയാകുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: ഗൗരവപൂർവവും ആധികാരികവുമായ ഉറപ്പ് അവതരിപ്പിക്കുന്ന പ്രയോഗം; ലിപ്യന്തരണത്തേക്കാൾ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള പ്രസ്താവനാരീതി സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐ μὴ παρέλθῃ
  choice: ഒരിക്കലും കടന്നുപോകുകയില്ല
  rationale: οὐ μήയും aorist subjunctive-ഉം ചേർന്ന ശക്തമായ നിഷേധം വ്യക്തമായി പകരുന്നു.
- source_word: ἡ γενεὰ αὕτη
  choice: ഈ തലമുറ
  rationale: γενεάയുടെ ഏറ്റവും നേരിട്ടുള്ള അർഥം ‘തലമുറ’ ആണ്; വ്യാഖ്യാനവിവാദം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἕως ἂν
  choice: സംഭവിക്കുന്നതുവരെ
  rationale: മുൻപ്രസ്താവനയുടെ കാലപരിധി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: πάντα
  choice: എല്ലാം
  rationale: ഗ്രീക്കിൽ ‘ഇവയെല്ലാം’ എന്ന സൂചകപദമില്ല; അതിനാൽ πάνταയുടെ തുറന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: γένηται
  choice: സംഭവിക്കുക
  rationale: ഇവിടെ γίνομαι സംഭവിക്കൽ/നടക്കൽ സൂചിപ്പിക്കുന്നു; ‘നിവൃത്തിയാകുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: അന്ത്യകാലപ്രസ്താവനയിലെ ‘ഈ തലമുറ’ എന്നതിന്റെ സൂചന
  choice: മുഖ്യപാഠത്തിൽ ‘ഈ തലമുറ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി അതിന്റെ സൂചന നിർണയിക്കാതിരിക്കുക.
  alternative: ‘ഈ ജനത’, ‘ഈ യുഗം’, അല്ലെങ്കിൽ അടയാളങ്ങൾ കാണുന്ന തലമുറ എന്ന വ്യാഖ്യാനം.
  rationale: വാക്കിന്റെ അടിസ്ഥാന അർഥം വ്യക്തമായിരിക്കുമ്പോഴും അത് ആരെയോ എന്തിനെയോ സൂചിപ്പിക്കുന്നു എന്നത് വിവാദവിധേയമാണ്; പാഠം ആ വ്യാഖ്യാനസംഘർഷം തീർപ്പാക്കരുത്.
- issue: πάντα എന്നതിൽ സൂചകപദം ചേർക്കണോ
  choice: ‘എല്ലാം’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  alternative: സന്ദർഭത്തെ അടിസ്ഥാനമാക്കി ‘ഇവയെല്ലാം’ എന്നു നൽകുക.
  rationale: സന്ദർഭം മുമ്പ് പറഞ്ഞ കാര്യങ്ങളിലേക്കു വിരൽചൂണ്ടാമെങ്കിലും ഗ്രീക്ക് വാക്യത്തിൽ ‘ഇവ’ എന്ന പദം ഇല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ശക്തമായ നിഷേധത്തിന് ‘ഒരിക്കലും ... ഇല്ല’ ഉപയോഗിച്ചു. മുഖ്യപാഠം സംക്ഷിപ്തമാക്കാൻ ബന്ധപ്പെട്ട ലെക്സിക്കൽ സാധ്യതകൾ ഒരേ അടിക്കുറിപ്പിൽ ചേർത്തു.
