id: LUK.21.21
reference: Luke 21:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: ml
  text: അപ്പോൾ യെഹൂദ്യയിലുള്ളവർ മലകളിലേക്ക് ഓടിപ്പോകട്ടെ; അതിന്റെ നടുവിലുള്ളവർ അതു വിട്ടുപോകട്ടെ; നാട്ടിൻപുറങ്ങളിലുള്ളവർ അതിലേക്ക് കടക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അതിന്റെ,” “അതു,” “അതിലേക്ക്” എന്നീ പ്രയോഗങ്ങൾ ഈ സന്ദർഭത്തിൽ യെരൂശലേമിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ യെരൂശലേം ഒരു നഗരമായി സ്ത്രീലിംഗ സർവനാമങ്ങളാൽ സൂചിപ്പിക്കപ്പെട്ടിരിക്കുന്നു.
    reason: referent_ambiguity
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ അടയാളത്തെത്തുടർന്നുള്ള സമയക്രമം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: യെഹൂദ്യയിലുള്ളവർ
  rationale: യെഹൂദ്യയിൽ സ്ഥിതിചെയ്യുന്ന ആളുകളെയാണ് ഈ നാമവത്കൃത പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്.
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: മലകളിലേക്ക് ഓടിപ്പോകട്ടെ
  rationale: മൂന്നാംപുരുഷ ആജ്ഞയുടെ അടിയന്തരതയും മലകളിലേക്കുള്ള ദിശയും നിലനിർത്തുന്നു.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: അതിന്റെ നടുവിലുള്ളവർ
  rationale: αὐτῆς എന്ന സർവനാമത്തെ വ്യക്തമായ ഒരു നാമം ചേർത്ത് പരിഹരിക്കാതെ നിലനിർത്തുന്നു; മലയാളത്തിൽ വ്യാകരണലിംഗം പ്രകടമാകാത്തതിനാൽ സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐκχωρείτωσαν
  choice: അതു വിട്ടുപോകട്ടെ
  rationale: ഒരു സ്ഥലത്തുനിന്ന് പിന്മാറുകയോ പുറത്തുപോകുകയോ ചെയ്യുക എന്ന അർഥവും ആജ്ഞാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἱ ἐν ταῖς χώραις
  choice: നാട്ടിൻപുറങ്ങളിലുള്ളവർ
  rationale: നഗരത്തിനു പുറത്തുള്ള ഗ്രാമീണ പ്രദേശങ്ങളിലുള്ളവരെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും ആധുനികവുമായ പ്രയോഗം.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: അതിലേക്ക് കടക്കരുത്
  rationale: പ്രവേശനം വിലക്കുന്ന നിഷേധാത്മക ആജ്ഞയുടെ ശക്തി നിലനിർത്തുകയും αὐτήν എന്ന സർവനാമം തുറന്ന നിലയിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: αὐτῆς / αὐτήν എന്നീ സർവനാമങ്ങളുടെ സൂചിതസ്ഥലം
  choice: പ്രധാനപാഠത്തിൽ “അതിന്റെ / അതു / അതിലേക്ക്” എന്ന സർവനാമരൂപങ്ങൾ നിലനിർത്തി, യെരൂശലേം എന്ന സാധാരണ സന്ദർഭവായന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: പ്രധാനപാഠത്തിൽ നേരിട്ട് “യെരൂശലേമിന്റെ / യെരൂശലേമിലേക്ക്” എന്നു നൽകുക.
  rationale: മുൻസന്ദർഭം യെരൂശലേമിലേക്കാണ് ശക്തമായി വിരൽചൂണ്ടുന്നത്; എങ്കിലും ഈ വാക്യത്തിൽ ആ നാമം ആവർത്തിക്കുന്നില്ല, കൂടാതെ ഗ്രീക്ക് സർവനാമരൂപം സമീപത്തെ യെഹൂദ്യ എന്ന സ്ത്രീലിംഗ നാമത്തോടും വ്യാകരണപരമായി പൊരുത്തപ്പെടുന്നു. അതിനാൽ മൂലപാഠത്തിന്റെ സൂചനാത്മകത പ്രധാനപാഠത്തിൽ നിലനിർത്തി സന്ദർഭവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സമാന്തരമായ മൂന്ന് ആജ്ഞകളും വ്യക്തമായി നിലനിർത്തി; അനാവശ്യമായി “നഗരം” അല്ലെങ്കിൽ “യെരൂശലേം” എന്ന നാമം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
