source:
  edition: SBLGNT
  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: ml
  text: എന്തെന്നാൽ, എഴുതപ്പെട്ടിരിക്കുന്നതെല്ലാം നിവൃത്തിയാകേണ്ടതിന് ഇവ പ്രതികാരത്തിന്റെ നാളുകളാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രതിഫലശിക്ഷയുടെ നാളുകൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന്റെ കാരണം അഥവാ വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി സ്വാഭാവികമായ മലയാളം.
- source_word: ἡμέραι
  choice: നാളുകൾ
  rationale: ബഹുവചനരൂപം നിലനിർത്തുന്നു; ‘കാലം’ എന്ന പൊതുവത്കരണം ഒഴിവാക്കുന്നു.
- source_word: ἐκδικήσεως
  choice: പ്രതികാരത്തിന്റെ
  rationale: ദൈവികമായ ന്യായവിധിയുടെയും പ്രതിഫലശിക്ഷയുടെയും കഠിനത നിലനിർത്തുന്ന നേരിട്ടുള്ള പദം; വെറും മനുഷ്യവൈരാഗ്യം എന്ന അർഥത്തിൽ പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: αὗταί εἰσιν
  choice: ഇവ ... നാളുകളാണ്
  rationale: ചൂണ്ടുപദത്തിന്റെ ഊന്നലും ലളിതമായ വിധേയവാക്യഘടനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ πλησθῆναι
  choice: നിവൃത്തിയാകേണ്ടതിന്
  rationale: τοῦ സഹിതമുള്ള അനന്തക്രിയയുടെ ഉദ്ദേശ്യ/ഫല ഭാവം പൂർണമായി ഒന്നിലേക്കു ചുരുക്കാതെ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: πάντα τὰ γεγραμμένα
  choice: എഴുതപ്പെട്ടിരിക്കുന്നതെല്ലാം
  rationale: പൂർണതാസൂചകമായ πάνταയും substantival perfect passive participle-ഉം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘തിരുവെഴുത്തുകൾ’ എന്ന് വ്യക്തമായി ചേർത്ത് മൂലത്തിലെ വിശാലമായ സൂചന ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ἐκδικήσεως എന്നതിന്റെ ന്യായവിധിസ്വഭാവം
  choice: പ്രതികാരത്തിന്റെ നാളുകൾ
  alternative: നീതിപൂർവമായ ശിക്ഷയുടെ നാളുകൾ
  rationale: മൂലപദത്തിലെ ശിക്ഷാത്മകവും ന്യായവിധിപരവുമായ ശക്തി നിലനിർത്തുന്നു; തുടർന്നുള്ള എഴുത്തുകളുടെ നിവൃത്തിയെന്ന പരാമർശം ഇതിനെ ദൈവിക ന്യായവിധിയുടെ ചട്ടക്കൂടിൽ നിർത്തുന്നു.
- issue: τοῦ + infinitive നിർമാണത്തിന്റെ ഉദ്ദേശ്യ/ഫല ഭാവം
  choice: നിവൃത്തിയാകേണ്ടതിന്
  alternative: നിവൃത്തിയാകുന്നതിനുള്ള
  rationale: ഉദ്ദേശ്യവും ഫലവും തമ്മിലുള്ള മൂലത്തിലെ അർഥവ്യാപ്തി പൂർണമായി തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിവൃത്തിയാകുക’ എന്ന തിരുവെഴുത്തുസംബന്ധിയായ പ്രയോഗം സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി; മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേക സഭാപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
