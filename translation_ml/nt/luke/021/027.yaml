source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: ml
  text: അപ്പോൾ അവർ മനുഷ്യപുത്രനെ ശക്തിയോടും വലിയ മഹത്ത്വത്തോടും കൂടെ ഒരു മേഘത്തിൽ വരുന്നതായി കാണും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു മേഘത്തിന്മേൽ.’ ഗ്രീക്കിൽ ഏകവചനമായി ‘ഒരു മേഘത്തിൽ’ എന്നാണ്. എന്നാൽ ഈ പ്രതിച്ഛായ ദാനിയേൽ 7-ലെയും അനുബന്ധ ഭാഗങ്ങളിലെയും മനുഷ്യപുത്രൻ മേഘങ്ങളോടുകൂടെ വരുന്ന ചിത്രത്തെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: അവർ കാണും
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭാവികാലരൂപം ഇവിടെ നേരിട്ടുള്ള ദൃശ്യാനുഭവത്തെ സൂചിപ്പിക്കുന്നു. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അവർ കാണും’ എന്നു വ്യക്തമായി വരുന്നു.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്ഥിരപ്രയോഗത്തിലുള്ള ഈ പദവി ദാനിയേൽ 7-ലെ പ്രതിധ്വനിയും ക്രിസ്തുശാസ്ത്രപരമായ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐρχόμενον
  choice: വരുന്നത്
  rationale: വർത്തമാനകാല കൃദന്തരൂപം കാണപ്പെടുന്ന പ്രവൃത്തിയെ പുരോഗമിക്കുന്നതായി അവതരിപ്പിക്കുന്നു. മലയാളവാക്യഘടനയിൽ ‘വരുന്നത് അവർ കാണും’ എന്നത് ഈ ബന്ധം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐν νεφέλῃ
  choice: ഒരു മേഘത്തിൽ
  rationale: ഗ്രീക്കിൽ νεφέλῃ ഏകവചനവും ἐν സഹിതമുള്ള ദത്തിവിഭക്തിയുമാണ്. അതിനാൽ ബഹുവചനമായ ‘മേഘങ്ങളിൽ’ എന്നതിലേക്ക് ഒത്തുചേർക്കാതെ ‘ഒരു മേഘത്തിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: μετὰ δυνάμεως
  choice: ശക്തിയോടുംകൂടെ
  rationale: μετάയും ഷഷ്ഠിവിഭക്തിയും ഇവിടെ കൂടെയുണ്ടാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; δύναμις എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ തർജമ ‘ശക്തി’ ആണ്.
- source_word: δόξης πολλῆς
  choice: മഹത്തായ മഹത്ത്വം
  rationale: πολλῆς എന്നത് δόξηςനെ വിശേഷിപ്പിക്കുന്നു. ‘മഹത്തായ മഹത്ത്വം’ എന്ന പ്രയോഗം അളവിന്റെയും ഔന്നത്യത്തിന്റെയും ഭാവം സ്വാഭാവികവും ഗൗരവപൂർണവുമായി നൽകുന്നു.
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπου എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിയുടെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: അംഗീകൃതമായ പദവിയും ദാനിയേൽ 7-ലേക്കുള്ള സാഹിത്യ-ദൈവശാസ്ത്ര പ്രതിധ്വനിയും നിലനിർത്താൻ ‘മനുഷ്യപുത്രൻ’ സ്വീകരിച്ചു; വ്യാഖ്യാനപരമായി ചുരുക്കിയില്ല.
- issue: മേഘത്തിന്റെ ദാനിയേൽപരവും ദൈവപ്രത്യക്ഷതാപരവുമായ പ്രതീകം
  choice: ഒരു മേഘത്തിൽ
  alternative: ഒരു മേഘത്തിന്മേൽ
  rationale: ലൂക്കോസിന്റെ ഏകവചനപ്രയോഗവും ἐν എന്ന ഉപസർഗത്തിന്റെ സാധാരണ അർഥവും മുൻനിർത്തി ‘ഒരു മേഘത്തിൽ’ സ്വീകരിച്ചു. ‘മേഘത്തിന്മേൽ’ എന്ന സാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് ഗ്രീക്കിലെ യഥാർഥ സൂക്ഷ്മത തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവപൂർണവുമായ ശൈലി സ്വീകരിച്ചു. ‘മനുഷ്യപുത്രൻ’ എന്ന സ്ഥാപിത ബൈബിൾപദം നിലനിർത്തി; ഗ്രീക്കിലെ ഏകവചനമായ മേഘപ്രയോഗം മുഖ്യവാചകത്തിലും പരിഭാഷാസാദ്ധ്യത അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
