- from: അപ്പോൾ മനുഷ്യപുത്രൻ ശക്തിയോടും മഹത്തായ മഹത്ത്വത്തോടുംകൂടെ ഒരു മേഘത്തിൽ വരുന്നത് അവർ കാണും.[a]
  to: അപ്പോൾ അവർ മനുഷ്യപുത്രനെ ശക്തിയോടും വലിയ മഹത്ത്വത്തോടും കൂടെ ഒരു മേഘത്തിൽ വരുന്നതായി കാണും.[a]
  rationale: The revision is limited to idiomatic Malayalam wording and clause order. It retains the Greek singular cloud, the future visual perception, the present-participial sense of coming, and the accompaniment of power and great glory. The footnote continues to identify ‘on a cloud’ as an alternative and carefully notes, rather than imports, the Danielic resonance.
