  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: ml
  text: 'അവർ അവനോടു ചോദിച്ചു: “ഗുരുവേ, അപ്പോൾ ഇവ എപ്പോൾ സംഭവിക്കും? ഇവ സംഭവിക്കാനിരിക്കുമ്പോൾ അതിന്റെ അടയാളം എന്തായിരിക്കും?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇവ സംഭവിക്കാൻ പോകുമ്പോൾ അതിന്റെ അടയാളം എന്തായിരിക്കും?” μέλλῃ എന്ന ഗ്രീക്ക് ക്രിയയെ ‘സംഭവിക്കാനിരിക്കുന്നു’ എന്നതിനേക്കാൾ പൊതുവായി ‘സംഭവിക്കാൻ പോകുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: അവർ അവനോടു ചോദിച്ചു
  rationale: ആഓറിസ്റ്റ് സൂചകക്രിയ ഭൂതകാലത്തിലെ ലളിതമായ ചോദിക്കൽ പ്രവൃത്തിയെ വിവരിക്കുന്നു; മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തില്ല
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിലെ വാക്യക്രമവും സന്ദർഭബന്ധവും ആ മുന്നേറ്റം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്ന വിരുദ്ധഭാവം അനാവശ്യമാണ്.
- source_word: λέγοντες
  choice: പ്രത്യേകമായി ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർത്തില്ല
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ചോദ്യം ‘ചോദിച്ചു:’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കപ്പെടുന്നു; ഗ്രീക്ക് പങ്കാളിക്രിയയുടെ പ്രവർത്തനം മലയാളത്തിൽ ഈ വിരാമചിഹ്നഘടന നിറവേറ്റുന്നു.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: διδάσκαλος പഠിപ്പിക്കുന്നവനെ സൂചിപ്പിക്കുന്നു. ‘ഗുരുവേ’ ആ കാലത്തെ അഭിസംബോധനാഭാവം നിലനിർത്തുന്ന, സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായ പദമാണ്; ‘യജമാനനേ’ പോലുള്ള ശക്തമായ അധികാരസൂചന ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: πότε οὖν
  choice: അപ്പോൾ ... എപ്പോൾ
  rationale: πότε സമയത്തെക്കുറിച്ചുള്ള ചോദ്യം നൽകുന്നു; οὖν മുൻവാക്കിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നു. ‘അപ്പോൾ’ ഈ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ταῦτα ἔσται
  choice: ഇവ ... സംഭവിക്കും
  rationale: εἰμίയുടെ ഭാവികാലരൂപവും നപുംസക ബഹുവചനസർവനാമവും ചേർന്നുള്ള പ്രയോഗം സംഭവിക്കലിനെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘ഇവ ആയിരിക്കും’ എന്നതിനെക്കാൾ ‘ഇവ സംഭവിക്കും’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: σημεῖον
  choice: അടയാളം
  rationale: ഒരു നിർണായക സംഭവത്തെ സൂചിപ്പിക്കുന്ന ചിഹ്നം എന്ന σημεῖονന്റെ അർഥം ‘അടയാളം’ വ്യക്തമായി നൽകുന്നു.
- source_word: ὅταν
  choice: -ുമ്പോൾ
  rationale: സബ്ജങ്ക്റ്റീവിനോടുകൂടിയ ഭാവികാലസൂചക സമയബന്ധം മലയാളത്തിലെ ‘സംഭവിക്കാനിരിക്കുമ്പോൾ’ എന്ന ഘടന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μέλλῃ
  choice: സംഭവിക്കാനിരിക്കുമ്പോൾ
  rationale: μέλλω നൽകുന്ന ആസന്നതയുടെയോ വരാനിരിക്കുന്ന സംഭവത്തിന്റെയോ സൂചന ‘-ാനിരിക്കുമ്പോൾ’ നിലനിർത്തുന്നു; അതിനെ വെറും ഭാവികാലമായി ചുരുക്കുന്നില്ല.
- source_word: γίνεσθαι
  choice: സംഭവിക്കുക
  rationale: ഈ സന്ദർഭത്തിൽ γίνομαι സംഭവങ്ങൾ നടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സംഭവിക്കുക’ ആധുനിക മാനക മലയാളത്തിലെ വ്യക്തമായ തുല്യപദമാണ്.
theological_decisions:
- issue: അന്ത്യകാലസംബന്ധമായ സമയസൂചനയും μέλλῃയുടെ അർഥവ്യാപ്തിയും
  choice: ‘സംഭവിക്കാനിരിക്കുമ്പോൾ’ എന്നു നൽകി വരാനിരിക്കുന്നതും ഒരു പരിധിവരെ ആസന്നവുമായ സംഭവത്തിന്റെ സൂചന നിലനിർത്തി.
  alternative: ‘സംഭവിക്കുമ്പോൾ’ അല്ലെങ്കിൽ ‘സംഭവിക്കാൻ പോകുമ്പോൾ’
  rationale: μέλλῃയെ വെറും ഭാവികാലമായി ദുർബലപ്പെടുത്താതെയും സംഭവങ്ങൾ എത്ര അടുത്തതോ ദൂരെയോ ആണെന്ന് തീരുമാനിച്ചുപറയാതെയും ഗ്രീക്കിലെ കാലസംബന്ധമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: രണ്ടാം ταῦταയുടെ ഏകവചനസംബന്ധം
  choice: ‘അതിന്റെ അടയാളം’ എന്നു നൽകി മുമ്പ് പറഞ്ഞ സംഭവസമുച്ചയത്തെ ഏകകമായി സൂചിപ്പിച്ചു.
  alternative: ‘ഇവയുടെ അടയാളം’
  rationale: ഗ്രീക്കിലെ τί τὸ σημεῖον എന്ന ഏകവചനപ്രയോഗവും ταῦτα എന്ന ബഹുവചന സംഭവസൂചനയും ഒരുമിച്ച് നിലനിൽക്കുന്നു. മലയാളത്തിലെ ‘അതിന്റെ’ സംഭവസമുച്ചയത്തെ മൊത്തമായി കാണാൻ അനുവദിക്കുന്നു; ‘ഇവയുടെ’ എന്ന രൂപവും സാധുവായ മറ്റൊരു വായനയാണ്.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള ചോദ്യം. ഗ്രീക്ക് വാക്യഘടന യാന്ത്രികമായി പകർത്താതെ അർഥവും സമയസൂചനയും നിലനിർത്തി. ‘ഗുരുവേ’ സഭാപരമായ പ്രത്യേക സാങ്കേതികത ഒഴിവാക്കി സാധാരണ അഭിസംബോധനയായി ഉപയോഗിച്ചു.
