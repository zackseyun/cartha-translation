id: LUK.21.30
reference: Luke 21:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν προβάλωσιν ἤδη, βλέποντες ἀφ’ ἑαυτῶν γινώσκετε ὅτι ἤδη ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/030.yaml
  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: ml
  text: അവയിൽ ഇലകൾ ഇതിനകം തളിർക്കുമ്പോൾ[a], നിങ്ങൾതന്നെ അവ കണ്ടു വേനൽ ഇതിനകം അടുത്തിരിക്കുന്നു എന്നു മനസ്സിലാക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “അവ വളർച്ച പുറപ്പെടുവിക്കുമ്പോൾ.” ഗ്രീക്കിൽ “ഇലകൾ” എന്നു വ്യക്തമാക്കിയിട്ടില്ല; എന്നാൽ മരങ്ങളെക്കുറിച്ചുള്ള സന്ദർഭം അതു സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: -കഴിഞ്ഞാൽ
  rationale: സോപാധികമായ കാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഇവിടെ ആവർത്തനത്തെ ഊന്നുന്ന ‘എപ്പോഴെല്ലാം’ ആവശ്യമില്ല.
- source_word: προβάλωσιν
  choice: ഇലകൾ തളിർത്തു
  rationale: മരങ്ങളെക്കുറിച്ചുള്ള മുൻവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ പുതിയ വളർച്ച പുറപ്പെടുന്നതാണ് അർഥം. ഗ്രീക്കിൽ ‘ഇലകൾ’ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക സസ്യപ്രയോഗത്തിനായി അത് പാഠത്തിൽ ചേർത്ത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἤδη
  choice: -കഴിഞ്ഞാൽ / ഇതിനകം
  rationale: വാക്യത്തിലെ രണ്ടു പ്രയോഗങ്ങളുടെയും സമയസൂചന നിലനിർത്തുന്നു. ആദ്യത്തേത് മലയാളത്തിലെ പൂർത്തിക്രിയാരൂപത്തിലൂടെയും രണ്ടാമത്തേത് ‘ഇതിനകം’ എന്ന ക്രിയാവിശേഷണത്തിലൂടെയും നൽകുന്നു.
- source_word: βλέποντες
  choice: അതു കണ്ടുതന്നെ
  rationale: കാണുന്നതിലൂടെ തിരിച്ചറിയുന്നു എന്ന പങ്കാളിക്രിയയുടെ സാഹചര്യപരവും ഉപാധിസൂചകവുമായ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἀφ’ ἑαυτῶν
  choice: നിങ്ങൾ സ്വയം
  rationale: മറ്റൊരാളുടെ വിശദീകരണമില്ലാതെ സ്വന്തം നിരീക്ഷണത്തിൽനിന്ന് അറിയുന്നു എന്ന ആശയം നൽകുന്നു.
- source_word: γινώσκετε
  choice: അറിയുന്നു
  rationale: നിരീക്ഷണത്തിൽനിന്നുണ്ടാകുന്ന സാധാരണ തിരിച്ചറിവിനെ ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐγγὺς
  choice: അടുത്തിരിക്കുന്നു
  rationale: കാലപരമായ സാമീപ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: θέρος
  choice: വേനൽ
  rationale: വേനൽക്കാലം എന്ന ഋതുവിനെ സാധാരണവും വ്യക്തവുമായ പദത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ടു ἤδη-പ്രയോഗങ്ങളുടെയും സമയസൂചന സംരക്ഷിച്ചിരിക്കുന്നു; സസ്യസന്ദർഭം വ്യക്തമാക്കാൻ പാഠത്തിൽ ‘ഇലകൾ’ ചേർത്തതിനെ അടിക്കുറിപ്പിലൂടെ സുതാര്യമാക്കിയിരിക്കുന്നു.
