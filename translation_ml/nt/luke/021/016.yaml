source:
  edition: SBLGNT
  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ മാതാപിതാക്കളും സഹോദരന്മാരും ബന്ധുക്കളും സുഹൃത്തുക്കളും വരെ നിങ്ങളെ ഏല്പിച്ചുകൊടുക്കും[a]; അവർ നിങ്ങളിൽ ചിലരെ കൊല്ലും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരന്മാരും സഹോദരിമാരും” / “സഹോദരങ്ങൾ”; ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം ചിലപ്പോൾ സഹോദരന്മാരും സഹോദരിമാരും ഉൾപ്പെട്ട ഒരു സംഘത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: നിങ്ങളെ ഏല്പിച്ചുകൊടുക്കും
  rationale: παραδίδωμι എന്ന ക്രിയയുടെ ഭാവികാല കർമണിപ്രയോഗം. ശത്രുതയുള്ള അധികാരികളുടെയോ എതിരാളികളുടെയോ കയ്യിൽ ഒരാളെ ഏല്പിക്കുന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; അടുത്ത ബന്ധുക്കൾ കർത്താക്കളായതിനാൽ വഞ്ചനയുടെ ഭാവം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ഉറപ്പിൽനിന്നുള്ള നേരിയ വൈരുധ്യാത്മക തിരിവ് സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: καὶ
  choice: പോലും
  rationale: പുറത്തുള്ളവർ മാത്രമല്ല, ഏറ്റവും അടുത്തവരും ഏല്പിച്ചുകൊടുക്കുമെന്ന ആരോഹണാത്മക ഊന്നൽ പ്രകടമാക്കുന്നു.
- source_word: ὑπὸ
  choice: -ഉം ... -ഉം (കർത്തൃസൂചന)
  rationale: കർമണിപ്രയോഗത്തിൽ ὑπό വ്യക്തിപരമായ കർത്താവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി കർത്തൃപ്രയോഗത്തിലേക്ക് മാറ്റിയിരിക്കുന്നു.
- source_word: γονέων
  choice: മാതാപിതാക്കൾ
  rationale: അച്ഛനെയും അമ്മയെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവികവും കൃത്യവുമായ കൂട്ടപ്പദം.
- source_word: ἀδελφῶν
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ അതേ ലിംഗസൂചനയോടെ നൽകിയിരിക്കുന്നു; സഹോദരിമാരെയും ഉൾക്കൊള്ളാവുന്ന വിശാലസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: συγγενῶν
  choice: ബന്ധുക്കൾ
  rationale: കുടുംബത്തിലോ ബന്ധുവൃന്ദത്തിലോ പെട്ടവരെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തവും വിശാലവുമായ പദം.
- source_word: φίλων
  choice: സുഹൃത്തുക്കൾ
  rationale: φίλων എന്ന ബഹുവചനത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
- source_word: θανατώσουσιν
  choice: കൊന്നുകളയും
  rationale: മരണത്തിനിടയാക്കുക എന്ന θανατόωയുടെ അർഥം വ്യക്തമായി നൽകുന്നു. വധശിക്ഷ എന്ന നിയമപരമായ അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ചിലരെ
  rationale: അക്ഷരാർഥമായ ‘നിങ്ങളിൽനിന്ന്’ എന്നതിനു പകരം ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം നൽകുന്നു.
theological_decisions:
- issue: ബന്ധുപട്ടികയിലെ ἀδελφῶν എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ / സഹോദരങ്ങൾ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തി. എന്നാൽ ബന്ധുപട്ടികയിൽ ഈ പദം സഹോദരിമാരെയും ഉൾക്കൊള്ളുന്ന മിശ്രസംഘത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ കർമണിവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തൃവാക്യമായി പുനഃക്രമീകരിച്ചെങ്കിലും ഏല്പിച്ചുകൊടുക്കപ്പെടുന്ന ആശയം നിലനിർത്തിയിരിക്കുന്നു. ‘പോലും’ അടുത്ത ബന്ധുക്കളുടെ പങ്കിനെക്കുറിച്ചുള്ള ഊന്നൽ നൽകുന്നു.
