reference: Luke 21:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: ml
  text: സൂര്യനിലും ചന്ദ്രനിലും നക്ഷത്രങ്ങളിലും അടയാളങ്ങൾ ഉണ്ടാകും; ഭൂമിയിൽ ജനതകൾക്കു, കടലിന്റെ ഇരമ്പലും പ്രക്ഷുബ്ധതയും നിമിത്തം, എന്തുചെയ്യണമെന്നറിയാതെ ദുരിതമുണ്ടാകും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘കടലിന്റെ ശബ്ദത്തിലും പ്രക്ഷുബ്ധതയിലും.’
    reason: ἤχους, σάλου എന്നീ പദങ്ങളുടെ കൂടുതൽ രൂപാനുസൃതമായ പരിഭാഷ നൽകുന്നു; മുഖ്യപാഠത്തിലെ ‘ഇരമ്പൽ’ കടൽസന്ദർഭത്തിലെ ശബ്ദത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: σημεῖα
  choice: അടയാളങ്ങൾ
  rationale: അസാധാരണ പ്രതിഭാസങ്ങളെ സൂചിപ്പിക്കുന്ന വിശാലവും പതിവുമായ പദം; ദുശ്ശകുനങ്ങൾ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: സൂര്യനിലും ചന്ദ്രനിലും നക്ഷത്രങ്ങളിലും
  rationale: ഗ്രീക്കിലെ ἐν സഹിതമുള്ള സമാന്തര ദത്തിവ്യാകരണഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: συνοχὴ ἐθνῶν
  choice: ജനതകൾ ... ദുരിതത്തിലാകും
  rationale: സമ്മർദപൂർണമായ കഷ്ടാവസ്ഥ എന്ന συνοχήയുടെ ആശയം വ്യക്തമാക്കുന്നു; ἐθνῶν ഇവിടെ യഹൂദേതരർ എന്ന പ്രത്യേക അർഥത്തിലല്ല, ലോകത്തിലെ ജനതകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν ἀπορίᾳ
  choice: എന്തുചെയ്യണമെന്നറിയാതെ
  rationale: പോംവഴിയില്ലാതെ കുഴങ്ങുന്ന ἀπορίαയുടെ ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἤχους θαλάσσης
  choice: കടലിന്റെ ഇരമ്പൽ
  rationale: ἦχος എന്ന ശബ്ദത്തെ കടൽസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘ഇരമ്പൽ’ എന്നു നൽകുന്നു.
- source_word: σάλου
  choice: തിരമാലകളുടെ പ്രക്ഷുബ്ധത
  rationale: കടലിന്റെ ഇളക്കത്തെയും ശക്തമായ ഉലയലിനെയും സൂചിപ്പിക്കുന്ന σάλος മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; തിരമാലകൾ എന്നത് സന്ദർഭത്തിൽ അന്തർലീനമായ ആശയത്തിന്റെ മിതമായ വ്യക്തീകരണമാണ്.
theological_decisions:
- issue: ആകാശീയ പ്രതിഭാസങ്ങളുടെ സ്വഭാവം
  choice: അവയെ വിശദീകരിക്കാതെ ആകാശഗോളങ്ങളിലെ അടയാളങ്ങളായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: അക്ഷരാർഥത്തിലുള്ള ജ്യോതിശാസ്ത്രകലക്കങ്ങൾ എന്നോ മുഖ്യമായും പ്രതീകാത്മക-രാഷ്ട്രീയ ചിത്രണം എന്നോ വ്യക്തമാക്കുക.
  rationale: വാക്യം അക്ഷരാർഥമോ പ്രതീകാത്മകമോ രണ്ടുമോ എന്നു തീർപ്പാക്കുന്നില്ല; അതിനാൽ പരിഭാഷ ആ അന്തിമകാലശാസ്ത്രപരമായ സംഘർഷം തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുഖ്യപാഠത്തിൽ ഒറ്റ നീണ്ട ഗ്രീക്ക് വാക്യം രണ്ടു വാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചു; ക്രിയാസംബന്ധവും കാരണബന്ധവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
