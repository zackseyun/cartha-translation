id: LUK.21.11
reference: Luke 21:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: ml
  text: വലിയ ഭൂകമ്പങ്ങൾ ഉണ്ടാകും; പല സ്ഥലങ്ങളിലും ക്ഷാമങ്ങളും പകർച്ചവ്യാധികളും[a] ഉണ്ടാകും. ഭീതിജനകമായ സംഭവങ്ങളും സ്വർഗത്തിൽനിന്നുള്ള[b] വലിയ അടയാളങ്ങളും[c] ഉണ്ടാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘മഹാമാരികളും.’ λοιμοί എന്ന ഗ്രീക്ക് പദം വ്യാപകമായി പടരുന്ന രോഗങ്ങളെയോ മഹാമാരികളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ആകാശത്തുനിന്നുള്ള.’ οὐρανός എന്ന ഗ്രീക്ക് പദത്തിന് സ്വർഗം എന്നും ആകാശം എന്നും അർഥമാകാം; അതിനാൽ ഈ പ്രയോഗം ദൃശ്യമായ ആകാശപ്രതിഭാസങ്ങളെ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘അടയാളങ്ങൾ’ എന്നതിന് പകരം, പ്രത്യേകിച്ച് അന്ത്യകാലസന്ദർഭത്തിൽ, ‘മുൻസൂചനകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί μεγάλοι
  choice: വലിയ ഭൂകമ്പങ്ങൾ
  rationale: σεισμοί എന്നത് ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ഭൂകമ്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; μεγάλοι അവയുടെ വലിപ്പമോ തീവ്രതയോ പ്രകടമാക്കുന്നു.
- source_word: κατὰ τόπους
  choice: പല സ്ഥലങ്ങളിലും
  rationale: വിവിധ ഭൂമിശാസ്ത്രസ്ഥാനങ്ങളിൽ സംഭവിക്കുന്നതെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λιμοὶ
  choice: ക്ഷാമങ്ങൾ
  rationale: ലഘുവായ ഭക്ഷ്യക്ഷാമമല്ല, ഗുരുതരമായ ക്ഷാമാവസ്ഥയാണ് ഈ പദത്തിന്റെ സാധാരണ അർഥം.
- source_word: λοιμοὶ
  choice: പകർച്ചവ്യാധികൾ
  rationale: മഹാമാരികളെയോ വ്യാപകമായ രോഗബാധകളെയോ സൂചിപ്പിക്കുന്ന പദം; ഇന്നത്തെ വായനക്കാർക്ക് വ്യക്തമായ പദപ്രയോഗമാണിത്.
- source_word: φόβητρα
  choice: ഭീതിജനകമായ സംഭവങ്ങൾ
  rationale: ഭയം ഉളവാക്കുന്ന വസ്തുക്കളെയോ സംഭവങ്ങളെയോ സൂചിപ്പിക്കുന്ന അപൂർവമായ ബഹുവചനരൂപത്തിന്റെ അർഥം അനാവശ്യമായി നിർവചിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: σημεῖα
  choice: അടയാളങ്ങൾ
  rationale: σημεῖον എന്ന പദത്തിന്റെ വിശാലവും പുതിയനിയമത്തിൽ പതിവുമായ അർഥം നിലനിർത്തുന്നു; അന്ത്യകാലസൂചനകൾ എന്ന ആശയം ബലമായി ചേർക്കുന്നില്ല.
- source_word: ἀπ’ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്നുള്ള
  rationale: οὐρανός എന്ന പദത്തിന്റെ ദൈവിക അനുരണനം നിലനിർത്തുന്നു; അതിന് ‘ആകാശം’ എന്ന ദൃശ്യലോകസംബന്ധിയായ അർഥവും സാധ്യമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μεγάλα
  choice: വലിയ
  rationale: അടയാളങ്ങളുടെ പ്രാധാന്യമോ വ്യാപ്തിയോ സൂചിപ്പിക്കുന്ന വിശേഷണം നേരിട്ട് നൽകുന്നു; ‘ശക്തമായ’ എന്ന വ്യാഖ്യാനപരമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: ἔσονται / ἔσται
  choice: ഉണ്ടാകും
  rationale: വരാനിരിക്കുന്ന സംഭവങ്ങളുടെ പട്ടികയിൽ εἰμίയുടെ ഭാവികാലരൂപങ്ങളെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിലെ οὐρανός എന്ന പദത്തിന്റെ അർഥം
  choice: സ്വർഗത്തിൽനിന്നുള്ള
  alternative: ആകാശത്തുനിന്നുള്ള
  rationale: ലൂക്കോസിന്റെ ഭാഷയിലെ ദൈവിക അനുരണനം പ്രധാന പാഠത്തിൽ നിലനിർത്തുന്നു; അതേസമയം ദൃശ്യമായ ആകാശപ്രതിഭാസങ്ങളെയും ഈ വാക്യം സൂചിപ്പിക്കാമെന്ന യഥാർഥ ദ്വയാർഥത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. φόβητρα എന്ന അപൂർവപദം ‘ഭീതിജനകമായ സംഭവങ്ങൾ’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കി. പാഠത്തിലെ രണ്ടു ഭാവികാലവാക്യങ്ങളുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ആശയബന്ധമില്ലാത്ത സ്ഥാനങ്ങളിൽ കണ്ടതിനാൽ, ഓരോ അടിക്കുറിപ്പും അതത് പദത്തിന് പിന്നാലെ ക്രമപ്പെടുത്തി.
