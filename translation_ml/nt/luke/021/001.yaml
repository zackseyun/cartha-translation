translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദേവാലയം’ മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല, കാരണം അത് ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠത്തിൽ നേരിട്ട് ഇല്ല; സാംസ്കാരിക വിവരം അടിക്കുറിപ്പിൽ നൽകി.
