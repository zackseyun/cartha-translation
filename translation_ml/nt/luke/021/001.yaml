id: LUK.21.1
reference: Luke 21:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀναβλέψας δὲ εἶδεν τοὺς βάλλοντας ⸂εἰς τὸ γαζοφυλάκιον τὰ δῶρα αὐτῶν⸃ πλουσίους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: ml
  text: പിന്നെ അവൻ കണ്ണുയർത്തി നോക്കിയപ്പോൾ, ധനികർ തങ്ങളുടെ ദാനങ്ങൾ ഭണ്ഡാരത്തിൽ[a][b] ഇടുന്നതു കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളുടെ വഴിപാടുകൾ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ഭണ്ഡാരം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം ദേവാലയത്തിലെ ഭണ്ഡാരപ്രദേശത്തെയോ വഴിപാടുകൾ ഇടുന്ന പെട്ടികളെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: കണ്ണുയർത്തി നോക്കിയപ്പോൾ
  rationale: കാഴ്ച മുകളിലേക്കുയർത്തുന്ന വ്യക്തമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ കാലബന്ധവും നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പിന്നെ
  rationale: ശക്തമായ വൈരുധ്യം ചേർക്കാതെ ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമായി ഉപയോഗിച്ചു.
- source_word: εἶδεν
  choice: കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ലളിതമായ ദൃശ്യഗ്രഹണാർഥം അധിക വ്യാഖ്യാനമില്ലാതെ നൽകുന്നു.
- source_word: τοὺς βάλλοντας
  choice: ഇടുന്നതു
  rationale: βάλλω എന്നതിന്റെ അക്ഷരാർഥം ‘എറിയുക’ എന്നാണെങ്കിലും, ദാനം സമർപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘ഇടുക’ എന്നതാണ് സ്വാഭാവികമായ മലയാളം.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: ഭണ്ഡാരത്തിൽ
  rationale: ക്ഷേത്രത്തിലെ ധനസംഭരണസ്ഥലത്തെയോ വഴിപാടുപെട്ടികളെയോ സൂചിപ്പിക്കാവുന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്ന സംക്ഷിപ്തമായ പരിഭാഷ.
- source_word: τὰ δῶρα αὐτῶν
  choice: തങ്ങളുടെ ദാനങ്ങൾ
  rationale: δῶρα എന്നതിന്റെ ‘ദാനങ്ങൾ/സമ്മാനങ്ങൾ’ എന്ന അടിസ്ഥാനാർഥവും ഈ ആരാധനാസന്ദർഭത്തിലെ സമർപ്പണസ്വഭാവവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πλουσίους
  choice: ധനികർ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പുനരാവിഷ്കരിക്കുന്നു.
