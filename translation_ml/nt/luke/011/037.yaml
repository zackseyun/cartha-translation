  text: Ἐν δὲ τῷ λαλῆσαι ⸀ἐρωτᾷ αὐτὸν ⸀Φαρισαῖος ὅπως ἀριστήσῃ παρ’ αὐτῷ· εἰσελθὼν δὲ ἀνέπεσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: ml
  text: അവൻ സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഒരു പരീശൻ യേശുവിനോട് തന്നോടൊപ്പം ഭക്ഷണം കഴിക്കാൻ[a] അഭ്യർഥിച്ചു. അദ്ദേഹം അകത്തു ചെന്ന് മേശയ്ക്കരികിൽ ചാരിക്കിടന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രഭാതഭക്ഷണം കഴിക്കാൻ’ അല്ലെങ്കിൽ ‘നേരത്തെയുള്ള ഭക്ഷണം കഴിക്കാൻ’; ഗ്രീക്ക് ക്രിയ നേരത്തെയുള്ള ഒരു ഭക്ഷണത്തെ സൂചിപ്പിക്കാം, എന്നാൽ ഇവിടെ പൊതുവായി ഭക്ഷണം കഴിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ഔപചാരിക ഭക്ഷണവേളയിൽ അക്കാലത്ത് പതിവായിരുന്ന രീതിയിൽ ചാരിക്കിടന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: അവൻ സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐν + articular infinitive എന്ന ഘടന സൂചിപ്പിക്കുന്ന സമകാലികവും തുടർന്നുകൊണ്ടിരിക്കുന്നതുമായ പ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐρωτᾷ
  choice: അവനോട് ആവശ്യപ്പെട്ടു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ചോദിക്കുക/അഭ്യർഥിക്കുക’ എന്നതാണ്; പിന്നാലെയുള്ള ὅπως-clause അതിനെ ഭക്ഷണത്തിനുള്ള ക്ഷണമായി വ്യക്തമാക്കുന്നു. മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലം സ്വാഭാവികമായതിനാൽ ഗ്രീക്കിലെ historical present അക്ഷരാർഥത്തിൽ നിലനിർത്തിയിട്ടില്ല.
- source_word: Φαρισαῖος
  choice: ഒരു പരീശൻ
  rationale: കൂട്ടത്തിന്റെ പതിവായ മലയാള നാമരൂപവും അനിർദിഷ്ട ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: ὅπως ἀριστήσῃ
  choice: ഭക്ഷണം കഴിക്കാൻ
  rationale: ἀριστάω പ്രഭാതത്തിലെയോ പകൽ നേരത്തെയോ ഉള്ള ഭക്ഷണത്തെ സൂചിപ്പിക്കാമെങ്കിലും, സമയം അനാവശ്യമായി നിർണയിക്കാതെ പൊതുവായ ഭക്ഷണസന്ദർഭം നൽകുന്നു.
- source_word: παρ’ αὐτῷ
  choice: തന്നോടൊപ്പം
  rationale: ഗ്രീക്ക് വാചകത്തിന്റെ ‘അവനോടൊപ്പം/അവന്റെ ഇടത്ത്’ എന്ന അർഥവ്യാപ്തിയിൽ സ്ഥലം വ്യക്തമാക്കാതെ വ്യക്തിപരമായ സഹഭോജനബന്ധം നിലനിർത്തുന്നു.
- source_word: εἰσελθὼν
  choice: അകത്തു ചെന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവേശനം സ്വാഭാവികമായ ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀνέπεσεν
  choice: മേശയ്ക്കരികിൽ ചാരിയിരുന്നു
  rationale: ഒന്നാം നൂറ്റാണ്ടിലെ ഔപചാരിക ഭക്ഷണവേളയിലെ ചാരിക്കിടക്കുന്ന/ചാരിയിരിക്കുന്ന ശരീരനില വായനക്കാരന് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; ‘മേശയ്ക്കരികിൽ’ ഭക്ഷണസന്ദർഭത്തിൽ അന്തർലീനമായ വിവരം മാത്രമാണ്.
