translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഭോജനം ചെയ്യുക’ പോലുള്ള പഴയതോ അത്യൗപചാരികമോ ആയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി; ചരിത്രപരമായ ഭക്ഷണരീതി ‘ചാരിയിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തി.
