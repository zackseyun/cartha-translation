reference: Luke 11:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: ml
  text: അത് വന്ന്, വീട് അടിച്ചുവാരിയതും ക്രമീകരിച്ചതുമായ നിലയിൽ കണ്ടെത്തുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അടിച്ചുവാരിയതും അലങ്കരിച്ചതുമായ നിലയിൽ.’
    reason: κεκοσμημένον എന്നതിന് ഈ സന്ദർഭത്തിൽ ‘ക്രമീകരിച്ച’ എന്ന അർത്ഥം യോജിക്കുന്നുവെങ്കിലും, ‘അലങ്കരിച്ച’ എന്നതും സാധുവായ പദസാധ്യതയാണ്.
lexical_decisions:
- source_word: ἐλθὸν
  choice: അത് വന്ന്
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ aorist participle ആണ്. മുൻവാക്യത്തിലെ അശുദ്ധാത്മാവാണ് കർത്താവ്. മലയാളത്തിൽ ‘വന്ന്’ എന്ന പ്രയോഗം മുൻക്രിയയും തുടർന്നുള്ള കണ്ടെത്തലും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ‘മടങ്ങിവന്ന്’ എന്ന് ചേർക്കുന്നത് സന്ദർഭത്തിൽ ന്യായമായിരുന്നാലും മൂലപദത്തിൽ ഇല്ലാത്ത അർത്ഥം വ്യക്തമാക്കുന്നതിനാൽ ഒഴിവാക്കി.
- source_word: εὑρίσκει
  choice: കാണുന്നു
  rationale: വർത്തമാനകാലരൂപത്തിന്റെ സജീവമായ ആഖ്യാനഭാവം നിലനിർത്തുന്നു. ഈ സന്ദർഭത്തിൽ ‘കണ്ടെത്തുന്നു’ എന്നതിനെക്കാൾ ‘കാണുന്നു’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: σεσαρωμένον
  choice: അടിച്ചുവാരി
  rationale: σαρόω എന്ന ക്രിയയുടെ perfect passive participle വീടിനെ അടിച്ചുവാരിയതും ആ അവസ്ഥ തുടരുന്നതും സൂചിപ്പിക്കുന്നു. ‘വൃത്തിയാക്കി’ എന്ന് വിവർത്തനം ചെയ്താൽ മൂലത്തിലെ പ്രത്യേക പ്രവർത്തി പൊതുവാക്കപ്പെടും; അതിനാൽ ‘അടിച്ചുവാരി’ നിലനിർത്തി.
- source_word: κεκοσμημένον
  choice: ക്രമപ്പെടുത്തിയിരിക്കുന്നതായി
  rationale: κοσμέω എന്നതിന്റെ perfect passive participle ഇവിടെ വീടിനെ ക്രമത്തിൽ ഒരുക്കിയ നിലയെ സൂചിപ്പിക്കാം. ‘അലങ്കരിച്ചിരിക്കുന്നതായി’ സാധുവായ മറ്റൊരു അർത്ഥമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: വ്യക്തമായി പറയാത്ത കർമത്തിന്റെ സൂചകം
  choice: വീട് എന്ന് വ്യക്തമാക്കി
  alternative: അത് എന്ന് സർവനാമം ഉപയോഗിക്കുക
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻസന്ദർഭത്തിലെ ‘വീട്’ തന്നെയാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ കർത്താവായ അശുദ്ധാത്മാവിനും കർമമായ വീടിനും ‘അത്’ ഉപയോഗിക്കേണ്ടിവരുന്നതിനാൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘വീട്’ വ്യക്തമാക്കി; ഇതിലൂടെ ഉപമയുടെ വ്യാഖ്യാനം കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
- issue: അശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന സർവനാമം
  choice: അത്
  alternative: അവൻ
  rationale: πνεῦμα ഗ്രീക്കിൽ നപുംസകലിംഗമാണ്; മലയാളത്തിലും അശുദ്ധാത്മാവിനെ അനാവശ്യമായി പുരുഷവൽക്കരിക്കാതെ ‘അത്’ എന്ന് സൂചിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. perfect participles സൂചിപ്പിക്കുന്ന ഫലാവസ്ഥ ‘ക്രമപ്പെടുത്തിയിരിക്കുന്നതായി’ എന്ന രൂപത്തിലൂടെ പ്രകടമാക്കി; മുൻസന്ദർഭം വ്യക്തമാക്കുന്ന പരിധിയിൽ മാത്രം ‘വീട്’ ആവർത്തിച്ചു.
