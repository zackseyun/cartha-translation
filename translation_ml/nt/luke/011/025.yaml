revisions:
- from: അത് വന്ന്, വീട് അടിച്ചുവാരി ക്രമപ്പെടുത്തിയിരിക്കുന്നതായി കാണുന്നു.[a]
  to: അത് വന്ന്, വീട് അടിച്ചുവാരിയതും ക്രമീകരിച്ചതുമായ നിലയിൽ കണ്ടെത്തുന്നു.[a]
  rationale: The revision retains the explicit «വീട്» to avoid Malayalam pronoun ambiguity, preserves the vivid present of εὑρίσκει with «കണ്ടെത്തുന്നു», and expresses both perfect passive participles as the house’s continuing resultant condition. The alternative ‘adorned’ sense remains in the anchored footnote.
