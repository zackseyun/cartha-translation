id: LUK.11.13
reference: Luke 11:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: ml
  text: അതിനാൽ, ദുഷ്ടരായ നിങ്ങൾ നിങ്ങളുടെ മക്കൾക്കു നല്ല സമ്മാനങ്ങൾ കൊടുക്കാൻ അറിയുന്നെങ്കിൽ, സ്വർഗത്തിൽനിന്നുള്ള പിതാവ്[a] തന്നോടു ചോദിക്കുന്നവർക്കു പരിശുദ്ധാത്മാവിനെ[b] എത്രയധികം നൽകും!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പരിഭാഷകൾ മത്തായി 7:11-നോടു സാമ്യപ്പെടുത്തി ‘നിങ്ങളുടെ സ്വർഗീയ പിതാവ്’ എന്നു നൽകുന്നു; എന്നാൽ ലൂക്കോസിന്റെ ഗ്രീക്ക് പാഠം ‘സ്വർഗത്തിൽനിന്നുള്ള പിതാവ്’ എന്നാണ് പറയുന്നത്.
    reason: alternative_reading
  - marker: b
    text: മത്തായി 7:11-ൽ ഇവിടെ പറയുന്ന ‘പരിശുദ്ധാത്മാവ്’ എന്നതിനുപകരം ‘നല്ല കാര്യങ്ങൾ’ എന്നാണ് ഉള്ളത്; ഇങ്ങനെ ഓരോ സുവിശേഷത്തിന്റെയും വ്യതിരിക്തമായ പദപ്രയോഗം നിലനിൽക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: ദുഷ്ടരായിരിക്കുന്ന
  rationale: മനുഷ്യരുടെ ധാർമികാവസ്ഥയെ വിവരിക്കുന്ന ഗ്രീക്ക് കൃദ്‌രൂപത്തിന്റെ അർഥം അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: οἴδατε ... διδόναι
  choice: കൊടുക്കാൻ അറിയുന്നെങ്കിൽ
  rationale: പ്രായോഗികമായ അറിവിനെയോ കഴിവിനെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δόματα ἀγαθὰ
  choice: നല്ല സമ്മാനങ്ങൾ
  rationale: δόματα പൊതുവായ ‘കാര്യങ്ങൾ’ എന്നതിലുപരി നൽകപ്പെടുന്ന സമ്മാനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τέκνοις ὑμῶν
  choice: നിങ്ങളുടെ മക്കൾക്കു
  rationale: കുടുംബസന്ദർഭത്തിൽ τέκνα എന്നതിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: πόσῳ μᾶλλον
  choice: എത്രയധികമായി
  rationale: ചെറിയതിൽനിന്ന് വലുതിലേക്കുള്ള താരതമ്യയുക്തി മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്നുള്ള പിതാവ്
  rationale: ഗ്രീക്കിലെ ἐξ οὐρανοῦ എന്ന ‘സ്വർഗത്തിൽനിന്നുള്ള’ പ്രയോഗം നിലനിർത്തുകയും മത്തായിയുടെ സമാന്തരവാക്യവുമായി സമന്വയിപ്പിക്കാൻ ‘നിങ്ങളുടെ സ്വർഗീയ പിതാവ്’ എന്നു മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πνεῦμα ἅγιον
  choice: പരിശുദ്ധാത്മാവിനെ
  rationale: ഈ ലൂക്കോസ് സന്ദർഭത്തിൽ ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്; മലയാള ക്രൈസ്തവപ്രയോഗത്തിൽ ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: തന്നോടു ചോദിക്കുന്നവർക്കു
  rationale: αὐτόν എന്ന വ്യക്തമായ കർമത്തെ നിലനിർത്തുന്നു; ‘തന്നോടു’ എന്നത് ഇവിടെ പിതാവിനെയാണ് ചോദിക്കുന്നത് എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πνεῦμα ἅγιον എന്നതിന്റെ സൂചിതവ്യക്തിയും രൂപവും
  choice: വ്യക്തിപരമായ ദൈവാത്മാവിനെ സൂചിപ്പിക്കുന്ന ‘പരിശുദ്ധാത്മാവ്’
  alternative: ‘ഒരു വിശുദ്ധ ആത്മാവ്’ അല്ലെങ്കിൽ പൊതുവായ ‘വിശുദ്ധാത്മാവ്’
  rationale: ഗ്രീക്കിൽ നിർദേശകപദമില്ലെങ്കിലും ലൂക്കോസിലെ ഈ സന്ദർഭം പിതാവ് നൽകുന്ന ദൈവത്തിന്റെ ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: മത്തായി 7:11-ലെ സമാന്തരവാക്യവുമായുള്ള ബന്ധം
  choice: ലൂക്കോസിന്റെ ‘സ്വർഗത്തിൽനിന്നുള്ള പിതാവ്’, ‘പരിശുദ്ധാത്മാവ്’ എന്നീ വ്യതിരിക്ത പദപ്രയോഗങ്ങൾ നിലനിർത്തുക
  alternative: ‘നിങ്ങളുടെ സ്വർഗീയ പിതാവ്’, ‘നല്ല കാര്യങ്ങൾ’ എന്നിങ്ങനെ മത്തായിയോടു സമന്വയിപ്പിക്കുക
  rationale: പരിഭാഷ ലൂക്കോസിന്റെ ഗ്രീക്ക് പാഠത്തെ പിന്തുടരുകയും ഓരോ സുവിശേഷത്തിന്റെയും വ്യതിരിക്തമായ പദപ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. വാക്യത്തിന്റെ ‘ചെറിയതിൽനിന്ന് വലുതിലേക്ക്’ എന്ന വാദഘടനയും ലൂക്കോസിന്റെ പ്രത്യേക പദപ്രയോഗങ്ങളും സംരക്ഷിച്ചിരിക്കുന്നു.
