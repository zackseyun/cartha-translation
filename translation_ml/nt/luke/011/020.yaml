id: LUK.11.20
reference: Luke 11:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ ദൈവത്തിന്റെ വിരൽകൊണ്ട്[a] ഭൂതങ്ങളെ പുറത്താക്കുന്നുവെങ്കിൽ, അപ്പോൾ ദൈവരാജ്യം നിങ്ങളിലേക്കു വന്നെത്തിയിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ വിരലാൽ.’ ഈ പ്രയോഗം ദൈവത്തിന്റെ നേരിട്ടുള്ള ശക്തിയെ സൂചിപ്പിക്കുകയും പുറപ്പാട് 8:19-നെ ഓർമിപ്പിക്കുകയും ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളെ സമീപിച്ചെത്തിയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെമേൽ വന്നിരിക്കുന്നു.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: ദൈവത്തിന്റെ വിരൽകൊണ്ട്
  rationale: ദൈവത്തിന്റെ നേരിട്ടുള്ള ശക്തിയെയും പ്രവർത്തനത്തെയും സൂചിപ്പിക്കുന്ന സജീവമായ രൂപകം അതേപടി നിലനിർത്തുന്നു; പുറപ്പാട് 8:19-ലെ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: ἐκβάλλω
  choice: പുറത്താക്കുന്നു
  rationale: ഭൂതോച്ചാടനസന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: τὰ δαιμόνια
  choice: ഭൂതങ്ങളെ
  rationale: δαιμόνια എന്ന പദത്തിന്റെ നേരിട്ടുള്ള മലയാളസമാനത; വ്യത്യസ്തമായ ഗ്രീക്ക് പ്രയോഗമായ ‘അശുദ്ധാത്മാക്കൾ’ എന്നത് ഇവിടെ കൊണ്ടുവരുന്നില്ല.
- source_word: ἄρα
  choice: എങ്കിൽ
  rationale: വാക്യത്തിന്റെ നിബന്ധനാ ഘടനയോടൊപ്പം നിഗമനത്തിന്റെ ബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പ്രത്യേകമായി ‘അപ്പോൾ’ ചേർക്കാതെ തന്നെ ഫലം പ്രകടമാകുന്നു.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: നിങ്ങളിലേക്കു വന്നെത്തിയിരിക്കുന്നു
  rationale: രാജ്യം നിർണായകമായി എത്തിച്ചേർന്നുവെന്ന പൂർത്തീകരണബലവും ശ്രോതാക്കളിലേക്കുള്ള ദിശാസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും βασιλείαയുടെ രാജത്വ-ഭരണ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നതുമായ സ്വാഭാവിക പ്രയോഗം.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ വിരൽ’ എന്നതിന്റെ അർത്ഥം
  choice: യേശുവിന്റെ ഭൂതോച്ചാടനങ്ങളിൽ ദൈവത്തിന്റെ നേരിട്ടുള്ള ശക്തിയെയും പ്രവർത്തനത്തെയും സൂചിപ്പിക്കുന്ന രൂപകമായി ചിത്രം അതേപടി നിലനിർത്തി.
  alternative: മത്തായി 12:28-നോടുള്ള താരതമ്യത്തിൽ പരിശുദ്ധാത്മാവിനെ നേരിട്ട് പരാമർശിക്കുന്നതായി വിവർത്തനം ചെയ്യുക.
  rationale: ലൂക്കോസിന്റെ പ്രത്യേക പദപ്രയോഗം മാറ്റാതെ, പുറപ്പാട് 8:19-നോടുള്ള ബന്ധവും ദൈവിക പ്രവർത്തനത്തിന്റെ ദൃശ്യരൂപകവും സംരക്ഷിക്കുന്നു; വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: ‘ദൈവരാജ്യം നിങ്ങളിലേക്കു വന്നെത്തിയിരിക്കുന്നു’ എന്നതിന്റെ ബലം
  choice: യേശുവിന്റെ ശുശ്രൂഷയിൽ ദൈവരാജ്യം ഇപ്പോൾ നിർണായകമായി എത്തിച്ചേർന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: രാജ്യം പൂർണമായും ഭാവിയിലുള്ളതെന്നോ, ‘നിങ്ങളെ പിടികൂടിയിരിക്കുന്നു’ എന്ന ശിക്ഷാത്മക അർത്ഥമെന്നോ അവതരിപ്പിക്കുക.
  rationale: ἔφθασεν എന്ന ക്രിയയും ἐπί ചേർന്ന പ്രയോഗവും ഈ സന്ദർഭത്തിൽ യാഥാർഥ്യമായ എത്തിച്ചേരലിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ സമഗ്രമായ അന്ത്യകാലവ്യവസ്ഥ ഒന്നും വാചകത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘ദൈവത്തിന്റെ വിരൽ’ എന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തി; ‘വന്നെത്തിയിരിക്കുന്നു’ എന്നത് എത്തിച്ചേരലിന്റെ നിർണായകത സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
