reference: Luke 11:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: ml
  text: 'ജനക്കൂട്ടങ്ങൾ കൂടിവന്നുകൊണ്ടിരിക്കുമ്പോൾ, അവൻ പറഞ്ഞുതുടങ്ങി: “ഈ തലമുറ തിന്മയുള്ള[a] ഒരു തലമുറയാണ്. അത് ഒരു അടയാളം തേടുന്നു; എന്നാൽ യോനായുടെ അടയാളം[b] അല്ലാതെ ഒരു അടയാളവും അതിന് നൽകപ്പെടുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദുഷ്ടമായ.”
    reason: lexical_alternative
  - marker: b
    text: “യോനായുടെ അടയാളം” എന്നത് യോനാ തന്നെയെയോ അദ്ദേഹത്തിന്റെ പ്രവാചകദൗത്യത്തെയോ ഒരു അടയാളമായി സൂചിപ്പിക്കാം; മറ്റു സുവിശേഷങ്ങളിലെ സമാന്തരഭാഗങ്ങളുടെ വെളിച്ചത്തിൽ, യേശുവിന്റെ മരണത്തോടും ഉയിർപ്പിനോടുമുള്ള പ്രതിരൂപപരമായ ബന്ധങ്ങളെയും ഇത് സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: ഒന്നിച്ചുകൂടിക്കൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനക്കൂട്ടങ്ങൾ സമ്മേളിച്ചുകൊണ്ടിരുന്ന തുടർച്ചയായ പ്രവൃത്തിയും മുഖ്യക്രിയയോടുള്ള സമകാലികതയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἤρξατο λέγειν
  choice: പറഞ്ഞുതുടങ്ങി
  rationale: പ്രവൃത്തിയുടെ ആരംഭം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയുടെ ഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: γενεά
  choice: തലമുറ
  rationale: കാലികവും സാമൂഹികവുമായ കൂട്ടായ അർഥവ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്ന സാധാരണ മലയാള പദമാണ്.
- source_word: πονηρά
  choice: തിന്മയുള്ള
  rationale: ധാർമികമായ പ്രതികൂല വിലയിരുത്തൽ വ്യക്തമായി നൽകുന്നു; കൂടുതൽ പാരമ്പര്യഭാവമുള്ള ‘ദുഷ്ട’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: σημεῖον
  choice: അടയാളം
  rationale: സാക്ഷ്യപ്പെടുത്തുന്ന അസാധാരണ സംഭവമെന്ന സാധ്യത നിലനിർത്തുകയും ‘അത്ഭുതം’ എന്ന് വ്യാഖ്യാനം കൂട്ടിച്ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ζητεῖ
  choice: തേടുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥത്തോട് അടുത്തുനിൽക്കുന്നു; ആവശ്യപ്പെടുന്ന മനോഭാവം സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാവുന്നതായി വിടുന്നു.
- source_word: δοθήσεται
  choice: നൽകപ്പെടുകയില്ല
  rationale: ഭാവികാല നിഷ്ക്രിയരൂപത്തിന്റെ അർഥം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: നിഷേധവാക്യത്തിനു ശേഷമുള്ള ഒഴിവാക്കൽ സ്വാഭാവികമായ മലയാളത്തിൽ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: യോനായുടെ അടയാളം
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചകപ്രയോഗത്തിന്റെ വ്യാഖ്യാനസാധ്യതകൾ തുറന്നുവെക്കുന്നു; അത് യോനാ തന്നെയോ, അവന്റെ ദൗത്യമോ, മറ്റൊരു പ്രതീകബന്ധമോ എന്ന് മുഖ്യപാഠത്തിൽ തീരുമാനിക്കുന്നില്ല.
theological_decisions:
- issue: ‘ഈ തലമുറ’ എന്നതിലുള്ള യേശുവിന്റെ കുറ്റവിധിയുടെ വ്യാപ്തി
  choice: യേശുവിന്റെ സമകാലികരെ കൂട്ടായ ധാർമിക വിലയിരുത്തലിനു വിധേയരാക്കുന്ന വിശാലമായ പ്രയോഗമായി വിവർത്തനം ചെയ്തു.
  alternative: അവിടെ സന്നിഹിതരായ ചില എതിരാളികളെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ‘ഈ തലമുറ’ എന്ന കൂട്ടായ പ്രയോഗം ആവർത്തിച്ച് ഊന്നുന്നു; അതിന്റെ വ്യാപ്തി വിവർത്തനത്തിൽ അനാവശ്യമായി ചുരുക്കിയിട്ടില്ല.
- issue: ‘യോനായുടെ അടയാളം’ എന്നതിന്റെ അർഥം
  choice: ബന്ധസൂചകപ്രയോഗം മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിക്കാതെ അതേ തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
  alternative: യോനായുടെ പ്രസംഗദൗത്യമെന്നോ യേശുവിന്റെ മരണത്തിന്റെയും ഉയിർപ്പിന്റെയും പ്രതിരൂപമെന്നോ നേരിട്ട് വ്യക്തമാക്കുക.
  rationale: ലൂക്കായുടെ തുടർന്നുള്ള സന്ദർഭവും മറ്റു സുവിശേഷങ്ങളിലെ സമാന്തരഭാഗങ്ങളും വിവിധ ബന്ധങ്ങൾ ഉണർത്തുന്നു; അതിനാൽ മുഖ്യപാഠം ഒരൊറ്റ വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കത്തക്കവിധം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘അടയാളം’, ‘തലമുറ’, ‘യോനായുടെ അടയാളം’ എന്നീ പ്രധാന പദപ്രയോഗങ്ങളുടെ ദൈവശാസ്ത്രപരമായ തുറന്ന സ്വഭാവം നിലനിർത്തി.
