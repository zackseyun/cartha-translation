reference: Luke 11:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: ml
  text: ഞങ്ങളുടെ പാപങ്ങൾ ക്ഷമിച്ചുതരണമേ; കാരണം, ഞങ്ങളോടു കടപ്പെട്ടിരിക്കുന്ന എല്ലാവരോടും ഞങ്ങളും ക്ഷമിക്കുന്നു.[a] ഞങ്ങളെ പ്രലോഭനത്തിലേക്കു കൊണ്ടുവരരുതേ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഞങ്ങളോടു കടമുള്ള എല്ലാവരോടും.’ ആദ്യ വാക്യഭാഗത്തിൽ ഗ്രീക്ക് ‘പാപങ്ങൾ’ എന്നു പറയുമ്പോൾ ഇവിടെ കടത്തിന്റെ ഭാഷയാണ് ഉപയോഗിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രലോഭനം’ എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് ‘പരീക്ഷ’ അല്ലെങ്കിൽ ‘കഷ്ടപരീക്ഷ’ എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: ക്ഷമിക്കണമേ
  rationale: പ്രാർഥനാസന്ദർഭത്തിലെ ἀφίημι എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം മലയാളത്തിൽ ദൈവത്തോടുള്ള ആദരപൂർവമായ അപേക്ഷയായി ‘ക്ഷമിക്കണമേ’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: ഞങ്ങളുടെ പാപങ്ങൾ
  rationale: മൂലപാഠം ഇവിടെ കടങ്ങൾ എന്നല്ല, വ്യക്തമായി ‘പാപങ്ങൾ’ എന്നാണ് പറയുന്നത്.
- source_word: καὶ γὰρ αὐτοὶ
  choice: എന്തെന്നാൽ ... ഞങ്ങളും
  rationale: γὰρ മുൻ അപേക്ഷയ്ക്കുള്ള കാരണം സൂചിപ്പിക്കുന്നു; αὐτοὶയുടെ ഊന്നലും καίയുടെ ‘കൂടി’ എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ ‘ഞങ്ങളും’ ഉൾക്കൊള്ളുന്നു.
- source_word: ἀφίομεν
  choice: ക്ഷമിക്കുന്നു
  rationale: ആദ്യഘടകത്തിലെ ἄφες എന്ന ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും വ്യക്തികൾ തമ്മിലുള്ള ബന്ധസന്ദർഭത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: ഞങ്ങളോടു കടപ്പെട്ടിരിക്കുന്ന എല്ലാവരോടും
  rationale: ὀφείλωയിലെ കടബാധ്യതയുടെ ഭാഷ നിലനിർത്തുന്നു; അതേസമയം ഇത് മലയാളത്തിൽ വ്യക്തിയെ ക്ഷമിക്കുന്നതുമായി സ്വാഭാവികമായി ബന്ധപ്പെടുന്നു.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: ഞങ്ങളെ പ്രലോഭനത്തിലേക്കു കൊണ്ടുവരരുതേ
  rationale: εἰσφέρωയുടെ ‘അകത്തേക്ക് കൊണ്ടുവരുക’ എന്ന അർഥം ‘കൊണ്ടുവരരുതേ’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു; πειρασμόςയുടെ പ്രധാന വിവർത്തനമായി ‘പ്രലോഭനം’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: πειρασμός സംബന്ധിച്ച അവസാന അപേക്ഷയുടെ അർഥം
  choice: ‘ഞങ്ങളെ പ്രലോഭനത്തിലേക്കു കൊണ്ടുവരരുതേ’ എന്ന് ദൈവത്തോടുള്ള അപേക്ഷയായി അതേപടി നിലനിർത്തുക.
  alternative: ‘ഞങ്ങളെ പരീക്ഷയിലേക്കോ കഷ്ടപരീക്ഷയിലേക്കോ കൊണ്ടുവരരുതേ.’
  rationale: ദൈവവും പ്രലോഭനവും തമ്മിലുള്ള ബന്ധത്തെ വിശദീകരിച്ച് വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നീക്കാതെ, ഗ്രീക്ക് വാചകത്തിന്റെ രൂപം നിലനിർത്തുന്നു; πειρασμόςയുടെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘പാപങ്ങൾ’ എന്നും ‘കടപ്പെട്ടിരിക്കുന്നവർ’ എന്നും ഉള്ള വ്യത്യസ്ത രൂപകങ്ങൾ
  choice: ആദ്യഘടകത്തിൽ ‘പാപങ്ങൾ’, രണ്ടാമത്തേതിൽ കടബാധ്യതയുടെ ഭാഷ നിലനിർത്തുക.
  alternative: രണ്ടിടത്തും ഒരേ രൂപകം ഉപയോഗിച്ച് ‘കടങ്ങൾ/കടക്കാർ’ അല്ലെങ്കിൽ ‘പാപങ്ങൾ/പാപം ചെയ്തവർ’ എന്നു സമമാക്കുക.
  rationale: ἁμαρτίας എന്നും ὀφείλοντι എന്നും മൂലപാഠം ഉദ്ദേശപൂർവം ഉപയോഗിക്കുന്ന വ്യത്യസ്ത പദങ്ങളെ ഒന്നാക്കി സമതലപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രാർഥനാശൈലി. ‘ണമേ/രുതേ’ രൂപങ്ങൾ ദൈവത്തോടുള്ള നേരിട്ടുള്ള അപേക്ഷയ്ക്ക് ഗൗരവം നൽകുന്നു. പരമ്പരാഗതമായ ‘നയിക്കരുതേ’ എന്നതിനു പകരം εἰσφέρωയുടെ അർഥത്തോട് അടുത്ത ‘കൊണ്ടുവരരുതേ’ സ്വീകരിച്ചു.
