id: LUK.11.12
reference: Luke 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ καὶ ⸀αἰτήσει ᾠόν, ⸀ἐπιδώσει αὐτῷ σκορπίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, അവൻ ഒരു മുട്ട ചോദിച്ചാൽ, അയാൾ അവന് ഒരു തേളിനെ കൊടുക്കുമോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: അല്ലെങ്കിൽ
  rationale: യേശുവിന്റെ സമാന്തരമായ അടുത്ത ഉദാഹരണം അവതരിപ്പിക്കുന്ന വികൽപബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; καί വേർതിരിച്ച് അതിവിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: αἰτήσει
  choice: ചോദിച്ചാൽ
  rationale: ഭാവികാല സൂചകരൂപം ഇവിടെ വ്യവസ്ഥാസദൃശമായ വാചാടോപചോദ്യത്തിന്റെ ഭാഗമാണ്; മലയാളത്തിലെ വ്യവസ്ഥാരൂപം അർത്ഥവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: ᾠόν
  choice: ഒരു മുട്ട
  rationale: വസ്തുവിനെ നേരിട്ടും സാധാരണമായും സൂചിപ്പിക്കുന്ന പരിഭാഷ.
- source_word: ἐπιδώσει
  choice: കൊടുക്കുമോ
  rationale: അഭ്യർഥനയ്ക്കുള്ള പ്രതികരണമായി നൽകുക എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവന്
  rationale: പരോക്ഷ കർമമായ ദത്തിവിനെ വ്യക്തമായ മലയാള ദത്തിരൂപത്തിൽ നൽകുന്നു.
- source_word: σκορπίον
  choice: ഒരു തേളിനെ
  rationale: സാധാരണ മലയാള പദം; മുട്ടയുമായുള്ള അപകടകരവും അസംബന്ധവുമായ വൈരുധ്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പിതാവ്–മകൻ ഉപമയുടെ വാചാടോപശക്തി
  choice: വ്യാഖ്യാനവിസ്താരം ചേർക്കാതെ നേരിട്ടുള്ള വാചാടോപചോദ്യമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പകരം’ ചേർത്ത് വൈരുധ്യം തുറന്നുപറയുക.
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ ‘പകരം’ എന്ന ആശയം സൂചിതമാണെങ്കിലും തുറന്നുപറയുന്നില്ല. മലയാളത്തിലും ചോദ്യം അതിന്റെ അസംബന്ധമായ വൈരുധ്യം വ്യക്തമായി അറിയിക്കുന്നു; അതിനാൽ പിതാവിന്റെ നന്മയെക്കുറിച്ചുള്ള ആശയം വിശദീകരണമായി ചേർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഒരേ വാക്യത്തിൽ വരുന്ന രണ്ടു പുരുഷസർവനാമങ്ങളുടെ സൂചന വ്യക്തമാക്കാൻ ചോദിക്കുന്ന മകനെ ‘അവൻ’ എന്നും കൊടുക്കുന്ന പിതാവിനെ ‘അയാൾ’ എന്നും വേർതിരിച്ചു.
