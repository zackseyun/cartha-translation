id: LUK.11.9
reference: Luke 11:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ml
  text: 'ഞാനും നിങ്ങളോടു പറയുന്നു: ചോദിക്കൂ, നിങ്ങൾക്കു നൽകപ്പെടും; അന്വേഷിക്കൂ, നിങ്ങൾ കണ്ടെത്തും; മുട്ടൂ, നിങ്ങൾക്കായി തുറക്കപ്പെടും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിലെ വർത്തമാനകാല ആജ്ഞാരൂപങ്ങളുടെ തുടർച്ചയായ ഭാവം കൂടുതൽ വ്യക്തമാക്കി: “ചോദിച്ചുകൊണ്ടിരിക്കൂ … അന്വേഷിച്ചുകൊണ്ടിരിക്കൂ … മുട്ടിക്കൊണ്ടിരിക്കൂ” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: അതുകൊണ്ട് ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: καὶ ἐγώ മുൻപുള്ള ഉപദേശത്തിൽനിന്നുള്ള തുടർച്ചയും വക്താവിന്റെ ഊന്നലും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അതുകൊണ്ട് ഞാൻ’ ഈ സന്ദർഭബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു; λέγω ὑμῖν എന്നത് ‘നിങ്ങളോടു പറയുന്നു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: αἰτεῖτε
  choice: ചോദിക്കൂ
  rationale: പ്രാർത്ഥനയുടെ സന്ദർഭത്തിൽ αἰτέω അപേക്ഷിക്കുക/ചോദിക്കുക എന്ന അർഥത്തിലാണ്. ലളിതമായ ആജ്ഞാരൂപം ഗ്രീക്കിലെ ആജ്ഞ സംരക്ഷിക്കുന്നു; തുടർച്ചയായ പ്രവൃത്തിയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: δοθήσεται ὑμῖν
  choice: നിങ്ങൾക്കു നൽകപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും ദാതൃകാർത്തവും നേരിട്ട് നിലനിർത്തുന്നു; നൽകുന്ന വ്യക്തിയെ ഗ്രീക്ക് വ്യക്തമാക്കാത്തതുപോലെ മലയാളവും വ്യക്തമാക്കുന്നില്ല.
- source_word: ζητεῖτε, καὶ εὑρήσετε
  choice: അന്വേഷിക്കൂ, നിങ്ങൾ കണ്ടെത്തും
  rationale: ആത്മാർഥമായ തിരച്ചിലിനെയും രൂപകാർഥത്തെയും ഉൾക്കൊള്ളുന്ന ζητέωയ്ക്ക് ‘അന്വേഷിക്കൂ’ യോജിക്കുന്നു; ഭാവികാല സജീവരൂപമായ εὑρήσετε ‘നിങ്ങൾ കണ്ടെത്തും’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: κρούετε
  choice: മുട്ടൂ
  rationale: വാതിലിൽ മുട്ടുന്നതിനെ സൂചിപ്പിക്കുന്ന κρούωയുടെ രൂപകം, മലയാളത്തിൽ സ്വാഭാവികമായ ‘മുട്ടൂ’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: നിങ്ങൾക്കായി തുറക്കപ്പെടും
  rationale: ഗ്രീക്കിൽ തുറക്കപ്പെടുന്ന വസ്തു വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ ‘വാതിൽ’ എന്ന് മുഖ്യപാഠത്തിൽ ചേർക്കാതെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു. ὑμῖν ഇവിടെ പ്രയോജനാർഥമായി സ്വാഭാവിക മലയാളത്തിൽ ‘നിങ്ങൾക്കായി’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: αἰτεῖτε, ζητεῖτε, κρούετε എന്നീ വർത്തമാനകാല ആജ്ഞാരൂപങ്ങളുടെ പ്രവർത്തനഭാവം
  choice: മുഖ്യപാഠത്തിൽ ‘ചോദിക്കൂ, അന്വേഷിക്കൂ, മുട്ടൂ’ എന്ന ലളിത ആജ്ഞാരൂപങ്ങൾ
  alternative: ‘ചോദിച്ചുകൊണ്ടിരിക്കൂ, അന്വേഷിച്ചുകൊണ്ടിരിക്കൂ, മുട്ടിക്കൊണ്ടിരിക്കൂ’
  rationale: ഗ്രീക്ക് വർത്തമാനകാല ആജ്ഞാരൂപങ്ങൾക്ക് തുടർച്ചയോ ആവർത്തനമോ സൂചിപ്പിക്കാനാകുമെങ്കിലും അത് ഓരോ സാഹചര്യത്തിലും നിർബന്ധമല്ല. മുഖ്യപാഠം ഈ അനിശ്ചിതത്വം അതിവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു; സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: കർമണിപ്രയോഗങ്ങളിലെ പ്രവർത്തകൻ
  choice: ‘നൽകപ്പെടും’, ‘തുറക്കപ്പെടും’ എന്ന കർമണിരൂപങ്ങൾ നിലനിർത്തി
  alternative: ‘ദൈവം നിങ്ങൾക്കു നൽകും’, ‘ദൈവം നിങ്ങൾക്കായി തുറക്കും’
  rationale: സന്ദർഭത്തിൽ ദൈവം പ്രവർത്തകനാണെന്ന് മനസ്സിലാക്കാമെങ്കിലും ഗ്രീക്ക് വാക്യം പ്രവർത്തകനെ നേരിട്ട് പേരെടുത്തുപറയുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായി ന്യായമായ അനുമാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂന്ന് ആജ്ഞകളും മൂന്ന് വാഗ്ദാനങ്ങളും തമ്മിലുള്ള സമാന്തരഘടനയും ഗ്രീക്കിലെ വ്യക്തമാക്കാത്ത കർമണിപ്രയോഗവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട മൂന്ന് ആജ്ഞകൾക്കു ശേഷമുള്ള വാക്യാവസാനത്തിൽ ചേർത്തു.
