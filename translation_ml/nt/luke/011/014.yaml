id: LUK.11.14
reference: Luke 11:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: ml
  text: അവൻ സംസാരിക്കാൻ കഴിയാത്ത[a] ഒരു ഭൂതത്തെ പുറത്താക്കുകയായിരുന്നു. ഭൂതം പുറത്തുപോയപ്പോൾ, സംസാരിക്കാൻ കഴിയാതിരുന്ന ആ മനുഷ്യൻ സംസാരിച്ചു; ജനക്കൂട്ടങ്ങൾ അത്ഭുതപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് വിശേഷണത്തിന് ‘ബധിരൻ’ എന്നും ‘സംസാരിക്കാൻ കഴിയാത്തവൻ’ എന്നും അർഥമാകാം. എന്നാൽ ഭൂതം പുറത്തുപോയശേഷം ആ മനുഷ്യൻ സംസാരിച്ചതിനാൽ ഇവിടെ ‘സംസാരിക്കാൻ കഴിയാത്ത’ എന്ന അർഥമാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: പുറത്താക്കിക്കൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: ἦν എന്ന അപൂർണഭൂതകാല ക്രിയയും വർത്തമാനകാല കൃദന്തമായ ἐκβάλλων-ഉം ചേർന്ന പ്രയോഗം ഭൂതകാലത്തിൽ നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ തുടർച്ചാസൂചക രൂപം അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δαιμόνιον
  choice: ഭൂതം
  rationale: δαιμόνιον ദുഷ്ടമായ അതിമാനുഷിക ആത്മസത്തയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ 'ഭൂതം' സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായ മലയാള പദമാണ്; മൂലത്തിൽ ഇല്ലാത്ത 'അശുദ്ധാത്മാവ്' എന്ന പദപ്രയോഗം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: κωφόν
  choice: സംസാരിക്കാൻ കഴിയാത്ത
  rationale: κωφός എന്ന പദത്തിന് ബധിരൻ എന്നും സംസാരിക്കാൻ കഴിയാത്തവൻ എന്നും അർഥമാകാം. ഭൂതം പുറത്തുപോയശേഷം ആ മനുഷ്യൻ സംസാരിച്ചതായി സന്ദർഭം പറയുന്നതിനാൽ ഇവിടെ സംസാരശേഷിയില്ലായ്മയാണ് മുൻനിരയിൽ. വ്യക്തിയെ അപമാനിക്കുന്നതായി തോന്നാവുന്ന പഴയ ലേബൽ ഒഴിവാക്കി വിവരണാത്മകമായ ആധുനിക ഭാഷ ഉപയോഗിച്ചു.
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: ഭൂതം പുറത്തുപോയപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഭൂതം പുറത്തുപോയത് മനുഷ്യൻ സംസാരിക്കുന്നതിന് മുമ്പ് സംഭവിച്ചതായി വ്യക്തമാക്കുന്നു. ἐγένετο δέ ഇവിടെ ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കമാണ്; മലയാളത്തിൽ പ്രത്യേകമായി 'സംഭവിച്ചു' എന്നു ചേർക്കാതെ സമയബന്ധം സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: ἐλάλησεν
  choice: സംസാരിച്ചു
  rationale: λαλέω എന്നതിന്റെ നേരായ അർഥം 'സംസാരിക്കുക' എന്നാണ്. 'സംസാരിക്കാൻ തുടങ്ങി' എന്നു ചേർക്കുന്നത് മൂലത്തിൽ വ്യക്തമായി പറയാത്ത ആരംഭഭാവം ഇറക്കുമതി ചെയ്യും.
- source_word: ὁ κωφός
  choice: സംസാരിക്കാൻ കഴിയാതിരുന്ന ആ മനുഷ്യൻ
  rationale: വിശേഷണം നാമവൽക്കരിച്ച് ബാധിതനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യക്തതയ്ക്കും സ്വാഭാവികതയ്ക്കുമായി 'ആ മനുഷ്യൻ' ചേർത്തു; മുമ്പുണ്ടായിരുന്ന അവസ്ഥയെ 'കഴിയാതിരുന്ന' എന്ന രൂപം വ്യക്തമാക്കുന്നു.
- source_word: ἐθαύμασαν
  choice: അത്ഭുതപ്പെട്ടു
  rationale: ἐθαύμασαν ആശ്ചര്യവും വിസ്മയവും സൂചിപ്പിക്കുന്നു. 'അത്ഭുതപ്പെട്ടു' ആഖ്യാനശൈലിക്ക് യോജിക്കുന്ന, സാധാരണ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: οἱ ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: മൂലത്തിലെ ബഹുവചനം നിലനിർത്താൻ 'ജനക്കൂട്ടങ്ങൾ' എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: ബാധയുടെ സ്വഭാവവും ഭൂതോച്ചാടനഭാഷയും
  choice: യേശു യഥാർത്ഥമായ ഒരു ഭൂതത്തെ പുറത്താക്കുകയും അതിന്റെ പുറപ്പെടലിനു പിന്നാലെ മനുഷ്യന്റെ സംസാരശേഷി പ്രകടമാകുകയും ചെയ്തതായി പാഠം നേരിട്ട് അവതരിപ്പിക്കുന്നു.
  alternative: അതിമാനുഷിക അവകാശവാദം മൃദൂകരിച്ച് രോഗലക്ഷണങ്ങളുടെ വിവരണമായി മാത്രം അവതരിപ്പിക്കുക, അല്ലെങ്കിൽ മൂലത്തിലെ δαιμόνιον എന്നതിനുപകരം പൊതുവായ മറ്റൊരു പദം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം δαιμόνιον എന്നു വ്യക്തമായി പറയുകയും അതിന്റെ പുറപ്പെടലിനുശേഷം മനുഷ്യൻ സംസാരിച്ചതായി വിവരിക്കുകയും ചെയ്യുന്നു. വിവർത്തനം ഈ അവകാശവാദത്തെ കുറയ്ക്കാതെയും വിശദീകരണങ്ങൾ കൂട്ടിച്ചേർക്കാതെയും നിലനിർത്തണം.
- issue: κωφός എന്ന പദത്തിലെ അർഥവ്യാപ്തി
  choice: പ്രധാന പാഠത്തിൽ സന്ദർഭാനുസൃതമായി 'സംസാരിക്കാൻ കഴിയാത്ത' എന്നു നൽകി, 'ബധിരൻ' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
  alternative: പ്രധാന പാഠത്തിൽ 'ബധിരൻ' എന്നു നൽകുക, അല്ലെങ്കിൽ രണ്ട് അർഥങ്ങളും ചേർത്ത് 'ബധിരനും മൂകനുമായ' എന്നു പറയുക.
  rationale: തുടർന്ന് ആ മനുഷ്യൻ സംസാരിച്ചതാണ് പാഠം പ്രത്യേകം രേഖപ്പെടുത്തുന്നത്; അതിനാൽ സംസാരശേഷിയില്ലായ്മയാണ് മികച്ച സന്ദർഭാർഥം. എന്നാൽ ഗ്രീക്ക് പദത്തിന്റെ യഥാർത്ഥ ദ്വയാർഥസാധ്യത മറയ്ക്കരുത്. രണ്ട് വൈകല്യങ്ങളും ഉണ്ടായിരുന്നു എന്നു പറയുന്നത് പാഠം ഉറപ്പിക്കാത്ത കാര്യം ചേർക്കുന്നതായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. തുടർച്ചയായ ഭൂതകാലപ്രവൃത്തി വ്യാകരണപരമായി നിലനിർത്തി. κωφός-നെ വ്യക്തിയെ ലേബൽ ചെയ്യുന്ന പഴയ പദംകൊണ്ടല്ല, വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി. അടിക്കുറിപ്പിന്റെ അടയാളം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
