  terminology: ‘ഭൂതം’ is a direct, established rendering for δαιμόνιον in this context. ‘സംസാരിക്കാൻ കഴിയാത്ത’ is respectful modern language and fits the context. ‘ജനക്കൂട്ടങ്ങൾ’ correctly retains the Greek plural.
