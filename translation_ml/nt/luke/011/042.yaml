id: LUK.11.42
reference: Luke 11:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: ml
  text: എന്നാൽ പരീശന്മാരായ നിങ്ങൾക്കു അയ്യോ, കഷ്ടം! നിങ്ങൾ പുതിനയുടെയും അരൂതയുടെയും എല്ലാ പച്ചക്കറികളുടെയും ദശാംശം നൽകുന്നു; എന്നാൽ നീതിയെയും ദൈവസ്നേഹത്തെയും അവഗണിക്കുന്നു.[a] ഇവ ചെയ്യേണ്ടതായിരുന്നു; അവയും ചെയ്യാതെ വിടരുതായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൈവസ്നേഹം” എന്നത് ദൈവത്തോടുള്ള സ്നേഹത്തെയോ ദൈവത്തിൽനിന്നുള്ള സ്നേഹത്തെയോ സൂചിപ്പിക്കാം.
    reason: τοῦ θεοῦ എന്ന ജനിറ്റീവിലെ യഥാർഥ അർത്ഥാവ്യക്തത വായനക്കാരനെ അറിയിക്കുന്നു.
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: നിങ്ങൾക്ക് അയ്യോ കഷ്ടം!
  rationale: പ്രവാചകശൈലിയിലുള്ള ദുഃഖപ്രഖ്യാപനവും മുന്നറിയിപ്പും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀποδεκατοῦτε
  choice: ദശാംശം കൊടുക്കുന്നു
  rationale: വിളവിന്റെ പത്തിലൊന്ന് നൽകുന്ന മതാചാരത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന പ്രചാരത്തിലുള്ള പദപ്രയോഗം.
- source_word: ἡδύοσμον
  choice: പുതിന
  rationale: സസ്യനാമമായ mint എന്ന അർത്ഥത്തിന് ആധുനിക മലയാളത്തിലെ പരിചിതമായ പേര്.
- source_word: πήγανον
  choice: അരൂത
  rationale: rue സസ്യത്തിനുള്ള മലയാള സസ്യനാമം; അപരിചിതത്വം പരിഹരിക്കാൻ അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു.
- source_word: πᾶν λάχανον
  choice: എല്ലാ ഇനം പച്ചച്ചെടികൾ
  rationale: സന്ദർഭത്തിൽ ഭക്ഷ്യയോഗ്യമായോ തോട്ടത്തിൽ വളർത്തുന്നതോ ആയ വിവിധ ചെറുചെടികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; 'എല്ലാ പച്ചക്കറിയും' എന്ന അത്യന്തം ആധുനിക വർഗീകരണം ഒഴിവാക്കുന്നു.
- source_word: παρέρχεσθε
  choice: കടന്നുപോകുന്നു
  rationale: മൂലപദത്തിലെ 'അരികിലൂടെ കടന്നുപോകുക/ഒഴിവാക്കുക' എന്ന രൂപകം സംരക്ഷിക്കുകയും ഇംഗ്ലീഷ് ഓഡിറ്റ് പാളിയിലെ 'pass by' എന്ന തിരഞ്ഞെടുപ്പിനോട് പൊരുത്തപ്പെടുകയും ചെയ്യുന്നു.
- source_word: κρίσιν
  choice: നീതി
  rationale: ഇവിടെ ന്യായവിധി നടത്തൽക്കാൾ നീതിപൂർവമായ പെരുമാറ്റം എന്ന ധാർമ്മിക അർത്ഥമാണ് സന്ദർഭോചിതം.
- source_word: ἀγάπην τοῦ θεοῦ
  choice: ദൈവസ്നേഹം
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് ദൈവത്തോടുള്ള സ്നേഹമോ ദൈവത്തിൽനിന്നുള്ള സ്നേഹമോ എന്ന ആശയബന്ധം വ്യാകരണപരമായി തുറന്നുവയ്ക്കുന്നു.
- source_word: παρεῖναι
  choice: അവഗണിക്കരുതായിരുന്നു
  rationale: ചെയ്യാതെ വിടുക/ഉപേക്ഷിക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: τὴν ἀγάπην τοῦ θεοῦ എന്ന ജനിറ്റീവിന്റെ ദിശ
  choice: ദൈവസ്നേഹം
  alternative: ദൈവത്തോടുള്ള സ്നേഹം
  rationale: മൂലവാക്യത്തിൽ സ്നേഹത്തിന്റെ ദിശ വ്യക്തമായി നിർണ്ണയിച്ചിട്ടില്ല; സംയുക്തരൂപം ആ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
- issue: ചെറിയ ആചാരങ്ങളും പ്രധാന ധാർമ്മിക കടമകളും തമ്മിലുള്ള ബന്ധം
  choice: ഇവ ചെയ്യേണ്ടതായിരുന്നു; അവയും അവഗണിക്കരുതായിരുന്നു
  alternative: നീതി മാത്രം നിർവഹിക്കേണ്ടതായിരുന്നു
  rationale: യേശുവിന്റെ വാക്കുകൾ നീതിയെയും ദൈവസ്നേഹത്തെയും മുൻനിർത്തുമ്പോഴും മുമ്പ് പറഞ്ഞ ദശാംശാചാരത്തെ പൂർണമായി തള്ളുന്നില്ല; ταῦτα/κἀκεῖνα എന്ന വിരുദ്ധസൂചന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രവാചകശൈലിയിലെ ശക്തി നിലനിർത്തിയെങ്കിലും കൃത്രിമമായ പുരാതനഭാഷ ഒഴിവാക്കി. മൂലത്തിലെ സമാന്തരഘടനയും കടന്നുപോകുന്നു എന്ന രൂപകവും സംരക്ഷിച്ചു.
