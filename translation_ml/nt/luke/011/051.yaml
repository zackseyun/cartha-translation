id: LUK.11.51
reference: Luke 11:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: ml
  text: 'ഹാബേലിന്റെ രക്തം മുതൽ യാഗപീഠത്തിനും ആലയത്തിനും ഇടയിൽ[b] മരണമടഞ്ഞ സെഖര്യാവിന്റെ[a] രക്തം വരെ. അതെ, ഞാൻ നിങ്ങളോടു പറയുന്നു: അതിന് ഈ തലമുറയിൽനിന്ന് കണക്കു ചോദിക്കപ്പെടും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ പറയുന്ന സെഖര്യാവ് ആരെന്ന കാര്യത്തിൽ അഭിപ്രായഭേദമുണ്ട്. യഹോയാദയുടെ മകനായ സെഖര്യാവ് (2 ദിനവൃത്താന്തം 24:20–22), ബെരെഖ്യാവിന്റെ മകനായ സെഖര്യാവ് എന്നിവരാണ് നിർദേശിക്കപ്പെടുന്ന സാധ്യതകൾ.
    reason: cross_reference
  - marker: b
    text: ‘യാഗപീഠത്തിനും ആലയത്തിനും ഇടയിൽ’—ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘യാഗപീഠത്തിനും വീടിനും ഇടയിൽ’; ഇവിടെ ‘വീട്’ ദൈവാലയമന്ദിരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ … ἕως αἵματος Ζαχαρίου
  choice: ഹാബേലിന്റെ രക്തംമുതൽ … സെഖര്യാവിന്റെ രക്തംവരെ
  rationale: ἀπό … ἕως എന്ന വ്യാപ്തിസൂചക ഘടനയും ‘രക്തം’ എന്ന ബൈബിൾപ്രയോഗവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ ἀπολομένου
  choice: മരണമടഞ്ഞ
  rationale: ἀπόλλυμι എന്ന പദം ഇവിടെ ഹിംസാത്മകമരണം സൂചിപ്പിക്കുന്നുവെങ്കിലും, കർത്താവിനെ ഗ്രീക്ക് വ്യക്തമായി പറയാത്തതിനാൽ ‘കൊല്ലപ്പെട്ട’ എന്ന് മുഖ്യവാചകത്തിൽ അധികമായി വ്യക്തമാക്കാതെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: യാഗപീഠത്തിനും ആലയത്തിനും ഇടയിൽ
  rationale: ക്ഷേത്രസന്ദർഭത്തിൽ οἶκος ദൈവാലയമന്ദിരത്തെ സൂചിപ്പിക്കുന്നു. ‘ആലയം’ ആ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ναί, λέγω ὑμῖν
  choice: അതെ, ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഉറപ്പിച്ചുപറയുന്ന ναί എന്നതും നേരിട്ടുള്ള അഭിസംബോധനയും ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: അതിന് ഈ തലമുറയിൽനിന്ന് കണക്കു ചോദിക്കപ്പെടും
  rationale: ദൈവിക ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന കർത്തൃരഹിത കർമണിപ്രയോഗവും ἀπόയുടെ ‘യിൽനിന്ന്’ എന്ന ആശയവും സംരക്ഷിക്കുന്നു. ‘കണക്കു ചോദിക്കുക’ രക്തച്ചൊരിച്ചിലിനുള്ള ഉത്തരവാദിത്വം ആവശ്യപ്പെടുന്ന ന്യായവിധിസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സെഖര്യാവിന്റെ തിരിച്ചറിയൽ
  choice: മുഖ്യവാചകത്തിൽ ‘സെഖര്യാവ്’ എന്നു മാത്രം നിലനിർത്തി, വ്യക്തിയുടെ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
  alternative: യഹോയാദയുടെ മകനായ സെഖര്യാവ്; ബെരെഖ്യാവിന്റെ മകനായ സെഖര്യാവ്; പ്രവാചക രക്തസാക്ഷികളുടെ പ്രതിനിധിയായ വ്യക്തി
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം സെഖര്യാവിനെ കൂടുതൽ തിരിച്ചറിയിക്കുന്നില്ല; അതിനാൽ തർക്കവിധേയമായ തിരിച്ചറിയൽ പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- issue: ‘ഈ തലമുറ’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: യേശു അഭിസംബോധന ചെയ്ത ‘ഈ തലമുറ’ എന്ന പ്രയോഗം അതേപടി നിലനിർത്തുന്നു.
  alternative: പിന്നീടുള്ള ഏതെങ്കിലും പ്രത്യേക ജനവിഭാഗത്തിലേക്കോ എല്ലാ കാലങ്ങളിലേക്കോ പ്രയോഗം വികസിപ്പിക്കുകയോ ചുരുക്കുകയോ ചെയ്യുക
  rationale: γενεὰ αὕτη എന്ന പാഠത്തിന്റെ നേരിട്ടുള്ള സൂചന സംരക്ഷിക്കുകയും ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യവസ്ഥ മുഖേന അതിന്റെ പരിധി മുൻകൂട്ടി നിശ്ചയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ഭാഗമായതിനാൽ ആരംഭത്തിലെ ഖണ്ഡവാക്യസ്വഭാവം നിലനിർത്തിയിരിക്കുന്നു; ദൈവിക ന്യായവിധിയുടെ കർത്താവിനെ പാഠം വ്യക്തമാക്കാത്തതിനാൽ കർമണിപ്രയോഗം ഉപയോഗിച്ചു.
