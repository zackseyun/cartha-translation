  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δίδου ἡμῖν τὸ καθ’ ἡμέραν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/003.yaml
  text: Give us each day our daily bread[a].
translation:
  language: ml
  text: ഞങ്ങളുടെ അന്നന്നത്തേക്കുള്ള അപ്പം ഓരോ ദിവസവും ഞങ്ങൾക്കു തരണമേ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “വരാനിരിക്കുന്ന ദിവസത്തേക്കുള്ള അപ്പം” അല്ലെങ്കിൽ “ജീവിതത്തിനാവശ്യമായ അപ്പം”; ഇവിടെ സാധ്യത കുറവാണെങ്കിലും, “അതിഭൗതികമായ അപ്പം” എന്നും വ്യാഖ്യാനിക്കപ്പെട്ടിട്ടുണ്ട്. ഇതിനു പിന്നിലെ ഗ്രീക്ക് വിശേഷണം അത്യപൂർവവും അർഥവിവാദമുള്ളതുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: അപ്പം
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘അപ്പം’ എന്നാണ്; പ്രാർഥനയുടെ സന്ദർഭത്തിൽ അത് അടിസ്ഥാന ഉപജീവനത്തെയും സൂചിപ്പിക്കാം. ‘ഭക്ഷണം’ എന്ന് പൊതുവാക്കാതെ മൂലപദത്തിന്റെ ദൃശ്യവും പരമ്പരാഗതവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἡμῶν
  choice: ഞങ്ങൾക്ക് ആവശ്യമായ
  rationale: ഗ്രീക്കിൽ ഇത് ‘ഞങ്ങളുടെ’ എന്ന ഉടമസ്ഥരൂപമാണ്. എന്നാൽ ‘ഞങ്ങളുടെ ആവശ്യമായ അപ്പം’ എന്നത് മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, അർഥബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ἐπιούσιον-നോടൊപ്പം ചേർത്ത് വിവർത്തനം ചെയ്തു.
- source_word: ἐπιούσιον
  choice: ആവശ്യമായ
  rationale: ഈ അത്യപൂർവ വിശേഷണത്തിന്റെ അർഥം തർക്കവിധേയമാണ്. ‘ആവശ്യമായ’ എന്നത് ഉപജീവനത്തിനുവേണ്ട അപ്പം എന്ന സാധ്യത നിലനിർത്തുകയും, τὸ καθ’ ἡμέραν പ്രത്യേകം ‘ഓരോ ദിവസവും’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു. മറ്റു പ്രധാന സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: δίδου
  choice: തരണമേ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം തുടർച്ചയായോ പതിവായോ ഉള്ള നൽകലിനെ സൂചിപ്പിക്കാം. വിനയപൂർവമായ മലയാള പ്രാർഥനാശൈലിയിൽ ‘തരണമേ’ സ്വാഭാവികമാണ്; ആവർത്തനഭാവം ‘ഓരോ ദിവസവും’ വ്യക്തമാക്കുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങൾക്ക്
  rationale: ആജ്ഞാക്രിയയുടെ പരോക്ഷ കർമം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: τὸ καθ’ ἡμέραν
  choice: ഓരോ ദിവസവും
  rationale: ദിവസംതോറുമുള്ള ആവർത്തിതമായ ലഭ്യതയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ലൂക്കോസിന്റെ നിരന്തര ആശ്രയത്വ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: കർത്താവിന്റെ പ്രാർഥനയിലെ ἐπιούσιον എന്ന പദത്തിന്റെ അർഥം
  choice: ആവശ്യമായ
  alternative: ‘അന്നന്നത്തേക്കുള്ള,’ ‘വരാനിരിക്കുന്ന ദിവസത്തേക്കുള്ള,’ അല്ലെങ്കിൽ ‘അതിഭൗതികമായ’
  rationale: പദത്തിന്റെ അർഥം ഉറപ്പില്ലാത്തതാണ്. ലൂക്കോസിലെ τὸ καθ’ ἡμέραν ദിവസേനയുള്ള സാധാരണ ഉപജീവനത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്. പ്രധാനപാഠത്തിൽ ഒരു സാക്രാമെന്റൽ അഥവാ തത്ത്വമീമാംസാപരമായ വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ, യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രാർഥനാശൈലി. ‘തരണമേ’ എന്ന രൂപം വിനയപൂർവമായ അഭ്യർഥനാഭാവം നൽകുന്നു. ‘അപ്പം’ എന്ന പരമ്പരാഗതവും കൃത്യവുമായ പദം നിലനിർത്തി; പ്രധാനവാക്യത്തിലെ ഇരട്ട ‘ദിവസ’ ആവർത്തനം ഒഴിവാക്കി.
