source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: ml
  text: 'എന്നാൽ അദ്ദേഹം പറഞ്ഞു: “അതിലുപരി[a], ദൈവത്തിന്റെ വചനം കേൾക്കുകയും അത് പാലിക്കുകയും ചെയ്യുന്നവരാണ് അനുഗൃഹീതർ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തീർച്ചയായും” അല്ലെങ്കിൽ “അതെ, അതിലുപരി.” ഗ്രീക്ക് കണിക മുൻവാക്കിനെ സ്ഥിരീകരിച്ചുകൊണ്ടുതന്നെ ഊന്നൽ ദൈവത്തിന്റെ വചനം കേൾക്കുകയും പാലിക്കുകയും ചെയ്യുന്നവരിലേക്കു തിരിച്ചുവിടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: അല്ല, മറിച്ച്
  rationale: മുൻപത്തെ പ്രസ്താവനയെ കടുത്ത നിഷേധമായി തള്ളാതെ, അനുഗ്രഹത്തിന്റെ യഥാർഥ അടിസ്ഥാനം ചൂണ്ടിക്കാട്ടുന്ന തിരുത്തലും ഊന്നലും പ്രകടമാക്കുന്നു. ഗ്രീക്ക് കണികയ്ക്ക് സമ്മതിച്ചുകൊണ്ട് ഊന്നൽ തിരിച്ചുവിടുന്ന അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: കേവലമായ മാനസിക സന്തോഷമോ ഭാഗ്യമോ അല്ല, ദൈവാനുഗ്രഹവുമായി ബന്ധപ്പെട്ട വചനത്തിന്റെ താത്പര്യം നിലനിർത്തുന്നു.
- source_word: οἱ ἀκούοντες
  choice: കേട്ട്
  rationale: തുടർന്നുള്ള φυλάσσοντες എന്ന ക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിച്ച്, ദൈവവചനം കേൾക്കുന്നവരുടെ സ്വഭാവസവിശേഷത സൂചിപ്പിക്കുന്നു.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: λόγος എന്നതിന്റെ സന്ദേശം/വെളിപ്പാട് എന്ന വ്യാപ്തിയും ബൈബിൾഭാഷയിലെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: φυλάσσοντες
  choice: കാത്തുപാലിക്കുന്നവർ
  rationale: വചനം സംരക്ഷിച്ചു സൂക്ഷിക്കുന്നതും അനുസരണത്തിൽ പ്രാവർത്തികമാക്കുന്നതും ഉൾക്കൊള്ളുന്ന φυλάσσωയുടെ വിശാലമായ അർഥം നൽകുന്നു; ‘അനുസരിക്കുന്നവർ’ എന്നത് അർഥത്തെ അനുസരണത്തിലേക്ക് മാത്രം ചുരുക്കാം.
- source_word: αὐτὸς δὲ εἶπεν
  choice: എന്നാൽ അദ്ദേഹം പറഞ്ഞു
  rationale: δὲയുടെ മൃദുവായ വിരുദ്ധ/പരിവർത്തന സ്വഭാവം ‘എന്നാൽ’കൊണ്ട് പ്രകടമാക്കുകയും εἶπεν എന്നത് വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ ‘പറഞ്ഞു’ എന്നു നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സ്ത്രീ പറഞ്ഞ അനുഗ്രഹവചനത്തോടുള്ള യേശുവിന്റെ പ്രതികരണത്തിന്റെ ശക്തി
  choice: മുൻപ്രസ്താവനയെ പൂർണമായി നിഷേധിക്കാതെ, ദൈവവചനം കേട്ട് കാത്തുപാലിക്കുന്നതിലേക്കു യഥാർഥ അനുഗ്രഹത്തിന്റെ ഊന്നൽ തിരിച്ചുവിടുന്നു.
  alternative: സ്ത്രീയുടെ വാക്കുകളെ യേശു പൂർണമായി നിരസിക്കുന്നു; അല്ലെങ്കിൽ യാതൊരു തിരുത്തലുമില്ലാതെ മറ്റൊരു അനുഗ്രഹം മാത്രം കൂട്ടിച്ചേർക്കുന്നു.
  rationale: Μενοῦν എന്ന കണികയ്ക്ക് തിരുത്തലും സ്ഥിരീകരണവും കലർന്ന ശക്തിയുണ്ട്. മുഖ്യപാഠത്തിലെ ‘അല്ല, മറിച്ച്’ തിരിച്ചുവിടൽ വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് സ്ഥിരീകരണാത്മക സാധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അദ്ദേഹം’ ഗൗരവമുള്ള സർവനാമമായി ഉപയോഗിച്ചു; ‘കാത്തുപാലിക്കുക’ എന്നത് കേവല സംരക്ഷണവും പ്രായോഗിക അനുസരണവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
