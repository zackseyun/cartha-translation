id: LUK.11.21
reference: Luke 11:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: ml
  text: പൂർണമായി ആയുധമണിഞ്ഞ ശക്തനായ ഒരാൾ തന്റെ സ്വന്തം മുറ്റം[a] കാവൽക്കാക്കുമ്പോൾ, അവന്റെ സ്വത്തുക്കൾ സുരക്ഷിതമായിരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വാസസ്ഥലം’ അല്ലെങ്കിൽ ‘വാസസ്ഥലപരിസരം’; ഗ്രീക്ക് പദം ഒരു മുറ്റത്തെയോ അതിനോടു ചേർന്നുള്ള വസതിയെയോ പരിസരത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘സമാധാനത്തിലായിരിക്കും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: കാവൽക്കാക്കുമ്പോൾ
  rationale: ὅταν പൊതുവായ ഒരു കാലിക-സോപാധിക സാഹചര്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ുമ്പോൾ’ പ്രയോഗം ഈ ഉദാഹരണത്തിന്റെ സ്വാഭാവികത നിലനിർത്തുന്നു.
- source_word: ὁ ἰσχυρός
  choice: ശക്തനായ ഒരാൾ
  rationale: ആർട്ടിക്കിളോടുകൂടി നാമമായി പ്രയോഗിച്ചിരിക്കുന്ന വിശേഷണം ശക്തനായ പുരുഷനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും പൊതുവായ ഉദാഹരണത്തിന് യോജിച്ചതുമായ രൂപമാണിത്.
- source_word: καθωπλισμένος
  choice: പൂർണമായി ആയുധമണിഞ്ഞ
  rationale: പൂർണമായി ആയുധസജ്ജനായിരിക്കുന്ന നിലവിലെ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന perfect participle-ന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: φυλάσσῃ
  choice: കാവൽക്കാക്കുമ്പോൾ
  rationale: തുടർച്ചയായ ജാഗ്രതയോടെയുള്ള സംരക്ഷണമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; ‘കാവൽക്കാക്കുക’ അതിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: തന്റെ സ്വന്തം മുറ്റം
  rationale: αὐλήയുടെ പ്രാഥമിക അർഥമായ മുറ്റം സ്വീകരിക്കുന്നു; ἑαυτοῦ നൽകുന്ന ഊന്നൽ ‘തന്റെ സ്വന്തം’ എന്നതിലൂടെ നിലനിർത്തുന്നു. പദത്തിന് വിശാലമായ വാസസ്ഥലപരിസരം എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἐν εἰρήνῃ
  choice: സുരക്ഷിതമായിരിക്കും
  rationale: അക്ഷരാർഥത്തിൽ ‘സമാധാനത്തിൽ’ എന്നാണെങ്കിലും, സ്വത്തുക്കൾ അലട്ടപ്പെടാതെയും അപകടമില്ലാതെയും ഇരിക്കുന്ന അവസ്ഥയാണ് സന്ദർഭത്തിലെ പ്രയോഗാർഥം. സ്വാഭാവിക മലയാളത്തിനായി ‘സുരക്ഷിതം’ ഉപയോഗിച്ച് അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: അവന്റെ സ്വത്തുക്കൾ
  rationale: അവനുള്ള വസ്തുക്കളെയും ഉടമസ്ഥതയിലുള്ള സമ്പത്തിനെയും പൊതുവായി ഉൾക്കൊള്ളുന്ന വ്യക്തമായ ആധുനിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: സന്ദർഭത്തിലെ രൂപകത്തിന്റെ സൂചന
  choice: വാക്യത്തിലെ ശക്തനായ ആളിന്റെ ദൃശ്യരൂപം അതേപടി നിലനിർത്തി; അവനെ സാത്താനായി മുഖ്യപാഠത്തിൽ തിരിച്ചറിയുന്നില്ല.
  alternative: ‘ശക്തനായ ഒരാൾ’ എന്നതിനു പകരം ‘സാത്താൻ’ എന്ന് വ്യാഖ്യാനിച്ച് എഴുതുക.
  rationale: ഈ വാക്യം രൂപകം അവതരിപ്പിക്കുന്നു; അതിന്റെ സൂചിത വ്യക്തിയെ ചുറ്റുപാടുള്ള വാക്യങ്ങളാണ് വ്യക്തമാക്കുന്നത്. വിവർത്തനം രൂപകത്തെ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘പൂർണമായി ആയുധമണിഞ്ഞ’ എന്നത് ദൃശ്യരൂപം വ്യക്തമായി നിലനിർത്തുന്നു; ‘സുരക്ഷിതമായിരിക്കും’ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
