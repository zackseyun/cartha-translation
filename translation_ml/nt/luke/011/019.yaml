source:
  edition: SBLGNT
  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ ബെയെൽസെബൂലിനാൽ ഭൂതങ്ങളെ പുറത്താക്കുന്നുവെങ്കിൽ, നിങ്ങളുടെ പുത്രന്മാർ ആരെക്കൊണ്ടാണ് അവയെ പുറത്താക്കുന്നത്?[a] അതുകൊണ്ട് അവർതന്നെ നിങ്ങളുടെ ന്യായാധിപന്മാരായിരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “എന്തിനാൽ” അഥവാ “ഏതു ശക്തിയാൽ” നിങ്ങളുടെ പുത്രന്മാർ അവയെ പുറത്താക്കുന്നു?
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “അവർ നിങ്ങളുടെ ന്യായാധിപന്മാരായിരിക്കും”; ഗ്രീക്കിലെ “അവർ” എന്ന സർവനാമത്തിന്റെ ഊന്നൽ ഈ രൂപത്തിൽ പ്രത്യേകം പ്രകടമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: എന്നാൽ … എങ്കിൽ
  rationale: δέ ഇവിടെ യേശുവിന്റെ പ്രതിവാദത്തിലെ നേരിയ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; വ്യവസ്ഥാസ്വഭാവമുള്ള εἰ മലയാളത്തിൽ ‘എങ്കിൽ’കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐγὼ
  choice: ഞാൻ … ആണ്
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘ആണ്’ ചേർന്ന ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐν Βεελζεβοὺλ
  choice: ബെയെൽസെബൂലിനെക്കൊണ്ട്
  rationale: ἐν ഇവിടെ വ്യക്തിയെ ഉപാധിയോ പ്രവർത്തകശക്തിയോ ആയി സൂചിപ്പിക്കുന്നു. ‘ശക്തിയാൽ’ എന്നു വിശദീകരിച്ചു ചേർക്കാതെ പേര് ലിപ്യന്തരണം ചെയ്തു.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: ഭൂതങ്ങളെ പുറത്താക്കുന്നു
  rationale: ഭൂതോച്ചാടനസന്ദർഭത്തിൽ ἐκβάλλω എന്നതിന് സ്വാഭാവികമായ ആധുനിക മലയാളം ‘പുറത്താക്കുക’ ആണ്; τὰ δαιμόνια വ്യക്തിപരമായ ദുഷ്ടാത്മാക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭൂതങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: നിങ്ങളുടെ പുത്രന്മാർ
  rationale: υἱοί എന്നതിന്റെ നേരിട്ടുള്ള, ലിംഗസൂചന നിലനിർത്തുന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘ശിഷ്യന്മാർ’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἐν τίνι
  choice: ആരെക്കൊണ്ട്
  rationale: ബെയെൽസെബൂൽ എന്ന വ്യക്തിയോടുള്ള താരതമ്യം പരിഗണിച്ച് പ്രവർത്തകനെ ചോദിക്കുന്ന രൂപം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; ഉപാധിയെയോ ശക്തിയെയോ ചോദിക്കുന്ന വായന കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ἐκβάλλουσιν
  choice: അവയെ പുറത്താക്കുന്നു
  rationale: ആദ്യ ഉപവാക്യത്തിലെ ἐκβάλλω ആവർത്തിക്കുന്നതിനാൽ ഒരേ ക്രിയ നിലനിർത്തി; മുൻപ് പറഞ്ഞ ഭൂതങ്ങളെയാണ് ‘അവയെ’ സൂചിപ്പിക്കുന്നത്.
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻചോദ്യത്തിൽനിന്നുള്ള നിഗമനം ലളിതവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: അവർതന്നെ നിങ്ങളുടെ ന്യായാധിപന്മാരായിരിക്കും
  rationale: αὐτοί എന്ന സർവനാമത്തിന്റെ ഊന്നൽ ‘തന്നെ’കൊണ്ട് സംരക്ഷിച്ചു; κριταί എന്ന ന്യായവിധിസംബന്ധമായ പദത്തിന് ‘ന്യായാധിപന്മാർ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ‘നിങ്ങളുടെ പുത്രന്മാർ’ എന്നതിന്റെ വ്യക്തിത്വം
  choice: ഗ്രീക്കിലെ നേരിട്ടുള്ള പ്രയോഗമായ ‘നിങ്ങളുടെ പുത്രന്മാർ’ നിലനിർത്തി.
  alternative: നിങ്ങളുടെ ശിഷ്യന്മാർ; നിങ്ങളുടെ അനുയായികൾ; നിങ്ങളുടെ സഹയഹൂദർ
  rationale: ഇവർ എതിരാളികളുമായി ബന്ധപ്പെട്ട ഭൂതോച്ചാടകരാകാം; എങ്കിലും ഗ്രീക്ക് വാചകം അവരുടെ കൃത്യമായ ബന്ധം നിർണയിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ തിരിച്ചറിയൽ മുഖ്യവാചകത്തിലേക്ക് കൊണ്ടുവന്നില്ല.
- issue: ἐν τίνι എന്ന ചോദ്യത്തിന്റെ വ്യക്തിപരമോ ഉപാധിപരമോ ആയ അർഥം
  choice: ബെയെൽസെബൂലുമായുള്ള സമാന്തര്യം കണക്കിലെടുത്ത് ‘ആരെക്കൊണ്ട്’ മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു.
  alternative: എന്തിനാൽ; ഏതു ശക്തിയാൽ
  rationale: ഗ്രീക്ക് രൂപത്തിന് വ്യക്തിയെയോ ഉപാധിയെയോ ചോദിക്കാനാകുന്നതിനാൽ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘പുറത്താക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്; ‘ന്യായാധിപന്മാർ’ വാക്യത്തിലെ ന്യായവിധിയുടെ ഗൗരവം നിലനിർത്തുന്നു. ‘പുത്രന്മാർ’ എന്നത് വ്യാഖ്യാനപരമായി ‘ശിഷ്യന്മാർ’ ആക്കാതെ മൂലത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
