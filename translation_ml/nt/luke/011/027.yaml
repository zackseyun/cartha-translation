  terminology: ‘ധന്യ’ appropriately renders μακαρία with biblical register and does not add Marian doctrinal implications. ‘സ്തനങ്ങൾ’ is accurate and suitably direct, though somewhat formal; it is acceptable for the source’s concrete register.
