language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: ml
  text: 'അവൻ ഈ കാര്യങ്ങൾ പറഞ്ഞുകൊണ്ടിരിക്കെ, ഇങ്ങനെ സംഭവിച്ചു: ജനക്കൂട്ടത്തിൽനിന്ന് ഒരു സ്ത്രീ ശബ്ദമുയർത്തി[a] അവനോടു പറഞ്ഞു: “നിന്നെ വഹിച്ച[b] ഉദരവും നീ മുലകുടിച്ച സ്തനങ്ങളും ധന്യങ്ങളാണ്!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു.” ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “ശബ്ദം ഉയർത്തി” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിന്നെ പ്രസവിച്ച.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഗർഭത്തിൽ വഹിക്കുക എന്നും പ്രസവിക്കുക എന്നും ഈ സന്ദർഭത്തിൽ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ഇങ്ങനെ സംഭവിച്ചു
  rationale: ലൂക്കോസിന്റെ സംഭവസൂചകമായ ആഖ്യാനപരിവർത്തനം നിലനിർത്തുന്നു; പഴഞ്ചൻ പ്രയോഗം ഒഴിവാക്കി സ്വാഭാവികമായ ആധുനിക മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: അവൻ ഈ കാര്യങ്ങൾ പറഞ്ഞുകൊണ്ടിരിക്കെ
  rationale: ἐν സഹിതമുള്ള articular infinitive സൂചിപ്പിക്കുന്ന സമകാലികവും തുടരുന്നതുമായ പ്രവൃത്തി പ്രകടമാക്കുന്നു; ταῦτα എന്ന നിർദേശപദവും നിലനിർത്തുന്നു.
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: ഒരു സ്ത്രീ ശബ്ദമുയർത്തി
  rationale: ἐπαίρω φωνήν എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; τις എന്നത് അനിശ്ചിതമായി ‘ഒരു സ്ത്രീ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐκ τοῦ ὄχλου
  choice: ജനക്കൂട്ടത്തിൽനിന്ന്
  rationale: സ്ത്രീ ജനക്കൂട്ടത്തിന്റെ ഭാഗമായിരുന്നുവെന്ന ഉറവിട/സ്ഥാനബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: Μακαρία
  choice: ധന്യം
  rationale: വെറും മാനസിക സന്തോഷമല്ല, ആദരിക്കപ്പെട്ടതും അനുഗൃഹീതവുമായ നിലയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ‘ധന്യം’ ആ അർഥവും വചനത്തിന്റെ ഗൗരവമുള്ള ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἡ κοιλία
  choice: ഉദരം
  rationale: മാതൃത്വസന്ദർഭത്തിൽ ഗർഭം വഹിച്ച ശരീരഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഉദരം’ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; ‘വഹിച്ച’ എന്ന വിശേഷണം അതിന്റെ ഗർഭാശയസംബന്ധിയായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἡ βαστάσασά σε
  choice: നിന്നെ വഹിച്ച
  rationale: βαστάζω എന്ന ക്രിയയുടെ ‘വഹിക്കുക/ചുമക്കുക’ എന്ന അടിസ്ഥാനചിത്രം നിലനിർത്തുകയും ഇവിടെ ഗർഭധാരണവും പ്രസവവും ഉൾക്കൊള്ളുന്ന മാതൃത്വസന്ദർഭം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: നീ മുലകുടിച്ച സ്തനങ്ങൾ
  rationale: ഗ്രീക്കിലെ ദൃശ്യമായ മാതൃത്വഭാഷ മറച്ചുവയ്ക്കാതെ, ശിശുവായ യേശു അവയിൽനിന്ന് മുലകുടിച്ചു എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ അമ്മയെ ആദരിക്കുന്ന പ്രസ്താവനയിലെ Μακαρία എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നിന്നെ വഹിച്ച ഉദരവും നീ മുലകുടിച്ച സ്തനങ്ങളും ധന്യം!
  alternative: ‘ഭാഗ്യമുള്ളവ’ അല്ലെങ്കിൽ ‘അനുഗൃഹീതം’
  rationale: സ്ത്രീയുടെ വാക്കുകളിലെ മാതൃബഹുമാനം കുറയ്ക്കാതെയും പിൽക്കാല മറിയശാസ്ത്രപരമായ ആശയങ്ങൾ കൂട്ടിച്ചേർക്കാതെയും വാചകത്തിന്റെ ആദരസൂചക ശക്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ധന്യം’ വചനത്തിന്റെ ആശീർവാദാത്മക ഭാവം നിലനിർത്തുന്നു; മാതൃത്വത്തിന്റെ ശരീരസംബന്ധിയായ ദൃശ്യഭാഷ യൂഫെമിസം കൂടാതെ സംരക്ഷിച്ചിരിക്കുന്നു.
