id: LUK.11.46
reference: Luke 11:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു: “നിയമപണ്ഡിതരായ നിങ്ങൾക്കും അയ്യോ കഷ്ടം![a] കാരണം, ചുമക്കാൻ പ്രയാസമുള്ള ഭാരങ്ങൾ നിങ്ങൾ മനുഷ്യരുടെമേൽ ചുമത്തുന്നു; എന്നാൽ നിങ്ങൾതന്നെ നിങ്ങളുടെ ഒരു വിരൽകൊണ്ടുപോലും ആ ഭാരങ്ങൾ തൊടുന്നില്ല.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിയമപണ്ഡിതർ’ എന്നത് യെഹൂദനിയമത്തിൽ പ്രാവീണ്യമുള്ളവരെ സൂചിപ്പിക്കുന്നു; ‘നിയമവിദഗ്ധർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആ ഭാരങ്ങളിൽ ഒരു വിരൽപോലും വയ്ക്കുന്നില്ല.’ മറ്റുള്ളവരുടെമേൽ ചുമത്തുന്ന കാര്യങ്ങളിൽ സഹായിക്കാൻ അവർ യാതൊരു ശ്രമവും ചെയ്യുന്നില്ലെന്നതാണ് ഈ പ്രയോഗത്തിന്റെ ഊന്നൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομικοῖς
  choice: നിയമപണ്ഡിതരായ നിങ്ങൾ
  rationale: ഇവിടെ ഈ പദം ആധുനിക അർഥത്തിലുള്ള അഭിഭാഷകരെയല്ല, യെഹൂദനിയമത്തിൽ പ്രാവീണ്യമുള്ളവരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നിയമപണ്ഡിതർ’ ആ ചരിത്രപരമായ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οὐαί
  choice: അയ്യോ കഷ്ടം!
  rationale: വെറും ദുഃഖപ്രകടനമല്ല, പ്രവാചകശൈലിയിലുള്ള മുന്നറിയിപ്പും വിധിപ്രഖ്യാപനവും ഉൾക്കൊള്ളുന്ന ശക്തി നിലനിർത്തുന്നു.
- source_word: φορτίζετε
  choice: ചുമത്തുന്നു
  rationale: മറ്റുള്ളവരുടെമേൽ ഭാരം കയറ്റിവെക്കുന്ന കാരകപ്രവർത്തനവും മൂലപാഠത്തിലെ സജീവമായ രൂപകവും പ്രകടമാക്കുന്നു.
- source_word: ἀνθρώπους
  choice: മനുഷ്യരുടെമേൽ
  rationale: പദം പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ഉൾക്കൊള്ളുന്ന പൊതുപദം ഉപയോഗിച്ചു.
- source_word: φορτία δυσβάστακτα
  choice: ചുമക്കാൻ പ്രയാസമുള്ള ഭാരങ്ങൾ
  rationale: ഭാരങ്ങൾ പൂർണമായും ചുമക്കാനാവാത്തവയാണെന്ന് അതിശയോക്തി ചെയ്യാതെ, അവ ചുമക്കാൻ ദുഷ്കരമാണെന്ന മൂലാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: αὐτοὶ
  choice: നിങ്ങൾതന്നെ
  rationale: ഭാരം ചുമത്തുന്നവരും അതിനെ തൊടാത്തവരും തമ്മിലുള്ള വിരോധം ഊന്നിപ്പറയുന്ന സർവനാമത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: നിങ്ങളുടെ ഒരു വിരൽകൊണ്ടുപോലും
  rationale: ഏറ്റവും ചെറിയ സഹായംപോലും ചെയ്യുന്നില്ലെന്ന സൂചനയുള്ള ദൃശ്യരൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: προσψαύετε
  choice: തൊടുന്നില്ല
  rationale: ‘സഹായിക്കുന്നില്ല’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ, മൂലപാഠത്തിലെ സ്പർശിക്കുന്നതിന്റെ മൂർത്തമായ രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: Καὶ ὑμῖν
  choice: നിങ്ങൾക്കും
  rationale: മുൻപ് അഭിസംബോധന ചെയ്ത കൂട്ടത്തിനുപുറമേ ഈ കൂട്ടത്തിനും ദുരിതപ്രഖ്യാപനം ബാധകമാണെന്ന കൂട്ടിച്ചേർക്കൽഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: νομικοῖς എന്ന പദം സൂചിപ്പിക്കുന്നവർ
  choice: യെഹൂദനിയമത്തിൽ പ്രാവീണ്യമുള്ള ‘നിയമപണ്ഡിതർ’
  alternative: അഭിഭാഷകർ; നിയമവിദഗ്ധർ; ശാസ്ത്രിമാർ
  rationale: ആധുനിക സിവിൽ അഭിഭാഷകരെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും νομικός എന്ന പദത്തെ ‘ശാസ്ത്രി’ എന്ന വേറൊരു പദവുമായി അനാവശ്യമായി സമീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: അവസാന ഉപവാക്യത്തിന്റെ രൂപകം
  choice: ‘ഒരു വിരൽകൊണ്ടുപോലും ആ ഭാരങ്ങൾ തൊടുന്നില്ല’ എന്ന മൂർത്തമായ രൂപകം നിലനിർത്തി
  alternative: ‘ആ ഭാരങ്ങൾ വഹിക്കാൻ ഒട്ടും സഹായിക്കുന്നില്ല’
  rationale: അവർ മറ്റുള്ളവർക്കു ചുമത്തുന്നതിൽ സഹായം നൽകുന്നില്ലെന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമാണ്; അതിനാൽ വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ ദൃശ്യഭാഷ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വാക്യത്തിലെ ആവർത്തനവും ഭാരം ചുമത്തുക/തൊടുക എന്ന മൂർത്തമായ രൂപകവും സംരക്ഷിച്ചു; ‘അയ്യോ കഷ്ടം’ എന്ന പ്രയോഗം പ്രവാചകശൈലിയിലെ ശക്തമായ ദുരിതപ്രഖ്യാപനമായി ഉപയോഗിച്ചു.
