  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. ‘അയ്യോ കഷ്ടം!’ പ്രവാചകശൈലിയിലെ ശക്തമായ അപലാപ/വിധിപ്രഖ്യാപനമായി ഇവിടെ പ്രവർത്തിക്കുന്നു; ‘നിങ്ങൾതന്നെ’യും ‘ഒരു വിരൽകൊണ്ടുപോലും’യും വിരോധവും ഊന്നലും വ്യക്തമായി നൽകുന്നു.
