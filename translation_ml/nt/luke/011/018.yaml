id: LUK.11.18
reference: Luke 11:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: ml
  text: എന്നാൽ സാത്താനും തനിക്കുതന്നെ എതിരായി ഭിന്നിച്ചാൽ, അവന്റെ രാജ്യം എങ്ങനെ നിലനിൽക്കും? എന്തെന്നാൽ, ഞാൻ ബെയെൽസെബൂലിന്റെ[a] സഹായത്താലാണ് ഭൂതങ്ങളെ പുറത്താക്കുന്നതെന്ന് നിങ്ങൾ പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ബെയെൽസെബൂൽ; ചില ഇംഗ്ലീഷ് ബൈബിൾപരിഭാഷകളിൽ ബെയെൽസെബൂബ് എന്ന രൂപം ഉപയോഗിക്കുന്നു.
    reason: പേരിന്റെ മറ്റൊരു പരമ്പരാഗത ഇംഗ്ലീഷ് രൂപം അറിയിക്കാൻ.
lexical_decisions:
- source_word: Σατανᾶς
  choice: സാത്താൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തിനാമം/പദവി മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: ἐφ’ ἑαυτὸν
  choice: തനിക്കുതന്നെ എതിരായി
  rationale: διαμερίζω എന്ന ക്രിയയോടൊപ്പം ഈ പ്രയോഗം ആന്തരിക എതിർപ്പിനെയും സ്വയം വിരുദ്ധമായ വിഭജനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: διεμερίσθη
  choice: ഭിന്നിച്ചാൽ
  rationale: സോപാധിക വാദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; സാത്താൻ സ്വന്തം പക്ഷത്തിനുള്ളിൽ വിഭജിക്കപ്പെടുന്ന സാഹചര്യം വ്യക്തമാക്കുന്നു.
- source_word: πῶς σταθήσεται
  choice: എങ്ങനെ നിലനിൽക്കും?
  rationale: ഭാവികാലത്തിന്റെ ചോദ്യം നിലനിൽക്കുക, ഉറച്ചുനിൽക്കുക എന്ന രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: βασιλεία
  choice: രാജ്യം
  rationale: ഇവിടെ സാത്താന്റെ ആധിപത്യവ്യവസ്ഥയെയോ മണ്ഡലത്തെയോ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻചോദ്യത്തിനുള്ള അടിസ്ഥാനമായി എതിരാളികളുടെ ആരോപണം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐν Βεελζεβοὺλ
  choice: ബെയെൽസെബൂലിനെക്കൊണ്ടാണ്
  rationale: ഇവിടെയുള്ള ἐν കർത്തൃത്വമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ശക്തിയാൽ’ എന്ന വിശദീകരണം ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Βεελζεβοὺλ
  choice: ബെയെൽസെബൂൽ
  rationale: SBLGNT-യിലെ Βεελζεβούλ എന്ന രൂപത്തെ നേരിട്ട് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ἐκβάλλειν
  choice: പുറത്താക്കുന്നതെന്ന്
  rationale: ഭൂതോച്ചാടനസന്ദർഭത്തിൽ ക്രിയയുടെ ബലവും അർഥവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δαιμόνια
  choice: ഭൂതങ്ങളെ
  rationale: δαιμόνια എന്നതിന്റെ നേരിട്ടുള്ളതും മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവുമായ പരിഭാഷ.
theological_decisions:
- issue: യേശുവിന്റെ എതിരാളികളുടെ ആരോപണത്തിന്റെ സ്വഭാവം
  choice: യേശു ബെയെൽസെബൂലിനെക്കൊണ്ടാണ് ഭൂതങ്ങളെ പുറത്താക്കുന്നതെന്ന ആരോപണം അധിക വ്യാഖ്യാനം കൂടാതെ നൽകി.
  alternative: ബെയെൽസെബൂലിന്റെ ശക്തിയാൽ ഭൂതങ്ങളെ പുറത്താക്കുന്നു
  rationale: ἐν എന്നത് കർത്തൃത്വമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു; എന്നാൽ മൂലപാഠത്തിൽ വ്യക്തമാക്കാത്ത ദുഷ്ടശക്തിയുടെ പ്രവർത്തനരീതി കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘തനിക്കുതന്നെ എതിരായി’ എന്ന പ്രയോഗം ആന്തരിക വിഭജനത്തെ വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘ബെയെൽസെബൂൽ’ എന്ന പേരിനോടുതന്നെ ചേർത്തിരിക്കുന്നു.
