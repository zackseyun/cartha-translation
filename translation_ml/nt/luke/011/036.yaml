id: LUK.11.36
reference: Luke 11:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിന്റെ ശരീരം മുഴുവനും പ്രകാശമുള്ളതും ഒരു ഇരുണ്ട ഭാഗവും ഇല്ലാത്തതുമാണെങ്കിൽ, അത് മുഴുവനും പ്രകാശമുള്ളതായിരിക്കും; ഒരു വിളക്ക് തന്റെ തിളക്കത്താൽ[a] നിന്നെ പ്രകാശിപ്പിക്കുന്നതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഒരു വിളക്ക് തന്റെ മിന്നൽപ്പൊലിയാൽ നിന്നെ പ്രകാശിപ്പിക്കുന്നതുപോലെ.” ഗ്രീക്ക് പദത്തിന് ‘മിന്നൽപ്പൊലി’ എന്നോ ‘തിളക്കം’ എന്നോ അർഥമാകാം; ഇവിടെ അത് അക്ഷരാർഥത്തിലുള്ള മിന്നലിനെക്കാൾ വിളക്കിന്റെ പ്രകാശത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: ശരീരം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും കണ്ണ്, വിളക്ക്, വെളിച്ചം എന്നിവയുമായി ബന്ധപ്പെട്ട രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅλον / φωτεινόν
  choice: മുഴുവനും പ്രകാശമുള്ളത്
  rationale: ആവർത്തിക്കുന്ന സമഗ്രതയും വെളിച്ചം-ഇരുട്ട് വൈരുധ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: അതിൽ ഒരു ഭാഗവും ഇരുണ്ടതല്ലാത്തത്
  rationale: നിഷേധത്തോടുകൂടിയ ഗ്രീക്ക് പങ്കാളിവാക്യത്തിന്റെ അർഥവും ‘ഭാഗം’ എന്ന ദൃശ്യരൂപവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: λύχνος
  choice: വിളക്ക്
  rationale: അമൂർത്തമായ ‘വെളിച്ചം’ എന്നതിനു പകരം കൈയിൽ കൊണ്ടുനടക്കാവുന്ന വിളക്കിനെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
- source_word: τῇ ἀστραπῇ
  choice: അതിന്റെ തിളക്കത്താൽ
  rationale: ἀστραπή മിന്നൽ, മിന്നൽപ്പൊലി, തിളക്കം എന്നിവ സൂചിപ്പിക്കാം; ഇവിടെ വിളക്കാണ് കർത്താവ് എന്നതിനാൽ അതിന്റെ പ്രകാശതിളക്കം എന്ന അർഥം സന്ദർഭോചിതമാണ്.
- source_word: φωτίζῃ σε
  choice: നിന്നെ പ്രകാശിപ്പിക്കുന്നു
  rationale: വ്യക്തിപരമായ കർമമായ σε നിലനിർത്തിക്കൊണ്ട് ‘വെളിച്ചം നൽകുക/പ്രകാശിപ്പിക്കുക’ എന്ന ക്രിയാർഥം മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ശരീരം’, ‘പ്രകാശം’ എന്നിവയുടെ രൂപകാത്മക അർഥം
  choice: ശാരീരികവും പ്രകാശസംബന്ധവുമായ ദൃശ്യരൂപം അതേപടി നിലനിർത്തി.
  alternative: ‘അന്തരംഗം’, ‘ആത്മീയാവസ്ഥ’, ‘ധാർമികാവസ്ഥ’ എന്നിങ്ങനെ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: മുൻവാക്യത്തിലെ കണ്ണ് ശരീരത്തിന്റെ വിളക്കാണെന്ന രൂപകവുമായി ഇത് ബന്ധപ്പെട്ടിരിക്കുന്നു. അതിനെ പ്രത്യേക ഉപദേശപരമായ വ്യാഖ്യാനമായി ചുരുക്കാതെ മൂലത്തിലെ അർഥസാന്ദ്രതയും പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വ്യവസ്ഥാവാക്യത്തിന്റെ ബന്ധം വ്യക്തമാക്കാൻ മലയാളത്തിലെ സ്വാഭാവിക ക്രമം ഉപയോഗിച്ചു; ആവർത്തനവും രൂപകവും സംരക്ഷിച്ചു.
