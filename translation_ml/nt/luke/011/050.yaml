source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: ml
  text: ലോകസ്ഥാപനം മുതൽ ചൊരിയപ്പെട്ട സകല പ്രവാചകന്മാരുടെയും രക്തത്തിന്റെ കണക്ക് ഈ തലമുറയിൽനിന്ന്[a] ചോദിക്കപ്പെടേണ്ടതിന്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഈ തലമുറയോടു കണക്കു ചോദിക്കപ്പെടേണ്ടതിന്.” രക്തച്ചൊരിച്ചിലിനെക്കുറിച്ച് ഉത്തരവാദിത്വം ആവശ്യപ്പെടുക എന്ന ന്യായവിധിപരമായ അർഥം ഈ ക്രിയയ്ക്കുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ചോദിക്കപ്പെടേണ്ടതിന്
  rationale: മുൻസന്ദർഭത്തോടുള്ള ഉദ്ദേശ്യ/ഫലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκζητηθῇ
  choice: കണക്കു ചോദിക്കപ്പെടുക
  rationale: രക്തച്ചൊരിച്ചിലിനെക്കുറിച്ച് ഉത്തരവാദിത്വം ആവശ്യപ്പെടുന്ന ന്യായവിധിപരമായ അർഥം വ്യക്തമാക്കുന്നു; വെറും ‘അന്വേഷിക്കുക’ എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: τὸ αἷμα
  choice: രക്തം
  rationale: ഗ്രീക്കിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ കൊലപാതകവുമായി ബന്ധപ്പെട്ട രക്തക്കുറ്റത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: πάντων τῶν προφητῶν
  choice: സകല പ്രവാചകന്മാരുടെയും
  rationale: πάντων എന്ന പദത്തിന്റെ സമഗ്രവ്യാപ്തിയും ജനിറ്റീവ് ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: τὸ ἐκκεχυμένον
  choice: ചൊരിയപ്പെട്ട
  rationale: രക്തം അക്രമമായി ചൊരിയപ്പെട്ടതിനെ മലയാളത്തിലെ പതിവായ ബൈബിൾപ്രയോഗത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: ലോകസ്ഥാപനംമുതൽ
  rationale: സ്ഥിരമായ ബൈബിൾപ്രയോഗത്തിന്റെ അർഥം സംക്ഷിപ്തവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: ഈ തലമുറയോടു
  rationale: ആരോടാണ് രക്തച്ചൊരിച്ചിലിന്റെ കണക്കു ചോദിക്കപ്പെടുന്നത് എന്ന ഉറവിട/ഉത്തരവാദിത്വബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പ്രവാചകന്മാരുടെ രക്തത്തിന് ‘കണക്കു ചോദിക്കുക’ എന്നതിന്റെ സ്വഭാവം
  choice: ദൈവദൂതന്മാരെ തള്ളിക്കളഞ്ഞതുമായി ബന്ധപ്പെട്ട സമാഹൃത രക്തക്കുറ്റത്തിന് ഈ തലമുറയെ ന്യായവിധിപരമായി ഉത്തരവാദികളാക്കുന്ന പ്രസ്താവന
  alternative: ശക്തമായ ന്യായവിധിയർഥമില്ലാത്ത, ചരിത്രപരമായ തുടർച്ച മാത്രം സൂചിപ്പിക്കുന്ന ആലങ്കാരിക പ്രസ്താവന
  rationale: രക്തച്ചൊരിച്ചിലിന്റെ സന്ദർഭത്തിൽ ἐκζητέω എന്ന ക്രിയ ഉത്തരവാദിത്വം ആവശ്യപ്പെടുന്ന അർഥം വഹിക്കുന്നു. എന്നാൽ ഈ തലമുറയുടെ കൂട്ടുത്തരവാദിത്വം എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്നത് വിവർത്തനം വിശദീകരിച്ചുറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, എന്നാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ശൈലി. ‘കണക്കു ചോദിക്കുക’ ന്യായവിധിപരമായ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘ലോകസ്ഥാപനം’ മൂലപാഠത്തിലെ ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
