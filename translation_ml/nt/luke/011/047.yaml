base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: ml
  text: നിങ്ങൾക്കു അയ്യോ! കാരണം, നിങ്ങൾ പ്രവാചകന്മാരുടെ ശവകുടീരങ്ങൾ[a] പണിയുന്നു; നിങ്ങളുടെ പിതാക്കന്മാരോ[b] അവരെ കൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കല്ലറസ്മാരകങ്ങൾ.’ ഗ്രീക്ക് പദത്തിന് കല്ലറകളെയോ കല്ലറയ്ക്കുമേലുള്ള സ്മാരകങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പിതാക്കന്മാർ’ എന്നതിന് ഇവിടെ ‘പൂർവികർ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: നിങ്ങൾക്ക് അയ്യോ കഷ്ടം!
  rationale: പ്രവാചകശൈലിയിലുള്ള ന്യായവിധിയുടെ ശക്തമായ പ്രഖ്യാപനവും നേരിട്ടുള്ള സംബോധനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻപുള്ള ‘അയ്യോ കഷ്ടം’ എന്ന പ്രഖ്യാപനത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἰκοδομεῖτε
  choice: പണിയുന്നു
  rationale: ഗ്രീക്ക് വർത്തമാനകാലത്തെ അനാവശ്യമായി പുരോഗമനഭാവത്തിലേക്ക് ചുരുക്കാതെ, പതിവോ ഇപ്പോഴത്തെ പ്രവൃത്തിയോ സൂചിപ്പിക്കാൻ കഴിയുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: τὰ μνημεῖα
  choice: ശവകുടീരങ്ങൾ
  rationale: കല്ലറയെയോ കല്ലറയ്ക്കുമേലുള്ള സ്മാരകഘടനയെയോ സൂചിപ്പിക്കാവുന്ന പദത്തിന്റെ ശവസംസ്കാരസംബന്ധിയായ അർഥം വ്യക്തമായി നൽകുന്നു; വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τῶν προφητῶν
  choice: പ്രവാചകന്മാരുടെ
  rationale: പ്രവാചകന്മാരുമായി ബന്ധപ്പെട്ട ശവകുടീരങ്ങൾ എന്ന ജനിറ്റീവ് ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: നിങ്ങളുടെ പിതാക്കന്മാരോ
  rationale: δέ നൽകുന്ന നേരിയ വിരുദ്ധത മലയാളത്തിലെ ‘-ഓ’ എന്ന ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പിതാക്കന്മാർ’ ഗ്രീക്കിലെ കുടുംബ-പൂർവിക ഭാഷ നിലനിർത്തുന്നു.
- source_word: ἀπέκτειναν αὐτούς
  choice: അവരെ കൊന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം അധികമായ നിയമപരമോ നൈതികമോ ആയ സൂചന ചേർക്കാതെ നേരിട്ട് നൽകുന്നു; സർവനാമം പ്രവാചകന്മാരെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശവകുടീരങ്ങൾ പണിയുന്നതും പിതാക്കന്മാർ പ്രവാചകന്മാരെ കൊന്നതും തമ്മിലുള്ള കപടതയോ പങ്കാളിത്തമോ ഈ വാക്യത്തിൽ തുറന്നുപറയണമോ
  choice: 'രണ്ടു പ്രവൃത്തികളും വിരുദ്ധമായി ചേർത്തുവയ്ക്കുക മാത്രം: ‘നിങ്ങൾ ... പണിയുന്നു; നിങ്ങളുടെ പിതാക്കന്മാരോ അവരെ കൊന്നു.’'
  alternative: ‘നിങ്ങളുടെ പിതാക്കന്മാർ കൊന്ന പ്രവാചകന്മാരുടെ ശവകുടീരങ്ങൾ നിങ്ങൾ പണിയുന്നു’ എന്ന ബന്ധവാക്യരൂപം, അല്ലെങ്കിൽ ഈ പ്രവൃത്തി പിതാക്കന്മാർക്കെതിരായ സാക്ഷ്യമാണെന്ന് തുറന്നുപറയുന്ന രൂപം.
  rationale: ഈ വാക്യം സൃഷ്ടിക്കുന്ന വാചകതീവ്രതയും സൂചനയും നിലനിർത്തുന്നു; അതിന്റെ വിശദീകരണം അടുത്ത വാക്യത്തിലേക്ക് മുൻകൂട്ടി കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അയ്യോ കഷ്ടം’ പ്രവാചകശൈലിയിലെ അപലപനശക്തി നിലനിർത്തുന്നു; ‘പിതാക്കന്മാരോ’ എന്ന രൂപം δέ-യുടെ വിരുദ്ധത അമിതമാക്കാതെ പ്രകടിപ്പിക്കുന്നു.
