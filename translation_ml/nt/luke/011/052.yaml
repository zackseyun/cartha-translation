id: LUK.11.52
reference: Luke 11:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: ml
  text: ന്യായപ്രമാണപണ്ഡിതരേ,[a] നിങ്ങൾക്കു അയ്യോ കഷ്ടം! നിങ്ങൾ അറിവിന്റെ താക്കോൽ[b] എടുത്തുകളഞ്ഞു; നിങ്ങൾതന്നെ പ്രവേശിച്ചില്ല, പ്രവേശിക്കുന്നവരെ തടയുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, മോശെയുടെ ന്യായപ്രമാണത്തിൽ വൈദഗ്ധ്യമുള്ളവർ; ആധുനിക അർഥത്തിലുള്ള അഭിഭാഷകരല്ല.
    reason: lexical_clarification
  - marker: b
    text: അഥവാ, ‘അറിവിലേക്കുള്ള താക്കോൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: ഹാ കഷ്ടം!
  rationale: പ്രവാചകീയമായ അപലപനത്തിന്റെയും വരാനിരിക്കുന്ന ദുരിതത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിന്റെയും ശക്തി നിലനിർത്തുന്ന, സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: νομικοῖς
  choice: ന്യായപ്രമാണപണ്ഡിതരേ
  rationale: ആധുനിക സിവിൽ അഭിഭാഷകരെയല്ല, യഹൂദരുടെ ന്യായപ്രമാണത്തിൽ വൈദഗ്ധ്യമുള്ളവരെയാണ് സൂചിപ്പിക്കുന്നത്; ഈ വ്യത്യാസം പ്രധാനപാഠത്തിൽത്തന്നെ വ്യക്തമാക്കുന്നു.
- source_word: ἤρατε
  choice: എടുത്തുകളഞ്ഞു
  rationale: വെറുതെ എടുത്തു എന്നതിലുപരി, മറ്റുള്ളവർക്ക് ലഭിക്കാതിരിക്കത്തക്കവിധം നീക്കംചെയ്തു എന്ന αἴρω എന്ന ക്രിയയുടെ സന്ദർഭാർഥം നൽകുന്നു.
- source_word: κλεῖδα τῆς γνώσεως
  choice: പരിജ്ഞാനത്തിന്റെ താക്കോൽ
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവാക്യഘടനയും പ്രവേശനം നൽകുന്ന താക്കോൽ എന്ന രൂപകവും സംരക്ഷിക്കുന്നു; ലക്ഷ്യാർഥമുള്ള മറ്റൊരു സ്വാഭാവിക വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: αὐτοὶ
  choice: നിങ്ങൾതന്നെ
  rationale: ആക്ഷേപത്തിലെ ഊന്നലും, നേതാക്കളും പ്രവേശിക്കാൻ ആഗ്രഹിക്കുന്ന മറ്റുള്ളവരും തമ്മിലുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: οὐκ εἰσήλθατε
  choice: പ്രവേശിച്ചില്ല
  rationale: എവിടേക്കാണ് പ്രവേശിക്കുന്നത് എന്നു പാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു കൂട്ടിച്ചേർക്കാതെ പ്രവേശനരൂപകം നിലനിർത്തുന്നു.
- source_word: τοὺς εἰσερχομένους
  choice: പ്രവേശിക്കുന്നവരെ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിലെ പുരോഗമനസ്വഭാവം സൂക്ഷിക്കുന്നു; ‘പ്രവേശിക്കാൻ ശ്രമിച്ചവരെ’ എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: ἐκωλύσατε
  choice: തടയുകയും ചെയ്തു
  rationale: പ്രവേശനത്തിന് വിഘ്നം സൃഷ്ടിച്ചു എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; തടസ്സത്തിന്റെ ഫലം സംബന്ധിച്ച് മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർണായകത ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘പരിജ്ഞാനത്തിന്റെ താക്കോൽ’, ‘പ്രവേശിക്കുക’ എന്നീ രൂപകങ്ങളുടെ സൂചിതാർഥം
  choice: പ്രവേശനരൂപകം നിലനിർത്തി; പ്രവേശിക്കുന്നത് എവിടേക്കാണെന്ന് പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കിയില്ല.
  alternative: ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുക എന്നോ ദൈവത്തെക്കുറിച്ചുള്ള യഥാർഥ പരിജ്ഞാനത്തിലേക്കു പ്രവേശിക്കുക എന്നോ വ്യാഖ്യാനിക്കാം.
  rationale: ഗ്രീക്ക് വാക്യം പ്രവേശനത്തിന്റെ ലക്ഷ്യം നേരിട്ട് പറയുന്നില്ല. അതിനാൽ പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കാതെ ലൂക്കായുടെ വിശാലസന്ദർഭത്തിൽ നിന്ന് അർഥം ഗ്രഹിക്കാൻ വായനക്കാരനെ അനുവദിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള പ്രവാചകീയ ശൈലി ഉപയോഗിച്ചു. ‘ന്യായപ്രമാണപണ്ഡിതർ’ എന്ന പദം മതനിയമവിദഗ്ധരെന്ന ചരിത്രസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘ഹാ കഷ്ടം’ അപലപനത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
