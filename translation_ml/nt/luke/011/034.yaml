id: LUK.11.34
reference: Luke 11:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: ml
  text: നിന്റെ ശരീരത്തിന്റെ വിളക്ക് നിന്റെ കണ്ണാണ്. നിന്റെ കണ്ണ് ആരോഗ്യമുള്ളതായിരിക്കുമ്പോൾ[a], നിന്റെ ശരീരം മുഴുവനും പ്രകാശമുള്ളതായിരിക്കും; എന്നാൽ നിന്റെ കണ്ണ് ദോഷമുള്ളതായിരിക്കുമ്പോൾ[b], നിന്റെ ശരീരവും ഇരുണ്ടതായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തെളിഞ്ഞതായിരിക്കുമ്പോൾ,’ ‘ശരിയായി പ്രവർത്തിക്കുന്നതായിരിക്കുമ്പോൾ,’ അല്ലെങ്കിൽ പരമ്പരാഗതമായി ‘ഏകമായിരിക്കുമ്പോൾ.’ ഗ്രീക്ക് പദത്തിന് ഏകമായത് അല്ലെങ്കിൽ അവിഭജിതമായത് എന്ന അർഥവും, ഈ സന്ദർഭത്തിൽ കണ്ണ് വ്യക്തമായി കാണുന്നതോ ശരിയായി പ്രവർത്തിക്കുന്നതോ എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മോശമായിരിക്കുമ്പോൾ’ അല്ലെങ്കിൽ ‘തിന്മയുള്ളതായിരിക്കുമ്പോൾ.’ ഗ്രീക്ക് പദം കണ്ണിന്റെ ദോഷത്തെയും ധാർമികമായി വികലമായ ദർശനത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: വിളക്ക്
  rationale: അമൂർത്തമായ ‘വെളിച്ചം’ എന്നതിനെക്കാൾ മൂർത്തമായ പ്രകാശസ്രോതസ്സിനെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്; അതിനാൽ രൂപകം നിലനിർത്തുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: ഇവിടെ ഭൗതിക ശരീരമാണ് നേരിട്ടുള്ള അർഥം; കാഴ്ചയുടെയും ആന്തരികാവസ്ഥയുടെയും രൂപകത്തിൽ അത് ഉപയോഗിച്ചിരിക്കുന്നു.
- source_word: ὀφθαλμός
  choice: കണ്ണ്
  rationale: ശരീരാവയവത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; അതിലൂടെ ആന്തരിക ദർശനത്തിന്റെ രൂപകം പ്രവർത്തിക്കുന്നു.
- source_word: ἁπλοῦς
  choice: തെളിവുള്ളത്
  rationale: ‘ഏകാഗ്രമായത്/വിഭജിക്കപ്പെടാത്തത്,’ ‘നിർമലമായത്,’ ‘ആരോഗ്യമുള്ളത്’ എന്നീ അർഥസാധ്യതകൾ ഉള്ള പദമാണ്. കണ്ണിനെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘തെളിവുള്ളത്’ സ്വാഭാവികമാണ്; എങ്കിലും പദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: φωτεινός
  choice: പ്രകാശമുള്ളത്
  rationale: ‘വെളിച്ചം നിറഞ്ഞത്/പ്രകാശമാനമായത്’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ഇരുട്ടുമായുള്ള വിരുദ്ധത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πονηρός
  choice: ദോഷമുള്ളത്
  rationale: ഈ പദത്തിന് ‘മോശമായത്’ എന്നും ‘തിന്മയുള്ളത്’ എന്നും അർഥമാകാം. കണ്ണിന്റെ പ്രവർത്തനദോഷവും ധാർമികമായി വികലമായ ദർശനവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ അർഥസന്ദിഗ്ധത ‘ദോഷമുള്ളത്’ നിലനിർത്തുന്നു.
- source_word: σκοτεινός
  choice: ഇരുണ്ടത്
  rationale: ‘പ്രകാശമുള്ളത്’ എന്നതിനോടുള്ള നേരിട്ടുള്ള വിരുദ്ധത ലളിതമായും വ്യക്തമായും നൽകുന്നു.
theological_decisions:
- issue: ἁπλοῦς എന്ന പദം കണ്ണിനെ വിശേഷിപ്പിക്കുമ്പോഴുള്ള അർഥം
  choice: പ്രധാന പാഠത്തിൽ ‘തെളിവുള്ളത്’
  alternative: ആരോഗ്യമുള്ളത്; നിർമലമായത്; ഏകാഗ്രമായത്/വിഭജിക്കപ്പെടാത്തത്; ഉദാരമായത്
  rationale: കണ്ണ്–ശരീരം–പ്രകാശം എന്ന ഉടൻസന്ദർഭത്തിൽ വ്യക്തമായി കാണുന്ന, ശരിയായി പ്രവർത്തിക്കുന്ന കണ്ണിനെ ‘തെളിവുള്ളത്’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് പദത്തിലെ ഏകത്വം, നിർമലത, ധാർമിക ദൃഷ്ടി എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
- issue: πονηρός എന്ന പദത്തിലെ പ്രവർത്തനപരവും ധാർമികവുമായ അർഥങ്ങൾ
  choice: പ്രധാന പാഠത്തിൽ ‘ദോഷമുള്ളത്’
  alternative: മോശമായത്; തിന്മയുള്ളത്; രോഗമുള്ളത്
  rationale: കണ്ണിന്റെ ശാരീരിക തകരാറിലേക്ക് മാത്രം ചുരുക്കാതെയും ‘തിന്മ’ എന്ന ധാർമിക അർഥം മാത്രം നിർബന്ധിക്കാതെയും ഇരുവശത്തെയും അർഥസമ്മർദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിലെ കണ്ണ്–വിളക്ക്–ശരീരം–പ്രകാശം/ഇരുട്ട് രൂപകബന്ധം നേരിട്ട് നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വിവാദപദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
