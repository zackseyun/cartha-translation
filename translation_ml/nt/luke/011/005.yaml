source:
  edition: SBLGNT
  text: Καὶ εἶπεν πρὸς αὐτούς· Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ· Φίλε, χρῆσόν μοι τρεῖς ἄρτους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങളിൽ ഒരു സ്നേഹിതനുള്ളവൻ, അർധരാത്രിയിൽ അവന്റെ അടുക്കൽ ചെന്നു, ‘സ്നേഹിതാ, എനിക്ക് മൂന്ന് അപ്പങ്ങൾ കടം തരണമേ’ എന്നു പറയാൻ പോകുന്നത് ആര്[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളിൽ ആർക്കാണ് ഒരു സ്നേഹിതനുണ്ടാകുകയും, അർധരാത്രിയിൽ അവന്റെ അടുക്കൽ ചെന്നു … എന്നു പറയുകയും ചെയ്യുക?” ഗ്രീക്കിൽ അലങ്കാരചോദ്യത്തിന്റെ ഭാഗമായി ഭാവികാല ക്രിയാരൂപങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ആർക്കെങ്കിലും
  rationale: ശ്രോതാക്കളെ നേരിട്ട് ഉൾപ്പെടുത്തുന്ന അലങ്കാരചോദ്യത്തിന്റെ സ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἕξει φίλον
  choice: ഒരു സ്നേഹിതനുണ്ടെങ്കിൽ
  rationale: ഗ്രീക്കിലെ ഭാവികാലരൂപം ഇവിടെ സങ്കൽപ്പിതമായ അലങ്കാരചോദ്യത്തിന്റെ ഭാഗമാണ്; മലയാളത്തിൽ സോപാധികരൂപം അതിന്റെ ആശയം കൂടുതൽ സ്വാഭാവികമായി നൽകുന്നു. ഭാവികാലരൂപത്തെക്കുറിച്ചുള്ള വിവരം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: φίλον / Φίλε
  choice: സ്നേഹിതൻ / സ്നേഹിതാ
  rationale: നാമത്തിലും സംബോധനയിലും ഒരേ മൂലപദം ഉപയോഗിച്ച് ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്തുന്നു; dignified and commonly understood Malayalam.
- source_word: πορεύσεται πρὸς αὐτόν
  choice: ആ സ്നേഹിതന്റെ അടുക്കൽ ചെന്ന്
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള സഞ്ചാരം ലളിതവും വ്യക്തവുമായി നൽകുന്നു; സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ സ്വാഭാവികമായി നാമം ആവർത്തിക്കുന്നു.
- source_word: μεσονυκτίου
  choice: അർധരാത്രിയിൽ
  rationale: കാലസൂചനയുടെ നേരിട്ടുള്ളതും പ്രചാരത്തിലുള്ളതുമായ മലയാള തത്തുല്യം.
- source_word: εἴπῃ αὐτῷ
  choice: എന്നു പറയുമ്പോൾ
  rationale: വാക്യം തുടർന്നുള്ള വാക്യങ്ങളിലേക്കു നീളുന്ന അലങ്കാരചോദ്യത്തിന്റെ അപൂർണ ഘടന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധം സൃഷ്ടിക്കുന്നു.
- source_word: χρῆσόν μοι
  choice: എനിക്ക് … കടം തരണമേ
  rationale: താൽക്കാലികമായി നൽകണമെന്ന അഭ്യർഥന വ്യക്തമാക്കുന്നു; ആജ്ഞാരൂപത്തിന്റെ വിനീതമായ അഭ്യർഥനാഭാവം ‘തരണമേ’ നൽകുന്നു.
- source_word: τρεῖς ἄρτους
  choice: മൂന്ന് അപ്പം
  rationale: പ്രാചീന സാഹചര്യത്തിലെ എണ്ണാവുന്ന അപ്പങ്ങളെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം; ‘മൂന്ന് കഷണം’ എന്നു പറഞ്ഞ് അർത്ഥം ചുരുക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. അലങ്കാരചോദ്യം അടുത്ത വാക്യങ്ങളിലേക്കു തുടരുന്നതിനാൽ ഈ വാക്യത്തിന്റെ അവസാനം തുറന്ന ഘടനയും കോമയും നിലനിർത്തിയിരിക്കുന്നു.
