id: LUK.11.49
reference: Luke 11:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: ml
  text: 'അതുകൊണ്ടുതന്നെ ദൈവത്തിന്റെ ജ്ഞാനം[a] ഇപ്രകാരം പറഞ്ഞു: “ഞാൻ അവരുടെ അടുക്കൽ പ്രവാചകന്മാരെയും അപ്പൊസ്തലന്മാരെയും അയക്കും; അവരിൽ ചിലരെ അവർ കൊല്ലുകയും പീഡിപ്പിക്കുകയും ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവജ്ഞാനം.’ ഈ പ്രയോഗം ദൈവിക ജ്ഞാനത്തിന്റെ വ്യക്തിവൽക്കരണമായോ, ദൈവത്തിന്റെ ജ്ഞാനപൂർവമായ വിധിയായോ, യേശുവിന്റെ പരോക്ഷമായ സ്വയംപരാമർശമായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിലെ കുറ്റാരോപണത്തിൽനിന്ന് വരുന്ന കാരണപരവും നിഗമനാത്മകവുമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: -വും
  rationale: ‘ദൈവത്തിന്റെ ജ്ഞാനവും’ എന്ന പ്രയോഗത്തിൽ ചേർക്കൽസൂചകമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ജ്ഞാനം
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവ്യാകരണബന്ധം അടുത്തായി നിലനിർത്തുകയും ദൈവിക ജ്ഞാനത്തിന്റെ വ്യക്തിവൽക്കരണമാണോ ദൈവത്തിന്റെ ജ്ഞാനപൂർവമായ വിധിയാണോ എന്നത് തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: εἶπεν
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ഉദ്ധരണിയിലേക്കു സ്വാഭാവികമായി നയിക്കുന്ന, വ്യാഖ്യാനഭാരം കുറഞ്ഞ പ്രയോഗം.
- source_word: Ἀποστελῶ
  choice: അയക്കും
  rationale: ഭാവികാല കർത്തൃപ്രയോഗം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: εἰς αὐτούς
  choice: അവരുടെ അടുക്കൽ
  rationale: അയയ്ക്കുന്നതിന്റെ ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: προφήτας
  choice: പ്രവാചകന്മാർ
  rationale: προφήτης എന്ന പദത്തിന്റെ സ്ഥിരവും പൊതുവായി മനസ്സിലാകുന്നതുമായ മലയാള പരിഭാഷ.
- source_word: ἀποστόλους
  choice: അപ്പൊസ്തലന്മാർ
  rationale: ലൂക്കാ–അപ്പൊസ്തലപ്രവൃത്തികളിലെ സാങ്കേതിക പദവിയും ദൗത്യവും നിലനിർത്തുന്നു; പൊതുവായ ‘ദൂതന്മാർ’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: ἐξ αὐτῶν
  choice: അവരിൽ ചിലരെ
  rationale: അയയ്ക്കപ്പെടുന്ന എല്ലാവരെയും അല്ല, അവരിൽ ഒരു വിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്ന ഭാഗികാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀποκτενοῦσιν
  choice: കൊല്ലും
  rationale: ഭാവികാല ക്രിയയുടെ നേരിട്ടുള്ളതും ശക്തവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: διώξουσιν
  choice: പീഡിപ്പിക്കും
  rationale: കൊലപാതകത്തോടൊപ്പം വരുന്ന ശത്രുതാപരമായ സന്ദർഭത്തിൽ διώκω എന്നതിന്റെ മതപീഡനാർഥം യോജിച്ച രീതിയിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ ജ്ഞാനം’ എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: യേശുവിനെയോ തിരുവെഴുത്തിനെയോ സ്വതന്ത്ര വ്യക്തിരൂപത്തിലുള്ള ജ്ഞാനത്തെയോ വ്യക്തമായി തിരിച്ചറിയിക്കാതെ ‘ദൈവത്തിന്റെ ജ്ഞാനം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ദൈവിക ജ്ഞാനത്തിന്റെ വ്യക്തിവൽക്കരണം; ദൈവത്തിന്റെ ജ്ഞാനപൂർവമായ വിധി; യേശുവിന്റെ പരോക്ഷമായ സ്വയംപരാമർശം.
  rationale: മൂലപ്രയോഗം ഒന്നിലധികം വ്യാഖ്യാനങ്ങൾക്ക് ഇടനൽകുന്നു. അതിനാൽ വാക്യം ഒരു പ്രത്യേക ദൈവശാസ്ത്രവായനയിലേക്ക് ചുരുക്കാതെ അതിലെ ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘അവരുടെ അടുക്കൽ’ എന്നത് ലക്ഷ്യസ്ഥാനം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘കൊല്ലുകയും പീഡിപ്പിക്കുകയും ചെയ്യും’ എന്ന സമാന്തരഘടന മൂലത്തിലെ രണ്ടു ഭാവികാല ക്രിയകളുടെ ശക്തി നിലനിർത്തുന്നു.
