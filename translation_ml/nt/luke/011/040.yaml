  text: ἄφρονες, οὐχ ὁ ποιήσας τὸ ἔξωθεν καὶ τὸ ἔσωθεν ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: ml
  text: ബുദ്ധിയില്ലാത്തവരേ! പുറം ഉണ്ടാക്കിയവൻ അകവും ഉണ്ടാക്കിയില്ലയോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബാഹ്യഭാഗം ... ആന്തരികഭാഗം.’ ഈ പ്രയോഗം ഉടൻപശ്ചാത്തലത്തിൽ പാത്രത്തിന്റെ പുറവും അകവും സൂചിപ്പിക്കാം; വിപുലമായ അർഥത്തിൽ മനുഷ്യന്റെ ബാഹ്യജീവിതത്തെയും ആന്തരികജീവിതത്തെയും സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: ബുദ്ധിയില്ലാത്തവരേ
  rationale: ബഹുവചന സംബോധനയായി വരുന്ന ഈ പദത്തിന്റെ നേരിട്ടുള്ള ശാസനാഭാവവും മൂർച്ചയും നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മനസ്സിലാകുന്നതുമാണ്.
- source_word: οὐχ ... ἐποίησεν;
  choice: ഉണ്ടാക്കിയില്ലയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക ചോദ്യത്തിന്റെ ശക്തി മലയാളത്തിലെ സ്വാഭാവികമായ ചോദ്യംരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ποιήσας
  choice: ഉണ്ടാക്കിയവൻ
  rationale: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന substantival participle ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ദൈവം’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: τὸ ἔξωθεν
  choice: പുറം
  rationale: ഉടൻപശ്ചാത്തലത്തിലെ പാത്രത്തിന്റെ പുറംഭാഗത്തെയും വിപുലമായി മനുഷ്യന്റെ ബാഹ്യജീവിതത്തെയും സൂചിപ്പിക്കാവുന്ന അർഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: τὸ ἔσωθεν
  choice: അകം
  rationale: പാത്രത്തിന്റെ അകത്തെയും മനുഷ്യന്റെ ആന്തരികജീവിതത്തെയും ഒരുപോലെ സൂചിപ്പിക്കാവുന്ന വിധത്തിൽ ‘പുറം’ എന്നതിനോടുള്ള സമാന്തരവിരോധം നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -വും
  rationale: പുറം ഉണ്ടാക്കിയവൻ അകവും ഉണ്ടാക്കി എന്ന ‘also’ അർഥം മലയാളത്തിലെ ചേർക്കൽപ്രത്യയമായ ‘-വും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ഉണ്ടാക്കിയവൻ’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: സ്രഷ്ടാവായ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാമെങ്കിലും ‘ദൈവം’ എന്ന് തുറന്നുചേർക്കാതെ മൂലത്തിലെ പരോക്ഷത നിലനിർത്തി.
  alternative: ഇത് പാത്രം ഉണ്ടാക്കിയവനെ മാത്രം ഉടൻ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുക.
  rationale: വാക്യം പാത്രത്തിന്റെ പുറം–അകം എന്ന ഉടൻപശ്ചാത്തലത്തിലും ദൈവം ബാഹ്യവും ആന്തരികവും സൃഷ്ടിച്ചു എന്ന വിപുലമായ ദൈവശാസ്ത്രപരമായ തലത്തിലും പ്രവർത്തിക്കാം; പരിഭാഷ രണ്ടും അനുവദിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുറം/അകം’ എന്ന ലളിതമായ സമാന്തരപദങ്ങൾ മൂലത്തിലെ ചുരുക്കവും ദ്വയാർഥസാധ്യതയും നിലനിർത്തുന്നു.
