    issue: “ഇങ്ങനെ” is less definite than ταῦτα.
    rationale: The Greek demonstrative plural means “these things” and points to Jesus’ immediately preceding words. “ഈ കാര്യങ്ങൾ” preserves that reference more precisely without adding interpretation.
