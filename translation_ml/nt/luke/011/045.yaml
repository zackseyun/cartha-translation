reference: Luke 11:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δέ τις τῶν νομικῶν λέγει αὐτῷ· Διδάσκαλε, ταῦτα λέγων καὶ ἡμᾶς ὑβρίζεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: ml
  text: 'അപ്പോൾ ന്യായപ്രമാണപണ്ഡിതന്മാരിൽ[a] ഒരാൾ അവനോടു മറുപടിയായി പറഞ്ഞു: “ഗുരോ, ഈ കാര്യങ്ങൾ പറയുന്നതിലൂടെ ഞങ്ങളെയും അപമാനിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ന്യായപ്രമാണവിദഗ്ധരിൽ.” ഗ്രീക്കുപദം യഹൂദരുടെ ന്യായപ്രമാണത്തിൽ പ്രാവീണ്യമുള്ളവരെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക അർത്ഥത്തിലുള്ള അഭിഭാഷകരെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഞങ്ങളോടും അവജ്ഞയോടെ പെരുമാറുന്നു.” ഈ ക്രിയയ്ക്ക് അപമാനിക്കുക, അവഹേളിക്കുക എന്നീ അർത്ഥങ്ങൾ വരാം; വെറുതെ മനോവേദനിപ്പിക്കുക എന്നതിലൊതുങ്ങുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: അപ്പോൾ … മറുപടിയായി
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ ആഖ്യാനമാറ്റവും Ἀποκριθείς എന്നതിന്റെ പ്രതികരണസ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τις τῶν νομικῶν
  choice: ന്യായപ്രമാണപണ്ഡിതന്മാരിൽ ഒരാൾ
  rationale: νομικός ഇവിടെ ആധുനിക അഭിഭാഷകനെയല്ല, യഹൂദരുടെ ന്യായപ്രമാണത്തിൽ പ്രാവീണ്യമുള്ള ഒരാളെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘ന്യായപ്രമാണപണ്ഡിതൻ’ ചരിത്ര-മതപരമായ അർത്ഥം കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
- source_word: λέγει αὐτῷ
  choice: അവനോടു … പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ആഖ്യാനപരമായ വർത്തമാനകാലത്തെ മലയാള ആഖ്യാനശൈലിക്ക് യോജിച്ച ഭൂതകാലമായി സ്വാഭാവികമാക്കി.
- source_word: Διδάσκαλε
  choice: ഗുരോ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയിൽ διδάσκαλος എന്നതിന്റെ അധ്യാപകസ്ഥാനവും ആദരസൂചനയും സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ταῦτα λέγων
  choice: ഇങ്ങനെ പറയുന്നതിലൂടെ
  rationale: യേശു തൊട്ടുമുമ്പ് പറഞ്ഞ കാര്യങ്ങളെയും ആ വാക്കുകൾ പറയുന്നതാണ് ആരോപണത്തിന് അടിസ്ഥാനമെന്ന ബന്ധത്തെയും വ്യക്തമാക്കുന്നു.
- source_word: καὶ ἡμᾶς
  choice: ഞങ്ങളെയും
  rationale: καί എന്നതിന്റെ ഉൾപ്പെടുത്തുന്ന അർത്ഥം മലയാളത്തിലെ ‘-യും’ ചേർത്ത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑβρίζεις
  choice: അപമാനിക്കുന്നു
  rationale: വെറും മനോവേദനിപ്പിക്കൽ എന്നതിലുപരി നിന്ദിക്കുകയോ അവഹേളിക്കുകയോ ചെയ്യുന്ന ശക്തമായ അർത്ഥം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി സ്വീകരിച്ചു. ചരിത്രപരമായ യഹൂദ ന്യായപ്രമാണസന്ദർഭം വ്യക്തമാക്കാൻ ‘ന്യായപ്രമാണപണ്ഡിതൻ’ ഉപയോഗിച്ചു; സംഭാഷണത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്താൻ ‘അപമാനിക്കുന്നു’ തെരഞ്ഞെടുത്തു.
