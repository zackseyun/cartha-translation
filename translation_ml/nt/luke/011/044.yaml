id: LUK.11.44
reference: Luke 11:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: ml
  text: നിങ്ങൾക്ക് അയ്യോ കഷ്ടം! കാരണം, അടയാളമില്ലാത്ത കല്ലറകൾപോലെയാണ് നിങ്ങൾ; അവയുടെ മുകളിലൂടെ നടക്കുന്ന ആളുകൾ അവ കല്ലറകളാണെന്ന് അറിയുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: നിങ്ങൾക്ക് അയ്യോ കഷ്ടം!
  rationale: വിധിന്യായവും വിലാപവും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് മുന്നറിയിപ്പിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: അടയാളമില്ലാത്ത കല്ലറകൾ
  rationale: ἄδηλα എന്നത് കാണാനാവാത്തത്/തിരിച്ചറിയാനാവാത്തത് എന്ന ആശയം നൽകുന്നു; ഈ സന്ദർഭത്തിൽ ആളുകൾ അറിയാതെ ചവിട്ടിനടക്കുന്ന, തിരിച്ചറിയാനുള്ള അടയാളമില്ലാത്ത കല്ലറകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: οἱ ἄνθρωποι
  choice: മനുഷ്യർ
  rationale: ഗ്രീക്ക് പദം പൊതുവായി മനുഷ്യരെയോ ആളുകളെയോ സൂചിപ്പിക്കുന്നു; ലിംഗപരമായി അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: περιπατοῦντες ἐπάνω
  choice: അവയുടെ മുകളിലൂടെ നടക്കുന്ന
  rationale: കല്ലറകളുടെ മീതെ അറിയാതെ നടക്കുന്നതെന്ന സ്ഥലപരമായ ചിത്രം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐκ οἴδασιν
  choice: അത് അറിയുന്നില്ല
  rationale: അവർ നടക്കുന്നത് കല്ലറകളുടെ മുകളിലാണെന്ന വസ്തുത അറിയാത്തതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: അടയാളമില്ലാത്ത കല്ലറകളുടെ ആചാരപരമായ അശുദ്ധിയോടുള്ള സൂചന
  choice: സൂചന വിശദീകരിക്കാതെ ഉപമ അതേപടി നിലനിർത്തി
  alternative: ‘അറിയാതെ അശുദ്ധരാകുന്നു’ എന്ന് വ്യാഖ്യാനാത്മകമായി ചേർക്കുക
  rationale: മൂലവാക്യം അശുദ്ധീകരണഫലം തുറന്നുപറയുന്നില്ല; അതിനാൽ സാംസ്കാരിക-ദൈവശാസ്ത്രപരമായ അന്തർധ്വനി വായനക്കാരനുവേണ്ടി വാചകത്തിൽ വികസിപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അയ്യോ കഷ്ടം’ പ്രവാചകീയ വിലാപ-വിധിപ്രഖ്യാപനത്തിന്റെ ശക്തി നൽകുന്നു; ‘കല്ലറകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
