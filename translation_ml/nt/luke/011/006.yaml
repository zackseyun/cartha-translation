  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. വാക്യം ഉപമയിലെ നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ ഉദ്ധരണിചിഹ്നം നിലനിർത്തി.
