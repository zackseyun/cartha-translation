  yaml_path: translation/nt/luke/011/006.yaml
  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: ml
  text: കാരണം, എന്റെ ഒരു സുഹൃത്ത് യാത്രയിൽനിന്ന്[a] എന്റെ അടുക്കൽ വന്നിരിക്കുന്നു; അവന്റെ മുമ്പിൽ വെക്കാൻ എന്റെ പക്കൽ ഒന്നുമില്ല.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘വഴിയിൽനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: കാരണം
  rationale: ഉപമയിലെ അഭ്യർഥനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന സ്വാഭാവികമായ കാരണസൂചക പ്രയോഗം.
- source_word: φίλος μου
  choice: എന്റെ ഒരു സുഹൃത്ത്
  rationale: അനിശ്ചിതമായ φίλος എന്ന പ്രയോഗവും μου എന്ന ഉടമസ്ഥസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρεγένετο
  choice: വന്നിരിക്കുന്നു
  rationale: സുഹൃത്ത് എത്തിച്ചേർന്ന് ഇപ്പോഴും അവിടെയുണ്ടെന്ന സന്ദർഭഫലം മലയാളത്തിലെ ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: ἐξ ὁδοῦ
  choice: യാത്ര കഴിഞ്ഞ്
  rationale: അക്ഷരാർഥം ‘വഴിയിൽനിന്ന്’ എന്നാണെങ്കിലും, യാത്രചെയ്ത് എത്തിയെന്ന സന്ദർഭാർഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: πρός με
  choice: എന്റെ അടുക്കൽ
  rationale: വക്താവിന്റെ അടുത്തേക്കുള്ള വരവ് വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘വീട്ടിലേക്ക്’ അല്ലെങ്കിൽ ‘എന്നെ സന്ദർശിക്കാൻ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: οὐκ ἔχω
  choice: എന്റെ പക്കൽ ഒന്നുമില്ല
  rationale: കൈവശമില്ലായ്മയെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ὃ παραθήσω αὐτῷ
  choice: അവന്റെ മുമ്പിൽ വിളമ്പിവെക്കാൻ
  rationale: അതിഥിക്കു ഭക്ഷണം മുമ്പിൽ വെച്ചുകൊടുക്കുന്ന ആതിഥ്യമര്യാദയുടെ ദൃശ്യം നിലനിർത്തുകയും മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
