revisions:
- from: അപ്പോൾ അത് പോയി, അതിനെക്കാൾ ദുഷ്ടതയേറിയ[a] വേറെ ഏഴ് ആത്മാക്കളെ[b] തന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുവരുന്നു. അവ അകത്തു കടന്ന് അവിടെ പാർക്കുന്നു. അങ്ങനെ ആ മനുഷ്യന്റെ പിന്നത്തെ അവസ്ഥ[c] ആദ്യത്തേതിനേക്കാൾ മോശമായിത്തീരുന്നു.
  to: അപ്പോൾ അത് പോകുന്നു; അതിനെക്കാൾ ദുഷ്ടരായ[a] വേറെ ഏഴ് ആത്മാക്കളെ[b] തന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോകുന്നു. അവ അകത്തു കടന്ന് അവിടെ വസിക്കുന്നു. അങ്ങനെ ആ മനുഷ്യന്റെ പിന്നത്തെ അവസ്ഥ[c] ആദ്യ അവസ്ഥയെക്കാൾ മോശമായിത്തീരുന്നു.
  rationale: ‘കൂട്ടിക്കൊണ്ടുവരുന്നു’ എന്നത് ‘കൂട്ടിക്കൊണ്ടുപോകുന്നു’ എന്നാക്കി, പോകുന്ന ആത്മാവ് മറ്റുള്ള ആത്മാക്കളെ കൂടെ എടുത്തുപോകുന്നു എന്ന πορεύεται καὶ παραλαμβάνει എന്ന ക്രമം നിലനിർത്തി. വാക്യത്തിലെ മറ്റു ഘടകങ്ങൾ മൂലപാഠത്തോടും ഇംഗ്ലീഷ് ഓഡിറ്റ് തീരുമാനങ്ങളോടും യോജിക്കുന്നു. SBLGNT-യിലെ ബഹുവചന പ്രവേശനപങ്കുപദവും ഏകവചന κατοικεῖ-യും സൃഷ്ടിക്കുന്ന രൂപപരമായ അസമത്വം മലയാളത്തിൽ അർഥാനുസൃത ബഹുവചനമായ ‘അവ ... വസിക്കുന്നു’ എന്നിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചിരിക്കുന്നു; അതിനാൽ ഒരു പ്രത്യേക പാഠഭേദക്കുറിപ്പ് ആവശ്യമായില്ല.
