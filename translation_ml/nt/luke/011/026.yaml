id: LUK.11.26
reference: Luke 11:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: ml
  text: അപ്പോൾ അത് പോകുന്നു; അതിനെക്കാൾ ദുഷ്ടരായ[a] വേറെ ഏഴ് ആത്മാക്കളെ[b] തന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോകുന്നു. അവ അകത്തു കടന്ന് അവിടെ വസിക്കുന്നു. അങ്ങനെ ആ മനുഷ്യന്റെ പിന്നത്തെ അവസ്ഥ[c] ആദ്യ അവസ്ഥയെക്കാൾ മോശമായിത്തീരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിനെക്കാൾ കൂടുതൽ ദുഷ്ടരായ.’
    reason: πονήμερότερα എന്ന താരതമ്യവിശേഷണത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു മലയാള പരിഭാഷ നൽകുന്നു.
  - marker: b
    text: ഗ്രീക്കിൽ ഇവിടെ ‘ആത്മാക്കൾ’ എന്നാണ്; ‘ഭൂതങ്ങൾ’ എന്നോ ‘അശുദ്ധാത്മാക്കൾ’ എന്നോ ഈ വാക്യത്തിൽ പ്രത്യേകം പറയുന്നില്ല. എന്നാൽ സന്ദർഭം അവയുടെ ദുഷ്ടസ്വഭാവം വ്യക്തമാക്കുന്നു.
    reason: മൂലപദത്തിന്റെ പരിധിയും സന്ദർഭത്തിൽനിന്നു ലഭിക്കുന്ന തിരിച്ചറിയലും വേർതിരിച്ചു വ്യക്തമാക്കുന്നു.
  - marker: c
    text: അഥവാ, ‘അന്ത്യസ്ഥിതി.’
    reason: τὰ ἔσχατα എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ചുരുക്കമായ മറ്റൊരു പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭവങ്ങളുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാള കാലബന്ധകമാണ്.
- source_word: πορεύεται
  choice: പോയി
  rationale: ആത്മാവിന്റെ നീക്കത്തെ ലളിതമായും നേരിട്ടും അറിയിക്കുന്നു.
- source_word: παραλαμβάνει
  choice: തന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുവരുന്നു
  rationale: മറ്റുള്ളവരെ തന്നോടൊപ്പം കൊണ്ടുപോകുക/കൊണ്ടുവരുക എന്ന അനുഗമനഭാവം വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ അവ വീട്ടിലേക്കു മടങ്ങിവരുന്നതിനാൽ ‘കൊണ്ടുവരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: ἕτερα πνεύματα
  choice: വേറെ ഏഴ് ആത്മാക്കളെ
  rationale: ἕτερα എന്നത് ‘വേറെ/മറ്റു’ എന്നും πνεύματα എന്നത് അധിക വിശേഷണം ചേർക്കാതെ ‘ആത്മാക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: πονηρότερα ἑαυτοῦ
  choice: അതിനെക്കാൾ ദുഷ്ടതയേറിയ
  rationale: തിരിച്ചുവരുന്ന ആത്മാവുമായുള്ള താരതമ്യം നിലനിർത്തുന്നു; ‘ദുഷ്ടതയേറിയ’ എന്നത് നൈതികവും വിരുദ്ധവുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: അവ അകത്തു കടന്ന് അവിടെ പാർക്കുന്നു
  rationale: ബഹുവചന കർത്തൃസൂചന നിലനിർത്തി, പ്രവേശനവും തുടർന്നുള്ള വാസവും നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു. ഗ്രീക്കിലെ κατοικεῖ രൂപപരമായി ഏകവചനമാണെങ്കിലും മുൻപുള്ള ബഹുവചന കൃന്തത്തിന്റെ അർഥബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τὰ ἔσχατα ... τῶν πρώτων
  choice: പിന്നത്തെ അവസ്ഥ ... ആദ്യത്തേതിനേക്കാൾ
  rationale: അക്ഷരാർഥമായ ‘അവസാന കാര്യങ്ങൾ/ആദ്യ കാര്യങ്ങൾ’ എന്നതിനുപകരം വ്യക്തിയുടെ പിന്നീടുള്ള അവസ്ഥയും ആദ്യാവസ്ഥയും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി നൽകുന്ന മലയാള പ്രയോഗം.
- source_word: τοῦ ἀνθρώπου ἐκείνου
  choice: ആ മനുഷ്യന്റെ
  rationale: ദൃഷ്ടാന്തത്തിലെ നിർദിഷ്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ ഏകവചന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: χείρονα
  choice: മോശമായിത്തീരുന്നു
  rationale: γίνεταιയോടു ചേർന്ന താരതമ്യാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: πνεύματα എന്ന പദത്തെ ഭൂതങ്ങൾ അല്ലെങ്കിൽ അശുദ്ധാത്മാക്കൾ എന്ന് വ്യക്തമാക്കണമോ
  choice: ആത്മാക്കൾ
  alternative: അശുദ്ധാത്മാക്കൾ / ഭൂതങ്ങൾ
  rationale: സന്ദർഭം ഇവയുടെ ദുഷ്ടസ്വഭാവം വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യത്തിൽ πνεύματα എന്ന പദം മാത്രമാണ് ഉള്ളത്. മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശേഷണം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ അർഥവ്യാപ്തി നിലനിർത്തി.
- issue: τὰ ἔσχατα എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: പിന്നത്തെ അവസ്ഥ
  alternative: അന്ത്യസ്ഥിതി
  rationale: ഇത് കാലക്രമത്തിലെ അവസാന സംഭവങ്ങൾ എന്നതിലുപരി ആ മനുഷ്യന്റെ തുടർന്നുള്ള സ്ഥിതിയെ ആദ്യസ്ഥിതിയുമായി താരതമ്യം ചെയ്യുന്ന പ്രയോഗമാണ്. ‘പിന്നത്തെ അവസ്ഥ’ ആ വൈരുധ്യം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- issue: κατοικεῖ എന്ന ഏകവചന രൂപവും εἰσελθόντα എന്ന ബഹുവചന രൂപവും തമ്മിലുള്ള സംഘർഷം
  choice: അവ അകത്തു കടന്ന് അവിടെ പാർക്കുന്നു
  alternative: അകത്തു കടന്നിട്ട് അത് അവിടെ പാർക്കുന്നു
  rationale: ബഹുവചനമായ ആത്മാക്കളാണ് പ്രവേശിക്കുന്നതെന്ന് വാക്യഘടനയും സന്ദർഭവും സൂചിപ്പിക്കുന്നു. എന്നാൽ ഗ്രീക്കിലെ രൂപവ്യത്യാസം വിവർത്തനക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി; മുഖ്യപാഠത്തിൽ അസ്വാഭാവികമായ ഏകവചനബന്ധം നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പാർക്കുന്നു,’ ‘അവസ്ഥ,’ ‘മോശമായിത്തീരുന്നു’ എന്നീ പദങ്ങൾ സ്വാഭാവികതയും മൂലപാഠത്തോടുള്ള അടുപ്പവും തുലനം ചെയ്യുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദത്തിനു പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
