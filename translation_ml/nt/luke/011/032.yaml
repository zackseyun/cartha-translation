id: LUK.11.32
reference: Luke 11:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: ml
  text: നിനെവേയിലെ പുരുഷന്മാർ ന്യായവിധിയിൽ ഈ തലമുറയോടൊപ്പം എഴുന്നേൽക്കും; അവർ അതിനെ കുറ്റംവിധിക്കും. കാരണം, യോനായുടെ പ്രസംഗത്തോടു പ്രതികരിച്ച് അവർ മാനസാന്തരപ്പെട്ടു. ഇതാ, യോനായെക്കാൾ മഹത്തായ ഒന്ന് ഇവിടെ ഉണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യോനായെക്കാൾ മഹാനായ ഒരാൾ ഇവിടെ ഉണ്ട്,” അതുമല്ലെങ്കിൽ, “യോനായെക്കാൾ അധികം ഇവിടെ ഉണ്ട്.” ഗ്രീക്കിൽ ‘മഹത്തായ/കൂടുതലായ’ എന്ന അർഥമുള്ള നപുംസകലിംഗ രൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ ഇത് യേശുവെന്ന വ്യക്തിയുമായുള്ള താരതമ്യത്തിൽ മാത്രം ഒതുങ്ങാതെ, യേശുവിലും അവന്റെ ശുശ്രൂഷയിലും സന്നിഹിതമായ അതിലും മഹത്തായ യാഥാർഥ്യത്തെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: നിനെവേയിലെ പുരുഷന്മാർ
  rationale: ἄνδρες എന്നതിലെ വ്യക്തമായ പുരുഷലിംഗ സൂചന നിലനിർത്തിക്കൊണ്ട് Νινευῖται എന്ന ജനനാമം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀναστήσονται
  choice: എഴുന്നേറ്റ്
  rationale: ഭാവികാല ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ‘എഴുന്നേൽക്കും’ എന്ന ആശയം സൂചിപ്പിക്കുന്നു; ‘പുനരുത്ഥാനം പ്രാപിച്ച്’ എന്ന് അതിവ്യാഖ്യാനം ചെയ്യുന്നില്ല.
- source_word: ἐν τῇ κρίσει
  choice: ന്യായവിധിയിൽ
  rationale: അന്തിമ ന്യായവിധിയെന്ന സന്ദർഭം സംക്ഷിപ്തമായും പരമ്പരാഗതമായും വ്യക്തമാക്കുന്നു.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: ഈ തലമുറയോടൊപ്പം
  rationale: μετάയുടെ സഹവർത്തിത്വാർഥവും ‘ഈ തലമുറ’ എന്ന സിനോപ്റ്റിക് പ്രയോഗത്തിന്റെ ചരിത്രപരവും ധാർമികവുമായ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: κατακρινοῦσιν αὐτήν
  choice: അതിനെ കുറ്റംവിധിക്കും
  rationale: κατακρίνω വെറും വിധിനിർണയമല്ല, കുറ്റക്കാരെന്ന് വിധിക്കുന്നതാണെന്ന് വ്യക്തമാക്കുന്നു; ‘അതിനെ’ എന്നത് ‘ഈ തലമുറ’യെ സൂചിപ്പിക്കുന്നു.
- source_word: μετενόησαν
  choice: മാനസാന്തരപ്പെട്ടു
  rationale: പ്രവാചകസന്ദർഭത്തിലെ ധാർമികവും ആത്മീയവുമായ തിരിഞ്ഞുവരവിനെ സ്വാഭാവികമായ ബൈബിൾ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: യോനായുടെ പ്രസംഗം കേട്ട്
  rationale: യോനായുടെ പ്രഖ്യാപനത്തോടുള്ള പ്രതികരണമായാണ് മാനസാന്തരം ഉണ്ടായതെന്ന εἰς പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള വ്യവഹാരസൂചകം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: യോനായെക്കാൾ മഹത്തായ ഒന്ന് ഇവിടെ ഉണ്ട്
  rationale: πλεῖον എന്ന നപുംസകലിംഗ രൂപം ‘ഒന്ന്’ എന്നതിലൂടെ നിലനിർത്തുന്നു; യേശുവിന്റെ വ്യക്തിയെ മാത്രം ചൂണ്ടുന്ന പുരുഷലിംഗ വ്യാഖ്യാനത്തിലേക്ക് വാചകത്തെ ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: πλεῖον Ἰωνᾶ എന്നതിന്റെ സൂചനയും വ്യാപ്തിയും
  choice: യോനായെക്കാൾ മഹത്തായ ഒന്ന് ഇവിടെ ഉണ്ട്
  alternative: യോനായെക്കാൾ മഹാനായ ഒരാൾ ഇവിടെ ഉണ്ട്; യോനായെക്കാൾ അധികം ഇവിടെ ഉണ്ട്
  rationale: ഗ്രീക്കിലെ πλεῖον നപുംസകലിംഗമാണ്. യേശു ഇവിടെ വ്യക്തമായി ഉൾപ്പെടുന്നുവെങ്കിലും, അവന്റെ വ്യക്തിയോടൊപ്പം അവനിൽ സന്നിഹിതമായ വലിയ വെളിപ്പാടിനെയോ രാജ്യയാഥാർഥ്യത്തെയോ ഈ രൂപം സൂചിപ്പിക്കാം. അതിനാൽ ആ ഉദ്ദേശ്യപൂർവമായ വിശാലത പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മാനസാന്തരപ്പെട്ടു,’ ‘ന്യായവിധി,’ ‘കുറ്റംവിധിക്കും’ തുടങ്ങിയ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ദൈവശാസ്ത്രപരമായ കൃത്യത നിലനിർത്തുന്നു. ഗ്രീക്കിലെ വാക്യപ്രവാഹം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി മൂന്ന് വാക്യങ്ങളാക്കി.
