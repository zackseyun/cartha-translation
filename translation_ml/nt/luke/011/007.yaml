translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ഉപമയുടെ സങ്കൽപ്പാത്മക ഘടന ‘പറഞ്ഞെന്നിരിക്കട്ടെ’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു; വാതിൽ ‘പൂട്ടിയിരിക്കുന്നു’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത വിവരം ചേർത്തിട്ടില്ല.
