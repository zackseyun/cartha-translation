source:
  edition: SBLGNT
  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: ml
  text: 'അവൻ അകത്തുനിന്ന് ഇങ്ങനെ മറുപടി പറഞ്ഞെന്നിരിക്കട്ടെ: “എന്നെ ബുദ്ധിമുട്ടിക്കരുത്.[a] വാതിൽ ഇതിനകം അടച്ചുകഴിഞ്ഞു;[b] എന്റെ കുട്ടികൾ എന്നോടൊപ്പം കിടക്കയിലാണ്.[c] എഴുന്നേറ്റ് നിനക്കു തരാൻ എനിക്കു കഴിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എനിക്കു പ്രയാസമുണ്ടാക്കരുത്” അല്ലെങ്കിൽ “എന്നെ ഇങ്ങനെ ശല്യപ്പെടുത്തിക്കൊണ്ടിരിക്കരുത്.” ഗ്രീക്ക് ശൈലിയുടെ അക്ഷരാർഥം “പ്രയാസങ്ങൾ വരുത്തുക” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വാതിൽ ഇതിനകം അടഞ്ഞുകിടക്കുന്നു.” ഗ്രീക്ക് perfect ക്രിയയ്ക്ക് വാതിൽ അടച്ച പ്രവൃത്തി പൂർത്തിയായതിനോ അതിന്റെ ഫലമായ അടഞ്ഞ അവസ്ഥയ്ക്കോ ഊന്നൽ നൽകാം.
    reason: lexical_alternative
  - marker: c
    text: “കിടക്കയിലാണ്” എന്നത് ഒരു വീട്ടിലെ അംഗങ്ങൾ പങ്കിട്ടിരുന്ന ഉറങ്ങാനുള്ള ഇടത്തെ സൂചിപ്പിക്കുന്നു; ദാമ്പത്യ അടുപ്പത്തെയല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος
  choice: അപ്പോൾ അയാൾ
  rationale: καί ചേർക്കുന്ന ആഖ്യാനബന്ധവും ἐκεῖνος സൂചിപ്പിക്കുന്ന മുൻപരാമർശിത വ്യക്തിയെയും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἔσωθεν
  choice: അകത്തുനിന്ന്
  rationale: പുറത്തു നിൽക്കുന്ന അപേക്ഷകനോടുള്ള സ്ഥലപരമായ വ്യത്യാസവും മറുപടി വരുന്ന ഉറവിടവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἀποκριθεὶς εἴπῃ
  choice: ഇങ്ങനെ മറുപടി പറഞ്ഞെന്നിരിക്കട്ടെ
  rationale: ‘മറുപടി പറഞ്ഞ് പറയുക’ എന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമാകുന്നതിനാൽ ‘മറുപടി പറയുക’ എന്നു സ്വാഭാവികമാക്കി; εἴπῃയുടെ സങ്കൽപ്പാത്മക/സാധ്യതാസൂചക ഭാവം ‘പറഞ്ഞെന്നിരിക്കട്ടെ’ വഴി നിലനിർത്തി.
- source_word: Μή μοι κόπους πάρεχε
  choice: എന്നെ ബുദ്ധിമുട്ടിക്കരുത്
  rationale: അക്ഷരാർഥത്തിൽ ‘എനിക്കു പ്രയാസങ്ങൾ വരുത്തരുത്’ എന്ന ആശയമുള്ള ഗ്രീക്ക് ശൈലിയുടെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἤδη ἡ θύρα κέκλεισται
  choice: വാതിൽ ഇതിനകം അടച്ചുകഴിഞ്ഞു
  rationale: പ്രവൃത്തി പൂർത്തിയായതും അതിന്റെ ഫലാവസ്ഥ ഇപ്പോഴും നിലനിൽക്കുന്നതും ഗ്രീക്ക് perfect രൂപം സൂചിപ്പിക്കുന്നു; ‘പൂട്ടി’ എന്നു പറയുന്നത് മൂലത്തിൽ ഇല്ലാത്ത അർഥം ചേർക്കും.
- source_word: τὰ παιδία μου
  choice: എന്റെ കുട്ടികൾ
  rationale: പ്രായം അനാവശ്യമായി കൃത്യമാക്കാതെ παιδίαയുടെ സാധാരണ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: എന്നോടൊപ്പം കിടക്കയിലാണ്
  rationale: കുടുംബം പങ്കിട്ടിരുന്ന ഉറങ്ങാനുള്ള ഇടത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ലൈംഗിക അർഥം സൂചിപ്പിക്കുന്നില്ല.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: എഴുന്നേറ്റ് നിനക്കു തരാൻ എനിക്കു കഴിയില്ല
  rationale: കൊടുക്കുന്നതിനു മുമ്പ് എഴുന്നേൽക്കേണ്ട പ്രവൃത്തിയെ attendant participle സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ നേരിട്ടുള്ള കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലും ‘എന്തെങ്കിലും’ എന്നു ചേർത്തിട്ടില്ല.
