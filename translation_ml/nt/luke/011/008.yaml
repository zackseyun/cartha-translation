id: LUK.11.8
reference: Luke 11:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളോടു പറയുന്നു: തന്നോടു ചോദിച്ചവൻ തന്റെ സുഹൃത്തായതുകൊണ്ട് അവൻ എഴുന്നേറ്റ് അവന് ഒന്നും കൊടുക്കാതിരുന്നാലും, അവന്റെ ലജ്ജയില്ലാത്ത നിർബന്ധം[a] നിമിത്തം അവൻ എഴുന്നേറ്റ് അവന് ആവശ്യമുള്ളതെല്ലാം കൊടുക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘അവന്റെ ധൈര്യം,’ ‘അവന്റെ ധാർഷ്ട്യം,’ അക്ഷരാർഥത്തിൽ ‘അവന്റെ ലജ്ജയില്ലായ്മ.’ ഇവിടെ ‘അവന്റെ’ എന്നു പറയുന്നത് അഭ്യർഥകനെയോ വീട്ടുടമയെയോ സൂചിപ്പിക്കാം.
    reason: ἀναίδεια എന്ന പദത്തിന്റെ അർഥപരിധിയും αὐτοῦ എന്ന സർവനാമത്തിന്റെ സാധ്യതയുള്ള സൂചനയും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ നേരിട്ടുള്ള പ്രസ്താവനയ്ക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള പ്രയോഗം.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ
  choice: അവന് ഒന്നും കൊടുക്കുകയില്ലെങ്കിലും
  rationale: εἰ καίയുടെ concessive force ‘-എങ്കിലും’കൊണ്ട് നിലനിർത്തുന്നു. മലയാളത്തിൽ വാക്യം പൂർണമാകാൻ സന്ദർഭത്തിൽ അന്തർലീനമായ കർമമായി ‘ഒന്നും’ ചേർത്തിരിക്കുന്നു.
- source_word: ἀναστὰς / ἐγερθεὶς
  choice: എഴുന്നേറ്റ് / എഴുന്നേറ്റ്
  rationale: ഇരുവിധ ഗ്രീക്ക് ക്രിയാപദങ്ങളും ഈ ഗാർഹികസന്ദർഭത്തിൽ കിടക്കയിൽനിന്ന് എഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഒരേ സ്വാഭാവിക പദം യോജിക്കുന്നു.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: അവൻ തന്റെ സുഹൃത്തായതുകൊണ്ട്
  rationale: അമൂർത്തമായ ‘സൗഹൃദം’ എന്നതിനുപകരം ഗ്രീക്കിലെ വ്യക്തിബന്ധവും കാരണാർഥവും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: διά γε
  choice: നിമിത്തമെങ്കിലും
  rationale: സൗഹൃദം പ്രവർത്തനത്തിന് കാരണമാകാത്തപ്പോഴും മറ്റൊരു കാരണം ഫലപ്രദമാകുന്നു എന്ന ഊന്നിയ വൈരുധ്യം പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀναίδειαν
  choice: ലജ്ജയില്ലാത്ത നിർബന്ധം
  rationale: പദത്തിന്റെ അടിസ്ഥാനമായ ‘ലജ്ജയില്ലായ്മ’ നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിലെ വിട്ടുകൊടുക്കാത്ത അഭ്യർഥനയുടെ ഭാവം ‘നിർബന്ധം’ വഴി വ്യക്തമാക്കുന്നു.
- source_word: ὅσων χρῄζει
  choice: അവന് ആവശ്യമുള്ളതെല്ലാം
  rationale: ആവശ്യമായ വസ്തുക്കളുടെ പൂർണ അളവ് ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള പരിഭാഷ.
theological_decisions:
- issue: ἀναίδεια എന്ന പദത്തിന്റെ അർഥവും αὐτοῦ എന്ന സർവനാമത്തിന്റെ സൂചനയും
  choice: ലജ്ജയില്ലാത്ത നിർബന്ധം
  alternative: ധൈര്യം; ധാർഷ്ട്യം; ലജ്ജയില്ലായ്മ; വീട്ടുടമയ്ക്ക് അപമാനം വരാതിരിക്കാനുള്ള പരിഗണന
  rationale: പരമ്പരാഗത സന്ദർഭവായനയിൽ ഇത് അഭ്യർഥകന്റെ സാമൂഹിക ലജ്ജ കണക്കാക്കാത്ത നിരന്തര ആവശ്യപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. എന്നാൽ ഗ്രീക്കിലെ αὐτοῦ ആരെ സൂചിപ്പിക്കുന്നു എന്നത് വ്യാകരണപരമായി പൂർണമായി നിർണ്ണയിക്കപ്പെടാത്തതിനാൽ മലയാളത്തിലെ ‘അവന്റെ’ ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; ദൈവം പരുഷതയെ പ്രതിഫലിപ്പിക്കുന്നു എന്ന ഉപദേശം വിവർത്തനം സ്വമേധയാ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന, എന്നാൽ dignified ആയ മലയാളം. ‘ലജ്ജയില്ലാത്ത നിർബന്ധം’ എന്ന പ്രയോഗം മൂലപദത്തിന്റെ കടുപ്പവും സന്ദർഭത്തിലെ നിരന്തര അഭ്യർഥനയും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
