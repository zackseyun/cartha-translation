id: LUK.11.1
reference: Luke 11:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: ml
  text: 'അവൻ ഒരിടത്ത് പ്രാർഥിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു. പ്രാർഥന നിർത്തിയപ്പോൾ, അവന്റെ ശിഷ്യന്മാരിൽ ഒരാൾ അവനോട് പറഞ്ഞു: “കർത്താവേ, യോഹന്നാൻ തന്റെ ശിഷ്യന്മാരെ പഠിപ്പിച്ചതുപോലെ ഞങ്ങളെയും പ്രാർഥിക്കാൻ പഠിപ്പിക്കണമേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: സംഭവിച്ചു എന്നത് പ്രത്യേകം ആവർത്തിക്കാതെ സ്വാഭാവികമായ ആഖ്യാനാരംഭം
  rationale: ലൂക്കോസിന്റെ സംഭവാവതരണ സൂത്രവാക്യത്തിന്റെ പ്രവർത്തനം മലയാളത്തിലെ വാക്യക്രമം സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘അങ്ങനെ സംഭവിച്ചു’ എന്ന അക്ഷരാർഥ രൂപം ഇവിടെ കൃത്രിമമാകും.
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: അവൻ ... പ്രാർഥിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: ἐν ചേർന്ന articular infinitive-ഉം വർത്തമാന participle-ഉം സൂചിപ്പിക്കുന്ന സമകാലികവും തുടരുന്നതുമായ പ്രവൃത്തി ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: ἐν τόπῳ τινὶ
  choice: ഒരിടത്ത്
  rationale: τινὶ നൽകുന്ന മനപ്പൂർവമായ അനിശ്ചിതത്വം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὡς ἐπαύσατο
  choice: പ്രാർഥന നിർത്തിയപ്പോൾ
  rationale: ἐπαύσατο എന്നതിന്റെ ‘നിർത്തുക/അവസാനിപ്പിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; സന്ദർഭം വ്യക്തമാക്കാൻ ‘പ്രാർഥന’ ചേർത്തിരിക്കുന്നു, എന്നാൽ ‘പൂർത്തിയാക്കിയപ്പോൾ’ എന്ന വ്യാഖ്യാനാത്മക അർഥം ഒഴിവാക്കുന്നു.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരിൽ ഒരാൾ
  rationale: partitive ഘടനയും τις എന്ന അനിശ്ചിതത്വവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന അഭിസംബോധനയുടെ ആദരസൂചകതയും പുതിയനിയമത്തിലെ പദപ്രാധാന്യവും നിലനിർത്തുന്നു; ‘ഗുരുവേ’ എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: ഞങ്ങളെയും പ്രാർഥിക്കാൻ പഠിപ്പിക്കണമേ
  rationale: infinitive complement നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; ‘എങ്ങനെ’ എന്ന ഗ്രീക്കിൽ ഇല്ലാത്ത ഘടകം ചേർക്കുന്നില്ല. മലയാളത്തിലെ വിനയപൂർവമായ അപേക്ഷയ്ക്ക് ‘പഠിപ്പിക്കണമേ’ സ്വാഭാവികമാണ്.
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: യോഹന്നാൻ തന്റെ ശിഷ്യന്മാരെ പഠിപ്പിച്ചതുപോലെ
  rationale: καθώς എന്ന താരതമ്യം ‘പോലെ’ കൊണ്ടു വ്യക്തമാക്കുന്നു. καίയുടെ ഉൾപ്പെടുത്തൽശക്തി മലയാളത്തിലെ ‘ഞങ്ങളെയും’ എന്ന സ്ഥാനത്ത് സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള അഭിസംബോധനയിൽ κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവേ
  alternative: ഗുരുവേ
  rationale: ‘കർത്താവേ’ എന്നത് പദത്തിന്റെ വിശാലമായ അർഥപരിധിയും ലൂക്കോസിലെ ശീർഷകപ്രാധാന്യവും സംരക്ഷിക്കുന്നു; ഈ സന്ദർഭത്തിൽ അതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം നിർബന്ധിച്ച് നിർണയിക്കാതെയും വെറും അധ്യാപകസംബോധനയായി ചുരുക്കാതെയും ഇരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പ്രാർഥന’ എന്ന നിലവാരരൂപം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ദീർഘമായ ആരംഭഘടന മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി, സമയബന്ധവും ആഖ്യാനഗതിയും വ്യക്തമായി നിലനിർത്തി.
