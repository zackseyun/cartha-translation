  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: ml
  text: പരീശന്മാരേ, നിങ്ങൾക്ക് അയ്യോ കഷ്ടം! കാരണം, സിനഗോഗുകളിലെ പ്രധാന ഇരിപ്പിടങ്ങളും[a] ചന്തസ്ഥലങ്ങളിലെ അഭിവാദനങ്ങളും[b] നിങ്ങൾ ഇഷ്ടപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മുഖ്യ ഇരിപ്പിടങ്ങൾ” അല്ലെങ്കിൽ “ബഹുമാനസ്ഥാനങ്ങൾ.”
    reason: lexical_alternative
  - marker: b
    text: സാമൂഹിക ബഹുമാനവും അംഗീകാരവും പ്രകടമാക്കിയിരുന്ന പരസ്യമായ അഭിവാദനങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: നിങ്ങൾക്ക് അയ്യോ കഷ്ടം!
  rationale: പ്രവാചകീയമായ അപലപനത്തിന്റെ ശക്തി നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: τοῖς Φαρισαίοις
  choice: പരീശന്മാരേ
  rationale: അവരെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ഭാവം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: അപലപനത്തിനുള്ള കാരണം തുടർന്നുവരുന്നതായി വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀγαπᾶτε
  choice: നിങ്ങൾ ഇഷ്ടപ്പെടുന്നു
  rationale: ഇവിടെ ദൈവശാസ്ത്രപരമായ സ്നേഹത്തേക്കാൾ പദവിയും പൊതുബഹുമാനവും ശക്തമായി ആഗ്രഹിക്കുന്നതാണു സന്ദർഭാർത്ഥം; ‘ഇഷ്ടപ്പെടുന്നു’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὴν πρωτοκαθεδρίαν
  choice: പ്രധാന ഇരിപ്പിടങ്ങൾ
  rationale: സിനഗോഗിൽ ഏറ്റവും ഉയർന്ന ബഹുമാനം സൂചിപ്പിച്ചിരുന്ന ഇരിപ്പിടങ്ങളെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ഏകവചനത്തെ മലയാളത്തിൽ പൊതുവായ വർഗസൂചനയായി ബഹുവചനത്തിൽ നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: സിനഗോഗുകളിൽ
  rationale: യഹൂദരുടെ സമ്മേളന-ആരാധനാലയത്തെ സൂചിപ്പിക്കുന്ന പതിവായ ആധുനിക മലയാളരൂപം.
- source_word: τοὺς ἀσπασμοὺς
  choice: അഭിവാദനങ്ങൾ
  rationale: പൊതുസ്ഥലങ്ങളിൽ ലഭിച്ചിരുന്ന ആദരസൂചകമായ വന്ദനങ്ങളെയും അഭിസംബോധനകളെയും ഉൾക്കൊള്ളുന്ന മാന്യവും സ്വാഭാവികവുമായ പദം.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ചന്തസ്ഥലങ്ങളിൽ
  rationale: വാണിജ്യത്തിന്റെയും പൊതുസാമൂഹിക ഇടപെടലിന്റെയും കേന്ദ്രമായിരുന്ന ἀγοράയുടെ പൊതുസ്ഥലഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ‘അയ്യോ കഷ്ടം’ എന്ന പ്രഖ്യാപനത്തിന്റെ സ്വഭാവം
  choice: പൊതുബഹുമാനത്തോടുള്ള പരീശന്മാരുടെ മോഹത്തിനെതിരായ പ്രവാചകീയ അപലപനം
  alternative: മോശം സാമൂഹിക പെരുമാറ്റത്തെക്കുറിച്ചുള്ള വെറും വിമർശനം
  rationale: οὐαί എന്ന പദവും തുടർന്ന് പറയുന്ന കാരണവും ചേർന്ന് ഇത് ശിഷ്ടാചാരത്തെക്കുറിച്ചുള്ള നിരീക്ഷണമാത്രമല്ല, ധാർമികവും ആത്മീയവുമായ അപലപനമാണെന്ന് വ്യക്തമാക്കുന്നു; അധിക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ ആ ശക്തി പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സിനഗോഗ്’ എന്ന പരിചിതമായ ചരിത്രപദം നിലനിർത്തി; വാക്യത്തിലെ സമാന്തര ഘടനയും പ്രവാചകീയ അപലപനത്തിന്റെ ശക്തിയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
