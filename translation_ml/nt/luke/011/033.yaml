id: LUK.11.33
reference: Luke 11:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: ml
  text: ആരും വിളക്കു കൊളുത്തിയിട്ട് അത് മറഞ്ഞ സ്ഥലത്തോ[a] അളവുപാത്രത്തിന്റെ[b] കീഴിലോ വെക്കാറില്ല; പകരം, അകത്തേക്കു വരുന്നവർ വെളിച്ചം കാണേണ്ടതിന് വിളക്കുതണ്ടിന്മേൽ വെക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിലവറയിൽ’ അല്ലെങ്കിൽ ‘രഹസ്യസ്ഥലത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം; κρύπτη എന്ന ഗ്രീക്കുപദം ഭൂഗർഭ സംഭരണസ്ഥലം ഉൾപ്പെടെയുള്ള ഒളിഞ്ഞ സ്ഥലത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ μόδιος; ഉണങ്ങിയ ധാന്യം അളക്കാനുള്ള ഒരു അളവും അതിനുപയോഗിച്ചിരുന്ന പാത്രവും. പരമ്പരാഗതമായി ‘ബുഷൽ’ അല്ലെങ്കിൽ ‘ബുഷൽ കൊട്ട’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: ആരും … ഇല്ല
  rationale: ഗ്രീക്കിലെ സാർവത്രിക നിഷേധം സ്വാഭാവികമായ മലയാള നിഷേധഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: λύχνον
  choice: വിളക്ക്
  rationale: ഇത് മെഴുകുതിരിയെയല്ല, കൈയിൽ കൊണ്ടുനടക്കാവുന്ന എണ്ണവിളക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വിളക്ക്’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: ἅψας
  choice: കൊളുത്തിയിട്ട്
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെന്ന aorist participle-ന്റെ ക്രമസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἰς κρύπτην
  choice: മറഞ്ഞ സ്ഥലത്ത്
  rationale: κρύπτη നിലവറയെയോ ഒളിഞ്ഞ സ്ഥലത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ പ്രത്യേക വാസ്തുഘടനയെക്കാൾ വെളിച്ചം മറച്ചുവെക്കുന്നതിലാണ് ഊന്നൽ.
- source_word: ὑπὸ τὸν μόδιον
  choice: അളവുപാത്രത്തിന്റെ കീഴിൽ
  rationale: μόδιος ഒരു ഉണങ്ങിയ ധാന്യ അളവും ആ അളവിനുള്ള പാത്രവും സൂചിപ്പിക്കുന്നു. പൊതുവായ ‘കൊട്ട’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ അളവുസംബന്ധമായ അർഥം ഇത് നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: വിളക്കുതണ്ടിന്മേൽ
  rationale: λυχνία വിളക്ക് ഉയർത്തിവെക്കുന്ന തണ്ടിനെയോ പീഠത്തെയോ സൂചിപ്പിക്കുന്നു; ‘വിളക്കുതണ്ട്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന കൃത്യമായ പദമാണ്.
- source_word: οἱ εἰσπορευόμενοι
  choice: അകത്തേക്കു വരുന്നവർ
  rationale: വർത്തമാനകാല substantival participle സൂചിപ്പിക്കുന്ന, അകത്തു പ്രവേശിക്കുന്ന ആളുകളെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸ φέγγος
  choice: വെളിച്ചം
  rationale: വിളക്കിൽനിന്നുള്ള പ്രകാശത്തെ സൂചിപ്പിക്കുന്ന ഏറ്റവും സ്വാഭാവികമായ മലയാളപദം.
- source_word: βλέπωσιν
  choice: കാണേണ്ടതിന്
  rationale: ἵναയോടുകൂടിയ subjunctive-ന്റെ ഉദ്ദേശ്യാർഥം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: κρύπτη എന്ന പദത്തിന്റെ വ്യാഖ്യാനം
  choice: പൊതുവായ ‘മറഞ്ഞ സ്ഥലം’
  alternative: നിലവറ; രഹസ്യസ്ഥലം; സംഭരണമുറി
  rationale: ഉപമയുടെ ഊന്നൽ വെളിച്ചത്തെ മറച്ചുവെക്കുന്നതിലെ അസംബന്ധതയിലാണ്; ഒരു പ്രത്യേക മുറിയായി പരിമിതപ്പെടുത്താതെ മൂലത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: μόδιος എന്ന പദത്തിന്റെ അവതരണം
  choice: അളവുപാത്രം
  alternative: അളവുകൊട്ട; ബുഷൽ കൊട്ട; കൊട്ട
  rationale: മൂലപദത്തിലെ അളവുസംബന്ധമായ ഘടകം നിലനിർത്തുന്നതിനൊപ്പം വിളക്ക് മൂടുന്ന ഒരു പാത്രമെന്ന ദൃശ്യവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പതിവായ പ്രവൃത്തിയെ സൂചിപ്പിക്കാൻ ‘വെക്കാറില്ല’ ഉപയോഗിച്ചു. ആശയബന്ധം വ്യക്തമാക്കാൻ ἀλλά എന്ന ശക്തമായ വിരോധം ‘പകരം’ എന്നു നൽകി; ഉദ്ദേശ്യവാക്യം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ പ്രധാന ക്രിയയ്ക്കു മുമ്പായി വെച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
