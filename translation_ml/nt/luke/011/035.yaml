translation:
  language: ml
  text: അതുകൊണ്ട്, നിന്നിലുള്ള വെളിച്ചം ഇരുട്ടായിരിക്കാതിരിക്കാൻ സൂക്ഷിക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിന്നിലുള്ള വെളിച്ചം ഇരുട്ടല്ലെന്ന് ഉറപ്പുവരുത്തുക.”'
    reason: σκόπει μή എന്ന പ്രയോഗത്തെ മുന്നറിയിപ്പായോ ‘ഉറപ്പുവരുത്തുക’ എന്ന നിർദേശമായോ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: σκόπει
  choice: സൂക്ഷിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ തുടർച്ചയായ ജാഗ്രതയും മുന്നറിയിപ്പിന്റെ ശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: കണ്ണിനെയും വെളിച്ചത്തെയും കുറിച്ചുള്ള മുൻവാക്യങ്ങളിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: μὴ
  choice: ആയിരിക്കാതിരിക്കാൻ
  rationale: ആജ്ഞയോടുചേർന്നുള്ള μή അഭിലഷണീയമല്ലാത്ത സാധ്യതയെക്കുറിച്ചുള്ള മുന്നറിയിപ്പാണ്; മലയാളത്തിൽ ഈ രൂപം ആ ജാഗ്രതാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ φῶς
  choice: വെളിച്ചം
  rationale: വെളിച്ചം–ഇരുട്ട് വൈരുധ്യവും രൂപകത്തിന്റെ വ്യാപ്തിയും അതേപടി നിലനിർത്തുന്നു.
- source_word: τὸ ἐν σοὶ
  choice: നിന്നിലുള്ള
  rationale: ഏകവചനത്തിലുള്ള അഭിസംബോധന കാത്തുസൂക്ഷിക്കുകയും മനസ്സ്, മനസ്സാക്ഷി, ആത്മീയാവസ്ഥ എന്നിവയിൽ ഒന്നായി അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: σκότος
  choice: ഇരുട്ട്
  rationale: സമീപസന്ദർഭത്തിലെ വെളിച്ചം–ഇരുട്ട് രൂപകവും അതിന്റെ ധാർമികവും ആത്മീയവുമായ സാധ്യതകളും നിലനിർത്തുന്നു.
- source_word: ἐστίν
  choice: ആയിരിക്കുക
  rationale: ഗ്രീക്കിലെ ലളിതമായ സംയോജകക്രിയയുടെ നിലനില്പ് അർഥം സംരക്ഷിക്കുന്നു; ‘ആകുക’ എന്ന മാറ്റത്തിന്റെ ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘വെളിച്ചം’, ‘ഇരുട്ട്’ എന്നീ രൂപകങ്ങളുടെ അർഥം
  choice: രൂപകങ്ങളെ വിശദീകരിക്കാതെ പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘നിന്നിലുള്ള തിരിച്ചറിവ്’, ‘നിന്റെ മനസ്സാക്ഷി’, അല്ലെങ്കിൽ ‘നിന്റെ ആത്മീയ വെളിച്ചം’ എന്ന് വ്യക്തമാക്കുക.
  rationale: സന്ദർഭത്തിൽ ഈ ദൃശ്യം ഗ്രഹണം, ആന്തരികാവസ്ഥ, ധാർമികമോ ആത്മീയമോ ആയ യാഥാർഥ്യം എന്നിവയെ സ്പർശിക്കാമെങ്കിലും ഗ്രീക്ക് അവയിൽ ഒന്നിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- issue: വെളിച്ചം ഇരുട്ടായിരിക്കുന്നതിലെ ഉദ്ദേശ്യപൂർവമായ വിരോധാഭാസം
  choice: ‘നിന്നിലുള്ള വെളിച്ചം ഇരുട്ടായിരിക്കാതിരിക്കാൻ’ എന്ന വിരോധാഭാസം സംരക്ഷിച്ചു.
  alternative: ‘വെളിച്ചമെന്നു നീ കരുതുന്നത് യഥാർഥത്തിൽ ഇരുട്ടാകാതിരിക്കാൻ’ എന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുക.
  rationale: മൂലപാഠത്തിലെ ശക്തമായ ദൈവശാസ്ത്രപരവും നൈതികവുമായ സംഘർഷം വിശദീകരണത്തിലൂടെ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഏകവചന അഭിസംബോധന ഉപയോഗിച്ചു. ‘സൂക്ഷിക്കുക’ മുന്നറിയിപ്പിന്റെ ശക്തി നൽകുന്നു; ‘വെളിച്ചം’, ‘ഇരുട്ട്’ എന്നീ സാധാരണ പദങ്ങൾ രൂപകത്തെ വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
