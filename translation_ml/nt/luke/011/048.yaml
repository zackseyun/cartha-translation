source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങൾ നിങ്ങളുടെ പിതാക്കന്മാരുടെ പ്രവൃത്തികൾക്കു സാക്ഷികളുമാണ്, അവയെ അംഗീകരിക്കുന്നവരുമാണ്; അവർ പ്രവാചകന്മാരെ കൊന്നു, നിങ്ങളോ അവരുടെ കല്ലറകൾ പണിയുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന പ്രവാചകന്മാരുടെ കല്ലറകൾ.
    reason: cross_reference
lexical_decisions:
- source_word: ἄρα
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ കുറ്റാരോപണത്തിൽനിന്നുള്ള നിഗമനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μάρτυρές ἐστε
  choice: സാക്ഷികളായിരിക്കുന്നു
  rationale: നാമപ്രയോഗത്തിന്റെ രൂപവും, അവരുടെ പ്രവൃത്തികൾ തന്നെ അവർക്കെതിരായ സാക്ഷ്യമാകുന്നു എന്ന സന്ദർഭാർഥവും നിലനിർത്തുന്നു.
- source_word: συνευδοκεῖτε
  choice: അവയെ അംഗീകരിക്കുന്നു
  rationale: പൂർവികരുടെ പ്രവൃത്തികളോടുള്ള സമ്മതവും ധാർമികമായ അനുകൂലനവും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: τοῖς ἔργοις τῶν πατέρων ὑμῶν
  choice: നിങ്ങളുടെ പിതാക്കന്മാരുടെ പ്രവൃത്തികൾ
  rationale: ἔργοις എന്നതിന്റെ പ്രവർത്തനാർഥവും πατέρων എന്ന കുടുംബബന്ധമുള്ള വാഗ്‌ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: അവർ പ്രവാചകന്മാരെ കൊന്നു
  rationale: രണ്ടാമത്തെ αὐτούς ആരെ സൂചിപ്പിക്കുന്നു എന്നത് മുൻവാക്യത്തിൽനിന്ന് വ്യക്തമായതിനാൽ, സാധാരണ വായനക്കാർക്കായി ‘പ്രവാചകന്മാരെ’ എന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: നിങ്ങളോ അവരുടെ കല്ലറകൾ പണിയുന്നു
  rationale: μέν...δέ എന്ന തലമുറകൾക്കിടയിലെ ശക്തമായ വൈരുധ്യം ‘നിങ്ങളോ’ എന്നു നൽകുന്നു; ‘കല്ലറകൾ’ എന്ന കർമം മുൻവാക്യത്തിൽനിന്ന് പൂർത്തിയാക്കുന്നു.
theological_decisions:
- issue: οἰκοδομεῖτε എന്ന ക്രിയയുടെ സൂചിത കർമം പ്രധാനപാഠത്തിൽ ചേർക്കണമോ
  choice: മുൻവാക്യത്തിൽനിന്ന് ‘അവരുടെ കല്ലറകൾ’ എന്ന് പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുന്നു.
  alternative: കർമം ചേർക്കാതെ ‘നിങ്ങളോ പണിയുന്നു’ എന്നു മാത്രം നൽകുക.
  rationale: ഗ്രീക്കിൽ കർമം ആവർത്തിച്ചിട്ടില്ലെങ്കിലും ലൂക്കോസ് 11:47-ൽ അത് പ്രവാചകന്മാരുടെ കല്ലറകളാണെന്ന് വ്യക്തമാണ്. മലയാളത്തിൽ കർമമില്ലാത്ത ‘പണിയുന്നു’ അസ്വാഭാവികവും അപൂർണ്ണവുമായി തോന്നുന്നതിനാൽ സന്ദർഭത്തിൽ ഉറപ്പുള്ള കർമം ചേർക്കുന്നത് അർഥം മാറ്റാതെ വായനാസൗകര്യം നൽകുന്നു.
- issue: സാക്ഷികളാകുന്നതും അംഗീകരിക്കുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടും ഏകോപിതമായ കുറ്റാരോപണങ്ങളായി നിലനിർത്തുന്നു.
  alternative: ‘സാക്ഷ്യം നൽകി അംഗീകരിക്കുന്നു’ എന്ന ഒറ്റ ആശയമായി ലയിപ്പിക്കുക.
  rationale: καί രണ്ടു ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ പ്രസ്താവനകളെ ബന്ധിപ്പിക്കുന്നു; അവരുടെ പ്രവൃത്തി സാക്ഷ്യവും പൂർവികരുടെ പ്രവൃത്തിക്കുള്ള അംഗീകാരവും ആകുന്നു എന്ന പാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘പിതാക്കന്മാർ’ എന്ന പദം ഗ്രീക്കിലെ കുടുംബപരവും വാഗ്‌ശക്തിയുള്ളതുമായ പ്രയോഗം നിലനിർത്തുന്നു. പ്രധാനപാഠത്തിലെ [a] അടയാളം വിശദീകരണക്കുറിപ്പുമായി പൊരുത്തപ്പെടുത്തിയിരിക്കുന്നു.
