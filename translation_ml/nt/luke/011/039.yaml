  to: 'എന്നാൽ കർത്താവ് അവനോടു പറഞ്ഞു: “ഇപ്പോൾ നിങ്ങൾ പരീശന്മാർ പാനപാത്രത്തിന്റെയും തളികയുടെയും പുറം വൃത്തിയാക്കുന്നു; എന്നാൽ നിങ്ങളുടെ ഉള്ളിൽ കവർച്ചയും[a] ദുഷ്ടതയും നിറഞ്ഞിരിക്കുന്നു.”'
  rationale: പ്രധാനപാഠത്തിലെ കൃത്രിമവും അധികവ്യാഖ്യാനപരവുമായ ‘കവർച്ചാഭിലാഷം’ എന്ന പദം ‘കവർച്ച’ എന്ന നേരിട്ടുള്ള രൂപത്തിലാക്കി. അതിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ നിലനിർത്തി. ‘നിങ്ങളുടെ ഉള്ളിൽ’ എന്ന പ്രയോഗം പുറം–ഉള്ള് രൂപകം സംരക്ഷിച്ചുകൊണ്ട് വാക്യത്തെ സ്വാഭാവിക ആധുനിക മലയാളത്തിലാക്കി.
