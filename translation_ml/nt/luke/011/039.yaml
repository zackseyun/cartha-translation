id: LUK.11.39
reference: Luke 11:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: ml
  text: 'എന്നാൽ കർത്താവ് അവനോടു പറഞ്ഞു: “ഇപ്പോൾ നിങ്ങൾ പരീശന്മാർ പാനപാത്രത്തിന്റെയും തളികയുടെയും പുറം വൃത്തിയാക്കുന്നു; എന്നാൽ നിങ്ങളുടെ ഉള്ളിൽ കവർച്ചയും[a] ദുഷ്ടതയും നിറഞ്ഞിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൊള്ള,” “പിടിച്ചുപറി,” അല്ലെങ്കിൽ “ചൂഷണം.”
    reason: ἁρπαγή എന്ന പദത്തിന് കവർച്ചാപരമായ കൈക്കലാക്കൽ, കൊള്ള, അല്ലെങ്കിൽ ചൂഷണപരമായ പിടിച്ചെടുക്കൽ എന്നീ അർഥങ്ങൾ വരാം.
lexical_decisions:
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ഇവിടെ κύριος യേശുവിനെ സൂചിപ്പിക്കുന്ന പുതിയനിയമത്തിലെ പതിവായ ബഹുമാനപദവിയാണ്; വെറും മര്യാദാപൂർവമായ അഭിസംബോധനയല്ല.
- source_word: Νῦν
  choice: ഇപ്പോൾ
  rationale: യേശുവിന്റെ മൂർച്ചയുള്ള ശാസനയ്ക്ക് തുടക്കം കുറിക്കുന്ന പ്രഭാഷണസൂചകം നിലനിർത്തുന്നു.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: നിങ്ങൾ പരീശന്മാർ
  rationale: സർവനാമവും നാമവും ചേർന്നുള്ള ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὸ ἔξωθεν
  choice: പുറം
  rationale: പാത്രങ്ങളുടെ പുറംഭാഗത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: ποτηρίου
  choice: പാനപാത്രം
  rationale: ποτήριον എന്നതിന്റെ സാധാരണവും മാന്യവുമായ മലയാളരൂപം.
- source_word: πίνακος
  choice: തളിക
  rationale: ഭക്ഷണം വിളമ്പുന്ന പാത്രം/തട്ട് എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καθαρίζετε
  choice: വൃത്തിയാക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള പതിവുപ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: നിങ്ങളുടെ അകം
  rationale: പുറത്തെ ശുചീകരണവും ഉള്ളിലെ ധാർമിക മലിനതയും തമ്മിലുള്ള രൂപകവിരോധം നിലനിർത്തുന്നു; ‘ഹൃദയം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: γέμει
  choice: നിറഞ്ഞിരിക്കുന്നു
  rationale: തുടർന്നുനിൽക്കുന്ന അവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἁρπαγῆς
  choice: കവർച്ചാഭിലാഷം
  rationale: ἁρπαγήയിലെ പിടിച്ചുപറിക്കലിന്റെയും കൊള്ളയടിക്കുന്ന അത്യാഗ്രഹത്തിന്റെയും ഘടകങ്ങൾ ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; ‘ലോഭം’ മാത്രം ഉപയോഗിക്കുന്നതിനെക്കാൾ സ്രോതസ്സിന്റെ കഠിനത നിലനിർത്തുന്നു.
- source_word: πονηρίας
  choice: ദുഷ്ടത
  rationale: വ്യാപകമായ ധാർമിക തിന്മയെ ഗൗരവത്തോടെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം.
theological_decisions:
- issue: ‘അകം’ എന്ന രൂപകത്തിന്റെ സൂചിതാർഥം
  choice: ‘നിങ്ങളുടെ അകം’ എന്ന രൂപകം അതേപടി നിലനിർത്തി.
  alternative: ‘നിങ്ങളുടെ ഹൃദയം’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ അന്തരാത്മാവ്’
  rationale: ഗ്രീക്ക് വാക്യം പുറത്തെ ശുദ്ധീകരണത്തെയും ഉള്ളിലെ അഴിമതിയെയും നേരിട്ട് വിരുദ്ധമായി നിർത്തുന്നു. പ്രത്യേകമായ മാനസികമോ ആത്മീയമോ ആയ ഘടകം ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- issue: ἁρπαγήയുടെ ധാർമികവും പ്രവർത്തനപരവുമായ അർഥവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘കവർച്ചാഭിലാഷം’; അടിക്കുറിപ്പിൽ പ്രവർത്തനപരമായ മറ്റു അർഥങ്ങൾ.
  alternative: ‘ലോഭം’, ‘കവർച്ച’, ‘കൊള്ള’, അല്ലെങ്കിൽ ‘പിടിച്ചുപറി’ മാത്രം
  rationale: ഈ നാമം അത്യാഗ്രഹത്തെയും മറ്റുള്ളവരിൽനിന്ന് ബലമായി കൈക്കലാക്കുന്നതിനെയും സൂചിപ്പിക്കാം. തിരഞ്ഞെടുത്ത പദം ഉള്ളിലെ ദുർവാഞ്ഛയും ചൂഷണപരമായ സ്വഭാവവും ബന്ധിപ്പിക്കുമ്പോൾ അടിക്കുറിപ്പ് യഥാർഥ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ പുറം–അകം വിരോധം വ്യക്തമായി നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട പദത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
