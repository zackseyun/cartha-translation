id: LUK.11.11
reference: Luke 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: ml
  text: നിങ്ങളിൽ ഏതു പിതാവ്, മകൻ ഒരു മീൻ ചോദിച്ചാൽ, മീനിനു പകരം അവന് ഒരു പാമ്പിനെ[a] കൊടുക്കും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സർപ്പത്തെ.’
    reason: ὄφις എന്ന ഗ്രീക്കുപദത്തിന് കൂടുതൽ സാഹിത്യപരമായ ‘സർപ്പം’ എന്ന പരിഭാഷയും സാധ്യമാണ്.
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: നിങ്ങളിൽ ഏതു പിതാവാണ്
  rationale: ശ്രോതാക്കളിൽ അങ്ങനെ ചെയ്യുന്ന ഒരു പിതാവെങ്കിലും ഉണ്ടോ എന്ന ഗ്രീക്കിലെ ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αἰτήσει
  choice: ചോദിച്ചാൽ
  rationale: ഭാവികാല ക്രിയയായിരുന്നാലും ഈ ആലങ്കാരിക ചോദ്യത്തിൽ സോപാധികമായ അർഥമാണ് പ്രവർത്തിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചാൽ’ സ്വാഭാവികമാണ്.
- source_word: ὁ υἱὸς
  choice: മകൻ
  rationale: സന്ദർഭം പിതാവും മകനും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ അധിക ഉടമസ്ഥസർവനാമം ചേർക്കാതെ ബന്ധാർഥം നിലനിൽക്കുന്നു.
- source_word: ἰχθύν / ἰχθύος
  choice: ഒരു മീൻ / മീനിനു
  rationale: ഗ്രീക്കിലെ ഏകവചനത്തിലുള്ള മൂർത്തമായ ഉദാഹരണം നിലനിർത്തുന്നു.
- source_word: ἀντὶ
  choice: പകരം
  rationale: ഒന്നിന്റെ സ്ഥാനത്ത് മറ്റൊന്ന് നൽകുന്ന പ്രതിസ്ഥാപനാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ὄφιν
  choice: ഒരു പാമ്പിനെ
  rationale: ὄφις എന്ന പദത്തിന്റെ സാധാരണവും ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്; അനാവശ്യമായ പ്രതീകാർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: αὐτῷ ἐπιδώσει
  choice: അവന് ... കൊടുക്കുക
  rationale: കൈമാറിക്കൊടുക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ഗ്രീക്കിലെ സ്വീകർത്താവിനെ വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ആലങ്കാരിക ചോദ്യത്തിന്റെ രൂപവും പിതാവ്–മകൻ ബന്ധവും മീനിനു പകരം പാമ്പ് നൽകുന്നതിലെ വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു.
