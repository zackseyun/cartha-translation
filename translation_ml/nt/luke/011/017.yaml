reference: Luke 11:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: ml
  text: 'എന്നാൽ അവരുടെ ചിന്തകൾ അറിഞ്ഞ അവൻ അവരോടു പറഞ്ഞു: “തനിക്കുതന്നെ എതിരായി വിഭജിക്കപ്പെട്ട ഓരോ രാജ്യവും പാഴായിത്തീരുന്നു; വീടിന്മേൽ വീട് വീഴുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു കുടുംബം മറ്റൊരു കുടുംബത്തിനെതിരെ വീഴുന്നു.” οἶκος എന്ന ഗ്രീക്കുപദത്തിന് ഭൗതികമായ ‘വീട്’ എന്നും ‘കുടുംബം/വീട്ടുകാർ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: അറിഞ്ഞ
  rationale: സന്ദർഭത്തിൽ ഉള്ളിലെ ചിന്തകളെക്കുറിച്ചുള്ള ബോധമാണ് സൂചിപ്പിക്കുന്നത്. പ്രധാന ക്രിയയോടുള്ള കൃതന്തബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: διανοήματα
  choice: ചിന്തകൾ
  rationale: മനസ്സിലെ ആലോചനകളെയോ വിചാരങ്ങളെയോ സൂചിപ്പിക്കുന്ന പൊതുവായ, വ്യക്തമായ പദം; ദുഷ്ടമായ ഉദ്ദേശ്യം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: Πᾶσα βασιλεία
  choice: എല്ലാ രാജ്യവും
  rationale: πᾶσα എന്നതിന്റെ വിതരണാത്മകമായ പൊതുവാക്യസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ἐφ’ ἑαυτὴν
  choice: തനിക്കുതന്നെ എതിരായി
  rationale: വെറും വിഭജനം മാത്രമല്ല, രാജ്യത്തിനുള്ളിലെ സ്വയംവിരുദ്ധമായ സംഘർഷവും വ്യക്തമാക്കുന്നു.
- source_word: διαμερισθεῖσα
  choice: വിഭജിക്കപ്പെട്ട
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയ കൃതന്തരൂപവും ആഭ്യന്തര വിഭജനവും സംരക്ഷിക്കുന്നു.
- source_word: ἐρημοῦται
  choice: ശൂന്യമായിത്തീരുന്നു
  rationale: നാശവും വിജനാവസ്ഥയും സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ഗൗരവം നിലനിർത്തുകയും പൊതുവാക്യത്തിന്റെ വർത്തമാനകാലഭാവം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οἶκος ἐπὶ οἶκον
  choice: വീടിന്മേൽ വീട്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും ദൃശ്യാത്മകവുമായ പ്രയോഗം അതേ ക്രമത്തിൽ നിലനിർത്തുന്നു; οἶκος എന്നതിന് കുടുംബം/വീട്ടുകാർ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πίπτει
  choice: വീഴുന്നു
  rationale: രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ലളിതമായ വർത്തമാനകാലക്രിയയായി നൽകുന്നു.
theological_decisions:
- issue: പഴമൊഴിയുടെ രണ്ടാം ഭാഗത്തിലെ οἶκος എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘വീട്’ എന്ന് ദൃശ്യാർഥത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഒരു കുടുംബം മറ്റൊരു കുടുംബത്തിനെതിരായി വീഴുന്നു’ അഥവാ ‘വീട്ടുകാർ വീട്ടുകാർക്കെതിരായി വീഴുന്നു’.
  rationale: οἶκος ഭൗതികമായ വീടിനെയും കുടുംബം/വീട്ടുകാരെയും സൂചിപ്പിക്കാം. സന്ദർഭം സാമൂഹിക അർഥത്തെ അനുവദിക്കുന്നുവെങ്കിലും അത് നിർബന്ധിക്കുന്നില്ല; അതിനാൽ മുഖ്യപാഠം ദൃശ്യരൂപം സംരക്ഷിക്കുകയും മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വീടിന്മേൽ വീട് വീഴുന്നു’ എന്ന സംക്ഷിപ്ത ഘടന ഗ്രീക്ക് പഴമൊഴിയുടെ ദൃശ്യവും ഉദ്ദേശപൂർവമായ അസ്പഷ്ടതയും നിലനിർത്തുന്നു.
