base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ml
  text: കാരണം, ചോദിക്കുന്ന ഏവനും ലഭിക്കുന്നു; അന്വേഷിക്കുന്നവൻ കണ്ടെത്തുന്നു; മുട്ടുന്നവന് തുറക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, സന്ദർഭം കൂടുതൽ വ്യക്തമാക്കുന്നതുപോലെ: ‘മുട്ടുന്നവന് വാതിൽ തുറക്കപ്പെടും.’ ഗ്രീക്കിൽ എന്താണ് തുറക്കപ്പെടുന്നതെന്ന് വ്യക്തമാക്കിയിട്ടില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: ഏവനും
  rationale: Substantival participle-നോടൊപ്പം വിതരണാത്മകമായ സർവവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രബോധനത്തിന് ഈ വാക്യം നൽകുന്ന വിശദീകരണബന്ധം നിലനിർത്തുന്നു.
- source_word: ὁ αἰτῶν
  choice: ചോദിക്കുന്ന
  rationale: ആവർത്തനാത്മകമോ സ്വഭാവസൂചകമോ ആയ വർത്തമാനകാല കൃദന്തരൂപം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: λαμβάνει
  choice: ലഭിക്കുന്നു
  rationale: അപേക്ഷയ്ക്ക് മറുപടിയായി ലഭിക്കുന്നതിനെ മാന്യവും സാധാരണവുമായ ഭാഷയിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ ζητῶν
  choice: അന്വേഷിക്കുന്നവൻ
  rationale: തുടരുന്ന അല്ലെങ്കിൽ പൊതുവായ അന്വേഷിക്കൽ എന്ന കൃദന്തരൂപത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: εὑρίσκει
  choice: കണ്ടെത്തുന്നു
  rationale: ഈ സൂക്തിസദൃശ ത്രയത്തിൽ നേരിട്ടും സ്വാഭാവികമായും അർത്ഥം നൽകുന്നു.
- source_word: τῷ κρούοντι
  choice: മുട്ടുന്നവനുവേണ്ടി
  rationale: ദാതൃവിഭക്തിയും passive ἀνοιγήσεται-യുമായുള്ള ബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἀνοιγήσεται
  choice: തുറക്കപ്പെടും
  rationale: ഗ്രീക്കിലെ ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുകയും പറയാതിരിക്കുന്ന കർമത്തെ മുഖ്യവാചകത്തിൽ അനാവശ്യമായി പൂരിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വാഗ്ദാനത്തിന്റെ സർവവ്യാപ്തിയും ശക്തിയും
  choice: പ്രസ്താവനയെ അധിക യോഗ്യതകൾ ചേർക്കാതെ പൊതുവായ സർവവ്യാപക തത്ത്വമായി പരിഭാഷപ്പെടുത്തുക.
  alternative: ‘ശരിയായി ചോദിക്കുന്ന ഏവനും’ പോലുള്ള വ്യാഖ്യാനപരമായ നിബന്ധന ചേർക്കുക, അല്ലെങ്കിൽ അതിശയോക്തിപരമായ പ്രോത്സാഹനമായി വ്യക്തമാക്കുക.
  rationale: പ്രാർത്ഥനയെക്കുറിച്ചുള്ള പ്രബോധനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഗ്രീക്ക് വാചകം നിബന്ധനകളില്ലാത്ത സർവവ്യാപക സൂക്തമായി നിലകൊള്ളുന്നു; അതിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഭാഷയിൽ പരിഹരിക്കരുത്.
- issue: ἀνοιγήσεται എന്ന ക്രിയയുടെ പറയാതിരിക്കുന്ന കർമം
  choice: മുഖ്യവാചകത്തിൽ കർമം ചേർക്കാതെ ‘തുറക്കപ്പെടും’ എന്ന് നൽകുക.
  alternative: സന്ദർഭാനുസൃതമായി ‘വാതിൽ തുറക്കപ്പെടും’ എന്ന് നൽകുക.
  rationale: വാതിലാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം കർമം വ്യക്തമാക്കുന്നില്ല; ആ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ചോദിക്കുക—അന്വേഷിക്കുക—മുട്ടുക’ എന്ന ത്രയത്തിന്റെ സമാന്തരഘടനയും വർത്തമാനകാല പൊതുസത്യത്തിന്റെ ഭാവവും സംരക്ഷിച്ചു.
