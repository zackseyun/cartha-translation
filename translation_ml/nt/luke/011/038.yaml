source:
  edition: SBLGNT
  text: ὁ δὲ Φαρισαῖος ἰδὼν ἐθαύμασεν ὅτι οὐ πρῶτον ἐβαπτίσθη πρὸ τοῦ ἀρίστου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: ml
  text: എന്നാൽ പരീശൻ അത് കണ്ടപ്പോൾ, യേശു ഭക്ഷണത്തിനു മുമ്പ് ആദ്യം കഴുകിക്കൊള്ളാതിരുന്നതിൽ വിസ്മയിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭക്ഷണത്തിനു മുമ്പ് ആദ്യം ആചാരപരമായ കഴുകൽ നടത്തിയിരുന്നില്ല.” ഇവിടെ “കഴുകിക്കൊള്ളുക” എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് ക്രിയ പലപ്പോഴും “സ്നാനം സ്വീകരിക്കുക” എന്ന അർഥത്തിലും ഉപയോഗിക്കുന്നു; എന്നാൽ ഇവിടെ അത് പരീശരുടെ ശുദ്ധാചാരപ്രകാരമുള്ള കഴുകലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ സംഭവത്തോടുള്ള പരീശന്റെ പ്രതികരണത്തിൽ വരുന്ന മൃദുവായ വൈരുധ്യവും കഥയുടെ പുരോഗതിയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Φαρισαῖος
  choice: പരീശൻ
  rationale: കൂട്ടവിഭാഗനാമത്തിന്റെ സാധാരണ മലയാളരൂപം; ഗ്രീക്കിലെ നിർദേശക ആർട്ടിക്കിളിന്റെ നിർദിഷ്ടത സന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: ἰδὼν
  choice: അതു കണ്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള കാഴ്ചയും അതിന്റെ സമയബന്ധവും വ്യക്തമാക്കുന്നു; ‘അതു’ എന്നത് മുൻസന്ദർഭത്തിലെ യേശുവിന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐθαύμασεν
  choice: വിസ്മയിച്ചു
  rationale: പ്രതീക്ഷിക്കാത്ത പ്രവൃത്തിയോടുള്ള അതിശയപ്രതികരണം dignified modern Malayalam-ൽ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭം അതിൽ അസമ്മതത്തിന്റെ നിഴൽ നൽകുന്നു.
- source_word: οὐ πρῶτον
  choice: ആദ്യം … ഇല്ലല്ലോ എന്നു
  rationale: ഭക്ഷണത്തിനു മുൻപ് ചെയ്യണമെന്ന് പ്രതീക്ഷിച്ചിരുന്ന പ്രവൃത്തി നടന്നില്ലെന്ന പരീശന്റെ വിസ്മയത്തെ സ്വാഭാവിക മലയാള പരോക്ഷവാക്യത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐβαπτίσθη
  choice: ആചാരപ്രകാരം കഴുകിയില്ല
  rationale: ഇവിടെ ക്രിയ പരീശരുടെ ശുദ്ധാചാരവുമായി ബന്ധപ്പെട്ട കഴുകലിനെയാണ് സൂചിപ്പിക്കുന്നത്, ക്രിസ്തീയ സ്നാനത്തെയല്ല. ‘ആചാരപ്രകാരം’ എന്നത് സന്ദർഭാർഥം വ്യക്തമാക്കുമ്പോൾ അടിക്കുറിപ്പ് ക്രിയയുടെ വിശാലമായ പദബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: πρὸ τοῦ ἀρίστου
  choice: ഭക്ഷണത്തിനു മുമ്പ്
  rationale: ἄριστον രാവിലെയോ ഉച്ചയ്ക്കോ ഉള്ള ഭക്ഷണത്തെ സൂചിപ്പിക്കാമെന്നതിനാൽ സമയം അനാവശ്യമായി നിർണ്ണയിക്കാതെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പരീശരുടെ ഭക്ഷണസന്ദർഭത്തിൽ ἐβαπτίσθη എന്നതിന്റെ അർഥം
  choice: ഭക്ഷണത്തിനു മുമ്പുള്ള ആചാരപരമായ കഴുകൽ
  alternative: ‘സ്നാനം ചെയ്തില്ല’ അല്ലെങ്കിൽ ‘മുങ്ങിക്കഴുകിയില്ല’
  rationale: ഉടൻ വരുന്ന സന്ദർഭം പരീശരുടെ ശുദ്ധാചാരത്തെക്കുറിച്ചാണ്, ക്രിസ്തീയ സ്നാനത്തെക്കുറിച്ചല്ല. അതിനാൽ മുഖ്യവാചകത്തിൽ ആചാരപരമായ കഴുകൽ വ്യക്തമാക്കുകയും, ഗ്രീക്ക് ക്രിയയുടെ സ്നാനബന്ധം അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- issue: ἐβαπτίσθη എന്ന ക്രിയയുടെ വ്യാകരണരൂപത്തിൽ പ്രവർത്തകൻ
  choice: യേശു ആചാരപ്രകാരം കഴുകിയില്ല
  alternative: യേശു കഴുകിക്കൊള്ളപ്പെട്ടില്ല
  rationale: ഗ്രീക്കിലെ രൂപം മധ്യ/കർമണപ്രയോഗമായി വായിക്കാമെങ്കിലും ഈ ശുദ്ധാചാരസന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക ആത്മനിർദ്ദേശാർഥം ‘കഴുകുക’ എന്നതാണ്; പ്രവർത്തനം മറ്റൊരാൾ നിർവഹിച്ചു എന്ന അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘യേശു’ എന്ന കർത്താവ് ഗ്രീക്കിൽ പരോക്ഷമാണെങ്കിലും മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു. അടിക്കുറിപ്പ് സൂചിക [a] മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
