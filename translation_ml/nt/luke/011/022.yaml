  to: എന്നാൽ, അവനെക്കാൾ ശക്തനായ ഒരാൾ അവന്റെ നേരെ വന്ന് അവനെ കീഴടക്കുമ്പോൾ[a], ആ ശക്തനായവൻ മറ്റേയാൾ ആശ്രയിച്ചിരുന്ന മുഴുവൻ ആയുധസജ്ജീകരണവും[b] എടുത്തുകളയുകയും മറ്റേയാളുടെ കൊള്ളമുതൽ[c] പങ്കിട്ടുകൊടുക്കുകയും ചെയ്യുന്നു.
  rationale: 'The only necessary textual revision disambiguates the referents of the armor, prior reliance, and plunder: they belong to the person overcome, whereas the stronger person removes and distributes them. Footnote c is adjusted to offer a closer lexical alternative. The verse retains its non-identifying imagery and does not impose a theological interpretation.'
