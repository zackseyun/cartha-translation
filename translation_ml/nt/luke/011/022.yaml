reference: Luke 11:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: ml
  text: എന്നാൽ, അവനെക്കാൾ ശക്തനായ ഒരാൾ അവന്റെ നേരെ വന്ന് അവനെ കീഴടക്കുമ്പോൾ[a], ആ ശക്തനായവൻ മറ്റേയാൾ ആശ്രയിച്ചിരുന്ന മുഴുവൻ ആയുധസജ്ജീകരണവും[b] എടുത്തുകളയുകയും മറ്റേയാളുടെ കൊള്ളമുതൽ[c] പങ്കിട്ടുകൊടുക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവനെ പരാജയപ്പെടുത്തുമ്പോൾ’ അല്ലെങ്കിൽ ‘അവനെ ജയിക്കുമ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: ‘മുഴുവൻ ആയുധസജ്ജീകരണം’ എന്നത് ഒരു സമ്പൂർണ ആയുധസമുച്ചയത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പരിഭാഷയാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘മറ്റേയാളുടെ കൊള്ളവസ്തുക്കൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: എന്നാൽ … വരുമ്പോൾ
  rationale: δέ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നും, ἐπάν എന്ന വ്യവസ്ഥാപരമായ കാലാർഥം സ്വാഭാവികമായി ‘വരുമ്പോൾ’ എന്നും നൽകി.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: അവനെക്കാൾ ശക്തനായ ഒരാൾ
  rationale: ഗ്രീക്കിൽ താരതമ്യവിശേഷണം നാമരൂപത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു; വ്യക്തമല്ലാത്ത ‘മനുഷ്യൻ’ എന്ന നാമം ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഒരാൾ’ ഉപയോഗിച്ചു.
- source_word: ἐπελθὼν
  choice: അവന്റെ നേരെ വന്ന്
  rationale: സംഘർഷസന്ദർഭം നിലനിർത്തിക്കൊണ്ട്, ‘ആക്രമിച്ച്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കി.
- source_word: νικήσῃ αὐτόν
  choice: അവനെ കീഴടക്കുമ്പോൾ
  rationale: νικάω ഇവിടെ എതിരാളിയെ ജയിച്ച് നിരായുധനാക്കുന്ന പ്രായോഗിക വിജയത്തെ സൂചിപ്പിക്കുന്നു; ‘കീഴടക്കുക’ ആ ദൃശ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: അവന്റെ മുഴുവൻ ആയുധസജ്ജീകരണവും
  rationale: πανοπλία ഒരു സമ്പൂർണ ആയുധസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു; ആ പൂർണതയും ആധുനിക വായനാസൗകര്യവും ഈ പ്രയോഗം നൽകുന്നു.
- source_word: αἴρει
  choice: എടുത്തുകളയുകയും
  rationale: തോറ്റവനിൽനിന്ന് ആയുധസജ്ജീകരണം നീക്കംചെയ്യുന്ന സന്ദർഭത്തിലെ αἴρωയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: അവൻ ആശ്രയിച്ചിരുന്ന
  rationale: മുമ്പ് തുടർന്നിരുന്ന ഉറച്ച ആശ്രയത്തെ imperfect രൂപം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: അവന്റെ കൊള്ളമുതൽ
  rationale: യുദ്ധത്തിൽ തോറ്റ എതിരാളിയിൽനിന്ന് പിടിച്ചെടുത്ത സമ്പത്തിനെ σκῦλα സൂചിപ്പിക്കുന്നു; ‘കൊള്ളമുതൽ’ ആ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: διαδίδωσιν
  choice: പങ്കിട്ടുകൊടുക്കുകയും ചെയ്യുന്നു
  rationale: കൊള്ളമുതൽ മറ്റുള്ളവർക്കിടയിൽ വിഭജിച്ച് നൽകുന്ന διαδίδωμιയുടെ അർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: കൂടുതൽ ശക്തനായ വ്യക്തിയെ ‘ശക്തനായ മനുഷ്യൻ’ എന്ന് വ്യക്തമാക്കണമോ എന്നത്
  choice: ‘അവനെക്കാൾ ശക്തനായ ഒരാൾ’ എന്ന് നൽകി; ‘മനുഷ്യൻ’ ചേർത്തില്ല.
  alternative: ‘അവനെക്കാൾ ശക്തനായ ഒരു മനുഷ്യൻ’
  rationale: ഗ്രീക്കിൽ ഇവിടെ ‘മനുഷ്യൻ’ എന്ന നാമം പ്രകടമല്ല. മുൻവാക്യം ദൃശ്യം വ്യക്തമാക്കുന്നതിനാൽ ഇല്ലാത്ത നാമം ചേർക്കാതെ മൂലത്തിന്റെ രൂപവും തുറന്ന സ്വഭാവവും സംരക്ഷിച്ചു.
- issue: νικάωയുടെ സംഘർഷാർഥം എത്ര ശക്തമായി പരിഭാഷപ്പെടുത്തണം എന്നത്
  choice: ‘കീഴടക്കുക’
  alternative: ‘പരാജയപ്പെടുത്തുക’ അല്ലെങ്കിൽ ‘ജയിക്കുക’
  rationale: വിജയത്തെത്തുടർന്ന് ആയുധവും കൊള്ളമുതലും പിടിച്ചെടുക്കുന്ന ദൃശ്യമായതിനാൽ ‘കീഴടക്കുക’ യാഥാർഥ്യബോധമുള്ള ശക്തി നൽകുന്നു; അതേസമയം ശക്തനായ വ്യക്തി ആരെന്നത് വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. യുദ്ധദൃശ്യത്തിന്റെ തീവ്രത നിലനിർത്തിയെങ്കിലും അതിലെ വ്യക്തികളെ ദൈവശാസ്ത്രപരമായി തിരിച്ചറിഞ്ഞ് വ്യാഖ്യാനം ചേർത്തിട്ടില്ല. ആവർത്തിക്കുന്ന സർവനാമങ്ങൾ മൂലത്തിലെ ബന്ധം സംരക്ഷിക്കാൻ നിലനിർത്തി.
