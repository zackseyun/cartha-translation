translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ വേട്ടയുടെയും വാക്കുപിടിത്തത്തിന്റെയും രൂപകം പ്രധാനവാചകത്തിൽ നിലനിർത്തി; അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. നൽകിയിരിക്കുന്ന ഗ്രീക്ക് വാക്യഖണ്ഡത്തിൽ പ്രധാന ക്രിയ ഇല്ലാത്തതിനാൽ പുതിയ ക്രിയ ചേർത്തിട്ടില്ല.
