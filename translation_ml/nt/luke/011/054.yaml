  text: അവനെ ലക്ഷ്യമാക്കി പതിയിരുന്ന്[a], അവന്റെ വായിൽനിന്ന് എന്തെങ്കിലും പിടികൂടാൻ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ കുടുക്കാൻ അവസരം കാത്തിരുന്ന്.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ വായിൽനിന്ന് എന്തെങ്കിലും പിടികൂടാൻ’; അതായത്, അവൻ പറഞ്ഞ ഏതെങ്കിലും വാക്ക് അവനെതിരെ ഉപയോഗിക്കാൻ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: പതിയിരുന്ന്
  rationale: ശത്രുതാപരമായ ഉദ്ദേശ്യത്തോടെ അവസരം കാത്തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന വേട്ടയുടെയും പതിയിരിപ്പിന്റെയും ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτόν
  choice: അവനെതിരെ
  rationale: സർവനാമം യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പതിയിരുന്ന്’ എന്ന പ്രയോഗത്തോടൊപ്പം ശത്രുതാപരമായ ബന്ധം വ്യക്തമാക്കാൻ ‘അവനെതിരെ’ സ്വാഭാവികമാണ്; എന്നാൽ ഗ്രീക്കിലെ കർമസർവനാമത്തിന്റെ അർഥം അതിരുകടന്ന് വികസിപ്പിക്കുന്നില്ല.
- source_word: θηρεῦσαί
  choice: പിടികൂടാൻ
  rationale: വേട്ടയാടി പിടിക്കുക എന്ന മൂലരൂപകവും, ഇവിടെ ഒരാളുടെ വാക്കിൽനിന്ന് കുറ്റം കണ്ടെത്തി അയാളെ കുടുക്കുക എന്ന സന്ദർഭാർഥവും ഒരുപോലെ സൂചിപ്പിക്കുന്നു.
- source_word: τι
  choice: എന്തെങ്കിലും
  rationale: അവർ ഉപയോഗപ്പെടുത്താവുന്ന ഏതെങ്കിലും ഒരു പ്രസ്താവന തേടിയിരുന്നുവെന്ന അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: അവന്റെ വായിൽനിന്ന്
  rationale: സംസാരിച്ച വാക്കുകളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിലെ മൂർത്തമായ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘അവൻ പറഞ്ഞതിൽനിന്ന്’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമായിരിക്കും.
