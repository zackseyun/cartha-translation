id: LUK.11.31
reference: Luke 11:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ml
  text: തെക്കിന്റെ രാജ്ഞി ന്യായവിധിയിൽ ഈ തലമുറയിലെ പുരുഷന്മാരോടൊപ്പം എഴുന്നേൽക്കും; അവരെ കുറ്റംവിധിക്കും[a]. കാരണം, അവൾ ശലോമോന്റെ ജ്ഞാനം കേൾക്കാൻ ഭൂമിയുടെ അറ്റങ്ങളിൽനിന്ന് വന്നു. ഇതാ, ശലോമോനെക്കാൾ മഹത്തായ ഒന്ന് ഇവിടെ ഉണ്ട്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ പരാമർശിക്കുന്നത് സാധാരണയായി ശേബാരാജ്ഞിയായി തിരിച്ചറിയപ്പെടുന്ന വ്യക്തിയെയാണ് (1 രാജാക്കന്മാർ 10:1–13; 2 ദിനവൃത്താന്തം 9:1–12 കാണുക).
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘ശലോമോനെക്കാൾ വലിയ ഒരുവൻ.’ ഗ്രീക്കിൽ നപുംസകലിംഗ പ്രയോഗമാണ്; അക്ഷരാർഥത്തിൽ ‘ശലോമോനെക്കാൾ മഹത്തായ ഒന്ന്.’ ഇത് ശലോമോനുമായുള്ള നേരിട്ടുള്ള വ്യക്തിപരമായ താരതമ്യത്തെക്കാൾ വിശാലമായ ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: തെക്കേദേശത്തിലെ രാജ്ഞി
  rationale: ഗ്രീക്കിലെ ‘തെക്കിന്റെ രാജ്ഞി’ എന്ന ഘടന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; മുഖ്യപാഠത്തിൽ ‘ശേബാരാജ്ഞി’ എന്ന വ്യാഖ്യാനപരമായ തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
- source_word: ἐγερθήσεται
  choice: എഴുന്നേറ്റ്
  rationale: ന്യായവിധിയിൽ എഴുന്നേറ്റു സാക്ഷിയായി നിൽക്കുന്ന ദൃശ്യവും ഭാവിയിലെ ഉയിർപ്പിന്റെ സാധ്യതയുള്ള അനുരണനവും നിലനിർത്തുന്നു; ‘ഉയിർപ്പിക്കപ്പെടും’ എന്നു വ്യക്തമാക്കി അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐν τῇ κρίσει
  choice: ന്യായവിധിയിൽ
  rationale: നിർദിഷ്ടമായ അന്ത്യന്യായവിധിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തർജമ.
- source_word: μετὰ τῶν ἀνδρῶν
  choice: പുരുഷന്മാരോടൊപ്പം
  rationale: ἀνήρ എന്ന പദത്തിന്റെ വ്യക്തമായ പുല്ലിംഗ അർഥം ‘ആളുകൾ’ എന്നു പൊതുവാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: τῆς γενεᾶς ταύτης
  choice: ഈ തലമുറയിലെ
  rationale: യേശുവിന്റെ സമകാലിക തലമുറയെ സൂചിപ്പിക്കുന്ന γενεάയുടെ സാധാരണ സുവിശേഷപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: κατακρινεῖ αὐτούς
  choice: അവരെ കുറ്റം വിധിക്കും
  rationale: വെറും വിലയിരുത്തലല്ല, പ്രതികൂലമായ വിധി പ്രസ്താവിക്കൽ എന്ന κατακρίνωയുടെ ശക്തമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: ഭൂമിയുടെ അറ്റങ്ങളിൽനിന്നു
  rationale: വളരെ ദൂരെയുള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് അതിശയോക്തിപരമായ പ്രയോഗത്തിന്റെ രൂപവും വ്യാപ്തിയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἀκοῦσαι
  choice: കേൾക്കാൻ
  rationale: ἦλθεν എന്ന ക്രിയയോടു ചേർന്ന ഉദ്ദേശ്യാർഥക അനന്തക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: τὴν σοφίαν Σολομῶνος
  choice: ശലോമോന്റെ ജ്ഞാനം
  rationale: ജ്ഞാനമാണ് കേൾക്കാനുള്ള വിഷയം എന്ന ഗ്രീക്ക് ആശയം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന പരമപ്രധാന പ്രസ്താവനയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള വ്യവഹാരചിഹ്നം.
- source_word: πλεῖον Σολομῶνος
  choice: ശലോമോനെക്കാൾ മഹത്തായ ഒന്ന്
  rationale: πλεῖον എന്ന നപുംസകലിംഗ രൂപം വ്യക്തിവാചകമായ ‘ഒരുവൻ’ എന്നു മാറ്റാതെ സംരക്ഷിക്കുന്നു; യേശുവിന്റെ വ്യക്തിത്വത്തിലേക്കു മാത്രം ചുരുക്കാതെ അവനിൽ സന്നിഹിതമായ വിശാല യാഥാർഥ്യത്തെയും തുറന്നുവയ്ക്കുന്നു.
- source_word: ὧδε
  choice: ഇവിടെ ഉണ്ട്
  rationale: ഇപ്പോഴത്തെ സാന്നിധ്യം സൂചിപ്പിക്കുന്ന ലളിതമായ സ്ഥാനവാചക പ്രയോഗം.
theological_decisions:
- issue: രാജ്ഞിയെ ശേബാരാജ്ഞിയായി മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ഗ്രീക്കിലുള്ളതുപോലെ ‘തെക്കേദേശത്തിലെ രാജ്ഞി’ എന്നു നിലനിർത്തി
  alternative: ശേബാരാജ്ഞി
  rationale: പഴയനിയമ സൂചന ശക്തമാണെങ്കിലും ഗ്രീക്ക് പാഠം നേരിട്ട് ‘തെക്കിന്റെ രാജ്ഞി’ എന്നാണ് പറയുന്നത്. തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നത് പാഠവും വ്യാഖ്യാനവും വേർതിരിക്കുന്നു.
- issue: πλεῖον Σολομῶνος വ്യക്തിവാചകമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘ശലോമോനെക്കാൾ മഹത്തായ ഒന്ന്’ എന്നു നപുംസകലിംഗ ഭാവം നിലനിർത്തി
  alternative: ശലോമോനെക്കാൾ വലിയ ഒരുവൻ
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗം യേശുവിന്റെ വ്യക്തിയെ മാത്രമല്ല, അവനോടൊപ്പം സന്നിഹിതമായ രാജ്യം, സന്ദേശം, പ്രവൃത്തി എന്നിവ ഉൾക്കൊള്ളാവുന്ന ദൈവിക യാഥാർഥ്യത്തെയും സൂചിപ്പിക്കാം. ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: ἐγερθήσεται എന്നത് ഉയിർപ്പിനെ വ്യക്തമായി പറയണമോ
  choice: ‘എഴുന്നേറ്റ്’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ഉയിർപ്പിക്കപ്പെടും
  rationale: അന്ത്യന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ഉയിർപ്പിന്റെ അനുരണനം ഉണ്ടായിരിക്കാം; എന്നാൽ ഇവിടെ സാക്ഷിയായി എഴുന്നേൽക്കുക എന്ന ന്യായാലയദൃശ്യവും സ്വാഭാവികമാണ്. പരിഭാഷ ഇരുസാധ്യതകളും തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ന്യായവിധി,’ ‘തലമുറ,’ ‘ജ്ഞാനം’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
