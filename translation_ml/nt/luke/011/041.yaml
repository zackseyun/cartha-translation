id: LUK.11.41
reference: Luke 11:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: ml
  text: എന്നാൽ ഉള്ളിലുള്ളവ ദാനമായി കൊടുക്കുക[a]; ഇതാ, എല്ലാം നിങ്ങൾക്കു ശുദ്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ കൈവശമുള്ളത് ദാനമായി കൊടുക്കുക.” ഗ്രീക്ക് പ്രയോഗം അകത്തുള്ളതിനെയോ ഒരാളുടെ കൈവശമുള്ള സമ്പത്തിനെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: എന്നാൽ
  rationale: മുമ്പുള്ള ബാഹ്യശുദ്ധീകരണത്തെക്കുറിച്ചുള്ള പരാമർശത്തോട് തിരുത്തൽസ്വഭാവമുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: τὰ ἐνόντα
  choice: ഉള്ളിലുള്ളവ
  rationale: പദശഃ ‘അകത്തുള്ളവ’ എന്ന അർഥം നിലനിർത്തുകയും പാത്രത്തിന്റെ പുറവും അകവും തമ്മിലുള്ള തൊട്ടുമുമ്പത്തെ വൈരുധ്യവുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു; കൈവശമുള്ള സമ്പത്ത് എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: δότε
  choice: കൊടുക്കുക
  rationale: ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: ἐλεημοσύνην
  choice: ദാനമായി
  rationale: ദാനധർമ്മം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത സ്വീകർത്താവിനെ മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള ഫലത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: πάντα
  choice: എല്ലാം
  rationale: സമഗ്രത സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: καθαρὰ
  choice: ശുദ്ധമാണ്
  rationale: ചടങ്ങുപരവും ധാർമ്മികവുമായ ശുദ്ധിയുടെ സന്ദർഭബന്ധം നിലനിർത്തുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ബന്ധമോ പരിഗണനയോ സൂചിപ്പിക്കുന്ന ദാതിവിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: τὰ ἐνόντα എന്ന പ്രയോഗവും ദാനവും ശുദ്ധിയും തമ്മിലുള്ള ബന്ധവും
  choice: ‘ഉള്ളിലുള്ളവ’ എന്ന ആന്തരിക-ധാർമ്മിക വായന മുഖ്യവാചകത്തിൽ
  alternative: ‘നിങ്ങളുടെ കൈവശമുള്ളത്’ എന്ന സമ്പത്തിനെ സൂചിപ്പിക്കുന്ന വായന
  rationale: ലൂക്കോസ് 11:39-ലെ പാത്രത്തിന്റെ പുറവും അകവും തമ്മിലുള്ള വൈരുധ്യം ആന്തരിക വായനയെ സന്ദർഭപരമായി ശക്തിപ്പെടുത്തുന്നു. എന്നാൽ ഗ്രീക്ക് പ്രയോഗം കൈവശമുള്ള വസ്തുക്കളെയും സൂചിപ്പിക്കാമെന്ന യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഇതാ’ എന്നത് വാക്യത്തിന്റെ വാഗ്മിത്വപരമായ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു; ‘ദാനമായി’ എന്നത് പ്രത്യേക മതവിഭാഗപരമായ പദപ്രയോഗം ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപമാണ്.
