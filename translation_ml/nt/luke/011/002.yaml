reference: Luke 11:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ പ്രാർഥിക്കുമ്പോൾ ഇങ്ങനെ പറയുക: ‘പിതാവേ[a], അങ്ങയുടെ നാമം വിശുദ്ധമായി ആദരിക്കപ്പെടട്ടെ[b]. അങ്ങയുടെ രാജ്യം വരട്ടെ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പാരമ്പര്യങ്ങളിൽ മത്തായി 6:9-ലെ സമാന്തരവാക്യത്തിന്റെ സ്വാധീനത്തിൽ “ഞങ്ങളുടെ പിതാവേ” എന്നു കാണുന്നു; എന്നാൽ ഇവിടെ ഗ്രീക്കുപാഠം “പിതാവേ” എന്നു മാത്രമാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “അങ്ങയുടെ നാമം വിശുദ്ധീകരിക്കപ്പെടട്ടെ.” ഇവിടെ ഉദ്ദേശിക്കുന്നത് ദൈവനാമം വിശുദ്ധമെന്നു അംഗീകരിക്കപ്പെടുകയും ആദരിക്കപ്പെടുകയും ചെയ്യട്ടെ എന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: നിങ്ങൾ പ്രാർഥിക്കുമ്പോൾ
  rationale: പൊതുവായ കാലസാഹചര്യം സൂചിപ്പിക്കുന്ന ὅταν-ഉം വർത്തമാനകാല സബ്ജങ്ക്ടീവ് ക്രിയയും പതിവായോ ആവർത്തിച്ചോ നടക്കുന്ന പ്രാർഥനയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: λέγετε
  choice: ഇങ്ങനെ പറയുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ നിർദേശസ്വഭാവം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘ഇങ്ങനെ’ എന്നത് തുടർന്ന് വരുന്ന പ്രാർഥനാവാക്യത്തിലേക്ക് വ്യക്തമായി നയിക്കുന്നു.
- source_word: Πάτερ
  choice: പിതാവേ
  rationale: ഗ്രീക്കിൽ ‘ഞങ്ങളുടെ’ എന്ന പദമില്ല; അഭിസംബോധനാവിഭക്തിയുടെ നേരിട്ടുള്ള, ഗൗരവമുള്ള മലയാളരൂപം സ്വീകരിച്ചു.
- source_word: ἁγιασθήτω τὸ ὄνομά σου
  choice: അങ്ങയുടെ നാമം വിശുദ്ധമായി ആദരിക്കപ്പെടട്ടെ
  rationale: പാസീവ് ആജ്ഞാരൂപത്തിന്റെ അപേക്ഷാഭാവം നിലനിർത്തുകയും ദൈവനാമം വിശുദ്ധമല്ലാത്തതിൽനിന്ന് വിശുദ്ധമാകുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി അത് വിശുദ്ധമെന്നു അംഗീകരിക്കപ്പെടുകയും ആദരിക്കപ്പെടുകയും ചെയ്യട്ടെ എന്ന ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: σου
  choice: അങ്ങയുടെ
  rationale: ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ആദരസൂചക ഏകവചനരൂപം.
- source_word: ἐλθέτω ἡ βασιλεία σου
  choice: അങ്ങയുടെ രാജ്യം വരട്ടെ
  rationale: അവസാനകാല പ്രതീക്ഷയും ദൈവത്തിന്റെ ഭരണവും ഉൾക്കൊള്ളുന്ന βασιλείαയുടെ വിശാലത പരമ്പരാഗതവും മനസ്സിലാകുന്നതുമായ ‘രാജ്യം’ എന്ന പദത്തിൽ നിലനിർത്തി; ἐλθέτωയുടെ അപേക്ഷാത്മക ആജ്ഞ ‘വരട്ടെ’ എന്നു നൽകി.
theological_decisions:
- issue: ദൈവത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘ഞങ്ങളുടെ’ ചേർക്കണമോ
  choice: പിതാവേ
  alternative: ഞങ്ങളുടെ പിതാവേ
  rationale: നൽകിയ SBLGNT പാഠത്തിൽ Πάτερ മാത്രമാണുള്ളത്. മത്തായി 6:9-ലെ സമാന്തരപാഠത്തെയോ ആരാധനാപാരമ്പര്യത്തെയോ ആശ്രയിച്ച് വാക്യം സമന്വയിപ്പിച്ചില്ല.
- issue: ἁγιασθήτω എന്ന അപേക്ഷയുടെ അർത്ഥം
  choice: വിശുദ്ധമായി ആദരിക്കപ്പെടട്ടെ
  alternative: വിശുദ്ധീകരിക്കപ്പെടട്ടെ
  rationale: ദൈവനാമത്തിന്റെ അന്തർലീനമായ വിശുദ്ധി കുറവാണെന്ന സൂചന ഒഴിവാക്കിക്കൊണ്ട്, അത് വിശുദ്ധമെന്നു കണക്കാക്കി ആദരിക്കപ്പെടണമെന്ന അപേക്ഷയും ഗ്രീക്കിലെ പാസീവ് രൂപവും സംരക്ഷിക്കുന്നു.
- issue: βασιλείαയുടെ പരിധി
  choice: രാജ്യം
  alternative: ഭരണം
  rationale: ‘രാജ്യം’ ദൈവത്തിന്റെ സജീവ ഭരണത്തെയും വരാനിരിക്കുന്ന പൂർണതയെയും ഒരുമിച്ച് ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്ഥാപിത സുവിശേഷപദമാണ്; ‘ഭരണം’ മാത്രം ഉപയോഗിച്ചാൽ സ്ഥലപരവും അവസാനകാലപരവുമായ ഭാവങ്ങൾ ചുരുങ്ങാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രാർഥനാഭാഷ. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. പാഠം മത്തായിയിലെ രൂപത്തോട് സമന്വയിപ്പിക്കാതെ ലൂക്കോസിലെ ചുരുക്കരൂപം നിലനിർത്തി.
