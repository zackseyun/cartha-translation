id: LUK.11.16
reference: Luke 11:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: ml
  text: എന്നാൽ മറ്റുചിലർ അവനെ പരീക്ഷിച്ചുകൊണ്ട്, സ്വർഗത്തിൽനിന്നുള്ള ഒരു അടയാളം[a] അവനോട് ആവശ്യപ്പെട്ടുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു സ്വർഗീയ അടയാളം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: മറ്റുചിലർ
  rationale: മുൻവാക്യത്തിൽ സംസാരിച്ചവരിൽനിന്നു വ്യത്യസ്തമായ മറ്റൊരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, ആ വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: സന്ദർഭത്തിലെ മിതമായ വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു.
- source_word: πειράζοντες
  choice: അവനെ പരീക്ഷിച്ചുകൊണ്ട്
  rationale: ദുഷ്ടലക്ഷ്യത്തോടെയുള്ള പരിശോധന എന്ന സന്ദർഭാർഥം നിലനിർത്തുന്നു; കർത്താവായ യേശുവിനെ സൂചിപ്പിക്കുന്ന കർമം മലയാളത്തിൽ വ്യക്തമായി ചേർത്തിരിക്കുന്നു.
- source_word: σημεῖον
  choice: ഒരു അടയാളം
  rationale: അത്ഭുതസ്വഭാവം സന്ദർഭത്തിൽനിന്നു വ്യക്തമാകുന്നതിനാൽ അധിക വ്യാഖ്യാനം ചേർക്കാതെ ഗ്രീക്കിലെ പൊതുവായ പദം നിലനിർത്തുന്നു.
- source_word: ἐξ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്നുള്ള
  rationale: അടയാളത്തിന്റെ സ്വർഗീയ ഉത്ഭവമോ അംഗീകാരമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐζήτουν
  choice: ആവശ്യപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചയോ ആവർത്തനമോ പ്രകടമാക്കുകയും, ഈ സന്ദർഭത്തിൽ ζητέω എന്നതിന്റെ ചോദിച്ചാവശ്യപ്പെടുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: παρ’ αὐτοῦ
  choice: അവനോട്
  rationale: അടയാളം യേശുവിൽനിന്നാണ് അവർ ആവശ്യപ്പെട്ടതെന്ന ഉറവിടബന്ധം മലയാളത്തിലെ സ്വാഭാവിക അഭ്യർഥനാഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ആവശ്യപ്പെട്ട അടയാളത്തിന്റെ സ്വഭാവം
  choice: സ്വർഗത്തിൽനിന്നുള്ള ഒരു അടയാളം
  alternative: ഒരു സ്വർഗീയ അടയാളം
  rationale: അടയാളത്തിന്റെ ഉത്ഭവമോ സ്വർഗീയ അംഗീകാരമോ എന്ന ഗ്രീക്കിലെ സാധ്യത തുറന്നുവെക്കുന്നു; കൂടുതൽ സവിശേഷമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ആവശ്യപ്പെട്ടുകൊണ്ടിരുന്നു’ എന്ന രൂപം പ്രവൃത്തിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; പദക്രമം ‘സ്വർഗത്തിൽനിന്ന്’ എന്നും ‘അവനിൽനിന്ന്’ എന്നും അടുത്തടുത്ത് ആവർത്തിക്കുന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
