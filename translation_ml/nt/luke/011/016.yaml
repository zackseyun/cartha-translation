  terminology: ‘അടയാളം’ is a suitably non-interpretive equivalent for σημεῖον. ‘സ്വർഗത്തിൽനിന്നുള്ള’ preserves the source/authentication nuance without specifying the sign’s nature beyond the Greek. The alternate ‘ഒരു സ്വർഗീയ അടയാളം’ is a legitimate lexical alternative and is correctly anchored.
