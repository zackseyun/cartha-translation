theological_decisions:
- issue: രണ്ടാമത്തെ ഉപവാക്യത്തിലെ വ്യക്തമാക്കാത്ത വിധേയം
  choice: ‘മനുഷ്യപുത്രനും ഈ തലമുറയ്ക്ക് ഒരു അടയാളമായിരിക്കും’ എന്ന് മുൻ ഉപവാക്യത്തിൽനിന്ന് മനസ്സിലാകുന്ന ‘ഒരു അടയാളം’ ചേർത്ത് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മനുഷ്യപുത്രനും ഈ തലമുറയ്ക്ക് അങ്ങനെ ആയിരിക്കും.’
  rationale: ഗ്രീക്കിൽ σημεῖον ആവർത്തിക്കുന്നില്ലെങ്കിലും യോനായുമായുള്ള സമാന്തര്യം അതിനെ ശക്തമായി സൂചിപ്പിക്കുന്നു. വ്യക്തതയ്ക്കായി ചേർത്ത ആശയം അടിക്കുറിപ്പിലൂടെ തുറന്നറിയിക്കുന്നു.
- issue: ‘മനുഷ്യപുത്രൻ’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: പരമ്പരാഗത സ്ഥാനപ്പേരായ ‘മനുഷ്യപുത്രൻ’ നിലനിർത്തി.
  alternative: ‘മനുഷ്യനായവൻ’
  rationale: ഈ പ്രയോഗത്തിന്റെ പദശഃരൂപവും മിശിഹായെക്കുറിച്ചും അന്ത്യകാലത്തെക്കുറിച്ചുമുള്ള മുഴക്കങ്ങളും ഒരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിനവേക്കാർ’, ‘അടയാളം’, ‘മനുഷ്യപുത്രൻ’, ‘തലമുറ’ എന്നീ സുപരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി.
