- source_word: καθὼς γὰρ
  choice: എന്തെന്നാൽ, …പോലെ
  rationale: γάρ എന്ന വിശദീകരണബന്ധവും καθώς എന്ന താരതമ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐγένετο
