  language: ml
  text: എന്തെന്നാൽ, യോനാ നിനവേക്കാർക്ക് ഒരു അടയാളമായിത്തീർന്നതുപോലെ, മനുഷ്യപുത്രനും ഈ തലമുറയ്ക്ക് ഒരു അടയാളമായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “മനുഷ്യപുത്രനും ഈ തലമുറയ്ക്ക് അങ്ങനെ ആയിരിക്കും.” യോനായുമായുള്ള സമാന്തര്യം “ഈ തലമുറയ്ക്ക് ഒരു അടയാളമായിരിക്കും” എന്ന അർഥം സൂചിപ്പിക്കുന്നു.'
