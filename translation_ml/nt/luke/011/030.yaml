  rationale: യോനാ ഒരു അടയാളമായി പ്രവർത്തിക്കുന്ന നിലയിലായി എന്ന γίνομαιയുടെ ഭാവം വെറും ‘ആയിരുന്നു’ എന്നതിനെക്കാൾ വ്യക്തമായി നൽകുന്നു.
- source_word: Ἰωνᾶς
