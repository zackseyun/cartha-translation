id: LUK.11.15
reference: Luke 11:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: ml
  text: 'എന്നാൽ അവരിൽ ചിലർ പറഞ്ഞു: “പിശാചുക്കളുടെ അധിപനായ ബെയെൽസെബൂലാൽ[a] അവൻ പിശാചുക്കളെ പുറത്താക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ബെയെൽസെബൂബ്: ഇവിടെ ഗ്രീക്ക് പാഠത്തെ പിന്തുടർന്ന് ‘ബെയെൽസെബൂൽ’ എന്നു നൽകിയിരിക്കുന്ന പേരിന്റെ പരമ്പരാഗത രൂപം.'
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: എന്നാൽ അവരിൽ ചിലർ
  rationale: δὲ സന്ദർഭത്തിലെ വിരുദ്ധഭാവം സൂചിപ്പിക്കുന്നു; ἐξ αὐτῶν എന്ന ഭാഗികബന്ധം ‘അവരിൽ’ എന്നും τινὲς ‘ചിലർ’ എന്നും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἶπον
  choice: പറഞ്ഞു
  rationale: ഏറിസ്റ്റ് ക്രിയയെ ലളിതമായ ഭൂതകാല സംഭവമായി നൽകുന്നു.
- source_word: Ἐν Βεελζεβοὺλ
  choice: ബെയെൽസെബൂലിന്റെ ശക്തിയാൽ
  rationale: വ്യക്തിനാമത്തോടുകൂടിയ ἐν ഇവിടെ പ്രവർത്തനത്തിന്റെ ഉപാധിയെയോ അധികാരശക്തിയെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വെറും ‘ബെയെൽസെബൂലാൽ’ എന്നതിനെക്കാൾ ഈ അർഥം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: Βεελζεβοὺλ
  choice: ബെയെൽസെബൂൽ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ Βεελζεβούλ എന്ന രൂപത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; പരമ്പരാഗതമായ ബെയെൽസെബൂബ് എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: പിശാചുക്കളുടെ അധിപനായ
  rationale: ἄρχων അധികാരമുള്ള ഭരണാധികാരിയെയോ തലവനെയോ സൂചിപ്പിക്കുന്നു. ‘അധിപൻ’ ആ അധികാരബന്ധം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: ഇവൻ പിശാചുക്കളെ പുറത്താക്കുന്നു
  rationale: ἐκβάλλω ഭൂതബാധ ഒഴിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘പുറത്താക്കുക’ എന്നു സ്വാഭാവികമായി നൽകാം. ഗ്രീക്കിൽ ഉൾക്കൊള്ളുന്ന മൂന്നാംപുരുഷ ഏകവചന കർത്താവിനെ മലയാളത്തിൽ ‘ഇവൻ’ എന്നു വ്യക്തമാക്കുന്നത് ഉദ്ധരിച്ച കുറ്റാരോപണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: Βεελζεβούλ എന്ന പൈശാചിക നാമത്തിന്റെ രൂപം
  choice: ബെയെൽസെബൂൽ
  alternative: ബെയെൽസെബൂബ്
  rationale: പ്രധാനപാഠം ഗ്രീക്ക് നാമരൂപത്തെ പിന്തുടരുന്നു. പരിചിതമായ പരമ്പരാഗത രൂപം പാഠത്തിൽ പകരംവെക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἄρχων എന്ന അധികാരപദത്തിന്റെ വിവർത്തനം
  choice: പിശാചുക്കളുടെ അധിപൻ
  alternative: പിശാചുക്കളുടെ പ്രഭു / തലവൻ
  rationale: വാക്യം പറയുന്നതിലധികം വിശദമായ പിശാചുശാസ്ത്രഘടന ഇറക്കുമതി ചെയ്യാതെ, പിശാചുക്കളുടെമേലുള്ള അധികാരം ‘അധിപൻ’ വ്യക്തമാക്കുന്നു.
- issue: ἐν എന്നതിലെ പ്രവർത്തനമാധ്യമം
  choice: ബെയെൽസെബൂലിന്റെ ശക്തിയാൽ
  alternative: ബെയെൽസെബൂലാൽ / ബെയെൽസെബൂൽ മുഖാന്തരം
  rationale: ആരോപണം യേശു ബെയെൽസെബൂലിന്റെ അധികാരശക്തി ഉപയോഗിച്ചാണ് പിശാചുക്കളെ പുറത്താക്കുന്നത് എന്നതാണ്. ‘ശക്തിയാൽ’ ഈ ഉപാധിഭാവം വ്യക്തമാക്കുന്നു, എന്നാൽ വ്യക്തികളുടെ ബന്ധത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. കുറ്റാരോപണത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു; സാങ്കേതികമോ മതവിഭാഗപരമോ ആയ പദപ്രയോഗം ഒഴിവാക്കുന്നു.
