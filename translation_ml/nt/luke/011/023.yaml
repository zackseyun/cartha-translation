id: LUK.11.23
reference: Luke 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ml
  text: എന്നോടുകൂടെ ഇല്ലാത്തവൻ എനിക്ക് എതിരാണ്; എന്നോടുകൂടെ ശേഖരിക്കാത്തവൻ ചിതറിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: ഇല്ലാത്തവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ പൊതുവായ ഏകവചനസൂചന നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടുകൂടെ
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന സഹവർത്തിത്വവും പക്ഷചേരലും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: κατ’ ἐμοῦ
  choice: എനിക്ക് എതിരാണ്
  rationale: κατά + genitive ഇവിടെ വ്യക്തമാക്കുന്ന വിരോധം നേരിട്ട് പ്രകടിപ്പിക്കുകയും ‘എന്നോടുകൂടെ’ എന്നതിനോടുള്ള വിരുദ്ധസമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: συνάγων
  choice: ശേഖരിക്കാത്തവൻ
  rationale: ഒരുമിച്ചുകൂട്ടുക എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; കർമം ഗ്രീക്കിലും വ്യക്തമല്ലാത്തതിനാൽ മലയാളത്തിലും ചേർത്തിട്ടില്ല.
- source_word: σκορπίζει
  choice: ചിതറിക്കുന്നു
  rationale: കൂട്ടിച്ചേർക്കുന്നതിന് വിപരീതമായ ചിതറിക്കൽ എന്ന സജീവ അർഥവും രൂപകത്തിന്റെ തുറന്ന സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: ;
  rationale: രണ്ട് സമാന്തര വാക്യഭാഗങ്ങളുടെ അടുത്ത ബന്ധം മലയാളത്തിൽ അർദ്ധവിരാമംകൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ബന്ധത്തിന്റെ ഏകോപനസ്വഭാവം നഷ്ടപ്പെടുന്നില്ല.
theological_decisions:
- issue: യേശുവിനോടുള്ള നിഷ്പക്ഷതയെക്കുറിച്ചുള്ള വചനത്തിന്റെ ശക്തി
  choice: യേശുവിനോടുകൂടെ ഇല്ലാത്തവൻ അവന് എതിരാണെന്ന തീക്ഷ്ണമായ ദ്വന്ദ്വപ്രസ്താവന അതേപടി നിലനിർത്തി.
  alternative: വെറും പിന്തുണയുടെ അഭാവം സൂചിപ്പിക്കുന്ന മൃദുവായ പരാവർത്തനം; അല്ലെങ്കിൽ ഭൂതോച്ചാടനസന്ദർഭത്തിലേക്ക് മാത്രം വാക്കുകളെ പരിമിതപ്പെടുത്തൽ.
  rationale: ഗ്രീക്ക് വാക്യം രൂപത്തിൽ നിരുപാധികമാണ്. പിന്നീട് രൂപപ്പെട്ട ഏതെങ്കിലും സിദ്ധാന്തം ഇറക്കുമതി ചെയ്യാതെ അതിന്റെ നേരിട്ടുള്ള അവകാശവാദവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എന്നോടുകൂടെ’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ സമാന്തരഘടന സംരക്ഷിക്കുന്നു. വ്യാഖ്യാനപരമായി ‘ആളുകളെ’ അല്ലെങ്കിൽ ‘വിളവിനെ’ പോലൊരു കർമം ചേർത്തിട്ടില്ല.
