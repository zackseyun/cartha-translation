id: LUK.11.24
reference: Luke 11:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: ml
  text: '“അശുദ്ധാത്മാവ് മനുഷ്യനിൽനിന്ന് പുറത്തുപോകുമ്പോൾ, അത് വിശ്രമം തേടി വെള്ളമില്ലാത്ത സ്ഥലങ്ങളിലൂടെ[a] കടന്നുപോകുന്നു; വിശ്രമം കണ്ടെത്താതെ അത് പറയുന്നു: ‘ഞാൻ പുറത്തുവന്ന എന്റെ വീട്ടിലേക്ക് മടങ്ങും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വരണ്ട സ്ഥലങ്ങളിലൂടെ.” ഗ്രീക്കിൽ അക്ഷരാർഥം “വെള്ളമില്ലാത്ത സ്ഥലങ്ങൾ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: പുറത്തുപോകുമ്പോൾ
  rationale: ὅταν + subjunctive അവതരിപ്പിക്കുന്ന പൊതുവായ കാലസാഹചര്യം സ്വാഭാവികമായ മലയാളത്തിൽ ‘—ുമ്പോൾ’ എന്ന ഘടനയിലൂടെ നൽകി.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: അശുദ്ധാത്മാവ്
  rationale: വ്യക്തിപരമായി പ്രവർത്തിക്കുന്ന ദുഷ്ടാത്മാവിനുള്ള സുവിശേഷങ്ങളിലെ പതിവുപദപ്രയോഗം നിലനിർത്തുകയും ശുദ്ധി–അശുദ്ധി ഭാവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: മനുഷ്യനിൽനിന്ന്
  rationale: പ്രതിനിധാനപരമായ ഏകവചനത്തെ അനാവശ്യമായി ഒരു പ്രത്യേക വ്യക്തിയിലേക്കു ചുരുക്കാതെ, ഗ്രീക്കിലെ മനുഷ്യസൂചന നിലനിർത്തുന്നു.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: വെള്ളമില്ലാത്ത സ്ഥലങ്ങളിലൂടെ കടന്നുപോകുന്നു
  rationale: ἀνύδρων എന്നതിന്റെ അക്ഷരാർഥമായ ‘വെള്ളമില്ലാത്ത’ എന്ന ദൃശ്യഭാവവും διέρχεται എന്നതിലെ സഞ്ചാരഭാവവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: വിശ്രമം തേടി
  rationale: പങ്കുപദത്തിന്റെ ഉദ്ദേശ്യ/അനുബന്ധ പ്രവർത്തനഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: καὶ μὴ εὑρίσκον
  choice: വിശ്രമം കണ്ടെത്താതെ വരുമ്പോൾ
  rationale: മുൻപുള്ള ἀνάπαυσιν തന്നെയാണ് കണ്ടെത്താത്തത് എന്നു മലയാളത്തിൽ വ്യക്തമായി ആവർത്തിച്ച്, ഗ്രീക്കിലെ തുടർച്ചയായ സാഹചര്യഭാവം നിലനിർത്തുന്നു.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: എന്റെ വീട്ടിലേക്കു മടങ്ങും
  rationale: ഭാവികാലത്തിലെ ദൃഢനിശ്ചയവും ‘വീട്’ എന്ന തുടർന്നുള്ള ഉപമാചിത്രവും സംരക്ഷിക്കുന്നു.
- source_word: ὅθεν ἐξῆλθον
  choice: ഞാൻ വിട്ടുപോന്ന
  rationale: പുറപ്പെട്ട അതേ വീട്ടിലേക്കുള്ള മടക്കത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പുറത്തുവന്ന’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപവും സാധ്യമാണ്.
theological_decisions:
- issue: ‘അശുദ്ധാത്മാവ്’ എന്നതിന്റെ സ്വഭാവം
  choice: സംസാരിക്കുകയും പുറപ്പെട്ടുപോകുകയും മടങ്ങാൻ തീരുമാനിക്കുകയും ചെയ്യുന്ന വ്യക്തിപരമായ ആത്മാവായി ഭാഷാന്തരം ചെയ്തു.
  alternative: ധാർമ്മിക പിന്മാറ്റത്തിന്റെ വെറും ഉപമയോ വ്യക്തിത്വമില്ലാത്ത ശക്തിയോ ആയി അവതരിപ്പിക്കൽ.
  rationale: വാക്യത്തിലെ ക്രിയകളും നേരിട്ടുള്ള വാക്കുകളും അതിനെ പ്രവർത്തിക്കുന്ന വ്യക്തിപരമായ സത്തയായി അവതരിപ്പിക്കുന്നു; ഭാഷാന്തരം ആ അവതരണത്തെ വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കുന്നില്ല.
- issue: ἀνθρώπου എന്ന പദത്തിന്റെ പ്രതിനിധാനപരമായ പ്രയോഗം
  choice: ‘മനുഷ്യനിൽനിന്ന്’ എന്നു നൽകി.
  alternative: ‘ഒരു വ്യക്തിയിൽനിന്ന്’ അല്ലെങ്കിൽ നിർബന്ധമായും ‘ആ മനുഷ്യനിൽനിന്ന്’ എന്നു നൽകൽ.
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം സംരക്ഷിക്കുമ്പോഴും, ഈ പൊതുസാഹചര്യത്തെ ഒരു മുൻപരാമർശമുള്ള പ്രത്യേക പുരുഷനായി മലയാളത്തിൽ തെറ്റിദ്ധരിപ്പിക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. ആത്മാവിനെ സൂചിപ്പിക്കാൻ സ്വാഭാവികമായ നപുംസക സർവനാമമായ ‘അത്’ ഉപയോഗിച്ചു. നേരിട്ടുള്ള ഉദ്ധരണിയും വർത്തമാനകാല കഥനഭാവവും നിലനിർത്തി.
