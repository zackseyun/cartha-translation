revisions:
- from: '“അശുദ്ധാത്മാവ് മനുഷ്യനിൽനിന്ന് പുറത്തുപോകുമ്പോൾ, അത് വിശ്രമം തേടി വെള്ളമില്ലാത്ത സ്ഥലങ്ങളിലൂടെ[a] കടന്നുപോകുന്നു. വിശ്രമം കണ്ടെത്താതെ വരുമ്പോൾ അത് പറയുന്നു: ‘ഞാൻ വിട്ടുപോന്ന എന്റെ വീട്ടിലേക്കു മടങ്ങും.’”'
  to: '“അശുദ്ധാത്മാവ് മനുഷ്യനിൽനിന്ന് പുറത്തുപോകുമ്പോൾ, അത് വിശ്രമം തേടി വെള്ളമില്ലാത്ത സ്ഥലങ്ങളിലൂടെ[a] കടന്നുപോകുന്നു; വിശ്രമം കണ്ടെത്താതെ അത് പറയുന്നു: ‘ഞാൻ പുറത്തുവന്ന എന്റെ വീട്ടിലേക്ക് മടങ്ങും.’”'
  rationale: The revision preserves the draft’s sound terminology and register, while restoring the explicit ‘came out from’ sense of ὅθεν ἐξῆλθον and making the participial clause natural in Malayalam. The footnote remains correctly anchored and accurately states the lexical alternative.
