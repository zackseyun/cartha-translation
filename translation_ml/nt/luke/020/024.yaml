  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: ml
  text: '“ഒരു ദിനാർ എനിക്കു കാണിക്കൂ.[a] അതിലുള്ള രൂപവും ലിഖിതവും ആരുടേതാണ്?” അവർ ഉത്തരം പറഞ്ഞു: “കൈസറുടേത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ദിനാർ അക്കാലത്ത് സാധാരണയായി ഉപയോഗിച്ചിരുന്ന ഒരു റോമൻ നാണയമായിരുന്നു; ചരിത്രപശ്ചാത്തലം നിലനിർത്താൻ അതിന്റെ പ്രത്യേക നാമം ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: എന്നെ കാണിക്കൂ
  rationale: ദείκνυμι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ആജ്ഞാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δηνάριον
  choice: ഒരു ദിനാർ
  rationale: ചരിത്രപരമായ നാണയത്തിന്റെ പ്രത്യേക നാമം പൊതുവായ ‘നാണയം’ എന്നതാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: τίνος
  choice: ആരുടേതാണ്
  rationale: ഉടമസ്ഥതയെയോ ബന്ധത്തെയോ ചോദിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണ ചോദ്യരൂപത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: εἰκόνα
  choice: രൂപം
  rationale: നാണയത്തിൽ പതിച്ചിരിക്കുന്ന വ്യക്തിയുടെ പ്രതിരൂപത്തെ സൂചിപ്പിക്കുന്നതോടൊപ്പം εἰκών എന്ന പദത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു.
- source_word: ἐπιγραφήν
  choice: ലിഖിതം
  rationale: നാണയത്തിലെ എഴുത്തിനെയോ ആലേഖനത്തെയോ കൃത്യവും വായനാസൗകര്യമുള്ളതുമായ രീതിയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: അവർ ഉത്തരം പറഞ്ഞു
  rationale: കൃതന്തം-ക്രിയ സംയോജനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ സമാപിക ക്രിയാരൂപത്തിലാക്കുന്നു; ആഖ്യാനപ്രവാഹം സംരക്ഷിക്കുന്നു.
- source_word: Καίσαρος
  choice: കൈസറുടേത്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ഷഷ്ഠീവ്യാകരണ ഉത്തരത്തെ മലയാളത്തിൽ അതേ സംക്ഷിപ്തതയോടെ നൽകുന്നു.
