id: LUK.20.42
reference: Luke 20:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: ml
  text: 'കാരണം, ദാവീദ് തന്നേ സങ്കീർത്തനങ്ങളുടെ പുസ്തകത്തിൽ ഇങ്ങനെ പറയുന്നു: “കർത്താവ്[a] എന്റെ കർത്താവിനോടു പറഞ്ഞു: ‘എന്റെ വലത്തുഭാഗത്ത് ഇരിക്കുക.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, സങ്കീർത്തനം 110:1-ന്റെ എബ്രായപാഠത്തെ പിന്തുടർന്ന്: ‘യഹോവ എന്റെ കർത്താവിനോടു പറഞ്ഞു.’'
    reason: Psalm 110:1 has the Hebrew divine name in the first position, whereas Luke’s Greek citation has κύριος (‘Lord’).
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: ദാവീദ് തന്നെയും
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘തന്നെയും’കൊണ്ട് പ്രകടമാക്കുന്നു. γάρ മുൻവാക്യത്തിലെ ചോദ്യത്തിന് അടിസ്ഥാനമൊരുക്കുന്നു; മലയാളത്തിൽ ഈ ഉദ്ധരണിപ്രവേശത്തിൽ പ്രത്യേകമായി ‘എന്തെന്നാൽ’ ചേർക്കാതെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: Δαυὶδ
  choice: ദാവീദ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഉദ്ധരണിസൂത്രത്തിലെ വർത്തമാനകാലം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: സങ്കീർത്തനപുസ്തകത്തിൽ
  rationale: βίβλος എന്ന ‘പുസ്തകം’ എന്ന ആശയവും ψαλμῶν എന്ന ബഹുവചന ഷഷ്ഠിയും സംക്ഷിപ്തവും പരിചിതവുമായി നൽകുന്നു.
- source_word: Εἶπεν
  choice: അരുളിച്ചെയ്തു
  rationale: സാധാരണ അർത്ഥം ‘പറഞ്ഞു’ ആണെങ്കിലും ഇവിടെ ദൈവത്തിന്റെ വചനമെന്ന സന്ദർഭത്തിൽ dignified Malayalam ആയ ‘അരുളിച്ചെയ്തു’ ഉപയോഗിക്കുന്നു; കാലഭേദം ഭൂതകാലമായി നിലനിർത്തുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ഗ്രീക്ക് κύριος-നെ പ്രധാനപാഠത്തിൽ ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു; അടിസ്ഥാനം ആയ എബ്രായ സങ്കീർത്തനത്തിൽ ദൈവനാമമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകേണ്ടതാണ്.
- source_word: τῷ κυρίῳ μου
  choice: എന്റെ കർത്താവിനോട്
  rationale: രണ്ടാമത്തെ κύριος-ന്റെ ‘കർത്താവ്’ എന്ന രൂപവും μου എന്ന ഉടമസ്ഥതയും ദത്തിവിഭക്തിയുടെ ബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Κάθου
  choice: ഇരിക്കുക
  rationale: κάθημαι-യുടെ ആജ്ഞാരൂപം സ്വാഭാവികവും ആദരസൂചകവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκ δεξιῶν μου
  choice: എന്റെ വലത്തുഭാഗത്ത്
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്ഥാനസൂചക അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 110:1-ലെ എബ്രായ ദൈവനാമത്തെ ഉദ്ധരിക്കുന്ന ആദ്യ κύριος
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: ലൂക്കോസിന്റെ ഗ്രീക്ക് പാഠത്തിൽ κύριος ഉള്ളതിനാൽ പ്രധാനപാഠം അതനുസരിക്കുന്നു; എബ്രായ അടിസ്ഥാനം יהוה ആണെന്നത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കണം.
- issue: ക്രിസ്തുവിനെക്കുറിച്ചുള്ള വാദത്തിൽ നിർണായകമായ രണ്ടാമത്തെ κύριος
  choice: എന്റെ കർത്താവ്
  alternative: എന്റെ യജമാനൻ
  rationale: ‘കർത്താവ്’ ഗ്രീക്കിന്റെ അർത്ഥപരിധിയും ഉദ്ധരണിയിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; ‘യജമാനൻ’ സാധ്യമെങ്കിലും ഇവിടെ അന്തർപാഠബന്ധത്തിന്റെ ഭാരം കുറയ്ക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എന്നാൽ നൽകിയ വാക്യം ലൂക്കോസ് 20:42 മാത്രമായതിനാൽ Κάθου ἐκ δεξιῶν μου എന്നിടത്ത് അവസാനിക്കണം; തുടർവാക്യത്തിലെ ശത്രുക്കളെയും പാദപീഠത്തെയും കുറിച്ചുള്ള വാചകം ഉറവിടത്തിൽ ഇല്ല.
