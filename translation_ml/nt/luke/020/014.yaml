source:
  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: ml
  text: 'എന്നാൽ മുന്തിരിത്തോട്ടം കൃഷി ചെയ്യുന്നവർ[a] അവനെ കണ്ടപ്പോൾ പരസ്പരം ആലോചിച്ചു: “ഇവനാണ് അവകാശി. അനന്തരാവകാശം നമ്മുടേതായിത്തീരേണ്ടതിന് നമുക്ക് ഇവനെ കൊന്നുകളയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൃഷിക്കാർ” എന്നും “കുടിയാന്മാർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം കാർഷികപ്രവർത്തകരെ സൂചിപ്പിക്കുന്നു; ഈ ഉപമയിൽ അവർ പ്രത്യേകിച്ച് ഒരു മുന്തിരിത്തോട്ടത്തിൽ പണിയെടുക്കുന്നവരാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: മുന്തിരിത്തോട്ടം കൃഷിചെയ്യുന്നവർ
  rationale: γεωργοί എന്നത് അടിസ്ഥാനപരമായി കൃഷിപ്പണിക്കാരെയോ കൃഷിചെയ്യുന്നവരെയോ സൂചിപ്പിക്കുന്നു; ഈ ഉപമയുടെ സാഹചര്യത്തിൽ അവർ മുന്തിരിത്തോട്ടത്തിലാണ് പ്രവർത്തിക്കുന്നത്. ‘കുടിയാന്മാർ’ അവരുടെ കരാർബന്ധം വ്യക്തമാക്കുമെങ്കിലും ആ നിയമപരമായ അർഥം ഈ നാമത്തിൽത്തന്നെ നിർബന്ധമായും അടങ്ങിയിട്ടില്ല.
- source_word: διελογίζοντο πρὸς ἀλλήλους
  choice: പരസ്പരം ആലോചിച്ചു
  rationale: അപൂർണഭൂതകാലരൂപം അവർ തമ്മിൽ നടത്തിയുകൊണ്ടിരുന്ന കണക്കുകൂട്ടലോടുകൂടിയ ആലോചനയെ സൂചിപ്പിക്കുന്നു. ‘തർക്കിച്ചു’ എന്നു പറയുന്നത് മൂലപാഠത്തിലില്ലാത്ത ഭിന്നതയുടെ ഭാവം ചേർക്കും.
- source_word: κληρονόμος
  choice: അവകാശി
  rationale: സ്വത്ത് അനന്തരാവകാശമായി ലഭിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപദം.
- source_word: ἀποκτείνωμεν
  choice: നമുക്ക് ഇവനെ കൊന്നുകളയാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ പ്രേരണാത്മകമായ ഉപവിധിരൂപം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; ‘കൊലപ്പെടുത്താം’ എന്നത് സാധ്യമെങ്കിലും ‘കൊന്നുകളയാം’ സംഭാഷണത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: അപ്പോൾ അവകാശം നമ്മുടേതായിത്തീരും
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യവും γένηται എന്നതിലെ ‘ആയിത്തീരുക’ എന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: കഥയിലെ ഈ വഴിത്തിരിവിൽ δέ നൽകുന്ന മൃദുവായ വൈരുധ്യവും തുടർച്ചയും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἰδόντες
  choice: അവനെ കണ്ടപ്പോൾ
  rationale: മുൻകാലകൃതന്തത്തിന്റെ കാലസംബന്ധിയായ അർഥം സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി നൽകുന്നു.
theological_decisions:
- issue: മുന്തിരിത്തോട്ടത്തിന്റെ പശ്ചാത്തലത്തിൽ γεωργοὶ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മുന്തിരിത്തോട്ടം കൃഷിചെയ്യുന്നവർ
  alternative: കുടിയാന്മാർ; കൃഷിക്കാർ
  rationale: മൂലപദത്തിന്റെ കാർഷിക അർഥവും ഉപമയിലെ മുന്തിരിത്തോട്ടസാഹചര്യവും നേരിട്ട് നിലനിർത്തുന്നു. ചുറ്റുമുള്ള കഥയിൽ ഇവർ പാട്ടക്കാരാണെന്ന സൂചനയുണ്ടെങ്കിലും, ആ നിയമപരമായ ആശയം ഈ പദത്തിൽ മാത്രം നിർബന്ധമായി അടങ്ങിയിട്ടില്ല; അതിനാൽ മറ്റൊരു വ്യാഖ്യാനത്തെ മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും കഥാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ഭാഷ ഉപയോഗിച്ചു. നേരിട്ടുള്ള സംഭാഷണത്തിൽ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് മൂലപാഠത്തിലെ ആലോചന, പ്രേരണ, ഉദ്ദേശ്യം എന്നിവ സംരക്ഷിച്ചു.
