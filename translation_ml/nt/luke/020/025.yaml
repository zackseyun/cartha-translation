reference: Luke 20:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “അങ്ങനെയെങ്കിൽ, കൈസറിനുള്ളത് കൈസറിനും ദൈവത്തിനുള്ളത് ദൈവത്തിനും കൊടുക്കുക.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൈസറിനുള്ളത് കൈസറിനും ദൈവത്തിനുള്ളത് ദൈവത്തിനും തിരികെ നൽകുക” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ക്രിയയ്ക്ക് കൊടുക്കുക, അടയ്ക്കുക, അല്ലെങ്കിൽ അർഹമായത് തിരികെ നൽകുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: എന്നാൽ അവൻ അവരോടു പറഞ്ഞു
  rationale: δέ ഇവിടെ നേരിയ പ്രതിവിരുദ്ധതയോ സംഭാഷണത്തിന്റെ തുടർച്ചയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ മറുപടിയുടെ ഭാവം സ്വാഭാവികമായി നിലനിർത്താൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു. λέγω πρὸς αὐτούς എന്ന പ്രയോഗത്തിന് ‘അവരോടു പറഞ്ഞു’ എന്നത് സ്വാഭാവിക മലയാളമാണ്.
- source_word: Τοίνυν
  choice: അങ്ങനെയെങ്കിൽ
  rationale: മുൻപുണ്ടായ സമ്മതത്തിൽനിന്ന് യേശു നിഗമനത്തിലേക്കു നീങ്ങുന്ന അനുമാനാത്മക ഭാവം ഇത് വ്യക്തമാക്കുന്നു; ‘അതുകൊണ്ട്’ എന്നതിനെക്കാൾ സംഭാഷണസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἀπόδοτε
  choice: കൊടുക്കുക
  rationale: ക്രിയയ്ക്ക് കൊടുക്കുക, അടയ്ക്കുക, അർഹമായത് തിരികെ നൽകുക എന്നീ അർഥസാധ്യതകളുണ്ട്. പ്രധാനവാക്യത്തിൽ സ്വാഭാവികവും വിശാലവുമായ ‘കൊടുക്കുക’ സ്വീകരിച്ച്, ബാധ്യതയോ ഉടമസ്ഥതയോ സൂചിപ്പിക്കുന്ന അധിക നിഴൽക്കുറിപ്പ് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: കൈസറിനുള്ളത് കൈസറിന്
  rationale: നികുതിയിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ, കൈസറിനുള്ളതെല്ലാം എന്ന ഗ്രീക്കിലെ വിശാലതയും സംക്ഷിപ്ത സമാന്തരഘടനയും നിലനിർത്തുന്നു.
- source_word: Καίσαρος / Καίσαρι
  choice: കൈസർ
  rationale: Καῖσαρ എന്ന സാമ്രാജ്യത്വ നാമം/പദവി വ്യാഖ്യാനാത്മകമായി ‘ചക്രവർത്തി’ എന്നു മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: ദൈവത്തിനുള്ളത് ദൈവത്തിന്
  rationale: കൈസറിനെക്കുറിച്ചുള്ള ആദ്യഭാഗത്തോടുള്ള ഗ്രീക്കിലെ തുല്യവും ശക്തവുമായ സമാന്തരത സംരക്ഷിക്കുന്നു; ദൈവത്തിനുള്ളതിന്റെ പരിധി വിവർത്തനം സ്വയം നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: രാഷ്ട്രീയ അധികാരത്തിന്റെയും ദൈവത്തിന്റെയും അവകാശങ്ങളുടെ പരിധി
  choice: കൈസറിനും ദൈവത്തിനും അവരവർക്കുള്ളത് നൽകണമെന്ന സമാന്തര ബാധ്യത തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
  alternative: ഇത് മതവും ഭരണകൂടവും തമ്മിലുള്ള കർശന വേർതിരിവായോ, ഭരണകൂടത്തിന് പരിധിയില്ലാത്ത അധികാരം നൽകുന്നതായോ, നികുതി അടയ്ക്കൽ മാത്രത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയായോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ഓരോരുത്തർക്കുമുള്ളത് നൽകുക എന്ന തത്ത്വം പ്രസ്താവിക്കുന്നുവെങ്കിലും ഇരുവിഭാഗത്തിന്റെയും കൃത്യമായ പരിധി നിർവചിക്കുന്നില്ല. അതിനാൽ പിന്നീടുള്ള രാഷ്ട്രീയ-ദൈവശാസ്ത്ര വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. ‘കൈസറിനുള്ളത് … ദൈവത്തിനുള്ളത് …’ എന്ന സമാന്തരഘടന മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
