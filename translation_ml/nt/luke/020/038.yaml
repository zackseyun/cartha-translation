  terminology: ‘ദൈവം,’ ‘മരിച്ചവരുടെ,’ and ‘ജീവിച്ചിരിക്കുന്നവരുടെ’ are appropriate, natural, and preserve the source contrast. The revised final clause retains the ambiguity of αὐτῷ without imposing a doctrinally specific explanation.
