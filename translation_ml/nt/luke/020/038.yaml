  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: ml
  text: ദൈവം മരിച്ചവരുടെ ദൈവമല്ല, ജീവിച്ചിരിക്കുന്നവരുടെ ദൈവമാണ്; കാരണം എല്ലാവരും അവനു ജീവിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാവരും അവന്റെ മുമ്പാകെ ജീവനുള്ളവരാണ്.”
    reason: αὐτῷ എന്ന ദാതിവിനെയും ζῶσιν എന്ന ക്രിയയെയും ചേർത്ത് സ്വാഭാവികമായി മനസ്സിലാക്കാവുന്ന മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: θεὸς
  choice: ദൈവം
  rationale: യഹൂദ ഏകദൈവവിശ്വാസത്തിന്റെ പശ്ചാത്തലത്തിൽ അനിർദേശക ആർട്ടിക്കിളില്ലാത്ത θεός ഇവിടെ നിർദിഷ്ടമായ അർഥത്തിലാണ്; അതിനാൽ ‘ദൈവം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: δὲ ഇവിടെ നേരിയ തുടർച്ചയോ മാറ്റമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യഘടന തന്നെ ഈ നീക്കം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ ചേർത്ത് വിരോധത്തിന്റെ ശക്തി അനാവശ്യമായി കൂട്ടിയിട്ടില്ല; οὐκ ... ἀλλὰ എന്ന വൈരുധ്യം ‘അല്ല ... ആണ്’ എന്ന ഘടനയിൽ വ്യക്തമാണ്.
- source_word: νεκρῶν
  choice: മരിച്ചവരുടെ
  rationale: സുബ്സ്റ്റാന്റീവ് പ്രയോഗത്തിലുള്ള ബഹുവചന ജനിറ്റീവ്; ‘മരിച്ചവരുടെ ദൈവം’ എന്നത് ഗ്രീക്ക് ഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ζώντων
  choice: ജീവിച്ചിരിക്കുന്നവരുടെ
  rationale: സുബ്സ്റ്റാന്റീവ് വർത്തമാന കർത്തരി കൃദന്തം; ‘ജീവിച്ചിരിക്കുന്നവർ’ എന്നത് ‘മരിച്ചവർ’ എന്നതിനോടുള്ള സംക്ഷിപ്തമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: സന്ദർഭത്തിലെ പിതാക്കന്മാരെ ഉൾക്കൊള്ളുന്നതോടൊപ്പം പ്രസ്താവനയുടെ വിശാലതയും നിലനിർത്തുന്നു; ‘അവരെല്ലാവരും’ എന്നു പരിധി ചുരുക്കിയിട്ടില്ല.
- source_word: αὐτῷ
  choice: അവനോടുള്ള ബന്ധത്തിൽ
  rationale: ദാതിവിന്റെ സംക്ഷിപ്തമായ ബന്ധാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. ‘അവനുവേണ്ടി’ എന്ന ഉദ്ദേശാർഥമോ ‘അവന്റെ കാഴ്ചയിൽ’ എന്ന ഏകവ്യാഖ്യാനമോ നിർബന്ധിക്കുന്നില്ല.
- source_word: ζῶσιν
  choice: ജീവിക്കുന്നു
  rationale: വർത്തമാന കർത്തരി നിർദേശക രൂപത്തെ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു; ‘ജീവനുള്ളവരാണ്’ എന്നതും സാധ്യമെങ്കിലും ക്രിയയുടെ സജീവരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: πάντες γὰρ αὐτῷ ζῶσιν എന്ന ഉപവാക്യത്തിലെ αὐτῷയുടെ അർഥം
  choice: കാരണം എല്ലാവരും അവനോടുള്ള ബന്ധത്തിൽ ജീവിക്കുന്നു
  alternative: കാരണം എല്ലാവരും അവന്റെ മുമ്പാകെ ജീവനുള്ളവരാണ്
  rationale: ദാതിവ് ദൈവത്തോടുള്ള ബന്ധത്തിൽ അവർ ജീവിക്കുന്നു എന്ന ആശയം നൽകുന്നു, എന്നാൽ ‘അവനുവേണ്ടി’ എന്ന ലക്ഷ്യാർഥത്തിലേക്കോ ‘അവന്റെ കാഴ്ചയിൽ’ എന്ന വിലയിരുത്തൽമാത്രത്തിലേക്കോ വാചകത്തെ ചുരുക്കുന്നില്ല. ഇങ്ങനെ യേശുവിന്റെ പുനരുത്ഥാനവാദം നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്കിലെ അർഥസാന്ദ്രതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘മരിച്ചവരുടെ ... ജീവിച്ചിരിക്കുന്നവരുടെ’ എന്ന സമാന്തരഘടന മൂലവാചകത്തിലെ വൈരുധ്യം വ്യക്തമാക്കുന്നു. αὐτῷയുടെ അസ്പഷ്ടത മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
