id: LUK.20.10
reference: Luke 20:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: ml
  text: തക്കസമയത്ത്, മുന്തിരിത്തോട്ടത്തിലെ വിളവിൽനിന്ന് അവർ അവനു കുറച്ച് കൊടുക്കേണ്ടതിന്, അവൻ മുന്തിരിത്തോട്ടത്തിലെ കൃഷിക്കാരുടെ അടുക്കൽ ഒരു അടിമയെ[a] അയച്ചു. എന്നാൽ ആ കൃഷിക്കാർ അവനെ അടിച്ചശേഷം വെറുംകൈയോടെ[b] പറഞ്ഞയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദാസനെ’; δοῦλος എന്ന ഗ്രീക്കുപദം ദാസനെയോ അടിമയെയോ സൂചിപ്പിക്കാം. ഇവിടെ ‘അടിമ’ എന്നത് അയാളുടെ ബന്ധിതമായ സാമൂഹികസ്ഥാനം കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ശൂന്യനായി’; അതായത്, മുന്തിരിത്തോട്ടത്തിലെ വിളവിൽനിന്ന് ഒന്നും ലഭിക്കാതെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: തക്കസമയത്ത്
  rationale: സന്ദർഭത്തിന് യോജിച്ച അഥവാ നിശ്ചിത സമയത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമായി പറയാത്ത ‘വിളവെടുപ്പുകാലം’ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: γεωργούς
  choice: മുന്തിരിത്തോട്ടത്തിലെ കൃഷിക്കാർ
  rationale: γεωργοί എന്നത് കൃഷി ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്നു; ἀμπελών എന്ന സന്ദർഭം മുന്തിരിത്തോട്ടമാണെന്ന് വ്യക്തമാക്കുന്നു. ‘പാട്ടക്കാർ’ എന്നു പറഞ്ഞ് നിയമപരമായ സ്ഥാനം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: δοῦλον
  choice: അടിമ
  rationale: ഈ ഉപമയിലെ സാമൂഹികസന്ദർഭത്തിൽ ബന്ധിതമായ സ്ഥാനം സുതാര്യമായി നിലനിർത്തുന്നു; ‘ദാസൻ’ എന്നതിനെക്കാൾ സാധാരണ ആധുനിക മലയാളത്തിൽ അർഥം നേരിട്ട് വ്യക്തമാകുന്നു.
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: അവർ അവനു കൊടുക്കേണ്ടതിനായിരുന്നു അത്
  rationale: ἵνα നിർദേശിക്കുന്ന അയച്ചതിന്റെ ഉദ്ദേശ്യം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഭാവികാല സൂചനയും നിലനിർത്തുന്നു.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: മുന്തിരിത്തോട്ടത്തിലെ വിളവിൽനിന്ന് കുറച്ച്
  rationale: ἀπόയും ഷഷ്ഠീവ്യാകരണവും ഇവിടെ വിളവിന്റെ ഒരു പങ്കിനെ സൂചിപ്പിക്കുന്നു; നിർദിഷ്ടമായ നിയമപരമായ ‘അവകാശവിഹിതം’ ചേർക്കാതെ അംശാർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐξαπέστειλαν
  choice: പറഞ്ഞയച്ചു
  rationale: ἐξαποστέλλωയിലെ അകറ്റി അയയ്ക്കുന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: δείραντες
  choice: അടിച്ചിട്ട്
  rationale: δέρω എന്നതിന്റെ അടിക്കുക/മർദിക്കുക എന്ന പൊതുവായ അർഥം നിലനിർത്തുന്നു; ‘ചാട്ടവാറുകൊണ്ട് അടിച്ചു’ പോലുള്ള അതിവിശദീകരണം ഒഴിവാക്കുന്നു.
- source_word: κενόν
  choice: വെറുംകൈയോടെ
  rationale: ‘ഒന്നും ലഭിക്കാതെ’ എന്ന സന്ദർഭാർഥം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നൽകുന്നു; ‘വെറുതെ’ എന്നതിലെ സാധ്യതയുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
