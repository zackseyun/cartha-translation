translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉപമയുടെ കാർഷിക പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘മുന്തിരിത്തോട്ടത്തിലെ കൃഷിക്കാർ’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ഉദ്ദേശ്യവും അംശാർത്ഥവും സംരക്ഷിക്കുമ്പോൾ നിയമപരമായ പാട്ടാവകാശം പോലുള്ള വ്യക്തമല്ലാത്ത വിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
