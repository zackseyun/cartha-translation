  text: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς· Ἐρωτήσω ὑμᾶς ⸀κἀγὼ λόγον, καὶ εἴπατέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/003.yaml
  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു: “ഞാനും നിങ്ങളോട് ഒരു ചോദ്യം ചോദിക്കും; നിങ്ങൾ എന്നോടു പറയുക:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: എന്നാൽ അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു
  rationale: പ്രതികരണാർഥമുള്ള ἀποκριθείς എന്ന കൃദന്തവും മുഖ്യക്രിയയായ εἶπεν എന്നതും സ്വാഭാവിക മലയാളത്തിൽ വേർതിരിച്ച അർഥങ്ങളോടെ നിലനിർത്തുന്നു; δέ സന്ദർഭത്തിലെ മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കാൻ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ λόγον
  choice: ഞാനും നിങ്ങളോട് ഒരു ചോദ്യം ചോദിക്കാം
  rationale: κἀγώയിലെ ‘ഞാനും’ എന്ന പരസ്പരപ്രതികരണ ഊന്നൽ നിലനിർത്തുന്നു. λόγον അക്ഷരാർഥത്തിൽ ‘വാക്ക്/കാര്യം’ എന്നാകാമെങ്കിലും ἐρωτάωയോടൊപ്പമുള്ള ഈ പ്രയോഗത്തിൽ ചോദിക്കപ്പെടുന്ന കാര്യം, അതായത് ‘ചോദ്യം’, എന്നാണ് സ്വാഭാവിക അർഥം. ഗ്രീക്ക് ഭാവികാലം മലയാളത്തിൽ വെല്ലുവിളിയുടെ സന്ദർഭത്തിന് യോജിച്ച ‘ചോദിക്കാം’ എന്നു നൽകി.
- source_word: καὶ εἴπατέ μοι
  choice: നിങ്ങൾ എന്നോടു പറയുക
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള സ്വരം നിലനിർത്തുകയും μοι എന്ന ദത്തിവിഭക്തിയെ ‘എന്നോടു’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംസാരശൈലി. മൂലത്തിലെ നേരിട്ടുള്ള വെല്ലുവിളിസ്വരവും വാക്യാവസാനത്തിലെ അടുത്ത ചോദ്യത്തിലേക്കുള്ള തുറന്ന ഘടനയും കോളൺ ഉപയോഗിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
