  to: 'എന്നാൽ അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു: “ഞാനും നിങ്ങളോട് ഒരു ചോദ്യം ചോദിക്കും; നിങ്ങൾ എന്നോടു പറയുക:'
