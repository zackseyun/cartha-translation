id: LUK.20.9
reference: Luke 20:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἤρξατο δὲ πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην· ⸀Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν χρόνους ἱκανούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: ml
  text: 'പിന്നെ അവൻ ജനത്തോട് ഈ ഉപമ പറയാൻ തുടങ്ങി: “ഒരു മനുഷ്യൻ ഒരു മുന്തിരിത്തോട്ടം നട്ടു; അത് കൃഷിക്കാർക്ക് പാട്ടത്തിന് കൊടുത്ത് വളരെക്കാലത്തേക്ക് അകന്നുപോയി.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “വളരെക്കാലത്തേക്ക് മറ്റൊരു ദേശത്തേക്കു പോയി.” ഈ ക്രിയ സ്വന്തം നാടോ പ്രദേശമോ വിട്ട് അകന്നിരിക്കുകയെന്ന അർഥവും, വിദേശത്തേക്കു പോകുകയെന്ന അർഥവും സൂചിപ്പിക്കാം.
    reason: ἀποδημέω എന്ന ക്രിയയുടെ “മറ്റൊരു ദേശത്തേക്കു/വിദേശത്തേക്കു പോയി” എന്ന സാധ്യമായ അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതെ സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: പിന്നെ ... തുടങ്ങി
  rationale: δέ ഇവിടെ ആഖ്യാനത്തിന്റെ പുരോഗതി സൂചിപ്പിക്കുന്നു; ἤρξατο സംസാരപ്രവൃത്തിയുടെ ആരംഭം വ്യക്തമാക്കുന്നു.
- source_word: πρὸς τὸν λαὸν λέγειν
  choice: ജനത്തോട് ... പറയാൻ
  rationale: πρός സഹിതമുള്ള പ്രയോഗം അഭിസംബോധന ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്നു; λαός എന്നതിന്റെ കൂട്ടായ അർഥം ‘ജനം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὴν παραβολὴν ταύτην
  choice: ഈ ഉപമ
  rationale: സുവിശേഷങ്ങളിൽ παραβολή എന്ന സാഹിത്യരൂപത്തിന് സ്ഥിരവും സുപരിചിതവുമായ മലയാളപദം ‘ഉപമ’ ആണ്.
- source_word: Ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: കഥയിലെ നിർദിഷ്ട പുരുഷകഥാപാത്രത്തെ പരിചയപ്പെടുത്തുന്ന ഏകവചന പുല്ലിംഗനാമത്തിന്റെ സ്വാഭാവിക പരിഭാഷ.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: ഒരു മുന്തിരിത്തോട്ടം നട്ടു
  rationale: φυτεύω എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘നടുക’ നിലനിർത്തുകയും ἀμπελών വ്യക്തമായി ‘മുന്തിരിത്തോട്ടം’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: അത് കൃഷിക്കാർക്ക് പാട്ടത്തിന് കൊടുത്തശേഷം
  rationale: ἐκδίδωμι ഇവിടെ ഭൂമി പാട്ടത്തിനു നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; γεωργοί കൃഷി ചെയ്യുന്നവരാണ്. ‘ശേഷം’ എന്നത് ഗ്രീക്ക് വാക്യത്തിലെ ക്രമാനുസൃത പ്രവൃത്തികളെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀπεδήμησεν χρόνους ἱκανούς
  choice: ദീർഘകാലത്തേക്ക് ദൂരദേശത്തേക്കു പോയി
  rationale: ἀποδημέω സ്വന്തം പ്രദേശത്തുനിന്ന് അകന്നുപോകുന്നതോ വിദേശത്തേക്കു യാത്ര ചെയ്യുന്നതോ സൂചിപ്പിക്കാം; χρόνους ἱκανούς ഗണ്യമായ ദൈർഘ്യം വ്യക്തമാക്കുന്നു. ‘ദൂരദേശത്തേക്ക്’ സ്ഥലത്തിന്റെ സ്വഭാവം അമിതമായി നിർവചിക്കാതെ ഈ സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ἄνθρωπος എന്ന പുല്ലിംഗ ഏകവചനത്തിന്റെ അവതരണം
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരാൾ
  rationale: ഉറവിടം കഥയിലെ ഒരു പുരുഷനെ അവതരിപ്പിക്കുന്നതിനാൽ ലിംഗസൂചന നിഷ്പക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ, എന്നാൽ മാന്യമായ ആഖ്യാനശൈലി. ഭൂമിയുടമസ്ഥതയുടെയും കൃഷിപ്പാട്ടത്തിന്റെയും പശ്ചാത്തലം ‘പാട്ടത്തിന് കൊടുത്തു’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
