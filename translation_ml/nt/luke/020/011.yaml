  language: ml
  text: അവൻ വീണ്ടും മറ്റൊരു അടിമയെ[a] അയച്ചു. എന്നാൽ അവനെയും അവർ തല്ലി അപമാനിച്ച് വെറുംകൈയോടെ പറഞ്ഞയച്ചു.
