lexical_decisions:
- source_word: προσέθετο
  choice: തുടർന്ന്
  rationale: ക്രിയാനാമത്തോടുകൂടിയ ഈ പ്രയോഗം മറ്റൊരു പ്രവൃത്തി കൂടി ചെയ്യുന്നതിനെ, അഥവാ പ്രവൃത്തി തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തുടർന്ന്’ എന്നത് ആഖ്യാനത്തിന്റെ ഒഴുക്ക് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἕτερον
  choice: മറ്റൊരു
  rationale: ആദ്യത്തേതിൽനിന്ന് വേറിട്ട, അധികമായി അയച്ച ഒരാളെ സൂചിപ്പിക്കുന്നതിന് ‘മറ്റൊരു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πέμψαι
  choice: അയച്ചു
  rationale: അയയ്ക്കുക എന്ന അടിസ്ഥാനാർഥം സന്ദർഭത്തിൽ നേരിട്ട് യോജിക്കുന്നു.
- source_word: δοῦλον
  choice: അടിമ
  rationale: തോട്ടത്തിന്റെ ഉടമയുടെ അധീനതയിലുള്ള പ്രതിനിധിയെയാണ് ഉപമയിൽ സൂചിപ്പിക്കുന്നത്. ‘അടിമ’ എന്നത് δοῦλος സൂചിപ്പിക്കുന്ന ബന്ധിത സാമൂഹികനില വ്യക്തമാക്കുന്നു; ‘ദാസൻ’ എന്ന സ്വാഭാവിക പര്യായം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: κἀκεῖνον
  choice: അവനെയും
  rationale: മുൻപ് അയച്ച ആളോടുണ്ടായതുപോലെ ഈ രണ്ടാമനോടും പെരുമാറിയെന്ന സമാന്തരതയിലെ ‘കൂടി’ എന്ന ആശയം ‘-യും’ വഴി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δείραντες
  choice: തല്ലി
  rationale: ശാരീരികമായി അടിക്കുക എന്ന പൊതുവായ അർഥം നൽകുന്നു; ചാട്ടവാറുകൊണ്ടുള്ള പ്രഹരം എന്നിങ്ങനെ രീതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἀτιμάσαντες
  choice: അപമാനിച്ച്
  rationale: മാനഹാനിയും ലജ്ജാകരമായ പെരുമാറ്റവും ഉൾക്കൊള്ളുന്ന സാമൂഹിക അർഥം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξαπέστειλαν
  choice: പറഞ്ഞയച്ചു
  rationale: അവിടെനിന്ന് അയച്ചുകളഞ്ഞു എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κενόν
  choice: വെറുംകൈയോടെ
  rationale: പ്രതീക്ഷിച്ച ഫലമൊന്നും ലഭിക്കാതെ മടങ്ങേണ്ടിവന്നുവെന്ന സന്ദർഭാർഥം മലയാളത്തിൽ പതിവായ പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ
  rationale: ഇവിടെ ഉടമസ്ഥതയുടെയും അധീനതയുടെയും സാമൂഹികബന്ധം പ്രസക്തമാണ്. അതിനാൽ ആ നില മറച്ചുവയ്ക്കാത്ത ‘അടിമ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; കൂടുതൽ മൃദുവായെങ്കിലും സാധ്യമായ ‘ദാസൻ’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ തുടർച്ചയും പ്രവർത്തനങ്ങളുടെ ക്രമവും സ്വാഭാവികമായ രണ്ട് മലയാളവാക്യങ്ങളായി അവതരിപ്പിച്ചിരിക്കുന്നു.
