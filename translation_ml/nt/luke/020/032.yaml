lexical_decisions:
- source_word: ὕστερον
  choice: പിന്നീട്
  rationale: കഥയിലെ തുടർന്നുള്ള സമയത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണം. ‘പിന്നീട്’ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ കാലക്രമം അനാവശ്യമായി കൂടുതൽ നിർണയിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: യും
  rationale: മുൻസന്ദർഭത്തിൽ സഹോദരന്മാർ മരിച്ചതുപോലെ സ്ത്രീയും മരിച്ചുവെന്ന സമാനത ഇവിടെ καί സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘യും’ അത് സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἡ γυνή
  choice: ആ സ്ത്രീ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. പല സഹോദരന്മാരുമായുള്ള വിവാഹക്രമം വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ, ഒരു പ്രത്യേക ദാമ്പത്യബന്ധം തെറ്റായി സൂചിപ്പിക്കാതിരിക്കാൻ ‘ആ സ്ത്രീ’ കൂടുതൽ വ്യക്തമാണ്.
- source_word: ἀπέθανεν
  choice: മരിച്ചു
  rationale: ἀποθνῄσκω എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാലവിവരണം നേരിട്ട് നൽകുന്നു; മൂലപാഠത്തിലില്ലാത്ത മൃദൂകരണം ഒഴിവാക്കുന്നു.
