revisions:
- from: 'അവർ അവനോടു ചോദിച്ചു: “നീ എന്ത് അധികാരത്താലാണ് ഈ കാര്യങ്ങൾ ചെയ്യുന്നത്? അല്ലെങ്കിൽ നിനക്ക് ഈ അധികാരം തന്നത് ആരാണെന്ന് ഞങ്ങളോടു പറയുക.”'
  to: 'അവർ അവനോടു പറഞ്ഞു: “നീ ഏത് അധികാരത്താൽ ഈ കാര്യങ്ങൾ ചെയ്യുന്നു എന്ന് ഞങ്ങളോടു പറയുക; അല്ലെങ്കിൽ നിനക്കു ഈ അധികാരം തന്നവൻ ആരാണ്?”'
