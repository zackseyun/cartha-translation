id: LUK.20.2
reference: Luke 20:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “നീ ഏത് അധികാരത്താൽ ഈ കാര്യങ്ങൾ ചെയ്യുന്നു എന്ന് ഞങ്ങളോടു പറയുക; അല്ലെങ്കിൽ നിനക്കു ഈ അധികാരം തന്നവൻ ആരാണ്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: അവർ
  rationale: മുൻവാക്യത്തോടുള്ള ലളിതമായ ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാതെയും വ്യക്തമാണ്; കർത്താവിനെ മുന്നിൽ കൊണ്ടുവരുന്നത് സ്വാഭാവികമാണ്.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: അവർ അവനോടു ചോദിച്ചു
  rationale: പറയുക എന്ന ക്രിയയും പറയുന്നവർ എന്ന പങ്കുപദവും ചേർന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ പദാനുപദമായി ആവർത്തിക്കാതെ, തുടർന്ന് വരുന്ന ചോദ്യം പരിഗണിച്ച് ‘ചോദിച്ചു’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: Εἰπὸν ἡμῖν
  choice: ഞങ്ങളോടു പറയുക
  rationale: ആജ്ഞാരൂപവും ‘ഞങ്ങൾക്ക്/ഞങ്ങളോടു’ എന്ന ആശയവും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: എന്ത് അധികാരത്താലാണ്
  rationale: ἐν ഇവിടെ പ്രവർത്തനത്തിന്റെ അധികാരപരമായ അടിസ്ഥാനമോ അനുമതിയോ സൂചിപ്പിക്കുന്നു; ‘അധികാരത്താൽ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചന സൂചകപദം നിലനിർത്തി, സമീപകാല ദേവാലയപ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: ποιεῖς
  choice: ചെയ്യുന്നത്
  rationale: വർത്തമാനകാലത്തിൽ തുടരുന്ന പ്രവർത്തനത്തെ ചോദ്യം ചെയ്യുന്ന ഭാവം മലയാളത്തിലെ ഈ രൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: അതേ വെല്ലുവിളിയുടെ മറ്റൊരു രൂപം അവതരിപ്പിക്കുന്ന വികൽപബന്ധം നിലനിർത്തുന്നു.
- source_word: τίς ἐστιν ὁ δούς
  choice: തന്നത് ആരാണ്
  rationale: ὁ δούς എന്ന substantival participle-ന്റെ വ്യക്തിയെ തിരിച്ചറിയാനുള്ള ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: σοι
  choice: നിനക്ക്
  rationale: അധികാരം ലഭിച്ച വ്യക്തിയായി യേശുവിനെ സൂചിപ്പിക്കുന്ന ദാതൃവിഭക്തി വ്യക്തമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: τὴν ἐξουσίαν ταύτην
  choice: ഈ അധികാരം
  rationale: ταύτην എന്ന സമീപസൂചനയും ἐξουσίαയുടെ അധികാര/അനുമതി അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദേവാലയത്തിലെ യേശുവിന്റെ പ്രവർത്തനങ്ങളുടെ പശ്ചാത്തലത്തിൽ ἐξουσίαയുടെ അർഥം
  choice: അധികാരം
  alternative: ശക്തി; അവകാശം
  rationale: നേതാക്കൾ ചോദ്യം ചെയ്യുന്നത് യേശുവിന്റെ കഴിവിനെയല്ല, അവന്റെ പ്രവർത്തനത്തിനുള്ള സാധുതയെയും അധികാരത്തിന്റെ ഉറവിടത്തെയുമാണ്. ‘അധികാരം’ സ്ഥാപനപരവും ദൈവശാസ്ത്രപരവുമായ ഈ ഭാവം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനപരമായ speech-introduction മലയാളത്തിൽ സ്വാഭാവികമായി ചുരുക്കിയിട്ടുണ്ട്; ചോദ്യത്തിന്റെ ഇരട്ടഘടനയും ‘അധികാരം’ എന്ന പ്രധാനപദവും നിലനിർത്തി.
