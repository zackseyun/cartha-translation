  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “മശീഹ ദാവീദിന്റെ പുത്രനാണെന്ന് അവർ പറയുന്നത് എങ്ങനെ?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ക്രിസ്തു.” ഇവിടെ ഗ്രീക്കിലെ Χριστός എന്ന പദവി പ്രതീക്ഷിത ദാവീദിക വിമോചകനെ സൂചിപ്പിക്കുന്നതിനാൽ “മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: “ദാവീദിന്റെ ഒരു പുത്രൻ” എന്നോ “ദാവീദുപുത്രൻ” എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ദാവീദിന്റെ പുത്രൻ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസംഭാഷണത്തിൽനിന്നുള്ള മൃദുവായ ആശയമാറ്റവും യേശു ഉന്നയിക്കുന്ന വെല്ലുവിളിനിറഞ്ഞ ചോദ്യവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς αὐτούς
  choice: അവരോടു
  rationale: സംസാരത്തിന്റെ ദിശ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: Πῶς
  choice: എങ്ങനെ
  rationale: പ്രസ്താവനയുടെ യുക്തിയെയോ സാധുതയെയോ ചോദ്യം ചെയ്യുന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: λέγουσιν
  choice: അവർ പറയുന്നത്
  rationale: വ്യക്തമായി നിർദേശിക്കപ്പെടാത്ത ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നു നിലനിർത്തുകയും വർത്തമാനകാല പ്രസ്താവന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: τὸν χριστόν
  choice: മശീഹ
  rationale: ഇവിടെ പദം ദാവീദുമായി ബന്ധമുള്ള പ്രതീക്ഷിത രാജകീയ വിമോചകന്റെ പദവിയായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ‘മശീഹ’ യോജിക്കുന്നു.
- source_word: εἶναι
  choice: ആണെന്ന്
  rationale: λέγουσιν-നോടൊപ്പമുള്ള infinitive-നെ മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷപ്രസ്താവനയായി അവതരിപ്പിക്കുന്നു.
- source_word: Δαυὶδ υἱόν
  choice: ദാവീദിന്റെ പുത്രൻ
  rationale: അക്ഷരാർഥത്തിലുള്ള പുത്രത്വഭാഷയും ദാവീദിക വംശബന്ധവും നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത നിർദിഷ്ടത പ്രത്യേകം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: സന്ദർഭം പ്രതീക്ഷിത ദാവീദിക രാജവിമോചകനെക്കുറിച്ചായതിനാൽ പദവിയുടെ യെഹൂദ മശീഹാസംബന്ധിയായ അർഥം മുൻനിരയിൽ വരുന്നു.
- issue: ദാവീദിക പുത്രത്വഭാഷ
  choice: ദാവീദിന്റെ പുത്രൻ
  alternative: ദാവീദിന്റെ ഒരു പുത്രൻ / ദാവീദുപുത്രൻ
  rationale: തുടർന്നുള്ള വാക്യങ്ങൾ പരിശോധിക്കുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കാതെ, ഗ്രീക്കിലെ ബന്ധപരമായ ഭാഷ നേരിട്ട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘പറഞ്ഞു’ എന്ന പ്രയോഗം ലളിതത്വം നൽകുന്നു; ചോദ്യം ഉന്നയിക്കുന്ന യുക്തിപരമായ വെല്ലുവിളി ‘പറയുന്നത് എങ്ങനെ?’ എന്ന ഘടനയിൽ നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
