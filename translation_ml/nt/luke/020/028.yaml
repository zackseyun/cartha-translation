  source_fidelity: 'മുഖ്യാർഥം പൊതുവേ കൃത്യമാണ്: മോശെയുടെ നിയമഉദ്ധരണി, ഭാര്യയോടുകൂടി മരിക്കുന്നതും മക്കളില്ലാത്തതുമായ നിബന്ധന, സഹോദരൻ സന്തതി ഉയർത്തേണ്ട നിയമബാധ്യത എന്നിവ എല്ലാം നിലനിൽക്കുന്നു. എന്നാൽ “ആ ഭാര്യയെ സ്വീകരിച്ച്” എന്ന പ്രയോഗം ആധുനിക മലയാളത്തിൽ നിയമപരമായ വിവാഹാർഥം വേണ്ടത്ര വ്യക്തമായി നൽകുന്നില്ല. λαβῃ ... τὴν γυναῖκα എന്ന സന്ദർഭാർഥം ‘ഭാര്യയായി സ്വീകരിക്കുക/വിവാഹം കഴിക്കുക’ എന്നാണ്.'
  naturalness: “ഭാര്യയുള്ളവനായിരിക്കെ” എന്നത് ഗ്രഹിക്കാവുന്നതാണെങ്കിലും “ഭാര്യയുണ്ടായിരിക്കെ” കൂടുതൽ സ്വാഭാവികമായ ആധുനിക നിലവാരമലയാളമാണ്. “ആ ഭാര്യയെ സ്വീകരിച്ച്” എന്നത് ബന്ധം/വിവാഹം സ്ഥാപിക്കുന്നതിനെക്കാൾ ഒരാളെ ഏറ്റെടുക്കുന്നതുപോലെ കേൾക്കാം; “അവന്റെ ഭാര്യയെ ഭാര്യയായി സ്വീകരിച്ച്” നിയമസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
