  revised_text: 'അവർ പറഞ്ഞു: “ഗുരോ, മോശെ ഞങ്ങൾക്കുവേണ്ടി ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: ഒരാളുടെ സഹോദരൻ ഭാര്യയുണ്ടായിരിക്കെ[a] മരിക്കുകയും അയാൾ മക്കളില്ലാത്തവനായിരിക്കുകയും ചെയ്താൽ, അവന്റെ സഹോദരൻ അവന്റെ ഭാര്യയെ ഭാര്യയായി സ്വീകരിച്ച് മരിച്ചുപോയ സഹോദരനുവേണ്ടി സന്തതിയെ ജനിപ്പിക്കണം[b].”'
