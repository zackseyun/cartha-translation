id: LUK.20.28
reference: Luke 20:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ഗുരോ, മോശെ ഞങ്ങൾക്കുവേണ്ടി ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: ഒരാളുടെ സഹോദരൻ ഭാര്യയുണ്ടായിരിക്കെ[a] മരിക്കുകയും അയാൾ മക്കളില്ലാത്തവനായിരിക്കുകയും ചെയ്താൽ, അവന്റെ സഹോദരൻ അവന്റെ ഭാര്യയെ ഭാര്യയായി സ്വീകരിച്ച് മരിച്ചുപോയ സഹോദരനുവേണ്ടി സന്തതിയെ ജനിപ്പിക്കണം[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഭാര്യയെ ശേഷിപ്പിച്ചിട്ട്” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ഭാര്യയുണ്ടായിരിക്കെ മരിച്ചാൽ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: '“സന്തതിയെ ജനിപ്പിക്കുക” എന്നത് ആവർത്തനം 25:5-ലെ നിയമപ്രയോഗത്തെ പ്രതിധ്വനിപ്പിക്കുന്നു: മരിച്ച സഹോദരന്റെ പേരിൽ പിൻതലമുറ ഉണ്ടാക്കുക എന്നതാണ് ആശയം. അക്ഷരാർഥത്തിൽ, “വിത്ത് ഉയർത്തുക.”'
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: ഗുരോ
  rationale: യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന പദം. ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായ സംബോധനയാണ്.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: മോശെ ഞങ്ങൾക്കുവേണ്ടി ഇങ്ങനെ എഴുതിയിരിക്കുന്നു
  rationale: ἡμῖν എന്ന ദത്തി ഇസ്രായേലിനു നൽകിയ നിയമത്തിന്റെ പ്രയോജനവും പ്രസക്തിയും സൂചിപ്പിക്കുന്നു; നേരിട്ട് എഴുതിയ കത്ത് എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: ഒരാളുടെ സഹോദരൻ ... മരിക്കുകയും
  rationale: τινος എന്ന അനിശ്ചിതവും പൊതുവുമായ ഏകവചനപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔχων γυναῖκα
  choice: ഭാര്യയുള്ളവനായിരിക്കെ
  rationale: ഗ്രീക്കിലെ ‘ഭാര്യയുള്ളവനായി’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘ഭാര്യയെ ശേഷിപ്പിച്ച്’ എന്നത് സന്ദർഭോചിതമായെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: οὗτος ἄτεκνος ᾖ
  choice: അയാൾ മക്കളില്ലാത്തവനായിരിക്കുകയും ചെയ്താൽ
  rationale: οὗτος മുമ്പ് പറഞ്ഞ മരിച്ച സഹോദരനെയാണ് സൂചിപ്പിക്കുന്നത്. ἄτεκνος എന്നത് മക്കളില്ലാത്ത അവസ്ഥയെ ലിംഗഭേദം കൂട്ടിച്ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: അവന്റെ സഹോദരൻ ആ ഭാര്യയെ സ്വീകരിച്ച്
  rationale: നിയമം നിർദേശിക്കുന്ന ബാധ്യതയെ പ്രതിഫലിപ്പിക്കുന്നു. ‘വിവാഹം കഴിച്ച്’ എന്നു വികസിപ്പിക്കാതെ λαμβάνω എന്ന ക്രിയയുടെ നിയമപരമായ ഭാഷ നിലനിർത്തുന്നു.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: സന്തതിയെ ജനിപ്പിക്കണം
  rationale: ‘വിത്ത് ഉയർത്തുക’ എന്ന പദാനുപദരൂപം മലയാളത്തിൽ അസ്വാഭാവികമാണ്. മരിച്ച സഹോദരന്റെ പേരിൽ സന്തതി ഉണ്ടാക്കുക എന്ന നിയമപ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: മരിച്ച സഹോദരനുവേണ്ടി
  rationale: ദത്തി വിഭക്തിയുടെ പ്രയോജന/ബന്ധ അർഥം നൽകുന്നു. ഏത് സഹോദരനെയാണ് ഉദ്ദേശിക്കുന്നതെന്നത് മലയാളത്തിൽ അവ്യക്തമാകാതിരിക്കാൻ ‘മരിച്ച’ എന്നു സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദേവരവിവാഹവുമായി ബന്ധപ്പെട്ട മോശൈക നിയമഭാഷ എങ്ങനെ അവതരിപ്പിക്കണം
  choice: “ആ ഭാര്യയെ സ്വീകരിച്ച് മരിച്ച സഹോദരനുവേണ്ടി സന്തതിയെ ജനിപ്പിക്കണം” എന്ന നേരായ നിയമഭാഷ
  alternative: “വിധവയെ വിവാഹം കഴിച്ച് സഹോദരന്റെ വംശം നിലനിർത്തണം”
  rationale: ആവർത്തനം 25:5-ലെ നിയമപശ്ചാത്തലം നിലനിർത്തുമ്പോഴും ‘വിധവ’, ‘വംശം നിലനിർത്തുക’ തുടങ്ങിയ വ്യാഖ്യാനവികാസങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല. നിയമത്തിന്റെ ബാധ്യതയും മരിച്ച സഹോദരനുവേണ്ടിയുള്ള സന്തതിയും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ശൈലി. മോശൈക നിയമത്തിന്റെ ഔപചാരിക സ്വരം നിലനിർത്തിയിട്ടുണ്ടെങ്കിലും പഴഞ്ചൻ പദങ്ങളും അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങളും ഒഴിവാക്കി. ഇരുവിധ അടിക്കുറിപ്പുകളുടെയും സൂചകങ്ങൾ ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
