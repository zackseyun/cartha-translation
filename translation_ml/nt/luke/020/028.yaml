revisions:
- from: 'അവർ പറഞ്ഞു: “ഗുരോ, മോശെ ഞങ്ങൾക്കുവേണ്ടി ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: ഒരാളുടെ സഹോദരൻ ഭാര്യയുള്ളവനായിരിക്കെ[a] മരിക്കുകയും അയാൾ മക്കളില്ലാത്തവനായിരിക്കുകയും ചെയ്താൽ, അവന്റെ സഹോദരൻ ആ ഭാര്യയെ സ്വീകരിച്ച് മരിച്ച സഹോദരനുവേണ്ടി സന്തതിയെ ജനിപ്പിക്കണം[b].”'
  to: 'അവർ പറഞ്ഞു: “ഗുരോ, മോശെ ഞങ്ങൾക്കുവേണ്ടി ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: ഒരാളുടെ സഹോദരൻ ഭാര്യയുണ്ടായിരിക്കെ[a] മരിക്കുകയും അയാൾ മക്കളില്ലാത്തവനായിരിക്കുകയും ചെയ്താൽ, അവന്റെ സഹോദരൻ അവന്റെ ഭാര്യയെ ഭാര്യയായി സ്വീകരിച്ച് മരിച്ചുപോയ സഹോദരനുവേണ്ടി സന്തതിയെ ജനിപ്പിക്കണം[b].”'
  rationale: നിയമസന്ദർഭത്തിലെ ‘ഭാര്യയെ എടുക്കുക’ എന്ന ഗ്രീക്കു പ്രയോഗത്തിന്റെ വിവാഹാർഥം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ “ഭാര്യയായി സ്വീകരിച്ച്” എന്നു ഭേദഗതി ചെയ്തു. ഭാര്യയോടുകൂടിയ നിലയിൽ മരിക്കൽ എന്ന മൂലപാഠത്തിലെ തുറന്ന പ്രയോഗവും, സന്തതിയെ മരിച്ച സഹോദരനുവേണ്ടി ഉയർത്തുക എന്ന നിയമലക്ഷ്യവും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവയുടെ പ്രസക്തമായ വാക്യഭാഗങ്ങളിലാണുള്ളത്.
