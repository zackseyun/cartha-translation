id: LUK.20.16
reference: Luke 20:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: ml
  text: 'അവൻ വന്ന് ഈ കുടിയാൻ കർഷകരെ[a] നശിപ്പിക്കും; മുന്തിരിത്തോട്ടം മറ്റുള്ളവർക്കു കൊടുക്കും.” ഇതു കേട്ടപ്പോൾ അവർ പറഞ്ഞു: “അതു ഒരിക്കലും സംഭവിക്കാതിരിക്കട്ടെ!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കർഷകർ’ അല്ലെങ്കിൽ ‘കുടിയാന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം; മറ്റൊരാളുടെ ഉടമസ്ഥതയിലുള്ള ഭൂമിയിൽ കൃഷിചെയ്തിരുന്നവരെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: '‘തീർച്ചയായും അരുത്!’ അല്ലെങ്കിൽ ‘ഒരിക്കലുമില്ല!’ എന്നും പരിഭാഷപ്പെടുത്താം. ശക്തമായ നിരാകരണം പ്രകടിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അക്ഷരാർഥം: ‘അതു സംഭവിക്കാതിരിക്കട്ടെ.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: അവൻ വന്ന് … ചെയ്യും
  rationale: ഭാവികാലത്തിലുള്ള ἔρχομαι ഉടമയുടെ വരവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ സംയുക്തക്രിയാരൂപത്തിൽ വരവും തുടർന്നുള്ള നടപടികളും ഭാവികാലമായി അവതരിപ്പിക്കുന്നു; ‘തിരിച്ചുവരും’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἀπολέσει
  choice: നശിപ്പിക്കും
  rationale: ἀπόλλυμι എന്നത് കൊല്ലുക, നശിപ്പിക്കുക, നാശത്തിലാക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. ‘നശിപ്പിക്കും’ വിധിയുടെ കാഠിന്യം നിലനിർത്തുന്നതിനൊപ്പം ഉപമയിലെ അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
- source_word: γεωργοὺς
  choice: കുടിയാൻ കർഷകർ
  rationale: ഇവിടെ സ്വന്തം ഭൂമിയിൽ കൃഷിചെയ്യുന്നവർ മാത്രമല്ല, മറ്റൊരാളുടെ മുന്തിരിത്തോട്ടം ഏറ്റെടുത്തു നടത്തുന്നവരാണ് ഉദ്ദേശ്യം. ‘കുടിയാൻ കർഷകർ’ ആ സാമൂഹികപങ്ക് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: τούτους
  choice: ഈ
  rationale: സമീപസൂചകമായ ഗ്രീക്ക് സർവനാമത്തിന്റെ നേരിട്ടുള്ള സൂചന ‘ഈ’ നിലനിർത്തുന്നു.
- source_word: δώσει
  choice: കൊടുക്കും
  rationale: δίδωμι എന്ന ലളിതമായ ക്രിയയ്ക്ക് സ്വാഭാവികമായ നേരിട്ടുള്ള തുല്യപദം; ‘ഏൽപ്പിക്കും’ പോലുള്ള വ്യാഖ്യാനാത്മക സൂക്ഷ്മത ചേർക്കുന്നില്ല.
- source_word: τὸν ἀμπελῶνα
  choice: മുന്തിരിത്തോട്ടം
  rationale: ഉപമയുടെ കൃഷിചിത്രവും പഴയനിയമ അനുരണനവും നിലനിർത്തുന്ന പ്രചാരത്തിലുള്ള മലയാളപദം.
- source_word: ἄλλοις
  choice: മറ്റുള്ളവർക്ക്
  rationale: ആർക്കാണ് നൽകുന്നതെന്ന് ഗ്രീക്ക് വ്യക്തമാക്കാത്തതിനാൽ അതേ അനിശ്ചിതത്വം സൂക്ഷിക്കുന്നു.
- source_word: ἀκούσαντες δὲ εἶπαν
  choice: ഇതു കേട്ടപ്പോൾ അവർ പറഞ്ഞു
  rationale: അയോറിസ്റ്റ് കൃദന്തരൂപത്തിന്റെ കാലസംബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; δέ ഇവിടെ മൃദുവായ കഥാഗതിമാറ്റമായതിനാൽ പ്രത്യേകം വിരോധസൂചകപദം ആവശ്യമില്ല.
- source_word: Μὴ γένοιτο
  choice: അങ്ങനെ ഒരിക്കലും സംഭവിക്കാതിരിക്കട്ടെ!
  rationale: ഒപ്റ്റേറ്റീവ് രൂപത്തിലുള്ള ശക്തമായ ആശംസാപരമായ നിരാകരണം മലയാളത്തിൽ നിലനിർത്തുന്നു; വെറും ‘ഒരിക്കലുമില്ല’ എന്ന താർക്കിക നിഷേധത്തേക്കാൾ സംഭവത്തോടുള്ള ഞെട്ടലും ശക്തമായ എതിർപ്പും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: Μὴ γένοιτο എന്ന ജനക്കൂട്ടത്തിന്റെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ആശംസാരൂപത്തിലുള്ള ശക്തമായ നിരാകരണമായി ‘അങ്ങനെ ഒരിക്കലും സംഭവിക്കാതിരിക്കട്ടെ!’
  alternative: ‘തീർച്ചയായും അരുത്!’ അല്ലെങ്കിൽ ‘ഒരിക്കലുമില്ല!’
  rationale: ഈ സന്ദർഭത്തിൽ പ്രഖ്യാപിച്ച വിധി സംഭവിക്കരുതെന്ന ഞെട്ടലോടെയുള്ള പ്രതികരണമാണ് പ്രധാനം. ഗ്രീക്ക് ഒപ്റ്റേറ്റീവിന്റെ ഇച്ഛാപരമായ ശക്തി നിലനിർത്തുന്നു; അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കുടിയാൻ കർഷകർ’ സാമൂഹികപങ്ക് വ്യക്തമാക്കുന്നു; മുഖ്യവാക്യത്തിലെ ശക്തമായ പ്രതികരണം സംസാരഭാഷാസൗകര്യവും ഗ്രീക്ക് ഒപ്റ്റേറ്റീവിന്റെ രൂപവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
