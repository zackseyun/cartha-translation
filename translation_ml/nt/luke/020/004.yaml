id: LUK.20.4
reference: Luke 20:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τὸ βάπτισμα Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/004.yaml
  text: Was John's baptism from heaven or from men?[a]
translation:
  language: ml
  text: യോഹന്നാന്റെ സ്നാനം സ്വർഗത്തിൽനിന്നുള്ളതായിരുന്നോ, അതോ മനുഷ്യരിൽനിന്നുള്ളതോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവത്തിൽനിന്നുള്ളത്’; ഗ്രീക്കിൽ അക്ഷരാർഥം ‘സ്വർഗത്തിൽനിന്നുള്ളത്’ എന്നാണ്. ദൈവിക ഉറവിടത്തെയോ അധികാരത്തെയോ സൂചിപ്പിക്കുന്ന ആദരസൂചക പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: സ്നാനം
  rationale: യോഹന്നാനുമായി ബന്ധപ്പെട്ട ആചാരത്തെയും പ്രയോഗത്തെയും സൂചിപ്പിക്കുന്ന നാമമാണ്; മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ ക്രൈസ്തവ ഉപയോഗത്തിലും ‘സ്നാനം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: Ἰωάννου
  choice: യോഹന്നാന്റെ
  rationale: ബന്ധസൂചകമായ ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥ/ബന്ധരൂപത്തിൽ നൽകി.
- source_word: ἐξ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്നുള്ളത്
  rationale: അക്ഷരാർഥമായ ‘സ്വർഗത്തിൽനിന്ന്’ എന്ന യഹൂദ ആദരസൂചക പ്രയോഗം നിലനിർത്തുന്നു; ദൈവിക ഉറവിടമോ അധികാരമോ എന്ന ആശയം നേരിട്ട് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: ἐξ ἀνθρώπων
  choice: മനുഷ്യരിൽനിന്നുള്ളത്
  rationale: ἀνθρώπων ഇവിടെ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; ദൈവിക ഉറവിടത്തിന് വിപരീതമായി മനുഷ്യരിൽനിന്നുള്ള ഉറവിടത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἦν
  choice: ആയിരുന്നോ
  rationale: ഉറവിടം സൂചിപ്പിക്കുന്ന പദസമുച്ചയങ്ങളോടുകൂടിയ ഗ്രീക്ക് ബന്ധകക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല ചോദ്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἢ
  choice: അതോ
  rationale: ചോദ്യത്തിലെ പരസ്പരവിരുദ്ധമായ രണ്ടു സാധ്യതകളെ വ്യക്തമായി വേർതിരിക്കുന്ന സ്വാഭാവിക മലയാള സംയോജകമാണ്.
theological_decisions:
- issue: യോഹന്നാന്റെ സ്നാനവുമായി ബന്ധപ്പെട്ട ‘സ്വർഗത്തിൽനിന്ന്’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘സ്വർഗത്തിൽനിന്നുള്ളത്’ എന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ദൈവത്തിൽനിന്നുള്ളത്
  rationale: ഈ പ്രയോഗം ദൈവിക ഉറവിടത്തെയോ അധികാരത്തെയോ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം നേരിട്ട് ‘സ്വർഗത്തിൽനിന്ന്’ എന്നാണ് പറയുന്നത്. ആ ആദരസൂചക പ്രയോഗവും അതിലുള്ള സൂക്ഷ്മതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ള ബൈബിൾശൈലി ഉപയോഗിച്ചു. ‘മനുഷ്യരിൽനിന്നുള്ളത്’ ലിംഗനിരപേക്ഷമായ മനുഷ്യ ഉറവിടം വ്യക്തമാക്കുന്നു; ‘സ്വർഗത്തിൽനിന്നുള്ളത്’ മൂലപാഠത്തിന്റെ ആദരസൂചക പ്രയോഗം നിലനിർത്തുന്നു.
