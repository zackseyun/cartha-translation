  text: Ἀκούοντος δὲ παντὸς τοῦ λαοῦ εἶπεν τοῖς ⸀μαθηταῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/045.yaml
  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: ml
  text: 'ജനമെല്ലാം കേട്ടുകൊണ്ടിരിക്കെ[a], അവൻ ശിഷ്യന്മാരോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ജനമെല്ലാം കേൾക്കുമ്പോൾ, അവൻ ശിഷ്യന്മാരോടു പറഞ്ഞു.’ യേശു സംസാരിച്ച സമയത്തെ സാഹചര്യം സൂചിപ്പിക്കാൻ ഗ്രീക്കിൽ സ്വതന്ത്ര ഷഷ്ഠീവിഭക്തി കൃദന്തഘടനയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντος
  choice: കേട്ടുകൊണ്ടിരിക്കെ
  rationale: ἀκούω എന്ന ക്രിയയുടെ വർത്തമാനകാല കൃദന്തരൂപം ജനത്തിന്റെ കേൾവി യേശുവിന്റെ സംസാരത്തോടൊപ്പം തുടർന്നിരുന്ന സാഹചര്യമാണെന്ന് സൂചിപ്പിക്കുന്നു. ‘കേട്ടുകൊണ്ടിരിക്കെ’ ഈ സമകാലികവും തുടരുന്നതുമായ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിലെ വാക്യക്രമവും ‘-ഇരിക്കെ’ എന്ന ഘടനയും ആ തുടർച്ച സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘എന്നാൽ’ പോലൊരു പദം ചേർക്കുന്നത് അനാവശ്യമായ വിരോധഭാവം സൃഷ്ടിക്കും.
- source_word: παντὸς τοῦ λαοῦ
  choice: ജനമെല്ലാം
  rationale: ഏകവചനമായ λαός-നോടുകൂടിയ πᾶς ജനത്തെ മുഴുവനായൊരു സമൂഹമായി സൂചിപ്പിക്കുന്നു. ‘ജനമെല്ലാം’ സംക്ഷിപ്തവും സ്വാഭാവികവും ആ കൂട്ടായ അർഥം നിലനിർത്തുന്നതുമാണ്.
- source_word: λαοῦ
  choice: ജനം
  rationale: ലൂക്കോസിൽ λαός സാധാരണയായി വെറും ആൾക്കൂട്ടത്തേക്കാൾ ‘ജനം’ എന്ന സമൂഹപരമായ അർഥം വഹിക്കുന്നു. അതിനാൽ ‘പുരുഷാരം’ എന്നതിനെക്കാൾ ‘ജനം’ യോജിക്കുന്നു.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ ഭൂതകാല ആഖ്യാനരൂപത്തിന് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാള തുല്യപദമാണ് ‘പറഞ്ഞു’.
- source_word: τοῖς μαθηταῖς
  choice: ശിഷ്യന്മാരോടു
  rationale: μαθηταί എന്നതിന് സുവിശേഷസന്ദർഭത്തിലെ പതിവും കൃത്യവുമായ തുല്യപദം ‘ശിഷ്യന്മാർ’ ആണ്. ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം ഇല്ലാത്തതിനാൽ ‘തന്റെ’ എന്നു ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: സംഭവത്തിലെ ശ്രോതൃവിഭാഗങ്ങളുടെ വ്യത്യാസം
  choice: ജനം മുഴുവൻ കേട്ടുകൊണ്ടിരിക്കുമ്പോൾ യേശു നേരിട്ട് ശിഷ്യന്മാരോടു സംസാരിക്കുന്നു.
  alternative: യേശു ജനത്തെയാകെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നു; അല്ലെങ്കിൽ ജനത്തിൽനിന്ന് വേറിട്ട് സ്വകാര്യമായി ശിഷ്യന്മാരോടു സംസാരിക്കുന്നു.
  rationale: ജനമെല്ലാം കേൾക്കുന്ന പൊതുസാഹചര്യം genitive absolute വ്യക്തമാക്കുന്നു; τοῖς μαθηταῖς എന്ന ദത്തിവിഭക്തി നേരിട്ടുള്ള അഭിസംബോധിതർ ശിഷ്യന്മാരാണെന്ന് വ്യക്തമാക്കുന്നു. വിവർത്തനം ഈ രണ്ടു ഘടകങ്ങളും ഒന്നിലൊന്ന് ലയിപ്പിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ജനമെല്ലാം’ പൊതുജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘ശിഷ്യന്മാരോടു’ എന്നത് നേരിട്ടുള്ള അഭിസംബോധിതരെ കൃത്യമായി വേർതിരിക്കുന്നു.
