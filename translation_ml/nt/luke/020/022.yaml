source:
  edition: SBLGNT
  text: ἔξεστιν ⸀ἡμᾶς Καίσαρι φόρον δοῦναι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: ml
  text: “നാം കൈസർക്ക് കരം[a] കൊടുക്കുന്നത് അനുവദനീയമാണോ, അല്ലയോ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നികുതി’ അല്ലെങ്കിൽ ‘കപ്പം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഭരണാധികാരശക്തിക്ക് നൽകുന്ന നികുതിയെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: അനുവദനീയമാണോ
  rationale: വെറും കഴിവിനെയല്ല, മതപരമോ നിയമപരമോ ആയ അനുവദനീയതയെയാണ് ചോദ്യം സൂചിപ്പിക്കുന്നത്. ഏത് നിയമമാണ് ഉദ്ദേശിക്കുന്നത് എന്നു വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἡμᾶς
  choice: നാം … കൊടുക്കുന്നത്
  rationale: ἔξεστιν എന്നതിനോടു ചേർന്ന accusative-infinitive ഘടനയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മൂലപാഠത്തിലില്ലാത്ത ‘യഹൂദന്മാരായ നാം’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: Καίσαρι
  choice: കൈസർക്ക്
  rationale: റോമൻ ഭരണാധികാരിയുടെ ചരിത്രപരവും രാഷ്ട്രീയവുമായ പദവി/നാമം പൊതുവായ ‘ചക്രവർത്തി’ എന്നതിലേക്കു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: φόρον
  choice: കരം
  rationale: ഭരണാധികാരശക്തിക്ക് അടയ്ക്കുന്ന നികുതി അഥവാ കപ്പം എന്ന സാമ്പത്തിക-രാഷ്ട്രീയ അർഥം മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: δοῦναι
  choice: കൊടുക്കുന്നത്
  rationale: δίδωμι എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കൊടുക്കുക’ നിലനിർത്തുന്നു; ‘കരം കൊടുക്കുക’ മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗവുമാണ്.
- source_word: ἢ οὔ
  choice: അല്ലയോ
  rationale: രണ്ടു സാധ്യതകൾ മുന്നോട്ടുവയ്ക്കുന്ന ഗ്രീക്ക് ചോദ്യാവസാനം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ‘അനുവദനീയം’ എന്നതിന്റെ നിയമപരമോ മതപരമോ ആയ അടിസ്ഥാനം
  choice: റോമൻ നിയമമോ ദൈവിക/യഹൂദ മതനിയമമോ എന്ന് വ്യക്തമാക്കാതെ ‘അനുവദനീയമാണോ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘റോമൻ നിയമപ്രകാരം നിയമാനുസൃതമാണോ’ അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ ന്യായപ്രമാണപ്രകാരം ന്യായമാണോ’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം അനുവാദത്തിന്റെ മാനദണ്ഡം വ്യക്തമാക്കുന്നില്ല. രാഷ്ട്രീയവും മതപരവുമായ കെണി ഉൾക്കൊള്ളുന്ന ചോദ്യത്തിലെ ഉദ്ദേശ്യപൂർവമായ അവ്യക്തത സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കൈസർ’ ചരിത്രപരമായ പ്രത്യേകതയും ‘കരം’ നികുതിയുടെയും അധീനതയുടെയും സൂചനയും നിലനിർത്തുന്നു.
