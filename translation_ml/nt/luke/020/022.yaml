  naturalness: “നാം കൈസർക്ക് കരം കൊടുക്കുന്നത് അനുവദനീയമാണോ, അല്ലയോ?” ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ ചോദ്യരൂപമാണ്. ‘കരം കൊടുക്കുക’ നികുതി അടയ്ക്കുക എന്ന അർഥത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നു; വാക്യത്തിന്റെ ഔപചാരികത സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
