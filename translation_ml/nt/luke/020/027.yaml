source:
  edition: SBLGNT
  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: ml
  text: 'പുനരുത്ഥാനം ഇല്ലെന്നു വാദിക്കുന്ന സദൂക്യരിൽ ചിലർ അടുത്തുവന്ന് യേശുവിനോടു ചോദിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσελθόντες
  choice: അടുത്തുവന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള സമീപനത്തെ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് കൃദന്തരൂപം; സ്വാഭാവികമായ മലയാളത്തിൽ ചലനവും ക്രമവും നിലനിർത്തുന്നു.
- source_word: δέ
  choice: വാക്യക്രമത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, കഥയുടെ മുന്നേറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ പ്രത്യേക ബന്ധപദം ചേർക്കാതെ ക്രമത്തിലൂടെ അത് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: τινες τῶν Σαδδουκαίων
  choice: സദൂക്യരിൽ ചിലർ
  rationale: ഗ്രീക്കിലെ ഭാഗികപ്രയോഗം സുതാര്യമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: οἱ ἀντιλέγοντες
  choice: വാദിക്കുന്ന
  rationale: ἀντιλέγω എന്ന പദത്തിന്റെ ‘എതിർത്തുപറയുക/വാദിക്കുക’ എന്ന അടിസ്ഥാനബലം നിലനിർത്തുകയും തുടർന്നുള്ള μὴ εἶναι അവരുടെ നിലപാടിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνάστασιν μὴ εἶναι
  choice: പുനരുത്ഥാനം ഇല്ലെന്ന്
  rationale: അസ്തിത്വനിഷേധം മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു; പുനരുത്ഥാനത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἐπηρώτησαν αὐτόν
  choice: യേശുവിനോടു ചോദിച്ചു
  rationale: ἐπερωτάωയുടെ സാധാരണ അർഥമായ ‘ചോദിക്കുക’ സ്വീകരിച്ചു. സർവനാമത്തിന്റെ സൂചിത വ്യക്തിയെ വായനാസ്പഷ്ടതയ്ക്കായി ‘യേശു’ എന്നു വ്യക്തമാക്കി.
theological_decisions:
- issue: സദൂക്യരുടെ പുനരുത്ഥാനനിഷേധത്തിന്റെ അവതരണം
  choice: പുനരുത്ഥാനം ഇല്ലെന്നു വാദിക്കുന്ന
  alternative: പുനരുത്ഥാനം ഇല്ലെന്നു നിഷേധിക്കുന്ന
  rationale: ഗ്രീക്ക് ἀντιλέγοντες എന്നതിന്റെ എതിർവാദത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് μὴ εἶναι വഴി നിഷേധിക്കപ്പെടുന്ന അവകാശവാദം വ്യക്തമാക്കുന്നു; പിന്നീട് രൂപപ്പെട്ട ദൈവശാസ്ത്രവിവരണങ്ങൾ ഒന്നും ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ മാന്യവും പ്രസിദ്ധീകരണയോഗ്യവുമായ ശൈലി. അടുത്ത വാക്യത്തിൽ ചോദ്യം തുടരുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
