  to: അങ്ങനെ, ഏഴു സഹോദരന്മാർ ഉണ്ടായിരുന്നു; ഒന്നാമൻ വിവാഹം കഴിച്ച് മക്കളില്ലാതെ മരിച്ചു.[a]
