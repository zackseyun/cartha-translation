id: LUK.20.29
reference: Luke 20:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἑπτὰ οὖν ἀδελφοὶ ἦσαν· καὶ ὁ πρῶτος λαβὼν γυναῖκα ἀπέθανεν ἄτεκνος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/029.yaml
  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: ml
  text: അങ്ങനെ, ഏഴു സഹോദരന്മാർ ഉണ്ടായിരുന്നു; ഒന്നാമൻ വിവാഹം കഴിച്ച് മക്കളില്ലാതെ മരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഭാര്യയെ സ്വീകരിച്ച്’; ഇത് വിവാഹം കഴിച്ചതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ
  choice: ഏഴു
  rationale: സഹോദരന്മാരുടെ എണ്ണം സൂചിപ്പിക്കുന്ന ലളിതമായ സംഖ്യാവാചകം.
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻവാക്കുകളിൽനിന്ന് ഈ സാങ്കൽപ്പിക സംഭവവിവരണത്തിലേക്കുള്ള തുടർച്ചയോ നിഗമനബന്ധമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀδελφοὶ
  choice: സഹോദരന്മാർ
  rationale: ഈ ലെവിരേറ്റ് വിവാഹസന്ദർഭത്തിൽ പുരുഷസഹോദരന്മാരെയാണ് വ്യക്തമായി ഉദ്ദേശിക്കുന്നത്.
- source_word: ὁ πρῶτος
  choice: ഒന്നാമൻ
  rationale: പ്രായത്തിൽ മൂത്തവൻ എന്നു നിർബന്ധമായി പറയാതെ, ക്രമത്തിലെ ആദ്യത്തെ സഹോദരനെ സൂചിപ്പിക്കുന്നു.
- source_word: λαβὼν γυναῖκα
  choice: ഒരു സ്ത്രീയെ വിവാഹം കഴിച്ചിട്ട്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു സ്ത്രീയെ സ്വീകരിച്ചിട്ട്’ എന്നാണെങ്കിലും, വിവാഹം കഴിക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം തെരഞ്ഞെടുത്തു.
- source_word: γυναῖκα
  choice: ഒരു സ്ത്രീയെ
  rationale: വിവാഹപ്രയോഗത്തിനകത്ത് ഭാര്യയാകുന്ന സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; ‘വിവാഹം കഴിച്ചു’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: ἀπέθανεν
  choice: മരിച്ചു
  rationale: മരണത്തെ നേരിട്ടും ലളിതമായും അവതരിപ്പിക്കുന്ന ഭൂതകാലരൂപം.
- source_word: ἄτεκνος
  choice: മക്കളില്ലാതെ
  rationale: സന്താനമൊന്നും ഉണ്ടായിരുന്നില്ലെന്ന നിയമപരവും കഥാപരവുമായി പ്രസക്തമായ വിവരം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്കിലെ οὖν എന്ന ബന്ധകം ഒഴിവാക്കാതെ ‘അങ്ങനെ’ എന്നു നൽകി. λαβὼν γυναῖκα എന്ന പ്രയോഗം വാക്കുതോറുമുള്ള അസ്വാഭാവിക രൂപത്തിനു പകരം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
