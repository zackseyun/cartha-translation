id: LUK.20.20
reference: Luke 20:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: ml
  text: അവർ യേശുവിനെ സൂക്ഷ്മമായി നിരീക്ഷിച്ചശേഷം, തങ്ങൾ നീതിമാന്മാരാണെന്നു നടിക്കുന്ന ചാരന്മാരെ അയച്ചു. അവൻ പറയുന്ന ഏതെങ്കിലും വാക്കിൽ അവനെ കുടുക്കി[a], അങ്ങനെ അവനെ ദേശാധിപതിയുടെ ഭരണാധികാരത്തിനും അധികാരശക്തിക്കും ഏൽപ്പിക്കുകയായിരുന്നു അവരുടെ ലക്ഷ്യം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “അവന്റെ വാക്ക് പിടിച്ചെടുക്കാൻ” അഥവാ “അവന്റെ വാക്കിൽ പിടിവയ്ക്കാൻ.”'
    reason: lexical_alternative
  - marker: b
    text: “ദേശാധിപതിയുടെ ഭരണാധികാരത്തിനും അധികാരശക്തിക്കും അവനെ ഏൽപ്പിക്കാൻ” എന്നും പരിഭാഷപ്പെടുത്താം. ചേർന്നുവരുന്ന രണ്ടു പദങ്ങളും ഔദ്യോഗിക ഭരണാധികാരത്തെയും അധികാരശക്തിയെയും ഊന്നിപ്പറയുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: സൂക്ഷ്മമായി നിരീക്ഷിച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള സൂക്ഷ്മവും ശത്രുതാപരവുമായ നിരീക്ഷണത്തെ ക്രിയാവിശേഷണരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സന്ദർഭത്തിൽനിന്ന് ‘യേശുവിനെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἐγκαθέτους
  choice: ചാരന്മാരെ
  rationale: രഹസ്യമായി നിയോഗിച്ച് കുടുക്കാൻ അയച്ച ആളുകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘ചാരന്മാർ’ സാധാരണ വായനക്കാർക്കു വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: തങ്ങൾ നീതിമാന്മാരാണെന്നു നടിക്കുന്ന
  rationale: വഞ്ചനാപരമായ സ്വയംപ്രകടനവും δίκαιος എന്ന പദത്തിന്റെ ധാർമിക-മതപരമായ അർത്ഥഭാരവും നിലനിർത്തുന്നു.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: അവൻ പറയുന്ന ഏതെങ്കിലും വാക്കിൽ അവനെ കുടുക്കി
  rationale: അവന്റെ സംസാരത്തെ അടിസ്ഥാനമാക്കി അവനെ പിടികൂടാനുള്ള ശ്രമം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὥστε
  choice: അങ്ങനെ … ലക്ഷ്യം
  rationale: കുടുക്കലിലൂടെ ഉദ്ദേശിച്ച ഫലം എന്താണെന്ന ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παραδοῦναι
  choice: ഏൽപ്പിക്കുക
  rationale: ന്യായപരവും ശത്രുതാപരവുമായ കൈമാറ്റത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τῇ ἀρχῇ
  choice: ഭരണത്തിന്
  rationale: ഇവിടെ ἀρχή ആരംഭമല്ല, ഔദ്യോഗിക ഭരണശക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; പിന്നാലെയുള്ള ἐξουσίαയിൽനിന്ന് പദജോടിയെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τῇ ἐξουσίᾳ
  choice: അധികാരത്തിന്
  rationale: നിയമാനുസൃതമായി അധികാരം പ്രയോഗിക്കാനുള്ള അവകാശമോ ശക്തിയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ പദമാണ്.
- source_word: τοῦ ἡγεμόνος
  choice: ദേശാധിപതിയുടെ
  rationale: റോമൻ പ്രവിശ്യാഭരണത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള ഔദ്യോഗിക ഭരണാധികാരിയെ മലയാള ബൈബിൾ രജിസ്റ്ററിനൊത്തും വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിലും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: നടിച്ച ധാർമിക നിലയെ വിവരിക്കുന്ന δίκαιος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നീതിമാന്മാർ
  alternative: നേരുള്ളവർ / ന്യായമുള്ളവർ
  rationale: ‘നീതിമാന്മാർ’ എന്നത് പദത്തിന്റെ ധാർമിക-മതപരമായ അർത്ഥഭാരം സംരക്ഷിക്കുന്നു; വെറും സാമൂഹിക മാന്യതയിലേക്കോ സത്യസന്ധതയിലേക്കോ അർത്ഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; ഉദ്ദേശ്യവും ഫലവും തമ്മിലുള്ള ബന്ധം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
