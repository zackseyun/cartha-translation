id: LUK.20.17
reference: Luke 20:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരെ ഉറ്റുനോക്കി പറഞ്ഞു: “അങ്ങനെയെങ്കിൽ, എഴുതപ്പെട്ടിരിക്കുന്ന ഈ വചനം എന്താണ്: ‘പണിയുന്നവർ തള്ളിക്കളഞ്ഞ കല്ല്, അതുതന്നെ മൂലയുടെ തലയായിത്തീർന്നു[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “മൂലക്കല്ല്”; മറ്റൊരു സാധ്യത: “മുകളിലെ പ്രധാന കല്ല്.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “മൂലയുടെ തല.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμβλέψας
  choice: ഉറ്റുനോക്കി
  rationale: അവരുടെ നേരെ ശ്രദ്ധാപൂർവം ദൃഷ്ടി പതിപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അതിതീവ്രത അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: അങ്ങനെയെങ്കിൽ, എഴുതപ്പെട്ടിരിക്കുന്ന ഈ വചനം എന്താണ്
  rationale: οὖν എന്നതിന്റെ നിഗമനാത്മക ഭാവവും γεγραμμένον എന്ന പൂർണ്ണ നിഷ്ക്രിയ രൂപത്തിന്റെ നിലനിൽക്കുന്ന ഫലവും സൂക്ഷിക്കുന്നു; ‘എന്താണ് അർഥം’ എന്നു വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: Λίθον
  choice: കല്ല്
  rationale: ഉദ്ധരണിയിലെ തിരിച്ചറിയാവുന്ന കല്ലിനെ മലയാളത്തിലെ സ്വാഭാവിക നാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀπεδοκίμασαν
  choice: തള്ളിക്കളഞ്ഞ
  rationale: പരിശോധിച്ച് അയോഗ്യമെന്നു കണ്ട് നിരസിക്കുന്നതിന്റെ ആശയം വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἱ οἰκοδομοῦντες
  choice: പണിയുന്നവർ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാന കൃദന്തരൂപം നേരിട്ട് നിലനിർത്തുകയും നിർമ്മാണരൂപകം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οὗτος
  choice: അതുതന്നെ
  rationale: പ്രകടമായ സൂചകസർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; വാചകത്തിൽ നേരിട്ട് ഇല്ലാത്ത ക്രിസ്തുശാസ്ത്രപരമായ വ്യക്തിവൽക്കരണം ചേർക്കുന്നില്ല.
- source_word: ἐγενήθη εἰς
  choice: ആയിത്തീർന്നു
  rationale: ഒരു പുതിയ സ്ഥാനത്തിലേക്കോ നിലയിലേക്കോ വന്നെത്തിയതിന്റെ ഫലഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κεφαλὴν γωνίας
  choice: മൂലയുടെ തല
  rationale: വാസ്തുശില്പപരമായ കൃത്യസൂചന വിവാദവിധേയമായതിനാൽ ഗ്രീക്കിലെ രൂപകം സുതാര്യമായി നിലനിർത്തുന്നു; ‘മൂലക്കല്ല്’ അല്ലെങ്കിൽ ‘മുകളിലെ കല്ല്’ എന്ന് ഏകാർത്ഥമാക്കുന്നില്ല.
theological_decisions:
- issue: സങ്കീർത്തനം 118:22-ലെ വാസ്തുശില്പരൂപകം
  choice: മൂലയുടെ തല
  alternative: മൂലക്കല്ല്; അല്ലെങ്കിൽ മുകളിലെ പ്രധാന കല്ല്
  rationale: κεφαλὴ γωνίας അടിത്തറയിലെ മൂലക്കല്ലിനെയോ മുകളിൽ ഘടന പൂർത്തിയാക്കുന്ന പ്രധാന കല്ലിനെയോ സൂചിപ്പിക്കാമെന്നതിനാൽ മുഖ്യപാഠം ഗ്രീക്കിന്റെ സുതാര്യമായ രൂപം നിലനിർത്തുന്നു; സാധ്യമായ വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യേശുവിന്റെ ശ്രദ്ധാപൂർവമായ നോട്ടവും ചോദ്യത്തിന്റെ വാചകഘടനയും ഉദ്ധരണിയിലെ ഊന്നലും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വിവാദപദപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
