id: LUK.20.43
reference: Luke 20:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/043.yaml
  text: until I make your enemies a footstool for your feet[a].
translation:
  language: ml
  text: ഞാൻ നിന്റെ ശത്രുക്കളെ നിന്റെ പാദങ്ങൾക്ക് പാദപീഠമാക്കുന്നതുവരെ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഞാൻ നിന്റെ ശത്രുക്കളെ നിന്റെ പാദങ്ങളുടെ പാദപീഠമായി വെക്കുന്നതുവരെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἂν
  choice: വരെ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന ഒരു കാര്യത്തെ സമയപരിധിയായി സൂചിപ്പിക്കുന്ന പ്രയോഗം; മലയാളത്തിൽ ‘...മാക്കുന്നതുവരെ’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: θῶ
  choice: ആക്കുക
  rationale: τίθημι എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണ്; എന്നാൽ ഈ സങ്കീർത്തനപ്രയോഗത്തിൽ ശത്രുക്കളെ പാദപീഠത്തിന്റെ നിലയിലാക്കുന്ന ഫലാർഥം ‘പാദപീഠമാക്കുക’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: τοὺς ἐχθρούς σου
  choice: നിന്റെ ശത്രുക്കളെ
  rationale: കർമവിഭക്തിയോടും ഉടമസ്ഥസർവനാമത്തോടും കൂടിയ മൂലപദത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ; ശത്രുതയുടെ ആശയം മയപ്പെടുത്തുന്നില്ല.
- source_word: ὑποπόδιον
  choice: പാദപീഠം
  rationale: കാലുകൾ വയ്ക്കാനുള്ള പീഠം എന്ന മൂലാർഥം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ-സാഹിത്യരജിസ്റ്ററിലും മനസ്സിലാക്കാവുന്ന പദം.
- source_word: τῶν ποδῶν σου
  choice: നിന്റെ പാദങ്ങൾക്ക്
  rationale: അക്ഷരാർഥം ‘നിന്റെ പാദങ്ങളുടെ’ എന്നാണെങ്കിലും, പാദപീഠത്തോടു ചേർന്ന മലയാളപ്രയോഗത്തിൽ ‘നിന്റെ പാദങ്ങൾക്ക്’ എന്നത് ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 110:1-ലെ ശത്രുക്കളുടെ കീഴടക്കത്തെ സൂചിപ്പിക്കുന്ന രൂപകം
  choice: ‘നിന്റെ ശത്രുക്കളെ നിന്റെ പാദങ്ങൾക്ക് പാദപീഠമാക്കുക’ എന്ന രൂപകം അതേപടി നിലനിർത്തി.
  alternative: ‘നിന്റെ ശത്രുക്കളെ നിന്റെ കാൽക്കീഴിലാക്കുക’
  rationale: മൂലവാക്യത്തിലെ രാജകീയ-മശീഹീയ പാദപീഠരൂപകം വിശദീകരണപരമായ പരാവർത്തനത്തിലൂടെ ലയിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു; കീഴടക്കത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി വാക്യത്തിന് പുറത്തായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പാദപീഠം’ എന്നത് മൂലരൂപകം കൃത്യമായി നിലനിർത്തുന്നതിനായി സ്വീകരിച്ചു; ‘കാൽക്കീഴിൽ’ എന്ന വിശദീകരണപരമായ പരാവർത്തനം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി.
