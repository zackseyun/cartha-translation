id: LUK.20.1
reference: Luke 20:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: ml
  text: 'അങ്ങനെ സംഭവിച്ചു: ആ ദിവസങ്ങളിലൊന്നിൽ യേശു ദേവാലയാങ്കണത്തിൽ ജനത്തെ പഠിപ്പിക്കുകയും സുവാർത്ത അറിയിക്കുകയും ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ, മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും മൂപ്പന്മാരോടൊപ്പം അദ്ദേഹത്തിന്റെ അടുക്കൽ വന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: ആ ദിവസങ്ങളിലൊന്നിൽ
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനപരമായ സംക്രമണം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ പ്രത്യേകമായി ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ തുടർന്നുള്ള കാലസൂചനയിലൂടെ പ്രകടമാക്കി.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: ആ ദിവസങ്ങളിലൊന്നിൽ
  rationale: നിലവിലെ സംഭവക്രമത്തിലെ നിർദിഷ്ടമല്ലാത്ത ഒരു ദിവസത്തെ സൂചിപ്പിക്കുന്ന ഭാഗിക അർഥം നിലനിർത്തുന്നു.
- source_word: διδάσκοντος αὐτοῦ τὸν λαὸν
  choice: യേശു ... ജനത്തെ പഠിപ്പിക്കുകയും
  rationale: ജനങ്ങളെ അഭിസംബോധന ചെയ്തുകൊണ്ടിരുന്ന സമകാലിക പ്രവർത്തനം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; സർവനാമത്തിന്റെ സൂചിതവ്യക്തി വ്യക്തതയ്ക്കായി ‘യേശു’ എന്നു വ്യക്തമാക്കി.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയാങ്കണത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേവാലയാങ്കണം’ പ്രസംഗത്തിന്റെയും ജനസാന്നിധ്യത്തിന്റെയും ഇടം കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: εὐαγγελιζομένου
  choice: സുവാർത്ത അറിയിക്കുകയും
  rationale: നല്ല വാർത്ത പരസ്യമായി അറിയിക്കുന്ന ക്രിയാത്മക അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; സഭാപരമായ സാങ്കേതികപദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἐπέστησαν
  choice: അദ്ദേഹത്തിന്റെ അടുത്തെത്തി
  rationale: നേതാക്കൾ നേരിട്ട് സമീപിച്ചതിനെ വ്യക്തമാക്കുന്നു; മൂലത്തിൽ നിർബന്ധമല്ലാത്ത ശത്രുതാഭാവം ‘എതിർത്തു’ പോലുള്ള പദങ്ങളിലൂടെ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: രണ്ടാം ദേവാലയകാലത്തെ പുരോഹിതനേതൃത്വസംഘത്തെ സൂചിപ്പിക്കുന്നു; ഒന്നിലധികം മഹാപുരോഹിതന്മാർ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: οἱ γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: ചരിത്രപരമായ വിഭാഗനാമം നിലനിർത്തുന്ന പരിചിതമായ മലയാള ബൈബിൾപദം.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: മൂപ്പന്മാരോടൊപ്പം
  rationale: σύν സൂചിപ്പിക്കുന്ന സഹവർത്തിത്വവും നേതൃസംഘങ്ങളുടെ കൂട്ടായ വരവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: εὐαγγελιζομένου എന്ന പദം സഭാപരമായ സാങ്കേതികപദമായി നൽകണമോ
  choice: സുവാർത്ത അറിയിക്കുകയും
  alternative: സുവിശേഷം പ്രസംഗിക്കുകയും
  rationale: ഇവിടെ യേശുവിന്റെ പൊതുശുശ്രൂഷയിലെ പ്രവർത്തനമാണ് വിവരിക്കുന്നത്. അതിനാൽ പിന്നീടുള്ള സഭാപരമായ സാങ്കേതികഭാരം ചേർക്കാതെ ‘നല്ല വാർത്ത അറിയിക്കുക’ എന്ന അടിസ്ഥാനാർഥം സുലഭമായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വാക്യത്തിന്റെ ഗ്രീക്ക് പങ്കാളിപ്രയോഗങ്ങൾ മലയാളത്തിലെ ‘ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ’ എന്ന സമകാലിക ഘടനയായി നൽകി. ἱερόν എന്നതിന്റെ സ്ഥലപരമായ കൃത്യത മുഖ്യപാഠത്തിലെ ‘ദേവാലയാങ്കണം’ കൊണ്ടുതന്നെ വ്യക്തമാക്കിയതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
