id: LUK.20.31
reference: Luke 20:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ τρίτος ἔλαβεν ⸀αὐτήν, ὡσαύτως δὲ καὶ οἱ ἑπτὰ οὐ κατέλιπον τέκνα καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: ml
  text: മൂന്നാമനും അവളെ ഭാര്യയായി സ്വീകരിച്ചു; അതുപോലെ ഏഴുപേരും മക്കളെ ശേഷിപ്പിക്കാതെ മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: മൂന്നാമനും
  rationale: ഗ്രീക്കിൽ ‘സഹോദരൻ’ എന്ന പദം ആവർത്തിക്കുന്നില്ല; സന്ദർഭത്തിൽ അത് വ്യക്തമായതിനാൽ മലയാളത്തിലും സ്വാഭാവികമായ അധ്യാഹാരം നിലനിർത്തുന്നു.
- source_word: ἔλαβεν αὐτήν
  choice: അവളെ ഭാര്യയായി സ്വീകരിച്ചു
  rationale: വാക്കിന് വാക്കായി ‘അവളെ എടുത്തു’ എന്നാണെങ്കിലും, ഈ ദേവരവിവാഹസന്ദർഭത്തിൽ ഒരു സ്ത്രീയെ ഭാര്യയായി സ്വീകരിക്കുക എന്നതാണ് പ്രയോഗാർത്ഥം. മലയാളത്തിൽ അക്ഷരാർഥരൂപം അസ്വാഭാവികവും തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതുമായതിനാൽ സന്ദർഭാർത്ഥം പ്രധാനവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὡσαύτως δὲ καὶ
  choice: അതുപോലെ
  rationale: തുടർച്ചയും സമാനതയും സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു; δέ, καί എന്നീ കണങ്ങളെ വേർതിരിച്ച് അമിതമായി വിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: οἱ ἑπτὰ
  choice: ഏഴുപേരും
  rationale: ഏഴുപേരടങ്ങിയ മുഴുവൻ കൂട്ടത്തെയും സൂചിപ്പിക്കുന്ന ആശയം മലയാളത്തിലെ ‘-ഉം’ ചേർത്ത രൂപം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οὐ κατέλιπον τέκνα
  choice: മക്കളെ ശേഷിപ്പിക്കാതെ
  rationale: καταλείπω എന്ന ക്രിയയിലെ മരണശേഷം സന്തതികളെ വിട്ടുപോകുക എന്ന ആശയം നിലനിർത്തുന്നു; ‘മക്കളുണ്ടായില്ല’ എന്നതിനെക്കാൾ മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: τέκνα
  choice: മക്കൾ
  rationale: സന്തതി എന്ന സന്ദർഭാർത്ഥം ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ പദം.
- source_word: ἀπέθανον
  choice: മരിച്ചു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ലളിതവും ഭംഗ്യന്തരമില്ലാതെയും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ഗ്രീക്കിലെ ദേവരവിവാഹപ്രയോഗം തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അർഥപരമായി വ്യക്തമാക്കി; വാക്യത്തിലെ സംക്ഷിപ്തതയും ക്രമാനുഗതമായ ഒഴുക്കും നിലനിർത്തി.
