  naturalness: ‘അവർ തമ്മിൽ ആലോചിച്ചു’യും ‘നാം … എന്നു പറഞ്ഞാൽ’ എന്നും ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘നിങ്ങൾ എന്തുകൊണ്ട് അവനെ വിശ്വസിച്ചില്ല?’ എന്ന രൂപം ഗ്രീക്കിലെ അഒറിസ്റ്റ് നിഷേധചോദ്യത്തെ ലളിതമായും വ്യക്തമായും പ്രതിഫലിപ്പിക്കുന്നു.
