id: LUK.20.5
reference: Luke 20:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: ml
  text: 'എന്നാൽ അവർ തമ്മിൽ ആലോചിച്ചു: “നാം ‘സ്വർഗത്തിൽനിന്ന്’ എന്നു പറഞ്ഞാൽ, ‘നിങ്ങൾ എന്തുകൊണ്ട് അവനെ വിശ്വസിച്ചില്ല?’ എന്ന് അവൻ പറയും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: അവർ തമ്മിൽ ആലോചിച്ചു
  rationale: കൂട്ടമായി കാരണങ്ങൾ തൂക്കിനോക്കി ചർച്ചചെയ്യുന്ന സന്ദർഭത്തിലെ deliberation സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: λέγοντες
  choice: ഉദ്ധരണി നേരിട്ട് അവതരിപ്പിക്കുന്ന കോളൺ
  rationale: ഗ്രീക്കിലെ പങ്കാളിക്രിയ പ്രധാനക്രിയയോടൊപ്പം നടക്കുന്ന സംസാരത്തെ സൂചിപ്പിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമത ഒഴിവാക്കി മലയാളത്തിലെ നേരിട്ടുള്ള ഉദ്ധരണിരീതി ഉപയോഗിച്ചു.
- source_word: Ἐὰν εἴπωμεν
  choice: നാം … എന്നു പറഞ്ഞാൽ
  rationale: നിബന്ധനയുടെ സാധ്യതാഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ἐξ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ദൈവിക ഉറവിടത്തെയോ അധികാരത്തെയോ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ‘സ്വർഗം’ എന്ന പരോക്ഷപ്രയോഗം വ്യാഖ്യാനിച്ച് ‘ദൈവത്തിൽനിന്ന്’ എന്നാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐρεῖ
  choice: അവൻ ചോദിക്കും
  rationale: ലെക്സിക്കൽമായി ‘പറയും’ എന്നാണെങ്കിലും പിന്നാലെ നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ മലയാളത്തിൽ ‘ചോദിക്കും’ സ്വാഭാവികമാണ്; പ്രസ്താവനയുടെ ആശയം മാറ്റുന്നില്ല.
- source_word: ἐπιστεύσατε αὐτῷ
  choice: നിങ്ങൾ അവനെ വിശ്വസിക്കാതിരുന്നത്
  rationale: ദത്തിവിനോടുള്ള πιστεύω ഇവിടെ യോഹന്നാന്റെ വാക്ക് സത്യമെന്ന് അംഗീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അവനിൽ വിശ്വസിക്കുക’ എന്ന കൂടുതൽ ശക്തമായ വിശ്വാസപ്രയോഗം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘സ്വർഗത്തിൽനിന്ന്’ എന്നതിലെ ദൈവിക ഉറവിടം
  choice: സ്വർഗത്തിൽനിന്ന്
  alternative: ദൈവത്തിൽനിന്ന്
  rationale: ദൈവിക അധികാരം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും, ഗ്രീക്ക് ‘സ്വർഗം’ എന്നു തന്നെയാണ് പറയുന്നത്; ആ പരോക്ഷപ്രയോഗവും അതിലെ വ്യാഖ്യാനാവകാശവും നിലനിർത്തി.
- issue: യോഹന്നാനെ ‘വിശ്വസിക്കുക’ എന്നതിന്റെ സ്വഭാവം
  choice: അവനെ വിശ്വസിക്കുക
  alternative: അവനിൽ വിശ്വസിക്കുക / അവനെ ആശ്രയിക്കുക
  rationale: ഇവിടെ യോഹന്നാന്റെ സാക്ഷ്യത്തെ അംഗീകരിക്കലാണ് മുഖ്യമായത്; വ്യക്തിയിലുള്ള രക്ഷാകര വിശ്വാസം എന്ന പ്രത്യേക അർഥം വാക്യഘടനയിൽ നിർബന്ധമല്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അവർ തമ്മിൽ ആലോചിച്ചു’ എന്നത് കൂട്ടായ വിചിന്തനവും സംഭാഷണവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
