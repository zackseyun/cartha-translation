  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: ml
  text: എന്നാൽ ‘മനുഷ്യരിൽനിന്ന്’ എന്നു പറഞ്ഞാൽ, ജനമെല്ലാം നമ്മെ കല്ലെറിയും; കാരണം യോഹന്നാൻ ഒരു പ്രവാചകനായിരുന്നു[a] എന്ന് അവർക്കു ഉറച്ച ബോധ്യമുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോഹന്നാൻ ഒരു പ്രവാചകനാണ്.” ഗ്രീക്കിലെ അനന്തക്രിയാരൂപം സ്വതവേ കാലം വ്യക്തമാക്കുന്നില്ല; സന്ദർഭമനുസരിച്ച് രണ്ടുവിധത്തിലും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: എന്നാൽ … എന്നു പറഞ്ഞാൽ
  rationale: ἐὰν സഹിതമുള്ള ഉപാധിസാധ്യതയും δέയുടെ വിരുദ്ധതാസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἐξ ἀνθρώπων
  choice: മനുഷ്യരിൽനിന്ന്
  rationale: യോഹന്നാന്റെ സ്നാനത്തിന്റെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ സംക്ഷിപ്തവും അപൂർണ്ണവുമായ പ്രയോഗം വിശദീകരിച്ചുപറയാതെ നിലനിർത്തുന്നു.
- source_word: ὁ λαὸς ἅπας
  choice: ജനമെല്ലാം
  rationale: λαός എന്ന കൂട്ടായ നാമത്തിന്റെയും ἅπας നൽകുന്ന സമഗ്രതയുടെയും ശക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καταλιθάσει
  choice: നമ്മെ കല്ലെറിയും
  rationale: ക്രിയയുടെ അർഥം നേരിട്ട് നൽകുന്നു; മൂലപാഠത്തിലില്ലാത്ത ‘കൊല്ലുംവരെ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: കാരണം … അവർക്കു ഉറച്ച ബോധ്യമുണ്ട്
  rationale: ജനത്തെ ഏകകൂട്ടമായി കാണുന്ന ഗ്രീക്ക് ഏകവചനരൂപത്തിന്റെ അർഥം മലയാളത്തിലെ സ്വാഭാവിക ബഹുവചനസൂചനയോടെ നൽകുന്നു; പൂർത്തികൃതരൂപം സൂചിപ്പിക്കുന്ന ഉറച്ച വിശ്വാസവും പ്രകടമാക്കുന്നു.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: യോഹന്നാൻ ഒരു പ്രവാചകനായിരുന്നു
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികമായ ഭൂതകാലരൂപം സ്വീകരിക്കുന്നു; εἶναι സ്വതവേ കാലം നിർണയിക്കാത്തതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാനെക്കുറിച്ചുള്ള ജനത്തിന്റെ വിലയിരുത്തലിലെ കാലസൂചന
  choice: യോഹന്നാൻ ഒരു പ്രവാചകനായിരുന്നു
  alternative: യോഹന്നാൻ ഒരു പ്രവാചകനാണ്
  rationale: ഗ്രീക്ക് infinitive ആയ εἶναι സ്വതവേ കാലം വ്യക്തമാക്കുന്നില്ല. ആഖ്യാനസന്ദർഭത്തിൽ ‘ആയിരുന്നു’ സ്വാഭാവികമാണെങ്കിലും ജനത്തിന്റെ അന്നത്തെ നിലനിൽക്കുന്ന ബോധ്യത്തെ ഊന്നുന്ന ‘ആണ്’ എന്ന വായനയും സാധ്യമാണ്; അതിനാൽ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും കാലസംബന്ധമായ യഥാർഥ അവ്യക്തതയും നിലനിർത്തിയിരിക്കുന്നു.
