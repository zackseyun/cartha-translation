id: LUK.20.15
reference: Luke 20:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: ml
  text: അവർ അവനെ മുന്തിരിത്തോട്ടത്തിനു പുറത്തേക്ക് തള്ളിയിട്ട് കൊന്നു. അപ്പോൾ മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമ അവരോട് എന്തു ചെയ്യും?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: പുറത്തേക്ക് തള്ളിയിട്ട്
  rationale: അഒറിസ്റ്റ് കൃദന്തം കൊലപ്പെടുത്തലിനു മുമ്പ് നടന്ന പുറത്താക്കലിനെ സൂചിപ്പിക്കുന്നു. ‘തള്ളിയിട്ട്’ ബലമായി പുറത്താക്കിയെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: മുന്തിരിത്തോട്ടത്തിനു പുറത്തേക്ക്
  rationale: തോട്ടത്തിനകത്തുനിന്ന് പുറത്തേക്കുള്ള ചലനം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἀπέκτειναν
  choice: കൊന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ലളിതമായി നൽകുന്നു; ‘കൊലപ്പെടുത്തി’ എന്നതിനെക്കാൾ സ്വാഭാവികവും ‘വധിച്ചു’ എന്നതിലെ ഔപചാരികമോ ന്യായവിധിപരമോ ആയ അധികഭാവം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: τί οὖν
  choice: അപ്പോൾ ... എന്തു
  rationale: οὖν എന്നതിന്റെ നിഗമനാത്മകമായ ബന്ധം സമകാലിക മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യരൂപത്തിൽ നൽകുന്നു.
- source_word: ποιήσει αὐτοῖς
  choice: അവരോട് എന്തു ചെയ്യും
  rationale: ποιέωയുടെ വിശാലമായ അർഥവും αὐτοῖς എന്ന ദത്തിവിന്റെ പ്രതികൂലബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമ
  rationale: ഉപമയ്ക്കുള്ളിലെ മനുഷ്യനായ തോട്ടമുടമയെയാണ് κύριος സൂചിപ്പിക്കുന്നത്. അതിനാൽ ദൈവിക ബിരുദമായി തെറ്റിദ്ധരിക്കാവുന്ന ‘കർത്താവ്’ എന്നതിനുപകരം സന്ദർഭാർഥമായ ‘ഉടമ’ യോജിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ ദൈവികമല്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന κύριοςയുടെ പരിഭാഷ
  choice: ഉടമ
  alternative: യജമാനൻ; കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന് ‘യജമാനൻ’ അല്ലെങ്കിൽ ബിരുദമായി ‘കർത്താവ്’ എന്നർഥങ്ങൾ വരാമെങ്കിലും, ഇവിടെ കഥാതലത്തിൽ മുന്തിരിത്തോട്ടത്തിന്റെ അവകാശിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഉടമ’ സന്ദർഭം വ്യക്തമായി നൽകുകയും ഉപമയുടെ ദൈവശാസ്ത്രപരമായ സൂചനയെ അനാവശ്യമായി നേരിട്ടുള്ള ബിരുദമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ പ്രവർത്തനക്രമവും ചോദ്യത്തിന്റെ നിഗമനാത്മക ബലവും സംരക്ഷിച്ചിട്ടുണ്ട്. ഈ മലയാള പരിഭാഷയിൽ ‘ഉടമ’ വ്യക്തമായതിനാൽ ഇംഗ്ലീഷ് പതിപ്പിലെ κύριος സംബന്ധിച്ച അടിക്കുറിപ്പ് ആവശ്യമില്ല.
