id: LUK.20.44
reference: Luke 20:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δαυὶδ οὖν ⸂αὐτὸν κύριον⸃ καλεῖ, καὶ πῶς ⸂αὐτοῦ υἱός⸃ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: ml
  text: അതുകൊണ്ട് ദാവീദ് അവനെ കർത്താവ് എന്നു വിളിക്കുന്നു; അങ്ങനെയെങ്കിൽ അവൻ എങ്ങനെയാണ് ദാവീദിന്റെ മകനാകുന്നത്?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സന്തതി.’ ഗ്രീക്കിൽ ‘മകൻ’ എന്നാണ്; രാജവംശപരമായ സന്ദർഭത്തിൽ ഈ പദത്തിന് ‘സന്തതി’ എന്ന വിശാലാർഥവും ഉണ്ടാകാം. വാദത്തിലെ വ്യക്തമായ പദപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: ദാവീദ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ ഉറച്ചുപോയിരിക്കുന്ന പേരുരൂപം സ്വീകരിച്ചു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ഉദ്ധരണിയിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: αὐτὸν κύριον
  choice: അവനെ ‘കർത്താവ്’ എന്നു
  rationale: καλεῖയോടൊപ്പം സ്വാഭാവികമായ മലയാളപ്രയോഗം നൽകുന്നു; κύριος എന്ന പദത്തിന്റെ ബഹുമാനപരവും മശീഹാസംബന്ധവുമായ ഭാരം ‘കർത്താവ്’ നിലനിർത്തുന്നു.
- source_word: καλεῖ
  choice: വിളിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ലളിതമായ വർത്തമാനകാല ക്രിയയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: καὶ πῶς
  choice: പിന്നെ എങ്ങനെയാണ്
  rationale: റിട്ടോറിക്കൽ ചോദ്യത്തിലേക്കുള്ള തിരിവ് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; πῶς എന്നതിന്റെ ‘എങ്ങനെ’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: αὐτοῦ υἱός
  choice: ദാവീദിന്റെ മകൻ
  rationale: ഗ്രീക്കിലെ ‘അവന്റെ മകൻ’ എന്ന വ്യക്തമായ പുത്രപദം സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ മുൻപറഞ്ഞ ദാവീദിന്റെ പേര് ആവർത്തിക്കുന്നു.
- source_word: ἐστιν
  choice: ആകുന്നത്
  rationale: മലയാളത്തിലെ റിട്ടോറിക്കൽ ചോദ്യഘടനയ്ക്ക് യോജിച്ച രീതിയിൽ ‘ആണ്/ആകുന്നു’ എന്ന അസ്തിത്വബന്ധം നൽകുന്നു.
theological_decisions:
- issue: മശീഹാസംബന്ധമായ വാദത്തിൽ κύριος എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ദാവീദ് മശീഹായെ തന്നെക്കാൾ ഉന്നതമായ ബഹുമാനപദവിയാൽ വിളിക്കുന്നതാണ് വാദത്തിന്റെ അടിസ്ഥാനം. ‘കർത്താവ്’ പദത്തിന്റെ അർഥഭാരവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; എന്നാൽ വാക്യം പറയുന്നതിലധികം വിശദീകരിക്കുന്നില്ല.
- issue: υἱός എന്നത് വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന ‘സന്തതി’യായി വികസിപ്പിക്കണമോ
  choice: മകൻ
  alternative: സന്തതി
  rationale: ഗ്രീക്ക് പാഠം വ്യക്തമായി ‘മകൻ’ എന്നാണ് പറയുന്നത്; യേശുവിന്റെ ചോദ്യത്തിലെ സംഘർഷം ഈ പുത്രനാമത്തിലാണ് ആശ്രയിക്കുന്നത്. വിശാലമായ വംശപരമ്പരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ചോദ്യം സ്വാഭാവികമാക്കാൻ ‘പിന്നെ’ ഉപയോഗിച്ചു. ‘അവൻ’ ആരെ സൂചിപ്പിക്കുന്നു എന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ αὐτοῦ എന്നത് ‘ദാവീദിന്റെ’ എന്നു വ്യക്തമാക്കി; മൂലപാഠത്തിന്റെ ബന്ധം മാറ്റിയിട്ടില്ല.
