reference: Luke 20:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: ml
  text: 'അപ്പോൾ മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമ പറഞ്ഞു[a]: ‘ഞാൻ എന്തു ചെയ്യും? എന്റെ പ്രിയപ്പെട്ട മകനെ അയയ്ക്കും; ഒരുപക്ഷേ അവർ അവനെ ആദരിക്കും[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘മുന്തിരിത്തോട്ടത്തിന്റെ കർത്താവ്’; ‘യജമാനൻ’ എന്നും പറയാം.'
    reason: lexical_alternative
  - marker: b
    text: ‘ആദരിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തിയ ക്രിയയ്ക്ക് ‘അവന്റെ മുമ്പിൽ ലജ്ജിക്കും’ എന്നോ ‘അവനോടു ബഹുമാനം കാണിക്കും’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമ
  rationale: കഥയുടെ കാർഷികസന്ദർഭത്തിൽ ഈ പ്രയോഗം തോട്ടത്തിന്റെ ഉടമയെ സൂചിപ്പിക്കുന്നു. ‘കർത്താവ്’ എന്ന പദം ഉപയോഗിച്ച് ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകം കഥാപാത്രത്തിന്മേൽ നിർബന്ധമായി ചുമത്താതെ സ്വാഭാവികമായ മലയാളം നൽകുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Τί ποιήσω;
  choice: ഞാൻ എന്തു ചെയ്യും?
  rationale: ആലോചനാസൂചകമായ aorist subjunctive-ന്റെ സ്വയം ചോദിക്കുന്ന ഭാവം സ്വാഭാവികമായി പകരുന്നു.
- source_word: πέμψω
  choice: അയയ്ക്കാം
  rationale: ഉടമ തീരുമാനത്തിലെത്തുന്ന ഭാവം മലയാളത്തിലെ സന്ദർഭോചിതമായ ഭാവിരൂപത്തിൽ പകരുന്നു.
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: എന്റെ പ്രിയപുത്രനെ
  rationale: υἱός എന്നതിന്റെ പുരുഷലിംഗസൂചനയും ἀγαπητός എന്നതിന്റെ സ്നേഹവും പ്രത്യേകതയും സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἴσως
  choice: ഒരുപക്ഷേ
  rationale: ഉറപ്പല്ലാത്ത പ്രതീക്ഷയെ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῦτον
  choice: അവനെ
  rationale: പ്രകടനസർവനാമം പുത്രനിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; മലയാളത്തിൽ ‘അവനെ’ സ്വാഭാവികമാണ്.
- source_word: ἐντραπήσονται
  choice: ആദരിക്കും
  rationale: ഈ സന്ദർഭത്തിൽ ഒരാളോടു ബഹുമാനമോ ആദരവോ കാണിക്കുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; ‘അവന്റെ മുമ്പിൽ ലജ്ജിക്കും’ എന്ന കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തെ സൂചിപ്പിക്കാവുന്ന ഉപമാപാത്രത്തിന് κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമ
  alternative: മുന്തിരിത്തോട്ടത്തിന്റെ കർത്താവ് / യജമാനൻ
  rationale: നേരിട്ടുള്ള കഥാതലത്തിൽ ഇത് സ്വത്തുടമയെ സൂചിപ്പിക്കുന്നു. ദൈവസാദൃശ്യം വായനക്കാർക്ക് തിരിച്ചറിയാൻ ഇടവരുത്തുമ്പോഴും വിവർത്തനം തന്നെ ഒരു ദൈവിക ശീർഷകം നിർബന്ധിക്കുന്നില്ല.
- issue: ‘പ്രിയപുത്രൻ’ എന്നതിലെ ക്രിസ്തുശാസ്ത്രപരമായ പ്രതിധ്വനി
  choice: എന്റെ പ്രിയപുത്രനെ
  alternative: എന്റെ പുത്രനെ, പ്രിയനായവനെ
  rationale: ഉപമയിലെ സ്വാഭാവിക അർഥത്തോടൊപ്പം ലൂക്കോസിലെ സ്നാനം/രൂപാന്തരം സംബന്ധിച്ച ഭാഷയുടെ സാധ്യതയുള്ള പ്രതിധ്വനിയും വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. സാധാരണ വായനക്കാർക്ക് വ്യക്തത നൽകുന്നതിനൊപ്പം ഗ്രീക്ക് പാഠത്തിലെ അനിശ്ചിതത്വവും ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
