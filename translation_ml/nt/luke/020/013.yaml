  to: 'അപ്പോൾ മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമ പറഞ്ഞു[a]: ‘ഞാൻ എന്തു ചെയ്യും? എന്റെ പ്രിയപ്പെട്ട മകനെ അയയ്ക്കും; ഒരുപക്ഷേ അവർ അവനെ ആദരിക്കും[b].’'
