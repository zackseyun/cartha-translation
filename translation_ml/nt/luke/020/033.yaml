source:
  edition: SBLGNT
  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: ml
  text: അപ്പോൾ, പുനരുത്ഥാനത്തിൽ[a] അവൾ അവരിൽ ആരുടെ ഭാര്യയായിത്തീരും?[b] കാരണം, ആ ഏഴ് പേർക്കും അവൾ ഭാര്യയായിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പുനരുത്ഥാനസമയത്ത്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരിൽ ആരുടെ ഭാര്യയായിരിക്കും അവൾ?’
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘ആ ഏഴുപേർ അവളെ ഭാര്യയായി വെച്ചിരുന്നു’; അഥവാ, ‘ആ ഏഴുപേരും അവളെ വിവാഹം കഴിച്ചിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: അവൾ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആവർത്തിച്ച് ‘ആ സ്ത്രീ’ എന്നു പറയുന്നതിനെക്കാൾ ‘അവൾ’ സ്വാഭാവികമാണ്.
- source_word: οὖν
  choice: അങ്ങനെയെങ്കിൽ
  rationale: സദൂക്യരുടെ വാദത്തിലെ നിഗമനപരമായ നീക്കം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അതുകൊണ്ട്’ എന്നതിനെക്കാൾ ഇവിടെ സാങ്കൽപ്പിക ചോദ്യത്തിന്റെ ഭാവത്തിന് യോജിക്കുന്നു.
- source_word: ἐν τῇ ἀναστάσει
  choice: പുനരുത്ഥാനത്തിൽ
  rationale: ഗ്രീക്കിലെ പദപ്രയോഗം വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τίνος αὐτῶν
  choice: അവരിൽ ആരുടെ
  rationale: ബന്ധം ചോദിക്കുന്ന genitive രൂപത്തിന്റെ അർഥം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: γίνεται γυνή
  choice: ഭാര്യയായിത്തീരും
  rationale: γίνομαι എന്നതിലെ ‘ആയിത്തീരുക’ എന്ന ചലനാത്മക ഭാവവും γυνήയുടെ വൈവാഹിക അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: οἱ ἑπτὰ
  choice: ഏഴുപേരും
  rationale: മുൻപ് പരാമർശിച്ച ഏഴ് സഹോദരന്മാരെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ഉം’ ഇവിടെ ആ ഏഴുപേരുടെയും സമഗ്രത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘എല്ലാവരും’ എന്ന വേറൊരു പദം ചേർക്കുന്നില്ല.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: അവളെ ഭാര്യയായി സ്വീകരിച്ചിരുന്നല്ലോ
  rationale: ‘ഭാര്യയായി ഉണ്ടായിരിക്കുക/കൊള്ളുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വൈവാഹികബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘വിവാഹം കഴിച്ചു’ എന്നത് പ്രവൃത്തിക്ക് കൂടുതൽ ഊന്നൽ നൽകും.
theological_decisions:
- issue: സദൂക്യരുടെ ചോദ്യത്തിലെ പുനരുത്ഥാനഭാഷ
  choice: ‘പുനരുത്ഥാനം’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘മരിച്ചവരുടെ പുനരുത്ഥാനം’
  rationale: വാക്യത്തിൽ ἀνάστασις മാത്രമാണുള്ളത്. സന്ദർഭത്തിൽനിന്ന് അധിക വിശദീകരണം ചേർക്കാതെ ചോദ്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യരൂപം. ‘ഭാര്യയായിത്തീരും’ എന്നത് ഉറവിടത്തിലെ γίνεται എന്ന ക്രിയാഭാവം സംരക്ഷിക്കുന്നു. ‘അങ്ങനെയെങ്കിൽ’ വാദത്തിന്റെ നിഗമനസ്വഭാവം വ്യക്തമാക്കുന്നു.
