id: LUK.20.18
reference: Luke 20:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: ml
  text: ആ കല്ലിന്മേൽ വീഴുന്ന ഏവനും കഷണങ്ങളായി തകർന്നുപോകും[a]; എന്നാൽ അത് ആരുടെമേൽ വീഴുന്നുവോ, അവനെ അത് പൊടിച്ചുകളയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തകർന്നു ചിതറും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പതിരുപോലെ ചിതറിച്ചുകളയും’; ഗ്രീക്ക് ക്രിയ വെറും ഇടിയുടെ ഫലത്തെക്കാൾ ശക്തമായി ചതച്ച് പൊടിക്കുകയോ ചിതറിക്കുകയോ ചെയ്യുന്ന ആശയം വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: വീഴുന്ന ഏവനും
  rationale: നാമപ്രയോഗത്തിലുള്ള കൃതന്തം പൊതുവായും സർവവ്യാപകമായും ‘വീഴുന്ന ഏവനും’ എന്ന അർഥം നൽകുന്നു.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: ആ കല്ലിന്മേൽ
  rationale: ἐπί + ദ്വിതീയാവിഭക്തി ഇവിടെ കല്ലിന്മേലേക്കുള്ള വീഴ്ചയെ സൂചിപ്പിക്കുന്നു; ἐκεῖνον എന്ന നിർദേശകത്തിന്റെ ബലവും ‘ആ’ നിലനിർത്തുന്നു.
- source_word: συνθλασθήσεται
  choice: തകർന്നുപോകും
  rationale: ഭാവികാല കർമണി രൂപം കഷണങ്ങളായി തകരുന്ന ശക്തമായ ഫലത്തെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘തകർന്നുപോകും’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: എന്നാൽ അത് ആരുടെമേൽ വീഴുന്നുവോ
  rationale: ἄν സഹിതമുള്ള ബന്ധവാക്യം അനിശ്ചിതമായ ‘ആരുടെമേൽ വീണാലും’ എന്ന ആശയം നൽകുന്നു; ഈ രൂപം ആദ്യ ഉപവാക്യത്തോടുള്ള സമാന്തരത നിലനിർത്തുന്നു.
- source_word: λικμήσει
  choice: പൊടിച്ചുകളയും
  rationale: λικμάω വെറും ഇടിച്ചുതകർക്കുന്നതിനെക്കാൾ ശക്തമായി ചതച്ച് പൊടിക്കുക, പതിരുപോലെ ചിതറിക്കുക എന്നീ ഭാവങ്ങൾ വഹിക്കുന്നു; ‘പൊടിച്ചുകളയും’ മുഖ്യ അർഥത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: പുരുഷലിംഗ ഏകവചന സർവനാമത്തിന്റെ പൊതുപ്രതിനിധിയായ വ്യാകരണരൂപം മലയാളത്തിൽ ‘അവനെ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: കല്ലിന്റെ ന്യായവിധി-ദൃശ്യം
  choice: കല്ലിനെ വിനാശകരമായ ന്യായവിധിയുടെ പ്രവർത്തകനായി ശക്തമായ രൂപത്തിൽ നിലനിർത്തുക.
  alternative: ഇതിനെ വെറും ഇടർച്ചയോ ലഘുപരിക്കോ ആയി മൃദൂകരിക്കുക.
  rationale: സന്ദർഭത്തിലും συνθλασθήσεται, λικμήσει എന്നീ ക്രിയകളിലും നിർണായകമായ ന്യായവിധിയുടെ തീവ്രതയുണ്ട്; വ്യാഖ്യാനവികാസമില്ലാതെ ആ ശക്തി പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
- issue: പൊതുവായ പുരുഷലിംഗ പരാമർശം
  choice: രണ്ടാം ഉപവാക്യത്തിൽ ‘അവനെ’ ഉപയോഗിക്കുക.
  alternative: ‘ആ വ്യക്തിയെ’ എന്നു ആവർത്തിക്കുക, അല്ലെങ്കിൽ ബഹുവചനമായി ലിംഗനിരപേക്ഷമാക്കുക.
  rationale: ഗ്രീക്കിൽ പൊതുപ്രതിനിധിയായ പുരുഷലിംഗ ഏകവചന സർവനാമമാണുള്ളത്; അതിന്റെ വ്യാകരണരൂപവും പ്രതിനിധിസ്വഭാവവും ‘അവനെ’ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആ കല്ല്’ എന്ന നിർദേശകവും രണ്ടു ഉപവാക്യങ്ങളിലെ സമാന്തരതയും ന്യായവിധി-രൂപകത്തിന്റെ തീവ്രതയും നിലനിർത്തിയിരിക്കുന്നു.
