  yaml_path: translation/nt/luke/020/012.yaml
  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: ml
  text: പിന്നെ അവൻ മൂന്നാമതൊരാളെ അയച്ചു[a]. എന്നാൽ അവർ അയാളെയും മുറിവേൽപ്പിച്ച് പുറത്തേക്കെറിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘മൂന്നാമനെ അയയ്ക്കാൻ അവൻ കൂട്ടിച്ചേർത്തു’; ഇത് ‘അവൻ മൂന്നാമതൊരാളെ അയച്ചു’ അഥവാ ‘അവൻ തുടർന്നു മൂന്നാമതൊരാളെ അയച്ചു’ എന്നർഥമുള്ള പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: പിന്നെ ... അയച്ചു
  rationale: προστίθημι + infinitive എന്ന പ്രയോഗം മറ്റൊരു പ്രവൃത്തി തുടർന്നുചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ‘പിന്നെ ... അയച്ചു’ എന്നത് ഈ തുടർച്ച വ്യക്തമാക്കുന്നു; ‘അയയ്ക്കാൻ കൂട്ടിച്ചേർത്തു’ എന്ന അക്ഷരാർഥ വിവർത്തനം അസ്വാഭാവികമാണ്.
- source_word: τρίτον πέμψαι
  choice: മൂന്നാമതൊരാളെ അയച്ചു
  rationale: ഗ്രീക്കിൽ ‘മൂന്നാമനെ അയയ്ക്കുക’ എന്നാണ്; മുൻസന്ദർഭത്തിൽനിന്ന് ദാസനെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമായതിനാൽ, ഇവിടെ ഇല്ലാത്ത നാമം ചേർക്കാതെ ‘മൂന്നാമതൊരാളെ’ എന്ന് നൽകി.
- source_word: οἱ δὲ
  choice: എന്നാൽ അവർ
  rationale: δέ ഉടമയുടെ നടപടിയിൽനിന്ന് കുടിയാന്മാരുടെ വിരുദ്ധ പ്രതികരണത്തിലേക്കുള്ള തിരിവ് അടയാളപ്പെടുത്തുന്നു. സന്ദർഭത്തിൽ ‘അവർ’ കുടിയാന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: καὶ τοῦτον
  choice: അയാളെയും
  rationale: 'καί ആവർത്തനത്തിന്റെ അർഥം നൽകുന്നു: മുമ്പുള്ളവരെപ്പോലെ ഈ മൂന്നാമനെയും അവർ ഉപദ്രവിച്ചു. ‘അയാളെയും’ സ്വാഭാവികമായി ഈ അർഥം വഹിക്കുന്നു.'
- source_word: τραυματίσαντες
  choice: മുറിവേൽപ്പിച്ച്
  rationale: τραυματίζω എന്നത് മുറിവേൽപ്പിക്കുക എന്ന നിർദിഷ്ടമായ അർഥമുള്ളതിനാൽ പൊതുവായ ‘പരിക്കേൽപ്പിച്ച്’ എന്നതിനെക്കാൾ നേരിട്ടുള്ള ഈ പദം തിരഞ്ഞെടുത്തു.
- source_word: ἐξέβαλον
  choice: പുറത്തേക്കെറിഞ്ഞു
  rationale: ἐκβάλλω ഇവിടെ ബലപ്രയോഗത്തോടെ പുറത്താക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറത്തേക്കെറിഞ്ഞു’ പ്രവൃത്തിയുടെ അക്രമസ്വഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
