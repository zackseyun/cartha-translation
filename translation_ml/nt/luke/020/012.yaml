  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ സംക്ഷിപ്തതയും ആവർത്തനഭാവവും നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
