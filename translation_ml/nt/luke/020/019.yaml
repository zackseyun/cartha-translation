id: LUK.20.19
reference: Luke 20:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: ml
  text: ശാസ്ത്രിമാരും മുഖ്യപുരോഹിതന്മാരും ആ നാഴികയിൽത്തന്നെ അവന്റെമേൽ കൈവയ്ക്കാൻ[a] ശ്രമിച്ചു. എന്നാൽ അവർ ജനത്തെ ഭയപ്പെട്ടു. കാരണം, തങ്ങൾക്കെതിരായാണ്[b] അവൻ ഈ ഉപമ പറഞ്ഞതെന്ന് അവർ മനസ്സിലാക്കിയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ പിടികൂടാൻ’ അല്ലെങ്കിൽ ‘അവനെ അറസ്റ്റുചെയ്യാൻ’; അക്ഷരാർഥം, ‘അവന്റെമേൽ കൈവയ്ക്കാൻ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരോടാണ്’ അല്ലെങ്കിൽ ‘അവരെക്കുറിച്ചാണ്.’ സന്ദർഭത്തിൽ, ഉപമ തങ്ങളെ ലക്ഷ്യമാക്കിയതാണെന്ന് അവർ ഗ്രഹിച്ചു എന്ന അർഥമാണ് സാധ്യതയേറിയത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: ശ്രമിച്ചു
  rationale: അവരുടെ ഉദ്ദേശ്യവും അതനുസരിച്ചുള്ള ശ്രമവും സൂചിപ്പിക്കുന്നു; അവർ വിജയിച്ചുവെന്ന് ധ്വനിപ്പിക്കുന്നില്ല.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിലെ യഹൂദ നിയമപണ്ഡിതരുടെ പ്രത്യേക വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ പദം.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഒരേസമയം പല മഹാപുരോഹിതന്മാർ എന്നതിലുപരി മുഖ്യപുരോഹിത നേതൃത്വവർഗത്തെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: അവന്റെമേൽ കൈവയ്ക്കാൻ
  rationale: ഗ്രീക്കിലെ ദൃശ്യരൂപം നിലനിർത്തുകയും പിടികൂടൽ, അറസ്റ്റുചെയ്യൽ എന്നീ സന്ദർഭാർഥങ്ങൾ തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: ആ നാഴികയിൽത്തന്നെ
  rationale: അതേ സമയത്തുതന്നെ പ്രവർത്തിക്കാനുള്ള അവരുടെ ഉദ്ദേശ്യത്തിലെ അടിയന്തരതയും ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: അവർ ജനത്തെ ഭയപ്പെട്ടു
  rationale: λαός എന്നത് വെറും അവിടെ കൂടിയ ജനക്കൂട്ടത്തേക്കാൾ പൊതുജനത്തെ സൂചിപ്പിക്കാം; ഗ്രീക്കിലെ നേരിട്ടുള്ള പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἔγνωσαν
  choice: അവർ മനസ്സിലാക്കിയിരുന്നു
  rationale: ഉപമ ആരെ ലക്ഷ്യമാക്കിയതാണെന്ന് അവർ തിരിച്ചറിഞ്ഞുവെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πρὸς αὐτοὺς
  choice: തങ്ങൾക്കെതിരായാണ്
  rationale: ഉപമ തങ്ങളെത്തന്നെ കുറ്റപ്പെടുത്തുന്നതായി നേതാക്കൾ ഗ്രഹിച്ചുവെന്ന സന്ദർഭത്തിലെ ഏറ്റുമുട്ടൽഭാവം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥമായ ‘അവരോട്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παραβολὴν
  choice: ഉപമ
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ παραβολή എന്നതിന് സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാള പദം.
theological_decisions:
- issue: πρὸς αὐτούς എന്നതിലൂടെ ഉപമയും മതനേതാക്കളും തമ്മിലുള്ള ബന്ധം
  choice: ഉപമ തങ്ങൾക്കെതിരായി പറഞ്ഞതാണെന്ന് അവർ മനസ്സിലാക്കി
  alternative: ഉപമ അവരോടാണ് പറഞ്ഞത്; അല്ലെങ്കിൽ അവരെക്കുറിച്ചാണ് പറഞ്ഞത്
  rationale: മുൻപത്തെ ഉപമയിലെ കുറ്റവിധി തങ്ങളെയാണ് ലക്ഷ്യമിടുന്നതെന്ന് അവരുടെ ഉടനെയുള്ള പ്രതികരണം കാണിക്കുന്നു. ‘തങ്ങൾക്കെതിരായി’ എന്നത് ഈ ഏറ്റുമുട്ടൽഭാവം നൽകുന്നു; എങ്കിലും πρός എന്നതിന്റെ കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശാസ്ത്രിമാർ’, ‘മുഖ്യപുരോഹിതന്മാർ’, ‘ഉപമ’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; വാക്യഘടന വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി.
