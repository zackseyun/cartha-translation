id: LUK.20.34
reference: Luke 20:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “ഈ യുഗത്തിന്റെ പുത്രന്മാർ[a] വിവാഹം കഴിക്കുകയും വിവാഹത്തിനു നൽകപ്പെടുകയും ചെയ്യുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ യുഗത്തിലെ ആളുകൾ.” ഗ്രീക്കിൽ “ഈ യുഗത്തിന്റെ പുത്രന്മാർ”; ഇപ്പോഴത്തെ യുഗത്തിൽപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന പ്രതിനിധാനപരമായ പുരുഷലിംഗപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്താതെ വാക്യബന്ധത്തിൽ ഉൾപ്പെടുത്തി]'
  rationale: മലയാളത്തിൽ ഈ മറുപടിയുടെ തുടക്കത്തിൽ ‘എന്നിട്ട്/അപ്പോൾ’ ചേർത്താൽ ഗ്രീക്കിലില്ലാത്ത കാലക്രമസൂചന വരാം; ലളിതമായ വാക്യബന്ധം സന്ദർഭം തന്നെ വ്യക്തമാക്കുന്നു.
- source_word: εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: യേശു അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്ക് പദക്രമം മലയാളത്തിലെ സ്വാഭാവിക കർത്താവ്–കർമ്മം–ക്രിയ ക്രമത്തിലാക്കി; ‘പറഞ്ഞു’ എന്നത് εἶπεν എന്ന സാധാരണ പ്രസ്താവനാക്രിയയെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: ഈ യുഗത്തിന്റെ പുത്രന്മാർ
  rationale: υἱοί എന്ന പുരുഷലിംഗ ബഹുവചനരൂപവും ‘ഈ യുഗത്തിൽപ്പെട്ടവർ’ എന്ന ബന്ധസൂചകമായ സെമിറ്റിക് പ്രയോഗവും നിലനിർത്തുന്നു. ഇവിടെ ‘പുത്രന്മാർ’ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: γαμοῦσιν
  choice: വിവാഹം കഴിക്കുന്നു
  rationale: വിവാഹബന്ധത്തിൽ പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സജീവക്രിയയുടെ സ്വാഭാവിക ആധുനിക മലയാളരൂപം.
- source_word: γαμίσκονται
  choice: വിവാഹം കഴിച്ചുകൊടുക്കപ്പെടുന്നു
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപവും മുൻക്രിയയുമായുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു; ‘വിവാഹം കഴിപ്പിക്കപ്പെടുന്നു’ എന്നതിനെക്കാൾ വിവാഹം നൽകുന്ന പരമ്പരാഗത പ്രയോഗഭാവം ഇതിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: പ്രതിനിധാനപരമായ പുരുഷലിംഗപ്രയോഗം
  choice: ഈ യുഗത്തിന്റെ പുത്രന്മാർ
  alternative: ഈ യുഗത്തിലെ ആളുകൾ / ഈ യുഗത്തിൽപ്പെട്ടവർ
  rationale: മൂലത്തിലെ υἱοί എന്ന രൂപം മറച്ചുവയ്ക്കാതെ നിലനിർത്തുകയും അത് ഈ യുഗത്തിൽപ്പെട്ട എല്ലാവരെയും പ്രതിനിധാനപരമായി സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
- issue: αἰών എന്ന പദത്തിന്റെ യുഗാന്ത്യശാസ്ത്രപരമായ അർഥം
  choice: ഈ യുഗം
  alternative: ഈ ലോകം
  rationale: തുടർന്നുള്ള വാക്യങ്ങളിലെ വരാനിരിക്കുന്ന യുഗത്തോടുള്ള വൈരുധ്യം സംരക്ഷിക്കാൻ ‘ലോകം’ എന്നതിനു പകരം ‘യുഗം’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യുഗം’ സന്ദർഭത്തിലെ യുഗാന്ത്യശാസ്ത്രപരമായ വൈരുധ്യം സൂക്ഷിക്കുന്നു; ‘പുത്രന്മാർ’ എന്ന മൂലരൂപം അടിക്കുറിപ്പോടെ നിലനിർത്തുന്നു.
