  to: 'അവർ അവനോടു ചോദിച്ചു: “ഗുരുവേ, അങ്ങ് ശരിയായി സംസാരിക്കുകയും പഠിപ്പിക്കുകയും ചെയ്യുന്നുവെന്നും, ആരുടെയും മുഖം നോക്കാതെ[a] മറിച്ച് സത്യമായി[b] ദൈവത്തിന്റെ വഴി പഠിപ്പിക്കുന്നുവെന്നും ഞങ്ങൾക്കറിയാം.”'
  rationale: ‘മറിച്ച്’ ചേർത്ത് ἀλλ’യുടെ വൈരുധ്യബന്ധം വ്യക്തമായി നിലനിർത്തി. ആധുനിക സാധാരണ ഉപയോഗത്തിനായി ‘ഗുരോ’യെ ‘ഗുരുവേ’ എന്നു മാറ്റി. മറ്റ് പദങ്ങളും അടിക്കുറിപ്പ് ആങ്കറുകളും മൂലപാഠത്തിന്റെ അർഥവും നിലവിലെ ഉദ്ദേശ്യവും സംരക്ഷിക്കുന്നതിനാൽ മാറ്റിയിട്ടില്ല.
