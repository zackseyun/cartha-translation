id: LUK.20.21
reference: Luke 20:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: ml
  text: 'അവർ അവനോടു ചോദിച്ചു: “ഗുരുവേ, അങ്ങ് ശരിയായി സംസാരിക്കുകയും പഠിപ്പിക്കുകയും ചെയ്യുന്നുവെന്നും, ആരുടെയും മുഖം നോക്കാതെ[a] മറിച്ച് സത്യമായി[b] ദൈവത്തിന്റെ വഴി പഠിപ്പിക്കുന്നുവെന്നും ഞങ്ങൾക്കറിയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ആരോടും പക്ഷപാതം കാണിക്കാതെ.” ഗ്രീക്കിൽ അക്ഷരാർഥം “മുഖം സ്വീകരിക്കാതെ”; പദവിയോ പുറംകാഴ്ചയോ കണക്കിലെടുത്ത് അനുകൂലമായി പെരുമാറാതിരിക്കുക എന്നർഥമുള്ള പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “സത്യത്തിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: ചോദിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ചോദിക്കുക’ എന്നാണ്. സന്ദർഭത്തിൽ പരീക്ഷിക്കാനുള്ള ഉദ്ദേശ്യമുണ്ടെങ്കിലും, ക്രിയയിൽ തന്നെയില്ലാത്ത ശത്രുത ‘ചോദ്യം ചെയ്തു’ എന്നതിലൂടെ അമിതമായി സൂചിപ്പിക്കാതിരിക്കാൻ സ്വാഭാവികമായ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: Διδάσκαλε
  choice: ഗുരോ
  rationale: നേരിട്ടുള്ള സംബോധനമായ ‘Teacher’ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആദരസൂചകവുമായി നൽകുന്നു.
- source_word: οἴδαμεν
  choice: ഞങ്ങൾക്കറിയാം
  rationale: പ്രഭാഷകർ ഉറപ്പോടെ അവകാശപ്പെടുന്ന അറിവിനെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; അവരുടെ വാക്കുകളിലെ മുഖസ്തുതി വിവർത്തനം തന്നെ വിശദീകരിക്കുന്നില്ല.
- source_word: ὀρθῶς
  choice: ശരിയായി
  rationale: സംസാരത്തിന്റെയും പഠിപ്പിക്കലിന്റെയും ശരിതനിമയെ ഒരുപോലെ വിശേഷിപ്പിക്കാൻ കഴിയുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: λέγεις καὶ διδάσκεις
  choice: സംസാരിക്കുകയും പഠിപ്പിക്കുകയും ചെയ്യുന്നു
  rationale: അടുത്ത അർഥമുള്ള രണ്ടു ഗ്രീക്ക് ക്രിയകളെയും നിലനിർത്തി വാക്യത്തിന്റെ വാചാലമായ പ്രശംസ സംരക്ഷിക്കുന്നു.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: ആരുടെയും മുഖം നോക്കാതെ
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖം സ്വീകരിക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗം പദവിയോ പുറംകാഴ്ചയോ കണക്കിലെടുത്ത് പക്ഷപാതം കാണിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മുഖം നോക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗം അതിന്റെ ദൃശ്യരൂപവും ആശയവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
- source_word: ἐπ’ ἀληθείας
  choice: സത്യമായി
  rationale: യേശു പഠിപ്പിക്കുന്ന രീതിയെ സത്യത്തോടൊത്തതായി വിവരിക്കുന്ന വാക്യഘടന സ്വാഭാവികമായി നൽകുന്നു; ‘സത്യത്തിൽ’ എന്ന കൂടുതൽ രൂപപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വഴി
  rationale: നിശ്ചിതമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും ദൈവഹിതം, ദൈവിക ജീവിതമാർഗം എന്നീ അർഥപ്രതിധ്വനികളും സംരക്ഷിക്കുന്നു.
- source_word: ἀλλ’
  choice: -ആതെ … സത്യമായി
  rationale: ഗ്രീക്കിലെ വൈരുധ്യം മലയാളത്തിൽ ‘മുഖം നോക്കാതെ … സത്യമായി’ എന്ന സ്വാഭാവിക നിഷേധാത്മക-സകാരാത്മക ഘടനയിലൂടെ പ്രകടമാക്കുന്നു; വേറൊരു ‘എന്നാൽ’ ചേർത്താൽ വാക്യം കൃത്രിമമാകും.
theological_decisions:
- issue: പക്ഷപാതത്തെക്കുറിച്ചുള്ള ഭാഷാശൈലി
  choice: οὐ λαμβάνεις πρόσωπον എന്നത് ‘ആരുടെയും മുഖം നോക്കാതെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ആരോടും പക്ഷപാതം കാണിക്കാതെ’
  rationale: മുഖം/പദവി നോക്കാതെ വിധിക്കുന്നതെന്ന നൈതിക ആശയം വ്യക്തമാക്കിക്കൊണ്ട് മൂലഭാഷയിലെ രൂപകത്തോട് അടുത്തുനിൽക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- issue: ἐπ’ ἀληθείας എന്നതിന്റെ ബന്ധം
  choice: പഠിപ്പിക്കുന്ന രീതിയെ വിശേഷിപ്പിക്കുന്ന ‘സത്യമായി’ എന്നു നൽകി.
  alternative: ‘സത്യത്തിൽ ദൈവത്തിന്റെ വഴി പഠിപ്പിക്കുന്നു’
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ ഈ പദപ്രയോഗം പഠിപ്പിക്കലിന്റെ സത്യസന്ധമായ രീതിയെയോ സത്യത്തോടുള്ള യോജിപ്പിനെയോ സൂചിപ്പിക്കാം. പ്രധാന പാഠം സ്വാഭാവികമായ വായന നൽകുന്നു; കൂടുതൽ രൂപപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. യേശുവിനോടുള്ള നേരിട്ടുള്ള ആദരം പ്രകടിപ്പിക്കാൻ ‘അങ്ങ്’ സ്വീകരിച്ചു. ഗ്രീക്കിലെ ആവർത്തനമായ ‘സംസാരിക്കുകയും പഠിപ്പിക്കുകയും … പഠിപ്പിക്കുന്നു’ ചുരുക്കാതെ നിലനിർത്തി; അത് പ്രഭാഷകരുടെ ഉദ്ദേശ്യപൂർവമായ പ്രശംസയുടെ വാചാലത സംരക്ഷിക്കുന്നു.
