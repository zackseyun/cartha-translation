  text: οὐκέτι ⸀γὰρ ἐτόλμων ἐπερωτᾶν αὐτὸν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/040.yaml
  text: For they no longer dared to ask him anything.
translation:
  language: ml
  text: കാരണം, പിന്നെ അവനോട് ഒന്നും ചോദിക്കാൻ അവർ ധൈര്യപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: പിന്നെ ... ഇല്ല
  rationale: മുൻപുണ്ടായിരുന്ന പ്രവൃത്തി അതിനുശേഷം നിലച്ചുവെന്ന കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തെ വിശദീകരിക്കുന്ന കാരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐτόλμων
  choice: ധൈര്യപ്പെട്ടില്ല
  rationale: τολμάω എന്ന ക്രിയയുടെ ധൈര്യപ്പെടുക എന്ന അർഥം നേരിട്ട് നൽകുന്നു; οὐκέτιയോടൊപ്പം മുമ്പുണ്ടായിരുന്ന സന്നദ്ധത പിന്നെ ഇല്ലാതായെന്ന ആശയം പ്രകടമാകുന്നു.
- source_word: ἐπερωτᾶν
  choice: ചോദിക്കാൻ
  rationale: വെല്ലുവിളിയുടെ പശ്ചാത്തലത്തിലും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും അർഥസമ്പൂർണവുമായ പ്രയോഗം.
- source_word: αὐτὸν
  choice: അവനോട്
  rationale: മലയാളത്തിൽ ചോദിക്കുക എന്ന ക്രിയയോടു ചേരുന്ന സ്വാഭാവിക ദത്തിവിഭക്തിപ്രയോഗം; സൂചിപ്പിക്കുന്നത് യേശുവിനെയാണ്.
- source_word: οὐδέν
  choice: ഒന്നും
  rationale: നിഷേധക്രിയയോടൊപ്പം യാതൊരു കാര്യവും ചോദിച്ചില്ലെന്ന സമഗ്രത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ വിശദീകരണബന്ധവും ചോദ്യംചെയ്യാനുള്ള ധൈര്യം അവസാനിച്ചുവെന്ന കാലഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
