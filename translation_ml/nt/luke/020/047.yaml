source:
  edition: SBLGNT
  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: ml
  text: വിധവമാരുടെ വീടുകൾ വിഴുങ്ങുകയും, മറയാക്കി ദീർഘമായി പ്രാർഥിക്കുകയും ചെയ്യുന്നവർ—അവർക്കു കൂടുതൽ കഠിനമായ ന്യായവിധി ലഭിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മറയാക്കി” എന്നതിന് “കാഴ്ചയ്ക്കുവേണ്ടി” അല്ലെങ്കിൽ “ഒരു മറവായി” എന്നും പരിഭാഷപ്പെടുത്താം; “കൂടുതൽ കഠിനമായ ന്യായവിധി” എന്നതിന് “വലിയ ശിക്ഷാവിധി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: വിഴുങ്ങുകയും
  rationale: വിധവമാരുടെ സ്വത്ത് നിർദയമായി ചൂഷണം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന രൂപകത്തിന്റെ തീക്ഷ്ണത നിലനിർത്തുന്നു.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: വിധവമാരുടെ വീടുകൾ
  rationale: ഗ്രീക്കിലെ അക്ഷരാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വീടുകളെയോ കുടുംബസ്വത്തിനെയോ ചൂഷണം ചെയ്യുന്നതെന്ന വിപുലമായ അർഥവും ഉൾക്കൊള്ളാം.
- source_word: προφάσει
  choice: കപടഭാവത്തിൽ
  rationale: ദീർഘപ്രാർഥന ആത്മാർഥമല്ലാതെ പുറമേയുള്ള മറയോ നടിപ്പോ ആണെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: μακρὰ προσεύχονται
  choice: ദീർഘമായി പ്രാർഥിക്കുകയും
  rationale: μακράയുടെ ക്രിയാവിശേഷണപ്രയോഗവും പ്രാർഥനയുടെ നീണ്ട ദൈർഘ്യവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: λήμψονται
  choice: ലഭിക്കും
  rationale: ഭാവികാല ഫലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായും ഗൗരവത്തോടെയും പ്രകടിപ്പിക്കുന്നു.
- source_word: περισσότερον κρίμα
  choice: കൂടുതൽ കഠിനമായ ന്യായവിധി
  rationale: താരതമ്യത്തിന്റെ തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുമ്പോഴും κρίμαയെ 'ന്യായവിധി'യായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: κρίμαയുടെ സ്വഭാവം
  choice: ന്യായവിധി
  alternative: ശിക്ഷാവിധി / കുറ്റവിധി
  rationale: സന്ദർഭത്തിൽ പ്രതികൂലമായ ദൈവിക വിധിയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും, 'ന്യായവിധി' എന്നത് ഗ്രീക്ക് പദത്തിന്റെ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല. 'കൂടുതൽ കഠിനമായ' എന്ന പ്രയോഗം പ്രതികൂലത വ്യക്തമാക്കുന്നു.
- issue: προφάσει എന്നതിന്റെ ബന്ധം
  choice: ദീർഘപ്രാർഥന കപടമായ മറയോ നടിപ്പോ ആണെന്ന നിലയിൽ അവതരിപ്പിച്ചു
  alternative: കാഴ്ചയ്ക്കുവേണ്ടി / ഒരു ഒഴികഴിവായി
  rationale: ഗ്രീക്ക് പദം കപടപ്രകടനത്തെയോ മറയെയോ സൂചിപ്പിക്കാം; പ്രധാന പാഠം സ്വാഭാവികമായി വായിക്കാനായി 'കപടഭാവത്തിൽ' സ്വീകരിച്ചു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചൂഷണത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ ശക്തമായ രൂപകം നിലനിർത്തിയിരിക്കുന്നു; വാക്യം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ആപേക്ഷിക ഉപവാക്യമാണെന്ന സ്വഭാവം ഭാഗികമായി സംരക്ഷിച്ചിരിക്കുന്നു.
