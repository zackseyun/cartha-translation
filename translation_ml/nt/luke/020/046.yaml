  to: നീണ്ട മേലങ്കികൾ[b] ധരിച്ച് ചുറ്റിനടക്കാൻ ആഗ്രഹിക്കുകയും ചന്തസ്ഥലങ്ങളിൽ അഭിവാദനങ്ങളും സിനഗോഗുകളിലെ ഏറ്റവും മാന്യമായ ഇരിപ്പിടങ്ങളും[c] വിരുന്നുകളിലെ പ്രധാന സ്ഥാനങ്ങളും[d] ഇഷ്ടപ്പെടുകയും ചെയ്യുന്ന ശാസ്ത്രിമാരെ സൂക്ഷിച്ചുകൊള്ളുക.[a]
