  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: ml
  text: നീണ്ട മേലങ്കികൾ[b] ധരിച്ച് ചുറ്റിനടക്കാൻ ആഗ്രഹിക്കുകയും ചന്തസ്ഥലങ്ങളിൽ അഭിവാദനങ്ങളും സിനഗോഗുകളിലെ ഏറ്റവും മാന്യമായ ഇരിപ്പിടങ്ങളും[c] വിരുന്നുകളിലെ പ്രധാന സ്ഥാനങ്ങളും[d] ഇഷ്ടപ്പെടുകയും ചെയ്യുന്ന ശാസ്ത്രിമാരെ സൂക്ഷിച്ചുകൊള്ളുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ശാസ്ത്രിമാരെ കരുതിയിരിക്കുക.”'
    reason: lexical_alternative
  - marker: b
    text: “നീണ്ട മേലങ്കികൾ” പൊതുസമൂഹത്തിൽ പദവിയും പ്രാധാന്യവും പ്രകടമാക്കിയിരുന്ന ശ്രദ്ധേയമായ വസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: “ഏറ്റവും മാന്യമായ ഇരിപ്പിടങ്ങൾ” എന്നതിന് “പ്രധാന ഇരിപ്പിടങ്ങൾ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: d
    text: “പ്രധാന സ്ഥാനങ്ങൾ” എന്നതിന് “ഏറ്റവും നല്ല സ്ഥാനങ്ങൾ” അഥവാ “ആദരണീയ സ്ഥാനങ്ങൾ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: ഈ മുന്നറിയിപ്പുഘടനയിൽ സ്വയം ജാഗ്രത പാലിക്കാനും പ്രസ്തുത കൂട്ടരുടെ സ്വാധീനത്തിൽനിന്ന് അകന്നിരിക്കാനും ആവശ്യപ്പെടുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: γραμματέων
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിലെ തിരുവെഴുത്തുപണ്ഡിതരെയും നിയമവ്യാഖ്യാതാക്കളെയും സൂചിപ്പിക്കുന്ന പതിവും സംക്ഷിപ്തവുമായ പദം.
- source_word: τῶν θελόντων περιπατεῖν ἐν στολαῖς
  choice: നീണ്ട മേലങ്കികൾ ധരിച്ച് ചുറ്റിനടക്കാൻ ആഗ്രഹിക്കുന്ന
  rationale: θέλωയുടെ ഇച്ഛാഭാവവും περιπατέωയുടെ പൊതുസ്ഥലത്തെ പ്രദർശനാത്മക സഞ്ചാരവും στολήയുടെ നീണ്ട, സ്ഥാനസൂചക വസ്ത്രധാരണവും വ്യക്തമാക്കുന്നു.
- source_word: φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
  choice: ചന്തസ്ഥലങ്ങളിൽ അഭിവാദനങ്ങൾ ഇഷ്ടപ്പെടുന്ന
  rationale: φιλέω ഇവിടെ ബഹുമാനസൂചകമായ പൊതുഅഭിവാദനങ്ങളോടുള്ള പ്രിയത്തെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തേക്കാൾ വിശദീകരിച്ച് ചേർക്കാതെ സന്ദർഭാർഥം നിലനിർത്തുന്നു.
- source_word: πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
  choice: സിനഗോഗുകളിലെ ഏറ്റവും മാന്യമായ ഇരിപ്പിടങ്ങൾ
  rationale: πρωτοκαθεδρία വെറും മുൻനിരയെയല്ല, ഉയർന്ന ബഹുമതിയുള്ള ഇരിപ്പിടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; 'ഏറ്റവും മാന്യമായ' എന്നത് അതിന്റെ സാമൂഹിക പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: πρωτοκλισίας ἐν τοῖς δείπνοις
  choice: വിരുന്നുകളിലെ ആദരണീയ സ്ഥാനങ്ങൾ
  rationale: പുരാതന വിരുന്നുകളിൽ ഉയർന്ന പദവിക്കാർക്കുള്ള പ്രധാന ചാരിയിരിപ്പിടങ്ങളെ സൂചിപ്പിക്കുന്നു; ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമായി മനസ്സിലാകുന്ന പ്രവർത്തനസമാനമായ വിവർത്തനം.
theological_decisions:
- issue: ശാസ്ത്രിമാരെക്കുറിച്ചുള്ള സാമൂഹിക-മതപരമായ വിമർശനം
  choice: തുടർന്നുള്ള കർത്തൃവിശേഷണങ്ങൾ വിവരിക്കുന്ന ആഡംബരവും പൊതുബഹുമാനലോലുപതയും ഉള്ള ശാസ്ത്രിമാരെക്കുറിച്ചുള്ള മുന്നറിയിപ്പായി വിവർത്തനം ചെയ്തു.
  alternative: എല്ലാ ശാസ്ത്രിമാരെയും വ്യത്യാസമില്ലാതെ സമ്പൂർണമായി കുറ്റപ്പെടുത്തുക; അല്ലെങ്കിൽ വിമർശനം വസ്ത്രധാരണത്തിൽ മാത്രം പരിമിതപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് വാക്യം 'ശാസ്ത്രിമാർ' എന്ന കൂട്ടത്തെ തുടർന്നുള്ള പങ്കാളിത്തരൂപങ്ങളാൽ സ്വഭാവീകരിക്കുന്നു. പറഞ്ഞിരിക്കുന്ന പെരുമാറ്റങ്ങളെ കവിയുന്ന സമഗ്രമായ മതവിധി ചേർക്കാതെയും മുന്നറിയിപ്പിന്റെ ധാർമ്മിക ശക്തി കുറയ്ക്കാതെയും വിവർത്തനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ മുന്നറിയിപ്പും തുടർച്ചയായ സ്വഭാവവിവരണങ്ങളും ഒരൊറ്റ സുതാര്യവാക്യമായി നിലനിർത്തി. ‘സിനഗോഗ്’ യഹൂദ ആരാധനാസന്ദർഭത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
