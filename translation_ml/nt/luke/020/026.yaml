  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: ml
  text: ജനത്തിന്റെ മുമ്പിൽവെച്ച്, അവൻ പറഞ്ഞതിൽ അവനെ കുടുക്കാൻ അവർക്കു കഴിഞ്ഞില്ല[a]. അവന്റെ മറുപടിയിൽ ആശ്ചര്യപ്പെട്ട അവർ മിണ്ടാതായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ വാക്കിൽ അവനെ പിടികൂടാൻ.’
    reason: ἐπιλαβέσθαι τοῦ ῥήματος എന്ന പ്രയോഗത്തിന്റെ കൂടുതൽ അക്ഷരാനുസൃതമായ മറ്റൊരു വിവർത്തനം; മുഖ്യപാഠം അതിന്റെ സന്ദർഭോചിതമായ ‘വാക്കിന്റെ പേരിൽ അവനെ കുടുക്കുക’ എന്ന അർഥം നൽകുന്നു.
lexical_decisions:
- source_word: ἴσχυσαν
  choice: കഴിഞ്ഞില്ല
  rationale: കഴിവോ പ്രാപ്തിയോ ഇല്ലായ്മയെ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπιλαβέσθαι
  choice: പിടികൂടാൻ
  rationale: ‘പിടിക്കുക/പിടിച്ചെടുക്കുക’ എന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തിക്കൊണ്ട്, യേശുവിന്റെ വാക്കിനെ ആധാരമാക്കി കുറ്റം കണ്ടെത്താനുള്ള ശ്രമം മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ ῥήματος
  choice: അവന്റെ വാക്കിൽ
  rationale: ഇവിടെ ῥῆμα ഒരു സംസാരിച്ച വാക്കിനെയോ പ്രസ്താവനയെയോ സൂചിപ്പിക്കുന്നു; ‘അവന്റെ’ എന്നത് സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്ന ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: ജനത്തിന്റെ മുമ്പിൽവെച്ച്
  rationale: ജനസാന്നിധ്യത്തിൽ പരസ്യമായി നടന്ന ശ്രമം വ്യക്തമാക്കുകയും λαός എന്നതിനെ ‘ജനം’ എന്നു വിശാലമായി പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: θαυμάσαντες
  choice: ആശ്ചര്യപ്പെട്ട്
  rationale: അവന്റെ മറുപടിയോടുള്ള വിസ്മയപ്രതികരണം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀποκρίσει
  choice: മറുപടിയിൽ
  rationale: വാദപ്രതിവാദസന്ദർഭത്തിൽ നൽകിയ ഉത്തരത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐσίγησαν
  choice: അവർ മൗനമായി
  rationale: അവർ സംസാരിക്കുന്നത് നിർത്തി മൗനത്തിലായെന്ന സംഭവപരമായ മാറ്റം ചുരുക്കമായും ഗൗരവത്തോടെയും പ്രകടിപ്പിക്കുന്നു.
