  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: ml
  text: എന്നാൽ മരിച്ചവർ ഉയിർപ്പിക്കപ്പെടുന്നു എന്ന കാര്യം മോശെപോലും മുൾപ്പടർപ്പിനെക്കുറിച്ചുള്ള ഭാഗത്ത്[a] വ്യക്തമാക്കിയിട്ടുണ്ട്. അവിടെ അദ്ദേഹം കർത്താവിനെ[b] ‘അബ്രാഹാമിന്റെ ദൈവവും യിസ്ഹാക്കിന്റെ ദൈവവും യാക്കോബിന്റെ ദൈവവും’ എന്നു വിളിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുൾപ്പടർപ്പിങ്കൽ.’ ഈ ഗ്രീക്ക് പ്രയോഗം മുൾപ്പടർപ്പിന്റെ സംഭവസ്ഥലത്തെയോ, പ്രയോഗശൈലിയനുസരിച്ച്, കത്തുന്ന മുൾപ്പടർപ്പിനെക്കുറിച്ചുള്ള തിരുവെഴുത്തുഭാഗത്തെയോ (പുറപ്പാട് 3) സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘കർത്താവ്.’ പുറപ്പാട് 3-ൽ ദൈവനാമം പരിഭാഷപ്പെടുത്താൻ ഗ്രീക്ക് പഴയനിയമം പതിവായി ഉപയോഗിച്ച രൂപത്തെ ഇത് പ്രതിഫലിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: ഉയിർപ്പിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗം നിലനിർത്തുകയും മരിച്ചവരെ ഉയിർപ്പിക്കുന്ന ദൈവിക പ്രവർത്തനം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ νεκροὶ
  choice: മരിച്ചവർ
  rationale: വ്യക്തികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് നാമവത്കൃത വിശേഷണത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: ἐμήνυσεν
  choice: വ്യക്തമാക്കിയിട്ടുണ്ട്
  rationale: ‘അറിയിക്കുക, വെളിപ്പെടുത്തുക, സൂചിപ്പിക്കുക’ എന്ന അർഥം നൽകുന്നു; മോശെയുടെ സാക്ഷ്യം ഔപചാരിക പ്രഖ്യാപനമായി അതിശയോക്തിയാക്കുന്നില്ല.
- source_word: ἐπὶ τῆς βάτου
  choice: മുൾപ്പടർപ്പിനെക്കുറിച്ചുള്ള ഭാഗത്ത്
  rationale: പുറപ്പാട് 3-ലെ മുൾപ്പടർപ്പിന്റെ സംഭവത്തെക്കുറിച്ചുള്ള തിരുവെഴുത്തുഭാഗത്തേക്കുള്ള പ്രചാരത്തിലുള്ള സാഹിത്യപരമായ പരാമർശം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സ്ഥലപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὡς λέγει
  choice: അവിടെ അദ്ദേഹം ... എന്നു വിളിക്കുന്നു
  rationale: തുടർന്നുള്ള ഇരട്ട കർമഘടനയ്ക്ക് യോജിച്ച്, മോശെ കർത്താവിനെ ഈ ദൈവനാമങ്ങളാൽ വിശേഷിപ്പിക്കുന്നു എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κύριον
  choice: കർത്താവിനെ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന് പദ്ധതിയുടെ സാധാരണ മലയാളസമാനപദം; ഇവിടെ വാക്യത്തിലെ കർമരൂപവും നിലനിർത്തുന്നു.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: അബ്രാഹാമിന്റെ ദൈവവും യിസ്ഹാക്കിന്റെ ദൈവവും യാക്കോബിന്റെ ദൈവവും
  rationale: ഓരോ പൂർവപിതാവിനോടും കൂടിയ θεόν എന്ന ആവർത്തനം നിലനിർത്തി ഗ്രീക്കിന്റെയും പുറപ്പാട് ഉദ്ധരണിയുടെയും ഊന്നലും താളവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സദൂക്യർക്കെതിരായ യേശുവിന്റെ വാദത്തിലെ പുനരുത്ഥാനഭാഷ
  choice: മരിച്ചവർ ഉയിർപ്പിക്കപ്പെടുന്നു
  alternative: മരിച്ചവർ ഉയിർത്തെഴുന്നേൽക്കുന്നു
  rationale: കർമണിപ്രയോഗം ഗ്രീക്ക് രൂപത്തോട് കൂടുതൽ ചേർന്നുനിൽക്കുകയും, പാഠം പരോക്ഷമായി സൂചിപ്പിക്കുന്ന ദൈവിക പ്രവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു; അതേസമയം പാഠത്തിനപ്പുറമുള്ള സിദ്ധാന്തവിവരണം ചേർക്കുന്നില്ല.
- issue: ഇസ്രായേലിന്റെ ദൈവത്തെക്കുറിച്ചുള്ള ഉദ്ധരണിയിൽ κύριος എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: ഗ്രീക്ക് പാഠത്തിലുള്ള κύριος നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു. പുറപ്പാട് 3-ലെ ദൈവനാമപാരമ്പര്യവുമായുള്ള ബന്ധം പ്രധാനവാചകത്തിൽ പ്രത്യേക രൂപം അടിച്ചേൽപ്പിക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘മോശെപോലും’ എന്നത് καὶ Μωϋσῆς എന്നതിലെ ഊന്നൽ നൽകുന്നു. ദൈവങ്ങളുടെ പട്ടികയിലെ ആവർത്തനം ചുരുക്കാതെ മൂലപാഠത്തിന്റെ വാദാത്മക താളം സംരക്ഷിച്ചു.
