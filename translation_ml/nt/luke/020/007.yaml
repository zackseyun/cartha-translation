  yaml_path: translation/nt/luke/020/007.yaml
  text: So they answered that they did not know where it was from[a].
translation:
  language: ml
  text: അങ്ങനെ, അത് എവിടെനിന്നുള്ളതാണെന്ന് തങ്ങൾക്കറിയില്ലെന്ന് അവർ ഉത്തരം പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിന്റെ ഉത്ഭവം അല്ലെങ്കിൽ ഉറവിടം എന്താണെന്ന്.” ഗ്രീക്ക് പദം ഉത്ഭവത്തെയോ ഉറവിടത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അതിനാൽ
  rationale: കേവലമായ ‘എന്നും’ എന്ന ബന്ധത്തേക്കാൾ, മുൻസന്ദർഭത്തിലെ ആലോചനയുടെ ഫലമായി അവർ നൽകിയ മറുപടിയിലേക്കുള്ള ആഖ്യാനപരമായ നീക്കം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπεκρίθησαν
  choice: അവർ … ഉത്തരം പറഞ്ഞു
  rationale: ἀποκρίνομαι എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘ഉത്തരം പറയുക’ നേരായും മാന്യമായും നൽകുന്നു.
- source_word: μὴ εἰδέναι
  choice: തങ്ങൾക്കറിയില്ലെന്ന്
  rationale: മറുപടി പറയുന്ന ക്രിയയ്ക്കുശേഷമുള്ള പരോക്ഷപ്രസ്താവന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും, കർത്താവ് മുൻപറഞ്ഞ ‘അവർ’ തന്നെയാണെന്ന് ‘തങ്ങൾ’ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: πόθεν
  choice: എവിടെനിന്നുള്ളതാണെന്ന്
  rationale: യോഹന്നാന്റെ സ്നാനത്തിന്റെ ഉറവിടമോ ഉത്ഭവമോ ചോദിക്കുന്ന πόθεν എന്ന പദത്തിന്റെ അർഥം അമിതമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അത്’ മുൻസന്ദർഭത്തിലെ യോഹന്നാന്റെ സ്നാനത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ വിവർത്തനത്തിൽ ആ സൂചന തുറന്ന് ചേർത്ത് മൂലപാഠത്തെക്കാൾ വ്യക്തീകരിച്ചിട്ടില്ല.
