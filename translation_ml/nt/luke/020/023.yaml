  text: But perceiving their cunning[a], he said to them,
translation:
  language: ml
  text: 'എന്നാൽ അവരുടെ കപടതന്ത്രം തിരിച്ചറിഞ്ഞ് അദ്ദേഹം അവരോടു പറഞ്ഞു: [a]'
