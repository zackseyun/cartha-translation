lexical_decisions:
- source_word: κατανοήσας
  choice: തിരിച്ചറിഞ്ഞ്
  rationale: ക്രിയയ്ക്കു മുമ്പുള്ള യേശുവിന്റെ സൂക്ഷ്മമായ ഗ്രഹിക്കൽ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് കൃതന്തത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: വിവരണത്തിലെ നേരിയ വൈരുധ്യവും വഴിത്തിരിവും വ്യക്തമാക്കുന്നു.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: πανουργίαν എന്ന പദത്തെ വിശേഷിപ്പിക്കുന്ന ജനിറ്റീവ് സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: πανουργίαν
  choice: കൗശലം
  rationale: സമർഥമായെങ്കിലും സത്യസന്ധമല്ലാത്ത തന്ത്രപരമായ നീക്കം എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു; നിഷേധാത്മക ഭാവം സന്ദർഭവും അടിക്കുറിപ്പും വ്യക്തമാക്കുന്നു.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപത്തിന് സ്വാഭാവികമായ മലയാളപരിഭാഷ.
- source_word: πρὸς αὐτούς
  choice: അവരോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
