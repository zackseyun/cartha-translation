    text: ‘കൗശലം,’ ‘തന്ത്രം,’ അല്ലെങ്കിൽ ‘വഞ്ചന’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ധാർമികനിയന്ത്രണമില്ലാത്ത, കണക്കുകൂട്ടിയുള്ള തന്ത്രത്തിന്റെ ആശയം ഉൾക്കൊള്ളുന്നു.
