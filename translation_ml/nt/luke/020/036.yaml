  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: ml
  text: എന്തെന്നാൽ, അവർക്ക് ഇനി മരിക്കാൻ കഴിയുകയില്ല; കാരണം അവർ ദൂതന്മാരെപ്പോലെയുള്ളവരാണ്[a]. പുനരുത്ഥാനത്തിന്റെ പുത്രന്മാരായ അവർ ദൈവത്തിന്റെ പുത്രന്മാരുമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൂതന്മാർക്കു തുല്യരാണ്.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ദൈവത്തിന്റെ പുത്രന്മാർ’ എന്നും ‘പുനരുത്ഥാനത്തിന്റെ പുത്രന്മാർ’ എന്നും വരുന്നു. ഇവിടെ പുല്ലിംഗരൂപം പുരുഷന്മാരെ മാത്രം ഉൾക്കൊള്ളുന്നതല്ല; പദവിയും സ്വത്വവുമാണ് പ്രകടിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθανεῖν ἔτι δύνανται
  choice: ഇനി മരിക്കാനും കഴിയുകയില്ല
  rationale: δύνανται കഴിവിനെയും ἔτι ‘ഇനി/ഇനിമേൽ’ എന്ന അർഥത്തെയും സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം മരണശീലത്തിന്റെ അവസാനമാണ് വ്യക്തമാക്കുന്നത്; ‘വീണ്ടും മരിക്കുക’ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἰσάγγελοι
  choice: ദൂതന്മാരെപ്പോലെയുള്ളവർ
  rationale: ദൂതന്മാരുമായുള്ള സാമ്യമോ തുല്യനിലയോ സൂചിപ്പിക്കുന്ന പദമാണിത്; അവരെ ദൂതന്മാരായി തിരിച്ചറിയാതെ താരതമ്യം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: υἱοί ... θεοῦ
  choice: ദൈവത്തിന്റെ പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ υἱοί എന്ന പുത്രത്വഭാഷയും തുടർന്നുള്ള സമാന്തരപ്രയോഗവും നിലനിർത്തുന്നു. ഇവിടെ അത് പുരുഷന്മാരെ മാത്രം ഉൾക്കൊള്ളുന്നതല്ല, പദവിയും സ്വത്വവുമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: പുനരുത്ഥാനത്തിന്റെ പുത്രന്മാരായിരിക്കുന്ന
  rationale: ‘പുനരുത്ഥാനത്തിന്റെ പുത്രന്മാർ’ എന്ന രൂപകം നിലനിർത്തുകയും ὄντες എന്ന പങ്കാളിക്രിയയുടെ വിശദീകരണസ്വഭാവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു; കാരണബന്ധം മാത്രമായി അതിനെ ചുരുക്കുന്നില്ല.
- source_word: γάρ ... γάρ
  choice: എന്തെന്നാൽ ... കാരണം
  rationale: ആദ്യ γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധവും രണ്ടാമത്തേത് ഈ വാക്യത്തിനുള്ളിലെ വിശദീകരണവും പ്രകടമാക്കുന്നു; ആവർത്തനം അസ്വാഭാവികമാകാതെ യുക്തിപ്രവാഹം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനസന്ദർഭത്തിലെ പുത്രത്വഭാഷ
  choice: ‘ദൈവത്തിന്റെ പുത്രന്മാർ’, ‘പുനരുത്ഥാനത്തിന്റെ പുത്രന്മാർ’ എന്നീ പ്രയോഗങ്ങൾ മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: ‘ദൈവത്തിന്റെ മക്കൾ’, ‘പുനരുത്ഥാനത്തിന്റെ മക്കൾ’
  rationale: മൂലപാഠം υἱοί എന്ന പദം രണ്ടുതവണ ഉപയോഗിക്കുന്നതിനാൽ അതിന്റെ ആവർത്തനവും പുത്രത്വരൂപകവും സംരക്ഷിച്ചു. ഈ സന്ദർഭത്തിൽ പ്രയോഗം പുരുഷന്മാർക്കു മാത്രമായുള്ള ഉൾപ്പെടുത്തലല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പുത്രന്മാർ’ എന്ന അല്പം ഔപചാരികമായ പദം മൂലത്തിലെ ആവർത്തിച്ച പുത്രത്വരൂപകം കൃത്യമായി നിലനിർത്താൻ ഉദ്ദേശപൂർവം ഉപയോഗിച്ചു.
