id: LUK.20.39
reference: Luke 20:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθέντες δέ τινες τῶν γραμματέων εἶπαν· Διδάσκαλε, καλῶς εἶπας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: ml
  text: 'അപ്പോൾ ശാസ്ത്രിമാരിൽ ചിലർ മറുപടിയായി പറഞ്ഞു: “ഗുരുവേ, അങ്ങ് നന്നായി പറഞ്ഞു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഗുരുവേ, അങ്ങ് പറഞ്ഞത് ശരിയാണ്,” അല്ലെങ്കിൽ “ഗുരുവേ, അങ്ങ് ശരിയായാണ് പറഞ്ഞത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ἀποκρίνομαι എന്ന ക്രിയയുടെ എയോറിസ്റ്റ് കൃദന്തരൂപം ഇവിടെ മുൻവാക്കുകളോടുള്ള പ്രതികരണത്തെ പരിചയപ്പെടുത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘മറുപടിയായി പറഞ്ഞു’ എന്നു നൽകി.
- source_word: δέ
  choice: അപ്പോൾ
  rationale: δέ നേരിയ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നു; മുൻവാദത്തിനു പിന്നാലെയുള്ള പ്രതികരണം മലയാളത്തിൽ ‘അപ്പോൾ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, ശക്തമായ വൈരുധ്യം സൃഷ്ടിക്കാതെ.
- source_word: τινες τῶν γραμματέων
  choice: ശാസ്ത്രിമാരിൽ ചിലർ
  rationale: τινες കൂടിയുള്ള ഷഷ്ഠീവിഭക്തി ഭാഗികബന്ധം സൂചിപ്പിക്കുന്നു; എല്ലാ ശാസ്ത്രിമാരുമല്ല, അവരിൽ ചിലർ മാത്രമാണെന്ന് ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: γραμματέων
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിലെ γραμματεῖς എന്ന പദത്തിന് പരിചിതവും സംക്ഷിപ്തവുമായ മലയാള ബൈബിൾപദമാണ് ‘ശാസ്ത്രിമാർ’; വിശദീകരണാത്മകമായ ‘നിയമപണ്ഡിതർ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ചരിത്രപരമായ പദവി നിലനിർത്തുന്നു.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: διδάσκαλος എന്ന സംബോധനയ്ക്ക് ആധുനിക മലയാളത്തിൽ ആദരപൂർവവും സ്വാഭാവികവുമായ തുല്യപദമാണ് ‘ഗുരുവേ’.
- source_word: καλῶς
  choice: ശരിയാണ്
  rationale: καλῶς ഇവിടെ യേശുവിന്റെ വാക്കിന്റെ ശരിതനത്തെ അംഗീകരിക്കുന്നു. ‘ശരിയാണ്’ എന്നത് മലയാളത്തിലെ സ്വാഭാവിക പ്രശംസാവാക്യം; ‘നന്നായി’ എന്ന വിശാല അർഥവും സാധ്യതയാണെന്നു അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: εἶπας
  choice: അങ്ങ് പറഞ്ഞത്
  rationale: എയോറിസ്റ്റ് രൂപമായ εἶπας മുൻപ് പറഞ്ഞ വാക്കിനെ സൂചിപ്പിക്കുന്നു. ആദരസൂചകമായ ‘അങ്ങ്’ സംഭാഷണരജിസ്റ്ററിന് യോജിക്കുന്നു; ‘പറഞ്ഞത്’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ആദരപൂർവവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. ‘ശാസ്ത്രിമാർ’ എന്ന പരമ്പരാഗത പദം നിലനിർത്തി; ഭാഗികബന്ധവും മറുപടിയുടെ സ്വഭാവവും വ്യക്തമായി പ്രകടിപ്പിച്ചു.
