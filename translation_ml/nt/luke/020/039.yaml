    text: അഥവാ, “ഗുരുവേ, അങ്ങ് പറഞ്ഞത് ശരിയാണ്,” അല്ലെങ്കിൽ “ഗുരുവേ, അങ്ങ് ശരിയായാണ് പറഞ്ഞത്.”
