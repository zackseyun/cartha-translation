id: LUK.20.8
reference: Luke 20:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “ഞാനും നിങ്ങളോടു പറയുകയില്ല—ഏത് അധികാരത്താലാണ് ഞാൻ ഈ കാര്യങ്ങൾ ചെയ്യുന്നതെന്ന്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐδὲ
  choice: ഞാനും ... പറയുകയില്ല
  rationale: മുൻവാക്യത്തിൽ നേതാക്കൾ ഉത്തരം പറയാൻ വിസമ്മതിച്ചതിനോടുള്ള യേശുവിന്റെ പ്രതികരണബന്ധം ‘ഞാനും ... ഇല്ല’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: λέγω
  choice: പറയുക
  rationale: ആർക്കെങ്കിലും ഒരു വിവരം വെളിപ്പെടുത്തുക എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ ‘നിങ്ങളോടു പറയുക’ എന്ന പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ഏത് അധികാരത്താൽ
  rationale: യേശു പ്രവർത്തിക്കുന്നതിന്റെ ആധാരമോ അധികാരപ്രമാണമോ ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ കൃത്യവും സ്വാഭാവികവുമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐξουσίᾳ
  choice: അധികാരം
  rationale: വെറും ശക്തിയെയല്ല, പ്രവർത്തിക്കാനുള്ള ന്യായമായ അവകാശത്തെയോ അധികാരത്തെയോ ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചന സൂചന നിലനിർത്തി, ചോദ്യം ചെയ്യപ്പെട്ട യേശുവിന്റെ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു.
- source_word: ποιῶ
  choice: ഞാൻ ... ചെയ്യുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: യേശു അവരോടു പറഞ്ഞു
  rationale: ആഖ്യാനമുഖവുര മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിലെ καί ഇവിടെ നിർബന്ധമായി വേറൊരു സംയോജകപദം ആവശ്യപ്പെടുന്നില്ല.
theological_decisions:
- issue: നേതാക്കൾക്കു മറുപടി നൽകാനുള്ള യേശുവിന്റെ വിസമ്മതം
  choice: തന്റെ അധികാരത്തിന്റെ ഉറവിടം അവരോടു വെളിപ്പെടുത്തുകയില്ലെന്ന നേരിട്ടുള്ള പ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തി.
  alternative: യേശു ചോദ്യം ഒഴിഞ്ഞുമാറുകയാണെന്നോ അവരുടെ അവിശ്വാസത്തെ ഇവിടെ വ്യക്തമായി വിധിക്കുകയാണെന്നോ സൂചിപ്പിക്കുക.
  rationale: വാക്യം പറയുന്നത് യേശുവിന്റെ വിസമ്മതം മാത്രമാണ്; അതിന്റെ കാരണം സംബന്ധിച്ച വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കാതെ ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ നേരിട്ടുള്ളതും ദൃഢവുമായ പ്രതികരണഭാവം നിലനിർത്താൻ ഉദ്ധരണിക്കുള്ളിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
