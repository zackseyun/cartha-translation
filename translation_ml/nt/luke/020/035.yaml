source:
  edition: SBLGNT
  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: ml
  text: എന്നാൽ ആ യുഗവും[b] മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനവും പ്രാപിക്കാൻ യോഗ്യരായി കണക്കാക്കപ്പെടുന്നവർ[a] വിവാഹം കഴിക്കുകയോ വിവാഹത്തിനു കൊടുക്കപ്പെടുകയോ ഇല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോഗ്യരായി എണ്ണപ്പെടുന്നവർ’ അല്ലെങ്കിൽ ‘യോഗ്യരെന്ന് വിധിക്കപ്പെടുന്നവർ.’ ഗ്രീക്കിൽ ഇത് നിഷ്ക്രിയരൂപമാണ്; യോഗ്യരെന്ന് വിലയിരുത്തപ്പെടുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, ‘വരാനിരിക്കുന്ന യുഗം.’ അക്ഷരാർഥം: ‘ആ യുഗം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: യോഗ്യരായി കണക്കാക്കപ്പെടുന്നവർ
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയ പ്രയോഗം ഇവർ സ്വതവേ യോഗ്യരാണെന്ന് നേരിട്ട് പറയാതെ, യോഗ്യരെന്ന് വിധിക്കപ്പെടുകയോ കണക്കാക്കപ്പെടുകയോ ചെയ്യുന്നു എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: ആ യുഗം
  rationale: പ്രകടമായ ‘ആ’ എന്ന നിർദേശപദവും ഇപ്പോഴത്തെ യുഗത്തോടുള്ള ഭാവിയുഗത്തിന്റെ വ്യത്യാസവും വ്യാഖ്യാനിച്ച് തീർക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: τυχεῖν
  choice: പ്രാപിക്കാൻ
  rationale: ഷഷ്ഠീവിഭക്തിയോടുകൂടിയ τυγχάνω എന്ന പദത്തിന്റെ ‘ലഭിക്കുക/പ്രാപിക്കുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും, ‘ആ യുഗം’, ‘പുനരുത്ഥാനം’ എന്നീ രണ്ടു സമാന്തര കർമങ്ങളോടും ചേരുകയും ചെയ്യുന്നു.
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനം
  rationale: ἐκ എന്നതിന്റെ ‘നിന്ന്’ എന്ന ആശയം വ്യക്തമായി നിലനിർത്തുന്ന, മലയാളത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: γαμοῦσιν
  choice: വിവാഹം കഴിക്കുക
  rationale: വിവാഹബന്ധത്തിൽ പ്രവേശിക്കുക എന്ന പൊതുവായ അർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: γαμίζονται
  choice: വിവാഹം കഴിപ്പിക്കപ്പെടുക
  rationale: ആദ്യ ക്രിയയിൽനിന്ന് വ്യത്യസ്തമായ നിഷ്ക്രിയരൂപം നിലനിർത്തുകയും, മറ്റൊരാളാൽ വിവാഹത്തിലേക്ക് നൽകപ്പെടുക എന്ന പുരാതന സാമൂഹിക പ്രയോഗം പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: καταξιωθέντες എന്നത് പുനരുത്ഥാനജീവിതം സ്വന്തം പുണ്യത്താൽ സമ്പാദിക്കുന്നതായി സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘യോഗ്യരായി കണക്കാക്കപ്പെടുന്നവർ’ എന്ന നിഷ്ക്രിയ പ്രയോഗം ഉപയോഗിച്ചു.
  alternative: ‘ആ യുഗത്തിന് യോഗ്യരായവർ’
  rationale: യോഗ്യതയുടെ വിധിനിർണയം സൂക്ഷിക്കുമ്പോഴും, അത് വ്യക്തികൾ സ്വന്തം പ്രവൃത്തികൊണ്ട് സമ്പാദിക്കുന്നതാണെന്ന് പരിഭാഷയിൽ കൂട്ടിച്ചേർക്കുന്നില്ല; ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്ന നിലയിൽ തുടരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘യുഗം’, ‘പുനരുത്ഥാനം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; രണ്ട് വിവാഹക്രിയകളിലെ കർത്തൃ-നിഷ്ക്രിയ വ്യത്യാസവും പ്രകടമാക്കി.
