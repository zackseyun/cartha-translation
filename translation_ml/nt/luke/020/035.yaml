review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the passive force of καταξιωθέντες, the coordinated genitives governed by τυχεῖν, and the contrast between γαμοῦσιν and the passive γαμίζονται. ‘വിവാഹം കഴിപ്പിക്കപ്പെടുക,’ however, is not the most idiomatic Malayalam expression for being given in marriage and can suggest being made to marry.
  naturalness: The sentence is clear and suitably formal. Replacing ‘വിവാഹം കഴിപ്പിക്കപ്പെടുക’ with ‘വിവാഹത്തിനു കൊടുക്കപ്പെടുക’ gives the second verb an established, natural Malayalam form while retaining its passive/social sense. Footnote anchors should be placed with the words they explain.
  terminology: ‘യുഗം,’ ‘മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനം,’ and ‘യോഗ്യരായി കണക്കാക്കപ്പെടുന്നവർ’ are appropriate modern-standard Malayalam biblical terminology. ‘വിവാഹത്തിനു കൊടുക്കപ്പെടുക’ preserves the distinct passive expression without importing an interpretation.
  issues:
  - severity: medium
    issue: The rendering ‘വിവാഹം കഴിപ്പിക്കപ്പെടുക’ is awkward and potentially misleading.
    rationale: In Malayalam it can be understood as being caused or compelled to marry. The Greek γαμίζονται means being given in marriage; ‘വിവാഹത്തിനു കൊടുക്കപ്പെടുക’ expresses that idiom naturally and preserves the passive contrast.
  - severity: low
    issue: The footnote markers are not anchored to their respective referents.
    rationale: Footnote b concerns ‘ആ യുഗം,’ while footnote a concerns ‘യോഗ്യരായി കണക്കാക്കപ്പെടുന്നവർ.’ Moving each marker to the relevant expression improves auditability without altering meaning.
