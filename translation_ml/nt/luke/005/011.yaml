id: LUK.5.11
reference: Luke 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: ml
  text: അവർ വള്ളങ്ങൾ കരയ്ക്കെത്തിച്ചശേഷം എല്ലാം ഉപേക്ഷിച്ച് അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγαγόντες
  choice: കരയ്ക്കെത്തിച്ചശേഷം
  rationale: κατάγω എന്ന ക്രിയയുടെ aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘എത്തിച്ചശേഷം’ ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὰ πλοῖα
  choice: വള്ളങ്ങൾ
  rationale: ഗലീലക്കടലിലെ മത്സ്യബന്ധനസന്ദർഭത്തിൽ πλοῖα എന്നതിന് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പദം ‘വള്ളങ്ങൾ’ ആണ്.
- source_word: ἐπὶ τὴν γῆν
  choice: കരയ്ക്ക്
  rationale: അക്ഷരാർഥത്തിൽ ‘നിലത്തേക്ക്/കരയിലേക്ക്’ എന്നാണ്. ജലത്തിൽനിന്ന് വള്ളങ്ങൾ എത്തിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘കരയ്ക്ക്’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: ἀφέντες
  choice: ഉപേക്ഷിച്ച്
  rationale: ἀφίημι ഇവിടെ പിന്നിൽ വിട്ടുകളയുക എന്ന അർഥത്തിലാണ്. ‘ഉപേക്ഷിച്ച്’ ശിഷ്യത്വവിളിയോടുള്ള നിർണായക പ്രതികരണം പ്രകടമാക്കുന്നു; ഉടമസ്ഥാവകാശത്തെക്കുറിച്ചുള്ള അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: πάντα
  choice: എല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചനം സമഗ്രതയെ സൂചിപ്പിക്കുന്നു. ‘എല്ലാം’ അതിന്റെ വ്യാപ്തി വിശദീകരിച്ച് പരിമിതപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ἠκολούθησαν αὐτῷ
  choice: അവനെ അനുഗമിച്ചു
  rationale: ἀκολουθέω ശാരീരികമായി പിന്നാലെ പോകുന്നതും ശിഷ്യരാകുന്നതുമായ സൂചനകൾ വഹിക്കുന്നു. ‘അനുഗമിച്ചു’ രണ്ടും തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: πάντα സൂചിപ്പിക്കുന്ന പരിത്യാഗത്തിന്റെ വ്യാപ്തി
  choice: എല്ലാം ഉപേക്ഷിച്ച്
  alternative: സകലവും വിട്ടിട്ട്
  rationale: വാക്യം യേശുവിന്റെ വിളിയോടുള്ള സമഗ്രമായ പരിത്യാഗം അവതരിപ്പിക്കുന്നു. ഇത് സ്ഥിരമായ സ്വത്തുത്യാഗമായിരുന്നോ എന്നതുപോലുള്ള കാര്യങ്ങൾ വാക്യം വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനം അവയെ തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പങ്കാളിക്രിയകളുടെ ക്രമം സ്വാഭാവികമായി സൂക്ഷിച്ചിരിക്കുന്നു; അധിക വ്യാഖ്യാനമോ സഭാപാരമ്പര്യവിശേഷമോ ചേർത്തിട്ടില്ല.
