  source_fidelity: 'The Malayalam accurately represents the two aorist participles and the main verb: the boats are brought to shore first, then everything is left, and they follow him. “വള്ളങ്ങൾ” is contextually appropriate for πλοῖα, and “എല്ലാം” retains the comprehensive but unspecified scope of πάντα.'
