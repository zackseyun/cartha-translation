revisions:
- from: 'അതുപോലെതന്നെ ശിമോന്റെ പങ്കാളികളായിരുന്ന സെബെദിയുടെ മക്കൾ യാക്കോബും യോഹന്നാനും വിസ്മയിച്ചു. യേശു ശിമോനോട് പറഞ്ഞു: “ഭയപ്പെടേണ്ട; ഇനിമുതൽ നീ മനുഷ്യരെ ജീവനോടെ പിടിക്കുന്നവനായിരിക്കും.”[a][b]'
  to: 'അതുപോലെതന്നെ, ശിമോന്റെ പങ്കാളികളായിരുന്ന സെബെദിയുടെ മക്കളായ യാക്കോബും യോഹന്നാനും വിസ്മയിച്ചു. യേശു ശിമോനോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ട; ഇനിമുതൽ നീ മനുഷ്യരെ ജീവനോടെ പിടിച്ചുകൊണ്ടിരിക്കും.”[a][b]'
  rationale: The revision improves Malayalam apposition and verbal naturalness while preserving the Greek’s distinctive ζωγρέω imagery (‘catch/take alive’). ‘വിസ്മയിച്ചു’ remains as an explicit Malayalam completion of the ellipsis carried over from Luke 5:9, not as a new event. Footnote a now accurately distinguishes the less explicit alternative from the main text, and its anchor is placed at the relevant expression.
