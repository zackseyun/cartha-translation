id: LUK.5.10
reference: Luke 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: ml
  text: 'അതുപോലെതന്നെ, ശിമോന്റെ പങ്കാളികളായിരുന്ന സെബെദിയുടെ മക്കളായ യാക്കോബും യോഹന്നാനും വിസ്മയിച്ചു. യേശു ശിമോനോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ട; ഇനിമുതൽ നീ മനുഷ്യരെ ജീവനോടെ പിടിച്ചുകൊണ്ടിരിക്കും.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യരെ പിടിച്ചുകൊണ്ടിരിക്കും.” ഗ്രീക്കിലെ പദത്തിന് ‘ജീവനോടെ പിടിക്കുക’ എന്ന പ്രത്യേക അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: മത്തായി 4:19; മർക്കോസ് 1:17 എന്നിവ താരതമ്യം ചെയ്യുക. അവിടെ ‘മനുഷ്യരെ പിടിക്കുന്ന മീൻപിടിത്തക്കാർ’ എന്ന പ്രയോഗമാണ്; ലൂക്കോസ് ഇവിടെ വ്യത്യസ്തമായ പദമാണ് ഉപയോഗിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: അതുപോലെതന്നെ … യാക്കോബും യോഹന്നാനും വിസ്മയിച്ചു
  rationale: മുൻവാക്യത്തിലെ വിസ്മയപ്രതികരണത്തോട് യാക്കോബിനെയും യോഹന്നാനെയും ബന്ധിപ്പിക്കുന്ന താരതമ്യപരവും കൂട്ടിച്ചേർക്കുന്നതുമായ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഉറവിടത്തിൽ സന്ദർഭത്തിൽനിന്ന് പൂർത്തിയാകുന്ന ക്രിയ മലയാളത്തിൽ ആവർത്തിക്കുന്നു.
- source_word: υἱοὺς Ζεβεδαίου
  choice: സെബെദിയുടെ മക്കൾ
  rationale: കുടുംബബന്ധം വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: κοινωνοὶ
  choice: പങ്കാളികൾ
  rationale: ഇവിടത്തെ മീൻപിടിത്തത്തൊഴിൽ പശ്ചാത്തലത്തിൽ വെറും കൂട്ടുകാരെക്കാൾ തൊഴിൽപങ്കാളികളെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: Μὴ φοβοῦ
  choice: ഭയപ്പെടേണ്ട
  rationale: ആശ്വസിപ്പിക്കുന്ന കല്പനയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀπὸ τοῦ νῦν
  choice: ഇനിമുതൽ
  rationale: ശിമോന്റെ ദൗത്യത്തിലെ നിർണായകമായ മാറ്റം സംക്ഷിപ്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ἀνθρώπους
  choice: മനുഷ്യരെ
  rationale: പുരുഷന്മാർക്കു മാത്രമല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഉറവിടപദത്തിന്റെ അർഥപരിധി കൃത്യമായി നൽകുന്നു.
- source_word: ζωγρῶν
  choice: ജീവനോടെ പിടിക്കുന്നവനായിരിക്കും
  rationale: ζωγρέω എന്ന പദത്തിലെ ‘ജീവനോടെ പിടിക്കുക’ എന്ന പ്രത്യേക അർഥം നിലനിർത്തുകയും ലൂക്കോസിന്റെ രൂപകത്തെ സമാന്തരവാക്യങ്ങളിലെ ‘മനുഷ്യരെ പിടിക്കുന്ന മീൻപിടിത്തക്കാർ’ എന്ന പ്രയോഗവുമായി ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശു ശിമോനോടു പറയുന്ന ζωγρέω എന്ന രൂപകത്തിന്റെ വിവർത്തനം
  choice: നീ മനുഷ്യരെ ജീവനോടെ പിടിക്കുന്നവനായിരിക്കും
  alternative: നീ മനുഷ്യരെ പിടിക്കും; നീ മനുഷ്യരെ പിടിക്കുന്ന മീൻപിടിത്തക്കാരനായിരിക്കും
  rationale: ലൂക്കോസിന്റെ പദപ്രയോഗം മത്തായി 4:19, മർക്കോസ് 1:17 എന്നിവയിലേതിൽനിന്ന് വ്യത്യസ്തമാണ്. ‘ജീവനോടെ പിടിക്കുക’ എന്ന അർഥഘടകം നിലനിർത്തുന്നത് ആ വ്യത്യാസവും രൂപകത്തിലെ ജീവൻ സംരക്ഷിക്കുന്ന സൂചനയും കാത്തുസൂക്ഷിക്കുന്നു; അതിനെ ഒരു പ്രത്യേക രക്ഷാശാസ്ത്ര വിശദീകരണമായി വികസിപ്പിക്കുന്നില്ല.
- issue: ἀνθρώπους എന്ന പദത്തിന്റെ ലിംഗപരമായ വ്യാപ്തി
  choice: മനുഷ്യരെ
  alternative: പുരുഷന്മാരെ; ആളുകളെ
  rationale: സന്ദർഭത്തിൽ എല്ലാ മനുഷ്യരെയും പൊതുവായി ഉദ്ദേശിക്കുന്നതിനാൽ വ്യാകരണലിംഗം ആശയലിംഗമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യവുമായി വ്യാകരണപരമായി ബന്ധപ്പെട്ടിരിക്കുന്നതിനാൽ അവിടെനിന്ന് മനസ്സിലാകുന്ന ‘വിസ്മയിച്ചു’ എന്ന ക്രിയ മലയാളത്തിൽ വ്യക്തമാക്കി. ‘ജീവനോടെ പിടിക്കുക’ എന്ന അസാധാരണമായെങ്കിലും ഉറവിടസവിശേഷമായ രൂപകം മനഃപൂർവം നിലനിർത്തി; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
