id: LUK.5.33
reference: Luke 5:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: ml
  text: 'അവർ അദ്ദേഹത്തോട് പറഞ്ഞു: “യോഹന്നാന്റെ ശിഷ്യന്മാർ കൂടെക്കൂടെ ഉപവസിക്കുകയും പ്രാർഥനകൾ അർപ്പിക്കുകയും ചെയ്യുന്നു; അതുപോലെതന്നെ പരീശന്മാരുടേവരും[a]. എന്നാൽ അങ്ങയുടേവർ[b] തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരീശന്മാരുടെ ശിഷ്യന്മാരും.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “പരീശന്മാരുടേവർ” എന്നാണ്; മുൻഘടകത്തിൽനിന്ന് “ശിഷ്യന്മാർ” എന്നു മനസ്സിലാക്കണം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അങ്ങയുടെ ശിഷ്യന്മാരോ.” ഗ്രീക്കിൽ “അങ്ങയുടേവർ” എന്നു മാത്രമാണ്; സന്ദർഭത്തിൽനിന്ന് “ശിഷ്യന്മാർ” എന്നു മനസ്സിലാക്കണം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: അവർ അദ്ദേഹത്തോട് പറഞ്ഞു
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേക വൈരുധ്യം അനാവശ്യമായി ഊന്നാതെ സ്വാഭാവികമായ തുടർച്ച നൽകുന്നു.
- source_word: μαθηταὶ Ἰωάννου
  choice: യോഹന്നാന്റെ ശിഷ്യന്മാർ
  rationale: ബന്ധസൂചകമായ ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിയെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാള ഉടമസ്ഥരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: νηστεύουσιν πυκνά
  choice: കൂടെക്കൂടെ ഉപവസിക്കുന്നു
  rationale: പതിവായി ആവർത്തിക്കുന്ന പ്രവൃത്തിയെന്ന πυκνάയുടെ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δεήσεις ποιοῦνται
  choice: പ്രാർഥനകൾ അർപ്പിക്കുന്നു
  rationale: ലളിതമായ ‘പ്രാർഥിക്കുന്നു’ എന്നതിനേക്കാൾ നാമപദപ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ ഭക്തിപരമായ പ്രയോഗം നൽകുകയും ചെയ്യുന്നു.
- source_word: ὁμοίως καὶ
  choice: അതുപോലെ
  rationale: താരതമ്യവും കൂട്ടിച്ചേർക്കലും സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: οἱ τῶν Φαρισαίων
  choice: പരീശന്മാരുടെവരും
  rationale: മുൻവാക്യത്തിലെ ‘ശിഷ്യന്മാർ’ എന്ന പദം മനസ്സിലാക്കേണ്ട ഗ്രീക്ക് ലോപഘടന മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: οἱ δὲ σοὶ
  choice: എന്നാൽ അങ്ങയുടെവർ
  rationale: σοίയിൽ സന്ദർഭംകൊണ്ട് മനസ്സിലാകുന്ന ‘ശിഷ്യന്മാർ’ എന്ന പദം ചേർക്കാതെ ഗ്രീക്കിലെ സംക്ഷിപ്ത വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്നു
  rationale: ഉപവാസത്തോടു വിരുദ്ധമായ പതിവുചര്യയെ വർത്തമാനകാലത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: രണ്ടാമത്തെയും മൂന്നാമത്തെയും ഘടകങ്ങളിൽ ‘ശിഷ്യന്മാർ’ എന്നു വ്യക്തമായി ചേർക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘പരീശന്മാരുടെവരും’, ‘അങ്ങയുടെവർ’ എന്നിങ്ങനെ ഗ്രീക്കിലെ ലോപം നിലനിർത്തി
  alternative: ‘പരീശന്മാരുടെ ശിഷ്യന്മാരും’, ‘അങ്ങയുടെ ശിഷ്യന്മാരോ’ എന്ന് പൂർണമായി വ്യക്തമാക്കുക
  rationale: ഇത് ഉപദേശപരമായ തർക്കവിഷയമല്ല; എങ്കിലും മൂലപാഠത്തിന്റെ വാക്യഘടനയും സംക്ഷിപ്തതയും സംരക്ഷിക്കുമ്പോൾ അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യേശുവിനെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലഗ്രീക്കിലെ ലോപഘടന വായനാസൗകര്യം നഷ്ടപ്പെടാതെ സൂക്ഷിച്ചു; ബദൽ വ്യക്തീകരണങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
