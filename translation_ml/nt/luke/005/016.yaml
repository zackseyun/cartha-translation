  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ἦν ὑποχωρῶν ἐν ταῖς ἐρήμοις καὶ προσευχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/016.yaml
  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: ml
  text: എന്നാൽ അദ്ദേഹം വിജനസ്ഥലങ്ങളിൽ പിൻവാങ്ങി പ്രാർഥിക്കാറുണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അദ്ദേഹംതന്നെ വിജനസ്ഥലങ്ങളിൽ പിൻവാങ്ങിക്കൊണ്ടും പ്രാർഥിച്ചുകൊണ്ടും ഇരിക്കുകയായിരുന്നു.’ ഗ്രീക്കിൽ അപൂർണഭൂതകാല ക്രിയയോടുകൂടിയ വർത്തമാനകാല കൃദന്തങ്ങളാണ് കൂടുതൽ അക്ഷരാർഥത്തിൽ ഉള്ളത്; ഈ ഘടന തുടർച്ചയായതോ പതിവായി ആവർത്തിക്കുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: ഗ്രീക്ക് വ്യാകരണഘടനയുടെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപവും അതിലെ തുടരുന്നതോ പതിവായതോ ആയ കാലസ്വഭാവവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: αὐτὸς
  choice: അദ്ദേഹം
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം വ്യക്തമായി നൽകിയിട്ടുണ്ടെങ്കിലും ഊന്നൽ മൃദുവാണ്. ആദരപൂർവവും സ്വാഭാവികവുമായ മലയാളത്തിൽ ‘അദ്ദേഹം’ അത് മതിയായവിധം സൂചിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ വർധിച്ചുവരുന്ന പ്രസിദ്ധിയോട് മൃദുവായ വൈരുധ്യം കാണിക്കുന്നതിനാൽ ‘എന്നാൽ’ യോജിക്കുന്നു.
- source_word: ἦν ὑποχωρῶν
  choice: മാറിനിന്ന് ... ചെയ്യാറുണ്ടായിരുന്നു
  rationale: ἦν എന്ന അപൂർണഭൂതകാല ക്രിയയും വർത്തമാനകാല കൃദന്തവും ചേർന്ന ഘടന തുടർച്ചയായതോ പതിവായതോ ആയ മുൻകാല പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ചെയ്യാറുണ്ടായിരുന്നു’ പതിവിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ταῖς ἐρήμοις
  choice: വിജനസ്ഥലങ്ങളിലേക്കു
  rationale: ബഹുവചനത്തിലുള്ള ἐρήμοις ജനവാസമില്ലാത്ത ഏകാന്ത പ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘വിജനസ്ഥലങ്ങൾ’ പ്രത്യേകമായ മരുഭൂമിഭൂപ്രകൃതി അനാവശ്യമായി സൂചിപ്പിക്കാതെ അർഥം നൽകുന്നു. പിന്മാറുന്ന ചലനം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘-ലേക്കു’ ഉപയോഗിച്ചു.
- source_word: καὶ προσευχόμενος
  choice: പ്രാർഥിക്കാറുണ്ടായിരുന്നു
  rationale: കൃദന്തം പിന്മാറിനിൽക്കുന്ന പ്രവൃത്തിയോടു ചേർന്ന പതിവായ പ്രാർഥനയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇതിനെ മുഖ്യക്രിയയോടൊപ്പം പതിവുരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
theological_decisions:
- issue: യേശുവിന്റെ പ്രവൃത്തിയുടെ കാലസ്വഭാവം
  choice: വിജനസ്ഥലങ്ങളിലേക്കു മാറിനിന്ന് പ്രാർഥിക്കുന്നത് അദ്ദേഹത്തിന്റെ പതിവായിരുന്നുവെന്ന് അവതരിപ്പിച്ചു.
  alternative: ഒരു പ്രത്യേക അവസരത്തിൽ അദ്ദേഹം മാറിനിന്ന് പ്രാർഥിച്ചു എന്ന വായന.
  rationale: ἦν + വർത്തമാനകാല കൃദന്തങ്ങൾ എന്ന ഗ്രീക്ക് അപൂർണഭൂതകാല ഘടന ആവർത്തിച്ചോ പതിവായോ നടന്ന പ്രവൃത്തിയെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ഇതിലപ്പുറം ദൈവശാസ്ത്രപരമായ നിഗമനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘മരുഭൂമി’ ഒഴിവാക്കി ബഹുവചനമായ ജനവാസമില്ലാത്ത ഇടങ്ങളുടെ അർഥത്തിന് ‘വിജനസ്ഥലങ്ങൾ’ സ്വീകരിച്ചു; പതിവായ പ്രവൃത്തി ‘ചെയ്യാറുണ്ടായിരുന്നു’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കി.
