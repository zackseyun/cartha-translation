  verdict: revise
  source_fidelity: The habitual past sense of ἦν with the present participles is conveyed well by “പ്രാർഥിക്കാറുണ്ടായിരുന്നു.” However, “വിജനസ്ഥലങ്ങളിലേക്കു” changes ἐν ταῖς ἐρήμοις (“in deserted/solitary places”) into a directional phrase (“to deserted places”). Malayalam can retain the source location naturally with “വിജനസ്ഥലങ്ങളിൽ.”
  naturalness: “എന്നാൽ അദ്ദേഹം വിജനസ്ഥലങ്ങളിൽ പിൻവാങ്ങി പ്രാർഥിക്കാറുണ്ടായിരുന്നു” is natural modern standard Malayalam and clearly expresses a recurring practice. “പിൻവാങ്ങി” is a fitting rendering of ὑποχωρῶν in this context.
  terminology: “വിജനസ്ഥലങ്ങൾ” appropriately represents the plural ἐρήμοις without unnecessarily specifying a desert biome. “പ്രാർഥിക്കുക” is suitable standard Christian Malayalam. The footnote should likewise preserve the locative sense.
