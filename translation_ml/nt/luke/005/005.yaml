  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: ml
  text: 'ശിമോൻ മറുപടി പറഞ്ഞു: “ഗുരുവേ, ഞങ്ങൾ രാത്രി മുഴുവൻ കഠിനമായി അധ്വാനിച്ചു, ഒന്നും പിടിച്ചില്ല; എന്നാൽ അങ്ങയുടെ വാക്കുപ്രകാരം[a] ഞാൻ വലകൾ ഇറക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അങ്ങയുടെ വാക്കിനാൽ” അല്ലെങ്കിൽ “അങ്ങയുടെ വാക്കിന്റെ അടിസ്ഥാനത്തിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ഏക ക്രിയാപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: Ἐπιστάτα
  choice: ഗുരുവേ
  rationale: ലൂക്കോസിൽ യേശുവിന്റെ അധികാരം അംഗീകരിച്ചുള്ള സംബോധനയാണിത്; κύριος എന്ന പദത്തിന്റെ പൂർണ ദൈവശാസ്ത്രഭാരം ചേർക്കാതെ, ആ സാഹചര്യത്തിലെ ആദരവും അധികാരവും ‘ഗുരുവേ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δι’ ὅλης νυκτός
  choice: രാത്രി മുഴുവൻ
  rationale: രാത്രിയുടെ മുഴുവൻ ദൈർഘ്യവും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: κοπιάσαντες
  choice: കഠിനമായി അധ്വാനിച്ചിട്ടും
  rationale: കഠിനപരിശ്രമം എന്ന ഊന്നൽ നിലനിർത്തുന്നു; തുടർന്നുള്ള ഫലശൂന്യതയുമായുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘-ിട്ടും’ ഉപയോഗിച്ചു.
- source_word: οὐδὲν ἐλάβομεν
  choice: ഒന്നും പിടിച്ചില്ല
  rationale: മത്സ്യബന്ധനസന്ദർഭത്തിൽ λαμβάνω എന്നത് പിടിക്കുക എന്നാണ് സ്വാഭാവികമായി അർഥമാകുന്നത്; വസ്തുവിനെ അനാവശ്യമായി വ്യക്തമാക്കാതെ മൂലത്തിന്റെ ചുരുക്കം നിലനിർത്തുന്നു.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: എങ്കിലും അങ്ങയുടെ വാക്കിന്റെ അടിസ്ഥാനത്തിൽ
  rationale: പ്രവർത്തനത്തിന്റെ അടിസ്ഥാനമോ കാരണമോ സൂചിപ്പിക്കുന്ന ἐπί + ദത്തിവിന്റെ അർഥം വ്യക്തമാക്കുകയും ‘അങ്ങയുടെ’ വഴി ആദരസൂചക സംബോധന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: χαλάσω
  choice: ഞാൻ ... ഇറക്കാം
  rationale: വല വെള്ളത്തിലേക്ക് താഴ്ത്തുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു; സന്ദർഭത്തിൽ തീരുമാനത്തോടെയുള്ള സന്നദ്ധതയും അറിയിക്കുന്നു.
- source_word: τὰ δίκτυα
  choice: വലകൾ
  rationale: SBLGNTയിലെ ബഹുവചനം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ἐπιστάτα എന്ന യേശുസംബോധനയുടെ പരിഭാഷ
  choice: ഗുരുവേ
  alternative: കർത്താവേ
  rationale: മൂലപദം κύριος അല്ല, ἐπιστάτης ആണ്. അതിനാൽ ഈ ഘട്ടത്തിലെ കഥാവികാസത്തിൽ യേശുവിന്റെ അംഗീകൃത അധികാരം പ്രകടിപ്പിക്കുമ്പോഴും ‘കർത്താവ്’ എന്ന പദത്തോടു പതിവായി ബന്ധപ്പെടുന്ന കൂടുതൽ പൂർണമായ ക്രിസ്തുശാസ്ത്രഭാരം ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ἐπὶ τῷ ῥήματί σου എന്നതിലെ പ്രവർത്തനത്തിന്റെ അടിസ്ഥാനം
  choice: അങ്ങയുടെ വാക്കിന്റെ അടിസ്ഥാനത്തിൽ
  alternative: അങ്ങയുടെ വാക്കിനാൽ / അങ്ങയുടെ വാക്കുപ്രകാരം
  rationale: നിർദേശം അനുസരിക്കുന്നു എന്ന ആശയത്തോടൊപ്പം, യേശുവിന്റെ വാക്കാണ് പ്രവർത്തനത്തിന്റെ അടിസ്ഥാനമെന്ന ഗ്രീക്ക് നിർമ്മിതിയിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അങ്ങയുടെ’ എന്ന ആദരസൂചക രൂപം സംബോധനയുടെ ഗൗരവം നിലനിർത്തുന്നു. മത്സ്യബന്ധനസന്ദർഭത്തിലെ കഠിനപരിശ്രമവും, ഫലശൂന്യതയ്ക്കു ശേഷവും യേശുവിന്റെ വാക്കിനെ ആശ്രയിച്ചുള്ള ശിമോന്റെ സന്നദ്ധതയും വ്യക്തമായി സൂക്ഷിച്ചിട്ടുണ്ട്.
