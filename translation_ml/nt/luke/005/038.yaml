id: LUK.5.38
reference: Luke 5:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινοὺς ⸀βλητέον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/038.yaml
  text: But new wine must be put into fresh wineskins[a].
translation:
  language: ml
  text: എന്നാൽ പുതിയ വീഞ്ഞ് പുത്തൻ തോൽക്കുടങ്ങളിൽ ഒഴിക്കണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുതിയ വീഞ്ഞ് പുതിയ തോൽക്കുടങ്ങളിൽ ഒഴിക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ വീഞ്ഞിന്റെ പുതുമയ്ക്ക് νέος (പ്രത്യേകിച്ച് കാലപരമായി ‘പുതിയത്’) എന്നും തോൽക്കുടങ്ങളുടെ പുതുമയ്ക്ക് καινός (പ്രത്യേകിച്ച് ഗുണത്തിലോ അവസ്ഥയിലോ ‘പുതിയത്/പുത്തൻ’) എന്നും രണ്ടു വ്യത്യസ്ത വിശേഷണങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ അനുചിതമായ പ്രവൃത്തിക്ക് വിരുദ്ധമായി ഇവിടെ ശരിയായ നടപടി അവതരിപ്പിക്കുന്ന പ്രതികൂലബന്ധകമാണ്.
- source_word: οἶνον νέον
  choice: പുതിയ വീഞ്ഞ്
  rationale: νέος ഇവിടെ കാലപരമായ പുതുമയെ സൂചിപ്പിക്കുന്നു; പുതുതായി ഉണ്ടാക്കിയ വീഞ്ഞ് എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς
  choice: -ങ്ങളിൽ
  rationale: പാത്രത്തിന്റെ ഉള്ളിലേക്കുള്ള ദിശ മലയാളത്തിലെ സ്ഥാനവിഭക്തിയും ‘ഒഴിക്കുക’ എന്ന ക്രിയയും ചേർന്ന് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἀσκοὺς
  choice: തോൽക്കുടങ്ങൾ
  rationale: വീഞ്ഞുപോലുള്ള ദ്രാവകങ്ങൾ സൂക്ഷിക്കാൻ മൃഗത്തോൽകൊണ്ട് ഉണ്ടാക്കിയിരുന്ന പാത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക വായനക്കാർക്ക് വസ്തു വ്യക്തമാകുന്ന പദം.
- source_word: καινοὺς
  choice: പുത്തൻ
  rationale: καινός സൂചിപ്പിക്കുന്ന പുതിയതും ഉപയോഗിക്കപ്പെടാത്തതുമായ നല്ല അവസ്ഥയെ എടുത്തുകാട്ടാനും, വീഞ്ഞിനായി ഉപയോഗിച്ച ‘പുതിയ’ എന്ന പദത്തിൽനിന്നുള്ള ഗ്രീക്ക് വ്യത്യാസം ഭാഗികമായി നിലനിർത്താനും ‘പുത്തൻ’ ഉപയോഗിച്ചു.
- source_word: βλητέον
  choice: ഒഴിക്കണം
  rationale: ഈ ക്രിയാവിശേഷണം ആവശ്യകതയെയോ ചെയ്യേണ്ട കാര്യത്തെയോ സൂചിപ്പിക്കുന്നു. ദ്രാവകം പാത്രത്തിലാക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നത് ‘ഒഴിക്കണം’ എന്നാണ്.
theological_decisions:
- issue: νέος, καινός എന്നീ രണ്ടു ‘പുതുമ’ പദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം
  choice: νέος എന്നതിന് ‘പുതിയ’, καινός എന്നതിന് ‘പുത്തൻ’
  alternative: രണ്ടിനും ‘പുതിയ’ എന്നു നൽകുക
  rationale: മൂലഭാഷ ഒരേ വാക്യത്തിൽ രണ്ടു വ്യത്യസ്ത വിശേഷണങ്ങൾ ഉപയോഗിക്കുന്നു. അവയ്ക്കിടയിലെ കാലപരമായ പുതുമയും അവസ്ഥാപരമായ പുതുമയും തമ്മിലുള്ള സൂക്ഷ്മ വ്യത്യാസം അമിതമായി വ്യാഖ്യാനിക്കാതെ മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പരമ്പരാഗതമായ ‘തുരുത്തി’ എന്നതിനെക്കാൾ വസ്തു ഉടൻ മനസ്സിലാകാൻ ‘തോൽക്കുടം’ തിരഞ്ഞെടുത്തു; മൂലത്തിലെ രണ്ടു പുതുമപദങ്ങളുടെ വ്യത്യാസം ‘പുതിയ/പുത്തൻ’ എന്ന ജോടിയിലൂടെ സൂചിപ്പിച്ചു.
