source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: ml
  text: പുതിയ വീഞ്ഞ് ആരും പഴയ തോൽക്കുടങ്ങളിൽ[a] ഒഴിച്ചുവെക്കാറില്ല. അങ്ങനെ ചെയ്താൽ, പുതിയ വീഞ്ഞ് തോൽക്കുടങ്ങൾ പൊട്ടിക്കും; പുതിയ വീഞ്ഞുതന്നെ ചൊരിഞ്ഞുപോകുകയും[b] തോൽക്കുടങ്ങൾ നശിച്ചുപോകുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘പഴയ തോൽപ്പാത്രങ്ങളിൽ.’ വീഞ്ഞുപോലുള്ള ദ്രാവകങ്ങൾ സൂക്ഷിക്കാൻ ഉപയോഗിച്ചിരുന്ന മൃഗത്തോൽകൊണ്ടുള്ള പാത്രങ്ങളെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഒഴുകിപ്പോകുകയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: ഒഴിച്ചുവെക്കാറില്ല
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ഇടുക’ എന്നാണെങ്കിലും, വീഞ്ഞ് ഒരു പാത്രത്തിലാക്കുന്ന പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ ‘ഒഴിച്ചുവെക്കുക’ എന്നു പറയാം; ദ്രാവകസന്ദർഭം വ്യക്തമാക്കുമ്പോഴും പ്രവൃത്തിയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: οἶνον νέον
  choice: പുതിയ വീഞ്ഞ്
  rationale: കൃഷി-പുളിപ്പിക്കൽ പശ്ചാത്തലത്തിന് യോജിക്കുന്ന പതിവും വ്യക്തവുമായ വിവർത്തനം.
- source_word: ἀσκοὺς παλαιούς
  choice: പഴയ തോൽക്കുടങ്ങൾ
  rationale: ἀσκός മൃഗത്തോൽകൊണ്ടുണ്ടാക്കിയ ദ്രാവകപാത്രമാണ്; ‘തോൽക്കുടം’ മലയാളത്തിൽ വസ്തുവും ഉപയോഗവും സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰ δὲ μήγε
  choice: അങ്ങനെ ചെയ്താൽ
  rationale: മുൻപ് നിഷേധിച്ച പ്രവൃത്തി ചെയ്താലുണ്ടാകുന്ന ഫലം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് സോപാധികപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ῥήξει
  choice: പൊട്ടിക്കും
  rationale: പുതിയ വീഞ്ഞിന്റെ പ്രവർത്തനത്താൽ തോൽപ്പാത്രങ്ങൾ പിളരുന്നതിനെ കാരണാർഥത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκχυθήσεται
  choice: ചൊരിഞ്ഞുപോകും
  rationale: പൊട്ടിയ പാത്രത്തിൽനിന്ന് വീഞ്ഞ് അനിയന്ത്രിതമായി പുറത്തുപോയി നഷ്ടമാകുന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀπολοῦνται
  choice: നശിച്ചുപോകും
  rationale: പാത്രങ്ങൾ ഉപയോഗശൂന്യമാകുന്നതുൾപ്പെടുന്ന വിശാലമായ നാശാർഥം നിലനിർത്തുന്നു; പൂർണമായ ഇല്ലായ്മ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: καὶ αὐτός
  choice: വീഞ്ഞ്
  rationale: ഗ്രീക്കിലെ ഊന്നലുള്ള സർവനാമത്തിന്റെ സൂചിതപദം മലയാളത്തിൽ ആവർത്തിക്കുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കി ഫലം വ്യക്തമായി പറയുന്നു.
- source_word: οὐδεὶς
  choice: ആരും … ഇല്ല
  rationale: സാർവത്രിക നിഷേധം മലയാളത്തിന്റെ സ്വാഭാവിക നിഷേധഘടനയിൽ അവതരിപ്പിക്കുന്നു.
