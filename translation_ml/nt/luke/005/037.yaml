translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പഴഞ്ചൊല്ലുസദൃശ ശൈലി. ‘തോൽക്കുടം’ സാധാരണ വായനക്കാരന് ചരിത്രപരമായ പാത്രം മനസ്സിലാക്കാൻ സഹായിക്കുന്നു. പ്രധാനവാക്യത്തിലെ എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
