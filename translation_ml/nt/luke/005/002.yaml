id: LUK.5.2
reference: Luke 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: ml
  text: അവൻ തടാകത്തിനരികെ രണ്ടു വള്ളങ്ങൾ കിടക്കുന്നത് കണ്ടു. എന്നാൽ മീൻപിടിത്തക്കാർ അവയിൽനിന്ന് ഇറങ്ങി[a], വലകൾ കഴുകിക്കൊണ്ടിരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയിൽനിന്ന് കരയ്ക്കിറങ്ങി.’
    reason: ἀποβάντες എന്നതിന് സന്ദർഭാനുസൃതമായി ‘കരയ്ക്കിറങ്ങി’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ‘കര’ എന്ന പദം ഗ്രീക്കിൽ നേരിട്ട് ഇല്ല.
lexical_decisions:
- source_word: εἶδεν
  choice: കണ്ടു
  rationale: ആഖ്യാനത്തിലെ ὁράω എന്ന ക്രിയയുടെ ഏറിസ്റ്റ് രൂപത്തിന് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാള പരിഭാഷ.
- source_word: δύο πλοῖα
  choice: രണ്ടു വള്ളങ്ങൾ
  rationale: തടാകത്തിലെ മീൻപിടിത്തസന്ദർഭത്തിൽ πλοῖον എന്നതിന് ‘കപ്പൽ’ എന്നതിനെക്കാൾ ‘വള്ളം’ ആണ് സ്വാഭാവികം.
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: തടാകത്തിനരികെ ... കിടക്കുന്നതു
  rationale: ἑστῶτα വള്ളങ്ങൾ ഒരിടത്ത് നിശ്ചലമായി ഉണ്ടായിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. വള്ളങ്ങളെക്കുറിച്ച് ‘കിടക്കുക’ എന്നത് സ്വാഭാവിക മലയാളമാണ്; ‘നങ്കൂരമിട്ടിരിക്കുക’ എന്നു പറഞ്ഞാൽ മൂലപാഠത്തിലില്ലാത്ത പ്രത്യേകത ചേർക്കും.
- source_word: οἱ δὲ ἁλιεῖς
  choice: എന്നാൽ മീൻപിടിത്തക്കാർ
  rationale: δέ വള്ളങ്ങളുടെ അവസ്ഥയിൽനിന്ന് മീൻപിടിത്തക്കാരുടെ പ്രവൃത്തിയിലേക്കുള്ള നേരിയ വൈരുധ്യവും ദൃശ്യപരിവർത്തനവും സൂചിപ്പിക്കുന്നു.
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: അവയിൽനിന്ന് ഇറങ്ങി
  rationale: ഏറിസ്റ്റ് കൃദന്തരൂപം പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘അവയിൽനിന്ന്’ എന്നത് വള്ളങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ലളിതമായ ഈ പ്രയോഗം ഗ്രീക്കിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔπλυνον τὰ δίκτυα
  choice: വലകൾ കഴുകിക്കൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് രൂപം ദൃശ്യത്തിൽ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘വലകൾ’ എന്നതിൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമം ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വള്ളങ്ങൾ കിടക്കുന്നു’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഉപയോഗിച്ചു; തുടർച്ചയായ പ്രവൃത്തിയെ ‘കഴുകിക്കൊണ്ടിരിക്കുകയായിരുന്നു’ എന്നു വ്യക്തമാക്കി.
