source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: ml
  text: ജനക്കൂട്ടം അവനെ തിക്കിക്കൊണ്ട് ദൈവത്തിന്റെ വചനം ശ്രദ്ധിച്ചു കേൾക്കുമ്പോൾ, അവൻ ഗന്നേസരത്ത് തടാകത്തിന്റെ കരയിൽ നിൽക്കുകയായിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജനക്കൂട്ടം അവനെ തിക്കിക്കൊണ്ട് ദൈവത്തിന്റെ വചനം കേൾക്കുമ്പോൾ, അവൻ ഗന്നേസരത്ത് തടാകത്തിന്റെ കരയിൽ നിൽക്കുകയായിരുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: ഗന്നേസരത്ത് തടാകം ഗലീലക്കടൽ എന്നും അറിയപ്പെടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: —പ്പോൾ
  rationale: ലൂക്കോസിന്റെ സംഭവാവതരണ സൂത്രത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യത്തിലൂടെ പ്രകടിപ്പിക്കുന്നു; δέ-യ്ക്ക് ഇവിടെ പ്രത്യേകമായ ‘ഇപ്പോൾ’ എന്ന കാലാർഥം ചേർക്കുന്നില്ല.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: തിക്കിക്കയറുകയും ... ശ്രദ്ധിച്ചു കേൾക്കുകയും ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐν τῷ സഹിതമുള്ള രണ്ടു വർത്തമാനകാല infinitive-കളുടെ സമകാലികവും തുടരുന്നതുമായ പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: അവന്റെമേൽ തിക്കിക്കയറുക
  rationale: ജനക്കൂട്ടം യേശുവിന്മേൽ ശാരീരികമായി സമ്മർദം ചെലുത്തി അടുത്തുവരുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀκούειν
  choice: ശ്രദ്ധിച്ചു കേൾക്കുക
  rationale: സന്ദേശത്തോടുള്ള ഉദ്ദേശപൂർവമായ ശ്രവണത്തെ വ്യക്തമാക്കുന്നു; വെറും ശബ്ദം കേൾക്കുക എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: പ്രഖ്യാപിക്കപ്പെടുന്ന ദൈവിക സന്ദേശവും പദപ്രയോഗത്തിന്റെ വിശാലമായ വേദപുസ്തക പ്രതിധ്വനിയും നിലനിർത്തുന്ന പരിചിതമായ രൂപം.
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: അവൻ ... നിൽക്കുകയായിരുന്നു
  rationale: തുടർന്നുകൊണ്ടിരുന്ന നിലപാട് സൂചിപ്പിക്കുന്ന periphrastic നിർമ്മിതി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; αὐτός-ന് അനാവശ്യമായ ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: παρὰ τὴν λίμνην
  choice: തടാകത്തിന്റെ കരയിൽ
  rationale: തടാകത്തിനരികിലെ സ്ഥാനം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: Γεννησαρέτ
  choice: ഗന്നേസരത്ത്
  rationale: ഗ്രീക്ക് സ്ഥലനാമത്തെ വ്യാഖ്യാനപരമായ മറ്റൊരു പേരാൽ മാറ്റാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: τὸν λόγον τοῦ θεοῦ എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവത്തിന്റെ വചനം
  alternative: ദൈവത്തിന്റെ സന്ദേശം
  rationale: സന്ദർഭത്തിൽ പ്രഖ്യാപിത സന്ദേശം ഉദ്ദേശിക്കാമെങ്കിലും, കൂടുതൽ ഔപചാരികമായ രൂപം പദത്തിന്റെ ദൈവശാസ്ത്രപരവും അന്തർപാഠപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- issue: Γεννησαρέτ എന്ന സ്ഥലനാമത്തിന്റെ കൈകാര്യം
  choice: ഗന്നേസരത്ത്
  alternative: ഗലീലക്കടൽ
  rationale: മൂലപാഠം ഉപയോഗിക്കുന്ന പേരുതന്നെ നിലനിർത്തുന്നു; മറ്റൊരു പരിചിതനാമം പകരംവെച്ച് പാഠത്തെ ഒത്തുചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘തിക്കിക്കയറുക’ ജനക്കൂട്ടത്തിന്റെ ശാരീരിക സമ്മർദം സജീവമായി പ്രകടിപ്പിക്കുന്നു; സ്ഥലനാമം മൂലരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
