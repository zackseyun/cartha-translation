language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “മണവാളൻ അവരോടുകൂടെ ഇരിക്കുമ്പോൾ വിവാഹവിരുന്നിലെ അതിഥികളെ ഉപവസിപ്പിക്കാൻ നിങ്ങൾക്കു കഴിയുമോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിവാഹവിരുന്നിലെ അതിഥികൾ” എന്നതിന്റെ അക്ഷരാർഥം “വിവാഹമുറിയുടെ പുത്രന്മാർ” എന്നാണ്; മണവാളന്റെ കൂട്ടുകാരെയോ വിവാഹാഘോഷത്തിൽ പങ്കെടുക്കുന്ന അതിഥികളെയോ സൂചിപ്പിക്കുന്ന ഒരു ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: നിങ്ങൾക്കു കഴിയുമോ?
  rationale: μή ചേർന്ന സൂചകക്രിയയിലുള്ള ചോദ്യം നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്നു. മലയാളത്തിൽ സന്ദർഭസഹജമായ ഈ ചോദ്യം ആ വാചാടോപശക്തി നിലനിർത്തുന്നു.
- source_word: υἱοὺς τοῦ νυμφῶνος
  choice: വിവാഹവിരുന്നിലെ അതിഥികളെ
  rationale: അക്ഷരാർഥത്തിൽ ‘വിവാഹമുറിയുടെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, വിവാഹാഘോഷത്തിൽ മണവാളനോടൊപ്പമുള്ളവരെ സൂചിപ്പിക്കുന്ന ശൈലിയാണിത്. ആധുനിക മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി പകരാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: νυμφίος
  choice: മണവാളൻ
  rationale: വിവാഹരൂപകം വ്യക്തമായും ഗൗരവത്തോടെയും നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: കൂടെയുള്ളപ്പോൾ
  rationale: മണവാളൻ അവരുടെ സാന്നിധ്യത്തിൽ അവരോടൊപ്പം ഇരിക്കുന്ന കാലത്തെ സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ποιῆσαι νηστεῦσαι
  choice: ഉപവസിപ്പിക്കാൻ
  rationale: ποιέω + infinitive എന്ന കാരണാർത്ഥഘടന, അതിഥികളെ ഉപവസിക്കാൻ ഇടയാക്കുക അല്ലെങ്കിൽ നിർബന്ധിക്കുക എന്ന ആശയം, ഒറ്റ സ്വാഭാവിക മലയാളക്രിയയിൽ സംരക്ഷിക്കുന്നു.
- source_word: νηστεῦσαι
  choice: ഉപവസിപ്പിക്കാൻ
  rationale: മതപരമായ ഉപവാസത്തെ സൂചിപ്പിക്കുന്ന മാനകവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: യേശുവിനെ മണവാളനായി സൂചിപ്പിക്കുന്ന രൂപകം
  choice: ‘മണവാളൻ’ എന്ന രൂപകം വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: യേശു തന്നെയാണ് മണവാളൻ എന്നു വ്യാഖ്യാനപരമായി തുറന്നുപറയുക.
  rationale: മൂലവാക്യം രൂപകത്തിലൂടെ സൂചന നൽകുന്നു; അതിന്റെ ദൈവശാസ്ത്രപ്രാധാന്യം വിവർത്തനം തന്നെ വിശദീകരിക്കുന്നത് അതിവിവർത്തനമാകും.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കാരണാർത്ഥം ‘ഉപവസിപ്പിക്കാൻ’ എന്നതിലൂടെ സംരക്ഷിക്കുകയും, നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുകയും ചെയ്തു.
