id: LUK.5.20
reference: Luke 5:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδὼν τὴν πίστιν αὐτῶν ⸀εἶπεν· Ἄνθρωπε, ἀφέωνταί σοι αἱ ἁμαρτίαι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: ml
  text: 'അവരുടെ വിശ്വാസം[a] കണ്ട് അവൻ പറഞ്ഞു: “മനുഷ്യാ, നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആശ്രയം”; ഗ്രീക്കിൽ “വിശ്വാസം.”
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ പദാനുപദമായി: “നിന്റെ പാപങ്ങൾ നിനക്കു ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു.” ഗ്രീക്കിലെ പൂർണ്ണകാല കർമണിപ്രയോഗം പൂർത്തിയായ പ്രവൃത്തിയുടെ ഫലമായ ഇപ്പോഴത്തെ അവസ്ഥയെ ഊന്നിക്കാട്ടാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: കണ്ട്
  rationale: ഗ്രീക്കിലെ പങ്കാളിക്രിയയുടെ ഘടനയും സംഭവത്തിന്റെ സ്വാഭാവികമായ കാലബന്ധവും അമിതമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: ഇവിടെ പക്ഷവാതരോഗിയും അവനെ കൊണ്ടുവന്നവരും പ്രകടിപ്പിച്ച ആശ്രയപൂർവമായ വിശ്വാസമാണ് സൂചിപ്പിക്കുന്നത്; ‘വിശ്വസ്തത’ എന്ന അർഥമല്ല പ്രധാനമായത്.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: ബഹുവചന സർവനാമം അതേപടി നിലനിർത്തി, അത് രോഗിയെ മാത്രം പ്രതിനിധാനപരമായി സൂചിപ്പിക്കുന്നോ അവനെയും കൂടെയുള്ളവരെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നോ എന്ന് നിർണയിക്കുന്നില്ല.
- source_word: Ἄνθρωπε
  choice: മനുഷ്യാ
  rationale: ലിംഗസൂചനയുള്ള നേരിട്ടുള്ള സംബോധനയെ ഔപചാരികമായോ അധിക സ്നേഹസൂചനയുള്ളതായോ മാറ്റാതെ അടുപ്പമായി പകർന്നു.
- source_word: ἀφέωνταί
  choice: ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണ്ണകാല കർമണിപ്രയോഗം സൂചിപ്പിക്കുന്ന, പൂർത്തിയായ പ്രവൃത്തിയുടെ ഫലമായ ഇപ്പോഴത്തെ അവസ്ഥ മലയാളത്തിൽ വ്യക്തമായി പകർന്നു.
- source_word: ἁμαρτίαι σου
  choice: നിന്റെ പാപങ്ങൾ
  rationale: പാപങ്ങൾ എന്ന നൈതിക-ദൈവശാസ്ത്രപരമായ അർഥവും രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥതയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: σοι
  choice: നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു എന്ന വാക്യഘടനയിൽ അർഥപരമായി ഉൾപ്പെടുത്തി
  rationale: ദാതൃകാരകത്തിന്റെ പ്രയോജനഭാവം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ വ്യക്തമായി ഉൾക്കൊള്ളുന്നതിനാൽ ‘നിനക്കു’ എന്ന് ആവർത്തിക്കുന്നത് മുഖ്യവാക്യത്തിൽ ഒഴിവാക്കി.
theological_decisions:
- issue: ‘അവരുടെ വിശ്വാസം’ എന്നതിന്റെ വ്യാപ്തി
  choice: ബഹുവചന പരാമർശം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തി.
  alternative: ഇത് അവനെ ചുമന്നവരുടെ വിശ്വാസം മാത്രമെന്നോ രോഗിയുടെയും കൂട്ടാളികളുടെയും പങ്കിട്ട വിശ്വാസമെന്നോ വ്യക്തമാക്കാം.
  rationale: ഗ്രീക്ക് പാഠം ആരെല്ലാം ഉൾപ്പെടുന്നു എന്ന് കൃത്യമായി നിർണയിക്കുന്നില്ല; അതിനാൽ ആ കഥാപരവും ദൈവശാസ്ത്രപരവുമായ തുറന്ന നില സംരക്ഷിച്ചു.
- issue: പാപക്ഷമയുടെ പ്രഖ്യാപനത്തിന്റെ കാലബലം
  choice: ‘ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന പൂർണ്ണകാല കർമണിപ്രയോഗം ഉപയോഗിച്ചു.
  alternative: ‘ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നത് അന്നേരത്തെ ഫലപ്രദമായ പ്രഖ്യാപനമെന്നോ ഇതിനകം ലഭിച്ച ക്ഷമയുടെ അറിയിപ്പെന്നോ വിശദീകരിക്കാം.
  rationale: ഗ്രീക്ക് പൂർണ്ണകാല കർമണിപ്രയോഗം ക്ഷമയുടെ നിലവിലുള്ള യാഥാർഥ്യം പ്രസ്താവിക്കുന്നു; അതിന്റെ കൃത്യമായ കാലക്രമ-ദൈവശാസ്ത്ര യന്ത്രണം പാഠം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സ്വാഭാവികവും മാന്യവുമായ മലയാളം. ‘മനുഷ്യാ’ എന്ന സംബോധന സാധാരണ സംഭാഷണത്തിൽ അപൂർവമാണെങ്കിലും, ഗ്രീക്കിലെ നേരിട്ടുള്ള പുരുഷസംബോധനയെ അധിക വ്യാഖ്യാനം കൂടാതെ കൃത്യമായി നിലനിർത്തുന്നു.
