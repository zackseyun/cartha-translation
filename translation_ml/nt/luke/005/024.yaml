  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: ml
  text: 'എന്നാൽ, മനുഷ്യപുത്രന് ഭൂമിയിൽ പാപങ്ങൾ ക്ഷമിക്കാൻ അധികാരമുണ്ടെന്ന് നിങ്ങൾ അറിയേണ്ടതിന്—അവൻ പക്ഷാഘാതം ബാധിച്ച മനുഷ്യനോടു പറഞ്ഞു: “ഞാൻ നിന്നോടു പറയുന്നു: എഴുന്നേറ്റ് നിന്റെ കിടക്ക[a] എടുത്ത് നിന്റെ വീട്ടിലേക്കു പോകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ വിരിപ്പ്.” κλινീδιοൻ എന്ന ഗ്രീക്കുപദം ചെറിയ കിടക്കയെയോ പായപോലുള്ള വിരിപ്പിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: എന്നാൽ ... നിങ്ങൾ അറിയേണ്ടതിന്
  rationale: δέ സൂചിപ്പിക്കുന്ന നേരിയ വൈരുധ്യപരമായ മാറ്റവും ἵναയുടെ ഉദ്ദേശ്യഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണമായ ഈ പദവിയും ദാനീയേൽ 7-നോടുള്ള വേദപുസ്തകപ്രതിധ്വനിയും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐξουσίαν ἔχει
  choice: അധികാരമുണ്ട്
  rationale: വെറും ശക്തിയേക്കാൾ അവകാശപൂർവമായ അധികാരമാണ് ἐξουσία ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: മൂലത്തിലെ സ്ഥാനസൂചനയെ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: ἀφιέναι ἁμαρτίας
  choice: പാപങ്ങൾ ക്ഷമിക്കാൻ
  rationale: ഈ സന്ദർഭത്തിൽ ἀφίημι പാപമോചനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തവും പതിവുമായ മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: τῷ παραλελυμένῳ
  choice: തളർവാതരോഗിയോട്
  rationale: സുബോധമായ ആധുനിക മലയാളത്തിൽ രോഗബാധിതനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: Σοὶ λέγω
  choice: ഞാൻ നിന്നോടു പറയുന്നു
  rationale: Σοί എന്ന മുൻനിറുത്തിയ സർവനാമത്തിന്റെ ഊന്നലും വാക്കിന്റെ ഗൗരവമുള്ള നേരിട്ടുള്ള സ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ἔγειρε
  choice: എഴുന്നേറ്റ്
  rationale: ഉടനടി പ്രവർത്തിക്കാനുള്ള കല്പനയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄρας τὸ κλινίδιόν σου
  choice: നിന്റെ കിടക്ക എടുത്ത്
  rationale: κλινίδιον സൂചിപ്പിക്കുന്ന ചെറിയ കിടക്കയെയോ വിരിപ്പിനെയോ പൊതുവായി ഉൾക്കൊള്ളുന്ന മലയാളപദം; αἴρωയുടെ എടുത്തുകൊണ്ടുപോകുക എന്ന പ്രവർത്തിയും വ്യക്തമാക്കുന്നു.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: നിന്റെ വീട്ടിലേക്കു പോകുക
  rationale: ചലനവും ലക്ഷ്യസ്ഥാനവും ലളിതമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന പദവിയുടെ വിവർത്തനം
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: ക്രിസ്തുശാസ്ത്രപരമായ പദവിയും ദാനീയേൽ 7-ലെ പ്രതിധ്വനിയും അതിന്റെ യഥാർഥ വ്യാഖ്യാനസാധ്യതകളും നിലനിർത്തുന്നു.
- issue: പാപമോചനവുമായി ബന്ധപ്പെട്ട ἐξουσίαയുടെ സൂക്ഷ്മാർഥം
  choice: അധികാരം
  alternative: ശക്തി
  rationale: തർക്കവിഷയം അത്ഭുതം ചെയ്യാനുള്ള കഴിവു മാത്രമല്ല, പാപങ്ങൾ ക്ഷമിക്കാനുള്ള യഥാർഥ അവകാശവും അധികാരവുമാണ്.
- issue: ἐπὶ τῆς γῆς എന്നതിന്റെ പരിധി
  choice: ഭൂമിയിൽ
  alternative: ഭൗമിക മണ്ഡലത്തിൽ
  rationale: ദൈവിക അധികാരം ഭൂമിയിൽ പ്രയോഗിക്കപ്പെടുന്നു എന്ന അവകാശവാദം വ്യാഖ്യാനപരമായി വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധം ഗൗരവമുള്ള നേരിട്ടുള്ള ശൈലി ഉപയോഗിച്ചു. പരമ്പരാഗതവും വേദപുസ്തകപ്രതിധ്വനിയുള്ളതുമായ “മനുഷ്യപുത്രൻ” നിലനിർത്തി; κλινίδιον എന്ന പദത്തിന്റെ വസ്തുസംബന്ധമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
