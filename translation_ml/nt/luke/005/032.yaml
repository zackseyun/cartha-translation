  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: ml
  text: നീതിമാന്മാരെയല്ല, പാപികളെ മാനസാന്തരത്തിലേക്കു വിളിക്കാനാണ് ഞാൻ വന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മാനസാന്തരത്തിനായി.’ εἰς μετάνοιαν എന്ന ഗ്രീക്ക് പ്രയോഗം ഉദ്ദേശ്യമോ ലക്ഷ്യമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐλήλυθα
  choice: ഞാൻ വന്നത് ... അല്ല
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ perfect രൂപം ഇപ്പോഴും പ്രസക്തമായ വരവിനെയും ദൗത്യലക്ഷ്യത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഊന്നൽഘടന വാക്യത്തിലെ നിഷേധവും ലക്ഷ്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καλέσαι
  choice: വിളിക്കാൻ
  rationale: ഇവിടെയുള്ള aorist infinitive വരവിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നു. ‘വിളിക്കുക’ എന്നത് ക്ഷണത്തിന്റെയും ആഹ്വാനത്തിന്റെയും സാധ്യത നിലനിർത്തുന്നു; ‘ക്ഷണിക്കുക’ എന്നതിലേക്കോ ‘ആജ്ഞാപിക്കുക’ എന്നതിലേക്കോ അർഥം ചുരുക്കുന്നില്ല.
- source_word: δικαίους
  choice: നീതിമാന്മാരെ
  rationale: Substantival adjective ആയതിനാൽ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. അവർ യഥാർഥത്തിൽ നീതിമാന്മാരാണോ സ്വയം അങ്ങനെ കരുതുന്നവരാണോ എന്നത് വാക്യത്തിൽ ചേർത്ത് വ്യാഖ്യാനിക്കാതെ മൂലപാഠത്തിലെ വിഭാഗം നിലനിർത്തുന്നു.
- source_word: ἁμαρτωλοὺς
  choice: പാപികളെ
  rationale: പാപികളായി വിശേഷിപ്പിക്കപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്ന സാധാരണ substantive പ്രയോഗം; സുവിശേഷസന്ദർഭത്തിലെ ധാർമ്മികവും സാമൂഹികവുമായ ഭാരം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: εἰς μετάνοιαν
  choice: മാനസാന്തരത്തിലേക്ക്
  rationale: εἰς ലക്ഷ്യമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു. μετάνοια വെറും ബൗദ്ധികമായ ‘മനസ്സുമാറ്റം’ മാത്രമല്ല, ജീവിതദിശയിലെ തിരിഞ്ഞുവരവിനെയും ഉൾക്കൊള്ളുന്നതിനാൽ ആ അർഥവ്യാപ്തി മലയാളത്തിൽ ‘മാനസാന്തരം’ കൂടുതൽ നന്നായി വഹിക്കുന്നു.
theological_decisions:
- issue: ‘നീതിമാന്മാർ’ യഥാർഥ നീതിമാന്മാരെയാണോ, സ്വയം നീതിമാന്മാരെന്ന് കരുതുന്നവരെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ‘നീതിമാന്മാർ’ എന്ന മൂലവിഭാഗം വ്യാഖ്യാനപരമായ വിശേഷണം കൂടാതെ നിലനിർത്തി.
  alternative: ‘തങ്ങൾ നീതിമാന്മാരാണെന്ന് കരുതുന്നവർ’ / ‘നീതിമാന്മാരായി കണക്കാക്കപ്പെടുന്നവർ’
  rationale: ഗ്രീക്ക് വാക്യം വൈരുധ്യത്തെ നേരിട്ട് അവതരിപ്പിക്കുന്നു; പരിഹാസമോ സ്വയംനീതിയോ ഇവിടെ തുറന്നുപറയുന്നില്ല. അതിനാൽ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനം തന്നെ പരിഹരിക്കാതെ സൂക്ഷിച്ചു.
- issue: μετάνοιαയുടെ അർഥം ‘മനസ്സുമാറ്റം’ എന്നതിലേക്കു മാത്രം ചുരുക്കണമോ
  choice: മനോഭാവത്തിലും ജീവിതദിശയിലും വരുന്ന തിരിഞ്ഞുവരവിനെ ഉൾക്കൊള്ളുന്ന ‘മാനസാന്തരം’ ഉപയോഗിച്ചു.
  alternative: മനസ്സുമാറ്റം
  rationale: ‘മനസ്സുമാറ്റം’ ആധുനിക മലയാളത്തിൽ അഭിപ്രായമാറ്റം എന്ന ലഘുവായ അർഥം നൽകാം. ‘മാനസാന്തരം’ μετάνοιαയുടെ നൈതികവും ആത്മീയവുമായ വ്യാപ്തി കൂടുതൽ സ്വാഭാവികമായി വഹിക്കുന്നു; പ്രത്യേക സമുദായത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നീതിമാന്മാർ/പാപികൾ’ എന്ന നേരിട്ടുള്ള വൈരുധ്യം നിലനിർത്തി; ‘മാനസാന്തരം’ സഭാപരിചിതമായ പദമാണെങ്കിലും സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്നതും ‘മനസ്സുമാറ്റം’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ നൈതിക-ജീവിതദിശാപരമായ അർഥം വഹിക്കുന്നതുമാണ്.
