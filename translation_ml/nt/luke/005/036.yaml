id: LUK.5.36
reference: Luke 5:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: ml
  text: 'അവൻ അവരോട് ഒരു ഉപമയും പറഞ്ഞുകൊണ്ടിരുന്നു: “ആരും പുതിയൊരു വസ്ത്രത്തിൽനിന്ന് ഒരു തുണ്ട് കീറിയെടുത്ത് പഴയൊരു വസ്ത്രത്തിന്മേൽ വെക്കുകയില്ല.[a] അങ്ങനെ ചെയ്താൽ, അയാൾ പുതിയ വസ്ത്രവും കീറിക്കളയും; പുതിയതിൽനിന്നുള്ള ആ തുണ്ട് പഴയ വസ്ത്രത്തോടു പൊരുത്തപ്പെടുകയുമില്ല.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മൂലപാഠത്തിന്റെ രൂപം കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘പുതിയൊരു വസ്ത്രത്തിൽനിന്ന് ഒരു തുണ്ട് കീറിയെടുത്ത ശേഷം ആരും അത് പഴയൊരു വസ്ത്രത്തിന്മേൽ വെക്കുകയില്ല.’ ഇവിടെ ‘കീറിയെടുത്ത്’ എന്നത് പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.'
    reason: വാക്യഘടനയിലെ മറ്റൊരു സാധുവായ അവതരണം വ്യക്തമാക്കുന്നു.
  - marker: b
    text: ‘പൊരുത്തപ്പെടുകയില്ല’ എന്നത് ‘ചേരുകയില്ല,’ ‘ഒത്തുപോകുകയില്ല,’ അല്ലെങ്കിൽ ‘അനുയോജ്യമാകുകയില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം തുണ്ടും പഴയ വസ്ത്രവും തമ്മിലുള്ള പൊരുത്തമോ അനുയോജ്യതയോ ഇല്ലായ്മയെ സൂചിപ്പിക്കുന്നു.
    reason: മൂലപദത്തിന്റെ അർഥവ്യാപ്തിയും സാധുവായ പരിഭാഷാവികല്പങ്ങളും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: ഒരു ഉപമയും പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: ἔλεγεν എന്ന അപൂർണഭൂതകാലരൂപത്തിന്റെ തുടർച്ചയായ വിവരണഭാവം ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; καίയുടെ ‘കൂടി/യും’ എന്ന ആശയം ‘ഉപമയും’ എന്നതിൽ നിലനിർത്തുന്നു.
- source_word: παραβολή
  choice: ഉപമ
  rationale: ലൂക്കോസിന്റെ ഈ സാഹിത്യരൂപത്തിന് മലയാളത്തിൽ പരിചിതവും വ്യക്തവുമായ പദമാണ് ‘ഉപമ’.
- source_word: ἐπίβλημα ἀπὸ ἱματίου καινοῦ
  choice: പുതിയൊരു വസ്ത്രത്തിൽനിന്ന് ഒരു തുണ്ട്
  rationale: വസ്ത്രം നന്നാക്കാൻ ഉപയോഗിക്കുന്ന തുണ്ടാണ് ἐπίβλημα; മലയാളത്തിൽ സന്ദർഭം അതിന്റെ ഉപയോഗം വ്യക്തമാക്കുന്നതിനാൽ ‘തുണ്ട്’ സ്വാഭാവികമാണ്.
- source_word: σχίσας ἐπιβάλλει
  choice: കീറിയെടുത്ത് … വെക്കുകയില്ല
  rationale: മുൻകൃത്യത്തെ സൂചിപ്പിക്കുന്ന aorist participle ‘കീറിയെടുത്ത്’ എന്നും പ്രധാനക്രിയയായ ἐπιβάλλει അതിന്റെ അടിസ്ഥാന അർഥമായ ‘മേൽ വെക്കുക’ എന്നും നൽകി; ‘തുന്നുക’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത രീതി ചേർത്തിട്ടില്ല.
- source_word: εἰ δὲ μήγε
  choice: അങ്ങനെ ചെയ്താൽ
  rationale: സങ്കൽപ്പിച്ച പ്രവൃത്തി നടത്തിയാലുണ്ടാകുന്ന ദോഷഫലം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്ന സ്വാഭാവിക വ്യവസ്ഥാപ്രയോഗമാണിത്.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: അയാൾ പുതിയ വസ്ത്രവും കീറിക്കളയും
  rationale: ഭാവികാല സകർമകക്രിയയുടെ അപ്രകടമായ മനുഷ്യകർത്താവിനെ ‘അയാൾ’ എന്നു വ്യക്തമാക്കി; καινόν സൂചിപ്പിക്കുന്ന പുതിയ വസ്ത്രം ആവർത്തിച്ച് ആശയക്കുഴപ്പം ഒഴിവാക്കി.
- source_word: τῷ παλαιῷ οὐ συμφωνήσει
  choice: പഴയതിനോടു ചേരുകയുമില്ല
  rationale: συμφωνέω ഇവിടെ പൊരുത്തം, അനുയോജ്യത, ഒത്തുചേരൽ എന്നിവ സൂചിപ്പിക്കുന്നു; ‘ചേരുക’ ഈ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പാച്ച്’ പോലുള്ള അന്യഭാഷാപദവും, മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘തുന്നുക’ എന്ന പ്രവർത്തിയും ഒഴിവാക്കി. ‘പുതിയ വസ്ത്രം/പഴയ വസ്ത്രം’ എന്ന പ്രത്യക്ഷവിരോധം നിലനിർത്തി.
