language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: ml
  text: 'ശാസ്ത്രിമാരും പരീശന്മാരും ഇങ്ങനെ ചിന്തിച്ചുതുടങ്ങി: “ദൈവദൂഷണങ്ങൾ പറയുന്ന ഇവൻ ആര്? ദൈവത്തിനല്ലാതെ മറ്റാർക്കാണ് പാപങ്ങൾ ക്ഷമിക്കാൻ കഴിയുക?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: ചിന്തിക്കാൻ തുടങ്ങി
  rationale: ἄρχομαι + infinitive എന്ന ഘടനയുടെ ‘തുടങ്ങി’ എന്ന അർഥവും διαλογίζομαι എന്നതിലെ ആലോചന/വിചിന്തന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. λέγοντες തുടർന്ന് വരുന്നതിനാൽ ഇത് വെറും മൗനചിന്തയായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: യഹൂദനിയമത്തിൽ പ്രാവീണ്യമുള്ള അംഗീകൃത പണ്ഡിതരെ സൂചിപ്പിക്കുന്ന സുവിശേഷങ്ങളിലെ പതിവായ മലയാള പദം.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: സംഘനാമത്തിന്റെ മലയാളത്തിലെ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: λαλεῖ βλασφημίας
  choice: ദൈവദൂഷണങ്ങൾ പറയുന്ന
  rationale: βλασφημίας എന്ന ബഹുവചനം ‘ദൈവദൂഷണങ്ങൾ’ എന്നു നിലനിർത്തുകയും λαλεῖ എന്നതിനെ സ്വാഭാവികമായി ‘പറയുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: പാപങ്ങൾ ക്ഷമിക്കാൻ
  rationale: പാപങ്ങളുടെ സന്ദർഭത്തിൽ ἀφίημι എന്നതിന്റെ സ്ഥാപിതവും സ്വാഭാവികവുമായ അർഥം ‘ക്ഷമിക്കുക’ എന്നതാണ്.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: ദൈവത്തിനല്ലാതെ മറ്റാർക്കാണ്
  rationale: ‘ദൈവം മാത്രം’ എന്ന αποκ്ലൂസീവ് അർഥം സ്വാഭാവിക മലയാള ചോദ്യഘടനയിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Τίς ἐστιν οὗτος
  choice: ഇവൻ ആര്?
  rationale: ഗ്രീക്കിൽ ‘മനുഷ്യൻ’ എന്ന പദമില്ല; ‘ഇവൻ ആര്?’ എന്നത് മൂലവാക്യത്തിന്റെ ചുരുക്കവും എതിർപ്പുനിറഞ്ഞ ഭാവവും സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: പാപങ്ങൾ ക്ഷമിക്കാനുള്ള യേശുവിന്റെ അധികാരത്തെക്കുറിച്ചുള്ള സൂചന
  choice: പാപങ്ങൾ ക്ഷമിക്കാൻ ദൈവത്തിനുമാത്രമേ കഴിയൂ എന്ന സംസാരിക്കുന്നവരുടെ അവകാശവാദം നേരിട്ട് നിലനിർത്തി.
  alternative: വാക്യത്തിൽ പറയാത്ത ക്രിസ്തുശാസ്ത്രപരമായ നിഗമനം വ്യക്തമായി ചേർക്കുക, അല്ലെങ്കിൽ ഏകാധികാരവാദത്തിന്റെ ശക്തി കുറച്ച് പരാവർത്തനം ചെയ്യുക.
  rationale: ലൂക്കോസിന്റെ വിവരണത്തിൽ ഈ എതിർപ്പ് സൃഷ്ടിക്കുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ നിലനിൽക്കണം; എന്നാൽ വാക്യം തന്നെ പ്രസ്താവിക്കാത്ത നിഗമനം ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ശാസ്ത്രിമാർ’, ‘പരീശന്മാർ’, ‘ദൈവദൂഷണം’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
