id: LUK.5.25
reference: Luke 5:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: ml
  text: ഉടനെ അവൻ അവരുടെ മുമ്പിൽ എഴുന്നേറ്റു; താൻ കിടന്നിരുന്നതു എടുത്ത് ദൈവത്തെ മഹത്വപ്പെടുത്തിക്കൊണ്ട് തന്റെ വീട്ടിലേക്കു പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: ഉടനെ
  rationale: ഒട്ടും താമസമില്ലാതെ സംഭവിച്ച പ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റു
  rationale: ഗ്രീക്കിലെ ഭൂതകാല കൃദന്തരൂപത്തെ മലയാള ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ക്രമത്തിൽ പൂർണ്ണക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐνώπιον αὐτῶν
  choice: അവരുടെ മുമ്പിൽ
  rationale: സംഭവം കൂടിയിരുന്നവരുടെ സാന്നിധ്യത്തിൽ പരസ്യമായി നടന്നുവെന്ന അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἄρας
  choice: എടുത്തുകൊണ്ട്
  rationale: വസ്തു ഉയർത്തി കൂടെ കൊണ്ടുപോകുന്ന പ്രവൃത്തിയെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: താൻ കിടന്നിരുന്നത്
  rationale: മൂലവാക്യത്തിൽ പായയോ കിടക്കയോ എന്ന നാമം വ്യക്തമാക്കാത്തതിനാൽ അതേ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: തന്റെ വീട്ടിലേക്കു പോയി
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള പുറപ്പെടലിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ആവശ്യമില്ലാത്ത ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: δοξάζων τὸν θεόν
  choice: ദൈവത്തെ മഹത്ത്വപ്പെടുത്തിക്കൊണ്ട്
  rationale: δοξάζω എന്ന പദത്തിലെ ദൈവത്തിന് മഹത്ത്വം നൽകുക എന്ന വിശാലമായ അർഥം സംരക്ഷിക്കുന്നു; വെറും വാക്കാലുള്ള സ്തുതിയായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: അവൻ എടുത്ത വസ്തുവിനെ ‘പായ’ എന്നോ ‘കിടക്ക’ എന്നോ പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: മൂലത്തിലെ ആപേക്ഷിക പ്രയോഗം പിന്തുടർന്ന് ‘താൻ കിടന്നിരുന്നത്’ എന്നു നിലനിർത്തുക.
  alternative: ‘താൻ കിടന്നിരുന്ന പായ’ അല്ലെങ്കിൽ ‘താൻ കിടന്നിരുന്ന കിടക്ക’.
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പ്രത്യേക നാമം ഉപയോഗിക്കുന്നില്ല. അതിനാൽ പ്രധാനപാഠത്തിൽ അധികമായ വ്യക്തത ചേർക്കാതെ, വായനാസഹായമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. കൃദന്തരൂപങ്ങൾ ഉപയോഗിച്ച് പ്രവൃത്തികളുടെ ക്രമവും ഒരേസമയം തുടരുന്ന ദൈവമഹത്ത്വപ്പെടുത്തലും വ്യക്തമാക്കിയിരിക്കുന്നു.
