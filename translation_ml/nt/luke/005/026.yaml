reference: Luke 5:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: ml
  text: എല്ലാവരെയും വിസ്മയം പിടികൂടി; അവർ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തിക്കൊണ്ടിരുന്നു. അവർ ഭയത്താൽ നിറഞ്ഞ്, “ഇന്ന് നാം അസാധാരണമായ കാര്യങ്ങൾ കണ്ടിരിക്കുന്നു[a]” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശ്രദ്ധേയമായ കാര്യങ്ങൾ” അല്ലെങ്കിൽ “പ്രതീക്ഷിക്കാത്ത കാര്യങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം; സാധാരണ പ്രതീക്ഷയ്ക്ക് അതീതമായ കാര്യങ്ങളെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις
  choice: വിസ്മയം
  rationale: ഇവിടെ ഈ പദം ആത്മീയ പരവശതയെയല്ല, അതിശക്തമായ അമ്പരപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വിസ്മയം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἔλαβεν ἅπαντας
  choice: എല്ലാവരെയും പിടികൂടി
  rationale: ‘എല്ലാവരെയും പിടിച്ചു’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സജീവത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐδόξαζον
  choice: മഹത്ത്വപ്പെടുത്തിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തി നിലനിർത്തുന്നു; δοξάζω എന്നതിന്റെ അർഥത്തോടും അടുത്തുനിൽക്കുന്നു.
- source_word: θεόν
  choice: ദൈവത്തെ
  rationale: ഈ സന്ദർഭത്തിലെ θεός എന്ന പദത്തിന്റെ സാധാരണ മലയാള പരിഭാഷ.
- source_word: ἐπλήσθησαν φόβου
  choice: ഭയംകൊണ്ട് നിറഞ്ഞ്
  rationale: φόβος എന്നത് ‘ഭയം’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി, ഭയവും ഭക്തിപൂർവമായ ആദരവും തമ്മിലുള്ള പാഠത്തിലെ സംഘർഷം മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞു
  rationale: ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന പങ്കാളിത്തരൂപം മലയാളത്തിലെ സ്വാഭാവികമായ വാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Εἴδομεν
  choice: നാം ... കണ്ടിരിക്കുന്നു
  rationale: ഇപ്പോൾത്തന്നെ സംഭവിച്ചതിനോടുള്ള പ്രതികരണത്തിന്റെ തത്സമയത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παράδοξα
  choice: അസാധാരണമായ കാര്യങ്ങൾ
  rationale: സാധാരണ പ്രതീക്ഷയ്ക്ക് അതീതമായ കാര്യങ്ങൾ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; പ്രതികൂലഭാവമുള്ള ‘വിചിത്രം’ ഒഴിവാക്കുന്നു.
- source_word: σήμερον
  choice: ഇന്ന്
  rationale: കാലസൂചക ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
theological_decisions:
- issue: ദൈവിക പ്രവൃത്തിയോടുള്ള പ്രതികരണത്തിൽ φόβος എന്ന പദത്തിന്റെ ഭാവം
  choice: ‘ഭയം’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഭക്തിസംഭ്രമം’ അല്ലെങ്കിൽ ‘ഭയഭക്തി’
  rationale: ഈ വാക്യം യേശുവിന്റെ അത്ഭുതകരമായ അധികാരത്തോടുള്ള ഭക്തിപൂർവവും അതേസമയം അസ്വസ്ഥമാക്കുന്നതുമായ പ്രതികരണം ചിത്രീകരിക്കുന്നു. ‘ഭയം’ എന്നത് നിലനിർത്തുന്നത് ഭീതിയും ആരാധനയും തമ്മിലുള്ള വേദപാഠത്തിലെ യഥാർഥ സംഘർഷം വ്യാഖ്യാനിച്ച് ഒതുക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ പുരോഗതി നിലനിർത്തിക്കൊണ്ട് നീണ്ട ഘടന വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചു. തുടർച്ചയായ മഹത്ത്വപ്പെടുത്തൽ അപൂർണ ഭൂതകാലത്തിന്റെ ഭാവത്തോടെ അവതരിപ്പിച്ചു; φόβος എന്നതിലെ ദൈവഭയവും ഞെട്ടലും തമ്മിലുള്ള അർഥവ്യാപ്തി ചുരുക്കിയിട്ടില്ല.
