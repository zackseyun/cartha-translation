source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: ml
  text: 'ഏതാണ് എളുപ്പം: ‘നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നു പറയുന്നതോ[a], അതോ ‘എഴുന്നേറ്റു നടക്കുക’ എന്നു പറയുന്നതോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിട്ടുണ്ട്.” ഗ്രീക്ക് ക്രിയ പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴുള്ള ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: ഏതാണ് എളുപ്പം
  rationale: രണ്ട് പ്രസ്താവനകളെ താരതമ്യം ചെയ്യുന്ന ഗ്രീക്ക് ചോദ്യത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: εἰπεῖν
  choice: എന്നു പറയുന്നതോ
  rationale: രണ്ട് വ്യത്യസ്ത വാക്യങ്ങളുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന infinitive-ന്റെ താരതമ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: Ἀφέωνταί
  choice: ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴുള്ള ഫലാവസ്ഥ സൂചിപ്പിക്കുന്ന perfect passive രൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; പ്രവർത്തകനെ വ്യക്തമാക്കാതെ passive ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: σοι / αἱ ἁμαρτίαι σου
  choice: നിന്റെ പാപങ്ങൾ
  rationale: വ്യക്തിപരമായ അഭിസംബോധനയും ഉടമസ്ഥബന്ധവും മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἢ
  choice: അതോ
  rationale: രണ്ട് ബദലുകളെ വ്യക്തമായി വേർതിരിക്കുന്ന സ്വാഭാവിക മലയാള സംയോജകം.
- source_word: Ἔγειρε
  choice: എഴുന്നേറ്റു
  rationale: ശാരീരികമായി എഴുന്നേൽക്കാനുള്ള കല്പനയെ നിലവാരമുള്ള ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ περιπάτει
  choice: നടക്കുക
  rationale: ഇവിടെ περιπατέω അക്ഷരാർഥത്തിലുള്ള നടക്കലാണ്; കല്പനയുടെ ഗൗരവവും വ്യക്തതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഗ്രീക്ക് perfect passive രൂപത്തിലുള്ള പാപക്ഷമാ പ്രഖ്യാപനം അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു എന്നതിനു പകരം കൂടുതൽ ലളിതമായി ‘നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന ആശയം ‘നിന്റെ പാപങ്ങൾക്ക് ക്ഷമ ലഭിച്ചിരിക്കുന്നു’ എന്നും പറയാം
  rationale: തിരഞ്ഞെടുത്ത രൂപം പൂർത്തിയായ ക്ഷമയുടെ ഇപ്പോഴുള്ള ഫലാവസ്ഥയും passive ഭാവവും സൂക്ഷിക്കുന്നു. ക്ഷമിക്കുന്ന പ്രവർത്തകൻ ആരെന്നത് വാക്യം തുറന്നുവെക്കുന്ന വിധം അതിനെ പരിഭാഷയും തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. താരതമ്യചോദ്യത്തിന്റെ സമാന്തരഘടന സംരക്ഷിച്ചിട്ടുണ്ട്.
