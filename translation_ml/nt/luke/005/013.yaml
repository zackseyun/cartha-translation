  terminology: ‘കുഷ്ഠം’ is the established Gospel rendering for λέπρα, and the anchored note responsibly indicates its broader ancient semantic range. ‘എനിക്ക് മനസ്സുണ്ട്’ suitably expresses Θέλω as willingness.
