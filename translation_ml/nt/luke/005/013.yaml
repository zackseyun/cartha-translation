reference: Luke 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: ml
  text: 'അവൻ കൈ നീട്ടി, അയാളെ തൊട്ട്, പറഞ്ഞു: “എനിക്ക് മനസ്സുണ്ട്; ശുദ്ധനാകുക.” ഉടനെ കുഷ്ഠം[a] അയാളെ വിട്ടുമാറി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ വിശാലമായ അർഥത്തിൽ, ‘ഗുരുതരമായ ഒരു ചർമരോഗം.’ ബൈബിൾ ഉപയോഗത്തിൽ λέπρα എന്ന ഗ്രീക്ക് പദം ഇന്നത്തെ ഹാൻസൻസ് രോഗത്തെ മാത്രമല്ല, പലതരം ഗുരുതര ചർമരോഗങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: കൈ നീട്ടി
  rationale: മുൻപുണ്ടായ ശാരീരിക പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ഭൂതകാല കൃദന്തരൂപത്തിന്റെ ക്രമവും നിലനിർത്തുന്നു.
- source_word: ἥψατο αὐτοῦ
  choice: അയാളെ തൊട്ടുകൊണ്ട്
  rationale: ἅπτομαι എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം ‘തൊടുക’ എന്നാണ്. രോഗിയുമായുള്ള നേരിട്ടുള്ള സമ്പർക്കത്തിന്റെ പ്രാധാന്യം ഈ പ്രയോഗം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: Θέλω
  choice: എനിക്ക് മനസ്സുണ്ട്
  rationale: ഇവിടെ θέλω ഭാവികാലത്തെക്കാൾ സന്നദ്ധതയെയും ഉദ്ദേശ്യത്തെയും സൂചിപ്പിക്കുന്നു. രോഗിയുടെ മുൻചോദ്യത്തോടുള്ള സ്വാഭാവിക മറുപടിയായും ഇത് യോജിക്കുന്നു.
- source_word: καθαρίσθητι
  choice: ശുദ്ധനാകുക
  rationale: രോഗശാന്തി മാത്രമല്ല, ശുദ്ധി വീണ്ടെടുക്കുന്നതിന്റെ ആചാരപരവും സാമൂഹികവുമായ മാനങ്ങളും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: സംഭവത്തിന്റെ തൽക്ഷണസ്വഭാവം ലളിതവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: ἡ λέπρα
  choice: കുഷ്ഠം
  rationale: സുവിശേഷസന്ദർഭങ്ങളിൽ പരിചിതമായ പരമ്പരാഗത പദം; പുരാതന ഗ്രീക്കുപദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: അയാളെ വിട്ടുമാറി
  rationale: രോഗം പൂർണമായും നീങ്ങിപ്പോയെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: കുഷ്ഠരോഗിയോടു പറഞ്ഞ καθαρίσθητι എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ശുദ്ധനാകുക
  alternative: സൗഖ്യം പ്രാപിക്കുക
  rationale: ഗ്രീക്ക് പദം ശാരീരിക രോഗശാന്തിയോടൊപ്പം ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള മോചനവും സാമൂഹിക പുനഃസ്ഥാപനവും ഉൾക്കൊള്ളുന്നു. ‘സൗഖ്യം പ്രാപിക്കുക’ എന്നു മാത്രം പറഞ്ഞാൽ ഈ അർഥതലം നഷ്ടപ്പെടും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘എനിക്ക് മനസ്സുണ്ട്’ സന്നദ്ധതയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘ശുദ്ധനാകുക’ രോഗശാന്തിയുടെയും ശുദ്ധീകരണത്തിന്റെയും ഇരട്ട അർഥം നിലനിർത്തുന്നു. ചർമരോഗത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് അർഥപരമായി ബന്ധപ്പെട്ട ‘കുഷ്ഠം’ എന്ന പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
