id: LUK.5.27
reference: Luke 5:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: ml
  text: ഇതിനുശേഷം അവൻ പുറത്തേക്കു പോയി. ലേവി എന്നു പേരുള്ള ഒരു നികുതിപിരിവുകാരൻ ചുങ്കപ്പിരിവുസ്ഥലത്ത്[a] ഇരിക്കുന്നത് അവൻ കണ്ടു[b]. അവനോട്, “എന്നെ അനുഗമിക്കുക,” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നികുതിപിരിവുസ്ഥലത്ത്,” “ചുങ്കച്ചാവടിയിൽ,” അല്ലെങ്കിൽ “കസ്റ്റംസ് കേന്ദ്രത്തിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ശ്രദ്ധിച്ചു” അല്ലെങ്കിൽ “നോക്കി”; ഗ്രീക്ക് ക്രിയ ക്ഷണികമായി കാണുന്നതിലധികം ശ്രദ്ധയോടെ നോക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: ഇതിനുശേഷം
  rationale: ബഹുവചനമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആഖ്യാനപരമായ തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐξῆλθεν
  choice: പുറത്തേക്കു പോയി
  rationale: ἐξέρχομαι സൂചിപ്പിക്കുന്ന വ്യക്തമായ പുറത്തേക്കുള്ള ചലനം പരിരക്ഷിക്കുന്നു.
- source_word: ἐθεάσατο
  choice: കണ്ടു
  rationale: θεάομαι ശ്രദ്ധിച്ചുനോക്കുക എന്ന നിഴലർഥം വഹിക്കാമെങ്കിലും സന്ദർഭത്തിൽ ‘കണ്ടു’ സ്വാഭാവികവും അമിതവ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമാണ്; മറ്റുസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τελώνην
  choice: നികുതിപിരിവുകാരൻ
  rationale: സർക്കാരിനുവേണ്ടി നികുതി അല്ലെങ്കിൽ ചുങ്കം പിരിച്ചിരുന്ന വ്യക്തിയുടെ സാമൂഹിക പങ്ക് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ὀνόματι Λευὶν
  choice: ലേവി എന്നു പേരുള്ള
  rationale: ഗ്രീക്ക് നാമപ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: καθήμενον
  choice: ഇരിക്കുന്നത്
  rationale: ലേവി തന്റെ പിരിവുസ്ഥലത്ത് ഇരുന്നുകൊണ്ടിരുന്ന ദൃശ്യത്തിന്റെ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὸ τελώνιον
  choice: ചുങ്കപ്പിരിവുസ്ഥലത്ത്
  rationale: τελώνιον നികുതിയോ വഴിച്ചുങ്കമോ പിരിച്ചിരുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ‘സ്ഥലം’ എന്നത് കെട്ടിടത്തിന്റെ രൂപം അനാവശ്യമായി നിർണ്ണയിക്കാതെ അർഥം കൈമാറുന്നു.
- source_word: Ἀκολούθει μοι
  choice: എന്നെ അനുഗമിക്കുക
  rationale: നേരിട്ടുള്ള ആജ്ഞയും ശിഷ്യത്വവിളിയുടെ ശക്തിയും വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ആജ്ഞയുടെ ശിഷ്യത്വവിളിയായ ശക്തി
  choice: “എന്നെ അനുഗമിക്കുക” എന്ന നേരിട്ടുള്ള വിളിയായി വിവർത്തനം ചെയ്തു.
  alternative: “എന്റെ ശിഷ്യനാകുക”
  rationale: സന്ദർഭത്തിൽ ശിഷ്യത്വവിളി വ്യക്തമായിരുന്നാലും ഗ്രീക്ക് പാഠം പറയുന്നതിലധികമായി അത് വിശദീകരിക്കാതെ ആജ്ഞയുടെ ലളിതവും തുറന്നതുമായ രൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നികുതിപിരിവുകാരൻ’ പൊതുവായ സാമൂഹിക പദവിയെയും ‘ചുങ്കപ്പിരിവുസ്ഥലം’ പ്രത്യേക പ്രവർത്തനസ്ഥലത്തെയും വ്യക്തമായി വേർതിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ വിശദീകരിക്കുന്ന പദത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
