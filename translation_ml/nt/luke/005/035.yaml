  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: ml
  text: എന്നാൽ ദിവസങ്ങൾ വരും; മണവാളൻ അവരിൽനിന്ന് എടുത്തുമാറ്റപ്പെടുമ്പോൾ, അപ്പോൾ, ആ ദിവസങ്ങളിൽ അവർ ഉപവസിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവരിൽനിന്ന് നീക്കപ്പെടുമ്പോൾ.’ ഗ്രീക്ക് ക്രിയ മണവാളൻ വെറുതെ പോകുന്നതല്ല, എടുത്തുമാറ്റപ്പെടുന്നതാണെന്ന് സൂചിപ്പിക്കുന്നു.
