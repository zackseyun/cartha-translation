lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: ദിവസങ്ങൾ വരും
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഭാവികാലസ്വഭാവവും ആവർത്തനത്തിന് ഒരുക്കുന്ന രൂപവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ ഇപ്പോഴത്തെ ഉപവാസമില്ലായ്മയും വരാനിരിക്കുന്ന ഉപവാസവും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: ὅταν
  choice: എപ്പോൾ
  rationale: അനിശ്ചിതമായ ആവർത്തനമെന്നതിലുപരി ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സന്ദർഭത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπαρθῇ
  choice: എടുത്തുമാറ്റപ്പെടുമ്പോൾ
  rationale: ക്രിയയുടെ കർമണിപ്രയോഗവും മണവാളൻ വെറുതെ പോകുന്നതല്ല, അവരിൽനിന്ന് നീക്കപ്പെടുന്നതാണ് എന്ന ഗൗരവസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: ἀπ’ αὐτῶν
  choice: അവരിൽനിന്ന്
  rationale: മണവാളനും കൂടെയുള്ളവരും തമ്മിലുണ്ടാകുന്ന വേർപാട് കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ νυμφίος
  choice: മണവാളൻ
  rationale: വിവാഹരൂപകത്തിന് യോജിച്ച, മലയാള ബൈബിൾഭാഷയിലും പൊതുഭാഷയിലും മനസ്സിലാകുന്ന പദമാണ്.
- source_word: τότε
  choice: അന്ന്
  rationale: മണവാളൻ എടുത്തുമാറ്റപ്പെടുന്ന സമയത്തോടു തുടർന്നുള്ള ഫലത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അടയാളപ്പെടുത്തുന്നു.
- source_word: νηστεύσουσιν
  choice: അവർ ഉപവസിക്കും
  rationale: സാധാരണ ഭക്ഷണവിരമനം മാത്രമല്ല, മതപരമായ ഉപവാസം എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: ഗ്രീക്കിലെ ആവർത്തനം ഒഴിവാക്കാതെ ഭാവിയിലെ ആ കാലഘട്ടത്തെ ഊന്നിപ്പറയുന്നു.
theological_decisions:
- issue: കർമണിപ്രയോഗമായ ἀπαρθῇയെ നിഷ്പക്ഷമായ യാത്രയായി മയപ്പെടുത്തണമോ
  choice: മണവാളൻ അവരിൽനിന്ന് എടുത്തുമാറ്റപ്പെടുന്നു
  alternative: മണവാളൻ അവരെ വിട്ടുപോകുന്നു
  rationale: മൂലപാഠം മണവാളന്റെ സ്വമേധയായുള്ള പുറപ്പെടലിനേക്കാൾ അവനോടു സംഭവിക്കുന്ന നീക്കത്തെ സൂചിപ്പിക്കുന്നു. യേശുവിന്റെ വരാനിരിക്കുന്ന മരണത്തോടുള്ള സാധ്യതയുള്ള സൂചന വിശദീകരിച്ചു തീർക്കാതെ അതിന്റെ ഗൗരവവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ കാലസൂചനയും ‘ദിവസങ്ങൾ’ എന്ന ആവർത്തനവും കർമണിപ്രയോഗത്തിന്റെ ഗൗരവവും സംരക്ഷിച്ചിരിക്കുന്നു.
