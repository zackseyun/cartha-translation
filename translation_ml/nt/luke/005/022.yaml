  to: 'എന്നാൽ യേശു അവരുടെ വിചാരങ്ങൾ ഗ്രഹിച്ച് അവരോടു മറുപടിയായി പറഞ്ഞു: “നിങ്ങളുടെ ഹൃദയങ്ങളിൽ നിങ്ങൾ എന്തിന് വിചാരിക്കുന്നു?”'
