id: LUK.5.22
reference: Luke 5:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരുടെ വിചാരങ്ങൾ ഗ്രഹിച്ച് അവരോടു മറുപടിയായി പറഞ്ഞു: “നിങ്ങളുടെ ഹൃദയങ്ങളിൽ നിങ്ങൾ എന്തിന് വിചാരിക്കുന്നു?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: ഗ്രഹിച്ച്
  rationale: യേശു അവരുടെ ഉള്ളിലെ ആലോചനകൾ വ്യക്തമായി അറിഞ്ഞുവെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; അത് എങ്ങനെ അറിഞ്ഞു എന്നത് വിശദീകരിക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽ നിന്നുള്ള നേരിയ ഭാവമാറ്റവും വിരോധസൂചനയും വ്യക്തമാക്കുന്നു.
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: അവരുടെ ആലോചനകൾ
  rationale: അവരുടെ ഉള്ളിലെ ചിന്താപരമായ വിചാരങ്ങളെയും നിരൂപണങ്ങളെയും സൂചിപ്പിക്കുന്ന, സന്ദർഭത്തിന് യോജിച്ച സാധാരണ മലയാളപ്രയോഗം.
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: അവരോടു മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ രണ്ട് ക്രിയകളുടെയും ആശയം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Τί
  choice: എന്തിന്
  rationale: διαλογίζεσθε എന്ന ക്രിയയോടൊപ്പം ഇവിടെ കാരണം ചോദിക്കുന്ന പ്രയോഗമായതിനാൽ ‘എന്തിന്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: διαλογίζεσθε
  choice: ആലോചിക്കുന്നത്
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന ആന്തരിക വിചാരപ്രക്രിയയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളിൽ
  rationale: ചിന്തയും മനസ്സങ്കൽപ്പവും ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മറ്റുള്ളവരുടെ ഉള്ളിലെ ആലോചനകളെക്കുറിച്ചുള്ള യേശുവിന്റെ അറിവിന്റെ സ്വഭാവം
  choice: യേശു അവരുടെ ആലോചനകൾ ഗ്രഹിച്ചു എന്ന് മാത്രം നേരിട്ട് പറയുന്നു.
  alternative: അത് അത്ഭുതകരമായ അറിവായിരുന്നുവെന്ന് വ്യക്തമാക്കുക, അല്ലെങ്കിൽ യേശു അവരുടെ ചിന്ത ഊഹിച്ചുവെന്ന് ദുർബലപ്പെടുത്തി പറയുക.
  rationale: യേശുവിന് അവരുടെ ആന്തരിക വിചാരങ്ങൾ അറിയാമായിരുന്നുവെന്ന് വാക്യം പ്രസ്താവിക്കുന്നു; എന്നാൽ ആ അറിവിന്റെ മാർഗം വിശദീകരിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലോ കുറച്ചുകാണിക്കലോ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഹൃദയങ്ങളിൽ’ എന്ന ബൈബിൾസവിശേഷമായ മാനവശാസ്ത്രപ്രയോഗം സംരക്ഷിച്ചിരിക്കുന്നു.
