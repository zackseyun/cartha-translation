id: LUK.5.17
reference: Luke 5:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: ml
  text: ഒരു ദിവസം യേശു പഠിപ്പിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു. പരീശന്മാരും ന്യായപ്രമാണം പഠിപ്പിക്കുന്നവരും അവിടെ ഇരിക്കുന്നുണ്ടായിരുന്നു. അവർ ഗലീലയിലെയും യെഹൂദ്യയിലെയും എല്ലാ ഗ്രാമങ്ങളിൽനിന്നും യെരൂശലേമിൽനിന്നും വന്നവരായിരുന്നു. യേശു സൗഖ്യമാക്കേണ്ടതിന് കർത്താവിന്റെ ശക്തി അവിടെ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “യേശു സൗഖ്യമാക്കേണ്ടതിന്” എന്നതിനു പകരം “അവരെ സൗഖ്യമാക്കാൻ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: ആ ദിവസങ്ങളിലൊന്നിൽ
  rationale: ലൂക്കോസിന്റെ സംഭവാരംഭസൂത്രം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ സംഭവം നടന്നുവെന്നത് ക്രിയകളിൽനിന്ന് വ്യക്തമായതിനാൽ പ്രത്യേകമായി ‘സംഭവിച്ചു’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: αὐτὸς ἦν διδάσκων
  choice: യേശു പഠിപ്പിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: പര്യായ അപൂർണകാലഘടന സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തി നിലനിർത്തുന്നു. മലയാളത്തിൽ സർവനാമത്തിന്റെ അവ്യക്തത ഒഴിവാക്കാൻ സന്ദർഭത്തിലെ കർത്താവായ യേശുവിന്റെ പേര് ഉപയോഗിച്ചു; αὐτός-ന് അനാവശ്യ ഊന്നൽ നൽകിയിട്ടില്ല.
- source_word: καθήμενοι
  choice: അവിടെ ഇരിക്കുന്നുണ്ടായിരുന്നു
  rationale: അവർ ആ രംഗത്ത് ഇരുന്നുകൊണ്ടുണ്ടായിരുന്ന സ്ഥിരസാന്നിധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദമതവിഭാഗത്തിനുള്ള സ്ഥാപിതമായ മലയാളരൂപം.
- source_word: νομοδιδάσκαλοι
  choice: ന്യായപ്രമാണ ഉപദേഷ്ടാക്കൾ
  rationale: മോശെയുടെ ന്യായപ്രമാണം പഠിപ്പിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സംയുക്തപദത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐληλυθότες
  choice: വന്നവരായിരുന്നു
  rationale: മുമ്പുണ്ടായ വരവും അതിന്റെ തുടർന്നുള്ള ഫലമായ സാന്നിധ്യവും സൂചിപ്പിക്കുന്ന പൂർണ പങ്കാളിത്തരൂപത്തിന്റെ കഥാകാലബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐκ πάσης κώμης
  choice: എല്ലാ ഗ്രാമങ്ങളിൽനിന്നും
  rationale: κώμη എന്നതിന്റെ ഗ്രാമം/ചെറുകുടിയിരിപ്പ് എന്ന അർഥവും πάσης എന്നതിന്റെ വിതരണാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: ഗലീലയിലെയും യെഹൂദ്യയിലെയും എല്ലാ ഗ്രാമങ്ങളിൽനിന്നും യെരൂശലേമിൽനിന്നും
  rationale: ഗലീലയും യെഹൂദ്യയും പ്രദേശങ്ങളാണെന്നും യെരൂശലേം നഗരമാണെന്നും സ്വാഭാവിക മലയാളഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: δύναμις κυρίου
  choice: കർത്താവിന്റെ ശക്തി
  rationale: ജനിറ്റീവ് ബന്ധവും പ്രവർത്തിക്കുന്ന ദൈവിക ശക്തിയുടെ ദൈവശാസ്ത്രഭാരവും നിലനിർത്തുന്നു.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: സൗഖ്യമാക്കാൻ കർത്താവിന്റെ ശക്തി യേശുവിനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: SBLGNT-യിലെ αὐτόν എന്ന ഏകവചനപാഠത്തെ മാനിച്ച് യേശുവിന്റെ സൗഖ്യമാക്കൽ ശുശ്രൂഷയിൽ കർത്താവിന്റെ ശക്തി പ്രവർത്തിച്ചിരുന്നുവെന്ന ലക്ഷ്യ/ഫലബന്ധം നൽകുന്നു; മുഖ്യവാചകത്തിൽ ‘അവരെ’ എന്ന ബഹുവചന കർമം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν എന്ന വാക്യഭാഗത്തിന്റെ കർത്താവും ബന്ധവും
  choice: സൗഖ്യമാക്കാൻ കർത്താവിന്റെ ശക്തി യേശുവിനോടുകൂടെ ഉണ്ടായിരുന്നു
  alternative: അവരെ സൗഖ്യമാക്കാൻ കർത്താവിന്റെ ശക്തി ഉണ്ടായിരുന്നു
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിൽ ബഹുവചന αὐτούς അല്ല, ഏകവചന αὐτόν ആണ്. അതിനാൽ മുഖ്യവാചകം ‘അവരെ’ എന്നു ചേർക്കാതെ യേശുവിന്റെ സൗഖ്യമാക്കൽ പ്രവൃത്തിയോടുള്ള ദൈവിക ശക്തിയുടെ ബന്ധം പ്രകടിപ്പിക്കുന്നു. വ്യത്യസ്ത കൈയെഴുത്തുപ്രതി പാഠം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: κύριος എന്നതിന്റെ പരാമർശം
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഇവിടെ ദൈവിക ശക്തിയുടെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കർത്താവ്’ എന്ന സ്ഥാപിതവും വിശാലവുമായ ദൈവശാസ്ത്രപദം ഉപയോഗിക്കുന്നു; പരാമർശത്തെ ആവശ്യത്തിലധികം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ദൈർഘ്യമേറിയ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി നാല് മലയാളവാക്യങ്ങളാക്കി. ‘ന്യായപ്രമാണം’, ‘കർത്താവ്’, ‘സൗഖ്യമാക്കുക’ തുടങ്ങിയ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ വാക്യക്രമം ഒഴിവാക്കി.
