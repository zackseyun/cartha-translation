  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: ml
  text: 'അവൻ സംസാരിച്ചു തീർന്നപ്പോൾ ശിമോനോടു പറഞ്ഞു: “ആഴമുള്ള വെള്ളത്തിലേക്കു വള്ളം നീക്കുക; മീൻപിടിക്കാനായി നിങ്ങളുടെ വലകൾ താഴ്ത്തുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: അവൻ സംസാരിച്ചു തീർന്നപ്പോൾ
  rationale: പറച്ചിൽ അവസാനിച്ചതിനു പിന്നാലെയുള്ള സംഭവത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; δέയുടെ നേരിയ ആഖ്യാനപുരോഗതി പ്രത്യേകം പദമാക്കി അമിതമായി വിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: ശിമോനോടു പറഞ്ഞു
  rationale: λέγω എന്ന സാധാരണ സംസാരക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: Ἐπανάγαγε εἰς τὸ βάθος
  choice: ആഴമുള്ളിടത്തേക്കു വള്ളം നീക്കുക
  rationale: തീരത്തുനിന്ന് വള്ളം ആഴമുള്ള വെള്ളത്തിലേക്കു കൊണ്ടുപോകുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; തടാകസന്ദർഭത്തിൽ ‘കടലിലേക്കു’ എന്നു ചേർക്കുന്നില്ല.
- source_word: χαλάσατε τὰ δίκτυα ὑμῶν
  choice: നിങ്ങളുടെ വലകൾ താഴ്ത്തുക
  rationale: ബഹുവചനമായ δίκτυα, ὑμῶν എന്നിവ സംരക്ഷിച്ച്, വള്ളത്തിൽനിന്നു വല ഇറക്കുന്നതിനെ സ്വാഭാവികമായി പറയുന്നു.
- source_word: εἰς ἄγραν
  choice: മീൻപിടിക്കാനായി
  rationale: ഈ മീൻപിടിത്തസന്ദർഭത്തിൽ ἄγρα സൂചിപ്പിക്കുന്ന ലക്ഷ്യം ലളിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഏകവചനമായ Ἐπανάγαγε ശിമോനോടുള്ള നിർദേശമായും ബഹുവചനമായ χαλάσατε/ὑμῶν ശിമോനെയും കൂടെയുള്ളവരെയും ഉൾക്കൊള്ളുന്നതായും വ്യാകരണത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
