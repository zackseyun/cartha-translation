revisions:
- from: 'അപ്പോൾ പരീശന്മാരും അവരുടെ ശാസ്ത്രിമാരും അവന്റെ ശിഷ്യന്മാരോടു പിറുപിറുത്തുകൊണ്ട്[a] ചോദിച്ചു: “നിങ്ങൾ എന്തിനാണ് ചുങ്കക്കാരോടും പാപികളോടുംകൂടെ തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്നത്?”'
  to: പരീശന്മാരും അവരുടെ ശാസ്ത്രിമാരും അവന്റെ ശിഷ്യന്മാരോടു പിറുപിറുത്തുകൊണ്ടിരുന്നു; അവർ പറഞ്ഞു:[a] “നിങ്ങൾ ചുങ്കക്കാരുടെയും പാപികളുടെയും കൂടെ എന്തിനാണ് ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്യുന്നത്?”
