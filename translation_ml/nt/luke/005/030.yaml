id: LUK.5.30
reference: Luke 5:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: ml
  text: പരീശന്മാരും അവരുടെ ശാസ്ത്രിമാരും അവന്റെ ശിഷ്യന്മാരോടു പിറുപിറുത്തുകൊണ്ടിരുന്നു; അവർ പറഞ്ഞു:[a] “നിങ്ങൾ ചുങ്കക്കാരുടെയും പാപികളുടെയും കൂടെ എന്തിനാണ് ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്യുന്നത്?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരാതിപ്പെട്ടുകൊണ്ടിരുന്നു” അല്ലെങ്കിൽ “മുറുമുറുത്തുകൊണ്ടിരുന്നു.” ഗ്രീക്ക് ക്രിയ ഔപചാരികമായ എതിർപ്പു മാത്രമല്ല, അടക്കിപ്പറയുന്ന അസന്തോഷത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: പിറുപിറുത്തുകൊണ്ട്
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്ന പരാതിയെ സൂചിപ്പിക്കുന്നു; ‘പിറുപിറുക്കുക’ എന്നത് തുറന്ന ഔപചാരിക എതിർപ്പിനേക്കാൾ അടക്കിപ്പറയുന്ന അസന്തോഷത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: ചരിത്രപരമായ ഈ വിഭാഗത്തിന്റെ പേരിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും നേരിട്ടുള്ളതുമായ തുല്യപദമാണിത്; അവരുടെ ചുമതല മാത്രം വിശദീകരിക്കുന്ന വ്യാഖ്യാനപദം ഒഴിവാക്കുന്നു.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: ഗ്രീക്ക് വാക്യഘടന അനുസരിച്ച് ശാസ്ത്രിമാരെ പരീശന്മാരുമായി ബന്ധിപ്പിക്കുന്ന സർവനാമബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരോടു
  rationale: πρός ഇവിടെ സംസാരത്തിന്റെ ദിശയാണ് സൂചിപ്പിക്കുന്നത്; സ്വാഭാവിക മലയാളത്തിൽ ‘ശിഷ്യന്മാരോടു’ അതു വ്യക്തമാക്കുന്നു.
- source_word: Διὰ τί
  choice: എന്തിനാണ്
  rationale: കാരണം ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: τελωνῶν
  choice: ചുങ്കക്കാർ
  rationale: സുവിശേഷങ്ങളുടെ ചരിത്രസാമൂഹിക പശ്ചാത്തലത്തിൽ τελώνης എന്ന പദത്തിന് പ്രചാരമുള്ള നേരിട്ടുള്ള മലയാള തുല്യപദം; ആ വിഭാഗത്തോടുണ്ടായിരുന്ന സാമൂഹിക അവജ്ഞയും നിലനിർത്തുന്നു.
- source_word: ἁμαρτωλῶν
  choice: പാപികൾ
  rationale: പ്രഭാഷകരുടെ കാഴ്ചയിൽ ധാർമ്മികമായും സാമൂഹികമായും മുദ്രകുത്തപ്പെട്ട വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ; വിശദീകരണപരമായ പുനർവാചകം ഒഴിവാക്കുന്നു.
- source_word: ἐσθίετε καὶ πίνετε
  choice: തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്നത്
  rationale: ഭക്ഷിക്കുകയും കുടിക്കുകയും എന്ന മൂർത്തമായ ഇരട്ടപ്രയോഗം നിലനിർത്തുന്നു; ‘ഒരുമിച്ച് ഭക്ഷണം കഴിക്കുക’ എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: καὶ
  choice: അപ്പോൾ
  rationale: καί എന്ന ആഖ്യാനബന്ധകത്തെ മലയാളത്തിലെ സ്വാഭാവിക കഥാപ്രവാഹത്തിൽ അവതരിപ്പിക്കുന്നു; പുതിയ ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘ചുങ്കക്കാരോടും പാപികളോടുംകൂടെ’ ഉള്ള മേശസഹവാസത്തിന്റെ സാമൂഹിക-മതപരമായ അർഥം
  choice: ആരോപണം വാക്യത്തിലുള്ള മൂർത്തമായ രൂപത്തിൽ തന്നെ നിലനിർത്തി
  alternative: ആചാരപരമോ ധാർമ്മികമോ ആയ കുറ്റം വ്യക്തമായി വിശദീകരിക്കുന്ന പുനർവാചകം
  rationale: വാക്യം എതിർപ്പ് അവതരിപ്പിക്കുന്നത് ‘ചുങ്കക്കാരും പാപികളും’ എന്ന വിഭാഗങ്ങളിലൂടെയും അവരോടൊപ്പം തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്നതിലൂടെയുമാണ്. അധിക വിശദീകരണം ചേർക്കാതെ ഈ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘പരീശന്മാർ,’ ‘ശാസ്ത്രിമാർ,’ ‘ചുങ്കക്കാർ’ എന്നീ പരിചിതമായ ചരിത്രപദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ തുടർച്ചയായ പിറുപിറുപ്പ് മലയാളത്തിൽ ക്രിയാവിശേഷണരൂപത്തിലൂടെ പ്രകടമാക്കി.
