id: LUK.5.39
reference: Luke 5:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: ml
  text: പഴയ വീഞ്ഞ് കുടിച്ചശേഷം ആരും പുതിയത് ആഗ്രഹിക്കുന്നില്ല; കാരണം, ‘പഴയത് നല്ലതാണ്’ എന്നാണ് പറയുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ ഇങ്ങനെ വായിക്കുന്നു: ‘പഴയത് മെച്ചമാണ്.’'
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: ആരും … ഇല്ല
  rationale: ഏതൊരു വ്യക്തിയെയും പൊതുവായി ഉൾക്കൊള്ളുന്ന നിഷേധാർഥം സ്വാഭാവികമായ മലയാള നിഷേധഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: πιὼν
  choice: കുടിച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെന്ന aorist participle-ന്റെ കാലബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: παλαιὸν
  choice: പഴയ വീഞ്ഞു
  rationale: ഗ്രീക്കിൽ നാമം സൂചിതമാണെങ്കിലും തൊട്ടുമുമ്പുള്ള വീഞ്ഞിന്റെ സന്ദർഭം മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘വീഞ്ഞു’ ചേർക്കുന്നു.
- source_word: θέλει
  choice: ആഗ്രഹിക്കുന്നില്ല
  rationale: ഇവിടെ θέλω ഇച്ഛയെയോ മുൻഗണനയെയോ സൂചിപ്പിക്കുന്നു; ‘ആഗ്രഹിക്കുന്നു’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: νέον
  choice: പുതിയത്
  rationale: ഗ്രീക്കിലെപ്പോലെ ‘വീഞ്ഞു’ ആവർത്തിക്കാതെ വിശേഷണത്തെ നാമവൽക്കരിച്ച് ദീർഘോക്തി ഒഴിവാക്കുന്നു; സന്ദർഭത്തിൽ അർഥം വ്യക്തമാണ്.
- source_word: λέγει γάρ
  choice: കാരണം, … എന്ന് അയാൾ പറയുന്നു
  rationale: γάρ-ന്റെ വിശദീകരണപരമായ കാരണബന്ധവും നേരിട്ടുള്ള ഉദ്ധരണിയുടെ അവതരണവും നിലനിർത്തുന്നു.
- source_word: Ὁ παλαιὸς
  choice: പഴയത്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ, നാമം സൂചിതമായ പ്രയോഗം മലയാളത്തിലും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: χρηστός
  choice: നല്ലതാണ്
  rationale: χρηστός എന്നതിന്റെ അടിസ്ഥാനപരമായ അനുകൂല വിലയിരുത്തൽ നൽകുന്നു; മൂലപാഠത്തിലില്ലാത്ത താരതമ്യാർഥമായ ‘മെച്ചമാണ്’ പ്രധാനപാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
theological_decisions:
- issue: പഴയ വീഞ്ഞിനെക്കുറിച്ചുള്ള χρηστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നല്ലതാണ്
  alternative: മെച്ചമാണ്
  rationale: SBLGNT-യിലെ χρηστός സാധാരണയായി ‘നല്ലത്’ അല്ലെങ്കിൽ ‘രുചികരം’ എന്നർഥം നൽകുന്നു; അത് താരതമ്യരൂപമല്ല. പരിചിതമായ ‘മെച്ചമാണ്’ എന്ന വായന പാഠഭേദമായി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു; അതിനെ പ്രധാനപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. പഴഞ്ചൊല്ലുപോലുള്ള സംക്ഷിപ്തതയും പഴയതും പുതിയതുമായ വീഞ്ഞിന്റെ വൈരുധ്യവും നിലനിർത്തി.
