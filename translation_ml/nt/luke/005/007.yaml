  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: ml
  text: അപ്പോൾ അവർ മറ്റേ വള്ളത്തിലുണ്ടായിരുന്ന തങ്ങളുടെ പങ്കാളികളോട് വന്ന് തങ്ങളെ സഹായിക്കാൻ ആംഗ്യം കാട്ടി.[a] അവർ വന്ന് രണ്ടു വള്ളങ്ങളും നിറച്ചു; അവ മുങ്ങിത്തുടങ്ങുമാറായി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സൂചന നൽകി” അല്ലെങ്കിൽ “മാടി വിളിച്ചു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവ മുങ്ങിക്കൊണ്ടിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατένευσαν
  choice: ആംഗ്യം കാട്ടി
  rationale: അകലെയുള്ളവരോട് കൈയോ തലയോ ഉപയോഗിച്ച് സൂചന നൽകുന്നതാണ് ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: μετόχοις
  choice: പങ്കാളികൾ
  rationale: ഇവിടെ സാധാരണ കൂട്ടുകാരെയല്ല, മത്സ്യബന്ധനത്തിൽ സഹകരിക്കുന്ന തൊഴിൽപങ്കാളികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: മറ്റേ വള്ളത്തിലുണ്ടായിരുന്ന
  rationale: കഥാസന്ദർഭത്തിലെ രണ്ടാമത്തെ വള്ളത്തെ സ്വാഭാവിക മലയാളത്തിൽ തിരിച്ചറിയിക്കുന്നു.
- source_word: τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς
  choice: വന്ന് തങ്ങളെ സഹായിക്കാനായി
  rationale: ഈ ഘടന ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; συλλαμβάνω ഇവിടെ ഒപ്പം ചേർന്ന് സഹായിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: ἔπλησαν ἀμφότερα τὰ πλοῖα
  choice: രണ്ടു വള്ളങ്ങളും നിറച്ചു
  rationale: മൂലത്തിലെ ‘നിറയ്ക്കുക’, ‘രണ്ടും’ എന്നീ ആശയങ്ങൾ നേരിട്ട് നിലനിർത്തുന്നു; മീനുകളാൽ എന്നത് മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: അവ മുങ്ങിത്തുടങ്ങുംവിധം നിറഞ്ഞു
  rationale: വർത്തമാനകാല അനന്തരഫലപ്രക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വള്ളങ്ങൾ പൂർണമായി മുങ്ങിപ്പോയി എന്ന് പറയുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഗൗരവമുള്ള മലയാളം. ‘പടക്’ എന്നതിനെക്കാൾ ഗലീലായിലെ മത്സ്യബന്ധനസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘വള്ളം’ ഉപയോഗിച്ചു. ആവർത്തനഭാരം ഒഴിവാക്കാൻ രണ്ടാം വാക്യത്തിൽ ഫലബന്ധം അർധവിരാമത്തിലൂടെ വ്യക്തമാക്കി.
