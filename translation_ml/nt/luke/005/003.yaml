  to: അവൻ പടകുകളിൽ ഒന്നിൽ കയറി; അത് ശിമോന്റേതായിരുന്നു. പടക് കരയിൽനിന്ന് അൽപ്പം അകറ്റാൻ അവൻ ശിമോനോട് ആവശ്യപ്പെട്ടു. പിന്നെ അവൻ ഇരുന്ന് പടകിൽനിന്ന് ജനക്കൂട്ടങ്ങളെ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു.
