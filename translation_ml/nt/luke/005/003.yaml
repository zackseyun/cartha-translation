id: LUK.5.3
reference: Luke 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: ml
  text: അവൻ പടകുകളിൽ ഒന്നിൽ കയറി; അത് ശിമോന്റേതായിരുന്നു. പടക് കരയിൽനിന്ന് അൽപ്പം അകറ്റാൻ അവൻ ശിമോനോട് ആവശ്യപ്പെട്ടു. പിന്നെ അവൻ ഇരുന്ന് പടകിൽനിന്ന് ജനക്കൂട്ടങ്ങളെ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβὰς
  choice: കയറി
  rationale: ἐμβαίνω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പടകിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നു; ‘കയറി’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: πλοίων / πλοίου
  choice: പടകുകളിൽ / പടകിൽ
  rationale: തടാകത്തിലെ മീൻപിടിത്തത്തിനുപയോഗിച്ച ചെറുകപ്പലുകളാണ് സന്ദർഭം; അതിനാൽ ‘പടക്’ യോജിക്കുന്നു. ഗ്രീക്കിലെ ബഹുവചനവും ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: ὃ ἦν Σίμωνος
  choice: അത് ശിമോന്റേതായിരുന്നു
  rationale: Σίμωνος എന്ന ഷഷ്ഠീവിഭക്തി ഉടമസ്ഥത സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം അത് നേരായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἠρώτησεν
  choice: ആവശ്യപ്പെട്ടു
  rationale: ἐρωτάω ഇവിടെ വിനയപൂർവമായ അഭ്യർഥനയുടെയോ ആവശ്യപ്പെടലിന്റെയോ അർഥത്തിലാണ്; ‘ആവശ്യപ്പെട്ടു’ സന്ദർഭത്തിന് അനുയോജ്യമാണ്.
- source_word: ἐπαναγαγεῖν
  choice: നീക്കാൻ
  rationale: പടകിനെ കരയിൽനിന്ന് വെള്ളത്തിലേക്ക് അല്പം മാറ്റുന്നതിനെയാണ് ἐπανάγω ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘നീക്കാൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: ἀπὸ τῆς γῆς
  choice: കരയിൽനിന്ന്
  rationale: γῆ അക്ഷരാർഥത്തിൽ ‘നിലം/ഭൂമി’ എന്നാണെങ്കിലും ഇവിടെ വെള്ളത്തിനോടു വിരുദ്ധമായി കരയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘കരയിൽനിന്ന്’ ഏറ്റവും സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: ὀλίγον
  choice: അൽപ്പം
  rationale: ചെറിയ അളവോ ദൂരമോ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: καθίσας
  choice: ഇരുന്നുകൊണ്ട്
  rationale: കൃദന്തരൂപം ഇരുന്ന ശേഷമുള്ള പഠിപ്പിക്കൽ എന്ന ബന്ധം നൽകുന്നു; മലയാളത്തിൽ ‘ഇരുന്നുകൊണ്ട്’ അധ്യാപനം ഇരുന്ന നിലയിൽ നടന്നതും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐδίδασκεν
  choice: പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ രൂപം അതിന്റെ പുരോഗമനസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ പ്രവർത്തനക്രമവും ἐδίδασκεν എന്ന അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന ഭാവവും നിലനിർത്തി. ‘കരയിൽനിന്ന്’ എന്നത് γῆയുടെ ഈ സന്ദർഭത്തിലെ അർഥം നേരിട്ട് നൽകുന്നതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
