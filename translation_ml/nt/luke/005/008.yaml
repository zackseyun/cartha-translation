  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: ml
  text: 'എന്നാൽ ശിമോൻ പത്രോസ് അതു കണ്ടപ്പോൾ[a] യേശുവിന്റെ കാൽമുട്ടുകൾക്കൽ വീണു പറഞ്ഞു: “എന്നിൽനിന്ന് അകന്നുപോകണമേ; കാരണം ഞാൻ പാപിയായ ഒരു മനുഷ്യനാണ്, കർത്താവേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിൽ ‘അതു’ എന്ന കർമപദം ഇല്ല; സന്ദർഭത്തിൽ അത് അത്ഭുതകരമായ മീൻപിടിത്തത്തെ സൂചിപ്പിക്കുന്നു.
    reason: implicit_object
lexical_decisions:
- source_word: ἰδὼν
  choice: അതു കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ aorist participle കാലസൂചനയായി സ്വാഭാവിക മലയാളത്തിൽ പരിഭാഷപ്പെടുത്തി. ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സന്ദർഭത്തിലെ അത്ഭുതകരമായ മീൻപിടിത്തത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതു’ ചേർത്തു; ഇത് [a] അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: കഥയുടെ മുന്നേറ്റത്തിലെ നേരിയ ഭാവമാറ്റവും പത്രോസിന്റെ പ്രതികരണത്തിലേക്കുള്ള തിരിവും പ്രകടമാക്കുന്നു.
- source_word: Σίμων Πέτρος
  choice: ശിമോൻ പത്രോസ്
  rationale: ഗ്രീക്കിലുള്ള രണ്ടു പേരുകളും നിലനിർത്തി.
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: യേശുവിന്റെ കാൽമുട്ടുകൾക്കൽ വീണു
  rationale: യേശുവിന്റെ കാൽമുട്ടുകളുടെ സമീപത്തേക്ക് വീണ ശരീരഭാവം സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: അനുബന്ധമായി നടന്ന സംസാരത്തെ മലയാള കഥനശൈലിയിൽ സ്വാഭാവികമായ സമാപികാക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: എന്നിൽനിന്ന് അകന്നുപോകണമേ
  rationale: വേർപെട്ടുപോകാനുള്ള അടിയന്തര അഭ്യർഥനയെ മാന്യമായ അപേക്ഷാരൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം സൂചിപ്പിക്കുന്ന ‘;’ ഘടന
  rationale: തുടർന്നുള്ള വാക്കുകൾ അഭ്യർഥനയുടെ കാരണം ആണെന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; നേരിട്ടുള്ള ‘കാരണം’ ഒഴിവാക്കിയെങ്കിലും അർത്ഥബന്ധം നിലനിർത്തുന്നു.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: പാപിയായ ഒരു മനുഷ്യൻ
  rationale: ἀνήρ എന്ന പ്രത്യേകമായി പുരുഷനെ സൂചിപ്പിക്കുന്ന നാമവും ἁμαρτωλός എന്ന വിശേഷണഘടനയും നിലനിർത്തുന്നു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: ബഹുമാനവും യേശുവിന്റെ അധികാരത്തെക്കുറിച്ചുള്ള ഉയർന്ന തിരിച്ചറിവിനുള്ള സാധ്യതയും ഒരുപോലെ നിലനിർത്തുന്നു; വെറും ‘യജമാനനേ’ അല്ലെങ്കിൽ ‘സാറേ’ എന്നതിനെക്കാൾ ഗ്രീക്ക് പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്നത്വം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριε എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ
  rationale: അത്ഭുതത്തിനു പിന്നാലെയുള്ള ഭയവും പാപബോധവും നിറഞ്ഞ സന്ദർഭത്തിൽ ‘കർത്താവേ’ ബഹുമാനത്തെയും വളർന്നുവരുന്ന ദൈവശാസ്ത്രപരമായ ആഴത്തെയും സംരക്ഷിക്കുന്നു; അതേസമയം പത്രോസിന് ഈ ഘട്ടത്തിൽ പൂർണമായി വികസിച്ച ക്രിസ്തുശാസ്ത്രപരമായ ഏറ്റുപറച്ചിൽ ഉണ്ടായിരുന്നുവെന്ന് നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സംഭാഷണത്തിലെ വിനയവും അടിയന്തരതയും നിലനിർത്താൻ ‘അകന്നുപോകണമേ’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
