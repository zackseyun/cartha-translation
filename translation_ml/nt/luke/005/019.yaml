  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ പ്രവേശനവഴി/രീതി എന്ന അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; മേൽക്കൂര പൊളിച്ചുവെന്നോ ഓടുകൾ നീക്കിയെന്നോ മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദാംശം ചേർത്തിട്ടില്ല.
