  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: ml
  text: 'ജനക്കൂട്ടം കാരണം അവനെ അകത്തേക്കു കൊണ്ടുവരാനുള്ള വഴി കണ്ടെത്താനാകാതെ[a], അവർ മേൽക്കൂരയിൽ കയറി, മേൽക്കൂരയിലെ ഓടുകളിലൂടെ[b] അവനെ കിടപ്പുപായയോടുകൂടെ[c] നടുവിലേക്കു, യേശുവിന്റെ മുമ്പിൽ താഴ്ത്തി.


    [a] അഥവാ, ‘ജനക്കൂട്ടം കാരണം അവനെ എങ്ങനെ അകത്തേക്കു കൊണ്ടുവരണമെന്ന് കണ്ടെത്താനാകാതെ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം പ്രവേശിക്കാനുള്ള വഴിയെയോ കൊണ്ടുവരുന്ന രീതിയെയോ സൂചിപ്പിക്കാം.


    [b] അതായത്, മേൽക്കൂരയിലെ ഓടുകളിലൂടെ. ലൂക്കോസിന്റെ വാക്കുകൾ ഓടിട്ട മേൽക്കൂരയെ സൂചിപ്പിക്കുന്നു.


    [c] അഥവാ, ‘ചെറിയ കിടക്കയോടുകൂടെ’ അല്ലെങ്കിൽ ‘ചുമട്ടുകിടക്കയോടുകൂടെ.’ ഗ്രീക്ക് പദം ചെറിയൊരു കിടക്കയെയോ കിടപ്പുപായയെയോ സൂചിപ്പിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനക്കൂട്ടം കാരണം അവനെ എങ്ങനെ അകത്തേക്കു കൊണ്ടുവരണമെന്ന് കണ്ടെത്താനാകാതെ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം പ്രവേശിക്കാനുള്ള വഴിയെയോ കൊണ്ടുവരുന്ന രീതിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, മേൽക്കൂരയിലെ ഓടുകളിലൂടെ. ലൂക്കോസിന്റെ വാക്കുകൾ ഓടിട്ട മേൽക്കൂരയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘ചെറിയ കിടക്കയോടുകൂടെ’ അല്ലെങ്കിൽ ‘ചുമട്ടുകിടക്കയോടുകൂടെ.’ ഗ്രീക്ക് പദം ചെറിയൊരു കിടക്കയെയോ കിടപ്പുപായയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας
  choice: വഴി
  rationale: ഗ്രീക്ക് പദം ഇവിടെ സംക്ഷിപ്ത പ്രയോഗമായി ‘ഏതു വഴിയിലൂടെ/എങ്ങനെ’ എന്ന അർഥം നൽകുന്നു. ‘വഴി’ പ്രവേശനമാർഗത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; രീതിയെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εἰσενέγκωσιν
  choice: അകത്തേക്കു കൊണ്ടുവരാൻ
  rationale: ഉദ്ദേശിച്ച പ്രവേശനത്തെ വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പറയുന്നു; ‘ചുമന്നുകൊണ്ടുവരാൻ’ എന്നു പറഞ്ഞ് രീതിയെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: διὰ τὸν ὄχλον
  choice: ജനക്കൂട്ടം കാരണം
  rationale: διά + accusative ഇവിടെ സ്ഥലസംബന്ധമല്ല, കാരണസംബന്ധമാണ്; തടസ്സത്തിന്റെ കാരണം ജനക്കൂട്ടമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: അവർ മേൽക്കൂരയിൽ കയറി
  rationale: δῶμα വീടിന്റെ മേൽക്കൂരയെയോ മട്ടുപ്പാവിനെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: διὰ τῶν κεράμων
  choice: ഓടുകൾക്കിടയിലൂടെ
  rationale: κέραμος എന്ന പദത്തിന്റെ ബഹുവചനം മേൽക്കൂരയിലെ കളിമൺ ഓടുകളെ സൂചിപ്പിക്കുന്നു. ഓടുകൾ നീക്കിയെന്ന് മൂലപാഠത്തിൽ ഇല്ലാത്ത പ്രവൃത്തി ചേർക്കാതെ കടന്നുപോയ ഇടം വ്യക്തമാക്കുന്നു.
- source_word: καθῆκαν
  choice: താഴ്ത്തി
  rationale: മുകളിൽനിന്ന് താഴേക്കിറക്കുന്ന പ്രവൃത്തിയെ ലളിതവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: σὺν τῷ κλινιδίῳ
  choice: കിടപ്പുപായയോടുകൂടെ
  rationale: κλινίδιον ചെറിയ കിടക്കയെയോ കിടക്കാനുള്ള പായയെയോ സൂചിപ്പിക്കുന്നു. ‘കിടപ്പുപായ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; വൈദ്യോപകരണത്തിന്റെ ധ്വനി വരുത്തുന്നില്ല.
- source_word: εἰς τὸ μέσον
  choice: നടുവിലേക്കു
  rationale: കൂടിയിരുന്നവരുടെ മധ്യത്തിലുള്ള സ്ഥലത്തേക്കുള്ള ചലനം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ മുമ്പിൽ
  rationale: യേശുവിന് നേരെ മുന്നിലുള്ള സ്ഥലപരമായ സ്ഥാനം മാന്യവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
