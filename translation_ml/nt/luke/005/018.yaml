    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും രംഗത്തിന് ജീവന്തത നൽകുകയും ചെയ്യുന്ന ഗ്രീക്ക് വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἄνδρες
  choice: ചില പുരുഷന്മാർ
  rationale: ἀνήρ പ്രായപൂർത്തിയായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അനിർദ്ദിഷ്ട ബഹുവചനമായി സ്വാഭാവികമാക്കാൻ ‘ചില’ ചേർത്തിരിക്കുന്നു.
- source_word: φέροντες
  choice: ചുമന്നുകൊണ്ടുവന്നു
  rationale: നടന്നുകൊണ്ടിരുന്ന ചുമക്കൽപ്രവൃത്തിയെ വ്യക്തമാക്കുകയും ആഖ്യാനത്തിൽ മലയാളത്തിന് ആവശ്യമായ ക്രിയാരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ κλίνης
  choice: ഒരു കിടക്കയിൽ
  rationale: κλίνη കിടക്കയെയോ കിടക്കപോലുള്ള പലകയെയോ ശയനമഞ്ചത്തെയോ സൂചിപ്പിക്കാം; സന്ദർഭത്തെ അതിയായി വ്യാഖ്യാനിക്കാതെ പൊതുവായ അർഥം നൽകുന്നു.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യനെ
  rationale: ഇവിടെ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തുന്നു; അയാൾ പുരുഷനാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: παραλελυμένος
  choice: തളർവാതം പിടിച്ച
  rationale: പക്ഷാഘാതത്തിന്റെ ഫലമായി തുടരുന്ന അവസ്ഥയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐζήτουν
  choice: ശ്രമിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപത്തിലെ തുടരുന്ന ശ്രമത്തിന്റെ ഭാവം മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἰσενεγκεῖν
  choice: അകത്തേക്കു കൊണ്ടുചെന്ന്
  rationale: അവനെ അകത്തേക്ക് കൊണ്ടുവരുക എന്ന ദിശാസൂചനയും പ്രവർത്തിയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: θεῖναι
  choice: കിടത്താൻ
  rationale: കിടക്കയിൽ ചുമന്നുകൊണ്ടുവന്ന പക്ഷാഘാതബാധിതനെ യേശുവിന്റെ മുമ്പിൽ വെക്കുക എന്ന സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക ക്രിയ; ഗ്രീക്കിലെ ‘വെക്കുക’ എന്ന വിശാല അർഥത്തെ സന്ദർഭോചിതമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐνώπιον αὐτοῦ
  choice: അവന്റെ മുമ്പിൽ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ സർവനാമം നിലനിർത്തുന്നു; അതിന്റെ സൂചിതവ്യക്തി യേശുവാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വാക്യാവസാനത്തിലെ αὐτοῦ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: അവന്റെ മുമ്പിൽ
  alternative: യേശുവിന്റെ മുമ്പിൽ
  rationale: സന്ദർഭത്തിൽ സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപാഠം പേര് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ സർവനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തി സൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്നത് മൂലപാഠത്തിന്റെ ശ്രദ്ധാകർഷക സ്വരം നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലഗ്രീക്കും അടിക്കുറിപ്പുകളുടെ യഥാർഥ വിഷയവും അനുസരിച്ച് [a] ‘കിടക്കയിൽ’ എന്നതിനോടും [b] അവസാനത്തെ സർവനാമത്തോടും ചേർത്തിരിക്കുന്നു.
