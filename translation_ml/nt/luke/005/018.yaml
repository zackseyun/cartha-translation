  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: ml
  text: ഇതാ, പുരുഷന്മാർ പക്ഷാഘാതം ബാധിച്ച ഒരു മനുഷ്യനെ ഒരു കിടക്കയിൽ[a] ചുമന്നുകൊണ്ടിരുന്നു; അവനെ അകത്തേക്കു കൊണ്ടുചെന്ന് അവന്റെ മുമ്പിൽ[b] വെക്കാൻ അവർ ശ്രമിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചുമക്കുകിടക്കയിൽ’ അല്ലെങ്കിൽ ‘ശയനമഞ്ചത്തിൽ’; κλίνη എന്ന ഗ്രീക്ക് പദം കിടക്കപോലുള്ള പലകയെയോ കിടക്കയെയോ ശയനമഞ്ചത്തെയോ സൂചിപ്പിക്കാം.
