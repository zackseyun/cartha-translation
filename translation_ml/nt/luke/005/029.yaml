language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: ml
  text: ലേവി തന്റെ വീട്ടിൽ അവനുവേണ്ടി ഒരു വലിയ വിരുന്നൊരുക്കി. ചുങ്കപ്പിരിവുകാരുടെ ഒരു വലിയ കൂട്ടവും മറ്റു ചിലരും അവരോടൊപ്പം ഭക്ഷണമേശയിൽ ചാരിക്കിടന്നിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പുരാതന മെഡിറ്ററേനിയൻ ലോകത്തിലെ ഔപചാരിക വിരുന്നുകളിൽ ആളുകൾ സാധാരണയായി മേശയ്ക്കരികിൽ ചാരിക്കിടന്നാണ് ഭക്ഷിച്ചിരുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: ഒരു വലിയ വിരുന്ന്
  rationale: δοχή ഇവിടെ ആതിഥേയൻ ഒരുക്കുന്ന സദ്യയെയോ വിരുന്നിനെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പ്രയോഗമാണ് ‘വലിയ വിരുന്ന്’.
- source_word: αὐτῷ
  choice: അവനുവേണ്ടി
  rationale: സർവനാമം സമീപസന്ദർഭത്തിലെ യേശുവിനെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലുള്ള സർവനാമരൂപം നിലനിർത്തി പേര് അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: തന്റെ വീട്ടിൽ
  rationale: αὐτοῦ ലേവിയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ആശയക്കുഴപ്പമില്ലാതെ സ്വാഭാവികമായി ‘തന്റെ വീട്ടിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ὄχλος πολὺς τελωνῶν
  choice: ചുങ്കപ്പിരിവുകാരുടെ ഒരു വലിയ കൂട്ടം
  rationale: ὄχλος πολὺς എന്നതിലെ വലിയ ജനക്കൂട്ടമെന്ന ആശയം നിലനിർത്തുന്നു; τελώνης എന്ന സുവിശേഷസന്ദർഭത്തിലെ സാമൂഹികവേഷത്തിന് ‘ചുങ്കപ്പിരിവുകാരൻ’ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ പദമാണ്.
- source_word: ἄλλων
  choice: മറ്റു ചിലർ
  rationale: ഗ്രീക്ക് പദം ആരെല്ലാമെന്ന് വ്യക്തമാക്കാതെ മറ്റു ആളുകളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കാൻ ‘ചിലർ’ ചേർത്തിട്ടും ആ അനിശ്ചിതത്വം നിലനിർത്തി.
- source_word: μετ’ αὐτῶν
  choice: അവരോടൊപ്പം
  rationale: ഗ്രീക്കിലെ ബഹുവചന സർവനാമം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. അതിന്റെ കൃത്യമായ സൂചന വാചകത്തിൽ പൂർണമായി നിർണ്ണയിക്കാതെ നിലനിർത്തുന്നു.
- source_word: κατακείμενοι
  choice: ഭക്ഷണത്തിനിരിക്കുകയായിരുന്നു
  rationale: ഔപചാരിക വിരുന്നുകളിൽ ചാരിക്കിടന്ന് ഭക്ഷിക്കുന്ന പുരാതനരീതിയാണ് പദത്തിന്റെ അക്ഷരാർഥ പശ്ചാത്തലം. എന്നാൽ ആധുനിക മലയാളത്തിൽ പ്രവർത്തനവും ഭക്ഷണസന്ദർഭവും വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്; സാംസ്കാരിക വിശദാംശം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിന്റെ വാക്യബന്ധവും അനിശ്ചിതത്വവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കെ, പുരാതന ഭക്ഷണഭാവം മുഖ്യവാചകത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
