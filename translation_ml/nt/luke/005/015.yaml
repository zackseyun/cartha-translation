id: LUK.5.15
reference: Luke 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: ml
  text: എന്നാൽ അവനെക്കുറിച്ചുള്ള വാർത്ത അധികമധികം പരന്നുകൊണ്ടിരുന്നു[a]; കേൾക്കാനും തങ്ങളുടെ രോഗങ്ങളിൽനിന്ന് സൗഖ്യം പ്രാപിക്കാനുമായി നിരവധി ജനക്കൂട്ടങ്ങൾ വന്നുകൂടിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവനെക്കുറിച്ചുള്ള വാക്ക്’ അല്ലെങ്കിൽ ‘അവനെക്കുറിച്ചുള്ള വിവരം.’
    reason: λόγος എന്ന പദത്തിന് ഇവിടെ പ്രചരിച്ച വാക്ക്/വിവരം എന്ന അർഥവ്യാപ്തിയുണ്ട്.
lexical_decisions:
- source_word: διήρχετο
  choice: പരന്നു
  rationale: അപൂർണകാലരൂപം വാർത്ത തുടർച്ചയായി പ്രചരിച്ചുകൊണ്ടിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘പരന്നു’ എന്നു നൽകി.
- source_word: μᾶλλον
  choice: അധികമധികം
  rationale: മുൻപത്തേതിനെക്കാൾ വർധിച്ച വ്യാപനം സൂചിപ്പിക്കുന്ന താരതമ്യബലം നിലനിർത്തുന്നു.
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ചുള്ള വാർത്ത
  rationale: ഇവിടെ λόγος എന്നത് യേശുവിനെക്കുറിച്ച് പ്രചരിച്ച വിവരം/വാർത്തയാണ്; സാങ്കേതികമായ ദൈവശാസ്ത്ര അർഥം അനാവശ്യമായി വരാതിരിക്കാൻ ‘വാർത്ത’ തെരഞ്ഞെടുത്തു.
- source_word: συνήρχοντο
  choice: വന്നുകൂടിക്കൊണ്ടിരുന്നു
  rationale: ജനക്കൂട്ടങ്ങൾ ആവർത്തിച്ചും തുടർച്ചയായും ഒരുമിച്ചുകൂടിയെന്ന അപൂർണകാലത്തിന്റെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ὄχλοι πολλοὶ
  choice: വലിയ ജനക്കൂട്ടങ്ങൾ
  rationale: നിരവധി വലിയ കൂട്ടങ്ങൾ വന്നുകൂടിയ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀκούειν
  choice: കേൾക്കാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന അനന്തരൂപം നിലനിർത്തുന്നു; ആരെ കേൾക്കണമെന്നത് മൂലപാഠംപോലെ സന്ദർഭത്തിന് വിട്ടിരിക്കുന്നു.
- source_word: θεραπεύεσθαι
  choice: സൗഖ്യം പ്രാപിക്കാൻ
  rationale: നിഷ്ക്രിയമായ ‘സൗഖ്യമാക്കപ്പെടുക’ എന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: തങ്ങളുടെ രോഗങ്ങളിൽനിന്ന്
  rationale: ശാരീരിക രോഗങ്ങളിൽനിന്നുള്ള വിടുതൽ എന്ന സന്ദർഭാർഥവും ἀπόയുടെ ‘നിന്ന്’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: സൗഖ്യഭാഷയുടെ സ്വഭാവം
  choice: ശാരീരിക രോഗങ്ങളിൽനിന്ന് സൗഖ്യം പ്രാപിക്കുക എന്ന നേരിട്ടുള്ള അർഥം നൽകി.
  alternative: ആത്മീയ പുനഃസ്ഥാപനവും ഉൾക്കൊള്ളാമെന്ന തരത്തിൽ ‘സമ്പൂർണരാക്കപ്പെടുക’ പോലുള്ള വിശാലഭാഷ ഉപയോഗിക്കുക.
  rationale: സമീപസന്ദർഭം രോഗശാന്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ആത്മീയ സൗഖ്യം എന്ന ആശയം ഈ വാക്യം വ്യക്തമായി പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, സ്വാഭാവികവും മാന്യവുമായ ശൈലി. അപൂർണകാലത്തിന്റെ തുടർച്ചാസ്വഭാവം ‘വന്നുകൂടിക്കൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കി; മൂലപാഠത്തിലെ ഉദ്ദേശ്യഘടനയും അർഥവ്യക്തതയും നിലനിർത്തി.
