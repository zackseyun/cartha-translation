id: LUK.5.12
reference: Luke 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: ml
  text: 'അവൻ പട്ടണങ്ങളിലൊന്നിൽ ആയിരിക്കുമ്പോൾ, അതാ, കുഷ്ഠം മുഴുവൻ ബാധിച്ച ഒരാൾ[a] അവിടെയുണ്ടായിരുന്നു. അവൻ യേശുവിനെ കണ്ടപ്പോൾ കമിഴ്ന്നുവീണ് അപേക്ഷിച്ചു: “കർത്താവേ, അങ്ങേക്ക് മനസ്സുണ്ടെങ്കിൽ, എന്നെ ശുദ്ധനാക്കാൻ അങ്ങേക്ക് കഴിയും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, “കുഷ്ഠം നിറഞ്ഞ ഒരാൾ.” ഇത് അവന്റെ അവസ്ഥയുടെ ഗുരുത്വം ഊന്നിപ്പറയുന്നു. പുരാതനകാലത്തെ “കുഷ്ഠം” എന്ന പദം ഇന്നത്തെ ഹാൻസൻസ് രോഗം ഉൾപ്പെടെ വിവിധ ഗുരുതര ചർമരോഗങ്ങളെ സൂചിപ്പിക്കാമായിരുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ശുദ്ധനാക്കുക” എന്ന ക്രിയ ശാരീരിക സൗഖ്യത്തോടൊപ്പം ആചാരപരവും സാമൂഹികവുമായ ശുദ്ധീകരണത്തെയും പുനഃസ്ഥാപനത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ εἶναι αὐτὸν
  choice: അവൻ … ആയിരിക്കുമ്പോൾ
  rationale: ലൂക്കോസിന്റെ രംഗാവതരണ സൂത്രത്തെ അസ്വാഭാവികമായ പദാനുപദരൂപത്തിലാക്കാതെ, സമയബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: μιᾷ τῶν πόλεων
  choice: പട്ടണങ്ങളിലൊന്നിൽ
  rationale: πόλις എന്നത് ‘നഗരം’ എന്നും ‘പട്ടണം’ എന്നും അർഥമാക്കാം; ഇവിടെ വലിയ നഗരമെന്ന അനാവശ്യ സൂചന ഒഴിവാക്കി ഗ്രീക്കിലെ ‘ഒന്നിൽ’ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἰδοὺ
  choice: അതാ
  rationale: രംഗത്തിലെ പെട്ടെന്നുള്ള ശ്രദ്ധാകേന്ദ്രവും വിവരണത്തിന്റെ സജീവതയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πλήρης λέπρας
  choice: കുഷ്ഠം നിറഞ്ഞ ഒരു മനുഷ്യൻ
  rationale: πλήρης എന്ന തീവ്രതാസൂചന നേരിട്ട് നിലനിർത്തുകയും അവസ്ഥയുടെ ഗുരുത്വം പ്രകടമാക്കുകയും ചെയ്യുന്നു; പുരാതന λέπρα ഇന്നത്തെ ഹാൻസൻസ് രോഗത്തിൽ മാത്രം ഒതുങ്ങണമെന്നില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: കമിഴ്ന്നുവീണ്
  rationale: മുഖം നിലത്താകുന്ന വിനയത്തിന്റെയും അടിയന്തര അപേക്ഷയുടെയും ശാരീരിക ഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐδεήθη αὐτοῦ
  choice: അപേക്ഷിച്ചു
  rationale: സാധാരണ ചോദിക്കലിനെക്കാൾ തീവ്രമായ യാചനയെ മാന്യമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ആദരപൂർവമായ സംബോധനയും സന്ദർഭത്തിലെ സാധ്യമായ ക്രിസ്തുശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു, എന്നാൽ അതിന്റെ മുഴുവൻ അർഥം ഇവിടെ മാത്രം നിർണയിക്കുന്നില്ല.
- source_word: ἐὰν θέλῃς
  choice: അങ്ങേക്കു മനസ്സുണ്ടെങ്കിൽ
  rationale: യേശുവിന്റെ കഴിവിനെക്കുറിച്ചുള്ള സംശയമല്ല, അവിടുത്തെ മനസ്സിനോടുള്ള വ്യവസ്ഥയാണ് വാക്യം പ്രകടിപ്പിക്കുന്നത്; ആദരസൂചകമായ ‘അങ്ങ്’ സ്വാഭാവികമാണ്.
- source_word: δύνασαί με καθαρίσαι
  choice: എന്നെ ശുദ്ധനാക്കാൻ അങ്ങേക്കു കഴിയും
  rationale: δύναμαι എന്ന കഴിവിനെയും καθαρίζω എന്ന ശുദ്ധീകരണഭാഷയെയും സംരക്ഷിക്കുന്നു; വെറും ‘സൗഖ്യമാക്കുക’ എന്നാക്കി ശാരീരിക-ആചാരപര-സാമൂഹിക അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: λέπρα / καθαρίζω എന്ന പദങ്ങളുടെ രോഗശാന്തി-ശുദ്ധീകരണ അർഥവ്യാപ്തി
  choice: ‘കുഷ്ഠം’, ‘ശുദ്ധനാക്കുക’
  alternative: ‘ചർമരോഗം’, ‘സൗഖ്യമാക്കുക’
  rationale: ഗ്രീക്ക് പാഠം ശാരീരിക രോഗാവസ്ഥയ്ക്കൊപ്പം ആചാരപരവും സാമൂഹികവുമായ പുനഃസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്ന ശുദ്ധീകരണഭാഷ ഉപയോഗിക്കുന്നു. ‘ശുദ്ധനാക്കുക’ ആ പിരിമുറുക്കം നിലനിർത്തുന്നു; ‘കുഷ്ഠം’ പരിചിതമായ പരമ്പരാഗത പദമാണെങ്കിലും അതിന്റെ പുരാതന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: യേശുവിനോടുള്ള κύριος എന്ന സംബോധന
  choice: കർത്താവേ
  alternative: ഗുരുവേ / യജമാനനേ
  rationale: ‘കർത്താവേ’ ആദരപൂർവമായ നേരിട്ടുള്ള സംബോധനയും സാധ്യമായ ക്രിസ്തുശാസ്ത്രപരമായ സൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു; എന്നാൽ ഈ സന്ദർഭം മാത്രം അതിന്റെ പരമാവധി ദൈവശാസ്ത്രാർഥം നിർബന്ധിക്കുന്നതായി വിവർത്തനം ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതാ’ ലൂക്കോസിന്റെ ശ്രദ്ധാകർഷക പ്രയോഗം നിലനിർത്തുന്നു. യേശുവിനോടുള്ള സംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മുഖ്യവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
