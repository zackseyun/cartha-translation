id: LUK.5.9
reference: Luke 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θάμβος γὰρ περιέσχεν αὐτὸν καὶ πάντας τοὺς σὺν αὐτῷ ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων ⸀ὧν συνέλαβον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: ml
  text: എന്തെന്നാൽ, അവർ പിടിച്ച മീനുകളുടെ പിടിത്തം നിമിത്തം വിസ്മയം അവനെയും അവനോടുകൂടെ ഉണ്ടായിരുന്ന എല്ലാവരെയും കീഴടക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θάμβος
  choice: വിസ്മയം
  rationale: പെട്ടെന്നുണ്ടായ അതിശക്തമായ അമ്പരപ്പിനെയും അത്ഭുതബോധത്തെയും സൂചിപ്പിക്കുന്ന പദം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ശിമോന്റെ പ്രതികരണത്തിനുള്ള കാരണം ഈ വാക്യം വിശദീകരിക്കുന്നതിനാൽ വിശദീകരണബന്ധം വ്യക്തമാക്കി.
- source_word: περιέσχεν
  choice: വിസ്മയത്താൽ സ്തംഭിച്ചുപോയിരുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന ആശയം ചുറ്റിപ്പിടിക്കുക/കീഴടക്കുക എന്നതാണ്. വികാരത്തോടൊപ്പം ഉപയോഗിച്ചിരിക്കുന്ന ഇവിടെ, വിസ്മയം അവരെ പൂർണമായി കീഴടക്കിയെന്ന ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: കൂടെയുണ്ടായിരുന്ന എല്ലാവരും
  rationale: ശിമോനോടൊപ്പം ഉണ്ടായിരുന്ന മുഴുവൻ ആളുകളെയും ഉൾക്കൊള്ളുന്ന കൂട്ടായ വ്യാപ്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: പിടിച്ച മീനുകളുടെ പെരുപ്പം കണ്ട്
  rationale: ἐπί ഇവിടെ പ്രതികരണത്തിന്റെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു; ἄγρα മത്സ്യബന്ധനത്തിൽ ലഭിച്ച പിടിത്തമാണ്. അസാധാരണമായ പിടിത്തം എന്ന സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ 'പെരുപ്പം' ഉപയോഗിച്ചു.
- source_word: ὧν συνέλαβον
  choice: അവർ പിടിച്ച
  rationale: ബന്ധസർവനാമം മീനുകളിലേക്കാണ് മടങ്ങുന്നത്; ബഹുവചന ക്രിയ കൂട്ടായ പങ്കാളിത്തം നിലനിർത്തുന്നു. മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായി മുൻപുള്ള നാമത്തെ വിശേഷിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. γὰρ-ന്റെ വിശദീകരണബന്ധം നിലനിർത്തി. വികാരം 'പിടിച്ചു' എന്ന അക്ഷരാർഥപ്രയോഗത്തിനു പകരം അതിന്റെ കീഴടക്കുന്ന ശക്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ നൽകി.
