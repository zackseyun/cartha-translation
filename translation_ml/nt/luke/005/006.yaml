  source_fidelity: ‘അവർ അങ്ങനെ ചെയ്തപ്പോൾ’ correctly renders the preceding aorist participle temporally. ‘അനവധി മീനുകളെ വലയിൽ അകപ്പെടുത്തി’ preserves the enclosing/hemming-in image of συνέκλεισαν rather than reducing it simply to catching fish, and adequately conveys the emphatic large quantity. ‘അവരുടെ വലകൾ കീറിക്കൊണ്ടിരുന്നു’ retains both the plural possessive and the imperfect’s ongoing action without implying that the nets had already completely torn apart.
