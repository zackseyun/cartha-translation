id: LUK.5.6
reference: Luke 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τοῦτο ποιήσαντες συνέκλεισαν πλῆθος ἰχθύων πολύ, ⸀διερρήσσετο δὲ ⸂τὰ δίκτυα⸃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: ml
  text: അവർ അങ്ങനെ ചെയ്തപ്പോൾ[a] അനവധി മീനുകളെ വലയിൽ അകപ്പെടുത്തി; അവരുടെ വലകൾ കീറിക്കൊണ്ടിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഇതു ചെയ്തപ്പോൾ.’ മുൻവാക്യത്തിലെ യേശുവിന്റെ നിർദേശം അനുസരിച്ചതിനെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.'
    reason: referential_clarity
  - marker: b
    text: ‘അവരുടെ വലകൾ കീറാൻ തുടങ്ങിയിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ അപൂർണ്ണഭൂതകാലക്രിയ കീറൽ നടന്നുകൊണ്ടിരിക്കുകയായിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു; വലകൾ പൂർണമായി കീറിപ്പോയെന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: അവർ അങ്ങനെ ചെയ്തപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ നിർദേശം അനുസരിച്ചതിനെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ കാലബന്ധത്തോടെ പരിഭാഷപ്പെടുത്തി.
- source_word: συνέκλεισαν
  choice: വലയിൽ അകപ്പെടുത്തി
  rationale: മീനുകളെ ചുറ്റി ഉള്ളിലാക്കുക എന്ന ക്രിയയുടെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; വെറും ‘പിടിച്ചു’ എന്നതിലേക്കു അർഥം ചുരുക്കുന്നില്ല.
- source_word: πλῆθος ἰχθύων πολύ
  choice: അനവധി മീനുകളെ
  rationale: πλῆθος-ഉം πολύ-വും ചേർന്നുള്ള വലിയ അളവിന്റെ ഊന്നൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διερρήσσετο
  choice: കീറിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന പുരോഗമിച്ചുകൊണ്ടിരുന്ന കീറൽ നിലനിർത്തുന്നു; വലകൾ പൂർണമായി കീറിപ്പോയെന്നു പറയുന്നില്ല.
- source_word: τὰ δίκτυα αὐτῶν
  choice: അവരുടെ വലകൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനവും ഉടമസ്ഥതയും നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വലയിൽ അകപ്പെടുത്തി’ എന്ന പ്രയോഗം συνέκλεισαν എന്ന ക്രിയയിലെ ചുറ്റിയടയ്ക്കുന്ന ദൃശ്യഭാവം വ്യക്തമാക്കാൻ ഉപയോഗിച്ചു.
