id: LUK.5.14
reference: Luke 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: ml
  text: 'അവൻ അവനോട് ആരോടും പറയരുതെന്ന് കൽപ്പിച്ചു: “എന്നാൽ, പോയി നിന്നെത്തന്നെ പുരോഹിതനു കാണിച്ചുകൊടുക്കുക; നിന്റെ ശുദ്ധീകരണത്തിനായി മോശ കല്പിച്ചതുപോലെ[b] അർപ്പണം അർപ്പിക്കുക, അവർക്കൊരു സാക്ഷ്യമായി[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർ’ ആരാണെന്ന് മൂലവാചകം വ്യക്തമാക്കുന്നില്ല; ഇത് പുരോഹിതന്മാർക്കോ മറ്റുള്ളവർക്കോ ഉള്ള സാക്ഷ്യമായിരിക്കാം. ചിലർ ഇതിനെ അവർക്കെതിരായ തെളിവായും മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ത്വഗ്രോഗത്തിൽനിന്നുള്ള ശുദ്ധീകരണത്തിനായി മോശ കല്പിച്ച അർപ്പണത്തെക്കുറിച്ച് ലേവ്യപുസ്തകം 14 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: παρήγγειλεν
  choice: കൽപ്പിച്ചു
  rationale: അധികാരപൂർവമായ നേരിട്ടുള്ള നിർദേശം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത അധിക തീവ്രത ചേർക്കുന്നില്ല.
- source_word: μηδενὶ εἰπεῖν
  choice: ആരോടും പറയരുതെന്ന്
  rationale: നിഷേധാർഥക ദാതിവും infinitive ഘടനയും സ്വാഭാവിക മലയാള വിലക്കായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀπελθὼν
  choice: പോയി
  rationale: തുടർന്നുള്ള കല്പനയ്ക്കു മുൻപുള്ള പ്രവർത്തനക്രമം സൂക്ഷിച്ചുകൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: നിന്നെത്തന്നെ പുരോഹിതനു കാണിച്ചുകൊടുക്കുക
  rationale: പ്രത്യക്ഷമായ ക്രിയയും reflexive ഊന്നലും നിലനിർത്തുന്നു; നിയമപരിശോധനയെന്ന വ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: προσένεγκε
  choice: അർപ്പണം അർപ്പിക്കുക
  rationale: യാഗാരാധനാസന്ദർഭത്തിലെ സമർപ്പണാർഥം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ഒറ്റയായ ‘അർപ്പിക്കുക’ എന്നതിനെക്കാൾ ആവശ്യമായ കർമം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: നിന്റെ ശുദ്ധീകരണത്തിനായി
  rationale: നിയമാനുസൃത ശുദ്ധീകരണവുമായി ബന്ധപ്പെട്ട അർപ്പണത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന പ്രയോഗം.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: മോശ കല്പിച്ചതുപോലെ
  rationale: മോശ മുഖേന ലഭിച്ച നിയമനിർദേശം നേരായും സംക്ഷിപ്തമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: അത് അവർക്കൊരു സാക്ഷ്യമായിരിക്കട്ടെ
  rationale: ‘അവർ’ ആരാണെന്നതും സാക്ഷ്യം അനുകൂലമോ പ്രതികൂലമോ എന്നതും നിർണ്ണയിക്കാതെ ഗ്രീക്കിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς എന്നതിലെ ‘അവർ’ എന്ന സർവനാമത്തിന്റെ സൂചനയും സാക്ഷ്യത്തിന്റെ ഭാവവും
  choice: ‘അവർക്കൊരു സാക്ഷ്യമായി’ എന്നു പറഞ്ഞ് സൂചന തുറന്നുവെച്ചു.
  alternative: പുരോഹിതന്മാർക്കുള്ള സാക്ഷ്യം; ജനങ്ങൾക്കുള്ള സാക്ഷ്യം; അവർക്കെതിരായ തെളിവ്.
  rationale: ഗ്രീക്ക് വാചകം ആ കൂട്ടത്തെ വ്യക്തമായി നിർണ്ണയിക്കുന്നില്ല; സാക്ഷ്യത്തിന് അനുകൂല, തെളിവാത്മക, പ്രതികൂല ഭാവങ്ങൾ സാധ്യമാണ്. വിവർത്തനം അവയിൽ ഒന്നിനെ നിർബന്ധിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും സാധാരണ വായനാസൗകര്യവും ചേർന്ന മലയാളം. നേരിട്ടുള്ള ഉദ്ധരണിയിലൂടെ കല്പനകളുടെ പ്രവാഹം വ്യക്തമാക്കിയിരിക്കുന്നു. ‘കുഷ്ഠം’ എന്ന പദം ഈ വാക്യത്തിൽ മൂലത്തിൽ ഇല്ലാത്തതിനാൽ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല; കുറിപ്പിൽ വിശാലമായ ‘ത്വഗ്രോഗം’ ഉപയോഗിച്ചു. എല്ലാ കുറിപ്പടയാളങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
