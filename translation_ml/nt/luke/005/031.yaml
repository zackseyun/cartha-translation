  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “ആരോഗ്യമുള്ളവർക്കല്ല വൈദ്യനെ ആവശ്യം, രോഗികൾക്കാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സുഖമില്ലാത്തവർക്കാണ്.” ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പദശഃ അർഥം “മോശമായ നിലയിലുള്ളവർ” എന്നാണ്; രോഗികളായിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: യേശു അവരോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്ക് ആഖ്യാനത്തിലെ പങ്കാളിക്രിയയും മുഖ്യക്രിയയും ചേർന്ന പ്രതികരണസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; അഭിസംബോധിതരായ αὐτούς എന്നതും നിലനിർത്തുന്നു.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: ആവശ്യം ... അല്ല
  rationale: χρείαν ἔχειν എന്ന ‘ആവശ്യമുണ്ടായിരിക്കുക’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ വിരുദ്ധഘടനയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ ὑγιαίνοντες
  choice: ആരോഗ്യമുള്ളവർ
  rationale: ആരോഗ്യാവസ്ഥയിലുള്ള ആളുകളെ സൂചിപ്പിക്കുന്ന substantival participle-ന്റെ അർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἰατροῦ
  choice: വൈദ്യനെ
  rationale: ἰατρός എന്നതിന് യോജിച്ച, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പദം.
- source_word: οἱ κακῶς ἔχοντες
  choice: രോഗികൾ
  rationale: പദശഃ ‘മോശമായി ഇരിക്കുന്നവർ’ എന്ന ഗ്രീക്ക് പ്രയോഗം സന്ദർഭത്തിൽ രോഗികളെന്നർഥമുള്ള ശൈലിയാണ്; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘രോഗികൾ’ ഉപയോഗിക്കുന്നു.
theological_decisions: []
