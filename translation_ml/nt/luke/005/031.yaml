  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പഴഞ്ചൊല്ലുസദൃശ ശൈലി. ഗ്രീക്കിലെ ‘അല്ല ... എന്നാൽ’ എന്ന വൈരുധ്യം മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായ ‘അല്ല ... ആണ്’ ഘടനയിൽ നിലനിർത്തിയിരിക്കുന്നു.
