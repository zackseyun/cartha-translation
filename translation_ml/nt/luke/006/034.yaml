revisions:
- from: തിരികെ ലഭിക്കുമെന്ന് പ്രതീക്ഷിക്കുന്നവർക്കു നിങ്ങൾ കടം കൊടുക്കുന്നെങ്കിൽ, അതിൽ നിങ്ങൾക്ക് എന്തു പ്രശംസയാണുള്ളത്?[a] പാപികൾപോലും കൊടുത്തതിനു തുല്യമായതു തിരികെ ലഭിക്കാൻ പാപികൾക്കു കടം കൊടുക്കുന്നു.
