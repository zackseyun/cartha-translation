id: LUK.6.34
reference: Luke 6:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: ml
  text: ആരിൽനിന്ന് തിരികെ ലഭിക്കുമെന്ന് നിങ്ങൾ പ്രതീക്ഷിക്കുന്നുവോ അവർക്കു നിങ്ങൾ കടം കൊടുക്കുന്നെങ്കിൽ, അതിൽ നിങ്ങൾക്കു എന്തു അംഗീകാരമാണുള്ളത്?[a] പാപികൾപോലും തങ്ങൾ കൊടുത്തതിനു തുല്യമായത് തിരികെ ലഭിക്കാൻ പാപികൾക്കു കടം കൊടുക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിൽ നിങ്ങൾക്കു എന്തു നന്ദിയാണുള്ളത്?” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദത്തിന് “നന്ദി” എന്നും അർഥമാകാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് പ്രശംസാർഹതയെയോ അനുകൂലമായ വിലയിരുത്തലിനെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: കടം കൊടുക്കുക
  rationale: പണമോ സാധനങ്ങളോ മറ്റൊരാൾക്ക് തിരിച്ചുകിട്ടുമെന്ന വ്യവസ്ഥയിൽ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: παρ’ ὧν
  choice: പ്രതീക്ഷിക്കുന്നവർക്കു
  rationale: കടം നൽകുന്നത് അവർക്കും തിരിച്ചുകിട്ടുന്നത് അവരിൽനിന്നുമാണെന്ന ബന്ധം തുടർന്നുള്ള ‘തിരികെ ലഭിക്കുമെന്ന്’ എന്ന പ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: ἐλπίζετε λαβεῖν
  choice: തിരികെ ലഭിക്കുമെന്ന് പ്രതീക്ഷിക്കുന്ന
  rationale: ἐλπίζω ഇവിടെ വെറും ആഗ്രഹത്തേക്കാൾ പ്രതീക്ഷിക്കുന്ന തിരിച്ചടവിനെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭം ആവശ്യപ്പെടുന്ന തിരിച്ചുകിട്ടൽ ‘തിരികെ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ποία ... χάρις ἐστίν
  choice: എന്തു പ്രശംസയാണുള്ളത്?
  rationale: χάρις ഇവിടെ രക്ഷാകരമായ കൃപയല്ല, പ്രശംസാർഹതയോ അനുകൂലമായ വിലയിരുത്തലോ ആണ്. ‘പ്രശംസ’ സാധാരണ വായനക്കാർക്ക് ആ ആശയം വ്യക്തമായി നൽകുന്നു; പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἁμαρτωλοὶ
  choice: പാപികൾ
  rationale: ലൂക്കോസ് ഉപയോഗിക്കുന്ന ധാർമിക വിഭാഗത്തെ നേരിട്ടും പാരമ്പര്യപരമായും വ്യക്തമാക്കുന്ന മലയാളപദം.
- source_word: ἵνα ἀπολάβωσιν
  choice: തിരികെ ലഭിക്കാൻ
  rationale: നൽകിയത് മടക്കിപ്പറ്റുക എന്ന ἀπολαμβάνωയുടെ സന്ദർഭോചിത അർഥം ലളിതമായി നൽകുന്നു.
- source_word: τὰ ἴσα
  choice: കൊടുത്തതിനു തുല്യമായതു
  rationale: പലിശയോ ലാഭമോ സൂചിപ്പിക്കാതെ തുല്യമായ തിരിച്ചടവ് എന്ന അർഥം നിലനിർത്തുന്നു; പണമല്ലാത്ത സാധനങ്ങളും ഉൾക്കൊള്ളാവുന്ന വിധത്തിൽ ‘തുക’ എന്നതിനെക്കാൾ വിശാലമാണ്.
theological_decisions:
- issue: യേശുവിന്റെ ചോദ്യത്തിലെ χάρις എന്ന പദത്തിന്റെ അർഥം
  choice: രക്ഷാകരമായ ‘കൃപ’ എന്നല്ല, പ്രശംസാർഹത എന്ന അർഥത്തിൽ ‘പ്രശംസ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നന്ദി’ അല്ലെങ്കിൽ ‘കൃപ’
  rationale: ശിഷ്യരുടെ പ്രവൃത്തി പാപികളുടെ പരസ്പരസഹായത്തിൽനിന്ന് എങ്ങനെ വ്യത്യസ്തമാകുന്നു എന്നതാണ് സമീപസന്ദർഭത്തിലെ ചോദ്യം. എന്നാൽ ‘നന്ദി’ എന്ന യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: കടത്തിന് പ്രതീക്ഷിക്കുന്ന തിരിച്ചടവിന്റെ സ്വഭാവം
  choice: ‘കൊടുത്തതിനു തുല്യമായതു തിരികെ ലഭിക്കാൻ’ എന്ന നിഷ്പക്ഷ പ്രയോഗം.
  alternative: പലിശയോടെയോ ലാഭത്തോടെയോ പൂർണ തിരിച്ചടവ് ലഭിക്കുക
  rationale: τὰ ἴσα തുല്യമായ തിരിച്ചുനൽകലിനെയാണ് സൂചിപ്പിക്കുന്നത്; പലിശ, ലാഭം, പലിശപ്പണം എന്നിവയെക്കുറിച്ചുള്ള ആശയങ്ങൾ മൂലപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സാമ്പത്തിക സാങ്കേതികഭാഷയും സഭാവിഭാഗപരമായ വ്യാഖ്യാനവും ഒഴിവാക്കി; മൂലപാഠത്തിലെ ആവർത്തനവും നൈതികമായ താരതമ്യവും നിലനിർത്തി.
