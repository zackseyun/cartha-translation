  source_fidelity: 'ഗ്രീക്ക് വാക്യത്തിന്റെ പ്രധാന ഘടകങ്ങൾ വിശ്വസ്തമായി നിലനിർത്തിയിരിക്കുന്നു: കേട്ടെങ്കിലും പ്രവർത്തിക്കാതിരിക്കുക, അടിത്തറയില്ലാതെ നിലത്തിന്മേൽ വീട് പണിയുക, നദിയുടെ ശക്തമായ ആഘാതം, ഉടനടിയുള്ള തകർച്ച, വലിയ നാശം എന്നിവയെല്ലാം വ്യക്തമാണ്. ‘അതനുസരിച്ച് പ്രവർത്തിക്കാതിരുന്നവൻ’ ποιήσας എന്ന ലളിതക്രിയയെ സന്ദർഭോചിതമായി വ്യാഖ്യാനിക്കുന്നുവെങ്കിലും ഇംഗ്ലീഷ് POB-യിലെ ‘did not act’ എന്ന തീരുമാനത്തോടും യേശുവിന്റെ മുൻവാക്കുകളുടെ സന്ദർഭത്തോടും യോജിക്കുന്നു.'
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വായനാസുഖമുള്ളതുമാണ്. ‘നദി ആ വീടിന്മേൽ ആഞ്ഞടിച്ചപ്പോൾ’ എന്ന പ്രയോഗം προσέρηξεν-ന്റെ ശക്തമായ ഇടിച്ചുകയറ്റം നന്നായി അറിയിക്കുന്നു; ‘ഉടനെ തകർന്നുവീണു’ എന്നും സ്വാഭാവികമാണ്.
  terminology: ‘അടിത്തറ,’ ‘നിലം,’ ‘വീട്,’ ‘നാശം’ എന്നിവ സന്ദർഭത്തിന് യോജിച്ച സ്ഥിരതയുള്ള പദങ്ങളാണ്. ‘ഒരു മനുഷ്യനെപ്പോലെയാണ്’ എന്നത് ഉപമയിലെ പുരുഷലിംഗ ഏകവചനചിത്രണം നിലനിർത്തുന്നു. അടിക്കുറിപ്പുകൾ ഇംഗ്ലീഷ് audit trail-ലുള്ള പദാർഥപരമായ സാധ്യതകൾ യഥാക്രമം നൽകുന്നു.
