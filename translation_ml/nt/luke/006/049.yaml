id: LUK.6.49
reference: Luke 6:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: ml
  text: എന്നാൽ കേട്ടിട്ടും അതനുസരിച്ച് പ്രവർത്തിക്കാതിരുന്നവൻ[a], അടിത്തറയില്ലാതെ നിലത്തിന്മേൽ വീടുപണിത ഒരു മനുഷ്യനെപ്പോലെയാണ്. നദി ആ വീടിന്മേൽ ആഞ്ഞടിച്ചപ്പോൾ അത് ഉടനെ തകർന്നുവീണു; ആ വീടിന്റെ നാശം വലുതായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചെയ്യാതിരുന്നവൻ’ അല്ലെങ്കിൽ ‘കേട്ടത് പ്രാവർത്തികമാക്കാതിരുന്നവൻ.’ ഗ്രീക്കിൽ ഉപയോഗിച്ചിരിക്കുന്നത് ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന സാധാരണ ക്രിയയാണ്; ഇവിടെ യേശുവിന്റെ വാക്കുകൾക്കനുസരിച്ച് പ്രവർത്തിക്കുന്നതിനെ അതു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ആ വീടിന്റെ പിളർപ്പ് വലുതായിരുന്നു’ അല്ലെങ്കിൽ ‘ആ വീടിന്റെ തകർച്ച വലുതായിരുന്നു.’ ഗ്രീക്ക് പദത്തിന് പൊട്ടൽ, പിളർപ്പ്, തകർച്ച, അതിന്റെ ഫലമായ നാശം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: എന്നാൽ കേട്ടിട്ടും അതനുസരിച്ച് പ്രവർത്തിക്കാതിരുന്നവൻ
  rationale: കേൾക്കുന്നതും ചെയ്യുന്നതും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തുന്നു. ποιέω എന്ന ലളിതമായ ‘ചെയ്യുക’ എന്ന ക്രിയ ഇവിടെ യേശുവിന്റെ വാക്കുകൾക്കനുസരിച്ച് പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘അതനുസരിച്ച് പ്രവർത്തിക്കുക’ എന്നു നൽകി.
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: ഒരു മനുഷ്യനെപ്പോലെയാണ്
  rationale: ഉറവിടത്തിലെ ഏകവചനത്തിലുള്ള പ്രതിനിധാനപരമായ മനുഷ്യരൂപവും ഉപമയുടെ നേരിട്ടുള്ള സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: അടിത്തറയില്ലാതെ നിലത്തിന്മേൽ വീടുപണിത
  rationale: γῆ ഇവിടെ ഭൂഗോളം എന്നതിലുപരി പണിയുന്ന നിലത്തെ സൂചിപ്പിക്കുന്നു; χωρὶς θεμελίου നേരിട്ട് ‘അടിത്തറയില്ലാതെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: നദി ആ വീടിന്മേൽ ആഞ്ഞടിച്ചപ്പോൾ
  rationale: προσρήγνυμι സൂചിപ്പിക്കുന്ന ശക്തമായ ആഘാതം ‘ആഞ്ഞടിച്ചു’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; ബന്ധവാക്യം സ്വാഭാവിക മലയാളത്തിനായി കാലവാക്യമായി നൽകിയിരിക്കുന്നു.
- source_word: εὐθὺς συνέπεσεν
  choice: അത് ഉടനെ തകർന്നുവീണു
  rationale: സന്ദർഭത്തിൽ συμπίπτω ഒരു കെട്ടിടം ഇടിഞ്ഞുവീഴുന്നതിനെ സൂചിപ്പിക്കുന്നു; εὐθύς എന്നതിന്റെ തൽക്ഷണത ‘ഉടനെ’ നിലനിർത്തുന്നു.
- source_word: τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: ആ വീടിന്റെ നാശം വലുതായിരുന്നു
  rationale: ῥῆγμα എന്നത് പൊട്ടൽ, പിളർപ്പ്, തകർച്ച, അതിന്റെ ഫലമായ നാശം എന്നിവ സൂചിപ്പിക്കാം. വീട് ഇതിനകം തകർന്നുവീണതായി പറഞ്ഞിരിക്കുന്ന സാഹചര്യത്തിൽ ‘നാശം’ സ്വാഭാവികവും ഫലത്തെ വ്യക്തമായി അറിയിക്കുന്നതുമാണ്; μέγα എന്നത് ‘വലുതായിരുന്നു’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: ഉപമയിലെ പ്രതിനിധാനപരമായ പുല്ലിംഗ ഏകവചനം
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരു വ്യക്തി
  rationale: ἀνθρώπῳ എന്ന ഏകവചനരൂപത്തിലെ മനുഷ്യനെക്കുറിച്ചുള്ള പൊതുവായ പ്രതിനിധാനം ലിംഗഭേദം അനാവശ്യമായി ഊന്നാതെ ‘ഒരു മനുഷ്യൻ’ എന്ന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- issue: കേൾക്കുകയും ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നതിന്റെ ബന്ധം
  choice: അതനുസരിച്ച് പ്രവർത്തിക്കാതിരുന്നവൻ
  alternative: ചെയ്യാതിരുന്നവൻ
  rationale: ഇവിടെ ‘ചെയ്യുക’ എന്നത് യേശുവിന്റെ വാക്കുകൾ പ്രവൃത്തിയിൽ കൊണ്ടുവരുന്നതാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു. ‘അതനുസരിച്ച്’ എന്നത് സൂചിതബന്ധം വ്യക്തമാക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘ആഞ്ഞടിച്ചു,’ ‘തകർന്നുവീണു’ എന്നീ പ്രയോഗങ്ങൾ ദൃശ്യത്തിന്റെ ശക്തി നിലനിർത്തുമ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി.
