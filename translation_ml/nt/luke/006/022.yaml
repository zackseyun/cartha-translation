id: LUK.6.22
reference: Luke 6:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: ml
  text: മനുഷ്യപുത്രൻ നിമിത്തം മനുഷ്യർ നിങ്ങളെ വെറുക്കുകയും, നിങ്ങളെ ഒഴിവാക്കുകയും, നിന്ദിക്കുകയും, നിങ്ങളുടെ പേരിനെ ദുഷ്ടമെന്നു പറഞ്ഞ് തള്ളിക്കളയുകയും ചെയ്യുമ്പോൾ നിങ്ങൾ ഭാഗ്യവാന്മാർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μακάριοί
  choice: ഭാഗ്യവാന്മാർ
  rationale: സുവിശേഷങ്ങളിലെ സൗഭാഗ്യപ്രഖ്യാപനത്തിന്റെ പരിചിതമായ ഭാവവും ദൈവിക അംഗീകാരത്തിന്റെ ഭാരവും നിലനിർത്തുന്നു; വെറും മാനസിക സന്തോഷത്തെ സൂചിപ്പിക്കുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: ὅταν
  choice: ചെയ്യുമ്പോൾ
  rationale: ഉപവാക്യങ്ങളിലെ അനിശ്ചിത ഭാവിസാഹചര്യം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: μισήσωσιν
  choice: വെറുക്കുകയും
  rationale: ശത്രുതയുടെയും വിദ്വേഷത്തിന്റെയും ശക്തമായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: οἱ ἄνθρωποι
  choice: മനുഷ്യർ
  rationale: ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, പൊതുവായി ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀφορίσωσιν
  choice: സമൂഹത്തിൽനിന്ന് അകറ്റിനിർത്തുകയും
  rationale: വെറും സ്ഥലപരമായ വേർതിരിവിനെക്കാൾ ഈ പീഡനസന്ദർഭത്തിലെ സാമൂഹിക ബഹിഷ്കരണം വ്യക്തമാക്കുന്നു.
- source_word: ὀνειδίσωσιν
  choice: നിന്ദിക്കുകയും
  rationale: അപമാനകരമായ വാക്കുകളാലുള്ള അധിക്ഷേപം ദിഗ്നമായ ആധുനിക ഭാഷയിൽ നൽകുന്നു.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν
  choice: നിങ്ങളുടെ പേരിനെ … പറഞ്ഞ് തള്ളിക്കളയുകയും
  rationale: പേരിനെയോ സൽപ്പേരിനെയോ പൊതുവായി നിരാകരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: ὡς πονηρὸν
  choice: ദുഷ്ടമെന്നു
  rationale: അവരെ ധാർമികമായി ദുഷിച്ചവരായി മുദ്രകുത്തുന്ന വിലയിരുത്തൽ സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: ἕνεκα
  choice: നിമിത്തം
  rationale: ഈ ശത്രുതയുടെ കാരണം സൂചിപ്പിക്കുന്ന, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്ഥാപിതമായ സ്വയംവിശേഷണം നിലനിർത്തുകയും അതിന്റെ സുവിശേഷപരവും ദാനിയേൽഗ്രന്ഥപരവുമായ പ്രതിധ്വനികൾ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν എന്ന പ്രയോഗം
  choice: “നിങ്ങളുടെ പേരിനെ ദുഷ്ടമെന്നു പറഞ്ഞ് തള്ളിക്കളയുക” എന്ന ദൃശ്യപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: “നിങ്ങളെ ദുഷ്ടരെന്നു പരസ്യമായി മുദ്രകുത്തുക”
  rationale: ഈ വാക്കുകൾ വ്യക്തിയെയോ അവരുടെ സൽപ്പേരിനെയോ പൊതുവായി നിരാകരിക്കുന്നതിനെ സൂചിപ്പിച്ചേക്കാം. കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പരിഭാഷയിൽ ഒതുക്കാതെ ഗ്രീക്കിലെ ‘പേര്’ എന്ന ഘടകം സംരക്ഷിച്ചു.
- issue: οἱ ἄνθρωποι എന്നതിന്റെ പൊതുവായ അർഥം
  choice: “മനുഷ്യർ”
  alternative: “പുരുഷന്മാർ”
  rationale: സന്ദർഭം ഒരു ലിംഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; സമൂഹത്തിലെ ആളുകളെ പൊതുവായാണ് ഉദ്ദേശിക്കുന്നത്.
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπου എന്ന പദവി
  choice: “മനുഷ്യപുത്രൻ”
  alternative: “മനുഷ്യനായവൻ”
  rationale: സുവിശേഷങ്ങളിൽ യേശുവിന്റെ സ്ഥാപിതമായ പദവിയും അതിന്റെ അന്തർഗ്രന്ഥബന്ധങ്ങളും നിലനിർത്തുന്നു.
- issue: ἕνεκα എന്ന കാരണസൂചനയുടെ വ്യാപ്തി
  choice: മുഴുവൻ പീഡനപ്പട്ടികയെയും “മനുഷ്യപുത്രൻ നിമിത്തം” എന്ന കാരണവുമായി ബന്ധിപ്പിച്ചു.
  alternative: അവസാനത്തെ പേര് തള്ളിക്കളയുന്ന പ്രവൃത്തിയുമായി മാത്രം നേരിട്ട് ബന്ധിപ്പിക്കുക
  rationale: ഗ്രീക്ക് വാക്യത്തിന്റെ അവസാനം വരുന്ന കാരണപ്രയോഗം മുൻപുള്ള മുഴുവൻ ശത്രുതാപരമായ പ്രവർത്തനങ്ങളുടെയും അടിസ്ഥാനകാരണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ ഇടക്കുറിപ്പ് ആ വ്യാപ്തി തെളിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. സൗഭാഗ്യപ്രഖ്യാപനത്തിന്റെ പരിചിതമായ “ഭാഗ്യവാന്മാർ” എന്ന രൂപം ഉപയോഗിച്ചു. ദീർഘമായ പീഡനപ്പട്ടികയും അവസാന കാരണവാക്യവും വ്യക്തമായി ബന്ധിപ്പിക്കാൻ ഡാഷുകളുള്ള ഇടക്കുറിപ്പ് ഉപയോഗിച്ചു.
