- from: മനുഷ്യർ നിങ്ങളെ വെറുക്കുകയും സമൂഹത്തിൽനിന്ന് അകറ്റിനിർത്തുകയും നിന്ദിക്കുകയും നിങ്ങളുടെ പേരിനെ ദുഷ്ടമെന്നു പറഞ്ഞ് തള്ളിക്കളയുകയും[a] ചെയ്യുമ്പോൾ—മനുഷ്യപുത്രൻ നിമിത്തമാണ് ഇതെല്ലാം സംഭവിക്കുന്നതെങ്കിൽ—നിങ്ങൾ ഭാഗ്യവാന്മാർ.
