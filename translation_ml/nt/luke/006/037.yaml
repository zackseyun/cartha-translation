review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the three paired imperatives and consequences, as well as the emphatic force of οὐ μή through ‘ഒരിക്കലും ... ഇല്ല.’ ‘വിട്ടയയ്ക്കുക’ is a defensible broad rendering of ἀπολύετε, with the contextual ‘forgive’ reading properly retained in a note. However, ‘കുറ്റം വിധിക്കുക’ and especially its passive counterpart are not idiomatic Malayalam equivalents of καταδικάζω / καταδικασθῆτε; the Greek concerns condemning a person, not judging a crime.
  naturalness: The first and third pairs are clear in modern standard Malayalam. Removing ‘നിങ്ങളും’ improves fidelity because the Greek does not expressly add ‘also,’ and changing the second pair to ‘കുറ്റക്കാരെന്നു വിധിക്കുക’ makes the escalation from general judging to condemning natural and intelligible.
  terminology: ‘വിധിക്കുക’ suitably renders κρίνω. ‘കുറ്റക്കാരെന്നു വിധിക്കുക’ naturally expresses καταδικάζω (‘condemn/pronounce guilty’) and maintains the intended semantic intensification. ‘വിട്ടയയ്ക്കുക’ is retained as the text’s deliberately broad lexical choice; the footnote gives ‘ക്ഷമിക്കുക’ as the contextual alternative.
  issues:
  - severity: medium
    issue: The rendering ‘കുറ്റം വിധിക്കരുത്; ... കുറ്റം വിധിക്കപ്പെടുകയില്ല’ is semantically and idiomatically unsuitable.
    rationale: In Malayalam, one may judge or decide a case/crime, but καταδικάζω here means to condemn a person or pronounce someone guilty. The passive likewise must refer to being condemned, not to a crime being judged.
  - severity: low
    issue: ‘നിങ്ങളും’ adds an explicit ‘also’ not present in the Greek.
    rationale: The reciprocal logic is supplied by the parallel construction itself. ‘നിങ്ങൾ’ is more restrained and preserves the source wording without loss of clarity.
  revised_text: വിധിക്കരുത്; നിങ്ങൾ ഒരിക്കലും വിധിക്കപ്പെടുകയില്ല. കുറ്റക്കാരെന്നു വിധിക്കരുത്; നിങ്ങൾ ഒരിക്കലും കുറ്റക്കാരെന്നു വിധിക്കപ്പെടുകയില്ല. വിട്ടയയ്ക്കുക[a]; നിങ്ങൾ വിട്ടയയ്ക്കപ്പെടും.
