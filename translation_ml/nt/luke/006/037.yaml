reference: Luke 6:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: ml
  text: വിധിക്കരുത്; നിങ്ങൾ ഒരിക്കലും വിധിക്കപ്പെടുകയില്ല. കുറ്റക്കാരെന്നു വിധിക്കരുത്; നിങ്ങൾ ഒരിക്കലും കുറ്റക്കാരെന്നു വിധിക്കപ്പെടുകയില്ല. വിട്ടയയ്ക്കുക[a]; നിങ്ങൾ വിട്ടയയ്ക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്ഷമിക്കുക; നിങ്ങൾ ക്ഷമിക്കപ്പെടും.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘വിട്ടയയ്ക്കുക,’ ‘സ്വതന്ത്രനാക്കുക’ എന്നീ അർഥങ്ങൾ വരാം; ഈ സന്ദർഭത്തിൽ അതിനെ ‘ക്ഷമിക്കുക’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: വിധിക്കരുത്
  rationale: κρίνω എന്നതിന്റെ പൊതുവായ ‘വിധിക്കുക’ എന്ന അർഥം നിലനിർത്തുകയും തുടർന്നുള്ള ശക്തമായ καταδικάζω എന്ന ക്രിയയുമായുള്ള വ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐ μὴ κριθῆτε
  choice: നിങ്ങളും ഒരിക്കലും വിധിക്കപ്പെടുകയില്ല
  rationale: οὐ μή എന്ന ഊന്നിയ നിഷേധത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഒരിക്കലും ... ഇല്ല’ എന്നു പ്രകടിപ്പിക്കുന്നു; കർത്തൃവാചകത്തിലെ ക്രിയയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: καταδικάζετε
  choice: കുറ്റം വിധിക്കരുത്
  rationale: καταδικάζω വെറും വിലയിരുത്തലിനെക്കാൾ ശക്തമായി ഒരാളെ കുറ്റക്കാരനെന്നു വിധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കുറ്റം വിധിക്കുക’ κρίνωയോടുള്ള അർഥതീവ്രതയിലെ വർധന വ്യക്തമാക്കുന്നു.
- source_word: οὐ μὴ καταδικασθῆτε
  choice: നിങ്ങളും ഒരിക്കലും കുറ്റം വിധിക്കപ്പെടുകയില്ല
  rationale: ഊന്നിയ നിഷേധവും മുമ്പത്തെ കല്പനയോടുള്ള പദസാമ്യവും സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: ἀπολύετε
  choice: വിട്ടയയ്ക്കുക
  rationale: ἀπολύωയുടെ ‘വിടുക, സ്വതന്ത്രനാക്കുക, ബാധ്യതയിൽനിന്ന് ഒഴിവാക്കുക’ എന്ന വിശാലമായ അർഥപരിധി സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ സാധ്യമായ ‘ക്ഷമിക്കുക’ എന്ന ഇടുങ്ങിയ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀπολυθήσεσθε
  choice: നിങ്ങളും വിട്ടയയ്ക്കപ്പെടും
  rationale: ἀπολύετε / ἀπολυθήσεσθε എന്നീ ഒരേ ക്രിയയുടെ കർത്തൃ-കർമണി പരസ്പരബന്ധം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: ; / നിങ്ങളും
  rationale: ആവർത്തിക്കുന്ന καὶയുടെ ഏകോപനവും ഫലവാക്യങ്ങളിലെ പരസ്പരബന്ധവും മലയാളത്തിലെ സ്വാഭാവിക വാക്യലയത്തിലൂടെ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀπολύετε എന്നത് ‘ക്ഷമിക്കുക’ എന്ന ഇടുങ്ങിയ അർഥത്തിലോ ‘വിട്ടയയ്ക്കുക’ എന്ന വിശാലമായ അർഥത്തിലോ പരിഭാഷപ്പെടുത്തണമോ
  choice: പ്രധാന പാഠത്തിൽ ‘വിട്ടയയ്ക്കുക’
  alternative: ‘ക്ഷമിക്കുക’; ‘മോചിപ്പിക്കുക’
  rationale: വിധിക്കലിനെയും കുറ്റം വിധിക്കലിനെയും കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ക്രിയയ്ക്ക് മോചിപ്പിക്കുക, വിട്ടയയ്ക്കുക, അവകാശവാദത്തിൽനിന്നോ ബാധ്യതയിൽനിന്നോ ഒഴിവാക്കുക എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. ‘വിട്ടയയ്ക്കുക’ ഈ അർഥവ്യാപ്തിയും വാക്യത്തിലെ പരസ്പരതയും സംരക്ഷിക്കുന്നു; സുപരിചിതവും സന്ദർഭോചിതവുമായ ‘ക്ഷമിക്കുക’ എന്ന വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാരൂപങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സമാന്തരഘടനയും ഊന്നിയ നിഷേധവും വ്യക്തമായി സൂക്ഷിച്ചു. ‘വിട്ടയയ്ക്കുക’ അല്പം വിശാലമായ പദമായതിനാൽ സന്ദർഭപരമായ ‘ക്ഷമിക്കുക’ എന്ന വായന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
