id: LUK.6.38
reference: Luke 6:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: ml
  text: കൊടുക്കുവിൻ; നിങ്ങൾക്കു നൽകപ്പെടും. അമർത്തി നിറച്ചതും കുലുക്കിയൊതുക്കിയതും കവിഞ്ഞൊഴുകുന്നതുമായ[a] നല്ല അളവ് അവർ നിങ്ങളുടെ മടിയിലേക്കു[b] നൽകും. നിങ്ങൾ ഏത് അളവുകൊണ്ട് അളക്കുന്നുവോ, അതേ അളവുകൊണ്ട് നിങ്ങൾക്കും തിരിച്ചളന്നുനൽകപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒഴുകിക്കവിഞ്ഞതുമായ.’ പാത്രം അതിലെ സാധനം പുറത്തേക്കു ചൊരിയുന്നത്ര നിറച്ചിരിക്കുന്ന ദൃശ്യമാണ് ഇവിടെ.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളുടെ വസ്ത്രത്തിന്റെ മടക്കിലേക്കു.’ അളന്ന സാധനങ്ങൾ സ്വീകരിക്കാൻ ഉപയോഗിച്ചിരുന്ന മേലങ്കിയുടെ മുൻമടക്കത്തെയാണ് ‘മടി’ സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: കൊടുക്കുവിൻ
  rationale: വർത്തമാനകാല കർത്തരി ആജ്ഞാരൂപത്തിന്റെ പൊതുവായ ആഹ്വാനം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ആവർത്തനഭാവം അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: δοθήσεται ὑμῖν
  choice: നിങ്ങൾക്കു നൽകപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും ദാതൃവിഭക്തിയിലുള്ള സർവനാമവും നേരിട്ട് നിലനിർത്തുന്നു; നൽകുന്ന കർത്താവിനെ വാക്യം വ്യക്തമാക്കുന്നില്ല.
- source_word: μέτρον καλὸν
  choice: നല്ലൊരു അളവ്
  rationale: അളവുപാത്രത്തെയോ അളന്ന അളവിനെയോ സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്നു; ‘ഉദാരമായ’ എന്ന വ്യാഖ്യാനാത്മക അർഥം ചേർക്കുന്നില്ല.
- source_word: πεπιεσμένον
  choice: അമർത്തിനിറച്ചും
  rationale: കൂടുതൽ കൊള്ളുന്നതിനായി സാധനം അമർത്തിയൊതുക്കുന്ന വിപണിദൃശ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: σεσαλευμένον
  choice: കുലുക്കിയൊതുക്കിയും
  rationale: പാത്രത്തിലെ ഉള്ളടക്കം കുലുക്കി ഇടവിടുകളില്ലാതെ ഒതുക്കുന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: ὑπερεκχυννόμενον
  choice: കവിഞ്ഞൊഴുകുന്നതുമായ
  rationale: നിറഞ്ഞ് പുറത്തേക്കൊഴുകുന്ന സമൃദ്ധമായ അളവിന്റെ സജീവദൃശ്യം നിലനിർത്തുന്നു.
- source_word: δώσουσιν
  choice: അവർ ... നൽകും
  rationale: വ്യക്തമാക്കപ്പെടാത്ത കർത്താവോടുകൂടിയ മൂന്നാംപുരുഷ ബഹുവചനം ഗ്രീക്കിലുള്ളതുപോലെ നിലനിർത്തുന്നു; അതിനെ കർമണിപ്രയോഗമാക്കി മിനുക്കുന്നില്ല.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: നിങ്ങളുടെ മടിയിലേക്കു
  rationale: സാധനങ്ങൾ സ്വീകരിക്കാൻ ഉപയോഗിച്ചിരുന്ന മേലങ്കിയുടെ മുൻമടക്കത്തെ ആധുനിക വായനക്കാരന് സ്വാഭാവികമായി മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു; സാംസ്കാരിക സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: നിങ്ങൾ ഏത് അളവുകൊണ്ട് അളക്കുന്നുവോ
  rationale: അളവിന്റെ രൂപകവും ആപേക്ഷിക ഘടനയും വ്യക്തമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: അതേ അളവുകൊണ്ട് നിങ്ങൾക്കും തിരിച്ച് അളന്നുനൽകപ്പെടും
  rationale: ἀντί സൂചിപ്പിക്കുന്ന പ്രത്യളവിന്റെയും തിരിച്ചുകിട്ടലിന്റെയും ആശയം കർമണിരൂപത്തോടൊപ്പം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഈ വചനം പണം അഥവാ ദാനധർമ്മം മാത്രമായി പരിമിതപ്പെടുത്തണമോ
  choice: കൊടുക്കലിന്റെയും തിരിച്ചളക്കലിന്റെയും വിശാലമായ ഭാഷ നിലനിർത്തി; സാമ്പത്തിക ദാനത്തിലേക്ക് പരിമിതപ്പെടുത്തിയില്ല.
  alternative: ഇത് ഭൗതികദാനം അല്ലെങ്കിൽ ദാനധർമ്മം മാത്രത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയായി വിവർത്തനം ചെയ്യുക.
  rationale: ലൂക്കോസ് 6-ലെ സമീപസന്ദർഭത്തിൽ കരുണ, വിധിക്കാതിരിക്കൽ, ക്ഷമ, കൊടുക്കൽ എന്നിവ ഉൾപ്പെടുന്നു. ഗ്രീക്ക് പാഠം സാമ്പത്തിക അർഥം മാത്രം നിർദേശിക്കാത്തതിനാൽ വിശാലതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അവർ’ എന്ന അനിർദ്ദിഷ്ട ബഹുവചനകർത്താവും അളവിന്റെ വിപണിദൃശ്യവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങളോടുതന്നെ ചേർത്തു; നൽകിയ ഇംഗ്ലീഷ് മാതൃകയിലെ ചിഹ്ന-അടിക്കുറിപ്പ് പൊരുത്തക്കേട് പിന്തുടർന്നില്ല.
