id: LUK.6.21
reference: Luke 6:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: ml
  text: ഇപ്പോൾ വിശക്കുന്നവരായ നിങ്ങൾ അനുഗൃഹീതരാണ്[a], കാരണം നിങ്ങൾ തൃപ്തരാകും[b]. ഇപ്പോൾ കരയുന്നവരായ നിങ്ങൾ അനുഗൃഹീതരാണ്, കാരണം നിങ്ങൾ ചിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇപ്പോൾ വിശക്കുന്നവർ അനുഗൃഹീതരാണ് … ഇപ്പോൾ കരയുന്നവർ അനുഗൃഹീതരാണ്.” ഗ്രീക്കിൽ ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തരൂപങ്ങളാണുള്ളത്; എന്നാൽ സമീപസന്ദർഭവും രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള തുടർക്രിയകളും നേരിട്ടുള്ള അഭിസംബോധനയെ പിന്തുണയ്ക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ: “നിങ്ങൾ നിറയ്ക്കപ്പെടും.” ഈ ക്രിയ പ്രത്യേകിച്ച് ഭക്ഷണംകൊണ്ട് വയറുനിറയുന്നതിനെ സൂചിപ്പിക്കുന്നു; വിപുലമായ അർത്ഥത്തിൽ പൂർണമായി തൃപ്തരാകുന്നതിനെയും സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: അനുഗൃഹീതരാണ്
  rationale: യേശുവിന്റെ അനുഗ്രഹവചനത്തിന്റെ ഗൗരവവും ദൈവാനുഗ്രഹത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു; ‘സന്തുഷ്ടർ’ എന്നത് വികാരാവസ്ഥയിലേക്കും ‘ഭാഗ്യവാന്മാർ’ എന്നത് കേവല സൗഭാഗ്യത്തിലേക്കും അർത്ഥം ചുരുക്കാനിടയുണ്ട്.
- source_word: οἱ πεινῶντες νῦν
  choice: ഇപ്പോൾ വിശക്കുന്നവരായ നിങ്ങൾ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തരൂപം തുടരുന്ന വിശപ്പിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ രൂപം പൊതുവായ മൂന്നാംപുരുഷ പരാമർശത്തിന് ഇടനൽകുന്നുവെങ്കിലും, തുടർന്നുള്ള രണ്ടാംപുരുഷ ബഹുവചന ക്രിയകളും സന്ദർഭത്തിലെ നേരിട്ടുള്ള അഭിസംബോധനയും കണക്കിലെടുത്ത് ‘നിങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: χορτασθήσεσθε
  choice: നിങ്ങൾ നിറയ്ക്കപ്പെടും
  rationale: ഭക്ഷണംകൊണ്ട് നിറയുക എന്ന മൂർത്തമായ ദൃശ്യവും കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു; അതേസമയം പൂർണതൃപ്തി എന്ന വിപുലമായ അർത്ഥസാധ്യതയും അടച്ചുപൂട്ടുന്നില്ല.
- source_word: οἱ κλαίοντες νῦν
  choice: ഇപ്പോൾ കരയുന്നവരായ നിങ്ങൾ
  rationale: κλαίω സൂചിപ്പിക്കുന്ന കരച്ചിൽ നേരിട്ട് പകർന്നു; മരണദുഃഖം മാത്രമെന്നു ചുരുക്കാവുന്ന ‘വിലപിക്കുക’ ഒഴിവാക്കി. സന്ദർഭമനുസരിച്ച് നേരിട്ടുള്ള അഭിസംബോധന സ്വീകരിച്ചു.
- source_word: γελάσετε
  choice: നിങ്ങൾ ചിരിക്കും
  rationale: ഭാവിയിലെ മറിച്ചിടലിന്റെ വ്യക്തവും മൂർത്തവുമായ ചിത്രം നിലനിർത്തുന്നു; ‘സന്തോഷിക്കും’ എന്ന വ്യാഖ്യാനാത്മക പൊതുവാക്കൽ ഒഴിവാക്കി.
- source_word: ὅτι
  choice: കാരണം
  rationale: അനുഗൃഹീതരെന്ന പ്രഖ്യാപനത്തിന്റെ കാരണമോ അടിസ്ഥാനമോ പരിചയപ്പെടുത്തുന്ന ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: നേരിട്ടുള്ള അഭിസംബോധനയോ പൊതുവായ മൂന്നാംപുരുഷ അനുഗ്രഹവചനമോ
  choice: ‘വിശക്കുന്നവരായ നിങ്ങൾ’, ‘കരയുന്നവരായ നിങ്ങൾ’ എന്ന നേരിട്ടുള്ള അഭിസംബോധന
  alternative: ‘ഇപ്പോൾ വിശക്കുന്നവർ’, ‘ഇപ്പോൾ കരയുന്നവർ’
  rationale: ഗ്രീക്കിൽ ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തരൂപങ്ങളാണെങ്കിലും, വാഗ്ദാനക്രിയകൾ രണ്ടാംപുരുഷ ബഹുവചനത്തിലാണ്; സമീപസന്ദർഭവും ശിഷ്യന്മാരോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയെ പിന്തുണയ്ക്കുന്നു. രൂപപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: വാഗ്ദാനം ചെയ്യുന്ന മറിച്ചിടലിന്റെ സ്വഭാവവും സമയവും
  choice: ‘നിറയ്ക്കപ്പെടും’, ‘ചിരിക്കും’ എന്ന മൂർത്തമായ ഭാഷ നിലനിർത്തുക
  alternative: ഇത് ആത്മീയ തൃപ്തിയെന്നോ അന്ത്യകാലത്തിലെ നിറവേറലെന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: വചനം ഭാവിയിലെ മറിച്ചിടൽ വാഗ്ദാനം ചെയ്യുന്നുവെങ്കിലും അതിന്റെ സമയം, രീതി, പരിധി എന്നിവ ഇവിടെ നിർവചിക്കുന്നില്ല. അതിനാൽ പരിഭാഷ ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: χορτασθήσεσθε എന്ന കർമണിപ്രയോഗം
  choice: ‘നിറയ്ക്കപ്പെടും’ എന്ന കർമണിരൂപം
  alternative: ‘വയറുനിറയും’ അല്ലെങ്കിൽ ‘തൃപ്തരാകും’
  rationale: ആരാണ് നിറയ്ക്കുന്നത് എന്ന് വചനം തുറന്നുവെക്കുന്നതിനാൽ കർത്താവിനെ പേരെടുത്ത് ചേർക്കാതെ കർമണിപ്രയോഗം നിലനിർത്തി; ഭക്ഷണത്തിന്റെ ദൃശ്യവും വിപുലമായ തൃപ്തിയുടെ സാധ്യതയും ഒരുമിച്ച് സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്നതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അനുഗ്രഹവചനത്തിന്റെ ഔപചാരിക താളം നിലനിർത്തുന്നതിനായി ‘അനുഗൃഹീതരാണ്’ ഉപയോഗിച്ചു. ‘നിറയ്ക്കപ്പെടും’ സാധാരണ സംഭാഷണത്തിൽ അപൂർവമെങ്കിലും, മൂലത്തിലെ കർമണിപ്രയോഗവും ഭക്ഷണദൃശ്യവും സംരക്ഷിക്കാൻ ഇവിടെ ഉദ്ദേശപൂർവം സ്വീകരിച്ചു.
