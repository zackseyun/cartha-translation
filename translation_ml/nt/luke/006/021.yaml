    issue: Awkward rendering of χορτασθήσεσθε
    rationale: ‘നിങ്ങൾ നിറയ്ക്കപ്പെടും’ is not idiomatic for people being fed/satisfied in Malayalam and may miscommunicate the Greek food-satisfaction image. ‘നിങ്ങൾ തൃപ്തരാകും’ naturally conveys the promised satisfaction while retaining its unspecified scope.
  - severity: low
    issue: Footnote [b] conflicts with the proposed main-text revision
    rationale: Once ‘തൃപ്തരാകും’ is in the text, the note cannot offer that same wording as an alternative. It should instead give ‘നിങ്ങൾ നിറയ്ക്കപ്പെടും’ and explain the concrete food imagery.
