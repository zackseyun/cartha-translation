source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: ml
  text: ആ ദിവസം സന്തോഷിക്കൂ; ആനന്ദത്താൽ തുള്ളിച്ചാടൂ[a], കാരണം, ഇതാ, സ്വർഗത്തിൽ നിങ്ങളുടെ പ്രതിഫലം വലുതാണ്; അവരുടെ പൂർവികർ പ്രവാചകന്മാരോടു ഇതേ രീതിയിൽ പെരുമാറിയിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ആ ദിവസം ആനന്ദിക്കൂ; തുള്ളിച്ചാടൂ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത രൂപം: ‘അവരുടെ പൂർവികർ പ്രവാചകന്മാരോടു അതേപോലെ ചെയ്തിരുന്നു.’ ഇവിടെ ‘അതേപോലെ’ എന്നത് മുൻവാക്യങ്ങളിൽ സൂചിപ്പിച്ച അതേ രീതിയിലുള്ള പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρητε
  choice: സന്തോഷിക്കൂ
  rationale: χαίρω എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം സജീവമായ സന്തോഷത്തിനുള്ള ആഹ്വാനമാണ്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുമുള്ള പ്രയോഗം.
- source_word: σκιρτήσατε
  choice: ആനന്ദത്താൽ തുള്ളിച്ചാടൂ
  rationale: അതിയായ സന്തോഷത്തിന്റെ ശാരീരിക പ്രകടനമായ ചാടലാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; ‘തുള്ളിച്ചാടൂ’ പ്രവൃത്തിയും ‘ആനന്ദത്താൽ’ അതിന്റെ ഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന കാരണത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരബലം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μισθὸς
  choice: പ്രതിഫലം
  rationale: ഇവിടെ സാമ്പത്തിക കൂലിയെക്കാൾ ദൈവത്തിൽനിന്നുള്ള അനുകൂല പ്രത്യുപകാരമാണ് ഉദ്ദേശ്യം; ‘പ്രതിഫലം’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: πολὺς
  choice: വലുതാണ്
  rationale: പ്രതിഫലത്തിന്റെ മഹത്ത്വം സൂചിപ്പിക്കുന്ന predicate adjective-ന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: ഏകവചനമായ οὐρανός ഇവിടെ സ്വർഗീയ മണ്ഡലത്തെ സൂചിപ്പിക്കുന്നു; അധിക വ്യാഖ്യാനം ചേർക്കാതെ സ്ഥാനം/മണ്ഡലം നിലനിർത്തുന്നു.
- source_word: κατὰ τὰ αὐτά
  choice: ഇതേ കാര്യങ്ങൾ തന്നെയാണ്
  rationale: ‘അതേ കാര്യങ്ങൾക്കനുസരിച്ച്’ എന്ന അക്ഷരാർഥത്തെ അസ്വാഭാവികമാക്കാതെ, മുൻസന്ദർഭത്തിലെ അതേ പെരുമാറ്റങ്ങളിലേക്കുള്ള സൂചന നിലനിർത്തുന്നു.
- source_word: ἐποίουν
  choice: ചെയ്തിരുന്നത്
  rationale: Imperfect രൂപത്തിലെ പതിവായോ ആവർത്തിച്ചോ നടന്ന ഭൂതകാലപ്രവൃത്തിയെ മലയാളത്തിലെ ‘ചെയ്തിരുന്നത്’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς προφήταις
  choice: പ്രവാചകന്മാരോടും
  rationale: ποιέω-യോടുള്ള dative ബന്ധം ‘പ്രവാചകന്മാരോട്’ എന്നു നൽകുന്നു; ‘-ഉം’ ഇപ്പോഴത്തെ പീഡനത്തോടുള്ള സമാന്തരത വ്യക്തമാക്കുന്നു.
- source_word: οἱ πατέρες αὐτῶν
  choice: അവരുടെ പൂർവികർ
  rationale: πατέρες ഇവിടെ ഉടനെയുള്ള പിതാക്കളെയല്ല, മുൻതലമുറകളെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘പൂർവികർ’ അർഥം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: വാഗ്ദത്ത പ്രതിഫലത്തിന്റെ സ്ഥാനം/സ്വഭാവം
  choice: സ്വർഗത്തിൽ നിങ്ങളുടെ പ്രതിഫലം വലുതാണ്
  alternative: സ്വർഗത്തിലുള്ള ദൈവത്തിന്റെ പക്കൽ നിങ്ങളുടെ പ്രതിഫലം വലുതാണ്
  rationale: മൂലപാഠം പ്രതിഫലം ‘സ്വർഗത്തിൽ’ എന്നു മാത്രമാണ് പറയുന്നത്. ദൈവത്തിന്റെ പക്കൽ എന്ന വിശദീകരണം ചേർക്കാതെ വാചകത്തിന്റെ യുഗാന്ത്യ പ്രതീക്ഷയും സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- issue: ‘അവരുടെ പിതാക്കന്മാർ’ എന്നതിന്റെ സൂചന
  choice: അവരുടെ പൂർവികർ
  alternative: അവരുടെ പിതാക്കന്മാർ
  rationale: സന്ദർഭത്തിൽ എതിർക്കുന്നവരുടെ മുൻതലമുറകൾ പ്രവാചകന്മാരോട് പെരുമാറിയ രീതിയാണ് പരാമർശം. ‘പൂർവികർ’ ആ കൂട്ടായ ചരിത്രസൂചന വ്യക്തമാക്കുന്നു; പ്രത്യേകൊരു സമുദായത്തെ വിവർത്തനം അധികമായി പേരെടുത്ത് കുറ്റപ്പെടുത്തുന്നില്ല.
- issue: പ്രവാചകന്മാരോടു ചെയ്തത് എന്തെന്നതിലെ സംക്ഷിപ്തത
  choice: ഇതേ കാര്യങ്ങൾ തന്നെയാണ് ചെയ്തിരുന്നത്
  alternative: ഇതേ രീതിയിൽ പീഡിപ്പിച്ചിരുന്നു
  rationale: മൂലത്തിലെ ποιέω പൊതുവായ ‘ചെയ്യുക’ എന്ന ക്രിയയാണ്; മുൻസന്ദർഭം വൈരപരമായ പെരുമാറ്റം വ്യക്തമാക്കിയാലും, ‘പീഡിപ്പിച്ചു’ എന്നു ക്രിയയിൽ തന്നെ ചേർത്ത് അർഥം കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ നേരിട്ടുള്ള ബഹുവചന ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചു. ഭാഷ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായിരിക്കുമ്പോഴും ‘ഇതാ’, ‘പ്രതിഫലം’, ‘പ്രവാചകന്മാർ’ തുടങ്ങിയ പദങ്ങൾ ഗൗരവമുള്ള തിരുവെഴുത്ത് ശൈലി നിലനിർത്തുന്നു. ഗ്രീക്കിലെ രണ്ടാമത്തെ കാരണംസൂചകമായ γάρ മലയാളത്തിൽ പുതിയ വാക്യമായി ‘കാരണം’ എന്നു നൽകി.
