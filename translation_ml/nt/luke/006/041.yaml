id: LUK.6.41
reference: Luke 6:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ml
  text: എന്നാൽ, നിന്റെ സഹോദരന്റെ കണ്ണിലെ കരട് നീ കാണുകയും നിന്റെ സ്വന്തം കണ്ണിലെ വലിയ മരത്തടി ശ്രദ്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നത് എന്തുകൊണ്ട്?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: എന്തുകൊണ്ട്
  rationale: βλέπεις എന്ന ക്രിയയോടുകൂടിയ ഈ അലങ്കാരചോദ്യത്തിൽ τί വെറും ‘എന്ത്’ എന്നല്ല, ശാസനാത്മകമായ ‘എന്തുകൊണ്ട്’ എന്ന അർഥമാണ് നൽകുന്നത്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള മൃദുവായ വൈരുധ്യവും തുടർച്ചയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: βλέπεις
  choice: നീ കാണുകയും
  rationale: കാഴ്ചയെ ആധാരമാക്കിയ രൂപകം നിലനിർത്തുന്ന സാധാരണവും നേരിട്ടുള്ളതുമായ പ്രയോഗം.
- source_word: κάρφος
  choice: കരട്
  rationale: വൈക്കോൽക്കഷണം, ചീള് തുടങ്ങിയ വളരെ ചെറിയ ഉണങ്ങിയ കണത്തെ സൂചിപ്പിക്കുന്നു; δοκός എന്ന വലിയ മരത്തോടുള്ള അതിശയോക്തിപരമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ὀφθαλμῷ
  choice: കണ്ണിലുള്ള
  rationale: ὀφθαλμός എന്ന ഏകവചനത്തിന്റെ സാധാരണ മലയാളരൂപം; സ്ഥലബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἀδελφοῦ
  choice: സഹോദരന്റെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന ബന്ധപദം അതേപടി നിലനിർത്തുന്നു; പ്രയോഗത്തിന്റെ വിപുലമായ പ്രസക്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: δοκόν
  choice: തുലാം
  rationale: കെട്ടിടത്തിൽ ഉപയോഗിക്കുന്ന വലിയ മരത്തടിയെ സൂചിപ്പിക്കുന്ന കൃത്യവും സംക്ഷിപ്തവുമായ മലയാളപദം; ചെറിയ കരടുമായുള്ള ശക്തമായ വൈരുധ്യം കാക്കുന്നു.
- source_word: ἰδίῳ
  choice: സ്വന്തം
  rationale: ἴδιος നൽകുന്ന ഉടമസ്ഥതയുടെ ഊന്നൽ നിലനിർത്തി സഹോദരന്റെ കണ്ണുമായുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: κατανοεῖς
  choice: ശ്രദ്ധിക്കാതിരിക്കുകയും
  rationale: ശ്രദ്ധാപൂർവം ഗ്രഹിക്കുക, നിരീക്ഷിക്കുക എന്ന ക്രിയയുടെ ഭാവം നൽകുകയും βλέπεις എന്ന സാധാരണ ‘കാണുക’ എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἀδελφοῦ എന്ന ലിംഗസൂചക ബന്ധപദം
  choice: സഹോദരൻ
  alternative: സഹോദരനോ സഹോദരിയോ; കൂട്ടുവിശ്വാസി
  rationale: മൂലപാഠം പുല്ലിംഗ ഏകവചനമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ അതിനെ ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തുന്നു; ഉപദേശത്തിന്റെ പ്രയോഗം പുരുഷസഹോദരനിൽ മാത്രം ഒതുങ്ങുന്നതല്ലെന്ന് അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ അലങ്കാരചോദ്യമായി രൂപപ്പെടുത്തി. ‘കരട്—തുലാം’ എന്ന ചെറുതും അതിവലുതുമായ വസ്തുക്കളുടെ അതിശയോക്തിപരമായ വൈരുധ്യം നിലനിർത്തി; ‘കാണുക—ശ്രദ്ധിക്കുക’ എന്ന ക്രിയാഭേദവും സംരക്ഷിച്ചു.
