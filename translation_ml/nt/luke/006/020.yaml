source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: ml
  text: 'അവൻ തന്റെ ശിഷ്യന്മാരുടെ നേരെ കണ്ണുകൾ ഉയർത്തി പറഞ്ഞു: “ദരിദ്രരായ നിങ്ങൾ[a][b] അനുഗൃഹീതരാണ്; കാരണം ദൈവരാജ്യം നിങ്ങളുടേതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ദരിദ്രർ അനുഗൃഹീതരാണ്.” ഗ്രീക്ക് പ്രയോഗം രൂപത്തിൽ മൂന്നാംപുരുഷമാണെങ്കിലും, തുടർന്ന് വരുന്ന “നിങ്ങളുടേത്” നേരിട്ടുള്ള അഭിസംബോധന വ്യക്തമാക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ലൂക്കാ ഇവിടെ “ദരിദ്രർ” എന്നാണ് പറയുന്നത്; “ആത്മാവിൽ ദരിദ്രർ” എന്നല്ല (മത്തായി 5:3 താരതമ്യം ചെയ്യുക).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: കണ്ണുകളുയർത്തി
  rationale: ആദ്യം നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാശൃംഖലയായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരുടെ നേരെ
  rationale: εἰς ഇവിടെ നോട്ടത്തിന്റെ ദിശയാണ് സൂചിപ്പിക്കുന്നത്; ‘നേരെ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔλεγεν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ imperfect പ്രസംഗത്തിന്റെ പശ്ചാത്തലമോ തുടർച്ചയോ സൂചിപ്പിക്കാമെങ്കിലും, മലയാളത്തിൽ ‘പറയുകയായിരുന്നു’ ഈ സാഹചര്യത്തിൽ അസ്വാഭാവികമാകാം. പ്രസംഗം ആരംഭിക്കുന്നതിനെ ലളിതവും സ്വാഭാവികവുമായി ‘പറഞ്ഞു’ എന്നു നൽകുന്നു.
- source_word: Μακάριοι
  choice: അനുഗൃഹീതരാണ്
  rationale: ‘സന്തുഷ്ടർ’ എന്ന വികാരപരമായ അർഥത്തിലേക്ക് ചുരുക്കാതെ, ദൈവാനുകൂല്യവും ഭാഗ്യസ്ഥിതിയും ഉൾക്കൊള്ളുന്ന മകാരിയോസിന്റെ മതപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: οἱ πτωχοί
  choice: ദരിദ്രരായ നിങ്ങൾ
  rationale: രൂപത്തിൽ ‘ദരിദ്രർ’ എന്ന മൂന്നാംപുരുഷ പ്രയോഗമാണെങ്കിലും, തുടർന്നുള്ള ὑμετέρα (‘നിങ്ങളുടേത്’) ശിഷ്യന്മാരോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന വ്യക്തമാക്കുന്നു. ‘ദരിദ്രരായ നിങ്ങൾ’ ആ സംഭാഷണഗതി മലയാളത്തിൽ തെളിയിക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: അനുഗൃഹീതരെന്ന പ്രഖ്യാപനത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന causal ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം നിങ്ങളുടേതാണ്
  rationale: പ്രവചനത്തെ ഭാവികാലത്തിലാക്കാതെ ഗ്രീക്കിലെ വർത്തമാനകാലവും predicative possessive-ന്റെ ഊന്നലും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: πτωχοί എന്നത് ആത്മീയമായ ദാരിദ്ര്യമായി വികസിപ്പിക്കണമോ
  choice: ദരിദ്രർ
  alternative: ആത്മാവിൽ ദരിദ്രർ
  rationale: ലൂക്കായുടെ ഗ്രീക്ക് പാഠത്തിൽ ‘ആത്മാവിൽ’ എന്ന വിശേഷണം ഇല്ല. മത്തായി 5:3-ലെ രൂപവുമായി സമന്വയിപ്പിക്കാതെ ലൂക്കായുടെ വാചകവും അതിലുള്ള സാമൂഹിക-ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: മകാരിസം മൂന്നാംപുരുഷത്തിൽ വേണമോ നേരിട്ടുള്ള അഭിസംബോധനയായോ നൽകണമോ
  choice: ദരിദ്രരായ നിങ്ങൾ അനുഗൃഹീതരാണ്
  alternative: ദരിദ്രർ അനുഗൃഹീതരാണ്
  rationale: οἱ πτωχοί രൂപത്തിൽ മൂന്നാംപുരുഷമാണെങ്കിലും ὑμετέρα (‘നിങ്ങളുടേത്’) നേരിട്ടുള്ള അഭിസംബോധന വ്യക്തമാക്കുന്നു. മുഖ്യപാഠം ആ അഭിസംബോധന തെളിയിക്കുന്നു; ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ദൈവരാജ്യം ഇപ്പോഴുള്ളതോ ഭാവിയിലുള്ളതോ ആയി നൽകണമോ
  choice: നിങ്ങളുടേതാണ്
  alternative: നിങ്ങളുടേതായിരിക്കും
  rationale: ἐστίν വർത്തമാനകാലത്തിലാണ്. ഭാവികാല വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതെ പാഠത്തിലെ ഇപ്പോഴത്തെ പ്രഖ്യാപനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. ‘ദൈവരാജ്യം’ എന്ന പരിചിതവും അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമായ പദം ഉപയോഗിച്ചു. ‘അനുഗൃഹീതരാണ്’ മതപരമായ മകാരിസത്തിന്റെ ഭാവം നൽകുന്നു; അതേസമയം വാചകം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ലളിതമാണ്.
