id: LUK.6.39
reference: Luke 6:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: ml
  text: 'അവൻ അവരോട് ഒരു ഉപമ കൂടി പറഞ്ഞു: “ഒരു അന്ധന് മറ്റൊരു അന്ധനെ വഴിനടത്താൻ കഴിയുമോ? ഇരുവരും ഒരു കുഴിയിൽ വീഴുകയില്ലേ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കുഴി” എന്നതിന് “കിടങ്ങ്” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: കൂടി
  rationale: δὲ-യോടുചേർന്ന καὶയുടെ കൂട്ടിച്ചേർക്കൽഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: παραβολὴν
  choice: ഉപമ
  rationale: സുവിശേഷങ്ങളിലെ ചിത്രാത്മകമായ ഉപദേശവചനത്തിന് പരിചിതവും മാന്യവുമായ മലയാളപദം.
- source_word: Μήτι δύναται
  choice: കഴിയുമോ?
  rationale: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τυφλὸς ... τυφλὸν
  choice: ഒരു അന്ധന് മറ്റൊരു അന്ധനെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന രൂപങ്ങൾ പൊതുപ്രതിനിധാന അർഥത്തിലാണ്; മലയാളത്തിൽ ‘അന്ധൻ’ എന്ന പദം ലിംഗഭേദം നിർബന്ധമായി അടയാളപ്പെടുത്താതെ വ്യക്തിയെ സൂചിപ്പിക്കാനും കഴിയും. വിഭക്തിരൂപങ്ങൾ വാക്യത്തിലെ കർത്താവ്–കർമം ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ὁδηγεῖν
  choice: വഴിനടത്താൻ
  rationale: ഒരാളുടെ സഞ്ചാരപഥം മറ്റൊരാൾ നയിക്കുന്ന ദൃശ്യബിംബം വ്യക്തമായി നൽകുന്നു.
- source_word: οὐχὶ ἀμφότεροι
  choice: ഇരുവരും ... വീഴുകയില്ലേ?
  rationale: ഉറപ്പായ അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന οὐχίയുടെ അലങ്കാരചോദ്യബലം സൂക്ഷിക്കുന്നു.
- source_word: βόθυνον
  choice: കുഴി
  rationale: βόθυνος സൂചിപ്പിക്കുന്ന pit/ditch എന്ന വിശാല അർഥപരിധിക്ക് സാധാരണവും ദൃശ്യവുമായ മലയാളപദം.
- source_word: ἐμπεσοῦνται
  choice: വീഴുകയില്ലേ
  rationale: ഭാവികാലസൂചനയും εἰς-നോടൊപ്പമുള്ള ‘അകത്തേക്ക് വീഴുക’ എന്ന ആശയവും മലയാള അലങ്കാരചോദ്യത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: τυφλός എന്ന പുല്ലിംഗ ഏകവചനത്തിന്റെ പൊതുപ്രതിനിധാന പ്രയോഗം
  choice: ഒരു അന്ധന് മറ്റൊരു അന്ധനെ
  alternative: ഒരു അന്ധനായ മനുഷ്യന് മറ്റൊരു അന്ധനായ മനുഷ്യനെ
  rationale: ഗ്രീക്ക് രൂപത്തിന്റെ ഏകവചനവും വ്യക്തിസൂചനയും നിലനിർത്തുന്നു; എന്നാൽ മലയാളത്തിൽ അനാവശ്യമായി ‘മനുഷ്യൻ’ ചേർത്ത് ലിംഗഭാരം വർധിപ്പിക്കുന്നില്ല. വചനം പൊതുവായി ബാധകമായ പഴഞ്ചൊല്ലുസ്വഭാവമുള്ള പ്രസ്താവനയായി തുടരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; ലളിതവും മാന്യവും വാചികമായി സ്വാഭാവികവുമായ ശൈലി. ‘ഉപമകൂടി പറഞ്ഞു’ എന്ന ക്രമം καὶയുടെ കൂട്ടിച്ചേർക്കൽഭാവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
