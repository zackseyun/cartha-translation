id: LUK.6.19
reference: Luke 6:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: ml
  text: ജനക്കൂട്ടം മുഴുവനും അവനെ തൊടാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു. കാരണം, അവനിൽനിന്ന് ശക്തി പുറപ്പെട്ടുകൊണ്ടിരുന്നു[a]; അത് എല്ലാവരെയും സുഖപ്പെടുത്തിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനിൽനിന്ന് പുറത്തേക്കു വരികയായിരുന്നു.’
    reason: ἐξήρχετο എന്ന ക്രിയയെ ‘പുറപ്പെടുക’ എന്നതിനു പകരം ‘പുറത്തേക്കു വരുക’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: ജനക്കൂട്ടം മുഴുവനും
  rationale: πᾶς ചേർന്ന ഏകവചന കൂട്ടനാമമായ ὄχλος, അവിടെ കൂടിയിരുന്ന ജനക്കൂട്ടത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം ആ കൂട്ടായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐζήτουν
  choice: ശ്രമിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ ശ്രമത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘തേടുക’ എന്നതിനെക്കാൾ ‘ശ്രമിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: ἅπτεσθαι
  choice: തൊടാൻ
  rationale: രോഗശാന്തിക്കായി യേശുവുമായി ശാരീരിക സമ്പർക്കം നേടുന്നതാണ് സന്ദർഭം; അതിനാൽ ലളിതവും കൃത്യവുമായ ‘തൊടാൻ’ തെരഞ്ഞെടുത്തു.
- source_word: δύναμις
  choice: ശക്തി
  rationale: രോഗശാന്തി വരുത്തുന്ന ഫലപ്രദമായ ശക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. മൂലത്തിൽ ഇല്ലാത്ത ‘അത്ഭുതശക്തി’ എന്ന വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: അവനിൽനിന്ന് ശക്തി പുറപ്പെട്ടുകൊണ്ടിരിക്കുകയും
  rationale: παρά യേശുവിനെ ഉറവിടമായി കാണിക്കുന്നു; അപൂർണ ഭൂതകാലം ശക്തി തുടർച്ചയായി പുറപ്പെടുന്നതായി അവതരിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടുകൊണ്ടിരിക്കുക’ ഈ ദൃശ്യഭാവവും ക്രിയയുടെ കാലഭാവവും നിലനിർത്തുന്നു.
- source_word: ἰᾶτο
  choice: സുഖപ്പെടുത്തുകയും ചെയ്തിരുന്നു
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവം സംയുക്തക്രിയാരൂപത്തിലൂടെ നിലനിർത്തി. ‘സുഖപ്പെടുത്തുക’ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: πάντας
  choice: എല്ലാവരെയും
  rationale: പുരുഷലിംഗ ബഹുവചനമായ പദം അവിടെയുള്ള ആളുകളെ മുഴുവനായി സൂചിപ്പിക്കുന്നു; ‘എല്ലാവരെയും’ ആ വ്യാപ്തി നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിൽനിന്ന് പുറപ്പെടുന്ന δύναμις എന്നതിന്റെ സ്വഭാവം
  choice: ‘അവനിൽനിന്ന് ശക്തി പുറപ്പെട്ടുകൊണ്ടിരുന്നു’ എന്ന് വിശദീകരണം ചേർക്കാതെ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവനിൽനിന്ന് അത്ഭുതശക്തി പുറപ്പെട്ടുകൊണ്ടിരുന്നു’
  rationale: വാക്യം യേശുവിനെ രോഗശാന്തി നൽകുന്ന ശക്തിയുടെ ഉറവിടമായി അവതരിപ്പിക്കുന്നു. എന്നാൽ δύναμις എന്ന പദത്തോടൊപ്പം ‘അത്ഭുത’ എന്ന വിശേഷണം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. അപൂർണ ഭൂതകാല ക്രിയകളിലെ തുടരുന്ന പ്രവർത്തനഭാവം ‘ശ്രമിച്ചുകൊണ്ടിരുന്നു’, ‘പുറപ്പെട്ടുകൊണ്ടിരിക്കുകയും ... ചെയ്തിരുന്നു’ എന്നീ രൂപങ്ങളിലൂടെ സൂക്ഷിച്ചു.
