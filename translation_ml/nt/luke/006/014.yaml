id: LUK.6.14
reference: Luke 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σίμωνα ὃν καὶ ὠνόμασεν Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ ⸀καὶ Ἰάκωβον καὶ Ἰωάννην ⸁καὶ Φίλιππον καὶ Βαρθολομαῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/014.yaml
  text: Simon, whom he also named Peter, and Andrew his brother, and James and John, and Philip and Bartholomew,
translation:
  language: ml
  text: പത്രോസ് എന്നും അവൻ പേരിട്ട ശിമോൻ, അവന്റെ സഹോദരനായ അന്ത്രയോസ്, യാക്കോബ്, യോഹന്നാൻ, ഫിലിപ്പോസ്, ബർത്തൊലൊമായി,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: ശിമോൻ
  rationale: ലൂക്കായുടെ സുവിശേഷത്തിൽ ഈ അപ്പൊസ്തലന്റെ പേരിന് മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സ്ഥിരപ്പെട്ട രൂപം; ഗ്രീക്ക് Σίμων എന്ന പേരിനെയും വ്യക്തമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: അവന് പത്രോസ് എന്നും പേരിട്ടു
  rationale: ὀνομάζω ഇവിടെ പേര് നൽകുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പേരിട്ടു’ എന്ന് പരിഭാഷപ്പെടുത്തി; καίയുടെ ‘എന്നും’ എന്ന അർഥവും നിലനിർത്തി.
- source_word: Πέτρον
  choice: പത്രോസ്
  rationale: Πέτρος എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട രൂപം.
- source_word: Ἀνδρέαν
  choice: അന്ത്രയോസ്
  rationale: Ἀνδρέας എന്ന വ്യക്തിനാമത്തിന്റെ സ്ഥാപിത മലയാളരൂപം.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: അവന്റെ സഹോദരനായ
  rationale: ഇവിടെ ἀδελφός ശാരീരിക സഹോദരനെ സൂചിപ്പിക്കുന്നു; അന്ത്രയോസുമായുള്ള ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: Ἰάκωβον
  choice: യാക്കോബ്
  rationale: Ἰάκωβος എന്ന ഗ്രീക്ക് പേരിന്റെ മൂലരൂപത്തോട് അടുത്തതും മലയാള വായനക്കാർക്ക് പരിചിതവുമായ രൂപം; ഇംഗ്ലീഷിലെ പരമ്പരാഗത ‘James’ എന്ന രൂപത്തെ ആശ്രയിച്ചില്ല.
- source_word: Ἰωάννην
  choice: യോഹന്നാൻ
  rationale: Ἰωάννης എന്ന വ്യക്തിനാമത്തിന്റെ സ്ഥാപിത മലയാളരൂപം.
- source_word: Φίλιππον
  choice: ഫിലിപ്പോസ്
  rationale: Φίλιππος എന്ന ഗ്രീക്ക് വ്യക്തിനാമത്തോട് അടുത്ത, മലയാളത്തിൽ പരിചിതമായ രൂപം.
- source_word: Βαρθολομαῖον
  choice: ബർത്തൊലൊമായി
  rationale: Βαρθολομαῖος എന്ന വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ രൂപം.
- source_word: καὶ
  choice: പട്ടികയിൽ വിരാമചിഹ്നങ്ങളാൽ ഏകോപനം
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള καί പട്ടികയിലെ അംഗങ്ങളെ ബന്ധിപ്പിക്കുന്നു. ആധുനിക സ്വാഭാവിക മലയാളത്തിൽ ഓരോ പേരിനുമുമ്പും ‘യും’ ആവർത്തിക്കാതെ കോമകൾ ഉപയോഗിച്ചു; ബന്ധത്തിന്റെ അർഥം നിലനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്ന പേരുകളുടെ പട്ടികയായതിനാൽ അവസാനം കോമ നിലനിർത്തി. ശിമോനെക്കുറിച്ചുള്ള ഇടക്കുറിപ്പ് ഡാഷുകൾക്കുള്ളിൽ നൽകി, ‘അവന്റെ’ എന്നത് ശിമോനെ സൂചിപ്പിക്കുന്നതായി വ്യക്തത സംരക്ഷിച്ചു.
