  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: ml
  text: മത്തായിയെയും തോമയെയും, അൽഫായിയുടെ മകനായ യാക്കോബിനെയും, സീലോത്തൻ എന്നു വിളിക്കപ്പെട്ട ശിമോനെയും[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തീക്ഷ്ണോത്സാഹി എന്നു വിളിക്കപ്പെട്ട ശിമോൻ.” ഗ്രീക്കിലെ ഈ വിശേഷണപ്പേര് തീക്ഷ്ണമായ ഉത്സാഹമുള്ള ഒരാളെ സൂചിപ്പിക്കാം; ഒരു രാഷ്ട്രീയ പ്രസ്ഥാനത്തിൽ അദ്ദേഹത്തിന് ഔപചാരിക അംഗത്വമുണ്ടായിരുന്നെന്ന് ഈ പദം മാത്രം നിർബന്ധമായി തെളിയിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -യെയും / കൂടാതെ എന്ന അർഥം നൽകുന്ന പട്ടികാസമന്വയം
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള സംയോജകത്തിന്റെ പട്ടികാശൈലി മലയാളത്തിലെ ഓരോ പേരിനോടും ചേർന്ന ‘-യെയും’ പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Μαθθαῖον
  choice: മത്തായി
  rationale: മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ വ്യക്തിനാമരൂപം.
- source_word: Θωμᾶν
  choice: തോമാ
  rationale: മലയാളത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം; വിഭക്തിയോടെ ‘തോമയെയും’ എന്നു വരുന്നു.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: അൽഫായിയുടെ മകനായ യാക്കോബ്
  rationale: പേരുകളുടെ ഈ സൂത്രവാക്യത്തിൽ Ἁλφαίου പിതൃബന്ധമാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; മറ്റുള്ള യാക്കോബുമാരിൽനിന്ന് ഇദ്ദേഹത്തെ വേർതിരിക്കുന്നു.
- source_word: Σίμωνα
  choice: ശിമോൻ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം.
- source_word: τὸν καλούμενον
  choice: എന്നു വിളിക്കപ്പെട്ട
  rationale: തിരിച്ചറിയിക്കുന്ന വിശേഷണപ്പേര് സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കർമണി വർത്തമാനകൃത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ζηλωτὴν
  choice: തീക്ഷ്ണവാദി
  rationale: തീക്ഷ്ണമായ ഉത്സാഹമുള്ളവൻ എന്ന വിശേഷണാർഥവും ഒരു പ്രസ്ഥാനബന്ധം സൂചിപ്പിക്കാനുള്ള സാധ്യതയും പൂർണമായി ഇല്ലാതാക്കാതെ നൽകുന്ന ആധുനിക മലയാളരൂപം.
theological_decisions:
- issue: Ζηλωτής ഒരു രാഷ്ട്രീയകക്ഷിയുടെ ഔപചാരിക അംഗത്വപ്പേരാണോ, വിവരണാത്മക വിശേഷണമാണോ
  choice: ‘തീക്ഷ്ണവാദി’ എന്ന തിരിച്ചറിയൽപ്പേരായി പരിഭാഷപ്പെടുത്തി; രാഷ്ട്രീയ അംഗത്വം വാചകത്തിൽ വിശദീകരിച്ചില്ല.
  alternative: ‘തീക്ഷ്ണോത്സാഹി’ എന്ന ശുദ്ധ വിവരണാത്മക രൂപം; അല്ലെങ്കിൽ ‘സീലോത്ത്’ എന്ന ലിപ്യന്തരണം.
  rationale: ഗ്രീക്ക് പദം വിശേഷണപ്പേരിനെ പിന്തുണയ്ക്കുന്നുവെങ്കിലും പിൽക്കാലത്തെ ഒരു സംഘടിത രാഷ്ട്രീയ പ്രസ്ഥാനത്തിലെ ഔപചാരിക അംഗത്വം നിർബന്ധമായി സ്ഥാപിക്കുന്നില്ല. അതിനാൽ ചരിത്രപരമായ ചോദ്യം പരിഭാഷയിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ പട്ടികാശൈലി ‘-യെയും’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി. ഉദ്ധരണിച്ചിഹ്നങ്ങൾ തിരിച്ചറിയൽപ്പേരിനെ വ്യക്തിനാമങ്ങളിൽനിന്ന് വേർതിരിക്കുന്നു.
