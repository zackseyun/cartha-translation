  naturalness: “സൂക്ഷ്മമായി നിരീക്ഷിച്ചുകൊണ്ടിരുന്നു” ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. അവസാനഭാഗം “അദ്ദേഹത്തിനെതിരെ കുറ്റം ചുമത്താനുള്ള ആധാരം കണ്ടെത്താൻ” എന്നു നൽകുമ്പോൾ വാക്യപ്രവാഹവും ഉദ്ദേശ്യബന്ധവും കൂടുതൽ സ്വാഭാവികമാകുന്നു.
