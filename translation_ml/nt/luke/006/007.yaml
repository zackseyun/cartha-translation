id: LUK.6.7
reference: Luke 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: ml
  text: ശബ്ബത്തിൽ അദ്ദേഹം സൗഖ്യമാക്കുമോ എന്നു കാണാൻ ശാസ്ത്രിമാരും പരീശന്മാരും അദ്ദേഹത്തെ സൂക്ഷ്മമായി നിരീക്ഷിച്ചുകൊണ്ടിരുന്നു[a], അദ്ദേഹത്തിനെതിരെ കുറ്റം ചുമത്താനുള്ള ആധാരം കണ്ടെത്താൻ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശ്രദ്ധാപൂർവം നോക്കിക്കൊണ്ടിരുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് സൂക്ഷ്മമായ നിരീക്ഷണം എന്ന അർഥമുണ്ട്; ഈ സന്ദർഭത്തിൽ അതിന് പ്രതികൂലമായ നിരീക്ഷണത്തിന്റെ ഭാവവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അദ്ദേഹത്തിനെതിരെ ഒരു കുറ്റാരോപണം കണ്ടെത്താൻ” അല്ലെങ്കിൽ “അദ്ദേഹത്തെ കുറ്റപ്പെടുത്താൻ.” ഗ്രീക്ക് പ്രയോഗം കുറ്റം ചുമത്താനുള്ള ആധാരമോ അവസരമോ തേടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: സൂക്ഷ്മമായി നിരീക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലരൂപം തുടർച്ചയായ നിരീക്ഷണത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അതിന് സംശയത്തോടെയുള്ള, പ്രതികൂലമായ സൂക്ഷ്മനോട്ടത്തിന്റെ ഭാവവുമുണ്ട്. ആ ഭാവം അതിരുകടക്കാതെ ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷവിവരണങ്ങളിൽ ഈ യഹൂദ മത-നിയമപണ്ഡിത വിഭാഗത്തിനായി മലയാളത്തിൽ പ്രചാരമുള്ളതും നേരിട്ടുള്ളതുമായ പദമാണ്.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ചരിത്രപരമായ വിഭാഗനാമത്തിന്റെ മലയാളത്തിലെ സ്ഥിരപ്രയോഗം.
- source_word: εἰ
  choice: -മോ എന്നു കാണാൻ
  rationale: നിരീക്ഷണക്രിയയ്ക്കു ശേഷമുള്ള പരോക്ഷചോദ്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ σαββάτῳ
  choice: ശബ്ബത്തിൽ
  rationale: കാലസൂചനയായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: θεραπεύει
  choice: സൗഖ്യമാക്കുമോ
  rationale: പരോക്ഷചോദ്യത്തിലെ വർത്തമാനകാലക്രിയയെ കഥയുടെ ഭൂതകാല വീക്ഷണത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഇവിടെ രോഗശാന്തി നൽകുക എന്ന അർഥം പ്രസക്തമാണ്.
- source_word: ἵνα εὕρωσιν
  choice: എന്തെങ്കിലും കാരണം കണ്ടെത്തുകയായിരുന്നു അവരുടെ ഉദ്ദേശ്യം
  rationale: ἵναയുടെ ഉദ്ദേശ്യാർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κατηγορεῖν αὐτοῦ
  choice: അദ്ദേഹത്തിനെതിരെ കുറ്റം ചുമത്താൻ
  rationale: κατηγορέωയുടെ നിയമപരമോ ഔപചാരികമോ ആയ ആരോപണഭാവം നിലനിർത്തുന്നു; εὕρωσιν കൂടിയുള്ളപ്പോൾ കുറ്റാരോപണത്തിന് ആധാരം തേടുന്നതെന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമാകുന്നു.
theological_decisions:
- issue: എതിരാളികളുടെ ഉദ്ദേശ്യത്തിന്റെ അവതരണം
  choice: അവർ യേശുവിനെതിരെ കുറ്റം ചുമത്താനുള്ള കാരണം തേടി സൂക്ഷ്മമായി നിരീക്ഷിച്ചുവെന്ന് അവതരിപ്പിച്ചു.
  alternative: അവർ അദ്ദേഹം സൗഖ്യമാക്കുന്നുണ്ടോ എന്ന് നിഷ്പക്ഷമായി നിരീക്ഷിച്ചു എന്നു വിവർത്തനം ചെയ്യാമായിരുന്നു.
  rationale: παρετηροῦντο എന്ന ക്രിയയുടെ സന്ദർഭപരമായ പ്രതികൂലഭാവവും ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ എന്ന വ്യക്തമായ ഉദ്ദേശ്യവാക്യവും നിരീക്ഷണം നിഷ്പക്ഷമല്ലെന്ന് കാണിക്കുന്നു. എന്നാൽ പാഠം പറയുന്നതിലപ്പുറം അവരുടെ മനോഭാവത്തെ വിശദീകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. “അദ്ദേഹം” എന്ന ആദരസൂചക സർവനാമം മലയാള ബൈബിൾ വായനയിൽ സ്വാഭാവികമായതിനാൽ സ്വീകരിച്ചു. സാങ്കേതിക വിശദീകരണം പ്രധാനവാക്യത്തിൽ ചുരുക്കി, യഥാർഥ പദാർഥവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
