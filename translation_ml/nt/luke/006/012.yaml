id: LUK.6.12
reference: Luke 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: ml
  text: ആ ദിവസങ്ങളിൽ, പ്രാർഥിക്കാനായി അദ്ദേഹം മലയിലേക്ക് പോയി; രാത്രി മുഴുവൻ ദൈവത്തോടുള്ള പ്രാർഥനയിൽ ചെലവഴിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ആ ദിവസങ്ങളിൽ
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനത്തിലെ സംഭവാവതരണ പ്രയോഗം മലയാളത്തിൽ വേറിട്ട ‘സംഭവിച്ചു’ ചേർക്കാതെ സ്വാഭാവികമായി പശ്ചാത്തലവാക്യത്തിലൂടെ പ്രകടമാക്കുന്നു; δέയുടെ ലഘുവായ ബന്ധകശക്തി അർധവിരാമത്തോടെ ബന്ധിപ്പിച്ച തുടർച്ചയിൽ നിലനിൽക്കുന്നു.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: മുൻസന്ദർഭത്തിലെ കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാള കാലപ്രയോഗം.
- source_word: ἐξελθεῖν αὐτὸν
  choice: അദ്ദേഹം ... പോയി
  rationale: ἐγένετοയ്ക്കു ശേഷമുള്ള accusative-infinitive ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ സമാപിക ക്രിയാവാക്യമായി മാറ്റുന്നു; തുടർന്നുള്ള ലക്ഷ്യസ്ഥാനം ചലനത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸ ὄρος
  choice: മലമുകളിലേക്കു
  rationale: ὄρος എന്നതിന്റെ ഉയർന്ന സ്ഥലമെന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; നിർദ്ദിഷ്ടമല്ലാത്ത ഭൂമിശാസ്ത്രവിവരം ചേർക്കുന്നില്ല.
- source_word: προσεύξασθαι
  choice: പ്രാർഥിക്കാനായി
  rationale: ചലനക്രിയയ്ക്കു പിന്നാലെയുള്ള ഉദ്ദേശ്യാർഥക infinitive മലയാളത്തിൽ ഉദ്ദേശ്യപ്രത്യയത്തോടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἦν διανυκτερεύων
  choice: രാത്രി മുഴുവൻ ... ചെലവഴിച്ചു
  rationale: periphrastic imperfect-ലുള്ള തുടർച്ചയും διανυκτερεύωയുടെ രാത്രി മുഴുവൻ നീളുന്ന പ്രവൃത്തിയും വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: ദൈവത്തോടുള്ള പ്രാർഥനയിൽ
  rationale: τοῦ θεοῦ ഇവിടെ പ്രാർഥനയുടെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘ദൈവത്തിന്റെ പ്രാർഥന’ എന്ന തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ഉടമസ്ഥതാർഥം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പ്രാർഥനയോടുള്ള ബന്ധത്തിൽ τοῦ θεοῦ എങ്ങനെ വിവർത്തനം ചെയ്യണം
  choice: ദൈവത്തോടുള്ള പ്രാർഥനയിൽ
  alternative: ദൈവത്തിന്റെ പ്രാർഥനയിൽ
  rationale: സന്ദർഭത്തിൽ പ്രാർഥന ദൈവത്തോടു നയിക്കപ്പെടുന്നതാണ്; ദൈവം തന്നെയാണ് പ്രാർഥിക്കുന്നതെന്നോ പ്രാർഥന ദൈവത്തിന്റെ ഉടമസ്ഥതയിലുള്ളതെന്നോ തോന്നിക്കുന്ന രൂപം ഒഴിവാക്കുന്നു. ‘പിതാവ്’ എന്ന വിശദീകരണം മൂലപാഠത്തിൽ ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ ബന്ധം അതിന്റെ സ്വാഭാവിക സമ്മർദത്തോടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അദ്ദേഹം’ ആദരസൂചക സർവനാമമായി ഉപയോഗിച്ചു. ഈ കരടിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല; ഇംഗ്ലീഷ് POBയിലെ [a] അടയാളവും അടിക്കുറിപ്പും തമ്മിൽ പൊരുത്തക്കേടുണ്ട്, കൂടാതെ നിർദേശിച്ച alternative പ്രധാനവാക്യത്തിലെ തുടർഭാഗത്തെയാണ് സംബന്ധിക്കുന്നത്. ഗ്രീക്ക് ആശയം പ്രധാനപാഠത്തിൽ നേരിട്ട് വ്യക്തമായി നൽകിയിരിക്കുന്നു.
