id: LUK.6.44
reference: Luke 6:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: ml
  text: കാരണം, ഓരോ വൃക്ഷവും സ്വന്തം ഫലത്താൽ അറിയപ്പെടുന്നു. കാരണം, മുള്ളുകളിൽനിന്ന് അത്തിപ്പഴങ്ങൾ ശേഖരിക്കുകയില്ല; ഒരു മുൾപ്പടർപ്പിൽനിന്ന് മുന്തിരിക്കുല കൊയ്യുകയുമില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: ഓരോ വൃക്ഷവും
  rationale: ἕκαστον എന്നതിന്റെ വിതരണാർഥവും ഏകവചനമായ δένδρον എന്നതും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: വാക്യങ്ങളുടെ വിശദീകരണബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: മലയാളത്തിൽ രണ്ടുതവണയും ‘എന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് പഴഞ്ചൊൽശൈലിയെ ഭാരപ്പെടുത്തും; മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധവും രണ്ടാമത്തെ വാക്യത്തിന്റെ ന്യായീകരണസ്വഭാവവും വാക്യക്രമത്തിൽ വ്യക്തമാണ്.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: അതതിന്റെ ഫലംകൊണ്ട്
  rationale: ἐκ എന്നതിന്റെ തിരിച്ചറിയൽമാനദണ്ഡം ‘കൊണ്ട്’ വ്യക്തമാക്കുന്നു; ἰδίου നൽകുന്ന ഓരോ വൃക്ഷത്തിനും സ്വന്തം ഫലമെന്ന ഊന്നൽ ‘അതതിന്റെ’ സംരക്ഷിക്കുന്നു.
- source_word: γινώσκεται
  choice: അറിയപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗവും പൊതുവായ സത്യത്തിന്റെ പഴഞ്ചൊൽസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: ἀκανθῶν
  choice: മുൾച്ചെടികളിൽനിന്ന്
  rationale: വെറും മുള്ളുകളെയല്ല, മുള്ളുള്ള സസ്യങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: συλλέγουσιν
  choice: ശേഖരിക്കുന്നില്ല
  rationale: ഫലം കൂട്ടിച്ചേർക്കുകയോ പറിച്ചെടുക്കുകയോ ചെയ്യുന്ന പൊതുവായ കാർഷികപ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: σῦκα
  choice: അത്തിപ്പഴം
  rationale: σύκα എന്നതിന്റെ സാധാരണ മലയാളപദം; എണ്ണവ്യത്യാസം മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി സ്വാഭാവികമാണ്.
- source_word: βάτου
  choice: മുൾപ്പടർപ്പിൽനിന്ന്
  rationale: βάτος സൂചിപ്പിക്കുന്ന മുള്ളുള്ള, പടർന്നുവളരുന്ന കുറ്റിച്ചെടിയുടെ സ്വഭാവം അനാവശ്യമായി സസ്യവർഗം നിർണ്ണയിക്കാതെ നൽകുന്നു.
- source_word: σταφυλήν
  choice: മുന്തിരിക്കുല
  rationale: ഗ്രീക്കിലെ ഏകവചനവും ഒരു മുന്തിരിക്കുല എന്ന സാദ്ധ്യമായ പ്രത്യേകാർഥവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: τρυγῶσιν
  choice: കൊയ്തെടുക്കുന്നതുമില്ല
  rationale: പാകമായ മുന്തിരി വിളവെടുക്കുക എന്ന പ്രത്യേക കാർഷികനിറം നിലനിർത്തുകയും συλλέγουσιν എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഫലത്തിന്റെ രൂപകാർഥം
  choice: ധാർമ്മിക പ്രയോഗം വിശദീകരിക്കാതെ കാർഷിക പഴഞ്ചൊൽ അതേ രൂപത്തിൽ നിലനിർത്തി.
  alternative: ‘ഫലം’ എന്നത് സ്വഭാവമോ പ്രവൃത്തികളോ ആണെന്ന് വിവർത്തനത്തിൽ തുറന്നുപറയുക.
  rationale: ഗ്രീക്ക് വാക്യം കാർഷികചിത്രം മാത്രമാണ് നേരിട്ട് പ്രസ്താവിക്കുന്നത്; അതിന്റെ സന്ദർഭപരമായ ധാർമ്മിക പ്രയോഗം വിവർത്തനം തന്നെ നിർണ്ണയിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പഴഞ്ചൊൽശൈലി. ‘അതതിന്റെ’ എന്ന പ്രയോഗം ἰδίουയുടെ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പുകൾക്ക് മാർക്കർ പൊരുത്തക്കേടുണ്ടെന്നും, മലയാള മുഖ്യപാഠത്തിലെ ‘മുൾച്ചെടി/മുൾപ്പടർപ്പ്’ തെരഞ്ഞെടുപ്പുകൾ ഗ്രീക്ക് അർഥപരിധി നേരിട്ട് വ്യക്തമാക്കുന്നതിനാൽ ഇവിടെ അടിക്കുറിപ്പ് ആവശ്യമില്ലെന്നും വിലയിരുത്തി.
