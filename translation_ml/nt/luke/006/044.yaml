revisions:
- from: ഓരോ വൃക്ഷവും അതതിന്റെ ഫലംകൊണ്ടാണ് അറിയപ്പെടുന്നത്. മുൾച്ചെടികളിൽനിന്ന് ആരും അത്തിപ്പഴം ശേഖരിക്കുന്നില്ല; മുൾപ്പടർപ്പിൽനിന്ന് മുന്തിരിക്കുല കൊയ്തെടുക്കുന്നതുമില്ല.
  to: കാരണം, ഓരോ വൃക്ഷവും സ്വന്തം ഫലത്താൽ അറിയപ്പെടുന്നു. കാരണം, മുള്ളുകളിൽനിന്ന് അത്തിപ്പഴങ്ങൾ ശേഖരിക്കുകയില്ല; ഒരു മുൾപ്പടർപ്പിൽനിന്ന് മുന്തിരിക്കുല കൊയ്യുകയുമില്ല.
