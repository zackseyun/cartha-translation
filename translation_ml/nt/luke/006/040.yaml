id: LUK.6.40
reference: Luke 6:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: ml
  text: ഒരു ശിഷ്യൻ തന്റെ ഗുരുവിനെക്കാൾ ഉയർന്നവനല്ല[a]. എന്നാൽ പൂർണമായി പരിശീലനം ലഭിച്ച ഏവനും തന്റെ ഗുരുവിനെപ്പോലെയായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു വിദ്യാർഥി തന്റെ അധ്യാപകനെക്കാൾ ഉയർന്നവനല്ല.”
    reason: μαθητής, διδάσκαλος എന്നീ പദങ്ങളുടെ കൂടുതൽ അക്കാദമികമായ മലയാള പകരങ്ങൾ സൂചിപ്പിക്കുന്നു.
  - marker: b
    text: അഥവാ, “പൂർണമായി ഒരുക്കപ്പെട്ട ഏവനും തന്റെ ഗുരുവിനെപ്പോലെയായിരിക്കും.”
    reason: κατηρτισμένος എന്ന പദത്തിന് പരിശീലിപ്പിക്കപ്പെട്ട എന്നതിനൊപ്പം ഒരുക്കപ്പെട്ട, സജ്ജമാക്കപ്പെട്ട എന്നീ അർഥസാധ്യതകളും ഉണ്ട്.
lexical_decisions:
- source_word: μαθητής
  choice: ശിഷ്യൻ
  rationale: പഠിക്കുന്നയാൾ എന്നതിലുപരി ഗുരുവിനോടു ചേർന്ന് രൂപപ്പെടുന്ന അനുയായിയുടെ ബന്ധപരവും പരിശീലനപരവുമായ അർഥം ‘ശിഷ്യൻ’ നിലനിർത്തുന്നു.
- source_word: ὑπὲρ
  choice: ഉയർന്നവൻ
  rationale: ഇവിടെ പദവി, നില, മേന്മ എന്നിവയിലെ താരതമ്യമാണ് സൂചിപ്പിക്കുന്നത്; ‘ഗുരുവിനെക്കാൾ ഉയർന്നവൻ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: διδάσκαλον / διδάσκαλος
  choice: ഗുരു
  rationale: ശിഷ്യൻ എന്ന പദത്തോടൊപ്പം സ്വാഭാവികമായി ചേരുകയും പഠിപ്പിക്കുകയും രൂപപ്പെടുത്തുകയും ചെയ്യുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; അധികാരപരമായ അനാവശ്യ അർഥം ഇവിടെ നിർബന്ധിക്കുന്നില്ല.
- source_word: κατηρτισμένος
  choice: പൂർണമായി പരിശീലനം ലഭിച്ച
  rationale: καταρτίζω എന്ന ക്രിയയുടെ perfect passive participle ഒരു വ്യക്തി പരിശീലിപ്പിക്കപ്പെട്ട് ഒരുക്കപ്പെട്ട അവസ്ഥയിലെത്തിയതിനെ സൂചിപ്പിക്കുന്നു. ശിഷ്യൻ–ഗുരു പശ്ചാത്തലത്തിൽ പരിശീലനം എന്ന അർഥമാണ് ഏറ്റവും യോജിച്ചത്; ഒരുക്കപ്പെട്ട/സജ്ജനാക്കപ്പെട്ട എന്ന വിശാല സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πᾶς
  choice: ഏവനും
  rationale: പുല്ലിംഗ ഏകവചനമായിരുന്നാലും ഇവിടെ പൊതുവായ പ്രയോഗമാണ്; ‘ഏവനും’ ആ വ്യാപ്തിയും ഏകവചന ഘടനയും നിലനിർത്തുന്നു.
- source_word: ὡς
  choice: പോലെ
  rationale: താരതമ്യം സൂചിപ്പിക്കുന്ന ὡς എന്ന പദത്തിന് ഈ പഴമൊഴിസദൃശ വാക്യത്തിൽ സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: സർവനാമം ഓരോ ശിഷ്യന്റെയും സ്വന്തം ഗുരുവിലേക്കാണ് മടങ്ങുന്നത്. മലയാളത്തിലെ ‘തന്റെ’ ഏകവചനബന്ധം വ്യക്തമായി നിലനിർത്തുകയും അനാവശ്യമായ ലിംഗചിഹ്നനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ശിഷ്യൻ ഗുരുവിനെക്കാൾ ‘മുകളിൽ’ അല്ല എന്ന താരതമ്യത്തിന്റെ സ്വഭാവം
  choice: ‘തന്റെ ഗുരുവിനെക്കാൾ ഉയർന്നവനല്ല’ എന്ന് പരിഭാഷപ്പെടുത്തി, പദവി/മേന്മയുടെ താരതമ്യം തുറന്നുവച്ചു.
  alternative: ‘തന്റെ ഗുരുവിനെക്കാൾ വലിയവനല്ല’ അല്ലെങ്കിൽ ‘ഗുരുവിനു മീതെയല്ല’
  rationale: ὑπέρ ഇവിടെ സ്ഥാനം, പദവി, മേന്മ എന്നിവയിൽ ഏതിനെയും ഉൾക്കൊള്ളാവുന്നതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കാതെ താരതമ്യത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- issue: κατηρτισμένος എന്നതിന്റെ പരിശീലനം, ഒരുക്കം, പൂർണത എന്നീ അർഥസാധ്യതകൾ
  choice: ശിഷ്യൻ–ഗുരു സന്ദർഭത്തിന് യോജിച്ച് ‘പൂർണമായി പരിശീലനം ലഭിച്ച’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ‘പൂർണമായി ഒരുക്കപ്പെട്ട’ അല്ലെങ്കിൽ ‘സജ്ജനാക്കപ്പെട്ട’
  rationale: വിദ്യാഭ്യാസപരമായ സന്ദർഭം പരിശീലനം എന്ന വായനയെ ശക്തമാക്കുന്നു; എങ്കിലും പദത്തിന്റെ വിശാലമായ ഒരുക്കൽ/സജ്ജീകരിക്കൽ അർഥം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: പൊതുവായ പുല്ലിംഗ ഏകവചന പരാമർശം
  choice: ‘ഏവനും തന്റെ ഗുരു’ എന്ന സ്വാഭാവിക മലയാള ഘടന ഉപയോഗിച്ചു.
  alternative: ‘ഓരോ ശിഷ്യനും അവന്റെ ഗുരു’
  rationale: ഗ്രീക്കിലെ ഏകവചനവും പൊതുവ്യാപ്തിയും നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘തന്റെ’ എന്നത് ലിംഗം അനാവശ്യമായി നിർണ്ണയിക്കാതെ അതേ വ്യക്തിയിലേക്കുള്ള മടക്കസൂചന കൃത്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ശിഷ്യൻ–ഗുരു’ എന്ന ബന്ധപരമായ പദജോടി നിലനിർത്തി; മുഖ്യപാഠത്തിലെ രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കുശേഷം ചേർത്തിരിക്കുന്നു.
