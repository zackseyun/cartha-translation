id: LUK.6.45
reference: Luke 6:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: ml
  text: നല്ല മനുഷ്യൻ തന്റെ ഹൃദയത്തിലെ നല്ല ഭണ്ഡാരത്തിൽനിന്ന് നന്മ പുറത്തുകൊണ്ടുവരുന്നു; ദുഷ്ടനായ മനുഷ്യൻ തന്റെ തിന്മയുടെ ഭണ്ഡാരത്തിൽനിന്ന് തിന്മ പുറത്തുകൊണ്ടുവരുന്നു. ഹൃദയത്തിൽ നിറഞ്ഞുകവിഞ്ഞതിൽനിന്നാണല്ലോ അവന്റെ വായ് സംസാരിക്കുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹൃദയത്തിന്റെ സമൃദ്ധിയിൽനിന്നാണല്ലോ അവന്റെ വായ് സംസാരിക്കുന്നത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: നല്ല മനുഷ്യൻ
  rationale: പ്രതിനിധാനപരമായ ഏകവചനത്തെയും ധാർമിക ഗുണത്തെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θησαυροῦ
  choice: നിക്ഷേപം
  rationale: ഉള്ളിൽ സൂക്ഷിച്ചുവെച്ച ശേഖരം എന്ന രൂപകം നിലനിർത്തുന്നു; ‘ഭണ്ഡാരം’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: καρδίας
  choice: ഹൃദയം
  rationale: മനുഷ്യന്റെ ആന്തരിക സ്വഭാവം, ഇച്ഛ, വികാരം എന്നിവ സൂചിപ്പിക്കുന്ന പതിവായ ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: προφέρει
  choice: പുറത്തുകൊണ്ടുവരുന്നു
  rationale: ആന്തരിക ഉറവിടത്തിൽനിന്ന് ഒരു കാര്യം പുറത്തുവരുന്നു എന്ന ദൃശ്യരൂപം ഇരുവാക്യഭാഗങ്ങളിലും സമാന്തരമായി സൂക്ഷിക്കുന്നു.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: ദുഷ്ടനായ / ദുഷിച്ച / തിന്മ
  rationale: വ്യക്തിയുടെ ധാർമിക സ്വഭാവവും അതിൽനിന്നു പുറപ്പെടുന്ന തിന്മയും മലയാളത്തിൽ സ്വാഭാവികമായി വേർതിരിച്ചറിയിക്കുന്നു; ഗ്രീക്കിലെ ധാർമിക ശക്തി മയപ്പെടുത്തുന്നില്ല.
- source_word: περισσεύματος
  choice: നിറവ്
  rationale: ഹൃദയത്തിൽ സമൃദ്ധമായി നിറഞ്ഞിരിക്കുന്നതിൽനിന്ന് വാക്കുകൾ പുറപ്പെടുന്നു എന്ന അർഥം നൽകുന്നു; ‘കവിഞ്ഞൊഴുക്ക്’ എന്ന ദൃശ്യാത്മക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: λαλεῖ
  choice: സംസാരിക്കുന്നു
  rationale: പഴഞ്ചൊല്ലുസ്വഭാവമുള്ള പ്രസ്താവനയ്ക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള തുല്യം.
- source_word: τὸ στόμα αὐτοῦ
  choice: അവന്റെ വായ്
  rationale: ഹൃദയത്തിലെ ആന്തരികാവസ്ഥയുടെ ബാഹ്യപ്രകടനത്തെ ഊന്നുന്ന ഗ്രീക്കിലെ വ്യക്തമായ ‘വായ്’ എന്ന പരാമർശം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀγαθός/πονηρός എന്ന പദങ്ങളിലെ മനുഷ്യസ്വഭാവപരവും ധാർമികവുമായ വൈരുധ്യം
  choice: ‘നല്ല മനുഷ്യൻ’ എന്നും ‘ദുഷ്ടനായ മനുഷ്യൻ’ എന്നും ധാർമിക വിഭാഗങ്ങൾ നിലനിർത്തി.
  alternative: ‘നല്ല വ്യക്തി ... മോശം വ്യക്തി’ അല്ലെങ്കിൽ പ്രവർത്തനക്ഷമത സൂചിപ്പിക്കുന്ന മൃദുവായ പദങ്ങൾ.
  rationale: ഇവിടെ യേശുവിന്റെ ഉപദേശം മനുഷ്യന്റെ ധാർമിക സ്വഭാവവും അതിന്റെ ബാഹ്യഫലവും സംബന്ധിച്ചതാണ്; അതിനാൽ വൈരുധ്യത്തിന്റെ നൈതിക ശക്തി മയപ്പെടുത്തരുത്.
- issue: περισσεύματος എന്നതിലെ സമൃദ്ധി/കവിഞ്ഞൊഴുക്ക് രൂപകം
  choice: മുഖ്യപാഠത്തിൽ ‘നിറവ്’; അടിക്കുറിപ്പിൽ ‘കവിഞ്ഞൊഴുക്ക്’.
  alternative: മുഖ്യപാഠത്തിൽ ‘സമൃദ്ധി’ അല്ലെങ്കിൽ ‘കവിഞ്ഞൊഴുക്ക്’.
  rationale: ‘നിറവ്’ സ്വാഭാവിക മലയാളത്തിൽ ഹൃദയത്തിൽ നിറഞ്ഞിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കവിഞ്ഞൊഴുക്ക്’ ഉറവിടപദത്തിന്റെ കൂടുതൽ ദൃശ്യാത്മകമായ സാധ്യതയായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സമാന്തര ഘടനയും ഹൃദയം–വായ് എന്ന ഉറവിടരൂപകവും നിലനിർത്തിയിരിക്കുന്നു; അത്യന്തം സംസ്കൃതഭാരമുള്ള പദങ്ങൾ ഒഴിവാക്കി.
