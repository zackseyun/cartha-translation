id: LUK.6.32
reference: Luke 6:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: ml
  text: നിങ്ങളെ സ്നേഹിക്കുന്നവരെ നിങ്ങൾ സ്നേഹിക്കുന്നുവെങ്കിൽ, നിങ്ങൾക്കു എന്തു പ്രശംസയുണ്ട്?[a] കാരണം, പാപികൾ പോലും തങ്ങളെ സ്നേഹിക്കുന്നവരെ സ്നേഹിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾക്കു എന്തു കൃപയുണ്ട്?” ഗ്രീക്ക് പദത്തിന് ‘കൃപ,’ ‘അംഗീകാരം,’ ‘പ്രശംസ’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ അഭിനന്ദനാർഹമായതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: സ്നേഹിക്കുക
  rationale: മൂന്നു പ്രയോഗങ്ങളിലും ഒരേ പദം നിലനിർത്തി ഗ്രീക്കിലെ ആവർത്തനവും വാക്യത്തിന്റെ വാഗ്വൈഭവവും സംരക്ഷിക്കുന്നു.
- source_word: ποία
  choice: എന്തു
  rationale: പ്രശംസയുടെ സ്വഭാവവും അളവും ചോദിക്കുന്ന വാഗ്‌ചോദ്യത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: χάρις
  choice: പ്രശംസ
  rationale: ഈ സന്ദർഭത്തിൽ രക്ഷാസംബന്ധിയായ ‘കൃപ’ എന്ന അർഥത്തേക്കാൾ, അഭിനന്ദനാർഹതയെയോ ലഭിക്കുന്ന അംഗീകാരത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἁμαρτωλοὶ
  choice: പാപികൾ
  rationale: ഗ്രീക്കിലെ നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ നേരിട്ടുള്ളതും പുതിയനിയമത്തിൽ പരിചിതവുമായ മലയാളരൂപം.
- source_word: καὶ γὰρ
  choice: പോലും … വല്ലോ
  rationale: καί നൽകുന്ന ഊന്നലും γάρ നൽകുന്ന വിശദീകരണസ്വഭാവവും സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്ക്
  rationale: χάρις എന്നതോടു ബന്ധപ്പെട്ട ഗ്രീക്ക് ദത്തിവിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം.
theological_decisions:
- issue: യേശുവിന്റെ ചോദ്യത്തിലെ χάρις എന്ന പദത്തിന്റെ അർഥം
  choice: രക്ഷാസംബന്ധിയായ ‘കൃപ’ എന്നതിനു പകരം സന്ദർഭോചിതമായ ‘പ്രശംസ’
  alternative: കൃപ; അംഗീകാരം; പ്രതിഫലം
  rationale: പരസ്പരം സ്നേഹിക്കുന്നവരെ മാത്രം സ്നേഹിക്കുന്നതിൽ എന്താണ് അഭിനന്ദനാർഹമെന്നതാണ് സന്ദർഭത്തിലെ ധാർമിക ചോദ്യം. ‘കൃപ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകിയാൽ ഇവിടെ മുൻനിരയിലില്ലാത്ത സിദ്ധാന്തപരമായ അർഥം വായനക്കാർ ഉൾക്കൊള്ളാൻ ഇടയുണ്ട്; പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ സ്നേഹം എന്ന പദത്തിന്റെ മൂന്നുവട്ടമുള്ള ആവർത്തനം നിലനിർത്തി. മുഖ്യപാഠത്തിലെ ‘മാത്രം’ ഗ്രീക്കിൽ പ്രത്യേകം പദമായി ഇല്ലെങ്കിലും പരിമിതമായ പരസ്പരസ്നേഹത്തെക്കുറിച്ചുള്ള വ്യവസ്ഥയുടെ സ്വാഭാവിക മലയാളസൂചനയായി ഉപയോഗിച്ചു.
