  to: കാരണം, ചീഞ്ഞ ഫലം കായ്ക്കുന്ന നല്ല വൃക്ഷമില്ല; അതുപോലെതന്നെ, നല്ല ഫലം കായ്ക്കുന്ന ചീഞ്ഞ വൃക്ഷവുമില്ല.[a]
