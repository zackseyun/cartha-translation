id: LUK.6.43
reference: Luke 6:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: ml
  text: കാരണം, ചീഞ്ഞ ഫലം കായ്ക്കുന്ന നല്ല വൃക്ഷമില്ല; അതുപോലെതന്നെ, നല്ല ഫലം കായ്ക്കുന്ന ചീഞ്ഞ വൃക്ഷവുമില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മോശമായ ഫലം / മോശമായ വൃക്ഷം.” σαπρός എന്ന ഗ്രീക്ക് പദത്തിന് ചീഞ്ഞത്, കേടായത്, മോശമായത് എന്നീ അർഥങ്ങൾ വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: കായ്ക്കുന്നില്ല
  rationale: അക്ഷരാർഥത്തിലെ അസ്തിത്വപ്രസ്താവന മലയാളത്തിൽ സ്വാഭാവികമായ നിഷേധവാക്യമായി നൽകി; γάρ സൂചിപ്പിക്കുന്ന വിശദീകരണബന്ധം സന്ദർഭവും വാക്യക്രമവും വഹിക്കുന്നു.
- source_word: δένδρον
  choice: വൃക്ഷം
  rationale: ഫലം കായ്ക്കുന്ന മരത്തെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പദം.
- source_word: καλὸν
  choice: നല്ല
  rationale: കാർഷികവും ധാർമ്മികവുമായ അർഥധ്വനികൾ രണ്ടും നിലനിർത്തുന്നു.
- source_word: ποιοῦν καρπὸν
  choice: ഫലം കായ്ക്കുന്ന
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഫലം ഉണ്ടാക്കുന്ന’ എന്നായാലും, ഫലവൃക്ഷത്തെക്കുറിച്ചുള്ള മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘ഫലം കായ്ക്കുക’ എന്നതാണ്.
- source_word: σαπρόν
  choice: ചീഞ്ഞ
  rationale: കേടായതോ അഴുകിയതോ ആയ ഫലത്തിന്റെ ദൃശ്യബിംബം നിലനിർത്തുകയും ‘മോശം’ എന്ന അമൂർത്ത വിലയിരുത്തലിലേക്ക് നേരത്തേ മാറാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐδὲ πάλιν
  choice: അതുപോലെതന്നെ … കായ്ക്കുന്നതുമില്ല
  rationale: രണ്ടാമത്തെ നിഷേധവാക്യവും വിപരീത സമാന്തരതയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δένδρον σαπρὸν
  choice: ചീഞ്ഞ വൃക്ഷം
  rationale: σαπρός എന്ന ഒരേ ഗ്രീക്ക് പദത്തോട് ആദ്യഭാഗത്തിലെ പദസാമ്യം നിലനിർത്തുന്നു; ഇവിടെ ‘ചീഞ്ഞ’ എന്നത് ആരോഗ്യരഹിതമോ കേടുപറ്റിയതോ ആയ വൃക്ഷത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: καρπὸν καλόν
  choice: നല്ല ഫലം
  rationale: ആദ്യഭാഗത്തോടുള്ള പ്രതിവിരുദ്ധ സമാന്തരത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കാർഷിക രൂപകത്തിലെ σαπρός എന്ന പദത്തിന്റെ തീവ്രത
  choice: രണ്ടിടത്തും ‘ചീഞ്ഞ’
  alternative: ‘മോശമായ’ അല്ലെങ്കിൽ ‘കേടായ’
  rationale: മൂലപാഠത്തിലെ മൂർത്തമായ കാർഷിക ചിത്രം സംരക്ഷിച്ച് അതിന്റെ ധാർമ്മിക പ്രയോഗം സന്ദർഭത്തിൽനിന്ന് ഉയർന്നുവരാൻ അനുവദിക്കുന്നു; വ്യാഖ്യാനത്തെ മുഖ്യപാഠത്തിൽ അമൂർത്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വൃക്ഷം’ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; ‘ഫലം കായ്ക്കുക’ സാധാരണ മലയാളപ്രയോഗമാണ്. പദസാമ്യവും വാക്യത്തിന്റെ പ്രതിവിരുദ്ധ സമാന്തരതയും സംരക്ഷിച്ചു.
