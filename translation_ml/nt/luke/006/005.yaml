id: LUK.6.5
reference: Luke 6:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν ⸀αὐτοῖς· Κύριός ἐστιν ⸂τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “മനുഷ്യപുത്രൻ ശബ്ബത്തിന്റെ കർത്താവാണ്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യപുത്രൻ ശബ്ബത്തിന്മേൽ കർത്താവാണ്.”
    reason: ജനിറ്റീവ് ഘടനയെ അധികാരബന്ധമായി കൂടുതൽ വ്യക്തമായി പറയാവുന്ന പദപ്രയോഗവികൽപം.
lexical_decisions:
- source_word: καὶ
  choice: അവൻ…
  rationale: മുൻവിവരണവുമായി ബന്ധിപ്പിക്കുന്ന καί മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹത്തിൽ പ്രത്യേകം ‘എന്നിട്ട്’ എന്നു ചേർക്കാതെ അവതരിപ്പിച്ചു; അതിലൂടെ ഗ്രീക്കിലില്ലാത്ത സമയസൂചന ഒഴിവാക്കുന്നു.
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടരുന്ന ആഖ്യാനഭാവം നിലനിർത്തുന്നു; ലളിതമായ ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ഉറവിടരൂപത്തിന്റെ വശം വ്യക്തമാക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: ദത്തിവ് ബഹുവചന സർവനാമത്തെ സന്ദർഭത്തിന് യോജിച്ചും അധിക വ്യക്തിവിവരം ചേർക്കാതെയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Κύριος
  choice: കർത്താവ്
  rationale: ഇവിടെ ഇത് വെറും ആദരസംബോധനയല്ല, അധികാരത്തെ പ്രഖ്യാപിക്കുന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിയാണ്; ‘കർത്താവ്’ അതിന്റെ ശക്തിയും പരിചിതത്വവും നിലനിർത്തുന്നു.
- source_word: τοῦ σαββάτου
  choice: ശബ്ബത്തിന്റെ
  rationale: κύριος-നോടു ചേർന്ന ജനിറ്റീവ് ഘടന നേരിട്ട് സംരക്ഷിക്കുകയും ശബ്ബത്തിന്മേലുള്ള അധികാരം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശു ഉപയോഗിക്കുന്ന സ്ഥാപിതമായ സ്വയംസൂചക പദവിയും അതിന്റെ സെമിറ്റിക് പശ്ചാത്തലവും ദാനീയേൽ 7-ലേക്കുള്ള സാധ്യതയുള്ള സൂചനയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്.
theological_decisions:
- issue: ശബ്ബത്തിനെ സംബന്ധിച്ച മനുഷ്യപുത്രന്റെ അധികാരത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി
  choice: “മനുഷ്യപുത്രൻ ശബ്ബത്തിന്റെ കർത്താവാണ്” എന്ന നേരിട്ടുള്ള അവകാശവാദമായി വിവർത്തനം ചെയ്തു.
  alternative: “മനുഷ്യപുത്രൻ ശബ്ബത്തിന്മേൽ കർത്താവാണ്.”
  rationale: ഗ്രീക്ക് പദക്രമം ‘കർത്താവ്’ എന്ന ആശയത്തെ മുൻനിർത്തുന്നു; മുഖ്യപ്രഖ്യാപനം ശബ്ബത്തിനെ സംബന്ധിച്ച മനുഷ്യപുത്രന്റെ അധികാരമാണ്. ‘പോലും’ എന്ന വ്യാഖ്യാനാത്മക പദം മൂലവാക്യത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയും നിലനിർത്തി. ‘മനുഷ്യപുത്രൻ,’ ‘ശബ്ബത്ത്,’ ‘കർത്താവ്’ എന്നീ പരിചിതമായ വേദപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി.
