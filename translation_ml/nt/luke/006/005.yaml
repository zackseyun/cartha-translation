  source_fidelity: ഗ്രീക്ക് വാക്യത്തിലെ καί, ἔλεγεν, αὐτοῖς, കൂടാതെ ‘മനുഷ്യപുത്രൻ ശബ്ബത്തിന്റെ കർത്താവാണ്’ എന്ന മുഖ്യപ്രഖ്യാപനം വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു. ‘അവൻ’ ഉപയോഗിച്ച് καί-യെ മലയാള ആഖ്യാനശൈലിയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളിച്ചതിൽ അർഥനഷ്ടമില്ല. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ἔλεγεν-ന്റെ അപൂർണഭൂതകാല ഭാവം യഥാവിധി സൂക്ഷിക്കുന്നു.
  naturalness: ‘അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന പ്രയോഗം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വീകാര്യവും വ്യക്തവുമാണ്; ഉദ്ധരിച്ച പ്രഖ്യാപനത്തിന്റെ ഗൗരവത്തിനും യോജിക്കുന്നു. ‘മനുഷ്യപുത്രൻ,’ ‘ശബ്ബത്ത്,’ ‘കർത്താവ്’ എന്നിവ പരിചിതവും സ്വാഭാവികവുമായ വേദപദാവലിയാണ്.
  terminology: Κύριος-ന് ‘കർത്താവ്’ എന്നും ὁ υἱὸς τοῦ ἀνθρώπου-ന് ‘മനുഷ്യപുത്രൻ’ എന്നും നൽകിയിരിക്കുന്നത് സ്ഥാപിത മലയാള വേദപരിഭാഷയോടും ഉറവിടത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തിയോടും യോജിക്കുന്നു. ‘ശബ്ബത്തിന്റെ കർത്താവ്’ ജനിറ്റീവിന്റെ സംക്ഷിപ്തമായ അധികാരബന്ധം സൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പിലെ ‘ശബ്ബത്തിന്മേൽ കർത്താവാണ്’ അർഥസാധ്യമായ വ്യാകരണ-വ്യക്തീകരണവികൽപമാണ്.
