  rationale: മുഖ്യപാഠത്തിന്റെ വിവർത്തനം നിലനിർത്തി. അടിക്കുറിപ്പിലെ വ്യാഖ്യാനാത്മകമായ ‘പെരുമാറുക’ മാറ്റി, മൂലത്തിലെ വിശാലമായ ‘ചെയ്യുക’ എന്ന ക്രിയയും ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിലെ സമാനമായ പദവ്യാപ്തിയും സംരക്ഷിക്കുന്ന ഒരു തുല്യമായ ബദൽ നൽകി. അടിക്കുറിപ്പ് അതു ബാധിക്കുന്ന താരതമ്യ ഉപവാക്യത്തോടു ചേർത്ത് നങ്കൂരമിട്ടു.
