id: LUK.6.31
reference: Luke 6:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: ml
  text: ആളുകൾ നിങ്ങൾക്കു ചെയ്യണമെന്ന് നിങ്ങൾ ആഗ്രഹിക്കുന്നതുപോലെതന്നെ[a], നിങ്ങളും അവർക്കു ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മറ്റുള്ളവർ നിങ്ങൾക്കു ചെയ്യണമെന്ന് നിങ്ങൾ ആഗ്രഹിക്കുന്നതുപോലെ, നിങ്ങളും അവർക്കു അതുപോലെ ചെയ്യുക.”'
    reason: ഗ്രീക്കിലെ താരതമ്യ-പരസ്പര ഘടന നിലനിർത്തിക്കൊണ്ടുള്ള സ്വാഭാവികമായ മറ്റൊരു വാക്യക്രമം.
lexical_decisions:
- source_word: καθὼς
  choice: പോലെതന്നെ
  rationale: തുടർന്നുള്ള കല്പനയ്ക്ക് താരതമ്യത്തിന്റെ മാനദണ്ഡം നൽകുന്നു; ‘പോലെതന്നെ’ ഗ്രീക്കിലെ താരതമ്യശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θέλετε
  choice: നിങ്ങൾ ആഗ്രഹിക്കുന്ന
  rationale: ഇവിടെ θέλω സാധാരണമായ ആഗ്രഹത്തെയോ ഇഷ്ടത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ആഗ്രഹിക്കുക’ ആ അർഥം മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: നിങ്ങൾക്കു ചെയ്യണമെന്ന്
  rationale: θέλετε-യോടൊപ്പമുള്ള ἵνα ഉപവാക്യം ആഗ്രഹിക്കുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു. ഈ ഘടന മലയാളത്തിൽ ‘ചെയ്യണമെന്ന് ... ആഗ്രഹിക്കുന്നു’ എന്ന രൂപത്തിൽ സ്വാഭാവികമാണ്.
- source_word: οἱ ἄνθρωποι
  choice: ആളുകൾ
  rationale: ഇവിടെ പദം പുരുഷന്മാരെ മാത്രം അല്ല, പൊതുവായി മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആളുകൾ’ അതിന്റെ ലിംഗനിരപേക്ഷവും സാധാരണവുമായ അർഥം നൽകുന്നു.
- source_word: ποιεῖτε
  choice: ചെയ്യുക
  rationale: വർത്തമാനകാല കല്പന തുടർച്ചയായ ധാർമിക ആചരണത്തെ ആവശ്യപ്പെടുന്നു. മലയാളത്തിലെ ‘ചെയ്യുക’ കല്പനയെ അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: ὑμῖν (‘നിങ്ങൾക്കു’) എന്നതിനോടുള്ള സമാന്തരത നിലനിർത്തുകയും പരസ്പരബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὁμοίως
  choice: അതുപോലെതന്നെ
  rationale: അനുരൂപമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ὁμοίως-ന്റെ ശക്തി ‘അതുപോലെതന്നെ’ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: οἱ ἄνθρωποι എന്നതിന്റെ പൊതുവായ മനുഷ്യസൂചന
  choice: ആളുകൾ
  alternative: പുരുഷന്മാർ
  rationale: സന്ദർഭത്തിൽ ഈ ഗ്രീക്കുപദം പുരുഷലിംഗത്തെ മാത്രമല്ല, ആളുകളെ പൊതുവായാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ലിംഗപരമായ പരിധി അനാവശ്യമായി ചേർക്കാത്ത ‘ആളുകൾ’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കല്പനാരൂപം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ‘ചെയ്യുക’ എന്ന ക്രിയയുടെ ആവർത്തനവും വാക്യത്തിന്റെ പരസ്പരഘടനയും മുഖ്യപാഠത്തിൽ നിലനിർത്തി; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘പെരുമാറുക’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
