  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐγένετο ἡμέρα, προσεφώνησεν τοὺς μαθητὰς αὐτοῦ, καὶ ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα, οὓς καὶ ἀποστόλους ὠνόμασεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: ml
  text: നേരം പുലർന്നപ്പോൾ, യേശു തന്റെ ശിഷ്യന്മാരെ തന്റെ അടുക്കലേക്കു വിളിച്ചു[a]. അവരിൽനിന്ന് പന്ത്രണ്ടുപേരെ തിരഞ്ഞെടുത്ത് അവർക്കു ‘അപ്പൊസ്തലന്മാർ’ എന്നു പേരിട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ ശിഷ്യന്മാരെ വിളിച്ചുവരുത്തി.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘തന്റെ അടുക്കലേക്കു വിളിക്കുക’ എന്നും ‘അഭിസംബോധന ചെയ്യുക’ എന്നും അർഥമാകാം; ഇവിടെ തിരഞ്ഞെടുപ്പിനായി അവരെ കൂട്ടിവരുത്തുന്നതാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരെ അപ്പൊസ്തലന്മാർ എന്നു വിളിച്ചു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘പേരിടുക’ എന്നും ‘വിളിക്കുക’ എന്നും അർഥമുണ്ട്; മുമ്പുള്ള ‘വിളിച്ചു’ എന്നതിൽനിന്ന് വേർതിരിച്ചറിയാൻ മുഖ്യപാഠത്തിൽ ‘പേരിട്ടു’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: നേരം പുലർന്നപ്പോൾ
  rationale: പകൽ വന്നെത്തിയെന്ന ഗ്രീക്ക് കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: προσεφώνησεν
  choice: അടുക്കൽ വിളിച്ചു
  rationale: ഇവിടെ തിരഞ്ഞെടുപ്പിനായി ശിഷ്യന്മാരെ തന്റെ അടുക്കൽ കൂട്ടിവരുത്തുന്നതാണ് സന്ദർഭം; വെറും അഭിസംബോധന ചെയ്യുക എന്ന അർഥത്തേക്കാൾ ഇത് യോജിക്കുന്നു.
- source_word: μαθητὰς
  choice: ശിഷ്യന്മാരെ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ μαθητής എന്ന പദത്തിന്റെ ബന്ധപരവും പഠനപരവുമായ അർഥം വഹിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപദം.
- source_word: ἐκλεξάμενος
  choice: തിരഞ്ഞെടുത്ത്
  rationale: വലിയ ശിഷ്യഗണത്തിൽനിന്നുള്ള ഉദ്ദേശ്യപൂർവമായ തിരഞ്ഞെടുപ്പിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀπ’ αὐτῶν
  choice: അവരിൽനിന്ന്
  rationale: പന്ത്രണ്ടുപേർ വിശാലമായ ശിഷ്യഗണത്തിൽനിന്നാണ് തിരഞ്ഞെടുക്കപ്പെട്ടതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: δώδεκα
  choice: പന്ത്രണ്ടുപേരെ
  rationale: മനുഷ്യരെ എണ്ണുന്ന മലയാളരീതിക്ക് അനുസരിച്ച് സംഖ്യയെ വ്യക്തമായി നൽകുന്നു.
- source_word: ἀποστόλους
  choice: അപ്പൊസ്തലന്മാർ
  rationale: ഇവിടെ യേശു പന്ത്രണ്ടുപേർക്കു നൽകുന്ന പ്രത്യേക പദവിനാമമാണിത്; ‘ദൂതന്മാർ’ എന്ന പൊതുവായ വിവർത്തനം അതിന്റെ രൂപപ്പെടുന്ന സാങ്കേതിക അർഥം മങ്ങിക്കളയും.
- source_word: ὠνόμασεν
  choice: പേരിട്ടു
  rationale: പ്രത്യേക നാമമോ പദവിയോ നൽകുക എന്ന അർഥം വ്യക്തമാക്കുകയും മുമ്പുള്ള ‘വിളിച്ചു’ എന്ന ക്രിയയുമായുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἀποστόλους എന്നത് അർഥാനുവാദമായി നൽകണമോ സ്ഥാപിതമായ പദവിനാമമായി നൽകണമോ
  choice: അപ്പൊസ്തലന്മാർ
  alternative: അയയ്ക്കപ്പെട്ടവർ; ദൂതന്മാർ
  rationale: ലൂക്കോസ് 6:13-ൽ ഇത് ഒരു ദൗത്യത്തിന്റെ പൊതുവിവരണമാത്രമല്ല, യേശു പന്ത്രണ്ടുപേർക്കു നൽകുന്ന പദവിനാമമാണ്. ‘അപ്പൊസ്തലന്മാർ’ എന്നത് അധികമായ സഭാപരമായ അവകാശവാദങ്ങൾ ചേർക്കാതെ ആ ആഖ്യാനപ്രാധാന്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അടുക്കൽ വിളിച്ചു’ എന്ന പ്രയോഗം ക്രിയയുടെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; ‘അപ്പൊസ്തലന്മാർ’ സ്ഥാപിതമായ ബൈബിൾ പദവിനാമമായി നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
