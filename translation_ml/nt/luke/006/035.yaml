id: LUK.6.35
reference: Luke 6:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ ശത്രുക്കളെ സ്നേഹിക്കുക; നന്മ ചെയ്യുക; ഒന്നും തിരികെ പ്രതീക്ഷിക്കാതെ കടം കൊടുക്കുക.[a] അപ്പോൾ നിങ്ങളുടെ പ്രതിഫലം വലുതായിരിക്കും; നിങ്ങൾ അത്യുന്നതന്റെ പുത്രന്മാരായിരിക്കും.[b] കാരണം, നന്ദിയില്ലാത്തവരോടും ദുഷ്ടരോടും അവിടുന്ന് ദയയുള്ളവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, സാധ്യത കുറവാണെങ്കിലും, “ആരെയും കുറിച്ച് നിരാശപ്പെടാതെ” അഥവാ “ഒരിക്കലും പ്രത്യാശ കൈവിടാതെ.” μηδὲν ἀπελπίζοντες എന്ന ഗ്രീക്ക് പ്രയോഗം ദുഷ്കരമാണ്; ഈ സന്ദർഭത്തിൽ കടം കൊടുത്തത് തിരികെ ലഭിക്കുമെന്നോ മറ്റൊരു പ്രത്യുപകാരം ലഭിക്കുമെന്നോ പ്രതീക്ഷിക്കാതിരിക്കുക എന്നാണ് ഇവിടെ എടുത്തിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “പുത്രന്മാർ” എന്നത് ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനപദത്തിന്റെ പരിഭാഷയാണ്; ഇവിടെ അതിന് പ്രതിനിധാനപരമായ അർത്ഥവ്യാപ്തിയുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ പരസ്പരപ്രത്യുപകാരത്തെ അടിസ്ഥാനമാക്കിയ സ്നേഹരീതിയോട് ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: നിങ്ങളുടെ ശത്രുക്കളെ സ്നേഹിക്കുക
  rationale: കല്പനയുടെ നേരിട്ടുള്ള സ്വഭാവവും ‘ശത്രുക്കൾ’ എന്ന പദത്തിന്റെ ഞെട്ടിക്കുന്ന ശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἀγαθοποιεῖτε
  choice: നന്മ ചെയ്യുക
  rationale: സജീവമായി നന്മ ചെയ്യുന്നതിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δανίζετε
  choice: കടം കൊടുക്കുക
  rationale: കടം കൊടുക്കുക എന്ന ക്രിയാർത്ഥം നിലനിർത്തുന്നു; പണം എന്ന് കൂട്ടിച്ചേർത്ത് മൂലപാഠത്തേക്കാൾ നിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: μηδὲν ἀπελπίζοντες
  choice: ഒന്നും തിരികെ പ്രതീക്ഷിക്കാതെ
  rationale: കടം കൊടുക്കലിന്റെയും പ്രത്യുപകാരത്തിന്റെയും തൊട്ടടുത്ത സന്ദർഭത്തിൽ തിരിച്ചടവോ മടക്കലഭ്യമോ പ്രതീക്ഷിക്കാതിരിക്കുക എന്ന അർത്ഥമാണ് ഏറ്റവും യോജിച്ചത്; പദസമുച്ചയത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: μισθὸς ὑμῶν πολύς
  choice: നിങ്ങളുടെ പ്രതിഫലം വലുതായിരിക്കും
  rationale: ധാർമികവും അന്തിമഫലസംബന്ധവുമായ സന്ദർഭത്തിൽ μισθός എന്നതിന് ‘പ്രതിഫലം’ സ്വാഭാവികമാണ്; πολύς എന്നതിന്റെ പ്രാബല്യം ‘വലുത്’ നിലനിർത്തുന്നു.
- source_word: υἱοὶ Ὑψίστου
  choice: അത്യുന്നതന്റെ പുത്രന്മാർ
  rationale: υἱοί എന്ന പുരുഷലിംഗ ബഹുവചനം കൃത്യമായി നിലനിർത്തുകയും Ὕψιστος എന്ന ദൈവിക വിശേഷണം മലയാളത്തിലെ അംഗീകൃത രൂപത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: χρηστός
  choice: ദയയുള്ളവൻ
  rationale: അർഹതയില്ലാത്തവരോടുള്ള ദൈവത്തിന്റെ അനുഗ്രഹപൂർവമായ നന്മയെ ഈ സന്ദർഭത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: നന്ദിയില്ലാത്തവരോടും ദുഷ്ടരോടും
  rationale: രണ്ടു വിശേഷണങ്ങളെയും വ്യക്തികളുടെ കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്ന നാമരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: υἱοὶ Ὑψίστου എന്നത് ലിംഗനിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: അത്യുന്നതന്റെ പുത്രന്മാർ
  alternative: അത്യുന്നതന്റെ മക്കൾ
  rationale: ഗ്രീക്കിൽ വ്യക്തമായി പുരുഷലിംഗ ബഹുവചനമായ υἱοί ആണ്. മുഖ്യപാഠം അതിനെ കൃത്യമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അതിന് പ്രതിനിധാനപരമായ വ്യാപ്തിയുണ്ടാകാമെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: കടം കൊടുക്കാനുള്ള കല്പനയിൽ μηδὲν ἀπελπίζοντες എന്നതിന്റെ അർത്ഥം
  choice: ഒന്നും തിരികെ പ്രതീക്ഷിക്കാതെ
  alternative: ആരെയും കുറിച്ച് നിരാശപ്പെടാതെ / ഒരിക്കലും പ്രത്യാശ കൈവിടാതെ
  rationale: കടം കൊടുക്കലും പ്രത്യുപകാരവും ചർച്ച ചെയ്യുന്ന സന്ദർഭം തിരിച്ചുകിട്ടുമെന്ന പ്രതീക്ഷ ഉപേക്ഷിക്കുന്ന അർത്ഥത്തെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പ്രയോഗത്തിന്റെ യഥാർഥ ദുഷ്കരത മറയ്ക്കാതെ മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കല്പനാരൂപങ്ങൾ ഉപയോഗിച്ചു. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടന്ന്’ സ്വീകരിച്ചു. മൂലപാഠത്തിലെ ആവർത്തിച്ച ‘καί’ മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ അർധവിരാമങ്ങളും ‘അപ്പോൾ’, ‘കാരണം’ എന്നീ ബന്ധപദങ്ങളും ഉപയോഗിച്ചു; ആശയക്രമം മാറ്റിയിട്ടില്ല.
