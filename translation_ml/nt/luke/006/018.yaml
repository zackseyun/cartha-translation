reference: Luke 6:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: ml
  text: അവർ അവനെ കേൾക്കാനും തങ്ങളുടെ രോഗങ്ങളിൽനിന്ന് സൗഖ്യം പ്രാപിക്കാനുമായി വന്നു; അശുദ്ധാത്മാക്കളാൽ ഉപദ്രവിക്കപ്പെട്ടവരും[a] സൗഖ്യം പ്രാപിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പീഡിപ്പിക്കപ്പെട്ടവരും” അല്ലെങ്കിൽ “ബാധിക്കപ്പെട്ടവരും.” ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് ഉപദ്രവിക്കപ്പെടുക, ബാധിക്കപ്പെടുക, പീഡിപ്പിക്കപ്പെടുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: അവർ ... വന്നവരായിരുന്നു
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ജനക്കൂട്ടവുമായി ബന്ധിപ്പിക്കുന്ന ആപേക്ഷിക പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ചയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: അവനെ കേൾക്കാനും
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘അവന്റെ വാക്ക്’ എന്നു ചേർത്ത് മൂലത്തിൽ ഇല്ലാത്ത നാമം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: തങ്ങളുടെ രോഗങ്ങളിൽനിന്ന് സൗഖ്യം പ്രാപിക്കാനും
  rationale: Passive healing ആശയവും ἀπό സൂചിപ്പിക്കുന്ന രോഗത്തിൽനിന്നുള്ള മോചനവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: അശുദ്ധാത്മാക്കളാൽ ഉപദ്രവിക്കപ്പെട്ടവരും
  rationale: ἐνοχλέω എന്നതിന്റെ വിശാലമായ ‘ഉപദ്രവിക്കുക/ബാധിക്കുക’ എന്ന അർഥം അതിശയോക്തിയില്ലാതെ നൽകുന്നു; ἀπό ഇവിടെ കാരണത്തെയോ പ്രവർത്തകശക്തിയെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘-ആൽ’ പ്രയോഗിച്ചു.
- source_word: ἐθεραπεύοντο
  choice: സൗഖ്യം പ്രാപിച്ചുകൊണ്ടിരുന്നു
  rationale: Imperfect passive രൂപത്തിന്റെ രംഗത്തിനുള്ളിലെ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തി മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πνευμάτων ἀκαθάρτων എന്ന പ്രയോഗത്തിന്റെ അവതരണം
  choice: അശുദ്ധാത്മാക്കൾ
  alternative: ദുരാത്മാക്കൾ / അശുദ്ധമായ ആത്മാക്കൾ
  rationale: സുവിശേഷങ്ങളിലെ സ്ഥിരമായ ബൈബിൾ പ്രയോഗവും വ്യക്തിപരമായ ആത്മശക്തികളെ സൂചിപ്പിക്കുന്ന രൂപവും നിലനിർത്തുന്നു; ‘പിശാചുകൾ’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- issue: ἐθεραπεύοντο എന്ന imperfect രൂപത്തിന്റെ കാലസ്വഭാവം
  choice: സൗഖ്യം പ്രാപിച്ചുകൊണ്ടിരുന്നു
  alternative: സൗഖ്യം പ്രാപിച്ചു
  rationale: സംഭവരംഗത്തിൽ സൗഖ്യപ്പെടുത്തൽ തുടർന്നോ ആവർത്തിച്ചോ നടന്നുവെന്ന രൂപസൂചന ചുരുക്കിക്കളയാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മുൻവാക്യത്തോടുള്ള ബന്ധം നിലനിർത്താൻ ‘അവർ ... വന്നവരായിരുന്നു’ എന്നും, imperfect aspect വ്യക്തമാക്കാൻ ‘സൗഖ്യം പ്രാപിച്ചുകൊണ്ടിരുന്നു’ എന്നും ഉപയോഗിച്ചു.
