  terminology: “കൈ,” “നീട്ടുക,” and “പൂർവസ്ഥിതിയിലായി” are appropriate. The footnote’s alternative “സുഖപ്പെട്ടു” is natural and correctly presented as an alternative rather than the primary rendering.
