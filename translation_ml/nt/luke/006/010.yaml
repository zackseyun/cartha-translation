  source_fidelity: 'The draft accurately conveys the sequence: Jesus looked around at all present, commanded the man to stretch out his hand, the man complied, and the hand was restored. “പൂർവസ്ഥിതിയിലായി” appropriately retains the restoration sense of ἀπεκατεστάθη without reducing it to a merely medical expression.'
