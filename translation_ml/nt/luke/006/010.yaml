source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος πάντας αὐτοὺς εἶπεν αὐτῷ· Ἔκτεινον τὴν χεῖρά σου· ὁ δὲ ἐποίησεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: ml
  text: 'അവരെയെല്ലാവരെയും ചുറ്റും നോക്കിയശേഷം യേശു ആ മനുഷ്യനോട്, “നിന്റെ കൈ നീട്ടുക” എന്നു പറഞ്ഞു. അയാൾ അങ്ങനെ ചെയ്തു; അവന്റെ കൈ പൂർവസ്ഥിതിയിലായി.[a]


    [a] അഥവാ, “അവന്റെ കൈ സുഖപ്പെട്ടു.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി “അവന്റെ കൈ പൂർവസ്ഥിതിയിലായി” എന്നാണ്; കൈ ശരിയായ നിലയിലേക്കു മടങ്ങിയതിനു ഇത് ഊന്നൽ നൽകുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ കൈ സുഖപ്പെട്ടു.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി “അവന്റെ കൈ പൂർവസ്ഥിതിയിലായി” എന്നാണ്; കൈ ശരിയായ നിലയിലേക്കു മടങ്ങിയതിനു ഇത് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: ചുറ്റും നോക്കിയശേഷം
  rationale: Aorist middle participle indicates that Jesus looked around at those present before speaking. This wording naturally preserves that sequence in Malayalam.
- source_word: πάντας αὐτούς
  choice: അവരെയെല്ലാം
  rationale: Preserves the emphasis on the totality of those at whom Jesus looked.
- source_word: εἶπεν αὐτῷ
  choice: യേശു ആ മനുഷ്യനോട് … എന്നു പറഞ്ഞു
  rationale: The Greek uses pronouns, but the contextual referents are expressed to avoid confusing multiple masculine pronouns in natural Malayalam without changing the speech act.
- source_word: Ἔκτεινον
  choice: നീട്ടുക
  rationale: Direct imperative that clearly expresses the commanded physical action.
- source_word: τὴν χεῖρά σου
  choice: നിന്റെ കൈ
  rationale: Renders χείρ specifically as ‘hand’ and retains the explicit possessive.
- source_word: ὁ δὲ ἐποίησεν
  choice: അയാൾ അങ്ങനെ ചെയ്തു
  rationale: ποιέω refers back to the commanded action; ‘അങ്ങനെ ചെയ്തു’ is the natural Malayalam equivalent of ‘did so.’ The lightly connective δέ is represented by the narrative transition rather than an adversative.
- source_word: ἀπεκατεστάθη
  choice: പൂർവസ്ഥിതിയിലായി
  rationale: Preserves the verb’s core sense of being restored or returned to a proper former condition rather than replacing it in the main text with an explicitly medical term.
- source_word: ἡ χεὶρ αὐτοῦ
  choice: അവന്റെ കൈ
  rationale: Retains the Greek’s explicit repetition of ‘hand’ and naturally expresses the possessive in Malayalam.
theological_decisions:
- issue: Nature of the miracle expression in ἀπεκατεστάθη
  choice: പൂർവസ്ഥിതിയിലായി
  alternative: സുഖപ്പെട്ടു
  rationale: Restoration language most directly preserves the Greek verb’s emphasis on return to proper condition, while the footnote records the natural healing-language alternative without narrowing the main text.
translation_notes:
  register: Modern standard Malayalam in a clear, dignified narrative register. Contextual nouns replace potentially confusing stacked masculine pronouns, while the command remains direct and ordinary. The footnote marker is placed after the restoration wording to which the note applies.
