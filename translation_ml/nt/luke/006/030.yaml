id: LUK.6.30
reference: Luke 6:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀παντὶ αἰτοῦντί σε δίδου, καὶ ἀπὸ τοῦ αἴροντος τὰ σὰ μὴ ἀπαίτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: ml
  text: നിന്നോടു ചോദിക്കുന്ന ഏവർക്കും കൊടുക്കുക; നിനക്കുള്ളത് എടുത്തുകൊണ്ടുപോകുന്നവനിൽനിന്ന് അതു തിരികെ ആവശ്യപ്പെടരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതു തിരികെ ചോദിക്കരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ἀπαιτέω എന്ന ക്രിയയ്ക്ക് തിരികെ ആവശ്യപ്പെടുക, തിരികെ ചോദിക്കുക എന്നീ അടുത്ത അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: παντὶ αἰτοῦντί σε
  choice: നിന്നോടു ചോദിക്കുന്ന ഏവർക്കും
  rationale: παντί എന്ന പദത്തിന്റെ വിതരണാത്മകവും വിശാലവുമായ അർഥം ‘ഏവർക്കും’ നിലനിർത്തുന്നു. αἰτέωയെ ‘ചോദിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് അപേക്ഷയുടെ സ്വഭാവമോ ചോദിക്കുന്നവന്റെ സാമൂഹികനിലയോ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: δίδου
  choice: കൊടുക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള കല്പനാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; തുടർച്ചയെ കൃത്രിമമായി അതിരൂക്ഷമാക്കുന്നില്ല.
- source_word: ἀπὸ τοῦ αἴροντος τὰ σὰ
  choice: നിനക്കുള്ളത് എടുത്തുകൊണ്ടുപോകുന്നവനിൽനിന്ന്
  rationale: αἴρω ഇവിടെ വസ്തു കൈവശത്തിൽനിന്നു നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എടുത്തുകൊണ്ടുപോകുക’ ആ ആശയം വ്യക്തമാക്കുന്നു; എന്നാൽ അതിനെ ‘മോഷ്ടിക്കുക’ പോലുള്ള പ്രത്യേക നിയമവിഭാഗമായി ചുരുക്കുന്നില്ല. τὰ σὰയുടെ വിശാലത ‘നിനക്കുള്ളത്’ നിലനിർത്തുന്നു.
- source_word: μὴ ἀπαίτει
  choice: അതു തിരികെ ആവശ്യപ്പെടരുത്
  rationale: ἀπαιτέωയുടെ തിരികെ ചോദിച്ചുവാങ്ങുകയോ അവകാശപ്പെട്ട് ആവശ്യപ്പെടുകയോ ചെയ്യുന്ന അർഥം ‘തിരികെ ആവശ്യപ്പെടരുത്’ സ്വാഭാവികമായി അറിയിക്കുന്നു. ‘അതു’ മുൻപുള്ള ‘നിനക്കുള്ളത്’ എന്നതിലേക്കു സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ധാർമിക കല്പനകളുടെ വ്യാപ്തിയും ശക്തിയും
  choice: രണ്ടു കല്പനകളും അവയുടെ വിശാലവും നേരിട്ടുള്ളതുമായ രൂപത്തിൽ നിലനിർത്തി.
  alternative: ഇവയെ അതിശയോക്തിയായി മയപ്പെടുത്തുക; ആദ്യഭാഗം ദാനധർമ്മത്തിലേക്കു മാത്രം പരിമിതപ്പെടുത്തുക; രണ്ടാംഭാഗം മോഷണത്തിന്റെയോ നിയമപരമായ നഷ്ടപരിഹാരത്തിന്റെയോ സാഹചര്യത്തിലേക്കു മാത്രം ചുരുക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ നേരിട്ടുള്ള ആജ്ഞാരൂപങ്ങളും വിശാലമായ പ്രയോഗവും ഉണ്ട്. അതിനാൽ പ്രായോഗിക പരിധിയെ വിവർത്തനം തന്നെ തീർപ്പാക്കാതെ വാക്യത്തിന്റെ ധാർമിക സംഘർഷവും വ്യാപ്തിയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. ‘നിന്നോടു/നിനക്കുള്ളത്’ എന്ന ഏകവചന അഭിസംബോധന ഗ്രീക്കിലെ σε, σὰ എന്നിവയോട് യോജിക്കുന്നു. വാക്യത്തിന്റെ കഠിനമായ ധാർമിക ശക്തി വ്യാഖ്യാനപരമായ ഇളവുകൾ ചേർക്കാതെ നിലനിർത്തി.
