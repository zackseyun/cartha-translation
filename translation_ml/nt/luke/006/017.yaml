id: LUK.6.17
reference: Luke 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: ml
  text: അവൻ അവരോടൊപ്പം ഇറങ്ങിവന്ന് നിരപ്പായ ഒരു സ്ഥലത്ത് നിന്നു.[a] അവന്റെ ശിഷ്യന്മാരുടെ വലിയൊരു കൂട്ടവും, യെഹൂദ്യ മുഴുവനിൽനിന്നും യെരൂശലേമിൽനിന്നും സോരിന്റെയും സീദോന്റെയും തീരപ്രദേശത്തുനിന്നുമുള്ള ജനങ്ങളുടെ വലിയൊരു സമൂഹവും അവിടെയുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഒരു സമതലത്തിൽ.” ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “നിരപ്പായ ഒരു സ്ഥലത്ത്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς μετ’ αὐτῶν
  choice: അവരോടൊപ്പം ഇറങ്ങിവന്ന്
  rationale: Aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ഇറങ്ങിവരവ് സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം ദിശയും സ്വാഭാവികമായ ആഖ്യാനക്രമവും നിലനിർത്തുന്നു.
- source_word: ἔστη
  choice: നിന്നു
  rationale: ἵστημι എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ അർഥം നിൽക്കുന്ന സ്ഥാനം സ്വീകരിക്കുക എന്നതാണ്; ലളിതവും നേരിട്ടുമുള്ള മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: സമനിരപ്പായ ഒരു സ്ഥലത്ത്
  rationale: τόπος എന്നതിലെ ‘സ്ഥലം’ എന്ന അർഥവും πεδινός എന്നതിലെ നിരപ്പായ ഭൂപ്രകൃതിയും നിലനിർത്തുന്നു; വിശാലമായ ഒരു സമതലം തന്നെയെന്ന് അനാവശ്യമായി നിശ്ചയിക്കുന്നില്ല.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരുടെ ഒരു വലിയ കൂട്ടം
  rationale: ὄχλος എന്നതിന്റെ ‘കൂട്ടം’ എന്ന അർഥവും μαθητῶν എന്ന ജനിറ്റീവ് ആ കൂട്ടത്തിൽ ശിഷ്യന്മാർ ഉൾപ്പെടുന്നു എന്ന ആശയവും വ്യക്തമായി നൽകുന്നു.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: ജനങ്ങളുടെ വലിയൊരു സമൂഹം
  rationale: πλῆθος വലിയ ജനസംഖ്യയെ സൂചിപ്പിക്കുന്നു; ശിഷ്യന്മാരുടെ കൂട്ടത്തിൽനിന്ന് വേർതിരിച്ച വിശാലമായ ജനവിഭാഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: യെഹൂദ്യയിൽ എല്ലായിടത്തുനിന്നും
  rationale: πάσης നൽകുന്ന പ്രദേശവ്യാപകത മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: സോരിന്റെയും സീദോന്റെയും തീരപ്രദേശത്തുനിന്നും
  rationale: παράλιος എന്നതിന്റെ തീരദേശ അർഥം കൃത്യമായി നൽകുകയും സ്ഥലനാമങ്ങളുമായുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പ്രസംഗത്തിന്റെ പശ്ചാത്തലവുമായി ബന്ധപ്പെട്ട ഭൂപ്രകൃതിവിവരണം
  choice: സമനിരപ്പായ ഒരു സ്ഥലത്ത്
  alternative: ഒരു സമതലത്തിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള ഭൂപ്രകൃതിയർഥം സംരക്ഷിക്കുന്നു; മത്തായിയുടെ വിവരണവുമായി യോജിപ്പിക്കാനോ വിരോധം ഊന്നിക്കാട്ടാനോ ശ്രമിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യെഹൂദ്യ’, ‘യെരൂശലേം’, ‘സോർ’, ‘സീദോൻ’ എന്നീ പരിചിത ബൈബിൾ സ്ഥലനാമരൂപങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി.
