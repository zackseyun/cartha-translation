id: LUK.6.48
reference: Luke 6:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: ml
  text: അവൻ ഒരു വീട് പണിയുന്ന മനുഷ്യനെപ്പോലെയാണ്[a]. അയാൾ ആഴത്തിൽ കുഴിച്ച് പാറമേൽ അടിത്തറയിട്ടു. വെള്ളപ്പൊക്കം ഉണ്ടായപ്പോൾ നദി ആ വീടിന്മേൽ ആഞ്ഞടിച്ചു; എങ്കിലും അതിനെ ഇളക്കാൻ കഴിഞ്ഞില്ല, കാരണം അത് നന്നായി പണിതിരുന്നതിനാൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു വ്യക്തിയെപ്പോലെ.’ ഗ്രീക്കിൽ താരതമ്യത്തിലെ പ്രതിനിധിപാത്രത്തെ സൂചിപ്പിക്കാൻ പുരുഷലിംഗ ഏകവചനരൂപമായ ἀνθρώπῳ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιός ἐστιν
  choice: അവൻ ... പോലെയാണ്
  rationale: ഉപമയുടെ നേരിട്ടുള്ള താരതമ്യരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνθρώπῳ
  choice: ഒരു മനുഷ്യനെ
  rationale: ഗ്രീക്കിലെ ഏകവചനത്തിലുള്ള പ്രതിനിധിപാത്രത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മനുഷ്യൻ’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: ഒരു വീട് പണിയുന്ന
  rationale: നിർമാണപ്രവൃത്തിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: ആഴത്തിൽ കുഴിച്ച്
  rationale: രണ്ടു ഗ്രീക്ക് ക്രിയകൾ നൽകുന്ന ആഴത്തിലുള്ള ഖനനത്തിന്റെ ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔθηκεν θεμέλιον
  choice: അടിത്തറയിട്ടു
  rationale: വീടുനിർമാണസന്ദർഭത്തിലെ പതിവായ മലയാളപ്രയോഗം; θεμέλιον എന്നതിന്റെ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: ἐπὶ τὴν πέτραν
  choice: പാറമേൽ
  rationale: πέτραയെ വ്യാഖ്യാനപരമായ ‘അടിപ്പാറ’ എന്നു ചുരുക്കാതെ ദൃശ്യബിംബമായ ‘പാറ’യായി നിലനിർത്തുന്നു.
- source_word: πλημμύρης δὲ γενομένης
  choice: വെള്ളപ്പൊക്കം ഉണ്ടായപ്പോൾ
  rationale: സാഹചര്യവും സമയബന്ധവും വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ
  choice: നദി ആ വീടിന്മേൽ ആഞ്ഞടിച്ചു
  rationale: προσρήγνυμι സൂചിപ്പിക്കുന്ന ശക്തമായ ആഘാതം ‘ആഞ്ഞടിച്ചു’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; ποταμός ‘നദി’യായി നിലനിർത്തുന്നു.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτήν
  choice: അതിനെ ഇളക്കാൻ കഴിഞ്ഞില്ല
  rationale: കഴിവില്ലായ്മയും വീടിനെ അസ്ഥിരമാക്കാൻ സാധിക്കാതിരുന്നതും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: കാരണം അത് നന്നായി പണിതിരുന്നതായിരുന്നു
  rationale: കാരണബന്ധവും ഗ്രീക്കിലെ കർമണിപ്രയോഗവും മുൻകാല നിർമാണഫലവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രതിനിധിയായ ഉപമാപാത്രത്തിലെ ἀνθρώπῳ എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: ഒരു മനുഷ്യനെ
  alternative: ഒരു വ്യക്തിയെ
  rationale: ἄνθρωπος ഇവിടെ ഏകവചനത്തിലുള്ള മനുഷ്യപാത്രത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യൻ’ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; ‘വ്യക്തി’ എന്നത് കൂടുതൽ അമൂർത്തമാകുന്നതിനാൽ ഒഴിവാക്കി. എന്നാൽ ഗ്രീക്ക് പദം നിർബന്ധമായും പ്രായപൂർത്തിയായ പുരുഷനെ മാത്രം സൂചിപ്പിക്കണമെന്ന വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നെങ്കിലും ഗൗരവമുള്ള ശൈലി. നിർമാണവും പ്രളയവും സംബന്ധിച്ച ദൃശ്യബിംബങ്ങൾ നേരിട്ടും സജീവമായും നിലനിർത്തിയിരിക്കുന്നു.
