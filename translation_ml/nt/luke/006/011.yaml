source:
  edition: SBLGNT
  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: ml
  text: എന്നാൽ അവർ ഉന്മത്തമായ അവിവേകംകൊണ്ടു നിറഞ്ഞു[a]; യേശുവിനോട് എന്തു ചെയ്യാമെന്ന് അവർ പരസ്പരം ചർച്ചചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭ്രാന്തുകൊണ്ടു നിറഞ്ഞു’ അല്ലെങ്കിൽ ‘മൂഢതകൊണ്ടു നിറഞ്ഞു.’ ഗ്രീക്ക് പദത്തിന് അവിവേകം, മൂഢത, അല്ലെങ്കിൽ വിവേകമറ്റ ഉന്മത്താവസ്ഥ എന്നിവ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: എന്നാൽ അവർ
  rationale: δὲ സൂചിപ്പിക്കുന്ന വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; αὐτοὶയിലെ ഊന്നൽ സന്ദർഭത്തിൽ കർത്തൃസർവനാമംകൊണ്ട് മതിയായ വിധം വ്യക്തമാകുന്നു.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: വിവേകശൂന്യമായ ക്രോധംകൊണ്ടു നിറഞ്ഞു
  rationale: ‘നിറഞ്ഞു’ എന്ന ഗ്രീക്ക് പ്രയോഗരൂപം നിലനിർത്തുന്നു. ἄνοιαയുടെ അവിവേകം, ബുദ്ധിശൂന്യത, ഉന്മത്തത എന്നീ അർത്ഥസാധ്യതകളെയും സന്ദർഭത്തിലെ ശത്രുതാഭരിതമായ വികാരത്തെയും ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: διελάλουν πρὸς ἀλλήλους
  choice: പരസ്പരം ചർച്ചചെയ്തു
  rationale: അപൂർണ്ണകാല ക്രിയ സൂചിപ്പിക്കുന്ന തുടരുന്ന കൂടിയാലോചനയും πρὸς ἀλλήλους എന്ന പരസ്പരതയും ലളിതമായി അറിയിക്കുന്നു.
- source_word: τί ἂν ποιήσαιεν
  choice: എന്തു ചെയ്യാമെന്ന്
  rationale: ἄν സഹിതമുള്ള optative പ്രകടിപ്പിക്കുന്ന ആലോചനാത്മക സാധ്യത സംരക്ഷിക്കുന്നു; നിർബന്ധമോ കേവല കഴിവോ അമിതമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: τῷ Ἰησοῦ
  choice: യേശുവിനോട്
  rationale: പ്രവർത്തനം യേശുവിനെ ലക്ഷ്യമാക്കുന്നു എന്ന ദത്തിവിന്റെ അർത്ഥം നേരിട്ട് നൽകുന്നു; ‘യേശുവിനെതിരെ’ എന്ന് പറഞ്ഞ് ഗ്രീക്കിലുള്ളതിലധികം ശത്രുത വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: ἀνοίας എന്നത് മാനസികരോഗസൂചനയായി വിവർത്തനം ചെയ്യണമോ, ധാർമ്മിക-വികാരപരമായ അവിവേകമായി അവതരിപ്പിക്കണമോ
  choice: വിവേകശൂന്യമായ ക്രോധം
  alternative: ഭ്രാന്ത്; മൂഢത
  rationale: ആധുനിക വൈദ്യശാസ്ത്രപരമായ ‘ഭ്രാന്ത്’ എന്ന ധ്വനി ഒഴിവാക്കിക്കൊണ്ട് എതിരാളികളുടെ പ്രതികരണത്തിലെ അവിവേകവും സന്ദർഭത്തിലെ ക്രോധവും പ്രകടിപ്പിക്കുന്നു. പദത്തിന്റെ മറ്റു യഥാർഥ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ വൈരുധ്യം, ‘നിറഞ്ഞു’ എന്ന രൂപകം, ആലോചനാത്മക സാധ്യത, ἀνοίας എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി എന്നിവ സംരക്ഷിച്ചു.
