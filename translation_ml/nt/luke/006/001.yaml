id: LUK.6.1
reference: Luke 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: ml
  text: ഒരു ശബ്ബത്തിൽ അവൻ ധാന്യവയലുകളിലൂടെ കടന്നുപോകുമ്പോൾ, അവന്റെ ശിഷ്യന്മാർ ധാന്യക്കതിരുകൾ[a] പറിച്ച് കൈകളിൽ തിരുമ്മി[b] തിന്നുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ധാന്യച്ചെടികളുടെ കതിരുകൾ.
    reason: lexical_alternative
  - marker: b
    text: ഭക്ഷിക്കാവുന്ന ധാന്യമണികൾ വേർതിരിക്കാനാണ് അവർ കതിരുകൾ കൈകളിൽ തിരുമ്മിയത്.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν σαββάτῳ
  choice: ഒരു ശബ്ബത്തിൽ
  rationale: Ἐγένετο δὲ എന്ന ലൂക്കോസിന്റെ ആഖ്യാനപരമായ സംക്രമണം മലയാളത്തിൽ കൃത്രിമമായ ‘സംഭവിച്ചു’ എന്ന പ്രയോഗമില്ലാതെ സ്വാഭാവികമായ സമയവാക്യമായി അവതരിപ്പിക്കുന്നു. അനിർദിഷ്ടമായ σαββάτῳ എന്ന രൂപത്തിന് ‘ഒരു ശബ്ബത്തിൽ’ യോജിക്കുന്നു.
- source_word: διαπορεύεσθαι αὐτὸν διὰ σπορίμων
  choice: അവൻ ധാന്യവയലുകളിലൂടെ കടന്നുപോകുമ്പോൾ
  rationale: തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ ‘കടന്നുപോകുമ്പോൾ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. σπόριμα പ്രത്യേക ധാന്യവിള നിർണ്ണയിക്കാത്തതിനാൽ പൊതുവായ ‘ധാന്യവയലുകൾ’ ഉപയോഗിച്ചു.
- source_word: ἔτιλλον οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ … പറിച്ച്
  rationale: ἔτιλλον എന്ന അപൂർണഭൂതകാലരൂപത്തിന്റെ തുടരുന്ന പ്രവർത്തി മുഴുവൻ വാക്യത്തിലെ ‘തിന്നുകൊണ്ടിരുന്നു’ എന്ന ക്രിയാരൂപത്തോടൊപ്പം പ്രകടമാകുന്നു.
- source_word: καὶ ἤσθιον τοὺς στάχυας
  choice: ധാന്യക്കതിരുകൾ പറിച്ച് … തിന്നുകൊണ്ടിരുന്നു
  rationale: στάχυας ധാന്യച്ചെടിയുടെ ഭക്ഷ്യധാന്യം അടങ്ങിയ കതിരുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ἤσθιον എന്ന അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന ഭാവം ‘തിന്നുകൊണ്ടിരുന്നു’ നിലനിർത്തുന്നു.
- source_word: ψώχοντες ταῖς χερσίν
  choice: കൈകളിൽ തിരുമ്മി
  rationale: കതിരുകളിൽനിന്ന് ഭക്ഷ്യയോഗ്യമായ ധാന്യമണികൾ വേർതിരിക്കാൻ കൈകൊണ്ട് തിരുമ്മുന്ന ദൃശ്യപ്രവൃത്തി സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ അനിർദിഷ്ടമായ ശബ്ബത്ത് സന്ദർഭവും തുടരുന്ന പ്രവൃത്തികളും നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ [a] അടയാളം ‘grainfields’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് στάχυας എന്ന ‘ധാന്യക്കതിരുകൾ’ സംബന്ധിച്ചതായതിനാൽ മലയാളത്തിൽ അടയാളം അതത് പദത്തിനുശേഷം വെച്ചു.
