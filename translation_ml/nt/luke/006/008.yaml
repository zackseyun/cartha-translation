id: LUK.6.8
reference: Luke 6:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: ml
  text: 'എന്നാൽ അവരുടെ ചിന്തകൾ[a] അവന് അറിയാമായിരുന്നു. ശോഷിച്ച കൈയുള്ള ആ പുരുഷനോട് അവൻ പറഞ്ഞു: “എഴുന്നേറ്റ് നടുവിൽ[c] നിൽക്കുക.” അവൻ എഴുന്നേറ്റ് അവിടെ നിന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അവരുടെ ആലോചനകൾ.”
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം “നടുവിലേക്ക്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: അറിഞ്ഞിരുന്നു
  rationale: οἶδα എന്ന ക്രിയയുടെ ഈ രൂപം ഇവിടെ അറിവിനെ നേരിട്ട് പ്രസ്താവിക്കുന്നു. അതിന്റെ മാർഗമോ സ്വഭാവമോ വിശദീകരിക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: διαλογισμοὺς
  choice: ചിന്തകൾ
  rationale: അകത്തെ ചിന്തകൾ, ആലോചനകൾ, ന്യായവാദങ്ങൾ എന്നീ അർഥസാധ്യതകൾ ഉള്ള പദമാണിത്. സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ‘ചിന്തകൾ’ തിരഞ്ഞെടുത്തു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ἀνδρὶ
  choice: മനുഷ്യനോട്
  rationale: ἀνήρ പ്രായപൂർത്തിയായ പുരുഷനെ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ ‘മനുഷ്യൻ’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്; വ്യക്തിയെ ലിംഗനിരപേക്ഷമായി പുനർവ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: ശോഷിച്ചുപോയ കൈ
  rationale: ശരീരാവയവത്തെക്കുറിച്ച് പറയുമ്പോൾ ξηρός വരണ്ടു ശോഷിച്ച, ചുരുങ്ങിയ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. രോഗാവസ്ഥയെ അമിതമായി നിർവചിക്കാതെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപമാണിത്.
- source_word: Ἔγειρε
  choice: എഴുന്നേറ്റ്
  rationale: ആദ്യം തന്റെ സ്ഥാനത്തുനിന്ന് എഴുന്നേൽക്കാനുള്ള കല്പനയാണിത്; തുടർന്നുള്ള στῆθι എന്ന കല്പനയിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: στῆθι
  choice: നിൽക്കുക
  rationale: Ἔγειρε എന്ന ‘എഴുന്നേൽക്കുക’ എന്ന കല്പനയ്ക്കു പിന്നാലെയുള്ള വേറിട്ട ‘നിൽക്കുക’ എന്ന പ്രവൃത്തി സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὸ μέσον
  choice: നടുവിൽ
  rationale: കൂടിയിരുന്നവരുടെ മധ്യത്തിലുള്ള പൊതുസ്ഥാനമാണ് ഉദ്ദേശിക്കുന്നത്. ‘നടുവിൽ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ദിശാസൂചകമായ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: ἀναστὰς ἔστη
  choice: അവൻ എഴുന്നേറ്റ് അവിടെ നിന്നു
  rationale: കൃതന്തവും മുഖ്യക്രിയയും സൂചിപ്പിക്കുന്ന തുടർച്ചയായ രണ്ടു പ്രവൃത്തികളും നിലനിർത്തുന്നു. ‘അവിടെ’ മലയാളത്തിൽ സ്ഥലം സ്വാഭാവികമായി തിരിച്ചുസൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: മറ്റുള്ളവരുടെ ഉള്ളിലെ ചിന്തകളെക്കുറിച്ചുള്ള യേശുവിന്റെ അറിവ്
  choice: അവരുടെ ചിന്തകൾ അവൻ അറിഞ്ഞിരുന്നു എന്ന വിവരണപ്രസ്താവന നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: അവരുടെ ഉദ്ദേശ്യങ്ങൾ അവൻ മനസ്സിലാക്കി; അല്ലെങ്കിൽ അത്ഭുതകരമായ ഉൾക്കാഴ്ചയാൽ അവരുടെ ആലോചനകൾ അറിഞ്ഞു.
  rationale: വാക്യം യേശുവിന് അവരുടെ ചിന്തകൾ അറിയാമായിരുന്നുവെന്ന് പറയുന്നു; എന്നാൽ ആ അറിവിന്റെ മാർഗം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വിശദീകരണപരമായ ദൈവശാസ്ത്ര ആശയം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ വിവരണശൈലി ഉപയോഗിച്ചു. കല്പനയിലെ രണ്ടു വേറിട്ട ക്രിയകളും തുടർന്നുള്ള അനുസരണപ്രവൃത്തികളും വ്യക്തമായി നിലനിർത്തി.
