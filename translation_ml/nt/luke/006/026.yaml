  terminology: ‘കള്ളപ്രവാചകന്മാർ’ is an appropriate established Malayalam biblical term for ψευδοπροφήταις. ‘പിതാക്കന്മാർ,’ with the explanatory footnote, preserves the biblical idiom without unnecessarily narrowing its generational sense.
