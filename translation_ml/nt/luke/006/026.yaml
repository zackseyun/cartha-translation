reference: Luke 6:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: ml
  text: എല്ലാവരും നിങ്ങളെക്കുറിച്ച് നല്ലത് പറയുമ്പോൾ[a] നിങ്ങൾക്കു അയ്യോ കഷ്ടം! കാരണം, അവരുടെ പിതാക്കന്മാർ[b] കള്ളപ്രവാചകന്മാരോടും ഇതുപോലെതന്നെ ചെയ്തുപോന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളെക്കുറിച്ച് അനുകൂലമായി സംസാരിക്കുമ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവരുടെ പിതാക്കന്മാർ’; അതായത്, അവരുടെ ജനത്തിന്റെ മുൻതലമുറകൾ.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαί
  choice: അയ്യോ കഷ്ടം!
  rationale: പ്രവാചകീയമായ അപലപനവും മുന്നറിയിപ്പും ഉൾക്കൊള്ളുന്ന ശക്തമായ ഉദ്‌ഗാരമായി οὐαίയെ അവതരിപ്പിക്കുന്നു; വെറും ദുഃഖപ്രകടനമായി മയപ്പെടുത്തുന്നില്ല.
- source_word: ὅταν
  choice: പറയുമ്പോൾ
  rationale: പൊതുവായി സംഭവിക്കാവുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന ὅταν എന്നതിന്റെ ഭാവി/ആവർത്തനസാധ്യത മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ുമ്പോൾ’ ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: നിങ്ങളെക്കുറിച്ച് നല്ലതു പറയുമ്പോൾ
  rationale: ഇത് ശരിയായി സംസാരിക്കുക എന്നതല്ല, ഒരാളെ അനുകൂലമായി പ്രശംസിച്ചു സംസാരിക്കുക എന്ന പ്രയോഗാർഥമാണ്; തിരഞ്ഞെടുത്ത രൂപം ആ വിലയിരുത്തൽഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πάντες οἱ ἄνθρωποι
  choice: എല്ലാ മനുഷ്യരും
  rationale: ἄνθρωποι ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ലിംഗപരമായി പരിമിതപ്പെടുത്താതെ ബഹുവചന നാമപദഘടനയും നിലനിർത്തുന്നു.
- source_word: κατὰ τὰ αὐτά
  choice: അങ്ങനെതന്നെ
  rationale: ποιέωയോടൊപ്പമുള്ള ഈ പ്രയോഗം ‘അതേ രീതിയിൽ ചെയ്യുക’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘അങ്ങനെതന്നെ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻപുള്ള ദുരിതപ്രഖ്യാപനത്തിനുള്ള വിശദീകരണകാരണം വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐποίουν
  choice: ചെയ്തിരുന്നു
  rationale: ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന്റെ പതിവായിരുന്ന മുൻകാല പ്രവൃത്തിയെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τοῖς ψευδοπροφήταις
  choice: കള്ളപ്രവാചകന്മാരോടും
  rationale: പ്രവൃത്തി ആരോടാണ് ചെയ്തതെന്ന് ദാതൃവിഭക്തി സൂചിപ്പിക്കുന്നു; ‘-ഓടും’ താരതമ്യത്തിലെ സമാന്തരബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: οἱ πατέρες αὐτῶν
  choice: അവരുടെ പിതാക്കന്മാർ
  rationale: മൂലത്തിലെ ‘പിതാക്കന്മാർ’ എന്ന തലമുറാപരമായ ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു; അതിന്റെ വിശാലമായ സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: കള്ളപ്രവാചകന്മാരുമായുള്ള താരതമ്യത്തിന്റെ സൂചനയും ശക്തിയും
  choice: സകലരുടെയും അനുകൂലപ്രശംസ, മുൻതലമുറകൾ കള്ളപ്രവാചകന്മാരോടു പെരുമാറിയ ചരിത്രരീതിയോടു ബന്ധപ്പെടുത്തി മുന്നറിയിപ്പ് നൽകുന്നു.
  alternative: മറ്റുള്ളവരുടെ ഏതൊരു അനുകൂലവാക്കിനെയും വ്യത്യാസമില്ലാതെ കുറ്റപ്പെടുത്തുന്നു; അല്ലെങ്കിൽ വാക്യം പ്രധാനമായും ജനപ്രീതിയെ മാത്രം വിമർശിക്കുന്നു.
  rationale: γάρ, κατὰ τὰ αὐτά എന്നിവ ദുരിതപ്രഖ്യാപനത്തെ ഒരു ചരിത്രരീതിയാൽ വിശദീകരിക്കുന്നു. അതിനാൽ എല്ലാ പ്രശംസയും സ്വതവേ തെറ്റാണെന്ന അതിവ്യാഖ്യാനം ചേർക്കാതെ, കള്ളപ്രവാചകന്മാർക്കു ലഭിച്ച വ്യാപക അംഗീകാരവുമായി ബന്ധപ്പെട്ട മുന്നറിയിപ്പും അതിലെ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അയ്യോ കഷ്ടം!’ പ്രവാചകീയ മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്തുന്നു. ‘കള്ളപ്രവാചകന്മാർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പരമ്പരാഗത ബൈബിൾപദമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
