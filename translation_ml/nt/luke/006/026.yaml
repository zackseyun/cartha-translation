  source_fidelity: 'The draft correctly conveys the warning, universal scope, positive speech, and the comparison with false prophets. However, the final clause is syntactically less clear in Malayalam: ‘കള്ളപ്രവാചകന്മാരോടും അങ്ങനെതന്നെ’ can leave the object of ‘did’ implicit in an awkward way. The Greek imperfect ἐποίουν has a customary-past force that is better represented explicitly by ‘ചെയ്തുപോന്നു.’'
