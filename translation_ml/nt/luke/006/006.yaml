source:
  edition: SBLGNT
  text: Ἐγένετο ⸀δὲ ἐν ἑτέρῳ σαββάτῳ εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν καὶ διδάσκειν· καὶ ἦν ⸂ἄνθρωπος ἐκεῖ⸃ καὶ ἡ χεὶρ αὐτοῦ ἡ δεξιὰ ἦν ξηρά·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: ml
  text: മറ്റൊരു ശബ്ബത്തിൽ അദ്ദേഹം സിനഗോഗിൽ പ്രവേശിച്ച് പഠിപ്പിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു. അവിടെ വലതുകൈ ശോഷിച്ചുപോയിരുന്ന[a] ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉണങ്ങിപ്പോയിരുന്ന.” ഗ്രീക്ക് വിശേഷണം ഉണങ്ങിയതോ ശോഷിച്ചതോ ആയ ഒന്നിനെ വിവരിക്കാം; ഇവിടെ അത് ആ മനുഷ്യന്റെ ബാധിതമായ വലതുകൈയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: '[പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ ആഖ്യാനത്തിന്റെ തുടർച്ചയിൽ പ്രകടമാക്കി]'
  rationale: ലൂക്കൊസിന്റെ ആഖ്യാനത്തിൽ ഇത് ഒരു പുതിയ സംഭവം അവതരിപ്പിക്കുന്ന പതിവ് പ്രയോഗമാണ്. മലയാളത്തിൽ ‘സംഭവിച്ചു’ എന്നു പ്രത്യേകം ചേർക്കുന്നത് വാക്യത്തെ കൃത്രിമമാക്കുന്നതിനാൽ, അതിന്റെ ആഖ്യാനപരമായ പ്രവർത്തനം സ്വാഭാവികമായ വാക്യക്രമത്തിലൂടെ അറിയിച്ചു.
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: മറ്റൊരു ശബ്ബത്തിൽ
  rationale: മുമ്പത്തേതിൽനിന്ന് വേറിട്ട മറ്റൊരു ശബ്ബത്ത് അവസരമാണെന്ന് ἑτέρῳ സൂചിപ്പിക്കുന്നു.
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: അദ്ദേഹം സിനഗോഗിൽ പ്രവേശിച്ച്
  rationale: ἐγένετο-യോടു ചേർന്ന ഗ്രീക്ക് അനന്തക്രിയയെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല ആഖ്യാനഘടനയിൽ അവതരിപ്പിച്ചു. ‘സിനഗോഗ്’ ഒന്നാം നൂറ്റാണ്ടിലെ യഹൂദ ആരാധനാസമൂഹത്തെയും അതിന്റെ കൂടിവരുന്ന സ്ഥലത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ലിപ്യന്തരണം നിലനിർത്തി.
- source_word: καὶ διδάσκειν
  choice: പഠിപ്പിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: വർത്തമാനകാല അനന്തക്രിയയുടെ തുടരുന്ന പ്രവൃത്തിഭാവം മലയാളത്തിലെ ‘-ച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു’ എന്ന രൂപം വ്യക്തമാക്കുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ ഒരു പുരുഷനെയാണ് പരാമർശിക്കുന്നത്; ‘മനുഷ്യൻ’ എന്നത് സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: വലതുകൈ
  rationale: ആ മനുഷ്യന്റെ വലതുകൈ തന്നെയായിരുന്നു ബാധിച്ചിരുന്നതെന്ന ഗ്രീക്കിലെ പ്രത്യേക നിർദ്ദേശം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിച്ചു.
- source_word: ξηρά
  choice: ഉണങ്ങിപ്പോയിരുന്ന
  rationale: ξηρός എന്ന വിശേഷണം അക്ഷരാർഥത്തിൽ ഉണങ്ങിയതോ ശോഷിച്ചതോ ആയ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ പ്രവർത്തനശേഷി നഷ്ടപ്പെട്ട കൈയെ വർണിക്കുന്നു. രോഗനിർണയം അനാവശ്യമായി നിർണ്ണയിക്കാതെ ദൃശ്യരൂപകം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. തുടരുന്ന പഠിപ്പിക്കൽ പ്രവൃത്തി വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ξηρά എന്ന പദത്തിന്റെ ദൃശ്യരൂപകവും വൈദ്യശാസ്ത്രപരമായ അനിശ്ചിതത്വവും നിലനിർത്തുകയും ചെയ്തു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് ചിഹ്നം ‘teaching’ എന്നതിനു ശേഷമുണ്ടായിരുന്നെങ്കിലും, അതിന്റെ ഉള്ളടക്കം ξηρά എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ബന്ധപ്പെട്ട ‘ഉണങ്ങിപ്പോയിരുന്ന’ എന്ന പദത്തിനുശേഷം സ്ഥാപിച്ചു.
