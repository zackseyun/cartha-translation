- from: നിന്റെ കവിളിൽ[a] അടിക്കുന്നവന് മറ്റേ കവിളും നീട്ടിക്കൊടുക്കുക; നിന്റെ മേലങ്കി[c] എടുത്തുകൊണ്ടുപോകുന്നവനിൽനിന്ന് നിന്റെ ഉള്ളങ്കിയും തടഞ്ഞുവെക്കരുത്.[b]
  to: നിന്റെ കവിളിൽ[a] അടിക്കുന്നവന് മറ്റേ കവിളും നീട്ടിക്കൊടുക്കുക[b]; നിന്റെ മേലങ്കി[c] എടുത്തുകൊണ്ടുപോകുന്നവനിൽനിന്ന് നിന്റെ ഉള്ളങ്കിയും തടഞ്ഞുവെക്കരുത്.
  rationale: മുഖ്യവിവർത്തനത്തിന്റെ അർഥം മാറ്റിയിട്ടില്ല. ഇംഗ്ലീഷ് POB ഓഡിറ്റ്-ട്രെയിലിലെ b അടിക്കുറിപ്പിന്റെ വിഷയവും അതിന്റെ ആങ്കറും ലൂക്കോസിലെ πάρεχε എന്ന ക്രിയയോട് ചേർത്തു, അതുവഴി ലൂക്കോസിനെയും മത്തായിയുടെ സമാന്തരപാഠത്തെയും അനാവശ്യമായി സമന്വയിപ്പിക്കാതിരിക്കുന്ന വിവർത്തനതീരുമാനം വായനക്കാരന് വ്യക്തമാക്കുന്നു.
