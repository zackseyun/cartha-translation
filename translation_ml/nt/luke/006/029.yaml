id: LUK.6.29
reference: Luke 6:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: ml
  text: നിന്റെ കവിളിൽ[a] അടിക്കുന്നവന് മറ്റേ കവിളും നീട്ടിക്കൊടുക്കുക[b]; നിന്റെ മേലങ്കി[c] എടുത്തുകൊണ്ടുപോകുന്നവനിൽനിന്ന് നിന്റെ ഉള്ളങ്കിയും തടഞ്ഞുവെക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘താടിയെല്ലിൽ.’
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി ‘മറ്റേ കവിളും തിരിച്ചുകാട്ടുക’ എന്നു വിവർത്തനം ചെയ്യാറുണ്ട്; എന്നാൽ ഇവിടത്തെ ഗ്രീക്ക് ക്രിയയ്ക്ക് കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘നീട്ടിക്കൊടുക്കുക’ അല്ലെങ്കിൽ ‘മുന്നോട്ടുവെക്കുക’ എന്നാണ് അർഥം.
    reason: alternative_reading
  - marker: c
    text: ‘മേലങ്കി’ (ἱμάτιον) പുറമേ ധരിക്കുന്ന വസ്ത്രവും ‘ഉള്ളങ്കി’ (χιτών) അതിനകത്ത് ധരിക്കുന്ന വസ്ത്രവുമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί
  choice: അടിക്കുന്നവന്
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃദന്തം പൊതുവായി അങ്ങനെ പ്രവർത്തിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: കവിളിൽ
  rationale: σιαγών എന്നത് താടിയെല്ലിനെയോ കവിളിനെയോ സൂചിപ്പിക്കാം; മുഖത്തടിയുടെ ഈ സന്ദർഭത്തിൽ ‘കവിളിൽ’ സ്വാഭാവികമാണ്, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πάρεχε
  choice: നീട്ടിക്കൊടുക്കുക
  rationale: παρέχω എന്നതിന്റെ ‘നൽകുക/മുന്നോട്ടുവെക്കുക’ എന്ന അർത്ഥം പ്രകടമാക്കുന്നു; മത്തായിയുടെ സമാന്തരവാക്യത്തിൽനിന്നുള്ള ‘തിരിച്ചുകാട്ടുക’ എന്ന പ്രയോഗം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: καὶ τὴν ἄλλην
  choice: മറ്റേ കവിളും
  rationale: മൂലപാഠത്തിൽ സൂചിതമായ ‘കവിൾ’ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ആവർത്തിക്കുകയും καί എന്നതിന്റെ ‘-ഉം’ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀπὸ τοῦ αἴροντός σου
  choice: എടുത്തുകൊണ്ടുപോകുന്നവനിൽനിന്ന്
  rationale: αἴρω ഇവിടെ വസ്ത്രം എടുത്തുമാറ്റുകയോ കൊണ്ടുപോകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ἀπόയുടെ രൂപവും ബന്ധവും ഈ വിവർത്തനം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἱμάτιον
  choice: മേലങ്കി
  rationale: പുറമേ ധരിക്കുന്ന വസ്ത്രം എന്ന സാംസ്കാരിക വ്യത്യാസം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τὸν χιτῶνα
  choice: ഉള്ളങ്കി
  rationale: ശരീരത്തോട് ചേർന്ന് ധരിച്ചിരുന്ന അകത്തെ വസ്ത്രത്തെ മേലങ്കിയിൽനിന്ന് വേർതിരിച്ചുകാട്ടുന്നു.
- source_word: μὴ κωλύσῃς
  choice: തടഞ്ഞുവെക്കരുത്
  rationale: κωλύωയുടെ ‘തടയുക/വിലക്കുക’ എന്ന അടിസ്ഥാനാർഥവും ഈ സന്ദർഭത്തിലെ ‘നൽകാതിരിക്കരുത്’ എന്ന പ്രായോഗിക ഭാവവും ഒരുമിച്ച് പകർന്നു നൽകുന്നു.
theological_decisions:
- issue: ലൂക്കോസിന്റെ പ്രയോഗം മത്തായിയിലെ പരിചിതമായ ‘മറ്റേ കവിൾ തിരിച്ചുകാട്ടുക’ എന്ന രൂപവുമായി സമന്വയിപ്പിക്കണമോ
  choice: ലൂക്കോസിന്റെ വ്യത്യസ്തമായ ‘മറ്റേ കവിളും നീട്ടിക്കൊടുക്കുക’ എന്ന പ്രയോഗം നിലനിർത്തി
  alternative: മറ്റേ കവിൾ തിരിച്ചുകാട്ടുക
  rationale: ഇവിടെ ഗ്രീക്കിൽ στρέφω അല്ല, πάρεχε ആണ്; അതിനാൽ സമാന്തര സുവിശേഷത്തിന്റെ പദപ്രയോഗം ചേർക്കാതെ ലൂക്കോസിന്റെ സവിശേഷത സംരക്ഷിക്കുന്നു.
- issue: കല്പനകൾക്ക് വ്യാഖ്യാനപരമായ നിയന്ത്രണങ്ങളോ മൃദൂകരണങ്ങളോ മുഖ്യപാഠത്തിൽ ചേർക്കണമോ
  choice: കല്പനകളുടെ നേരിട്ടുള്ള ശക്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി
  alternative: പ്രതികാരം ചെയ്യാതിരിക്കലിനെക്കുറിച്ചോ അതിശയോക്തിയെക്കുറിച്ചോ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുക
  rationale: മൂലപാഠം നേരിട്ടുള്ള കല്പനകളാണ് നൽകുന്നത്; അവയുടെ പ്രയോഗപരിധിയെക്കുറിച്ചുള്ള തർക്കം വിവർത്തനം തന്നെ തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നീട്ടിക്കൊടുക്കുക’ എന്നത് ലൂക്കോസിലെ πάρεχε എന്ന ക്രിയയുടെ സജീവമായ നൽകൽഭാവം കാത്തുസൂക്ഷിക്കുന്നു; വസ്ത്രപദങ്ങൾ പുരാതന സാംസ്കാരിക വ്യത്യാസം ലളിതമായി വ്യക്തമാക്കുന്നു.
