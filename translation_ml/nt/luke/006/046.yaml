  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: ml
  text: “നിങ്ങൾ എന്നെ ‘കർത്താവേ, കർത്താവേ’[a] എന്നു വിളിക്കുന്നതും ഞാൻ പറയുന്നത് ചെയ്യാത്തതും എന്തുകൊണ്ടാണ്?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “യജമാനനേ, യജമാനനേ.” ഗ്രീക്കിൽ: “Κύριε, κύριε.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: എന്തുകൊണ്ട്
  rationale: ഇവിടെ τί കാരണം ചോദിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗമാണ്; ശാസനയുടെ ഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്തുകൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: δέ
  choice: —
  rationale: δέ മൃദുവായ വ്യവഹാരബന്ധകമാണ്. മുൻസന്ദർഭത്തിൽനിന്നുള്ള ആശയബന്ധം മലയാളത്തിലെ ഒഴുക്കിൽ വ്യക്തമായതിനാൽ പ്രത്യേക പദമായി ചേർത്തിട്ടില്ല.
- source_word: με
  choice: എന്നെ
  rationale: καλεῖτε എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമം; ലളിതവും കൃത്യവുമായ പരിഭാഷ.
- source_word: καλεῖτε
  choice: വിളിക്കുകയും
  rationale: വർത്തമാനകാല രണ്ടാം പുരുഷ ബഹുവചനക്രിയ. അഭിസംബോധന ചെയ്യുക എന്ന അർഥത്തിൽ ‘വിളിക്കുക’ സ്വാഭാവികമാണ്; തുടർന്നുള്ള καὶ οὐ ποιεῖτε-യോടുള്ള ഏകോപനം ‘-ുകയും ... -ാതിരിക്കുകയും’ എന്ന ഘടനയിൽ സൂക്ഷിച്ചു.
- source_word: Κύριε κύριε
  choice: കർത്താവേ, കർത്താവേ
  rationale: ആവർത്തിച്ച സംബോധന അതേപടി നിലനിർത്തി. κύριος എന്നതിന്റെ ആദരവും ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും ‘കർത്താവ്’ നന്നായി വഹിക്കുന്നു.
- source_word: καὶ οὐ
  choice: ചെയ്യാതിരിക്കുകയും
  rationale: വാക്കിലുള്ള അഭിസംബോധനയും അനുസരണക്കേടും തമ്മിലുള്ള വൈരുധ്യം ഗ്രീക്കിലെ ഏകോപനരീതിയോട് ചേർന്ന് മലയാളത്തിലെ ‘-ുകയും ... -ാതിരിക്കുകയും’ ഘടനയിലൂടെ വ്യക്തമാക്കി.
- source_word: ποιεῖτε
  choice: ചെയ്യാതിരിക്കുകയും
  rationale: യേശു പറയുന്നതു നടപ്പാക്കുക/അനുസരിക്കുക എന്ന അർഥം. മൂലപാഠത്തിലെ പൊതുവായ ποιέω-യ്ക്ക് അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ ‘ചെയ്യുക’ നിലനിർത്തി.
- source_word: ἃ
  choice: പറയുന്നത്
  rationale: നപുംസക ബഹുവചന ആപേക്ഷിക സർവനാമം യേശുവിന്റെ വാക്കുകളുടെ ഉള്ളടക്കത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഞാൻ പറയുന്നത്’ സ്വാഭാവികമാണ്.
- source_word: λέγω
  choice: ഞാൻ പറയുന്നത്
  rationale: വർത്തമാനകാലത്തിന്റെ ലാളിത്യവും നേരിട്ടുള്ള അർഥവും നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘നിങ്ങളോട്’ പോലുള്ള ഘടകം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: κύριος എന്ന പദം യേശുവിനുള്ള ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരായി പരിഭാഷപ്പെടുത്തൽ
  choice: കർത്താവ്
  alternative: ഗുരു / യജമാനൻ
  rationale: ഈ സന്ദർഭത്തിൽ പദം യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നു; ആദരവും അധികാരവും ക്രിസ്തുശാസ്ത്രപരമായ സാധ്യതയും തുറന്നുവയ്ക്കാൻ ‘കർത്താവ്’ അനുയോജ്യം. ‘ഗുരു’ അർഥവ്യാപ്തി ചുരുക്കാം; ‘യജമാനൻ’ ആധുനിക മലയാളത്തിൽ വേറിട്ട സാമൂഹിക ഭാവം നൽകാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചോദ്യം. ‘-ുകയും ... -ാതിരിക്കുകയും’ എന്ന സമാന്തരഘടന വാക്കും പ്രവൃത്തിയും തമ്മിലുള്ള വൈരുധ്യം തെളിയിക്കുന്നു; ആവർത്തിച്ച സംബോധനയും ചോദ്യംചെയ്യുന്ന ശാസനാഭാവവും സംരക്ഷിച്ചിട്ടുണ്ട്.
