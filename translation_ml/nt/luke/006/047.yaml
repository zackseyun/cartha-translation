id: LUK.6.47
reference: Luke 6:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: ml
  text: 'എന്റെ അടുക്കൽ വന്ന്, എന്റെ വാക്കുകൾ കേൾക്കുകയും അവ അനുസരിക്കുകയും ചെയ്യുന്ന ഏവനും ആരെപ്പോലെയാണെന്ന് ഞാൻ നിങ്ങൾക്കു കാണിച്ചുതരാം:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος
  choice: വരുന്ന ഏവനും
  rationale: πᾶς ചേർന്ന നിർദേശക കൃദന്തപ്രയോഗം പൊതുവായി എല്ലാവരെയും ഉൾക്കൊള്ളുന്നു. ‘ഏവനും’ അതിന്റെ സർവവ്യാപകത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐρχόμενος πρός με
  choice: എന്റെ അടുക്കൽ വന്ന്
  rationale: πρός + ദ്വിതീയാവിഭക്തി യേശുവിലേക്കുള്ള സമീപനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ക്രിയാശൃംഖല സ്വാഭാവികമാക്കാൻ ‘വന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἀκούων μου τῶν λόγων
  choice: എന്റെ വാക്കുകൾ കേൾക്കുകയും
  rationale: μου τῶν λόγων ഇവിടെ യേശുവിന്റെ വാക്കുകളെ സൂചിപ്പിക്കുന്നു. ἀκούων എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കേൾക്കുക’ നിലനിർത്തി; ‘ശ്രദ്ധിച്ചു കേൾക്കുക’ എന്ന് വ്യാഖ്യാനപരമായി വിപുലീകരിച്ചില്ല.
- source_word: λόγων
  choice: വാക്കുകൾ
  rationale: λόγοι ഇവിടെ യേശുവിന്റെ വാചിക ഉപദേശങ്ങളാണ്. ‘വാക്കുകൾ’ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗമാണ്.
- source_word: ποιῶν αὐτούς
  choice: അവ അനുസരിക്കുകയും
  rationale: വാക്കുകളെയോ കല്പനകളെയോ സംബന്ധിച്ച് ποιέω ഉപയോഗിക്കുമ്പോൾ അവ പ്രവൃത്തിയിൽ ആക്കുക, അനുസരിക്കുക എന്ന അർഥമാണ്. ‘അവ ചെയ്യുക’ എന്ന പദാനുപദരൂപത്തേക്കാൾ ‘അവ അനുസരിക്കുക’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭാർഥം കൃത്യമായി നൽകുന്നതുമാണ്.
- source_word: ὑποδείξω ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്കു കാണിച്ചുതരാം
  rationale: ഭാവികാല ക്രിയ അടുത്തതായി വരുന്ന ഉപമ അവതരിപ്പിക്കുന്നു. ‘കാണിച്ചുതരാം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: ആരെപ്പോലെയാണെന്ന്
  rationale: τίνι ഔപചാരികമായി ദത്തിവിഭക്തിയിലുള്ള ‘ആർക്ക്/ആരോട്’ എന്ന രൂപമാണെങ്കിലും താരതമ്യത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘ആരെപ്പോലെ’ എന്നതാണ്; തുടർന്ന് വരുന്ന വ്യക്തിയോടുള്ള ഉപമയും ഇത് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഗ്രീക്കിലെ പൊതുവാചകമായ പുല്ലിംഗ ഏകവചനം
  choice: മലയാളത്തിലെ സ്വാഭാവികമായ ലിംഗനിരപേക്ഷ പൊതുവാചകമായ ‘ഏവനും ... ആരെപ്പോലെ’ ഉപയോഗിച്ചു
  alternative: ‘അവൻ ആരെപ്പോലെ’ എന്ന് പ്രതിനിധാന പുല്ലിംഗം വ്യക്തമാക്കുക
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം ഇവിടെ ഏതൊരു വ്യക്തിയെയും പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ഏവനും’ എന്നതും ബന്ധപ്പെട്ട കൃദന്തഘടനയും സംഖ്യയും പൊതുവായ വ്യക്തിസൂചനയും നിലനിർത്തുമ്പോൾ അനാവശ്യമായി പുരുഷലിംഗം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വന്ന്, ... കേൾക്കുകയും ... അനുസരിക്കുകയും ചെയ്യുന്ന’ എന്ന ക്രിയാശൃംഖല മൂലപാഠത്തിലെ വരുക–കേൾക്കുക–ചെയ്യുക എന്ന പുരോഗതി നിലനിർത്തുന്നു. വാക്യാവസാനത്തിലെ ദ്വിബിന്ദു അടുത്ത വാക്യത്തിൽ വരുന്ന ഉപമയിലേക്കുള്ള തുറന്ന ബന്ധം സൂക്ഷിക്കുന്നു.
