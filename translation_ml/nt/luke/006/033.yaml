reference: Luke 6:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: ml
  text: നിങ്ങളോടു നന്മ ചെയ്യുന്നവർക്കു നിങ്ങൾ നന്മ ചെയ്താൽ[a], നിങ്ങൾക്കു എന്തു പ്രശംസയാണുള്ളത്? പാപികളും അതുതന്നെ ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾക്കു എന്തു കൃപയാണുള്ളത്?” ഗ്രീക്ക് പദത്തിന് ‘കൃപ,’ ‘പ്രീതി,’ ‘നന്ദി,’ ‘അംഗീകാരം’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ പരസ്പര നന്മയ്ക്ക് ലഭിക്കുന്ന അംഗീകാരമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε
  choice: നന്മ ചെയ്താൽ
  rationale: മറ്റുള്ളവർക്ക് നന്മ ചെയ്യുക, ഉപകാരം ചെയ്യുക എന്ന ക്രിയാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἀγαθοποιοῦντας
  choice: നന്മ ചെയ്യുന്നവർക്കു
  rationale: മൂലപാഠത്തിലെ ഒരേ പദകുടുംബബന്ധം നിലനിർത്താൻ ἀγαθοποιῆτε എന്നതിനോടൊപ്പം ‘നന്മ ചെയ്യുക’ തന്നെയാണ് ഉപയോഗിച്ചത്.
- source_word: ποία ... χάρις
  choice: എന്തു പ്രശംസയാണുള്ളത്
  rationale: ഈ നൈതികസന്ദർഭത്തിൽ χάρις രക്ഷാകരമായ ‘കൃപ’യേക്കാൾ, ഒരു പ്രവൃത്തിക്ക് ലഭിക്കുന്ന അംഗീകാരം അഥവാ പ്രശംസയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ചോദ്യം സ്വാഭാവികമാകാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്ക്
  rationale: അംഗീകാരമോ പ്രശംസയോ ഒരാൾക്കു ലഭിക്കുന്നു എന്ന ദാതൃകാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἁμαρτωλοὶ
  choice: പാപികൾ
  rationale: ലൂക്കോസിലെ സാമൂഹിക-മതപരമായ വിഭാഗസൂചന മയപ്പെടുത്താതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: അതുതന്നെ ചെയ്യുന്നു
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: καὶ
  choice: -ഉം / വാക്യബന്ധം
  rationale: ആദ്യ καὶ മുൻവാക്യങ്ങളോടുള്ള തുടർച്ചയായി മലയാളത്തിലെ നിബന്ധനാവാക്യഘടനയിൽ സ്വാഭാവികമായി ലയിക്കുന്നു; രണ്ടാമത്തേത് ‘പാപികളും’ എന്നതിലെ ‘-ഉം’ വഴി ഉൾക്കൊള്ളുന്ന ഊന്നൽ നൽകുന്നു.
theological_decisions:
- issue: നൈതിക ഉപദേശസന്ദർഭത്തിലെ χάρις എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രശംസ അഥവാ അംഗീകാരം
  alternative: കൃപ; നന്ദി; പ്രീതി
  rationale: പരസ്പരപ്രത്യുപകാരമായി ചെയ്യുന്ന നന്മയ്ക്ക് പ്രത്യേക അംഗീകാരം ലഭിക്കുമോ എന്നതാണ് വാക്യത്തിലെ ചോദ്യം. ‘കൃപ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകിയാൽ ഇവിടെ ഉദ്ദേശിക്കാത്ത രക്ഷാശാസ്ത്രപരമായ അർഥം വായനക്കാരൻ ഉൾക്കൊള്ളാൻ സാധ്യതയുണ്ട്; യഥാർഥ പദവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നന്മ ചെയ്യുക’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ പദബന്ധം സംരക്ഷിക്കുന്നു. χάρις എന്നതിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
