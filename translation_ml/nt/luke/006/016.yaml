revisions:
- from: യാക്കോബിന്റെ മകനായ യൂദാസ്[a], ഈസ്കര്യോത്തുകാരനായ യൂദാസ്—ഇവരെയും തിരഞ്ഞെടുത്തു. ഈ യൂദാസ് പിന്നീട് ഒറ്റിക്കൊടുക്കുന്നവനായിത്തീർന്നു.
  to: യാക്കോബിന്റെ മകനായ യൂദാസും[a], ഇസ്കരിയോത്ത് യൂദാസും; അവൻ ദ്രോഹിയായിത്തീർന്നു.
  rationale: The revision removes unsupported additions, transliterates Ἰσκαριώθ as a designation, and uses “ദ്രോഹിയായിത്തീർന്നു” to reflect both προδότης and the change-of-state force of ἐγένετο. The supplied ‘son’ remains in the main text for readable list syntax, with the Greek ambiguity retained in the footnote.
