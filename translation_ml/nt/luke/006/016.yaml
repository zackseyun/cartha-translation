source:
  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: ml
  text: യാക്കോബിന്റെ മകനായ യൂദാസും[a], ഇസ്കരിയോത്ത് യൂദാസും; അവൻ ദ്രോഹിയായിത്തീർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യാക്കോബിന്റെ സഹോദരനായ യൂദാസ്’; ഗ്രീക്കിൽ ‘യാക്കോബിന്റെ യൂദാസ്’ എന്നു മാത്രമാണുള്ളത്.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: യാക്കോബിന്റെ മകനായ യൂദാസ്
  rationale: Ἰακώβου എന്ന ബന്ധസൂചക ഷഷ്ഠീവിഭക്തി കൃത്യമായ ബന്ധം വ്യക്തമാക്കുന്നില്ല. അപ്പൊസ്തലന്മാരുടെ പട്ടികയിൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘മകൻ’ ചേർത്തു; ശേഷിക്കുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: Ἰσκαριὼθ
  choice: ഈസ്കര്യോത്തുകാരനായ
  rationale: വ്യക്തിയെ തിരിച്ചറിയിക്കുന്ന നാമവിശേഷണം മലയാള ബൈബിൾ പ്രയോഗത്തിന് അനുയോജ്യമായി ലിപ്യന്തരിച്ചു.
- source_word: ὃς ἐγένετο
  choice: ഈ യൂദാസ് പിന്നീട് ... ആയിത്തീർന്നു
  rationale: ἐγένετο എന്ന ക്രിയയുടെ ‘ആയിത്തീർന്നു’ എന്ന പരിവർത്തനാത്മക അർഥം സംരക്ഷിക്കുന്നു. വ്യക്തതയ്ക്കായി ബന്ധസർവനാമം പുതിയ വാക്യത്തിൽ പേരുപയോഗിച്ച് അവതരിപ്പിച്ചു; ‘പിന്നീട്’ സംഭവക്രമത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: προδότης
  choice: ഒറ്റിക്കൊടുക്കുന്നവൻ
  rationale: വിശ്വസിച്ചവനെ ശത്രുക്കൾക്ക് കൈമാറുന്ന വ്യക്തി എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; വെറും പ്രവൃത്തിയെക്കാൾ വ്യക്തിയുടെ സ്വഭാവനിർദേശം നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: —ഇവരെയും തിരഞ്ഞെടുത്തു
  rationale: ഈ വാക്യം മുൻപത്തെ അപ്പൊസ്തലപട്ടികയുടെ തുടർച്ചയായതിനാൽ ആവർത്തിക്കുന്ന καὶ-കളുടെ പട്ടികാബന്ധം നിലനിർത്തുകയും, മലയാളത്തിൽ ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ ആവശ്യമായ മുൻസന്ദർഭക്രിയ വ്യക്തമാക്കുകയും ചെയ്തു.
theological_decisions:
- issue: Ἰακώβου എന്ന പ്രയോഗത്തിൽ സൂചിപ്പിക്കുന്ന കുടുംബബന്ധം
  choice: പ്രധാന പാഠത്തിൽ ‘യാക്കോബിന്റെ മകനായ യൂദാസ്’
  alternative: ‘യാക്കോബിന്റെ സഹോദരനായ യൂദാസ്’; അക്ഷരാർഥത്തിൽ ‘യാക്കോബിന്റെ യൂദാസ്’
  rationale: ഗ്രീക്ക് പാഠം ബന്ധം വ്യക്തമാക്കാതെ ‘യാക്കോബിന്റെ’ എന്നു മാത്രം പറയുന്നു. പട്ടികയിൽ പിതൃനാമം സൂചിപ്പിക്കുന്നതാണെന്ന സാധ്യത കൂടുതലായതിനാൽ ‘മകൻ’ പ്രധാന പാഠത്തിൽ സ്വീകരിച്ചു; യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ഒറ്റപ്പെട്ട വാക്യമായി സ്വാഭാവികമായി വായിക്കാനായി മുൻവാക്യത്തിലെ ‘തിരഞ്ഞെടുത്തു’ എന്ന ക്രിയ അർഥാനുസൃതമായി പൂരിപ്പിച്ചു. ‘ഈ യൂദാസ്’ എന്ന ആവർത്തനം രണ്ട് യൂദാസുമാരിൽ ആരെയാണ് അവസാന ഉപവാക്യം സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
