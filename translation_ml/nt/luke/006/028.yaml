id: LUK.6.28
reference: Luke 6:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὐλογεῖτε τοὺς καταρωμένους ⸀ὑμᾶς, προσεύχεσθε ⸀περὶ τῶν ἐπηρεαζόντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: ml
  text: നിങ്ങളെ ശപിക്കുന്നവരെ അനുഗ്രഹിക്കുവിൻ; നിങ്ങളോടു മോശമായി പെരുമാറുന്നവർക്കുവേണ്ടി പ്രാർഥിക്കുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങളോടു മോശമായി പെരുമാറുന്നവർ” എന്നതിന് “അധിക്ഷേപിക്കുന്നവർ,” “അപമാനിക്കുന്നവർ,” അല്ലെങ്കിൽ “ദുരുപദ്രവം ചെയ്യുന്നവർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ ശത്രുതാപരമായ പലവിധ ദുരുപദ്രവങ്ങളെയും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: അനുഗ്രഹിക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു; ശപിക്കുന്നതിനോടുള്ള ഉദ്ദേശ്യപൂർവമായ വിരുദ്ധപ്രതികരണവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: നിങ്ങളെ ശപിക്കുന്നവരെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാന കൃദന്തരൂപത്തെ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളവാക്യമായി നൽകുന്നു; καταράομαι എന്നതിന്റെ ശാപവാക്ക് പറയുക/ശാപം വരുത്തുക എന്ന ശത്രുതാപരമായ അർത്ഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: προσεύχεσθε
  choice: പ്രാർഥിക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞയെ ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു. ഗ്രീക്ക് വർത്തമാനകാലം സൂചിപ്പിക്കാവുന്ന തുടർച്ചയായ മനോഭാവം അധികവാക്കുകളാൽ അമിതമായി നിർവചിക്കുന്നില്ല.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: നിങ്ങളെ ദ്രോഹിക്കുന്നവർക്കുവേണ്ടി
  rationale: προσεύχομαι എന്നതിനോടൊപ്പം περί ഇവിടെ ‘വേണ്ടി’ എന്ന അർത്ഥം നൽകുന്നു. ἐπηρεάζω അപമാനിക്കൽ, അധിക്ഷേപിക്കൽ, ദുരുപയോഗം ചെയ്യൽ, പൊതുവായ ദ്രോഹം എന്നിവ ഉൾക്കൊള്ളാം; ‘ദ്രോഹിക്കുന്നവർ’ ഈ വിശാലത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശത്രുസ്നേഹവുമായി ബന്ധപ്പെട്ട ആജ്ഞകളുടെ വ്യാപ്തി
  choice: ശത്രുതയ്ക്കുള്ള പ്രതികരണമായി അനുഗ്രഹിക്കാനും പ്രാർഥിക്കാനും ഉള്ള ആജ്ഞകൾ നേരിട്ട് അവതരിപ്പിച്ചു.
  alternative: പ്രതികാരനിരോധനം, ക്ഷമ, അല്ലെങ്കിൽ മറ്റു ഉപദേശപരമായ വിശദീകരണങ്ങൾ വാക്യത്തിൽ ചേർക്കുക.
  rationale: മൂലവാക്യം വിശദീകരണം നൽകാതെ നേരിട്ടുള്ള ധാർമ്മിക ആജ്ഞകളാണ് നൽകുന്നത്. അതിന്റെ കഠിനതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും വിവർത്തനം സ്വതന്ത്രമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘അനുഗ്രഹിക്കുവിൻ’, ‘പ്രാർഥിക്കുവിൻ’ എന്നീ രൂപങ്ങൾ ബഹുവചന ആജ്ഞയുടെ ശക്തി വ്യക്തമായി നിലനിർത്തുന്നു. വായനാസൗകര്യത്തിനായി പദക്രമം സ്വാഭാവികമാക്കിയെങ്കിലും രണ്ടു സമാന്തര ആജ്ഞകളുടെ ഘടന സംരക്ഷിച്ചു.
