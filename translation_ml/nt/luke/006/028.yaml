revisions:
- from: നിങ്ങളെ ശപിക്കുന്നവരെ അനുഗ്രഹിക്കുവിൻ; നിങ്ങളെ ദ്രോഹിക്കുന്നവർക്കുവേണ്ടി പ്രാർഥിക്കുവിൻ.[a]
  to: നിങ്ങളെ ശപിക്കുന്നവരെ അനുഗ്രഹിക്കുവിൻ; നിങ്ങളോടു മോശമായി പെരുമാറുന്നവർക്കുവേണ്ടി പ്രാർഥിക്കുവിൻ.[a]
  rationale: The second object has been revised to remove the misleading connotation of betrayal in “ദ്രോഹിക്കുന്നവർ” and to express the lexical breadth of ἐπηρεάζω in natural modern Malayalam. No other change is needed.
