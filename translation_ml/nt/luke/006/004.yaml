id: LUK.6.4
reference: Luke 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: ml
  text: അവൻ ദൈവത്തിന്റെ ഭവനത്തിൽ പ്രവേശിച്ച്, പുരോഹിതന്മാർക്കു മാത്രമല്ലാതെ മറ്റാർക്കും നിയമപ്രകാരം തിന്നാൻ അനുവാദമില്ലാത്ത സന്നിധിയിലെ അപ്പം എടുത്തു തിന്നുകയും കൂടെയുണ്ടായിരുന്നവർക്കു കൊടുക്കുകയും ചെയ്തത് എങ്ങനെയെന്ന്;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: എങ്ങനെയെന്ന്
  rationale: മുൻവാക്യത്തിലെ ‘വായിച്ചിട്ടില്ലേ?’ എന്ന ചോദ്യത്തിന്റെ തുടർച്ചയായ പരോക്ഷചോദ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഭവനത്തിൽ കടന്ന്
  rationale: οἶκος എന്ന പദത്തെ ‘ദൈവത്തിന്റെ ഭവനം’ എന്നു നിലനിർത്തുന്നു; ‘ദേവാലയം’ എന്ന് പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: ἄρτους τῆς προθέσεως
  choice: സന്നിധിയപ്പം
  rationale: ദൈവസന്നിധിയിൽ വെച്ചിരുന്ന വിശുദ്ധ അപ്പത്തെ സൂചിപ്പിക്കുന്ന, സംക്ഷിപ്തവും ആരാധനാസംബന്ധിയായ അർഥം നിലനിർത്തുന്നതുമായ പ്രയോഗം.
- source_word: λαβὼν ἔφαγεν
  choice: എടുത്തു തിന്നുകയും
  rationale: കൃതന്തവും മുഖ്യക്രിയയും സൂചിപ്പിക്കുന്ന പ്രവർത്തനക്രമം സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: കൂടെയുണ്ടായിരുന്നവർക്കു കൊടുക്കുകയും
  rationale: ഗ്രീക്കിലെ ‘അവനോടുകൂടെ ഉണ്ടായിരുന്നവർ’ എന്ന ആശയം അധിക വിശദീകരണമില്ലാതെ പകർത്തുന്നു.
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: തിന്നാൻ നിയമം അനുവദിക്കാത്ത
  rationale: ഇത് വെറും സാമൂഹിക അനുമതിയല്ല, നിയമപരവും ആരാധനാപരവുമായ നിയന്ത്രണമാണെന്ന സൂചന നിലനിർത്തുന്നു.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: പുരോഹിതന്മാർക്കു മാത്രമല്ലാതെ മറ്റാർക്കും
  rationale: പുരോഹിതന്മാർക്കു മാത്രമുള്ള അനുവാദം എന്ന ഇരട്ട ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വിശുദ്ധ അപ്പം ഭക്ഷിക്കുന്നതിനുള്ള ആരാധനാ-നിയമ നിയന്ത്രണം
  choice: നിയമം അനുവദിക്കാത്ത
  alternative: അനുവാദമില്ലാത്ത
  rationale: ἔξεστιν ഇവിടെ ഇസ്രായേലിന്റെ ആരാധനാനിയമപ്രകാരമുള്ള സാധുതയെ സൂചിപ്പിക്കുന്നതിനാൽ നിയമപരമായ ഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച ചോദ്യത്തിന്റെ തുടർച്ചയായതിനാൽ, സ്വതന്ത്രവായനയിലും അർഥം വ്യക്തമാകാൻ ‘നിങ്ങൾ വായിച്ചിട്ടില്ലേ?’ എന്ന നിയന്ത്രകപ്രയോഗം ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
