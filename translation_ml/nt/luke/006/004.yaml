- from: അവൻ ദൈവത്തിന്റെ ഭവനത്തിൽ കടന്ന്, പുരോഹിതന്മാർക്കു മാത്രമല്ലാതെ മറ്റാർക്കും തിന്നാൻ നിയമം അനുവദിക്കാത്ത സന്നിധിയപ്പം[a] എടുത്തു തിന്നുകയും കൂടെയുണ്ടായിരുന്നവർക്കു കൊടുക്കുകയും ചെയ്തത് എങ്ങനെയെന്ന് നിങ്ങൾ വായിച്ചിട്ടില്ലേ?
