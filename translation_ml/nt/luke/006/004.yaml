    text: അല്ലെങ്കിൽ, “സമർപ്പിച്ച അപ്പം”; പരമ്പരാഗതമായി, “കാഴ്ചയപ്പം.”
    reason: ἄρτους τῆς προθέσεως എന്ന ആരാധനാസംബന്ധിയായ പ്രയോഗത്തിന്റെ മറ്റ് അംഗീകൃത വിവർത്തനങ്ങൾ നൽകുന്നു.
