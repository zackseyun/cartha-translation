revisions:
- from: ഇപ്പോൾ വയറുനിറഞ്ഞിരിക്കുന്ന നിങ്ങൾക്ക് അയ്യോ കഷ്ടം! നിങ്ങൾ വിശന്നുപോകും.[a] ഇപ്പോൾ ചിരിക്കുന്ന നിങ്ങൾക്ക് അയ്യോ കഷ്ടം![b] നിങ്ങൾ ദുഃഖിച്ചു കരയും.
  to: ഇപ്പോൾ വയറുനിറഞ്ഞിരിക്കുന്ന നിങ്ങൾക്കു കഷ്ടം! കാരണം, നിങ്ങൾ വിശക്കും.[a] ഇപ്പോൾ ചിരിക്കുന്ന നിങ്ങൾക്കു കഷ്ടം![b] കാരണം, നിങ്ങൾ ദുഃഖിക്കുകയും കരയുകയും ചെയ്യും.
  rationale: The revision explicitly renders both instances of ὅτι as ‘കാരണം,’ retains the present-versus-future reversal, and expresses the two final future verbs as coordinated but distinct actions. It also aligns the second footnote with its lexical-alternative classification and the English audit trail, without adding an interpretation of the judgment.
