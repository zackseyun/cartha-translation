id: LUK.6.25
reference: Luke 6:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: ml
  text: ഇപ്പോൾ വയറുനിറഞ്ഞിരിക്കുന്ന നിങ്ങൾക്കു കഷ്ടം! കാരണം, നിങ്ങൾ വിശക്കും.[a] ഇപ്പോൾ ചിരിക്കുന്ന നിങ്ങൾക്കു കഷ്ടം![b] കാരണം, നിങ്ങൾ ദുഃഖിക്കുകയും കരയുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങൾ വിശന്നുപോകും.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അയ്യോ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: അയ്യോ കഷ്ടം
  rationale: കേവലം സഹതാപമല്ല, വരാനിരിക്കുന്ന ന്യായവിധിയെയും അവസ്ഥാമാറ്റത്തെയും കുറിച്ചുള്ള പ്രവാചകീയ മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്തുന്നു; അതേസമയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: ἐμπεπλησμένοι
  choice: വയറുനിറഞ്ഞിരിക്കുന്ന
  rationale: നിറയ്ക്കപ്പെട്ടതിന്റെ ഫലമായി ഇപ്പോൾ തൃപ്തമായിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പൂർണകാല കൃദന്തരൂപം ദൃശ്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള വിശപ്പുമായുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: ഇപ്പോഴത്തെ അവസ്ഥയും ഭാവിയിലെ വിപരീതാവസ്ഥയും തമ്മിലുള്ള നിർണായകമായ കാലവൈരുധ്യം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: πεινάσετε
  choice: നിങ്ങൾ വിശന്നുപോകും
  rationale: ഭാവിയിൽ അനുഭവപ്പെടാനിരിക്കുന്ന അഭാവത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γελῶντες
  choice: ചിരിക്കുന്ന
  rationale: ഇപ്പോൾ ചിരിച്ചുകൊണ്ടിരിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടർച്ചാഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: πενθήσετε
  choice: നിങ്ങൾ ദുഃഖിക്കും
  rationale: വിലാപത്തിന്റെ ഗൗരവമുള്ള ദുഃഖത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള കരച്ചിലിൽനിന്ന് ആശയപരമായി വേർതിരിച്ചുനിർത്തുന്നു.
- source_word: κλαύσετε
  choice: കരയും
  rationale: ദുഃഖത്തിന്റെ പ്രകടമായ കരച്ചിലിനെ സൂചിപ്പിച്ച്, πενθήσετε എന്നതിനു പിന്നാലെയുള്ള വാഗ്‌ശക്തിവർധന നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: തുടർന്നുള്ള സ്വതന്ത്രവാക്യത്തിലൂടെ കാരണഫലം പ്രകടമാക്കുന്നു
  rationale: മലയാളത്തിൽ ആശ്ചര്യവാക്യത്തിനു പിന്നാലെ നേരിട്ടുള്ള ഭാവിവാക്യം നൽകുന്നത് ‘കാരണം’ ആവർത്തിക്കുന്നതിനേക്കാൾ സ്വാഭാവികമാണ്; ഗ്രീക്കിലെ മുന്നറിയിപ്പിനുള്ള ആധാരം നഷ്ടമാകുന്നില്ല.
theological_decisions:
- issue: ദുരിതപ്രഖ്യാപനത്തിന്റെ സ്വഭാവം
  choice: ഇപ്പോൾ സംതൃപ്തരും നിർഭാരരുമായിരിക്കുന്നവർക്ക് വരാനിരിക്കുന്ന അവസ്ഥാമാറ്റത്തെയും ന്യായവിധിയെയും കുറിച്ചുള്ള പ്രവാചകീയ മുന്നറിയിപ്പ്
  alternative: ജീവിതസാഹചര്യങ്ങൾ മാറുന്നതിനെക്കുറിച്ചുള്ള വെറും സാമൂഹിക നിരീക്ഷണം
  rationale: ആവർത്തിക്കുന്ന οὐαί, ഭാവികാല ക്രിയകൾ, ചുറ്റുമുള്ള അനുഗ്രഹപ്രഖ്യാപനങ്ങളുമായുള്ള സമാന്തരത എന്നിവ നിഷ്പക്ഷ നിരീക്ഷണത്തേക്കാൾ ശക്തമായ മുന്നറിയിപ്പിനെ സൂചിപ്പിക്കുന്നു. എന്നാൽ ആ അവസ്ഥാമാറ്റത്തിന്റെ കൃത്യമായ വിധമോ സമയമോ പരിഭാഷ കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവവും പ്രവാചകീയ ശക്തിയും നിലനിർത്തുന്ന ശൈലി. ‘വയറുനിറഞ്ഞിരിക്കുന്ന’ എന്ന ദൃശ്യപ്രയോഗം ഭാവിയിലെ വിശപ്പുമായുള്ള നേർവൈരുധ്യം വ്യക്തമാക്കുന്നു. അവസാനത്തെ രണ്ടു ഗ്രീക്ക് ക്രിയകളും വേർതിരിച്ചു നിലനിർത്താൻ ‘ദുഃഖിച്ചു കരയും’ എന്നു ചേർത്തിരിക്കുന്നു.
