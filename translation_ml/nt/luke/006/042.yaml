review_pass:
  verdict: revise
  source_fidelity: The central imagery, emphatic contrast ('your own eye'), sequence ('first ... then'), and the permission-request sense of ἄφες ἐκβάλω are substantially retained. However, the initial fronting of the addressee's unseen beam before the question weakens the source's rhetorical progression, and 'കപടഭക്താ' adds a specifically religious-devotee sense not required by ὑποκριτά.
  naturalness: The Malayalam is generally clear and modern. Recasting the opening in the source order produces a more natural rhetorical question. 'കപടനേ' is the direct, idiomatic equivalent for the vocative rebuke.
  terminology: ‘കരട്’ and ‘മരത്തടി’ adequately preserve the small-versus-large contrast. The footnote alternative ‘ഉത്തരം’ is not an appropriate Malayalam lexical alternative for δοκός in this context and should be removed. ‘കപടഭക്താ’ should be replaced because it over-specifies the Greek term.
  issues:
  - severity: medium
    issue: ‘കപടഭക്താ’ over-translates ὑποκριτά.
    rationale: ὑποκριτά means ‘hypocrite’/‘pretender’; it does not specifically identify the person as a religious devotee. ‘കപടനേ’ preserves the rebuke without importing that added sense.
  - severity: low
    issue: The opening clause is reordered away from the Greek rhetorical question.
    rationale: The draft begins with the addressee's failure to see the beam. Restoring ‘How can you say ... while you do not see ...?’ better reflects πῶς δύνασαι λέγειν ... αὐτὸς ... οὐ βλέπων.
  - severity: medium
    issue: The δοκός footnote gives ‘ഉത്തരം’ as an alternative.
    rationale: ‘ഉത്തരം’ is not a suitable term here for a large timber/beam and may mislead readers. A transparent alternative such as ‘വലിയ തടിക്കഷണം’ is appropriate.
  revised_text: നിന്റെ സഹോദരനോട്[a], ‘സഹോദരാ, നിന്റെ കണ്ണിലുള്ള കരട്[b] എടുത്തുകളയാൻ എന്നെ അനുവദിക്കൂ’ എന്നു, നിന്റെ സ്വന്തം കണ്ണിലുള്ള മരത്തടി[c] കാണാതിരിക്കെ, നിനക്ക് എങ്ങനെ പറയാൻ കഴിയും? കപടനേ, ആദ്യം നിന്റെ സ്വന്തം കണ്ണിൽനിന്ന് മരത്തടി എടുത്തുകളയുക; അപ്പോൾ നിന്റെ സഹോദരന്റെ കണ്ണിലുള്ള കരട് എടുത്തുകളയാൻ നിനക്കു വ്യക്തമായി കാണാം.
  revised_footnotes:
