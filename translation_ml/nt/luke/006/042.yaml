revisions:
- from: നിന്റെ സ്വന്തം കണ്ണിലുള്ള മരത്തടി കാണാതിരിക്കെ, ‘സഹോദരാ, നിന്റെ കണ്ണിലുള്ള കരട്[b] എടുത്തുകളയാൻ എന്നെ അനുവദിക്കൂ’ എന്നു നിന്റെ സഹോദരനോട്[a] പറയാൻ നിനക്ക് എങ്ങനെ കഴിയും? കപടഭക്താ, ആദ്യം നിന്റെ സ്വന്തം കണ്ണിൽനിന്ന് മരത്തടി[c] എടുത്തുകളയുക; അപ്പോൾ നിന്റെ സഹോദരന്റെ കണ്ണിലുള്ള കരട് എടുത്തുകളയാൻ നിനക്കു വ്യക്തമായി കാണാം.
  to: നിന്റെ സഹോദരനോട്[a], ‘സഹോദരാ, നിന്റെ കണ്ണിലുള്ള കരട്[b] എടുത്തുകളയാൻ എന്നെ അനുവദിക്കൂ’ എന്നു, നിന്റെ സ്വന്തം കണ്ണിലുള്ള മരത്തടി[c] കാണാതിരിക്കെ, നിനക്ക് എങ്ങനെ പറയാൻ കഴിയും? കപടനേ, ആദ്യം നിന്റെ സ്വന്തം കണ്ണിൽനിന്ന് മരത്തടി എടുത്തുകളയുക; അപ്പോൾ നിന്റെ സഹോദരന്റെ കണ്ണിലുള്ള കരട് എടുത്തുകളയാൻ നിനക്കു വ്യക്തമായി കാണാം.
  rationale: The revision restores the Greek rhetorical order, replaces an interpretively narrowed term for ‘hypocrite’ with the direct Malayalam equivalent, and corrects the lexical footnote for δοκός. It otherwise retains the draft’s clear modern Malayalam and its source-faithful masculine singular kinship language.
