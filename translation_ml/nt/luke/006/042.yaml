id: LUK.6.42
reference: Luke 6:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: ml
  text: നിന്റെ സഹോദരനോട്[a], ‘സഹോദരാ, നിന്റെ കണ്ണിലുള്ള കരട്[b] എടുത്തുകളയാൻ എന്നെ അനുവദിക്കൂ’ എന്നു, നിന്റെ സ്വന്തം കണ്ണിലുള്ള മരത്തടി[c] കാണാതിരിക്കെ, നിനക്ക് എങ്ങനെ പറയാൻ കഴിയും? കപടനേ, ആദ്യം നിന്റെ സ്വന്തം കണ്ണിൽനിന്ന് മരത്തടി എടുത്തുകളയുക; അപ്പോൾ നിന്റെ സഹോദരന്റെ കണ്ണിലുള്ള കരട് എടുത്തുകളയാൻ നിനക്കു വ്യക്തമായി കാണാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരൻ” ഗ്രീക്കിലെ ἀδελφός എന്ന പുല്ലിംഗ ഏകവചന ബന്ധപദത്തിന്റെ വിവർത്തനമാണ്; ഉപദേശം കൂടുതൽ വിശാലമായി ബാധകമാകാമെങ്കിലും ഗ്രീക്ക് പ്രയോഗം പുല്ലിംഗത്തിലാണ്.
    reason: cultural_note
  - marker: b
    text: “കരട്” എന്നതിന് “ചെറിയ ചീള്” എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് κάρφος വളരെ ചെറിയ ഉണങ്ങിയ കഷണമോ കണമോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: “മരത്തടി” എന്നതിന് “വലിയ തടിക്കഷണം” അഥവാ “വലിയ നിർമാണത്തടി” എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് δοκός വലിയൊരു തടിക്കഷണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασαι
  choice: നിനക്ക് എങ്ങനെ കഴിയും?
  rationale: സാധ്യതയെയും ഔചിത്യത്തെയും ചോദ്യം ചെയ്യുന്ന ഗ്രീക്ക് ആലങ്കാരിക ചോദ്യത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: സഹോദരനോട് / സഹോദരാ / സഹോദരന്റെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന ബന്ധപദവും നേരിട്ടുള്ള സംബോധനയും അതേപടി നിലനിർത്തുന്നു; പ്രയോഗത്തിന്റെ വിശാലത കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἄφες ἐκβάλω
  choice: എടുത്തുകളയാൻ എന്നെ അനുവദിക്കൂ
  rationale: അനുമതി അഭ്യർഥിക്കുന്ന ആജ്ഞാരൂപത്തിന്റെ അർഥം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: κάρφος
  choice: കരട്
  rationale: കണ്ണിൽ വീഴാവുന്ന അതിസൂക്ഷ്മമായ ഉണങ്ങിയ കണത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പദം; വലിയ മരത്തടിയുമായുള്ള അതിശയോക്തിപരമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: δοκός
  choice: മരത്തടി
  rationale: വലിയ നിർമാണത്തടിയെ സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന വിധത്തിൽ അവതരിപ്പിക്കുകയും ചിത്രത്തിന്റെ അതിശയോക്തി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: αὐτὸς ... σοῦ
  choice: നിന്റെ സ്വന്തം
  rationale: മറ്റൊരാളുടെ കണ്ണും അഭിസംബോധിതന്റെ കണ്ണും തമ്മിലുള്ള ഗ്രീക്കിലെ ഊന്നിയ വൈരുധ്യം പ്രകടമാക്കുന്നു.
- source_word: ὑποκριτά
  choice: കപടഭക്താ
  rationale: ധാർമികത നടിച്ചുകൊണ്ട് സ്വന്തം വലിയ തെറ്റ് കാണാത്തവനെ നേരിട്ട് ശാസിക്കുന്ന സംബോധനയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: διαβλέψεις
  choice: നിനക്കു വ്യക്തമായി കാണാം
  rationale: വെറും കാണുക എന്നതിലുപരി തെളിഞ്ഞു കാണുക എന്ന ഗ്രീക്ക് ക്രിയയുടെ അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ധാർമിക ഉപദേശത്തിലെ ἀδελφός എന്ന ലിംഗസൂചക ബന്ധപദം
  choice: സഹോദരൻ
  alternative: സഹോദരനോ സഹോദരിയോ; സഹവിശ്വാസി
  rationale: മൂലപാഠം പുല്ലിംഗ ഏകവചനത്തിലാണ്. ഉപദേശം വിശാലമായി ബാധകമാകാമെങ്കിലും വിവർത്തനം അതിനെ ലിംഗനിരപേക്ഷമായി മാറ്റുന്നില്ല.
- issue: κάρφος–δοκός രൂപകത്തിലെ അതിശയോക്തിപരമായ വൈരുധ്യം
  choice: കരട് … മരത്തടി
  alternative: ചെറിയ ചീള് … ഉത്തരം
  rationale: മറ്റൊരാളുടെ ചെറിയ തെറ്റും സ്വന്തം വലിയ തെറ്റും തമ്മിലുള്ള ധാർമിക വൈരുധ്യം വിശദീകരിച്ച് ചുരുക്കാതെ, ദൃശ്യരൂപമായി നിലനിർത്തുന്നു.
- issue: സ്വയം പരിശോധിക്കലും മറ്റൊരാളെ തിരുത്തലും തമ്മിലുള്ള ക്രമം
  choice: ആദ്യം സ്വന്തം കണ്ണിലെ മരത്തടി നീക്കുക; തുടർന്ന് മറ്റൊരാളുടെ കണ്ണിലെ കരട് നീക്കാൻ വ്യക്തമായി കാണുക
  alternative: മറ്റൊരാളെ ഒരിക്കലും തിരുത്തരുതെന്ന സമ്പൂർണ നിരോധനമായി വ്യാഖ്യാനിക്കുക
  rationale: πρῶτον (‘ആദ്യം’), καὶ τότε (‘അപ്പോൾ’) എന്നീ പദങ്ങൾ സൂചിപ്പിക്കുന്ന ക്രമം നിലനിർത്തുന്നു; വാക്യം നൽകാത്ത സമ്പൂർണ നിരോധനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കണ്ണിലെ കരട്’ എന്ന പരിചിത പ്രയോഗവും ‘മരത്തടി’ എന്ന സുതാര്യമായ ദൃശ്യപദവും ഉപയോഗിച്ചു. നേരിട്ടുള്ള ശാസനയുടെ തീവ്രത മൃദൂകരിക്കാതെ നിലനിർത്തി.
