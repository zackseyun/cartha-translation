source:
  edition: SBLGNT
  text: Ἀλλὰ ὑμῖν λέγω τοῖς ἀκούουσιν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν, καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: ml
  text: 'എന്നാൽ, കേൾക്കുന്ന നിങ്ങളോടു[a] ഞാൻ പറയുന്നു: നിങ്ങളുടെ ശത്രുക്കളെ സ്നേഹിക്കുക; നിങ്ങളെ വെറുക്കുന്നവർക്കു നന്മ ചെയ്യുക,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കേൾക്കുന്നവരായ നിങ്ങളോടു.” ഗ്രീക്കിലെ വർത്തമാനകാല കൃദന്തരൂപം ‘കേട്ടുകൊണ്ടിരിക്കുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം; എങ്കിലും ഇവിടെ അതു നിർബന്ധമായും തുടർച്ചയെ ഊന്നിപ്പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻപുള്ള പ്രസ്താവനകളോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὑμῖν λέγω
  choice: നിങ്ങളോടു ഞാൻ പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പ്രസംഗസൂത്രവും നിലനിർത്തുന്നു.
- source_word: τοῖς ἀκούουσιν
  choice: കേട്ടുകൊണ്ടിരിക്കുന്ന നിങ്ങളോടു
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിലെ തുടരുന്ന പ്രവൃത്തിയുടെ ഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കേവലം ശബ്ദം കേൾക്കുന്നതിലധികം ശ്രദ്ധയോടെ കേൾക്കുന്ന സന്ദർഭഭാവം നിർബന്ധമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀγαπᾶτε
  choice: സ്നേഹിക്കുക
  rationale: ആജ്ഞാരൂപം വ്യക്തമായി നിലനിർത്തുകയും ἀγαπάω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: നിങ്ങളുടെ ശത്രുക്കളെ
  rationale: കർമവും ഉടമസ്ഥസർവനാമവും നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: καλῶς ποιεῖτε
  choice: നന്മ ചെയ്യുക
  rationale: പ്രവൃത്തിയെയും അതിന്റെ ധാർമിക ഗുണത്തെയും ചുരുക്കമായും സാധാരണ മലയാളത്തിലും പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: നിങ്ങളെ വെറുക്കുന്നവർക്കു
  rationale: ദാതൃവിഭക്തിബന്ധം സ്വാഭാവികമായി നിലനിർത്തുകയും μισέω എന്നതിന്റെ ശക്തി മയപ്പെടുത്താതെ ‘വെറുക്കുക’ എന്നു നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: എതിരാളികളോടുള്ള ധാർമിക ആജ്ഞകൾ
  choice: ആജ്ഞകളുടെ വ്യാപ്തി ചുരുക്കാതെയും മൂലപാഠത്തിലില്ലാത്ത വ്യവസ്ഥകൾ ചേർക്കാതെയും എല്ലാവർക്കും ബാധകമായ നേരിട്ടുള്ള ആജ്ഞകളായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് വ്യക്തിപരമായ ശത്രുക്കൾക്കു മാത്രമായി പരിമിതപ്പെടുത്തുക, അല്ലെങ്കിൽ അതിശയോക്തിയായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ബഹുവചന ആജ്ഞാരൂപങ്ങളാണുള്ളത്; അവയുടെ വ്യാപ്തിക്ക് വാക്യത്തിൽ പ്രത്യേക പരിമിതിയില്ല. അതിനാൽ പിന്നീടുള്ള വ്യാഖ്യാനവിവാദങ്ങൾ പരിഭാഷയിൽ തീർപ്പാക്കാതെ ആജ്ഞകളുടെ തീവ്രമായ ധാർമിക ശക്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ബഹുവചന ആജ്ഞകൾക്ക് സാധാരണ വായനയിൽ സ്വാഭാവികമായ ‘സ്നേഹിക്കുക’, ‘നന്മ ചെയ്യുക’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിലെ കോമ നിലനിർത്തി.
