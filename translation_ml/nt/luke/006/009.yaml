    issue: ‘തിന്മ ചെയ്യുന്നതോ’ is less contextually precise for κακοποιῆσαι.
    rationale: The verb can denote doing bad or harmful action. In this Sabbath-healing context, ‘ദോഷം ചെയ്യുക’ naturally communicates harm while retaining the ethical contrast with ‘നന്മ ചെയ്യുക’.
  - severity: low
    issue: ‘ഒരു ജീവൻ രക്ഷിക്കുന്നതോ’ can leave the object relation slightly less explicit in Malayalam.
    rationale: ‘ഒരു ജീവനെ രക്ഷിക്കുന്നതോ’ is idiomatic and clearly represents ψυχὴν as the object of both ‘save’ and ‘destroy’.
