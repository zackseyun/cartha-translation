id: LUK.6.9
reference: Luke 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരോടു പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു ചോദിക്കുന്നു: ശബ്ബത്തിൽ നന്മ ചെയ്യുന്നതോ ദോഷം ചെയ്യുന്നതോ[a], ഒരു ജീവനെ രക്ഷിക്കുന്നതോ നശിപ്പിക്കുന്നതോ[b]—ഏതാണ് നിയമാനുസൃതം?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദോഷം ചെയ്യുന്നതോ” എന്നതിന് “തിന്മ ചെയ്യുന്നതോ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ നന്മ ചെയ്യുന്നതും തിന്മയായ അഥവാ ദോഷകരമായ പ്രവൃത്തി ചെയ്യുന്നതും തമ്മിലുള്ള ധാർമ്മിക വൈരുധ്യം ഉണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: “ഒരു ജീവനെ രക്ഷിക്കുന്നതോ നശിപ്പിക്കുന്നതോ” എന്നതിന് “ഒരു ആത്മാവിനെ രക്ഷിക്കുന്നതോ നശിപ്പിക്കുന്നതോ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ സന്ദർഭം ഒരു വ്യക്തിയുടെ ജീവൻ സംരക്ഷിക്കുന്നതോ നശിപ്പിക്കുന്നതോ ആയതിനാൽ “ജീവൻ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ആഖ്യാനത്തിലെ മുന്നോട്ടുള്ള നീക്കത്തോടൊപ്പം, യേശുവും അവനെ നിരീക്ഷിച്ചിരുന്നവരും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: ഞാൻ നിങ്ങളോടു ചോദിക്കുന്നു
  rationale: നേരിട്ടുള്ള വെല്ലുവിളിയുടെ ഭാവം നിലനിർത്തുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: εἰ ἔξεστιν
  choice: ഏതാണ് നിയമാനുസൃതം?
  rationale: ശബ്ബത്താചരണത്തെക്കുറിച്ചുള്ള നിയമപരവും ധാർമ്മികവുമായ തർക്കഭാവം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ചോദ്യം സ്വാഭാവികമാക്കാൻ വാക്യാവസാനത്തിൽ വെച്ചു.
- source_word: τῷ σαββάτῳ
  choice: ശബ്ബത്തിൽ
  rationale: സമയസൂചക ദാതിവിന്റെ സംക്ഷിപ്തവും പതിവുമായ മലയാളരൂപം; ഇവിടെ ഉദ്ദേശിക്കുന്ന പ്രത്യേക വിശുദ്ധദിനം നിലനിർത്തുന്നു.
- source_word: ἀγαθοποιῆσαι
  choice: നന്മ ചെയ്യുന്നതോ
  rationale: κακοποιῆσαι എന്നതുമായ ധാർമ്മിക വൈരുധ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: κακοποιῆσαι
  choice: തിന്മ ചെയ്യുന്നതോ
  rationale: ഗ്രീക്കിലെ നന്മ–തിന്മ എന്ന ധാർമ്മിക ധ്രുവത വ്യക്തമായി സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ദോഷം ചെയ്യുക എന്ന അർഥവും ഉൾക്കൊള്ളുന്നു.
- source_word: ψυχὴν
  choice: ഒരു ജീവൻ
  rationale: ശബ്ബത്തിലെ സൗഖ്യപ്പെടുത്തൽസന്ദർഭത്തിൽ ഒരു വ്യക്തിയുടെ ജീവനെ രക്ഷിക്കുകയോ നശിപ്പിക്കുകയോ ചെയ്യുന്നതാണ് പ്രാഥമിക സൂചന; അമൂർത്തമായ ആത്മാവിനെ മാത്രം സൂചിപ്പിക്കുന്നില്ല.
- source_word: σῶσαι
  choice: രക്ഷിക്കുന്നതോ
  rationale: ജീവൻ കാത്തുസൂക്ഷിക്കുക എന്ന സന്ദർഭാർഥവും വിപുലമായ ബൈബിൾപദബന്ധവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: ἀπολέσαι
  choice: നശിപ്പിക്കുന്നതോ
  rationale: ‘രക്ഷിക്കുക’ എന്നതിനോടുള്ള ശക്തമായ വിപരീതത നിലനിർത്തുന്നു; ‘കൊല്ലുക’ എന്ന കൂടുതൽ ഇടുങ്ങിയ വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ψυχὴν σῶσαι ἢ ἀπολέσαι എന്നതിലെ ψυχήയുടെ അർഥം
  choice: “ഒരു ജീവൻ രക്ഷിക്കുന്നതോ നശിപ്പിക്കുന്നതോ”
  alternative: “ഒരു ആത്മാവിനെ രക്ഷിക്കുന്നതോ നശിപ്പിക്കുന്നതോ” / “ഒരു വ്യക്തിയെ രക്ഷിക്കുന്നതോ നശിപ്പിക്കുന്നതോ”
  rationale: ഉടൻ വരുന്ന ശബ്ബത്ത്-സൗഖ്യപ്പെടുത്തൽ സന്ദർഭം മനുഷ്യജീവനെ സംരക്ഷിക്കുന്നതും ഹാനിപ്പെടുത്തുന്നതുമാണ് മുന്നിൽ കൊണ്ടുവരുന്നത്. ഇതിനെ ആത്മാവിനെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തപ്രസ്താവനയായി മാറ്റാതെ ഗ്രീക്കിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തരമായ നന്മ/തിന്മ, രക്ഷിക്കുക/നശിപ്പിക്കുക എന്നീ വിരുദ്ധജോടികൾ നിലനിർത്തി. ചോദ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ “ഏതാണ് നിയമാനുസൃതം?” വാക്യാവസാനത്തിൽ നൽകിയിരിക്കുന്നു.
