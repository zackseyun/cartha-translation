id: LUK.6.36
reference: Luke 6:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: ml
  text: നിങ്ങളുടെ പിതാവ് കരുണയുള്ളവനായിരിക്കുന്നതുപോലെ, നിങ്ങളും കരുണയുള്ളവരായിരിക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മനസ്സലിവുള്ളവരായിരിക്കുക.’ ഗ്രീക്ക് വിശേഷണം മറ്റുള്ളവരുടെ ദുഃഖത്തിൽ മനസ്സലിഞ്ഞ് അവരോടു കരുണ കാണിക്കുന്നവരെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: ആയിരിക്കുക
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞയുടെ തുടർച്ചയായ ആഹ്വാനം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘ആയിത്തീരുക’ എന്നത് അനാവശ്യമായി ഒരു മുൻസ്ഥിതിയിൽനിന്നുള്ള മാറ്റം ഊന്നാം.
- source_word: οἰκτίρμονες / οἰκτίρμων
  choice: കരുണയുള്ളവർ / കരുണയുള്ളവൻ
  rationale: ദയ തോന്നുകയും അത് പ്രവൃത്തിയിൽ കാണിക്കുകയും ചെയ്യുന്ന സ്വഭാവം സൂചിപ്പിക്കുന്ന പദത്തിന് സ്വാഭാവികമായ സമാനത; വാക്യത്തിലെ രണ്ടു പ്രയോഗങ്ങൾക്കുമിടയിലെ പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: καθὼς
  choice: ആയിരിക്കുന്നതുപോലെ
  rationale: കാരണബന്ധമല്ല, താരതമ്യവും മാതൃകയും സൂചിപ്പിക്കുന്ന καθώς എന്നതിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: ὁ πατὴρ ὑμῶν
  choice: നിങ്ങളുടെ പിതാവ്
  rationale: മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘സ്വർഗീയ’ എന്ന വിശേഷണം ചേർക്കാതെ ബന്ധപരമായ നേരിട്ടുള്ള പ്രയോഗം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കല്പനയും പിതാവിന്റെ സ്വഭാവവും തമ്മിലുള്ള ബന്ധം
  choice: പിതാവിന്റെ കരുണയെ ശിഷ്യരുടെ പെരുമാറ്റത്തിനുള്ള മാതൃകയായി അവതരിപ്പിക്കുന്നു.
  alternative: പിതാവ് കരുണയുള്ളവനായതിനാൽ നിങ്ങളും കരുണയുള്ളവരായിരിക്കുക.
  rationale: καθὼς ഇവിടെ ‘ആയിരിക്കുന്നതുപോലെ’ എന്ന താരതമ്യാർഥമാണ് സ്വാഭാവികം; ‘ആയതിനാൽ’ എന്ന കാരണാർഥം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പിതാവിന്റെ ഗുണവും ശിഷ്യരോടുള്ള കല്പനയും തമ്മിലുള്ള ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
