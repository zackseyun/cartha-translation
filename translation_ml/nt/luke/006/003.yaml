id: LUK.6.3
reference: Luke 6:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν ὁ Ἰησοῦς· Οὐδὲ τοῦτο ἀνέγνωτε ὃ ἐποίησεν Δαυὶδ ⸀ὁπότε ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ ⸀ὄντες;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “ദാവീദും കൂടെയുണ്ടായിരുന്നവരും വിശന്നപ്പോൾ അവൻ ചെയ്തത് എന്തെന്ന് നിങ്ങൾ ഇതുപോലും വായിച്ചിട്ടില്ലേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും സമാപകക്രിയയും ചേർന്നുള്ള സാധാരണ കൊയ്നേ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ നൽകുന്നു.
- source_word: πρὸς αὐτούς
  choice: അവരോടു
  rationale: യേശുവിന്റെ മറുപടി ആരോടാണെന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Οὐδὲ τοῦτο ἀνέγνωτε
  choice: നിങ്ങൾ ഇതുപോലും വായിച്ചിട്ടില്ലേ?
  rationale: οὐδέയുടെ ഊന്നൽ ‘ഇതുപോലും’ എന്നതിലൂടെ നിലനിർത്തുകയും തിരുവെഴുത്തിനെക്കുറിച്ചുള്ള അറിവിനെ ചോദ്യം ചെയ്യുന്ന അലങ്കാരചോദ്യത്തിന്റെ ശക്തി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὃ ἐποίησεν Δαυίδ
  choice: ദാവീദ് ... ചെയ്തത് എന്തെന്ന്
  rationale: ഗ്രീക്കിലെ ബന്ധവാക്യത്തിന്റെ ഉള്ളടക്കം സ്വാഭാവികമായ മലയാള പരോക്ഷചോദ്യഘടനയിൽ നൽകുന്നു.
- source_word: ὁπότε ἐπείνασεν
  choice: വിശന്നപ്പോൾ
  rationale: സമയബന്ധവും πεινάωയുടെ സാധാരണ അർഥവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: ദാവീദും കൂടെയുണ്ടായിരുന്നവരും
  rationale: ദാവീദിനെയും അവനോടുകൂടെ ഉണ്ടായിരുന്നവരെയും ഒരുമിച്ച് വിശപ്പിന്റെ കർത്താക്കളായി വ്യക്തമാക്കുന്നു; ‘കൂട്ടാളികൾ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. അലങ്കാരചോദ്യത്തിന്റെ മൂർച്ചയും ‘ഇതുപോലും’ എന്ന ഊന്നലും നിലനിർത്തി; പദാനുപദ ആവർത്തനം ഒഴിവാക്കി.
