id: LUK.6.2
reference: Luke 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: ml
  text: 'എന്നാൽ പരീശന്മാരിൽ ചിലർ പറഞ്ഞു: “ശബ്ബത്തുനാളിൽ ചെയ്യാൻ അനുവദനീയമല്ലാത്തത് നിങ്ങൾ ചെയ്യുന്നത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: ചിലർ
  rationale: പരീശന്മാർ എല്ലാവരുമല്ല, അവരിൽ ഒരു വിഭാഗമാണെന്ന് സൂചിപ്പിക്കുന്ന അനിശ്ചിത ബഹുവചനത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ സംഭവത്തിൽനിന്ന് എതിർപ്പിലേക്കുള്ള നേരിയ വൈരുധ്യവും ആഖ്യാനമാറ്റവും പ്രകടമാക്കുന്നു.
- source_word: Φαρισαίων
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദമതവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: εἶπαν
  choice: പറഞ്ഞു
  rationale: ഏറിസ്റ്റ് ക്രിയാരൂപം സംസാരസംഭവത്തെ ലളിതമായി അവതരിപ്പിക്കുന്നു.
- source_word: Τί ποιεῖτε
  choice: നിങ്ങൾ ചെയ്യുന്നത് എന്തുകൊണ്ട്?
  rationale: Τί അക്ഷരാർഥത്തിൽ ‘എന്ത്’ ആണെങ്കിലും, ഇവിടെ ചോദ്യം പ്രവൃത്തിയുടെ കാരണം ചോദ്യംചെയ്യുന്ന വെല്ലുവിളിയാണ്; അതിനാൽ ‘എന്തുകൊണ്ട്’ എന്നത് സ്വാഭാവിക മലയാളം.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ചെയ്യാൻ അനുവദനീയമല്ലാത്തത്
  rationale: ശബ്ബത്താചരണവുമായി ബന്ധപ്പെട്ട അനുമതി/നിരോധനത്തിന്റെ നിയമ-മതപരമായ ഭാവം നിലനിർത്തുന്നു; ‘നിയമാനുസൃതമല്ലാത്തത്’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികം.
- source_word: τοῖς σάββασιν
  choice: ശബ്ബത്തുനാളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം ശബ്ബത്തിനെ സൂചിപ്പിക്കുന്ന സാധാരണ പ്രയോഗമാണ്; മലയാളത്തിൽ ഏകവചനപ്രയോഗമാണ് സ്വാഭാവികവും അർഥസുതാര്യവും.
theological_decisions:
- issue: ശബ്ബത്ത് പ്രയോഗത്തിന്റെ സംഖ്യ
  choice: ശബ്ബത്തുനാളിൽ
  alternative: ശബ്ബത്തുനാളുകളിൽ
  rationale: τοῖς σάββασιν രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും, സന്ദർഭത്തിൽ ഒരു ശബ്ബത്തുനാളിലെ പ്രവൃത്തിയെക്കുറിച്ചുള്ള സാധാരണ ഗ്രീക്ക് പ്രയോഗമാണിത്. മലയാളത്തിലെ അക്ഷരാർഥ ബഹുവചനം ആവർത്തിത ശബ്ബത്തുകളെക്കുറിച്ചാണെന്ന തെറ്റായ ധാരണ സൃഷ്ടിക്കാം; അതിനാൽ ഏകവചനം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ചോദ്യം കുറ്റപ്പെടുത്തലിന്റെ ഭാവം നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാപരമായ സാങ്കേതിക പദപ്രയോഗം ഒഴിവാക്കി.
