  to: എന്നാൽ, സമ്പന്നരായ നിങ്ങൾക്കു കഷ്ടം! കാരണം, നിങ്ങളുടെ ആശ്വാസം[b] നിങ്ങൾ കൈപ്പറ്റിയിരിക്കുന്നു.[a]
