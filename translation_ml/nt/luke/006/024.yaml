  text: πλὴν οὐαὶ ὑμῖν τοῖς πλουσίοις, ὅτι ἀπέχετε τὴν παράκλησιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: ml
  text: എന്നാൽ, സമ്പന്നരായ നിങ്ങൾക്കു കഷ്ടം! കാരണം, നിങ്ങളുടെ ആശ്വാസം[b] നിങ്ങൾ കൈപ്പറ്റിയിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ആശ്വാസം നിങ്ങൾ പൂർണമായി കൈപ്പറ്റിയിരിക്കുന്നു.” ഈ ക്രിയയ്ക്ക്, ലഭിക്കാനുള്ളത് മുഴുവനായി കൈപ്പറ്റുക എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സാന്ത്വനം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ അനുഗ്രഹപ്രഖ്യാപനങ്ങളോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐαὶ
  choice: അയ്യോ കഷ്ടം!
  rationale: വിലാപത്തിന്റെയും വിധിപ്രഖ്യാപനത്തിന്റെയും ഗൗരവമുള്ള പ്രവാചകശൈലി നിലനിർത്തുന്നു; വെറും സഹതാപപ്രകടനമായി ദുർബലമാക്കുന്നില്ല.
- source_word: ὑμῖν τοῖς πλουσίοις
  choice: സമ്പന്നരായ നിങ്ങൾക്ക്
  rationale: ഒരു വിഭാഗത്തെ രണ്ടാംപുരുഷത്തിൽ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ഗ്രീക്ക് ഘടന വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുന്നറിയിപ്പിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം തുറന്നും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπέχετε
  choice: കൈപ്പറ്റിക്കഴിഞ്ഞു
  rationale: വർത്തമാനകാലരൂപത്തിനുള്ള ‘ലഭിച്ചതായി കൈവശമുണ്ട്’ എന്ന നിലയും, ലഭിക്കാനുള്ളത് കൈപ്പറ്റിയെന്ന ഇടപാടുസംബന്ധിയായ സൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പൂർണമായി’ എന്ന കൂടുതൽ വ്യക്തമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παράκλησιν
  choice: ആശ്വാസം
  rationale: ഈ സന്ദർഭത്തിലെ comfort/consolation എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങൾക്കുള്ള
  rationale: സ്വത്തവകാശബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സമ്പന്നർക്കെതിരായ മുന്നറിയിപ്പിന്റെ സ്വഭാവം
  choice: സമ്പന്നരായവരെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ഗൗരവമുള്ള ‘അയ്യോ കഷ്ടം’ എന്ന പ്രഖ്യാപനം
  alternative: ‘അയ്യോ’ എന്ന മൃദുവായ വിലാപം മാത്രം; അല്ലെങ്കിൽ ‘സമ്പത്തിൽ ആശ്രയിക്കുന്നവർ’ എന്ന വിശദീകരണം ചേർക്കൽ
  rationale: ഗ്രീക്ക് പാഠം ‘സമ്പന്നരായ നിങ്ങൾ’ എന്ന് നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നു. അതിനാൽ വാക്യത്തിന്റെ കാഠിന്യം നിലനിർത്തുകയും, സമ്പത്തിൽ ആശ്രയിക്കുന്നതിനെക്കുറിച്ചോ ധാർമ്മിക കാരണത്തെക്കുറിച്ചോ പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതിരിക്കുകയും ചെയ്തു.
- issue: ἀπέχετε എന്ന ക്രിയയുടെ കാല-അർഥബലം
  choice: ‘കൈപ്പറ്റിക്കഴിഞ്ഞു’—ഇപ്പോൾ ലഭിച്ചുകഴിഞ്ഞ നിലയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം
  alternative: ‘കൈപ്പറ്റിക്കൊണ്ടിരിക്കുന്നു’; ‘പൂർണമായി കൈപ്പറ്റിയിരിക്കുന്നു’
  rationale: വർത്തമാനകാലരൂപം നിലവിലെ കൈവശാവസ്ഥയെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ ക്രിയയ്ക്ക് ലഭിക്കാനുള്ളത് മുഴുവനായി കൈപ്പറ്റിയെന്ന ഇടപാടുസംബന്ധിയായ അർഥവും ഉണ്ടാകാം. മുഖ്യപാഠം സ്വാഭാവികമായ മലയാളത്തിൽ ഈ രണ്ടിനും ഇടം നൽകുന്നു; കൂടുതൽ വ്യക്തമായ ‘പൂർണമായി’ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അയ്യോ കഷ്ടം’ എന്ന പ്രയോഗം പ്രവാചകവിധിയുടെ ശക്തി നിലനിർത്തുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് നേരിട്ട് ഗ്രഹിക്കാവുന്നതാണ്.
