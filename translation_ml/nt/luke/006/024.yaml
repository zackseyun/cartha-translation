review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the adversative πλὴν, the direct address to the rich, the causal ὅτι, and the idiomatic completed-receipt force available in ἀπέχετε. The main concern is that “അയ്യോ കഷ്ടം!” doubles two Malayalam expressions for the one Greek prophetic exclamation οὐαί and is not idiomatic in this construction.
  naturalness: “സമ്പന്നരായ നിങ്ങൾക്കു കഷ്ടം!” is direct, solemn, and natural modern Malayalam. “നിങ്ങളുടെ ആശ്വാസം നിങ്ങൾ കൈപ്പറ്റിയിരിക്കുന്നു” clearly conveys present possession/receipt without forcing the fuller ‘in full’ nuance into the main text.
  terminology: “സമ്പന്നരായ,” “ആശ്വാസം,” and the alternative “സാന്ത്വനം” are suitable. The revised wording retains the warning’s severity without adding an explanation about why wealth is condemned.
  issues:
  - severity: medium
    issue: “അയ്യോ കഷ്ടം!” is an awkward and redundant rendering of οὐαί.
    rationale: Greek has one prophetic woe formula. In Malayalam, “നിങ്ങൾക്കു കഷ്ടം!” naturally carries this judgment/woe force, whereas combining it with “അയ്യോ” sounds like a doubled exclamation and can weaken or blur the register.
