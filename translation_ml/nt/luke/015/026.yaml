  edition: SBLGNT
  text: καὶ προσκαλεσάμενος ἕνα τῶν παίδων ἐπυνθάνετο τί ⸀ἂν εἴη ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/026.yaml
  text: And calling one of the servants[a], he asked what these things might be.
translation:
  language: ml
  text: അവൻ വേലക്കാരിൽ ഒരാളെ അടുത്തേക്ക് വിളിച്ച്, ഇതെല്ലാം എന്തായിരിക്കാമെന്ന് ചോദിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇതിന്റെ അർഥം എന്തായിരിക്കാമെന്ന്.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “ഇതെല്ലാം എന്തായിരിക്കാമെന്ന്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: അടുത്തേക്ക് വിളിച്ച്
  rationale: മധ്യപ്രയോഗത്തിലുള്ള കർത്തരി ഭൂതകാല പങ്കാളിക്രിയ, ഒരാളെ തന്റെ അടുക്കലേക്ക് വിളിച്ചശേഷം ചോദിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘അടുത്തേക്ക് വിളിച്ച്’ ഈ ദിശാഭാവവും ക്രിയാക്രമവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: παίδων
  choice: വേലക്കാരിൽ
  rationale: παῖς എന്നതിന് ‘കുട്ടി’ എന്നും ‘വേലക്കാരൻ’ എന്നും അർഥമുണ്ടാകാം. ആഘോഷത്തെക്കുറിച്ച് അറിയാൻ വീട്ടിലുള്ള ഒരാളെ വിളിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘വേലക്കാരൻ’ ആണ് യോജിച്ചത്.
- source_word: ἐπυνθάνετο
  choice: ചോദിച്ചു
  rationale: അപൂർണഭൂതകാല മധ്യരൂപം അന്വേഷിച്ചറിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികമാണ്; ഇവിടെ പ്രവൃത്തിയുടെ തുടർച്ച പ്രത്യേകമായി മുൻനിറുത്തേണ്ടതില്ല.
- source_word: τί ἂν εἴη ταῦτα
  choice: ഇതെല്ലാം എന്തായിരിക്കാമെന്ന്
  rationale: ἄν സഹിതമുള്ള ആശ്രിതചോദ്യം സാധ്യതയുടെയോ അനിശ്ചിതത്വത്തിന്റെയോ ഭാവം നൽകുന്നു. ‘ഇതെല്ലാം എന്തായിരിക്കാമെന്ന്’ എന്നത് ബഹുവചനസൂചനയും ആ ഭാവവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഭൃത്യൻ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ള ‘വേലക്കാരൻ’ തിരഞ്ഞെടുത്തു; ഗ്രീക്കിലെ സാധ്യതാഭാവം ‘ആയിരിക്കാമെന്ന്’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
