  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: ml
  text: കാരണം, എന്റെ ഈ മകൻ മരിച്ചവനായിരുന്നു; അവൻ വീണ്ടും ജീവിച്ചു[a]. അവൻ നഷ്ടപ്പെട്ടവനായിരുന്നു; കണ്ടുകിട്ടി[b]. അവർ ആഘോഷിക്കാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീണ്ടും ജീവനിലേക്കു വന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കണ്ടെത്തപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: ആഘോഷത്തിന്റെ കാരണം പിതാവ് വിശദീകരിക്കുന്നതിനാൽ സ്വാഭാവികമായ കാരണസൂചകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: οὗτος ὁ υἱός μου
  choice: എന്റെ ഈ മകൻ
  rationale: οὗτος നൽകുന്ന ഊന്നലും പിതാവിന്റെ വ്യക്തിപരമായ ബന്ധവും സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: νεκρὸς ἦν
  choice: മരിച്ചവനായിരുന്നു
  rationale: വേർപാടിനെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗമാണെങ്കിലും, മൂലപാഠത്തിലെ ശക്തമായ മരണഭാഷ മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ἀνέζησεν
  choice: വീണ്ടും ജീവിച്ചു
  rationale: ‘വീണ്ടും ജീവിക്കുക’ എന്ന അടിസ്ഥാന അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; ഗ്രീക്കിലെ aorist ക്രിയയുടെ ഭൂതകാലരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: ἦν ἀπολωλὼς
  choice: നഷ്ടപ്പെട്ടവനായിരുന്നു
  rationale: ലൂക്കോസ് 15-ലെ നഷ്ടപ്പെടുക–കണ്ടുകിട്ടുക എന്ന ആവർത്തിത പ്രമേയം നിലനിർത്തുന്നു; നാശം എന്ന അതിശക്തമായ വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: εὑρέθη
  choice: കണ്ടുകിട്ടി
  rationale: കണ്ടെത്തിയ വ്യക്തിയെ വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തിന്റെ തുറന്ന നില സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: അവർ ആഘോഷിക്കാൻ തുടങ്ങി
  rationale: ἤρξαντο എന്ന ആരംഭഭാവം വ്യക്തമായി സൂക്ഷിക്കുകയും വിരുന്നിന്റെ പശ്ചാത്തലത്തിലുള്ള ആഹ്ലാദത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘മരിച്ചവൻ’, ‘വീണ്ടും ജീവിച്ചു’ എന്നീ പ്രയോഗങ്ങളുടെ രൂപകാത്മക ശക്തി
  choice: മൂലപാഠത്തിലെ മരണം–ജീവൻ ഭാഷ വ്യാഖ്യാനപരമായ വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: ‘ബന്ധം നഷ്ടപ്പെട്ടവനായിരുന്നു; വീണ്ടും ആത്മീയമായോ സാമൂഹികമായോ പുനഃസ്ഥാപിക്കപ്പെട്ടു’ എന്ന വിധത്തിൽ ആശയവിവർത്തനം ചെയ്യുക.
  rationale: കഥയിൽ ഈ ഭാഷ വേർപാടും പുനഃസ്ഥാപനവും രൂപകമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, പാഠം ഉദ്ദേശപൂർവം ശക്തമായ മരണം–ജീവൻ വൈരുധ്യം ഉപയോഗിക്കുന്നു; അത് പരിഭാഷയിൽ മയപ്പെടുത്തരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. വാക്യത്തിലെ മരണം–ജീവൻ, നഷ്ടപ്പെടുക–കണ്ടുകിട്ടുക എന്നീ സമാന്തര വൈരുധ്യങ്ങൾ സംരക്ഷിച്ചിട്ടുണ്ട്.
