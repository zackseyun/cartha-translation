id: LUK.15.2
reference: Luke 15:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: ml
  text: 'പരീശന്മാരും ശാസ്ത്രിമാരും ഇങ്ങനെ പിറുപിറുത്തുകൊണ്ടിരുന്നു: “ഇവൻ പാപികളെ സ്വീകരിക്കുന്നു[a]; അവരോടൊപ്പം ഭക്ഷണം കഴിക്കുകയും ചെയ്യുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പാപികളെ സ്വാഗതം ചെയ്യുകയും അവരോടൊപ്പം ഭക്ഷണം കഴിക്കുകയും ചെയ്യുന്നു.”
    reason: പ്രൊസ്ദെഖെതൈ (προσδέχεται) എന്നതിന് ‘സ്വീകരിക്കുന്നു’ എന്ന മുഖ്യവിവർത്തനത്തോടൊപ്പം ‘സ്വാഗതം ചെയ്യുന്നു’ എന്ന സ്വാഭാവികമായ ലാക്ഷണിക ബദൽ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: διεγόγγυζον
  choice: പിറുപിറുത്തുകൊണ്ട് ... പറഞ്ഞു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ പരാതിയെ സൂചിപ്പിക്കുന്നു. ‘പിറുപിറുക്കുക’ എന്നത് പരസ്യമായ പരാതി മാത്രമല്ല, അതൃപ്തിയോടെയുള്ള അടക്കംപറച്ചിലിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: പരീശന്മാരും ശാസ്ത്രിമാരും
  rationale: τε ... καί രണ്ടു കൂട്ടരെയും ചേർത്തു ഊന്നുന്നു; മലയാളത്തിലെ ‘-ഉം ... -ഉം’ ആ സഹബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. γραμματεῖς എന്നതിന് സുവിശേഷസന്ദർഭത്തിൽ പതിവായ ‘ശാസ്ത്രിമാർ’ ഉപയോഗിച്ചു.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞു
  rationale: മുഖ്യക്രിയയോടൊപ്പം നടക്കുന്ന സംസാരപ്രവർത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ധരണിഘടനയിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: Οὗτος
  choice: ഇവൻ
  rationale: സന്ദർഭത്തിലെ അകലംപാലിക്കുന്ന, അല്പം അവജ്ഞാസൂചകമായ ഭാവം ‘അവൻ’ എന്നതിനെക്കാൾ ‘ഇവൻ’ നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘മനുഷ്യൻ’ ചേർത്തിട്ടില്ല.
- source_word: ἁμαρτωλοὺς
  choice: പാപികളെ
  rationale: നാമവാചകമായി ഉപയോഗിച്ച വിശേഷണത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം; ആരോപണത്തിലെ സാമൂഹിക-മതപരമായ വിഭാഗീകരണം നിലനിർത്തുന്നു.
- source_word: προσδέχεται
  choice: സ്വീകരിക്കുകയും
  rationale: അനുകൂലമായി അടുക്കൽ അനുവദിച്ച് സ്വീകരിക്കുക എന്ന അർഥം നൽകുന്നു. ‘സ്വാഗതം ചെയ്യുന്നു’ സാധ്യമായിരുന്നാലും, ഇവിടെ ‘സ്വീകരിക്കുന്നു’ മൂലപദത്തിന്റെ വ്യാപ്തിയും ആരോപണത്തിന്റെ ഭാവവും കൂടുതൽ നിഷ്പക്ഷമായി നിലനിർത്തുന്നു.
- source_word: συνεσθίει αὐτοῖς
  choice: അവരോടൊപ്പം ഭക്ഷണം കഴിക്കുകയും ചെയ്യുന്നു
  rationale: കൂടെ ഭക്ഷിക്കുന്നതും അതിലൂടെ സൂചിപ്പിക്കപ്പെടുന്ന മേശക്കൂട്ടായ്മയും വ്യാഖ്യാനാത്മകമായ അധികവാക്കുകളില്ലാതെ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: പാപികളുമായുള്ള യേശുവിന്റെ സഹവാസത്തിന്റെയും ഒരുമിച്ചുള്ള ഭക്ഷണത്തിന്റെയും സാമൂഹിക-ദൈവശാസ്ത്രപരമായ ശക്തി
  choice: ആരോപണം ലഘൂകരിക്കാതെ, ‘പാപികളെ സ്വീകരിക്കുകയും അവരോടൊപ്പം ഭക്ഷണം കഴിക്കുകയും ചെയ്യുന്നു’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പാപികളെ സ്വാഗതം ചെയ്ത് അവരുമായി മേശക്കൂട്ടായ്മ പുലർത്തുന്നു’
  rationale: മൂലവാക്യം യേശുവിന്റെ സ്വീകരണത്തെയും കൂടെ ഭക്ഷിക്കുന്നതിനെയും കുറിച്ചുള്ള എതിർപ്പാണ് അവതരിപ്പിക്കുന്നത്. മേശക്കൂട്ടായ്മയുടെ സൂചന നിലനിൽക്കണം; എന്നാൽ ‘കൂട്ടായ്മ പുലർത്തുന്നു’ പോലുള്ള വ്യാഖ്യാനഭാഷ മൂലത്തിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഉദ്ധരണിഘടനയ്ക്കനുസരിച്ച് ക്രമപ്പെടുത്തി; ആവർത്തിച്ച പരാതി എന്ന അപൂർണ ഭൂതകാലഭാവം ‘പിറുപിറുത്തുകൊണ്ട് ... പറഞ്ഞു’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിച്ചു.
