revisions:
- from: പരീശന്മാരും ശാസ്ത്രിമാരും പിറുപിറുത്തുകൊണ്ട്, “ഇവൻ പാപികളെ സ്വീകരിക്കുകയും അവരോടൊപ്പം ഭക്ഷണം കഴിക്കുകയും ചെയ്യുന്നു” എന്നു പറഞ്ഞു.
  to: 'പരീശന്മാരും ശാസ്ത്രിമാരും ഇങ്ങനെ പിറുപിറുത്തുകൊണ്ടിരുന്നു: “ഇവൻ പാപികളെ സ്വീകരിക്കുന്നു[a]; അവരോടൊപ്പം ഭക്ഷണം കഴിക്കുകയും ചെയ്യുന്നു.”'
  rationale: The revision recasts the clause so that the imperfect grumbling is explicitly ongoing and the quotation supplies the content of that grumbling. It retains the original’s social-religious accusation without added interpretation, preserves the slightly derogatory demonstrative “ഇവൻ,” and supplies an anchored lexical-alternative note corresponding to the English POB audit trail.
