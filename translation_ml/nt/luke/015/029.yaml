reference: Luke 15:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പിതാവിനോട് ഉത്തരം പറഞ്ഞു: “നോക്കൂ, ഇത്രയും വർഷമായി ഞാൻ അങ്ങേക്കുവേണ്ടി അടിമപ്പണി ചെയ്തുവരുന്നു[a]. അങ്ങയുടെ ഒരു കല്പനപോലും ഞാൻ ഒരിക്കലും ലംഘിച്ചിട്ടില്ല. എന്നിട്ടും എന്റെ സുഹൃത്തുക്കളോടൊപ്പം ആഘോഷിക്കാൻ ഒരു കോലാട്ടിൻകുട്ടിയെപ്പോലും അങ്ങ് എനിക്കു തന്നിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സേവിച്ചുവരുന്നു.” ഗ്രീക്കിലെ δουλεύω എന്ന ക്രിയയ്ക്ക് “സേവിക്കുക” എന്നും കൂടുതൽ ശക്തമായ അർഥത്തിൽ “അടിമയായി സേവിക്കുക” എന്നും വരാം. ഇവിടെ മൂത്ത മകന്റെ കയ്പേറിയ പരാതിയുടെ ഭാവം പ്രകടമാക്കാൻ “അടിമപ്പണി ചെയ്തുവരുന്നു” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ഉത്തരം പറഞ്ഞു
  rationale: ‘ഉത്തരം പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി, ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പൂർണ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ἰδοὺ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും മൂത്ത മകന്റെ പരാതിയിലെ ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്ന ആധുനികവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: τοσαῦτα ἔτη
  choice: ഇത്രയും വർഷമായി
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന ദീർഘകാല സേവനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: δουλεύω σοι
  choice: അങ്ങേക്ക് അടിമപ്പണി ചെയ്തുവരുന്നു
  rationale: δουλεύω എന്ന പദത്തിലെ അധീനസേവനത്തിന്റെ ശക്തമായ ഭാവവും മൂത്ത മകന്റെ കയ്പേറിയ സ്വയംവിലയിരുത്തലും നിലനിർത്തുന്നു; ഇത് അവൻ യഥാർഥത്തിൽ അടിമയാണെന്ന വിവരണമായി നിർബന്ധമായി വായിക്കേണ്ടതില്ല.
- source_word: ἐντολήν σου παρῆλθον
  choice: അങ്ങയുടെ ഒരു കല്പനപോലും ... ലംഘിച്ചിട്ടില്ല
  rationale: കല്പന മറികടക്കുക അഥവാ അനുസരിക്കാതിരിക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔριφον
  choice: ഒരു കോലാട്ടിൻകുട്ടി
  rationale: യുവ ആടിനെ വ്യക്തമായി സൂചിപ്പിക്കുകയും മറ്റർഥങ്ങളിലേക്കുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: എന്റെ കൂട്ടുകാരോടൊപ്പം ആഘോഷിക്കാൻ
  rationale: വിരുന്നിന്റെ പശ്ചാത്തലത്തിലുള്ള ഉല്ലാസവും ഗ്രീക്ക് ഉദ്ദേശ്യവാക്യവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: മൂത്ത മകൻ ഉപയോഗിക്കുന്ന δουλεύω എന്ന പദത്തിന്റെ ശക്തി
  choice: അടിമപ്പണി ചെയ്തുവരുന്നു
  alternative: സേവിച്ചുവരുന്നു
  rationale: ഇവിടെ പദം ഒരു സിദ്ധാന്തപരമായ അടിമത്തപ്രഖ്യാപനമല്ല; പിതാവുമായുള്ള ബന്ധത്തെക്കുറിച്ചുള്ള മൂത്ത മകന്റെ കയ്പേറിയ ധാരണയാണ് വെളിപ്പെടുത്തുന്നത്. അതിനാൽ ശക്തമായ ഭാവം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, മൃദുവായ സാധ്യമായ വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യവും ഗൗരവമുള്ളതുമായ മലയാളം. പിതാവിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. പരാതിയുടെ തീവ്രത ‘നോക്കൂ’, ‘ഒരു ... പോലുമില്ല’, ‘അടിമപ്പണി’ എന്നീ പ്രയോഗങ്ങളിലൂടെ നിലനിർത്തി.
