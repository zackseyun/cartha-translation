  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτοὺς τὴν παραβολὴν ταύτην λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/003.yaml
  text: 'So he told them this parable[a], saying:'
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ അവരോട് ഈ ഉപമ പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγωയുടെ ഭൂതകാലരൂപം ഇവിടെ ഉപമ അവതരിപ്പിക്കുന്ന സംസാരക്രിയയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഉപമ പറഞ്ഞു’ എന്നത് സ്വാഭാവികവും മൂലത്തിന്റെ അർഥത്തോട് ചേർന്നതുമാണ്.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, മുൻസന്ദർഭത്തോട് ബന്ധിപ്പിക്കുന്ന മൃദുവായ ആഖ്യാനസംയോജകമാണ്. പരീശന്മാരുടെയും ശാസ്ത്രിമാരുടെയും പിറുപിറുപ്പിനോടുള്ള യേശുവിന്റെ പ്രതികരണത്തിലേക്കുള്ള മാറ്റം ‘അപ്പോൾ’ സ്വാഭാവികമായി കാണിക്കുന്നു.
- source_word: πρὸς αὐτούς
  choice: അവരോട്
  rationale: πρός + accusative അഭിസംബോധന ചെയ്യപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; അതിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപമാണ് ‘അവരോട്’.
- source_word: τὴν παραβολὴν ταύτην
  choice: ഈ ഉപമ
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ παραβολήയ്ക്ക് സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പദം ‘ഉപമ’ ആണ്; ταύτην എന്ന നിർദ്ദേശകത്തിന്റെ അർഥം ‘ഈ’ സംരക്ഷിക്കുന്നു.
- source_word: λέγων
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദുവിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: ഗ്രീക്കിലെ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന പങ്കാളിത്തരൂപം വരാനിരിക്കുന്ന വാക്കുകളെ അവതരിപ്പിക്കുന്നു. ‘പറഞ്ഞു:’ എന്ന മലയാളഘടനയിൽ അതേ പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ വേറൊരു ആവർത്തനക്രിയ ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ആവർത്തനാത്മകമായ ‘പറഞ്ഞു… പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന പദാനുപദമായി പകർത്താതെ, അതിന്റെ പ്രഭാഷണപരമായ പ്രവർത്തനം ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി നിലനിർത്തി.
