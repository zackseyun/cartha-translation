id: LUK.15.18
reference: Luke 15:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: ml
  text: 'ഞാൻ എഴുന്നേറ്റ് എന്റെ അപ്പന്റെ അടുത്തേക്കു പോകും. അദ്ദേഹത്തോട് പറയും: ‘അപ്പാ, ഞാൻ സ്വർഗത്തിനെതിരെയും അങ്ങയുടെ മുമ്പാകെയും പാപം ചെയ്തിരിക്കുന്നു.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: ഞാൻ എഴുന്നേറ്റ്
  rationale: പ്രധാന ഭാവിക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന aorist participle ആണ്. മലയാളത്തിൽ തുടർന്നുള്ള ഭാവിക്രിയയോടു ചേർത്ത് ‘ഞാൻ എഴുന്നേറ്റ് ... പോകും’ എന്നു പറയുന്നത് സ്വാഭാവികവും മൂലത്തിലെ പ്രവർത്തനക്രമം കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: πορεύσομαι
  choice: പോകും
  rationale: പിതാവിന്റെ അടുത്തേക്കുള്ള ചലനമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്. ‘പോകും’ ലളിതവും സ്വാഭാവികവും അധികമായ അർത്ഥനിറം ചേർക്കാത്തതുമാണ്.
- source_word: πρὸς τὸν πατέρα μου
  choice: എന്റെ അപ്പന്റെ അടുത്തേക്ക്
  rationale: πρός + accusative ഒരു വ്യക്തിയുടെ അടുക്കലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. കുടുംബബന്ധത്തിന്റെ ആത്മീയതയും മകന്റെ സംസാരശൈലിയും നിലനിർത്താൻ ‘അപ്പൻ’ സ്വീകരിച്ചു.
- source_word: ἐρῶ αὐτῷ
  choice: അദ്ദേഹത്തോട് ഇങ്ങനെ പറയും
  rationale: λέγωയുടെ ഭാവിരൂപവും ദത്തിവിലുള്ള പരോക്ഷ കർമവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. തുടർന്നുവരുന്ന ഉദ്ധരണിയിലേക്കുള്ള സ്വാഭാവിക പ്രവേശനത്തിനായി ‘ഇങ്ങനെ’ ചേർത്തു.
- source_word: Πάτερ
  choice: അപ്പാ
  rationale: ഇത് നേരിട്ടുള്ള സംബോധനയാണ്. ഗ്രീക്കിൽ പ്രത്യേകം possessive ഇല്ലാത്തതിനാൽ മലയാളത്തിലും ‘എന്റെ’ ചേർക്കാതെ സ്വാഭാവിക സംബോധനരൂപം ഉപയോഗിച്ചു.
- source_word: ἥμαρτον
  choice: പാപം ചെയ്തിരിക്കുന്നു
  rationale: Aorist രൂപം പൂർത്തിയായ പാപപ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ഇപ്പോഴത്തെ കുറ്റസമ്മതവുമായി അതിന്റെ പ്രസക്തി ബന്ധിപ്പിക്കാൻ മലയാളത്തിലെ perfect സ്വഭാവമുള്ള രൂപം യോജിക്കുന്നു.
- source_word: εἰς τὸν οὐρανὸν
  choice: സ്വർഗത്തിനെതിരെ
  rationale: εἰς ഇവിടെ പാപത്തിന്റെ ലക്ഷ്യത്തെ ‘എതിരെ’ എന്നു സൂചിപ്പിക്കുന്നു. ‘സ്വർഗം’ ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്ന പരോക്ഷപ്രയോഗമായിരിക്കാമെങ്കിലും മൂലപദം മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
- source_word: ἐνώπιόν σου
  choice: അങ്ങയുടെ മുമ്പാകെ
  rationale: ἐνώπιον എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ/ദൃഷ്ടിയിൽ’ എന്ന അർത്ഥം കാത്തുസൂക്ഷിക്കുന്നു. മുൻപത്തെ പ്രയോഗത്തോട് ലയിപ്പിച്ച് ‘അങ്ങയ്ക്കെതിരെ’ എന്നു വ്യാഖ്യാനിക്കുന്നതു ഒഴിവാക്കി.
theological_decisions:
- issue: ‘സ്വർഗം’ എന്നത് മുഖ്യവാചകത്തിൽ നേരിട്ട് ‘ദൈവം’ എന്നു വ്യാഖ്യാനിക്കണമോ
  choice: ‘സ്വർഗത്തിനെതിരെ’ എന്നു മൂലപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ദൈവത്തിനെതിരെ’
  rationale: οὐρανός ഇവിടെ ദൈവത്തെക്കുറിച്ചുള്ള ആദരപൂർവമായ പരോക്ഷസൂചനയായിരിക്കാം. എന്നിരുന്നാലും ‘സ്വർഗം’ എന്നു തന്നെ നിലനിർത്തുന്നത് മൂലഭാഷയിലെ പ്രയോഗവും അതിലെ വ്യാഖ്യാനസാധ്യതയും വായനക്കാരനു കാണാൻ ഇടയാക്കുന്നു.
- issue: ἐνώπιόν σου എന്നത് ‘അങ്ങയ്ക്കെതിരെ’ എന്നു സമാന്തരമാക്കണമോ
  choice: ‘അങ്ങയുടെ മുമ്പാകെ’ എന്നു വ്യത്യസ്തമായ മൂലവാചകം സംരക്ഷിച്ചു.
  alternative: ‘അങ്ങയ്ക്കെതിരെ’
  rationale: ‘അങ്ങയ്ക്കെതിരെ’ എന്നത് കുറ്റത്തിന്റെ ബന്ധപരമായ അർത്ഥം വ്യക്തമാക്കുമെങ്കിലും ἐνώπιον എന്ന പദത്തിന്റെ ‘സന്നിധിയിൽ/ദൃഷ്ടിയിൽ’ എന്ന സ്വതന്ത്രമായ അർത്ഥം മറച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കുടുംബസംസാരശൈലി സ്വീകരിച്ചു. പിതാവിനെക്കുറിച്ച് പറയുമ്പോൾ ‘അപ്പൻ’, നേരിട്ട് വിളിക്കുമ്പോൾ ‘അപ്പാ’ എന്നും, കുറ്റസമ്മതത്തിൽ മാന്യമായ രണ്ടാംപുരുഷരൂപമായ ‘അങ്ങ്’ എന്നും ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ട് വ്യത്യസ്ത പ്രയോഗങ്ങളായ εἰς τὸν οὐρανὸν, ἐνώπιόν σου എന്നിവ ഒന്നാക്കി ലയിപ്പിക്കാതെ സൂക്ഷിച്ചു.
