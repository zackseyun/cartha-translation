translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ആഖ്യാനക്രമവും അഭാവത്തിന്റെ ആരംഭവും നിലനിർത്തിയിട്ടുണ്ട്; സന്ദർഭത്തിൽനിന്നുള്ള അധിക നൈതിക വിലയിരുത്തൽ പദത്തിൽ ചേർത്തിട്ടില്ല.
