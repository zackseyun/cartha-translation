id: LUK.15.6
reference: Luke 15:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: ml
  text: 'അവൻ വീട്ടിലെത്തിയശേഷം[a] തന്റെ സുഹൃത്തുക്കളെയും അയൽക്കാരെയും വിളിച്ചുകൂട്ടുന്നു; അവരോടു പറയുന്നു: ‘എന്നോടൊപ്പം സന്തോഷിക്കുവിൻ[b]; കാരണം, കാണാതെപോയിരുന്ന എന്റെ ആടിനെ ഞാൻ കണ്ടെത്തിയിരിക്കുന്നു.’[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘വീട്ടിനകത്തേക്കു വന്നശേഷം.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘എന്റെ സന്തോഷത്തിൽ പങ്കുചേരുവിൻ’ അല്ലെങ്കിൽ ‘എന്നോടൊപ്പം ആഘോഷിക്കുവിൻ.’'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: ‘എന്റെ കാണാതെപോയ ആടിനെ ഞാൻ കണ്ടെത്തിയിരിക്കുന്നു.’ ഗ്രീക്കിൽ അക്ഷരാർഥം: ‘കാണാതെപോയിരുന്ന എന്റെ ആടിനെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: വീട്ടിലെത്തിയപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തെ കാലസൂചക ഉപവാക്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ‘വീട്ടിൽ വന്നപ്പോൾ’ എന്നതിനെക്കാൾ മലയാളത്തിൽ ഒഴുക്കുള്ളതും ‘വീട്ടിലേക്കു/വീട്ടിനകത്തേക്കു എത്തുക’ എന്ന ഗ്രീക്ക് ആശയം നിലനിർത്തുന്നതുമാണ്.
- source_word: συγκαλεῖ
  choice: വിളിച്ചുകൂട്ടി
  rationale: ഒരുമിച്ചു വരാൻ വിളിക്കുക എന്ന അർത്ഥം വ്യക്തമായി നൽകുന്നു; ആഘോഷസന്ദർഭത്തിൽ ‘വിളിച്ചുവരുത്തി’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: തന്റെ സുഹൃത്തുക്കളെയും അയൽക്കാരെയും
  rationale: രണ്ടു സമൂഹബന്ധങ്ങളെയും നേരിട്ട്, സാധാരണ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. സന്ദർഭം വ്യക്തമാക്കാൻ ‘തന്റെ’ ചേർത്തിരിക്കുന്നു.
- source_word: λέγων αὐτοῖς
  choice: അവരോട് പറയുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല പ്രധാനക്രിയയുടെയും കൃതന്തരൂപത്തിന്റെയും കഥനസജീവത മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Συγχάρητέ μοι
  choice: എന്നോടൊപ്പം സന്തോഷിക്കുവിൻ
  rationale: സന്തോഷം പങ്കിടാനുള്ള ബഹുവചന ആജ്ഞയെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; ആഘോഷം എന്ന ആശയം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: ὅτι
  choice: കാരണം
  rationale: ആജ്ഞയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധകത്തിന്റെ വ്യക്തമായ സമകാലിക തുല്യരൂപം.
- source_word: εὗρον
  choice: ഞാൻ കണ്ടെത്തിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ കണ്ടെത്തലിന്റെ ഇപ്പോഴത്തെ ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി എടുത്തുകാട്ടുന്നു.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: കാണാതെപോയിരുന്ന എന്റെ ആടിനെ
  rationale: പ്രത്യയം ചേർന്ന കൃതന്തത്തിന്റെ ‘നഷ്ടപ്പെട്ട നിലയിലായിരുന്ന ആട്’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും ‘നഷ്ടപ്പെട്ട’ എന്നത് ഉടമയ്ക്ക് ഉണ്ടായ നഷ്ടമെന്നോ നശിച്ചുപോയെന്നോ തെറ്റിദ്ധരിക്കപ്പെടാനുള്ള സാധ്യത കുറയ്ക്കുന്നു.
theological_decisions:
- issue: വീണ്ടുകിട്ടിയ ആടിന്റെ ഉപമാചിത്രം
  choice: കാണാതെപോയിരുന്ന എന്റെ ആട്
  alternative: എന്റെ നഷ്ടപ്പെട്ട ആട്
  rationale: വാക്യത്തിൽ തന്നേ ‘പാപി’, ‘രക്ഷ’ തുടങ്ങിയ വ്യാഖ്യാനപദങ്ങൾ ചേർക്കാതെ ഉപമയിലെ മൂർത്തമായ ആടിന്റെ ചിത്രം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ ‘എന്റെ ആട്—കാണാതെപോയിരുന്നത്’ എന്ന ഘടനയുടെ മുൻകാലാവസ്ഥയും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. നേരിട്ടുള്ള സംഭാഷണത്തിൽ ബഹുവചന ആജ്ഞയ്ക്കായി ‘സന്തോഷിക്കുവിൻ’ എന്ന തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച, എന്നാൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന രൂപം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
