  text: ὁ δὲ εἶπεν αὐτῷ ὅτι Ὁ ἀδελφός σου ἥκει, καὶ ἔθυσεν ὁ πατήρ σου τὸν μόσχον τὸν σιτευτόν, ὅτι ὑγιαίνοντα αὐτὸν ἀπέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “നിന്റെ സഹോദരൻ വന്നിരിക്കുന്നു. അവനെ സുഖമായും സുരക്ഷിതനായും തിരികെ ലഭിച്ചതുകൊണ്ട് നിന്റെ അപ്പൻ കൊഴുപ്പിച്ച കിടാവിനെ അറുത്തു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരോഗ്യവാനായി.” ὑγιαίνοντα എന്ന ഗ്രീക്ക് പദത്തിന് “ആരോഗ്യവാനായി ഇരിക്കുന്ന” എന്നും, ഈ സന്ദർഭത്തിൽ കൂടുതൽ വിശാലമായി, “സുഖമായും സുരക്ഷിതനായും ഇരിക്കുന്ന” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: വന്നിരിക്കുന്നു
  rationale: വരവ് സംഭവിച്ചുകഴിഞ്ഞെന്നും സഹോദരൻ ഇപ്പോൾ അവിടെയുണ്ടെന്നും സൂചിപ്പിക്കുന്ന ἥκωയുടെ സന്ദർഭോചിതമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔθυσεν
  choice: അറുത്തു
  rationale: വിരുന്നിനായി മൃഗത്തെ അറുക്കുന്നതാണ് ഇവിടെ ഉദ്ദേശ്യം; ഔപചാരിക യാഗം എന്ന ധ്വനി അനാവശ്യമായി വരാതിരിക്കാൻ ‘ബലിയർപ്പിച്ചു’ എന്നതിനു പകരം ‘അറുത്തു’ ഉപയോഗിച്ചു.
- source_word: μόσχον τὸν σιτευτόν
  choice: കൊഴുപ്പിച്ച കിടാവ്
  rationale: ആഘോഷവിരുന്നിനായി പ്രത്യേകം തീറ്റിപ്പോറ്റിയ മൃഗത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὑγιαίνοντα
  choice: സുഖമായിത്തന്നെ
  rationale: പങ്കാളി ആരോഗ്യത്തോടെയും കേടുപാടില്ലാതെയും മടങ്ങിയെത്തിയെന്ന വിശാലമായ സന്ദർഭാർഥം നൽകുന്നു; ‘ആരോഗ്യവാനായി’ എന്ന കൂടുതൽ ഇടുങ്ങിയ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀπέλαβεν
  choice: തിരികെ ലഭിച്ചു
  rationale: വിട്ടുപോയ മകനെ വീണ്ടും ലഭിച്ചതെന്ന പുനഃപ്രാപ്തിയുടെ അർഥം ἀπολαμβάνωയിൽ ഇവിടെ പ്രധാനമാണ്.
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: 'അവൻ അവനോടു പറഞ്ഞു:'
  rationale: δέ ഇവിടെ ലഘുവായ ബന്ധകമാണ്; ὅτι നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നതിനാൽ ഉദ്ധരണിയായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. കുടുംബസന്ദർഭത്തിന് യോജിച്ച ‘അപ്പൻ’ ഉപയോഗിച്ചു; പദശഃ കാഠിന്യം ഒഴിവാക്കിയെങ്കിലും മൂലത്തിലെ കാരണബന്ധവും പുനഃപ്രാപ്തിയുടെ സൂചനയും നിലനിർത്തി.
