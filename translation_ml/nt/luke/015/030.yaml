id: LUK.15.30
reference: Luke 15:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: ml
  text: എന്നാൽ അങ്ങയുടെ ജീവിതോപാധിയായ സ്വത്ത് വേശ്യകളോടൊപ്പം വിഴുങ്ങിക്കളഞ്ഞ ഈ മകൻ വന്നപ്പോൾ, അവനുവേണ്ടി കൊഴുപ്പിച്ച കിടാവിനെ അങ്ങ് അറുത്തല്ലോ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അങ്ങയുടെ സ്വത്ത് തിന്നുതീർത്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ അക്ഷരാർഥത്തിൽ ‘വിഴുങ്ങുക/തിന്നുതീർക്കുക’ എന്ന ശക്തമായ പ്രയോഗമാണ്; നാമത്തിന് ജീവിതോപാധി, സ്വത്ത്, കുടുംബസ്വത്ത് എന്നീ അർത്ഥങ്ങൾ ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: എന്നാൽ ... വന്നപ്പോൾ
  rationale: ὅτε എന്ന കാലസൂചനയും δέ നൽകുന്ന മൃദുവായ വൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ υἱός σου οὗτος
  choice: അങ്ങയുടെ ... ഈ മകൻ
  rationale: ‘എന്റെ സഹോദരൻ’ എന്നു പറയാതെ പിതാവിൽനിന്ന് അകറ്റിനിർത്തുന്ന മൂത്ത മകന്റെ നിന്ദാസൂചന demonstrative ആയ ‘ഈ’ വഴി സംരക്ഷിക്കുന്നു.
- source_word: ὁ καταφαγών
  choice: വിഴുങ്ങിക്കളഞ്ഞ
  rationale: κατεσθίω എന്ന ക്രിയയുടെ ശക്തവും ദൃശ്യവുമായ ‘തിന്നുതീർക്കുക/വിഴുങ്ങുക’ എന്ന രൂപകം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: σου τὸν βίον
  choice: അങ്ങയുടെ ഉപജീവനസ്വത്ത്
  rationale: ഇവിടെ βίος ജൈവജീവനെയല്ല, ജീവിതോപാധിയായ സ്വത്തോ സമ്പത്തോ സൂചിപ്പിക്കുന്നു; ‘ഉപജീവനസ്വത്ത്’ ആ അർത്ഥവ്യാപ്തി ചുരുക്കമായി നൽകുന്നു.
- source_word: μετὰ πορνῶν
  choice: വേശ്യകളോടൊപ്പം
  rationale: πόρνη എന്നതിന്റെ നേരിട്ടുള്ള, ആധുനികവും വ്യക്തവുമായ മലയാളരൂപം; മൂത്ത മകന്റെ ആരോപണം മൃദൂകരിക്കുന്നില്ല.
- source_word: ἦλθεν
  choice: വന്നപ്പോൾ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ലളിതമായ ‘വന്നു’ എന്ന അർത്ഥം മാത്രം നൽകുന്നു; സന്ദർഭത്തിൽ മടങ്ങിവരവാണെങ്കിലും ‘തിരിച്ചുവന്നു’ എന്ന് വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἔθυσας
  choice: അറുത്തല്ലോ
  rationale: വിരുന്നിനായി മൃഗത്തെ അറുക്കുന്നതാണ് സന്ദർഭം; ‘ബലിയർപ്പിച്ചു’ എന്ന ആരാധനാക്രമസൂചന ഒഴിവാക്കുന്നു. ‘-ല്ലോ’ പരാതിയുടെ ഊന്നൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸν σιτευτὸν μόσχον
  choice: കൊഴുപ്പിച്ച കിടാവിനെ
  rationale: പ്രത്യേക വിരുന്നിനായി തീറ്റകൊടുത്ത് കൊഴുപ്പിച്ച കിടാവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: αὐτῷ
  choice: അവനുവേണ്ടി
  rationale: 'ദാതൃവിഭക്തിയുടെ ഗുണഭോക്തൃസൂചന വ്യക്തമാക്കുന്നു: കിടാവിനെ അവന്റെ ബഹുമാനാർത്ഥം അറുത്തു.'
theological_decisions:
- issue: മൂത്ത മകന്റെ ആരോപണം സ്ഥിരീകരിക്കപ്പെട്ട വസ്തുതയായോ അവന്റെ ആരോപണമായോ അവതരിപ്പിക്കണമോ
  choice: പ്രധാനപാഠത്തിൽ യാതൊരു യോഗ്യതാപദവും ചേർക്കാതെ അവന്റെ ആരോപണം നേരിട്ട് നിലനിർത്തുന്നു.
  alternative: ‘വേശ്യകളോടൊപ്പം അങ്ങയുടെ സ്വത്ത് വിഴുങ്ങിക്കളഞ്ഞുവെന്ന് പറയപ്പെടുന്ന ഈ മകൻ’ എന്നിങ്ങനെ ആരോപണമാണെന്ന് തുറന്നുപറയുക.
  rationale: ഗ്രീക്ക് പാഠം ഇത് മൂത്ത മകന്റെ വാക്കുകളായാണ് നൽകുന്നത്; കഥാകൃത്ത് ഈ വിശദാംശം പ്രത്യേകം സ്ഥിരീകരിക്കുന്നില്ല. ‘എന്നു പറയപ്പെടുന്ന’ പോലുള്ള കൂട്ടിച്ചേർക്കൽ ഇല്ലാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നത് ആ കഥാപരമായ സംഘർഷവും അസ്പഷ്ടതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ മാന്യവും സ്വാഭാവികവുമായ ശൈലി. പിതാവിനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ച് ആദരസൂചനയും, ‘ഈ മകൻ’ എന്നതിലൂടെ മൂത്ത മകന്റെ വൈകാരിക അകലംപാലിക്കലും നിലനിർത്തി. പരാതിയുടെ വാചിക ഊന്നലിന് ‘അറുത്തല്ലോ’ ഉപയോഗിച്ചു.
