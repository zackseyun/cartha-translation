reference: Luke 15:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: ml
  text: “നിങ്ങളിൽ ഒരാൾക്ക് നൂറ് ആടുകളുണ്ടെന്നിരിക്കട്ടെ. അവയിൽ ഒന്ന് നഷ്ടപ്പെട്ടാൽ, അയാൾ തൊണ്ണൂറ്റൊൻപതിനെയും തുറസ്സായ പ്രദേശത്ത്[a] വിട്ടിട്ട്, നഷ്ടപ്പെട്ടതിനെ കണ്ടെത്തുന്നതുവരെ അതിന്റെ പിന്നാലെ പോകാതിരിക്കുമോ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിജനപ്രദേശത്ത്.” ഗ്രീക്ക് പദത്തിന് തുറസ്സായ നാട്ടിൻപുറം, മേച്ചിൽപ്രദേശം, വിജനസ്ഥലം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ഒരാൾ
  rationale: ഗ്രീക്കിലെ പ്രതിനിധാനപരമായ ഏകവചന ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ‘മനുഷ്യൻ’ എന്ന പദാനുപദ രൂപത്തെക്കാൾ ‘ഒരാൾ’ സാധാരണ മലയാളത്തിൽ ലിംഗനിരപേക്ഷമാക്കാനുള്ള സിദ്ധാന്തപരമായ ഇടപെടലല്ല, സ്വാഭാവികമായ പൊതുപ്രയോഗമാണ്.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: നൂറ് ആടുകളുണ്ടെന്നിരിക്കട്ടെ
  rationale: ἔχων എന്ന വർത്തമാന കൃദന്തത്തിന്റെ സാഹചര്യത്തെ മലയാളത്തിലെ സങ്കൽപ്പാത്മക ചോദ്യരീതിയിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: അവയിൽ ഒന്ന് നഷ്ടപ്പെട്ടാൽ
  rationale: ഒരു ആട് കൂട്ടത്തിൽനിന്ന് നഷ്ടമാകുന്ന സംഭവത്തെ വ്യക്തമാക്കുന്നു; ഇവിടെ ἀπόλλυμι നശിപ്പിക്കൽ എന്നല്ല, നഷ്ടപ്പെടൽ എന്ന അർഥത്തിലാണ്.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: തൊണ്ണൂറ്റൊൻപതിനെയും ... വിട്ടിട്ട് ... അന്വേഷിച്ചുപോകാതിരിക്കുമോ?
  rationale: οὐ ചേർന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന് പ്രതീക്ഷിക്കുന്ന ഉത്തരം ‘തീർച്ചയായും പോകും’ എന്നതാണ്; മലയാളത്തിലെ നിഷേധാത്മക അലങ്കാരചോദ്യം അതേ പ്രഭാവം നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: തുറസ്സായ പ്രദേശത്ത്
  rationale: ἔρημος ഇവിടെ വിജനപ്രദേശം, തുറസ്സായ നാട്ടിൻപുറം, മേച്ചിൽപ്രദേശം എന്നീ അർഥപരിധി വഹിക്കാം. ഇടയജീവിതത്തിന്റെ സാഹചര്യത്തിൽ ‘തുറസ്സായ പ്രദേശം’ സ്വാഭാവികവും അനാവശ്യമായി മരുഭൂമി സൂചിപ്പിക്കാത്തതുമാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: നഷ്ടപ്പെട്ടതിനെ ... അന്വേഷിച്ചുപോകുക
  rationale: ചലനത്തിന്റെ ലക്ഷ്യവും നഷ്ടപ്പെട്ട ആടിനെ തേടുന്ന ഉദ്ദേശ്യവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു. τὸ ἀπολωλός എന്ന നാമവൽക്കരിച്ച കൃദന്തത്തിന്റെ രൂപം ‘നഷ്ടപ്പെട്ടത്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἕως εὕρῃ αὐτό
  choice: അതിനെ കണ്ടെത്തുന്നതുവരെ
  rationale: തിരച്ചിൽ ആടിനെ കണ്ടെത്തുന്നതുവരെ തുടരുന്നു എന്ന കാലപരിധി കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ഉപമയിലെ പ്രതിനിധാനപരമായ പുരുഷ ഏകവചന പ്രയോഗം
  choice: ‘നിങ്ങളിൽ ഒരാൾ’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം
  alternative: ‘നിങ്ങളിൽ ഏതു മനുഷ്യൻ’ / ‘നിങ്ങളിൽ ഏതു പുരുഷൻ’
  rationale: ἄνθρωπος വ്യാകരണപരമായി പുരുഷലിംഗ ഏകവചനമായിരുന്നാലും ഇവിടെ ഒരു പ്രതിനിധാന ഉദാഹരണമാണ്. ‘ഒരാൾ’ എന്നത് ആ പൊതുവായ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘പുരുഷൻ’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ ഇല്ലാത്ത ലിംഗപരമായ നിയന്ത്രണം തോന്നാം.
- issue: തൊണ്ണൂറ്റൊൻപത് ആടുകളെ ἔρημος-ൽ വിടുന്നതിന്റെ സ്ഥലം
  choice: തുറസ്സായ പ്രദേശത്ത്
  alternative: വിജനപ്രദേശത്ത് / മരുഭൂമിയിൽ
  rationale: മൂലപദത്തിന്റെ അർഥവ്യാപ്തി സംരക്ഷിക്കുമ്പോൾ, ആടുകളെ തീർത്തും വാസയോഗ്യമല്ലാത്ത മരുഭൂമിയിൽ ഉപേക്ഷിച്ചുവെന്ന അനാവശ്യ നിഗമനം ഒഴിവാക്കുന്നു. ‘വിജനപ്രദേശം’ സാധുവായ മറ്റൊരു വായനയായി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നെങ്കിലും മാന്യമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം മലയാളത്തിലെ സ്വാഭാവിക സങ്കൽപ്പാത്മക അലങ്കാരചോദ്യമായി ക്രമപ്പെടുത്തി; ചോദ്യം പ്രതീക്ഷിക്കുന്ന അനുകൂല ഉത്തരത്തിന്റെ ശക്തി നിലനിർത്തി.
