id: LUK.15.21
reference: Luke 15:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: ml
  text: 'എന്നാൽ മകൻ അവനോടു പറഞ്ഞു: “പിതാവേ, ഞാൻ സ്വർഗത്തിനെതിരെയും അങ്ങയുടെ മുമ്പാകെയും പാപം ചെയ്തിരിക്കുന്നു.[a] ഇനി അങ്ങയുടെ മകൻ[b] എന്നു വിളിക്കപ്പെടാൻ ഞാൻ യോഗ്യനല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വർഗത്തിനെതിരെ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിൽ ‘സ്വർഗം’ ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്ന പരോക്ഷപ്രയോഗമാണ്; ചില പരിഭാഷകൾ ഇതിനെ വ്യാഖ്യാനപരമായി ‘ദൈവത്തിനെതിരെ’ എന്നു നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികൾ മകന്റെ വാക്കുകൾ, 19-ാം വാക്യത്തോടു യോജിക്കുന്നവിധം, ‘അങ്ങയുടെ കൂലിക്കാരിൽ ഒരാളെപ്പോലെ എന്നെ ആക്കണമേ’ എന്നതിന് തുല്യമായ വാക്കുകളോടെ തുടരുന്നു; SBLGNT പാഠത്തിൽ വാക്യം ‘അങ്ങയുടെ മകൻ’ എന്നിടത്ത് അവസാനിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: δέ മൃദുവായ ഒരു ബന്ധകമാണ്; പിതാവിന്റെ മുൻപ്രവൃത്തിക്കു പിന്നാലെയുള്ള മകന്റെ വാക്കുകളിലെ വിവരണപരമായ തിരിവ് സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘എന്നാൽ’ യോജിക്കുന്നു.
- source_word: ὁ υἱὸς αὐτῷ
  choice: മകൻ അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘മകൻ’ എന്നും ‘അവനോടു’ എന്നും ഉള്ള രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാണ്.
- source_word: Πάτερ
  choice: പിതാവേ
  rationale: വിളിവിഭക്തിയിലുള്ള πατήρ-ന്റെ നേരിട്ടുള്ള, ഗൗരവമുള്ള മലയാളരൂപം; മൂലത്തിൽ ഇല്ലാത്ത ‘എന്റെ’ ചേർക്കുന്നില്ല.
- source_word: ἥμαρτον
  choice: ഞാൻ ... പാപം ചെയ്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ കുറ്റസമ്മതത്തിനും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിക്കും സ്വാഭാവികമായ മലയാള പ്രയോഗം.
- source_word: εἰς τὸν οὐρανὸν
  choice: സ്വർഗത്തിനെതിരെ
  rationale: ദൈവത്തെ ആദരപൂർവം പരോക്ഷമായി സൂചിപ്പിക്കുന്ന യഹൂദപ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ മൂലരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: καὶ ἐνώπιόν σου
  choice: അങ്ങയുടെ മുമ്പാകെ
  rationale: ἐνώπιον എന്നതിന്റെ ‘സന്നിധിയിൽ/മുമ്പിൽ’ എന്ന ഭാവം സംരക്ഷിക്കുന്നു; ‘അങ്ങേക്കെതിരെ’ എന്ന വ്യാഖ്യാനപരമായ രൂപത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: οὐκέτι
  choice: ഇനി ... അല്ല
  rationale: ‘ഇനി മേലാൽ അല്ല’ എന്ന അർഥം സമകാലിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἄξιος
  choice: യോഗ്യൻ
  rationale: പശ്ചാത്താപത്തിന്റെ ധാർമികവും ബന്ധപരവുമായ സന്ദർഭത്തിൽ ‘worthy’ എന്ന ആശയം കൃത്യമായി നൽകുന്നു.
- source_word: κληθῆναι
  choice: വിളിക്കപ്പെടാൻ
  rationale: καλέω-യുടെ കർമണിപ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: υἱός σου
  choice: അങ്ങയുടെ മകൻ
  rationale: മകൻ എന്ന ബന്ധസ്ഥാനം താൻ വഹിക്കാൻ അയോഗ്യനാണെന്ന പ്രസ്താവന വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുറ്റസമ്മതത്തിലെ ‘സ്വർഗം’ എന്നതിന്റെ അർഥം
  choice: ദൈവത്തിനെതിരായ പാപത്തെ ആദരപൂർവം പരോക്ഷമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമായി മനസ്സിലാക്കുകയും മുഖ്യപാഠത്തിൽ ‘സ്വർഗത്തിനെതിരെ’ എന്നു തന്നെ പരിഭാഷപ്പെടുത്തുകയും ചെയ്തു.
  alternative: ‘ദൈവത്തിനെതിരെ’ എന്നു വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം ‘സ്വർഗം’ എന്നാണ് പറയുന്നത്. യഥാർഥ പ്രയോഗവും അതിലുള്ള പരോക്ഷതയും സംരക്ഷിച്ച് വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നതാണ് മൂലഭാഷാപ്രാമുഖ്യത്തിന് യോജിച്ചത്.
- issue: ഈ വാക്യത്തിലെ മകന്റെ പ്രസംഗത്തിന്റെ പരിധി
  choice: SBLGNT അനുസരിച്ച് ‘അങ്ങയുടെ മകൻ’ എന്നിടത്ത് മകന്റെ പ്രസ്താവന അവസാനിപ്പിച്ചു.
  alternative: ചില കൈയെഴുത്തുപ്രതികളിൽ കാണുന്നതുപോലെ ‘അങ്ങയുടെ കൂലിക്കാരിൽ ഒരാളെപ്പോലെ എന്നെ ആക്കണമേ’ എന്ന ആശയം ചേർക്കുക.
  rationale: നൽകിയിരിക്കുന്ന മൂലപാഠം പ്രസംഗം ഇവിടെ അവസാനിപ്പിക്കുന്നു. ദീർഘവായന മുഖ്യപാഠത്തിൽ ചേർക്കാതെ പാഠഭേദം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പിതാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ബഹുമാനസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ പരോക്ഷതയും പാഠഭേദവും പരിഹരിക്കാതെ സംരക്ഷിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
