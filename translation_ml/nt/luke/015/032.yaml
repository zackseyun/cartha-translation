  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വായനാസൗകര്യമുള്ളതുമാണ്. ‘ആഘോഷിക്കുകയും ആനന്ദിക്കുകയും’ എന്ന ഇരട്ടപ്രയോഗം മൂലത്തിലെ εὐφρανθῆναι καὶ χαρῆναι എന്ന ഊന്നൽ നഷ്ടപ്പെടുത്താതെ വിരുന്നുസന്ദർഭത്തിന് യോജിക്കുന്നു. ‘കണ്ടുകിട്ടി’ ഇവിടെ സ്വാഭാവികമായ അജ്ഞാതകർമണിസമാന പ്രയോഗമാണ്.
  terminology: ‘സഹോദരൻ,’ ‘മരിച്ചവൻ,’ ‘ജീവിച്ചു,’ ‘നഷ്ടപ്പെട്ടവൻ,’ ‘കണ്ടുകിട്ടി’ എന്നിവ സന്ദർഭത്തിന് യോജിച്ച, അനാവശ്യ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാത്ത തെരഞ്ഞെടുപ്പുകളാണ്. അടിക്കുറിപ്പുകളിലെ ഉചിതത്വം, അക്ഷരാർഥം, ‘കണ്ടെത്തപ്പെട്ടു’ എന്ന പകരം എന്നിവ ന്യായമായും ശരിയായ സ്ഥാനങ്ങളിലുമാണ്.
