id: LUK.15.32
reference: Luke 15:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: ml
  text: എന്നാൽ ആഘോഷിക്കുകയും ആനന്ദിക്കുകയും ചെയ്യേണ്ടതായിരുന്നു[a]. കാരണം, നിന്റെ ഈ സഹോദരൻ മരിച്ചവനായിരുന്നു, വീണ്ടും ജീവിച്ചു[b]; നഷ്ടപ്പെട്ടവനായിരുന്നു, കണ്ടുകിട്ടി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആഘോഷിക്കുകയും ആനന്ദിക്കുകയും ചെയ്യുന്നത് ഉചിതമായിരുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ജീവിച്ചു”; ഉപമയിൽ ഈ പ്രയോഗം പുനഃസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “കണ്ടെത്തപ്പെട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: ആഘോഷിക്കുക
  rationale: വിരുന്നിന്റെ പശ്ചാത്തലത്തിലുള്ള ഉല്ലാസത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഉല്ലസിക്കുക’ എന്നതിനെക്കാൾ സന്ദർഭോചിതമാണ്.
- source_word: χαρῆναι
  choice: ആനന്ദിക്കുക
  rationale: εὐφρανθῆναι എന്നതിനോടൊപ്പം വരുന്ന രണ്ടാമത്തെ സന്തോഷപ്രകടനം നിലനിർത്തുകയും ഗൗരവമുള്ളതും വായനാസൗകര്യമുള്ളതുമായ ഭാഷ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἔδει
  choice: ചെയ്യേണ്ടതായിരുന്നു
  rationale: ധാർമികമോ സാഹചര്യപരമോ ആയ ആവശ്യകത സൂചിപ്പിക്കുന്ന അപൂർണകാല ക്രിയയുടെ ബലം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത വ്യക്തമായ കർത്താവിനെ ചേർക്കുന്നില്ല.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: നിന്റെ ഈ സഹോദരൻ
  rationale: സർവനാമസംബന്ധവും ചൂണ്ടിക്കാണിക്കലും രണ്ടും നിലനിർത്തി, ബന്ധത്തെക്കുറിച്ചുള്ള പിതാവിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളക്രമത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: νεκρὸς ἦν
  choice: മരിച്ചവനായിരുന്നു
  rationale: ഉപമയിലെ പുനഃസ്ഥാപനസൂചന വിശദീകരിച്ച് ചേർക്കാതെ, മരണത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള രൂപകം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: ἔζησεν
  choice: വീണ്ടും ജീവിച്ചു
  rationale: ഗ്രീക്കിലെ ‘ജീവിച്ചു’ എന്ന ലളിതരൂപത്തെ ‘മരിച്ചവനായിരുന്നു’ എന്ന വിരുദ്ധപ്രയോഗത്തിന്റെ വെളിച്ചത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘വീണ്ടും’ പുനഃസ്ഥാപനത്തിന്റെ സന്ദർഭസൂചന വ്യക്തമാക്കുന്നു.
- source_word: ἀπολωλὼς
  choice: നഷ്ടപ്പെട്ടവനായിരുന്നു
  rationale: പൂർണകാല പങ്കുപദം സൂചിപ്പിക്കുന്ന നിലയെ പ്രകടമാക്കുന്നു; ‘നശിച്ചവൻ’ പോലുള്ള അതിശക്തമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: εὑρέθη
  choice: കണ്ടുകിട്ടി
  rationale: അജ്ഞാതകർമണിയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കണ്ടെത്തപ്പെട്ടതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സന്ദർഭത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: ἔζησεν എന്നതിന്റെ രൂപകാത്മകമായ പുനഃസ്ഥാപനാർഥം എത്രത്തോളം വ്യക്തമാക്കണം
  choice: ‘വീണ്ടും ജീവിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ജീവിച്ചു’ അല്ലെങ്കിൽ ‘ജീവനിലേക്കു മടങ്ങിവന്നു’
  rationale: മരണം–ജീവൻ എന്ന വാചകവിരുദ്ധത നിലനിർത്തുന്നു; അതേസമയം ഇതിനെ ഇവിടെ ശാരീരിക പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള വ്യക്തമായ സിദ്ധാന്തപ്രസ്താവനയായി വ്യാഖ്യാനിക്കുന്നില്ല.
- issue: ἔδει ആവശ്യകതയെയോ ഉചിതത്വത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ‘ചെയ്യേണ്ടതായിരുന്നു’ എന്ന ശക്തിയുള്ള രൂപം ഉപയോഗിച്ചു.
  alternative: ‘ചെയ്യുന്നത് ഉചിതമായിരുന്നു’
  rationale: മൂലത്തിലെ സാഹചര്യപരമോ ധാർമികമോ ആയ നിർബന്ധത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ഉചിതത്വം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ സമാന്തരമായ മരണം–ജീവൻ, നഷ്ടം–കണ്ടെത്തൽ എന്നീ വിരുദ്ധജോടികൾ നിലനിർത്തി; വ്യക്തമായ കർത്താവില്ലാത്ത ἔδει എന്ന പ്രയോഗത്തിൽ ‘നാം’ എന്നത് ചേർത്തിട്ടില്ല.
