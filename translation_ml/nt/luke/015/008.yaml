id: LUK.15.8
reference: Luke 15:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: ml
  text: പത്ത് ദ്രഹ്മകൾ[a] കൈവശമുള്ള ഒരു സ്ത്രീക്ക് അവയിൽ ഒന്ന് നഷ്ടപ്പെട്ടാൽ, അവൾ വിളക്കു കൊളുത്തി വീടു തൂത്തുവാരി, അതു കണ്ടെത്തുന്നതുവരെ ശ്രദ്ധയോടെ[b] തിരയാതിരിക്കുമോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ദ്രഹ്മ ഒരു ഗ്രീക്ക് വെള്ളിനാണയമായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘ശുഷ്കാന്തിയോടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻപത്തെ ഉപമയോടു സമാന്തരമായ അടുത്ത ഉദാഹരണത്തെ ബന്ധിപ്പിക്കുന്ന സംയോജകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: τίς γυνὴ
  choice: ഏതു സ്ത്രീയാണ്
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരപ്രശ്നം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘നിങ്ങളിൽ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: δραχμὰς
  choice: ദ്രഹ്മ
  rationale: പൊതുവായ ‘നാണയം’ എന്നു ലഘൂകരിക്കാതെ, ചരിത്രപരമായി നിർദിഷ്ടമായ ഗ്രീക്ക് വെള്ളിനാണയത്തിന്റെ പേര് നിലനിർത്തുന്നു.
- source_word: ἔχουσα δέκα
  choice: പത്തു ദ്രഹ്മ കൈവശമുള്ള
  rationale: സ്ത്രീയുടെ കൈവശമുള്ള പത്തു നാണയങ്ങളെന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐὰν ἀπολέσῃ
  choice: നഷ്ടപ്പെട്ടാൽ
  rationale: ἐάν സഹിതമുള്ള aorist subjunctive സൂചിപ്പിക്കുന്ന പൊതുവായ വ്യവസ്ഥ മലയാളത്തിലെ വ്യവസ്ഥാരൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δραχμὴν μίαν
  choice: ഒരു ദ്രഹ്മ
  rationale: നഷ്ടപ്പെട്ടത് ഒരൊറ്റ നാണയമാണെന്ന ഊന്നലും നിർദിഷ്ട നാണയനാമവും നിലനിർത്തുന്നു.
- source_word: οὐχὶ
  choice: അന്വേഷിക്കാതിരിക്കുക?
  rationale: ‘തീർച്ചയായും അന്വേഷിക്കും’ എന്ന അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരപ്രശ്നത്തിന്റെ രൂപം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἅπτει λύχνον
  choice: വിളക്കു കൊളുത്തി
  rationale: വിളക്ക് കത്തിക്കുക എന്ന സന്ദർഭോചിത അർഥം വ്യക്തമായ ആധുനിക പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: σαροῖ τὴν οἰκίαν
  choice: വീടു തൂത്തുവാരി
  rationale: വീടെന്ന ഗാർഹിക പശ്ചാത്തലവും സമഗ്രമായി തൂത്തുനോക്കുന്ന പ്രവൃത്തിയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ζητεῖ ἐπιμελῶς
  choice: ശ്രദ്ധാപൂർവം അന്വേഷിക്കുക
  rationale: ἐπιμελῶς എന്നതിലെ ശ്രദ്ധയുടെയും ശുഷ്കാന്തിയുടെയും ഭാവം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἕως οὗ εὕρῃ
  choice: അതു കണ്ടെത്തുന്നതുവരെ
  rationale: അന്വേഷണത്തിന്റെ അവസാനബിന്ദു വ്യക്തമാക്കുകയും സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന നഷ്ടപ്പെട്ട ദ്രഹ്മയെ ‘അതു’ എന്നു സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. അലങ്കാരപ്രശ്നത്തിന്റെ രൂപവും ചരിത്രപരമായ നാണയനാമവും നിലനിർത്തിയിരിക്കുന്നു; സാംസ്കാരികവും പദാർഥപരവുമായ വിശദീകരണങ്ങൾ അടിക്കുറിപ്പുകളിലാക്കി.
