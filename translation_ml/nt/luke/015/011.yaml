id: LUK.15.11
reference: Luke 15:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἶπεν δέ· Ἄνθρωπός τις εἶχεν δύο υἱούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/011.yaml
  text: Then he said[a], “A certain man had two sons.”
translation:
  language: ml
  text: 'പിന്നെ അദ്ദേഹം പറഞ്ഞു: “ഒരു മനുഷ്യന്[a] രണ്ടു പുത്രന്മാർ ഉണ്ടായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു പ്രത്യേക മനുഷ്യന് രണ്ടു പുത്രന്മാർ ഉണ്ടായിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ τις എന്ന അനിശ്ചിതപദം നേരിയ വ്യക്തിവൽക്കരണം നൽകുന്നുണ്ടെങ്കിലും മലയാളത്തിൽ സാധാരണയായി ‘ഒരു മനുഷ്യൻ’ എന്ന പ്രയോഗം അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: പിന്നെ അദ്ദേഹം പറഞ്ഞു
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, പ്രസംഗത്തിന്റെ തുടർച്ചയിലൊരു മാറ്റമാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘പിന്നെ’ എന്നു നൽകി. Εἶπεν എന്ന ഭൂതകാല ക്രിയ ‘പറഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Ἄνθρωπός τις
  choice: ഒരു മനുഷ്യൻ
  rationale: τις നൽകുന്ന അനിശ്ചിതത്വം മലയാളത്തിലെ ‘ഒരു’ സ്വാഭാവികമായി വഹിക്കുന്നു. ‘ഒരു പ്രത്യേക മനുഷ്യൻ’ എന്നു പറയുന്നത് സന്ദർഭത്തിൽ അനാവശ്യമായ ഊന്നൽ സൃഷ്ടിക്കാം.
- source_word: εἶχεν
  choice: ഉണ്ടായിരുന്നു
  rationale: പശ്ചാത്തലസാഹചര്യം വിവരിക്കുന്ന imperfect ക്രിയയ്ക്ക് മലയാളത്തിലെ ‘ഉണ്ടായിരുന്നു’ സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മത കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: δύο υἱούς
  choice: രണ്ടു പുത്രന്മാർ
  rationale: δύο എന്ന സംഖ്യ വ്യക്തമായി നിലനിർത്തി; υἱούς പുരുഷസന്താനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്, അതിനാൽ ലിംഗനിർദ്ദിഷ്ടമായ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: Ἄνθρωπός τις എന്ന പ്രയോഗത്തിന്റെ അനിശ്ചിതവും നേരിയ വ്യക്തിവൽക്കരണവുമുള്ള ഭാവം
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരു പ്രത്യേക മനുഷ്യൻ
  rationale: മലയാളത്തിൽ ‘ഒരു മനുഷ്യൻ’ എന്നത് ഉപമയിലെ തിരിച്ചറിയപ്പെടാത്ത കഥാപാത്രത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും τις-ന്റെ അനിശ്ചിതത്വം നിലനിർത്തുകയും ചെയ്യുന്നു. ‘പ്രത്യേക’ എന്നത് ഗ്രീക്കിലുള്ളതിലധികം പ്രാധാന്യമോ അസാധാരണത്വമോ സൂചിപ്പിക്കാം; പാഠത്തിൽ അധികമായ പ്രതീകവ്യാഖ്യാനം ചേർക്കാതിരിക്കാൻ അത് മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. യേശുവിനെ സൂചിപ്പിക്കുന്ന കർത്താവ് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അദ്ദേഹം’ ചേർത്തു. ‘മക്കൾ’ എന്ന ലിംഗനിരപേക്ഷ പദത്തിനു പകരം ഗ്രീക്കിലെ υἱούς കൃത്യമായി പ്രതിഫലിപ്പിക്കാൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു.
