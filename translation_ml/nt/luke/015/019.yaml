- from: ഇനി അങ്ങയുടെ മകൻ എന്നു വിളിക്കപ്പെടാൻ ഞാൻ യോഗ്യനല്ല. അങ്ങയുടെ കൂലിവേലക്കാരിൽ ഒരാളെപ്പോലെ എന്നെ ആക്കണമേ.[a]
  to: ഇനിമേൽ അങ്ങയുടെ മകൻ എന്നു വിളിക്കപ്പെടാൻ ഞാൻ യോഗ്യനല്ല. അങ്ങയുടെ കൂലിക്കാരിൽ ഒരാളെപ്പോലെ എന്നെ ആക്കണമേ.[a]
  rationale: The revision clarifies the temporal force of οὐκέτι with “ഇനിമേൽ” and substitutes the more idiomatic “കൂലിക്കാർ” for “കൂലിവേലക്കാർ.” It otherwise retains the draft’s faithful rendering of the son’s perceived unworthiness and his request to be made comparable to one hired worker.
