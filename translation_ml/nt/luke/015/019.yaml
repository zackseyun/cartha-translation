source:
  edition: SBLGNT
  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: ml
  text: ഇനിമേൽ അങ്ങയുടെ മകൻ എന്നു വിളിക്കപ്പെടാൻ ഞാൻ യോഗ്യനല്ല. അങ്ങയുടെ കൂലിക്കാരിൽ ഒരാളെപ്പോലെ എന്നെ ആക്കണമേ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അങ്ങയുടെ കൂലിവേലക്കാരിൽ ഒരാളെപ്പോലെ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം വീട്ടടിമകളെയല്ല, കൂലി ലഭിക്കുന്ന തൊഴിലാളികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: ഇനി ... അല്ല
  rationale: മുമ്പുണ്ടായിരുന്ന നില ഇപ്പോൾ ഇല്ലെന്ന കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἄξιος
  choice: യോഗ്യൻ
  rationale: പുത്രപദവിക്ക് താൻ അർഹനല്ലെന്ന ധാർമികവും സാമൂഹികവുമായ ബോധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: κληθῆναι
  choice: വിളിക്കപ്പെടാൻ
  rationale: καλέωയുടെ കർമണിപ്രയോഗവും ഒരുപദവിയിൽ അറിയപ്പെടുക എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: υἱός
  choice: മകൻ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനവും ഉപമയിലെ പിതൃപുത്രബന്ധവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ποίησόν με
  choice: എന്നെ ആക്കണമേ
  rationale: പുതിയൊരു നിലയിലാക്കണമെന്ന ആജ്ഞാരൂപ അഭ്യർഥനയെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: ὡς
  choice: ഒരാളെപ്പോലെ
  rationale: താദാത്മ്യത്തേക്കാൾ താരതമ്യമാണ് വാക്യത്തിൽ മുൻനിൽക്കുന്നത്; മലയാളത്തിൽ ഇത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἕνα τῶν μισθίων σου
  choice: അങ്ങയുടെ കൂലിവേലക്കാരിൽ ഒരാൾ
  rationale: μίσθιος വേതനം വാങ്ങുന്ന തൊഴിലാളിയെയാണ് സൂചിപ്പിക്കുന്നത്; വീട്ടടിമയെയോ അടിമദാസനെയോ അല്ല.
theological_decisions:
- issue: മകന്റെ ഏറ്റുപറച്ചിലിലെ പദവിയും അർഹതയും
  choice: “യോഗ്യനല്ല”, “മകൻ” എന്നീ പദങ്ങൾ മൃദൂകരിക്കാതെ നിലനിർത്തി.
  alternative: “അങ്ങയുടെ കുട്ടി എന്നു വിളിക്കപ്പെടാൻ ഞാൻ അർഹനല്ല”
  rationale: ഗ്രീക്ക് പാഠം പൊതുവായ ലജ്ജാബോധം മാത്രമല്ല, പുത്രപദവിക്ക് താൻ അയോഗ്യനാണെന്ന ബന്ധപരവും സാമൂഹികവുമായ ബോധമാണ് പ്രകടിപ്പിക്കുന്നത്; അതിൽ അധികമായ ഉപദേശനിഗമനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. പിതാവിനോടുള്ള ആദരസൂചകമായി “അങ്ങ്” ഉപയോഗിച്ചു; “കൂലിവേലക്കാരൻ” വേതനാധിഷ്ഠിത തൊഴിൽബന്ധം വ്യക്തമാക്കുന്നു.
