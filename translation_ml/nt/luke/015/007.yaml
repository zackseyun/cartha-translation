id: LUK.15.7
reference: Luke 15:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: ml
  text: '“ഞാൻ നിങ്ങളോടു പറയുന്നു: അതുപോലെതന്നെ,[a] മാനസാന്തരപ്പെടുന്ന ഒരു പാപിയെക്കുറിച്ച് സ്വർഗത്തിൽ ഉണ്ടാകുന്ന സന്തോഷം, മാനസാന്തരത്തിന്റെ ആവശ്യമില്ലാത്ത തൊണ്ണൂറ്റൊമ്പത് നീതിമാന്മാരുടെ കാര്യത്തിൽ[b] ഉണ്ടാകുന്ന സന്തോഷത്തെക്കാൾ കൂടുതലായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അങ്ങനെതന്നെ’ അല്ലെങ്കിൽ ‘ആ വിധത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പദം സ്വർഗത്തിലെ സന്തോഷത്തെ മുൻപുള്ള ഉപമയുടെ ആശയവുമായി ബന്ധിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: മൂലപാഠം ‘നീതിമാന്മാർ’ എന്നാണ് പറയുന്നത്. സന്ദർഭത്തിൽ ഇത് നേരായ അർഥത്തിലോ പരിഹാസസൂചനയോടെയോ വായിക്കാം; പരിഭാഷ ആ വ്യാഖ്യാനം തീർപ്പാക്കാതെ പദം അതേപടി നിലനിർത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും ഉറപ്പോടെയുള്ള പ്രഖ്യാപനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὕτως
  choice: അതുപോലെതന്നെ
  rationale: മുൻപുള്ള ഉപമയിലെ സന്തോഷത്തോടു സ്വർഗത്തിലെ സന്തോഷത്തെ ബന്ധിപ്പിക്കുന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: സ്വർഗത്തിൽ കൂടുതൽ സന്തോഷമുണ്ടാകും
  rationale: ഭാവികാലവും സന്തോഷത്തിന്റെ സ്ഥാനമായി സ്വർഗവും സംരക്ഷിക്കുന്നു. ἤ കൊണ്ടുവരുന്ന താരതമ്യം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘കൂടുതൽ’ ചേർത്തിരിക്കുന്നു.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: ഒരു പാപിയെക്കുറിച്ച്
  rationale: സന്തോഷത്തിന്റെ കാരണമോ വിഷയമോ സൂചിപ്പിക്കുന്ന ἐπίയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μετανοοῦντι
  choice: മാനസാന്തരപ്പെടുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ സജീവവും തുടരുന്നതുമായ ഭാവം നിലനിർത്തുകയും μετάνοια എന്ന ആശയം ചുരുക്കമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἢ
  choice: -നെക്കുറിച്ചുള്ളതിനെക്കാൾ
  rationale: ഇവിടെ ἤ താരതമ്യം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ‘-നെക്കാൾ’ ഘടന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: തൊണ്ണൂറ്റൊമ്പതു നീതിമാന്മാരെ
  rationale: വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് രൂപത്തെ മലയാളത്തിൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന നാമരൂപമായി നൽകുന്നു.
- source_word: οὐ χρείαν ἔχουσιν μετανοίας
  choice: മാനസാന്തരത്തിന്റെ ആവശ്യമില്ലാത്ത
  rationale: χρείαν ἔχειν കൂടിയുള്ള ജനിറ്റീവ് ഘടനയുടെ അർഥം നേരിട്ടും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘നീതിമാന്മാർ’ യഥാർഥത്തിൽ നീതിയുള്ളവരെയാണോ, സ്വയം നീതിമാന്മാരെന്നു കരുതുന്നവരെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ഗ്രീക്കിലെ ‘നീതിമാന്മാർ’ എന്ന പദം വ്യാഖ്യാനാത്മക മാറ്റമില്ലാതെ നിലനിർത്തി.
  alternative: ‘തങ്ങൾ നീതിമാന്മാരാണെന്നു കരുതുന്നവർ’ എന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം പരിഹാസം തുറന്നുപറയുന്നില്ല. സന്ദർഭം അത്തരം വായനയ്ക്ക് ഇടനൽകാമെങ്കിലും പരിഭാഷ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം തീർപ്പാക്കരുത്.
- issue: ‘സ്വർഗത്തിൽ’ എന്നതിൽ സന്തോഷിക്കുന്നവർ ആരാണ്
  choice: സന്തോഷത്തിന്റെ സ്ഥലം മാത്രമായി ‘സ്വർഗത്തിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവസന്നിധിയിൽ’ അല്ലെങ്കിൽ ‘സ്വർഗത്തിലെ ദൂതന്മാരുടെ ഇടയിൽ’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം സന്തോഷിക്കുന്ന കർത്താവിനെ വ്യക്തമായി പറയുന്നില്ല; ദൈവത്തെയോ ദൂതന്മാരെയോ കർത്താവായി ചേർക്കുന്നത് മൂലപാഠത്തെ അതിക്രമിക്കും.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മാനസാന്തരം’ സഭാപരമായ ഉപയോഗമുള്ള പദമാണെങ്കിലും μετάνοια/μετανοέω എന്ന ആവർത്തനത്തെ കൃത്യമായും ചുരുക്കമായും നിലനിർത്തുന്നതിനായി ഉപയോഗിച്ചു. താരതമ്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ഗ്രീക്കിൽ സൂചിതമായ ‘കൂടുതൽ’ മലയാളത്തിൽ വ്യക്തമാക്കി.
