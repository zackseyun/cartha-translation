id: LUK.15.22
reference: Luke 15:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: ml
  text: 'എന്നാൽ പിതാവ് തന്റെ അടിമകളോട്[a] പറഞ്ഞു: “വേഗം, ഏറ്റവും നല്ല മേലങ്കി[b] കൊണ്ടുവന്ന് അവനെ ധരിപ്പിക്കൂ; അവന്റെ കൈയിൽ ഒരു മോതിരം[c] അണിയിക്കുകയും കാലുകളിൽ ചെരിപ്പുകൾ ഇടുവിക്കുകയും ചെയ്യൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദാസന്മാരോട്’. ഗ്രീക്കിലെ doulous എന്ന പദം വീട്ടിലെ ബന്ധിത ദാസന്മാരെയോ അടിമകളെയോ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഒന്നാമത്തെ മേലങ്കി’; ഇവിടെ ‘ഏറ്റവും നല്ല’ അഥവാ ‘പ്രധാന’ മേലങ്കി എന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘ഒരു മോതിരം’ എന്നു മാത്രമാണ്. ഇത് പുനഃസ്ഥാപിക്കപ്പെട്ട സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന മുദ്രമോതിരമാണെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: അടിമകളോട്
  rationale: δοῦλος എന്ന പദം വീട്ടിലെ ബന്ധിത അടിമകളെ സൂചിപ്പിക്കുന്നു. ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ ‘അടിമകൾ’ അന്നത്തെ സാമൂഹിക യാഥാർഥ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ταχὺ
  choice: വേഗം
  rationale: ഉടൻ പ്രവർത്തിക്കണമെന്ന പിതാവിന്റെ തിടുക്കം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐξενέγκατε
  choice: കൊണ്ടുവന്ന്
  rationale: വീട്ടിലോ സംഭരണസ്ഥലത്തോ ഉള്ള വസ്ത്രം പുറത്തേക്കു കൊണ്ടുവരുന്നതാണ് സന്ദർഭത്തിലെ അർഥം; മലയാളവാക്യത്തിൽ ‘കൊണ്ടുവന്ന്’ സ്വാഭാവികമായി തുടർന്നുള്ള പ്രവൃത്തിയുമായി ചേരുന്നു.
- source_word: στολὴν τὴν πρώτην
  choice: ഏറ്റവും നല്ല മേലങ്കി
  rationale: πρώτην എന്നത് ഇവിടെ ക്രമത്തിലെ ‘ഒന്നാമത്തെ’ എന്നതിലുപരി ശ്രേഷ്ഠമായതോ പ്രധാനമായതോ എന്നു മനസ്സിലാക്കുന്നതാണ് സന്ദർഭോചിതം. στολή സാധാരണ വസ്ത്രമല്ല, നീളമുള്ള വിശിഷ്ട മേലങ്കിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐνδύσατε αὐτόν
  choice: അവനെ ധരിപ്പിക്കൂ
  rationale: അവനെ ആ മേലങ്കി അണിയിക്കുക എന്ന വ്യക്തമായ പ്രവൃത്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: δακτύλιον
  choice: ഒരു മോതിരം
  rationale: ഗ്രീക്ക് പദം മോതിരം എന്നു മാത്രമേ പറയുന്നുള്ളൂ; ‘മുദ്രമോതിരം’ എന്നു പ്രത്യേകീകരിക്കുന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനം ചേർക്കും.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: അവന്റെ കൈയിൽ … അണിയിക്കുകയും
  rationale: ആഭരണം കൈയിൽ ഇടുക എന്ന ആശയം മലയാളത്തിൽ ‘കൈയിൽ അണിയിക്കുക’ എന്നു സ്വാഭാവികമായി പറയുന്നു; ‘വിരലിൽ’ എന്നു വ്യക്തമാക്കാതെ χείρ എന്ന മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: ὑποδήματα
  choice: ചെരിപ്പുകൾ
  rationale: പുരാതന സന്ദർഭത്തിലെ കാലിൽ ധരിക്കുന്ന ചെരിപ്പുകളെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മലയാളത്തിൽ നൽകുന്നു; ‘പാദരക്ഷകൾ’ എന്നത് അനാവശ്യമായി ഔപചാരികമാണ്.
- source_word: εἰς τοὺς πόδας
  choice: കാലുകളിൽ … ഇടുവിക്കുകയും
  rationale: കാലിൽ ചെരിപ്പിടുക എന്ന ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മകന്റെ വാക്കുകളിൽനിന്ന് പിതാവിന്റെ പ്രതികരണത്തിലേക്കുള്ള ലഘുവായ വൈരുധ്യവും ആഖ്യാനമാറ്റവും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: δούλους എന്നത് ‘അടിമകൾ’ എന്നോ ‘ദാസന്മാർ’ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: അടിമകൾ
  alternative: ദാസന്മാർ
  rationale: ഈ വീട്ടുസന്ദർഭത്തിലും പദത്തിൽ അടങ്ങിയ ബന്ധിത സാമൂഹിക നില മായുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ അധിക അർഥം ചേർക്കാതെ ചരിത്രപരമായ യാഥാർഥ്യം ‘അടിമകൾ’ എന്ന പദം കൂടുതൽ കൃത്യമായി നിലനിർത്തുന്നു.
- issue: στολὴν τὴν πρώτην എന്നതിലെ πρώτην അക്ഷരാർഥത്തിൽ ‘ഒന്നാമത്തെ’ എന്നോ സന്ദർഭാർഥത്തിൽ ‘ഏറ്റവും നല്ല’ എന്നോ നൽകണോ
  choice: ഏറ്റവും നല്ല മേലങ്കി
  alternative: ഒന്നാമത്തെ മേലങ്കി / പ്രധാന മേലങ്കി
  rationale: വസ്ത്രത്തെക്കുറിച്ചുള്ള ഈ പ്രയോഗത്തിൽ ഗുണത്തിലോ സ്ഥാനത്തിലോ ശ്രേഷ്ഠമായത് എന്ന അർഥമാണ് കൂടുതൽ സ്വാഭാവികം. വസ്ത്രത്തിന്റെ പ്രതീകാർഥം മുഖ്യപാഠത്തിൽ വിശദീകരിക്കാതെ ഭാഷാപരമായ അർഥം മാത്രം നൽകുന്നു.
- issue: δακτύλιον എന്നത് ‘മോതിരം’ എന്നോ ‘മുദ്രമോതിരം’ എന്നോ നൽകണോ
  choice: ഒരു മോതിരം
  alternative: ഒരു മുദ്രമോതിരം
  rationale: മോതിരം പുനഃസ്ഥാപിക്കപ്പെട്ട സ്ഥാനത്തിന്റെയോ അധികാരത്തിന്റെയോ അടയാളമായിരിക്കാമെങ്കിലും മൂലപദം അതിനെ മുദ്രമോതിരം എന്നു നിർദിഷ്ടമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പിതാവിന്റെ തിടുക്കം ഹ്രസ്വമായ ആജ്ഞകളിലൂടെ നിലനിർത്തി. ചരിത്രപരമായ അടിമസ്ഥിതി മൃദൂകരിക്കാതിരിക്കാനായി ‘അടിമകൾ’ സ്വീകരിച്ചെങ്കിലും പരിചിതമായ ‘ദാസന്മാർ’ അടിക്കുറിപ്പിൽ നൽകി. മൂലപാഠം വ്യക്തമാക്കാത്ത പ്രതീകാത്മക അർഥങ്ങൾ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
