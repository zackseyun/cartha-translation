id: LUK.15.10
reference: Luke 15:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: ml
  text: അതുപോലെതന്നെ[a], മാനസാന്തരപ്പെടുന്ന ഒരു പാപിയെച്ചൊല്ലി ദൈവത്തിന്റെ ദൂതന്മാരുടെ സന്നിധിയിൽ ആനന്ദമുണ്ടാകുന്നു എന്നു ഞാൻ നിങ്ങളോടു പറയുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇങ്ങനെ” അല്ലെങ്കിൽ “അപ്രകാരം.”
    reason: lexical_alternative
  - marker: b
    text: “ദൈവത്തിന്റെ ദൂതന്മാരുടെ സന്നിധിയിൽ” എന്ന വാക്കുകൾ, ദൂതന്മാർ തന്നെയാണ് ആനന്ദിക്കുന്നതെന്ന് വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: അതുപോലെതന്നെ
  rationale: മുൻപുള്ള ഉപമയിൽനിന്നുള്ള താരതമ്യവും പ്രയോഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും ഊന്നലോടെയുള്ള സംക്രമണവും നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: γίνεται χαρά
  choice: ആനന്ദമുണ്ടാകുന്നു
  rationale: ആനന്ദം സംഭവിക്കുന്നു അഥവാ ഉളവാകുന്നു എന്ന γίνομαιയുടെ അർഥം അനാവശ്യമായ കാഠിന്യമില്ലാതെ നൽകുന്നു.
- source_word: ἐνώπιον
  choice: സന്നിധിയിൽ
  rationale: ഒരാളുടെ മുമ്പിൽ അഥവാ സാന്നിധ്യത്തിൽ എന്ന അർഥം നൽകുകയും ആരാണ് ആനന്ദിക്കുന്നതെന്ന് വാക്യത്തിൽ ചേർത്തുപറയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ദൂതന്മാരുടെ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടന നേരായും മാന്യമായും നിലനിർത്തുന്നു.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: ഒരു പാപിയെച്ചൊല്ലി
  rationale: ആനന്ദത്തിനുള്ള സന്ദർഭമോ കാരണമോ സൂചിപ്പിക്കുന്ന ἐπίയുടെ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: μετανοοῦντι
  choice: മാനസാന്തരപ്പെടുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ പ്രവർത്തനാത്മകത നിലനിർത്തുകയും പശ്ചാത്താപത്തിന്റെ ആശയം ഈ വാക്യത്തിനു പുറത്തുള്ള വിശദീകരണങ്ങളാൽ ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: μετανοοῦντι എന്ന മാനസാന്തരഭാഷയുടെ അർഥം
  choice: മാനസാന്തരപ്പെടുന്ന
  alternative: മനം മാറ്റുന്ന; തിരിഞ്ഞുവരുന്ന
  rationale: വാക്യം മാനസാന്തരത്തെ വിശദമായി നിർവചിക്കുന്നില്ല. സ്ഥാപിതമായ ബൈബിൾപദം അതിന്റെ വിശാലമായ ദൈവശാസ്ത്രാർഥം തുറന്നുവയ്ക്കുന്നു.
- issue: ആനന്ദത്തിന്റെ സ്ഥാനം അഥവാ കർത്താവ്
  choice: ദൈവത്തിന്റെ ദൂതന്മാരുടെ സന്നിധിയിൽ ആനന്ദമുണ്ടാകുന്നു
  alternative: ദൈവത്തിന്റെ ദൂതന്മാർ ആനന്ദിക്കുന്നു; ദൈവത്തിന്റെ ദൂതന്മാരുടെ ഇടയിൽ ആനന്ദമുണ്ടാകുന്നു
  rationale: ഗ്രീക്ക് വാചകം ആനന്ദം ദൂതന്മാരുടെ മുമ്പിൽ ഉണ്ടാകുന്നു എന്നാണ് പറയുന്നത്; ദൂതന്മാർ തന്നെയാണ് ആനന്ദിക്കുന്നതെന്ന് അത് വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ ആ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾശൈലി. “സന്നിധിയിൽ” എന്ന പദം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ അർഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നതുമാണ്; വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി ക്രമപ്പെടുത്തി.
