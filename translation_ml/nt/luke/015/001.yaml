- from: ചുങ്കം പിരിക്കുന്നവരും പാപികളും എല്ലാവരും അവന്റെ വാക്കു കേൾക്കാൻ അവന്റെ അടുക്കൽ വന്നുകൊണ്ടിരുന്നു[a].
  to: നികുതി പിരിക്കുന്നവരും പാപികളും എല്ലാവരും അവനെ കേൾക്കാൻ അവന്റെ അടുക്കൽ അടുത്തുകൊണ്ടിരുന്നു[a].
