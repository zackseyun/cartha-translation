  text: Ἦσαν δὲ ⸂αὐτῷ ἐγγίζοντες⸃ πάντες οἱ τελῶναι καὶ οἱ ἁμαρτωλοὶ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: ml
  text: നികുതി പിരിക്കുന്നവരും പാപികളും എല്ലാവരും അവനെ കേൾക്കാൻ അവന്റെ അടുക്കൽ അടുത്തുകൊണ്ടിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ അടുക്കൽ വന്നുകൊണ്ടിരുന്നു.’ ഗ്രീക്കിലെ ക്രിയാഘടന അവർ തുടർച്ചയായി അല്ലെങ്കിൽ ആവർത്തിച്ച് അടുത്തുവന്നിരുന്നതായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: വന്നുകൊണ്ടിരുന്നു എന്ന ക്രിയാരൂപത്തിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: Ἦσαν എന്ന അപൂർണഭൂതകാല സഹായക്രിയയും വർത്തമാനകാല കൃ​​ദന്തവും ചേർന്ന പരിപ്രാസപ്രയോഗം ഭൂതകാലത്തിലെ തുടർച്ചയായതോ ആവർത്തിച്ചിരുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. δέയുടെ മൃദുവായ സന്ദർഭമാറ്റം മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ സ്വാഭാവികമായി വിട്ടിരിക്കുന്നു.
- source_word: αὐτῷ ἐγγίζοντες
  choice: അവന്റെ അടുക്കൽ വന്നുകൊണ്ടിരുന്നു
  rationale: ἐγγίζωയുടെ ‘അടുത്തുവരുക’ എന്ന അർഥവും പരിപ്രാസഘടനയുടെ തുടർച്ചാ/ആവർത്തന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: രണ്ടു പരാമർശിത വിഭാഗങ്ങളെയും സമഗ്രമായി ഉൾക്കൊള്ളുന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: οἱ τελῶναι
  choice: ചുങ്കം പിരിക്കുന്നവർ
  rationale: റോമൻ ഭരണക്രമത്തിൽ നികുതിയോ ചുങ്കമോ പിരിച്ചിരുന്നവരെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം.
- source_word: οἱ ἁμαρτωλοὶ
  choice: പാപികൾ
  rationale: നാമവത്കരിച്ച വിശേഷണത്തിന്റെ നേരായ അർഥം നിലനിർത്തുന്നു; സാമൂഹികമോ നൈതികമോ ആയ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἀκούειν αὐτοῦ
  choice: അവന്റെ വാക്കു കേൾക്കാൻ
  rationale: ഇൻഫിനിറ്റീവ് ലക്ഷ്യം സൂചിപ്പിക്കുന്നു. ‘അവനെ കേൾക്കാൻ’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ മലയാളത്തിൽ അവന്റെ ഉപദേശം കേൾക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; ഉള്ളടക്കപരമായ വികസനം പരമാവധി ചുരുക്കിയിരിക്കുന്നു.
theological_decisions:
- issue: ‘ചുങ്കം പിരിക്കുന്നവരും പാപികളും’ എന്ന കൂട്ടുചേർക്കലിന്റെ സാമൂഹിക-മതപരമായ ശക്തി
  choice: രണ്ട് വിഭാഗങ്ങളെയും വ്യാഖ്യാനവികാസമില്ലാതെ അതേപടി നിലനിർത്തി.
  alternative: ചുങ്കം പിരിക്കുന്നവരും സമൂഹം തള്ളിപ്പറഞ്ഞ മറ്റുള്ളവരും / ചുങ്കം പിരിക്കുന്നവരും കുപ്രസിദ്ധ പാപികളും
  rationale: ഗ്രീക്ക് പാഠം രണ്ട് തിരിച്ചറിയാവുന്ന വിഭാഗങ്ങളെ മാത്രം പേരെടുത്തുപറയുന്നു. വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർത്താൽ ആഖ്യാനത്തിലെ സംഘർഷത്തെ മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നതായിത്തീരും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ചുങ്കം പിരിക്കുന്നവർ’ എന്ന പ്രയോഗം വ്യക്തതയ്ക്കായി ഉപയോഗിച്ചു; തുടർച്ചാ ഭാവം ‘വന്നുകൊണ്ടിരുന്നു’ എന്നതിൽ സംരക്ഷിച്ചു.
