id: LUK.15.17
reference: Luke 15:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: ml
  text: 'എന്നാൽ സുബോധം വന്നപ്പോൾ[a] അവൻ പറഞ്ഞു: “എന്റെ അപ്പന്റെ എത്രയോ കൂലിപ്പണിക്കാർക്ക് ആവശ്യത്തിലധികം അപ്പമുണ്ട്[b]; ഞാനോ ഇവിടെ വിശപ്പുകൊണ്ട് നശിച്ചുകൊണ്ടിരിക്കുന്നു[c]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവൻ തന്നിലേക്കു വന്നപ്പോൾ”; അഥവാ, “അവന് തിരിച്ചറിവുണ്ടായപ്പോൾ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മിച്ചംവരാൻ തക്ക അപ്പമുണ്ട്.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ഞാൻ വിശന്നുമരിക്കുകയാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: സുബോധം വന്നപ്പോൾ
  rationale: സ്വന്തം അവസ്ഥയെക്കുറിച്ചുള്ള തെളിഞ്ഞ ബോധത്തിലേക്കു മടങ്ങിവരുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷ. മൂലത്തിലെ ‘തന്നിലേക്കു വന്നു’ എന്ന ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἔφη
  choice: അവൻ പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ aorist ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായ ലളിത ഭൂതകാലമായി നൽകുന്നു.
- source_word: μίσθιοι
  choice: കൂലിപ്പണിക്കാർ
  rationale: വീട്ടിലെ അടിമകളെയല്ല, കൂലിക്ക് ജോലി ചെയ്യുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്; ആ വ്യത്യാസം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: περισσεύονται ἄρτων
  choice: ആവശ്യത്തിലധികം അപ്പമുണ്ട്
  rationale: പര്യാപ്തത മാത്രമല്ല, മിച്ചമാകുന്ന സമൃദ്ധിയും περισσεύονται വ്യക്തമാക്കുന്നു.
- source_word: ἄρτων
  choice: അപ്പം
  rationale: ‘ഭക്ഷണം’ എന്നു പൊതുവാക്കാതെ ഗ്രീക്കിലെ മൂർത്തമായ ‘അപ്പം’ നിലനിർത്തുന്നു.
- source_word: λιμῷ
  choice: വിശപ്പുകൊണ്ട്
  rationale: ഇവിടെ പൊതുവായ ക്ഷാമസാഹചര്യത്തേക്കാൾ വ്യക്തിയുടെ കടുത്ത വിശപ്പാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: അപ്പന്റെ വീട്ടിലെ സമൃദ്ധിയോടു പുത്രന്റെ ഇപ്പോഴത്തെ ദുരവസ്ഥയെ നേരിട്ട് വ്യത്യസ്തമാക്കുന്നു.
- source_word: ἀπόλλυμαι
  choice: നശിച്ചുകൊണ്ടിരിക്കുന്നു
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന നാശത്തെയോ മരണസന്നിഹിതാവസ്ഥയെയോ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു; അതിനെ നിർബന്ധമായി ശാരീരിക മരണമായി മാത്രം ചുരുക്കുന്നില്ല.
