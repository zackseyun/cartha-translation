translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അപ്പൻ’ ഉപമയിലെ കുടുംബബന്ധത്തിന്റെ അടുപ്പം നിലനിർത്തുന്നു; ‘കൂലിപ്പണിക്കാർ’ എന്നത് δοῦλοι എന്ന അടിമപ്പദവുമായി കലരാതിരിക്കാൻ തിരഞ്ഞെടുത്തു. ഉദ്ധരണിക്കുള്ളിലെ ശക്തമായ വിരോധം ‘ഞാനോ ഇവിടെ’ എന്ന ക്രമത്തിൽ സംരക്ഷിച്ചു.
