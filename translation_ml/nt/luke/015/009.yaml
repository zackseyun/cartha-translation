id: LUK.15.9
reference: Luke 15:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: ml
  text: 'അതു കണ്ടെത്തിയശേഷം അവൾ തന്റെ കൂട്ടുകാരികളെയും അയൽക്കാരികളെയും വിളിച്ചുകൂട്ടുന്നു, ഇങ്ങനെ പറയുന്നു: “ഞാൻ നഷ്ടപ്പെടുത്തിയ ദ്രഹ്മ[a] കണ്ടെത്തിയതുകൊണ്ട് എന്നോടൊപ്പം സന്തോഷിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ദ്രഹ്മ ഒരു ഗ്രീക്ക് വെള്ളിനാണയമായിരുന്നു; പല സാഹചര്യങ്ങളിലും അതിന്റെ മൂല്യം ഒരു തൊഴിലാളിയുടെ ഏകദേശം ഒരു ദിവസത്തെ കൂലിക്കു തുല്യമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: അതു കണ്ടെത്തിയശേഷം
  rationale: സ്ത്രീലിംഗ ഏകവചനത്തിലുള്ള ഭൂതകാല കൃദന്തരൂപം സ്ത്രീയെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള പ്രവൃത്തിക്കു മുമ്പുള്ള കണ്ടെത്തലിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. സന്ദർഭത്തിൽനിന്ന് നഷ്ടപ്പെട്ട നാണയത്തെ സൂചിപ്പിക്കുന്ന ‘അതു’ ചേർത്തു.
- source_word: συγκαλεῖ
  choice: വിളിച്ചുകൂട്ടി
  rationale: ആളുകളെ തന്റെ അടുക്കൽ ഒരുമിച്ചു വിളിക്കുന്ന സംയുക്തക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള വർത്തമാനകാലമായ ‘പറയുന്നു’ ആഖ്യാനത്തിന്റെ സജീവത നിലനിർത്തുന്നു.
- source_word: τὰς φίλας καὶ γείτονας
  choice: തന്റെ കൂട്ടുകാരികളെയും അയൽക്കാരികളെയും
  rationale: φίλας സ്ത്രീലിംഗ ബഹുവചനമാണ്; κοινമായ സ്ത്രീലിംഗ നിർദേശകപദത്തിന്റെ പരിധിയിലുള്ള γείτονας-ഉം ഇവിടെ സ്ത്രീകളായ അയൽക്കാരെ സൂചിപ്പിക്കുന്നു. ‘തന്റെ’ എന്നത് സാമൂഹികബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: λέγουσα
  choice: ഇങ്ങനെ പറയുന്നു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ സ്വാഭാവികവും സജീവവുമായ മലയാളരൂപം.
- source_word: Συγχάρητέ μοι
  choice: എന്നോടൊപ്പം സന്തോഷിക്കൂ
  rationale: ബഹുവചന ആജ്ഞാരൂപം തന്റെ സന്തോഷത്തിൽ മറ്റുള്ളവരും പങ്കുചേരണമെന്ന ആശയം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: കണ്ടെത്തിയതുകൊണ്ട്
  rationale: സന്തോഷിക്കാനുള്ള കാരണം വ്യക്തമാക്കുന്ന കാരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εὗρον
  choice: കണ്ടെത്തി
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഭൂതകാലക്രിയയെ ഉദ്ധരണിക്കുള്ളിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὴν δραχμὴν
  choice: ദ്രഹ്മ
  rationale: പൊതുവായി ‘നാണയം’ എന്നു മാറ്റാതെ ഗ്രീക്ക് നാണയത്തിന്റെ പ്രത്യേക പേര് നിലനിർത്തുന്നു; സാംസ്കാരികവിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἣν ἀπώλεσα
  choice: ഞാൻ നഷ്ടപ്പെടുത്തിയ
  rationale: ആ നാണയത്തെ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ നാമത്തിനു മുമ്പുള്ള കൃദന്തരൂപമായി സ്വാഭാവികമായി നൽകി; നഷ്ടത്തിന് സ്ത്രീ തന്നെയാണ് കർത്താവെന്നത് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രൂപങ്ങൾ ‘കൂട്ടുകാരികൾ’, ‘അയൽക്കാരികൾ’ എന്നിങ്ങനെ വ്യക്തമായി നിലനിർത്തി. ഉദ്ധരണിയിൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന പദക്രമം സ്വീകരിച്ചു.
