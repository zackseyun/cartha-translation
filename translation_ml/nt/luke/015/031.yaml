id: LUK.15.31
reference: Luke 15:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τέκνον, σὺ πάντοτε μετ’ ἐμοῦ εἶ, καὶ πάντα τὰ ἐμὰ σά ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “മകനേ[a], നീ എപ്പോഴും എന്നോടുകൂടെയുണ്ട്; എനിക്കുള്ളതെല്ലാം നിനക്കുള്ളതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കുഞ്ഞേ.” ഗ്രീക്കിലെ τέκνον സ്നേഹപൂർവമായ ഒരു കുടുംബവിളിയാണ്; സന്ദർഭത്തിൽ ഇത് മകനോടാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: കുഞ്ഞേ
  rationale: വിളിയുരൂപത്തിലുള്ള τέκνον സ്നേഹവും കുടുംബബന്ധവും പ്രകടമാക്കുന്ന ‘കുഞ്ഞ്’ എന്ന അർഥമാണ് നൽകുന്നത്. സന്ദർഭത്തിലെ വ്യക്തി പുരുഷനാണെങ്കിലും, ഗ്രീക്കിൽ υἱός (‘മകൻ’) അല്ലാത്തതിനാൽ ‘കുഞ്ഞേ’ എന്നത് മൂലപദത്തിന്റെ വിശാലതയും ആർദ്രതയും നിലനിർത്തുന്നു.
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: എല്ലാ സമയത്തും തുടരുന്ന സഹവാസത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടുകൂടെ
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന സഹവാസവും കൂട്ടായ്മയും നേരിട്ട് പകർന്നുനൽകുന്നു.
- source_word: πάντα τὰ ἐμὰ
  choice: എനിക്കുള്ളതെല്ലാം
  rationale: പിതാവിന്റേതായ സകല സ്വത്തും ഉൾക്കൊള്ളുന്ന സമഗ്രമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: σά ἐστιν
  choice: നിനക്കുള്ളതാണ്
  rationale: ‘നിന്റേതാണ്’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, നിയമപരമായ ഉടമസ്ഥതയാണോ ബന്ധപരമായ അവകാശമാണോ എന്ന് അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: അവൻ അവനോടു പറഞ്ഞു
  rationale: മൂലത്തിലെ സർവനാമങ്ങളെ നിലനിർത്തുന്നു; δέ ഇവിടെ നേരിയ തുടർച്ചയോ പ്രതികരണമോ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകമായ വൈരുധ്യബന്ധകം ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
theological_decisions:
- issue: പിതാവിന്റെ സ്നേഹപൂർവമായ കുടുംബവിളി
  choice: τέκνον എന്നത് ‘കുഞ്ഞേ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘മകനേ’
  rationale: ‘മകനേ’ എന്നത് സന്ദർഭത്തിൽ സ്വാഭാവികമാണെങ്കിലും, അത് ഗ്രീക്കിലെ τέκνον എന്നതിനെക്കാൾ വ്യക്തമായി പുരുഷലിംഗം അടയാളപ്പെടുത്തുന്നു. ‘കുഞ്ഞേ’ ബന്ധത്തിന്റെ ആർദ്രത സംരക്ഷിക്കുകയും മൂലപാഠത്തെ അനാവശ്യമായി കൂടുതൽ നിർദിഷ്ടമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. പിതാവിന്റെ ആർദ്രത നിലനിർത്തിയപ്പോൾ ഉടമസ്ഥതയുടെ നിയമപരമോ ദൈവശാസ്ത്രപരമോ ആയ വിശദീകരണം വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
