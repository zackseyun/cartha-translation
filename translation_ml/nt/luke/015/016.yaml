language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: ml
  text: പന്നികൾ തിന്നുകൊണ്ടിരുന്ന കരോബ് കായകൾകൊണ്ട് തന്റെ വയറു നിറയ്ക്കാൻ അവൻ കൊതിച്ചുകൊണ്ടിരുന്നു[a]; എന്നാൽ ആരും അവന് ഒന്നും കൊടുത്തുകൊണ്ടിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശിംബികൾ’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം മൃഗങ്ങൾക്ക് തീറ്റയായി സാധാരണ ഉപയോഗിച്ചിരുന്ന കരോബ് വൃക്ഷത്തിന്റെ കായകളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμει
  choice: കൊതിച്ചു
  rationale: അപൂർണകാല ക്രിയ സൂചിപ്പിക്കുന്ന തുടർന്നുനിന്ന ശക്തമായ ആഗ്രഹം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: γεμίσαι
  choice: നിറയ്ക്കാൻ
  rationale: ‘നിറയ്ക്കുക’ എന്ന മൂർത്തമായ ദൃശ്യഭാവം വ്യാഖ്യാനപരമായി ‘വിശപ്പടക്കുക’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: τὴν κοιλίαν αὐτοῦ
  choice: തന്റെ വയറു
  rationale: വിശപ്പിന്റെ ശാരീരിക കേന്ദ്രമായ വയറിനെ സാധാരണ ആധുനിക മലയാളത്തിൽ നേരിട്ട് സൂചിപ്പിക്കുന്നു; αὐτοῦ-യുടെ പ്രതിഫലനബന്ധം ‘തന്റെ’ വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ τῶν κερατίων
  choice: കരോബ് കായ്കൾകൊണ്ട്
  rationale: ἀπό ഇവിടെ നിറയ്ക്കുന്നതിനുള്ള വസ്തുവിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക ഉപകരണവിഭക്തി ഉപയോഗിച്ചു; സസ്യത്തിന്റെ പ്രത്യേക കായാണെന്ന് വ്യക്തമാക്കി.
- source_word: κερατίων
  choice: കരോബ് കായ്കൾ
  rationale: ഈ ഗ്രീക്ക് പദം മൃഗങ്ങൾക്ക് തീറ്റയായി ഉപയോഗിച്ചിരുന്ന കരോബ് വൃക്ഷത്തിന്റെ കായുറകളെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
- source_word: οἱ χοῖροι
  choice: പന്നികൾ
  rationale: സമകാലിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ തുല്യപദം.
- source_word: ἤσθιον
  choice: തിന്നുകൊണ്ടിരുന്ന
  rationale: അപൂർണകാലത്തിന്റെ നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിഭാവം പകർത്തുന്നു.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: ആരും അവന് ഒന്നും കൊടുത്തിരുന്നില്ല
  rationale: ἐδίδου-യുടെ അപൂർണകാലം തുടർന്നുനിന്ന ലഭ്യതയില്ലായ്മയായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർമം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒന്നും’ എന്നു ചേർത്തിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വിശപ്പിന്റെ മൂർത്തമായ ദൃശ്യഭാവവും രണ്ടു അപൂർണകാല ക്രിയകളുടെ തുടർച്ചാഭാവവും നിലനിർത്തി. ‘കരോബ്’ അപരിചിതമായേക്കുന്നതിനാൽ പ്രധാന പാഠത്തിൽ കായെന്ന് വ്യക്തമാക്കി, അടിക്കുറിപ്പിൽ കൂടുതൽ വിശദീകരിച്ചു.
