id: LUK.15.28
reference: Luke 15:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὠργίσθη δὲ καὶ οὐκ ἤθελεν εἰσελθεῖν. ὁ ⸀δὲ πατὴρ αὐτοῦ ἐξελθὼν παρεκάλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: ml
  text: എന്നാൽ അവൻ കോപിച്ചു; അകത്തേക്കു കടക്കാൻ മനസ്സില്ലായിരുന്നു.[a] അപ്പോൾ അവന്റെ അപ്പൻ പുറത്തുവന്ന് അവനോട് അപേക്ഷിച്ചുകൊണ്ടിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അകത്തേക്കു കടക്കാൻ ആഗ്രഹിച്ചില്ല’ അല്ലെങ്കിൽ ‘അകത്തേക്കു കടക്കാൻ വിസമ്മതിച്ചു.’
    reason: lexical_alternative
  - marker: b
    text: ‘അപേക്ഷിച്ചുകൊണ്ടിരുന്നു’ എന്നതിന് ‘പ്രേരിപ്പിച്ചുകൊണ്ടിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം; മൂലഭാഷയിലെ ക്രിയാരൂപം അഭ്യർഥന തുടർന്നുകൊണ്ടിരുന്നതായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: കോപിച്ചു
  rationale: ക്രിയ ഇവിടെ കോപം ഉണ്ടായതിനെ സൂചിപ്പിക്കുന്നു. ‘കോപിച്ചു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും ‘ക്രുദ്ധനായി’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് എളുപ്പവുമാണ്; അതേസമയം അതിരുകടന്ന രോഷം സൂചിപ്പിക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആഘോഷത്തോടും സന്തോഷത്തോടും ഉള്ള മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: അകത്തേക്കു കടക്കാൻ മനസ്സില്ലായിരുന്നു
  rationale: θέλω എന്ന ക്രിയയുടെ ഇച്ഛാസംബന്ധമായ അർഥം നിലനിർത്തുന്നു; ‘കടക്കാൻ വിസമ്മതിച്ചു’ എന്നു പറഞ്ഞ് പ്രകടമായ നിരാകരണം അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: അപ്പോൾ അവന്റെ അപ്പൻ
  rationale: രണ്ടാമത്തെ δέ പിതാവിന്റെ പ്രതികരണത്തിലേക്കുള്ള കഥാഗതിയെ അടയാളപ്പെടുത്തുന്നു. ‘അപ്പോൾ’ സ്വാഭാവികമായ തുടർച്ച നൽകുന്നു; ‘അപ്പൻ’ ഉപമയിലെ കുടുംബബന്ധത്തിന് അനുയോജ്യമായ സാധാരണവും മാന്യവുമായ പദമാണ്.
- source_word: ἐξελθὼν
  choice: പുറത്തുവന്ന്
  rationale: വീട്ടിനകത്തുനിന്ന് പുറത്തേക്കുള്ള ചലനം ചുരുക്കമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: παρεκάλει
  choice: അപേക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: παρακαλέωയുടെ ആത്മാർഥമായ അഭ്യർഥനയും അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചയായ പ്രവർത്തനവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു; ‘യാചിച്ചു’ എന്നത് ആവശ്യത്തിലധികം ശക്തമാണ്.
- source_word: αὐτόν
  choice: അവനോട്
  rationale: സർവനാമം മൂത്ത മകനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ക്രിയാപ്രയോഗത്തിന് അനുയോജ്യമായി ദത്തിവിഭക്തിയിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ പിതാവിന്റെ അഭ്യർഥനയുടെ ഭാവം
  choice: ‘അവനോട് അപേക്ഷിച്ചുകൊണ്ടിരുന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘അവനെ പ്രേരിപ്പിച്ചു’ / ‘അവനോട് യാചിച്ചു’
  rationale: പിതാവിന്റെ ആത്മാർഥവും തുടർച്ചയുള്ളതുമായ സമീപനം നിലനിർത്തുന്നു; അതിനെ ദുർബലമായ പ്രേരണയായോ അതിരുകടന്ന യാചനയായോ ചിത്രീകരിക്കാതെ, അധിക ഉപദേശാർഥം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ മാന്യമായ കഥനശൈലി. ‘മനസ്സില്ലായിരുന്നു’ ഇച്ഛയുടെ സൂക്ഷ്മതയും ‘അപേക്ഷിച്ചുകൊണ്ടിരുന്നു’ തുടർച്ചയായ അഭ്യർഥനയും സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാചകഘടകങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
