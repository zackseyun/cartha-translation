  terminology: “പിതാവ്,” “മനസ്സലിഞ്ഞ്,” “ഓടിച്ചെന്ന്,” and “കഴുത്തിൽ വീണ്” are suitable, dignified, and source-close. “സ്നേഹപൂർവം ചുംബിച്ചു” naturally communicates affectionate intensity, while the note safeguards the lexical alternative of repeated kissing.
  issues:
