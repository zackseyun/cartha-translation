source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: ml
  text: അവൻ എഴുന്നേറ്റ് തന്റെ പിതാവിന്റെ അടുക്കൽ ചെന്നു. അവൻ ഇനിയും ദൂരെയായിരിക്കെ, അവന്റെ പിതാവ് അവനെ കണ്ടു; മനസ്സലിഞ്ഞ് ഓടിച്ചെന്ന് അവന്റെ കഴുത്തിൽ വീണ് അവനെ സ്നേഹപൂർവം ചുംബിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്നേഹപൂർവം ചുംബിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് ക്രിയയ്ക്ക് വാത്സല്യത്തിന്റെ തീവ്രത സൂചിപ്പിക്കാം; ‘വീണ്ടുംവീണ്ടും ചുംബിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റ്
  rationale: പുത്രൻ ആദ്യം എഴുന്നേൽക്കുകയും തുടർന്ന് പിതാവിന്റെ അടുക്കൽ ചെല്ലുകയും ചെയ്യുന്ന ആഖ്യാനക്രമം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: തന്റെ പിതാവിന്റെ അടുക്കൽ ചെന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ ചലനാർഥവും ἑαυτοῦ എന്ന പ്രത്യയത്തിന്റെ പ്രതിഫലനബന്ധവും വ്യക്തമായി നൽകുന്നു.
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: എന്നാൽ അവൻ അപ്പോഴും ദൂരെയായിരിക്കുമ്പോൾത്തന്നെ
  rationale: പിതാവ് മകനെ കാണുമ്പോൾ അവൻ ഇനിയും അകലെയായിരുന്നു എന്ന സമകാലിക സാഹചര്യവും ἔτιയുടെ ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: ἐσπλαγχνίσθη
  choice: മനസ്സലിഞ്ഞ്
  rationale: ആഴത്തിലുള്ള ഉള്ളലിവും വികാരചലനവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സജീവവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δραμὼν
  choice: ഓടിച്ചെന്ന്
  rationale: ഓട്ടത്തെയും പിതാവ് മകന്റെ അടുത്തേക്ക് നീങ്ങുന്നതെയും ഒരുമിച്ച് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: അവന്റെ കഴുത്തിൽ വീണ്
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഉജ്ജ്വലമായ ദൃശ്യരൂപം നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘കൈകൾ ചുറ്റി’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: κατεφίλησεν
  choice: സ്നേഹപൂർവം ചുംബിച്ചു
  rationale: സംയുക്തക്രിയ സൂചിപ്പിക്കാവുന്ന വാത്സല്യത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു; എന്നാൽ ചുംബനം ആവർത്തിച്ചതായി നിർബന്ധിച്ച് നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: ഉപമയിലെ പിതാവിന്റെ കരുണയുടെ ചിത്രീകരണം
  choice: പിതാവിന്റെ വികാരവും മുൻകൈയും ശക്തമായ ആഖ്യാനഭാഷയിൽ നിലനിർത്തുക
  alternative: പിതാവ് ദൈവത്തെ പ്രതിനിധീകരിക്കുന്നു എന്ന് വിവർത്തനത്തിൽ തന്നെ വിശദീകരിക്കുക
  rationale: വാക്യം പിതാവിന്റെ ആഴമുള്ള കരുണയും മകന്റെ അടുത്തേക്ക് ഓടിയെത്തുന്ന മുൻകൈയും വരച്ചുകാട്ടുന്നു. ഈ ശക്തി സംരക്ഷിക്കുമ്പോഴും ഉപമയുടെ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം മൂലവാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പിതാവ്’ എന്ന പദം ഉപമയുടെ ഗൗരവം നിലനിർത്തുന്നു; ‘മനസ്സലിഞ്ഞ്’ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ മൂലത്തിലെ ആഴമുള്ള കരുണയും പ്രകടമാക്കുന്നു.
