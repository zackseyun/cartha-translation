  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀φέρετε τὸν μόσχον τὸν σιτευτόν, θύσατε, καὶ φαγόντες εὐφρανθῶμεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/023.yaml
  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: ml
  text: കൊഴുപ്പിച്ച കാളക്കുട്ടിയെ കൊണ്ടുവന്ന് അതിനെ അറുക്കുക[a]. നമുക്ക് ഭക്ഷിച്ച് ആഘോഷിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിനെ ബലിയർപ്പിക്കുക.” മൃഗത്തെ അറുക്കുക എന്ന അർഥമുള്ള ഗ്രീക്ക് ക്രിയയ്ക്ക് ചില സന്ദർഭങ്ങളിൽ യാഗസംബന്ധമായ അർഥവും ഉണ്ടാകാം.
    reason: θύσατε എന്ന പദത്തിന്റെ യാഗസംബന്ധമായ മറ്റർഥസാധ്യത സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: φέρετε
  choice: കൊണ്ടുവന്ന്
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ തുടർന്നുവരുന്ന ‘അറുക്കുക’ എന്ന ആജ്ഞയോട് ബന്ധിപ്പിക്കുന്നു; ‘ഇങ്ങോട്ട്’ എന്ന ആശയം ഗ്രീക്കിൽ നിർബന്ധമായി വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: μόσχον τὸν σιτευτόν
  choice: കൊഴുപ്പിച്ച കാളക്കുട്ടി
  rationale: μόσχος ഇളം കന്നുകാലിയെയും σιτευτός പ്രത്യേക അവസരത്തിനായി തീറ്റകൊടുത്തു കൊഴുപ്പിച്ചതിനെയും സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം വിരുന്നിനായി ഒരുക്കിവച്ച മൃഗം എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: θύσατε
  choice: അതിനെ അറുക്കുക
  rationale: θύω യാഗമായി ബലികഴിക്കുക എന്ന അർഥത്തിലും മൃഗത്തെ അറുക്കുക എന്ന അർഥത്തിലും വരാം. ഇവിടെ വീട്ടിലെ വിരുന്നൊരുക്കമാണ് സമീപസന്ദർഭം; അതിനാൽ അനാവശ്യമായ ആചാരപരമായ അർഥം അടിച്ചേൽപ്പിക്കാതെ ‘അറുക്കുക’ എന്നു നൽകി, മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: φαγόντες
  choice: ഭക്ഷിച്ച്
  rationale: പദശഃ ‘ഭക്ഷിച്ചിട്ട്/ഭക്ഷിച്ചശേഷം’ എന്ന പങ്കുപദരൂപമാണെങ്കിലും, εὐφρανθῶμεν-നോട് ചേർന്ന പ്രവർത്തനമായി ‘ഭക്ഷിച്ച് ആഘോഷിക്കാം’ എന്നത് സ്വാഭാവികവും അർഥവിശ്വസ്തവുമാണ്.
- source_word: εὐφρανθῶμεν
  choice: നമുക്ക് ആഘോഷിക്കാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന പ്രേരണാസൂചക രൂപം സന്തോഷിക്കുകയോ ആഘോഷിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. വിരുന്നിന്റെ സന്ദർഭത്തിൽ ‘ആഘോഷിക്കാം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: καὶ ... καὶ
  choice: -ഉം/തുടർച്ചയായ വാക്യബന്ധവും
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ച καί ആജ്ഞകളെയും അവസാനത്തെ ആഹ്വാനത്തെയും ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിലെ ക്രിയാവിന്യാസവും ‘ഭക്ഷിച്ച്’ എന്ന ബന്ധരൂപവും ഈ തുടർച്ച സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: θύσατε എന്ന പദത്തിലെ സാധ്യതയുള്ള യാഗാർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘അതിനെ അറുക്കുക’
  alternative: ‘അതിനെ ബലിയർപ്പിക്കുക’ / ‘അതിനെ യാഗമായി അറുക്കുക’
  rationale: പിതാവിന്റെ വീട്ടിലെ കൂട്ടായ വിരുന്നിനായി മൃഗത്തെ ഒരുക്കുന്നതാണ് കഥാസന്ദർഭത്തിലെ മുൻനിര അർഥം. ‘ബലിയർപ്പിക്കുക’ എന്നു പ്രധാനവാചകത്തിൽ നൽകിയാൽ വ്യക്തമല്ലാത്ത ആരാധനാചാരപരമായ ദൈവശാസ്ത്രം ഇറക്കുമതി ചെയ്യാം. എങ്കിലും ഗ്രീക്ക് ക്രിയയുടെ യാഗസംബന്ധമായ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപവും കൂട്ടായ ആഹ്വാനവും ഉപയോഗിച്ചു. പരമ്പരാഗതമായെങ്കിലും ഇന്നത്തെ സാധാരണ വായനയിൽ കൃത്രിമമായി തോന്നാവുന്ന ‘കൊണ്ടുവരുവിൻ’, ‘ആനന്ദിക്കാം’ തുടങ്ങിയ രൂപങ്ങൾ ഒഴിവാക്കി.
