  text: καὶ εὑρὼν ἐπιτίθησιν ἐπὶ τοὺς ὤμους ⸀αὐτοῦ χαίρων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/005.yaml
  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: ml
  text: അതിനെ കണ്ടെത്തിയശേഷം[a], അവൻ സന്തോഷിച്ചുകൊണ്ട് അതിനെ തന്റെ തോളുകളിൽ എടുത്തുവെക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, മുൻസന്ദർഭത്തിൽ പറയുന്ന കാണാതായ ആട്.
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: കണ്ടെത്തുമ്പോൾ
  rationale: ഏറിസ്റ്റ് കർത്തൃവാചക കൃദന്തം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ കാലസംബന്ധിയായ ഉപവാക്യം ഉപയോഗിച്ചു; സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്ന ആടിനെ സൂചിപ്പിക്കാൻ ‘അതിനെ’ ചേർത്തു.
- source_word: ἐπιτίθησιν
  choice: വെക്കുന്നു
  rationale: വർത്തമാനകാല കർത്തൃവാചക മുഖ്യക്രിയയുടെ സജീവമായ വിവരണഭാവം നിലനിർത്തുന്നു; തോളുകളിൽ ചുമത്തുന്ന പ്രവൃത്തിക്ക് സാധാരണ മലയാളത്തിൽ ‘വെക്കുന്നു’ സ്വാഭാവികമാണ്.
- source_word: ἐπὶ τοὺς ὤμους
  choice: തന്റെ തോളുകളിൽ
  rationale: ἐπί + ദ്വിതീയാവിഭക്തി തോളുകളിലേക്കുള്ള വെക്കലിനെ സൂചിപ്പിക്കുന്നു. ὤμους എന്ന ബഹുവചനം ‘തോളുകളിൽ’ എന്നു നിലനിർത്തി.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: സർവനാമം ആടിനെയല്ല, വെക്കുന്ന ഇടയനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ആത്മവാചക ഉടമസ്ഥരൂപമായ ‘തന്റെ’ ഈ ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: χαίρων
  choice: സന്തോഷത്തോടെ
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃദന്തം മുഖ്യപ്രവൃത്തിയോടൊപ്പമുള്ള മനോഭാവം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സന്തോഷത്തോടെ’ സ്വാഭാവികമായി ആ സഹചര്യാർഥം നൽകുന്നു.
theological_decisions:
- issue: ഗ്രീക്കിൽ പരോക്ഷമായി നിൽക്കുന്ന കർമം മലയാളത്തിൽ വ്യക്തമാക്കൽ
  choice: ‘അതിനെ’ ചേർത്ത് മുൻസന്ദർഭത്തിലെ കാണാതായ ആടിനെ സൂചിപ്പിച്ചു.
  alternative: ‘കണ്ടെത്തുമ്പോൾ, അവൻ തന്റെ തോളുകളിൽ വെക്കുന്നു’ എന്ന് കർമം പറയാതെ വിടുക.
  rationale: ഗ്രീക്കിൽ സന്ദർഭംകൊണ്ട് വ്യക്തമാകുന്ന കർമം ഒഴിവാക്കാം; മലയാളത്തിൽ അത് പറയാതെ വിട്ടാൽ വാക്യം അപൂർണ്ണവും അസ്വാഭാവികവുമായി തോന്നും. ‘അതിനെ’ ചേർക്കുന്നത് പുതിയ ദൈവശാസ്ത്രാർഥം കൊണ്ടുവരാതെ മുൻവാക്യത്തിലെ ആടിനെ മാത്രം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ദൃശ്യവർത്തമാനകാല ഭാവം ‘വെക്കുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി; കൃദന്തരൂപമായ χαίρων മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാവിശേഷണരൂപത്തിൽ നൽകി.
