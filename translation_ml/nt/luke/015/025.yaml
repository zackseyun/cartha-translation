  terminology: “മൂത്ത മകൻ,” “വയൽ,” “സംഗീതം,” and “നൃത്തം” are suitable modern-standard Malayalam renderings. The lexical alternative footnote is appropriate, but its marker should be attached directly to “സംഗീതവും നൃത്തവും,” the terms it explains.
