id: LUK.15.25
reference: Luke 15:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦν δὲ ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος ἐν ἀγρῷ· καὶ ὡς ἐρχόμενος ἤγγισεν τῇ οἰκίᾳ, ἤκουσεν συμφωνίας καὶ χορῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: ml
  text: അവന്റെ മൂത്ത മകൻ വയലിലായിരുന്നു. അവൻ വരികയും വീടിനടുത്തെത്തുകയും ചെയ്തപ്പോൾ, സംഗീതവും നൃത്തവും[a] കേട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വാദ്യസംഗീതവും നർത്തകരുടെ സംഘങ്ങളും.” ഗ്രീക്ക് പദങ്ങൾ കൂടുതൽ പ്രത്യേകമായി സംഗീതാവതരണത്തെയും നൃത്തസംഘങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: ആയിരുന്നു
  rationale: δέ ഇവിടെ കഥയുടെ ശ്രദ്ധ മാറുന്നതു സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക ബന്ധപദം ചേർക്കാതെ സ്വാഭാവികമായ കഥനക്രമംകൊണ്ട് ആ മാറ്റം പ്രകടമാകുന്നു.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: അവന്റെ മൂത്ത മകൻ
  rationale: πρεσβύτερος താരതമ്യാർഥത്തിൽ ഇളയ മകനേക്കാൾ മൂത്തവനെ സൂചിപ്പിക്കുന്നു; 'മൂത്ത മകൻ' സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἐν ἀγρῷ
  choice: വയലിൽ
  rationale: ἀγρός ഇവിടെ കൃഷിയിടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; 'വയൽ' നേരിട്ടും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: ὡς ἐρχόμενος
  choice: അവൻ മടങ്ങിവന്ന്
  rationale: ἐρχόμενος അവൻ വീട്ടിലേക്കു വന്നുകൊണ്ടിരുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്നു. വയലിൽനിന്ന് വീട്ടിലേക്കുള്ള വരവ് മലയാളത്തിൽ 'മടങ്ങിവന്ന്' എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു; എന്നാൽ ഇത് ഉറവിടത്തിലെ ചലനത്തെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നതാണ്.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: വീടിനോട് അടുത്തപ്പോൾ
  rationale: ἐγγίζω എന്നതിന്റെ 'അടുത്തുവരുക' എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക സമയബന്ധിത ഘടന ഉപയോഗിക്കുന്നു.
- source_word: ἤκουσεν
  choice: കേട്ടു
  rationale: ലളിതമായ ഭൂതകാല കഥനക്രിയ; ആരംഭഭാവം അധികമായി ചേർക്കുന്നില്ല.
- source_word: συμφωνίας
  choice: സംഗീതം
  rationale: സംഗീതശബ്ദം, പ്രത്യേകിച്ച് വാദ്യസംഗീതം, എന്ന വിശാല അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: χορῶν
  choice: നൃത്തം
  rationale: നൃത്തത്തെയോ നർത്തകരുടെ സംഘത്തെയോ സൂചിപ്പിക്കാവുന്ന പദം; സംഗീതത്തോടു ചേർന്നപ്പോൾ 'നൃത്തം' സ്വാഭാവികമായ സംഭവാർഥം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ രണ്ടു ചലനഘടകങ്ങൾ ആവർത്തനഭാരം കൂടാതെ സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട സംയുക്തപദത്തിന് ശേഷം നൽകിയിരിക്കുന്നു.
