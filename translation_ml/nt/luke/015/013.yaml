source:
  edition: SBLGNT
  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: ml
  text: കുറച്ചു ദിവസങ്ങൾക്കുശേഷം[a], ഇളയ മകൻ എല്ലാം ഒരുമിച്ചുകൂട്ടി ഒരു ദൂരദേശത്തേക്കു പോയി. അവിടെ ധൂർത്തമായി ജീവിച്ചുകൊണ്ട്[c] അവൻ തന്റെ സ്വത്ത്[b] പാഴാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അധികം ദിവസങ്ങൾക്കുശേഷമല്ലാതെ.” ഗ്രീക്കിൽ അക്ഷരാർഥം “അനേകം ദിവസങ്ങൾക്കുശേഷമല്ലാതെ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തന്റെ സമ്പത്ത്,” “തന്റെ വസ്തുവകകൾ,” അല്ലെങ്കിൽ “തനിക്കുള്ളതെല്ലാം.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “പാഴായി ജീവിച്ചുകൊണ്ട്” അല്ലെങ്കിൽ “അലക്ഷ്യമായി ജീവിച്ചുകൊണ്ട്.” ഇവിടെ പ്രത്യേക പാപങ്ങളൊന്നും പറയുന്നില്ല; പാഴാക്കലും നിയന്ത്രണമില്ലായ്മയും നിറഞ്ഞ ജീവിതരീതിയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: അധികം ദിവസങ്ങൾ കഴിയുന്നതിനുമുമ്പ്
  rationale: ഗ്രീക്കിലെ ‘അധികം ദിവസങ്ങൾക്കുശേഷമല്ലാതെ’ എന്ന നിഷേധപ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘കുറച്ചു ദിവസങ്ങൾക്കുശേഷം’ എന്നതും സാധ്യമാണ്.
- source_word: συναγαγὼν πάντα
  choice: എല്ലാം ഒരുമിച്ചുകൂട്ടി
  rationale: പുറപ്പെടുന്നതിനു മുമ്പുള്ള പ്രവൃത്തിയെ ക്രിയാവിശേഷണരൂപത്തിൽ നിലനിർത്തുകയും συνάγω എന്നതിലെ ‘ഒരുമിച്ചുകൂട്ടുക’ എന്ന ഭാവം പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു. സന്ദർഭത്തിൽ തനിക്കുള്ളതെല്ലാം യാത്രയ്ക്കായി സമാഹരിച്ചതായിരിക്കാം.
- source_word: ὁ νεώτερος υἱός
  choice: ഇളയ മകൻ
  rationale: താരതമ്യവിശേഷണത്തോടുകൂടിയ പ്രയോഗത്തിന് കഥാസന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളം.
- source_word: ἀπεδήμησεν
  choice: പോയി
  rationale: താമസസ്ഥലത്തുനിന്ന് ദൂരത്തേക്കു പുറപ്പെട്ടെന്ന അർഥം തുടർന്നുള്ള ‘ഒരു ദൂരദേശത്തേക്ക്’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നതിനാൽ ലളിതമായ ക്രിയ മതിയാകുന്നു.
- source_word: εἰς χώραν μακράν
  choice: ഒരു ദൂരദേശത്തേക്ക്
  rationale: χώρα ഇവിടെ പ്രദേശം/ദേശം എന്ന വിശാലാർഥത്തിലാണ്; ‘ദൂരദേശം’ സ്വാഭാവികവും പരമ്പരാഗതമായ അത്യൗപചാരികത ഒഴിവാക്കുന്നതുമാണ്.
- source_word: διεσκόρπισεν
  choice: ധൂർത്തടിച്ചു
  rationale: സ്വത്തിനോടു ചേർന്നപ്പോൾ ‘ചിതറിച്ചു’ എന്ന അക്ഷരാർഥത്തേക്കാൾ പാഴായി ചെലവഴിച്ചു നശിപ്പിച്ചു എന്ന സന്ദർഭാർഥം ഈ പദം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: തന്റെ സ്വത്ത്
  rationale: οὐσία സൂചിപ്പിക്കുന്ന ഉടമസ്ഥത, സമ്പാദ്യം, അവകാശവിഹിതം എന്നിവയെ അനാവശ്യമായി ചുരുക്കാതെ ഉൾക്കൊള്ളുന്ന പൊതുവായ മലയാളപദം.
- source_word: ζῶν ἀσώτως
  choice: കുത്തഴിഞ്ഞു ജീവിച്ച്
  rationale: നിയന്ത്രണമില്ലാത്തതും പാഴാക്കുന്നതുമായ ജീവിതരീതിയെ സൂചിപ്പിക്കുന്നു; വാക്യം പറയാത്ത പ്രത്യേക ലൈംഗികമോ മറ്റേതെങ്കിലും പാപമോ ഇതിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἀσώτως സൂചിപ്പിക്കുന്ന ജീവിതരീതിയുടെ സ്വഭാവം
  choice: കുത്തഴിഞ്ഞു ജീവിച്ച്
  alternative: ദുർവ്യയമായി ജീവിച്ച് / ദുർന്നടപ്പിൽ ജീവിച്ച്
  rationale: മൂലവാക്യം പ്രത്യേക പാപങ്ങളെ പേരെടുത്തു പറയാതെ നിയന്ത്രണമില്ലാത്ത, പാഴാക്കുന്ന ജീവിതത്തെ മാത്രം സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘ദുർന്നടപ്പ്’ പോലുള്ള കൂടുതൽ നൈതിക-വിശിഷ്ട അർഥം നിർബന്ധിക്കുന്ന പദം പ്രധാനവാചകത്തിൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, കഥനയോഗ്യവും മാന്യവുമായ ശൈലി. ആദ്യ ഗ്രീക്ക് ബന്ധകം മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിനായി പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; അർഥബന്ധം നിലനിർത്തിയിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
