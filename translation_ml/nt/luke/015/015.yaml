  text: καὶ πορευθεὶς ἐκολλήθη ἑνὶ τῶν πολιτῶν τῆς χώρας ἐκείνης, καὶ ἔπεμψεν αὐτὸν εἰς τοὺς ἀγροὺς αὐτοῦ βόσκειν χοίρους·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/015.yaml
  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: ml
  text: അങ്ങനെ അവൻ പോയി ആ നാട്ടിലെ പൗരന്മാരിൽ ഒരാളോടു പറ്റിച്ചേർന്നു[a]. അയാൾ അവനെ പന്നികളെ മേയ്ക്കാൻ തന്റെ വയലുകളിലേക്ക് അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചെന്നു ചേർന്നു” അല്ലെങ്കിൽ “മുറുകെപ്പിടിച്ചു.” ഒരാളോടു വളരെ അടുത്തും ആശ്രിതമായും ചേർന്നുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കാവുന്ന ക്രിയയാണ് ഗ്രീക്കിലുള്ളത്.
