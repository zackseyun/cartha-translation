lexical_decisions:
- source_word: πορευθεὶς
  choice: പോയി
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള സഞ്ചാരത്തെ സ്വാഭാവികമായും അധിക അർഥഭാരം കൂടാതെയും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκολλήθη
  choice: പറ്റിച്ചേർന്നു
  rationale: കൊλλάομαι എന്ന ക്രിയയിലെ അടുത്തു ചേരുക, ആശ്രയത്തോടെ ഒരാളോടു ബന്ധപ്പെടുക എന്നീ ഭാവങ്ങൾ നിലനിർത്തുന്നു; മലയാളത്തിൽ സന്ദർഭോചിതവും മനസ്സിലാകുന്നതുമാണ്.
- source_word: ἑνὶ τῶν πολιτῶν
  choice: പൗരന്മാരിൽ ഒരാളോട്
  rationale: πολίτης എന്നതിന്റെ രാഷ്ട്രീയ-സാമൂഹിക സമൂഹാംഗം എന്ന നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: τῆς χώρας ἐκείνης
  choice: ആ നാട്ടിലെ
  rationale: χώρα ഇവിടെ ദൂരദേശത്തെ സൂചിപ്പിക്കുന്ന കഥാസന്ദർഭത്തോട് ചേരുന്നു; ‘നാട്’ സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: ἔπεμψεν
  choice: അയച്ചു
  rationale: πέμπω എന്നതിന്റെ ലളിതവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: തന്റെ വയലുകളിലേക്ക്
  rationale: ἀγροὺς എന്ന ബഹുവചനം ‘വയലുകൾ’ എന്നു നിലനിർത്തുന്നു; αὐτοῦ ആരെ സൂചിപ്പിക്കുന്നു എന്ന് മലയാളത്തിൽ ‘തന്റെ’ വഴി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: βόσκειν
  choice: മേയ്ക്കാൻ
  rationale: മൃഗങ്ങളെ തീറ്റിച്ചുകൊണ്ട് പരിപാലിക്കുക എന്ന βόσκωയുടെ സന്ദർഭാർഥത്തിന് ‘മേയ്ക്കുക’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: χοίρους
  choice: പന്നികളെ
  rationale: χοῖρος എന്നതിന്റെ സാധാരണ ആധുനിക മലയാള പദം.
