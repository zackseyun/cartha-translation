id: LUK.15.12
reference: Luke 15:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: ml
  text: 'അവരിൽ ഇളയവൻ പിതാവിനോടു പറഞ്ഞു: “പിതാവേ, സ്വത്തിൽ എനിക്കു ലഭിക്കേണ്ട ഓഹരി എനിക്കു തരണമേ.” അപ്പോൾ പിതാവ് തന്റെ ജീവനോപാധിയായ സ്വത്ത് അവർക്കു വീതിച്ചു കൊടുത്തു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ജീവിതം/ഉപജീവനം’ (βίον); ഇവിടെ പിതാവിന്റെ സ്വത്തെയോ ജീവിതോപാധികളെയോ ഉദ്ദേശിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: ഇളയവൻ
  rationale: 'താരതമ്യവിശേഷണം നാമമായി പ്രയോഗിച്ചിരിക്കുന്നു: ‘ഇളയവൻ’. സന്ദർഭത്തിൽ മകനാണെന്നു വ്യക്തമെങ്കിലും ഈ വാക്യത്തിൽ ‘മകൻ’ നേരിട്ട് ഇല്ലാത്തതിനാൽ അത് ചേർക്കാതെ ഗ്രീക്കിന്റെ രൂപം നിലനിർത്തുന്നു.'
- source_word: δός μοι
  choice: എനിക്കു തരണമേ
  rationale: δίδωμι എന്ന ക്രിയയുടെ aorist imperative ആണ്. മലയാളത്തിൽ അഭ്യർഥനയുടെയും ആവശ്യപ്പെടലിന്റെയും ഭാവം സ്വാഭാവികമായി നൽകാൻ ‘തരണമേ’ ഉപയോഗിച്ചു.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: എനിക്കു ലഭിക്കേണ്ട ഓഹരി
  rationale: ἐπιβάλλον എന്നത് ഒരാൾക്കു വന്നുചേരുന്നതോ അവകാശമായി ലഭിക്കേണ്ടതോ ആയ ഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ലഭിക്കേണ്ട ഓഹരി’ അവകാശബോധം അമിതമായി നിയമപരമാക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: οὐσία
  choice: സ്വത്ത്
  rationale: ഈ കുടുംബ-പാരമ്പര്യസന്ദർഭത്തിൽ οὐσία വസ്തുവകകളെയോ ആസ്തിയെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായ പദം ‘സ്വത്ത്’ ആണ്.
- source_word: διεῖλεν
  choice: വീതിച്ചുകൊടുത്തു
  rationale: διαιρέω എന്നത് വിഭജിക്കുക, പങ്കിട്ടുകൊടുക്കുക എന്നർഥം. ദാതിവ് αὐτοῖς കൂടെയുള്ളതിനാൽ മലയാളത്തിൽ ‘വീതിച്ചുകൊടുത്തു’ പ്രവർത്തിയും ലഭിക്കുന്നവരെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: ഗ്രീക്കിൽ ദാതിവ് ബഹുവചനം, അക്ഷരാർഥത്തിൽ ‘അവർക്കു’. രണ്ടു പേരാണെന്ന സന്ദർഭം നിലനിൽക്കുമ്പോഴും ‘അവർക്കു’ മൂലരൂപത്തോട് കൂടുതൽ അടുത്തതാണ്.
- source_word: βίον
  choice: ഉപജീവനസ്വത്ത്
  rationale: βίος ഇവിടെ വെറും സമ്പത്ത് മാത്രമല്ല, പിതാവിന്റെ ജീവിതോപാധിയായ വസ്തുവകകളെയും സൂചിപ്പിക്കാം. ‘ഉപജീവനസ്വത്ത്’ ഈ ഇരട്ടനിറം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘പിതാവേ’ എന്ന സംബോധന മൂലത്തിലെ ആവർത്തനവും ഗൗരവവും നിലനിർത്തുന്നു. βίον എന്ന പദത്തിന്റെ ഉദ്ദേശപൂർവമായ അർഥവ്യാപ്തി പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
