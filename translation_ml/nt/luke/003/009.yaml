id: LUK.3.9
reference: Luke 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ml
  text: ഇപ്പോഴേ കോടാലി മരങ്ങളുടെ വേരിനരികെ വെച്ചിരിക്കുന്നു.[a] അതുകൊണ്ട് നല്ല ഫലം കായ്ക്കാത്ത ഓരോ മരവും വെട്ടിവീഴ്ത്തപ്പെടുകയും തീയിലേക്ക് എറിയപ്പെടുകയും ചെയ്യുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കോടാലി മരങ്ങളുടെ വേരിനരികെ കിടക്കുന്നു.”
    reason: κεῖται എന്നതിന്റെ കൂടുതൽ അക്ഷരാർഥപരമായ പരിഭാഷ.
  - marker: b
    text: അഥവാ, “വെട്ടിവീഴ്ത്തി തീയിലേക്ക് എറിയുന്നു.”
    reason: മൂലത്തിലെ രണ്ടു നിർജ്ജീവക്രിയകളെ പൊതുവായ കർത്താവുള്ള സജീവരൂപത്തിൽ പുനരാവിഷ്കരിക്കുന്ന മലയാള ശൈലീപരമായ പരിഭാഷ.
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: ഇപ്പോഴേ
  rationale: വിധി ആസന്നമാണെന്ന കാലസൂചനയും ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; δὲയുടെ തുടർച്ചാസ്വഭാവം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: ἡ ἀξίνη
  choice: കോടാലി
  rationale: മരം വെട്ടാനുള്ള ഉപകരണത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: മരങ്ങളുടെ വേരിനരികെ വെച്ചിരിക്കുന്നു
  rationale: വെട്ടാൻ സജ്ജമായി കോടാലി വേരിനടുത്ത് കിടക്കുന്നു എന്ന ദൃശ്യവും വിധിയുടെ ആസന്നതയും നിലനിർത്തുന്നു.
- source_word: πᾶν οὖν δένδρον
  choice: അതുകൊണ്ട് ... ഓരോ മരവും
  rationale: οὖν സൂചിപ്പിക്കുന്ന നിഗമനബന്ധവും πᾶν എന്ന സമഗ്രവ്യാപ്തിയും വ്യക്തമായി നൽകുന്നു.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: നല്ല ഫലം കായ്ക്കാത്ത
  rationale: ഫലവൃക്ഷത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ποιέωയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘കായ്ക്കുക’ എന്നു നൽകുന്നു; നൈതിക-ആത്മീയ രൂപകവും നിലനിൽക്കുന്നു.
- source_word: ἐκκόπτεται
  choice: വെട്ടിയിട്ട്
  rationale: മരത്തെ അടിവശത്ത് വെട്ടിവീഴ്ത്തുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ഏകോപിത നിർജ്ജീവക്രിയയുമായി ചേരുന്നു.
- source_word: εἰς πῦρ βάλλεται
  choice: തീയിലേക്ക് എറിയപ്പെടുന്നു
  rationale: നിർജ്ജീവ വർത്തമാനരൂപവും കഠിനമായ വിധിദൃശ്യവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിധിയെക്കുറിച്ചുള്ള രൂപകാത്മക ദൃശ്യം
  choice: വേരിനരികെയുള്ള കോടാലിയുടെയും തീയിലേക്ക് എറിയപ്പെടുന്ന മരങ്ങളുടെയും കാർഷികരൂപകം അതേപടി നിലനിർത്തി, ആസന്നമായ ദൈവികവിധിയുടെ മുന്നറിയിപ്പായി അവതരിപ്പിക്കുന്നു.
  alternative: തീയെ പ്രത്യേകമായി നരകമെന്നോ, ഈ ദൃശ്യത്തെ ഇസ്രായേലിന്മേലുള്ള ചരിത്രവിധി മാത്രമെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം കഠിനവും ആസന്നവുമായ വിധി വ്യക്തമാക്കുന്നുവെങ്കിലും തീയുടെ പൂർണ സൂചനയെ കൂടുതൽ ചുരുക്കി നിർവചിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിധിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ വിധിദൃശ്യവും വർത്തമാനകാലത്തിന്റെ ആസന്നതയും സംരക്ഷിച്ചിരിക്കുന്നു; ‘തീ’യുടെ ദൈവശാസ്ത്രപരമായ സൂചന പ്രത്യേകം നിർവചിച്ചിട്ടില്ല.
