revisions:
- from: ഇപ്പോഴേ കോടാലി മരങ്ങളുടെ വേരിനരികെ വെച്ചിരിക്കുന്നു.[a] അതുകൊണ്ട്, നല്ല ഫലം കായ്ക്കാത്ത ഓരോ മരവും വെട്ടിയിട്ട് തീയിലേക്ക് എറിയപ്പെടുന്നു.[b]
