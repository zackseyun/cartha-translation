id: LUK.3.34
reference: Luke 3:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦ Ἰακὼβ τοῦ Ἰσαὰκ τοῦ Ἀβραὰμ τοῦ Θάρα τοῦ Ναχὼρ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/034.yaml
  text: the son of Jacob[a], the son of Isaac, the son of Abraham, the son of Terah[c][b], the son of Nahor
translation:
  language: ml
  text: യാക്കോബിന്റെ മകൻ[a], യിസ്ഹാക്കിന്റെ മകൻ, അബ്രാഹാമിന്റെ മകൻ, തേരഹിന്റെ മകൻ[b], നാഹോരിന്റെ മകൻ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഓരോ പേരിനോടും ‘…ന്റെ’ എന്ന അർഥമുള്ള രൂപമാണ് ആവർത്തിക്കുന്നത്; വംശാവലിയുടെ ഘടന വ്യക്തമാക്കാൻ ‘മകൻ’ ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ഥാരാ’; പരിചിതമായ പഴയനിയമ പേരുരൂപത്തോട് ഒത്തുവരാൻ ‘തേരഹ്’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘നഖോർ’; പരിചിതമായ പഴയനിയമ പേരുരൂപത്തോട് ഒത്തുവരാൻ ‘നാഹോർ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: …ന്റെ മകൻ
  rationale: വംശാവലിയുടെ മുൻപും പിന്നിലും കാണുന്ന ഘടനപ്രകാരം ആവർത്തിക്കുന്ന ജനിറ്റീവ് രൂപം പിതൃപുത്രബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ‘മകൻ’ ചേർത്തു.
- source_word: Ἰακώβ
  choice: യാക്കോബ്
  rationale: പൂർവപിതാവിന്റെ പേരിന് മലയാളത്തിൽ പരിചിതമായ രൂപം സ്വീകരിച്ചു.
- source_word: Ἰσαάκ
  choice: യിസ്ഹാക്ക്
  rationale: ഇതേ പഴയനിയമ വ്യക്തിയെ തിരിച്ചറിയാൻ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: Ἀβραάμ
  choice: അബ്രാഹാം
  rationale: പൂർവപിതാവിന്റെ പേരിന് മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപം സ്വീകരിച്ചു.
- source_word: Θάρα
  choice: തേരഹ്
  rationale: ഗ്രീക്ക് രൂപം ‘ഥാരാ’ എന്നതിനടുത്തതാണെങ്കിലും, അതേ പഴയനിയമ വ്യക്തിയെ തിരിച്ചറിയാൻ എബ്രായപേരിനോട് ചേർന്ന പരിചിതരൂപം ഉപയോഗിച്ചു.
- source_word: Ναχώρ
  choice: നാഹോർ
  rationale: ഗ്രീക്ക് ഉച്ചാരണരൂപത്തേക്കാൾ, അതേ പഴയനിയമ വ്യക്തിയെ തിരിച്ചറിയുന്ന പരിചിതമായ എബ്രായാധിഷ്ഠിത രൂപം സ്വീകരിച്ചു.
theological_decisions:
- issue: സംക്ഷിപ്തമായ ഗ്രീക്ക് വംശാവലിയിൽ സൂചിതമായ പിതൃപുത്രബന്ധം വ്യക്തമാക്കൽ
  choice: ഓരോ പേരോടും ‘മകൻ’ ചേർത്ത് വ്യക്തമായി പരിഭാഷപ്പെടുത്തുക
  alternative: പേരുകളുടെ ഷഷ്ഠീവിഭക്തി ശൃംഖല മാത്രം നിലനിർത്തുക
  rationale: ഗ്രീക്കിലെ ആവർത്തിക്കുന്ന τοῦ + പേര് എന്ന ഘടന വലിയ വംശാവലി സന്ദർഭത്തിൽ പിതൃപുത്രബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മകൻ’ ചേർക്കുന്നത് പുതിയ ദൈവശാസ്ത്രവാദം കൊണ്ടുവരാതെ വാക്യത്തിന്റെ വംശാവലിസ്വഭാവം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. ‘മകൻ’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ ആവർത്തിത ഘടനയും ബന്ധങ്ങളുടെ വ്യക്തതയും നിലനിർത്തുന്നു.
