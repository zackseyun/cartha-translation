source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: ml
  text: ജനമെല്ലാം സ്നാനം ഏറ്റപ്പോൾ, യേശുവും സ്നാനം ഏറ്റു പ്രാർത്ഥിച്ചുകൊണ്ടിരിക്കെ, സ്വർഗം[a] തുറക്കപ്പെട്ടു,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആകാശം.” ഗ്രീക്ക് പദം ദൃശ്യമായ ആകാശത്തെയോ സ്വർഗത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ വെളിപ്പാടിന്റെ സന്ദർഭത്തിന് “സ്വർഗം” കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: പ്രധാന സംഭവത്തെ സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ അവതരിപ്പിച്ചു
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനസൂത്രമായ Ἐγένετο δὲ പുതിയ സംഭവത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. ‘അപ്പോൾ സംഭവിച്ചു’ എന്ന പദാനുപദരൂപം ആധുനിക മലയാളത്തിൽ കൃത്രിമമായതിനാൽ, മുഖ്യക്രിയയായ ‘തുറക്കപ്പെട്ടു’യിൽ സംഭവാർഥം സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: ജനമെല്ലാം സ്നാനം ഏറ്റപ്പോൾ
  rationale: ἐν + articular infinitive ഇവിടെ കാലസംബന്ധം സൂചിപ്പിക്കുന്നു. ἅπαντα τὸν λαόν എന്നതിന്റെ സമഗ്രത ‘ജനമെല്ലാം’ നിലനിർത്തുന്നു.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: യേശുവും സ്നാനം ഏറ്റു
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-വും’ കൊണ്ട് പ്രകടമാക്കി. കർത്തരി അല്ലാത്ത സ്നാനസ്വീകരണാർഥം ‘സ്നാനം ഏറ്റു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καὶ προσευχομένου
  choice: പ്രാർഥിച്ചുകൊണ്ടിരിക്കെ
  rationale: വർത്തമാനകാല പങ്കാളിക്രിയയുടെ തുടരുന്ന, മുഖ്യസംഭവത്തോടു സമകാലികമായ പ്രവർത്തനം ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: ἀνεῳχθῆναι
  choice: തുറക്കപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ അഓറിസ്റ്റ് കർമണിപ്രയോഗം നിലനിർത്തുന്നു; ‘പിളർന്നു’ എന്ന മാർക്കോസിനോടു ചേർന്ന ശക്തമായ ദൃശ്യഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: τὸν οὐρανὸν
  choice: സ്വർഗം
  rationale: തുടർന്ന് ആത്മാവ് ഇറങ്ങിവരുകയും ദൈവിക ശബ്ദം കേൾക്കുകയും ചെയ്യുന്ന വെളിപ്പാടിന്റെ സന്ദർഭത്തിൽ ‘സ്വർഗം’ ഏറ്റവും യോജിക്കുന്നു; ‘ആകാശം’ എന്ന നിഘണ്ടുപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: സ്നാനരംഗത്തിലെ οὐρανός എന്നതിന്റെ സൂചന
  choice: സ്വർഗം
  alternative: ആകാശം
  rationale: തുടർന്നുള്ള ആത്മാവിന്റെ ഇറക്കവും ദൈവിക ശബ്ദവും സ്വർഗീയ മണ്ഡലത്തെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പദത്തിന് ദൃശ്യമായ ആകാശം എന്നും അർഥമാകാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ മലയാളം. ‘സ്നാനം ഏറ്റു’ എന്ന പ്രയോഗം സ്വാഭാവികതയും മൂലത്തിലെ കർമണിഭാവവും ഒരുമിച്ച് കാത്തുസൂക്ഷിക്കുന്നു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
