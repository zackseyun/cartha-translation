  yaml_path: translation/nt/luke/003/038.yaml
  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: ml
  text: എനോശിന്റെ മകൻ[a], ശേത്തിന്റെ മകൻ, ആദാമിന്റെ മകൻ, ദൈവത്തിന്റെ മകൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘എനോശിന്റെ, ശേത്തിന്റെ, ആദാമിന്റെ, ദൈവത്തിന്റെ’ എന്ന ഷഷ്ഠീവിഭക്തിഘടനയാണ് ആവർത്തിക്കുന്നത്; ജനനാവലിയിൽ മുമ്പേ സ്ഥാപിക്കപ്പെട്ട വാക്യഘടനയിൽനിന്നാണ് ‘മകൻ’ എന്നു ചേർത്തിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: എനോശിന്റെ മകൻ
  rationale: ആവർത്തിക്കുന്ന ജനനാവലിസൂത്രത്തിൽ ഷഷ്ഠീവിഭക്തിയിലുള്ള പേരിനോടൊപ്പം മുൻസന്ദർഭത്തിൽനിന്ന് ‘മകൻ’ എന്ന ബന്ധപദം അധ്യാഹരിക്കപ്പെടുന്നു. Ἐνώς എന്ന പേര് എബ്രായരൂപത്തിന് അനുസൃതമായി ‘എനോശ്’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: τοῦ Σὴθ
  choice: ശേത്തിന്റെ മകൻ
  rationale: ഇതും ജനനാവലിയിലെ അതേ അധ്യാഹൃത പുത്രബന്ധം തുടരുന്നു. Σήθ എന്ന പേര് മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾരൂപമായ ‘ശേത്ത്’ എന്നു നൽകി.
- source_word: τοῦ Ἀδὰμ
  choice: ആദാമിന്റെ മകൻ
  rationale: Ἀδάμ ഇവിടെ പൊതുനാമമായ ‘മനുഷ്യൻ’ എന്ന അർഥത്തിലല്ല, വ്യക്തിനാമമായാണ് വരുന്നത്; അതിനാൽ ‘ആദാം’ എന്ന പേരുരൂപം നിലനിർത്തി. ജനനാവലിയുടെ ഘടനപ്രകാരം ‘മകൻ’ അധ്യാഹരിച്ചു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മകൻ
  rationale: ഗ്രീക്കിൽ ഇത് ഷഷ്ഠീവിഭക്തിപ്രയോഗം മാത്രമാണെങ്കിലും, തുടർച്ചയായ ജനനാവലിസൂത്രം ഇവിടെ കൂടി ‘മകൻ’ എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ θεός ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ആദാമിന്റെ ജനനാവലിയുടെ അവസാനത്തിലുള്ള τοῦ θεοῦ എന്ന പ്രയോഗം
  choice: ദൈവത്തിന്റെ മകൻ
  alternative: ദൈവത്തിന്റേത് / ദൈവത്തിൽനിന്നുള്ളവൻ
  rationale: മൂലപാഠത്തിന്റെ രൂപം ‘ദൈവത്തിന്റെ’ എന്ന ഷഷ്ഠീവിഭക്തി മാത്രമാണെങ്കിലും ജനനാവലിയുടെ സ്ഥാപിതമായ വാക്യഘടന ‘മകൻ’ എന്ന അധ്യാഹാരം പിന്തുണയ്ക്കുന്നു. ഇതിലൂടെ ആദാമും ദൈവവും തമ്മിലുള്ള ബന്ധത്തെ പാഠം ഉന്നയിക്കുന്ന വിധത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ അതിനെ പിൽക്കാല ക്രിസ്തുശാസ്ത്രപരമായ പുത്രത്വസങ്കൽപ്പവുമായി സമീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ജനനാവലിശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സംക്ഷിപ്ത ആവർത്തനഘടന വ്യക്തമാക്കാൻ ‘മകൻ’ ഓരോ ഘട്ടത്തിലും ചേർത്തു; മൂലത്തിലെ രൂപപരമായ സംക്ഷിപ്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
