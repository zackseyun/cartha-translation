id: LUK.3.8
reference: Luke 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ml
  text: അതുകൊണ്ട്, മാനസാന്തരത്തിന് യോജിച്ച ഫലങ്ങൾ പുറപ്പെടുവിക്കുവിൻ[a]. ‘അബ്രാഹാം ഞങ്ങളുടെ പിതാവാണ്’ എന്ന് നിങ്ങളുടെയിടയിൽ പറഞ്ഞുതുടങ്ങരുത്[b]. ഈ കല്ലുകളിൽനിന്ന് അബ്രാഹാമിനു മക്കളെ ഉയർത്താൻ ദൈവത്തിനു കഴിയും എന്നു ഞാൻ നിങ്ങളോടു പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാനസാന്തരത്തിനു ചേർന്ന ഫലം’ അല്ലെങ്കിൽ ‘മാനസാന്തരത്തിനു തക്ക ഫലങ്ങൾ.’ ഗ്രീക്കിൽ ‘ഫലങ്ങൾ’ എന്നത് ബഹുവചനമാണ്; യഥാർഥ മാനസാന്തരത്തോട് പൊരുത്തപ്പെടുന്ന ജീവിതനടപ്പിനെയാണ് പ്രയോഗം ഊന്നിപ്പറയുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളുടെ ഉള്ളിൽ’ അല്ലെങ്കിൽ ‘നിങ്ങളോടുതന്നെ.’ ഈ പ്രയോഗം ഉള്ളിലെ ആത്മസംസാരത്തെയോ സ്വന്തം കൂട്ടത്തിനുള്ളിൽ പറയുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: പുറപ്പെടുവിക്കുവിൻ
  rationale: καρπούς എന്നതോടൊപ്പം ഫലം ഉളവാക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും നിർണായകമായ ആജ്ഞയുടെ ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള മുന്നറിയിപ്പിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: മാനസാന്തരത്തിന് യോജിച്ച ഫലങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനമായ καρπούς നിലനിർത്തുന്നു; ἀξίους സൂചിപ്പിക്കുന്ന പൊരുത്തം ‘യോജിച്ച’ എന്നതിലൂടെ നൽകുന്നു. μετάνοιαയെ ഈ ധാർമിക-ആത്മീയ തിരിഞ്ഞുവരവിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘മാനസാന്തരം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: μὴ ἄρξησθε λέγειν
  choice: പറഞ്ഞുതുടങ്ങരുത്
  rationale: ἄρξησθε + λέγειν എന്ന ഘടനയിലെ ‘പറയാൻ തുടങ്ങരുത്’ എന്ന ശക്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἐν ἑαυτοῖς
  choice: നിങ്ങളുടെയിടയിൽ
  rationale: സ്വന്തം ഉള്ളിലെ ചിന്തയെയോ സ്വന്തം കൂട്ടത്തിനുള്ളിലെ സംസാരത്തെയോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കൂട്ടായ അർഥസാധ്യത പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: അബ്രാഹാം ഞങ്ങളുടെ പിതാവാണ്
  rationale: അബ്രാഹാമിക വംശബന്ധത്തിലുള്ള അവരുടെ ആത്മവിശ്വാസം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: ഈ കല്ലുകളിൽനിന്ന് അബ്രാഹാമിനു മക്കളെ ഉയർത്താൻ
  rationale: ἐκ എന്നതിന്റെ ഉത്ഭവാർഥവും ἐγεῖραι എന്നതിന്റെ ‘ഉയർത്തുക/ഉണ്ടാക്കുക’ എന്ന സജീവ രൂപകവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘മാനസാന്തരത്തിന് യോജിച്ച ഫലങ്ങൾ’ എന്നതിന്റെ അർഥം
  choice: യഥാർഥ മാനസാന്തരത്തോട് പൊരുത്തപ്പെടുന്ന പെരുമാറ്റഫലങ്ങൾ ആവശ്യപ്പെടുന്ന വാചകമായി നിലനിർത്തി.
  alternative: ‘മാനസാന്തരത്തിനു ചേർന്ന ഫലം’ അല്ലെങ്കിൽ ‘മാനസാന്തരത്തിനു തക്ക പ്രവൃത്തികൾ’ എന്നു കൂടുതൽ വ്യാഖ്യാനാത്മകമായി നൽകാം.
  rationale: വാചകം പ്രവൃത്തികൾ ക്ഷമ സമ്പാദിക്കുന്നു എന്നു പറയുന്നില്ല; എന്നാൽ മാനസാന്തരവും ജീവിതഫലങ്ങളും തമ്മിലുള്ള ധാർമിക പൊരുത്തം ശക്തമായി ആവശ്യപ്പെടുന്നു. ആ പിരിമുറുക്ക് വിശദീകരണമില്ലാതെ നിലനിർത്തി.
- issue: അബ്രാഹാമിന്റെ ശാരീരിക വംശപരമ്പരയുടെ സ്ഥാനം
  choice: അബ്രാഹാമിക വംശാവലിയിലുള്ള ആശ്രയം മതിയായ സുരക്ഷയല്ലെന്ന യോഹന്നാന്റെ വെല്ലുവിളി നേരിട്ട് നിലനിർത്തി.
  alternative: ‘അബ്രാഹാമിന്റെ യഥാർഥ മക്കൾ’ എന്നപോലെ പിന്നീടുള്ള ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം ചേർക്കാമായിരുന്നു.
  rationale: മൂലവാചകം ദൈവത്തിന്റെ സ്വാതന്ത്ര്യവും ശക്തിയും ഉറപ്പിക്കുന്നു; എന്നാൽ ‘യഥാർഥ മക്കൾ’ പോലുള്ള വിശദീകരണം ഇവിടെ നേരിട്ട് പറയുന്നില്ല. അതിനാൽ അത് ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ബൈബിൾഭാഷയിൽ പരിചിതമായ ‘മാനസാന്തരം’ നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി. ബഹുവചനമായ ‘ഫലങ്ങൾ’യും ἐν ἑαυτοῖς എന്നതിലെ യഥാർഥ അർഥസന്ദിഗ്ധതയും സംരക്ഷിച്ചു.
