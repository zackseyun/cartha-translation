language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: ml
  text: 'പരിശുദ്ധാത്മാവ് ശാരീരികമായ രൂപത്തിൽ, പ്രാവിനെപ്പോലെ, അവന്റെമേൽ ഇറങ്ങിവന്നു. അപ്പോൾ സ്വർഗത്തിൽനിന്ന് ഒരു ശബ്ദമുണ്ടായി: “നീ എന്റെ പ്രിയപുത്രൻ; നിന്നിൽ ഞാൻ പ്രസാദിച്ചു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβῆναι
  choice: ഇറങ്ങിവന്നു
  rationale: ആഖ്യാനക്രമത്തിലെ ഇറങ്ങിവരുന്ന ചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: നിശ്ചിതമായ ഗ്രീക്ക് പദസമുച്ചയത്തിന്റെ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: σωματικῷ εἴδει
  choice: ശാരീരികരൂപത്തിൽ
  rationale: പ്രകടനം ദൃശ്യവും ശരീരസദൃശമായ രൂപത്തിലുമായിരുന്നു എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὡς περιστερὰν
  choice: പ്രാവിനെപ്പോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ സംരക്ഷിക്കുന്നു; ആത്മാവ് അക്ഷരാർഥത്തിൽ പ്രാവായി മാറിയെന്ന് പറയുന്നില്ല.
- source_word: ἐπ’ αὐτόν
  choice: അവന്റെമേൽ
  rationale: യേശുവിന്റെമേലേക്കുള്ള ഇറക്കവും സ്ഥിതിചെയ്യലും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: സ്വർഗത്തിൽനിന്ന് ഒരു ശബ്ദമുണ്ടായി
  rationale: ശബ്ദം സംഭവിച്ചു/ഉണ്ടായി എന്ന ഗ്രീക്ക് പ്രയോഗത്തെ വ്യക്തമായ മലയാള ആഖ്യാനമായി നൽകുന്നു.
- source_word: Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός
  choice: നീ എന്റെ പ്രിയപുത്രൻ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പുത്രബന്ധവും ἀγαπητός എന്ന സ്നേഹവിശേഷണവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν σοὶ εὐδόκησα
  choice: നിന്നിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു
  rationale: ἐν എന്നതിനെ ‘നിന്നിൽ’ എന്നു നിലനിർത്തുകയും അഓറിസ്റ്റിന്റെ പൂർത്തിയായ പ്രവർത്തനവും ഇപ്പോഴുള്ള ഫലാവസ്ഥയും സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു; കൂടുതൽ ഔപചാരികമായ ഭൂതകാലരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ആത്മാവിന്റെ പ്രത്യക്ഷീകരണത്തിന്റെ സ്വഭാവം
  choice: പരിശുദ്ധാത്മാവ് പ്രാവിനെപ്പോലെ ശാരീരികരൂപത്തിൽ ഇറങ്ങിയതായി വിവർത്തനം ചെയ്യുന്നു.
  alternative: ആത്മാവ് യഥാർഥ പ്രാവായിത്തീർന്നു.
  rationale: σωματικῷ εἴδει ὡς περιστερὰν ദൃശ്യമായ രൂപത്തെയും ഉപമയെയും ഒരുമിച്ചു സൂചിപ്പിക്കുന്നു; ‘പ്രാവിനെപ്പോലെ’ എന്നത് ഗ്രീക്കിനേക്കാൾ ശക്തമായ സത്താപരമായ അവകാശവാദം ഒഴിവാക്കുന്നു.
- issue: εὐδόκησα എന്ന ദൈവിക പ്രഖ്യാപനത്തിന്റെ കാലവും ഭാവവും
  choice: പ്രധാനപാഠത്തിൽ ‘ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു’ എന്നു നൽകുന്നു.
  alternative: ‘ഞാൻ പ്രസാദിച്ചു’ അല്ലെങ്കിൽ ‘ഞാൻ ആനന്ദം കണ്ടെത്തി.’
  rationale: ഗ്രീക്ക് അഓറിസ്റ്റിന്റെ ഭൂതകാലഭാവം നഷ്ടപ്പെടുത്താതെ, പ്രസാദത്തിന്റെ നിലനിൽക്കുന്ന ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഔപചാരികമായ ഭൂതകാലവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രാവിനെപ്പോലെ’ എന്ന ഉപമയും ‘നിന്നിൽ’ എന്ന ഗ്രീക്ക് മുൻപദത്തിന്റെ രൂപവും സംരക്ഷിച്ചു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി.
