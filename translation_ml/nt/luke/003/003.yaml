  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: ml
  text: അവൻ യോർദ്ദാൻ നദിയുടെ ചുറ്റുമുള്ള പ്രദേശമെങ്ങും[a] ചെന്നു, പാപമോചനത്തിനായുള്ള മാനസാന്തരസ്നാനം പ്രസംഗിച്ചു[b].
