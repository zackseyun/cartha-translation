lexical_decisions:
- source_word: ἦλθεν
  choice: ചെന്നു
  rationale: സന്ദർഭത്തിലെ പ്രദേശസഞ്ചാരത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിലെ ആഗമനക്രിയയെ ദിശ അനാവശ്യമായി ഉറപ്പിക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: യോർദ്ദാനു ചുറ്റുമുള്ള പ്രദേശമെങ്ങും
  rationale: περίχωρος എന്നതിലെ ചുറ്റുപ്രദേശവും πᾶσαν എന്നതിലെ സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; εἰς സൂചിപ്പിക്കുന്ന സഞ്ചാരം ‘ചെന്നു’ എന്ന ക്രിയയോടൊപ്പം വ്യക്തമാകുന്നു.
- source_word: κηρύσσων
  choice: പ്രസംഗിച്ചു
  rationale: പരസ്യമായി വിളിച്ചറിയിക്കുക എന്ന κηρύσσωയുടെ ആശയം സാധാരണ മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തമായി നൽകുന്നു; ‘പ്രഖ്യാപിച്ചുകൊണ്ട്’ എന്നത് കൂടുതൽ രൂപസാമ്യമുള്ള മറ്റൊരു സാധ്യതയാണ്.
- source_word: βάπτισμα
  choice: സ്നാനം
  rationale: ക്രിസ്തീയ സന്ദർഭത്തിൽ βάπτισμα സൂചിപ്പിക്കുന്ന ആചാരത്തെ മലയാളത്തിലെ സ്ഥാപിതവും മനസ്സിലാക്കാവുന്നതുമായ പദംകൊണ്ട് നൽകുന്നു.
- source_word: μετανοίας
  choice: മാനസാന്തര
  rationale: μετάνοιαയുടെ മനസ്സും ജീവിതദിശയും മാറുന്നതെന്ന ആശയം ഉൾക്കൊള്ളുന്ന സ്ഥാപിത മലയാള പ്രയോഗം; സമാസരൂപം βάπτισμα μετανοίας എന്ന അടുത്ത ബന്ധം നിലനിർത്തുന്നു.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: പാപമോചനത്തിനായുള്ള
  rationale: ἄφεσις എന്നതിന്റെ ക്ഷമ/മോചനം എന്ന അർഥവും εἰς എന്നതിലെ ലക്ഷ്യബന്ധവും വ്യക്തമാക്കുന്നു; സ്നാനം, മാനസാന്തരം, പാപമോചനം എന്നിവയുടെ കൃത്യമായ ദൈവശാസ്ത്രബന്ധം അധികമായി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: സ്നാനം, മാനസാന്തരം, പാപമോചനം എന്നിവ തമ്മിലുള്ള ബന്ധം
  choice: ‘പാപമോചനത്തിനായുള്ള മാനസാന്തരസ്നാനം’ എന്ന സുതാര്യമായ ഘടന
  alternative: ‘പാപമോചനത്തിലേക്കു നയിക്കുന്ന മാനസാന്തരത്തിന്റെ സ്നാനം’ അല്ലെങ്കിൽ ‘മാനസാന്തരം പ്രകടിപ്പിക്കുന്ന സ്നാനം’
  rationale: βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν എന്ന ഗ്രീക്ക് പ്രയോഗം ബന്ധം വ്യക്തമാക്കുന്നുവെങ്കിലും അതിന്റെ ഉപാധിപരമോ അടയാളപരമോ പ്രഖ്യാപനപരമോ ആയ സ്വഭാവം തീർപ്പാക്കുന്നില്ല. വിവർത്തനം ആ ദൈവശാസ്ത്ര പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ശൈലി. ‘പ്രദേശമെങ്ങും ചെന്നു’ എന്നത് εἰς πᾶσαν περίχωρον എന്ന ചലനവും വ്യാപ്തിയും ഒരുമിച്ച് നൽകുന്നു. ‘മാനസാന്തരസ്നാനം’ സ്ഥാപിതമായ പ്രയോഗമാണെങ്കിലും അതിന്റെ ദൈവശാസ്ത്രബന്ധം വ്യാഖ്യാനിച്ച് തീർപ്പാക്കിയിട്ടില്ല.
