  naturalness: The repeated genitive-plus-«മകൻ» construction is natural and suitably clear in modern Malayalam for a genealogy. The trailing comma appropriately indicates continuation from the surrounding genealogy.
  terminology: «യിശ്ശായി», «ബോവസ്», and «നഹശോൻ» are established, recognizable Malayalam biblical name forms. «യോബേൽ» is the source-faithful rendering of the unusual SBLGNT spelling and avoids silently harmonizing it with parallel genealogies.
