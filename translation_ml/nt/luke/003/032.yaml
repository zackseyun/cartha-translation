  text: the son of Jesse, the son of Jobed, the son of Boaz, the son of Sala, the son of Nahshon,
translation:
  language: ml
  text: യിശ്ശായിയുടെ മകൻ, യോബേലിന്റെ മകൻ, ബോവസിന്റെ മകൻ, സാലയുടെ മകൻ, നഹശോന്റെ മകൻ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰεσσαί
  choice: യിശ്ശായി
  rationale: പഴയനിയമത്തിലെ പേരുമായി പരിചിതമായ മലയാളരൂപം നിലനിർത്തുന്നു.
- source_word: Ἰωβήλ
  choice: യോബേദ്
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് രൂപമായ Ἰωβήλ അസാധാരണമാണ്; വംശാവലിയിലെ വ്യക്തിയെ തിരിച്ചറിയാൻ ഇംഗ്ലീഷ് POB-യിലെ ‘Jobed’ എന്ന രൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: Βόος
  choice: ബോവസ്
  rationale: വ്യക്തിയെ തിരിച്ചറിയാൻ സഹായിക്കുന്ന, മലയാളത്തിൽ പ്രചാരമുള്ള ബോവസ് എന്ന നാമരൂപം ഉപയോഗിച്ചു.
- source_word: Σαλά
  choice: സാല
  rationale: SBLGNT-യിലെ ഗ്രീക്ക് നാമരൂപം നേരിട്ട് ലിപ്യന്തരിച്ചു; സമാന്തര വംശാവലികളെ ആശ്രയിച്ച് പേര് തിരുത്തിയില്ല.
- source_word: Ναασσών
  choice: നഹശോൻ
  rationale: പഴയനിയമ നാമവുമായി ബന്ധം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: τοῦ
  choice: യുടെ മകൻ
  rationale: വംശാവലിയുടെ ജനിറ്റീവ് ശൃംഖലയെ സാധാരണ മലയാള വായനക്കാർക്ക് വ്യക്തമായി മനസ്സിലാകുന്ന പിതൃപുത്രബന്ധമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: വംശാവലിയിലെ പേരുകളുടെ പാഠരൂപം
  choice: SBLGNT-യിലെ Ἰωβήλ, Σαλά എന്നിവയെ യോബേദ്, സാല എന്നു നിലനിർത്തി.
  alternative: സമാന്തര വംശാവലികളോ പഴയനിയമപരമ്പരയോ അനുസരിച്ച് ഓബേദ്, സൽമോൻ എന്നു ഏകീകരിക്കുക.
  rationale: മൂലപാഠത്തിന്റെ സാക്ഷ്യം മുൻനിർത്തി, വ്യത്യസ്ത നാമരൂപങ്ങളിലെ പാഠപരവും വംശാവലിസംബന്ധവുമായ സംഘർഷം വിവർത്തനത്തിൽ നിശ്ശബ്ദമായി പരിഹരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിയുടെ ആവർത്തനലയവും ഗൗരവവും നിലനിർത്തി. വാക്യം മുൻപും പിന്നാലെയും തുടരുന്ന പട്ടികയുടെ ഭാഗമായതിനാൽ അവസാനത്തിൽ കോമ ഉപയോഗിച്ചു.
