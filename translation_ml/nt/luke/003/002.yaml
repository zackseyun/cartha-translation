  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: ml
  text: അന്നാസിന്റെയും കയ്യഫാവിന്റെയും മഹാപുരോഹിതപദവിക്കാലത്ത്[a], സെഖര്യാവിന്റെ മകനായ യോഹന്നാനു മരുഭൂമിയിൽവെച്ച് ദൈവത്തിന്റെ അരുളപ്പാടുണ്ടായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘അന്നാസിന്റെയും കയ്യഫാവിന്റെയും മഹാപുരോഹിതപദവിയിൽ.’ പദവി ഏകവചനത്തിലാണെങ്കിലും ലൂക്കോസ് രണ്ടുപേരുടെയും പേര് പറയുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: അന്നാസിന്റെയും കയ്യഫാവിന്റെയും മഹാപുരോഹിതപദവിക്കാലത്ത്
  rationale: ജനിറ്റീവോടുകൂടിയ ἐπί ഇവിടെ കാലസൂചനയാണ്. ഏകവചനമായ ἀρχιερέως സൂചിപ്പിക്കുന്ന ഏക സ്ഥാപനപദവി നിലനിർത്തിക്കൊണ്ട് ലൂക്കോസ് പേരെടുത്തുപറയുന്ന രണ്ടുപേരെയും മലയാളത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: ദൈവത്തിന്റെ അരുളപ്പാടുണ്ടായി
  rationale: പ്രവാചകനു ദൈവിക സന്ദേശം ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന തിരുവെഴുത്തിലെ സ്ഥിരപ്രയോഗമാണ്. ‘അരുളപ്പാട്’ ῥῆμα θεοῦ എന്നതിന്റെ സന്ദേശാത്മകവും പ്രവാചകീയവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ἐγένετοയുടെ സംഭവസ്വഭാവം ‘ഉണ്ടായി’ നിലനിർത്തുന്നു.
- source_word: ἐπὶ Ἰωάννην
  choice: യോഹന്നാനു
  rationale: അരുളപ്പാട് ആരിലേക്കു വന്നുവെന്ന ലക്ഷ്യം മലയാളത്തിലെ ദത്തിവിഭക്തിയിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: സെഖര്യാവിന്റെ മകനായ
  rationale: യോഹന്നാനെ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ ഘടന വ്യക്തവും പ്രവാഹമുള്ളതുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽവെച്ച്
  rationale: ἔρημος ജനവാസം കുറഞ്ഞ വരണ്ട പ്രദേശത്തെയും വിജനപ്രദേശത്തെയും സൂചിപ്പിക്കാം. യോഹന്നാന്റെ ശുശ്രൂഷയുമായി ബന്ധപ്പെട്ട പ്രദേശത്തിന് മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായ ‘മരുഭൂമി’ ഉപയോഗിക്കുന്നു; ‘വെച്ച്’ വെളിപ്പാട് ലഭിച്ച സ്ഥലത്തെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഏകവചനമായ ἀρχιερέως-നോടൊപ്പം അന്നാസിനെയും കയ്യഫാവിനെയും പരാമർശിക്കുന്നത് എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ‘അന്നാസിന്റെയും കയ്യഫാവിന്റെയും മഹാപുരോഹിതപദവിക്കാലത്ത്’ എന്ന് ഏകവചന സ്ഥാപനപദവി നിലനിർത്തുക
  alternative: ‘അന്നാസും കയ്യഫാവും മഹാപുരോഹിതന്മാരായിരുന്നപ്പോൾ’
  rationale: മൂലപാഠം പദവിയെ ഏകവചനത്തിൽ പറഞ്ഞിട്ടും രണ്ടുപേരെ ചേർത്തുപറയുന്നു. ബഹുവചനമാക്കി ചരിത്രപരമായ പിരിമുറുക്ക് മായ്ക്കാതെയും വ്യാഖ്യാനപരമായ സമന്വയം ഇറക്കുമതി ചെയ്യാതെയും അത് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രവാചകീയ സൂത്രവാക്യത്തിന് ‘ദൈവത്തിന്റെ അരുളപ്പാട്’ ഉപയോഗിച്ചു; ചരിത്രപരമായ അസ്പഷ്ടത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
