  text: the son of Jeshua, the son of Eliezer, the son of Jorim, the son of Matthat, the son of Levi,
translation:
  language: ml
  text: യേശുവായുടെ[a] മകൻ, എലിയേസെറിന്റെ മകൻ, യോരീമിന്റെ മകൻ, മത്താത്തിന്റെ മകൻ, ലേവിയുടെ മകൻ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘യേശുവാ’ എന്ന പേര് Ἰησοῦ ആണ്; ഈ ഗ്രീക്ക് രൂപം ബന്ധപ്പെട്ട സെമിറ്റിക് നാമരൂപങ്ങളെ വേർതിരിച്ചുകാണിക്കുന്നില്ല.
    reason: ആദ്യനാമത്തിന്റെ ഗ്രീക്ക് രൂപത്തിലുള്ള നാമ-അവ്യക്തത സംരക്ഷിക്കാനും, ഇവിടെ പറയുന്ന പൂർവികനെ ക്രിസ്തുയേശുവിൽനിന്ന് വായനാസൗകര്യത്തിനായി വേർതിരിക്കാനും.
lexical_decisions:
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: ഗ്രീക്ക് Ἰησοῦ എന്ന പേരിന്റെ പതിവായ മലയാളരൂപം; വംശാവലിയുടെ ബന്ധസൂചനയ്ക്കായി ഷഷ്ഠീവിഭക്തിയിൽ ‘യേശുവിന്റെ’ എന്നു നൽകി.
- source_word: Ἐλιέζερ
  choice: എലിയേസെർ
  rationale: ഗ്രീക്ക് നാമത്തിന്റെ ശബ്ദരൂപം സ്വാഭാവികമായ മലയാളലിപിയിൽ നിലനിർത്തുന്നു.
- source_word: Ἰωρίμ
  choice: യോരീം
  rationale: ഗ്രീക്ക് നാമത്തിന്റെ ദീർഘസ്വരം പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: Μαθθάτ
  choice: മത്താത്ത്
  rationale: ഇരട്ട വ്യഞ്ജനവും അവസാന വ്യഞ്ജനവും പ്രതിഫലിപ്പിക്കുന്ന പരമ്പരാഗതമായ മലയാളരൂപം.
- source_word: Λευί
  choice: ലേവി
  rationale: വേദപാരമ്പര്യത്തിൽ സുപരിചിതമായ മലയാള നാമരൂപം.
- source_word: τοῦ
  choice: —യുടെ മകൻ
  rationale: വംശാവലിയിലെ ആവർത്തിത ഷഷ്ഠീവിഭക്തി സൂചിപ്പിക്കുന്ന പിതൃപുത്രബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: Ἰησοῦ എന്ന നാമം യേശു/യേശുവാ എന്നിങ്ങനെ നൽകൽ
  choice: യേശു
  alternative: യേശുവാ
  rationale: ഗ്രീക്ക് പാഠത്തിൽ ഒരേ രൂപമാണ് ഉള്ളത്; ഈ വ്യക്തിയെ ക്രിസ്തുവിൽനിന്ന് വേർതിരിക്കാൻ ഇംഗ്ലീഷ് consultation layer ‘Jeshua’ ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും, മൂലരൂപത്തിന്റെ സാധാരണ മലയാള പ്രതിനിധാനം ‘യേശു’ ആണ്. വംശാവലി സന്ദർഭം വ്യക്തിത്വഭേദം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്കിൽ ‘മകൻ’ എന്ന പദം ഓരോ തവണയും പ്രത്യക്ഷമല്ലെങ്കിലും ലൂക്കാ 3:23-ൽ ആരംഭിച്ച വംശാവലി ഘടനയിലെ ഷഷ്ഠീവിഭക്തിയെ മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ആവർത്തിച്ച് വ്യക്തമാക്കി.
