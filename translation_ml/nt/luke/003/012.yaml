id: LUK.3.12
reference: Luke 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: ml
  text: ചുങ്കം പിരിക്കുന്നവരും സ്നാനം ഏൽക്കാൻ വന്നു. അവർ അവനോട്, “ഗുരുവേ, ഞങ്ങൾ എന്തു ചെയ്യണം?” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον
  choice: വന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ aorist indicative ഇവിടെ ഒരു നടന്ന സംഭവത്തെ സ്വാഭാവികമായ ലളിതഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: δὲ καὶ τελῶναι
  choice: ചുങ്കം പിരിക്കുന്നവരും
  rationale: δέ വിവരണത്തിന്റെ പുരോഗതിയും καί ചേർക്കലിന്റെ ഊന്നലും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ഉം’ ഈ ‘also/even’ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘പോലും’ എന്നു ചേർത്താൽ മൂലത്തിൽ ഉള്ളതിലധികം വിലയിരുത്തൽ തോന്നാൻ സാധ്യതയുണ്ട്.
- source_word: βαπτισθῆναι
  choice: സ്നാനം ഏൽക്കാൻ
  rationale: passive infinitive ആയ രൂപം വരവിന്റെ ഉദ്ദേശ്യം അറിയിക്കുന്നു. ‘സ്നാനം ഏൽക്കുക’ മതപരമായ കർമത്തിലെ സ്വീകരണഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: εἶπαν πρὸς αὐτόν
  choice: അവർ അവനോട് … എന്നു ചോദിച്ചു
  rationale: മൂലക്രിയയുടെ അടിസ്ഥാന അർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, പിന്നാലെയുള്ള നേരിട്ടുള്ള ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘ചോദിച്ചു’ എന്നു നൽകി; ചോദ്യം എന്ന ആശയം ഉള്ളടക്കത്തിൽ വ്യക്തമാണ്.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: നേരിട്ടുള്ള സംബോധനയായ διδάσκαλος-ന് അധ്യാപകൻ/ഉപദേഷ്ടാവ് എന്ന അർഥം നൽകുന്ന, മാന്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: τί ποιήσωμεν
  choice: ഞങ്ങൾ എന്തു ചെയ്യണം?
  rationale: deliberative aorist subjunctive ശരിയായ നടപടിയെക്കുറിച്ചുള്ള ചോദ്യം ഉന്നയിക്കുന്നു; ‘എന്തു ചെയ്യണം?’ അതിന്റെ പ്രായോഗിക-ധാർമിക ശക്തി വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ മാനസാന്തരവിളിയോട് പ്രതികരിക്കുന്ന സാമൂഹികമായി അപകീർത്തിപ്പെട്ട വിഭാഗത്തിന്റെ ഉൾപ്പെടുത്തൽ
  choice: τελῶναι എന്നത് ‘ചുങ്കം പിരിക്കുന്നവർ’ എന്നു തുറന്നുവിവർത്തനം ചെയ്ത് καί-യുടെ ചേർക്കൽഭാവം ‘-ഉം’ വഴി നിലനിർത്തി.
  alternative: ‘ചുങ്കം പിരിക്കുന്നവർപോലും’ എന്നു കൂടുതൽ ഊന്നലോടെ നൽകുക.
  rationale: ഈ വിഭാഗവും യോഹന്നാന്റെ സന്ദേശത്തോട് പ്രതികരിച്ചതെന്ന ആഖ്യാനപരമായ ഊന്നൽ സംരക്ഷിക്കണം; എന്നാൽ ‘പോലും’ അവരുടെ നൈതികസ്ഥിതിയെ മൂലവാക്യത്തേക്കാൾ ശക്തമായി വിലയിരുത്താൻ ഇടയാക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. ‘നികുതിപിരിവുകാർ’ എന്ന ഭരണപരമായ പദത്തേക്കാൾ ചരിത്രസന്ദർഭത്തിന് യോജിക്കുന്ന ‘ചുങ്കം പിരിക്കുന്നവർ’ ഉപയോഗിച്ചു. ഈ വാക്യത്തിൽ അടിക്കുറിപ്പ് അനിവാര്യമല്ല; ചേർക്കൽ/ഊന്നൽ മലയാളത്തിലെ ‘-ഉം’ വഴി നേരിട്ട് പ്രകടമാണ്.
