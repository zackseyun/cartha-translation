translation:
  language: ml
  text: മത്താത്തിന്റെ മകൻ[a], ലേവിയുടെ മകൻ, മെൽക്കിയുടെ മകൻ, യന്നായിയുടെ മകൻ, യോസേഫിന്റെ മകൻ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “മത്താത്തിന്റെ, ലേവിയുടെ, മെൽക്കിയുടെ, യന്നായിയുടെ, യോസേഫിന്റെ.” ഗ്രീക്കിൽ വംശാവലി ആവർത്തിച്ചുള്ള ഷഷ്ഠീവിഭക്തിയിൽ തുടരുന്നു; ചുറ്റുപാടിൽനിന്ന് “മകൻ” എന്ന ബന്ധം മനസ്സിലാക്കപ്പെടുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: -ന്റെ മകൻ
  rationale: ലൂക്കോസിന്റെ വംശാവലിയിൽ ഓരോ പേരിനോടും ആവർത്തിക്കുന്ന ഷഷ്ഠീവിഭക്തി ചുറ്റുപാടിൽനിന്ന് മനസ്സിലാകുന്ന പിതൃപുത്രബന്ധത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘-ന്റെ മകൻ’ എന്നു വ്യക്തമാക്കുന്നത് അർഥം സ്വാഭാവികമായി ഗ്രഹിക്കാനാകുന്നു.
- source_word: Μαθθὰτ
  choice: മത്ഥാത്ത്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: Λευὶ
  choice: ലേവി
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിക്കുന്നു.
- source_word: Μελχὶ
  choice: മെൽക്കി
  rationale: ഗ്രീക്ക് Μελχί എന്ന പേരിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: Ἰανναὶ
  choice: യന്നായി
  rationale: Ἰανναί എന്ന ഗ്രീക്ക് രൂപത്തിന്റെ അവസാന ദ്വിസ്വരവും പേരിന്റെ പ്രത്യേക രൂപവും നിലനിർത്തുന്ന ലിപ്യന്തരണം.
- source_word: Ἰωσὴφ
  choice: യോസേഫ്
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ വ്യാപകവും ഗ്രീക്ക് പേരിനോട് ചേർന്നതുമായ രൂപം.
theological_decisions:
- issue: വംശാവലിയിലെ അധ്യാഹാരം
  choice: ഓരോ പേരിനോടും ‘മകൻ’ എന്നു വ്യക്തമായി ചേർക്കുന്നു
  alternative: ‘മത്ഥാത്തിന്റെ, ലേവിയുടെ, മെൽക്കിയുടെ, യന്നായിയുടെ, യോസേഫിന്റെ’ എന്ന ഷഷ്ഠീവിഭക്തിശൃംഖല മാത്രം നിലനിർത്തുക
  rationale: ഗ്രീക്കിൽ ബന്ധപദം ഈ വാക്യത്തിൽ തുറന്നുപറയുന്നില്ലെങ്കിലും മുൻസന്ദർഭത്തിലെ വംശാവലിസൂത്രത്തിൽനിന്ന് അത് അധ്യാഹരിക്കപ്പെടുന്നു. ‘മകൻ’ എന്നു ചേർക്കുന്നത് പുതിയ ബന്ധം സൃഷ്ടിക്കുന്നതല്ല; സൂചിതബന്ധം വായനക്കാർക്ക് വ്യക്തമാക്കുന്നതാണ്.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. പേരുകൾ ഗ്രീക്ക് സ്രോതസ്സനുസരിച്ച് ലിപ്യന്തരിച്ചു; വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കാൻ അവസാനത്തിൽ വിരാമചിഹ്നമായി കോമ നിലനിർത്തി.
