id: LUK.3.33
reference: Luke 3:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦ ⸂Ἀμιναδὰβ τοῦ Ἀδμὶν τοῦ Ἀρνὶ⸃ τοῦ Ἑσρὼμ τοῦ Φαρὲς τοῦ Ἰούδα
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/033.yaml
  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: ml
  text: അമ്മീനാദാബിന്റെ മകൻ[a], അദ്മീന്റെ മകൻ, അർനിയുടെ മകൻ, ഹെസ്രോന്റെ മകൻ, പെരെസിന്റെ മകൻ, യെഹൂദായുടെ മകൻ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അമ്മീനാദാബിന്റെ മകൻ, അദ്മീന്റെ മകൻ, അരാമിന്റെ മകൻ’ എന്നു വായിക്കുന്നു; മറ്റു ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അദ്മീൻ’ ഒഴിവാക്കി ‘അമ്മീനാദാബിന്റെ മകൻ, അരാമിന്റെ മകൻ’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: ന്റെ മകൻ
  rationale: ലൂക്കോസിന്റെ വംശാവലിയിൽ ഓരോ പേരിനോടും ആവർത്തിക്കുന്ന ഷഷ്ഠീവിഭക്തി-നിർദേശകം മുൻവാക്യത്തിലെ വംശബന്ധസൂത്രം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വെറും ‘-ന്റെ’ എന്നതിനെക്കാൾ ‘-ന്റെ മകൻ’ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Ἀμιναδάβ
  choice: അമ്മീനാദാബ്
  rationale: ഗ്രീക്ക് നാമത്തെയും മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ പരിചിതമായ സെമിറ്റിക് രൂപത്തെയും പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: Ἀδμίν
  choice: അദ്മീൻ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT മുഖ്യപാഠത്തിലെ ഗ്രീക്ക് നാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: Ἀρνί
  choice: അർനി
  rationale: SBLGNT മുഖ്യപാഠത്തിൽ അച്ചടിച്ചിരിക്കുന്ന വായന നേരിട്ട് നിലനിർത്തുന്നു; ‘അരാം’ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ἑσρώμ
  choice: ഹെസ്രോൻ
  rationale: പഴയനിയമത്തിലെ ബന്ധപ്പെട്ട പേരുമായി വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന, നിലവാരമുള്ള മലയാളരൂപം.
- source_word: Φαρές
  choice: പേരെസ്
  rationale: ഗ്രീക്ക് രൂപത്തിന്റെ ശബ്ദാനുകരണത്തേക്കാൾ പഴയനിയമത്തിലെ അതേ വ്യക്തിയുമായി പൊരുത്തപ്പെടുന്ന പരിചിതമായ മലയാളരൂപം.
- source_word: Ἰούδα
  choice: യെഹൂദ
  rationale: പഴയനിയമ പിതൃപുരുഷന്റെ സന്ദർഭത്തിൽ യെഹൂദാ ഗോത്രപിതാവിനെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്ന പരിചിതമായ മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വംശാവലിയുടെ ആവർത്തനഘടന നിലനിർത്തിയിരിക്കുന്നു; പാഠഭേദം മുഖ്യപാഠത്തിൽ പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
