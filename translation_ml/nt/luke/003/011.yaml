id: LUK.3.11
reference: Luke 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: ml
  text: 'അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു: “രണ്ട് അങ്കികൾ[a] ഉള്ളവൻ തന്റെ അങ്കികളിൽ ഒന്ന് അങ്കിയില്ലാത്തവനു നൽകണം; ഭക്ഷണമുള്ളവനും അതുപോലെ ചെയ്യണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഉടുപ്പുകൾ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം ശരീരത്തോടു ചേർത്ത് ധരിച്ചിരുന്ന അടിസ്ഥാന വസ്ത്രമായ അങ്കിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു
  rationale: പ്രതികരണത്തെ സൂചിപ്പിക്കുന്ന കൃതന്തവും മുഖ്യക്രിയയും മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്ത് അവതരിപ്പിക്കുന്നു; δέ ഇവിടെ ശക്തമായ വിരോധമല്ലാത്തതിനാൽ പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: Ὁ ἔχων δύο χιτῶνας
  choice: രണ്ട് അങ്കികൾ ഉള്ളവൻ
  rationale: χιτών ശരീരത്തോടു ചേർത്ത് ധരിച്ചിരുന്ന അടിസ്ഥാന വസ്ത്രമാണ്. ‘അങ്കി’ ചരിത്രപരമായ വസ്ത്രത്തെ സൂചിപ്പിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന പദമാണ്.
- source_word: μεταδότω
  choice: പങ്കിടണം
  rationale: മൂന്നാംപുരുഷ ആജ്ഞയുടെ നിർബന്ധപരമായ ആഹ്വാനം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τῷ μὴ ἔχοντι
  choice: ഒന്നുമില്ലാത്തവനുമായി
  rationale: സന്ദർഭത്തിൽ കുറവുള്ളത് അങ്കിയാണെന്ന് സൂചിതമാണ്; ‘ഒന്നുമില്ലാത്തവൻ’ ആ സൂചിത വസ്തുവിനെ സ്വാഭാവികമായി തിരിച്ചുപിടിക്കുന്നു.
- source_word: βρώματα
  choice: ഭക്ഷണം
  rationale: ഭക്ഷ്യവസ്തുക്കളെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന് ലളിതവും കൃത്യവുമായ മലയാളം.
- source_word: ὁμοίως ποιείτω
  choice: അതുപോലെ ചെയ്യണം
  rationale: ആദ്യ നിർദേശത്തിലെ പങ്കിടൽ ഭക്ഷണത്തിനും ബാധകമാണെന്ന സമാന്തരതയും ആജ്ഞാബലവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രതിനിധാനപരമായ ഏകവചനവും ലിംഗരൂപവും
  choice: ഉള്ളവൻ ... ഇല്ലാത്തവൻ ... ഉള്ളവനും
  alternative: ആർക്കെങ്കിലും ... ഇല്ലാത്ത ഒരാളുമായി
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന കൃതന്തങ്ങൾ പൊതുവായ പ്രതിനിധാനപ്രയോഗങ്ങളാണ്. മലയാളത്തിലെ ഈ രൂപങ്ങൾ സ്വാഭാവികമായി പൊതുവായ അർഥത്തിൽ വായിക്കപ്പെടുന്നതിനാൽ മൂലത്തിലെ ഏകവചന ഘടന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ആജ്ഞയുടെ ബലം ‘പങ്കിടണം,’ ‘ചെയ്യണം’ എന്നീ രൂപങ്ങളിൽ നിലനിർത്തിയിരിക്കുന്നു; പുരാതന വസ്ത്രപദത്തിന് ആവശ്യമായ സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
