  source_fidelity: The draft accurately conveys John’s reply, the imperative force, and the parallel instruction concerning food. However, “ഒന്നുമില്ലാത്തവനുമായി” broadens τῷ μὴ ἔχοντι (“to the one not having [a tunic]”) into a person who has nothing at all, and “പങ്കിടണം” with “മായി” is less precise than the Greek dative recipient.
