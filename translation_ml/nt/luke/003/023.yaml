- from: യേശുതന്നെ ആരംഭിക്കുമ്പോൾ[a] ഏകദേശം മുപ്പതു വയസ്സായിരുന്നു[c]. ആളുകൾ കരുതിയിരുന്നതുപോലെ[b], അദ്ദേഹം ഹേലിയുടെ മകനായ യോസേഫിന്റെ മകനായിരുന്നു.
  to: യേശുതന്നെ, ആരംഭിക്കുമ്പോൾ[a], ഏകദേശം മുപ്പതു വയസ്സുള്ളവനായിരുന്നു[c]. അദ്ദേഹം—ആളുകൾ കരുതിയിരുന്നതുപോലെ[b]—ഹേലിയുടെ മകനായ യോസേഫിന്റെ മകനായിരുന്നു.
