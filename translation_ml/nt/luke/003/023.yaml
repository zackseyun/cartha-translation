id: LUK.3.23
reference: Luke 3:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: ml
  text: യേശുതന്നെ, ആരംഭിക്കുമ്പോൾ[a], ഏകദേശം മുപ്പതു വയസ്സുള്ളവനായിരുന്നു[c]. അദ്ദേഹം—ആളുകൾ കരുതിയിരുന്നതുപോലെ[b]—ഹേലിയുടെ മകനായ യോസേഫിന്റെ മകനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആരംഭിച്ചപ്പോൾ’. ഗ്രീക്കിൽ ‘തന്റെ ശുശ്രൂഷ’ എന്ന വാക്കുകളില്ല; സന്ദർഭത്തിൽ അതാണ് ഉദ്ദേശ്യമെന്നു തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, യേശുവിനെ യോസേഫിന്റെ മകനായാണ് ആളുകൾ പൊതുവേ കരുതിയിരുന്നത്.
    reason: alternative_reading
  - marker: c
    text: 'വാക്യം ഇങ്ങനെയും ക്രമപ്പെടുത്താം: ‘യേശുവിന് ഏകദേശം മുപ്പതു വയസ്സായപ്പോൾ അദ്ദേഹം ആരംഭിച്ചു.’ ഗ്രീക്ക് വാക്യഘടനയിൽ ‘ആരംഭിക്കുക’ എന്നതിനും പ്രായവിവരണത്തിനും അടുത്ത ബന്ധമുണ്ട്.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: Καὶ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മുമ്പത്തെ സംഭവവുമായി തുടർച്ച സൂചിപ്പിക്കുന്ന ബന്ധകമാണിത്. മലയാളത്തിൽ ഇവിടെ ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘കൂടാതെ’ ചേർക്കുന്നത് അനാവശ്യമായി ഭാരമുള്ളതിനാൽ വാക്യക്രമത്തിലൂടെ തുടർച്ച നിലനിർത്തി.
- source_word: αὐτὸς Ἰησοῦς
  choice: യേശുതന്നെ
  rationale: αὐτός നൽകുന്ന ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘തന്നെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἀρχόμενος
  choice: ആരംഭിക്കുമ്പോൾ
  rationale: സന്ദർഭത്തിൽ യേശുവിന്റെ പരസ്യപ്രവർത്തനത്തിന്റെ ആരംഭമാണ് ഉദ്ദേശ്യമെന്നു തോന്നുന്നുവെങ്കിലും, ഗ്രീക്കിൽ ‘ശുശ്രൂഷ’യോ ‘പ്രവർത്തനം’യോ എന്ന കർമപദമില്ല. അതിനാൽ അത് മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: ഏകദേശം മുപ്പതു വയസ്സായിരുന്നു
  rationale: ὡσεὶ സൂചിപ്പിക്കുന്ന ഏകദേശത്വവും പ്രായപ്രയോഗവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὡς ἐνομίζετο
  choice: ആളുകൾ കരുതിയിരുന്നതുപോലെ
  rationale: ഇത് പൊതുവായ ധാരണയാണെന്നും ലൂക്കോസ് ജൈവപിതൃത്വം നേരിട്ട് ഉറപ്പിക്കുകയല്ലെന്നും വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: υἱός … Ἰωσὴφ τοῦ Ἠλὶ
  choice: ഹേലിയുടെ മകനായ യോസേഫിന്റെ മകനായിരുന്നു
  rationale: ഗ്രീക്കിലെ വംശാവലിപരമായ സംക്ഷിപ്ത ജനിറ്റീവ് ശൃംഖല മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം തുറന്നുപറയുന്നു; ബന്ധങ്ങളുടെ ക്രമം മാറ്റുന്നില്ല.
theological_decisions:
- issue: ‘ആളുകൾ കരുതിയിരുന്നതുപോലെ’ എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: ഈ വാക്കുകൾ യേശുവിനെ യോസേഫിന്റെ മകനായി പൊതുവേ കണക്കാക്കിയിരുന്നതിനെ വിശേഷിപ്പിക്കുന്നതായി നൽകി.
  alternative: വാക്യം ഇടവിരാമമില്ലാതെ നൽകി പൊതുധാരണയും ജൈവപിതൃത്വവും തമ്മിലുള്ള വ്യത്യാസം മങ്ങിയ നിലയിൽ വിടുക.
  rationale: ലൂക്കോസിന്റെ മുൻജനനവിവരണത്തോടുള്ള സംഘർഷം പരിഹരിക്കാതെ, യോസേഫുമായുള്ള സാമൂഹിക/നിയമപരമായ പുത്രബന്ധത്തെക്കുറിച്ചുള്ള പൊതുധാരണയെന്ന വാചകത്തിന്റെ അകലം നിലനിർത്തുന്നു.
- issue: ἀρχόμενος എന്നതിൽ ‘ശുശ്രൂഷ’ അല്ലെങ്കിൽ ‘പരസ്യപ്രവർത്തനം’ ചേർക്കണമോ
  choice: മുഖ്യവാചകത്തിൽ കർമപദം ചേർക്കാതെ ‘ആരംഭിക്കുമ്പോൾ’ എന്നു നൽകി.
  alternative: ‘തന്റെ ശുശ്രൂഷ ആരംഭിക്കുമ്പോൾ’ അല്ലെങ്കിൽ ‘പരസ്യപ്രവർത്തനം ആരംഭിക്കുമ്പോൾ’.
  rationale: സന്ദർഭം അത്തരം അർത്ഥത്തെ ശക്തമായി സൂചിപ്പിച്ചാലും, ആ നാമപദം ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ യഥാർത്ഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: Ἰωσὴφ τοῦ Ἠλὶ എന്ന വംശാവലിപ്രയോഗം
  choice: മലയാളത്തിൽ ‘ഹേലിയുടെ മകനായ യോസേഫ്’ എന്നു ബന്ധം വ്യക്തമാക്കി.
  alternative: ഗ്രീക്കിനെ അക്ഷരാർഥത്തിൽ അനുകരിച്ച് ‘യോസേഫിന്റെ, ഹേലിയുടെ’ എന്ന അസ്വാഭാവിക ഘടന ഉപയോഗിക്കുക.
  rationale: വംശാവലിയിൽ ആവർത്തിക്കുന്ന ‘മകൻ’ എന്ന ആശയം ഗ്രീക്കിൽ ലോപിച്ചിരിക്കുന്നു. മലയാളത്തിൽ അത് പൂരിപ്പിക്കുന്നത് അർത്ഥം മാറ്റാതെ ബന്ധം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ‘യേശുതന്നെ’ എന്നത് ഉറവിടത്തിലെ ഊന്നൽ സൂക്ഷിക്കുന്നു. ‘ആരംഭിക്കുമ്പോൾ’ എന്ന അപൂർണ്ണമായി തോന്നാവുന്ന പ്രയോഗം ഗ്രീക്കിൽ കർമപദം ഇല്ലാത്തതിനെ മനപ്പൂർവം സംരക്ഷിക്കുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു. പേരുകൾ സാധാരണ മലയാള ബൈബിൾരൂപങ്ങളായ ‘യോസേഫ്’, ‘ഹേലി’ എന്നിങ്ങനെ നൽകിയിരിക്കുന്നു.
