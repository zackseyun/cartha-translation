    issue: The qualification ‘ആളുകൾ കരുതിയിരുന്നതുപോലെ’ is separated into a way that may weakly qualify the following unqualified statement ‘അദ്ദേഹം ... മകനായിരുന്നു.’
    rationale: Greek places ὡς ἐνομίζετο parenthetically within the statement that Jesus was Joseph’s son. Malayalam punctuation should similarly make the scope immediate.
  - severity: low
    issue: ‘ഏകദേശം മുപ്പതു വയസ്സായിരുന്നു’ is understandable but less complete as a predicate with a personal subject.
