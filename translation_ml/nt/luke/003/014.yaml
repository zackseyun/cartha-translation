revisions:
- from: 'പടയാളികളും അവനോട് ചോദിച്ചു: “അപ്പോൾ ഞങ്ങളും എന്തു ചെയ്യണം?” അവൻ അവരോട് പറഞ്ഞു: “ആരിൽനിന്നും ഭീഷണിപ്പെടുത്തി പണം പിടിച്ചുപറിക്കരുത്[a]; ആരുടെയുംമേൽ വ്യാജാരോപണം ഉന്നയിക്കരുത്; നിങ്ങളുടെ ശമ്പളംകൊണ്ട് തൃപ്തിപ്പെടുക[b].”'
  to: 'സൈനികരും അവനോട് ചോദിച്ചു: “ഞങ്ങളും എന്തു ചെയ്യണം?” അവൻ അവരോട് പറഞ്ഞു: “ആരിൽനിന്നും ഭീഷണിപ്പെടുത്തി പണം പിടിച്ചുപറിക്കരുത്[a]; ആരെയും വ്യാജമായി കുറ്റം ചുമത്തരുത്; നിങ്ങളുടെ വേതനത്തിൽ തൃപ്തിപ്പെടുക[b].”'
  rationale: The revision removes the unsupported inferential ‘അപ്പോൾ,’ uses the broader and standard term ‘സൈനികർ,’ and makes the second prohibition more idiomatic while retaining its universal scope. It preserves the explicit ‘ഞങ്ങളും’ emphasis, the contextual sense of coercive extortion, and the military-pay nuance in the footnote.
