id: LUK.3.14
reference: Luke 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: ml
  text: 'സൈനികരും അവനോട് ചോദിച്ചു: “ഞങ്ങളും എന്തു ചെയ്യണം?” അവൻ അവരോട് പറഞ്ഞു: “ആരിൽനിന്നും ഭീഷണിപ്പെടുത്തി പണം പിടിച്ചുപറിക്കരുത്[a]; ആരെയും വ്യാജമായി കുറ്റം ചുമത്തരുത്; നിങ്ങളുടെ വേതനത്തിൽ തൃപ്തിപ്പെടുക[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടത്തെ ഗ്രീക്ക് ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ ഒരാളെ ‘ശക്തമായി കുലുക്കുക’ അഥവാ ഭീഷണിപ്പെടുത്തുക എന്ന ആശയമുണ്ട്; ഇവിടെ അധികാരം ദുരുപയോഗപ്പെടുത്തി പണം പിടിച്ചുപറിക്കുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: “വേതനം” എന്നതിന് “ശമ്പളം” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം സൈനികർക്കുള്ള വേതനത്തെയോ വിഭവവിഹിതത്തെയോ സൂചിപ്പിക്കാനും ഉപയോഗിച്ചിരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: പടയാളികൾ
  rationale: സൈനികസേവനത്തിൽ ഏർപ്പെട്ടിരുന്നവരെയാണ് കർത്തൃവാചകമായ ഈ കൃദന്തം സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: അപ്പോൾ ഞങ്ങളും എന്തു ചെയ്യണം?
  rationale: ആലോചനാസൂചകമായ ഉപവാക്യക്രിയയുടെ ‘എന്തു ചെയ്യണം?’ എന്ന അർഥവും καὶ ἡμεῖς നൽകുന്ന ‘ഞങ്ങളും’ എന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ‘അപ്പോൾ’ മുൻസംഘങ്ങളുടെ ചോദ്യത്തോടുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: διασείσητε
  choice: ഭീഷണിപ്പെടുത്തി പണം പിടിച്ചുപറിക്കരുത്
  rationale: ബലപ്രയോഗമോ അധികാരദുരുപയോഗമോ വഴി ലാഭം തട്ടിയെടുക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; വെറും ശാരീരികമായി ‘കുലുക്കുക’ എന്ന പദാർഥത്തിൽ ഒതുങ്ങുന്നില്ല.
- source_word: συκοφαντήσητε
  choice: വ്യാജാരോപണം ഉന്നയിക്കരുത്
  rationale: ദ്രോഹകരമായോ ലാഭത്തിനായോ ഒരാളുടെമേൽ തെറ്റായ കുറ്റം ചുമത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളം.
- source_word: ἀρκεῖσθε
  choice: തൃപ്തിപ്പെടുക
  rationale: ലഭിക്കുന്നതിൽ മതിപ്പോടെ തുടരുക എന്ന വർത്തമാന ആജ്ഞയുടെ നൈതികഭാവം സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: ὀψωνίοις
  choice: ശമ്പളം
  rationale: സൈനികർക്കു ലഭിച്ച വേതനത്തെയോ ഉപജീവനവിഹിതത്തെയോ സൂചിപ്പിക്കുന്ന പദം; ഈ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് ഏറ്റവും വ്യക്തമായ തിരഞ്ഞെടുപ്പ്.
theological_decisions:
- issue: പടയാളികൾക്കു നൽകിയ നൈതികനിർദേശം
  choice: സൈനികസേവനം ഉപേക്ഷിക്കാൻ പറയാതെ, അധികാരദുരുപയോഗവും വ്യാജാരോപണവും അത്യാഗ്രഹവും ഒഴിവാക്കാൻ നേരിട്ട് നിർദേശിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഈ വാക്യം സൈനികസേവനത്തെ തന്നെ പരോക്ഷമായി അപലപിക്കുന്നു എന്നു വ്യക്തമാക്കുക.
  rationale: മൂലവാക്യം പടയാളികളോട് അവരുടെ നിലയിൽ തന്നെയാണ് സംസാരിക്കുന്നത്; തൊഴിൽ ഉപേക്ഷിക്കണമെന്ന നിർദേശം അതിലില്ല. അതിനാൽ അതിലുപരിയായ മതസിദ്ധാന്തനിഗമനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. സൈനികസന്ദർഭം വ്യക്തമാക്കിക്കൊണ്ട് സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു; മൂലത്തിലെ ‘ഞങ്ങളും’ എന്ന ഊന്നൽ സംരക്ഷിച്ചു.
