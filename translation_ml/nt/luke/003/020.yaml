source:
  edition: SBLGNT
  text: προσέθηκεν καὶ τοῦτο ἐπὶ πᾶσιν, ⸀καὶ κατέκλεισεν τὸν Ἰωάννην ⸀ἐν φυλακῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: ml
  text: 'ഹെരോദാവ് തന്റെ മറ്റെല്ലാ ദുഷ്‌പ്രവൃത്തികളോടും ഇതുകൂടി ചേർത്തു: അവൻ യോഹന്നാനെ തടവിലാക്കി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർത്ഥത്തിൽ: “ഇവയെല്ലാറ്റിനും പുറമേ ഇതുകൂടി ചേർത്തു.” ഹെരോദാവ് തന്റെ മറ്റു ദുഷ്‌പ്രവൃത്തികളോടൊപ്പം ഈ പ്രവൃത്തിയും കൂട്ടിച്ചേർത്തു എന്നാണ് അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: ചേർത്തു
  rationale: προστίθημι എന്ന ക്രിയ ഇവിടെ മുമ്പ് പറഞ്ഞ പ്രവൃത്തികളോടൊപ്പം മറ്റൊരു പ്രവൃത്തികൂടി കൂട്ടിച്ചേർത്തു എന്ന സഞ്ചിതമായ അർഥം നൽകുന്നു.
- source_word: τοῦτο
  choice: ഇതുകൂടി
  rationale: തുടർന്ന് പറയുന്ന യോഹന്നാന്റെ തടവിലാക്കലിലേക്കാണ് സൂചകസർവനാമം വിരൽചൂണ്ടുന്നത്; καί-യുടെ കൂട്ടിച്ചേർക്കൽഭാവവും ‘കൂടി’ വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ πᾶσιν
  choice: തന്റെ മറ്റെല്ലാ ദുഷ്‌പ്രവൃത്തികളോടും
  rationale: മുൻസന്ദർഭത്തിലെ ഹെരോദാവിന്റെ ദുഷ്‌പ്രവൃത്തികളോടുകൂടി ഈ പ്രവൃത്തിയും ചേർത്തു എന്ന പ്രയോഗാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ‘ദുഷ്‌പ്രവൃത്തികൾ’ എന്നത് 3:19-ലെ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν എന്ന അടുത്ത സന്ദർഭത്തിൽനിന്നാണ്.
- source_word: κατέκλεισεν
  choice: തടവിലാക്കി
  rationale: κατακλείω-യുടെ അടച്ചിടുക, ബന്ധനത്തിൽ പാർപ്പിക്കുക എന്ന അർഥം ἐν φυλακῇ-യോടൊപ്പം മലയാളത്തിൽ ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἰωάννην
  choice: യോഹന്നാനെ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἐν φυλακῇ
  choice: തടവിൽ
  rationale: φυλακή ഇവിടെ കാവലിലോ തടവറയിലോ ഉള്ള ബന്ധനാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; സംയുക്തമായി ‘തടവിലാക്കി’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ἐπὶ πᾶσιν എന്നതിന്റെ സൂചനയും പ്രയോഗബലവും
  choice: ഹെരോദാവ് മുമ്പത്തെ തന്റെ എല്ലാ ദുഷ്‌പ്രവൃത്തികളോടും യോഹന്നാനെ തടവിലാക്കിയ പ്രവൃത്തികൂടി ചേർത്തു.
  alternative: ‘ഇവയെല്ലാറ്റിനും പുറമേ ഇതുകൂടി ചേർത്തു’ എന്ന കൂടുതൽ അക്ഷരാർത്ഥപരമായ വിവർത്തനം.
  rationale: 3:19-ൽ പറഞ്ഞ ഹെരോദാവിന്റെ എല്ലാ ദുഷ്‌പ്രവൃത്തികളെയും 3:20 തുടർന്നെടുക്കുന്നു. പ്രധാനപാഠം ഈ സഞ്ചിതഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ അക്ഷരാർത്ഥപരമായ രൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘തടവിലാക്കി’ എന്ന സംക്ഷിപ്തരൂപം κατέκλεισεν ... ἐν φυλακῇ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം അനാവശ്യ ആവർത്തനമില്ലാതെ നൽകുന്നു.
