  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: ml
  text: മെത്തൂശലഹിന്റെ മകൻ, ഹാനോക്കിന്റെ മകൻ, യാരെദിന്റെ മകൻ, മഹലലേലിന്റെ മകൻ, കയിനാന്റെ മകൻ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ Καϊνάμ (കൈനാം); ഈ പേര് ‘കൈനാൻ’ എന്നും, പഴയനിയമ വംശാവലികളുമായി ഒത്തുനോക്കുമ്പോൾ ‘കേനാൻ’ എന്നും എഴുതാറുണ്ട്. ലൂക്കോസിന്റെ ഗ്രീക്ക് പാഠത്തിൽ ഈ പേര് ഉൾപ്പെട്ടിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: -ന്റെ മകൻ
  rationale: ലൂക്കോസിന്റെ വംശാവലിയിൽ ഓരോ പേരിനോടുമുള്ള ആവർത്തിത ഷഷ്ഠീവിഭക്തി മുൻവാക്യങ്ങളിലെ വംശാവലിസൂത്രം സംക്ഷിപ്തമായി തുടരുന്നു. ബന്ധം സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കാൻ മലയാളത്തിൽ ‘-ന്റെ മകൻ’ എന്നു ചേർത്തു.
- source_word: Μαθουσαλὰ
  choice: മെത്തൂശലഹ്
  rationale: ഉല്പത്തി വംശാവലിയിലെ ഇതേ വ്യക്തിയെ തിരിച്ചറിയാൻ സഹായിക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: Ἑνὼχ
  choice: ഹാനോക്ക്
  rationale: പഴയനിയമത്തിലെ ഇതേ വ്യക്തിയുമായി ബന്ധം വ്യക്തമാക്കുന്ന പരിചിതമായ മലയാള പേരുരൂപം സ്വീകരിച്ചു.
- source_word: Ἰάρετ
  choice: യാരെദ്
  rationale: ഉല്പത്തി വംശാവലിയിലെ വ്യക്തിയെ തിരിച്ചറിയാവുന്ന വിധത്തിൽ പ്രചാരത്തിലുള്ള മലയാള പേരുരൂപം സ്വീകരിച്ചു.
- source_word: Μαλελεὴλ
  choice: മഹലലേൽ
  rationale: പഴയനിയമ വംശാവലിയുമായി പേരിന്റെ ബന്ധം നിലനിർത്തുന്ന പരിചിതമായ മലയാള രൂപം ഉപയോഗിച്ചു.
- source_word: Καϊνὰμ
  choice: കയിനാൻ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ Καϊνάμ എന്ന പേര് ഒഴിവാക്കാതെയും പഴയനിയമ വംശാവലിയോട് നിശ്ശബ്ദമായി സമന്വയിപ്പിക്കാതെയും ധ്വന്യനുസൃതമായി നൽകി; മറ്റു രൂപങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: ലൂക്കോസിന്റെ വംശാവലിയിലെ ഷഷ്ഠീവിഭക്തിയുടെ അധ്യാഹാരം
  choice: ഓരോ പേരിനും ശേഷം ‘മകൻ’ എന്ന് വ്യക്തമാക്കി
  alternative: പേരുകൾ ‘-ന്റെ’ എന്ന ഷഷ്ഠീബന്ധത്തിൽ മാത്രം നിരത്തുക
  rationale: സന്ദർഭത്തിൽ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്ന പിതൃപുത്രബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു; ഗ്രീക്കിലുള്ള വംശാവലിയുടെ അർഥം മാറ്റുന്നില്ല.
- issue: Καϊνάμ എന്ന പേരിന്റെ അവതരണം
  choice: പ്രധാനപാഠത്തിൽ ‘കയിനാൻ’ ഉൾപ്പെടുത്തി
  alternative: കേനാൻ അഥവാ കൈനാൻ എന്നു നൽകുക; അല്ലെങ്കിൽ പഴയനിയമ വംശാവലിയോട് സമന്വയിപ്പിക്കുക
  rationale: SBLGNT ഗ്രീക്ക് പാഠത്തിൽ പേര് വ്യക്തമായി ഉള്ളതിനാൽ അത് പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചു. രൂപഭേദങ്ങൾ അടിക്കുറിപ്പിൽ നൽകിയെങ്കിലും പാഠത്തെ പഴയനിയമ പാരമ്പര്യങ്ങളോട് നിശ്ശബ്ദമായി ഒത്തുചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. മലയാളത്തിൽ പേരുകൾ മാത്രം ഷഷ്ഠീവിഭക്തിയിൽ നിരത്തുന്നത് ദുർഗ്രഹമാകുന്നതിനാൽ ഓരോ ഘട്ടത്തിലും ‘മകൻ’ ആവർത്തിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
