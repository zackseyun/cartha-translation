reference: Luke 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: ml
  text: ജനം ആകാംക്ഷയോടെ കാത്തിരിക്കുമ്പോൾ, എല്ലാവരും യോഹന്നാനെക്കുറിച്ച്, അദ്ദേഹംതന്നെ ഒരുപക്ഷേ മശീഹാ ആയിരിക്കുമോ എന്ന് തങ്ങളുടെ ഹൃദയങ്ങളിൽ ചിന്തിച്ചുകൊണ്ടിരുന്നു,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: ആകാംക്ഷയോടെ കാത്തിരിക്കയും
  rationale: ജനത്തിന്റെ തുടരുന്ന പ്രതീക്ഷാഭരിതമായ കാത്തിരിപ്പിനെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ജനിറ്റീവ് അബ്സല്യൂട്ട് പശ്ചാത്തലസാഹചര്യം സജ്ജമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ ശക്തമായ വിരോധമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ്; മലയാളത്തിലെ വാക്യഘടനയിൽ അത് സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: λαοῦ
  choice: ജനം
  rationale: λαός സൂചിപ്പിക്കുന്ന ജനസമൂഹത്തെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: διαλογιζομένων πάντων
  choice: എല്ലാവരും … ചിന്തിച്ചുകൊണ്ടിരിക്കയും
  rationale: അകത്തെ ആലോചനയും തുടരുന്ന പ്രവൃത്തിയും നിലനിർത്തുന്നു; 'ഹൃദയങ്ങളിൽ' എന്ന തുടർപ്രയോഗം അതിന്റെ അന്തർമുഖ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: ഹൃദയങ്ങളിൽ
  rationale: ചിന്തയും പരിഗണനയും ഉൾക്കൊള്ളുന്ന ബൈബിൾപരമായ 'ഹൃദയം' എന്ന രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: περὶ τοῦ Ἰωάννου
  choice: യോഹന്നാനെക്കുറിച്ച്
  rationale: περί + genitive എന്നതിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: μήποτε … εἴη
  choice: ഒരുപക്ഷേ … ആയിരിക്കുമോ
  rationale: പരോക്ഷമായ ആലോചനയിലെ സാധ്യതയും അനിശ്ചിതത്വവും, optative-ന്റെ മടിച്ചുനിൽക്കുന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: αὐτὸς
  choice: അദ്ദേഹംതന്നെ
  rationale: യോഹന്നാൻ തന്നെയോ എന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു; മാന്യമായ ആധുനിക പ്രയോഗം.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ വ്യക്തിപേരല്ല, പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തന്റെ പദവിയാണ്; യഹൂദ മശീഹാപ്രതീക്ഷയുടെ പശ്ചാത്തലം നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ വിവർത്തനം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: യോഹന്നാന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ജനങ്ങളുടെ പ്രതീക്ഷയുടെ പശ്ചാത്തലത്തിൽ ὁ χριστός വ്യക്തമായി 'അഭിഷിക്തൻ' എന്ന പദവിയായി പ്രവർത്തിക്കുന്നു. 'മശീഹാ' ആ ചരിത്ര-ദൈവശാസ്ത്രപരമായ അർത്ഥം നിലനിർത്തുന്നു; പകരം വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. 'ഹൃദയങ്ങളിൽ ചിന്തിച്ചു' എന്ന ബൈബിൾപരമായ രൂപകം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
