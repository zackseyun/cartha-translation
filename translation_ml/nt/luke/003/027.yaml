translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. പേരുകൾ തിരിച്ചറിയാവുന്ന കാനോനിക രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു; മൂലപാഠത്തിലെ ആവർത്തനഘടന കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
