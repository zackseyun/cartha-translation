source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτούς· Μηδὲν πλέον παρὰ τὸ διατεταγμένον ὑμῖν πράσσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/013.yaml
  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: ml
  text: 'അവൻ അവരോട് പറഞ്ഞു: “നിങ്ങൾക്കു നിശ്ചയിച്ചിട്ടുള്ളതിലധികം ഒന്നും പിരിക്കരുത്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “നിങ്ങൾക്കു നിശ്ചയിച്ചിട്ടുള്ളതിലധികം ഒന്നും ചെയ്യരുത്.” സന്ദർഭത്തിൽ ഈ ക്രിയ പ്രത്യേകമായി അവരുടെ ചുങ്കപ്പിരിവിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: അവൻ
  rationale: δέ മൃദുവായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിൽ പ്രത്യേക വിരോധമോ കാലക്രമമോ ചേർക്കാതെ കർത്താവിനെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: εἶπεν πρὸς αὐτούς
  choice: അവരോട് പറഞ്ഞു
  rationale: λέγω + πρός എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാള പരിഭാഷ.
- source_word: Μηδὲν πλέον
  choice: അധികം ഒന്നും ... അരുത്
  rationale: അനുവദിക്കപ്പെട്ട പരിധി കവിയുന്നതിനെ വിലക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: നിങ്ങൾക്കു നിശ്ചയിച്ചിട്ടുള്ളതിലധികം
  rationale: διατάσσω എന്നതിലെ ഔദ്യോഗികമായി നിശ്ചയിക്കുക/ആജ്ഞാപിക്കുക എന്ന ഭാവവും perfect passive രൂപത്തിലെ നിലവിലുള്ള നിർണയവും സംരക്ഷിക്കുന്നു.
- source_word: πράσσετε
  choice: പിരിക്കരുത്
  rationale: പദത്തിന് പൊതുവായി ‘ചെയ്യുക’ എന്ന അർത്ഥമുണ്ടെങ്കിലും, തൊട്ടുമുമ്പുള്ള വാക്യത്തിലെ ചുങ്കപ്പിരിവുകാരോടുള്ള സംഭാഷണം ഇവിടെ നികുതി പിരിക്കുന്ന പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘പിരിക്കുക’ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πράσσετε എന്ന ക്രിയയിൽ അന്തർലീനമായ പ്രവൃത്തിയുടെ സന്ദർഭാനുസൃത വ്യക്തമാക്കൽ
  choice: ചുങ്കം/നികുതി പിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ‘പിരിക്കരുത്’
  alternative: ‘നിങ്ങൾക്കു നിശ്ചയിച്ചിട്ടുള്ളതിലധികം ഒന്നും ചെയ്യരുത്’
  rationale: ഇത് സിദ്ധാന്തപരമായ നിർണയമല്ല. മുൻവാക്യത്തിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്നവർ ചുങ്കപ്പിരിവുകാരായതിനാൽ, വിശാലാർത്ഥമുള്ള ക്രിയ ഇവിടെ അവരുടെ പിരിവുപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ സന്ദർഭാർത്ഥം നൽകിയിട്ടും കൂടുതൽ പദാനുസൃതമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നിശ്ചയിച്ചിട്ടുള്ളത്’ ഔദ്യോഗിക നിർണയത്തിന്റെ ഭാവം നൽകുന്നു; ‘പിരിക്കുക’ ഉടൻമുമ്പുള്ള ചുങ്കപ്പിരിവുകാരുടെ സന്ദർഭം വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
