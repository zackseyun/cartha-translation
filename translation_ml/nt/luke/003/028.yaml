lexical_decisions:
- source_word: τοῦ
  choice: മകൻ
  rationale: വംശാവലിയുടെ ചുറ്റുപാടിൽ ആവർത്തിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി ആർട്ടിക്കിൾ ബന്ധം സൂചിപ്പിക്കുന്ന അപൂർണ്ണപ്രയോഗമാണ്. മലയാളത്തിൽ വെറും ‘-യുടെ’ എന്നു നൽകിയാൽ വാക്യം അസ്വാഭാവികവും ബന്ധം അവ്യക്തവുമാകുന്നതിനാൽ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘മകൻ’ ചേർത്തു.
- source_word: Μελχὶ
