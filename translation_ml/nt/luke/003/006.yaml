id: LUK.3.6
reference: Luke 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὄψεται πᾶσα σὰρξ τὸ σωτήριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/006.yaml
  text: and all flesh will see the salvation of God[a][b].
translation:
  language: ml
  text: സകല ജഡവും ദൈവത്തിന്റെ രക്ഷ കാണും[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സകല മനുഷ്യരും.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘സകല ജഡവും’ എന്നാണ്; ഇത് യെശയ്യാവ് 40:5-നെ പ്രതിധ്വനിപ്പിക്കുകയും ഇവിടെ എല്ലാ മനുഷ്യരെയും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദൈവത്തിൽനിന്നുള്ള രക്ഷ.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψεται
  choice: കാണും
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭാവികാലരൂപം ഇവിടെ നേരിട്ടുള്ള ഭാവിയർഥത്തിലാണ്. ‘കാണും’ എന്നത് ദൃശ്യഭാഷ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πᾶσα σὰρξ
  choice: സകല ജഡവും
  rationale: ഇത് യെശയ്യാവ് 40:5-ന്റെ പ്രതിധ്വനിയുള്ള പ്രവാചകശൈലിയിലെ പ്രയോഗമാണ്; സന്ദർഭത്തിൽ സകല മനുഷ്യരെയും സൂചിപ്പിക്കുന്നു. ‘എല്ലാ മനുഷ്യരും’ എന്നു അർഥം വ്യക്തമാക്കാമെങ്കിലും, മൂലത്തിലെ ‘ജഡം’ എന്ന രൂപകവും അന്തർപാഠബന്ധവും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: σωτήριον
  choice: രക്ഷ
  rationale: ആർട്ടിക്കിളോടുകൂടി നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന σωτήριον ദൈവത്തിന്റെ രക്ഷാപ്രവൃത്തിയുടെ വിശാലതയും യെശയ്യാവുമായുള്ള ബന്ധവും നിലനിർത്തുന്ന വിധത്തിൽ ‘രക്ഷ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠിവിഭക്തിഘടന ഔപചാരികമായി നിലനിർത്തുന്നു. ഇത് ദൈവത്തിന്റേതായ രക്ഷയെന്നോ ദൈവത്തിൽനിന്നുള്ള രക്ഷയെന്നോ ഉള്ള അർഥസാധ്യത തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: πᾶσα σὰρξ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: സകല മനുഷ്യരെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തി; എന്നാൽ മുഖ്യപാഠത്തിൽ ‘സകല ജഡവും’ എന്നു നിലനിർത്തുന്നു.
  alternative: ശരീരമുള്ള സൃഷ്ടികളെയാകെ സൂചിപ്പിക്കുന്ന കൂടുതൽ അക്ഷരാർഥപരമായ വായന.
  rationale: യെശയ്യാവിൽനിന്നുള്ള ഉദ്ധരണിയുടെ സന്ദർഭത്തിൽ ഈ സെമിറ്റിക് പ്രയോഗം മനുഷ്യരാശിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു. അക്ഷരരൂപം നിലനിർത്തുന്നത് പ്രവാചകപ്രതിധ്വനിയും ദൈവശാസ്ത്രപരമായ ഭാവവും സംരക്ഷിക്കുന്നു.
- issue: τοῦ θεοῦ എന്ന ഷഷ്ഠിവിഭക്തിയുടെ ബന്ധം
  choice: ‘ദൈവത്തിന്റെ രക്ഷ’ എന്ന തുറന്ന ഘടന.
  alternative: ‘ദൈവത്തിൽനിന്നുള്ള രക്ഷ’ എന്ന ഉറവിടാർഥം.
  rationale: മൂലത്തിലെ ഷഷ്ഠിവിഭക്തിക്ക് ഉടമസ്ഥതയോ ഉറവിടമോ സൂചിപ്പിക്കാനാകുന്നതിനാൽ മുഖ്യപാഠം അതിനെ ഒരു അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സകല ജഡവും’ സാധാരണ സംസാരഭാഷയേക്കാൾ ഉയർന്ന പ്രവാചകശൈലിയാണെങ്കിലും, മൂലപാഠത്തിന്റെ രൂപകവും യെശയ്യാവുമായുള്ള അന്തർപാഠബന്ധവും സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
