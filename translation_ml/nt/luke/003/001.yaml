    rationale: «ഇതൂറിയയുടെയും ത്രഖോനീത്തിസ് പ്രദേശത്തിന്റെയും ടെട്രാർക്കായിരിക്കെ» clearly conveys that Philip held office over the combined region indicated by χώρας.
