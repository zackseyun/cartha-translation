reference: Luke 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: ml
  text: തിബെരിയോസ് കൈസറുടെ ഭരണത്തിന്റെ പതിനഞ്ചാം വർഷത്തിൽ[a], പൊന്തിയോസ് പീലാത്തോസ് യെഹൂദ്യയെ ഭരിച്ചുകൊണ്ടിരിക്കെയും, ഹെരോദാവ് ഗലീലയുടെ ടെട്രാർക്കായിരിക്കെയും, അവന്റെ സഹോദരനായ ഫിലിപ്പോസ് ഇതൂറിയയുടെയും ത്രഖോനീത്തിസ് പ്രദേശത്തിന്റെയും ടെട്രാർക്കായിരിക്കെയും, ലുസാനിയാസ് അബിലേനയുടെ ടെട്രാർക്കായിരിക്കെയും[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പതിനഞ്ചാം ഭരണവർഷത്തിൽ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ടെട്രാർക്ക്’ റോമൻ അധികാരത്തിൻ കീഴിൽ ഒരു പ്രദേശം ഭരിച്ചിരുന്ന പ്രാദേശിക ഭരണാധികാരിയുടെ പദവിയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ
  choice: പതിനഞ്ചാം വർഷത്തിൽ
  rationale: കാലസൂചന നൽകുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. δέ ഇവിടെ നേരിയ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം പദമായി വിവർത്തനം ചെയ്യാതെ വാക്യക്രമത്തിലൂടെ അതിന്റെ പ്രവാഹം നിലനിർത്തി.
- source_word: ἡγεμονίας
  choice: ഭരണം
  rationale: തിബെരിയോസ് കൈസറുടെ സാമ്രാജ്യാധിപത്യകാലത്തെ സൂചിപ്പിക്കാൻ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ പദം.
- source_word: ἡγεμονεύοντος
  choice: ഭരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: പദത്തെ ഔദ്യോഗിക സ്ഥാനപ്പേരാക്കി മാറ്റാതെ അതിന്റെ ക്രിയാത്മകവും സാഹചര്യപരവുമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: τετρααρχοῦντος
  choice: ചതുർഭരണാധികാരിയായും ... ഇരിക്കുമ്പോൾ
  rationale: റോമൻ അധികാരത്തിനു കീഴിലുള്ള പ്രത്യേക പ്രാദേശിക ഭരണപദവി പൊതുവായ ‘ഭരണാധികാരി’ എന്നതിലേക്ക് ചുരുക്കാതെ ചരിത്രപരമായ സവിശേഷത നിലനിർത്തുന്നു.
- source_word: Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ
  choice: അവന്റെ സഹോദരനായ ഫിലിപ്പോസ്
  rationale: αὐτοῦ എന്ന സർവനാമം ഹെരോദാവിനെ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: ഇതുര്യയുടെയും ത്രഖോനീത്തിസ് പ്രദേശത്തിന്റെയും
  rationale: χώρας എന്നതിലെ പ്രദേശം/ഭൂപ്രദേശം എന്ന ആശയം ഒഴിവാക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: τετρααρχοῦντος എന്ന രാഷ്ട്രീയ സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: ചതുർഭരണാധികാരി
  alternative: പ്രാദേശിക ഭരണാധികാരി / ഭരണാധികാരി
  rationale: ഇത് പ്രധാനമായും ചരിത്രപരമായ വിഷയമാണെങ്കിലും, ഗ്രീക്കിലെ പ്രത്യേക പദവി പൊതുവായ ഭരണസങ്കൽപ്പമാക്കി മാറ്റാതിരിക്കാൻ സവിശേഷ സ്ഥാനപ്പേര് നിലനിർത്തി; അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ തുടർച്ചയും ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന ഘടനയും സൂചിപ്പിക്കാൻ അവസാനം അർധവിരാമമല്ല, കോമ നിലനിർത്തി. സ്ഥലനാമങ്ങൾ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണരീതിയിൽ നൽകി.
