    rationale: τετρααρχοῦντος denotes holding office as a tetrarch, a regional ruler; it does not in this context mean a ruler over four territories. A transliterated title with a cultural note better preserves source specificity.
  - severity: low
    issue: «യെഹൂദ്യ ഭരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ» lacks standard object marking.
    rationale: «യെഹൂദ്യയെ ഭരിച്ചുകൊണ്ടിരിക്കെ» is the natural modern-standard Malayalam construction and retains the participial, circumstantial sense.
  - severity: low
