  text: ശിമെയോന്റെ മകൻ, യെഹൂദയുടെ മകൻ[a], യോസേഫിന്റെ മകൻ, യോനാമിന്റെ മകൻ, എല്യാക്കീമിന്റെ മകൻ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ἰούδα എന്ന ഗ്രീക്ക് പേര് ‘യൂദാ’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഈ വംശാവലി സന്ദർഭത്തിൽ ‘യെഹൂദ’ എന്ന രൂപമാണ് കൂടുതൽ യോജിച്ചത്.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിലും പരിഭാഷാപാരമ്പര്യങ്ങളിലും ‘യോനാം’ എന്ന പേരിനു പകരം ‘യോനാൻ’ എന്ന രൂപം കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: മകൻ
  rationale: ലൂക്കോസിന്റെ വംശാവലിയിൽ ആവർത്തിക്കുന്ന ജനിറ്റീവ് ആർട്ടിക്കിൾ മുൻവാക്യങ്ങളിൽനിന്നു തുടരുന്ന ബന്ധസൂത്രത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പേരിനോടു ചേർന്ന ‘-ന്റെ മകൻ’ എന്ന പ്രയോഗം ആ അർത്ഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Συμεὼν
  choice: ശിമെയോൻ
  rationale: സെമിറ്റിക് പേരിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തോടും ഗ്രീക്ക് രൂപത്തോടും യോജിക്കുന്ന തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണം.
- source_word: Ἰούδα
  choice: യെഹൂദ
  rationale: ഗ്രീക്ക് രൂപം ‘യൂദാ’ എന്നും നൽകാനാകുമെങ്കിലും, ഈ വംശാവലി സന്ദർഭത്തിൽ അടിസ്ഥാനത്തിലുള്ള യെഹൂദാ എന്ന സെമിറ്റിക് പേരിനെ ‘യെഹൂദ’ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Ἰωσὴφ
  choice: യോസേഫ്
  rationale: പേരിന്റെ ഗ്രീക്ക് ഉച്ചാരണരൂപത്തെയും നിലവിലെ സ്വാഭാവിക മലയാള പ്രയോഗത്തെയും പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: Ἰωνὰμ
  choice: യോനാം
  rationale: SBLGNTയിലെ Ἰωνάμ എന്ന രൂപത്തിന്റെ അവസാന മ്യൂ ശബ്ദം നിലനിർത്തുന്ന നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: Ἐλιακὶμ
  choice: എല്യാക്കീം
  rationale: സെമിറ്റിക് വ്യക്തിനാമത്തിന്റെ പരിചിതവും വായനാസൗകര്യമുള്ളതുമായ മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിയുടെ ആവർത്തനഘടന നിലനിർത്തിക്കൊണ്ട് ഓരോ പേരിനുമുള്ള ബന്ധം ‘മകൻ’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പേരുകൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
