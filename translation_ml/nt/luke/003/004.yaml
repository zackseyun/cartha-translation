id: LUK.3.4
reference: Luke 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ml
  text: 'യെശയ്യാ പ്രവാചകന്റെ വചനങ്ങളുടെ പുസ്തകത്തിൽ ഇങ്ങനെ എഴുതിയിരിക്കുന്നു:


    “മരുഭൂമിയിൽ വിളിച്ചുപറയുന്ന ഒരാളുടെ ശബ്ദം[a]:


    ‘കർത്താവിന്റെ വഴി ഒരുക്കുക[b];


    അവന്റെ പാതകൾ നേരെയാക്കുക.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“മരുഭൂമിയിൽ” എന്നത് ഇവിടെ “വിളിച്ചുപറയുന്ന” എന്നതിനോടു ചേർത്ത് മനസ്സിലാക്കാം. അല്ലെങ്കിൽ തുടർന്നുള്ള ആജ്ഞയോടു ചേർത്ത്, “വിളിച്ചുപറയുന്ന ഒരാളുടെ ശബ്ദം: ‘മരുഭൂമിയിൽ കർത്താവിന്റെ വഴി ഒരുക്കുക’” എന്നും മനസ്സിലാക്കാം.'
    reason: alternative_reading
  - marker: b
    text: ഈ ഉദ്ധരണിയുടെ പശ്ചാത്തലമായ യെശയ്യാവ് 40:3-ലെ എബ്രായപാഠത്തിൽ ദൈവനാമമായ YHWH ഉണ്ട്. അതിനാൽ ഇവിടെ “കർത്താവ്” എന്നതിന് “യഹോവ” എന്നും വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്നതിനുള്ള ഗ്രീക്ക് പൂർണകാല കർമണിപ്രയോഗത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: βίβλῳ λόγων
  choice: വചനങ്ങളുടെ പുസ്തകത്തിൽ
  rationale: βίβλῳ, λόγων എന്നീ രണ്ടു പദങ്ങളെയും നിലനിർത്തുന്ന ഔപചാരികവും മനസ്സിലാക്കാൻ എളുപ്പവുമായ പ്രയോഗം; പുരാതനകാലത്ത് ഇത് ചുരുൾ ആയിരുന്നേക്കാമെങ്കിലും ഇവിടെ ‘പുസ്തകം’ സ്വാഭാവികമാണ്.
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: യെശയ്യാ പ്രവാചകന്റെ
  rationale: ഉദ്ധരിച്ച വചനങ്ങളുടെ ഉറവിടം വ്യക്തമാക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: Φωνὴ βοῶντος
  choice: വിളിച്ചുപറയുന്ന ഒരാളുടെ ശബ്ദം
  rationale: βοῶντος എന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന കൃതന്തത്തിന്റെ അർഥവും φωνή എന്നതിന്റെ ‘ശബ്ദം’ എന്ന അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: ജനവാസമില്ലാത്ത വിജനപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ἔρημος എന്ന പദത്തിന് പ്രസക്തമായ സ്വാഭാവിക മലയാളം; ഗ്രീക്ക് വാക്യക്രമമനുസരിച്ച് ഇത് ‘വിളിച്ചുപറയുന്ന’ എന്നതിനോടു ചേർത്തിരിക്കുന്നു, എന്നാൽ മറ്റൊരു ബന്ധസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Ἑτοιμάσατε
  choice: ഒരുക്കുക
  rationale: ആജ്ഞാരൂപത്തിന്റെ ശക്തി ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: τὴν ὁδὸν κυρίου
  choice: കർത്താവിന്റെ വഴി
  rationale: വരാനിരിക്കുന്ന കർത്താവിനായി വഴി സജ്ജമാക്കുന്ന രൂപകം നിലനിർത്തുന്ന, തിരുവെഴുത്തുപരമായും സ്വാഭാവികമായും ഉള്ള പ്രയോഗം.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: ലൂക്കൊസിന്റെ ഗ്രീക്ക് പാഠത്തിലെ κύριος എന്ന പദം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; യെശയ്യാവിലെ YHWH എന്ന ദൈവനാമപശ്ചാത്തലം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: εὐθείας ποιεῖτε
  choice: നേരെയാക്കുക
  rationale: വിശേഷണവും ക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആജ്ഞാശക്തിയും വഴി ഒരുക്കുന്ന രൂപകവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰς τρίβους αὐτοῦ
  choice: അവന്റെ പാതകൾ
  rationale: τρίβοι എന്ന ബഹുവചനത്തെയും αὐτοῦ എന്ന സർവനാമത്തെയും നിലനിർത്തി ‘വഴി’ എന്ന സമാന്തര പദവുമായി യോജിക്കുന്നു.
theological_decisions:
- issue: YHWH-നെ സൂചിപ്പിക്കുന്ന യെശയ്യാ ഉദ്ധരണിയിലെ κύριος എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: കർത്താവ്
  alternative: യഹോവ / ദൈവനാമത്തെ സൂചിപ്പിക്കുന്ന പ്രത്യേക രൂപം
  rationale: ലൂക്കൊസിന്റെ ഗ്രീക്ക് പാഠം κύριος എന്നാണ് വായിക്കുന്നത്; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘കർത്താവ്’ സ്വീകരിക്കുന്നു. അതേസമയം യെശയ്യാവ് 40:3-ലെ എബ്രായപാഠത്തിൽ YHWH എന്ന ദൈവനാമമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു. ഇതുവഴി പഴയനിയമ പശ്ചാത്തലവും ലൂക്കൊസിലെ ക്രിസ്തുശാസ്ത്രപരമായ അനുരണനവും അമിതമായി നിർവചിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രവാചകീയ ശൈലി സ്വീകരിച്ചു. ഉദ്ധരണിയുടെ കാവ്യാത്മക സമാന്തരഘടന വരിവിഭജനത്തിലൂടെ പ്രകടമാക്കി. പൊതുവായ ആജ്ഞാരൂപമായ ‘ഒരുക്കുക / നേരെയാക്കുക’ ഉപയോഗിച്ചതിനാൽ ഗ്രീക്കിലെ ബഹുവചന അഭിസംബോധന മലയാളത്തിൽ കൃത്രിമമായി അടിച്ചേൽപ്പിച്ചിട്ടില്ല.
