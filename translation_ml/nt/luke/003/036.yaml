  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ഓരോ പേരിനോടും ‘മകൻ’ ആവർത്തിച്ച് ഗ്രീക്ക് ഘടനയിലെ ബന്ധം വായനക്കാരന് വ്യക്തമാക്കുന്നു; സ്ഥാപിതമായ മലയാള നാമരൂപങ്ങൾ ഉള്ളിടത്ത് അവയും, നിർണായകമായ ഗ്രീക്ക്-എബ്രായ വ്യത്യാസമുള്ളിടത്ത് ഗ്രീക്കിനോട് അടുത്ത രൂപവും സ്വീകരിച്ചു.
