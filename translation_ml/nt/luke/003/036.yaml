- source_word: Ἀρφαξὰδ
  choice: അർഫക്സാദ്
  rationale: പഴയനിയമത്തിലെ എബ്രായരൂപം അടിച്ചേൽപ്പിക്കാതെ ലൂക്കൊസിലെ ഗ്രീക്ക് നാമരൂപത്തോട് അടുത്തുനിൽക്കുന്ന ലിപ്യന്തരണം.
- source_word: Σὴμ
  choice: ശേം
  rationale: മലയാളത്തിൽ പരിചിതമായ ബൈബിൾ നാമരൂപം ഉപയോഗിക്കുന്നു; ഗ്രീക്ക് Σὴμ-നെയും വ്യക്തമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: Νῶε
