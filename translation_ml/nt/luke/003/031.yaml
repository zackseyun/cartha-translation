  text: മെലെയാവിന്റെ മകൻ[a], മെന്നാവിന്റെ മകൻ, മത്തത്താവിന്റെ മകൻ, നാഥാന്റെ മകൻ, ദാവീദിന്റെ മകൻ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥമായി: ‘മെലെയാവിന്റെ, മെന്നാവിന്റെ, മത്തത്താവിന്റെ, നാഥാന്റെ, ദാവീദിന്റെ.’ ലൂക്കോസിന്റെ വംശാവലിയിലെ ആവർത്തിത ഘടനയിൽ ‘മകൻ’ എന്ന ബന്ധം അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്നു.'
