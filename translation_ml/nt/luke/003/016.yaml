revisions:
- from: 'യോഹന്നാൻ എല്ലാവരോടും മറുപടിയായി പറഞ്ഞു: “ഞാൻ നിങ്ങളെ വെള്ളത്തിൽ സ്നാനം കഴിപ്പിക്കുന്നു[a]. എന്നാൽ എന്നെക്കാൾ ശക്തനായ ഒരാൾ വരുന്നു[b]. അവന്റെ ചെരിപ്പുകളുടെ വാറ് അഴിക്കാൻപോലും ഞാൻ യോഗ്യനല്ല. അവൻ നിങ്ങളെ പരിശുദ്ധാത്മാവിലും തീയിലും സ്നാനം കഴിപ്പിക്കും[c][d].”'
  to: 'യോഹന്നാൻ എല്ലാവർക്കും മറുപടി പറഞ്ഞു: “ഞാൻ നിങ്ങളെ വെള്ളത്തിൽ സ്നാനം കഴിപ്പിക്കുന്നു[a]. എന്നാൽ എന്നെക്കാൾ ശക്തനായ ഒരാൾ വരുന്നു[b]. അവന്റെ ചെരുപ്പിന്റെ വാറ് അഴിക്കാൻ ഞാൻ യോഗ്യനല്ല. അവൻതന്നെ നിങ്ങളെ പരിശുദ്ധാത്മാവിലും തീയിലും സ്നാനം കഴിപ്പിക്കും[c][d].”'
