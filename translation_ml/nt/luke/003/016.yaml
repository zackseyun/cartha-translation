id: LUK.3.16
reference: Luke 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: ml
  text: 'യോഹന്നാൻ എല്ലാവർക്കും മറുപടി പറഞ്ഞു: “ഞാൻ നിങ്ങളെ വെള്ളത്തിൽ സ്നാനം കഴിപ്പിക്കുന്നു[a]. എന്നാൽ എന്നെക്കാൾ ശക്തനായ ഒരാൾ വരുന്നു[b]. അവന്റെ ചെരുപ്പിന്റെ വാറ് അഴിക്കാൻ ഞാൻ യോഗ്യനല്ല. അവൻതന്നെ നിങ്ങളെ പരിശുദ്ധാത്മാവിലും തീയിലും സ്നാനം കഴിപ്പിക്കും[c][d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വെള്ളംകൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ദത്തിവിഭക്തി ഇവിടെ മാധ്യമത്തെയോ ഘടകത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്നെക്കാൾ അധികം ശക്തിയുള്ളവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘പരിശുദ്ധാത്മാവുകൊണ്ടും തീകൊണ്ടും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘പരിശുദ്ധാത്മാവിലും തീയിലും’ എന്നാണ്; അവ്യയത്തിന്റെ കൃത്യമായ സൂക്ഷ്മാർഥം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: d
    text: ‘തീ’ ശുദ്ധീകരണത്തെയോ ന്യായവിധിയെയോ, അല്ലെങ്കിൽ ആത്മാവും തീയും ചേർന്ന ഒരൊറ്റ സ്നാനചിത്രത്തിന്റെ ഭാഗത്തെയോ സൂചിപ്പിക്കാം; പരിഭാഷ മൂലപ്രയോഗം വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: യോഹന്നാൻ എല്ലാവരോടും മറുപടിയായി പറഞ്ഞു
  rationale: പ്രതികരണത്തിന്റെ അർഥവും λέγων എന്ന ആഖ്യാനപരമായ അവതരണവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; πᾶσιν എന്നത് ‘എല്ലാവരോടും’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς
  choice: ഞാൻ നിങ്ങളെ വെള്ളത്തിൽ സ്നാനം കഴിപ്പിക്കുന്നു
  rationale: μέν സൂചിപ്പിക്കുന്ന തുടർന്നുവരുന്ന വൈരുധ്യം മലയാളത്തിലെ വാക്യക്രമവും ‘എന്നാൽ’ എന്ന തുടർബന്ധവും പ്രകടമാക്കുന്നു. ὕδατι എന്ന ദത്തി ഇവിടെ മാധ്യമമോ ഘടകമോ സൂചിപ്പിക്കാം; ‘വെള്ളത്തിൽ’ ആ രൂപകത്തെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: βαπτίζω / βαπτίσει
  choice: സ്നാനം കഴിപ്പിക്കുന്നു / സ്നാനം കഴിപ്പിക്കും
  rationale: സുവിശേഷസന്ദർഭത്തിൽ സാധാരണവും മതവിഭാഗപരമായ പ്രത്യേക നിർവചനങ്ങൾ ഒഴിവാക്കുന്നതുമായ പ്രയോഗമാണിത്; ‘മുക്കുക’ എന്ന ഒറ്റ രീതിയെ വാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: ἔρχεται δὲ ὁ ἰσχυρότερός μου
  choice: എന്നാൽ എന്നെക്കാൾ ശക്തനായ ഒരാൾ വരുന്നു
  rationale: δὲ എന്ന വൈരുധ്യവും ἰσχυρότερος എന്ന താരതമ്യാർഥവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: അവന്റെ ... ഞാൻ യോഗ്യനല്ല
  rationale: ഈ വിനയപ്രസ്താവനയിൽ ἱκανός എന്നത് കഴിവിനേക്കാൾ യോഗ്യതയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യോഗ്യനല്ല’ യോജിക്കുന്നു.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: അവന്റെ ചെരിപ്പുകളുടെ വാറ് അഴിക്കാൻപോലും
  rationale: താഴ്മയുള്ള ഒരു സേവകന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന മൂലചിത്രം വ്യക്തമായി നിലനിർത്തുന്നു; ‘പോലും’ വാക്യത്തിന്റെ വിനയബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: αὐτὸς ὑμᾶς βαπτίσει
  choice: അവൻ നിങ്ങളെ ... സ്നാനം കഴിപ്പിക്കും
  rationale: αὐτός യോഹന്നാനെയും വരാനിരിക്കുന്നവനെയും തമ്മിൽ ഊന്നിപ്പറയുന്ന വൈരുധ്യം സൃഷ്ടിക്കുന്നു; മലയാളത്തിൽ ‘അവൻ’ അതു സന്ദർഭോചിതമായി വഹിക്കുന്നു.
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: പരിശുദ്ധാത്മാവിലും തീയിലും
  rationale: ἐν എന്നതിന്റെ മാധ്യമം, മണ്ഡലം, ഘടകം തുടങ്ങിയ സാദ്ധ്യമായ സൂക്ഷ്മതകളെ ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ ‘-ഇൽ’ രൂപം സംരക്ഷിക്കുന്നു. πνεῦμα ἅγιον ദൈവിക പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതിനാൽ അതനുസരിച്ചുള്ള മലയാളരൂപം ഉപയോഗിക്കുന്നു; ‘തീ’ വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘പരിശുദ്ധാത്മാവിലും തീയിലും സ്നാനം കഴിപ്പിക്കും’ എന്നതിലെ തീയുടെ അർഥം
  choice: ശുദ്ധീകരണമോ ന്യായവിധിയോ രണ്ടും ഉൾപ്പെടുന്ന ഏക ചിത്രമോ എന്ന് മുഖ്യവാചകത്തിൽ നിർണയിക്കാതെ മൂലപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ശുദ്ധീകരിക്കുന്ന തീയാകുന്ന പരിശുദ്ധാത്മാവിൽ’ എന്നോ, ചിലരെ പരിശുദ്ധാത്മാവിലും മറ്റുള്ളവരെ ന്യായവിധിയുടെ തീയിലും സ്നാനം കഴിപ്പിക്കും എന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാചകം സംക്ഷിപ്തമാണ്; അടുത്ത സന്ദർഭം ഒന്നിലധികം വ്യാഖ്യാനങ്ങൾക്ക് ഇട നൽകുന്നു. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ തീർപ്പാക്കാതെ സംരക്ഷിച്ചു.
- issue: ἐν എന്ന അവ്യയത്തിന്റെ അർഥം
  choice: ‘പരിശുദ്ധാത്മാവിലും തീയിലും’ എന്നു നൽകി മണ്ഡലം/ഘടകം എന്ന ഭാഷാരൂപം നിലനിർത്തി.
  alternative: ‘പരിശുദ്ധാത്മാവുകൊണ്ടും തീകൊണ്ടും’ എന്നു നൽകി ഉപകരണമോ മാധ്യമമോ എന്ന അർഥം മുൻനിർത്തുക.
  rationale: ἐν ഇവിടെ മാധ്യമം, മണ്ഡലം, അല്ലെങ്കിൽ ഘടകം എന്നിങ്ങനെ ഗ്രഹിക്കാവുന്നതിനാൽ ഒരു വ്യാഖ്യാനം മാത്രം മുഖ്യവാചകത്തിൽ ഉറപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സ്നാനം കഴിപ്പിക്കുക’, ‘പരിശുദ്ധാത്മാവ്’ എന്നിവ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ ബൈബിൾ പദങ്ങളാണ്. പഴഞ്ചൻ പദങ്ങളും ഏതെങ്കിലും പ്രത്യേക സ്നാനരീതിയെ നിർബന്ധിക്കുന്ന മതവിഭാഗപരമായ ഭാഷയും ഒഴിവാക്കി.
