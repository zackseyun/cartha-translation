id: LUK.3.7
reference: Luke 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ml
  text: 'അതിനാൽ, അദ്ദേഹത്തിൽനിന്ന് സ്നാനം സ്വീകരിക്കാൻ പുറപ്പെട്ടുവന്ന ജനക്കൂട്ടങ്ങളോട് അദ്ദേഹം പറഞ്ഞുകൊണ്ടിരുന്നു: “അണലികളുടെ സന്തതികളേ,[a] വരാനിരിക്കുന്ന കോപത്തിൽനിന്ന് ഓടിയകലാൻ നിങ്ങൾക്ക് മുന്നറിയിപ്പു നൽകിയത് ആര്?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അണലിക്കുഞ്ഞുങ്ങളേ.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “വരുവാനുള്ള കോപത്തിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലക്രിയയുടെ തുടർച്ചയോ ആവർത്തനമോ സൂചിപ്പിക്കുന്ന ഭാവം അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള ആഖ്യാനപരവും യുക്തിപരവുമായ തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: പുറപ്പെട്ടുവന്ന ജനക്കൂട്ടങ്ങളോട്
  rationale: യോഹന്നാന്റെ അടുക്കലേക്കുള്ള പുറത്തേക്കുള്ള നീക്കവും ബഹുവചനമായ ὄχλοις എന്നതും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: തന്റെ അടുക്കൽനിന്ന് സ്നാനം ഏൽക്കാൻ
  rationale: നിഷ്ക്രിയക്രിയാഭാവവും ഉദ്ദേശ്യവും നിലനിർത്തുന്നു; αὐτοῦ എന്ന സർവനാമത്തിനു പകരം യോഹന്നാൻ എന്ന പേര് ചേർക്കുന്നില്ല.
- source_word: Γεννήματα ἐχιδνῶν
  choice: അണലികളുടെ സന്തതികളേ
  rationale: γέννημα എന്നതിന്റെ ജനിച്ചത്/ഉത്ഭവിച്ചത് എന്ന നേരിട്ടുള്ള അർഥവും ἔχιδνα എന്ന വിഷപ്പാമ്പിന്റെ ദൃശ്യബലവും സംരക്ഷിക്കുന്നു.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: നിങ്ങൾക്ക് മുന്നറിയിപ്പു നൽകിയത് ആര്?
  rationale: വരാനിരിക്കുന്ന അപകടത്തിന്റെ സന്ദർഭത്തിൽ ὑποδείκνυμι എന്നതിന്റെ മുന്നറിയിപ്പുനൽകുക എന്ന പ്രയോഗശക്തി വ്യക്തമാക്കുന്നു.
- source_word: φυγεῖν
  choice: ഓടിയകലാൻ
  rationale: അപകടത്തിൽനിന്നുള്ള സജീവമായ പലായനത്തിന്റെ ദൃശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: വരാനിരിക്കുന്ന കോപത്തിൽനിന്ന്
  rationale: μέλλουσα സൂചിപ്പിക്കുന്ന ഭാവിയിലെ വരവും ὀργή എന്ന വിശാലമായ ന്യായവിധിസംബന്ധമായ പദവും ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ മുന്നറിയിപ്പിലെ ὀργήയുടെ സ്വഭാവം
  choice: ദൈവത്തിന്റെ വരാനിരിക്കുന്ന ന്യായവിധിയെ സൂചിപ്പിക്കാൻ ‘കോപം’ എന്ന വിശാലപദം നിലനിർത്തി
  alternative: ‘അന്ത്യന്യായവിധി’ എന്നോ ‘ചരിത്രത്തിലെ ശിക്ഷ’ എന്നോ പ്രത്യേകമായി നിർവചിക്കുക
  rationale: സന്ദർഭം മാനസാന്തരത്തെയും ദൈവിക ന്യായവിധിയെയും ബന്ധിപ്പിക്കുന്നുവെങ്കിലും അതിനെ ഒരു പ്രത്യേക കാലാന്ത്യപദ്ധതിയിലേക്കോ ചരിത്രസംഭവത്തിലേക്കോ മാത്രമായി പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ശാസനയുടെ കാഠിന്യം മൃദൂകരിച്ചിട്ടില്ല; അതേസമയം അനാവശ്യമായ സഭാവിഭാഗീയ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി.
