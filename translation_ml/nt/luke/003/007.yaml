revisions:
- from: 'അതിനാൽ, തന്റെ അടുക്കൽനിന്ന് സ്നാനം ഏൽക്കാൻ പുറപ്പെട്ടുവന്ന ജനക്കൂട്ടങ്ങളോട് അദ്ദേഹം പറഞ്ഞുകൊണ്ടിരുന്നു: “അണലികളുടെ സന്തതികളേ,[a] വരാനിരിക്കുന്ന കോപത്തിൽനിന്ന് ഓടിയകലാൻ നിങ്ങൾക്ക് മുന്നറിയിപ്പു നൽകിയത് ആര്?[b]”'
  to: 'അതിനാൽ, അദ്ദേഹത്തിൽനിന്ന് സ്നാനം സ്വീകരിക്കാൻ പുറപ്പെട്ടുവന്ന ജനക്കൂട്ടങ്ങളോട് അദ്ദേഹം പറഞ്ഞുകൊണ്ടിരുന്നു: “അണലികളുടെ സന്തതികളേ,[a] വരാനിരിക്കുന്ന കോപത്തിൽനിന്ന് ഓടിയകലാൻ നിങ്ങൾക്ക് മുന്നറിയിപ്പു നൽകിയത് ആര്?[b]”'
  rationale: 'Only the baptism clause is revised, because the draft’s “തന്റെ അടുക്കൽനിന്ന്” fails to express the Greek passive agent ὑπ’ αὐτοῦ clearly. The remaining wording and both footnote anchors are retained: [a] follows the viper/offspring address, and [b] follows the phrase concerning coming wrath.'
