reference: Luke 3:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: ml
  text: എന്നാൽ, തെത്രാർക്കായ ഹെരോദാവ് തന്റെ സഹോദരന്റെ ഭാര്യയായ ഹെരോദ്യയെ സംബന്ധിച്ചും താൻ ചെയ്ത എല്ലാ തിന്മകളെ സംബന്ധിച്ചും അവനാൽ ശാസിക്കപ്പെട്ടിരുന്നപ്പോൾ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τετραάρχης
  choice: ചതുർഭാഗാധിപൻ
  rationale: ഒരു പ്രദേശത്തിന്റെ നാലിലൊന്നിന്റെ ഭരണാധികാരിയെ ആദ്യം സൂചിപ്പിച്ചിരുന്ന പ്രത്യേക ചരിത്ര-രാഷ്ട്രീയ പദവി നിലനിർത്തുന്നു; വെറും ‘ഭരണാധികാരി’ എന്നു പൊതുവാക്കുന്നില്ല.
- source_word: ἐλεγχόμενος
  choice: ശാസിക്കപ്പെട്ടിരുന്ന
  rationale: സന്ദർഭത്തിൽ പ്രവാചകസ്വഭാവമുള്ള ധാർമിക കുറ്റപ്പെടുത്തലാണ് മുഖ്യം; വർത്തമാനകാല പങ്കുപദത്തിന്റെ സമകാലിക/തുടർച്ചയായ ഭാവം ‘-പ്പെട്ടിരുന്ന’ വഴി സൂചിപ്പിക്കുന്നു.
- source_word: ὑπ’ αὐτοῦ
  choice: അവനാൽ
  rationale: സർവനാമം സന്ദർഭത്തിൽ യോഹന്നാനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തിലെ സർവനാമരൂപം പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: περὶ Ἡρῳδιάδος
  choice: ഹെരോദ്യയെ സംബന്ധിച്ചും
  rationale: ആവർത്തിക്കുന്ന περὶ ഘടനയെ തുടർന്നുള്ള കുറ്റങ്ങളോടൊപ്പം സമാന്തരമായി നിലനിർത്തുന്നു.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: തന്റെ സഹോദരന്റെ ഭാര്യയായ
  rationale: ബന്ധസൂചന വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; αὐτοῦ ഇവിടെ ഹെരോദാവിനെ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിലെ ആത്മവാചകമായ ‘തന്റെ’ വ്യക്തമാക്കുന്നു.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: ഹെരോദാവ് ചെയ്ത എല്ലാ തിന്മകളെ സംബന്ധിച്ചും
  rationale: തിന്മയായ പ്രവൃത്തികളുടെ സമഗ്രതയും ബഹുവചനവ്യാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള ആഖ്യാനപരമായ വൈരുധ്യവും വഴിത്തിരിവും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ വിമർശനത്തിന്റെ ധാർമിക ശക്തി
  choice: ἐλεγχόμενος എന്നത് ‘ശാസിക്കപ്പെട്ടിരുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കുറ്റം ബോധ്യപ്പെടുത്തപ്പെട്ടിരുന്ന’ അല്ലെങ്കിൽ ‘തെറ്റുകൾ വെളിപ്പെടുത്തപ്പെട്ടിരുന്ന’
  rationale: ഈ സന്ദർഭത്തിൽ ഹെരോദാവിന്റെ പെരുമാറ്റത്തിനെതിരായ ധാർമിക കുറ്റപ്പെടുത്തലാണ് മുൻനിരയിൽ. എന്നാൽ ഗ്രീക്ക് പദത്തിന് തെറ്റ് വെളിപ്പെടുത്തുക/ബോധ്യപ്പെടുത്തുക എന്ന അർഥവ്യാപ്തിയും ഉള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം. ചരിത്രപരമായ പ്രത്യേക പദവി ‘ചതുർഭാഗാധിപൻ’ എന്നു നിലനിർത്തി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി തുടരുന്നതിനാൽ മൂലപാഠത്തെപ്പോലെ കോമയിൽ അവസാനിപ്പിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഘടകത്തിന്റെ അവസാനം ചേർത്തു.
