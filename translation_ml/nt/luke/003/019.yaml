revisions:
- from: എന്നാൽ, തന്റെ സഹോദരന്റെ ഭാര്യയായ ഹെരോദ്യയെ സംബന്ധിച്ചും ഹെരോദാവ് ചെയ്ത എല്ലാ തിന്മകളെ സംബന്ധിച്ചും അവനാൽ ശാസിക്കപ്പെട്ടിരുന്ന ചതുർഭാഗാധിപനായ ഹെരോദാവ്,[a]
  to: എന്നാൽ, തെത്രാർക്കായ ഹെരോദാവ് തന്റെ സഹോദരന്റെ ഭാര്യയായ ഹെരോദ്യയെ സംബന്ധിച്ചും താൻ ചെയ്ത എല്ലാ തിന്മകളെ സംബന്ധിച്ചും അവനാൽ ശാസിക്കപ്പെട്ടിരുന്നപ്പോൾ,
