id: LUK.3.17
reference: Luke 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: ml
  text: അവന്റെ മെതിക്കളത്തെ പൂർണമായി വൃത്തിയാക്കാനും ഗോതമ്പ് അവന്റെ കലവറയിൽ ശേഖരിക്കാനും അവന്റെ വീശുമുറം[a] അവന്റെ കൈയിലുണ്ട്; എന്നാൽ പതിർ കെടുത്താനാവാത്ത തീയിൽ അവൻ ചുട്ടുകളയും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പാറ്റുമുറം.’ ധാന്യം വായുവിലേക്കെറിഞ്ഞ് ധാന്യവും പതിറും വേർതിരിക്കാൻ ഉപയോഗിച്ചിരുന്ന ഉപകരണത്തെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘കെടുത്താനാവാത്ത തീ’ എന്നത് ‘അണയാത്ത തീ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: വീശുമുറം
  rationale: ധാന്യം വായുവിലേക്കെറിഞ്ഞ് ധാന്യവും പതിറും വേർതിരിക്കാൻ ഉപയോഗിക്കുന്ന ഉപകരണമാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ കാർഷികചിത്രം സ്വാഭാവികമായി നൽകുന്ന പദം.
- source_word: διακαθᾶραι
  choice: പൂർണമായി വൃത്തിയാക്കാൻ
  rationale: ക്രിയയിലെ തീവ്രത നിലനിർത്തുകയും മെതിക്കളത്തിൽനിന്ന് അനാവശ്യമായതെല്ലാം നീക്കുന്ന ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἅλωνα
  choice: മെതിക്കളം
  rationale: ധാന്യം മെതിക്കുകയും പാറ്റുകയും ചെയ്യുന്ന സ്ഥലത്തിനുള്ള സ്വാഭാവികവും പതിവുമായ മലയാളപദം.
- source_word: συναγαγεῖν
  choice: ശേഖരിക്കാൻ
  rationale: വേർതിരിച്ച ധാന്യം ഒരുമിച്ചുകൂട്ടി സംഭരണസ്ഥലത്തേക്കു കൊണ്ടുവരുന്ന പ്രവൃത്തി സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: σῖτον
  choice: ഗോതമ്പ്
  rationale: പദത്തിന് പൊതുവായി ധാന്യം എന്നർഥമുണ്ടാകാമെങ്കിലും, പതിറിനോടുള്ള ഈ വൈരുധ്യത്തിൽ ഗോതമ്പ് സന്ദർഭോചിതമാണ്.
- source_word: ἀποθήκην
  choice: കലവറ
  rationale: ധാന്യം സൂക്ഷിക്കുന്ന സംഭരണസ്ഥലം എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കെട്ടിടത്തിന്റെ രൂപം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἄχυρον
  choice: പതിർ
  rationale: പാറ്റുമ്പോൾ ധാന്യത്തിൽനിന്ന് വേർതിരിയുന്ന ഉപയോഗശൂന്യമായ പുറന്തോട്/കനംകുറഞ്ഞ അവശിഷ്ടം സൂചിപ്പിക്കുന്നു.
- source_word: κατακαύσει
  choice: ചുട്ടുകളയും
  rationale: തീയിൽ പൂർണമായി ദഹിപ്പിക്കുന്നതിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πυρὶ ἀσβέστῳ
  choice: കെടുത്താനാവാത്ത തീയിൽ
  rationale: തീ അണച്ചുകളയാനാവില്ലെന്ന അർഥം നേരിട്ടും ശക്തമായും നൽകുന്നു.
- source_word: οὗ
  choice: അവന്റെ
  rationale: വരാനിരിക്കുന്നവനെ സംബന്ധിച്ച ഗ്രീക്ക് ബന്ധസർവനാമത്തിന്റെ ഉടമസ്ഥതാസംബന്ധമായ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: കാർഷികരൂപകത്തിലെ ന്യായവിധിയും വേർതിരിവും
  choice: വരാനിരിക്കുന്നവൻ ഗോതമ്പും പതിറും നിർണായകമായി വേർതിരിക്കുന്നതും ശേഖരണവും ന്യായവിധിയും ഒരുമിച്ച് ചിത്രീകരിക്കുന്നതുമായ ഭാഷ അതേ ശക്തിയിൽ നിലനിർത്തി.
  alternative: ഇത് ഇസ്രായേലിന്മേലുള്ള താൽക്കാലിക ന്യായവിധിയായി മാത്രം നിർവചിക്കുക, അല്ലെങ്കിൽ അന്തിമ നരകത്തെക്കുറിച്ചുള്ള പൂർണമായി വികസിപ്പിച്ച സിദ്ധാന്തപ്രസ്താവനയായി വിപുലീകരിക്കുക.
  rationale: വാക്യം രക്ഷയുടെയും ന്യായവിധിയുടെയും വ്യക്തമായ രൂപകം നൽകുന്നു; എന്നാൽ ആ ന്യായവിധിയുടെ എല്ലാ ദൈവശാസ്ത്രപരമായ വിശദാംശങ്ങളും നിർവചിക്കുന്നില്ല. അതിനാൽ ‘കെടുത്താനാവാത്ത തീ’ മൃദൂകരിക്കാതെയും വാചകത്തിന് അതീതമായ വ്യവസ്ഥാപിത വ്യാഖ്യാനം ചേർക്കാതെയും വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. കാർഷികരൂപകം സംരക്ഷിച്ചു; അപരിചിതമാകാവുന്ന ഉപകരണപദത്തിന് അടിക്കുറിപ്പ് നൽകി. ഗ്രീക്കിലെ ഉദ്ദേശ്യസൂചക infinitives മലയാളത്തിലെ ‘-ാനും’ ഘടനയിലൂടെ സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
