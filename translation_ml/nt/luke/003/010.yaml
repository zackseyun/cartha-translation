translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിത/തുടർച്ചയായ ക്രിയാഭാവവും ‘ജനക്കൂട്ടങ്ങൾ’ എന്ന ബഹുവചനവും നിലനിർത്തിയിരിക്കുന്നു; മലയാളത്തിലെ അനാവശ്യമായ ‘പറഞ്ഞുകൊണ്ട്’ ഒഴിവാക്കി നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
