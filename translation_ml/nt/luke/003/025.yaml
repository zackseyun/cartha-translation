  text: the son of Mattathias, the son of Amos, the son of Nahum, the son of Esli, the son of Naggai,
translation:
  language: ml
  text: മത്തഥിയാസിന്റെ മകൻ, ആമോസിന്റെ മകൻ, നാഹൂമിന്റെ മകൻ, എസ്ലിയുടെ മകൻ, നഗ്ഗായിയുടെ മകൻ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: -ന്റെ മകൻ
  rationale: ലൂക്കോസിന്റെ വംശാവലിയിൽ ആവർത്തിക്കുന്ന ജനിറ്റീവ് ആർട്ടിക്കിൾ ചുറ്റുപാടിൽ സ്ഥാപിച്ചിരിക്കുന്ന വംശബന്ധസൂത്രത്തിന്റെ ഭാഗമായി ദീർഘവൃത്തമായി പ്രവർത്തിക്കുന്നു. മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ഓരോ പേരിനോടും ‘-ന്റെ മകൻ’ ചേർത്തു.
- source_word: Ματταθίου
  choice: മത്തഥിയാസ്
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ ഗ്രീക്ക് രൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: Ἀμὼς
  choice: ആമോസ്
  rationale: വ്യക്തിനാമത്തിന് മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപം സ്വീകരിച്ചു; ഇവിടെ പ്രവാചകനെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നതല്ല, വംശാവലിയിലെ ഒരാളുടെ പേരാണ്.
- source_word: Ναοὺμ
  choice: നാഹൂം
  rationale: ഗ്രീക്ക് Ναούμ-നോട് യോജിക്കുകയും മലയാള വായനക്കാർക്ക് പരിചിതവുമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: Ἑσλὶ
  choice: എസ്ലി
  rationale: ആദ്യത്തെ ഗ്രീക്ക് സ്വരധ്വനി നിലനിർത്തുന്ന നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു; അനാവശ്യമായി ‘ഹ’ ചേർത്തില്ല.
- source_word: Ναγγαὶ
  choice: നഗ്ഗായി
  rationale: ഗ്രീക്കിലെ ഇരട്ട വ്യഞ്ജനവും അവസാന ദ്വിസ്വരസാദൃശ്യവും പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
