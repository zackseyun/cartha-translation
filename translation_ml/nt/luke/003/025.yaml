  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിയുടെ ആവർത്തനലയം നിലനിർത്തുന്ന ലളിതവും മാന്യവുമായ ശൈലി. ഈ വാക്യം ചുറ്റുമുള്ള വംശാവലിയുടെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
