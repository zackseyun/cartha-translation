id: LUK.3.5
reference: Luke 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: ml
  text: ഓരോ താഴ്‌വരയും നികത്തപ്പെടും[a]; ഓരോ മലയും കുന്നും താഴ്ത്തപ്പെടും. വളഞ്ഞവ നേരെയാകും[b]; പരുക്കമുള്ളവ മിനുസമുള്ള വഴികളാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഓരോ മലയിടുക്കും നികത്തപ്പെടും … വളഞ്ഞവ നേരെയാകും; പരുക്കമുള്ളവ മിനുസമുള്ള വഴികളാകും.’'
    reason: lexical_alternative
  - marker: b
    text: ഈ വരി യെശയ്യാവ് 40:4-ന്റെ പ്രതിധ്വനിയാണ്; കർത്താവിന്റെ വഴി ഒരുക്കുന്നതിനെ വഴിയൊരുക്കലിന്റെ ദൃശ്യത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: ഓരോ താഴ്‌വരയും
  rationale: φάραγξ എന്നത് താഴ്‌വര, മലയിടുക്ക്, ചുരം എന്നിവയെ സൂചിപ്പിക്കാം. പ്രവചനാത്മകമായ ഭൂപ്രകൃതി-സമതലീകരണ ദൃശ്യത്തിൽ സ്വാഭാവികവും വിശാലവുമായ പദമായി ‘താഴ്‌വര’ തെരഞ്ഞെടുത്തു; ‘ഓരോ’ πᾶσα എന്ന ഏകവചന വിതരണാർഥം നിലനിർത്തുന്നു.
- source_word: πληρωθήσεται
  choice: നികത്തപ്പെടും
  rationale: πληρόω എന്ന ക്രിയയുടെ ഭാവികാല കർമണിപ്രയോഗമാണ്. താഴ്ന്ന ഭൂപ്രദേശം മണ്ണിട്ട് ഉയർത്തുന്ന റോഡ്-നിർമാണ ദൃശ്യം ‘നികത്തപ്പെടും’ വ്യക്തമായി നൽകുന്നു.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: ഓരോ മലയും കുന്നും
  rationale: വലുതും ചെറുതുമായ ഉയർന്ന ഭൂപ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്ന ὄρος, βουνός എന്നീ സമീപാർഥപദങ്ങൾ രണ്ടും വേർതിരിച്ച് നിലനിർത്തി.
- source_word: ταπεινωθήσεται
  choice: താഴ്ത്തപ്പെടും
  rationale: ഈ ഭൂപ്രകൃതി-സന്ദർഭത്തിൽ ταπεινόω ഉയർന്ന നിലം താഴ്ത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘താഴ്ത്തപ്പെടും’ ഭൗതികദൃശ്യവും പദത്തിന്റെ വിശാലമായ പ്രവചനപ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: τὰ σκολιά
  choice: വളഞ്ഞവ
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന നപുംസകലിംഗ ബഹുവചന വിശേഷണമാണിത്. ഗ്രീക്ക് പാഠത്തിൽ ഇല്ലാത്ത ‘പാതകൾ’ ഇവിടെ മുൻകൂട്ടി ചേർക്കാതെ അതിന്റെ രൂപപരമായ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: εἰς εὐθείαν
  choice: നേരെയാകും
  rationale: εἰς ഉപയോഗിച്ചുള്ള ഘടന ഫലമായ മാറ്റത്തെ സൂചിപ്പിക്കുന്നു. ‘നേരെയാകും’ മലയാളത്തിൽ സ്വാഭാവികമായി വളഞ്ഞത് നേരെയാകുന്ന ആശയം നൽകുന്നു.
- source_word: αἱ τραχεῖαι
  choice: പരുക്കനായവ
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന ബഹുവചന വിശേഷണത്തിന്റെ അസ്പഷ്ടത നിലനിർത്തുന്നു; തുടർന്നുള്ള ὁδοὺς വഴികളുടെ ദൃശ്യം വ്യക്തമാക്കുന്നു.
- source_word: εἰς ὁδοὺς λείας
  choice: മിനുസമുള്ള വഴികളാകും
  rationale: ὁδούς എന്നത് വ്യക്തമായി ‘വഴികൾ’ എന്നും λείας ‘മിനുസമുള്ള/നിരപ്പായ’ എന്നും അർഥമാക്കുന്നു. റോഡ് ഒരുക്കുന്ന ദൃശ്യത്തിൽ ‘മിനുസമുള്ള വഴികൾ’ മൂലപാഠത്തോട് അടുത്തും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതുമാണ്.
theological_decisions:
- issue: യെശയ്യാവ് 40:4-ൽ നിന്നുള്ള പ്രവചനാത്മക ഭൂപ്രകൃതി-റോഡ് ദൃശ്യം
  choice: ഭൂപ്രദേശവും വഴിയും ഒരുക്കുന്നതായ മൂർത്തമായ ദൃശ്യം അതേപടി നിലനിർത്തി.
  alternative: ‘താഴ്മയുള്ളവർ ഉയർത്തപ്പെടും; അഹങ്കാരികൾ താഴ്ത്തപ്പെടും’ എന്നതുപോലുള്ള ധാർമ്മികമോ ആത്മീയമോ ആയ വ്യാഖ്യാനപരമായ പുനരാഖ്യാനം.
  rationale: ഈ ദൃശ്യത്തിന് ദൈവശാസ്ത്രപരമായ സൂചനകൾ ഉണ്ടെങ്കിലും ലൂക്കോസിന്റെ വാചകം ഭൂപ്രകൃതിയെക്കുറിച്ചുള്ള സാക്ഷാൽ ഭാഷയിലുള്ള ഉദ്ധരണിയാണ്. അതിനെ നിലനിർത്തുന്നത് കവിതാത്മക ശക്തി സംരക്ഷിക്കുകയും ഒരു പ്രത്യേക വ്യാഖ്യാനം വിവർത്തനത്തിനകത്ത് ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. പ്രവചനവാക്യത്തിന്റെ സമാന്തരഘടനയും ഭൂപ്രകൃതി-റോഡ് ദൃശ്യവും സംരക്ഷിച്ചു; ഗ്രീക്കിലെ നാമീകൃത വിശേഷണങ്ങളുടെ യഥാർഥ അസ്പഷ്ടത ‘വളഞ്ഞവ’, ‘പരുക്കനായവ’ എന്ന രൂപങ്ങളിൽ നിലനിർത്തി.
