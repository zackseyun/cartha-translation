id: LUK.8.33
reference: Luke 8:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: ml
  text: അപ്പോൾ ഭൂതങ്ങൾ ആ മനുഷ്യനിൽനിന്ന് പുറത്തുവന്ന് പന്നികളിൽ പ്രവേശിച്ചു. പന്നിക്കൂട്ടം ചെങ്കുത്തായ ചരിവിലൂടെ[a] തടാകത്തിലേക്ക് പാഞ്ഞിറങ്ങി മുങ്ങിമരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചെങ്കുത്തായ പാറക്കെട്ടിലൂടെ താഴേക്ക്” അല്ലെങ്കിൽ “ചെങ്കുത്തായ പാറക്കെട്ടിൽനിന്ന് താഴേക്ക്”; ഗ്രീക്ക് പദപ്രയോഗം കുത്തനെയുള്ള ഇറക്കത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα
  choice: പുറത്തുവന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പു നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാളത്തിൽ ക്രിയാവിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τὰ δαιμόνια
  choice: ഭൂതങ്ങൾ
  rationale: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന പദം ‘അശുദ്ധാത്മാക്കൾ’ എന്ന വിശാലപ്രയോഗമല്ല, പ്രത്യേകമായി ദുഷ്ടാത്മസത്തകളെ സൂചിപ്പിക്കുന്ന δαιμόνια ആണ്; മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണ ഉപയോഗത്തിലും ‘ഭൂതങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: ആ മനുഷ്യനിൽനിന്ന്
  rationale: മുൻസന്ദർഭത്തിലെ പ്രത്യേക മനുഷ്യനെയാണ് നിർദ്ദേശകപ്രയോഗത്തോടെ സൂചിപ്പിക്കുന്നത്; ἐξέρχομαι എന്ന ചലനത്തിന്റെ ഉറവിടവും വ്യക്തമാക്കുന്നു.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: പന്നികളിൽ പ്രവേശിച്ചു
  rationale: അവ പന്നികളുടെ ഉള്ളിലേക്കു കടന്നുവെന്ന ദിശയും സംഭവവും ചുരുക്കമായും വ്യക്തമായും പ്രകടമാക്കുന്നു.
- source_word: οἱ χοίροι
  choice: പന്നികൾ
  rationale: ആധുനിക മലയാളത്തിൽ സാധാരണവും കൃത്യവുമായ മൃഗനാമം.
- source_word: ὥρμησεν
  choice: പാഞ്ഞിറങ്ങി
  rationale: പെട്ടെന്നുള്ള ശക്തമായ ചലനത്തെയും താഴോട്ടുള്ള ദിശയെയും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു; ഉദ്ദേശ്യം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἡ ἀγέλη
  choice: പന്നിക്കൂട്ടം
  rationale: ‘കൂട്ടം’ മാത്രം എന്നതിനെക്കാൾ ഏതു മൃഗങ്ങളുടെ കൂട്ടമാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി ആവർത്തിക്കുന്നത് സ്വാഭാവികവും വായനാസൗകര്യമുള്ളതുമാണ്.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: ചെങ്കുത്തായ ചരിവിലൂടെ
  rationale: κατάയോടുകൂടിയ പ്രയോഗം കുത്തനെയുള്ള ഇറക്കത്തിലൂടെയോ അതിനെ താഴോട്ടു കടന്നോ ഉള്ള ചലനം സൂചിപ്പിക്കുന്നു; നിർബന്ധമായും നേർലംബമായ പാറക്കെട്ടെന്ന് അതിശയിപ്പിക്കുന്നില്ല.
- source_word: εἰς τὴν λίμνην
  choice: തടാകത്തിലേക്ക്
  rationale: λίμνη എന്നത് ഇവിടെ ‘കടൽ’ എന്നതിലുപരി ‘തടാകം’ എന്നാണ് കൃത്യമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπεπνίγη
  choice: മുങ്ങിച്ചത്തു
  rationale: വെള്ളത്തിലേക്ക് പാഞ്ഞിറങ്ങിയ മൃഗങ്ങളുടെ മരണത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ അർഥം; മലയാളത്തിൽ സ്വാഭാവികമായ അകർമകപ്രയോഗം കൂട്ടത്തെ ഏകവചന കർത്താവായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: δαιμόνια എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഭൂതങ്ങൾ
  alternative: അശുദ്ധാത്മാക്കൾ
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക പദഭേദം സംരക്ഷിക്കാനും ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ ‘അശുദ്ധാത്മാക്കൾ’ എന്ന പദം പകരം ചേർക്കാതിരിക്കാനും ‘ഭൂതങ്ങൾ’ സ്വീകരിച്ചു.
- issue: κρημνός സൂചിപ്പിക്കുന്ന ഭൂപ്രകൃതിയുടെ കൃത്യത
  choice: ചെങ്കുത്തായ ചരിവ്
  alternative: പാറക്കെട്ട് / അഗാധത്തിന്റെ വക്കു
  rationale: പദം കുത്തനെയുള്ള ഇറക്കത്തെ സൂചിപ്പിച്ചാലും പൂർണമായും നേർലംബമായ പാറക്കെട്ടെന്ന ശക്തമായ ചിത്രം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ മൂലത്തിലെ പരിധിക്കുള്ളിലുള്ള രൂപം സ്വീകരിച്ചു.
- issue: ἀπεπνίγηയുടെ വാച്യവും മരണസൂചനയും
  choice: മുങ്ങിച്ചത്തു
  alternative: മുക്കിക്കൊല്ലപ്പെട്ടു
  rationale: രൂപം വ്യാകരണപരമായി passive ആണെങ്കിലും ഈ സന്ദർഭത്തിൽ മുങ്ങിമരിക്കുക എന്ന അകർമകഫലമാണ് സ്വാഭാവികം; പുറമേയുള്ള കൊലയാളിയെ സൂചിപ്പിക്കുന്ന മലയാള passive ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പുറത്തുവന്ന്’, ‘പാഞ്ഞിറങ്ങി’, ‘മുങ്ങിച്ചത്തു’ എന്നീ രൂപങ്ങൾ പ്രവർത്തനക്രമവും വേഗവും സ്വാഭാവികമായി പകരുന്നു. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പ് ചെങ്കുത്തായ ഭൂപ്രകൃതിയെക്കുറിച്ചുള്ള യഥാർഥ പദാർഥവ്യാപ്തി തുറന്നുവയ്ക്കുന്നു.
