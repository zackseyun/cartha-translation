reference: Luke 8:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: ml
  text: 'പിന്നെ അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ വിശ്വാസം എവിടെയാണ്?[a]” അവർ ഭയപ്പെട്ട് ആശ്ചര്യപ്പെട്ടു; പരസ്പരം പറഞ്ഞുകൊണ്ട്: “അപ്പോൾ ഇവൻ ആരാണ്? കാറ്റുകളോടും വെള്ളത്തോടുംപോലും ഇവൻ കൽപിക്കുന്നു; അവ അവനെ അനുസരിക്കുന്നു!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭരമേൽപ്പ്.” യേശുവിന്റെ ചോദ്യം, “നിങ്ങളുടെ ഭരമേൽപ്പ് എവിടെയാണ്?” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: എവിടെ
  rationale: അവരുടെ വിശ്വാസത്തിന്റെ സ്ഥാനം അഥവാ സാന്നിധ്യം നേരിട്ട് ചോദിക്കുന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ മൂർച്ച നിലനിർത്തുന്നു; ‘എന്തുകൊണ്ട് നിങ്ങൾക്കു വിശ്വാസമില്ല?’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഈ സന്ദർഭത്തിൽ യേശുവിലുള്ള ആശ്രയത്തിന്റെ അർഥനിറം ഉൾക്കൊള്ളാൻ കഴിയുന്ന, വ്യാപകവും സ്വാഭാവികവുമായ മലയാള പദം. ‘ആശ്രയം’ എന്ന സന്ദർഭോചിതമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: φοβηθέντες
  choice: ഭയപ്പെട്ട്
  rationale: ഭയമാണ് തുടർന്നുള്ള ആശ്ചര്യത്തിന്റെ പശ്ചാത്തലമെന്ന ഗ്രീക്ക് പങ്കാളിത്തക്രിയയുടെ ബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐθαύμασαν
  choice: ആശ്ചര്യപ്പെട്ടു
  rationale: അത്ഭുതവും വിസ്മയവും കലർന്ന പ്രതികരണം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: അപ്പോൾ ഇവൻ ആരാണ്?
  rationale: ἄραയുടെ അനുമാനാത്മകമായ ഊന്നൽ ‘അപ്പോൾ’ വഴി നിലനിർത്തുകയും ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπιτάσσει
  choice: കല്പിക്കുന്നു
  rationale: ശാസിക്കുക എന്ന മുൻവാക്യത്തിലെ ആശയം ഇറക്കുമതി ചെയ്യാതെ, അധികാരപൂർവം ആജ്ഞ നൽകുക എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: കാറ്റുകളോടും വെള്ളത്തോടും
  rationale: ഗ്രീക്കിലെ ബഹുവചനമായ ‘കാറ്റുകൾ’, ഏകവചനമായ ‘വെള്ളം’ എന്നിവ നിലനിർത്തുന്നു; സമാന്തരവിവരണങ്ങളിൽ നിന്നുള്ള ‘തിരമാലകൾ’ അഥവാ ‘കടൽ’ ചേർക്കുന്നില്ല.
- source_word: ὑπακούουσιν αὐτῷ
  choice: അവ ഇവനെ അനുസരിക്കുന്നു
  rationale: സൃഷ്ടിശക്തികൾ വ്യക്തികളെപ്പോലെ അവന്റെ ആജ്ഞ അനുസരിക്കുന്നതായി ഗ്രീക്കിൽ പറയുന്ന ആശയം വ്യക്തമായി പകരുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘വിശ്വാസം’ എന്നും ‘ആശ്രയം’ എന്നും അർഥനിറങ്ങൾ ഉണ്ടാകാം
  choice: പ്രധാനപാഠത്തിൽ ‘വിശ്വാസം’
  alternative: ‘ആശ്രയം’
  rationale: ‘വിശ്വാസം’ പതിവും വിശാലവുമായ വിവർത്തനമാണ്; അപകടത്തിനിടയിൽ യേശുവിൽ ആശ്രയിക്കുന്നതിനെക്കുറിച്ചുള്ള സന്ദർഭോചിതമായ അർഥം ‘ആശ്രയം’ എന്ന അടിക്കുറിപ്പിലൂടെ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഇവൻ’ എന്ന രൂപം οὗτος എന്ന സമീപസൂചകത്തിന്റെ ശക്തിയും ശിഷ്യരുടെ നേരിട്ടുള്ള വിസ്മയവും നിലനിർത്തുന്നു. ഗ്രീക്കിലെ പങ്കാളിത്തക്രിയ മലയാളത്തിൽ ‘ഭയപ്പെട്ട് ആശ്ചര്യപ്പെട്ടു’ എന്ന് സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു.
