  to: 'പിന്നെ അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ വിശ്വാസം എവിടെയാണ്?[a]” അവർ ഭയപ്പെട്ട് ആശ്ചര്യപ്പെട്ടു; പരസ്പരം പറഞ്ഞുകൊണ്ട്: “അപ്പോൾ ഇവൻ ആരാണ്? കാറ്റുകളോടും വെള്ളത്തോടുംപോലും ഇവൻ കൽപിക്കുന്നു; അവ അവനെ അനുസരിക്കുന്നു!”'
  rationale: “ചോദിച്ചു” എന്നത് εἶπεν-നോട് ഒത്തുനിൽക്കുന്ന “പറഞ്ഞു” എന്നാക്കി തിരുത്തി. ഭയപ്പെടൽ, ആശ്ചര്യപ്പെടൽ, പരസ്പരം പറയൽ എന്നിവ തമ്മിലുള്ള ഗ്രീക്ക് വാക്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തി. പ്രധാനപാഠത്തിലെ “വിശ്വാസം” മാറ്റാതെ, അടിക്കുറിപ്പിൽ trust എന്ന സന്ദർഭാർഥം കൂടുതൽ കൃത്യമായി സൂചിപ്പിച്ചു.
