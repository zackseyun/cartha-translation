id: LUK.8.52
reference: Luke 8:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: ml
  text: 'എല്ലാവരും അവളെച്ചൊല്ലി കരയുകയും വിലപിക്കുകയും ചെയ്തുകൊണ്ടിരുന്നു. എന്നാൽ അദ്ദേഹം പറഞ്ഞു: “കരയേണ്ട; കാരണം, അവൾ മരിച്ചിട്ടില്ല[b], ഉറങ്ങുകയാണ്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉറക്കത്തിലാണ്.” തുടർന്നുവരുന്ന അവളുടെ പുനഃസ്ഥാപനത്തിന്റെ പശ്ചാത്തലത്തിൽ യേശു ഉറക്കത്തെ രൂപകമായി ഉപയോഗിക്കുന്നു.
    reason: καθεύδει എന്ന പദത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു പരിഭാഷ നൽകുകയും, മുഖ്യവാചകത്തിലെ രൂപകത്തെ വിശദീകരണമായി മാറ്റാതെ സന്ദർഭം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “കാരണം, അവൾ മരിച്ചിട്ടില്ല” എന്ന വാക്യഭാഗം കാണുന്നില്ല.
    reason: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിലെ ⸂οὐ γὰρ⸃ എന്ന അടയാളപ്പെടുത്തിയ പാഠഭേദത്തെ വായനക്കാരനെ അറിയിക്കുന്നു.
lexical_decisions:
- source_word: ἔκλαιον
  choice: കരയുകയും ... ചെയ്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയ സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: വിലപിച്ചവരുടെ സമഗ്രത വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκόπτοντο αὐτήν
  choice: അവളെച്ചൊല്ലി ... വിലപിക്കുകയും
  rationale: വിലാപസന്ദർഭത്തിൽ κόπτομαι ദുഃഖാചരണത്തെയും, ചിലപ്പോൾ നെഞ്ചത്തടിക്കൽ ഉൾപ്പെടുന്ന വിലാപത്തെയും സൂചിപ്പിക്കുന്നു; ശാരീരിക ചേഷ്ടയെ അനാവശ്യമായി വ്യക്തമാക്കാതെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: Μὴ κλαίετε
  choice: കരയേണ്ട
  rationale: നടന്നുകൊണ്ടിരിക്കുന്ന കരച്ചിൽ നിർത്താനുള്ള വർത്തമാനകാല നിരോധനത്തിന്റെ സന്ദർഭോചിതമായ അർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐ γὰρ
  choice: ; ... ഇല്ല
  rationale: γάρ നൽകുന്ന കാരണബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിലും വിരാമചിഹ്നത്തിലും സ്വാഭാവികമായി വ്യക്തമാകുന്നു; പ്രത്യേക ബന്ധപദം ചേർത്താൽ സംഭാഷണം കൃത്രിമമാകാം.
- source_word: ἀπέθανεν
  choice: മരിച്ചിട്ടില്ല
  rationale: മരണത്തിന്റെ സംഭവവും അതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥയും മലയാളത്തിലെ പൂർത്തഭൂത നിഷേധരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καθεύδει
  choice: ഉറങ്ങുകയാണ്
  rationale: വർത്തമാനകാല പ്രവർത്തനഭാവവും യേശു ഉപയോഗിക്കുന്ന ഉറക്കത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പെൺകുട്ടി ‘മരിച്ചിട്ടില്ല, ഉറങ്ങുകയാണ്’ എന്ന യേശുവിന്റെ പ്രസ്താവന
  choice: പ്രസ്താവനയുടെ അക്ഷരാർഥരൂപം നിലനിർത്തി, ‘ഉറങ്ങുകയാണ്’ എന്ന രൂപകം മുഖ്യവാചകത്തിൽ വിശദീകരിക്കാതെ വിട്ടു.
  alternative: അവൾ യഥാർഥത്തിൽ മരിച്ചിട്ടില്ല, ഉറക്കത്തിലാണ്; അല്ലെങ്കിൽ അവളുടെ മരണം താൽക്കാലികം മാത്രമാണ്.
  rationale: വിവരണം അവളുടെ അവസ്ഥയെക്കുറിച്ചുള്ള കഥയിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിച്ചുകളയും. മൂലവാചകം പറയുന്നതുപോലെ നിലനിർത്തുന്നത് വായനക്കാരനെ തുടർന്നുള്ള പുനഃസ്ഥാപനത്തിന്റെ വെളിച്ചത്തിൽ വാക്കുകൾ ഗ്രഹിക്കാൻ അനുവദിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അദ്ദേഹം’ ആദരസൂചകമായ സ്വാഭാവിക സർവനാമമായി ഉപയോഗിച്ചിരിക്കുന്നു; ‘വിലപിക്കുക’ ദുഃഖാചരണത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
