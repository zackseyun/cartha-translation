id: LUK.8.51
reference: Luke 8:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: ml
  text: അവൻ വീട്ടിലെത്തിയപ്പോൾ, പത്രോസിനെയും യോഹന്നാനെയും യാക്കോബിനെയും ബാലികയുടെ[a] പിതാവിനെയും മാതാവിനെയും അല്ലാതെ മറ്റാരെയും തന്നോടൊപ്പം അകത്തു കടക്കാൻ അനുവദിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുട്ടിയുടെ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് പൊതുവായി ‘കുട്ടി’ എന്നർഥവും വരാം; സന്ദർഭം ഈ കുട്ടി ഒരു ബാലികയാണെന്ന് വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: എത്തിയപ്പോൾ
  rationale: കാലസൂചന നൽകുന്ന ഭൂതകാല കൃതന്തത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള വരവ് വ്യക്തമാക്കുന്നു.
- source_word: οἰκίαν
  choice: വീട്ടിൽ
  rationale: οἰκίαയുടെ സാധാരണ അർഥമായ ‘വീട്’ കഥനസന്ദർഭത്തിൽ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν
  choice: അകത്തു കടക്കാൻ അനുവദിച്ചില്ല
  rationale: ഇവിടെ ἀφίημι അനുമതി നൽകുക എന്ന അർഥത്തിലാണ്; εἰσελθεῖν ഉൾവശത്തേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: τινα σὺν αὐτῷ
  choice: മറ്റാരെയും തന്നോടൊപ്പം
  rationale: നിഷേധവാക്യത്തിലെ τιναയ്ക്ക് ‘ആരെയും’ എന്ന പൊതുവ്യാപക അർഥമുണ്ട്; ഒഴിവാക്കി പറയുന്നവരുമായി താരതമ്യം വ്യക്തമാക്കാൻ ‘മറ്റാരെയും’ സ്വാഭാവികമാണ്. σὺν αὐτῷ പ്രവേശനത്തോടു ബന്ധപ്പെടുത്തി ‘തന്നോടൊപ്പം’ എന്നു നൽകി.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: നിഷേധത്തിനു ശേഷമുള്ള ഒഴിവാക്കൽഘടനയായതിനാൽ വ്യവസ്ഥാസൂചകമായ ‘എങ്കിൽ അല്ലാതെ’ എന്നതിനെക്കാൾ ‘അല്ലാതെ’ യോജിക്കുന്നു.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: പത്രോസിനെയും യോഹന്നാനെയും യാക്കോബിനെയും
  rationale: പേരുകളുടെ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾരൂപങ്ങൾ ഉപയോഗിച്ചു; ആവർത്തിക്കുന്ന καὶയെ ‘-യും’ ഘടനയിലൂടെ നിലനിർത്തി.
- source_word: τῆς παιδὸς
  choice: ബാലികയുടെ
  rationale: παῖς പൊതുവായി ‘കുട്ടി’ എന്നും ലിംഗസൂചകമായി ‘ആൺകുട്ടി/പെൺകുട്ടി’ എന്നും വരാം; സമീപസന്ദർഭം യായീറൊസിന്റെ മകളെയാണ് സൂചിപ്പിക്കുന്നത്, അതിനാൽ ‘ബാലിക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πατέρα ... καὶ τὴν μητέρα
  choice: പിതാവിനെയും മാതാവിനെയും
  rationale: രണ്ടു വ്യക്തികളെയും പ്രത്യേകം പരാമർശിക്കുന്ന ഗ്രീക്ക് ഘടന നിലനിർത്തുന്നു; ‘മാതാപിതാക്കൾ’ എന്നു ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: παῖς എന്ന പദത്തിന്റെ സന്ദർഭാനുസൃത ലിംഗവ്യക്തത
  choice: ബാലികയുടെ പിതാവിനെയും മാതാവിനെയും
  alternative: കുട്ടിയുടെ പിതാവിനെയും മാതാവിനെയും
  rationale: παῖς സ്വതവേ കൂടുതൽ പൊതുവായ പദമായിരിക്കാമെങ്കിലും സമീപസന്ദർഭം കുട്ടി യായീറൊസിന്റെ മകളാണെന്ന് വ്യക്തമാക്കുന്നു. മുഖ്യപാഠത്തിൽ സന്ദർഭാനുസൃതമായ രൂപം നൽകി, പദത്തിന്റെ വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ കഥനശൈലി. വാക്യക്രമം ഗ്രീക്ക് പാഠത്തിന്റെ പുരോഗതി പിന്തുടരുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന വിധത്തിലാണ്. ‘അകത്തു’ എന്നത് വീടിനകത്തേക്കുള്ള പ്രവേശനം വ്യക്തമാക്കുന്നു.
