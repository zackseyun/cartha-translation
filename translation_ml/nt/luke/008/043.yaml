translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഡോക്ടർമാർ’ എന്നതിനെക്കാൾ തിരുവെഴുത്ത്-ആഖ്യാനത്തിന് യോജിച്ചെങ്കിലും പൊതുവെ മനസ്സിലാകുന്ന ‘വൈദ്യന്മാർ’ ഉപയോഗിച്ചു; ‘സൗഖ്യം പ്രാപിക്കുക’ ചികിത്സാപരവും തിരുവെഴുത്തുസന്ദർഭത്തിനും യോജിച്ചതുമാണ്.
