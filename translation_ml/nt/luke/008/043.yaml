  text: καὶ γυνὴ οὖσα ἐν ῥύσει αἵματος ἀπὸ ἐτῶν δώδεκα, ἥτις ⸂ἰατροῖς προσαναλώσασα ὅλον τὸν βίον⸃ οὐκ ἴσχυσεν ⸀ἀπ’ οὐδενὸς θεραπευθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/043.yaml
  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
translation:
  language: ml
  text: പന്ത്രണ്ടു വർഷമായി രക്തസ്രാവം ഉണ്ടായിരുന്ന ഒരു സ്ത്രീ ഉണ്ടായിരുന്നു[a]. അവൾ വൈദ്യന്മാരുടെ ചികിത്സയ്ക്കായി ജീവിക്കാനുള്ള വക മുഴുവൻ ചെലവഴിച്ചിരുന്നു[b]; എങ്കിലും ആരാലും അവളെ സുഖപ്പെടുത്താൻ കഴിഞ്ഞില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പന്ത്രണ്ടു വർഷമായി രക്തം വാർന്നുകൊണ്ടിരുന്ന.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഗ്രീക്ക് βίος എന്ന പദം അവളുടെ ജൈവജീവനെയല്ല, ജീവിക്കാനുള്ള വകയെയോ സാമ്പത്തിക വിഭവങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ അവൾ വൈദ്യന്മാരുടെ ചികിത്സയ്ക്കായി ജീവിക്കാനുള്ള വക മുഴുവൻ ചെലവഴിച്ചു എന്ന വാചകം കാണുന്നില്ല. ഇവിടെ SBLGNT പാഠത്തിൽ ഉൾക്കൊള്ളുന്ന വാചകമാണ് പിന്തുടരുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα
  choice: ഒരു സ്ത്രീ ഉണ്ടായിരുന്നു
  rationale: പശ്ചാത്തല വിവരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് കൃതന്തഘടനയെ മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐν ῥύσει αἵματος
  choice: രക്തസ്രാവം ഉണ്ടായിരുന്ന
  rationale: ശാരീരികാവസ്ഥയുടെ വ്യക്തത നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം നൽകുന്നു.
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: പന്ത്രണ്ടു വർഷമായി
  rationale: സന്ദർഭത്തിലെ കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἰατροῖς προσαναλώσασα
  choice: വൈദ്യന്മാർക്കായി ... ചെലവഴിച്ചിട്ടും
  rationale: ചികിത്സകരുടെ പക്കൽ വിഭവങ്ങൾ ചെലവായെന്ന അർഥവും പ്രധാനക്രിയയോടുള്ള concessive ബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅλον τὸν βίον
  choice: തന്റെ ഉപജീവനമാർഗം മുഴുവൻ
  rationale: βίος ഇവിടെ ജൈവജീവനെയല്ല, ജീവിക്കാനുള്ള സാമ്പത്തിക വിഭവങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: οὐκ ἴσχυσεν
  choice: കഴിഞ്ഞിരുന്നില്ല
  rationale: അവൾക്ക് സാധിക്കാതിരുന്നുവെന്ന ആശയം മലയാളത്തിൽ ചുരുക്കവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: ആരാലും സൗഖ്യം പ്രാപിക്കാൻ
  rationale: പ്രവർത്തകനെ സൂചിപ്പിക്കുന്ന ἀπ’ οὐδενός എന്ന ഘടകവും θεραπευθῆναι എന്ന നിർജ്ജീവ ആശയവും സംരക്ഷിക്കുന്നു.
