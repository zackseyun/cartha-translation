  to: ആ സ്ത്രീ, താൻ ശ്രദ്ധയിൽപ്പെടാതെ പോയില്ലെന്ന് കണ്ടപ്പോൾ[a], വിറച്ചുകൊണ്ട് വന്ന് അവന്റെ മുമ്പിൽ വീണു[b]. താൻ അവനെ തൊട്ടതിന്റെ കാരണം എന്തെന്നും താൻ എങ്ങനെ ഉടനെ സൗഖ്യം പ്രാപിച്ചെന്നും അവൾ എല്ലാ ജനങ്ങളുടെയും മുമ്പാകെ അറിയിച്ചു.
