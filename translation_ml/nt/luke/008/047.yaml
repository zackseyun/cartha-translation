  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: ml
  text: ആ സ്ത്രീ, താൻ ശ്രദ്ധയിൽപ്പെടാതെ പോയില്ലെന്ന് കണ്ടപ്പോൾ[a], വിറച്ചുകൊണ്ട് വന്ന് അവന്റെ മുമ്പിൽ വീണു[b]. താൻ അവനെ തൊട്ടതിന്റെ കാരണം എന്തെന്നും താൻ എങ്ങനെ ഉടനെ സൗഖ്യം പ്രാപിച്ചെന്നും അവൾ എല്ലാ ജനങ്ങളുടെയും മുമ്പാകെ അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “താൻ മറഞ്ഞിരുന്നില്ലെന്ന്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവന്റെ കാൽക്കൽ വീണു.” ഗ്രീക്കിൽ “അവന്റെ മുമ്പിൽ വീണു” എന്നാണ്; “കാല്ക്കൽ” എന്ന് വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: മനസ്സിലാക്കിയപ്പോൾ
  rationale: ഇവിടെ കാണുക എന്നത് സ്ഥിതിഗതി തിരിച്ചറിയുക എന്ന അർഥത്തിലാണ്; aorist participle-ന്റെ സാഹചര്യ-കാലബന്ധം ‘...പ്പോൾ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐκ ἔλαθεν
  choice: താൻ ചെയ്തത് മറഞ്ഞിരുന്നില്ല
  rationale: λανθάνω എന്നതിന്റെ ‘ശ്രദ്ധയിൽപ്പെടാതെ പോകുക/മറഞ്ഞിരിക്കുക’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മറഞ്ഞിരുന്നത് സ്ത്രീ തന്നെയാണെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കാൻ പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: τρέμουσα
  choice: വിറച്ചുകൊണ്ട്
  rationale: സ്ത്രീയുടെ ശാരീരികവും വൈകാരികവുമായ അവസ്ഥയുടെ ദൃശ്യത നിലനിർത്തുന്നു; ‘ഭയന്ന്’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: προσπεσοῦσα αὐτῷ
  choice: അവന്റെ മുമ്പിൽ വീണു
  rationale: ഗ്രീക്കിലെ ദത്തിവിഭക്തിയോടുകൂടിയ προσπίπτω സൂചിപ്പിക്കുന്ന അപേക്ഷാപരമോ ആദരപൂർവമോ ആയ വീഴ്ച വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘കാല്ക്കൽ’ പ്രധാനവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: δι’ ἣν αἰτίαν
  choice: എന്തിനാണ്
  rationale: ‘എന്തു കാരണത്താൽ’ എന്ന ആശയത്തിന്റെ ലളിതവും നിലവാരമുള്ളതുമായ മലയാളരൂപം.
- source_word: ἥψατο αὐτοῦ
  choice: അവനെ തൊട്ടത്
  rationale: ἅπτομαι + genitive ഇവിടെ നേരിട്ട് ‘തൊടുക’ എന്നാണ്; മുൻപ് നടന്ന പ്രവൃത്തി വാക്യഘടനയിൽ വ്യക്തമാണ്.
- source_word: ἀπήγγειλεν
  choice: അറിയിച്ചു
  rationale: പൊതുവായി വിവരിച്ചു/പ്രഖ്യാപിച്ചു എന്ന അർഥം നൽകുന്ന സ്വാഭാവിക മലയാളം; അനാവശ്യമായ ആരാധനാപരമോ പശ്ചാത്താപപരമോ ആയ ഭാഷ ചേർക്കുന്നില്ല.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: ജനമെല്ലാവരുടെയും മുമ്പാകെ
  rationale: ἐνώπιον എന്ന ‘സാന്നിധ്യത്തിൽ/മുമ്പിൽ’ എന്ന അർഥവും παντὸς τοῦ λαοῦ എന്ന സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: ὡς ἰάθη
  choice: എങ്ങനെ ... സൗഖ്യം പ്രാപിച്ചെന്നും
  rationale: ὡς എന്നതിലെ ‘എങ്ങനെ’ എന്ന ഭാവം സംരക്ഷിക്കുന്നു; passive ἰάθη മലയാളത്തിൽ സ്വാഭാവികമായ ‘സൗഖ്യം പ്രാപിച്ചു’ ആയി നൽകുന്നു.
- source_word: παραχρῆμα
  choice: ഉടനെ
  rationale: രോഗശാന്തി തൽക്ഷണം സംഭവിച്ചതെന്ന ലൂക്കോസിന്റെ ഊന്നൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: സ്ത്രീയുടെ പരസ്യമായ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: അവൾ വിറച്ചുകൊണ്ട് വന്ന് അവന്റെ മുമ്പിൽ വീണ് സംഭവിച്ചത് അറിയിച്ചു എന്ന വിവരണാത്മക ഭാഷ
  alternative: അവൾ പശ്ചാത്തപിച്ചു ഏറ്റുപറഞ്ഞു, അല്ലെങ്കിൽ അവനെ ആരാധിച്ചു എന്നു വ്യക്തമാക്കൽ
  rationale: വാക്യം അവളുടെ വിറയലും വീഴ്ചയും പൊതുവായ അറിയിപ്പും വിവരിക്കുന്നു; പശ്ചാത്താപമോ ആരാധനയോ എന്ന് നേരിട്ട് പറയാത്തതിനാൽ അത്തരം ദൈവശാസ്ത്രപരമായ വിശദീകരണം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സൗഖ്യം പ്രാപിച്ചു’ എന്നത് ബൈബിൾസന്ദർഭത്തിന് യോജിക്കുന്ന നിലവാരപ്രയോഗമാണ്; വാക്യത്തിന്റെ ദൈർഘ്യം നിയന്ത്രിക്കാൻ ഗ്രീക്കിലെ ഏകവാക്യം മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി.
