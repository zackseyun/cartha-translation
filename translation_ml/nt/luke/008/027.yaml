id: LUK.8.27
reference: Luke 8:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: ml
  text: അവൻ കരയിലിറങ്ങിയപ്പോൾ[a], പട്ടണത്തിൽനിന്നുള്ള ഒരു മനുഷ്യൻ അവനെ എതിരേറ്റു. അയാൾക്കു ഭൂതങ്ങൾ ഉണ്ടായിരുന്നു[b]. ഏറെക്കാലമായി അയാൾ വസ്ത്രം ധരിച്ചിരുന്നില്ല; അയാൾ വീട്ടിൽ പാർത്തിരുന്നില്ല, പാർത്തിരുന്നത് കല്ലറകൾക്കിടയിലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ കരയിൽ എത്തിയപ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, കൂടുതൽ വ്യവഹാരികമായി, ‘അയാൾ ഭൂതബാധിതനായിരുന്നു.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഭൂതങ്ങൾ ഉള്ളവൻ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν
  choice: അവൻ കരയിലേക്കു വന്നപ്പോൾ
  rationale: ദത്തിവിലുള്ള കൃദന്തരൂപം യേശുവിനെ സംബന്ധിച്ച കാലസൂചനയായി എടുത്തു. ἐπὶ τὴν γῆν എന്നതിലെ ‘കരയിലേക്ക്/നിലത്തേക്ക്’ എന്ന ദിശ നിലനിർത്തുകയും, പടകിൽനിന്നിറങ്ങിയത് മുഖ്യവാചകത്തിൽ അതിയായി വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὑπήντησεν
  choice: എതിരേറ്റു
  rationale: നേരിട്ടുവന്ന് കണ്ടുമുട്ടുക എന്ന ആഖ്യാനസന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀνήρ τις
  choice: ഒരു മനുഷ്യൻ
  rationale: ἀνήρ പുരുഷനെ സൂചിപ്പിക്കുന്നതും τις അനിശ്ചിതത്വം നൽകുന്നതുമാണ്; മലയാളത്തിൽ ‘ഒരു മനുഷ്യൻ’ സ്വാഭാവികമായി രണ്ടും അറിയിക്കുന്നു.
- source_word: ἐκ τῆς πόλεως
  choice: പട്ടണത്തിൽനിന്നുള്ള
  rationale: ആ മനുഷ്യന്റെ ഉത്ഭവമോ ബന്ധമോ സൂചിപ്പിക്കുന്ന പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἔχων δαιμόνια
  choice: അയാൾക്കു ഭൂതങ്ങൾ ഉണ്ടായിരുന്നു
  rationale: ഗ്രീക്കിലെ ‘ഭൂതങ്ങൾ ഉള്ളവൻ’ എന്ന ഘടനയോട് അടുത്തുനിൽക്കുന്നു; ‘ഭൂതബാധിതൻ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ മലയാളപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: χρόνῳ ἱκανῷ
  choice: ഏറെക്കാലമായി
  rationale: ഗണ്യമായ കാലദൈർഘ്യം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: വസ്ത്രം ധരിച്ചിരുന്നില്ല
  rationale: വസ്ത്രം ധരിക്കുക എന്ന ക്രിയാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ദീർഘകാലമായി തുടരുന്ന പശ്ചാത്തലസ്ഥിതി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: വീട്ടിൽ പാർത്തിരുന്നില്ല
  rationale: μένω എന്നതിലെ പാർക്കുക/താമസിക്കുക എന്ന അർഥവും അപൂർണ്ണഭൂതകാലത്തിന്റെ പതിവായ സ്ഥിതിയും നിലനിർത്തുന്നു.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: കല്ലറകൾക്കിടയിലായിരുന്നു താമസം
  rationale: μνήμασιν എന്ന ബഹുവചനം ‘കല്ലറകൾ’ എന്നു നൽകുന്നു; അവയ്ക്കിടയിലെ താമസസ്ഥിതി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: δαιμόνια എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഭൂതങ്ങൾ
  alternative: അശുദ്ധാത്മാക്കൾ
  rationale: ഇവിടെ മൂലപദം δαιμόνια ആണ്; πνεύματα ἀκάθαρτα അല്ല. അതിനാൽ സുവിശേഷങ്ങളിൽ വേറെയും ഉപയോഗിക്കുന്ന രണ്ട് പ്രയോഗങ്ങളെ കലർത്താതെ നേരിട്ടുള്ള പദസമം സ്വീകരിച്ചു.
- issue: ἔχων δαιμόνια എന്ന ഘടനയെ ‘ഭൂതബാധിതൻ’ എന്നു വ്യവഹാരികമാക്കണമോ എന്നത്
  choice: അയാൾക്കു ഭൂതങ്ങൾ ഉണ്ടായിരുന്നു
  alternative: അയാൾ ഭൂതബാധിതനായിരുന്നു
  rationale: മൂലവാക്യം അക്ഷരാർഥത്തിൽ ‘ഭൂതങ്ങൾ ഉള്ളവൻ’ എന്നാണ്. കൈവശം/ബാധയുടെ കൃത്യസ്വഭാവത്തെക്കുറിച്ച് മൂലത്തിൽക്കാൾ അധികം നിർണ്ണയിക്കാതിരിക്കാൻ മുഖ്യവാചകത്തിൽ അടുത്ത രൂപം സ്വീകരിച്ചു; സാധാരണ വ്യവഹാരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അയാൾ’ എന്ന രൂപം മനുഷ്യനെ വ്യക്തമായി പിന്തുടരാനും യേശുവിനെ സൂചിപ്പിക്കുന്ന ‘അവൻ’ എന്നതിൽനിന്ന് വേർതിരിക്കാനും സഹായിക്കുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പ്-അടയാളങ്ങൾ ഉള്ളടക്കവുമായി മറിച്ചുചേർന്നിരുന്നതിനാൽ, കരയ്ക്കിറങ്ങൽ സംബന്ധിച്ച പകരംവായന [a]-യിലും ഭൂതബാധ സംബന്ധിച്ച പകരംവായന [b]-യിലും അർഥാനുസൃതമായി ക്രമപ്പെടുത്തി.
