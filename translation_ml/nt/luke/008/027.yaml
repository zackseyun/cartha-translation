- from: അവൻ കരയിലേക്കു വന്നപ്പോൾ[a], പട്ടണത്തിൽനിന്നുള്ള ഒരു മനുഷ്യൻ അവനെ എതിരേറ്റു. അയാൾക്കു ഭൂതങ്ങൾ ഉണ്ടായിരുന്നു[b]. ഏറെക്കാലമായി അയാൾ വസ്ത്രം ധരിച്ചിരുന്നില്ല; അയാൾ വീട്ടിൽ പാർത്തിരുന്നില്ല, കല്ലറകൾക്കിടയിലായിരുന്നു താമസം.
  to: അവൻ കരയിലിറങ്ങിയപ്പോൾ[a], പട്ടണത്തിൽനിന്നുള്ള ഒരു മനുഷ്യൻ അവനെ എതിരേറ്റു. അയാൾക്കു ഭൂതങ്ങൾ ഉണ്ടായിരുന്നു[b]. ഏറെക്കാലമായി അയാൾ വസ്ത്രം ധരിച്ചിരുന്നില്ല; അയാൾ വീട്ടിൽ പാർത്തിരുന്നില്ല, പാർത്തിരുന്നത് കല്ലറകൾക്കിടയിലായിരുന്നു.
  rationale: മുഖ്യപാഠത്തിൽ കരയിലെത്തലിനെ ‘കരയിലിറങ്ങിയപ്പോൾ’ എന്നു തിരുത്തി, ἐξελθόντι ... ἐπὶ τὴν γῆν എന്ന പടകിൽനിന്നുള്ള കരപ്രവേശനസന്ദർഭം സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു. അതനുസരിച്ച് [a] അടിക്കുറിപ്പിൽ അമിതമായി പ്രത്യേകീകരിക്കാത്ത ‘കരയിൽ എത്തിയപ്പോൾ’ എന്ന പകരംവായന നൽകി. അവസാന വാക്യത്തിൽ താമസത്തെക്കുറിച്ചുള്ള ആവർത്തനം ഒഴിവാക്കി, ἀλλά എന്ന വിരുദ്ധത വ്യക്തമായി നിലനിർത്തി. അർഥത്തിലും ദൈവശാസ്ത്രപരമായ അവകാശവാദത്തിലും മാറ്റമില്ല.
