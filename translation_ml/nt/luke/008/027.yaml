  source_fidelity: 'പ്രധാനവാക്യത്തിലെ ‘കരയിലേക്കു വന്നപ്പോൾ’ എന്നത് ἐπὶ τὴν γῆν എന്ന ദിശയെ പൂർണമായി സ്വാഭാവികമാക്കുന്നില്ല; പടകിൽനിന്ന് കരയിലെത്തുന്ന സന്ദർഭത്തിൽ ‘കരയിലിറങ്ങിയപ്പോൾ’ കൂടുതൽ കൃത്യവും സ്വാഭാവികവുമാണ്. ശേഷിക്കുന്ന ഉള്ളടക്കം ഗ്രീക്ക് പാഠത്തോട് വിശ്വസ്തമാണ്: നഗരത്തിൽനിന്നുള്ള മനുഷ്യൻ യേശുവിനെ കണ്ടുമുട്ടുന്നു, അവന് δαιμόνια ഉണ്ട്, ദീർഘകാലമായി വസ്ത്രം ധരിച്ചിട്ടില്ല, വീട്ടിലല്ല കല്ലറകൾക്കിടയിലാണ് പാർത്തിരുന്നത്.'
  naturalness: ‘കരയിലിറങ്ങിയപ്പോൾ’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. അവസാനത്തെ വിരുദ്ധബന്ധം ‘പാർത്തിരുന്നത് കല്ലറകൾക്കിടയിലായിരുന്നു’ എന്നു നൽകിയാൽ ‘വീട്ടിൽ പാർത്തിരുന്നില്ല’ എന്നതുമായ ബന്ധം കൂടുതൽ സുതാര്യമാകും.
  terminology: δαιμόνια-യ്ക്ക് ‘ഭൂതങ്ങൾ’ എന്ന തിരഞ്ഞെടുപ്പ് നേരിട്ടുള്ളതും സ്ഥിരതയുള്ളതുമാണ്. ‘അയാൾക്കു ഭൂതങ്ങൾ ഉണ്ടായിരുന്നു’ എന്ന മുഖ്യപാഠം ഗ്രീക്കിലെ ἔχων δαιμόνια എന്ന അസാധാരണമായെങ്കിലും ഉദ്ദേശ്യപൂർവം അടുത്ത ഘടന സംരക്ഷിക്കുന്നു; സാധാരണപ്രയോഗമായ ‘ഭൂതബാധിതനായിരുന്നു’ അടിക്കുറിപ്പിൽ മാത്രം നന്നായി നൽകിയിരിക്കുന്നു.
