reference: Luke 8:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐπηρώτων δὲ αὐτὸν οἱ μαθηταὶ ⸀αὐτοῦ τίς ⸂αὕτη εἴη ἡ παραβολή⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/009.yaml
  text: Then his disciples asked him what this parable meant[a].
translation:
  language: ml
  text: അപ്പോൾ അവന്റെ ശിഷ്യന്മാർ അവനോട് ഈ ഉപമയുടെ അർഥം എന്താണെന്ന് ചോദിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഈ ഉപമ എന്തായിരിക്കാം എന്ന്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτων
  choice: ചോദിച്ചു
  rationale: അപൂർണഭൂതകാല ക്രിയയായതിനാൽ തുടരുന്നതോ ആവർത്തിച്ചതോ ആയ ചോദ്യം സൂചിപ്പിക്കാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തിന് ലളിതഭൂതകാലമായ ‘ചോദിച്ചു’ യോജിക്കുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ലഘുവായ ആഖ്യാനബന്ധകമാണ്; ശക്തമായ വിരോധം സൂചിപ്പിക്കാതെ മുൻവാക്യത്തിൽനിന്നുള്ള സംഭവക്രമം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ശിഷ്യന്മാർ
  rationale: αὐτοῦ എന്ന ഉടമസ്ഥസർവനാമത്തിന്റെ അർഥം ‘അവനോട്’ എന്ന പ്രയോഗത്തിലും സന്ദർഭത്തിലും വ്യക്തമാണ്; ‘അവന്റെ ശിഷ്യന്മാർ’ എന്നും വിവർത്തനം ചെയ്യാം, എന്നാൽ ഇവിടെ ആവർത്തനം ഒഴിവാക്കുന്ന സ്വാഭാവിക മലയാളം സ്വീകരിച്ചു.
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: ഈ ഉപമയുടെ അർഥം എന്താണെന്ന്
  rationale: പദാനുപദമായി ‘ഈ ഉപമ എന്തായിരിക്കാം’ എന്നാണെങ്കിലും, പരോക്ഷചോദ്യത്തിൽ ഉപമയുടെ വ്യാഖ്യാനമോ പ്രസക്തിയോ ചോദിക്കുന്ന ആശയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παραβολή
  choice: ഉപമ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ സ്ഥാപിതവും കൃത്യവുമായ മലയാള പദമാണ്.
- source_word: εἴη
  choice: അർഥം ... ആണെന്ന്
  rationale: ഭൂതകാല പ്രധാനക്രിയയ്ക്കു പിന്നാലെയുള്ള പരോക്ഷചോദ്യത്തിലെ optative രൂപം മലയാളത്തിൽ പ്രത്യേക ക്രിയാഭാവമായി സ്വാഭാവികമായി അടയാളപ്പെടുത്താനാകില്ല; സന്ദർഭത്തിലെ വ്യാഖ്യാനചോദ്യം ‘അർഥം എന്താണെന്ന്’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഉപമ’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തി; ഗ്രീക്കിലെ പരോക്ഷചോദ്യത്തിന്റെ അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
