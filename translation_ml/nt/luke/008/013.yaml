id: LUK.8.13
reference: Luke 8:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: ml
  text: പാറമേലുള്ളവർ ആരെന്നാൽ, വചനം കേൾക്കുമ്പോൾ സന്തോഷത്തോടെ സ്വീകരിക്കുന്നവരാണ്. എന്നാൽ ഇവർക്കു വേരില്ല; കുറച്ചുകാലം അവർ വിശ്വസിക്കുന്നു, പരീക്ഷയുടെ സമയത്ത്[a] അവർ പിന്മാറിപ്പോകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രലോഭനത്തിന്റെ സമയത്ത്’ എന്നോ ‘കഷ്ടപരീക്ഷ വരുമ്പോൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് പരീക്ഷ, കഷ്ടപരീക്ഷ, പ്രലോഭനം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: പാറമേലുള്ളവർ
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ πέτραയെയും ഉപമയിലെ ദൃശ്യബിംബത്തെയും നേരിട്ട് നിലനിർത്തുന്നു; ‘പാറനിലം’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: ἀκούσωσιν
  choice: കേൾക്കുമ്പോൾ
  rationale: ὅταν സഹിതമുള്ള പൊതുവായ സമയബന്ധത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μετὰ χαρᾶς
  choice: സന്തോഷത്തോടെ
  rationale: സന്തോഷപൂർവമായ സ്വീകരണത്തെ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: δέχονται τὸν λόγον
  choice: വചനം ... സ്വീകരിക്കുന്നവർ
  rationale: δέχομαι എന്നതിന്റെ സ്വീകരിക്കൽ എന്ന അർഥവും λόγος എന്ന ബൈബിൾപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: ഇവർക്കു വേരില്ല
  rationale: ഗ്രീക്കിലെ ഏകവചനരൂപവും ഉപമയിലെ സംക്ഷിപ്ത രൂപകവും നിലനിർത്തുന്നു.
- source_word: πρὸς καιρὸν
  choice: കുറച്ചുകാലം
  rationale: പരിമിതമായ കാലദൈർഘ്യം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πιστεύουσιν
  choice: അവർ വിശ്വസിക്കുന്നു
  rationale: വിശ്വാസത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം ദൈവശാസ്ത്രപരമായ നിർവചനം ചേർക്കാതെ ക്രിയയെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: പരീക്ഷയുടെ സമയത്ത്
  rationale: πειρασμός സൂചിപ്പിക്കാവുന്ന പരീക്ഷ, പരിശോധന, പ്രലോഭനം എന്നീ അർഥങ്ങളിൽ വിശാലതയുള്ള ‘പരീക്ഷ’ തിരഞ്ഞെടുത്തു; അർഥവൈകല്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀφίστανται
  choice: വിശ്വാസം വിട്ടുപോകുന്നു
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ വിശ്വാസത്തിൽനിന്നുള്ള പിന്മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സാങ്കേതികമായ ‘വിശ്വാസത്യാഗം ചെയ്യുന്നു’ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: πιστεύουσιν എന്നത് യഥാർഥ രക്ഷാകരവിശ്വാസമോ ഉപരിപ്ലവമായ വിശ്വാസമോ എന്നു സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘അവർ വിശ്വസിക്കുന്നു’ എന്ന് നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവർ വിശ്വസിക്കുന്നതായി തോന്നുന്നു’ / ‘അവർ ഉപരിപ്ലവമായി വിശ്വസിക്കുന്നു’
  rationale: അവർ കുറച്ചുകാലം വിശ്വസിച്ച് പിന്നീട് വിട്ടുപോകുന്നു എന്നാണ് വാക്യം പറയുന്നത്; ആ വിശ്വാസത്തിന്റെ രക്ഷാകരസ്വഭാവത്തെക്കുറിച്ചുള്ള പിൽക്കാല ദൈവശാസ്ത്രവിവാദം വാക്യം തന്നെ തീർപ്പാക്കുന്നില്ല.
- issue: πειρασμός എന്നതിന്റെ സന്ദർഭാർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘പരീക്ഷ’ ഉപയോഗിച്ചു.
  alternative: ‘പ്രലോഭനം’ / ‘കഷ്ടപരീക്ഷ’ / ‘പരിശോധന’
  rationale: ഗ്രീക്ക് പദത്തിന് ബാഹ്യപരീക്ഷയും ആന്തരികപ്രലോഭനവും ഉൾപ്പെടുന്ന അർഥവ്യാപ്തിയുണ്ട്; മുഖ്യപാഠത്തിൽ വിശാലമായ പദം നൽകി മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, മാന്യവും സ്വാഭാവികവുമായ ശൈലി. ഉപമയിലെ ‘പാറ’, ‘വേര്’ എന്നീ ബിംബങ്ങൾ നിലനിർത്തി. ദൈവശാസ്ത്രപരമായ നിഗമനങ്ങൾ ചേർക്കാതെ മൂലപാഠത്തിലെ സംഘർഷം സംരക്ഷിച്ചു.
