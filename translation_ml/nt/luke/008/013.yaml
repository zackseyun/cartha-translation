  to: പാറമേലുള്ളവർ ആരെന്നാൽ, വചനം കേൾക്കുമ്പോൾ സന്തോഷത്തോടെ സ്വീകരിക്കുന്നവരാണ്. എന്നാൽ ഇവർക്കു വേരില്ല; കുറച്ചുകാലം അവർ വിശ്വസിക്കുന്നു, പരീക്ഷയുടെ സമയത്ത്[a] അവർ പിന്മാറിപ്പോകുന്നു.
