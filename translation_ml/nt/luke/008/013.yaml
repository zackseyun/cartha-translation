  source_fidelity: 'മുഖ്യമായി മൂലഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: പാറ, വേരില്ലായ്മ, താൽക്കാലിക വിശ്വാസം, πειρασμός എന്ന പരീക്ഷാസന്ദർഭം എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ ἀφίστανται-യ്ക്ക് ‘വിശ്വാസം വിട്ടുപോകുന്നു’ എന്നത് സന്ദർഭാനുസൃതമായ വ്യാഖ്യാനമാണെങ്കിലും, ക്രിയയുടെ കൂടുതൽ തുറന്ന ‘പിന്മാറുക/വിട്ടുമാറുക’ എന്ന അർഥത്തെ അല്പം ചുരുക്കുന്നു.'
  naturalness: ഭാഷ ആധുനികവും സ്വാഭാവികവുമാണ്. ‘പരീക്ഷയുടെ സമയത്ത് അവർ പിന്മാറിപ്പോകുന്നു’ എന്ന ക്രമം കൂടുതൽ സുതാര്യവും സ്വാഭാവികവുമാണ്.
