  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രണ്ടു ഘട്ടങ്ങളായ വീഴലും മുള്ളുകളുടെ ഒപ്പം വളർന്ന് ഞെരുക്കലും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
