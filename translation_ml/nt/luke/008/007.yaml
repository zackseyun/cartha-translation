source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν ἐν μέσῳ τῶν ἀκανθῶν, καὶ συμφυεῖσαι αἱ ἄκανθαι ἀπέπνιξαν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: ml
  text: മറ്റൊരു വിത്ത് മുള്ളുകൾക്കിടയിൽ[a] വീണു; അതിനോടൊപ്പം വളർന്ന മുള്ളുകൾ അതിനെ ഞെരുക്കിക്കളഞ്ഞു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുള്ളുകളുടെ നടുവിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മുള്ളുകൾ അതിനോടൊപ്പം വളർന്ന് അതിനെ ഞെരുക്കിക്കളഞ്ഞു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: മറ്റൊരു വിത്ത്
  rationale: മുൻവാക്യങ്ങളിലെ വിത്തിനെ സൂചിപ്പിക്കുന്ന നപുംസക ഏകവചന വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു; മലയാളത്തിൽ ആശയം വ്യക്തമാക്കാൻ ‘വിത്ത്’ ചേർത്തു.
- source_word: ἔπεσεν
  choice: വീണു
  rationale: πίπτω എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനപ്രയോഗവും വിത്ത് നിലത്തു പതിക്കുന്ന പ്രവൃത്തിയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: മുള്ളുകൾക്കിടയിൽ
  rationale: ἐν μέσῳ എന്നതിന്റെ സ്ഥലസംബന്ധമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: മുള്ളുകൾ
  rationale: മുള്ളുള്ള ചെടികളെ സൂചിപ്പിക്കുന്ന ἄκανθα എന്ന പദത്തിന്റെ പരമ്പരാഗത കാർഷികദൃശ്യം നിലനിർത്തുന്ന പൊതുവായ മലയാളപ്രയോഗം.
- source_word: συμφυεῖσαι
  choice: അതിനോടൊപ്പം വളർന്ന
  rationale: വിത്തിനൊപ്പം അല്ലെങ്കിൽ അതിന്റെ കൂടെ വളരുക എന്ന συμφύομαι-യുടെ അർഥം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ പങ്കാളിക്രിയയുടെ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἀπέπνιξαν
  choice: ഞെരുക്കിക്കളഞ്ഞു
  rationale: ചെടിയുടെ വളർച്ച തടഞ്ഞ് ശ്വാസംമുട്ടിക്കുന്നതുപോലുള്ള ἀποπνίγω-യുടെ കാർഷികരൂപകം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτό
  choice: അതിനെ
  rationale: ἕτερον എന്നതിലൂടെ സൂചിപ്പിച്ച വിത്തിലേക്കുള്ള സർവനാമപരാമർശം നിലനിർത്തുന്നു.
