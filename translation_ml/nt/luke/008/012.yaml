id: LUK.8.12
reference: Luke 8:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: ml
  text: വഴിയരികിലുള്ളവർ വചനം കേട്ടവരാണ്; പിന്നെ പിശാച് വന്ന്, അവർ വിശ്വസിച്ച് രക്ഷിക്കപ്പെടാതിരിക്കാനായി അവരുടെ ഹൃദയങ്ങളിൽനിന്ന് വചനം[a] എടുത്തുകളയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “വചനം” എന്നു പറയുന്നത് ദൈവത്തിന്റെ പ്രഖ്യാപിക്കപ്പെട്ട സന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; 8:11 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: വഴിയരികിലുള്ളവർ
  rationale: παράയോടുകൂടിയ സ്ഥാനം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഉപമയിലെ വഴിയരികെന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: ἀκούσαντες
  choice: കേട്ടവരാണ്
  rationale: വചനം കേട്ടവരെന്ന നിലയിലാണ് ഈ കൂട്ടത്തെ യേശു തിരിച്ചറിയിക്കുന്നത്; ഗ്രീക്കിലെ aorist participle മലയാളത്തിൽ സ്വാഭാവികമായ നിർവചനവാക്യമായി നൽകിയിരിക്കുന്നു.
- source_word: εἶτα
  choice: പിന്നെ
  rationale: തുടർന്ന് സംഭവിക്കുന്ന പ്രവൃത്തിയെ ലളിതമായ ക്രമത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ διάβολος
  choice: പിശാച്
  rationale: സന്ദർഭത്തിൽ ഇത് വ്യക്തിപരമായ ദുഷ്ടസത്തയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്ഥിരവും വ്യക്തവുമായ പദം ഉപയോഗിച്ചു.
- source_word: αἴρει
  choice: എടുത്തുകളയുന്നു
  rationale: നീക്കംചെയ്യുക, കൊണ്ടുപോകുക എന്ന അർത്ഥം നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ബലപ്രയോഗത്തിന്റെ ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: ഉപമയുടെ സന്ദർഭത്തിൽ ദൈവത്തിന്റെ പ്രഖ്യാപിക്കപ്പെട്ട സന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ബൈബിൾ ഭാഷയിലെ പരിചിതമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: അവരുടെ ഹൃദയങ്ങളിൽനിന്ന്
  rationale: καρδίαയുടെ ചിന്ത, ഇച്ഛ, പ്രതികരണം എന്നിവ ഉൾക്കൊള്ളുന്ന ബൈബിൾസംബന്ധിയായ വ്യാപ്തി ‘ഹൃദയം’ നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ബഹുവചനബന്ധം മലയാളത്തിലും വ്യക്തമാക്കി.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: അവർ വിശ്വസിച്ച് രക്ഷിക്കപ്പെടാതിരിക്കാനായി
  rationale: പിശാചിന്റെ പ്രവൃത്തിയുടെ ലക്ഷ്യമായി ഈ ഉപവാക്യം അവതരിപ്പിക്കുന്നു. πιστεύσαντες എന്ന participle-നും σωθῶσιν എന്ന ക്രിയയ്ക്കുമിടയിലെ ക്രമബന്ധം ‘വിശ്വസിച്ച് രക്ഷിക്കപ്പെടുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശ്വാസവും രക്ഷയും തമ്മിലുള്ള ബന്ധം
  choice: ‘വിശ്വസിച്ച് രക്ഷിക്കപ്പെടാതിരിക്കാനായി’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: വിശ്വാസത്തിന്റെ സ്വഭാവം, നിലനിൽപ്പ്, ദൈവവിളി എന്നിവയെക്കുറിച്ചുള്ള പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കുക.
  rationale: വചനം നീക്കുന്നതിലൂടെ വിശ്വാസവും രക്ഷയും തടയുകയാണ് പിശാചിന്റെ ലക്ഷ്യമെന്ന് ഗ്രീക്ക് പറയുന്നു. അവ തമ്മിലുള്ള വിപുലമായ ദൈവശാസ്ത്രബന്ധം ഒരു പ്രത്യേക പാരമ്പര്യത്തിനനുസരിച്ച് വിശദീകരിക്കാതെ വാചകത്തിലെ ക്രമവും സംഘർഷവും നിലനിർത്തി.
- issue: ἵνα μήയുടെ ലക്ഷ്യ/ഫല നിഴൽ
  choice: ‘രക്ഷിക്കപ്പെടാതിരിക്കാനായി’ എന്ന ലക്ഷ്യപ്രയോഗം സ്വീകരിച്ചു.
  alternative: ‘അങ്ങനെ അവർ വിശ്വസിച്ച് രക്ഷിക്കപ്പെടുന്നില്ല’ എന്ന ഫലപ്രയോഗം.
  rationale: ഇവിടെ പിശാച് വചനം എടുത്തുകളയുന്നതിന്റെ ഉദ്ദേശ്യം മുൻനിരയിൽ വരുന്നു; അതേസമയം ഗ്രീക്ക് ഘടനയിൽ ലക്ഷ്യവും ഫലവും അടുത്ത് നിൽക്കുന്നതിനാൽ മറ്റ് വ്യാഖ്യാനങ്ങളെ സിദ്ധാന്തപരമായി നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ ശൈലി. ‘വഴിയരികിലുള്ളവർ’, ‘ഹൃദയങ്ങളിൽനിന്ന്’, ‘എടുത്തുകളയുന്നു’ എന്നീ രൂപങ്ങൾ ദൃശ്യരൂപവും ബൈബിൾസംബന്ധിയായ ആശയവ്യാപ്തിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
