id: LUK.8.1
reference: Luke 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: ml
  text: അതിനുശേഷം അധികം വൈകാതെ, അദ്ദേഹം പട്ടണംതോറും ഗ്രാമംതോറും[a] സഞ്ചരിച്ചുകൊണ്ട് ദൈവരാജ്യം[b] പ്രസംഗിക്കുകയും അതിന്റെ സുവാർത്ത അറിയിക്കുകയും ചെയ്തു. പന്ത്രണ്ടുപേരും അദ്ദേഹത്തോടൊപ്പം ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പട്ടണത്തിൽനിന്ന് പട്ടണത്തിലേക്കും ഗ്രാമത്തിൽനിന്ന് ഗ്രാമത്തിലേക്കും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദൈവത്തിന്റെ ഭരണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: അതിനുശേഷം അധികം വൈകാതെ
  rationale: ലൂക്കോസിന്റെ ഈ ആഖ്യാനസൂത്രം സംഭവങ്ങളുടെ തുടർച്ചയും അടുത്ത സംഭവം താമസിയാതെ നടന്നതും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അനാവശ്യമായ കൃത്രിമത്വം ഒഴിവാക്കി കാലക്രമം സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: αὐτὸς
  choice: അദ്ദേഹം
  rationale: ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമായി നൽകിയിട്ടുണ്ടെങ്കിലും ഇവിടെ പ്രത്യേക ഊന്നൽ നിർബന്ധമല്ല. യേശുവിനെ സൂചിപ്പിക്കുന്നതിന് ആദരപൂർവവും സ്വാഭാവികവുമായ സർവനാമം ഉപയോഗിച്ചു.
- source_word: διώδευεν
  choice: സഞ്ചരിച്ച് ... ചെയ്തു
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം തുടർച്ചയായും ആവർത്തിച്ചും നടന്ന സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു; പട്ടണംതോറും ഗ്രാമംതോറും എന്ന വിതരണപ്രയോഗത്തോടൊപ്പം ഈ ഭാവം വ്യക്തമാകുന്നു.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: പട്ടണംതോറും ഗ്രാമംതോറും
  rationale: κατάയും ഏകവചന നാമങ്ങളും ചേർന്നുള്ള വിതരണാർഥം സ്ഥലത്തിൽനിന്ന് സ്ഥലത്തേക്കുള്ള ആവർത്തിത സഞ്ചാരം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകർന്നു.
- source_word: κηρύσσων
  choice: പ്രസംഗിക്കുകയും
  rationale: κηρύσσω എന്നതിലെ പരസ്യമായി പ്രഖ്യാപിക്കുന്ന അർഥം ഇവിടെ ‘പ്രസംഗിക്കുക’ സ്വാഭാവികമായി വഹിക്കുന്നു; അടുത്ത εὐαγγελιζόμενος എന്ന ക്രിയയിൽനിന്നും വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: εὐαγγελιζόμενος
  choice: അതിന്റെ സുവാർത്ത അറിയിക്കുകയും
  rationale: ‘സുവാർത്ത അറിയിക്കുക’ എന്നത് ക്രിയയുടെ സുവിശേഷാർഥം നേരിട്ട് നൽകുന്നു. ‘അതിന്റെ’ എന്നത് ദൈവരാജ്യത്തെക്കുറിച്ചുള്ള സുവാർത്തയാണെന്ന് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: മലയാളത്തിലെ സ്ഥാപിതവും വിശാലവുമായ പ്രയോഗം. βασιλείαയിലെ രാജ്യം/രാജാധിപത്യം എന്നീ ഭാവങ്ങളെ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: οἱ δώδεκα
  choice: പന്ത്രണ്ടുപേർ
  rationale: മൂലത്തിൽ ‘ശിഷ്യന്മാർ’ അല്ലെങ്കിൽ ‘അപ്പൊസ്തലന്മാർ’ എന്നു ചേർത്തിട്ടില്ല. അതിനാൽ അംഗീകൃത സംഘനാമം മാത്രമായി പരിഭാഷപ്പെടുത്തി.
- source_word: σὺν αὐτῷ
  choice: അദ്ദേഹത്തോടൊപ്പം ഉണ്ടായിരുന്നു
  rationale: സഹയാത്രയുടെ ആശയം മലയാളത്തിലെ പൂർണവും സ്വാഭാവികവുമായ ഉപവാക്യമായി നൽകി.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവരാജ്യം
  alternative: ദൈവത്തിന്റെ രാജാധിപത്യം
  rationale: ഈ പദസമുച്ചയത്തിൽ ദൈവത്തിന്റെ ഭരണവും രാജ്യവും ഉൾപ്പെടുന്ന അർഥവ്യാപ്തിയുണ്ട്. ‘ദൈവരാജ്യം’ ആ വിശാലത സംരക്ഷിക്കുന്നു; ‘രാജാധിപത്യം’ എന്നു മാത്രം നൽകിയാൽ ചലനാത്മക ഭരണഭാവത്തിലേക്ക് അർഥം ചുരുങ്ങാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ആവർത്തിത സഞ്ചാരം ‘പട്ടണംതോറും ഗ്രാമംതോറും’ എന്നു നൽകി; സമാനമായ രണ്ടു ഗ്രീക്ക് കൃ participles ‘പ്രസംഗിക്കുക’, ‘സുവാർത്ത അറിയിക്കുക’ എന്നിങ്ങനെ വേർതിരിച്ചു.
