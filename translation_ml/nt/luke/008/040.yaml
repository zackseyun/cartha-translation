translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ മാന്യമായ മലയാളം. ഗ്രീക്കിലെ സമയഘടനയും കാരണബന്ധവും വ്യക്തമായി നിലനിർത്തി; അനാവശ്യമായ ആഖ്യാനബന്ധകമോ വികാരതീവ്രതയോ ചേർത്തിട്ടില്ല.
