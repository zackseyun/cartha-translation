  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: ml
  text: യേശു മടങ്ങിവന്നപ്പോൾ ജനക്കൂട്ടം അവനെ സ്വാഗതം ചെയ്തു[a], കാരണം അവരെല്ലാവരും അവനെ കാത്തിരിക്കുകയായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവനെ സ്വീകരിച്ചു”; ഗ്രീക്ക് ക്രിയയ്ക്ക് സ്വീകരിക്കുക, സ്വാഗതം ചെയ്യുക എന്നീ അർഥങ്ങൾ വരാം. ഈ സന്ദർഭത്തിൽ അനുകൂലമായ സ്വീകരണമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവനെ പ്രതീക്ഷിച്ചിരിക്കുകയായിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: മടങ്ങിവന്നപ്പോൾ
  rationale: ἐν + articular infinitive എന്ന ഘടന സമയസൂചകമാണ്. മലയാളത്തിൽ “മടങ്ങിവന്നപ്പോൾ” സ്വാഭാവികമായി അത് പ്രകടിപ്പിക്കുന്നു. δέ ഇവിടെ ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേക പദമായി നിർബന്ധിച്ച് പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: ὑποστρέφειν
  choice: മടങ്ങിവന്നു
  rationale: ὑποστρέφω എന്നതിന് ഇവിടെ ‘തിരികെ വരുക/മടങ്ങിവരുക’ എന്നാണ് അർഥം; സന്ദർഭത്തിൽ “മടങ്ങിവന്നു” വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἀπεδέξατο
  choice: സ്വാഗതം ചെയ്തു
  rationale: ἀποδέχομαι ഇവിടെ അനുകൂലമായ സ്വീകരണത്തെ സൂചിപ്പിക്കുന്നു. “സ്വാഗതം ചെയ്തു” ആ ഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘സന്തോഷത്തോടെ’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: ὁ ὄχλος
  choice: ജനക്കൂട്ടം
  rationale: ὄχλος കൂടിച്ചേർന്ന ഒരു ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; “ജനക്കൂട്ടം” സ്വാഭാവികമായ ആധുനിക പ്രയോഗമാണ്.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: കാരണം, അവരെല്ലാവരും അവനെ കാത്തിരിക്കുകയായിരുന്നു
  rationale: γάρ സ്വാഗതത്തിന്റെ കാരണം നൽകുന്നു. προσδοκάω എന്നതിന് ‘കാത്തിരിക്കുക’ എന്നും ‘പ്രതീക്ഷിക്കുക’ എന്നും അർഥമാകാം; യേശുവിന്റെ വരവ് കാത്തിരുന്ന ആഖ്യാനസന്ദർഭത്തിൽ “കാത്തിരിക്കുകയായിരുന്നു” യോജിക്കുകയും തുടർച്ചയായ പ്രവൃത്തിയെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πάντες
  choice: അവരെല്ലാവരും
  rationale: മുഴുവൻ ജനക്കൂട്ടവും കാത്തിരുന്നുവെന്ന ഊന്നൽ നിലനിർത്താൻ πάντες വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Ἰησοῦν
  choice: യേശു
  rationale: മലയാളത്തിലെ നിലവാരമുള്ള ബൈബിൾ നാമരൂപം ഉപയോഗിച്ചു.
