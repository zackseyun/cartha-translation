- from: മുള്ളുകൾക്കിടയിൽ വീണതാകട്ടെ, ഇവരാണ് കേട്ടവർ. എന്നാൽ അവർ മുന്നോട്ടുപോകുമ്പോൾ, ജീവിതത്തിലെ ഉത്കണ്ഠകളും[a] സമ്പത്തും സുഖഭോഗങ്ങളും അവരെ ഞെരുക്കിക്കളയുന്നു; അവർ പാകമായ ഫലം പുറപ്പെടുവിക്കുന്നില്ല.[b]
  to: മുള്ളുകൾക്കിടയിൽ വീണതാകട്ടെ, ഇവരാണ് കേട്ടവർ. എന്നാൽ അവർ മുന്നോട്ടുപോകുമ്പോൾ, ഉത്കണ്ഠകളും[a] സമ്പത്തും ജീവിതത്തിലെ സുഖഭോഗങ്ങളും അവരെ ഞെരുക്കിക്കളയുന്നു; അവർ ഫലം പൂർണമായി കായ്ക്കുന്നില്ല.[b]
  rationale: τοῦ βίου എന്ന ജനിറ്റീവിന്റെ ബന്ധം ‘സുഖഭോഗങ്ങൾ’ എന്ന പദത്തോടു മാത്രം വ്യക്തമായി കാണിക്കുന്നതിനായി പദക്രമം തിരുത്തി. τελεσφοροῦσιν-ന്റെ ഫലപൂർത്തി അർഥം കൂടുതൽ സ്വാഭാവികമായ കാർഷികമലയാളത്തിൽ നിലനിർത്താൻ അവസാന പ്രയോഗം പരിഷ്കരിച്ചു. മറ്റെല്ലാ ആശയങ്ങളും, രൂപകവും, ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും മാറ്റിയിട്ടില്ല.
