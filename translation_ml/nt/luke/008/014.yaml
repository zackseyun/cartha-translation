id: LUK.8.14
reference: Luke 8:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: ml
  text: മുള്ളുകൾക്കിടയിൽ വീണതാകട്ടെ, ഇവരാണ് കേട്ടവർ. എന്നാൽ അവർ മുന്നോട്ടുപോകുമ്പോൾ, ഉത്കണ്ഠകളും[a] സമ്പത്തും ജീവിതത്തിലെ സുഖഭോഗങ്ങളും അവരെ ഞെരുക്കിക്കളയുന്നു; അവർ ഫലം പൂർണമായി കായ്ക്കുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വ്യാകുലതകളും” അല്ലെങ്കിൽ “ചിന്താഭാരങ്ങളും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവർ ഫലത്തെ പൂർണതയിലെത്തിക്കുന്നില്ല” അല്ലെങ്കിൽ “അവരുടെ ഫലം പാകമാകുന്നില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... πεσόν
  choice: വീണതാകട്ടെ
  rationale: നപുംസക ഏകവചന പ്രയോഗം ഉപമയിലെ വിത്തിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലത്തിൽ ഇവിടെ ‘വിത്ത്’ എന്ന നാമം ആവർത്തിക്കുന്നില്ല. മലയാളത്തിലും അത് ചേർക്കാതെ സ്വാഭാവികമായി സൂചന നിലനിർത്തുന്നു.
- source_word: εἰς τὰς ἀκάνθας
  choice: മുള്ളുകൾക്കിടയിൽ
  rationale: ഉപമയിലെ കാർഷികചിത്രം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: ഇവരാണ് കേട്ടവർ
  rationale: കേൾവി നടന്നതായി സൂചിപ്പിക്കുന്ന aorist participle സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; അവർ എങ്ങനെ പ്രതികരിച്ചു എന്നതിനെക്കുറിച്ച് അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: πορευόμενοι
  choice: അവർ മുന്നോട്ടുപോകുമ്പോൾ
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന ഗതിയെയോ പ്രക്രിയയെയോ അറിയിക്കുന്നു. ‘ജീവിതയാത്ര’ എന്നു വിശദീകരിച്ച് മൂലത്തിലെ തുറന്ന അർഥം ചുരുക്കുന്നില്ല.
- source_word: μεριμνῶν
  choice: ഉത്കണ്ഠകളും
  rationale: μέριμνα എന്നത് ഉത്കണ്ഠ, ചിന്താഭാരം, വ്യാകുലത എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്നു. ഇവിടെ ‘ഉത്കണ്ഠകൾ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്; മറ്റൊരു സ്വാഭാവിക സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πλούτου
  choice: സമ്പത്തും
  rationale: ഭൗതിക സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന πλοῦτος എന്ന പദത്തിന് ആധുനിക മലയാളത്തിലെ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യം.
- source_word: ἡδονῶν τοῦ βίου
  choice: ജീവിതത്തിലെ ... സുഖഭോഗങ്ങളും
  rationale: βίος ഇവിടെ സാധാരണ ഭൗമിക ജീവിതത്തെ സൂചിപ്പിക്കുന്നു; ἡδοναί നൽകുന്ന ആസ്വാദനവും ഭോഗപരമായ അർഥവും ‘സുഖഭോഗങ്ങൾ’ വ്യക്തമാക്കുന്നു.
- source_word: συμπνίγονται
  choice: അവരെ ഞെരുക്കിക്കളയുന്നു
  rationale: സസ്യത്തെ ചുറ്റിപ്പിടിച്ച് വളർച്ച തടയുന്ന മുള്ളുകളുടെ ദൃശ്യരൂപം നിലനിർത്തുന്നു. മലയാളത്തിലെ സജീവവാക്യം ഗ്രീക്കിലെ കാരണങ്ങളെ കർത്താക്കളാക്കി അതേ ബാധ്യതാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐ τελεσφοροῦσιν
  choice: അവർ പാകമായ ഫലം പുറപ്പെടുവിക്കുന്നില്ല
  rationale: τελεσφορέω ഫലം പൂർണതയിലേക്കോ പാകത്തിലേക്കോ എത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ ഫലത്തിന്റെ ദൃശ്യരൂപവും അപൂർണമായ വളർച്ചയും ഒരുമിച്ചു നിലനിർത്തുന്നു.
theological_decisions:
- issue: മുള്ളുള്ള മണ്ണിലെ കേൾവിക്കാരുടെ പരാജയത്തിന്റെ സ്വഭാവം
  choice: ലൗകിക ഉത്കണ്ഠകളും സമ്പത്തും സുഖഭോഗങ്ങളും അവരെ ഞെരുക്കുന്നതും അവരുടെ ഫലം പാകമാകാത്തതും എന്ന കാർഷികരൂപകം അതേപടി നിലനിർത്തുന്നു.
  alternative: അവർ യഥാർത്ഥ വിശ്വാസികളായിരുന്നില്ല, അല്ലെങ്കിൽ യഥാർത്ഥ വിശ്വാസികളായിരുന്നിട്ടും ഫലശൂന്യരായി, അല്ലെങ്കിൽ വിശ്വാസം ഉപേക്ഷിച്ചു എന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം കേൾവിക്കാരുടെ മേൽ ഈ കാര്യങ്ങൾ ചെലുത്തുന്ന ഫലത്തെ വിവരിക്കുന്നുവെങ്കിലും, പുനർജനനം, വിശ്വാസത്യാഗം, സ്ഥിരോത്സാഹം എന്നിവയെക്കുറിച്ചുള്ള പിന്നീടുള്ള സിദ്ധാന്തവിവാദങ്ങൾ തീർപ്പാക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന നിലയും പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. കാർഷികരൂപകം സംരക്ഷിച്ചിരിക്കുന്നു; ദൈനംദിന വായനക്കാർക്ക് അപരിചിതമായ അതിപുരാതന പദങ്ങൾ ഒഴിവാക്കി. വാക്യത്തിന്റെ വിശദീകരണസ്വഭാവം വ്യക്തമാക്കാൻ രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും ഗ്രീക്ക് വാക്യത്തിലെ ആശയബന്ധം ‘എന്നാൽ’ എന്നും അർധവിരാമം എന്നും ഉപയോഗിച്ച് നിലനിർത്തി.
