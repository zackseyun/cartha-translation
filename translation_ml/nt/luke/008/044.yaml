  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: ml
  text: അവൾ പിന്നിൽനിന്ന് അടുത്തുചെന്ന് അവന്റെ വസ്ത്രത്തിന്റെ വിളുമ്പിൽ[a] തൊട്ടു; ഉടൻതന്നെ അവളുടെ രക്തസ്രാവം നിലച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വസ്ത്രത്തിന്റെ അറ്റം’ എന്നും ‘തൊങ്ങൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: പിന്നിലൂടെ അടുത്തുവന്ന്
  rationale: യേശുവിന്റെ പിന്നിൽനിന്ന് അടുത്തെത്തിയശേഷം അവൾ തൊട്ടു എന്ന അനുബന്ധപ്രവൃത്തിയും ദിശയും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἥψατο
  choice: തൊട്ടു
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയയുടെ സാധാരണ അർഥം ‘തൊടുക’ എന്നാണ്; മുറുകെ പിടിച്ചു എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: τοῦ κρασπέδου
  choice: വിളുമ്പിൽ
  rationale: വസ്ത്രത്തിന്റെ അരിക്, വിളുമ്പ്, അല്ലെങ്കിൽ അവിടെയുള്ള തൊങ്ങൽ എന്നിങ്ങനെ അർഥസാധ്യതയുള്ള പദമാണിത്. ‘വിളുമ്പ്’ പൊതുവായ അർഥം നിലനിർത്തുന്നു; കൂടുതൽ നിർദിഷ്ടമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: അവന്റെ വസ്ത്രത്തിന്റെ
  rationale: ἱμάτιον പുറംവസ്ത്രത്തെ സൂചിപ്പിക്കാമെങ്കിലും, വസ്ത്രത്തിന്റെ കൃത്യമായ രൂപം അനാവശ്യമായി നിർണയിക്കാതെ വിശാലമായ പദം ഉപയോഗിക്കുന്നു.
- source_word: παραχρῆμα
  choice: ഉടൻതന്നെ
  rationale: ഫലം തൽക്ഷണം സംഭവിച്ചതിനെ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: അവളുടെ രക്തസ്രാവം നിലച്ചു
  rationale: തുടർന്നുകൊണ്ടിരുന്ന രക്തപ്രവാഹം അവസാനിച്ചു എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: κράσπεδον എന്ന പദത്തിലെ യഹൂദവസ്ത്രാചാരസൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘വിളുമ്പ്’
  alternative: ‘അരിക്’ അല്ലെങ്കിൽ ‘തൊങ്ങൽ’
  rationale: ഈ പദം സാധാരണയായി വസ്ത്രത്തിന്റെ അരികിനെയോ കൂടുതൽ നിർദിഷ്ടമായി യഹൂദവസ്ത്രത്തിലെ തൊങ്ങലിനെയോ സൂചിപ്പിക്കാം. വാക്യം തന്നിൽ തോറായിലെ തൊങ്ങലുകളെക്കുറിച്ചുള്ള സൂചന നിർബന്ധമല്ലാത്തതിനാൽ പ്രധാനപാഠം അർഥം ചുരുക്കുന്നില്ല; സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പ്രവർത്തനക്രമം സ്വാഭാവികമായി നിലനിർത്തുകയും, വസ്ത്രഭാഗത്തെക്കുറിച്ചുള്ള യഥാർഥ പദസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
