id: LUK.8.30
reference: Luke 8:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: ml
  text: അപ്പോൾ യേശു അവനോട്, “നിന്റെ പേര് എന്താണ്?” എന്നു ചോദിച്ചു. അവൻ, “ലെഗിയോൻ”[a] എന്നു പറഞ്ഞു; കാരണം അനേകം ഭൂതങ്ങൾ അവനിൽ പ്രവേശിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ലെഗിയോൻ” എന്നത് ഒരു വലിയ റോമൻ സൈനികവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ലത്തീൻ പദമാണ്; ഇവിടെ ആ മനുഷ്യനിൽ അനേകം ഭൂതങ്ങൾ ഉണ്ടായിരുന്നുവെന്ന് ഈ പേര് സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: ചോദിച്ചു
  rationale: നേരിട്ടുള്ള ഒരു ചോദ്യം അവതരിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനപ്രയോഗമായതിനാൽ, ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ ‘ചോദിച്ചു’ ഉപയോഗിച്ചു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിന്റെ തുടർച്ചയും അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: നിന്റെ പേര് എന്താണ്?
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിലെ പതിവായ ചോദ്യരൂപത്തിൽ നൽകി.
- source_word: Λεγιών
  choice: ലെഗിയോൻ
  rationale: ലത്തീൻ സൈനികപദത്തിൽനിന്നുള്ള ഈ പേരിനെ അർഥം മാറ്റാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ‘ലെഗിയോൻ’ എന്ന പേര് പറഞ്ഞതിന്റെ കാരണം തുടർന്നുള്ള വാക്യം വ്യക്തമാക്കുന്നതിനാൽ കാരണബന്ധം നേരിട്ട് നിലനിർത്തി.
- source_word: εἰσῆλθεν
  choice: പ്രവേശിച്ചിരുന്നു
  rationale: ഭൂതങ്ങൾ പ്രവേശിച്ച സംഭവം പേര് പറയുന്നതിനു മുമ്പുള്ളതാണെന്ന സന്ദർഭബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δαιμόνια πολλὰ
  choice: അനേകം ഭൂതങ്ങൾ
  rationale: ‘ഭൂതങ്ങൾ’ എന്നത് δαιμόνιαയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; πολλὰയുടെ ബഹുത്വവും ഊന്നലും ‘അനേകം’ നിലനിർത്തുന്നു.
- source_word: εἰς αὐτόν
  choice: അവനിൽ
  rationale: മലയാളത്തിൽ ‘അവനിൽ പ്രവേശിച്ചു’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ അകത്തേക്കുള്ള ചലനാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ദുഷ്ടാത്മീയ സത്തകളെ സൂചിപ്പിക്കുന്ന δαιμόνιαയുടെ പരിഭാഷ
  choice: ഭൂതങ്ങൾ
  alternative: ദുഷ്ടാത്മാക്കൾ
  rationale: മൂലപദത്തിന്റെ പ്രത്യേക അർഥവും വ്യക്തിപരമായ അനേകം ദുഷ്ടാത്മീയ സത്തകൾ മനുഷ്യനിൽ പ്രവേശിച്ചുവെന്ന വാക്യത്തിന്റെ അവകാശവാദവും മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- issue: εἰσῆλθεν സൂചിപ്പിക്കുന്ന സംഭവത്തിന്റെ കാലബന്ധം
  choice: പ്രവേശിച്ചിരുന്നു
  alternative: പ്രവേശിച്ചു
  rationale: അവൻ ‘ലെഗിയോൻ’ എന്നു മറുപടി പറയുന്നതിന് മുമ്പേ ഭൂതങ്ങൾ പ്രവേശിച്ചിരുന്നുവെന്ന ആഖ്യാനബന്ധം വ്യക്തമാക്കുന്നു; ഇത് വ്യാഖ്യാനപരമായ പുതിയ ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ലെഗിയോൻ’ ലിപ്യന്തരിച്ചു; അതിന്റെ റോമൻ സൈനിക പശ്ചാത്തലം അടിക്കുറിപ്പിൽ ചുരുക്കി വിശദീകരിച്ചു. നൽകിയ ഇംഗ്ലീഷ് കരടിലെ ആദ്യ അടിക്കുറിപ്പിന്റെ സ്ഥാനവും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തമില്ലാത്തതിനാൽ, മൂലഗ്രീക്കിൽ ഉറപ്പുള്ള വിവരത്തെ അടിസ്ഥാനമാക്കി സാംസ്കാരിക അടിക്കുറിപ്പ് മാത്രം ഉൾപ്പെടുത്തി.
