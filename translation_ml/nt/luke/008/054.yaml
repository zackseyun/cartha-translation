source:
  edition: SBLGNT
  text: αὐτὸς ⸀δὲ κρατήσας τῆς χειρὸς αὐτῆς ἐφώνησεν λέγων· Ἡ παῖς, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: ml
  text: എന്നാൽ അവൻ അവളുടെ കൈ പിടിച്ച്, “കുഞ്ഞേ[a], എഴുന്നേൽക്കൂ” എന്ന് വിളിച്ചുപറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പെൺകുട്ടിയേ.” ഗ്രീക്കിലെ παῖς എന്ന പദത്തിന് “കുട്ടി” എന്നും ഈ സന്ദർഭത്തിൽ “പെൺകുട്ടി” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: എന്നാൽ അവൻ
  rationale: δέ ഇവിടെ മുൻസന്ദർഭത്തോടുള്ള നേരിയ വൈരുധ്യവും കഥയിലെ വഴിത്തിരിവും സൂചിപ്പിക്കുന്നു; αὐτός സ്വാഭാവികമായി ‘അവൻ’ എന്നു നൽകി, സന്ദർഭം ആവശ്യപ്പെടാത്ത അമിത ഊന്നൽ ഒഴിവാക്കി.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: അവളുടെ കൈയിൽ പിടിച്ച്
  rationale: κρατέω എന്നത് ഉറച്ചുപിടിക്കുന്ന ശാരീരിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കൈയിൽ പിടിച്ച്’ സ്വാഭാവികവും കഠിനത സൂചിപ്പിക്കാത്തതുമായ പ്രയോഗമാണ്.
- source_word: ἐφώνησεν λέγων
  choice: എന്ന് വിളിച്ചുപറഞ്ഞു
  rationale: φωνέω കേൾക്കത്തക്കവിധമുള്ള വിളിയെ സൂചിപ്പിക്കുന്നു; λέγων നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിലെ ഉദ്ധരണിഘടനയിൽ ഇവ രണ്ടും ‘എന്ന് വിളിച്ചുപറഞ്ഞു’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: Ἡ παῖς
  choice: കുഞ്ഞേ
  rationale: παῖς എന്നതിന് പൊതുവായി ‘കുട്ടി/കുഞ്ഞ്’ എന്നും സന്ദർഭത്തിൽ ‘പെൺകുട്ടി’ എന്നും അർഥമാകാം. ‘കുഞ്ഞേ’ അഭിസംബോധനയുടെ വാത്സല്യവും പദത്തിന്റെ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; സമാന്തരവിവരണങ്ങളിൽനിന്ന് ‘ചെറിയ പെൺകുട്ടി’ എന്ന ആശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἔγειρε
  choice: എഴുന്നേൽക്കൂ
  rationale: ἐγείρωയുടെ വർത്തമാനകാല ആജ്ഞാരൂപം നേരിട്ടുള്ള എഴുന്നേൽക്കാനുള്ള കല്പനയാണ്. ‘എഴുന്നേൽക്കൂ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവും മാന്യവുമാണ്.
theological_decisions:
- issue: യേശു പെൺകുട്ടിയെ അഭിസംബോധന ചെയ്യുന്ന വിധം
  choice: കുഞ്ഞേ
  alternative: പെൺകുട്ടിയേ
  rationale: παῖς പൊതുവായി കുട്ടിയെയോ സന്ദർഭാനുസരണം പെൺകുട്ടിയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിലെ ‘കുഞ്ഞേ’ ഈ അർഥവ്യാപ്തിയും വാത്സല്യവും സംരക്ഷിക്കുന്നു; പ്രത്യേക ലിംഗസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ജീവനിലേക്കുള്ള പുനഃസ്ഥാപനത്തിന്റെ ആജ്ഞ
  choice: എഴുന്നേൽക്കൂ
  alternative: എഴുന്നേൽക്ക
  rationale: കല്പനയുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തിക്കൊണ്ട്, സാധാരണ ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായ രൂപം തിരഞ്ഞെടുത്തു; അനാവശ്യമായ പുരാതനഭാഷാശൈലി ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘വിളിച്ചുപറഞ്ഞു’ എന്നത് ശബ്ദത്തോടെ അഭിസംബോധന ചെയ്തതിനെ വ്യക്തമാക്കുന്നു; ‘എഴുന്നേൽക്കൂ’ പുരാതനഭാവമില്ലാതെ കല്പനയുടെ ശക്തി നിലനിർത്തുന്നു.
