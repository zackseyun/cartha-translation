id: LUK.8.38
reference: Luke 8:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: ml
  text: 'ഭൂതങ്ങൾ വിട്ടുപോയിരുന്ന ആ മനുഷ്യൻ യേശുവിനോടൊപ്പം ഉണ്ടായിരിക്കാൻ യേശുവിനോട് അപേക്ഷിച്ചുകൊണ്ടിരുന്നു. എന്നാൽ യേശു അവനോടു ഇങ്ങനെ പറഞ്ഞ് അവനെ പറഞ്ഞയച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: അപേക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടരുന്നോ ആവർത്തിച്ചോ ഉള്ള ഹൃദയപൂർവമായ അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അതിന്റെ ദൈർഘ്യവും ഗൗരവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: αὐτοῦ
  choice: യേശുവിനോട്
  rationale: δέομαι എന്ന ക്രിയയോടുള്ള ഷഷ്ഠീവിഭക്തി അപേക്ഷിക്കപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ സൂചിതവ്യക്തി യേശുവായതിനാൽ മലയാളത്തിൽ പേര് വ്യക്തമാക്കുന്നത് സർവനാമകുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: ὁ ἀνὴρ
  choice: ആ മനുഷ്യൻ
  rationale: മുമ്പ് പരാമർശിക്കപ്പെട്ട പുരുഷനെയാണ് ἀνήρ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ആ മനുഷ്യൻ’ സ്വാഭാവികമായ മുൻപരാമർശസൂചന നൽകുന്നു.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: ഭൂതങ്ങൾ വിട്ടുപോയ
  rationale: പൂർവപൂർണകാലരൂപം മുഖ്യസംഭവത്തിനു മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘വിട്ടുപോയ’ മലയാളത്തിൽ ആ മുൻസംഭവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: τὰ δαιμόνια
  choice: ഭൂതങ്ങൾ
  rationale: δαιμόνια എന്ന പദത്തിന്റെ വ്യക്തിപരമായ അമാനുഷിക സത്തകളെന്ന അർഥം നിലനിർത്തുന്ന, സാധാരണ മലയാള ബൈബിൾ-ഭാഷയിലും പൊതുഭാഷയിലും മനസ്സിലാകുന്ന നേരിട്ടുള്ള പദമാണിത്.
- source_word: εἶναι σὺν αὐτῷ
  choice: തന്നോടൊപ്പം ഇരിക്കാൻ
  rationale: ‘അവനോടൊപ്പം ആയിരിക്കുക’ എന്ന നേരിട്ടുള്ള ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അനുഗമിക്കുക എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: ἀπέλυσεν αὐτόν
  choice: അവനെ പറഞ്ഞയച്ചു
  rationale: അവന്റെ അഭ്യർഥന അംഗീകരിക്കാതെ മറ്റൊരിടത്തേക്ക് മടക്കി അയയ്ക്കുന്നതാണ് സന്ദർഭം; ‘പറഞ്ഞയച്ചു’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു, പരുഷതയോ തടവിൽനിന്നുള്ള മോചനമോ സൂചിപ്പിക്കാതെ.
- source_word: λέγων
  choice: പറഞ്ഞയച്ചുകൊണ്ട് ഇങ്ങനെ പറഞ്ഞു
  rationale: വാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള ഉദ്ധരണിയിലേക്ക് നയിക്കുന്നു. മലയാളത്തിൽ ഈ രൂപം ബന്ധം വ്യക്തമാക്കുകയും വാക്യാവസാനത്തിലെ അപൂർണത സ്വാഭാവികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഭൂതോച്ചാടനസന്ദർഭത്തിൽ δαιμόνια എന്നതിന്റെ പരിഭാഷ
  choice: ഭൂതങ്ങൾ
  alternative: ദുരാത്മാക്കൾ
  rationale: മൂലപാഠം മനുഷ്യനെ വിട്ടുപോയ വ്യക്തിപരമായ അമാനുഷിക സത്തകളെ അവതരിപ്പിക്കുന്നു. ‘ഭൂതങ്ങൾ’ ആ അവകാശവാദത്തെ മയപ്പെടുത്താതെ നേരിട്ട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പരസ്പരം അടുത്തുള്ള αὐτοῦ/αὐτῷ/αὐτόν എന്നീ സർവനാമങ്ങൾ മലയാളത്തിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതിരിക്കാൻ യേശുവിന്റെ പേര് ആവശ്യമായിടത്ത് വ്യക്തമാക്കി; മൂലത്തിലെ δέ-യുടെ ലഘുവായ വൈരുധ്യം ‘എന്നാൽ’കൊണ്ട് പ്രകടിപ്പിച്ചു. വായനാസഹായം ആവശ്യമില്ലാത്തതിനാൽ അടിക്കുറിപ്പുകളില്ല.
