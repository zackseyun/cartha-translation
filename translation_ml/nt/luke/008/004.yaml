  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: ml
  text: 'വലിയൊരു ജനക്കൂട്ടം കൂടിവരുകയും പട്ടണംതോറും ആളുകൾ അവന്റെ അടുക്കൽ വന്നുചേരുകയും ചെയ്തപ്പോൾ, അവൻ ഒരു ഉപമയിലൂടെ[a] പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ഉപമാരൂപത്തിൽ പറഞ്ഞു.” διὰ παραβολῆς എന്ന ഗ്രീക്ക് പ്രയോഗം ഉപമയെ സംസാരത്തിന്റെ മാധ്യമമായോ രീതിയായോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
  choice: കൂടിവരുകയും
  rationale: ὄχλου πολλοῦ എന്നതിനോടു ചേർന്ന ജനിറ്റീവ് അബ്സല്യൂട്ട് പ്രയോഗത്തിലെ പുരോഗമിച്ചുകൊണ്ടിരുന്ന പ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, കഥയുടെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ വാക്യപ്രവാഹം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ὄχλου πολλοῦ
  choice: വലിയൊരു ജനക്കൂട്ടം
  rationale: ὄχλος എന്നതിന്റെ ‘ജനക്കൂട്ടം’ എന്ന അർഥവും πολλοῦ സൂചിപ്പിക്കുന്ന വലുപ്പവും ലളിതവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: പട്ടണംതോറും ആളുകൾ ... വന്നുചേരുകയും
  rationale: κατὰ πόλιν എന്നതിന്റെ വിതരണാർഥമായ ‘പട്ടണംതോറും’ നിലനിർത്തുന്നു; ἐπιπορευομένων എന്ന പുരോഗമനപ്രവർത്തനം ‘വന്നുചേരുകയും’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρὸς αὐτόν
  choice: അവന്റെ അടുക്കൽ
  rationale: πρός + accusative സൂചിപ്പിക്കുന്ന അവന്റെ നേർക്കുള്ള ചലനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: തുടർന്ന് വരുന്ന ഉപമയുടെ ഉള്ളടക്കത്തിലേക്ക് നയിക്കുന്ന സാധാരണവും കൃത്യവുമായ പ്രസംഗക്രിയയാണ്.
- source_word: διὰ παραβολῆς
  choice: ഒരു ഉപമയിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കാവുന്ന മാധ്യമാർഥം നേരിട്ട് നൽകുന്നു; manner എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
