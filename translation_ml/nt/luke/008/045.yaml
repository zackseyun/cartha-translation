  to: 'യേശു ചോദിച്ചു: “എന്നെ തൊട്ടത് ആരാണ്?” എല്ലാവരും നിഷേധിച്ചുകൊണ്ടിരിക്കെ പത്രോസ് പറഞ്ഞു: “ഗുരുവേ, ജനക്കൂട്ടങ്ങൾ അങ്ങയെ ചുറ്റിനിന്ന് ഞെരുക്കുകയും അമർത്തുകയും ചെയ്യുന്നു.”'
