reference: Luke 8:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: ml
  text: 'യേശു ചോദിച്ചു: “എന്നെ തൊട്ടത് ആരാണ്?” എല്ലാവരും നിഷേധിച്ചുകൊണ്ടിരിക്കെ പത്രോസ് പറഞ്ഞു: “ഗുരുവേ, ജനക്കൂട്ടങ്ങൾ അങ്ങയെ ചുറ്റിനിന്ന് ഞെരുക്കുകയും അമർത്തുകയും ചെയ്യുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁψάμενός
  choice: തൊട്ടത്
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ἅπτω ഇവിടെ ശാരീരികമായി തൊടുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: ἀρνουμένων δὲ πάντων
  choice: എല്ലാവരും അത് നിഷേധിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവം ‘നിഷേധിച്ചുകൊണ്ടിരിക്കുമ്പോൾ’ നിലനിർത്തുന്നു; ‘അത്’ എന്നത് ചോദ്യത്തിന്റെ സന്ദർഭത്തിൽനിന്ന് സ്വാഭാവികമായി പൂരിപ്പിച്ചതാണ്.
- source_word: Ἐπιστάτα
  choice: ഗുരുവേ
  rationale: ലൂക്കോസ് ഉപയോഗിക്കുന്ന ഈ ആദരസംബോധന യേശുവിന്റെ അധികാരം അംഗീകരിക്കുന്നു. κύριος എന്നതിനോട് തുല്യമായ ‘കർത്താവേ’ എന്നു മാറ്റാതെ, സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഗുരുവേ’ ഉപയോഗിച്ചു.
- source_word: ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനവും യേശുവിനെ ചുറ്റിയിരുന്ന അനേകം ആളുകളുടെ ധാരണയും നിലനിർത്തുന്നു.
- source_word: συνέχουσίν
  choice: അങ്ങയെ ചുറ്റിവളഞ്ഞ്
  rationale: ചുറ്റുംനിന്ന് ഞെരുക്കുകയോ നിയന്ത്രിക്കുകയോ ചെയ്യുന്ന ദൃശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ἀποθλίβουσιν
  choice: തിക്കിത്തിരക്കുകയാണല്ലോ
  rationale: ജനക്കൂട്ടം ശരീരത്തോട് ചേർന്ന് സമ്മർദം ചെലുത്തുന്ന തീവ്രതയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; മുൻക്രിയയിൽനിന്നുള്ള അർത്ഥവ്യത്യാസവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ἐπιστάτα എന്ന യേശുസംബോധനയുടെ പരിഭാഷ
  choice: ഗുരുവേ
  alternative: കർത്താവേ; നാഥാ
  rationale: മൂലപാഠത്തിൽ κύριος അല്ല, Ἐπιστάτα ആണ്. അതിനാൽ മൂലത്തിൽ പ്രകടമാക്കിയതിലധികം ശക്തമായ ക്രിസ്തുശാസ്ത്രപരമായ പദവി ചേർക്കാതെ, ആദരവും അധികാരവും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളസംബോധന തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അങ്ങയെ’ എന്ന ആദരസൂചക സർവനാമവും ‘ഗുരുവേ’ എന്ന പൊതുവായി മനസ്സിലാകുന്ന സംബോധനയും ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാതെ ‘said’ എന്നതിനു പിന്നാലെ വന്നതിനാൽ, മൂലഗ്രീക്കിൽ പാഠവ്യത്യാസമോ വിശദീകരണാവശ്യമോ ഇല്ലാത്തിടത്ത് അത് പുനരാവർത്തിച്ചിട്ടില്ല.
