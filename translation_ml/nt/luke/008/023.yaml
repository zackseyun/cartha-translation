id: LUK.8.23
reference: Luke 8:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: ml
  text: അവർ പടകിൽ സഞ്ചരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ അവൻ ഉറങ്ങിപ്പോയി. ഒരു കൊടുങ്കാറ്റ് തടാകത്തിന്മേൽ ഇറങ്ങിവന്നു. പടകിൽ വെള്ളം നിറഞ്ഞുകൊണ്ടിരുന്നു[a]; അവർ അപകടത്തിലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഗ്രീക്കിലെ ബഹുവചനരൂപം പടകിലുള്ളവർ വെള്ളത്താൽ നിറഞ്ഞ് മൂടപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: സന്ദർഭത്തിൽ പടകിൽ വെള്ളം നിറയുന്നതാണ് സ്വാഭാവിക അർഥം; എന്നാൽ συνεπληροῦντο എന്ന ബഹുവചനരൂപത്തിന്റെ വ്യാകരണപരമായ സൂചനയും നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: അവർ പടകിൽ സഞ്ചരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തോടുകൂടിയ genitive absolute, പശ്ചാത്തലത്തിൽ തുടർന്നുകൊണ്ടിരുന്ന സമകാലിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സഞ്ചരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ’ ആ പുരോഗമനഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀφύπνωσεν
  choice: അവൻ ഉറങ്ങിപ്പോയി
  rationale: Aorist ഇവിടെ ഉറക്കത്തിലേക്കു പ്രവേശിക്കുന്ന ingressive അർഥം നൽകുന്നു; ‘ഉറങ്ങിപ്പോയി’ അത് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ കർത്താവ് യേശുവാണ്, എന്നാൽ ഗ്രീക്കിലെ സർവനാമരഹിത രൂപത്തോട് ചേർന്ന് ‘അവൻ’ നിലനിർത്തുന്നു.
- source_word: κατέβη
  choice: ഇറങ്ങിവന്നു
  rationale: കാറ്റ് ഉയർന്ന പ്രദേശങ്ങളിൽനിന്ന് തടാകത്തിലേക്ക് താഴേക്ക് വരുന്നതിന്റെ ദൃശ്യഭാവം സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: λαῖλαψ ἀνέμου
  choice: ഒരു കൊടുങ്കാറ്റ്
  rationale: കാറ്റാൽ സവിശേഷമായ ശക്തമായ ചുഴലിക്കാറ്റിനെയോ കൊടുങ്കാറ്റിനെയോ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: εἰς τὴν λίμνην
  choice: തടാകത്തിലേക്ക്
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചകമായ ‘-ലേക്ക്’ എന്ന അർഥം നിലനിർത്തുകയും κατέβηയോടൊപ്പം കാറ്റ് തടാകത്തിലേക്ക് ഇറങ്ങിവന്നെന്ന ഭൗമദൃശ്യത്തെ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: συνεπληροῦντο
  choice: അവർ വെള്ളത്തിൽ മുങ്ങിപ്പോകുകയായിരുന്നു
  rationale: അപൂർണ്ണകാലത്തിലെ തുടർച്ചയായ അപകടാവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു. ഗ്രീക്കിലെ ബഹുവചനരൂപം ആളുകളെ കർത്താക്കളായി അവതരിപ്പിക്കുമ്പോഴും, ഉദ്ദേശ്യം പടകിൽ വെള്ളം നിറയുന്നതായിരിക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ἐκινδύνευον
  choice: അവർ അപകടത്തിലായി
  rationale: ഗൗരവമുള്ള അപകടാവസ്ഥയെ ലളിതവും ആധുനികവുമായ ഭാഷയിൽ നൽകുന്നു; മുൻവാക്യത്തിലെ പുരോഗമനാവസ്ഥയോടൊപ്പം അവരുടെ സ്ഥിതി അപകടകരമായിത്തീർന്നതും വ്യക്തമാക്കുന്നു.
