  to: അവർ പടകിൽ സഞ്ചരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ അവൻ ഉറങ്ങിപ്പോയി. ഒരു കൊടുങ്കാറ്റ് തടാകത്തിന്മേൽ ഇറങ്ങിവന്നു. പടകിൽ വെള്ളം നിറഞ്ഞുകൊണ്ടിരുന്നു[a]; അവർ അപകടത്തിലായിരുന്നു.
  rationale: The revision renders συνεπληροῦντο as the boat’s ongoing filling with water, the contextual sense required by the scene, while the footnote preserves the plural-form ambiguity. It also changes the final verb to an ongoing danger state, matching the Greek imperfect. The storm’s descent is expressed idiomatically as coming down upon the lake.
