translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. കാലാവസ്ഥയുടെ ചലനദൃശ്യവും അപൂർണ്ണകാല ക്രിയകളിലെ തുടരുന്ന അപകടഭാവവും നിലനിർത്തി; പടകിൽ വെള്ളം നിറയുന്നതുമായി ബന്ധപ്പെട്ട വ്യാകരണപരമായ സൂചന അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
