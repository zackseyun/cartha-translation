  source_fidelity: 'ഗ്രീക്കിലെ സംഭവക്രമവും കാർഷികരൂപകവും കൃത്യമായി പ്രതിഫലിക്കുന്നു: ‘മറ്റൊന്ന്,’ ‘നല്ല മണ്ണിൽ,’ വളർച്ചയ്ക്കുശേഷമുള്ള നൂറുമടങ്ങ് വിളവ്, തുടർന്ന് യേശുവിന്റെ ഊന്നിയ ആഹ്വാനം എന്നിവയെല്ലാം നിലനിൽക്കുന്നു. ‘അത് വളർന്നപ്പോൾ’ φυὲν എന്ന കൃദന്തരൂപത്തിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷയാണ്; ‘ഉറക്കെ വിളിച്ചുപറഞ്ഞു’ ἐφώνειയുടെ പരസ്യവും ഊന്നലുമുള്ള വിളിയെ യോജ്യമായി നൽകുന്നു.'
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സുഗമവും വായനാസൗകര്യമുള്ളതുമാണ്. ‘നല്ല മണ്ണിൽ’ എന്നും ‘നൂറുമടങ്ങ് വിളവ് നൽകി’ എന്നും കൃഷിസന്ദർഭത്തിന് സ്വാഭാവികമാണ്. അവസാനത്തിലെ ആഹ്വാനം ചുരുക്കവും ഗൗരവമുള്ളതുമാണ്.
