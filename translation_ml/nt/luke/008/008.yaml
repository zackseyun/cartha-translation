id: LUK.8.8
reference: Luke 8:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: ml
  text: 'മറ്റൊന്ന് നല്ല മണ്ണിൽ വീണു; അത് വളർന്നപ്പോൾ നൂറുമടങ്ങ് വിളവ് നൽകി. ഇവ പറയുമ്പോൾ അദ്ദേഹം ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “കേൾക്കാൻ ചെവിയുള്ളവൻ കേൾക്കട്ടെ!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: മറ്റൊന്ന്
  rationale: ഉപമയിൽ വിതയ്ക്കപ്പെട്ട വിത്തുകളിൽ മറ്റൊന്നിനെ സൂചിപ്പിക്കുന്ന നപുംസക ഏകവചനപ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γῆν τὴν ἀγαθήν
  choice: നല്ല മണ്ണിൽ
  rationale: കൃഷിസന്ദർഭത്തിൽ γῆയുടെ അർഥം ‘നിലം’ എന്നതിനെക്കാൾ വ്യക്തമായി നൽകുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: φυὲν
  choice: അത് വളർന്നപ്പോൾ
  rationale: φύωയുടെ ഭൂതകാല കൃദന്തരൂപം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള വളർച്ചയെ സൂചിപ്പിക്കുന്നു; ‘വളർന്നപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐποίησεν καρπὸν ἑκατονταπλασίονα
  choice: നൂറുമടങ്ങ് വിളവ് നൽകി
  rationale: അക്ഷരാർഥമായ ‘ഫലം ഉണ്ടാക്കി’ എന്നതിനെക്കാൾ കൃഷിസന്ദർഭത്തിൽ സ്വാഭാവികവും, സമൃദ്ധമായ ഉൽപാദനത്തിന്റെ അർഥം കൃത്യമായി നൽകുന്നതുമായ പ്രയോഗം.
- source_word: ταῦτα λέγων
  choice: ഇവ പറയുമ്പോൾ
  rationale: പറയുന്നതും ഉറക്കെ വിളിച്ചുപറയുന്നതും ഒരേ സമയത്ത് നടക്കുന്നുവെന്ന വർത്തമാന കൃദന്തത്തിന്റെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐφώνει
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: φωνέωയുടെ ഊന്നിയ പരസ്യപ്രഖ്യാപനഭാവം ‘വിളിച്ചുപറഞ്ഞു’ നൽകുന്നു; ‘ഉറക്കെ’ ശബ്ദത്തിന്റെ ഊന്നൽ വ്യക്തമാക്കുന്നു.
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: കേൾക്കാൻ ചെവിയുള്ളവൻ
  rationale: ഗ്രീക്കിലെ പ്രതിനിധിയായ ഏകവചന കൃദന്തനിർമ്മിതി മലയാളത്തിൽ പൊതുവായ അർഥത്തോടെ സ്വാഭാവികമായി പകരുന്നു; ഇത് പുരുഷന്മാർക്കു മാത്രമായുള്ള പരാമർശമല്ല.
- source_word: ἀκουέτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന വർത്തമാന ആജ്ഞാരൂപത്തിന്റെ ഗൗരവമുള്ള ആഹ്വാനം ചുരുക്കമായും പതിവായും നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ആഹ്വാനത്തിലെ പ്രതിനിധിയായ ഏകവചനപ്രയോഗം
  choice: “കേൾക്കാൻ ചെവിയുള്ളവൻ കേൾക്കട്ടെ” എന്ന പൊതുവായ പ്രതിനിധിപ്രയോഗം
  alternative: “കേൾക്കാൻ ചെവിയുള്ള ആരും കേൾക്കട്ടെ”
  rationale: Ὁ ἔχων എന്നത് പ്രത്യേകിച്ച് പുരുഷനെ മാത്രമല്ല, കേൾവിക്കുള്ള ഏവരെയും പ്രതിനിധീകരിക്കുന്ന ഏകവചനമാണ്. മലയാളത്തിലെ ‘ഉള്ളവൻ’ ഈ പഴഞ്ചൊൽസദൃശമായ ആഹ്വാനത്തിൽ സ്വാഭാവികമായി പൊതുവായ അർഥം വഹിക്കുകയും ഗ്രീക്കിലെ ഏകവചനശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉപമയുടെ കൃഷിഭാഷ സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകിയിരിക്കുന്നു; അവസാന ആഹ്വാനത്തിന്റെ ഊന്നലും ഔന്നത്യവും നിലനിർത്തുന്നു.
