source:
  edition: SBLGNT
  text: Ἰδόντες δὲ οἱ βόσκοντες τὸ ⸀γεγονὸς ἔφυγον καὶ ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: ml
  text: പന്നികളെ മേയിച്ചുകൊണ്ടിരുന്നവർ സംഭവിച്ചത് കണ്ടപ്പോൾ ഓടിപ്പോയി, പട്ടണത്തിലും നാട്ടിൻപുറങ്ങളിലും അതു അറിയിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘വയലുകളിലും’; ഇവിടെ ചുറ്റുമുള്ള ഗ്രാമീണ പ്രദേശങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: കണ്ടപ്പോൾ
  rationale: പ്രധാന ക്രിയകളുമായുള്ള കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കാൻ aorist participle കാലസൂചക ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: οἱ βόσκοντες
  choice: പന്നികളെ മേയിച്ചുകൊണ്ടിരുന്നവർ
  rationale: βόσκωയുടെ substantival participle മൃഗങ്ങളെ പരിപാലിച്ചവരെ സൂചിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തിലെ പന്നികളെ വ്യക്തമായി ചേർക്കുന്നത് മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: τὸ γεγονός
  choice: സംഭവിച്ചത്
  rationale: γίνομαιയുടെ perfect participle പൂർത്തിയായ സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘സംഭവിച്ചത്’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: ἔφυγον
  choice: ഓടിപ്പോയി
  rationale: φεύγω ഇവിടെ സംഭവസ്ഥലത്തുനിന്നുള്ള പെട്ടെന്നുള്ള പലായനത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഓടിപ്പോയി’ സ്വാഭാവികമാണ്.
- source_word: ἀπήγγειλαν
  choice: അതു അറിയിച്ചു
  rationale: ἀπαγγέλλω വാർത്ത അറിയിക്കുക അഥവാ റിപ്പോർട്ട് ചെയ്യുക എന്ന അർഥം നൽകുന്നു; സന്ദർഭത്തിൽ നിന്നുള്ള കർമം ‘അതു’ എന്നു വ്യക്തമാക്കി.
- source_word: εἰς τὴν πόλιν
  choice: പട്ടണത്തിലും
  rationale: വാർത്ത അറിയിച്ച സ്ഥലപരിധിയെ സ്വാഭാവിക മലയാളത്തിൽ locative രൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: നാട്ടിൻപുറങ്ങളിലും
  rationale: ἀγροί അക്ഷരാർഥത്തിൽ വയലുകൾ എന്നാണെങ്കിലും പട്ടണത്തോടുള്ള വൈരുധ്യത്തിൽ ചുറ്റുമുള്ള ഗ്രാമീണ പ്രദേശങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
