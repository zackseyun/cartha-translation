translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇടയന്മാർ’ എന്നു പറഞ്ഞാൽ ആടുകളെ മേയിക്കുന്നവർ എന്ന തെറ്റിദ്ധാരണ വരാവുന്നതിനാൽ സന്ദർഭാനുസൃതമായി ‘പന്നികളെ മേയിച്ചുകൊണ്ടിരുന്നവർ’ എന്നു വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
