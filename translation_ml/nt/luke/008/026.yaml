id: LUK.8.26
reference: Luke 8:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: ml
  text: അവർ ഗലീലയുടെ മറുകരയിലുള്ള ഗെരസേന്യരുടെ[a] പ്രദേശത്തേക്ക് കപ്പലിൽ ചെന്നെത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിലും സമാന്തര സുവിശേഷഭാഗങ്ങളിലും ‘ഗദരേന്യർ’ എന്നോ ‘ഗെർഗെസേന്യർ’ എന്നോ കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: കപ്പലിൽ ചെന്നെത്തി
  rationale: καταπλέω എന്ന ക്രിയ ജലമാർഗം ഒരു സ്ഥലത്തേക്ക് സഞ്ചരിച്ച് എത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കപ്പലിൽ ചെന്നെത്തി’ എന്നത് യാത്രാമാർഗവും എത്തിച്ചേരലും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; κατά-യുടെ ദിശാസൂചന പ്രത്യേകം ചേർക്കുന്നത് ഇവിടെ അനാവശ്യമാണ്.
- source_word: χώραν
  choice: പ്രദേശം
  rationale: χώρα ഇവിടെ ഒരു ആധുനിക രാഷ്ട്രമല്ല, ഒരു ഭൂപ്രദേശമോ ജില്ലയോ ആണ്; അതിനാൽ ‘പ്രദേശം’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: Γερασηνῶν
  choice: ഗെരസേന്യരുടെ
  rationale: ഗ്രീക്ക് ജനവിഭാഗനാമത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്ത്, പ്രദേശവുമായുള്ള ബന്ധം സൂചിപ്പിക്കാൻ സംബന്ധികരൂപം ഉപയോഗിച്ചു.
- source_word: ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας
  choice: ഗലീലയുടെ മറുകരയിലുള്ള
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയായി നൽകി. ἀντιπέρα ഇവിടെ ജലാശയത്തിന്റെ എതിർവശം എന്നതിനാൽ ‘മറുകര’ യോജിക്കുന്നു.
- source_word: Γαλιλαίας
  choice: ഗലീല
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
theological_decisions:
- issue: സിനോപ്റ്റിക് പാരമ്പര്യത്തിലെ സ്ഥലനാമത്തിന്റെ പാഠഭേദവും ഭൂമിശാസ്ത്ര വ്യത്യാസവും
  choice: ഗെരസേന്യർ
  alternative: ഗദരേന്യർ; ഗെർഗെസേന്യർ
  rationale: SBLGNT-യിലെ മുഖ്യപാഠം Γερασηνῶν ആയതിനാൽ പ്രധാനവാചകത്തിൽ ‘ഗെരസേന്യർ’ സ്വീകരിച്ചു. മറ്റു കൈയെഴുത്തുപ്രതികളിലും സമാന്തര സുവിശേഷഭാഗങ്ങളിലും കാണുന്ന പേരുകൾ പാഠസുതാര്യതയ്ക്കായി അടിക്കുറിപ്പിൽ നിലനിർത്തി; അവയുമായി വാചകം സമന്വയിപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘എതിർവശം’ എന്ന അക്ഷരാർഥപരമായ പ്രയോഗത്തേക്കാൾ തടാകത്തിന്റെ അപ്പുറത്തെ കരയെ സൂചിപ്പിക്കുന്ന ‘മറുകര’ സാധാരണ വായനക്കാർക്ക് കൂടുതൽ സ്വാഭാവികമാണ്.
