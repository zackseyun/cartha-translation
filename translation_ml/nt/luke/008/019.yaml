  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: ml
  text: അപ്പോൾ അവന്റെ അമ്മയും സഹോദരന്മാരും[b] അവന്റെ അടുക്കൽ വന്നു. എന്നാൽ ജനക്കൂട്ടം നിമിത്തം അവർക്ക് അവന്റെ അടുത്തെത്താൻ[a] കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ കണ്ടുമുട്ടാൻ” അല്ലെങ്കിൽ “അവന്റെ അടുക്കൽ ചെല്ലാൻ.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “സഹോദരന്മാർ”; ചിലർ ഇതിനെ കൂടുതൽ വിപുലമായി “ബന്ധുക്കൾ” എന്നും വ്യാഖ്യാനിക്കുന്നു, എന്നാൽ പാഠത്തിൽ “സഹോദരന്മാർ” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ
  choice: അപ്പോൾ ... വന്നു
  rationale: കഥയുടെ പുരോഗതി സൂചിപ്പിക്കുന്ന δέ-യും കുടുംബത്തിന്റെ വരവ് സൂചിപ്പിക്കുന്ന παραγίνομαι-യും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: πρὸς αὐτὸν
  choice: അവന്റെ അടുക്കൽ
  rationale: ഒരു വ്യക്തിയുടെ അടുത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന πρός എന്നതിന്റെ അർഥം ലക്ഷ്യം കൂട്ടിച്ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: അവന്റെ അമ്മയും സഹോദരന്മാരും
  rationale: ബന്ധപദങ്ങൾ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; ἀδελφοί വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായതിനാൽ ‘സഹോദരന്മാർ’ എന്നു നൽകുന്നു.
- source_word: οὐκ ἠδύναντο
  choice: കഴിഞ്ഞില്ല
  rationale: δύναμαι എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം പ്രകടിപ്പിക്കുന്ന അശക്തി സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: συντυχεῖν αὐτῷ
  choice: അവന്റെ അടുത്തെത്താൻ
  rationale: ജനക്കൂട്ടം തടസ്സമായിരുന്ന സാഹചര്യത്തിൽ, ഒരാളെ സമീപിക്കുകയോ അയാളുമായി സമ്പർക്കത്തിലെത്തുകയോ ചെയ്യുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘കണ്ടുമുട്ടാൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: διὰ τὸν ὄχλον
  choice: ജനക്കൂട്ടം നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അവന്റെ സഹോദരന്മാർ’ എന്നതിലെ ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം
  choice: മൂലപാഠത്തിലെ ἀδελφοί എന്ന പദം ‘സഹോദരന്മാർ’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ബന്ധുക്കൾ; ചാർച്ചക്കാർ
  rationale: വാക്യം ഇവർ ജൈവസഹോദരന്മാരോ അർധസഹോദരന്മാരോ മറ്റു ബന്ധുക്കളോ എന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആ വിശ്വാസശാസ്ത്രപരമായ തർക്കം വിവർത്തനം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘അടുക്കൽ’ എന്നത് ബൈബിൾ വായനയിൽ പരിചിതമാണെങ്കിലും ഇപ്പോഴും വ്യക്തവും സ്വാഭാവികവുമാണ്; ആവർത്തനം ഒഴിവാക്കാൻ രണ്ടാം ഘട്ടത്തിൽ ‘അടുത്തെത്താൻ’ ഉപയോഗിച്ചു.
