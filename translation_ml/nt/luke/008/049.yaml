  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: ml
  text: 'അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, സിനഗോഗ് നേതാവിന്റെ അടുത്തുനിന്ന് ഒരാൾ വന്ന് പറഞ്ഞു: “നിന്റെ മകൾ മരിച്ചിരിക്കുന്നു; ഇനി അധ്യാപകനെ ബുദ്ധിമുട്ടിക്കേണ്ട.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: അവൻ അപ്പോഴും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സമകാലികമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ἔτι എന്നതിന്റെ ‘അപ്പോഴും’ എന്ന കാലസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔρχεταί τις
  choice: ഒരാൾ വന്നു
  rationale: കഥനത്തിലെ ചരിത്രവർത്തമാനകാലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകി; τις എന്ന അനിശ്ചിതത്വം ‘ഒരാൾ’ നിലനിർത്തുന്നു.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: സിനഗോഗിന്റെ നേതാവിന്റെ അടുക്കൽനിന്ന്
  rationale: παρά + ജനിറ്റീവ് സന്ദേശത്തിന്റെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. ἀρχισυνάγωγος സിനഗോഗിൽ നേതൃത്വം വഹിച്ചിരുന്ന ഉദ്യോഗസ്ഥനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: സന്ദേശത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന പങ്കുപദം മലയാള കഥനത്തിൽ സ്വാഭാവികമായ ക്രിയയായി നൽകി.
- source_word: Τέθνηκεν
  choice: മരിച്ചുപോയി
  rationale: പെർഫെക്റ്റ് രൂപം മരണസംഭവത്തെയും അതിന്റെ ഇപ്പോഴുള്ള ഫലാവസ്ഥയെയും സൂചിപ്പിക്കുന്നു; ‘മരിച്ചുപോയി’ ഇവ രണ്ടും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἡ θυγάτηρ σου
  choice: നിന്റെ മകൾ
  rationale: ഏകവചന ദ്വിതീയപുരുഷ ഉടമസ്ഥതയും നേരിട്ടുള്ള അഭിസംബോധനയും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: μηκέτι σκύλλε
  choice: ഇനി ... ബുദ്ധിമുട്ടിക്കേണ്ട
  rationale: μηκέτιയുടെ ‘ഇനി മുതൽ വേണ്ട’ എന്ന അർഥവും σκύλλωയുടെ ‘ബുദ്ധിമുട്ടിക്കുക’ എന്ന ആശയവും ആദരപൂർവവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὸν διδάσκαλον
  choice: ഗുരുവിനെ
  rationale: διδάσκαλος എന്ന സാധാരണ അധ്യാപകപദവിയെ മലയാളത്തിൽ വ്യക്തിയോടുള്ള അഭിസംബോധനയിൽ സ്വാഭാവികമായ ‘ഗുരു’ എന്നു നൽകി; അധികമായ ക്രിസ്തുശാസ്ത്രപരമായ പദവി ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ἀρχισυνάγωγος എന്ന സ്ഥാപനപരമായ പദവിയുടെ വിവർത്തനം
  choice: സിനഗോഗിന്റെ നേതാവ്
  alternative: സിനഗോഗിന്റെ ഭരണാധികാരി
  rationale: ഇത് ദൈവശാസ്ത്രപരമായ സ്ഥാനപ്പേരല്ല, സിനഗോഗിലെ നേതൃത്വചുമതലയാണ്; ‘നേതാവ്’ ആ ചുമതല ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- issue: διδάσκαλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഗുരു
  alternative: അധ്യാപകൻ
  rationale: മലയാളത്തിൽ ഒരു മതബോധകനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള സംഭാഷണത്തിൽ ‘ഗുരു’ സ്വാഭാവികമാണ്. ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ഉയർന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവി ഇതിലൂടെ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. കഥനത്തിന്റെ ഒഴുക്ക് നിലനിർത്താൻ ചരിത്രവർത്തമാനകാലം ഭൂതകാലത്തിൽ നൽകി. സാങ്കേതികമോ പഴഞ്ചനോ ആയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
