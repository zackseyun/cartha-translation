id: LUK.8.32
reference: Luke 8:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: ml
  text: അവിടെ മലയിൽ[a] ഒരു വലിയ പന്നിക്കൂട്ടം മേഞ്ഞുകൊണ്ടിരുന്നു. ആ പന്നികളിൽ പ്രവേശിക്കാൻ അവർക്കു അനുവദിക്കണമെന്ന് അവർ[b] അവനോട് അപേക്ഷിച്ചു; അവൻ അവർക്കു അനുവാദം നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മലഞ്ചരിവിൽ.’
    reason: lexical_alternative
  - marker: b
    text: ‘അവർ’ എന്നത് സമീപസന്ദർഭത്തിലെ ഭൂതങ്ങളെയോ അശുദ്ധാത്മാക്കളെയോ സൂചിപ്പിക്കുന്നു; ചില പരിഭാഷകൾ ഇത് വാക്യത്തിൽ വ്യക്തമാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: ഒരു വലിയ പന്നിക്കൂട്ടം
  rationale: ἱκανῶν ഇവിടെ കൂട്ടത്തിന്റെ ഗണ്യമായ വലുപ്പമോ എണ്ണമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഒരു വലിയ പന്നിക്കൂട്ടം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: βοσκομένη
  choice: മേഞ്ഞുകൊണ്ടിരുന്നു
  rationale: കൂട്ടം ആഹാരം തേടിക്കൊണ്ടിരുന്ന പ്രവർത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘തീറ്റിക്കൊണ്ടിരുന്നു’ എന്നത് മറ്റൊരാൾ തീറ്റ കൊടുക്കുന്നു എന്ന തെറ്റായ ധാരണയ്ക്കിടയാക്കാം.
- source_word: ἐν τῷ ὄρει
  choice: മലയിൽ
  rationale: ὄρος എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സന്ദർഭമനുസരിച്ച് മലഞ്ചരിവ് എന്നും മനസ്സിലാക്കാം.
- source_word: παρεκάλεσαν
  choice: അപേക്ഷിച്ചു
  rationale: അനുമതിക്കായുള്ള ശക്തമായ അഭ്യർഥനയെ മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: അനുവദിക്കണമെന്ന് / അനുവദിച്ചു
  rationale: അഭ്യർഥനയിലും പ്രതികരണത്തിലും ഒരേ മൂലപദത്തിന്റെ ആവർത്തനം മലയാളത്തിലും സംരക്ഷിക്കുന്നു.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: ആ പന്നികളിൽ പ്രവേശിക്കാൻ
  rationale: ἐκείνους എന്ന സൂചനാപദവും εἰς...εἰσελθεῖν എന്ന അകത്തേക്കുള്ള പ്രവേശനവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δὲ / καὶ
  choice: വാക്യക്രമവും ‘;’ ചിഹ്നവും വഴി ബന്ധിപ്പിച്ചു
  rationale: δὲ-യ്ക്ക് അനാവശ്യമായ കാലസൂചകപദം ചേർക്കാതെ കഥയുടെ തുടർച്ച മലയാളവാക്യഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: παρεκάλεσαν എന്ന ബഹുവചന ക്രിയയുടെ കർത്താവ്
  choice: ‘അവർ’ എന്ന് പരോക്ഷമായി നിലനിർത്തി
  alternative: ‘ഭൂതങ്ങൾ’ എന്ന് കർത്താവിനെ വ്യക്തമാക്കുക
  rationale: സമീപസന്ദർഭം കർത്താവായി ഭൂതങ്ങളെയോ അശുദ്ധാത്മാക്കളെയോ തിരിച്ചറിയുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ ഗ്രീക്ക് പാഠം നാമം ആവർത്തിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ പരോക്ഷത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ ആവർത്തനവും കർത്താവിന്റെ പരോക്ഷതയും സംരക്ഷിച്ചുകൊണ്ട് സ്വാഭാവികമായ വാക്യഘടന ഉപയോഗിച്ചു.
