revisions:
- from: 'എന്നാൽ അവൻ യേശുവിനെ കണ്ടപ്പോൾ നിലവിളിച്ച് അവന്റെ മുമ്പിൽ വീണു. എന്നിട്ട് ഉച്ചത്തിൽ പറഞ്ഞു: “യേശുവേ, അത്യുന്നതനായ ദൈവത്തിന്റെ പുത്രാ, എന്റെ കാര്യത്തിൽ നിനക്കെന്ത്?[a] എന്നെ പീഡിപ്പിക്കരുതേ എന്ന് ഞാൻ നിന്നോട് അപേക്ഷിക്കുന്നു.”'
  to: 'എന്നാൽ അവൻ യേശുവിനെ കണ്ടപ്പോൾ നിലവിളിച്ച് യേശുവിന്റെ മുമ്പിൽ വീണു. പിന്നെ ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ പറഞ്ഞു: “യേശുവേ, അത്യുന്നതനായ ദൈവത്തിന്റെ പുത്രാ, എന്നോടു നിനക്കെന്തു കാര്യം?[a] ഞാൻ നിന്നോടു അപേക്ഷിക്കുന്നു, എന്നെ പീഡിപ്പിക്കരുതേ.”'
