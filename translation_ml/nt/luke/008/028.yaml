id: LUK.8.28
reference: Luke 8:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ യേശുവിനെ കണ്ടപ്പോൾ നിലവിളിച്ച് യേശുവിന്റെ മുമ്പിൽ വീണു. പിന്നെ ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ പറഞ്ഞു: “യേശുവേ, അത്യുന്നതനായ ദൈവത്തിന്റെ പുത്രാ, എന്നോടു നിനക്കെന്തു കാര്യം?[a] ഞാൻ നിന്നോടു അപേക്ഷിക്കുന്നു, എന്നെ പീഡിപ്പിക്കരുതേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എനിക്കും നിനക്കും തമ്മിൽ എന്ത്?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: പ്രധാന ക്രിയകൾക്കു മുമ്പുള്ള സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലസംബന്ധമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνακράξας
  choice: നിലവിളിച്ച്
  rationale: പെട്ടെന്നുള്ള ഉച്ചത്തിലുള്ള വിളിയെ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള φωνῇ μεγάλῃ എന്ന പ്രയോഗത്തെ ഇതിൽ ലയിപ്പിക്കുന്നില്ല.
- source_word: προσέπεσεν αὐτῷ
  choice: അവന്റെ മുമ്പിൽ വീണു
  rationale: കീഴടങ്ങലോ തീവ്രമായ അപേക്ഷയോ പ്രകടമാക്കുന്ന ശരീരഭാവം സൂചിപ്പിക്കുകയും, ഗ്രീക്കിലെ ദത്തിവിനെ അനാവശ്യമായി ‘കാല്ക്കൽ’ എന്നു കൂടുതൽ നിർദിഷ്ടമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ
  rationale: വലിയ ശബ്ദത്തിൽ പറഞ്ഞുവെന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: എന്റെ കാര്യത്തിൽ നിനക്കെന്ത്?
  rationale: അകലം പാലിക്കാനുള്ള പ്രതിഷേധം പ്രകടിപ്പിക്കുന്ന സെമിറ്റിക് ശൈലിയിലെ ചൊല്ലിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: അത്യുന്നതനായ ദൈവത്തിന്റെ പുത്രാ
  rationale: സംബോധനരൂപവും ‘അത്യുന്നതനായ ദൈവം’ എന്ന പദവിയും പൂർണമായി നിലനിർത്തുന്നു; വാക്യത്തിനു പുറത്തുള്ള ദൈവശാസ്ത്രവിവരണം ചേർക്കുന്നില്ല.
- source_word: δέομαί σου
  choice: ഞാൻ നിന്നോട് അപേക്ഷിക്കുന്നു
  rationale: തീവ്രമായ യാചനയെ ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: μή με βασανίσῃς
  choice: എന്നെ പീഡിപ്പിക്കരുതേ
  rationale: βασανίζω സൂചിപ്പിക്കുന്ന കഠിനമായ ദണ്ഡനമോ പീഡനമോ നിലനിർത്തുന്നു; ശാരീരിക പീഡനം മാത്രമെന്നു അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: ദുഷ്ടാത്മാവ് യേശുവിന്റെ വ്യക്തിത്വത്തെ അഭിസംബോധന ചെയ്യുന്നത്
  choice: യേശുവേ, അത്യുന്നതനായ ദൈവത്തിന്റെ പുത്രാ
  alternative: യേശുവേ, പരമോന്നത ദൈവപുത്രാ
  rationale: മൂലപാഠത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ അഭിസംബോധന മുഴുവനായി സംരക്ഷിക്കുന്നു; അതിനെ മൃദൂകരിക്കുകയോ പിൽക്കാല ദൈവശാസ്ത്രസൂത്രങ്ങളാൽ വികസിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. യേശുവിനോടുള്ള നേരിട്ടുള്ള ഏകവചന അഭിസംബോധനയിൽ മൂലത്തിലെ രണ്ടാംപുരുഷ ഏകവചനം നിലനിർത്താൻ ‘നിനക്ക്/നിന്നോട്’ ഉപയോഗിച്ചു; ഇതിൽ അധികമായ ആദരസൂചന ചേർത്തിട്ടില്ല.
