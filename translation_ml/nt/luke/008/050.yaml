source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അതു കേട്ടപ്പോൾ അവനോടു മറുപടി പറഞ്ഞു: “ഭയപ്പെടേണ്ട; മാത്രം വിശ്വസിക്കുക[a]; അവൾ രക്ഷിക്കപ്പെടും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശ്വാസം വെക്കുക മാത്രം’ അല്ലെങ്കിൽ ‘ആശ്രയിക്കുക മാത്രം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവൾ സൗഖ്യം പ്രാപിക്കും’ അല്ലെങ്കിൽ ‘അവൾ സുഖപ്പെടും.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് രക്ഷിക്കുക, വിടുവിക്കുക, സൗഖ്യമാക്കുക എന്നീ അർത്ഥങ്ങൾ വരാം; ഇവിടെ മരണത്തിന്റെ വക്കിൽനിന്നുള്ള പുനഃസ്ഥാപനവും അതിൽ ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: അതു കേട്ടപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിൽ നിന്നു കേട്ട കാര്യത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് എയോറിസ്റ്റ് കൃദന്തത്തിന്റെ മുൻകാലപ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπεκρίθη αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: സംഭാഷണസന്ദർഭത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്ന അർത്ഥം ഉൾക്കൊള്ളുന്ന, എന്നാൽ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: Μὴ φοβοῦ
  choice: ഭയപ്പെടേണ്ട
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞയുടെ വിലക്ക് സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μόνον πίστευσον
  choice: വിശ്വസിക്കുക മാത്രം
  rationale: μόνον നൽകുന്ന നിയന്ത്രണവും πιστεύω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർത്ഥവും നിലനിർത്തുന്നു; ആശ്രയിക്കുക/വിശ്വാസം വെക്കുക എന്ന ബന്ധപരമായ ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: σωθήσεται
  choice: അവൾ രക്ഷിക്കപ്പെടും
  rationale: σῴζω എന്ന ക്രിയയുടെ രക്ഷിക്കുക, സൗഖ്യമാക്കുക, വീണ്ടെടുക്കുക എന്നീ വ്യാപക അർത്ഥപരിധിയും ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിലെ ശാരീരിക പുനഃസ്ഥാപനാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ആജ്ഞയിലെ πιστεύω എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: വിശ്വസിക്കുക
  alternative: വിശ്വാസം വെക്കുക; ആശ്രയിക്കുക
  rationale: ‘വിശ്വസിക്കുക’ നേരിട്ടുള്ള ക്രിയാസമാനതയും പദകുടുംബബന്ധവും നിലനിർത്തുന്നു. വെറും ബൗദ്ധിക സമ്മതമായി ചുരുങ്ങാതിരിക്കാൻ വിശ്വാസപരമായ ആശ്രയത്തിന്റെ സാധുവായ ഭാവങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: രോഗശാന്തി/ജീവനിലേക്കുള്ള പുനഃസ്ഥാപനസന്ദർഭത്തിലെ σωθήσεται
  choice: അവൾ രക്ഷിക്കപ്പെടും
  alternative: അവൾ സൗഖ്യം പ്രാപിക്കും; അവൾ സുഖപ്പെടും
  rationale: ‘സൗഖ്യം പ്രാപിക്കും’ എന്നു മാത്രം പറഞ്ഞ് σῴζωയുടെ വിശാലമായ അർത്ഥം ചുരുക്കാതെ ‘രക്ഷിക്കപ്പെടും’ നിലനിർത്തുന്നു. അതേസമയം തൊട്ടടുത്ത കഥാസന്ദർഭം സൂചിപ്പിക്കുന്ന സൗഖ്യവും മരണത്തിൽനിന്നുള്ള പുനഃസ്ഥാപനവും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘അതു കേട്ടപ്പോൾ’ മുൻസന്ദർഭത്തിലെ മരണവാർത്തയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠം ഗ്രീക്കിന്റെ വിശാലത നിലനിർത്തുകയും സന്ദർഭപരമായ വ്യത്യസ്ത അർത്ഥങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകുകയും ചെയ്യുന്നു.
