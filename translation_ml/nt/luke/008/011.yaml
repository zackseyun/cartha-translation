id: LUK.8.11
reference: Luke 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔστιν δὲ αὕτη ἡ παραβολή· Ὁ σπόρος ἐστὶν ὁ λόγος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/011.yaml
  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: ml
  text: 'ഉപമ ഇതാണ്: വിത്ത് ദൈവത്തിന്റെ വചനമാണ്[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉപമയുടെ അർഥം ഇതാണ്.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, ‘ഉപമ ഇതാണ്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν
  choice: ആണ്
  rationale: സമവാക്യഘടന നേരിട്ട് നിലനിർത്തുന്നു; ‘അർഥം’ എന്ന വ്യാഖ്യാനപദം മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ഇത് വിശദീകരണത്തിലേക്കുള്ള മൃദുവായ സംവാദമാറ്റം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ വാക്യം ആരംഭിക്കുന്നത് സ്വാഭാവികമാണ്; ‘എന്നാൽ’ എന്നു ചേർത്താൽ ഇല്ലാത്ത വൈരുധ്യഭാവം ഉണ്ടാകാം.
- source_word: αὕτη ἡ παραβολή
  choice: ഉപമ ഇതാണ്
  rationale: ഗ്രീക്കിലെ ‘ഇതാണ് ഉപമ’ എന്ന ഔപചാരിക ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമത്തിൽ സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് ഉപമയുടെ അർഥമാണെങ്കിലും അത് മുഖ്യവാക്യത്തിൽ തുറന്നു ചേർക്കുന്നില്ല.
- source_word: ὁ σπόρος
  choice: വിത്ത്
  rationale: ഏകവചനവും ഉപമയിലെ ദൃശ്യബിംബവും നേരിട്ട് നിലനിർത്തുന്ന സാധാരണ മലയാളപദമാണ്.
- source_word: ὁ λόγος
  choice: വചനം
  rationale: ഇവിടെ ദൈവം അറിയിക്കുന്ന സന്ദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘വചനം’ എന്നത് മലയാള ബൈബിൾഭാഷയിലെ അന്തർപാഠബന്ധം നിലനിർത്തിക്കൊണ്ട് ആധുനിക വായനക്കാർക്കും ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിവക്തിയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം; ‘ദൈവത്തിൽനിന്നുള്ള’ എന്ന വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: παραβολή എന്നത് ‘ഉപമ’ എന്നു മാത്രം നൽകണമോ, സന്ദർഭാനുസൃതമായി ‘ഉപമയുടെ അർഥം/വിശദീകരണം’ എന്നു വികസിപ്പിക്കണമോ
  choice: ഉപമ
  alternative: ഉപമയുടെ അർഥം / ഉപമയുടെ വിശദീകരണം
  rationale: യേശു ഉപമ വ്യാഖ്യാനിക്കുകയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നുവെങ്കിലും ഗ്രീക്ക് വാചകം ‘ഉപമ ഇതാണ്’ എന്നാണ് പറയുന്നത്. അതിനാൽ അതിലെ യഥാർഥ ചുരുക്കവും വ്യാഖ്യാനസാധ്യതയും മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സ്വാഭാവികമായ വികസനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഉപമ ഇതാണ്’ എന്ന ചുരുക്കരൂപം മൂലപാഠത്തിന്റെ ഘടന സംരക്ഷിക്കുന്നു; ‘വചനം’ ബൈബിൾപരമായ പ്രതിധ്വനി നിലനിർത്തുന്നു.
