id: LUK.8.56
reference: Luke 8:56
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: ml
  text: അവളുടെ മാതാപിതാക്കൾ വിസ്മയിച്ചുപോയി[a]. എന്നാൽ സംഭവിച്ച കാര്യം[c] ആരോടും പറയരുതെന്ന് അവൻ അവരോടു കൽപ്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അത്ഭുതപ്പെട്ടുപോയി’; ‘സ്വബോധം നഷ്ടപ്പെടുമാറായി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിർദേശിച്ചു’ അല്ലെങ്കിൽ ‘ആജ്ഞാപിച്ചു.’
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘സംഭവിച്ച വസ്തുത’ അല്ലെങ്കിൽ ‘സംഭവം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: വിസ്മയിച്ചുപോയി
  rationale: ഇവിടെ ἐξίστημι അതിശക്തമായ വിസ്മയത്തിൽ ആകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിസ്മയിച്ചുപോയി’ എന്നത് ആ പ്രതികരണത്തിന്റെ തീവ്രത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: γονεῖς
  choice: മാതാപിതാക്കൾ
  rationale: γονεῖς എന്ന സാധാരണ ബഹുവചനപദത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷയാണിത്.
- source_word: παρήγγειλεν
  choice: കൽപ്പിച്ചു
  rationale: παραγγέλλω ഒരു അധികാരപൂർവമായ നിർദേശം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കൽപ്പിച്ചു’ അതിന്റെ നിർദേശാത്മക ശക്തി നിലനിർത്തുന്നു; എന്നാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘കർശനമായി’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: μηδενὶ
  choice: ആരോടും ... അരുത്
  rationale: നിഷേധാത്മക ക്രിയയോടൊപ്പം μηδενὶ സൂചിപ്പിക്കുന്ന ‘ആരോടും പറയാതിരിക്കുക’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി ഇങ്ങനെ വരുന്നു.
- source_word: εἰπεῖν
  choice: പറയരുതെന്ന്
  rationale: μηδενὶ എന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പരോക്ഷ കർമത്തോടൊപ്പം λέγω ഇവിടെ ഒരു വിവരം മറ്റൊരാളോടു പറയുക എന്ന ആശയമാണ് നൽകുന്നത്.
- source_word: τὸ γεγονός
  choice: സംഭവിച്ച കാര്യം
  rationale: സുബ്സ്റ്റാന്റീവായി ഉപയോഗിച്ചിരിക്കുന്ന perfect participle ഇതിനകം സംഭവിച്ച സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ‘സംഭവിച്ച കാര്യം’ മൂലരൂപത്തോടു ചേർന്നുനിൽക്കുന്നതും സ്വാഭാവികവുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മാതാപിതാക്കളുടെ വിസ്മയവും തുടർന്ന് അവൻ നൽകിയ കൽപ്പനയും തമ്മിലുള്ള നേരിയ വൈരുധ്യം δέ അടയാളപ്പെടുത്തുന്നു; ‘എന്നാൽ’ അത് വ്യക്തമായി പകർന്നുനൽകുന്നു.
theological_decisions:
- issue: മശീഹായുടെ രഹസ്യത്വം / യേശുവിന്റെ കൽപ്പനയുടെ വ്യാപ്തി
  choice: സംഭവിച്ച കാര്യം ആരോടും പറയരുതെന്ന കൽപ്പനയായി വാക്യം നേരിട്ട് പരിഭാഷപ്പെടുത്തി; അതിന്റെ ഉദ്ദേശ്യമോ കാലപരിധിയോ വിശദീകരിച്ചില്ല.
  alternative: ഇത് മശീഹായുടെ രഹസ്യത്വവുമായി ബന്ധപ്പെട്ട പൊതുവായ കർശന മൗനകൽപ്പനയായോ, താൽക്കാലികവും പരിമിതവുമായ നിർദേശമായോ വ്യാഖ്യാനിക്കുക.
  rationale: ആരോടും പറയരുതെന്ന് അവൻ കൽപ്പിച്ചു എന്നതിൽ കൂടുതൽ ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കാതെ പാഠത്തിലെ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘വിസ്മയിച്ചുപോയി’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ പ്രതികരണത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു. ‘കർശനമായി’ പോലുള്ള മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ശക്തിവർധകങ്ങൾ ഒഴിവാക്കി.
