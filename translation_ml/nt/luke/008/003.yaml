id: LUK.8.3
reference: Luke 8:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: ml
  text: ഹെരോദാവിന്റെ കാര്യസ്ഥനായ കൂസയുടെ ഭാര്യ യോഹന്നായും, സൂസന്നായും, മറ്റു പല സ്ത്രീകളും ഉണ്ടായിരുന്നു; അവർ അവർക്കു[a] തങ്ങളുടെ സ്വത്തിൽനിന്ന്[b] ശുശ്രൂഷ ചെയ്തുപോന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “അവർക്കു” എന്നതിനുപകരം “അവന്” എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അഥവാ “തങ്ങളുടെ വകയിൽനിന്ന്” അല്ലെങ്കിൽ “തങ്ങളുടെ വിഭവങ്ങളിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  choice: കൂസയുടെ ഭാര്യ
  rationale: വ്യക്തിനാമത്തോടു ചേർന്നുള്ള ഈ പ്രയോഗത്തിൽ γυνή സ്വാഭാവികമായി വിവാഹബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: ἐπιτρόπου Ἡρῴδου
  choice: ഹെരോദാവിന്റെ കാര്യസ്ഥനായ
  rationale: ἐπίτροπος ഏൽപ്പിക്കപ്പെട്ട കാര്യങ്ങളുടെയോ സ്വത്തിന്റെയോ മേൽനോട്ടക്കാരനെ സൂചിപ്പിക്കുന്നു; രാജസഭാ പശ്ചാത്തലത്തിൽ ‘കാര്യസ്ഥൻ’ സ്വാഭാവികവും വിശാലവുമായ പദമാണ്.
- source_word: ἕτεραι πολλαί
  choice: മറ്റു പല സ്ത്രീകൾ
  rationale: സ്ത്രീലിംഗ ബഹുവചനം മുൻപ് പരാമർശിച്ച സ്ത്രീകളിലേക്കു തിരിച്ചുപോകുന്നതിനാൽ മലയാളത്തിൽ ‘സ്ത്രീകൾ’ എന്നു വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: διηκόνουν
  choice: ശുശ്രൂഷ ചെയ്തുപോന്നു
  rationale: തുടർച്ചയായ സേവനത്തെ സൂചിപ്പിക്കുന്ന അപൂർണ്ണഭൂതകാല രൂപം നിലനിർത്തുന്നു; തുടർന്നുള്ള വാക്യഭാഗം അവരുടെ വിഭവങ്ങളിൽനിന്നുള്ള സഹായമാണെന്ന് വ്യക്തമാക്കുമ്പോഴും സേവനത്തിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: നൽകിയ SBLGNT പാഠത്തിലെ ബഹുവചനത്തെ പിന്തുടരുന്നു; യേശുവിനെയും കൂടെയുള്ളവരെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: തങ്ങൾക്കുണ്ടായിരുന്ന വകയിൽനിന്ന്
  rationale: സ്ത്രീകൾക്കു സ്വന്തമായി ഉണ്ടായിരുന്ന സ്വത്തോ വിഭവങ്ങളോ ഉപയോഗിച്ചുള്ള സേവനമെന്ന ആശയം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘വക’ സ്വത്തിനെയും ഉപജീവനസാധനങ്ങളെയും ഉൾക്കൊള്ളാൻ കഴിയും.
theological_decisions:
- issue: αὐτοῖς എന്നതിന്റെ വചനവും സൂചനയും
  choice: 'ബഹുവചനം: യേശുവിനും കൂടെയുള്ളവർക്കും അവർ ശുശ്രൂഷ ചെയ്തു'
  alternative: 'ഏകവചനം: യേശുവിന് അവർ ശുശ്രൂഷ ചെയ്തു'
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠം αὐτοῖς എന്ന ബഹുവചനം വായിക്കുന്നതിനാൽ മുഖ്യപാഠം അതിനെ പിന്തുടരുന്നു; ഏകവചനമുള്ള കൈയെഴുത്തുപ്രതി വ്യത്യാസം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ ബൈബിൾ ഭാഷ. പേരുകളുടെ പട്ടിക മുൻവാക്യത്തിന്റെ തുടർച്ചയായിരിക്കാമെങ്കിലും, ഒറ്റവാക്യമായി ലഭിച്ച ഭാഗം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘എന്നിവരും ഉണ്ടായിരുന്നു’ എന്നു ചേർത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
