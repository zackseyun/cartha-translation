translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ കാരണബന്ധം, ഏകദേശ പ്രായം, തുടരുന്ന മരണാവസ്ഥ, ‘ജനക്കൂട്ടങ്ങൾ’ എന്ന ബഹുവചനം, ഞെരുക്കത്തിന്റെ ശക്തി എന്നിവ നിലനിർത്തി. ഇംഗ്ലീഷ് പാഠത്തിലെ [b] പ്രായക്കുറിപ്പ് മലയാളത്തിൽ ആവശ്യമില്ലാത്തതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല; നൽകിയ എല്ലാ കുറിപ്പുകളുടെയും അടയാളങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
