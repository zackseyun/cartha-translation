  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: ml
  text: കാരണം, അവന് ഏകദേശം പന്ത്രണ്ടു വയസ്സുള്ള ഒരേയൊരു മകളുണ്ടായിരുന്നു[a]; അവൾ മരിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു. യേശു പോകുമ്പോൾ ജനക്കൂട്ടങ്ങൾ അദ്ദേഹത്തെ ഞെരുക്കിക്കൊണ്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏകമകൾ.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് ക്രിയയ്ക്ക് ജനക്കൂട്ടം യേശുവിനെ ശ്വാസംമുട്ടുകയോ ചതഞ്ഞുപോകുകയോ ചെയ്യുമാറ് ശക്തമായി ഞെരുക്കി എന്ന ആശയം സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: ഏകമകൾ
  rationale: θυγάτηρ എന്നതിനോടൊപ്പം ഇത് പിതാവിന്റെ ഒരേയൊരു മകളെയാണ് സൂചിപ്പിക്കുന്നത്; ജനിപ്പിക്കപ്പെട്ട രീതി സംബന്ധിച്ച അർത്ഥമല്ല.
- source_word: ὡς ἐτῶν δώδεκα
  choice: ഏകദേശം പന്ത്രണ്ടു വയസ്സുള്ള
  rationale: ὡς സംഖ്യയോടൊപ്പം ഏകദേശ പ്രായം സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ അതു വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπέθνῃσκεν
  choice: മരിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് രൂപം പൂർത്തിയായ മരണമല്ല, നടന്നുകൊണ്ടിരുന്ന മരണാവസ്ഥയാണ് ചിത്രീകരിക്കുന്നത്.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: യേശു പോകുമ്പോൾ
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് സമകാലികമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമാക്കുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: οἱ ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: συνέπνιγον
  choice: ഞെരുക്കിക്കൊണ്ടിരുന്നു
  rationale: ചുറ്റും തിങ്ങിക്കൂടി ശ്വാസംമുട്ടുമാറ് അമർത്തുക എന്ന ശക്തമായ ഭൗതിക സമ്മർദം സൂചിപ്പിക്കുന്നു; ‘ഞെരുക്കുക’ അത് സ്വാഭാവികമായി പകരുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ യായീറൊസിന്റെ അപേക്ഷയുടെ അടിയന്തരതയ്ക്കുള്ള കാരണം വ്യക്തമാക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനുണ്ടായിരുന്നുള്ളൂ
  rationale: ἦν + ദാതീവ് എന്ന ഉടമസ്ഥതാസൂചക പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള രൂപം.
