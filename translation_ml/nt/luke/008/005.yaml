source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: ml
  text: വിതക്കാരൻ തന്റെ വിത്തു വിതയ്ക്കാൻ പുറപ്പെട്ടു. അവൻ വിതച്ചുകൊണ്ടിരിക്കുമ്പോൾ, കുറെ വിത്ത് വഴിയരികിൽ വീണു; അത് ചവിട്ടിമെതിക്കപ്പെട്ടു, ആകാശത്തിലെ പക്ഷികൾ അതു തിന്നുകളഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വർഗത്തിലെ പക്ഷികൾ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ‘ആകാശത്തിലെ പക്ഷികൾ’ എന്നും ‘വായുവിലെ പക്ഷികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξῆλθεν ὁ σπείρων
  choice: വിതക്കാരൻ ... പുറപ്പെട്ടു
  rationale: ആർട്ടിക്കുലർ പാർട്ടിസിപ്പിൾ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമമായി പ്രവർത്തിക്കുന്നു; ‘വിതക്കാരൻ’ സ്വാഭാവികവും ഉപമയുടെ കാർഷിക പശ്ചാത്തലത്തിന് യോജിച്ചതുമാണ്. Ἐξῆλθεν എന്ന അയോറിസ്റ്റിന് ‘പുറപ്പെട്ടു’ എന്നത് ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: τοῦ σπεῖραι τὸν σπόρον αὐτοῦ
  choice: തന്റെ വിത്തു വിതയ്ക്കാൻ
  rationale: ചലനക്രിയയ്ക്കു പിന്നാലെയുള്ള ജനിറ്റീവ് ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. αὐτοῦ-യുടെ പ്രതിബിംബസംബന്ധം മലയാളത്തിൽ ‘തന്റെ’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: അവൻ വിതച്ചുകൊണ്ടിരിക്കുമ്പോൾ
