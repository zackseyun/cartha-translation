- source_word: ὃ μὲν
  choice: കുറെ വിത്ത്
  rationale: ഇത് വിത്തിന്റെ ഒരു ഭാഗത്തെ വിഭജനാത്മകമായി സൂചിപ്പിക്കുന്നു. ‘കുറെ വിത്ത്’ മലയാളത്തിൽ വ്യക്തവും തുടർന്നുവരുന്ന വിവിധ ഭാഗങ്ങൾക്കുള്ള അവതാരികയുമാണ്.
- source_word: παρὰ τὴν ὁδόν
  choice: വഴിയരികിൽ
  rationale: παρά + accusative ഇവിടെ വഴിയുടെ സമീപം/അരികിലുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘വഴിയരികിൽ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: κατεπατήθη
  choice: ചവിട്ടിമെതിക്കപ്പെട്ടു
  rationale: καταπατέω-യുടെ നിഷ്ക്രിയരൂപം കാൽക്കീഴിൽ ചവിട്ടപ്പെടുന്നതിനെ ശക്തമായി സൂചിപ്പിക്കുന്നു; ഈ സംയുക്തപ്രയോഗം ആ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: οὐρανός ഇവിടെ ദൃശ്യമായ ആകാശത്തെ സൂചിപ്പിക്കുന്ന കാർഷികസന്ദർഭത്തിലാണ്; ‘ആകാശത്തിലെ പക്ഷികൾ’ മൂലഭാഷയിലെ ദൃശ്യബിംബം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: κατέφαγεν αὐτό
  choice: അതു തിന്നുകളഞ്ഞു
  rationale: κατεσθίω സാധാരണ ‘തിന്നുക’ എന്നതിനെക്കാൾ സമ്പൂർണമായി തിന്നുതീർക്കുന്ന ശക്തി വഹിക്കുന്നു; ‘തിന്നുകളഞ്ഞു’ ആ തീവ്രത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
