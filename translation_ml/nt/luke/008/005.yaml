  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പരമ്പരാഗതമായി പരിചിതമായ ‘വിതക്കാരൻ’ നിലനിർത്തിയപ്പോൾ, പഴക്കമേറിയതോ അസ്വാഭാവികമോ ആയ പദക്രമം ഒഴിവാക്കി. അടിക്കുറിപ്പ് സൂചകം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
