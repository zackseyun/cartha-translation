id: LUK.8.48
reference: Luke 8:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവളോടു പറഞ്ഞു: “മകളേ, നിന്റെ വിശ്വാസം നിന്നെ രക്ഷിച്ചിരിക്കുന്നു[a]; സമാധാനത്തോടെ പോകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്നെ സൗഖ്യമാക്കിയിരിക്കുന്നു” അല്ലെങ്കിൽ “നിന്നെ സുഖപ്പെടുത്തിയിരിക്കുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് രക്ഷയെയും സൗഖ്യത്തെയും സൂചിപ്പിക്കാൻ കഴിയും.
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: മകളേ
  rationale: നേരിട്ടുള്ള സംബോധന നിലനിർത്തുന്നു; യേശുവിന്റെ ആർദ്രവും ബന്ധപരവുമായ അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ പകർന്നുനൽകുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഈ സന്ദർഭത്തിൽ യേശുവിലുള്ള അവളുടെ ആശ്രയപൂർവമായ വിശ്വാസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: σέσωκέν
  choice: രക്ഷിച്ചിരിക്കുന്നു
  rationale: σῴζω എന്ന ക്രിയയുടെ രക്ഷയും സൗഖ്യവും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു. പൂർണ്ണകാലരൂപത്തിന്റെ നിലവിലുള്ള ഫലസൂചന ‘-ിച്ചിരിക്കുന്നു’ വഴി പ്രകടമാക്കുന്നു.
- source_word: πορεύου
  choice: പോകുക
  rationale: കല്പനാരൂപത്തിന്റെ അർഥം മാന്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς εἰρήνην
  choice: സമാധാനത്തോടെ
  rationale: പിരിഞ്ഞുപോകുമ്പോൾ ലഭിക്കുന്ന സമാധാനത്തിന്റെ അവസ്ഥയെയോ അനുഗ്രഹത്തെയോ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ ഭയത്തോടെയുള്ള സ്ത്രീയുടെ പ്രതികരണത്തിനും യേശുവിന്റെ ആശ്വാസവചനത്തിനും ഇടയിലെ മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: സൗഖ്യസന്ദർഭത്തിലെ σῴζωയുടെ അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘രക്ഷിച്ചിരിക്കുന്നു’
  alternative: ‘സൗഖ്യമാക്കിയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘സുഖപ്പെടുത്തിയിരിക്കുന്നു’
  rationale: സംഭവം ശാരീരികസൗഖ്യം വ്യക്തമായി ഉൾക്കൊള്ളുന്നുവെങ്കിലും, σῴζω അതിലുപരി രക്ഷ എന്ന വിശാലമായ ദൈവശാസ്ത്രപരമായ അർഥവും വഹിക്കാം. മുഖ്യപാഠം ആ വ്യാപ്തി സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിലെ സൗഖ്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘മകളേ’ എന്ന സംബോധനത്തിന്റെ ആർദ്രതയും ‘രക്ഷിച്ചിരിക്കുന്നു’ എന്നതിലെ ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തിയും നിലനിർത്തിയിരിക്കുന്നു.
