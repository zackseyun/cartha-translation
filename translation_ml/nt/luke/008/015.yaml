id: LUK.8.15
reference: Luke 8:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: ml
  text: 'എന്നാൽ നല്ല മണ്ണിലുള്ള വിത്ത്—നല്ലതും ഉത്തമവുമായ ഹൃദയത്തോടെ[a] വചനം കേട്ട്, അതിനെ മുറുകെപ്പിടിക്കുകയും സ്ഥിരതയോടെ ഫലം കായ്ക്കുകയും ചെയ്യുന്നവരാണ് ഇവർ.


    [a] അഥവാ, “സത്യസന്ധവും നല്ലതുമായ ഹൃദയത്തോടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സത്യസന്ധവും നല്ലതുമായ ഹൃദയത്തോടെ.”
    reason: καλῇ καὶ ἀγαθῇ എന്ന ഇരട്ട വിശേഷണത്തിന് സാധ്യമായ മറ്റൊരു സ്വാഭാവിക പരിഭാഷ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: τὸ ... ἐν τῇ καλῇ γῇ
  choice: നല്ല മണ്ണിലുള്ള വിത്ത്
  rationale: ഗ്രീക്കിൽ ‘വിത്ത്’ എന്ന നാമം ഇവിടെ അധ്യാഹരിക്കപ്പെട്ടിട്ടുണ്ടെങ്കിലും ഉപമയുടെ സന്ദർഭത്തിൽ അതാണ് വ്യക്തമായ സൂചിതപദം. മലയാളത്തിൽ അർഥം സ്വാഭാവികവും സുതാര്യവുമാക്കാൻ ‘വിത്ത്’ ചേർത്തു.
- source_word: καλῇ γῇ
  choice: നല്ല മണ്ണ്
  rationale: കൃഷിയുടെ പശ്ചാത്തലത്തിൽ γῆ കൃഷിയോഗ്യമായ മണ്ണിനെ സൂചിപ്പിക്കുന്നു; ‘നല്ല മണ്ണ്’ ഉപമയിലെ വൈരുധ്യം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: οὗτοί εἰσιν οἵτινες
  choice: ചെയ്യുന്നവരാണ് ഇവർ
  rationale: ആളുകളുടെ ഒരു വിഭാഗത്തെ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിലെ സ്വാഭാവികമായ ആപേക്ഷികവാക്യരീതിയിൽ അവതരിപ്പിച്ചു.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: നല്ലതും ഉത്തമവുമായ ഹൃദയത്തോടെ
  rationale: καρδία ഇവിടെ അന്തരംഗസ്വഭാവത്തെ സൂചിപ്പിക്കുന്നു. അടുത്ത അർഥമുള്ള രണ്ട് വിശേഷണങ്ങളെയും വേർതിരിച്ചുനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ഇരട്ട പ്രശംസയായി ‘നല്ലതും ഉത്തമവുമായ’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘സത്യസന്ധവും നല്ലതുമായ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ἀκούσαντες τὸν λόγον
  choice: വചനം കേട്ട്
  rationale: കേൾക്കൽ തുടർന്നുള്ള പിടിച്ചുനിൽക്കലിനും ഫലം കായ്ക്കലിനും മുമ്പുള്ള പ്രവൃത്തിയാണെന്ന ക്രമം മലയാളത്തിലെ ‘കേട്ട്’ എന്ന പൂർവകാല ക്രിയാവിശേഷരൂപം വ്യക്തമാക്കുന്നു. λόγος എന്നതിന് ഉപമയുടെ സ്ഥാപിത പ്രയോഗമായ ‘വചനം’ നിലനിർത്തി.
- source_word: κατέχουσιν
  choice: അതിനെ മുറുകെപ്പിടിക്കുന്നു
  rationale: κατέχω വെറും കൈവശംവെക്കൽക്കാൾ ഉറച്ചുനിലനിർത്തൽ സൂചിപ്പിക്കുന്നു. ‘അതിനെ’ എന്നത് മുമ്പുള്ള ‘വചനം’ എന്ന കർമത്തെ വ്യക്തമായി തിരിച്ചുചൂണ്ടുന്നു.
- source_word: καρποφοροῦσιν
  choice: ഫലം കായ്ക്കുന്നു
  rationale: കാർഷികവും രൂപകാത്മകവുമായ ദൃശ്യബിംബം സ്വാഭാവിക മലയാളത്തിൽ അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: ἐν ὑπομονῇ
  choice: സ്ഥിരതയോടെ
  rationale: ὑπομονή പ്രതികൂലതകളിൽ ഉറച്ചുനിൽക്കുന്ന സഹനവും സ്ഥിരതയും സൂചിപ്പിക്കുന്നു. ‘സ്ഥിരതയോടെ’ ഫലം കായ്ക്കുന്ന രീതിയെ ലളിതമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; വെറും നിഷ്ക്രിയ കാത്തിരിപ്പെന്ന അർഥം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: വചനം സ്വീകരിക്കുന്ന ഹൃദയത്തിന്റെ ധാർമിക വിശേഷണം
  choice: നല്ലതും ഉത്തമവുമായ ഹൃദയത്തോടെ
  alternative: സത്യസന്ധവും നല്ലതുമായ ഹൃദയത്തോടെ
  rationale: ഈ വാക്യം കേൾക്കുന്നവരുടെ അന്തരംഗമനോഭാവത്തെ പ്രശംസിക്കുന്നു; അത്തരമൊരു ഹൃദയം എങ്ങനെ രൂപപ്പെടുന്നു എന്ന ഉപദേശപരമായ വിശദീകരണം നൽകുന്നില്ല. അതിനാൽ ഹൃദയത്തിന്റെ നന്മയെ നിലനിർത്തിയെങ്കിലും സ്വാഭാവിക നന്മ, പുനർജനനത്തിന്റെ ക്രമം, അർഹത എന്നിവയെക്കുറിച്ചുള്ള ഏതെങ്കിലും സഭാപാരമ്പര്യനിഗമനം ചേർത്തിട്ടില്ല.
- issue: ὑπομονή എന്നതിലെ സഹനവും തുടർച്ചയും
  choice: സ്ഥിരതയോടെ
  alternative: സഹനത്തോടെ
  rationale: ഫലം കായ്ക്കുന്നതിലെ ദീർഘകാല ഉറച്ചുനിൽപ്പ് മുൻനിർത്തി; പീഡനം സഹിക്കുന്നതിൽ മാത്രമായി ആശയം ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉപമയുടെ കാർഷിക ദൃശ്യബിംബം നിലനിർത്തി; അമിതമായ സംസ്കൃതവൽക്കരണവും പ്രത്യേക സഭാപാരമ്പര്യഭാഷയും ഒഴിവാക്കി.
