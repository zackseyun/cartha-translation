id: LUK.8.18
reference: Luke 8:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങൾ എങ്ങനെ കേൾക്കുന്നു എന്നു ശ്രദ്ധിക്കുക. ആർക്കുണ്ടോ, അവന് കൂടുതൽ നൽകപ്പെടും; ആർക്കില്ലയോ, തനിക്കുണ്ടെന്ന് അവൻ കരുതുന്നതുപോലും[a] അവനിൽനിന്ന് എടുത്തുകളയപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തനിക്കുണ്ടെന്നു തോന്നുന്നതുപോലും.’
    reason: δοκέω എന്ന പദത്തിന് ‘കരുതുക’ എന്നും ‘തോന്നുക/കാണപ്പെടുക’ എന്നും അർഥമാകാം; മൂലപാഠത്തിലെ യഥാർഥമായ ലെക്സിക്കൽ സാധ്യത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: βλέπετε
  choice: ശ്രദ്ധിക്കുക
  rationale: ഇവിടെ ദൃശ്യമായി ‘കാണുക’ എന്നതല്ല, ജാഗ്രതയോടെ പരിഗണിക്കണമെന്ന ആജ്ഞയാണ്; ‘ശ്രദ്ധിക്കുക’ ആ മുന്നറിയിപ്പിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പുള്ള കേൾവിയെയും സ്വീകരണത്തെയും സംബന്ധിച്ച ഉപദേശത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: πῶς ἀκούετε
  choice: നിങ്ങൾ എങ്ങനെ കേൾക്കുന്നു
  rationale: πῶς കേൾവിയുടെ രീതിയെയാണ് ഊന്നുന്നത്; ἀκούετε-യുടെ നേരിട്ടുള്ള അർഥവും സന്ദർഭത്തിലെ പ്രതികരണാത്മക കേൾവിയും ഈ രൂപത്തിൽ നിലനിൽക്കുന്നു.
- source_word: ὃς ἂν ... ἔχῃ
  choice: ഉള്ളവന്
  rationale: ἄν സഹിതമുള്ള ഉപവാക്യം പൊതുവായ, അനിശ്ചിത വ്യവസ്ഥ പ്രകടിപ്പിക്കുന്നു; ചൊല്ലിന്റെ സംക്ഷിപ്തമായ വിരുദ്ധഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δοθήσεται αὐτῷ
  choice: കൂടുതൽ നൽകപ്പെടും
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സമാന്തരഘടന വർധനയെ സൂചിപ്പിക്കുന്നു; അർഥഗ്രാഹ്യതയ്ക്കായി ‘കൂടുതൽ’ ചേർക്കുന്നു, കർമണിപ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: ഇല്ലാത്തവനിൽനിന്നോ
  rationale: ആദ്യ ഉപവാക്യത്തോടുള്ള പൊതുവായ വിരുദ്ധത സംക്ഷിപ്തമായി പുനരാവിഷ്കരിക്കുന്നു; തുടർന്നുള്ള ἀπ’ αὐτοῦ എന്ന ആശയവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ὃ δοκεῖ ἔχειν
  choice: തനിക്കുണ്ടെന്ന് അവൻ കരുതുന്നതുപോലും
  rationale: δοκέω ഇവിടെ ‘കരുതുക’ എന്നും ‘ഉണ്ടെന്നു തോന്നുക’ എന്നും ഗ്രഹിക്കാം. പ്രധാനപാഠം വ്യക്തിപരമായ ധാരണയെ മുൻനിർത്തുന്നു; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: എടുത്തുകളയപ്പെടും
  rationale: ഭാവികാല കർമണിരൂപത്തിലുള്ള നീക്കംചെയ്യൽ അഥവാ നഷ്ടപ്പെടുത്തൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτῷ / αὐτοῦ
  choice: അവന് / അവനിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ ഏകവചന പുല്ലിംഗ പൊതുപ്രയോഗം മലയാളത്തിലും ഏകവചനത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഉള്ളവൻ’, ‘ഇല്ലാത്തവൻ’ എന്നിവരെക്കുറിച്ചുള്ള ചൊല്ലിന്റെ വ്യാഖ്യാനപരമായ വ്യാപ്തി
  choice: യേശുവിന്റെ വചനം എങ്ങനെ കേൾക്കുന്നു എന്ന തൊട്ടുമുമ്പുള്ള സന്ദർഭവുമായി ബന്ധം നിലനിർത്തിക്കൊണ്ട്, ചൊല്ലിന്റെ വിരോധാഭാസം വിശദീകരിക്കാതെ തന്നെ പരിഭാഷപ്പെടുത്തി.
  alternative: മുൻനിർണയം, വ്യക്തിപരമായ യോഗ്യത, ഭൗതിക സമൃദ്ധി, അല്ലെങ്കിൽ കാര്യവിചാരകത്വം എന്നിവയെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തമായി തുറന്നുപറയുക.
  rationale: വാക്യം കേൾവിയോടും സ്വീകരണശേഷിയോടും ബന്ധപ്പെട്ട ഒരു തത്ത്വം പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ എല്ലാ ദൈവശാസ്ത്രപരമായ പ്രത്യാഘാതങ്ങളും നിർവചിക്കുന്നില്ല; അതിനാൽ പ്രത്യേക സമ്പ്രദായപരമായ അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശ്രദ്ധിക്കുക’ മുന്നറിയിപ്പിന്റെ ഭാവം നൽകുന്നു; ‘എടുത്തുകളയപ്പെടും’ എന്ന കർമണിരൂപം ഗ്രീക്കിലെ ദൈവിക കർമണിയുടെ സാധ്യതയെ വിശദീകരിക്കാതെ തുറന്നുവെക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി നേരിട്ട് ബന്ധപ്പെട്ട ‘കരുതുന്നതുപോലും’ എന്ന ഭാഗത്താണ് നൽകിയിരിക്കുന്നത്.
