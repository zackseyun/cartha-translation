language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: ml
  text: 'ആ ദിവസങ്ങളിലൊന്നിൽ ഇങ്ങനെ സംഭവിച്ചു: അദ്ദേഹം ഒരു വള്ളത്തിൽ കയറി; ശിഷ്യന്മാരും അദ്ദേഹത്തോടൊപ്പം കയറി. അദ്ദേഹം അവരോട്, “നമുക്ക് തടാകത്തിന്റെ മറുകരയിലേക്കു പോകാം[a],” എന്നു പറഞ്ഞു. അങ്ങനെ അവർ യാത്ര തിരിച്ചു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നമുക്ക് തടാകത്തിന്റെ അക്കരയിലേക്കു കടക്കാം.”'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള ഗ്രീക്ക് ക്രിയ നാവികസന്ദർഭത്തിൽ “പുറപ്പെട്ടു,” “വള്ളം നീക്കി പുറപ്പെട്ടു,” അല്ലെങ്കിൽ “യാത്ര തുടങ്ങി” എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν μιᾷ τῶν ἡμερῶν
  choice: ആ ദിവസങ്ങളിലൊന്നിൽ
  rationale: ലൂക്കോസിന്റെ സംഭവാവതരണ ശൈലിയെയും നിർദിഷ്ടമല്ലാത്ത കാലസൂചനയെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘സംഭവിച്ചു’ എന്ന് വേറിട്ട് ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: അദ്ദേഹം ഒരു വള്ളത്തിൽ കയറി; ശിഷ്യന്മാരും അദ്ദേഹത്തോടൊപ്പം കയറി
  rationale: ἐμβαίνωയുടെ കയറുന്ന പ്രവൃത്തി വ്യക്തമായി നിലനിർത്തുകയും ഏകോപിതമായ ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി വിഭജിക്കുകയും ചെയ്യുന്നു. πλοῖον എന്നതിന് ഈ തടാകസന്ദർഭത്തിൽ ‘വള്ളം’ അനുയോജ്യമാണ്.
- source_word: εἶπεν πρὸς αὐτούς
  choice: അദ്ദേഹം അവരോട് … എന്നു പറഞ്ഞു
  rationale: λέγω + πρός എന്ന സാധാരണ പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: Διέλθωμεν
  choice: നമുക്ക് … പോകാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലുള്ള ആഹ്വാനപരമായ ഉപവാക്യത്തിന്റെ നിർദേശസ്വരം നിലനിർത്തുന്നു; ദിശാസൂചന തുടർന്നുള്ള ‘മറുകരയിലേക്ക്’ എന്നതിൽ വ്യക്തമാണ്.
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: തടാകത്തിന്റെ മറുകരയിലേക്ക്
  rationale: τὸ πέραν എന്നതിന്റെ ‘മറുവശം/മറുകര’ എന്ന അർഥവും λίμνηയുടെ പ്രത്യേകമായ ‘തടാകം’ എന്ന അർഥവും കൃത്യമായി നൽകുന്നു.
- source_word: ἀνήχθησαν
  choice: അവർ യാത്ര തിരിച്ചു
  rationale: നാവികസന്ദർഭത്തിൽ ‘കരയിൽനിന്നു നീങ്ങി യാത്ര തുടങ്ങുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ നാവികസ്വഭാവമുള്ള സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
