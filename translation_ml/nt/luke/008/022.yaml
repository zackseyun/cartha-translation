translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പഴഞ്ചൻ ‘സംഭവിച്ചതു എന്തെന്നാൽ’ പോലുള്ള ഘടനകൾ ഒഴിവാക്കി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങളോട് പൊരുത്തപ്പെടാത്തതിനാൽ, [a] മറുകരയിലേക്കുള്ള നിർദേശത്തിനും [b] യാത്ര തുടങ്ങുന്ന നാവികക്രിയയ്ക്കും പിന്നാലെ ഉറവിടാർഥത്തിന് അനുസരിച്ച് സ്ഥാപിച്ചു.
