reference: Luke 8:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: ml
  text: അവർ അവന്റെ അടുത്തുചെന്ന് അവനെ ഉണർത്തി, “ഗുരോ, ഗുരോ, ഞങ്ങൾ നശിച്ചുപോകുന്നു!” എന്നു പറഞ്ഞു. അവൻ ഉണർന്നപ്പോൾ കാറ്റിനെയും വെള്ളത്തിന്റെ തിരയിളക്കത്തെയും[a] ശാസിച്ചു. അവ നിലച്ചു; ശാന്തത ഉണ്ടായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെള്ളത്തിന്റെ ആഞ്ഞടിക്കുന്ന തിരമാലകളെയും.”
    reason: κλύδων എന്ന പദത്തിന് വെള്ളത്തിന്റെ തിരയിളക്കം, കുതിച്ചുയരുന്ന തിര, ആഞ്ഞടിക്കുന്ന തിരമാലകൾ എന്നീ സമീപാർഥങ്ങൾ ഉണ്ടായതിനാൽ ഒരു സ്വാഭാവിക പകരംവിവർത്തനം നൽകുന്നു.
lexical_decisions:
- source_word: προσελθόντες
  choice: അവർ അടുത്തുചെന്ന്
  rationale: യേശുവിന്റെ അടുക്കലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്ന മുൻകാല സഹക്രിയ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διήγειραν
  choice: അവനെ ഉണർത്തി
  rationale: ഉറക്കത്തിൽനിന്ന് ഒരാളെ ഉണർത്തുക എന്ന സകർമക അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Ἐπιστάτα
  choice: നായകാ
  rationale: ലൂക്കോസിൽ യേശുവിന്റെ അധികാരത്തെ അംഗീകരിച്ചുള്ള സംബോധനയാണിത്; ‘ഗുരുവേ’ എന്നത് പഠിപ്പിക്കുന്നവൻ എന്ന അർഥത്തിലേക്ക് ചുരുക്കാം, ‘കർത്താവേ’ എന്നത് κύριος എന്ന വേറൊരു പദവുമായി കലരാം.
- source_word: ἀπολλύμεθα
  choice: ഞങ്ങൾ നശിച്ചുപോകുന്നു
  rationale: സംഭവിച്ചുകൊണ്ടിരിക്കുന്നതും ആസന്നവുമായ മാരകഭീഷണിയുടെ വർത്തമാനകാല ശക്തി നിലനിർത്തുന്നു.
- source_word: διεγερθεὶς
  choice: അവൻ ഉണർന്നിട്ട്
  rationale: കർത്തരി-കർമണി വ്യത്യാസം അനാവശ്യമായി തീർപ്പാക്കാതെ, ഉണർന്നതിനു പിന്നാലെയുള്ള പ്രവൃത്തിക്രമം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐπετίμησεν
  choice: ശാസിച്ചു
  rationale: കാറ്റിനും വെള്ളത്തിനുമേൽ പ്രയോഗിച്ച അധികാരപൂർവമായ ശക്തമായ വിലക്കോ ആജ്ഞയോ സുവിശേഷഭാഷയ്ക്ക് യോജിച്ചവിധം പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀνέμῳ
  choice: കാറ്റിനെയും
  rationale: മൂലപാഠത്തിലെ ലളിതമായ ‘കാറ്റ്’ എന്ന അർഥത്തിലേക്ക് അധിക വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: κλύδωνι τοῦ ὕδατος
  choice: വെള്ളത്തിന്റെ തിരയിളക്കത്തെയും
  rationale: κλύδων സൂചിപ്പിക്കുന്ന വെള്ളത്തിന്റെ പൊങ്ങിച്ചുഴിയുന്ന ചലനം ‘തിരമാലകൾ’ എന്നു മാത്രം ചുരുക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπαύσαντο
  choice: അവ നിലച്ചു
  rationale: ബഹുവചന ക്രിയയെ കാറ്റും വെള്ളത്തിന്റെ തിരയിളക്കവും എന്ന രണ്ടു മുൻവിഷയങ്ങളുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐγένετο γαλήνη
  choice: ശാന്തത ഉണ്ടായി
  rationale: കൊടുങ്കാറ്റിനുശേഷമുണ്ടായ ഫലം ലളിതമായ ഫലസൂചക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: Ἐπιστάτα എന്ന യേശുവിനുള്ള സംബോധന
  choice: നായകാ
  alternative: ഗുരുവേ; കർത്താവേ
  rationale: യേശുവിന്റെ അംഗീകൃത അധികാരം പ്രകടമാക്കുമ്പോഴും, പദത്തെ വെറും അധ്യാപകസ്ഥാനമായി ചുരുക്കുകയോ κύριος എന്ന വേറൊരു ക്രിസ്തുശാസ്ത്രപരമായ സംബോധനയുമായി കലർത്തുകയോ ചെയ്യുന്നില്ല.
- issue: സൃഷ്ടിശക്തികളോടുള്ള യേശുവിന്റെ അധികാരം സൂചിപ്പിക്കുന്ന ἐπετίμησεν
  choice: ശാസിച്ചു
  alternative: ആജ്ഞാപിച്ചു; വിലക്കി
  rationale: കാറ്റിനോടും വെള്ളത്തിന്റെ തിരയിളക്കത്തോടും യേശു നേരിട്ട് പ്രയോഗിക്കുന്ന അധികാരത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; അതിനപ്പുറമുള്ള ദൈവശാസ്ത്ര വിശദീകരണം പാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: διεγερθεὶς എന്ന കർമണി രൂപത്തിലെ അനിശ്ചിതത്വം
  choice: അവൻ ഉണർന്നിട്ട്
  alternative: അവർ ഉണർത്തിയശേഷം; അവൻ സ്വയം ഉണർന്ന്
  rationale: അവൻ എങ്ങനെ ഉണർന്നു എന്നത് വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ സംഭവക്രമം മാത്രം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ പ്രവൃത്തിക്രമവും ബഹുവചനസൂചനയും നിലനിർത്തി; പഴഞ്ചൻ പ്രയോഗങ്ങളും സഭാവിഭാഗ-വിശിഷ്ട പദങ്ങളും ഒഴിവാക്കി.
