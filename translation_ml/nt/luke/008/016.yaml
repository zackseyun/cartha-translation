id: LUK.8.16
reference: Luke 8:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: ml
  text: ആരും വിളക്കു കൊളുത്തിയശേഷം അതിനെ ഒരു പാത്രംകൊണ്ട് മൂടുകയോ കട്ടിലിനടിയിൽ വെക്കുകയോ ചെയ്യുന്നില്ല; മറിച്ച്, അകത്തേക്കു വരുന്നവർ വെളിച്ചം കാണേണ്ടതിന് അതിനെ വിളക്കുതണ്ടിന്മേൽ വെക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: വിളക്ക്
  rationale: എണ്ണവിളക്കിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: σκεύει
  choice: ഒരു പാത്രംകൊണ്ട്
  rationale: σκεῦος എന്ന പൊതുവായ ‘പാത്രം/ഉപകരണം’ എന്ന അർഥം അനാവശ്യമായി പ്രത്യേകീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: κλίνης
  choice: കട്ടിൽ
  rationale: സന്ദർഭത്തിലെ കിടക്കയെയോ ശയനമഞ്ചത്തെയോ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: λυχνίας
  choice: വിളക്കുതണ്ട്
  rationale: വിളക്ക് ഉയർത്തിവെക്കുന്ന stand എന്ന വസ്തുവിനെ വ്യക്തമാക്കുകയും ‘വിളക്ക്’ തന്നെയുമായി കലരാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ εἰσπορευόμενοι
  choice: അകത്തേക്കു വരുന്നവർ
  rationale: ദിശാസൂചന ഉൾപ്പെടുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: വിളക്കിന്റെ ദൃഷ്ടാന്തത്തിന്റെ പ്രതീകാർഥം
  choice: വാക്യം ദൃശ്യമായ വിളക്കും വെളിച്ചവും എന്ന രൂപകഭാഷയിൽ തന്നെയാക്കി
  alternative: ‘സത്യം’, ‘സുവിശേഷം’, അല്ലെങ്കിൽ ‘സാക്ഷ്യം’ എന്നു വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക
  rationale: ഈ വാക്യം പ്രതീകത്തിന്റെ അർഥം നേരിട്ട് നിർവചിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ പ്രത്യേകീകരണം ഒഴിവാക്കി യഥാർഥ തുറന്ന നില നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ δέ വേറിട്ടൊരു ‘ഇപ്പോൾ’ എന്ന സമയസൂചകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല; οὐδείς…ἀλλά എന്ന വിരുദ്ധഘടന ‘ചെയ്യുന്നില്ല; മറിച്ച്’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
