id: LUK.8.53
reference: Luke 8:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ, εἰδότες ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: ml
  text: അവൾ മരിച്ചുവെന്ന് അറിഞ്ഞിരുന്നതിനാൽ അവർ അവനെ പരിഹസിച്ച് ചിരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: പരിഹസിച്ചു ചിരിക്കുകയായിരുന്നു
  rationale: അപഹാസത്തിന്റെ ഭാവമുള്ള പ്രവൃത്തിയെ καταγελάω സൂചിപ്പിക്കുന്നു; അപൂർണ്ണ ഭൂതകാലരൂപം തുടരുകയായിരുന്ന പ്രവൃത്തിയെ കാണിക്കുന്നതിനാൽ ‘ചിരിക്കുകയായിരുന്നു’ എന്ന് നൽകി, ‘പരിഹസിച്ചു’ എന്നതിലൂടെ നിന്ദാഭാവവും വ്യക്തമാക്കി.
- source_word: αὐτοῦ
  choice: അവനെ
  rationale: καταγελάω എന്ന ക്രിയയുടെ പരിഹാസലക്ഷ്യം സൂചിപ്പിക്കുന്ന സർവനാമം; മലയാളത്തിൽ ‘അവനെ പരിഹസിച്ചു ചിരിക്കുക’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: εἰδότες
  choice: അവർക്ക് അറിയാമായിരുന്നതിനാൽ
  rationale: രൂപത്തിൽ ഭൂതകാല ക്രിയാംശമാണെങ്കിലും സന്ദർഭത്തിൽ അവരുടെ പരിഹാസത്തിന്റെ കാരണം നൽകുന്നു; കാരണബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിച്ചു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: അവർ അറിഞ്ഞിരുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.
- source_word: ἀπέθανεν
  choice: മരിച്ചെന്ന്
  rationale: മരണം സംഭവിച്ചുകഴിഞ്ഞ പൂർത്തിയായ സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘മരിച്ചെന്ന്’ എന്നത് ക്രിയയുടെ സംഭവസ്വഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഗ്രീക്കിൽ കർത്തൃനാമം ആവർത്തിക്കാതെ മൂന്നാംപുരുഷ ഏകവചന ക്രിയ മാത്രം ഉപയോഗിച്ചിരിക്കുമ്പോൾ പെൺകുട്ടിയെ എങ്ങനെ സൂചിപ്പിക്കണം
  choice: അവൾ മരിച്ചെന്ന്
  alternative: കുട്ടി മരിച്ചെന്ന് / അവൾ മരിച്ചുകിടക്കുകയാണെന്ന്
  rationale: മുൻസന്ദർഭത്തിൽ സ്ത്രീലിംഗ സൂചന വ്യക്തമായതിനാൽ ‘അവൾ’ സ്വാഭാവികമാണ്; ‘കുട്ടി’ എന്ന നാമം ചേർക്കാതെയും സംഭവത്തെ അവസ്ഥയായി മാറ്റാതെയും മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ ആഖ്യാനശൈലി. പരിഹാസഭാവവും അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചയും ഒരുമിച്ച് നിലനിർത്താൻ ‘പരിഹസിച്ചു ചിരിക്കുകയായിരുന്നു’ ഉപയോഗിച്ചു.
