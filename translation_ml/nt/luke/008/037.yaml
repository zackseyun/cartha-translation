id: LUK.8.37
reference: Luke 8:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: ml
  text: ഗെരസേന്യരുടെ ചുറ്റുമുള്ള പ്രദേശത്തുനിന്നുള്ള ജനക്കൂട്ടം മുഴുവനും യേശുവിനോട് തങ്ങളെ വിട്ടുപോകണമെന്ന് അഭ്യർഥിച്ചു; കാരണം, വലിയ ഭയം അവരെ പിടികൂടിയിരുന്നു.[a] അങ്ങനെ യേശു ഒരു പടകിൽ കയറി മടങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വലിയ ഭയം അവരെ കീഴടക്കിയിരുന്നു.’
    reason: συνείχοντο എന്ന പദത്തിന്റെ ‘പിടിച്ചുകെട്ടുക/കീഴടക്കുക’ എന്ന ശക്തമായ അർഥം പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവികമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: ἠρώτησεν
  choice: ആവശ്യപ്പെട്ടു
  rationale: ἐρωτάω ഇവിടെ ഒരു കാര്യം ചെയ്യണമെന്ന അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു. ‘ആവശ്യപ്പെട്ടു’ സന്ദർഭത്തിലെ ഗൗരവം നിലനിർത്തുന്നു; ‘യാചിച്ചു’ എന്നതുപോലെ തീവ്രത കൂട്ടുന്നില്ല.
- source_word: ἅπαν τὸ πλῆθος
  choice: ജനക്കൂട്ടം മുഴുവനും
  rationale: ἅπαν എന്ന പദത്തിന്റെ സമഗ്രത വ്യക്തമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: τῆς περιχώρου
  choice: ചുറ്റുമുള്ള പ്രദേശത്തുനിന്നുള്ള
  rationale: περίχωρος ചുറ്റുമുള്ള പ്രദേശത്തെയോ ജില്ലയെയോ സൂചിപ്പിക്കുന്നു; ജനക്കൂട്ടം എവിടെനിന്നുള്ളതാണെന്ന ബന്ധം ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: τῶν Γερασηνῶν
  choice: ഗെരസേന്യരുടെ
  rationale: നൽകിയ ഗ്രീക്ക് പാഠത്തിലെ Γερασηνῶν എന്ന സ്ഥലജനനാമത്തിന്റെ അംഗീകൃത മലയാള ലിപ്യന്തരണം പിന്തുടരുന്നു.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: തങ്ങളെ വിട്ടുപോകണമെന്ന്
  rationale: അവരിൽനിന്ന് അകന്നുപോകുക എന്ന ദിശാബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: φόβῳ μεγάλῳ
  choice: വലിയ ഭയം
  rationale: വിശേഷണത്തിന്റെ തീവ്രത കൂട്ടാതെയോ കുറയ്ക്കാതെയോ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: συνείχοντο
  choice: അവരെ പിടികൂടിയിരുന്നു
  rationale: συνέχω ഇവിടെ ഭയത്തിന്റെ ശക്തമായ നിയന്ത്രണത്തെയോ പിടിയെയോ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം രൂപകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: ഒരു വള്ളത്തിൽ കയറി
  rationale: അനിർദ്ദിഷ്ടമായ πλοῖον എന്ന നാമത്തെയും കയറുന്ന പ്രവൃത്തിയെയും ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὑπέστρεψεν
  choice: മടങ്ങിപ്പോയി
  rationale: ὑποστρέφω എന്നതിന്റെ ‘തിരികെ പോകുക’ എന്ന കഥനാർത്ഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള ഗെരസേന്യപ്രദേശത്തെ ജനങ്ങളുടെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: വലിയ ഭയമാണ് യേശുവിനെ വിട്ടുപോകാൻ ആവശ്യപ്പെടാൻ കാരണമായതെന്ന് മാത്രം പറയുന്നു.
  alternative: ഈ ഭയം ദൈവിക ശക്തിയോടുള്ള ഭക്തിപൂർവമായ ഭയമായിരുന്നുവെന്നോ സാമ്പത്തിക നഷ്ടത്തോടോ സാമൂഹിക കലക്കത്തോടോ ഉള്ള വിരോധമായിരുന്നുവെന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ഭയത്തിന്റെ കാരണം അല്ലെങ്കിൽ സ്വഭാവം നിർവചിക്കുന്നില്ല. അതിനാൽ അതിനെ ഭക്തി, വിരോധം, അല്ലെങ്കിൽ മറ്റൊരു പ്രത്യേക വികാരം എന്നു വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കഥനത്തിൽ വ്യക്തതയ്ക്കായി ‘യേശു’ രണ്ടാം വാക്യത്തിൽ ആവർത്തിച്ചിരിക്കുന്നു; ഭയത്തിന്റെ സ്വഭാവം വ്യാഖ്യാനിച്ച് നിർണ്ണയിച്ചിട്ടില്ല.
