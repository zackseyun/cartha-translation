source:
  edition: SBLGNT
  text: καὶ ἕτερον ⸀κατέπεσεν ἐπὶ τὴν πέτραν, καὶ φυὲν ἐξηράνθη διὰ τὸ μὴ ἔχειν ἰκμάδα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: ml
  text: മറ്റൊന്ന് പാറമേൽ[a] വീണു; അത് മുളച്ചുവന്നശേഷം ഈർപ്പം ഇല്ലാത്തതിനാൽ ഉണങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാറയുടെ മുകളിൽ.’ ഗ്രീക്കിൽ ‘പാറ’ ഏകവചനത്തിലാണ്; പൊതുവായ ‘പാറനിലം’ എന്നതിനു പകരം വിത്ത് ഒരു പാറപ്രതലത്തിൽ വീഴുന്ന ചിത്രം ഇതു നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: മറ്റൊന്ന്
  rationale: നപുംസക ഏകവചന വിശേഷണം നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നു; വിത്തിന്റെ അടുത്ത ഭാഗത്തെ സൂചിപ്പിക്കാൻ ‘മറ്റൊന്ന്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: κατέπεσεν
  choice: വീണു
  rationale: καταπίπτω എന്ന ക്രിയയുടെ സാധാരണ അർഥം സന്ദർഭത്തിൽ ലളിതമായി നൽകുന്നു; ‘താഴെ വീണു’ എന്ന അധിക ഊന്നൽ ആവശ്യമില്ല.
- source_word: ἐπὶ τὴν πέτραν
  choice: പാറമേൽ
  rationale: πέτρα ഏകവചനമായതിനാൽ പൊതുവായ ‘പാറനിലത്ത്’ എന്നതിനു പകരം ഗ്രീക്കിലെ മൂർത്തമായ പാറയുടെ ചിത്രം നിലനിർത്തുന്നു.
- source_word: φυὲν
  choice: മുളച്ചുവന്നശേഷം
  rationale: φύω എന്ന ക്രിയയുടെ പങ്കാളിത്തരൂപം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള സമയക്രമം സൂചിപ്പിക്കുന്നു; വിത്തിന്റെ സന്ദർഭത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: ἐξηράνθη
  choice: ഉണങ്ങിപ്പോയി
  rationale: സസ്യം ഈർപ്പമില്ലാതെ വാടിയുണങ്ങുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: ഇല്ലാത്തതിനാൽ
  rationale: διάയോടുകൂടിയ articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കാരണബന്ധം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: ἰκμάδα
  choice: ഈർപ്പം
  rationale: വളർച്ചയ്ക്ക് ആവശ്യമായ moisture എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘നീര്’ അല്ലെങ്കിൽ ‘സസ്യരസം’ എന്നതിലധികം കൃത്യമാണ്.
