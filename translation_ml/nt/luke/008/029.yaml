revisions:
- from: അശുദ്ധാത്മാവ് ആ മനുഷ്യനിൽനിന്ന് പുറത്തുവരണമെന്ന് യേശു കല്പിച്ചിരുന്നതിനാലാണ് അവൻ അങ്ങനെ പറഞ്ഞത്. ആ ആത്മാവ് പല പ്രാവശ്യം[a] അവനെ പിടികൂടിയിരുന്നു. കാവലിൽ പാർപ്പിച്ച് ചങ്ങലകളും കാൽവിലങ്ങുകളുംകൊണ്ട് അവനെ ബന്ധിക്കാറുണ്ടായിരുന്നെങ്കിലും, അവൻ ബന്ധനങ്ങൾ പൊട്ടിച്ചുകളയുകയും ഭൂതത്താൽ വിജനസ്ഥലങ്ങളിലേക്ക്[b] ഓടിക്കപ്പെടുകയും ചെയ്തിരുന്നു.
  to: യേശു അശുദ്ധാത്മാവിനോട് ആ മനുഷ്യനിൽനിന്ന് പുറത്തുവരാൻ കൽപിച്ചിരുന്നു. അത് പല പ്രാവശ്യം[a] അവനെ പിടികൂടിയിരുന്നു; അവനെ കാവലിൽ സൂക്ഷിച്ചുകൊണ്ട് ചങ്ങലകളും കാൽവിലങ്ങുകളുംകൊണ്ട് ബന്ധിക്കാറുണ്ടായിരുന്നു. എന്നാൽ അവൻ ബന്ധനങ്ങൾ പൊട്ടിച്ചുകളയുകയും ഭൂതം അവനെ വിജനസ്ഥലങ്ങളിലേക്ക്[b] നിർബന്ധിച്ച് കൊണ്ടുപോകുകയും ചെയ്യുമായിരുന്നു.
  rationale: ഉറവിടത്തിൽ പറയാത്ത സന്ദർഭവ്യാഖ്യാനം നീക്കി, γάρ-ന്റെ പശ്ചാത്തലവിശദീകരണ സ്വഭാവം ‘യേശു ... കൽപിച്ചിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തി. അവസാന ക്രിയയിൽ ഭൂതത്തിന്റെ നിർബന്ധിത പ്രവർത്തനവും ആവർത്തിതമായ ഭൂതകാലഭാവവും കൂടുതൽ കൃത്യമായി പ്രകടമാക്കി. അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളും അവയുടെ സ്ഥാനങ്ങളും നിലനിർത്തി.
