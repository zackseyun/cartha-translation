  source_fidelity: ആദ്യവാക്യത്തിലെ “അവൻ അങ്ങനെ പറഞ്ഞത്” ഗ്രീക്ക് വാക്യത്തിൽ ഇല്ലാത്ത ഒരു സന്ദർഭവിശദീകരണമാണ്; അതു ഒഴിവാക്കണം. ἠλαύνετο എന്ന നിർബന്ധിതമായി തള്ളിനീക്കപ്പെടുന്ന അർഥത്തിന് “ഓടിക്കപ്പെടുകയും” താരതമ്യേന ഇടുങ്ങിയതാണ്. “നിർബന്ധിച്ച് ... കൊണ്ടുപോകുമായിരുന്നു” ആ ബലപ്രയോഗവും അപൂർണഭൂതകാലത്തിന്റെ ആവർത്തനഭാവവും കൂടുതൽ വ്യക്തമായി നൽകുന്നു. πολλοῖς χρόνοις-ന് ‘പല പ്രാവശ്യം’ എന്ന വായന സന്ദർഭപിന്തുണയുള്ളതാണെങ്കിലും ‘വളരെക്കാലമായി’ എന്ന സാധ്യവായന അടിക്കുറിപ്പിൽ ഉചിതമായി സൂക്ഷിച്ചിട്ടുണ്ട്.
  naturalness: നിർദ്ദേശിച്ച പാഠം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനരീതിയാണ്. “കാവലിൽ പാർപ്പിച്ച്” എന്നതിനു പകരം “കാവലിൽ സൂക്ഷിച്ചുകൊണ്ട്” എന്നത് φυλασσόμενος-ന്റെ ‘guarded’ എന്ന ഭാവം നേരിട്ട് നൽകുന്നു.
  terminology: ‘അശുദ്ധാത്മാവ്’ πνεῦμα τὸ ἀκάθαρτον-നും ‘ഭൂതം’ δαιμόνιον-നും അനുയോജ്യമായ, വ്യക്തിപരമായ ആത്മിക പ്രവർത്തകത്വം മൃദൂകരിക്കാത്ത പദങ്ങളാണ്. ‘ചങ്ങലകളും കാൽവിലങ്ങുകളും’ എന്ന വേർതിരിവും ശരിയാണ്.
  issues:
  - severity: medium
    issue: ആദ്യവാക്യത്തിൽ ഉറവിടത്തിൽ ഇല്ലാത്ത “അവൻ അങ്ങനെ പറഞ്ഞത്” ചേർത്തിരിക്കുന്നു.
    rationale: γάρ യേശുവിന്റെ കൽപനയെ വിശദീകരണപശ്ചാത്തലമായി നൽകുന്നു; എന്നാൽ ‘അങ്ങനെ പറഞ്ഞത്’ എന്ന പ്രത്യേക സംഭവത്തെ ഈ വാക്യം പ്രസ്താവിക്കുന്നില്ല. വിവർത്തനത്തിൽ യേശുവിന്റെ കൽപന മാത്രം പറയണം.
  - severity: low
    issue: “ഓടിക്കപ്പെടുകയും” ἠλαύνετο-ന്റെ അർഥം അനാവശ്യമായി ഓട്ടത്തിലേക്കു ചുരുക്കുന്നു.
    rationale: ക്രിയയുടെ മുഖ്യഭാവം ഭൂതത്താൽ ബലമായി/നിർബന്ധിച്ച് നീക്കപ്പെടുക എന്നതാണ്; നിർബന്ധിച്ചു കൊണ്ടുപോകുക കൂടുതൽ വ്യാപകവും സ്വാഭാവികവുമാണ്.
  revised_text: യേശു അശുദ്ധാത്മാവിനോട് ആ മനുഷ്യനിൽനിന്ന് പുറത്തുവരാൻ കൽപിച്ചിരുന്നു. അത് പല പ്രാവശ്യം[a] അവനെ പിടികൂടിയിരുന്നു; അവനെ കാവലിൽ സൂക്ഷിച്ചുകൊണ്ട് ചങ്ങലകളും കാൽവിലങ്ങുകളുംകൊണ്ട് ബന്ധിക്കാറുണ്ടായിരുന്നു. എന്നാൽ അവൻ ബന്ധനങ്ങൾ പൊട്ടിച്ചുകളയുകയും ഭൂതം അവനെ വിജനസ്ഥലങ്ങളിലേക്ക്[b] നിർബന്ധിച്ച് കൊണ്ടുപോകുകയും ചെയ്യുമായിരുന്നു.
