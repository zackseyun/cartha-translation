id: LUK.8.29
reference: Luke 8:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: ml
  text: യേശു അശുദ്ധാത്മാവിനോട് ആ മനുഷ്യനിൽനിന്ന് പുറത്തുവരാൻ കൽപിച്ചിരുന്നു. അത് പല പ്രാവശ്യം[a] അവനെ പിടികൂടിയിരുന്നു; അവനെ കാവലിൽ സൂക്ഷിച്ചുകൊണ്ട് ചങ്ങലകളും കാൽവിലങ്ങുകളുംകൊണ്ട് ബന്ധിക്കാറുണ്ടായിരുന്നു. എന്നാൽ അവൻ ബന്ധനങ്ങൾ പൊട്ടിച്ചുകളയുകയും ഭൂതം അവനെ വിജനസ്ഥലങ്ങളിലേക്ക്[b] നിർബന്ധിച്ച് കൊണ്ടുപോകുകയും ചെയ്യുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വളരെക്കാലമായി.” ഗ്രീക്ക് പ്രയോഗത്തിന് ദീർഘകാലത്തെയും സൂചിപ്പിക്കാം; സന്ദർഭം ആവർത്തിച്ചുണ്ടായ സംഭവങ്ങളെയും പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “വിജനമായ സ്ഥലങ്ങളിലേക്ക്”; ഗ്രീക്കിൽ ബഹുവചനമാണ്. “മരുഭൂമിയിലേക്ക്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: കല്പിച്ചിരുന്നതിനാലാണ്
  rationale: ഗ്രീക്ക് അപൂർണഭൂതകാലരൂപവും വിശദീകരണാർഥമുള്ള γάρ-ഉം ചേർന്ന് മുൻപേ നൽകിയ കല്പനയെ പശ്ചാത്തലമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: അശുദ്ധാത്മാവ്
  rationale: പുതിയനിയമത്തിലെ സ്ഥിരപ്രയോഗം സംരക്ഷിക്കുകയും ശുദ്ധി–അശുദ്ധി എന്ന പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου
  choice: ആ മനുഷ്യനിൽനിന്ന് പുറത്തുവരണമെന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന വേർപാടിന്റെ സ്ഥാനാർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: πολλοῖς χρόνοις
  choice: പല പ്രാവശ്യം
  rationale: ബഹുവചനവും സന്ദർഭത്തിലെ ആവർത്തിത സംഭവങ്ങളും കണക്കിലെടുത്ത് ആവർത്തനാർഥം മുഖ്യപാഠത്തിൽ നൽകി; ദീർഘകാലാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: συνηρπάκει
  choice: പിടികൂടിയിരുന്നു
  rationale: പെട്ടെന്നോ ബലമായോ കീഴടക്കുന്നതിന്റെ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ἐδεσμεύετο
  choice: ബന്ധിക്കാറുണ്ടായിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ പതിവായോ ആവർത്തിച്ചോ നടന്ന പ്രവൃത്തിയുടെ ഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἁλύσεσιν καὶ πέδαις
  choice: ചങ്ങലകളും കാൽവിലങ്ങുകളുംകൊണ്ട്
  rationale: രണ്ട് വ്യത്യസ്ത ബന്ധനോപകരണങ്ങളെയും വ്യക്തമായി വേർതിരിക്കുന്നു; πέδαις എന്നത് കാലിലെ വിലങ്ങുകളെ സൂചിപ്പിക്കുന്നു.
- source_word: φυλασσόμενος
  choice: കാവലിൽ പാർപ്പിച്ച്
  rationale: ബന്ധിതനാക്കപ്പെട്ട സാഹചര്യത്തോടൊപ്പം അവനെ കാവലിൽ സൂക്ഷിച്ചിരുന്നുവെന്ന ആശയം സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: ബന്ധനങ്ങൾ പൊട്ടിച്ചുകളയുകയും
  rationale: δεσμά പൊതുവായി ബന്ധനങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ മുമ്പുള്ള ‘ചങ്ങലകൾ’ ആവർത്തിക്കാതെ വിശാലമായ പദം ഉപയോഗിച്ചു; διαρρήσσων-ന്റെ ശക്തിയും നിലനിർത്തി.
- source_word: ἠλαύνετο
  choice: ഓടിക്കപ്പെടുകയും ചെയ്തിരുന്നു
  rationale: ബാഹ്യശക്തിയാൽ നിർബന്ധിതമായി നീക്കപ്പെട്ടതും അതിന്റെ ആവർത്തിത സ്വഭാവവും പ്രകടമാക്കുന്നു.
- source_word: ὑπὸ τοῦ δαιμονίου
  choice: ഭൂതത്താൽ
  rationale: വ്യക്തിപരമായ ദുഷ്ടാത്മിക പ്രവർത്തകനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന പരിചിതവും വ്യക്തവുമായ മലയാളപദം.
- source_word: εἰς τὰς ἐρήμους
  choice: വിജനസ്ഥലങ്ങളിലേക്ക്
  rationale: ഗ്രീക്കിലെ ബഹുവചനം സംരക്ഷിച്ചുകൊണ്ട് ജനവാസമില്ലാത്ത പ്രദേശങ്ങൾ എന്ന അർഥം നൽകുന്നു; പ്രത്യേക ഭൂപ്രകൃതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: അശുദ്ധാത്മാവിനെയും ഭൂതത്തെയും സൂചിപ്പിക്കുന്ന പദങ്ങൾ
  choice: ‘അശുദ്ധാത്മാവ്’, ‘ഭൂതം’ എന്ന് വ്യക്തിപരമായ ആത്മിക പ്രവർത്തകരായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദുഷ്ടാത്മാവ്’ എന്നൊരൊറ്റ പദത്തിൽ രണ്ടും ഒതുക്കുക, അല്ലെങ്കിൽ മാനസികരോഗത്തിന്റെ രൂപകമായി മൃദൂകരിക്കുക.
  rationale: വാക്യം πνεῦμα τὸ ἀκάθαρτον, δαιμόνιον എന്നീ വ്യത്യസ്ത പദങ്ങൾ ഉപയോഗിക്കുകയും വ്യക്തിപരമായ പ്രവർത്തനം അവയ്ക്കു ചുമത്തുകയും ചെയ്യുന്നു; അതിനാൽ പാഠത്തെ മനശ്ശാസ്ത്രപരമായി പുനർവ്യാഖ്യാനിക്കാതെ ആ വിവരണലോകം നിലനിർത്തി.
- issue: ആദ്യവാക്യത്തിലെ പറയാത്ത കർത്താവ്
  choice: മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘യേശു’ എന്ന് വ്യക്തമാക്കി.
  alternative: ‘അവൻ കല്പിച്ചിരുന്നതിനാലാണ്’ എന്ന് സർവനാമം മാത്രം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിൽ കർത്താവ് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കപ്പെടുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായ യേശുവിനെ നാമകരണം ചെയ്യുന്നത് അർഥവ്യാഖ്യാനം മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി. participial ബന്ധം കർശനമായി അനുകരിക്കാതെ സംഭവങ്ങളുടെ ആവർത്തിതവും വിരുദ്ധവുമായ ബന്ധം ‘ബന്ധിക്കാറുണ്ടായിരുന്നെങ്കിലും’ എന്ന ഘടനയിൽ വ്യക്തമാക്കി.
