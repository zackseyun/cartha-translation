    reason: lexical_alternative
  revision_rationale: ഉറവിടത്തിൽ പറയാത്ത സന്ദർഭവ്യാഖ്യാനം നീക്കി, γάρ-ന്റെ പശ്ചാത്തലവിശദീകരണ സ്വഭാവം ‘യേശു ... കൽപിച്ചിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തി. അവസാന ക്രിയയിൽ ഭൂതത്തിന്റെ നിർബന്ധിത പ്രവർത്തനവും ആവർത്തിതമായ ഭൂതകാലഭാവവും കൂടുതൽ കൃത്യമായി പ്രകടമാക്കി. അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളും അവയുടെ സ്ഥാനങ്ങളും നിലനിർത്തി.
