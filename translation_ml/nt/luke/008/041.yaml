id: LUK.8.41
reference: Luke 8:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: ml
  text: അപ്പോൾ, ഇതാ, യായീറൊസ് എന്നു പേരുള്ള ഒരു മനുഷ്യൻ വന്നു; അവൻ സിനഗോഗിലെ ഒരു നേതാവായിരുന്നു. യേശുവിന്റെ കാൽക്കൽ വീണ അവൻ, തന്റെ വീട്ടിലേക്കു വരാൻ യേശുവിനോട് ആവർത്തിച്ച് അപേക്ഷിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: അപ്പോൾ ഇതാ
  rationale: ആഖ്യാനത്തിന്റെ തുടർച്ചയും പുതിയ സംഭവത്തിലേക്കുള്ള ശ്രദ്ധാകേന്ദ്രവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: സിനഗോഗിന്റെ ഒരു നേതാവ്
  rationale: ἄρχων എന്നത് ഭരണപരമോ മേൽനോട്ടപരമോ ആയ സ്ഥാനം സൂചിപ്പിക്കുന്നു; പദവിയുടെ കൃത്യമായ ചുമതല അനാവശ്യമായി നിർവചിക്കാതെ 'നേതാവ്' എന്നു നൽകി. അനിശ്ചിത നിർദേശഭാവം നിലനിർത്താൻ 'ഒരു' ചേർത്തു.
- source_word: πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ കാൽക്കൽ വീണ്
  rationale: യേശുവിന്റെ മുമ്പിലുള്ള യായീറൊസിന്റെ വിനയപൂർവവും അടിയന്തരവുമായ പ്രവൃത്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകർത്തുന്നു.
- source_word: παρεκάλει
  choice: അപേക്ഷിച്ചു
  rationale: സന്ദർഭത്തിലെ തീവ്രമായ അഭ്യർഥന വ്യക്തമാക്കുന്നു; 'യാചിച്ചു' എന്നതിനെക്കാൾ ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: തന്റെ വീട്ടിലേക്കു വരണമെന്ന്
  rationale: അക്ഷരാർഥം 'തന്റെ വീട്ടിൽ പ്രവേശിക്കണമെന്ന്' ആണെങ്കിലും, ക്ഷണത്തിന്റെ ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ 'വരണമെന്ന്' ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മാനക മലയാളം. യഹൂദാരാധനാലയത്തിന്റെ ചരിത്രപരമായ പ്രത്യേകത നിലനിർത്താൻ 'സിനഗോഗ്' എന്ന പദം ഉപയോഗിച്ചു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാള വാക്യങ്ങളാക്കി; ആശയക്രമം മാറ്റിയിട്ടില്ല.
