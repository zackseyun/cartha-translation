revisions:
- from: 'അപ്പോൾ അവൻ പറഞ്ഞു: “ദൈവരാജ്യത്തിന്റെ മർമ്മങ്ങൾ അറിയാൻ നിങ്ങൾക്കു നൽകിയിരിക്കുന്നു; എന്നാൽ ശേഷിക്കുന്നവരോട് ഉപമകളിലൂടെയാണ് സംസാരിക്കുന്നത്. അതിനാൽ, അവർ കണ്ടുകൊണ്ടിരുന്നാലും കാണാതിരിക്കട്ടെ; കേട്ടുകൊണ്ടിരുന്നാലും ഗ്രഹിക്കാതിരിക്കട്ടെ.”[a]'
  to: 'അവൻ പറഞ്ഞു: “ദൈവരാജ്യത്തിന്റെ മർമ്മങ്ങൾ അറിയാൻ നിങ്ങൾക്കു നൽകിയിരിക്കുന്നു; എന്നാൽ മറ്റുള്ളവർക്കാകട്ടെ അവ ഉപമകളിലൂടെയാണ് ലഭിക്കുന്നത്—അങ്ങനെ, അവർ കാണുന്നവരായിട്ടും കാണാതിരിക്കേണ്ടതിനും കേൾക്കുന്നവരായിട്ടും ഗ്രഹിക്കാതിരിക്കേണ്ടതിനുമായി.”[a]'
  rationale: The revision preserves the perfect-passive sense of “given,” retains the contrast between privileged knowledge and parabolic disclosure, and uses a natural Malayalam purpose construction to represent ἵνα with its unresolved purpose/result force. It also avoids making the Greek ellipsis explicitly an act of speaking.
