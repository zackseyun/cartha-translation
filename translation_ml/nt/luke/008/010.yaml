  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ദൈവരാജ്യത്തിന്റെ മർമ്മങ്ങൾ അറിയാൻ നിങ്ങൾക്കു നൽകിയിരിക്കുന്നു; എന്നാൽ മറ്റുള്ളവർക്കാകട്ടെ അവ ഉപമകളിലൂടെയാണ് ലഭിക്കുന്നത്—അങ്ങനെ, അവർ കാണുന്നവരായിട്ടും കാണാതിരിക്കേണ്ടതിനും കേൾക്കുന്നവരായിട്ടും ഗ്രഹിക്കാതിരിക്കേണ്ടതിനുമായി.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അവസാന ഉപവാക്യം യെശയ്യാവ് 6:9–10-നെ പ്രതിധ്വനിപ്പിക്കുന്നു. ഇവിടെ ἵνα എന്ന ഗ്രീക്ക് പദം ഉദ്ദേശ്യമോ ന്യായവിധിസംബന്ധമായ ഫലമോ, അല്ലെങ്കിൽ രണ്ടും കൂടിയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം; ഈ പിരിമുറുക്കം വാചകത്തിൽ നിലനിൽക്കുന്നു.
    reason: cross_reference_and_theological_ambiguity
lexical_decisions:
- source_word: δέδοται
  choice: നൽകിയിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ പൂർണ്ണകാല കർമണി രൂപം മുൻപ് ലഭിച്ച ദാനം ഇപ്പോഴും നിലനിൽക്കുന്നു എന്ന ആശയം നൽകുന്നു; ദാതാവിനെ വ്യക്തമാക്കാതെ മൂലത്തിന്റെ കർമണി ഘടനയും നിലനിർത്തുന്നു.
- source_word: γνῶναι
  choice: അറിയാൻ
  rationale: γινώσκω എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും വാക്യാവസാനത്തിലെ συνιῶσιν എന്ന ‘ഗ്രഹിക്കുക’ എന്ന ക്രിയയിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τὰ μυστήρια
  choice: മർമ്മങ്ങൾ
  rationale: മുമ്പ് മറഞ്ഞിരുന്നതും ദൈവം വെളിപ്പെടുത്തുന്നതുമായ ദൈവരാജ്യസത്യങ്ങൾ എന്ന ബൈബിൾപരമായ അർഥവ്യാപ്തി ‘മർമ്മങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിന്റെ
  rationale: ദൈവത്തിന്റെ ഭരണത്തെയും രാജ്യത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന, മലയാളത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: τοῖς δὲ λοιποῖς
  choice: എന്നാൽ ശേഷിക്കുന്നവരോട്
  rationale: λοιποί എന്നത് ‘മറ്റെല്ലാവരും/ശേഷിക്കുന്നവർ’ എന്നർഥം നൽകുന്നു; മർക്കോസിലെ ‘പുറത്തുള്ളവർ’ എന്ന പദപ്രയോഗം ലൂക്കോസിലേക്കു കൊണ്ടുവരുന്നില്ല.
- source_word: ἐν παραβολαῖς
  choice: ഉപമകളിലൂടെയാണ് സംസാരിക്കുന്നത്
  rationale: ഗ്രീക്കിൽ ക്രിയ ലോപിച്ചിരിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സന്ദർഭത്തിൽ സൂചിതമായ ‘സംസാരിക്കുന്നത്’ ചേർത്തു; ഉപമകളാണ് ആശയവിനിമയത്തിന്റെ രൂപം/മാധ്യമം എന്നത് വ്യക്തമാക്കുന്നു.
- source_word: ἵνα
  choice: അതുകൊണ്ട് / അതിനാൽ
  rationale: തുടർന്നുള്ള വാക്യത്തിന്റെ ഉദ്ദേശ്യ-ഫല പിരിമുറുക്കം പൂർണമായി മായ്ക്കാതെ മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കുന്നു; മുഖ്യവാചകത്തിലെ ‘-ട്ടെ’ രൂപത്തോടൊപ്പം ലക്ഷ്യസൂചന നിലനിൽക്കുന്നു.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: കണ്ടുകൊണ്ടിരുന്നാലും കാണാതിരിക്കട്ടെ
  rationale: βλέπω എന്ന ക്രിയയുടെ ആവർത്തനം നിലനിർത്തുന്നു; പങ്കുപദത്തിന്റെ സാഹചര്യ/വിരുദ്ധഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘-ആലും’ ഉപയോഗിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: കേട്ടുകൊണ്ടിരുന്നാലും ഗ്രഹിക്കാതിരിക്കട്ടെ
  rationale: കേൾക്കുന്നതും അർഥം ഗ്രഹിക്കുന്നതും തമ്മിലുള്ള വ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു; συνίημι-യ്ക്ക് ‘ഗ്രഹിക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ἵνα ഉപവാക്യത്തിന്റെ ബലവും യെശയ്യാവ് 6:9–10-ലെ പ്രതിധ്വനിയും
  choice: ‘അതുകൊണ്ട് ... കാണാതിരിക്കട്ടെ ... ഗ്രഹിക്കാതിരിക്കട്ടെ’ എന്ന ഉദ്ദേശ്യസൂചനയുള്ള രൂപം
  alternative: ‘അതിന്റെ ഫലമായി ... കാണുന്നില്ല ... ഗ്രഹിക്കുന്നില്ല’ എന്ന ഫലപ്രധാന രൂപം
  rationale: ഗ്രീക്ക് ἵνα ഉദ്ദേശ്യമോ ഫലമോ, അല്ലെങ്കിൽ ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ രണ്ടും ചേർന്നതോ സൂചിപ്പിക്കാം. വിവർത്തനം കഠിനമായ ഈ ദൈവശാസ്ത്ര പിരിമുറുക്കം മൃദുവാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘമായ ഉദ്ധരണിവാക്യം സ്വാഭാവികമാക്കാൻ ലോപിച്ച ക്രിയ സന്ദർഭാനുസൃതമായി പൂരിപ്പിച്ചു; യെശയ്യാവിന്റെ പ്രതിധ്വനിയിലെ ഉദ്ദേശ്യ/ഫല ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
