id: LUK.8.35
reference: Luke 8:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: ml
  text: സംഭവിച്ചത് എന്താണെന്നു കാണാൻ അവർ പുറപ്പെട്ടു. അവർ യേശുവിന്റെ അടുക്കൽ വന്ന്, ഭൂതങ്ങൾ വിട്ടുപോയ[a] ആ മനുഷ്യൻ വസ്ത്രം ധരിച്ചും സുബോധമുള്ളവനായും യേശുവിന്റെ കാൽക്കൽ ഇരിക്കുന്നതു കണ്ടു; അവർ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ക്രിയ ബഹുവചനത്തിലാണ് (‘ഭൂതങ്ങൾ വിട്ടുപോയി’); അച്ചടിച്ച ഗ്രീക്ക് പാഠത്തിൽ ബഹുവചന കർത്താവിനൊപ്പം ഏകവചന ക്രിയയാണുള്ളത്. അർഥത്തിൽ മാറ്റമില്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξῆλθον δὲ ἰδεῖν
  choice: സംഭവിച്ചത് എന്താണെന്നു കാണാൻ അവർ പുറപ്പെട്ടു
  rationale: ഉദ്ദേശ്യസൂചകമായ ἰδεῖν-നെയും ജനങ്ങളുടെ പുറത്തേക്കുള്ള നീക്കമായ ἐξῆλθον-നെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ γεγονός
  choice: സംഭവിച്ചത് എന്ത്
  rationale: പൂർണമായ സംഭവത്തെ സൂചിപ്പിക്കുന്ന substantival perfect participle-ന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: ഭൂതങ്ങൾ വിട്ടുപോയ ആ മനുഷ്യൻ
  rationale: മുമ്പ് ഭൂതബാധിതനായിരുന്ന മനുഷ്യനെ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; അച്ചടിച്ച ഗ്രീക്ക് പാഠത്തിലെ ബഹുവചന കർത്താവിനോടൊപ്പമുള്ള ഏകവചന ക്രിയ വിവർത്തനത്തിൽ കൃത്രിമമായി അനുകരിച്ചിട്ടില്ല.
- source_word: δαιμόνια
  choice: ഭൂതങ്ങൾ
  rationale: വ്യക്തിത്വമുള്ള അതീന്ദ്രിയ ദുഷ്ടശക്തികളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പദം.
- source_word: ἱματισμένον
  choice: വസ്ത്രം ധരിച്ച്
  rationale: മുമ്പത്തെ നഗ്നാവസ്ഥയോടുള്ള വ്യക്തമായ വൈരുധ്യം നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: σωφρονοῦντα
  choice: സുബോധത്തോടെ
  rationale: മനസ്സിന്റെ സ്വസ്ഥത, വിവേകം, ആത്മനിയന്ത്രണം എന്നീ അർഥനിറങ്ങൾ ആധുനിക ചികിത്സാശാസ്ത്രപരമായ വർഗീകരണം ഇറക്കുമതി ചെയ്യാതെ സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ കാൽക്കൽ
  rationale: സ്ഥാനത്തെ നേരിട്ട് അറിയിക്കുന്ന സ്വാഭാവിക മലയാളം; ശിഷ്യത്വത്തിന്റെ സൂചന സാധ്യതയായി നിലനിൽക്കുന്നു, എന്നാൽ അത് വിശദീകരിച്ച് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἐφοβήθησαν
  choice: അവർ ഭയപ്പെട്ടു
  rationale: ആഖ്യാനത്തിലെ ലളിതമായ aorist പ്രതികരണം നേരിട്ട് പകരുന്നു.
theological_decisions:
- issue: ഭൂതങ്ങളെ വെറും രോഗാവസ്ഥയോ രൂപകമോ ആയി ചുരുക്കണമോ
  choice: ഭൂതങ്ങൾ
  alternative: ദുരാത്മാക്കൾ
  rationale: വാക്യം യഥാർഥ ഭൂതനിർഗമനമായാണ് സംഭവം അവതരിപ്പിക്കുന്നത്; ‘ഭൂതങ്ങൾ’ എന്നത് ആ ആഖ്യാന-ദൈവശാസ്ത്ര ഭാരം നിലനിർത്തുന്നു.
- issue: σωφρονοῦντα എന്ന പദത്തിലെ മാനസികസ്വസ്ഥതയും ആത്മനിയന്ത്രണവും
  choice: സുബോധത്തോടെ
  alternative: സ്വസ്ഥമനസ്സോടെ
  rationale: മനുഷ്യന്റെ പുനഃസ്ഥാപിതമായ മനോനില അറിയിക്കുമ്പോഴും ആധുനിക ക്ലിനിക്കൽ രോഗനിർണയം പാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- issue: യേശുവിന്റെ കാൽക്കൽ ഇരിക്കുന്നതിന്റെ സാധ്യതയുള്ള ശിഷ്യത്വസൂചന
  choice: യേശുവിന്റെ കാൽക്കൽ
  alternative: യേശുവിന്റെ പാദങ്ങൾക്കരികെ
  rationale: ഗ്രീക്ക് സ്ഥാനപ്രയോഗം നേരിട്ട് നിലനിർത്തി, സമർപ്പണമോ ശിഷ്യത്വമോ എന്ന സാധ്യത വായനക്കാരന് തുറന്നുവയ്ക്കുന്നു; വ്യാഖ്യാനം വിവർത്തനത്തിൽ ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആഖ്യാനത്തിന്റെ ചുരുക്കവും മൂന്നു നിലകളിലുള്ള പുനഃസ്ഥാപനവും—വസ്ത്രം ധരിച്ചത്, സുബോധം, യേശുവിന്റെ കാൽക്കൽ ഇരിക്കൽ—നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട സ്ഥാനങ്ങളിൽ മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
