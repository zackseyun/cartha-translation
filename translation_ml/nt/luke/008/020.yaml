id: LUK.8.20
reference: Luke 8:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: ml
  text: 'അവനോട് ഇങ്ങനെ അറിയിച്ചു: “നിന്റെ അമ്മയും സഹോദരന്മാരും[a] നിന്നെ കാണാൻ ആഗ്രഹിച്ച് പുറത്ത് നിൽക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാർ’ എന്ന ഗ്രീക്കുപദം സന്ദർഭാനുസരണം വിശാലമായ അർഥത്തിൽ മനസ്സിലാക്കുന്നുവെങ്കിൽ, ‘ബന്ധുക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; സാധാരണയായി ഈ പദത്തിന്റെ അർഥം ‘സഹോദരന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: അറിയിച്ചു
  rationale: ἀπαγγέλλω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിപ്രയോഗം യേശുവിന് ഒരു വിവരം എത്തിക്കപ്പെട്ടതായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ അനിശ്ചിതകർത്തൃപ്രയോഗമായ ‘അറിയിച്ചു’ അതിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; ‘അപ്പോൾ’ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: ദത്തിവ് രൂപത്തിലുള്ള പരോക്ഷകർമത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: μήτηρ
  choice: അമ്മ
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സാധാരണ പദം.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പദം പുല്ലിംഗ ബഹുവചനമാണ്; ഈ വാക്യത്തിൽ വ്യാഖ്യാനപരമായ വിപുലീകരണം കൂടാതെ അതിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു.
- source_word: ἑστήκασιν
  choice: നിൽക്കുന്നു
  rationale: ἵστημι എന്ന ക്രിയയുടെ പൂർണകാലരൂപത്തിന് ഇവിടെ ഇപ്പോഴുള്ള അവസ്ഥയുടെ ബലമാണ്; ‘നിൽക്കുന്നു’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔξω
  choice: പുറത്ത്
  rationale: സ്ഥലസൂചക ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ; മൂലത്തിൽ ഇല്ലാത്ത ‘വീടിന്’ പോലുള്ള വിവരം ചേർക്കുന്നില്ല.
- source_word: ἰδεῖν
  choice: കാണാൻ
  rationale: ὁράω എന്നതിന്റെ അടിസ്ഥാന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘കണ്ടുമുട്ടാൻ’ അല്ലെങ്കിൽ ‘സംസാരിക്കാൻ’ എന്ന വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: θέλοντες
  choice: ആഗ്രഹിച്ച്
  rationale: അമ്മയെയും സഹോദരന്മാരെയും വിശേഷിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ സമകാലിക ഉദ്ദേശ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള ബന്ധത്തിൽ ‘സഹോദരന്മാർ’ എന്നതിന്റെ സൂചന
  choice: ἀδελφοί എന്നത് വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ ‘സഹോദരന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ബന്ധുക്കൾ
  rationale: ഈ പദത്തിന് വിശാലമായ കുടുംബബന്ധം സൂചിപ്പിക്കാനാകുമെങ്കിലും സാധാരണ അർഥം ‘സഹോദരന്മാർ’ എന്നാണ്. യേശുവിന്റെ കുടുംബബന്ധത്തെക്കുറിച്ചുള്ള പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ മൂലപാഠത്തിന്റെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും മൂലത്തിലെ വിവരം, സ്ഥലം, ഉദ്ദേശ്യം എന്നിവ മാറ്റമില്ലാതെ സൂക്ഷിച്ചു.
