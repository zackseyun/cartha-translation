id: LUK.8.46
reference: Luke 8:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു പറഞ്ഞു: “ആരോ എന്നെ തൊട്ടു; എന്നിൽനിന്ന് ശക്തി പുറപ്പെട്ടുപോയെന്ന് ഞാൻ അറിഞ്ഞു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: ആരോ എന്നെ തൊട്ടു
  rationale: അനിശ്ചിത സർവനാമമായ τις എന്നതും ἅπτομαι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔγνων
  choice: ഞാൻ അറിഞ്ഞു
  rationale: അറിയുക/തിരിച്ചറിയുക എന്ന അടിസ്ഥാന അർഥം സംരക്ഷിക്കുന്നു; വെറും അനുമാനമോ അനുഭവമോ എന്നു ചുരുക്കുന്നില്ല.
- source_word: δύναμιν
  choice: ശക്തി
  rationale: δύναμις എന്ന പദത്തിന്റെ സാധാരണ അർഥവും ഈ സൗഖ്യദാനസന്ദർഭത്തിലെ പ്രാബല്യവും നിലനിർത്തുന്നു.
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: എന്നിൽനിന്ന് ശക്തി പുറപ്പെട്ടുപോയെന്ന്
  rationale: പൂർണകാല കൃതന്തം സൂചിപ്പിക്കുന്ന, പുറപ്പെട്ടുപോയി എന്ന നിലയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ അറിവിന്റെ സ്വഭാവം
  choice: ഞാൻ അറിഞ്ഞു
  alternative: ഞാൻ മനസ്സിലാക്കി / എനിക്ക് അനുഭവപ്പെട്ടു
  rationale: ἔγνων എന്ന പദം പറയുന്നതിലപ്പുറം അറിവ് ലഭിച്ച രീതി നിർവചിക്കാതെ, വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: ശക്തി യേശുവിൽനിന്ന് പുറപ്പെടുന്നത്
  choice: എന്നിൽനിന്ന് ശക്തി പുറപ്പെട്ടുപോയെന്ന്
  alternative: എന്റെ ശക്തി പുറത്തേക്കു പ്രവഹിച്ചതായി
  rationale: മൂലപാഠത്തിലെ ലളിതമായ പ്രസ്താവന നിലനിർത്തുന്നു; ശക്തി സ്വയമേവയോ ബോധപൂർവമോ പ്രവർത്തിച്ചു എന്ന ചോദ്യം അധികമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഉദ്ധരണിക്കുള്ളിൽ നേരിട്ടും ലളിതവുമായ വാക്യഘടന ഉപയോഗിച്ചു.
