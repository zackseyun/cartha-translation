  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπήγγειλαν δὲ ⸀αὐτοῖς οἱ ἰδόντες πῶς ἐσώθη ὁ δαιμονισθείς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: ml
  text: സംഭവം കണ്ടവർ, ഭൂതബാധിതനായിരുന്ന മനുഷ്യൻ എങ്ങനെ രക്ഷിക്കപ്പെട്ടു[a] എന്ന് അവരോടു വിവരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂതബാധിതനായിരുന്ന മനുഷ്യൻ എങ്ങനെ സൗഖ്യം പ്രാപിച്ചു’ അല്ലെങ്കിൽ ‘എങ്ങനെ വിടുവിക്കപ്പെട്ടു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് രക്ഷിക്കുക, സൗഖ്യമാക്കുക, വിടുവിക്കുക എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: വിവരിച്ചു
  rationale: ἀπαγγέλλω എന്ന ക്രിയ ഇവിടെ കണ്ട സംഭവത്തെ മറ്റുള്ളവരോടു അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിവരിച്ചു’ എന്നത് ദൃക്സാക്ഷികളുടെ റിപ്പോർട്ട് എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: δέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിലെ വാക്യപ്രവാഹം തന്നെ ഈ ബന്ധം വ്യക്തമാക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്ന വിരുദ്ധഭാവമോ നിർബന്ധിതമായ ‘അപ്പോൾ’ എന്നോ ചേർത്തിട്ടില്ല.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: റിപ്പോർട്ട് സ്വീകരിച്ചവരെ സൂചിപ്പിക്കുന്ന ദത്തിവ് സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: οἱ ἰδόντες
  choice: സംഭവം കണ്ടവർ
  rationale: ഈ വിശേഷണാത്മക കൃദന്തരൂപം സംഭവത്തിന്റെ ദൃക്സാക്ഷികളെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ നേരിട്ടുള്ള കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി മുൻസംഭവത്തെ ‘സംഭവം’ എന്നു സൂചിപ്പിച്ചു.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: നടന്ന കാര്യത്തിന്റെ രീതിയെയോ സംഭവവിവരത്തെയോ അവതരിപ്പിക്കുന്ന πῶς എന്ന പദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἐσώθη
  choice: രക്ഷിക്കപ്പെട്ടു
  rationale: σῴζω എന്ന ക്രിയയ്ക്ക് രക്ഷിക്കുക, സൗഖ്യമാക്കുക, വിടുവിക്കുക എന്നീ അർത്ഥവ്യാപ്തിയുണ്ട്. ‘രക്ഷിക്കപ്പെട്ടു’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; സന്ദർഭോചിതമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὁ δαιμονισθείς
  choice: ഭൂതബാധിതനായിരുന്ന മനുഷ്യൻ
  rationale: പുരുഷ ഏകവചനത്തിലുള്ള substantival participle ഒരു മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്. perfect/passive രൂപത്തിലെ മുൻകാല അവസ്ഥയും ഇപ്പോൾ അതിൽനിന്നുള്ള മാറ്റവും ‘ആയിരുന്ന’ വ്യക്തമാക്കുന്നു; ‘ഭൂതബാധിതൻ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമാണ്.
theological_decisions:
- issue: ഭൂതബാധയിൽനിന്നുള്ള പുനഃസ്ഥാപനത്തിന്റെ സന്ദർഭത്തിൽ ἐσώθη (σῴζω) എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: രക്ഷിക്കപ്പെട്ടു
  alternative: സൗഖ്യം പ്രാപിച്ചു; വിടുവിക്കപ്പെട്ടു
  rationale: σῴζω ശാരീരിക സൗഖ്യം, അപകടത്തിൽനിന്നോ ബന്ധനത്തിൽനിന്നോ വിടുതൽ, വിശാലമായ രക്ഷ എന്നിവ സൂചിപ്പിക്കാം. പ്രധാന പാഠത്തിലെ ‘രക്ഷിക്കപ്പെട്ടു’ ഈ അർത്ഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സന്ദർഭത്തിന് യോജിക്കുന്ന മറ്റു വായനകൾ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഭൂതബാധിതനായിരുന്ന’ എന്ന രൂപം മുൻകാല അവസ്ഥ വ്യക്തമാക്കുന്നു; ‘രക്ഷിക്കപ്പെട്ടു’ എന്ന പദത്തിന്റെ യഥാർഥ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
