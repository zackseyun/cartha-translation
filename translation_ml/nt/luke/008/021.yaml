id: LUK.8.21
reference: Luke 8:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു: “എന്റെ അമ്മയും സഹോദരന്മാരും[a]—ദൈവത്തിന്റെ വചനം കേൾക്കുകയും അതു പ്രാവർത്തികമാക്കുകയും ചെയ്യുന്നവർ—ഇവരാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരീസഹോദരന്മാർ.” ഗ്രീക്കിൽ വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ “സഹോദരന്മാർ” എന്നാണ്; എന്നാൽ ഈ പ്രസ്താവനയുടെ പ്രയോഗം പുരുഷന്മാരിൽ മാത്രം ഒതുങ്ങണമെന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “എന്റെ അമ്മയും സഹോദരന്മാരും ദൈവത്തിന്റെ വചനം കേൾക്കുകയും അതു പ്രാവർത്തികമാക്കുകയും ചെയ്യുന്നവരാണ്.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘മറുപടി നൽകി പറഞ്ഞു’ എന്ന ഇരട്ട പ്രയോഗത്തിന്റെ സ്വഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനരൂപം നൽകുന്നു.
- source_word: πρὸς αὐτούς
  choice: അവരോടു
  rationale: അഭിസംബോധിതരായ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: എന്റെ അമ്മയും സഹോദരന്മാരും
  rationale: ഏകവചനമായ ‘അമ്മ’യും വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ ἀδελφοίയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; വിപുലമായ പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὗτοί εἰσιν
  choice: ഇവരാണ്
  rationale: οὗτοι എന്ന സമീപസൂചക സർവനാമത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ ... ἀκούοντες καὶ ποιοῦντες
  choice: കേൾക്കുകയും അതു പ്രാവർത്തികമാക്കുകയും ചെയ്യുന്നവർ
  rationale: വർത്തമാനകാല കൃദന്തരൂപങ്ങൾ സൂചിപ്പിക്കുന്ന പതിവായ സ്വഭാവവും കേൾക്കലും ചെയ്യലും തമ്മിലുള്ള സമാന്തരതയും വ്യക്തമാക്കുന്നു. ‘പ്രാവർത്തികമാക്കുക’ എന്നത് കേട്ട വചനം പ്രവർത്തിയിൽ കൊണ്ടുവരുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: ജനപ്രിയവും ദൈവശാസ്ത്രപരമായ അനുരണനം നിലനിർത്തുന്നതുമായ നേരിട്ടുള്ള പരിഭാഷ; ദൈവത്തിൽനിന്നുള്ള സന്ദേശം/അരുളപ്പാട് എന്ന അർഥവും വഹിക്കുന്നു.
theological_decisions:
- issue: യേശു പുതുതായി നിർവചിക്കുന്ന കുടുംബത്തിന്റെ വ്യാപ്തി
  choice: ദൈവത്തിന്റെ വചനം കേട്ട് പ്രാവർത്തികമാക്കുന്നവരെ യേശു തന്റെ അമ്മയും സഹോദരന്മാരുമായി തിരിച്ചറിയുന്നു; ജൈവിക കുടുംബത്തെ തള്ളിക്കളയുന്നതായി വാചകം കൂട്ടിച്ചേർക്കുന്നില്ല.
  alternative: യേശു തന്റെ ജൈവിക കുടുംബത്തെ പൂർണമായി നിരാകരിക്കുന്നു; അല്ലെങ്കിൽ പുരുഷശിഷ്യന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നു.
  rationale: വാക്യം ദൈവവചനത്തോടുള്ള പ്രതികരണത്തെ അടിസ്ഥാനമാക്കി കുടുംബബന്ധത്തിന്റെ പരിധി വികസിപ്പിക്കുന്നു. എന്നാൽ മറിയയെയോ യേശുവിന്റെ ബന്ധുക്കളെയോ നിരാകരിക്കുന്നു എന്ന് മൂലവാചകം പ്രസ്താവിക്കുന്നില്ല; ἀδελφοίയുടെ രൂപവും അതിന്റെ സാധ്യതയുള്ള വിപുലമായ പ്രയോഗവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഇവരാണ്’ എന്ന രൂപം മൂലത്തിലെ സൂചക ഊന്നൽ നിലനിർത്തുന്നു; ദീർഘവാക്യത്തിന്റെ തിരിച്ചറിയൽഘടന വ്യക്തമാക്കാൻ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
