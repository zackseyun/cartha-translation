  source_fidelity: 'The Malayalam accurately represents all three coordinated Greek actions: her spirit returned, she rose immediately, and he gave an instruction that she be given something to eat. ‘അവളുടെ ആത്മാവ് മടങ്ങിവന്നു’ suitably renders τὸ πνεῦμα αὐτῆς while retaining the lexical alternative in a footnote. ‘ഉടനെ എഴുന്നേറ്റു’ conveys both ἀνέστη and παραχρῆμα, and ‘അവൾക്കു ഭക്ഷിക്കാൻ എന്തെങ്കിലും കൊടുക്കണമെന്ന് അവൻ നിർദേശിച്ചു’ explicitly preserves φαγεῖν as well as the directive expressed by διέταξεν.'
