id: LUK.8.55
reference: Luke 8:55
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: ml
  text: അവളുടെ ആത്മാവ് മടങ്ങിവന്നു[a]; അവൾ ഉടനെ എഴുന്നേറ്റു. അവൾക്കു ഭക്ഷിക്കാൻ എന്തെങ്കിലും കൊടുക്കണമെന്ന് അവൻ നിർദേശിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളുടെ ശ്വാസം മടങ്ങിവന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: മടങ്ങിവന്നു
  rationale: ജീവൻ പുനഃസ്ഥാപിക്കപ്പെടുന്ന ഈ സന്ദർഭത്തിൽ ‘തിരികെ വന്നു’ എന്ന concrete ആശയം സ്വാഭാവികമായി നൽകുന്നു; അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: അവളുടെ ആത്മാവ്
  rationale: πνεῦμα എന്നതിന് ‘ആത്മാവ്’ എന്നും ‘ശ്വാസം’ എന്നും അർഥസാധ്യതയുണ്ട്. മരണത്തിൽനിന്നുള്ള പുനരുജ്ജീവനത്തിന്റെ സന്ദർഭത്തിൽ ‘ആത്മാവ്’ പ്രധാന പാഠത്തിൽ യോജിക്കുന്നു; ‘ശ്വാസം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀνέστη
  choice: എഴുന്നേറ്റു
  rationale: ശരീരമായി ഉയർന്ന് എഴുന്നേൽക്കുന്ന പ്രവർത്തിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: παραχρῆμα
  choice: ഉടനെ
  rationale: സംഭവത്തിന്റെ തൽക്ഷണത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διέταξεν
  choice: നിർദേശിച്ചു
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന ആശയം നിലനിർത്തുന്നു; മലയാളത്തിൽ അനാവശ്യമായി പരുഷമായ ഭാവം വരുത്തുന്നില്ല.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: അവൾക്കു ഭക്ഷിക്കാൻ എന്തെങ്കിലും കൊടുക്കണമെന്ന്
  rationale: δοθῆναι എന്ന നിഷ്ക്രിയ ക്രിയയും φαγεῖν എന്ന ‘ഭക്ഷിക്കുക’ എന്ന വ്യക്തമായ ആശയവും സ്വാഭാവിക മലയാളത്തിൽ പൂർണമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: പുനരുജ്ജീവനസന്ദർഭത്തിലെ πνεῦμα എന്ന പദത്തിന്റെ അർഥം
  choice: അവളുടെ ആത്മാവ് മടങ്ങിവന്നു
  alternative: അവളുടെ ശ്വാസം മടങ്ങിവന്നു
  rationale: ‘ആത്മാവ്’ എന്നത് ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ അർഥപരിധിയും ആഖ്യാനത്തിലെ ദൈവശാസ്ത്രപരമായ ഗൗരവവും നിലനിർത്തുന്നു. എന്നാൽ പദത്തെ ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കാൻ ‘ശ്വാസം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ മൂന്ന് ഘടകങ്ങളും വ്യക്തമായ വാക്യക്രമത്തിൽ നിലനിർത്തിയിരിക്കുന്നു. ‘ഭക്ഷിക്കാൻ എന്തെങ്കിലും കൊടുക്കുക’ എന്ന പ്രയോഗം φαγεῖν എന്ന ക്രിയയെ തുറന്നുപറയുകയും സ്വാഭാവിക മലയാളശൈലി പാലിക്കുകയും ചെയ്യുന്നു.
