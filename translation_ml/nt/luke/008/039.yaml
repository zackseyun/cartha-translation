  to: “നിന്റെ വീട്ടിലേക്കു മടങ്ങിപ്പോകുക; ദൈവം നിനക്കുവേണ്ടി ചെയ്തതെല്ലാം വിവരിച്ചുപറയുക.” അവൻ പോയി, യേശു തനിക്കുവേണ്ടി ചെയ്തതെല്ലാം നഗരമെങ്ങും പ്രഖ്യാപിച്ചുകൊണ്ടിരുന്നു.
