id: LUK.8.39
reference: Luke 8:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: ml
  text: “നിന്റെ വീട്ടിലേക്കു മടങ്ങിപ്പോകുക; ദൈവം നിനക്കുവേണ്ടി ചെയ്തതെല്ലാം വിവരിച്ചുപറയുക.” അവൻ പോയി, യേശു തനിക്കുവേണ്ടി ചെയ്തതെല്ലാം നഗരമെങ്ങും പ്രഖ്യാപിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: മടങ്ങിപ്പോയി
  rationale: മുമ്പുണ്ടായിരുന്ന സ്ഥലത്തേക്കു തിരികെ പോകാനുള്ള നേരിട്ടുള്ള കല്പനയെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς τὸν οἶκόν σου
  choice: നിന്റെ വീട്ടിലേക്കു
  rationale: εἰς എന്ന ദിശാസൂചക പ്രയോഗവും οἶκος എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ സ്ഥലാർഥവും നിലനിർത്തുന്നു.
- source_word: διηγοῦ
  choice: വിവരിച്ചുപറയുക
  rationale: സംഭവിച്ചത് കേവലം പറയുക എന്നതിലുപരി വിവരിച്ചു recount ചെയ്യുക എന്ന διηγέομαι-യുടെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: ദൈവം നിനക്കുവേണ്ടി ചെയ്തതെല്ലാം
  rationale: ὅσα എന്നതിനെ ‘ചെയ്തതെല്ലാം’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി; മൂലപാഠത്തിലില്ലാത്ത ‘വലിയ കാര്യങ്ങൾ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: ἀπῆλθεν
  choice: അവൻ പോയി
  rationale: രംഗത്തിൽനിന്നുള്ള പുറപ്പെടൽ സന്ദർഭത്തിൽ വ്യക്തമാണ്; മലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: നഗരം മുഴുവൻ
  rationale: κατάയുടെ വിതരണാത്മക അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: κηρύσσων
  choice: പരസ്യമായി അറിയിച്ചുകൊണ്ടിരുന്നു
  rationale: പൊതുവായി വിളംബരം ചെയ്യുക എന്ന κηρύσσω-യുടെ ശക്തി നിലനിർത്തുന്നു; ഔപചാരിക പ്രസംഗത്തിന്റെ അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: യേശു തനിക്കുവേണ്ടി ചെയ്തതെല്ലാം
  rationale: ആദ്യ ഉപവാക്യവുമായി ലൂക്കോസ് സൃഷ്ടിക്കുന്ന സമാന്തരത നിലനിർത്തുകയും αὐτῷ എന്നത് കർത്താവായ മനുഷ്യനിലേക്കുതന്നെ തിരികെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ കല്പനയിലെ ‘ദൈവം’ എന്നും മനുഷ്യന്റെ പ്രഖ്യാപനത്തിലെ ‘യേശു’ എന്നും ഉള്ള സമാന്തരത
  choice: ആദ്യ ഭാഗത്ത് ‘ദൈവം’, രണ്ടാം ഭാഗത്ത് ‘യേശു’ എന്നു മൂലപാഠപ്രകാരം നിലനിർത്തി.
  alternative: രണ്ടിടത്തും ‘ദൈവം’ എന്നോ രണ്ടിടത്തും ‘യേശു’ എന്നോ ഏകീകരിക്കുക; അല്ലെങ്കിൽ വ്യാഖ്യാനപരമായ വിശദീകരണം ചേർക്കുക.
  rationale: ലൂക്കോസ് വിശദീകരണമില്ലാതെ സ്ഥാപിക്കുന്ന ദൈവം–യേശു സമാന്തരതയും അതിലെ ദൈവശാസ്ത്രപരമായ ശക്തിയും പരിഭാഷ വ്യാഖ്യാനിച്ച് തീർക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വിവരിച്ചുപറയുക’ സ്വകാര്യമായി വിശദീകരിക്കുന്ന കല്പനയെയും ‘പരസ്യമായി അറിയിച്ചുകൊണ്ടിരുന്നു’ പൊതുഘോഷണത്തെയും വേർതിരിക്കുന്നു. മൂലപാഠത്തിൽ പ്രകടമല്ലാത്ത ‘വലിയ കാര്യങ്ങൾ’ ചേർത്തിട്ടില്ല.
