id: LUK.8.2
reference: Luke 8:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: ml
  text: 'ദുഷ്ടാത്മാക്കളിൽനിന്നും രോഗങ്ങളിൽനിന്നും സൗഖ്യം ലഭിച്ചിരുന്ന ചില സ്ത്രീകളും അവനോടുകൂടെ ഉണ്ടായിരുന്നു: മഗ്ദലക്കാരി എന്നു വിളിക്കപ്പെട്ട മറിയം—അവളിൽനിന്ന് ഏഴ് ഭൂതങ്ങൾ പുറത്തുപോയിരുന്നു—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: ചില സ്ത്രീകൾ
  rationale: τινες ബഹുവചന നാമത്തോടൊപ്പം അനിശ്ചിതമായ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘ചില സ്ത്രീകൾ’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: τεθεραπευμέναι
  choice: സൗഖ്യം പ്രാപിച്ചിരുന്ന
  rationale: ἦσαν എന്ന ക്രിയയോടുചേർന്ന perfect passive participle, മുമ്പ് സംഭവിച്ച സൗഖ്യവും അതിന്റെ തുടരുന്ന ഫലവും സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: ദുരാത്മാക്കളിൽനിന്നും
  rationale: πονηρός ‘ദുഷ്ടമായ/തിന്മയുള്ള’ എന്നർഥം നൽകുന്നു; ἀκάθαρτος അല്ലാത്തതിനാൽ ‘അശുദ്ധാത്മാക്കൾ’ എന്ന് മാറ്റുന്നില്ല.
- source_word: καὶ ἀσθενειῶν
  choice: രോഗങ്ങളിൽനിന്നും
  rationale: ἀσθένεια ഇവിടെ രോഗം അഥവാ ശാരീരിക ദൗർബല്യം സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് ‘രോഗങ്ങൾ’ വ്യക്തമാണ്.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: മഗ്ദലക്കാരി എന്നു വിളിക്കപ്പെട്ട
  rationale: καλουμένη മറിയത്തെ ‘മഗ്ദലക്കാരി’ എന്ന വിശേഷണത്താൽ തിരിച്ചറിയിക്കുന്നു; ഈ രൂപം സ്ഥലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀφ’ ἧς
  choice: അവളിൽനിന്ന്
  rationale: ἀπό വേർപാട് അഥവാ ഉറവിടം അടയാളപ്പെടുത്തുന്നു; ‘അവളിൽനിന്ന്’ അതിനെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: δαιμόνια ἑπτὰ
  choice: ഏഴ് ഭൂതങ്ങൾ
  rationale: δαιμόνια ഭൂതങ്ങളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; മുമ്പുള്ള പൊതുവായ πνεύματα എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: ἐξεληλύθει
  choice: പുറത്തുപോയിരുന്നു
  rationale: ἐξέρχομαι എന്നതിന്റെ pluperfect രൂപം, കഥാസമയത്തിനു മുമ്പേ അവ പുറത്തുപോയിക്കഴിഞ്ഞിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദുരാത്മബാധയെ സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: ‘ദുരാത്മാക്കൾ’, ‘ഭൂതങ്ങൾ’ എന്നീ വ്യക്തിസ്വഭാവമുള്ള പദങ്ങൾ നിലനിർത്തി.
  alternative: മാനസികമോ ശാരീരികമോ ആയ രോഗങ്ങളുടെ രൂപകമായി വ്യാഖ്യാനിക്കൽ.
  rationale: ഗ്രീക്ക് പാഠം πνευμάτων πονηρῶν, δαιμόνια എന്നിവയെ ἀσθενειῶν എന്ന രോഗങ്ങളിൽനിന്ന് വേർതിരിക്കുന്നു; പരിഭാഷ ആ വ്യത്യാസം വ്യാഖ്യാനാത്മക കൂട്ടിച്ചേർക്കലില്ലാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിലെ ക്രിയയുടെ തുടർച്ചയായതിനാൽ സ്വാഭാവികതയ്ക്കായി ‘അവരോടൊപ്പം ഉണ്ടായിരുന്നു’ എന്നു പൂർത്തീകരിച്ചു; അവസാനം വരുന്ന ഡാഷ് തുടർന്നുള്ള പട്ടികയിലേക്കുള്ള വാക്യബന്ധം സൂചിപ്പിക്കുന്നു.
