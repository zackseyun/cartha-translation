id: LUK.8.17
reference: Luke 8:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: ml
  text: എന്തെന്നാൽ, മറഞ്ഞിരിക്കുന്നതൊന്നും വെളിപ്പെടാതെ ഇരിക്കുകയില്ല[a]; രഹസ്യമായിരിക്കുന്നതൊന്നും അറിയപ്പെടാതെയും വെളിച്ചത്തുവരാതെയും ഇരിക്കുകയില്ല[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പ്രകടമാകാതെ ഇരിക്കുകയില്ല.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘തീർച്ചയായും അറിയപ്പെടും’; രഹസ്യമായതൊന്നും അജ്ഞാതമായി തുടരുകയില്ലെന്ന് ഗ്രീക്ക് ഘടന ശക്തമായി നിഷേധിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ, ‘പരസ്യമായി വരിക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸν
  choice: മറഞ്ഞിരിക്കുന്നത്
  rationale: κρυπτός എന്നത് മറഞ്ഞതോ മറച്ചുവെച്ചതോ ആയതിനെ സൂചിപ്പിക്കുന്നു. ‘മറഞ്ഞിരിക്കുന്നത്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും തുടർന്നുള്ള വെളിപ്പെടലിനോട് വ്യക്തമായ വൈരുധ്യം സൃഷ്ടിക്കുന്നതുമാണ്.
- source_word: φανερὸν γενήσεται
  choice: വെളിപ്പെടാതിരിക്കുകയില്ല
  rationale: φανερός-നും κρυπτός-നും ഇടയിലെ വൈരുധ്യവും γίνομαι സൂചിപ്പിക്കുന്ന അവസ്ഥാമാറ്റവും ഈ പ്രയോഗം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ നിഷേധാത്മക ആപേക്ഷിക ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ഇരട്ടനിഷേധത്തിലൂടെ പുനരാവിഷ്കരിച്ചു.
- source_word: ἀπόκρυφον
  choice: രഹസ്യമായിരിക്കുന്നത്
  rationale: ആദ്യ ഉപവാക്യത്തിലെ κρυπτόν എന്നതിൽനിന്നുള്ള നേരിയ പദവ്യത്യാസം നിലനിർത്തിക്കൊണ്ട്, ഒളിപ്പിക്കപ്പെട്ടതോ രഹസ്യമായതോ എന്ന അർഥം നൽകുന്നു.
- source_word: οὐ μὴ γνωσθῇ
  choice: അറിയപ്പെടാതിരിക്കുകയോ … ഇല്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധം, രഹസ്യമായത് അജ്ഞാതമായി തുടരുകയില്ല എന്ന ആശയം നൽകുന്നു. മലയാളത്തിലെ ഈ ഘടന ആ ഉറപ്പിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: വെളിച്ചത്തുവരുക
  rationale: പരസ്യമായി വെളിപ്പെടുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം, മലയാളത്തിലെ പരിചിതവും ഗൗരവമുള്ളതുമായ ‘വെളിച്ചത്തുവരുക’ എന്ന ശൈലി നൽകുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിന് കാരണമോ വിശദീകരണമോ നൽകുന്ന γάρ-ന്റെ ബന്ധകശക്തി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വെളിപ്പെടുത്തലിനെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: മറഞ്ഞതും രഹസ്യമായതും ഒടുവിൽ വെളിപ്പെടുമെന്ന പൊതുതത്ത്വമായി വിശാലമായ ഭാഷ നിലനിർത്തി.
  alternative: ഇത് അന്ത്യന്യായവിധിയിലെ വെളിപ്പെടുത്തലിനെ മാത്രം സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ യേശുവിന്റെ ഉപദേശത്തിന്റെ വെളിപ്പെടുത്തലിനെയും അതിനോടുള്ള പ്രതികരണത്തെയും മാത്രം സൂചിപ്പിക്കുന്നു.
  rationale: വാക്യം വെളിപ്പെടുത്തലിന്റെ കൃത്യമായ കാലപരിധിയോ പ്രത്യേക പ്രയോഗമോ നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ പരിഭാഷ അതിനെ ഒരു പ്രത്യേക ദൈവശാസ്ത്രപരമായ സാഹചര്യത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. സമാന്തരമായ രണ്ടു ഉപവാക്യങ്ങളിലെ ‘മറഞ്ഞിരിക്കുന്നത്/രഹസ്യമായിരിക്കുന്നത്’ എന്ന പദവ്യത്യാസവും ഭാവിയിലെ വെളിപ്പെടുത്തലിന്റെ ഉറപ്പും നിലനിർത്തി.
