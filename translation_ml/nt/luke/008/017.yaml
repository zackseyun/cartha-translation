  terminology: ‘മറഞ്ഞിരിക്കുന്നതും’ and ‘രഹസ്യമായിരിക്കുന്നതും’ appropriately retain the slight lexical distinction without overstating it. ‘വെളിച്ചത്തുവരുക’ is a natural modern Malayalam rendering of εἰς φανερὸν ἔλθῃ. Footnote c requires correction because its proposed alternative is malformed and does not clearly supply the intended positive lexical alternative.
