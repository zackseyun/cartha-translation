reference: Luke 1:80
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: ml
  text: ആ ശിശു വളർന്നുകൊണ്ടിരുന്നു; ആത്മാവിൽ ശക്തിപ്രാപിച്ചുകൊണ്ടുമിരുന്നു.[a] ഇസ്രായേലിന്റെ മുമ്പാകെ അവൻ പൊതുവായി പ്രത്യക്ഷപ്പെടുന്ന ദിവസംവരെ അവൻ വിജനപ്രദേശങ്ങളിൽ പാർത്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മാവിൽ’ എന്നത് അന്തരംഗമോ ആത്മീയമോ ആയ ശക്തിയെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ പരിശുദ്ധാത്മാവുമായുള്ള ബന്ധത്തിൽ ശക്തിപ്രാപിച്ചതിനെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വിജനപ്രദേശങ്ങളിൽ’; ഗ്രീക്കിൽ ബഹുവചനമാണ്. ‘മരുഭൂമിയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: ശിശു
  rationale: യോഹന്നാന്റെ ബാല്യത്തെ സൂചിപ്പിക്കുന്ന വിശാലമായ പദം; പ്രായഘട്ടം അനാവശ്യമായി കൃത്യമാക്കുന്നില്ല.
- source_word: ηὔξανε
  choice: വളർന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപത്തിലെ തുടർച്ചയായ വളർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐκραταιοῦτο
  choice: ശക്തനായിത്തീർന്നുകൊണ്ടുമിരുന്നു
  rationale: തുടർന്നുകൊണ്ടിരുന്ന ശക്തിപ്രാപിക്കൽ സൂചിപ്പിക്കുകയും ക്രിയയെ കർത്തരി/കർമണി എന്നിങ്ങനെ അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πνεύματι
  choice: ആത്മാവിൽ
  rationale: ദാതിവ് രൂപം സൂചിപ്പിക്കുന്ന മേഖല/ബന്ധം നിലനിർത്തുന്നു; മനുഷ്യന്റെ അന്തരാത്മാവോ പരിശുദ്ധാത്മാവുമായുള്ള ബന്ധമോ എന്ന സന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: ἐν ταῖς ἐρήμοις
  choice: വിജനപ്രദേശങ്ങളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനവും ജനവാസമില്ലാത്ത പ്രദേശങ്ങൾ എന്ന വിശാല അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀναδείξεως
  choice: വെളിപ്പെടുന്ന
  rationale: പൊതുജനമധ്യേ പ്രത്യക്ഷപ്പെടുകയോ പരസ്യമായി വെളിപ്പെടുത്തപ്പെടുകയോ ചെയ്യുന്നതെന്ന ആശയം ലളിതമായി നൽകുന്നു; കർത്തരി/കർമണി ഭാവം കൃത്രിമമായി തീർപ്പാക്കുന്നില്ല.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: ഇസ്രായേലിനു
  rationale: യോഹന്നാന്റെ വെളിപ്പെടലിന്റെ അഭിമുഖസമൂഹം ഇസ്രായേലാണെന്ന് സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാൻ ശക്തനായിത്തീർന്നത് πνεύματι എന്നതിൽ ആരെയോ എന്തിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ആത്മാവിൽ
  alternative: പരിശുദ്ധാത്മാവിൽ; അന്തരാത്മാവിൽ
  rationale: ഗ്രീക്ക് പദത്തിന് നിർദിഷ്ട ഉപപദമില്ല; അതിനാൽ പരിശുദ്ധാത്മാവിനെ മാത്രം ഉദ്ദേശിക്കുന്നുവെന്നോ മനുഷ്യന്റെ അന്തരാത്മാവിനെ മാത്രം ഉദ്ദേശിക്കുന്നുവെന്നോ മുഖ്യവാചകം തീർപ്പാക്കുന്നില്ല.
- issue: ἀνάδειξις എന്നതിലെ പൊതുപ്രത്യക്ഷതയും വെളിപ്പെടുത്തപ്പെടലും
  choice: ഇസ്രായേലിനു വെളിപ്പെടുന്ന ദിവസം
  alternative: ഇസ്രായേലിന്റെ മുമ്പാകെ പരസ്യമായി പ്രത്യക്ഷപ്പെടുന്ന ദിവസം
  rationale: യോഹന്നാന്റെ പൊതുവായ അരങ്ങേറ്റം എന്ന അർഥം നൽകുമ്പോഴും ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്ന സ്വപ്രവർത്തനഭാവമോ ‘വെളിപ്പെടുത്തപ്പെട്ടു’ എന്ന കർമണിഭാവമോ അതിരുകടന്ന് ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. തുടർച്ച സൂചിപ്പിക്കുന്ന രണ്ട് അപൂർണ ഭൂതകാലക്രിയകളും നിലനിർത്തി. ഗ്രീക്കിലെ ബഹുവചനം ‘വിജനപ്രദേശങ്ങളിൽ’ എന്നു സംരക്ഷിച്ചു; πνεύματι എന്നതിലെ ദൈവശാസ്ത്രപരമായ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
