revisions:
- from: ആ ശിശു വളർന്നുകൊണ്ടിരുന്നു; ആത്മാവിൽ ശക്തനായിത്തീർന്നുകൊണ്ടുമിരുന്നു.[a] ഇസ്രായേലിനു വെളിപ്പെടുന്ന ദിവസംവരെ അവൻ വിജനപ്രദേശങ്ങളിൽ പാർത്തു.[b]
  to: ആ ശിശു വളർന്നുകൊണ്ടിരുന്നു; ആത്മാവിൽ ശക്തിപ്രാപിച്ചുകൊണ്ടുമിരുന്നു.[a] ഇസ്രായേലിന്റെ മുമ്പാകെ അവൻ പൊതുവായി പ്രത്യക്ഷപ്പെടുന്ന ദിവസംവരെ അവൻ വിജനപ്രദേശങ്ങളിൽ പാർത്തു.[b]
