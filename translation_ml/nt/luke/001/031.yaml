review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the attention marker, conception, birth of a male child, and the name Jesus. However, the future indicative καλέσεις is rendered as the imperative-like ‘പേരിടണം’ (‘must name’), which adds directive force not expressed by the Greek form. The future should be retained in the Malayalam main text.
  naturalness: ‘ഇതാ’ and the proposed coordinated future construction are natural, dignified modern standard Malayalam. ‘അവന് യേശു എന്നു പേരിടും’ is idiomatic and preserves the source tense.
  terminology: ‘ഗർഭം ധരിക്കുക,’ ‘ഒരു മകനെ പ്രസവിക്കുക,’ and ‘യേശു’ are accurate, established Malayalam choices. The alternative wording in the footnote may preserve the more form-near naming formula without displacing the natural main rendering.
  issues:
  - severity: medium
    issue: The main text renders καλέσεις with ‘പേരിടണം.’
    rationale: ‘പേരിടണം’ is obligatorily directive in Malayalam, whereas καλέσεις is formally future indicative (‘you will name/call’). Even in an annunciation context, the translation should not convert the grammatical form into an imperative-like obligation.
  revised_text: ഇതാ, നീ ഗർഭം ധരിക്കുകയും ഒരു മകനെ പ്രസവിക്കുകയും ചെയ്യും; അവന് യേശു എന്നു പേരിടും.[a]
