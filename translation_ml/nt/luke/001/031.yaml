id: LUK.1.31
reference: Luke 1:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: ml
  text: ഇതാ, നീ ഗർഭം ധരിക്കുകയും ഒരു മകനെ പ്രസവിക്കുകയും ചെയ്യും; അവന് യേശു എന്നു പേരിടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “നീ അവന്റെ പേര് യേശു എന്നു വിളിക്കും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരസൂചകത്തിന്റെ ശക്തിയും അറിയിപ്പിന്റെ ഗൗരവഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: നീ ഗർഭം ധരിച്ച്
  rationale: സന്ദർഭത്തിൽ ഈ ഗ്രീക്ക് പ്രയോഗം ഗർഭധാരണത്തെ സൂചിപ്പിക്കുന്നു. ‘ഗർഭത്തിൽ ഗർഭം ധരിക്കുക’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കി അർത്ഥം കൃത്യമായി നൽകുന്നു.
- source_word: τέξῃ υἱόν
  choice: ഒരു മകനെ പ്രസവിക്കും
  rationale: τίκτω എന്നതിന്റെ പ്രസവിക്കുക എന്ന അർത്ഥവും υἱός എന്നതിന്റെ ലിംഗനിർദിഷ്ടമായ ‘മകൻ’ എന്ന അർത്ഥവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: അവന് … എന്നു പേരിടണം
  rationale: ഗ്രീക്ക് ഭാവികാലം ഇവിടെ ദൈവിക നിർദേശത്തിന്റെ ശക്തിയോടെയുള്ള അറിയിപ്പായതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക നാമകരണപ്രയോഗം ഉപയോഗിച്ചു. കൂടുതൽ രൂപസാദൃശ്യമുള്ള പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: Ἰησοῦν
  choice: യേശു
  rationale: പുതിയനിയമത്തിലെ ഈ വ്യക്തിനാമത്തിന്റെ സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: καλέσεις എന്ന ഭാവികാല നാമകരണവാക്യത്തിന്റെ ശക്തി
  choice: അവന് യേശു എന്നു പേരിടണം
  alternative: നീ അവന്റെ പേര് യേശു എന്നു വിളിക്കും
  rationale: രൂപത്തിൽ ഭാവികാലമായിരുന്നാലും ദൂതന്റെ അറിയിപ്പിൽ ഇത് നാമകരണം ചെയ്യാനുള്ള നിർദേശവും ഉൾക്കൊള്ളുന്നു. മലയാളത്തിൽ ‘പേരിടണം’ ആ പ്രയോഗബലം സ്വാഭാവികമായി നൽകുന്നു; രൂപസാദൃശ്യമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ഇതാ’ എന്നത് പ്രഖ്യാപനത്തിന്റെ ശ്രദ്ധാകർഷകഭാവം നിലനിർത്തുന്നു; നാമകരണവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
