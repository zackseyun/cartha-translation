id: LUK.1.38
reference: Luke 1:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: ml
  text: 'മറിയ പറഞ്ഞു: “ഇതാ, ഞാൻ കർത്താവിന്റെ ദാസി[a]. അങ്ങയുടെ വാക്കുപോലെ എനിക്കു സംഭവിക്കട്ടെ[b].” ദൂതൻ അവളെ വിട്ടുപോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കർത്താവിന്റെ അടിമസ്ത്രീ.” ഗ്രീക്കിലെ δούλη എന്ന പദത്തിന് സ്ത്രീ അടിമയെയോ ദാസിയെയോ സൂചിപ്പിക്കാം; ഇവിടെ ദൈവത്തോടുള്ള വിനീതമായ സമർപ്പണത്തിന് ഊന്നൽ നൽകുന്നതിനാൽ പ്രധാന പാഠത്തിൽ “ദാസി” എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “അങ്ങയുടെ വചനപ്രകാരം എനിക്ക് ആകട്ടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: കഥയുടെ ഒഴുക്ക് ബന്ധിപ്പിക്കുന്ന മൃദുവായ സംയോജകമാണ്; സന്ദർഭത്തിലെ പ്രതികരണക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: മറിയയുടെ ഗൗരവപൂർണമായ സ്വയംസമർപ്പണത്തിന് ഊന്നൽ നൽകുന്ന അടയാളപ്പെടുത്തിയ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: δούλη
  choice: ദാസി
  rationale: സ്ത്രീലിംഗത്തിലുള്ള ദാസി/അടിമ എന്ന അർഥപരിധിയുണ്ട്. ഇവിടെ ദൈവത്തോടുള്ള വിനീതമായ സമർപ്പണമാണ് മുൻനിൽക്കുന്നത്; ബന്ധിതാവസ്ഥയുടെ ശക്തമായ ധ്വനി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: ദൈവിക സ്ഥാനനാമമായ κύριος-നെ മലയാളത്തിലെ സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിൽ നൽകുന്നു.
- source_word: γένοιτό μοι
  choice: എനിക്കു സംഭവിക്കട്ടെ
  rationale: സമ്മതത്തോടുകൂടിയ ആഗ്രഹം പ്രകടിപ്പിക്കുന്ന ഓപ്റ്റേറ്റീവ് ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: അങ്ങയുടെ വാക്കുപോലെ
  rationale: ദൂതൻ പറഞ്ഞ പ്രത്യേക അറിയിപ്പിനോടുള്ള അനുരൂപത വ്യക്തമാക്കുന്നു; ῥῆμα ഇവിടെ പറഞ്ഞ വാക്കിനെയോ സന്ദേശത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: അവളുടെ അടുക്കൽനിന്ന് പോയി
  rationale: ദൂതൻ അവളിൽനിന്ന് അകന്നുപോയെന്ന കഥാവസാനം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὁ ἄγγελος
  choice: ദൂതൻ
  rationale: ലൂക്കോസിന്റെ ബാല്യകാലവിവരണത്തിൽ ഇത് മനുഷ്യസന്ദേശവാഹകനെയല്ല, ദൈവദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: മറിയ സ്വയം വിശേഷിപ്പിക്കുന്ന δούλη എന്ന പദം
  choice: കർത്താവിന്റെ ദാസി
  alternative: കർത്താവിന്റെ അടിമസ്ത്രീ
  rationale: ഈ പദത്തിന് സ്ത്രീ അടിമയെയോ ദാസിയെയോ സൂചിപ്പിക്കാം. ഇവിടെ സാമൂഹിക അടിമത്തത്തേക്കാൾ ദൈവഹിതത്തോടുള്ള മറിയയുടെ വിനീതമായ സമർപ്പണമാണ് സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്; കൂടുതൽ ശക്തമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: γένοιτό μοι എന്നതിന്റെ ഭാവം
  choice: എനിക്കു സംഭവിക്കട്ടെ
  alternative: എനിക്ക് ആകട്ടെ
  rationale: ഇത് വെറും ഭാവികാലപ്രസ്താവനയല്ല; മറിയയുടെ സമ്മതത്തോടുകൂടിയ ആഗ്രഹമാണ് പ്രകടിപ്പിക്കുന്നത്. പ്രധാന പാഠം ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. “ഇതാ” എന്നത് മൂലപാഠത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ദൂതനോടുള്ള മാന്യമായ ഏകവചനസംബോധനയ്ക്ക് “അങ്ങയുടെ” ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
