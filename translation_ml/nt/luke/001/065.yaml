id: LUK.1.65
reference: Luke 1:65
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: ml
  text: അവർക്കു ചുറ്റും താമസിച്ചിരുന്ന എല്ലാവരുടെയുംമേൽ ഭയം[b] വന്നു. യെഹൂദ്യയിലെ മലനാട്ടിലെങ്ങും ആളുകൾ ഈ കാര്യങ്ങളെക്കുറിച്ചെല്ലാം[a] സംസാരിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഈ വാക്കുകളെക്കുറിച്ചെല്ലാം” അല്ലെങ്കിൽ “ഈ സംഭവങ്ങളെക്കുറിച്ചെല്ലാം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് പറഞ്ഞ വാക്കുകളെയോ സംസാരിക്കപ്പെടുന്ന സംഭവങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ഭയം” എന്നതിൽ ദൈവത്തിന്റെ പ്രകടമായ പ്രവർത്തനത്തോടുള്ള വിസ്മയവും ഭക്ത്യാദരവും ഉൾപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας ... φόβος
  choice: എല്ലാവരുടെയുംമേൽ ഭയം വന്നു
  rationale: ഭയം അവരെ ബാധിക്കാൻ തുടങ്ങിയെന്ന സംഭവാത്മക അർഥവും ഗ്രീക്കിലെ ‘മേൽ’ എന്ന ഘടനയും നിലനിർത്തുന്നു; ‘എല്ലാവരും ഭയപ്പെട്ടു’ എന്നതിനെക്കാൾ ഭയം/ഭക്ത്യാദരം എന്ന അർഥവ്യാപ്തി തുറന്നുവയ്ക്കുന്നു.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: അവരുടെ ചുറ്റും താമസിച്ചിരുന്ന എല്ലാവരും
  rationale: ‘അയൽക്കാർ’ എന്നു ചുരുക്കാതെ, അവർക്കു ചുറ്റുമോ സമീപത്തോ വസിച്ചിരുന്നവരെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സുതാര്യമായി നൽകുന്നു.
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: യെഹൂദ്യയിലെ മലനാട്ടിലെങ്ങും
  rationale: ὀρεινή എന്നത് മലനാട്/ഉയർന്ന പ്രദേശം എന്നും ἐν ὅλῃ എന്നത് ആ പ്രദേശമാകെ എന്നും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: διελαλεῖτο
  choice: ആളുകൾ ... സംസാരിച്ചുകൊണ്ടിരുന്നു
  rationale: ഗ്രീക്കിലെ അപൂർണ ഭൂതകാലവും പൊതുജനങ്ങൾക്കിടയിൽ തുടർന്നുകൊണ്ടിരുന്ന സംസാരവും സ്വാഭാവികമായ സജീവവാക്യത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: ഈ കാര്യങ്ങളെക്കുറിച്ചെല്ലാം
  rationale: ῥήματα ഇവിടെ വാക്കുകൾ, പറഞ്ഞ കാര്യങ്ങൾ, സംഭവങ്ങൾ എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളാം; സന്ദർഭത്തിൽ അവയെക്കുറിച്ചുള്ള സംസാരത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘കാര്യങ്ങൾ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ പ്രകടമായ പ്രവർത്തനത്തോടുള്ള പ്രതികരണമായി φόβος എന്നതിന്റെ അർഥഭാവം
  choice: ഭയം
  alternative: ഭക്ത്യാദരം; ഭയഭക്തി
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും ഇത് സാധാരണ ഭയമോ ദൈവിക പ്രവർത്തനത്തോടുള്ള വിസ്മയഭരിതമായ ഭയഭക്തിയോ എന്ന ആശയസംഘർഷം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ആദ്യ സംയോജകമായ καί മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തിക്കാതെ രണ്ട് സ്വാഭാവിക വാക്യങ്ങളാക്കി. രണ്ടാം ഭാഗത്തിലെ ഗ്രീക്ക് കർമണിപ്രയോഗം മലയാളത്തിലെ അസ്വാഭാവികമായ കർമണിരൂപം ഒഴിവാക്കാൻ പൊതുകർത്താവായ ‘ആളുകൾ’ ചേർത്ത് സജീവവാക്യമായി അവതരിപ്പിച്ചു.
