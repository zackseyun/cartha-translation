id: LUK.1.41
reference: Luke 1:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: ml
  text: എലിസബത്ത് മറിയയുടെ അഭിവാദനം കേട്ടപ്പോൾ, എലിസബത്തിന്റെ ഗർഭത്തിലെ കുഞ്ഞ് തുള്ളിച്ചാടി; എലിസബത്ത് പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനശൈലിയിലുള്ള ഈ സൂത്രപ്രയോഗത്തിന്റെ സംഭവപരമായ ആശയം സ്വാഭാവികമായ മലയാളത്തിലെ കാലവാക്യഘടനയിൽ ഉൾക്കൊള്ളുന്നു; ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് ഇവിടെ അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: ὡς
  choice: കേട്ടപ്പോൾ
  rationale: ഓറിസ്റ്റ് ക്രിയയോടുകൂടിയ ഈ പ്രയോഗം ഉടനെയുള്ള കാലബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-പ്പോൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἀσπασμός
  choice: അഭിവാദനം
  rationale: മറിയ പറഞ്ഞ വന്ദനവാക്കുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അഭിവാദനം’ ആധുനിക മാനക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ പദമാണ്.
- source_word: Μαρίας
  choice: മറിയയുടെ
  rationale: ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിയുടെ ഉടമസ്ഥബന്ധം സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: ἐσκίρτησεν
  choice: തുള്ളിച്ചാടി
  rationale: പെട്ടെന്നുള്ള സജീവചലനത്തിന്റെ ദൃശ്യത നിലനിർത്തുന്നു; ‘അനങ്ങി’ എന്നതിനെക്കാൾ ശക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: βρέφος
  choice: കുഞ്ഞ്
  rationale: എലിസബത്തിന്റെ ഗർഭത്തിലുള്ള യോഹന്നാനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കുഞ്ഞ്’ സ്വാഭാവികവും പ്രായപരമായി യോജിച്ചതുമായ മലയാളപദമാണ്.
- source_word: κοιλία
  choice: ഗർഭം
  rationale: ഈ സന്ദർഭത്തിൽ സ്ത്രീയുടെ ഗർഭത്തെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്; ‘വയർ’ എന്നതിനെക്കാൾ കൃത്യവും മാന്യവുമാണ്.
- source_word: ἐπλήσθη
  choice: നിറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ഓറിസ്റ്റ് കർമണിപ്രയോഗത്തിന്റെ അർത്ഥം മലയാളത്തിലെ ‘-ആൽ നിറഞ്ഞു’ എന്ന സ്വാഭാവിക ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിനാൽ
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികൾ എന്ന രചനാസമുച്ചയത്തിൽ ഈ പദസമുച്ചയം ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെയാണ് പതിവായി സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ഉപകരണാർഥപ്രയോഗം നിറയ്ക്കുന്ന ദൈവിക പ്രവർത്തനവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πνεύματος ἁγίου എന്നതിന്റെ സൂചിതൻ
  choice: ദൈവിക വ്യക്തിയായ പരിശുദ്ധാത്മാവ്
  alternative: ഒരു പരിശുദ്ധ ആത്മാവ്
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികളിലെ പ്രയോഗവും ഇവിടെ തുടർന്നുവരുന്ന പ്രവചനാത്മക വാക്കുകളുടെ സന്ദർഭവും ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘പരിശുദ്ധാത്മാവ്’ എന്ന സ്ഥിരരൂപം ഉപയോഗിച്ചു.
- issue: ഗർഭസ്ഥനായ യോഹന്നാനെ βρέφος എന്നു വിളിക്കുന്നത്
  choice: കുഞ്ഞ്
  alternative: ശിശു
  rationale: മൂലപദം വളരെ ചെറുപ്പമുള്ള കുട്ടിയെ സൂചിപ്പിക്കുകയും ഇവിടെ ഗർഭസ്ഥനായ യോഹന്നാനെ നേരിട്ട് പരാമർശിക്കുകയും ചെയ്യുന്നു. ‘കുഞ്ഞ്’ പാഠത്തിന്റെ മൂർത്തമായ പരാമർശം നിലനിർത്തുന്നു; അധിക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ἐγένετο എന്ന ആഖ്യാനസൂത്രം വാക്കിന് വാക്കായി ഭാരമുള്ള രീതിയിൽ പുനരാവിഷ്കരിക്കാതെ കാലവാക്യത്തിൽ ഉൾപ്പെടുത്തി. വാക്യത്തിലെ ത്വരിതമായ സംഭവക്രമവും സമാന്തര ഘടനയും നിലനിർത്തി.
