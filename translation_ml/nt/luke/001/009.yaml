id: LUK.1.9
reference: Luke 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατὰ τὸ ἔθος τῆς ἱερατείας ἔλαχε τοῦ θυμιᾶσαι εἰσελθὼν εἰς τὸν ναὸν τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: ml
  text: പുരോഹിതശുശ്രൂഷയുടെ പതിവനുസരിച്ച്, കർത്താവിന്റെ വിശുദ്ധമന്ദിരത്തിൽ പ്രവേശിച്ച് ധൂപം അർപ്പിക്കാനുള്ള ചുമതല നറുക്കെടുപ്പിലൂടെ അവന്നു ലഭിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: പുരോഹിതശുശ്രൂഷയുടെ പതിവനുസരിച്ച്
  rationale: κατά + accusative പതിവിനോടുള്ള അനുസരണം സൂചിപ്പിക്കുന്നു; ἱερατεία വ്യക്തിഗത പുരോഹിതന്മാരെക്കാൾ പുരോഹിതപദവിയെയും ശുശ്രൂഷയെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘പുരോഹിതശുശ്രൂഷ’ എന്നു നൽകി.
- source_word: ἔλαχε
  choice: നറുക്ക് അവനു വീണു
  rationale: λαγχάνω നറുക്കെടുപ്പിലൂടെ ഒരു ചുമതല ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നറുക്ക് അവനു വീണു’ എന്നത് ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τοῦ θυμιᾶσαι
  choice: ധൂപം അർപ്പിക്കാനുള്ള
  rationale: Articular infinitive നറുക്കിലൂടെ ലഭിച്ച ചുമതലയുടെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു. θυμιάω ധൂപം കത്തിക്കുന്നതോ അർപ്പിക്കുന്നതോ ആണ്; ആരാധനാസന്ദർഭത്തിൽ ‘ധൂപം അർപ്പിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: εἰσελθὼν
  choice: പ്രവേശിച്ച്
  rationale: Aorist participle മുഖ്യപ്രവർത്തനവുമായി ബന്ധപ്പെട്ട പ്രവേശനത്തെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു; കൃത്യമായ കാലക്രമം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: εἰς τὸν ναὸν τοῦ κυρίου
  choice: കർത്താവിന്റെ ആലയമന്ദിരത്തിൽ
  rationale: ναός വിശാലമായ ആലയപരിസരത്തേക്കാൾ ആലയകെട്ടിടത്തെയോ അകത്തെ വിശുദ്ധമന്ദിരത്തെയോ സാധാരണ സൂചിപ്പിക്കുന്നു. ‘ആലയമന്ദിരം’ ഈ പ്രത്യേകത നിലനിർത്തുകയും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആലയാരാധനാസന്ദർഭത്തിൽ ναός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ആലയമന്ദിരം
  alternative: വിശുദ്ധമന്ദിരം
  rationale: സെഖര്യാവ് ധൂപം അർപ്പിക്കാൻ പ്രവേശിക്കുന്നതിനാൽ അകത്തെ വിശുദ്ധമന്ദിരം സന്ദർഭപരമായി ഉദ്ദേശിക്കപ്പെടുന്നു. മുഖ്യപാഠത്തിലെ ‘ആലയമന്ദിരം’ വായനാസൗകര്യവും ἱερόν എന്ന വിശാല ആലയപരിസരത്തിൽനിന്നുള്ള വ്യത്യാസവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; കൂടുതൽ നിർദിഷ്ടമായ അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നറുക്ക് അവനു വീണു’ എന്ന പ്രയോഗം നറുക്കെടുപ്പിന്റെ ആശയം സുതാര്യമാക്കുന്നു; ‘ധൂപം അർപ്പിക്കുക’ ആരാധനാസന്ദർഭത്തിന് യോജിച്ച പ്രയോഗമാണ്.
