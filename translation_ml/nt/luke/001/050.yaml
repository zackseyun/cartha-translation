  text: καὶ τὸ ἔλεος αὐτοῦ εἰς γενεὰς ⸂καὶ γενεὰς⸃ τοῖς φοβουμένοις αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: ml
  text: അവനെ ഭയപ്പെടുന്നവരോടുള്ള അവന്റെ കരുണ തലമുറതലമുറയോളം നിലനിൽക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘തലമുറകളിലേക്കും തലമുറകളിലേക്കും’; തുടർച്ചയായ തലമുറകളിലുടനീളം കരുണ വ്യാപിക്കുന്നതാണു പ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ‘അവനെ ഭയപ്പെടുന്നവർ’ എന്നത് ദൈവത്തോടു ഭക്തിപൂർവമായ ഭയാദരവോടെ ജീവിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; ‘അവനെ ഭക്ത്യാദരത്തോടെ ഭയപ്പെടുന്നവർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: കരുണ
  rationale: ആവശ്യമുള്ളവരോടു കാണിക്കുന്ന ദയയും അനുകമ്പയും സൂചിപ്പിക്കുന്ന പദമാണിത്. ഇവിടെ ‘കരുണ’ സ്വാഭാവികവും മറിയയുടെ സ്തുതിഗീതത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാവത്തിന് യോജിച്ചതുമാണ്.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: തലമുറതലമുറയോളം
  rationale: തുടർച്ചയായ തലമുറകളിലേക്കുള്ള വ്യാപ്തി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: അവനെ ഭയപ്പെടുന്നവരോട്
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയം എന്ന ബൈബിൾപ്രയോഗത്തിന്റെ ഭാരവും തുറന്ന അർത്ഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു; ദത്തിവ് രൂപം കരുണ ലഭിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു.
- source_word: καὶ
  choice: —
  rationale: മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമാണ്; മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘കൂടാതെ’ ഒഴിവാക്കുന്നത് കവിതാഭാവം കൂടുതൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: αὐτοῦ / αὐτόν
  choice: അവന്റെ / അവനെ
  rationale: സമീപസന്ദർഭത്തിൽ രണ്ടും ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ സർവനാമങ്ങൾ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തെ ‘ഭയപ്പെടുക’ എന്നതിന്റെ അർത്ഥം
  choice: ഭയപ്പെടുന്നവർ
  alternative: ഭക്ത്യാദരത്തോടെ വണങ്ങുന്നവർ
  rationale: φοβέομαι ദൈവം കർമമാകുമ്പോൾ ഭക്തിപൂർവമായ ഭയത്തെയും ആദരവിനെയും സൂചിപ്പിക്കാം. ‘ഭയപ്പെടുക’ എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നത് അതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും യഥാർഥമായ അർത്ഥതുറപ്പും സംരക്ഷിക്കുന്നു.
- issue: കരുണയുടെ കാലവ്യാപ്തിയും പ്രാപകരും തമ്മിലുള്ള ബന്ധം
  choice: അവനെ ഭയപ്പെടുന്നവരോടുള്ള അവന്റെ കരുണ തലമുറതലമുറയോളം നിലനിൽക്കുന്നു
  alternative: അവന്റെ കരുണ തലമുറതലമുറയായി അവനെ ഭയപ്പെടുന്നവരിലേക്കുണ്ട്
  rationale: ഗ്രീക്കിലെ രണ്ടു ഘടകങ്ങളും—തലമുറകളിലേക്കുള്ള വ്യാപ്തിയും ദൈവത്തെ ഭയപ്പെടുന്നവർ എന്ന പ്രാപകരും—സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ഘടന സ്വീകരിക്കുന്നു. ‘നിലനിൽക്കുന്നു’ എന്നത് εἰς എന്നതിന്റെ തുടർച്ചാവ്യാപ്തിയെ വ്യക്തമാക്കുന്നു; പുതിയൊരു ഉപദേശാർഥം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സ്തുതിഗീതത്തിന്റെ കവിതാഭാവം നിലനിർത്താൻ ‘തലമുറതലമുറയോളം’ ഉപയോഗിച്ചു. ദൈവത്തെക്കുറിച്ചുള്ള ‘ഭയം’ എന്ന ബൈബിൾപരമായ ദൈവശാസ്ത്രസാന്ദ്രത ലഘൂകരിക്കാതെ, കുറിപ്പിലൂടെ ഭക്ത്യാദരത്തിന്റെ അർത്ഥം വ്യക്തമാക്കി.
