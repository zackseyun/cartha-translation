  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: ml
  text: എന്തെന്നാൽ, തന്റെ അടിമസ്ത്രീയുടെ[a] താഴ്ന്ന അവസ്ഥയെ[b] അവിടുന്ന് കടാക്ഷിച്ചു. ഇതാ, ഇന്നുമുതൽ സകല തലമുറകളും എന്നെ ഭാഗ്യവതി എന്നു വിളിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അടിമസ്ത്രീ” എന്നതിന് ഈ സന്ദർഭത്തിൽ “ദാസി” അല്ലെങ്കിൽ “സേവിക” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
  - marker: b
    text: “താഴ്ന്ന അവസ്ഥ” എന്നതിന് “താഴ്മ” അല്ലെങ്കിൽ “അപമാനിതാവസ്ഥ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: കടാക്ഷിച്ചു
  rationale: ആരിലേക്കെങ്കിലും ശ്രദ്ധയും അനുകൂലമായ പരിഗണനയും തിരിക്കുന്നതെന്ന പ്രയോഗത്തിന്റെ ഭാവം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു. സന്ദർഭത്തിലെ ദൈവിക കൃപാഭാവം സൂചിപ്പിച്ചാലും, മൂലപാഠത്തിൽ ഇല്ലാത്ത ഒരു പ്രത്യേക പ്രവൃത്തി ഇത് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ταπείνωσιν
  choice: താഴ്ന്ന അവസ്ഥ
  rationale: മറിയയുടെ ആന്തരിക വിനയം മാത്രമല്ല, അവളുടെ താഴ്ന്ന സാമൂഹിക നിലയെയും അപ്രധാനാവസ്ഥയെയും സൂചിപ്പിക്കാൻ ഈ പ്രയോഗം സഹായിക്കുന്നു; ‘താഴ്മ’, ‘അപമാനിതാവസ്ഥ’ എന്നീ സാധ്യതകളും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δούλης
  choice: അടിമ
  rationale: ദൈവത്തിനുള്ള പൂർണമായ ഉടമസ്ഥബന്ധവും വിധേയത്വവും മയപ്പെടുത്താതെ നിലനിർത്തുന്നു. സ്ത്രീലിംഗം മലയാളപദത്തിൽ സ്വതവേ പ്രകടമല്ലെങ്കിലും സംസാരിക്കുന്നത് മറിയയാണെന്ന സന്ദർഭം അത് വ്യക്തമാക്കുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന മൂലപദത്തിന്റെ ഊന്നൽ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ τοῦ νῦν
  choice: ഇന്നുമുതൽ
  rationale: ഈ സമയം മുതൽ മുന്നോട്ടുള്ള കാലസൂചന ലളിതമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: μακαριοῦσίν με
  choice: എന്നെ ഭാഗ്യവതി എന്നു വിളിക്കും
  rationale: മറിയ അനുഗൃഹീതയും ഭാഗ്യമുള്ളവളുമാണെന്ന് തുടർന്നുള്ള തലമുറകൾ പ്രഖ്യാപിക്കുമെന്ന ഭാവികാല അർഥം നിലനിർത്തുന്നു; സ്ത്രീയെ സൂചിപ്പിക്കുന്ന രൂപവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πᾶσαι αἱ γενεαί
  choice: സകല തലമുറകളും
  rationale: ഒന്നിനു പിന്നാലെ വരുന്ന എല്ലാ തലമുറകളെയും സൂചിപ്പിക്കുന്ന മൂലപ്രയോഗം അധിക വ്യാഖ്യാനം ചേർക്കാതെ നൽകുന്നു.
theological_decisions:
- issue: മറിയ സ്വയം δούλη എന്നു വിശേഷിപ്പിക്കുന്നത്
  choice: തന്റെ അടിമ
  alternative: തന്റെ ദാസി / തന്റെ സേവിക
  rationale: ദൈവത്തിനുള്ള സമ്പൂർണമായ ചേർച്ചയും വിധേയത്വവും സൂചിപ്പിക്കുന്ന ശക്തമായ പദം മയപ്പെടുത്താതെയാണ് ‘അടിമ’ തിരഞ്ഞെടുത്തത്. അതേസമയം പിൽക്കാല മറിയവിജ്ഞാനപരമായ അവകാശവാദങ്ങളൊന്നും വാക്യത്തിൽ ചേർത്തിട്ടില്ല; കൂടുതൽ മൃദുവായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: ταπείνωσις എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: താഴ്ന്ന അവസ്ഥ
  alternative: താഴ്മ / അപമാനിതാവസ്ഥ
  rationale: ഇത് മറിയയുടെ ആന്തരിക വിനയത്തിൽ മാത്രം ഒതുക്കാതെയും നിർബന്ധമായി അപമാനം അനുഭവിച്ച അവസ്ഥയാക്കി കടുപ്പിക്കാതെയും, അവളുടെ താഴ്ന്ന നിലയെ മുൻനിർത്തുന്നു. മൂലപദത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കാവ്യാത്മക ശൈലിയാണ് സ്വീകരിച്ചത്. ‘അവിടുന്ന്’, ‘കടാക്ഷിച്ചു’, ‘ഇതാ’ എന്നീ പദങ്ങൾ മറിയയുടെ സ്തുതിഗീതത്തിന്റെ ഉയർന്ന ഭാവം നിലനിർത്തുന്നു; എന്നാൽ ഭാഷ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ὅτι എന്ന ബന്ധകം ‘എന്തെന്നാൽ’ എന്നു തുറന്നുവെച്ചിരിക്കുന്നു.
