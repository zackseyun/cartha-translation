id: LUK.1.61
reference: Luke 1:61
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: ml
  text: 'അവർ അവളോടു പറഞ്ഞു: “നിന്റെ ബന്ധുക്കളിൽ ആരും ഈ പേരിൽ അറിയപ്പെടുന്നില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: അവർ അവളോടു പറഞ്ഞു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതയെ സൂചിപ്പിക്കുന്ന πρός + accusative മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവളോടു’ എന്നും, narrative aorist ‘പറഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: Οὐδείς ἐστιν ἐκ τῆς συγγενείας σου
  choice: നിന്റെ ബന്ധുക്കളിൽ ആരും ... ഇല്ല
  rationale: ἐκ എന്ന ഭാഗികബന്ധവും συγγένεια എന്ന ബന്ധുജനസൂചനയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്ന പ്രയോഗമാണിത്.
- source_word: ὃς καλεῖται τῷ ὀνόματι τούτῳ
  choice: ഈ പേരിൽ അറിയപ്പെടുന്നില്ല
  rationale: പേര് സംബന്ധിച്ച് καλέω എന്നതിന്റെ ഇപ്പോഴത്തെ കർമണി രൂപം ‘വിളിക്കപ്പെടുന്നു/പേരുള്ളവൻ’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ഒരാൾ ആ പേരിൽ വിളിക്കപ്പെടുകയോ അറിയപ്പെടുകയോ ചെയ്യുന്നതിനെ സ്വാഭാവികമായി ‘ഈ പേരിൽ അറിയപ്പെടുന്നു’ എന്നു പറയാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ബന്ധുജനപരിധിയും നിർദേശിക്കപ്പെട്ട പ്രത്യേക പേരിലേക്കുള്ള τούτῳ എന്ന സൂചനയും നിലനിർത്തി.
