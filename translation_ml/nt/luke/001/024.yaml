    issue: The phrase «സ്വയം മറച്ചുവെച്ചുകൊണ്ട് ഇങ്ങനെ പറഞ്ഞു» is grammatically and aspectually awkward.
    rationale: The Greek περιέκρυβεν is imperfect, denoting that Elizabeth kept herself hidden over the five months. The present participle λέγουσα introduces her ensuing words. Rendering both with «-കൊണ്ട്» can imply that the hiding was merely simultaneous with a single act of speaking, rather than a sustained prior action explained by the speech.
