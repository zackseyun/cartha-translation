  yaml_path: translation/nt/luke/001/024.yaml
  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: ml
  text: ആ ദിവസങ്ങൾക്കുശേഷം അവന്റെ ഭാര്യ എലിസബത്ത് ഗർഭം ധരിച്ചു; അവൾ അഞ്ചു മാസം സ്വയം മറച്ചുവെച്ചിരുന്നു, ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൾ അഞ്ചു മാസം സ്വയം ഒളിപ്പിച്ചു’ അല്ലെങ്കിൽ ‘അവൾ അഞ്ചു മാസം ഏകാന്തമായി കഴിഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് അപൂർണഭൂതകാലരൂപം ആ കാലയളവിലുടനീളം തുടർന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: ആ ദിവസങ്ങൾക്കുശേഷം
  rationale: μετάയും കർമണിവിഭക്തിയും സമയക്രമത്തിൽ ‘ശേഷം’ എന്നു സൂചിപ്പിക്കുന്നു. ταύτας അക്ഷരാർഥത്തിൽ ‘ഈ’ എന്നാണെങ്കിലും, കഴിഞ്ഞ സംഭവങ്ങളെ പരാമർശിക്കുന്ന സ്വാഭാവിക മലയാള വിവരണത്തിൽ ‘ആ ദിവസങ്ങൾ’ യോജിക്കുന്നു. δέ ഇവിടെ മൃദുവായ ബന്ധകമായതിനാൽ വേറെ പദമായി ചേർത്തിട്ടില്ല.
- source_word: συνέλαβεν
  choice: ഗർഭം ധരിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ συλλαμβάνω ഒരു കുഞ്ഞിനെ ഗർഭം ധരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ നേരിട്ടും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: Ἐλισάβετ
  choice: എലിസബത്ത്
  rationale: പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: അവന്റെ ഭാര്യ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമുണ്ടാകാം; ഉടമസ്ഥസർവനാമവും സന്ദർഭവും ഇവിടെ ‘ഭാര്യ’ എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: സ്വയം മറച്ചുവെച്ചുകൊണ്ട്
  rationale: അപൂർണഭൂതകാല ക്രിയ അഞ്ചുമാസം നീണ്ടുനിന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘മറച്ചുവെച്ചുകൊണ്ട്’ എന്നത് തുടർച്ചയും ആത്മനിർദ്ദേശക അർഥവും പ്രകടമാക്കുന്നു; എങ്കിലും ഇത് ഏകാന്തവാസത്തെയും പൊതുജനദൃഷ്ടിയിൽനിന്ന് മാറിനിൽക്കലിനെയും സൂചിപ്പിക്കാം.
- source_word: μῆνας πέντε
  choice: അഞ്ചുമാസം
  rationale: കർമണിവിഭക്തി കാലദൈർഘ്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അധിക അവ്യയം കൂടാതെ ‘അഞ്ചുമാസം’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: λέγουσα
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: വർത്തമാന കൃതന്തം അടുത്ത വാക്യത്തിലെ വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ വാക്യാന്തത്തിൽ ‘ഇങ്ങനെ പറഞ്ഞു’ എന്ന പരിധിക്രിയ സ്വാഭാവികമായിരിക്കെ, തുടർന്നുവരുന്ന നേരിട്ടുള്ള പ്രസംഗബന്ധവും നിലനിർത്തുന്നു.
