translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് പദക്രമം യാന്ത്രികമായി പകർത്താതെ മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമം സ്വീകരിച്ചു. അടുത്ത വാക്യത്തിലേക്കുള്ള λέγουσα എന്ന കൃതന്തരൂപത്തിന്റെ ബന്ധം കോളനും ‘ഇങ്ങനെ പറഞ്ഞു’ എന്ന പ്രയോഗവുംകൊണ്ട് നിലനിർത്തി.
