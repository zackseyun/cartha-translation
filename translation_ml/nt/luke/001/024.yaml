  terminology: «എലിസബത്ത്», «ഭാര്യ», and «ഗർഭം ധരിച്ചു» are accurate, standard, and appropriately neutral. «സ്വയം മറച്ചുവെക്കുക» is retained as a close rendering without over-interpreting the reason or manner of her seclusion.
