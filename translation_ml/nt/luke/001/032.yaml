id: LUK.1.32
reference: Luke 1:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: ml
  text: അവൻ മഹാനായിരിക്കും; അത്യുന്നതന്റെ പുത്രൻ എന്ന് വിളിക്കപ്പെടും[a]. കർത്താവായ ദൈവം അവന് അവന്റെ പിതാവായ ദാവീദിന്റെ സിംഹാസനം നൽകും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത്യുന്നതന്റെ പുത്രൻ എന്നു നാമകരണം ചെയ്യപ്പെടും.”
    reason: lexical_alternative
  - marker: b
    text: “അവന്റെ പിതാവ്” എന്നത് ദാവീദിക രാജവംശത്തിലെ യേശുവിന്റെ പൂർവപിതാവായ ദാവീദിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: അവൻ
  rationale: പ്രഖ്യാപിക്കപ്പെട്ട ശിശുവിനെയാണ് നിർദ്ദേശക സർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘അവൻ’ സ്വാഭാവികമാണ്.
- source_word: ἔσται μέγας
  choice: മഹാനായിരിക്കും
  rationale: ഭാവികാലവും μέγας എന്ന പദത്തിന്റെ വിശാലമായ മഹത്ത്വാർഥവും നിലനിർത്തുന്നു.
- source_word: υἱὸς Ὑψίστου
  choice: അത്യുന്നതന്റെ പുത്രൻ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന ‘അത്യുന്നതൻ’ എന്ന ബൈബിൾപരമായ സ്ഥാനനാമവും പുത്രത്വപ്രഖ്യാപനവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: κληθήσεται
  choice: എന്ന് വിളിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗത്തെയും പദവി/നാമകരണത്തിന്റെ സാധ്യതയുള്ള അർഥവ്യാപ്തിയെയും സംരക്ഷിക്കുന്നു.
- source_word: κύριος ὁ θεὸς
  choice: കർത്താവായ ദൈവം
  rationale: κύριος എന്നതിന് ‘കർത്താവ്’ എന്നും മുഴുവൻ പദസമുച്ചയത്തിന് സ്വാഭാവിക മലയാളരൂപവും നൽകുന്നു.
- source_word: δώσει αὐτῷ
  choice: അവന് ... നൽകും
  rationale: δίδωμι എന്ന ലളിതമായ നൽകൽക്രിയയും ദാതൃവിഭക്തിയും വ്യക്തമായി പകരുന്നു.
- source_word: τὸν θρόνον Δαυὶδ
  choice: ദാവീദിന്റെ സിംഹാസനം
  rationale: ദാവീദിക രാജവാഗ്ദാനത്തിന്റെ ഭാഷയും ജനിറ്റീവ് ബന്ധവും നിലനിർത്തുന്നു.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: അവന്റെ പിതാവായ
  rationale: πατήρ എന്നതിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു; ഇവിടെ വംശപരമ്പരയിലെ പൂർവപിതാവാണ് ഉദ്ദേശിക്കുന്നത് എന്നു അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: υἱὸς Ὑψίστου എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവി
  choice: അത്യുന്നതന്റെ പുത്രൻ
  alternative: അത്യുന്നതന്റെ ഒരു പുത്രൻ
  rationale: വാക്യസന്ദർഭത്തിൽ ഇത് യേശുവിനെക്കുറിച്ചുള്ള പ്രത്യേക രാജകീയവും ദൈവബന്ധപരവുമായ പദവിയായി പ്രവർത്തിക്കുന്നു; അനിശ്ചിതത്വം ചേർത്ത് ശക്തി കുറയ്ക്കുന്നില്ല.
- issue: κύριος എന്ന ദൈവസംബോധന
  choice: കർത്താവായ ദൈവം
  alternative: യഹോവയായ ദൈവം
  rationale: ഗ്രീക്ക് പാഠത്തിൽ κύριος ആണ്; ദൈവനാമത്തിന്റെ പ്രത്യേക രൂപം പാഠത്തിൽ ഇല്ലാത്തതിനാൽ അത് വിവർത്തനത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ദാവീദിനെ ‘പിതാവ്’ എന്നു വിളിക്കൽ
  choice: അവന്റെ പിതാവായ ദാവീദ്
  alternative: അവന്റെ പൂർവപിതാവായ ദാവീദ്
  rationale: രാജവംശപരവും ഉടമ്പടിപരവുമായ പിതൃത്വഭാഷ നേരിട്ട് നിലനിർത്തി, ഉദ്ദേശ്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ രണ്ട് ഭാവികാല പ്രഖ്യാപനങ്ങളും ദാവീദിക രാജഭാഷയും സംരക്ഷിച്ചു. ഇംഗ്ലീഷിൽ ആവശ്യമായ οὗτος സംബന്ധിച്ച ‘This one’ അടിക്കുറിപ്പ് മലയാളത്തിൽ പ്രത്യേകമായി ആവശ്യമില്ല; ‘ഇവൻ’ എന്നത് സാധ്യമായിരുന്നാലും സന്ദർഭത്തിൽ ‘അവൻ’ കൂടുതൽ സ്വാഭാവികമാണ്.
