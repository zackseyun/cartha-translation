  to: അപ്പോൾ കുട്ടിക്ക് എന്തു പേരിടാനാണ് അവൻ ആഗ്രഹിക്കുന്നതെന്ന് അവർ അവന്റെ അപ്പനോട് ആംഗ്യങ്ങളിലൂടെ ചോദിച്ചു.[a]
