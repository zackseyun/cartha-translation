id: LUK.1.28
reference: Luke 1:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀εἰσελθὼν πρὸς αὐτὴν εἶπεν· Χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: ml
  text: 'അവളുടെ അടുക്കലേക്കു കടന്നുചെന്ന് അവൻ പറഞ്ഞു: “വന്ദനം[a], കൃപ ലഭിച്ചവളേ[b]! കർത്താവ് നിന്നോടുകൂടെ ഉണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സന്തോഷിക്കൂ”; പരമ്പരാഗതമായി “മംഗളം.” ഗ്രീക്ക് പദം രൂപത്തിൽ “സന്തോഷിക്കൂ” എന്ന ആജ്ഞയായിരുന്നാലും ഇവിടെ ഒരു അഭിവാദനമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വളരെ കൃപ ലഭിച്ചവളേ,” “കൃപ പ്രാപിച്ചവളേ”; പരമ്പരാഗതമായി “കൃപനിറഞ്ഞവളേ.” ഗ്രീക്ക് പദം കൃപയോ പ്രീതിയോ ലഭിച്ച ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: അവളുടെ അടുത്തേക്കു കടന്നുവന്ന്
  rationale: εἰσελθὼν എന്ന ഭൂതകാല ക്രിയാവിശേഷണരൂപം അകത്തേക്കുള്ള പ്രവേശനത്തെയും തുടർന്ന് നടന്ന സംസാരത്തെയും സൂചിപ്പിക്കുന്നു; πρὸς αὐτήν മറിയത്തിന്റെ അടുത്തേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്നു. ഈ പ്രയോഗം രണ്ടും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Χαῖρε
  choice: അഭിവാദ്യം
  rationale: 'χαίρω എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഔപചാരികമായി ‘സന്തോഷിക്കൂ’ എന്നാണെങ്കിലും, ഇവിടെ അത് പതിവ് അഭിവാദനമായി പ്രവർത്തിക്കുന്നു. ‘അഭിവാദ്യം’ ആ സന്ദർഭാർഥം ആധുനികവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു; പദശ: സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.'
- source_word: κεχαριτωμένη
  choice: കൃപ ലഭിച്ചവളേ
  rationale: χαριτόω എന്ന ക്രിയയുടെ സമ്പൂർണ നിഷ്ക്രിയ കർത്തൃവിശേഷണരൂപമാണിത്. മറിയം കൃപയുടെ ഉറവിടമാണെന്നല്ല, കൃപ ലഭിച്ചവളാണെന്ന സ്വീകർത്തൃഭാവം ഈ പരിഭാഷ വ്യക്തമാക്കുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ പതിവും മാന്യവുമായ ബൈബിൾപരമായ മലയാളരൂപം.
- source_word: μετὰ σοῦ
  choice: നിന്നോടുകൂടെ ഉണ്ട്
  rationale: μετά + സമ്പ്രദാനസദൃശമായ genitive ഇവിടെ സാന്നിധ്യം അർഥമാക്കുന്നു. മലയാളത്തിലെ പൂർണവും സ്വാഭാവികവുമായ വാക്യത്തിനായി ‘ഉണ്ട്’ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: മറിയത്തെ അഭിസംബോധന ചെയ്യുന്ന κεχαριτωμένη എന്ന ദൈവശാസ്ത്രപരമായി സൂക്ഷ്മമായ പദത്തിന്റെ പരിഭാഷ
  choice: കൃപ ലഭിച്ചവളേ
  alternative: കൃപനിറഞ്ഞവളേ; അത്യന്തം അനുഗ്രഹിക്കപ്പെട്ടവളേ; കൃപ ചെയ്യപ്പെട്ടവളേ
  rationale: ഗ്രീക്കിലെ സമ്പൂർണ നിഷ്ക്രിയരൂപം മറിയം കൃപയോ പ്രീതിയോ ലഭിച്ച വ്യക്തിയാണെന്ന് പറയുന്നു. ‘കൃപനിറഞ്ഞവളേ’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുമ്പോഴും, മൂലപാഠം വ്യക്തമായി പറയാത്ത പിൽക്കാല സിദ്ധാന്തപരമായ അർഥങ്ങൾ മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരാതിരിക്കാൻ സ്വീകർത്തൃഭാവം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘അഭിവാദ്യം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഔപചാരിക അഭിവാദനമാണ്; ‘കൃപ ലഭിച്ചവളേ’ മൂലപാഠത്തിലെ നിഷ്ക്രിയഭാവം വ്യക്തമായി സൂക്ഷിക്കുന്നു. വാക്യത്തിന്റെ ദൈവസാന്നിധ്യഭാവം ‘കർത്താവ് നിന്നോടുകൂടെ ഉണ്ട്’ എന്ന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
