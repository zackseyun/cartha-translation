id: LUK.1.66
reference: Luke 1:66
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: ml
  text: ഇതു കേട്ടവരെല്ലാം അതു ഹൃദയത്തിൽ സൂക്ഷിച്ചു. അവർ, “അപ്പോൾ ഈ കുഞ്ഞ് എന്തായിത്തീരും?[a]” എന്നു പറഞ്ഞു. കാരണം, കർത്താവിന്റെ കൈ അവനോടുകൂടെ ഉണ്ടായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ കുഞ്ഞ് എന്തായിരിക്കും?” ഗ്രീക്ക് ക്രിയയുടെ നേരായ അർഥം ‘ആയിരിക്കും’ എന്നാണ്; എന്നാൽ സന്ദർഭത്തിൽ കുഞ്ഞ് ഭാവിയിൽ എന്തായിരിക്കും എന്നതാണ് ചോദ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘കർത്താവിന്റെ കൈ’ എന്നത് ദൈവത്തിന്റെ സജീവ ശക്തി, അനുഗ്രഹം, അല്ലെങ്കിൽ വഴിനടത്തൽ സൂചിപ്പിക്കുന്ന വേദപുസ്തകീയ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: അത് ഹൃദയത്തിൽ സൂക്ഷിച്ചുകൊണ്ട്
  rationale: ‘അവരുടെ ഹൃദയത്തിൽ വെച്ചു’ എന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തുന്നതിനൊപ്പം, കേട്ട കാര്യം ഗൗരവമായി ഓർത്തുവെക്കുകയും പരിഗണിക്കുകയും ചെയ്തു എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: πάντες οἱ ἀκούσαντες
  choice: ഇതു കേട്ടവരെല്ലാം
  rationale: മുൻസന്ദർഭത്തിലെ സംഭവങ്ങളെക്കുറിച്ച് കേട്ട എല്ലാവരെയും പങ്കാളിത്തരൂപം സൂചിപ്പിക്കുന്നു; ‘ഇതു’ സന്ദർഭത്തിൽനിന്ന് സ്വാഭാവികമായി പൂരിപ്പിച്ചിരിക്കുന്നു.
- source_word: Τί ἄρα
  choice: അപ്പോൾ ... എന്ത്
  rationale: ἄρα മുൻസംഭവങ്ങളിൽനിന്ന് നിഗമനം ചെയ്യുന്നതോ അതിന്റെ ഫലം ചിന്തിക്കുന്നതോ ആയ ഭാവം നൽകുന്നു; ‘അപ്പോൾ’ അത് സ്വാഭാവികമായി പകരുന്നു.
- source_word: τὸ παιδίον τοῦτο
  choice: ഈ കുഞ്ഞ്
  rationale: പുതുതായി ജനിച്ച ശിശുവിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘ഈ കുഞ്ഞ്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കൃത്യവുമാണ്; പ്രായമോ ഭാവിയിലെ സ്ഥാനമോ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἔσται
  choice: എന്തായിത്തീരും
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ആയിരിക്കും’ എന്നാണെങ്കിലും, ഇവിടെ ചോദ്യം കുഞ്ഞിന്റെ ഭാവി സ്വഭാവം, സ്ഥാനം, അല്ലെങ്കിൽ ദൗത്യം സംബന്ധിച്ചതാണ്. ‘എന്തായിത്തീരും’ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: καὶ γὰρ
  choice: കാരണം
  rationale: ഈ സംയോജനം ജനങ്ങളുടെ ചോദ്യത്തിന് തുടർന്നുള്ള കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കാരണം’ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: χεὶρ κυρίου
  choice: കർത്താവിന്റെ കൈ
  rationale: ദൈവത്തിന്റെ സജീവ ശക്തി, അനുഗ്രഹം, സാന്നിധ്യം, അല്ലെങ്കിൽ വഴിനടത്തൽ സൂചിപ്പിക്കുന്ന വേദപുസ്തകീയ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: μετ’ αὐτοῦ
  choice: അവനോടുകൂടെ
  rationale: μετά + genitive എന്നതിന്റെ നേരായ അർഥമായ ‘കൂടെ’ നിലനിർത്തുന്നു; ‘അവൻ’ കുഞ്ഞിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ‘കർത്താവിന്റെ കൈ അവനോടുകൂടെ ഉണ്ടായിരുന്നു’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ സജീവ സാന്നിധ്യം, ശക്തി, അനുഗ്രഹം, അല്ലെങ്കിൽ വഴിനടത്തൽ എന്നിവയിൽ ഒന്ന് മാത്രമായി ചുരുക്കാതെ മൂലരൂപകം നിലനിർത്തുക.
  alternative: ‘കർത്താവ് അവനെ സഹായിച്ചുകൊണ്ടിരുന്നു’ അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ ശക്തി അവന്റെമേൽ ഉണ്ടായിരുന്നു’ എന്നു വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം കുഞ്ഞിന്റെ ജീവിതത്തിൽ ദൈവം സജീവമായി പ്രവർത്തിച്ചിരുന്നുവെന്ന് അറിയിക്കുന്നു; എന്നാൽ അത് സഹായം, സംരക്ഷണം, ശക്തിപ്പെടുത്തൽ, അനുഗ്രഹം എന്നിവയിൽ ഏതാണ് എന്ന് പ്രത്യേകം നിർവചിക്കുന്നില്ല. രൂപകം നിലനിർത്തുന്നത് ഈ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘ഹൃദയത്തിൽ സൂക്ഷിക്കുക’, ‘കർത്താവിന്റെ കൈ’ എന്നീ വേദപുസ്തകീയ രൂപകങ്ങൾ അർഥം ചുരുക്കാതെ നിലനിർത്തിയിട്ടുണ്ട്; മുഖ്യവാചകത്തിലെ ‘എന്തായിത്തീരും’ സ്വാഭാവിക മലയാളവും അടിക്കുറിപ്പിലെ ‘എന്തായിരിക്കും’ ഗ്രീക്കിന്റെ കൂടുതൽ നേരായ രൂപവുമാണ്.
