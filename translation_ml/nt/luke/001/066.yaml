- from: ഇതു കേട്ടവരെല്ലാം അത് ഹൃദയത്തിൽ സൂക്ഷിച്ചുകൊണ്ട്, “അപ്പോൾ ഈ കുഞ്ഞ് എന്തായിത്തീരും?[a]” എന്നു പറഞ്ഞു. കാരണം, കർത്താവിന്റെ കൈ അവനോടുകൂടെ ഉണ്ടായിരുന്നു.[b]
