revisions:
- from: കുഞ്ഞേ, നീയും അത്യുന്നതന്റെ പ്രവാചകൻ എന്നു വിളിക്കപ്പെടും; കർത്താവിന്റെ മുമ്പിൽ[a] ചെന്നു അവന്റെ വഴികൾ ഒരുക്കുവാൻ[b] നീ പോകുമല്ലോ.
