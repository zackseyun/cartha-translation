id: LUK.1.76
reference: Luke 1:76
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: ml
  text: കുഞ്ഞേ, നീയും അത്യുന്നതന്റെ പ്രവാചകൻ എന്നു വിളിക്കപ്പെടും; കർത്താവിന്റെ മുമ്പിൽ[a] അവന്റെ വഴികൾ ഒരുക്കാൻ[b] നീ മുൻപേ പോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കർത്താവിന്റെ സന്നിധിയിൽ.’ ഈ പ്രയോഗത്തിന് കർത്താവിന്റെ മുമ്പേ എന്നോ കർത്താവിന്റെ സന്നിധിയിൽ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: കർത്താവിന്റെ മുമ്പിൽ വഴികൾ ഒരുക്കുന്നതിനെക്കുറിച്ചുള്ള പ്രവാചകവാഗ്ദാനങ്ങളെ ഈ വാക്കുകൾ ഓർമിപ്പിക്കുന്നു (യെശയ്യാവ് 40:3; മലാഖി 3:1 താരതമ്യം ചെയ്യുക). ലൂക്കോസിന്റെ ആഖ്യാനത്തിൽ, യേശുവിനു മുമ്പുള്ള യോഹന്നാന്റെ ശുശ്രൂഷയിൽ ഇതു നിവൃത്തിയാകുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: നീയും
  rationale: സംസാരത്തിൽ കുഞ്ഞിലേക്കുള്ള ഊന്നിയ തിരിവും ചേർക്കൽഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παιδίον
  choice: കുഞ്ഞേ
  rationale: ശിശുവായ യോഹന്നാനോടുള്ള നേരിട്ടുള്ള സംബോധന സ്വാഭാവികമായും പ്രായം അനാവശ്യമായി കൃത്യമാക്കാതെയും നൽകുന്നു.
- source_word: προφήτης Ὑψίστου
  choice: അത്യുന്നതന്റെ പ്രവാചകൻ
  rationale: ദൈവിക ബഹുമാനനാമമായ Ὑψίστου എന്നതും അതിന്റെ ജനിറ്റീവ് ബന്ധവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: κληθήσῃ
  choice: എന്നു വിളിക്കപ്പെടും
  rationale: καλέωയുടെ ഭാവികാല കർമണി രൂപത്തിലെ നാമകരണം/അംഗീകാരം എന്ന ആശയം ഔപചാരികമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: προπορεύσῃ
  choice: മുമ്പിൽ ചെന്നു ... പോകും
  rationale: മുൻപേ പോകുക എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് തുടർന്നുള്ള ഉദ്ദേശ്യക്രിയയുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐνώπιον κυρίου
  choice: കർത്താവിന്റെ മുമ്പിൽ
  rationale: മുൻപേ പോകുക എന്നും സന്നിധിയിൽ ശുശ്രൂഷിക്കുക എന്നും ഗ്രഹിക്കാവുന്ന പ്രയോഗത്തിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യത നിലനിർത്തുന്നു.
- source_word: ἑτοιμάσαι
  choice: ഒരുക്കുവാൻ
  rationale: മുൻപേ പോകുന്നതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന അഓറിസ്റ്റ് ഇൻഫിനിറ്റീവിന് നേരിട്ടും സ്വാഭാവികവുമായ തർജമ.
- source_word: ὁδοὺς αὐτοῦ
  choice: അവന്റെ വഴികൾ
  rationale: മൂലത്തിലെ ബഹുവചനം നിലനിർത്തുകയും യെശയ്യാവ് 40:3, മലാഖി 3:1 എന്നിവയിലെ പ്രവാചകീയ പ്രതിധ്വനി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മുന്നോടി പ്രവചനത്തിലെ ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതൻ
  choice: പരിഭാഷയിൽ സൂചിതനെ പരിമിതപ്പെടുത്താതെ ‘കർത്താവ്’ എന്നു നിലനിർത്തുന്നു.
  alternative: പഴയനിയമ പശ്ചാത്തലത്തിൽ ദൈവം; ലൂക്കോസിന്റെ ആഖ്യാനനിവൃത്തിയിൽ യേശു
  rationale: പ്രയോഗം കർത്താവിന്റെ വഴി ഒരുക്കുന്നതിനെക്കുറിച്ചുള്ള പഴയനിയമ വാഗ്ദാനങ്ങളെ ഓർമിപ്പിക്കുമ്പോൾ, ലൂക്കോസ് യോഹന്നാനെ യേശുവിന്റെ മുന്നോടിയായി അവതരിപ്പിക്കുന്നു. ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഭാഷയിൽ തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഒരുക്കുവാൻ’ എന്ന രൂപം പ്രവാചകഗീതത്തിന്റെ ഗൗരവമുള്ള താളം നിലനിർത്തുന്നു; പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനനുസരിച്ചാണ്.
