id: LUK.1.18
reference: Luke 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: ml
  text: 'സെഖര്യാവ് ദൂതനോടു പറഞ്ഞു: “ഇത് ഞാൻ എങ്ങനെ അറിയും? ഞാൻ വൃദ്ധനാണ്; എന്റെ ഭാര്യയും പ്രായം വളരെ ചെന്നവളാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ സാധാരണ സംസാരക്രിയയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: πρὸς τὸν ἄγγελον
  choice: ദൂതനോടു
  rationale: സംസാരക്രിയയോടൊപ്പം πρός അഭിസംബോധന ചെയ്യപ്പെടുന്ന ആളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദൂതനോടു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: Κατὰ τί
  choice: എങ്ങനെ
  rationale: പ്രഖ്യാപിച്ച കാര്യം താൻ ഏത് അടിസ്ഥാനത്തിലോ മാർഗത്തിലോ ഉറപ്പായി അറിയുമെന്ന ചോദ്യമാണ്; ‘എങ്ങനെ’ ഈ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γνώσομαι
  choice: ഞാൻ ... അറിയും
  rationale: ഭാവികാലത്തിലെ അറിയലിനെയോ ഉറപ്പു ലഭിക്കലിനെയോ സൂചിപ്പിക്കുന്ന രൂപം സംരക്ഷിക്കുന്നു; കഴിവിനെ മാത്രം സൂചിപ്പിക്കുന്ന ‘അറിയാൻ കഴിയും’ എന്നതിലേക്കു മാറ്റുന്നില്ല.
- source_word: τοῦτο
  choice: ഇത്
  rationale: ദൂതന്റെ പ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്ന ലളിതമായ സർവനാമപ്രയോഗം.
- source_word: πρεσβύτης
  choice: വൃദ്ധൻ
  rationale: പദം പ്രായംചെന്ന പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്, ഔദ്യോഗിക സ്ഥാനമായ മൂപ്പനെ അല്ല; ‘വൃദ്ധൻ’ മാന്യവും നേരിട്ടുള്ളതുമാണ്.
- source_word: γυνή
  choice: ഭാര്യ
  rationale: ‘എന്റെ’ എന്ന ബന്ധസൂചനയും സന്ദർഭവും ചേർന്ന് ഇവിടെ ഭാര്യ എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: പ്രായം വളരെ ചെന്നവൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ നാളുകളിൽ മുന്നേറിയവൾ’ എന്ന ഗ്രീക്ക് പ്രയോഗം വാർധക്യത്തെ സൂചിപ്പിക്കുന്ന ശൈലിയാണ്; ആധുനിക മലയാളത്തിൽ ‘പ്രായം വളരെ ചെന്നവൾ’ അതിന്റെ അർഥവും ഊന്നലും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ἄγγελος എന്നതിന്റെ വിവർത്തനം
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: ἄγγελος പൊതുവായി സന്ദേശവാഹകൻ എന്നർഥമാകാമെങ്കിലും സമീപസന്ദർഭത്തിൽ പ്രത്യക്ഷപ്പെട്ടു സംസാരിക്കുന്നത് ഗബ്രിയേലാണ്; അതിനാൽ മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായ ‘ദൂതൻ’ സന്ദർഭോചിതമാണ്, അധികമായ ഉപദേശവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ വാർധക്യസൂചക ശൈലി അക്ഷരാർഥമായി ‘തന്റെ നാളുകളിൽ മുന്നേറിയവൾ’ എന്നു നൽകാതെ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന രീതിയിൽ അവതരിപ്പിച്ചു.
