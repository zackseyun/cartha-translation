translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ തുടരുന്ന കാത്തിരിപ്പിന്റെ ഭാവം നിലനിർത്തി. ναός എന്ന പദത്തിന്റെ കൃത്യമായ സ്ഥലസൂചന പ്രധാനവാചകത്തിൽ ‘വിശുദ്ധമന്ദിരം’ എന്നും അടിക്കുറിപ്പിൽ വിശദീകരിച്ചും നൽകി.
