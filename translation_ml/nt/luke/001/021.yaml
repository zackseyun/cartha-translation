reference: Luke 1:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: ml
  text: ജനം സെഖര്യാവിനായി കാത്തിരിക്കുകയായിരുന്നു; അദ്ദേഹം വിശുദ്ധമന്ദിരത്തിൽ[a] വൈകുന്നതിൽ അവർ ആശ്ചര്യപ്പെടുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദം ദേവാലയത്തിന്റെ വിശാലമായ പ്രാകാരങ്ങളെയല്ല, ദേവാലയത്തിന്റെ വിശുദ്ധമായ ആന്തരിക മന്ദിരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: ജനം
  rationale: പുറത്ത് കൂടിയിരുന്ന ആളുകളെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന സമാഹാര ഏകവചനത്തിന് സ്വാഭാവികമായ മലയാളം.
- source_word: προσδοκῶν
  choice: കാത്തിരിക്കുകയായിരുന്നു
  rationale: ἦν എന്ന ക്രിയയോടുകൂടിയ പങ്കാളിത്തരൂപം തുടരുന്ന ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം ആ ദൈർഘ്യം നിലനിർത്തുന്നു.
- source_word: Ζαχαρίαν
  choice: സെഖര്യാവ്
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും മൂലനാമത്തോട് ചേർന്നുനിൽക്കുന്നതുമായ നാമരൂപം.
- source_word: ἐθαύμαζον
  choice: ആശ്ചര്യപ്പെട്ടു
  rationale: അവർ തുടർച്ചയായി പ്രകടിപ്പിച്ച വിസ്മയപ്രതികരണം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും സംശയമോ ആലോചനയോ ആയി അർഥം ദുർബലപ്പെടുത്തുന്നില്ല.
- source_word: ἐν τῷ χρονίζειν
  choice: താമസിക്കുന്നതിൽ
  rationale: പ്രതീക്ഷിച്ചതിലും കൂടുതൽ സമയം എടുക്കുന്നതാണ് അവരുടെ ആശ്ചര്യത്തിനുള്ള സാഹചര്യമെന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു; വൈകിപ്പിക്കൽ മനഃപൂർവമാണെന്ന് നിർബന്ധിക്കുന്നില്ല.
- source_word: ναῷ
  choice: വിശുദ്ധമന്ദിരത്തിൽ
  rationale: ναός വിശാലമായ ദേവാലയപരിസരത്തേക്കാൾ ദേവാലയത്തിന്റെ വിശുദ്ധമായ ആന്തരിക മന്ദിരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ കൂടുതൽ കൃത്യമായ പദം തെരഞ്ഞെടുത്തു.
- source_word: αὐτόν
  choice: അദ്ദേഹം
  rationale: ക്രോണിസെയ്ൻ എന്ന അവ്യയക്രിയയുടെ ആക്ഷേപകവിഭക്തിയിലുള്ള കർത്താവിനെ മലയാള ഉപവാക്യത്തിൽ ആദരസൂചക സർവനാമമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
