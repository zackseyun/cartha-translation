id: LUK.1.56
reference: Luke 1:56
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: ml
  text: മറിയ അവളോടൊപ്പം ഏകദേശം മൂന്നു മാസം താമസിച്ചു; പിന്നെ സ്വന്തം വീട്ടിലേക്കു മടങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔμεινεν
  choice: താമസിച്ചു
  rationale: ഒരു സ്ഥലത്ത് ഒരു കാലയളവോളം തുടരുക എന്ന μένωയുടെ സന്ദർഭാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പിന്നെ
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, ലഘുവായ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ രണ്ടാമത്തെ സംഭവത്തെ ബന്ധിപ്പിക്കാൻ ‘പിന്നെ’ സ്വാഭാവികമാണ്.
- source_word: Μαριὰμ
  choice: മറിയ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും മൂലരൂപത്തോടു ചേർന്നതുമായ ലിപ്യന്തരണം.
- source_word: σὺν αὐτῇ
  choice: അവളോടൊപ്പം
  rationale: σύν + ദത്തിവിന്റെ സഹവാസാർഥം നേരിട്ട് നൽകുന്നു; സന്ദർഭത്തിൽ ‘അവൾ’ എലിസബത്തിനെ സൂചിപ്പിക്കുന്നു, എന്നാൽ മൂലപാഠത്തിലെ സർവനാമം തന്നെ നിലനിർത്തുന്നു.
- source_word: ὡς μῆνας τρεῖς
  choice: ഏകദേശം മൂന്നു മാസം
  rationale: കാലയളവിനു മുമ്പുള്ള ὡς സൂചിപ്പിക്കുന്ന ഏകദേശത കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: ὑπέστρεψεν
  choice: മടങ്ങിപ്പോയി
  rationale: മുമ്പുണ്ടായിരുന്ന സ്ഥലത്തേക്ക് തിരിച്ചുപോകുക എന്ന അർഥം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: സ്വന്തം വീട്ടിലേക്കു
  rationale: ഇവിടെ οἶκος കുടുംബസമൂഹത്തേക്കാൾ സഞ്ചാരത്തിന്റെ ലക്ഷ്യമായ വാസസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സ്വന്തം’ αὐτῆςന്റെ സ്വാമിത്വാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ഏകദേശ കാലസൂചന മുഖ്യപാഠത്തിൽ തന്നെ വ്യക്തമായതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല. മൂലത്തിലെ മറിയയുടെ വീട്ടിലേക്കുള്ള മടങ്ങിവരവ് സ്വാഭാവികമായ ആഖ്യാനക്രമത്തിൽ അവതരിപ്പിച്ചു.
