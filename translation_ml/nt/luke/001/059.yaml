reference: Luke 1:59
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: ml
  text: എട്ടാം ദിവസം, ശിശുവിനെ പരിച്ഛേദനം ചെയ്യാൻ അവർ വന്നു. അവന്റെ പിതാവിന്റെ പേരനുസരിച്ച് അവനെ സെഖര്യാവ്[b] എന്നു വിളിക്കുകയായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ സെഖര്യാവ് എന്നു വിളിച്ചു.’ ഗ്രീക്കിലെ അപൂർണ്ണഭൂതകാല ക്രിയ നാമകരണം നടന്നുകൊണ്ടിരുന്നതോ ശ്രമിച്ചുകൊണ്ടിരുന്നതോ സൂചിപ്പിക്കാം; അടുത്ത വാക്യത്തിലെ തിരുത്തലുമായി ഇത് യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ പിതാവിന്റെ പേരനുസരിച്ച് അവനെ സെഖര്യാവ് എന്നു വിളിക്കുകയായിരുന്നു.’ കുടുംബാംഗത്തിന്റെ പേര് കുഞ്ഞിന് നൽകുന്ന പതിവിനെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്യാതെ സ്വാഭാവികമായ ആഖ്യാനക്രമത്തിൽ ഉൾപ്പെടുത്തി
  rationale: ഇത് ലൂക്കോസിന്റെ സാധാരണ സംഭവാവതരണ സൂത്രമാണ്. മലയാളത്തിൽ ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് ഇവിടെ അനാവശ്യമായ ഭാരമുണ്ടാക്കുന്നതിനാൽ, വാക്യത്തിന്റെ സമയാരംഭം അതിന്റെ ആഖ്യാനപ്രവർത്തനം സ്വാഭാവികമായി നിർവഹിക്കുന്നു.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: എട്ടാം ദിവസം
  rationale: നിശ്ചിത സമയത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: ἦλθον
  choice: അവർ വന്നു
  rationale: ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമാക്കാത്ത ബഹുവചനമാണ്; ആരെന്നു കൂട്ടിച്ചേർക്കാതെ അതേ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: περιτεμεῖν
  choice: പരിച്ഛേദനം ചെയ്യാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ന്റെ നേരിട്ടുള്ള വിവർത്തനം; ആധുനിക മലയാള ബൈബിൾഭാഷയിൽ മനസ്സിലാകുന്ന പദം.
- source_word: τὸ παιδίον
  choice: ശിശുവിനെ
  rationale: എട്ടുദിവസം പ്രായമുള്ള കുട്ടിയെന്ന സന്ദർഭത്തിന് ‘ശിശു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἐκάλουν
  choice: വിളിക്കുകയായിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലത്തിന്റെ നടന്നുകൊണ്ടിരുന്നോ ശ്രമിച്ചുകൊണ്ടിരുന്നോ ഉള്ള ഭാവം സംരക്ഷിക്കുകയും അടുത്ത വാക്യത്തിലെ തിരുത്തലിനുള്ള ആഖ്യാനപിരിമുറുക്ക് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: അവന്റെ അപ്പന്റെ പേരനുസരിച്ച്
  rationale: പിതാവിന്റെ പേരിട്ട് നാമകരണം ചെയ്യുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പേരിൽ’ എന്നത് ഉണ്ടാക്കാവുന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: Ζαχαρίαν
  choice: സെഖര്യാവ്
  rationale: മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ പരിചിതമായ, സെമിറ്റിക് മൂലരൂപത്തോട് ചേർന്നുനിൽക്കുന്ന നാമരൂപം.
