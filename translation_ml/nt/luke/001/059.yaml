translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ കർത്തൃ-അനിശ്ചിതത്വവും imperfect ക്രിയയുടെ പുരോഗമന/ശ്രമഭാവവും സംരക്ഷിച്ചിട്ടുണ്ട്; പുരാതനശൈലിയിലുള്ള ‘സംഭവിച്ചതെന്തെന്നാൽ’ ഒഴിവാക്കി.
