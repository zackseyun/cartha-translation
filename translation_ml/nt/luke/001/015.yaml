id: LUK.1.15
reference: Luke 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: ml
  text: കർത്താവിന്റെ മുമ്പാകെ അവൻ മഹാനായിരിക്കും. അവൻ വീഞ്ഞോ ലഹരിപാനീയമോ കുടിക്കുകയില്ല[a]; അമ്മയുടെ ഗർഭംമുതൽത്തന്നെ അവൻ പരിശുദ്ധാത്മാവിനാൽ നിറയപ്പെടും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ നിഷേധത്തിന് ശക്തമായ ഊന്നലുണ്ട്: “അവൻ ഒരിക്കലും വീഞ്ഞോ ലഹരിപാനീയമോ കുടിക്കുകയില്ല” എന്നും പരിഭാഷപ്പെടുത്താം. “ലഹരിപാനീയം” എന്നത് വീഞ്ഞല്ലാത്ത ലഹരിയുണ്ടാക്കുന്ന പാനീയത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: അഥവാ “അമ്മയുടെ ഗർഭത്തിൽ ആയിരിക്കുമ്പോൾത്തന്നെ.” ഗ്രീക്ക് പ്രയോഗം അവൻ അത്യന്തം പ്രാരംഭകാലത്തുതന്നെ പരിശുദ്ധാത്മാവിനാൽ നിറയപ്പെടുമെന്ന് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: മഹാനായിരിക്കും
  rationale: വലിപ്പമെന്നതിലുപരി പ്രാധാന്യവും ശ്രേഷ്ഠതയും സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സുതാര്യവുമായ വിവർത്തനം.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: കർത്താവിന്റെ മുമ്പാകെ
  rationale: ദൈവസന്നിധിയിലും ദൈവത്തിന്റെ വിലയിരുത്തലിലും എന്ന ബന്ധപരമായ അർഥം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: οἶνον καὶ σίκερα
  choice: വീഞ്ഞോ ലഹരിപാനീയമോ
  rationale: οἶνος എന്നത് ‘വീഞ്ഞ്’ എന്നും σίκερα എന്നത് വീഞ്ഞല്ലാത്ത ലഹരിയുണ്ടാക്കുന്ന പാനീയം എന്നും വേർതിരിക്കുന്നു; മലയാളത്തിൽ ‘ശക്തമായ പാനീയം’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമാണ്.
- source_word: οὐ μὴ πίῃ
  choice: കുടിക്കുകയില്ല
  rationale: οὐ μήയുടെ ഊന്നിയ നിഷേധം പ്രഖ്യാപനാത്മകമായ ഭാവികാലത്തിൽ നിലനിർത്തുന്നു; നിർബന്ധമോ കല്പനയോ എന്ന് മാത്രം തീരുമാനിക്കാതെ പ്രവചനത്തിന്റെയും സമർപ്പിതവിളിയുടെയും ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: പരിശുദ്ധാത്മാവിനാൽ നിറയപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും ദൈവിക പ്രവർത്തനത്തിന്റെ ആശയവും നിലനിർത്തുന്നു; മലയാളത്തിലെ സാധാരണ ക്രൈസ്തവ പ്രയോഗവുമാണിത്.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: അമ്മയുടെ ഗർഭത്തിൽ ആയിരിക്കുമ്പോൾത്തന്നെ
  rationale: ἔτιയുടെ ഊന്നലും ഗർഭാവസ്ഥയിലെ അത്യന്തം പ്രാരംഭ സമയസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: οὐ μὴ πίῃ എന്ന ഊന്നിയ നിഷേധം പ്രവചനമോ വിലക്കോ എന്ന ചോദ്യം
  choice: ‘കുടിക്കുകയില്ല’ എന്ന ഊന്നിയ ഭാവിപ്രഖ്യാപനം
  alternative: ‘ഒരിക്കലും കുടിക്കരുത്’ എന്ന നിർബന്ധാത്മക വിലക്ക്
  rationale: ഗ്രീക്ക് രൂപം ഭാവിയിൽ സംഭവിക്കാത്തതിനെ ശക്തമായി പ്രഖ്യാപിക്കുന്നു. യോഹന്നാന്റെ ദൈവനിയുക്ത സമർപ്പിതവിളി സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നുവെങ്കിലും, വാക്യത്തെ നേരിട്ടുള്ള കല്പനയായി മാറ്റുന്നത് ഒഴിവാക്കുന്നു.
- issue: πνεύματος ἁγίου എന്നതിന്റെ സൂചന
  choice: വ്യക്തിപരമായ ദൈവിക പരാമർശമായി ‘പരിശുദ്ധാത്മാവ്’
  alternative: വ്യക്തിത്വമില്ലാത്ത വിശുദ്ധ ശക്തി അല്ലെങ്കിൽ മനോഭാവം
  rationale: ലൂക്കോസിന്റെ സാഹിത്യസന്ദർഭത്തിൽ ഇത് ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; വിവർത്തനം ആ സന്ദർഭസൂചന പിന്തുടരുന്നു.
- issue: ἔτι ἐκ κοιλίας എന്ന സമയസൂചന
  choice: ‘ഗർഭത്തിൽ ആയിരിക്കുമ്പോൾത്തന്നെ’
  alternative: ‘അമ്മയുടെ ഗർഭംമുതൽ’
  rationale: ഗർഭകാലത്തുതന്നെയോ ജനനംമുതലോ എന്ന സൂക്ഷ്മ വ്യത്യാസം പൂർണമായി തീർപ്പാക്കാതെ, ഗ്രീക്ക് വാക്യത്തിന്റെ അത്യന്തം പ്രാരംഭ സമയസൂചന വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ മാന്യമായ മലയാളം. ഗ്രീക്കിലെ ഭാവിപ്രഖ്യാപനം നേരിട്ട് നിലനിർത്തുകയും നസീർവ്രതത്തെ പേരെടുത്ത് ചേർക്കാതിരിക്കുകയും ചെയ്തു.
