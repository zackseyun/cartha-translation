  - severity: low
    issue: The explanation of σίκερα calls it “മദ്യം കലർന്ന പാനീയം.”
    rationale: This may imply a beverage mixed with alcohol. The term denotes an intoxicating drink other than wine, not necessarily a mixed drink.
