id: LUK.1.6
reference: Luke 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: ml
  text: അവർ ഇരുവരും ദൈവത്തിന്റെ മുമ്പാകെ നീതിമാന്മാരായിരുന്നു; കർത്താവിന്റെ എല്ലാ കല്പനകളും ചട്ടങ്ങളും അനുസരിച്ച് കുറ്റമറ്റവരായി ജീവിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കർത്താവിന്റെ എല്ലാ കല്പനകളിലും ചട്ടങ്ങളിലും കുറ്റമറ്റവരായി നടന്നു.”'
    reason: ‘ജീവിച്ചു’ എന്നു വിവർത്തനം ചെയ്ത πορευόμενοι എന്ന ജീവിതനടപ്പിന്റെ രൂപകവും ἄμεμπτοι എന്ന വിശേഷണത്തിന്റെ മൂലവാക്യഘടനയും കൂടുതൽ അക്ഷരാർഥത്തിൽ കാണിക്കുന്ന പരിഭാഷ.
lexical_decisions:
- source_word: δίκαιοι
  choice: നീതിമാന്മാർ
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലിൽ ശരിയായവരും ഉടമ്പടിയോടു വിശ്വസ്തരുമെന്ന ബൈബിൾപരമായ ധാർമിക അർഥം നിലനിർത്തുന്നു.
- source_word: ἀμφότεροι
  choice: അവർ ഇരുവരും
  rationale: വിവരണം സെഖര്യാവിനും എലിസബത്തിനും ഒരുപോലെ ബാധകമാണെന്ന ഊന്നൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മുമ്പാകെ
  rationale: ദൈവസന്നിധിയിലും ദൈവത്തിന്റെ വിലയിരുത്തലിലും എന്ന ബന്ധപരവും മൂല്യനിർണയപരവുമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: πορευόμενοι
  choice: ജീവിച്ചു
  rationale: പദശഃ ‘നടന്നുകൊണ്ട്’ എന്നാണെങ്കിലും ഇവിടെ ജീവിതരീതിയെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘ജീവിച്ചു’ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: എല്ലാ കല്പനകളും … അനുസരിച്ച്
  rationale: πάσαις നൽകുന്ന സമഗ്രതയും അനുസരണത്തിന്റെ ആശയവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δικαιώμασιν
  choice: ചട്ടങ്ങളും
  rationale: കല്പനകളോടൊപ്പം വരുന്ന നിർദേശിത നിയമവ്യവസ്ഥകൾ എന്ന അർഥം നിലനിർത്തുകയും രണ്ട് പദങ്ങൾക്കിടയിലെ വ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെ ഉടമ്പടിയുടെ കർത്താവായി സൂചിപ്പിക്കുന്ന സാധാരണ ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἄμεμπτοι
  choice: കുറ്റമറ്റവരായി
  rationale: വ്യാകരണപരമായി വിശേഷണമായ പദത്തെ അതിന്റെ ശക്തി കുറയ്ക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ അപവാദത്തിന് ഇടനൽകാത്ത വിശ്വസ്തമായ ജീവിതത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἦσαν δὲ
  choice: … ആയിരുന്നു
  rationale: δέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധകമാണ്; മുൻവാക്യബന്ധം മലയാളത്തിൽ വേറെ ബന്ധകമില്ലാതെയും സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ കൃത്രിമമായ ‘എന്നാൽ’ ഒഴിവാക്കി.
theological_decisions:
- issue: ἄμεμπτοι സമ്പൂർണ പാപരാഹിത്യത്തെ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘കുറ്റമറ്റവരായി’ എന്ന ശക്തമായ പദം നിലനിർത്തി; വാക്യത്തിൽ അതിനെ സമ്പൂർണ പാപരാഹിത്യം എന്നു വ്യാഖ്യാനിച്ചില്ല.
  alternative: ‘കുറ്റപ്പെടുത്താനാകാത്തവിധം’ എന്നു വിശദീകരിച്ച് അർഥം പരിമിതപ്പെടുത്തുക.
  rationale: മൂലപാഠം അവരുടെ കല്പനാനുസൃതമായ ജീവിതത്തെ അപവാദരഹിതമെന്ന് ശക്തമായി വിശേഷിപ്പിക്കുന്നു; എന്നാൽ സമ്പൂർണ പാപരാഹിത്യം എന്ന സിദ്ധാന്തപരമായ നിഗമനം നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ശക്തിയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നീതിമാന്മാർ’, ‘കല്പനകൾ’, ‘കർത്താവ്’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ‘നടന്നു’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘ജീവിച്ചു’ എന്നും അടിക്കുറിപ്പിൽ അക്ഷരാർഥരൂപത്തിലും നൽകി.
