  source_fidelity: 'The Malayalam faithfully represents all principal elements: both individuals, their righteousness before God, their comprehensive observance of the Lord’s commandments and ordinances, and their blameless manner of life. “ജീവിച്ചു” appropriately conveys the ethical-lifestyle force of πορευόμενοι without overstating a literal walking sense.'
