id: LUK.1.30
reference: Luke 1:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: ml
  text: 'ദൂതൻ അവളോടു പറഞ്ഞു: “മറിയമേ, ഭയപ്പെടേണ്ട; നീ ദൈവസന്നിധിയിൽ പ്രീതി[a] നേടിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൃപ.” χάρις എന്ന ഗ്രീക്ക് പദത്തിന് “കൃപ” എന്നും “പ്രീതി” എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ «ദൈവസന്നിധിയിൽ പ്രീതി നേടുക» എന്ന പ്രയോഗത്തിൽ “പ്രീതി” സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: ἄγγελος
  choice: ദൂതൻ
  rationale: ലൂക്കോസിന്റെ ഈ സന്ദർഭത്തിൽ സ്വർഗീയദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ ഉപയോഗത്തിലും ‘ദൂതൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: Μὴ φοβοῦ
  choice: ഭയപ്പെടേണ്ട
  rationale: μή ചേർന്ന ആജ്ഞാരൂപം വിലക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഭയപ്പെടേണ്ട’ ആധുനിക മലയാളത്തിൽ ആശ്വാസം നൽകുന്ന സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: Μαριάμ
  choice: മറിയമേ
  rationale: നേരിട്ടുള്ള അഭിസംബോധന വ്യക്തമാക്കാൻ മലയാളത്തിലെ സംബോധനരൂപം ഉപയോഗിച്ചു.
- source_word: εὗρες
  choice: നിനക്കു ലഭിച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്ക് രൂപം ഭൂതകാലമാണെങ്കിലും, അതിന്റെ ഇപ്പോഴുള്ള ഫലാവസ്ഥ ഈ പ്രഖ്യാപനത്തിൽ പ്രധാനമാണ്; മലയാളത്തിലെ പൂർത്തീകരണരൂപം അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: χάριν
  choice: പ്രീതി
  rationale: εὑρίσκω χάριν എന്ന പ്രയോഗത്തിൽ ഒരാളുടെ അനുകൂലമായ അംഗീകാരമോ പ്രസാദമോ ലഭിക്കുക എന്നതാണ് അർഥം; ‘പ്രീതി’ ഇവിടെ ആ ബന്ധപരമായ അർഥം വ്യക്തമാക്കുന്നു, ‘കൃപ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παρὰ τῷ θεῷ
  choice: ദൈവത്തിന്റെ
  rationale: ‘ദൈവസന്നിധിയിൽ/ദൈവത്തിന്റെ അടുക്കൽ പ്രീതി കണ്ടെത്തുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളവത്കരണമാണ് ‘ദൈവത്തിന്റെ പ്രീതി ലഭിക്കുക’.
theological_decisions:
- issue: മറിയവുമായി ബന്ധപ്പെട്ട സന്ദർഭത്തിൽ χάριν എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പ്രീതി
  alternative: കൃപ
  rationale: εὑρίσκω χάριν παρά + dative എന്നത് ‘ഒരാളുടെ പ്രീതി ലഭിക്കുക’ എന്ന പതിവുശൈലിയാണ്. ‘പ്രീതി’ ആ ശൈലിയുടെ സന്ദർഭാർഥം നൽകുന്നു; ‘കൃപ’ എന്ന യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നതിലൂടെ പിൽക്കാല സിദ്ധാന്തപരമായ വ്യാഖ്യാനം വാക്യത്തിലേക്ക് മുൻകൂട്ടി കൊണ്ടുവരുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പരമ്പരാഗത ബൈബിൾപദമായ ‘ദൂതൻ’ നിലനിർത്തി; പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കി.
