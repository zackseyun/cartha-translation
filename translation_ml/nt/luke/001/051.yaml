id: LUK.1.51
reference: Luke 1:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐποίησεν κράτος ἐν βραχίονι αὐτοῦ, διεσκόρπισεν ὑπερηφάνους διανοίᾳ καρδίας αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: ml
  text: അവൻ തന്റെ ഭുജത്താൽ ശക്തി പ്രകടമാക്കി; അവരുടെ ഹൃദയത്തിലെ ചിന്തകളിൽ അഹങ്കരിക്കുന്നവരെ അവൻ ചിതറിച്ചുകളഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ ഹൃദയത്തിന്റെ ഉദ്ദേശ്യത്താൽ അഹങ്കരിക്കുന്നവരെ അവൻ ചിതറിച്ചുകളഞ്ഞു,” അല്ലെങ്കിൽ “അവരുടെ ഹൃദയത്തിന്റെ ഭാവനയിൽ അഹങ്കരിക്കുന്നവരെ അവൻ ചിതറിച്ചുകളഞ്ഞു.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: ശക്തി പ്രകടമാക്കി
  rationale: ‘ശക്തി ചെയ്തു’ എന്ന ഗ്രീക്ക് പ്രയോഗം ശക്തമായ പ്രവൃത്തി നടത്തുകയോ ശക്തി വെളിപ്പെടുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ശക്തി പ്രകടമാക്കി’ എന്നത് അതിന്റെ അർഥവും കാവ്യഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: തന്റെ ഭുജത്താൽ
  rationale: ἐν ഇവിടെ ഉപകരണാർഥത്തിൽ വരുന്നു. ദൈവത്തിന്റെ ശക്തമായ ‘ഭുജം’ എന്ന പഴയനിയമ രൂപകം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: διεσκόρπισεν
  choice: ചിതറിച്ചുകളഞ്ഞു
  rationale: ക്രിയയുടെ അർഥം ചിതറിക്കുക, പല ദിക്കുകളിലാക്കുക എന്നതാണ്. ‘ചിതറിച്ചുകളഞ്ഞു’ നിർണായകമായ പൂർത്തീകരിച്ച പ്രവർത്തനത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: ὑπερηφάνους
  choice: അഹങ്കരിക്കുന്നവരെ
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന ബഹുവചന വിശേഷണം അഹങ്കാരികളായ ആളുകളെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: ഹൃദയത്തിലെ ചിന്തകളിൽ
  rationale: διάνοια ചിന്ത, മനോഭാവം, ഉദ്ദേശ്യം എന്നിവ സൂചിപ്പിക്കാം; καρδία ആന്തരിക വ്യക്തിത്വത്തിന്റെയും ചിന്തയുടെയും കേന്ദ്രമാണ്. ഉറവിടത്തിലെ സെമിറ്റിക് സ്വഭാവമുള്ള ബന്ധം പരമാവധി നിലനിർത്തുന്ന സംക്ഷിപ്ത മലയാളമാണിത്.
theological_decisions:
- issue: മറിയത്തിന്റെ സ്തുതിഗീതത്തിലെ ഗ്രീക്ക് aorist ക്രിയകളുടെ കാലഭാവം
  choice: 'മലയാളത്തിൽ പൂർത്തിയായ ഭൂതകാലം: ‘പ്രകടമാക്കി’, ‘ചിതറിച്ചുകളഞ്ഞു’'
  alternative: ‘പ്രകടമാക്കിയിരിക്കുന്നു’, ‘ചിതറിച്ചിരിക്കുന്നു’ എന്ന വർത്തമാനപൂർണ ഭാവം
  rationale: മലയാളത്തിലെ ലളിത ഭൂതകാലം ഗ്രീക്ക് aorist-ന്റെ നിർണായകവും സമഗ്രവുമായ പ്രവർത്തനഭാവം സ്വാഭാവികമായി നൽകുന്നു. സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ചരിത്രപരവും ഉറപ്പുള്ളതുമായ പ്രവൃത്തികളെ പ്രവചനാത്മകമോ സംഗ്രഹാത്മകമോ ആയി പ്രഖ്യാപിക്കുന്ന സാധ്യത തുറന്നുവയ്ക്കുന്നു.
- issue: διανοίᾳ എന്നതിന്റെ വാക്യഘടനാപരമായ ബന്ധം
  choice: അഹങ്കാരത്തിന്റെ ആന്തരിക മേഖല എന്ന നിലയിൽ ‘ഹൃദയത്തിലെ ചിന്തകളിൽ’
  alternative: ‘ഹൃദയത്തിന്റെ ഉദ്ദേശ്യത്താൽ’ എന്ന ഉപകരണാർഥം
  rationale: ἐν ഇല്ലാത്ത ദത്തിവ് രൂപമായ διανοίᾳ മേഖല, വിധം, അല്ലെങ്കിൽ കാരണം/ഉപകരണം എന്നിങ്ങനെ ഗ്രഹിക്കാം. പ്രധാന വാചകം ആന്തരിക ചിന്താമേഖലയെ സൂചിപ്പിക്കുന്നു; മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഭുജം’ എന്ന തിരുവെഴുത്തുസംബന്ധിയായ രൂപകം നിലനിർത്തി; അത്യന്തം സംസ്കൃതഭാരമുള്ള പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ദ്വയാർഥമുള്ള രണ്ടാം ഉപവാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
