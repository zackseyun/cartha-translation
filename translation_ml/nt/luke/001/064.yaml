source:
  edition: SBLGNT
  text: ἀνεῴχθη δὲ τὸ στόμα αὐτοῦ παραχρῆμα καὶ ἡ γλῶσσα αὐτοῦ, καὶ ἐλάλει εὐλογῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/064.yaml
  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: ml
  text: ഉടനെ അവന്റെ വായും നാവും തുറക്കപ്പെട്ടു[a]. അവൻ ദൈവത്തെ വാഴ്ത്തിക്കൊണ്ട് സംസാരിച്ചുതുടങ്ങി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘അവന്റെ വായ് ഉടനെ തുറക്കപ്പെട്ടു, അവന്റെ നാവും’ എന്നാണ്; ‘നാവ്’ എന്നതിന് ക്രിയ എലിപ്‌സിസായി നിൽക്കുന്നു. ചില വിവർത്തനങ്ങൾ ‘നാവിന്റെ കെട്ടഴിഞ്ഞു’ എന്നു നൽകുന്നു, എന്നാൽ ‘കെട്ടഴിഞ്ഞു’ എന്ന പദം ഇവിടെ ഗ്രീക്ക് പാഠത്തിലില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവൻ ദൈവത്തെ വാഴ്ത്തിക്കൊണ്ട് സംസാരിച്ചുകൊണ്ടിരുന്നു.’ ഗ്രീക്കിലെ അപൂർണഭൂതകാലക്രിയ സംസാരത്തിന്റെ ആരംഭത്തെക്കാൾ അതിന്റെ തുടർച്ചയ്ക്കും ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: തുറക്കപ്പെട്ടു
  rationale: ἀνοίγω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിപ്രയോഗരൂപത്തെ പ്രതിഫലിപ്പിക്കുന്നു; പ്രവർത്തകനെ പാഠം വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനവും വ്യക്തമാക്കുന്നില്ല.
- source_word: δὲ
  choice: വാക്യക്രമത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഇവിടെ δέ കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ സ്വാഭാവികമായി തുടർച്ച നിലനിർത്താം.
- source_word: στόμα
  choice: വായ്
  rationale: സംസാരശേഷി വീണ്ടെടുക്കുന്ന സന്ദർഭത്തിന് യോജിച്ച നേരിട്ടുള്ള ശരീരാവയവപദം.
- source_word: παραχρῆμα
  choice: ഉടനെ
  rationale: സംഭവത്തിന്റെ പെട്ടെന്നുള്ളതും നേരിട്ടുള്ള കാലക്രമവും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἡ γλῶσσα αὐτοῦ
  choice: നാവും സ്വതന്ത്രമായി
  rationale: ഗ്രീക്ക് പാഠം നാവിനെയും പ്രത്യേകം പരാമർശിക്കുന്നു. മലയാളത്തിൽ അപൂർണമായ വാക്യഘടന ഒഴിവാക്കി സംസാരശേഷി തിരിച്ചുകിട്ടിയതെന്ന സന്ദർഭാർഥം നൽകുന്നു; എന്നാൽ ‘നാവിന്റെ കെട്ടഴിഞ്ഞു’ എന്ന പാഠത്തിലില്ലാത്ത രൂപകം ഒഴിവാക്കുന്നു.
- source_word: ἐλάλει
  choice: സംസാരിച്ചുതുടങ്ങി
  rationale: അപൂർണഭൂതകാലക്രിയ തുടർച്ചയായ സംസാരത്തെയോ സംസാരത്തിന്റെ ആരംഭത്തെയോ സൂചിപ്പിക്കാം. മുമ്പത്തെ മൗനാവസ്ഥയ്ക്കുശേഷമുള്ള കഥാസന്ദർഭത്തിൽ ആരംഭാർഥം പ്രധാനപാഠത്തിൽ സ്വാഭാവികമാണ്; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εὐλογῶν
  choice: വാഴ്ത്തിക്കൊണ്ട്
  rationale: സംസാരത്തിന്റെ രീതിയെയോ ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപം; ദൈവത്തെ അനുഗ്രഹിക്കുന്നു എന്ന മലയാളത്തിലെ തെറ്റിദ്ധാരണ ഒഴിവാക്കി ദൈവസ്തുതിയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τὸν θεόν
  choice: ദൈവത്തെ
  rationale: εὐλογῶν എന്ന കൃദന്തത്തിന്റെ നേരിട്ടുള്ള കർമം; സാധാരണ മലയാള ദൈവനാമപ്രയോഗം.
