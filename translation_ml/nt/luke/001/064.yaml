  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്കിലെ കർമണിപ്രയോഗവും സംസാരത്തിന്റെ ആരംഭം/തുടർച്ച എന്ന അർഥസാധ്യതയും സംരക്ഷിച്ചു. ‘നാവിന്റെ കെട്ടഴിഞ്ഞു’ എന്ന പരമ്പരാഗതമായെങ്കിലും പാഠത്തിൽ നേരിട്ട് ഇല്ലാത്ത രൂപകം പ്രധാനപാഠത്തിൽ ഒഴിവാക്കി.
