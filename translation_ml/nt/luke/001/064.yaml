  source_fidelity: പ്രധാനപാഠത്തിലെ ‘നാവും സ്വതന്ത്രമായി’ ഗ്രീക്കിൽ വ്യക്തമായി പറയാത്ത ഒരു പൂരകക്രിയ ചേർക്കുന്നു. ഗ്രീക്ക് വായ് തുറക്കപ്പെട്ടതും നാവിനെ പ്രത്യേകമായി പരാമർശിക്കുന്നതുമാണ് പറയുന്നത്; നാവിന്റെ കാര്യത്തിൽ ക്രിയ എലിപ്‌സിസായി നിൽക്കുന്നു. അതിനാൽ അതിനെ ‘സ്വതന്ത്രമായി’ എന്നു നിർവചിക്കുന്നത് ഒഴിവാക്കണം. ἐλάλειയുടെ ആരംഭാർഥം സന്ദർഭത്തിൽ സ്വീകരിക്കാവുന്നതാണ്; തുടർച്ചാർഥം അടിക്കുറിപ്പിൽ ശരിയായി സംരക്ഷിച്ചിട്ടുണ്ട്.
