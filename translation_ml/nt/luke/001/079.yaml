id: LUK.1.79
reference: Luke 1:79
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: ml
  text: ഇരുട്ടിലും മരണത്തിന്റെ നിഴലിലും ഇരിക്കുന്നവരുടെമേൽ പ്രകാശിക്കാനും[a], നമ്മുടെ കാലുകളെ സമാധാനത്തിന്റെ വഴിയിലേക്കു നയിക്കാനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മരണനിഴലിലും.” ചിലർ ഈ പ്രയോഗത്തെ കൂടുതൽ വിശാലമായി “കൂരിരുട്ട്” എന്നു മനസ്സിലാക്കുന്നു; എന്നാൽ ഗ്രീക്കിൽ “മരണം” എന്ന പദം വ്യക്തമായി ഉണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: മേൽ പ്രകാശിക്കാനും
  rationale: വെളിച്ചം ഇരുട്ടിലേക്കു കടന്നുവരുന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘പ്രത്യക്ഷപ്പെടുക’ എന്നതിനെക്കാൾ സന്ദർഭത്തിലെ പ്രകാശരൂപകം വ്യക്തമായി പകരുന്നു.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: ഇരുട്ടിൽ ... ഇരിക്കുന്നവരുടെ
  rationale: καθημένοις എന്നതിലെ ‘ഇരിക്കുക’ എന്ന സജീവ ദൃശ്യഭാവവും യെശയ്യാവുമായുള്ള അന്തർപാഠബന്ധവും നിലനിർത്തുന്നു.
- source_word: σκότει
  choice: ഇരുട്ട്
  rationale: പദത്തിന്റെ നേരിട്ടുള്ളതും രൂപകാത്മകവുമായ സാധ്യതകൾ വിശദീകരിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: σκιᾷ θανάτου
  choice: മരണനിഴൽ
  rationale: ഗ്രീക്കിൽ ‘മരണം’ വ്യക്തമായി ഉള്ളതിനാൽ അതു നിലനിർത്തുന്നു; ‘മരണത്തിന്റെ നിഴൽ’ എന്ന ആശയം മലയാളത്തിൽ കാവ്യാത്മകവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: τοῦ κατευθῦναι
  choice: നയിക്കാനും
  rationale: ഉദ്ദേശ്യസൂചകമായ infinitive-നെയും കാലുകൾക്കും വഴിക്കും ചേർന്ന ദിശാനിർദേശഭാവത്തെയും സ്വാഭാവികമായി പകരുന്നു.
- source_word: τοὺς πόδας ἡμῶν
  choice: നമ്മുടെ കാലുകളെ
  rationale: ശാരീരിക രൂപകം ‘നമ്മെ’ എന്നു സാമാന്യവൽക്കരിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: εἰς ὁδὸν εἰρήνης
  choice: സമാധാനത്തിന്റെ വഴിയിലേക്കു
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യദിശയും ὁδός എന്ന വഴിരൂപകവും εἰρήνη എന്ന സമാധാനവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഇരുട്ട്, മരണനിഴൽ, കാലുകൾ, വഴി എന്നീ രൂപകങ്ങളുടെ വ്യാഖ്യാനം
  choice: രൂപകങ്ങൾ വിശദീകരിക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: ‘ആത്മീയ ഇരുട്ടിലുള്ളവർക്ക് വെളിച്ചം നൽകാനും സമാധാനം നൽകുന്ന ജീവിതത്തിലേക്കു നമ്മെ നയിക്കാനും’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ
  rationale: ഗ്രീക്ക് വാക്യം കാവ്യാത്മകവും തിരുവെഴുത്തുപരമായ പ്രതിധ്വനിയുള്ളതുമാണ്. രൂപകങ്ങളെ ആത്മീയ അജ്ഞത, മരണഭീഷണി, അല്ലെങ്കിൽ നൈതികജീവിതം എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്കു ചുരുക്കുന്നത് യഥാർത്ഥ അർത്ഥവ്യാപ്തി ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ കാവ്യാത്മക സമാന്തരതയും വെളിച്ചം–ഇരുട്ട്, കാലുകൾ–വഴി എന്നീ ദൃശ്യരൂപകങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
