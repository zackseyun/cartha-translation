source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: ml
  text: 'ദൂതൻ അവനോടു മറുപടി പറഞ്ഞു: “ഞാൻ ദൈവസന്നിധിയിൽ നിൽക്കുന്ന ഗബ്രിയേൽ ആണ്. നിന്നോടു സംസാരിക്കാനും ഈ സുവാർത്ത നിനക്കു അറിയിക്കാനും എന്നെ അയച്ചിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ കാര്യങ്ങൾ നിനക്കു സുവാർത്തയായി അറിയിക്കാനും.” ഗ്രീക്കിൽ അക്ഷരാർഥം “ഈ കാര്യങ്ങൾ നിനക്കു സുവാർത്ത അറിയിക്കാൻ” എന്നാണ്; “ഈ കാര്യങ്ങൾ” എന്നത് ഗബ്രിയേൽ ഇപ്പോൾ അറിയിച്ച സന്ദേശത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: മറുപടി പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന aorist participle മലയാളത്തിൽ സ്വാഭാവികമായ സമാപിക ക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἄγγελος
  choice: ദൂതൻ
  rationale: ഗബ്രിയേൽ എന്ന സ്വയംപരിചയം ഇവിടെ സ്വർഗീയ ദൂതനെയാണു സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ ഭാഷയിൽ ‘ദൂതൻ’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: ഞാൻ ... ഗബ്രിയേൽ ആണ്
  rationale: പ്രകടമായ ἐγώ നൽകുന്ന ഊന്നൽ ‘ഞാൻ’ എന്ന സർവനാമത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ὁ παρεστηκὼς
  choice: നിൽക്കുന്ന
  rationale: Perfect participle സൂചിപ്പിക്കുന്ന തുടരുന്ന സ്ഥാനവും പദവിയും ലളിതമായ വർത്തമാന വിശേഷണരൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിലുള്ള സാന്നിധ്യവും രാജസദസ്സുസദൃശമായ സേവനസ്ഥാനവും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπεστάλην
  choice: എന്നെ അയച്ചിരിക്കുന്നു
  rationale: ദൈവിക നിയോഗത്തെ സൂചിപ്പിക്കുന്ന passive ഭാവം നിലനിർത്തുന്നു; അയച്ചതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: λαλῆσαι πρὸς σὲ
  choice: നിന്നോടു സംസാരിക്കാൻ
  rationale: അയച്ചതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന infinitive മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: εὐαγγελίσασθαί σοι
  choice: സുവാർത്ത നിന്നെ അറിയിക്കാൻ
  rationale: ക്രിയയുടെ ‘നല്ല വാർത്ത അറിയിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘സുവിശേഷം’ എന്ന സാങ്കേതികമായി കേൾക്കാവുന്ന പദത്തെക്കാൾ ഈ സന്ദർഭത്തിൽ ‘സുവാർത്ത’ സ്വാഭാവികമാണ്.
- source_word: ταῦτα
  choice: ഈ സുവാർത്ത
  rationale: അക്ഷരാർഥം ‘ഈ കാര്യങ്ങൾ’ ആണെങ്കിലും, εὐαγγελίζωയോടൊപ്പം ഇത് ഗബ്രിയേൽ ഇപ്പോൾ പ്രഖ്യാപിച്ച സന്ദേശത്തെ സൂചിപ്പിക്കുന്നു; പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായ സംയുക്തപ്രയോഗം നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: εὐαγγελίζω എന്ന പദത്തിന്റെ ദൂതസന്ദേശസന്ദർഭത്തിലെ പരിഭാഷ
  choice: സുവാർത്ത ... അറിയിക്കാൻ
  alternative: സുവിശേഷം അറിയിക്കാൻ / സന്തോഷവാർത്ത അറിയിക്കാൻ
  rationale: ‘സുവാർത്ത’ മൂലക്രിയയിലെ നല്ല വാർത്ത എന്ന ആശയവും ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; ഈ ഘട്ടത്തിൽ പിൽക്കാല സാങ്കേതിക അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ദൈവസന്നിധിയിൽ’ എന്ന പ്രയോഗം ഗൗരവം നിലനിർത്തുന്നു; വാക്യഘടന സംസാരഭാഷയിലേക്കു താഴാതെ സ്വാഭാവികമായി സൂക്ഷിച്ചിരിക്കുന്നു.
