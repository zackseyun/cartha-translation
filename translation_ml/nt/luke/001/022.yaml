id: LUK.1.22
reference: Luke 1:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: ml
  text: എന്നാൽ അവൻ പുറത്തുവന്നപ്പോൾ, അവരോടു സംസാരിക്കാൻ കഴിഞ്ഞില്ല. വിശുദ്ധമന്ദിരത്തിൽ[a] അവൻ ഒരു ദർശനം കണ്ടിട്ടുണ്ടെന്ന് അവർ മനസ്സിലാക്കി. അവൻ അവർക്ക് ആംഗ്യങ്ങൾ കാണിച്ചുകൊണ്ടിരുന്നു; ഊമനായിത്തന്നെ[b] തുടർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവാലയത്തിൽ’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം മുഴുവൻ ദൈവാലയസമുച്ചയത്തേക്കാൾ അതിലെ വിശുദ്ധമന്ദിരത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് പദത്തിന് ‘ഊമൻ’ എന്ന അർഥമുണ്ട്; ചില സന്ദർഭങ്ങളിൽ അത് ‘ബധിരൻ’ എന്നും അർഥമാക്കാം.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐξελθὼν
  choice: അവൻ പുറത്തുവന്നപ്പോൾ
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള സംഭവത്തെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: സംസാരിക്കാൻ കഴിഞ്ഞില്ല
  rationale: δύναμαι + infinitive എന്ന ഘടനയിലെ കഴിവില്ലായ്മ വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπέγνωσαν
  choice: അവർ മനസ്സിലാക്കി
  rationale: കണ്ട തെളിവുകളിൽനിന്ന് അവർ വ്യക്തമായ നിഗമനത്തിലെത്തി എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: ὀπτασίαν
  choice: ഒരു ദർശനം
  rationale: ഈ സന്ദർഭത്തിൽ അതീന്ദ്രിയമായ പ്രത്യക്ഷതയെയോ വെളിപ്പാടനുഭവത്തെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം.
- source_word: ἐν τῷ ναῷ
  choice: വിശുദ്ധമന്ദിരത്തിൽ
  rationale: ναός മുഴുവൻ ദൈവാലയസമുച്ചയത്തേക്കാൾ അതിലെ വിശുദ്ധമന്ദിരത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതിനാൽ ആ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: διανεύων
  choice: ആംഗ്യങ്ങൾ കാണിച്ചുകൊണ്ടിരുന്നു
  rationale: ἦν എന്ന ക്രിയയോടുകൂടിയ periphrastic imperfect തുടർച്ചയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കാണിച്ചുകൊണ്ടിരുന്നു’ ആ ദൈർഘ്യം നിലനിർത്തുന്നു.
- source_word: διέμενεν
  choice: തുടർന്നു
  rationale: തുടർന്നുനിന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന imperfect ക്രിയയുടെ ഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: κωφός
  choice: ഊമനായിത്തന്നെ
  rationale: ഉടൻമുമ്പുള്ള സംസാരിക്കാനാകാത്ത അവസ്ഥയുമായി യോജിക്കുന്നതും ആവർത്തനം ഒഴിവാക്കുന്നതുമായ പരിഭാഷ; പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ബധിരതയും സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സെഖര്യാവിനുണ്ടായ അവസ്ഥയെ വിവരിക്കുന്ന κωφός എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാന പാഠത്തിൽ സംസാരശേഷിയില്ലായ്മയെ സൂചിപ്പിക്കുന്ന ‘ഊമൻ’ ഉപയോഗിച്ചു; പദത്തിന്റെ സാധ്യതയുള്ള ബധിരതാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘ബധിരനും ഊമനും’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം വ്യക്തമായി സംസാരിക്കാനാകാത്തതിനെ മുൻനിർത്തുന്നു; എന്നാൽ κωφός എന്ന പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത പൂർണമായി ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ പ്രവർത്തനക്രമവും തുടർച്ചാഭാവവും സൂക്ഷിച്ചുകൊണ്ട് അനാവശ്യമായ പദാനുപദകാഠിന്യം ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
