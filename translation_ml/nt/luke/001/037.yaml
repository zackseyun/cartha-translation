  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἀδυνατήσει παρὰ ⸂τοῦ θεοῦ⸃ πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: ml
  text: കാരണം, ദൈവത്തിൽനിന്നുള്ള ഒരു വചനവും അസാധ്യമാകുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവത്തിന് ഒന്നും അസാധ്യമാകുകയില്ല.”
    reason: παρά എന്നതിനെ ‘ദൈവത്തോടുകൂടെ/ദൈവത്തിന്’ എന്നും ῥῆμα ഉൾപ്പെടുന്ന പ്രയോഗത്തെ ‘ഒന്നും’ എന്നും ഗ്രഹിക്കുന്ന വ്യാകരണപരമായി സാധുവായ പരമ്പരാഗത വായന.
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ദൂതന്റെ പ്രസ്താവനയ്ക്ക് അടിസ്ഥാനം നൽകുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐκ ἀδυνατήσει
  choice: അസാധ്യമാകുകയില്ല
  rationale: ἀδυνατέω എന്ന ക്രിയയുടെ ഭാവികാലരൂപം ഇവിടെ ‘അസാധ്യമാകുക’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: παρὰ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ള
  rationale: ജനിറ്റീവോടുകൂടിയ παρά ഉറവിടത്തെ സൂചിപ്പിക്കാം; ῥῆμαയോടു ചേർന്ന് ദൈവത്തിൽനിന്നു വരുന്ന വചനമെന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: πᾶν
  choice: ഒരു ... വും
  rationale: നിഷേധക്രിയയോടൊപ്പം πᾶν-ന്റെ സാർവത്രികബലം മലയാളത്തിൽ ‘ഒരു ... വും ... ഇല്ല’ എന്ന ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ῥῆμα
  choice: വചനം
  rationale: പറയപ്പെട്ട വാക്ക്, പ്രഖ്യാപനം എന്നീ അർഥങ്ങൾ നിലനിർത്തുകയും ദൈവത്തിന്റെ പ്രസ്താവനയുമായുള്ള സന്ദർഭബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; ‘കാര്യം’ എന്നു പൊതുവാക്കുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: παρὰ τοῦ θεοῦ πᾶν ῥῆμα എന്ന വാക്യഭാഗത്തിന്റെ അർഥം
  choice: ദൈവത്തിൽനിന്നുള്ള ഒരു വചനവും അസാധ്യമാകുകയില്ല.
  alternative: ദൈവത്തിന് ഒന്നും അസാധ്യമാകുകയില്ല.
  rationale: ῥῆμα ഗ്രീക്കിൽ വ്യക്തമായി ഉള്ളതിനാൽ മുഖ്യപാഠത്തിൽ ‘വചനം’ നിലനിർത്തുന്നു. παράയുടെ ഉറവിടാർഥവും ഇതിലൂടെ പ്രതിഫലിക്കുന്നു. അതേസമയം, ദൈവത്തിന്റെ കഴിവിനെ ഊന്നുന്ന പരമ്പരാഗത വായന വ്യാകരണപരമായി സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വചനം’ എന്ന പദം മൂലത്തിലെ ῥῆμα സംരക്ഷിക്കുന്നു; ‘അസാധ്യമാകുകയില്ല’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
