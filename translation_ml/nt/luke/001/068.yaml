  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ ദൈവമായ കർത്താവ് വാഴ്ത്തപ്പെട്ടവൻ! എന്തെന്നാൽ, അവിടുന്ന് തന്റെ ജനത്തെ സന്ദർശിക്കുകയും[a] അവർക്കായി വീണ്ടെടുപ്പ് വരുത്തുകയും ചെയ്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹായിക്കാനായി വന്നിരിക്കുന്നു.’ ‘സന്ദർശിക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗം ദൈവം ശ്രദ്ധയോടെ ഇടപെടുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു ബൈബിൾപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: വാഴ്ത്തപ്പെട്ടവൻ
  rationale: ക്രിയ സൂചിതമായ സ്തുതിവാക്യത്തിലെ വിധേയവിശേഷണമാണ്. ദൈവം അനുഗൃഹീതനാകുന്നു എന്നതിലുപരി അവിടന്ന് സ്തുതിക്ക് യോഗ്യനാണെന്ന സ്തോത്രഭാവം ഈ പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ദൈവിക സ്ഥാനപ്പേരായതിനാൽ തിരുവെഴുത്തിലെ പതിവ് അനുരണനം നിലനിർത്തുന്നു.
- source_word: ὁ θεὸς τοῦ Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: ‘കർത്താവ്’ എന്നതിനോടുള്ള സമാനാധികരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും പഴയനിയമത്തിലെ ആരാധനാഭാഷയുടെ അനുരണനം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: തുടർന്നുള്ള ദൈവിക പ്രവൃത്തികളാണ് സ്തുതിയുടെ കാരണമെന്ന് വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐπεσκέψατο
  choice: സന്ദർശിക്കുകയും
  rationale: ദൈവം ശ്രദ്ധയോടെ തന്റെ ജനത്തിങ്കൽ വന്ന് ഇടപെടുന്നു എന്ന ബൈബിൾപ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; അർത്ഥവ്യക്തതയ്ക്കായി അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: ἐποίησεν λύτρωσιν
  choice: വീണ്ടെടുപ്പ് വരുത്തുകയും ചെയ്തിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘വീണ്ടെടുപ്പ് ഉണ്ടാക്കി’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കി, ദൈവത്തിന്റെ പ്രവർത്തിയും അതിന്റെ ഫലവും നിലനിർത്തുന്നു.
- source_word: λύτρωσιν
  choice: വീണ്ടെടുപ്പ്
  rationale: മോചനത്തിന്റെയും വിലകൊടുത്തു വിടുവിക്കുന്നതിന്റെയും ആശയാനുരണനം സംരക്ഷിക്കുന്ന, ദൈവശാസ്ത്രഭാരം ഉള്ള സ്വാഭാവിക പദമാണ്.
- source_word: τῷ λαῷ αὐτοῦ
  choice: തന്റെ ജനത്തെ … അവർക്കു
  rationale: ഗ്രീക്കിൽ ഈ ദാതിവ് ജനത്തെ വീണ്ടെടുപ്പിന്റെ ഗുണഭോക്താക്കളായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സന്ദർശനത്തിന്റെ സ്വാഭാവിക കർമവും വീണ്ടെടുപ്പിന്റെ ഗുണഭോക്തൃബന്ധവും വ്യക്തമാക്കാൻ സർവനാമം ആവർത്തിച്ചു.
theological_decisions:
- issue: ദൈവിക സന്ദർശനത്തിന്റെ ഭാഷ
  choice: സന്ദർശിക്കുകയും
  alternative: സഹായിക്കാൻ വരികയും
  rationale: ദൈവത്തിന്റെ ശ്രദ്ധാപൂർവമായ രക്ഷാകര ഇടപെടലിനെ സൂചിപ്പിക്കുന്ന തിരുവെഴുത്തുപരമായ രൂപകം സംരക്ഷിക്കുന്നു; അതിനെ ‘സഹായം’ എന്ന ഒറ്റ ആശയമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സ്തുതിഭാഷയാണ് ഉപയോഗിച്ചത്. ‘അവിടന്ന്’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക സർവനാമമായി സ്വീകരിച്ചു; വാക്യത്തിന്റെ സ്തോത്രഭാവം ആശ്ചര്യചിഹ്നത്തിലൂടെ പ്രകടമാക്കി.
