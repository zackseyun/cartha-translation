id: LUK.1.34
reference: Luke 1:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριὰμ πρὸς τὸν ἄγγελον· Πῶς ἔσται τοῦτο, ἐπεὶ ἄνδρα οὐ γινώσκω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: ml
  text: 'എന്നാൽ മറിയം ദൂതനോടു പറഞ്ഞു: “ഇത് എങ്ങനെ സംഭവിക്കും? ഞാൻ ഒരു പുരുഷനെ അറിയുന്നില്ലല്ലോ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സരളമായി: “ഞാൻ ഒരു പുരുഷനുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടിട്ടില്ലല്ലോ.” ഗ്രീക്കിലെ “ഒരു പുരുഷനെ അറിയുക” എന്നത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ശിഷ്ടോക്തിയാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ഗബ്രിയേലിന്റെ അറിയിപ്പിനോടുള്ള മറിയത്തിന്റെ പ്രതികരണത്തിൽ കാണുന്ന നേരിയ ആശയവ്യത്യാസം സൂചിപ്പിക്കുന്നു; ശക്തമായ എതിർപ്പ് ധ്വനിപ്പിക്കാതെ സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: Μαριὰμ
  choice: മറിയം
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിലും ആധുനിക പ്രയോഗത്തിലും പരിചിതമായ പേരുരൂപം.
- source_word: πρὸς τὸν ἄγγελον
  choice: ദൂതനോടു
  rationale: സന്ദർഭത്തിൽ സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൂതൻ’ സ്വാഭാവികവും കൃത്യവുമായ മലയാള പദമാണ്.
- source_word: Πῶς ἔσται τοῦτο
  choice: ഇത് എങ്ങനെ സംഭവിക്കും?
  rationale: പ്രഖ്യാപിക്കപ്പെട്ട ഗർഭധാരണവും ജനനവും എങ്ങനെ യാഥാർഥ്യമാകും എന്ന ചോദ്യത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐπεὶ
  choice: -ല്ലോ
  rationale: മറിയത്തിന്റെ ചോദ്യത്തിന് ആധാരമായ കാരണത്തെ സംഭാഷണസഹജമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ല്ലോ’ ഇവിടെ ‘എന്തെന്നാൽ/കാരണം’ എന്ന വിശദീകരണധ്വനി നൽകുന്നു.
- source_word: ἄνδρα
  choice: ഒരു പുരുഷനെ
  rationale: ἀνήρ എന്ന പദത്തിന്റെ ‘പുരുഷൻ’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘ഭർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: οὐ γινώσκω
  choice: അറിയുന്നില്ല
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലരൂപവും ‘അറിയുക’ എന്ന ശിഷ്ടോക്തിയും നിലനിർത്തുന്നു; ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മറിയത്തിന്റെ പ്രസ്താവനയും യേശുവിന്റെ കന്യകാഗർഭധാരണവും
  choice: ‘ഞാൻ ഒരു പുരുഷനെ അറിയുന്നില്ല’ എന്ന മൂലഭാഷയിലെ ശിഷ്ടോക്തി മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
  alternative: ‘ഞാൻ ഒരു പുരുഷനുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടിട്ടില്ല’ അല്ലെങ്കിൽ ‘ഞാൻ കന്യകയാണ്’.
  rationale: സന്ദർഭത്തിൽ മറിയത്തിന് പുരുഷനുമായി ലൈംഗികബന്ധമില്ലെന്നതാണ് വാക്കുകളുടെ അർഥം. എന്നാൽ മൂലപാഠം നേരിട്ട് ‘കന്യക’ എന്നു പറയാതെ ‘അറിയുക’ എന്ന ശിഷ്ടോക്തി ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുകയും അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സംഭാഷണത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘സംഭവിക്കും’ എന്നും കാരണധ്വനിക്ക് ‘ല്ലോ’ എന്നും ഉപയോഗിച്ചു; മൂലത്തിലെ ശിഷ്ടോക്തി മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചു.
