id: LUK.1.44
reference: Luke 1:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: ml
  text: ഇതാ, നിന്റെ അഭിവാദനത്തിന്റെ ശബ്ദം എന്റെ ചെവികളിൽ എത്തിയപ്പോൾ, എന്റെ ഗർഭത്തിലുള്ള കുഞ്ഞ് ആനന്ദത്തോടെ തുള്ളിച്ചാടി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ ഗർഭത്തിലുള്ള കുഞ്ഞ് ആഹ്ലാദത്തിൽ തുള്ളിച്ചാടി.”
    reason: ἐν ἀγαλλιάσει എന്നതിന്റെ കൂടുതൽ ഔപചാരികവും രൂപപരമായി അടുത്തതുമായ വിവർത്തനവികൽപം.
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരസൂചകത്തിന്റെ സജീവത സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: (പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല)
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ ‘എന്തെന്നാൽ’ ചേർത്താൽ ഇവിടെ അനാവശ്യമായ ഔപചാരികത ഉണ്ടാകും.
- source_word: ὡς ἐγένετο
  choice: എത്തിയപ്പോൾ
  rationale: സംഭവത്തിന്റെ സമയബന്ധം സ്വാഭാവികമായി അറിയിക്കുകയും ശബ്ദം ചെവികളിലേക്കെത്തുന്ന ദിശാസൂചനയുമായി നന്നായി ചേരുകയും ചെയ്യുന്നു.
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: നിന്റെ അഭിവാദനത്തിന്റെ ശബ്ദം
  rationale: φωνήയുടെ ശ്രാവ്യസ്വഭാവവും ἀσπασμός എന്നതിന്റെ സാധാരണ അർഥമായ അഭിവാദനവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: εἰς τὰ ὦτά μου
  choice: എന്റെ ചെവികളിൽ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം; എത്തുക എന്ന ക്രിയയോടൊപ്പം εἰς എന്നതിന്റെ ദിശാബോധവും പ്രകടമാകുന്നു.
- source_word: ἐσκίρτησεν
  choice: തുള്ളിച്ചാടി
  rationale: പെട്ടെന്നുള്ള സജീവ ചലനത്തെ വ്യക്തവും ദൃശ്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν ἀγαλλιάσει
  choice: ആനന്ദത്തോടെ
  rationale: ആഹ്ലാദപൂർണമായ ഉല്ലാസത്തെ സൂചിപ്പിക്കുന്ന രീതി/ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὸ βρέφος
  choice: കുഞ്ഞ്
  rationale: ഗർഭത്തിലുള്ള ശിശുവിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കൃത്യവുമായ പദം.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: എന്റെ ഗർഭത്തിലുള്ള
  rationale: സന്ദർഭത്തിൽ κοιλία സൂചിപ്പിക്കുന്ന ഗർഭസ്ഥാനം കൃത്യമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഗർഭസ്ഥനായ യോഹന്നാനെ βρέφος എന്നു വിശേഷിപ്പിക്കുന്നത്
  choice: കുഞ്ഞ്
  alternative: ശിശു
  rationale: മൂലപദം ഗർഭസ്ഥനോ വളരെ ചെറുപ്പമുള്ളവനോ ആയ കുഞ്ഞിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ‘കുഞ്ഞ്’ എന്നത് പാഠത്തിന്റെ സ്വന്തം വിവരണം നിലനിർത്തുന്നു; അതിനപ്പുറമുള്ള സിദ്ധാന്തപരമായ അവകാശവാദങ്ങൾ ചേർക്കുന്നില്ല.
- issue: ἐν ἀγαλλιάσει എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: കുഞ്ഞ് ആനന്ദത്തോടെ തുള്ളിച്ചാടി
  alternative: കുഞ്ഞ് ആഹ്ലാദത്തിൽ തുള്ളിച്ചാടി
  rationale: ഈ പദസമുച്ചയം കുഞ്ഞിന്റെ ചലനത്തിന്റെ ഭാവമോ രീതിയോ സൂചിപ്പിക്കുന്നതായി നിലനിർത്തുന്നു; ആനന്ദത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഇതാ’ മൂലത്തിലെ ശ്രദ്ധാകർഷകത നിലനിർത്തുന്നു; ‘അഭിവാദനം,’ ‘ഗർഭം’ എന്നിവ കൃത്യതയും പൊതുവായ വായനാസൗകര്യവും സംയോജിപ്പിക്കുന്നു.
