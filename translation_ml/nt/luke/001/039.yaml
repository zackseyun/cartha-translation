source:
  edition: SBLGNT
  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: ml
  text: ആ ദിവസങ്ങളിൽ മറിയം എഴുന്നേറ്റ് തിടുക്കത്തിൽ യെഹൂദായിലെ മലനാട്ടിലുള്ള ഒരു പട്ടണത്തിലേക്ക് പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദായിലെ ഒരു നഗരത്തിലേക്ക്’ അല്ലെങ്കിൽ ‘യെഹൂദ്യയിലെ ഒരു പട്ടണത്തിലേക്ക്.’ ഗ്രീക്കിലെ πόλις എന്ന പദത്തിന് ‘നഗരം’ എന്നും ‘പട്ടണം’ എന്നും അർഥമാകാം; Ἰούδα യെഹൂദാ/യെഹൂദ്യ പ്രദേശത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα δὲ
  choice: മറിയ എഴുന്നേറ്റ്
  rationale: ആഖ്യാനത്തിലെ തുടർച്ചയും മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തനവും സ്വാഭാവികമായി അറിയിക്കുന്നു. δέ-യുടെ മൃദുവായ സംക്രമണം മലയാളവാക്യത്തിന്റെ ഒഴുക്കിൽ പ്രത്യേകം പദമില്ലാതെയും പ്രകടമാകുന്നു.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: സൂചകവും കാലപരവുമായ പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπορεύθη
  choice: പോയി
  rationale: πορεύομαι എന്നതിന്റെ ഇവിടെ യോജിച്ച പൊതുവായ യാത്രാക്രിയ; അനാവശ്യ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: εἰς τὴν ὀρεινὴν
  choice: മലനാട്ടിലെ
  rationale: നാമവൽക്കരിച്ച ὀρεινή സൂചിപ്പിക്കുന്ന മലമ്പ്രദേശത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: μετὰ σπουδῆς
  choice: തിടുക്കത്തിൽ
  rationale: യാത്രാസന്ദർഭത്തിൽ σπουδήയുടെ വേഗതയും അടിയന്തരതയും പ്രകടമാക്കുന്നു; ‘ഉത്സാഹത്തോടെ’ എന്ന സാധ്യത സന്ദർഭം കുറച്ച് മാത്രമേ പിന്തുണയ്ക്കുന്നുള്ളൂ.
- source_word: εἰς πόλιν Ἰούδα
  choice: യെഹൂദായിലെ ഒരു പട്ടണത്തിലേക്കു
  rationale: πόλις നഗരമോ പട്ടണമോ ആകാം; പേരറിയിക്കാത്ത ഈ വാസസ്ഥലത്തിന് ‘പട്ടണം’ സ്വാഭാവികമാണ്. Ἰούδα ഇവിടെ വ്യക്തിനാമത്തേക്കാൾ പ്രദേശനാമമായി ഗ്രഹിക്കുന്നു.
theological_decisions:
- issue: Ἰούδα എന്നതിന്റെ തിരിച്ചറിയൽ
  choice: പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ‘യെഹൂദാ’
  alternative: ‘യെഹൂദ്യയിലെ’ അല്ലെങ്കിൽ ‘യെഹൂദാ എന്നു പേരുള്ള പട്ടണം’
  rationale: സന്ദർഭത്തിൽ Ἰούδα യെഹൂദാ/യെഹൂദ്യ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം. ‘യെഹൂദാ’ ഗ്രീക്ക് രൂപത്തോടുള്ള അടുപ്പം നിലനിർത്തുന്നു; ഒരു പട്ടണത്തിന്റെ പേരാണെന്ന് തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ വാക്കുകളുടെ ക്രമം യാന്ത്രികമായി പകർത്താതെ, ‘മലനാട്ടിലെ യെഹൂദായിലെ ഒരു പട്ടണം’ എന്ന ലക്ഷ്യസ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
