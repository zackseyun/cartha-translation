id: LUK.1.53
reference: Luke 1:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πεινῶντας ἐνέπλησεν ἀγαθῶν καὶ πλουτοῦντας ἐξαπέστειλεν κενούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: ml
  text: വിശക്കുന്നവരെ അവൻ നന്മകളാൽ നിറച്ചു; സമ്പന്നരെ ശൂന്യരായി അയച്ചുവിട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινῶντας
  choice: വിശക്കുന്നവരെ
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃദന്തം നാമസമാനമായി ഉപയോഗിച്ചിരിക്കുന്നു. ‘വിശക്കുന്നവരെ’ എന്നത് വിശപ്പിന്റെ തീവ്രത അനാവശ്യമായി വർധിപ്പിക്കാതെ വ്യക്തികളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐνέπλησεν
  choice: നിറച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘നിറയ്ക്കുക’ നേരിട്ട് നിലനിർത്തുന്നു. ഗീതത്തിലെ നിർണായക ദൈവിക പ്രവൃത്തിയെ മലയാളത്തിലെ ഭൂതകാലം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀγαθῶν
  choice: നന്മകളാൽ
  rationale: നിറച്ചതിന്റെ ഉള്ളടക്കം സൂചിപ്പിക്കുന്ന ബഹുവചന നാമവൽക്കൃത വിശേഷണമാണ്. ‘നന്മകളാൽ’ എന്നത് ‘നല്ല ദാനങ്ങൾ’ എന്നു ചേർത്ത് വ്യാഖ്യാനിക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: πλουτοῦντας
  choice: സമ്പന്നരെ
  rationale: നാമസമാനമായി ഉപയോഗിച്ച കൃദന്തം വിശക്കുന്നവരുമായുള്ള മൂർത്തമായ സാമൂഹിക വൈരുധ്യം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐξαπέστειλεν
  choice: പറഞ്ഞയച്ചു
  rationale: അകറ്റി അയയ്ക്കുക എന്ന സംയുക്തക്രിയയുടെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഔപചാരികമായി പിരിച്ചുവിടുക എന്ന അധികസൂചന ഒഴിവാക്കുന്നു.
- source_word: κενούς
  choice: വെറുംകൈയോടെ
  rationale: അവർ ഒന്നും ലഭിക്കാതെയാണ് മടങ്ങുന്നതെന്ന വിധേയാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. മൂലത്തിലെ ‘ശൂന്യർ’ എന്ന വിശാല രൂപത്തേക്കാൾ അല്പം ദൃശ്യവൽക്കരിച്ച പ്രയോഗമാണെങ്കിലും ഈ സാഹചര്യത്തിൽ അർഥം കൃത്യമായി കൈമാറുന്നു.
theological_decisions:
- issue: മറിയത്തിന്റെ ഗീതത്തിലെ സാമൂഹിക-ദൈവശാസ്ത്രപരമായ സ്ഥാനമാറ്റം
  choice: ‘വിശക്കുന്നവർ’ എന്നും ‘സമ്പന്നർ’ എന്നും ഉള്ള മൂർത്തമായ വൈരുധ്യം അതേപടി നിലനിർത്തി.
  alternative: ഇവയെ ആത്മീയമായി ആവശ്യക്കാരായവർ എന്നും സ്വയംതൃപ്തരോ അഹങ്കാരികളോ എന്നും വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം വിശക്കുന്നവരെയും സമ്പന്നരെയും നേരിട്ട് പേരെടുത്തു പറയുന്നു. ആത്മീയ പ്രയോഗങ്ങൾ സാധ്യമെങ്കിലും അവയെ വിവർത്തനത്തിൽ ചേർക്കുന്നത് പാഠത്തിലെ സാമൂഹിക മൂർത്തതയും ദൈവിക സ്ഥാനമാറ്റത്തിന്റെ സംഘർഷവും ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. രണ്ട് സമാന്തര ഘടകങ്ങളുടെ കാവ്യാത്മക വൈരുധ്യം അർദ്ധവിരാമത്തിലൂടെ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടുന്നില്ല; ഗ്രീക്കിലെ κενούς-നോടുള്ള ‘empty-handed’ വ്യത്യാസം മലയാള മുഖ്യപാഠത്തിൽ തന്നെ സ്വാഭാവികമായി ഉൾപ്പെടുത്തിയതിനാൽ അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല.
