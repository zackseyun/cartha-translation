id: LUK.1.69
reference: Luke 1:69
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤγειρεν κέρας σωτηρίας ἡμῖν ⸀ἐν οἴκῳ ⸀Δαυὶδ παιδὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/069.yaml
  text: and has raised up a horn of salvation for us in the house of David his servant,[a]
translation:
  language: ml
  text: തന്റെ ദാസനായ ദാവീദിന്റെ ഭവനത്തിൽ നമുക്കായി രക്ഷയുടെ ഒരു കൊമ്പ് ഉയർത്തിയിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശക്തനായ ഒരു രക്ഷകൻ.’ അക്ഷരാർഥത്തിൽ, ‘രക്ഷയുടെ ഒരു കൊമ്പ്’; ശക്തിയേറിയ വിടുതലിനെ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: ഉയർത്തിയിരിക്കുന്നു
  rationale: ഗ്രീക്ക് അയോറിസ്റ്റ് ദൈവത്തിന്റെ രക്ഷാപ്രവൃത്തിയെ സംഭവിച്ചുകഴിഞ്ഞ യാഥാർഥ്യമായി സ്തുതിക്കുന്ന സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി വർത്തമാനഫലമുള്ള പൂർത്തിക്രിയയായി നൽകി; ‘ഉയർത്തുക’ എന്ന ബൈബിൾ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: κέρας σωτηρίας
  choice: രക്ഷയുടെ ഒരു കൊമ്പ്
  rationale: ശക്തിയുടെയും വിജയകരമായ വിടുതലിന്റെയും തിരുവെഴുത്തുപരമായ രൂപകം നിലനിർത്തുന്നു; ‘ശക്തനായ രക്ഷകൻ’ എന്നു വ്യാഖ്യാനിച്ച് രൂപകത്തെ ഇല്ലാതാക്കുന്നില്ല.
- source_word: ἡμῖν
  choice: നമുക്കായി
  rationale: ഇവിടെയുള്ള ഗുണഭോക്തൃ ദത്തിവിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: ദാവീദിന്റെ ഭവനത്തിൽ
  rationale: ‘ഭവനം’ വംശത്തെയും രാജവംശത്തെയും സൂചിപ്പിക്കുന്ന ബൈബിൾ പ്രയോഗമായി നിലനിർത്തുകയും ἐν എന്നതിന്റെ ‘-ത്തിൽ’ അർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: παιδὸς αὐτοῦ
  choice: തന്റെ ദാസനായ
  rationale: ദാവീദിന് ഇവിടെ παῖς എന്നത് പ്രായപൂർത്തിയാകാത്ത കുട്ടിയെയല്ല, ദൈവത്തോടുള്ള ബന്ധത്തിൽ അവന്റെ ദാസനെന്ന ഉടമ്പടിപരമായ സ്ഥാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ‘രക്ഷയുടെ കൊമ്പ്’ എന്ന രൂപകം നിലനിർത്തണമോ, ‘ശക്തനായ രക്ഷകൻ’ എന്നു വ്യാഖ്യാനിക്കണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘രക്ഷയുടെ ഒരു കൊമ്പ്’ നിലനിർത്തി
  alternative: ‘ശക്തനായ ഒരു രക്ഷകൻ’
  rationale: ഗ്രീക്കിലെ ദൃശ്യരൂപകം പഴയനിയമത്തിലെ രാജകീയ ശക്തിയുടെയും രക്ഷയുടെയും പശ്ചാത്തലം വഹിക്കുന്നു. അതിനെ നിലനിർത്തുന്നത് സാഹിത്യ-ദൈവശാസ്ത്ര ബന്ധം സംരക്ഷിക്കുന്നു; വായനാസഹായത്തിനായി അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭവനം,’ ‘കൊമ്പ്’ എന്നീ ബൈബിൾ രൂപങ്ങൾ അവയുടെ അന്തർപാഠബന്ധം സംരക്ഷിക്കാൻ നിലനിർത്തിയിരിക്കുന്നു.
