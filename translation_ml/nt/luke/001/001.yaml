lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: ആയിരിക്കുകയാൽ
  rationale: ലൂക്കായുടെ ഔപചാരിക ആമുഖത്തിലെ കാരണപരമായ പശ്ചാത്തലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; -περ നൽകുന്ന ഊന്നൽ വേർതിരിച്ച് അതിവിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: πολλοὶ
  choice: പലരും
  rationale: ഗ്രീക്കിലെ ലളിതമായ ബഹുത്വസൂചന സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘മറ്റുള്ളവർ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: ἐπεχείρησαν
  choice: മുൻകൈ എടുത്തു
  rationale: ഒരു രചനാപ്രവർത്തനം ഏറ്റെടുത്തുവെന്ന അർഥം നൽകുന്നു; ശ്രമം പരാജയപ്പെട്ടുവെന്ന സൂചനയുള്ള പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἀνατάξασθαι
  choice: ക്രമപ്പെടുത്തി എഴുതാൻ
  rationale: വിവരങ്ങൾ ക്രമീകരിച്ച് രചനയാക്കുക എന്ന സാഹിത്യപ്രവർത്തനം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി പറയുന്നു.
- source_word: διήγησιν
  choice: ഒരു വിവരണം
  rationale: സംഭവങ്ങളെ വിവരിക്കുന്ന ആഖ്യാനം എന്ന അർഥം നിലനിർത്തുകയും ഔപചാരിക ആമുഖത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: περὶ
  choice: കുറിച്ച്
  rationale: വിഷയബന്ധം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῶν πεπληροφορημένων
  choice: നിവൃത്തിയായ
  rationale: പൂർത്തീകരിക്കപ്പെട്ടത് അഥവാ സാക്ഷാത്കരിക്കപ്പെട്ടത് എന്ന സാദ്ധ്യതയുള്ള പ്രധാന അർഥം നൽകുന്നു; ‘സ്ഥിരീകരിക്കപ്പെട്ട’ എന്ന വ്യത്യസ്ത സാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν ἡμῖν
  choice: നമ്മുടെ ഇടയിൽ
  rationale: ആരെയാണ് ‘നമ്മൾ’ എന്നു വിളിക്കുന്നതെന്ന് അനാവശ്യമായി നിർവചിക്കാതെ സമൂഹപരമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: πραγμάτων
  choice: കാര്യങ്ങൾ
  rationale: സംഭവങ്ങൾ, ചെയ്ത പ്രവൃത്തികൾ, യാഥാർഥ്യങ്ങൾ എന്നിവ ഉൾക്കൊള്ളാവുന്ന ഗ്രീക്ക് പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലൂക്കാ 1:1-ലെ πεπληροφορημένων എന്ന പദത്തിന്റെ അർഥം
  choice: നിവൃത്തിയായ
  alternative: പൂർത്തീകരിക്കപ്പെട്ട; പൂർണമായി സ്ഥിരീകരിക്കപ്പെട്ട
  rationale: πραγμάτων എന്ന പദത്തോടൊപ്പം വരുന്നതിനാൽ സംഭവങ്ങൾ പൂർത്തീകരിക്കപ്പെട്ടു അഥവാ നിവൃത്തിയായി എന്ന അർഥമാണ് സന്ദർഭത്തിൽ കൂടുതൽ സ്വാഭാവികം. എങ്കിലും പൂർണമായി സ്ഥിരീകരിക്കപ്പെട്ടു എന്ന ശാബ്ദിക സാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ഗ്രീക്ക് വാക്യം അടുത്ത വാക്യങ്ങളിലേക്കു നീളുന്നതിനാൽ കാരണസൂചകമായ ‘ആയിരിക്കുകയാൽ’ ഉപയോഗിച്ച് ഔപചാരിക ആമുഖത്തിന്റെ തുടർച്ച നിലനിർത്തിയിരിക്കുന്നു.
