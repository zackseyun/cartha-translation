reference: Luke 1:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: ml
  text: ഇതാ, നിന്റെ ബന്ധുവായ എലിസബത്തും തന്റെ വാർധക്യത്തിൽ ഒരു മകനെ ഗർഭം ധരിച്ചിരിക്കുന്നു. വന്ധ്യയെന്നു വിളിക്കപ്പെടുന്ന അവൾക്ക് ഇത് ആറാം മാസമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: συγγενίς
  choice: ബന്ധു
  rationale: കൃത്യമായ ബന്ധനില വ്യക്തമല്ലാത്തതിനാൽ പൊതുവായ കുടുംബബന്ധപദം ഉപയോഗിച്ച് മൂലത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: συνείληφεν υἱὸν
  choice: ഒരു മകനെ ഗർഭം ധരിച്ചിരിക്കുന്നു
  rationale: ഗർഭധാരണവും കുഞ്ഞിന്റെ പുരുഷലിംഗവും വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക വിവർത്തനം.
- source_word: ἐν γήρει αὐτῆς
  choice: തന്റെ വാർധക്യത്തിൽ
  rationale: പ്രായാധിക്യത്തെ സൂചിപ്പിക്കുന്ന മൂലവാചകത്തിന്റെ നേരിട്ടുള്ള, മാന്യമായ രൂപം.
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: വന്ധ്യയെന്നു വിളിക്കപ്പെട്ടിരുന്ന
  rationale: സ്ത്രീയെ മറ്റുള്ളവർ അങ്ങനെ വിശേഷിപ്പിച്ചിരുന്നുവെന്ന വാചകഘടന നിലനിർത്തുന്നു; അതിനെ ശാശ്വതമായ സ്വത്വപ്രസ്താവനയാക്കുന്നില്ല.
theological_decisions:
- issue: എലിസബത്തിന്റെ ബന്ധനില
  choice: ബന്ധു
  alternative: ചാർച്ചക്കാരി / ബന്ധുവായ സഹോദരി
  rationale: συγγενίς കുടുംബബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും ബന്ധത്തിന്റെ കൃത്യമായ സ്വഭാവം പറയുന്നില്ല; അതിനാൽ കൂടുതൽ നിർദ്ദിഷ്ടമായ ബന്ധം ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- issue: ‘വന്ധ്യ’ എന്ന വിശേഷണം
  choice: വന്ധ്യയെന്നു വിളിക്കപ്പെട്ടിരുന്ന അവൾ
  alternative: വന്ധ്യയായ അവൾ
  rationale: κληθείσῃ എന്ന ആശയം നിലനിർത്തി, അത് മറ്റുള്ളവരുടെ അറിയപ്പെട്ട വിശേഷണമാണെന്ന സൂചന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും ഗൗരവത്തോടെയും വായിക്കാവുന്ന രൂപം. ‘ഇതാ’ എന്നത് ദൂതന്റെ ശ്രദ്ധാകർഷണഭാവം നിലനിർത്തുന്നു; അനാവശ്യമായ ബന്ധവിവരമോ വ്യാഖ്യാനപരമായ ദൈവശാസ്ത്ര വിശദീകരണമോ ചേർത്തിട്ടില്ല.
