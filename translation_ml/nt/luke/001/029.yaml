source:
  edition: SBLGNT
  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: ml
  text: എന്നാൽ ആ സന്ദേശം[a] നിമിത്തം അവൾ വളരെ കലങ്ങി; ഈ അഭിവാദ്യം എങ്ങനെയുള്ളതായിരിക്കാം എന്നു അവൾ ചിന്തിച്ചുകൊണ്ടിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ആ വാക്കിന്മേൽ”; λόγος എന്ന ഗ്രീക്ക് പദത്തിന് “വാക്ക്,” “പ്രസ്താവന,” “സന്ദേശം” എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: “ആലോചിച്ചുകൊണ്ടിരുന്നു” എന്നതിനു “മനസ്സിൽ തൂക്കിനോക്കിക്കൊണ്ടിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് അപൂർണഭൂതകാലരൂപം തുടർന്നുള്ള ആന്തരിക പരിചിന്തനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുമ്പത്തെ അഭിവാദ്യത്തിൽനിന്ന് മറിയത്തിന്റെ പ്രതികരണത്തിലേക്കുള്ള നേരിയ വൈരുധ്യവും ആഖ്യാനമാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: ἐπὶ τῷ λόγῳ
  choice: ആ സന്ദേശം കേട്ട്
  rationale: λόγος ഇവിടെ ദൂതൻ പറഞ്ഞതിന്റെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു; ἐπί + ദത്തിവിന്റെ കാരണസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: διεταράχθη
  choice: അത്യന്തം അസ്വസ്ഥയായി
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന ശക്തമായ ആന്തരിക കലക്കത്തെ വ്യക്തമായി അറിയിക്കുന്നു; ഭയം, അവിശ്വാസം തുടങ്ങിയവ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: διελογίζετο
  choice: ചിന്തിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുള്ള ആന്തരിക ആലോചന മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ποταπὸς
  choice: എങ്ങനെയുള്ള
  rationale: അഭിവാദ്യത്തിന്റെ സ്വഭാവമോ തരമോ എന്തെന്ന അന്വേഷണത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἴη
  choice: ആയിരിക്കാം
  rationale: പരോക്ഷചോദ്യത്തിലെ ഒപ്റ്റേറ്റീവ് രൂപത്തിന്റെ അനിശ്ചിതവും പരിഗണനാപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀσπασμὸς οὗτος
  choice: ഈ അഭിവാദ്യം
  rationale: ഇപ്പോൾതന്നെ ഉച്ചരിക്കപ്പെട്ട പ്രത്യേക അഭിവാദ്യത്തിലേക്കുള്ള സൂചന നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മറിയത്തിന്റെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ദൂതന്റെ സന്ദേശം കേട്ട് അവൾ ശക്തമായി അസ്വസ്ഥയാകുകയും അതിന്റെ അർഥം ആലോചിക്കുകയും ചെയ്തു.
  alternative: ദൂതന്റെ രൂപം കണ്ടാണ് അവൾ ഭയപ്പെട്ടത്, അല്ലെങ്കിൽ അവളുടെ പ്രതികരണം അവിശ്വാസമായിരുന്നു.
  rationale: ഗ്രീക്ക് വാക്യം അവളുടെ അസ്വസ്ഥതയെ പറഞ്ഞ സന്ദേശത്തോടു ബന്ധിപ്പിക്കുന്നു; അവളുടെ പ്രതികരണത്തിന് പാപഭയം, അവിശ്വാസം, ധാർമ്മിക കുറ്റം എന്നിവ ആരോപിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. “സന്ദേശം കേട്ട്” എന്നത് കാരണബന്ധം സ്വാഭാവികമാക്കുന്നു; അടിക്കുറിപ്പുകളിൽ മൂലപദത്തിന്റെ വിശാലമായ സാധ്യതകൾ സൂക്ഷിച്ചിരിക്കുന്നു.
