  to: കർത്താവ് അവളോടു വലിയ കരുണ കാണിച്ചെന്ന് അവളുടെ അയൽക്കാരും ബന്ധുക്കളും കേട്ടു; അവർ അവളോടൊപ്പം സന്തോഷിച്ചു.
