id: LUK.1.58
reference: Luke 1:58
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: ml
  text: കർത്താവ് അവളോടു വലിയ കരുണ കാണിച്ചെന്ന് അവളുടെ അയൽക്കാരും ബന്ധുക്കളും കേട്ടു; അവർ അവളോടൊപ്പം സന്തോഷിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: അയൽക്കാർ
  rationale: ചുറ്റുപാടിൽ താമസിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: συγγενεῖς
  choice: ബന്ധുക്കൾ
  rationale: രക്തബന്ധത്തിലോ കുടുംബബന്ധത്തിലോ ഉള്ളവരെ പൊതുവായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐμεγάλυνεν
  choice: മഹത്തരമാക്കി
  rationale: ‘വലുതാക്കുക/മഹത്താക്കുക’ എന്ന മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ഇവിടെ കരുണയുടെ മഹത്വം അവളോടുള്ള ദൈവിക പ്രവൃത്തിയിൽ പ്രകടമായെന്ന ആശയം നൽകുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: സന്ദർഭത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന നിശ്ചിത ബിരുദം; മലയാള ബൈബിൾ ഭാഷയിലും പൊതുവായി ഗ്രാഹ്യമായ രൂപം.
- source_word: ἔλεος
  choice: കരുണ
  rationale: കരുണാപൂർവമായ ദയ എന്ന അർഥം നൽകുന്നു; ലൂക്കോസിന്റെ ശൈശവവിവരണത്തിലെ ദൈവിക കരുണയുടെ പ്രമേയവും നിലനിർത്തുന്നു.
- source_word: μετ’ αὐτῆς
  choice: അവളോടു
  rationale: μετά എന്നതിന്റെ ‘കൂടെ/ഒപ്പം’ എന്ന ബന്ധഭാവം സൂക്ഷിച്ചുകൊണ്ട് ഈ വാക്യഘടനയിൽ വായിക്കാവുന്ന മലയാളരൂപം.
- source_word: συνέχαιρον αὐτῇ
  choice: അവർ അവളോടൊപ്പം സന്തോഷിച്ചു
  rationale: അവളുടെ സന്തോഷത്തിൽ മറ്റുള്ളവർ പങ്കുചേർന്നുവെന്ന കൂട്ടുസന്തോഷത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ἐμεγάλυνεν ... τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ് അവളോടു തന്റെ കരുണ മഹത്തരമാക്കി
  alternative: കർത്താവ് അവളോടു വലിയ കരുണ കാണിച്ചു
  rationale: പ്രധാന പാഠം μεγαλύνω എന്ന ക്രിയയുടെ ‘മഹത്താക്കുക’ എന്ന രൂപകശക്തിയും μετάയുടെ ബന്ധഭാവവും നിലനിർത്തുന്നു. എന്നാൽ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായ അർഥവിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു; ഇതിലൂടെ യഥാർഥ പ്രയോഗത്തിലെ സംഘർഷം മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. പ്രധാന പാഠത്തിൽ ഗ്രീക്ക് രൂപകത്തിന്റെ സുതാര്യത സംരക്ഷിക്കുകയും, കൂടുതൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
