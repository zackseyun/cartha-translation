id: LUK.1.43
reference: Luke 1:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πόθεν μοι τοῦτο ἵνα ἔλθῃ ἡ μήτηρ τοῦ κυρίου μου πρὸς ⸀ἐμέ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/043.yaml
  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: ml
  text: എന്റെ കർത്താവിന്റെ അമ്മ എന്റെ അടുക്കൽ വരാൻ എനിക്ക് ഈ ബഹുമതി എവിടെനിന്ന് ലഭിച്ചു?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഇത് എനിക്ക് എവിടെനിന്ന്—എന്റെ കർത്താവിന്റെ അമ്മ എന്റെ അടുക്കൽ വരുന്നത്?” തനിക്ക് ഇങ്ങനെയൊരു ബഹുമതി ലഭിച്ചതിലുള്ള വിസ്മയം പ്രകടിപ്പിക്കുന്ന ശൈലിയാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν
  choice: എവിടെനിന്ന്
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ഉറവിടസൂചന നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അത്ഭുതവും അർഹതയില്ലായ്മയുടെ ബോധവും പ്രകടമാക്കുന്ന ശൈലിയാണിത്.
- source_word: μοι τοῦτο
  choice: എനിക്ക് ഈ ബഹുമതി ലഭിച്ചു
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ഇത് എനിക്ക്’ എന്നാണെങ്കിലും മലയാളത്തിൽ അത് അവ്യക്തമാകും. സന്ദർഭത്തിൽ അപ്രതീക്ഷിതമായി ലഭിച്ച ആദരവാണ് സൂചിപ്പിക്കുന്നത്; ‘ബഹുമതി ലഭിച്ചു’ സ്വാഭാവികമായി ആ ആശയം നൽകുന്നു.
- source_word: ἵνα ἔλθῃ
  choice: വരാൻ
  rationale: ἵνα ഇവിടെ വിസ്മയത്തിന് കാരണമായ സംഭവത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ക്രിയാനാമരൂപം ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡ μήτηρ τοῦ κυρίου μου
  choice: എന്റെ കർത്താവിന്റെ അമ്മ
  rationale: ബന്ധവും പദവിയും നേരിട്ട് നിലനിർത്തുന്നു. κύριος എന്നതിന് ആദരവും ക്രിസ്തുസംബന്ധമായ ഭാരവും സൂക്ഷിക്കുന്ന ‘കർത്താവ്’ ഉപയോഗിച്ചു.
- source_word: πρὸς ἐμέ
  choice: എന്റെ അടുക്കൽ
  rationale: എലിസബത്തിന്റെ അടുത്തേക്കുള്ള ചലനം കൃത്യമായി സൂചിപ്പിക്കുന്നു; ‘എന്റെ വീട്ടിലേക്ക്’ എന്ന് മൂലപാഠത്തിലില്ലാത്ത വിവരം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: τοῦ κυρίου μου എന്നതിലെ κύριος പദത്തിന്റെ പരിഭാഷ
  choice: എന്റെ കർത്താവിന്റെ
  alternative: എന്റെ യജമാനന്റെ
  rationale: ‘കർത്താവ്’ എന്നത് പദവിയുടെ ആദരവും വാക്യത്തിലെ ക്രിസ്തുസംബന്ധമായ ശക്തിയും നിലനിർത്തുന്നു; അതേസമയം പിൽക്കാല ദൈവശാസ്ത്ര വിശദീകരണങ്ങൾ വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: πόθεν μοι τοῦτο എന്ന ശൈലിയുടെ പരിഭാഷ
  choice: എനിക്ക് ഈ ബഹുമതി എവിടെനിന്ന് ലഭിച്ചു?
  alternative: ഇത് എനിക്ക് എവിടെനിന്ന്?
  rationale: മൂലത്തിലെ ‘എവിടെനിന്ന്’ എന്ന രൂപകം സൂക്ഷിച്ചുകൊണ്ട്, ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം സൂചിതമായ ആദരലഭ്യത വ്യക്തമാക്കുന്നു. എലിസബത്തിന്റെ വിസ്മയവും വിനയവും നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘എന്റെ അടുക്കൽ’ എന്ന പ്രയോഗം ഗൗരവമുള്ളതെങ്കിലും സ്വാഭാവികമാണ്; മൂലത്തിലെ വിസ്മയചോദ്യം നിലനിർത്തിയിരിക്കുന്നു.
