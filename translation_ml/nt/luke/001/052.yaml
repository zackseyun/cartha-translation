reference: Luke 1:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθεῖλεν δυνάστας ἀπὸ θρόνων καὶ ὕψωσεν ταπεινούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/052.yaml
  text: He has brought down rulers from thrones and exalted the humble[a][b].
translation:
  language: ml
  text: അവൻ അധികാരികളെ[a] സിംഹാസനങ്ങളിൽനിന്ന് താഴെയിറക്കി; താഴ്മയുള്ളവരെ[b] ഉയർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രബലന്മാരെ.’ ഗ്രീക്ക് പദം പൊതുവേ ശക്തരായ ആളുകളെ സൂചിപ്പിക്കാം; എന്നാൽ ‘സിംഹാസനങ്ങളിൽനിന്ന്’ എന്ന സന്ദർഭം ഭരണാധികാരികളെന്ന അർഥത്തിന് മുൻതൂക്കം നൽകുന്നു.
    reason: δυνάστας എന്ന പദത്തിന്റെ വിശാലമായ ‘ശക്തർ’ എന്ന അർഥസാധ്യത രേഖപ്പെടുത്തുന്നു; സന്ദർഭാനുസൃതമായി തിരഞ്ഞെടുത്ത ‘അധികാരികളെ’ എന്ന വിവർത്തനവും വ്യക്തമാക്കുന്നു.
  - marker: b
    text: അഥവാ ‘എളിയവരെ.’ ഗ്രീക്ക് പദം വിനയമുള്ളവരെയും താഴ്ന്ന സാമൂഹിക നിലയിലുള്ളവരെയും സൂചിപ്പിക്കാം.
    reason: ταπεινούς എന്ന പദത്തിലെ വിനയത്തിന്റെയും സാമൂഹിക താഴ്മയുടെയും അർഥസാധ്യത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: καθεῖλεν
  choice: താഴെയിറക്കി
  rationale: ഉയർന്ന സ്ഥാനത്തുനിന്നോ അധികാരത്തിൽനിന്നോ നീക്കുക എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; അക്രമാസക്തമായ അട്ടിമറി എന്ന അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: δυνάστας
  choice: അധികാരികളെ
  rationale: ശക്തരായവരെയോ ഭരണാധികാരികളെയോ സൂചിപ്പിക്കാവുന്ന പദമാണിത്. ‘സിംഹാസനങ്ങളിൽനിന്ന്’ എന്ന സന്ദർഭം ഭരണ-അധികാര ഭാവത്തിന് മുൻതൂക്കം നൽകുന്നു; എങ്കിലും ‘ഭരണാധികാരികൾ’ എന്നതിനെക്കാൾ അല്പം വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἀπὸ θρόνων
  choice: സിംഹാസനങ്ങളിൽനിന്ന്
  rationale: മൂലത്തിലെ ദൃശ്യമായ രാജകീയ പ്രതീകം അതേപടി നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ഉടമസ്ഥസൂചന ചേർക്കുന്നില്ല.
- source_word: ὕψωσεν
  choice: ഉയർത്തി
  rationale: സ്ഥാനത്തിലും മാനത്തിലും ഉയർത്തുക എന്ന സാമൂഹികവും ദൈവശാസ്ത്രപരവുമായ ഭാവങ്ങൾ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ταπεινούς
  choice: താഴ്മയുള്ളവരെ
  rationale: വിനയമുള്ളവർ എന്നും താഴ്ന്ന സാമൂഹിക നിലയിലുള്ളവർ എന്നും ഗ്രഹിക്കാവുന്ന ഗ്രീക്ക് പദത്തിന്റെ ഉദ്ദേശപൂർവമായ അർഥവ്യാപ്തി കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: മറിയത്തിന്റെ സ്തുതിഗീതത്തിലെ aorist ക്രിയകളുടെ കാലഭാവം
  choice: 'മലയാളത്തിൽ നിർണായകമായി നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഭൂതകാലരൂപം: ‘താഴെയിറക്കി ... ഉയർത്തി’'
  alternative: പൂർത്തിയായതും ഇപ്പോഴും പ്രസക്തവുമായ പ്രവൃത്തിയായി കൂടുതൽ വ്യാഖ്യാനാത്മകമായി വികസിപ്പിക്കൽ
  rationale: മലയാളത്തിലെ ലളിത ഭൂതകാലം ഗ്രീക്ക് aorist-ന്റെ നിർണായക പ്രവൃത്തിഭാവം സ്വാഭാവികമായി നൽകുന്നു. ഇവ പ്രവചനാത്മകമായോ സ്തുതിയിലെ സംഗ്രഹമായോ കാലാതീത ദൈവപ്രവൃത്തിയായോ മനസ്സിലാക്കണമെന്ന ചോദ്യം പരിഭാഷ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും കാവ്യാത്മകവുമായ സമാന്തരഘടന ഉപയോഗിച്ചു. ‘സിംഹാസനം’ എന്ന ബൈബിൾ ദൃശ്യപ്രതീകം നിലനിർത്തി; ‘താഴെയിറക്കി/ഉയർത്തി’ എന്ന വിരുദ്ധജോടി മഗ്നിഫിക്കാത്തിലെ മറിച്ചിടൽ പ്രമേയം വ്യക്തമാക്കുന്നു.
