revisions:
- from: നമ്മുടെ ദൈവത്തിന്റെ ആർദ്രകരുണ നിമിത്തം, ഉയരത്തിൽനിന്നുള്ള ഉദയം[a] നമ്മെ സന്ദർശിക്കും.
  to: നമ്മുടെ ദൈവത്തിന്റെ ആർദ്രകരുണ നിമിത്തം, അതുമൂലം ഉന്നതത്തിൽനിന്നുള്ള ഉദയം[a] നമ്മെ സന്ദർശിക്കും.
  rationale: The revision explicitly reflects the referential link of ἐν οἷς through ‘അതുമൂലം,’ while preserving the source's causal structure, future tense, and light imagery. The footnote retains the lexical ambiguity and prophetic resonance without overdetermining its theological force.
