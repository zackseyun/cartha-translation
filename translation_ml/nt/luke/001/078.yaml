id: LUK.1.78
reference: Luke 1:78
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: ml
  text: നമ്മുടെ ദൈവത്തിന്റെ ആർദ്രകരുണ നിമിത്തം, അതുമൂലം ഉന്നതത്തിൽനിന്നുള്ള ഉദയം[a] നമ്മെ സന്ദർശിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രഭാതം’ എന്നും വിവർത്തനം ചെയ്യാം; ἀνατολή എന്ന ഗ്രീക്കുപദം ഗ്രീക്ക് പഴയനിയമത്തിൽ മിശിഹായെ സൂചിപ്പിക്കുന്ന ‘ശാഖ’ എന്ന പദത്തിന്റെ പ്രതിധ്വനിയും ഉണർത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ σπλάγχνα ἐλέους
  choice: ആർദ്രകരുണ നിമിത്തം
  rationale: διά + accusative കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. σπλάγχνα ἐλέους ആഴമുള്ള ആന്തരിക അനുകമ്പയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായതിനാൽ, സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ ‘ആർദ്രകരുണ’ എന്നു നൽകി.
- source_word: θεοῦ ἡμῶν
  choice: നമ്മുടെ ദൈവത്തിന്റെ
  rationale: ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν οἷς
  choice: (ആ കരുണ) നിമിത്തം
  rationale: മുൻപുള്ള കരുണയെ സന്ദർശനത്തിന്റെ അടിസ്ഥാനമോ പ്രവർത്തനമാർഗമോ ആയി ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി കാരണബന്ധത്തിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: ἐπισκέψεται
  choice: സന്ദർശിക്കും
  rationale: ഭാവികാലരൂപം നിലനിർത്തുകയും ദൈവത്തിന്റെ കൃപാപൂർവ ഇടപെടലെന്ന അർത്ഥസാധ്യത സന്ദർഭത്തിന് വിടുകയും ചെയ്യുന്നു.
- source_word: ἀνατολὴ
  choice: ഉദയം
  rationale: തുടർന്നുള്ള വെളിച്ചത്തിന്റെ ദൃശ്യബിംബവുമായി ചേരുന്ന ‘ഉദയം’ എന്ന അർത്ഥം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; ‘ശാഖ’ എന്ന മിശിഹാ പ്രതിധ്വനി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐξ ὕψους
  choice: ഉയരത്തിൽനിന്നുള്ള
  rationale: ഗ്രീക്കിലെ ഉയർന്ന ഇടത്തിൽനിന്ന് എന്ന രൂപകം വ്യാഖ്യാനിച്ച് ‘സ്വർഗത്തിൽനിന്ന്’ എന്നു മാറ്റാതെ അടുത്തായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: മിശിഹാസന്ദർഭത്തിലെ ἀνατολή എന്ന പദത്തിന്റെ അർത്ഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ഉദയം’
  alternative: ‘പ്രഭാതം’; ഗ്രീക്ക് പഴയനിയമത്തിലെ മിശിഹാപദവിയായ ‘ശാഖ’യുടെ പ്രതിധ്വനി
  rationale: 1:79-ലെ ഇരുട്ടിലും മരണനിഴലിലും പ്രകാശിക്കുന്ന വെളിച്ചം എന്ന അടുത്ത സന്ദർഭം ഉദയം/പ്രഭാതം എന്ന ദൃശ്യബിംബത്തെ ശക്തിപ്പെടുത്തുന്നു. എന്നാൽ ‘ശാഖ’ എന്ന പ്രവാചകപ്രയോഗത്തിന്റെ സാധ്യത ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കാവ്യാത്മകമായ വെളിച്ചരൂപകം നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായ സഭാപരമായ പ്രത്യേകപദാവലി ഒഴിവാക്കി.
