  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: ml
  text: ആറാം മാസത്തിൽ[a], ഗബ്രിയേൽ ദൂതൻ ദൈവത്തിൽനിന്ന് ഗലീലയിലെ നസറെത്ത് എന്നു പേരുള്ള ഒരു പട്ടണത്തിലേക്ക് അയയ്ക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, എലിസബത്തിന്റെ ഗർഭകാലത്തിന്റെ ആറാം മാസം; ലൂക്കോസ് 1:24, 36 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: ആറാം മാസത്തിൽ
  rationale: ἐν സഹിതമുള്ള ദത്തിവ് കാലസൂചന നൽകുന്നു. δέ മൃദുവായ ആഖ്യാനബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ സ്വാഭാവികമായ വാക്യപ്രവാഹത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: ἀπεστάλη
  choice: അയയ്ക്കപ്പെട്ടു
  rationale: ἀποστέλλω എന്ന ക്രിയയുടെ ഏഓറിസ്റ്റ് കർമണിപ്രയോഗം നിലനിർത്തുന്നു; ദൗത്യത്തിന്റെ സ്വഭാവം അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ὁ ἄγγελος Γαβριὴλ
  choice: ഗബ്രിയേൽ ദൂതൻ
  rationale: ഈ സന്ദർഭത്തിൽ ἄγγελος സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ സ്വാഭാവിക നാമക്രമത്തിൽ വ്യക്തിനാമത്തിനു ശേഷം ‘ദൂതൻ’ നൽകി.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ അടുക്കൽനിന്ന്
  rationale: ἀπό + ഷഷ്ഠി ഇവിടെ ഉറവിടം/പുറപ്പെടുന്ന സ്ഥലം ഊന്നുന്നു. ‘ദൈവത്താൽ’ എന്ന ഏജൻസി-കേന്ദ്രിത രൂപത്തേക്കാൾ ഗ്രീക്കിനോട് ചേർന്നതാണ്.
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: ഗലീലയിലെ ഒരു പട്ടണത്തിലേക്ക്
  rationale: εἰς ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു. τῆς Γαλιλαίας എന്ന ഷഷ്ഠിയെ മലയാളത്തിൽ സ്വാഭാവികമായി സ്ഥാനബന്ധം സൂചിപ്പിക്കുന്ന ‘ഗലീലയിലെ’ എന്നു നൽകി.
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: നസറെത്ത് എന്നു പേരുള്ള
  rationale: ‘അതിന്റെ പേര് നസറെത്ത്’ എന്ന ബന്ധവാക്യത്തിന്റെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ആറാം മാസം’ എന്നതിന്റെ സൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘ആറാം മാസം’ എന്നു മാത്രം നിലനിർത്തി; അടിക്കുറിപ്പിൽ എലിസബത്തിന്റെ ഗർഭകാലമാണെന്ന് സന്ദർഭപരമായി വിശദീകരിച്ചു.
  alternative: വർഷത്തിലെ പൊതുവായ ആറാം മാസം; അല്ലെങ്കിൽ പ്രധാനപാഠത്തിൽ തന്നെ ‘എലിസബത്തിന്റെ ഗർഭധാരണത്തിന്റെ ആറാം മാസം’ എന്നു വിപുലീകരിക്കൽ.
  rationale: ലൂക്കോസ് 1:24, 36 എന്നിവയുടെ സമീപസന്ദർഭം എലിസബത്തിന്റെ ഗർഭകാലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഈ വാക്യത്തിലെ ഗ്രീക്ക് അത് വീണ്ടും വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും യഥാർഥ പരാമർശസാധ്യതയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പവും ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്കിലെ കർമണിപ്രയോഗവും ‘ദൈവത്തിന്റെ അടുക്കൽനിന്ന്’ എന്ന ഉറവിടസൂചനയും നിലനിർത്തി. ‘ഗലീലയിലെ’ എന്ന രൂപം മലയാളത്തിൽ വ്യക്തമായതിനാൽ ഇംഗ്ലീഷ് പാഠത്തിലെ [b] എന്ന പകരവായനയ്ക്ക് പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
