  source_fidelity: മൂലഗ്രീക്കിലെ പ്രതികരണരൂപം, പരിശുദ്ധാത്മാവിന്റെ വരവ്, അത്യുന്നതന്റെ ശക്തിയുടെ നിഴൽരൂപകം, ഫലസൂചകമായ διὸ καὶ, ജനിക്കപ്പെടുന്നവനെക്കുറിച്ചുള്ള ἅγιον-ന്റെ വാക്യഘടനാസാധ്യത, κληθήσεται എന്ന കർമണിരൂപം, υἱὸς θεοῦ എന്ന ശീർഷകപ്രയോഗം എന്നിവ വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു. ‘ജനിക്കാനിരിക്കുന്ന’ എന്നത് വർത്തമാന കർമണിപങ്കാളിയുടെ സന്ദർഭോചിതമായ മലയാളരൂപമാണ്; അടിക്കുറിപ്പ് കൂടുതൽ പദശഃ സാധ്യതയും വ്യാകരണദ്വയാർഥവും സംരക്ഷിക്കുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമാണ്. ‘ദൂതൻ അവളോടു മറുപടി പറഞ്ഞു,’ ‘പരിശുദ്ധാത്മാവ് നിന്റെമേൽ വരും,’ ‘അത്യുന്നതന്റെ ശക്തി നിന്റെമേൽ നിഴലിടും’ എന്നിവ സ്വാഭാവികമായ തിരുവെഴുത്തുശൈലിയിൽ വായിക്കപ്പെടുന്നു.
  terminology: ‘പരിശുദ്ധാത്മാവ്,’ ‘അത്യുന്നതൻ,’ ‘പരിശുദ്ധൻ,’ ‘ദൈവപുത്രൻ’ എന്നിവ സ്ഥിരതയുള്ളതും സന്ദർഭത്തിനു യോജിച്ചതുമായ പ്രയോഗങ്ങളാണ്. ‘ദൈവപുത്രൻ’ അനിശ്ചിതമായ ഒരു പുത്രൻ എന്നല്ലാതെ ശീർഷകഭാവം സ്വാഭാവികമായി നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ [a], [b] യഥാക്രമം പ്രസക്തമായ പദങ്ങളിൽ ശരിയായി നങ്കൂരമിട്ടിരിക്കുന്നു.
