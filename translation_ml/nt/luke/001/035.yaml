id: LUK.1.35
reference: Luke 1:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: ml
  text: 'ദൂതൻ അവളോടു മറുപടി പറഞ്ഞു: “പരിശുദ്ധാത്മാവ് നിന്റെമേൽ വരും; അത്യുന്നതന്റെ ശക്തി നിന്റെമേൽ നിഴലിടും. അതുകൊണ്ട് ജനിക്കാനിരിക്കുന്ന പരിശുദ്ധൻ[a] ദൈവപുത്രൻ[b] എന്നു വിളിക്കപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജനിക്കാനിരിക്കുന്നവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. τὸ γεννώμενον എന്ന ഗ്രീക്ക് പ്രയോഗം പദശഃ ‘ജനിക്കപ്പെടുന്നത്’ അല്ലെങ്കിൽ ‘ജനിക്കുന്നവൻ’ എന്നാണ്; സന്ദർഭത്തിൽ അത് ജനിക്കാനിരിക്കുന്ന ശിശുവിനെ സൂചിപ്പിക്കുന്നു. വാക്യഘടനയെ ‘ജനിക്കാനിരിക്കുന്ന ശിശു പരിശുദ്ധൻ എന്നു വിളിക്കപ്പെടും’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: ‘ദൈവപുത്രൻ’ എന്നതിനു പിന്നിലെ ഗ്രീക്ക് പ്രയോഗത്തിൽ ‘പുത്രൻ’ എന്ന പദത്തിനു മുമ്പ് നിർദ്ദേശകവാചകം ഇല്ല. എങ്കിലും ഈ സന്ദർഭത്തിൽ അത് ‘ദൈവത്തിന്റെ ഒരു പുത്രൻ’ എന്ന അനിശ്ചിത അർഥത്തിലല്ല, ഒരു ശീർഷകമായാണ് പ്രവർത്തിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: ദൂതൻ അവളോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പങ്കാളിത്തക്രിയയായ ἀποκριθείς സന്ദർഭത്തിൽ സജീവമായ ‘മറുപടി നൽകി’ എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ പ്രതികരണഭാവം ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: Πνεῦμα ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ഇത് വെറും വിശുദ്ധമായ മനോഭാവത്തെയോ വ്യക്തിത്വരഹിത ശക്തിയെയോ അല്ല, ദൈവത്തിന്റെ ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പരിശുദ്ധാത്മാവ്’ ആ വ്യക്തമായ ദൈവിക പരാമർശം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: നിന്റെമേൽ വരും
  rationale: ἐπίയോടുകൂടിയ ക്രിയ ശക്തമായി ഒരാളുടെമേൽ വരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നിന്റെമേൽ വരും’ അതിന്റെ ദിശയും പ്രവർത്തനഭാവവും നിലനിർത്തുന്നു.
- source_word: δύναμις Ὑψίστου
  choice: അത്യുന്നതന്റെ ശക്തി
  rationale: Ὑψίστου ദൈവത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനനാമസ്വഭാവമുള്ള വിശേഷണമാണ്; ‘അത്യുന്നതൻ’ എന്ന രൂപം ആ ബഹുമാനപൂർവമായ ശീർഷകഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐπισκιάσει σοι
  choice: നിന്റെമേൽ നിഴലിടും
  rationale: ദൈവസാന്നിധ്യത്തിന്റെ നിഴൽ/ആവരണ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; മൂലപാഠത്തിലില്ലാത്ത ജൈവികമോ ലൈംഗികമോ ആയ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: διὸ καὶ
  choice: അതുകൊണ്ട്
  rationale: ഇത് മുൻപറഞ്ഞ ദൈവിക പ്രവർത്തനത്തിന്റെ ഫലത്തെ സൂചിപ്പിക്കുന്നു. καίയുടെ ലഘുവായ ഊന്നൽ മലയാളത്തിലെ ഈ സന്ദർഭത്തിൽ പ്രത്യേക പദം ചേർക്കാതെയും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: τὸ γεννώμενον ἅγιον
  choice: ജനിക്കാനിരിക്കുന്ന പരിശുദ്ധൻ
  rationale: നപുംസകലിംഗത്തിലുള്ള ഗ്രീക്ക് പദസമുച്ചയം ജനിക്കപ്പെടുന്നവനെ/ശിശുവിനെ സൂചിപ്പിക്കുന്നു; ἅγιον നൽകുന്ന പരിശുദ്ധതയുടെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപം ഉപയോഗിച്ചു. പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: κληθήσεται
  choice: എന്നു വിളിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിരൂപത്തിന്റെ ‘വിളിക്കപ്പെടും/അറിയപ്പെടും’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; ഇത് പേര് നൽകലിനെയും തിരിച്ചറിയപ്പെടുന്ന പദവിയെയും അനുവദിക്കുന്നു.
- source_word: υἱὸς θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: ഗ്രീക്കിൽ ‘പുത്രൻ’ എന്നതിന് നിർദ്ദേശകവാചകം ഇല്ലെങ്കിലും ഈ സന്ദർഭത്തിൽ പ്രയോഗം അനിശ്ചിതമായ ‘ഒരു പുത്രൻ’ എന്നല്ല, ക്രിസ്തുശീർഷകമായാണ് പ്രവർത്തിക്കുന്നത്. മലയാളത്തിൽ ‘ദൈവപുത്രൻ’ ആ ശീർഷകഭാവം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: Πνεῦμα ἅγιον എന്നതിലെ ദൈവിക വ്യക്തിപരമായ പരാമർശം
  choice: പരിശുദ്ധാത്മാവ്
  alternative: പരിശുദ്ധമായ ആത്മാവ് / വിശുദ്ധാത്മാവ്
  rationale: ലൂക്കോസിന്റെ സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ആത്മാവാണ് യേശുവിന്റെ ഗർഭധാരണത്തിൽ പ്രവർത്തിക്കുന്ന ദൈവിക കർത്താവ്. വിവർത്തനം അതിനെ വെറും വ്യക്തിത്വരഹിത ശക്തിയായി ചുരുക്കുന്നില്ല; അതേസമയം ഈ വാക്യം പറയുന്നതിന് അപ്പുറമുള്ള വിശദീകരണവും ചേർക്കുന്നില്ല.
- issue: τὸ γεννώμενον ἅγιον എന്ന പദസമുച്ചയത്തിലെ വ്യാകരണബന്ധം
  choice: ജനിക്കാനിരിക്കുന്ന പരിശുദ്ധൻ
  alternative: ജനിക്കാനിരിക്കുന്ന ശിശു പരിശുദ്ധൻ എന്നു വിളിക്കപ്പെടും
  rationale: ഗ്രീക്ക് രൂപത്തിൽ ἅγιον എന്നത് ജനിക്കപ്പെടുന്നവനെ വിശേഷിപ്പിക്കുന്നതായോ അവനെക്കുറിച്ച് പ്രസ്താവിക്കുന്നതായോ വായിക്കാൻ ഇടയുണ്ട്. മുഖ്യവാചകം സ്രോതസ്സിനോടടുത്ത വിശേഷണബന്ധം സ്വീകരിക്കുന്നു; മറ്റൊരു സ്വാഭാവിക സാധ്യത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
- issue: υἱὸς θεοῦ എന്ന അനിർദ്ദേശക ഗ്രീക്ക് രൂപത്തിന്റെ ശീർഷകഭാവം
  choice: ദൈവപുത്രൻ
  alternative: ദൈവത്തിന്റെ ഒരു പുത്രൻ
  rationale: നിർദ്ദേശകവാചകത്തിന്റെ അഭാവം ഇവിടെ അനിശ്ചിതത്വം നിർബന്ധിക്കുന്നില്ല. അറിയിപ്പിന്റെ സന്ദർഭത്തിൽ ഇത് യേശുവിന്റെ സവിശേഷ തിരിച്ചറിയൽ സൂചിപ്പിക്കുന്ന ശീർഷകമാണ്; മലയാളത്തിലെ സമാസരൂപം അനാവശ്യമായി ‘ഒരു’ ചേർക്കാതെ അത് സംരക്ഷിക്കുന്നു.
- issue: ദൈവിക പ്രവർത്തനത്തിന്റെ രൂപകഭാഷ
  choice: നിന്റെമേൽ നിഴലിടും
  alternative: നിന്നെ ആവരണം ചെയ്യും
  rationale: ἐπισκιάσει എന്നതിലെ നിഴൽരൂപകം സംരക്ഷിക്കുകയും ദൈവിക പ്രവർത്തനം എങ്ങനെയാണെന്ന് മൂലപാഠത്തേക്കാൾ കൂടുതൽ യാന്ത്രികമായോ ജൈവികമായോ വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘നിന്റെമേൽ’, ‘അത്യുന്നതൻ’, ‘നിഴലിടും’, ‘വിളിക്കപ്പെടും’ എന്നീ രൂപങ്ങൾ തിരുവെഴുത്തിന്റെ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. മൂലപാഠത്തിലെ രൂപകവും വ്യാകരണപരമായ ചെറിയ ദ്വയാർഥസാധ്യതയും അനാവശ്യമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
