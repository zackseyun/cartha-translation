id: LUK.1.75
reference: Luke 1:75
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: ml
  text: അവന്റെ സന്നിധിയിൽ വിശുദ്ധിയിലും നീതിയിലും നമ്മുടെ ആയുഷ്കാലമൊക്കെയും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായം.’
    reason: δικαιοσύνη എന്ന പദത്തിന്റെ പ്രസക്തമായ മറ്റൊരു അർഥസാധ്യത നിലനിർത്താൻ.
lexical_decisions:
- source_word: ἐν
  choice: -യോടും...കൂടെ
  rationale: ശുശ്രൂഷ നിർവഹിക്കപ്പെടുന്ന രീതിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായി, മലയാളത്തിൽ സ്വാഭാവികമായ സഹവാചകഘടന ഉപയോഗിച്ചു.
- source_word: ὁσιότητι
  choice: വിശുദ്ധി
  rationale: ദൈവത്തോടുള്ള ബന്ധത്തിലെ വിശുദ്ധിയും ഭക്തിനിഷ്ഠയും സൂചിപ്പിക്കുന്നു; δικαιοσύνηയിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: രണ്ട് സമാന്തര ദത്തിവുപദങ്ങളെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: δικαιοσύνῃ
  choice: നീതി
  rationale: ദൈവസന്നിധിയിലെ ധാർമിക നേരും ശരിയായ പെരുമാറ്റവും ഉൾക്കൊള്ളുന്ന സാധാരണ മലയാളപദം; ഇവിടെ 'ന്യായം' എന്ന അർഥസാധ്യതയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐνώπιον αὐτοῦ
  choice: അവന്റെ സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യത്തിലും ദൃഷ്ടിയിലുമെന്ന ബന്ധപരവും വിലയിരുത്തൽപരവുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: നമ്മുടെ ആയുഷ്കാലമൊക്കെയും
  rationale: അക്ഷരാർഥത്തിലെ 'നമ്മുടെ എല്ലാ ദിവസങ്ങളും' എന്നത് സൂചിപ്പിക്കുന്ന ജീവിതകാലമുഴുവൻ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പൗലൊസിന്റെ ലേഖനങ്ങൾക്കു പുറത്തുള്ള ധാർമിക സന്ദർഭത്തിൽ δικαιοσύνηയുടെ വിവർത്തനം
  choice: നീതി
  alternative: ന്യായം
  rationale: ὁσιότηςയോടു ചേർന്ന് ദൈവസന്നിധിയിലെ നേരും ധാർമിക ശരിതനിമയും വിവരിക്കുന്നതിനാൽ 'നീതി' ഏറ്റവും യോജിക്കുന്നു. സാമൂഹികമോ ന്യായവിധിപരമോ ആയ 'ന്യായം' എന്ന അർഥവും സാധ്യമാകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന ആശയത്തിന്റെ തുടർച്ചയായതിനാൽ മൂലത്തിലെ ഖണ്ഡവാക്യസ്വഭാവം നിലനിർത്തി.
