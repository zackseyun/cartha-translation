revisions:
- from: അവന്റെ സന്നിധിയിൽ വിശുദ്ധിയോടും നീതിയോടുംകൂടെ നമ്മുടെ ആയുഷ്കാലമൊക്കെയും[a].
  to: അവന്റെ സന്നിധിയിൽ വിശുദ്ധിയിലും നീതിയിലും നമ്മുടെ ആയുഷ്കാലമൊക്കെയും[a].
  rationale: The revision replaces an awkward instrumental/comitative coordination with a natural Malayalam parallel locative construction that faithfully represents Greek ἐν. It also normalizes the footnote so that it states the lexical alternative clearly, without altering meaning or reducing the ambiguity of δικαιοσύνη.
  reviewer_model: gpt-5.6-terra
