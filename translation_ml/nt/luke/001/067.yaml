id: LUK.1.67
reference: Luke 1:67
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: ml
  text: 'അവന്റെ പിതാവായ സെഖര്യാവ് പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞ് ഇങ്ങനെ പ്രവചിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζαχαρίας
  choice: സെഖര്യാവ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: അവന്റെ പിതാവായ
  rationale: യോഹന്നാനെയാണ് αὐτοῦ സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ ബന്ധസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐπλήσθη
  choice: നിറഞ്ഞ്
  rationale: πίμπλημι എന്ന ക്രിയയുടെ സംഭവാത്മകമായ നിഷ്ക്രിയ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള പ്രവചനവുമായി ക്രിയയെ ബന്ധിപ്പിക്കുന്നു.
- source_word: πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിനാൽ
  rationale: ലൂക്കായുടെ വിവരണത്തിൽ ദൈവത്തിന്റെ ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; നിറയലിന്റെ കാരണത്തെയോ പ്രവർത്തകശക്തിയെയോ മലയാളത്തിലെ instrumental രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπροφήτευσεν
  choice: പ്രവചിച്ചു
  rationale: പ്രവാചകപ്രേരിതമായ ഉച്ചാരണത്തിന്റെ ശക്തി നേരിട്ട് നിലനിർത്തുന്ന സാധാരണ മലയാള പദം.
- source_word: λέγων
  choice: ഇങ്ങനെ
  rationale: തുടർന്ന് വരുന്ന പ്രവചനവാക്കുകൾ അവതരിപ്പിക്കുന്ന പങ്ക് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; 'പറഞ്ഞുകൊണ്ട്' എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Καὶ
  choice: അവന്റെ പിതാവായ…
  rationale: ഗ്രീക്കിലെ καί കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ നിർബന്ധിതമായ 'അപ്പോൾ/കൂടാതെ' ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ തുടർച്ച നിലനിർത്തുന്നത് സ്വാഭാവികമാണ്.
theological_decisions:
- issue: πνεύματος ἁγίου എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പരിശുദ്ധാത്മാവ്
  alternative: ഒരു വിശുദ്ധാത്മാവ് / വിശുദ്ധമായ ആത്മാവ്
  rationale: ലൂക്കാ–അപ്പൊസ്തലപ്രവൃത്തികളിലെ ദൈവിക പ്രേരണയുടെ സാഹചര്യത്തിൽ ഈ പ്രയോഗം ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു; പാഠത്തിനു പുറത്തുള്ള അധിക സിദ്ധാന്തവിവരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. അടുത്ത വാക്യത്തിൽ ആരംഭിക്കുന്ന നേരിട്ടുള്ള പ്രവചനത്തെ മുന്നറിയിപ്പിക്കാൻ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
