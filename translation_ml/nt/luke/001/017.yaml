id: LUK.1.17
reference: Luke 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: ml
  text: അവൻ ഏലിയാവിന്റെ ആത്മാവിലും ശക്തിയിലും[c] അവന്റെ മുമ്പായി പോകും—പിതാക്കന്മാരുടെ ഹൃദയങ്ങളെ മക്കളുടെ നേരേ[a] തിരിക്കാനും, അനുസരണക്കേടുള്ളവരെ നീതിമാന്മാരുടെ വിവേകത്തിലേക്കു[b] തിരിക്കാനും, കർത്താവിനുവേണ്ടി ഒരുക്കമുള്ള ഒരു ജനത്തെ സജ്ജമാക്കാനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മക്കളിലേക്കു’ എന്നും വിവർത്തനം ചെയ്യാം. ഈ പ്രയോഗം മലാഖി 4:6-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; കുടുംബബന്ധങ്ങളുടെ പുനഃസ്ഥാപനവും ഇതിൽ സൂചിപ്പിക്കപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നീതിമാന്മാരുടെ മനോഭാവത്തിലേക്ക്’ അല്ലെങ്കിൽ ‘നീതിമാന്മാരുടെ വിവേകത്തിൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ‘ഏലിയാവിന്റെ ആത്മാവിലും ശക്തിയിലും’ എന്നത് ഏലിയാവിനെപ്പോലെയുള്ള പ്രവാചകദൗത്യത്തെയും ശക്തിപ്പെടുത്തലിനെയും സൂചിപ്പിക്കുന്നു; ഏലിയാവ് തന്നെ അക്ഷരാർഥത്തിൽ മടങ്ങിവരുന്നു എന്ന് ഈ പ്രയോഗം നിർബന്ധമായി അർഥമാക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: അവിടുത്തെ മുമ്പിൽ പോകും
  rationale: പ്രവാചകദൗത്യത്തിൽ ഒരാളുടെ മുമ്പായി പോകുക എന്ന പ്രവർത്തനാർഥവും സന്നിധിയിൽ പോകുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സാധ്യതയും പൂർണമായി ചുരുക്കിക്കളയാതെ നിലനിർത്തുന്നു.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: ഏലിയാവിന്റെ ആത്മാവിലും ശക്തിയിലും
  rationale: ഏലിയാവിനോടുള്ള പ്രവാചകസാദൃശ്യവും ദൈവികമായ ശക്തിപ്പെടുത്തലും സൂചിപ്പിക്കുന്ന മൂലഭാഷയുടെ രൂപം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα
  choice: പിതാക്കന്മാരുടെ ഹൃദയങ്ങളെ മക്കളിലേക്കു തിരിക്കാൻ
  rationale: മലാഖി 4:6-ലെ പ്രതിധ്വനി നിലനിർത്തുകയും കുടുംബബന്ധങ്ങളുടെ പുനഃസ്ഥാപനമെന്ന സാധ്യത തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπειθεῖς
  choice: അനുസരിക്കാത്തവരെ
  rationale: വിശ്വസിക്കാൻ വിസമ്മതിക്കൽ, വഴങ്ങാതിരിക്കൽ, അനുസരണക്കേട് എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലമായ നൈതിക അർഥം നൽകുന്നു.
- source_word: ἐν φρονήσει δικαίων
  choice: നീതിമാന്മാരുടെ വിവേകത്തിലേക്ക്
  rationale: φρόνησις സൂചിപ്പിക്കുന്ന പ്രായോഗിക തിരിച്ചറിവും മനോഭാവവും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ἐπιστρέψαι-യോടുള്ള ദിശാസൂചകബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον
  choice: കർത്താവിനായി സജ്ജമായ ഒരു ജനത്തെ ഒരുക്കാൻ
  rationale: ἑτοιμάσαι എന്ന ഒരുക്കൽപ്രവൃത്തിയും perfect passive participle ആയ κατεσκευασμένον സൂചിപ്പിക്കുന്ന സജ്ജമായ അവസ്ഥയും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഏലിയാവിനെക്കുറിച്ചുള്ള ഭാഷയുടെ അർഥം
  choice: വരാനിരിക്കുന്നവൻ ഏലിയാവിന്റെ ആത്മാവിലും ശക്തിയിലും ശുശ്രൂഷ ചെയ്യുന്നു
  alternative: ഏലിയാവ് തന്നെ അക്ഷരാർഥത്തിൽ മടങ്ങിവരുന്നു
  rationale: ഗ്രീക്ക് വാക്യം വ്യക്തിത്വസമത്വം പ്രസ്താവിക്കാതെ ‘ഏലിയാവിന്റെ ആത്മാവിലും ശക്തിയിലും’ എന്നാണ് പറയുന്നത്; അതിനാൽ പ്രവാചകദൗത്യത്തിന്റെ തുടർച്ച മാത്രം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
- issue: αὐτοῦ, κυρίῳ എന്നിവയുടെ സൂചിതവ്യക്തി
  choice: ‘അവിടുത്തെ മുമ്പിൽ’, ‘കർത്താവിനായി’ എന്നിങ്ങനെ മൂലവാചകത്തിന്റെ പരാമർശരീതി നിലനിർത്തുന്നു
  alternative: മുഖ്യവാചകത്തിൽ ‘യേശുവിന്റെ/മശീഹയുടെ മുമ്പിൽ’ എന്നു വിശദീകരിക്കുക
  rationale: സന്ദർഭം സൂചിതവ്യക്തിയെ വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യം തന്നെ പേരുപറയുന്നില്ല; അതിനാൽ വിവർത്തനം അവ്യക്തത അനാവശ്യമായി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവിടുത്തെ’ എന്ന ആദരസൂചക സർവനാമം സ്വാഭാവിക മലയാളവായനയ്ക്ക് ഉപയോഗിച്ചെങ്കിലും സൂചിതവ്യക്തിയുടെ പേര് ചേർത്തിട്ടില്ല. ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന രണ്ടു infinitive ഘടകങ്ങളും ദീർഘവാക്യത്തിന്റെ പ്രവാഹം നിലനിർത്തുന്ന വിധത്തിൽ ‘തിരിക്കാനും… ഒരുക്കാനും’ എന്നു സമാന്തരമായി നൽകിയിരിക്കുന്നു.
