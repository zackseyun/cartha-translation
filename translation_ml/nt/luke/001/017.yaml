revisions:
- from: അവൻ ഏലിയാവിന്റെ ആത്മാവിലും ശക്തിയിലും[c] അവിടുത്തെ മുമ്പിൽ പോകും—പിതാക്കന്മാരുടെ ഹൃദയങ്ങളെ മക്കളിലേക്കും[a] അനുസരിക്കാത്തവരെ നീതിമാന്മാരുടെ വിവേകത്തിലേക്കും[b] തിരിക്കാനും കർത്താവിനായി സജ്ജമായ ഒരു ജനത്തെ ഒരുക്കാനും.
  to: അവൻ ഏലിയാവിന്റെ ആത്മാവിലും ശക്തിയിലും[c] അവന്റെ മുമ്പായി പോകും—പിതാക്കന്മാരുടെ ഹൃദയങ്ങളെ മക്കളുടെ നേരേ[a] തിരിക്കാനും, അനുസരണക്കേടുള്ളവരെ നീതിമാന്മാരുടെ വിവേകത്തിലേക്കു[b] തിരിക്കാനും, കർത്താവിനുവേണ്ടി ഒരുക്കമുള്ള ഒരു ജനത്തെ സജ്ജമാക്കാനും.
