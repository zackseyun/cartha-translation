id: LUK.1.42
reference: Luke 1:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: ml
  text: 'അവൾ ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു[a]: “സ്ത്രീകളിൽ നീ അനുഗ്രഹിക്കപ്പെട്ടവളാണ്; നിന്റെ ഗർഭഫലവും അനുഗ്രഹിക്കപ്പെട്ടതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വലിയൊരു വിളിയോടെ പറഞ്ഞു.”
    reason: κραυγῇ μεγάλῃ എന്ന പ്രയോഗത്തിന്റെ കൂടുതൽ പദാനുപദമായ അർഥവികൽപം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: വിളിച്ചുപറഞ്ഞു
  rationale: ഉച്ചത്തിൽ ശബ്ദമുയർത്തി പറയുക എന്ന ἀναφωνέωയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ദുഃഖകരമായ നിലവിളി എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: κραυγῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ
  rationale: രീതിയെ സൂചിപ്പിക്കുന്ന ദാതിവ് പ്രയോഗത്തിന്റെ ശക്തിയും കേൾവിയാകുന്ന ഉയർന്ന ശബ്ദവും സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Εὐλογημένη
  choice: അനുഗൃഹീതയാണ്
  rationale: സമ്പൂർണ കർമണി പങ്കുപദത്തിന്റെ ഫലാവസ്ഥയും ആശീർവാദപ്രഖ്യാപനത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: ἐν γυναιξίν
  choice: സ്ത്രീകളിൽ
  rationale: ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘എല്ലാ’ എന്ന പദം ചേർക്കാതെ സ്ത്രീകളുടെ ഇടയിൽ എന്ന ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εὐλογημένος
  choice: അനുഗൃഹീതമാണ്
  rationale: മറിയത്തെയും ഗർഭസ്ഥശിശുവിനെയും കുറിച്ചുള്ള സമാന്തര അനുഗ്രഹപ്രഖ്യാപനം വ്യാകരണപരമായി നിലനിർത്തുന്നു.
- source_word: ὁ καρπὸς
  choice: ഫലം
  rationale: ഉറവിടത്തിലെ രൂപകം സംരക്ഷിക്കുന്നു; ‘ശിശു’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: τῆς κοιλίας σου
  choice: നിന്റെ ഉദരത്തിന്റെ
  rationale: ഗർഭധാരണസന്ദർഭത്തിൽ κοιλίαയെ സൂചിപ്പിക്കുന്ന കൃത്യമായ മാതൃപ്രതീകം നൽകുകയും ‘ഉദരഫലം’ എന്ന സ്വാഭാവിക ബൈബിൾ പ്രയോഗം രൂപപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മറിയത്തോടുള്ള അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ വിവർത്തനം
  choice: സ്ത്രീകളിൽ നീ അനുഗൃഹീതയാണ്
  alternative: സ്ത്രീകളിൽ നീ അനുഗ്രഹിക്കപ്പെട്ടവളാണ്
  rationale: വാക്യത്തിലെ മറിയത്തിന്റെ പ്രത്യേക അനുഗൃഹീതാവസ്ഥ വ്യക്തമാക്കുന്നു; എന്നാൽ പാഠത്തിനപ്പുറമുള്ള പിൽക്കാല സിദ്ധാന്തവികാസങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഉദരഫലം’ എന്ന പദം ഉറവിടത്തിലെ രൂപകവും വാക്യത്തിന്റെ ഗൗരവവും സംരക്ഷിക്കുന്നു; പ്രധാന പാഠത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
