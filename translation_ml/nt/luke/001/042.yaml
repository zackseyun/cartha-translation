  to: 'അവൾ ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു[a]: “സ്ത്രീകളിൽ നീ അനുഗ്രഹിക്കപ്പെട്ടവളാണ്; നിന്റെ ഗർഭഫലവും അനുഗ്രഹിക്കപ്പെട്ടതാണ്.”'
  rationale: The revision retains the source’s audible, emphatic proclamation and the parallel blessing formula, while using idiomatic modern Malayalam passive forms. “ഗർഭഫലം” preserves “the fruit of your womb” without adding interpretive content.
