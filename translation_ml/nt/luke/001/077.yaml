  text: അവന്റെ ജനത്തിന് അവരുടെ പാപങ്ങളുടെ ക്ഷമയിൽ രക്ഷയെക്കുറിച്ചുള്ള അറിവ് നൽകാൻ,[a]
  philosophy: optimal-equivalence
  footnotes:
