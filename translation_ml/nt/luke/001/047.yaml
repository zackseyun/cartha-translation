id: LUK.1.47
reference: Luke 1:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: ml
  text: എന്റെ ആത്മാവും എന്റെ രക്ഷകനായ ദൈവത്തിൽ ആനന്ദിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അതിയായി ആഹ്ലാദിച്ചു.’
    reason: ἠγαλλίασεν എന്ന പദത്തിലെ അത്യുത്സാഹപൂർണമായ സന്തോഷത്തിന്റെ ശക്തി വ്യക്തമാക്കുന്ന പദപരമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: καὶ
  choice: -ഉം (ആത്മാവും)
  rationale: മുൻവാക്യത്തിലെ സമാന്തര വരിയുമായി ഈ വരിയെ ബന്ധിപ്പിക്കുന്ന ലളിതമായ സംയോജകമാണ്. മലയാളത്തിൽ ‘ആത്മാവും’ എന്ന പ്രയോഗം ആ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἠγαλλίασεν
  choice: ആനന്ദിച്ചു
  rationale: അതിയായ സന്തോഷത്തെ സൂചിപ്പിക്കുന്ന aorist active indicative രൂപമാണ്. ‘ആനന്ദിച്ചു’ പൂർത്തിയായ പ്രവൃത്തിയെ ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കൂടുതൽ തീവ്രതയുള്ള ‘അതിയായി ആഹ്ലാദിച്ചു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τὸ πνεῦμά μου
  choice: എന്റെ ആത്മാവ്
  rationale: മുൻവാക്യത്തിലെ ‘എന്റെ പ്രാണൻ’ എന്നതിനോടുള്ള കാവ്യാത്മക സമാന്തരത നിലനിർത്തിക്കൊണ്ട് πνεῦμα എന്ന വ്യത്യസ്ത പദത്തിന്റെ രൂപവും സംരക്ഷിക്കുന്നു; സാങ്കേതികമായ മനുഷ്യശാസ്ത്ര വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: ἐπὶ τῷ θεῷ
  choice: ദൈവത്തിൽ
  rationale: ἀγαλλιάω എന്ന ക്രിയയോടൊപ്പം ἐπί + dative സന്തോഷത്തിന്റെ അടിസ്ഥാനത്തെയോ വിഷയത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ദൈവത്തിൽ ആനന്ദിച്ചു’ എന്നത് ബന്ധപരമായ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῷ σωτῆρί μου
  choice: എന്റെ രക്ഷകനായ
  rationale: σωτήρ എന്ന പദത്തിന്റെ സാധാരണവും പുതിയനിയമത്തിൽ സ്ഥാപിതവുമായ അർഥം ‘രക്ഷകൻ’ എന്നാണ്. ‘എന്റെ രക്ഷകനായ ദൈവം’ ഗ്രീക്കിലെ വ്യക്തിപരവും ദൈവശാസ്ത്രപരവുമായ പ്രസ്താവന നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തെ മറിയയുടെ ‘രക്ഷകൻ’ എന്നു വിശേഷിപ്പിക്കൽ
  choice: എന്റെ രക്ഷകനായ ദൈവം
  alternative: എന്നെ വിടുവിക്കുന്ന ദൈവം
  rationale: ഗ്രീക്ക് ദൈവത്തെ മറിയയുടെ σωτήρ എന്നു നേരിട്ട് തിരിച്ചറിയിക്കുന്നു. അധികമായ ഉപദേശനിഗമനങ്ങൾ ചേർക്കാതെയും അർഥം മയപ്പെടുത്താതെയും ആ പ്രസ്താവന നിലനിർത്തുന്നു.
- issue: സമീപസന്ദർഭത്തിലെ ‘പ്രാണൻ’–‘ആത്മാവ്’ ബന്ധം
  choice: ‘ആത്മാവ്’ എന്ന വ്യത്യസ്ത പദം നിലനിർത്തുക
  alternative: രണ്ടും ഒരേ മലയാളപദത്തിൽ ലയിപ്പിക്കുക
  rationale: കാവ്യാത്മക സമാന്തരതയിൽ അർഥസാമീപ്യമുണ്ടെങ്കിലും ഗ്രീക്ക് വ്യത്യസ്ത പദങ്ങൾ ഉപയോഗിക്കുന്നു. അവ വേർതിരിച്ചു നിലനിർത്തുന്നത് വാചകത്തിന്റെ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കാവ്യഭാഷയാണ് ഉപയോഗിച്ചത്. മുൻവാക്യത്തോടുള്ള ബന്ധം ‘ആത്മാവും’ എന്നതിലൂടെ സൂചിപ്പിച്ചു; ഗ്രീക്ക് aorist-നെ അനാവശ്യമായ ഫലാവസ്ഥ ചേർക്കാതെ ‘ആനന്ദിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
