  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: ml
  text: നമ്മുടെ പിതാക്കന്മാരോട്[a] പറഞ്ഞതുപോലെ, അബ്രാഹാമിനും അവന്റെ സന്തതിക്കും[b] എന്നേക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ പൂർവികരോട്.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘നമ്മുടെ പിതാക്കന്മാരോട്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവന്റെ വിത്തിനും.’ ഗ്രീക്കിൽ ‘വിത്ത്,’ ‘സന്തതി,’ ‘വംശജർ’ എന്നീ അർഥങ്ങൾ വരാവുന്ന ഏകവചന സമൂഹവാചക നാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: പറഞ്ഞതുപോലെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ദൈവിക പ്രവൃത്തി പൂർവികരോടുള്ള വചനത്തിന് അനുസൃതമാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐλάλησεν
  choice: പറഞ്ഞു
  rationale: λαλέω എന്ന ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാരോട്
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പുരുഷലിംഗ ബഹുവചനവും ഇസ്രായേലിന്റെ ഉടമ്പടിചരിത്രത്തിലെ പിതൃപൂർവികരെക്കുറിച്ചുള്ള ഭാവവും നിലനിർത്തുന്നു; കൂടുതൽ ലിംഗനിരപേക്ഷമായ ‘പൂർവികരോട്’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῷ Ἀβραὰμ
  choice: അബ്രാഹാമിനും
  rationale: ദാതൃവിഭക്തി മലയാളത്തിലെ ‘-നും’ രൂപത്തിൽ സ്വാഭാവികമായി നൽകി, മുൻപുള്ള ‘പറഞ്ഞു’ എന്ന ക്രിയയോടുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: അവന്റെ സന്തതിക്കും
  rationale: σπέρμα എന്ന ഏകവചന സമൂഹവാചകത്തിന്റെ ‘വിത്ത്/സന്തതി/വംശജർ’ അർഥപരിധിയിൽ, ‘സന്തതി’ സ്വാഭാവിക മലയാളവും സമൂഹവാചക സ്വഭാവം കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: εἰς τὸν αἰῶνα
  choice: എന്നേക്കും
  rationale: കാലാതീതമായ തുടർച്ച സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
theological_decisions:
- issue: πατέρας ἡμῶν എന്ന ഉടമ്പടിസംബന്ധിയായ പുരുഷലിംഗ പ്രയോഗം
  choice: നമ്മുടെ പിതാക്കന്മാരോട്
  alternative: നമ്മുടെ പൂർവികരോട്
  rationale: മൂലത്തിലെ പുരുഷലിംഗ രൂപവും ഇസ്രായേലിന്റെ പിതൃപൂർവികരെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ അനുരണനവും പ്രധാനവാചകത്തിൽ നിലനിർത്തി; ഉൾക്കൊള്ളുന്ന പൊതുവായ അർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: അബ്രാഹാമിക വാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള σπέρματι αὐτοῦ
  choice: അവന്റെ സന്തതിക്കും
  alternative: അവന്റെ വിത്തിനും; അവന്റെ വംശജർക്കും
  rationale: ‘സന്തതി’ ഗ്രീക്കിലെ ഏകവചന സമൂഹവാചകത്വവും ഉടമ്പടിപരമായ അർഥസാധ്യതയും അനാവശ്യമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു; കൂടുതൽ പദാനുപദമായ ‘വിത്ത്’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ പോലുള്ള പഴയ ആരാധനാഭാഷ ഒഴിവാക്കി ‘പറഞ്ഞു’ ഉപയോഗിച്ചു; എന്നാൽ ‘പിതാക്കന്മാർ,’ ‘സന്തതി’ എന്നീ പദങ്ങളിലൂടെ മൂലത്തിലെ ഉടമ്പടിപരമായ ഭാവവും അർഥവ്യാപ്തിയും നിലനിർത്തി.
