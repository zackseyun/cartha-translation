id: LUK.1.23
reference: Luke 1:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: ml
  text: അവന്റെ ശുശ്രൂഷയുടെ ദിവസങ്ങൾ പൂർത്തിയായപ്പോൾ[b], അവൻ തന്റെ വീട്ടിലേക്ക് പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ ഭവനത്തിലേക്ക്.’ ഗ്രീക്ക് പദം വീടെന്ന കെട്ടിടത്തെയോ, വിശാലമായ അർഥത്തിൽ സ്വന്തം ഭവനത്തെയോ കുടുംബത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ശുശ്രൂഷ’ എന്നത് പുരോഹിതനായ സെഖര്യാവിന് നിശ്ചയിക്കപ്പെട്ടിരുന്ന ദൈവാലയസേവനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: പ്രത്യേകമായി പരിഭാഷയിൽ പ്രകടമാക്കിയിട്ടില്ല
  rationale: ലൂക്കോസിന്റെ സാധാരണ ആഖ്യാനസൂത്രമായ καὶ ἐγένετοയെ ഇവിടെ വേറിട്ടു പരിഭാഷപ്പെടുത്തുന്നത് മലയാളത്തിൽ കൃത്രിമമായ ആവർത്തനമാകും; കാലവാക്യവും മുഖ്യവാക്യവും ചേർന്ന സ്വാഭാവിക ഘടന അതിന്റെ ആഖ്യാനപ്രവർത്തനം വഹിക്കുന്നു.
- source_word: ὡς
  choice: -പ്പോൾ
  rationale: ഇവിടെ ὡς കാലബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-പ്പോൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἐπλήσθησαν
  choice: പൂർത്തിയായപ്പോൾ
  rationale: നിശ്ചയിക്കപ്പെട്ട ദിവസങ്ങൾ തികഞ്ഞുവെന്ന അർഥം നൽകുന്നു; സന്ദർഭത്തിൽ ‘നിവൃത്തിയായി’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: λειτουργίας
  choice: ശുശ്രൂഷാ-
  rationale: സെഖര്യാവിന്റെ ദൈവാലയത്തിലെ നിയുക്ത പുരോഹിതസേവനമാണ് ഉദ്ദേശ്യം. ‘ശുശ്രൂഷ’ ആരാധനാസംബന്ധമായ ഭാവം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് പ്രത്യേക സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: ἀπῆλθεν
  choice: മടങ്ങിപ്പോയി
  rationale: അവൻ തന്റെ താമസസ്ഥലത്തേക്കു പോയെന്ന സന്ദർഭഗതി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ സാധാരണ ഗതിക്രിയയെ അനാവശ്യമായി ഔപചാരികമാക്കുന്നില്ല.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: തന്റെ വീട്ടിലേക്ക്
  rationale: οἶκος ഭൗതിക വീടിനെയോ വിശാലമായി സ്വന്തം ഭവനം/കുടുംബവാസസ്ഥലത്തെയോ സൂചിപ്പിക്കാം. ‘വീട്’ മലയാളത്തിൽ ഈ സ്വാഭാവിക അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യഘടന അക്ഷരാർഥത്തിൽ പകർത്താതെ അതിന്റെ കാലബന്ധവും അർഥവും സൂക്ഷിച്ചിരിക്കുന്നു; പുരോഹിതസേവനത്തിന്റെ സാംസ്കാരിക സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
