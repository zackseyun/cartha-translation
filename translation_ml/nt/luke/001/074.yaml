  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀφόβως ἐκ χειρὸς ⸀ἐχθρῶν ῥυσθέντας λατρεύειν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/074.yaml
  text: that[a], having been rescued from the hand of our enemies[c][b], we might serve him without fear
translation:
  language: ml
  text: ശത്രുക്കളുടെ കയ്യിൽനിന്ന് വിടുവിക്കപ്പെട്ട നാം ഭയമില്ലാതെ[a] അവനെ സേവിക്കേണ്ടതിന്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിർഭയമായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: ഭയംകൂടാതെ
  rationale: ‘ഭയമില്ലാതെ’ അഥവാ ‘നിർഭയമായി’ എന്ന അർഥമുള്ള ക്രിയാവിശേഷണം. ഉദ്ദേശ്യവാക്യത്തിൽ സ്വാഭാവികമായി ചേരുകയും ഗ്രീക്കിലെ അർഥം നേരിട്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐκ χειρὸς
  choice: കൈയിൽനിന്ന്
  rationale: ഒരാളുടെ അധികാരത്തിൽനിന്നോ നിയന്ത്രണത്തിൽനിന്നോ ഉള്ള വിടുതലിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം. മൂലഭാഷയിലെ ദൃശ്യരൂപം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ മനസ്സിലാകുന്നു.
- source_word: ἐχθρῶν
  choice: ശത്രുക്കളുടെ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം വ്യക്തമല്ല. അതിനാൽ സന്ദർഭത്തിൽ സൂചിതമായ ‘നമ്മുടെ’ എന്ന ആശയം ‘നാം’ എന്ന കർത്താവിലൂടെ വ്യക്തമാകാൻ അനുവദിച്ച്, നാമപദത്തെ അനാവശ്യമായി വികസിപ്പിച്ചിട്ടില്ല.
- source_word: ῥυσθέντας
  choice: വിടുവിക്കപ്പെട്ട
  rationale: ἀόριστος കർമണി പങ്കാളിക്രിയയായതിനാൽ, സേവിക്കുന്നതിന് അടിസ്ഥാനമായ മുൻകാല വിടുതലിനെ സൂചിപ്പിക്കുന്നു. ‘വിടുവിക്കപ്പെട്ട’ എന്നത് രക്ഷയും അധികാരത്തിൽനിന്നുള്ള മോചനവും ഉൾക്കൊള്ളുന്നു.
- source_word: λατρεύειν
  choice: സേവിക്കേണ്ടതിന്
  rationale: ദൈവത്തോടുള്ള ആരാധനാപരമായ സേവനത്തെയും അനുസരണത്തെയും സൂചിപ്പിക്കാൻ കഴിയുന്ന പദം. ‘സേവിക്കുക’ എന്നത് ആരാധനയിൽ മാത്രം അർഥം ചുരുക്കാതെ വിശാലത നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവനെ
  rationale: മുൻസന്ദർഭത്തിലെ ദൈവത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്. ‘സേവിക്കുക’ എന്ന മലയാള ക്രിയയോടൊപ്പം ‘അവനെ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ദൈവത്തോടുള്ള λατρεύειν എന്നതിന്റെ വ്യാപ്തി
  choice: അവനെ സേവിക്കുക
  alternative: അവനെ ആരാധിക്കുക
  rationale: ഈ പദത്തിന് ദൈവത്തോടുള്ള ആരാധനാപരമായ സേവനം എന്ന പ്രത്യേക അർഥമുണ്ടാകാം. എന്നാൽ ‘സേവിക്കുക’ ഭക്തിയും അനുസരണവും ഉൾക്കൊള്ളുന്ന വിശാലത നിലനിർത്തുന്നു; ആരാധനാക്രമത്തിൽ മാത്രം അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഇത് മുൻവാക്യത്തിൽ ആരംഭിച്ച ഉദ്ദേശ്യഘടനയുടെ തുടർച്ചയായതിനാൽ അവസാനം കോമ നിലനിർത്തിയിരിക്കുന്നു. മൂലത്തിലെ വാക്കുക്രമം അനുകരിച്ച് അസ്വാഭാവികമാകാതിരിക്കാനായി ‘ഭയംകൂടാതെ’ സേവനത്തോട് ചേർത്തിരിക്കുന്നു.
