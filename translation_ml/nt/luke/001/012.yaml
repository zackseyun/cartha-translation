source:
  edition: SBLGNT
  text: καὶ ἐταράχθη Ζαχαρίας ἰδών, καὶ φόβος ἐπέπεσεν ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/012.yaml
  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: ml
  text: സഖറിയാവ് അവനെ കണ്ടപ്പോൾ അസ്വസ്ഥനായി; ഭയം അവന്റെമേൽ വീണു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθη
  choice: അസ്വസ്ഥനായി
  rationale: ταράσσω എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ ആന്തരിക കലക്കവും മനസ്സിന്റെ അസ്വസ്ഥതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; തുടർന്ന് വരുന്ന φόβος സൂചിപ്പിക്കുന്ന ഭയത്തെ മുൻകൂട്ടി അതിശക്തമാക്കുന്നില്ല.
- source_word: Ζαχαρίας
  choice: സഖറിയാവ്
  rationale: ആധുനിക മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: ἰδών
  choice: അവനെ കണ്ടപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തിന്റെ സന്ദർഭോചിതമായ കാലസൂചന വ്യക്തമാക്കുന്നു. മുൻവാക്യത്തിലെ ദൂതനെയാണ് ‘അവനെ’ സൂചിപ്പിക്കുന്നത്.
- source_word: φόβος
  choice: ഭയം
  rationale: φόβος എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമായ തുല്യപദം; ‘ഭീതി’ പോലുള്ള ശക്തമായ പദങ്ങൾ ഒഴിവാക്കി.
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: അവന്റെമേൽ വീണു
  rationale: ἐπιπίπτω ἐπί എന്ന ഗ്രീക്ക് പ്രയോഗത്തിലെ ‘മേൽ വീഴുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും മലയാളത്തിൽ ഗ്രാഹ്യമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്കിലെ രണ്ടു സമാന്തര വാക്യഖണ്ഡങ്ങളും വികാരത്തിന്റെ ക്രമവും നിലനിർത്തി; അർദ്ധവിരാമം അവയുടെ അടുത്ത ബന്ധം വ്യക്തമാക്കുന്നു.
