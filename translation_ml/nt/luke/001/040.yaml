source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸν οἶκον Ζαχαρίου καὶ ἠσπάσατο τὴν Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/040.yaml
  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: ml
  text: അവൾ സെഖര്യാവിന്റെ വീട്ടിൽ പ്രവേശിച്ചു[a]; എലിസബത്തിനെ അഭിവാദ്യം ചെയ്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സെഖര്യാവിന്റെ വീട്ടിലേക്കു ചെന്നു.’
    reason: lexical_alternative
  - marker: b
    text: ‘അഭിവാദ്യം ചെയ്തു’ എന്നത് ‘വന്ദനം പറഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: പ്രവേശിച്ചു
  rationale: εἰσέρχομαι എന്ന ക്രിയയുടെ ഭൂതകാലസംഭവരൂപം ഒരു സ്ഥലത്തിനകത്തേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രവേശിച്ചു’ സംക്ഷിപ്തവും സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
- source_word: οἶκον
  choice: വീട്
  rationale: εἰς എന്നതോടൊപ്പം ഇവിടെ ഭൗതികമായ വാസസ്ഥലമാണ് ഉദ്ദേശിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘വീട്’ സ്വാഭാവികമാണ്.
- source_word: Ζαχαρίου
  choice: സെഖര്യാവ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും മൂലരൂപത്തോട് യോജിച്ചതുമായ രൂപം.
- source_word: ἠσπάσατο
  choice: അഭിവാദ്യം ചെയ്തു
  rationale: ἀσπάζομαι ഇവിടെ കണ്ടുമുട്ടുമ്പോഴുള്ള അഭിവാദനത്തെ സൂചിപ്പിക്കുന്നു; ‘അഭിവാദ്യം ചെയ്തു’ സ്നേഹോഷ്മളതയോ ഔപചാരികതയോ അധികമായി ചേർക്കാതെ അർത്ഥം നൽകുന്നു.
- source_word: Ἐλισάβετ
  choice: എലിസബത്ത്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: καὶ
  choice: -ച്ച്
  rationale: ആദ്യ καί ബന്ധിപ്പിക്കുന്ന തുടർച്ചയായ രണ്ടു പ്രവൃത്തികളെ മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാവിന്യാസമായ ‘പ്രവേശിച്ച് ... ചെയ്തു’ എന്നു അവതരിപ്പിക്കുന്നു; രണ്ടാമത്തെ καίയുടെ ഏകോപനബന്ധം ഇതിൽ നിലനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമായി ആവർത്തിക്കാത്തെങ്കിലും മുൻസന്ദർഭത്തിലെ മറിയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘അവൾ’ ചേർത്തിരിക്കുന്നു. ക്രിയകളുടെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘പ്രവേശിച്ച്’ എന്ന ബന്ധക്രിയ ഉപയോഗിച്ചു.
