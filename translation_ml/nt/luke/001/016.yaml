  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളിൽ പലരെയും അവൻ അവരുടെ ദൈവമായ കർത്താവിലേക്കു തിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാരിൽ”; “ഇസ്രായേല്യരിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ പരമ്പരാഗത ഉടമ്പടിപദപ്രയോഗം “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (മുൻസന്ദർഭത്തോടുള്ള ബന്ധം വാക്യപ്രവാഹത്തിൽ നിലനിർത്തി; സ്വതന്ത്ര വാക്യത്തിൽ പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയില്ല)
  rationale: ഗ്രീക്കിൽ ഇത് മുൻവാക്യത്തിന്റെ തുടർച്ചയായ സംയോജകമാണ്. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘കൂടാതെ’ കൃത്രിമമായി തോന്നുന്നതിനാൽ സ്വാഭാവികമായ വാക്യപ്രവാഹം തിരഞ്ഞെടുത്തു.
- source_word: πολλοὺς
  choice: പലരെയും
  rationale: തുടർന്നുള്ള ജനവിഭാഗത്തിൽപ്പെട്ട അനേകം വ്യക്തികളെ സൂചിപ്പിക്കുന്ന substantival പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: ഇസ്രായേൽമക്കളിൽ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥത്തെക്കാൾ മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത പ്രയോഗവുമായ ‘ഇസ്രായേൽമക്കൾ’ തിരഞ്ഞെടുത്തു; ലിംഗപരമായ ചുരുക്കിവായന നിർബന്ധിക്കാതെ സമൂഹസൂചന നിലനിർത്തുന്നു.
- source_word: ἐπιστρέψει
  choice: തിരിക്കും
  rationale: 'ഭാവികാല സകർമക ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു: യോഹന്നാൻ അവരെ ദൈവത്തിലേക്കു മടക്കിത്തിരിക്കും എന്ന ആശയം; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘മാനസാന്തരപ്പെടുത്തും’ ഒഴിവാക്കി.'
- source_word: ἐπὶ
  choice: -ലേക്കു
  rationale: ἐπιστρέφω എന്ന ക്രിയയോടൊപ്പം ലക്ഷ്യത്തിലേക്കുള്ള ദിശയെയോ പുനർമുഖീകരണത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: κύριον τὸν θεὸν αὐτῶν
  choice: അവരുടെ ദൈവമായ കർത്താവ്
  rationale: ‘കർത്താവ്’ എന്നും ‘അവരുടെ ദൈവം’ എന്നും ഒരേ വ്യക്തിയെ തിരിച്ചറിയിക്കുന്ന appositional ബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ഉടമ്പടിസംബന്ധമായ ഭാരം നിലനിർത്തുന്നു.
theological_decisions:
- issue: τῶν υἱῶν Ἰσραὴλ എന്ന ഉടമ്പടിപദപ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ; ഇസ്രായേല്യർ
  rationale: ‘ഇസ്രായേൽമക്കൾ’ മലയാളത്തിൽ പരമ്പരാഗത തിരുവെഴുത്തുസ്വരവും സമൂഹപരമായ അർഥവും ഒരുമിച്ചു നിലനിർത്തുന്നു. അക്ഷരാർഥമായ ‘പുത്രന്മാർ’ ഗ്രീക്കിലെ രൂപം കൂടുതൽ നേരിട്ട് കാണിച്ചാലും ആധുനിക മലയാളത്തിൽ പുരുഷന്മാരിലേക്കു മാത്രം അർഥം ചുരുങ്ങാൻ ഇടയുണ്ട്.
- issue: κύριον τὸν θεὸν αὐτῶν എന്നതിന്റെ സൂചിതൻ
  choice: അവരുടെ ദൈവമായ കർത്താവ്
  alternative: അവരുടെ യജമാനനായ ദൈവം
  rationale: ഇവിടെ κύριος ഒരു മനുഷ്യയജമാനനെ അല്ല, ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘കർത്താവ്’ ഉടമ്പടിപരവും ദൈവശാസ്ത്രപരവുമായ അർഥം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി. സകർമകമായ ‘തിരിക്കും’ മൂലഭാഷയിലെ പ്രവർത്തകബലം നിലനിർത്തുന്നു; ‘മാനസാന്തരപ്പെടുത്തും’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കി. അടിക്കുറിപ്പുസൂചിക [a] മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
