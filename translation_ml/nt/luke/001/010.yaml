reference: Luke 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶν τὸ πλῆθος ἦν τοῦ λαοῦ προσευχόμενον ἔξω τῇ ὥρᾳ τοῦ θυμιάματος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: ml
  text: ധൂപാർപ്പണസമയത്ത് ജനസമൂഹം മുഴുവനും പുറത്തു പ്രാർഥിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ധൂപം കത്തിക്കുന്ന സമയത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: ജനക്കൂട്ടം മുഴുവനും
  rationale: ഏകവചനമായ συλλογിക നാമത്തോടുകൂടിയ πᾶν, കൂടിവന്നിരുന്ന സമൂഹത്തിന്റെ സമഗ്രത ഊന്നിപ്പറയുന്നു. മലയാളത്തിൽ ‘ജനക്കൂട്ടം മുഴുവനും’ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു.
- source_word: τοῦ λαοῦ
  choice: ജനക്കൂട്ടം
  rationale: πλῆθος τοῦ λαοῦ എന്ന മുഴുവൻ പ്രയോഗം ഇവിടെ കൂടിവന്ന ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ അവർ ഇസ്രായേൽജനമാണെന്നു മനസ്സിലാകുമെങ്കിലും, മൂലപാഠം ഈ വാക്യത്തിൽ ‘ഇസ്രായേൽ’ എന്നു വ്യക്തമാക്കാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: προσευχόμενον
  choice: പ്രാർഥിച്ചുകൊണ്ടിരുന്നു
  rationale: ἦν എന്ന ക്രിയയോടു ചേർന്ന വർത്തമാനകാല കൃ Base participle തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘പ്രാർഥിച്ചുകൊണ്ടിരുന്നു’ അതിനെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔξω
  choice: പുറത്ത്
  rationale: ἔξω എന്നതിന്റെ ലളിതമായ അർഥം ‘പുറത്ത്’ എന്നാണ്. ‘വിശുദ്ധമന്ദിരത്തിനു പുറത്ത്’ എന്നു വ്യക്തമാക്കുന്നത് മൂലപാഠത്തേക്കാൾ അധിക നിർവചനം വരുത്തും.
- source_word: τῇ ὥρᾳ
  choice: സമയത്ത്
  rationale: ὥρα ഇവിടെ നിശ്ചിത ആരാധനാസമയത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സമയത്ത്’ എന്നത് ‘മണിക്കൂറിൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: τοῦ θυμιάματος
  choice: ധൂപാർപ്പണത്തിന്റെ
  rationale: θυμίαμα ധൂപത്തെയും, ഈ ദേവാലയസന്ദർഭത്തിൽ ധൂപം അർപ്പിക്കുന്ന അനുഷ്ഠാനത്തെയും സൂചിപ്പിക്കുന്നു. ‘ധൂപാർപ്പണം’ ആരാധനാപരമായ പ്രവൃത്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: θυμίαμα എന്ന പദത്തിലെ ദേവാലയാരാധനാ സാങ്കേതികത
  choice: ധൂപാർപ്പണം
  alternative: ധൂപം കത്തിക്കൽ
  rationale: ഇത് പുരോഹിതൻ ദേവാലയത്തിൽ നിർവഹിച്ച ആരാധനാക്രിയയുടെ സമയമാണ്. ‘ധൂപാർപ്പണം’ ആ ആരാധനാസന്ദർഭം നിലനിർത്തുന്നു; അതേസമയം പാഠത്തിൽ ഇല്ലാത്ത പിൽക്കാല സിദ്ധാന്തപരമായ ആശയങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ദേവാലയാരാധനയുടെ സന്ദർഭം വ്യക്തമാകാൻ ‘ധൂപാർപ്പണം’ ഉപയോഗിച്ചു; ‘ഇസ്രായേൽ’ എന്നും ‘വിശുദ്ധമന്ദിരത്തിനു പുറത്ത്’ എന്നും മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണങ്ങൾ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
