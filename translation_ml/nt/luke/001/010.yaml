    rationale: While understandable in context, ‘ജനസമൂഹം മുഴുവനും’ better represents the whole assembled body of the people, without specifying an identity not stated in the verse.
  revised_text: ധൂപാർപ്പണസമയത്ത് ജനസമൂഹം മുഴുവനും പുറത്തു പ്രാർഥിച്ചുകൊണ്ടിരുന്നു.[a]
