  naturalness: The sentence is fluent modern standard Malayalam. ‘ധൂപാർപ്പണസമയത്ത്’ is a natural compact form, and ‘പ്രാർഥിച്ചുകൊണ്ടിരുന്നു’ appropriately reflects the ongoing periphrastic construction.
