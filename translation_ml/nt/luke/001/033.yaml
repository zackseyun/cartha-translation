id: LUK.1.33
reference: Luke 1:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: ml
  text: അവൻ യാക്കോബിന്റെ ഭവനത്തിന്മേൽ എന്നേക്കും[a] രാജാവായി വാഴും; അവന്റെ രാജ്യത്തിന് അവസാനം ഉണ്ടാകുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യുഗങ്ങളോളം.’ εἰς τοὺς αἰῶνας എന്ന ഗ്രീക്ക് പ്രയോഗം അവസാനമില്ലാത്ത ദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: രാജാവായി വാഴും
  rationale: ഭാവികാലത്തിലുള്ള βασιλεύω രാജകീയ ഭരണം നടത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘രാജാവായി വാഴും’ എന്നത് ആ രാജകീയ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: യാക്കോബിന്റെ ഭവനത്തിന്മേൽ
  rationale: ἐπίയും ദ്വിതീയാവിഭക്തിയും ഇവിടെ അധികാരത്തിന്റെ പരിധിയായ ‘മേൽ’ എന്ന അർഥം നൽകുന്നു. ‘യാക്കോബിന്റെ ഭവനം’ ഉടമ്പടിപരവും സമൂഹപരവുമായ ബൈബിൾ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: εἰς τοὺς αἰῶνας
  choice: എന്നേക്കും
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം അവസാനമില്ലാത്ത ദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്നു. ‘എന്നേക്കും’ അതിന്റെ ആശയം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു; കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: βασιλείας
  choice: രാജ്യം
  rationale: βασιλείαയ്ക്ക് രാജഭരണമെന്നോ രാജ്യമെന്നോ അർഥമാകാം. ‘അവസാനം ഉണ്ടാകുകയില്ല’ എന്ന തുടർവാക്യത്തോടൊപ്പം ‘രാജ്യം’ മലയാളത്തിൽ സ്വാഭാവികമാണ്; രാജകീയ അധികാരത്തിന്റെയും നിലനിൽപ്പിന്റെയും ആശയങ്ങൾ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἔσται τέλος
  choice: അവസാനം ഉണ്ടാകുകയില്ല
  rationale: അസ്തിത്വം നിഷേധിക്കുന്ന ഈ ഭാവികാല പ്രയോഗം ‘അവസാനം ഉണ്ടാകുകയില്ല’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം; ശക്തമായ നിഷേധവും ഭാവികാലവും ഇതിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ‘യാക്കോബിന്റെ ഭവനം’ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘യാക്കോബിന്റെ ഭവനം’ എന്ന മൂലരൂപം നിലനിർത്തി.
  alternative: ‘ഇസ്രായേൽജനം’ അല്ലെങ്കിൽ ‘ദൈവജനം’
  rationale: ഇത് പരമ്പരാഗതമായ ഉടമ്പടിപരമായ ഒരു സമൂഹനാമമാണ്. ഇതിനെ പ്രധാനവാക്യത്തിൽ വിശാലമായി വ്യാഖ്യാനിക്കുന്നത് പിൽക്കാല ദൈവശാസ്ത്രനിഗമനങ്ങൾ പാഠത്തിൽ ചേർക്കാനിടയാക്കും.
- issue: വാഴ്ചയുടെ ദൈർഘ്യം
  choice: εἰς τοὺς αἰῶνας എന്നത് ‘എന്നേക്കും’ എന്നും രാജ്യത്തിന് ‘അവസാനം ഉണ്ടാകുകയില്ല’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: ‘യുഗങ്ങളോളം’ അല്ലെങ്കിൽ ‘യുഗങ്ങളിലേക്കു’
  rationale: വാക്യം മശീഹയുടെ അവസാനമില്ലാത്ത വാഴ്ചയും രാജ്യവും പ്രസ്താവിക്കുന്നു. ‘എന്നേക്കും’ എന്നത് ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ഗ്രീക്ക് ഇടിയത്തിന്റെ കൂടുതൽ പദാനുപദരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: βασιλεία എന്ന പദത്തിലെ ‘ഭരണം/രാജ്യം’ അർഥസാധ്യത
  choice: ‘രാജ്യം’ തിരഞ്ഞെടുത്തു.
  alternative: ‘രാജവാഴ്ച’ അല്ലെങ്കിൽ ‘രാജാധികാരം’
  rationale: ഗ്രീക്ക് പദത്തിന് ഭരണപ്രവർത്തനത്തെയും രാജ്യത്തെയും സൂചിപ്പിക്കാം. ഇവിടെ ‘രാജ്യം’ സ്വാഭാവികമാണെങ്കിലും പ്രധാനവാക്യത്തിലെ ‘രാജാവായി വാഴും’ എന്ന പ്രയോഗം ഭരണത്തിന്റെ ചലനാത്മക അർഥവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യാക്കോബിന്റെ ഭവനം’ എന്ന ബൈബിൾ-ഉടമ്പടി പ്രയോഗം സംരക്ഷിച്ചു; ‘രാജാവായി വാഴും’ എന്ന രൂപം βασιλεύσει എന്ന പദത്തിന്റെ രാജകീയ ഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
