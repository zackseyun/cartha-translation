id: LUK.1.5
reference: Luke 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: ml
  text: യെഹൂദ്യയുടെ രാജാവായ ഹെരോദാവിന്റെ കാലത്ത്, അബീയാവിന്റെ പുരോഹിതവിഭാഗത്തിൽപ്പെട്ട[b] സെഖര്യാവ് എന്നു പേരുള്ള ഒരു പുരോഹിതൻ ഉണ്ടായിരുന്നു; അഹരോന്റെ പുത്രിമാരിൽപ്പെട്ട[a] ഒരു ഭാര്യ അദ്ദേഹത്തിനുണ്ടായിരുന്നു, അവളുടെ പേര് എലിസബത്ത് എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അഹരോന്റെ പുത്രിമാരിൽപ്പെട്ടവൾ”; ഇത് അഹരോന്റെ വംശത്തിൽപ്പെട്ടവൾ എന്നർഥമുള്ള പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “അബീയാവിന്റെ പുരോഹിതവിഭാഗം” ദേവാലയശുശ്രൂഷയ്ക്കായി ക്രമീകരിച്ചിരുന്ന പുരോഹിത സേവനസംഘങ്ങളിൽ ഒന്നായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο
  choice: ഉണ്ടായിരുന്നു
  rationale: ഇവിടെ γίνομαι കഥയിലെ വ്യക്തിയെ പരിചയപ്പെടുത്തുന്ന അസ്തിത്വസൂചക പ്രയോഗമാണ്; മലയാളത്തിൽ ‘ഉണ്ടായിരുന്നു’ സ്വാഭാവികവും അർഥസമീപവുമാണ്.
- source_word: ἐν ταῖς ἡμέραις Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: യെഹൂദ്യരാജാവായ ഹെരോദാവിന്റെ കാലത്ത്
  rationale: കാലസൂചനയും ഹെരോദാവിന്റെ പദവിയും ഭരണപ്രദേശവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: സെഖര്യാവ് എന്നു പേരുള്ള ഒരു പുരോഹിതൻ
  rationale: τις-ന്റെ അനിശ്ചിത പരിചയപ്പെടുത്തൽ ‘ഒരു’ എന്നതിലൂടെയും ὀνόματι എന്ന നാമകരണപ്രയോഗം ‘എന്നു പേരുള്ള’ എന്നതിലൂടെയും പ്രകടമാക്കുന്നു.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: അബീയാവിന്റെ പുരോഹിതവിഭാഗത്തിൽപ്പെട്ട
  rationale: ἐφημερία ദേവാലയശുശ്രൂഷയ്ക്കായുള്ള പുരോഹിത സേവനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘പുരോഹിതവിഭാഗം’ പ്രധാനവാചകത്തിൽ തന്നെ സ്ഥാപനപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: γυνὴ αὐτῷ
  choice: അദ്ദേഹത്തിന്റെ ഭാര്യ
  rationale: αὐτῷ എന്ന ദാതിവ് ഉടമസ്ഥബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അദ്ദേഹത്തിന്റെ ഭാര്യ’ സ്വാഭാവികമായി അതേ ബന്ധം നൽകുന്നു.
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: അഹരോന്റെ പുത്രിമാരുടെ വംശത്തിൽപ്പെട്ടവൾ
  rationale: ഗ്രീക്കിലെ ദൃശ്യമായ ‘അഹരോന്റെ പുത്രിമാർ’ എന്ന പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ വംശപരമായ അർഥം മലയാളവായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: അവളുടെ പേര് എലിസബത്ത് എന്നായിരുന്നു
  rationale: മലയാളത്തിലെ സ്വാഭാവിക നാമകരണരീതി ഉപയോഗിച്ച് ഗ്രീക്ക് ഘടനയുടെ അർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: എലിസബത്തിന്റെ അഹരോന്യ വംശപരമ്പരയെ എങ്ങനെ അവതരിപ്പിക്കണം
  choice: അഹരോന്റെ പുത്രിമാരുടെ വംശത്തിൽപ്പെട്ടവൾ
  alternative: അഹരോന്റെ സന്തതിയിൽപ്പെട്ടവൾ
  rationale: ‘പുത്രിമാർ’ എന്ന ഗ്രീക്കിലെ കുടുംബരൂപകം നിലനിർത്തുകയും അത് വംശപരമ്പരയെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു; ഇതിലുപരി ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ നിഗമനവും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചരിത്രപരമായ പേരുകൾ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾരൂപങ്ങളോട് അടുത്തുവെച്ചിരിക്കുന്നു. ഗ്രീക്കിലെ ഏകവാക്യഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും ആശയബന്ധം നിലനിർത്തിയിരിക്കുന്നു.
