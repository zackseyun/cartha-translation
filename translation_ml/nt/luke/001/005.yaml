    issue: Footnote anchors are mismatched.
    rationale: Footnote a explains ‘daughters of Aaron’ but is currently attached to ‘wife’; footnote b explains ‘priestly division of Abijah’ but is currently attached to Elizabeth’s name. Anchors must immediately follow their respective referents.
  - severity: low
    issue: The lineage phrase is more interpretive and less direct than necessary.
    rationale: ‘അഹരോന്റെ പുത്രിമാരുടെ വംശത്തിൽപ്പെട്ടവൾ’ communicates the intended lineage but awkwardly recasts the Greek familial idiom. ‘അഹരോന്റെ പുത്രിമാരിൽപ്പെട്ട’ retains the expression, while the footnote supplies its idiomatic genealogical sense.
