language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: ml
  text: അവൻ എഴുതാനുള്ള ഒരു പലക ചോദിച്ച്, “യോഹന്നാൻ എന്നാണ് അവന്റെ പേര്” എന്ന് എഴുതി. എല്ലാവരും ആശ്ചര്യപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτήσας
  choice: ആവശ്യപ്പെട്ട്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃദന്തത്തിന്റെ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πινακίδιον
  choice: എഴുത്തുപലക
  rationale: എഴുതാൻ ഉപയോഗിച്ചിരുന്ന ചെറിയ പലകയെ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἔγραψεν λέγων
  choice: എന്ന് എഴുതി
  rationale: ഗ്രീക്കിലെ ‘എഴുതി, പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടനയെ എഴുത്തിലെ ഉദ്ധരണി അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരീതിയിൽ നൽകുന്നു.
- source_word: Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ പേരുരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἐστὶν ὄνομα αὐτοῦ
  choice: ആണ് അവന്റെ പേര്
  rationale: പേരിനെ ആദ്യം നിർത്തുന്ന ഗ്രീക്ക് പദക്രമവും ‘യോഹന്നാൻ’ എന്ന ദൈവദത്ത പേരിന്മേലുള്ള ഊന്നലും സംരക്ഷിക്കുന്നു; ഭാവികാല അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐθαύμασαν πάντες
  choice: എല്ലാവരും ആശ്ചര്യപ്പെട്ടു
  rationale: θαυμάζω സൂചിപ്പിക്കുന്ന വിസ്മയം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും πάντες എന്ന കൂട്ടായ ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പേരിന്റെ പ്രസ്താവനയിലെ കാലവും ഊന്നലും
  choice: “യോഹന്നാൻ ആണ് അവന്റെ പേര്”
  alternative: “അവന്റെ പേര് യോഹന്നാൻ എന്നാണ്” / “അവന്റെ പേര് യോഹന്നാൻ ആയിരിക്കും”
  rationale: ഗ്രീക്കിൽ വർത്തമാനകാലമാണ്; പേര് വാക്യത്തിന്റെ തുടക്കത്തിൽ വരുന്നതിനാൽ അതിനുള്ള ഊന്നൽ നിലനിർത്തി. ഭാവികാല രൂപം മൂലപാഠത്തിൽ നേരിട്ട് ഇല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ ആഖ്യാനഭാഷ. ഗ്രീക്ക് വാക്യത്തിലെ പേരിന്മേലുള്ള ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവികത സംരക്ഷിച്ചു.
