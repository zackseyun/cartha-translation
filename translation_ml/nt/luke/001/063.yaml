- from: അവൻ ഒരു എഴുത്തുപലക ആവശ്യപ്പെട്ട്, “യോഹന്നാൻ ആണ് അവന്റെ പേര്”[a] എന്ന് എഴുതി. എല്ലാവരും ആശ്ചര്യപ്പെട്ടു.
  to: അവൻ എഴുതാനുള്ള ഒരു പലക ചോദിച്ച്, “യോഹന്നാൻ എന്നാണ് അവന്റെ പേര്” എന്ന് എഴുതി. എല്ലാവരും ആശ്ചര്യപ്പെട്ടു.
