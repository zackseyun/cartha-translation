id: LUK.1.14
reference: Luke 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: ml
  text: നിനക്കു സന്തോഷവും ആഹ്ലാദവും ഉണ്ടാകും; അവന്റെ ജനനത്തിൽ[a] അനേകർ സന്തോഷിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ ജനനം നിമിത്തം.’ സന്തോഷത്തിന്റെ സന്ദർഭത്തെയോ അതിന്റെ കാരണത്തെയോ ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: ഉണ്ടാകും
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന അവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: χαρά
  choice: സന്തോഷം
  rationale: χαράയുടെ സാധാരണ അർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: σοι
  choice: നിനക്കു
  rationale: സന്തോഷം അനുഭവിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ദത്തിവ് അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀγαλλίασις
  choice: ആഹ്ലാദം
  rationale: χαράയിൽനിന്നുള്ള പദവ്യത്യാസവും കൂടുതൽ ശക്തമായ ആഘോഷഭാവവും നിലനിർത്തുന്നു.
- source_word: πολλοὶ
  choice: അനേകർ
  rationale: വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് ചുരുക്കവും മാന്യവുമായ മലയാളം.
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: അവന്റെ ജനനത്തിൽ
  rationale: ἐπί + ദത്തിവ് സൂചിപ്പിക്കുന്ന സന്ദർഭമോ അടിസ്ഥാനമോ പൂർണമായി തീർപ്പാക്കാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: χαρήσονται
  choice: സന്തോഷിക്കും
  rationale: χαίρωയുടെ ഭാവികാല അർഥം നൽകുകയും χαράയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘സന്തോഷം’ എന്നും ‘ആഹ്ലാദം’ എന്നും ഉപയോഗിച്ച് χαρά–ἀγαλλίασις വ്യത്യാസം സൂക്ഷിച്ചിരിക്കുന്നു; ഗ്രീക്കിലെ സന്ദർഭ/കാരണം എന്ന ദ്വയാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
