  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: ml
  text: നമ്മുടെ പിതാവായ അബ്രാഹാമിനോടു അവിടുന്ന് ചെയ്ത ശപഥം—നമുക്കു നൽകാൻ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅρκον
  choice: സത്യം
  rationale: മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന കർമപദം; ഇവിടെ ഒരു നിർദിഷ്ടമായ ശപഥവാഗ്ദാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘സത്യം ചെയ്യുക’ എന്ന പ്രയോഗം സ്വാഭാവികമായി ശപഥത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: ὃν ὤμοσεν
  choice: അവിടുന്ന് ചെയ്ത സത്യം
  rationale: ബന്ധസർവനാമവും ഭൂതകാല ക്രിയയും മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യമായി ചേർത്തു. ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
- source_word: πρὸς Ἀβραὰμ
  choice: അബ്രാഹാമിനോട്
  rationale: ശപഥം ചെയ്ത വ്യക്തിയിലേക്കുള്ള πρός-ന്റെ ദിശാസൂചന മലയാളത്തിൽ ‘-നോട്’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: τὸν πατέρα ἡμῶν
  choice: നമ്മുടെ പിതാവായ
  rationale: ഗ്രീക്കിലെ കുടുംബപരവും ഉടമ്പടിസംബന്ധവുമായ ‘പിതാവ്’ എന്ന ഭാഷ നിലനിർത്തുന്നു; ‘പൂർവപിതാവ്’ അല്ലെങ്കിൽ ‘പൂർവികൻ’ എന്ന വ്യാഖ്യാനപരമായ പകരം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചില്ല.
- source_word: τοῦ δοῦναι ἡμῖν
  choice: നമുക്ക് നൽകുമെന്ന
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് ശപഥത്തിന്റെ ഉള്ളടക്കമോ ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം. അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന ആശയവുമായി ബന്ധിപ്പിക്കാൻ ‘നൽകുമെന്ന’ എന്ന രൂപം സ്വാഭാവികമാണ്; യഥാർഥ വാക്യഘടനയിലെ തുടർച്ച ഡാഷിലൂടെ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: അബ്രാഹാമിനെക്കുറിച്ചുള്ള ഉടമ്പടിഭാഷ
  choice: നമ്മുടെ പിതാവായ അബ്രാഹാം
  alternative: നമ്മുടെ പൂർവികനായ അബ്രാഹാം
  rationale: ‘പിതാവ്’ എന്നത് മൂലപാഠത്തിന്റെ നേരിട്ടുള്ളതും ഉടമ്പടിപരവുമായ ഭാഷ സംരക്ഷിക്കുന്നു; ‘പൂർവികൻ’ സാധ്യമായ അർഥം വ്യക്തമാക്കുന്നുവെങ്കിലും ആ ബൈബിൾപ്രയോഗത്തിന്റെ അനുരണനം കുറയ്ക്കുന്നു.
- issue: τοῦ δοῦναι എന്നതിന്റെ ബന്ധം
  choice: ശപഥത്തിന്റെ ഉള്ളടക്കമായി ‘നമുക്ക് നൽകുമെന്ന’
  alternative: ഉദ്ദേശ്യമായി ‘നമുക്ക് നൽകേണ്ടതിന്’
  rationale: ഗ്രീക്ക് ഘടനയ്ക്ക് ഉള്ളടക്കം, ഉദ്ദേശ്യം, അല്ലെങ്കിൽ ഫലം എന്ന സൂക്ഷ്മതകൾ അനുവദിക്കാം. മലയാളത്തിലെ തെരഞ്ഞെടുത്ത രൂപം അടുത്ത വാക്യത്തിലേക്കുള്ള സ്വാഭാവിക തുടർച്ച നൽകുന്നു; ഉദ്ദേശ്യവായന പൂർണ്ണമായി നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: സഖര്യാവിന്റെ സ്തുതിഗീതത്തിന് യോജിച്ച ഗൗരവമുള്ള ആധുനിക നിലവാരമലയാളം. ഈ വാക്യഭാഗം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാനത്തിൽ ഡാഷ് ഉപയോഗിച്ചു; അനാവശ്യമായി പൂർണ്ണവാക്യമാക്കി മാറ്റിയില്ല.
