  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθὼς παρέδοσαν ἡμῖν οἱ ἀπ’ ἀρχῆς αὐτόπται καὶ ὑπηρέται γενόμενοι τοῦ λόγου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/002.yaml
  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: ml
  text: ആരംഭം മുതൽ ദൃക്‌സാക്ഷികളായിരുന്നവരും വചനത്തിന്റെ[a] ശുശ്രൂഷകരായിത്തീർന്നവരും അവ ഞങ്ങൾക്കു കൈമാറിത്തന്നതുപോലെ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സന്ദേശത്തിന്റെ.” ഗ്രീക്കിലെ λόγος എന്ന പദത്തിന് “വചനം,” “സന്ദേശം,” “വിവരണം” എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ അത് യേശുവിനെക്കുറിച്ച് പ്രഖ്യാപിക്കപ്പെട്ട സന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത് എന്നു സാധ്യതയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: അതുപോലെ
  rationale: മുൻവാക്യത്തിലെ കാര്യങ്ങളോടുള്ള പൊരുത്തം സൂചിപ്പിക്കുന്ന താരതമ്യബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρέδοσαν
  choice: കൈമാറിത്തന്നു
  rationale: ലഭിച്ച വിവരമോ പാരമ്പര്യമോ വിശ്വസനീയമായി മറ്റുള്ളവർക്കു പകർന്നുനൽകിയതെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങൾക്കു
  rationale: പരോക്ഷ കർമത്തിന്റെ ദാതൃവിഭക്തി നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: ആരംഭംമുതൽ ... അവർ
  rationale: സംഭവങ്ങളുടെ തുടക്കംമുതൽ സന്നിഹിതരായിരുന്ന കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന കാലാർഥം നിലനിർത്തുന്നു.
- source_word: αὐτόπται
  choice: ദൃക്‌സാക്ഷികൾ
  rationale: സംഭവങ്ങൾ നേരിട്ടു കണ്ടവരെന്ന അർഥം കൃത്യമായും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: ὑπηρέται
  choice: ശുശ്രൂഷകർ
  rationale: ഔദ്യോഗിക സഭാപദവി നിർബന്ധമായി സൂചിപ്പിക്കാതെ, വചനത്തിന്റെ സേവനത്തിൽ ഏർപ്പെട്ടവരെ മാന്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: γενόμενοι
  choice: ആയിത്തീർന്നവർ
  rationale: ‘ആയിത്തീർന്നു’ എന്ന മാറ്റത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു; ദൃക്‌സാക്ഷികളായിരുന്നവർ പിന്നീട് വചനത്തിന്റെ ശുശ്രൂഷകരായി പ്രവർത്തിച്ചതെന്ന സ്വാഭാവിക ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοῦ λόγου
  choice: വചനത്തിന്റെ
  rationale: λόγος എന്ന പദത്തിന്റെ വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു; ഇവിടെ യേശുവിനെക്കുറിച്ചുള്ള പ്രസംഗസന്ദേശമാണ് സാധ്യതയുള്ള അർഥമെങ്കിലും അതിനെ മുഖ്യവാചകത്തിൽ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: τοῦ λόγου എന്നതിന്റെ സൂചിതാർഥം
  choice: ‘വചനത്തിന്റെ’ എന്ന് മുഖ്യവാചകത്തിൽ നിലനിർത്തി
  alternative: ‘സന്ദേശത്തിന്റെ’
  rationale: ഇവിടെ λόγος ക്രിസ്തുവിന്റെ വ്യക്തിപരമായ ബിരുദത്തേക്കാൾ യേശുവിനെക്കുറിച്ചുള്ള അപ്പൊസ്തോലിക സന്ദേശത്തെയാണ് സൂചിപ്പിക്കാൻ സാധ്യത. എന്നിരുന്നാലും ‘വചനം’ മൂലപദത്തിന്റെ അർഥവ്യാപ്തിയും ഉദ്ദേശ്യമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു; സാധ്യതയുള്ള മറ്റൊരു പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: γενόμενοι എന്ന കൃതന്തത്തിന്റെ ബന്ധം
  choice: ദൃക്‌സാക്ഷികളായിരുന്നവരും ശുശ്രൂഷകരായിത്തീർന്നവരും
  alternative: ദൃക്‌സാക്ഷികളും ശുശ്രൂഷകരുമായിത്തീർന്നവർ
  rationale: ഗ്രീക്കിൽ കൃതന്തം രണ്ടു നാമങ്ങളോടും വ്യാകരണപരമായി ബന്ധപ്പെടാമെങ്കിലും, സംഭവങ്ങൾ കണ്ടതും തുടർന്ന് സന്ദേശം സേവിച്ചതുമായ കാലക്രമബന്ധം സ്വാഭാവികമാണ്. മലയാളരൂപം ഈ പുരോഗതി വ്യക്തമാക്കുന്നു, എന്നാൽ രണ്ടു വ്യത്യസ്ത കൂട്ടങ്ങളാണെന്ന ധാരണ ഉണ്ടാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ലൂക്കാ 1:1-ലെ മുൻവാക്യവുമായി തുടർച്ച പുലർത്താൻ ‘അവ’ എന്ന കർമസൂചനയും അവസാനത്തിൽ ‘അതുപോലെ’ എന്ന ബന്ധരൂപവും ഉപയോഗിച്ചു.
