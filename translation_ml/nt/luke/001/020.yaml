source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: ml
  text: ഇതാ[a], ഈ കാര്യങ്ങൾ സംഭവിക്കുന്ന ദിവസംവരെ നീ മിണ്ടാതിരിക്കും; സംസാരിക്കാനും നിനക്കു കഴിയില്ല. എന്റെ വാക്കുകൾ നീ വിശ്വസിക്കാതിരുന്നതിനാലാണ് ഇത്; അവ അവയുടെ നിശ്ചിത സമയത്ത് നിറവേറും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീ ഊമനായിരിക്കും.’ ഗ്രീക്കിൽ ‘മിണ്ടാതിരിക്കും’ എന്നതോടൊപ്പം ‘സംസാരിക്കാൻ കഴിയുകയില്ല’ എന്നും ചേർന്നിരിക്കുന്നതിനാൽ നിർബന്ധിതമായ സംസാരശേഷിയില്ലായ്മയ്ക്ക് ഊന്നൽ ലഭിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവയുടെ തക്ക സമയത്ത്.’ ഈ പ്രയോഗം ആ വാക്കുകൾ നിറവേറാനുള്ള യോജിച്ചതോ നിശ്ചയിക്കപ്പെട്ടതോ ആയ സമയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന സംവാദസൂചകത്തിന്റെ പെട്ടെന്നുള്ള ഊന്നലും ദൂതന്റെ പ്രഖ്യാപനത്തിലെ ഗൗരവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι
  choice: നീ മൗനിയായിരിക്കും; സംസാരിക്കാൻ നിനക്കു കഴിയുകയുമില്ല
  rationale: മൗനാവസ്ഥയും സംസാരിക്കാനുള്ള കഴിവില്ലായ്മയും എന്ന ഗ്രീക്കിലെ രണ്ടു ഘടകങ്ങളും നിലനിർത്തി, ഇത് സ്വമേധയായുള്ള നിശ്ശബ്ദതയല്ലെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: ഇവ സംഭവിക്കുന്ന ദിവസംവരെ
  rationale: കാലപരിധിയും γίνομαι എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥവും ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: എന്റെ വാക്കുകൾ നീ വിശ്വസിക്കാതിരുന്നതുകൊണ്ടാണ് ഇത്
  rationale: ശിക്ഷയുടെ കാരണം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും λόγοι എന്നതിനെ ‘വാക്കുകൾ’ എന്നു നേരിട്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οἵτινες πληρωθήσονται
  choice: ആ വാക്കുകൾ ... നിറവേറും
  rationale: ബന്ധവാക്യത്തിന്റെ മുൻപദം വ്യക്തമായി ആവർത്തിച്ച്, വാക്കുകൾ യാഥാർഥ്യമാകുമെന്ന ഭാവികാല അർഥം സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: അവയ്ക്ക് നിശ്ചയിച്ച സമയത്ത്
  rationale: καιρός സൂചിപ്പിക്കുന്ന യോജിച്ചതോ നിയുക്തമായതോ ആയ സമയത്തെ വെറും ക്രമാനുസൃത സമയമായി ചുരുക്കാതെ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: സെഖര്യാവിനുണ്ടാകുന്ന മൗനത്തിന്റെ സ്വഭാവം
  choice: വാഗ്ദാനം നിറവേറുന്നതുവരെ ഏർപ്പെടുത്തപ്പെടുന്ന സംസാരശേഷിയില്ലായ്മയായി അവതരിപ്പിച്ചു.
  alternative: സ്വമേധയാ മിണ്ടാതിരിക്കാനുള്ള കല്പനയായി വായിക്കുക.
  rationale: ‘മൗനിയായിരിക്കും’ എന്നതിനൊപ്പം ‘സംസാരിക്കാൻ കഴിയുകയില്ല’ എന്നും മൂലപാഠം പറയുന്നതിനാൽ, ഇത് സ്വമേധയായുള്ള നിശ്ശബ്ദതയല്ലെന്ന് പാഠം തന്നെ സൂചിപ്പിക്കുന്നു; അതിലധികം കാരണം വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കിയെങ്കിലും കാരണം, സമയപരിധി, ബന്ധവാക്യത്തിന്റെ ആശയം എന്നിവ നിലനിർത്തിയിരിക്കുന്നു. ‘ഊമ’ എന്ന പദം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി കൂടുതൽ കൃത്യമായ ഇരട്ടപ്രയോഗം ഉപയോഗിക്കുകയും പദവികൽപമായി അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
