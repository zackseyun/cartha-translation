translation:
  language: ml
  text: നമ്മുടെ ശത്രുക്കളിൽനിന്നും നമ്മെ വെറുക്കുന്ന എല്ലാവരുടെയും കൈയിൽനിന്നും രക്ഷ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നമ്മുടെ ശത്രുക്കളിൽനിന്നും നമ്മെ വെറുക്കുന്ന എല്ലാവരുടെയും അധികാരത്തിൽനിന്നും വിടുതൽ.’
    reason: σωτηρίαν എന്നതിന് ‘വിടുതൽ’ എന്നും ἐκ χειρός എന്ന രൂപകത്തിന് ‘അധികാരത്തിൽനിന്ന്’ എന്നും അർഥമാക്കാവുന്ന ശബ്ദാർഥപരമായ ബദൽ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: σωτηρίαν
  choice: രക്ഷ
  rationale: ‘രക്ഷ’ എന്ന പദം ശത്രുക്കളിൽനിന്നുള്ള മൂർത്തമായ വിടുതലിനെയും ലൂക്കോസിന്റെ വിവരണത്തിലെ വിപുലമായ ദൈവശാസ്ത്രപരമായ അർഥത്തെയും ഒരുപോലെ തുറന്നുവയ്ക്കുന്നു.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: നമ്മുടെ ശത്രുക്കളിൽനിന്നും
  rationale: ἐξ വേർപാടിനെയോ വിടുതലിന്റെ ഉറവിടത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ശത്രുക്കളിൽനിന്നും’ എന്നത് അധിക ആശയം ചേർക്കാതെ സ്വാഭാവികമായി അത് നൽകുന്നു.
- source_word: ἐκ χειρὸς
  choice: കൈയിൽനിന്നും
  rationale: അധികാരം അഥവാ നിയന്ത്രണം സൂചിപ്പിക്കുന്ന ബൈബിൾ ശൈലിയിലെ രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിലും ഈ പ്രയോഗം ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: നമ്മെ വെറുക്കുന്ന എല്ലാവരുടെയും
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃതന്തത്തിന്റെ സ്വഭാവപരമോ തുടർച്ചയായതോ ആയ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -ഉം ... -ഉം
  rationale: രണ്ട് വിടുതൽ-വാക്യാംശങ്ങളെയും മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയഘടനയിലൂടെ ഏകോപിപ്പിക്കുന്നു.
theological_decisions:
- issue: സെഖര്യാവിന്റെ പ്രവചനത്തിൽ വാഗ്ദാനം ചെയ്യപ്പെടുന്ന രക്ഷയുടെ സ്വഭാവം
  choice: ‘രക്ഷ’ എന്നു പരിഭാഷപ്പെടുത്തി, ശത്രുക്കളിൽനിന്നുള്ള മൂർത്തമായ വിടുതലും വിപുലമായ വീണ്ടെടുപ്പാർഥവും ഒരുപോലെ നിലനിർത്തി.
  alternative: ‘വിടുതൽ’ എന്നു പരിഭാഷപ്പെടുത്തി രാഷ്ട്രീയമോ ദേശീയമോ ആയ രക്ഷയ്ക്ക് കൂടുതൽ ഊന്നൽ നൽകുക.
  rationale: വാക്യം ശത്രുക്കളെയും വെറുക്കുന്നവരെയും നേരിട്ട് പരാമർശിക്കുന്നുവെങ്കിലും ലൂക്കോസ് 1-ൽ σωτηρίαയ്ക്ക് വിപുലമായ വീണ്ടെടുപ്പാർഥവുമുണ്ട്; പരിഭാഷ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കൈയിൽനിന്നും’ എന്ന ബൈബിൾ രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘അധികാരത്തിൽനിന്നും’ അടിക്കുറിപ്പിൽ നൽകി. വാക്യം അടുത്ത വരിയിലേക്ക് വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
