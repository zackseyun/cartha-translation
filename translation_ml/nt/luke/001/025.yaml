id: LUK.1.25
reference: Luke 1:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: ml
  text: എന്തെന്നാൽ, മനുഷ്യരുടെ ഇടയിലെ എന്റെ നിന്ദ[a] നീക്കിക്കളയാൻ, കർത്താവ് എന്നെ കടാക്ഷിച്ച നാളുകളിൽ എനിക്കു ഇങ്ങനെയാണ് ചെയ്തിരിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ അപമാനം’ അല്ലെങ്കിൽ ‘എന്റെ ലജ്ജ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം പ്രത്യേകിച്ച് സമൂഹത്തിൽ അനുഭവിക്കുന്ന നിന്ദയെയോ മാനഹാനിയെയോ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ എലിസബത്തിന്റെ പ്രസ്താവനയ്ക്ക് വിശദീകരണസ്വഭാവമുള്ള ബന്ധം നൽകുന്നു; ഗ്രീക്കിലെ കാരണാർഥസാധ്യത നിലനിർത്തുന്നു.
- source_word: Οὕτως
  choice: ഇങ്ങനെയാണ്
  rationale: പ്രവൃത്തിയുടെ രീതിയിലേക്കുള്ള ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μοι … πεποίηκεν
  choice: എനിക്കുവേണ്ടി … ചെയ്തിരിക്കുന്നു
  rationale: ദൈവത്തിന്റെ വ്യക്തിപരമായ പ്രവൃത്തി സൂചിപ്പിക്കുന്ന ദത്തിവ്യാകരണവും പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന ബഹുമാനപൂർണമായ ശീർഷകമായി മലയാള ബൈബിൾഭാഷയിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐν ἡμέραις αἷς
  choice: നാളുകളിൽ
  rationale: ഗ്രീക്കിലെ കാലസൂചക ആപേക്ഷികഘടന ചുരുക്കവും വായനാസൗകര്യമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπεῖδεν
  choice: എന്നെ കടാക്ഷിച്ച
  rationale: വെറും കാണൽ മാത്രമല്ല, ശ്രദ്ധയോടെ ഒരാളിലേക്കു നോക്കുക എന്ന ആശയം നൽകുന്നു; സന്ദർഭത്തിലെ അനുകൂല ദൈവിക പരിഗണനയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀφελεῖν
  choice: നീക്കിക്കളയാൻ
  rationale: ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന അനന്തക്രിയയെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὄνειδός μου
  choice: എന്റെ നിന്ദ
  rationale: ആന്തരിക ലജ്ജയെക്കാൾ മറ്റുള്ളവരിൽനിന്നുള്ള സാമൂഹിക അവമതിപ്പിനാണ് ഊന്നൽ നൽകുന്നത്.
- source_word: ἐν ἀνθρώποις
  choice: മനുഷ്യരുടെ ഇടയിലെ
  rationale: ലിംഗഭേദമില്ലാത്ത സാമൂഹിക പരിധി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: κύριος എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ദൈവത്തെ സൂചിപ്പിക്കുന്ന ‘കർത്താവ്’
  alternative: സന്ദർഭത്തിൽ പ്രധാനപ്പെട്ട മറ്റൊരു വായനയില്ല
  rationale: എലിസബത്ത് തന്റെ വന്ധ്യതയും അതോടൊപ്പമുള്ള സാമൂഹിക നിന്ദയും നീക്കിയ ദൈവിക പ്രവൃത്തിയെക്കുറിച്ചാണ് പറയുന്നത്; ഇവിടെ അനാവശ്യമായ ക്രിസ്തുശാസ്ത്രപരമായ പ്രത്യേകീകരണം ചേർക്കുന്നില്ല.
- issue: ὄνειδος എന്നതിന്റെ സാമൂഹിക അർഥം
  choice: നിന്ദ
  alternative: അപമാനം; ലജ്ജ
  rationale: സന്താനമില്ലായ്മയെ ചുറ്റിപ്പറ്റിയ സമൂഹത്തിന്റെ അവമതിപ്പാണ് സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്. ‘നിന്ദ’ ആ ബാഹ്യവും സാമൂഹികവുമായ മാനം നിലനിർത്തുന്നു.
- issue: ἀφελεῖν എന്ന അനന്തക്രിയയുടെ ബന്ധം
  choice: കർത്താവിന്റെ കടാക്ഷത്തോടും പ്രവൃത്തിയോടും ബന്ധപ്പെട്ട ലക്ഷ്യമായി തുറന്നുവെച്ചു
  alternative: ‘കടാക്ഷിച്ചു, അങ്ങനെ നീക്കി’ എന്ന ഫലാർഥവായന
  rationale: ഗ്രീക്ക് വാക്യഘടന ലക്ഷ്യവും ഫലവും തമ്മിൽ ചെറിയ തുറന്ന നില അനുവദിക്കുന്നു; മലയാളത്തിൽ ‘നീക്കിക്കളയാൻ’ എന്ന രൂപം അത് അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കടാക്ഷിച്ച’ എന്നത് അല്പം ഉയർന്ന ശൈലിയിലുള്ളതെങ്കിലും ദൈവം ശ്രദ്ധയോടെ നോക്കിയെന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു; വാക്യത്തിലെ ഗ്രീക്ക് ബന്ധങ്ങളും സാമൂഹിക നിന്ദയുടെ ഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
