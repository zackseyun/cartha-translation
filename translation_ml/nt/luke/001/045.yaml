revisions:
- from: കർത്താവിൽനിന്ന് അവളോടു അരുളിച്ചെയ്യപ്പെട്ടവ നിവൃത്തിയാകും എന്നു വിശ്വസിച്ചവൾ അനുഗൃഹീതയാകുന്നു[a][b].
  to: കർത്താവ് അവളോടു പറഞ്ഞ കാര്യങ്ങൾ നിറവേറുമെന്ന്[a][b] വിശ്വസിച്ചവൾ അനുഗൃഹീതയാണ്.
  rationale: The revision improves modern Malayalam idiom and makes the prior divine speech explicit without altering the source meaning. It also corrects the causal-reading footnote so that it preserves the participial ‘she who believed’ and accurately locates the alternative force of ὅτι. The markers remain anchored to the clause introduced by ὅτι and to the fulfillment term.
