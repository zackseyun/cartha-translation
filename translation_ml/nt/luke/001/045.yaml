  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: ml
  text: കർത്താവ് അവളോടു പറഞ്ഞ കാര്യങ്ങൾ നിറവേറുമെന്ന്[a][b] വിശ്വസിച്ചവൾ അനുഗൃഹീതയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “വിശ്വസിച്ചവൾ അനുഗൃഹീതയാണ്; കാരണം കർത്താവ് അവളോടു പറഞ്ഞ കാര്യങ്ങൾ നിറവേറും.” ഗ്രീക്കിലെ ബന്ധകം കാരണാർഥത്തിലും വായിക്കാവുന്നതാണ്; എന്നാൽ ഇവിടെ വിശ്വാസത്തിന്റെ ഉള്ളടക്കം സൂചിപ്പിക്കുന്ന “എന്ന്” എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.'
    reason: alternative_reading
  - marker: b
    text: “നിറവേറുക” എന്നതിന് “പൂർത്തീകരിക്കപ്പെടുക” അല്ലെങ്കിൽ “നിവൃത്തിയാകുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: അനുഗൃഹീതയാകുന്നു
  rationale: ലൂക്കോസിലെ μακάριος എന്ന പദത്തിന്റെ ദൈവിക അനുഗ്രഹവുമായി ബന്ധപ്പെട്ട ഭാരം നിലനിർത്തുന്നു; വെറും മാനസിക സന്തോഷം സൂചിപ്പിക്കുന്ന ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: ἡ πιστεύσασα
  choice: വിശ്വസിച്ചവൾ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഭൂതകാല കൃദന്തരൂപത്തെ സ്വാഭാവികമായ നാമവാചകപ്രയോഗമായി നൽകുകയും വിശ്വാസത്തിന്റെ പ്രവൃത്തിയെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὅτι
  choice: എന്നു
  rationale: വിശ്വസിച്ചതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി ഇവിടെ ഏറ്റവും സ്വാഭാവികമാണ്; കാരണാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τελείωσις
  choice: നിവൃത്തി
  rationale: പറയപ്പെട്ട ദൈവിക വാഗ്ദാനം പൂർത്തിയാകുന്നതിനെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: അവളോടു അരുളിച്ചെയ്യപ്പെട്ടവ
  rationale: മുമ്പ് അവളോടു പറയപ്പെട്ട കാര്യങ്ങളുടെ ഉള്ളടക്കവും ഗ്രീക്കിലെ കർമണിപ്രയോഗവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ദൈവിക സംസാരസന്ദർഭത്തിൽ ‘അരുളിച്ചെയ്യപ്പെട്ട’ യോജിക്കുന്നു.
- source_word: παρὰ κυρίου
  choice: കർത്താവിൽനിന്ന്
  rationale: 'παρά + genitive സൂചിപ്പിക്കുന്ന ഉറവിടം വ്യക്തമായി നൽകുന്നു: സന്ദേശം കർത്താവിൽനിന്നാണ് വന്നത്.'
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: ഈ സന്ദർഭത്തിൽ വാഗ്ദാനത്തിന്റെ ഉറവിടമായ ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ പതിവായ മലയാളരൂപം.
theological_decisions:
- issue: മറിയയുടെ അനുഗൃഹീതാവസ്ഥയും അവളുടെ വിശ്വാസവും വാഗ്ദത്തവചനവും തമ്മിലുള്ള ബന്ധം
  choice: കർത്താവിൽനിന്നു ലഭിച്ച വാക്കുകൾ നിവൃത്തിയാകുമെന്ന് വിശ്വസിച്ചവളെയാണ് അനുഗൃഹീതയെന്ന് പ്രഖ്യാപിക്കുന്നത്.
  alternative: അവളോടു പറയപ്പെട്ടവ നിവൃത്തിയാകുന്നതിനാൽ അവൾ അനുഗൃഹീതയാണ് എന്ന കാരണാർഥ വായന.
  rationale: ὅτι ഇവിടെ πιστεύσασα എന്നതിന്റെ ഉള്ളടക്കവാക്യം അവതരിപ്പിക്കുന്നതാണ് വാക്യഘടനാപരമായി കൂടുതൽ സ്വാഭാവികം; എങ്കിലും കാരണാർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദൈവിക സംസാരത്തെ സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്യപ്പെട്ടവ’ ഉപയോഗിച്ചു; ὅτιയുടെ യഥാർഥ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
