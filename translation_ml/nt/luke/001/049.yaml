id: LUK.1.49
reference: Luke 1:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: ml
  text: എന്തെന്നാൽ ശക്തനായവൻ എനിക്കായി മഹത്തായ കാര്യങ്ങൾ ചെയ്തിരിക്കുന്നു; പരിശുദ്ധവുമാണ് അവിടുത്തെ നാമം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടുത്തെ നാമം പരിശുദ്ധമാണ്.” ഗ്രീക്കിൽ ഊന്നലിനായി “പരിശുദ്ധം” എന്ന പദം “അവിടുത്തെ നാമം” എന്നതിനു മുമ്പിലാണ്.
    reason: പദക്രമത്തിലെ ഊന്നലും സ്വാഭാവികമായ മറ്റൊരു മലയാളരൂപവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മറിയയുടെ സ്തുതിക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന കാരണസൂചകബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐποίησέν
  choice: ചെയ്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദൈവിക പ്രവൃത്തിയുടെ ഇപ്പോഴും പ്രസക്തമായ ഫലം സ്തുതിസന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μοι
  choice: എനിക്കായി
  rationale: ദൈവം മറിയയുടെ നന്മയ്ക്കായി പ്രവർത്തിച്ചു എന്ന ഗുണഭോക്തൃസൂചകമായ ദത്തിവിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: μεγάλα
  choice: മഹത്തായ കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, പ്രവൃത്തികളെ അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ὁ δυνατός
  choice: ശക്തനായവൻ
  rationale: നിശ്ചയാർഥകപദത്തോടുകൂടിയ വിശേഷണം ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഒരു ബഹുമാനപൂർവമായ വിശേഷണനാമമായി പ്രവർത്തിക്കുന്നു; ‘സർവശക്തൻ’ എന്നു വിവർത്തനം ചെയ്താൽ മൂലപദത്തേക്കാൾ അധിക അർഥം ചേർന്നേക്കാം.
- source_word: ἅγιον
  choice: പരിശുദ്ധം
  rationale: ദൈവനാമത്തിന്റെ വിശുദ്ധിയും വേർതിരിക്കപ്പെട്ട മഹിമയും സൂചിപ്പിക്കുന്ന സ്ഥിരവും യോജിച്ചതുമായ മലയാളപദം.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: അവിടുത്തെ നാമം
  rationale: മൂലത്തിലെ ‘നാമം’ നിലനിർത്തുകയും ദൈവത്തെക്കുറിച്ചുള്ള ബഹുമാനപൂർവമായ ആധുനിക മലയാളപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ὁ δυνατός എന്നത് ദൈവിക വിശേഷണനാമമായി വിവർത്തനം ചെയ്യൽ
  choice: ശക്തനായവൻ
  alternative: ശക്തിയുള്ളവൻ
  rationale: ഗ്രീക്കിൽ വിശേഷണം നാമമായി ഉപയോഗിച്ച് ദൈവത്തെ ബഹുമാനപൂർവം സൂചിപ്പിക്കുന്നു. തെരഞ്ഞെടുത്ത രൂപം ആ വിശേഷണനാമസ്വഭാവം നിലനിർത്തുന്നു; ‘സർവശക്തൻ’ എന്നതുപോലെ അധികമായ ദൈവശാസ്ത്രപരമായ നിർവചനം ചേർക്കുന്നില്ല.
- issue: καὶ ἅγιον τὸ ὄνομα αὐτοῦ എന്നതിലെ പദക്രമവും ഊന്നലും
  choice: പരിശുദ്ധവുമാണ് അവിടുത്തെ നാമം
  alternative: അവിടുത്തെ നാമം പരിശുദ്ധമാണ്
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ ‘പരിശുദ്ധം’ ആദ്യം വരുന്നതിനാൽ ലഭിക്കുന്ന ഊന്നൽ തെരഞ്ഞെടുത്ത മലയാളക്രമം കഴിയുന്നത്ര നിലനിർത്തുന്നു; ‘-വും’ καί എന്ന ബന്ധവും പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്തുതിഗീതത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ മലയാളം. മൂലത്തിലെ കാരണബന്ധം, ദൈവിക വിശേഷണനാമം, ഗുണഭോക്തൃസൂചക ദത്തിവ്, അവസാന ഉപവാക്യത്തിലെ ഊന്നൽ എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
