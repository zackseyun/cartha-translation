id: LUK.1.11
reference: Luke 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: ml
  text: അപ്പോൾ കർത്താവിന്റെ ഒരു ദൂതൻ ധൂപപീഠത്തിന്റെ വലതുവശത്ത് നിൽക്കുന്നതായി അവനു പ്രത്യക്ഷപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: പ്രത്യക്ഷപ്പെട്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ഈ aorist passive രൂപം ദർശനവിവരണത്തിൽ അകർമകമായി ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്ന അർഥം നൽകുന്നു; ‘കാണപ്പെട്ടു’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ദൃശ്യമായ വെളിപ്പെടലിനെ അറിയിക്കുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ δέ കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കമാണ് സൂചിപ്പിക്കുന്നത്; വൈരുധ്യം അമിതമാക്കാതെ ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനു
  rationale: ὤφθηയോടു ചേർന്ന ദത്തിവിഭക്തി പ്രത്യക്ഷത ലഭിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവനു പ്രത്യക്ഷപ്പെട്ടു’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: ἄγγελος
  choice: ദൂതൻ
  rationale: ക്ഷേത്രത്തിലെ ദർശനസന്ദർഭം സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാള ബൈബിൾ ഭാഷയിൽ ‘ദൂതൻ’ സ്വാഭാവികവും മാന്യവുമായ പദമാണ്.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: ἄγγελος κυρίου എന്ന ജനിറ്റീവ് ഘടനയെ ‘കർത്താവിന്റെ ഒരു ദൂതൻ’ എന്നു നൽകുന്നത് ബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: ἑστὼς
  choice: നിൽക്കുന്നതായി
  rationale: ἵστημι എന്നതിന്റെ perfect active participle പ്രത്യക്ഷപ്പെട്ട സമയത്തെ ദൂതന്റെ നിലയും സ്ഥാനവും വിവരിക്കുന്നു; ‘നിൽക്കുന്നതായി’ മലയാള വാക്യഘടനയിൽ സ്വാഭാവികമാണ്.
- source_word: ἐκ δεξιῶν
  choice: വലതുവശത്ത്
  rationale: ഈ പ്രയോഗം വലതുഭാഗത്തുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘വലതുവശത്ത്’ കൃത്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: θυσιαστηρίου τοῦ θυμιάματος
  choice: ധൂപപീഠത്തിന്റെ
  rationale: ജനിറ്റീവ് ഘടന ധൂപം അർപ്പിക്കുന്ന പ്രത്യേക യാഗപീഠത്തെ തിരിച്ചറിയിക്കുന്നു. ‘ധൂപപീഠം’ സംക്ഷിപ്തവും നിലവിലെ മലയാളത്തിൽ വ്യക്തവുമായ സംയുക്തപദമാണ്.
theological_decisions:
- issue: ἄγγελος κυρίου എന്ന പ്രയോഗത്തിലെ κύριος
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: ഗ്രീക്ക് പാഠം κύριος എന്നാണ് പറയുന്നത്; ഈ വാക്യം മാത്രം ആശ്രയിച്ച് ദൈവനാമം പുനഃസ്ഥാപിക്കാതെ ‘കർത്താവ്’ എന്നു നൽകുന്നത് ഉറവിടരൂപത്തോടു ചേർന്നുനിൽക്കുകയും അധിക വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യം. ‘ധൂപപീഠം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ ക്ഷേത്രോപകരണത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; പ്രത്യേക വിശദീകരണപ്പാദക്കുറിപ്പ് ആവശ്യമില്ല.
