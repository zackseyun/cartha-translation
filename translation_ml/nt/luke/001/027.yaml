  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: ml
  text: ദാവീദിന്റെ ഭവനത്തിൽപ്പെട്ട, യോസേഫ് എന്നു പേരുള്ള ഒരു പുരുഷനോടു വിവാഹനിശ്ചയം കഴിഞ്ഞിരുന്ന[a] ഒരു കന്യകയുടെ അടുക്കലേക്ക്. ആ കന്യകയുടെ പേര് മറിയം[b] എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിവാഹത്തിന് വാഗ്ദത്തയായിരുന്ന.’ ഗ്രീക്ക് പദം പൂർണവിവാഹത്തിനു മുമ്പുള്ള ഔപചാരികമായ വിവാഹനിശ്ചയാവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മരിയാം’; ഗ്രീക്ക് നാമരൂപത്തിന്റെ കൂടുതൽ നേരിട്ടുള്ള ലിപ്യന്തരണം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: കന്യക
  rationale: ഇവിടെ ഗ്രീക്ക് പദത്തിന്റെ സാധാരണ അർഥം ‘കന്യക’ എന്നാണ്; ഒരേ വാക്യത്തിലെ ആവർത്തനവും ലൂക്കോസിന്റെ സമീപസന്ദർഭവും ആ അർഥം ഉറപ്പിക്കുന്നു.
- source_word: ἐμνηστευμένην
  choice: വിവാഹം നിശ്ചയിക്കപ്പെട്ടിരുന്ന
  rationale: പൂർണവിവാഹത്തിനു മുമ്പുള്ള ഔപചാരികവും സാമൂഹികമായി ബാധകവുമായ വിവാഹനിശ്ചയാവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; perfect participle സൂചിപ്പിക്കുന്ന നിലനിന്നിരുന്ന അവസ്ഥയും നിലനിർത്തുന്നു.
- source_word: ἀνδρὶ
  choice: ഒരു പുരുഷനുമായി
  rationale: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമാകാമെങ്കിലും, വിവാഹനിശ്ചയത്തിന്റെ ഈ ഘട്ടത്തിൽ ‘ഭർത്താവ്’ എന്നു പറയുന്നത് വിവാഹം പൂർണമായിക്കഴിഞ്ഞുവെന്ന ധാരണ നൽകാം.
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: യോസേഫ് എന്നു പേരുള്ള
  rationale: ഗ്രീക്കിലെ പേരറിയിക്കുന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപമാണിത്.
- source_word: ἐξ οἴκου Δαυίδ
  choice: ദാവീദിന്റെ ഭവനത്തിൽപ്പെട്ട
  rationale: ‘ഭവനം’ എന്നത് വംശത്തെയും രാജവംശപരമായ ബന്ധത്തെയും ഉൾക്കൊള്ളുന്ന ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു; വാക്യക്രമം അനുസരിച്ച് ഇത് യോസേഫിനെ വിശേഷിപ്പിക്കുന്നു.
- source_word: Μαριάμ
  choice: മറിയം
  rationale: ഗ്രീക്ക് നാമരൂപത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതവുമായ രൂപമാണിത്.
theological_decisions:
- issue: παρθένος എന്ന പദത്തിലെ കന്യകാത്വസൂചന നിലനിർത്തണമോ
  choice: കന്യക
  alternative: യുവതി
  rationale: ഗ്രീക്ക് പദവും അതിന്റെ ആവർത്തനവും ലൂക്കോസിന്റെ സമീപസന്ദർഭവും ഇവിടെ ‘കന്യക’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു; അതിനാൽ വാക്യത്തിൽ ഉള്ള ദൈവശാസ്ത്രപരമായ പ്രസക്തി കൂട്ടിച്ചേർക്കലില്ലാതെ നിലനിർത്തുന്നു.
- issue: വിവാഹനിശ്ചയാവസ്ഥയെ പൂർണവിവാഹമായി അവതരിപ്പിക്കണമോ
  choice: വിവാഹം നിശ്ചയിക്കപ്പെട്ടിരുന്ന ഒരു പുരുഷൻ
  alternative: ഭർത്താവായ യോസേഫ്
  rationale: ἐμνηστευμένην ഔപചാരികമായ മുൻവിവാഹാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ഭർത്താവ്’ എന്നു മാത്രം വിവർത്തനം ചെയ്താൽ ആ ഘട്ടഭേദം മങ്ങിപ്പോകാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലവാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച ചലനപ്രയോഗത്തിന്റെ തുടർച്ചയായതിനാൽ ‘അടുക്കലേക്ക്’ എന്ന ഖണ്ഡവാക്യരൂപം നിലനിർത്തി. ‘ദാവീദിന്റെ ഭവനം’ എന്ന ബൈബിൾ-രാജവംശപരമായ പ്രയോഗം ലളിതമാക്കാതെ സംരക്ഷിച്ചു.
