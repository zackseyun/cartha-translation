source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ ἱερατεύειν αὐτὸν ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ ἔναντι τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: ml
  text: 'അവൻ തന്റെ പുരോഹിതവിഭാഗത്തിന്റെ ക്രമമനുസരിച്ച് ദൈവസന്നിധിയിൽ പുരോഹിതശുശ്രൂഷ ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ ഇങ്ങനെ സംഭവിച്ചു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ തന്റെ പുരോഹിതവിഭാഗത്തിന്റെ സേവനക്രമമനുസരിച്ച് ദൈവസന്നിധിയിൽ പുരോഹിതശുശ്രൂഷ നിർവഹിച്ചുകൊണ്ടിരിക്കുമ്പോൾ.’
    reason: കാലപ്രയോഗത്തിന്റെയും പുരോഹിതവിഭാഗത്തിന്റെ നിശ്ചിത സേവനക്രമത്തിന്റെയും അടുത്തൊരു പദവിന്യാസം നൽകുന്നു.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ഇങ്ങനെ സംഭവിച്ചു
  rationale: കഥാവിവരണത്തിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള മൃദുവായ നീക്കം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; δέ-യെ ശക്തമായ വൈരുധ്യമായി അവതരിപ്പിക്കുന്നില്ല.
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: അവൻ ... പുരോഹിതശുശ്രൂഷ ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐν ചേർന്ന articular infinitive-ന്റെ കാലസംബന്ധമായ അർഥവും ἱερατεύωയുടെ പ്രത്യേക പുരോഹിതസേവനാർഥവും വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ
  choice: തന്റെ പുരോഹിതവിഭാഗത്തിന്റെ ക്രമമനുസരിച്ച്
  rationale: τάξις സൂചിപ്പിക്കുന്ന നിശ്ചിത ക്രമവും ἐφημερία സൂചിപ്പിക്കുന്ന പുരോഹിതരുടെ സേവനവിഭാഗവും ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἔναντι τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യത്തിൽ നടക്കുന്ന ആരാധനാപരമായ സേവനം എന്ന അർഥം സംക്ഷിപ്തവും മാന്യവുമായി പകരുന്നു.
theological_decisions:
- issue: സെഖര്യാവിന്റെ ദൈവാലയ പുരോഹിതസേവനത്തെ സൂചിപ്പിക്കുന്ന ആരാധനാപരമായ പദപ്രയോഗം
  choice: ദൈവസന്നിധിയിൽ പുരോഹിതശുശ്രൂഷ ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ
  alternative: ദൈവത്തിന്റെ മുമ്പാകെ പുരോഹിതനായി സേവിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ചരിത്രപരമായ പുരോഹിതസേവനസന്ദർഭം നിലനിർത്തുന്നു; പിൽക്കാല സഭാപദവികളെയോ പ്രത്യേക സമ്പ്രദായപരമായ ആശയങ്ങളെയോ ഇതിലേക്കു കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന ഗ്രീക്ക് സംഭവപ്രസ്താവനയെ സൂചിപ്പിക്കാൻ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു; ‘പുരോഹിതവിഭാഗം’ ചരിത്രപരമായ സ്ഥാപനസന്ദർഭം വ്യക്തമാക്കുന്നു.
