  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വന്ധ്യ’ എന്ന കൃത്യമായ പദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട പ്രായപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
