  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: ml
  text: അവർക്ക് ഒരു കുട്ടിയും ഉണ്ടായിരുന്നില്ല, കാരണം എലിസബത്ത് വന്ധ്യയായിരുന്നു; ഇരുവരും പ്രായം ഏറെ ചെന്നവരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “തങ്ങളുടെ ദിവസങ്ങളിൽ മുന്നേറിയവരായിരുന്നു.” അതായത്, അവർ വയസ്സുചെന്നവരായിരുന്നു.
    reason: ഗ്രീക്ക് കാലസംബന്ധിയായ പ്രയോഗത്തിന്റെ അക്ഷരരൂപവും അർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: τέκνον
  choice: മക്കൾ
  rationale: ഗ്രീക്കിൽ ഏകവചനമാണെങ്കിലും, ദമ്പതികൾക്ക് സന്താനമില്ലെന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘മക്കളില്ലായിരുന്നു’ യോജിക്കുന്നു; ഇത് ഒരൊറ്റ കുട്ടിയെ മാത്രം പ്രതീക്ഷിച്ചിരുന്നുവെന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
- source_word: καθότι
  choice: കാരണം
  rationale: മക്കളില്ലായ്മയുടെ കാരണം നേരിട്ട് അവതരിപ്പിക്കുന്ന വ്യക്തവും സ്വാഭാവികവുമായ കാരണസൂചകമാണ്.
- source_word: στεῖρα
  choice: വന്ധ്യ
  rationale: ഈ പദം മക്കളില്ലെന്ന ഫലം മാത്രമല്ല, ഗർഭധാരണശേഷിയില്ലായ്മയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വന്ധ്യ’ അത് സംക്ഷിപ്തവും കൃത്യവുമായി നിലനിർത്തുന്നു.
- source_word: ἀμφότεροι
  choice: ഇരുവരും
  rationale: സെഖര്യാവിനും എലിസബത്തിനും ഒരുപോലെ ഈ വിവരണം ബാധകമാണെന്ന ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: പ്രായം ഏറെ ചെന്നവർ
  rationale: ‘തങ്ങളുടെ ദിവസങ്ങളിൽ മുന്നേറിയവർ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം മാന്യവും സാധാരണക്കാർക്ക് വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐκ ἦν αὐτοῖς
  choice: അവർക്കു ... ഇല്ലായിരുന്നു
  rationale: ‘അവർക്കായി/അവർക്കു ഉണ്ടായിരുന്നില്ല’ എന്ന ഗ്രീക്ക് ഉടമസ്ഥതാപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക ദത്തിവ് നിർമാണത്തിലൂടെ പുനരാവിഷ്കരിക്കുന്നു.
