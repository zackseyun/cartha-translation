  text: Τῇ δὲ Ἐλισάβετ ἐπλήσθη ὁ χρόνος τοῦ τεκεῖν αὐτήν, καὶ ἐγέννησεν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/057.yaml
  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: ml
  text: എലിസബെത്തിന് പ്രസവിക്കാനുള്ള സമയം തികഞ്ഞു[a]; അവൾ ഒരു മകനെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: ‘എലിസബെത്തിന് പ്രസവസമയം വന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഇത് കഥയുടെ പുരോഗതി സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണ്; ഇവിടെ ‘ഇപ്പോൾ’ എന്ന കാലസൂചന ചേർക്കുന്നത് മൂലത്തിൽ ഇല്ലാത്ത ഊന്നൽ വരുത്തും.
- source_word: Ἐλισάβετ
  choice: എലിസബെത്ത്
  rationale: മലയാളത്തിൽ പരിചിതവും ഗ്രീക്ക് പേരിനോടു ചേർന്നുനിൽക്കുന്നതുമായ ലിപ്യന്തരണം.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: സമയം തികഞ്ഞു
  rationale: കാലയളവ് പൂർത്തിയായെന്ന മൂലപ്രയോഗത്തിന്റെ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: എലിസബെത്തിന് പ്രസവിക്കാനുള്ള
  rationale: പ്രസവത്തെ സൂചിപ്പിക്കുന്ന articular infinitive-ന്റെ അർഥം വ്യക്തമായി നൽകുകയും സർവനാമത്തിന്റെ സൂചന എലിസബെത്തിലേക്കാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐγέννησεν
  choice: അവൾ ... പ്രസവിച്ചു
  rationale: പൂർത്തിയായ പ്രസവസംഭവത്തെ മലയാള കഥനശൈലിയിൽ കൃത്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: υἱόν
  choice: ഒരു മകനെ
  rationale: υἱός ഇവിടെ ആൺസന്താനമായ മകനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘കുഞ്ഞ്’ എന്നതിലേക്കു ലഘൂകരിച്ചിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘സമയം തികഞ്ഞു’ എന്ന പ്രയോഗം മൂലത്തിലെ പൂർത്തീകരണഭാവം സൂക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ പ്രയോഗസഹജമായ മറ്റൊരു രൂപം നൽകുന്നു.
