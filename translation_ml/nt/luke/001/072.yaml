lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: കരുണ കാണിക്കാനും
  rationale: ‘കരുണ ചെയ്യുക’ എന്ന പദാനുപദ രൂപത്തേക്കാൾ സ്വാഭാവികമായ മലയാള പ്രയോഗമാണ് ‘കരുണ കാണിക്കുക’; ഗ്രീക്കിലെ കാരുണ്യപ്രവർത്തനത്തിന്റെ അർഥവും ഉദ്ദേശസൂചകമായ അനന്തക്രിയാരൂപവും ഇത് നിലനിർത്തുന്നു.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാരോടു
  rationale: μετά എന്നതിന് അക്ഷരാർഥത്തിൽ ‘കൂടെ’ എന്നാണെങ്കിലും, ποιεῖν ἔλεος എന്ന പ്രയോഗത്തോടൊപ്പം ഇവിടെ ‘...നോടു കരുണ കാണിക്കുക’ എന്നതാണ് സ്വാഭാവിക മലയാളം. ‘പിതാക്കന്മാർ’ ഇസ്രായേലിന്റെ പൂർവപിതാക്കളെ സൂചിപ്പിക്കുന്ന പുരുഷലിംഗവും ഉടമ്പടിപരമായ അനുരണനവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: μνησθῆναι
  choice: ഓർക്കാനും
  rationale: ദൈവം ഉടമ്പടി ‘ഓർക്കുന്നു’ എന്ന ബൈബിൾപ്രയോഗം വാഗ്ദാനത്തോടു വിശ്വസ്തമായി പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കാമെങ്കിലും, മൂലപാഠത്തിലെ ‘ഓർക്കുക’ എന്ന രൂപം വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: തന്റെ വിശുദ്ധ ഉടമ്പടി
  rationale: διαθήκηയ്ക്ക് ഈ രക്ഷാചരിത്രസന്ദർഭത്തിൽ ‘ഉടമ്പടി’ യോജിക്കുന്നു; ἁγίας എന്നത് ‘വിശുദ്ധ’ എന്നും αὐτοῦ ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തന്റെ’ എന്നും പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ഉടമ്പടിസന്ദർഭത്തിലെ ദൈവത്തിന്റെ ‘ഓർക്കൽ’
  choice: തന്റെ വിശുദ്ധ ഉടമ്പടി ഓർക്കാനും
  alternative: തന്റെ വിശുദ്ധ ഉടമ്പടിയനുസരിച്ച് പ്രവർത്തിക്കാനും
  rationale: ദൈവത്തിന്റെ ഓർക്കൽ വിശ്വസ്തമായ പ്രവർത്തനത്തെ ഉൾക്കൊള്ളാമെങ്കിലും, ഗ്രീക്ക് നേരിട്ട് ‘ഓർക്കുക’ എന്നാണ് പറയുന്നത്. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി മുഖ്യപാഠത്തിൽ പരിഹരിക്കാതെ നിലനിർത്തി.
- issue: πατέρων ἡμῶν എന്നതിന്റെ വിവർത്തനം
  choice: നമ്മുടെ പിതാക്കന്മാർ
  alternative: നമ്മുടെ പൂർവികർ
  rationale: ഗ്രീക്ക് പദം വ്യാകരണപരമായി പുരുഷലിംഗത്തിലുള്ളതും ഇസ്രായേലിന്റെ പൂർവപിതാക്കളെ സൂചിപ്പിക്കുന്നതുമാണ്. അതിനാൽ അതിന്റെ ഉടമ്പടിപരവും പിതൃപുരുഷസംബന്ധവുമായ അനുരണനം ‘പിതാക്കന്മാർ’ എന്നതിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന ഉദ്ദേശസൂചക ഘടകമായതിനാൽ ‘-ആനും’ രൂപങ്ങളും അവസാനത്തിലെ അൽപവിരാമവും നിലനിർത്തി. ‘പിതാക്കന്മാർ,’ ‘വിശുദ്ധ ഉടമ്പടി,’ ‘ഓർക്കുക’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ഉടമ്പടിപരമായ അനുരണനം സംരക്ഷിക്കുന്നു.
