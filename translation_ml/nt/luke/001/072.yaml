  language: ml
  text: നമ്മുടെ പിതാക്കന്മാരോടു കരുണ കാണിക്കാനും[a][c] തന്റെ വിശുദ്ധ ഉടമ്പടി ഓർക്കാനും[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ പിതാക്കന്മാരോടൊപ്പം.’ ഗ്രീക്ക് പ്രയോഗം ഇസ്രായേലിന്റെ പൂർവപിതാക്കളോടുള്ള ബന്ധത്തിൽ കരുണ കാണിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ബൈബിളിലെ ഉടമ്പടിഭാഷയിൽ ‘ഓർക്കുക’ എന്നത് വെറും മനസ്സിൽ സ്മരിക്കുന്നതല്ല; മുമ്പ് നൽകിയ വാഗ്ദാനത്തോടു വിശ്വസ്തമായി പ്രവർത്തിക്കുന്നതും പലപ്പോഴും അതിൽ ഉൾപ്പെടുന്നു.
    reason: cultural_note
  - marker: c
    text: ‘നമ്മുടെ പിതാക്കന്മാർ’ എന്നത് ഇസ്രായേലിന്റെ പൂർവപിതാക്കളെയോ ഗോത്രപിതാക്കന്മാരെയോ സൂചിപ്പിക്കുന്നു; ‘നമ്മുടെ പൂർവികർ’ എന്നും വിവർത്തനം ചെയ്യാം.
