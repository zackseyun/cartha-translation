  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶπεν Μαριάμ· Μεγαλύνει ἡ ψυχή μου τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: ml
  text: 'മറിയം പറഞ്ഞു: “എന്റെ ആത്മാവ് കർത്താവിനെ മഹത്ത്വപ്പെടുത്തുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ ആത്മാവ് കർത്താവിന്റെ മഹത്ത്വം പ്രഖ്യാപിക്കുന്നു.”
    reason: μεγαλύνει എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ മറ്റൊരു സ്വാഭാവിക പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: Καὶ
  choice: (മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ഗ്രീക്കിലെ ഈ സാധാരണ ആഖ്യാനബന്ധകം മലയാളത്തിൽ വാക്യാരംഭത്തിൽ നിർബന്ധമായി ‘കൂടാതെ’ എന്നോ ‘അപ്പോൾ’ എന്നോ ചേർത്താൽ അസ്വാഭാവികമാകുകയോ മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചന വരികയോ ചെയ്യും. വാക്യക്രമത്തിലൂടെ ബന്ധം സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ λέγω എന്ന ക്രിയയുടെ ഭൂതകാലരൂപത്തിന് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപരിഭാഷ.
- source_word: Μαριάμ
  choice: മറിയം
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ നാമരൂപം ഉപയോഗിച്ചു.
- source_word: Μεγαλύνει
  choice: മഹത്ത്വപ്പെടുത്തുന്നു
  rationale: വർത്തമാനകാലവും സ്തുതിഗീതത്തിന്റെ കാവ്യഭാവവും നിലനിർത്തുന്നു. ഇവിടെ അർഥം കർത്താവിന്റെ മഹത്ത്വം അംഗീകരിച്ച് ഉയർത്തിപ്പറയുക എന്നതാണ്; അതിന്റെ മറ്റൊരു സ്വാഭാവിക വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἡ ψυχή μου
  choice: എന്റെ ആത്മാവ്
  rationale: സെമിറ്റിക്-കാവ്യാത്മകമായ പ്രയോഗവും അതിലെ മാനവസ്വഭാവസംബന്ധമായ തുറന്ന അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; വെറും ‘ഞാൻ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: τὸν κύριον
  choice: കർത്താവിനെ
  rationale: κύριος ഇവിടെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരപൂർവമായ തിരുവെഴുത്തുപദവിയാണ്. മലയാളത്തിലെ സ്ഥാപിതവും അർഥസമ്പന്നവുമായ ‘കർത്താവ്’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: κύριος എന്ന ദൈവിക പദവിയുടെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഈ സ്തുതിഗീതസന്ദർഭത്തിൽ പദം ദൈവത്തോടാണ് പ്രയോഗിച്ചിരിക്കുന്നത്; ‘യജമാനൻ’ എന്നത് സാധ്യമായ നിഘണ്ടുവർത്ഥമായിരുന്നാലും ഇവിടെ അത്യന്തം പരിമിതമാണ്.
- issue: ἡ ψυχή μου എന്ന മാനവസ്വഭാവസംബന്ധമായ കാവ്യപ്രയോഗം
  choice: എന്റെ ആത്മാവ്
  alternative: ഞാൻ / എന്റെ അന്തരംഗം
  rationale: മൂലത്തിലെ വ്യക്തിത്വസമഗ്രതയെയും കാവ്യാത്മക ഭാഷയെയും മുൻകൂട്ടി ഒരു പ്രത്യേക മാനവശാസ്ത്രവ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ സ്തുതിഗീതഭാഷ. ‘എന്റെ ആത്മാവ്’ എന്ന തിരുവെഴുത്തുസ്വഭാവമുള്ള കാവ്യപ്രയോഗം നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചു.
