  yaml_path: translation/nt/luke/001/070.yaml
  text: just as he spoke through the mouth of his holy prophets from of old,[a]
translation:
  language: ml
  text: പുരാതന കാലം മുതൽ[a] തന്റെ വിശുദ്ധ പ്രവാചകന്മാരുടെ വായിലൂടെ അവൻ അരുളിച്ചെയ്തതുപോലെ തന്നെ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പണ്ടു മുതൽ.’ ഈ പ്രയോഗം വിദൂരമായ പുരാതനകാലത്തെ സൂചിപ്പിക്കാം. ചിലർ ഇതിനെ കൂടുതൽ ശക്തമായി ‘അനാദികാലം മുതൽ’ എന്നു മനസ്സിലാക്കുന്നു; എന്നാൽ ഇവിടെ പ്രവാചകന്മാരെ പരാമർശിക്കുന്നതിനാൽ ‘പുരാതന കാലം മുതൽ’ എന്ന അർഥമാണ് കൂടുതൽ യോജിച്ചത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: അരുളിച്ചെയ്തതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിലെ ദൈവിക പ്രവർത്തനം മുൻകാല പ്രവചനത്തോട് ഒത്തുപോകുന്നതായി കാണിക്കുന്ന താരതമ്യബന്ധം ‘പോലെതന്നെ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐλάλησεν
  choice: അരുളിച്ചെയ്തു
  rationale: സംസാരിച്ചത് ദൈവമാണെന്ന സന്ദർഭത്തിൽ മാന്യവും സ്വാഭാവികവുമായ പ്രയോഗം; തുടർന്നുള്ള പ്രവാചകമാധ്യമത്വത്തോടും യോജിക്കുന്നു.
- source_word: διὰ στόματος
  choice: വായിലൂടെ
  rationale: പ്രവാചകന്മാർ മുഖേനയുള്ള ദൈവിക വചനത്തിന്റെ മൂർത്തമായ ബൈബിൾ ശൈലിയിലെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: τῶν ἁγίων ... προφητῶν
  choice: തന്റെ വിശുദ്ധ പ്രവാചകന്മാരുടെ
  rationale: ἁγίων എന്ന വിശേഷണം προφητῶν-നെ നേരിട്ട് വിശേഷിപ്പിക്കുന്നതും αὐτοῦ ദൈവത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നതും വ്യക്തമായി നൽകുന്നു.
- source_word: ἀπ’ αἰῶνος
  choice: പുരാതനകാലംമുതൽ
  rationale: പ്രവാചകന്മാരെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ വിദൂരമായ പൂർവകാലത്തെ സൂചിപ്പിക്കുന്നു; നിർബന്ധമായി അനാദിയായ നിത്യതയെ പ്രസ്താവിക്കുന്നില്ല.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: സംസാരിക്കുന്ന ദൈവത്തെയാണ് സർവനാമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; പ്രത്യാവർത്തക രൂപം മലയാളത്തിൽ ഈ ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀπ’ αἰῶνος എന്ന പ്രയോഗത്തിന്റെ കാലപരിധി
  choice: രക്ഷാചരിത്രത്തിലെ വിദൂരമായ പൂർവകാലം (‘പുരാതനകാലംമുതൽ’)
  alternative: ‘അനാദികാലംമുതൽ’ അഥവാ ‘നിത്യതമുതൽ’
  rationale: ഉടൻ പരാമർശിക്കപ്പെടുന്നത് പ്രവാചകന്മാരായതിനാൽ ചരിത്രത്തിലെ പുരാതനകാലമാണ് പ്രധാന സൂചന. എങ്കിലും പ്രയോഗത്തിന്റെ കാലഗാംഭീര്യം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘വായിലൂടെ’ എന്ന ബൈബിൾ രൂപകം നിലനിർത്തി; ദൈവത്തിന്റെ സംസാരത്തിന് ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
