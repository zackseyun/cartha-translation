translation:
  language: ml
  text: അവിടന്ന് തന്റെ ദാസനായ[a] ഇസ്രായേലിനെ സഹായിച്ചു—കരുണ ഓർത്തുകൊണ്ട്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ കുട്ടിയായ ഇസ്രായേലിനെ.’ παῖς എന്ന ഗ്രീക്കുപദത്തിന് ‘ദാസൻ’ എന്നും ‘കുട്ടി’ എന്നും അർഥമാകാം. പഴയനിയമത്തിൽ ഇസ്രായേലിനെ ദൈവത്തിന്റെ ദാസനെന്നു വിളിക്കുന്ന ഭാഷാശൈലി പരിഗണിച്ചാണ് ഇവിടെ ‘ദാസൻ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘കരുണ’ എന്നതിന് ഉടമ്പടിയോടു ബന്ധപ്പെട്ട കരുണയെന്നോ അനുകമ്പയോടുകൂടിയ വിശ്വസ്തതയെന്നോ ഉള്ള ആശയവും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβετο
  choice: സഹായിച്ചു
  rationale: സഹായിക്കാനോ താങ്ങാനോ വേണ്ടി കൈക്കൊള്ളുക എന്ന ആശയം സന്ദർഭോചിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ഗ്രീക്കിലെ ഭൂതകാല രക്ഷാപ്രവൃത്തിയുടെ സംഗ്രഹഭാവവും നിലനിർത്തുന്നു.
- source_word: Ἰσραὴλ
  choice: ഇസ്രായേൽ
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം; ഇവിടെ ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: παιδὸς
  choice: ദാസനായ
  rationale: παῖς എന്നതിന് ‘ദാസൻ’ എന്നും ‘കുട്ടി/മകൻ’ എന്നും അർഥമാകാം. ദൈവത്തിന്റെ ദാസനായ ഇസ്രായേൽ എന്ന പഴയനിയമ-സെപ്റ്റുവജിന്റ് ഭാഷാശൈലി പരിഗണിച്ച് ‘ദാസൻ’ തിരഞ്ഞെടുത്തു; യഥാർഥമായ മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: സഹായിക്കുന്ന ദൈവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രത്യയപ്രയോഗം; ഇസ്രായേൽ അവിടത്തെ ദാസനാണെന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: μνησθῆναι
  choice: ഓർത്തുകൊണ്ട്
  rationale: ദൈവത്തിന്റെ സഹായപ്രവൃത്തിയോടൊപ്പം നിൽക്കുന്ന ഓർമ്മിക്കൽ എന്ന ക്രിയാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഉദ്ദേശ്യം, ഫലം, അനുബന്ധ സാഹചര്യം എന്നിവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധമായി നിശ്ചയിക്കുന്നില്ല.
- source_word: ἐλέους
  choice: കരുണ
  rationale: ἔλεος എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും പൊതുവായി ഗ്രഹിക്കാവുന്നതുമായ അർഥം. ഉടമ്പടിയോടുള്ള വിശ്വസ്തകരുണയുടെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനെക്കുറിച്ചുള്ള παῖς എന്ന പദത്തിന്റെ അർഥം
  choice: തന്റെ ദാസനായ ഇസ്രായേൽ
  alternative: തന്റെ കുട്ടിയായ/മകനായ ഇസ്രായേൽ
  rationale: ഇസ്രായേലിനെ ദൈവത്തിന്റെ ദാസനെന്നു വിളിക്കുന്ന തിരുവെഴുത്തുപാരമ്പര്യവുമായി ‘ദാസൻ’ കൂടുതൽ യോജിക്കുന്നു. എന്നാൽ ഗ്രീക്കുപദത്തിന്റെ കുടുംബബന്ധസൂചകമായ സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: μνησθῆναι ἐλέους എന്ന പ്രയോഗത്തിന്റെ ശക്തി
  choice: കരുണ ഓർത്തുകൊണ്ട്
  alternative: കരുണ ഓർക്കേണ്ടതിന് / കരുണയുടെ ഓർമ്മയിൽ
  rationale: ദൈവത്തിന്റെ ഓർമ്മിക്കൽ അവിടത്തെ സഹായപ്രവൃത്തിയിൽ പ്രകടമാകുന്നു എന്ന ബന്ധം ചുരുക്കമായി നിലനിർത്തുന്നു; ഇത് ഉദ്ദേശ്യമോ ഫലമോ മാത്രമാണെന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും അന്തസ്സുള്ളതുമായ ശൈലി. ഗ്രീക്കിൽ കർത്താവ് പരോക്ഷമായതിനാൽ സന്ദർഭത്തിലെ ദൈവത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘അവിടന്ന്’ ചേർത്തു. ദീർഘവിരാമചിഹ്നം സഹായപ്രവൃത്തിയും കരുണ ഓർക്കുന്നതും തമ്മിലുള്ള അടുത്ത ബന്ധം നിലനിർത്തുന്നു.
