  text: καὶ ἀποκριθεῖσα ἡ μήτηρ αὐτοῦ εἶπεν· Οὐχί, ἀλλὰ κληθήσεται Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/060.yaml
  text: And his mother answered[a], “No; rather, he shall be called John.”
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ അമ്മ മറുപടി പറഞ്ഞു: “അല്ല; മറിച്ച്, അവനെ യോഹന്നാൻ എന്നു വിളിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: മറുപടി പറഞ്ഞു
  rationale: ἀποκρίνομαι എന്ന ക്രിയയുടെ aorist participle നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ finite രൂപമായി വിവർത്തനം ചെയ്തു.
- source_word: μήτηρ αὐτοῦ
  choice: അവന്റെ അമ്മ
  rationale: നിശ്ചിത പരാമർശവും ഉടമസ്ഥബന്ധവും സ്വാഭാവികമായ മലയാളപ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: Οὐχί
  choice: അല്ല
  rationale: മുൻപ് നിർദേശിച്ച പേരിനെ വ്യക്തമായി നിഷേധിക്കുന്ന ശക്തമായ മറുപടി മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻധാരണ തിരുത്തുന്ന adversative ഭാവം വാക്യഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ഉദ്ധരണിയിൽ സെമിക്കോളണിന് ശേഷം വരുന്ന പ്രസ്താവന തിരുത്തൽ വ്യക്തമാക്കുന്നു.
- source_word: κληθήσεται
  choice: വിളിക്കണം
  rationale: ഭാവികാല കർമണി രൂപം ഇവിടെ കുഞ്ഞിന് നിശ്ചയിച്ചിരിക്കുന്ന പേര് ഉറപ്പോടെ പ്രഖ്യാപിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘വിളിക്കപ്പെടും’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ മലയാളം; എങ്കിലും നിയോഗാത്മക ഭാവം അല്പം ശക്തമാക്കുന്നതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: മലയാള ബൈബിൾപരമ്പരയിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി. ഗ്രീക്കിലെ participial ഘടന മലയാളത്തിലെ സ്വാഭാവിക finite ക്രിയയായി മാറ്റി; പേരിടലിലെ ഉറച്ച തിരുത്തൽ നിലനിർത്തി.
