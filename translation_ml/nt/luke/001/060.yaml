revisions:
- from: 'അപ്പോൾ അവന്റെ അമ്മ മറുപടി പറഞ്ഞു: “അല്ല; അവനെ യോഹന്നാൻ എന്നു വിളിക്കണം.”'
  to: 'അപ്പോൾ അവന്റെ അമ്മ മറുപടി പറഞ്ഞു: “അല്ല; മറിച്ച്, അവനെ യോഹന്നാൻ എന്നു വിളിക്കും.”'
  rationale: The revision replaces the modal «വിളിക്കണം» with the ordinary future «വിളിക്കും» and explicitly represents ἀλλά with «മറിച്ച്». It retains the natural finite rendering of the participle, the established name form, and the concise dialogue register.
  reviewer_model: gpt-5.6-terra
