reference: Luke 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: ml
  text: 'എന്നാൽ ദൂതൻ അവനോടു പറഞ്ഞു: “സഖറിയാവേ, ഭയപ്പെടേണ്ടാ; നിന്റെ പ്രാർഥന[a] കേൾക്കപ്പെട്ടിരിക്കുന്നു. നിന്റെ ഭാര്യ എലിസബത്ത് നിനക്കൊരു മകനെ പ്രസവിക്കും; നീ അവന് യോഹന്നാൻ എന്നു പേരിടും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ അപേക്ഷ കേൾക്കപ്പെട്ടിരിക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നീ അവന്റെ പേര് യോഹന്നാൻ എന്നു വിളിക്കും.’
    reason: literal_idiom
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: δέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധകമാണ്; സഖറിയാവിന്റെ ഭയത്തിൽനിന്ന് ദൂതന്റെ ആശ്വാസവാക്കിലേക്കുള്ള നേരിയ തിരിവ് ‘എന്നാൽ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὁ ἄγγελος
  choice: ദൂതൻ
  rationale: സന്ദർഭത്തിൽ സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾഭാഷയിലും പൊതുവ്യവഹാരത്തിലും ‘ദൂതൻ’ സ്വാഭാവികമാണ്.
- source_word: Μὴ φοβοῦ
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നിലവിലുള്ള ഭയത്തോടുള്ള നേരിട്ടുള്ള വിലക്കാണ്; ആധുനികവും ഗൗരവമുള്ളതുമായ സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Ζαχαρία
  choice: സഖറിയാവേ
  rationale: വിളിവിഭക്തി വ്യക്തമാക്കിക്കൊണ്ട് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള പേരുരൂപം ഉപയോഗിക്കുന്നു.
- source_word: διότι
  choice: കാരണം സൂചിപ്പിക്കുന്ന അർധവിരാമബന്ധം
  rationale: ദൂതന്റെ ആശ്വാസത്തിന് കാരണം പിന്നാലെ വരുന്നു. മലയാളത്തിൽ ‘കാരണം’ ആവർത്തിക്കാതെ അർധവിരാമം ഉപയോഗിക്കുന്നത് ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: εἰσηκούσθη
  choice: കേൾക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ഭൂതകാല നിഷ്ക്രിയരൂപത്തിന്റെ പൂർത്തിയായതും ഇപ്പോൾ പ്രസക്തവുമായ ഫലം നിലനിർത്തുന്നു; ആരാണ് കേട്ടതെന്ന് മൂലപാഠംപോലെ വ്യക്തമാക്കുന്നില്ല.
- source_word: ἡ δέησίς σου
  choice: നിന്റെ പ്രാർഥന
  rationale: δέησις ദൈവത്തോടുള്ള അപേക്ഷയെയോ യാചനയെയോ സൂചിപ്പിക്കുന്നു; ‘പ്രാർഥന’ സാധാരണ വായനക്കാർക്ക് ഏറ്റവും സ്വാഭാവികം, പ്രത്യേക സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: നിന്റെ ഭാര്യ എലിസബത്ത്
  rationale: സംബന്ധസൂചകമായ σουയും വിവാഹസന്ദർഭവും കാരണം γυνή ഇവിടെ ‘ഭാര്യ’ എന്നാണ്.
- source_word: γεννήσει υἱόν σοι
  choice: നിനക്കൊരു മകനെ പ്രസവിക്കും
  rationale: സ്ത്രീ കർത്താവായ γεννάω പ്രസവിക്കുക എന്നർഥം നൽകുന്നു; σοιയുടെ വ്യക്തിപരമായ പ്രയോജന/ബന്ധസൂചനയും നിലനിർത്തുന്നു.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: നീ അവന് യോഹന്നാൻ എന്നു പേരിടണം
  rationale: ഗ്രീക്ക് നാമകരണപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഭാവികാലരൂപത്തിനുള്ളിലെ നിർദേശാത്മക ബലം ‘പേരിടണം’ സംരക്ഷിക്കുന്നു. അക്ഷരാർഥഘടന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Ἰωάννην
  choice: യോഹന്നാൻ
  rationale: പുതിയനിയമ മലയാള പാരമ്പര്യത്തിൽ പരിചിതവും മൂലനാമബന്ധം നിലനിർത്തുന്നതുമായ രൂപം.
theological_decisions:
- issue: ‘കേൾക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന നിഷ്ക്രിയരൂപത്തിന്റെ പ്രവർത്താവ്
  choice: ദൈവത്തെ പേരെടുത്തു ചേർക്കാതെ നിഷ്ക്രിയരൂപം നിലനിർത്തി.
  alternative: ‘ദൈവം നിന്റെ പ്രാർഥന കേട്ടിരിക്കുന്നു’ എന്നു വ്യക്തമാക്കുക.
  rationale: യഹൂദ പ്രാർഥനാസന്ദർഭത്തിൽ ദൈവമാണ് കേട്ടതെന്ന് സ്വാഭാവികമായി മനസ്സിലാകുമെങ്കിലും ഗ്രീക്ക് പാഠം പ്രവർത്താവിനെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവിക നിഷ്ക്രിയത്തിന്റെ സൂചന നിലനിർത്തുകയും പാഠത്തേക്കാൾ അധികം വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്തു.
- issue: καλέσεις എന്ന ഭാവികാലത്തിന്റെ നിർദേശാത്മക ബലം
  choice: ‘പേരിടണം’
  alternative: ‘പേരിടും’
  rationale: ദൂതന്റെ അറിയിപ്പിൽ ഇത് ഭാവിപ്രവചനത്തോടൊപ്പം നാമകരണനിർദേശവും വഹിക്കുന്നു. ‘പേരിടണം’ ആ ബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വെറും ഭാവികാലമായി മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി; എന്നാൽ വിളിവിഭക്തിയും ദൂതവചനത്തിന്റെ ഔപചാരികതയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
