  yaml_path: translation/nt/luke/024/034.yaml
  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: ml
  text: ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു:[a] “കർത്താവ് തീർച്ചയായും ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു; ശിമോന് പ്രത്യക്ഷനായി!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “കർത്താവ് ശരിക്കും ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു” അഥവാ “കർത്താവ് തീർച്ചയായും ഉയിർപ്പിക്കപ്പെട്ടു.” ഗ്രീക്കിലെ ക്രിയാവിശേഷണവും ക്രിയയും അടുത്ത അർഥങ്ങളുള്ള പല രീതിയിൽ പരിഭാഷപ്പെടുത്താം; മുഖ്യപാഠം ഗ്രീക്കിലെ കർമണരൂപം നിലനിർത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντας
  choice: പറഞ്ഞു
  rationale: വലിയ വാക്യഘടനയിൽ മുൻപുള്ള ബഹുവചന കർത്താവിനോട് ബന്ധപ്പെടുന്ന വർത്തമാനകാല കൃദന്തരൂപം. ഒറ്റ വാക്യമായി വായിക്കുമ്പോൾ സ്വാഭാവികമായ മലയാള ക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: ὅτι
  choice: ഉദ്ധരണിചിഹ്നം
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള പ്രസ്താവനയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὄντως
  choice: യഥാർഥമായി
  rationale: ഉയിർപ്പിന്റെ വാസ്തവികത ഉറപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἠγέρθη
  choice: ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ἐγείρω എന്ന ക്രിയയുടെ ഔറിസ്റ്റ് കർമണിരൂപം സംരക്ഷിക്കുകയും സംഭവത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനനാമത്തിന്റെ ഭാരവും മലയാള ബൈബിൾഭാഷയിലെ പരിചിതത്വവും നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: ;
  rationale: ഗ്രീക്കിലെ ഏകോപനബന്ധം മലയാളത്തിൽ രണ്ട് അടുത്ത പ്രസ്താവനകൾ ചേർക്കുന്ന അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὤφθη
  choice: പ്രത്യക്ഷനായിരിക്കുന്നു
  rationale: കർമണരൂപമാണെങ്കിലും പുനരുത്ഥാനദർശനസന്ദർഭത്തിൽ 'പ്രത്യക്ഷനായി' എന്ന അർഥത്തിൽ പ്രയോഗിക്കപ്പെട്ടിരിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ദർശനപ്രയോഗം സ്വീകരിച്ചു.
- source_word: Σίμωνι
  choice: ശിമോന്
  rationale: ദത്തിവിന്റെ അർഥം നിലനിർത്തി വ്യക്തിനാമം മാത്രം പരിഭാഷപ്പെടുത്തി; മൂലത്തിൽ ഇല്ലാത്ത 'പത്രോസ്' ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: പുനരുത്ഥാനക്രിയയുടെ വാച്യം
  choice: ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ἠγέρθη കർമണരൂപമാണ്. ദൈവിക പ്രവർത്തകനെ പാഠം തുറന്നുപറയാതെ വിടുന്ന ഘടനയും തത്ത്വശാസ്ത്രപരമായ സൂക്ഷ്മതയും മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
- issue: κύριος എന്ന സ്ഥാനനാമം
  choice: കർത്താവ്
  alternative: നാഥൻ
  rationale: ഇവിടെ യേശുവിനുള്ള സ്ഥാനനാമമായതിനാൽ അതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം കുറയ്ക്കാതെ പരിചിതമായ മലയാളരൂപം ഉപയോഗിച്ചു.
- issue: ὤφθη എന്ന ദർശനക്രിയ
  choice: പ്രത്യക്ഷനായിരിക്കുന്നു
  alternative: കാണപ്പെട്ടു
  rationale: രൂപപരമായി കർമണമായിട്ടുണ്ടെങ്കിലും പുനരുത്ഥാനപ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളം തെരഞ്ഞെടുത്തു; 'കാണപ്പെട്ടു' മലയാളത്തിൽ അനാവശ്യമായി യാന്ത്രികമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. 'ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു' അല്പം ഔപചാരികമായിരുന്നാലും മൂലത്തിലെ കർമണവാച്യം കൃത്യമായി സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി.
