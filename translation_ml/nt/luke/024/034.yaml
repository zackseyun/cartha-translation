  to: ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു:[a] “കർത്താവ് തീർച്ചയായും ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു; ശിമോന് പ്രത്യക്ഷനായി!”
