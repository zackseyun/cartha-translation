  naturalness: The sentence is clear and suitably narrative in modern standard Malayalam. A minor orthographic/usage adjustment from ‘കല്ലറയിൽനിന്നു’ to the more standard postposition form ‘കല്ലറയിൽനിന്ന്’ improves polish. ‘മറ്റുള്ള എല്ലാവരോടും’ is slightly more idiomatic and explicitly retains the sense of ‘all the rest.’
  terminology: ‘കല്ലറ’ is an appropriate equivalent for μνημεῖον in this context. ‘അറിയിച്ചു’ naturally conveys ἀπήγγειλαν without importing the public-proclamation sense of ‘പ്രഖ്യാപിച്ചു.’ ‘പതിനൊന്നുപേർ’ properly avoids adding ‘apostles.’
