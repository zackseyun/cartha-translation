id: LUK.24.9
reference: Luke 24:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: ml
  text: കല്ലറയിൽനിന്ന് മടങ്ങിവന്ന് അവർ ഈ കാര്യങ്ങളെല്ലാം പതിനൊന്നുപേരോടും മറ്റുള്ള എല്ലാവരോടും അറിയിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: മടങ്ങിവന്ന്
  rationale: സ്ത്രീലിംഗ ബഹുവചനമായ aorist participle മുൻസന്ദർഭത്തിലെ സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു. ‘മടങ്ങിവന്ന്’ പ്രധാനക്രിയയുമായുള്ള ക്രമബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μνημείου
  choice: കല്ലറ
  rationale: യേശുവിനെ അടക്കം ചെയ്ത സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ μνημεῖον എന്നതിന് കൃത്യവും സാധാരണവുമായ മലയാളപദം ‘കല്ലറ’യാണ്.
- source_word: ἀπήγγειλαν
  choice: അറിയിച്ചു
  rationale: ലഭിച്ച വിവരം മറ്റുള്ളവരോട് അറിയിക്കുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായ വിവരണശൈലിയിൽ നൽകുന്നു; ‘പ്രഖ്യാപിച്ചു’ എന്നത് സന്ദർഭത്തേക്കാൾ പൊതുവായ ഔപചാരിക പ്രഖ്യാപനം ധ്വനിപ്പിക്കാം.
- source_word: ταῦτα πάντα
  choice: ഈ കാര്യങ്ങളെല്ലാം
  rationale: ταῦτα എന്ന സൂചനയും πάντα എന്ന സമഗ്രതയും ഒരുമിച്ച് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοῖς ἕνδεκα
  choice: പതിനൊന്നുപേരോട്
  rationale: മൂലപാഠത്തിലെ ‘പതിനൊന്ന്’ എന്ന സംഘനാമം മാത്രം നിലനിർത്തുന്നു; അവിടെ ഇല്ലാത്ത ‘അപ്പൊസ്തലന്മാർ’ എന്ന നാമം ചേർക്കുന്നില്ല.
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: മറ്റെല്ലാവരോടും
  rationale: പതിനൊന്നുപേർക്ക് പുറമേ ഉണ്ടായിരുന്ന ശേഷിച്ച മുഴുവൻ ആളുകളെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: സ്ത്രീലിംഗ ബഹുവചന കർത്താവിന്റെ സൂചന
  choice: മുൻസന്ദർഭത്തിലെ സ്ത്രീകളെ സൂചിപ്പിക്കാൻ ‘അവർ’ ഉപയോഗിച്ചു
  alternative: ‘ആ സ്ത്രീകൾ’ എന്ന് കർത്താവിനെ വ്യക്തമാക്കുക
  rationale: ഗ്രീക്കിലെ participle സ്ത്രീലിംഗ ബഹുവചനമാണെങ്കിലും മലയാളത്തിലെ ‘അവർ’ ലിംഗം പ്രത്യേകം അടയാളപ്പെടുത്തുന്നില്ല. മുൻസന്ദർഭം സൂചന വ്യക്തമാക്കുന്നതിനാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കാതെ സ്വാഭാവികതയും സന്ദർഭബന്ധവും നിലനിർത്തുന്നു.
- issue: അപ്പൊസ്തലസംഘത്തിന്റെ വിശേഷണം
  choice: ‘പതിനൊന്നുപേർ’ എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘പതിനൊന്ന് അപ്പൊസ്തലന്മാർ’
  rationale: മൂലപാഠം τοῖς ἕνδεκα എന്നു മാത്രമാണ് പറയുന്നത്. ‘അപ്പൊസ്തലന്മാർ’ എന്നു വികസിപ്പിക്കുന്നത് അർഥവ്യക്തത നൽകുമെങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്കിലെ participial linkage ‘മടങ്ങിവന്ന്’ എന്ന രൂപത്തിൽ നിലനിർത്തി; അനാവശ്യമായ വിശദീകരണപദങ്ങൾ ചേർത്തിട്ടില്ല.
