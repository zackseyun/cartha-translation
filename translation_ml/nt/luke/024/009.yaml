  revised_text: കല്ലറയിൽനിന്ന് മടങ്ങിവന്ന് അവർ ഈ കാര്യങ്ങളെല്ലാം പതിനൊന്നുപേരോടും മറ്റുള്ള എല്ലാവരോടും അറിയിച്ചു.
