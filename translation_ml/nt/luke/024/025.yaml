    issue: The interjection “ഹാ” is stylistically less suitable for Ὦ.
    rationale: In modern standard Malayalam, “ഹാ” commonly conveys surprise, pain, or lament. “ഓ” more directly marks the Greek-style vocative rebuke.
  - severity: low
    issue: The cultural footnote broadens the referent to what God has said.
    rationale: The verse explicitly refers to what the prophets spoke. The note can explain the idiom without extending beyond the stated referent.
