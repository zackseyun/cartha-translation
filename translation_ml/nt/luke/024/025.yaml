source:
  edition: SBLGNT
  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഓ, വിവേകമില്ലാത്തവരേ[a], പ്രവാചകന്മാർ പറഞ്ഞ സകലവും വിശ്വസിക്കാൻ ഹൃദയത്തിൽ മന്ദരായവരേ[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗ്രഹിക്കാത്തവരേ” അല്ലെങ്കിൽ “ബുദ്ധിയില്ലാത്തവരേ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “ഹൃദയത്തിൽ മന്ദരായവർ”; പ്രവാചകന്മാർ പറഞ്ഞതു ആന്തരികമായി സ്വീകരിക്കാനും വിശ്വസിക്കാനും മടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: Ὦ
  choice: ഹാ
  rationale: നേരിട്ടുള്ള സംബോധനയുടെയും ഗൗരവമുള്ള ശാസനയുടെയും ഭാവം നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: ἀνόητοι
  choice: വിവേകമില്ലാത്തവരേ
  rationale: കേവലം ധാർമിക ദുഷ്ടതയെയല്ല, ഗ്രഹണശേഷിയുടെയും തിരിച്ചറിവിന്റെയും കുറവിനെയാണ് ഇവിടെ പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; ബഹുവചനസംബോധനയും നിലനിർത്തുന്നു.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: ഹൃദയത്തിൽ മന്ദതയുള്ളവരേ
  rationale: καρδία എന്ന ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം ബുദ്ധിയിലേക്കു മാത്രം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ πιστεύειν
  choice: വിശ്വസിക്കാൻ
  rationale: βραδεῖς എന്നതിനോടുള്ള ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: പറഞ്ഞതെല്ലാം
  rationale: πᾶσιν എന്ന സമഗ്രവ്യാപ്തി സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: ἐλάλησαν
  choice: പറഞ്ഞ
  rationale: പ്രവാചകന്മാരുടെ പ്രസ്താവനയെ ലളിതവും സന്ദർഭോചിതവുമായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്ക് aorist-നെ അനാവശ്യമായി കാലവ്യാഖ്യാനത്തിലേക്ക് വികസിപ്പിക്കുന്നില്ല.
- source_word: οἱ προφῆται
  choice: പ്രവാചകന്മാർ
  rationale: പ്രവാചകസാക്ഷ്യത്തെയും അതുമായി ബന്ധപ്പെട്ട തിരുവെഴുത്തുകളെയും സൂചിപ്പിക്കുന്ന സ്ഥിരവും വ്യക്തവുമായ പദം.
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: സ്വാഭാവികമായ മലയാള ആഖ്യാനരൂപം; αὐτός-ന് സന്ദർഭം ആവശ്യപ്പെടാത്ത പ്രത്യേക ഊന്നൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ ശാസനയുടെ സ്വഭാവം
  choice: പ്രവാചകസാക്ഷ്യം ഗ്രഹിക്കുന്നതിലും വിശ്വസിക്കുന്നതിലുമുള്ള കുറവിനെയാണ് ശാസന ലക്ഷ്യമിടുന്നത്.
  alternative: ഇത് കേവലം ബൗദ്ധികമായ തെറ്റിദ്ധാരണയോ കേവലം ധാർമികമായ കുറ്റപ്പെടുത്തലോ ആണെന്ന വായന.
  rationale: ἀνόητοι എന്നതും ‘ഹൃദയത്തിൽ മന്ദത’ എന്നതും ‘വിശ്വസിക്കാൻ’ എന്നതും ചേർന്ന് ഗ്രഹണത്തെയും ആന്തരിക വിശ്വാസത്തെയും ഒരുപോലെ ഉൾക്കൊള്ളുന്നു. അതിനാൽ ‘ഹൃദയം’, ‘വിശ്വസിക്കുക’ എന്നീ ഘടകങ്ങൾ നിലനിർത്തി ഈ പിരിമുറുക്ക് സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഹൃദയത്തിൽ മന്ദത’ എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തി അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
