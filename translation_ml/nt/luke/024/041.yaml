reference: Luke 24:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: ml
  text: അവർ സന്തോഷം നിമിത്തം ഇനിയും വിശ്വസിക്കാതെ വിസ്മയിച്ചുകൊണ്ടിരിക്കുമ്പോൾ[a], അവൻ അവരോട്, “ഇവിടെ തിന്നാൻ എന്തെങ്കിലും നിങ്ങളുടെ പക്കലുണ്ടോ?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവർ സന്തോഷം നിമിത്തം ഇനിയും വിശ്വസിക്കാൻ കഴിയാതെ അത്ഭുതപ്പെട്ടുകൊണ്ടിരിക്കുമ്പോൾ.”'
    reason: സന്ദർഭത്തിലെ അതിയായ സന്തോഷം നിമിത്തമുള്ള താൽക്കാലിക വിശ്വാസപ്രയാസവും θαυμαζόντων-ന്റെ ‘അത്ഭുതപ്പെടുക’ എന്ന പദസാധ്യതയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക വ്യാഖ്യാനപരമായ ബദൽ.
lexical_decisions:
- source_word: ἔτι δὲ
  choice: ഇനിയും ... കൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἔτιയുടെ തുടർച്ചാസൂചന ‘ഇനിയും’ എന്നതിലൂടെ നിലനിർത്തുന്നു; δέയും പങ്കാളിക്രിയാ ഘടനയും മലയാളത്തിൽ സ്വാഭാവികമായ കാലബന്ധവാക്യമായി ചേർത്തിരിക്കുന്നു.
- source_word: ἀπιστούντων
  choice: വിശ്വസിക്കാനാകാതെ
  rationale: സന്ദർഭത്തിലെ താൽക്കാലികവും വിസ്മയജന്യവുമായ അവിശ്വാസാവസ്ഥ വ്യക്തമാക്കുന്നു; ഉറച്ച അവിശ്വാസമെന്ന ധ്വനി ഒഴിവാക്കുമ്പോഴും മൂലത്തിലെ വിശ്വസിക്കാത്ത നില മായ്ക്കുന്നില്ല.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: സന്തോഷം നിമിത്തം
  rationale: ἀπό ഇവിടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു; സന്തോഷം തന്നെയാണ് വിശ്വസിക്കാൻ കഴിയാത്തതിന്റെ കാരണമെന്ന വിരോധാഭാസം വ്യക്തമാക്കുന്നു.
- source_word: θαυμαζόντων
  choice: അത്ഭുതപ്പെട്ടുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: തുടർന്നുകൊണ്ടിരുന്ന വിസ്മയാവസ്ഥയും ἀπιστούντων-നോടുള്ള സമാന്തരബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Ἔχετέ τι βρώσιμον ἐνθάδε
  choice: ഇവിടെ തിന്നാൻ എന്തെങ്കിലും നിങ്ങളുടെ പക്കലുണ്ടോ?
  rationale: βρώσιμον എന്ന ‘ഭക്ഷിക്കാവുന്നത്’ എന്ന ആശയം സ്വാഭാവികമായി ‘തിന്നാൻ എന്തെങ്കിലും’ എന്നും ἐνθάδε ‘ഇവിടെ’ എന്നും പരിഭാഷപ്പെടുത്തുന്നു; Ἔχετε എന്ന കൈവശസൂചന ‘നിങ്ങളുടെ പക്കൽ’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനോടുള്ള ശിഷ്യരുടെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: അതിയായ സന്തോഷവും വിസ്മയവും കാരണം അവർക്ക് യാഥാർഥ്യം ഇനിയും ഉൾക്കൊണ്ട് വിശ്വസിക്കാനാകാത്ത അവസ്ഥ
  alternative: സന്തോഷത്തിന്റെ സൂക്ഷ്മത കൂടാതെ, അവർ ഇനിയും വിശ്വസിച്ചില്ല എന്ന നേരിട്ടുള്ള വിവരണം
  rationale: ἀπιστούντων ... ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων എന്ന ഘടന സന്തോഷം, അവിശ്വാസം, വിസ്മയം എന്നിവ ഒരുമിച്ചുള്ള സങ്കീർണ പ്രതികരണം അവതരിപ്പിക്കുന്നു. പരിഭാഷ അതിനെ കടുത്ത നിരാകരണമായി മാറ്റാതെയും അവിശ്വാസത്തിന്റെ യാഥാർഥ്യം ഇല്ലാതാക്കാതെയും സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തിന്നാൻ’ സാധാരണ വായനക്കാർക്ക് നേരിട്ടും സ്വാഭാവികവുമാണ്; ‘നിങ്ങളുടെ പക്കൽ’ കൈവശസൂചന വ്യക്തമായി നൽകുന്നു.
