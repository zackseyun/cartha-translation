id: LUK.24.51
reference: Luke 24:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: ml
  text: അവൻ അവരെ അനുഗ്രഹിച്ചുകൊണ്ടിരിക്കെ, അവൻ അവരിൽനിന്ന് വേർപിരിഞ്ഞു; അവൻ സ്വർഗത്തിലേക്ക് ഉയർത്തപ്പെടുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അവൻ സ്വർഗത്തിലേക്ക് ഉയർത്തപ്പെടുകയും ചെയ്തു’ എന്ന വാക്കുകൾ ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: ഇത് ലൂക്കോസിന്റെ സാധാരണ ആഖ്യാനസൂത്രമാണ്. മലയാളത്തിൽ ‘സംഭവിച്ചു’ എന്നു പ്രത്യേകം ചേർത്താൽ വാക്യം അസ്വാഭാവികമാകും; സംഭവത്തിന്റെ അവതരണപ്രവർത്തനം വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: ἐν τῷ εὐλογεῖν
  choice: അനുഗ്രഹിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐν സഹിതമുള്ള articular infinitive സമകാലികവും തുടരുന്നതുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അതു വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: εὐλογεῖν
  choice: അനുഗ്രഹിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ‘അനുഗ്രഹിക്കുക’ എന്നത് εὐλογέωയുടെ നേരിട്ടുള്ളതും ഈ സന്ദർഭത്തിന് യോജിച്ചതുമായ ആധുനിക മലയാളരൂപമാണ്.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: അവരിൽനിന്ന് വേർപിരിഞ്ഞു
  rationale: ഇവിടെ ക്രിയ ശാരീരികമായ അകന്നുപോകലിനെയോ വേർപാടിനെയോ സൂചിപ്പിക്കുന്നു. ‘വേർപിരിഞ്ഞു’ മൂലത്തിലെ അർത്ഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἀνεφέρετο
  choice: എടുക്കപ്പെടുകയും ചെയ്തു
  rationale: ക്രിയയുടെ passive രൂപം നിലനിർത്തുകയും പ്രവർത്തകനെ വാചകത്തിൽ നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു. മേലോട്ടുള്ള ദിശ തുടർന്നുള്ള ‘സ്വർഗത്തിലേക്ക്’ എന്ന പ്രയോഗത്തിൽ വ്യക്തമാണ്.
- source_word: εἰς τὸν οὐρανόν
  choice: സ്വർഗത്തിലേക്ക്
  rationale: ഈ സന്ദർഭത്തിൽ οὐρανός വെറും ദൃശ്യമായ ആകാശത്തേക്കാൾ ‘സ്വർഗം’ എന്ന അർത്ഥമാണ് വഹിക്കുന്നത്; εἰς സൂചിപ്പിക്കുന്ന ദിശ ‘-ലേക്ക്’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Bracketed clause καὶ ἀνεφέρετο εἰς τὸν οὐρανόν
  choice: ‘സ്വർഗത്തിലേക്ക് എടുക്കപ്പെടുകയും ചെയ്തു’ എന്ന ഭാഗം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തി, പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
  alternative: ചില കൈയെഴുത്തുപ്രതികളെ പിന്തുടർന്ന് ഈ ഭാഗം ഒഴിവാക്കുക.
  rationale: SBLGNT ഈ വാക്കുകൾ ചതുരക്കുറിക്കുള്ളിൽ നൽകുന്നത് പാഠപരമായ അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്നു. നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിൽ അവ ഉള്ളതിനാൽ മുഖ്യവാചകത്തിൽ പരിഭാഷപ്പെടുത്തി; എന്നാൽ അനിശ്ചിതത്വം മൗനമായി പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അനുഗ്രഹിച്ചുകൊണ്ടിരിക്കുമ്പോൾ’ സമകാലികമായ തുടരുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; passive അർത്ഥവും പ്രധാനപ്പെട്ട പാഠഭേദവും സംരക്ഷിച്ചിട്ടുണ്ട്.
