  to: അവൻ അവരെ അനുഗ്രഹിച്ചുകൊണ്ടിരിക്കെ, അവൻ അവരിൽനിന്ന് വേർപിരിഞ്ഞു; അവൻ സ്വർഗത്തിലേക്ക് ഉയർത്തപ്പെടുകയും ചെയ്തു.[a]
