    rationale: Although ‘സ്വർഗത്തിലേക്ക്’ supplies the destination, the compound verb itself includes an upward sense. ‘ഉയർത്തപ്പെടുകയും ചെയ്തു’ communicates this more transparently without adding an agent.
  - severity: low
