id: LUK.24.23
reference: Luke 24:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: ml
  text: അവന്റെ ശരീരം കണ്ടെത്താനാകാതെ, ദൂതന്മാരുടെ ഒരു ദർശനംകൂടി കണ്ടുവെന്നും, അവൻ ജീവനോടിരിക്കുന്നുവെന്ന് ആ ദൂതന്മാർ പറയുന്നുവെന്നും പറഞ്ഞ് അവർ വന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കുറവ് സാധ്യതയുള്ള മറ്റൊരു വാക്യബന്ധം: അവസാനത്തെ “പറയുന്നുവെന്ന്” എന്നതിലെ സൂചിതർ ദൂതന്മാരല്ല, സ്ത്രീകളാണെന്ന് എടുക്കാം: “...അവൻ ജീവനോടിരിക്കുന്നുവെന്ന് അവർ പറയുന്നുവെന്നും.”'
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ: “ദൂതന്മാരുടെ ഒരു ദർശനംപോലും കണ്ടുവെന്ന്.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: കാണാതായപ്പോൾ
  rationale: സ്ത്രീകളെ വിശേഷിപ്പിക്കുന്ന ഭൂതകാല ക്രിയാവിശേഷണരൂപത്തെ സ്വാഭാവിക മലയാളത്തിൽ കാലസൂചക ഉപവാക്യമായി നൽകി; μήയുടെ നിഷേധവും നിലനിർത്തുന്നു.
- source_word: τὸ σῶμα αὐτοῦ
  choice: അവന്റെ ശരീരം
  rationale: ശവസംസ്കാരത്തിന്റെയും ഉയിർപ്പിന്റെയും സന്ദർഭത്തിൽ σῶμα എന്നതിന്റെ സാധാരണവും നേരിട്ടുള്ളതുമായ അർഥം.
- source_word: ἦλθον λέγουσαι
  choice: പറഞ്ഞുകൊണ്ട് അവർ വന്നു
  rationale: ἦλθον എന്നതിനെ സന്ദർഭം കണക്കിലെടുത്ത് ‘മടങ്ങിവന്നു’ എന്നു വികസിപ്പിക്കാതെ ‘വന്നു’ എന്നുതന്നെ നൽകി; λέγουσαιയുടെ അനുബന്ധ പ്രവർത്തി സ്വാഭാവികമായി ചേർത്തു.
- source_word: καὶ
  choice: കൂടി
  rationale: ശരീരം കാണാനില്ലെന്നതിനു പുറമേ ദർശനവും ഉണ്ടായെന്ന വർധനാത്മക ഭാവം മലയാളത്തിലെ ‘കൂടി’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὀπτασίαν ἀγγέλων
  choice: ദൂതന്മാരുടെ ഒരു ദർശനം
  rationale: അസാധാരണമായ കാഴ്ച/ദർശനം എന്ന അർഥം സംരക്ഷിക്കുമ്പോൾ അനാവശ്യ വിശദീകരണം ചേർക്കാത്ത സ്വാഭാവിക പ്രയോഗം.
- source_word: ἑωρακέναι
  choice: കണ്ടെന്നും
  rationale: λέγουσαιയ്ക്കു കീഴിലുള്ള പരോക്ഷവചനത്തിലെ പൂർണക്രിയയെ മലയാളത്തിൽ റിപ്പോർട്ട് ചെയ്ത ഉള്ളടക്കമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: οἳ λέγουσιν
  choice: അവർ പറയുന്നെന്നും
  rationale: പുരുഷലിംഗ ബഹുവചനമായ οἳയുടെ ഏറ്റവും അടുത്ത സ്വാഭാവിക പൂർവപദം ‘ദൂതന്മാർ’ ആണ്; വർത്തമാനകാലഭാവം ‘പറയുന്നു’ എന്ന അർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτὸν ζῆν
  choice: അവൻ ജീവനോടിരിക്കുന്നുവെന്ന്
  rationale: അവൻ ജീവിച്ചിരിക്കുന്നു എന്ന അവകാശവാദം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: οἳ λέγουσιν എന്ന ആപേക്ഷിക ഉപവാക്യത്തിന്റെ സൂചിതർ
  choice: ‘അവർ’ എന്നത് ദൂതന്മാരെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘അവർ’ സ്ത്രീകളെ സൂചിപ്പിക്കുന്നതായി എടുത്ത്, സ്ത്രീകൾ തന്നെയാണ് അവൻ ജീവനോടിരിക്കുന്നുവെന്ന് പറയുന്നതായി വായിക്കാം.
  rationale: പുരുഷലിംഗ ബഹുവചനമായ οἳയ്ക്ക് ഏറ്റവും അടുത്തതും വ്യാകരണപരമായി സ്വാഭാവികവുമായ പൂർവപദം ἀγγέλων ആണ്. എങ്കിലും വാക്യഘടനയിലെ കുറവ് സാധ്യതയുള്ള മറ്റൊരു ബന്ധം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘മാലാഖമാർ’ എന്നതിനു പകരം കൂടുതൽ വിപുലമായി ഗ്രഹിക്കാവുന്ന ‘ദൂതന്മാർ’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ‘വന്നു’ നിലനിർത്തി; സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാവുന്ന ‘മടങ്ങിവന്നു’ എന്നു വ്യക്തമാക്കിയില്ല. പ്രധാനവാചകത്തിലെ ‘അവർ’ ദൂതന്മാരെയാണെന്ന് വായിക്കാനായി വാക്യക്രമം ക്രമപ്പെടുത്തി; യഥാർഥമായ ചെറിയ ഘടനാസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
