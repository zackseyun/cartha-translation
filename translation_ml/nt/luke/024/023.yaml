revisions:
- from: അവന്റെ ശരീരം കാണാതായപ്പോൾ[a], ദൂതന്മാരുടെ ഒരു ദർശനംകൂടി കണ്ടെന്നും, അവൻ ജീവനോടിരിക്കുന്നുവെന്ന് അവർ പറയുന്നെന്നും പറഞ്ഞുകൊണ്ട് അവർ വന്നു.[b]
  to: അവന്റെ ശരീരം കണ്ടെത്താനാകാതെ, ദൂതന്മാരുടെ ഒരു ദർശനംകൂടി കണ്ടുവെന്നും, അവൻ ജീവനോടിരിക്കുന്നുവെന്ന് ആ ദൂതന്മാർ പറയുന്നുവെന്നും പറഞ്ഞ് അവർ വന്നു.[a][b]
