  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: ml
  text: അവർ ആ മണിക്കൂറിൽത്തന്നെ എഴുന്നേറ്റ് യെരൂശലേമിലേക്കു മടങ്ങി. അവിടെ പതിനൊന്നുപേരും അവരോടൊപ്പമുള്ളവരും ഒരുമിച്ചുകൂടിയിരിക്കുന്നതായി അവർ കണ്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: എഴുന്നേറ്റ്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ശാരീരിക പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന aorist participle; മലയാളത്തിൽ തുടർപ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: ആ നാഴികയിൽത്തന്നെ
  rationale: നിർദ്ദിഷ്ട സമയത്തെയും ഊന്നലോടുകൂടിയ ഉടൻപ്രവർത്തനത്തെയും നിലനിർത്തുന്നു; ‘ഉടനെ’ എന്നതിനെക്കാൾ മൂലവാക്യത്തിന്റെ സമയസൂചന വ്യക്തമാണ്.
- source_word: ὑπέστρεψαν
  choice: മടങ്ങി
  rationale: യാത്രാസന്ദർഭത്തിൽ മുൻസ്ഥലത്തേക്കുള്ള തിരിച്ചുപോക്കിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: Ἰερουσαλήμ
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം.
- source_word: εὗρον
  choice: കണ്ടു
  rationale: ഈ സന്ദർഭത്തിലെ εὑρίσκω എന്നതിന്റെ കണ്ടെത്തുക/കാണുക എന്ന സാധാരണ കഥനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἠθροισμένους
  choice: ഒരുമിച്ചുകൂടിയിരിക്കുന്നതായി
  rationale: perfect passive participle സൂചിപ്പിക്കുന്ന, മുമ്പേ കൂടിച്ചേർന്ന് ആ നിലയിൽ ഉണ്ടായിരുന്ന ഫലാവസ്ഥ നിലനിർത്തുന്നു.
- source_word: τοὺς ἕνδεκα
  choice: പതിനൊന്നുപേർ
  rationale: ഗ്രീക്കിലെ സംഘനാമം നേരിട്ട് നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘അപ്പൊസ്തലന്മാർ’ ചേർക്കുന്നില്ല.
- source_word: τοὺς σὺν αὐτοῖς
  choice: അവരോടൊപ്പമുള്ളവർ
  rationale: പതിനൊന്നുപേരോടൊപ്പം ഉണ്ടായിരുന്ന മറ്റുള്ളവരെ അധിക വ്യാഖ്യാനമില്ലാതെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യൂദാസിന്റെ അഭാവവും തോമാസ് അപ്പോൾ ഉണ്ടായിരുന്നോ എന്ന ചോദ്യവും നിലനിൽക്കുമ്പോൾ ‘പതിനൊന്നുപേർ’ എന്ന പരാമർശം
  choice: സംഘത്തെ സൂചിപ്പിക്കുന്ന ‘പതിനൊന്നുപേർ’ എന്ന പേര് അതേപടി നിലനിർത്തി.
  alternative: പതിനൊന്ന് അപ്പൊസ്തലന്മാർ; ശേഷിച്ച ശിഷ്യന്മാർ
  rationale: τοὺς ἕνδεκα എന്നത് പതിവായ സംഘനാമമായി വാചകം ഉപയോഗിക്കുന്നു. കൃത്യമായ ഹാജർനിലയെ സമന്വയിപ്പിക്കാതെയും ‘അപ്പൊസ്തലന്മാർ’ എന്ന് കൂട്ടിച്ചേർക്കാതെയും ലൂക്കോസിന്റെ വാക്കുകൾ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. ‘ഒരുമിച്ചുകൂടിയിരിക്കുന്നതായി’ എന്ന ഘടന പതിനൊന്നുപേരെയും അവരോടൊപ്പമുള്ളവരെയും ഒരുപോലെ വിശേഷിപ്പിക്കുകയും, അവർ കണ്ടെത്തപ്പെടുമ്പോൾ ഇതിനകം കൂടിയ നിലയിലായിരുന്നു എന്ന ഗ്രീക്ക് participle-ന്റെ ഭാവം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
