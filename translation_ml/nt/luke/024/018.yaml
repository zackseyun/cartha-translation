reference: Luke 24:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: ml
  text: 'അവരിൽ ക്ലെയോപ്പാസ് എന്നു പേരുള്ള ഒരാൾ അവനോടു മറുപടി പറഞ്ഞു: “യെരൂശലേമിൽ പരദേശിയായി കഴിയുന്നവരിൽ[a], ഈ ദിവസങ്ങളിൽ അവിടെ സംഭവിച്ച കാര്യങ്ങൾ അറിയാത്തത് നീ മാത്രമാണോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെരൂശലേമിൽ അന്യനായോ താൽക്കാലിക താമസക്കാരനായോ കഴിയുന്ന.” παροικεῖς എന്ന ഗ്രീക്ക് ക്രിയ പരദേശിയായോ താൽക്കാലിക താമസക്കാരനായോ കഴിയുക എന്ന അർഥം വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണത്തിലെ പ്രതികരണത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; δέ-യുടെ മൃദുവായ ആഖ്യാനബന്ധം വാക്യക്രമത്തിൽ തന്നെയുണ്ട്.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: അവരിൽ ക്ലെയോപ്പാസ് എന്നു പേരുള്ള ഒരാൾ
  rationale: εἷς എന്നത് സന്ദർഭത്തിലെ രണ്ടു ശിഷ്യരിൽ ഒരാളെ സൂചിപ്പിക്കുന്നു; ὀνόματι എന്നതിന്റെ അർഥം ‘എന്നു പേരുള്ള’ എന്നാണ്.
- source_word: εἶπεν πρὸς αὐτόν
  choice: അവനോടു ... പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സർവനാമം നിലനിർത്തുകയും യേശുവിന്റെ പേര് വ്യാഖ്യാനമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: Σὺ μόνος
  choice: ഒരേയൊരാൾ നീ മാത്രമാണോ
  rationale: μόνος നൽകുന്ന ശക്തമായ ഏകത്വഭാവം ചോദ്യത്തിന്റെ മലയാള ശൈലിയിൽ വ്യക്തമാക്കുന്നു.
- source_word: παροικεῖς
  choice: പരദേശിയായി താമസിച്ചിട്ടും
  rationale: παροικέω എന്നത് വെറും സന്ദർശനം മാത്രമല്ല, അന്യനോ താൽക്കാലിക താമസക്കാരനോ ആയി കഴിയുന്നതും സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ വിസ്മയഭാവം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ concessive രൂപം ഉപയോഗിച്ചു.
- source_word: οὐκ ἔγνως
  choice: അറിയാത്ത
  rationale: അടുത്തിടെ നടന്ന സംഭവങ്ങളെക്കുറിച്ച് ഇപ്പോഴും അറിവില്ലെന്ന ഫലാവസ്ഥ ചോദ്യത്തിനുള്ളിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: അവിടെ സംഭവിച്ച കാര്യങ്ങൾ
  rationale: αὐτῇ യെ യെരൂശലേമിലേക്കുള്ള സ്ഥലസൂചനയായ ‘അവിടെ’ എന്നു സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: ഈ ദിവസങ്ങളിൽ
  rationale: സമീപകാല ദിവസങ്ങളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കാലപ്രയോഗം അടുത്തായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പരദേശിയായി താമസിക്കുക’ എന്ന പ്രയോഗം മൂലപദത്തിന്റെ outsider/temporary-resident സൂചന സംരക്ഷിക്കുന്നു; ‘ക്ലെയോപ്പാസ്’, ‘യെരൂശലേം’ എന്നീ രൂപങ്ങൾ മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ നാമരൂപങ്ങളാണ്.
