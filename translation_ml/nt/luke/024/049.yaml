review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the main clauses and preserves both the unspecified ‘promise of my Father’ and the clothing metaphor for δύναμις. However, ‘നഗരത്തിൽത്തന്നെ’ adds an emphatic ‘right there/itself’ not expressed by ἐν τῇ πόλει. Reordering the final clause also makes clear that the power—not merely an implied object—is what is ‘put on.’
  naturalness: The register is clear and suitably dignified in modern standard Malayalam. ‘താമസിക്കുവിൻ’ naturally conveys the contextual force of καθίσατε (‘remain/stay’). The revised word order is more immediately intelligible while retaining the Greek metaphor.
  terminology: ‘വാഗ്ദാനം,’ ‘പിതാവ്,’ and ‘ശക്തി’ are accurate, neutral, and theologically nonsectarian. ‘ഉയരത്തിൽനിന്നുള്ള’ appropriately retains the source’s spatial/heavenly idiom without adding an interpretation.
  issues:
  - severity: low
    issue: Unwarranted emphasis in ‘നഗരത്തിൽത്തന്നെ’
    rationale: The Greek says ‘in the city’ (ἐν τῇ πόλει), without the additional emphatic sense conveyed by -ത്തന്നെ. Removing it better preserves source scope.
  - severity: low
    issue: Final-clause word order can momentarily obscure the object of ‘ധരിക്കുന്നതുവരെ’
    rationale: Placing ‘ഉയരത്തിൽനിന്നുള്ള ശക്തി’ before the verb more transparently carries over the Greek image of being clothed with power.
  revised_text: ഇതാ, എന്റെ പിതാവിന്റെ വാഗ്ദാനം ഞാൻ നിങ്ങളുടെമേൽ അയയ്ക്കുന്നു. എന്നാൽ ഉയരത്തിൽനിന്നുള്ള ശക്തി ധരിക്കുന്നതുവരെ നിങ്ങൾ നഗരത്തിൽ താമസിക്കുവിൻ.
