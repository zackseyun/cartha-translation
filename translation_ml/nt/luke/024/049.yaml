id: LUK.24.49
reference: Luke 24:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: ml
  text: ഇതാ, എന്റെ പിതാവിന്റെ വാഗ്ദാനം ഞാൻ നിങ്ങളുടെമേൽ അയയ്ക്കുന്നു. എന്നാൽ ഉയരത്തിൽനിന്നുള്ള ശക്തി ധരിക്കുന്നതുവരെ നിങ്ങൾ നഗരത്തിൽ താമസിക്കുവിൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξαποστέλλω
  choice: അയയ്ക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും ഉടൻ നടപ്പാകുന്ന ദൈവിക നടപടിയുടെ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: എന്റെ പിതാവിന്റെ വാഗ്ദാനം
  rationale: വാഗ്ദത്തം ചെയ്യപ്പെട്ട കാര്യം എന്താണെന്ന് ഈ വാക്യത്തിൽ വിശദീകരിക്കാതെ മൂലപാഠത്തിലെ പരാമർശരൂപം അതേപടി നിലനിർത്തുന്നു.
- source_word: ἐφ’ ὑμᾶς
  choice: നിങ്ങളുടെമേൽ
  rationale: ἐπί എന്നതിന്റെ ദിശാത്മക രൂപകം സംരക്ഷിക്കുകയും തുടർന്നുള്ള 'ശക്തി ധരിക്കുക' എന്ന രൂപകവുമായി ചേർന്ന് നിൽക്കുകയും ചെയ്യുന്നു.
- source_word: καθίσατε ἐν τῇ πόλει
  choice: നഗരത്തിൽത്തന്നെ താമസിക്കുവിൻ
  rationale: അക്ഷരാർഥമായ 'ഇരിക്കുവിൻ' എന്നതിലുപരി ഇവിടെ ഉദ്ദേശിക്കുന്ന 'നഗരത്തിൽ തുടരുക' എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; 'ത്തന്നെ' പ്രതീക്ഷയോടെയുള്ള അവിടെത്താമസത്തെ ഊന്നുന്നു.
- source_word: ἐνδύσησθε
  choice: ധരിക്കുന്നതുവരെ
  rationale: ശക്തിയെ വസ്ത്രംപോലെ ധരിക്കുന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐξ ὕψους δύναμιν
  choice: ഉയരത്തിൽനിന്നുള്ള ശക്തി
  rationale: ദൈവിക ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലരൂപകവും 'ശക്തി' എന്ന പ്രധാന പദവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘പിതാവിന്റെ വാഗ്ദാനം’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: വാഗ്ദാനം എന്ന പരാമർശം വിശദീകരിക്കാതെ നിലനിർത്തി
  alternative: പരിശുദ്ധാത്മാവ് എന്നു വ്യക്തമായി ചേർക്കുക
  rationale: സമീപസന്ദർഭം പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിച്ചാലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം അതിനെ നേരിട്ട് പേരെടുത്ത് പറയുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർത്തില്ല.
- issue: ‘ശക്തി ധരിക്കുക’ എന്ന രൂപകം
  choice: രൂപകം നിലനിർത്തി
  alternative: ശക്തി ലഭിക്കുക / ശക്തിയാൽ നിറയുക
  rationale: ἐνδύσησθε എന്ന വസ്ത്രധാരണരൂപകം ദൈവിക ശക്തിയാൽ ആവൃതരാകുന്നതിന്റെ സവിശേഷ ഭാവം നൽകുന്നു; അതിനെ സാധാരണ പ്രാപ്തിവാചകമായി മാറ്റിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. യേശുവിന്റെ ബഹുവചന കല്പനയ്ക്ക് ‘താമസിക്കുവിൻ’ എന്ന മാന്യമായ വേദപാരായണയോഗ്യ രൂപം ഉപയോഗിച്ചു; അപൂർവമായ പഴഞ്ചൊല്ലുകളോ സഭാവിഭാഗ-വിശിഷ്ട പദപ്രയോഗങ്ങളോ ഒഴിവാക്കി.
