    rationale: In Malayalam, placing ‘യെരൂശലേമിൽനിന്ന് ആരംഭിച്ച്’ after the passive main verb makes its relation slightly less smooth. Fronting it preserves the source’s starting-point sense and improves readability.
  - severity: low
    issue: Directional expression for εἰς πάντα τὰ ἔθνη
    rationale: ‘എല്ലാ ജനതകളോടും’ can mean ‘to all nations,’ but ‘എല്ലാ ജനതകളിലേക്കും’ is more idiomatic for the geographical/communal spread of a proclamation and retains the directional force of εἰς.
