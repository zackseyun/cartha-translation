reference: Luke 24:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: ml
  text: യെരൂശലേമിൽനിന്ന് ആരംഭിച്ച്, പാപമോചനത്തിനായുള്ള മനംതിരിയൽ[a] അവന്റെ നാമത്തിൽ എല്ലാ ജനതകളിലേക്കും[b] പ്രഘോഷിക്കപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മനംതിരിയലും പാപമോചനവും.” പ്രഘോഷിക്കപ്പെടുന്ന സന്ദേശത്തിലെ സമന്വിതമായ രണ്ട് ഘടകങ്ങളായി ഗ്രീക്ക് വാക്യം വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, “എല്ലാ യഹൂദേതരരിലേക്കും.” ‘ജനതകൾ’ എന്ന ഗ്രീക്ക് പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘യഹൂദേതരർ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: പ്രഘോഷിക്കപ്പെടണം
  rationale: പൊതുവായി അധികാരത്തോടെ അറിയിക്കുക എന്ന ക്രിയയുടെ അർഥവും ഗ്രീക്കിലെ കർമണിപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: അവന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ വ്യക്തിയെയും അധികാരത്തെയും അടിസ്ഥാനമാക്കിയുള്ള പ്രഘോഷണം എന്ന പ്രയോഗാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μετάνοιαν
  choice: മനംതിരിയൽ
  rationale: വെറും ഖേദത്തേക്കാൾ വിശാലമായി മനസ്സിന്റെയും ജീവിതദിശയുടെയും തിരിഞ്ഞുവരവിനെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദപ്രയോഗം.
- source_word: καὶ ἄφεσιν ἁμαρτιῶν
  choice: പാപമോചനത്തിനായുള്ള
  rationale: ἄφεσις ഇവിടെ പാപങ്ങളിൽനിന്നുള്ള വിടുതൽ അഥവാ ക്ഷമയെ സൂചിപ്പിക്കുന്നു; മുഖ്യവാചകം മനംതിരിയലും പാപമോചനവും തമ്മിലുള്ള അടുത്ത ബന്ധം പ്രകടമാക്കുന്നു, എന്നാൽ സമന്വയവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: എല്ലാ ജനതകളോടും
  rationale: ലോകവ്യാപകമായ ലക്ഷ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ἔθνη എന്ന പദത്തിന്റെ ‘ജനതകൾ’ എന്ന രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: യെരൂശലേമിൽനിന്ന് ആരംഭിച്ച്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ആരംഭസ്ഥാനവും മൂലപാഠത്തിലെ സംക്ഷിപ്ത കൃദന്തരൂപവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രഘോഷിക്കപ്പെടുന്ന സന്ദേശത്തിൽ മനംതിരിയലും പാപമോചനവും തമ്മിലുള്ള ബന്ധം
  choice: പാപമോചനത്തിനായുള്ള മനംതിരിയൽ
  alternative: മനംതിരിയലും പാപമോചനവും
  rationale: ഗ്രീക്ക് വാക്യഘടന രണ്ടിനെയും അടുത്ത് ബന്ധിപ്പിക്കാൻ അനുവദിക്കുന്നു; അതേ സമയം അവയെ പ്രഘോഷണത്തിലെ രണ്ട് സമന്വിത ഘടകങ്ങളായി വായിക്കാനും കഴിയും. മുഖ്യവാചകം ബന്ധം പ്രകടമാക്കുന്നു; അടിക്കുറിപ്പ് യഥാർഥമായ വ്യാകരണസന്ദിഗ്ധത സംരക്ഷിക്കുന്നു.
- issue: ἔθνη എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: എല്ലാ ജനതകളും
  alternative: എല്ലാ യഹൂദേതരരും
  rationale: ഉയിർപ്പിനുശേഷമുള്ള ഈ ദൗത്യത്തിന്റെ ലോകവ്യാപകത ‘ജനതകൾ’ നന്നായി സംരക്ഷിക്കുന്നു; ചില സന്ദർഭങ്ങളിൽ സാധ്യമായ ‘യഹൂദേതരർ’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘മാനസാന്തരം’ എന്ന സഭാപരമായ പദത്തിന് പകരം അർഥസുതാര്യമായ ‘മനംതിരിയൽ’ തിരഞ്ഞെടുത്തു. മൂലത്തിലെ കർമണിപ്രയോഗവും അവസാനത്തെ സംക്ഷിപ്തമായ ‘ആരംഭിച്ച്’ എന്ന ഘടനയും നിലനിർത്തി.
