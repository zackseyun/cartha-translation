source:
  edition: SBLGNT
  text: καὶ ἦσαν διὰ παντὸς ἐν τῷ ἱερῷ ⸀εὐλογοῦντες τὸν ⸀θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: ml
  text: അവർ നിരന്തരം ദൈവാലയത്തിൽ ദൈവത്തെ വാഴ്ത്തിക്കൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്തെ സ്തുതിച്ചുകൊണ്ടിരുന്നു.” ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം “വാഴ്ത്തുക” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അവർ…
  rationale: മുൻവാക്യത്തോടുള്ള ലളിതമായ ആഖ്യാനബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; വേറിട്ട് ‘കൂടാതെ’ എന്നു ചേർക്കുന്നത് ഇവിടെ അനാവശ്യമാണ്.
- source_word: ἦσαν διὰ παντός
  choice: നിരന്തരം…വാഴ്ത്തിക്കൊണ്ടിരുന്നു
  rationale: διὰ παντός സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പതിവും ἦσαν എന്ന അപൂർണ്ണഭൂതകാലത്തിന്റെ ദൈർഘ്യഭാവവും ചേർത്ത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, ദൈവാലയസമുച്ചയത്തെയും സൂചിപ്പിക്കാം. ‘ദൈവാലയത്തിൽ’ ഈ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: εὐλογοῦντες
  choice: വാഴ്ത്തിക്കൊണ്ടിരുന്നു
  rationale: ദൈവത്തെ സംബന്ധിക്കുമ്പോൾ εὐλογέω എന്നതിന്റെ ‘അനുഗ്രഹിക്കുക/നന്മ പറയുക’ എന്ന മൂലഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നത് ‘വാഴ്ത്തുക’ ആണ്; ‘സ്തുതിക്കുക’ സാധുവായ മറ്റൊരു സാധ്യതയാണ്.
- source_word: τὸν θεόν
  choice: ദൈവത്തെ
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള കർമത്തെ ലളിതമായും കൃത്യമായും പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: εὐλογοῦντες τὸν θεόν എന്ന ആരാധനാഭാഷയുടെ പരിഭാഷ
  choice: ദൈവത്തെ വാഴ്ത്തിക്കൊണ്ടിരുന്നു
  alternative: ദൈവത്തെ സ്തുതിച്ചുകൊണ്ടിരുന്നു
  rationale: മൂലപദം αἰνέω അല്ല, εὐλογέω ആണ്. ‘വാഴ്ത്തുക’ പദത്തിന്റെ പ്രത്യേക ഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ ദൈവത്തോടുള്ള ആരാധനാഭാഷയായി സ്വാഭാവികമാകുകയും ചെയ്യുന്നു; ‘സ്തുതിക്കുക’ അർത്ഥപരമായി സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിരന്തരം’ തുടർച്ചയായ പതിവിനെ സൂചിപ്പിക്കുന്നു; ‘ദൈവാലയം’ ἱερόν എന്ന പദത്തിന്റെ സമുച്ചയവ്യാപ്തി തുറന്നുവെക്കുന്നു. അടിക്കുറിപ്പ് സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘വാഴ്ത്തുക’ എന്ന പ്രയോഗത്തിനു ശേഷമാണ് നൽകിയിരിക്കുന്നത്.
