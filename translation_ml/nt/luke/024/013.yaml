id: LUK.24.13
reference: Luke 24:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: ml
  text: ഇതാ, അന്നുതന്നെ അവരിൽ രണ്ടുപേർ യെരൂശലേമിൽനിന്ന് അറുപത് സ്റ്റേഡിയം അകലെയുള്ള എമ്മാവൂസ് എന്നു പേരുള്ള ഒരു ഗ്രാമത്തിലേക്കു പോകുകയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സ്റ്റേഡിയം പുരാതനകാലത്തെ ഒരു ദൂരയളവായിരുന്നു; അറുപത് സ്റ്റേഡിയം ഏകദേശം 11 കിലോമീറ്റർ (7 മൈൽ) ആണ്.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: ഇതാ
  rationale: ലൂക്കോസിന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഖ്യാനസൂചകം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; തുടക്കത്തിലെ καί പ്രത്യേകം ‘ഉം/അപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്താതെ മലയാള ആഖ്യാനപ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: δύο ἐξ αὐτῶν
  choice: അവരിൽ രണ്ടുപേർ
  rationale: ഭാഗസൂചകമായ ഗ്രീക്ക് പ്രയോഗം ആരെന്നു അധികമായി വ്യക്തമാക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: അന്നുതന്നെ
  rationale: ‘അതേ ദിവസം’ എന്ന ആശയത്തിലെ ഊന്നൽ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἦσαν πορευόμενοι
  choice: പോകുകയായിരുന്നു
  rationale: ഭൂതകാലത്തിൽ തുടരുന്ന യാത്രയെ സൂചിപ്പിക്കുന്ന പര്യായ ക്രിയാരൂപത്തിന്റെ ദൈർഘ്യഭാവം നിലനിർത്തുന്നു.
- source_word: εἰς κώμην
  choice: ഒരു ഗ്രാമത്തിലേക്ക്
  rationale: κώμη എന്നത് നഗരമല്ല, ഗ്രാമമാണെന്ന അർത്ഥം കൃത്യമായി നൽകുന്നു.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: യെരൂശലേമിൽനിന്ന് അറുപത് സ്റ്റേഡിയം അകലെയുള്ള
  rationale: മൂലപാഠത്തിലെ പുരാതന ദൂരയളവ് പ്രധാന വാക്യത്തിൽ നിലനിർത്തുകയും ആധുനിക ഏകദേശം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: എമ്മാവൂസ് എന്നു പേരുള്ള
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പേരുപറയുന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
