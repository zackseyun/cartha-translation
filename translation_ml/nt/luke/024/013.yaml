translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്നത് മൂലത്തിലെ ശ്രദ്ധാകർഷക സൂചകം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ദൂരയളവിനോട് ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
