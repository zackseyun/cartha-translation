  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: ml
  text: അവർ സംസാരിക്കുകയും ചർച്ച ചെയ്യുകയും ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ, യേശു തന്നെ അടുത്തുവന്ന് അവരോടൊപ്പം യാത്രചെയ്തുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അടുത്തുചെന്ന് അവരോടൊപ്പം പോയിക്കൊണ്ടിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: — (മലയാളത്തിൽ പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനപരമായ സംഭവപരിവർത്തനസൂത്രം മലയാളത്തിൽ ‘അപ്പോൾ സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു ചേർത്താൽ വാക്യം ഭാരമുള്ളതാകും; കാലസൂചക ഉപവാക്യവും മുഖ്യസംഭവവും ചേർന്ന ഘടന അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἐν τῷ ὁμιλεῖν αὐτοὺς
  choice: അവർ സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐν + ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് കാലസംബന്ധം സൂചിപ്പിക്കുന്നു; തുടർന്നുകൊണ്ടിരുന്ന സംഭാഷണം മലയാളത്തിലെ ‘-കൊണ്ടിരിക്കുമ്പോൾ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: συζητεῖν
  choice: ചർച്ച ചെയ്യുകയും
  rationale: പരസ്പരമുള്ള ഗൗരവമായ ആശയവിനിമയം നിലനിർത്തുന്നു; ‘തർക്കിക്കുക’ എന്നു പറഞ്ഞ് വൈരഭാവം അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: αὐτὸς Ἰησοῦς
  choice: യേശു തന്നെ
  rationale: αὐτός നൽകുന്ന വ്യക്തിപരമായ ഊന്നൽ ‘തന്നെ’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: ἐγγίσας
  choice: അടുത്തുവന്ന്
  rationale: അവരുടെ സമീപത്തേക്കുള്ള ചലനവും തുടർന്ന് ഒപ്പം നടന്നതുമായ ക്രമബന്ധവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: συνεπορεύετο
  choice: അവരോടൊപ്പം നടന്നുപോന്നു
  rationale: ഇംപെർഫെക്റ്റ് രൂപത്തിലെ തുടർച്ചയായ സഹയാത്രയെ ‘നടന്നുപോന്നു’ വ്യക്തമാക്കുന്നു; സന്ദർഭം കാൽനടയാത്രയാണെന്ന് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: അടുത്തുവന്ന വ്യക്തിയുടെ തിരിച്ചറിയലിനുള്ള ആഖ്യാന ഊന്നൽ
  choice: യേശു തന്നെ
  alternative: യേശു
  rationale: ഉയിർത്തെഴുന്നേറ്റ യേശു നേരിട്ട് അവരുടെ അടുത്തെത്തിയെന്ന വ്യാകരണപരമായ ഊന്നൽ αὐτός-ൽ ഉണ്ട്; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ അത് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സംസാരിക്കുകയും ചർച്ച ചെയ്യുകയും’ എന്ന ഇരട്ടപ്രയോഗം ὁμιλεῖν, συζητεῖν എന്നീ രണ്ടു ക്രിയകളെയും നിലനിർത്തുന്നു. പ്രധാനവാചകത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
