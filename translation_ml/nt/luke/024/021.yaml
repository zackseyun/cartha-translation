source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: ml
  text: എന്നാൽ, ഇസ്രായേലിനെ വീണ്ടെടുക്കാനിരിക്കുന്നവൻ ഇദ്ദേഹമാണ് എന്നായിരുന്നു ഞങ്ങൾ പ്രത്യാശിച്ചിരുന്നത്.[a] എന്നാൽ, ഇതിനെല്ലാം പുറമേ,[b] ഈ കാര്യങ്ങൾ സംഭവിച്ചിട്ട് ഇന്ന് മൂന്നാം ദിവസമായിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേലിനെ വീണ്ടെടുക്കാൻ പോകുന്നവൻ ഇദ്ദേഹമായിരുന്നു.’ അവരുടെ കഴിഞ്ഞകാല പ്രത്യാശയുടെ ഉള്ളടക്കത്തിൽ ഗ്രീക്ക് ‘ആണ്’ എന്ന വർത്തമാനകാലക്രിയ നിലനിർത്തുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘ഇസ്രായേലിനെ വീണ്ടെടുക്കുക’ എന്നത് പ്രതീക്ഷിക്കപ്പെട്ട മിശിഹാപരമായ മോചനത്തെ വിശാലമായി സൂചിപ്പിക്കാം; അത് രാഷ്ട്രീയ വിമോചനമാണോ, ആത്മീയ രക്ഷയാണോ, അതോ രണ്ടും കൂടിയാണോ എന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: എന്നാൽ, … ഞങ്ങൾ
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യവും ἡμεῖς എന്ന കർത്താവിനുള്ള ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἠλπίζομεν
  choice: പ്രത്യാശിച്ചിരുന്നത്
  rationale: ഭൂതകാലത്തിൽ തുടർന്നുനിന്നതും ഇപ്പോൾ നിരാശയിലായതുമായ പ്രതീക്ഷയെ അപൂർണ്ണഭൂതകാലരൂപത്തിന് യോജിച്ചവിധം അറിയിക്കുന്നു.
- source_word: ὅτι αὐτός ἐστιν ὁ μέλλων
  choice: … ആനിരിക്കുന്നവൻ ഇദ്ദേഹമാണ് എന്ന്
  rationale: പഴയ പ്രത്യാശയുടെ ഉള്ളടക്കത്തിൽ ഗ്രീക്ക് നിലനിർത്തുന്ന വർത്തമാനകാലഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു; ‘ഇദ്ദേഹം’ αὐτός-ന്റെ ഊന്നലും നൽകുന്നു.
- source_word: λυτροῦσθαι τὸν Ἰσραήλ
  choice: ഇസ്രായേലിനെ വീണ്ടെടുക്കാൻ
  rationale: λυτρόομαι എന്ന പദത്തിലെ മോചനത്തിന്റെയും വീണ്ടെടുപ്പിന്റെയും ഉടമ്പടിപരവും മിശിഹാപരവുമായ വ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: ഇതിനെല്ലാം പുറമേ
  rationale: മുമ്പ് പറഞ്ഞ കാര്യങ്ങളോടു കൂടെ മറ്റൊരു നിരാശാജനകമായ വസ്തുതയും ചേർക്കുന്ന സഞ്ചിതഭാവം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: ഇന്ന് മൂന്നാം ദിവസവുമാകുന്നു
  rationale: സമയത്തിന്റെ കടന്നുപോക്കിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിലാക്കുന്നു; καί-യുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-വും’ വഴി സൂക്ഷിക്കുന്നു.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: ഈ കാര്യങ്ങൾ സംഭവിച്ചിട്ട്
  rationale: കാലഗണന ആരംഭിക്കുന്ന സംഭവബിന്ദുവിനെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘സംഭവിച്ചിട്ട്’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ഇസ്രായേലിനെ വീണ്ടെടുക്കുക’ എന്ന മിശിഹാപ്രത്യാശയുടെ വ്യാപ്തി
  choice: രാഷ്ട്രീയമോ ആത്മീയമോ എന്നു പരിമിതപ്പെടുത്താതെ ‘ഇസ്രായേലിനെ വീണ്ടെടുക്കാൻ’ എന്ന് നിലനിർത്തി.
  alternative: ഇസ്രായേലിനെ രാഷ്ട്രീയമായി മോചിപ്പിക്കാൻ / ഇസ്രായേലിന് ആത്മീയരക്ഷ നൽകാൻ
  rationale: വാക്യം ദേശീയ വിമോചനം, ആത്മീയ രക്ഷ, അല്ലെങ്കിൽ ഇവ രണ്ടും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ മിശിഹാപ്രത്യാശയാണ് പ്രകടിപ്പിക്കുന്നത്; അതിന്റെ രീതി മൂലപാഠം നിർവചിക്കുന്നില്ല.
- issue: ἠλπίζομεν എന്ന ഭൂതകാലക്രിയയ്ക്കു പിന്നാലെയുള്ള ἐστιν + μέλλων എന്നതിന്റെ കാലഭാവം
  choice: ‘ഇദ്ദേഹമാണ് … ആനിരിക്കുന്നവൻ’ എന്ന വർത്തമാന/ഭാവിദിശയുള്ള രൂപം നിലനിർത്തി.
  alternative: ‘ഇദ്ദേഹമായിരുന്നു … ഇരുന്നത്’ / ‘ഇദ്ദേഹം വീണ്ടെടുക്കുമെന്നായിരുന്നു’
  rationale: ഗ്രീക്ക്, അവരുടെ കഴിഞ്ഞകാല പ്രത്യാശയുടെ ഉള്ളടക്കത്തിനുള്ളിൽ വർത്തമാനകാലമായ ἐστιν നിലനിർത്തുന്നു. മലയാളത്തിലും അത് അസ്വാഭാവികമാകാതെ സംരക്ഷിക്കാം; ചുറ്റുപാട് അവരുടെ നിരാശ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വീണ്ടെടുക്കുക’, ‘പ്രത്യാശ’ എന്നിവയുടെ തിരുവെഴുത്തുസംബന്ധമായ ഗൗരവം നിലനിർത്തിയിട്ടും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചു. ഓരോ അടിക്കുറിപ്പ് ചിഹ്നവും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
