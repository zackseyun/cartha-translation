id: LUK.24.46
reference: Luke 24:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “മിശിഹാ[a] കഷ്ടം അനുഭവിക്കുകയും മൂന്നാം ദിവസം മരിച്ചവരിൽനിന്ന്[b] ഉയിർത്തെഴുന്നേൽക്കുകയും ചെയ്യുമെന്ന് ഇപ്രകാരം എഴുതപ്പെട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.” ഗ്രീക്ക് പദമായ Χριστός ഇവിടെ ഒരു പദവിയായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “മരിച്ചവരുടെ ഇടയിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണകാല കർമണിപ്രയോഗം തിരുവെഴുത്തിൽ എഴുതിയിരിക്കുന്നത് ഇപ്പോഴും പ്രാബല്യത്തിൽ നിലകൊള്ളുന്നു എന്ന ഭാവം നൽകുന്നു; മലയാളത്തിലെ തിരുവെഴുത്ത്-സൂത്രവാക്യമായി ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: παθεῖν
  choice: കഷ്ടം അനുഭവിക്കുകയും
  rationale: ക്രിയാനാമരൂപത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാള ഉള്ളടക്കവാക്യത്തിൽ അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇവിടെ വ്യക്തമല്ലാത്ത ‘വേണം’ എന്ന നിർബന്ധഭാവം ചേർക്കുന്നില്ല.
- source_word: τὸν χριστόν
  choice: മശീഹാ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ Χριστός ഇവിടെ വ്യക്തിനാമംപോലെക്കാൾ പദവിയായി പ്രവർത്തിക്കുന്നു. ‘മശീഹാ’ അഭിഷിക്തനായ രാജാവിനെക്കുറിച്ചുള്ള യഹൂദ-തിരുവെഴുത്തു പശ്ചാത്തലം നിലനിർത്തുന്നു.
- source_word: ἀναστῆναι
  choice: ഉയിർത്തെഴുന്നേൽക്കുകയും
  rationale: ഗ്രീക്ക് രൂപം സജീവക്രിയാനാമമാണ്; അതിനാൽ ‘ഉയിർപ്പിക്കപ്പെടുക’ എന്ന കർമണിരൂപത്തിലേക്കു മാറ്റാതെ സജീവഭാവം സൂക്ഷിക്കുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: മൂന്നാം ദിവസം
  rationale: കാലസൂചകമായ ദത്തിവിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: οὕτως
  choice: ഇപ്രകാരം
  rationale: എഴുതപ്പെട്ടിരിക്കുന്ന കാര്യത്തിന്റെ രീതിയെയും ഉള്ളടക്കത്തെയും ബന്ധിപ്പിക്കുന്ന ഔപചാരിക തിരുവെഴുത്തുഭാവം നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: γέγραπται എന്ന ക്രിയയോടു ചേർന്ന് തുടർന്നുവരുന്ന ഉള്ളടക്കത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവി പീഡാനുഭവ–പുനരുത്ഥാന സംഗ്രഹത്തിൽ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം വ്യക്തിനാമസദൃശമായല്ല, അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന പദവിയായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. ‘മശീഹാ’ ആ തിരുവെഴുത്തുപരവും രാജകീയവുമായ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἀναστῆναι എന്ന പുനരുത്ഥാനക്രിയയുടെ വാച്യം
  choice: ഉയിർത്തെഴുന്നേൽക്കുക
  alternative: ഉയിർപ്പിക്കപ്പെടുക
  rationale: മൂലപാഠത്തിലെ ക്രിയാരൂപം സജീവമാണ്. പുതിയ നിയമത്തിൽ ദൈവം യേശുവിനെ ഉയിർപ്പിച്ചു എന്ന കർമണ ആശയവും കാണുന്നുണ്ടെങ്കിലും, ഈ വാക്യത്തിലെ യഥാർഥ രൂപം മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: പീഡാനുഭവത്തിന്റെയും പുനരുത്ഥാനത്തിന്റെയും അനിവാര്യത
  choice: ഉള്ളടക്കവാക്യമായി അവതരിപ്പിച്ച് ‘വേണം’ ചേർക്കാതിരിക്കുക
  alternative: കഷ്ടം അനുഭവിക്കുകയും ഉയിർത്തെഴുന്നേൽക്കുകയും വേണം
  rationale: ഈ ഉപവാക്യത്തിൽ അനിവാര്യത വ്യക്തമാക്കുന്ന δεῖ ഇല്ല. തിരുവെഴുത്തിൽ എഴുതപ്പെട്ടിരിക്കുന്നു എന്ന സന്ദർഭം ദൈവിക പദ്ധതിയുടെ ഭാവം നൽകുന്നുണ്ടെങ്കിലും, പരിഭാഷയിൽ അധികമായ നിർബന്ധസൂചകം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘എഴുതപ്പെട്ടിരിക്കുന്നു’ എന്ന പ്രയോഗം തിരുവെഴുത്ത്-സൂത്രവാക്യത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നതിനായി ഉള്ളടക്കവാക്യം ‘എന്ന്’ ഉപയോഗിച്ച് ഘടിപ്പിച്ചിരിക്കുന്നു.
