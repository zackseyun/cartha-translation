id: LUK.24.24
reference: Luke 24:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: ml
  text: ഞങ്ങളോടൊപ്പമുണ്ടായിരുന്നവരിൽ ചിലർ കല്ലറയിലേക്കു പോയി; സ്ത്രീകൾ പറഞ്ഞതുപോലെതന്നെയാണെന്ന് അവർ കണ്ടെത്തി, എന്നാൽ അവനെ കണ്ടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: പോയി
  rationale: കല്ലറയിലേക്കുള്ള നീക്കത്തെ ലളിതമായി വിവരിക്കുന്ന ഭൂതകാല ക്രിയ; പുറപ്പെട്ടുപോയി എന്ന ആശയത്തിന് അനാവശ്യ ഊന്നൽ നൽകുന്നില്ല.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: ഞങ്ങളോടൊപ്പമുണ്ടായിരുന്നവരിൽ ചിലർ
  rationale: സംസാരിക്കുന്നവരോടൊപ്പമുള്ള വലിയ കൂട്ടത്തിലെ ചിലരെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: കല്ലറയിലേക്ക്
  rationale: ഈ പുനരുത്ഥാനവിവരണത്തിൽ μνημεῖον യേശുവിനെ സംസ്കരിച്ച കല്ലറയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εὗρον
  choice: കണ്ടു
  rationale: ഇവിടെ കല്ലറയുടെ അവസ്ഥ സ്ത്രീകളുടെ വാക്കുകളോടു പൊരുത്തപ്പെട്ടതായി അവർ കണ്ടറിഞ്ഞുവെന്ന അർഥം; മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കാതെ ലളിതമായ ആഖ്യാനശൈലി നൽകുന്നു.
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: സ്ത്രീകൾ പറഞ്ഞതുപോലെതന്നെ
  rationale: റിപ്പോർട്ടും അവർ കല്ലറയിൽ കണ്ട അവസ്ഥയും തമ്മിലുള്ള പൂർണ പൊരുത്തം വ്യക്തമാക്കുന്നു; καί-യുടെ ചേർക്കൽ/ഊന്നൽ മലയാളത്തിലെ ‘തന്നെ’യിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന സർവനാമം അതേപടി നിലനിർത്തി അനാവശ്യ വിശദീകരണം ഒഴിവാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: കല്ലറയുടെ അവസ്ഥ സ്ഥിരീകരിച്ചതും യേശുവിനെ കാണാതിരുന്നതും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: οὐκ εἶδον
  choice: കണ്ടില്ല
  rationale: ὁράω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; ‘കണ്ടെത്തിയില്ല’ എന്നു മാറ്റുന്നില്ല.
theological_decisions:
- issue: പുനരുത്ഥാനവിവരണത്തിലെ പദപ്രയോഗം
  choice: കല്ലറയുടെ അവസ്ഥയെക്കുറിച്ചുള്ള സ്ത്രീകളുടെ വാക്കുകൾ ചിലർ സ്ഥിരീകരിച്ചെങ്കിലും യേശുവിനെ അവർ കണ്ടില്ല എന്ന് അവതരിപ്പിക്കുന്നു.
  alternative: സമാന്തര സുവിശേഷവിവരണങ്ങളിലെ വിവരങ്ങൾ ചേർത്ത് ആരൊക്കെ പോയി, അവർ കൃത്യമായി എന്തെല്ലാം കണ്ടു എന്നു വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് വാചകത്തിലെ സ്ഥിരീകരണവും യേശുവിനെ കാണാതിരുന്നതും തമ്മിലുള്ള ആഖ്യാനപരമായ വ്യത്യാസം നിലനിർത്തുന്നു; മറ്റു വിവരണങ്ങളുമായി നിശ്ശബ്ദമായി സമന്വയിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കല്ലറ’, ‘ഞങ്ങളോടൊപ്പമുണ്ടായിരുന്നവർ’, ‘എന്നാൽ’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങളാണ്; സഭാവിഭാഗ-വിശേഷ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
