revisions:
- from: ഞങ്ങളോടൊപ്പമുണ്ടായിരുന്നവരിൽ ചിലർ കല്ലറയിലേക്കു പോയി. സ്ത്രീകൾ പറഞ്ഞതുപോലെതന്നെ അവർ കണ്ടു; എന്നാൽ അവനെ കണ്ടില്ല.
  to: ഞങ്ങളോടൊപ്പമുണ്ടായിരുന്നവരിൽ ചിലർ കല്ലറയിലേക്കു പോയി; സ്ത്രീകൾ പറഞ്ഞതുപോലെതന്നെയാണെന്ന് അവർ കണ്ടെത്തി, എന്നാൽ അവനെ കണ്ടില്ല.
  rationale: Changed the middle verb to കണ്ടെത്തി in order to represent εὗρον distinctly from the final കണ്ടില്ല, which represents εἶδον. The complement സ്ത്രീകൾ പറഞ്ഞതുപോലെതന്നെയാണെന്ന് supplies natural Malayalam syntax without specifying beyond the Greek what precisely the visitors found.
