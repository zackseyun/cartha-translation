id: LUK.24.16
reference: Luke 24:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ αὐτῶν ἐκρατοῦντο τοῦ μὴ ἐπιγνῶναι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
translation:
  language: ml
  text: എന്നാൽ, അവരുടെ കണ്ണുകൾ അവനെ തിരിച്ചറിയാതിരിക്കത്തക്കവണ്ണം തടഞ്ഞുവെക്കപ്പെട്ടിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ തിരിച്ചറിയുന്നതിൽനിന്ന് അവരുടെ കണ്ണുകൾ പിടിച്ചുനിർത്തപ്പെട്ടിരുന്നു’ അല്ലെങ്കിൽ ‘അവനെ തിരിച്ചറിയുന്നതിൽനിന്ന് അവരുടെ കണ്ണുകൾ തടയപ്പെട്ടിരുന്നു.’ ഗ്രീക്കിൽ തടഞ്ഞത് ആരാണെന്ന് പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ സമീപനവും ഇവിടെയുള്ള തിരിച്ചറിയാനാകാത്ത അവസ്ഥയും തമ്മിലുള്ള നേരിയ വൈരുധ്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: അവരുടെ കണ്ണുകൾ
  rationale: ഗ്രീക്കിലെ മൂർത്തമായ ശാരീരിക ദൃശ്യബിംബം നിലനിർത്തുന്നു; ‘അവർ’ എന്ന അമൂർത്ത രൂപത്തിലേക്ക് മാറ്റുന്നില്ല.
- source_word: ἐκρατοῦντο
  choice: തടഞ്ഞുവെക്കപ്പെട്ടിരുന്നു
  rationale: പിടിച്ചുനിർത്തുക അഥവാ തടയുക എന്ന അർഥവും കർമണിപ്രയോഗവും നിലനിർത്തുന്നു; പ്രവർത്തകനെ വ്യക്തമാക്കുന്നില്ല.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: തിരിച്ചറിയാതിരിക്കേണ്ടതിന്
  rationale: സന്ദർഭത്തിൽ ἐπιγινώσκω എന്നത് പൊതുവായി അറിയുക എന്നതിലുപരി വ്യക്തിയെ തിരിച്ചറിയുക എന്നാണ്. ഗ്രീക്ക് ഘടനയിലെ ഉദ്ദേശ്യം/ഫലം സംബന്ധിച്ച നേരിയ അനിശ്ചിതത്വം ഈ രൂപം ഒരു പരിധിവരെ തുറന്നുവെക്കുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: സന്ദർഭത്തിലെ യേശുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമരൂപം.
theological_decisions:
- issue: തിരിച്ചറിയുന്നതിൽനിന്ന് ആരാണ് തടഞ്ഞതെന്ന് വ്യക്തമാക്കണമോ
  choice: 'പ്രവർത്തകനെ പറയാത്ത കർമണിപ്രയോഗം നിലനിർത്തുക: ‘അവരുടെ കണ്ണുകൾ തടഞ്ഞുവെക്കപ്പെട്ടിരുന്നു.’'
  alternative: ‘ദൈവം അവരുടെ കണ്ണുകളെ തടഞ്ഞു’ എന്നു ദൈവിക പ്രവർത്തകനെ വ്യക്തമായി ചേർക്കുക; അല്ലെങ്കിൽ ‘അവർക്ക് അവനെ തിരിച്ചറിയാൻ കഴിഞ്ഞില്ല’ എന്നു കർമണിഭാവം ഒഴിവാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം പ്രവർത്തകനെ പറയുന്നില്ല. അതിനാൽ ദൈവിക പ്രവർത്തനം എന്നു വിവർത്തനത്തിൽ തന്നെ നിർണയിക്കാതെയും ബാഹ്യമായ തടസ്സം സൂചിപ്പിക്കുന്ന കർമണിരൂപം നഷ്ടപ്പെടുത്താതെയും മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കണ്ണുകൾ’ എന്ന മൂർത്ത ദൃശ്യബിംബവും പ്രവർത്തകനെ പറയാത്ത കർമണിപ്രയോഗവും സൂക്ഷിച്ചു.
