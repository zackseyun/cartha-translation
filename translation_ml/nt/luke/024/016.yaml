  naturalness: “തടഞ്ഞുവെക്കപ്പെട്ടിരുന്നു” is understandable and suitably passive. Replacing the modal construction with “തിരിച്ചറിയാതിരിക്കത്തക്കവണ്ണം” gives a natural formal Malayalam rendering of the resulting prevention without implying obligation.
  terminology: “കണ്ണുകൾ,” “തിരിച്ചറിയുക,” and the passive “തടഞ്ഞുവെക്കപ്പെട്ടിരുന്നു” appropriately preserve the imagery, identification sense, and theological ambiguity of the Greek. No agent is supplied.
