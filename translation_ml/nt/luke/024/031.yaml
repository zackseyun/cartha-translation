id: LUK.24.31
reference: Luke 24:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: ml
  text: അപ്പോൾ അവരുടെ കണ്ണുകൾ തുറക്കപ്പെട്ടു; അവർ അവനെ തിരിച്ചറിഞ്ഞു. പിന്നെ അവൻ അവർക്ക് അദൃശ്യനായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ അവരുടെ മുമ്പിൽനിന്ന് മറഞ്ഞു” അല്ലെങ്കിൽ “അവൻ അവരുടെ കാഴ്ചയിൽനിന്ന് അപ്രത്യക്ഷനായി.”
    reason: ἄφαντος ἐγένετο ἀπ’ αὐτῶν എന്നതിന് സാധ്യമായ സ്വാഭാവിക പരിഭാഷകൾ രേഖപ്പെടുത്തുന്നു; സംഭവത്തിന്റെ രീതി നിർണയിക്കുന്നില്ല.
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: തുറക്കപ്പെട്ടു
  rationale: διανοίγω എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയരൂപം സംരക്ഷിക്കുന്നു; തിരിച്ചറിയാനുള്ള കഴിവ് അവർ സ്വയം നേടിയതല്ല, അവർക്കായി സാധ്യമാക്കപ്പെട്ടതാണ് എന്ന സൂചന നിലനിർത്തുന്നു.
- source_word: οἱ ὀφθαλμοὶ
  choice: അവരുടെ കണ്ണുകൾ
  rationale: αὐτῶν എന്ന ബന്ധസൂചക സർവനാമത്തോടുകൂടിയ ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐπέγνωσαν
  choice: തിരിച്ചറിഞ്ഞു
  rationale: മുമ്പ് ആരെന്ന് മനസ്സിലാകാതിരുന്ന ഒരാളെ തിരിച്ചറിയുന്നതാണ് എമ്മാവൂസ് പശ്ചാത്തലത്തിലെ അർഥം; 'അറിഞ്ഞു' എന്നതിനെക്കാൾ കൃത്യം.
- source_word: ἄφαντος
  choice: അദൃശ്യനായി
  rationale: ἄφαντος എന്നതിന്റെ 'കാണാനാകാത്ത/കാണപ്പെടാത്ത' അർഥം നേരിട്ട് നൽകുന്നു; സംഭവം എങ്ങനെ സംഭവിച്ചുവെന്ന് അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: അവർക്ക് ... ആയി
  rationale: അവരെ സംബന്ധിച്ചിടത്തോളം അവൻ കാണപ്പെടാതായി എന്ന ἀπόയുടെ ബന്ധപരമായ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ ... καὶ
  choice: അപ്പോൾ ... എന്നാൽ
  rationale: ആദ്യ δέ കഥയുടെ അടുത്ത ഘട്ടം സൂചിപ്പിക്കുന്നതിനാൽ 'അപ്പോൾ' എന്നും, അവസാന καί സംഭവങ്ങളുടെ പെട്ടെന്നുള്ള വൈരുധ്യാത്മക തുടർച്ച മലയാളത്തിൽ വ്യക്തമാക്കാൻ 'എന്നാൽ' എന്നും നൽകി.
theological_decisions:
- issue: യേശുവിനെ കാണാതായ സംഭവത്തിന്റെ സ്വഭാവം
  choice: അവൻ അവർക്ക് അദൃശ്യനായി
  alternative: അവൻ അവരുടെ മുമ്പിൽനിന്ന് മറഞ്ഞു / അവരുടെ കാഴ്ചയിൽനിന്ന് അപ്രത്യക്ഷനായി
  rationale: ἄφαντος ἐγένετο എന്നത് കൂടുതൽ നേരിട്ട് 'അദൃശ്യനായി/കാണപ്പെടാതായി' എന്നു സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ സംഭവത്തിന്റെ രീതി—മറഞ്ഞതോ സ്ഥലം വിട്ടതോ മറ്റേതെങ്കിലും വിധമോ—നിർണയിക്കാതെ ആഖ്യാനത്തിലെ നിഗൂഢത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. നിഷ്ക്രിയരൂപവും തിരിച്ചറിയലിന്റെ ആശയവും മൂലപാഠത്തിനടുത്തായി നിലനിർത്തിയിരിക്കുന്നു; അവസാന സംഭവത്തിന്റെ സ്വഭാവം അമിതമായി വിശദീകരിച്ചിട്ടില്ല.
