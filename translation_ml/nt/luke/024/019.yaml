revisions:
- from: 'അവൻ അവരോട്, “എന്തെല്ലാം കാര്യങ്ങൾ?” എന്നു ചോദിച്ചു. അവർ അവനോട് പറഞ്ഞു: “നസറായനായ യേശുവിനെ[a] സംബന്ധിച്ച കാര്യങ്ങൾതന്നെ. അദ്ദേഹം ഒരു മനുഷ്യൻ, പ്രവൃത്തിയിലും വാക്കിലും ദൈവത്തിന്റെയും സകല ജനത്തിന്റെയും മുമ്പാകെ ശക്തനായ ഒരു പ്രവാചകൻ, ആയിത്തീർന്നു[b].”'
  to: 'അവൻ അവരോട്, “എന്തെല്ലാം കാര്യങ്ങൾ?” എന്നു ചോദിച്ചു. അവർ അവനോട് പറഞ്ഞു: “നസറായനായ യേശുവിനെ[a] സംബന്ധിച്ച കാര്യങ്ങൾ. അദ്ദേഹം പ്രവൃത്തിയിലും വാക്കിലും ദൈവത്തിന്റെയും സകല ജനങ്ങളുടെയും മുമ്പാകെ ശക്തനായ ഒരു പ്രവാചകനായ മനുഷ്യനായിരുന്നു[b].”'
  rationale: The revision removes unsupported emphasis, repairs Malayalam flow, and renders the Greek predicate idiomatically. It deliberately retains both «മനുഷ്യൻ» and «പ്രവാചകൻ», rather than reducing the clause to ‘he was a prophet.’ The footnote preserves the lexical range of γίνομαι without making the main text suggest that Jesus changed into a human being.
