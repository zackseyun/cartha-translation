source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: ml
  text: 'അവൻ അവരോട്, “എന്തെല്ലാം കാര്യങ്ങൾ?” എന്നു ചോദിച്ചു. അവർ അവനോട് പറഞ്ഞു: “നസറായനായ യേശുവിനെ[a] സംബന്ധിച്ച കാര്യങ്ങൾ. അദ്ദേഹം പ്രവൃത്തിയിലും വാക്കിലും ദൈവത്തിന്റെയും സകല ജനങ്ങളുടെയും മുമ്പാകെ ശക്തനായ ഒരു പ്രവാചകനായ മനുഷ്യനായിരുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നസറെത്തിൽനിന്നുള്ള യേശു”; ഗ്രീക്കിൽ അക്ഷരാർഥമായി, “നസറായനായ യേശു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ശക്തനായ ഒരു പ്രവാചകനായ മനുഷ്യനായി”; ഇവിടെ ഗ്രീക്ക് ക്രിയയെ സന്ദർഭാനുസൃതമായി “ആയിരുന്നു” എന്നു പരിഭാഷപ്പെടുത്തുന്നു. അതിന് “ആയി/ആയിത്തീർന്നു” എന്ന അർഥവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: എന്തെല്ലാം കാര്യങ്ങൾ?
  rationale: ബഹുവചനമായ ചോദ്യപദത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: യേശുവിനെ സംബന്ധിച്ച കാര്യങ്ങൾതന്നെ
  rationale: സംഭവങ്ങൾ എന്നു മൂലത്തിൽ ഇല്ലാത്ത ആശയം ചേർക്കാതെ περί പ്രയോഗത്തിന്റെ വിശാലമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: Ναζαρηνοῦ
  choice: നസറായനായ
  rationale: സ്ഥലനാമം മാത്രമാക്കി വ്യാഖ്യാനിക്കാതെ ഗ്രീക്കിലെ വിശേഷണാത്മക അഭിധാനം നിലനിർത്തുന്നു.
- source_word: ἐγένετο
  choice: ആയിത്തീർന്നു
  rationale: സന്ദർഭത്തിൽ ‘ആയിരുന്നു’ എന്നു സ്വാഭാവികമാക്കാവുന്നതാണെങ്കിലും, γίνομαι എന്ന ക്രിയയുടെ ‘ആയിത്തീരുക’ എന്ന ചലനാത്മക ഭാവം മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀνὴρ προφήτης
  choice: ഒരു മനുഷ്യൻ, ... ഒരു പ്രവാചകൻ
  rationale: രണ്ടു നാമങ്ങളുടെയും സമാനാധികരണബന്ധവും ἀνήρ എന്ന പദത്തിന്റെ സാന്നിധ്യവും ഒഴിവാക്കാതെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: പ്രവൃത്തിയിലും വാക്കിലും ... ശക്തനായ
  rationale: പ്രവൃത്തിയും വാക്കും എന്ന ജോടിയും δυνατός എന്ന പദത്തിന്റെ ശക്തി സൂചിപ്പിക്കുന്ന അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: ദൈവത്തിന്റെയും സകല ജനത്തിന്റെയും മുമ്പാകെ
  rationale: ദൈവസന്നിധിയിലും ജനങ്ങളുടെ ദൃഷ്ടിയിലും പ്രകടമായിരുന്നതെന്ന പൊതുസാക്ഷ്യത്തിന്റെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള വിവരണത്തിൽ ἀνήρ നിലനിർത്തൽ
  choice: ഒരു മനുഷ്യൻ, ... ഒരു പ്രവാചകൻ
  alternative: ഒരു പ്രവാചകനായിരുന്നു
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ἀνήρ ഒഴിവാക്കാതെ, ഇത് എമ്മാവൂസിലേക്കു പോയവരുടെ സന്ദർഭപരമായ വിവരണമാണെന്ന നിലയിൽ അതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ സംഘർഷം മായ്ച്ചുകളയുന്നില്ല.
- issue: ἐγένετο എന്ന ക്രിയയുടെ അവതരണം
  choice: ആയിത്തീർന്നു
  alternative: ആയിരുന്നു
  rationale: ‘ആയിരുന്നു’ കൂടുതൽ പതിവായ മലയാളമാണെങ്കിലും, മൂലത്തിലെ γίνομαι എന്ന ക്രിയയുടെ യഥാർഥ ഭാഷാഭാവം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും സ്വാഭാവികമായ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സകല ജനം’, ‘മുമ്പാകെ’ എന്നിവ വാക്യത്തിന്റെ ഉയർന്ന തിരുവെഴുത്തുഭാവം സൂക്ഷിക്കുന്നു; അതേസമയം വാക്യഘടന സംഭാഷണസഹജമാണ്. സമാനാധികരണത്തിലുള്ള ‘ഒരു മനുഷ്യൻ ... ഒരു പ്രവാചകൻ’ എന്ന ഘടന അല്പം അടയാളപ്പെടുത്തിയതാണെങ്കിലും മൂലപാഠത്തിന്റെ ഊന്നലും യഥാർഥ ദ്വയവിവരണവും സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
