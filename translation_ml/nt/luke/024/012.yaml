id: LUK.24.12
reference: Luke 24:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: ml
  text: എന്നാൽ പത്രോസ് എഴുന്നേറ്റ് കല്ലറയിലേക്കു ഓടി; കുനിഞ്ഞ് അകത്തേക്കു നോക്കുമ്പോൾ, ലിനൻ തുണികൾ മാത്രം കിടക്കുന്നതു കാണുന്നു. സംഭവിച്ചതിനെക്കുറിച്ച് ആശ്ചര്യപ്പെട്ടുകൊണ്ട് അവൻ തന്റെ വാസസ്ഥലത്തേക്കു മടങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημεῖον
  choice: കല്ലറ
  rationale: ശവസംസ്കാരസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളപദം.
- source_word: παρακύψας
  choice: കുനിഞ്ഞുനോക്കിയപ്പോൾ
  rationale: കല്ലറയ്ക്കുള്ളിലേക്കു കുനിഞ്ഞ് നോക്കുന്ന പ്രവൃത്തിയെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ ὀθόνια μόνα
  choice: ചണവസ്ത്രങ്ങൾ മാത്രം കിടക്കുന്നതായി
  rationale: ὀθόνια എന്നത് ശവശരീരം പൊതിയാൻ ഉപയോഗിച്ചിരുന്ന ചണവസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്നു; μόνα വസ്ത്രങ്ങൾ മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ എന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: βλέπει
  choice: കാണുന്നു
  rationale: ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലം മലയാളത്തിലും വർത്തമാനരൂപത്തിൽ നിലനിർത്തി, ഗ്രീക്ക് പാഠത്തിലെ കാലമാറ്റം മായ്ച്ചുകളയുന്നില്ല.
- source_word: πρὸς αὑτὸν
  choice: മടങ്ങിപ്പോയി
  rationale: ഈ പ്രയോഗം സന്ദർഭത്തിൽ അവൻ തന്റെ ഇടത്തേക്കോ താമസസ്ഥലത്തേക്കോ മടങ്ങിയെന്നർഥം നൽകാം; അസ്വാഭാവികമായ അക്ഷരാർഥം ഒഴിവാക്കി, ദിശയെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: θαυμάζων
  choice: ആശ്ചര്യപ്പെട്ടുകൊണ്ട്
  rationale: ഇത് വിസ്മയം അല്ലെങ്കിൽ അമ്പരപ്പ് സൂചിപ്പിക്കുന്നു; വിശ്വാസമോ അവിശ്വാസമോ പാഠത്തിൽ ഇല്ലാത്തവിധം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പത്രോസിന്റെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ആശ്ചര്യപ്പെട്ടുകൊണ്ട്
  alternative: വിശ്വസിച്ചുകൊണ്ട്
  rationale: ഗ്രീക്ക് θαυμάζων ആശ്ചര്യത്തെ മാത്രമാണ് വ്യക്തമാക്കുന്നത്; പത്രോസ് അപ്പോൾ വിശ്വസിച്ചു എന്ന നിഗമനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: കല്ലറയിൽ ശേഷിച്ചിരുന്നതിന്റെ വിവരണം
  choice: ചണവസ്ത്രങ്ങൾ മാത്രം
  alternative: യേശുവിന്റെ ശവവസ്ത്രങ്ങൾ മാത്രം
  rationale: മൂലപാഠം യേശുവിന്റെ പേര് ഈ ഘട്ടത്തിൽ ആവർത്തിക്കുന്നില്ല; വ്യക്തതയ്ക്കായി വ്യാഖ്യാനാത്മക ഉടമസ്ഥത ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനമായ βλέπει മാത്രം വർത്തമാനകാലത്തിൽ നിലനിർത്തി; ചുറ്റുമുള്ള ക്രിയകളുടെ ഭൂതകാല ആഖ്യാനക്രമവും സംരക്ഷിച്ചു.
