  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: ml
  text: പിന്നെ അവൻ അവരെ ബേഥാന്യവരെ[a] പുറത്തേക്കു നയിച്ചു; കൈകൾ ഉയർത്തി അവരെ അനുഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ബേഥാന്യയിലേക്ക്” അല്ലെങ്കിൽ “ബേഥാന്യയ്ക്കു സമീപം”; ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ “ബേഥാന്യയുടെ ദിശയിലേക്കു വരെ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: പുറത്തേക്കു നയിച്ചു
  rationale: ἐξάγω എന്ന ക്രിയയുടെ ‘പുറത്തേക്ക് നയിക്കുക/കൊണ്ടുവരുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യേശുവാണ് കർത്താവ്.
- source_word: δὲ
  choice: പിന്നെ
  rationale: വൈരുധ്യത്തേക്കാൾ കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കമാണ് ഇവിടെ δέ സൂചിപ്പിക്കുന്നത്.
- source_word: ἕως πρὸς Βηθανίαν
  choice: ബഥാന്യവരെ
  rationale: യാത്രയുടെ പരിധി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്ക് പ്രയോഗത്തിൽ ബഥാന്യയിലേക്കോ അതിന്റെ സമീപത്തേക്കോ എന്ന സൂക്ഷ്മമായ സാധ്യതയുള്ളതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: Βηθανίαν
  choice: ബഥാന്യ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: ἐπάρας τὰς χεῖρας αὐτοῦ
  choice: കൈകൾ ഉയർത്തി
  rationale: അനുഗ്രഹിക്കുന്നതിന് മുമ്പുള്ളതും അതിനോടൊപ്പമുള്ളതുമായ ദേഹഭാവം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; കൈകളുടെ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: εὐλόγησεν αὐτούς
  choice: അവരെ അനുഗ്രഹിച്ചു
  rationale: εὐλογέωയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; പ്രത്യേകമായ പിൽക്കാല ആരാധനാക്രമമോ പൗരോഹിത്യ വ്യാഖ്യാനമോ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശു ശിഷ്യരെ അനുഗ്രഹിച്ച പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: അവരെ അനുഗ്രഹിച്ചു
  alternative: അവരുടെമേൽ അനുഗ്രഹം ഉച്ചരിച്ചു
  rationale: മൂലപാഠത്തിലെ ലളിതമായ ക്രിയാപ്രയോഗം നിലനിർത്തുകയും അതിനെ വെറും ആശംസയായി ചുരുക്കാതെയും പ്രത്യേക സഭാപരമായ സൂത്രവാക്യമായി വികസിപ്പിക്കാതെയും ചെയ്യുന്നു.
