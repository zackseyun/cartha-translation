base_translation:
  language: en
  yaml_path: translation/nt/luke/024/045.yaml
  text: Then he opened their minds to understand the Scriptures[b][a],
translation:
  language: ml
  text: അപ്പോൾ, തിരുവെഴുത്തുകൾ മനസ്സിലാക്കുന്നതിനായി അവൻ അവരുടെ മനസ്സ് തുറന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ സംഭവക്രമം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: διήνοιξεν
  choice: തുറന്നു
  rationale: διανοίγω എന്ന ക്രിയയുടെ മൂർത്തമായ രൂപകം നിലനിർത്തുന്നു; ‘പ്രാപ്തരാക്കി’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: αὐτῶν τὸν νοῦν
  choice: അവരുടെ മനസ്സ്
  rationale: νοῦς ഗ്രഹണശേഷിയെയും ചിന്താശക്തിയെയും സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ഏകവചനമായ കൂട്ടായ പ്രയോഗം മലയാളത്തിലും സ്വാഭാവികമായി നിലനിർത്താം.
- source_word: τοῦ συνιέναι
  choice: മനസ്സിലാക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാവുന്ന articular infinitive-ന്റെ ചെറിയ അസ്പഷ്ടത സംരക്ഷിക്കുന്ന മലയാളപ്രയോഗമാണിത്.
- source_word: τὰς γραφάς
  choice: തിരുവെഴുത്തുകൾ
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികൾ എന്ന പശ്ചാത്തലത്തിൽ ഇസ്രായേലിന്റെ വിശുദ്ധലിഖിതങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘തിരുവെഴുത്തുകൾ’ എന്നത് മലയാളത്തിലെ സ്ഥാപിതവും വ്യക്തവുമായ പ്രയോഗമാണ്.
theological_decisions:
- issue: തിരുവെഴുത്തുകൾ ഗ്രഹിക്കാൻ യേശു ചെയ്ത പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: ‘അവൻ അവരുടെ മനസ്സ് തുറന്നു’ എന്ന നേരിട്ടുള്ള രൂപകം നിലനിർത്തി.
  alternative: ‘അവരെ മനസ്സിലാക്കാൻ പ്രാപ്തരാക്കി’ അല്ലെങ്കിൽ ‘അവർക്കു തിരുവെഴുത്തുകൾ വിശദീകരിച്ചുകൊടുത്തു.’
  rationale: ഗ്രീക്ക് പാഠം യേശു അവരുടെ മനസ്സ് തുറന്നുവെന്ന് നേരിട്ട് പറയുന്നു. അതിനെ പ്രത്യേകമായ ഒരു പിൽക്കാല സിദ്ധാന്തവിഭാഗമായി വിശദീകരിക്കാതെയും കേവലം പഠിപ്പിക്കൽ മാത്രമായി ചുരുക്കാതെയും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മനസ്സ് തുറന്നു’ എന്ന സ്വാഭാവിക രൂപകം മൂലപാഠത്തിന്റെ ദൃശ്യഭാവവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
