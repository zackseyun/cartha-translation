- from: അപ്പോൾ തിരുവെഴുത്തുകൾ മനസ്സിലാക്കേണ്ടതിന് അവൻ അവരുടെ മനസ്സ് തുറന്നു.[a]
  to: അപ്പോൾ, തിരുവെഴുത്തുകൾ മനസ്സിലാക്കുന്നതിനായി അവൻ അവരുടെ മനസ്സ് തുറന്നു.
