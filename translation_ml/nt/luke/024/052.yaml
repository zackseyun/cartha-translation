lexical_decisions:
- source_word: καὶ
  choice: തുടർന്ന് (പ്രത്യേക പദമായി പ്രകടിപ്പിക്കാതെ വാക്യബന്ധത്തിൽ ഉൾപ്പെടുത്തി)
  rationale: καί ഇവിടെ ലളിതമായ ആഖ്യാനബന്ധമാണ്. മുൻവാക്യത്തോടുള്ള തുടർച്ച മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം തന്നെ വ്യക്തമാക്കുന്നതിനാൽ ‘എന്നിട്ട്’ എന്നു ചേർത്ത് അനാവശ്യമായ കാലക്രമബലം നൽകുന്നില്ല.
- source_word: αὐτοὶ
  choice: അവർ
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന സർവനാമം ‘അവർ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി. ‘അവർതന്നെ’ എന്നത് ഈ സന്ദർഭത്തിൽ അമിതമായ ഊന്നൽ സൃഷ്ടിക്കും.
- source_word: προσκυνήσαντες αὐτόν
  choice: അവനെ ആരാധിച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle മുൻകാല പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു. ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ സംബന്ധിച്ച ഈ സന്ദർഭത്തിൽ προσκυνέω എന്നതിന് ‘ആരാധിക്കുക’ യോജിച്ച മുഖ്യപരിഭാഷയാണ്; ‘സാഷ്ടാംഗം നമസ്കരിക്കുക’ എന്ന ശരീരഭാവത്തിന്റെ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὑπέστρεψαν
  choice: മടങ്ങി
  rationale: തിരികെ പോകുക എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായ ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
- source_word: εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനം മലയാളത്തിൽ ‘-ലേക്ക്’ എന്ന വിഭക്തിയാൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: വലിയ സന്തോഷത്തോടെ
  rationale: χαρά എന്ന നാമവും μεγάλη എന്ന തീവ്രതയും വ്യക്തമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനോടുള്ള προσκυνέωയുടെ പരിഭാഷ
  choice: അവനെ ആരാധിച്ചശേഷം
  alternative: അവന്റെ മുമ്പിൽ സാഷ്ടാംഗം നമസ്കരിച്ചശേഷം / അവനു വണക്കം അർപ്പിച്ചശേഷം
  rationale: ഉയിർത്തെഴുന്നേൽപ്പിനും സ്വർഗാരോഹണത്തിനും ശേഷമുള്ള സന്ദർഭത്തിൽ ‘ആരാധിക്കുക’ എന്നത് ക്രിയയുടെ സാധ്യതയുള്ള ശക്തമായ അർഥം നിലനിർത്തുന്നു. എന്നാൽ ഈ ഗ്രീക്ക് പദത്തിന് വണങ്ങുക, സാഷ്ടാംഗം നമസ്കരിക്കുക എന്നീ അർഥങ്ങളും വരാവുന്നതിനാൽ അവ അടിക്കുറിപ്പിൽ നൽകുന്നു; അങ്ങനെ പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി മറച്ചുവയ്ക്കുന്നില്ല.
- issue: ⸂[προσκυνήσαντες αὐτόν]⸃ എന്ന പാഠഭേദമുള്ള ഭാഗം
  choice: മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി
  alternative: ‘അവനെ ആരാധിച്ചശേഷം’ എന്ന ഭാഗം ഒഴിവാക്കുക
  rationale: നൽകിയ SBLGNT പാഠത്തിൽ ഈ വാക്കുകൾ ഉണ്ടെങ്കിലും ചതുരബ്രാക്കറ്റുകൾ അവയുടെ പാഠസാക്ഷ്യത്തിലെ അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്നു. അതിനാൽ അവ പരിഭാഷയിൽ നിലനിർത്തുകയും ചില കൈയെഴുത്തുപ്രതികളിൽ ഇല്ലെന്നു വായനക്കാരനെ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: 'ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മുഖ്യപാഠത്തിലെ ‘ആരാധിച്ചശേഷം’ എന്നതിന് അനുബന്ധമായ [b] അടിക്കുറിപ്പുകുറി ചേർക്കണം; എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യപാഠത്തിൽ പ്രത്യക്ഷപ്പെടണമെന്ന നിബന്ധന പാലിക്കുന്നതിനുള്ള അന്തിമ മുഖ്യപാഠം: ‘അവർ[a] അവനെ ആരാധിച്ചശേഷം[b] വലിയ സന്തോഷത്തോടെ യെരൂശലേമിലേക്കു മടങ്ങി.’'
