  text: അവർ[a] അവനെ ആരാധിച്ചശേഷം[b] വലിയ സന്തോഷത്തോടെ യെരൂശലേമിലേക്കു മടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അവനെ ആരാധിച്ചശേഷം’ എന്ന വാക്കുകളില്ല.
    reason: textual_variant
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അവന്റെ മുമ്പിൽ വണങ്ങിയശേഷം’ അല്ലെങ്കിൽ ‘അവനു ആദരാഞ്ജലി അർപ്പിച്ചശേഷം.’
