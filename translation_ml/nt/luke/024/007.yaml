  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: ml
  text: “മനുഷ്യപുത്രൻ പാപികളായ മനുഷ്യരുടെ കൈകളിൽ ഏൽപ്പിക്കപ്പെടുകയും[a] ക്രൂശിക്കപ്പെടുകയും മൂന്നാം ദിവസം ഉയിർത്തെഴുന്നേൽക്കുകയും[b] വേണം” എന്നു പറഞ്ഞത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാപികളായ മനുഷ്യരുടെ കൈകളിലേക്കു കൈമാറപ്പെടുകയും ക്രൂശിക്കപ്പെടുകയും മൂന്നാം ദിവസം ഉയിർത്തെഴുന്നേൽക്കുകയും വേണം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എഴുന്നേൽക്കുകയും”; ഗ്രീക്കിൽ ഇത് കർത്തരിരൂപമാണ്; “ഉയിർപ്പിക്കപ്പെടുകയും” എന്ന കർമണിരൂപമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: എന്നു പറഞ്ഞത്
  rationale: മുൻവാക്യത്തിലെ ‘ഓർക്കുക’ എന്ന ആഹ്വാനത്തോട് വർത്തമാന കൃദന്തരൂപത്തെ ബന്ധിപ്പിക്കുന്നു; സ്വതന്ത്രമായ ഒരു പുതിയ വാക്യമാക്കി മാറ്റുന്നില്ല.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിലും ദാനീയേൽപരമായ പശ്ചാത്തലത്തിലും തിരിച്ചറിയപ്പെടുന്ന യേശുവിന്റെ സ്ഥാനനാമം സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι δεῖ
  choice: വേണം
  rationale: വെറും ഭാവിപ്രവചനമല്ല, ദൈവിക പദ്ധതിയിലുള്ള അനിവാര്യതയാണ് δεῖ സൂചിപ്പിക്കുന്നത്.
- source_word: παραδοθῆναι
  choice: ഏല്പിക്കപ്പെടുക
  rationale: പ്രവൃത്തിയുടെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; യൂദാസിന്റെ വഞ്ചനയിൽ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: εἰς χεῖρας
  choice: കൈകളിൽ
  rationale: മറ്റുള്ളവരുടെ അധികാരത്തിന് ഏല്പിക്കപ്പെടുക എന്ന ഉറവിടഭാഷയിലെ ദൃശ്യാത്മക പ്രയോഗം മലയാളത്തിലും സ്വാഭാവികമാണ്.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: പാപികളായ മനുഷ്യർ
  rationale: ἄνθρωποι എന്ന നാമവും ‘പാപികളായ’ എന്ന വിശേഷണവും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മനുഷ്യർ’ സന്ദർഭത്തിലെ വ്യക്തികളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: σταυρωθῆναι
  choice: ക്രൂശിക്കപ്പെടുക
  rationale: ക്രൂശുമരണത്തെ കൃത്യമായും പതിവായും സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗമാണ്.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: മൂന്നാം ദിവസം
  rationale: കാലസൂചന അധിക വിശദീകരണമില്ലാതെ നേരിട്ട് നൽകുന്നു.
- source_word: ἀναστῆναι
  choice: ഉയിർത്തെഴുന്നേൽക്കുക
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിൽ സ്വാഭാവികമായ സകർമ്മകമല്ലാത്ത മലയാളപ്രയോഗം; ഗ്രീക്കിലെ കർത്തരിരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പീഡാനുഭവപ്രവചനത്തിലെ δεῖയുടെ ശക്തി
  choice: ‘വേണം’—ദൈവിക പദ്ധതിയിലുള്ള അനിവാര്യത
  alternative: ‘സംഭവിക്കും’—വെറും ഭാവിപ്രവചനം
  rationale: ലൂക്കോസിൽ δεῖ ദൈവത്തിന്റെ രക്ഷാപദ്ധതി നിറവേറേണ്ട അനിവാര്യതയെ പതിവായി സൂചിപ്പിക്കുന്നു; എന്നാൽ അതിനെ വിശദീകരിച്ച് വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: ἀναστῆναι എന്ന കർത്തരിരൂപം
  choice: ‘ഉയിർത്തെഴുന്നേൽക്കുക’ എന്ന കർത്തരി അർഥം
  alternative: ‘ഉയിർപ്പിക്കപ്പെടുക’ എന്ന കർമണി അർഥം
  rationale: മറ്റിടങ്ങളിലെ കർമണിപുനരുത്ഥാനഭാഷ ദൈവശാസ്ത്രപരമായി യോജിച്ചാലും, ഇവിടെ ഉള്ള ഗ്രീക്ക് രൂപം കർത്തരിയാണ്; ആ വ്യത്യാസം മായ്ച്ചുകളയുന്നില്ല.
- issue: ἀνθρώπων ἁμαρτωλῶν എന്ന പ്രയോഗത്തിലെ ലിംഗവും വ്യക്തിസൂചനയും
  choice: ‘പാപികളായ മനുഷ്യർ’
  alternative: ‘പാപികൾ’
  rationale: ‘മനുഷ്യർ’ എന്ന ഘടകം ഒഴിവാക്കാതെ ഉറവിടവാക്യത്തിന്റെ പൂർണത നിലനിർത്തുന്നു; മലയാളത്തിലെ രൂപം അനാവശ്യമായി ലിംഗനിർണ്ണയം ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിലെ ഓർമപ്പെടുത്തലിനോട് വ്യാകരണപരമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു. സമാന്തരമായ മൂന്ന് ക്രിയകൾക്കും ഒടുവിലെ ‘വേണം’ ബാധകമാകുന്ന വിധത്തിൽ മലയാളവാക്യം ക്രമീകരിച്ചു.
