id: LUK.24.26
reference: Luke 24:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχὶ ταῦτα ἔδει παθεῖν τὸν χριστὸν καὶ εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: ml
  text: മശീഹാ[a] ഈ കാര്യങ്ങൾ അനുഭവിക്കുകയും തന്റെ മഹത്വത്തിലേക്ക് പ്രവേശിക്കുകയും ചെയ്യേണ്ടത് ആവശ്യമായിരുന്നില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തു.’ ഗ്രീക്ക് Χριστός എന്ന സ്ഥാനപ്പേര് ഇവിടെ തിരുവെഴുത്തുനിവൃത്തിയുടെ സന്ദർഭത്തിലുള്ള അർഥം നിലനിർത്താൻ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: ആവശ്യമായിരുന്നില്ലേ?
  rationale: ഉവ്വ് എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് നിഷേധചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ ‘-ഇല്ലേ?’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ταῦτα
  choice: ഈ കഷ്ടങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇവ’/‘ഈ കാര്യങ്ങൾ’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ചർച്ച ചെയ്ത പീഡാനുഭവങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അതിനെ വ്യക്തമാക്കുന്നു.
- source_word: ἔδει
  choice: ചെയ്യേണ്ടത് ആവശ്യമായിരുന്നു
  rationale: ദൈവിക പദ്ധതിയോടും തിരുവെഴുത്തിന്റെ നിവൃത്തിയോടും ബന്ധപ്പെട്ട ആവശ്യകത പ്രകടമാക്കുന്നു; വെറും നിർബന്ധമോ അനിവാര്യ സംഭവമോ ആയി ചുരുക്കുന്നില്ല.
- source_word: παθεῖν
  choice: കഷ്ടങ്ങൾ അനുഭവിക്കുക
  rationale: πάσχω എന്ന ക്രിയയുടെ പീഡാനുഭവാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν χριστὸν
  choice: മശീഹാ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ്; തിരുവെഴുത്തുനിവൃത്തിയുടെ സന്ദർഭത്തിൽ അതിന്റെ മശീഹാത്വാർഥം സംരക്ഷിക്കുന്നു.
- source_word: καὶ
  choice: -ഉം ... -ഉം
  rationale: രണ്ട് അനന്തക്രിയകളെയും ലളിതമായി ഏകോപിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘തുടർന്ന്’ എന്ന ക്രമസൂചന ചേർക്കുന്നില്ല.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: തന്റെ മഹത്വത്തിൽ പ്രവേശിക്കുക
  rationale: εἰς എന്ന പ്രവേശനധാരണയും αὐτοῦ എന്ന സ്വത്വസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: δόξαν
  choice: മഹത്വം
  rationale: δόξα എന്ന പദത്തിന്റെ ബഹുമാനം, തേജസ്സ്, ഉയർത്തപ്പെടൽ എന്നിവ ഉൾക്കൊള്ളുന്ന പതിവ് ദൈവശാസ്ത്രപരമായ മലയാളരൂപമാണ്.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ ഇത് പേരുപോലെ മാത്രമല്ല, ദൈവവാഗ്ദത്ത അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്; ‘മശീഹാ’ തിരുവെഴുത്തുനിവൃത്തിയുടെ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
- issue: ἔδει എന്നതിലെ ആവശ്യകതയുടെ സ്വഭാവം
  choice: ചെയ്യേണ്ടത് ആവശ്യമായിരുന്നു
  alternative: ചെയ്യേണ്ടിവന്നു
  rationale: ലൂക്കോസിന്റെ സന്ദർഭത്തിൽ ദൈവിക പദ്ധതിയുടെയും തിരുവെഴുത്തുനിവൃത്തിയുടെയും ആവശ്യകതയാണ് സൂചിപ്പിക്കുന്നത്; പ്രധാനവാക്യത്തിൽ വിശദീകരണം ചേർക്കാതെ ആ ഭാരം നിലനിർത്തുന്നു.
- issue: αὐτοῦ എന്ന സർവനാമത്തിന്റെ ബന്ധം
  choice: തന്റെ മഹത്വം
  alternative: അവനുവേണ്ടി നിശ്ചയിച്ച മഹത്വം
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ഉടമസ്ഥ/ബന്ധസൂചന നേരിട്ട് സംരക്ഷിക്കുകയും അതിനെ ‘നിശ്ചയിച്ച’ എന്നു വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചോദ്യം. ‘ആവശ്യമായിരുന്നില്ലേ?’ ഉവ്വ് എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാക്യഭാവം നിലനിർത്തുന്നു; ‘തന്റെ മഹത്വത്തിൽ’ മൂലത്തിലെ സർവനാമവും പ്രവേശനരൂപകവും സംരക്ഷിക്കുന്നു.
