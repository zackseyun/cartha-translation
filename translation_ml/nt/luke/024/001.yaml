  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതിരാവിലെ’ ὄρθρου βαθέως എന്നതിന്റെ തീവ്രത സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘കല്ലറയ്ക്കൽ എത്തി’ ലക്ഷ്യസ്ഥാനത്തെത്തിയതിനെ സുതാര്യമായി പറയുന്നു.
