source:
  edition: SBLGNT
  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: ml
  text: എന്നാൽ ആഴ്ചയുടെ ഒന്നാം ദിവസം[a], വളരെ അതിരാവിലെ, അവർ തങ്ങൾ ഒരുക്കിയ സുഗന്ധദ്രവ്യങ്ങളുമായി കല്ലറയിലേക്ക് എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘ശബ്ബത്തുകളിൽ ആദ്യത്തേതിൽ’; ഇത് ആഴ്ചയുടെ ഒന്നാം ദിവസം എന്നർഥമുള്ള ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: എന്നാൽ ആഴ്ചയുടെ ഒന്നാം ദിവസം
  rationale: ഇത് ആഴ്ചയിലെ ഒന്നാം ദിവസത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ സെമിറ്റിക്/കൊയ്നേ പ്രയോഗമാണ്. ഗ്രീക്കിലെ ബഹുവചനരൂപം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നത് മലയാളത്തിൽ ആശയക്കുഴപ്പമുണ്ടാക്കും.
- source_word: ὄρθρου βαθέως
  choice: അതിരാവിലെ
  rationale: വളരെ നേരത്തെയുള്ള പുലർകാലം എന്ന തീവ്രമായ സമയസൂചന സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἐπὶ τὸ μνῆμα
  choice: കല്ലറയ്ക്കൽ
  rationale: ചലനക്രിയയോടൊപ്പം ഇവിടെ ἐπί ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; യേശുവിനെ അടക്കം ചെയ്ത സ്ഥലത്തിന് സ്വാഭാവികമായ മലയാളപദമാണ് ‘കല്ലറ’.
- source_word: ἦλθον
  choice: എത്തി
  rationale: ആഖ്യാനത്തിൽ ലക്ഷ്യസ്ഥാനത്തെത്തിയതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്ക് ഏഓറിസ്റ്റിന്റെ ലളിതമായ സംഭവവിവരണം നിലനിർത്തുന്നു.
- source_word: φέρουσαι
  choice: സുഗന്ധദ്രവ്യങ്ങളുമായി
  rationale: പ്രധാനക്രിയയോടൊപ്പം നടന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായ അനുബന്ധപ്രയോഗമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: തങ്ങൾ ഒരുക്കിയിരുന്ന സുഗന്ധദ്രവ്യങ്ങൾ
  rationale: ἀρώματα സംസ്കാരത്തിനായി ഉപയോഗിച്ച സുഗന്ധവസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; മുൻകൂട്ടി നടത്തിയ ഒരുക്കം ‘ഒരുക്കിയിരുന്നു’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേൽപ്പ് വിവരണത്തിലെ τῇ μιᾷ τῶν σαββάτων എന്ന കാലസൂചകപ്രയോഗം
  choice: ആഴ്ചയുടെ ഒന്നാം ദിവസം
  alternative: ശബ്ബത്തുകളുടെ ഒന്നാമത്തിൽ
  rationale: സാധാരണ പ്രയോഗാർഥം നൽകുന്നു; ഗ്രീക്കിൽ അനിവാര്യമല്ലാത്ത പ്രത്യേക കലണ്ടർക്രമമോ വിഭാഗീയ വ്യാഖ്യാനമോ വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
