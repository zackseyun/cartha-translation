source:
  edition: SBLGNT
  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: ml
  text: മോശയുടെ ഗ്രന്ഥങ്ങളിൽനിന്ന് തുടങ്ങി എല്ലാ പ്രവാചകഗ്രന്ഥങ്ങളിലൂടെയും[a], എല്ലാ തിരുവെഴുത്തുകളിലും തന്നെക്കുറിച്ചുള്ള കാര്യങ്ങൾ അവൻ അവർക്കു വ്യാഖ്യാനിച്ചുകൊടുത്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മോശയുടെ ഗ്രന്ഥങ്ങൾ” എന്നും “എല്ലാ പ്രവാചകഗ്രന്ഥങ്ങൾ” എന്നും പറയുന്നത് മോശയുമായി ബന്ധപ്പെട്ട തിരുവെഴുത്തുകളെയും പ്രവാചകഗ്രന്ഥങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ “വിശദീകരിച്ചുകൊടുത്തു” അല്ലെങ്കിൽ “അർഥം തുറന്നുകാട്ടി.” ഗ്രീക്ക് ക്രിയയ്ക്ക് വിശദമായ വ്യാഖ്യാനം എന്ന ആശയം നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ Μωϋσέως
  choice: മോശയിൽ തുടങ്ങി
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ആരംഭബിന്ദുവും participial linkage-ഉം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πάντων τῶν προφητῶν
  choice: എല്ലാ പ്രവാചകന്മാരിലൂടെയും
  rationale: മോശയിൽ ആരംഭിച്ച് പ്രവാചകഗ്രന്ഥങ്ങളിലൂടെ മുന്നേറുന്ന വ്യാഖ്യാനക്രമം സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു; ഇത് വ്യക്തികളെ മാത്രം ഉദ്ദേശിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: διερμήνευσεν
  choice: വ്യാഖ്യാനിച്ചുകൊടുത്തു
  rationale: ക്രിയയുടെ വിശദമായി അർഥം തുറന്നുകാട്ടുക എന്ന ഭാവവും αὐτοῖς എന്ന പരോക്ഷകർമവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: എല്ലാ തിരുവെഴുത്തുകളിലും
  rationale: γραφήയുടെ വിശുദ്ധഗ്രന്ഥസംബന്ധമായ അർഥവും πάσαις നൽകുന്ന വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: തന്നെക്കുറിച്ചുള്ള കാര്യങ്ങൾ
  rationale: പ്രവചനങ്ങൾ, പ്രതിരൂപങ്ങൾ, പ്രമേയങ്ങൾ എന്നിവയിൽ ഏതെങ്കിലും ഒന്നായി പരിമിതപ്പെടുത്താതെ ഗ്രീക്കിലെ വിശാലവും നിർവചിക്കപ്പെടാത്തതുമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ തിരുവെഴുത്തുവ്യാഖ്യാനത്തിന്റെ വ്യാപ്തി
  choice: തിരുവെഴുത്തുകളിലാകെ തന്നെക്കുറിച്ചുള്ള കാര്യങ്ങൾ യേശു വ്യാഖ്യാനിച്ചു എന്ന വിശാലമായ പ്രസ്താവന നിലനിർത്തി.
  alternative: നേരിട്ടുള്ള മിശിഹാപ്രവചനങ്ങൾ മാത്രം; അല്ലെങ്കിൽ പഴയനിയമത്തിലെ ഓരോ വാക്യവും നേരിട്ട് യേശുവിനെക്കുറിച്ചാണെന്ന സമഗ്ര അവകാശവാദം.
  rationale: മൂലപാഠം ക്രിസ്തുകേന്ദ്രിതമായ വിശാലത സൂചിപ്പിക്കുന്നുവെങ്കിലും ഒരു പ്രത്യേക വ്യാഖ്യാനവിഭാഗത്തിലേക്ക് അതിനെ ചുരുക്കുകയോ ഓരോ ഭാഗത്തെയും കുറിച്ച് സമ്പൂർണമായ അവകാശവാദം ഉന്നയിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘തിരുവെഴുത്തുകൾ’, ‘വ്യാഖ്യാനിച്ചുകൊടുത്തു’ എന്നിവ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതോടൊപ്പം ഗ്രന്ഥപരവും വ്യാഖ്യാനപരവുമായ ഭാവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
