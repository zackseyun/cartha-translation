id: LUK.24.22
reference: Luke 24:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ γυναῖκές τινες ἐξ ἡμῶν ἐξέστησαν ἡμᾶς, γενόμεναι ⸀ὀρθριναὶ ἐπὶ τὸ μνημεῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/022.yaml
  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
translation:
  language: ml
  text: എന്നാൽ, ഞങ്ങളുടെ കൂട്ടത്തിലെ ചില സ്ത്രീകളും ഞങ്ങളെ അമ്പരപ്പിച്ചു[a]; അവർ അതിരാവിലെ കല്ലറയിലേക്കു പോയിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിസ്മയിപ്പിച്ചു” എന്നോ “പരിഭ്രമിപ്പിച്ചു” എന്നോ വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയ ശക്തമായ ആശ്ചര്യമോ മനസ്സിന്റെ പതർച്ചയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “പുലർച്ചെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: എന്നാൽ ... -കയും ചെയ്തു
  rationale: മുൻവാക്യത്തിലെ നിരാശയോടുള്ള വൈരുധ്യവും ഇതിലൂടെ ചേർക്കപ്പെടുന്ന അപ്രതീക്ഷിത വിവരവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γυναῖκές τινες
  choice: ചില സ്ത്രീകൾ
  rationale: അനിശ്ചിത ബഹുവചനത്തെ ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐξ ἡμῶν
  choice: ഞങ്ങളുടെ കൂട്ടത്തിലുള്ള
  rationale: സ്ത്രീകൾ സംസാരിക്കുന്നവരുടെ ശിഷ്യവൃത്തത്തിൽപ്പെട്ടവരാണെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: ἐξέστησαν ἡμᾶς
  choice: ഞങ്ങളെ അമ്പരപ്പിച്ചു
  rationale: ശക്തമായ ആശ്ചര്യത്തെയോ മനസ്സിന്റെ പതർച്ചയെയോ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ വ്യാപ്തി, വെറും ആശയക്കുഴപ്പമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: γενόμεναι
  choice: പോയിരുന്നു
  rationale: ὀρθριναὶ എന്ന വിശേഷണത്തോടും ദിശ സൂചിപ്പിക്കുന്ന ἐπὶ τὸ μνημεῖον എന്ന പ്രയോഗത്തോടും ചേർന്നുള്ള കർത്തൃക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഗമനപ്രയോഗമായി നൽകുന്നു.
- source_word: ὀρθριναὶ
  choice: അതിരാവിലെ
  rationale: പുലർച്ചെയോ വളരെ നേരത്തെയോ എന്ന കാലസൂചന സംക്ഷിപ്തവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: കല്ലറയിലേക്കു
  rationale: ἐπί + accusative ഇവിടെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ഗതി സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു; യേശുവിന്റെ സംസ്കാരസന്ദർഭത്തിന് ‘കല്ലറ’ യോജിക്കുന്നു.
theological_decisions:
- issue: ഉയിർപ്പിനെക്കുറിച്ചുള്ള റിപ്പോർട്ടിന്റെ പശ്ചാത്തലത്തിൽ ἐξέστησαν എന്നതിന്റെ ശക്തി
  choice: അമ്പരപ്പിച്ചു
  alternative: വിസ്മയിപ്പിച്ചു; പരിഭ്രമിപ്പിച്ചു
  rationale: സ്ത്രീകളുടെ റിപ്പോർട്ടിനോടുള്ള ശിഷ്യന്മാരുടെ പ്രതികരണം ശക്തമായ ആശ്ചര്യമായി അവതരിപ്പിക്കുമ്പോഴും അവർ വിശ്വസിച്ചോ അവിശ്വസിച്ചോ എന്നു പാഠത്തിനപ്പുറം തീരുമാനിക്കുന്നില്ല; ആഖ്യാനത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; അർത്ഥബന്ധം നിലനിർത്തിയിട്ടുണ്ട്.
