revisions:
- from: അവൻ അവരോടൊപ്പം ഭക്ഷണത്തിന് ചാരിക്കിടന്നപ്പോൾ[a], അപ്പം എടുത്ത് അനുഗ്രഹിച്ചു; പിന്നെ അതു മുറിച്ച് അവർക്കു കൊടുക്കാൻ തുടങ്ങി[b].
  to: അങ്ങനെ, അവൻ അവരോടൊപ്പം ഭക്ഷണമേശയിൽ ചാരിക്കിടന്നപ്പോൾ, അപ്പം എടുത്ത് അതിന്മേൽ അനുഗ്രഹം ചൊല്ലി; അതു മുറിച്ചശേഷം അവർക്കു കൊടുക്കാൻ തുടങ്ങി[b].
