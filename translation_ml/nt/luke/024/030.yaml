reference: Luke 24:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: ml
  text: അങ്ങനെ, അവൻ അവരോടൊപ്പം ഭക്ഷണമേശയിൽ ചാരിക്കിടന്നപ്പോൾ, അപ്പം എടുത്ത് അതിന്മേൽ അനുഗ്രഹം ചൊല്ലി; അതു മുറിച്ചശേഷം അവർക്കു കൊടുക്കാൻ തുടങ്ങി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, ‘അവർക്കു കൊടുത്തുകൊണ്ടിരുന്നു.’ ഗ്രീക്കിലെ അപൂർണഭൂതകാലരൂപത്തിന് തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെയോ അതിന്റെ ആരംഭത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്യാതെ കാലവാക്യഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനത്തിലെ സംഭവമാറ്റസൂചകമായ ഈ പ്രയോഗം മലയാളത്തിൽ ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു പകർത്തിയാൽ വാക്യം കൃത്രിമമാകും. ‘...പ്പോൾ’ എന്ന സ്വാഭാവിക ഘടന അതിന്റെ ആഖ്യാനപ്രവർത്തനം വഹിക്കുന്നു.
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: അവൻ അവരോടൊപ്പം ഭക്ഷണത്തിന് ചാരിക്കിടന്നപ്പോൾ
  rationale: ἐν + articular infinitive കാലസൂചന നൽകുന്നു. ഭക്ഷണസന്ദർഭത്തിലെ κατακλίνω പുരാതനരീതിപ്രകാരം മേശയ്ക്കരികിൽ ചാരിക്കിടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഇരുന്നപ്പോൾ’ എന്നത് ആ സാംസ്കാരിക വിശദാംശം നഷ്ടപ്പെടുത്തും.
- source_word: λαβὼν τὸν ἄρτον
  choice: അപ്പം എടുത്ത്
  rationale: മുൻപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചക participle സ്വാഭാവിക മലയാളത്തിൽ ക്രിയാവിശേഷണരൂപത്തിൽ നൽകി. ഇവിടെ ἄρτος ഭക്ഷണത്തിലെ അപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εὐλόγησεν
  choice: അനുഗ്രഹിച്ചു
  rationale: εὐλογέω ഉപയോഗിച്ചതിനാൽ ‘നന്ദി പറഞ്ഞു’ എന്നതിനു പകരം അനുഗ്രഹം ചൊല്ലിയ പ്രവൃത്തി നേരിട്ട് നിലനിർത്തുന്നു; കർമം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ മലയാളത്തിൽ ആവർത്തിച്ചിട്ടില്ല.
- source_word: κλάσας
  choice: പിന്നെ അതു മുറിച്ച്
  rationale: Aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘പിന്നെ’ ക്രമം വ്യക്തമാക്കുന്നു; അപ്പം പങ്കിടാൻ മുറിക്കുന്ന പ്രവൃത്തിയാണ് ഉദ്ദേശ്യം.
- source_word: ἐπεδίδου
  choice: അവർക്കു കൊടുക്കാൻ തുടങ്ങി
  rationale: Imperfect രൂപം പുരോഗമിച്ചുകൊണ്ടിരുന്ന പ്രവൃത്തിയെയോ അതിന്റെ ആരംഭത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ വിതരണത്തിന്റെ ആരംഭം ‘കൊടുക്കാൻ തുടങ്ങി’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഭക്ഷണപ്രവൃത്തികളിലെ സാധ്യതയുള്ള കർത്തൃഭോജന/കൂദാശാസൂചന
  choice: സാധാരണ ഭക്ഷണസന്ദർഭത്തിലെ പ്രവൃത്തികളായി നേരിട്ട് വിവർത്തനം ചെയ്തു
  alternative: കർത്തൃഭോജനത്തെ കൂടുതൽ വ്യക്തമായി അനുസ്മരിപ്പിക്കുന്ന സഭാപരമായ പദാവലി ഉപയോഗിക്കുക
  rationale: ‘എടുത്ത്—അനുഗ്രഹിച്ചു—മുറിച്ച്—കൊടുത്തു’ എന്ന ക്രമത്തിന് മറ്റു ഭക്ഷണവിവരണങ്ങളുമായുള്ള പ്രതിധ്വനി ഉണ്ടാകാം. എന്നാൽ ഈ വാക്യം അതിനെ കൂദാശയായി വ്യക്തമായി നിർവചിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ സഭാപദാവലി ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാതന ഭക്ഷണരീതിയുടെ സാംസ്കാരിക സൂചന പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും കൂടുതൽ സാധാരണമായ വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു. സഭാവിഭാഗപരമായ കൂദാശാപദങ്ങൾ ഒഴിവാക്കി.
