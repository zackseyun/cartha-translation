  to: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ നടക്കുമ്പോൾ പരസ്പരം സംസാരിച്ചുകൊണ്ടിരിക്കുന്ന ഈ കാര്യങ്ങൾ എന്താണ്?” അവർ വിഷാദഭാവത്തോടെ നിന്നു.[a]'
