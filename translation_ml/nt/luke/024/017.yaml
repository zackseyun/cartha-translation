  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ നടക്കുമ്പോൾ പരസ്പരം സംസാരിച്ചുകൊണ്ടിരിക്കുന്ന ഈ കാര്യങ്ങൾ എന്താണ്?” അവർ വിഷാദഭാവത്തോടെ നിന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവർ വിഷാദഭാവത്തോടെ നടത്തം നിർത്തി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: ചോദിച്ചു
  rationale: മൂലക്രിയയുടെ അടിസ്ഥാന അർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, ഇവിടെ നേരിട്ടുള്ള ചോദ്യം അവതരിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് സ്വാഭാവികമാണ്; പ്രസംഗക്രിയയുടെ ഉദ്ദേശ്യം മാത്രം വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകത്തെ മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനബന്ധകമായ ‘അപ്പോൾ’ കൊണ്ട് അവതരിപ്പിച്ചു; ശക്തമായ വൈരുധ്യം സൂചിപ്പിച്ചിട്ടില്ല.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: ഈ വാക്കുകൾ എന്താണ്
  rationale: λόγοι എന്നതിന്റെ ഔപചാരിക സുതാര്യത നിലനിർത്താൻ ‘വാക്കുകൾ’ സ്വീകരിച്ചു; സന്ദർഭത്തിൽ ഇത് അവർ സംസാരിച്ചുകൊണ്ടിരുന്ന കാര്യങ്ങളെയും സൂചിപ്പിക്കാം.
- source_word: ἀντιβάλλετε
  choice: കൈമാറുന്ന
  rationale: പരസ്പരം അങ്ങോട്ടുമിങ്ങോട്ടും വാക്കുകൾ പറയുന്ന ക്രിയയുടെ പ്രത്യുത്തരസ്വഭാവം ‘കൈമാറുന്ന’ നിലനിർത്തുന്നു; ‘വാദിക്കുന്ന’ എന്ന് പറഞ്ഞ് സംഘർഷം അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: πρὸς ἀλλήλους
  choice: നിങ്ങൾ തമ്മിൽ
  rationale: പരസ്പരപ്രവർത്തനം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: περιπατοῦντες
  choice: നടന്നുകൊണ്ടിരിക്കെ
  rationale: സംസാരവും നടത്തവും ഒരേസമയം നടന്നുവെന്ന വർത്തമാനകാല പങ്കാളിക്രിയയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐστάθησαν
  choice: അവിടെത്തന്നെ നിന്നു
  rationale: അവർ നടത്തം നിർത്തി നിന്നുവെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും ‘നിന്നു’ എന്നതിനെക്കാൾ നിശ്ചലമായത് വ്യക്തമാക്കുന്നു.
- source_word: σκυθρωποί
  choice: ദുഃഖഭാവത്തോടെ
  rationale: മുഖഭാവത്തിൽ പ്രകടമായ വിഷാദം സൂചിപ്പിക്കുന്ന വിശേഷണത്തിന്റെ ദൃശ്യമായ ഭാവം സംക്ഷിപ്തമായി നൽകുന്നു; ‘തലകുനിച്ച്’ പോലുള്ള മൂലത്തിൽ വ്യക്തമല്ലാത്ത ശരീരഭാവം ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. λόγοι, ἀντιβάλλετε എന്നിവയിലെ ‘വാക്കുകൾ/കാര്യങ്ങൾ’, ‘കൈമാറ്റം/ചർച്ച’ എന്നീ അർഥവ്യാപ്തികൾ അമിതമായി വ്യാഖ്യാനിക്കാതെ സൂക്ഷിച്ചു. പ്രധാനവാചകത്തിലെ [a] അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
