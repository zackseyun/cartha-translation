id: LUK.24.39
reference: Luke 24:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: ml
  text: എന്റെ കൈകളും കാലുകളും നോക്കൂ; ഞാൻ തന്നെയാണെന്ന് തിരിച്ചറിയുക.[a] എന്നെ തൊട്ടുനോക്കൂ, കാണൂ; നിങ്ങൾ എനിക്കുള്ളതായി കാണുന്നതുപോലെ ഒരു ആത്മാവിന് മാംസവും അസ്ഥികളും ഇല്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ഞാൻ തന്നെയാണെന്ന്.” ഗ്രീക്ക് പ്രയോഗം വ്യക്തിത്വത്തിന് ഊന്നൽ നൽകുന്നു: “ഞാൻ തന്നെയാണ് [അവൻ].”'
    reason: lexical_alternative
  - marker: b
    text: “ആത്മാവ്” എന്നതിന് സന്ദർഭത്തിൽ “പ്രേതം” എന്നും മനസ്സിലാക്കാം; ഗ്രീക്കിൽ ഉപയോഗിച്ചിരിക്കുന്ന പദം “ആത്മാവ്” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: നോക്കൂ / കാണുന്നതുപോലെ
  rationale: ബഹുവചനത്തിലുള്ള ആജ്ഞാരൂപം ഉടനടി ദൃശ്യമായി പരിശോധിക്കാൻ ആവശ്യപ്പെടുന്നു. ആദ്യപ്രയോഗത്തിൽ ‘നോക്കൂ’ എന്നും പിന്നീടുള്ള പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായി ‘കാണുന്നതുപോലെ’ എന്നും നൽകി.
- source_word: τὰς χεῖράς μου καὶ τοὺς πόδας μου
  choice: എന്റെ കൈകളും കാലുകളും
  rationale: ശരീരഭാഗങ്ങളെ നേരിട്ട് സൂചിപ്പിക്കുന്ന മൂർത്തപദങ്ങൾ ലളിതമായി പരിഭാഷപ്പെടുത്തി; ഉയിർത്തെഴുന്നേറ്റ യേശുവിന്റെ വ്യക്തിത്വവും ശരീരയാഥാർഥ്യവും പരിശോധിക്കാനുള്ള ആഹ്വാനം നിലനിർത്തുന്നു.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: ഇത് ഞാൻ തന്നെയാണെന്ന് അറിയുക
  rationale: ἐγώ, αὐτός എന്നിവ നൽകുന്ന ഊന്നൽ ‘ഞാൻ തന്നെയാണ്’ എന്നതിലൂടെ നിലനിർത്തി. ὅτι ഇവിടെ കാണുന്നതിലൂടെ തിരിച്ചറിയേണ്ട ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായി എടുത്തു; മലയാളത്തിൽ അപൂർണ്ണമോ അസ്വാഭാവികമോ ആയ വാക്യം ഒഴിവാക്കാൻ ‘അറിയുക’ പ്രസക്തമായി വ്യക്തമാക്കി.
- source_word: ψηλαφήσατέ με
  choice: എന്നെ തൊട്ടുനോക്കൂ
  rationale: വെറും സ്പർശത്തേക്കാൾ, സ്പർശിച്ച് യാഥാർഥ്യം പരിശോധിക്കുക എന്ന അർഥം ക്രിയയ്ക്കുണ്ട്. ‘തൊട്ടുനോക്കൂ’ ആ പരിശോധനാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πνεῦμα
  choice: ഒരു ആത്മാവ്
  rationale: ഗ്രീക്കിന്റെ നേരിട്ടുള്ള സമാനപദം. ‘പ്രേതം’ സന്ദർഭപരമായി സാധ്യമെങ്കിലും മൂലപദത്തിന്റെ വിശാലത ചുരുക്കുന്നതിനാൽ പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചില്ല.
- source_word: σάρκα καὶ ὀστέα
  choice: മാംസവും അസ്ഥികളും
  rationale: ഇവിടെ σάρξ രൂപകമല്ല, ശരീരത്തിന്റെ ദൃശ്യവും സ്പർശിക്കാവുന്നതുമായ യാഥാർഥ്യത്തെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ബഹുവചനമായ ὀστέα ‘അസ്ഥികൾ’ എന്നു നിലനിർത്തി.
- source_word: καθὼς ἐμὲ θεωρεῖτε ἔχοντα
  choice: നിങ്ങൾ കാണുന്നതുപോലെ എനിക്കുള്ള
  rationale: θεωρεῖτε ശ്രദ്ധാപൂർവമായ നിരീക്ഷണത്തെ സൂചിപ്പിക്കാമെങ്കിലും ‘കാണുക’ ഇവിടെ സ്വാഭാവികമാണ്. ἔχοντα എന്ന പങ്കുപദം മലയാളത്തിൽ ബന്ധവാക്യമായി മാറ്റി, അർഥം വ്യക്തവും ഒഴുക്കുള്ളതുമാക്കി.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റ യേശുവിന്റെ ശരീരയാഥാർഥ്യം
  choice: ‘മാംസവും അസ്ഥികളും’ എന്ന സ്പഷ്ടമായ ശരീരഭാഷയും കാണാനും തൊട്ടുനോക്കാനുമുള്ള ആഹ്വാനവും പൂർണമായി നിലനിർത്തി.
  alternative: ശരീരവും ആത്മാവും തമ്മിലുള്ള വ്യത്യാസം മയപ്പെടുത്തുന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പരിഭാഷ.
  rationale: മൂലപാഠം ദർശനം, സ്പർശനം, മാംസം, അസ്ഥികൾ എന്നിവയിലൂടെ ഉയിർത്തെഴുന്നേറ്റ യേശുവിന്റെ യഥാർഥ ശരീരസാന്നിധ്യം ശക്തമായി ഉറപ്പിക്കുന്നു. പാഠത്തിന് പുറത്തുള്ള സിദ്ധാന്തവിവരണം ചേർക്കാതെ ആ ഊന്നൽ സംരക്ഷിച്ചു.
- issue: πνεῦμα എന്നതിന്റെ സന്ദർഭാർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ആത്മാവ്’.
  alternative: ‘പ്രേതം’ അല്ലെങ്കിൽ ‘ഭൂതം’.
  rationale: ശിഷ്യർ കണ്ടതായി കരുതിയ ശരീരരഹിത സത്തയെ സന്ദർഭം സൂചിപ്പിച്ചാലും, ഗ്രീക്ക് പദം πνεῦμα തന്നെയാണ്. അതിനാൽ വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നേരിട്ടുള്ള സമാനപദം ഉപയോഗിച്ചു; സന്ദർഭപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘തൊട്ടുനോക്കൂ’ എന്നത് ψηλαφάωയുടെ പരിശോധനാഭാവം സ്വാഭാവികമായി നൽകുന്നു. ആദ്യ ὅτι-വാക്യത്തിലെ ഗ്രീക്ക് ഘടന അക്ഷരാർഥമായി പകർത്തുമ്പോൾ മലയാളത്തിൽ അസ്വാഭാവികത വരുന്നതിനാൽ ‘അറിയുക’ വ്യക്തമാക്കി; കാരണാർഥമായ ‘കാരണം’ ചേർത്ത് അവ്യക്തത ഏകപക്ഷീയമായി തീർത്തിട്ടില്ല.
