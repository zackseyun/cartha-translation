reference: Luke 24:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: ml
  text: അവർ പോകുകയായിരുന്ന ഗ്രാമത്തിനടുത്തെത്തി; അവൻ ഇനിയും ദൂരെക്കു പോകാനെന്ന ഭാവം കാണിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇനിയും ദൂരെക്കു പോകുന്നതായി നടിച്ചു” അല്ലെങ്കിൽ “ഇനിയും ദൂരെക്കു പോകുന്നതുപോലെ പ്രവർത്തിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: അടുത്തെത്തിയപ്പോൾ
  rationale: ἐγγίζω ഒരു സ്ഥലത്തോട് അടുത്തെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള സംഭവവുമായി വാക്യം സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ കാലസംബന്ധിയായ രൂപം ഉപയോഗിച്ചു.
- source_word: κώμην
  choice: ഗ്രാമം
  rationale: κώμη സാധാരണയായി നഗരത്തേക്കാൾ ചെറിയ ജനവാസകേന്ദ്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ഗ്രാമം’ യോജിക്കുന്നു.
- source_word: οὗ ἐπορεύοντο
  choice: അവർ പോകുകയായിരുന്ന
  rationale: അപൂർണ്ണഭൂതകാലരൂപം അവരുടെ യാത്ര നടന്നുകൊണ്ടിരുന്നതായി കാണിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള പുരോഗമനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: προσεποιήσατο
  choice: ഭാവിച്ചു
  rationale: ഈ ക്രിയ ഒരു പ്രവൃത്തി ചെയ്യുന്നതുപോലെ തോന്നിക്കുകയോ അങ്ങനെ ഭാവിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഭാവിച്ചു’ എന്നത് വഞ്ചനയെന്ന ശക്തമായ ആരോപണം അനാവശ്യമായി ചേർക്കാതെ ഗ്രീക്കിലെ ആഖ്യാനപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- source_word: πορρώτερον
  choice: കൂടുതൽ ദൂരം
  rationale: താരതമ്യവാചകമായ ഈ ക്രിയാവിശേഷണം ശാരീരികയാത്രയിൽ ‘ഇനിയും അകലേക്ക്’ എന്ന അർഥം നൽകുന്നു; ‘കൂടുതൽ ദൂരം’ സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: πορεύεσθαι
  choice: പോകുന്നതുപോലെ
  rationale: προσεποιήσατο എന്ന ക്രിയയെ പൂരിപ്പിക്കുന്ന infinitive, തുടരുന്ന യാത്രയുടെ പ്രതീതി നൽകുന്നു; മലയാളത്തിലെ ‘പോകുന്നതുപോലെ’ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പ്രവൃത്തിയുമായി ബന്ധപ്പെട്ട προσεποιήσατο എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അവൻ കൂടുതൽ ദൂരം പോകുന്നതുപോലെ ഭാവിച്ചു
  alternative: അവൻ കൂടുതൽ ദൂരം പോകുന്നതായി നടിച്ചു
  rationale: അവൻ യാത്ര തുടരാനിരിക്കുകയാണെന്ന പ്രതീതി നൽകിയതായി വാക്യം പറയുന്നു. ‘ഭാവിച്ചു’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ അർഥം നിലനിർത്തുകയും, ഇത് വഞ്ചനയായിരുന്നുവെന്ന കൂടുതൽ ശക്തമായ ദൈവശാസ്ത്രപരമായ നിഗമനം വിവർത്തനത്തിലൂടെ അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു; അതേസമയം προσεποιήσατο എന്ന പദത്തിലെ യഥാർഥ അർഥവ്യാപ്തിയും വ്യാഖ്യാനപരമായ സംഘർഷവും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
