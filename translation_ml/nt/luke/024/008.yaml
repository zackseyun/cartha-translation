lexical_decisions:
- source_word: καὶ
  choice: അപ്പോൾ
  rationale: ലളിതമായ ആഖ്യാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ തുടർച്ച വ്യക്തമാക്കുന്നു, എന്നാൽ ശക്തമായ കാരണബന്ധം ചേർക്കുന്നില്ല.
- source_word: ἐμνήσθησαν
  choice: ഓർത്തു
  rationale: മധ്യ/കർമണി രൂപത്തിലാണെങ്കിലും ഇവിടെ സജീവാർഥമുള്ള ക്രിയയാണ്; ‘ഓർത്തു’ എന്നത് മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: τῶν ῥημάτων
  choice: വാക്കുകൾ
  rationale: ῥῆμα ഇവിടെ പറഞ്ഞ വാക്കുകളെയോ പ്രസ്താവനകളെയോ സൂചിപ്പിക്കുന്നു; ‘വാക്കുകൾ’ ഏറ്റവും ലളിതവും അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമായ പരിഭാഷയാണ്.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: ഗ്രീക്കിലെ സർവനാമരൂപം അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത് യേശുവിനെയാണെങ്കിലും പേര് വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
