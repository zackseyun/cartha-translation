  edition: SBLGNT
  text: πτοηθέντες δὲ καὶ ἔμφοβοι γενόμενοι ἐδόκουν πνεῦμα θεωρεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: ml
  text: എന്നാൽ അവർ ഞെട്ടിപ്പോകുകയും ഭയപ്പെടുകയും ചെയ്തു; തങ്ങൾ ഒരു ആത്മാവിനെ[a] കാണുകയാണെന്ന് അവർ കരുതി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു പ്രേതം.’ ഗ്രീക്കിലെ πνεῦμα എന്ന പദത്തിന്റെ കൂടുതൽ നേരിട്ടുള്ള അർഥം ‘ആത്മാവ്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: ഞെട്ടിപ്പോകുകയും
  rationale: പെട്ടെന്നുണ്ടായ ഞെട്ടലിനെയോ പരിഭ്രമത്തെയോ സൂചിപ്പിക്കുന്ന ആഓറിസ്റ്റ് പാസീവ് പാർട്ടിസിപ്പിളിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പിന്നാലെ ഭയം പ്രത്യേകം പറയുന്നതിനാൽ അതിശക്തമാക്കി വിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽ യേശു പ്രത്യക്ഷപ്പെട്ടതും അതിനോടുള്ള ശിഷ്യരുടെ പ്രതികരണവും തമ്മിലുള്ള നേരിയ വൈരുധ്യവും വിവരണത്തിലെ തിരിവും പ്രകടമാക്കുന്നു.
- source_word: ἔμφοβοι γενόμενοι
  choice: ഭയപ്പെടുകയും ചെയ്തു
  rationale: ഭയത്തിന്റെ അവസ്ഥയിലേക്കു പ്രവേശിച്ചതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐδόκουν
  choice: കരുതി
  rationale: അവർക്ക് ഉണ്ടായിരുന്ന ധാരണയെയോ തോന്നലെയോ സൂചിപ്പിക്കുന്നു; ഇംപെർഫെക്റ്റിന്റെ തുടർച്ചാഭാവം തുടർന്നുള്ള കാണുകയാണെന്ന് എന്ന ഘടനയിലും സന്ദർഭത്തിലും പ്രകടമാണ്.
- source_word: πνεῦμα
  choice: ഒരു ആത്മാവിനെ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള സമാനപദം നിലനിർത്തുന്നു; പ്രേതം എന്ന സാംസ്കാരികമായി കൂടുതൽ നിർദിഷ്ടമായ ആശയം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: θεωρεῖν
  choice: കാണുകയാണെന്ന്
  rationale: വർത്തമാന ഇൻഫിനിറ്റീവിന്റെ നടന്നുകൊണ്ടിരിക്കുന്ന ദർശനാനുഭവം മലയാളത്തിലെ പുരോഗമനഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റ യേശുവിന്റെ പ്രത്യക്ഷതയുടെ പശ്ചാത്തലത്തിൽ πνεῦμα എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഒരു ആത്മാവ്
  alternative: ഒരു പ്രേതം
  rationale: ആത്മാവ് എന്നത് πνεῦμα എന്ന പദത്തോട് കൂടുതൽ നേരിട്ടു ചേരുകയും ശിഷ്യരുടെ തെറ്റായ ധാരണയെ മാത്രം രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു. പ്രേതം എന്നത് പിന്നീട് രൂപപ്പെട്ട ജനകീയ സങ്കൽപ്പങ്ങൾ അനാവശ്യമായി കൊണ്ടുവരാം; അതേസമയം പകരം വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് പാർട്ടിസിപ്പിളുകളുടെ ക്രമം ഭാരമുള്ള ശബ്ദാനുവാദമാക്കാതെ ‘ഞെട്ടിപ്പോകുകയും ഭയപ്പെടുകയും ചെയ്തു’ എന്നു നൽകി; മുഖ്യവാചകത്തിൽ ‘ആത്മാവ്’ നിലനിർത്തി പകരം അർഥം അടിക്കുറിപ്പിൽ ചേർത്തു.
