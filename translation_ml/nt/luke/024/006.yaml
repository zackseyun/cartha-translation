source:
  edition: SBLGNT
  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: ml
  text: 'അവൻ ഇവിടെ ഇല്ല; എന്നാൽ അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു.[a] അവൻ അപ്പോഴും ഗലീലയിൽ ആയിരുന്നപ്പോൾ നിങ്ങളോടു പറഞ്ഞത് ഓർക്കുക:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു.” ഗ്രീക്കിലെ ക്രിയ കർമണിപ്രയോഗത്തിലാണ്—“ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു”; എന്നാൽ ഉയിർപ്പിന്റെ സംഭവത്തെ സൂചിപ്പിക്കാൻ “ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: അവൻ ഇവിടെ ഇല്ല
  rationale: ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സന്ദർഭം യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; സ്വാഭാവികമായ മലയാളത്തിനായി ‘അവൻ’ ചേർത്തു. ὧδε എന്ന സ്ഥലസൂചക ക്രിയാവിശേഷണം ‘ഇവിടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἀλλὰ
  choice: എന്നാൽ ആശയവ്യത്യാസം അർധവിരാമത്തിലൂടെ പ്രകടമാക്കി
  rationale: ആദ്യ പ്രസ്താവനയോടുള്ള ശക്തമായ വൈരുധ്യം മലയാളത്തിലെ സ്വാഭാവികമായ വാക്യക്രമത്തിലും അർധവിരാമത്തിലും വ്യക്തമാണ്; ‘എന്നാൽ’ ചേർക്കാതിരിക്കുന്നത് പ്രഖ്യാപനത്തെ കൂടുതൽ നേരിട്ടതാക്കുന്നു.
- source_word: ἠγέρθη
  choice: അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ἐγείρω എന്ന ക്രിയയുടെ aorist passive രൂപം നിലനിർത്തി, ഉയിർപ്പിന്റെ പൂർത്തിയായ സംഭവത്തിനും അതിന്റെ ഇപ്പോഴത്തെ ഫലത്തിനും യോജിച്ച മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു; ഇതിലൂടെ സൂചിതമായ ദൈവിക പ്രവർത്തനവും മറയുന്നില്ല.
- source_word: μνήσθητε
  choice: ഓർക്കുക
  rationale: aorist middle imperative-ന്റെ നേരിട്ടുള്ള ആഹ്വാനം സാധാരണവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς ἐλάλησεν ὑμῖν
  choice: നിങ്ങളോടു പറഞ്ഞത്
  rationale: ഇവിടെ ὡς ഓർക്കേണ്ട സംസാരത്തിന്റെ ഉള്ളടക്കത്തെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘എങ്ങനെ സംസാരിച്ചു’ എന്നതിനെക്കാൾ ‘പറഞ്ഞത്’ സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: ἔτι ὢν ἐν τῇ Γαλιλαίᾳ
  choice: അവൻ ഗലീലയിൽ ആയിരുന്നപ്പോൾ
  rationale: കാലസൂചക participial ഘടന സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി നൽകി. ἔτι-യുടെ ‘അപ്പോഴും അവിടെ ആയിരിക്കെ’ എന്ന അർഥം ‘ആയിരുന്നപ്പോൾ’ എന്ന സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ഉയിർപ്പിനെ സൂചിപ്പിക്കുന്ന ἠγέρθη എന്ന ക്രിയയുടെ പ്രയോഗം
  choice: അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: അവൻ ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ passive രൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നത് ഉയിർപ്പിലെ സൂചിതമായ ദൈവിക പ്രവർത്തനത്തെ നിലനിർത്തുന്നു. മലയാളത്തിൽ സാധാരണമായ കർത്തൃസ്വഭാവമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നത് സംഭവത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു, എന്നാൽ മുഖ്യപാഠത്തിലെ വ്യാകരണപരമായ സൂക്ഷ്മത മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നത് ഗ്രീക്ക് കർമണിപ്രയോഗം സൂക്ഷിക്കുന്നു; കൂടുതൽ പരിചിതമായ ‘ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു. തുടർന്നുവരുന്ന വാക്കുകളിലേക്കുള്ള ബന്ധം കാണിക്കാൻ വാക്യാവസാനത്തിൽ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
