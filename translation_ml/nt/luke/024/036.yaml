    text: 'ചില കൈയെഴുത്തുപ്രതികൾ ഇങ്ങനെ കൂടി ചേർക്കുന്നു: “അവൻ അവരോടു പറഞ്ഞു: ‘നിങ്ങൾക്കു സമാധാനം.’”'
    reason: textual_variant
lexical_decisions:
- source_word: Ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചനമായ സൂചകപദം മുമ്പ് വിവരിച്ച കാര്യങ്ങളിലേക്കു തിരിഞ്ഞുനോക്കുന്നു; ബഹുവചനവും ആശയബന്ധവും നിലനിർത്തുന്നു.
- source_word: δὲ ... αὐτῶν λαλούντων
  choice: അവർ ... പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപമുള്ള genitive absolute ഒരേസമയം തുടരുന്ന സംസാരത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-കൊണ്ടിരിക്കുമ്പോൾ’ ആ കാലബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; δέയ്ക്ക് പ്രത്യേകം സംയോജകപദം ചേർക്കേണ്ടതില്ല.
- source_word: αὐτὸς
  choice: അവൻതന്നെ
  rationale: വ്യക്തമായി ചേർത്തിരിക്കുന്ന സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἔστη
  choice: നിന്നു
  rationale: ἵστημι എന്ന ക്രിയയുടെ aorist രൂപം ഇവിടെ നിൽക്കുന്ന സ്ഥാനം സ്വീകരിച്ചതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്നത് മൂലപദത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനം ചേർക്കും.
- source_word: ἐν μέσῳ αὐτῶν
  choice: അവരുടെ നടുവിൽ
  rationale: സംഘത്തിന്റെ മധ്യേയുള്ള സാന്നിധ്യം വ്യക്തമാക്കുന്ന, സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: '‘അവൻ അവരോട്: “നിങ്ങൾക്കു സമാധാനം” എന്നു പറഞ്ഞു’ എന്ന ദീർഘമായ പാഠഭേദം പ്രധാനവാക്യത്തിൽ ഉൾപ്പെടുത്തണമോ'
  choice: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തെ പിന്തുടർന്ന് പ്രധാനവാക്യത്തിൽ ഉൾപ്പെടുത്തിയില്ല.
  alternative: 'ചില കൈയെഴുത്തുപ്രതികളനുസരിച്ച്: ‘അവൻ അവരോട്: “നിങ്ങൾക്കു സമാധാനം” എന്നു പറഞ്ഞു.’'
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് മൂലപാഠം ‘അവരുടെ നടുവിൽ’ എന്നിടത്ത് അവസാനിക്കുന്നു. പരിചിതമായ പാരമ്പര്യപാഠവുമായി ഒത്തുചേർക്കാതെ മൂലപാഠത്തിന് മുൻഗണന നൽകുകയും ശ്രദ്ധേയമായ പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അവൻതന്നെ’ എന്ന രൂപം αὐτός എന്നതിന്റെ ഊന്നൽ സൂക്ഷിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ’ തുടരുന്ന സമകാലിക പ്രവർത്തനത്തെ വ്യക്തമാക്കുന്നു.
