translation:
  language: ml
  text: അവർ ഈ കാര്യങ്ങൾ പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ, അവൻ തന്നെ അവരുടെ നടുവിൽ നിന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
