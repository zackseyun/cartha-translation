revisions:
- from: അവൻ അതു വാങ്ങി[a] അവരുടെ മുമ്പിൽവെച്ച് ഭക്ഷിച്ചു.
  to: അവൻ അത് എടുത്ത് അവരുടെ മുമ്പാകെ ഭക്ഷിച്ചു.
  rationale: The revision replaces the potentially misleading വാങ്ങി with എടുത്ത്, preserves the Greek’s participial sequence, and uses a more idiomatic rendering of ‘before them.’ The implied object is supplied once from the immediate context, with a footnote explicitly noting that it is not stated in Greek.
