  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λαβὼν ἐνώπιον αὐτῶν ἔφαγεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/043.yaml
  text: And taking it[a], he ate it before them.
translation:
  language: ml
  text: അവൻ അത് എടുത്ത് അവരുടെ മുമ്പാകെ ഭക്ഷിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല)
  rationale: മുൻവാക്യത്തിലെ സംഭവത്തിന്റെ തുടർച്ച മലയാളത്തിലെ വാക്യക്രമംകൊണ്ട് സ്വാഭാവികമായി വ്യക്തമാകുന്നു; ഇവിടെ ‘പിന്നെ’ എന്നു ചേർത്താൽ ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കാലക്രമബലം വരാം.
- source_word: λαβὼν
  choice: വാങ്ങി
  rationale: λαμβάνω എന്ന ക്രിയയുടെ aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിൽ ശിഷ്യർ മീൻകഷണം കൊടുത്തതിനാൽ ‘വാങ്ങി’ എന്നത് സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്. ഗ്രീക്കിൽ ഇല്ലാത്ത കർമം മലയാളത്തിൽ ‘അതു’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: ἐνώπιον αὐτῶν
  choice: അവരുടെ മുമ്പിൽവെച്ച്
  rationale: അവരുടെ സാന്നിധ്യത്തിലും കാഴ്ചയിലുംവെച്ചാണ് പ്രവൃത്തി നടന്നതെന്ന സാക്ഷ്യസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔφαγεν
  choice: ഭക്ഷിച്ചു
  rationale: aorist indicative പൂർത്തിയായ ആഖ്യാനപ്രവൃത്തിയെ അറിയിക്കുന്നു. ‘ഭക്ഷിച്ചു’ ആധുനികവും മാന്യവുമായ സാധാരണ പ്രയോഗമാണ്; കർമം മുൻപുള്ള ‘അതു’യിൽനിന്ന് വ്യക്തമാകുന്നു.
theological_decisions:
- issue: പങ്കാളിക്രിയയുടെയും പ്രധാനക്രിയയുടെയും ഗ്രീക്കിൽ പരാമർശിക്കാത്ത കർമം വ്യക്തമാക്കണമോ
  choice: മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാകുന്ന കർമം ‘അതു’ എന്നു ഒരിക്കൽ വ്യക്തമാക്കി
  alternative: ‘അവൻ വാങ്ങി അവരുടെ മുമ്പിൽവെച്ച് ഭക്ഷിച്ചു’ എന്നു കർമം വ്യക്തമാക്കാതെ നൽകുക
  rationale: ഗ്രീക്കിൽ കർമം പരാമർശിക്കാത്തത് അത് മുൻവാക്യത്തിലെ മീൻകഷണമാണെന്ന് എളുപ്പം മനസ്സിലാകുന്നതിനാലാണ്. മലയാളത്തിൽ ‘അതു വാങ്ങി ... ഭക്ഷിച്ചു’ എന്നു പറയുന്നത് സ്വാഭാവികവും പുതിയ ആശയം ചേർക്കാത്തതുമാണ്. ഉയിർത്തെഴുന്നേറ്റ യേശു അവരുടെ കൺമുമ്പിൽ യഥാർഥമായി ഭക്ഷിച്ചുവെന്ന ആഖ്യാനസാക്ഷ്യം ഇതിലൂടെ നിലനിൽക്കുന്നു; അതിലപ്പുറം ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവരുടെ മുമ്പിൽവെച്ച്’ എന്ന പ്രയോഗം അവരുടെ സാന്നിധ്യത്തിലും കാഴ്ചയിലും നടന്ന പ്രവൃത്തിയെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
