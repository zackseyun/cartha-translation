source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς ἀλλήλους· Οὐχὶ ἡ καρδία ἡμῶν καιομένη ἦν ⸂ἐν ἡμῖν⸃ ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ, ⸀ὡς διήνοιγεν ἡμῖν τὰς γραφάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: ml
  text: 'അവർ തമ്മിൽ പറഞ്ഞു: “അവൻ വഴിയിൽവെച്ച്[b] നമ്മോടു സംസാരിക്കുകയും തിരുവെഴുത്തുകൾ നമുക്കു തുറന്നുകൊടുക്കുകയും[c] ചെയ്തപ്പോൾ, നമ്മുടെ ഹൃദയം[a] നമ്മുടെ ഉള്ളിൽ ജ്വലിച്ചുകൊണ്ടിരുന്നില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ ഹൃദയങ്ങൾ’; ഗ്രീക്കിൽ ‘നമ്മുടെ ഹൃദയം’ എന്ന് ഏകവചനമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യാത്രാമധ്യേ.’
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘തിരുവെഴുത്തുകൾ തുറക്കുക’; അതായത്, അവയുടെ അർഥം ഗ്രഹിക്കാവുന്നതാക്കുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: അവർ തമ്മിൽ പറഞ്ഞു
  rationale: പരസ്പരസംഭാഷണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Οὐχὶ
  choice: ജ്വലിച്ചുകൊണ്ടിരുന്നില്ലേ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ഭാവം ‘-ഇല്ലേ?’ എന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: ἡ καρδία ἡμῶν
  choice: നമ്മുടെ ഹൃദയം
  rationale: ഗ്രീക്കിലെ ഏകവചനം നിലനിർത്തുകയും ഇരുവരുടെയും പങ്കിട്ട ആന്തരിക അനുഭവം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: καιομένη
  choice: ജ്വലിച്ചുകൊണ്ടിരിക്കുക
  rationale: ആന്തരിക അനുഭവത്തിന്റെ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു; വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന ഭാവവും സൂചിപ്പിക്കുന്നു.
- source_word: ἐν ἡμῖν
  choice: നമ്മുടെ ഉള്ളിൽ
  rationale: ആന്തരിക അനുഭവം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐλάλει
  choice: സംസാരിച്ചുകൊണ്ടിരിക്കുക
  rationale: ഇംപർഫെക്റ്റ് ക്രിയയുടെ തുടരുന്ന പ്രവർത്തനഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ ὁδῷ
  choice: വഴിയിൽവെച്ച്
  rationale: എമ്മാവൂസിലേക്കുള്ള യാത്രയുടെ സാക്ഷാൽ വഴിയെ സൂചിപ്പിക്കുന്നതും മലയാളത്തിൽ സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: διήνοιγεν
  choice: തുറന്നുതന്നുകൊണ്ടിരിക്കുക
  rationale: തിരുവെഴുത്തുകളുടെ അർഥം ഗ്രഹിക്കാവുന്നതാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ‘തുറക്കുക’ എന്ന മൂലരൂപകം നിലനിർത്തുകയും ഇംപർഫെക്റ്റിന്റെ തുടരുന്ന ഭാവം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὰς γραφάς
  choice: തിരുവെഴുത്തുകൾ
  rationale: ഈ സന്ദർഭത്തിലെ വിശുദ്ധ ലിഖിതങ്ങളെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപദം.
theological_decisions:
- issue: ‘ഹൃദയം ജ്വലിക്കുക’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: ‘നമ്മുടെ ഹൃദയം നമ്മുടെ ഉള്ളിൽ ജ്വലിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘ഞങ്ങൾ അത്യന്തം വികാരഭരിതരായി’ അല്ലെങ്കിൽ ‘ഞങ്ങൾക്ക് ആത്മീയബോധോദയം ഉണ്ടായി’ എന്ന് വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഇത് വികാരപരമോ ആത്മീയമോ ബൗദ്ധികമോ എന്ന് വാക്യം കൃത്യമായി നിർവചിക്കുന്നില്ല. അതിനാൽ അനുഭവത്തിന്റെയും ദൈവശാസ്ത്രപരമായ അർഥത്തിന്റെയും തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ട് ഇംപർഫെക്റ്റ് ക്രിയകളുടെ തുടരുന്ന ഭാവം ‘-കൊണ്ടിരിക്കുക’ രൂപങ്ങളിലൂടെ സൂക്ഷിച്ചു. ദീർഘമായിരുന്നാലും അലങ്കാരചോദ്യത്തിന്റെ ഏകവാക്യഘടനയും ‘ഹൃദയം ജ്വലിക്കുക’, ‘തിരുവെഴുത്തുകൾ തുറക്കുക’ എന്നീ മൂലരൂപകങ്ങളും നിലനിർത്തി.
