id: LUK.24.5
reference: Luke 24:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: ml
  text: 'അവർ ഭയന്നുവിറച്ച് മുഖങ്ങൾ നിലത്തേക്കു കുനിച്ചപ്പോൾ, ആ പുരുഷന്മാർ അവരോടു പറഞ്ഞു: “ജീവിച്ചിരിക്കുന്നവനെ മരിച്ചവരുടെ ഇടയിൽ അന്വേഷിക്കുന്നത് എന്തിന്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ജീവിച്ചിരിക്കുന്നവനെ മരിച്ചവരോടൊപ്പം നിങ്ങൾ എന്താണ് അന്വേഷിക്കുന്നത്?” സന്ദർഭത്തിലെ അർഥം: “ജീവിച്ചിരിക്കുന്നവനെ മരിച്ചവരുടെ ഇടയിൽ അന്വേഷിക്കുന്നത് എന്തിന്?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: ഭയന്നുവിറച്ച്
  rationale: ἔμφοβος എന്നതിലെ ശക്തമായ ഭയവും γενομένων സൂചിപ്പിക്കുന്ന അവസ്ഥാമാറ്റവും സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: മുഖം നിലത്തേക്കു കുനിച്ചപ്പോൾ
  rationale: മുഖം ഭൂമിയിലേക്കു താഴ്ത്തിയ ഭയഭക്തിപൂർണമായ ശാരീരിക ചലനം വ്യക്തമായി നിലനിർത്തുന്നു; മലയാളത്തിലെ കാലവാക്യഘടന ഗ്രീക്കിലെ അനുബന്ധ സാഹചര്യത്തെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἶπαν πρὸς αὐτάς
  choice: ആ പുരുഷന്മാർ അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കർത്തൃസർവനാമം മുൻവാക്യത്തിലെ രണ്ടു പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭസൂചിത നാമം ഉപയോഗിച്ചു. αὐτάς ‘അവരോട്’ എന്ന് നിലനിർത്തി.
- source_word: Τί ζητεῖτε
  choice: അന്വേഷിക്കുന്നത് എന്തിന്?
  rationale: τί അക്ഷരാർഥത്തിൽ ‘എന്ത്’ ആയിരിക്കാമെങ്കിലും, ഇവിടെ അവരുടെ തിരച്ചിലിന്റെ അനുചിതത്വത്തെ ചോദ്യം ചെയ്യുന്ന ‘എന്തിന്’ എന്ന സന്ദർഭാർഥം സ്വാഭാവികമാണ്.
- source_word: τὸν ζῶντα
  choice: ജീവിച്ചിരിക്കുന്നവനെ
  rationale: ഏകവചനത്തിലുള്ള substantival participle വ്യക്തിപരമായ ‘ജീവിച്ചിരിക്കുന്നവൻ’ എന്ന അർഥം നൽകുന്നു; യേശുവിനെ പേരെടുത്തു ചേർക്കാതെ മൂലപാഠത്തിന്റെ സംയമനം പാലിക്കുന്നു.
- source_word: μετὰ τῶν νεκρῶν
  choice: മരിച്ചവരുടെ ഇടയിൽ
  rationale: μετά + genitive എന്നതിന്റെ ‘കൂടെ/ഇടയിൽ’ എന്ന പരിധിയിൽ, ജീവിച്ചിരിക്കുന്നവനും മരിച്ചവരും തമ്മിലുള്ള വൈരുധ്യം സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: τὸν ζῶντα എന്നതിലെ പുനരുത്ഥാനസൂചന
  choice: ജീവിച്ചിരിക്കുന്നവനെ
  alternative: ജീവനുള്ളവനെ
  rationale: യേശു മരിച്ചവരിൽ ഒരാളല്ല, ജീവനോടിരിക്കുന്നവനാണ് എന്ന പുനരുത്ഥാനസൂചന നിലനിർത്തുന്നു; ‘ഉയിർത്തെഴുന്നേറ്റവനെ’ എന്ന് വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുന്നില്ല.
- issue: ചോദ്യത്തിലെ τίയുടെ വ്യാഖ്യാനം
  choice: എന്തിന്
  alternative: എന്താണ്
  rationale: സന്ദർഭത്തിൽ ചോദ്യം അവർ തേടുന്ന വസ്തുവിനെക്കാൾ അത്തരമൊരു സ്ഥലത്ത് തേടുന്നതിന്റെ കാരണത്തെയാണ് വെല്ലുവിളിക്കുന്നത്; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭയന്നുവിറച്ച്’ ശക്തമായ ഭയം പകർന്നുനൽകുന്നു; ‘ജീവിച്ചിരിക്കുന്നവനെ’ മൂലത്തിലെ ഏകവചനവും വ്യക്തിപരമായ സൂചനയും സംരക്ഷിക്കുന്നു. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
