id: LUK.24.10
reference: Luke 24:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: ml
  text: അവർ മഗ്ദലേന മറിയയും യോഹന്നായും യാക്കോബിന്റെ അമ്മയായ മറിയയും അവരോടൊപ്പമുണ്ടായിരുന്ന മറ്റു സ്ത്രീകളുമായിരുന്നു. അവർ ഈ കാര്യങ്ങൾ അപ്പൊസ്തലന്മാരോടു പറയുകയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν
  choice: ഇവരായിരുന്നു അവർ
  rationale: εἰμί എന്ന ക്രിയയുടെ അപൂർണ ഭൂതകാല ബഹുവചനരൂപം മുമ്പു പരാമർശിച്ച സ്ത്രീകൾ ആരൊക്കെയായിരുന്നു എന്നു വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ പേരുകളുടെ പട്ടികയ്ക്കു ശേഷം ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നു. മുൻവാക്യസന്ദർഭവും വാക്യക്രമവും ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ എന്നു ചേർത്താൽ അനാവശ്യമായ വിരോധമോ കാലസൂചനയോ ഉണ്ടാകാം.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: മഗ്ദലക്കാരി മറിയ
  rationale: സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന വിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും പരമ്പരാഗതമായി തിരിച്ചറിയാവുന്ന പേരുരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: Ἰωάννα
  choice: യോഹന്ന
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: Μαρία ἡ Ἰακώβου
  choice: യാക്കോബിന്റെ അമ്മയായ മറിയ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക ഷഷ്ഠി സംക്ഷിപ്തവും കൃത്യബന്ധം വ്യക്തമാക്കാത്തതുമാണ്. സുവിശേഷങ്ങളിലെ നാമകരണരീതിയിൽ ‘യാക്കോബിന്റെ അമ്മ’ എന്നതാണ് ഏറ്റവും സാധ്യതയുള്ളതും മലയാളത്തിൽ വ്യക്തവുമായ അർഥം; മറ്റു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: അവരോടൊപ്പമുണ്ടായിരുന്ന മറ്റു സ്ത്രീകൾ
  rationale: സ്ത്രീലിംഗ ബഹുവചനം സന്ദർഭത്തിൽ സ്ത്രീകളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘സ്ത്രീകൾ’ എന്നു വ്യക്തമാക്കുന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἔλεγον
  choice: പറയുകയായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘പറയുകയായിരുന്നു’ അതിന്റെ ദൈർഘ്യഭാവം നിലനിർത്തുന്നു.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: അപ്പൊസ്തലന്മാരോടു
  rationale: യേശുവിന്റെ അപ്പൊസ്തലവൃന്ദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ സ്ഥാപിതവും പൊതുവായി മനസ്സിലാകുന്നതുമായ പദമാണ് ‘അപ്പൊസ്തലന്മാർ’.
- source_word: ταῦτα
  choice: ഇക്കാര്യങ്ങൾ
  rationale: മുമ്പു വിവരിച്ച സംഭവങ്ങളെയും സന്ദേശത്തെയും തിരിഞ്ഞു സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: Μαρία ἡ Ἰακώβου എന്നതിലെ ബന്ധത്തിന്റെ തിരിച്ചറിയൽ
  choice: യാക്കോബിന്റെ അമ്മയായ മറിയ
  alternative: യാക്കോബിന്റെ മറിയ; യാക്കോബിന്റെ ഭാര്യയായ മറിയ
  rationale: മൂലഗ്രീക്ക് ബന്ധം വ്യക്തമാക്കാതെ ‘യാക്കോബിന്റെ മറിയ’ എന്നു മാത്രമാണ് പറയുന്നത്. സുവിശേഷങ്ങളിലെ നാമകരണരീതിയിൽ മാതൃബന്ധമാണ് കൂടുതൽ സാധ്യതയുള്ളത്; എങ്കിലും ഭാര്യ എന്ന സാധ്യത പൂർണമായി തള്ളാനാകാത്തതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പേരുകളുടെ പട്ടിക വ്യക്തമായി വായിക്കാനായി ഡാഷ് ഉപയോഗിച്ചിരിക്കുന്നു; അപൂർണ ഭൂതകാലത്തിന്റെ തുടരുന്ന ഭാവം ‘പറയുകയായിരുന്നു’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
