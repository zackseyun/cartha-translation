id: LUK.24.44
reference: Luke 24:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: ml
  text: 'പിന്നെ അവൻ അവരോടു പറഞ്ഞു: “ഞാൻ ഇനിയും നിങ്ങളോടുകൂടെ ഉണ്ടായിരുന്നപ്പോൾ നിങ്ങളോടു പറഞ്ഞ എന്റെ വാക്കുകൾ ഇവയാണ്: മോശയുടെ ന്യായപ്രമാണത്തിലും പ്രവാചകന്മാരിലും സങ്കീർത്തനങ്ങളിലും എന്നെക്കുറിച്ച്[c] എഴുതിയിരിക്കുന്നതെല്ലാം[a] നിവൃത്തിയാകേണ്ടതാണ്.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എഴുതിയിരിക്കുന്ന സകല കാര്യങ്ങളും.”
    reason: lexical_alternative
  - marker: b
    text: “മോശയുടെ ന്യായപ്രമാണം, പ്രവാചകന്മാർ, സങ്കീർത്തനങ്ങൾ” എന്നത് ഇസ്രായേലിന്റെ തിരുവെഴുത്തുകളിലെ പ്രധാന വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നതാകാം. “സങ്കീർത്തനങ്ങൾ” സങ്കീർത്തനപുസ്തകത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ കൂടുതൽ വിശാലമായി “എഴുത്തുകൾ” എന്ന വിഭാഗത്തെ പ്രതിനിധീകരിക്കാം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “എന്നെ സംബന്ധിച്ച്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: പിന്നെ അവൻ അവരോടു പറഞ്ഞു
  rationale: δέ ഇവിടെ ആഖ്യാനം മുന്നോട്ടു നീക്കുന്ന മൃദുവായ ബന്ധകമാണ്; ‘പിന്നെ’ സ്വാഭാവികമായ മലയാളപ്രവാഹം നൽകുന്നു. πρός + വ്യക്തികൾ എന്ന പ്രയോഗം ‘അവരോടു’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Οὗτοι οἱ λόγοι μου
  choice: എന്റെ വാക്കുകൾ ഇവയാണ്
  rationale: λόγοι എന്നതിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ തുല്യപദം ‘വാക്കുകൾ’ ആണ്; demonstrative construction മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃക്രമീകരിച്ചു.
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν
  choice: ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിരുന്നപ്പോൾ നിങ്ങളോടു പറഞ്ഞ
  rationale: പങ്കാളിക്രിയയുടെ കാലസൂചന ‘ഉണ്ടായിരുന്നപ്പോൾ’ എന്നു നൽകി; ἔτι സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്ന മുൻകാല സഹവാസം നിലനിർത്തുന്നു. ആവർത്തിക്കുന്ന ‘നിങ്ങളോടു/നിങ്ങളോടുകൂടെ’ മൂലവാക്യത്തിന്റെ ഘടനയും ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: ὅτι δεῖ πληρωθῆναι
  choice: നിവൃത്തിയാകേണ്ടതാണ്
  rationale: δεῖയുടെ അനിവാര്യതയും πληρόωയുടെ തിരുവെഴുത്തുനിവൃത്തി എന്ന ആശയവും ഒരുമിച്ച് സംരക്ഷിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: πάντα τὰ γεγραμμένα
  choice: എഴുതിയിരിക്കുന്നതെല്ലാം
  rationale: πάνταയുടെ സമഗ്രതയും perfect passive participle സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന ലിഖിതസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: മോശയുടെ ന്യായപ്രമാണത്തിലും പ്രവാചകന്മാരിലും സങ്കീർത്തനങ്ങളിലും
  rationale: ഇസ്രായേലിന്റെ തിരുവെഴുത്തുകളിലെ അറിയപ്പെടുന്ന വിഭാഗങ്ങളിലേക്കുള്ള സൂചന പേരുകളായി നിലനിർത്തുന്നു; മൂലത്തിലെ മൂന്ന് ഘടകങ്ങളും വേർതിരിച്ചു പരിഭാഷപ്പെടുത്തി.
- source_word: περὶ ἐμοῦ
  choice: എന്നെക്കുറിച്ച്
  rationale: περί + genitive ഇവിടെ വിഷയസംബന്ധം സൂചിപ്പിക്കുന്നു; ‘എന്നെക്കുറിച്ച്’ വ്യക്തവും ആധുനികവുമായ മലയാളമാണ്.
theological_decisions:
- issue: തിരുവെഴുത്തുനിവൃത്തിയുടെ അനിവാര്യത
  choice: ‘നിവൃത്തിയാകേണ്ടതാണ്’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘നിവൃത്തിയാകുമായിരുന്നു’ അല്ലെങ്കിൽ ‘സത്യമായിത്തീരേണ്ടതായിരുന്നു’
  rationale: δεῖ ശക്തമായ അനിവാര്യത പ്രകടിപ്പിക്കുന്നു. അതിന്റെ ദൈവികമോ തിരുവെഴുത്തുസംബന്ധമോ ആയ ഭാരം നിലനിർത്തുന്നു; എന്നാൽ നിവൃത്തി എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്ന പ്രത്യേക സിദ്ധാന്തം വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: ‘മോശയുടെ ന്യായപ്രമാണം, പ്രവാചകന്മാർ, സങ്കീർത്തനങ്ങൾ’ എന്നതിന്റെ തിരിച്ചറിയൽ
  choice: തിരുവെഴുത്തുവിഭാഗങ്ങളുടെ പേരുകളായി മുഖ്യവാചകത്തിൽ നൽകി; പരിധിയുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു
  alternative: ‘സങ്കീർത്തനങ്ങൾ’ എന്നത് സങ്കീർത്തനപുസ്തകത്തെ മാത്രം സൂചിപ്പിക്കുന്നു എന്ന് നിർണ്ണയിക്കുക, അല്ലെങ്കിൽ ‘എഴുത്തുകൾ’ എന്ന് നേരിട്ട് വിപുലീകരിക്കുക
  rationale: വാചകം മൂന്ന് അറിയപ്പെടുന്ന വിഭാഗങ്ങളിലേക്കു വിരൽചൂണ്ടുന്നതായി തോന്നുന്നു; എങ്കിലും ‘സങ്കീർത്തനങ്ങൾ’ മൂന്നാം വിഭാഗം മുഴുവനെയും പ്രതിനിധീകരിക്കുന്നുണ്ടോ എന്നത് മൂലവാക്യം നിർണ്ണായകമായി വ്യക്തമാക്കുന്നില്ല.
- issue: περὶ ἐμοῦ എന്ന പദബന്ധം എഴുതിയിരിക്കുന്ന കാര്യങ്ങളോടുള്ള ബന്ധം
  choice: ‘എന്നെക്കുറിച്ച് എഴുതിയിരിക്കുന്നതെല്ലാം’ എന്ന സ്വാഭാവിക ബന്ധമായി നൽകി
  alternative: ‘എന്നെ സംബന്ധിച്ച് എഴുതിയിരിക്കുന്ന സകല കാര്യങ്ങളും’
  rationale: ഗ്രീക്കിലെ reference relation നേരിട്ട് സംരക്ഷിക്കുന്നു; യേശുവിനെക്കുറിച്ചുള്ള എഴുത്തുകളുടെ സ്വഭാവമോ വിഭാഗമോ അധികമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ന്യായപ്രമാണം’, ‘പ്രവാചകന്മാർ’, ‘സങ്കീർത്തനങ്ങൾ’, ‘നിവൃത്തിയാകുക’ എന്നീ പരിചിത തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
