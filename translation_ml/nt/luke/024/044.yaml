  source_fidelity: 'മുഖ്യഅർഥം ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: തിരുവെഴുത്തുകളിൽ തന്നെക്കുറിച്ച് എഴുതിയിരിക്കുന്ന സകലവും നിവൃത്തിയാകേണ്ടതിന്റെ അനിവാര്യതയും മൂന്ന് തിരുവെഴുത്തു വിഭാഗങ്ങളുടെയും പരാമർശവും സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ ἔτι (‘still’) എന്ന കാല-സൂചന കൂടുതൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കണം.'
  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘ഞാൻ ഇനിയും നിങ്ങളോടുകൂടെ ഉണ്ടായിരുന്നപ്പോൾ’ എന്ന ചെറിയ ഭേദഗതി മൂലത്തിലെ ἔτιയുടെ ഭാവം ചേർക്കുന്നു.
  terminology: ‘മോശയുടെ ന്യായപ്രമാണം,’ ‘പ്രവാചകന്മാർ,’ ‘സങ്കീർത്തനങ്ങൾ,’ ‘നിവൃത്തിയാകുക’ എന്നിവ യോജിച്ച തിരുവെഴുത്തു-രജിസ്റ്ററിലുള്ള പ്രയോഗങ്ങളാണ്. ‘എന്നെക്കുറിച്ച്’ എന്നതിന് ഇംഗ്ലീഷ് ഓഡിറ്റ്-ട്രെയിലിലെ ‘concerning me’ എന്ന ബദൽ സൂചിപ്പിക്കുന്ന അടിക്കുറിപ്പ്-ആങ്കർ ചേർക്കണം.
  issues:
  - severity: low
    issue: ἔτιയുടെ കാലസൂചന വ്യക്തമായി പ്രതിഫലിക്കുന്നില്ല
    rationale: ‘ഉണ്ടായിരുന്നപ്പോൾ’ സന്ദർഭത്തിൽ ആശയം സൂചിപ്പിച്ചാലും, ἔτι ‘still’ എന്ന പ്രത്യേക ഊന്നൽ വഹിക്കുന്നു. ‘ഇനിയും’ ചേർക്കുന്നത് അതു നിലനിർത്തുന്നു.
  - severity: low
    issue: περὶ ἐμοῦവിനുള്ള ബദൽ-വായനയുടെ അടിക്കുറിപ്പും ആങ്കറും ഇല്ല
    rationale: ഇംഗ്ലീഷ് POB ഓഡിറ്റ്-ട്രെയിലിൽ ‘about me / concerning me’ എന്ന ലെക്സിക്കൽ ബദൽ പ്രത്യേകം രേഖപ്പെടുത്തിയിരിക്കുന്നു. മലയാളത്തിൽ ‘എന്നെ സംബന്ധിച്ച്’ എന്ന ബദൽ അടിക്കുറിപ്പായി നൽകി അനുബന്ധ ആങ്കർ ചേർക്കുന്നത് അടിക്കുറിപ്പ്-സമത്വം നിലനിർത്തുന്നു.
  revised_text: 'പിന്നെ അവൻ അവരോടു പറഞ്ഞു: “ഞാൻ ഇനിയും നിങ്ങളോടുകൂടെ ഉണ്ടായിരുന്നപ്പോൾ നിങ്ങളോടു പറഞ്ഞ എന്റെ വാക്കുകൾ ഇവയാണ്: മോശയുടെ ന്യായപ്രമാണത്തിലും പ്രവാചകന്മാരിലും സങ്കീർത്തനങ്ങളിലും എന്നെക്കുറിച്ച്[c] എഴുതിയിരിക്കുന്നതെല്ലാം[a] നിവൃത്തിയാകേണ്ടതാണ്.”[b]'
  revised_footnotes:
  - marker: a
    text: അഥവാ, “എഴുതിയിരിക്കുന്ന സകല കാര്യങ്ങളും.”
    reason: lexical_alternative
  - marker: b
    text: “മോശയുടെ ന്യായപ്രമാണം, പ്രവാചകന്മാർ, സങ്കീർത്തനങ്ങൾ” എന്നത് ഇസ്രായേലിന്റെ തിരുവെഴുത്തുകളിലെ പ്രധാന വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നതാകാം. “സങ്കീർത്തനങ്ങൾ” സങ്കീർത്തനപുസ്തകത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ കൂടുതൽ വിശാലമായി “എഴുത്തുകൾ” എന്ന വിഭാഗത്തെ പ്രതിനിധീകരിക്കാം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “എന്നെ സംബന്ധിച്ച്.”
    reason: lexical_alternative
  revision_rationale: മൂലഗ്രീക്കിലെ ἔτιയുടെ ‘still’ എന്ന അർഥസൂചന വ്യക്തമായി ചേർത്തു. περὶ ἐμοῦവിനുള്ള ലെക്സിക്കൽ ബദൽ ഇംഗ്ലീഷ് ഓഡിറ്റ്-ട്രെയിലിനൊത്തു മലയാള അടിക്കുറിപ്പായും മുഖ്യവാചക ആങ്കറായും ചേർത്തു. മറ്റെല്ലാ ഘടകങ്ങളും മൂലപാഠത്തിന്റെ അർഥവും നിലവിലുള്ള മലയാളത്തിന്റെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
