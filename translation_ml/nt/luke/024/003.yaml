  verdict: revise
  source_fidelity: The draft correctly retains the temporal sense of εἰσελθοῦσαι, the narrative contrast/progression of δέ, and the short SBLGNT reading τὸ σῶμα (“the body”). However, “കണ്ടില്ല” primarily means “did not see,” whereas εὗρον means “they did not find.”
  naturalness: “അവർ അകത്തു കടന്നപ്പോൾ” is natural modern Malayalam in this tomb context. Replacing “കണ്ടില്ല” with “കണ്ടെത്തിയില്ല” gives a natural and more semantically precise rendering.
  terminology: “ശരീരം” is the appropriate unexpanded equivalent of τὸ σῶμα. The footnote correctly confines “the body of the Lord Jesus” to the manuscript variant and does not introduce it into the main text.
  issues:
