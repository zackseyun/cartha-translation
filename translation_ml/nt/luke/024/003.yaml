    issue: The verb “കണ്ടില്ല” does not precisely render εὗρον.
    rationale: The Greek says that the women did not find the body, not merely that they did not see it. “കണ്ടെത്തിയില്ല” preserves the finding/search-result sense without adding interpretation.
