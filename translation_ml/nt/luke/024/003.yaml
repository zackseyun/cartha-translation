  text: But when they entered[a], they did not find the body.
translation:
  language: ml
  text: എന്നാൽ അവർ അകത്തു കടന്നപ്പോൾ[a] ശരീരം കണ്ടെത്തിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “കർത്താവായ യേശുവിന്റെ ശരീരം.”'
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: അവർ അകത്തു കടന്നപ്പോൾ
  rationale: സ്ത്രീലിംഗ ബഹുവചനത്തിലുള്ള aorist participle മുമ്പ് പറഞ്ഞ സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ കാലസംബന്ധ ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ആഖ്യാനത്തിന്റെ മുന്നേറ്റത്തോടൊപ്പം നേരിയ വൈരുധ്യവും സൂചിപ്പിക്കുന്നു; കല്ലറയിൽ പ്രവേശിച്ചതിനും അപ്രതീക്ഷിതമായി ശരീരം കാണാതിരുന്നതിനും ഇടയിലെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: οὐχ εὗρον
  choice: കണ്ടില്ല
  rationale: കണ്ടെത്തുക എന്ന സാധാരണ അർഥമുള്ള നിഷേധ aorist ക്രിയ. ഈ സന്ദർഭത്തിൽ ‘കണ്ടില്ല’ സ്വാഭാവികവും ലളിതവുമാണ്.
- source_word: τὸ σῶμα
  choice: ശരീരം
  rationale: σῶμα എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘ശരീരം’ എന്നാണ്. ‘മൃതശരീരം’ എന്നു പറയുന്നത് സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും ഗ്രീക്കിൽ ഇല്ലാത്ത വ്യാഖ്യാനച്ചായം കൂട്ടും.
theological_decisions:
- issue: ആരുടെ ശരീരമാണെന്ന് വ്യക്തമാക്കണമോ
  choice: ശരീരം
  alternative: കർത്താവായ യേശുവിന്റെ ശരീരം
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ ‘ശരീരം’ എന്നു മാത്രമാണ്. ചില കൈയെഴുത്തുപ്രതികളിലെ ദീർഘവായന മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അകത്തു’ എന്നത് കല്ലറയുടെ ഉള്ളിലേക്കുള്ള പ്രവേശനം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
