id: LUK.24.38
reference: Luke 24:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്തിനാണ് കലങ്ങിയിരിക്കുന്നത്? നിങ്ങളുടെ ഹൃദയങ്ങളിൽ സംശയങ്ങൾ[a] ഉയരുന്നത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചിന്തകൾ” അല്ലെങ്കിൽ “തർക്കവിചാരങ്ങൾ.”
    reason: διαλογισμοί എന്ന പദത്തിന്റെ യഥാർഥമായ മറ്റു അർഥസാധ്യതകൾ സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: Τί
  choice: എന്തുകൊണ്ട്
  rationale: τί എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘എന്ത്’ എന്നാണെങ്കിലും, ഇവിടെ εἰμίയോടും വിധേയവിശേഷണത്തോടും ചേർന്ന പ്രയോഗം കാരണമന്വേഷിക്കുന്നതിനാൽ ‘എന്തുകൊണ്ട്’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: τεταραγμένοι
  choice: കലങ്ങിപ്പോയിരിക്കുന്നത്
  rationale: ταράσσω എന്ന ക്രിയയുടെ perfect passive participle ആയ ഇത്, സംഭവിച്ച കലക്കത്തിന്റെ ഫലമായി അവർ ഇപ്പോൾ അനുഭവിക്കുന്ന ആന്തരിക അസ്വസ്ഥതയെ സൂചിപ്പിക്കുന്നു.
- source_word: διαλογισμοὶ
  choice: സംശയങ്ങൾ
  rationale: ഈ സന്ദർഭത്തിൽ യേശുവിന്റെ പ്രത്യക്ഷതയെക്കുറിച്ചുള്ള ശിഷ്യരുടെ അനിശ്ചിതത്വവും സന്ദേഹവും മുൻനിൽക്കുന്നതിനാൽ ‘സംശയങ്ങൾ’ യോജിക്കുന്നു; എന്നാൽ ‘ചിന്തകൾ,’ ‘തർക്കവിചാരങ്ങൾ’ എന്നീ വിശാലാർഥങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀναβαίνουσιν
  choice: ഉയരുന്നത്
  rationale: അക്ഷരാർഥത്തിൽ ‘മുകളിലേക്കു വരുക’ എന്ന ആശയമുള്ള ഈ ക്രിയ, ഉള്ളിലെ ചിന്തകൾ ഉദിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗമായി ‘ഉയരുക’ എന്നു സ്വാഭാവികമായി വിവർത്തനം ചെയ്യാം.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളിൽ
  rationale: ഏകവചനമായ καρδίᾳയും ബഹുവചനമായ ὑμῶνയും ചേർന്നത് കൂട്ടത്തിലെ ഓരോരുത്തരുടെയും ഹൃദയത്തെ സൂചിപ്പിക്കുന്ന വിതരണപ്രയോഗമാണ്; മലയാളത്തിൽ ബഹുവചനം അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: καρδία
  choice: ഹൃദയം
  rationale: ചിന്ത, മനോഭാവം, വികാരം എന്നിവ ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു; ‘മനസ്സ്’ എന്നു പറയുന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
theological_decisions:
- issue: καρδία എന്ന മനുഷ്യസ്വഭാവസംബന്ധിയായ പദം
  choice: ഹൃദയം
  alternative: മനസ്സ്; ആന്തരിക വ്യക്തിത്വം
  rationale: ബൈബിൾപരമായ മനുഷ്യദർശനത്തിൽ ഹൃദയം വികാരത്തിന്റെ മാത്രം കേന്ദ്രമല്ല, ചിന്തയുടെയും മനോഭാവത്തിന്റെയും കേന്ദ്രവുമാണ്. അതിനാൽ ‘ഹൃദയം’ എന്ന രൂപം ഈ അർഥസമ്പുഷ്ടത നിലനിർത്തുന്നു.
- issue: διαλογισμοὶ എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: സംശയങ്ങൾ
  alternative: ചിന്തകൾ; തർക്കവിചാരങ്ങൾ
  rationale: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ കണ്ട ശിഷ്യരുടെ അനിശ്ചിതത്വമാണ് സന്ദർഭത്തിൽ മുഖ്യം. എങ്കിലും മൂലപദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു; ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ഇതിൽ ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘കലങ്ങിപ്പോയിരിക്കുന്നത്’ perfect participle സൂചിപ്പിക്കുന്ന നിലവിലെ കലങ്ങിയ അവസ്ഥ പ്രകടമാക്കുന്നു. ചോദ്യങ്ങളുടെ സമാന്തരഘടനയും ‘ഹൃദയം’ എന്ന ബൈബിൾരൂപകവും നിലനിർത്തി.
