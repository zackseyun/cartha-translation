id: LUK.24.14
reference: Luke 24:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡμίλουν πρὸς ἀλλήλους περὶ πάντων τῶν συμβεβηκότων τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/014.yaml
  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: ml
  text: സംഭവിച്ച ഈ കാര്യങ്ങളെല്ലാം കുറിച്ച് അവർ പരസ്പരം സംസാരിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നടന്നുകഴിഞ്ഞ ഈ സംഭവങ്ങളെല്ലാം കുറിച്ച് അവർ പരസ്പരം സംഭാഷണം നടത്തിക്കൊണ്ടിരുന്നു.’
    reason: സംഭവങ്ങളെയും സംഭാഷണത്തെയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദങ്ങൾക്ക് സാധ്യമായ അടുത്ത ശബ്ദവൈകല്പികം.
lexical_decisions:
- source_word: καὶ
  choice: (വാക്യബന്ധത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി)
  rationale: καί മുൻവിവരണത്തോടുള്ള സാധാരണ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. ഒറ്റവാക്യമായ മലയാള പരിഭാഷയിൽ ‘അപ്പോൾ’ പോലുള്ള അധിക കാലസൂചന ചേർക്കാതെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിലൂടെ അത് പ്രകടമാക്കുന്നു.
- source_word: αὐτοὶ
  choice: അവർ
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം വ്യക്തമായി നൽകിയിട്ടുണ്ടെങ്കിലും ഇവിടെ ഊന്നൽ നേരിയതാണ്; മലയാളത്തിൽ ‘അവർതന്നെ’ എന്നു പറയുന്നത് അനാവശ്യമായ അധിക ഊന്നൽ സൃഷ്ടിക്കും.
- source_word: ὡμίλουν
  choice: സംസാരിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്ന സംഭാഷണത്തെ സൂചിപ്പിക്കുന്നു. ‘സംസാരിച്ചുകൊണ്ടിരുന്നു’ ആ ദൈർഘ്യഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πρὸς ἀλλήλους
  choice: പരസ്പരം
  rationale: പരസ്പര സംഭാഷണമെന്ന അർഥം മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: περὶ
  choice: കുറിച്ച്
  rationale: സംഭാഷണത്തിന്റെ വിഷയത്തെ സൂചിപ്പിക്കുന്ന περί എന്ന പദത്തിന് ആധുനിക മലയാളത്തിലെ നേരായ തുല്യപ്രയോഗമാണിത്.
- source_word: πάντων
  choice: എല്ലാം
  rationale: സംഭവങ്ങളുടെ മുഴുവൻ സമുച്ചയത്തെയും ഉൾക്കൊള്ളുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: τῶν συμβεβηκότων τούτων
  choice: സംഭവിച്ച ഈ കാര്യങ്ങൾ
  rationale: συμβαίνω എന്നതിന്റെ പൂർണകൃതന്തം ഇതിനകം നടന്നതും ഇപ്പോഴത്തെ സാഹചര്യത്തിൽ പ്രസക്തവുമായ സംഭവങ്ങളെ സൂചിപ്പിക്കുന്നു. ഈ പദക്രമം സ്വാഭാവിക മലയാളത്തിൽ പൂർത്തിയായ സംഭവഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അപൂർണ ഭൂതകാലത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവവും സംഭവങ്ങളുടെ പൂർത്തിയായ നിലയും സംരക്ഷിച്ചിരിക്കുന്നു.
