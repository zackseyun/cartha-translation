source:
  edition: SBLGNT
  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: ml
  text: 'അവർ അവനെ നിർബന്ധപൂർവം അഭ്യർഥിച്ചു[a]: “ഞങ്ങളോടൊപ്പം തങ്ങണമേ; സന്ധ്യയാകാറായി, പകൽ ഇതിനകം ചരിഞ്ഞിരിക്കുന്നു[b].” അവൻ അവരോടൊപ്പം തങ്ങാൻ അകത്തേക്കു ചെന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവർ അവനെ ശക്തമായി നിർബന്ധിച്ചു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “പകൽ ഇപ്പോൾ ഏറെ കഴിഞ്ഞിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: നിർബന്ധപൂർവം അഭ്യർഥിച്ചു
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ഈ ക്രിയ ശാരീരിക ബലപ്രയോഗത്തെക്കാൾ ശക്തവും വിടാതെയുമുള്ള അഭ്യർഥനയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘നിർബന്ധപൂർവം അഭ്യർഥിച്ചു’ എന്നത് അതിന്റെ തീവ്രത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: ഞങ്ങളോടൊപ്പം തങ്ങണമേ
  rationale: അതിഥിസൽക്കാരത്തിന്റെ ഈ സന്ദർഭത്തിൽ μένω എന്നത് ‘തങ്ങുക’ എന്നാണ് സ്വാഭാവികം; μετά + genitive സഹവാസത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഞങ്ങളോടൊപ്പം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: സന്ധ്യയാകാറായി
  rationale: πρὸς ἑσπέραν പൂർണമായി സന്ധ്യയായെന്നല്ല, സന്ധ്യ അടുത്തുവരുന്നതാണ് സൂചിപ്പിക്കുന്നത്. ‘സന്ധ്യയാകാറായി’ ഈ കാലസൂക്ഷ്മത സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: പകൽ ഇതിനകം ചരിഞ്ഞിരിക്കുന്നു
  rationale: κλίνωയുടെ perfect രൂപം പകൽ അവസാനത്തിലേക്കു ചായുന്ന ദൃശ്യരൂപകം നിലനിർത്തുന്നു. ‘ചരിഞ്ഞിരിക്കുന്നു’ ആ രൂപകവും perfect-ന്റെ നിലവിലുള്ള ഫലവും സംരക്ഷിക്കുന്നു.
- source_word: εἰσῆλθεν
  choice: അകത്തേക്കു ചെന്നു
  rationale: പ്രവേശിക്കുന്നതിനെ വിവരിക്കുന്ന ഈ ആഖ്യാനസന്ദർഭത്തിൽ ‘അകത്തേക്കു ചെന്നു’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്; താമസസ്ഥലം മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അത് കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: τοῦ μεῖναι σὺν αὐτοῖς
  choice: അവരോടൊപ്പം തങ്ങാൻ
  rationale: articular infinitive ഇവിടെ ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്നു. മുൻപത്തെ μένωയോടുള്ള പദബന്ധം നിലനിർത്താൻ രണ്ടിടത്തും ‘തങ്ങുക’ ഉപയോഗിച്ചു; σύν എന്നതിന് ‘അവരോടൊപ്പം’ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ സന്ധ്യ അടുക്കുന്നതും പകൽ ചരിയുന്നതുമായ സമാന്തര കാലസൂചനകൾ വേർതിരിച്ചുതന്നെ നിലനിർത്തി; അകത്തേക്കു ചെന്ന സ്ഥലം വ്യക്തമാക്കുന്ന അധികവിവരം ചേർത്തിട്ടില്ല.
