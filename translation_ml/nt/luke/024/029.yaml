  terminology: “തങ്ങണമേ,” “സന്ധ്യയാകാറായി,” “പകൽ ഇതിനകം ചരിഞ്ഞിരിക്കുന്നു,” and “അവരോടൊപ്പം തങ്ങാൻ” are appropriate modern-standard Malayalam renderings. The footnote alternatives are anchored correctly and reflect genuine lexical/idiomatic alternatives.
