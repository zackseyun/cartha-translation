id: LUK.24.2
reference: Luke 24:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὗρον δὲ τὸν λίθον ἀποκεκυλισμένον ἀπὸ τοῦ μνημείου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/002.yaml
  text: And they found the stone rolled away from the tomb,
translation:
  language: ml
  text: കല്ല് കല്ലറയിൽനിന്ന് ഉരുട്ടിമാറ്റപ്പെട്ടതായി അവർ കണ്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: അവർ കണ്ടു
  rationale: മൂന്നാം പുരുഷ ബഹുവചനത്തിലുള്ള aorist ക്രിയയാണ്; മുൻവാക്യത്തിലെ സ്ത്രീകളാണ് സൂചിത കർത്താക്കൾ. മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായതിനാൽ കർത്താവ് പ്രകടമാക്കി.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിലെ വാക്യക്രമം തന്നെ ആ മുന്നേറ്റം സ്വാഭാവികമായി നൽകുന്നതിനാൽ നിർബന്ധിതമായ ‘എന്നാൽ’ ഒഴിവാക്കി.
- source_word: τὸν λίθον
  choice: കല്ല്
  rationale: ശവകുടീരം അടച്ചിരുന്ന കല്ലിനെയാണ് λίθος സൂചിപ്പിക്കുന്നത്; ‘കല്ല്’ കൃത്യവും സാധാരണവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἀποκεκυλισμένον
  choice: ഉരുട്ടിമാറ്റിയിരിക്കുന്നതായി
  rationale: Perfect passive participle കല്ല് ഉരുട്ടിമാറ്റപ്പെട്ടതും ആ നില തുടരുന്നതും സൂചിപ്പിക്കുന്നു. ‘ഉരുട്ടിമാറ്റിയിരിക്കുന്നതായി’ ചലനവും ഫലാവസ്ഥയും നിലനിർത്തുന്നു.
- source_word: ἀπὸ τοῦ μνημείου
  choice: കല്ലറയിൽനിന്ന്
  rationale: സുവിശേഷങ്ങളിലെ സംസ്കാരസന്ദർഭത്തിൽ μνημεῖον എന്നത് ‘കല്ലറ’ എന്നാണ് സ്വാഭാവികമായി വരുന്നത്; ἀπό വേർപാടിനെ ‘യിൽനിന്ന്’ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഗ്രീക്കിൽ പ്രകടമായി ആവർത്തിക്കാത്ത കർത്താവ്
  choice: അവർ കണ്ടു
  alternative: കണ്ടു
  rationale: ക്രിയയുടെ ബഹുവചനം മുൻവാക്യത്തിലെ സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവർ’ ചേർക്കുന്നത് കഥ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു; പുതിയ ദൈവശാസ്ത്രപരമായ വിവരം ചേർക്കുന്നില്ല.
- issue: Perfect passive participle-ന്റെ പ്രവർത്തകനും ഫലാവസ്ഥയും
  choice: ഉരുട്ടിമാറ്റിയിരിക്കുന്നതായി
  alternative: ഉരുണ്ടുമാറിയതായി
  rationale: ഗ്രീക്ക് passive രൂപം കല്ല് മാറ്റപ്പെട്ട നിലയിലാണ് എന്നു പറയുന്നു, എന്നാൽ ആരാണ് മാറ്റിയതെന്ന് ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പ്രവർത്തകനെ ചേർക്കാതെ passive അർഥവും ഫലാവസ്ഥയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ വാക്കുകളുടെ ക്രമം യാന്ത്രികമായി പകർത്താതെ, കല്ലറയിൽനിന്നുള്ള വേർപാടും കല്ലിന്റെ ഫലാവസ്ഥയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
