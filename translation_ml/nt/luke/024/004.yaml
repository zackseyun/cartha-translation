source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: ml
  text: അവർ ഇതിനെക്കുറിച്ച് ആശയക്കുഴപ്പത്തിലായിരിക്കുമ്പോൾ, അതാ, കണ്ണഞ്ചിപ്പിക്കുന്ന വസ്ത്രം ധരിച്ച[a] രണ്ടു പുരുഷന്മാർ അവരുടെ അരികിൽ വന്നുനിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘മിന്നൽപോലെ തിളങ്ങുന്ന വസ്ത്രം ധരിച്ച.’'
    reason: ἀστραπτούσῃ എന്ന പദത്തിലെ മിന്നൽസദൃശമായ തിളക്കത്തിന്റെ ദൃശ്യബിംബം വ്യക്തമാക്കുന്ന അക്ഷരാർഥപരമായ മറ്റൊരു വിവർത്തനം.
lexical_decisions:
- source_word: ἐγένετο
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്യാതെ വാക്യഘടനയിലൂടെ ആഖ്യാനസംഭവം അവതരിപ്പിച്ചു
  rationale: ഇത് ലൂക്കോസിന്റെ സാധാരണ ആഖ്യാനസൂത്രമാണ്. മലയാളത്തിൽ ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് ഭാരമുള്ളതും അസ്വാഭാവികവുമാകും; തുടർന്നുള്ള സംഭവവിവരണം അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി നിർവഹിക്കുന്നു.
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς
  choice: അവർ ... ആശയക്കുഴപ്പത്തിലായിരിക്കുമ്പോൾ
  rationale: ἐν സഹിതമുള്ള articular infinitive സമയബന്ധം സൂചിപ്പിക്കുന്നു. ἀπορέω വെറും അത്ഭുതപ്പെടലല്ല, എന്തു മനസ്സിലാക്കണമെന്നറിയാത്ത അവസ്ഥയാണ്; ‘ആശയക്കുഴപ്പത്തിലാകുക’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: περὶ τούτου
  choice: ഇതിനെക്കുറിച്ച്
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ ശൂന്യകല്ലറയെ സംബന്ധിച്ച കാര്യത്തിലേക്കുള്ള ലളിതമായ സൂചനയാണിത്.
- source_word: ἰδοὺ
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള പുതിയ സംഭവത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന അടയാളത്തെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἄνδρες δύο
  choice: രണ്ടു പുരുഷന്മാർ
  rationale: ἀνήρ ഇവിടെ വ്യക്തമായി പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ അവരെ ദൂതന്മാർ എന്നു മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ ആഖ്യാനത്തിലെ അവതരണം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: ἐπέστησαν αὐταῖς
  choice: അവരുടെ അരികിൽ വന്നുനിന്നു
  rationale: ക്രിയയിലെ സമീപസ്ഥിതിയും പെട്ടെന്നുള്ള സാന്നിധ്യവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്ന വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: കണ്ണഞ്ചിപ്പിക്കുന്ന വസ്ത്രം ധരിച്ച
  rationale: വസ്ത്രത്തിന്റെ അത്യുജ്ജ്വലമായ തിളക്കം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. മൂലത്തിലെ മിന്നൽസദൃശമായ ദൃശ്യബിംബം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: രണ്ടു വ്യക്തികളുടെ തിരിച്ചറിയൽ
  choice: പ്രധാനപാഠത്തിൽ ‘രണ്ടു പുരുഷന്മാർ’
  alternative: ‘രണ്ടു ദൂതന്മാർ’
  rationale: സമീപസന്ദർഭം അവർ സ്വർഗീയ സന്ദേശവാഹകരാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും, ഈ വാക്യം അവരെ ἄνδρες, ‘പുരുഷന്മാർ,’ എന്നാണ് അവതരിപ്പിക്കുന്നത്. അതിനാൽ തുടർന്നുള്ള സന്ദർഭത്തിലെ തിരിച്ചറിയൽ ഈ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതാ’ മൂലപാഠത്തിലെ ശ്രദ്ധാകർഷകത നിലനിർത്തുന്നു; ‘വന്നുനിന്നു’ സമീപസ്ഥിതിയും പെട്ടെന്നുള്ള വരവും ഒരുമിച്ച് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
