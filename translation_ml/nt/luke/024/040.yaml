- from: ഇതു പറഞ്ഞശേഷം[a] അവൻ തന്റെ കൈകളും കാലുകളും അവർക്കു കാണിച്ചുകൊടുത്തു.
  to: ഇതു പറഞ്ഞശേഷം[a] അവൻ തന്റെ കൈകളും പാദങ്ങളും അവർക്കു കാണിച്ചുകൊടുത്തു.
  rationale: The sole revision changes «കാലുകളും» to «പാദങ്ങളും» to translate τοὺς πόδας precisely as ‘feet.’ The wording continues to render the prior participial action naturally, and the footnote retains the significant manuscript uncertainty indicated by the brackets in SBLGNT.
