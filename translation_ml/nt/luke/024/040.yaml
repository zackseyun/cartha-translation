reference: Luke 24:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂[καὶ τοῦτο εἰπὼν ⸀ἔδειξεν αὐτοῖς τὰς χεῖρας καὶ τοὺς πόδας.]⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/040.yaml
  text: And after saying this[a], he showed them his hands and his feet.
translation:
  language: ml
  text: ഇതു പറഞ്ഞശേഷം[a] അവൻ തന്റെ കൈകളും പാദങ്ങളും അവർക്കു കാണിച്ചുകൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ഈ വാക്യം ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: ശേഷം
  rationale: ഗ്രീക്കിലെ ബന്ധകവും തുടർന്ന് വരുന്ന aorist participle-ഉം ചേർന്ന് സൂചിപ്പിക്കുന്ന സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘പറഞ്ഞശേഷം’ എന്നു പ്രകടിപ്പിച്ചു; പ്രത്യേകമായി ‘പിന്നെ’ ചേർക്കേണ്ടതില്ല.
- source_word: τοῦτο εἰπὼν
  choice: ഇതു പറഞ്ഞശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ aorist participle സൂചിപ്പിക്കുന്നു. ‘ഇതു പറഞ്ഞശേഷം’ ആ ക്രമം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔδειξεν
  choice: കാണിച്ചുകൊടുത്തു
  rationale: δείκνυμι ഇവിടെ ദൃശ്യമായി കാണിക്കുക എന്ന അർഥത്തിലാണ്. ‘കാണിച്ചുകൊടുത്തു’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: പരോക്ഷ കർമത്തെ മലയാള ദത്തിവിഭക്തിയിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰς χεῖρας
  choice: തന്റെ കൈകൾ
  rationale: ഗ്രീക്കിൽ നിർദേശക ലേഖനമാണെങ്കിലും, അവ യേശുവിന്റെ സ്വന്തം കൈകളാണെന്ന സന്ദർഭസൂചന മലയാളത്തിൽ ‘തന്റെ’ എന്ന സ്വവാചക സർവനാമംകൊണ്ട് സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: τοὺς πόδας
  choice: കാലുകൾ
  rationale: πόδας എന്നത് ശരീരഭാഗമായ പാദങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. കൈകളോടൊപ്പം വരുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗമായി ‘കാലുകൾ’ തിരഞ്ഞെടുത്തു; ‘തന്റെ’ എന്നത് രണ്ടു നാമങ്ങൾക്കും ബാധകമാണ്.
theological_decisions:
- issue: വാക്യം മുഴുവനിന്റെയും പാഠവിമർശനപരമായ നില
  choice: പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി പാഠഭേദക്കുറിപ്പ് ചേർത്തു
  alternative: ചില കൈയെഴുത്തുപ്രതികളിൽ ഈ വാക്യം ഇല്ലാത്തതിനാൽ പ്രധാനപാഠത്തിൽനിന്ന് ഒഴിവാക്കുക
  rationale: SBLGNT ഈ വാക്യം മുഴുവൻ ചതുരക്കൊളുത്തുകളിൽ നൽകുന്നത് ഗണ്യമായ പാഠസംശയം സൂചിപ്പിക്കുന്നു. നൽകിയിരിക്കുന്ന സ്രോതസ്സിൽ വാക്കുകൾ ഉൾപ്പെട്ടതിനാൽ അവ പ്രധാനപാഠത്തിൽ പരിഭാഷപ്പെടുത്തി; അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സംഭവക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും സ്രോതസ്സിലെ പാഠവിമർശനപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
