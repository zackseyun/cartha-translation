id: LUK.24.20
reference: Luke 24:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: ml
  text: ഞങ്ങളുടെ മുഖ്യപുരോഹിതന്മാരും ഭരണാധികാരികളും അവനെ മരണശിക്ഷാവിധിക്കായി[a] ഏൽപ്പിച്ചുകൊടുക്കുകയും ക്രൂശിക്കുകയും ചെയ്തതെങ്ങനെയെന്നും[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “മരണവിധിയിലേക്കു” അല്ലെങ്കിൽ “മരണശിക്ഷ വിധിക്കപ്പെടാനായി.”'
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “അവനെ ക്രൂശിപ്പിക്കുകയും ചെയ്തു”; വധം റോമൻ അധികാരികൾ നടപ്പാക്കിയെങ്കിലും അതിന്റെ ഉത്തരവാദിത്വം ഈ നേതാക്കൾക്കാണെന്ന് ഈ രൂപം വ്യക്തമാക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: ചെയ്തതെങ്ങനെയെന്നും
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള വിവരണത്തുടർച്ചയും ‘എങ്ങനെ’ എന്ന ഉള്ളടക്കബന്ധവും ഒരുമിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παρέδωκαν
  choice: ഏൽപ്പിച്ചുകൊടുക്കുകയും
  rationale: ന്യായവിധിക്കും വധത്തിനുമായി മറ്റൊരു അധികാരത്തിന്റെ കൈയിൽ ഏൽപ്പിക്കുന്നതെന്ന നിയമപരമായ ഭാവം നിലനിർത്തുന്നു; ‘ഒറ്റിക്കൊടുത്തു’ എന്ന കൂടുതൽ സങ്കുചിതമായ അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: രണ്ടാം ദേവാലയകാലത്തെ മഹാപുരോഹിതനേതൃത്വവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: ഞങ്ങളുടെ ... ഭരണാധികാരികൾ
  rationale: ἄρχοντες എന്നതിലെ ഭരണ-ന്യായാധികാരഭാവവും ἡμῶν എന്ന ഉടമസ്ഥസർവനാമവും നിലനിർത്തുന്നു.
- source_word: εἰς κρίμα θανάτου
  choice: മരണശിക്ഷയ്ക്കു വിധിക്കാനായി
  rationale: κρίμα എന്നതിലെ ന്യായവിധി/ശിക്ഷാവിധി എന്ന നിയമപരമായ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘മരണവിധിയിലേക്ക്’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
- source_word: ἐσταύρωσαν
  choice: അവനെ ക്രൂശിക്കുകയും ചെയ്തു
  rationale: ഗ്രീക്കിലെ സജീവക്രിയയും നേതാക്കൾക്കു നേരിട്ട് ചുമത്തുന്ന ഉത്തരവാദിത്വവും സംരക്ഷിക്കുന്നു; റോമാക്കാർ മുഖേന നടപ്പാക്കിയെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ വധത്തിലെ കർത്തൃത്വവും ഉത്തരവാദിത്വവും
  choice: ‘അവനെ ക്രൂശിക്കുകയും ചെയ്തു’ എന്ന നേരിട്ടുള്ള കർത്തൃത്വപ്രയോഗം
  alternative: ‘അവനെ ക്രൂശിപ്പിക്കുകയും ചെയ്തു’
  rationale: മുഖ്യപുരോഹിതന്മാരും ഭരണാധികാരികളും കർത്താവായുള്ള സജീവ ബഹുവചനക്രിയയാണ് ഗ്രീക്കിൽ. നേരിട്ടുള്ള രൂപം അവരുടെ ഉത്തരവാദിത്വം നിലനിർത്തുന്നു; ‘ക്രൂശിപ്പിച്ചു’ ചരിത്രപരമായ ഇടനില വ്യക്തമാക്കുമെങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനഭാവം ചേർക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിന്റെ വ്യാകരണത്തുടർച്ചയായതിനാൽ അവസാനിപ്പിക്കുന്ന പൂർണ്ണവിരാമം ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
