  text: ὑμεῖς ⸀ἐστε μάρτυρες τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
translation:
  language: ml
  text: നിങ്ങൾ ഇവയുടെ സാക്ഷികളാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങൾ ഈ കാര്യങ്ങളുടെ സാക്ഷികളാണ്’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ സൂചകസർവനാമം യേശു തൊട്ടുമുമ്പ് പറഞ്ഞ സംഭവങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന സർവനാമം ഗ്രീക്കിൽ വ്യക്തമായി നൽകിയിരിക്കുന്നതിനാൽ കർത്താവായ ശിഷ്യരെ നേരിട്ട് ഊന്നിപ്പറയുന്നു. ആധുനിക മലയാളത്തിൽ ‘നിങ്ങൾ’ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു; ‘നിങ്ങൾതന്നെ’ എന്നത് സാധ്യമെങ്കിലും ഇവിടെ ആവശ്യമില്ലാത്ത അധിക ഊന്നൽ വരുത്താം.
- source_word: ἐστε
  choice: ആകുന്നു
  rationale: ‘ആയിരിക്കുന്നു/ആകുന്നു’ എന്ന അർഥമുള്ള വർത്തമാനകാല നിർദേശകരൂപം. ‘സാക്ഷികളാകുന്നു’ എന്ന പ്രയോഗം തിരിച്ചറിയലിനെയും നിലവിലെ നിലയെയും ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μάρτυρες
  choice: സാക്ഷികൾ
  rationale: കണ്ടതും കേട്ടതുമായ കാര്യങ്ങളെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കുന്നവരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘സാക്ഷികൾ’ എന്നത് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാള തുല്യപദമാണ്; പിൽക്കാലത്തെ ‘രക്തസാക്ഷി’ എന്ന സാങ്കേതിക അർഥം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: τούτων
  choice: ഇവയുടെ
  rationale: ഈ ജനിറ്റീവ് ബഹുവചന സൂചകസർവനാമം യേശു തൊട്ടുമുമ്പ് പറഞ്ഞ സംഭവങ്ങളിലേക്കാണ് തിരിഞ്ഞുനോക്കുന്നത്. ‘ഇവയുടെ’ ഗ്രീക്കിലെ സംക്ഷിപ്തതയും യഥാർഥമായ സൂചനാത്മക അനിശ്ചിതത്വവും നിലനിർത്തുന്നു; കൂടുതൽ വിശദമായ ‘ഈ കാര്യങ്ങളുടെ’ എന്നതും സാധ്യമാണ്.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ μάρτυρες എന്ന പങ്കിന്റെ അർഥവ്യാപ്തി
  choice: യേശു തൊട്ടുമുമ്പ് വിവരിച്ച സംഭവങ്ങളെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കുന്നവരായി ശിഷ്യരെ തിരിച്ചറിയുന്നു.
  alternative: പിൽക്കാല ക്രൈസ്തവ പ്രയോഗത്തിലെ രക്തസാക്ഷിത്വത്തിന്റെ അർഥവും ഈ പദത്തിൽ വായിക്കുക.
  rationale: ഈ ഉടൻസന്ദർഭത്തിൽ യേശുവിന്റെ കഷ്ടാനുഭവം, ഉയിർപ്പ്, പ്രസംഗിക്കപ്പെടേണ്ട സന്ദേശം എന്നിവയെക്കുറിച്ചുള്ള സാക്ഷ്യമാണ് പ്രധാനം. അതിനാൽ പിൽക്കാലത്തെ രക്തസാക്ഷിത്വസംബന്ധമായ സാങ്കേതിക അർഥം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തതയും ഊന്നലും നിലനിർത്തി; വായനാസൗകര്യത്തിനായി പാദക്കുറിപ്പിൽ സൂചിതവസ്തു വ്യക്തമാക്കി.
