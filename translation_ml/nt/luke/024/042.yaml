  text: And they gave him a piece of broiled fish[a].
translation:
  language: ml
  text: അവർ അവനു ചുട്ട മീനിന്റെ ഒരു കഷണം കൊടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പിൽക്കാലത്തെ ചില കൈയെഴുത്തുപ്രതികൾ, “തേൻകട്ടയിൽനിന്ന് ഒരു ഭാഗവും” എന്നു ചേർക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ δὲ
  choice: അപ്പോൾ അവർ
  rationale: οἱ ഇവിടെ നാമപദമായി ‘അവർ’ എന്നു വരുന്നു; δέ മൃദുവായ ആഖ്യാനബന്ധകമാണ്. സന്ദർഭത്തിലെ തുടർച്ച സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: ἐπέδωκαν
  choice: കൊടുത്തു
  rationale: ἐπιδίδωμι എന്ന ക്രിയയുടെ സന്ദർഭാർഥം കൊടുക്കുക/കൈമാറുക എന്നതാണ്; ‘കൊടുത്തു’ ലളിതവും നേരിട്ടുമാണ്.
- source_word: αὐτῷ
  choice: അവനു
  rationale: ദാതൃവിഭക്തിയിലുള്ള പരോക്ഷ കർമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവനു’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: ചുട്ട മീനിന്റെ ഒരു കഷണം
  rationale: μέρος എന്നത് ‘കഷണം/ഭാഗം’ എന്നും ἰχθύος ὀπτοῦ ചുട്ട മീനിനെ സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് ഘടനയുമാണ്. മലയാളത്തിൽ ഈ ബന്ധം ‘ചുട്ട മീനിന്റെ ഒരു കഷണം’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: ὀπτοῦ
  choice: ചുട്ട
  rationale: ὀπτός തീയിൽ ചുട്ടോ വറുത്തോ പാകപ്പെടുത്തിയതിനെ സൂചിപ്പിക്കുന്നു. പാചകരീതിയെ അനാവശ്യമായി കൂടുതൽ നിർണ്ണയിക്കാതെ ‘ചുട്ട’ മൂലപദത്തിന്റെ അർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ലൂക്കോസ് 24:42-ന്റെ പാഠരൂപം
  choice: SBLGNT പാഠത്തിലുള്ള ‘ചുട്ട മീനിന്റെ ഒരു കഷണം’ മാത്രം മുഖ്യവാക്യത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: പിൽക്കാലത്തെ ചില കൈയെഴുത്തുപ്രതികൾ ‘തേൻകട്ടയുടെ ഒരു ഭാഗവും’ എന്നു ചേർക്കുന്നു.
  rationale: നൽകിയിരിക്കുന്ന വിമർശനപാഠം μέρος എന്ന പദത്തിൽ അവസാനിക്കുന്നു. അതിനാൽ മുഖ്യപാഠം അതനുസരിച്ചാണ്; ദീർഘമായ പാഠഭേദം സുതാര്യതയ്ക്കായി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ചുട്ട’ എന്ന പദം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; മൂലത്തിലെ പാചകരീതിയെ അതിരുകടന്ന് നിർണ്ണയിക്കുന്നില്ല. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാക്യത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
