id: LUK.24.35
reference: Luke 24:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐξηγοῦντο τὰ ἐν τῇ ὁδῷ καὶ ὡς ἐγνώσθη αὐτοῖς ἐν τῇ κλάσει τοῦ ἄρτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: ml
  text: അവർതന്നെ വഴിയിൽ നടന്ന കാര്യങ്ങളും, അപ്പം നുറുക്കുമ്പോൾ[b] അവൻ അവർക്കു എങ്ങനെ അറിയപ്പെട്ടുവെന്നും[a] വിവരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവർ അവനെ തിരിച്ചറിഞ്ഞുവെന്നും.” ഗ്രീക്കിൽ കർമണിപ്രയോഗമാണ്; അത് അവർ അവനെ തിരിച്ചറിഞ്ഞതിലോ അവൻ അവർക്കു അറിയപ്പെട്ടതിലോ ഊന്നൽ നൽകാം.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, “അപ്പം നുറുക്കുന്നതിൽ.” ഗ്രീക്ക് പ്രയോഗം കൂടുതൽ പൊതുവായ അർത്ഥത്തിലും വായിക്കാം; എങ്കിലും സന്ദർഭത്തിലെ പ്രത്യേക ഭക്ഷണവേളയോടു ചേർന്ന ‘അപ്പം’ എന്ന വായനയാണ് ഇവിടെ സ്വീകരിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: അവർതന്നെ
  rationale: വ്യക്തമായി ചേർത്തിരിക്കുന്ന സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും, ഈ രണ്ടു ശിഷ്യന്മാർ ഇപ്പോൾ സ്വന്തം അനുഭവം വിവരിക്കുന്നു എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐξηγοῦντο
  choice: വിവരിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ വിവരണത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: വഴിയിൽ നടന്ന കാര്യങ്ങൾ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത പ്രയോഗത്തിൽ സന്ദർഭം സൂചിപ്പിക്കുന്ന ‘സംഭവിച്ചവ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിനായി വ്യക്തമാക്കുന്നു.
- source_word: ὡς
  choice: എങ്ങനെ
  rationale: അറിയപ്പെട്ടതിന്റെ രീതിയെയോ സംഭവത്തെയോ അവരുടെ വിവരണത്തിന്റെ ഉള്ളടക്കമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐγνώσθη
  choice: അവർക്കു അറിയപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തി, ശിഷ്യന്മാരുടെ തിരിച്ചറിവിനും അവൻ അവർക്കു അറിയിക്കപ്പെട്ടതിനുമിടയിലെ അർത്ഥസാധ്യത തുറന്നുവയ്ക്കുന്നു.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: അപ്പം നുറുക്കുന്നതിൽവെച്ച്
  rationale: കൃത്യമായ ഭക്ഷണസന്ദർഭവുമായി ബന്ധമുള്ള ‘അപ്പം നുറുക്കൽ’ എന്ന പ്രവർത്തിയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐγνώσθη എന്ന കർമണിരൂപം മനുഷ്യരുടെ തിരിച്ചറിവായി മാത്രം പരിഭാഷപ്പെടുത്തണമോ, അവൻ അവർക്കു അറിയിക്കപ്പെട്ടുവെന്ന സൂക്ഷ്മത നിലനിർത്തണമോ
  choice: അവൻ അവർക്കു അറിയപ്പെട്ടു
  alternative: അവർ അവനെ തിരിച്ചറിഞ്ഞു
  rationale: കർമണിരൂപം നിലനിർത്തുന്നത് തിരിച്ചറിവ് ശിഷ്യന്മാരുടെ ഗ്രഹണം മാത്രമായിരുന്നോ, അവർക്കു ലഭിച്ച വെളിപ്പെടുത്തലുമായും ബന്ധപ്പെട്ടിരുന്നോ എന്ന ലൂക്കോസിന്റെ ആഖ്യാനപരമായ പിരിമുറുക്കം തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അവർതന്നെ’ എന്ന രൂപം ഊന്നൽ നിലനിർത്തുന്നു; ‘അറിയപ്പെട്ടു’ അല്പം ഔപചാരികമായിരുന്നാലും മൂലത്തിലെ കർമണിത്വവും ദൈവശാസ്ത്രപരമായ അർത്ഥതുറപ്പും സംരക്ഷിക്കുന്നു.
