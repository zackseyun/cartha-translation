  yaml_path: translation/nt/luke/019/045.yaml
  text: And entering the temple[a], he began to drive out those who were selling,
translation:
  language: ml
  text: അവൻ ദൈവാലയത്തിൽ[a] പ്രവേശിച്ച് വിൽക്കുകയായിരുന്നവരെ പുറത്താക്കാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവാലയമുറ്റത്ത്’ അല്ലെങ്കിൽ ‘ദൈവാലയപരിസരത്ത്’. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദമായ ἱερόν ആന്തരിക വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, മുഴുവൻ ദൈവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: പ്രവേശിച്ച്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle സൂചിപ്പിക്കുന്ന മുൻക്രമത്തിലുള്ള പ്രവർത്തനം സ്വാഭാവികമായ മലയാള ക്രിയാവിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: ἱερὸν
  choice: ദൈവാലയം
  rationale: ἱερόν ആന്തരിക വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, വിശാലമായ ദൈവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യപാഠത്തിൽ പൊതുവായി മനസ്സിലാകുന്ന ‘ദൈവാലയം’ ഉപയോഗിച്ച് സ്ഥലപരമായ കൃത്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἤρξατο
  choice: തുടങ്ങി
  rationale: infinitive-നോടുകൂടിയ ἄρχομαιയുടെ ആരംഭസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐκβάλλειν
  choice: പുറത്താക്കാൻ
  rationale: ബലമായ നീക്കം സൂചിപ്പിക്കുന്ന ἐκβάλλωയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: πωλοῦντας
  choice: വിൽപ്പന നടത്തിയിരുന്നവരെ
  rationale: വിൽക്കുന്ന പ്രവൃത്തിയിൽ ഏർപ്പെട്ടിരുന്ന ആളുകളെയാണ് present participle സൂചിപ്പിക്കുന്നത്; എന്താണ് വിറ്റതെന്ന് മൂലപാഠം പറയാത്തതിനാൽ അത് കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ പ്രവർത്തനം നടന്ന സ്ഥലവുമായി ബന്ധപ്പെട്ട ἱερόν എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ദൈവാലയം’; ദൈവാലയസമുച്ചയം എന്ന വിശാല അർഥത്തിൽ
  alternative: ദൈവാലയാങ്കണം; ദൈവാലയപരിസരം; വിശുദ്ധമന്ദിരം
  rationale: ἱερόν സാധാരണയായി മുഴുവൻ ദൈവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആന്തരിക വിശുദ്ധമന്ദിരത്തിനുള്ള പദം ναός ആണ്. വായനാസൗകര്യത്തിനായി മുഖ്യപാഠത്തിൽ ‘ദൈവാലയം’ നിലനിർത്തി കൃത്യമായ സ്ഥലസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പ്രവേശിച്ച്’ എന്നത് ഗ്രീക്ക് participle-ന്റെ ക്രമബന്ധം ലളിതമായി നൽകുന്നു; ‘അവിടെ’ മലയാളത്തിൽ സ്ഥലബന്ധം വ്യക്തമാക്കാനായി ചേർത്തതാണ്.
