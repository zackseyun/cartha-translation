  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἰπὼν ταῦτα ἐπορεύετο ἔμπροσθεν ἀναβαίνων εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: ml
  text: ഇതെല്ലാം പറഞ്ഞശേഷം, യെരൂശലേമിലേക്കു കയറിക്കൊണ്ട് അദ്ദേഹം മുന്നേ പൊയ്ക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനത്തുടർച്ച വാക്യക്രമംകൊണ്ടുതന്നെ വ്യക്തമാകുന്നതിനാൽ തുടക്കത്തിലെ സംയോജകം പ്രത്യേകം ചേർത്തില്ല.
- source_word: εἰπὼν ταῦτα
  choice: ഇതെല്ലാം പറഞ്ഞശേഷം
  rationale: അഒറിസ്റ്റ് കൃുദന്തത്തിന്റെ മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തനം ‘പറഞ്ഞശേഷം’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ഇതെല്ലാം’ മുൻപ്രസംഗത്തെ വിശാലമായി സൂചിപ്പിക്കുകയും ബഹുവചനഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐπορεύετο
  choice: നടന്നുകൊണ്ട് ... കയറിപ്പോയി
  rationale: സന്ദർഭത്തിലെ യാത്രയും അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടരുന്ന ചലനവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἔμπροσθεν
  choice: മുന്നിൽ
  rationale: യേശു കൂടെയുണ്ടായിരുന്നവർക്കു മുമ്പായി സഞ്ചരിച്ചതെന്ന അർത്ഥം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀναβαίνων
  choice: കയറിപ്പോയി
  rationale: യെരൂശലേമിലേക്കുള്ള കയറ്റത്തെ സൂചിപ്പിക്കുന്ന ഉറവിടപാഠത്തിലെ ദിശാഭാഷ നിലനിർത്തുന്നു.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിലേക്കു
  rationale: നഗരത്തിനകത്തേക്കുള്ള പ്രവേശനം നിർബന്ധമായി സൂചിപ്പിക്കാതെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യെരൂശലേമിലേക്കുള്ള യാത്രയിലെ ‘കയറുക’ എന്ന ഭാഷ നിലനിർത്തണമോ
  choice: ‘യെരൂശലേമിലേക്കു കയറിപ്പോയി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘യെരൂശലേമിലേക്കു യാത്രയായി’ / ‘യെരൂശലേമിലേക്കു പോയി’
  rationale: ἀναβαίνων എന്ന പദത്തിലെ യഥാർഥ കയറ്റഭാഷ ഭൂമിശാസ്ത്രപരമായ അർത്ഥത്തോടൊപ്പം ലൂക്കോസിന്റെ ആഖ്യാനത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാവവും തുറന്നുവയ്ക്കുന്നു; അധിക വ്യാഖ്യാനം ചേർക്കാതെ ഉറവിടത്തിന്റെ പദപ്രയോഗം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തവും മാന്യവുമായ മലയാളം. ‘അദ്ദേഹം’ എന്ന പ്രയോഗം യേശുവിനെ ആദരപൂർവം പരാമർശിക്കുന്നു; വാക്യത്തിന്റെ ചലനാത്മകതയ്ക്കായി ‘മുന്നിൽ നടന്നുകൊണ്ട്’ ഉപയോഗിച്ചു.
