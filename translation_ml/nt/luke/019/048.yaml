source:
  edition: SBLGNT
  text: καὶ οὐχ ⸀εὕρισκον τὸ τί ποιήσωσιν, ὁ λαὸς γὰρ ἅπας ἐξεκρέματο αὐτοῦ ἀκούων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: ml
  text: എന്തു ചെയ്യണമെന്നു അവർക്ക് കണ്ടെത്താനായില്ല; കാരണം ജനമെല്ലാം അവനെ ആകാംക്ഷയോടെ കേട്ടുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘ജനമെല്ലാം അവനെ കേട്ടുകൊണ്ട് അവനിൽ തൂങ്ങിക്കിടക്കുകയായിരുന്നു.’ ഇത് യേശുവിനെ അതീവ ആകാംക്ഷയോടെയും ഏകാഗ്രതയോടെയും ശ്രദ്ധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലിയാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: അവർക്ക് ഒരു വഴിയും കണ്ടെത്താനായില്ല
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണ ഭൂതകാലക്രിയ തുടർന്നുനിന്ന പരാജയമോ പ്രായോഗികമായ അശക്തിയോ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ഈ പ്രയോഗം അതു വ്യക്തമാക്കുന്നു.
- source_word: τὸ τί ποιήσωσιν
  choice: എന്തു ചെയ്യണമെന്ന്
  rationale: τίയും aorist subjunctive-ഉം ചേർന്ന ആലോചനാത്മക ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; അവർ അന്വേഷിച്ചിരുന്നത് സ്വീകരിക്കേണ്ട നടപടിയായിരുന്നു.
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: കാരണം ജനമെല്ലാം
  rationale: γάρ-ന്റെ കാരണസൂചകത്വം ‘കാരണം’ കൊണ്ടും ἅπας-ന്റെ സമഗ്രത ‘ജനമെല്ലാം’ കൊണ്ടും നിലനിർത്തുന്നു.
- source_word: ἐξεκρέματο αὐτοῦ
  choice: അവനിൽനിന്നു കേൾക്കുന്നതിൽ മുഴുകിയിരുന്നു
  rationale: പദശഃ ‘അവനിൽ തൂങ്ങിക്കിടന്നു’ എന്ന ഗ്രീക്ക് ശൈലി യേശുവിനോടുള്ള തീവ്രവും ആകാംക്ഷാഭരിതവുമായ ശ്രദ്ധയാണ് സൂചിപ്പിക്കുന്നത്. αὐτοῦ വ്യക്തിയെ തന്നെയാണ് സൂചിപ്പിക്കുന്നതെന്ന ബന്ധവും കേൾവിയുടെ സന്ദർഭവും ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ അർത്ഥം നൽകുന്നു.
- source_word: ἀκούων
  choice: കേൾക്കുന്നതിൽ
  rationale: വർത്തമാന കൃദന്തം ജനത്തിന്റെ ആഴത്തിലുള്ള ശ്രദ്ധ പ്രകടമായ രീതി—കേട്ടുകൊണ്ടിരിക്കുക—സൂചിപ്പിക്കുന്നു; കൂട്ടവാചകമായ λαός-നോട് മലയാളത്തിൽ യോജിക്കുന്ന വിധത്തിൽ ചേർത്തിരിക്കുന്നു.
