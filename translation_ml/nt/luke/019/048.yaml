translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് ശൈലിയുടെ പദാനുപദരൂപം മുഖ്യവാക്യത്തിൽ അസ്വാഭാവികമായതിനാൽ അർത്ഥം വ്യക്തമാക്കുന്ന പ്രയോഗം സ്വീകരിക്കുകയും മൂലരൂപം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
