revisions:
- from: എന്നാൽ എന്തു ചെയ്യണമെന്ന് അവർക്ക് ഒരു വഴിയും കണ്ടെത്താനായില്ല; കാരണം ജനമെല്ലാം അവനിൽനിന്നു കേൾക്കുന്നതിൽ മുഴുകിയിരുന്നു.[a]
  to: എന്തു ചെയ്യണമെന്നു അവർക്ക് കണ്ടെത്താനായില്ല; കാരണം ജനമെല്ലാം അവനെ ആകാംക്ഷയോടെ കേട്ടുകൊണ്ടിരുന്നു.[a]
  rationale: The revision removes an unwarranted adversative conjunction, retains the deliberative sense of “what they might do,” and renders the Greek idiom as eager listening directed toward Jesus. The footnote retains the more literal image and explains its idiomatic force.
