source:
  edition: SBLGNT
  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: ml
  text: അവൻ അടുത്തെത്തിയപ്പോൾ നഗരം കണ്ട്, അതിനെച്ചൊല്ലി[a] കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളെച്ചൊല്ലി’; ‘നഗരം’ എന്നതിനുള്ള ഗ്രീക്ക് പദവും അതിനോടു ചേരുന്ന സർവനാമവും സ്ത്രീലിംഗത്തിലാണ്. ഇവിടെ യെരൂശലേമിനെ ഒരു സ്ത്രീയായി വ്യക്തിവൽക്കരിച്ചിരിക്കാനുള്ള സാധ്യതയും ഈ വായന നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: അവൻ അടുത്തെത്തിയപ്പോൾ
  rationale: ἐγγίζω എന്നത് ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്നാണ്. സന്ദർഭത്തിൽ ലക്ഷ്യം വ്യക്തമായതിനാൽ അത് പ്രത്യേകം ചേർക്കാതെ, ὡς സൂചിപ്പിക്കുന്ന സമയബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἰδὼν
  choice: നഗരം കണ്ട്
  rationale: അയോറിസ്റ്റ് കൃതന്തം പ്രധാനക്രിയയ്ക്കു തൊട്ടുമുമ്പുള്ളതോ അതിനോടു ചേർന്നുനിൽക്കുന്നതോ ആയ കാഴ്ചയെ സൂചിപ്പിക്കുന്നു. ‘കണ്ട്’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ക്രിയാപ്രവാഹം നിലനിർത്തുന്നു.
- source_word: τὴν πόλιν
  choice: നഗരം
  rationale: πόλις എന്നതിന് നേരിട്ടുള്ള അർഥം ‘നഗരം’ എന്നാണ്. സന്ദർഭത്തിൽ യെരൂശലേം വ്യക്തമായതിനാൽ പേര് വിശദീകരണമായി മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἔκλαυσεν
  choice: കരഞ്ഞു
  rationale: κλαίω കരയുന്നതിനെയോ വിലപിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. ‘കരഞ്ഞു’ എന്നത് അധിക തീവ്രത ചേർക്കാതെ വികാരഭാരം സ്വാഭാവികവും മാന്യവുമായി അറിയിക്കുന്നു.
- source_word: ἐπ’ αὐτήν
  choice: അതിനെച്ചൊല്ലി
  rationale: κλαίω-യോടൊപ്പം ἐπί + accusative കരച്ചിലിന്റെ വിഷയത്തെയോ കാരണത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അതിനെച്ചൊല്ലി’ എന്നത് ‘നഗരത്തെക്കുറിച്ച്/നഗരത്തെ ഓർത്ത്’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘അതിന്മേൽ’ എന്ന പദാനുപദ വിവർത്തനത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: πόλις എന്ന സ്ത്രീലിംഗ നാമത്തോടു ചേരുന്ന αὐτήν എന്ന സർവനാമത്തിൽ യെരൂശലേമിന്റെ വ്യക്തിവൽക്കരണം വ്യക്തമാക്കണമോ
  choice: മുഖ്യവാക്യത്തിൽ ലിംഗനിരപേക്ഷമായ ‘അതിനെച്ചൊല്ലി’ ഉപയോഗിക്കുക
  alternative: ‘അവളെച്ചൊല്ലി’ എന്ന് നൽകി യെരൂശലേമിനെ സ്ത്രീയായി വ്യക്തിവൽക്കരിക്കുക
  rationale: ഗ്രീക്കിലെ സ്ത്രീലിംഗ സർവനാമം πόλις എന്ന നാമത്തിന്റെ വ്യാകരണലിംഗവുമായി സ്വാഭാവികമായി പൊരുത്തപ്പെടുന്നു; അതുകൊണ്ടുമാത്രം വ്യക്തിവൽക്കരണം നിർബന്ധമാകുന്നില്ല. ആ സാധ്യത മുഴുവനായി നഷ്ടപ്പെടാതിരിക്കാൻ അടിക്കുറിപ്പിൽ പകരം വായന നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘അതിനെച്ചൊല്ലി’ എന്ന പ്രയോഗം യേശുവിന്റെ വിലാപത്തിന്റെ വിഷയത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത തീവ്രതയോ വ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
