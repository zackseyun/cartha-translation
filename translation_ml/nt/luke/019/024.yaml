  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: ml
  text: 'അവൻ സമീപത്തു നിന്നവരോട് പറഞ്ഞു: “അവനിൽനിന്ന് ആ മിനാ[a] എടുത്ത് പത്തു മിനാ ഉള്ളവനു കൊടുക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി “പൗണ്ട്” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്. ഗ്രീക്ക് പദം പുരാതനമായ ‘മിനാ’ എന്ന നാണയമൂല്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεστῶσιν
  choice: സമീപത്തു നിന്നവരോട്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കർത്തൃപ്രയോഗത്തിലുള്ള കൃതന്തം സമീപത്ത് സന്നിഹിതരായി നിൽക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; ദൃശ്യത്തിന്റെ മൂർത്തതയും സ്വാഭാവിക മലയാളവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: അവനിൽനിന്ന് ... എടുത്ത്
  rationale: αἴρω ഇവിടെ ‘നീക്കുക/എടുത്തുകളയുക’ എന്ന വേർപെടുത്തൽ അർഥത്തിലാണ്; ἀπό കൂടിയതിനാൽ ‘അവനിൽനിന്ന് എടുത്ത്’ എന്നത് കല്പനയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μνᾶν
  choice: മിനാ
  rationale: പുരാതന നാണയമൂല്യത്തിന്റെ പേര് ലിപ്യന്തരണം ചെയ്ത് ചരിത്രപരമായ പശ്ചാത്തലം സംരക്ഷിക്കുന്നു; ആധുനിക നാണയവുമായി തെറ്റായ തുല്യത സൃഷ്ടിക്കുന്നില്ല.
- source_word: δότε
  choice: കൊടുക്കുക
  rationale: δίδωμι എന്ന ക്രിയയുടെ ലളിതമായ കൈമാറ്റാർഥം നേരായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῷ τὰς δέκα μνᾶς ἔχοντι
  choice: പത്തു മിനാ ഉള്ളവനു
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കൃതന്തത്തിന്റെ ‘ഉള്ളവൻ’ എന്ന വ്യക്തിസൂചന നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത അധിക നാമം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: μνᾶ എന്ന പുരാതന നാണയമൂല്യത്തിന്റെ പരിഭാഷ
  choice: മിനാ
  alternative: പൗണ്ട്
  rationale: ഗ്രീക്ക് പദം നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നത് പുരാതന അളവിനെ സംരക്ഷിക്കുന്നു; ‘പൗണ്ട്’ ആധുനിക നാണയമോ കൃത്യമായ സമമൂല്യമോ ആണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സമീപത്തു നിന്നവർ’ എന്ന പ്രയോഗം രംഗത്തിന്റെ ദൃശ്യസ്വഭാവം നിലനിർത്തുന്നു; കല്പനകൾ മലയാളത്തിൽ സ്വാഭാവികമായ ഏക കല്പനാശൃംഖലയായി നൽകിയിരിക്കുന്നു.
