source:
  edition: SBLGNT
  text: καὶ ἐζήτει ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν, καὶ οὐκ ἠδύνατο ἀπὸ τοῦ ὄχλου ὅτι τῇ ἡλικίᾳ μικρὸς ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: ml
  text: യേശു ആരാണെന്ന് കാണാൻ അദ്ദേഹം ശ്രമിച്ചുകൊണ്ടിരുന്നു; എന്നാൽ ജനക്കൂട്ടം കാരണം അദ്ദേഹത്തിന് കാണാൻ കഴിഞ്ഞില്ല, കാരണം അദ്ദേഹം ഉയരം കുറഞ്ഞവനായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അദ്ദേഹം പൊക്കക്കുറവുള്ളവനായിരുന്നു.’ ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ ശരീരഘടനയിൽ ചെറിയവൻ എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് പ്രായത്തെയല്ല, ശാരീരിക ഉയരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτει
  choice: ശ്രമിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്ന ശ്രമത്തെ സൂചിപ്പിക്കുന്നു; വെറും ആഗ്രഹത്തേക്കാൾ ശ്രമം എന്ന ആശയം ഈ പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἰδεῖν
  choice: കാണാൻ
  rationale: ζητέω എന്ന ക്രിയയോടുചേർന്ന ഈ അനന്തക്രിയാരൂപം ശ്രമത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
- source_word: τίς ἐστιν
  choice: യേശു ആരാണെന്ന്
  rationale: ഈ വാക്കുകൾ വ്യക്തിയുടെ തിരിച്ചറിയലിനെയോ അദ്ദേഹം എങ്ങനെയുള്ള ആളാണെന്നതിനെയോ സൂചിപ്പിക്കാം. മലയാളത്തിലെ ഈ പ്രയോഗം ഗ്രീക്കിലെ അർത്ഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: οὐκ ἠδύνατο
  choice: അദ്ദേഹത്തിനു കാണാൻ കഴിഞ്ഞില്ല
  rationale: കഴിവില്ലായ്മയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; കാണുക എന്ന ക്രിയ സന്ദർഭത്തിൽ ആവർത്തിക്കുന്നത് വ്യക്തത നൽകുന്നു.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: ജനക്കൂട്ടം നിമിത്തം
  rationale: ἀπό ഇവിടെ തടസ്സമായ കാരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നിമിത്തം’ ഗൗരവമുള്ളതും വ്യക്തവുമായ കാരണപ്രയോഗമാണ്.
- source_word: ὅτι
  choice: കാരണം
  rationale: കാണാൻ കഴിയാതിരുന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി വ്യക്തമായ മലയാളപ്രയോഗം.
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: ഉയരം കുറഞ്ഞവനായിരുന്നു
  rationale: ἡλικία പ്രായത്തെയോ ശരീരവലുപ്പത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും ജനക്കൂട്ടം കാഴ്ച തടഞ്ഞ ഈ സന്ദർഭം ശരീരത്തിന്റെ ഉയരത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്.
