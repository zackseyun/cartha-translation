translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ഭാഷ ഉപയോഗിച്ചു. സക്കായിയെ സൂചിപ്പിക്കാൻ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു; തുടർന്നുകൊണ്ടിരുന്ന ശ്രമം വ്യക്തമാക്കാൻ ‘ശ്രമിച്ചുകൊണ്ടിരുന്നു’ എന്നും ശരീരത്തിന്റെ ഉയരം കൃത്യമായി അറിയിക്കാൻ ‘ഉയരം കുറഞ്ഞവൻ’ എന്നും പരിഭാഷപ്പെടുത്തി.
