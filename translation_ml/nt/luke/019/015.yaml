id: LUK.19.15
reference: Luke 19:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: ml
  text: അങ്ങനെ, അവൻ രാജാധികാരം[a] ലഭിച്ചു മടങ്ങിവന്നപ്പോൾ, താൻ പണം കൊടുത്തിരുന്ന ആ അടിമകളെ[b] തന്റെ അടുക്കൽ വിളിച്ചുവരുത്താൻ കല്പിച്ചു. അവർ വ്യാപാരത്തിലൂടെ എന്തു നേടിയെന്ന്[c] അറിയാനായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘രാജ്യം’ അല്ലെങ്കിൽ ‘രാജത്വം.’ ഇവിടെ ഗ്രീക്ക് പദം പ്രത്യേകിച്ച് രാജാവായി ഭരിക്കാനുള്ള അധികാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ദാസന്മാരെ.’ ഗ്രീക്ക് പദം സന്ദർഭമനുസരിച്ച് അടിമകളെയോ ദാസന്മാരെയോ സൂചിപ്പിക്കാം; ഇവിടെ അവരുടെ ബന്ധിതപദവി മുൻനിർത്തിയാണ് ‘അടിമകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘എന്തു വ്യാപാരം നടത്തിയെന്ന്’ അല്ലെങ്കിൽ ‘എന്തു ലാഭമുണ്ടാക്കിയെന്ന്.’ ഗ്രീക്ക് ക്രിയ വ്യാപാരപ്രവർത്തനത്തെയും അതിന്റെ ഫലത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: അങ്ങനെ
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനത്തിലെ സംഭവപരമ്പര സൂചിപ്പിക്കുന്ന സൂത്രപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: അവൻ ... മടങ്ങിവന്നപ്പോൾ
  rationale: ἐν സഹിതമുള്ള articular infinitive ഇവിടെ കാലസൂചനയാണ്; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: λαβόντα τὴν βασιλείαν
  choice: രാജാധികാരം ലഭിച്ചു
  rationale: പങ്കാളിക്രിയ പ്രധാന സംഭവത്തിനു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഉപമയുടെ രാഷ്ട്രീയസന്ദർഭത്തിൽ βασιλεία ഇവിടെ ഭൂപ്രദേശത്തേക്കാൾ രാജഭരണാധികാരത്തെയാണ് മുൻനിർത്തുന്നത്.
- source_word: φωναθῆναι αὐτῷ
  choice: തന്റെ അടുക്കൽ വിളിച്ചുവരുത്താൻ
  rationale: ഇവിടെയുള്ള കർമണിപ്രയോഗം ആളുകളെ തന്റെ സന്നിധിയിലേക്ക് വിളിപ്പിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: δούλους
  choice: അടിമകളെ
  rationale: പ്രഭുവിന്റെ അധികാരത്തിൻ കീഴിലുള്ള ബന്ധിത സാമൂഹികപദവി ഇവിടെ പ്രസക്തമായതിനാൽ ‘അടിമകൾ’ മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘ദാസന്മാർ/വേലക്കാർ’ എന്നതും സന്ദർഭാനുസൃതമായി സാധ്യമാണ്.
- source_word: δεδώκει τὸ ἀργύριον
  choice: പണം കൊടുത്തിരുന്ന
  rationale: പണം മുമ്പേ കൊടുത്തുകഴിഞ്ഞ പ്രവൃത്തിയാണെന്ന് pluperfect വ്യക്തമാക്കുന്നു; ἀργύριον ഇവിടെ പൊതുവായി പണം എന്ന അർഥത്തിലാണ്.
- source_word: ἵνα γνοῖ
  choice: അറിയാനായിരുന്നു
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵνα-clause മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: τί διεπραγματεύσαντο
  choice: വ്യാപാരത്തിലൂടെ എന്തു നേടിയെന്ന്
  rationale: ക്രിയ വ്യാപാരപ്രവർത്തനത്തെയും അതിന്റെ ഫലത്തെയും ഉൾക്കൊള്ളുന്നു; ഈ പരിഭാഷ രണ്ടും സൂചിപ്പിക്കുമ്പോൾ ലാഭത്തിന്റെ കൃത്യ അളവ് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος എന്ന സാമൂഹികപദം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / വേലക്കാർ
  rationale: ഈ കഥാപാത്രങ്ങൾ പ്രഭുവിന്റെ അധികാരത്തിൻ കീഴിലും അവന്റെ സ്വത്തിന്റെ ചുമതലയിലുമാണ്. അതിനാൽ പുരാതന ബന്ധിതപദവി മറച്ചുവയ്ക്കാത്ത ‘അടിമകൾ’ തിരഞ്ഞെടുത്തു; ഇതിലൂടെ പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചുമത്തുന്നില്ല.
- issue: βασιλεία എന്നതിന്റെ രാഷ്ട്രീയ അർഥം
  choice: രാജാധികാരം
  alternative: രാജ്യം / രാജത്വം
  rationale: ഈ ഉപമയിൽ പ്രഭു യാത്രചെയ്ത് നേടുന്നത് ഭരണാവകാശമാണ്. അതിനാൽ ഒരു ഭൂപ്രദേശം ഏറ്റുവാങ്ങിയെന്ന ധാരണ ഒഴിവാക്കി സന്ദർഭാർഥം വ്യക്തമാക്കി; പദത്തിന്റെ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: διεπραγματεύσαντο എന്ന ക്രിയയിൽ പ്രവർത്തനമോ ഫലമോ ഏതാണ് മുൻനിർത്തുന്നത്
  choice: വ്യാപാരത്തിലൂടെ എന്തു നേടിയെന്ന്
  alternative: എന്തു വ്യാപാരം നടത്തിയെന്ന് / എന്തു ലാഭമുണ്ടാക്കിയെന്ന്
  rationale: ഗ്രീക്ക് ക്രിയ വ്യാപാരത്തിൽ ഏർപ്പെടുന്നതും അതിലൂടെ ഉണ്ടായ ഫലവും സൂചിപ്പിക്കാം. പ്രധാനവാചകം ഇരുവശവും ഉൾക്കൊള്ളുന്ന വിധത്തിൽ വെച്ച് അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വിളിച്ചുവരുത്താൻ കല്പിച്ചു’ എന്നത് അധികാരബന്ധം വ്യക്തമാക്കുന്നു; സാങ്കേതികമോ മതവിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
