id: LUK.19.44
reference: Luke 19:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: ml
  text: നിന്നെയും നിന്റെ ഉള്ളിലെ മക്കളെയും അവർ നിലംപരിശാക്കും; നിന്റെ ഉള്ളിൽ ഒരു കല്ലിന്മേൽ മറ്റൊരു കല്ല് ശേഷിപ്പിക്കുകയുമില്ല. കാരണം, നിന്നെ സന്ദർശിച്ച സമയം[a] നീ തിരിച്ചറിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്നെ പരിശോധിച്ച സമയം.’ ഗ്രീക്ക് പദത്തിന് സന്ദർശനം എന്നോ പരിശോധന എന്നോ അർഥമാകാം; പ്രത്യേകിച്ച് കരുണയോ ന്യായവിധിയോ കൊണ്ടുവരാവുന്ന ദൈവിക സന്ദർശനത്തെ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: നിലംപരിചാക്കും
  rationale: നിലത്തോളം ഇടിച്ചുതകർക്കുക, പൂർണമായി തകർക്കുക എന്ന ശക്തമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: σε
  choice: നിന്നെ
  rationale: യെരൂശലേമിനെ വ്യക്തിയായി അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷ ഏകവചന രൂപം നിലനിർത്തുന്നു; ‘നിന്റെ നഗരം’ എന്നു വിശദീകരിച്ച് അർഥം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: τὰ τέκνα σου ἐν σοί
  choice: നിന്റെ ഉള്ളിലുള്ള മക്കളെ
  rationale: നഗരത്തിലെ നിവാസികളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നതെങ്കിലും, τέκνα എന്നതിലെ ‘മക്കൾ’ എന്ന രൂപകവും നഗരത്തെ മാതാവായി കാണുന്ന വ്യക്തിവൽക്കരണവും സംരക്ഷിക്കുന്നു.
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: നിന്റെ ഉള്ളിൽ ഒരു കല്ലിന്മേൽ മറ്റൊരു കല്ല് ശേഷിപ്പിക്കുകയുമില്ല
  rationale: സമ്പൂർണ നാശത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും ἐν σοί വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀνθ’ ὧν
  choice: കാരണം
  rationale: ഇവിടെ ന്യായവിധിക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന കാരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἔγνως
  choice: തിരിച്ചറിഞ്ഞില്ല
  rationale: ദൈവത്തിന്റെ നിർണായക പ്രവർത്തനത്തെ ഗ്രഹിക്കാതെപോയത് എന്ന സന്ദർഭാർഥം ‘അറിഞ്ഞില്ല’ എന്നതിനെക്കാൾ കൃത്യമായി നൽകുന്നു.
- source_word: καιρὸν
  choice: സമയം
  rationale: സവിശേഷവും നിർണായകവുമായ കാലത്തെ സൂചിപ്പിക്കുന്ന καιρός എന്ന പദത്തിന് ലളിതവും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: τῆς ἐπισκοπῆς σου
  choice: നിന്നെ സന്ദർശിച്ച സമയം
  rationale: ἐπισκοπήയിലെ സന്ദർശനം/പരിശോധന എന്ന അർഥവ്യാപ്തിയിൽ പ്രധാനമായ ‘സന്ദർശനം’ നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘നിന്റെ സന്ദർശനം’ സന്ദർശിക്കുന്നത് നീയാണെന്ന തെറ്റായ ധാരണ നൽകാമെന്നതിനാൽ, σου എന്നതിന്റെ ലക്ഷ്യബന്ധം ‘നിന്നെ സന്ദർശിച്ച’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; സന്ദർശകൻ ദൈവമാണെന്ന് മുഖ്യപാഠത്തിൽ തുറന്നുപറയുന്നില്ല.
theological_decisions:
- issue: ന്യായവിധിയുടെ സന്ദർഭത്തിൽ ἐπισκοπή എന്നതിന്റെ അർഥം
  choice: ‘നിന്നെ സന്ദർശിച്ച സമയം’ എന്നു നൽകി ദൈവിക സന്ദർശനത്തിന്റെ സൂചന പരോക്ഷമായി നിലനിർത്തുന്നു
  alternative: ‘നിന്നെ പരിശോധിച്ച സമയം’ അല്ലെങ്കിൽ ‘ദൈവം നിന്നെ സന്ദർശിച്ച സമയം’
  rationale: ഈ പദത്തിന് കരുണയോ ന്യായവിധിയോ ഉൾക്കൊള്ളാവുന്ന ദൈവിക സന്ദർശനം/പരിശോധന എന്ന അർഥവ്യാപ്തിയുണ്ട്. ‘സന്ദർശിച്ച’ എന്നത് ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു; ‘ദൈവം’ എന്നു ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ വ്യക്തീകരിക്കുകയും ‘പരിശോധിച്ച’ എന്നത് അർഥത്തെ ന്യായവിധിയിലേക്കു ചുരുക്കുകയും ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. യെരൂശലേമിന്റെ വ്യക്തിവൽക്കരണവും ‘മക്കൾ’ എന്ന രൂപകവും നിലനിർത്തിയിരിക്കുന്നു. ആവർത്തിക്കുന്ന ‘നിന്റെ ഉള്ളിൽ’ എന്ന ഘടകം മൂലപാഠത്തിന്റെ ഊന്നലിനായി സംരക്ഷിച്ചു.
