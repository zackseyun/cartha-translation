  text: καὶ ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν, καὶ ἐπιρίψαντες ⸀αὐτῶν τὰ ἱμάτια ἐπὶ τὸν πῶλον ἐπεβίβασαν τὸν Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: ml
  text: അവർ അതിനെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു.[a] പിന്നെ തങ്ങളുടെ മേലങ്കികൾ കഴുതക്കുട്ടിയുടെ[b] മേൽ ഇട്ടശേഷം യേശുവിനെ അതിന്മേൽ കയറ്റി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് സർവനാമം പുല്ലിംഗമാണ്, അത് കഴുതക്കുട്ടിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കുപദം പൊതുവേ ഒരു ഇളം മൃഗത്തെ സൂചിപ്പിക്കാം; ചുറ്റുമുള്ള സന്ദർഭത്തിൽ ഇത് കഴുതയുടെ കുട്ടിയാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: ἤγαγον
  choice: കൊണ്ടുവന്നു
  rationale: ἄγω എന്ന ക്രിയ ഇവിടെ കഴുതക്കുട്ടിയെ യേശുവിന്റെ അടുക്കലേക്ക് എത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: αὐτὸν
  choice: അതിനെ
  rationale: ഗ്രീക്കിൽ സർവനാമം പുല്ലിംഗമാണെങ്കിലും അത് മുൻസന്ദർഭത്തിലെ πῶλος എന്ന മൃഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ മൃഗത്തെ സൂചിപ്പിക്കാൻ ‘അതിനെ’ സ്വാഭാവികമാണ്.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: യേശുവിന്റെ അടുക്കൽ
  rationale: πρός സഹിതമുള്ള ദ്വിതീയാവിഭക്തി ഒരു വ്യക്തിയിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു.
- source_word: ἐπιρίψαντες
  choice: ഇട്ടശേഷം
  rationale: ഭൂതകാല പങ്കാളിക്രിയ പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ഇട്ടശേഷം’ ആ ക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: തങ്ങളുടെ മേലങ്കികൾ
  rationale: ἱμάτια പുറമേ ധരിക്കുന്ന വസ്ത്രങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘മേലങ്കികൾ’ സന്ദർഭത്തിന് കൃത്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: ἐπὶ τὸν πῶλον
  choice: കഴുതക്കുട്ടിയുടെ മേൽ
  rationale: ἐπί സഹിതമുള്ള ദ്വിതീയാവിഭക്തി മൃഗത്തിന്റെ മുകളിലേക്കുള്ള വസ്ത്രങ്ങളുടെ ഇടലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: πῶλον
  choice: കഴുതക്കുട്ടി
  rationale: πῶλος പൊതുവേ ഒരു ഇളം മൃഗത്തെ സൂചിപ്പിക്കാമെങ്കിലും ചുറ്റുമുള്ള വിവരണം ഇവിടെ കഴുതയുടെ കുട്ടിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἐπεβίβασαν
  choice: കയറ്റി
  rationale: ഈ ക്രിയ ഒരാളെ ഒരു മൃഗത്തിന്മേൽ കയറാൻ ഇടയാക്കുക എന്ന causative അർഥം വഹിക്കുന്നു; ‘കയറ്റി’ അത് സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: τὸν Ἰησοῦν
  choice: യേശുവിനെ
  rationale: Ἰησοῦς എന്ന വ്യക്തിനാമത്തിന്റെ നിലവാരമുള്ള മലയാളരൂപം വിഭക്തിയോടെ ഉപയോഗിച്ചു.
