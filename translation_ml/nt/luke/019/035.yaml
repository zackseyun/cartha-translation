translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ പ്രവർത്തനക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക സർവനാമപ്രയോഗവും causative ക്രിയാരൂപവും ഉപയോഗിച്ചു.
