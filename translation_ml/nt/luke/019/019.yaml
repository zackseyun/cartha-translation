id: LUK.19.19
reference: Luke 19:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ τούτῳ· Καὶ σὺ ⸂ἐπάνω γίνου⸃ πέντε πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/019.yaml
  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: ml
  text: 'അവൻ ഇവനോടും പറഞ്ഞു: “നീയും അഞ്ചു നഗരങ്ങളുടെ മേൽ അധികാരിയായിരിക്കൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: അവൻ ... പറഞ്ഞു
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ്; മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാതെയും അത് വ്യക്തമാണ്.
- source_word: καὶ τούτῳ
  choice: ഇവനോടും
  rationale: τούτῳ എന്ന നിർദ്ദേശകഭാവവും καί നൽകുന്ന ‘കൂടി/ഉം’ എന്ന അർഥവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: Καὶ σὺ
  choice: നീയും
  rationale: καί ഇവിടെ അഭിസംബോധന ചെയ്യപ്പെടുന്ന രണ്ടാമത്തെ ദാസനെയും ഉൾപ്പെടുത്തുന്നു; ‘നീയും’ ഗ്രീക്കിലെ ഊന്നലും മുൻവാക്യത്തോടുള്ള സമാന്തരതയും കാക്കുന്നു.
- source_word: ἐπάνω γίνου
  choice: മേൽ അധികാരിയായിരിക്കൂ
  rationale: ἐπάνω സഹിതമുള്ള γίνου അധികാരസ്ഥാനത്തേക്കുള്ള നിയമനമോ ആ സ്ഥാനത്ത് ഇരിക്കണമെന്ന കല്പനയോ സൂചിപ്പിക്കുന്നു. വെറും ‘മേൽ ആയിരിക്കൂ’ എന്നതിനേക്കാൾ ഇത് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πέντε πόλεων
  choice: അഞ്ചു നഗരങ്ങളുടെ
  rationale: πόλις എന്നതിന്റെ സാധാരണ അർഥമായ ‘നഗരം’ നിലനിർത്തുന്നു; ഷഷ്ഠീവിഭക്തി ἐπάνω സൂചിപ്പിക്കുന്ന അധികാരപരിധിയുമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ നിർദ്ദേശകമായ ‘ഇവനോടും’ എന്നും സമാന്തര അഭിസംബോധനയായ ‘നീയും’ എന്നും സംരക്ഷിച്ചു. ‘അധികാരിയായിരിക്കൂ’ എന്ന പ്രയോഗം ഭരണചുമതല വ്യക്തമാക്കുന്നു; വ്യാഖ്യാനപരമായ അധിക ദൈവശാസ്ത്രാർഥം ചേർത്തിട്ടില്ല.
