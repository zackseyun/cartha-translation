  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “നന്നായി, നല്ല ദാസാ[a]! വളരെ ചെറിയ കാര്യത്തിൽ നീ വിശ്വസ്തനായിരുന്നതിനാൽ പത്ത് നഗരങ്ങൾക്കുമേൽ അധികാരം വഹിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അടിമേ.” ഗ്രീക്കിലെ ദൂലൊസ് (doulos) എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് “ദാസൻ” എന്നോ “അടിമ” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὖγε
  choice: കൊള്ളാം
  rationale: അംഗീകാരവും അഭിനന്ദനവും പ്രകടിപ്പിക്കുന്ന ഗ്രീക്ക് ഉദ്‌ഗാരത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἀγαθὲ
  choice: നല്ല
  rationale: δοῦλε എന്ന സംബോധനത്തെ വിശേഷിപ്പിക്കുന്ന നേരിട്ടുള്ള തുല്യപദം.
- source_word: δοῦλε
  choice: ദാസാ
  rationale: യജമാനനു കീഴിലുള്ള നില സൂചിപ്പിക്കുകയും ഉപമയുടെ പശ്ചാത്തലത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു; അടിമ എന്ന ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν ἐλαχίστῳ
  choice: ഏറ്റവും ചെറിയ കാര്യത്തിൽ
  rationale: അത്യല്പമായ ഉത്തരവാദിത്വത്തിലോ കാര്യത്തിലോ എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: πιστὸς ἐγένου
  choice: നീ വിശ്വസ്തനായിരുന്നതിനാൽ
  rationale: ἐγένου എന്ന ക്രിയയെ അനാവശ്യമായി ‘തെളിയിച്ചു’ എന്ന വിലയിരുത്തൽ ചേർക്കാതെ, സന്ദർഭത്തിലെ നിലയും കാരണബന്ധവും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: അധികാരമുള്ളവനായിരിക്കുക
  rationale: അധികാരം കൈവശമുള്ള നിലയിൽ ആയിരിക്കുക എന്ന പരിധിയുക്ത ആജ്ഞയുടെ രൂപം ഔപചാരികമായും വ്യക്തമായും സംരക്ഷിക്കുന്നു.
- source_word: ἐπάνω δέκα πόλεων
  choice: പത്തു നഗരങ്ങളുടെമേൽ
  rationale: ഭരണാധികാരത്തിന്റെ പശ്ചാത്തലത്തിൽ ἐπάνωയും πόλεωνയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദാസൻ
  alternative: അടിമ
  rationale: ഈ യജമാനൻ–കീഴാളൻ പശ്ചാത്തലത്തിൽ ‘ദാസൻ’ ബന്ധവും കീഴ്വഴക്കവും സ്വാഭാവികമായി അറിയിക്കുന്നു; നിയമപരമായി ബന്ധിക്കപ്പെട്ട അടിമ എന്ന സാധ്യത മായാതിരിക്കാൻ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. സംബോധനരൂപമായ ‘ദാസാ’യും ആജ്ഞാരൂപമായ ‘അധികാരമുള്ളവനായിരിക്കുക’യും മൂലവാക്യത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു.
