  terminology: “രക്ഷ” appropriately retains the theological range of σωτηρία. “അബ്രാഹാമിന്റെ മകൻ” preserves the source idiom without resolving its ethnic/covenantal implications. The footnote properly addresses οἶκος as “house/household.”
