  source_fidelity: The main rendering substantially reflects the Greek, including the temporal emphasis, salvation language, inclusive force of καὶ αὐτός, and the idiom “son of Abraham.” However, the footnote misidentifies πρὸς αὐτόν (“to him”) as syntactically ambiguous with the phrase concerning the house. The Greek syntax does not support that alternative attachment or sense.
