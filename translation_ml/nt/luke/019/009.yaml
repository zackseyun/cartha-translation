source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: ml
  text: 'യേശു അവനോട് പറഞ്ഞു: “ഇന്ന് ഈ ഭവനത്തിന്[a] രക്ഷ വന്നിരിക്കുന്നു; കാരണം, അവനും അബ്രാഹാമിന്റെ മകനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ കുടുംബത്തിന്.” ഗ്രീക്കിലെ οἶκος എന്ന വാക്ക് വീടിനെയോ അതുമായി ബന്ധപ്പെട്ട കുടുംബത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: പറഞ്ഞു
  rationale: δέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ ക്രിയയിലൂടെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: πρὸς αὐτὸν
  choice: അവനോട്
  rationale: ഗ്രീക്കിലെ സർവനാമം നേരിട്ട് നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത സക്കായി എന്ന പേര് ചേർക്കുന്നില്ല.
- source_word: Σήμερον
  choice: ഇന്ന്
  rationale: മൂലത്തിലെ വാക്യാരംഭസ്ഥാനവും കാലസംബന്ധിയായ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: σωτηρία
  choice: രക്ഷ
  rationale: ലൂക്കോസിൽ ഈ പദത്തിനുള്ള ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തുന്ന, സാധാരണ മലയാളത്തിൽ വ്യക്തമായ പദമാണിത്.
- source_word: τῷ οἴκῳ τούτῳ
  choice: ഈ ഭവനത്തിന്
  rationale: οἶκος എന്ന പദത്തിന്റെ ‘വീട്/ഭവനം’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; അതിന് കുടുംബം അഥവാ വീട്ടിലുള്ളവർ എന്ന വിശാലാർഥവും ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐγένετο
  choice: വന്നിരിക്കുന്നു
  rationale: σωτηρίαയോടൊപ്പമുള്ള ഈ പ്രയോഗത്തിൽ രക്ഷയുടെ ഇപ്പോഴത്തെ ആഗമനം സ്വാഭാവികമായി അറിയിക്കുന്നു; പൂർത്തിയായ സംഭവത്തിന്റെ നിലവിലെ പ്രസക്തിയും പ്രകടമാക്കുന്നു.
- source_word: καθότι
  choice: -ആണല്ലോ
  rationale: ഇവിടെ നൽകുന്ന കാരണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും പ്രസ്താവനയുടെ വിശദീകരണസ്വഭാവം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ αὐτὸς
  choice: ഇവനും
  rationale: καί നൽകുന്ന ഉൾപ്പെടുത്തലിന്റെ ഊന്നൽ ‘-ഉം’ വഴി സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: υἱὸς Ἀβραάμ
  choice: അബ്രാഹാമിന്റെ ഒരു മകൻ
  rationale: ‘അബ്രാഹാമിന്റെ മകൻ’ എന്ന ഉടമ്പടി/സ്വത്വസൂചക പ്രയോഗം ‘വംശജൻ’ എന്നു വിശദീകരിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; അനിശ്ചിതത്വം സൂചിപ്പിക്കാൻ ‘ഒരു’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘അബ്രാഹാമിന്റെ മകൻ’ എന്നതിന്റെ അർഥം
  choice: വംശപരമായ അർഥമോ വിശ്വാസകുടുംബത്തിലെ അംഗത്വമോ രണ്ടും ചേർന്നതോ എന്ന് നിർണ്ണയിക്കാതെ മൂലപ്രയോഗം നിലനിർത്തി.
  alternative: ‘അബ്രാഹാമിന്റെ വംശജൻ’ അല്ലെങ്കിൽ ‘അബ്രാഹാമിന്റെ വിശ്വാസകുടുംബത്തിലെ യഥാർഥ അംഗം’ എന്ന് വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: ഈ വാക്യം മാത്രം ഒരു അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല. മൂലത്തിലെ സ്വത്വപരവും ഉടമ്പടിപരവുമായ ദൈവശാസ്ത്ര സംഘർഷവും വ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘ഭവനം’ എന്നത് ‘വീട്’ എന്നതിനെക്കാൾ അല്പം ഔപചാരികമാണെങ്കിലും കുടുംബത്തെയും വീട്ടിലുള്ളവരെയും ഉൾക്കൊള്ളാവുന്ന οἶκος എന്ന പദത്തിന്റെ വ്യാപ്തി വഹിക്കുന്നു. പ്രധാനവാക്യത്തിലെ [a] അടിക്കുറിപ്പ് πρὸς αὐτόν എന്നതിന്റെ സാദ്ധ്യമായ ബന്ധനവ്യത്യാസം രേഖപ്പെടുത്തുന്നു.
