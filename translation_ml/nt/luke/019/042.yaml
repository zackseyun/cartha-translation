reference: Luke 19:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: ml
  text: 'ഇങ്ങനെ പറഞ്ഞു: “ഈ ദിവസം നീയെങ്കിലും സമാധാനത്തിന് ഉപകരിക്കുന്ന കാര്യങ്ങൾ[b] അറിഞ്ഞിരുന്നെങ്കിൽ![a] എന്നാൽ ഇപ്പോൾ അവ നിന്റെ കണ്ണുകളിൽനിന്ന് മറയ്ക്കപ്പെട്ടിരിക്കുന്നു.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ദിവസം നീയെങ്കിലും സമാധാനത്തിന് ഉപകരിക്കുന്ന കാര്യങ്ങൾ അറിഞ്ഞിരുന്നെങ്കിൽ കൊള്ളാമായിരുന്നു!”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം, “സമാധാനത്തോടു ബന്ധപ്പെട്ട കാര്യങ്ങൾ”; സമാധാനത്തിനു വഴിയൊരുക്കുന്നതോ സമാധാനത്തിന് ഉപകരിക്കുന്നതോ ആയ കാര്യങ്ങൾ എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്ക് ക്രിയ ഏകവചനത്തിലാണ്. അതിനാൽ ചില പരിഭാഷകൾ ഈ അവസാനഭാഗം “ഇപ്പോൾ അത് നിന്റെ കണ്ണുകളിൽനിന്ന് മറയ്ക്കപ്പെട്ടിരിക്കുന്നു” എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ ആഖ്യാനക്രിയയോടു ബന്ധിച്ചിരിക്കുന്ന വർത്തമാന കൃദന്തരൂപമാണിത്. മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹം നിലനിർത്താൻ ‘ഇങ്ങനെ പറഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Εἰ ἔγνως
  choice: അറിഞ്ഞിരുന്നെങ്കിൽ
  rationale: പൂർത്തിയാകാതെ നിൽക്കുന്ന വിലാപരൂപത്തിലുള്ള നിബന്ധനയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിൽ പ്രത്യേകം ഇല്ലാത്ത ‘മാത്രം’ പോലുള്ള ആശയം പ്രധാനപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: ഈ ദിവസത്തിൽ
  rationale: കാലസൂചനയെ വ്യക്തമായും നേരിട്ടും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: καὶ σὺ
  choice: നീയെങ്കിലും
  rationale: യെരൂശലേമിനോടുള്ള വിലാപത്തിലെ ഊന്നലും വികാരതീവ്രതയും ‘നീയെങ്കിലും’ സ്വാഭാവികമായി പകരുന്നു.
- source_word: τὰ πρὸς εἰρήνην
  choice: സമാധാനത്തിലേക്കു നയിക്കുന്ന കാര്യങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘സമാധാനത്തോടു ബന്ധപ്പെട്ട കാര്യങ്ങൾ’ എന്ന ആശയമുള്ള പ്രയോഗം സമാധാനത്തിനു വഴിയൊരുക്കുന്നതോ അതിലേക്കു നയിക്കുന്നതോ ആയ കാര്യങ്ങളെ സൂചിപ്പിക്കുന്നു; ബഹുവചനഭാവവും നിലനിർത്തുന്നു.
- source_word: εἰρήνην
  choice: സമാധാനം
  rationale: വിധിയെ ഒഴിവാക്കുന്ന ക്ഷേമം ഉൾപ്പെടെയുള്ള സന്ദർഭസമ്പന്നമായ അർഥം വഹിക്കുന്ന സാധാരണവും യോജിച്ചതുമായ പദം.
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: അറിയാമായിരുന്ന സാധ്യതയും ഇപ്പോഴത്തെ മറയ്ക്കപ്പെട്ട അവസ്ഥയും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἐκρύβη
  choice: മറയ്ക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്ക് കർമണിപ്രയോഗവും അതിന്റെ ഇപ്പോഴുള്ള ഫലവും നിലനിർത്തുന്നു. മലയാളത്തിൽ മുൻപുള്ള ബഹുവചനമായ ‘കാര്യങ്ങൾ’ എന്നതിനെ ‘അവ’ എന്നു വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: നിന്റെ കണ്ണുകളിൽനിന്ന്
  rationale: കാണലിനെയും തിരിച്ചറിവിനെയും സംബന്ധിച്ച മൂലപാഠത്തിലെ ദൃശ്യരൂപകം നിലനിർത്തുന്ന സ്വാഭാവിക പരിഭാഷ.
theological_decisions:
- issue: ἐκρύβη എന്ന ക്രിയയുടെ സൂചിത കർത്തൃവിഷയം
  choice: മറയ്ക്കപ്പെട്ടിരിക്കുന്നത് ‘സമാധാനത്തിലേക്കു നയിക്കുന്ന കാര്യങ്ങൾ’ ആണെന്നു കണ്ട് മലയാളത്തിൽ ‘അവ’ എന്ന ബഹുവചനസൂചന ഉപയോഗിച്ചു.
  alternative: ‘അത് നിന്റെ കണ്ണുകളിൽനിന്ന് മറയ്ക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന ഏകവചന ആശയപരമായ പരിഭാഷ.
  rationale: ἐκρύβη ഏകവചനമാണെങ്കിലും അതിനു മുമ്പുള്ള നപുംസകലിംഗ ബഹുവചനപദസമുച്ചയത്തെ ഗ്രീക്കിൽ ആശയപരമായി ഏകവചനത്തിൽ പുനരെടുക്കാൻ കഴിയും. മലയാളത്തിൽ ‘അവ’ എന്നത് ബന്ധം കൂടുതൽ വ്യക്തമായി കാണിക്കുകയും പുതിയ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: നിബന്ധനാരൂപത്തിലുള്ള വിലാപത്തിന്റെ ശക്തി
  choice: ‘അറിഞ്ഞിരുന്നെങ്കിൽ!’ എന്നു നൽകി, ഫലവാക്യം പറയാതെ നിൽക്കുന്ന വിലാപഭാവം നിലനിർത്തി.
  alternative: ‘അറിഞ്ഞിരുന്നെങ്കിൽ കൊള്ളാമായിരുന്നു!’ അല്ലെങ്കിൽ ‘അറിഞ്ഞിരുന്നെങ്കിൽ മാത്രം!’
  rationale: സന്ദർഭത്തിൽ ആഗ്രഹവും വിലാപവും വ്യക്തമാണ്; എങ്കിലും ‘മാത്രം’ എന്നതിന് തുല്യമായ പ്രത്യേക കണം ഗ്രീക്കിൽ ഇല്ല. ആശയം അധികമായി നിർവചിക്കാതെ അപൂർണ്ണ നിബന്ധനയും വികാരവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. അപൂർണ്ണമായി നിൽക്കുന്ന നിബന്ധനാവിലാപം ആശ്ചര്യചിഹ്നത്തിലൂടെ കേൾവിയോഗ്യമാക്കി; അനാവശ്യ സഭാപാരമ്പര്യപദങ്ങൾ ഒഴിവാക്കി.
