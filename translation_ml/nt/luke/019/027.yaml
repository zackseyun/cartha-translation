source:
  edition: SBLGNT
  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: ml
  text: എന്നാൽ, ഞാൻ അവരുടെമേൽ രാജാവായി വാഴാൻ ആഗ്രഹിക്കാതിരുന്ന[a] എന്റെ ഈ ശത്രുക്കളെ ഇവിടെ കൊണ്ടുവന്ന് എന്റെ കൺമുമ്പിൽവെച്ച് അറുത്തുകൊല്ലുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ അവരുടെമേൽ രാജാവായിരിക്കണമെന്ന് ഇഷ്ടപ്പെടാതിരുന്ന.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എന്റെ സന്നിധിയിൽവെച്ച് കൊന്നുകളയുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: എന്നാൽ
  rationale: അടുത്തുവരുന്ന അന്തിമവും നിർണായകവുമായ കല്പനയിലേക്കുള്ള ശക്തമായ ഭാവമാറ്റം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: എന്റെ ഈ ശത്രുക്കളെ
  rationale: ἐχθρούς എന്നതിന്റെ വ്യക്തിപരമായ എതിർപ്പിന്റെ അർഥവും τούτους നൽകുന്ന പ്രത്യേക ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: ഞാൻ തങ്ങളുടെമേൽ രാജാവായി വാഴാൻ ആഗ്രഹിക്കാതിരുന്ന
  rationale: കർത്താവിനോടുള്ള അവരുടെ മനസ്സില്ലായ്മയും βασιλεύω എന്ന ക്രിയയുടെ ‘രാജാവായി വാഴുക’ എന്ന അർഥവും നിലനിർത്തുന്നു; കൃുദന്തരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണവാക്യമായി നൽകുന്നു.
- source_word: ἀγάγετε ὧδε
  choice: ഇവിടെ കൊണ്ടുവന്ന്
  rationale: ആളുകളെ സംസാരിക്കുന്നവന്റെ അടുക്കലേക്കു കൊണ്ടുവരാനുള്ള കല്പന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατασφάξατε
  choice: അറുത്തുകൊല്ലുക
  rationale: സാധാരണ ‘കൊല്ലുക’ എന്നതിനെക്കാൾ ശക്തവും ദൃശ്യവുമായ ഈ ക്രിയയുടെ തീവ്രത മയപ്പെടുത്താതെ നൽകുന്നു; ‘വധശിക്ഷ നടപ്പാക്കുക’ എന്ന പാഠത്തിൽ വ്യക്തമല്ലാത്ത നിയമപരമായ ആശയം ചേർക്കുന്നില്ല.
- source_word: ἔμπροσθέν μου
  choice: എന്റെ കൺമുമ്പിൽവെച്ച്
  rationale: സംസാരിക്കുന്നവന്റെ നേരിട്ടുള്ള സാന്നിധ്യത്തിൽ എന്ന സ്ഥലപരവും വ്യക്തിപരവുമായ ആശയം വ്യക്തവും സജീവവുമായി നൽകുന്നു.
theological_decisions:
- issue: ഉപമയ്ക്കുള്ളിലെ പ്രസംഗകന്റെ കല്പന
  choice: പ്രഭുവായ കഥാപാത്രത്തിന്റെ കല്പന അതിന്റെ ക്രൂരത മയപ്പെടുത്താതെ നേരിട്ടു പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് ഉപമയിലെ ദൃശ്യരൂപം മാത്രമാണെന്ന് കൂടുതൽ അകലം സൃഷ്ടിക്കുന്ന വാക്കുകൾ ചേർക്കുക, അല്ലെങ്കിൽ ക്രൂരത മയപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം ഈ വാക്കുകൾ ഉപമയിലെ പ്രഭുവിന്റെ നേരിട്ടുള്ള പ്രസംഗമായി അവതരിപ്പിക്കുന്നു. അതിനാൽ വിവർത്തനം ആ കഥാസന്ദർഭത്തെ അതേപടി നിലനിർത്തുന്നു; അതേസമയം ഇത് ഉപമയ്ക്കു പുറത്തുള്ള യേശുവിന്റെ നേരിട്ടുള്ള കല്പനയാണെന്ന വ്യാഖ്യാനവും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അറുത്തുകൊല്ലുക’ എന്ന ശക്തമായ പദം മൂലപാഠത്തിലെ ക്രൂരത സംരക്ഷിക്കുന്നു; ‘വധശിക്ഷ’ പോലുള്ള അധിക നിയമപരമായ വ്യാഖ്യാനം ഒഴിവാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
