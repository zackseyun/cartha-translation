  source_fidelity: The draft faithfully represents the strong transition (πλήν), the emphatic demonstrative ('these'), the refusal to accept the speaker's reign, the command to bring them, the graphic force of κατασφάξατε, and the personal-presence force of ἔμπροσθέν μου. However, 'തങ്ങളുടെമേൽ' is not an appropriate unambiguous rendering of ἐπ’ αὐτούς here; 'അവരുടെമേൽ' clearly refers to the enemies as those over whom the speaker was to reign.
