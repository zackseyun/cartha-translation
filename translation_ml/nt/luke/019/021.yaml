review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperfect past fear, the servant's accusatory characterization of the master, and both parallel clauses. However, ‘എടുത്തുകൊള്ളുന്നു’ can suggest taking something for oneself and is less neutral than αἴρεις (‘you take’).
  naturalness: The draft is generally clear and modern, but finite parallel verbs are more direct and natural here than the coordinated participial construction ‘എടുത്തുകൊള്ളുകയും … കൊയ്യുകയും ചെയ്യുന്നു.’
  terminology: ‘കർക്കശനായ’ suitably conveys αὐστηρός as severe/harsh without deciding whether the servant's accusation is objectively true. ‘എടുക്കുന്നു’ preserves the neutral verbal force of αἴρεις. ‘വിതയ്ക്കുക—കൊയ്യുക’ retains the agricultural parallelism.
  issues:
  - severity: low
    issue: ‘എടുത്തുകൊള്ളുന്നു’ is slightly interpretive for αἴρεις.
    rationale: The compound may imply appropriating or taking for oneself. The Greek here simply says ‘you take’; ‘എടുക്കുന്നു’ is closer and preserves the ambiguity.
  - severity: low
    issue: The two present-tense accusations are not expressed as directly parallel finite verbs.
    rationale: Rendering both as ‘എടുക്കുന്നു … കൊയ്യുന്നു’ better reflects αἴρεις … θερίζεις and improves Malayalam flow.
  revised_text: 'കാരണം, എനിക്ക് നിന്നെ ഭയമായിരുന്നു; നീ കർക്കശനായ ഒരു മനുഷ്യനാണ്[a]: നീ വെച്ചിട്ടില്ലാത്തത് എടുക്കുന്നു, വിതച്ചിട്ടില്ലാത്തത് കൊയ്യുന്നു.’'
