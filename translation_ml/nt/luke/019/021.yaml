  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: ml
  text: 'കാരണം, എനിക്ക് നിന്നെ ഭയമായിരുന്നു; നീ കർക്കശനായ ഒരു മനുഷ്യനാണ്[a]: നീ വെച്ചിട്ടില്ലാത്തത് എടുക്കുന്നു, വിതച്ചിട്ടില്ലാത്തത് കൊയ്യുന്നു.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കർക്കശനായ’ എന്നതിന് ‘കർശനനായ’ അല്ലെങ്കിൽ ‘നിഷ്ഠുരനായ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: എനിക്ക് നിന്നെ ഭയമായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം കഴിഞ്ഞകാലത്ത് തുടർന്നിരുന്ന ഭയാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രവൃത്തിക്കുള്ള വിശദീകരണകാരണം അവതരിപ്പിക്കുന്നു.
- source_word: αὐστηρὸς
  choice: കഠിനനായ
  rationale: കർശനവും വഴങ്ങാത്തതുമായ സ്വഭാവത്തെ സൂചിപ്പിക്കുന്നു; ദാസന്റെ കുറ്റപ്പെടുത്തലിന്റെ പ്രതികൂലഭാവം മയപ്പെടുത്തുന്നില്ല.
- source_word: αἴρεις
  choice: എടുത്തുകൊള്ളുന്നു
  rationale: എടുക്കുക എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ്.
- source_word: ὃ οὐκ ἔθηκας
  choice: നീ വെച്ചിട്ടില്ലാത്തത്
  rationale: τίθημι എന്നതിന്റെ ‘വെക്കുക’ എന്ന നേരിട്ടുള്ള ദൃശ്യരൂപം സൂക്ഷിക്കുന്നു; ‘നിക്ഷേപിക്കുക’ പോലുള്ള കൂടുതൽ നിർദിഷ്ടമായ സാമ്പത്തിക അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: θερίζεις
  choice: കൊയ്യുന്നു
  rationale: കാർഷികരൂപകം നിലനിർത്തുകയും ‘വിതയ്ക്കുക—കൊയ്യുക’ എന്ന സമാന്തര്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὃ οὐκ ἔσπειρας
  choice: വിതച്ചിട്ടില്ലാത്തത്
  rationale: σπείρω എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി കാർഷികരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: ἄνθρωπος
  choice: മനുഷ്യൻ
  rationale: ഉപമയിലെ പ്രത്യേക പുരുഷനെ സൂചിപ്പിക്കുന്ന പൊതുവായ നാമം; മലയാളത്തിൽ സ്വാഭാവികവും മൂലപാഠത്തോട് ചേർന്നതുമാണ്.
theological_decisions:
- issue: ഉപമയിലെ യജമാനനെക്കുറിച്ചുള്ള ദാസന്റെ വിവരണം മയപ്പെടുത്തണമോ എന്നത്
  choice: ദാസന്റെ കുറ്റപ്പെടുത്തൽ നിറഞ്ഞ ഭാഷ മയപ്പെടുത്താതെ നിലനിർത്തി
  alternative: ‘കർശനൻ’ അല്ലെങ്കിൽ ‘വളരെ ആവശ്യപ്പെടുന്നവൻ’ പോലുള്ള താരതമ്യേന മൃദുവായ ഭാഷ ഉപയോഗിക്കുക
  rationale: ഇത് ദാസന്റെ സ്വന്തം വിശദീകരണവും ആരോപണവുമാണ്. ആ ആരോപണം യജമാനനെക്കുറിച്ച് വസ്തുതാപരമായി ശരിയാണോ എന്നു വിവർത്തനം തീരുമാനിക്കാതെ അതിന്റെ വാചകശക്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സൂക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദാസന്റെ നേരിട്ടുള്ള അഭിസംബോധനയ്ക്കായി ഏകവചനമായ ‘നീ’ നിലനിർത്തി. ‘വെക്കുക—എടുക്കുക’, ‘വിതയ്ക്കുക—കൊയ്യുക’ എന്നീ മൂലപാഠത്തിലെ സമാന്തര ദൃശ്യങ്ങൾ സംരക്ഷിച്ചു; ഉദ്ധരണിയുടെ അവസാനചിഹ്നം സന്ദർഭബന്ധം സൂചിപ്പിക്കാൻ ചേർത്തു.
