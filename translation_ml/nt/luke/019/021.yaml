  rationale: ‘എടുത്തുകൊള്ളുന്നു’ എന്നതിനു പകരം കൂടുതൽ നിഷ്പക്ഷമായ ‘എടുക്കുന്നു’ ഉപയോഗിക്കുകയും, മൂലഗ്രീക്കിലെ സമാന്തരമായ രണ്ടു വർത്തമാനകാല ക്രിയാരൂപങ്ങൾ മലയാളത്തിലും നേരിട്ട് സമാന്തരമായി നൽകുകയും ചെയ്തു. αὐστηρός-ന്റെ പ്രതികൂലവും കുറ്റപ്പെടുത്തൽനിറഞ്ഞതുമായ സ്വരം നിലനിർത്താൻ ‘കർക്കശനായ’ ഉപയോഗിച്ചു. നിലവിലുള്ള b കുറിപ്പിലെ lexical alternative പ്രസക്തമായതിനാൽ സംരക്ഷിച്ചു; വാക്യത്തിൽ അതിന്റെ ആങ്കർ ഇല്ലാതിരുന്ന ഘടനാപരമായ അസംഗതി പരിഹരിക്കാൻ [b] നിലനിർത്തി.
