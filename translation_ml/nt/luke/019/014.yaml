id: LUK.19.14
reference: Luke 19:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: ml
  text: 'എന്നാൽ അവന്റെ പൗരന്മാർ അവനെ വെറുത്തിരുന്നു. അവർ അവന്റെ പിന്നാലെ ഒരു പ്രതിനിധിസംഘത്തെ[a] അയച്ച് ഇങ്ങനെ അറിയിച്ചു: “ഇയാൾ ഞങ്ങളുടെമേൽ രാജാവായി വാഴുന്നത് ഞങ്ങൾക്ക് വേണ്ട.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ഔദ്യോഗിക ദൗത്യസംഘത്തെ.” ഗ്രീക്കുപദം ഔദ്യോഗിക ദൗത്യത്തിനായി അയയ്ക്കപ്പെട്ട പ്രതിനിധിസംഘത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολῖται
  choice: പൗരന്മാർ
  rationale: ഒരു രാഷ്ട്രീയസമൂഹത്തിലെ അംഗങ്ങൾ എന്ന പൗരസംബന്ധമായ അർഥം നിലനിർത്തുന്നു. ‘പ്രജകൾ’ എന്നു വിവർത്തനം ചെയ്താൽ അവർ നിരസിക്കുന്ന രാജത്വം മുൻകൂട്ടി സമ്മതിക്കുന്ന ധ്വനി വരാം.
- source_word: ἐμίσουν
  choice: വെറുത്തിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായതോ സ്വഭാവസവിശേഷമായതോ ആയ ശത്രുത സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀπέστειλαν
  choice: അയച്ചു
  rationale: സംഭവവിവരണത്തിലെ സാധാരണ ഭൂതകാലപ്രവർത്തിയെ അധിക ഔപചാരികത ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: πρεσβείαν
  choice: ഒരു പ്രതിനിധിസംഘത്തെ
  rationale: ഔദ്യോഗിക ദൗത്യത്തിനായി അയയ്ക്കപ്പെട്ട പ്രതിനിധികളുടെ സംഘമാണ് ഉദ്ദേശ്യം; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὀπίσω αὐτοῦ
  choice: അവന്റെ പിന്നാലെ
  rationale: അവൻ പോയതിനു പിന്നാലെ സംഘം അയയ്ക്കപ്പെട്ടുവെന്ന സന്ദർഭാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: λέγοντες
  choice: ഇങ്ങനെ അറിയിച്ചു
  rationale: പ്രതിനിധിസംഘം കൊണ്ടുപോയ സന്ദേശത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്നു; മലയാള വിവരണത്തിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: Οὐ θέλομεν
  choice: ഞങ്ങൾക്ക് വേണ്ട
  rationale: ആഗ്രഹമില്ലായ്മ മാത്രമല്ല, ഉറച്ച നിരസനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τοῦτον
  choice: ഇയാൾ
  rationale: ഗ്രീക്കിലെ സൂചകസർവനാമത്തിന്റെ അകൽച്ചയും നിരസനധ്വനിയും നിലനിർത്തുന്നു; അമിതമായ അവഹേളനം ചേർക്കുന്നില്ല.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: ഞങ്ങളുടെമേൽ രാജാവായി വാഴുന്നത്
  rationale: പൊതുവായ ഭരണാധികാരമെന്നതിലേക്കു ചുരുക്കാതെ രാജത്വത്തിന്റെ വ്യക്തമായ ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപമയിലെ രാഷ്ട്രീയ-രാജകീയ സൂചന
  choice: ‘ഞങ്ങളുടെമേൽ രാജാവായി വാഴുന്നത്’ എന്ന വ്യക്തമായ രാജത്വഭാഷ നിലനിർത്തി.
  alternative: ‘ഞങ്ങളെ ഭരിക്കുന്നത്’
  rationale: βασιλεύω എന്ന പദത്തിലെ രാജകീയ ആശയം ഉപമയുടെ സംഘർഷത്തിന് നിർണായകമാണ്. അതേസമയം, വാക്യത്തിന് പുറത്തുള്ള ഒരു പ്രത്യേക ഉപമാവ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. നേരിട്ടുള്ള ഉദ്ധരണിയിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഉറച്ച നിരസനഭാവം നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘hated him’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം πρεσβείαν എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യവാചകത്തിൽ ‘പ്രതിനിധിസംഘത്തെ’ എന്നതിനുശേഷം സ്ഥാപിച്ചു.
