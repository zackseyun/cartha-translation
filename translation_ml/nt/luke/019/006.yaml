translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ പ്രവർത്തനക്രമവും സന്തോഷഭാവവും കാത്തുസൂക്ഷിച്ചു; ‘സ്വീകരിച്ചു’ എന്നത് മൂലപദത്തിന്റെ സ്വീകരിക്കുക/വരവേൽക്കുക എന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
