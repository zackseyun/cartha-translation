id: LUK.19.26
reference: Luke 19:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: ml
  text: '“ഞാൻ നിങ്ങളോടു പറയുന്നു: ഉള്ളവർക്കെല്ലാം നൽകപ്പെടും; എന്നാൽ ഇല്ലാത്തവനിൽനിന്ന് അവനുള്ളതുപോലും എടുത്തുകളയപ്പെടും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള പ്രസ്താവനയുടെ ഊന്നൽ നിലനിർത്തുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: παντὶ τῷ ἔχοντι
  choice: ഉള്ള ഏവർക്കും
  rationale: പദശഃ ‘ഉള്ള എല്ലാവർക്കും’ എന്ന പൊതുവ്യാപ്തി ചുരുക്കവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; എന്താണ് ഉള്ളതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു ചേർത്തിട്ടില്ല.
- source_word: δοθήσεται
  choice: കൂടുതൽ നൽകപ്പെടും
  rationale: ഗ്രീക്കിൽ പദശഃ ‘നൽകപ്പെടും’ എന്നാണ്; സന്ദർഭത്തിലെ വർധനയുടെ സൂചന സ്വാഭാവിക മലയാളത്തിനായി ‘കൂടുതൽ’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു, എന്നാൽ അടിക്കുറിപ്പിൽ പദശഃ സാധ്യത രേഖപ്പെടുത്തുന്നു.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: എന്നാൽ ഇല്ലാത്തവനിൽനിന്ന്
  rationale: δέയുടെ വിരുദ്ധഭാവം ‘എന്നാൽ’ കൊണ്ടും, നിഷേധാത്മകമായ നാമവൽക്കരിച്ച കൃദന്തം ‘ഇല്ലാത്തവൻ’ കൊണ്ടും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: καὶ ὃ ἔχει
  choice: അവനുള്ളതുപോലും
  rationale: ഇവിടെ καί തീവ്രത സൂചിപ്പിക്കുന്നതിനാൽ ‘പോലും’ അനുയോജ്യം; ഏകവചന പൊതുപുരുഷരൂപം മൂലപാഠത്തിന്റെ ഘടന നിലനിർത്തുന്നു.
- source_word: ἀρθήσεται
  choice: എടുത്തുകളയപ്പെടും
  rationale: αἴρωയുടെ ഇവിടെ ഉദ്ദേശിക്കുന്ന നീക്കംചെയ്യൽ/നഷ്ടപ്പെടുത്തൽ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; ഭാവികാല കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വർധനയും നഷ്ടവും സംബന്ധിച്ച വചനത്തിന്റെ വ്യാഖ്യാനപരമായ വ്യാപ്തി
  choice: രക്ഷ, യോഗ്യത, മുൻനിർണ്ണയം തുടങ്ങിയ സിദ്ധാന്തപരമായ വിശദീകരണങ്ങൾ ചേർക്കാതെ വചനം പൊതുതത്ത്വമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് ഉപമയിലെ കാര്യവിചാരകത്വത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയെന്നോ വിശാലമായ ദൈവരാജ്യ തത്ത്വമെന്നോ പരിഭാഷയിൽത്തന്നെ വ്യക്തമാക്കുക.
  rationale: മൂലവാക്യം തത്ത്വത്തിന്റെ പ്രവർത്തനരീതി വിശദീകരിക്കുന്നില്ല. അതിനാൽ സന്ദർഭപരവും ദൈവശാസ്ത്രപരവുമായ പ്രയോഗം വ്യാഖ്യാനത്തിന് വിട്ടുകൊടുത്ത് വചനത്തിന്റെ ചുരുക്കവും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. വാക്യത്തിന്റെ പഴഞ്ചൊല്ലുസദൃശമായ ചുരുക്കവും കർമണിപ്രയോഗവും നിലനിർത്തിയിരിക്കുന്നു.
