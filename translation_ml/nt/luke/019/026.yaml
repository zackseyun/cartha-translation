  to: '“ഞാൻ നിങ്ങളോടു പറയുന്നു: ഉള്ളവർക്കെല്ലാം നൽകപ്പെടും; എന്നാൽ ഇല്ലാത്തവനിൽനിന്ന് അവനുള്ളതുപോലും എടുത്തുകളയപ്പെടും.”'
