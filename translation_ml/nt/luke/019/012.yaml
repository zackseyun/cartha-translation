id: LUK.19.12
reference: Luke 19:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: ml
  text: 'അതിനാൽ അവൻ പറഞ്ഞു: “കുലീനനായ ഒരാൾ തനിക്കുവേണ്ടി ഒരു രാജ്യം[a] ഏറ്റുവാങ്ങാനും മടങ്ങിവരാനും ഒരു ദൂരദേശത്തേക്കു പോയി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രാജത്വം” അല്ലെങ്കിൽ “രാജാധികാരം” എന്നും പരിഭാഷപ്പെടുത്താം. βασιλεία എന്ന ഗ്രീക്കുപദം രാജ്യമെന്ന പ്രദേശത്തെയോ രാജകീയ ഭരണത്തെയോ അധികാരത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള യുക്തിപരവും ആഖ്യാനപരവുമായ തുടർച്ച സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ അനുമാനസ്വരം നിലനിർത്തുന്നു.
- source_word: Ἄνθρωπός τις εὐγενὴς
  choice: കുലീനനായ ഒരാൾ
  rationale: τις സൂചിപ്പിക്കുന്ന അനിശ്ചിത പരിചയപ്പെടുത്തലും εὐγενής സൂചിപ്പിക്കുന്ന ഉന്നത ജന്മമോ സാമൂഹിക പദവിയോ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπορεύθη
  choice: പോയി
  rationale: സാധാരണ ഗമനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയ്ക്ക് വ്യക്തവും സ്വാഭാവികവുമായ തർജമ.
- source_word: εἰς χώραν μακρὰν
  choice: ഒരു ദൂരദേശത്തേക്കു
  rationale: വിദൂരമായ ഒരു പ്രദേശത്തേക്കുള്ള യാത്രയെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: λαβεῖν
  choice: ഏറ്റുവാങ്ങാനും
  rationale: ഈ രാഷ്ട്രീയസന്ദർഭത്തിൽ ബലമായി പിടിച്ചെടുക്കുന്നതിനെക്കാൾ അധികാരമോ രാജ്യമോ ഔദ്യോഗികമായി ലഭിക്കുന്ന ആശയമാണ് ഉചിതം.
- source_word: ἑαυτῷ
  choice: തനിക്കുവേണ്ടി
  rationale: പ്രത്യാവർത്തക ദാതിവ് ആ രാജ്യമോ രാജാധികാരമോ അയാൾക്കുതന്നെ ലഭിക്കുന്നതായി സൂചിപ്പിക്കുന്നു.
- source_word: βασιλείαν
  choice: ഒരു രാജ്യം
  rationale: പദത്തിന് രാജ്യം, രാജത്വം, രാജാധികാരം എന്നീ അർഥസാധ്യതകളുണ്ട്. മുഖ്യപാഠത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ ‘ഒരു രാജ്യം’ സ്വീകരിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὑποστρέψαι
  choice: മടങ്ങിവരാനും
  rationale: λαβεῖν എന്നതിനോടു καί മുഖേന സമന്വയിപ്പിച്ചിരിക്കുന്ന രണ്ടാമത്തെ ലക്ഷ്യപ്രവൃത്തിയെ അധികമായ കാലസൂചകം ചേർക്കാതെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: രാഷ്ട്രീയ സൂചനകളുള്ള ഉപമയിൽ βασιλείαν എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ഒരു രാജ്യം
  alternative: രാജത്വം; രാജാധികാരം
  rationale: ഇവിടെ കുലീനൻ അംഗീകൃതമായ രാജപദവിയോ ഭരണാധികാരമോ ലഭിച്ചശേഷം മടങ്ങിവരുന്നതാണ് രാഷ്ട്രീയ പശ്ചാത്തലം. എങ്കിലും പദം ഭരിക്കപ്പെടുന്ന രാജ്യമെന്ന അർഥവും വഹിക്കാം. മുഖ്യപാഠം ഈ ദ്വയാർഥം തീർപ്പാക്കാതെ അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കുലീനനായ ഒരാൾ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും പുരാതന സാമൂഹികപദവി സൂചിപ്പിക്കുന്നതുമാണ്; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘പിന്നീട്’ പോലുള്ള കാലബന്ധകങ്ങൾ ചേർത്തിട്ടില്ല.
