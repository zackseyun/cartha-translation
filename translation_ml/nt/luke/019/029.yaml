source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν, ἀπέστειλεν δύο τῶν ⸀μαθητῶν
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: ml
  text: 'അങ്ങനെ സംഭവിച്ചു: അവൻ ബേത്ത്ഫഗെക്കും ബേഥാന്യക്കും സമീപം, ഒലിവുമല[a] എന്നു വിളിക്കപ്പെടുന്ന പർവതത്തിന്റെ ദിശയിൽ എത്തിയപ്പോൾ, ശിഷ്യന്മാരിൽ രണ്ടുപേരെ അയച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ പദശഃ: “ഒലിവുകൾ” എന്നു വിളിക്കപ്പെടുന്ന പർവതം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: അങ്ങനെ സംഭവിച്ചു
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനസൂത്രം നിലനിർത്തിക്കൊണ്ട്, പഴഞ്ചൻ ശൈലിയിലേക്കു വഴുതാതെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὡς
  choice: എത്തിയപ്പോൾ
  rationale: ഇവിടെ ὡς കാലസൂചകമായ ഉപവാക്യം ആരംഭിക്കുന്നു; സമീപിച്ചുകൊണ്ടിരുന്ന സന്ദർഭത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: ബേത്ത്ഫഗെയ്ക്കും ബേഥാന്യയ്ക്കും അടുത്ത് ... എത്തിയപ്പോൾ
  rationale: ἐγγίζω സ്ഥലങ്ങളോടു സമീപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനഘടനയ്ക്കായി സ്ഥലനാമങ്ങളോടൊപ്പം ‘അടുത്ത് എത്തിയപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: πρὸς τὸ ὄρος
  choice: മലയുടെ സമീപത്ത്
  rationale: πρός ഇവിടെ മലയുമായി ബന്ധപ്പെട്ട ദിശയെയോ സമീപസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘സമീപത്ത്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: ഒലിവുമല എന്നു വിളിക്കപ്പെടുന്ന
  rationale: Ἐλαιῶν എന്ന സംക്ഷിപ്ത ഗ്രീക്ക് നാമത്തെ മലയാളത്തിൽ സുപരിചിതവും വായനാസൗകര്യമുള്ളതുമായ ‘ഒലിവുമല’ എന്നു നൽകി; പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: സാധാരണ ആഖ്യാനത്തിലെ ക്രിയയ്ക്ക് ലളിതവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: δύο τῶν μαθητῶν
  choice: ശിഷ്യന്മാരിൽ രണ്ടുപേരെ
  rationale: ഭാഗിക ജനിറ്റീവ് ഘടന കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘തന്റെ’ എന്ന ഉടമസ്ഥസൂചന ചേർത്തിട്ടില്ല.
