id: LUK.19.8
reference: Luke 19:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: ml
  text: 'എന്നാൽ സക്കായി നിന്നുകൊണ്ട് കർത്താവിനോട് പറഞ്ഞു: “ഇതാ, കർത്താവേ, എന്റെ സ്വത്തിന്റെ പകുതി ഞാൻ ദരിദ്രർക്കു കൊടുക്കുന്നു; ആരിൽനിന്നെങ്കിലും എന്തെങ്കിലും അന്യായമായി പിടിച്ചെടുത്തിട്ടുണ്ടെങ്കിൽ[a], അതിന്റെ നാലിരട്ടി ഞാൻ തിരികെ കൊടുക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരെയെങ്കിലും എന്തിലെങ്കിലും വഞ്ചിച്ചിട്ടുണ്ടെങ്കിൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ഭീഷണിപ്പെടുത്തിയോ അധികാരം ദുരുപയോഗം ചെയ്തോ പിടിച്ചെടുക്കുക, ചൂഷണം ചെയ്യുക, വഞ്ചിക്കുക എന്നീ അർഥങ്ങൾ വരാം; ചില സന്ദർഭങ്ങളിൽ വ്യാജാരോപണത്തിലൂടെയുള്ള വഞ്ചനയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ വർത്തമാനകാല ക്രിയകളെ ഉടനെയുള്ള ദൃഢനിശ്ചയം പ്രകടിപ്പിക്കുന്ന “ഞാൻ കൊടുക്കും,” “ഞാൻ തിരികെ കൊടുക്കും” എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: നിന്നുകൊണ്ട്
  rationale: ἵστημι എന്ന ക്രിയയുടെ ഇവിടെ കർമണിപ്രയോഗരൂപം അകർമകമായ അർഥത്തിലാണ്; സക്കായിയുടെ നില്പ് എന്ന ആഖ്യാനപ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കുകയും ‘എഴുന്നേറ്റു’ എന്ന അധിക ആശയം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κύριον / κύριε
  choice: കർത്താവ് / കർത്താവേ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ ബഹുമാനസൂചകവും ശീർഷകപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള പ്രഖ്യാപനത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: എന്റെ സ്വത്തിന്റെ പകുതി
  rationale: ὑπάρχοντα ഇവിടെ ഒരാളുടെ വസ്തുവകകളെയോ സമ്പത്തിനെയോ സൂചിപ്പിക്കുന്നു; ഭാഗസൂചകമായ ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τοῖς πτωχοῖς
  choice: ദരിദ്രർക്ക്
  rationale: സാമ്പത്തികമായി ദരിദ്രരായ ആളുകളെ സൂചിപ്പിക്കുന്ന πτωχός എന്ന നാമവത്കൃത വിശേഷണത്തിന്റെ നേരായ വിവർത്തനം.
- source_word: δίδωμι
  choice: ഞാൻ കൊടുക്കുന്നു
  rationale: വർത്തമാനകാല നിർദേശകരൂപം അതേപടി നിലനിർത്തുന്നു; ഇത് പതിവായ പ്രവൃത്തിയാണോ ഉടനെയുള്ള തീരുമാനമാണോ എന്ന് മുഖ്യവാചകത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: εἴ τινός τι
  choice: ആരിൽനിന്നെങ്കിലും എന്തെങ്കിലും
  rationale: ‘ആരിൽനിന്നെങ്കിലും എന്തെങ്കിലും’ എന്ന അനിശ്ചിത ഇരട്ടഘടന ഗ്രീക്കിന്റെ സമഗ്രമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐσυκοφάντησα
  choice: അന്യായമായി പിടിച്ചെടുത്തിട്ടുണ്ടെങ്കിൽ
  rationale: συκοφαντέω എന്നത് അധികാരദുരുപയോഗം, ഭീഷണി, ചൂഷണം, വഞ്ചന, ചിലപ്പോൾ വ്യാജാരോപണം എന്നിവയിലൂടെ പണം കൈക്കലാക്കുന്നതിനെ സൂചിപ്പിക്കാം. നികുതിപിരിവുകാരന്റെ സന്ദർഭത്തിൽ ഈ പരിഭാഷ അർഥവ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു; പകരംവായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀποδίδωμι
  choice: ഞാൻ തിരികെ കൊടുക്കുന്നു
  rationale: തിരിച്ചുനൽകുക, നഷ്ടപരിഹാരമായി നൽകുക എന്ന പുനഃസ്ഥാപനാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: τετραπλοῦν
  choice: നാലിരട്ടി
  rationale: നാലുമടങ്ങായ നഷ്ടപരിഹാരത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപരമായ അർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: δίδωμι, ἀποδίδωμι എന്നീ വർത്തമാനകാല ക്രിയകളുടെ കാലബലം
  choice: ‘ഞാൻ കൊടുക്കുന്നു … ഞാൻ തിരികെ കൊടുക്കുന്നു’ എന്ന ലളിത വർത്തമാനകാലം
  alternative: ‘ഞാൻ കൊടുക്കും … ഞാൻ തിരികെ കൊടുക്കും’ എന്ന ഉടനെയുള്ള തീരുമാനത്തെ സൂചിപ്പിക്കുന്ന ഭാവികാലവായന
  rationale: ഗ്രീക്കിൽ രണ്ടും വർത്തമാനകാല നിർദേശകരൂപങ്ങളാണ്. വർത്തമാനകാലം നിലനിർത്തുന്നത് സക്കായി തന്റെ പതിവ് വിവരിക്കുകയാണോ, ഉടനെയുള്ള തീരുമാനം പ്രഖ്യാപിക്കുകയാണോ, രണ്ടും ഉൾപ്പെടുന്നുണ്ടോ എന്ന വ്യാഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ഇതാ’, ‘കർത്താവേ’, ‘നാലിരട്ടി’ എന്നീ പദങ്ങൾ മൂലത്തിലെ ഊന്നലും ശീർഷകഭാവവും നഷ്ടപരിഹാരത്തിന്റെ കൃത്യതയും നിലനിർത്തുന്നു; വർത്തമാനകാല ക്രിയകളുടെ യഥാർഥമായ അസ്പഷ്ടത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചിരിക്കുന്നു.
