revisions:
- from: 'അവർ അവനോട് പറഞ്ഞു: “കർത്താവേ[a], അവന് പത്ത് മിനാ[b] ഉണ്ടല്ലോ—”'
  to: 'അപ്പോൾ അവർ അവനോട് പറഞ്ഞു: “കർത്താവേ[a], അവന് പത്ത് മിനാ[b] ഉണ്ട്—”'
  rationale: The revision retains the direct address, the plain present sense of possession, the historically specific term ‘മിനാ,’ and the source’s unfinished dash. It restores the narrative connective with natural Malayalam ‘അപ്പോൾ’ and removes the added emphasis in ‘ഉണ്ടല്ലോ.’
