id: LUK.19.25
reference: Luke 19:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Κύριε, ἔχει δέκα μνᾶς—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/025.yaml
  text: And they said to him[a], ‘Lord[b], he has ten minas—’
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അവനോട് പറഞ്ഞു: “കർത്താവേ[a], അവന് പത്ത് മിനാ[b] ഉണ്ട്—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യജമാനനേ” അല്ലെങ്കിൽ “പ്രഭോ.”
    reason: lexical_alternative
  - marker: b
    text: മിനാ ഒരു പുരാതന നാണയഘടകമായിരുന്നു; ഏകദേശം നൂറ് ദിവസത്തെ കൂലിക്കു തുല്യം.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: അവർ
  rationale: ഗ്രീക്കിലെ καὶ മുൻവാക്യത്തോടുള്ള ലളിതമായ ബന്ധകമാണ്. മലയാളത്തിൽ ഈ വാക്യം സ്വതന്ത്രമായി സ്വാഭാവികമാക്കാൻ പ്രത്യേകമായി ‘എന്നിട്ട്’ ചേർക്കാതെ ക്രിയയോടൊപ്പം ബന്ധം സൂചിപ്പിച്ചിരിക്കുന്നു.
- source_word: εἶπαν αὐτῷ
  choice: അവർ അവനോട് പറഞ്ഞു
  rationale: അയോറിസ്റ്റ് ക്രിയയെ ലളിതമായ ഭൂതകാലമായും ദത്തിവിനെ സ്വാഭാവികമായ പരോക്ഷകർമ്മമായും വിവർത്തനം ചെയ്യുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന അഭിസംബോധനയുടെ അധികാര-ബഹുമാന ഭാവം നിലനിർത്തുന്നു; ഉപമയിലെ സന്ദർഭത്തിൽ ‘യജമാനനേ’ എന്ന അർഥവും സാധ്യമാണ്.
- source_word: ἔχει
  choice: അവന് … ഉണ്ട്
  rationale: കൈവശമുണ്ടെന്ന വർത്തമാനകാല അർഥം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δέκα μνᾶς
  choice: പത്ത് മിനാ
  rationale: പുരാതന നാണയമൂല്യത്തെ ആധുനിക നാണയത്തിലേക്ക് തെറ്റിദ്ധരിപ്പിക്കുന്നവിധം മാറ്റാതെ ചരിത്രപരമായ പദം ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: ഉപമയിലെ κύριος എന്ന നേരിട്ടുള്ള അഭിസംബോധന
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ
  rationale: അധികാരവും ബഹുമാനവും സൂചിപ്പിക്കുന്ന അടിസ്ഥാന പദമൂല്യം കാത്തുസൂക്ഷിക്കുന്നു. എന്നാൽ ഇവിടെ അത് നിർബന്ധമായും ക്രിസ്തുശാസ്ത്രപരമായ വിശ്വാസപ്രഖ്യാപനമല്ല; ഉപമയിലെ അധികാരിയോടുള്ള ആദരസൂചക അഭിസംബോധനയായിരിക്കാം. ഈ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഉണ്ടല്ലോ’ എന്ന പ്രയോഗം സന്ദർഭത്തിലെ എതിർപ്പിന്റെയോ അതിശയത്തിന്റെയോ സ്വാഭാവിക ഭാവം നൽകുന്നു; അവസാനത്തെ ദീർഘവിരാമചിഹ്നം ഗ്രീക്ക് വാക്യത്തിലെ അപൂർണമായി നിൽക്കുന്ന ഉച്ചാരണം നിലനിർത്തുന്നു.
