reference: Luke 19:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παρεγένετο δὲ ὁ πρῶτος λέγων· Κύριε, ἡ μνᾶ σου ⸂δέκα προσηργάσατο⸃ μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: ml
  text: 'അപ്പോൾ ഒന്നാമൻ വന്ന് പറഞ്ഞു: “കർത്താവേ[a], അങ്ങയുടെ മിനാ പത്തു മിനാ കൂടി സമ്പാദിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യജമാനനേ.” ഗ്രീക്കിലെ κύριε എന്ന അഭിസംബോധനയ്ക്ക് “കർത്താവേ” എന്നതിനൊപ്പം ഒരു മേലധികാരിയോടുള്ള ആദരസൂചകമായ “യജമാനനേ” എന്ന അർഥവും വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο
  choice: വന്നു
  rationale: കഥാവിവരണത്തിൽ παραγίνομαι എന്ന ക്രിയയുടെ ‘വരുക/എത്തുക’ എന്ന സാധാരണ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ δέ കഥയിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ πρῶτος
  choice: ഒന്നാമൻ
  rationale: ക്രമത്തിൽ ആദ്യം വരുന്ന ദാസനെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ ‘ഒന്നാമൻ’ വ്യക്തവും സംക്ഷിപ്തവുമാണ്.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സമകാലിക കൃതന്തപ്രയോഗം മലയാള കഥാശൈലിയിൽ പ്രധാനക്രിയയോടൊപ്പം ‘വന്ന് പറഞ്ഞു’ എന്നു നൽകുന്നതാണ് സ്വാഭാവികം.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριε എന്ന ആദരസംബോധനയുടെ പരമ്പരാഗതവും ഗൗരവമുള്ളതുമായ തർജമയാണ് ‘കർത്താവേ’; ഉപമയിലെ മേലധികാരിയോടുള്ള ‘യജമാനനേ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἡ μνᾶ σου
  choice: അങ്ങയുടെ മിനാ
  rationale: μνᾶ എന്ന പുരാതന നാണയ/ധനമൂല്യഘടകത്തിന്റെ ചരിത്രസവിശേഷത നിലനിർത്താൻ ‘മിനാ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; σου ഉടമസ്ഥത സൂചിപ്പിക്കുന്നതിനാൽ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ചേർക്കുന്നു.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: പത്തു മിനാ കൂടി സമ്പാദിച്ചിരിക്കുന്നു
  rationale: προσεργάζομαι പ്രവർത്തനത്തിലൂടെ അധികമായി നേടുക എന്ന ആശയം നൽകുന്നു. ‘കൂടി’ അധികലാഭം വ്യക്തമാക്കുകയും ‘സമ്പാദിച്ചിരിക്കുന്നു’ പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴുള്ള ഫലം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉപമയിലെ അഭിസംബോധനയായ κύριος എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: കർത്താവേ
  alternative: യജമാനനേ
  rationale: ഇത് ഉപമയിലെ ഒരു മേലധികാരിയോടുള്ള ആദരസംബോധനയായിരിക്കാമെങ്കിലും κύριος എന്ന പദത്തിന്റെ ‘കർത്താവ്’ എന്ന പ്രധാന തർജമ നിലനിർത്തുന്നു. ഇവിടെ നിർബന്ധമായ ക്രിസ്തുശാസ്ത്ര പ്രഖ്യാപനം ചുമത്താതെ സന്ദർഭോചിതമായ ‘യജമാനനേ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥാശൈലി. അഭിസംബോധനയിൽ ‘നിങ്ങളുടെ’ എന്നതിനെക്കാൾ ആദരസൂചകവും ഏകവചനസന്ദർഭത്തിന് യോജിച്ചതുമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. പുരാതന ധനമൂല്യഘടകമായ ‘മിനാ’ വിശദീകരിക്കാതെ തന്നെ മൂലപാഠത്തിന്റെ ചരിത്രസവിശേഷത നിലനിർത്തി.
