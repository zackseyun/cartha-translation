  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, നഷ്ടപ്പെട്ടതിനെ അന്വേഷിക്കാനും രക്ഷിക്കാനുമായി മനുഷ്യപുത്രൻ വന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നഷ്ടപ്പെട്ടവരെ.’ ഗ്രീക്കിലെ പ്രയോഗം നപുംസകലിംഗ ഏകവചനമാണ്; അതിനെ പൊതുവായോ സമാഹാരമായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: വന്നു
  rationale: ആഖ്യാനത്തെ സംഗ്രഹിക്കുന്ന പ്രസ്താവനയിലെ aorist indicative ലളിതമായ ഭൂതകാലമായി സ്വാഭാവികമായി നൽകുന്നു; മലയാളവാക്യഘടനയിൽ ‘വന്നത്’ എന്ന രൂപം ഉദ്ദേശസൂചക infinitive-കളോടു ചേരുന്നു.
- source_word: γὰρ
  choice: വാക്യത്തിൽ പ്രത്യേകം പദമായി പ്രകടിപ്പിച്ചിട്ടില്ല
  rationale: γάρ മുൻവാക്യത്തിന് വിശദീകരണമോ കാരണമോ നൽകുന്നു. മലയാളത്തിൽ ഈ ബന്ധം സന്ദർഭവും ‘-ആണ്’ ഊന്നൽഘടനയും സ്വാഭാവികമായി വഹിക്കുന്നു; ‘എന്തെന്നാൽ’ ചേർത്താൽ ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ കൃത്രിമമാകും.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണവും ദാനീയേൽഗ്രന്ഥവുമായി അനുരണനമുള്ള അംഗീകൃത ശീർഷകവുമാകയാൽ വ്യാഖ്യാനിച്ച് മാറ്റാതെ പരമ്പരാഗത മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ζητῆσαι
  choice: അന്വേഷിക്കാൻ
  rationale: ἦλθεν എന്ന ക്രിയയോടു ചേർന്ന aorist infinitive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ‘അന്വേഷിക്കുക’ മനഃപൂർവമായ തിരച്ചിലിന്റെ ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: σῶσαι
  choice: രക്ഷിക്കാൻ
  rationale: ലൂക്കോസിൽ ഈ ക്രിയയ്ക്ക് ശാരീരിക വിടുതലിനപ്പുറം രക്ഷാസംബന്ധമായ വിശാല അർഥമുണ്ട്; 19:9-ലെ സന്ദർഭബന്ധവും ‘രക്ഷിക്കുക’ നിലനിർത്തുന്നു.
- source_word: τὸ ἀπολωλός
  choice: നഷ്ടപ്പെട്ടതിനെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ നപുംസക ഏകവചന perfect participle-ന്റെ രൂപം കാത്തുകൊണ്ട്, ഒരൊറ്റ പുരുഷവ്യക്തിയിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ പൊതുവായോ സമാഹാരമായോ വായിക്കാവുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം നൽകുന്നു.
theological_decisions:
- issue: τὸ ἀπολωλός എന്നതിന്റെ വ്യാപ്തിയും സൂക്ഷ്മാർഥവും
  choice: നഷ്ടപ്പെട്ടതിനെ
  alternative: നഷ്ടപ്പെട്ടവരെ / നഷ്ടപ്പെട്ട ഒരാളെ
  rationale: ഗ്രീക്ക് നപുംസക ഏകവചനം പൊതുവായോ സമാഹാരമായോ ഗ്രഹിക്കാം. സന്ദർഭത്തിൽ സക്കായിയെ ഉടനടി സൂചിപ്പിക്കുമ്പോഴും യേശുവിന്റെ വിശാലമായ ദൗത്യം പ്രസ്താവിക്കുന്നു. ‘നഷ്ടപ്പെട്ടതിനെ’ എന്നത് രൂപപരമായ ഏകവചനവും യഥാർഥമായ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സമാഹാരവായന വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗത ക്രിസ്തീയ ശീർഷകമായ ‘മനുഷ്യപുത്രൻ’ നിലനിർത്തി; ശേഷിക്കുന്ന പദക്രമം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
