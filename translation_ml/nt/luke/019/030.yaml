revisions:
- from: 'അവൻ പറഞ്ഞു: “നിങ്ങളുടെ എതിർവശത്തുള്ള ഗ്രാമത്തിലേക്കു പോകുവിൻ. അതിൽ പ്രവേശിക്കുമ്പോൾ, ഇതുവരെ ഒരു മനുഷ്യനും കയറിയിരുന്നിട്ടില്ലാത്ത, കെട്ടിയിട്ടിരിക്കുന്ന ഒരു കഴുതക്കുട്ടിയെ നിങ്ങൾ കാണും. അതിനെ അഴിച്ച് കൊണ്ടുവരുവിൻ.”'
  to: 'അവൻ പറഞ്ഞു: “നിങ്ങളുടെ എതിർവശത്തുള്ള ഗ്രാമത്തിലേക്കു പോകുവിൻ. അതിലേക്കു പ്രവേശിക്കുമ്പോൾ, കെട്ടിയിട്ടിരിക്കുന്ന ഒരു കഴുതക്കുട്ടിയെ നിങ്ങൾ കാണും; അതിന്റെ മേൽ ഒരു മനുഷ്യനും ഇതുവരെ ഒരിക്കലും ഇരുന്നിട്ടില്ല. അതിനെ അഴിച്ച് കൊണ്ടുവരുവിൻ.”'
  rationale: The revision retains the draft’s established rendering of πῶλος and its formal, respectful imperative style, while explicitly expressing ‘ever’ and translating ‘sat on’ directly. No footnotes are needed.
