id: LUK.19.30
reference: Luke 19:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നിങ്ങളുടെ എതിർവശത്തുള്ള ഗ്രാമത്തിലേക്കു പോകുവിൻ. അതിലേക്കു പ്രവേശിക്കുമ്പോൾ, കെട്ടിയിട്ടിരിക്കുന്ന ഒരു കഴുതക്കുട്ടിയെ നിങ്ങൾ കാണും; അതിന്റെ മേൽ ഒരു മനുഷ്യനും ഇതുവരെ ഒരിക്കലും ഇരുന്നിട്ടില്ല. അതിനെ അഴിച്ച് കൊണ്ടുവരുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν κατέναντι κώμην
  choice: നിങ്ങളുടെ എതിർവശത്തുള്ള ഗ്രാമം
  rationale: κατέναντι എന്നത് സന്ദർഭത്തിൽ ശിഷ്യന്മാർക്കു നേരെ എതിർവശത്തുള്ള ഗ്രാമത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: πῶλον
  choice: കഴുതക്കുട്ടി
  rationale: πῶλος പൊതുവിൽ ഒരു ചെറുകുതിരവർഗമൃഗത്തെ സൂചിപ്പിക്കാമെങ്കിലും ലൂക്കാ 19:35-ലെയും സമാന്തര സുവിശേഷസന്ദർഭത്തിലെയും തെളിവ് ഇവിടെ കഴുതക്കുട്ടിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: δεδεμένον
  choice: കെട്ടിയിട്ടിരിക്കുന്ന
  rationale: പൂർണ്ണകൃത്യ കർമണി രൂപത്തിന്റെ നിലവിലുള്ള അവസ്ഥ—കെട്ടപ്പെട്ട നില—സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν
  choice: ഇതുവരെ ഒരു മനുഷ്യനും കയറിയിരുന്നിട്ടില്ലാത്ത
  rationale: മൃഗത്തിന്റെ മേൽ ഇരിക്കുക എന്ന ആശയം മലയാളത്തിൽ സാധാരണയായി ‘കയറുക’ എന്നു പറയുന്നതിനാൽ അർത്ഥം സ്വാഭാവികമായി കൈമാറുന്നു; πώποτεയുടെ ‘ഇതുവരെ ഒരിക്കലും’ എന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: λύσαντες αὐτὸν ἀγάγετε
  choice: അതിനെ അഴിച്ച് കൊണ്ടുവരുവിൻ
  rationale: ഗ്രീക്കിലെ അനുബന്ധ കൃത്യവും മുഖ്യകല്പനയും മലയാളത്തിൽ സംക്ഷിപ്തവും കൃത്യവുമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള കല്പനയിൽ ബഹുമാനസൂചക ബഹുവചനമായ ‘പോകുവിൻ/കൊണ്ടുവരുവിൻ’ ഉപയോഗിച്ചു; മൂലത്തിലെ അർത്ഥക്രമവും ഊന്നലും പരമാവധി നിലനിർത്തി.
