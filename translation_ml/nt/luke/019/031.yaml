id: LUK.19.31
reference: Luke 19:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: ml
  text: ആരെങ്കിലും നിങ്ങളോട്, “എന്തിനാണ് അതിനെ അഴിക്കുന്നത്?” എന്നു ചോദിച്ചാൽ, “കർത്താവിന്[a] അതിനെ ആവശ്യമുണ്ട്” എന്ന് ഇങ്ങനെ പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യജമാനന്.”
    reason: κύριος എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘കർത്താവ്’ എന്നും ‘യജമാനൻ’ എന്നും അർത്ഥമാകാം.
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: ചോദിച്ചാൽ
  rationale: ചോദ്യം ചോദിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ ക്രിയ; ἐάν എന്ന വ്യവസ്ഥാപദത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാരൂപം.
- source_word: Διὰ τί
  choice: എന്തിനാണ്
  rationale: കാരണത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λύετε
  choice: അതിനെ അഴിക്കുന്നത്
  rationale: കെട്ടിയിരിക്കുന്ന കഴുതക്കുട്ടിയെ കെട്ടിൽനിന്ന് അഴിക്കുന്നതാണ് സന്ദർഭം; ഗ്രീക്കിൽ പ്രകടമല്ലാത്ത കർമം വ്യക്തതയ്ക്കായി ‘അതിനെ’ എന്നു ചേർത്തു.
- source_word: οὕτως ἐρεῖτε
  choice: ഇങ്ങനെ പറയണം
  rationale: ഭാവികാലരൂപത്തിന്റെ നിർദേശാത്മക ബലം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: യേശുവിനെ സൂചിപ്പിക്കാവുന്ന ബഹുമാനപദവും ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; ‘യജമാനൻ’ എന്ന സന്ദർഭസാധ്യമായ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: αὐτοῦ
  choice: അതിനെ
  rationale: ഉടൻ മുമ്പുള്ള കഴുതക്കുട്ടിയെയാണ് സർവനാമം ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; മലയാളപ്രയോഗത്തിന് അനുയോജ്യമായി കർമരൂപം ഉപയോഗിച്ചു.
- source_word: χρείαν ἔχει
  choice: ആവശ്യമുണ്ട്
  rationale: ‘ആവശ്യം ഉണ്ട്’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർത്ഥവും ഗൗരവമുള്ള സ്വരവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: Ὁ κύριος എന്ന പദത്തിന്റെ സൂചനയും അർത്ഥവ്യാപ്തിയും
  choice: ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി; ഇത് യേശുവിനെ സൂചിപ്പിക്കുന്ന ശീർഷകമായി വായിക്കാം.
  alternative: ‘യജമാനൻ’—ഒരു ഉടമയെയോ അധികാരിയെയോ സൂചിപ്പിക്കുന്ന പ്രായോഗിക അർത്ഥം.
  rationale: ലൂക്കോസിന്റെ വിവരണത്തിൽ κύριος യേശുവിനെ സൂചിപ്പിക്കാൻ പതിവായി വരുന്നതിനാൽ ‘കർത്താവ്’ യോജിക്കുന്നു; അതേസമയം ഈ സന്ദർഭത്തിലെ ‘യജമാനൻ’ എന്ന യഥാർഥ ഭാഷാസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ലളിതവും മാന്യവുമായ വിവരണശൈലി. നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമാക്കി; മൂലത്തിലെ വ്യവസ്ഥയും നിർദേശാത്മക ബലവും നിലനിർത്തി.
