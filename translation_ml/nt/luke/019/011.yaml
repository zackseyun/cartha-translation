  to: അവർ ഇതു കേട്ടുകൊണ്ടിരിക്കുമ്പോൾ, യേശു തുടർന്ന് ഒരു ഉപമ പറഞ്ഞു. അദ്ദേഹം യെരൂശലേമിന് സമീപമായിരുന്നതുകൊണ്ടും ദൈവരാജ്യം ഉടൻ പ്രത്യക്ഷമാകാനിരിക്കുകയാണെന്ന് അവർ കരുതിയിരുന്നതുകൊണ്ടുമാണ് അദ്ദേഹം ആ ഉപമ പറഞ്ഞത്.[a]
