reference: Luke 19:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: ml
  text: അവർ ഇതു കേട്ടുകൊണ്ടിരിക്കുമ്പോൾ, യേശു തുടർന്ന് ഒരു ഉപമ പറഞ്ഞു. അദ്ദേഹം യെരൂശലേമിന് സമീപമായിരുന്നതുകൊണ്ടും ദൈവരാജ്യം ഉടൻ പ്രത്യക്ഷമാകാനിരിക്കുകയാണെന്ന് അവർ കരുതിയിരുന്നതുകൊണ്ടുമാണ് അദ്ദേഹം ആ ഉപമ പറഞ്ഞത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉടൻ വെളിപ്പെടാനിരിക്കുകയാണ്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് ദൃശ്യമാകുക, പ്രകടമാകുക എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: അവർ ഇതു കേട്ടുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തോടുകൂടിയ genitive absolute ഒരേസമയം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം ആ തുടർച്ച സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: προσθεὶς εἶπεν παραβολὴν
  choice: യേശു തുടർന്ന് ഒരു ഉപമ പറഞ്ഞു
  rationale: പ്രസംഗം തുടരുകയോ അതിനോട് കൂടുതൽ ചേർത്തുപറയുകയോ ചെയ്യുന്ന ആശയമാണ് ഈ പ്രയോഗത്തിനുള്ളത്. വ്യക്തതയ്ക്കായി സന്ദർഭത്തിൽ നിന്നുള്ള കർത്താവായ യേശുവിന്റെ പേര് ഉപയോഗിച്ചു; ‘ഉപമ’ സുവിശേഷങ്ങളിലെ സ്ഥിരമായ സാഹിത്യപദമാണ്.
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: താൻ യെരൂശലേമിന് അടുത്തെത്തിയിരുന്നതിനാൽ
  rationale: διά + articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു. അടുത്തിരുന്നത് യേശുവാണെന്ന വാക്യഘടന നിലനിർത്തുന്നു; യാത്രാസന്ദർഭത്തിൽ ‘അടുത്തെത്തിയിരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: δοκεῖν αὐτοὺς
  choice: അവർ കരുതിയതിനാൽ
  rationale: ഇത് അവരുടെ ധാരണയെയോ പ്രതീക്ഷയെയോ സൂചിപ്പിക്കുന്നു; ഉറപ്പായ അറിവ് എന്ന അർഥം നൽകുന്നില്ല. മുൻ കാരണത്തോട് ഏകോപിപ്പിച്ച് രണ്ടാമത്തെ കാരണമായി വിവർത്തനം ചെയ്തു.
- source_word: παραχρῆμα
  choice: ഉടൻ
  rationale: തൽക്ഷണതയെ ഊന്നുന്ന ക്രിയാവിശേഷണം; ലളിതവും ആധുനികവുമായ മലയാളസമം.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: പ്രത്യക്ഷപ്പെടാൻ പോകുന്നു
  rationale: μέλλω സമീപഭാവിയെയോ സംഭവിക്കാനിരിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; ἀναφαίνεσθαι ദൃശ്യമാകുക/വെളിപ്പെടുക എന്ന അർഥവ്യാപ്തി വഹിക്കുന്നു. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘പ്രത്യക്ഷപ്പെടുക’ ഉപയോഗിച്ചു.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥാപിതവും സ്രോതസ്സിനോട് കൃത്യവുമായ പ്രയോഗം; ലൂക്കോസിലെ ആഖ്യാന-ദൈവശാസ്ത്ര തുടർച്ച നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവരാജ്യത്തിന്റെ പ്രതീക്ഷിക്കപ്പെട്ട പ്രത്യക്ഷതയുടെ സ്വഭാവം
  choice: ദൈവരാജ്യം ‘ഉടൻ പ്രത്യക്ഷപ്പെടാൻ പോകുന്നു’ എന്ന അവരുടെ പ്രതീക്ഷയായി മാത്രം അവതരിപ്പിച്ചു.
  alternative: രാഷ്ട്രീയമായി സ്ഥാപിക്കപ്പെടും എന്നോ അന്ത്യകാലത്തിൽ പൂർണമായി വെളിപ്പെടും എന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം പ്രത്യക്ഷത ഉടനുണ്ടാകുമെന്ന അവരുടെ ധാരണ അറിയിക്കുന്നുവെങ്കിലും അതിന്റെ രാഷ്ട്രീയമോ അന്ത്യകാലപരമോ ആത്മീയമോ ആയ രീതി നിർവചിക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; കാരണബന്ധം വ്യക്തമായി നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘പ്രത്യക്ഷപ്പെടുക’ ആശയമുള്ള വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
