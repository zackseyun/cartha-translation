id: LUK.19.7
reference: Luke 19:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: ml
  text: ഇതു കണ്ട എല്ലാവരും, “ഇവൻ പാപിയായ ഒരു മനുഷ്യന്റെ വീട്ടിൽ താമസിക്കാൻ[a] കയറിയിരിക്കുന്നു!” എന്നു പറഞ്ഞ് പിറുപിറുക്കാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഒരു പാപിയുടെ അതിഥിയായിരിക്കാൻ.”
    reason: καταλῦσαι എന്നതിന് ‘അതിഥിയായി പാർക്കുക’ എന്ന അർഥവും, ἁμαρτωλῷ ἀνδρὶ എന്ന പ്രയോഗത്തിന് ചുരുക്കമായി ‘ഒരു പാപി’ എന്ന പരിഭാഷയും സാധ്യമാണ്.
lexical_decisions:
- source_word: ἰδόντες
  choice: ഇതു കണ്ട
  rationale: ആയോറിസ്റ്റ് കൃദന്തരൂപം മുഖ്യപ്രതികരണത്തിന്റെ സാഹചര്യമായി സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘ഇതു’ എന്നത് യേശു സക്കായിയുടെ വീട്ടിലേക്കു പോകുന്നതിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭപൂരകമാണ്.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: പ്രതികരണം ജനക്കൂട്ടത്തിലെ എല്ലാവരുടേതാണെന്ന ഗ്രീക്ക് ഊന്നൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: διεγόγγυζον
  choice: പിറുപിറുത്തു
  rationale: അതൃപ്തിയോടെയുള്ള മുറുമുറുപ്പ് എന്ന അർഥം നൽകുന്ന സ്വാഭാവിക മലയാളപദം; ഇംപെർഫെക്റ്റിന്റെ തുടരുന്ന ഭാവം ‘എന്നു പറഞ്ഞ്’ എന്ന ഘടനയോടൊപ്പം സന്ദർഭത്തിൽ പ്രകടമാകുന്നു.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞ്
  rationale: പിറുപിറുപ്പിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന കൃദന്തരൂപം സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ നൽകുന്നു.
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: പാപിയായ ഒരു മനുഷ്യന്റെ വീട്ടിൽ
  rationale: παρά + ദത്തിവ് ഒരാളോടൊപ്പം/അയാളുടെ വസതിയിൽ പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ἁμαρτωλῷ എന്ന വിശേഷണവും ἀνδρί എന്ന പുരുഷലിംഗ നാമവും വേർതിരിച്ച് നിലനിർത്തുന്നു. ‘വീട്ടിൽ’ സന്ദർഭത്തിൽ അന്തർലീനമായ സ്ഥലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: εἰσῆλθεν
  choice: കയറിയല്ലോ
  rationale: വീട്ടിനകത്തേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നു; ‘-ല്ലോ’ ജനക്കൂട്ടത്തിന്റെ കുറ്റപ്പെടുത്തലും അതിശയഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καταλῦσαι
  choice: താമസിക്കാൻ
  rationale: അതിഥിയായി പാർക്കുക എന്ന സന്ദർഭാർത്ഥം ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘അതിഥിയായിരിക്കാൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: സക്കായിയെക്കുറിച്ചുള്ള ജനക്കൂട്ടത്തിന്റെ വിശേഷണം
  choice: പാപിയായ ഒരു മനുഷ്യൻ
  alternative: ഒരു പാപി
  rationale: ഗ്രീക്കിലെ വിശേഷണം + നാമം (ἁμαρτωλῷ ἀνδρὶ) എന്ന രൂപം നിലനിർത്തുകയും ജനക്കൂട്ടത്തിന്റെ അവഹേളനപരമായ വിലയിരുത്തൽ അധിക ദൈവശാസ്ത്ര വ്യാഖ്യാനമില്ലാതെ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഉദ്ധരണിയിലെ ‘കയറിയല്ലോ’ ജനക്കൂട്ടത്തിന്റെ വിമർശനസ്വരം സ്വാഭാവികമായി നൽകുന്നു; സഭാവിഭാഗസവിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
