  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ ആഖ്യാനത്തുടർച്ചയിൽ ഉൾപ്പെടുത്തി
  rationale: ഗ്രീക്കിലെ Καὶ അടുത്ത സംഭവത്തെ ലളിതമായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘പിന്നെ’ അധികമായ കാലക്രമസൂചന നൽകാം; ‘കൂടാതെ’ അസ്വാഭാവികമാണ്. അതിനാൽ ക്രിയകളുടെ ബന്ധത്തിലൂടെ തുടർച്ച സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: εἰσελθὼν
