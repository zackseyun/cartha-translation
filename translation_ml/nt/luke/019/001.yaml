  rationale: Imperfect രൂപം പുരോഗമിച്ചുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കടന്നുപോയി’ എന്ന പൂർത്തിയായ ഭാവത്തിനുപകരം ‘കടന്നുപോകുകയായിരുന്നു’ അതിന്റെ അപൂർണ/തുടർച്ചാഭാവം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: τὴν Ἰεριχώ
