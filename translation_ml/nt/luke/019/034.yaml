id: LUK.19.34
reference: Luke 19:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “കർത്താവിന്[a] അതിനെ ആവശ്യമുണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, κύριος എന്നത് യേശുവിന്റെ ശീർഷകമായി അല്ലാതെ കഴുതക്കുട്ടിയുടെ ഉടമയെയോ യജമാനനെയോ സൂചിപ്പിക്കുന്നതായി എടുത്താൽ, “ഉടമയ്ക്ക് അതിനെ ആവശ്യമുണ്ട്” അല്ലെങ്കിൽ “യജമാനന് അതിനെ ആവശ്യമുണ്ട്.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: അവർ
  rationale: οἱ മുൻപ് പരാമർശിച്ച ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധകമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം പദമായി വിവർത്തനം ചെയ്യാതെ വാക്യത്തുടർച്ചയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: εἶπαν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാലപ്രയോഗം; ‘മറുപടി പറഞ്ഞു’ എന്നത് സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും മൂലപദത്തിൽ വ്യക്തമല്ലാത്ത അർഥം ചേർക്കും.
- source_word: ὅτι
  choice: ഉദ്ധരണിചിഹ്നവും ദ്വിബിന്ദുവും വഴി പ്രതിനിധീകരിച്ചു
  rationale: ὅτι ഇവിടെ നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ദ്വിബിന്ദുവും ഉദ്ധരണിചിഹ്നങ്ങളും ഈ ധർമ്മം സ്വാഭാവികമായി നിർവഹിക്കുന്നു.
- source_word: Ὁ κύριος
  choice: കർത്താവിന്
  rationale: κύριος എന്നതിന് പദ്ധതിയുടെ സാധാരണ ശീർഷകരൂപമായ ‘കർത്താവ്’ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് യേശുവിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം; ‘യജമാനൻ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു. ദാതൃവിഭക്തി χρείαν ἔχει എന്ന പ്രയോഗത്തിന് സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: αὐτοῦ
  choice: അതിനെ
  rationale: സർവനാമം മുമ്പ് പറഞ്ഞ കഴുതക്കുട്ടിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ആവശ്യമുണ്ട്’ എന്നതിനോടൊപ്പം കർമരൂപമായ ‘അതിനെ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: χρείαν ἔχει
  choice: ആവശ്യമുണ്ട്
  rationale: അക്ഷരാർഥത്തിൽ ‘ആവശ്യം ഉണ്ട്’ എന്ന ഗ്രീക്ക് പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആവശ്യമുണ്ട്’ എന്നു വരുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ മറുപടിയിലെ κύριος ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘കർത്താവ്’ എന്ന് നൽകി, സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കാൻ അനുവദിച്ചു.
  alternative: ‘യജമാനൻ’—കഴുതക്കുട്ടിയുടെ ഉടമയെയോ യജമാനനെയോ സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
  rationale: ലൂക്കോസിന്റെ ഉടൻമുമ്പുള്ള സന്ദർഭത്തിൽ യേശു ശിഷ്യന്മാർക്ക് നൽകുന്ന മുൻകൂട്ടിയുള്ള മറുപടിയാണിത്; ലൂക്കോസ് κύριος എന്ന പദം യേശുവിനായി പതിവായി ഉപയോഗിക്കുന്നു. എന്നാൽ പദത്തിന് ‘യജമാനൻ/ഉടമ’ എന്ന സാധുവായ അർഥവും ഉള്ളതിനാൽ ആ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കർത്താവ്’ എന്ന സ്ഥാപിത ബൈബിൾപദം നിലനിർത്തിയിട്ടും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
