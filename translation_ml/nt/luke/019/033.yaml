id: LUK.19.33
reference: Luke 19:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: ml
  text: അവർ കഴുതക്കുട്ടിയെ അഴിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അതിന്റെ ഉടമകൾ[a] അവരോട്, “നിങ്ങൾ കഴുതക്കുട്ടിയെ അഴിക്കുന്നത് എന്തിന്?” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യജമാനന്മാർ.” ഗ്രീക്കിൽ ഇവിടെ ‘കർത്താവ്/യജമാനൻ’ (κύριος) എന്ന പദത്തിന്റെ ബഹുവചനമാണുള്ളത്; ഈ സന്ദർഭത്തിൽ അത് കഴുതക്കുട്ടിയുടെ മനുഷ്യ ഉടമകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυόντων / λύετε
  choice: അഴിച്ചുകൊണ്ടിരിക്കുമ്പോൾ / അഴിക്കുന്നത്
  rationale: കെട്ടിയിട്ടിരിക്കുന്ന മൃഗത്തെ വിടുവിക്കുന്ന പ്രവൃത്തിക്ക് ‘അഴിക്കുക’ സ്വാഭാവികമാണ്. ആദ്യ ക്രിയയുടെ സമകാലികവും തുടർച്ചയുള്ളതുമായ ഭാവം ‘അഴിച്ചുകൊണ്ടിരിക്കുമ്പോൾ’ എന്നും ചോദ്യത്തിലെ ആവർത്തനം ‘അഴിക്കുന്നത്’ എന്നും നൽകി, ഗ്രീക്കിലെ പദബന്ധം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിലെ ഉപവാക്യഘടനയിൽ പ്രത്യേകമായി ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘എന്നാൽ’ ചേർക്കാതെ തന്നെ പ്രവാഹം സ്വാഭാവികമായി ലഭിക്കുന്നു; വിരോധഭാവം ഇറക്കുമതി ചെയ്യുന്നതും ഒഴിവാക്കുന്നു.
- source_word: αὐτῶν
  choice: അവർ
  rationale: മുൻസന്ദർഭത്തിലെ രണ്ടു ശിഷ്യന്മാരെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്. പേരുപറഞ്ഞ് വിശദീകരിക്കാതെ ഉറവിടത്തിലെ സർവനാമപരാമർശം നിലനിർത്തുന്നു.
- source_word: πῶλον
  choice: കഴുതക്കുട്ടി
  rationale: πῶλος പൊതുവിൽ ഒരു ഇളം മൃഗത്തെ സൂചിപ്പിക്കാമെങ്കിലും മുൻസന്ദർഭം ഇവിടെ കഴുതയുടെ കുട്ടിയാണെന്ന് വ്യക്തമാക്കുന്നു. ‘കഴുതക്കുട്ടി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: εἶπαν
  choice: എന്നു ചോദിച്ചു
  rationale: λέγω എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘പറയുക’ ആണെങ്കിലും പിന്നാലെയുള്ള വാക്കുകൾ നേരിട്ടുള്ള ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് സ്വാഭാവികമായ വാക്പ്രയോഗമാണ്; പ്രസ്താവനയുടെ ആശയബലം മാറ്റുന്നില്ല.
- source_word: οἱ κύριοι αὐτοῦ
  choice: അതിന്റെ ഉടമകൾ
  rationale: κύριοι എന്നത് κύριος എന്ന പദത്തിന്റെ ബഹുവചനമാണ്. ഇവിടെ ദൈവിക സ്ഥാനപ്പേരല്ല, മൃഗത്തിന്റെ മനുഷ്യ ഉടമകളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ഉടമകൾ’ സന്ദർഭാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: πρὸς αὐτούς
  choice: അവരോട്
  rationale: സംസാരക്രിയയോടൊപ്പം πρὸς + accusative നൽകുന്ന ദിശാബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവരോട്’ എന്നു വരുന്നു.
- source_word: Τί
  choice: എന്തിന്
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്ത്’ ആയിരിക്കാമെങ്കിലും ഈ ചോദ്യപ്രയോഗം പ്രവൃത്തിയുടെ കാരണം ചോദിക്കുന്നു. മലയാളത്തിൽ ‘എന്തിന്?’ അതിന്റെ സ്വാഭാവിക തുല്യമാണ്.
theological_decisions:
- issue: മനുഷ്യ ഉടമസ്ഥതയുടെ സന്ദർഭത്തിലെ κύριοι എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഉടമകൾ
  alternative: യജമാനന്മാർ
  rationale: ഈ സന്ദർഭത്തിൽ പദം കഴുതക്കുട്ടിയുടെ മനുഷ്യ ഉടമകളെ സൂചിപ്പിക്കുന്നു. ‘ഉടമകൾ’ തെറ്റായ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനി ഒഴിവാക്കുകയും ഉടമസ്ഥത വ്യക്തമായി അറിയിക്കുകയും ചെയ്യുന്നു; ‘യജമാനന്മാർ’ സാധ്യമായ മറ്റൊരു പരിഭാഷയാണ്.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘അഴിച്ചുകൊണ്ടിരിക്കുമ്പോൾ’ എന്ന രൂപം പ്രവൃത്തികളുടെ സമകാലികതയും ‘അഴിക്കുന്നത്’ എന്ന ആവർത്തനം ഗ്രീക്ക് മൂലത്തിലെ ക്രിയാപദബന്ധവും സംരക്ഷിക്കുന്നു.
