  revision_rationale: സുരക്ഷിതമായ തിരുത്തൽ ആവശ്യമില്ല. നിലവിലെ പാഠവും അടിക്കുറിപ്പുകളും ഉറവിടപാഠത്തോടും ലക്ഷ്യഭാഷയിലെ സ്വാഭാവിക പ്രയോഗത്തോടും യോജിക്കുന്നു; എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട സ്ഥാനങ്ങളിൽ ശരിയായി നിൽക്കുന്നു.
