id: LUK.19.22
reference: Luke 19:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “നിന്റെ വായിൽനിന്നുതന്നെ[a] ഞാൻ നിന്നെ വിധിക്കും, ദുഷ്ടനായ അടിമേ![b] ഞാൻ കഠിനനായ മനുഷ്യനാണെന്നും, ഞാൻ വെച്ചിട്ടില്ലാത്തത്[c] എടുത്തുകൊള്ളുകയും വിതച്ചിട്ടില്ലാത്തത് കൊയ്യുകയും[d] ചെയ്യുന്നവനാണെന്നും നീ അറിഞ്ഞിരുന്നല്ലോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ സ്വന്തം വാക്കുകളാൽ.”
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: δοῦλος. “ദാസൻ” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ യജമാനനോടുള്ള അധീനമായ അടിമസ്ഥിതി സന്ദർഭത്തിൽ പ്രധാനമാണ്.'
    reason: alternative_reading
  - marker: c
    text: അഥവാ “ഞാൻ നിക്ഷേപിച്ചിട്ടില്ലാത്തത്.”
    reason: lexical_alternative
  - marker: d
    text: ചില പരിഭാഷകൾ “ഞാൻ വിതയ്ക്കാത്തിടത്ത് കൊയ്യുന്നു” എന്നു നൽകുന്നു; ഇവിടെ ഗ്രീക്ക് കൂടുതൽ അക്ഷരാർഥത്തിൽ “ഞാൻ വിതച്ചിട്ടില്ലാത്തത് കൊയ്യുന്നു” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: നിന്റെ വായിൽനിന്നുതന്നെ
  rationale: വിധി ആ അടിമയുടെ സ്വന്തം മൊഴിയെ അടിസ്ഥാനമാക്കിയുള്ളതാണെന്ന ഗ്രീക്ക് ശൈലി നിലനിർത്തുന്നു; ‘തന്നെ’ മലയാളത്തിൽ ഊന്നൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: κρίνω
  choice: ഞാൻ നിന്നെ വിധിക്കും
  rationale: ഭാവികാലരൂപം നിലനിർത്തുന്നു. ‘ശിക്ഷ വിധിക്കും’ എന്നു പറഞ്ഞാൽ ഗ്രീക്കിലുള്ളതിനെക്കാൾ അർഥം ചുരുങ്ങും.
- source_word: πονηρὲ
  choice: ദുഷ്ടനായ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയിലെ ധാർമിക കുറ്റപ്പെടുത്തൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: δοῦλε
  choice: അടിമേ
  rationale: യജമാനൻ–അടിമ ബന്ധം ഈ ഉപമയിൽ വ്യക്തമായി പ്രസക്തമായതിനാൽ ബന്ധിതവും അധീനവുമായ സാമൂഹികനില ‘അടിമ’ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ᾔδεις
  choice: നീ അറിഞ്ഞിരുന്നല്ലോ
  rationale: οἶδα എന്ന ക്രിയയുടെ ഭൂതകാലാർഥവും യജമാനന്റെ വാചാടോപപരമായ ചോദ്യം/പ്രതിവാദഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐστηρός
  choice: കഠിനനായ
  rationale: അടിമ യജമാനനെക്കുറിച്ച് ഉന്നയിച്ച പ്രതികൂലമായ, കടുപ്പമുള്ള സ്വഭാവവിവരണം നിലനിർത്തുന്നു; ‘കർശനനായ’ എന്നത് താരതമ്യേന നിഷ്പക്ഷമാകാം.
- source_word: αἴρων
  choice: എടുത്തുകൊള്ളുകയും
  rationale: αἴρωയുടെ ‘എടുക്കുക/കൊണ്ടുപോകുക’ എന്ന വിശാലാർഥം സൂക്ഷിക്കുകയും തനിക്കുള്ളതല്ലാത്തത് കൈക്കലാക്കുന്നു എന്ന ആരോപണത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: ὃ οὐκ ἔθηκα
  choice: ഞാൻ വെച്ചിട്ടില്ലാത്തത്
  rationale: τίθημι എന്നതിന്റെ അടിസ്ഥാനമായ ‘വെക്കുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; സാമ്പത്തിക ‘നിക്ഷേപം’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: θερίζων
  choice: കൊയ്യുകയും
  rationale: വിതയ്ക്കലുമായി ചേർന്ന കാർഷികരൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὃ οὐκ ἔσπειρα
  choice: വിതച്ചിട്ടില്ലാത്തത്
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ കർമസർവനാമമായ ὃയെ ‘എവിടെ’ എന്നല്ല, ‘എന്ത്/അത്’ എന്നായി കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമ
  alternative: ദാസൻ / വേലക്കാരൻ
  rationale: ഇവിടെ യജമാനനോടുള്ള അധീനബന്ധവും അടിമസ്ഥിതിയും പശ്ചാത്തലത്തിൽ പ്രധാനമാണ്. ‘വേലക്കാരൻ’ കൂലിപ്പണിക്കാരനെ സൂചിപ്പിക്കാനിടയുള്ളതിനാൽ സാമൂഹികബന്ധത്തിന്റെ ശക്തി കുറയും.
- issue: യജമാനന്റെ സ്വഭാവവിവരണം യാഥാർഥ്യസ്ഥിരീകരണമാണോ, അടിമയുടെ വാക്കുകളുടെ വാചാടോപപരമായ ആവർത്തനമാണോ
  choice: ‘ഞാൻ കഠിനനായ മനുഷ്യനാണെന്ന് നീ അറിഞ്ഞിരുന്നു’ എന്ന ഗ്രീക്ക് ഘടന വ്യാഖ്യാനച്ചേർക്കലില്ലാതെ നിലനിർത്തി
  alternative: ‘ഞാൻ കഠിനനാണെന്ന് നീ പറയുന്നതനുസരിച്ച്’ / ‘ഞാൻ കഠിനനാണെന്ന് നീ കരുതിയെങ്കിൽ’
  rationale: യജമാനൻ അടിമയുടെ സ്വന്തം വാക്കുകളെ അവന്റെ വിരുദ്ധമായി ഉപയോഗിക്കുന്ന വാചാടോപപരമായ സമ്മർദം സന്ദർഭത്തിലുണ്ട്. എന്നാൽ ഗ്രീക്ക് നേരിട്ടു പറയുന്ന രൂപത്തെ വ്യവസ്ഥാവാക്യമാക്കുകയോ വെറും ആരോപണമെന്നു വ്യക്തമാക്കുകയോ ചെയ്യുന്നത് വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അടിമേ’ എന്ന സംബോധനരൂപവും ‘അറിഞ്ഞിരുന്നല്ലോ?’ എന്ന വാചാടോപചോദ്യവും സംഭാഷണത്തിന്റെ മൂർച്ച നിലനിർത്തുന്നു. ഓരോ അടിക്കുറിപ്പുസൂചകവും ബന്ധപ്പെട്ട വാക്കിനോടു ചേർത്തിരിക്കുന്നു.
