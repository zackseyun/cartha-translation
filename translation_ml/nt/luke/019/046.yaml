  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: ml
  text: 'അവരോട് ഇങ്ങനെ പറഞ്ഞു: “എഴുതപ്പെട്ടിരിക്കുന്നു: ‘എന്റെ ഭവനം[a] പ്രാർഥനയുടെ ഭവനമായിരിക്കും.’ എന്നാൽ നിങ്ങളാകട്ടെ അതിനെ കൊള്ളക്കാരുടെ[b] ഗുഹയാക്കിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ ആലയം” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥം “എന്റെ ഭവനം” എന്നാണ്; ഇത് യെശയ്യാവ് 56:7-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “കൊള്ളക്കാരുടെ ഗുഹ” എന്നത് യിരെമ്യാവ് 7:11-നെ പ്രതിധ്വനിപ്പിക്കുന്നു. “കൊള്ളക്കാർ” എന്ന പദം “വഴിക്കൊള്ളക്കാർ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: അവരോട് ഇങ്ങനെ പറഞ്ഞു
  rationale: മുൻവിവരണത്തോടു ബന്ധിപ്പിക്കുന്ന ഗ്രീക്ക് വർത്തമാന കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ നേരിട്ടുള്ള പ്രസ്താവനയായി നൽകുന്നു; ‘ഇങ്ങനെ’ തുടർന്ന് വരുന്ന ഉദ്ധരണിയെ വ്യക്തമായി പരിചയപ്പെടുത്തുന്നു.
- source_word: Γέγραπται
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന പൂർണ നിഷ്ക്രിയ ക്രിയാരൂപത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യം സംരക്ഷിക്കുന്നു.
- source_word: Καὶ ἔσται
  choice: ആയിരിക്കും
  rationale: ഉദ്ധരിച്ച പ്രവചനവാക്യത്തിന്റെ ഭാവികാലബലം നിലനിർത്തുന്നു; വാക്യാരംഭത്തിലെ καί മലയാള ഉദ്ധരണിയിൽ പ്രത്യേകം നൽകുന്നത് അസ്വാഭാവികമായതിനാൽ വാക്യബന്ധത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ὁ οἶκός μου
  choice: എന്റെ ഭവനം
  rationale: സന്ദർഭത്തിൽ ദേവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, οἶκος എന്ന പദത്തിന്റെ ‘ഭവനം’ എന്ന അടിസ്ഥാനാർഥവും യെശയ്യാവ് 56:7-ലേക്കുള്ള ഉദ്ധരണിബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: οἶκος προσευχῆς
  choice: പ്രാർഥനയുടെ ഭവനം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയും ആവർത്തിച്ചുള്ള ‘ഭവനം’ എന്ന രൂപകവും സംരക്ഷിക്കുന്ന, വ്യക്തവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: ὑμεῖς δὲ
  choice: എന്നാൽ നിങ്ങളാകട്ടെ
  rationale: δὲ സൂചിപ്പിക്കുന്ന ശക്തമായ വൈരുധ്യവും ὑμεῖς എന്ന വ്യക്തമായ സർവനാമത്തിന്റെ ഊന്നലും പ്രകടമാക്കുന്നു.
- source_word: ἐποιήσατε
  choice: ആക്കിയിരിക്കുന്നു
  rationale: കഴിഞ്ഞ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: σπήλαιον
  choice: ഗുഹ
  rationale: യിരെമ്യാവ് 7:11-ലെ പ്രവാചകീയ ദൃശ്യവും ഒളിത്താവളം എന്ന ആശയവും നിലനിർത്തുന്ന നേരിട്ടുള്ള പദം.
- source_word: λῃστῶν
  choice: കൊള്ളക്കാരുടെ
  rationale: പദത്തിന് കവർച്ചക്കാരെയോ വഴിക്കൊള്ളക്കാരെയോ സൂചിപ്പിക്കാം; ‘കൊള്ളക്കാർ’ രാഷ്ട്രീയ കലാപകാരികൾ എന്ന അർഥം അനാവശ്യമായി ചുമത്താതെ ശക്തമായ കുറ്റകൃത്യാർഥം നൽകുന്നു.
theological_decisions:
- issue: ദേവാലയത്തെ ‘ഭവനം’ എന്നോ ‘ആലയം’ എന്നോ പരിഭാഷപ്പെടുത്തൽ
  choice: എന്റെ ഭവനം ... പ്രാർഥനയുടെ ഭവനം
  alternative: എന്റെ ആലയം ... പ്രാർഥനയുടെ ഭവനം
  rationale: ഗ്രീക്ക് οἶκος അക്ഷരാർഥത്തിൽ ‘ഭവനം’ എന്നാണ്. അത് നിലനിർത്തുന്നത് യെശയ്യാവ് 56:7-ലേക്കുള്ള അന്തർപാഠബന്ധവും ദൈവത്തിന്റെ ഭവനം എന്ന ദൈവശാസ്ത്രപരമായ രൂപകവും സംരക്ഷിക്കുന്നു; സന്ദർഭം ദേവാലയമാണെന്ന കാര്യം പരിഭാഷയിൽ മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
- issue: λῃστῶν എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: കൊള്ളക്കാർ
  alternative: വഴിക്കൊള്ളക്കാർ
  rationale: ഗ്രീക്ക് പദത്തിന് കവർച്ചക്കാരും ആയുധധാരികളായ വഴിക്കൊള്ളക്കാരും ഉൾപ്പെടുന്ന അർഥവ്യാപ്തിയുണ്ട്. ‘കൊള്ളക്കാർ’ യിരെമ്യാവ് 7:11-ന്റെ പ്രതിധ്വനിക്കു യോജിക്കുകയും രാഷ്ട്രീയ കലാപകാരികൾ എന്ന പ്രത്യേക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള പ്രസംഗശൈലി സ്വീകരിച്ചു. തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് അല്പം ഔപചാരികമായ ഭാവം നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ പദക്രമം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടു ചേർത്തിരിക്കുന്നു.
