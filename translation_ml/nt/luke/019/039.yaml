  to: 'ജനക്കൂട്ടത്തിൽ ഉണ്ടായിരുന്ന പരീശന്മാരിൽ ചിലർ അവനോടു പറഞ്ഞു: “ഗുരുവേ[a], അങ്ങയുടെ ശിഷ്യന്മാരെ ശാസിക്കൂ.”'
