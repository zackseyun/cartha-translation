id: LUK.19.39
reference: Luke 19:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: ml
  text: 'ജനക്കൂട്ടത്തിൽ ഉണ്ടായിരുന്ന പരീശന്മാരിൽ ചിലർ അവനോടു പറഞ്ഞു: “ഗുരുവേ[a], അങ്ങയുടെ ശിഷ്യന്മാരെ ശാസിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അധ്യാപകനേ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: പരീശന്മാരിൽ ചിലർ
  rationale: τινες എന്ന അനിശ്ചിത ബഹുവചനവും തുടർന്നുള്ള ഭാഗിക ഷഷ്ഠിയും ചേർന്ന് പരീശന്മാരിൽ ഒരു നിർദ്ദിഷ്ടമല്ലാത്ത വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: ജനക്കൂട്ടത്തിൽ ഉണ്ടായിരുന്ന
  rationale: ἀπό ഇവിടെ ഉറവിടമോ കൂട്ടത്തിനുള്ളിലെ സ്ഥാനമോ സൂചിപ്പിക്കുന്നു. പരീശന്മാർ ജനക്കൂട്ടത്തിനിടയിൽ ഉണ്ടായിരുന്നുവെന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εἶπαν πρὸς αὐτόν
  choice: അവനോടു പറഞ്ഞു
  rationale: സാധാരണ ആഖ്യാനത്തിലെ സംഭാഷണസൂത്രത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: പഠിപ്പിക്കുന്നവനെ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്ന διδάσκαλος എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളസമാനപദം; ഇവിടെ അനാവശ്യമായ ഉയർന്ന ക്രിസ്തുശാസ്ത്രാർഥം ചേർക്കുന്നില്ല.
- source_word: ἐπιτίμησον
  choice: ശാസിക്കണം
  rationale: വാക്കാൽ ശക്തമായി തിരുത്തുകയോ താക്കീത് ചെയ്യുകയോ ചെയ്യാനുള്ള ആജ്ഞയാണ്. ഉദ്ധരണിയിലെ നേരിട്ടുള്ള ആവശ്യത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς μαθηταῖς σου
  choice: അങ്ങയുടെ ശിഷ്യന്മാരെ
  rationale: μαθητής എന്നത് ഗുരു-ശിഷ്യബന്ധം നിലനിർത്തുന്ന ‘ശിഷ്യൻ’ എന്നാണ് നൽകിയിരിക്കുന്നത്; ആദരസൂചക അഭിസംബോധനയ്ക്ക് ‘അങ്ങയുടെ’ യോജിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന Διδάσκαλε എന്ന ബഹുമാനപദത്തിന്റെ വിവർത്തനം
  choice: ഗുരുവേ
  alternative: യജമാനനേ
  rationale: ഇവിടെ പദം പ്രധാനമായും പഠിപ്പിക്കുന്നവൻ എന്ന നിലയിലെ അഭിസംബോധനയാണ്; ‘ഗുരുവേ’ അത് നിലനിർത്തുകയും മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത അധിക അധികാരമോ ക്രിസ്തുശാസ്ത്രപരമായ അവകാശവാദമോ ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള സംഭാഷണത്തിൽ ‘അങ്ങയുടെ’ ഉപയോഗിച്ച് ആദരഭാവം സൂചിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
