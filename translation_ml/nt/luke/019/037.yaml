  source_fidelity: ഗ്രീക്കിലെ ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ കാലപശ്ചാത്തലം, ἤδηയുടെ ‘അപ്പോഴേക്കും,’ ഒലിവുമലയുടെ ഇറക്കത്തിനടുത്തെത്തുന്ന സ്ഥാനസൂചന, ശിഷ്യന്മാരുടെ മുഴുവൻ കൂട്ടം, സന്തോഷത്തോടെ ഉറക്കെ ദൈവത്തെ സ്തുതിക്കാൻ തുടങ്ങിയ നടപടി, അവർ കണ്ട എല്ലാ δυνάμεις-കളെ ആസ്പദമാക്കിയ സ്തുതി എന്നിവ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു. ‘ഇറക്കത്തിനരികിലേക്ക് എത്തിക്കൊണ്ടിരിക്കുമ്പോൾ’ πρὸς τῇ καταβάσει എന്നതിന്റെ ‘descent-നോടടുത്ത്’ എന്ന അർഥം അനാവശ്യമായ ഭൂപ്രകൃതി-നിർണയം കൂടാതെ നൽകുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വായനാസുഗമവുമാണ്. ‘ശിഷ്യന്മാരുടെ ജനക്കൂട്ടം മുഴുവനും’ എന്ന പ്രയോഗം അല്പം ഔപചാരികമാണെങ്കിലും ആഖ്യാനത്തിന്റെ ഗൗരവമുള്ള രജിസ്റ്ററിനും πλῆθος എന്ന വലിയ കൂട്ടത്തിന്റെ ആശയത്തിനും യോജിക്കുന്നു. ‘ഉറക്കെ ദൈവത്തെ സ്തുതിക്കാൻ തുടങ്ങി’ സ്വാഭാവികമാണ്.
  terminology: ‘ഒലിവുമല’ പരിചിതമായ സ്ഥലനാമരൂപമാണ്. ‘ദൈവത്തെ സ്തുതിക്കുക’ αἰνεῖν τὸν θεόν-നു യോജിച്ചിരിക്കുന്നു. ‘ശക്തിപ്രവൃത്തികൾ’ δυνάμεις-ന്റെ ദൈവികശക്തി പ്രകടമാകുന്ന പ്രവൃത്തികൾ എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; അതിനെ ‘അത്ഭുതങ്ങൾ’ എന്ന ഏകവ്യാഖ്യാനത്തിലേക്കു ചുരുക്കുന്നില്ല. അടിക്കുറിപ്പ് ഈ സാധ്യതയെ യുക്തമായി രേഖപ്പെടുത്തുന്നു.
