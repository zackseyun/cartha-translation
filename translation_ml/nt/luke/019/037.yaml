id: LUK.19.37
reference: Luke 19:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: ml
  text: അവൻ അപ്പോഴേക്കും ഒലിവുമലയുടെ ഇറക്കത്തിനരികിലേക്ക് എത്തിക്കൊണ്ടിരിക്കുമ്പോൾ, ശിഷ്യന്മാരുടെ ജനക്കൂട്ടം മുഴുവനും തങ്ങൾ കണ്ട സകല ശക്തിപ്രവൃത്തികളും[a] നിമിത്തം സന്തോഷിച്ചുകൊണ്ട് ഉറക്കെ ദൈവത്തെ സ്തുതിക്കാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അത്ഭുതങ്ങൾ” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ അക്ഷരാർഥം “ശക്തികൾ”; ദൈവികശക്തി പ്രകടമായ പ്രവൃത്തികൾക്കാണ് ഊന്നൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: അവൻ അപ്പോഴേക്കും ... എത്തിക്കൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് നൽകുന്ന കാലപശ്ചാത്തലവും ἐγγίζω എന്ന ക്രിയയുടെ പുരോഗമനസ്വഭാവവും ἤδη എന്നതിന്റെ ‘അപ്പോഴേക്കും’ എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς τῇ καταβάσει
  choice: ഇറക്കത്തിനരികിലേക്ക്
  rationale: താഴോട്ടുള്ള ചരിവിനടുത്തേക്ക് യേശു എത്തുന്ന സ്ഥലസൂചന നൽകുന്നു; കൃത്യമായ ഭൂപ്രകൃതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: ഒലിവുമലയുടെ
  rationale: സ്ഥലപ്പേരിന്റെ മലയാളത്തിൽ പരിചിതവും ലളിതവുമായ രൂപം.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: ശിഷ്യന്മാരുടെ ജനക്കൂട്ടം മുഴുവനും
  rationale: πλῆθος സൂചിപ്പിക്കുന്ന വലിയ കൂട്ടത്തെയും ἅπαν നൽകുന്ന സമഗ്രതയെയും നിലനിർത്തുന്നു; ഇത് പൊതുജനക്കൂട്ടമല്ല, ശിഷ്യന്മാരുടെ കൂട്ടമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: χαίροντες
  choice: സന്തോഷിച്ചുകൊണ്ട്
  rationale: സ്തുതിക്കുന്ന പ്രവൃത്തിയോടൊപ്പമുള്ള സന്തോഷത്തെ ക്രിയാത്മകമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἤρξαντο ... αἰνεῖν τὸν θεὸν
  choice: ദൈവത്തെ സ്തുതിക്കാൻ തുടങ്ങി
  rationale: ആരംഭത്തെ സൂചിപ്പിക്കുന്ന ἤρξαντο എന്ന ക്രിയയും തുടർന്നുള്ള അനന്തരൂപവും സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: φωνῇ μεγάλῃ
  choice: ഉറക്കെ
  rationale: ‘വലിയ ശബ്ദത്തോടെ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: തങ്ങൾ കണ്ട സകല ശക്തിപ്രവൃത്തികളും നിമിത്തം
  rationale: περί ഇവിടെ സ്തുതിയുടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു. δύναμις എന്നതിലെ ‘ശക്തി’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, കണ്ട പ്രവൃത്തികളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അത്ഭുതസന്ദർഭത്തിൽ δύναμις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ശക്തിപ്രവൃത്തികൾ
  alternative: അത്ഭുതങ്ങൾ; ശക്തമായ പ്രവൃത്തികൾ
  rationale: ഈ പദത്തിന് ശക്തികൾ, ശക്തിയുടെ പ്രവൃത്തികൾ, അത്ഭുതങ്ങൾ എന്നീ അർഥസാധ്യതകളുണ്ട്. ‘ശക്തിപ്രവൃത്തികൾ’ ദൈവികശക്തി പ്രവൃത്തികളിൽ വെളിപ്പെടുന്നു എന്ന ഊന്നൽ നിലനിർത്തുന്നു; അതിനെ ഒരു സാങ്കേതിക പദമായ ‘അത്ഭുതങ്ങൾ’ എന്നതിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ള ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ശക്തിപ്രവൃത്തികൾ’ എന്ന പദം ഉറവിടത്തിലെ പദവ്യാപ്തിയും ദൈവികശക്തിയിലുള്ള ഊന്നലും കാത്തുസൂക്ഷിക്കുന്നു.
