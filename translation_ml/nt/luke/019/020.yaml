source:
  edition: SBLGNT
  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: ml
  text: 'മറ്റൊരാൾ വന്ന് പറഞ്ഞു: “കർത്താവേ, ഇതാ അങ്ങയുടെ മിനാ. ഞാൻ അത് ഒരു തുണിക്കുള്ളിൽ സൂക്ഷിച്ചുവെച്ചിരുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു കൈത്തൂവാലയിൽ.” ഗ്രീക്കിലെ σουδάριον എന്ന പദം മുഖമോ വിയർപ്പോ തുടയ്ക്കാൻ ഉപയോഗിച്ചിരുന്ന ഒരു ചെറിയ തുണിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: മറ്റൊരാൾ
  rationale: മുമ്പ് വന്ന ദാസന്മാരിൽനിന്ന് വ്യത്യസ്തനായ ശേഷിക്കുന്ന ആളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ഈ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἦλθεν λέγων
  choice: വന്ന് പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ക്രിയയും വർത്തമാന കൃദന്തവും ചേർന്ന പ്രയോഗത്തെ സ്വാഭാവിക മലയാള ആഖ്യാനരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: നേരിട്ടുള്ള സംബോധനവും κύριος എന്ന പദത്തിന്റെ അർത്ഥസാധ്യതയും നിലനിർത്തുന്നു; ഉപമയിലെ യജമാനനെയാണ് സന്ദർഭത്തിൽ അഭിസംബോധന ചെയ്യുന്നത്.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും മിനാ മുന്നിൽ കാട്ടുന്നതിന്റെ ഭാവം നൽകുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: ἡ μνᾶ σου
  choice: അങ്ങയുടെ മിനാ
  rationale: പുരാതന നാണയ/ഭാര അളവായ μνᾶയെ തെറ്റിദ്ധരിപ്പിക്കുന്ന ആധുനിക തുകയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ആദരസൂചകമായ ‘അങ്ങയുടെ’ സംബോധനത്തിന് യോജിക്കുന്നു.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: ഞാൻ അത് ... സൂക്ഷിച്ചുവെച്ചിരുന്നു
  rationale: εἶχον + ἀποκειμένην സൂചിപ്പിക്കുന്ന തുടർന്നുനിന്ന സൂക്ഷിപ്പിന്റെ അവസ്ഥയെ ‘സൂക്ഷിച്ചുവെച്ചിരുന്നു’ എന്ന രൂപം പ്രകടമാക്കുന്നു.
- source_word: ἐν σουδαρίῳ
  choice: ഒരു തുണിയിൽ പൊതിഞ്ഞ്
  rationale: സουδάριον മുഖമോ വിയർപ്പോ തുടയ്ക്കാൻ ഉപയോഗിച്ചിരുന്ന ചെറിയ തുണിയാകാം. ‘തുണിയിൽ’ അടിസ്ഥാനാർഥം നൽകുന്നു; ἐν എന്നതിന്റെ സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘പൊതിഞ്ഞ്’ ഉപയോഗിക്കുന്നു, കൂടുതൽ നിർദിഷ്ടമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉപമയിലെ നേരിട്ടുള്ള സംബോധനത്തിൽ κύριος എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: യജമാനനേ
  rationale: സന്ദർഭത്തിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്നത് ഉപമയിലെ യജമാനനാണെങ്കിലും, ‘കർത്താവേ’ κύριος എന്ന പദത്തിന്റെ വിശാലമായ അർത്ഥവും ഉപമയുടെ സാധ്യമായ ദൈവശാസ്ത്രപരമായ അനുരണനവും മുൻകൂട്ടി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പുരാതന ധനമൂല്യപദം ‘മിനാ’യായി നിലനിർത്തി. നേരിട്ടുള്ള സംഭാഷണത്തിൽ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
