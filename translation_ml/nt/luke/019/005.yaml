  to: 'യേശു ആ സ്ഥലത്തെത്തിയപ്പോൾ, മുകളിലേക്കു നോക്കി അവനോട് പറഞ്ഞു: “സക്കായിയേ, വേഗം ഇറങ്ങിവരിക; കാരണം, ഇന്ന് എനിക്ക് നിന്റെ വീട്ടിൽ[a] തങ്ങേണ്ടതാണ്[b].”'
  rationale: The revision explicitly renders γάρ as “കാരണം” and uses the idiomatic vocative “സക്കായിയേ.” The strong necessity of δεῖ, the residence sense of οἶκος, and the urgency of the command are retained without doctrinal over-specification.
