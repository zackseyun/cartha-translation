review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus' arrival, his upward gaze, the urgent command to descend, and the necessity expressed by δεῖ. However, γάρ is left only implicit through punctuation; an explicit Malayalam causal connector better preserves the stated reason for the command.
  naturalness: The wording is clear, modern standard Malayalam. Using the vocative form “സക്കായിയേ” is more natural in direct address than the nominative name form. “കാരണം” makes the sentence flow and logical relation clear.
  terminology: “സക്കായി,” “വീട്ടിൽ,” and “തങ്ങേണ്ടതാണ്” are suitable. “തങ്ങേണ്ടതാണ്” appropriately retains the strong but unspecified necessity of δεῖ without imposing a theological explanation.
  issues:
  - severity: medium
    issue: The causal force of γάρ is not explicitly translated.
    rationale: The semicolon alone does not reliably express that Jesus' stated need is the reason Zacchaeus must descend quickly. Adding “കാരണം” preserves the Greek connective without adding interpretation.
  - severity: low
    issue: Direct address uses the non-vocative form “സക്കായി.”
    rationale: “സക്കായിയേ” is the natural Malayalam vocative in this direct address and better reflects the Greek vocative Ζακχαῖε.
