id: LUK.19.5
reference: Luke 19:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: ml
  text: 'യേശു ആ സ്ഥലത്തെത്തിയപ്പോൾ, മുകളിലേക്കു നോക്കി അവനോട് പറഞ്ഞു: “സക്കായിയേ, വേഗം ഇറങ്ങിവരിക; കാരണം, ഇന്ന് എനിക്ക് നിന്റെ വീട്ടിൽ[a] തങ്ങേണ്ടതാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ ‘വീട്’ (οἶκος) എന്ന പദത്തിന് ‘ഭവനം’ അല്ലെങ്കിൽ ‘വീട്ടുകാർ’ എന്നും അർഥമാകാം; ഇവിടെ യേശു സക്കായിയുടെ വാസസ്ഥലത്ത് തങ്ങുന്നതാണ് സന്ദർഭം.
    reason: lexical_alternative
  - marker: b
    text: ‘തങ്ങേണ്ടതാണ്’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം (δεῖ) അനിവാര്യത സൂചിപ്പിക്കുന്നു; ലൂക്കായിൽ അത് യേശുവിന്റെ ദൗത്യത്തോടോ ദൈവിക ഉദ്ദേശ്യത്തോടോ ബന്ധപ്പെട്ട അനിവാര്യതയും സൂചിപ്പിക്കാറുണ്ട്.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ὡς
  choice: എത്തിയപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ സമയബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τὸν τόπον
  choice: ആ സ്ഥലത്ത്
  rationale: സക്കായി ഉണ്ടായിരുന്ന നിർദിഷ്ട സ്ഥലത്തേക്കുള്ള വരവ് സൂചിപ്പിക്കുന്ന ലളിതമായ സ്ഥാനപ്രയോഗം.
- source_word: ἀναβλέψας
  choice: മുകളിലേക്കു നോക്കി
  rationale: മരത്തിലിരുന്ന സക്കായിയിലേക്കു യേശു ദൃഷ്ടി ഉയർത്തിയതിനെ സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
- source_word: εἶπεν πρὸς αὐτόν
  choice: അവനോട് പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സാധാരണ സംഭാഷണപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: Ζακχαῖε
  choice: സക്കായി
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: σπεύσας κατάβηθι
  choice: വേഗം ഇറങ്ങിവരിക
  rationale: കൽപ്പനയിലെ അടിയന്തരതയും താഴേക്കു വരണമെന്ന ദിശയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: σήμερον γὰρ
  choice: ഇന്ന് … ;
  rationale: γάρ മുൻകൽപ്പനയ്ക്കുള്ള കാരണം നൽകുന്നു; മലയാളത്തിൽ അർദ്ധവിരാമത്തിനു ശേഷമുള്ള വാക്യക്രമം ആ കാരണബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν τῷ οἴκῳ σου
  choice: നിന്റെ വീട്ടിൽ
  rationale: സക്കായിയുടെ വാസസ്ഥലത്ത് അതിഥിയായി തങ്ങുന്നതാണ് ഉടനെയുള്ള സന്ദർഭം; ‘വീട്ടിൽ’ സാധാരണ മലയാളത്തിൽ അതിന് യോജിക്കുന്നു.
- source_word: δεῖ
  choice: വേണ്ടതാണ്
  rationale: വെറും ആഗ്രഹത്തേക്കാൾ ശക്തമായ അനിവാര്യത സൂചിപ്പിക്കുന്നു; അതിന്റെ ഉറവിടം മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുന്നില്ല.
- source_word: μεῖναι
  choice: തങ്ങുക
  rationale: ഈ സന്ദർഭത്തിൽ ഒരാളുടെ വീട്ടിൽ തുടരുക/അതിഥിയായി ഇരിക്കുക എന്ന μένωയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ലൂക്കായുടെ ആഖ്യാനത്തിൽ δεῖ സൂചിപ്പിക്കുന്ന അനിവാര്യത
  choice: ‘തങ്ങേണ്ടതാണ്’ എന്ന് പരിഭാഷപ്പെടുത്തി അനിവാര്യത നിലനിർത്തി.
  alternative: ‘തങ്ങണം’ അല്ലെങ്കിൽ ‘തങ്ങേണ്ടത് എനിക്ക് ആവശ്യമാണ്’
  rationale: ലൂക്കായിൽ δεῖ പലപ്പോഴും യേശുവിന്റെ ദൗത്യത്തോടോ ദൈവിക ഉദ്ദേശ്യത്തോടോ ബന്ധമുള്ള അനിവാര്യത സൂചിപ്പിക്കാം. എന്നാൽ ഈ വാക്യം അതിനെ വ്യക്തമായി വിശദീകരിക്കാത്തതിനാൽ മുഖ്യപാഠം അതിന്റെ ശക്തി മാത്രം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ഇറങ്ങിവരിക’, ‘തങ്ങേണ്ടതാണ്’ എന്നീ രൂപങ്ങൾ അടിയന്തരതയും അനിവാര്യതയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ദൈവിക നിർബന്ധം എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അധികമായി ചേർത്തിട്ടില്ല.
