id: LUK.19.32
reference: Luke 19:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπελθόντες δὲ οἱ ἀπεσταλμένοι εὗρον καθὼς εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/032.yaml
  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: ml
  text: അയക്കപ്പെട്ടവർ പോയി; അവൻ അവരോടു പറഞ്ഞതുപോലെതന്നെ അവർ കണ്ടെത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπελθόντες
  choice: പോയി
  rationale: ἀπέρχομαι എന്ന ക്രിയയുടെ ഭൂതകാല കൃതന്തം പുറപ്പെട്ടുപോകുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം ‘പോയി’ എന്നാണ്.
- source_word: δὲ
  choice: വാക്യക്രമത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: δέ ഇവിടെ കഥയുടെ പുരോഗതി സൂചിപ്പിക്കുന്നു. പ്രത്യേകം ഒരു ബന്ധകപദം ചേർക്കാതെ ‘പോയി; ... കണ്ടെത്തി’ എന്ന ക്രമം ആ പുരോഗതി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: οἱ ἀπεσταλμένοι
  choice: അയക്കപ്പെട്ടവർ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പൂർണകാല കർമണി കൃതന്തത്തിന്റെ നാമപ്രയോഗവും കർമണിഭാവവും നേരിട്ട് നിലനിർത്തുന്നു; ‘ദൂതന്മാർ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: εὗρον
  choice: അവർ കണ്ടെത്തി
  rationale: മൂലപാഠത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ ആ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; സന്ദർഭത്തിൽ യേശു വിവരിച്ച കഴുതക്കുട്ടിയാണ് മനസ്സിലാക്കേണ്ട കർമമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καθὼς
  choice: പറഞ്ഞതുപോലെതന്നെ
  rationale: καθώς സൂചിപ്പിക്കുന്ന പൊരുത്തം ‘പോലെതന്നെ’ സ്വാഭാവികവും ഊന്നലോടെയും പ്രകടമാക്കുന്നു; ‘കൃത്യമായി’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: εἶπεν αὐτοῖς
  choice: അവൻ തങ്ങളോടു പറഞ്ഞ
  rationale: λέγω എന്നതിന്റെ അടിസ്ഥാനമായ ‘പറയുക’ എന്ന അർഥം നിലനിർത്തുന്നു. മുൻപ് പറഞ്ഞ കാര്യമാണെന്ന കാലബന്ധം മലയാളത്തിലെ സന്ദർഭവും കൃതന്തരൂപവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലഗ്രീക്കിലെ സംക്ഷിപ്തതയും εὗρον എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർമവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
