source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: ml
  text: 'അവൻ മറുപടിയായി പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇവർ നിശ്ശബ്ദരായാൽ[a], കല്ലുകൾ ആർത്തുവിളിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മിണ്ടാതിരുന്നാൽ’ അല്ലെങ്കിൽ ‘മൗനം പാലിച്ചാൽ.’
    reason: σιωπάω എന്ന ക്രിയയ്ക്ക് സന്ദർഭത്തിൽ മൗനത്തിലാകുക, മിണ്ടാതിരിക്കുക, മൗനം പാലിക്കുക എന്നീ അടുത്ത അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ക്രിയാവിശേഷണസ്വഭാവമുള്ള പങ്കാളിക്രിയയും മുഖ്യക്രിയയും മലയാളത്തിൽ സ്വാഭാവികമായി വേർതിരിച്ചറിയിക്കുമ്പോൾ പ്രതികരണത്തിന്റെ അർഥവും ‘പറഞ്ഞു’ എന്ന മുഖ്യക്രിയയും നിലനിർത്തുന്നു.
- source_word: Λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഊന്നലും അധികാരഭാവവും നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ നേരിട്ടുള്ള പ്രയോഗം.
- source_word: οὗτοι
  choice: ഇവർ
  rationale: സന്ദർഭത്തിലെ ശിഷ്യരെയോ സ്തുതിക്കുന്നവരെയോ വിശദീകരിച്ചുചേർക്കാതെ ഗ്രീക്കിലെ സൂചകസർവനാമം അതേ തുറന്ന നിലയിൽ നിലനിർത്തുന്നു.
- source_word: σιωπήσουσιν
  choice: നിശ്ശബ്ദരായാൽ
  rationale: ഇപ്പോൾ ശബ്ദമുയർത്തുന്നവർ മൗനത്തിലാകുന്ന അവസ്ഥാമാറ്റം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ വ്യവസ്ഥാപ്രയോഗം.
- source_word: οἱ λίθοι
  choice: കല്ലുകൾ
  rationale: ഗ്രീക്കിലെ ദൃശ്യവും മൂർത്തവുമായ ‘കല്ലുകൾ’ എന്ന ചിത്രം വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു; മലയാളത്തിൽ പൊതുവചന ബഹുവചനത്തിന് നിർബന്ധമായ നിർദ്ദിഷ്ടപദമില്ല.
- source_word: κράξουσιν
  choice: ആർത്തുവിളിക്കും
  rationale: κράζω സൂചിപ്പിക്കുന്ന ഉച്ചത്തിലുള്ള വിളിയെ ‘നിലവിളി’ എന്ന ദുഃഖസൂചനയിലേക്ക് ചുരുക്കാതെ ശക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: കല്ലുകൾ വിളിക്കും എന്ന വാക്ക് ഉപമയാണോ അത്ഭുതസാധ്യതയാണോ എന്ന് വ്യക്തമാക്കണമോ
  choice: ‘കല്ലുകൾ ആർത്തുവിളിക്കും’ എന്ന മൂർത്തചിത്രം വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: ‘സൃഷ്ടി തന്നെയും ദൈവത്തെ സ്തുതിക്കും’ എന്നോ ‘കല്ലുകൾ സാക്ഷ്യം പറയും’ എന്നോ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് വാചകം അതിന്റെ സ്വഭാവം നിർവചിക്കുന്നില്ല. അതിശയോക്തി, പ്രവാചകചിത്രം, അത്ഭുതസാധ്യത എന്നിവയ്ക്കിടയിലെ യഥാർഥ വ്യാഖ്യാനതുറപ്പ് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മറുപടിയായി പറഞ്ഞു’ ഗ്രീക്ക് ഘടനയിലെ രണ്ടു ഘടകങ്ങളും അനാവശ്യ ആവർത്തനമില്ലാതെ സൂക്ഷിക്കുന്നു; ‘ആർത്തുവിളിക്കും’ വാക്യത്തിന്റെ ശക്തമായ പ്രവാചക-വാചാടോപഭാവം നിലനിർത്തുന്നു.
