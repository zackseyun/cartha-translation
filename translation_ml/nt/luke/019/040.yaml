  source_fidelity: ഗ്രീക്കിലെ ἀποκριθεὶς … εἶπεν എന്ന പ്രതികരണ-പങ്കാളിക്രിയയും പ്രസ്താവനയും ‘അവൻ മറുപടിയായി പറഞ്ഞു’ എന്നതിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു. ‘ഞാൻ നിങ്ങളോടു പറയുന്നു,’ Λέγω ὑμῖν-ന്റെ ഊന്നൽ നിലനിർത്തുന്നു. ‘ഇവർ നിശ്ശബ്ദരായാൽ’ οὗτοι σιωπήσουσιν-ന്റെ തുറന്ന സൂചകവും വ്യവസ്ഥാപരമായ മൗനത്തിലാകൽ എന്ന ആശയവും യഥാവിധി നൽകുന്നു. ‘കല്ലുകൾ ആർത്തുവിളിക്കും’ οἱ λίθοι κράξουσιν-ന്റെ ശക്തമായ, വ്യാഖ്യാനിക്കാത്ത പ്രതിച്ഛായ സംരക്ഷിക്കുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്. ‘മറുപടിയായി പറഞ്ഞു,’ ‘നിശ്ശബ്ദരായാൽ,’ ‘ആർത്തുവിളിക്കും’ എന്നിവ സന്ദർഭത്തിന് യോജിച്ചും വായനാസുഖമുള്ളതുമാണ്.
