id: LUK.19.18
reference: Luke 19:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἦλθεν ὁ δεύτερος λέγων· ⸂Ἡ μνᾶ σου, κύριε⸃, ἐποίησεν πέντε μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: ml
  text: രണ്ടാമൻ വന്ന്, ‘യജമാനനേ, അങ്ങയുടെ മിനാ അഞ്ച് മിനാ സമ്പാദിച്ചു’ എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: രണ്ടാമൻ
  rationale: ക്രമത്തിൽ രണ്ടാമതായി വന്ന ദാസനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: κύριε
  choice: യജമാനനേ
  rationale: ഇത് അഭിസംബോധനാരൂപമാണ്; ഉപമയിലെ ദാസൻ തന്റെ യജമാനനെ അഭിസംബോധന ചെയ്യുന്ന സന്ദർഭം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: μνᾶ
  choice: മിനാ
  rationale: പുരാതന നാണയ/തൂക്ക അളവിന്റെ പേര് പരിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ἐποίησεν
  choice: സമ്പാദിച്ചിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഉണ്ടാക്കി’ എന്നാണെങ്കിലും നിക്ഷേപിച്ച തുക ലാഭം നേടിയെന്ന സാമ്പത്തിക സന്ദർഭം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മിനായെ തന്നെയാണ് കർത്താവായി നിലനിർത്തുന്നത്.
theological_decisions:
- issue: κύριε എന്ന അഭിസംബോധനയ്ക്ക് ദൈവിക പദവി സൂചിപ്പിക്കുന്ന ‘കർത്താവേ’ വേണമോ, സാമൂഹികബന്ധം സൂചിപ്പിക്കുന്ന ‘യജമാനനേ’ വേണമോ
  choice: യജമാനനേ
  alternative: കർത്താവേ
  rationale: ഈ ഉപമയുടെ തത്സമയ കഥാസന്ദർഭത്തിൽ സംസാരിക്കുന്നത് ഒരു ദാസനും അഭിസംബോധന ചെയ്യപ്പെടുന്നത് അവന്റെ യജമാനനുമാണ്. അതിനാൽ അനാവശ്യമായ ക്രിസ്തശാസ്ത്രപരമായ പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘അങ്ങയുടെ’ എന്ന ആദരസൂചക രൂപം യജമാനനോടുള്ള അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
