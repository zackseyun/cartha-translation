revisions:
- from: രണ്ടാമൻ വന്ന്, ‘യജമാനനേ, അങ്ങയുടെ മിനാ അഞ്ചു മിനാ സമ്പാദിച്ചിരിക്കുന്നു’ എന്നു പറഞ്ഞു.
  to: രണ്ടാമൻ വന്ന്, ‘യജമാനനേ, അങ്ങയുടെ മിനാ അഞ്ച് മിനാ സമ്പാദിച്ചു’ എന്നു പറഞ്ഞു.
  rationale: 'A minor idiomatic revision improves modern Malayalam flow while retaining the Greek syntax and sense: the entrusted mina is presented as having earned five minas. No footnote is required, since the transliterated monetary term is clear in context and no disputed reading is involved.'
