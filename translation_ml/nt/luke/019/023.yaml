id: LUK.19.23
reference: Luke 19:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: ml
  text: നീ എന്റെ പണം ബാങ്കിൽ[a] നിക്ഷേപിക്കാതിരുന്നത് എന്തുകൊണ്ട്? അപ്പോൾ, ഞാൻ വന്നപ്പോൾ അത് പലിശയോടെ ഈടാക്കാമായിരുന്നല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘എന്റെ പണം ബാങ്കുകാരുടെ പക്കൽ നിക്ഷേപിക്കുക’; അക്ഷരാർഥം, ‘എന്റെ പണം ഒരു മേശപ്പുറത്ത് കൊടുക്കുക.’
    reason: τράπεζα അക്ഷരാർഥത്തിൽ ‘മേശ’ എന്നാണ്; ഈ സാമ്പത്തിക സന്ദർഭത്തിൽ അത് ബാങ്കുകാരന്റെ മേശയെയോ ബാങ്കിംഗ് സംവിധാനത്തെയോ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: διὰ τί
  choice: എന്തുകൊണ്ടാണ്
  rationale: കാരണം ചോദിക്കുന്ന ശാസനാഭാവമുള്ള ചോദ്യത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: ബാങ്കിൽ നിക്ഷേപിക്കാതിരുന്നത്
  rationale: അക്ഷരാർഥത്തിൽ ‘മേശമേൽ കൊടുക്കുക’ എന്നാണെങ്കിലും സാമ്പത്തിക പശ്ചാത്തലത്തിൽ τράπεζα പണം കൈകാര്യം ചെയ്യുന്ന ബാങ്കിംഗ് സംവിധാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ബാങ്കിൽ നിക്ഷേപിക്കുക’ ഉദ്ദേശിച്ച പ്രവൃത്തി വ്യക്തമായി നൽകുന്നു.
- source_word: μου τὸ ἀργύριον
  choice: എന്റെ പണം
  rationale: ἀργύριον അക്ഷരാർഥത്തിൽ വെള്ളിയെ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ വാണിജ്യസന്ദർഭത്തിലെ പണമാണ്; ‘പണം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: κἀγὼ ἐλθὼν
  choice: ഞാൻ വന്നപ്പോൾ
  rationale: ഗ്രീക്ക് കർത്തൃവാചക കൃദന്തത്തെ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: σὺν τόκῳ
  choice: പലിശയോടെ
  rationale: നിക്ഷേപിച്ച പണത്തിന്മേലുള്ള പലിശയാണ് τόκος ഇവിടെ സൂചിപ്പിക്കുന്നത്; ഈ മലയാളപ്രയോഗം വ്യക്തവും സാധാരണവുമാണ്.
- source_word: αὐτὸ ἔπραξα
  choice: അതു ... തിരികെ വാങ്ങാമായിരുന്നല്ലോ
  rationale: സാമ്പത്തിക സന്ദർഭത്തിൽ πράσσω ലഭിക്കാനുള്ള തുക ഈടാക്കുകയോ വീണ്ടെടുക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. സാധ്യത/നടക്കാതെപോയ ഫലം സൂചിപ്പിക്കുന്ന ἄν-ന്റെ ഭാവവും ശാസനാഭാവവും ഈ രൂപം നിലനിർത്തുന്നു.
