translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘ബാങ്ക്’, ‘നിക്ഷേപിക്കുക’, ‘പലിശ’ എന്നീ നിലവിലുള്ള സാമ്പത്തിക പദങ്ങൾ ഉപയോഗിച്ചു. ഈ വാക്യത്തിൽ പ്രത്യേകമായ പാഠഭേദമോ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനതീരുമാനമോ ആവശ്യമായില്ല.
