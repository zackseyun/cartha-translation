id: LUK.19.38
reference: Luke 19:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: ml
  text: 'അവർ ഇങ്ങനെ പറഞ്ഞു: “കർത്താവിന്റെ നാമത്തിൽ വരുന്ന രാജാവ്[a] വാഴ്ത്തപ്പെട്ടവൻ! സ്വർഗത്തിൽ സമാധാനം[b]; അത്യുന്നതങ്ങളിൽ മഹത്വം!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പരിഭാഷകൾ കൂടുതൽ പരിചിതമായ “കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ വാഴ്ത്തപ്പെട്ടവൻ” എന്ന രൂപം പിന്തുടരുന്നു; എന്നാൽ ഇവിടെ സ്വീകരിച്ചിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിൽ “രാജാവ്” എന്നു വ്യക്തമായി ഉണ്ട്.
    reason: alternative_reading
  - marker: b
    text: ഇത് ലൂക്കോസ് 2:14-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; എന്നാൽ അവിടെ “ഭൂമിയിൽ സമാധാനം” എന്നും ഇവിടെ “സ്വർഗത്തിൽ സമാധാനം” എന്നും പറയുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: അവർ ഇങ്ങനെ പറഞ്ഞു
  rationale: മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപമാണിത്. സ്വതന്ത്ര വാക്യമായി മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാനായി കർത്താവിനെ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുകയും ഉദ്ധരണി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Εὐλογημένος
  choice: അനുഗൃഹീതൻ
  rationale: സ്തുതിപൂർവമായ ആശംസയുടെ അർഥവും സങ്കീർത്തനപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്ന, ആധുനിക മാനക മലയാളത്തിൽ മാന്യമായ പദം.
- source_word: ὁ ἐρχόμενος
  choice: വരുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടർച്ചയായ ഭാവം നിലനിർത്തുകയും ‘രാജാവ്’ എന്ന നാമത്തെ സ്വാഭാവികമായി വിശേഷിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: βασιλεὺς
  choice: രാജാവ്
  rationale: ലൂക്കോസിന്റെ പാഠത്തിൽ രാജകീയ തിരിച്ചറിയൽ വ്യക്തമായി ഉൾപ്പെട്ടിരിക്കുന്നതിനാൽ അത് ഒഴിവാക്കാതെ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐν ὀνόματι κυρίου
  choice: കർത്താവിന്റെ നാമത്തിൽ
  rationale: സെമിറ്റിക് പശ്ചാത്തലവും കർത്താവിന്റെ അധികാരത്തിലും പ്രതിനിധിത്വത്തിലും വരുന്നു എന്ന അർഥസാധ്യതയും സംരക്ഷിക്കുന്ന സ്ഥാപിത പ്രയോഗം.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: സ്വർഗത്തിൽ സമാധാനം
  rationale: ക്രിയയില്ലാത്ത സംക്ഷിപ്ത ഉദ്‌ഘോഷണരൂപം നിലനിർത്തുന്നു; ‘ഭൂമിയിൽ’ എന്നു സമന്വയിപ്പിക്കാതെ ഉറവിടത്തിലെ ‘സ്വർഗത്തിൽ’ എന്ന സ്ഥാനം കൃത്യമായി നൽകുന്നു.
- source_word: δόξα ἐν ὑψίστοις
  choice: അത്യുന്നതങ്ങളിൽ മഹത്ത്വം
  rationale: ὑψίστοις എന്ന ബഹുവചന സ്ഥാനസൂചനയുടെ തുറന്ന അർഥം നിലനിർത്തുകയും ലൂക്കോസ് 2:14-നോടുള്ള ഭാഷാപരമായ പ്രതിധ്വനി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വിജയപ്രവേശനത്തിലെ മിശിഹൈക രാജകീയ ഉദ്‌ഘോഷണം
  choice: βασιλεὺς വ്യക്തമായി ‘രാജാവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ അനുഗൃഹീതൻ’ എന്ന പൊതുവായ ആശംസാരൂപം.
  rationale: ഉറവിടപാഠത്തിലെ രാജകീയ പദം നിലനിർത്തുന്നത് ലൂക്കോസിന്റെ വ്യക്തമായ ഊന്നൽ സംരക്ഷിക്കുന്നു; അതിനപ്പുറം വ്യാഖ്യാനപരമായ വിശേഷണങ്ങൾ ചേർക്കുന്നില്ല.
- issue: ലൂക്കോസ് 2:14-നോടുള്ള ബന്ധം
  choice: ‘സ്വർഗത്തിൽ സമാധാനം’ എന്ന ഉറവിടവായന അതേപടി നിലനിർത്തി.
  alternative: ‘ഭൂമിയിൽ സമാധാനം’ എന്നു ജനനവിവരണത്തിലെ സ്തുതിഗീതത്തോട് സമന്വയിപ്പിക്കൽ.
  rationale: ലൂക്കോസ് ഇവിടെ വ്യക്തമായി ‘സ്വർഗത്തിൽ’ എന്നു പറയുന്നു. അതിനാൽ അന്തർപാഠപരമായ പ്രതിധ്വനിയും ഉദ്ദേശ്യപൂർവമായ സംഘർഷവും പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഉദ്‌ഘോഷണശൈലി സ്വീകരിച്ചു. ഉറവിടത്തിലെ ക്രിയയില്ലാത്ത സമാന്തര ഘടന നിലനിർത്താൻ അവസാന രണ്ടു ഖണ്ഡങ്ങളിൽ ‘ഉണ്ടാകട്ടെ’ പോലുള്ള വ്യാഖ്യാനാത്മക ക്രിയ ചേർത്തിട്ടില്ല. ‘അത്യുന്നതങ്ങളിൽ’ എന്ന ബഹുവചനം ഉറവിടരൂപത്തിന്റെ കാവ്യാത്മക തുറന്ന നില സംരക്ഷിക്കുന്നു.
