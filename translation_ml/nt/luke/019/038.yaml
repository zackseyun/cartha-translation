  source_fidelity: രാജാവ് (βασιλεύς), കർത്താവിന്റെ നാമത്തിൽ വരുക, സ്വർഗത്തിലെ സമാധാനം, അത്യുന്നതങ്ങളിലെ മഹത്വം എന്നിവയെല്ലാം ഉറവിടപാഠത്തോടു വിശ്വസ്തമായി നിലനിർത്തിയിട്ടുണ്ട്. എന്നാൽ അടിക്കുറിപ്പ് a-യിൽ ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിനപ്പുറം കൈയെഴുത്തുപ്രതികളെക്കുറിച്ചുള്ള അവകാശവാദം ചേർത്തിരിക്കുന്നു; ഈ പാഠസന്ദർഭത്തിൽ അത് അനാവശ്യവും സ്ഥിരീകരണമില്ലാത്തതുമാണ്.
  naturalness: ‘അനുഗൃഹീതൻ’ മനസ്സിലാക്കാവുന്നതാണെങ്കിലും, സ്തുതിപൂർവമായ ഈ തിരുവെഴുത്തു-ആശംസയിൽ ‘വാഴ്ത്തപ്പെട്ടവൻ’ ആധുനിക മാനക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും സ്ഥാപിതവുമാണ്. ‘മഹത്വം’ ആണ് സാധാരണ മാനക രൂപം.
  terminology: ‘കർത്താവ്,’ ‘രാജാവ്,’ ‘സ്വർഗം,’ ‘സമാധാനം,’ ‘അത്യുന്നതങ്ങൾ’ എന്നിവ യോജിച്ചതാണ്. εὐλογημένος-നു ‘വാഴ്ത്തപ്പെട്ടവൻ’ ഉപയോഗിക്കുന്നത് ഉറവിടത്തിലെ അനുഗ്രഹ/സ്തുതി-പ്രഖ്യാപന സ്വഭാവം മെച്ചമായി നൽകുന്നു.
