source:
  edition: SBLGNT
  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: ml
  text: അവൻ ദിവസേന ദൈവാലയത്തിൽ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു. എന്നാൽ മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും ജനത്തിലെ പ്രമുഖരും[a] അവനെ നശിപ്പിക്കാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ജനത്തിലെ ഒന്നാമന്മാർ”; അതായത്, ജനങ്ങൾക്കിടയിലെ പ്രമുഖരോ സ്വാധീനമുള്ളവരോ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: പര്യായരൂപത്തിലുള്ള അപൂർണഭൂതകാല പ്രയോഗം കഴിഞ്ഞകാലത്തിലെ തുടർച്ചയായതോ ആവർത്തിച്ചിരുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: τὸ καθ’ ἡμέραν
  choice: ദിവസേന
  rationale: ഓരോ ദിവസവും എന്ന വിതരണാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, ദൈവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ പതിവായ പ്രയോഗം സന്ദർഭത്തിന് മതിയായ വ്യാപ്തി നൽകുന്നു.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: പുരോഹിതനേതൃത്വവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന് സ്ഥാപിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: οἱ γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: നിയമപണ്ഡിതരും എഴുത്തുവിദഗ്ധരുമായ വിഭാഗത്തിനുള്ള നേരിട്ടുള്ള പരമ്പരാഗത മലയാളപദം; ‘നിയമോപദേഷ്ടാക്കൾ’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: ἐζήτουν
  choice: ശ്രമിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലം തുടർന്നുകൊണ്ടിരുന്ന ശ്രമത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ശ്രമിച്ചുകൊണ്ടിരുന്നു’ അത് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπολέσαι
  choice: നശിപ്പിക്കാൻ
  rationale: സന്ദർഭത്തിൽ കൊല്ലാനുള്ള ഉദ്ദേശ്യം ഉൾപ്പെടുന്നുവെങ്കിലും, ἀπόλλυμι എന്ന പദത്തിന്റെ ‘നശിപ്പിക്കുക’ എന്ന വിശാലത നിലനിർത്തുന്നു.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: ജനത്തിലെ പ്രമുഖർ
  rationale: അക്ഷരാർഥത്തിൽ ‘ജനത്തിലെ ഒന്നാമന്മാർ’; ഇവിടെ സ്വാധീനവും ഉയർന്ന സാമൂഹികസ്ഥാനവും ഉള്ളവരെ സൂചിപ്പിക്കുന്നു. ‘പ്രമുഖർ’ ഈ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: οἱ πρῶτοι τοῦ λαοῦ എന്നതിലെ പുരുഷലിംഗ ബഹുവചനം
  choice: ജനത്തിലെ പ്രമുഖർ
  alternative: ജനത്തിലെ പ്രമുഖരായ പുരുഷന്മാർ
  rationale: ചരിത്രപരമായി പുരുഷപ്രമാണികളെ സൂചിപ്പിച്ചിരിക്കാമെങ്കിലും, ഗ്രീക്കിലെ വ്യാകരണപുരുഷലിംഗം മലയാളത്തിൽ നിർബന്ധമായി ‘പുരുഷന്മാർ’ എന്നു വ്യക്തമാക്കേണ്ടതില്ല. ‘പ്രമുഖർ’ വ്യക്തികളെ സൂചിപ്പിക്കുകയും അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ തുടർച്ചാഭാവം ‘പഠിപ്പിച്ചുകൊണ്ടിരുന്നു’, ‘ശ്രമിച്ചുകൊണ്ടിരുന്നു’ എന്നീ രൂപങ്ങളിൽ നിലനിർത്തി. പദ്യം അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി തുടരുന്നുവെങ്കിലും മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി പൂർണ്ണവിരാമത്തോടെ അവതരിപ്പിച്ചു.
