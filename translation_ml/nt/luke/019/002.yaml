translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ശ്രദ്ധക്ഷണിക്കുന്ന ἰδοὺ ‘അതാ’യായി നിലനിർത്തി. ഗ്രീക്കിലെ വിച്ഛിന്നമായ പരിചയപ്പെടുത്തൽ മലയാളത്തിൽ ആശ്ചര്യചിഹ്നം ഉപയോഗിച്ച് സ്വാഭാവികമാക്കി; മൂലത്തിൽ ഇല്ലാത്ത സ്ഥലസൂചന ചേർത്തിട്ടില്ല.
