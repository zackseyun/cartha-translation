reference: Luke 19:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἀνὴρ ὀνόματι ⸀καλούμενος Ζακχαῖος, καὶ αὐτὸς ἦν ἀρχιτελώνης καὶ ⸀αὐτὸς πλούσιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: ml
  text: ഇതാ, സക്കായി എന്നു പേരുള്ള ഒരു മനുഷ്യൻ—അവൻ മുഖ്യ നികുതിപിരിവുകാരനും ധനികനുമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: അതാ
  rationale: ലൂക്കോസ് ഉപയോഗിക്കുന്ന ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഖ്യാനസൂചകം ഒഴിവാക്കാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സജീവവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: ἀνὴρ
  choice: ഒരു മനുഷ്യൻ
  rationale: പുരുഷനായ ഒരു വ്യക്തിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘ഒരു മനുഷ്യൻ’ അർഥം കൃത്യമായും മാന്യമായും നൽകുന്നു.
- source_word: ὀνόματι καλούμενος
  choice: എന്നു പേരുള്ള
  rationale: ‘പേരുകൊണ്ട് വിളിക്കപ്പെടുന്ന’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യരൂപമാണിത്; അനാവശ്യമായ പദാനുപദഭാരം ഒഴിവാക്കുന്നു.
- source_word: Ζακχαῖος
  choice: സക്കായി
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിക്കുന്നു.
- source_word: αὐτὸς ἦν
  choice: അദ്ദേഹം ... ആയിരുന്നു
  rationale: വിഷയത്തെ വീണ്ടും എടുത്തുപറയുന്ന സർവനാമം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അതിരുകടന്ന ആത്മവാചക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: ἀρχιτελώνης
  choice: മുഖ്യ നികുതിപിരിവുകാരൻ
  rationale: ἀρχι- സൂചിപ്പിക്കുന്ന മേൽസ്ഥാനവും τελώνης എന്ന പദത്തിന്റെ നികുതിപിരിവ് ചുമതലയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: αὐτὸς πλούσιος
  choice: ധനികനുമായിരുന്നു
  rationale: πλούσιος എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നൽകുകയും ആവർത്തിച്ച αὐτός-ന്റെ മൃദുവായ ഊന്നൽ മലയാളത്തിലെ ബന്ധകഘടനയിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
