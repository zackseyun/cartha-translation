translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ മാന്യമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള αὐτόν/അവൻ എന്ന സർവനാമരീതി നിലനിർത്തി; സന്ദർഭത്തിൽ രണ്ടാമത്തെ ‘അവൻ’ യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
