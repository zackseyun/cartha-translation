revisions:
- from: അങ്ങനെ അവൻ മുന്നോട്ടോടി, അവനെ കാണാനായി ഒരു സിക്കമോർ അത്തിമരത്തിൽ[a] കയറി; കാരണം അവൻ ആ വഴിയിലൂടെ കടന്നുപോകാനിരിക്കുകയായിരുന്നു.
  to: അങ്ങനെ അവൻ മുന്നോട്ടോടി, അവനെ കാണാനായി ഒരു സിക്കമോർ അത്തിമരത്തിൽ[a] കയറി; യേശു ആ വഴിയിലൂടെ കടന്നുപോകാനിരിക്കുകയായിരുന്നു എന്നതിനാൽ.
