  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: ml
  text: അങ്ങനെ അവൻ മുന്നോട്ടോടി, അവനെ കാണാനായി ഒരു സിക്കമോർ അത്തിമരത്തിൽ[a] കയറി; യേശു ആ വഴിയിലൂടെ കടന്നുപോകാനിരിക്കുകയായിരുന്നു എന്നതിനാൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കാട്ടത്തിമരത്തിൽ.’ ഇത് Ficus sycomorus എന്ന അത്തിവർഗ മരമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν … εἰς τὸ ἔμπροσθεν
  choice: മുന്നോട്ടോടി
  rationale: ഓടി മറ്റുള്ളവരെക്കാൾ മുമ്പിലെത്തുക എന്ന ക്രിയയുടെയും അതിനെ ഊന്നിപ്പറയുന്ന ദിശാസൂചക പ്രയോഗത്തിന്റെയും സംയുക്ത അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀνέβη ἐπὶ
  choice: മരത്തിൽ കയറി
  rationale: മരത്തിന്മേലേക്കോ അതിന്റെ ശാഖകൾക്കിടയിലേക്കോ കയറുന്ന പ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: συκομορέαν
  choice: സിക്കമോർ അത്തിമരം
  rationale: Ficus sycomorus എന്ന അത്തിവർഗ മരത്തെ സാധാരണ സിക്കമോർ മരത്തിൽനിന്ന് വേർതിരിച്ചറിയാൻ സസ്യശാസ്ത്രപരമായി കൂടുതൽ കൃത്യമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: അവനെ കാണാനായി
  rationale: ἵνα സഹിതമുള്ള ഉപവാക്യത്തിന്റെ ഉദ്ദേശ്യാർഥം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മരത്തിൽ കയറിയതിന്റെ കാരണം തുടർന്നുവരുന്ന ഉപവാക്യം വ്യക്തമാക്കുന്നു.
- source_word: ἐκείνης
  choice: ആ വഴിയിലൂടെ
  rationale: ഗ്രീക്കിൽ നാമം വ്യക്തമാക്കാതെ സൂചിപ്പിച്ചിരിക്കുന്ന വഴി അഥവാ പാത എന്ന ആശയം മലയാളത്തിൽ ആവശ്യമായത്ര മാത്രം പൂരിപ്പിക്കുന്നു.
- source_word: ἤμελλεν διέρχεσθαι
  choice: കടന്നുപോകാനിരിക്കുകയായിരുന്നു
  rationale: μέλλω സൂചിപ്പിക്കുന്ന സമീപഭാവിയെയും διέρχομαι സൂചിപ്പിക്കുന്ന അതുവഴിയുള്ള കടന്നുപോകലിനെയും സംരക്ഷിക്കുന്നു.
