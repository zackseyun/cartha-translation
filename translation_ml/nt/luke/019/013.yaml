  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: ml
  text: അവൻ തന്റെ പത്ത് അടിമകളെ വിളിച്ചശേഷം, അവർക്കു പത്ത് മിനാ[a] കൊടുത്ത്, “ഞാൻ മടങ്ങിവരുന്നതുവരെ വ്യാപാരം ചെയ്യുക[b]” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മിനാ പുരാതനകാലത്തെ ഒരു നാണയ ഏകകമായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “കച്ചവടം ചെയ്യുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: വിളിച്ച്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle സൂചിപ്പിക്കുന്ന ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ സംയോജകക്രിയയായി നൽകുന്നു.
- source_word: δούλους ἑαυτοῦ
  choice: തന്റെ അടിമകളിൽ പത്തുപേരെ
  rationale: ഉടമസ്ഥബന്ധം സൂചിപ്പിക്കുന്ന ἑαυτοῦ എന്നതിന്റെ ഊന്നൽ ‘തന്റെ’ നിലനിർത്തുന്നു; യജമാനൻ–അടിമ സാമൂഹികസന്ദർഭത്തിൽ δοῦλος എന്നതിനു ‘അടിമ’ കൂടുതൽ കൃത്യമാണ്. സംഖ്യയോടൊപ്പം സ്വാഭാവിക മലയാളപ്രയോഗത്തിനായി ‘പത്തുപേരെ’ ഉപയോഗിച്ചു.
- source_word: δέκα μνᾶς
  choice: പത്തു മിനാ
  rationale: പുരാതന നാണയ/ഭാര ഏകകത്തിന്റെ ചരിത്രപരമായ പ്രത്യേകത നിലനിർത്താൻ μνᾶ എന്നത് ലിപ്യന്തരിച്ചു; ആധുനിക നാണയവുമായി തെറ്റായ സമീകരണം ഒഴിവാക്കുന്നു.
- source_word: Πραγματεύσασθε
  choice: ഇവകൊണ്ട് വ്യാപാരം ചെയ്യുക
  rationale: ഏൽപ്പിച്ച പണം ഉപയോഗിച്ചുള്ള വാണിജ്യപ്രവർത്തനമാണ് ആജ്ഞയുടെ ആശയം. ഗ്രീക്കിൽ വ്യക്തമായി ഇല്ലെങ്കിലും മലയാളത്തിൽ കർമ്മബന്ധം വ്യക്തമാക്കാൻ സന്ദർഭസിദ്ധമായ ‘ഇവകൊണ്ട്’ ചേർത്തു; നിക്ഷേപത്തിന്റെ പ്രത്യേക രീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἐν ᾧ ἔρχομαι
  choice: ഞാൻ മടങ്ങിവരുന്നതുവരെ
  rationale: ഈ കാലസൂചക പ്രയോഗത്തിന്റെ സന്ദർഭാർത്ഥം ‘ഞാൻ വരുന്നതുവരെ/മടങ്ങിവരുന്നതുവരെ’ എന്നാണ്. യാത്രയ്ക്കു പോയി തിരിച്ചെത്തുന്ന ഉപമാസന്ദർഭം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος എന്ന സാമൂഹികബന്ധത്തിന്റെ വിവർത്തനം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: സ്വന്തമായി ഉള്ളവരെ വിളിച്ച് തന്റെ പണം ഏൽപ്പിക്കുന്ന യജമാനൻ–അടിമ ഘടനയാണ് വാക്യത്തിലുള്ളത്. ‘സേവകർ’ ബന്ധത്തിന്റെ ബന്ധിതസ്വഭാവം മൃദൂകരിക്കും; ‘ദാസൻ’ മതപരമായ പ്രത്യേക ധ്വനി കൈവരിക്കാം. അതിനാൽ ചരിത്രസാമൂഹിക യാഥാർഥ്യം നേരിട്ട് നൽകുന്ന ‘അടിമ’ തിരഞ്ഞെടുത്തു.
- issue: ἔρχομαι എന്നതിൽ മടങ്ങിവരവ് വ്യക്തമാക്കൽ
  choice: മടങ്ങിവരുന്നതുവരെ
  alternative: വരുന്നതുവരെ
  rationale: കഥയിലെ പ്രഭു ദൂരദേശത്തേക്കു പോയ ശേഷം തിരിച്ചെത്തുന്നതാണ് സന്ദർഭം. ‘മടങ്ങിവരുക’ ആ കഥാക്രമം വ്യക്തമാക്കുന്നു; ഇതിലൂടെ പ്രത്യേക അന്ത്യകാല വ്യാഖ്യാനം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ നീണ്ട വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; അർത്ഥക്രമം നിലനിർത്തി. ‘പത്തു’ എന്ന രൂപം തുടർച്ചയായി ഉപയോഗിച്ചു.
