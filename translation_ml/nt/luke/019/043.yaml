source:
  edition: SBLGNT
  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: ml
  text: എന്തെന്നാൽ, നിന്റെമേൽ ദിവസങ്ങൾ വരും; നിന്റെ ശത്രുക്കൾ നിനക്കെതിരേ ഒരു ഉപരോധത്തടസ്സം കെട്ടി നിന്നെ വളയുകയും എല്ലാ വശത്തുനിന്നും നിന്നെ ഞെരുക്കുകയും ചെയ്യും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിനക്കെതിരേ ഒരു ഉപരോധമതിൽ പണിത്’ അല്ലെങ്കിൽ ‘ഉപരോധത്തിനായി ഒരു മൺതിട്ട ഉയർത്തി.’
    reason: χάραξ എന്ന പദം ഈ സന്ദർഭത്തിൽ ഉപരോധത്തിനുള്ള തടസ്സം, മതിൽ/വേലി, അല്ലെങ്കിൽ മൺതിട്ട എന്നിവയെ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വിലാപത്തിനും തുടർന്നുള്ള പ്രവചനത്തിനും ഇടയിലെ കാരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: നിന്റെമേൽ ദിവസങ്ങൾ വരും
  rationale: സംഭവങ്ങൾ യെരൂശലേമിനെ ബാധിക്കാൻ അടുത്തുവരുന്നു എന്ന പ്രവാചകശൈലിയിലുള്ള പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: παρεμβαλοῦσιν
  choice: പണിത്
  rationale: χάραξ എന്ന ഉപരോധനിർമാണത്തോടൊപ്പം വരുന്നതിനാൽ, ശത്രുക്കൾ ഉപരോധസൗകര്യം നിർമിക്കുന്നതിനെ വ്യക്തവും ആധുനികവുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: οἱ ἐχθροί σου
  choice: നിന്റെ ശത്രുക്കൾ
  rationale: യെരൂശലേമിനെ അഭിസംബോധന ചെയ്യുന്ന ഏകവചന ഉടമസ്ഥപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: χάρακά
  choice: ഒരു ഉപരോധമതിൽ
  rationale: ഈ സൈനികസന്ദർഭത്തിൽ ഉപരോധത്തിനായി പണിയുന്ന തടസ്സമോ മൺതിട്ടയോ മതിലോ സൂചിപ്പിക്കുന്ന പദത്തെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: σοι
  choice: നിനക്കെതിരേ
  rationale: പ്രതികൂലത സൂചിപ്പിക്കുന്ന ദത്തിവിന്റെ സന്ദർഭാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: περικυκλώσουσίν σε
  choice: നിന്നെ വളയുകയും
  rationale: നഗരത്തെ സൈനികമായി ചുറ്റിവളയുന്ന പ്രവൃത്തിയെ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: συνέξουσίν σε πάντοθεν
  choice: എല്ലാ വശത്തുനിന്നും നിന്നെ ഞെരുക്കുകയും
  rationale: പൂർണമായ വളയലും രക്ഷപ്പെടാനിടയില്ലാത്തവിധം അടച്ചുപൂട്ടുന്നതുമായ സൈനികസമ്മർദം നിലനിർത്തുന്നു.
theological_decisions:
- issue: രണ്ടാംപുരുഷ ഏകവചന സർവനാമങ്ങളുടെ സൂചിതവിഷയം
  choice: യെരൂശലേമിനെ വ്യക്തിവൽക്കരിച്ച് അഭിസംബോധന ചെയ്യുന്ന ‘നീ/നിന്റെ/നിന്നെ’ എന്ന ഏകവചനം നിലനിർത്തി.
  alternative: നഗരവാസികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ബഹുവചനമായി വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്കിലെ ഏകവചന സർവനാമങ്ങൾ സമീപസന്ദർഭത്തിലെ യെരൂശലേമിന്റെ വ്യക്തിവൽക്കരണത്തോട് യോജിക്കുന്നു. അവയെ ബഹുവചനമാക്കുന്നത് മൂലപാഠത്തിലുള്ള പ്രവാചക-കാവ്യശക്തി കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യെരൂശലേമിനോടുള്ള ഏകവചന അഭിസംബോധനയും പ്രവാചകസ്വരവും സംരക്ഷിച്ചു.
