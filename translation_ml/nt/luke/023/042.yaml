source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “യേശുവേ, അങ്ങയുടെ രാജ്യത്തിൽ അങ്ങ് വരുമ്പോൾ എന്നെ ഓർക്കണമേ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അങ്ങയുടെ രാജ്യത്തിലേക്കു അങ്ങ് വരുമ്പോൾ” എന്നും പരിഭാഷപ്പെടുത്താം. ചില കൈയെഴുത്തുപ്രതികൾ ‘രാജ്യത്തിലേക്ക്’ എന്ന് കൂടുതൽ വ്യക്തമായി വായിക്കുന്നു; SBLGNT പാഠത്തിൽ ‘രാജ്യത്തിൽ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἔλεγεν
  choice: അവൻ പറഞ്ഞു
  rationale: καὶ എന്ന ലളിതമായ ആഖ്യാനബന്ധം മലയാളത്തിൽ വേറിട്ട് ‘പിന്നെ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; അപൂർണഭൂതകാലമായ ἔλεγεν ഇവിടെ സംഭാഷണം അവതരിപ്പിക്കുന്ന സാധാരണ ഭൂതകാലമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Ἰησοῦ
  choice: യേശുവേ
  rationale: വിളിവിഭക്തി മലയാളത്തിലെ സ്വാഭാവിക സംബോധനരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: μνήσθητί μου
  choice: എന്നെ ഓർക്കണമേ
  rationale: അഭ്യർഥനയുടെ വിനയവും ഗൗരവവും നൽകുന്നു; ‘അനുകൂലമായി ഓർത്ത് പ്രവർത്തിക്കുക’ എന്ന സന്ദർഭസൂചനയെ മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
- source_word: ὅταν ἔλθῃς
  choice: അങ്ങ് വരുമ്പോൾ
  rationale: ഭാവിയെ സൂചിപ്പിക്കുന്ന ὅταν + subjunctive ഘടനയെ സ്വാഭാവികമായി നൽകുന്നു; ആദരസൂചകമായ ‘അങ്ങ്’ യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: അങ്ങയുടെ രാജ്യത്തിൽ
  rationale: SBLGNT-യിലെ ἐν എന്ന പാഠത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘യിൽ/അകത്ത്’ നേരിട്ട് നിലനിർത്തുന്നു. വരവ് രാജ്യത്തിലേക്കാണോ രാജ്യാധികാരത്തോടെയാണോ എന്ന സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: βασιλείᾳ
  choice: രാജ്യം
  rationale: βασιλείαയ്ക്ക് രാജാധികാരം, ഭരണം, രാജ്യം എന്നീ അർഥവ്യാപ്തികളുണ്ട്; ‘രാജ്യം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭത്തിലെ രാജകീയ-ഭാവികാല സൂചനകൾ ഉൾക്കൊള്ളാൻ പര്യാപ്തവുമാണ്.
theological_decisions:
- issue: അഭ്യർഥനയുടെ അന്ത്യകാലസൂചന
  choice: യേശു തന്റെ രാജ്യത്തിൽ വരുമ്പോൾ തന്നെ ഓർക്കണമെന്ന ഭാവികാല അഭ്യർഥനയായി നിലനിർത്തി.
  alternative: യേശു രാജാധികാരത്തോടെ വരുമ്പോൾ; അല്ലെങ്കിൽ തന്റെ രാജ്യത്തിലേക്കു പ്രവേശിക്കുമ്പോൾ.
  rationale: വാക്യം യേശുവിന്റെ ഭാവിയിലെ രാജത്വത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ സമയം, രീതി, സമ്പൂർണ അന്ത്യകാലക്രമം എന്നിവ നിർവചിക്കുന്നില്ല; അതിനാൽ അവ ചേർത്തിട്ടില്ല.
- issue: ἐν τῇ βασιλείᾳ σου എന്നതിലെ സ്ഥാന/ദിശ/സഹചാര അർഥസാധ്യത
  choice: ‘അങ്ങയുടെ രാജ്യത്തിൽ’ എന്ന ഔപചാരികമായി അടുത്ത രൂപം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു.
  alternative: ‘അങ്ങയുടെ രാജ്യത്തിലേക്കു’ അല്ലെങ്കിൽ ‘അങ്ങയുടെ രാജ്യാധികാരത്തോടെ’.
  rationale: SBLGNT പാഠം ἐν ഉപയോഗിക്കുന്നു. എന്നാൽ ചലനക്രിയയോടൊപ്പമുള്ള പ്രയോഗവും പാഠഭേദവും മറ്റു വ്യാഖ്യാനസാധ്യതകൾ തുറന്നിടുന്നതിനാൽ അവ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും അപേക്ഷയിൽ ‘ഓർക്കണമേ’ എന്നും ഉപയോഗിച്ച് ആദരവും വിനയവും പ്രകടമാക്കി. അടിക്കുറിപ്പ് അടയാളം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
