  source_fidelity: മുഖ്യവാചകം SBLGNT പാഠമായ «καὶ ἔλεγεν· Ἰησοῦ, μνήσθητί μου ὅταν ἔλθῃς ἐν τῇ βασιλείᾳ σου» നോടു വിശ്വസ്തമാണ്. «അവൻ പറഞ്ഞു» ആഖ്യാനത്തിൽ സ്വാഭാവികമാണ്; «യേശുവേ» ശരിയായ സംബോധനരൂപവും «എന്നെ ഓർക്കണമേ» μνήσθητί μου-വിന്റെ വിനയപൂർവമായ അപേക്ഷാഭാവവും നൽകുന്നു. «അങ്ങയുടെ രാജ്യത്തിൽ അങ്ങ് വരുമ്പോൾ» ἐν τῇ βασιλείᾳ σου-വിലെ സ്ഥാനസൂചന മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്. യേശുവിനോടുള്ള നേരിട്ടുള്ള അപേക്ഷയിൽ «അങ്ങ്/അങ്ങയുടെ» എന്നും «ഓർക്കണമേ» എന്നും ഉപയോഗിച്ചിരിക്കുന്നത് സ്വാഭാവികമായ ആദരരജിസ്റ്ററാണ്. വാക്യക്രമവും വിരാമചിഹ്നങ്ങളും സുഗമമാണ്.
  terminology: «രാജ്യം» βασιλείαയുടെ സ്വാഭാവികവും സ്ഥാപിതവുമായ പരിഭാഷയാണ്; ഇതിലൂടെ രാജ്യം/രാജകീയഭരണം എന്ന അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല. അടിക്കുറിപ്പ് SBLGNT-യിലെ ἐν (‘രാജ്യത്തിൽ’) എന്ന പാഠവും ചില കൈയെഴുത്തുപ്രതികളിലെ εἰς-അനുസൃതമായ ‘രാജ്യത്തിലേക്ക്’ എന്ന വായനയും ഉചിതമായി വേർതിരിക്കുന്നു.
