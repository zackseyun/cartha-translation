id: LUK.23.35
reference: Luke 23:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: ml
  text: 'ജനം നോക്കിക്കൊണ്ട് അവിടെ നിന്നു. എന്നാൽ ഭരണാധികാരികളും അവനെ പരിഹസിച്ചുകൊണ്ട് പറഞ്ഞു: “ഇവൻ മറ്റുള്ളവരെ രക്ഷിച്ചു; ഇവൻ ദൈവത്തിന്റെ മശീഹായും തിരഞ്ഞെടുക്കപ്പെട്ടവനും ആണെങ്കിൽ, തന്നെത്തന്നെ രക്ഷിക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: അവിടെ നിന്നു
  rationale: സന്ദർഭം ചിത്രീകരിക്കുന്ന സ്ഥിതിവാചകമായ ക്രിയാരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ജനത്തിന്റെ നില്പ് നിലനിർത്തുന്നു.
- source_word: θεωρῶν
  choice: നോക്കിക്കൊണ്ട്
  rationale: ജനത്തിന്റെ തുടർന്നുകൊണ്ടിരുന്ന ദൃശ്യശ്രദ്ധയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐξεμυκτήριζον
  choice: പരിഹസിച്ചുകൊണ്ട്
  rationale: അവജ്ഞയും നിന്ദയും കലർന്ന പരിഹാസത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു; കർമമായ ‘അവനെ’ സന്ദർഭത്തിൽനിന്ന് ചേർക്കുന്നു.
- source_word: ἄρχοντες
  choice: ഭരണാധികാരികൾ
  rationale: ഇവിടെ അധികാരം വഹിക്കുന്ന നേതാക്കളെ സൂചിപ്പിക്കുന്ന പൊതുവും ഔപചാരികവുമായ പദം.
- source_word: Ἄλλους ἔσωσεν
  choice: ഇവൻ മറ്റുള്ളവരെ രക്ഷിച്ചു
  rationale: σῴζωയുടെ ‘രക്ഷിക്കുക’ എന്ന അർഥവും തുടർന്നുള്ള അതേ ക്രിയയുമായുള്ള വാക്കാവർത്തനവും നിലനിർത്തുന്നു.
- source_word: σωσάτω ἑαυτόν
  choice: തന്നെത്തന്നെ രക്ഷിക്കട്ടെ
  rationale: ആജ്ഞാസ്വഭാവമുള്ള വെല്ലുവിളിയും മുൻവാക്യത്തിലെ ‘രക്ഷിച്ചു’ എന്ന ക്രിയയുമായുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: εἰ οὗτός ἐστιν
  choice: ഇവൻ … ആണെങ്കിൽ
  rationale: οὗτός എന്ന നിർദ്ദേശസർവനാമത്തിന്റെ അല്പം അവജ്ഞാപൂർണമായ ഊന്നൽ ‘ഇവൻ’ വഴി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മശീഹാ
  rationale: Χριστός ഇവിടെ വ്യക്തമായ ഒരു സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ യഹൂദ മശീഹാതാത്പര്യം നിലനിർത്തുന്ന ‘മശീഹാ’ ഉപയോഗിക്കുന്നു; τοῦ θεοῦ ബന്ധം ഔപചാരികമായി സംരക്ഷിക്കുന്നു.
- source_word: ὁ ἐκλεκτός
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവൻ
  rationale: ദൈവത്താൽ തിരഞ്ഞെടുക്കപ്പെട്ടവൻ എന്ന സ്ഥാനപ്പേരിന്റെ ഭാരം അധിക വ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം പേരുപോലെയല്ല, ദൈവത്തിന്റെ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായാണ് വരുന്നത്; അതിനാൽ ‘മശീഹാ’ അർഥപരവും സന്ദർഭോചിതവുമാണ്.
- issue: ὁ ἐκλεκτός എന്നതിന്റെ സ്ഥാനപ്പേരായ ശക്തി
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവൻ
  alternative: തിരഞ്ഞെടുക്കപ്പെട്ട ഒരുവൻ
  rationale: നിശ്ചയോപപദവും സന്ദർഭവും ഇതിനെ ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരായി അവതരിപ്പിക്കുന്നു; നിർവചനാതീതമായ ദൈവശാസ്ത്രവിശദീകരണം ചേർക്കാതെ ആ ഭാരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ഭരണാധികാരികളുടെ പരിഹാസവും ‘രക്ഷിക്കുക’ എന്ന ക്രിയയുടെ വിരോധാഭാസപരമായ ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
