- from: 'ജനം നോക്കിക്കൊണ്ട് അവിടെ നിന്നു. ഭരണാധികാരികളും അവനെ പരിഹസിച്ചുകൊണ്ട് പറഞ്ഞു: “ഇവൻ മറ്റുള്ളവരെ രക്ഷിച്ചു; ഇവൻ ദൈവത്തിന്റെ മശീഹാ, തിരഞ്ഞെടുക്കപ്പെട്ടവൻ ആണെങ്കിൽ തന്നെത്തന്നെ രക്ഷിക്കട്ടെ.”'
