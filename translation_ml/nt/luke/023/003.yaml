id: LUK.23.3
reference: Luke 23:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: ml
  text: 'അപ്പോൾ പീലാത്തോസ് അവനോടു ചോദിച്ചു: “നീ യെഹൂദന്മാരുടെ രാജാവാണോ?”[a] അവൻ മറുപടിയായി പറഞ്ഞു: “നീ തന്നെയാണ് പറയുന്നത്.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദ്യരുടെ രാജാവ്.” ഗ്രീക്കിലെ പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘യെഹൂദന്മാർ’ എന്നും ‘യെഹൂദ്യർ’ എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നീ പറയുന്നതുതന്നെ.” അല്ലെങ്കിൽ, “അതെ, നീ പറയുന്നതുപോലെ.” ഗ്രീക്കിലെ മറുപടി വളരെ സംക്ഷിപ്തമാണ്; യോഗ്യതപ്പെടുത്തിയ ഒരു സമ്മതമായി ഇതിനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ശക്തമായ വൈരുധ്യമല്ല, കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ് ഇവിടെ; ‘അപ്പോൾ’ സന്ദർഭത്തിലെ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἠρώτησεν αὐτὸν λέγων
  choice: അവനോടു ചോദിച്ചു
  rationale: ഗ്രീക്കിലെ ‘ചോദിച്ചു, പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന മലയാളത്തിൽ അതേപടി ആവർത്തിക്കുന്നത് കൃത്രിമമാകും; നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ അർത്ഥം നഷ്ടപ്പെടാതെ സ്വാഭാവികമായി ചുരുക്കി.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ രാജാവ്
  rationale: വിചാരണയിലെ രാജകീയ അവകാശവാദം കൃത്യമായി നിലനിർത്തുന്നു. Ἰουδαῖοι എന്ന പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘യെഹൂദ്യർ’ എന്ന ഭൂമിശാസ്ത്രപരമായ അർത്ഥവും വരാമെങ്കിലും ഇവിടെ പരമ്പരാഗതമായ രാഷ്ട്രീയ-വംശീയ പദവി യോജിക്കുന്നു.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: അവൻ മറുപടിയായി പറഞ്ഞു
  rationale: പ്രതികരണത്തിന്റെ സ്വഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അനാവശ്യ സർവനാമാവർത്തനം ഒഴിവാക്കുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: Σὺ λέγεις
  choice: നീ തന്നെയാണ് പറയുന്നത്
  rationale: മറുപടിയുടെ സംക്ഷിപ്തവും പരോക്ഷവുമായ ഭാവം നിലനിർത്തുന്നു; നേരിട്ടുള്ള ‘അതെ’ എന്നു ശക്തിപ്പെടുത്താതെയും നിഷേധമായി മാറ്റാതെയും പീലാത്തോസിന്റെ വാക്കുകളിലേക്കു പ്രസ്താവന തിരിച്ചുനിർത്തുന്നു.
theological_decisions:
- issue: Σὺ λέγεις എന്ന യേശുവിന്റെ മറുപടിയുടെ ശക്തി
  choice: യോഗ്യതപ്പെടുത്തിയ സമ്മതത്തിന്റെ ഭാവമുള്ള ‘നീ തന്നെയാണ് പറയുന്നത്’
  alternative: ‘നീ പറഞ്ഞതുപോലെതന്നെ’ അല്ലെങ്കിൽ ‘അതെ, നീ പറയുന്നതുപോലെ’
  rationale: ഗ്രീക്ക് പ്രയോഗം വെറും ‘അതെ’ എന്നതിനെക്കാൾ പരോക്ഷമാണ്. രാജപദവി നിഷേധിക്കാതിരിക്കുമ്പോഴും അതിന്റെ നിർവചനം പീലാത്തോസിന്റെ വാക്കുകളായി അവതരിപ്പിക്കുന്ന വാചക-ദൈവശാസ്ത്രപരമായ സംഘർഷം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തനാത്മക സംസാരഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി; എന്നാൽ അവസാന മറുപടിയുടെ ഉദ്ദേശ്യപൂർവമായ പരോക്ഷത സംരക്ഷിച്ചു. ‘യെഹൂദന്മാർ’ എന്നത് മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതവും ഈ രാജകീയ പദവിക്ക് അനുയോജ്യവുമാണ്.
