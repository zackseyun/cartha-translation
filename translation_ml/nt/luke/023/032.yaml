id: LUK.23.32
reference: Luke 23:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἤγοντο δὲ καὶ ἕτεροι ⸂κακοῦργοι δύο⸃ σὺν αὐτῷ ἀναιρεθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: ml
  text: കുറ്റവാളികളായ വേറെ രണ്ടുപേരെയും[a] അവനോടൊപ്പം വധിക്കപ്പെടാൻ[b] കൊണ്ടുപോകുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തിന്മ ചെയ്യുന്നവർ.” ഗ്രീക്ക് പദം കുറ്റകരമായ പ്രവൃത്തികൾ ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മരണശിക്ഷ നടപ്പാക്കപ്പെടാൻ.” ഗ്രീക്കിൽ ഇവിടെ മരണത്തിന്റെ രീതി പ്രത്യേകം പറയുന്നില്ല; സന്ദർഭത്തിൽ ക്രൂശിക്കലാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: കൊണ്ടുപോകുകയായിരുന്നു
  rationale: അപൂർണ ഭൂതകാല കർമണിപ്രയോഗം കഴിഞ്ഞകാലത്ത് നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളരൂപം ആ പ്രക്രിയാത്മക ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: വാക്യത്തിന്റെ സ്വാഭാവിക തുടർച്ചയിലൂടെ പരോക്ഷമായി പ്രകടിപ്പിച്ചു
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനബന്ധകമാണ്. പ്രത്യേക പദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ബന്ധം നൽകുന്നത് ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: καὶ
  choice: -യും
  rationale: യേശുവിനു പുറമേ ഇവരെയും കൊണ്ടുപോയി എന്ന ഉൾപ്പെടുത്തൽ '-യും' വ്യക്തമാക്കുന്നു.
- source_word: ἕτεροι
  choice: വേറെ ... പേരെയും
  rationale: യേശുവിനു പുറമേയുള്ള മറ്റുള്ളവരെ സൂചിപ്പിക്കുന്നു; വ്യക്തികളെ എണ്ണുമ്പോൾ 'പേർ' ചേർക്കുന്നത് സ്വാഭാവിക മലയാളമാണ്.
- source_word: κακοῦργοι
  choice: കുറ്റവാളികളായ
  rationale: ഗുരുതരമായ തെറ്റുചെയ്ത് ശിക്ഷാവിധിക്കു വിധേയരായവരെ ഇവിടെ സൂചിപ്പിക്കുന്നു; 'കുറ്റവാളികൾ' വ്യക്തവും ആധുനികവുമാണ്.
- source_word: δύο
  choice: രണ്ടു
  rationale: എണ്ണത്തെ നേരിട്ട്, സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: σὺν αὐτῷ
  choice: അവനോടൊപ്പം
  rationale: സഹഗമനം കൃത്യവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀναιρεθῆναι
  choice: വധിക്കാൻ
  rationale: ന്യായവിധിയുടെ പശ്ചാത്തലത്തിലുള്ള ജീവഹരണത്തെ സൂചിപ്പിക്കുന്നു; ക്രൂശിക്കൽ എന്ന് ഈ ക്രിയയിൽ തന്നെയില്ലാത്ത വിശദാംശം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἀναιρεθῆναι എന്നതിന് ക്രൂശിക്കൽ എന്നു വ്യക്തമായി പറയണമോ
  choice: '''വധിക്കാൻ'' എന്ന വിശാലമായ പ്രയോഗം'
  alternative: '''ക്രൂശിക്കാൻ'' / ''മരണശിക്ഷ നടപ്പാക്കാൻ'''
  rationale: സന്ദർഭം ക്രൂശീകരണം വ്യക്തമാക്കുന്നുവെങ്കിലും ഈ ക്രിയ സ്വതവേ മരണവിധിയുടെ രീതി നിർദേശിക്കുന്നില്ല. അതിനാൽ മൂലപദത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പ്രക്രിയാത്മക അപൂർണഭൂതകാലം നിലനിർത്തുകയും, വധരീതി മൂലവാക്യത്തെക്കാൾ അധികമായി വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്തു.
