  terminology: “വന്ധ്യരായ സ്ത്രീകൾ,” “ഗർഭപാത്രങ്ങൾ,” and “മുലയൂട്ടാത്ത സ്തനങ്ങൾ” accurately preserve the source’s concrete imagery. “ഭാഗ്യമുള്ളവ” appropriately renders Μακάριαι here without prematurely making it a doctrinal assertion of divine blessing.
