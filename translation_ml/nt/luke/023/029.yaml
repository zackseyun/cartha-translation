id: LUK.23.29
reference: Luke 23:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: ml
  text: എന്തെന്നാൽ, ഇതാ, ‘വന്ധ്യരായ സ്ത്രീകളും പ്രസവിക്കാത്ത ഗർഭപാത്രങ്ങളും മുലയൂട്ടാത്ത സ്തനങ്ങളും ഭാഗ്യമുള്ളവ’ എന്ന് ആളുകൾ പറയുന്ന നാളുകൾ വരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: വരാനിരിക്കുന്ന ഭയാനകമായ സാഹചര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് ഉദ്ബോധകത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: στεῖραι
  choice: വന്ധ്യരായ സ്ത്രീകൾ
  rationale: സന്താനോൽപാദനശേഷിയില്ലാത്ത സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന നാമവിശേഷണപ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: പ്രസവിക്കാത്ത ഗർഭപാത്രങ്ങൾ
  rationale: മൂലത്തിലെ ശരീരാവയവത്തെ ആധാരമാക്കിയ സമാന്തരവും ശക്തവുമായ ദൃശ്യഭാഷ നിലനിർത്തുന്നു.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: മുലയൂട്ടാത്ത സ്തനങ്ങൾ
  rationale: ἔθρεψαν എന്നത് ഇവിടെ സ്തനങ്ങളെക്കുറിച്ചായതിനാൽ കുഞ്ഞിനെ മുലയൂട്ടി പോറ്റുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Μακάριαι
  choice: ഭാഗ്യമുള്ളവ
  rationale: വരാനിരിക്കുന്ന ദുരിതത്തിൽ മക്കളില്ലാത്ത അവസ്ഥ മെച്ചമെന്നു പറയപ്പെടുന്ന സാഹചര്യപരമായ അർഥം നൽകുന്നു; ആത്മീയ അനുഗ്രഹത്തെ അനാവശ്യമായി മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: വന്ധ്യതയെ ‘ഭാഗ്യം’ എന്നു വിളിക്കുന്നതിന്റെ സ്വഭാവം
  choice: വരാനിരിക്കുന്ന ദുരന്തകാലത്ത് ആളുകൾ പറയുന്ന വാക്കുകളായി നേരിട്ട് നിലനിർത്തി
  alternative: വന്ധ്യത സ്വതവേ ദൈവാനുഗ്രഹമാണെന്ന പൊതുപ്രസ്താവനയായി വ്യാഖ്യാനിക്കുക
  rationale: ἐροῦσιν എന്ന ഭാവികാലപ്രയോഗം ഇത് നിർദ്ദിഷ്ടമായ വരാനിരിക്കുന്ന സാഹചര്യത്തിലെ വിലയിരുത്തലാണെന്ന് കാണിക്കുന്നു; വാക്യം അതിന്റെ സംഘർഷഭരിതമായ ഭാവത്തിൽ തന്നെ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ മൂന്ന് സമാന്തര ഘടകങ്ങളും ശരീരാവയവങ്ങളെ ആധാരമാക്കിയ ദൃശ്യഭാഷയും നിലനിർത്തിയിരിക്കുന്നു.
