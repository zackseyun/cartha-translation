  source_fidelity: 'The Malayalam faithfully represents all elements of the Greek: the causal connection (ὅτι), attention signal (ἰδού), future announcement, and the three parallel expressions—barren women, wombs that did not bear, and breasts that did not nurse/feed. “ആളുകൾ പറയുന്ന” appropriately supplies the implicit subject of ἐροῦσιν without adding interpretive content.'
