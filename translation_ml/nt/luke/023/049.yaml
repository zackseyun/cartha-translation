translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. വാക്യത്തിലെ ദൃശ്യാത്മകമായ തുടർച്ച നിലനിർത്താൻ ‘നിന്നുകൊണ്ട് … കണ്ടുകൊണ്ടിരുന്നു’ എന്ന ഘടന ഉപയോഗിച്ചു; γνωστοί എന്നതിന്റെ വിശാലമായ അർഥം മുഖ്യപാഠത്തിലും പകരംവായന അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
