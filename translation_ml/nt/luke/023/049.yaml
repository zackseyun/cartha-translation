  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ πάντες οἱ γνωστοὶ ⸀αὐτῷ ⸀μακρόθεν, καὶ γυναῖκες αἱ ⸀συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας, ὁρῶσαι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: ml
  text: എന്നാൽ, അവനെ അറിയുന്നവരെല്ലാവരും[a], ഗലീലയിൽനിന്ന് അവനെ അനുഗമിച്ചുവന്ന സ്ത്രീകളും, അകലെ നിന്നുകൊണ്ട് ഇതെല്ലാം കണ്ടുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ പരിചയക്കാരെല്ലാവരും.’ ഗ്രീക്കിലെ γνωστοί എന്ന പദം ഒരാൾക്ക് പരിചിതരായവരെയോ അയാളുമായി ബന്ധമുള്ളവരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: നിന്നുകൊണ്ട്
  rationale: തുടർന്നുനിന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ക്രിയാഭാവം, ‘കണ്ടുകൊണ്ടിരുന്നു’ എന്നതോടൊപ്പം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തിൽനിന്ന് കാഴ്ചക്കാരിലേക്കുള്ള മൃദുവായ വൈരുധ്യവും മാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: അവനെ അറിയുന്നവരെല്ലാവരും
  rationale: γνωστοί എന്നത് അടുത്ത സുഹൃത്തുക്കൾക്കു മാത്രമായി പരിമിതപ്പെടുത്താതെ, അവനുമായി പരിചയമുള്ളവരെയെല്ലാം ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: μακρόθεν
  choice: അകലെ
  rationale: സ്ഥലപരമായ അകലം ലളിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας
  choice: ഗലീലയിൽനിന്ന് അവനെ അനുഗമിച്ചുവന്ന സ്ത്രീകളും
  rationale: ഗലീലമുതൽ യേശുവിനൊപ്പമുണ്ടായിരുന്ന, വിവരണത്തിൽ നിർദിഷ്ടമായ സ്ത്രീകളുടെ സംഘത്തെ സൂചിപ്പിക്കുന്നു; ‘അനുഗമിച്ചുവന്ന’ മുൻകാലംമുതലുള്ള തുടർച്ചയായ സഹയാത്ര പ്രകടമാക്കുന്നു.
- source_word: ὁρῶσαι ταῦτα
  choice: ഇതെല്ലാം കണ്ടുകൊണ്ടിരുന്നു
  rationale: അവർ സംഭവങ്ങൾ തുടർച്ചയായി ദൃക്സാക്ഷികളായി നിരീക്ഷിച്ചുകൊണ്ടിരുന്നുവെന്ന അർഥവും ταῦτα എന്ന ബഹുവചനത്തിന്റെ സമാഹാരഭാവവും നിലനിർത്തുന്നു.
