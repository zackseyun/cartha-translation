id: LUK.23.39
reference: Luke 23:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: ml
  text: 'തൂങ്ങിക്കിടന്ന കുറ്റവാളികളിൽ ഒരാൾ അവനെ നിന്ദിച്ചുകൊണ്ടിരുന്നു: “നീ മശീഹയല്ലേ?[a] നിന്നെത്തന്നെയും ഞങ്ങളെയും രക്ഷിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ക്രിസ്തു.” ഗ്രീക്ക്: ὁ χριστός.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἷς δὲ
  choice: ഒരാൾ
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനവികാസമോ വൈരുധ്യമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ സ്വാഭാവികമായ വാക്യപ്രവാഹത്തിലൂടെ അത് പ്രകടമാകുന്നു.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: തൂക്കിലേറ്റപ്പെട്ട കുറ്റവാളികളിൽ
  rationale: κακούργων എന്നതിന് ആധുനികവും സ്വാഭാവികവുമായ ‘കുറ്റവാളികൾ’ ഉപയോഗിച്ചു. κρεμασθέντων എന്നത് അക്ഷരാർഥത്തിൽ തൂക്കപ്പെടുക/തൂങ്ങുക എന്നതിനാൽ, ഗ്രീക്കിലുള്ളതിലും കൂടുതൽ നിർദിഷ്ടമായ ‘ക്രൂശിക്കപ്പെട്ട’ എന്ന ക്രിയ ഇറക്കുമതി ചെയ്യാതെ ‘തൂക്കിലേറ്റപ്പെട്ട’ എന്നു നൽകി.
- source_word: ἐβλασφήμει
  choice: അധിക്ഷേപിച്ചുകൊണ്ട്
  rationale: ഇവിടെ യേശുവിനെതിരായ നിന്ദാപരമായ സംസാരമാണ് സന്ദർഭസൂചിത അർഥം. അപൂർണ്ണകാലത്തിന്റെ തുടരുന്ന പ്രവർത്തനം ‘-ച്ചുകൊണ്ട്’ എന്ന രൂപം കൈമാറുന്നു.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: സംസാരം പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് പങ്കാളിക്രിയ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി പ്രധാനക്രിയയോട് ചേർത്തു.
- source_word: Οὐχὶ σὺ εἶ
  choice: നീ ... അല്ലേ?
  rationale: സ്ഥിരീകരണം പ്രതീക്ഷിക്കുന്നതോ പരിഹാസം സൂചിപ്പിക്കുന്നതോ ആയ ചോദ്യത്തിന്റെ ഭാവം മലയാളത്തിലെ ‘അല്ലേ?’ നിലനിർത്തുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός ഒരു പദവിയായതിനാൽ യഹൂദ മശീഹാപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: നിന്നെത്തന്നെയും ഞങ്ങളെയും രക്ഷിക്കൂ
  rationale: രണ്ട് കർമങ്ങളുടെയും ഏകോപനം നേരിട്ട് നിലനിർത്തുകയും ഉടനെയുള്ള മരണത്തിൽനിന്നുള്ള വിടുതലിനെയും വിശാലമായ രക്ഷാഭാഷയുമായുള്ള ബന്ധത്തെയും ‘രക്ഷിക്കൂ’ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: പരിഹാസചോദ്യത്തിൽ Χριστός പേരുപോലെയല്ല, പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തന്റെ പദവിയായാണ് പ്രവർത്തിക്കുന്നത്. ‘മശീഹ’ ആ അർഥവും യഹൂദ പശ്ചാത്തലവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പരിഹാസചോദ്യത്തിന്റെ മൂർച്ച നിലനിർത്തിയിട്ടുണ്ട്; മതസാങ്കേതികമായി തെറ്റിദ്ധരിക്കാവുന്ന ‘ദൈവദൂഷണം ചെയ്തു’ എന്നതിനുപകരം സന്ദർഭോചിതമായ ‘അധിക്ഷേപിച്ചു’ ഉപയോഗിച്ചു.
