id: LUK.23.48
reference: Luke 23:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: ml
  text: ഈ കാഴ്ചയ്ക്കായി ഒരുമിച്ചുകൂടിയിരുന്ന ജനക്കൂട്ടങ്ങളെല്ലാം, സംഭവിച്ചതെല്ലാം കണ്ടശേഷം, നെഞ്ചത്തടിച്ചുകൊണ്ട് മടങ്ങിപ്പൊയ്ക്കൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: നെഞ്ചത്തടിക്കൽ ദുഃഖം, വിലാപം, അല്ലെങ്കിൽ ഞെട്ടൽ പ്രകടിപ്പിക്കുന്ന ഒരു ആംഗ്യമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: ഒരുമിച്ചുകൂടിയിരുന്ന
  rationale: സംഭവസ്ഥലത്ത് ആളുകൾ ഒരുമിച്ചു വന്നുചേർന്നതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മുൻകാല പ്രവർത്തിയുടെ നിലയും സൂചിപ്പിക്കുന്നു.
- source_word: ὄχλοι
  choice: ജനക്കൂട്ടങ്ങളെല്ലാം
  rationale: ഗ്രീക്കിലെ ബഹുവചനവും πάντες എന്ന സമഗ്രതയും ഒരുമിച്ച് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: ഈ കാഴ്ച കാണാൻ
  rationale: θεωρίαയുടെ പൊതുവായി കാണപ്പെടുന്ന കാഴ്ച എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പ്രദർശനം’ എന്ന പദം ക്രൂശീകരണം വിനോദകാഴ്ചയായിരുന്നുവെന്ന അനാവശ്യ സൂചന നൽകാം.
- source_word: θεωρήσαντες τὰ γενόμενα
  choice: സംഭവിച്ചതെല്ലാം കണ്ടശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ ദർശനപ്രവർത്തിയും τὰ γενόμενα എന്ന സംഭവസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τύπτοντες τὰ στήθη
  choice: നെഞ്ചത്തടിച്ചുകൊണ്ട്
  rationale: ദുഃഖം, വിലാപം, ഞെട്ടൽ എന്നിവ പ്രകടിപ്പിക്കുന്ന ശാരീരിക പ്രവൃത്തി മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകുന്നു; അതിനെ മാനസാന്തരമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ὑπέστρεφον
  choice: മടങ്ങിപ്പൊയ്ക്കൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റിന്റെ പുരോഗമനാത്മകമായ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ജനക്കൂട്ടത്തിന്റെ പ്രതികരണത്തിന്റെ വൈകാരികവും ആത്മീയവുമായ അർഥം
  choice: ‘നെഞ്ചത്തടിച്ചുകൊണ്ട്’ എന്ന ശാരീരിക പ്രവൃത്തി മാത്രം മുഖ്യവാചകത്തിൽ പറയുന്നു.
  alternative: അവർ മാനസാന്തരപ്പെട്ടുവെന്നോ കുറ്റബോധം അനുഭവിച്ചുവെന്നോ വ്യക്തമായി പറയുക.
  rationale: ഗ്രീക്ക് വാചകം പ്രവൃത്തിയെ വിവരിക്കുന്നുവെങ്കിലും അവരുടെ ആന്തരികാവസ്ഥയെ നിർണയിക്കുന്നില്ല; അതിനാൽ ദുഃഖം, വിലാപം, ഞെട്ടൽ, അല്ലെങ്കിൽ കുറ്റബോധം എന്നിവയ്ക്കിടയിലെ സാധ്യത തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. വാക്യത്തിലെ ദൃശ്യചലനം നിലനിർത്താൻ ‘മടങ്ങിപ്പൊയ്ക്കൊണ്ടിരുന്നു’ ഉപയോഗിച്ചു; സാംസ്കാരിക ആംഗ്യത്തിന്റെ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
