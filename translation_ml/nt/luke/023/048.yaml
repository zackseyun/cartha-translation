    text: നെഞ്ചത്തടിക്കൽ ദുഃഖം, വിലാപം, അല്ലെങ്കിൽ ഞെട്ടൽ പ്രകടിപ്പിക്കുന്ന ഒരു ആംഗ്യമായിരുന്നു.
    reason: cultural_note
