- from: ഈ കാഴ്ച കാണാൻ ഒരുമിച്ചുകൂടിയിരുന്ന ജനക്കൂട്ടങ്ങളെല്ലാം സംഭവിച്ചതെല്ലാം കണ്ടശേഷം നെഞ്ചത്തടിച്ചുകൊണ്ട് മടങ്ങിപ്പൊയ്ക്കൊണ്ടിരുന്നു.[a]
  to: ഈ കാഴ്ചയ്ക്കായി ഒരുമിച്ചുകൂടിയിരുന്ന ജനക്കൂട്ടങ്ങളെല്ലാം, സംഭവിച്ചതെല്ലാം കണ്ടശേഷം, നെഞ്ചത്തടിച്ചുകൊണ്ട് മടങ്ങിപ്പൊയ്ക്കൊണ്ടിരുന്നു.[a]
