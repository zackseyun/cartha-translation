id: LUK.23.27
reference: Luke 23:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: ml
  text: സ്ത്രീകളും ഉൾപ്പെട്ട വലിയൊരു ജനക്കൂട്ടം അവനെ അനുഗമിച്ചു. ആ സ്ത്രീകൾ മാറത്തടിച്ചും അവനെച്ചൊല്ലി വിലപിച്ചും കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: അനുഗമിച്ചു
  rationale: അപൂർണഭൂതകാലരൂപം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാള ആഖ്യാനത്തിൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്, തുടർന്നുള്ള ‘കൊണ്ടിരുന്നു’ രൂപം ദൃശ്യമായ തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇത് ആഖ്യാനത്തിന്റെ തുടർച്ച അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ വാക്യാരംഭ സംയോജകം ചേർക്കാതെതന്നെ ആ ബന്ധം സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: വലിയൊരു ജനക്കൂട്ടം
  rationale: ഗ്രീക്കിലെ പദശൃംഖലയുടെ അർഥം സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ γυναικῶν
  choice: സ്ത്രീകളും ഉൾപ്പെട്ട
  rationale: സ്ത്രീകൾ അനുഗമിച്ച ജനക്കൂട്ടത്തിനുള്ളിലുണ്ടായിരുന്നുവെന്ന വിവരഘടന വ്യക്തമാക്കുകയും പിന്നാലെയുള്ള സ്ത്രീലിംഗ ബഹുവചന ആപേക്ഷിക സർവനാമത്തിന് വ്യക്തമായ പൂർവപദം നൽകുകയും ചെയ്യുന്നു.
- source_word: αἳ
  choice: ആ സ്ത്രീകൾ
  rationale: ഗ്രീക്കിലെ സ്ത്രീലിംഗ ബഹുവചന ആപേക്ഷിക സർവനാമം സ്ത്രീകളെ മാത്രമാണ് സൂചിപ്പിക്കുന്നത്; രണ്ട് വാക്യങ്ങളാക്കിയ മലയാളത്തിൽ പുനർനാമകരണം അവ്യക്തത ഒഴിവാക്കുന്നു.
- source_word: ἐκόπτοντο
  choice: മാറത്തടിച്ചും
  rationale: ദുഃഖാചരണത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ ക്രിയ സ്വന്തം മാറത്തടിക്കുന്ന ആചാരപരമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അതിന്റെ സാംസ്കാരിക അർഥം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐθρήνουν
  choice: വിലപിച്ചുംകൊണ്ടിരുന്നു
  rationale: ശബ്ദത്തോടെ ദുഃഖം പ്രകടിപ്പിക്കുന്ന തുടർച്ചയായ വിലാപത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτόν
  choice: അവനെച്ചൊല്ലി
  rationale: വിലാപത്തിന്റെ വിഷയവും കാരണവും യേശുവാണെന്ന് മലയാള പ്രയോഗത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘അവനുവേണ്ടി’ എന്നത് ഉദ്ദേശ്യാർത്ഥമായി തെറ്റിദ്ധരിക്കപ്പെടാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ത്രീകളെയാണ് തുടർന്നുള്ള പ്രവൃത്തികൾ വിശേഷിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കാൻ ഗ്രീക്കിലെ ഒരൊറ്റ വാക്യം രണ്ട് മലയാളവാക്യങ്ങളാക്കി; അർഥമോ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനമോ അധികമായി ചേർത്തിട്ടില്ല.
