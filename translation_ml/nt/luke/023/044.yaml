id: LUK.23.44
reference: Luke 23:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: ml
  text: അപ്പോഴേക്കും ഏകദേശം ആറാം മണിക്കൂറായിരുന്നു[a]; ഒൻപതാം മണിക്കൂർവരെ ദേശം മുഴുവൻ[b] ഇരുട്ട് മൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ഉച്ചയ്ക്ക് ഏകദേശം പന്ത്രണ്ടു മണി മുതൽ ഉച്ചകഴിഞ്ഞ് ഏകദേശം മൂന്നു മണിവരെ.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘മുഴുവൻ ഭൂമി.’ ഗ്രീക്കിലെ γῆ എന്ന പദത്തിന് ‘ദേശം’ എന്നോ ‘ഭൂമി’ എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: അപ്പോൾ
  rationale: ἤδη ഇവിടെ കഥ ഇതിനകം ആ സമയബിന്ദുവിലെത്തിയെന്ന സൂചന നൽകുന്നു. മലയാളത്തിൽ ‘അപ്പോൾ’ സന്ദർഭാനുസൃതമായി സ്വാഭാവികമാണ്; ‘ഇതിനകം’ ചേർത്താൽ വാക്യം കൃത്രിമമാകാം.
- source_word: ὡσεὶ
  choice: ഏകദേശം
  rationale: സമയം കൃത്യമല്ല, ഏകദേശമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ὥρα ἕκτη
  choice: ആറാം മണിക്കൂർ
  rationale: മൂലത്തിലെ പുരാതന സമയപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഇന്നത്തെ സമയത്തിന് തുല്യമായ ‘ഉച്ചയ്ക്ക് ഏകദേശം പന്ത്രണ്ടുമണി’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: σκότος
  choice: ഇരുട്ട്
  rationale: ഈ സന്ദർഭത്തിൽ സുതാര്യവും സാധാരണവുമായ മലയാള തുല്യപദം.
- source_word: ἐγένετο
  choice: ഇരുട്ടായി
  rationale: γίνομαι എന്നതിന്റെ സംഭവാത്മക അർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: ദേശം മുഴുവൻ
  rationale: γῆ എന്നതിന് ‘ദേശം’ എന്നും ‘ഭൂമി’ എന്നും അർത്ഥമാകാം. മുഖ്യപാഠത്തിലെ ‘ദേശം’ വ്യാപ്തി നിർബന്ധമായി ആഗോളമെന്നു തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἕως ὥρας ἐνάτης
  choice: ഒൻപതാം മണിക്കൂർവരെ
  rationale: മൂലത്തിലെ സമയപ്രയോഗം നിലനിർത്തുന്നു; ആധുനിക സമയതുല്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഇരുട്ടിന്റെ വ്യാപ്തിയെ സൂചിപ്പിക്കുന്ന γῆ എന്ന പദത്തിന്റെ അർത്ഥം
  choice: ദേശം
  alternative: ഭൂമി മുഴുവൻ
  rationale: ഗ്രീക്ക് പദം പ്രാദേശികവും സാർവലൗകികവുമായ അർത്ഥങ്ങൾ അനുവദിക്കുന്നു. മുഖ്യപാഠത്തിൽ നിയന്ത്രിതമായ ‘ദേശം’ ഉപയോഗിക്കുകയും വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നത് പാഠത്തിലെ യഥാർഥ അവ്യക്തതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പുരാതന സമയനിർണ്ണയം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അതിന്റെ ആധുനിക തുല്യം അടിക്കുറിപ്പിൽ നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
