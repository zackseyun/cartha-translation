  to: അപ്പോഴേക്കും ഏകദേശം ആറാം മണിക്കൂറായിരുന്നു[a]; ഒൻപതാം മണിക്കൂർവരെ ദേശം മുഴുവൻ[b] ഇരുട്ട് മൂടി.
