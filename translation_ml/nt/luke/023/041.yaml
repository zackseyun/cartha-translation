source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: ml
  text: നമ്മളാകട്ടെ ന്യായമായിട്ടുതന്നെ ശിക്ഷ അനുഭവിക്കുന്നു[a]; കാരണം, നമ്മൾ ചെയ്ത പ്രവൃത്തികൾക്കു തക്കതായതു നമുക്കു ലഭിച്ചുകൊണ്ടിരിക്കുന്നു. എന്നാൽ ഈ മനുഷ്യൻ തെറ്റായതൊന്നും ചെയ്തിട്ടില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മൾ ചെയ്തതിനു തക്കതായതു നമുക്കു ലഭിച്ചുകൊണ്ടിരിക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഈ മനുഷ്യൻ അനുചിതമായതൊന്നും ചെയ്തിട്ടില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  choice: ന്യായമായിട്ടുതന്നെ
  rationale: ശിക്ഷ അർഹിച്ചതാണെന്ന നീതിന്യായപരമായ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; μὲν നൽകുന്ന ഊന്നലും ‘തന്നെ’ സൂചിപ്പിക്കുന്നു.
- source_word: ἄξια
  choice: തക്കത്
  rationale: മുൻ പ്രവൃത്തികൾക്ക് ആനുപാതികവും അർഹവുമായ ഫലം ലഭിക്കുന്നു എന്ന അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ὧν ἐπράξαμεν
  choice: നമ്മൾ ചെയ്ത പ്രവൃത്തികൾക്ക്
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥം നഷ്ടപ്പെടുത്താതെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀπολαμβάνομεν
  choice: നമുക്കു ലഭിക്കുന്നത്
  rationale: ഇപ്പോൾ അനുഭവിച്ചുകൊണ്ടിരിക്കുന്ന പ്രതിഫലം എന്ന വർത്തമാനകാല ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: യേശുവിനെ ചൂണ്ടിക്കാണിക്കുന്ന സർവനാമത്തിന്റെ നിർദേശകബലം നിലനിർത്തുന്നു.
- source_word: οὐδὲν ἄτοπον
  choice: തെറ്റായതൊന്നും
  rationale: അനുചിതമോ തെറ്റോ ആയ ഒന്നും ചെയ്തിട്ടില്ല എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘കുറ്റം’ എന്നു മാത്രം പറഞ്ഞ് നിയമപരമായി അമിതമായി ചുരുക്കുന്നില്ല.
- source_word: ἔπραξεν
  choice: ചെയ്തിട്ടില്ല
  rationale: ഗ്രീക്ക് ഭൂതകാലക്രിയയും നിഷേധവും മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ നിരപരാധിത്വത്തെക്കുറിച്ചുള്ള കുറ്റവാളിയുടെ സാക്ഷ്യം
  choice: എന്നാൽ ഈ മനുഷ്യൻ തെറ്റായതൊന്നും ചെയ്തിട്ടില്ല
  alternative: എന്നാൽ ഈ മനുഷ്യൻ അനുചിതമായതൊന്നും ചെയ്തിട്ടില്ല
  rationale: ഉടനെയുള്ള ശിക്ഷാ-ന്യായവിധി സന്ദർഭത്തിൽ യേശു തെറ്റ് ചെയ്തിട്ടില്ലെന്ന അവകാശവാദം വ്യക്തമായി നിലനിർത്തുന്നു; വാക്യം നേരിട്ട് പറയാത്ത വിപുലമായ സിദ്ധാന്തനിഗമനങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. μὲν...δὲ എന്ന വിരോധഘടന ‘നമ്മളാകട്ടെ... എന്നാൽ’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു. ‘ശിക്ഷ അനുഭവിക്കുന്നു’ എന്നത് സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന അർഥം വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള ഘടകം ഗ്രീക്കിലെ ‘ലഭിക്കുന്നു’ എന്ന പദപ്രയോഗം നിലനിർത്തുന്നു.
