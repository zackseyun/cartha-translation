  yaml_path: translation/nt/luke/023/052.yaml
  text: This man went to Pilate and asked for the body of Jesus.
translation:
  language: ml
  text: ഈ മനുഷ്യൻ പീലാത്തൊസിന്റെ അടുക്കൽ ചെന്നു യേശുവിന്റെ ശരീരം ചോദിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: ഇദ്ദേഹം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ അരിമഥ്യക്കാരനായ യോസേഫിലേക്കുള്ള സൂചന നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: προσελθὼν
  choice: അടുക്കൽ ചെന്ന്
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള അനുബന്ധ പ്രവൃത്തിയായി ഈ ഭൂതകാല കൃദന്തം പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ അതിനെ ‘അടുക്കൽ ചെന്ന്’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τῷ Πιλάτῳ
  choice: പീലാത്തോസിന്റെ അടുക്കൽ
  rationale: προσέρχομαι എന്ന ക്രിയയോടൊപ്പമുള്ള ചതുർഥീവിഭക്തി സമീപിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘പൊന്തിയോസ്’ എന്ന പേര് ചേർക്കുന്നില്ല.
- source_word: ᾐτήσατο
  choice: ചോദിച്ചു
  rationale: ഇവിടെ ക്രിയയ്ക്ക് എന്തെങ്കിലും നൽകണമെന്ന് ചോദിക്കുക എന്ന അർഥമാണുള്ളത്. ‘ശരീരം ചോദിച്ചു’ എന്ന പ്രയോഗം മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി ‘ശരീരം തനിക്കു നൽകണമെന്ന് ചോദിച്ചു’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘ആവശ്യപ്പെട്ടു’ എന്നത് അനാവശ്യമായി ശക്തമായേക്കാം.
- source_word: τὸ σῶμα
  choice: ശരീരം
  rationale: σῶμα എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. ‘മൃതശരീരം’ എന്നു പറയുന്നത് സന്ദർഭത്തിൽ ശരിയാണെങ്കിലും മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യക്തീകരണം ചേർക്കും.
- source_word: τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ
  rationale: ബന്ധം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാള രൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇദ്ദേഹം’ എന്നത് സൂചനാത്മകതയും ആദരസൂചകമായ സ്വാഭാവികതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
