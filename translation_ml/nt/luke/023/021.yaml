  yaml_path: translation/nt/luke/023/021.yaml
  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: ml
  text: എന്നാൽ അവർ, “അവനെ ക്രൂശിക്കുക, ക്രൂശിക്കുക[a]!” എന്നു തുടരെ ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യക്തമായി: “അവനെ കുരിശിൽ വധിക്കുക, കുരിശിൽ വധിക്കുക!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: എന്നാൽ അവർ
  rationale: οἱ സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ച ജനക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; δέ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം ഇവിടെ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ἐπεφώνουν
  choice: തുടരെ ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ἐπιφωνέω എന്ന ക്രിയയിലെ ഉച്ചത്തിലുള്ള വിളിയുടെ ഭാവവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: λέγοντες
  choice: എന്ന്
  rationale: സമകാലികമായ ഈ കൃീദന്തരൂപം വിളിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉദ്ധരണിക്കുശേഷമുള്ള ‘എന്ന്’ എന്ന ഘടനയിൽ അത് സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: Σταύρου σταύρου
  choice: ക്രൂശിക്കുക! ക്രൂശിക്കുക!
  rationale: ആജ്ഞയുടെ ആവർത്തനം ജനക്കൂട്ടത്തിന്റെ അടിയന്തരവും വിട്ടുവീഴ്ചയില്ലാത്തതുമായ ആവശ്യം നിലനിർത്തുന്നു. ‘ക്രൂശിക്കുക’ σταυρόω എന്നതിന്റെ കൃത്യവും സ്ഥാപിതവുമായ മലയാള സമാനപദമാണ്.
- source_word: αὐτόν
  choice: അവനെ
  rationale: ആജ്ഞയുടെ പ്രത്യക്ഷ കർമമായ ഏകവചന സർവനാമം മലയാളത്തിൽ നേരിട്ട് ‘അവനെ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: σταύρου എന്ന വധശിക്ഷാ-ആവശ്യത്തിന്റെ പരിഭാഷ
  choice: ക്രൂശിക്കുക
  alternative: കുരിശിൽ തറച്ച് വധിക്കുക
  rationale: ക്രിയ പ്രത്യേകമായി ക്രൂശിക്കൽ അഥവാ കുരിശിലേറ്റിയുള്ള വധത്തെ സൂചിപ്പിക്കുന്നു. ‘ക്രൂശിക്കുക’ അർഥം കൃത്യമായി നൽകുകയും മൂലപാഠത്തിലില്ലാത്ത വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ആവർത്തിച്ച ആജ്ഞയുടെ ശക്തിയും അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവവും സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ നിലനിർത്തിയിരിക്കുന്നു.
