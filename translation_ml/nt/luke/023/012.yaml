source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: ml
  text: അന്നുതന്നെ ഹെരോദാവും പീലാത്തൊസും പരസ്പരം സുഹൃത്തുക്കളായി[a]; കാരണം, അതിനു മുമ്പ് അവർ തമ്മിൽ ശത്രുതയിലായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരസ്പരം സൗഹൃദത്തിലായി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതിനു മുമ്പ് അവർ പരസ്പരം ശത്രുക്കളായിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: ആയി
  rationale: γίνομαι എന്ന ക്രിയ ഇവിടെ ബന്ധത്തിന്റെ നിലയിൽ വന്ന മാറ്റം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ആയി’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: φίλοι
  choice: സുഹൃത്തുക്കൾ
  rationale: ബഹുവചന വിധേയനാമമായ φίλοι യഥാർത്ഥ സൗഹൃദമോ സഖ്യമോ സൂചിപ്പിക്കാം; അതിനെ ദുർബലമാക്കാതെ ‘സുഹൃത്തുക്കൾ’ എന്നു നൽകി.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: ഹെരോദാവും പീലാത്തൊസും
  rationale: τε ... καὶ എന്ന പരസ്പരബന്ധിത ഘടന ഇരുവരെയും ചേർത്ത് കാണിക്കുന്നു; മലയാളത്തിലെ ‘-ഉം ... -ഉം’ അതിനെ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: അന്നുതന്നെ
  rationale: αὐτῇ നൽകുന്ന ഊന്നൽ ‘തന്നെ’ കൊണ്ട് സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: μετ’ ἀλλήλων
  choice: പരസ്പരം
  rationale: ബന്ധത്തിന്റെ പരസ്പരസ്വഭാവം വ്യക്തമായി സൂചിപ്പിക്കുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: προϋπῆρχον
  choice: അതിനു മുമ്പ് ... ആയിരുന്നു
  rationale: മുമ്പേ നിലനിന്നിരുന്ന തുടർച്ചയായ അവസ്ഥയും അന്നുണ്ടായ മാറ്റവുമായുള്ള സമയവ്യത്യാസവും വ്യക്തമാക്കുന്നു.
- source_word: ἐν ἔχθρᾳ ὄντες πρὸς αὑτούς
  choice: അവർ തമ്മിൽ ശത്രുതയിലായിരുന്നു
  rationale: നാമരൂപത്തിലുള്ള ἔχθραയും പരസ്പരദിശ സൂചിപ്പിക്കുന്ന πρὸς αὑτούς ഉം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഹെരോദാവും പീലാത്തൊസും തമ്മിലുണ്ടായ ബന്ധമാറ്റത്തിന്റെ സ്വഭാവം
  choice: അവർ അന്നുതന്നെ ‘സുഹൃത്തുക്കളായി’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പരസ്പരം സൗഹൃദത്തിലായി’ എന്ന ദുർബലമായ അർത്ഥസാധ്യത.
  rationale: φίλοι സൗഹൃദത്തെയോ രാഷ്ട്രീയ സഖ്യത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും വാക്യം അവരുടെ പ്രേരണയോ ബന്ധത്തിന്റെ ആഴമോ വിശദീകരിക്കുന്നില്ല. അതിനാൽ കൂടുതൽ ദൈവശാസ്ത്രപരമോ രാഷ്ട്രീയമോ ആയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഊന്നൽ ‘അന്നുതന്നെ’ എന്നതിലൂടെയും മുൻകാലത്തെ തുടരുന്ന ശത്രുത ‘ശത്രുതയിലായിരുന്നു’ എന്നതിലൂടെയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
