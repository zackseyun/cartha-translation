reference: Luke 23:55
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: ml
  text: ഗലീലയിൽനിന്ന് അവനോടൊപ്പം വന്നിരുന്ന സ്ത്രീകൾ പിന്നാലെ ചെന്ന്, കല്ലറയും അവന്റെ ശരീരം എങ്ങനെ വെച്ചിരുന്നുവെന്നും കണ്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഗലീലയിൽനിന്ന് അവനെ അനുഗമിച്ചുവന്നിരുന്ന സ്ത്രീകൾ.’
    reason: സഹയാത്രയെ സൂചിപ്പിക്കുന്ന συνεληλυθυῖαι … αὐτῷ എന്ന പ്രയോഗം ‘അവനോടൊപ്പം വന്നിരുന്നു’ എന്നും, സന്ദർഭപരമായി ‘അവനെ അനുഗമിച്ചുവന്നു’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: പിന്നാലെ ചെന്ന്
  rationale: സ്ത്രീകൾ ആദ്യം പിന്നാലെ ചെന്നതും തുടർന്ന് കണ്ടതുമായ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൃത്‌രൂപത്തിന്റെ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: δέ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ മൃദുവായ ആഖ്യാനത്തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ തുടർച്ച സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘ഇപ്പോൾ’ പോലൊരു അധിക കാലസൂചന ചേർത്തിട്ടില്ല.
- source_word: αἱ γυναῖκες
  choice: സ്ത്രീകൾ
  rationale: മുൻസന്ദർഭത്തിൽ അറിയപ്പെടുന്ന പ്രത്യേക സ്ത്രീസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അനുബന്ധ വിശേഷണവാക്യം അവരെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: αἵτινες ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: ഗലീലയിൽനിന്ന് അവനോടൊപ്പം വന്നിരുന്ന
  rationale: മുമ്പേ നടന്ന സഹയാത്രയും ഗലീല എന്ന പുറപ്പെടൽസ്ഥാനവും ഒരുപോലെ നിലനിർത്തുന്നു. ഗ്രീക്കിലെ പരിഭാഷാപരമായ ഭൂതപൂർവകാല ഭാവം ‘വന്നിരുന്ന’ എന്ന രൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐθεάσαντο
  choice: കണ്ടു
  rationale: ശ്രദ്ധയോടെ നിരീക്ഷിക്കുന്ന ഭാവം സന്ദർഭവും പിന്നാലെയുള്ള വിശദീകരണവും നൽകുന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘കണ്ടു’ മതിയാകുന്നു.
- source_word: τὸ μνημεῖον
  choice: കല്ലറ
  rationale: ശവസംസ്കാരസന്ദർഭത്തിൽ μνημεῖον എന്നതിന്റെ വ്യക്തവും പതിവുമായ മലയാളസമാനപദം.
- source_word: ὡς
  choice: എങ്ങനെ
  rationale: ശരീരം വെച്ച രീതിയെ പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ἐτέθη
  choice: വെച്ചു
  rationale: τίθημι എന്ന ക്രിയയുടെ അകർമ്മകപ്രയോഗാർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്ന രൂപം; സന്ദർഭം ശരീരം കല്ലറയിൽ വെച്ചതാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: τὸ σῶμα αὐτοῦ
  choice: അവന്റെ ശരീരം
  rationale: സംബന്ധസർവനാമത്തിന്റെ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: κατακολουθήσασαι എന്ന കൃത്‌രൂപവും ἐθεάσαντο എന്ന മുഖ്യക്രിയയും തമ്മിലുള്ള ആഖ്യാനക്രമം
  choice: ‘പിന്നാലെ ചെന്ന് ... കണ്ടു’ എന്ന ക്രമബദ്ധമായ പ്രവർത്തനങ്ങളായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘പിന്നാലെ ചെന്ന സ്ത്രീകൾ ... കണ്ടു’
  rationale: ഇത് ഉപദേശപരമായ തീരുമാനമല്ല, വാക്യഘടനാപരമായതാണ്. സ്ത്രീകൾ പിന്നാലെ ചെന്നശേഷം കല്ലറയും ശരീരം വെച്ച രീതിയും കണ്ടുവെന്ന സംഭവക്രമം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘മൃതശരീരം’ എന്നു വ്യക്തമാക്കേണ്ട ആവശ്യമില്ലാത്തതിനാൽ മൂലത്തിലെ σῶμα അനുസരിച്ച് ‘ശരീരം’ നിലനിർത്തി.
