  text: എന്നാൽ യേശുവിനെ വിട്ടയയ്ക്കാൻ ആഗ്രഹിച്ച പീലാത്തോസ് വീണ്ടും അവരോടു വിളിച്ചുപറഞ്ഞു.[a]
