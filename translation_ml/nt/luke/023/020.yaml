lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: പ്രവർത്തനത്തിന്റെ ആവർത്തനം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ജനക്കൂട്ടത്തിന്റെ നിലപാടിനോടുള്ള പീലാത്തോസിന്റെ പ്രതികരണത്തിൽ കാണുന്ന മൃദുവായ വൈരുധ്യം സന്ദർഭോചിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: προσεφώνησεν
  choice: അവരോടു വിളിച്ചുപറഞ്ഞു
  rationale: προσφωνέω എന്ന ക്രിയയുടെ പരസ്യമായി അഭിസംബോധന ചെയ്യുക, വിളിച്ചുപറയുക എന്നീ അർഥങ്ങൾ വിചാരണാസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ലക്ഷ്യശ്രോതാക്കളെ ഗ്രീക്കിലെ ക്രിയ സൂചിപ്പിക്കുന്നതുപോലെ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: θέλων
  choice: ആഗ്രഹിച്ച
  rationale: പ്രധാനക്രിയയോടൊപ്പം നിലനിന്ന പീലാത്തോസിന്റെ ഉദ്ദേശ്യമോ ആഗ്രഹമോ സ്വാഭാവിക മലയാളത്തിൽ പങ്കാളിക്രിയാസ്വഭാവത്തോടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπολῦσαι
  choice: വിട്ടയയ്ക്കാൻ
  rationale: നിയമപരമായ കസ്റ്റഡി സാഹചര്യത്തിൽ മോചിപ്പിക്കുക എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν Ἰησοῦν
  choice: യേശുവിനെ
  rationale: മലയാളത്തിൽ പരിചിതമായ നാമരൂപവും വാക്യത്തിലെ കർമവിഭക്തിയും ഉപയോഗിക്കുന്നു.
