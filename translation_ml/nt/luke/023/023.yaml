source:
  edition: SBLGNT
  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: ml
  text: എന്നാൽ, അവനെ ക്രൂശിക്കണമെന്ന് ആവശ്യപ്പെട്ടുകൊണ്ട് അവർ ഉച്ചത്തിലുള്ള ശബ്ദങ്ങളിൽ നിരന്തരം സമ്മർദം ചെലുത്തിക്കൊണ്ടിരുന്നു; അവരുടെ ശബ്ദങ്ങൾ മേൽക്കൈ നേടിക്കൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ നിലവിളികൾ മേൽക്കൈ നേടിക്കൊണ്ടിരുന്നു.’ രണ്ടു ഖണ്ഡങ്ങളിലും ‘ശബ്ദങ്ങൾ’ എന്നർഥമുള്ള ഒരേ ഗ്രീക്കുപദമാണ് ആവർത്തിക്കുന്നത്; ഈ സന്ദർഭത്തിൽ അത് ‘നിലവിളികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέκειντο
  choice: നിർബന്ധിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലരൂപം തുടർച്ചയായ ശക്തമായ നിർബന്ധം സൂചിപ്പിക്കുന്നു; ഒറ്റത്തവണത്തെ അപേക്ഷയെന്നതിലുപരി അവർ സമ്മർദം തുടർന്നുവെന്ന ആശയം ഈ പ്രയോഗം നൽകുന്നു.
- source_word: φωναῖς μεγάλαις
  choice: ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ
  rationale: φωνή എന്നത് ശബ്ദം, സ്വരം, നിലവിളി എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ μέγας-നോടുകൂടി അവരുടെ നിർബന്ധത്തിന്റെ ഉച്ചവും ശക്തിയും വ്യക്തമാക്കുന്നു; സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികം വ്യാഖ്യാനം ചേർക്കാതെ ഈ പരിഭാഷ അത് നിലനിർത്തുന്നു.
- source_word: αἰτούμενοι
  choice: ആവശ്യപ്പെട്ടുകൊണ്ട്
  rationale: αἰτέω എന്നതിന് ചോദിക്കുക, അപേക്ഷിക്കുക, ആവശ്യപ്പെടുക എന്നീ അർഥങ്ങളുണ്ട്. ശത്രുതാപരമായ ഈ ന്യായവിചാരണാസന്ദർഭത്തിലും ചുറ്റുമുള്ള ശക്തമായ നിർബന്ധത്തിലും ‘ആവശ്യപ്പെടുക’ സ്വാഭാവികമാണ്; എങ്കിലും സ്വതന്ത്രമായി ‘കല്പിക്കുക’ എന്നതുപോലുള്ള അതിശക്തമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: αὐτὸν σταυρωθῆναι
  choice: അവനെ ക്രൂശിക്കണമെന്ന്
  rationale: കർമണിപ്രയോഗത്തിലുള്ള അനന്തക്രിയയുടെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും, ക്രൂശിക്കൽ അവന്റെമേൽ ചെയ്യപ്പെടണമെന്ന ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: κατίσχυον
  choice: മേൽക്കൈ നേടി
  rationale: അവരുടെ ശബ്ദങ്ങൾ ഫലപ്രദമായി ശക്തിപ്രാപിച്ച് നടപടിയിൽ വിജയിച്ചതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്. ഗ്രീക്കിലെ അപൂർണകാലത്തിന് പുരോഗമനസ്വഭാവമുണ്ടെങ്കിലും വാക്യസന്ദർഭത്തിൽ ലഭിച്ച ഫലം ചുരുക്കമായി വ്യക്തമാക്കുന്നു.
- source_word: αἱ φωναὶ αὐτῶν
  choice: അവരുടെ ശബ്ദങ്ങൾ
  rationale: ആദ്യഖണ്ഡത്തിലെ φωνή എന്ന പദത്തിന്റെ ആവർത്തനം നിലനിർത്തുന്നു; അവരുടെ കൂട്ടായ നിലവിളിയുടെ ശക്തിയാണ് മേൽക്കൈ നേടിയതെന്ന ആഖ്യാന ഊന്നൽ ഇതിലൂടെ സംരക്ഷിക്കപ്പെടുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ തുടർച്ചയായ നിർബന്ധവും φωνή എന്ന പദത്തിന്റെ ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
