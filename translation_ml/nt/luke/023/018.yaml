id: LUK.23.18
reference: Luke 23:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: ml
  text: 'എന്നാൽ അവരെല്ലാവരും ഒന്നടങ്കം ഇങ്ങനെ നിലവിളിച്ചു: “ഇവനെ നീക്കിക്കളയുക[a]; ബറബ്ബാസിനെ ഞങ്ങൾക്കു വിട്ടുതരിക!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവനെ കൊണ്ടുപോകുക.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ആജ്ഞയുടെ ആശയം ഇവനെ തങ്ങളുടെ മുമ്പിൽനിന്ന് മാറ്റണമെന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: നിലവിളിച്ചു
  rationale: ഉച്ചത്തിലുള്ള കൂട്ടനിലവിളിയെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ തീവ്രത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തോടുള്ള വിരുദ്ധമായ വഴിത്തിരിവ് വ്യക്തമാക്കുന്നു.
- source_word: παμπληθεὶ
  choice: അവരെല്ലാവരും ഒന്നടങ്കം
  rationale: മുഴുവൻ കൂട്ടവും ഒരുമിച്ചു പ്രവർത്തിച്ചു എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘ഒരേ സ്വരത്തിൽ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: λέγοντες
  choice: ഇങ്ങനെ … നിലവിളിച്ചു
  rationale: ഗ്രീക്ക് കൃദ്യന്തം മലയാളത്തിലെ സ്വാഭാവികമായ ഉദ്ധരണി-ആമുഖമായി സംയോജിപ്പിക്കുന്നു.
- source_word: Αἶρε
  choice: നീക്കിക്കളയുക
  rationale: ആ വ്യക്തിയെ തങ്ങളുടെ മുമ്പിൽനിന്ന് മാറ്റണമെന്ന ശക്തമായ ആജ്ഞ വ്യക്തമാക്കുന്നു; കൊല്ലുക എന്ന സന്ദർഭസാധ്യതയെ മുഖ്യപാഠത്തിൽ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: τοῦτον
  choice: ഇവനെ
  rationale: യേശുവിലേക്കു ചൂണ്ടുന്ന പുരുഷലിംഗ ഏകവചന നിർദേശസർവനാമത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀπόλυσον
  choice: വിട്ടുതരിക
  rationale: തടവിൽനിന്നു മോചിപ്പിച്ച് അഭ്യർഥിക്കുന്നവർക്കു വിട്ടുകൊടുക്കുക എന്ന ന്യായപരമായ സന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങൾക്കു
  rationale: അഭ്യർഥനയുടെ ഗുണഭോക്താക്കളെ സൂചിപ്പിക്കുന്ന സമ്പ്രദാനിക അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τὸν Βαραββᾶν
  choice: ബറബ്ബാസിനെ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകുകയും വാക്യത്തിലെ കർമവിഭക്തി ചേർക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Αἶρε എന്ന ആജ്ഞയിൽ സന്ദർഭപരമായി വധിക്കണമെന്ന ആവശ്യം ഉൾപ്പെടാമോ
  choice: മുഖ്യപാഠത്തിൽ ‘നീക്കിക്കളയുക’ എന്ന് നൽകി അർഥവ്യാപ്തി നിലനിർത്തി
  alternative: ‘കൊന്നുകളയുക’
  rationale: സന്ദർഭം വധത്തിലേക്കു ചൂണ്ടുന്നുണ്ടെങ്കിലും ഗ്രീക്ക് ക്രിയ നേരിട്ട് ‘കൊല്ലുക’ എന്നു പറയുന്നില്ല; അതിനാൽ അർഥം അതിയായി നിർണ്ണയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്കു സുലഭവുമായ മലയാളം. കൂട്ടത്തിന്റെ ഏകോപിതമായ നിലവിളിയും രണ്ട് ആജ്ഞകളുടെ ശക്തിയും നിലനിർത്തിയിട്ടുണ്ട്.
