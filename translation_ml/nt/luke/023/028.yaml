source:
  edition: SBLGNT
  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരിലേക്കു തിരിഞ്ഞ് പറഞ്ഞു: “യെരൂശലേം പുത്രിമാരേ[a], എന്നെച്ചൊല്ലി കരയേണ്ട; പകരം നിങ്ങളെച്ചൊല്ലിയും നിങ്ങളുടെ മക്കളെച്ചൊല്ലിയും കരയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെരൂശലേമിലെ സ്ത്രീകളേ.” ഗ്രീക്കിൽ അക്ഷരാർഥം “യെരൂശലേം പുത്രിമാരേ” എന്നാണ്; പ്രവാചകശൈലിയിലുള്ള ഈ സംബോധന മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: തിരിഞ്ഞ്
  rationale: στρέφωയുടെ ഭൂതകാല പങ്കാളിത്തരൂപം യേശു സ്ത്രീകളുടെ നേരെ ശാരീരികമായി തിരിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘തിരിഞ്ഞ്’ മുഖ്യക്രിയയോടുള്ള ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: δέ ഇവിടെ മൃദുവായ ആഖ്യാനമാറ്റവും സ്ത്രീകളുടെ വിലാപത്തോടുള്ള യേശുവിന്റെ പ്രതികരണത്തിലെ നേരിയ വൈരുധ്യവും അടയാളപ്പെടുത്തുന്നു.
- source_word: πρὸς αὐτὰς
  choice: അവരുടെ നേരെ
  rationale: accusative-നോടുകൂടിയ πρός ദിശയെ സൂചിപ്പിക്കുന്നു; ‘അവരുടെ നേരെ’ ആ ഭൗതിക ദിശാബോധം വ്യക്തമായി പകർന്നുനൽകുന്നു.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: യെരൂശലേം പുത്രിമാരേ
  rationale: പ്രവാചകശൈലിയിലുള്ള സംബോധനയുടെ കുടുംബപരവും സമൂഹപരവുമായ രൂപകവും തിരുവെഴുത്തുപരമായ പ്രതിധ്വനിയും ‘പുത്രിമാരേ’ നിലനിർത്തുന്നു.
- source_word: μὴ κλαίετε
  choice: കരയേണ്ട
  rationale: μή-യോടുകൂടിയ വർത്തമാനകാല ആജ്ഞാരൂപം വിലക്കിനെ സൂചിപ്പിക്കുന്നു. പ്രവൃത്തി ഇതിനകം ആരംഭിച്ചോ എന്നതിൽ അനാവശ്യമായി തീർപ്പുകൽപ്പിക്കാതെ ‘കരയേണ്ട’ സ്വാഭാവികമായ വിലക്ക് നൽകുന്നു.
- source_word: ἐπ’ ἐμέ
  choice: എന്നെച്ചൊല്ലി
  rationale: κλαίωയ്ക്ക് ശേഷമുള്ള ἐπί കരച്ചിലിന്റെ വിഷയത്തെയോ കാരണത്തെയോ സൂചിപ്പിക്കുന്നു. ‘എന്നെച്ചൊല്ലി’ ഈ അർത്ഥം സ്വാഭാവികമായും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: πλὴν
  choice: പകരം
  rationale: ഇവിടെ πλήν ‘എന്നെച്ചൊല്ലിയല്ല, നിങ്ങളെച്ചൊല്ലി’ എന്ന തിരുത്തൽസ്വഭാവമുള്ള വൈരുധ്യം അവതരിപ്പിക്കുന്നു; ‘പകരം’ അതു വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐφ’ ἑαυτὰς
  choice: നിങ്ങളെച്ചൊല്ലി
  rationale: മുൻപുള്ള ἐπ’ ἐμέ എന്ന പ്രയോഗത്തോടുള്ള സമാന്തരത നിലനിർത്തിക്കൊണ്ട് reflexive അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ τέκνα ὑμῶν
  choice: നിങ്ങളുടെ മക്കൾ
  rationale: τέκνα കുടുംബബന്ധത്തിലുള്ള കുട്ടികളെ സൂചിപ്പിക്കുന്നു; ‘മക്കൾ’ ആ അർത്ഥത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളരൂപമാണ്.
theological_decisions:
- issue: Θυγατέρες Ἰερουσαλήμ എന്ന സംബോധനയുടെ പരിഭാഷ
  choice: യെരൂശലേം പുത്രിമാരേ
  alternative: യെരൂശലേമിലെ സ്ത്രീകളേ
  rationale: ഈ പ്രയോഗം സ്ത്രീകളെ ജനസംഖ്യാപരമായി മാത്രം തിരിച്ചറിയുന്നതല്ല; ഇസ്രായേലിന്റെ തിരുവെഴുത്തുകളിൽ കാണുന്ന പ്രവാചക-സാമൂഹിക സംബോധനയുടെ പ്രതിധ്വനിയും അതിനുണ്ട്. അധികമായ ഉപദേശവ്യാഖ്യാനം ചേർക്കാതെ ആ ഭാരം നിലനിർത്താൻ അക്ഷരാർഥത്തോട് അടുത്ത രൂപം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ളതും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുത്രിമാരേ’ എന്ന രൂപം പ്രവാചകശൈലിയിലെ പ്രതിധ്വനി സംരക്ഷിക്കുന്നു; ‘എന്നെച്ചൊല്ലി/നിങ്ങളെച്ചൊല്ലി’ എന്ന സമാന്തരപ്രയോഗം ഗ്രീക്ക് വാക്യത്തിന്റെ ആവർത്തനഘടന നിലനിർത്തുന്നു.
