  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: ml
  text: അതുകൊണ്ട്, അവനെ ശിക്ഷിച്ചശേഷം[a] ഞാൻ വിട്ടയയ്ക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശിക്ഷാനടപടി സ്വീകരിച്ചശേഷം’ അല്ലെങ്കിൽ ‘ദണ്ഡിപ്പിച്ചശേഷം’. ഈ ക്രിയയ്ക്ക് തിരുത്തൽ ലക്ഷ്യമാക്കിയ ശിക്ഷയെ സൂചിപ്പിക്കാനാകും. ഇവിടെ ഇത് കൂടുതൽ പ്രത്യേകമായി ചമ്മട്ടികൊണ്ട് അടിക്കലിനെ സൂചിപ്പിക്കുന്നുവെന്ന് ചിലർ മനസ്സിലാക്കുന്നുണ്ടെങ്കിലും, ഗ്രീക്ക് പദത്തിന് അതിലും വിശാലമായ അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: ശിക്ഷിച്ചശേഷം
  rationale: കൃതാന്തരൂപം ഇവിടെ കാലസൂചനയോടെ ‘ശിക്ഷിച്ചശേഷം’ എന്നു വരുന്നു. പീലാത്തൊസിന്റെ ന്യായവിചാരണാസന്ദർഭത്തിൽ παιδεύω-യ്ക്ക് ശിക്ഷാത്മകമായ അർഥമാണ് യോജിക്കുന്നത്; എന്നാൽ ശിക്ഷയുടെ കൃത്യമായ രീതി ഗ്രീക്ക് പദം വ്യക്തമാക്കുന്നില്ല.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: പീലാത്തൊസിന്റെ പ്രസ്താവനയിലെ നിഗമനപരമായ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന കർമകാരക സർവനാമം.
- source_word: ἀπολύσω
  choice: ഞാൻ വിട്ടയയ്ക്കും
  rationale: തടങ്കലിലോ നിയമാധീനതയിലോ ഉള്ള ഒരാളെ മോചിപ്പിക്കുക എന്ന ന്യായപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: പീലാത്തൊസിന്റെ നിർദേശത്തിൽ παιδεύω എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ശിക്ഷിച്ചശേഷം
  alternative: ശിക്ഷണനടപടി സ്വീകരിച്ചശേഷം; ചമ്മട്ടികൊണ്ട് അടിച്ചശേഷം
  rationale: വിചാരണാസന്ദർഭം ശിക്ഷാത്മകമായ അർഥം ആവശ്യപ്പെടുന്നു. അതേസമയം ‘ചമ്മട്ടികൊണ്ട് അടിക്കുക’ എന്ന് പരിഭാഷപ്പെടുത്തി ഗ്രീക്ക് പദം പറയുന്നതിലധികം പ്രത്യേകത ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ന്യായപരമായ ഭാഷ ഉപയോഗിച്ചു. ‘ശിക്ഷിച്ചശേഷം’ എന്നത് സന്ദർഭത്തിലെ ദണ്ഡനാർഥം വ്യക്തമാക്കുകയും ശിക്ഷാരീതി അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
