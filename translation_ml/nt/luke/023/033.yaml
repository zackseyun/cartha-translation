id: LUK.23.33
reference: Luke 23:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: ml
  text: അവർ “തലയോട്ടി” എന്നു വിളിക്കപ്പെടുന്ന സ്ഥലത്ത്[a] എത്തിയപ്പോൾ, അവിടെ അവർ അവനെയും കുറ്റവാളികളെയും ക്രൂശിച്ചു—ഒരാളെ വലതുവശത്തും മറ്റെയാളെ ഇടതുവശത്തും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ Κρανίον എന്ന സ്ഥലനാമത്തിന്റെ അക്ഷരാർഥം “തലയോട്ടി” എന്നാണ്; “തലയോട്ടി എന്നു വിളിക്കുന്ന സ്ഥലം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഒരാളെ വലത്തുനിന്നും മറ്റെയാളെ ഇടത്തുനിന്നും.” ഇവിടെ ഇരുവശങ്ങളിലായുള്ള സ്ഥാനമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: എത്തിയപ്പോൾ
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ സ്ഥലത്തേക്കുള്ള വരവും അവിടെ എത്തിച്ചേരുന്നതും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπὶ τὸν τόπον
  choice: സ്ഥലത്ത്
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന ἦλθον എന്ന ക്രിയയോടൊപ്പം ലക്ഷ്യസ്ഥാനത്തെ കാണിക്കുന്നു; മലയാളത്തിൽ ‘സ്ഥലത്ത് എത്തി’ എന്നതാണ് സ്വാഭാവിക പ്രയോഗം.
- source_word: τὸν καλούμενον Κρανίον
  choice: “തലയോട്ടി” എന്നു വിളിക്കപ്പെടുന്ന
  rationale: Κρανίον എന്ന സാധാരണ നാമത്തിന്റെ അർഥം പരിഭാഷപ്പെടുത്തി നിലനിർത്തുന്നു; പരമ്പരാഗത സമാന്തരപാഠങ്ങളിൽനിന്നുള്ള മറ്റൊരു പേരിനെ ഇവിടെ കൊണ്ടുവരുന്നില്ല.
- source_word: ἐσταύρωσαν
  choice: ക്രൂശിച്ചു
  rationale: σταυρόω എന്ന ക്രിയയുടെ കൃത്യവും മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതവുമായ ആധുനിക രൂപമാണിത്; മൂലത്തിൽ വ്യക്തമാക്കാത്ത വിശദാംശങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: κακούργους
  choice: കുറ്റവാളികളെ
  rationale: നിയമലംഘകരെയോ ദുഷ്പ്രവൃത്തിക്കാരെയോ സൂചിപ്പിക്കുന്ന വിശാലമായ പദമാണ്; ‘കള്ളന്മാർ’ പോലുള്ള കൂടുതൽ സവിശേഷമായ അർഥം നൽകി സമാന്തര സുവിശേഷങ്ങളുമായി പൊരുത്തപ്പെടുത്തുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: ഒരാളെ വലതുവശത്തും മറ്റെയാളെ ഇടതുവശത്തും
  rationale: രണ്ടു കുറ്റവാളികളുടെ സ്ഥാനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മൂലഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്ത ‘അവന്റെ’ എന്ന സർവനാമം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: Κρανίον എന്ന സ്ഥലനാമത്തിന്റെ പരിഭാഷ
  choice: തലയോട്ടി
  alternative: തലയോട്ടി എന്ന സ്ഥലം / ക്രാനിയോൻ
  rationale: സ്ഥലനാമമായി ഉപയോഗിച്ചിരിക്കുന്ന പദത്തിന്റെ അർഥം പാഠത്തിൽ പ്രസക്തമാണ്. അതിനാൽ ലിപ്യന്തരണം ചെയ്യാതെ അർഥം പരിഭാഷപ്പെടുത്തുന്നു; സമാന്തരപാഠങ്ങളിൽ കാണുന്ന പരമ്പരാഗത പേരുകൾ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: യേശുവിനോടൊപ്പം ക്രൂശിക്കപ്പെട്ടവരുടെ വിവരണം
  choice: കുറ്റവാളികൾ
  alternative: ദുഷ്പ്രവൃത്തിക്കാർ / കള്ളന്മാർ
  rationale: ലൂക്കോസ് ഉപയോഗിക്കുന്ന κακοῦργοι എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു. ‘കള്ളന്മാർ’ എന്നത് മൂലപദത്തേക്കാൾ സവിശേഷമായതിനാൽ ഒഴിവാക്കുന്നു.
- issue: വലതും ഇടതും ആരെ ആധാരമാക്കിയാണെന്നത്
  choice: ‘അവന്റെ’ എന്ന് ചേർക്കാതെ വലതുവശം, ഇടതുവശം എന്നു മാത്രം
  alternative: ഒരാളെ അവന്റെ വലതുവശത്തും മറ്റെയാളെ അവന്റെ ഇടതുവശത്തും
  rationale: സന്ദർഭത്തിൽ യേശുവിന്റെ ഇരുവശങ്ങളാണ് ഉദ്ദേശ്യമെന്നു വ്യക്തമാണെങ്കിലും ‘അവന്റെ’ എന്ന പദം ഗ്രീക്കിൽ പ്രകടമായി ഇല്ല. അതിനാൽ മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ക്രൂശിച്ചു’ എന്ന സുപരിചിതമായ കൃത്യപദം നിലനിർത്തി; പഴഞ്ചൻ പദങ്ങളും അനാവശ്യമായ വ്യാഖ്യാനവികാസവും ഒഴിവാക്കി.
