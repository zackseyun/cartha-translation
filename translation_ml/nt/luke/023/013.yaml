  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: ml
  text: എന്നാൽ പീലാത്തൊസ് മുഖ്യപുരോഹിതന്മാരെയും ഭരണാധികാരികളെയും ജനത്തെയും വിളിച്ചുകൂട്ടി,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: വ്യക്തിനാമത്തിന്റെ ഗ്രീക്ക് രൂപത്തോട് ചേർന്നുനിൽക്കുന്ന, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തിൽനിന്ന് പീലാത്തോസിന്റെ നടപടിയിലേക്കുള്ള മൃദുവായ മാറ്റവും നേരിയ വൈരുധ്യവും സൂചിപ്പിക്കുന്നു.
- source_word: συγκαλεσάμενος
  choice: വിളിച്ചുകൂട്ടി
  rationale: എല്ലാവരെയും ഒരുമിച്ച് വരുത്തിയെന്ന συγκαλέω എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുവരുന്ന വാക്കുകളോട് ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്നതിനായി അവസാനത്തിൽ അൽപവിരാമം നിലനിർത്തുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഒരേ സമയത്ത് പല മഹാപുരോഹിതന്മാർ എന്നല്ല, പുരോഹിതനേതൃത്വത്തിലുള്ള പ്രമുഖ അധികാരികളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്.
- source_word: ἄρχοντας
  choice: അധികാരികൾ
  rationale: ഭരണപരമോ സാമൂഹികമോ ആയ ഔദ്യോഗിക നേതാക്കളെ സൂചിപ്പിക്കുന്ന വിശാലത നിലനിർത്തുന്നു; 'നേതാക്കൾ' എന്നതിനെക്കാൾ അധികാരസ്ഥാനത്തിന്റെ ഭാവം വ്യക്തമാണ്.
- source_word: λαὸν
  choice: ജനം
  rationale: ഒരു താൽക്കാലിക ജനക്കൂട്ടമായി മാത്രം ചുരുക്കാതെ, കൂട്ടായ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന λαός എന്ന പദത്തിന്റെ അർഥം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് സ്വാഭാവികവുമായ മലയാളം. ഗ്രീക്കിലെ പങ്കാളിക്രിയയുടെ മുൻകാലബന്ധം മലയാളത്തിലെ തുടർച്ചാസ്വഭാവമുള്ള 'വിളിച്ചുകൂട്ടി,' എന്ന രൂപത്തിലൂടെ നിലനിർത്തി; ഈ വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നു.
