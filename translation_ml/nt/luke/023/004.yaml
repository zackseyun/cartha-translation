reference: Luke 23:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: ml
  text: 'അപ്പോൾ പീലാത്തോസ് മുഖ്യപുരോഹിതന്മാരോടും ജനക്കൂട്ടങ്ങളോടും പറഞ്ഞു: “ഈ മനുഷ്യനെതിരെ കുറ്റം ചുമത്താൻ യാതൊരു അടിസ്ഥാനവും ഞാൻ കാണുന്നില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ മനുഷ്യനിൽ ഒരു കുറ്റവും ഞാൻ കാണുന്നില്ല.” ഗ്രീക്കിലെ αἴτιον എന്ന പദത്തിന് “കുറ്റം” എന്നു വരാം; എന്നാൽ ഇവിടെ കുറ്റാരോപണത്തിനുള്ള സാധുവായ അടിസ്ഥാനം എന്ന നിയമപരമായ അർത്ഥമാണ് പ്രധാനമായും ഉള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ലൂക്കോസിന്റെ വിവരണത്തിലെ മൃദുവായ തുടർച്ചയെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ഇവിടെ ശക്തമായ വൈരുധ്യം നിർബന്ധമല്ല.
- source_word: Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: εἶπεν πρὸς
  choice: …ഓട് പറഞ്ഞു
  rationale: അഭിസംബോധനയോടെ പറയുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഒന്നിലധികം മഹാപുരോഹിതന്മാർ എന്നതല്ല, മുതിർന്ന പുരോഹിതനേതൃത്വമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: ὄχλους
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം നിലനിർത്തുന്നു.
- source_word: Οὐδὲν εὑρίσκω
  choice: യാതൊരു … ഞാൻ കാണുന്നില്ല
  rationale: പീലാത്തോസിന്റെ ഇപ്പോഴത്തെ ന്യായവിധിപരമായ വിലയിരുത്തലിന്റെ നിഷേധബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αἴτιον
  choice: കുറ്റം ചുമത്താൻ … അടിസ്ഥാനം
  rationale: നിയമപരമായ സന്ദർഭത്തിൽ കുറ്റാരോപണത്തിന് സാധുവായ കാരണം അഥവാ അടിസ്ഥാനം എന്ന അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: ഈ മനുഷ്യനെതിരെ
  rationale: അക്ഷരാർഥമായ ‘ഈ മനുഷ്യനിൽ’ എന്നതിനെക്കാൾ ന്യായവ്യവഹാരസന്ദർഭത്തിന് യോജിച്ച മലയാളപ്രയോഗം; ചൂണ്ടിക്കാട്ടലും ഏകവചനവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ന്യായവ്യവഹാരഭാഷ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ‘ജനക്കൂട്ടങ്ങൾ’ എന്ന ബഹുവചനം സംരക്ഷിക്കുകയും αἴτιον എന്ന പദത്തിന്റെ നിയമപരമായ ഭാവം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
