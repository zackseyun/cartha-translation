source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: ml
  text: 'എന്നാൽ മറ്റേയാൾ അവനെ ശാസിച്ചുകൊണ്ട് പറഞ്ഞു: “നീയും അതേ ശിക്ഷാവിധിക്കു കീഴിലായിരിക്കെ ദൈവത്തെ ഭയപ്പെടുന്നില്ലേ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നീയും അതേ കുറ്റവിധിക്കു കീഴിലായിരിക്കെ” അല്ലെങ്കിൽ “അതേ ന്യായവിധിയിലായിരിക്കെ.” ഗ്രീക്കിലെ κρίμα എന്ന പദത്തിന് ന്യായവിധി, വിധിനിർണയം, ശിക്ഷാവിധി എന്നീ അർഥങ്ങളാകാം; ഇവിടെ ഇരുവരും പങ്കിടുന്ന ശിക്ഷാഫലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: എന്നാൽ മറ്റേയാൾ ... മറുപടി പറഞ്ഞു
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം ‘എന്നാൽ’ എന്നു നൽകുന്നു; ἀποκριθείς എന്ന കൃദ്‌രൂപവും ἔφη എന്ന പ്രസ്താവനാക്രിയയും സ്വാഭാവിക മലയാളത്തിൽ ഒരൊറ്റ വാക്യഘടനയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐπιτιμῶν αὐτῷ
  choice: അവനെ ശാസിച്ചുകൊണ്ട്
  rationale: ἐπιτιμάω എന്നതിലെ ശക്തമായ തിരുത്തലിന്റെയും കുറ്റപ്പെടുത്തലിന്റെയും ഭാവം ‘ശാസിക്കുക’ സ്വാഭാവികമായി നിലനിർത്തുന്നു; വർത്തമാന കൃദ്‌രൂപം സംസാരത്തോടൊപ്പം നടക്കുന്ന പ്രവൃത്തിയായി നൽകുന്നു.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: നീ ... ദൈവത്തെ ഭയപ്പെടുന്നില്ലേ?
  rationale: οὐδέയുടെ ‘പോലും ഇല്ല’ എന്ന ഊന്നൽ സന്ദർഭത്തിലെ ‘ആയിട്ടും’ ഘടനയിലൂടെ പ്രകടമാക്കുന്നു; φοβέομαι എന്നതിന്റെ നേരിട്ടുള്ള ദൈവഭയ അർഥം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὅτι ἐν τῷ αὐτῷ κρίματι εἶ
  choice: ഇതേ ശിക്ഷാവിധിക്ക് വിധേയനായിട്ടും
  rationale: ὅτι ഇവിടെ ശാസനയുടെ സാഹചര്യമോ കാരണമോ നൽകുന്നു. κρίμαയ്ക്ക് ന്യായവിധി, വിധിനിർണയം, ശിക്ഷാവിധി എന്നീ അർഥസാധ്യതകളുണ്ട്; ക്രൂശീകരണസന്ദർഭത്തിൽ പങ്കിട്ടിരിക്കുന്ന ദണ്ഡവിധിയെ ‘ശിക്ഷാവിധി’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തെ ഭയപ്പെടുക എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘ദൈവത്തെ ഭയപ്പെടുക’ എന്ന ബൈബിൾപ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: ‘ദൈവത്തെ ആദരിക്കുക’ അല്ലെങ്കിൽ ‘ദൈവത്തോട് ഭക്തിയുണ്ടാകുക’
  rationale: മൂലത്തിലെ φοβέομαι ദൈവിക ഉത്തരവാദിത്വബോധം ഉൾക്കൊള്ളുന്ന ഭയത്തെ നേരിട്ട് പറയുന്നു. അതിനെ വെറും ആദരവായി മൃദൂകരിക്കുകയോ സിദ്ധാന്തപരമായി വികസിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: κρίμαയുടെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി
  choice: പ്രധാനവാചകത്തിൽ ‘ശിക്ഷാവിധി’; മറ്റു സാധ്യമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ.
  alternative: ‘ന്യായവിധി’ അല്ലെങ്കിൽ ‘കുറ്റവിധി’
  rationale: ഇവിടെ ഇരുവരും അനുഭവിക്കുന്ന ഒരേ ദണ്ഡഫലമാണ് സന്ദർഭത്തിലെ മുൻനിര അർഥം; എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ വിധി/ന്യായവിധി സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. നേരിട്ടുള്ള ചോദ്യത്തിന്റെ ശാസനാഭാവവും ‘ദൈവത്തെ ഭയപ്പെടുക’ എന്ന ബൈബിൾപ്രയോഗത്തിന്റെ ഭാരവും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
