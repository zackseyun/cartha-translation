id: LUK.23.51
reference: Luke 23:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: ml
  text: അവരുടെ തീരുമാനത്തോടും പ്രവൃത്തിയോടും ഈ മനുഷ്യൻ യോജിച്ചിരുന്നില്ല[a]. യെഹൂദന്മാരുടെ ഒരു പട്ടണമായ അരിമഥ്യയിൽനിന്നുള്ളവനായ അയാൾ ദൈവരാജ്യത്തിനായി കാത്തിരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ആലോചനയ്ക്കും പ്രവൃത്തിക്കും സമ്മതം നൽകിയിരുന്നില്ല.’
    reason: συγκατατίθημι, βουλή, πρᾶξις എന്നീ പദങ്ങൾക്ക് സാധ്യമായ കൂടുതൽ ഔപചാരികവും അക്ഷരാർഥപരവുമായ മറ്റൊരു പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: συγκατατεθειμένος
  choice: യോജിച്ചിരുന്നില്ല
  rationale: ἦν എന്ന ക്രിയയോടുചേർന്ന പൂർണകാല കൃദന്തം, മുമ്പേ കൈക്കൊണ്ടതും നിലനിന്നതുമായ സമ്മതമില്ലായ്മയെ സൂചിപ്പിക്കുന്നു. ‘യോജിച്ചിരുന്നില്ല’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: βουλῇ
  choice: തീരുമാനത്തോട്
  rationale: ഇവിടെ ഭരണസമിതിയെയല്ല, അവരുടെ ആലോചനയിൽനിന്നുണ്ടായ തീരുമാനത്തെയാണ് βουλή സൂചിപ്പിക്കുന്നത്. ‘തീരുമാനം’ സ്ഥാപനപരമായ ‘സമിതി’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: πράξει
  choice: പ്രവൃത്തിയോട്
  rationale: തീരുമാനത്തോടൊപ്പം ചേർന്നുനിൽക്കുന്ന πρᾶξις, അവർ യഥാർഥത്തിൽ ചെയ്ത കാര്യത്തെ സൂചിപ്പിക്കുന്നു. ‘പ്രവൃത്തി’ തീരുമാനവും അതിന്റെ നടപ്പാക്കലും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ ഒരു പട്ടണമായ അരിമഥ്യയിൽനിന്നുള്ളവൻ
  rationale: ഗ്രീക്കിലെ അന്വയസമാനാധികരണ ഘടനയും ‘യെഹൂദന്മാരുടെ പട്ടണം’ എന്ന വിവരണവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘യെഹൂദ്യയിലെ’ എന്നു ഭൂമിശാസ്ത്രപരമായി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: προσεδέχετο
  choice: കാത്തിരിക്കുകയായിരുന്നു
  rationale: അപൂർണകാല ക്രിയ പ്രതീക്ഷയോടെയുള്ള തുടർച്ചയായ കാത്തിരിപ്പിനെ സൂചിപ്പിക്കുന്നു. ഈ രൂപം അതിന്റെ ദൈർഘ്യസ്വഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: ലൂക്കോസിലെ പ്രധാന ദൈവശാസ്ത്രപദത്തിന് മലയാളത്തിൽ വ്യക്തവും പരിചിതവുമായ തുല്യപ്രയോഗം; ‘ദൈവത്തിന്റെ ഭരണം’ എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കത്തിലേക്ക് അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: മുൻവാക്യത്തിലെ യോസേഫിനെ ഊന്നലോടെ വീണ്ടും സൂചിപ്പിക്കുന്ന നിർദേശക സർവനാമത്തിന്റെ ശക്തി വെറും ‘അയാൾ’ എന്നതിനെക്കാൾ നന്നായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ മരണവുമായി ബന്ധപ്പെട്ട നേതാക്കളുടെ നടപടിയിൽ യോസേഫിനുണ്ടായിരുന്ന പങ്ക്
  choice: അവരുടെ തീരുമാനത്തോടും പ്രവൃത്തിയോടും യോജിച്ചിരുന്നില്ല എന്നു മാത്രം വ്യക്തമാക്കുന്നു.
  alternative: അവരുടെ തീരുമാനത്തിന് അനുകൂലമായി വോട്ട് ചെയ്തിരുന്നില്ല എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: അവരുടെ βουλή, πρᾶξις എന്നിവയോടുള്ള യോസേഫിന്റെ സമ്മതമില്ലായ്മയാണ് ഗ്രീക്ക് വ്യക്തമാക്കുന്നത്. ഒരു പ്രത്യേക വോട്ടെടുപ്പ് നടപടിയെക്കുറിച്ച് അത് പറയാത്തതിനാൽ അത്തരം ചരിത്രപുനർനിർമാണം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. ‘ഈ മനുഷ്യൻ’ എന്നത് οὗτος എന്ന പദത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘അയാൾ’ ആവർത്തനം ഒഴിവാക്കി വാക്യം സ്വാഭാവികമാക്കുന്നു. പേരിന്റെ രൂപമായി മലയാള ബൈബിൾവായനക്കാർക്ക് പരിചിതമായ ‘അരിമഥ്യ’ ഉപയോഗിച്ചു.
