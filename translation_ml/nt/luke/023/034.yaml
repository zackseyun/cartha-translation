id: LUK.23.34
reference: Luke 23:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: ml
  text: 'എന്നാൽ യേശു പറഞ്ഞുകൊണ്ടിരുന്നു[a]: “പിതാവേ, ഇവരോടു ക്ഷമിക്കണമേ; ഇവർ എന്താണ് ചെയ്യുന്നതെന്ന് ഇവർ അറിയുന്നില്ല.” അവർ അവന്റെ വസ്ത്രങ്ങൾ പങ്കിട്ടുകൊണ്ട് നറുക്കിട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പിതാവേ, ഇവരോടു ക്ഷമിക്കണമേ; ഇവർ എന്താണ് ചെയ്യുന്നതെന്ന് ഇവർ അറിയുന്നില്ല” എന്ന ഭാഗം ചില കൈയെഴുത്തുപ്രതികളിൽ ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ സംസാരത്തെ സൂചിപ്പിക്കുന്നു; ലളിതമായ ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ഈ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: Πάτερ
  choice: പിതാവേ
  rationale: നേരിട്ടുള്ള സംബോധനമാണ്; ഗ്രീക്കിൽ ഇല്ലാത്ത ഉടമസ്ഥസൂചന ചേർക്കാതെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം.
- source_word: ἄφες
  choice: ക്ഷമിക്കണമേ
  rationale: അപരാധികൾക്കുവേണ്ടി ദൈവത്തോടു നടത്തുന്ന പ്രാർഥനയിൽ ἀφίημι എന്നതിന് സന്ദർഭോചിതമായ അർഥം ‘ക്ഷമിക്കുക’ എന്നതാണ്.
- source_word: αὐτοῖς
  choice: ഇവരോടു
  rationale: സമീപത്തുള്ള, എന്നാൽ കൃത്യമായി നിർവചിക്കപ്പെടാത്ത കൂട്ടത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; ആരെന്നു വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതെ അതിന്റെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: തങ്ങൾ ചെയ്യുന്നത് എന്തെന്ന് ഇവർ അറിയുന്നില്ല
  rationale: οἶδα എന്ന അറിവിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘മനസ്സിലാക്കുന്നില്ല’ എന്ന വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: διαμεριζόμενοι
  choice: പങ്കിട്ടെടുത്ത്
  rationale: യേശുവിന്റെ വസ്ത്രങ്ങൾ ആളുകൾ തങ്ങൾക്കിടയിൽ വിഭജിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἱμάτια
  choice: വസ്ത്രങ്ങൾ
  rationale: വസ്ത്രസാമഗ്രികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ പൊതുപദം.
- source_word: ἔβαλον κλήρους
  choice: നറുക്കിട്ടു
  rationale: വസ്തുക്കൾ ആർക്കു ലഭിക്കണമെന്ന് നറുക്കിലൂടെ തീരുമാനിക്കുന്ന പുരാതന നടപടിയെ മലയാളത്തിൽ സംക്ഷിപ്തവും പതിവുമായ പ്രയോഗത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ / പിന്നെ
  rationale: ആദ്യത്തേത് മുൻസന്ദർഭത്തോടുള്ള മൃദുവായ വ്യത്യാസമോ മാറ്റമോ സൂചിപ്പിക്കുന്നു; രണ്ടാമത്തേത് ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു. സന്ദർഭാനുസൃതമായ മലയാളബന്ധകങ്ങൾ ഉപയോഗിച്ചു.
theological_decisions:
- issue: “പിതാവേ, ഇവരോടു ക്ഷമിക്കണമേ…” എന്ന വാക്യത്തിന്റെ പാഠപ്രാമാണികത
  choice: മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി
  alternative: ചില കൈയെഴുത്തുപ്രതികളിൽ ഈ വാക്യം ഇല്ല
  rationale: SBLGNT ഈ ഭാഗം പാഠഭേദചിഹ്നങ്ങൾക്കുള്ളിൽ മുഖ്യപാഠത്തിൽ അച്ചടിക്കുന്നു. അതിനാൽ വിവർത്തനത്തിൽ ഉൾപ്പെടുത്തുകയും പ്രധാനപ്പെട്ട പാഠഭേദം അടിക്കുറിപ്പിൽ തുറന്നുപറയുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിലും തിരുവെഴുത്താഖ്യാനത്തിന് യോജിച്ച ഗൗരവത്തോടെയും വിവർത്തനം ചെയ്തു. ക്രിയയുടെ അപൂർണഭാവവും സർവനാമത്തിന്റെ നിർവചിക്കപ്പെടാത്ത പരാമർശവും പ്രധാന പാഠഭേദവും സംരക്ഷിച്ചു.
