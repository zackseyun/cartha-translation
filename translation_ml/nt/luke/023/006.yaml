lexical_decisions:
- source_word: Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ആഖ്യാനത്തിലെ നേരിയ വഴിത്തിരിവോ വൈരുധ്യമോ സൂചിപ്പിക്കുന്നതിനാൽ സന്ദർഭത്തിന് സ്വാഭാവികമായ ബന്ധകമായി തിരഞ്ഞെടുത്തു.
- source_word: ἀκούσας
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: പീലാത്തോസിനെ വിശേഷിപ്പിക്കുന്ന ഭൂതകാല കൃതന്തത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാള കാലവാക്യമായി നൽകി; ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർമം മുൻസന്ദർഭത്തിൽനിന്ന് ‘ഇതു’ എന്നു പൂരിപ്പിച്ചു.
- source_word: ἐπηρώτησεν
  choice: ചോദിച്ചു
  rationale: ചോദിക്കുക, അന്വേഷിക്കുക എന്നീ അർഥങ്ങളിൽ ഇവിടെ ഏറ്റവും നേരിട്ടും സ്വാഭാവികവുമായ പദം.
- source_word: εἰ
  choice: ആണോ എന്നു
  rationale: പരോക്ഷചോദ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്ന ഘടന.
- source_word: ὁ ἄνθρωπος
  choice: ആ മനുഷ്യൻ
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ട നാമപദപ്രയോഗം നിലനിർത്തി; യേശു എന്നു വ്യാഖ്യാനിച്ച് പകരംവെച്ചില്ല.
- source_word: Γαλιλαῖός
  choice: ഗലീലക്കാരൻ
  rationale: പ്രദേശപരമായ തിരിച്ചറിയൽ സൂചിപ്പിക്കുന്ന വിശേഷണത്തിന് നേരിട്ടുള്ള മലയാള സമാനപദം.
- source_word: ἐστιν
  choice: ആണ്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലം പരോക്ഷചോദ്യത്തിനുള്ളിലെ മലയാള രൂപമായ ‘ആണോ’യിൽ നിലനിർത്തി; നിർബന്ധമില്ലാത്ത ഭൂതകാലമാറ്റം ഒഴിവാക്കി.
