id: LUK.23.38
reference: Luke 23:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ἐπιγραφὴ ἐπ’ ⸀αὐτῷ· Ὁ βασιλεὺς τῶν Ἰουδαίων ⸀οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: ml
  text: 'അവന്റെ മീതെ ഒരു ലിഖിതവും ഉണ്ടായിരുന്നു: “ഇവൻ യെഹൂദന്മാരുടെ രാജാവ്.”[a][b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അടയാളപ്പലക,” “അറിയിപ്പ്,” അല്ലെങ്കിൽ “എഴുതിയ കുറ്റാരോപണം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവന്റെ മേൽ” അല്ലെങ്കിൽ “അവന്റെ മുകളിൽ.”
    reason: lexical_alternative
  - marker: c
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: “യെഹൂദന്മാരുടെ രാജാവ്—ഇവൻ.”'
    reason: lexical_alternative
  - marker: d
    text: “യെഹൂദന്മാർ” എന്നത് ചില സന്ദർഭങ്ങളിൽ “യെഹൂദ്യർ” എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ക്രൂശിലെ ഈ സ്ഥിരപരിചിതമായ ശീർഷകത്തിൽ “യെഹൂദന്മാർ” എന്നതാണ് പാരമ്പര്യപരവും സന്ദർഭോചിതവുമായ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: ലിഖിതം
  rationale: ക്രൂശിക്കപ്പെട്ട വ്യക്തിയുടെ മീതെ സ്ഥാപിച്ചിരുന്ന എഴുത്തിനെ സൂചിപ്പിക്കുന്നു. ‘ലിഖിതം’ എന്നത് ഔപചാരികത നിലനിർത്തുകയും അതിനെ നിയമപരമായ ‘കുറ്റാരോപണം’ എന്ന് അമിതമായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπ’ αὐτῷ
  choice: അവന്റെ മീതെ
  rationale: ക്രൂശിലെ ഫലകത്തിന്റെ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ἐπί + dative പ്രയോഗം സന്ദർഭാനുസൃതമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘അവന്റെ മേൽ’ എന്ന സാധ്യതയും ഗ്രീക്കിലുണ്ട്.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: ഇവൻ യെഹൂദന്മാരുടെ രാജാവ്
  rationale: ഗ്രീക്കിൽ ക്രിയയില്ലാത്ത നാമവാക്യമാണിത്; οὗτος നൽകുന്ന ചൂണ്ടിക്കാണിക്കൽ ഊന്നൽ ‘ഇവൻ’ നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘ആണ്’ ചേർക്കാതെയും ശീർഷകസ്വഭാവമുള്ള വാക്യം സ്വാഭാവികമാണ്.
- source_word: Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ
  rationale: ക്രൂശിലെ സ്ഥിരപരിചിതമായ രാജകീയ-ജനവിഭാഗീയ ശീർഷകത്തിൽ ‘യെഹൂദന്മാർ’ എന്നത് സന്ദർഭോചിതമാണ്; ചില സന്ദർഭങ്ങളിൽ ‘യെഹൂദ്യർ’ സാധ്യമാണെങ്കിലും ഇവിടെ അത് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചിട്ടില്ല.
- source_word: δὲ καὶ
  choice: ഒരു ലിഖിതവും ഉണ്ടായിരുന്നു
  rationale: മുൻവിവരണത്തോടു മറ്റൊരു വിശദാംശം കൂട്ടിച്ചേർക്കുന്ന additive force ‘-വും’ വഴി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ക്രൂശിലെ എഴുത്തിന്റെ സ്വഭാവം
  choice: യേശുവിനെ ‘യെഹൂദന്മാരുടെ രാജാവ്’ എന്നു സൂചിപ്പിക്കുന്ന ലിഖിതമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  alternative: ഔപചാരിക കുറ്റാരോപണമെന്നോ പരിഹാസമെന്നോ രാഷ്ട്രീയ പ്രസ്താവനയെന്നോ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക
  rationale: വാക്യം ലിഖിതത്തിന്റെ സാന്നിധ്യവും വാക്കുകളും മാത്രമാണ് റിപ്പോർട്ട് ചെയ്യുന്നത്. പരിഹാസം, കുറ്റാരോപണം, മശീഹാ-സാക്ഷ്യം തുടങ്ങിയ വ്യാഖ്യാനങ്ങൾ ചേർക്കാതെ ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരവും ആഖ്യാനപരവുമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ചുരുക്കമുള്ള ശീർഷകശൈലിയും οὗτος എന്ന പദത്തിന്റെ ചൂണ്ടിക്കാണിക്കൽ ഊന്നലും നിലനിർത്തി.
