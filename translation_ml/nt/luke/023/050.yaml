id: LUK.23.50
reference: Luke 23:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: ml
  text: ഇതാ, യോസേഫ് എന്നു പേരുള്ള ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു. അദ്ദേഹം സഭാംഗവും നല്ലവനും നീതിമാനുമായ[a] ഒരു മനുഷ്യനായിരുന്നു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീതിയുള്ളവൻ.”
    reason: δίκαιος എന്ന പദത്തിന് ധാർമികമായ ‘നീതിമാൻ’ എന്ന അർഥത്തോടൊപ്പം ന്യായപരമായ നേരിനെ ഊന്നുന്ന ‘നീതിയുള്ളവൻ’ എന്ന അർഥവും സാധ്യമാണ്.
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: അപ്പോൾ ഇതാ
  rationale: καίയെ ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന ‘അപ്പോൾ’ എന്നും ἰδούവിന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ശക്തിയെ ‘ഇതാ’ എന്നും നിലനിർത്തുന്നു.
- source_word: ἀνὴρ
  choice: ഒരു മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ പ്രായപൂർത്തിയായ ഒരു പുരുഷവ്യക്തിയെയാണ് ἀνήρ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു മനുഷ്യൻ’ എന്നു നൽകുന്നു.
- source_word: ὀνόματι Ἰωσὴφ
  choice: യോസേഫ് എന്നു പേരുള്ള
  rationale: ദത്തിവ് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാള പരിചയപ്പെടുത്തൽശൈലിയിൽ നൽകുന്നു.
- source_word: βουλευτὴς ὑπάρχων
  choice: ന്യായസഭാംഗം
  rationale: βουλευτής ഒരു ഭരണസഭയിലെയോ ന്യായസഭയിലെയോ അംഗത്തെ സൂചിപ്പിക്കുന്നു. പീഡാനുഭവവിവരണത്തിലെ യഹൂദസഭയാണ് സന്ദർഭമെങ്കിലും മൂലപാഠത്തിലില്ലാത്ത ഔദ്യോഗികനാമം ചേർക്കാതെ ‘ന്യായസഭാംഗം’ എന്നു നൽകി.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: നല്ലവനും നീതിമാനുമായ ഒരു മനുഷ്യൻ
  rationale: ലൂക്കോസ് ആവർത്തിക്കുന്ന ἀνήρ ഒഴിവാക്കാതെ നിലനിർത്തി. ἀγαθός എന്നതിന് ‘നല്ലവൻ’ എന്നും ധാർമികവും ദൈവബന്ധപരവുമായ അർഥവ്യാപ്തിയുള്ള δίκαιος എന്നതിന് ‘നീതിമാൻ’ എന്നും നൽകി.
theological_decisions:
- issue: വ്യക്തിവിവരണത്തിലെ δίκαιος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നീതിമാൻ
  alternative: ന്യായവാൻ
  rationale: δίκαιος ധാർമിക നേരിനെയും ന്യായപരമായ സത്യസന്ധതയെയും സൂചിപ്പിക്കാം. ഇവിടെ യോസേഫിന്റെ സദാചാരപരമായ നേരാണ് പ്രശംസിക്കപ്പെടുന്നത്; സാങ്കേതികമായ ഉപദേശാർഥം ചുമത്താതെ വിശാലമായ വേദപുസ്തകപ്രതിധ്വനി നിലനിർത്താൻ ‘നീതിമാൻ’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘അപ്പോൾ ഇതാ’ എന്ന പ്രയോഗം ലൂക്കോസിന്റെ ശ്രദ്ധാകർഷകമായ ആഖ്യാനചിഹ്നം നിലനിർത്തുന്നു; അവസാനത്തെ ദീർഘരേഖ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി തുടരുന്നതു സൂചിപ്പിക്കുന്നു.
