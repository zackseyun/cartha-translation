    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: സൂര്യൻ പ്രകാശിക്കാതായപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയെ സ്വാഭാവികമായ ഒരു കാലസൂചക ഉപവാക്യമായി നൽകി. ἐκλείπω എന്ന ക്രിയയുടെ ‘നിലയ്ക്കുക/പരാജയപ്പെടുക’ എന്ന അടിസ്ഥാനഭാവം നിലനിർത്തിക്കൊണ്ട്, പ്രത്യേകമായ ഒരു ജ്യോതിശ്ശാസ്ത്രപ്രക്രിയയാണെന്ന് നിർണയിക്കാതെ സന്ദർഭത്തിലെ ഇരുട്ടിനെ വ്യക്തമാക്കുന്നു.
- source_word: ἐσχίσθη
  choice: കീറിപ്പോയി
  rationale: തുണികൊണ്ടുള്ള തിരശ്ശീലയെക്കുറിച്ച് σχίζω എന്ന ക്രിയയുടെ പാസീവ് അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി നൽകിയിട്ടില്ല
  rationale: ഇവിടെ δέ മൃദുവായ ബന്ധകമാണ്. ‘-പ്പോൾ’ എന്ന ഉപവാക്യബന്ധവും തുടർന്നുള്ള മുഖ്യവാക്യവും ആ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള ശക്തമായ വൈരുധ്യസൂചകം ചേർത്തിട്ടില്ല.
- source_word: τὸ καταπέτασμα
  choice: തിരശ്ശീല
  rationale: തൂക്കിയിട്ട വിഭജനവസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന വായനാസൗകര്യമുള്ള ആധുനിക മലയാളപദം; പരമ്പരാഗതമായ ‘മറശ്ശീല’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: τοῦ ναοῦ
  choice: ദേവാലയത്തിലെ
  rationale: ναός ഇവിടെ വിശുദ്ധമന്ദിരഭാഗത്തെ സൂചിപ്പിക്കാമെങ്കിലും, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ ‘ദേവാലയം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു.
- source_word: μέσον
  choice: നടുവിൽ
  rationale: കീറൽ സംഭവിച്ച സ്ഥാനം/രീതി നേരിട്ട് നൽകുന്നു; ‘നടുവിലൂടെ’ എന്നും ഫലത്തെ മുൻനിർത്തി ‘രണ്ടായി’ എന്നും വിവർത്തനം ചെയ്യാം.
theological_decisions:
- issue: സൂര്യനെ സംബന്ധിച്ച ἐκλιπόντος എന്നതിന്റെ അർഥം
  choice: സൂര്യൻ പ്രകാശിക്കാതായപ്പോൾ
  alternative: സൂര്യൻ ഇരുണ്ടുപോയപ്പോൾ; സൂര്യഗ്രഹണം ഉണ്ടായപ്പോൾ
  rationale: യേശുവിന്റെ മരണസമയത്തെ ഇരുട്ട് വ്യക്തമാക്കുന്നു; എന്നാൽ ഗ്രീക്ക് പദം നിർബന്ധിക്കാത്ത ഒരു സാങ്കേതിക ജ്യോതിശ്ശാസ്ത്രവ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചുമത്തുന്നില്ല.
- issue: καταπέτασμα എന്ന ദേവാലയവിഭജനവസ്ത്രത്തിന്റെ വിവർത്തനം
  choice: തിരശ്ശീല
  alternative: മറശ്ശീല
  rationale: സംഭവത്തിന്റെ ദൈവശാസ്ത്രപ്രാധാന്യം കുറയ്ക്കാതെ, സാധാരണ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ പദം തിരഞ്ഞെടുത്തു; പരമ്പരാഗത പദം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ചുരുക്കവും സംഭവക്രമവും നിലനിർത്തി; സാങ്കേതികമോ സഭാപരമായോ അനാവശ്യമായ പദാവലി ഒഴിവാക്കി.
