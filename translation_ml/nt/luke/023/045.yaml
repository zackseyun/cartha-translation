  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: ml
  text: സൂര്യൻ പ്രകാശിക്കാതായപ്പോൾ[a], ദേവാലയത്തിലെ തിരശ്ശീല[b] നടുവിൽ കീറിപ്പോയി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൂര്യൻ ഇരുണ്ടുപോയപ്പോൾ.’ ‘സൂര്യഗ്രഹണം ഉണ്ടായപ്പോൾ’ എന്നും ചിലർ വിവർത്തനം ചെയ്യുന്നു; എന്നാൽ ഗ്രീക്ക് പദം അത്ര പ്രത്യേകമായ ഒരു ജ്യോതിശ്ശാസ്ത്രവ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ദേവാലയത്തിലെ മറശ്ശീല.’
    reason: lexical_alternative
  - marker: c
