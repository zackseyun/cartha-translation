id: LUK.23.8
reference: Luke 23:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: ml
  text: ഹെരോദാവ് യേശുവിനെ കണ്ടപ്പോൾ അത്യന്തം സന്തോഷിച്ചു. യേശുവിനെക്കുറിച്ച് കേട്ടിരുന്നതിനാൽ[a] ഏറെക്കാലമായി അദ്ദേഹത്തെ കാണാൻ അയാൾ ആഗ്രഹിച്ചിരുന്നു; അദ്ദേഹം ചെയ്യുന്ന ഏതെങ്കിലും ഒരു അടയാളം[b] കാണാമെന്നും പ്രതീക്ഷിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അദ്ദേഹത്തെക്കുറിച്ചുള്ള വാർത്തകൾ കേട്ടുകൊണ്ടിരുന്നതിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ വർത്തമാനകാല infinitive ആവർത്തിച്ചോ തുടർന്നോ ലഭിച്ച വിവരങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഏതെങ്കിലും ഒരു അത്ഭുതം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ σημεῖον എന്ന പദത്തിന്റെ അക്ഷരാർഥം ‘അടയാളം’ എന്നാണ്; പ്രത്യേക പ്രാധാന്യമുള്ള ഒരു അത്ഭുതപ്രവൃത്തിയെയും അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἡρῴδης
  choice: ഹെരോദാവ്
  rationale: δέ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ലഘു ബന്ധകമാണ്. മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ തുടർച്ച സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘ഇപ്പോൾ’ പോലൊരു വ്യക്തമായ കാലസൂചകം ചേർത്തിട്ടില്ല.
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: യേശുവിനെ കണ്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle ഇവിടെ കാലബന്ധം സൂചിപ്പിക്കുന്നു; ‘കണ്ടപ്പോൾ’ അത് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐχάρη λίαν
  choice: അത്യന്തം സന്തോഷിച്ചു
  rationale: χαίρωയുടെ സന്തോഷിക്കുക എന്ന അർഥവും λίαν നൽകുന്ന ശക്തമായ തീവ്രതയും ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξ ἱκανῶν χρόνων
  choice: ഏറെക്കാലമായി
  rationale: ഒരു ദീർഘകാലയളവിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്; ‘വർഷങ്ങളായി’ എന്നു പറഞ്ഞ് ഉറവിടത്തിൽ ഇല്ലാത്ത കൃത്യത ചേർക്കുന്നില്ല.
- source_word: θέλων ἰδεῖν αὐτόν
  choice: അദ്ദേഹത്തെ കാണാൻ അയാൾ ആഗ്രഹിച്ചിരുന്നു
  rationale: ἦν + θέλων എന്ന തുടരുന്ന ആഗ്രഹത്തിന്റെ ഭാവം ‘ആഗ്രഹിച്ചിരുന്നു’ നൽകുന്നു. സർവനാമങ്ങൾ യേശുവിനെയും ഹെരോദാവിനെയും ആശയക്കുഴപ്പമില്ലാതെ വേർതിരിക്കുന്നു.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: യേശുവിനെക്കുറിച്ച് കേട്ടിരുന്നതിനാൽ
  rationale: διάയോടുകൂടിയ articular infinitive കാരണം പ്രകടിപ്പിക്കുന്നു. present infinitive തുടരുന്നോ ആവർത്തിച്ചോ ഉണ്ടായ കേൾവിയെ സൂചിപ്പിക്കാമെങ്കിലും, ‘കേട്ടിരുന്നതിനാൽ’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ മുൻകാല പശ്ചാത്തലം നൽകുന്നു.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: ഏതെങ്കിലും ഒരു അടയാളം കാണാമെന്നും പ്രതീക്ഷിച്ചിരുന്നു
  rationale: ἐλπίζωയിലെ പ്രതീക്ഷയും σημεῖον എന്ന പദത്തിന്റെ വിശാലമായ ‘അടയാളം’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു; ‘അത്ഭുതം’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: അദ്ദേഹം ചെയ്യുന്ന
  rationale: ὑπό സൂചിപ്പിക്കുന്ന കർത്താവിനെ നിലനിർത്തിക്കൊണ്ട്, ഗ്രീക്കിലെ passive participle മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായ കർത്തരി പ്രയോഗമായി നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: σημεῖον എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: അടയാളം
  alternative: അത്ഭുതം
  rationale: സന്ദർഭത്തിൽ അത്ഭുതപ്രവൃത്തി ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെങ്കിലും, σημεῖον ഒരു പ്രവൃത്തിയുടെ സൂചനാത്മക പ്രാധാന്യവും ഉൾക്കൊള്ളുന്നു. അതിനാൽ പാഠത്തിൽ വിശാലമായ പദം നിലനിർത്തി മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. യേശുവിനെ സൂചിപ്പിക്കാൻ ‘അദ്ദേഹം’, ഹെരോദാവിനെ സൂചിപ്പിക്കാൻ ‘അയാൾ’ എന്നിവ ഉപയോഗിച്ച് സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കി. നീണ്ട ഗ്രീക്ക് വാക്യം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; കാരണം, ദൈർഘ്യം, പ്രതീക്ഷ എന്നീ ബന്ധങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്.
