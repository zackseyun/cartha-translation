id: LUK.23.31
reference: Luke 23:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: ml
  text: എന്തെന്നാൽ, പച്ചയായ മരത്തിൽ അവർ ഇതൊക്കെ ചെയ്യുന്നുവെങ്കിൽ,[a][b] ഉണങ്ങിയ മരത്തിൽ എന്തു സംഭവിക്കും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഈർപ്പമുള്ള മരത്തിൽ … ഉണങ്ങിയ മരത്തിൽ.’ ഗ്രീക്കിലെ ὑγρός എന്ന പദത്തിന് ‘ഈർപ്പമുള്ള’ എന്നും അർഥമുണ്ട്; ഉണങ്ങിയ മരത്തോടുള്ള വൈരുധ്യത്തിൽ ‘പച്ചയായ മരം’ എന്ന പ്രയോഗമാണ് ഇവിടെ സ്വീകരിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: 'ഇത് കുറവിൽനിന്ന് കൂടുതലിലേക്കുള്ള ഒരു താരതമ്യമായിരിക്കാം: പച്ചയായ മരത്തിൽ ഇതൊക്കെ ചെയ്യുന്നെങ്കിൽ, ഉണങ്ങിയ മരത്തിൽ എന്തായിരിക്കും സംഭവിക്കുക? എന്നാൽ ‘പച്ചയായ മരം’, ‘ഉണങ്ങിയ മരം’ എന്നിവയുടെ കൃത്യമായ സൂചിതർ വാക്യം വ്യക്തമാക്കുന്നില്ല.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വിലാപത്തിനും മുന്നറിയിപ്പിനും കാരണം നൽകുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: പച്ചമരത്തോട്
  rationale: ὑγρός–ξηρός വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട്, കത്താൻ പ്രയാസമുള്ള ഈർപ്പമുള്ളതോ പച്ചയായതോ ആയ മരത്തിന്റെ ദൃശ്യരൂപം സ്വാഭാവികമായി നൽകുന്നു. ἐν ഇവിടെ ബന്ധപ്പെട്ട സാഹചര്യമോ വിഷയമോ സൂചിപ്പിക്കുന്നതിനാൽ ‘-ത്തോട്’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: ὑγρῷ
  choice: പച്ച
  rationale: പദത്തിന് ‘ഈർപ്പമുള്ള’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും ഉണങ്ങിയ മരത്തോടുള്ള വൈരുധ്യത്തിൽ ‘പച്ചമരം’ എന്നത് മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: ξύλῳ
  choice: മരം
  rationale: ξύλον മരം, മരക്കഷണം, വൃക്ഷം എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ ദൃഷ്ടാന്തത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്താൻ പൊതുവായ ‘മരം’ സ്വീകരിച്ചു.
- source_word: ταῦτα ποιοῦσιν
  choice: അവർ ഇങ്ങനെ ചെയ്യുന്നു
  rationale: ബഹുവചന സൂചകവും നിർദിഷ്ടമല്ലാത്ത കർത്താവും നിലനിർത്തുന്നു; പ്രവൃത്തികളുടെ കൃത്യമായ പരിധി വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ἐν τῷ ξηρῷ
  choice: ഉണങ്ങിയതിനോട്
  rationale: ആദ്യത്തെ ‘മരം’ ആവർത്തിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അതിലേക്കു തിരിച്ചുചൂണ്ടുകയും പച്ച–ഉണങ്ങിയ വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τί γένηται
  choice: എന്തു സംഭവിക്കും?
  rationale: പ്രതീക്ഷിക്കപ്പെടുന്ന ഫലത്തെക്കുറിച്ചുള്ള ഗൗരവമുള്ള അലങ്കാരചോദ്യം സമകാലിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: പച്ചമരവും ഉണങ്ങിയ മരവും എന്ന രൂപകം
  choice: രൂപകത്തെ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി.
  alternative: ‘പച്ചമരം’ യേശുവിനെയും ‘ഉണങ്ങിയ മരം’ യെരൂശലേമിനെയോ അതിലെ ജനത്തെയോ സൂചിപ്പിക്കുന്നു എന്ന് വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ചെറുതിൽനിന്ന് വലുതിലേക്കുള്ള ന്യായവിധിയുടെ പൊതുവായ പഴമൊഴിയായി നേരിട്ട് വ്യാഖ്യാനിക്കുക.
  rationale: രൂപകത്തിന്റെ കൃത്യമായ സൂചിതർ ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ വരാനിരിക്കുന്ന കഠിനഫലത്തിന്റെ സൂചന നിലനിർത്തിക്കൊണ്ട് ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പച്ചമരം/ഉണങ്ങിയ മരം’ എന്ന ഓർമിക്കാവുന്ന ദൃശ്യവൈരുധ്യം നിലനിർത്തി; രൂപകത്തിന്റെ അർഥം മുഖ്യപാഠത്തിൽ അനാവശ്യമായി വിശദീകരിച്ചിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
