  source_fidelity: The draft accurately preserves the two contrasted actions, the causal sense of διὰ, the ongoing sense of ᾐτοῦντο, and the volitional force of τῷ θελήματι αὐτῶν. However, ‘തടവിലേക്കു’ denotes entry into a state of imprisonment more readily than the concrete φυλακή (‘prison’); ‘തടവറയിലേക്കു’ better represents the Greek expression while retaining the vivid force of βεβλημένον.
  naturalness: The sentence is generally clear and natural in modern standard Malayalam. ‘തടവറയിലേക്കു തള്ളപ്പെട്ടിരുന്ന’ is more concrete and idiomatic than ‘തടവിലേക്കു തള്ളപ്പെട്ടിരുന്ന.’
