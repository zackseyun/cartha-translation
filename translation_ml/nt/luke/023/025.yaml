reference: Luke 23:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: ml
  text: കലാപവും കൊലപാതകവും നിമിത്തം തടവറയിലേക്കു തള്ളപ്പെട്ടിരുന്ന, അവർ ആവശ്യപ്പെട്ടുകൊണ്ടിരുന്ന ആ മനുഷ്യനെ പീലാത്തോസ് വിട്ടയച്ചു[a]; എന്നാൽ യേശുവിനെ അവരുടെ ഇഷ്ടത്തിന് വിട്ടുകൊടുത്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തടവിലാക്കപ്പെട്ടിരുന്ന.’ ഗ്രീക്കിൽ കൂടുതൽ ദൃശ്യമായ പ്രയോഗം ‘തടവറയിലേക്കു തള്ളപ്പെട്ടിരുന്ന’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവർ ആഗ്രഹിച്ചതിന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: വിട്ടയച്ചു
  rationale: തടവുകാരനെ സ്വതന്ത്രനാക്കുന്ന നിയമപരവും കാവൽബന്ധിതവുമായ സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: διὰ στάσιν καὶ φόνον
  choice: കലാപവും കൊലപാതകവും നിമിത്തം
  rationale: διά + accusative കാരണത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ στάσις ഒരു സാധാരണ തർക്കമല്ല, ഭരണവിരുദ്ധമായ കലാപമാണ്.
- source_word: βεβλημένον εἰς φυλακήν
  choice: തടവിലേക്കു തള്ളപ്പെട്ടിരുന്ന
  rationale: βάλλω എന്നതിന്റെ ദൃശ്യമായ ശക്തി ‘തള്ളപ്പെട്ട’ എന്നതിലൂടെ നിലനിർത്തുന്നു; perfect passive participle മുൻപ് സംഭവിച്ച് തുടരുന്ന തടവുസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു.
- source_word: ὃν ᾐτοῦντο
  choice: അവർ ആവശ്യപ്പെട്ടുകൊണ്ടിരുന്ന
  rationale: Imperfect രൂപത്തിലെ തുടരുന്ന അഭ്യർഥനയെ പ്രകടമാക്കുന്നു; ‘നിർബന്ധിച്ചു ചോദിച്ചു’ എന്നതുപോലെ അനാവശ്യമായ തീവ്രത ചേർക്കുന്നില്ല.
- source_word: παρέδωκεν
  choice: വിട്ടുകൊടുത്തു
  rationale: παραδίδωμι ഇവിടെ മറ്റുള്ളവരുടെ അധികാരത്തിനോ തീരുമാനത്തിനോ ഏല്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ന്യായവിധി കൈമാറ്റത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: τῷ θελήματι αὐτῶν
  choice: അവരുടെ ഇഷ്ടത്തിനു
  rationale: θέλημα എന്നതിലെ ഇച്ഛയുടെയും തീരുമാനത്തിന്റെയും ഭാരം സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: δὲ ... δὲ
  choice: ആഖ്യാനപുരോഗതി ... എന്നാൽ
  rationale: ആദ്യ δέ മലയാളവാക്യക്രമത്തിൽ പ്രത്യേക പദമില്ലാതെ ആഖ്യാനപുരോഗതിയായി പ്രതിഫലിക്കുന്നു; രണ്ടാമത്തേത് യേശുവുമായുള്ള വ്യക്തമായ വൈരുധ്യം സൂചിപ്പിക്കാൻ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: വിട്ടയക്കപ്പെട്ട കലാപകാരിയും യേശുവും തമ്മിലുള്ള വൈരുധ്യം പ്രായശ്ചിത്തസംബന്ധമായ വ്യാഖ്യാനം ചേർക്കാതെ അവതരിപ്പിക്കൽ
  choice: ആഖ്യാനത്തിലെ വൈരുധ്യം ‘എന്നാൽ’ എന്നതിലൂടെ വ്യക്തമാക്കി; പകരംവെക്കൽ സംബന്ധിച്ച വിശദീകരണം ചേർത്തില്ല.
  alternative: ‘യേശുവിനു പകരം’ പോലുള്ള വ്യാഖ്യാനാത്മക വികസനം
  rationale: വാക്യം പീലാത്തോസിന്റെ നടപടിയും ജനത്തിന്റെ ഇഷ്ടവും വിവരിക്കുന്നു. വിശാലമായ പീഡാനുഭവവിവരണത്തിൽനിന്ന് പകരംവെക്കൽ പ്രമേയം നിഗമനം ചെയ്യാമെങ്കിലും, ഈ വാക്യം അതു നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘തടവിലേക്കു തള്ളപ്പെട്ടിരുന്ന’ എന്നത് മൂലത്തിലെ ദൃശ്യത നിലനിർത്തുന്നു; ‘അവരുടെ ഇഷ്ടത്തിനു’ എന്നത് θέλημα എന്ന പദത്തിന്റെ ഇച്ഛാഭാരം സംരക്ഷിക്കുന്നു. വ്യക്തതയ്ക്കായി വിഷയമായ പീലാത്തോസിന്റെ പേര് ചേർത്തിട്ടുണ്ട്; അടുത്ത സന്ദർഭത്തിൽ അത് വ്യക്തമായി തിരിച്ചറിയപ്പെടുന്നു.
