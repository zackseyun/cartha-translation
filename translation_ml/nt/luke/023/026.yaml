id: LUK.23.26
reference: Luke 23:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: ml
  text: അവർ അവനെ കൊണ്ടുപോകുമ്പോൾ, നാട്ടിൻപുറത്തുനിന്ന്[a] വരികയായിരുന്ന കുറേനക്കാരനായ ശിമോൻ എന്നൊരാളെ പിടിച്ച്, യേശുവിന്റെ പിന്നാലെ ചുമക്കാനായി കുരിശ്[b] അയാളുടെമേൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വയലിൽനിന്ന്.’ ഗ്രീക്ക് പദം ഒരു വയലിനെ പ്രത്യേകമായി സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ നഗരത്തിനു പുറത്തുള്ള നാട്ടിൻപുറത്തെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ചിലർ ഇവിടെ ‘കുരിശ്’ എന്നത് കൂടുതൽ പ്രത്യേകമായി ‘കുരിശിന്റെ കുറുകെയുള്ള തടി’ എന്നു മനസ്സിലാക്കുന്നു. എന്നാൽ ഗ്രീക്ക് പാഠം പറയുന്നത് ‘കുരിശ്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: കൊണ്ടുപോകുമ്പോൾ
  rationale: ἀπάγω എന്ന ക്രിയയുടെ ‘കാവലിൽ കൂട്ടിക്കൊണ്ടുപോകുക/കൊണ്ടുപോകുക’ എന്ന അർഥം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπιλαβόμενοι
  choice: പിടിച്ച്
  rationale: ഒരാളെ ബലമായി പിടിച്ചെടുക്കുന്ന പ്രവൃത്തി സന്ദർഭത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘കൈപിടിച്ച്’ എന്ന മൃദുവായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: കുറേനക്കാരനായ ശിമോൻ എന്നൊരാളെ
  rationale: τινα നൽകുന്ന അനിശ്ചിത പരിചയപ്പെടുത്തൽ ‘എന്നൊരാളെ’ എന്നതിലൂടെ നിലനിർത്തുകയും Κυρηναῖον എന്ന സ്ഥലബന്ധം ‘കുറേനക്കാരനായ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: നാട്ടിൻപുറത്തുനിന്ന് വരികയായിരുന്ന
  rationale: ἀγρός എന്നതിന് വയൽ എന്നും നഗരത്തിനു പുറത്തുള്ള നാട്ടിൻപുറം എന്നും അർഥമാകാം. മുഖ്യപാഠത്തിൽ വിശാലമായ അർഥം സ്വീകരിച്ച് മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: കുരിശ് അയാളുടെമേൽ വെച്ചു
  rationale: ἐπιτίθημι സൂചിപ്പിക്കുന്ന, ഒരാളുടെമേൽ ഭാരം വെക്കുന്ന പ്രവൃത്തി നേരിട്ട് പകർത്തുന്നു.
- source_word: τὸν σταυρὸν
  choice: കുരിശ്
  rationale: σταυρός എന്ന പൊതുപദത്തെ അതിന്റെ നേരിട്ടുള്ള അർഥത്തിൽ നൽകുന്നു; മൂലപാഠം വ്യക്തമാക്കാത്ത ‘കുരിശിന്റെ കുറുകെയുള്ള തടി’ എന്ന ചരിത്രപരമായ പുനർനിർമാണം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: φέρειν ὄπισθεν τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ പിന്നാലെ ചുമക്കാനായി
  rationale: φέρειν എന്നതിന്റെ ഭൗതികമായ ചുമക്കൽ അർഥവും ὄπισθεν എന്നതിന്റെ സ്ഥലപരമായ ‘പിന്നാലെ’ എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ക്രൂശീകരണവിവരണത്തിൽ σταυρός എന്നത് കൂടുതൽ പ്രത്യേകമായി ‘കുരിശിന്റെ കുറുകെയുള്ള തടി’ എന്നു പരിഭാഷപ്പെടുത്തണമോ എന്നത്
  choice: കുരിശ്
  alternative: കുരിശിന്റെ കുറുകെയുള്ള തടി
  rationale: ഗ്രീക്ക് പാഠത്തിൽ പ്രത്യേകമായി കുറുകെയുള്ള തടി എന്നർഥമുള്ള പദമല്ല, σταυρός എന്ന പൊതുപദമാണ്. അതിനാൽ ചരിത്രപരമായ ഒരു പുനർനിർമാണം പാഠത്തിൽ ചേർക്കാതെ നേരിട്ടുള്ള അർഥം സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കുറേനക്കാരനായ’ എന്ന രൂപം സ്ഥലബന്ധം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു; ‘എന്നൊരാളെ’ τιναയുടെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു. ഓരോ അടിക്കുറിപ്പ് ചിഹ്നവും അതത് പദത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
