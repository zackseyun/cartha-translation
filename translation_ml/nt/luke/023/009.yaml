- from: അതിനാൽ അവൻ യേശുവിനോട് ഏറെ നേരം പലതും ചോദിച്ചുകൊണ്ടിരുന്നു[a]; എന്നാൽ യേശു അവനോട് ഒന്നും ഉത്തരം പറഞ്ഞില്ല.
  to: അവൻ യേശുവിനോട് വളരെ നേരം ചോദിച്ചുകൊണ്ടിരുന്നു[a]; എന്നാൽ യേശു അവനോട് ഒന്നും ഉത്തരം പറഞ്ഞില്ല.
  rationale: The revision removes the unwarranted causal force of അതിനാൽ and avoids specifying that Herod asked about many different matters. It preserves the imperfect’s sustained action, the contrast introduced by the second δέ, and Jesus’ total silence.
