  text: ἐπηρώτα δὲ αὐτὸν ἐν λόγοις ἱκανοῖς· αὐτὸς δὲ οὐδὲν ἀπεκρίνατο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/009.yaml
  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: ml
  text: അവൻ യേശുവിനോട് വളരെ നേരം ചോദിച്ചുകൊണ്ടിരുന്നു[a]; എന്നാൽ യേശു അവനോട് ഒന്നും ഉത്തരം പറഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അനേകം/വളരെയധികം വാക്കുകളാൽ.’ ‘അനേകം ചോദ്യങ്ങളോടെ’ എന്നും മനസ്സിലാക്കാം. ഗ്രീക്ക് പ്രയോഗം ദീർഘമായി തുടർന്ന വാചിക ചോദ്യംചെയ്യലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ ചോദ്യംചെയ്യലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം അതു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: അതിനാൽ / എന്നാൽ
  rationale: ആദ്യത്തെ δέ കഥയുടെ സ്വാഭാവികമായ മുന്നേറ്റം സൂചിപ്പിക്കാൻ ‘അതിനാൽ’ എന്നും രണ്ടാമത്തേത് ഹെരോദാവിന്റെ ചോദ്യംചെയ്യലും യേശുവിന്റെ മൗനവും തമ്മിലുള്ള വൈരുധ്യം കാണിക്കാൻ ‘എന്നാൽ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: ἐν λόγοις ἱκανοῖς
  choice: ഏറെ നേരം പലതും
  rationale: പദാനുപദമായി ‘അനേകം വാക്കുകളിൽ’ എന്നാകാമെങ്കിലും, സന്ദർഭത്തിൽ ദീർഘവും വിപുലവുമായ വാചിക ചോദ്യംചെയ്യലാണ് ഉദ്ദേശിക്കുന്നത്. ‘ഏറെ നേരം പലതും’ എന്നത് ദൈർഘ്യവും ചോദ്യങ്ങളുടെ വ്യാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ കൈമാറുന്നു.
- source_word: αὐτὸν / αὐτός
  choice: യേശുവിനോട് / യേശു
  rationale: മുൻസന്ദർഭത്തിലെ സൂചിത വ്യക്തി യേശുവാണെന്ന് വായനക്കാരന് ഉടൻ വ്യക്തമാകാനും, ആവർത്തിച്ചുള്ള ‘അവൻ’ മൂലമുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കാനും പേര് ഉപയോഗിച്ചു; ഗ്രീക്കിലെ ഊന്നൽ ‘എന്നാൽ’ എന്ന വൈരുധ്യബന്ധത്തിലൂടെയും നിലനിർത്തുന്നു.
- source_word: οὐδὲν ἀπεκρίνατο αὐτῷ
  choice: അവനോട് ഒന്നും ഉത്തരം പറഞ്ഞില്ല
  rationale: ഗ്രീക്കിലെ നിഷേധത്തിന്റെ സമ്പൂർണതയും പരോക്ഷകർമ്മവും നേരായ, സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
