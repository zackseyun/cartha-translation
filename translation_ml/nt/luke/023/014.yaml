    rationale: ഗ്രീക്കിലെ aorist participle ἀνακρίνας മുഖ്യക്രിയയായ ‘കണ്ടില്ല’ എന്നതിനു മുമ്പുള്ള പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; concessive അർഥം വ്യക്തമായി സൂചിപ്പിക്കുന്നില്ല. ‘വിചാരണ ചെയ്തശേഷം’ എന്നത് അനാവശ്യമായ വിരുദ്ധസൂചന ഒഴിവാക്കുന്നു.
  - severity: low
