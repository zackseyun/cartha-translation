  rationale: ഗ്രീക്കിൽ ഇല്ലാത്ത concessive സൂചന ഒഴിവാക്കി participle-ന്റെ കാലക്രമബന്ധം ‘വിചാരണ ചെയ്തശേഷം’ എന്നു പകർത്തി. ആരോപണ-നിയമസന്ദർഭം കൂടുതൽ വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ‘എന്നു ആരോപിച്ച്’ ഉപയോഗിച്ചു. മറ്റു തിരഞ്ഞെടുപ്പുകൾ ഉറവിടപാഠത്തിന്റെയും ഇംഗ്ലീഷ് audit trail-ന്റെയും അർഥപരിധി നിലനിർത്തുന്നു.
