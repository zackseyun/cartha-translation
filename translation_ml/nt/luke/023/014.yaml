id: LUK.23.14
reference: Luke 23:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ജനത്തെ വഴിതെറ്റിക്കുന്നവൻ[a] എന്നു ആരോപിച്ച് നിങ്ങൾ ഈ മനുഷ്യനെ എന്റെ അടുക്കൽ കൊണ്ടുവന്നു. ഇതാ, നിങ്ങളുടെ മുമ്പിൽവെച്ച് ഇയാളെ വിചാരണ ചെയ്തശേഷം, നിങ്ങൾ ഇയാൾക്കെതിരെ ഉന്നയിക്കുന്ന കുറ്റങ്ങൾക്ക് ആധാരമായ ഒന്നും ഞാൻ ഈ മനുഷ്യനിൽ കണ്ടില്ല.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജനത്തെ പിന്തിരിപ്പിക്കുന്നവൻ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘പിന്തിരിപ്പിക്കുക’ എന്നും ‘വഴിതെറ്റിക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങൾ ഇയാൾക്കെതിരെ ആരോപിക്കുന്ന കാര്യങ്ങളിൽ ഈ മനുഷ്യനിൽ ഒരു കുറ്റവും ഞാൻ കണ്ടില്ല.”
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: നിങ്ങൾ ഈ മനുഷ്യനെ എന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: പീലാത്തോസിന്റെ മുമ്പാകെ യേശുവിനെ കൊണ്ടുവന്ന പൂർത്തിയായ പ്രവൃത്തിയും നേരിട്ടുള്ള അഭിസംബോധനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: ഈ മനുഷ്യനെ
  rationale: സന്ദർഭത്തിലെ നിർദിഷ്ട പുരുഷവ്യക്തിയെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: ജനത്തെ വഴിതെറ്റിക്കുന്നവൻ എന്നു പറഞ്ഞ്
  rationale: ἀποστρέφω എന്നതിന്റെ ‘തിരിച്ചുകളയുക/വഴിതെറ്റിക്കുക’ എന്ന അർഥപരിധി നിലനിർത്തുകയും ‘കലാപത്തിന് പ്രേരിപ്പിക്കുക’ എന്ന ശക്തമായ അർഥം അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തി dignified, സാധാരണ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ἐνώπιον ὑμῶν ἀνακρίνας
  choice: നിങ്ങളുടെ മുമ്പിൽവെച്ച് ഇയാളെ വിചാരണ ചെയ്തിട്ടും
  rationale: പരിശോധന അവരുടെ സാന്നിധ്യത്തിൽ നടന്ന നിയമനടപടിയാണെന്നത് വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ പ്രതീക്ഷിക്കപ്പെട്ട കണ്ടെത്തൽ ഉണ്ടായില്ലെന്ന concessive ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον
  choice: കുറ്റങ്ങൾക്ക് ആധാരമായ ഒന്നും ഞാൻ ഇയാളിൽ കണ്ടില്ല
  rationale: αἴτιον എന്ന നിയമപരമായ പദത്തെ ഒരു സമ്പൂർണ ധാർമിക വിധിയായി വിപുലീകരിക്കാതെ, ആരോപണങ്ങൾക്ക് സാധുവായ അടിസ്ഥാനം ഇല്ലെന്ന നീതിന്യായപരമായ കണ്ടെത്തലായി അവതരിപ്പിക്കുന്നു.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: നിങ്ങൾ ഇയാൾക്കെതിരെ ഉന്നയിക്കുന്ന കുറ്റങ്ങൾക്ക്
  rationale: κατηγορέω എന്ന നിയമപരമായ ‘കുറ്റം ചുമത്തുക/ആരോപിക്കുക’ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പീലാത്തോസിന്റെ പ്രഖ്യാപനത്തിന്റെ വ്യാപ്തി
  choice: ഉന്നയിച്ച കുറ്റങ്ങൾക്ക് ആധാരം കണ്ടെത്തിയില്ലെന്ന നിയമപരമായ വിധിയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഈ മനുഷ്യനിൽ ഒരു കുറ്റവും ഞാൻ കണ്ടില്ല’ എന്ന വിശാലമായ പ്രസ്താവന.
  rationale: ἀνακρίνω, αἴτιον, κατηγορέω എന്നീ നിയമപദങ്ങൾ ഈ വാക്യത്തെ കോടതിസന്ദർഭത്തിൽ നിർത്തുന്നു; അതിനാൽ വാക്യത്തിന്റെ തൽക്ഷണ നിയമപരമായ അവകാശവാദത്തിനപ്പുറം സമ്പൂർണ ധാർമിക വിധി ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കോടതിഭാഷ ഉപയോഗിച്ചു. ‘ഇയാൾ’ എന്ന രൂപം ആവർത്തിച്ച് ഉപയോഗിച്ചത് പ്രതിയുടെ നേരിട്ടുള്ള സാന്നിധ്യവും ഗ്രീക്കിലെ ‘ഈ മനുഷ്യൻ’ എന്ന ചൂണ്ടിക്കാട്ടലും നിലനിർത്താനാണ്. വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചെങ്കിലും ആശയക്രമം സംരക്ഷിച്ചു.
