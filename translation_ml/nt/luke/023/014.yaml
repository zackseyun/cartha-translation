revisions:
- from: 'അവൻ അവരോടു പറഞ്ഞു: “ജനത്തെ വഴിതെറ്റിക്കുന്നവൻ[a] എന്നു പറഞ്ഞ് നിങ്ങൾ ഈ മനുഷ്യനെ എന്റെ അടുക്കൽ കൊണ്ടുവന്നു. ഇതാ, നിങ്ങളുടെ മുമ്പിൽവെച്ച് ഇയാളെ വിചാരണ ചെയ്തിട്ടും, നിങ്ങൾ ഇയാൾക്കെതിരെ ഉന്നയിക്കുന്ന കുറ്റങ്ങൾക്ക് ആധാരമായ ഒന്നും ഞാൻ ഇയാളിൽ കണ്ടില്ല.[b]”'
