id: LUK.23.54
reference: Luke 23:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡμέρα ἦν ⸂παρασκευῆς, καὶ⸃ σάββατον ἐπέφωσκεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: ml
  text: അത് ഒരുക്കദിവസമായിരുന്നു; ശബ്ബത്ത് ആരംഭിക്കുകയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ശബ്ബത്ത് പുലരുകയായിരുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് “പുലരുക” എന്നും “ആരംഭിച്ചുവരുക” എന്നും അർഥമാകാം; ഇവിടെ ശബ്ബത്ത് സന്ധ്യയിൽ ആരംഭിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: ഒരുക്കദിവസം
  rationale: ശബ്ബത്തിനുമുമ്പുള്ള ഒരുക്കദിവസത്തെ സൂചിപ്പിക്കുന്ന യഹൂദ-ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പദാർഥവും അംഗീകൃത ദിവസനാമസ്വഭാവവും നിലനിർത്തുന്നു; ‘വെള്ളിയാഴ്ച’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: σάββατον
  choice: ശബ്ബത്ത്
  rationale: സന്ദർഭത്തിൽ നിർദിഷ്ടമായ ആഴ്ചതോറുമുള്ള ശബ്ബത്താണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം.
- source_word: ἐπέφωσκεν
  choice: ആരംഭിക്കാറായിരുന്നു
  rationale: ക്രിയയുടെ സന്ദർഭാർഥമായ ‘തുടങ്ങിവരിക’ വ്യക്തമാക്കുകയും, പ്രഭാതം ഉദിക്കുകയായിരുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു. അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: അത് ഒരുക്കദിവസമായിരുന്നു
  rationale: ഗ്രീക്കിലെ ബന്ധനിർമാണത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ
  choice: ;
  rationale: രണ്ടു സമാന്തര വാക്യഘടകങ്ങൾ തമ്മിലുള്ള ഗ്രീക്ക് ഏകോപനം മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനമില്ലാതെ അർധവിരാമംകൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐπέφωσκεν എന്ന ക്രിയയും ശബ്ബത്തിന്റെ ആരംഭസമയവും
  choice: വാക്യം സന്ധ്യയിൽ ശബ്ബത്ത് ആരംഭിച്ചുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ശബ്ബത്ത് പുലർന്നുവരുകയായിരുന്നു.
  rationale: യഹൂദരുടെ ദിവസഗണനയിൽ ശബ്ബത്ത് സന്ധ്യയ്ക്ക് ആരംഭിക്കുന്നതാണ് ഈ സംസ്കാരപരവും കഥാസന്ദർഭപരവുമായ അർഥത്തിന് അടിസ്ഥാനം. എന്നാൽ ക്രിയയുടെ ‘പുലരുക’ എന്ന അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഒരുക്കദിവസം’ എന്നത് മൂലപദത്തിന്റെ സുതാര്യത നിലനിർത്തുന്നു; ‘ആരംഭിക്കാറായിരുന്നു’ സന്ധ്യയിലെ ശബ്ബത്താരംഭം സ്വാഭാവികമായി അറിയിക്കുന്നു.
