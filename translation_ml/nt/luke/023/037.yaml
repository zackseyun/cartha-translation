  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: ml
  text: 'അവർ ഇങ്ങനെ പറഞ്ഞു: “നീ യെഹൂദന്മാരുടെ[a] രാജാവാണെങ്കിൽ, നിന്നെത്തന്നെ രക്ഷിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദ്യരുടെ രാജാവ്.” ഗ്രീക്ക് പദം സന്ദർഭമനുസരിച്ച് യെഹൂദന്മാരെയോ യെഹൂദ്യരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγοντες
  choice: അവർ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ ബഹുവചന കർത്താവിനോട് ബന്ധപ്പെടുന്ന ഗ്രീക്ക് വർത്തമാന കർത്തൃവാചക കൃദന്തത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനവാക്യമായി അവതരിപ്പിക്കുന്നു. പരിഹാസഭാവം ക്രിയയിൽ ചേർക്കാതെ സന്ദർഭത്തിനു വിടുന്നു.
- source_word: Εἰ σὺ εἶ
  choice: നീ … ആണെങ്കിൽ
  rationale: വെല്ലുവിളിയോടുകൂടിയ വ്യവസ്ഥാഭാവവും σὺ നൽകുന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ രാജാവ്
  rationale: കുരിശുമരണവിവരണത്തിൽ ആരോപണവും പരിഹാസവും ഉൾക്കൊള്ളുന്ന നിർദിഷ്ട രാജകീയ പദവിയെ പ്രതിഫലിപ്പിക്കുന്നു; Ἰουδαίων എന്നതിന്റെ പ്രദേശസംബന്ധിയായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: σῶσον σεαυτόν
  choice: നിന്നെത്തന്നെ രക്ഷിക്കൂ
  rationale: ഏകവചന ആജ്ഞാരൂപവും പ്രതിഫലന സർവനാമത്തിന്റെ ഊന്നലും സംരക്ഷിക്കുന്നു; σῴζω എന്ന ക്രിയയുടെ വിശാലമായ ലൂക്കോസ് പ്രയോഗബന്ധവും ‘രക്ഷിക്കുക’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: βασιλεὺς τῶν Ἰουδαίων എന്ന പരിഹാസാത്മക രാജകീയ പദവിയുടെ പരിഭാഷ
  choice: യെഹൂദന്മാരുടെ രാജാവ്
  alternative: യെഹൂദ്യരുടെ രാജാവ്
  rationale: യേശുവിനെതിരായ ആരോപണത്തോടും അവന്റെ രാജത്വത്തിലെ വിവരണാത്മക വിരോധാഭാസത്തോടും ബന്ധമുള്ള പരമ്പരാഗത സുവിശേഷപദവി പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു. Ἰουδαῖος എന്ന പദത്തിനുള്ള പ്രദേശപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പരിഹസിച്ചുകൊണ്ട്’ എന്ന വ്യാഖ്യാനം ക്രിയയിൽ ചേർക്കാതെ മൂലപാഠത്തിന്റെ ഭാഷാപരമായ മിതത്വം പാലിച്ചു.
