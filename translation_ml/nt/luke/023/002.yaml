id: LUK.23.2
reference: Luke 23:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: ml
  text: 'അവർ അവനെ കുറ്റപ്പെടുത്താൻ തുടങ്ങി: “ഈ മനുഷ്യൻ നമ്മുടെ ജനതയെ വഴിതെറ്റിക്കുകയും[a] കൈസർക്കു നികുതി കൊടുക്കുന്നതു വിലക്കുകയും[b] താൻതന്നെ മശീഹയും രാജാവുമാണെന്നു പറയുകയും ചെയ്യുന്നതായി ഞങ്ങൾ കണ്ടെത്തി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വഴിതെറ്റിക്കുകയും” എന്നതിന് “നമ്മുടെ ജനതയെ ദുഷിപ്പിക്കുകയും” അല്ലെങ്കിൽ “നമ്മുടെ ജനതയെ തെറ്റായ വഴിയിലേക്കു നയിക്കുകയും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “നികുതി” എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം റോമൻ ഭരണാധികാരിക്കു കൊടുക്കേണ്ട നികുതിയെയോ കപ്പത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: അവർ അവനെ കുറ്റപ്പെടുത്താൻ തുടങ്ങി
  rationale: ἤρξαντο എന്നതിന്റെ ആരംഭാർഥവും κατηγορεῖν എന്നതിന്റെ ന്യായവ്യവഹാരസന്ദർഭത്തിലെ ‘കുറ്റപ്പെടുത്തുക’ എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Τοῦτον
  choice: ഈ മനുഷ്യൻ
  rationale: ചൂണ്ടിക്കാട്ടുന്നതും അല്പം അവഹേളനപരവുമായ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: നമ്മുടെ ജനതയെ വഴിതെറ്റിക്കുകയും
  rationale: διαστρέφω ഇവിടെ ദുഷിപ്പിക്കുക, വഴിതെറ്റിക്കുക, കലാപത്തിലേക്കു തിരിക്കുക എന്നീ സാധ്യതകൾ വഹിക്കുന്നു; ‘വഴിതെറ്റിക്കുക’ അർഥം അനാവശ്യമായി രാഷ്ട്രീയ കലാപമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: കൈസർക്കു നികുതി കൊടുക്കുന്നതു വിലക്കുകയും
  rationale: κωλύωയുടെ വിലക്കൽഭാവവും φόρος എന്ന റോമൻ ഭരണാധികാരിക്കുള്ള നികുതി/കപ്പം എന്ന ആശയവും വ്യക്തമായി നൽകുന്നു.
- source_word: αὑτὸν χριστὸν βασιλέα εἶναι
  choice: താൻതന്നെ രാജാവായ മശീഹയാണെന്ന്
  rationale: αὑτόν എന്ന ഊന്നൽ ‘താൻതന്നെ’ എന്നു നിലനിർത്തുന്നു. χριστός ഇവിടെ രാജകീയ പദവിയായി വരുന്നതിനാൽ ‘മശീഹ’ എന്നു നൽകുന്നു; βασιλεύς അതുമായി ബന്ധിപ്പിച്ചിട്ടും ഇല്ലാതാക്കാതെ ‘രാജാവായ’ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം പേരുപോലെയല്ല, അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയായാണ് ആരോപണത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നത്.
- issue: χριστὸν βασιλέα തമ്മിലുള്ള ബന്ധം
  choice: രാജാവായ മശീഹ
  alternative: മശീഹ, ഒരു രാജാവ്
  rationale: ഗ്രീക്കിൽ രണ്ട് ആക്ഷേപക പൂരകങ്ങൾ അടുത്തടുത്ത് വരുന്നു. മലയാളത്തിൽ ‘രാജാവായ മശീഹ’ രാഷ്ട്രീയ ആരോപണത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു; എന്നാൽ രണ്ടിനെയും ഒരു സ്ഥിരസംയുക്ത പദവിയായി അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, എന്നാൽ വിചാരണാസന്ദർഭത്തിന്റെ ഗൗരവം കാത്തുസൂക്ഷിക്കുന്ന മലയാളം. നേരിട്ടുള്ള ഉദ്ധരണിയിലെ ആരോപണഭാവം നിലനിർത്തിയിരിക്കുന്നു.
