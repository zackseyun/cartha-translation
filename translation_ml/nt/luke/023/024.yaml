  text: ⸀καὶ Πιλᾶτος ἐπέκρινεν γενέσθαι τὸ αἴτημα αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/024.yaml
  text: And Pilate decided that their demand should be granted[a].
translation:
  language: ml
  text: അവരുടെ ആവശ്യം നടപ്പാക്കണമെന്ന് പീലാത്തോസ് വിധിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ കൂടുതൽ ഔപചാരികമായി: ‘അവരുടെ അപേക്ഷ നടപ്പാക്കണമെന്ന് പീലാത്തോസ് വിധിന്യായം പുറപ്പെടുവിച്ചു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ഗ്രീക്കിലെ καὶ ഈ വിധിയെ മുൻവിവരണത്തോടു ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ ‘അപ്പോൾ’ പോലുള്ള അധിക കാലസൂചന ചേർത്തില്ല.
- source_word: Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ നാമലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: ἐπέκρινεν
  choice: വിധിച്ചു
  rationale: ഇവിടെ ക്രിയ ഔദ്യോഗികമോ ന്യായാധിപപരമോ ആയ തീരുമാനം പുറപ്പെടുവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിധിച്ചു’ ആ നിയമപരമായ ഭാവം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: γενέσθαι
  choice: നടപ്പാക്കണമെന്ന്
  rationale: പൂരക അനന്തക്രിയയായി, ആവശ്യപ്പെട്ട കാര്യം സംഭവിക്കുകയോ പ്രാബല്യത്തിൽ വരികയോ ചെയ്യണമെന്ന അർഥം നൽകുന്നു. ‘നടപ്പാക്കണമെന്ന്’ സന്ദർഭത്തിലെ ഔദ്യോഗിക അനുമതിയും ഫലസാക്ഷാത്കാരവും വ്യക്തമാക്കുന്നു.
- source_word: τὸ αἴτημα αὐτῶν
  choice: അവരുടെ ആവശ്യം
  rationale: αἴτημα എന്നത് അപേക്ഷയെയോ ആവശ്യത്തെയോ സൂചിപ്പിക്കാം. ജനക്കൂട്ടത്തിന്റെ സമ്മർദപൂർവമായ നിലപാട് കണക്കിലെടുത്ത് ‘ആവശ്യം’ തിരഞ്ഞെടുത്തു; αὐτῶν എന്ന ഉടമസ്ഥബന്ധം ‘അവരുടെ’ എന്ന് നിലനിർത്തി.
theological_decisions:
- issue: പീലാത്തോസിന്റെ നടപടിയിലെ ന്യായവിധിസ്വഭാവം
  choice: അവരുടെ ആവശ്യം നടപ്പാക്കണമെന്ന് പീലാത്തോസ് വിധിച്ചു
  alternative: അവരുടെ അപേക്ഷ നിറവേറ്റപ്പെടണമെന്ന് പീലാത്തോസ് തീരുമാനിച്ചു
  rationale: ἐπέκρινεν എന്നതിലെ ഔദ്യോഗിക ന്യായവിധിഭാവം ‘വിധിച്ചു’ സംരക്ഷിക്കുന്നു; അതേസമയം ശിക്ഷാവിധി തന്നെയെന്ന് അതിരുകടന്ന് വ്യക്തമാക്കുന്നില്ല. ജനക്കൂട്ടം ആവശ്യപ്പെട്ട ഫലം നടപ്പിലാകണമെന്ന തീരുമാനമാണ് വാക്യം പറയുന്നത്.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വിധിച്ചു’ എന്നത് മൂലത്തിലെ നിയമപരമായ ഭാവം നിലനിർത്തുന്നു; ‘നടപ്പാക്കണമെന്ന്’ സ്വാഭാവിക മലയാളത്തിൽ γενέσθαιയുടെ സന്ദർഭാർഥം നൽകുന്നു.
