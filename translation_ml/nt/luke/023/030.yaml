id: LUK.23.30
reference: Luke 23:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἄρξονται λέγειν τοῖς ὄρεσιν· Πέσετε ἐφ’ ἡμᾶς, καὶ τοῖς βουνοῖς· Καλύψατε ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: ml
  text: അപ്പോൾ അവർ മലകളോട്[a], ‘ഞങ്ങളുടെമേൽ വീഴുക’ എന്നും കുന്നുകളോട്[b], ‘ഞങ്ങളെ മൂടുക’ എന്നും പറഞ്ഞുതുടങ്ങും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്കുകൾ പ്രവാചകഗ്രന്ഥങ്ങളിലെ ന്യായവിധിഭാഷയെ, പ്രത്യേകിച്ച് ഹോശേയ 10:8-നെ, പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: അഥവാ ‘ഞങ്ങളെ മറയ്ക്കുക.’ ഈ ക്രിയയുടെ അക്ഷരാർഥം ‘മൂടുക’ എന്നാണ്; എന്നാൽ ഇവിടെ വരാനിരിക്കുന്ന ന്യായവിധിയിൽനിന്ന് മറച്ചുവയ്ക്കുക എന്ന ആശയവും അതിനുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിനു പിന്നാലെ സംഭവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ കാലസൂചകം.
- source_word: ἄρξονται λέγειν
  choice: പറഞ്ഞുതുടങ്ങും
  rationale: ἄρξονται എന്ന ക്രിയയുടെ ഭാവികാലപരവും ആരംഭസൂചകവുമായ അർഥം, λέγειν എന്ന പൂരകക്രിയയോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῖς ὄρεσιν
  choice: മലകളോട്
  rationale: ὄρος എന്ന പദത്തെയും തുടർന്ന് വരുന്ന βουνός എന്ന പദത്തെയും തമ്മിലുള്ള വ്യത്യാസം ‘മലകൾ/കുന്നുകൾ’ എന്ന് സംരക്ഷിക്കുന്നു.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: ഞങ്ങളുടെമേൽ വീഴുക
  rationale: ബഹുവചന ആജ്ഞയും ἐπί + accusative സൂചിപ്പിക്കുന്ന മുകളിലേക്കുള്ള ചലനവും നേരിട്ട് പകരുന്നു.
- source_word: τοῖς βουνοῖς
  choice: കുന്നുകളോട്
  rationale: βουνός സാധാരണയായി ചെറിയ ഉയർച്ചയായ കുന്നിനെ സൂചിപ്പിക്കുന്നതിനാൽ ὄρεσιν എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: Καλύψατε ἡμᾶς
  choice: ഞങ്ങളെ മൂടുക
  rationale: καλύπτω എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘മൂടുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘മറയ്ക്കുക’ എന്ന ആശയവും ഉൾക്കൊള്ളാം.
theological_decisions:
- issue: പ്രവാചകീയ ന്യായവിധിഭാഷയും ഹോശേയ 10:8-ലേക്കുള്ള പ്രതിധ്വനിയും
  choice: മലകളോടും കുന്നുകളോടുമുള്ള നിലവിളി വ്യാഖ്യാനവികാസമില്ലാതെ ദൃശ്യരൂപത്തിൽ നിലനിർത്തി.
  alternative: ‘വരാനിരിക്കുന്ന ന്യായവിധിയിൽനിന്ന് ഞങ്ങളെ മറയ്ക്കുക’ എന്ന് അർഥം വികസിപ്പിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലവാക്യം ന്യായവിധിയുടെ പശ്ചാത്തലം നേരിട്ട് വിശദീകരിക്കുന്നില്ല; അതിനാൽ പ്രവാചകീയ ദൃശ്യവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മലകൾ/കുന്നുകൾ’ എന്ന പദവ്യത്യാസവും ‘പറഞ്ഞുതുടങ്ങും’ എന്ന ആരംഭസൂചനയും സംരക്ഷിച്ചു; ഉദ്ധരണിയിലെ ആജ്ഞാരൂപം നേരിട്ട് നിലനിർത്തി.
