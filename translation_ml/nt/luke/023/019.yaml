translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വാക്കുകളുടെ ക്രമം യാന്ത്രികമായി പിന്തുടരാതെ കാരണസംബന്ധവും രണ്ട് കുറ്റങ്ങളുടെയും സമാന്തരഘടനയും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
