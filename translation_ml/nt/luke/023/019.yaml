id: LUK.23.19
reference: Luke 23:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅστις ἦν διὰ στάσιν τινὰ γενομένην ἐν τῇ πόλει καὶ φόνον ⸂βληθεὶς ἐν τῇ φυλακῇ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: ml
  text: നഗരത്തിൽ നടന്ന ഒരു കലാപത്തിന്റെ[a] പേരിലും കൊലപാതകത്തിന്റെ പേരിലും തടവിലാക്കപ്പെട്ടവനായിരുന്നു അവൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലഹള’ അല്ലെങ്കിൽ ‘പ്രക്ഷോഭം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് στάσις എന്ന പദത്തിന് കലാപം, ലഹള, അല്ലെങ്കിൽ പ്രക്ഷോഭം എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: അവൻ
  rationale: സന്ദർഭത്തിൽ ഈ സർവനാമം ബറബ്ബാസിനെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ മുൻവാക്യത്തോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘അവൻ’ യോജിക്കുന്നു.
- source_word: διὰ
  choice: പേരിൽ
  rationale: Accusative-നോടുകൂടിയ διά ഇവിടെ കാരണമോ കുറ്റാരോപണത്തിന്റെ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു; ‘...ത്തിന്റെ പേരിൽ’ എന്ന പ്രയോഗം രണ്ട് കുറ്റങ്ങളോടും സ്വാഭാവികമായി ചേരുന്നു.
- source_word: στάσιν τινὰ
  choice: ഒരു കലാപം
  rationale: στάσις നഗരത്തിലെ രാഷ്ട്രീയസ്വഭാവമുള്ള പ്രക്ഷോഭം, ലഹള, കലാപം എന്നിവ സൂചിപ്പിക്കാം. ‘കലാപം’ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവും രാഷ്ട്രീയ-അക്രമസ്വഭാവം നിലനിർത്തുന്നതുമാണ്; τις-ന്റെ അനിശ്ചിതത്വം ‘ഒരു’ നിലനിർത്തുന്നു.
- source_word: γενομένην ἐν τῇ πόλει
  choice: നഗരത്തിൽ നടന്ന
  rationale: γενομένην στάσιν-നെ വിശേഷിപ്പിക്കുന്നു; ‘നഗരത്തിൽ നടന്ന’ എന്നത് സംഭവാർത്ഥവും സ്ഥലസൂചനയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. നഗരം യെരൂശലേമെന്ന് പാഠം വ്യക്തമാക്കാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: φόνον
  choice: കൊലപാതകം
  rationale: φόνος സാധാരണ കൊല്ലൽ എന്നതിലുപരി കുറ്റകരമായ കൊലപാതകത്തെ സൂചിപ്പിക്കുന്നു; ന്യായവ്യവഹാരസന്ദർഭത്തിൽ ‘കൊലപാതകം’ കൃത്യമാണ്.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: തടവിലാക്കപ്പെട്ടവനായിരുന്നു
  rationale: βάλλω-യുടെ ശക്തി അക്ഷരാർഥത്തിൽ ‘എറിയുക’ എന്നാണെങ്കിലും തടവറയുടെ സന്ദർഭത്തിൽ ‘തടവിലാക്കുക’ എന്നത് സ്വാഭാവിക മലയാളമാണ്; passive participle-ന്റെ മുൻകാലാവസ്ഥയും വാക്യഘടനയും ഈ രൂപം നിലനിർത്തുന്നു.
