id: LUK.23.56
reference: Luke 23:56
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: ml
  text: പിന്നെ മടങ്ങിയശേഷം[a] അവർ സുഗന്ധദ്രവ്യങ്ങളും സുഗന്ധതൈലങ്ങളും[b] ഒരുക്കി. ശബ്ബത്തിൽ അവർ കല്പനയനുസരിച്ച് വിശ്രമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മടങ്ങിയെത്തിയപ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് കൃതന്തം മുഖ്യക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സുഗന്ധതൈലങ്ങൾ’ എന്നത് ‘സുഗന്ധലേപനങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: മടങ്ങിയശേഷം
  rationale: സ്ത്രീലിംഗ ബഹുവചനത്തിലുള്ള ഗ്രീക്ക് ഭൂതകാല കൃതന്തം മുൻസന്ദർഭത്തിലെ സ്ത്രീകളെ സൂചിപ്പിക്കുകയും മുഖ്യക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തി അറിയിക്കുകയും ചെയ്യുന്നു. ‘മടങ്ങിയശേഷം’ ഇത് സ്വാഭാവികമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: δὲ
  choice: പിന്നെ
  rationale: ഇവിടെ δέ കഥയുടെ തുടർച്ചയും അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കവും സൂചിപ്പിക്കുന്നു; ‘പിന്നെ’ അതിന്റെ മൃദുവായ തുടർച്ചാഭാവം നൽകുന്നു.
- source_word: ἡτοίμασαν
  choice: ഒരുക്കി
  rationale: ശവസംസ്കാരത്തിനാവശ്യമായ വസ്തുക്കൾ തയ്യാറാക്കിയതിനെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: ἀρώματα
  choice: സുഗന്ധദ്രവ്യങ്ങൾ
  rationale: ശവശരീരത്തിൽ ഉപയോഗിച്ചിരുന്ന സുഗന്ധമുള്ള വസ്തുക്കളെയാണ് സംസ്കാരസന്ദർഭത്തിൽ ἀρώματα സൂചിപ്പിക്കുന്നത്.
- source_word: μύρα
  choice: സുഗന്ധതൈലങ്ങൾ
  rationale: μύρα സുഗന്ധമുള്ള എണ്ണകളെയോ ലേപനങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘സുഗന്ധതൈലങ്ങൾ’ ἀρώματα എന്നതിൽനിന്നുള്ള വ്യത്യാസവും സംസ്കാരസന്ദർഭവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὸ μὲν σάββατον
  choice: ശബ്ബത്തിൽ
  rationale: ഇത് ശബ്ബത്തുദിവസത്തെ കാലസൂചനയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; μέν എന്ന കണത്തിന്റെ ലഘുവായ മാറ്റസൂചന പ്രത്യേകം പദമാക്കേണ്ടതില്ല.
- source_word: ἡσύχασαν
  choice: വിശ്രമിച്ചു
  rationale: ശബ്ബത്ത് ആചരിക്കുന്ന സന്ദർഭത്തിൽ പ്രവർത്തനം നിർത്തി വിശ്രമിക്കുക എന്നതാണ് ἡσυχάζωയുടെ പ്രസക്തമായ അർഥം.
- source_word: κατὰ τὴν ἐντολήν
  choice: കല്പനയനുസരിച്ച്
  rationale: ἐντολήν എന്ന ഏകവചനവും നിർദിഷ്ട കല്പനയോടുള്ള അനുസരണവും വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘കല്പന’ എന്നതിന്റെ സൂചന
  choice: ശബ്ബത്താചരണത്തെക്കുറിച്ചുള്ള മോശൈക കല്പനയിലേക്കുള്ള സന്ദർഭസൂചന പ്രധാനവാചകത്തിൽ വിശദീകരിക്കാതെ ‘കല്പനയനുസരിച്ച്’ എന്നു നിലനിർത്തി.
  alternative: പൊതുവായ ഒരു ദൈവകല്പന; അല്ലെങ്കിൽ അവരുടെ പതിവുനിയമം.
  rationale: ശബ്ബത്തിന്റെ സന്ദർഭം തോറായിലെ ശബ്ബത്തുകല്പനയെയാണ് സൂചിപ്പിക്കുന്നത്. എന്നാൽ മൂലവാചകം അതിനെ വിശദീകരിക്കുന്നില്ല; അതിനാൽ പരിഭാഷയും അധിക ദൈവശാസ്ത്രവിവരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സംസ്കാരസന്ദർഭം വ്യക്തമാകുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തെങ്കിലും മൂലവാചകത്തിൽ ഇല്ലാത്ത വിശദീകരണം പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
