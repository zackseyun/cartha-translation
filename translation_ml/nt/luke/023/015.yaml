id: LUK.23.15
reference: Luke 23:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: ml
  text: എന്നാൽ ഹെരോദാവും അവനിൽ കുറ്റമൊന്നും കണ്ടെത്തിയില്ല[a]; കാരണം ഹെരോദാവ് അവനെ നമ്മുടെ അടുക്കലേക്കു തിരിച്ചയച്ചു. ഇതാ, മരണശിക്ഷയ്ക്ക് അർഹമായ ഒന്നും അവൻ ചെയ്തിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മൂലഭാഷയിൽ ഇവിടെ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല; അക്ഷരാർഥം: “എന്നാൽ ഹെരോദാവും ഇല്ല.” മുൻസന്ദർഭത്തിൽനിന്നാണ് “കുറ്റമൊന്നും കണ്ടെത്തിയില്ല” എന്നു പൂരിപ്പിച്ചിരിക്കുന്നത്.'
    reason: മൂലപാഠത്തിലെ ക്രിയാരഹിത പ്രയോഗവും പരിഭാഷയിൽ വരുത്തിയ സന്ദർഭപൂരിപ്പിക്കലും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: എന്നാൽ ഹെരോദാവും ഇവനിൽ കുറ്റമൊന്നും കണ്ടെത്തിയില്ല
  rationale: ഗ്രീക്കിൽ ക്രിയ ഒഴിവാക്കിയിട്ടുള്ള ഒരു സംക്ഷിപ്ത പ്രയോഗമാണിത്. മുൻവാക്യത്തിലെ പീലാത്തോസിന്റെ കുറ്റാന്വേഷണ വിധിയുമായി ബന്ധപ്പെടുത്തി, മലയാളത്തിൽ അർഥം വ്യക്തമാകാൻ ‘കുറ്റമൊന്നും കണ്ടെത്തിയില്ല’ എന്നു പൂരിപ്പിച്ചു; ‘οὐδὲ’ നൽകുന്ന ‘ഹെരോദാവും ഇല്ല’ എന്ന കൂട്ടിച്ചേർക്കൽഭാവം നിലനിർത്തി.
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: കാരണം അദ്ദേഹം ഇവനെ നമ്മുടെ അടുക്കലേക്കു തിരിച്ചയച്ചു
  rationale: ἀναπέμπω എന്നത് ഈ ന്യായവിചാരണാസന്ദർഭത്തിൽ തിരികെ അയയ്ക്കുക എന്നർഥം നൽകുന്നു. πρὸς ἡμᾶς എന്നതിലെ ഒന്നാംപുരുഷ ബഹുവചനം ‘നമ്മുടെ അടുക്കലേക്ക്’ എന്നു സൂക്ഷിച്ചു.
- source_word: καὶ ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള നിഗമനത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ἰδούവിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: മരണശിക്ഷയ്ക്ക് അർഹമായ ഒന്നും
  rationale: ഇവിടെ θάνατος ന്യായവിധിയിലുള്ള വധശിക്ഷയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മരണശിക്ഷ’ എന്നു വ്യക്തമാക്കി; ἄξιον എന്നതിന്റെ അർഹതാഭാവം നിലനിർത്തി.
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: ഇവൻ ചെയ്തിട്ടില്ല
  rationale: പൂർണ്ണമായ പ്രവൃത്തിക്ക് ഇപ്പോഴുള്ള പ്രസക്തി നൽകുന്ന ഗ്രീക്ക് പരിപ്രാസിക പൂർണ്ണകാലത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു. αὐτῷയെ പ്രവൃത്തിയുടെ കർത്താവായി ഗ്രഹിച്ച് ‘ഇവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: πεπραγμένον αὐτῷ എന്നതിൽ αὐτῷയുടെ ബന്ധം
  choice: 'കർത്താവ്: ‘ഇവൻ ചെയ്തിട്ടില്ല’'
  alternative: 'ബന്ധസൂചന: ‘ഇവനിൽ കണ്ടെത്തിയിട്ടില്ല’; അല്ലെങ്കിൽ ‘ഇവനോടു ചെയ്തിട്ടില്ല’'
  rationale: സന്ദർഭം യേശു മരണശിക്ഷയ്ക്ക് അർഹമായ കുറ്റം ചെയ്തിട്ടില്ലെന്ന പീലാത്തോസിന്റെ വിധിയെക്കുറിച്ചാണ്. അതിനാൽ αὐτῷയെ പ്രവൃത്തിയുടെ കർത്താവായി അവതരിപ്പിക്കുന്നത് ന്യായവിചാരണാത്മക അർഥം ഏറ്റവും വ്യക്തമായി നൽകുന്നു.
- issue: ἀλλ’ οὐδὲ Ἡρῴδης എന്ന ക്രിയാരഹിത പ്രയോഗം
  choice: മുൻസന്ദർഭത്തിൽനിന്ന് ‘കുറ്റമൊന്നും കണ്ടെത്തിയില്ല’ എന്നു പൂരിപ്പിക്കുക
  alternative: അക്ഷരാർഥത്തിൽ ‘എന്നാൽ ഹെരോദാവും ഇല്ല’ എന്നു വിടുക
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തത മലയാളത്തിൽ അർഥദുർഗ്രഹമാകും. പൂരിപ്പിച്ച ക്രിയ മുൻവാക്യത്തിലെ കുറ്റം കണ്ടെത്താനായില്ലെന്ന പ്രസ്താവനയെയാണ് പിന്തുടരുന്നത്; പുതിയ ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ന്യായവിചാരണാ ശൈലി ഉപയോഗിച്ചു. ‘ഇതാ’ എന്നത് പ്രസംഗത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ‘മരണശിക്ഷയ്ക്ക് അർഹമായ’ എന്നത് സാധാരണ വായനക്കാർക്ക് നിയമപരമായ ആശയം വ്യക്തമായി നൽകുന്നു.
