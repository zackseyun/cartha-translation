source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: ml
  text: 'എന്നാൽ അവർ കൂടുതൽ ശക്തമായി ഉറച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു: “ഇവൻ ഗലീലയിൽനിന്ന് തുടങ്ങി ഇവിടെവരെ[c], യെഹൂദ്യയിലെങ്ങും[b] പഠിപ്പിച്ച് ജനത്തെ ഇളക്കിവിടുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജനത്തെ പ്രകോപിപ്പിക്കുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് അസ്വസ്ഥതയോ കലഹമോ ഉണ്ടാക്കുന്ന വിധത്തിൽ ഉണർത്തുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: “യെഹൂദ്യ” എന്നത് പ്രത്യേക യെഹൂദ്യപ്രദേശത്തെയോ, ചില സന്ദർഭങ്ങളിൽ കൂടുതൽ വിശാലമായ യെഹൂദദേശത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ അവന്റെ പ്രവർത്തനത്തിന്റെ വ്യാപ്തിക്കാണ് ഊന്നൽ.
    reason: cultural_note
  - marker: c
    text: അഥവാ “ഈ സ്ഥലത്തോളം.” ഗലീലയിൽനിന്ന് ഇപ്പോഴത്തെ സ്ഥലത്തോളം എന്ന വ്യാപ്തിയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: നിർബന്ധപൂർവം പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലക്രിയ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ ശക്തമായ നിർബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Ἀνασείει
  choice: ഇളക്കിവിടുന്നു
  rationale: ജനത്തെ അസ്വസ്ഥമാക്കുകയോ കലഹത്തിലേക്കു പ്രേരിപ്പിക്കുകയോ ചെയ്യുന്നു എന്ന കുറ്റാരോപണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; സാങ്കേതികമായി രാജദ്രോഹം എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: τὸν λαὸν
  choice: ജനത്തെ
  rationale: ഒരു പ്രത്യേക ജനക്കൂട്ടത്തെയല്ല, പൊതുവായ ജനസമൂഹത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: διδάσκων
  choice: പഠിപ്പിച്ച്
  rationale: ജനത്തെ ഇളക്കിവിടുന്നു എന്ന ആരോപണവുമായി പഠിപ്പിക്കൽ എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നുവെന്ന ഗ്രീക്ക് കൃുദന്തരൂപത്തിന്റെ ഇഴചേർന്ന സ്വഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: യെഹൂദ്യയിലെങ്ങും
  rationale: പ്രദേശമൊട്ടാകെയുള്ള വ്യാപ്തി സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: ഗലീലയിൽ തുടങ്ങി
  rationale: പ്രവർത്തനത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ ആരംഭസ്ഥാനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἕως ὧδε
  choice: ഇവിടംവരെ
  rationale: ഗലീലയിൽനിന്ന് പീലാത്തോസിന്റെ മുമ്പിലെ ഇപ്പോഴത്തെ സ്ഥലത്തോളം എന്ന ദിശാസൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനെതിരായ കുറ്റാരോപണത്തിന്റെ സ്വഭാവം
  choice: “ജനത്തെ ഇളക്കിവിടുന്നു” എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: “ജനത്തെ കലാപത്തിന് പ്രേരിപ്പിക്കുന്നു”
  rationale: ἀνασείει സാമൂഹിക അസ്വസ്ഥതയോ പ്രകോപനമോ ആരോപിക്കാം; എന്നാൽ അതിനെ നിർബന്ധമായും സാങ്കേതികമായ രാജദ്രോഹക്കുറ്റമായി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആരോപണത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് അതിലധികം രാഷ്ട്രീയ അർഥം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കോടതിയിലെ ശക്തമായ കുറ്റാരോപണത്തിന്റെ ഭാവം നിലനിർത്തിയെങ്കിലും അനാവശ്യമായ സാങ്കേതിക രാഷ്ട്രീയപദങ്ങൾ ഒഴിവാക്കി. സ്ഥലവ്യാപ്തി മലയാളത്തിൽ വ്യക്തമായി കേൾക്കുന്നതിനായി ഗലീലയിൽനിന്ന് ഇവിടംവരെയുള്ള ഘടകം ഉദ്ധരണിയുടെ തുടക്കത്തിലാക്കി.
