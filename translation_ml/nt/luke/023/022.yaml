id: LUK.23.22
reference: Luke 23:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: ml
  text: 'അവൻ മൂന്നാം പ്രാവശ്യം അവരോടു പറഞ്ഞു: “എന്തിന്? ഇയാൾ എന്തു തിന്മയാണ് ചെയ്തത്?[a] മരണശിക്ഷയ്ക്കുള്ള ഒരു അടിസ്ഥാനവും ഞാൻ ഇയാളിൽ കണ്ടെത്തിയിട്ടില്ല.[b] അതുകൊണ്ട്, ഇയാളെ ശിക്ഷിച്ചശേഷം[c] വിട്ടയക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇയാൾ എന്തു തിന്മ ചെയ്തതിനാണ്?” ഇവിടെ ആദ്യത്തെ Τί തുടർന്നുള്ള പൂർണചോദ്യത്തെ അവതരിപ്പിക്കുന്ന സംക്ഷിപ്ത പ്രതിഷേധചോദ്യമായി മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “മരണത്തിന് കാരണമാകുന്ന ഒന്നും,” “മരണത്തിന് അർഹമായ ഒന്നും,” അല്ലെങ്കിൽ “മരണവിധിക്ക് അടിസ്ഥാനമായ ഒന്നും.”'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “ശിക്ഷണനടപടി സ്വീകരിച്ചശേഷം”; കൂടുതൽ പ്രത്യേകമായി, “ചാട്ടവാറുകൊണ്ട് അടിച്ചശേഷം” എന്നും മനസ്സിലാക്കാം. ഗ്രീക്ക് പദമായ παιδεύσας ശിക്ഷണപരമായ ദണ്ഡനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, അതിന്റെ കൃത്യമായ രൂപം ഈ പദം മാത്രം വ്യക്തമാക്കുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: മൂന്നാം പ്രാവശ്യം
  rationale: ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ആഖ്യാനത്തിലെ ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: എന്തിന്? ഇയാൾ എന്തു തിന്മയാണ് ചെയ്തത്?
  rationale: Τί എന്ന സംക്ഷിപ്ത പ്രതിഷേധചോദ്യം വേറിട്ട് നിലനിർത്തുകയും തുടർന്നുള്ള പൂർണചോദ്യം സ്വാഭാവികമായി നൽകുകയും ചെയ്തു. κακόν എന്നതിന്റെ ധാർമിക ശക്തി നിലനിർത്താൻ ‘തിന്മ’ ഉപയോഗിച്ചു.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: മരണശിക്ഷയ്ക്ക് അർഹമായ യാതൊന്നും
  rationale: നിയമപരമായ സന്ദർഭത്തിൽ αἴτιον θανάτου മരണത്തിന് കാരണമാകുന്നതോ മരണവിധിക്ക് അർഹമാക്കുന്നതോ ആയ കുറ്റത്തെ സൂചിപ്പിക്കുന്നു. ‘മരണശിക്ഷയ്ക്ക് അർഹമായ’ എന്നത് അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: εὗρον ἐν αὐτῷ
  choice: ഞാൻ ഇയാളിൽ കണ്ടെത്തിയിട്ടില്ല
  rationale: ഗ്രീക്കിലെ ‘അവനിൽ’ എന്ന ഘടന നിലനിർത്തുന്നു; പീലാത്തൊസിന്റെ ഇപ്പോഴത്തെ വിധിനിർണയവുമായി ബന്ധപ്പെട്ട പൂർത്തിയായ അന്വേഷണഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: παιδεύσας
  choice: ശിക്ഷിച്ചശേഷം
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ ശിക്ഷണപരമായ ദണ്ഡനത്തെ സൂചിപ്പിക്കുന്നു. ശിക്ഷയുടെ കൃത്യരൂപം ഗ്രീക്ക് പദം തനിയെ വ്യക്തമാക്കാത്തതിനാൽ ‘ചാട്ടവാറുകൊണ്ട് അടിച്ചശേഷം’ എന്ന് മുഖ്യപാഠത്തിൽ പ്രത്യേകീകരിച്ചില്ല.
- source_word: ἀπολύσω
  choice: വിട്ടയയ്ക്കാം
  rationale: ന്യായവിധിയുടെ സന്ദർഭത്തിൽ തടവിൽനിന്നോ ശിക്ഷയിൽനിന്നോ മോചിപ്പിക്കുക എന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു. മലയാളത്തിൽ ഈ വാക്യസന്ദർഭത്തിലെ തീരുമാനം/നിർദേശം ‘വിട്ടയയ്ക്കാം’ എന്ന രൂപത്തിൽ സുതാര്യമാണ്.
theological_decisions:
- issue: παιδεύσας എന്നതിൽ പീലാത്തൊസ് നിർദേശിച്ച നടപടിയുടെ സ്വഭാവം
  choice: കൃത്യമായ ദണ്ഡനരീതി പറയാതെ പൊതുവായി ‘ശിക്ഷിച്ചശേഷം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ശിക്ഷണനടപടി സ്വീകരിച്ചശേഷം’ അല്ലെങ്കിൽ കൂടുതൽ പ്രത്യേകമായി ‘ചാട്ടവാറുകൊണ്ട് അടിച്ചശേഷം’.
  rationale: യേശു മരണശിക്ഷയ്ക്ക് അർഹനല്ലെന്ന് പ്രഖ്യാപിക്കുമ്പോഴും ഒരു കുറഞ്ഞ ദണ്ഡനം നിർദേശിക്കുന്ന പീലാത്തൊസിന്റെ നിലപാടിലെ സംഘർഷം വാക്യം നിലനിർത്തുന്നു. παιδεύω ശിക്ഷണപരമായ ദണ്ഡനത്തെ സൂചിപ്പിക്കാമെങ്കിലും അതിന്റെ കൃത്യരൂപം ഈ പദം മാത്രം നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പീലാത്തൊസിനെ സൂചിപ്പിക്കാൻ ‘അവൻ’ എന്നും യേശുവിനെ അടുത്തുള്ള വ്യക്തിയായി ചൂണ്ടിക്കാണിക്കുന്ന οὗτος/αὐτός അനുസരിച്ച് ‘ഇയാൾ’ എന്നും ഉപയോഗിച്ചു. നിയമപരമായ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാനായി ‘മരണശിക്ഷയ്ക്ക് അർഹമായ’ എന്നു നൽകി; പാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേക ദണ്ഡനരീതി മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
