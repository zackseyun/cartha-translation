  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: ml
  text: ഉത്സവത്തോടനുബന്ധിച്ച് അവർക്കു ഒരാളെ വിട്ടുകൊടുക്കാൻ അദ്ദേഹത്തിന് ബാധ്യതയുണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം ഏറ്റവും പുരാതനമായ ചില ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ—മൂന്നാം നൂറ്റാണ്ടിലെ പാപ്പിറസ് 75-ലും നാലാം നൂറ്റാണ്ടിലെ വത്തിക്കാനസ് കൈയെഴുത്തുപ്രതിയിലും ഉൾപ്പെടെ—ആദ്യകാല കോപ്റ്റിക് വിവർത്തനങ്ങളിലും ഇല്ല. എന്നാൽ നാലാം നൂറ്റാണ്ടിലെ സൈനായിറ്റിക്കസ് പോലുള്ള മറ്റു പ്രധാന പുരാതന കൈയെഴുത്തുപ്രതികളിലും ലത്തീൻ പാരമ്പര്യത്തിലും പിൽക്കാല ബൈസന്റൈൻ ഭൂരിപക്ഷപാഠത്തിലും ഇത് കാണുന്നു. മത്തായി 27:15-ലും മർക്കോസ് 15:6-ലും പറയുന്ന തടവുകാരനെ വിട്ടയയ്ക്കുന്ന പതിവുമായി ലൂക്കായുടെ വിവരണം ഒത്തുചേർക്കാൻ പകർപ്പെഴുത്തുകാർ ഈ വാക്യം ചേർത്തതായിരിക്കാം. ചില കൈയെഴുത്തുപ്രതികൾ ഈ വാക്യം 18-ാം വാക്യത്തിനു ശേഷമാണ് നൽകുന്നത്.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην ... εἶχεν
  choice: ബാധ്യതയുണ്ടായിരുന്നു
  rationale: ‘നിർബന്ധം/ആവശ്യം ഉണ്ടായിരിക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആചാരപരമായോ സാഹചര്യപരമായോ ഉള്ള ബാധ്യത എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἀπολύειν
  choice: വിട്ടയയ്ക്കാൻ
  rationale: തടവിലോ കസ്റ്റഡിയിലോ ഉള്ള ഒരാളെ മോചിപ്പിക്കുക എന്ന നിയമപരമായ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കുവേണ്ടി
  rationale: ജനക്കൂട്ടത്തിന്റെ പ്രയോജനത്തിനായോ അഭ്യർഥനപ്രകാരമോ ഒരാളെ വിട്ടയയ്ക്കുക എന്ന സന്ദർഭബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατὰ ἑορτήν
  choice: ഉത്സവത്തോടനുബന്ധിച്ച്
  rationale: ഓരോ ഉത്സവാവസരത്തിലും നിലവിലുണ്ടായിരുന്ന പതിവിനെ സൂചിപ്പിക്കുന്നു; ‘ഉത്സവത്തിൽ’ എന്നതിനെക്കാൾ ആചാരപരമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἕνα
  choice: ഒരാളെ
  rationale: പുരുഷലിംഗത്തിലുള്ള ‘ഒരുവൻ’ എന്ന ആശയം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: വാക്യത്തിന്റെ പാഠസാക്ഷ്യം
  choice: ബൈസന്റൈൻ അടിസ്ഥാനപാഠം അനുസരിച്ച് വാക്യം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി, പാഠഭേദം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: വാക്യം മുഖ്യപാഠത്തിൽനിന്ന് ഒഴിവാക്കുക, അല്ലെങ്കിൽ കോഷ്ഠകത്തിൽ നൽകുക.
  rationale: നൽകിയിരിക്കുന്ന Robinson–Pierpont Byzantine പാഠത്തിൽ വാക്യം ഉള്ളതിനാൽ അത് വിവർത്തനം ചെയ്യുന്നു; അതേസമയം ആദ്യകാല പ്രധാന സാക്ഷികളിലെ അഭാവവും ചില കൈയെഴുത്തുപ്രതികളിലെ വ്യത്യസ്ത സ്ഥാനവും മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘ബാധ്യതയുണ്ടായിരുന്നു’ എന്നത് ἀνάγκην εἶχεν എന്ന പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു. ഗ്രീക്കിൽ പീലാത്തൊസിന്റെ പേര് ഈ വാക്യത്തിൽ ആവർത്തിക്കാത്തതിനാൽ ‘അദ്ദേഹത്തിന്’ എന്നു നൽകി.
