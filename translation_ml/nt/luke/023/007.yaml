source:
  edition: SBLGNT
  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: ml
  text: യേശു ഹെരോദാവിന്റെ അധികാരപരിധിയിൽപ്പെട്ടവനാണെന്ന് അറിഞ്ഞപ്പോൾ, പീലാത്തോസ് അവനെ ഹെരോദാവിന്റെ അടുക്കലേക്ക് അയച്ചു. ആ ദിവസങ്ങളിൽ ഹെരോദാവും യെരൂശലേമിൽ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹെരോദാവിന്റെ അധികാരത്തിന്റെ കീഴിലുള്ളവൻ.” ഗ്രീക്കുപ്രയോഗം ഹെരോദാവിന്റെ ഭരണപ്രദേശത്തെയോ നിയമപരമായ അധികാരത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: അറിഞ്ഞപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ തിരിച്ചറിവിനെ സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃദന്തരൂപത്തിന്റെ സമയബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: ഹെരോദാവിന്റെ അധികാരപരിധിയിൽപ്പെട്ടവനാണ്
  rationale: ἐξουσία ഇവിടെ അമൂർത്തമായ ശക്തിയെയല്ല, ഹെരോദാവിന്റെ ഭരണപരവും നിയമപരവുമായ അധികാരപരിധിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην
  choice: അവനെ ഹെരോദാവിന്റെ അടുക്കലേക്ക് അയച്ചു
  rationale: ന്യായവിചാരണയുടെ പശ്ചാത്തലത്തിൽ കേസ് മറ്റൊരു ഭരണാധികാരിയുടെ പരിഗണനയ്ക്ക് അയയ്ക്കുന്ന സൂചന ക്രിയയ്ക്കുണ്ടെങ്കിലും, ലളിതമായ ഈ പ്രയോഗം മൂലപാഠത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις
  choice: ഹെരോദാവും യെരൂശലേമിൽ ഉണ്ടായിരുന്നു
  rationale: καὶ αὐτόν നൽകുന്ന ‘ഹെരോദാവും’ എന്ന ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സ്വതന്ത്രവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: അക്ഷരാർഥമായ ‘ഈ ദിവസങ്ങളിൽ’ എന്നതിനു പകരം ആഖ്യാനത്തിന്റെ കാലദൃഷ്ടിക്കനുസരിച്ചുള്ള സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: ഹെരോദാവിനോടു ബന്ധപ്പെട്ട ἐξουσία എന്ന പദത്തിന്റെ രാഷ്ട്രീയ-നിയമപരമായ അർഥം
  choice: അധികാരപരിധി
  alternative: അധികാരം; ഭരണപ്രദേശം
  rationale: സന്ദർഭം യേശുവിന്റെ ദേശപരമായ ബന്ധത്തെ അടിസ്ഥാനമാക്കിയുള്ള ഹെരോദാവിന്റെ ഭരണ-ന്യായാധികാരത്തെക്കുറിച്ചാണ്; ദൈവശാസ്ത്രപരമായ ‘അധികാരം’ എന്ന ആശയം ഇവിടെ അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ ‘അധികാരപരിധി’ കൂടുതൽ കൃത്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ള ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അധികാരപരിധി’ നിയമ-ഭരണസന്ദർഭം കൃത്യമായി നൽകുന്നു. ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ആദ്യവാക്യത്തിൽ കർത്താവായ ‘പീലാത്തോസ്’ വ്യക്തമാക്കി; ഗ്രീക്കിൽ അത് മുൻസന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കപ്പെടുന്നതാണ്.
