id: LUK.23.43
reference: Luke 23:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “സത്യമായി, ഞാൻ നിന്നോടു പറയുന്നു: ഇന്ന്[a] നീ എന്നോടുകൂടെ പറുദീസയിൽ ഇരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സാധ്യത കുറവുള്ള മറ്റൊരു വിരാമചിഹ്നനരീതി: “സത്യമായി, ഞാൻ ഇന്ന് നിന്നോടു പറയുന്നു: നീ എന്നോടുകൂടെ പറുദീസയിൽ ഇരിക്കും.” മൂല ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ ആധുനിക വിരാമചിഹ്നങ്ങൾ ഉണ്ടായിരുന്നില്ല; ഈ വായനയിൽ “ഇന്ന്” എന്നത് “ഞാൻ നിന്നോടു പറയുന്നു” എന്നതിനോടാണ് ചേരുന്നത്; “നീ ... ഇരിക്കും” എന്നതിനോടല്ല.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: സത്യമായി
  rationale: യേശുവിന്റെ പ്രഖ്യാപനങ്ങൾക്ക് ആധികാരികവും ഗൗരവമുള്ളതുമായ ഉറപ്പ് നൽകുന്ന ആമുഖപദം. ലിപ്യന്തരണം ചെയ്യാതെ അതിന്റെ പ്രയോഗശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: σοι λέγω
  choice: ഞാൻ നിന്നോടു പറയുന്നു
  rationale: സുവിശേഷങ്ങളിലെ പതിവായ പ്രഭാഷണസൂത്രം; ഗ്രീക്കിനോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികവുമായ രൂപം.
- source_word: σήμερον
  choice: ഇന്ന്
  rationale: പ്രധാനവായനയിൽ ഈ ക്രിയാവിശേഷണം ‘ഇരിക്കും’ എന്ന ഭാവിക്രിയയോടു ചേർത്ത്, വാഗ്ദാനം അതേ ദിവസത്തെക്കുറിച്ചാണെന്ന സ്വാഭാവിക വാക്യഘടന നിലനിർത്തുന്നു. വിരാമചിഹ്നത്തെ ആശ്രയിച്ചുള്ള മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടുകൂടെ
  rationale: യേശുവിനോടുള്ള വ്യക്തിപരമായ സഹവാസം നേരിട്ടും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔσῃ
  choice: നീ ... ഇരിക്കും
  rationale: εἰμί എന്ന ക്രിയയുടെ ഭാവികാലത്തെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ഭാവിരൂപത്തിൽ നൽകുന്നു.
- source_word: παραδείσῳ
  choice: പറുദീസയിൽ
  rationale: ഈ യുഗാന്ത്യസന്ദർഭത്തിൽ παράδεισος എന്ന പദത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും അർത്ഥസൂചകവുമായ പദം; മൂലപാഠം നൽകുന്നതിലധികം സ്ഥലവിവരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഉപദേശപരമായ പ്രത്യാഘാതങ്ങളുള്ള, വിരാമചിഹ്നത്തെ ആശ്രയിക്കുന്ന വാക്യത്തിൽ σήμερον (‘ഇന്ന്’) ഏതിനോടാണ് ചേരുന്നത്
  choice: ‘ഇന്ന്’ എന്നത് ‘നീ എന്നോടുകൂടെ പറുദീസയിൽ ഇരിക്കും’ എന്ന വാഗ്ദാനത്തോടു ചേർക്കുന്നു
  alternative: ‘ഇന്ന്’ എന്നത് ‘ഞാൻ നിന്നോടു പറയുന്നു’ എന്നതിനോടു ചേർക്കുക
  rationale: പുരാതന ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ ആധുനിക വിരാമചിഹ്നങ്ങൾ ഇല്ലാത്തതിനാൽ ചിഹ്നനം വ്യാഖ്യാനപരമാണ്. കൊയ്നേ ഗ്രീക്കിലെ സ്വാഭാവിക ക്രമത്തിലും വാക്യത്തിന്റെ ഒഴുക്കിലും ‘ഇന്ന്’ ഭാവിക്രിയയെ വിശേഷിപ്പിക്കുന്നതാണ് കൂടുതൽ സാധ്യതയുള്ളത്. എന്നാൽ മറ്റൊരു വായന ചരിത്രപരമായി വാദിക്കപ്പെട്ടതും ദൈവശാസ്ത്രപരമായ പ്രസക്തിയുള്ളതുമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സത്യമായി’, ‘എന്നോടുകൂടെ’, ‘പറുദീസ’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും വചനത്തിന്റെ ഔന്നത്യം നിലനിർത്തുന്നതുമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
