  naturalness: ‘അവൻ അവനോട്’ എന്നതിനെ ‘അവൻ അവനോടു’ എന്നാക്കുന്നതു നിലവാരമുള്ള ലിഖിതമലയാളത്തിൽ കൂടുതൽ മിനുക്കമുള്ളതാണ്. ‘സത്യമായി’ക്കുശേഷമുള്ള കോമ വാക്യത്തിന്റെ ഗൗരവമുള്ള ഉച്ചാരണവും ഒഴുക്കും വ്യക്തമാക്കുന്നു.
