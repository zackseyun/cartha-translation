id: LUK.23.1
reference: Luke 23:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: ml
  text: അങ്ങനെ അവരുടെ മുഴുവൻ കൂട്ടവും എഴുന്നേറ്റ് അവനെ പീലാത്തൊസിന്റെ അടുക്കലേക്കു കൊണ്ടുപോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ മുഴുവൻ ജനക്കൂട്ടവും.”
    reason: πλῆθος എന്ന കൂട്ടനാമത്തിന് സാധ്യമായ മറ്റൊരു പദാന്തരം.
lexical_decisions:
- source_word: Καὶ
  choice: അപ്പോൾ
  rationale: തുടർന്നുള്ള സംഭവത്തിലേക്കുള്ള ആഖ്യാനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ബന്ധകത്തിന് അധികമായ വ്യാഖ്യാനഭാരം നൽകുന്നില്ല.
- source_word: ἀναστὰν
  choice: എഴുന്നേറ്റ്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle-ന്റെ മുൻക്രമപ്രവർത്തനം മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാവിശേഷണരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: അവരെല്ലാവരും
  rationale: ἅπαν എന്ന സമഗ്രതയും αὐτῶν എന്ന പരാമർശവും ലളിതമായി പകരുന്നു. πλῆθος സൂചിപ്പിക്കുന്ന കൂട്ടത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തികളുടെ സമഗ്രസംഘമായി അവതരിപ്പിക്കുന്നു; ‘സഭ’ എന്ന് നൽകി ഔദ്യോഗിക സ്ഥാപനസ്വഭാവം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: ἤγαγον
  choice: കൊണ്ടുപോയി
  rationale: ἄγω എന്ന ക്രിയയുടെ ‘നയിക്കുക/കൊണ്ടുപോകുക’ എന്ന ചലനാർഥം ലക്ഷ്യസ്ഥാനത്തോടൊപ്പം സ്വാഭാവികമായി നൽകുന്നു; കസ്റ്റഡിയിലുള്ള യേശുവിനെ കൂട്ടിക്കൊണ്ടുപോകുന്ന സന്ദർഭത്തിനും യോജിക്കുന്നു.
- source_word: αὐτὸν
  choice: യേശുവിനെ
  rationale: ഗ്രീക്കിൽ സർവനാമമാണെങ്കിലും പുതിയ അധ്യായവിഭാഗത്തിന്റെ തുടക്കത്തിൽ മലയാളവായനക്കാരന് പരാമർശം വ്യക്തമായിരിക്കാനായി വ്യക്തിനാമം ഉപയോഗിക്കുന്നു.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: പീലാത്തൊസിന്റെ അടുക്കലേക്കു
  rationale: ചലനക്രിയയോടുകൂടിയ ἐπί + accusative സൂചിപ്പിക്കുന്ന വ്യക്തിയിലേക്കുള്ള ഗതി കൃത്യമായും സ്വാഭാവികമായും പകരുന്നു.
- source_word: Πιλᾶτον
  choice: പീലാത്തൊസ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ഗ്രീക്ക്-സമീപ ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ന്യായവിചാരണാസന്ദർഭത്തിലെ കൂട്ടായ കർത്താവിന്റെ അവതരണം
  choice: അവരെല്ലാവരും
  alternative: അവരുടെ സംഘം മുഴുവനും
  rationale: ഈ പ്രയോഗം സംഘത്തിലെ സമഗ്രത വ്യക്തമാക്കുന്നു; അതേസമയം πλῆθος എന്നതിനെ ഔദ്യോഗിക ‘സഭ’യായോ ക്രമരഹിത ‘ജനക്കൂട്ട’മായോ അതിവ്യാഖ്യാനിക്കുന്നില്ല. പകരംവായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവരെല്ലാവരും’ സാധാരണ വായനാസൗകര്യം നൽകുന്നു; അടിക്കുറിപ്പ് ഗ്രീക്കിലെ കൂട്ടനാമത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
