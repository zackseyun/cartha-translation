base_translation:
  language: en
  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: ml
  text: സൈനികരും അവന്റെ അടുത്തേക്കു വന്ന്, അവനു പുളിച്ച വീഞ്ഞ്[a] നീട്ടിക്കൊണ്ട് അവനെ പരിഹസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘വിനാഗിരി.’ ഗ്രീക്കിലെ ὄξος സാധാരണവും വിലകുറഞ്ഞതുമായ ഒരു പുളിച്ച വീഞ്ഞിനെയാണ് സൂചിപ്പിക്കുന്നത്; പരമ്പരാഗത വിവർത്തനങ്ങളിൽ ഇത് പലപ്പോഴും ‘വിനാഗിരി’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: പരിഹസിച്ചു
  rationale: ശത്രുതയും അവഹേളനവും നിറഞ്ഞ പരിഹാസത്തെയാണ് ἐμπαίζω ഇവിടെ സൂചിപ്പിക്കുന്നത്. ആ ഭാവം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ ‘പരിഹസിച്ചു’ വ്യക്തമാക്കുന്നു.
- source_word: δὲ ... καὶ οἱ στρατιῶται
  choice: പടയാളികളും
  rationale: δέ ആഖ്യാനത്തിന്റെ തുടർച്ചയും καί പടയാളികളെയും മുമ്പ് പരിഹസിച്ചവരോടു ചേർക്കുന്നതും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ഉം’ ഈ സംയുക്തഫലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἱ στρατιῶται
  choice: പടയാളികൾ
  rationale: റോമൻ വധശിക്ഷാസന്ദർഭത്തിലെ സൈനികരെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ മലയാളപദമാണിത്.
- source_word: προσερχόμενοι
  choice: അവന്റെ അടുത്തുവന്ന്
  rationale: യേശുവിന്റെ അടുക്കലേക്കുള്ള അവരുടെ നീക്കം പങ്കാളക്രിയയുടെ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὄξος
  choice: പുളിച്ച വീഞ്ഞ്
  rationale: ὄξος വിലകുറഞ്ഞ, അമ്ലതയുള്ള പുളിച്ച വീഞ്ഞിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക വായനക്കാർ ‘വിനാഗിരി’യെ പാചകച്ചേരുവയായി മാത്രം തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘പുളിച്ച വീഞ്ഞ്’ കൂടുതൽ കൃത്യമാണ്.
- source_word: προσφέροντες αὐτῷ
  choice: അവന് ... കൊടുത്തുകൊണ്ട്
  rationale: പാനീയം അവന് നൽകുന്ന പ്രവൃത്തി സൂചിപ്പിക്കുകയും ഗ്രീക്കിലെ പങ്കാളക്രിയാസംബന്ധം നിലനിർത്തുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: ὄξος നൽകുന്നതിൽ പടയാളികളുടെ ഉദ്ദേശ്യം
  choice: ഈ പ്രവൃത്തി പരിഹാസസന്ദർഭത്തിനുള്ളിൽ നിഷ്പക്ഷമായി വിവരിക്കുന്നു; അവരുടെ ഉദ്ദേശ്യം പ്രത്യേകം നിർവചിക്കുന്നില്ല.
  alternative: ഇത് കരുണാപ്രവൃത്തിയായിരുന്നു എന്നോ പൂർണമായും പീഡനപരമായ പരിഹാസമായിരുന്നു എന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: സമീപസന്ദർഭം പടയാളികളുടെ പെരുമാറ്റത്തെ പരിഹാസമായി അവതരിപ്പിക്കുന്നുവെങ്കിലും, പാനീയം നൽകിയതിന്റെ പ്രത്യേക മാനസികലക്ഷ്യം ഈ വാക്യം വിശദീകരിക്കുന്നില്ല. അതിനാൽ വിവർത്തനം പ്രവൃത്തി മാത്രം വ്യക്തമാക്കുകയും ഉദ്ദേശ്യത്തെക്കുറിച്ചുള്ള വാചകത്തിലെ തുറന്ന നില സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ പ്രധാന ക്രിയയും രണ്ട് പങ്കാളക്രിയകളും തമ്മിലുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തി; അനാവശ്യമായ ഉദ്ദേശ്യവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
