source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: ml
  text: 'സംഭവിച്ചത് കണ്ടപ്പോൾ ശതാധിപൻ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തിക്കൊണ്ട് പറഞ്ഞു: “തീർച്ചയായും ഈ മനുഷ്യൻ നീതിമാനായിരുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “നിരപരാധിയായിരുന്നു” അഥവാ “നീതിയുള്ളവനായിരുന്നു.” ഗ്രീക്ക് പദത്തിന് ഈ സന്ദർഭത്തിൽ ധാർമ്മിക നീതിയെയോ നിയമപരമായ നിരപരാധിത്വത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭൂതകാല പങ്കാളിത്തരൂപം മുഖ്യക്രിയയോടുള്ള കാലബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കണ്ടപ്പോൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇത് നേരിയ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിലെ വാക്യക്രമവും ‘കണ്ടപ്പോൾ’ എന്ന ഘടനയും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള അനാവശ്യ വൈരുധ്യം ചേർത്തിട്ടില്ല.
- source_word: ὁ ἑκατοντάρχης
  choice: ശതാധിപൻ
  rationale: റോമൻ സൈന്യത്തിലെ centurion എന്ന പദവിക്കുള്ള സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാളപദം.
- source_word: τὸ γενόμενον
  choice: സംഭവിച്ചത്
  rationale: തൊട്ടുമുമ്പ് നടന്ന സംഭവത്തെ സമാഹാരമായി സൂചിപ്പിക്കുന്ന articular participle-ന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐδόξαζεν τὸν θεὸν
  choice: ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി
  rationale: δοξάζω എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും ദൈവത്തിന് മഹത്ത്വം നൽകുക എന്ന ആശയവും നിലനിർത്തുന്നു; imperfect രൂപം ഇവിടെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലക്രിയയായി നൽകി.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: 'പങ്കാളിത്തരൂപം മലയാളത്തിൽ മുഖ്യക്രിയയോട് ഏകോപിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്: ‘മഹത്ത്വപ്പെടുത്തി പറഞ്ഞു’.'
- source_word: Ὄντως
  choice: തീർച്ചയായും
  rationale: ശക്തമായ ഉറപ്പിനെയും നിഗമനത്തെയും സമകാലിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: യേശുവിനെ ഒരു പുരുഷവ്യക്തിയായി നേരിട്ട് സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കൃത്യമായ രൂപം.
- source_word: δίκαιος
  choice: നീതിമാൻ
  rationale: ധാർമ്മിക നീതിയുടെയും ന്യായസ്ഥിതിയുടെയും ഭാരം നിലനിർത്തുന്നു; വിചാരണാസന്ദർഭത്തിൽ ‘നിരപരാധി’ എന്ന അർത്ഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ἦν
  choice: ആയിരുന്നു
  rationale: εἰμί എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശതാധിപന്റെ പ്രസ്താവനയിലെ δίκαιος എന്ന പദത്തിന്റെ അർത്ഥം
  choice: നീതിമാൻ
  alternative: നിരപരാധി; നീതിയുള്ളവൻ
  rationale: ‘നീതിമാൻ’ എന്നത് പദത്തിന്റെ ധാർമ്മികവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നു. അതേസമയം, ലൂക്കോസിലെ അന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ നിയമപരമായ ‘നിരപരാധി’ എന്ന അർത്ഥവും യഥാർത്ഥ സാധ്യതയാണ്; അതിനാൽ ആ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ശതാധിപൻ’, ‘മഹത്ത്വപ്പെടുത്തി’, ‘നീതിമാൻ’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടനയിൽ ഉപയോഗിച്ചു.
