  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς εὐτόνως κατηγοροῦντες αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: ml
  text: മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും അവിടെ നിന്നുകൊണ്ട് അവനെതിരെ തീവ്രമായി കുറ്റം ചുമത്തിക്കൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവനെതിരെ അതിതീവ്രമായി ആരോപണങ്ങൾ ഉന്നയിച്ചുകൊണ്ടിരുന്നു”; “അവനെ രൂക്ഷമായി കുറ്റപ്പെടുത്തിക്കൊണ്ടിരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: അവിടെ നിന്നുകൊണ്ട്
  rationale: ἵστημι എന്ന ക്രിയയുടെ ഈ ഭൂതകാലരൂപം അന്നത്തെ നിലയെയോ സാന്നിധ്യത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അവിടെ നിന്നുകൊണ്ട്’ രംഗവിവരണവും കൂടെ നടക്കുന്ന കുറ്റാരോപണവും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: -ഉം
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ കർത്താക്കളോടു ചേർന്ന ‘-ഉം’ സ്വാഭാവികമായ തുടർച്ച നൽകുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഒരേ സമയം പല മഹാപുരോഹിതന്മാർ ഔദ്യോഗിക പദവിയിൽ ഉണ്ടായിരുന്നു എന്നു സൂചിപ്പിക്കാതെ, പുരോഹിതനേതൃത്വത്തിലുള്ള പ്രമുഖ അധികാരികളെ സൂചിപ്പിക്കുന്ന പതിവായ പരിഭാഷ.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ γραμματεῖς എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും സ്ഥാപിതവുമായ മലയാളപരിഭാഷ; ‘നിയമപണ്ഡിതർ’ എന്നത് അർത്ഥം കൂടുതൽ വ്യാഖ്യാനിച്ചുപറയും.
- source_word: εὐτόνως
  choice: അതിശക്തമായി
  rationale: ആരോപണങ്ങളുടെ തീവ്രതയും ഊർജവും വ്യക്തമാക്കുന്ന, ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമായ പ്രയോഗം.
- source_word: κατηγοροῦντες
  choice: കുറ്റം ചുമത്തിക്കൊണ്ടിരുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപം അപ്പോൾ തുടർന്നുകൊണ്ടിരുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. നിയമപരമായ ആരോപണത്തിന്റെ ഭാവം ‘കുറ്റം ചുമത്തുക’ വ്യക്തമായി പകരുന്നു.
- source_word: αὐτοῦ
  choice: അവനെ
  rationale: κατηγορέω എന്ന ക്രിയയോടുള്ള ജനിറ്റീവ് ഇവിടെ ആരോപണത്തിന്റെ ലക്ഷ്യമായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവനെ കുറ്റം ചുമത്തുക’ എന്ന ഘടനയിലൂടെ അത് പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മുഖ്യപുരോഹിതന്മാർ’, ‘ശാസ്ത്രിമാർ’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; εὐτόνως എന്നതിന്റെ തീവ്രത ലളിതമായി വ്യക്തമാക്കി. അടിക്കുറിപ്പ് സൂചിക മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
