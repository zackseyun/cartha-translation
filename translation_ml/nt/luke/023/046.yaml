id: LUK.23.46
reference: Luke 23:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: ml
  text: 'യേശു ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു: “പിതാവേ, അങ്ങയുടെ കൈകളിൽ ഞാൻ എന്റെ ആത്മാവിനെ ഏൽപ്പിക്കുന്നു.”[a][b] ഇതു പറഞ്ഞശേഷം അദ്ദേഹം അന്ത്യശ്വാസം വിട്ടു.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞാൻ എന്റെ ആത്മാവിനെ ഭരമേൽപ്പിക്കുന്നു.” മറ്റൊരാളുടെ കരുതലിൽ ഏൽപ്പിക്കുക എന്ന അർഥം ഈ ക്രിയയ്ക്കുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: 'ഈ വാക്കുകൾ സങ്കീർത്തനം 31:5-നെ പ്രതിധ്വനിപ്പിക്കുന്നു (സെപ്റ്റുവജിന്റിൽ സങ്കീർത്തനം 30:6): “അങ്ങയുടെ കൈകളിൽ ഞാൻ എന്റെ ആത്മാവിനെ ഏൽപ്പിക്കുന്നു.”'
    reason: cross_reference
  - marker: c
    text: അഥവാ “അദ്ദേഹം പ്രാണൻ വിട്ടു” അല്ലെങ്കിൽ “മരിച്ചു”; അക്ഷരാർഥത്തിൽ ഈ ക്രിയ ശ്വാസം പുറത്തുവിടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു
  rationale: ശക്തവും കേൾക്കത്തക്കതുമായ ശബ്ദത്തിൽ വിളിച്ചുപറഞ്ഞുവെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: Πάτερ
  choice: പിതാവേ
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള സംബോധന നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘എന്റെ’ ചേർക്കുന്നില്ല.
- source_word: εἰς χεῖράς σου
  choice: അങ്ങയുടെ കൈകളിൽ
  rationale: മൂലത്തിലെ ബഹുവചനമായ ‘കൈകൾ’ നിലനിർത്തുകയും സങ്കീർത്തനം 31:5-ലെ തിരുവെഴുത്തുഭാഷയുടെ പ്രതിധ്വനി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: παρατίθεμαι
  choice: ഏൽപ്പിക്കുന്നു
  rationale: മറ്റൊരാളുടെ കരുതലിൽ ബോധപൂർവം ഭരമേൽപ്പിക്കുക എന്ന മധ്യപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ πνεῦμά μου
  choice: എന്റെ ആത്മാവിനെ
  rationale: πνεῦμα എന്ന പദത്തിന്റെ ‘ശ്വാസം/ആത്മാവ്’ എന്ന അർഥവ്യാപ്തിയിൽ, പിതാവിനോടുള്ള പ്രാർഥനാപരമായ സ്വയംഭരമേൽപ്പിക്കൽ എന്ന സന്ദർഭത്തിന് ‘ആത്മാവ്’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: τοῦτο δὲ εἰπών
  choice: ഇതു പറഞ്ഞശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് ഈ വാക്കുകൾ പറഞ്ഞുവെന്ന ക്രമം ചുരുക്കവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐξέπνευσεν
  choice: അന്ത്യശ്വാസം വിട്ടു
  rationale: പദത്തിലെ ‘ശ്വാസം പുറത്തുവിടുക’ എന്ന ദൃശ്യഭാവവും മരണത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗാർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὸ πνεῦμά μου എന്നതിന്റെ വിവർത്തനം
  choice: എന്റെ ആത്മാവിനെ
  alternative: എന്റെ ശ്വാസത്തെ
  rationale: പിതാവിനോടു ബോധപൂർവം സംസാരിച്ച് സ്വയം അവിടുത്തെ കരുതലിൽ ഏൽപ്പിക്കുന്ന സന്ദർഭം ‘ആത്മാവ്’ എന്ന വിവർത്തനത്തെ പിന്തുണയ്ക്കുന്നു; അതേസമയം പദത്തിന്റെ ശ്വാസസംബന്ധമായ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിക്കാം.
- issue: παρατίθεμαι എന്ന വർത്തമാനകാല മധ്യപ്രയോഗത്തിന്റെ ഭാവം
  choice: ഞാൻ … ഏൽപ്പിക്കുന്നു
  alternative: ഞാൻ … ഭരമേൽപ്പിക്കുന്നു
  rationale: ഈ പ്രഖ്യാപനത്തിന്റെ നിർവഹണാത്മകമായ വർത്തമാനഭാവവും യേശുവിന്റെ മനഃപൂർവമായ സ്വയംസമർപ്പണവും ലളിതമായ വർത്തമാനകാലത്തിൽ നിലനിർത്തുന്നു.
- issue: ἐξέπνευσεν എന്ന മരണസൂചന
  choice: അന്ത്യശ്വാസം വിട്ടു
  alternative: മരിച്ചു
  rationale: മരണം സംഭവിച്ചുവെന്ന അർഥം വ്യക്തമാകുമ്പോഴും, ഗ്രീക്ക് ക്രിയയിലെ ശ്വാസം പുറത്തുവിടുന്ന ദൃശ്യഭാവം നഷ്ടപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്നതിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചിരിക്കുന്നു. പരമ്പരാഗതമായെങ്കിലും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘പിതാവേ’, ‘ആത്മാവ്’, ‘അന്ത്യശ്വാസം വിട്ടു’ എന്നീ പ്രയോഗങ്ങൾ തിരഞ്ഞെടുത്തു.
