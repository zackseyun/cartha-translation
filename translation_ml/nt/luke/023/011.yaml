id: LUK.23.11
reference: Luke 23:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: ml
  text: എന്നാൽ ഹെരോദാവും തന്റെ പടയാളികളോടൊപ്പം അവനെ അവഹേളിക്കുകയും പരിഹസിക്കുകയും ചെയ്തു. അവനെ ശോഭയേറിയ ഒരു വസ്ത്രം[a] ധരിപ്പിച്ച്, പീലാത്തോസിന്റെ അടുക്കലേക്ക് തിരിച്ചയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിളക്കമുള്ള വസ്ത്രം’ അല്ലെങ്കിൽ ‘ശോഭയേറിയ അങ്കി.’ λαμπράν എന്ന പദത്തിന് ‘തിളക്കമുള്ള’ എന്നും ‘ശോഭയേറിയ’ എന്നും അർഥമാകാം. യേശുവിന് പരിഹാസകരമായ ബഹുമാനത്തിന്റെ ഭാവം നൽകിക്കൊണ്ട്, ഈ വസ്ത്രം ഹെരോദാവിന്റെ പരിഹാസത്തിന്റെ ഭാഗമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: അവനെ അവഹേളിക്കുകയും
  rationale: ഒരാളെ വിലകെട്ടവനായി കണ്ട് നിന്ദയോടെ പെരുമാറുക എന്ന ക്രിയാത്മക അർഥം ‘അവഹേളിക്കുക’ സ്വാഭാവികമായും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: തന്റെ പടയാളികളോടൊപ്പം
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ στράτευμα സൂചിപ്പിക്കുന്ന സൈനികരെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐμπαίξας
  choice: പരിഹസിക്കുകയും ചെയ്തു
  rationale: പരസ്യമായി കളിയാക്കുകയും അപമാനിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന, ഗൗരവമുള്ള ആധുനിക പ്രയോഗമാണ് ‘പരിഹസിക്കുക’.
- source_word: περιβαλὼν
  choice: ധരിപ്പിച്ച്
  rationale: ഒരാളുടെ മേൽ വസ്ത്രം ഇടുക എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐσθῆτα λαμπρὰν
  choice: മോടിയേറിയ വസ്ത്രം
  rationale: ἐσθής എന്നത് വസ്ത്രമോ ഉടുപ്പോ എന്നും λαμπρός എന്നത് തിളക്കമുള്ളതോ ശോഭയേറിയതോ മോടിയേറിയതോ എന്നും അർഥമാക്കാം. പ്രത്യേകിച്ച് രാജവസ്ത്രമെന്ന് നിർണയിക്കാതെ പരിഹാസപരമായ ആഡംബരഭാവത്തിന് ഇട നൽകുന്നു.
- source_word: ἀνέπεμψεν
  choice: തിരിച്ചയച്ചു
  rationale: മുമ്പത്തെ അധികാരിയായ പീലാത്തോസിന്റെ അടുക്കലേക്കു മടക്കി അയച്ചത് എന്ന നീതിന്യായസന്ദർഭത്തിലെ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: τῷ Πιλάτῳ
  choice: പീലാത്തോസിന്റെ അടുക്കലേക്ക്
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണവും ലക്ഷ്യദിശയുടെ സ്വാഭാവിക പ്രകടനവുമാണ്.
- source_word: δὲ ... καὶ ὁ Ἡρῴδης
  choice: എന്നാൽ ഹെരോദാവും
  rationale: δὲ-യുടെ ആഖ്യാനബന്ധവും καί നൽകുന്ന ‘ഹെരോദാവും’ എന്ന ഉൾപ്പെടുത്തൽഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: വസ്ത്രത്തിലൂടെയുള്ള ഹെരോദാവിന്റെ പരിഹാസത്തിന്റെ സ്വഭാവം
  choice: പരിഹാസപരമായ ബഹുമാനപ്രകടനത്തിന് ഇട നൽകിക്കൊണ്ട്, ഗ്രീക്ക് പറയുന്നതിലധികം നിർവചിക്കാതെ ‘മോടിയേറിയ വസ്ത്രം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: അതിനെ പ്രത്യേകമായി രാജകീയ അങ്കിയെന്നോ ഭ്രാന്തിന്റെ അല്ലെങ്കിൽ ലഘുചിത്തതയുടെ അടയാളമെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം അവഹേളനവും പരിഹാസവും വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും, വസ്ത്രത്തെക്കുറിച്ച് തിളക്കമുള്ളത്/ശോഭയേറിയത്/മോടിയേറിയത് എന്നതിലധികം ഗ്രീക്ക് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അപമാനകരമായ വിരോധാഭാസം നിലനിർത്തുകയും പ്രത്യേക പ്രതീകവ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്ക് സർവനാമത്തിൽ ഇല്ലാത്ത ആദരസൂചന ചേർക്കാതിരിക്കാൻ ‘അവനെ’ നിലനിർത്തി; ‘അവഹേളിക്കുക’, ‘പരിഹസിക്കുക’ എന്നീ പദങ്ങൾ അപമാനത്തിന്റെ പൊതുവായ സ്വഭാവം വ്യക്തമായി നൽകുന്നു.
