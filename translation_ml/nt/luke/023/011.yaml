- from: എന്നാൽ ഹെരോദാവും തന്റെ പടയാളികളോടൊപ്പം അവനെ അവഹേളിക്കുകയും പരിഹസിക്കുകയും ചെയ്തു. പിന്നെ അവനെ മോടിയേറിയ വസ്ത്രം[a] ധരിപ്പിച്ച് പീലാത്തോസിന്റെ അടുക്കലേക്കു തിരിച്ചയച്ചു.
  to: എന്നാൽ ഹെരോദാവും തന്റെ പടയാളികളോടൊപ്പം അവനെ അവഹേളിക്കുകയും പരിഹസിക്കുകയും ചെയ്തു. അവനെ ശോഭയേറിയ ഒരു വസ്ത്രം[a] ധരിപ്പിച്ച്, പീലാത്തോസിന്റെ അടുക്കലേക്ക് തിരിച്ചയച്ചു.
  rationale: വസ്ത്രത്തെക്കുറിച്ചുള്ള പ്രയോഗം മാത്രം ചെറുതായി പരിഷ്കരിച്ചു. ഇതിലൂടെ λαμπράν-ന്റെ അർഥപരിധി കൂടുതൽ നേരിട്ട് പ്രതിഫലിക്കുകയും ἐσθῆτα-യുടെ ഏകവചനം പ്രകടമാകുകയും ചെയ്യുന്നു. പാഠം വസ്ത്രത്തിന്റെ പ്രതീകാത്മക അർഥം നിർണയിക്കുന്നില്ല; അടിക്കുറിപ്പ് അതിന്റെ സാധ്യമായ പരിഹാസസന്ദർഭം വ്യാഖ്യാനമെന്ന നിലയിൽ മാത്രമാണ് സൂചിപ്പിക്കുന്നത്.
