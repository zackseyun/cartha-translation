id: LUK.23.53
reference: Luke 23:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: ml
  text: അവനെ താഴെയിറക്കിയശേഷം ലിനൻ തുണിയിൽ പൊതിഞ്ഞ്, പാറയിൽ വെട്ടിയുണ്ടാക്കിയ ഒരു കല്ലറയിൽ[a] വെച്ചു; അവിടെ അതുവരെ ആരെയും കിടത്തിയിരുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാറയിൽ വെട്ടിയുണ്ടാക്കിയ ഒരു കല്ലറയിൽ” അല്ലെങ്കിൽ “കൊത്തിയുണ്ടാക്കിയ ഒരു കല്ലറയിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവിടെ മുമ്പൊരിക്കലും ആരും കിടന്നിരുന്നില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: അവനെ താഴെയിറക്കിയശേഷം
  rationale: καθαιρέω എന്ന ക്രിയയുടെ ഭൂതകാല ക്രിയാവിശേഷണരൂപം യേശുവിന്റെ ശരീരം ക്രൂശിൽനിന്ന് താഴെയിറക്കിയ പ്രവൃത്തി തുടർന്നുള്ള പ്രവൃത്തികൾക്കുമുമ്പ് നടന്നതായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐνετύλιξεν
  choice: പൊതിഞ്ഞ്
  rationale: തുണികൊണ്ട് ചുറ്റിപ്പൊതിയുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ശവസംസ്കാരവിശദാംശങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: σινδόνι
  choice: ഒരു ചണവസ്ത്രത്തിൽ
  rationale: σινδών ഇവിടെ പൊതിയാൻ ഉപയോഗിച്ച ലിനൻ തുണിയെ സൂചിപ്പിക്കുന്നു. ‘ചണവസ്ത്രം’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും ശവക്കച്ച എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: ἔθηκεν
  choice: വെച്ചു
  rationale: τίθημι എന്ന ക്രിയയുടെ ‘വയ്ക്കുക’ എന്ന ലളിതമായ അർഥം നൽകുന്നു; അവസാന ഭാഗത്തെ κείμενος-നായി ‘കിടത്തുക’ നിലനിർത്തുന്നു.
- source_word: μνήματι
  choice: ഒരു കല്ലറയിൽ
  rationale: μνῆμα ഒരു സംസ്കാരസ്ഥലത്തെയോ കല്ലറയെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിന് ‘കല്ലറ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: λαξευτῷ
  choice: കല്ലിൽ വെട്ടിയുണ്ടാക്കിയ
  rationale: λαξευτός എന്നത് കല്ലിലോ പാറയിലോ വെട്ടിയുണ്ടാക്കിയതിനെ സൂചിപ്പിക്കുന്നു. വിവരണം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് പഴഞ്ചൻ ശൈലി ഒഴിവാക്കുന്നു.
- source_word: οὗ
  choice: അവിടെ
  rationale: കല്ലറയെ പരാമർശിക്കുന്ന സ്ഥലസംബന്ധിയായ സർവനാമത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: അതുവരെ ആരെയും കിടത്തിയിരുന്നില്ല
  rationale: οὔπω നൽകുന്ന ‘ഇതുവരെ/അതുവരെ ഇല്ല’ എന്ന കാലാർഥവും കല്ലറ മുമ്പ് ഉപയോഗിച്ചിട്ടില്ലെന്ന ആശയവും സംരക്ഷിക്കുന്നു. സംസ്കാരസന്ദർഭത്തിൽ κείμενος-നെ ‘കിടത്തിയിരുന്നു’ എന്നു നൽകുന്നത് സ്വാഭാവികമാണ്.
theological_decisions:
- issue: സംസ്കാരവിവരണവും കല്ലറയുടെ സ്വഭാവവും
  choice: യേശുവിനെ കല്ലിൽ വെട്ടിയുണ്ടാക്കിയതും അതുവരെ ആരെയും കിടത്തിയിട്ടില്ലാത്തതുമായ ഒരു കല്ലറയിൽ വെച്ചു.
  alternative: യേശുവിനെ പാറയിൽ കൊത്തിയുണ്ടാക്കിയ, മുമ്പൊരിക്കലും ആരും കിടന്നിട്ടില്ലാത്ത ഒരു കല്ലറയിൽ വെച്ചു.
  rationale: വാക്യം ചരിത്രപരമായ സംസ്കാരവിശദാംശമാണ് നൽകുന്നത്. സമാന്തരവിവരണങ്ങളിൽനിന്നുള്ള വിവരങ്ങളോ അധിക ദൈവശാസ്ത്രനിഗമനങ്ങളോ ചേർക്കാതെ മൂലപാഠത്തിലെ വിവരണം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ക്രിയകളുടെ ക്രമം ഗ്രീക്ക് വാക്യത്തിലെ സംഭവക്രമം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട വാചകഭാഗങ്ങളോടു ചേർത്തിരിക്കുന്നു.
