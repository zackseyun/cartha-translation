reference: Luke 13:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ മുന്തിരിത്തോട്ടക്കാരനോടു പറഞ്ഞു: “നോക്കൂ, മൂന്നു വർഷമായി ഞാൻ ഈ അത്തിവൃക്ഷത്തിൽ ഫലം അന്വേഷിച്ചുവരുന്നു; ഒന്നും കണ്ടെത്തിയില്ല. അതു വെട്ടിക്കളയുക. അത് നിലത്തെയും എന്തിന് നിഷ്ഫലമാക്കണം?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത് എന്തിന് നിലം വെറുതെ ഉപയോഗിച്ചുകൊണ്ടിരിക്കണം?” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് നിലത്തെ നിഷ്ഫലമാക്കുക എന്നോ ഫലമില്ലാതെ നിലം ഉപയോഗിക്കുകയോ കൈവശപ്പെടുത്തുകയോ ചെയ്യുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: മുന്തിരിത്തോട്ടക്കാരൻ
  rationale: മുന്തിരിത്തോട്ടം കൃഷിചെയ്തു പരിപാലിക്കുന്ന ആളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; വിശാലമായ ‘തോട്ടക്കാരൻ’ എന്നതിനെക്കാൾ സന്ദർഭം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: മൂന്നു വർഷമായി
  rationale: കഴിഞ്ഞകാലത്ത് ആരംഭിച്ച് ഇപ്പോഴും തുടരുന്ന കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔρχομαι ζητῶν
  choice: അന്വേഷിച്ചുവരുന്നു
  rationale: മൂന്നു വർഷക്കാലത്തെ ആവർത്തിതമോ തുടർന്നുവരുന്നതോ ആയ അന്വേഷണമെന്ന ഭാവം സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: καρπὸν
  choice: ഫലം
  rationale: ഉപമയിലെ അക്ഷരാർഥ കൃഷിചിത്രം നിലനിർത്തുന്നു; വ്യാഖ്യാനം വാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: συκῇ
  choice: അത്തിവൃക്ഷം
  rationale: സാധാരണവും കൃത്യവുമായ സസ്യനാമം.
- source_word: οὐχ εὑρίσκω
  choice: ഒന്നും കണ്ടെത്തിയില്ല
  rationale: തുടർച്ചയായ അന്വേഷണത്തിന്റെ ഇതുവരെയുള്ള പരാജയഫലം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു, ഗ്രീക്ക് വർത്തമാനത്തിന്റെ പ്രസംഗസന്ദർഭം നിലനിർത്തിക്കൊണ്ട്.
- source_word: ἔκκοψον
  choice: വെട്ടിക്കളയുക
  rationale: വൃക്ഷം മുറിച്ചുനീക്കാനുള്ള നേരിട്ടുള്ള കല്പന വ്യക്തമാക്കുന്നു.
- source_word: γῆν
  choice: നിലം
  rationale: കൃഷിസന്ദർഭത്തിൽ മണ്ണിനെയും കൃഷിസ്ഥലത്തെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: καταργεῖ
  choice: നിഷ്ഫലമാക്കണം
  rationale: വൃക്ഷം സ്ഥലം കൈവശപ്പെടുത്തുന്നതു മാത്രമല്ല, നിലത്തെ ഫലപ്രദമല്ലാതാക്കുന്നു എന്ന ക്രിയയുടെ ശക്തമായ സാധ്യത പ്രതിഫലിപ്പിക്കുന്നു; മറ്റൊരു സന്ദർഭോചിത അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉപമാചിത്രമോ തുറന്ന ദൈവശാസ്ത്ര വ്യാഖ്യാനമോ
  choice: കൃഷിയുമായി ബന്ധപ്പെട്ട ഭാഷ അക്ഷരാർഥത്തിൽ നിലനിർത്തുക
  alternative: ആത്മീയ ഫലശൂന്യതയെ വാചകത്തിൽ നേരിട്ട് വ്യക്തമാക്കുക
  rationale: മൂലവാക്യം ഉപമാചിത്രം മാത്രമാണ് നൽകുന്നത്; അതിന്റെ ദൈവശാസ്ത്ര വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ സന്ദർഭത്തിന് വിടുന്നു.
- issue: καταργεῖ എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി
  choice: നിലത്തെ നിഷ്ഫലമാക്കുക
  alternative: നിലം വെറുതെ ഉപയോഗിച്ചുകൊണ്ടിരിക്കുക
  rationale: ക്രിയയ്ക്ക് പ്രവർത്തനരഹിതമാക്കുക, പ്രയോജനശൂന്യമാക്കുക എന്ന ശക്തമായ അർഥമുണ്ട്; എന്നാൽ സ്ഥലം പാഴാക്കുന്നു എന്ന സന്ദർഭോചിത വായനയും സാധ്യമായതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘നോക്കൂ’ സംഭാഷണത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ‘മുന്തിരിത്തോട്ടക്കാരൻ’ കൃഷിസന്ദർഭം കൃത്യമായി സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് പ്രധാന വാചകത്തിലെ യഥാർഥ നിഘണ്ടുപരമായ അനിശ്ചിതത്വം വ്യക്തമാക്കുന്നു.
