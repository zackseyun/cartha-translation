id: LUK.13.5
reference: Luke 13:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: ml
  text: അല്ല, ഞാൻ നിങ്ങളോടു പറയുന്നു; എന്നാൽ നിങ്ങൾ മാനസാന്തരപ്പെടുന്നില്ലെങ്കിൽ, നിങ്ങളെല്ലാവരും അതുപോലെ നശിച്ചുപോകും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതേ രീതിയിൽ നശിച്ചുപോകും.’ മുൻപ് പറഞ്ഞ ഉദാഹരണങ്ങളുടെ വെളിച്ചത്തിൽ, ഗ്രീക്കിലെ ‘അതുപോലെ’ എന്ന പദം സമാനമായ ഒരു ന്യായവിധിയുടെ രീതിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: അല്ല
  rationale: മുൻസന്ദർഭത്തിൽ സൂചിതമായ ചോദ്യത്തിനുള്ള ഊന്നലുള്ള നിഷേധം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ലൂക്കോസിൽ പതിവായ പ്രയോഗത്തെ വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അടുത്തായി നിലനിർത്തുന്നു.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: എന്നാൽ ... ഇല്ലെങ്കിൽ
  rationale: വിരുദ്ധതിരിവും ശക്തമായ നിബന്ധനയും മലയാളത്തിലെ സ്വാഭാവികമായ വ്യവസ്ഥാവാക്യരൂപത്തിൽ നൽകുന്നു.
- source_word: μετανοῆτε
  choice: നിങ്ങൾ മാനസാന്തരപ്പെടുന്നില്ലെങ്കിൽ
  rationale: ദൈവത്തിങ്കലേക്കുള്ള പശ്ചാത്താപപരമായ തിരിഞ്ഞുവരവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിത ബൈബിൾപദം ഉപയോഗിക്കുന്നു; വെറും ചിന്താമാറ്റമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: πάντες
  choice: നിങ്ങളെല്ലാവരും
  rationale: മുന്നറിയിപ്പ് കേൾക്കുന്ന എല്ലാവരെയും ഒഴിവില്ലാതെ ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ὡσαύτως
  choice: അതുപോലെ
  rationale: മുൻപ് പറഞ്ഞ സംഭവങ്ങളോടുള്ള താരതമ്യം നിലനിർത്തുന്നു; താരതമ്യം രീതി, ഉറപ്പ്, അപ്രതീക്ഷിതത്വം എന്നിവയിൽ ഏതിനാണെന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἀπολεῖσθε
  choice: നശിച്ചുപോകും
  rationale: ἀπόλλυμι സൂചിപ്പിക്കുന്ന നാശത്തിന്റെ ഗൗരവം നിലനിർത്തുകയും അതിനെ കേവലം ശാരീരിക മരണമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ മുന്നറിയിപ്പിലെ മാനസാന്തരത്തിന്റെ അർഥം
  choice: μετανοῆτε എന്നത് ‘മാനസാന്തരപ്പെടുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: മനം മാറ്റുക; തിരിഞ്ഞുവരുക
  rationale: ഇത് വെറും ബൗദ്ധികമായ മനമാറ്റമോ വികാരപരമായ ദുഃഖമോ മാത്രമല്ല; അതേസമയം പിൽക്കാല വ്യവസ്ഥിത ദൈവശാസ്ത്രത്തിന്റെ മുഴുവൻ നിർവചനവും വാക്യത്തിലേക്ക് ഇറക്കിവയ്ക്കുന്നില്ല.
- issue: ὡσαύτως ἀπολεῖσθε എന്നതിന്റെ വ്യാപ്തി
  choice: ‘അതുപോലെ നശിച്ചുപോകും’ എന്നു പരിഭാഷപ്പെടുത്തി, കൃത്യമായ താരതമ്യാംശം തുറന്നുവെച്ചു.
  alternative: അതേ രീതിയിൽ നശിച്ചുപോകും; അതുപോലെ മരിക്കും
  rationale: മുൻ സംഭവങ്ങളിലുള്ളവരോടു താരതമ്യപ്പെടുത്തുന്ന ന്യായവിധിയുടെ മുന്നറിയിപ്പ് വ്യക്തമാണ്; എന്നാൽ താരതമ്യം മരണരീതിയിലോ ന്യായവിധിയുടെ ഉറപ്പിലോ അപ്രതീക്ഷിതത്വത്തിലോ ആണെന്ന് ഗ്രീക്ക് കൃത്യമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മാനസാന്തരപ്പെടുക’ എന്ന സ്ഥാപിത ബൈബിൾപദം സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന രീതിയിൽ നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ സൂചിക മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
