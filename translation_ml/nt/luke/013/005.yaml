  verdict: approve
  source_fidelity: The Malayalam accurately renders the emphatic negative οὐχί, the Lukan formula λέγω ὑμῖν, the adversative conditional ἀλλ’ ἐὰν μή, μετανοῆτε as established biblical Malayalam for repentance, the inclusive πάντες, and the deliberately broad comparison in ὡσαύτως ἀπολεῖσθε. ‘നശിച്ചുപോകും’ appropriately retains the grave, non-reductive force of ἀπολεῖσθε.
  naturalness: The sentence is fluent, clear, and suitably solemn in modern standard Malayalam. ‘അല്ല, ഞാൻ നിങ്ങളോടു പറയുന്നു; എന്നാൽ ...’ is natural in a formal biblical register. The placement of ‘നിങ്ങളെല്ലാവരും’ clearly conveys the scope of πάντες.
  terminology: ‘മാനസാന്തരപ്പെടുന്നില്ലെങ്കിൽ’ is a well-established, intelligible Malayalam biblical rendering of μετανοῆτε and avoids narrowing the term to an intellectual change alone. ‘അതുപോലെ’ preserves the Greek ambiguity without importing a specific theory of judgment. The footnote’s ‘സമാനമായ ഒരു ന്യായവിധിയുടെ രീതിയെ സൂചിപ്പിക്കാം’ is appropriately cautious.
