id: LUK.13.32
reference: Luke 13:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “പോയി ആ കുറുക്കനോടു പറയുക: ‘നോക്കൂ, ഇന്നും നാളെയും ഞാൻ ഭൂതങ്ങളെ പുറത്താക്കുകയും രോഗശാന്തികൾ നടത്തുകയും ചെയ്യുന്നു; മൂന്നാം ദിവസം ഞാൻ പൂർത്തീകരിക്കപ്പെടുന്നു[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഞാൻ ലക്ഷ്യത്തിലെത്തുന്നു’, ‘ഞാൻ പരിപൂർണനാക്കപ്പെടുന്നു’, ‘എന്റെ ദൗത്യം പൂർത്തിയാകുന്നു’. യേശുവിനു നിയമിക്കപ്പെട്ട ദൗത്യം അതിന്റെ പൂർത്തിയിലേക്കെത്തുന്നതിനെ ഈ ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι ταύτῃ
  choice: ആ കുറുക്കനോട്
  rationale: ἀλώπηξ എന്ന മൃഗനാമം അക്ഷരാർഥത്തിൽ നിലനിർത്തി രൂപകത്തിന്റെ നിന്ദാസ്വരം വായനക്കാരന് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ സംരക്ഷിക്കുന്നു; ταύτῃ എന്ന നിർദ്ദേശകത്തിന്റെ ശക്തി ‘ആ’ നൽകുന്നു.
- source_word: Ἰδοὺ
  choice: നോക്കൂ
  rationale: തുടർന്നുവരുന്ന വാക്കുകളിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന സംവാദസൂചകം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: ἐκβάλλω δαιμόνια
  choice: ഞാൻ ഭൂതങ്ങളെ പുറത്താക്കുന്നു
  rationale: സുവിശേഷങ്ങളിലെ ഭൂതോച്ചാടനത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ ശക്തിയും വർത്തമാനകാലവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἰάσεις ἀποτελῶ
  choice: രോഗശാന്തികൾ വരുത്തുന്നു
  rationale: ἰάσεις എന്ന നാമരൂപവും ἀποτελῶ എന്ന ‘നിറവേറ്റുക/ഫലിപ്പിക്കുക’ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; മുൻക്രിയയുമായി അനാവശ്യമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: σήμερον καὶ αὔριον
  choice: ഇന്നും നാളെയും
  rationale: ഹ്രസ്വവും നിശ്ചിതവുമായ കാലയളവ് സൂചിപ്പിക്കാവുന്ന മൂലപാഠത്തിലെ കാലജോടിയെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: τῇ τρίτῃ
  choice: മൂന്നാം ദിവസം
  rationale: കാലസൂചക ദത്തിവിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: τελειοῦμαι
  choice: ഞാൻ പൂർത്തിയാക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗവും ‘പൂർണതയിലേക്കു കൊണ്ടുവരപ്പെടുക/ദൗത്യം പൂർത്തിയാകുക’ എന്ന അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; അതിനെ പുനരുത്ഥാനമെന്നോ ധാർമിക പരിപൂർണതയെന്നോ മാത്രം നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: τελειοῦμαι എന്നതിന്റെ അർഥവും യേശുവിന്റെ ദൗത്യത്തിന്റെ സമാപ്തിയുമായുള്ള ബന്ധവും
  choice: ‘ഞാൻ പൂർത്തിയാക്കപ്പെടുന്നു’ എന്ന് കർമണിരൂപത്തിൽ വിവർത്തനം ചെയ്തു; നിയമിത ദൗത്യത്തിന്റെ പൂർത്തീകരണസാധ്യത തുറന്നുവെച്ചു.
  alternative: ‘ഞാൻ ലക്ഷ്യത്തിലെത്തുന്നു’, ‘ഞാൻ പരിപൂർണനാക്കപ്പെടുന്നു’, അല്ലെങ്കിൽ ‘എന്റെ ദൗത്യം ഞാൻ പൂർത്തിയാക്കുന്നു’.
  rationale: ഈ വാക്ക് യേശുവിന്റെ ശുശ്രൂഷ, മരണം, തുടർന്നുള്ള ദൈവിക സ്ഥിരീകരണം എന്നിവയുടെ പര്യവസാനത്തിലേക്കു സൂചന നൽകാം; എന്നാൽ ഗ്രീക്ക് ഇവിടെ പുനരുത്ഥാനത്തെ വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ മുഖ്യപാഠം ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥതുറപ്പും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘ആ കുറുക്കൻ’ എന്ന നേരിട്ടുള്ള രൂപകം നിലനിർത്തി; ‘പരിപൂർണനാക്കപ്പെടുന്നു’ എന്നത് ധാർമിക അപൂർണതയെ തെറ്റായി സൂചിപ്പിക്കാതിരിക്കാൻ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി, പദത്തിന്റെ കർമണിത്വവും തുറന്ന അർഥവും ‘പൂർത്തിയാക്കപ്പെടുന്നു’ എന്നതിലൂടെ സൂക്ഷിച്ചു.
