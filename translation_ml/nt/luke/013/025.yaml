language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: ml
  text: 'വീട്ടുടമ എഴുന്നേറ്റ് വാതിൽ അടച്ചുകഴിഞ്ഞാൽ[a], നിങ്ങൾ പുറത്ത് നിൽക്കാനും വാതിലിൽ മുട്ടാനും, ‘കർത്താവേ[b], ഞങ്ങൾക്കു തുറന്നുതരണമേ’ എന്നു പറയാനും തുടങ്ങും. അപ്പോൾ അദ്ദേഹം നിങ്ങളോടു പറയും: ‘നിങ്ങളെ എനിക്ക് അറിയില്ല; നിങ്ങൾ എവിടെനിന്നുള്ളവരാണെന്നും എനിക്കറിയില്ല.’[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘വീട്ടുടമ എഴുന്നേറ്റ് വാതിൽ അടച്ചശേഷം.’'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് κύριε പരമ്പരാഗതമായി ‘കർത്താവേ’; ഉപമയുടെ സന്ദർഭത്തിൽ ‘യജമാനനേ’ അല്ലെങ്കിൽ ‘അയ്യാ’ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: c
    text: 'ഗ്രീക്ക് കൂടുതൽ പദാനുപദമായി: ‘നിങ്ങളെ എനിക്ക് അറിയില്ല, നിങ്ങൾ എവിടെനിന്നുള്ളവരാണെന്ന്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: അടച്ചുകഴിഞ്ഞാൽ
  rationale: അനിശ്ചിതമായ ഭാവികാലസംബന്ധിയായ സമയബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘കഴിഞ്ഞാൽ’ എന്നു നൽകുന്നു; ‘ശേഷം’ എന്ന കൂടുതൽ ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐγερθῇ
  choice: എഴുന്നേറ്റ്
  rationale: ഇവിടെ ഇരുന്നോ ചാരിയിരുന്നോ നിലയിൽനിന്ന് എഴുന്നേൽക്കുന്നതാണ് അർഥം; പുനരുത്ഥാനം എന്ന അർഥമല്ല.
- source_word: ὁ οἰκοδεσπότης
  choice: വീട്ടുടമ
  rationale: വീടിന്റെ അധികാരമുള്ള യജമാനനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: വാതിൽ അടച്ചുകഴിഞ്ഞാൽ
  rationale: വാതിൽ അടച്ച് പ്രവേശനം അവസാനിപ്പിക്കുന്ന നിർണായക പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: ἔξω ἑστάναι καὶ κρούειν τὴν θύραν
  choice: പുറത്തുനിന്ന് വാതിലിൽ മുട്ടിക്കൊണ്ട്
  rationale: പുറത്ത് നിൽക്കുന്ന അവസ്ഥയും തുടർന്നുള്ള മുട്ടലും മലയാളത്തിൽ സ്വാഭാവികമായി സംയോജിപ്പിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവ് ദൈവശാസ്ത്രപരമായ അനുരണനം നിലനിർത്തുന്നു; ഉപമയിലെ അഭിസംബോധനയിൽ ‘യജമാനനേ’ എന്നും മനസ്സിലാക്കാം.
- source_word: ἄνοιξον ἡμῖν
  choice: ഞങ്ങൾക്കു തുറന്നുതരണമേ
  rationale: ദത്തിവായ ἡμῖν ഉൾപ്പെടുത്തി അപേക്ഷയുടെ ഭാവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: നിങ്ങൾ എവിടെനിന്നുള്ളവരാണെന്ന് എനിക്ക് അറിയില്ല
  rationale: ഗ്രീക്കിലെ ‘നിങ്ങളെ’ എന്ന കർമവും ‘എവിടെനിന്നുള്ളവർ’ എന്ന ഉറവിടവാക്യവും മലയാളത്തിൽ സ്വാഭാവികമായി ഒറ്റവാക്യത്തിൽ ഉൾക്കൊള്ളുന്നു; കൂടുതൽ പദാനുപദരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉപമയിലെ κύριε എന്ന അഭിസംബോധന
  choice: കർത്താവേ
  alternative: യജമാനനേ / അങ്ങുന്നേ
  rationale: ലൂക്കോസിലെ വിശാലമായ ദൈവശാസ്ത്രപരമായ അനുരണനം നഷ്ടപ്പെടുത്താതെ മുഖ്യമായ പദസാമ്യം നിലനിർത്തുന്നു; അതേസമയം ഉപമയുടെ തലത്തിൽ ഇത് വീട്ടുടമയോടുള്ള മാന്യമായ അഭിസംബോധനയായും കേൾക്കാം.
- issue: οὐκ οἶδα ὑμᾶς πόθεν ἐστέ എന്നതിന്റെ ഘടന
  choice: നിങ്ങൾ എവിടെനിന്നുള്ളവരാണെന്ന് എനിക്ക് അറിയില്ല
  alternative: നിങ്ങളെ എനിക്ക് അറിയില്ല—നിങ്ങൾ എവിടെനിന്നുള്ളവരാണെന്നും അറിയില്ല
  rationale: ഗ്രീക്കിലെ ഘടനയിൽ ഉള്ള തിരിച്ചറിവ്/ഉത്ഭവം സംബന്ധിച്ച സങ്കീർണതയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അറിയില്ല’ എന്ന നിരാകരണത്തിന്റെ പുറന്തള്ളൽബലം മൃദൂകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സംഭാഷണത്തിൽ ‘തരണമേ’ അപേക്ഷയുടെ ഗൗരവം നൽകുന്നു. മുഖ്യവാചകത്തിൽ സ്വാഭാവികത മുൻനിർത്തിയെങ്കിലും ഗ്രീക്കിലെ അസാധാരണമായ അവസാനവാക്യഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
