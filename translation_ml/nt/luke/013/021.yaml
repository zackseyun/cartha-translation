reference: Luke 13:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: ml
  text: അത് പുളിപ്പുമാവിനോട്[a] സദൃശമാണ്. ഒരു സ്ത്രീ അത് എടുത്ത് മൂന്ന് സാത്താ അളവ് മാവിൽ ഒളിപ്പിച്ചുവച്ചു[c], മാവ് മുഴുവനും പുളിക്കുംവരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യീസ്റ്റ്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം മാവ് പുളിപ്പിക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘കലർത്തി.’ ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘ഒളിപ്പിച്ചു’ അല്ലെങ്കിൽ ‘മറച്ചുവച്ചു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία
  choice: സദൃശമാണ്
  rationale: ഉപമ അവതരിപ്പിക്കുന്ന predicate adjective-ന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ζύμῃ
  choice: പുളിപ്പുമാവ്
  rationale: പുരാതനകാലത്ത് മാവ് പുളിപ്പിക്കാൻ ഉപയോഗിച്ചിരുന്ന പുളിച്ച മാവിന്റെ ഭാഗത്തെ സൂചിപ്പിക്കുകയും ബൈബിൾസംബന്ധമായ ദൃശ്യബിംബം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λαβοῦσα γυνὴ
  choice: ഒരു സ്ത്രീ അത് എടുത്ത്
  rationale: Aorist participle-നെ മലയാളത്തിലെ സ്വാഭാവികമായ തുടർച്ചയായ ക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἔκρυψεν
  choice: ഒളിപ്പിച്ചുവച്ചു
  rationale: ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥമായ ‘ഒളിപ്പിച്ചു/മറച്ചുവച്ചു’ എന്ന ആശയം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ‘കലർത്തി’ എന്ന പ്രായോഗിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: മൂന്ന് സാത്താ മാവിൽ
  rationale: സെമിറ്റിക് അളവായ σάτα-യെ ലിപ്യന്തരണം ചെയ്ത് മൂലഗ്രന്ഥത്തിന്റെ സാംസ്കാരിക പ്രത്യേകത നിലനിർത്തുന്നു; അളവിന്റെ വലിപ്പം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: ഒടുവിൽ അതു മുഴുവനും പുളിച്ചു
  rationale: പ്രക്രിയ മുഴുവൻ അളവിലേക്കും വ്യാപിച്ചതെന്ന totalizing sense സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഗ്രീക്കിലെ passive രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ intransitive ആയി നൽകുന്നു.
theological_decisions:
- issue: ഉപമയിലെ പുളിപ്പുമാവിന്റെ പ്രതീകാർഥം
  choice: പ്രതീകത്തെ വ്യാഖ്യാനപരമായി അനുകൂലമോ പ്രതികൂലമോ ആക്കാതെ ‘പുളിപ്പുമാവ്’ എന്നു നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തുക.
  alternative: മറ്റു വേദഭാഗങ്ങളെ അടിസ്ഥാനമാക്കി അതിനെ ദോഷത്തിന്റെ പ്രതീകമായി നിർവചിക്കുക, അല്ലെങ്കിൽ ദൈവരാജ്യത്തിന്റെ വളർച്ചയായി നേരിട്ട് വിശദീകരിക്കുക.
  rationale: വാക്യം തന്നെ പ്രതീകത്തിന്റെ മൂല്യനിർണയം തുറന്നുപറയുന്നില്ല; അതിനാൽ പരിഭാഷ വ്യാഖ്യാനവിവാദം തീർപ്പാക്കാതെ ഉപമയുടെ ദൃശ്യബിംബവും അതിന്റെ വ്യാപകപ്രഭാവവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ ശൈലി. മൂലത്തിലെ സാംസ്കാരിക അളവും ‘ഒളിപ്പിച്ചു’ എന്ന ശ്രദ്ധേയമായ ക്രിയയും നിലനിർത്തി; ആവശ്യമായ വിശദീകരണങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
