id: LUK.13.8
reference: Luke 13:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവനോടു മറുപടിയായി പറഞ്ഞു: “കർത്താവേ, ഈ വർഷവും അതിനെ വിട്ടേക്കണമേ[a], ഞാൻ അതിന്റെ ചുറ്റും കുഴിച്ച് ചാണകം[b] ഇടുന്നതുവരെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിനെ വെറുതെ വിടണമേ” അല്ലെങ്കിൽ “അതിനെ അതേപടി വിടണമേ.”
    reason: lexical_alternative
  - marker: b
    text: കൂടുതൽ പൊതുവായി, “വളം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς λέγει αὐτῷ
  choice: മറുപടിയായി അവനോടു പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും മുഖ്യക്രിയയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഘടന നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന അഭിസംബോധനയുടെ പതിവ് വിവർത്തനം നിലനിർത്തുന്നു; ഉപമയിലെ സാഹചര്യത്തിൽ ഇത് ഉടമയോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയായും വായിക്കാം.
- source_word: ἄφες αὐτὴν
  choice: അതിനെ വിട്ടേക്കണമേ
  rationale: മരം അതേപടി നിലനിൽക്കാൻ അനുവദിക്കുക എന്ന അടിസ്ഥാന അർഥം നൽകുന്നു; ‘രക്ഷിക്കണമേ’ എന്നത് സൂചിതമായ ഇളവ് കൂടുതൽ വ്യാഖ്യാനാത്മകമായി വ്യക്തമാക്കും.
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: ഈ വർഷവും
  rationale: καί നൽകുന്ന ‘കൂടി/വും’ എന്ന അർഥവും τοῦτο τὸ ἔτος എന്ന ‘ഈ വർഷം’ എന്ന സമയസൂചനയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἕως ὅτου
  choice: വരെ
  rationale: ആവശ്യപ്പെടുന്ന കാലതാമസത്തിന്റെ പരിധി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളബന്ധകം.
- source_word: σκάψω περὶ αὐτὴν
  choice: ഞാൻ അതിന്റെ ചുറ്റും കുഴിച്ച്
  rationale: σκάπτω എന്നതിന്റെ മൂർത്തമായ ‘കുഴിക്കുക’ എന്ന ദൃശ്യം നിലനിർത്തുന്നു; മണ്ണിളക്കുക എന്ന ഉദ്ദേശ്യം പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: βάλω κόπρια
  choice: ചാണകം ഇടുക
  rationale: κόπριαയുടെ കൃഷിസന്ദർഭത്തിലെ മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; പൊതുവായ ‘വളമിടുക’ എന്നതിനെക്കാൾ ഉറവിടത്തിന്റെ ദൃശ്യഭാവത്തോട് അടുത്തതാണ്.
theological_decisions:
- issue: ഉപമയ്ക്കുള്ളിലെ κύριος എന്ന അഭിസംബോധന
  choice: കർത്താവേ
  alternative: യജമാനനേ / അങ്ങുന്നേ
  rationale: ‘കർത്താവ്’ എന്ന സ്ഥിരമായ പദസമാനത നിലനിർത്തുന്നു. എങ്കിലും ഇവിടെ അത് ദൈവിക പദവി നിർബന്ധമായി പ്രഖ്യാപിക്കുന്നതല്ല; മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമയോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയായിരിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കൃഷിദൃശ്യം വ്യക്തമായി നിലനിർത്താൻ ‘ചാണകം’ ഉപയോഗിച്ചു; അഭ്യർഥനയുടെ വിനയം ‘-ണമേ’ രൂപത്തിലൂടെ പ്രകടമാക്കി.
