id: LUK.13.14
reference: Luke 13:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: ml
  text: 'എന്നാൽ, യേശു ശബ്ബത്തിൽ സൗഖ്യമാക്കിയതിൽ രോഷാകുലനായ സിനഗോഗ് പ്രമാണി മറുപടിയായി ജനക്കൂട്ടത്തോടു പറഞ്ഞു: “ജോലി ചെയ്യേണ്ട ആറു ദിവസങ്ങളുണ്ട്; അതുകൊണ്ട് ആ ദിവസങ്ങളിൽ വന്ന് സൗഖ്യം പ്രാപിക്കുവിൻ, ശബ്ബത്തുനാളിൽ അല്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρχισυνάγωγος
  choice: പള്ളിപ്രമാണി
  rationale: യഹൂദരുടെ പ്രാദേശിക ആരാധനാസമൂഹത്തിന്റെ കാര്യങ്ങൾ മേൽനോട്ടം വഹിച്ചിരുന്ന ഉദ്യോഗസ്ഥനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പ്രയോഗമാണിത്.
- source_word: ἀγανακτῶν
  choice: രോഷാകുലനായ
  rationale: വെറും കോപത്തേക്കാൾ, തെറ്റു സംഭവിച്ചെന്ന ബോധത്തോടുകൂടിയ ശക്തമായ അതൃപ്തിയാണ് ഗ്രീക്കുപദം സൂചിപ്പിക്കുന്നത്.
- source_word: ἐθεράπευσεν
  choice: സൗഖ്യമാക്കിയതിൽ
  rationale: സന്ദർഭത്തിൽ θεραπεύω രോഗശാന്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; കാരണാർഥകമായ ὅτιയോടൊപ്പം സ്വാഭാവിക മലയാളവാക്യമായി രൂപപ്പെടുത്തി.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: ജനക്കൂട്ടത്തോടു പറഞ്ഞു
  rationale: ഇംപെർഫെക്റ്റിന്റെ അപൂർണഭാവം ഇവിടെ നിർബന്ധമായി ആവർത്തനമായി വ്യക്തമാക്കാതെ, മലയാളത്തിലെ സ്വാഭാവിക കഥനരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: ജോലി ചെയ്യേണ്ടതിന് ആറു ദിവസങ്ങളുണ്ടല്ലോ
  rationale: δεῖയിലെ ബാധ്യതാഭാവം ‘ചെയ്യേണ്ടതിന്’ എന്നതിൽ നിലനിർത്തുകയും, അധികാരിയുടെ ശാസനസ്വരം ‘ഉണ്ടല്ലോ’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: അതുകൊണ്ട് ആ ദിവസങ്ങളിൽ വന്ന് സൗഖ്യം പ്രാപിക്കുവിൻ
  rationale: οὖνന്റെ നിഗമനബന്ധവും ἐρχόμενοι എന്ന ചലനാർഥവും കല്പനയുടെ ബലവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: ശബ്ബത്തുനാളിൽ
  rationale: ‘ശബ്ബത്തിന്റെ ദിവസം’ എന്ന ഗ്രീക്ക് ഘടനയുടെ അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ജോലിക്കും രോഗശാന്തിക്കും യോജിച്ച ദിവസങ്ങളെക്കുറിച്ചുള്ള പള്ളിപ്രമാണിയുടെ വാക്കുകൾ
  choice: അയാളുടെ നിയമബദ്ധമായ എതിർപ്പായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി; വിവരണകർത്താവിന്റെ അംഗീകാരമായി അവതരിപ്പിച്ചില്ല.
  alternative: കപടഭക്തിയെ മുൻകൂട്ടി വിധിക്കുന്ന വ്യാഖ്യാനപരമായ പരാവർത്തനം
  rationale: വാക്യം അയാളുടെ നിലപാട് റിപ്പോർട്ട് ചെയ്യുന്നു; അതിനെ ദൈവിക നിയമമെന്നോ അടുത്ത വാക്യത്തിലെ യേശുവിന്റെ വിമർശനം മുൻകൂട്ടി ചേർത്തോ പരിഭാഷപ്പെടുത്തരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പള്ളിപ്രമാണി’ ചരിത്രപരമായ യഹൂദസന്ദർഭത്തിലെ സിനഗോഗ് അധികാരിയെ സൂചിപ്പിക്കുന്ന പരിചിതമായ ബൈബിൾ പ്രയോഗമായി ഉപയോഗിച്ചു. ഈ വാക്യത്തിൽ ആവശ്യമായ പാഠഭേദമോ നിർണായകമായ അർഥവൈകല്പികതയോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
