id: LUK.13.15
reference: Luke 13:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: ml
  text: 'എന്നാൽ കർത്താവ് അവനോടു മറുപടിയായി പറഞ്ഞു: “കപടക്കാരേ! നിങ്ങളിൽ ഓരോരുത്തനും ശബ്ബത്തിൽ തന്റെ കാളയെയോ കഴുതയെയോ തീറ്റത്തൊട്ടിയിൽനിന്ന്[a] അഴിച്ച് വെള്ളം കൊടുക്കാൻ കൊണ്ടുപോകാറില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് പദത്തിന് മൃഗങ്ങൾക്ക് തീറ്റ നൽകുന്ന സ്ഥലം, പുൽത്തൊട്ടി എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന ബഹുമാനപദവിയും ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- source_word: Ὑποκριταί
  choice: കപടക്കാരേ
  rationale: ബഹുവചന സംബോധനയുടെ മൂർച്ചയുള്ള ശാസന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത മതപരമായ പ്രത്യേകണം ചേർക്കുന്നില്ല.
- source_word: ἕκαστος ὑμῶν
  choice: നിങ്ങളിൽ ഓരോരുത്തനും
  rationale: ഓരോ വ്യക്തിയെയും പ്രത്യേകം ഉൾപ്പെടുത്തുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിതരണാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: τῷ σαββάτῳ
  choice: ശബ്ബത്തിൽ
  rationale: കാലസൂചക ദത്തിവിന്റെ അർഥം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ പദപ്രയോഗത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λύει
  choice: അഴിച്ച്
  rationale: തീറ്റത്തൊട്ടിക്കരികിൽ കെട്ടിയ മൃഗത്തിന്റെ കെട്ടഴിക്കുന്ന പ്രവൃത്തി സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: βοῦν
  choice: കാളയെ
  rationale: കാർഷിക പശുവർഗ മൃഗത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: ὄνον
  choice: കഴുതയെ
  rationale: ആധുനിക മലയാളത്തിലെ നേരിട്ടുള്ള സാധാരണ തത്തുല്യം.
- source_word: φάτνης
  choice: തീറ്റത്തൊട്ടിയിൽനിന്ന്
  rationale: മൃഗത്തിന് തീറ്റ നൽകുന്ന തൊട്ടി/സ്ഥലം എന്ന ദൃശ്യാർഥം വ്യക്തമായി നൽകുന്നു; പദത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπαγαγὼν
  choice: കൊണ്ടുപോകാറില്ലേ
  rationale: അഴിച്ചശേഷം മൃഗത്തെ മറ്റൊരിടത്തേക്ക് നയിക്കുന്ന പ്രവൃത്തിക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ποτίζει
  choice: വെള്ളം കൊടുക്കാൻ
  rationale: മൃഗത്തിന് കുടിക്കാൻ വെള്ളം നൽകുക എന്ന ക്രിയാർഥം ലളിതവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള ആഖ്യാനപദവി κύριος
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഇവിടെ ലൂക്കോസ് യേശുവിന് ഉപയോഗിക്കുന്ന ആഖ്യാനപദവിയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു; അതിനെ താഴ്ന്ന അർഥമുള്ള സാധാരണ യജമാനപദമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചോദ്യത്തിന്റെ വാക്ചാതുര്യവും ശാസനയുടെ മൂർച്ചയും നിലനിർത്തിയിരിക്കുന്നു.
