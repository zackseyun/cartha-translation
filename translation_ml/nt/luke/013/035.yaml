revisions:
- from: 'ഇതാ, നിങ്ങളുടെ ഭവനം നിങ്ങൾക്കുതന്നെ വിട്ടുകൊടുക്കപ്പെടുന്നു.[a] ഞാൻ നിങ്ങളോടു പറയുന്നു: ‘കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ അനുഗൃഹീതൻ’ എന്നു നിങ്ങൾ പറയുന്ന സമയം വരുന്നതുവരെ നിങ്ങൾ എന്നെ ഒരിക്കലും കാണുകയില്ല.[b][c][d]'
  to: 'ഇതാ, നിങ്ങളുടെ ഭവനം നിങ്ങൾക്കു വിട്ടുകൊടുക്കപ്പെട്ടിരിക്കുന്നു.[a] ഞാൻ നിങ്ങളോടു പറയുന്നു: ‘കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ അനുഗ്രഹിക്കപ്പെട്ടവൻ’ എന്നു നിങ്ങൾ പറയുന്ന സമയം വരുന്നതുവരെ നിങ്ങൾ എന്നെ ഒരിക്കലും കാണുകയില്ല.[b][c][d]'
