id: LUK.13.35
reference: Luke 13:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: ml
  text: 'ഇതാ, നിങ്ങളുടെ ഭവനം നിങ്ങൾക്കു വിട്ടുകൊടുക്കപ്പെട്ടിരിക്കുന്നു.[a] ഞാൻ നിങ്ങളോടു പറയുന്നു: ‘കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ അനുഗ്രഹിക്കപ്പെട്ടവൻ’ എന്നു നിങ്ങൾ പറയുന്ന സമയം വരുന്നതുവരെ നിങ്ങൾ എന്നെ ഒരിക്കലും കാണുകയില്ല.[b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിട്ടുകൊടുക്കപ്പെട്ടിരിക്കുന്നു’ എന്നത് ‘ഉപേക്ഷിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് കർമണിപ്രയോഗത്തിന് വിധിന്യായപരമായി കൈവിട്ടുകൊടുക്കപ്പെട്ടിരിക്കുന്നു എന്ന സൂചന ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളുടെ ഭവനം’ എന്നത് സാധ്യതയോടെ യെരൂശലേമിനെയും പ്രത്യേകിച്ച് അതിലെ ദേവാലയത്തെയും സൂചിപ്പിക്കുന്നു; എന്നാൽ ഗ്രീക്കിൽ ‘നിങ്ങളുടെ ഭവനം’ എന്നു മാത്രമാണ്.
    reason: alternative_reading
  - marker: c
    text: ‘കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ അനുഗ്രഹിക്കപ്പെട്ടവൻ’ എന്ന വാക്കുകൾ സങ്കീർത്തനം 118:26-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: d
    text: ചിലർ ഇത് യേശുവിന്റെ രാജകീയ യെരൂശലേം പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു; മറ്റുചിലർ ഭാവിയിൽ അവനെ അംഗീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതായി കാണുന്നു. ഗ്രീക്ക് വാചകം ഒരൊറ്റ കാലനിർണ്ണയം നിർബന്ധിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്നതും ഗൗരവമുള്ള പ്രഖ്യാപനം അവതരിപ്പിക്കുന്നതുമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀφίεται
  choice: വിട്ടുകൊടുക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗം നിലനിർത്തുകയും ‘ഉപേക്ഷിക്കപ്പെടുന്നു’ എന്ന കൂടുതൽ ശക്തമായ അർത്ഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ οἶκος ὑμῶν
  choice: നിങ്ങളുടെ ഭവനം
  rationale: ഗ്രീക്കിലെ അക്ഷരാർഥപരമായ വിശാലത സംരക്ഷിക്കുന്നു; യെരൂശലേമോ ദേവാലയമോ എന്ന് മുഖ്യവാചകത്തിൽ ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കുതന്നെ
  rationale: ദാതൃവിഭക്തിയുടെ ബന്ധവും വിധിന്യായപരമായ സൂചനയും മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: λέγω δὲ ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δέ ഇവിടെ സാവധാനമായ മുന്നേറ്റം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നിർബന്ധമില്ലാത്ത വിരോധബന്ധകം ചേർക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐ μὴ ἴδητέ με
  choice: നിങ്ങൾ എന്നെ ഒരിക്കലും കാണുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ ഭാവിനിഷേധം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἕως ἥξει ὅτε
  choice: സമയം വരുന്നതുവരെ
  rationale: ഗ്രീക്ക് കാലപ്രയോഗത്തിന്റെ ആശയം മലയാളത്തിലെ സ്വാഭാവിക ശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εἴπητε
  choice: നിങ്ങൾ പറയുന്ന
  rationale: ഭാവിയിൽ സംഭവിക്കുന്ന ഉച്ചാരണത്തെ ‘സമയം വരുന്നതുവരെ’ എന്ന ഘടനയ്ക്കുള്ളിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: Εὐλογημένος
  choice: അനുഗൃഹീതൻ
  rationale: സങ്കീർത്തനം 118:26-ലെ ആശീർവാദപ്രഖ്യാപനത്തിന്റെ തിരുവെഴുത്തുസ്വരം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ὁ ἐρχόμενος
  choice: വരുന്നവൻ
  rationale: നാമവൽക്കരിച്ച വർത്തമാന കൃദന്തത്തെ പ്രത്യേക പദവിയായി അതിവ്യാഖ്യാനിക്കാതെ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐν ὀνόματι κυρίου
  choice: കർത്താവിന്റെ നാമത്തിൽ
  rationale: തിരുവെഴുത്തുകളിൽ പരിചിതമായ പ്രയോഗവും κύριος എന്നതിന്റെ മാന്യമായ പരിഭാഷയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളുടെ ഭവനം’ എന്നതിന്റെ സൂചിതവിഷയം
  choice: മുഖ്യവാചകത്തിൽ ‘നിങ്ങളുടെ ഭവനം’ എന്നു തന്നെ നിലനിർത്തി
  alternative: യെരൂശലേം; ദേവാലയം; യിസ്രായേൽഭവനം/ജനത
  rationale: സന്ദർഭം യെരൂശലേമിനെയും പ്രത്യേകിച്ച് ദേവാലയത്തെയും സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് വാചകം ‘നിങ്ങളുടെ ഭവനം’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ വ്യാഖ്യാനപരമായ ചുരുക്കം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: അവസാന ഉദ്ധരണിയുടെ കാലപരമായ സൂചന
  choice: ഒരു പ്രത്യേക ചരിത്രപരമോ അന്ത്യകാലപരമോ ആയ നിറവേറ്റൽ നിർണ്ണയിക്കാത്ത ഭാവികാല പ്രസ്താവനയായി സൂക്ഷിച്ചു
  alternative: യേശുവിന്റെ രാജകീയ യെരൂശലേം പ്രവേശനം; യെരൂശലേമിന്റെ/യിസ്രായേലിന്റെ ഭാവി അംഗീകാരം; യേശുവിന്റെ മടങ്ങിവരവിലെ അംഗീകാരം
  rationale: ഗ്രീക്ക് വാചകം ഇവയിൽ ഒരൊറ്റ കാലനിർണ്ണയം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ യഥാർഥമായ വ്യാഖ്യാനവൈവിധ്യവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വ്യക്തതയും നിലനിർത്തി. ‘ഭവനം,’ ‘കർത്താവ്,’ ‘അനുഗൃഹീതൻ’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തിന്റെ ഔന്നത്യം കാത്തുസൂക്ഷിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
