id: LUK.13.29
reference: Luke 13:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: ml
  text: കിഴക്കുനിന്നും പടിഞ്ഞാറുനിന്നും വടക്കുനിന്നും തെക്കുനിന്നും ആളുകൾ വന്ന് ദൈവരാജ്യത്തിൽ വിരുന്നിനിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭക്ഷണത്തിനായി ചാരിക്കിടക്കും.” പുരാതനകാലത്ത് വിരുന്നിൽ ഭക്ഷണം കഴിക്കുമ്പോൾ ചാരിക്കിടക്കുന്ന പതിവിനെയാണ് ഗ്രീക്ക് ക്രിയ കൂടുതൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: ആളുകൾ വന്ന്
  rationale: ἥκωയുടെ ഭാവികാലരൂപം ഇവിടെ വിവിധ ദിക്കുകളിൽനിന്നുള്ള വരവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ തുടർന്നുള്ള ഭാവികാലക്രിയയോടു ചേർന്ന ‘വന്ന്’ സ്വാഭാവികമായി ഭാവിയർഥം നൽകുന്നു; ഗ്രീക്കിലെ വ്യക്തമല്ലാത്ത ബഹുവചന കർത്താവിനെ ‘ആളുകൾ’ എന്നു തുറന്നുകാട്ടുന്നു.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: കിഴക്കുനിന്നും പടിഞ്ഞാറുനിന്നും
  rationale: അക്ഷരാർഥത്തിൽ ‘സൂര്യോദയങ്ങൾ, സൂര്യാസ്തമയങ്ങൾ’ എന്ന ബഹുവചനങ്ങൾ ദിക്കുകളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ആ ദിശാവ്യാപ്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: വടക്കുനിന്നും തെക്കുനിന്നും
  rationale: ἀπόയോടു ചേർന്ന ഈ ദിക്കുകൾ മുമ്പുള്ള കിഴക്ക്–പടിഞ്ഞാറ് പരമ്പര പൂർത്തിയാക്കി നാലു ദിക്കുകളിൽനിന്നുമുള്ള വരവ് സൂചിപ്പിക്കുന്നു.
- source_word: ἀνακλιθήσονται
  choice: വിരുന്നിനിരിക്കും
  rationale: ἀνακλίνω വിരുന്നുസന്ദർഭത്തിൽ ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. പുരാതന ശരീരഭാവം അക്ഷരാർഥത്തിൽ പറഞ്ഞ് ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതെ, വിരുന്നിലെ പങ്കാളിത്തത്തിന്റെ ദൃശ്യബിംബം ‘വിരുന്നിനിരിക്കും’ നിലനിർത്തുന്നു.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിൽ
  rationale: βασιλεία τοῦ θεοῦ എന്ന ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള പ്രയോഗത്തിന്റെ നേരിട്ടും മലയാളത്തിൽ പതിവുമായ രൂപം.
theological_decisions:
- issue: അന്ത്യകാല ദൈവരാജ്യത്തിലെ വിരുന്നിന്റെ ദൃശ്യബിംബം
  choice: ‘വിരുന്നിനിരിക്കും’ എന്നു വിവർത്തനം ചെയ്ത് ഭക്ഷണവിരുന്നിന്റെ ചിത്രം നിലനിർത്തി.
  alternative: ‘ഇരിക്കും’ അല്ലെങ്കിൽ ‘പ്രവേശിക്കും’
  rationale: ക്രിയ കേവലം ഇരിപ്പിനെയോ പ്രവേശനത്തെയോ അല്ല, വിരുന്നിൽ ചാരിക്കിടന്ന് ഭക്ഷിക്കുന്ന ആചാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അധിക ദൈവശാസ്ത്രവിവരം ചേർക്കാതെ ആ പങ്കാളിത്തചിത്രം സംരക്ഷിക്കുന്നു.
- issue: നാലു ദിക്കുകളുടെ വ്യാപ്തി
  choice: കിഴക്ക്, പടിഞ്ഞാറ്, വടക്ക്, തെക്ക് എന്നീ ദിക്കുകൾ നേരിട്ട് നിലനിർത്തി; വരുന്നവരുടെ ജനവിഭാഗം നിർവചിച്ചില്ല.
  alternative: ‘സകല ജനതകളിൽനിന്നും’ അല്ലെങ്കിൽ ‘ജനതകൾ’ എന്നു വ്യാഖ്യാനിച്ച് ചേർക്കുക
  rationale: വാക്യം വിശാലമായ ഭൂമിശാസ്ത്രപരമായ സമാഹരണത്തെ സൂചിപ്പിച്ചാലും വരുന്നവരെ ജാതികളെന്നോ പ്രത്യേക ജനവിഭാഗമെന്നോ ഗ്രീക്ക് വാചകം വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘വിരുന്നിനിരിക്കും’ എന്നത് സ്വാഭാവികതയും മൂലപാഠത്തിലെ വിരുന്നുചിത്രവും സന്തുലിതമാക്കുന്നു. ഓരോ ദിക്കിനോടും ‘നിന്നും’ ആവർത്തിക്കുന്നത് ഗ്രീക്കിലെ ദിശാപരമ്പരയുടെ ഊന്നൽ മലയാളത്തിൽ നിലനിർത്തുന്നു.
