source:
  edition: SBLGNT
  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ശീലോഹാമിലെ ഗോപുരം അവരുടെമേൽ വീണ് അവരെ കൊന്ന ആ പതിനെട്ടുപേർ യെരൂശലേമിൽ താമസിച്ചിരുന്ന മറ്റെല്ലാവരെക്കാളും അധികം കടമുള്ളവരായിത്തീർന്നു എന്നു നിങ്ങൾ കരുതുന്നുവോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കടമുള്ളവർ” എന്നതിന് “പാപികൾ” എന്നോ “കൂടുതൽ കുറ്റക്കാരായവർ” എന്നോ അർഥമാകാം. ഗ്രീക്കിൽ അക്ഷരാർഥം “കടമുള്ളവർ” എന്നാണ്; ഇവിടെ ധാർമിക കടബാധ്യതയോ ഉത്തരവാദിത്വമോ സൂചിപ്പിക്കപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ ഉദാഹരണത്തിനു പകരമായി മറ്റൊരു ഉദാഹരണം അവതരിപ്പിക്കുന്ന വാക്യബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: ആ പതിനെട്ടുപേർ
  rationale: ലിംഗം മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ‘പുരുഷന്മാർ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായ പൊതുപദം ഉപയോഗിക്കുന്നു.
- source_word: ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ
  choice: ശീലോഹാമിലെ ഗോപുരം തങ്ങളുടെമേൽ വീണ്
  rationale: ഗോപുരം ‘വീണു’ എന്ന മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള ദൃശ്യഭാവം സൂക്ഷിക്കുകയും സ്ഥലപ്പേര് മലയാള ബൈബിൾ പ്രയോഗത്തിന് യോജിച്ച രൂപത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἀπέκτεινεν αὐτούς
  choice: കൊല്ലപ്പെട്ട
  rationale: അപകടത്തിന്റെ ഫലം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ഉദ്ദേശപൂർവമായ വധമെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: δοκεῖτε ὅτι
  choice: എന്നു നിങ്ങൾ കരുതുന്നുവോ?
  rationale: യേശുവിന്റെ നേരിട്ടുള്ള വെല്ലുവിളിയായ ചോദ്യരൂപം നിലനിർത്തുന്നു.
- source_word: ὀφειλέται ἐγένοντο
  choice: കടക്കാരായിത്തീർന്നു
  rationale: ὀφειλέται എന്ന പദത്തിന്റെ കടബാധ്യതാ രൂപകം സംരക്ഷിക്കുകയും ἐγένοντο എന്ന ക്രിയയുടെ ‘ആയിത്തീർന്നു’ എന്ന ചലനാത്മക അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: മറ്റെല്ലാവരെക്കാളും വലിയ
  rationale: παρά സൂചിപ്പിക്കുന്ന താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ἀνθρώπους ഇവിടെ പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിരപേക്ഷമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: യെരൂശലേമിൽ താമസിച്ചിരുന്ന
  rationale: നഗരനിവാസികളെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്തരൂപം സുതാര്യമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ ὀφειλέται എന്ന പദത്തിന്റെ അർഥം
  choice: കടക്കാർ
  alternative: പാപികൾ; കൂടുതൽ കുറ്റക്കാരായവർ
  rationale: മുൻവാക്യത്തിലെ ‘പാപികൾ’ എന്ന പദത്തിൽനിന്ന് ലൂക്കോസ് ഇവിടെ വ്യത്യസ്തമായി ഉപയോഗിക്കുന്ന കടബാധ്യതാ രൂപകം ഇല്ലാതാക്കാതെ സൂക്ഷിക്കുന്നു. ഇത് ദൈവസന്നിധിയിലെ ധാർമിക ബാധ്യത സൂചിപ്പിക്കാം; എന്നാൽ ആ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കുന്നില്ല.
- issue: ἀνθρώπους എന്ന പദത്തിന്റെ പരിധി
  choice: എല്ലാവർ
  alternative: എല്ലാ മനുഷ്യരും; എല്ലാ പുരുഷന്മാരും
  rationale: സന്ദർഭം യെരൂശലേമിലെ നിവാസികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അതിനാൽ പുരുഷന്മാർക്ക് മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കടക്കാരായിത്തീർന്നു’ എന്ന അസാധാരണമായെങ്കിലും ഉദ്ദേശപൂർവമായ പ്രയോഗം മൂലപാഠത്തിലെ കടബാധ്യതാ രൂപകവും ἐγένοντοയുടെ ക്രിയാഭാവവും സംരക്ഷിക്കുന്നു.
