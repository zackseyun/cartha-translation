- from: ഇതാ, പതിനെട്ടു വർഷമായി ബലഹീനതയുടെ ആത്മാവ്[a] ബാധിച്ച ഒരു സ്ത്രീ അവിടെയുണ്ടായിരുന്നു. അവൾ കുനിഞ്ഞ നിലയിലായിരുന്നു; പൂർണമായി നിവരാൻ അവൾക്കു കഴിഞ്ഞിരുന്നില്ല.
  to: ഇതാ, പതിനെട്ട് വർഷമായി ബലഹീനതയുടെ ആത്മാവുള്ള ഒരു സ്ത്രീ അവിടെയുണ്ടായിരുന്നു. അവൾ കുനിഞ്ഞ നിലയിലായിരുന്നു; പൂർണമായി നിവരാൻ അവൾക്കു കഴിഞ്ഞിരുന്നില്ല.
  rationale: The revision replaces the causative “ബാധിച്ച” with “ബലഹീനതയുടെ ആത്മാവുള്ള,” preserving the Greek’s explicit mention of a spirit while leaving unstated the precise nature of its relationship to the woman’s condition. The footnote is adjusted to avoid narrowing weakness/infirmity to disease.
