id: LUK.13.11
reference: Luke 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: ml
  text: ഇതാ, പതിനെട്ട് വർഷമായി ബലഹീനതയുടെ ആത്മാവുള്ള ഒരു സ്ത്രീ അവിടെയുണ്ടായിരുന്നു. അവൾ കുനിഞ്ഞ നിലയിലായിരുന്നു; പൂർണമായി നിവരാൻ അവൾക്കു കഴിഞ്ഞിരുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ആഖ്യാനത്തിൽ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യാക്ഷേപത്തിന്റെ സജീവത, ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γυνὴ
  choice: ഒരു സ്ത്രീ
  rationale: സന്ദർഭത്തിൽ ആദ്യമായി പരിചയപ്പെടുത്തുന്ന അനിശ്ചിത വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: ബലഹീനതയുടെ ആത്മാവ് ബാധിച്ച
  rationale: πνεῦμα എന്ന വ്യക്തമായ പരാമർശം നിലനിർത്തുകയും, ഇത് ഭൂതബാധയാണെന്നോ കേവലം വൈദ്യശാസ്ത്രപരമായ രോഗമാണെന്നോ വാക്യം പറയുന്നതിലധികം നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിലെ ‘ബാധിച്ച’ എന്ന പ്രയോഗം സ്ത്രീയുടെ ദുരവസ്ഥ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀσθενείας
  choice: ബലഹീനത
  rationale: ശാരീരിക ദൗർബല്യവും രോഗബാധയും ഉൾക്കൊള്ളാവുന്ന വിശാല അർഥപരിധി നിലനിർത്തുന്നു; ‘രോഗം’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἔτη δεκαοκτώ
  choice: പതിനെട്ടു വർഷമായി
  rationale: ദൈർഘ്യം സ്വാഭാവികമായ മലയാള കാലപ്രയോഗത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: συγκύπτουσα
  choice: കുനിഞ്ഞ നിലയിലായിരുന്നു
  rationale: സ്ത്രീയുടെ തുടർച്ചയായ ശാരീരികാവസ്ഥ വ്യക്തവും അതിശയോക്തിയില്ലാതെയും അറിയിക്കുന്നു.
- source_word: μὴ δυναμένη ἀνακύψαι
  choice: നിവരാൻ അവൾക്കു കഴിഞ്ഞിരുന്നില്ല
  rationale: നിവർന്ന നിലയിലേക്കു വരാനുള്ള കഴിവില്ലായ്മ സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: εἰς τὸ παντελές
  choice: പൂർണമായി
  rationale: നിവരാനുള്ള കഴിവില്ലായ്മയുടെ പൂർണതയെ മൂലപാഠം ഊന്നിപ്പറയുന്നതു നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεῦμα ἀσθενείας എന്നത് ആത്മീയ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘ബലഹീനതയുടെ ആത്മാവ്’ എന്ന വ്യക്തമായ ആത്മപരാമർശം നിലനിർത്തി
  alternative: ബലഹീനത വരുത്തുന്ന ഒരു ആത്മാവ്; രോഗബാധയുടെ ആത്മാവ്; ഒരു രോഗം ബാധിച്ച
  rationale: ഗ്രീക്ക് πνεῦμα (‘ആത്മാവ്’) എന്നു വ്യക്തമായി പറയുന്നു. അതിനെ കേവലം വൈദ്യശാസ്ത്രപരമായ അവസ്ഥയായി ചുരുക്കാതെ, അതേസമയം ഈ വാക്യം പറയുന്നതിലധികം നിർദിഷ്ടമായ ഭൂതശാസ്ത്രവാദം ചേർക്കാതെയും പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥസാധ്യതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ മൂലപാഠത്തിന്റെ ശ്രദ്ധാകർഷകത നിലനിർത്തുന്നു; അപൂർവമായ ദൈവശാസ്ത്രപദങ്ങൾ ഒഴിവാക്കി, ‘ആത്മാവ്’ എന്ന നിർണായക പദം സംരക്ഷിച്ചിരിക്കുന്നു.
