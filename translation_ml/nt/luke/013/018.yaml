source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀οὖν· Τίνι ὁμοία ἐστὶν ἡ βασιλεία τοῦ θεοῦ, καὶ τίνι ὁμοιώσω αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: ml
  text: 'അതുകൊണ്ട് അദ്ദേഹം പറഞ്ഞുകൊണ്ടിരുന്നു: “ദൈവരാജ്യം[a] എന്തിനോടു സദൃശമാണ്? അതിനെ ഞാൻ എന്തിനോടു ഉപമിക്കും?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്തിന്റെ ഭരണം”; ഒരു പ്രദേശത്തേക്കാൾ ദൈവത്തിന്റെ രാജഭരണത്തിന് ഊന്നൽ നൽകുന്ന പരിഭാഷ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: അദ്ദേഹം പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്നോ ആവർത്തിച്ചിരുന്നോ ആയ സംസാരത്തെ സൂചിപ്പിക്കാം; മലയാളത്തിൽ ഈ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തോടുള്ള നിഗമനാത്മകമോ തുടർച്ചാസൂചകമോ ആയ ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: Τίνι ... ὁμοία ἐστὶν
  choice: എന്തിനോടു സദൃശമാണ്
  rationale: താരതമ്യം ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർത്ഥവും ഗൗരവമുള്ള ആധുനിക മലയാളഭാഷാശൈലിയും നിലനിർത്തുന്നു.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: സ്ഥാപിതമായ ബൈബിൾ പദപ്രയോഗം; രാജ്യമെന്ന മേഖലയും ദൈവത്തിന്റെ രാജഭരണവും ഉൾക്കൊള്ളാവുന്ന മൂലപദത്തിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: രണ്ട് സമാന്തര ചോദ്യങ്ങളായി വിരാമചിഹ്നത്തിലൂടെ ബന്ധിപ്പിച്ചു
  rationale: മലയാളത്തിൽ ആവർത്തിച്ചുള്ള ചോദ്യഘടന സ്വാഭാവികമാക്കാൻ സംയോജകത്തിന്റെ പ്രവർത്തനം വാക്യക്രമവും വിരാമചിഹ്നവുംകൊണ്ട് പ്രകടമാക്കി.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: അതിനെ ഞാൻ എന്തിനോടു ഉപമിക്കും
  rationale: ഭാവികാല സൂചനയും ആലോചനാത്മകമായ വാചാടോപചോദ്യത്തിന്റെ ശക്തിയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവരാജ്യം
  alternative: ദൈവത്തിന്റെ ഭരണം
  rationale: മൂലപ്രയോഗത്തിന് രാജ്യമെന്ന മേഖലയെയും ദൈവത്തിന്റെ സജീവമായ രാജഭരണത്തെയും സൂചിപ്പിക്കാനാകും. മുഖ്യപാഠത്തിൽ പരിചിതമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തി, ചലനാത്മകമായ അർത്ഥം അടിക്കുറിപ്പിൽ അറിയിച്ചു; ഏതെങ്കിലും ഒറ്റ അർത്ഥത്തിലേക്ക് വാചകത്തെ ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. അപൂർണഭൂതകാലത്തിന്റെ ദൈർഘ്യഭാവം ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ സൂക്ഷിച്ചു; താരതമ്യചോദ്യങ്ങളുടെ സമാന്തരഘടന നിലനിർത്തി.
