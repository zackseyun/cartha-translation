  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: ml
  text: “ഇടുങ്ങിയ വാതിലിലൂടെ പ്രവേശിക്കാൻ കഠിനമായി പരിശ്രമിക്കുവിൻ[a]. കാരണം, ഞാൻ നിങ്ങളോടു പറയുന്നു, പലരും പ്രവേശനം തേടും; അവർക്കു കഴിയുകയുമില്ല.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇടുങ്ങിയ കവാടത്തിലൂടെ.’ ലൂക്കോസിന്റെ ഗ്രീക്ക് പാഠത്തിൽ ‘വാതിൽ’ (θύρα) എന്നാണ്; മത്തായിയിലെ സമാന്തരഭാഗത്ത് ‘കവാടം’ എന്ന പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: കഠിനമായി പരിശ്രമിക്കുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ ഗൗരവപൂർണമായ യത്നം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ‘ശ്രമിക്കുവിൻ’ മാത്രം ഗ്രീക്കിലെ ശക്തി പൂർണമായി പ്രകടിപ്പിക്കില്ല; ‘പോരാടുവിൻ’ ഇവിടെ അനാവശ്യമായി ശാരീരിക സംഘർഷത്തിന്റെ ധ്വനി നൽകാം.
- source_word: εἰσελθεῖν
  choice: പ്രവേശിക്കാൻ
  rationale: രണ്ടിടത്തും εἰσέρχομαι എന്ന ക്രിയയുടെ അർഥം ഒരേവിധത്തിൽ നിലനിർത്തുന്ന സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: διὰ τῆς στενῆς θύρας
  choice: ഇടുങ്ങിയ വാതിലിലൂടെ
  rationale: θύρα സാധാരണയായി ‘വാതിൽ’ എന്നാണ്; ‘കവാടം’ എന്നതിനെക്കാൾ ഇത് ലൂക്കോസിന്റെ പദത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. στενῆς എന്നതിന്റെ സ്ഥലപരവും രൂപകാലങ്കാരപരവുമായ അർഥത്തിന് ‘ഇടുങ്ങിയ’ യോജിക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ആജ്ഞയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധകത്തിന്റെ കാരണാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πολλοί
  choice: പലരും
  rationale: നാമസദൃശമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തിന് ലളിതവും സ്വാഭാവികവുമായ തർജമ.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഗ്രീക്ക് പ്രഭാഷണസൂത്രം മാന്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: ζητήσουσιν
  choice: അന്വേഷിക്കും
  rationale: ζητέω എന്നതിന്റെ അടിസ്ഥാനമായ ‘അന്വേഷിക്കുക/തേടുക’ എന്ന അർഥം നിലനിർത്തുകയും Ἀγωνίζεσθε സൂചിപ്പിക്കുന്ന കഠിനയത്നത്തിൽനിന്നുള്ള പദവ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἰσχύσουσιν
  choice: അവർക്കു കഴിയുകയില്ല
  rationale: ഒരു കാര്യം നിർവഹിക്കാനുള്ള കഴിവോ ശേഷിയോ ഇല്ലെന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു; ‘വിജയിക്കുകയില്ല’ ഫലത്തെ കൂടുതൽ വ്യാഖ്യാനിക്കും, ‘ശക്തരായിരിക്കുകയില്ല’ മലയാളത്തിൽ അസ്വാഭാവികമാണ്.
theological_decisions:
- issue: മനുഷ്യശ്രമവും രക്ഷാസംബന്ധമായ ഭാഷയും
  choice: ‘കഠിനമായി പരിശ്രമിക്കുവിൻ’ എന്ന ശക്തമായ ആജ്ഞ നിലനിർത്തി; പ്രവൃത്തികളുടെ യോഗ്യതയെക്കുറിച്ചോ രക്ഷയുടെ ക്രമത്തെക്കുറിച്ചോ doctrinal വിശദീകരണം ചേർത്തില്ല.
  alternative: ‘പ്രവേശിക്കാൻ ശ്രമിക്കുവിൻ’ എന്ന മൃദുവായ പ്രയോഗം
  rationale: വാക്യം ഗൗരവപൂർണമായ യത്നം കല്പിക്കുകയും ചിലരുടെ അന്വേഷണം പരാജയപ്പെടുമെന്ന് മുന്നറിയിപ്പു നൽകുകയും ചെയ്യുന്നു. ദൈവിക പരമാധികാരം, മനുഷ്യ ഉത്തരവാദിത്വം, യോഗ്യത എന്നിവയെക്കുറിച്ചുള്ള വിപുലമായ തർക്കങ്ങൾ പരിഹരിക്കാതെ ഈ പിരിമുറുക്കം തർജമ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ തിരുവെഴുത്തുശൈലി. ബഹുവചന ആജ്ഞയ്ക്ക് ‘പരിശ്രമിക്കുവിൻ’ ഉപയോഗിച്ചു. ‘കഠിനമായി’ ഗ്രീക്ക് ക്രിയയുടെ തീവ്രത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിൽ [a] അടയാളം ബന്ധപ്പെട്ട പദസമുച്ചയത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
