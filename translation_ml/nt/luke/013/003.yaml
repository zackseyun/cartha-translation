lexical_decisions:
- source_word: οὐχί
  choice: അല്ല
  rationale: മുൻസന്ദർഭത്തിൽ സൂചിപ്പിക്കപ്പെട്ട നിഗമനത്തെ ശക്തമായി നിഷേധിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുമാണ്.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ലൂക്കോസിലെ ഊന്നലുള്ള നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: നിഷേധിച്ച ധാരണയ്ക്കും തുടർന്നുള്ള മുന്നറിയിപ്പിനും ഇടയിലെ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἐὰν μὴ
  choice: ഇല്ലെങ്കിൽ
  rationale: നിഷേധാത്മക വ്യവസ്ഥയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μετανοῆτε
  choice: മാനസാന്തരപ്പെടുന്നില്ലെങ്കിൽ
  rationale: ദൈവത്തോടുള്ള ബന്ധത്തിൽ ചിന്തയുടെയും മനോഭാവത്തിന്റെയും ജീവിതദിശയുടെയും മാറ്റം സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളപ്രയോഗം; വെറും ബൗദ്ധിക പുനരാലോചനയായി ചുരുക്കുന്നില്ല.
- source_word: πάντες
  choice: നിങ്ങളെല്ലാവരും
  rationale: യേശുവിന്റെ ശ്രോതാക്കളെ മുഴുവനായി ഉൾക്കൊള്ളുന്ന ഊന്നൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὁμοίως
  choice: അതുപോലെതന്നെ
  rationale: മുൻപ് പറഞ്ഞ സംഭവങ്ങളുമായുള്ള താരതമ്യം നിലനിർത്തുന്നു; കൃത്യമായ അതേ മരണരീതിയെന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: ἀπολεῖσθε
  choice: നശിച്ചുപോകും
  rationale: വരാനിരിക്കുന്ന നാശം അല്ലെങ്കിൽ അന്തിമ തകർച്ച എന്ന ഗൗരവം നിലനിർത്തുന്നു; അതിനെ ശാരീരികമരണത്തിലേക്കോ നിത്യശിക്ഷയിലേക്കോ മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: μετανοέω എന്നതിന്റെ പരിധി
  choice: മാനസാന്തരപ്പെടുക
  alternative: ചിന്ത മാറ്റുക / തിരിഞ്ഞുവരുക
  rationale: വെറും അഭിപ്രായമാറ്റത്തേക്കാൾ ആഴമുള്ള ദൈവമുഖമായ മാറ്റം സന്ദർഭത്തിൽ സൂചിപ്പിക്കപ്പെടുന്നു; അതേസമയം പ്രത്യേക മതവിഭാഗത്തിന്റെ പശ്ചാത്താപസിദ്ധാന്തം ചേർക്കുന്നില്ല.
- issue: യേശുവിന്റെ മുന്നറിയിപ്പിലെ ἀπολεῖσθε എന്നതിന്റെ പരിധി
  choice: നശിച്ചുപോകും
  alternative: മരിക്കും / നിത്യശിക്ഷയ്ക്ക് വിധിക്കപ്പെടും
  rationale: ഗ്രീക്ക് പദം നാശത്തെയും തകർച്ചയെയും സൂചിപ്പിച്ചാലും അതിന്റെ കൃത്യമായ രൂപമോ വ്യാപ്തിയോ ഈ വാക്യം മാത്രം നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന അർഥപരിധിയും സംരക്ഷിക്കുന്നു.
