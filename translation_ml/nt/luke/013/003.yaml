  language: ml
  text: അല്ല, ഞാൻ നിങ്ങളോടു പറയുന്നു; എന്നാൽ നിങ്ങൾ മാനസാന്തരപ്പെടുന്നില്ലെങ്കിൽ, നിങ്ങളെല്ലാവരും അതുപോലെതന്നെ നശിച്ചുപോകും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അതേ രീതിയിൽ.” “അതുപോലെതന്നെ” എന്നത് പെട്ടെന്നുള്ള സമാനമായ ന്യായവിധിയെ സൂചിപ്പിക്കാം; മരണം കൃത്യമായി അതേ രീതിയിലായിരിക്കണമെന്നില്ല.
