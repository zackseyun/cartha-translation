id: LUK.13.16
reference: Luke 13:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: ml
  text: അബ്രാഹാമിന്റെ മകളായ ഈ സ്ത്രീയെ—ഇതാ, പതിനെട്ടു വർഷമായി സാത്താൻ ബന്ധിച്ചിരുന്ന ഇവളെ—ശബ്ബത്തുനാളിൽ ഈ ബന്ധനത്തിൽനിന്ന് അഴിക്കേണ്ടതല്ലായിരുന്നോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: അബ്രാഹാമിന്റെ മകൾ
  rationale: യഹൂദ ഉടമ്പടിസമൂഹത്തിലെ അംഗത്വവും മാന്യതയും സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ കുടുംബരൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: ἰδού
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന മൂലപാഠത്തിലെ ഉദ്ഗാരം ഒഴിവാക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: ബന്ധിച്ചിരുന്ന / അഴിക്കേണ്ടത് / ബന്ധനം
  rationale: ബന്ധിക്കുകയും അഴിക്കുകയും ചെയ്യുന്ന പരസ്പരബന്ധിത ദൃശ്യഭാഷ മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: ശബ്ബത്തുനാളിൽ
  rationale: കാലസൂചന സംക്ഷിപ്തവും നിലവാരമുള്ളതുമായ മലയാളപ്രയോഗത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: രോഗാവസ്ഥയിൽ സാത്താന്റെ പങ്ക്
  choice: സാത്താൻ ബന്ധിച്ചിരുന്ന
  alternative: സാത്താൻ മൂലം കഷ്ടപ്പെട്ടിരുന്ന
  rationale: യേശുവിന്റെ വാക്കുകളിൽ ഉള്ള നേരിട്ടുള്ള പ്രവർത്തകബന്ധം മൃദൂകരിക്കാതെയും എല്ലാ രോഗങ്ങളെയും കുറിച്ചുള്ള പൊതുസിദ്ധാന്തമാക്കി വികസിപ്പിക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
- issue: അബ്രാഹാമിന്റെ മകൾ എന്ന വിശേഷണം
  choice: രൂപകം അതേപടി നിലനിർത്തി
  alternative: അബ്രാഹാമിന്റെ വംശജയായ സ്ത്രീ
  rationale: വംശബന്ധത്തിനപ്പുറം ഉൾപ്പെടലും മാന്യതയും വഹിക്കാവുന്ന മൂലപാഠത്തിന്റെ അർത്ഥസമ്പുഷ്ടത സംരക്ഷിക്കുന്നു.
- issue: οὐκ ἔδει എന്ന ചോദ്യത്തിന്റെ ബലം
  choice: അഴിക്കേണ്ടതല്ലായിരുന്നോ?
  alternative: അഴിക്കേണ്ടതായിരുന്നില്ലേ?
  rationale: ധാർമികമായ യുക്തിയും നിർബന്ധബോധവും അടങ്ങിയ പ്രതീക്ഷിത സമ്മതചോദ്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. മൂലപാഠത്തിലെ ഊന്നലും ബന്ധിക്കുക–അഴിക്കുക എന്ന പദചിത്രവും സംരക്ഷിച്ചു.
