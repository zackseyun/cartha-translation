source:
  edition: SBLGNT
  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: ml
  text: 'അപ്പോൾ നിങ്ങൾ പറഞ്ഞുതുടങ്ങും: “ഞങ്ങൾ നിന്റെ സന്നിധിയിൽ കഴിക്കുകയും കുടിക്കുകയും ചെയ്തു; ഞങ്ങളുടെ തെരുവുകളിൽ[a] നീ പഠിപ്പിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങളുടെ പൊതുചത്വരങ്ങളിൽ”; ഗ്രീക്ക് പദം വീതിയുള്ള തെരുവുകളെയോ പട്ടണത്തിലെ തുറന്ന പൊതുസ്ഥലങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭാഷണത്തിലെ തുടർച്ചയും സമയക്രമവും സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἄρξεσθε λέγειν
  choice: നിങ്ങൾ പറഞ്ഞുതുടങ്ങും
  rationale: ἄρχω എന്ന ക്രിയയുടെ ഭാവികാലരൂപവും അനുബന്ധമായ λέγειν എന്ന അനന്തക്രിയയും നൽകുന്ന ആരംഭസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: ഞങ്ങൾ ... ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തു
  rationale: രണ്ട് ഏഓറിസ്റ്റ് ക്രിയകളെയും ഒരേ ഭൂതകാലഘടനയിൽ ചേർത്ത്, ഒരുമിച്ചുള്ള ഭക്ഷണപാനത്തിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐνώπιόν σου
  choice: നിന്റെ സന്നിധിയിൽ
  rationale: കേവലം സ്ഥലപരമായ ‘നിന്റെ മുമ്പിൽ’ എന്നതിലുപരി വ്യക്തിപരമായ സാമീപ്യവും സാന്നിധ്യവും സൂചിപ്പിക്കുന്നു; എന്നാൽ അംഗീകൃത ബന്ധം ഉണ്ടെന്ന് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: ഞങ്ങളുടെ തെരുവുകളിൽ
  rationale: പട്ടണത്തിലെ വീതിയുള്ള തെരുവുകളെയോ തുറന്ന പൊതുസ്ഥലങ്ങളെയോ സൂചിപ്പിക്കാവുന്ന πλατεῖα എന്ന പദത്തിന് സ്വാഭാവികമായ മലയാളം; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐδίδαξας
  choice: നീ പഠിപ്പിക്കുകയും ചെയ്തു
  rationale: ഏഓറിസ്റ്റിന്റെ ചരിത്രപരമായ വസ്തുതാസൂചന ഭൂതകാലത്തിൽ നൽകുന്നു; മുമ്പുള്ള സംയുക്തക്രിയയുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: സംസാരിക്കുന്നവർ യേശുവിനോടുള്ള ബന്ധത്തിന് ഉന്നയിക്കുന്ന അവകാശവാദത്തിന്റെ സ്വഭാവം
  choice: അവർ യേശുവിന്റെ സന്നിധിയിൽ ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തതും അവരുടെ തെരുവുകളിൽ അവൻ പഠിപ്പിച്ചതും മാത്രം അവകാശപ്പെടുന്നതായി പരിഭാഷ നിലനിർത്തുന്നു.
  alternative: അംഗീകരിക്കപ്പെട്ട കൂട്ടായ്മയോ രക്ഷാകരമായ ബന്ധമോ ഉണ്ടായിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്ന വിധത്തിൽ സ്വതന്ത്രമായി പരിഭാഷപ്പെടുത്താം.
  rationale: ഗ്രീക്ക് വാചകം ബാഹ്യമായ സാമീപ്യവും പൊതുപഠിപ്പിക്കലും മാത്രമാണ് പറയുന്നത്; യേശു അവരെ അംഗീകരിച്ചുവെന്ന ആശയം ചേർക്കാതെ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള ഉദ്ധരണിയും ബഹുവചന അഭിസംബോധനയും വ്യക്തമായി സൂക്ഷിച്ചു; ‘സന്നിധിയിൽ’ എന്നത് ഗൗരവമുള്ളതെങ്കിലും സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പ്രയോഗമാണ്.
