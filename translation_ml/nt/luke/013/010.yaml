  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦν δὲ διδάσκων ἐν μιᾷ τῶν συναγωγῶν ἐν τοῖς σάββασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/010.yaml
  text: He was teaching in one of the synagogues on the Sabbath[a].
translation:
  language: ml
  text: അവൻ ശബ്ബത്തിൽ[a] സിനഗോഗുകളിൽ ഒന്നിൽ പഠിപ്പിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശബ്ബത്തുകളിൽ’; ഗ്രീക്കിൽ ഇവിടെ ബഹുവചനരൂപമാണെങ്കിലും അത് സാധാരണയായി ‘ശബ്ബത്ത്’ എന്ന ഏകവചനാർഥത്തിൽ പ്രയോഗിക്കപ്പെടാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: അവൻ ... പഠിപ്പിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: εἰμίയുടെ അപൂർണഭൂതകാലരൂപവും വർത്തമാനകൃദന്തരൂപമായ διδάσκωνഉം ചേർന്ന പരിവാക്യഘടന കഴിഞ്ഞകാലത്ത് തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ വേറൊരു പദം ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: സിനഗോഗുകളിൽ ഒന്നിൽ
  rationale: ഭാഗസൂചകമായ ഈ പ്രയോഗത്തിന്റെ അർഥം കൃത്യമായി നിലനിർത്തുന്നു. പ്രത്യേക യഹൂദ സ്ഥാപനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘ആരാധനാലയം’ എന്നതിനു പകരം ‘സിനഗോഗ്’ നിലനിർത്തി.
- source_word: ἐν τοῖς σάββασιν
  choice: ശബ്ബത്തിൽ
  rationale: σάββασιν രൂപപരമായി ബഹുവചനമാണെങ്കിലും കൊയ്നേ ഗ്രീക്കിൽ ഏകവചനാർഥത്തിൽ പ്രയോഗിക്കപ്പെടാറുണ്ട്. സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാള ഏകവചനം മുഖ്യപാഠത്തിൽ നൽകി; രൂപപരമായ ബഹുവചനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ കഴിഞ്ഞകാലപ്രവൃത്തി ‘പഠിപ്പിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കി; സാംസ്കാരികമായി പ്രത്യേകമായ ‘സിനഗോഗ്’ എന്ന പദം നിലനിർത്തി.
