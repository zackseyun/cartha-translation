id: LUK.13.19
reference: Luke 13:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: ml
  text: അത് ഒരു കടുകുമണിയോടു സദൃശമാണ്. ഒരു മനുഷ്യൻ അതെടുത്ത് തന്റെ തോട്ടത്തിലേക്ക് എറിഞ്ഞു. അത് വളർന്ന് ഒരു വൃക്ഷമായിത്തീർന്നു; ആകാശത്തിലെ പക്ഷികൾ[a] അതിന്റെ കൊമ്പുകളിൽ കൂടുകൂട്ടി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ആകാശത്തിന്റെ പക്ഷികൾ’; പരമ്പരാഗതമായി ‘വായുവിലെ പക്ഷികൾ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കുപാഠം ‘ഒരു വൃക്ഷമായിത്തീർന്നു’ എന്നാണ് പറയുന്നത്; ഉപമയിലെ അസാധാരണമായി വിപുലീകരിച്ച വളർച്ചാചിത്രം ഈ പരിഭാഷ നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: അതൊരു … സദൃശമാണ്
  rationale: രാജ്യത്തെക്കുറിച്ചുള്ള ഉപമകളിലെ താരതമ്യസൂത്രം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κόκκῳ σινάπεως
  choice: കടുകുമണി
  rationale: κόκκος എന്നത് ധാന്യമണിയെയോ വിത്തിനെയോ സൂചിപ്പിക്കാം; ചെറുതായ കടുകുവിത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണ് ‘കടുകുമണി’.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ അതെടുത്ത്
  rationale: ഉപമയിലെ ഏകവചന പുരുഷകഥാപാത്രത്തെ ലിംഗനിഷ്ഠമായി നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: തന്റെ തോട്ടത്തിലേക്ക് എറിഞ്ഞു
  rationale: βάλλωയുടെ സജീവമായ ‘എറിയുക’ എന്ന ഭാവവും κῆπος എന്ന പ്രത്യേകമായ ‘തോട്ടം’ എന്ന അർത്ഥവും സംരക്ഷിക്കുന്നു; ‘വിതച്ചു’ എന്നു വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: ηὔξησεν
  choice: അത് വളർന്ന്
  rationale: സന്ദർഭത്തിലെ അകർമകമായ വളർച്ച ലളിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐγένετο εἰς δένδρον
  choice: ഒരു വൃക്ഷമായിത്തീർന്നു
  rationale: ഗ്രീക്കിലെ δένδρον എന്ന ‘വൃക്ഷം’ എന്ന പ്രതിച്ഛായയും ഉപമയിലെ അതിശയകരമായ വളർച്ചയും അതേപടി നിലനിർത്തുന്നു.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: οὐρανός ഇവിടെ സ്ഥലസൂചകമായി ‘ആകാശം’ എന്നാണ്; ‘ആകാശത്തിലെ പക്ഷികൾ’ ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: κατεσκήνωσεν
  choice: കൂടുകൂട്ടി
  rationale: പക്ഷികളും കൊമ്പുകളും ഉള്ള സന്ദർഭത്തിൽ താമസമുറപ്പിക്കുക/കൂടുണ്ടാക്കുക എന്ന ദൃശ്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: അതിന്റെ കൊമ്പുകളിൽ
  rationale: κλάδοις എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥമായ ‘കൊമ്പുകൾ’ നിലനിർത്തുന്നു; ‘അതിന്റെ’ എന്നത് വൃക്ഷത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἄνθρωπος എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരാൾ
  rationale: ഇവിടെ ഉപമയിലെ ഒരു ഏകവചന പുരുഷകഥാപാത്രമാണ് ഉദ്ദേശ്യം; അതിനാൽ ഉറവിടത്തിലെ ലിംഗസൂചന നിഷ്പക്ഷമാക്കി മാറ്റുന്നില്ല.
- issue: കടുകുമണിയുടെ ഉപമയിലെ δένδρον എന്ന പ്രതിച്ഛായ
  choice: വൃക്ഷം
  alternative: വലിയ ചെടി / കുറ്റിച്ചെടി
  rationale: സസ്യശാസ്ത്രപരമായി മയപ്പെടുത്താതെ ഗ്രീക്ക് പാഠത്തിലെ ‘വൃക്ഷം’ എന്ന വിപുലീകൃത പ്രതിച്ഛായയും ദൈവരാജ്യത്തിന്റെ വളർച്ചയെക്കുറിച്ചുള്ള ഉപമയിലെ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിച്ച καί ഘടന മലയാളത്തിലെ ചെറുവാക്യങ്ങളും അർധവിരാമവും ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചു. മുഖ്യപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
