reference: Luke 13:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Καὶ πάλιν εἶπεν· Τίνι ὁμοιώσω τὴν βασιλείαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: ml
  text: 'പിന്നെയും അവൻ പറഞ്ഞു: “ദൈവരാജ്യത്തെ ഞാൻ എന്തിനോടു ഉപമിക്കും?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: അവൻ
  rationale: ഗ്രീക്കിലെ ലളിതമായ ബന്ധകമായ Καὶ മലയാളത്തിൽ പ്രത്യേകം ‘പിന്നെ/അപ്പോൾ’ എന്നു ചേർത്താൽ ഇല്ലാത്ത കാലക്രമസൂചന വരാം. സ്വാഭാവികമായ മലയാളവാക്യത്തിനായി കർത്താവിനെ വ്യക്തമാക്കുന്ന ‘അവൻ’ ഉപയോഗിച്ചു; ബന്ധം ‘വീണ്ടും’ നിലനിർത്തുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനത്തെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിയെ അവതരിപ്പിക്കുന്ന λέγωയുടെ സാധാരണ ആഖ്യാനപ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: Τίνι
  choice: എന്തിനോടു
  rationale: ὁμοιόωയോടുള്ള നപുംസകലിംഗ ഏകവചന ദത്തി ഇവിടെ ഒരു വസ്തുവുമായുള്ള താരതമ്യം ചോദിക്കുന്നു; വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ‘ആരോടു’ അല്ല.
- source_word: ὁμοιώσω
  choice: ഞാൻ ... ഉപമിക്കും
  rationale: ഒന്നാംപുരുഷ ഭാവികാലരൂപവും ആലോചനാത്മകമായ ചോദ്യത്തിന്റെ ഭാവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തെ
  rationale: ദൈവത്തിന്റെ രാജകീയ ഭരണത്തെയും രാജ്യത്തെയും ഉൾക്കൊള്ളാവുന്ന, സ്ഥാപിതവും അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നതുമായ മലയാള ബൈബിൾപ്രയോഗം.
theological_decisions:
- issue: ദൈവത്തിന്റെ ഭരണത്തെക്കുറിച്ചുള്ള വചനത്തിൽ βασιλείαയുടെ പരിഭാഷ
  choice: ദൈവരാജ്യം
  alternative: ദൈവത്തിന്റെ ഭരണം
  rationale: ‘ദൈവരാജ്യം’ രാജകീയ ഭരണവും രാജ്യവും ഉൾപ്പെടുന്ന ഗ്രീക്ക് പദത്തിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു; ‘ദൈവത്തിന്റെ ഭരണം’ സജീവഭരണത്തിൽ മാത്രം അർത്ഥം ചുരുക്കാൻ ഇടയുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള ശൈലി. ഗ്രീക്കിലെ Καὶ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹം പാലിച്ചു; പുതിയ കാലക്രമനിറം ചേർത്തിട്ടില്ല.
