id: LUK.13.33
reference: Luke 13:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: ml
  text: എന്നിരുന്നാലും, ഇന്നും നാളെയും മറ്റന്നാളും[a] ഞാൻ യാത്ര തുടർന്നുകൊണ്ടുപോകേണ്ടിയിരിക്കുന്നു. കാരണം, യെരൂശലേമിന് പുറത്ത് ഒരു പ്രവാചകൻ മരിക്കുക സാധ്യമല്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇന്നും നാളെയും മറ്റന്നാളും” എന്ന പ്രയോഗം കൃത്യമായ മൂന്ന് കലണ്ടർ ദിവസങ്ങളെ സൂചിപ്പിക്കാതെ, ഹ്രസ്വവും നിശ്ചിതവുമായ ഒരു പ്രവർത്തനകാലത്തെ സൂചിപ്പിക്കുന്ന ശൈലിപ്രയോഗമായിരിക്കാം.
    reason: cultural_note
  - marker: b
    text: “സാധ്യമല്ല” എന്നതിന് “അങ്ങനെ സംഭവിക്കാനാവില്ല” എന്നോ “അങ്ങനെ ചിന്തിക്കാനാവില്ല” എന്നോ പരിഭാഷപ്പെടുത്താം. ഈ പ്രസ്താവനയിൽ കടുത്ത വൈരുധ്യത്തിന്റെയോ പരിഹാസധ്വനിയുടെയോ സൂചന ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: എങ്കിലും
  rationale: മുൻവാക്യത്തോടുള്ള ശക്തമായ വിരുദ്ധതയോ പരിമിതപ്പെടുത്തലോ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δεῖ με
  choice: ഞാൻ ... തുടരേണ്ടിയിരിക്കുന്നു
  rationale: δεῖ സൂചിപ്പിക്കുന്ന നിർബന്ധിതമായ ആവശ്യകത നിലനിർത്തുന്നു; അതിനെ ദൈവിക നിർദേശം എന്നു വിശദീകരിച്ച് പരിഭാഷയിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: ഇന്നും നാളെയും അതിന്റെ പിറ്റേന്നും
  rationale: ഗ്രീക്കിലെ ത്രിഘട്ട കാലക്രമം വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πορεύεσθαι
  choice: യാത്ര തുടരുക
  rationale: വെറും ‘പോകുക’ എന്നതിനെക്കാൾ സന്ദർഭത്തിലെ തുടർന്നുള്ള സഞ്ചാരത്തെ വ്യക്തമാക്കുന്നു; ‘എന്റെ വഴിയിൽ പോകുക’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻപറഞ്ഞ ആവശ്യകതയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: οὐκ ἐνδέχεται
  choice: സാധ്യമല്ല
  rationale: അസാധ്യതയുടെയോ അംഗീകരിക്കാനാവാത്ത വൈരുധ്യത്തിന്റെയോ ഗ്രീക്ക് പ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു; പരിഹാസധ്വനി മുഖ്യപാഠത്തിൽ അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: προφήτην
  choice: ഒരു പ്രവാചകൻ
  rationale: നിശ്ചയാർഥക ഉപപദമില്ലാത്ത ഏകവചനത്തെ പൊതുസ്വഭാവമുള്ള പ്രസ്താവനയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀπολέσθαι
  choice: നശിച്ചുപോകുക
  rationale: ‘മരിക്കുക’, ‘കൊല്ലപ്പെടുക’, ‘നശിക്കുക’ എന്നീ അർഥസാധ്യതകളിൽ ഒന്നിലേക്ക് അനാവശ്യമായി ചുരുക്കാതെ ἀπόλλυμι എന്ന പദത്തിന്റെ വിശാലവും ഗൗരവമുള്ളതുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἔξω Ἰερουσαλήμ
  choice: യെരൂശലേമിനു പുറത്ത്
  rationale: സ്ഥലസൂചന നേരായും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ഒരു പ്രവാചകൻ യെരൂശലേമിനു പുറത്ത് നശിക്കുന്നതിനെക്കുറിച്ചുള്ള യേശുവിന്റെ പ്രസ്താവനയുടെ ശക്തി
  choice: അസാധ്യതയുടെയോ കടുത്ത വൈരുധ്യത്തിന്റെയോ പ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തി; അതിനെ കേവലമായ തത്ത്വശാസ്ത്രപരമായ അസാധ്യതയായി വിശദീകരിച്ചില്ല.
  alternative: ‘ഒരു പ്രവാചകൻ യെരൂശലേമിനു പുറത്ത് മരിക്കുമെന്നത് ചിന്തിക്കാനാവില്ല’ എന്നു പരിഭാഷപ്പെടുത്തി പരിഹാസധ്വനിക്ക് കൂടുതൽ ഊന്നൽ നൽകാം.
  rationale: οὐκ ἐνδέχεται എന്നത് അസാധ്യമായത്, ചേരാത്തത്, ചിന്തിക്കാനാവാത്തത് എന്നിവ സൂചിപ്പിക്കാം. മുഖ്യപാഠം അസാധ്യതയുടെ രൂപം നിലനിർത്തുമ്പോൾ അടിക്കുറിപ്പ് അതിലെ പ്രവാചകീയ പരിഹാസമോ കടുത്ത വൈരുധ്യമോ വായനക്കാരൻ തിരിച്ചറിയാൻ ഇട നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിത കാലക്രമവും പ്രസ്താവനയിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തി; വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചു.
