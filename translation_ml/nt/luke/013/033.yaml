  issues:
  - severity: medium
    issue: ἀπολέσθαι is rendered as 'നശിച്ചുപോകുക.'
    rationale: Although ἀπόλλυμι has a broad semantic range, in this saying about a prophet's fate it naturally concerns death. In contemporary Malayalam, 'നശിച്ചുപോകുക' is less idiomatic for this sense and may imply ruin or annihilation. 'മരിക്കുക' is clearer while retaining the Greek's lack of an explicit killing agent.
  - severity: low
