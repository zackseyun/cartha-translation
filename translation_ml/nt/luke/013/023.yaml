base_translation:
  language: en
  yaml_path: translation/nt/luke/013/023.yaml
  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: ml
  text: 'ഒരാൾ അവനോടു പറഞ്ഞു: “കർത്താവേ,[b] രക്ഷിക്കപ്പെടുന്നവർ ചുരുക്കംപേർ മാത്രമാണോ?”[a] അവൻ അവരോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “രക്ഷിക്കപ്പെടുന്നവർ ചുരുക്കംപേരാണോ?”'
    reason: lexical_alternative
  - marker: b
    text: “കർത്താവേ” എന്നത് ഇവിടെ ബഹുമാനപൂർവമായ “സാർ” എന്ന അർഥത്തിലും മനസ്സിലാക്കാം; ഗ്രീക്കിൽ ഈ സംബോധനയുടെ പൂർണ അർഥബലം ഇവിടെ തുറന്നുകിടക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: δέ
  choice: അപ്പോൾ
  rationale: വിവരണത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമായി ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നു; ശക്തമായ വിരോധം സൂചിപ്പിക്കാതെ സ്വാഭാവികമായ മലയാള പ്രവാഹം നൽകുന്നു.
- source_word: τις
  choice: ഒരാൾ
  rationale: ആരാണെന്ന് വ്യക്തമാക്കാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന അനിശ്ചിത സർവനാമത്തിന് സ്വാഭാവികമായ മലയാള പ്രയോഗം.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: ഗ്രീക്കിലെ സർവനാമം നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ ‘യേശു’ എന്ന പേര് പുതുതായി ചേർക്കുന്നില്ല.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ബഹുമാനപൂർവമായ സംബോധനയോ കൂടുതൽ ഗൗരവമുള്ള ക്രിസ്തുശാസ്ത്രപരമായ അർഥമോ ആകാവുന്ന κύριε എന്ന പദത്തിന്റെ തുറന്ന സ്വഭാവം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: εἰ ὀλίγοι
  choice: ചുരുക്കംപേർ മാത്രമാണോ
  rationale: ചോദ്യം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുമ്പോൾ ആളുകളുടെ ചെറിയ സംഖ്യയിലുള്ള ഊന്നൽ വ്യക്തമാക്കുന്നു.
- source_word: οἱ σῳζόμενοι
  choice: രക്ഷിക്കപ്പെടുന്നവർ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കർമണി കൃദന്തത്തിന്റെ ‘രക്ഷിക്കപ്പെടുന്നവർ’ എന്ന അർഥവും തുടരുന്ന/പ്രക്രിയാത്മക ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: πρὸς αὐτούς
  choice: അവരോട്
  rationale: ഗ്രീക്കിലെ ബഹുവചന സർവനാമം കൃത്യമായി നിലനിർത്തുന്നു; ചോദിച്ച ഒരാളിൽനിന്ന് വിശാലമായ ശ്രോതൃസമൂഹത്തിലേക്കുള്ള മാറ്റം വ്യക്തമാകുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള κύριε എന്ന സംബോധനയുടെ ശക്തി
  choice: കർത്താവേ
  alternative: യജമാനനേ / സാർ
  rationale: ഇത് സാധാരണ ബഹുമാനസംബോധനയായിരിക്കാമെങ്കിലും കൂടുതൽ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം വഹിക്കാനും കഴിയും. ‘കർത്താവേ’ ആ സാധ്യത അടച്ചുകളയുന്നില്ല; കുറിപ്പിൽ ഭാഷാപരമായ തുറന്ന നില വ്യക്തമാക്കുന്നു.
- issue: σῳζόμενοι എന്ന പദത്തിന്റെ കാലഭാവം
  choice: രക്ഷിക്കപ്പെടുന്നവർ
  alternative: രക്ഷിക്കപ്പെട്ടവർ
  rationale: വർത്തമാനകാല കർമണി കൃദന്തം തുടരുന്ന അവസ്ഥയെയോ പ്രക്രിയയെയോ സൂചിപ്പിക്കുന്നു. പൂർത്തിയായ ഫലം മാത്രമെന്നോ ഒരു പ്രത്യേക രക്ഷാശാസ്ത്രക്രമമെന്നോ നിർണ്ണയിക്കാതെ അതു നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘രക്ഷിക്കപ്പെടുന്നവർ’ എന്ന രൂപം കർമണിയും തുടരുന്ന കാലഭാവവും സംരക്ഷിക്കുന്നു. എല്ലാ കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
