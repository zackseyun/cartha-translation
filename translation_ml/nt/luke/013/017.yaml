id: LUK.13.17
reference: Luke 13:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: ml
  text: അവൻ ഇക്കാര്യങ്ങൾ പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ, അവനെ എതിർത്തുകൊണ്ടിരുന്ന എല്ലാവരും[a] ലജ്ജിതരായി; അവൻ ചെയ്തുകൊണ്ടിരുന്ന മഹത്ത്വമേറിയ സകല കാര്യങ്ങളെയും[b] കുറിച്ച് ജനക്കൂട്ടം മുഴുവൻ സന്തോഷിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ എതിരാളികളെല്ലാവരും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിസ്മയകരമായ സകല കാര്യങ്ങളെയും’ അല്ലെങ്കിൽ ‘ശ്രേഷ്ഠമായ സകല കാര്യങ്ങളെയും.’ ഗ്രീക്കിൽ ‘മഹത്ത്വമേറിയ കാര്യങ്ങൾ’ എന്നാണ്; യേശുവിന്റെ ശക്തിയേറിയ പ്രവൃത്തികളും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: അവൻ ഇക്കാര്യങ്ങൾ പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപമുള്ള genitive absolute, യേശു സംസാരിക്കുന്നതിനോടൊപ്പം സംഭവിച്ചുകൊണ്ടിരുന്ന പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ’ ഈ സമകാലികവും തുടർച്ചയുള്ളതുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: അവനെ എതിർത്തുകൊണ്ടിരുന്ന എല്ലാവരും
  rationale: ἀντίκειμαι എന്ന കൃദന്തരൂപത്തിന്റെ സജീവവും തുടർച്ചയുള്ളതുമായ എതിർപ്പിനെ നിലനിർത്തുന്നു; ‘എതിരാളികൾ’ എന്ന നാമരൂപത്തേക്കാൾ മൂലപാഠത്തിന്റെ ക്രിയാഭാവത്തോട് അടുത്തതാണ്.
- source_word: κατῃσχύνοντο
  choice: ലജ്ജിതരായി
  rationale: അപൂർണ്ണകാല passive/middle രൂപം സൂചിപ്പിക്കുന്ന പൊതുവായ അപമാനത്തിന്റെയും ഫലാവസ്ഥയുടെയും ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘ലജ്ജിച്ചു’ എന്നത് ഉള്ളിലെ വികാരമായി മാത്രം ചുരുങ്ങാം; ‘ലജ്ജിതരാക്കപ്പെട്ടു’ കൂടുതൽ അക്ഷരാർഥപരമാണെങ്കിലും ഇവിടെ അസ്വാഭാവികമായി കേൾക്കും.
- source_word: πᾶς ὁ ὄχλος
  choice: ജനക്കൂട്ടം മുഴുവൻ
  rationale: ഏകവചന കൂട്ടനാമത്തിന്റെ സമഗ്രത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔχαιρεν
  choice: സന്തോഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണകാലത്തിന്റെ തുടർച്ചയുള്ള സന്തോഷം ‘കൊണ്ടിരുന്നു’ എന്ന രൂപത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: മഹത്ത്വമേറിയ സകല കാര്യങ്ങളെയും കുറിച്ച്
  rationale: ἐπί + dative സന്തോഷത്തിന്റെ കാരണമോ വിഷയമോ സൂചിപ്പിക്കുന്നു. ἔνδοξος എന്ന വിശാലമായ പദത്തെ ‘മഹത്ത്വമേറിയ’ എന്നു നൽകുന്നത് അതിനെ അത്ഭുതപ്രവൃത്തികൾ എന്ന ഒറ്റ വിഭാഗത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: അവൻ ചെയ്തുകൊണ്ടിരുന്ന
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പുരോഗമനഭാവവും ὑπό സൂചിപ്പിക്കുന്ന യേശുവിന്റെ നേരിട്ടുള്ള കർത്തൃത്വവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘മഹത്ത്വമേറിയ കാര്യങ്ങൾ’ എന്നതിന്റെ സ്വഭാവം
  choice: ἐνδόξοις എന്നത് വിശാലമായി ‘മഹത്ത്വമേറിയ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അത്ഭുതകരമായ’ അല്ലെങ്കിൽ ‘വിസ്മയകരമായ’ കാര്യങ്ങൾ
  rationale: സന്ദർഭത്തിൽ സൗഖ്യപ്പെടുത്തൽ ഉൾപ്പെടുന്നുവെങ്കിലും ഗ്രീക്ക് പദം മഹത്ത്വമുള്ളതും ശ്രേഷ്ഠവും തേജസ്സുറ്റതുമായ കാര്യങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നു. അതിനാൽ അതിനെ ‘അത്ഭുതങ്ങൾ’ എന്നു മാത്രം നിർവചിക്കാതെ മൂലപാഠത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- issue: ὑπ’ αὐτοῦ എന്നതിലെ കർത്തൃത്വം
  choice: ‘അവൻ ചെയ്തുകൊണ്ടിരുന്ന’ എന്നു നൽകി യേശുവിന്റെ നേരിട്ടുള്ള കർത്തൃത്വം നിലനിർത്തി.
  alternative: ‘അവനിലൂടെ നടന്നുകൊണ്ടിരുന്ന’
  rationale: ὑπό + genitive ഇവിടെ നേരിട്ടുള്ള agency സൂചിപ്പിക്കുന്നു. ‘അവനിലൂടെ’ എന്നത് മൂലവാക്യം ആവശ്യപ്പെടാത്ത പരോക്ഷ ഉപകരണഭാവം സൃഷ്ടിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. അപൂർണ്ണകാല ക്രിയകളുടെ തുടർച്ച ‘പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ,’ ‘സന്തോഷിച്ചുകൊണ്ടിരുന്നു’ എന്നീ രൂപങ്ങളിൽ നിലനിർത്തി. ‘ലജ്ജിതരായി’ ഔപചാരികതയും സ്വാഭാവികതയും തുല്യമായി പാലിക്കുന്നു; ‘നാണംകെട്ടു’ എന്ന കൂടുതൽ സംസാരഭാഷാപരവും കടുപ്പമുള്ളതുമായ രൂപം ഒഴിവാക്കി.
