source:
  edition: SBLGNT
  text: καὶ ἐπέθηκεν αὐτῇ τὰς χεῖρας· καὶ παραχρῆμα ἀνωρθώθη, καὶ ἐδόξαζεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/013.yaml
  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: ml
  text: അവൻ അവളുടെമേൽ തന്റെ കൈകൾ വെച്ചു. ഉടൻതന്നെ അവൾ നിവർന്നു[a]; അവൾ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൾ നേരെയാക്കപ്പെട്ടു’; അല്ലെങ്കിൽ, ‘അവൾ നിവർന്നുനിന്നു.’
    reason: ἀνωρθώθη കർമണിരൂപത്തിലാണ്; പ്രധാനവാചകത്തിലെ സ്വാഭാവികമായ ഫലാവസ്ഥാ-പരിഭാഷയ്ക്കൊപ്പം കർമണിയായും നിലയെ ഊന്നിയുമുള്ള പരിഭാഷാസാധ്യതകൾ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: അവൻ അവളുടെമേൽ കൈകൾ വെച്ചു
  rationale: കൈകൾ ഒരാളുടെമേൽ വെക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ മൂർത്തമായ പ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; കർത്താവ് യേശുവാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: παραχρῆμα
  choice: ഉടൻതന്നെ
  rationale: സൗഖ്യം കാലതാമസമില്ലാതെ സംഭവിച്ചതെന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀνωρθώθη
  choice: അവൾ നിവർന്നു
  rationale: കുനിഞ്ഞിരുന്ന സ്ത്രീ നേരെയുള്ള നിലയിലായ ശാരീരിക പുനഃസ്ഥാപനം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു. ഗ്രീക്കിലെ രൂപം കർമണിയാണെങ്കിലും അക്ഷരാർഥത്തിലുള്ള കർമണിപ്രയോഗം മലയാളത്തിൽ കൃത്രിമമാകുന്നതിനാൽ ഫലാവസ്ഥയെ മുൻനിർത്തി; സാധ്യമായ കർമണി/നിലനിൽപ്പ് വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ἐδόξαζεν
  choice: മഹത്ത്വപ്പെടുത്തി
  rationale: δοξάζω എന്ന പദത്തിന്റെ ദൈവത്തിന് മഹത്ത്വം നൽകുക എന്ന ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു. ഗ്രീക്ക് അപൂർണഭൂതത്തിന്റെ ദൈർഘ്യസൂചന ഇവിടെ മലയാളകഥനത്തിൽ ലളിതമായ ഭൂതകാലംകൊണ്ട് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸν θεόν
  choice: ദൈവത്തെ
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള കർമത്തിന് അനുയോജ്യമായ സാധാരണ മലയാളരൂപം.
theological_decisions:
- issue: ἀνωρθώθη വിവരിക്കുന്ന സൗഖ്യഫലം
  choice: അവൾ നിവർന്നു
  alternative: അവൾ നേരെയാക്കപ്പെട്ടു / അവൾ നിവർന്നുനിന്നു
  rationale: മുൻസന്ദർഭത്തിലെ കുനിഞ്ഞ ശരീരാവസ്ഥ മാറിയെന്നത് വ്യക്തമാക്കുന്നു; സൗഖ്യത്തിന്റെ പ്രവർത്തനരീതിയെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം ഒന്നും ചേർക്കുന്നില്ല. ഗ്രീക്കിലെ കർമണിരൂപവും ‘നിവർന്നുനിന്നു’ എന്ന ഫലാർഥവും അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. അനാവശ്യമായ സഭാപരമായ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി; ‘മഹത്ത്വപ്പെടുത്തി’ എന്നത് മൂലപദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്താൻ ഉപയോഗിച്ചു.
