id: LUK.13.2
reference: Luke 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: ml
  text: 'അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു: “ഈ ഗലീലക്കാർ ഈ കഷ്ടങ്ങൾ അനുഭവിച്ചതിനാൽ മറ്റെല്ലാ ഗലീലക്കാരെക്കാളും വലിയ പാപികളായിത്തീർന്നു എന്നു നിങ്ങൾ കരുതുന്നുവോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സ്വാഭാവികമായ പ്രതികരണസൂത്രം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο
  choice: മറ്റെല്ലാ ഗലീലക്കാരെക്കാളും വലിയ പാപികളായിത്തീർന്നു
  rationale: παρά എന്ന താരതമ്യവും ἐγένοντο എന്ന ‘ആയിത്തീർന്നു’ എന്ന രൂപവും നിലനിർത്തുന്നു; ‘വലിയ’ എന്നത് താരതമ്യത്തിന്റെ സ്വാഭാവിക മലയാളപ്രകടനമാണ്.
- source_word: ταῦτα πεπόνθασιν
  choice: ഇങ്ങനെ കഷ്ടം അനുഭവിച്ചു
  rationale: സംഭവിച്ച ദുരന്തങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചനപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി സംഗ്രഹിക്കുന്നു; perfect രൂപത്തിന്റെ അനുഭവഫലം പ്രസക്തമായി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ദുരന്തം അനുഭവിച്ചതും പാപത്തിന്റെ അളവും തമ്മിലുള്ള ബന്ധം
  choice: യേശുവിന്റെ ചോദ്യം അതേ താരതമ്യരൂപത്തിലും തുറന്ന നിലയിലും സൂക്ഷിച്ചു
  alternative: അവർ മറ്റുള്ളവരെക്കാൾ കുറ്റക്കാരായിരുന്നതിനാലാണ് ഇത് സംഭവിച്ചതെന്ന് വിശദീകരിക്കുക
  rationale: മൂലവാക്യം അത്തരം കാരണം ഉറപ്പിക്കുന്നില്ല; മറിച്ച് കേൾവിക്കാരുടെ അനുമാനത്തെ ചോദ്യം ചെയ്യുന്നു.
- issue: ἐγένοντο എന്ന ക്രിയയുടെ അർത്ഥം
  choice: പാപികളായിത്തീർന്നു
  alternative: പാപികളായിരുന്നു
  rationale: മൂലത്തിലെ ἐγένοντο എന്ന രൂപവും നൽകിയിരിക്കുന്ന പരിശോധനാപാഠത്തിലെ ‘became’ എന്ന തീരുമാനവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; അതിലൂടെ ഉണ്ടാകുന്ന അർത്ഥപിരിമുറുക്കം പരിഹരിച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന. ചോദ്യം നേരിട്ടും വായനാസൗഹൃദമായും നൽകിയിരിക്കുന്നു; മതവിഭാഗവിശേഷ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
