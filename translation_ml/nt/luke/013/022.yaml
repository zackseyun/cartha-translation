id: LUK.13.22
reference: Luke 13:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: ml
  text: അവൻ പട്ടണങ്ങളിലൂടെയും ഗ്രാമങ്ങളിലൂടെയും സഞ്ചരിച്ചുകൊണ്ട് ഉപദേശിക്കുകയും യെരൂശലേമിന്റെ ദിശയിൽ യാത്ര തുടരുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെരൂശലേമിലേക്കു.”
    reason: εἰς Ἱεροσόλυμα എന്നതിന്റെ ലക്ഷ്യസ്ഥാനത്തെ കൂടുതൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്ന വിവർത്തനവികൽപം; മുഖ്യപാഠത്തിലെ തുടരുന്ന ദിശാഭാവം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: διεπορεύετο
  choice: സഞ്ചരിച്ച്
  rationale: അപൂർണ ഭൂതകാലരൂപം വിവിധ സ്ഥലങ്ങളിലൂടെയുള്ള തുടർച്ചയായ സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു; വാക്യത്തിലെ പ്രധാന ക്രിയയായ ‘യാത്ര തുടർന്നു’യോടു ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി ഈ പുരോഗമനഭാവം നൽകുന്നു.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: പട്ടണങ്ങളിലും ഗ്രാമങ്ങളിലുംകൂടി
  rationale: κατά + ദ്വിതീയാവിഭക്തി ഇവിടെ പല വലുതും ചെറുതുമായ ജനവാസകേന്ദ്രങ്ങളിലൂടെയുള്ള വിതരണാത്മക സഞ്ചാരം സൂചിപ്പിക്കുന്നു; ‘പട്ടണങ്ങൾ/ഗ്രാമങ്ങൾ’ എന്ന വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: διδάσκων
  choice: ഉപദേശിച്ചുകൊണ്ട്
  rationale: വർത്തമാനകാല കൃതന്തം യാത്രയ്ക്കൊപ്പം നടന്നുകൊണ്ടിരുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ച്ചുകൊണ്ട്’ രൂപം ആ സഹകാലികത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πορείαν ποιούμενος
  choice: യാത്ര തുടർന്നു
  rationale: ‘യാത്ര നടത്തുക/വഴി ചെയ്യുക’ എന്ന ആശയമുള്ള ഈ പ്രയോഗം ലക്ഷ്യബോധത്തോടെയുള്ള പുരോഗമനത്തെ സൂചിപ്പിക്കുന്നു; ‘യാത്ര തുടർന്നു’ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭത്തിലെ തുടരുന്ന സഞ്ചാരത്തിന് യോജിച്ചതുമാണ്.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിലേക്കു
  rationale: εἰς ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ദിശയെയോ ലക്ഷ്യത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ എത്തിച്ചേരൽക്കാൾ തുടരുന്ന യാത്രയാണ് മുന്നിൽ നിൽക്കുന്നത്; ‘-ലേക്കു’ ഈ ദിശാഭാവവും ‘to/toward’ എന്ന യഥാർഥ സാദ്ധ്യതയും തുറന്നുവയ്ക്കുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ ലിപ്യന്തരണം സ്വീകരിച്ചു.
theological_decisions:
- issue: യേശുവിന്റെ യെരൂശലേമിലേക്കുള്ള യാത്രയുടെ ആഖ്യാനദിശ
  choice: യെരൂശലേമിലേക്കു യാത്ര തുടർന്നു
  alternative: യെരൂശലേമിലേക്കു യാത്ര ചെയ്തു
  rationale: ലൂക്കോസിലെ വിപുലമായ യാത്രാഖ്യാനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ വാക്യം എത്തിച്ചേരലിനേക്കാൾ പുരോഗമിച്ചുകൊണ്ടിരിക്കുന്ന യാത്രയെ എടുത്തുകാട്ടുന്നു. അധികമായ ദൈവശാസ്ത്രനിഗമനം ചേർക്കാതെ ആഖ്യാനത്തിലെ ലക്ഷ്യദിശ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അവൻ’ എന്ന സർവനാമം ഗ്രീക്ക് മൂലത്തിലെ സൂചിത കർത്താവിനെ പിന്തുടരുന്നു; വാക്യത്തിൽ ഇല്ലാത്ത ‘യേശു’ എന്ന പേര് ചേർത്തിട്ടില്ല. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
