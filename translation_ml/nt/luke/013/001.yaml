  to: അതേ സമയത്ത് അവിടെ ഉണ്ടായിരുന്ന ചിലർ, പീലാത്തോസ് ഗലീലക്കാരുടെ രക്തം അവരുടെ യാഗങ്ങളുമായി കലർത്തിയതിനെക്കുറിച്ച് അവനോടു അറിയിച്ചു.[a]
