  revision_rationale: The revision restores the distinction between the indefinite reporting group and the Galileans, explicitly retains the source’s ‘were present’ sense, and preserves the stark, unexplained description of Pilate’s action. The footnote remains anchored to ‘കലർത്തിയതിനെക്കുറിച്ച്’ and offers only a lexical alternative.
