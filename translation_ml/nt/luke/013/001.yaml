id: LUK.13.1
reference: Luke 13:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: ml
  text: അതേ സമയത്ത് അവിടെ ഉണ്ടായിരുന്ന ചിലർ, പീലാത്തോസ് ഗലീലക്കാരുടെ രക്തം അവരുടെ യാഗങ്ങളുമായി കലർത്തിയതിനെക്കുറിച്ച് അവനോടു അറിയിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ യാഗങ്ങളോടു കൂട്ടിക്കലർത്തി.’
    reason: μίγνυμι എന്ന ക്രിയയുടെ ‘കലർത്തുക/കൂട്ടിക്കലർത്തുക’ എന്ന പദപരമായ മറ്റൊരു സാധ്യത സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: Παρῆσαν δέ τινες
  choice: ചിലർ ... അറിയിച്ചു
  rationale: പാർειμι എന്ന അപൂർണകാലരൂപം ചിലരുടെ സാന്നിധ്യം സൂചിപ്പിക്കുന്നു; എന്നാൽ മലയാളത്തിൽ ‘ചിലർ അവിടെ ഉണ്ടായിരുന്നു, അറിയിച്ചു’ എന്നു പറയുന്നത് കൃത്രിമമായതിനാൽ, സാന്നിധ്യം സമയസൂചനയോടും അറിയിക്കൽക്രിയയോടും സ്വാഭാവികമായി ഉൾക്കൊള്ളിച്ചു. δέയുടെ മൃദുവായ ബന്ധകബലം വേറെ പദം ചേർക്കാതെ വാക്യപ്രവാഹത്തിൽ നിലനിർത്തി.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: അതേ സമയത്തുതന്നെ
  rationale: αὐτῷയുടെ ഊന്നലും മുൻസന്ദർഭവുമായി ഉള്ള സമയബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: അവനോടു അറിയിച്ചു
  rationale: വാർത്തയോ വിവരമോ അറിയിക്കുന്ന പങ്കുവാചകത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα
  choice: ചില ഗലീലക്കാരുടെ രക്തം ... എന്നതിനെക്കുറിച്ച്
  rationale: περί വിഷയത്തെ സൂചിപ്പിക്കുന്നു; ബന്ധസർവനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥഘടനയായി മാറ്റി.
- source_word: Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν
  choice: അവരുടെ യാഗങ്ങളോടു കലർത്തി
  rationale: μίγνυμι എന്നതിന്റെ നേരിട്ടുള്ള ‘കലർത്തുക’ എന്ന അർഥവും αὐτῶν എന്ന ഉടമസ്ഥസൂചനയും നിലനിർത്തുന്നു; സംഭവം എങ്ങനെ നടന്നു എന്ന് വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: പീലാത്തോസിന്റെ പ്രവൃത്തിയുടെ ചരിത്രപരവും ധാർമികവുമായ സ്വഭാവം
  choice: ഗലീലക്കാരുടെ രക്തം അവരുടെ യാഗങ്ങളോടു പീലാത്തോസ് കലർത്തിയെന്ന ഞെട്ടിക്കുന്ന റിപ്പോർട്ട് നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘അവർ യാഗം അർപ്പിക്കുമ്പോൾ പീലാത്തോസ് അവരെ കൊന്നു’ എന്ന് വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം സംഭവത്തിന്റെ രീതി അല്ലെങ്കിൽ ദൈവശാസ്ത്രപരമായ അർഥം വിശദീകരിക്കുന്നില്ല; അതിനാൽ അതിലെ സംക്ഷിപ്തതയും സംഘർഷവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ഘടനാപരമായ അസ്വാഭാവികത വാക്കിന് വാക്കായി പകർത്താതെ, വിവരക്രമവും ഞെട്ടിക്കുന്ന മുഖ്യപ്രസ്താവനയും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
