id: LUK.13.31
reference: Luke 13:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: ml
  text: 'ആ സമയത്തുതന്നെ[a] ചില പരീശന്മാർ അടുത്തുവന്ന് അവനോട് പറഞ്ഞു: “ഇവിടം വിട്ട് പോകുക[b], കാരണം ഹെരോദാവ് നിന്നെ കൊല്ലാൻ ആഗ്രഹിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അതേ സമയത്ത്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഇവിടെനിന്ന് പുറപ്പെട്ടുപോകുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: ആ സമയത്തുതന്നെ
  rationale: αὐτῇ നൽകുന്ന ഊന്നലും സംഭവത്തിന്റെ കൃത്യവും ഉടനടിയുമായ സമയബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ὥρα ഇവിടെ ‘നാഴിക’ എന്ന കൃത്യമായ അളവിലേക്കു നിർബന്ധമായി ചുരുക്കുന്നില്ല.
- source_word: προσῆλθάν
  choice: അടുത്തുവന്ന്
  rationale: യേശുവിന്റെ അടുക്കലേക്കു സമീപിച്ചുവരുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τινες Φαρισαῖοι
  choice: ചില പരീശന്മാർ
  rationale: τινες-ന്റെ അനിശ്ചിതത്വം നിലനിർത്തുകയും ഏതൊക്കെ പരീശന്മാരാണെന്ന് അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: λέγοντες αὐτῷ
  choice: അവനോട് പറഞ്ഞു
  rationale: പ്രധാനക്രിയയോടൊപ്പം നടക്കുന്ന പങ്കാളിക്രിയയെ വായിക്കാൻ എളുപ്പമുള്ള മലയാളത്തിലെ സമാപികക്രിയയായി നൽകുന്നു.
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: ഇവിടം വിട്ട് പൊയ്ക്കൊള്ളുക
  rationale: സ്ഥലം വിട്ടിറങ്ങുക, അവിടെനിന്ന് യാത്രയാകുക എന്നീ ചേർന്ന ആശയങ്ങൾ സ്വാഭാവികമായ ഏക മലയാള പ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു; കല്പനയുടെ ഏകവചനഭാവവും നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുന്നറിയിപ്പിനുള്ള കാരണം നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: Ἡρῴδης
  choice: ഹെരോദാവ്
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പേരുരൂപം ഉപയോഗിക്കുന്നു.
- source_word: θέλει
  choice: ആഗ്രഹിക്കുന്നു
  rationale: θέλω-യുടെ ഇച്ഛയെയോ ആഗ്രഹത്തെയോ സൂചിപ്പിക്കുന്ന അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; ‘തീരുമാനിച്ചിരിക്കുന്നു’ എന്നതുപോലെ ഉദ്ദേശ്യത്തിന്റെ ഉറപ്പ് അധികമായി ചേർക്കുന്നില്ല.
- source_word: σε ἀποκτεῖναι
  choice: നിന്നെ കൊല്ലാൻ
  rationale: കൊല്ലുക എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം വ്യക്തമായി നൽകുന്നു; ഔദ്യോഗിക വധശിക്ഷയെന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പരീശന്മാരുടെ മുന്നറിയിപ്പിനു പിന്നിലെ ഉദ്ദേശ്യം
  choice: അവരുടെ വാക്കുകൾ ഒരു മുന്നറിയിപ്പായി നേരിട്ട് രേഖപ്പെടുത്തുന്നു; അവരുടെ ഉദ്ദേശ്യം നിർവചിക്കുന്നില്ല.
  alternative: അവർ യേശുവിനെ ആത്മാർഥമായി രക്ഷിക്കാൻ ശ്രമിച്ചുവെന്നോ, ഭയപ്പെടുത്തി അവിടെനിന്ന് നീക്കാൻ ശ്രമിച്ചുവെന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാചകം പരീശന്മാരുടെ ആന്തരിക ഉദ്ദേശ്യം വെളിപ്പെടുത്തുന്നില്ല. അതിനാൽ ആത്മാർഥതയോ വഞ്ചനയോ വിവർത്തനത്തിൽ ചേർക്കാതെ ആഖ്യാനത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആ സമയത്തുതന്നെ’ എന്നത് ഉടനടിത്തവും ഊന്നലും നൽകുന്നു; ‘പൊയ്ക്കൊള്ളുക’ നേരിട്ടുള്ള കല്പനയായിരുന്നാലും അനാവശ്യമായി പരുഷമാകുന്നില്ല.
