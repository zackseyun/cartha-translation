source:
  edition: SBLGNT
  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: ml
  text: വരുംകാലത്ത് അതു ഫലം കായിച്ചാൽ—നന്ന്; ഇല്ലെങ്കിൽ[a] അങ്ങ് അതു വെട്ടിക്കളയും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടുത്ത വർഷം’ എന്നും പരിഭാഷപ്പെടുത്താം. ചില പരിഭാഷകൾ മുൻവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽനിന്ന് കൂടുതൽ നിർദിഷ്ടമായ ഈ കാലസൂചന ചേർക്കുന്നു; എന്നാൽ ഇവിടെ ഗ്രീക്ക് പദപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ഭാവിക്കായി’ അഥവാ ‘വരാനിരിക്കുന്ന കാലത്ത്’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: അതുചെയ്താൽ എന്ന നിബന്ധനയായി ‘അതു ... കായിച്ചാൽ’
  rationale: καί + ἐάν എന്ന നിബന്ധനാഭാവവും μέν...δέ എന്ന വൈരുധ്യഘടനയും മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധനയും തുടർന്നുള്ള ‘ഇല്ലെങ്കിൽ’ എന്ന പ്രത്യുത്തരവുംകൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: ποιήσῃ καρπὸν
  choice: ഫലം കായിച്ചാൽ
  rationale: ποιέω + καρπός എന്ന കൃഷിസംബന്ധിയായ പ്രയോഗത്തിന് മലയാളത്തിലെ സ്വാഭാവികമായ സമാനപ്രയോഗം ‘ഫലം കായിക്കുക’ ആണ്; അത്തിവൃക്ഷത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു.
- source_word: εἰς τὸ μέλλον
  choice: വരുംകാലത്ത്
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിലെ പൊതുവായ ഭാവികാലസൂചന നിലനിർത്തുന്നു; മുൻവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽനിന്ന് ‘അടുത്ത വർഷം’ എന്ന് മുഖ്യപാഠത്തിൽ കൂടുതൽ നിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: εἰ δὲ μήγε
  choice: ഇല്ലെങ്കിൽ
  rationale: മുൻപറഞ്ഞ നിബന്ധനയുടെ നിഷേധവും δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യവും മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐκκόψεις αὐτήν
  choice: അങ്ങേക്ക് അതു വെട്ടിക്കളയാം
  rationale: ἐκκόπτω എന്നത് ഈ തോട്ടപരിപാലനസന്ദർഭത്തിൽ വൃക്ഷം വെട്ടിക്കളയുന്നതിനെ സൂചിപ്പിക്കുന്നു. രണ്ടാംപുരുഷ ഏകവചനത്തെ ആദരസൂചകമായ ‘അങ്ങേക്ക്’കൊണ്ട് അവതരിപ്പിക്കുന്നു; ഭാവികാലത്തിന്റെ ഫലം മലയാളത്തിലെ അനുമതി/തുടർനടപടി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉടമയുടെ നീട്ടിവെച്ച ന്യായവിധിയുടെ കാലസൂചന
  choice: നിബന്ധനാപരമായ ഫലം നിലനിർത്തി, εἰς τὸ μέλλον എന്നത് ‘വരുംകാലത്ത്’ എന്നു പൊതുവായി പരിഭാഷപ്പെടുത്തി.
  alternative: മുൻവാക്യത്തിലെ χρονόν എന്നതുമായി ചേർത്ത് ‘അടുത്ത വർഷം’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ‘അടുത്ത വർഷം’ എന്നു വ്യക്തമായി പറയുന്നില്ല; വരാനിരിക്കുന്ന കാലത്തെയാണ് പൊതുവായി സൂചിപ്പിക്കുന്നത്. അതിനാൽ ന്യായവിധി വൈകിയെങ്കിലും സംഭവിക്കാവുന്നതാണെന്ന ഉപമയിലെ സംഘർഷം അനാവശ്യമായ കാലനിർണ്ണയം കൂടാതെ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കൃഷിരൂപകത്തിലെ ‘ഫലം കായിക്കുക’, ‘വെട്ടിക്കളയുക’ എന്നീ സാധാരണ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. സംഭാഷണത്തിന്റെ ആദരഭാവത്തിനായി ‘അങ്ങേക്ക്’ സ്വീകരിച്ചു; ഗ്രീക്കിലെ കാലസൂചനയുടെ അവ്യക്തത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
