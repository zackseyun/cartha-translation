id: LUK.13.12
reference: Luke 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവളെ കണ്ടപ്പോൾ അവളെ വിളിച്ച് അവളോടു പറഞ്ഞു: “സ്ത്രീയേ, നിന്റെ ബലഹീനതയിൽനിന്ന് നീ മോചിതയായിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “നിന്റെ അശക്തിയിൽനിന്ന് നീ വിടുവിക്കപ്പെട്ടിരിക്കുന്നു.”
    reason: ἀπολέλυσαι, ἀσθένεια എന്നീ പദങ്ങൾക്ക് സാധ്യമായ ‘വിടുവിക്കപ്പെട്ടിരിക്കുന്നു’, ‘അശക്തി’ എന്നീ പദപ്രയോഗങ്ങൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ aorist participle ഇവിടെ സമയബന്ധം സൂചിപ്പിക്കുന്നു; ‘കണ്ടപ്പോൾ’ എന്നത് സംഭവക്രമം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: δέ ആഖ്യാനത്തിലെ മുന്നേറ്റത്തോടൊപ്പം നേരിയ വൈരുധ്യവും സൂചിപ്പിക്കാം; സന്ദർഭത്തിലെ തിരിവ് അതിശയോക്തിയില്ലാതെ പ്രകടമാക്കാൻ ‘എന്നാൽ’ യോജിക്കുന്നു.
- source_word: προσεφώνησεν
  choice: അവളെ വിളിച്ച്
  rationale: προσφωνέω ഒരാളെ വിളിക്കുകയോ നേരിട്ട് അഭിസംബോധന ചെയ്യുകയോ എന്നർഥം നൽകുന്നു; ഇവിടെ യേശു അവളോട് മുൻകൈയെടുത്ത് സംസാരിക്കുന്നതു സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Γύναι
  choice: സ്ത്രീയേ
  rationale: γύναι മാന്യമായ നേരിട്ടുള്ള സംബോധനയാണ്. സ്നേഹസൂചനയോ സാമൂഹിക പദവിയോ അധികമായി ചേർക്കാതെ അതിനെ നേരിട്ട് പകരുന്നു.
- source_word: ἀπολέλυσαι
  choice: നീ മോചിതയായിരിക്കുന്നു
  rationale: ἀπολύω എന്ന ക്രിയയുടെ perfect passive രൂപം പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലവും സൂചിപ്പിക്കുന്നു; സ്ത്രീയെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ മലയാളത്തിൽ സ്ത്രീലിംഗരൂപം ഉപയോഗിച്ചു.
- source_word: τῆς ἀσθενείας σου
  choice: നിന്റെ ബലഹീനതയിൽനിന്ന്
  rationale: ἀσθένεια ബലഹീനത, രോഗാവസ്ഥ, അശക്തി എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്. ശാരീരിക കഷ്ടതയെന്ന സന്ദർഭം നിലനിർത്തിക്കൊണ്ട് ആധുനിക രോഗനിർണയം അനാവശ്യമായി ചുമത്താതിരിക്കാൻ ‘ബലഹീനത’ തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ἀσθένεια സൂചിപ്പിക്കുന്ന സ്ത്രീയുടെ അവസ്ഥയുടെ സ്വഭാവം
  choice: ‘ബലഹീനത’ എന്ന വിശാലമായ പദം ഉപയോഗിക്കുക
  alternative: ‘രോഗം’, ‘അശക്തി’ അല്ലെങ്കിൽ ‘വൈകല്യം’ എന്നു പ്രത്യേകീകരിക്കുക
  rationale: സമീപസന്ദർഭം ശാരീരികമായ കഷ്ടത വ്യക്തമാക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പദം അതിലധികം വിശാലമാണ്. ഒരു പ്രത്യേക വൈദ്യശാസ്ത്രവിഭാഗമോ ആധുനിക രോഗനിർണയമോ പാഠത്തിലേക്ക് കൊണ്ടുവരാതെ മൂലപദത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മോചിതയായിരിക്കുന്നു’ എന്ന രൂപം perfect passive-ന്റെ പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴത്തെ ഫലാവസ്ഥയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; സംബോധനയിൽ ‘സ്ത്രീയേ’ എന്ന നേരിട്ടും മാന്യവുമായ രൂപം ഉപയോഗിച്ചു.
