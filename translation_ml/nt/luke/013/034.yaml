id: LUK.13.34
reference: Luke 13:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: ml
  text: യെരൂശലേമേ, യെരൂശലേമേ, പ്രവാചകന്മാരെ കൊല്ലുകയും നിന്റെ അടുക്കലേക്ക് അയയ്ക്കപ്പെട്ടവരെ കല്ലെറിഞ്ഞു കൊല്ലുകയും ചെയ്യുന്നവളേ[a]—ഒരു പിടക്കോഴി[b] തന്റെ കുഞ്ഞുങ്ങളെ ചിറകുകൾക്കു കീഴിൽ ചേർത്തുകൂട്ടുന്നതുപോലെ നിന്റെ മക്കളെ ചേർത്തുകൂട്ടാൻ എത്രയോ പ്രാവശ്യം ഞാൻ ആഗ്രഹിച്ചു, എന്നാൽ നിങ്ങൾ ആഗ്രഹിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഇവിടെ വർത്തമാനകാല കൃദന്തരൂപങ്ങളാണ്; ദൈവത്തിന്റെ ദൂതന്മാരോടുള്ള യെരൂശലേമിന്റെ പതിവായ പെരുമാറ്റത്തെ അവ ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ ὄρνις എന്ന പദത്തിന് പൊതുവേ ‘പക്ഷി’ എന്നും അർഥമാകാം. എങ്കിലും കുഞ്ഞുങ്ങളെ ചിറകുകൾക്കു കീഴിൽ ചേർത്തുകൂട്ടുന്ന മാതൃരൂപകത്തിൽ ‘പിടക്കോഴി’യാണ് ഏറ്റവും സ്വാഭാവികമായ വിവർത്തനം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: യെരൂശലേമേ, യെരൂശലേമേ
  rationale: നഗരത്തോടുള്ള നേരിട്ടുള്ള, വിലാപഭരിതമായ സംബോധന വ്യക്തമാക്കാൻ മലയാളത്തിലെ സംബോധനരൂപവും ഗ്രീക്കിലെ ആവർത്തനവും നിലനിർത്തി.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: പ്രവാചകന്മാരെ കൊല്ലുകയും ... കല്ലെറിയുകയും ചെയ്യുന്നവളേ
  rationale: വർത്തമാനകാല കൃദന്തരൂപങ്ങൾ യെരൂശലേമിന്റെ സ്വഭാവസവിശേഷമായ പ്രവൃത്തിയെ ചിത്രീകരിക്കുന്നു. നഗരത്തിന്റെ വ്യാകരണപരവും രൂപകപരവുമായ സ്ത്രീലിംഗ വ്യക്തിവൽക്കരണം ‘ചെയ്യുന്നവളേ’യിൽ നിലനിർത്തി.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: നിന്റെ അടുക്കലേക്ക് അയയ്ക്കപ്പെട്ടവരെ
  rationale: പൂർണ്ണകാല കർമണിപ്രയോഗത്തിന്റെ passive അർഥം നിലനിർത്തുകയും, മൂന്നാംപുരുഷത്തിലെ ഗ്രീക്ക് രൂപത്തെ നേരിട്ടുള്ള സംബോധനയ്ക്ക് സ്വാഭാവികമായ മലയാള രണ്ടാംപുരുഷരൂപമാക്കുകയും ചെയ്തു.
- source_word: ποσάκις ἠθέλησα
  choice: എത്രയോ പ്രാവശ്യം ഞാൻ ആഗ്രഹിച്ചു
  rationale: ποσάκις എന്ന വിലാപാത്മകമായ ‘എത്ര പ്രാവശ്യം’ എന്ന ഭാവവും θέλωയുടെ ആഗ്രഹം/ഇച്ഛ എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπισυνάξαι
  choice: ചേർത്തുകൂട്ടാൻ
  rationale: സാധാരണ ‘കൂട്ടുക’ എന്നതിനെക്കാൾ compound ക്രിയയിലെ ഒരിടത്തേക്ക് ഒരുമിച്ചുചേർക്കുന്ന ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: τὰ τέκνα σου
  choice: നിന്റെ മക്കളെ
  rationale: യെരൂശലേമിനെ മാതൃനഗരമായി വ്യക്തിവൽക്കരിക്കുന്ന രൂപകം നിലനിർത്തുന്നു; ആരെയാണ് സൂചിപ്പിക്കുന്നത് എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ὄρνις
  choice: ഒരു പിടക്കോഴി
  rationale: ὄρνις പൊതുവായി പക്ഷിയെ സൂചിപ്പിക്കാമെങ്കിലും കുഞ്ഞുങ്ങളെ ചിറകിൻകീഴിൽ ചേർക്കുന്ന മാതൃരൂപകത്തിൽ ‘പിടക്കോഴി’ ഏറ്റവും സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: τὴν ἑαυτῆς νοσσιὰν
  choice: തന്റെ കുഞ്ഞുങ്ങളെ
  rationale: νοσσιάയുടെ കൂട്ടമായ ഇളംപക്ഷികൾ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘കുഞ്ഞുങ്ങൾ’കൊണ്ട് നൽകുന്നു.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: എന്നാൽ നിങ്ങൾക്ക് മനസ്സില്ലായിരുന്നു
  rationale: ബഹുവചനമായ ἠθελήσατε നിലനിർത്തി, മുൻപത്തെ ഏകവചന സംബോധനയിൽ നിന്ന് നഗരത്തിന്റെ മക്കളിലേക്കുള്ള വചനമാറ്റം മറച്ചുവയ്ക്കുന്നില്ല. ‘മനസ്സില്ലായിരുന്നു’ നിരാകരണാത്മക ഇച്ഛയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘നിന്റെ മക്കൾ’ എന്നതിന്റെ സൂചിതർ
  choice: ‘നിന്റെ മക്കൾ’ എന്നു തന്നെ നിലനിർത്തി.
  alternative: യെരൂശലേമിലെ നിവാസികൾ; യെരൂശലേം പ്രതിനിധാനം ചെയ്യുന്ന ഇസ്രായേൽജനം
  rationale: ഗ്രീക്ക് വാചകം മാതൃനഗരത്തിന്റെ രൂപകം ഉപയോഗിക്കുന്നു; സൂചിതരെ കൂടുതൽ കൃത്യമായി നിർവചിക്കുന്നത് വാചകത്തിലെ യഥാർഥ വ്യാഖ്യാനവ്യാപ്തി അനാവശ്യമായി ചുരുക്കും.
- issue: ἠθέλησα / οὐκ ἠθελήσατε എന്ന ഇച്ഛാഭേദം
  choice: ‘ഞാൻ ആഗ്രഹിച്ചു ... നിങ്ങൾക്ക് മനസ്സില്ലായിരുന്നു’
  alternative: ‘ഞാൻ ഇച്ഛിച്ചു ... നിങ്ങൾ ഇച്ഛിച്ചില്ല’; ‘ഞാൻ സന്നദ്ധനായിരുന്നു ... നിങ്ങൾ സന്നദ്ധരായില്ല’
  rationale: യേശുവിന്റെ ആഗ്രഹവും അഭിസംബോധിതരുടെ നിരസനവും വ്യക്തമായി നിലനിർത്തുന്നു; ദൈവഹിതത്തെയും മനുഷ്യഹിതത്തെയും കുറിച്ചുള്ള വിപുലമായ ഒരു സിദ്ധാന്തനിഗമനം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ഏകവചനമായ യെരൂശലേം സംബോധനയും ബഹുവചനമായ അവസാന ക്രിയയും
  choice: ‘ചെയ്യുന്നവളേ’ എന്ന ഏകവചനത്തിനു ശേഷം ‘നിങ്ങൾക്ക്’ എന്ന ബഹുവചനം നിലനിർത്തി.
  alternative: വാക്യമൊട്ടാകെ ഏകവചനമാക്കുക; അവസാനത്തെ ബഹുവചനം ‘നിന്റെ മക്കൾ’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുക
  rationale: ഗ്രീക്കിലെ ശ്രദ്ധേയമായ വചനമാറ്റം വ്യാഖ്യാനപരമായി മിനുക്കിക്കളയാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പിടക്കോഴി,’ ‘ചിറകിൻകീഴിൽ,’ ‘ചേർത്തുകൂട്ടുക’ എന്നീ പദങ്ങൾ ഗ്രാമ്യമായോ അത്യന്തം പണ്ഡിതോചിതമായോ തോന്നാതെ ദൃശ്യരൂപകം വ്യക്തമാക്കുന്നു. വിലാപത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ ആവർത്തനവും ആശ്ചര്യചിഹ്നവും ഉപയോഗിച്ചു.
