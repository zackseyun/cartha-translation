revisions:
- from: യെരൂശലേമേ, യെരൂശലേമേ, പ്രവാചകന്മാരെ കൊല്ലുകയും നിന്റെ അടുക്കലേക്ക് അയയ്ക്കപ്പെട്ടവരെ കല്ലെറിയുകയും ചെയ്യുന്നവളേ[a]—ഒരു പിടക്കോഴി തന്റെ കുഞ്ഞുങ്ങളെ ചിറകിൻകീഴിൽ ചേർത്തുകൂട്ടുന്നതുപോലെ നിന്റെ മക്കളെ ചേർത്തുകൂട്ടാൻ എത്രയോ പ്രാവശ്യം ഞാൻ ആഗ്രഹിച്ചു! എന്നാൽ നിങ്ങൾക്ക് മനസ്സില്ലായിരുന്നു.[b]
  to: യെരൂശലേമേ, യെരൂശലേമേ, പ്രവാചകന്മാരെ കൊല്ലുകയും നിന്റെ അടുക്കലേക്ക് അയയ്ക്കപ്പെട്ടവരെ കല്ലെറിഞ്ഞു കൊല്ലുകയും ചെയ്യുന്നവളേ[a]—ഒരു പിടക്കോഴി[b] തന്റെ കുഞ്ഞുങ്ങളെ ചിറകുകൾക്കു കീഴിൽ ചേർത്തുകൂട്ടുന്നതുപോലെ നിന്റെ മക്കളെ ചേർത്തുകൂട്ടാൻ എത്രയോ പ്രാവശ്യം ഞാൻ ആഗ്രഹിച്ചു, എന്നാൽ നിങ്ങൾ ആഗ്രഹിച്ചില്ല.
  rationale: The revision makes the stoning verb semantically explicit, retains the source’s plural ‘wings,’ and renders the final volitional contrast with the same directness as the Greek. It also restores a lexical footnote at ‘പിടക്കോഴി’ for the genuine breadth of ὄρνις. The source’s ambiguity concerning the referent of ‘your children’ remains unchanged.
  reviewer_model: gpt-5.6-terra
