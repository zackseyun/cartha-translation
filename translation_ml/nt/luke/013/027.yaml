id: LUK.13.27
reference: Luke 13:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: ml
  text: 'അവൻ നിങ്ങളോടു പറയും: “നിങ്ങൾ എവിടെനിന്നുള്ളവരാണെന്ന് എനിക്ക് അറിയില്ല. അനീതി പ്രവർത്തിക്കുന്ന നിങ്ങളെല്ലാവരും എന്നിൽനിന്ന് അകന്നുപോകുവിൻ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അനീതി പ്രവർത്തിക്കുന്നവർ” എന്നതിന് “അധർമ്മം പ്രവർത്തിക്കുന്നവർ” അല്ലെങ്കിൽ “തെറ്റു ചെയ്യുന്നവർ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: അവൻ നിങ്ങളോടു പറയും
  rationale: ἐρεῖ λέγων എന്ന ഗ്രീക്ക് പ്രയോഗത്തിലെ ആവർത്തനസ്വഭാവമുള്ള കൃതന്തത്തെ മലയാളത്തിൽ വേർതിരിച്ചു പുനരാവർത്തിക്കാതെ, നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന അതിന്റെ മുഴുവൻ പ്രവർത്തനവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἶδα
  choice: എനിക്ക് അറിയില്ല
  rationale: ബന്ധനിഷേധത്തിന്റെ സന്ദർഭസൂചന നിലനിൽക്കുമ്പോഴും, οἶδα എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘അറിയുക’ സംരക്ഷിക്കുന്നു.
- source_word: πόθεν ἐστέ
  choice: നിങ്ങൾ എവിടെനിന്നുള്ളവരാണ്
  rationale: πόθεν സൂചിപ്പിക്കുന്ന ഉത്ഭവമോ വരവിടമോ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: എന്നിൽനിന്ന് അകന്നുപോകുവിൻ
  rationale: നിർണായകമായ വേർപാടിനുള്ള ആജ്ഞയെ ഗൗരവമുള്ളതും വ്യക്തവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: πάντες ἐργάται ἀδικίας
  choice: അനീതി പ്രവർത്തിക്കുന്ന നിങ്ങളെല്ലാവരും
  rationale: വിളിച്ചുപറയുന്ന അഭിസംബോധനയും, ἐργάται എന്നതിലെ പതിവായി പ്രവർത്തിക്കുന്നവരെന്ന ഭാവവും, ἀδικίαയുടെ വിശാലമായ ധാർമിക അർഥവും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിവചനത്തിൽ ἀδικίας എന്നതിന്റെ പരിഭാഷ
  choice: അനീതി
  alternative: അധർമ്മം; തെറ്റായ പ്രവൃത്തി; നിയമലംഘനം
  rationale: ἀδικίαയ്ക്ക് നീതിക്കു വിരുദ്ധമായ പ്രവൃത്തി എന്ന വിശാല അർഥമുണ്ട്. ‘അനീതി’ അതിനെ νόμος എന്ന പ്രത്യേക ആശയത്തിലേക്ക് ചുരുക്കാതെ ധാർമിക ഗൗരവം നിലനിർത്തുന്നു.
- issue: οἶδα എന്നതിലെ ബന്ധനിഷേധത്തിന്റെ സൂചന
  choice: എനിക്ക് അറിയില്ല
  alternative: ഞാൻ നിങ്ങളെ അംഗീകരിക്കുന്നില്ല
  rationale: സന്ദർഭത്തിൽ ബന്ധമോ അംഗീകാരമോ നിഷേധിക്കുന്ന സൂചനയുണ്ടെങ്കിലും, കൂടുതൽ വ്യാഖ്യാനാത്മകമായ വാചകം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ഗ്രീക്കിന്റെ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള വാക്കുകൾക്ക് വ്യക്തമായ വിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ pleonastic ἐρεῖ λέγων മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ ഏകീകരിച്ചു. ‘പോകുവിൻ’ എന്ന രൂപം ന്യായവിധിവചനത്തിന് യോജിച്ച ഗൗരവം നൽകുന്നു.
