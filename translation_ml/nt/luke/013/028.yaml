source:
  edition: SBLGNT
  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: ml
  text: അവിടെ കരച്ചിലും പല്ലുകടിയും ഉണ്ടാകും; അബ്രാഹാമിനെയും യിസ്ഹാക്കിനെയും യാക്കോബിനെയും എല്ലാ പ്രവാചകന്മാരെയും ദൈവരാജ്യത്തിൽ നിങ്ങൾ കാണുമ്പോൾ, നിങ്ങളോ പുറത്താക്കപ്പെട്ടവരായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങളോ പുറത്തേക്ക് എറിയപ്പെടുന്നവരായിരിക്കും.” ഗ്രീക്കിലെ പ്രയോഗം ബലമായി പുറത്താക്കപ്പെടുന്നതിന്റെ ഭാവം ഉൾക്കൊള്ളുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: ന്യായവിധിയുടെയും പുറത്താക്കലിന്റെയും സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനവാചകത്തെ നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ὁ κλαυθμὸς
  choice: കരച്ചിൽ
  rationale: ദുഃഖവും വേദനയും പ്രകടിപ്പിക്കുന്ന പദത്തിന്റെ സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: പല്ലുകടി
  rationale: വേദനയോ രോഷമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും പരിചിതവുമായ മലയാള തുല്യം.
- source_word: ὅταν ὄψησθε
  choice: നിങ്ങൾ കാണുമ്പോൾ
  rationale: ὅταν സഹിതമുള്ള ഉപവാക്യത്തിന്റെ ഭാവികാലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാചകഘടനയിലൂടെ നൽകുന്നു.
- source_word: πάντας τοὺς προφήτας
  choice: എല്ലാ പ്രവാചകന്മാരെയും
  rationale: πάντας എന്ന സമഗ്രതാസൂചന പൂർണമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിൽ
  rationale: പ്രധാന ബൈബിൾ ആശയത്തെ സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാള സംയുക്തപദത്തിൽ നൽകുന്നു.
- source_word: ὑμᾶς δὲ
  choice: നിങ്ങളോ
  rationale: δέ സൂചിപ്പിക്കുന്ന ശക്തമായ വൈരുധ്യവും ὑμᾶς എന്ന സർവനാമത്തിന്റെ ഊന്നലും മലയാളത്തിലെ ‘-ഓ’ ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἐκβαλλομένους ἔξω
  choice: പുറത്തേക്ക് എറിയപ്പെടുന്നതു
  rationale: ἐκβάλλωയുടെ ബലപ്രയോഗത്തോടെയുള്ള പുറത്താക്കൽഭാവവും ἔξωയുടെ ദിശാസൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ന്യായവിധിയുടെ ദൃശ്യഭാഷ
  choice: പുറത്താക്കൽ, കരച്ചിൽ, പല്ലുകടി എന്നീ മൂർത്തമായ ദൃശ്യങ്ങൾ അതേപടി നിലനിർത്തി.
  alternative: ‘അന്തിമശിക്ഷ’ അല്ലെങ്കിൽ ‘അഗാധദുഃഖം’ എന്ന വ്യാഖ്യാനപരമായ പരാവർത്തനം.
  rationale: വാക്യം ദൈവരാജ്യത്തിൽനിന്നുള്ള പുറത്താക്കലും അതിനോടനുബന്ധിച്ച വേദനയും ചിത്രീകരിക്കുന്നു; എന്നാൽ ന്യായവിധിയുടെ സമ്പൂർണ സിദ്ധാന്തം ഇവിടെ വിശദീകരിക്കുന്നില്ല.
- issue: ἐκεῖയുടെ ബന്ധം
  choice: ‘അവിടെ’ എന്നത് പുറത്താക്കപ്പെട്ട അവസ്ഥയെയോ സ്ഥലത്തെയോ സൂചിപ്പിക്കുന്ന വിധത്തിൽ വാക്യാവസാനത്തോട് ചേർത്ത് നൽകി.
  alternative: ‘അവിടെ’ ആദ്യം വെച്ച് കരച്ചിലിനും പല്ലുകടിക്കും നേരിട്ട് ചേർക്കുക.
  rationale: ഗ്രീക്കിലെ സ്ഥാനവാചകത്തിന്റെ സ്വാഭാവിക അർത്ഥം സംരക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ വിധിന്യായദൃശ്യം വ്യക്തമായി കേൾക്കുന്നു; കൃത്യമായ സ്ഥലത്തെ അതിലധികം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. പിതാക്കന്മാരുടെയും പ്രവാചകന്മാരുടെയും പേരുകൾ മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ രൂപത്തിൽ നൽകിയിരിക്കുന്നു; ഗ്രീക്കിലെ ശക്തമായ വൈരുധ്യവും ബലപ്രയോഗത്തോടെയുള്ള പുറത്താക്കലും മൃദൂകരിച്ചിട്ടില്ല.
