review_pass:
  verdict: revise
  source_fidelity: The draft retains the named persons, all the prophets, the kingdom of God, and the contrast of exclusion. However, it reverses the Greek clause order in a way that makes ‘you will see [yourselves] being thrown out’ the meaning. In Greek, the hearers are described as being thrown outside, not as seeing that event. The future-oriented force of ὅταν ὄψησθε is also more clearly represented by ‘കാണുമ്പോൾ’ in the revised sequence.
  naturalness: ‘പുറത്തേക്ക് എറിയപ്പെടുന്നതു കാണും’ is grammatically possible but unnatural and, more importantly, attaches ‘കാണും’ to the wrong object. ‘നിങ്ങളോ പുറത്താക്കപ്പെട്ടവരായി’ is natural modern Malayalam and preserves the participial predication. ‘കരച്ചിലും പല്ലുകടിയും’ is an established and clear rendering.
  terminology: ‘അബ്രാഹാം,’ ‘യിസ്ഹാക്ക്,’ ‘യാക്കോബ്,’ ‘പ്രവാചകന്മാർ,’ and ‘ദൈവരാജ്യം’ are appropriate established biblical terms. ‘പുറത്താക്കപ്പെട്ടവരായി’ communicates exclusion without over-specifying its mechanics; the main text retains the source sense, while a footnote may note the stronger ‘cast/thrown out’ force.
  issues:
  - severity: high
    issue: The final clause is construed as the object of ‘കാണും.’
    rationale: 'The Greek syntax is: ‘when you see Abraham ... in the kingdom of God, but yourselves being cast out.’ It does not say that the hearers will see themselves being expelled. The Malayalam needs an independent predicative clause for ὑμᾶς ... ἐκβαλλομένους ἔξω.'
  - severity: medium
    issue: The word order obscures the source’s opening assertion, ‘There will be weeping and gnashing of teeth there.’
    rationale: Although Malayalam can reorder clauses, beginning with the judgment formula and then giving the ‘when’ clause most clearly reflects the Greek discourse structure and avoids the draft’s misleading attachment.
  - severity: low
    issue: The existing footnote’s alternative duplicates the revised main-clause wording and its lexical explanation is unnecessary for this verse’s main textual issue.
    rationale: A footnote is better used to signal that ‘പുറത്താക്കപ്പെട്ടവരായി’ renders a participle meaning being forcibly cast/thrown out, if that nuance is retained.
  revised_text: അവിടെ കരച്ചിലും പല്ലുകടിയും ഉണ്ടാകും; അബ്രാഹാമിനെയും യിസ്ഹാക്കിനെയും യാക്കോബിനെയും എല്ലാ പ്രവാചകന്മാരെയും ദൈവരാജ്യത്തിൽ നിങ്ങൾ കാണുമ്പോൾ, നിങ്ങളോ പുറത്താക്കപ്പെട്ടവരായിരിക്കും.[a]
