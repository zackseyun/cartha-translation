id: LUK.13.6
reference: Luke 13:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: ml
  text: 'അവൻ ഈ ഉപമ പറഞ്ഞു: “ഒരാൾക്ക് തന്റെ മുന്തിരിത്തോട്ടത്തിൽ നട്ടിരുന്ന ഒരു അത്തിവൃക്ഷം ഉണ്ടായിരുന്നു.[a] അയാൾ അതിൽ ഫലം അന്വേഷിച്ചുവന്നു; എന്നാൽ ഒന്നും കണ്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരാൾ തന്റെ മുന്തിരിത്തോട്ടത്തിൽ ഒരു അത്തിവൃക്ഷം നട്ടിരുന്നു.” ഗ്രീക്ക് രൂപം വൃക്ഷം നട്ട നിലയിൽ ഉണ്ടായിരുന്നുവെന്നതിനാണ് ഊന്നൽ നൽകുന്നത്; ആരാണ് നട്ടതെന്ന് വ്യക്തമാക്കുന്നില്ല.
    reason: വ്യാകരണപരമായ മറ്റൊരു വിവർത്തനസാധ്യത
lexical_decisions:
- source_word: Ἔλεγεν
  choice: പറഞ്ഞു
  rationale: അപൂർണ ഭൂതകാലരൂപം ആഖ്യാനത്തിന്റെ അവതരണപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്ന ലളിത ഭൂതകാലം ഉപമയ്ക്ക് സ്വാഭാവികമായ തുടക്കം നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: δέ മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ വേറൊരു ബന്ധകപദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ആഖ്യാനത്തുടർച്ച സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: παραβολήν
  choice: ഉപമ
  rationale: യേശുവിന്റെ ദൃഷ്ടാന്താത്മകമായ പഠിപ്പിക്കൽക്കഥയെ സൂചിപ്പിക്കുന്ന പ്രചാരമുള്ളതും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: Συκῆν
  choice: അത്തിവൃക്ഷം
  rationale: അത്തിമരത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ഔപചാരികവും വ്യക്തവുമായ രൂപം.
- source_word: εἶχέν τις
  choice: ഒരാൾക്ക് ... ഉണ്ടായിരുന്നു
  rationale: τις അനിശ്ചിതമായ ഒരു വ്യക്തിയെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥതാഘടനയായ ‘ഒരാൾക്ക് ... ഉണ്ടായിരുന്നു’ ലിംഗം അനാവശ്യമായി നിർണ്ണയിക്കാതെ മൂലത്തിന്റെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: πεφυτευμένην
  choice: നട്ടിരുന്ന
  rationale: പൂർണ്ണകാല കർമണി കൃദന്തരൂപം വൃക്ഷം നട്ട നിലയിൽ തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നട്ടിരുന്ന’ അത് സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: തന്റെ മുന്തിരിത്തോട്ടത്തിൽ
  rationale: ἀμπελών എന്നതിന് ‘മുന്തിരിത്തോട്ടം’ കൃത്യവും സാധാരണവുമായ തുല്യപദമാണ്; സ്വപ്രതിഫലകമായ ‘തന്റെ’ ഉടമസ്ഥനെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἦλθεν ζητῶν
  choice: അന്വേഷിച്ചുവന്നു
  rationale: പ്രധാനക്രിയയോടൊപ്പമുള്ള സജീവമായ തിരച്ചിൽ എന്ന ഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: καρπὸν
  choice: ഫലം
  rationale: നേരിട്ടുള്ള അർത്ഥവും ഉപമയിലെ രൂപകസാധ്യതയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῇ
  choice: അതിൽ
  rationale: വൃക്ഷത്തിൽ ഫലം അന്വേഷിക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὐχ εὗρεν
  choice: ഒന്നും കണ്ടില്ല
  rationale: മുമ്പ് പരാമർശിച്ച ഫലത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാണ്; ആവർത്തനം ഒഴിവാക്കി ഗ്രീക്കിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപമയിലെ അനിശ്ചിത കർത്താവായ τις
  choice: ഒരാൾ
  alternative: ഒരു മനുഷ്യൻ / ഒരുവൻ
  rationale: ഗ്രീക്ക് പദം വ്യക്തിയുടെ ലിംഗത്തെ നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല. ‘ഒരാൾ’ സാധാരണ മലയാളകഥനശൈലിക്ക് യോജിക്കുകയും മൂലത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിക്കുകയും ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘അത്തിവൃക്ഷം’, ‘മുന്തിരിത്തോട്ടം’, ‘ഉപമ’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. [a] അടിക്കുറിപ്പുചിഹ്നം ബന്ധപ്പെട്ട മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടുണ്ട്.
