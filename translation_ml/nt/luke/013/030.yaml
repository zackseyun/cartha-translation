id: LUK.13.30
reference: Luke 13:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: ml
  text: ഇതാ[a], അവസാനത്തുള്ള ചിലർ ഒന്നാമതുള്ളവരാകും; ഒന്നാമതുള്ള ചിലർ അവസാനത്തുള്ളവരാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശ്രദ്ധിക്കുക.”
    reason: ἰδοὺ എന്ന ശ്രദ്ധാകർഷക പ്രയോഗത്തിന്റെ മറ്റൊരു സ്വാഭാവിക മലയാളരൂപം.
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: ἔσχατοι
  choice: അവസാനക്കാർ
  rationale: സ്ഥാനം അല്ലെങ്കിൽ പദവി സംബന്ധിച്ച വിപരീതതയാണ് ഇവിടെ പ്രധാനമായും സൂചിപ്പിക്കുന്നത്; ധാർമ്മികമായി ‘ഏറ്റവും നിസ്സാരർ’ എന്ന അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: πρῶτοι
  choice: ഒന്നാമർ
  rationale: ἔσχατοι എന്നതിന് സമാന്തരമായ നേരിട്ടുള്ള പ്രതിപദം; വാക്യത്തിന്റെ സംക്ഷിപ്തമായ വിപരീതഘടന കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: εἰσὶν
  choice: ആയ ചിലർ
  rationale: ഗ്രീക്കിലെ അസ്തിത്വസൂചക പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ഇത് എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന നിർവചനമെന്നതിലുപരി ചിലരെക്കുറിച്ചുള്ള പ്രസ്താവനയാണെന്ന ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οἳ ἔσονται
  choice: ആകും
  rationale: ഭാവികാലത്തിലുള്ള predication മലയാളത്തിൽ ലളിതമായ ഭാവിരൂപത്തിലൂടെ വ്യക്തമായി നൽകുന്നു.
- source_word: καὶ
  choice: ;
  rationale: രണ്ടു സമാന്തര ഉപവാക്യങ്ങൾ തമ്മിലുള്ള ബന്ധവും സമതുലിതത്വവും മലയാളത്തിൽ അർദ്ധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: സ്ഥാനമാറ്റത്തെക്കുറിച്ചുള്ള വചനത്തിന്റെ വ്യാപ്തി
  choice: ജാതി, സാമൂഹിക പദവി, വിനയം, അല്ലെങ്കിൽ അന്തിമന്യായവിധിയിലെ സ്ഥാനം എന്നിവയിൽ ഏതെങ്കിലും ഒറ്റ വ്യാഖ്യാനമായി ചുരുക്കാതെ പൊതുവായ സ്ഥാനമാറ്റപ്രസ്താവനയായി വിവർത്തനം ചെയ്തു.
  alternative: ഇത് പ്രത്യേകമായി യഹൂദരെയും ജാതികളെയും, അല്ലെങ്കിൽ അഹങ്കാരികളെയും വിനീതരെയും, അല്ലെങ്കിൽ അന്തിമന്യായവിധിയിലെ ക്രമത്തെയും മാത്രം സൂചിപ്പിക്കുന്നു എന്ന് വാചകത്തിൽ വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം ദൈവരാജ്യത്തിലേക്കുള്ള പ്രവേശനവുമായി ബന്ധപ്പെട്ടിരുന്നാലും, ഗ്രീക്ക് വാക്യം ഉദ്ദേശപൂർവം സംക്ഷിപ്തവും വ്യാപകവുമാണ്; അതിനാൽ അതിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും, അതേസമയം ചൊല്ലിന്റെ ഗൗരവവും സമാന്തരഘടനയും നിലനിർത്തുന്നതുമായ ഭാഷയാണ് ഉപയോഗിച്ചത്. ‘അവസാനക്കാർ—ഒന്നാമർ’ എന്ന നേരിട്ടുള്ള വിപരീതം സംരക്ഷിച്ചു.
