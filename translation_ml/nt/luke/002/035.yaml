review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the direct address, the emphatic ‘your own,’ the sword image, and the disclosure of thoughts from many hearts. However, ‘പ്രാണനിലൂടെയും’ is not the most natural Malayalam expression for ψυχή in this metaphor and can suggest physical life or breath rather than the inner person experiencing anguish.
  naturalness: ‘നിന്റെ സ്വന്തം ആത്മാവിലൂടെയും ഒരു വാൾ കടന്നുപോകും’ is more idiomatic and solemn in modern standard Malayalam. The sentence retains the Greek image without turning the main text into the more interpretive ‘pierce.’
  terminology: Use ‘ആത്മാവ്’ here in its ordinary Malayalam sense of the inner self/soul, not as a doctrinally defined term. ‘വെളിപ്പെടും’ appropriately retains the passive sense. The footnotes are sound after adapting the ψυχή wording.
  issues:
  - severity: medium
    issue: ‘പ്രാണനിലൂടെയും’ is semantically and idiomatically weak for ψυχή in this context.
    rationale: In modern Malayalam, പ്രാണൻ often denotes life, vital breath, or a person, and the locative expression ‘പ്രാണനിലൂടെ ഒരു വാൾ കടന്നുപോകും’ is less natural. ആത്മാവ് better communicates the inner self/soul denoted by ψυχή while preserving the metaphor’s force.
