  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ σοῦ ⸀δὲ αὐτῆς τὴν ψυχὴν διελεύσεται ῥομφαία, ὅπως ἂν ἀποκαλυφθῶσιν ἐκ πολλῶν καρδιῶν διαλογισμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: ml
  text: നിന്റെ സ്വന്തം ആത്മാവിലൂടെയും ഒരു വാൾ കടന്നുപോകും[a][b]—അങ്ങനെ അനേകം ഹൃദയങ്ങളിലെ ചിന്തകൾ വെളിപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തുളച്ചുകയറും’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥം ‘കടന്നുപോകും’ എന്നാണ്; എന്നാൽ വാളിന്റെ ദൃശ്യം സ്വാഭാവികമായി തുളച്ചുകയറുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘വാൾ’ മറിയം അനുഭവിക്കാനിരുന്ന ആഴമായ വേദനയുടെ രൂപകമായി സാധാരണയായി മനസ്സിലാക്കപ്പെടുന്നു; ആ വേദനയുടെ കൃത്യമായ സാഹചര്യം ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: നിന്റെ സ്വന്തം
  rationale: σοῦ എന്ന സർവനാമത്തെ αὐτῆς ഊന്നിപ്പറയുന്നതിനാൽ മറിയത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന വ്യക്തിപരമായ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ψυχή
  choice: പ്രാണൻ
  rationale: ഇവിടെ ψυχή വെറും ശാരീരികജീവനെയല്ല, ആഴമായ വേദന അനുഭവിക്കുന്ന അന്തരംഗ വ്യക്തിത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഗൗരവവും രൂപകത്തിന്റെ ശക്തിയും നിലനിർത്താൻ ‘പ്രാണൻ’ ഉപയോഗിച്ചു.
- source_word: διελεύσεται
  choice: കടന്നുപോകും
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കടന്നുപോകുക’ നേരിട്ട് നിലനിർത്തുന്നു; ‘തുളച്ചുകയറും’ എന്നത് വാളിന്റെ ദൃശ്യത്തിൽനിന്നുള്ള സ്വാഭാവിക വ്യാഖ്യാനമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ῥομφαία
  choice: വാൾ
  rationale: വലിയതും ഭയങ്കരവുമായ വാളിനെ സൂചിപ്പിക്കാമെങ്കിലും മുഖ്യവാചകത്തിൽ ‘വാൾ’ സ്വാഭാവികവും മതിയായതുമാണ്.
- source_word: ὅπως ἂν
  choice: അങ്ങനെ
  rationale: മുൻവാക്യവുമായി വെളിപ്പെടുത്തലിനെ ഉദ്ദേശ്യമോ ഫലമോ ആയി ബന്ധിപ്പിക്കുമ്പോൾ, ഗ്രീക്കിലുള്ള ഇരുവിധ സാധ്യതയും അനാവശ്യമായി തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ἀποκαλυφθῶσιν
  choice: വെളിപ്പെടും
  rationale: മറഞ്ഞിരുന്ന ചിന്തകൾ വെളിച്ചത്താകുന്നതെന്ന നിഷ്ക്രിയ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκ πολλῶν καρδιῶν διαλογισμοί
  choice: അനേകം ഹൃദയങ്ങളിലെ ചിന്തകൾ
  rationale: ἐκ അന്തരംഗത്തിൽനിന്നുള്ള ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഹൃദയങ്ങളിലെ ചിന്തകൾ’ സ്വാഭാവികമായി ആന്തരിക ചിന്തകളെയും അവയുടെ വെളിപ്പെടലിനെയും അറിയിക്കുന്നു.
theological_decisions:
- issue: മറിയത്തോടുള്ള നേരിട്ടുള്ള പ്രവചനവും ‘വാൾ’ എന്ന രൂപകത്തിന്റെ കൃത്യമായ നിറവേറലും
  choice: മറിയത്തിന്റെ സ്വന്തം അന്തരംഗത്തിലൂടെ ഒരു വാൾ കടന്നുപോകുമെന്ന ശക്തമായ രൂപകം നിലനിർത്തി; ആ വേദന എങ്ങനെ ചരിത്രത്തിൽ നിറവേറും എന്ന് മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കിയില്ല.
  alternative: ഇത് യേശുവിന്റെ ക്രൂശീകരണസമയത്ത് മറിയം അനുഭവിച്ച ദുഃഖമാണെന്ന് നേരിട്ട് വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ യേശുവിന്റെ ദൗത്യം സൃഷ്ടിക്കുന്ന ഭിന്നതയുടെ വേദനയായി നിർവചിക്കുക.
  rationale: ഗ്രീക്ക് മറിയത്തെ വ്യക്തമായി അഭിസംബോധന ചെയ്യുകയും ആഴമായ വ്യക്തിപരമായ വേദന സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; എന്നാൽ അതിന്റെ കൃത്യമായ ചരിത്രകാരണം വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനസാധ്യത തുറന്നുവെച്ചു.
- issue: ὅπως ἂν സൂചിപ്പിക്കുന്ന ബന്ധം
  choice: ‘അങ്ങനെ’ എന്ന പ്രയോഗത്തിലൂടെ ഉദ്ദേശ്യത്തിന്റെയും ഫലത്തിന്റെയും നിഴലുകൾ നിലനിർത്തി.
  alternative: ‘അതിന്റെ ഫലമായി’ എന്നു മാത്രം പറയുക, അല്ലെങ്കിൽ ‘വേണ്ടി’ എന്നു മാത്രം പറയുക.
  rationale: സന്ധിപ്രയോഗം ഉദ്ദേശ്യമോ ലക്ഷ്യമിട്ട ഫലമോ സൂചിപ്പിക്കാം; ഒരു സാധ്യത മാത്രം നിർബന്ധിച്ച് theological causality തീർപ്പാക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പ്രവചനത്തിന്റെ കാവ്യാത്മക ശക്തി നിലനിർത്താൻ ‘പ്രാണൻ’, ‘വാൾ’, ‘കടന്നുപോകും’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. മുഖ്യവാചകം വ്യാഖ്യാനപരമായി അതിരുകടക്കാതെ, ആവശ്യമായ പദാർഥ-രൂപക വിശദീകരണം അടിക്കുറിപ്പുകളിലാക്കി.
