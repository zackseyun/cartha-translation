id: LUK.2.39
reference: Luke 2:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: ml
  text: കർത്താവിന്റെ ന്യായപ്രമാണപ്രകാരമുള്ളതെല്ലാം അവർ പൂർത്തിയാക്കിയപ്പോൾ[a], ഗലീലയിലുള്ള തങ്ങളുടെ സ്വന്തം പട്ടണമായ[b] നസറെത്തിലേക്കു മടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കർത്താവിന്റെ ന്യായപ്രമാണം ആവശ്യപ്പെട്ടതെല്ലാം അവർ ചെയ്തുതീർത്തപ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘നഗരം’; നസറെത്ത് ഒരു ചെറിയ ജനവാസകേന്ദ്രമായിരുന്നതിനാൽ ഇവിടെ ‘പട്ടണം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: അപ്പോൾ
  rationale: അയോറിസ്റ്റ് ക്രിയയോടൊപ്പമുള്ള ഈ പ്രയോഗം പ്രധാന പ്രവർത്തനം നടന്ന സമയം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘...പൂർത്തിയാക്കിയപ്പോൾ’ എന്ന ഘടന സ്വാഭാവികമായി ക്രമം നിലനിർത്തുന്നു, ഉടനടിത്തം അമിതമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: ἐτέλεσαν
  choice: പൂർത്തിയാക്കി
  rationale: നിർദേശിക്കപ്പെട്ട കാര്യങ്ങളെ അവസാനിപ്പിച്ചു എന്ന അർഥമാണ് ഇവിടെ; ‘നിവർത്തിച്ചു’ എന്നത് പ്രവചനനിവൃത്തിയുടെ ധ്വനി അനാവശ്യമായി വരുത്താം.
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: കർത്താവിന്റെ ന്യായപ്രമാണപ്രകാരമുള്ളതെല്ലാം
  rationale: കർത്താവിന്റെ നിയമത്തോടനുസരിച്ചുള്ള കാര്യങ്ങളുടെ സമഗ്രത ഗ്രീക്കിനോട് അടുത്തും മലയാളത്തിൽ വ്യക്തമായും നിലനിർത്തുന്നു; ‘ആവശ്യപ്പെട്ടതെല്ലാം’ എന്ന വ്യാഖ്യാനവിപുലീകരണം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: νόμον κυρίου
  choice: കർത്താവിന്റെ ന്യായപ്രമാണം
  rationale: യഹൂദ തിരുവെഴുത്തുപശ്ചാത്തലമുള്ള ഈ ദൈവിക നിയമസൂചനയ്ക്ക് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ രൂപം.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: ഇവിടെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ κύριος എന്ന പദത്തിന്റെ നേരായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐπέστρεψαν
  choice: മടങ്ങി
  rationale: യാത്രാസന്ദർഭത്തിൽ തിരികെ പോകുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ഗലീലയിലേക്ക്
  rationale: ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം; അന്തിമവാക്യത്തിൽ നസറെത്തിന്റെ പ്രദേശബന്ധം വ്യക്തമാക്കാൻ ‘ഗലീലയിലുള്ള’ എന്നു ഘടിപ്പിച്ചു.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: തങ്ങളുടെ സ്വന്തം പട്ടണത്തിലേക്ക്
  rationale: ἑαυτῶν എന്ന ഊന്നലുള്ള ഉടമസ്ഥത ‘തങ്ങളുടെ സ്വന്തം’ എന്നു നിലനിർത്തുന്നു; നസറെത്ത് ചെറിയ ജനവാസകേന്ദ്രമായതിനാൽ πόλις എന്നതിന് ‘പട്ടണം’ യോജിക്കുന്നു.
- source_word: Ναζαρέθ
  choice: നസറെത്ത്
  rationale: ആധുനിക സാധാരണ മലയാളത്തിൽ പ്രചാരമുള്ള സ്ഥലനാമരൂപം.
theological_decisions:
- issue: ‘കർത്താവിന്റെ ന്യായപ്രമാണം’ എന്നതിലെ ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: തിരുവെഴുത്തിൽ നൽകിയ ദൈവിക ന്യായപ്രമാണത്തിന്റെ ഉടമയായ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി നേരായി വിവർത്തനം ചെയ്തു.
  alternative: പ്രധാനമായ ദൈവശാസ്ത്രപരമായ മറ്റൊരു വായന ഈ സന്ദർഭത്തിൽ ഇല്ല.
  rationale: ഇത് യഹൂദ-തിരുവെഴുത്തുപാരമ്പര്യത്തിലെ സാധാരണ പ്രയോഗമാണ്; കുടുംബത്തിന്റെ അനുസരണം വ്യക്തമാക്കിക്കൊണ്ട് അധിക സിദ്ധാന്തവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ തിരുവെഴുത്തുപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്കു വ്യക്തമായി ക്രമപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
