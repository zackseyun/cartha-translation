id: LUK.2.18
reference: Luke 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἀκούσαντες ἐθαύμασαν περὶ τῶν λαληθέντων ὑπὸ τῶν ποιμένων πρὸς αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: ml
  text: കേട്ടവരെല്ലാം ഇടയന്മാർ അവരോടു പറഞ്ഞ കാര്യങ്ങളെക്കുറിച്ച് ആശ്ചര്യപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിസ്മയിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: ഗ്രീക്കിൽ ഇത് മുൻവാക്യത്തോടുള്ള ലളിതമായ ആഖ്യാനബന്ധമാണ്. ഒറ്റവാക്യമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുമ്പോൾ പ്രത്യേക സംയോജകം ചേർക്കാതിരിക്കുന്നതാണ് കൂടുതൽ സുതാര്യം.
- source_word: πάντες οἱ ἀκούσαντες
  choice: കേട്ടവരെല്ലാം
  rationale: നാമാർഥത്തിൽ പ്രവർത്തിക്കുന്ന articular aorist participle-ന്റെ ‘കേട്ട എല്ലാവരും’ എന്ന അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കർമം ചേർക്കുന്നില്ല.
- source_word: ἐθαύμασαν
  choice: ആശ്ചര്യപ്പെട്ടു
  rationale: കേട്ട കാര്യത്തോടുള്ള വിസ്മയമോ അത്ഭുതമോ സൂചിപ്പിക്കുന്നു; വിശ്വാസമോ അവിശ്വാസമോ എന്ന് നിർണയിക്കാത്ത സാധാരണ ആധുനിക പ്രയോഗമാണിത്.
- source_word: περὶ τῶν λαληθέντων
  choice: പറഞ്ഞ കാര്യങ്ങളെക്കുറിച്ച്
  rationale: περί + genitive-ന്റെ ‘സംബന്ധിച്ച്/കുറിച്ച്’ എന്ന ആശയവും passive participle സൂചിപ്പിക്കുന്ന സംസാരിക്കപ്പെട്ട ഉള്ളടക്കവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὑπὸ τῶν ποιμένων
  choice: ഇടയന്മാർ
  rationale: Passive agency മലയാളത്തിൽ സ്വാഭാവികമായ സജീവവാക്യഘടനയിലേക്ക് മാറ്റിയെങ്കിലും ഇടയന്മാരാണ് പറഞ്ഞവർ എന്ന ബന്ധം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: πρὸς αὐτούς
  choice: തങ്ങളോടു
  rationale: കേട്ടവരിലേക്കുള്ള സംസാരത്തിന്റെ ദിശ സൂക്ഷിക്കുകയും മലയാളത്തിൽ subject-reference വ്യക്തമാക്കുകയും ചെയ്യുന്നു; കേൾവിക്കാർ ആരെന്നത് അതിലുപരി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ἐθαύμασαν വിവരിക്കുന്ന പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ആശ്ചര്യത്തിന്റെ പ്രതികരണം മാത്രം പ്രസ്താവിക്കുന്നു; രക്ഷാകരമായ വിശ്വാസമോ അവിശ്വാസമോ സൂചിപ്പിക്കുന്നില്ല.
  alternative: കേട്ടവർ വിശ്വാസത്തോടെ പ്രതികരിച്ചു; അല്ലെങ്കിൽ വെറും കൗതുകം മാത്രമാണ് പ്രകടിപ്പിച്ചത്.
  rationale: θαυμάζω വിസ്മയപ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു. അത് വിശ്വാസമായി വളർന്നോ ഇല്ലയോ എന്ന് വാക്യം പറയാത്തതിനാൽ ആ തുറന്ന നില പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘തങ്ങളോടു’ എന്ന പ്രതിഫലന സർവനാമം πρὸς αὐτούς എന്നതിന്റെ സാധ്യതയുള്ള antecedent ആയ കേട്ടവരിലേക്കുള്ള സൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
