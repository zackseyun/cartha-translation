id: LUK.2.10
reference: Luke 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: ml
  text: 'അപ്പോൾ ദൂതൻ അവരോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ; കാരണം, ഇതാ, സകല ജനത്തിനും[a] ഉണ്ടാകാനിരിക്കുന്ന മഹാസന്തോഷത്തിന്റെ സുവാർത്ത ഞാൻ നിങ്ങളോടു അറിയിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സകല മനുഷ്യർക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി “സകല ജനത്തിനും” എന്നാണ്; ലൂക്കോസിൽ സന്ദർഭാനുസരണം ഇത് പലപ്പോഴും ഒരു നിർദിഷ്ട ജനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: ദൂതൻ
  rationale: ഗ്രീക്ക് നിർദേശകപദം മുമ്പ് പരിചയപ്പെടുത്തിയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭം ആ നിർദിഷ്ടത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Μὴ φοβεῖσθε
  choice: ഭയപ്പെടേണ്ടാ
  rationale: ബഹുവചനത്തിലുള്ള നിരോധനത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἰδοὺ γὰρ
  choice: ഇതാ
  rationale: ἰδούവിന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഊന്നൽ നിലനിർത്തുന്നു; പിന്നാലെയുള്ള പ്രഖ്യാപനം തന്നെ ഭയപ്പെടേണ്ടതില്ലെന്ന കാരണമായി പ്രവർത്തിക്കുന്നതിനാൽ γάρ മലയാളവാക്യഘടനയിൽ പരോക്ഷമായി പ്രകടമാകുന്നു.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: സുവാർത്ത ഞാൻ നിങ്ങളെ അറിയിക്കുന്നു
  rationale: നിങ്ങളോടു നല്ല വാർത്ത അറിയിക്കുന്നു എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥവും ὑμῖν എന്ന ദത്തിവിഭക്തിയും നിലനിർത്തുന്നു; ‘സുവാർത്ത’ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും ഇവിടെ സ്വാഭാവികവുമാണ്.
- source_word: χαρὰν μεγάλην
  choice: മഹാസന്തോഷം
  rationale: ‘വലിയ സന്തോഷം’ എന്ന അർഥം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: ἥτις ἔσται
  choice: ഉണ്ടാകാനിരിക്കുന്ന
  rationale: സന്തോഷത്തെ വിശേഷിപ്പിക്കുന്ന ഭാവികാല ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയായി നൽകുന്നു.
- source_word: παντὶ τῷ λαῷ
  choice: സകല ജനത്തിനും
  rationale: λαός എന്ന ഏകവചനവും നിർദിഷ്ടതയും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു; ‘എല്ലാ ജനങ്ങൾക്കും’ എന്നു പറഞ്ഞ് ജനതകളിലേക്കോ സകല മനുഷ്യരിലേക്കോ അർഥം മുൻകൂട്ടി വികസിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: παντὶ τῷ λαῷ എന്നതിന്റെ വ്യാപ്തി
  choice: സകല ജനത്തിനും
  alternative: സകല മനുഷ്യർക്കും / എല്ലാ ജനങ്ങൾക്കും
  rationale: τῷ λαῷ എന്ന ഏകവചന നിർദിഷ്ട പ്രയോഗം ഉടൻസന്ദർഭത്തിൽ ഒരു നിർദിഷ്ട ജനത്തെ—സാധ്യതയോടെ ഇസ്രായേലിനെ—സൂചിപ്പിക്കാം. അതേസമയം മലയാളത്തിലെ ‘സകല ജനത്തിനും’ എന്ന പ്രയോഗം വാക്യത്തിന്റെ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് വിശാലമായ വായനയുടെ സാധ്യത പൂർണമായി അടച്ചുകളയുന്നില്ല; പാദക്കുറിപ്പ് യഥാർഥമായ അർഥവൈകല്യം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ദൂതപ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘ഇതാ’, ‘സുവാർത്ത’, ‘മഹാസന്തോഷം’ എന്നീ പദങ്ങൾ ഉന്നതഭാവം നൽകുന്നുവെങ്കിലും അതിപുരാതനമല്ല. പ്രധാനവാക്യത്തിലെ [a] അടയാളം പാദക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
