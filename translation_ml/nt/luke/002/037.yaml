id: LUK.2.37
reference: Luke 2:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: ml
  text: അവൾ എൺപത്തിനാലു വയസ്സുവരെ വിധവയായിരുന്നു[a]. അവൾ ദൈവാലയം[b] വിട്ടുപോകാതെ, ഉപവാസങ്ങളോടും പ്രാർഥനകളോടും[c]കൂടെ രാവും പകലും ആരാധനാസേവനം ചെയ്തുപോന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾ എൺപത്തിനാലു വർഷം വിധവയായിരുന്നു.” ഗ്രീക്ക് പ്രയോഗം അന്നയുടെ പ്രായത്തെയോ അവൾ വിധവയായി കഴിഞ്ഞ കാലദൈർഘ്യത്തെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഇവിടത്തെ ഗ്രീക്ക് പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ദൈവാലയസമുച്ചയത്തെയും അതിന്റെ പ്രാകാരങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: “അപേക്ഷകളോടും” അല്ലെങ്കിൽ “യാചനകളോടും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: വിധവ
  rationale: ഭർത്താവ് മരിച്ച സ്ത്രീ എന്ന സാധാരണ അർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു; സന്ദർഭത്തിൽ അന്നയുടെ വൈവാഹികാവസ്ഥയെ തുടർന്നും വിവരിക്കുന്നു.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: എൺപത്തിനാലു വയസ്സുവരെ
  rationale: പ്രധാനവായനയായി അന്നയുടെ പ്രായത്തെ സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു. ഗ്രീക്ക് പ്രയോഗം ചുരുക്കമുള്ളതിനാൽ വിധവയായിരുന്ന കാലദൈർഘ്യം എന്നും മനസ്സിലാക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: ദൈവാലയം വിട്ടുപോകാതെ
  rationale: അപൂർണഭൂതകാല ക്രിയ സൂചിപ്പിക്കുന്ന പതിവായും തുടർച്ചയായും നടന്ന പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἱεροῦ
  choice: ദൈവാലയം
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, വിശാലമായ ദൈവാലയസമുച്ചയത്തെയും പ്രാകാരങ്ങളെയും സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ പദം ഉപയോഗിച്ച് കൃത്യമായ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: νηστείαις
  choice: ഉപവാസങ്ങളോടും
  rationale: ബഹുവചനം അന്ന ആവർത്തിച്ച് അനുഷ്ഠിച്ച ഉപവാസങ്ങളെ സൂചിപ്പിക്കുന്നു; ദത്തിവ് ആരാധനയുടെ രീതിയോ അനുബന്ധമോ വ്യക്തമാക്കുന്നു.
- source_word: δεήσεσιν
  choice: പ്രാർഥനകളോടും
  rationale: സന്ദർഭത്തിൽ സ്വാഭാവികവും പൊതുവായി മനസ്സിലാകുന്നതുമായ പരിഭാഷ. അപേക്ഷയോ യാചനയോ ഊന്നിപ്പറയുന്ന കൂടുതൽ പ്രത്യേക അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: λατρεύουσα
  choice: ആരാധിച്ചുപോന്നു
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ആരാധനാസേവനം വ്യക്തമാക്കുന്നു; തുടർച്ചയായ ജീവിതചര്യയെന്ന ഭാവവും നൽകുന്നു.
- source_word: νύκτα καὶ ἡμέραν
  choice: രാവും പകലും
  rationale: ഗ്രീക്കിലെ ക്രമവും നിരന്തരമായ ഭക്തിയുടെ ആശയവും മലയാളത്തിലെ സ്വാഭാവിക ശൈലിയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്നയുടെ പ്രായമോ വിധവാജീവിതത്തിന്റെ ദൈർഘ്യമോ
  choice: മുഖ്യപാഠം അന്നയ്ക്ക് എൺപത്തിനാലു വയസ്സായിരുന്നുവെന്ന് വായിക്കുന്നു.
  alternative: അവൾ എൺപത്തിനാലു വർഷം വിധവയായി കഴിഞ്ഞുവെന്നും ഈ പ്രയോഗം അർഥമാക്കാം.
  rationale: ഗ്രീക്ക് വാക്യഘടന രണ്ടുവായനകൾക്കും ഇടനൽകുന്നു. മുഖ്യപാഠത്തിന്റെ വ്യക്തതയ്ക്കായി പ്രായവായന സ്വീകരിച്ചെങ്കിലും യഥാർഥമായ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘ആരാധിച്ചുപോന്നു’ എന്ന പ്രയോഗം തുടർച്ചയായ ഭക്തിജീവിതത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളുടെ പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
