  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: ml
  text: യോസേഫും ഗലീലയിൽനിന്ന്, നസറെത്ത് പട്ടണത്തിൽനിന്ന്, യെഹൂദ്യയിലേക്ക്, ദാവീദിന്റെ നഗരം എന്നു വിളിക്കപ്പെടുന്ന ബെത്‌ലഹേമിലേക്ക് കയറിപ്പോയി. കാരണം, അവൻ ദാവീദിന്റെ ഭവനത്തിലും വംശത്തിലും പെട്ടവനായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ഭവനം’, ‘വംശം’ എന്നിങ്ങനെ പൂർവികബന്ധം സൂചിപ്പിക്കുന്ന രണ്ടു ബന്ധപ്പെട്ട പദങ്ങളുണ്ട്; അവ യോസേഫിന്റെ ദാവീദിക വംശബന്ധത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέβη
  choice: കയറിപ്പോയി
  rationale: യെഹൂദ്യയിലേക്കുള്ള യാത്രയെക്കുറിച്ചുള്ള ഗ്രീക്ക് ഉയർച്ചാസൂചന നിലനിർത്തുന്നു; അതേസമയം മലയാളത്തിൽ സ്വാഭാവികമായ യാത്രാപ്രയോഗവുമാണ്.
- source_word: δὲ καὶ Ἰωσήφ
  choice: യോസേഫും
  rationale: δὲ എന്ന ലഘു ആഖ്യാനബന്ധവും καὶ എന്ന ‘കൂടി’ എന്ന ആശയവും മലയാളത്തിലെ ‘-ഉം’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρέθ
  choice: ഗലീലയിൽനിന്ന്, നസറെത്ത് പട്ടണത്തിൽനിന്ന്
  rationale: പ്രദേശവും അതിനുള്ളിലെ പ്രത്യേക പട്ടണവും എന്ന ഗ്രീക്ക് ഘടനയും ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: യെഹൂദ്യയിലേക്ക്
  rationale: റോമൻകാലത്തെ ഭൂമിശാസ്ത്രപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പതിവ് മലയാള രൂപം.
- source_word: εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: ദാവീദിന്റെ നഗരം എന്നു വിളിക്കപ്പെടുന്ന ബെത്‌ലഹേമിലേക്ക്
  rationale: ബെത്‌ലഹേമിനെ വിശദീകരിക്കുന്ന ബന്ധവാക്യവും ദാവീദുമായുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: കാരണം, അവൻ ... പെട്ടവനായിരുന്നു
  rationale: διά സഹിതമുള്ള articular infinitive പ്രകടിപ്പിക്കുന്ന കാരണബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: ദാവീദിന്റെ ഭവനത്തിലും വംശത്തിലും പെട്ടവൻ
  rationale: οἶκος, πατριά എന്നീ രണ്ടു പൂർവികബന്ധപദങ്ങളെയും ഒന്നാക്കി ചുരുക്കാതെ, രാജവംശപരമായ ‘ഭവനം’ എന്നും കുടുംബവംശപരമായ ‘വംശം’ എന്നും വേർതിരിച്ചു നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദാവീദിക വംശബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഇരട്ട പദപ്രയോഗം
  choice: ദാവീദിന്റെ ഭവനത്തിലും വംശത്തിലും പെട്ടവൻ
  alternative: ദാവീദിന്റെ ഭവനത്തിലും കുടുംബപരമ്പരയിലും പെട്ടവൻ
  rationale: οἶκος, πατριά എന്നീ രണ്ടു പദങ്ങളും നിലനിർത്തി യോസേഫിന്റെ ദാവീദിക പൂർവികബന്ധത്തിന് ലൂക്കോസ് നൽകുന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു; പാഠത്തിന് അതീതമായ സിദ്ധാന്തനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലപ്പേരുകൾ പ്രചാരത്തിലുള്ള ബൈബിൾ-മലയാള രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു. ഗ്രീക്കിലെ യാത്രാദിശയും ദാവീദിക വംശബന്ധത്തിന്റെ ഇരട്ട പദപ്രയോഗവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
