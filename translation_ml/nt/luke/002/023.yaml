source:
  edition: SBLGNT
  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: ml
  text: 'കർത്താവിന്റെ ന്യായപ്രമാണത്തിൽ എഴുതിയിരിക്കുന്നതുപോലെ: “ഗർഭപാത്രം തുറക്കുന്ന എല്ലാ ആൺസന്തതിയും[a] കർത്താവിന് വിശുദ്ധനെന്നു വിളിക്കപ്പെടും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഗർഭപാത്രം തുറക്കുന്ന ഓരോ ആൺകുഞ്ഞും.” ഈ പ്രയോഗം ആദ്യജാതനായ ആൺകുഞ്ഞിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ആദ്യജാതനായ ആൺസന്തതി കർത്താവിന് വിശുദ്ധനായി, അഥവാ അവിടത്തേക്കായി വേർതിരിക്കപ്പെട്ടവനായി, കണക്കാക്കപ്പെടുന്നു; പുറപ്പാട് 13:2, 12 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്നതിനുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ താരതമ്യശക്തിയും എഴുതപ്പെട്ട വചനത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν νόμῳ κυρίου
  choice: കർത്താവിന്റെ ന്യായപ്രമാണത്തിൽ
  rationale: ഇവിടെ νόμος മോശെയുടെ ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്നു; κύριος എന്ന ഗ്രീക്ക് പദം ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Πᾶν ἄρσεν
  choice: ഓരോ ആൺസന്തതിയും
  rationale: പദത്തിന്റെ പുരുഷലിംഗസൂചന നിലനിർത്തുന്നു; നവജാതശിശുവിനെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ‘ആൺസന്തതി’ എന്നത് കൃത്യവും മാന്യവുമായ മലയാളമാണ്.
- source_word: διανοῖγον μήτραν
  choice: ഗർഭം തുറക്കുന്ന
  rationale: ആദ്യജാതനായ ആൺസന്തതിയെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ദൃശ്യാത്മകമായ സെമിറ്റിക് പ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἅγιον τῷ κυρίῳ
  choice: കർത്താവിനു വിശുദ്ധൻ
  rationale: ἅγιον എന്നതിലെ വിശുദ്ധതാഭാഷ നേരിട്ട് സൂക്ഷിക്കുന്നു; ‘സമർപ്പിക്കപ്പെട്ടവൻ’ എന്ന വ്യാഖ്യാനപരമായ പകരം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: κληθήσεται
  choice: എന്നു വിളിക്കപ്പെടും
  rationale: ഭാവികാല കർമണി രൂപം നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും നിയമോദ്ധരണിയുടെ ഔപചാരിക സ്വരം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ ന്യായപ്രമാണത്തിൽനിന്നുള്ള ഉദ്ധരണിയിലെ κύριος
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: പരിഭാഷയുടെ നേരിട്ടുള്ള സ്രോതസ്സായ ഗ്രീക്ക് പാഠത്തിൽ κύριος ആണുള്ളത്; അതിനാൽ ദൈവനാമം പിന്നിൽ ഉണ്ടായിരിക്കാമെന്ന കാരണത്താൽ പ്രധാനപാഠത്തിൽ അത് പുനഃസ്ഥാപിച്ചിട്ടില്ല.
- issue: ἅγιον എന്ന വിശുദ്ധതാഭാഷയോ സമർപ്പണത്തെ വ്യക്തമാക്കുന്ന വ്യാഖ്യാനമോ
  choice: കർത്താവിനു വിശുദ്ധൻ
  alternative: കർത്താവിനായി വേർതിരിക്കപ്പെട്ടവൻ / കർത്താവിനു സമർപ്പിക്കപ്പെട്ടവൻ
  rationale: മൂലപാഠം നേരിട്ട് ‘വിശുദ്ധൻ’ എന്നു പറയുന്നു. ആദ്യജാതൻ കർത്താവിനായി വേർതിരിക്കപ്പെട്ടവനാണെന്ന ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; പ്രധാനപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പദബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമോദ്ധരണിയുടെ ഗൗരവം നിലനിർത്താൻ ‘ന്യായപ്രമാണം’, ‘വിശുദ്ധൻ’, ‘വിളിക്കപ്പെടും’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; അതേസമയം അതിപുരാതനമായ വാക്യഘടന ഒഴിവാക്കി. ഉദ്ധരണിയുടെ ഉള്ളടക്കം വ്യക്തമായി വേർതിരിക്കാൻ ദ്വിബിന്ദുവും ഉദ്ധരണിച്ചിഹ്നങ്ങളും ഉപയോഗിച്ചു.
