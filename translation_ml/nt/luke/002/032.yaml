id: LUK.2.32
reference: Luke 2:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: φῶς εἰς ἀποκάλυψιν ἐθνῶν καὶ δόξαν λαοῦ σου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/032.yaml
  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: ml
  text: ജനതകൾക്കു വെളിപ്പാടു നൽകുന്ന വെളിച്ചവും[a] അങ്ങയുടെ ജനമായ ഇസ്രായേലിനു മഹത്ത്വവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിജാതീയർക്കു വെളിപ്പാടു നൽകുന്ന വെളിച്ചം.” ഗ്രീക്കുപദത്തിന് പൊതുവായി “ജനതകൾ” എന്നർഥമുണ്ടെങ്കിലും, ഇവിടെ ഇസ്രായേലിനോടുള്ള വ്യത്യാസത്തിൽ ഇസ്രായേലല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: വെളിച്ചം
  rationale: ശിശുവിനെക്കുറിച്ചുള്ള ശിമെയോന്റെ കാവ്യാത്മക വിവരണത്തിൽ സ്വാഭാവികവും ഗ്രീക്കിന്റെ രൂപകഭാവം നിലനിർത്തുന്നതുമായ പദം.
- source_word: εἰς ἀποκάλυψιν
  choice: വെളിപ്പാടാകുന്ന
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യ/ഫലബന്ധവും ἀποκάλυψις എന്നതിലെ മറനീക്കി അറിയിക്കൽ എന്ന ആശയവും മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐθνῶν
  choice: ജനതകൾക്ക്
  rationale: അടിസ്ഥാന അർഥമായ ‘ജനതകൾ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേലല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നുവെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: δόξαν
  choice: മഹത്ത്വം
  rationale: ബഹുമാനം, തേജസ്സ്, മഹിമ എന്നീ അർഥവലയങ്ങൾ ഉൾക്കൊള്ളുന്ന ഗൗരവമുള്ള ആധുനിക മലയാളപ്രയോഗം.
- source_word: λαοῦ σου Ἰσραήλ
  choice: അങ്ങയുടെ ജനമായ ഇസ്രായേൽ
  rationale: ഇസ്രായേലിനെ ദൈവത്തിന്റെ ജനമായി തിരിച്ചറിയിക്കുന്ന സമാനാധികരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: -വും … -വും
  rationale: രണ്ട് സമാന്തര ഘടകങ്ങളെ മലയാളത്തിലെ സ്വാഭാവിക സഹയോജകഘടനയിൽ ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐθνῶν എന്ന പദവും ഇസ്രായേലുമായുള്ള ബന്ധവും
  choice: ജനതകൾ
  alternative: വിജാതീയർ
  rationale: ഗ്രീക്കുപദത്തിന്റെ പൊതുവായ ‘ജനതകൾ’ എന്ന അർഥം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു. ഇസ്രായേലിനോടുള്ള സമാന്തരവ്യത്യാസം കാരണം ഇവിടെ ഇസ്രായേലല്ലാത്ത ജനങ്ങൾ ഉദ്ദേശിക്കപ്പെടാൻ സാധ്യതയുണ്ടെന്നത് അടിക്കുറിപ്പിൽ നൽകുന്നു; അങ്ങനെ യഥാർഥമായ അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ ആരാധനാസൗഹൃദ ഭാഷ. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. വാക്യത്തിന്റെ കാവ്യാത്മക സമാന്തരഘടന നിലനിർത്തി.
