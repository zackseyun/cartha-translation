  text: This registration took place first while Quirinius was governing Syria[a][b].
translation:
  language: ml
  text: ക്വിരീനിയോസ് സിറിയ ഭരിച്ചുകൊണ്ടിരുന്നപ്പോൾ ഈ രജിസ്ട്രേഷൻ ആദ്യം നടന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ക്വിരീനിയോസ് സിറിയ ഭരിക്കുന്നതിനുമുമ്പ് ഈ രജിസ്ട്രേഷൻ നടന്നു.” ഇവിടെ πρώτη എന്ന പദത്തിന് താരതമ്യകാല അർഥമുണ്ടെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: “രജിസ്ട്രേഷൻ” എന്നതിനുപകരം “ജനസംഖ്യാ കണക്കെടുപ്പ്” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ഔദ്യോഗികമായി പേരുചേർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇത് പലപ്പോഴും നികുതിയുമായി ബന്ധപ്പെട്ടിരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: ഈ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ഔദ്യോഗിക രജിസ്ട്രേഷനെ ചൂണ്ടിക്കാണിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἀπογραφὴ
  choice: രജിസ്ട്രേഷൻ
  rationale: നികുതിയോ ജനസംഖ്യാ കണക്കെടുപ്പോ ഉൾപ്പെടാവുന്ന ഔദ്യോഗിക പേരുചേർക്കലിന്റെ ഭരണപരമായ അർഥം അതിരുകടന്ന് നിർവചിക്കാതെ നിലനിർത്തുന്നു.
- source_word: πρώτη
  choice: ആദ്യം
  rationale: പദത്തിന്റെ സാധാരണ ക്രമവാചക അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; താരതമ്യകാല അർഥമായ ‘മുമ്പ്’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐγένετο
  choice: നടന്നു
  rationale: ഒരു സംഭവം നടന്നുവെന്ന γίνομαι എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἡγεμονεύοντος
  choice: ഭരിച്ചുകൊണ്ടിരുന്നപ്പോൾ
  rationale: സമകാലിക സാഹചര്യം സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ കാലാർഥം നിലനിർത്തുകയും കൃത്യമായ ഔദ്യോഗിക പദവി അനാവശ്യമായി നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τῆς Συρίας
  choice: സിറിയ
  rationale: പ്രദേശനാമത്തിന്റെ നിലവാരമുള്ള മലയാളരൂപം.
- source_word: Κυρηνίου
  choice: ക്വിരീനിയോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമമായ Κυρήνιος എന്നതിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: ചരിത്രപരമായി വിവാദമുള്ള വാക്യഘടനയിൽ πρώτη എന്ന പദത്തിന്റെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ സാധാരണ ക്രമവാചക അർഥമായ ‘ആദ്യം’ ഉപയോഗിച്ചു.
  alternative: ‘ക്വിരീനിയോസ് സിറിയ ഭരിക്കുന്നതിനുമുമ്പ് ഈ രജിസ്ട്രേഷൻ നടന്നു.’
  rationale: ഗ്രീക്കിൽ πρώτη എന്നതിന്റെ ഏറ്റവും നേരിട്ടുള്ള അർഥം ‘ആദ്യം’ എന്നാണ്. എന്നാൽ താരതമ്യകാല അർഥം ചിലർ നിർദേശിക്കുന്നതിനാൽ വിവാദം തീർപ്പാക്കാതെ ആ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഭരണപരമായ ἀπογραφήയ്ക്ക് സാധാരണ വായനക്കാർക്ക് പരിചിതമായ ‘രജിസ്ട്രേഷൻ’ ഉപയോഗിച്ചു; ചരിത്ര-വാക്യഘടനാ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമായി നിലനിർത്തി.
