reference: Luke 2:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: ml
  text: അവൻ ആത്മാവിന്റെ പ്രേരണയാൽ ദൈവാലയത്തിലേക്കു വന്നു[a]. മാതാപിതാക്കൾ[b] ശിശുവായ യേശുവിനെ അകത്തേക്കു കൊണ്ടുവന്നപ്പോൾ, അവനെ സംബന്ധിച്ച് ന്യായപ്രമാണത്തിലെ പതിവനുസരിച്ച് ചെയ്യേണ്ടത് ചെയ്യാൻ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആത്മാവിൽ.’ ഗ്രീക്ക് പ്രയോഗം ‘ആത്മാവിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘ആത്മാവിൽ’ എന്നത് മൂലപദഘടനയോട് അടുത്തുനിൽക്കുന്നു; ഈ സന്ദർഭത്തിൽ ലൂക്കോസ് പരിശുദ്ധാത്മാവിനെ ഊന്നിപ്പറയുന്നതിനാലാണ് ഇവിടെ ‘ആത്മാവിന്റെ പ്രേരണയാൽ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘മാതാപിതാക്കൾ.’ യേശുവിനെ പരിപാലിച്ച മറിയയെയും യോസേഫിനെയും കുറിച്ച് ലൂക്കോസ് ഇവിടെ സാധാരണ കുടുംബഭാഷയാണ് ഉപയോഗിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: ആത്മാവിൽ
  rationale: സമീപസന്ദർഭത്തിലെ പരിശുദ്ധാത്മാവിനെക്കുറിച്ചുള്ള ആവർത്തിച്ചുള്ള പരാമർശങ്ങൾ ഈ അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. ഗ്രീക്കിലെ ἐν എന്ന പൂർവപ്രത്യയത്തിന്റെ രൂപവും സൂക്ഷിക്കുന്നു.
- source_word: ἱερόν
  choice: ദേവാലയം
  rationale: ഇത് അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം സൂചിപ്പിക്കുന്ന ναός അല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെ സൂചിപ്പിക്കുന്ന പദമാണ്. മലയാളത്തിൽ ‘ദേവാലയം’ സ്വാഭാവികമായ പൊതുപദമാണ്.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: അകത്തുകൊണ്ടുവന്നപ്പോൾ
  rationale: ἐν ചേർന്ന articular infinitive ഇവിടെ കാലസൂചന നൽകുന്നു; മലയാളത്തിലെ ‘-പ്പോൾ’ ഘടന അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γονεῖς
  choice: മാതാപിതാക്കൾ
  rationale: ഗ്രീക്കിലെ സാധാരണ കുടുംബപദം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; യോസേഫിന്റെയും മറിയയുടെയും സാമൂഹികവും പരിചരണപരവുമായ പങ്കിനെ വിവരിക്കുന്നതല്ലാതെ ജൈവപിതൃത്വത്തെക്കുറിച്ചുള്ള പ്രത്യേക അവകാശവാദമല്ല.
- source_word: παιδίον Ἰησοῦν
  choice: ശിശുവായ യേശു
  rationale: ഈ സന്ദർഭത്തിൽ παιδίον ശിശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ പേര് വിശേഷണഘടനയോടെ ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: τοῦ ποιῆσαι αὐτοὺς ... περὶ αὐτοῦ
  choice: അവനുവേണ്ടി ... ചെയ്യാൻ
  rationale: αὐτούς ക്രിയയുടെ കർത്താക്കളായ മാതാപിതാക്കളെ സൂചിപ്പിക്കുന്നു; περὶ αὐτοῦ ശിശുവിനെ സംബന്ധിച്ചുള്ള പ്രവൃത്തിയാണെന്ന് വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘അവനുവേണ്ടി ... ചെയ്യാൻ’ ഉദ്ദേശ്യവും ബന്ധവും വ്യക്തമായി നൽകുന്നു.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: ന്യായപ്രമാണത്തിലെ പതിവനുസരിച്ചുള്ളത്
  rationale: εἰθισμένον പതിവായതോ ആചാരമായി നിശ്ചയിക്കപ്പെട്ടതോ ആയ കാര്യത്തെ സൂചിപ്പിക്കുന്നു; ‘ന്യായപ്രമാണത്തിലെ പതിവ്’ നിയമവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ ആവശ്യകത സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: ശിമെയോന്റെ പ്രവർത്തനത്തിലെ ‘ആത്മാവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പരിശുദ്ധാത്മാവ്
  alternative: ശിമെയോന്റെ സ്വന്തം ആത്മാവ് അല്ലെങ്കിൽ ആന്തരിക പ്രേരണ
  rationale: ലൂക്കോസ് 2:25–27-ൽ പരിശുദ്ധാത്മാവിനെക്കുറിച്ചുള്ള തുടർച്ചയായ പരാമർശങ്ങൾ πνεῦμα ഇവിടെ പരിശുദ്ധാത്മാവാണെന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും ἐν എന്നതിലെ ‘ആത്മാവിൽ/ആത്മാവിനാൽ’ എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: മറിയയെയും യോസേഫിനെയും ‘മാതാപിതാക്കൾ’ എന്നു വിളിക്കൽ
  choice: γονεῖς എന്ന പദം നേരിട്ട് ‘മാതാപിതാക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു
  alternative: രക്ഷിതാക്കൾ; യോസേഫും മറിയയും
  rationale: ലൂക്കോസിന്റെ സാധാരണ കുടുംബഭാഷയെ ദൈവശാസ്ത്രപരമായ ആശങ്കകൊണ്ട് ദുർബലപ്പെടുത്തുകയോ ഗ്രീക്കിലില്ലാത്ത പേരുകൾ ചേർക്കുകയോ ചെയ്യുന്നില്ല. ഇത് കന്യകാഗർഭധാരണത്തെ നിഷേധിക്കുന്ന പ്രസ്താവനയല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ‘ന്യായപ്രമാണം’ പരമ്പരാഗതമായി പരിചിതമായിരുന്നാലും സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്ന പദമാണ്; ‘പതിവനുസരിച്ചുള്ളത് ചെയ്യാൻ’ മൂലത്തിലെ εἰθισμένον എന്ന നാമവൽക്കരിച്ച ആശയം അനാവശ്യമായി വിശദീകരിക്കാതെ സൂക്ഷിക്കുന്നു.
