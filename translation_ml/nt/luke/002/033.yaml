id: LUK.2.33
reference: Luke 2:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἦν ⸂ὁ πατὴρ αὐτοῦ⸃ καὶ ἡ ⸀μήτηρ θαυμάζοντες ἐπὶ τοῖς λαλουμένοις περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: ml
  text: അവന്റെ അപ്പനും അമ്മയും അവനെക്കുറിച്ചു പറയപ്പെട്ടുകൊണ്ടിരുന്ന കാര്യങ്ങളെക്കുറിച്ച് ആശ്ചര്യപ്പെട്ടുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക്: ‘അവന്റെ അപ്പൻ.’ കഥയിലെ സാധാരണ കുടുംബപരവും നിയമപരവുമായ അർഥത്തിൽ ഇത് യോസേഫിനെ സൂചിപ്പിക്കുന്നു. യേശുവിന്റെ കന്യകാഗർഭധാരണത്തെക്കുറിച്ചുള്ള ലൂക്കായുടെ മുൻവിവരണത്തിന്റെ വെളിച്ചത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ചില പരിഭാഷകൾ ‘യോസേഫും അവന്റെ അമ്മയും’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: അവന്റെ അപ്പൻ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ‘അവന്റെ പിതാവ്’ എന്ന നേരിട്ടുള്ള പ്രയോഗം യോസേഫ് എന്നു മാറ്റാതെ നിലനിർത്തുന്നു. സാധാരണ കുടുംബപരവും നിയമപരവുമായ അർഥത്തിൽ യോസേഫിനെയാണ് കഥ ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘അപ്പൻ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ബന്ധപദമാണ്.
- source_word: μήτηρ
  choice: അമ്മ
  rationale: μήτηρ എന്നതിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാള പരിഭാഷ; ‘അപ്പനും അമ്മയും’ എന്ന കൂട്ടുപ്രയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: θαυμάζοντες
  choice: ആശ്ചര്യപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: ἦν എന്ന ഭൂതകാല ക്രിയയോടു ചേർന്ന വർത്തമാന കൃദന്തം ഭൂതകാലത്തിൽ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ആശ്ചര്യപ്പെട്ടുകൊണ്ടിരുന്നു’ അതിന്റെ തുടർച്ചാഭാവവും വിസ്മയവും പ്രകടമാക്കുന്നു.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: പറയപ്പെട്ടുകൊണ്ടിരുന്ന കാര്യങ്ങളിൽ
  rationale: നപുംസക ബഹുവചന കൃദന്തത്തിന്റെ ‘പറയപ്പെട്ടുകൊണ്ടിരുന്ന കാര്യങ്ങൾ’ എന്ന അർഥവും നിഷ്ക്രിയതയും തുടർച്ചാഭാവവും സംരക്ഷിക്കുന്നു. ἐπί സൂചിപ്പിക്കുന്ന പ്രതികരണത്തിന്റെ അടിസ്ഥാനത്തെ മലയാളത്തിലെ ‘കാര്യങ്ങളിൽ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ചു
  rationale: περί + ഷഷ്ഠിയുടെ സന്ദർഭോചിതമായ നേരിട്ടുള്ള പരിഭാഷ; ഇവിടെ ‘അവൻ’ ശിശുവായ യേശുവിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: കന്യകാഗർഭധാരണത്തെ വിവരിച്ചിരിക്കുന്ന സന്ദർഭത്തിൽ യോസേഫിനെ ‘അവന്റെ അപ്പൻ’ എന്നു വിളിക്കുന്നത്
  choice: ഗ്രീക്ക് പാഠത്തിലുള്ളതുപോലെ ‘അവന്റെ അപ്പൻ’ എന്നു പരിഭാഷപ്പെടുത്തി, കുടുംബപരവും നിയമപരവുമായ സൂചന അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
  alternative: ‘യോസേഫും അവന്റെ അമ്മയും’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠം യോസേഫിന്റെ പേര് ഉപയോഗിക്കാതെ ‘അവന്റെ പിതാവ്’ എന്നാണ് പറയുന്നത്. ഈ ഭാഷാപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം മുഖ്യവാക്യത്തിൽ തിരുത്തി പരിഹരിക്കാതെ നിലനിർത്തണം; ലൂക്കാ മുമ്പ് വിവരിച്ച കന്യകാഗർഭധാരണത്തെ ഇത് സ്വതവേ നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പിതാവ്/മാതാവ്’ എന്ന കൂടുതൽ ഔപചാരിക പദജോടിക്കു പകരം സാധാരണ വായനയിൽ സ്വാഭാവികമായ ‘അപ്പൻ/അമ്മ’ ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിലെ ആവർത്തിത ‘-കൊണ്ടിരുന്നു’ രൂപങ്ങൾ ഗ്രീക്കിലെ തുടരുന്ന ഭൂതകാലഭാവം വ്യക്തമാക്കുന്നു.
