  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: ml
  text: യജമാനനേ, ഇപ്പോൾ അങ്ങയുടെ വചനപ്രകാരം അങ്ങയുടെ അടിമയെ[a] സമാധാനത്തോടെ വിട്ടയയ്ക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അങ്ങയുടെ ദാസനെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് δοῦλος എന്ന പദത്തിന് ‘അടിമ’ എന്നും ‘ദാസൻ/സേവകൻ’ എന്നും അർഥമാകാം. ഇവിടെ ദൈവത്തെ ‘യജമാനൻ’ എന്നു വിളിക്കുന്നതിനാൽ ഉടമസ്ഥതയുടെയും സേവനബന്ധത്തിന്റെയും ഭാവം വ്യക്തമാക്കാൻ ‘അടിമ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ശിമെയോൻ സമാധാനത്തോടെ ഈ ജീവിതത്തിൽനിന്ന് വിടപറയാൻ സന്നദ്ധനാണെന്നാണ് സന്ദർഭത്തിലെ സൂചന. എന്നാൽ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘വിട്ടയയ്ക്കുന്നു’ അല്ലെങ്കിൽ ‘പോകാൻ അനുവദിക്കുന്നു’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: ഇപ്പോൾ
  rationale: ശിമെയോന്റെ പ്രതീക്ഷ ഇപ്പോൾ നിറവേറുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ കാലക്രിയാവിശേഷണം.
- source_word: ἀπολύεις
  choice: വിട്ടയയ്ക്കുന്നു
  rationale: വിടുക, മോചിപ്പിക്കുക, പോകാൻ അനുവദിക്കുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്ന വർത്തമാനകാല ക്രിയ. ഇവിടെ മരണം സൂചനയായുണ്ടെങ്കിലും അതിനെ മുഖ്യപാഠത്തിൽ തുറന്നുപറയാതെ ഗ്രീക്കിലെ രൂപകം നിലനിർത്തുന്നു.
- source_word: τὸν δοῦλόν σου
  choice: അങ്ങയുടെ അടിമയെ
  rationale: δοῦλος സേവകനെയോ അടിമയെയോ സൂചിപ്പിക്കാം. δέσποτα എന്ന അഭിസംബോധനയോടുള്ള നേരിട്ടുള്ള ബന്ധത്തിൽ ഉടമസ്ഥതയ്ക്കും പൂർണവിധേയത്വത്തിനും ഉള്ള ഊന്നൽ നിലനിർത്താൻ ‘അടിമ’ തെരഞ്ഞെടുത്തു.
- source_word: δέσποτα
  choice: യജമാനനേ
  rationale: അധികാരവും ഉടമസ്ഥതയും ഉള്ള യജമാനനെ സൂചിപ്പിക്കുന്ന സംബോധന. ‘അടിമ’ എന്ന പദവുമായി ഉള്ള ബന്ധവും ഗ്രീക്കിന്റെ വ്യക്തിപരമായ അഭിസംബോധനയും ഇത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: അങ്ങയുടെ വചനപ്രകാരം
  rationale: ദൈവം അരുളിച്ചെയ്ത വാഗ്ദാനത്തിന് അനുസൃതമായി എന്ന ആശയം നൽകുന്നു; ‘വചനം’ ദൈവിക വാഗ്ദാനത്തോടുള്ള സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: ἐν εἰρήνῃ
  choice: സമാധാനത്തോടെ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി, ദൈവിക അനുഗ്രഹത്തിൻ കീഴിലുള്ള ശാന്തമായ യാത്രയയപ്പിന്റെ ആശയം നൽകുന്നു.
theological_decisions:
- issue: ശിമെയോന്റെ വാക്കുകൾ മരണത്തെ തുറന്നുപറയുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തണമോ
  choice: മരണം നേരിട്ട് പറയാതെ ‘വിട്ടയയ്ക്കുന്നു’ എന്ന രൂപകം നിലനിർത്തി
  alternative: ഇപ്പോൾ അങ്ങയുടെ അടിമയെ സമാധാനത്തോടെ മരിക്കാൻ അനുവദിക്കുന്നു
  rationale: സന്ദർഭത്തിൽ ശിമെയോൻ മരിക്കാൻ സന്നദ്ധനാണെന്ന സൂചന ശക്തമാണെങ്കിലും ἀπολύω എന്ന ക്രിയ സ്വതവേ ‘മരിപ്പിക്കുക’ എന്നല്ല, ‘വിട്ടയയ്ക്കുക/പോകാൻ അനുവദിക്കുക’ എന്നാണ്. അതിനാൽ മൂലപാഠത്തിലെ കാവ്യാത്മകവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു. ‘അങ്ങ്’ ആദരസൂചക അഭിസംബോധനയായി സ്വീകരിച്ചു; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ട് ‘യജമാനനേ’ എന്ന സംബോധന മുന്നിൽ വെച്ചു. ‘വിട്ടയയ്ക്കുന്നു’ എന്ന രൂപം കർത്താവിനോടുള്ള ആദരസൂചക രണ്ടാംപുരുഷപ്രയോഗമായി സന്ദർഭത്തിൽ വായിക്കപ്പെടുന്നു.
