id: LUK.2.20
reference: Luke 2:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: ml
  text: തങ്ങൾ കേൾക്കുകയും കാണുകയും ചെയ്തതെല്ലാം അവരോടു പറഞ്ഞിരുന്നതുപോലെതന്നെ ആയിരുന്നതിനാൽ, ഇടയന്മാർ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തിയും സ്തുതിച്ചും മടങ്ങിപ്പോയി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തിരിച്ചുപോയി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: മടങ്ങിപ്പോയി
  rationale: സന്ദർശനത്തിനുശേഷം അവർ മുമ്പുണ്ടായിരുന്ന സ്ഥലത്തേക്കോ പ്രവർത്തനത്തിലേക്കോ തിരിച്ചുപോയതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: οἱ ποιμένες
  choice: ഇടയന്മാർ
  rationale: കഥാസന്ദർഭത്തിൽ മുമ്പ് പരിചയപ്പെടുത്തിയ ആട്ടിടയന്മാരെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാള പദം.
- source_word: δοξάζοντες
  choice: മഹത്ത്വപ്പെടുത്തുകയും
  rationale: മടങ്ങുന്ന സമയത്ത് തുടരുന്ന പ്രവൃത്തിയെ പങ്കാളിക്രിയയുടെ ഭാവത്തോടെ പ്രകടിപ്പിക്കുകയും αἰνοῦντες എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: αἰνοῦντες
  choice: സ്തുതിക്കുകയും
  rationale: δοξάζοντες എന്നതിനോട് അർത്ഥസാമ്യമുണ്ടെങ്കിലും വേറിട്ട രണ്ടാമത്തെ പ്രവൃത്തിയായി നിലനിർത്തുന്നു.
- source_word: τὸν θεὸν
  choice: ദൈവത്തെ
  rationale: രണ്ടു പങ്കാളിക്രിയകളുടെയും നേരിട്ടുള്ള കർമം.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: സകലത്തെയും കുറിച്ച്
  rationale: സ്തുതിയുടെ അടിസ്ഥാനമോ സന്ദർഭമോ സൂചിപ്പിക്കുന്ന ἐπί + ദത്തിവിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കാരണാർഥവും ഉൾക്കൊള്ളാൻ കഴിയും.
- source_word: ἤκουσαν καὶ εἶδον
  choice: തങ്ങൾ കേൾക്കുകയും കാണുകയും ചെയ്ത
  rationale: മടങ്ങുന്നതിനും സ്തുതിക്കുന്നതിനും മുമ്പ് നടന്ന അനുഭവങ്ങളെ മലയാളത്തിലെ ബന്ധവാക്യഘടനയിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: അവരോടു പറഞ്ഞിരുന്നതുപോലെതന്നെയായിരുന്നു
  rationale: καθώς എന്നതിന്റെ കൃത്യമായ പൊരുത്തം നിലനിർത്തുന്നു; കർമണി പ്രയോഗം വഴി പറഞ്ഞയാളെ ഗ്രീക്കുപോലെ പരാമർശിക്കാതെ വിടുന്നു.
theological_decisions:
- issue: കേട്ടതും കണ്ടതും ദൂതന്റെ അറിയിപ്പിനോട് പൊരുത്തപ്പെട്ടുവെന്ന് വ്യക്തമാക്കണോ
  choice: പറഞ്ഞയാളെ പേരെടുത്തുപറയാതെ, “അവരോടു പറഞ്ഞിരുന്നതുപോലെതന്നെ” എന്നു കർമണി രൂപത്തിൽ നിലനിർത്തി.
  alternative: “ദൂതൻ അവരോടു പറഞ്ഞിരുന്നതുപോലെതന്നെ”
  rationale: സന്ദർഭം ദൂതന്റെ സന്ദേശത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പറഞ്ഞയാളെ വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഉറവിടത്തിലെ പരോക്ഷത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. “മഹത്ത്വപ്പെടുത്തുകയും സ്തുതിക്കുകയും” എന്ന ഇരട്ടപ്രയോഗം ഗ്രീക്കിലെ വ്യത്യസ്തമായ രണ്ടു പങ്കാളിക്രിയകളെ സംരക്ഷിക്കുന്നു. പ്രധാനവാക്യത്തിലെ ദൈർഘ്യം നിയന്ത്രിക്കാൻ καθώς-വാക്യം അർത്ഥപരമായി വ്യക്തമായ രണ്ടാം ഖണ്ഡമായി നൽകിയിരിക്കുന്നു.
