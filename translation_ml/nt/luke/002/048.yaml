source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: ml
  text: 'അവർ അവനെ കണ്ടപ്പോൾ അമ്പരന്നുപോയി. അവന്റെ അമ്മ അവനോടു പറഞ്ഞു: “കുഞ്ഞേ, നീ ഞങ്ങളോട് ഇങ്ങനെ ചെയ്തത് എന്തിന്? നോക്കൂ, നിന്റെ അപ്പനും ഞാനും മനോവേദനയോടെ[a] നിന്നെ അന്വേഷിക്കുകയായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വ്യാകുലരായി” അല്ലെങ്കിൽ “അതീവ ദുഃഖത്തോടെ”; അന്വേഷണത്തിനിടയിൽ അനുഭവിച്ച വൈകാരിക വേദനയാണ് ഗ്രീക്ക് കൃദന്തം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: അവർ അവനെ കണ്ടപ്പോൾ
  rationale: ക്രിയാവിശേഷണസ്വഭാവമുള്ള ഭൂതകാല കൃദന്തത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി നൽകി; സംഭവങ്ങളുടെ ക്രമം നിലനിർത്തുന്നു.
- source_word: ἐξεπλάγησαν
  choice: അമ്പരന്നുപോയി
  rationale: ശക്തമായ ആശ്ചര്യവും വിസ്മയവും സൂചിപ്പിക്കുന്ന പദത്തിന്റെ തീവ്രത സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: Τέκνον
  choice: കുഞ്ഞേ
  rationale: സ്നേഹപൂർവമായ അഭിസംബോധന നിലനിർത്തുന്നു; ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്ത ‘എന്റെ’ എന്ന ഉടമസ്ഥപദം ചേർക്കുന്നില്ല.
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: നീ ഞങ്ങളോട് ഇങ്ങനെ ചെയ്തത് എന്തിന്?
  rationale: പരാതിയുടെ ഭാവവും ἡμῖν എന്ന ബന്ധപരമായ ഘടകവും സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἰδοὺ
  choice: നോക്കൂ
  rationale: നേരിട്ടുള്ള സംഭാഷണത്തിൽ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഊന്നൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ πατήρ σου
  choice: നിന്റെ അപ്പൻ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ലളിതമായ കുടുംബബന്ധസൂചനയ്ക്ക് വ്യാഖ്യാനപരമായ ‘ഭൗമിക’ തുടങ്ങിയ വിശേഷണങ്ങൾ ചേർക്കാതെ സ്വാഭാവിക മാതൃസംഭാഷണമായി നൽകുന്നു.
- source_word: ὀδυνώμενοι
  choice: മനോവേദനയോടെ
  rationale: അന്വേഷണത്തിനിടയിലെ വൈകാരിക വേദനയും വ്യാകുലതയും കൃദന്തത്തിന്റെ ശക്തി കുറയ്ക്കാതെ പ്രകടമാക്കുന്നു.
- source_word: ἐζητοῦμέν σε
  choice: നിന്നെ അന്വേഷിക്കുകയായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചയായ പ്രവൃത്തിയെ മലയാളത്തിലെ ‘-കൊണ്ടിരിക്കുകയായിരുന്നു’ എന്നതിനെക്കാൾ ചുരുക്കവും സ്വാഭാവികവുമായ തുടർച്ചാഭാവത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനെ സംബന്ധിച്ച് യോസേഫിനെ ‘നിന്റെ അപ്പൻ’ എന്നു വിളിക്കുന്നത്
  choice: പ്രധാന പാഠത്തിൽ യാതൊരു വിശേഷണവും ചേർക്കാതെ ‘നിന്റെ അപ്പൻ’ എന്നു നിലനിർത്തി.
  alternative: നിന്റെ ഭൗമിക അപ്പൻ
  rationale: മറിയയുടെ വാക്കുകളിൽ ഗ്രീക്ക് പാഠം നേരിട്ട് ‘നിന്റെ അപ്പൻ’ എന്നാണ് പറയുന്നത്. ‘ഭൗമിക’ എന്നു ചേർക്കുന്നത് പരിഭാഷയ്ക്കപ്പുറമുള്ള വ്യാഖ്യാനമാകും; അടുത്ത വാക്യത്തിലേക്കുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും ഇവിടെ സംരക്ഷിക്കപ്പെടുന്നു.
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനിക നിലവാരമലയാളം ഉപയോഗിച്ചു. മാതാവിന്റെ നേരിട്ടുള്ള സംഭാഷണത്തിന് സ്വാഭാവികത നൽകാൻ ‘കുഞ്ഞേ’, ‘അപ്പൻ’, ‘നോക്കൂ’ എന്നിവ തിരഞ്ഞെടുത്തു; മൊത്തത്തിലുള്ള ശൈലി ലളിതവും മാന്യവുമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘മനോവേദനയോടെ’ എന്ന പദത്തോടു ചേർത്തിരിക്കുന്നു.
