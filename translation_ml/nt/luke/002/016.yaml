source:
  edition: SBLGNT
  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: ml
  text: അവർ തിടുക്കത്തിൽ ചെന്ന് മറിയയെയും യോസേഫിനെയും പുൽത്തൊട്ടിയിൽ[a] കിടക്കുന്ന കുഞ്ഞിനെയും കണ്ടെത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തീറ്റത്തൊട്ടിയിൽ.” ഗ്രീക്ക് പദം മൃഗങ്ങൾക്ക് തീറ്റ കൊടുക്കുന്ന തൊട്ടിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν
  choice: ചെന്ന്
  rationale: കഥാസന്ദർഭത്തിൽ ഇടയന്മാർ അറിയിക്കപ്പെട്ട സ്ഥലത്തേക്കു നീങ്ങിയതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്ക് ക്രിയയുടെ സന്ദർഭാനുസൃതമായ ‘പോയി/വന്നു’ എന്ന ദിശാഭാവം ഇവിടെ ‘ചെന്ന്’ എന്നതിൽ നന്നായി പ്രതിഫലിക്കുന്നു.
- source_word: σπεύσαντες
  choice: തിടുക്കത്തിൽ
  rationale: പ്രധാനക്രിയയോടൊപ്പമുള്ള പ്രവൃത്തിയുടെ രീതി സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയുടെ അടിയന്തരത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀνεῦραν
  choice: കണ്ടെത്തി
  rationale: അന്വേഷിച്ചതിനുശേഷം കണ്ടെത്തുക എന്ന ക്രിയയുടെ സൂക്ഷ്മഭാവം ‘കണ്ടെത്തി’ കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: മറിയയെയും യോസേഫിനെയും
  rationale: പേരുകൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകുകയും τε ... καί എന്ന ഏകോപനം ‘-യെയും ... -യെയും’ ഉപയോഗിച്ച് സ്വാഭാവികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸ βρέφος
  choice: കുഞ്ഞ്
  rationale: ജനനസന്ദർഭത്തിലെ വളരെ ചെറുപ്പമുള്ള ശിശുവിനെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: κείμενον
  choice: കിടക്കുന്ന
  rationale: ആരെങ്കിലും കിടത്തിയ പ്രവൃത്തിയെയല്ല, കുഞ്ഞിന്റെ അന്നത്തെ അവസ്ഥയും സ്ഥാനവും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സ്ഥിതിവാചക അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ φάτνῃ
  choice: പുൽത്തൊട്ടിയിൽ
  rationale: ജനനവിവരണത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം; φάτνη എന്ന പദത്തിന്റെ കൂടുതൽ പൊതുവായ ‘തീറ്റത്തൊട്ടി’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: καὶ ... καὶ ... καὶ
  choice: -യെയും ... -യെയും ... -നെയും
  rationale: ഗ്രീക്കിലെ ലളിതമായ കൂട്ടിച്ചേർക്കൽശൈലി മലയാളത്തിലെ ഏകോപനപ്രത്യയങ്ങൾ ഉപയോഗിച്ച് സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
