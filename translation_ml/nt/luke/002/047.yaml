- from: അവന്റെ വാക്കുകൾ കേട്ടിരുന്ന എല്ലാവരും അവന്റെ ഗ്രഹണശക്തിയിലും ഉത്തരങ്ങളിലും വിസ്മയിച്ചുപോയി.[a]
  to: അവനെ കേട്ടിരുന്ന എല്ലാവരും അവന്റെ ഗ്രഹണശക്തിയിലും അവന്റെ ഉത്തരങ്ങളിലും വിസ്മയിച്ചുകൊണ്ടിരുന്നു.[a]
  rationale: The revision removes an unnecessary supplied object, represents the Greek imperfect with an ongoing Malayalam form, and keeps the possessive reference to both “understanding” and “answers” explicit. It retains the source’s meaning, the English audit trail’s strong-amazement nuance, and a natural modern Malayalam narrative register.
