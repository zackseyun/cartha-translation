id: LUK.2.7
reference: Luke 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: ml
  text: അവൾ തന്റെ ആദ്യജാതനായ മകനെ പ്രസവിച്ചു. അവനെ തുണികളിൽ പൊതിഞ്ഞ്[a] ഒരു മൃഗങ്ങളുടെ തീറ്റത്തൊട്ടിയിൽ[b] കിടത്തി; കാരണം അതിഥിമുറിയിൽ[c] അവർക്ക് ഇടമില്ലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ ശിശുവസ്ത്രങ്ങളിൽ ചുറ്റിപ്പൊതിഞ്ഞ്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പുൽത്തൊട്ടിയിൽ.’ ഗ്രീക്ക് പദം മൃഗങ്ങൾക്ക് തീറ്റ വെക്കുന്ന ഇടത്തെയോ തീറ്റത്തൊട്ടിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: പരമ്പരാഗതമായി, ‘സത്രത്തിൽ.’ ഗ്രീക്ക് κατάλυμα എന്ന പദത്തിന് അതിഥിമുറി എന്നോ താമസസ്ഥലം എന്നോ അർഥമാകാം; വാണിജ്യസത്രത്തിന് ലൂക്കാ 10:34-ൽ വേറൊരു പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: പ്രസവിച്ചു
  rationale: പ്രസവസന്ദർഭത്തിൽ τίτκω എന്ന ക്രിയയുടെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടും വ്യക്തമാക്കുന്നു.
- source_word: πρωτότοκον
  choice: ആദ്യജാതനായ
  rationale: ഇവിടെ ജനനക്രമത്തെ സൂചിപ്പിക്കുന്ന πρωτότοκος എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിനപ്പുറമുള്ള ദൈവശാസ്ത്ര നിഗമനങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: ἐσπαργάνωσεν
  choice: തുണികളിൽ പൊതിഞ്ഞ്
  rationale: ശിശുവിനെ തുണികൊണ്ട് ചുറ്റിപ്പൊതിയുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക ഭാഷയിൽ നൽകുന്നു.
- source_word: ἀνέκλινεν
  choice: കിടത്തി
  rationale: ഈ സന്ദർഭത്തിൽ ശിശുവിനെ താഴെ കിടത്തിവെക്കുക എന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: φάτνῃ
  choice: കാലിത്തീറ്റത്തൊട്ടിയിൽ
  rationale: മൃഗങ്ങൾക്ക് തീറ്റ വെക്കുന്ന ഇടമോ തൊട്ടിയോ എന്ന ഗ്രീക്ക് പദത്തിന്റെ മൂർത്തമായ അർഥം വ്യക്തമാക്കുന്നു; പരമ്പരാഗതമായ ‘പുൽത്തൊട്ടി’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τόπος
  choice: സ്ഥലം
  rationale: τόπος എന്ന പദത്തിന്റെ വിശാലമായ ‘സ്ഥലം/ഇടം’ എന്ന അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καταλύματι
  choice: അതിഥിമുറിയിൽ
  rationale: κατάλυμα എന്നത് അതിഥിമുറിയെയോ താമസസ്ഥലത്തെയോ സൂചിപ്പിക്കാം. ലൂക്കാ 22:11-ലെ ലൂക്കായുടെ പ്രയോഗത്തോടും വാണിജ്യസത്രത്തിന് ലൂക്കാ 10:34-ൽ ഉപയോഗിച്ചിരിക്കുന്ന വ്യത്യസ്ത പദത്തോടും ഇത് യോജിക്കുന്നു.
theological_decisions:
- issue: καταλύματι എന്നത് പരമ്പരാഗതമായ ‘സത്രം’ എന്നോ ഒരു വീട്ടിലെ അതിഥികൾക്കുള്ള ഇടത്തെ സൂചിപ്പിക്കുന്ന പദമായോ വിവർത്തനം ചെയ്യണമോ എന്നത്
  choice: അതിഥിമുറിയിൽ
  alternative: സത്രത്തിൽ; താമസസ്ഥലത്ത്
  rationale: ഗ്രീക്ക് പദം ഒരു വാണിജ്യസത്രത്തെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല. ലൂക്കാ 22:11-ൽ κατάλυμα അതിഥിമുറിയെ സൂചിപ്പിക്കുമ്പോൾ, ലൂക്കാ 10:34-ൽ വാണിജ്യസത്രത്തിന് πανδοχεῖον എന്ന വേറൊരു പദമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ മൂലഭാഷയ്ക്ക് മുൻഗണന നൽകി ‘അതിഥിമുറി’ സ്വീകരിക്കുകയും പരമ്പരാഗത വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പരമ്പരാഗതമായി പരിചിതമായ പദങ്ങൾ ആവശ്യമായിടത്ത് അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചിരിക്കുന്നു. മൂലവാക്യത്തിലെ കാരണം സൂചിപ്പിക്കുന്ന ബന്ധം അർധവിരാമത്തിലൂടെ വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
