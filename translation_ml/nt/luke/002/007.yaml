revisions:
- from: അവൾ തന്റെ ആദ്യജാതനായ മകനെ പ്രസവിച്ചു. അവനെ തുണികളിൽ പൊതിഞ്ഞ്[a] ഒരു കാലിത്തീറ്റത്തൊട്ടിയിൽ[b] കിടത്തി; കാരണം അതിഥിമുറിയിൽ[c] അവർക്കു സ്ഥലമുണ്ടായിരുന്നില്ല.
  to: അവൾ തന്റെ ആദ്യജാതനായ മകനെ പ്രസവിച്ചു. അവനെ തുണികളിൽ പൊതിഞ്ഞ്[a] ഒരു മൃഗങ്ങളുടെ തീറ്റത്തൊട്ടിയിൽ[b] കിടത്തി; കാരണം അതിഥിമുറിയിൽ[c] അവർക്ക് ഇടമില്ലായിരുന്നു.
  rationale: വിവർത്തനത്തിന്റെ അടിസ്ഥാന തീരുമാനങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു. φάτνηയുടെ മൃഗസംബന്ധമായ പൊതുവായ അർഥം കൂടുതൽ കൃത്യമായി നൽകുന്നതിനും, മുഖ്യവാചകവും അടിക്കുറിപ്പുകളും ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാക്കുന്നതിനുമായി ചെറിയ ശൈലീപരവും പദപരവുമായ തിരുത്തലുകൾ മാത്രം വരുത്തി.
