  text: ἡ δὲ ⸀Μαρία πάντα συνετήρει τὰ ῥήματα ταῦτα συμβάλλουσα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: ml
  text: എന്നാൽ മറിയ ഈ വാക്കുകളെല്ലാം സൂക്ഷിച്ചുകൊണ്ട്, അവയെ തന്റെ ഹൃദയത്തിൽ കൂട്ടിച്ചേർത്ത് ചിന്തിച്ചുപോന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സൂക്ഷിച്ചു” എന്നതിന് “ഈ കാര്യങ്ങളെല്ലാം ശ്രദ്ധാപൂർവം കാത്തുവെച്ചു” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “കൂട്ടിച്ചേർത്ത് ചിന്തിച്ചു” എന്നത് അവയെ തമ്മിൽ ബന്ധപ്പെടുത്തി പരിഗണിച്ചു, അല്ലെങ്കിൽ അവയെ ഒരുമിച്ചു തൂക്കിനോക്കി എന്ന അർഥം നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മറ്റുള്ളവരുടെ പ്രതികരണത്തിൽനിന്ന് മറിയയുടെ ആന്തരിക പ്രതികരണത്തിലേക്കുള്ള നേരിയ വൈരുധ്യവും ആഖ്യാനമാറ്റവും വ്യക്തമാക്കുന്നു.
- source_word: συνετήρει
  choice: സൂക്ഷിച്ചുകൊണ്ട്
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവർത്തനവും കാര്യങ്ങളെ ശ്രദ്ധാപൂർവം കാത്തുസൂക്ഷിക്കുന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: ഈ വാക്കുകളെല്ലാം
  rationale: ῥήματα എന്നത് സന്ദർഭത്തിൽ ഇടയന്മാർ അറിയിച്ച വാക്കുകളെയും സന്ദേശത്തെയും സൂചിപ്പിക്കുന്നു; πάντα അതിന്റെ സമഗ്രത വ്യക്തമാക്കുന്നു.
- source_word: συμβάλλουσα
  choice: അവയെ കൂട്ടിച്ചേർത്ത് ചിന്തിച്ചുപോന്നു
  rationale: വിവിധ വാക്കുകളെ മനസ്സിൽ ഒരുമിച്ചുവെച്ച് താരതമ്യം ചെയ്യുകയും ആലോചിക്കുകയും ചെയ്യുന്നതെന്ന മൂലപദത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: തന്റെ ഹൃദയത്തിൽ
  rationale: ചിന്ത, ധ്യാനം, വികാരം എന്നിവയുടെ ആന്തരിക കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകം നിലനിർത്തുന്നു.
- source_word: Μαρία
  choice: മറിയ
  rationale: ആധുനിക മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: മറിയയുടെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: അവൾ സന്ദേശം ശ്രദ്ധാപൂർവം മനസ്സിൽ സൂക്ഷിച്ച് അതിലെ കാര്യങ്ങളെ തമ്മിൽ ബന്ധപ്പെടുത്തി ചിന്തിച്ചുപോന്നു.
  alternative: അവൾ സംഭവങ്ങളെ വെറുതെ ഓർത്തുവെച്ചു; അല്ലെങ്കിൽ അപ്പോൾത്തന്നെ അവൾക്ക് അവയുടെ അർഥം പൂർണമായി മനസ്സിലായി.
  rationale: വാക്യം സൂക്ഷിക്കലും ആലോചനയും പറയുന്നു; പൂർണമായ ഗ്രഹണം ഉണ്ടായിരുന്നുവെന്നോ ഇത് വെറും ഓർമപ്പെടുത്തലായിരുന്നുവെന്നോ ഉറപ്പിക്കുന്നില്ല. അതിനാൽ ഈ ദൈവശാസ്ത്രപരമായ തുറന്ന നില വിവർത്തനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സ്വാഭാവികവും മാന്യവുമായ മലയാളം. ‘ഹൃദയത്തിൽ’ എന്ന ബൈബിൾ രൂപകം നിലനിർത്തി; ‘കൂട്ടിച്ചേർത്ത് ചിന്തിച്ചുപോന്നു’ എന്ന പ്രയോഗം മൂലപദത്തിന്റെ താരതമ്യാത്മകവും തുടർച്ചയുള്ളതുമായ ധ്യാനഭാവം വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
