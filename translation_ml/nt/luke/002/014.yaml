  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δόξα ἐν ὑψίστοις θεῷ καὶ ἐπὶ γῆς εἰρήνη ἐν ἀνθρώποις ⸀εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: ml
  text: “അത്യുന്നതങ്ങളിൽ ദൈവത്തിനു മഹത്ത്വം; ഭൂമിയിൽ ദൈവത്തിന്റെ പ്രസാദപാത്രരായ മനുഷ്യരുടെ ഇടയിൽ സമാധാനം.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: “ഭൂമിയിൽ ദൈവം പ്രസാദിച്ചിരിക്കുന്ന മനുഷ്യരുടെ ഇടയിൽ സമാധാനം.”'
    reason: lexical_alternative
  - marker: b
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ εὐδοκίας എന്നതിനുപകരം εὐδοκία എന്ന പാഠഭേദമുണ്ട്; അതനുസരിച്ച്: “ഭൂമിയിൽ സമാധാനം; മനുഷ്യരുടെ ഇടയിൽ സൽമനസ്സ്.”'
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: മഹത്ത്വം
  rationale: ദൈവത്തിനു മഹത്ത്വം അർപ്പിക്കുന്ന പ്രഖ്യാപനസ്വഭാവമുള്ള പ്രയോഗമാണിത്. ‘മഹത്ത്വം’ എന്നത് ആരാധനാപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: ἐν ὑψίστοις
  choice: അത്യുന്നതങ്ങളിൽ
  rationale: ഏറ്റവും ഉയർന്ന സ്വർഗീയ മണ്ഡലത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനപ്രയോഗത്തിന്റെ സ്ഥാനാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: θεῷ
  choice: ദൈവത്തിനു
  rationale: ഗ്രീക്കിലെ ദത്തിവിഭക്തി മഹത്ത്വം ദൈവത്തിനാണ് അർപ്പിക്കപ്പെടുന്നതെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദൈവത്തിനു’ സ്വാഭാവികമാണ്.
- source_word: ἐπὶ γῆς
  choice: ഭൂമിയിൽ
  rationale: ‘അത്യുന്നതങ്ങളിൽ’ എന്നതിനോടുള്ള സ്ഥലപരമായ വൈരുധ്യം വ്യക്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: ബൈബിൾസന്ദർഭത്തിലെ വിശാലമായ സമാധാനാർഥം സംരക്ഷിക്കുന്ന പതിവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: ἐν ἀνθρώποις
  choice: മനുഷ്യരുടെ ഇടയിൽ
  rationale: ἄνθρωποι ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യർ’ ലിംഗഭേദമില്ലാതെ ഈ പൊതുവായ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: εὐδοκίας
  choice: ദൈവത്തിന്റെ പ്രസാദപാത്രരായ
  rationale: സ്വീകരിച്ചിരിക്കുന്ന ജനിറ്റീവ് പാഠം സമാധാനം ലഭിക്കുന്ന മനുഷ്യരെ ദൈവപ്രസാദത്തിന്റെ പാത്രങ്ങളായി വിശേഷിപ്പിക്കുന്നു. ഉടമസ്ഥൻ ഗ്രീക്കിൽ പ്രത്യേകം പറഞ്ഞിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ പ്രസാദം ദൈവത്തിന്റേതാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിനായി വ്യക്തമാക്കുന്നു; കൂടുതൽ നേരിട്ടുള്ള വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: εὐδοκίας എന്ന ജനിറ്റീവിന്റെ അർഥവും ബന്ധവും
  choice: സമാധാനം ദൈവത്തിന്റെ പ്രസാദപാത്രരായ മനുഷ്യരുമായി ബന്ധപ്പെടുത്തി പകരുക
  alternative: ‘ദൈവം പ്രസാദിച്ചിരിക്കുന്ന മനുഷ്യരുടെ ഇടയിൽ’ എന്നു പകരുക; അല്ലെങ്കിൽ വ്യത്യസ്ത പാഠമായ εὐδοκία അനുസരിച്ച് ‘ഭൂമിയിൽ സമാധാനം; മനുഷ്യരോടു പ്രസാദം’ എന്നു പകരുക
  rationale: SBLGNT സ്വീകരിച്ചിരിക്കുന്നത് εὐδοκίας എന്ന ജനിറ്റീവ് പാഠമാണ്. അതിനാൽ εἰρήνη എന്നതിനുശേഷം സ്വതന്ത്രമായ മൂന്നാമത്തെ ആശയമായി ‘പ്രസാദം’ ചേർക്കാതെ, മനുഷ്യരെ വിശേഷിപ്പിക്കുന്ന ബന്ധമായി അത് നിലനിർത്തുന്നു. ഇത് ദൈവിക തിരഞ്ഞെടുപ്പിനെക്കുറിച്ചുള്ള സമ്പൂർണ സിദ്ധാന്തം വാക്യത്തിൽ ഇറക്കുമതി ചെയ്യാതെ വ്യാകരണബലം മാത്രം പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം ഗൗരവവും ആരാധനാപരമായ താളവും നിലനിർത്തി. ‘അത്യുന്നതങ്ങളിൽ’ എന്ന പരമ്പരാഗത ബൈബിൾപ്രയോഗം സ്വർഗീയ സ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; ‘മനുഷ്യർ’ ἄνθρωποι എന്ന പദത്തിന്റെ പൊതുമാനവിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
