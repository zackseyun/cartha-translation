revisions:
- from: അവന്റെ മാതാപിതാക്കൾ പെസഹാപ്പെരുന്നാളിനായി എല്ലാ വർഷവും യെരൂശലേമിലേക്കു പോകാറുണ്ടായിരുന്നു.
  to: അവന്റെ മാതാപിതാക്കൾ എല്ലാ വർഷവും പെസഹാ പെരുന്നാളിന് യെരൂശലേമിലേക്കു പോകാറുണ്ടായിരുന്നു.
  rationale: A small orthographic and idiomatic revision improves readability and aligns the festival phrase more closely with the Greek dative of occasion. The habitual past, familial terminology, annual frequency, place name, and Passover reference remain unchanged in meaning.
  reviewer_model: gpt-5.6-terra
