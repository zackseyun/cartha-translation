id: LUK.2.41
reference: Luke 2:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: ml
  text: അവന്റെ മാതാപിതാക്കൾ എല്ലാ വർഷവും പെസഹാ പെരുന്നാളിന് യെരൂശലേമിലേക്കു പോകാറുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: പോകാറുണ്ടായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം ഇവിടെ കഴിഞ്ഞകാലത്തെ പതിവായ ആവർത്തനപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘പോകാറുണ്ടായിരുന്നു’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: γονεῖς
  choice: മാതാപിതാക്കൾ
  rationale: ഗ്രീക്ക് ബഹുവചനനാമത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യപദം.
- source_word: κατ’ ἔτος
  choice: എല്ലാ വർഷവും
  rationale: ഓരോ വർഷവും ആവർത്തിച്ചിരുന്ന പതിവ് എന്ന വിതരണാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἰερουσαλὴμ
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: τῇ ἑορτῇ
  choice: പെരുന്നാളിനായി
  rationale: യാത്രയുടെ അവസരവും ഉദ്ദേശ്യവും സൂചിപ്പിക്കുന്ന ദത്തിവിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τοῦ πάσχα
  choice: പെസഹാ
  rationale: യഹൂദരുടെ Passover ഉത്സവത്തിനുള്ള മലയാളത്തിൽ സ്ഥാപിതവും മൂലരൂപത്തോട് അടുത്തതുമായ പേര്.
theological_decisions:
- issue: യേശുവിന്റെ കുടുംബാംഗങ്ങളെക്കുറിച്ചുള്ള പരാമർശം
  choice: അവന്റെ മാതാപിതാക്കൾ
  alternative: അവന്റെ അപ്പനും അമ്മയും
  rationale: ഗ്രീക്ക് പാഠം സാധാരണ കുടുംബബന്ധപദമായ ‘മാതാപിതാക്കൾ’ എന്നാണ് പറയുന്നത്. ലൂക്കായിലെ കന്യകാഗർഭധാരണവിശ്വാസത്തെ നിഷേധിക്കുകയോ അതിന്റെ പേരിൽ വാക്യത്തിന്റെ സാധാരണ അർഥം മാറ്റുകയോ ചെയ്യാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. പതിവായ കഴിഞ്ഞകാലപ്രവൃത്തിയെ ‘പോകാറുണ്ടായിരുന്നു’ എന്ന രൂപം വ്യക്തമാക്കുന്നു.
