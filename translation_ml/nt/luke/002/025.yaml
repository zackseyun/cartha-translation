id: LUK.2.25
reference: Luke 2:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: ml
  text: ഇതാ, യെരൂശലേമിൽ ശിമെയോൻ എന്നു പേരുള്ള ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു. ഈ മനുഷ്യൻ നീതിമാനും ദൈവഭക്തനും ആയിരുന്നു; അവൻ ഇസ്രായേലിന്റെ ആശ്വാസത്തിനായി[a] കാത്തിരിക്കുകയായിരുന്നു. പരിശുദ്ധാത്മാവ് അവന്റെമേൽ ഉണ്ടായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേലിന്റെ സാന്ത്വനം.’ ഇസ്രായേൽ പ്രതീക്ഷിച്ചിരുന്ന ദൈവിക ആശ്വാസത്തെയും പുനഃസ്ഥാപനത്തെയും ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഒരു വിശുദ്ധ ആത്മാവ് അവന്റെമേൽ ഉണ്ടായിരുന്നു’ എന്നും വ്യാകരണപരമായി മനസ്സിലാക്കാം; എങ്കിലും ലൂക്കോസിന്റെ സന്ദർഭത്തിൽ ഇത് പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ലൂക്കോസ് ഒരു ശ്രദ്ധേയനായ വ്യക്തിയെ സജീവമായി പരിചയപ്പെടുത്താൻ ഉപയോഗിക്കുന്ന ആഖ്യാനസൂചകം നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിലും ഇത് വ്യക്തവും മാന്യവുമാണ്.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ഇവിടെ സൂചിപ്പിക്കുന്നത് ശിമെയോൻ എന്ന പുരുഷനെയാണ്; അതിനാൽ മൂലപദത്തിന്റെ സന്ദർഭോചിതമായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ᾧ ὄνομα Συμεών
  choice: ശിമെയോൻ എന്നു പേരുള്ള
  rationale: തിരിച്ചറിയൽസൂചന കാത്തുകൊണ്ട് സ്വാഭാവികമായ മലയാളശൈലി ഉപയോഗിക്കുന്നു.
- source_word: δίκαιος
  choice: നീതിമാൻ
  rationale: ശിമെയോന്റെ ധാർമികവും ദൈവബന്ധപരവുമായ നേരുറപ്പിനെ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εὐλαβής
  choice: ദൈവഭക്തൻ
  rationale: ദൈവത്തോടുള്ള ആദരവും ശ്രദ്ധാപൂർവമായ ഭക്തജീവിതവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: προσδεχόμενος
  choice: കാത്തിരിക്കുകയായിരുന്നു
  rationale: പ്രതീക്ഷയോടെയുള്ള തുടർച്ചയായ കാത്തിരിപ്പിനെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ ആശ്വാസം
  rationale: παράκλησις എന്ന പദത്തിലെ ആശ്വസിപ്പിക്കൽ എന്ന നേരിട്ടുള്ള അർഥവും ഇസ്രായേലിന്റെ പ്രതീക്ഷിത ദൈവിക പുനഃസ്ഥാപനത്തിന്റെ പശ്ചാത്തലവും നിലനിർത്തുന്നു.
- source_word: πνεῦμα ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ഗ്രീക്കിൽ നിർദേശക ഉപപദം ഇല്ലെങ്കിലും ലൂക്കോസിന്റെ സമീപസന്ദർഭവും 26–27 വാക്യങ്ങളും പരിശുദ്ധാത്മാവിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπ’ αὐτόν
  choice: അവന്റെമേൽ ഉണ്ടായിരുന്നു
  rationale: ആത്മാവിന്റെ സാന്നിധ്യം സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ പ്രയോഗം വ്യാഖ്യാനാത്മകമായി വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν എന്നതിന്റെ നിർദേശം
  choice: പരിശുദ്ധാത്മാവ് അവന്റെമേൽ ഉണ്ടായിരുന്നു
  alternative: ഒരു വിശുദ്ധാത്മാവ് അവന്റെമേൽ ഉണ്ടായിരുന്നു
  rationale: ഗ്രീക്ക് രൂപം വ്യാകരണപരമായി മറ്റൊരു വായന അനുവദിച്ചാലും ലൂക്കോസ്–പ്രവൃത്തികൾ ഗ്രന്ഥത്തിലെ പ്രയോഗവും തൊട്ടടുത്ത വാക്യങ്ങളും നിർദിഷ്ടമായ പരിശുദ്ധാത്മാവിനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; പാഠത്തിലുള്ള വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: παράκλησις τοῦ Ἰσραήλ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: ഇസ്രായേലിന്റെ ആശ്വാസം
  alternative: ഇസ്രായേലിന്റെ സാന്ത്വനം / ഇസ്രായേലിന്റെ പുനഃസ്ഥാപനം
  rationale: ‘ആശ്വാസം’ മൂലപദത്തിന്റെ അടിസ്ഥാനരൂപകം നിലനിർത്തുകയും വാഗ്ദത്ത ദൈവിക ഇടപെടലിനെയും പുനഃസ്ഥാപനത്തെയും ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’ എന്ന ആഖ്യാനസൂചകവും ‘അവന്റെമേൽ’ എന്ന ബൈബിൾസഹജമായ രൂപകവും നിലനിർത്തിയപ്പോൾ, വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
