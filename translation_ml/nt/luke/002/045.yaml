  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ participle ഘടനകളുടെ സംഭവക്രമവും തുടർന്നുനിൽക്കുന്ന അന്വേഷണത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
