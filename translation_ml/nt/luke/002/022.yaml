id: LUK.2.22
reference: Luke 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: ml
  text: മോശെയുടെ ന്യായപ്രമാണപ്രകാരം അവരുടെ ശുദ്ധീകരണത്തിനുള്ള ദിവസങ്ങൾ പൂർത്തിയായപ്പോൾ[a], അവനെ കർത്താവിന് സമർപ്പിക്കാനായി അവർ യെരൂശലേമിലേക്കു കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അവരുടെ ശുദ്ധീകരണം’ എന്നതിനുപകരം ‘അവളുടെ ശുദ്ധീകരണം’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: പൂർത്തിയായപ്പോൾ
  rationale: കാലയളവ് അതിന്റെ നിശ്ചിത അളവിലെത്തി അവസാനിച്ചതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καθαρισμοῦ
  choice: ശുദ്ധീകരണം
  rationale: പ്രസവാനന്തരമുള്ള മോശൈക ന്യായപ്രമാണത്തിലെ ആചാരപരമായ ശുദ്ധീകരണത്തെ സൂചിപ്പിക്കുന്ന യോജിച്ച പദം.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ ബഹുവചന സർവനാമത്തെ അതേപടി നിലനിർത്തുന്നു; ഏകവചന പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: മോശെയുടെ ന്യായപ്രമാണപ്രകാരം
  rationale: മോശൈക നിയമത്തിലെ വ്യവസ്ഥയോടുള്ള അനുരൂപത ഔപചാരികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀνήγαγον
  choice: കൊണ്ടുപോയി
  rationale: യെരൂശലേമിലേക്കുള്ള യാത്രയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഗ്രീക്കിലെ ഉയരത്തിലേക്കുള്ള ദിശാസൂചന മലയാളത്തിൽ നിർബന്ധമായി ആവർത്തിക്കാതെ സന്ദർഭം നിലനിർത്തുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം.
- source_word: παραστῆσαι
  choice: സന്നിധിയിൽ സമർപ്പിക്കാനായി
  rationale: ദൈവത്തിന്റെ മുമ്പാകെ ഒരാളെ ആചാരപരമായി ഹാജരാക്കി സമർപ്പിക്കുന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κυρίῳ
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്ന ദൈവസംബോധനയ്ക്ക് മലയാളത്തിലെ സ്ഥാപിതവും ആദരസൂചകവുമായ തത്തുല്യം.
theological_decisions:
- issue: ‘അവരുടെ ശുദ്ധീകരണം’ എന്നതിലെ സർവനാമത്തിന്റെ വചനം
  choice: പ്രധാനപാഠത്തിൽ ബഹുവചനം ‘അവരുടെ’ നിലനിർത്തി
  alternative: ‘അവളുടെ ശുദ്ധീകരണം’
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠം αὐτῶν എന്ന ബഹുവചനം വായിക്കുന്നു. ലേവ്യനിയമത്തിന്റെ പശ്ചാത്തലത്തെ ആശ്രയിച്ച് ഏകവചനമായി വ്യാഖ്യാനിച്ച് സംഘർഷം മറയ്ക്കാതെ, ഏകവചന പാഠഭേദം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമ-ആചാരപരമായ ഭാവം നിലനിർത്താൻ ‘ന്യായപ്രമാണം’, ‘ശുദ്ധീകരണം’, ‘സമർപ്പിക്കുക’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു.
