revisions:
- from: മോശെയുടെ ന്യായപ്രമാണപ്രകാരം അവരുടെ ശുദ്ധീകരണത്തിനുള്ള ദിവസങ്ങൾ പൂർത്തിയായപ്പോൾ[a], അവനെ കർത്താവിന്റെ സന്നിധിയിൽ സമർപ്പിക്കാനായി അവർ യെരൂശലേമിലേക്കു കൊണ്ടുപോയി.
  to: മോശെയുടെ ന്യായപ്രമാണപ്രകാരം അവരുടെ ശുദ്ധീകരണത്തിനുള്ള ദിവസങ്ങൾ പൂർത്തിയായപ്പോൾ[a], അവനെ കർത്താവിന് സമർപ്പിക്കാനായി അവർ യെരൂശലേമിലേക്കു കൊണ്ടുപോയി.
