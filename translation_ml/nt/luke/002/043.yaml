id: LUK.2.43
reference: Luke 2:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: ml
  text: ആ ദിവസങ്ങൾ പൂർത്തിയാക്കി അവർ മടങ്ങുമ്പോൾ, ബാലനായ യേശു യെരൂശലേമിൽ തങ്ങിനിന്നു[a]; അവന്റെ മാതാപിതാക്കൾ[b] അത് അറിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പിന്നിൽ തങ്ങിപ്പോയി.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘അവന്റെ മാതാപിതാക്കൾ.’ ഇവിടെ ലൂക്കോസ് ഉപയോഗിക്കുന്ന സാധാരണ കുടുംബഭാഷ, സുവിശേഷത്തിൽ മുമ്പ് പ്രസ്താവിച്ച കന്യകാഗർഭധാരണത്തെ നിഷേധിക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: ആ ദിവസങ്ങൾ പൂർത്തിയാക്കി
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് മുഖ്യസംഭവത്തിനു മുമ്പ് പൂർത്തിയായ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. ‘ആ ദിവസങ്ങൾ’ എന്നത് സന്ദർഭത്തിലെ ഉത്സവദിവസങ്ങളെ സൂചിപ്പിക്കുമ്പോഴും ഗ്രീക്കിലുള്ളതിലധികം വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: അവർ മടങ്ങുമ്പോൾ
  rationale: ἐν സഹിതമുള്ള ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് സമകാലികമായി നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അതിനെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὑπέμεινεν
  choice: തങ്ങിനിന്നു
  rationale: ഈ സന്ദർഭത്തിൽ ὑπομένω അവിടെത്തന്നെ ശേഷിക്കുക, പിന്നിൽ തങ്ങുക എന്ന അർഥത്തിലാണ്. ‘തങ്ങിനിന്നു’ കഥനത്തിന് യോജിച്ച സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്; സന്ദർഭപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὁ παῖς
  choice: ബാലനായ യേശു
  rationale: παῖς എന്നതിന് കുട്ടി, ബാലൻ, യുവാവ് തുടങ്ങിയ അർഥങ്ങൾ വരാം. സമീപസന്ദർഭത്തിൽ യേശുവിന് പന്ത്രണ്ടു വയസ്സായതിനാൽ ‘ബാലനായ’ എന്നത് പ്രായത്തിനും മലയാളകഥനത്തിനും യോജിക്കുന്നു.
- source_word: ἐν Ἰερουσαλήμ
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമത്തോടുകൂടിയ ἐν എന്നതിന്റെ സാധാരണ സ്ഥാനസൂചക വിവർത്തനം.
- source_word: οὐκ ἔγνωσαν
  choice: അത് അറിഞ്ഞില്ല
  rationale: ഇവിടെ γινώσκω ഒരു കാര്യം അറിയുക അഥവാ മനസ്സിലാക്കുക എന്ന അർഥത്തിലാണ്. യേശു അവിടെ തങ്ങിയെന്ന വസ്തുതയെ ‘അത്’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: അവന്റെ മാതാപിതാക്കൾ
  rationale: γονεῖς എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘മാതാപിതാക്കൾ’ എന്നാണ്; അനാവശ്യമായി വിശദീകരിക്കാതെ ലൂക്കോസിന്റെ കുടുംബഭാഷ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: മറിയയെയും യോസേഫിനെയും യേശുവിന്റെ γονεῖς എന്നു വിളിക്കുന്നത്
  choice: അവന്റെ മാതാപിതാക്കൾ
  alternative: അവന്റെ അപ്പനും അമ്മയും
  rationale: ഗ്രീക്കുപാഠം നേരിട്ട് ‘അവന്റെ മാതാപിതാക്കൾ’ എന്നാണ് പറയുന്നത്. ലൂക്കോസ് മുമ്പ് പ്രസ്താവിച്ച കന്യകാഗർഭധാരണവുമായി ഇതിനെ പരിഭാഷയിൽ ഒത്തുതീർക്കുകയോ മാറ്റിയെഴുതുകയോ ചെയ്യാതെ, സാധാരണ കുടുംബബന്ധഭാഷയിലെ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ കാലബന്ധവും സാധാരണ കുടുംബഭാഷയും നിലനിർത്തി; അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ശരിയായി ചേർത്തു.
