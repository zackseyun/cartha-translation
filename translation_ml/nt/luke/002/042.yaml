  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ ഉറവിടപാഠത്തെപ്പോലെ അവസാനത്തിൽ അൽപവിരാമം നിലനിർത്തി. ‘കയറിപ്പോകവേ’ തീർത്ഥയാത്രയുടെ ദിശാഭാവവും സമകാലിക പ്രവർത്തനവും സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
