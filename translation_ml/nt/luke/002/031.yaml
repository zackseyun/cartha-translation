    text: അഥവാ, “സകല ജനതകളുടെയും മുമ്പിൽ”; എല്ലാവർക്കും കാണാവുന്നവിധം അവരുടെ മുമ്പിൽ വെച്ചിരിക്കുന്നതിനെ ഗ്രീക്ക് ശൈലി സൂചിപ്പിക്കാം.
