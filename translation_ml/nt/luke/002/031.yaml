lexical_decisions:
- source_word: ὃ
  choice: രക്ഷയെ
  rationale: നപുംസക ഏകവചന ബന്ധസർവനാമം മുൻവാക്യത്തിലെ τὸ σωτήριόν (‘രക്ഷ’) എന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധഘടനയ്ക്കായി മുൻപദം ആവർത്തിച്ചിരിക്കുന്നു.
- source_word: ἡτοίμασας
  choice: അങ്ങ് ... ഒരുക്കിയ
  rationale: ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷ ഏകവചന aorist രൂപം. ‘ഒരുക്കിയ’ എന്നത് പൂർത്തിയായ പ്രവൃത്തിയെ ലളിതമായും മാന്യമായും അറിയിക്കുന്നു.
- source_word: κατὰ πρόσωπον
  choice: കൺമുമ്പിൽ
  rationale: ‘മുഖത്തിനു മുമ്പിൽ’ എന്ന പദാനുപദ രൂപത്തേക്കാൾ സ്വാഭാവികമായി, എല്ലാവർക്കും കാണാവുന്നവിധം അവരുടെ മുമ്പിൽ വെച്ചിരിക്കുന്നതെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം നൽകുന്നു.
- source_word: πάντων
  choice: സകല
  rationale: ജനതകളുടെ സമഗ്രമായ വ്യാപ്തി വ്യക്തമാക്കുന്നു; ഗൗരവമുള്ളതും ആധുനിക മലയാളത്തിൽ സുപരിചിതവുമായ രൂപം.
- source_word: τῶν λαῶν
  choice: ജനതകളുടെയും
  rationale: λαοί എന്ന ബഹുവചനം നിലനിർത്തി പല ജനവിഭാഗങ്ങളെയും സൂചിപ്പിക്കുന്നു; അടുത്ത വാക്യത്തിലെ ജാതികളും ഇസ്രായേലും എന്ന വിശദീകരണം മുൻകൂട്ടി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ലൂക്കോസ് 2:32-നോടുള്ള ബന്ധത്തിൽ λαῶν എന്നതിന്റെ വ്യാപ്തി
  choice: ജനതകൾ
  alternative: രാജ്യങ്ങൾ; സകല മനുഷ്യരും
  rationale: ഗ്രീക്കിലെ ബഹുവചനം പല ജനസമൂഹങ്ങളെയും ഉൾക്കൊള്ളുന്നു. ‘ജനതകൾ’ ആ രൂപവും വ്യാപ്തിയും സംരക്ഷിക്കുകയും, അടുത്ത വാക്യം ജാതികളെയും ഇസ്രായേലിനെയും പ്രത്യേകം പറയാൻ ഇടവരുത്തുകയും ചെയ്യുന്നു.
- issue: മുൻവാക്യത്തിൽനിന്നുള്ള ὃ എന്ന ബന്ധസർവനാമത്തിന്റെ അനുബന്ധം
  choice: ‘രക്ഷയെ’ എന്ന് വ്യക്തമായി ആവർത്തിക്കുന്നു
  alternative: ‘അതിനെ’
  rationale: വാക്യം ഒറ്റയ്ക്ക് ഉദ്ധരിക്കുമ്പോഴും അർത്ഥം വ്യക്തമാകാൻ മുൻവാക്യത്തിലെ ‘രക്ഷ’ ആവർത്തിക്കുന്നു; ഇതിലൂടെ പുതിയ വ്യാഖ്യാനം ചേർക്കാതെ വ്യാകരണബന്ധം തുറന്നുകാട്ടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഈ വാക്യം 2:30-ന്റെ തുടർച്ചയായതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നൽകി; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
