  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἐν τῷ εἶναι αὐτοὺς ἐκεῖ ἐπλήσθησαν αἱ ἡμέραι τοῦ τεκεῖν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: ml
  text: അവർ അവിടെ ആയിരിക്കുമ്പോൾ, അവൾ പ്രസവിക്കാനുള്ള ദിവസങ്ങൾ തികഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൾ പ്രസവിക്കാനുള്ള ദിവസങ്ങൾ പൂർത്തിയായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: പ്രത്യേക പദപ്രയോഗമില്ലാതെ വാക്യത്തിന്റെ ആഖ്യാനപ്രവാഹത്തിൽ ഉൾപ്പെടുത്തി
  rationale: ἐγένετο δέ ഇവിടെ ഒരു പ്രത്യേക സംഭവം സൂചിപ്പിക്കുന്നതിലുപരി ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന ഗ്രീക്ക് പ്രയോഗമാണ്. മലയാളത്തിൽ ‘അപ്പോൾ സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് അനാവശ്യമായ ഭാരവും കൃത്രിമത്വവും സൃഷ്ടിക്കും.
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: അവർ അവിടെ ആയിരിക്കുമ്പോൾ
  rationale: ἐν ചേർന്ന articular infinitive ഒരേ സമയത്ത് നടക്കുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം അതിന്റെ കാലസംബന്ധമായ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐπλήσθησαν
  choice: തികഞ്ഞു
  rationale: πίμπλημι എന്ന ക്രിയയുടെ passive രൂപം ദിവസങ്ങൾ പൂർണതയിലെത്തി എന്ന ആശയം നൽകുന്നു. ‘തികഞ്ഞു’ എന്നത് പൂർത്തീകരണഭാവം കാത്തുസൂക്ഷിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളമാണ്.
- source_word: αἱ ἡμέραι
  choice: ദിവസങ്ങൾ
  rationale: ഗ്രീക്കിൽ വ്യക്തമായി ബഹുവചനമായ ‘ദിവസങ്ങൾ’ എന്നാണ്. പൊതുവായ ‘സമയം’ എന്നു ലളിതീകരിക്കാതെ ഉറവിടത്തിലെ രൂപകൽപ്പന നിലനിർത്തുന്നു.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: അവൾ പ്രസവിക്കേണ്ട
  rationale: ഈ genitive articular infinitive പ്രസവവുമായി ബന്ധപ്പെട്ട് ദിവസങ്ങൾ പൂർത്തിയായതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രസവിക്കേണ്ട’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം പ്രകടിപ്പിക്കുന്നു; പ്രസവത്തിന്റെ സമയമെത്തിയെന്ന ആശയം അനാവശ്യ വിശദീകരണമില്ലാതെ നൽകുന്നു.
theological_decisions:
- issue: ἐπλήσθησαν αἱ ἡμέραι എന്നതിൽ ദൈവികമായി നിശ്ചയിക്കപ്പെട്ട സമയമോ നിവൃത്തിയോ സൂചിപ്പിക്കുന്നുണ്ടാകാമെന്ന സാധ്യത
  choice: ‘ദിവസങ്ങൾ തികഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘അവൾ പ്രസവിക്കാനുള്ള സമയം വന്നു’
  rationale: ഈ വാക്യം ആദ്യം സൂചിപ്പിക്കുന്നത് ഗർഭകാലം പൂർത്തിയായി പ്രസവസമയം എത്തിയെന്നാണ്. അതേസമയം ലൂക്കോസിന്റെ ‘നിറയുക/തികയുക’ എന്ന ഭാഷയിൽ കേൾക്കാവുന്ന നിവൃത്തിയുടെ സൂക്ഷ്മധ്വനി പൂർണമായി ഇല്ലാതാക്കാതെ, വ്യക്തമായ ദൈവശാസ്ത്രവാദം കൂട്ടിച്ചേർക്കാതെയും ‘തികഞ്ഞു’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ കാലസംബന്ധവും ‘ദിവസങ്ങൾ തികഞ്ഞു’ എന്ന പൂർത്തീകരണഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
