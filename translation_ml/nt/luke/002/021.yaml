source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: ml
  text: അവനെ പരിച്ഛേദന ചെയ്യാനുള്ള എട്ടു ദിവസം പൂർത്തിയായപ്പോൾ[a], അവന് യേശു എന്നു പേരിട്ടു[b]. അവൻ ഗർഭത്തിൽ ധരിക്കപ്പെടുന്നതിനുമുമ്പ് ദൂതൻ അറിയിച്ച പേരായിരുന്നു അത്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ പരിച്ഛേദന ചെയ്യാനുള്ള എട്ടു ദിവസം പൂർത്തിയായപ്പോൾ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവന്റെ പേര് യേശു എന്നു വിളിക്കപ്പെട്ടു.”
    reason: lexical_alternative
  - marker: c
    text: അതായത്, മറിയയുടെ ഗർഭത്തിൽ അവൻ ധരിക്കപ്പെടുന്നതിനുമുമ്പ്; കാണുക ലൂക്കോസ് 1:31.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν
  choice: അവനെ പരിച്ഛേദന ചെയ്യേണ്ട എട്ടാം ദിവസം വന്നപ്പോൾ
  rationale: ഗ്രീക്കിലെ കാലപൂർത്തിയാകലും പരിച്ഛേദനയ്ക്കുള്ള നിർദിഷ്ട സമയവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘എട്ടു ദിവസം പൂർത്തിയായപ്പോൾ’ എന്ന കൂടുതൽ രൂപാനുസൃതമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: അവന് യേശു എന്നു പേരിട്ടു
  rationale: പേര് നൽകുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിലെ passive expression-ന്റെ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: പുതിയനിയമത്തിലെ വ്യക്തിനാമത്തിന്റെ പ്രമാണമായ മലയാളരൂപം ഉപയോഗിക്കുന്നു.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: ദൂതൻ പറഞ്ഞ പേരായിരുന്നു അത്
  rationale: κληθέν എന്ന ആവർത്തിച്ച ക്രിയയുടെ പേരിനെ സംബന്ധിച്ച അർഥം നിലനിർത്തിക്കൊണ്ട്, മുൻപ് അറിയിക്കപ്പെട്ട പേര് എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പേരിട്ട’ എന്നു ആവർത്തിച്ച് ദൂതനാണ് പേരിടൽച്ചടങ്ങ് നടത്തിയതെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ
  choice: അവൻ ഗർഭത്തിൽ ഉരുവാകുന്നതിനുമുമ്പ്
  rationale: συλλαμβάνω ഇവിടെ ഗർഭധാരണത്തെ സൂചിപ്പിക്കുന്നു. ‘ഗർഭത്തിൽ ഉരുവാകുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്; മൂലത്തിൽ ഇല്ലാത്ത സിദ്ധാന്തപരമായ പദപ്രയോഗം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ ഗർഭധാരണത്തെ സൂചിപ്പിക്കുന്ന വാക്യഭാഗം
  choice: അവൻ ഗർഭത്തിൽ ഉരുവാകുന്നതിനുമുമ്പ്
  alternative: അവൻ ഗർഭത്തിൽ ധരിക്കപ്പെടുന്നതിനുമുമ്പ്
  rationale: വാക്യം യേശുവിന്റെ മനുഷ്യഗർഭധാരണത്തിനു മുമ്പ് പേര് അറിയിക്കപ്പെട്ടതെന്ന ചരിത്രവിവരം മാത്രം പറയുന്നു. മലയാളത്തിലെ അവ്യക്തമോ അസ്വാഭാവികമോ ആയ passive ഒഴിവാക്കി, പിന്നീടുള്ള സിദ്ധാന്തപരമായ വ്യാഖ്യാനം ചേർക്കാതെ മൂലാർത്ഥം നൽകുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘പരിച്ഛേദന’ എന്ന സ്ഥാപിത ബൈബിൾപദം കൃത്യതയ്ക്കായി നിലനിർത്തി. മുഖ്യവാചകത്തിൽ സ്വാഭാവിക മലയാളക്രമം സ്വീകരിക്കുകയും, കൂടുതൽ രൂപാനുസൃതമായ ഗ്രീക്ക് പ്രയോഗങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകുകയും ചെയ്തു.
