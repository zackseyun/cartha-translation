id: LUK.2.24
reference: Luke 2:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: ml
  text: കൂടാതെ, കർത്താവിന്റെ ന്യായപ്രമാണത്തിൽ പറഞ്ഞിരിക്കുന്നതനുസരിച്ച്[a], ഒരു ജോടി കുറുപ്രാവുകളെയോ രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങളെയോ യാഗമായി അർപ്പിക്കാനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കർത്താവിന്റെ ന്യായപ്രമാണത്തിൽ പറയപ്പെട്ടിരുന്നതനുസരിച്ച്.”
    reason: The perfect passive participle εἰρημένον may be rendered as what ‘has been stated’ or, in contextual English/Malayalam past reference, what ‘had been stated.’
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: യാഗമായി അർപ്പിക്കാനും
  rationale: δίδωμι എന്നതിന്റെ അക്ഷരാർഥം ‘കൊടുക്കുക’ എന്നാണെങ്കിലും θυσίαയോടൊപ്പം ഇവിടെ യാഗം അർപ്പിക്കുക എന്ന ഉദ്ദേശ്യമാണ്. മലയാളത്തിൽ ‘യാഗമായി അർപ്പിക്കുക’ സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: κατὰ τὸ εἰρημένον
  choice: അരുളിച്ചെയ്തിരിക്കുന്നതനുസരിച്ച്
  rationale: perfect passive participle, മുമ്പ് പറയപ്പെട്ടതും ഇപ്പോഴും പ്രാബല്യത്തിൽ നിൽക്കുന്നതുമായ വചനത്തെ സൂചിപ്പിക്കുന്നു. ദൈവിക നിയമത്തിന്റെ സന്ദർഭത്തിൽ ‘അരുളിച്ചെയ്തിരിക്കുന്ന’ എന്നത് മാന്യവും സ്വാഭാവികവുമാണ്; ‘നിർദേശിച്ച’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: കർത്താവിന്റെ ന്യായപ്രമാണത്തിൽ
  rationale: νόμος ഇവിടെ മോശെയുടെ ദൈവിക നിയമത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ ഭാഷയിൽ തിരിച്ചറിയാവുന്ന ‘ന്യായപ്രമാണം’ നിലനിർത്തുന്നു. κύριος ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ζεῦγος τρυγόνων
  choice: ഒരു ജോടി കുറുപ്രാവുകൾ
  rationale: ζεῦγος പക്ഷികളുടെ ഒരു ജോടിയെ സൂചിപ്പിക്കുന്നു. τρυγών സാധാരണ പ്രാവല്ല, turtledove എന്ന പ്രത്യേക പക്ഷിയാണ്; അതിനാൽ ‘കുറുപ്രാവ്’ ഉപയോഗിച്ചു.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: രണ്ടു പ്രാവിൻകുഞ്ഞുങ്ങൾ
  rationale: νοσσός ഇളം പക്ഷിയെയോ കുഞ്ഞിനെയോ സൂചിപ്പിക്കുന്നു; περιστερά പ്രാവാണ്. ‘പ്രാവിൻകുഞ്ഞുങ്ങൾ’ കൃത്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
theological_decisions:
- issue: തിരുവെഴുത്തിലെ നിയമസൂത്രത്തിൽ κύριος എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യഹോവ / നാഥൻ
  rationale: ഗ്രീക്ക് പാഠത്തിൽ κύριος ആണ്; പുതിയനിയമത്തിലെ പതിവനുസരിച്ച് ‘കർത്താവ്’ നിലനിർത്തുന്നു. പിന്നിലുള്ള എബ്രായ ദൈവനാമം അനുമാനിച്ച് പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിലെ യാത്രാ ഉദ്ദേശ്യങ്ങളുടെ തുടർച്ചയായതിനാൽ സ്വതന്ത്ര മലയാളവാക്യമായി വ്യക്തത ലഭിക്കാൻ ‘അവർ വന്നു’ ചേർത്തിരിക്കുന്നു; ഗ്രീക്കിലെ purpose infinitive-ന്റെ ബന്ധം ഇതിലൂടെ പ്രകടമാകുന്നു. ഉദ്ധരണിചിഹ്നങ്ങൾ നിയമത്തിലെ ബലിയർപ്പണവാക്യം തിരിച്ചറിയാൻ സഹായിക്കുന്നു.
