id: LUK.2.9
reference: Luke 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: ml
  text: കർത്താവിന്റെ ഒരു ദൂതൻ അവരുടെ സമീപത്തു വന്നു നിന്നു[a], കർത്താവിന്റെ തേജസ്സ് അവർക്കുചുറ്റും പ്രകാശിച്ചു, അവർ അത്യന്തം ഭയപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ അരികിൽ നിന്നു’ എന്നും ‘അവരുടെ അടുത്തെത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ അടുത്തുനിൽക്കുന്നതിനോടൊപ്പം പെട്ടെന്നുള്ള സാന്നിധ്യവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവർ വലിയൊരു ഭയം ഭയപ്പെട്ടു.’ ഭയത്തിന്റെ തീവ്രത ഊന്നിപ്പറയുന്ന ഗ്രീക്ക് പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: കർത്താവിന്റെ ഒരു ദൂതൻ
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ ἄγγελος സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിൽ നിർദേശക ഉപപദമില്ലാത്തതിനാൽ ‘ഒരു ദൂതൻ’ എന്ന് സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἐπέστη αὐτοῖς
  choice: പെട്ടെന്ന് അവരുടെ അരികിൽ വന്നുനിന്നു
  rationale: ἐφίστημι എന്ന ക്രിയയ്ക്ക് അടുത്തുവന്നു നിൽക്കുക, അരികിൽ നിൽക്കുക, പെട്ടെന്ന് സന്നിഹിതനാകുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ഈ പരിഭാഷ പെട്ടെന്നുള്ള സാന്നിധ്യവും അടുത്തുനിൽക്കുന്നതും ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: δόξα κυρίου
  choice: കർത്താവിന്റെ തേജസ്സ്
  rationale: δόξα ഇവിടെ ദൈവിക മഹത്ത്വത്തോടൊപ്പം ദൃശ്യമായ പ്രഭയെയും സൂചിപ്പിക്കുന്നു; ‘തേജസ്സ്’ ഈ രണ്ടും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: περιέλαμψεν αὐτούς
  choice: അവർക്കുചുറ്റും പ്രകാശിച്ചു
  rationale: περιλάμπω ചുറ്റും പ്രകാശിക്കുക അഥവാ വെളിച്ചത്താൽ ചുറ്റിപ്പൊതിയുക എന്നാണ്; തെരഞ്ഞെടുത്ത രൂപം ഗ്രീക്കിനോട് അടുത്തും ആധുനിക മലയാളത്തിൽ വ്യക്തവുമാണ്.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: അവർ അത്യന്തം ഭയപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ സമാനധാതുവുള്ള ക്രിയ-നാമ ആവർത്തനം ഭയത്തിന്റെ തീവ്രത വർധിപ്പിക്കുന്ന പ്രയോഗമാണ്. അക്ഷരാർഥത്തിലുള്ള ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ അതിന്റെ ഊന്നൽ ‘അത്യന്തം’ എന്നതിലൂടെ പകർന്നു.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന് മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണ ക്രൈസ്തവ ഉപയോഗത്തിലും വ്യക്തവും ഗൗരവമുള്ളതുമായ സമാനപദം ‘കർത്താവ്’ ആണ്.
theological_decisions:
- issue: ദൈവത്തെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: ഈ സന്ദർഭത്തിൽ പരാമർശം ദൈവത്തെയാണ്. ‘കർത്താവ്’ എന്നത് പദത്തിന്റെ ദൈവികവും അധികാരസൂചകവുമായ ഭാവം സംരക്ഷിക്കുന്നു; ‘യജമാനൻ’ ഇവിടെ അനാവശ്യമായി മാനുഷികബന്ധത്തെ മുൻനിർത്തും.
- issue: δόξα എന്നതിലെ ദൈവിക മഹത്ത്വവും ദൃശ്യപ്രഭയും
  choice: തേജസ്സ്
  alternative: മഹത്ത്വം / പ്രഭ
  rationale: സംഭവത്തിൽ അത് ചുറ്റും പ്രകാശിക്കുന്നതായി പറയുന്നതിനാൽ ദൃശ്യപ്രഭ പ്രസക്തമാണ്; അതേസമയം ‘തേജസ്സ്’ ദൈവിക മഹത്ത്വത്തിന്റെ ആശയവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘വന്നുനിന്നു’ എന്ന രൂപം ദൃശ്യമായ സംഭവസ്വഭാവം കാത്തുസൂക്ഷിക്കുന്നു; അവസാന വാക്യം ഗ്രീക്ക് പ്രയോഗത്തിന്റെ തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
