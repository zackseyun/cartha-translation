  naturalness: ‘അവരുടെ സമീപത്തു വന്നു നിന്നു’ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘പെട്ടെന്ന് ... വന്നുനിന്നു’ എന്നതിലെ അനാവശ്യമായ വ്യാഖ്യാനഭാരം ഇതിലൂടെ ഒഴിവാകുന്നു. ഗ്രീക്ക് ഏകവാക്യത്തിന്റെ ബന്ധം നിലനിർത്താൻ സംയോജകങ്ങളോടെ ഒരു വാക്യമായി നൽകുന്നു.
