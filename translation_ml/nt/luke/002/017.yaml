  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: ml
  text: അവർ കണ്ടശേഷം, ഈ ശിശുവിനെക്കുറിച്ച് തങ്ങളോടു പറഞ്ഞിരുന്ന സന്ദേശം അവർ അറിയിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വാക്ക്’ അല്ലെങ്കിൽ ‘തങ്ങളോടു പറഞ്ഞിരുന്ന കാര്യം’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: അവർ കണ്ടശേഷം
  rationale: ὁράω എന്ന ക്രിയയുടെ aorist participle മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മൂലത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലും അത് ചേർക്കാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: വാക്യക്രമത്തിലൂടെ സൂചിപ്പിച്ചു; പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ പ്രത്യേകം ‘എന്നാൽ’ ചേർത്താൽ അനാവശ്യമായ വൈരുധ്യം തോന്നാം.
- source_word: ἐγνώρισαν
  choice: അവർ മറ്റുള്ളവരെ അറിയിച്ചു
  rationale: γνωρίζω എന്നത് അറിയിക്കുക, വെളിപ്പെടുത്തുക എന്ന അർഥം നൽകുന്നു. ആരെയാണ് അറിയിച്ചതെന്ന് മൂലത്തിൽ വ്യക്തമല്ലെങ്കിലും, ‘അറിയിച്ചു’ എന്ന മലയാളക്രിയയ്ക്ക് സ്വാഭാവികതയ്ക്കായി ‘മറ്റുള്ളവരെ’ ചേർത്തിരിക്കുന്നു; ഇത് പൊതുവായ, നിർവചനാതീതമായ സൂചനയാണ്.
- source_word: περὶ τοῦ ῥήματος
  choice: സന്ദേശം[a]
  rationale: ῥῆμα ഇവിടെ ഈ ശിശുവിനെക്കുറിച്ച് ഇടയന്മാരോടു പറയപ്പെട്ട വാക്കിന്റെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു. ‘സന്ദേശം’ ആ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വാക്ക്’, ‘പറഞ്ഞ കാര്യം’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: തങ്ങളോടു പറഞ്ഞിരുന്ന
  rationale: ആർ പറഞ്ഞുവെന്ന് ഈ വാക്യത്തിൽ ആവർത്തിക്കാതെ, passive participle-ന്റെ അർഥവും മുമ്പ് നടന്ന പ്രവൃത്തിയും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: ഈ ശിശുവിനെക്കുറിച്ച്
  rationale: παιδίον ഇവിടെ നവജാതനായ യേശുവിനെ സൂചിപ്പിക്കുന്നു. ‘ശിശു’ പ്രസംഗസന്ദർഭത്തിനു യോജിച്ചതും ആധുനിക മലയാളത്തിൽ വ്യക്തവുമാണ്.
theological_decisions:
- issue: ദൂതൻ അറിയിച്ച കാര്യത്തോടു ബന്ധപ്പെടുത്തി ῥῆμα പരിഭാഷപ്പെടുത്തൽ
  choice: സന്ദേശം
  alternative: വാക്ക്; പറഞ്ഞ കാര്യം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് ശിശുവിനെക്കുറിച്ച് ഇടയന്മാരോടു മുമ്പ് അറിയിച്ച ഉള്ളടക്കമാണ്. ‘സന്ദേശം’ അതിനെ വ്യക്തമായി നൽകുന്നു; എന്നാൽ ῥῆμα എന്ന പദത്തിന്റെ ‘വാക്ക്/പറഞ്ഞ കാര്യം’ എന്ന വ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ അപ്രകടമായ കർമം ‘അവർ കണ്ടശേഷം’ എന്നിടത്ത് പൂരിപ്പിച്ചിട്ടില്ല. ‘അവർ മറ്റുള്ളവരെ അറിയിച്ചു’ എന്നത് മലയാളത്തിലെ ക്രിയാപ്രയോഗത്തിന്റെ സ്വാഭാവികതയ്ക്കായുള്ള പരിമിതമായ വ്യക്തീകരണമാണ്.
