id: LUK.2.13
reference: Luke 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: ml
  text: 'പെട്ടെന്ന്, ആ ദൂതനോടൊപ്പം സ്വർഗീയ സൈന്യത്തിന്റെ വലിയൊരു സംഘം ഉണ്ടായി. അവർ ദൈവത്തെ സ്തുതിച്ചുകൊണ്ട് ഇങ്ങനെ പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαίφνης
  choice: പെട്ടെന്ന്
  rationale: സംഭവത്തിന്റെ അപ്രതീക്ഷിതത്വവും ആഖ്യാനത്തിലെ വിസ്മയവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐγένετο
  choice: പ്രത്യക്ഷപ്പെട്ടു
  rationale: ഇവിടെ സ്വർഗീയ സമൂഹം രംഗത്ത് വന്നതിനെ സൂചിപ്പിക്കുന്ന അസ്തിത്വപരമായ പ്രയോഗമാണ്; മലയാളത്തിൽ വെറും ‘ഉണ്ടായി’ എന്നതിനെക്കാൾ സന്ദർഭസഹജമാണ്, എന്നാൽ ദർശനത്തിന്റെ സ്വഭാവത്തെ കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: ആ ദൂതനോടൊപ്പം
  rationale: σύν + ദത്തിവിന്റെ സഹചാരാർഥം നേരിട്ട് നൽകുന്നു; നിർദിഷ്ട ആർട്ടിക്കിൾ മുൻവാക്യത്തിൽ പരാമർശിച്ച ദൂതനെ സൂചിപ്പിക്കുന്നു.
- source_word: πλῆθος
  choice: ഒരു വലിയ സമൂഹം
  rationale: വലിയ എണ്ണത്തെ സൂചിപ്പിക്കുന്ന πλῆθος എന്ന പദത്തിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘ജനക്കൂട്ടം’ എന്ന മനുഷ്യകേന്ദ്രിത ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: στρατιᾶς οὐρανίου
  choice: സ്വർഗീയ സൈന്യത്തിന്റെ
  rationale: ‘സൈന്യം’ στρατιάയിലെ സൈനിക രൂപകം നിലനിർത്തുന്നു; ‘സ്വർഗീയ’ എന്നത് οὐρανίουയുടെ ആകാശീയ/സ്വർഗീയ സൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αἰνούντων τὸν θεὸν
  choice: അവർ ദൈവത്തെ സ്തുതിച്ചുകൊണ്ട്
  rationale: ബഹുവചന കർത്തൃസൂചന മലയാളത്തിൽ വ്യക്തമാക്കുകയും വർത്തമാന കൃദന്തരൂപത്തിന്റെ സമകാലിക പ്രവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: καὶ λεγόντων
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയെ സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്നു; καίയുടെ ബന്ധവും λέγωയുടെ വാക്കുപറയൽ അർഥവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: στρατιᾶς οὐρανίου എന്നതിലെ സൈനിക രൂപകം
  choice: സ്വർഗീയ സൈന്യം
  alternative: സ്വർഗീയ ഗണം; സ്വർഗത്തിന്റെ സൈന്യം
  rationale: സന്ദർഭത്തിൽ ഇവർ യുദ്ധം ചെയ്യാതെ ദൈവത്തെ സ്തുതിക്കുന്നുവെങ്കിലും, στρατιάയിലെ ക്രമബദ്ധമായ സൈന്യത്തിന്റെ രൂപകം മായ്ച്ചുകളയരുത്. ‘സ്വർഗീയ സൈന്യം’ ആ ദ്വന്ദ്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ‘സ്വർഗീയ സൈന്യം’ എന്ന രൂപം മൂലപാഠത്തിലെ സൈനിക ദൃശ്യഭാവം നിലനിർത്തുന്നു; വാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള ഉദ്ധരണിയിലേക്കു സ്വാഭാവികമായി നയിക്കുന്നു.
