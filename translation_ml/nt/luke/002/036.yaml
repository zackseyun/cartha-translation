id: LUK.2.36
reference: Luke 2:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: ml
  text: അന്ന എന്നൊരു പ്രവാചികയും ഉണ്ടായിരുന്നു. അവൾ ഫനൂവേലിന്റെ മകളും ആശേർ ഗോത്രത്തിൽപ്പെട്ടവളുമായിരുന്നു. അവൾ വളരെ പ്രായം ചെന്നവളായിരുന്നു[a]. കന്യകാത്വകാലം കഴിഞ്ഞ് ഭർത്താവിനോടൊപ്പം ഏഴു വർഷം ജീവിച്ചവളായിരുന്നു അവൾ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അനേകം ദിവസങ്ങളിൽ മുന്നേറിയവൾ’; ഇത് വളരെ പ്രായം ചെന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലിയാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘തന്റെ കന്യകാത്വംമുതൽ ഭർത്താവിനോടൊപ്പം ഏഴു വർഷം ജീവിച്ചവൾ’; അതായത്, കന്യകാത്വകാലം അവസാനിച്ച് വിവാഹിതയായശേഷം ഏഴു വർഷം ഭർത്താവിനൊപ്പം ജീവിച്ചു.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: പ്രവാചിക
  rationale: സ്ത്രീലിംഗത്തിലുള്ള ഗ്രീക്ക് നാമത്തിന്റെ അർഥവും ലിംഗസൂചനയും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θυγάτηρ Φανουήλ
  choice: ഫനൂവേലിന്റെ മകൾ
  rationale: വംശപരമായ ഈ തിരിച്ചറിയൽ മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: ആശേർ ഗോത്രത്തിൽപ്പെട്ടവൾ
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഗോത്രബന്ധവും ഉത്ഭവവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: വളരെ പ്രായം ചെന്നവൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അനേകം ദിവസങ്ങളിൽ മുന്നേറിയവൾ’ എന്ന ഗ്രീക്ക് വാർധക്യശൈലി ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു; ഉറവിടശൈലി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ζήσασα μετὰ ἀνδρὸς
  choice: ഭർത്താവിനോടൊപ്പം ജീവിച്ചവൾ
  rationale: ഇവിടെ ἀνήρ വിവാഹബന്ധത്തിലെ ഭർത്താവിനെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും സഹവാസമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἔτη ἑπτὰ
  choice: ഏഴു വർഷം
  rationale: കാലദൈർഘ്യം നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: കന്യകാത്വകാലം കഴിഞ്ഞ്
  rationale: വിവാഹത്തോടെ കന്യകാത്വകാലം അവസാനിച്ചതിനുശേഷമുള്ള ഏഴു വർഷത്തെ ദാമ്പത്യജീവിതമാണ് ഉദ്ദേശിക്കുന്നതെന്ന സ്വാഭാവിക അർഥം നൽകുന്നു; ഗ്രീക്കിലെ കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്നയുടെ προφῆτις എന്ന പദവി
  choice: അന്നയെ ‘പ്രവാചിക’ എന്നു വ്യക്തമായി വിശേഷിപ്പിക്കുന്നു.
  alternative: ഇത് ഒരു ബഹുമാനപദമായോ പൊതുവായ ഭക്തസ്ത്രീ എന്നോ ദുർബലപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം സ്ത്രീലിംഗത്തിലുള്ള സാധാരണ ‘പ്രവാചകൻ’ എന്ന പദം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിന്റെ വ്യക്തമായ അവകാശവാദം വിവർത്തനത്തിൽ നിലനിർത്തണം.
- issue: അന്നയുടെ പ്രായവിവരണം
  choice: മുഖ്യപാഠത്തിൽ ‘വളരെ പ്രായം ചെന്നവൾ’ എന്നും അക്ഷരാർഥശൈലി അടിക്കുറിപ്പിലും നൽകുന്നു.
  alternative: ‘അനേകം ദിവസങ്ങളിൽ മുന്നേറിയവൾ’ എന്ന് അക്ഷരാർഥത്തിൽ മാത്രം നൽകുക, അല്ലെങ്കിൽ അടുത്ത വാക്യത്തിലെ കാലഗണന ഇവിടെ ചേർക്കുക.
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം വാർധക്യമാണ്; അടുത്ത വാക്യത്തിലെ വിവരങ്ങൾ ഇവിടെ ഇറക്കുമതി ചെയ്യാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- issue: ἀπὸ τῆς παρθενίας αὐτῆς എന്ന കാലസൂചന
  choice: കന്യകാത്വകാലം കഴിഞ്ഞുള്ള ഏഴു വർഷത്തെ ദാമ്പത്യജീവിതമായി മുഖ്യപാഠത്തിൽ നൽകുന്നു; ഉറവിടഘടന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘തന്റെ കന്യകാത്വംമുതൽ’ എന്ന് അക്ഷരാർഥത്തിൽ നൽകുക.
  rationale: അക്ഷരാർഥരൂപം മലയാളത്തിൽ അവൾ കന്യകയായിരിക്കെ ഭർത്താവിനൊപ്പം ജീവിച്ചു എന്ന തെറ്റായ ധാരണ ഉണ്ടാക്കാം. എന്നാൽ ഉറവിടത്തിലെ സംക്ഷിപ്തതയും വ്യാഖ്യാനസാധ്യതയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ‘പ്രവാചിക’, ‘ഗോത്രം’, ‘കന്യകാത്വകാലം’ എന്നീ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച പദങ്ങൾ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ [a] തെറ്റായി ‘prophetess’ എന്നതിനുശേഷം പ്രത്യക്ഷപ്പെട്ടിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം പ്രായവിവരണത്തെയാണ് സംബന്ധിക്കുന്നത്; അതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ [a] ശരിയായ പ്രായവിവരണത്തിനു ശേഷം ചേർത്തു.
