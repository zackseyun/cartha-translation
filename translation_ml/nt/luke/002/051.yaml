revisions:
- from: അവൻ അവരോടൊപ്പം ഇറങ്ങി നസറെത്തിൽ വന്നു; അവർക്കു കീഴടങ്ങി ജീവിച്ചുപോന്നു. അവന്റെ അമ്മ ഈ കാര്യങ്ങളെല്ലാം[a] തന്റെ ഹൃദയത്തിൽ സൂക്ഷിച്ചുവച്ചു.
  to: അവൻ അവരോടൊപ്പം ഇറങ്ങി നസറെത്തിൽ എത്തി; അവർക്കു വിധേയനായിരുന്നു. അവന്റെ അമ്മ ഈ കാര്യങ്ങളെല്ലാം[a] തന്റെ ഹൃദയത്തിൽ സൂക്ഷിച്ചുവച്ചു.
  rationale: The revision replaces a Malayalam expression that can imply surrender with the standard expression for ongoing subjection or obedience, preserving the sense of the Greek imperfect periphrastic construction without doctrinal expansion. It also uses a more idiomatic verb for arriving in Nazareth. No change is needed to the carefully-retained wording for Mary’s remembrance or to its footnote.
