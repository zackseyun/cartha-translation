source:
  edition: SBLGNT
  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: ml
  text: അവൻ അവരോടൊപ്പം ഇറങ്ങി നസറെത്തിൽ എത്തി; അവർക്കു വിധേയനായിരുന്നു. അവന്റെ അമ്മ ഈ കാര്യങ്ങളെല്ലാം[a] തന്റെ ഹൃദയത്തിൽ സൂക്ഷിച്ചുവച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ വാക്കുകളെല്ലാം” അല്ലെങ്കിൽ “ഈ വചനങ്ങളെല്ലാം.” ῥήματα എന്ന ഗ്രീക്ക് പദം സംസാരിക്കപ്പെട്ട വാക്കുകളെയോ അവ സൂചിപ്പിക്കുന്ന കാര്യങ്ങളെയോ അർത്ഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: ഇറങ്ങി
  rationale: യെരൂശലേമിൽനിന്ന് നസറെത്തിലേക്കുള്ള ഭൂപ്രകൃതിപരമായ താഴോട്ടുള്ള യാത്രയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: μετ’ αὐτῶν
  choice: അവരോടൊപ്പം
  rationale: മറിയയോടും യോസേഫിനോടുമുള്ള ലളിതമായ സഹയാത്രയെ ഗ്രീക്കിനൊത്ത സംക്ഷിപ്തതയിൽ നൽകുന്നു.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: നസറെത്തിൽ വന്നു
  rationale: കഥനത്തിന്റെ ദൃഷ്ടികോണത്തിൽ ἔρχομαι എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം; യാത്രയുടെ ലക്ഷ്യസ്ഥാനം വ്യക്തമാണ്.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: അവർക്കു കീഴടങ്ങി ജീവിച്ചുപോന്നു
  rationale: അപൂർണകാല സഹായക്രിയയും വർത്തമാനകൃതന്തവും ചേർന്ന പ്രയോഗത്തിലെ തുടർച്ചയായ കീഴടങ്ങലും അനുസരണവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വെറും നിലയെന്നതിലുപരി തുടരുന്ന ജീവിതരീതിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: διετήρει
  choice: സൂക്ഷിച്ചുവച്ചു
  rationale: ശ്രദ്ധയോടെ നിലനിർത്തുകയും മറക്കാതെ സൂക്ഷിക്കുകയും ചെയ്യുക എന്ന διατηρέωയുടെ അർത്ഥം സന്ദർഭാനുസൃതമായി നൽകുന്നു; വ്യാഖ്യാനാത്മകമായ ‘നിധിപോലെ കരുതി’ എന്ന പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: ഈ കാര്യങ്ങളെല്ലാം
  rationale: ഇവിടെ ῥήματα സംസാരിക്കപ്പെട്ട വാക്കുകളെയും അവ സൂചിപ്പിക്കുന്ന സംഭവങ്ങളെയോ കാര്യങ്ങളെയോ ഉൾക്കൊള്ളാം. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ വിശാല അർത്ഥം നിലനിർത്തുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: തന്റെ ഹൃദയത്തിൽ
  rationale: അന്തരംഗമായ ഓർമ്മയുടെയും ചിന്തയുടെയും ബൈബിൾപ്രയോഗം പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു; പ്രതിപാദ്യം മറിയയായതിനാൽ മലയാളത്തിൽ ‘തന്റെ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ഭൗമിക മാതാപിതാക്കളോടുള്ള യേശുവിന്റെ ബന്ധം
  choice: അവർക്കു കീഴടങ്ങി ജീവിച്ചുപോന്നു
  alternative: അവർക്കു വിധേയനായിരുന്നു
  rationale: യേശു മറിയയോടും യോസേഫിനോടും തുടർച്ചയായി കീഴടങ്ങി അനുസരിച്ചിരുന്നുവെന്ന് ഗ്രീക്ക് നേരിട്ട് പറയുന്നു. ക്രിസ്തുവിന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള പിൽക്കാല വിശദീകരണം ചേർക്കാതെയും ഈ പ്രസ്താവനയുടെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം ഇല്ലാതാക്കാതെയും അതിന്റെ സജീവവും തുടരുന്നതുമായ സ്വഭാവം പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘ജീവിച്ചുപോന്നു’ തുടർച്ചയായ പ്രവൃത്തിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘ഹൃദയത്തിൽ’ എന്ന ബൈബിൾപ്രയോഗം അതേപടി നിലനിർത്തിയിരിക്കുന്നു.
