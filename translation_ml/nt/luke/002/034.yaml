id: LUK.2.34
reference: Luke 2:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: ml
  text: 'ശിമെയോൻ അവരെ അനുഗ്രഹിച്ചിട്ട് അവന്റെ അമ്മയായ മറിയയോടു പറഞ്ഞു: “ഇതാ, ഇസ്രായേലിലെ പലരുടെയും വീഴ്ചയ്ക്കും എഴുന്നേൽപ്പിനും, എതിർക്കപ്പെടുന്ന ഒരു അടയാളമായിരിക്കാനും ഇവൻ നിയോഗിക്കപ്പെട്ടിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മൂലഭാഷയിൽ: “എതിരായി സംസാരിക്കപ്പെടുന്ന.”'
    reason: ἀντιλεγόμενον എന്ന പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം നൽകി, ‘എതിർക്കപ്പെടുന്ന’ എന്ന പ്രധാനപാഠ പരിഭാഷയ്ക്കു പിന്നിലെ വാചിക എതിർപ്പിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὗτος κεῖται
  choice: ഇവൻ നിയോഗിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: κεῖται എന്നതിന്റെ അക്ഷരാർഥം ‘വെക്കപ്പെട്ടിരിക്കുന്നു’ എന്നാണെങ്കിലും, ഇവിടെ ഒരാൾക്കായി നിശ്ചയിക്കപ്പെട്ട പങ്കിനെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിയോഗിക്കപ്പെട്ടിരിക്കുന്നു’ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: വീഴ്ചയ്ക്കും എഴുന്നേൽപ്പിനും
  rationale: വീഴ്ചയും വീണ്ടും എഴുന്നേൽക്കലും തമ്മിലുള്ള മൂലപാഠത്തിലെ സമാന്തരതയും ദൈവശാസ്ത്രപരമായ തുറന്ന അർഥവും നിലനിർത്തുന്നു; ‘ഉയർച്ച’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: σημεῖον ἀντιλεγόμενον
  choice: എതിർക്കപ്പെടുന്ന ഒരു അടയാളം
  rationale: σημεῖον എന്നത് ‘അടയാളം’ എന്നും ἀντιλεγόμενον എന്ന വർത്തമാന കർമണി കൃദന്തം തുടർച്ചയായ എതിർപ്പിന് വിധേയമാകുന്നതെന്നും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘വീഴ്ചയും എഴുന്നേൽപ്പും’ ഒരേ ആളുകളെയാണോ വ്യത്യസ്ത വിഭാഗങ്ങളെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: പലരുടെയും വീഴ്ചയ്ക്കും എഴുന്നേൽപ്പിനും
  alternative: പലരുടെ വീഴ്ചയ്ക്കും മറ്റുപലരുടെ ഉയിർത്തെഴുന്നേൽപ്പിനും
  rationale: ഗ്രീക്ക് വാക്യം ഈ ബന്ധം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ആളുകളെ രണ്ട് വിഭാഗങ്ങളാക്കി വിഭജിക്കാതെയും ‘എഴുന്നേൽപ്പ്’ ശരീരപുനരുത്ഥാനം മാത്രമാണെന്ന് നിർണ്ണയിക്കാതെയും മൂലപാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: κεῖται ദൈവിക നിയമനമാണോ വിധിനിർണ്ണയമാണോ
  choice: നിയോഗിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: വെക്കപ്പെട്ടിരിക്കുന്നു / വിധിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: സന്ദർഭത്തിലെ ലക്ഷ്യബോധം വ്യക്തമാക്കുന്നു; എന്നാൽ ‘വിധിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നതിലൂടെ കർശനമായ മുൻനിർണ്ണയ സിദ്ധാന്തം പാഠത്തിലേക്ക് ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ശൈലി. ‘ഇതാ’ എന്നത് മൂലപാഠത്തിലെ ശ്രദ്ധാകർഷണം നിലനിർത്തുന്നു; ‘എഴുന്നേൽപ്പ്’ എന്നത് ἀνάστασις എന്ന പദത്തിന്റെ രൂപകാത്മകവും പുനരുത്ഥാനസംബന്ധവുമായ സാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു. സർവനാമബന്ധം ആശയക്കുഴപ്പമില്ലാതെ സൂചിപ്പിക്കാൻ ‘അവന്റെ അമ്മയായ മറിയ’ ഉപയോഗിച്ചു.
