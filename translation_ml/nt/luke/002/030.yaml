lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ ശിമെയോൻ സമാധാനത്തോടെ വിടുവിക്കപ്പെടുന്നതിനുള്ള കാരണം ഇവിടെ പറയുന്നതിനാൽ കാരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: εἶδον
  choice: കണ്ടിരിക്കുന്നു
  rationale: ഗ്രീക്ക് ഏറിസ്റ്റ് പൂർത്തിയായ ദർശനത്തെ സൂചിപ്പിക്കുന്നു; അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കാൻ ഈ രൂപം യോജിക്കുന്നു.
- source_word: οἱ ὀφθαλμοί μου
  choice: എന്റെ കണ്ണുകൾ
  rationale: ഗ്രീക്കിലെ ദൃശ്യവും ശരീരസംബന്ധവുമായ പ്രയോഗം ‘ഞാൻ’ എന്നു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὸ σωτήριόν σου
  choice: അങ്ങയുടെ രക്ഷ
  rationale: σωτήριον നേരിട്ട് ‘രക്ഷകൻ’ എന്ന വ്യക്തിനാമമല്ല; രക്ഷയെയോ വിടുതലിനെയോ സൂചിപ്പിക്കുന്നതിനാൽ മൂലരൂപവും അതിലെ ദൈവശാസ്ത്രപരമായ സമൃദ്ധിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τὸ σωτήριόν σου എന്നത് ‘രക്ഷ’ എന്നോ, സന്നിഹിതനായ ശിശുമിശിഹയെ മുൻനിർത്തി ‘രക്ഷകൻ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: അങ്ങയുടെ രക്ഷ
  alternative: അങ്ങയുടെ രക്ഷകൻ
  rationale: ഗ്രീക്കിൽ സാധാരണയായി ‘രക്ഷകൻ’ എന്നർഥമുള്ള σωτήρ അല്ല, σωτήριον ആണ്. അതിനാൽ ദൈവത്തിന്റെ രക്ഷ യേശുവിൽ സന്നിഹിതമാണെന്ന സന്ദർഭാർഥം വായനക്കാരന് ഗ്രഹിക്കാനിടവരുത്തിക്കൊണ്ട് മൂലപദത്തിന്റെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
