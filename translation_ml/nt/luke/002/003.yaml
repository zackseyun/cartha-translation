id: LUK.2.3
reference: Luke 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπορεύοντο πάντες ἀπογράφεσθαι, ἕκαστος εἰς τὴν ⸀ἑαυτοῦ πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/003.yaml
  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: ml
  text: എല്ലാവരും പേരുചേർക്കപ്പെടാൻ അവരവരുടെ പട്ടണത്തിലേക്കു പോയിക്കൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഓരോരുത്തനും തന്റെ പട്ടണത്തിലേക്ക്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: പോയിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം പശ്ചാത്തലത്തിൽ തുടർന്നുകൊണ്ടിരുന്ന സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ലളിതഭൂതകാലമായ ‘പോയി’ എന്നതിനെക്കാൾ ഈ രൂപം സ്രോതസ്സിന്റെ അപൂർണതാഭാവം നന്നായി നിലനിർത്തുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: ‘എല്ലാവരും’ എന്നത് πάντες എന്നതിന്റെ സമഗ്രവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἀπογράφεσθαι
  choice: പേരുചേർക്കപ്പെടാൻ
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിനോടനുബന്ധിച്ച ഔദ്യോഗിക രജിസ്ട്രേഷനെയാണ് ഇവിടെ ക്രിയ സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്കു വ്യക്തമാകുന്ന രീതിയിൽ കർമണിഭാവവും നിലനിർത്തുന്നു.
- source_word: ἕκαστος ... ἑαυτοῦ
  choice: അവരവരുടെ
  rationale: ഗ്രീക്കിലെ ഏകവചന വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന പരസ്പരവിതരണപ്രയോഗമാണിത്; ഓരോ വ്യക്തിയും തനിക്കു ബന്ധപ്പെട്ട പട്ടണത്തിലേക്കു പോയി എന്ന അർഥം നൽകുന്നു.
- source_word: πόλιν
  choice: പട്ടണം
  rationale: πόλις എന്നത് ‘നഗരം’ എന്നും ‘പട്ടണം’ എന്നും വരാം. ഈ ചരിത്ര-ഭരണപരമായ സാഹചര്യത്തിൽ വാസസ്ഥലത്തിന്റെ വലിപ്പത്തെ അതിശയിപ്പിക്കാതെ സ്വാഭാവികമായി വായിക്കാവുന്ന ‘പട്ടണം’ തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ἕκαστος ... ἑαυτοῦ എന്ന ഏകവചന പുല്ലിംഗ വിതരണപ്രയോഗം
  choice: അവരവരുടെ പട്ടണത്തിലേക്ക്
  alternative: ഓരോരുത്തനും തന്റെ പട്ടണത്തിലേക്ക്
  rationale: ഗ്രീക്കിൽ വ്യാകരണപരമായി ഏകവചന പുല്ലിംഗമാണെങ്കിലും, മലയാളത്തിലെ ‘അവരവരുടെ’ ലിംഗനിരപേക്ഷമാക്കാനുള്ള സിദ്ധാന്തപരമായ പുനർവ്യാഖ്യാനമല്ല; വ്യക്തിവ്യക്തിയായുള്ള വിതരണാർഥം സ്വാഭാവികമായി വഹിക്കുന്ന പതിവുപ്രയോഗമാണ്. കൂടുതൽ രൂപസാദൃശ്യമുള്ള മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘പോയിക്കൊണ്ടിരുന്നു’ എന്ന രൂപം ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം സംരക്ഷിക്കുന്നു; ഔദ്യോഗിക census-registration പശ്ചാത്തലത്തിന് ‘പേരുചേർക്കപ്പെടാൻ’ എന്ന സുതാര്യമായ പ്രയോഗം സ്വീകരിച്ചു.
