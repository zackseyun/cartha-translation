id: LUK.2.26
reference: Luke 2:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: ml
  text: പരിശുദ്ധാത്മാവിനാൽ, കർത്താവിന്റെ മശീഹായെ[a] കാണുന്നതിനുമുമ്പ് താൻ മരണം കാണുകയില്ലെന്ന് അദ്ദേഹത്തിന് വെളിപ്പെടുത്തപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, പരമ്പരാഗതമായി, “കർത്താവിന്റെ ക്രിസ്തുവിനെ.”
    reason: Χριστός എന്ന പദത്തിന്റെ പരമ്പരാഗത മലയാളരൂപമായ ‘ക്രിസ്തു’ എന്ന മറ്റൊരു പരിഭാഷ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: വെളിപ്പെടുത്തപ്പെട്ടിരുന്നു
  rationale: ദൈവികമായി ലഭിച്ച അറിയിപ്പിനെയോ വെളിപ്പാടിനെയോ സൂചിപ്പിക്കുന്ന കർമ്മണി പ്രയോഗം; പരിശുദ്ധാത്മാവാണ് പ്രവർത്തകൻ എന്നു തുടർന്നുള്ള വാക്യഭാഗം വ്യക്തമാക്കുന്നു.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: പരിശുദ്ധാത്മാവിനാൽ
  rationale: ὑπό + ഷഷ്ഠി വ്യക്തിപരമായ പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ആൽ’ പ്രയോഗം അത് നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: μὴ ἰδεῖν θάνατον
  choice: മരണം കാണുകയില്ല
  rationale: ‘മരണം കാണുക’ എന്ന മൂലഭാഷയിലെ ദൃശ്യരൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതാണ്; ‘മരിക്കുകയില്ല’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: കാണുന്നതിനുമുമ്പ്
  rationale: മുഖ്യക്രിയയുമായി ബന്ധപ്പെട്ട ഭാവികാലക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸν χριστὸν κυρίου
  choice: കർത്താവിന്റെ മശീഹാ
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമംപോലെയല്ല, അഭിഷിക്തനായ പ്രതീക്ഷിത രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയാണ്; ‘മശീഹാ’ ആ യഹൂദ പശ്ചാത്തലം നിലനിർത്തുന്നു. κυρίου എന്ന ബന്ധവും ഉടമസ്ഥത/അയച്ചവൻ എന്ന അർഥവ്യാപ്തിയോടെ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദം മശീഹാപദവിയായി വിവർത്തനം ചെയ്യുന്നത്
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: τὸν χριστὸν κυρίου എന്നതിൽ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നു. അതിനാൽ മുഖ്യപാഠത്തിൽ ‘മശീഹാ’ ഉപയോഗിക്കുകയും പരമ്പരാഗത ‘ക്രിസ്തു’ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ‘മരണം കാണുക’ എന്ന പ്രയോഗവും പരിശുദ്ധാത്മാവിന്റെ വ്യക്തിപരമായ പ്രവർത്തകത്വവും നിലനിർത്തിയിരിക്കുന്നു.
