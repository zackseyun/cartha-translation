reference: Luke 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: ml
  text: 'ഇതായിരിക്കും നിങ്ങൾക്കുള്ള അടയാളം: തുണികളിൽ പൊതിഞ്ഞ്[a], ഒരു പുൽത്തൊട്ടിയിൽ[b] കിടക്കുന്ന ഒരു കുഞ്ഞിനെ നിങ്ങൾ കണ്ടെത്തും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശിശുവിനെ പൊതിയുന്ന തുണികളിൽ ചുറ്റിപ്പൊതിഞ്ഞ്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തീറ്റത്തൊട്ടിയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: അടയാളം
  rationale: ഇവിടെ ഇടയന്മാർക്ക് കുഞ്ഞിനെ തിരിച്ചറിയാൻ നൽകുന്ന സൂചനയാണ്; അത്ഭുതകരമായ തെളിവ് എന്ന ആശയം അനാവശ്യമായി ചേർക്കാതെ ഗ്രീക്കിലെ സാധാരണ അർഥം നിലനിർത്തുന്നു.
- source_word: εὑρήσετε
  choice: നിങ്ങൾ കണ്ടെത്തും
  rationale: εὑρίσκω എന്ന ക്രിയയുടെ ഭാവികാല ബഹുവചനരൂപത്തെ നേരായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: βρέφος
  choice: ഒരു കുഞ്ഞ്
  rationale: വളരെ ചെറിയ ശിശുവിനെ സൂചിപ്പിക്കുന്ന βρέφος എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും എല്ലാവർക്കും മനസ്സിലാകുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: ἐσπαργανωμένον
  choice: തുണികളിൽ പൊതിഞ്ഞ്
  rationale: ശിശുവിനെ തുണിക്കഷണങ്ങളാൽ ചുറ്റിപ്പൊതിയുന്ന പ്രവൃത്തിയെ ലളിതവും മൂർത്തവുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: κείμενον
  choice: കിടക്കുന്ന
  rationale: മുൻപ് കിടത്തിയ പ്രവൃത്തിയേക്കാൾ കുഞ്ഞിന്റെ ഇപ്പോഴത്തെ നിലയെ വിവരിക്കുന്ന κεῖμαι എന്ന പദത്തിന്റെ സ്ഥിതിവാചക സ്വഭാവം സംരക്ഷിക്കുന്നു.
- source_word: φάτνῃ
  choice: ഒരു പുൽത്തൊട്ടിയിൽ
  rationale: മൃഗങ്ങൾക്ക് തീറ്റ ഇടുന്ന തൊട്ടിയെ സൂചിപ്പിക്കുന്ന φάτνη എന്ന പദത്തിന് ജനനവിവരണത്തിൽ പ്രചാരമുള്ളതും മനസ്സിലാകുന്നതുമായ മലയാളരൂപമാണിത്.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: ഇതായിരിക്കും നിങ്ങൾക്കുള്ള അടയാളം
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ നാമവാക്യത്തിന് സന്ദർഭാനുസൃതമായി ഭാവികാല ബന്ധകക്രിയ ചേർത്ത് സ്വാഭാവിക മലയാളമാക്കുന്നു.
theological_decisions:
- issue: ഇടയന്മാർക്ക് നൽകപ്പെട്ട അടയാളത്തിന്റെ സ്വഭാവം
  choice: കുഞ്ഞിനെ തിരിച്ചറിയാനുള്ള അടയാളമായാണ് വാക്യം അവതരിപ്പിക്കുന്നത്.
  alternative: ഇത് ദൈവിക സ്ഥിരീകരണം നൽകുന്ന വിശാലമായ ദൈവശാസ്ത്രപരമായ അടയാളവുമാകാം.
  rationale: വിവർത്തനം ‘അടയാളം’ എന്ന മൂർത്തമായ പദം നിലനിർത്തുന്നു; അതിനെ ‘അത്ഭുതം’ അല്ലെങ്കിൽ ‘തെളിവ്’ എന്ന് വികസിപ്പിക്കുന്നില്ല. അങ്ങനെ കഥയുടെ ലാളിത്യവും അന്തർലീനമായ ദൈവശാസ്ത്ര ആഴവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പുൽത്തൊട്ടി’ എന്ന പരിചിതമായ പദം മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ച്, φάτνηയുടെ കൂടുതൽ മൂർത്തമായ അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദസമുച്ചയത്തിനു പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
