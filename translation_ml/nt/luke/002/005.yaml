  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: ml
  text: തനിക്കു വിവാഹനിശ്ചയം കഴിഞ്ഞിരുന്ന[a], ഗർഭിണിയായ[b] മറിയത്തോടൊപ്പം പട്ടികയിൽ പേര് ചേർക്കാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തനിക്കു വിവാഹവാഗ്ദാനം ചെയ്യപ്പെട്ടിരുന്ന.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം, ഇന്നത്തെ സാധാരണ വിവാഹനിശ്ചയത്തേക്കാൾ ശക്തമായ നിയമപരവും സാമൂഹികവുമായ ബന്ധത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഗർഭം ധരിച്ചിരുന്ന.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: പേര് ചേർക്കുന്നതിനായി
  rationale: ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ ഭരണപരമായ പശ്ചാത്തലത്തിൽ പേര് ഔദ്യോഗിക പട്ടികയിൽ ചേർക്കുക എന്ന ഉദ്ദേശ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: σὺν
  choice: ഒപ്പം
  rationale: കൂടെ വരുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ സഹവർത്തിത്വാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Μαριὰμ
  choice: മറിയം
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പേരുരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: തനിക്കു വിവാഹനിശ്ചയം കഴിഞ്ഞിരുന്ന
  rationale: പൂർണവിവാഹമെന്നു പറയാതെ, ആധുനിക വിവാഹനിശ്ചയത്തേക്കാൾ ശക്തമായ നിയമപരവും സാമൂഹികവുമായ പുരാതന വിവാഹബന്ധപ്രതിജ്ഞയെ സൂചിപ്പിക്കുന്നു.
- source_word: οὔσῃ ἐγκύῳ
  choice: അവൾ ഗർഭിണിയായിരുന്നു
  rationale: ആ സമയത്തെ മറിയത്തിന്റെ അവസ്ഥയെ വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ പറയുന്നു.
theological_decisions:
- issue: യോസേഫുമായുള്ള മറിയത്തിന്റെ വിവാഹബന്ധനില
  choice: തനിക്കു വിവാഹനിശ്ചയം കഴിഞ്ഞിരുന്ന
  alternative: അവന്റെ ഭാര്യയായിരുന്ന
  rationale: ഗ്രീക്ക് പദം ഔപചാരികമായ വിവാഹനിശ്ചയബന്ധമാണ് വ്യക്തമാക്കുന്നത്; ‘ഭാര്യ’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നത് ഈ വാക്യഭാഗം പറയുന്നതിനെക്കാൾ പൂർത്തിയായ വിവാഹനില ഇറക്കുമതി ചെയ്യും. അതേസമയം കുറിപ്പ് പുരാതന ബന്ധത്തിന്റെ കൂടുതൽ ശക്തമായ നിയമ-സാമൂഹിക സ്വഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ അധീന പങ്കാളിവാക്യങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായ രണ്ടു വാക്യങ്ങളാക്കി. ‘വിവാഹനിശ്ചയം’ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമാകുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച്, പുരാതന ഔപചാരികബന്ധത്തിന്റെ ശക്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
