translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘കാരവൻ’ എന്ന സംസ്കാരവിശേഷ സൂചനയുള്ള വായ്പാപദത്തിനു പകരം എല്ലാവർക്കും എളുപ്പം മനസ്സിലാകുന്ന ‘യാത്രാസംഘം’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം [a] മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
