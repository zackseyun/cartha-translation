source:
  edition: SBLGNT
  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: ml
  text: എന്നാൽ, അവൻ യാത്രാസംഘത്തിലുണ്ടെന്ന് കരുതി അവർ ഒരു ദിവസത്തെ യാത്ര ചെയ്തു. പിന്നെ ബന്ധുക്കളുടെയും പരിചയക്കാരുടെയും ഇടയിൽ അവനെ അന്വേഷിക്കാൻ തുടങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവനെ അന്വേഷിച്ചുകൊണ്ടിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിലെ അപൂർണ്ണഭൂതകാല ക്രിയ തിരച്ചിലിന്റെ തുടർച്ചയെ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: കരുതി
  rationale: മറിയയും യോസേഫും ഉറപ്പില്ലാതെ നടത്തിയ അനുമാനമാണ് കൃത്തിന്റെ ആശയം; ആ താൽക്കാലിക ധാരണ സ്വാഭാവിക മലയാളത്തിൽ ‘കരുതി’ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ സംഭവവുമായി ബന്ധിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യവും കഥയിലെ വഴിത്തിരിവും സൂചിപ്പിക്കുന്നു.
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: യാത്രാസംഘത്തിലുണ്ടെന്ന്
  rationale: συνοδία ഒരുമിച്ചു യാത്ര ചെയ്യുന്ന ആളുകളുടെ സംഘത്തെ സൂചിപ്പിക്കുന്നു; ‘യാത്രാസംഘം’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: ഒരു ദിവസത്തെ യാത്ര മുന്നോട്ടുപോയി
  rationale: ഒരു ദിവസം സഞ്ചരിക്കാവുന്ന ദൂരം/സമയം എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀνεζήτουν
  choice: അന്വേഷിച്ചുതുടങ്ങി
  rationale: അപൂർണ്ണഭൂതകാല ക്രിയയുടെ ആരംഭപരവും തുടർച്ചാപരവുമായ സാധ്യതകളിൽ, ഈ കഥാസന്ദർഭത്തിൽ തിരച്ചിൽ ആരംഭിച്ചതിനെ മുൻനിർത്തുന്നു; തുടർച്ചാപരമായ മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: συγγενεῦσιν
  choice: ബന്ധുക്കൾ
  rationale: കുടുംബബന്ധമുള്ളവരെ ലിംഗഭേദമില്ലാതെ പൊതുവായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: γνωστοῖς
  choice: പരിചയക്കാർ
  rationale: അടുത്ത സുഹൃത്തുക്കൾ മാത്രമല്ല, പരിചയമുള്ള ആളുകളെയും ഉൾക്കൊള്ളുന്ന γνωστοί എന്ന പദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
