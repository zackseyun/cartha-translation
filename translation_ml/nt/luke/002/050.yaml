  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: ml
  text: അവൻ അവരോടു പറഞ്ഞ വാക്ക്[a] അവർ മനസ്സിലാക്കിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വചനം,” “പറഞ്ഞത്,” അല്ലെങ്കിൽ “കാര്യം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: മലയാളത്തിൽ മുൻവാക്യത്തോടുള്ള തുടർച്ച സന്ദർഭവും വാക്യക്രമവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഇവിടെ ‘എന്നാൽ’ എന്നു ചേർത്താൽ ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത വിരുദ്ധഭാവം വരാം.
- source_word: αὐτοὶ
  choice: അവർ
  rationale: സന്ദർഭത്തിൽ യേശുവിന്റെ മാതാപിതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിലെ കർത്തൃസർവനാമത്തിന്റെ സാന്നിധ്യം മലയാളത്തിലെ ‘അവർ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὐ συνῆκαν
  choice: മനസ്സിലാക്കിയില്ല
  rationale: ഗ്രഹിക്കാതിരുന്നതിനെ ലളിതവും കൃത്യവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഭാഗികമായ അറിവോ നിരാകരണമോ ഇതിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: τὸ ῥῆμα
  choice: വാക്ക്
  rationale: ഇവിടെ യേശു പറഞ്ഞ നിർദിഷ്ടമായ ഉക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വാക്ക്’ സ്വാഭാവികവും ഗ്രീക്ക് പദത്തിന്റെ ‘വചനം/പറഞ്ഞ കാര്യം’ എന്നീ അർഥസാധ്യതകൾ നിലനിർത്തുന്നതുമാണ്.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞ
  rationale: ബന്ധവാക്യം മലയാളത്തിൽ നാമത്തിന് മുമ്പായി വെക്കുന്നത് സ്വാഭാവികമാണ്; ‘പറഞ്ഞ’ എന്നത് λαλέωയുടെ സന്ദർഭോചിതമായ അർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ മാതാപിതാക്കളുടെ പ്രതികരണത്തെക്കുറിച്ചുള്ള ആഖ്യാനം
  choice: യേശു പറഞ്ഞ വാക്ക് അവർ മനസ്സിലാക്കിയില്ലെന്ന് നേരിട്ട് പ്രസ്താവിക്കുന്നു.
  alternative: അവർ പൂർണമായി മനസ്സിലാക്കിയില്ല / അവർ അത് അംഗീകരിച്ചില്ല
  rationale: ഗ്രീക്ക് പാഠം അറിവില്ലായ്മയെയാണ് പറയുന്നത്; ഭാഗികമായ ഗ്രഹണമോ നിരാകരണമോ പറയുന്നില്ല. അതിനാൽ യേശുവിന്റെ വ്യക്തിത്വത്തെയും ദൗത്യത്തെയും ചുറ്റിയുള്ള ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കം വിശദീകരിച്ചു തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും സ്വാഭാവികവുമായ ശൈലി. സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ‘മനസ്സിലാക്കിയില്ല’ ഉപയോഗിച്ചു; ῥῆμα എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
