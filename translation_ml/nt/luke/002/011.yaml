id: LUK.2.11
reference: Luke 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: ml
  text: എന്തെന്നാൽ, ദാവീദിന്റെ നഗരത്തിൽ ഇന്ന് നിങ്ങൾക്കായി ഒരു രക്ഷകൻ ജനിച്ചിരിക്കുന്നു; അവൻ കർത്താവായ മശീഹയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ പരമ്പരാഗതമായി, “കർത്താവായ ക്രിസ്തു.” ഗ്രീക്കിൽ χριστὸς κύριος എന്നു വരുന്നു—അക്ഷരാർഥത്തിൽ “മശീഹ, കർത്താവ്”; സാധാരണയായി “കർത്താവായ മശീഹ” എന്നു മനസ്സിലാക്കുന്നു. “കർത്താവിന്റെ മശീഹ” എന്നും വ്യാഖ്യാനിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: χριστὸς κύριος എന്ന ഗ്രീക്ക് പദസമുച്ചയത്തിന്റെ പരമ്പരാഗത പരിഭാഷയും യഥാർഥ വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ദൂതന്റെ സന്തോഷവാർത്തയുടെ കാരണം/ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐτέχθη
  choice: ജനിച്ചിരിക്കുന്നു
  rationale: τίκτω എന്ന ക്രിയയുടെ aorist passive രൂപം; അന്നുതന്നെ സംഭവിച്ചതും ഇപ്പോഴത്തെ പ്രസക്തിയുള്ളതുമായ ജനനവാർത്തയായി മലയാളത്തിൽ സ്വാഭാവികം.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കായി
  rationale: ശ്രോതാക്കളുടെ പ്രയോജനത്തെ സൂചിപ്പിക്കുന്ന dative ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: σήμερον
  choice: ഇന്ന്
  rationale: സാധാരണ ആധുനിക മലയാളത്തിലെ വ്യക്തമായ കാലസൂചകം.
- source_word: σωτήρ
  choice: രക്ഷകൻ
  rationale: വിടുതലയും രക്ഷയും ഉൾക്കൊള്ളുന്ന, ഈ സന്ദർഭത്തിൽ സ്ഥാപിതവും വ്യക്തവുമായ പദം.
- source_word: ὅς ἐστιν
  choice: അവൻ ... ആണ്
  rationale: രക്ഷകനെ തുടർന്നുള്ള പദവികളാൽ തിരിച്ചറിയിക്കുന്ന relative clause മലയാളത്തിൽ സ്വാഭാവികമായി പുനരവതരിപ്പിക്കുന്നു.
- source_word: χριστός
  choice: മശീഹ
  rationale: ഇവിടെ വ്യക്തിനാമമല്ല, ദാവീദീയ പ്രതീക്ഷയുമായി ബന്ധപ്പെട്ട അഭിഷിക്തനായ രാജാവിന്റെ പദവിയാണ്.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: അധികാരവും ശക്തമായ ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്ന പതിവ് മലയാള പരിഭാഷ.
- source_word: ἐν πόλει Δαυίδ
  choice: ദാവീദിന്റെ നഗരത്തിൽ
  rationale: ഗ്രീക്ക് prepositional phrase-ന്റെ അർത്ഥവും ദാവീദീയ രാജകീയ ബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: χριστὸς κύριος എന്ന പദസമുച്ചയത്തിന്റെ പരിഭാഷ
  choice: കർത്താവായ മശീഹ
  alternative: മശീഹയും കർത്താവും; കർത്താവിന്റെ മശീഹ; കർത്താവായ ക്രിസ്തു
  rationale: ഗ്രീക്കിൽ σωτήρ എന്നതിനെ തിരിച്ചറിയിക്കുന്ന nominative പദവികളായി χριστός, κύριος എന്നിവ വരുന്നു. മലയാളത്തിൽ ‘കർത്താവായ മശീഹ’ എന്നത് ‘Messiah the Lord’ എന്ന appositional ധാരണ സ്വാഭാവികമായി നൽകുന്നു; എങ്കിലും ഗ്രീക്ക് ഘടനയുടെ സംക്ഷിപ്തത മൂലമുള്ള മറ്റ് വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘മശീഹ’ പദവിയായി ഉപയോഗിച്ചു; വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ക്രമപ്പെടുത്തി.
