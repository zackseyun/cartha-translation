reference: Luke 2:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: ml
  text: മൂന്നു ദിവസം കഴിഞ്ഞപ്പോൾ അവർ അവനെ ദൈവാലയത്തിൽ[a] അധ്യാപകരുടെ ഇടയിൽ ഇരുന്ന്, അവരെ ശ്രദ്ധിച്ചു കേൾക്കുകയും അവരോടു ചോദ്യങ്ങൾ ചോദിക്കുകയും[b] ചെയ്യുന്നതായി കണ്ടെത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള ഗ്രീക്ക് പദം ദൈവാലയത്തിന്റെ അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദൈവാലയസമുച്ചയത്തെയോ അതിന്റെ പരിസരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: ‘അവരെ ചോദ്യം ചെയ്യുകയും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്തില്ല
  rationale: ലൂക്കോസിന്റെ സംഭവാവതരണ സൂത്രവാക്യം മലയാളത്തിൽ വേറിട്ട് ‘സംഭവിച്ചു’ എന്നു ചേർത്താൽ വാക്യം കൃത്രിമമാകും; ‘മൂന്നു ദിവസം കഴിഞ്ഞപ്പോൾ’ എന്ന തുടക്കം അതിന്റെ ആഖ്യാനധർമ്മം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: μετὰ ἡμέρας τρεῖς
  choice: മൂന്നു ദിവസം കഴിഞ്ഞപ്പോൾ
  rationale: കാലക്രമത്തിൽ ‘മൂന്നു ദിവസത്തിനു ശേഷം’ എന്ന അർഥം സ്വാഭാവികമായ ആഖ്യാനമലയാളത്തിൽ നൽകുന്നു.
- source_word: εὗρον αὐτόν
  choice: അവർ അവനെ ... കണ്ടെത്തി
  rationale: സാധാരണ ആഖ്യാനക്രിയയായ εὗρον എന്നതിന്റെ നേരായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയത്തിൽ
  rationale: ἱερόν ദൈവാലയസമുച്ചയത്തെയോ അതിന്റെ പരിസരങ്ങളെയോ സൂചിപ്പിക്കുന്നു; പൊതുവായ വായനയ്ക്ക് ‘ദൈവാലയം’ സ്വാഭാവികമാണ്, കൃത്യമായ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καθεζόμενον ἐν μέσῳ τῶν διδασκάλων
  choice: ഉപദേഷ്ടാക്കളുടെ നടുവിൽ ഇരുന്ന്
  rationale: കണ്ടെത്തിയ സമയത്തെ യേശുവിന്റെ ഇരിപ്പും അധ്യാപകരുടെ ഇടയിലെ സ്ഥാനവും നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ന്യായപ്രമാണത്തിന്റെ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: ἀκούοντα αὐτῶν
  choice: അവർ പറയുന്നത് കേൾക്കുകയും
  rationale: സന്ദർഭത്തിലെ ശ്രദ്ധാപൂർവമായ കേൾവിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπερωτῶντα αὐτούς
  choice: അവരോടു ചോദ്യങ്ങൾ ചോദിക്കുകയും
  rationale: ἐπερωτάωയുടെ ചോദിക്കുക/ചോദ്യം ചെയ്യുക എന്ന അർഥം ഏറ്റുമുട്ടലിന്റെയോ വിസ്താരത്തിന്റെയോ അനാവശ്യ സൂചനയില്ലാതെ നൽകുന്നു.
theological_decisions:
- issue: യേശു ഉപദേഷ്ടാക്കളുമായി ഇടപെടുന്നതിന്റെ സ്വഭാവം
  choice: ‘അവർ പറയുന്നത് കേൾക്കുകയും അവരോടു ചോദ്യങ്ങൾ ചോദിക്കുകയും’
  alternative: ‘അവരെ ചോദ്യം ചെയ്യുകയും’
  rationale: വാക്യം ശ്രദ്ധാപൂർവമായ കേൾവിയും സജീവമായ സംവാദവും ഒരുമിച്ച് ചിത്രീകരിക്കുന്നു. വിവർത്തനം യേശുവിന്റെ ജ്ഞാനത്തെ കുറച്ചുകാണിക്കുകയോ ഗ്രീക്ക് നിർബന്ധിക്കാത്ത ഏറ്റുമുട്ടൽഭാവം ചേർക്കുകയോ ചെയ്യുന്നില്ല; ദൈവശാസ്ത്രപരമായ സംഘർഷം നിർവചിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഉപദേഷ്ടാക്കൾ’ മതപഠിപ്പുകാരെ സൂചിപ്പിക്കുമ്പോഴും മൂലപാഠത്തിൽ ഇല്ലാത്ത കൂടുതൽ പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
