id: LUK.2.38
reference: Luke 2:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: ml
  text: ആ സമയത്തുതന്നെ[a] അവൾ എത്തിച്ചേർന്ന് ദൈവത്തിനു നന്ദി അർപ്പിച്ചുകൊണ്ടിരുന്നു[b]; യെരൂശലേമിന്റെ വീണ്ടെടുപ്പിനായി കാത്തിരുന്ന എല്ലാവരോടും അവനെക്കുറിച്ച്[c] സംസാരിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘അതേ സമയത്ത്.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ദൈവത്തെ സ്തുതിച്ചുകൊണ്ടിരുന്നു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ നന്ദിയും സ്തുതിയും പ്രകടിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘അവനെ’ എന്നത് സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികമായി ശിശുവായ യേശുവിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഗ്രീക്കിൽ ഏറ്റവും അടുത്ത് വ്യക്തമായി പറഞ്ഞിരിക്കുന്ന സൂചിതൻ ദൈവമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: ആ സമയത്തുതന്നെ
  rationale: കാലസൂചനയായ ദത്തിവ് പ്രയോഗവും αὐτῇ നൽകുന്ന ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπιστᾶσα
  choice: അടുത്തുവന്ന
  rationale: അന്ന സംഭവസ്ഥലത്തേക്ക് അന്ന എത്തിച്ചേർന്നതോ സമീപിച്ചതോ സൂചിപ്പിക്കുന്നു; അവൾ എങ്ങനെ വന്നു എന്ന് അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: ἀνθωμολογεῖτο
  choice: നന്ദി പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: ദൈവത്തോടുള്ള നന്ദിയോ സ്തുതിയോ പ്രകടിപ്പിക്കുന്ന അപൂർവ ക്രിയയുടെ അർത്ഥവും അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവവും നൽകുന്നു; ഗ്രീക്കിൽ നിർബന്ധമല്ലാത്ത ‘തുടങ്ങി’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിനു
  rationale: ഗ്രീക്കിലെ നിർദ്ദിഷ്ട ഉപപദം ഇവിടെ മലയാളത്തിൽ പ്രത്യേകമായി പുനരാവിഷ്കരിക്കേണ്ടതില്ല; ദത്തിവ് ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ച് സംസാരിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചയും αὐτοῦ എന്ന സർവനാമവും നിലനിർത്തുന്നു; മുഖ്യവാചകത്തിൽ അതിന്റെ സൂചിതനെ വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: കാത്തിരുന്ന എല്ലാവരോടും
  rationale: പ്രതീക്ഷയോടെയുള്ള കാത്തിരിപ്പിനെ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: λύτρωσιν
  choice: വീണ്ടെടുപ്പ്
  rationale: മോചനം, വിടുതൽ, രക്ഷാപരമായ വീണ്ടെടുപ്പ് എന്നിവ ഉൾക്കൊള്ളുന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: Ἰερουσαλήμ
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: ἐλάλει περὶ αὐτοῦ എന്നതിലെ αὐτοῦ ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യവാചകത്തിൽ ‘അവനെക്കുറിച്ച്’ എന്ന സർവനാമം നിലനിർത്തി; സന്ദർഭത്തിൽ അത് ശിശുവായ യേശുവിനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം.
  alternative: അടുത്തുള്ള വ്യക്തമായ നാമപദം ‘ദൈവം’ ആയതിനാൽ സർവനാമം ദൈവത്തെ സൂചിപ്പിക്കുന്നതായും വായിക്കാം.
  rationale: യേശുശിശുവിനെ കേന്ദ്രീകരിക്കുന്ന കഥാസന്ദർഭം ആദ്യ വായനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും ഗ്രീക്കിലെ വ്യാകരണപരമായ അവ്യക്തത മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: λύτρωσιν Ἰερουσαλήμ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: ‘യെരൂശലേമിന്റെ വീണ്ടെടുപ്പ്’ എന്ന അർത്ഥം ‘യെരൂശലേമിന്റെ വീണ്ടെടുപ്പിനായി’ എന്നു നിലനിർത്തി.
  alternative: ‘യെരൂശലേമിന്റെ മോചനം’ അല്ലെങ്കിൽ ദൈവജനത്തിന്റെ രാഷ്ട്രീയമോ ആത്മീയമോ ആയ വിടുതൽ എന്നു കൂടുതൽ വ്യക്തമായി വ്യാഖ്യാനിക്കാം.
  rationale: ഈ പ്രയോഗത്തിന് സമൂഹപരവും രക്ഷാപരവും അന്ത്യകാലപരവുമായ പ്രതീക്ഷകൾ ഉൾക്കൊള്ളാം; ഒരു പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് അതിനെ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. തുടർച്ചയായ പ്രവർത്തനങ്ങളെ ‘-കൊണ്ടിരുന്നു’ രൂപത്തിൽ നൽകി ഗ്രീക്ക് അപൂർണ്ണഭൂതകാലത്തിന്റെ ഭാവം സംരക്ഷിച്ചു. സർവനാമത്തിന്റെ സൂചിതനും ‘വീണ്ടെടുപ്പ്’ എന്ന പദത്തിന്റെ വ്യാപ്തിയും വ്യാഖ്യാനിച്ച് ചുരുക്കിയിട്ടില്ല.
