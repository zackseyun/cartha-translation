id: LUK.2.40
reference: Luke 2:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: ml
  text: ആ ശിശു വളർന്നു ശക്തിപ്രാപിച്ചു; ജ്ഞാനം നിറഞ്ഞവനായിരുന്നു. ദൈവത്തിന്റെ കൃപ[a] അവന്റെമേൽ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ പ്രീതി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: ആ ശിശു
  rationale: παιδίον ഇവിടെ ശൈശവസന്ദർഭത്തിലുള്ള കുഞ്ഞിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ശിശു’ സ്വാഭാവികവും മാന്യവുമാണ്; δέ-യുടെ ലഘുവായ ആഖ്യാനബന്ധം പ്രത്യേക സംയോജകപദമില്ലാതെയും വാക്യപ്രവാഹത്തിൽ വ്യക്തമാകുന്നു.
- source_word: ηὔξανεν
  choice: വളർന്നു
  rationale: അപൂർണ്ണഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്ന വളർച്ചയെ സൂചിപ്പിക്കുന്നു; മലയാള ആഖ്യാനത്തിൽ ‘വളർന്നു’ അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐκραταιοῦτο
  choice: ശക്തിപ്രാപിച്ചു
  rationale: ക്രമേണ ശക്തനായിത്തീരുന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πληρούμενον σοφίᾳ
  choice: ജ്ഞാനം നിറഞ്ഞവനായിരുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപം ശിശുവിനോടൊപ്പം നിലനിന്നിരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥമായ കർമണിപ്രയോഗത്തേക്കാൾ ഈ രൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്; σοφίᾳ നിറവിന്റെ ഉള്ളടക്കമായി ‘ജ്ഞാനം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: χάρις θεοῦ
  choice: ദൈവത്തിന്റെ പ്രീതി
  rationale: χάρις എന്നതിന് കൃപ, പ്രീതി, അനുകൂലഭാവം എന്നീ അർഥങ്ങളുണ്ട്. ഈ ആഖ്യാനവിവരണത്തിൽ ദൈവത്തിന്റെ അനുകൂലസാന്നിധ്യം വ്യക്തമാക്കാൻ ‘പ്രീതി’ അനുയോജ്യമാണ്; ‘കൃപ’ സാധുവായ മറ്റൊരു പരിഭാഷയായി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἦν ἐπ’ αὐτό
  choice: അവന്റെമേൽ ഉണ്ടായിരുന്നു
  rationale: ἐπί ഇവിടെ ഒരാളുടെമേൽ നിലകൊള്ളുന്ന സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു. ‘അവന്റെമേൽ ഉണ്ടായിരുന്നു’ മൂലത്തിലെ ദൃശ്യരൂപം സംരക്ഷിക്കുന്ന സ്വാഭാവിക ബൈബിൾ ശൈലിയാണ്.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ മാനുഷിക വളർച്ചയുടെ സന്ദർഭത്തിൽ χάρις θεοῦ എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവത്തിന്റെ പ്രീതി
  alternative: ദൈവത്തിന്റെ കൃപ
  rationale: ‘പ്രീതി’ ദൈവത്തിന്റെ അനുകൂലവും പ്രസാദപൂർണവുമായ സാന്നിധ്യത്തെ വ്യക്തമാക്കുന്നു; പുത്രന്റെ ദൈവികസ്വഭാവത്തിൽ കുറവുണ്ടായിരുന്നു എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു. അതേസമയം χάρις എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി സംരക്ഷിക്കാൻ ‘കൃപ’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘പൈതൽ’ പോലുള്ള പഴയ പ്രയോഗത്തിനുപകരം ‘ശിശു’ ഉപയോഗിച്ചു; ഭാഷ മാന്യവും ലളിതവുമാക്കി.
