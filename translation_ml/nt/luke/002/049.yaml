id: LUK.2.49
reference: Luke 2:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്തിനാണ് എന്നെ അന്വേഷിച്ചത്? ഞാൻ എന്റെ പിതാവിന്റെ ഭവനത്തിൽ[a] ആയിരിക്കേണ്ടതാണെന്ന് നിങ്ങൾ അറിഞ്ഞില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ എന്റെ പിതാവിന്റെ കാര്യങ്ങളിൽ ആയിരിക്കേണ്ടതാണെന്ന്.” ഗ്രീക്ക് പ്രയോഗം അധ്യാഹൃതപദമുള്ളതാണ്; അത് പിതാവിന്റെ ഭവനത്തെയോ പിതാവിന്റെ കാര്യങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: എന്തിനാണ്
  rationale: കാരണത്തെക്കുറിച്ചുള്ള ചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐζητεῖτέ
  choice: അന്വേഷിച്ചത്
  rationale: കാണാതായ യേശുവിനെ മാതാപിതാക്കൾ തിരഞ്ഞ സംഭവസന്ദർഭത്തിൽ ζητέω എന്നതിന്റെ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: οὐκ ᾔδειτε
  choice: നിങ്ങൾ അറിഞ്ഞില്ലേ?
  rationale: അറിവിനെയോ ബോധ്യത്തെയോ സൂചിപ്പിക്കുന്ന οἶδαയുടെ നേരിട്ടുള്ള അർഥവും അലങ്കാരചോദ്യത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: എന്റെ പിതാവിന്റെ ഭവനത്തിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗം അധ്യാഹൃതപദമുള്ളതാണെങ്കിലും ഉടൻമുമ്പുള്ള ദേവാലയസന്ദർഭത്തിൽ ‘പിതാവിന്റെ ഭവനം’ ഏറ്റവും സാദ്ധ്യമായ അർഥമാണ്; മറ്റൊരു സാദ്ധ്യാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δεῖ
  choice: ആയിരിക്കേണ്ടതാണ്
  rationale: ദൈവികമോ നിർബന്ധിതമോ ആയ ആവശ്യകത സൂചിപ്പിക്കുന്ന δεῖയുടെ ഭാരം നിലനിർത്തുന്നു.
- source_word: εἶναί με
  choice: ഞാൻ ... ആയിരിക്കുക
  rationale: δεῖയോടു ചേർന്ന അക്കുസറ്റീവ് കർത്താവോടുകൂടിയ ഇൻഫിനിറ്റീവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: πατρός μου
  choice: എന്റെ പിതാവിന്റെ
  rationale: ഇവിടെ യേശു ദൈവത്തെ തന്റെ പിതാവായി പരാമർശിക്കുന്ന പുത്രബന്ധവാദം അധികവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν τοῖς τοῦ πατρός μου എന്ന അധ്യാഹൃതപദമുള്ള പ്രയോഗം
  choice: മുഖ്യപാഠത്തിൽ ‘എന്റെ പിതാവിന്റെ ഭവനത്തിൽ’
  alternative: ‘എന്റെ പിതാവിന്റെ കാര്യങ്ങളിൽ ഏർപ്പെട്ട്’ അഥവാ ‘എന്റെ പിതാവിനുള്ളവയിൽ’
  rationale: ദേവാലയസന്ദർഭം ‘ഭവനം’ എന്ന അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എന്നാൽ ഗ്രീക്ക് പ്രയോഗത്തിന് പിതാവിന്റെ കാര്യങ്ങളെയോ താത്പര്യങ്ങളെയോ സൂചിപ്പിക്കാനും കഴിയുന്നതിനാൽ യഥാർഥമായ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ‘എന്റെ പിതാവ്’ എന്നതിന്റെ സൂചന
  choice: ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം
  alternative: ഭൗമിക പിതാവായ യോസേഫ്
  rationale: ദേവാലയസന്ദർഭവും യോസേഫിനെയും മറിയയെയും അഭിസംബോധന ചെയ്യുന്ന വാക്കുകളുടെ വൈരുധ്യവും ദൈവമാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെന്ന് വ്യക്തമാക്കുന്നു; പാഠത്തിനപ്പുറം വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അന്വേഷിച്ചത്’ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ സംഭവത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം അർഥസന്ദിഗ്ധമായ വാക്യഭാഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
