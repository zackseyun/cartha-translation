  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: ml
  text: 'ആ ദിവസങ്ങളിൽ ഇങ്ങനെ സംഭവിച്ചു: ജനവാസമുള്ള ലോകം മുഴുവനും രജിസ്റ്റർ ചെയ്യപ്പെടണമെന്നു കൈസർ അഗസ്റ്റസിൽനിന്ന് ഒരു കൽപ്പന പുറപ്പെട്ടു[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘റോമൻ ലോകം മുഴുവനും’ അഥവാ ‘സാമ്രാജ്യം മുഴുവനും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം റോമൻ സാമ്രാജ്യത്തിന്റെ പശ്ചാത്തലത്തിൽ മനസ്സിലാക്കിയിരുന്ന ജനവാസമുള്ള ലോകത്തെ പലപ്പോഴും സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ഇങ്ങനെ സംഭവിച്ചു
  rationale: പുതിയ സംഭവത്തിലേക്കുള്ള ആഖ്യാനപരമായ നീക്കം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; δὲ-യ്ക്കായി അനാവശ്യമായ വേറൊരു കാലസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ആ കാലത്ത്
  rationale: ‘ആ ദിവസങ്ങളിൽ’ എന്ന പദാനുപദ രൂപത്തേക്കാൾ സ്വാഭാവികമായി അതേ കാലസൂചന നൽകുന്നു.
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: അധികാരകേന്ദ്രത്തിൽനിന്ന് കൽപ്പന പുറപ്പെടുന്നതെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: δόγμα
  choice: കൽപ്പന
  rationale: ചക്രവർത്തിയുടെ ഔദ്യോഗിക ഉത്തരവിനെ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: കൈസർ അഗസ്റ്റസിൽനിന്ന്
  rationale: παρά + സമ്ബന്ധികയുടെ ഉറവിടാർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἀπογράφεσθαι
  choice: ഔദ്യോഗികമായി രജിസ്റ്റർ ചെയ്യപ്പെടണം
  rationale: ഔദ്യോഗിക രേഖപ്പെടുത്തൽ എന്ന അർഥം നൽകുന്നു; ഈ വാക്യം മാത്രം പറയുന്നതിലധികമായി നികുതിയോ ജനസംഖ്യാ കണക്കെടുപ്പോ എന്നു നിർണ്ണയിക്കുന്നില്ല.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: ജനവാസമുള്ള ലോകം മുഴുവനും
  rationale: οἰκουμένη എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം സംരക്ഷിക്കുകയും റോമാ സാമ്രാജ്യം മാത്രമെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: οἰκουμένη എന്നതിന്റെ വ്യാപ്തി
  choice: ജനവാസമുള്ള ലോകം മുഴുവനും
  alternative: റോമൻ ലോകം മുഴുവനും; സാമ്രാജ്യം മുഴുവനും
  rationale: ഇത് പ്രധാനമായും ചരിത്ര-പദാർഥപരമായ അനിശ്ചിതത്വമാണ്. മുഖ്യവാചകം ഗ്രീക്കിന്റെ വിശാലമായ പദപ്രയോഗം നിലനിർത്തുന്നു; റോമൻ സാമ്രാജ്യസന്ദർഭത്തിലുള്ള പരിമിത അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇങ്ങനെ സംഭവിച്ചു:’ എന്ന രൂപം ഉറവിടത്തിലെ ആഖ്യാനസൂത്രം നിലനിർത്തുന്നു; ‘ഔദ്യോഗികമായി’ എന്നത് രജിസ്ട്രേഷന്റെ ഭരണപര സ്വഭാവം വ്യക്തമാക്കുമ്പോഴും ‘ജനസംഖ്യാ കണക്കെടുപ്പ്’ എന്ന കൂടുതൽ പ്രത്യേക അർഥം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
