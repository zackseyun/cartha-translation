id: LUK.2.52
reference: Luke 2:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: ml
  text: യേശു ജ്ഞാനത്തിലും പ്രായത്തിലും[a] ദൈവത്തിന്റെയും മനുഷ്യരുടെയും[b] പ്രീതിയിലും വളർന്നുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രായം’ എന്നതിനുള്ള ഗ്രീക്ക് പദത്തിന് ‘ശരീരവലിപ്പം’ അല്ലെങ്കിൽ ‘പക്വത’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള ‘മനുഷ്യർ’ എല്ലാ ആളുകളെയും പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘ആളുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: വളർന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാല ക്രിയ കാലക്രമത്തിൽ തുടർന്നുകൊണ്ടിരുന്ന യഥാർഥ പുരോഗതിയെ സൂചിപ്പിക്കുന്നു. ‘വളർന്നുകൊണ്ടിരുന്നു’ എന്നത് ഈ ദൈർഘ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: σοφίᾳ
  choice: ജ്ഞാനത്തിൽ
  rationale: തിരിച്ചറിവും വിവേകവും ഉൾപ്പെടുന്ന σοφίαയുടെ സാധാരണവും സന്ദർഭോചിതവുമായ പരിഭാഷ.
- source_word: ἡλικίᾳ
  choice: ശരീരവളർച്ചയിൽ
  rationale: ἡλικίαയ്ക്ക് പ്രായം, ശരീരവലിപ്പം/ഉയരം എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ യേശുവിന്റെ ദൃശ്യമായ മാനുഷിക വളർച്ച വ്യക്തമാക്കാൻ ‘ശരീരവളർച്ച’ തിരഞ്ഞെടുത്തു; മൂലത്തിലെ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: χάριτι
  choice: പ്രീതിയിൽ
  rationale: ഈ ബന്ധസൂചക സന്ദർഭത്തിൽ χάρις ദൈവത്തിന്റെയും മനുഷ്യരുടെയും അനുകൂലതയെയോ അംഗീകാരത്തെയോ സൂചിപ്പിക്കുന്നു; സങ്കൽപ്പാത്മകമായ ‘കൃപ’യെക്കാൾ ‘പ്രീതി’ സ്വാഭാവികമാണ്.
- source_word: παρὰ θεῷ
  choice: ദൈവത്തിന്റെ പ്രീതിയിൽ
  rationale: παρά + ദത്തിവ് ഇവിടെ ഒരാളുടെ ദൃഷ്ടിയിലോ ബന്ധത്തിലോ ലഭിക്കുന്ന അനുകൂലത സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഉടമസ്ഥബന്ധമുള്ള ‘ദൈവത്തിന്റെ പ്രീതി’ എന്ന ഘടന സ്വാഭാവികമായി അതു നൽകുന്നു.
- source_word: ἀνθρώποις
  choice: മനുഷ്യരുടെ
  rationale: ബഹുവചനമായ ἄνθρωποι ഇവിടെ ഒരു ലിംഗത്തിൽ പരിമിതപ്പെടാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘മനുഷ്യർ’ മൂലത്തിന്റെ വ്യാപ്തി കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ മാനുഷിക വളർച്ചയും ക്രിസ്തുശാസ്ത്രപരമായ സംഘർഷസാധ്യതയും
  choice: യേശു ജ്ഞാനത്തിലും ശരീരവളർച്ചയിലും പ്രീതിയിലും യഥാർഥമായി വളർന്നുകൊണ്ടിരുന്നു എന്ന് വാക്യം നേരിട്ട് പറയുന്നു.
  alternative: ദൈവത്വവുമായി സംഘർഷം തോന്നാതിരിക്കാൻ യേശുവിന്റെ വളർച്ചയെ മങ്ങിയതാക്കുകയോ വെറും പ്രത്യക്ഷവളർച്ചയായി വ്യാഖ്യാനിക്കുകയോ ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം യേശുവിന്റെ തുടർച്ചയായ പുരോഗതി വ്യക്തമായി പ്രസ്താവിക്കുന്നു. അവന്റെ യഥാർഥ മാനുഷികതയെക്കുറിച്ചുള്ള ഈ സാക്ഷ്യം പരിഭാഷയിൽ മൃദൂകരിക്കാതെ, അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘വളർന്നുകൊണ്ടിരുന്നു’ തുടർച്ചയായ പുരോഗതി വ്യക്തമാക്കുന്നു. ‘ദൈവത്തിന്റെയും മനുഷ്യരുടെയും പ്രീതിയിൽ’ എന്ന സമാന്തരഘടന മൂലപാഠത്തിലെ ബന്ധപരമായ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
