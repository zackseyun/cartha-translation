id: LUK.2.15
reference: Luke 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: ml
  text: 'ദൂതന്മാർ അവരെ വിട്ട് സ്വർഗത്തിലേക്കു പോയശേഷം, ഇടയന്മാർ പരസ്പരം പറഞ്ഞു: “നമുക്ക് ഇപ്പോൾ ബെത്‌ലഹേം വരെ ചെന്ന് സംഭവിച്ചിരിക്കുന്ന ഈ കാര്യ[a]ം—കർത്താവ് നമുക്കു അറിയിച്ചുതന്നത്—കാണാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കാര്യം” എന്നതിന് “വചനം” അല്ലെങ്കിൽ “സംഭവം” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിലെ ῥῆμα എന്ന പദത്തിന് ‘വചനം,’ ‘കാര്യം,’ ‘സംഭവം’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്താതെ കാലവാക്യഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനസൂത്രമായ ഇത് മലയാളത്തിൽ ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു യാന്ത്രികമായി ചേർത്താൽ വാക്യം ഭാരമുള്ളതാകും; ‘പോയപ്പോൾ’ എന്ന സ്വാഭാവിക ഘടന അതിന്റെ ആഖ്യാനപ്രവർത്തനം വഹിക്കുന്നു.
- source_word: ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανόν
  choice: അവരെ വിട്ട് സ്വർഗത്തിലേക്കു പോയപ്പോൾ
  rationale: മുൻകൃത്യത്തിന്റെ കാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; οὐρανός ഇവിടെ ദൈവിക മണ്ഡലമായ ‘സ്വർഗം’ എന്നാണ്.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: പരസ്പരം പറഞ്ഞു
  rationale: നേരിട്ടുള്ള സംഭാഷണം ആരംഭിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: Διέλθωμεν δὴ ἕως Βηθλέεμ
  choice: നമുക്ക് ഇപ്പോൾ ബെത്‌ലഹേംവരെ ചെല്ലാം
  rationale: ഹോർട്ടേറ്ററി സബ്ജങ്ക്റ്റീവിനെ ‘നമുക്ക് ... ചെല്ലാം’ എന്നും δὴയുടെ അടിയന്തരതയെ ‘ഇപ്പോൾ’ എന്നും ἕωςയുടെ പരിധിബോധത്തെ ‘വരെ’ എന്നും നിലനിർത്തുന്നു.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: സംഭവിച്ചിരിക്കുന്ന ഈ കാര്യം
  rationale: ῥῆμαയ്ക്ക് ‘വചനം, കാര്യം, സംഭവം’ എന്നീ അർഥസാധ്യതകളുണ്ട്; ഇവിടെ അറിയിക്കപ്പെട്ട സംഭവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കാര്യം’ സ്വാഭാവികമാണ്, എന്നാൽ അതിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: കർത്താവ് നമുക്ക് അറിയിച്ചുതന്നത്
  rationale: ἐγνώρισεν എന്നതിന്റെ ‘അറിയിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘വെളിപ്പെടുത്തി’ എന്ന സാങ്കേതിക ദൈവശാസ്ത്രഭാരം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ὁ κύριος എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: കർത്താവ്
  alternative: ദൈവം
  rationale: ഉടൻ വരുന്ന സന്ദർഭത്തിൽ അറിയിപ്പിന്റെ ഉറവിടം ദൈവമാണെങ്കിലും, മൂലപാഠത്തിലെ ‘കർത്താവ്’ എന്ന പദവും ലൂക്കോസിന്റെ ശൈശവവിവരണത്തിലെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും പരിഭാഷയിൽ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘ബെത്‌ലഹേംവരെ’ എന്ന രൂപം ἕωςയുടെ സൂക്ഷ്മത നിലനിർത്തുന്നു; ഇടവരകൾ ബന്ധവാക്യത്തിന്റെ സൂചിതപദം വ്യക്തമാക്കുന്നു.
