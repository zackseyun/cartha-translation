id: LUK.2.28
reference: Luke 2:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἐδέξατο αὐτὸ εἰς τὰς ⸀ἀγκάλας καὶ εὐλόγησεν τὸν θεὸν καὶ εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: ml
  text: 'അവൻ കുഞ്ഞിനെ കൈകളിലെടുത്തു; ദൈവത്തെ വാഴ്ത്തി പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδέξατο
  choice: ഏറ്റുവാങ്ങി
  rationale: δέχομαι എന്നതിന്റെ ‘സ്വീകരിക്കുക/ഏറ്റുവാങ്ങുക’ എന്ന അർഥവും, തുടർന്ന് വരുന്ന ‘കൈകളിൽ’ എന്ന പ്രയോഗം സൂചിപ്പിക്കുന്ന ശാരീരിക പ്രവൃത്തിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: αὐτό
  choice: കുഞ്ഞിനെ
  rationale: നപുംസകലിംഗ സർവനാമം സന്ദർഭത്തിൽ ശിശുവായ യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ മുൻസന്ദർഭത്തിലെ സൂചിത നാമം ഉപയോഗിച്ചു.
- source_word: εἰς τὰς ἀγκάλας
  choice: കൈകളിൽ
  rationale: ἀγκάλαι എന്നത് ചേർത്തുപിടിക്കാനോ വഹിക്കാനോ ഉപയോഗിക്കുന്ന കൈകളെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘തന്റെ’ എന്ന് ചേർക്കാതെ സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു.
- source_word: εὐλόγησεν τὸν θεόν
  choice: ദൈവത്തെ വാഴ്ത്തിക്കൊണ്ട്
  rationale: ദൈവം കർമമായിരിക്കുമ്പോൾ εὐλογέω അനുഗ്രഹിച്ചുപറയുക, സ്തുതിക്കുക, വാഴ്ത്തുക എന്ന ആശയം വഹിക്കുന്നു. ‘ദൈവത്തെ അനുഗ്രഹിച്ചു’ എന്ന മലയാളപ്രയോഗത്തിലെ സാധ്യതയുള്ള തെറ്റിദ്ധാരണ ഒഴിവാക്കി, ദിശാസൂചന വ്യക്തമായി നൽകുന്നു.
- source_word: καὶ εἶπεν
  choice: 'പറഞ്ഞു:'
  rationale: തുടർന്ന് നേരിട്ടുള്ള വാക്കുകൾ വരുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനബന്ധവും കോളനും ഉപയോഗിച്ചു.
- source_word: αὐτός
  choice: അവൻ
  rationale: വിഷയത്തെ വ്യക്തമായി തുടരുന്നു; ‘അവൻ തന്നെയും’ എന്ന് നൽകുന്നത് ഈ സന്ദർഭത്തിലെ ഊന്നൽ അതിരുകടത്തി പ്രകടിപ്പിച്ചേക്കാം.
theological_decisions:
- issue: നപുംസകലിംഗമായ αὐτό എന്ന സർവനാമത്തിന്റെ സൂചന
  choice: ശിശുവായ യേശുവിനെ വ്യക്തിപരമായി സൂചിപ്പിക്കുന്ന ‘കുഞ്ഞിനെ’
  alternative: വ്യാകരണലിംഗത്തെ അത്യന്തം അക്ഷരാർഥത്തിൽ പിന്തുടരുന്ന നപുംസക സൂചന
  rationale: ഗ്രീക്ക് വ്യാകരണലിംഗം മുൻസന്ദർഭത്തിലെ παιδίον എന്ന നപുംസകനാമത്തോട് യോജിക്കുന്നു; എന്നാൽ സൂചിപ്പിക്കപ്പെടുന്നത് യേശു എന്ന വ്യക്തിയാണ്. ‘കുഞ്ഞിനെ’ എന്നത് സന്ദർഭം വ്യക്തമാക്കുന്നു, അധികമായ ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
- issue: εὐλόγησεν τὸν θεόν എന്നതിന്റെ ദിശാസൂചന
  choice: ദൈവത്തെ വാഴ്ത്തി
  alternative: ദൈവത്തെ അനുഗ്രഹിച്ചു
  rationale: മൂലപദത്തിന്റെ ആശയം നിലനിർത്തിക്കൊണ്ട്, മനുഷ്യൻ ദൈവത്തിന് അനുഗ്രഹം നൽകുന്നു എന്ന തെറ്റായ ആധുനിക മലയാള ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാത്മക ഗൗരവമുള്ളതുമായ മലയാളം. മൂലത്തിലെ ആവർത്തിച്ച καί-കളെ അസ്വാഭാവികമായി കൂട്ടിച്ചേർക്കാതെ, ‘വാഴ്ത്തിക്കൊണ്ട്’ എന്ന ഘടനയിലൂടെ പ്രവൃത്തികളുടെ തുടർച്ച പ്രകടമാക്കി.
