source:
  edition: SBLGNT
  text: Καὶ ποιμένες ἦσαν ἐν τῇ χώρᾳ τῇ αὐτῇ ἀγραυλοῦντες καὶ φυλάσσοντες φυλακὰς τῆς νυκτὸς ἐπὶ τὴν ποίμνην αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: ml
  text: ആ പ്രദേശത്തുതന്നെ ഇടയന്മാർ വയലുകളിൽ രാത്രി ചെലവഴിച്ചുകൊണ്ട്[a], തങ്ങളുടെ ആട്ടിൻകൂട്ടത്തിനു രാത്രിയിൽ കാവൽ കാത്തുകൊണ്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തുറസ്സായ സ്ഥലത്ത് താമസിച്ച്.’ വയലുകളിൽ പുറത്തുതന്നെ രാത്രി ചെലവഴിക്കുകയായിരുന്നു എന്നാണ് ഗ്രീക്ക് ക്രിയ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘തങ്ങളുടെ ആട്ടിൻകൂട്ടത്തിന്മേൽ രാത്രിയിലെ കാവൽയാമങ്ങൾ കാത്തുകൊണ്ട്’; അവർ ഊഴമിട്ട് കാവൽ നിന്നിരുന്നുവെന്ന സൂചന ഇതിലുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμένες
  choice: ഇടയന്മാർ
  rationale: ആടുകളെ മേയ്ക്കുകയും പരിപാലിക്കുകയും ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: ആ പ്രദേശത്തുതന്നെ
  rationale: χώρᾳ ഇവിടെ മുമ്പ് പരാമർശിച്ച സ്ഥലത്തിന്റെ സമീപപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രദേശം’ സ്വാഭാവികവും ആധുനികവുമാണ്, ‘തന്നെ’ αὐτῇയുടെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἀγραυλοῦντες
  choice: വയലുകളിൽ രാത്രി കഴിച്ചുകൂട്ടി
  rationale: തുറസ്സായ വയലിൽ രാത്രി താമസിക്കുന്നതെന്ന ക്രിയയുടെ പ്രത്യേക അർത്ഥം വ്യക്തമാക്കുന്നു; വെറും വയലിലുണ്ടായിരുന്നു എന്നതിലുപരി രാത്രിയിലെ പുറത്തുതാമസം പ്രകടമാക്കുന്നു.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: രാത്രിയിൽ മാറിമാറി കാവൽ നിന്നിരുന്നു
  rationale: സജാതീയ പദപ്രയോഗം രാത്രിയിലെ കാവൽയാമങ്ങളെയോ ഊഴങ്ങളെയോ സൂചിപ്പിക്കാം; സ്വാഭാവിക മലയാളത്തിൽ ആ സൂചന നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: തങ്ങളുടെ ആട്ടിൻകൂട്ടത്തിന്
  rationale: ποίμνηയുടെ കൂട്ടവാചക അർത്ഥവും ഇടയന്മാരുടെ സംരക്ഷണബന്ധവും കൃത്യമായി നൽകുന്നു.
- source_word: Καὶ ... ἦσαν
  choice: ആ പ്രദേശത്തുതന്നെ ഇടയന്മാർ ... നിന്നിരുന്നു
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനതുടർച്ചയ്ക്കായി വാക്യം നേരിട്ട് അവതരിപ്പിക്കുന്നു; καίയുടെ തുടർച്ചാസ്വഭാവം സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
