  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ ഇടയജീവിതസാഹചര്യവും രാത്രികാവലിന്റെ ഊഴസൂചനയും സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
