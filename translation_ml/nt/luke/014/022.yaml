id: LUK.14.22
reference: Luke 14:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ δοῦλος· Κύριε, γέγονεν ⸀ὃ ἐπέταξας, καὶ ἔτι τόπος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: ml
  text: 'ദാസൻ പറഞ്ഞു: “യജമാനനേ,[a] അങ്ങ് കല്പിച്ചത് ചെയ്തുകഴിഞ്ഞു; ഇനിയും ഇടമുണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കർത്താവേ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: ദാസൻ
  rationale: വീട്ടുടമയുടെ അധികാരത്തിൻ കീഴിലുള്ള ആളെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ അർഥം ‘ദാസൻ’ സ്വാഭാവികമായും സംക്ഷിപ്തമായും നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ‘വേലക്കാരൻ’ എന്നതിനെക്കാൾ അധീനബന്ധം വ്യക്തമാണ്.
- source_word: Κύριε
  choice: യജമാനനേ
  rationale: ഉപമയിലെ വീട്ടുടമയെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ സന്ദർഭോചിതമായ ‘യജമാനനേ’ സ്വീകരിച്ചു. ‘കർത്താവേ’ എന്നതും പദസാധ്യമാണ്; എന്നാൽ ഇവിടെ ദൈവിക പദവിയെന്ന അർഥം അനാവശ്യമായി മുൻനിർത്താതിരിക്കാൻ അത് അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: γέγονεν ὃ ἐπέταξας
  choice: അങ്ങ് കല്പിച്ചതുപോലെ ചെയ്തിരിക്കുന്നു
  rationale: പൂർണമായ കല്പനാനുഷ്ഠാനവും അതിന്റെ ഇപ്പോഴുള്ള ഫലവും perfect രൂപം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ റിപ്പോർട്ടായി ഈ ഘടന അത് പകരുന്നു.
- source_word: ἐπέταξας
  choice: കല്പിച്ചു
  rationale: ἐπιτάσσω എന്ന ക്രിയയിലെ അധികാരപൂർവമായ നിർദേശത്തിന്റെ ശക്തി ‘കല്പിക്കുക’ നിലനിർത്തുന്നു.
- source_word: ἔτι τόπος ἐστίν
  choice: എന്നിട്ടും ഇനിയും ഇടമുണ്ട്
  rationale: കല്പന നടപ്പാക്കിയ ശേഷവും ശേഷിക്കുന്ന സ്ഥലത്തെ ἔτι സൂചിപ്പിക്കുന്നു; വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ τόπος-ന് ‘ഇടം’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: Κύριε എന്ന അഭിസംബോധനയുടെ അർഥപരിധി
  choice: യജമാനനേ
  alternative: കർത്താവേ
  rationale: ഇത് ഉപമയ്ക്കുള്ളിലെ വീട്ടുടമയോടുള്ള അഭിസംബോധനയാണ്. ‘യജമാനനേ’ ആ കഥാസന്ദർഭം നേരിട്ട് പ്രകടമാക്കുന്നു; അതേസമയം ‘കർത്താവേ’ എന്ന പരമ്പരാഗതവും പദസാധ്യവുമായ വായന അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അങ്ങ്/അങ്ങയുടെ ആദരസൂചക പ്രയോഗം നിലനിർത്തി; വാക്യത്തിന്റെ റിപ്പോർട്ടുശൈലിയും വിരുന്നുസന്ദർഭത്തിലെ ശേഷിക്കുന്ന ഇടവും സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
