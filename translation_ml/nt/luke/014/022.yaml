- from: 'ദാസൻ പറഞ്ഞു: “യജമാനനേ,[a] അങ്ങ് കല്പിച്ചതുപോലെ ചെയ്തിരിക്കുന്നു; എന്നിട്ടും ഇനിയും ഇടമുണ്ട്.”'
  to: 'ദാസൻ പറഞ്ഞു: “യജമാനനേ,[a] അങ്ങ് കല്പിച്ചത് ചെയ്തുകഴിഞ്ഞു; ഇനിയും ഇടമുണ്ട്.”'
