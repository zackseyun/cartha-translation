  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഞാൻ നിങ്ങളോടു പറയുന്നു: ക്ഷണിക്കപ്പെട്ട ആ പുരുഷന്മാരിൽ ആരും എന്റെ അത്താഴം[a] രുചിക്കുകയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ വിരുന്ന്’ അല്ലെങ്കിൽ ‘എന്റെ സായാഹ്നഭക്ഷണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: എന്തെന്നാൽ, ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധവും ὑμῖν ഉൾക്കൊള്ളുന്ന നേരിട്ടുള്ള അഭിസംബോധനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: ആ പുരുഷന്മാരിൽ ആരും
  rationale: οὐδείς എന്ന സമ്പൂർണ നിഷേധവും partitive ഘടനയും സംരക്ഷിക്കുന്നു; ἀνδρῶν എന്ന പുല്ലിംഗസൂചന പൊതുവായ ‘ആളുകൾ’ എന്നു മാറ്റാതെ ‘പുരുഷന്മാർ’ എന്നു നൽകുന്നു.
- source_word: τῶν κεκλημένων
  choice: ക്ഷണിക്കപ്പെട്ട
  rationale: വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ καλέω എന്നതിന്റെ perfect passive participle ലഭിച്ച ക്ഷണത്തെ സൂചിപ്പിക്കുന്നു; ‘വിളിക്കപ്പെട്ട’ എന്നതിനെക്കാൾ സന്ദർഭോചിതമാണ്.
- source_word: γεύσεταί
  choice: രുചിക്കുകയില്ല
  rationale: γεύομαι എന്നതിന്റെ ‘രുചിക്കുക’ എന്ന ദൃശ്യഭാഷ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഭക്ഷണത്തിൽ പങ്കുകൊള്ളുകയില്ല എന്ന വിപുലമായ ആശയവും ഇതിലുണ്ട്.
- source_word: μου τοῦ δείπνου
  choice: എന്റെ അത്താഴം
  rationale: μου എന്ന ഒന്നാംപുരുഷ ഉടമസ്ഥത നിലനിർത്തുന്നു. δεῖπνον പ്രധാനമായോ സായാഹ്നത്തിലോ ഉള്ള ഭക്ഷണത്തെ സൂചിപ്പിക്കാം; ‘അത്താഴം’ സ്വാഭാവികമായ മലയാള സമാനപദമാണ്, എന്നാൽ വിരുന്ന് എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉപമയിലെ ആതിഥേയന്റെ വാക്കുകൾക്ക് ദൈവശാസ്ത്രപരമായ അർത്ഥം നേരിട്ട് ചേർക്കണമോ
  choice: ‘എന്റെ അത്താഴം’ എന്ന ഒന്നാംപുരുഷ ആഖ്യാനരൂപം അതേപടി നിലനിർത്തി
  alternative: ‘എന്റെ വിരുന്ന്’ എന്നു നൽകുകയോ ദൈവരാജ്യവിരുന്നായി വ്യക്തമായി വ്യാഖ്യാനിക്കുകയോ ചെയ്യുക
  rationale: ഗ്രീക്ക് വാചകം ഉപമയിലെ ആതിഥേയന്റെ ശബ്ദത്തിലാണ്. വിവർത്തനം ഉപമയുടെ പ്രതീകത്തെ തുറന്ന് വ്യാഖ്യാനിക്കാതെ അതിന്റെ ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘എന്തെന്നാൽ’ γάρ-ന്റെ വിശദീകരണഭാവം വ്യക്തമാക്കുന്നു; ‘പുരുഷന്മാർ’ മൂലത്തിലെ ലിംഗസൂചന കൃത്യമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
