  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: ml
  text: അത് മണ്ണിനോ വളക്കൂനയ്ക്കോ[a] കൊള്ളുന്നതല്ല; അതിനെ പുറത്തേക്ക് എറിഞ്ഞുകളയുന്നു. കേൾക്കാൻ ചെവിയുള്ളവൻ കേൾക്കട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചാണകക്കൂനയ്ക്ക്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കേൾക്കാൻ ചെവിയുള്ള ആരെങ്കിലും കേൾക്കട്ടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: മണ്ണ്
  rationale: കൃഷിയുമായി ബന്ധപ്പെട്ട ഈ ഉപമയിൽ γῆ എന്നത് പ്രപഞ്ചമായ ‘ഭൂമി’യെക്കാൾ കൃഷിക്കുള്ള മണ്ണിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മണ്ണ്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: κοπρίαν
  choice: വളക്കൂന
  rationale: κοπρία ചാണകമോ വളമോ കൂട്ടിയിട്ടിരിക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ‘വളക്കൂന’ കാർഷികസന്ദർഭം വ്യക്തമായി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: εὔθετόν
  choice: കൊള്ളുന്നതല്ല
  rationale: εὔθετος എന്നതിന്റെ ‘അനുയോജ്യം, ഉപയോഗത്തിന് പറ്റിയത്’ എന്ന വിലയിരുത്തൽഭാവം ‘കൊള്ളുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: അതിനെ പുറത്തേക്ക് എറിഞ്ഞുകളയുന്നു
  rationale: ഗ്രീക്കിലെ അനിശ്ചിത കർത്താവോടുകൂടിയ സജീവ ബഹുവചനക്രിയയുടെ പ്രവൃത്തിഭാവവും ἔξω എന്നതിന്റെ സ്ഥലസൂചനയും ഈ പരിഭാഷ നിലനിർത്തുന്നു; മലയാളത്തിൽ കർത്താവിനെ പ്രത്യേകം ചേർക്കാതെ പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: കേൾക്കാൻ ചെവിയുള്ളവൻ കേൾക്കട്ടെ
  rationale: ὁ ἔχων എന്ന ഏകവചന പ്രതിനിധിപ്രയോഗവും ἀκουέτω എന്ന ആജ്ഞാഭാവവും മലയാളത്തിൽ അടുത്തും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: സമാപന ആഹ്വാനത്തിലെ പ്രതിനിധിപരമായ പുല്ലിംഗ ഏകവചനം
  choice: കേൾക്കാൻ ചെവിയുള്ളവൻ കേൾക്കട്ടെ
  alternative: കേൾക്കാൻ ചെവിയുള്ള ആരും കേൾക്കട്ടെ
  rationale: ഗ്രീക്ക് വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും പൊതുവായി ഏവരെയും പ്രതിനിധീകരിക്കുന്നു. അതിനെ ബഹുവചനമാക്കി മാറ്റാതെ രൂപവും ആജ്ഞാഭാവവും നിലനിർത്തി; പൊതുവായ അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. കാർഷികരൂപകം മൂർത്തമായി നിലനിർത്തി; പഴഞ്ചൻ പദങ്ങളും വിഭാഗീയ ദൈവശാസ്ത്രവ്യാഖ്യാനങ്ങളും ഒഴിവാക്കി.
