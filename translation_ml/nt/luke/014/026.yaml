revisions:
- from: ആരെങ്കിലും എന്റെ അടുക്കൽ വരുകയും സ്വന്തം അപ്പനെയും അമ്മയെയും ഭാര്യയെയും മക്കളെയും സഹോദരന്മാരെയും സഹോദരിമാരെയും—അതെ, സ്വന്തം ജീവനെപ്പോലും[b]—വെറുക്കാതിരിക്കുകയും ചെയ്യുന്നെങ്കിൽ[a], അയാൾക്ക് എന്റെ ശിഷ്യനായിരിക്കാൻ കഴിയില്ല.
  to: ആരെങ്കിലും എന്റെ അടുക്കൽ വന്ന് സ്വന്തം അപ്പനെയും അമ്മയെയും ഭാര്യയെയും മക്കളെയും സഹോദരന്മാരെയും സഹോദരിമാരെയും—സ്വന്തം ജീവനെയുംപോലും[b]—വെറുക്കുന്നില്ലെങ്കിൽ[a], ആ വ്യക്തിക്ക് എന്റെ ശിഷ്യനായിരിക്കാൻ കഴിയില്ല.
  rationale: The revision corrects the Malayalam verbal negation so that it faithfully renders οὐ μισεῖ (‘does not hate’) and revises footnote a to give a clear, grammatically complete comparative alternative. The literal force of ‘hate’ remains in the main text; the footnote preserves the contextual priority sense without resolving the expression into a doctrinal paraphrase.
