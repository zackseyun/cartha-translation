id: LUK.14.26
reference: Luke 14:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: ml
  text: ആരെങ്കിലും എന്റെ അടുക്കൽ വന്ന് സ്വന്തം അപ്പനെയും അമ്മയെയും ഭാര്യയെയും മക്കളെയും സഹോദരന്മാരെയും സഹോദരിമാരെയും—സ്വന്തം ജീവനെയുംപോലും[b]—വെറുക്കുന്നില്ലെങ്കിൽ[a], ആ വ്യക്തിക്ക് എന്റെ ശിഷ്യനായിരിക്കാൻ കഴിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നെക്കാൾ കുറവായി സ്നേഹിക്കുന്നില്ലെങ്കിൽ.’ ക്രിയയുടെ അക്ഷരാർഥം ‘വെറുക്കുക’ എന്നാണ്. എന്നാൽ ഇവിടെ യേശുവിനോടുള്ള വിശ്വസ്തത ഏറ്റവും അടുത്ത കുടുംബബന്ധങ്ങളെക്കാൾപോലും മുൻഗണന നേടണമെന്ന ആവശ്യമാണ് അത് പ്രകടിപ്പിക്കുന്നത്; മത്തായി 10:37 താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സ്വന്തം പ്രാണനെയും’ അല്ലെങ്കിൽ ‘സ്വന്തം സ്വത്വത്തെയും.’ ശിഷ്യത്വത്തിന്റെ വിലയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ψυχή എന്നത് ഒരാളുടെ ‘ജീവൻ’ എന്ന അർഥത്തിലായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: വെറുക്കുക
  rationale: ഗ്രീക്ക് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘വെറുക്കുക’ എന്നാണ്. ഈ സന്ദർഭത്തിൽ യേശുവിനോടുള്ള വിശ്വസ്തത ഏറ്റവും അടുത്ത കുടുംബബന്ധങ്ങളെക്കാൾ മുൻഗണന നേടണമെന്ന താരതമ്യപരമായ ആശയം ഉണ്ടായിരിക്കാമെങ്കിലും, മുഖ്യപാഠത്തിൽ അതിനെ ‘കുറച്ചുമാത്രം സ്നേഹിക്കുക’ എന്നു മൃദൂകരിക്കാതെ യേശുവിന്റെ വാക്കുകളുടെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: ἔρχεται πρός με
  choice: എന്റെ അടുക്കൽ വരുന്നു
  rationale: πρός എന്നതോടുകൂടിയ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള ബന്ധപരമായ ദിശ സംരക്ഷിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘എന്നെ അനുഗമിക്കാൻ വരുന്നു’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: πατέρα ἑαυτοῦ
  choice: സ്വന്തം അപ്പൻ
  rationale: ἑαυτοῦ എന്ന പ്രത്യാവർത്തക സർവനാമത്തിന്റെ വ്യക്തിപരമായ ഊന്നൽ ‘സ്വന്തം’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്കു സ്വാഭാവികവും മാന്യവുമായ ആധുനിക പ്രയോഗമാണ്.
- source_word: γυναῖκα
  choice: ഭാര്യ
  rationale: കുടുംബാംഗങ്ങളുടെ ഈ പട്ടികയിൽ γυνή എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം പൊതുവായ ‘സ്ത്രീ’ എന്നതല്ല, ‘ഭാര്യ’ എന്നതാണ്.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: സഹോദരന്മാരും സഹോദരിമാരും
  rationale: പുരുഷ-സ്ത്രീ സഹോദരപദങ്ങൾ രണ്ടും മൂലപാഠത്തിൽ പ്രത്യേകം നൽകിയിരിക്കുന്നതിനാൽ രണ്ടും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἔτι τε καὶ
  choice: അതെ, ... പോലും
  rationale: പട്ടികയിലെ അവസാന ഇനത്തിന് നൽകുന്ന ഉച്ചസ്ഥായിയിലുള്ള ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ψυχὴν ἑαυτοῦ
  choice: സ്വന്തം ജീവൻ
  rationale: ശിഷ്യത്വത്തിന്റെ വിലയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ψυχή ഒരാളുടെ ജീവൻ അഥവാ സ്വയം എന്ന അർഥത്തിലാണ്; ഇടുങ്ങിയ ദേഹാതീത ആശയം സൂചിപ്പിക്കാവുന്ന ‘ആത്മാവ്’ എന്നതിനെക്കാൾ ‘ജീവൻ’ വ്യക്തമാണ്.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: എന്റെ ശിഷ്യനായിരിക്കാൻ കഴിയില്ല
  rationale: വെറും വിലക്കല്ല, ഈ നിലപാടില്ലാതെ ശിഷ്യത്വം അസാധ്യമാണെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: μισεῖ എന്ന യേശുവിന്റെ കടുത്ത പ്രയോഗം മുഖ്യപാഠത്തിൽ മൃദൂകരിക്കണമോ എന്നത്
  choice: മുഖ്യപാഠത്തിൽ ‘വെറുക്കുക’ നിലനിർത്തി, താരതമ്യപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: മുഖ്യപാഠത്തിൽ ‘കുറച്ചുമാത്രം സ്നേഹിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: യേശുവിന്റെ വാക്കുകളുടെ മനഃപൂർവമായ തീവ്രതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഭാഷയിൽ സംരക്ഷിക്കണം. അതേസമയം, മത്തായി 10:37-നോട് താരതമ്യം ചെയ്യുമ്പോൾ കാണുന്ന മുൻഗണനാ/താരതമ്യ ആശയം അടിക്കുറിപ്പിൽ നൽകുന്നത് വായനക്കാരന് ആവശ്യമായ ഭാഷാപരമായ വിവരം നൽകുന്നു.
- issue: ഈ വാക്യത്തിലെ ψυχή എന്നതിന്റെ അർഥം
  choice: ‘ജീവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘സ്വയം’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഇവിടെ വിഷയം ശിഷ്യത്വത്തിന്റെ വിലയും സ്വന്തം ജീവന്റെയും മേലുള്ള അവകാശം വിട്ടുകൊടുക്കുന്നതുമാണ്. ‘ജീവൻ’ എന്നത് ഈ സന്ദർഭാർഥം വ്യക്തമായി നൽകുകയും മനുഷ്യസ്വഭാവത്തെക്കുറിച്ചുള്ള ഇടുങ്ങിയ ദൈവശാസ്ത്ര നിഗമനം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. കുടുംബപ്പട്ടികയുടെ സമഗ്രതയും അവസാന ഇനത്തിലെ ഉച്ചസ്ഥായിയിലുള്ള ഊന്നലും ദീർഘവിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ച് നിലനിർത്തി. ‘വെറുക്കുക’ എന്ന കടുത്ത പദം വിശദീകരിച്ചു മാറ്റാതെ മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും സാധ്യതയുള്ള താരതമ്യാർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
