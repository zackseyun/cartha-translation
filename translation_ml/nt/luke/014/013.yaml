  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: ml
  text: എന്നാൽ നീ വിരുന്നൊരുക്കുമ്പോഴെല്ലാം[a], ദരിദ്രരെയും ശാരീരിക വൈകല്യമുള്ളവരെയും നടക്കാൻ പ്രയാസമുള്ളവരെയും[b] കാഴ്ചയില്ലാത്തവരെയും ക്ഷണിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സദ്യ നടത്തുമ്പോഴെല്ലാം’ അല്ലെങ്കിൽ ‘സ്വീകരണം ഒരുക്കുമ്പോഴെല്ലാം.’
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി ‘മുടന്തരെയും.’ ഗ്രീക്ക് പദം നടക്കുന്നതിൽ വൈകല്യമുള്ളവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ നിർദേശത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὅταν
  choice: എപ്പോഴെല്ലാം … അപ്പോൾ എന്ന അർഥത്തിൽ ‘…ചെയ്യുമ്പോഴെല്ലാം’
  rationale: സബ്ജങ്ക്റ്റീവിനോടുകൂടിയ അനിശ്ചിത കാലപ്രയോഗം ആവർത്തിക്കാവുന്ന ഏതു സന്ദർഭത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: δοχὴν ποιῇς
  choice: നീ വിരുന്നൊരുക്കുമ്പോഴെല്ലാം
  rationale: ‘സ്വീകരണം/വിരുന്ന് നടത്തുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വിശാലവുമായ മലയാളരൂപം; ഒരു പ്രത്യേക ഭക്ഷണസമയമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: κάλει
  choice: ക്ഷണിക്കുക
  rationale: വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ καλέω എന്നത് ‘വിളിക്കുക’ എന്നതിലുപരി അതിഥിയായി ക്ഷണിക്കുക എന്നാണ്.
- source_word: πτωχούς
  choice: ദരിദ്രരെ
  rationale: സാമ്പത്തികമായി ദരിദ്രരായ ആളുകളെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സാധാരണവുമായ പ്രയോഗം.
- source_word: ἀναπείρους
  choice: ശാരീരിക വൈകല്യമുള്ളവരെ
  rationale: ശരീരാവയവങ്ങളിലെ വൈകല്യത്തെ സൂചിപ്പിക്കുന്ന വിശാലമായ പദം; അപമാനകരമാകാവുന്ന പഴയ പ്രയോഗങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: χωλούς
  choice: നടക്കാൻ പ്രയാസമുള്ളവരെ
  rationale: നടപ്പിനെ ബാധിക്കുന്ന വൈകല്യമുള്ളവരെ പ്രത്യേകമായി സൂചിപ്പിക്കുകയും ἀναπείρους എന്ന വിശാല വിഭാഗത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τυφλούς
  choice: കാഴ്ചയില്ലാത്തവരെ
  rationale: അന്ധരായ ആളുകളെ വ്യക്തവും ആദരപൂർവവുമായ ആധുനിക ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: വൈകല്യവുമായി ബന്ധപ്പെട്ട രണ്ടു ഗ്രീക്ക് പദങ്ങളുടെ വ്യത്യാസം
  choice: ἀναπείρους എന്നത് ‘ശാരീരിക വൈകല്യമുള്ളവർ’ എന്നും χωλούς എന്നത് ‘നടക്കാൻ പ്രയാസമുള്ളവർ’ എന്നും വേർതിരിച്ചു പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടിനെയും ‘വൈകല്യമുള്ളവർ’ എന്നു ലയിപ്പിക്കുക; അല്ലെങ്കിൽ പരമ്പരാഗതമായി ‘അംഗഹീനർ, മുടന്തർ’ എന്നു നൽകുക.
  rationale: ഗ്രീക്കിലെ പട്ടികയുടെ വ്യത്യസ്ത വിഭാഗങ്ങൾ നിലനിർത്തിക്കൊണ്ട്, അപമാനകരമല്ലാത്ത ആധുനിക മലയാളം ഉപയോഗിക്കുന്നു. സാമൂഹികമായി അവഗണിക്കപ്പെടുന്നവർക്കു വിരുന്നാതിഥ്യം നൽകണമെന്ന കല്പനയുടെ ഊന്നൽ ഇതിലൂടെ സംരക്ഷിക്കപ്പെടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ നാല് വിഭാഗങ്ങളുടെ പട്ടികയും ἀναπείρους/χωλούς വ്യത്യാസവും നിലനിർത്തിയിരിക്കുന്നു.
