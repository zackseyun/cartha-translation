id: LUK.14.28
reference: Luke 14:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: ml
  text: നിങ്ങളിൽ ഒരാൾ ഒരു ഗോപുരം പണിയാൻ ആഗ്രഹിക്കുന്നുവെങ്കിൽ, അതു പൂർത്തിയാക്കാൻ തനിക്കു മതിയായ വകയുണ്ടോ എന്ന് ആദ്യം ഇരുന്ന് ചെലവ് കണക്കാക്കുകയില്ലേ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ഒരാൾ ... എങ്കിൽ ... ഇല്ലേ?
  rationale: τίς ἐξ ὑμῶν ശ്രോതാക്കളെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന, അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്. മുൻസന്ദർഭത്തോടുള്ള γάρ-ന്റെ ബന്ധം മലയാളത്തിലെ ചോദ്യത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: θέλων
  choice: ആഗ്രഹിക്കുന്നുവെങ്കിൽ
  rationale: ഗോപുരം പണിയാനുള്ള ഉദ്ദേശമോ ആഗ്രഹമോ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപം മലയാളത്തിൽ നിബന്ധനാപരമായ ഘടനയിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: πύργον οἰκοδομῆσαι
  choice: ഒരു ഗോപുരം പണിയാൻ
  rationale: πύργος എന്ന ദൃശ്യരൂപവും οἰκοδομέω എന്ന സാധാരണ നിർമാണക്രിയയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: οὐχὶ πρῶτον καθίσας
  choice: ആദ്യം ഇരുന്ന് ... കണക്കാക്കുകയില്ലേ?
  rationale: οὐχί അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യത്തെ അടയാളപ്പെടുത്തുന്നു; καθίσας പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തി ആയതിനാൽ ‘ആദ്യം ഇരുന്ന്’ എന്നു നൽകി.
- source_word: ψηφίζει τὴν δαπάνην
  choice: ചെലവ് കണക്കാക്കുക
  rationale: ψηφίζω ഇവിടെ നിർമാണച്ചെലവ് കൃത്യമായി കണക്കുകൂട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു; δαπάνη സ്വാഭാവികമായി ‘ചെലവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: അതു പൂർത്തിയാക്കാൻ വേണ്ടത്ര വക തനിക്കുണ്ടോ എന്നു നോക്കാൻ
  rationale: ഗ്രീക്കിലെ അക്ഷരാർഥം ‘പൂർത്തീകരണത്തിനായി തനിക്കുണ്ടോ’ എന്നാണ്. സന്ദർഭത്തിൽ മതിയായ സാമ്പത്തികശേഷിയാണ് ഉദ്ദേശിക്കുന്നത്; ‘വേണ്ടത്ര വക’ ഈ പരോക്ഷാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, ‘അതു’ നിർമാണപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൃഷ്ടാന്തത്തിന്റെ അലങ്കാരചോദ്യഭാവം നിലനിർത്തി; അനാവശ്യമായ സാങ്കേതികമോ മതവിഭാഗപരമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
