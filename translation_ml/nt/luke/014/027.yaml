id: LUK.14.27
reference: Luke 14:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: ml
  text: സ്വന്തം കുരിശ് ചുമന്ന് എന്റെ പിന്നാലെ വരാത്തവന് എന്റെ ശിഷ്യനായിരിക്കാൻ കഴിയില്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വന്തം കുരിശ് വഹിച്ച്.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘എന്റെ പിന്നിൽ വരുക’; ‘എന്നെ അനുഗമിക്കുക’ എന്ന സാധാരണ ശിഷ്യത്വപ്രയോഗവുമായി താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: വരാത്തവന്
  rationale: അനിശ്ചിത ബന്ധസർവനാമത്തിന്റെ പൊതുവ്യാപകമായ വ്യവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായ നിഷേധാത്മക ബന്ധരൂപത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: βαστάζει
  choice: ചുമന്നുകൊണ്ട്
  rationale: വസ്തുവിനെ ചുമക്കുക എന്ന ദൃശ്യാർഥവും ശിഷ്യത്വത്തിന്റെ വില സഹിക്കുക എന്ന രൂപകാർഥവും നിലനിർത്തുന്നു.
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: സ്വന്തം കുരിശ്
  rationale: ἑαυτοῦ നൽകുന്ന ആത്മവാചക ഊന്നൽ ‘സ്വന്തം’ വഴി സംരക്ഷിക്കുന്നു; മലയാളരൂപം അനാവശ്യമായി ലിംഗം നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἔρχεται ὀπίσω μου
  choice: എന്റെ പിന്നാലെ വരാത്തവന്
  rationale: ‘എന്റെ പിന്നിൽ വരുക’ എന്ന ചലനദൃശ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുകയും അതിനെ വെറും ‘അനുഗമിക്കുക’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: എന്റെ ശിഷ്യനായിരിക്കാൻ കഴിയില്ല
  rationale: നിരോധനം മാത്രമല്ല, അയോഗ്യതയെയോ അസാധ്യതയെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് നിർമാണത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: μαθητής
  choice: ശിഷ്യൻ
  rationale: സുവിശേഷസന്ദർഭത്തിലെ പ്രതിബദ്ധനായ അനുയായിയും പഠിതാവും എന്ന ആശയം നൽകുന്ന സ്ഥാപിത മലയാളപദം.
theological_decisions:
- issue: ἑαυτοῦ എന്ന ഏകവചന ആത്മവാചക സർവനാമത്തിന്റെ ലിംഗസൂചന
  choice: ‘സ്വന്തം കുരിശ്’ എന്ന സ്വാഭാവികവും ലിംഗനിരപേക്ഷവുമായ മലയാളപ്രയോഗം
  alternative: ‘അവന്റെ സ്വന്തം കുരിശ്’
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ഏകവചനം പൊതുപ്രതിനിധിയായാണ് പ്രവർത്തിക്കുന്നത്. മലയാളത്തിൽ ‘സ്വന്തം’ ആത്മവാചക ഊന്നൽ പൂർണമായി നിലനിർത്തുന്നതിനാൽ പുരുഷന്മാർക്ക് മാത്രമായി തോന്നാവുന്ന അധിക സർവനാമം ചേർക്കേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘കുരിശ്’, ‘ശിഷ്യൻ’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ ചലനദൃശ്യവും അസാധ്യതയുടെ ശക്തിയും സംരക്ഷിച്ചു.
