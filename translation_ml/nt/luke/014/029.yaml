reference: Luke 14:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα μήποτε θέντος αὐτοῦ θεμέλιον καὶ μὴ ἰσχύοντος ἐκτελέσαι πάντες οἱ θεωροῦντες ἄρξωνται ⸂αὐτῷ ἐμπαίζειν⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/029.yaml
  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: ml
  text: അല്ലെങ്കിൽ[a], അയാൾ അടിത്തറയിട്ടശേഷം പണി പൂർത്തിയാക്കാൻ കഴിയാതെ വന്നാൽ, അതു കാണുന്നവരെല്ലാം അയാളെ പരിഹസിക്കാൻ തുടങ്ങിയേക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഒരുപക്ഷേ, അയാൾ അടിത്തറയിട്ടശേഷം പണി പൂർത്തിയാക്കാൻ കഴിയാതെവരികയും, അതു കാണുന്നവരെല്ലാം അയാളെ പരിഹസിക്കാൻ തുടങ്ങുകയും ചെയ്യാതിരിക്കേണ്ടതിന്.’'
    reason: ἵνα μήποτε എന്ന പ്രയോഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥമായ, ഒഴിവാക്കേണ്ട സാധ്യത സൂചിപ്പിക്കുന്ന പകരം വിവർത്തനം.
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: അല്ലെങ്കിൽ
  rationale: ഒഴിവാക്കേണ്ട അനിഷ്ടഫലത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ മുന്നറിയിപ്പായി അവതരിപ്പിക്കുന്നു; മൂലത്തിലെ സാധ്യതാഭാവം അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥമായി സൂചിപ്പിക്കുന്നു.
- source_word: θέντος αὐτοῦ
  choice: അയാൾ അടിത്തറയിട്ടശേഷം
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സൂചിപ്പിക്കുന്ന, മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: θεμέλιον
  choice: അടിത്തറ
  rationale: നിർമാണസന്ദർഭത്തിൽ θεμέλιον എന്നതിന്റെ സ്വാഭാവികവും സാധാരണക്കാർക്ക് വ്യക്തവുമായ മലയാളരൂപം.
- source_word: μὴ ἰσχύοντος
  choice: കഴിയാതെ വന്നാൽ
  rationale: ഇവിടെ ἰσχύω ശാരീരിക ശക്തിയേക്കാൾ കഴിവിനെയോ ശേഷിയെയോ സൂചിപ്പിക്കുന്നു; സാഹചര്യത്തിൽ പരാജയപ്പെടുന്ന സാധ്യതയും ഈ രൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκτελέσαι
  choice: പണി പൂർത്തിയാക്കാൻ
  rationale: നിർമാണം അന്ത്യത്തോളം കൊണ്ടുപോകുക എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ആവശ്യമായ സന്ദർഭസൂചനയായി ‘പണി’ ചേർത്തിരിക്കുന്നു.
- source_word: πάντες οἱ θεωροῦντες
  choice: അതു കാണുന്നവരെല്ലാം
  rationale: θεωρέω എന്നതിലെ കാണുക/നിരീക്ഷിക്കുക എന്ന അർഥം നിലനിർത്തുന്നു; ‘അതു’ പൂർത്തിയാകാത്ത നിർമാണസ്ഥിതിയെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: ἄρξωνται
  choice: തുടങ്ങും
  rationale: മുന്നറിയിപ്പ് ഘടനയിലെ സാധ്യതാപരമായ ഫലം മലയാളത്തിലെ വ്യവസ്ഥാപിത വാക്യക്രമത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: αὐτῷ ἐμπαίζειν
  choice: അയാളെ പരിഹസിക്കാൻ
  rationale: ἐμπαίζω എന്നതിന്റെ നിന്ദാപരമായ പരിഹാസഭാവം മാന്യവും വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
