  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. നിർമാണസന്ദർഭം വ്യക്തമാക്കാൻ ‘പണി’ ചേർത്തിട്ടുണ്ട്; മൂലത്തിലെ മുന്നറിയിപ്പും സാധ്യതാഭാവവും മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
