id: LUK.14.14
reference: Luke 14:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: ml
  text: അങ്ങനെ, അവർക്ക് നിനക്കു പ്രതിഫലം നൽകാൻ കഴിയാത്തതിനാൽ നീ അനുഗൃഹീതനായിരിക്കും; കാരണം, നീതിമാന്മാരുടെ പുനരുത്ഥാനത്തിൽ നിനക്കു പ്രതിഫലം ലഭിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: അനുഗൃഹീതൻ
  rationale: യേശുവിന്റെ വചനങ്ങളിലെ ദൈവിക അംഗീകാരവും ഭാവിയിലെ അനുഗ്രഹവും ഉൾക്കൊള്ളുന്ന μακάριος എന്ന പദത്തിന്റെ ഭാരം സംരക്ഷിക്കുന്നു; ‘സന്തോഷവാൻ’ എന്നത് അതിനെ വെറും മാനസികാവസ്ഥയായി ചുരുക്കാം.
- source_word: ἔσῃ
  choice: ആയിരിക്കും
  rationale: εἰμί എന്ന ക്രിയയുടെ ഭാവികാലരൂപത്തെ സ്വാഭാവികമായി പകർന്നു, അനുഗൃഹീതൻ എന്ന വിധേയപദവുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: -തിനാൽ
  rationale: അനുഗൃഹീതനാകുന്നതിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന കാരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: അവർക്ക് നിനക്കു പ്രതിഫലം നൽകാൻ കഴിയാത്തതിനാൽ
  rationale: ‘തിരിച്ചുനൽകാൻ അവർക്കില്ല’ എന്ന അക്ഷരാർഥഘടന ഇവിടെ ബാധ്യതയില്ലായ്മയല്ല, കഴിവോ മാർഗമോ ഇല്ലായ്മയാണ് സൂചിപ്പിക്കുന്നത്; ‘കഴിയാത്തതിനാൽ’ ആ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀνταποδοθήσεται
  choice: നിനക്കു പ്രതിഫലം ലഭിക്കും
  rationale: ഭാവികാല കർമണിപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും മുമ്പുള്ള പ്രതിഫലനൽകലുമായുള്ള ആശയബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γάρ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന γάρ-ന്റെ ബന്ധം മലയാളത്തിലെ അർധവിരാമത്തിനുശേഷമുള്ള പ്രസ്താവനാക്രമത്തിൽ വ്യക്തമാണ്; ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് ഇവിടെ അനാവശ്യമായി ഔപചാരികമാകും.
- source_word: ἐν τῇ ἀναστάσει
  choice: പുനരുത്ഥാനത്തിൽ
  rationale: ἐν എന്നതിന്റെ രൂപവും സംഭവസമയത്തെ സൂചിപ്പിക്കുന്ന അർഥവും സംരക്ഷിക്കുന്ന, സഭാപരിചിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: τῶν δικαίων
  choice: നീതിമാന്മാരുടെ
  rationale: ആരുടെ പുനരുത്ഥാനമാണെന്ന് ജനിറ്റീവ് ഘടനയോടെ വ്യക്തമാക്കുകയും δίκαιος എന്ന പദത്തിന്റെ ധാർമിക-ദൈവശാസ്ത്രപരമായ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘നീതിമാന്മാരുടെ പുനരുത്ഥാനം’ എന്നതിന്റെ അർഥം
  choice: ഭാവിയിൽ നീതിമാന്മാരുമായി ബന്ധപ്പെട്ട പുനരുത്ഥാനം എന്ന നിലയിൽ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: എല്ലാവരുടെയും ഒരൊറ്റ പുനരുത്ഥാനത്തിൽ നീതിമാന്മാർക്കുള്ള ഊന്നൽ; അല്ലെങ്കിൽ മറ്റുള്ളവരിൽനിന്നു വേറിട്ട നീതിമാന്മാരുടെ പുനരുത്ഥാനം.
  rationale: വാക്യം ഭാവിയിലെ ദൈവിക പ്രതിഫലത്തെ നീതിമാന്മാരുടെ പുനരുത്ഥാനവുമായി ബന്ധിപ്പിക്കുന്നു; പുനരുത്ഥാനങ്ങളുടെ സമയക്രമമോ ഘടനയോ സംബന്ധിച്ച തർക്കം വിവർത്തനം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ഏകവചന അഭിസംബോധന ഉപയോഗിച്ചു. ‘പ്രതിഫലം’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ἀνταποδίδωμι പദകുടുംബത്തിന്റെ പരസ്പരബന്ധം നിലനിർത്തുന്നു. ഈ കരടിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല; അതിനാൽ പ്രധാനപാഠത്തിൽ അടിക്കുറിപ്പുചിഹ്നങ്ങളുമില്ല.
