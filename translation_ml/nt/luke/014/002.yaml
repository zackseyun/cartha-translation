  yaml_path: translation/nt/luke/014/002.yaml
  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: ml
  text: അതാ, നീർക്കെട്ട് ബാധിച്ച ഒരു മനുഷ്യൻ[a] അവന്റെ മുമ്പിൽ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ശരീരത്തിൽ അസാധാരണമായി ദ്രാവകം കെട്ടി വീക്കമുണ്ടാകുന്ന അവസ്ഥ ബാധിച്ച ഒരാൾ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന സംയോജകത്തിന്റെ പ്രവാഹം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ ഇത് കർശനമായ സമയക്രമം നിർവചിക്കുന്നില്ല.
- source_word: ἰδοὺ
  choice: അതാ
  rationale: ഒരു അപ്രതീക്ഷിത സാന്നിധ്യത്തിലേക്ക് വായനക്കാരന്റെ ശ്രദ്ധ തിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄνθρωπός τις
  choice: ഒരു മനുഷ്യൻ
  rationale: പ്രത്യേക വ്യക്തിയെങ്കിലും പേരുപറയാത്ത ഒരാളെ τις സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ അനിശ്ചിതപ്രയോഗമായ ‘ഒരു മനുഷ്യൻ’ ഇത് സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: ἦν
  choice: ഉണ്ടായിരുന്നു
  rationale: εἰμί എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം ഇവിടെ ആ മനുഷ്യന്റെ സാന്നിധ്യം വിവരിക്കുന്നു.
- source_word: ὑδρωπικὸς
  choice: നീർക്കെട്ട് ബാധിച്ച
  rationale: അസാധാരണമായി ശരീരത്തിൽ ദ്രാവകം കെട്ടി വീക്കമുണ്ടാകുന്ന അവസ്ഥ ബാധിച്ച വ്യക്തിയെയാണ് ഈ വിശേഷണം സൂചിപ്പിക്കുന്നത്; ‘നീർക്കെട്ട്’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനിക മലയാളമാണ്.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: അവന്റെ മുമ്പിൽ
  rationale: സ്ഥലപരമായി മുന്നിലായിരിക്കുക എന്നതും ഒരാളുടെ സന്നിധിയിലായിരിക്കുക എന്നതും ഉൾക്കൊള്ളാൻ കഴിയുന്ന മൂലപാഠത്തിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
