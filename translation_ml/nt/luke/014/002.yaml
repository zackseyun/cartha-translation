  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘അതാ’ ലൂക്കോസിന്റെ ശ്രദ്ധതിരിക്കുന്ന ആഖ്യാനശൈലി നിലനിർത്തുന്നു; ‘അവന്റെ മുമ്പിൽ’ എന്നത് സ്ഥലവും സന്നിധിയും സംബന്ധിച്ച മൂലപാഠത്തിലെ സാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു.
