  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: ml
  text: നിന്നെയും അയാളെയും ക്ഷണിച്ചയാൾ വന്ന് നിന്നോടു, “നിന്റെ സ്ഥലം ഇയാൾക്കു വിട്ടുകൊടുക്കുക,” എന്നു പറയും. അപ്പോൾ നീ ലജ്ജയോടെ അവസാനത്തെ സ്ഥാനം[a] കൈക്കൊള്ളാൻ തുടങ്ങും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഏറ്റവും താഴ്ന്ന സ്ഥാനം.” τὸν ἔσχατον τόπον എന്ന ഗ്രീക്ക് പ്രയോഗം ക്രമത്തിലെ അവസാനത്തെ സ്ഥാനത്തെ സൂചിപ്പിക്കാം; ഈ വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ അതു ഏറ്റവും കുറഞ്ഞ മാനമുള്ള ഇരിപ്പിടത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: നിന്നെയും അയാളെയും ക്ഷണിച്ചയാൾ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന ഗ്രീക്ക് കൃുദന്തരൂപം ക്ഷണിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; രണ്ട് അതിഥികളെയും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: വന്ന് നിന്നോട് ... എന്നു പറയും
  rationale: ഭാവികാല മുഖ്യക്രിയയോടു ചേർന്ന മുൻകാല കൃുദന്തത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമപ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു.
- source_word: Δὸς τούτῳ τόπον
  choice: ഈ മനുഷ്യന് നിന്റെ സ്ഥലം കൊടുക്കുക
  rationale: വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ മറ്റെയാൾക്കായി സ്വന്തം ഇരിപ്പിടമോ മാനസ്ഥാനമോ വിട്ടുകൊടുക്കുക എന്ന ആശയം വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘നിന്റെ’ എന്നത് സ്വാഭാവികതയ്ക്കായി ചേർത്തിരിക്കുന്നു.
- source_word: μετὰ αἰσχύνης
  choice: ലജ്ജയോടെ
  rationale: αἰσχύνηയിലെ സാമൂഹിക അപമാനത്തിന്റെയും നാണക്കേടിന്റെയും ശക്തി ചുരുക്കമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: τὸν ἔσχατον τόπον
  choice: ഏറ്റവും പിന്നിലെ സ്ഥാനം
  rationale: ἔσχατος എന്നതിന്റെ ക്രമത്തിലെ അവസാനസ്ഥാനം എന്ന അർഥം നിലനിർത്തുകയും വിരുന്നിലെ ഏറ്റവും കുറഞ്ഞ മാനസ്ഥാനമെന്ന സൂചന തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: ἄρξῃ ... κατέχειν
  choice: സ്വീകരിക്കാൻ തുടങ്ങും
  rationale: ἄρξῃയുടെ ‘തുടങ്ങുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; κατέχειν ഇവിടെ ആ സ്ഥാനം കൈക്കൊള്ളുക/അധിവസിക്കുക എന്ന സന്ദർഭാർഥത്തിലാണ്.
