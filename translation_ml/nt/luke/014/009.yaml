review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the host’s arrival, address, the shame motif, and the final/lowest-place ambiguity. However, “സ്വീകരിക്കാൻ” ordinarily means ‘to receive/accept,’ whereas κατέχειν here means to occupy or take possession of a seating place. “ഏറ്റവും പിന്നിലെ” can suggest physical rearmost position more strongly than the Greek’s ordinal ‘last’ and its contextual implication ‘lowest.’
  naturalness: The verse is generally fluent, but “ഏറ്റവും പിന്നിലെ സ്ഥാനം സ്വീകരിക്കാൻ” is not idiomatic for being relegated to a seat. “അവസാനത്തെ സ്ഥാനം കൈക്കൊള്ളാൻ” is natural, retains the explicit ‘begin,’ and fits the banquet context.
  terminology: “ലജ്ജയോടെ” appropriately represents μετὰ αἰσχύνης. “നിന്റെ സ്ഥലം ഇയാൾക്കു വിട്ടുകൊടുക്കുക” clearly expresses the contextual force of Δὸς τούτῳ τόπον without treating τόπος as merely physical room. The footnote should use ‘അവസാനത്തെ സ്ഥാനം’ in the main text and identify ‘താഴ്ന്ന സ്ഥാനം’ as the contextual alternative.
  issues:
  - severity: medium
    issue: “സ്വീകരിക്കാൻ” for κατέχειν
    rationale: This verb normally denotes receiving or accepting, not occupying a place. The Greek means to occupy/hold the last place in the seating order.
  - severity: low
    issue: “ഏറ്റവും പിന്നിലെ സ്ഥാനം” for τὸν ἔσχατον τόπον
    rationale: It is possible, but may primarily evoke a seat at the back. ‘അവസാനത്തെ സ്ഥാനം’ more directly preserves the Greek ordinal sense while the footnote preserves the contextual ‘lowest’ sense.
  revised_text: നിന്നെയും അയാളെയും ക്ഷണിച്ചയാൾ വന്ന് നിന്നോടു, “നിന്റെ സ്ഥലം ഇയാൾക്കു വിട്ടുകൊടുക്കുക,” എന്നു പറയും. അപ്പോൾ നീ ലജ്ജയോടെ അവസാനത്തെ സ്ഥാനം[a] കൈക്കൊള്ളാൻ തുടങ്ങും.
