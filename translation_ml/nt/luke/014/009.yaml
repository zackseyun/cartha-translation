translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വിരുന്നിലെ ഇരിപ്പിടക്രമവും സാമൂഹിക ലജ്ജയും വ്യക്തമാകുന്ന വിധത്തിൽ, എന്നാൽ മൂലത്തിലെ ‘അവസാനത്തെ/താഴ്ന്ന’ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
