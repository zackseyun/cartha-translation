- from: അപ്പോൾ നിന്നെയും അയാളെയും ക്ഷണിച്ചയാൾ വന്ന് നിന്നോട്, “ഈ മനുഷ്യന് നിന്റെ സ്ഥലം കൊടുക്കുക” എന്നു പറയും. പിന്നെ നീ ലജ്ജയോടെ ഏറ്റവും പിന്നിലെ സ്ഥാനം[a] സ്വീകരിക്കാൻ തുടങ്ങും.
  to: നിന്നെയും അയാളെയും ക്ഷണിച്ചയാൾ വന്ന് നിന്നോടു, “നിന്റെ സ്ഥലം ഇയാൾക്കു വിട്ടുകൊടുക്കുക,” എന്നു പറയും. അപ്പോൾ നീ ലജ്ജയോടെ അവസാനത്തെ സ്ഥാനം[a] കൈക്കൊള്ളാൻ തുടങ്ങും.
  rationale: The revision replaces a verb that implies receiving with one that means occupying a place, and it renders ἔσχατος as ‘last’ rather than predominantly spatial ‘rearmost.’ It retains the future sequence, the contextual surrender of one’s place, the shame, and the footnoted last/lowest ambiguity.
