translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. കാർഷികസന്ദർഭം വ്യക്തമാക്കാൻ ‘ജോടി കാളകൾ’ ഉപയോഗിച്ചു; ക്ഷമാപണത്തേക്കാൾ ക്ഷണത്തിൽനിന്നുള്ള ഒഴിവ് അഭ്യർഥിക്കുന്നതാണ് ഇവിടെ ഉദ്ദേശ്യമെന്നതിനാൽ ‘ഒഴിവാക്കിയതായി കണക്കാക്കണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
