reference: Luke 14:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: ml
  text: 'മറ്റൊരാൾ പറഞ്ഞു: “ഞാൻ അഞ്ചു ജോടി കാളകളെ[a] വാങ്ങിയിരിക്കുന്നു; അവയെ പരീക്ഷിച്ചുനോക്കാൻ പോകുകയാണ്. എന്നെ ഒഴിവാക്കിയതായി കണക്കാക്കണമെന്നു ഞാൻ നിന്നോട് അപേക്ഷിക്കുന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “കാളകളുടെ അഞ്ച് നുകങ്ങൾ”; അതായത്, അഞ്ചു ജോടി അഥവാ അഞ്ചു കൂട്ടം കാളകൾ.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “എന്നെ ഒഴിവാക്കപ്പെട്ടവനായി കരുതുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: മറ്റൊരാൾ
  rationale: ഒഴിവുകഴിവുകൾ പറയുന്ന ക്ഷണിതാക്കളുടെ തുടർച്ചയിൽ മറ്റൊരു വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Ζεύγη βοῶν
  choice: അഞ്ചു ജോടി കാളകൾ
  rationale: ζεῦγος ഇവിടെ ഒരുമിച്ചു നുകത്തിൽ കെട്ടി പണിയെടുപ്പിക്കുന്ന രണ്ടു കാളകളടങ്ങിയ ജോടിയെ സൂചിപ്പിക്കുന്നു. ആ കാർഷികചിത്രം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘ജോടി കാളകൾ’ അനുയോജ്യമാണ്.
- source_word: ἠγόρασα
  choice: വാങ്ങിയിരിക്കുന്നു
  rationale: അടുത്തിടെ നടത്തിയ വാങ്ങലിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: πορεύομαι
  choice: പോകുകയാണ്
  rationale: നിലവിലുള്ള നീക്കമോ ഉടനെയുള്ള ഉദ്ദേശ്യമോ വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ വർത്തമാനപ്രയോഗം.
- source_word: δοκιμάσαι
  choice: പരീക്ഷിച്ചുനോക്കാൻ
  rationale: പുതുതായി വാങ്ങിയ കാളകളുടെ പ്രവർത്തനക്ഷമത പരിശോധിക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐρωτῶ σε
  choice: ഞാൻ നിന്നോട് അപേക്ഷിക്കുന്നു
  rationale: നേരിട്ടുള്ള അഭ്യർഥനയുടെ വിനയവും രണ്ടാംപുരുഷ ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: ἔχε με παρῃτημένον
  choice: എന്നെ ഒഴിവാക്കിയതായി കണക്കാക്കണം
  rationale: ἔχωയും perfect passive participle-ഉം ചേർന്ന പ്രയോഗം, തനിക്ക് ഒഴിവ് അനുവദിച്ചതായി പരിഗണിക്കണമെന്ന ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
