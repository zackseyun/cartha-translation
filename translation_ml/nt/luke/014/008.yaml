translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. പുരാതന വിരുന്നിലെ ചാരിക്കിടക്കുന്ന രീതി മുഖ്യപാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു; സാധ്യതാഭാവവും ബഹുമാന-പദവി പശ്ചാത്തലവും സംരക്ഷിച്ചിട്ടുണ്ട്.
