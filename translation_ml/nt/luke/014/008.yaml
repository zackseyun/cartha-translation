source:
  edition: SBLGNT
  text: Ὅταν κληθῇς ὑπό τινος εἰς γάμους, μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ’ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: ml
  text: ആരെങ്കിലും നിന്നെ ഒരു വിവാഹവിരുന്നിന്[a] ക്ഷണിക്കുമ്പോൾ, ഏറ്റവും ബഹുമാന്യമായ സ്ഥാനത്ത്[b] ചെന്നു ചാരിക്കിടക്കരുത്[c]; അല്ലെങ്കിൽ, നിന്നെക്കാൾ ബഹുമാന്യനായ ഒരാളെ അയാൾ ക്ഷണിച്ചിരിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു വിവാഹത്തിന്.” ഗ്രീക്കിലെ ബഹുവചനം വിവാഹാഘോഷങ്ങളെ, പ്രത്യേകിച്ച് വിരുന്നിനെ, സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ഭക്ഷണമേശയ്ക്കരികിലെ ഏറ്റവും ബഹുമാന്യമായ സ്ഥാനം.
    reason: cultural_note
  - marker: c
    text: പുരാതനകാലത്തെ ഔപചാരിക വിരുന്നുകളിൽ ആളുകൾ സാധാരണയായി നിവർന്നിരുന്നല്ല, മേശയ്ക്കരികിൽ ചാരിക്കിടന്നാണ് ഭക്ഷണം കഴിച്ചിരുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: ആരെങ്കിലും നിന്നെ ... ക്ഷണിക്കുമ്പോൾ
  rationale: പൊതുവായ ഒരു സാഹചര്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ καλέω എന്നത് ‘ക്ഷണിക്കുക’ എന്നാണ്.
- source_word: εἰς γάμους
  choice: ഒരു വിവാഹവിരുന്നിന്
  rationale: ബഹുവചനമായ γάμοι വിവാഹാഘോഷങ്ങളെയും പ്രത്യേകിച്ച് വിരുന്നിനെയും സൂചിപ്പിക്കാം; ഇരിപ്പിടക്രമം പറയുന്ന സന്ദർഭത്തിൽ ‘വിവാഹവിരുന്ന്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: μὴ κατακλιθῇς
  choice: ചെന്നു ചാരിക്കിടക്കരുത്
  rationale: പുരാതന ഔപചാരിക വിരുന്നുകളിൽ മേശയ്ക്കരികിൽ ചാരിക്കിടന്നാണ് ഭക്ഷണം കഴിച്ചിരുന്നത്. ക്രിയയുടെ സാംസ്കാരിക ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: മാന്യസ്ഥാനത്ത്
  rationale: വിരുന്നിലെ ഏറ്റവും ബഹുമാന്യമായ സ്ഥാനം എന്ന സാമൂഹിക അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: μήποτε
  choice: '... ഉണ്ടാകാം'
  rationale: മുന്നറിയിപ്പിനു കാരണമായ സാധ്യത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐντιμότερός σου
  choice: നിന്നെക്കാൾ മാന്യനായ ഒരാളെ
  rationale: താരതമ്യരൂപം സൂചിപ്പിക്കുന്ന ഉയർന്ന ബഹുമാനമോ സാമൂഹിക പദവിയോ സംരക്ഷിക്കുന്നു.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: അയാൾ ക്ഷണിച്ചിട്ടുണ്ടാകാം
  rationale: ക്ഷണം ഇതിനകം നടന്നതും ഇപ്പോഴത്തെ സാഹചര്യത്തിൽ പ്രസക്തവുമാണെന്ന പൂർണകാലഭാവവും, μήποτε-യോടൊപ്പമുള്ള സാധ്യതാഭാവവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
