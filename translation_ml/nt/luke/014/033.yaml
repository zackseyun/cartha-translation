    text: അഥവാ, “തനിക്കുള്ള എല്ലാ സ്വത്തുക്കളെയും ഉപേക്ഷിക്കാത്ത.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ “വിടപറയുക” എന്നും അർഥമാകാം; ഈ സന്ദർഭത്തിൽ ഒരാൾ തന്റെ സ്വത്തുക്കളിന്മേലുള്ള അവകാശവാദം വിട്ടൊഴിയുന്നതിനെ അത് സൂചിപ്പിക്കുന്നു.
