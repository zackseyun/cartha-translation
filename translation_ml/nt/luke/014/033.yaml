id: LUK.14.33
reference: Luke 14:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: ml
  text: അങ്ങനെ, തനിക്കുള്ള എല്ലാ സ്വത്തുക്കളെയും വിട്ടൊഴിയാത്ത നിങ്ങളിൽ ഓരോരുത്തനും എന്റെ ശിഷ്യനായിരിക്കാൻ കഴിയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως οὖν
  choice: അങ്ങനെ
  rationale: മുൻപുള്ള ദൃഷ്ടാന്തങ്ങളിൽനിന്ന് യേശു നിഗമനമായി ഈ പ്രയോഗത്തിലേക്കു കടക്കുന്നതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πᾶς ἐξ ὑμῶν
  choice: നിങ്ങളിലാരും
  rationale: ആവശ്യം കേൾക്കുന്ന ഓരോ വ്യക്തിക്കും ബാധകമാണെന്ന വിതരണാത്മക ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: വിട്ടൊഴിയാത്ത
  rationale: ἀποτάσσομαι എന്നതിന് ‘വിടപറയുക’ എന്നും ‘ഉപേക്ഷിക്കുക/വിട്ടുകൊടുക്കുക’ എന്നും അർഥമാകാം. സ്വത്തുമായുള്ള ബന്ധമോ അവകാശവാദമോ നിർണായകമായി ഉപേക്ഷിക്കുന്ന ആശയം ‘വിട്ടൊഴിയുക’ സ്വാഭാവികമായും ആവശ്യമായ തുറന്ന അർഥത്തോടെയും നൽകുന്നു.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: തനിക്കുള്ള സകലവും
  rationale: വ്യക്തിയുടെ സ്വന്തം വസ്തുവകകളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ഉൾക്കൊള്ളുന്നു; ‘സകലവും’ സമ്പൂർണതയുടെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: എന്റെ ശിഷ്യനായിരിക്കാൻ കഴിയില്ല
  rationale: ഇത് വെറും അനുചിതത്വമല്ല, കഴിയായ്മയെയോ അസാധ്യതയെയോ പ്രസ്താവിക്കുന്നതാണെന്ന ഗ്രീക്ക് വാക്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: μαθητής
  choice: ശിഷ്യൻ
  rationale: യേശുവിനെ പിന്തുടരുകയും അവനിൽനിന്ന് പഠിക്കുകയും ചെയ്യുന്ന ബന്ധത്തെ സുവിശേഷസന്ദർഭത്തിൽ കൃത്യമായി നൽകുന്ന സ്ഥാപിത മലയാളപദമാണ്.
theological_decisions:
- issue: സ്വത്തുക്കളെ സംബന്ധിച്ച ആവശ്യത്തിന്റെ സ്വഭാവം
  choice: ‘വിട്ടൊഴിയുക’ എന്നു നൽകി, സ്വത്തുക്കളോടുള്ള അവകാശവാദമോ പിടിച്ചുനിൽപ്പോ ഉപേക്ഷിക്കുന്ന ആശയം ഉൾക്കൊള്ളിച്ചു; എന്നാൽ ഭൗതികമായി എല്ലാം വിറ്റുകളയുക എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ചില്ല.
  alternative: ‘തനിക്കുള്ളതെല്ലാം ഉപേക്ഷിക്കുക’ അഥവാ ‘എല്ലാ സ്വത്തും കൈവിടുക’ എന്ന് നൽകി നിർബന്ധമായ ഭൗതിക പരിത്യാഗത്തിന് കൂടുതൽ ഊന്നൽ നൽകുക.
  rationale: ἀποτάσσομαι എന്ന ക്രിയയുടെ അർഥപരിധിയും സന്ദർഭവും ശിഷ്യത്വത്തിന്റെ കടുത്ത ആവശ്യം നിലനിർത്തുന്നു; അതേസമയം അതിന്റെ പ്രായോഗിക രൂപം വിവർത്തനംതന്നെ ഏകപക്ഷീയമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘നിങ്ങളിലാരും’ എന്ന രൂപം ഗ്രീക്കിലെ പൊതുവായ ഏകവചനപ്രയോഗത്തിന്റെ സർവവ്യാപകത ലിംഗനിർദ്ദേശമില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു.
