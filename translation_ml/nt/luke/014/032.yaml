base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: ml
  text: എന്നാൽ അങ്ങനെയല്ലെങ്കിൽ, മറ്റേ രാജാവ് ഇനിയും ദൂരെയായിരിക്കുമ്പോൾ, അവൻ ഒരു ദൂതസംഘത്തെ[a] അയച്ച് സമാധാനത്തിനുള്ള വ്യവസ്ഥകൾ[b] ചോദിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു പ്രതിനിധിസംഘത്തെ’ അല്ലെങ്കിൽ ‘ദൂതന്മാരെ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, ‘സമാധാനവുമായി ബന്ധപ്പെട്ട കാര്യങ്ങൾ’; അതായത്, സമാധാനം ഉറപ്പാക്കുന്ന വ്യവസ്ഥകൾ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: അല്ലെങ്കിൽ
  rationale: ഈ സാഹചര്യത്തിൽ എതിർസാധ്യതയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്ന പ്രയോഗം; ‘എന്നാൽ അങ്ങനെയല്ലെങ്കിൽ’ എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: മറ്റേ രാജാവ് ഇനിയും ദൂരെയായിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സൂചിപ്പിക്കുന്ന സമകാലിക സാഹചര്യം നിലനിർത്തുന്നു; αὐτοῦ എതിർരാജാവിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭത്തിൽ വ്യക്തമായി കാണിക്കുന്നു.
- source_word: πρεσβείαν
  choice: ഒരു ദൂതസംഘത്തെ
  rationale: രാജാവിന്റെ പേരിൽ ചർച്ചയ്ക്കായി അയയ്ക്കുന്ന പ്രതിനിധിസംഘം എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀποστείλας
  choice: അയച്ച്
  rationale: അയയ്ക്കലിനും തുടർന്ന് വ്യവസ്ഥകൾ ചോദിക്കുന്നതിനുമിടയിലെ പ്രവർത്തനക്രമം ഗ്രീക്കിലെ ഏറിസ്റ്റ് പാർട്ടിസിപ്പിളിനൊത്തവിധം നിലനിർത്തുന്നു.
- source_word: ἐρωτᾷ
  choice: ചോദിക്കുന്നു
  rationale: ഇവിടെ വെറും അന്വേഷണമല്ല, സമാധാനവ്യവസ്ഥകൾ അഭ്യർഥിക്കുകയോ ആവശ്യപ്പെടുകയോ ചെയ്യുന്ന അർഥമാണ്; കർമപദത്തോടൊപ്പം ‘ചോദിക്കുന്നു’ സ്വാഭാവികമാണ്.
- source_word: τὰ πρὸς εἰρήνην
  choice: സമാധാനത്തിനുള്ള വ്യവസ്ഥകൾ
  rationale: അക്ഷരാർഥത്തിലെ ‘സമാധാനവുമായി ബന്ധപ്പെട്ട കാര്യങ്ങൾ’ എന്ന പ്രയോഗം സൈനിക-രാഷ്ട്രീയ സന്ദർഭത്തിൽ സമാധാനം ഉറപ്പാക്കുന്ന വ്യവസ്ഥകളെയാണ് സൂചിപ്പിക്കുന്നത്.
