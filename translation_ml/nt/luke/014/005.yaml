source:
  edition: SBLGNT
  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങളിൽ ആരുടെ മകനോ കാളയോ കിണറ്റിൽ വീണാൽ, ശബ്ബത്തുനാളിൽ അതിനെ ഉടനെ പുറത്തേക്കു വലിച്ചുകയറ്റുകയില്ലേ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “മകൻ” എന്നതിനുപകരം “കഴുത” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: നിങ്ങളിൽ ആരുടെയെങ്കിലും
  rationale: ഉടമസ്ഥബന്ധം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായ വാചാടോപചോദ്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: υἱὸς
  choice: മകൻ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനമായ ‘മകൻ’ എന്ന നിർദിഷ്ട അർഥം നിലനിർത്തുന്നു.
- source_word: βοῦς
  choice: കാള
  rationale: ഈ സന്ദർഭത്തിലെ ഒറ്റ കന്നുകാലിയെയും സാധാരണ വേലമൃഗത്തെയും സൂചിപ്പിക്കാൻ വ്യക്തവും പരമ്പരാഗതവുമായ മലയാളപദം.
- source_word: φρέαρ
  choice: കിണർ
  rationale: സമാന്തരഭാഗങ്ങളുമായി ഒത്തുചേർക്കാതെ, ഈ വാക്യത്തിലെ φρέαρ എന്ന പദത്തിന്റെ സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: πεσεῖται
  choice: വീണാൽ
  rationale: ഭാവികാലരൂപത്തിന് ഇവിടെ സോപാധികമായ വാചാടോപബലം ഉള്ളതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക ഉപാധിരൂപം ഉപയോഗിക്കുന്നു.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: രക്ഷാപ്രവർത്തനം വൈകില്ലെന്ന ഗ്രീക്കിലെ അടിയന്തരത സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀνασπάσει
  choice: വലിച്ചുകയറ്റുക
  rationale: താഴെനിന്ന് മുകളിലേക്കു വലിച്ചെടുക്കുക എന്ന ക്രിയയുടെ ദിശയും കിണറ്റിൽനിന്നുള്ള രക്ഷയും വ്യക്തമാക്കുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന സർവനാമം നിലനിർത്തുന്നു; അത് ‘മകൻ’ എന്നതിനോ ‘കാള’ എന്നതിനോ വ്യാകരണപരമായി ചേരാം.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: ശബ്ബത്തുനാളിൽ
  rationale: ‘ശബ്ബത്തിന്റെ ദിവസം’ എന്ന ആശയം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉദാഹരണത്തിലെ ആദ്യ വസ്തുവിനെക്കുറിച്ചുള്ള പാഠഭേദം
  choice: മകനോ കാളയോ
  alternative: കഴുതയോ കാളയോ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ υἱὸς (‘മകൻ’) മുഖ്യവാചകത്തിൽ പിന്തുടരുന്നു; ‘കഴുത’ എന്ന പാഠഭേദം മുഖ്യവാചകത്തിലേക്ക് ചേർക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാചാടോപചോദ്യരൂപം. ‘വലിച്ചുകയറ്റുക’ കിണറ്റിൽനിന്ന് മുകളിലേക്കുള്ള രക്ഷയുടെ ദിശ വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
