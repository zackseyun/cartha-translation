  text: But he said to him[a], “A certain man was making a great dinner and invited many,”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ അയാളോടു പറഞ്ഞു: “ഒരു മനുഷ്യൻ വലിയൊരു വിരുന്ന് ഒരുക്കിക്കൊണ്ടിരുന്നു; അയാൾ അനേകരെ ക്ഷണിക്കുകയും ചെയ്തു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വലിയൊരു പ്രധാന ഭക്ഷണവേള” അല്ലെങ്കിൽ “വലിയൊരു അത്താഴം.” ഗ്രീക്കിലെ δεῖπνον അന്നത്തെ പ്രധാന ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ഔപചാരികമായി അതിഥികളെ ക്ഷണിച്ചുള്ള ഭക്ഷണമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: അപ്പോൾ അവൻ അയാളോടു പറഞ്ഞു
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധത്തെക്കാൾ മുൻവാക്യത്തോടുള്ള മൃദുവായ ബന്ധവും സംഭാഷണത്തിലെ പ്രതികരണവും സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികമായ ‘അപ്പോൾ’ ഉപയോഗിച്ചു. αὐτῷ എന്ന ഏകവചന ദത്തിവ് ‘അയാളോടു’ എന്നു വ്യക്തമാക്കി.
- source_word: Ἄνθρωπός τις
  choice: ഒരു മനുഷ്യൻ
  rationale: τις നൽകുന്ന അനിശ്ചിതത്വവും ഉപമാകഥകളിലെ സാധാരണ അവതരണശൈലിയും ‘ഒരു മനുഷ്യൻ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐποίει
  choice: ഒരുക്കിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം തുടരുന്ന ഒരുക്കത്തെ സൂചിപ്പിക്കുന്നു. വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ ‘ഉണ്ടാക്കിക്കൊണ്ടിരുന്നു’ എന്നതിനെക്കാൾ ‘ഒരുക്കിക്കൊണ്ടിരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: δεῖπνον μέγα
  choice: വലിയൊരു വിരുന്ന്
  rationale: δεῖπνον പ്രധാന ഭക്ഷണവേളയെ സൂചിപ്പിക്കുന്നു; ഔപചാരികമായി ആളുകളെ ക്ഷണിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘വിരുന്ന്’ സ്വാഭാവികമാണ്. μέγα ‘വലിയൊരു’ എന്നു സംരക്ഷിച്ചു.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: അയാൾ അനേകരെ ക്ഷണിക്കുകയും ചെയ്തു
  rationale: ഭക്ഷണവിരുന്നിന്റെ സന്ദർഭത്തിൽ καλέω എന്നത് ‘ക്ഷണിക്കുക’ എന്നാണ്. πολλούς എന്നത് ആളുകൾ എന്ന പദം കൂട്ടിച്ചേർക്കാതെ ‘അനേകരെ’ എന്നു നൽകി.
