  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘വിരുന്ന്’ സാധാരണ വായനക്കാർക്ക് സന്ദർഭം ഉടൻ വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് മൂലപദത്തിന്റെ ‘പ്രധാന ഭക്ഷണം/അത്താഴം’ എന്ന അർത്ഥപരിധി സൂക്ഷിക്കുന്നു.
