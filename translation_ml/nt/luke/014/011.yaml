id: LUK.14.11
reference: Luke 14:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: ml
  text: എന്തെന്നാൽ, തന്നെത്തന്നെ ഉയർത്തുന്ന ഏവനും താഴ്ത്തപ്പെടും; തന്നെത്തന്നെ താഴ്ത്തുന്നവൻ ഉയർത്തപ്പെടും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ഉപദേശത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: തന്നെത്താൻ ഉയർത്തുന്ന ഏവനും
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പൊതുവായ, സാർവത്രിക അർഥം നിലനിർത്തുകയും സ്വയം ഉയർത്തുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ταπεινωθήσεται
  choice: താഴ്ത്തപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം അതേപടി നിലനിർത്തുന്നു; കർത്താവിനെ വിവർത്തനത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: καὶ
  choice: ;
  rationale: ഗ്രീക്കിലെ രണ്ടു സമാന്തര ഭാഗങ്ങൾ തമ്മിലുള്ള ഏകോപനവും ശക്തമായ വിരോധസമാന്തരതയും മലയാളത്തിൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്താൻ അർധവിരാമം ഉപയോഗിച്ചു.
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: തന്നെത്താൻ താഴ്ത്തുന്നവൻ
  rationale: സ്വമേധയാ സ്വയം താഴ്ത്തുന്നതെന്ന അർഥവും ആദ്യഭാഗത്തോടുള്ള സമാന്തരഘടനയും നിലനിർത്തുന്നു.
- source_word: ὑψωθήσεται
  choice: ഉയർത്തപ്പെടും
  rationale: ആദ്യഭാഗത്തിലെ കർമണിപ്രയോഗത്തോടും ‘താഴ്ത്തപ്പെടും’ എന്നതോടുള്ള പദവിരോധത്തോടും സമാന്തരത പാലിക്കുന്നു.
theological_decisions:
- issue: ഭാവികാല കർമണിപ്രയോഗങ്ങളിലെ പരോക്ഷ കർത്താവ്
  choice: ‘താഴ്ത്തപ്പെടും’, ‘ഉയർത്തപ്പെടും’ എന്ന കർമണിരൂപങ്ങൾ നിലനിർത്തി; ‘ദൈവത്താൽ’ എന്നു ചേർത്തില്ല.
  alternative: ‘ദൈവം താഴ്ത്തും’, ‘ദൈവം ഉയർത്തും’.
  rationale: ദൈവിക പ്രവർത്തനം സന്ദർഭത്തിൽ സൂചിതമായിരിക്കാമെങ്കിലും ഗ്രീക്ക് വാചകം കർത്താവിനെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ പരോക്ഷത സംരക്ഷിച്ചു.
- issue: ഗ്രീക്കിലെ പൊതുവായി പ്രയോഗിച്ച ഏകവചന പുല്ലിംഗരൂപം
  choice: ‘ഏവനും’, ‘വൻ’ എന്നീ മലയാളത്തിലെ പൊതുവ്യക്തിസൂചക രൂപങ്ങൾ ഉപയോഗിച്ചു.
  alternative: ലിംഗം പ്രത്യേകം എടുത്തുകാട്ടുന്ന വിശദീകരണം ചേർക്കുക.
  rationale: മലയാളത്തിൽ ഈ രൂപങ്ങൾ പഴഞ്ചൊല്ലുസ്വഭാവമുള്ള പൊതുപ്രസ്താവനയിൽ സ്വാഭാവികമായി എല്ലാ വ്യക്തികളെയും ഉൾക്കൊള്ളുന്നു; ഉറവിടത്തിൽ ഇല്ലാത്ത ലിംഗവ്യത്യാസം അധികമായി ഊന്നേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പഴഞ്ചൊല്ലുസ്വഭാവം നിലനിർത്തി. ‘ഉയർത്തുന്ന/താഴ്ത്തുന്ന’ എന്നും ‘താഴ്ത്തപ്പെടും/ഉയർത്തപ്പെടും’ എന്നും ഉള്ള വിപരീതസമാന്തരത വ്യക്തമായി സംരക്ഷിച്ചു.
