id: LUK.14.20
reference: Luke 14:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἕτερος εἶπεν· Γυναῖκα ἔγημα καὶ διὰ τοῦτο οὐ δύναμαι ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/020.yaml
  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: ml
  text: 'മറ്റൊരാൾ പറഞ്ഞു: “ഞാൻ വിവാഹം കഴിച്ചു[a]; അതുകൊണ്ട് എനിക്ക് വരാൻ കഴിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഞാൻ ഒരു സ്ത്രീയെ വിവാഹം കഴിച്ചു.”'
    reason: മൂലഭാഷയിൽ γυναῖκα എന്ന കർമം വ്യക്തമായി ഉണ്ടെങ്കിലും, അത് മുഖ്യവാക്യത്തിൽ പദാനുപദമായി ചേർത്താൽ മലയാളത്തിൽ അസ്വാഭാവികമാകും.
lexical_decisions:
- source_word: ἕτερος
  choice: മറ്റൊരാൾ
  rationale: ഒഴികഴിവുകൾ പറയുന്നവരുടെ തുടർച്ചയിൽ വേറൊരു വ്യക്തിയെ പരിചയപ്പെടുത്തുന്നതിനാൽ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘മറ്റൊരാൾ’ തിരഞ്ഞെടുത്തു.
- source_word: Γυναῖκα ἔγημα
  choice: ഞാൻ വിവാഹം കഴിച്ചു
  rationale: γυνή ഇവിടെ γαμέωയുടെ കർമമായതിനാൽ ‘സ്ത്രീ’ എന്ന പൊതുവായ അർഥമല്ല, വിവാഹബന്ധമാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ ‘ഒരു ഭാര്യയെ വിവാഹം കഴിച്ചു’ അസ്വാഭാവികമാണ്; ‘വിവാഹം കഴിച്ചു’ എന്ന പ്രയോഗം അതേ അർഥം സ്വാഭാവികമായി നൽകുന്നു. മൂലത്തിലെ വ്യക്തമായ കർമം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻപറഞ്ഞ വിവാഹത്തെ വരാൻ കഴിയാത്തതിന്റെ കാരണമായി ബന്ധിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ കാരണസൂചകപ്രയോഗം.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: എനിക്ക് വരാൻ കഴിയില്ല
  rationale: δύναμαι + infinitive സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മയെ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ നേരിട്ടുള്ള പ്രസ്താവനയും കാരണബന്ധവും നിലനിർത്തി; മലയാളത്തിൽ അസ്വാഭാവികമായ പദാനുപദരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
