id: LUK.14.10
reference: Luke 14:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: ml
  text: എന്നാൽ നിന്നെ ക്ഷണിക്കുമ്പോൾ, ചെന്ന് ഏറ്റവും താഴ്ന്ന സ്ഥാനത്ത് ഭക്ഷണത്തിനിരിക്കൂ.[a] അങ്ങനെ, നിന്നെ ക്ഷണിച്ചയാൾ വരുമ്പോൾ, ‘സുഹൃത്തേ, കുറെക്കൂടി ഉയർന്ന സ്ഥാനത്തേക്കു വരൂ’[b] എന്നു നിന്നോടു പറയും. അപ്പോൾ നിന്നോടൊപ്പം ഭക്ഷണത്തിനിരിക്കുന്ന എല്ലാവരുടെയും മുമ്പിൽ നിനക്കു ബഹുമാനം ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഏറ്റവും താഴ്ന്ന സ്ഥാനത്ത് ചാരിക്കിടക്കൂ.’ അക്കാലത്ത് ആളുകൾ ഭക്ഷണമേശയ്ക്കരികിൽ ചാരിക്കിടന്നാണ് ഭക്ഷണം കഴിച്ചിരുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മേലോട്ടു കയറിവരൂ.’ ഇവിടെ ഉദ്ദേശിക്കുന്നത് കൂടുതൽ ബഹുമാനമുള്ള സ്ഥാനത്തേക്കു നീങ്ങുക എന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθῇς
  choice: നിന്നെ ക്ഷണിക്കുമ്പോൾ
  rationale: വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ καλέω എന്നത് സാധാരണ വിളിയെയല്ല, ക്ഷണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πορευθεὶς
  choice: ചെന്ന്
  rationale: പ്രധാന ആജ്ഞയോടൊപ്പമുള്ള അനുബന്ധപ്രവർത്തനമായി സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകി.
- source_word: ἀνάπεσε
  choice: ഭക്ഷണത്തിനിരിക്കൂ
  rationale: ഗ്രീക്ക് പദം ഭക്ഷണമേശയിൽ ചാരിക്കിടക്കുന്നതിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു. എന്നാൽ ആ പുരാതന ഭാവം അക്ഷരാർഥത്തിൽ പറഞ്ഞാൽ ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ വിരുന്നുസന്ദർഭം വ്യക്തമാക്കുന്ന പ്രയോഗം സ്വീകരിച്ചു; സാംസ്കാരിക വിശദാംശം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ἔσχατον τόπον
  choice: ഏറ്റവും താഴ്ന്ന സ്ഥാനം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് അവസാനത്തെ ഭൗതിക ഇടം മാത്രമല്ല, ഏറ്റവും കുറഞ്ഞ മാന്യതയുള്ള സ്ഥാനമാണ്.
- source_word: ὁ κεκληκώς σε
  choice: നിന്നെ ക്ഷണിച്ചയാൾ
  rationale: ‘ആതിഥേയൻ’ എന്ന വ്യാഖ്യാനാത്മക പദത്തിനു പകരം ഗ്രീക്കിലെ വിവരണരൂപം സുതാര്യമായി നിലനിർത്തി.
- source_word: Φίλε
  choice: സുഹൃത്തേ
  rationale: മര്യാദാപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് സ്വാഭാവികവും അടുത്തതുമായ തുല്യപദം.
- source_word: προσανάβηθι ἀνώτερον
  choice: കുറെക്കൂടി ഉയർന്ന സ്ഥാനത്തേക്കു വരൂ
  rationale: കൂടുതൽ ബഹുമാനമുള്ള സ്ഥാനത്തേക്കുള്ള നീക്കത്തെയും ‘ഉയരുക’ എന്ന ദൃശ്യരൂപത്തെയും നിലനിർത്തുന്നു.
- source_word: δόξα
  choice: ബഹുമാനം
  rationale: ഈ സാമൂഹിക വിരുന്നുസന്ദർഭത്തിൽ δόξα ദൈവിക മഹത്ത്വത്തേക്കാൾ പൊതുവായ ആദരത്തെയോ മാന്യതയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: നിന്നോടൊപ്പം ഭക്ഷണത്തിനിരിക്കുന്ന എല്ലാവരുടെയും മുമ്പിൽ
  rationale: ബഹുമാനത്തിന്റെ പരസ്യസ്വഭാവവും കൂട്ടവിരുന്നിന്റെ ചിത്രവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: വചനത്തിന്റെ ഉപദേശസ്വഭാവം
  choice: താഴ്മയെയും ബഹുമാനക്രമത്തിന്റെ മറിച്ചിലിനെയും കുറിച്ചുള്ള ഉപമാസദൃശമായ വിരുന്നുപദേശമായി തുറന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് വെറും വിരുന്നുമര്യാദയായി മാത്രം കാണുക, അല്ലെങ്കിൽ പൂർണമായും അന്ത്യകാല പ്രതിഫലത്തെക്കുറിച്ചുള്ള ഉപദേശമായി നിർണ്ണയിക്കുക.
  rationale: വാക്യം സാമൂഹിക വിരുന്നുചിത്രത്തിലൂടെ കൂടുതൽ വിശാലമായ താഴ്മയുടെ പാഠത്തിന് ഇടം നൽകുന്നു; പരിഭാഷ ഏതെങ്കിലും ഒരൊറ്റ ദൈവശാസ്ത്ര വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പുരാതന വിരുന്നിലെ ചാരിക്കിടക്കുന്ന പതിവ് മുഖ്യവാചകത്തിൽ വാക്കിന് വാക്കായി നൽകി ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതെ, ‘ഭക്ഷണത്തിനിരിക്കൂ’ എന്നു പരിഭാഷപ്പെടുത്തി അടിക്കുറിപ്പിലൂടെ സാംസ്കാരിക കൃത്യത സംരക്ഷിച്ചു.
