- from: എന്നാൽ നിന്നെ ക്ഷണിക്കുമ്പോൾ, ചെന്ന് ഏറ്റവും താഴ്ന്ന സ്ഥാനത്ത് ഭക്ഷണത്തിനിരിക്കൂ.[a] അപ്പോൾ നിന്നെ ക്ഷണിച്ചയാൾ വന്ന്, ‘സുഹൃത്തേ, കുറെക്കൂടി ഉയർന്ന സ്ഥാനത്തേക്കു വരൂ’[b] എന്നു നിന്നോടു പറയും. അങ്ങനെ, നിന്നോടൊപ്പം ഭക്ഷണത്തിനിരിക്കുന്ന എല്ലാവരുടെയും മുമ്പിൽ നിനക്കു ബഹുമാനം ലഭിക്കും.
  to: എന്നാൽ നിന്നെ ക്ഷണിക്കുമ്പോൾ, ചെന്ന് ഏറ്റവും താഴ്ന്ന സ്ഥാനത്ത് ഭക്ഷണത്തിനിരിക്കൂ.[a] അങ്ങനെ, നിന്നെ ക്ഷണിച്ചയാൾ വരുമ്പോൾ, ‘സുഹൃത്തേ, കുറെക്കൂടി ഉയർന്ന സ്ഥാനത്തേക്കു വരൂ’[b] എന്നു നിന്നോടു പറയും. അപ്പോൾ നിന്നോടൊപ്പം ഭക്ഷണത്തിനിരിക്കുന്ന എല്ലാവരുടെയും മുമ്പിൽ നിനക്കു ബഹുമാനം ലഭിക്കും.
  rationale: ഗ്രീക്കിലെ ἵνα ὅταν (‘അങ്ങനെ/അതിന്, ... വരുമ്പോൾ’) സൂചിപ്പിക്കുന്ന ഉദ്ദേശബന്ധം വ്യക്തമായി നിലനിർത്താൻ രണ്ടാം വാക്യത്തിലെ തുടക്കബന്ധകം തിരുത്തി. മറ്റെല്ലാ പദതിരഞ്ഞെടുപ്പുകളും സ്വാഭാവികത, സ്രോതസ്സിനോടുള്ള വിശ്വസ്തത, പുരാതന വിരുന്നുസന്ദർഭം എന്നിവ നന്നായി സംരക്ഷിക്കുന്നതിനാൽ മാറ്റിയിട്ടില്ല.
