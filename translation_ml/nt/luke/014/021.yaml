id: LUK.14.21
reference: Luke 14:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: ml
  text: 'ദാസൻ മടങ്ങിവന്ന്[a] ഈ കാര്യങ്ങൾ തന്റെ യജമാനനോട് അറിയിച്ചു. അപ്പോൾ വീട്ടുടമ കോപിച്ച് തന്റെ ദാസനോടു പറഞ്ഞു: ‘വേഗം പുറത്തിറങ്ങി നഗരത്തിലെ വിശാലമായ തെരുവുകളിലും ഇടവഴികളിലും ചെന്നു ദരിദ്രരെയും അംഗവൈകല്യമുള്ളവരെയും[b] അന്ധരെയും മുടന്തരെയും ഇവിടെ കൊണ്ടുവരിക.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വന്നെത്തി.” സന്ദർഭം ദാസൻ തിരിച്ചുവന്ന് വിവരം അറിയിക്കുന്നതായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അംഗഭംഗമുള്ളവരെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: മടങ്ങിവന്ന്
  rationale: മുമ്പ് ഏൽപ്പിച്ച കാര്യം നിർവഹിച്ചശേഷം ദാസൻ യജമാനന്റെ അടുക്കലേക്ക് തിരിച്ചെത്തി വിവരം അറിയിക്കുന്നതാണ് സന്ദർഭം; അതിനാൽ തിരിച്ചുവരവിന്റെ സൂചന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δοῦλος
  choice: ദാസൻ
  rationale: വീട്ടിലെ അധീനസേവകന്റെ സ്ഥാനം സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിലും പൊതുഭാഷയിലും പരിചിതമായ പദം; ഇവിടെ നിയമപരമായ അടിമസ്ഥിതിയേക്കാൾ കഥയിലെ സേവകവേഷമാണ് മുൻനിരയിൽ.
- source_word: ἀπήγγειλεν
  choice: അറിയിച്ചു
  rationale: മേലധികാരിക്ക് വിവരം തിരിച്ചറിയിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: κυρίῳ
  choice: യജമാനൻ
  rationale: ഇവിടെ ദൈവിക പദവിയല്ല, ദാസന്റെ മാനുഷിക അധികാരിയെയാണ് κύριος സൂചിപ്പിക്കുന്നത്; ‘യജമാനൻ’ ആ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: ὀργισθεὶς
  choice: കോപിച്ച്
  rationale: കേട്ട കാര്യങ്ങളോടുള്ള പ്രതികരണമായി കോപം ഉണ്ടായശേഷം സംസാരിക്കുന്ന പങ്കുപദത്തിന്റെ ക്രമവും ഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: οἰκοδεσπότης
  choice: വീട്ടുടമ
  rationale: വീടിന്റെയോ കുടുംബത്തിന്റെയോ അധികാരിയായ വ്യക്തിയെ സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുകയും κύριος എന്ന പദത്തിന്റെ പരിഭാഷയിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πλατείας
  choice: വിശാലമായ തെരുവുകൾ
  rationale: വീതിയേറിയ പൊതുവീഥികൾ എന്ന ആശയം നിലനിർത്തി, തുടർന്നുള്ള ഇടുങ്ങിയ ῥύμαι-യുമായുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: ῥύμας
  choice: ഇടവഴികൾ
  rationale: നഗരത്തിലെ ചെറുതും ഇടുങ്ങിയതുമായ വഴികളെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀναπείρους
  choice: അംഗവൈകല്യമുള്ളവർ
  rationale: ശാരീരിക അവയവങ്ങളുടെ പ്രവർത്തനക്കുറവോ വൈകല്യമോ ഉള്ളവരെ അപമാനകരമല്ലാത്ത ആധുനിക ഭാഷയിൽ സൂചിപ്പിക്കുന്നു; പദത്തിന് ‘അംഗഭംഗമുള്ളവർ’ എന്ന കൂടുതൽ ദൃശ്യമായ അർഥസാധ്യതയും ഉണ്ട്.
- source_word: χωλοὺς
  choice: മുടന്തർ
  rationale: നടക്കാൻ പ്രയാസമുള്ളവരെയോ കാലിന് വൈകല്യമുള്ളവരെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പ്രത്യേക അർഥം നിലനിർത്തുന്നു.
- source_word: εἰσάγαγε ὧδε
  choice: ഇവിടെ കൊണ്ടുവരിക
  rationale: അകത്തേക്കു നയിച്ചുകൊണ്ടുവരുക എന്ന ചലനവും വിരുന്ന് നടക്കുന്ന ‘ഇവിടെ’ എന്ന ലക്ഷ്യവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος എന്ന സാമൂഹികപദത്തിന്റെ പരിഭാഷ
  choice: ദാസൻ
  alternative: അടിമ
  rationale: മൂലപദം അടിമസ്ഥിതിയും സൂചിപ്പിക്കാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ വീട്ടുടമയുടെ നിർദേശം അനുസരിച്ച് പ്രവർത്തിക്കുന്ന സേവകവേഷമാണ് കഥാപരമായി മുൻനിരയിൽ. ‘ദാസൻ’ ആ ബന്ധം നിലനിർത്തുന്നു, നിയമപരമായ സ്ഥിതി അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- issue: മാനുഷിക അധികാരിയെ സൂചിപ്പിക്കുന്ന κύριος
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: ഈ ഉപമയിൽ പദത്തിന്റെ നേരിട്ടുള്ള സൂചകം ദാസന്റെ മാനുഷിക മേലധികാരിയാണ്. ‘കർത്താവ്’ ദൈവികമോ ക്രിസ്തുശാസ്ത്രപരമോ ആയ പദവിയായി തെറ്റിദ്ധരിക്കപ്പെടാം; ‘യജമാനൻ’ കഥയിലെ ബന്ധം വ്യക്തമാക്കുന്നു.
- issue: ἀνάπηρος എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: അംഗവൈകല്യമുള്ളവർ
  alternative: അംഗഭംഗമുള്ളവർ
  rationale: മൂലപദം ശരീരാവയവങ്ങളുടെ വൈകല്യമോ പ്രവർത്തനക്കുറവോ സൂചിപ്പിക്കുന്നു. ആധുനികവും മാന്യവുമായ പൊതുപദം തിരഞ്ഞെടുത്തു; കൂടുതൽ നിർദിഷ്ടമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വിശാലമായ തെരുവുകൾ—ഇടവഴികൾ’ എന്ന ജോടിയിലൂടെ മൂലത്തിലെ സ്ഥലവ്യത്യാസം നിലനിർത്തി. വൈകല്യത്തെ സൂചിപ്പിക്കുന്ന ഭാഷയിൽ അപമാനകരമായ പ്രയോഗങ്ങൾ ഒഴിവാക്കി; എന്നാൽ ‘അന്ധർ’, ‘മുടന്തർ’ എന്നീ മൂലത്തിലെ വ്യത്യസ്ത വിഭാഗങ്ങൾ ലയിപ്പിക്കാതെ സൂക്ഷിച്ചു.
