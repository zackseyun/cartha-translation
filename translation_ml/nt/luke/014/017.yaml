source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: ml
  text: അത്താഴത്തിന്റെ സമയത്ത്, ക്ഷണിക്കപ്പെട്ടവരോട്, ‘വരൂ, കാരണം എല്ലാം ഇതിനകം തയ്യാറായിരിക്കുന്നു[a]’ എന്നു പറയാൻ അവൻ തന്റെ ദാസനെ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ സ്വാഭാവികമായി: ‘ഇപ്പോൾ എല്ലാം തയ്യാറാണ്.’ ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമായി പറയുന്നില്ല; നപുംസകലിംഗ ബഹുവചനരൂപം തയ്യാറായിരിക്കുന്ന കാര്യങ്ങളെയെല്ലാം കൂട്ടായി സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: ἀποστέλλω എന്ന ക്രിയയുടെ ഭൂതകാലപ്രയോഗം സന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘അയച്ചു’ എന്നു പരിഭാഷപ്പെടുത്താം; കൂടുതൽ ഔപചാരികമായ പദം ആവശ്യമില്ല.
- source_word: δοῦλον
  choice: ദാസനെ
  rationale: വീട്ടിലെ യജമാനന്റെ കീഴിലുള്ള സേവകനെ സൂചിപ്പിക്കുന്ന ഈ ഉപമാസന്ദർഭത്തിൽ ‘ദാസൻ’ മൂലപദത്തിന്റെ അധീനസ്ഥിതി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ മനസ്സിലാകുകയും ചെയ്യുന്നു.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: അത്താഴസമയമായപ്പോൾ
  rationale: ഭക്ഷണത്തിനായി നിശ്ചയിച്ച സമയം എത്തിയതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; δείπνον എന്നത് ഇവിടെ അത്താഴം/പ്രധാന സായാഹ്നഭക്ഷണം എന്ന അർഥത്തിലാണ്.
- source_word: τοῖς κεκλημένοις
  choice: ക്ഷണിക്കപ്പെട്ടവരോട്
  rationale: καλέω എന്ന ക്രിയയുടെ perfect passive participle നേരത്തേ ക്ഷണം ലഭിച്ചവരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം ആ നില വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ἔρχεσθε
  choice: വരൂ
  rationale: ക്ഷണാത്മകമായ ആജ്ഞയെ ലളിതവും ആദരസൂചകവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὅτι
  choice: ;
  rationale: ഗ്രീക്കിൽ ഇത് വരാനുള്ള കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ നേരിട്ടുള്ള ക്ഷണത്തിൽ അർധവിരാമത്തിനു ശേഷമുള്ള പ്രസ്താവന അതേ കാരണബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു; നിർബന്ധമായി ‘കാരണം’ ചേർക്കുന്നത് സംഭാഷണത്തെ കൃത്രിമമാക്കും.
- source_word: ἤδη
  choice: ഇപ്പോൾ
  rationale: സജ്ജീകരണം ഈ സമയത്തേക്കു പൂർത്തിയായെന്ന കാലസൂചന ഇവിടെ ‘ഇപ്പോൾ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἕτοιμά ἐστιν
  choice: എല്ലാം ഒരുക്കമായിരിക്കുന്നു
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണവും ഏകവചന ക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗം കൂട്ടായ അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘എല്ലാം ഒരുക്കമായിരിക്കുന്നു’ എന്നത് അതിന്റെ സ്വാഭാവിക സമാനപ്രയോഗമാണ്.
