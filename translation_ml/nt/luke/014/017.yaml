translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘ദാസൻ’ മൂലപദത്തിന്റെ സാമൂഹിക അധീനത പൂർണമായി മായ്ച്ചുകളയാതെ വീട്ടുസന്ദർഭത്തിലെ സേവകന്റെ പങ്ക് വ്യക്തമാക്കുന്നു. നേരിട്ടുള്ള ഉദ്ധരണിയിൽ മലയാളത്തിന്റെ സ്വാഭാവിക കാരണബന്ധം നിലനിർത്തി.
