id: LUK.14.1
reference: Luke 14:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: ml
  text: ഒരു ശബ്ബത്തിൽ യേശു ഭക്ഷണം കഴിക്കാൻ പരീശന്മാരുടെ നേതാക്കളിൽ ഒരാളുടെ വീട്ടിൽ ചെന്നപ്പോൾ, അവർ അദ്ദേഹത്തെ സൂക്ഷ്മമായി നിരീക്ഷിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൂക്ഷ്മമായി നിരീക്ഷിച്ചുകൊണ്ടിരുന്നു’ എന്നതിന് ‘ശ്രദ്ധാപൂർവം നോക്കിക്കൊണ്ടിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദത്തിന് സംശയത്തോടെയോ വൈരഭാവത്തോടെയോ നിരീക്ഷിക്കുക എന്ന സൂചന ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: '[പ്രത്യേക പദമായി വിവർത്തനം ചെയ്യാതെ കാലവാക്യഘടനയിൽ ഉൾപ്പെടുത്തി]'
  rationale: ഇത് ലൂക്കോസിൽ സാധാരണമായ സംഭവാവതരണ പ്രയോഗമാണ്. മലയാളത്തിൽ ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് ഭാരമുള്ളതിനാൽ, ‘ചെന്നപ്പോൾ’ എന്ന സ്വാഭാവിക ഘടനയിൽ അതിന്റെ ആഖ്യാനധർമ്മം ഉൾപ്പെടുത്തി.
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: യേശു ... ചെന്നപ്പോൾ
  rationale: ἐν സഹിതമുള്ള articular infinitive കാലസൂചനയാണ്. ‘ചെന്നപ്പോൾ’ അതിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. സന്ദർഭത്തിൽ കർത്താവിനെ വ്യക്തമായി തിരിച്ചറിയാൻ ‘യേശു’ ഉപയോഗിച്ചു.
- source_word: οἶκόν
  choice: വീട്ടിൽ
  rationale: സാമൂഹിക വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ οἶκος എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: പരീശന്മാരുടെ പ്രമാണികളിൽ ഒരാളുടെ
  rationale: τινος τῶν എന്ന ഭാഗികജനിറ്റീവ് ‘ഒരാളുടെ’ എന്നും ἀρχόντων എന്നത് നേതൃസ്ഥാനമുള്ളവരെ സൂചിപ്പിക്കുന്ന ‘പ്രമാണികൾ’ എന്നും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: σαββάτῳ
  choice: ഒരു ശബ്ബത്തിൽ
  rationale: അനാർത്രസ് ആയ σαββάτῳ ഒരു പ്രത്യേക ശബ്ബത്തിനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം; മലയാളത്തിൽ ‘ഒരു ശബ്ബത്തിൽ’ സന്ദർഭം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: φαγεῖν ἄρτον
  choice: ഭക്ഷണം കഴിക്കാൻ
  rationale: അക്ഷരാർഥം ‘അപ്പം തിന്നാൻ’ എന്നാണെങ്കിലും ഇത് ഭക്ഷണം കഴിക്കുക എന്ന സാധാരണ സെമിറ്റിക് പ്രയോഗമാണ്. മലയാളത്തിൽ അക്ഷരാർഥം ഉദ്ദേശിക്കാത്ത പരിമിതി സൃഷ്ടിക്കാവുന്നതിനാൽ മുഖ്യപാഠത്തിൽ സ്വാഭാവിക അർഥം നൽകി.
- source_word: παρατηρούμενοι
  choice: സൂക്ഷ്മമായി നിരീക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: ക്രിയ ശ്രദ്ധാപൂർവമായ നിരീക്ഷണത്തെയും ചില സന്ദർഭങ്ങളിൽ സംശയമോ വൈരമോ കലർന്ന കാവലിനെയും സൂചിപ്പിക്കാം. ഈ രൂപം ശ്രദ്ധയുടെ തീവ്രത നിലനിർത്തുന്നു; ഉദ്ദേശ്യം അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
- source_word: αὐτοὶ
  choice: അവർ
  rationale: ഗ്രീക്കിൽ സർവനാമത്തിന് ഊന്നൽ ഉണ്ടാകാമെങ്കിലും മലയാളത്തിൽ ‘അവർ’ എന്ന സ്വാഭാവിക കർത്തൃരൂപം മതിയാകുന്നു.
theological_decisions:
- issue: പരീശന്മാരുടെ നിരീക്ഷണത്തിൽ സൂചിതമായ വൈരഭാവം
  choice: അവർ അദ്ദേഹത്തെ സൂക്ഷ്മമായി നിരീക്ഷിച്ചുകൊണ്ടിരുന്നു
  alternative: അവർ അദ്ദേഹത്തെ കുടുക്കാൻ നോക്കിക്കൊണ്ടിരുന്നു / അവർ അദ്ദേഹത്തെ ശ്രദ്ധാപൂർവം നിരീക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: παρατηρέω എന്നതിന് സംശയപരമോ വൈരപരമോ ആയ നിരീക്ഷണത്തിന്റെ നിഴൽ ഉണ്ടാകാം; എന്നാൽ ഈ വാക്യം അവരുടെ ദുഷ്ടലക്ഷ്യം തുറന്നുപറയുന്നില്ല. അതിനാൽ ആഖ്യാനത്തിലെ സംഘർഷം നിലനിർത്തുകയും ഉദ്ദേശ്യം നിർബന്ധമായി വിധിക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അപ്പം തിന്നാൻ’ എന്ന അക്ഷരപരിഭാഷയ്ക്കു പകരം മലയാള വായനക്കാരന് ഉദ്ദേശിച്ച അർഥം ഉടൻ വ്യക്തമാകുന്ന ‘ഭക്ഷണം കഴിക്കാൻ’ ഉപയോഗിച്ചു. ‘പ്രമാണികൾ’ നേതൃസ്ഥാനം നിലനിർത്തുന്നു; ‘സൂക്ഷ്മമായി നിരീക്ഷിച്ചു’ വൈരലക്ഷ്യം അമിതമായി പ്രസ്താവിക്കാതെ സംഘർഷം സംരക്ഷിക്കുന്നു.
