id: LUK.14.34
reference: Luke 14:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καλὸν ⸀οὖν τὸ ἅλας· ἐὰν δὲ ⸀καὶ τὸ ἅλας μωρανθῇ, ἐν τίνι ἀρτυθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: ml
  text: അതിനാൽ, ഉപ്പ് നല്ലതാണ്; എന്നാൽ ഉപ്പുപോലും രുചിയില്ലാതായാൽ[a], എന്ത് ഉപയോഗിച്ച് അതിന് രുചി വരുത്തും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉപ്പിന് അതിന്റെ രുചി നഷ്ടപ്പെട്ടാൽ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ ‘മൂഢമാകുക’ എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ ഉപ്പ് രുചികെട്ടുപോകുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: നല്ലതാണ്
  rationale: ഉപ്പിനെ പൊതുവായി അനുകൂലമായി വിലയിരുത്തുന്ന καλός എന്ന പദത്തിന്റെ സ്വാഭാവികവും അമിതവ്യാഖ്യാനമില്ലാത്തതുമായ മലയാളരൂപം.
- source_word: οὖν
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം ഗ്രീക്കിൽ οὖν സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ ചൊല്ലിന്റെ തുടക്കത്തിൽ ‘അതുകൊണ്ട്’ ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമായി കർക്കശമാകാം; വാക്യക്രമവും സന്ദർഭവും ബന്ധം വഹിക്കുന്നു.
- source_word: ἅλας
  choice: ഉപ്പ്
  rationale: അക്ഷരാർഥത്തിലുള്ള ഉപ്പിനെ പഴഞ്ചൊല്ലുസദൃശമായ രൂപകമായി ഉപയോഗിക്കുന്നു; പരാവർത്തനം ആവശ്യമില്ല.
- source_word: ἐὰν δὲ καὶ
  choice: എന്നാൽ … പോലും … ആയാൽ
  rationale: 'δέയുടെ വൈരുധ്യവും καίയുടെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു: ഉപ്പുപോലും അതിന്റെ സവിശേഷത നഷ്ടപ്പെടുത്തുന്ന സാഹചര്യം.'
- source_word: μωρανθῇ
  choice: രുചിയില്ലാതായാൽ
  rationale: ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ ‘മൂഢമാകുക’ എന്ന അർഥമുണ്ടാകാമെങ്കിലും, ഉപ്പിനെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ രുചികെട്ടുപോകുക എന്ന പ്രയോഗാർഥമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἐν τίνι
  choice: എന്തുകൊണ്ട്
  rationale: രുചി വരുത്താനുള്ള ഉപാധിയെ ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളസമാനം.
- source_word: ἀρτυθήσεται
  choice: അതിനു രുചി വരുത്തും
  rationale: ‘രുചിപ്പെടുത്തുക/പാകപ്പെടുത്തുക’ എന്ന പാചകരൂപകം നിലനിർത്തുകയും ‘പുനഃസ്ഥാപിക്കുക’ പോലുള്ള വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉപ്പിനെക്കുറിച്ചുള്ള ചൊല്ലിന്റെ രൂപകാർഥം
  choice: ശിഷ്യത്വത്തെക്കുറിച്ചുള്ള പ്രയോഗം വാക്യത്തിൽ വിശദീകരിക്കാതെ ഉപ്പിന്റെ ചിത്രം അതേപടി നിലനിർത്തി.
  alternative: ‘ശിഷ്യന്മാർ തങ്ങളുടെ സവിശേഷത നഷ്ടപ്പെടുത്തിയാൽ’ എന്നിങ്ങനെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുക.
  rationale: ചുറ്റുപാടുള്ള സന്ദർഭമാണ് രൂപകത്തിന്റെ പ്രയോഗം വ്യക്തമാക്കുന്നത്; മുഖ്യവാചകത്തിൽ അതിനെ തുറന്നുപറയുന്നത് മൂലത്തിലെ രൂപകാത്മക പിരിമുറുക്കം അനാവശ്യമായി പരിഹരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചൊല്ലിന്റെ ഭാവം പാലിച്ചു. ‘ഉപ്പുപോലും’ എന്നത് ഗ്രീക്കിലെ καίയുടെ ഊന്നൽ പ്രകടമാക്കുന്നു; ‘അതിനു രുചി വരുത്തും’ എന്ന ചോദ്യം പാചകരൂപകം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
