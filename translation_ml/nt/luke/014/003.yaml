id: LUK.14.3
reference: Luke 14:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: ml
  text: 'യേശു മറുപടിയായി ന്യായശാസ്ത്രപണ്ഡിതന്മാരോടും പരീശന്മാരോടും പറഞ്ഞു: “ശബ്ബത്തിൽ സൗഖ്യമാക്കുന്നത് നിയമാനുസൃതമാണോ, അല്ലയോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: മറുപടിയായി ... പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ഇരട്ട പ്രയോഗത്തിന്റെ പ്രതികരണസ്വഭാവവും തുടർന്നുള്ള സംസാരക്രിയയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: νομικοὺς
  choice: ന്യായശാസ്ത്രപണ്ഡിതന്മാർ
  rationale: ഇവിടെ ആധുനിക അഭിഭാഷകരെയല്ല, യഹൂദ ന്യായപ്രമാണത്തിൽ വൈദഗ്ധ്യമുള്ളവരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ അർത്ഥം നേരിട്ട് വ്യക്തമാക്കുന്ന പദം തെരഞ്ഞെടുത്തു.
- source_word: Φαρισαίους
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള പേരാണ്.
- source_word: Ἔξεστιν
  choice: നിയമാനുസൃതമാണോ
  rationale: ശബ്ബത്ത് ആചരണവുമായി ബന്ധപ്പെട്ട നിയമപരവും മതപരവുമായ ചോദ്യം വ്യക്തമാക്കുന്നു; വെറും അനുമതി എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: τῷ σαββάτῳ
  choice: ശബ്ബത്തിൽ
  rationale: കാലസൂചകമായ ദത്തിവിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: θεραπεῦσαι
  choice: സൗഖ്യമാക്കുന്നത്
  rationale: സുവിശേഷങ്ങളിലെ രോഗശാന്തിയുടെ സന്ദർഭത്തിന് യോജിച്ച, സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പ്രയോഗം.
- source_word: ἢ οὔ
  choice: അല്ലയോ
  rationale: വികല്പചോദ്യത്തിന്റെ തുറന്ന സ്വഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശബ്ബത്ത് നിയമത്തെക്കുറിച്ചുള്ള ചോദ്യം യേശുവിന്റെ നിഗമനം മുൻകൂട്ടി ചേർക്കാതെ അവതരിപ്പിക്കൽ
  choice: “ശബ്ബത്തിൽ സൗഖ്യമാക്കുന്നത് നിയമാനുസൃതമാണോ, അല്ലയോ?”
  alternative: “ശബ്ബത്തിൽ സൗഖ്യമാക്കാൻ അനുവാദമുണ്ടോ, ഇല്ലയോ?”
  rationale: മൂലപാഠം ഇവിടെ ഒരു നിയമ-ദൈവശാസ്ത്ര ചോദ്യം മാത്രമാണ് ഉന്നയിക്കുന്നത്. കരുണ, അനിവാര്യത, അല്ലെങ്കിൽ യേശുവിന്റെ അധികാരം സംബന്ധിച്ച നിഗമനങ്ങൾ ചേർക്കാതെ അതിന്റെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. νομικοί എന്ന പദത്തിന്റെ പ്രത്യേക അർത്ഥം മുഖ്യപാഠത്തിൽത്തന്നെ ‘ന്യായശാസ്ത്രപണ്ഡിതന്മാർ’ എന്നു വ്യക്തമാക്കിയതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
