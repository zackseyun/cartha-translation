reference: Luke 14:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο ἀπὸ μιᾶς ⸂πάντες παραιτεῖσθαι⸃. ὁ πρῶτος εἶπεν αὐτῷ· Ἀγρὸν ἠγόρασα καὶ ἔχω ἀνάγκην ⸀ἐξελθὼν ἰδεῖν αὐτόν· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: ml
  text: 'എന്നാൽ അവരെല്ലാവരും ഒരുപോലെ[b] ഒഴികഴിവു പറയാൻ[a] തുടങ്ങി. ആദ്യത്തെയാൾ അവനോട് പറഞ്ഞു: “ഞാൻ ഒരു വയൽ വാങ്ങിയിട്ടുണ്ട്; പുറത്തുപോയി അതു കാണേണ്ടതുണ്ട്. എന്റെ ഒഴികഴിവ് സ്വീകരിക്കണമെന്ന് ഞാൻ നിന്നോട് അപേക്ഷിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒഴികഴിവുകൾ പറയാൻ തുടങ്ങി.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒഴികഴിവു പറഞ്ഞുകൊണ്ട് ഒരു ക്ഷണം നിരസിക്കുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “ഒന്നിൽനിന്ന്”; എല്ലാവരും ഒന്നിച്ചോ ഒരേ നിലപാടോടെയോ പ്രവർത്തിച്ചു എന്നർഥമുള്ള ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ക്ഷണത്തോടുള്ള പ്രതികരണം വിപരീതമായതിനാൽ, ബന്ധകമായ καί ഇവിടെ സ്വാഭാവിക മലയാളത്തിൽ വൈരുധ്യം സൂചിപ്പിക്കുന്ന ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἤρξαντο ... παραιτεῖσθαι
  choice: ഒഴികഴിവു പറയാൻ തുടങ്ങി
  rationale: παραιτέομαι എന്ന മധ്യരൂപം ഇവിടെ ഒഴികഴിവു പറഞ്ഞ് ക്ഷണം നിരസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഒഴികഴിവു പറയുക’ തുടർന്നുവരുന്ന കാരണങ്ങളുമായി സ്വാഭാവികമായി ചേരുന്നു; നിരസിക്കൽ എന്ന ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ μιᾶς ... πάντες
  choice: അവരെല്ലാവരും ഒരുപോലെ
  rationale: πάντες എന്നതിന്റെ സമഗ്രതയും ἀπὸ μιᾶς എന്ന പ്രയോഗത്തിന്റെ കൂട്ടായ/ഒരേവിധത്തിലുള്ള പ്രതികരണവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Ἀγρόν
  choice: ഒരു വയൽ
  rationale: ἀγρός എന്നത് വയലിനെയോ ഭൂമിയുടെ ഒരു ഭാഗത്തെയോ സൂചിപ്പിക്കാം. കൃഷിയിടം എന്ന അധിക അർഥം നിർബന്ധിക്കാതെ നേരിട്ടുള്ള പദമായ ‘വയൽ’ സ്വീകരിച്ചു.
- source_word: ἠγόρασα
  choice: വാങ്ങിയിട്ടുണ്ട്
  rationale: പൂർത്തിയായ വാങ്ങലിന് ഇപ്പോഴത്തെ പ്രസക്തിയുണ്ടെന്ന സന്ദർഭഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἔχω ἀνάγκην
  choice: കാണേണ്ടതുണ്ട്
  rationale: ആവശ്യകതയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ നിർബന്ധരൂപത്തിൽ നൽകി.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: പുറത്തുപോയി അതു കാണേണ്ടതുണ്ട്
  rationale: പുറത്തുപോകലും തുടർന്ന് കാണലും എന്ന അനുബന്ധ പ്രവർത്തനക്രമം നിലനിർത്തുന്നു; ‘പരിശോധിക്കുക’ എന്നു നൽകി അർഥം അനാവശ്യമായി ശക്തമാക്കിയില്ല.
- source_word: ἐρωτῶ σε
  choice: ഞാൻ നിന്നോട് അപേക്ഷിക്കുന്നു
  rationale: ഇവിടെ സാധാരണ ചോദ്യം അല്ല, വിനീതമായ അഭ്യർഥനയാണ്; അതിനാൽ ‘അപേക്ഷിക്കുന്നു’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: ἔχε με παρῃτημένον
  choice: എന്റെ ഒഴികഴിവ് സ്വീകരിക്കണമെന്ന്
  rationale: വക്താവിന്റെ നിരസിക്കൽ അംഗീകരിച്ച് തന്നെ ഒഴിവാക്കണമെന്ന സാമൂഹിക ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്ക് ഫലാവസ്ഥയെ പദാനുപദമായി നൽകിയാൽ മലയാളത്തിൽ കൃത്രിമമാകും.
