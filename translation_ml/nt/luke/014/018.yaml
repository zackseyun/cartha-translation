translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘ഒഴികഴിവ്,’ ‘അപേക്ഷിക്കുന്നു’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും വിരുന്നിന്റെ ഔപചാരിക സന്ദർഭത്തിന് യോജിച്ചതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
