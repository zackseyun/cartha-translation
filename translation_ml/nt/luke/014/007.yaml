source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: ml
  text: 'ക്ഷണിക്കപ്പെട്ടവർ വിരുന്നിലെ മാന്യസ്ഥാനങ്ങൾ[a] എങ്ങനെ തിരഞ്ഞെടുത്തുകൊണ്ടിരുന്നു എന്നു ശ്രദ്ധിച്ച്, അവൻ അവരോടു ഇങ്ങനെ ഒരു ഉപമ പറഞ്ഞുകൊണ്ടിരുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രമുഖ ഇരിപ്പിടങ്ങൾ.’ ഗ്രീക്കുപദം വിരുന്നിലെ ഏറ്റവും ബഹുമാനിക്കപ്പെട്ട ഇരിപ്പിടങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ഒരു ഉപമ പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ അപൂർണ ഭൂതകാലം പശ്ചാത്തലപരമായോ തുടരുന്ന പ്രവൃത്തിയായോ മനസ്സിലാക്കാം. മലയാളത്തിൽ തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘പറഞ്ഞു’ ഉപയോഗിച്ചു; തുടരുന്ന ഭാവം മുഴുവൻ വാക്യത്തിന്റെ രംഗവിവരണത്തിലൂടെ ലഭിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ കൃത്രിമമായ ‘ഇപ്പോൾ’ അല്ലെങ്കിൽ അതിശക്തമായ ‘എന്നാൽ’ ചേർക്കാതെ വാക്യക്രമംകൊണ്ട് മാറ്റം സൂചിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: τοὺς κεκλημένους
  choice: ക്ഷണിക്കപ്പെട്ടവർ
  rationale: καλέωയുടെ perfect participle ക്ഷണം ലഭിച്ച നിലയിലുള്ളവരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അതിഥികൾ’ എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾപ്പെട്ടാലും, മൂലത്തിലെ ക്ഷണിക്കപ്പെട്ട നില നേരിട്ട് നിലനിർത്തി.
- source_word: παραβολήν
  choice: ഒരു ഉപമ
  rationale: സുവിശേഷങ്ങളിൽ παραβολήയ്ക്ക് പതിവായതും വായനക്കാർക്ക് പരിചിതവുമായ സമാനപദം ‘ഉപമ’ ആണ്.
- source_word: ἐπέχων
  choice: ശ്രദ്ധിച്ച
  rationale: ഉപമ പറയാൻ ഇടയായ ശ്രദ്ധാപൂർവമായ നിരീക്ഷണം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: അവർ സ്ഥാനങ്ങൾ തിരഞ്ഞെടുത്ത രീതിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: πρωτοκλισίας
  choice: വിരുന്നിലെ മാന്യസ്ഥാനങ്ങൾ
  rationale: വിരുന്നിൽ ഏറ്റവും ബഹുമാനിക്കപ്പെട്ട ചാരിയിരിപ്പിടങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സാമൂഹിക അർഥം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകാൻ ‘മാന്യസ്ഥാനങ്ങൾ’ ഉപയോഗിക്കുകയും സന്ദർഭവ്യക്തതയ്ക്കായി ‘വിരുന്നിലെ’ ചേർക്കുകയും ചെയ്തു.
- source_word: ἐξελέγοντο
  choice: തിരഞ്ഞെടുത്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ ഭാവം നിലനിർത്തുന്നു. Middle voice-ന്റെ സ്വഹിതസൂചന മലയാളത്തിലെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: λέγων πρὸς αὐτούς
  choice: അവരോട് ... പറഞ്ഞു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള പ്രസംഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കി.
