id: LUK.14.12
reference: Luke 14:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: ml
  text: 'തന്നെ ക്ഷണിച്ച ആളോടും അവൻ പറഞ്ഞു: “നീ ഉച്ചഭക്ഷണമോ അത്താഴമോ ഒരുക്കുമ്പോൾ, നിന്റെ സുഹൃത്തുക്കളെയോ സഹോദരന്മാരെയോ ബന്ധുക്കളെയോ ധനികരായ അയൽക്കാരെയോ ക്ഷണിക്കരുത്; അവർ നിന്നെ തിരികെ ക്ഷണിക്കുകയും, അത് നിനക്കുള്ള പ്രതിഫലമായിത്തീരുകയും ചെയ്യാതിരിക്കേണ്ടതിന്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അത് നിനക്കുള്ള പ്രതിഫലമായിത്തീരുകയും ചെയ്യാതിരിക്കേണ്ടതിന്.” “അവർ നിന്നെ തിരികെ ക്ഷണിക്കുക” എന്നത് പ്രത്യുപകാരമായി ക്ഷണിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: യേശു പറഞ്ഞു
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ അപൂർണ്ണകാല ക്രിയയെ ലളിതമായ ഭൂതകാലമായി നൽകി; καὶയുടെ ‘കൂടി/യും’ എന്ന ആശയം ‘ക്ഷണിച്ചവനോടും’ എന്നതിൽ നിലനിർത്തി.
- source_word: τῷ κεκληκότι αὐτόν
  choice: തന്നെ ക്ഷണിച്ചവനോട്
  rationale: ‘ആതിഥേയൻ’ എന്ന വ്യാഖ്യാനാത്മക പദത്തിനു പകരം ഗ്രീക്ക് perfect participle-ന്റെ അർഥം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: Ὅταν ποιῇς
  choice: നീ ... ഒരുക്കുമ്പോൾ
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ ποιέω ഭക്ഷണം നടത്തുക/ഒരുക്കുക എന്ന ആശയമാണ് നൽകുന്നത്; മലയാളത്തിൽ ‘ഒരുക്കുക’ സ്വാഭാവികമാണ്.
- source_word: ἄριστον
  choice: ഉച്ചഭക്ഷണം
  rationale: ദിവസത്തിലെ നേരത്തെയുള്ള, സാധാരണയായി ഉച്ചയോടടുത്ത ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘പ്രാതൽ’ ഒഴിവാക്കി.
- source_word: δεῖπνον
  choice: അത്താഴം
  rationale: പിന്നീടുള്ള പ്രധാന ഭക്ഷണത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: μὴ φώνει
  choice: ക്ഷണിക്കരുത്
  rationale: അക്ഷരാർഥമായ ‘വിളിക്കരുത്’ എന്നതിനെക്കാൾ വിരുന്നിലേക്കുള്ള ക്ഷണം ഈ സന്ദർഭത്തിൽ കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ἀδελφούς σου
  choice: നിന്റെ സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം അനാവശ്യമായി ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: τοὺς συγγενεῖς σου
  choice: നിന്റെ ബന്ധുക്കൾ
  rationale: സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആധുനികവുമായ തുല്യപദം.
- source_word: γείτονας πλουσίους
  choice: ധനികരായ അയൽക്കാർ
  rationale: വിശേഷണം അയൽക്കാരെ നേരിട്ട് വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἀντικαλέσωσίν σε
  choice: അവർ നിന്നെയും തിരികെ ക്ഷണിക്കുക
  rationale: പ്രത്യുപകാരമായി തിരിച്ചുക്ഷണിക്കുന്ന compound verb-ന്റെ പരസ്പരത വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: അങ്ങനെ നിനക്കു പ്രതിഫലം ലഭിക്കുക
  rationale: ‘അത് നിനക്കുള്ള പ്രതിഫലമായിത്തീരുക’ എന്ന അക്ഷരാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഇവിടെ പ്രതിഫലം പരസ്പര സാമൂഹിക തിരിച്ചടവാണെന്ന ആശയം നിലനിൽക്കുന്നു.
theological_decisions:
- issue: പ്രതിഫലത്തിന്റെ സ്വഭാവം
  choice: ‘നിനക്കു പ്രതിഫലം ലഭിക്കുകയും’ എന്ന നിഷ്പക്ഷ പ്രയോഗം
  alternative: ‘നിനക്കുള്ള കടം വീട്ടപ്പെടുകയും’ / ‘അവർ നിനക്കു പകരം ചെയ്യുകയും’
  rationale: ἀνταπόδομα തിരിച്ചുനൽകൽ അഥവാ പ്രതിഫലം എന്ന ആശയം വഹിക്കുന്നു. ദൈവിക പ്രതിഫലമോ വെറും സാമൂഹിക പകരംചെയ്യലോ എന്ന് പദത്തിലേക്ക് അധികമായി ഇറക്കുമതി ചെയ്യാതെ സന്ദർഭത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പവുമായ മലയാളം. ഗ്രീക്കിലെ നീണ്ട വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട കുറിപ്പിനോട് ചേർത്തിരിക്കുന്നു.
