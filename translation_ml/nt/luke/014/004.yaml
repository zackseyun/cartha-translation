translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. കർത്താവ് ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാകാൻ രണ്ടാം വാക്യത്തിൽ “യേശു” ചേർത്തിരിക്കുന്നു; മൂലപാഠത്തിലെ ഇരട്ട αὐτόν മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
