    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വിട്ടയച്ചു” അല്ലെങ്കിൽ “പിരിച്ചുവിട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: എന്നാൽ അവർ
  rationale: മുമ്പ് പരാമർശിച്ചിരുന്നവരെയാണ് οἱ സൂചിപ്പിക്കുന്നത്; യേശുവിന്റെ ചോദ്യത്തിന് അവർ മറുപടി പറയാതിരുന്നതിലെ വൈരുധ്യം δέ പ്രകടമാക്കുന്നു.
- source_word: ἡσύχασαν
  choice: മൗനം പാലിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ἡσυχάζω എന്നത് മറുപടി പറയാതെ ഇരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπιλαβόμενος
  choice: പിടിച്ചുകൊണ്ട്
  rationale: ἐπιλαμβάνομαι എന്ന ക്രിയയുടെ ശാരീരികമായി പിടിക്കുക എന്ന ആശയം നിലനിർത്തുന്നു; പിടിച്ച രീതിയെക്കുറിച്ച് മൂലപാഠം പറയാത്തതിനാൽ കൂടുതൽ വിശദീകരിക്കുന്നില്ല.
- source_word: ἰάσατο
  choice: സുഖപ്പെടുത്തി
  rationale: ശാരീരിക രോഗശാന്തിയുടെ സന്ദർഭത്തിൽ ἰάομαι എന്നതിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാള പരിഭാഷ.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: മുൻസന്ദർഭത്തിൽ രോഗിയായിരുന്ന പുരുഷനെയാണ് ഏകവചന പുല്ലിംഗ സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπέλυσεν
  choice: പറഞ്ഞയച്ചു
  rationale: ἀπολύω ഇവിടെ സുഖപ്പെടുത്തിയശേഷം പോകാൻ അനുവദിക്കുകയോ യാത്രയാക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു; തടവിൽനിന്നുള്ള മോചനം എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
