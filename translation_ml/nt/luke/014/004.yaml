  text: But they kept silent[a]. And taking hold of him[b], he healed him and sent him away.
translation:
  language: ml
  text: എന്നാൽ അവർ മൗനം പാലിച്ചു[a]. അവനെ പിടിച്ചുകൊണ്ട് യേശു അവനെ സുഖപ്പെടുത്തി, പറഞ്ഞയച്ചു[b].
  philosophy: optimal-equivalence
