id: LUK.14.30
reference: Luke 14:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες ὅτι Οὗτος ὁ ἄνθρωπος ἤρξατο οἰκοδομεῖν καὶ οὐκ ἴσχυσεν ἐκτελέσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/030.yaml
  text: saying[a], ‘This man began to build and was not able to finish.’
translation:
  language: ml
  text: “ഈ മനുഷ്യൻ പണിയാൻ തുടങ്ങി, പക്ഷേ പൂർത്തിയാക്കാൻ കഴിഞ്ഞില്ല” എന്നു പറഞ്ഞുകൊണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അത് പൂർത്തിയാക്കാനുള്ള ശക്തി ഉണ്ടായില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: എന്നു പറഞ്ഞുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ ബഹുവചന കർത്താവിനെ വിശേഷിപ്പിക്കുന്ന വർത്തമാനകാല കൃ_dantമായ λέγοντες-നെയും നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ὅτι-യെയും മലയാളത്തിലെ സ്വാഭാവികമായ ഉദ്ധരണി-പങ്കാളിത്ത ഘടനയിലൂടെ പ്രതിനിധീകരിക്കുന്നു.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: ഈ മനുഷ്യൻ
  rationale: സൂചകസർവനാമവും പുരുഷലിംഗ ഏകവചന നാമവും നേരിട്ടും അല്പം ചൂണ്ടിക്കാട്ടുന്ന പൊതുസ്വരത്തോടെയും നിലനിർത്തുന്നു.
- source_word: ἤρξατο οἰκοδομεῖν
  choice: പണിയാൻ തുടങ്ങി
  rationale: ‘പണിയാൻ ആരംഭിച്ചു’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ രൂപം; കർമം വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ ഘടന നിലനിർത്തുന്നു.
- source_word: οὐκ ἴσχυσεν
  choice: കഴിഞ്ഞില്ല
  rationale: ഇവിടെ ἰσχύω ശാരീരികബലം മാത്രമല്ല, ചെയ്യാനുള്ള ശേഷിയെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘കഴിഞ്ഞില്ല’ ഈ സന്ദർഭത്തിലെ കഴിവില്ലായ്മ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐκτελέσαι
  choice: പൂർത്തിയാക്കാൻ
  rationale: നിർമാണം അവസാനത്തോളം കൊണ്ടുപോകുക എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംസാരശൈലി. വാക്യം മുൻവാക്യത്തോട് ബന്ധിപ്പിക്കുന്ന പങ്കാളിത്തഭാവം അവസാനം ‘എന്നു പറഞ്ഞുകൊണ്ട്’ എന്ന രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു; പരിഹാസത്തിന്റെ നിറം അധികമായി ചേർത്തിട്ടില്ല.
