reference: Luke 14:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: ml
  text: 'അപ്പോൾ യജമാനൻ അടിമയോടു പറഞ്ഞു: “വഴികളിലേക്കും വേലിക്കെട്ടുകൾക്കരികിലേക്കും പുറപ്പെട്ടുചെന്ന്, എന്റെ വീട് നിറയേണ്ടതിന് അവരെ അകത്തേക്കു വരാൻ നിർബന്ധിക്കുക[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അകത്തേക്കു വരാൻ അവരെ ശക്തമായി പ്രേരിപ്പിക്കുക.” ഗ്രീക്ക് ക്രിയ ശക്തമായതാണ് (“നിർബന്ധിക്കുക,” “സമ്മർദം ചെലുത്തുക”); എന്നാൽ ഈ ഉപമയിൽ അത് ശാരീരിക ബലപ്രയോഗം അർത്ഥമാക്കണമെന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: യജമാനൻ
  rationale: ഉപമയുടെ കഥാസന്ദർഭത്തിൽ ഇത് വീടിന്റെ ഉടമയെയും അടിമയുടെ യജമാനനെയും സൂചിപ്പിക്കുന്നു; നേരിട്ടുള്ള ദൈവിക സ്ഥാനപ്പേരായി വായിക്കാതിരിക്കാൻ ‘യജമാനൻ’ യോജിക്കുന്നു.
- source_word: δοῦλον
  choice: അടിമ
  rationale: δοῦλος സൂചിപ്പിക്കുന്ന ബന്ധിത സാമൂഹികപദവി മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: Ἔξελθε
  choice: പുറപ്പെട്ടുചെന്ന്
  rationale: പുറത്തേക്കുള്ള ചലനവും തുടർന്ന് നിർദേശിച്ച സ്ഥലങ്ങളിലേക്കു പോകുന്നതും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁδοὺς
  choice: വഴികൾ
  rationale: പട്ടണത്തിനു പുറത്തേക്കുള്ള സഞ്ചാരപാതകൾ എന്ന സന്ദർഭാർത്ഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: φραγμοὺς
  choice: വേലിക്കരികുകൾ
  rationale: φραγμός എന്ന പദത്തിന്റെ വേലി/അതിര് എന്ന ദൃശ്യത്തെ നിലനിർത്തുകയും ആളുകളെ കണ്ടെത്താവുന്ന അതിരിടങ്ങളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνάγκασον
  choice: നിർബന്ധിക്കുക
  rationale: ക്രിയയുടെ ശക്തമായ ‘compel/press’ എന്ന അർത്ഥം മുഖ്യപാഠത്തിൽ മൃദൂകരിക്കാതെ സൂക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ശാരീരിക ബലപ്രയോഗം നിർബന്ധമായും ഉദ്ദേശിക്കുന്നില്ലെന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: εἰσελθεῖν
  choice: അകത്തേക്കു വരാൻ
  rationale: വീട്ടിലേക്കുള്ള പ്രവേശനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα γεμισθῇ
  choice: നിറയേണ്ടതിന്
  rationale: കല്പനയുടെ ഉദ്ദേശ്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: μου ὁ οἶκος
  choice: എന്റെ വീട്
  rationale: വിരുന്ന് നടക്കുന്ന ഭവനത്തെ നേരിട്ടും സന്ദർഭോചിതമായും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിൽ κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: കഥാലോകത്തിൽ ഈ പദം മനുഷ്യനായ വീട്ടുടമയുടെ സാമൂഹികപങ്കാണ് സൂചിപ്പിക്കുന്നത്. ‘യജമാനൻ’ എന്നത് ഉപമയുടെ ദൈവശാസ്ത്രപരമായ പ്രസക്തി നിഷേധിക്കാതെ നേരിട്ടുള്ള ദൈവിക സ്ഥാനപ്പേര് അനാവശ്യമായി ചുമത്തുന്നത് ഒഴിവാക്കുന്നു.
- issue: ἀνάγκασον എന്ന ക്രിയയുടെ ശക്തി
  choice: അകത്തേക്കു വരാൻ നിർബന്ധിക്കുക
  alternative: അകത്തേക്കു വരാൻ ശക്തമായി പ്രേരിപ്പിക്കുക
  rationale: ഗ്രീക്ക് ക്രിയയുടെ ശക്തി മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അതേസമയം ഉപമയുടെ സന്ദർഭത്തിൽ ശാരീരിക ബലപ്രയോഗം അനിവാര്യമായി അർത്ഥമാകുന്നില്ലെന്ന കാര്യം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. അടിമത്തപദവി ‘അടിമ’ എന്നു തുറന്നുപറയുകയും ἀνάγκασον എന്നതിലെ അർത്ഥസംഘർഷം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തുകയും ചെയ്തു.
