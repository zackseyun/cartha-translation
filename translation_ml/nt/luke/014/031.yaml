id: LUK.14.31
reference: Luke 14:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, മറ്റൊരു രാജാവിനെ യുദ്ധത്തിൽ നേരിടാൻ പുറപ്പെടുന്ന ഏതൊരു രാജാവും, ഇരുപതിനായിരം സൈനികരുമായി തനിക്കെതിരെ വരുന്നവനെ പതിനായിരം സൈനികരുമായി എതിരിടാൻ തനിക്കു കഴിയുമോ എന്ന് ആദ്യം ഇരുന്ന് ആലോചിക്കാതിരിക്കുമോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: യേശുവിന്റെ രണ്ടാമത്തെ ദൃഷ്ടാന്തപരമായ താരതമ്യം അവതരിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ ലളിതമായ സ്വാഭാവിക പരിഭാഷ.
- source_word: τίς βασιλεὺς
  choice: ഏതു രാജാവാണ്
  rationale: പൊതുവായ അർഥമുള്ള ഗ്രീക്ക് ചോദ്യപ്രയോഗത്തെയും അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യത്തെയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πορευόμενος
  choice: പുറപ്പെടുന്ന
  rationale: ലക്ഷ്യബോധത്തോടെയുള്ള യാത്രയെയോ നീക്കത്തെയോ സൂചിപ്പിക്കുന്നു; സൈനിക പശ്ചാത്തലം തുടർന്നുള്ള വാക്കുകളിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: മറ്റൊരു രാജാവുമായി യുദ്ധം ചെയ്യാൻ
  rationale: മറ്റൊരു രാജാവിനെതിരെ സായുധസംഘർഷത്തിൽ ഏർപ്പെടുക എന്ന സന്ദർഭാർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐχὶ ... βουλεύσεται
  choice: ആലോചിക്കാതിരിക്കുക?
  rationale: ഉവ്വ് എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ നിഷേധഘടന സംരക്ഷിക്കുന്നു.
- source_word: καθίσας πρῶτον
  choice: ആദ്യം ഇരുന്ന്
  rationale: ആലോചനയ്ക്കു മുമ്പുള്ള പ്രവർത്തനക്രമവും ചെലവ് കണക്കാക്കാൻ ശാന്തമായി ഇരിക്കുന്ന ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: εἰ δυνατός ἐστιν
  choice: തനിക്കു കഴിയുമോ എന്ന്
  rationale: അനുമതിയല്ല, ശേഷിയാണ് വിലയിരുത്തപ്പെടുന്നത് എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν δέκα χιλιάσιν
  choice: പതിനായിരം പേരെക്കൊണ്ട്
  rationale: രാജാവിന്റെ കൈവശമുള്ള സൈനികബലത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഉപകരണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑπαντῆσαι
  choice: നേരിടാൻ
  rationale: പദത്തിന്റെ അടിസ്ഥാനമായ ‘എതിരേറ്റുചെല്ലുക/കണ്ടുമുട്ടുക’ എന്ന ഭാവവും സൈനികസന്ദർഭത്തിലെ പ്രതിരോധാർഥവും ഒരുമിച്ച് വഹിക്കുന്നു.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: ഇരുപതിനായിരം പേരുമായി തനിക്കെതിരെ വരുന്നവനെ
  rationale: വലിയ സൈന്യവുമായി ശത്രുതാപൂർവം മുന്നേറിവരുന്ന എതിർരാജാവിനെ സൂചിപ്പിക്കുന്ന പങ്കുപദപ്രയോഗം സംക്ഷിപ്തമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. അലങ്കാരചോദ്യത്തിന്റെ നിഷേധരൂപവും സൈനികബലത്തിലെ അസമത്വവും നിലനിർത്തി; ‘പേർ’ എന്നത് സന്ദർഭത്തിൽ സൈനികരെ സൂചിപ്പിക്കുന്നു.
