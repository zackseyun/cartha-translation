translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് പദക്രമം യാന്ത്രികമായി പകർത്താതെ അതിന്റെ ആഖ്യാനപ്രവാഹവും തുടരുന്ന പ്രവർത്തനവും സൂക്ഷിച്ചു. δέ-യ്ക്ക് സന്ദർഭത്തിൽ അനാവശ്യമായ ‘ഇപ്പോൾ’ അല്ലെങ്കിൽ ശക്തമായ വൈരുധ്യസൂചകം ചേർത്തിട്ടില്ല.
