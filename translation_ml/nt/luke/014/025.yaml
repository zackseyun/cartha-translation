  yaml_path: translation/nt/luke/014/025.yaml
  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: ml
  text: 'വലിയ ജനക്കൂട്ടങ്ങൾ അവനോടൊപ്പം യാത്രചെയ്യുകയായിരുന്നു[a]. അവൻ തിരിഞ്ഞ് അവരോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അനേകം ജനക്കൂട്ടങ്ങൾ അവനോടൊപ്പം പോകുകയായിരുന്നു.” യേശു യാത്രചെയ്യുമ്പോൾ നിരവധി ജനക്കൂട്ടങ്ങൾ കൂടെ സഞ്ചരിച്ചിരുന്നുവെന്ന് ഗ്രീക്ക് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: അവനോടൊപ്പം യാത്രചെയ്യുകയായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലക്രിയ തുടരുന്ന മുൻകാല പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; യേശു യാത്രചെയ്യുമ്പോൾ ജനക്കൂട്ടങ്ങൾ കൂടെ സഞ്ചരിച്ചുകൊണ്ടിരുന്നതെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, നേരിയ ആഖ്യാനബന്ധമാണ്; മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും അത് മതിയായ രീതിയിൽ വഹിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോടൊപ്പം
  rationale: സർവനാമം നിലനിർത്തുകയും συμπορεύομαι എന്ന ക്രിയയോടുള്ള ദത്തിവിഭക്തിയുടെ സഹയാത്രാ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὄχλοι πολλοί
  choice: വലിയ ജനക്കൂട്ടങ്ങൾ
  rationale: ജനക്കൂട്ടങ്ങളുടെ ബഹുത്വവും അവയിൽ ധാരാളം ആളുകളുണ്ടായിരുന്നുവെന്ന ആശയവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ
  choice: വാക്യവിഭജനം വഴി ബന്ധിപ്പിച്ചു
  rationale: ഗ്രീക്കിലെ ലളിതമായ ബന്ധത്തെ മലയാളത്തിൽ രണ്ട് തുടർച്ചയായ വാക്യങ്ങളാക്കി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; അനുമാനാർഥമോ ഫലാർഥമോ ചേർക്കുന്നില്ല.
- source_word: στραφεὶς
  choice: തിരിഞ്ഞ്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ആഖ്യാനപ്രവർത്തനത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘തിരിഞ്ഞുനോക്കി’ എന്ന വിശദാംശം ചേർക്കുന്നില്ല.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന സാധാരണ പ്രസംഗക്രിയയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള തുല്യപദം.
- source_word: πρὸς αὐτούς
  choice: അവരോടു
  rationale: പ്രസംഗത്തിന്റെ അഭിസംബോധിതരെ സൂചിപ്പിക്കുന്ന πρός + ദ്വിതീയാവിഭക്തിയുടെ അർഥം നൽകുകയും ഗ്രീക്കിലെ സർവനാമം നിലനിർത്തുകയും ചെയ്യുന്നു.
