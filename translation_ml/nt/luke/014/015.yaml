  rationale: ‘ഇതു’ എന്ന ഏകവചനത്തിന് പകരം ταῦταയുടെ ബഹുവചനസൂചന നിലനിർത്താൻ ‘ഇതെല്ലാം’ ഉപയോഗിച്ചു. ആശീർവാദപ്രഖ്യാപനം സ്വാഭാവികവും പൂർണ്ണവുമായ രീതിയിൽ വരാൻ ‘അനുഗൃഹീതൻ’ എന്നതിനെ ‘അനുഗൃഹീതനാണ്’ ആക്കി. മറ്റെല്ലാ ഘടകങ്ങളും മൂലപാഠത്തിനും നിലവിലെ കുറിപ്പുകൾക്കും യോജിച്ചതാണ്.
