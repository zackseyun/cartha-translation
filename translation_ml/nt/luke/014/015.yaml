revisions:
- from: 'അവനോടൊപ്പം ഭക്ഷണത്തിനിരുന്നവരിൽ ഒരാൾ ഇതു കേട്ടപ്പോൾ അവനോട് പറഞ്ഞു: “ദൈവരാജ്യത്തിൽ അപ്പം ഭക്ഷിക്കുന്നവൻ[a] അനുഗൃഹീതൻ[b]!”'
