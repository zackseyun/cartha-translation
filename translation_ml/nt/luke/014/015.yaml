id: LUK.14.15
reference: Luke 14:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: ml
  text: 'അവനോടൊപ്പം ഭക്ഷണത്തിനിരുന്നവരിൽ ഒരാൾ ഇതെല്ലാം കേട്ടപ്പോൾ അവനോട് പറഞ്ഞു: “ദൈവരാജ്യത്തിൽ അപ്പം ഭക്ഷിക്കുന്നവൻ[a] അനുഗൃഹീതനാണ്[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അപ്പം ഭക്ഷിക്കുക” എന്നത് ഒരു ഭക്ഷണത്തിൽ പങ്കുചേരുക എന്ന അർഥത്തിലും ഉപയോഗിക്കാവുന്ന പ്രയോഗമാണ്; മുഖ്യപാഠം മൂലത്തിലെ അപ്പത്തിന്റെ ചിത്രം നിലനിർത്തുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ “ഭാഗ്യവാൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: കേൾവിയും തുടർന്നുള്ള സംസാരവും തമ്മിലുള്ള സമയബന്ധം സ്വാഭാവികമായ മലയാള ഉപവാക്യത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: δέ
  choice: വാക്യഘടനയിലൂടെ സൂചിപ്പിച്ചു; പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, കഥയിലെ മൃദുവായ മുന്നേറ്റമാണ്. മലയാളത്തിൽ ‘എന്നാൽ’ ചേർത്താൽ മൂലത്തിലുള്ളതിലധികം വിരോധഭാവം വരാം.
- source_word: τις τῶν συνανακειμένων
  choice: അവനോടൊപ്പം ഭക്ഷണത്തിനിരുന്നവരിൽ ഒരാൾ
  rationale: പേരറിയാത്ത ഒരു സഹഭോജകനെ സൂചിപ്പിക്കുന്നു. പുരാതന വിരുന്നിലെ ചാരിക്കിടക്കുന്ന ഇരിപ്പുരീതി അക്ഷരാർഥത്തിൽ അടിച്ചേൽപ്പിക്കാതെ ഭക്ഷണസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: ταῦτα
  choice: ഇതു
  rationale: യേശു തൊട്ടുമുമ്പ് പറഞ്ഞ കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഏകവചനരൂപമായ ‘ഇതു’ സ്വാഭാവികമാണ്.
- source_word: εἶπεν αὐτῷ
  choice: അവനോട് പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സാധാരണ വിവരണപ്രയോഗം നേരിട്ട്, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Μακάριος
  choice: അനുഗൃഹീതൻ
  rationale: വെറും മാനസിക സന്തോഷത്തേക്കാൾ ദൈവാനുകൂല്യവും അന്ത്യകാല പ്രത്യാശയും ഉൾക്കൊള്ളുന്ന ആശീർവാദപ്രഖ്യാപനത്തിന്റെ ഭാരം നിലനിർത്തുന്നു.
- source_word: ὅστις
  choice: ഭക്ഷിക്കുന്നവൻ
  rationale: പൊതുവായ, അനിശ്ചിതബന്ധവാചകത്തിന്റെ അർഥം മലയാളത്തിലെ ‘-ുന്നവൻ’ രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: φάγεται
  choice: ഭക്ഷിക്കുന്നവൻ
  rationale: ഗ്രീക്കിലെ ഭാവികാലം ദൈവരാജ്യത്തിലെ വരാനിരിക്കുന്ന പങ്കാളിത്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സന്ദർഭം ആ ഭാവിസൂചന വ്യക്തമാക്കുന്നതിനാൽ ഈ പൊതുരൂപം സ്വാഭാവികമാണ്.
- source_word: ἄρτον
  choice: അപ്പം
  rationale: മൂലത്തിലെ വ്യക്തമായ ഭക്ഷണചിത്രം നിലനിർത്തുന്നു; ഈ പ്രയോഗം ഒരു ഭക്ഷണത്തിൽ പങ്കുചേരുന്നതിനെയും സൂചിപ്പിക്കാം.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിൽ
  rationale: വിരുന്ന് എന്ന ആശയം സന്ദർഭത്തിൽ ഉള്ളതാണെങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത പദം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: അന്ത്യകാല വിരുന്നിനെക്കുറിച്ചുള്ള വാക്യത്തിൽ Μακάριος എന്ന പദത്തിന്റെ ആശീർവാദഭാവം
  choice: അനുഗൃഹീതൻ
  alternative: ഭാഗ്യവാൻ; സന്തുഷ്ടൻ
  rationale: പ്രസ്താവന വെറും വികാരപരമായ സന്തോഷമോ യാദൃച്ഛിക ഭാഗ്യമോ അല്ല, ദൈവരാജ്യത്തിൽ പങ്കുചേരുന്നവന്റെ അനുഗൃഹീതാവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഭക്ഷണസന്ദർഭം സ്വാഭാവികമാക്കിക്കൊണ്ട് മൂലത്തിലെ അപ്പം എന്ന ദൃശ്യപ്രതീകവും ആശീർവാദപ്രഖ്യാപനത്തിന്റെ ദൈവശാസ്ത്രഭാരവും സംരക്ഷിച്ചു.
