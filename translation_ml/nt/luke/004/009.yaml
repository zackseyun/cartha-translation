reference: Luke 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: ml
  text: 'പിന്നെ അവൻ അവനെ യെരൂശലേമിലേക്കു കൊണ്ടുപോയി ദൈവാലയസമുച്ചയത്തിന്റെ ഉയർന്ന അറ്റത്ത്[a][b] നിർത്തി അവനോടു പറഞ്ഞു: “നീ ദൈവപുത്രനാണെങ്കിൽ[c], ഇവിടെനിന്ന് നിന്നെത്തന്നെ താഴേക്കു എറിയുക;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവാലയത്തിന്റെ ചിറകിൽ.’ ഗ്രീക്ക് പദം ദൈവാലയസമുച്ചയത്തിലെ പുറത്തേക്കു തള്ളിനിൽക്കുന്ന അറ്റത്തെയോ ഉയർന്ന ഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള ഗ്രീക്ക് പദമായ ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, മുഴുവൻ ദൈവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘നീ ദൈവപുത്രനായതിനാൽ.’ ഗ്രീക്ക് നിബന്ധനയ്ക്ക് ആ ഭാവവും ഉണ്ടാകാം; എന്നാൽ പരീക്ഷകന്റെ വെല്ലുവിളി നിലനിർത്താൻ ഇവിടെ ‘എങ്കിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: alternative_reading
lexical_decisions:
- source_word: ⸂Ἤγαγεν δὲ⸃
  choice: പിന്നെ അവൻ അവനെ ... കൊണ്ടുപോയി
  rationale: δέ കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നതിനാൽ ‘പിന്നെ’ എന്നു നൽകി. ἄγω ഇവിടെ ഒരാളെ ഒരു സ്ഥലത്തേക്കു നയിക്കുകയോ കൊണ്ടുപോകുകയോ ചെയ്യുന്നതാണ്; സ്വാഭാവികമായ മലയാളത്തിന് ‘കൊണ്ടുപോയി’ അനുയോജ്യം.
- source_word: Ἰερουσαλήμ
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ സുപരിചിതമായ രൂപം.
- source_word: ἔστησεν
  choice: നിർത്തി
  rationale: ἵστημι എന്നതിന്റെ കാരകപ്രയോഗം ഇവിടെ ‘നിൽക്കുമാറാക്കി/നിർത്തി’ എന്ന അർഥം നൽകുന്നു; ‘നിർത്തി’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ
  choice: ദൈവാലയസമുച്ചയത്തിന്റെ ഉയർന്ന അറ്റത്ത്
  rationale: πτερύγιον അക്ഷരാർഥത്തിൽ ‘ചെറിയ ചിറക്’ എങ്കിലും വാസ്തുവിദ്യാ സന്ദർഭത്തിൽ പുറത്തേക്കു തള്ളിനിൽക്കുന്ന അറ്റത്തെയോ ഉയർന്ന അഗ്രത്തെയോ സൂചിപ്പിക്കുന്നു. ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രം അല്ല, മുഴുവൻ ദൈവാലയപരിസരമാണ്; അതിനാൽ ‘ദൈവാലയസമുച്ചയം’ എന്നു വ്യക്തമാക്കി.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: നീ ദൈവപുത്രനാണെങ്കിൽ
  rationale: εἰ + സൂചകക്രിയ ചില സന്ദർഭങ്ങളിൽ ‘ആയതിനാൽ/ആണല്ലോ’ എന്ന ഭാവം നൽകാമെങ്കിലും, ഇവിടെ പരീക്ഷകന്റെ വെല്ലുവിളി നിലനിർത്താൻ ‘എങ്കിൽ’ ഉപയോഗിച്ചു. υἱὸς ... τοῦ θεοῦ എന്നത് പദവിസൂചകമായി ‘ദൈവപുത്രൻ’ എന്നു നൽകി.
- source_word: βάλε σεαυτὸν
  choice: ചാടുക
  rationale: അക്ഷരാർഥം ‘നിന്നെത്തന്നെ എറിയുക’ എന്നാണെങ്കിലും, ഉയരത്തിൽനിന്നുള്ള സ്വയംനിർദേശിത ചലനത്തിന് ആധുനിക മലയാളത്തിൽ ‘ചാടുക’ കൂടുതൽ സ്വാഭാവികമാണ്; നിർദേശത്തിന്റെ അപകടകരമായ ശക്തി സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: ἐντεῦθεν κάτω
  choice: ഇവിടെനിന്നു താഴേക്കു
  rationale: സ്ഥലസൂചകമായ ἐντεῦθεν-നും താഴോട്ടുള്ള ചലനം സൂചിപ്പിക്കുന്ന κάτω-ക്കും നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപ്രയോഗം.
theological_decisions:
- issue: പരീക്ഷകൻ യേശുവിന്റെ ദൈവപുത്രത്വത്തെ ഉന്നയിക്കുന്ന വിധം
  choice: നീ ദൈവപുത്രനാണെങ്കിൽ
  alternative: നീ ദൈവപുത്രനായതിനാൽ / നീ ദൈവപുത്രനാണല്ലോ
  rationale: ഗ്രീക്ക് നിബന്ധനാവാക്യത്തിന് ഉറപ്പിനെ ആധാരമാക്കിയ വാദഭാവവും ഉണ്ടാകാം. എന്നാൽ ഈ പരീക്ഷണസന്ദർഭത്തിലെ വെല്ലുവിളിയും ദൈവപുത്രത്വത്തെക്കുറിച്ചുള്ള കഥനപരമായ സംഘർഷവും മുൻകൂട്ടി തീർപ്പാക്കാതിരിക്കാൻ ‘എങ്കിൽ’ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘ദേവാലയം’ എന്നതിനേക്കാൾ ബൈബിൾസന്ദർഭത്തിൽ സാധാരണവും വ്യക്തവുമായ ‘ദൈവാലയം’ ഉപയോഗിച്ചു. ἱερόν എന്ന പദത്തിന്റെ വിശാലപരിധി മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും വ്യക്തമാക്കി; വാക്യം അനാവശ്യമായി പരമ്പരാഗതമോ സംസ്കൃതഭാരിതമോ ആക്കിയിട്ടില്ല.
