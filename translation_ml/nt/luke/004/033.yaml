source:
  edition: SBLGNT
  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: ml
  text: ആ സിനഗോഗിൽ അശുദ്ധമായ ഒരു ഭൂതത്തിന്റെ ആത്മാവുള്ള ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു.[a] അവൻ ഉച്ചത്തിൽ നിലവിളിച്ചു:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അശുദ്ധമായ ഭൂതാത്മാവുള്ള ഒരു മനുഷ്യൻ.’ ഗ്രീക്കിൽ ‘ആത്മാവ്’, ‘ഭൂതം’ എന്നീ രണ്ടു പദങ്ങളും ഉണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘വലിയ ശബ്ദത്തിൽ നിലവിളിച്ചു.’
    reason: literal_rendering
lexical_decisions:
- source_word: συναγωγῇ
  choice: സിനഗോഗിൽ
  rationale: യഹൂദരുടെ കൂടിവരവിന്റെയും ആരാധനയുടെയും സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതികപദം നിലനിർത്തുന്നു; ‘സഭ’ എന്ന പൊതുവായ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: കഥയിലെ വ്യക്തി പുരുഷനാണെന്ന് തുടർന്നുള്ള പുരുഷലിംഗ സർവനാമവും വിവരണവും വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവികമായ ആഖ്യാനപ്രയോഗം.
- source_word: ἔχων
  choice: ഉള്ള
  rationale: ‘കൈവശംവെച്ചിരുന്ന/ഉണ്ടായിരുന്ന’ എന്ന അടിസ്ഥാനബന്ധം നിലനിർത്തുന്നു; ‘ബാധിച്ച’ അല്ലെങ്കിൽ ‘ആവേശിച്ച’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക ഭാഷ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: അശുദ്ധമായ ഒരു ഭൂതത്തിന്റെ ആത്മാവ്
  rationale: ഗ്രീക്കിലുള്ള ‘ആത്മാവ്’, ‘ഭൂതം’ എന്നീ രണ്ടു ഘടകങ്ങളും നിലനിർത്തുന്നു. ἀκαθάρτου എന്ന വിശേഷണം രൂപപരമായി δαιμονίου എന്ന പദത്തോടാണ് യോജിക്കുന്നത്; അതിനാൽ ‘അശുദ്ധമായ ഭൂതം’ എന്ന ബന്ധം മുഖ്യപാഠത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀνέκραξεν
  choice: നിലവിളിച്ചു
  rationale: ശക്തമായി വിളിച്ചുപറയുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയ്ക്ക് സ്വാഭാവികവും തീവ്രതയുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി ശബ്ദത്തിന്റെ ശക്തി അറിയിക്കുന്നു; പദാനുപദരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഭൂതാത്മാവിനെ സംബന്ധിക്കുന്ന പദപ്രയോഗം
  choice: അശുദ്ധമായ ഒരു ഭൂതത്തിന്റെ ആത്മാവ്
  alternative: അശുദ്ധമായ ഭൂതാത്മാവ് / അശുദ്ധാത്മാവ്
  rationale: πνεῦμα, δαιμόνιον എന്നീ രണ്ടു ഗ്രീക്കുപദങ്ങളും വിവർത്തനത്തിൽ നിലനിർത്തി അമാനുഷിക പരാമർശത്തെ ലഘൂകരിക്കാതെയും ‘ബാധിച്ചവൻ’ പോലുള്ള വ്യാഖ്യാനപരമായ അവകാശവാദം കൂട്ടിച്ചേർക്കാതെയും ഇരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സിനഗോഗ്’ എന്ന ചരിത്രപരമായ സ്ഥാപനപദം നിലനിർത്തി; അസ്വാഭാവികമായ സംയുക്തപദം ഒഴിവാക്കാൻ ഭൂതവും ആത്മാവും തമ്മിലുള്ള ബന്ധം ഷഷ്ഠിവിഭക്തിയിലൂടെ പ്രകടമാക്കി.
