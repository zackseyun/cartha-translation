  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: ml
  text: ആത്മാവിന്റെ ശക്തിയിൽ യേശു ഗലീലയിലേക്കു മടങ്ങിവന്നു. അവനെക്കുറിച്ചുള്ള വാർത്ത[a] ചുറ്റുമുള്ള പ്രദേശത്തെങ്ങും പരന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വർത്തമാനം,’ ‘കീർത്തി,’ അല്ലെങ്കിൽ ‘കിംവദന്തി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം വ്യാപകമായി പരക്കുന്ന ഒരു വിവരത്തെ സൂചിപ്പിക്കാം; അത് അനുകൂലമാണോ പ്രതികൂലമാണോ എന്നു പദംതന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: മടങ്ങിവന്നു
  rationale: ആഖ്യാനത്തിലെ തിരിച്ചുള്ള സഞ്ചാരത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ δυνάμει
  choice: ശക്തിയിൽ
  rationale: ἐν എന്നതിലെ മേഖല/രീതി സംബന്ധമായ അർഥസാധ്യത നിലനിർത്തുന്നു; ഉപകരണാർഥം മാത്രം സൂചിപ്പിക്കുന്ന ‘ശക്തിയാൽ’ എന്ന് ചുരുക്കുന്നില്ല.
- source_word: τοῦ πνεύματος
  choice: ആത്മാവിന്റെ
  rationale: അടുത്ത സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവാണ് സൂചിതൻ; എന്നാൽ മൂലത്തിൽ ἁγίου ഇല്ലാത്തതിനാൽ ‘പരിശുദ്ധ’ എന്ന് പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ഗലീലയിലേക്ക്
  rationale: യാത്രയുടെ ലക്ഷ്യസ്ഥാനം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: φήμη
  choice: വാർത്ത
  rationale: വ്യാപകമായി പരക്കുന്ന ഒരു വിവരത്തെ സൂചിപ്പിക്കുന്ന, അനുകൂലമോ പ്രതികൂലമോ എന്ന ഭാവം നിർബന്ധിക്കാത്ത സ്വാഭാവിക പദം.
- source_word: ἐξῆλθεν
  choice: പരന്നു
  rationale: ഗ്രീക്കിലെ പുറപ്പെട്ടുപോകുന്ന രൂപകത്തെ മലയാളത്തിൽ വാർത്തയെക്കുറിച്ച് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: ചുറ്റുമുള്ള പ്രദേശത്തെങ്ങും
  rationale: περίχωρος എന്നതിലെ ചുറ്റുപാടിന്റെ ഭൂമിശാസ്ത്രബോധവും καθ’ ὅλης എന്നതിലെ സമഗ്രവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ചുള്ള
  rationale: യേശുവിനെ സംബന്ധിച്ച വാർത്ത എന്ന ബന്ധം ലളിതവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: πνεύματος എന്നതിന്റെ സൂചിതൻ
  choice: സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവ്; പ്രധാനപാഠത്തിൽ ‘ആത്മാവ്’
  alternative: ഒരു നിർദിഷ്ടമല്ലാത്ത ആത്മാവ്; അല്ലെങ്കിൽ പ്രധാനപാഠത്തിൽ ‘പരിശുദ്ധാത്മാവ്’
  rationale: ലൂക്കോസ് 4-ന്റെ സമീപസന്ദർഭം പരിശുദ്ധാത്മാവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും ഈ വാക്യത്തിൽ ‘പരിശുദ്ധ’ എന്ന വിശേഷണം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ അത് ചേർക്കാതെ സന്ദർഭസൂചന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ശക്തിയിൽ’ എന്ന രൂപം മൂലത്തിലെ ബന്ധത്തിന്റെ തുറന്ന സ്വഭാവം സംരക്ഷിക്കുന്നു; ‘പരന്നു’ വാർത്തയെക്കുറിച്ചുള്ള സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
