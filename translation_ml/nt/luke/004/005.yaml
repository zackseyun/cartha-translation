  rationale: 'The revision makes two limited idiomatic improvements: it replaces the compressed, less natural ‘നിവസിതലോകം’ with ‘ജനവാസമുള്ള ലോകം,’ and it uses ‘ഒരു നിമിഷത്തിൽ’ for the point-like temporal expression. The revised wording retains the Greek sequence, upward motion, indirect object, scope of ‘all kingdoms,’ and ambiguity concerning how the kingdoms were shown.'
