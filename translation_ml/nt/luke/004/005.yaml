reference: Luke 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: ml
  text: പിന്നെ അവനെ മുകളിലേക്കു കൊണ്ടുപോയശേഷം, ഒരു നിമിഷത്തിൽ[a] ജനവാസമുള്ള ലോകത്തിലെ[b] സകല രാജ്യങ്ങളും അവന് കാണിച്ചുകൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ക്ഷണത്തിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ലോകത്തിലെ.’ ഗ്രീക്ക് പദം സാധാരണയായി ‘മനുഷ്യർ നിവസിക്കുന്ന ലോകം’ എന്നാണ് അർഥമാക്കുന്നത്; ചില സന്ദർഭങ്ങളിൽ പരിഷ്കൃത ലോകത്തെയോ സാമ്രാജ്യതല ലോകത്തെയോ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν αὐτὸν
  choice: അവനെ മുകളിലേക്കു കൂട്ടിക്കൊണ്ടുപോയി
  rationale: ἀνάγω എന്ന ക്രിയയിലെ മുകളിലേക്കുള്ള ചലനം നിലനിർത്തുന്നു; ലൂക്കോസ് പറയാത്ത ‘മല’ എന്ന സ്ഥലം ചേർക്കുന്നില്ല. മുൻകാലിക കൃതന്തത്തിന്റെ സംഭവക്രമം മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാശൃംഖലയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἔδειξεν αὐτῷ
  choice: അവനു കാണിച്ചുകൊടുത്തു
  rationale: δείκνυμι എന്നതിന്റെ സാധാരണ ആഖ്യാനാർഥമായ ‘കാണിക്കുക’ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πάσας τὰς βασιλείας
  choice: സകല രാജ്യങ്ങളും
  rationale: ഇവിടെ βασιλεία അമൂർത്തമായ രാജത്വത്തെയല്ല, രാജ്യങ്ങളെയോ ഭരണപ്രദേശങ്ങളെയോ സൂചിപ്പിക്കുന്നു; πάσας എന്ന സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: τῆς οἰκουμένης
  choice: നിവസിതലോകത്തിലെ
  rationale: οἰκουμένηയുടെ ‘മനുഷ്യർ നിവസിക്കുന്ന ലോകം’ എന്ന പ്രത്യേകത ‘ലോകം’ എന്ന പൊതുപദത്തേക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു; അതേസമയം ‘റോമാ സാമ്രാജ്യം’ എന്നു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἐν στιγμῇ χρόνου
  choice: ഒരു നിമിഷത്തിനുള്ളിൽ
  rationale: στιγμήയുടെ അത്യന്തം ഹ്രസ്വമായ കാലബിന്ദു എന്ന ആശയം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പിശാച് രാജ്യങ്ങൾ കാണിച്ച രീതിയുടെ സ്വഭാവം
  choice: എങ്ങനെ കാണിച്ചുവെന്ന് വിശദീകരിക്കാതെ സംഭവം വിവരണാത്മകമായി മാത്രം പരിഭാഷപ്പെടുത്തുക
  alternative: അത് ഒരു ദർശനമായിരുന്നെന്നോ, അത്യുച്ചമായ ഭൗമസ്ഥാനത്തുനിന്നുള്ള അക്ഷരാർഥ ദൃശ്യമായിരുന്നെന്നോ വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് പാഠം അവൻ രാജ്യങ്ങൾ കാണിച്ചുവെന്നു മാത്രമാണ് പറയുന്നത്. അതിന്റെ സംവിധാനം ദർശനപരമോ അത്ഭുതകരമോ ഭൗമശാസ്ത്രപരമോ എന്നു പാഠം തീർപ്പാക്കാത്തതിനാൽ പരിഭാഷയും ആ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘മുകളിലേക്കു’ എന്നത് മൂലപാഠത്തിലെ ദിശ നിലനിർത്തുന്നു; സമാന്തരവിവരണത്തിൽ നിന്നുള്ള ‘മല’ ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
