- from: പിന്നെ അവനെ മുകളിലേക്കു കൂട്ടിക്കൊണ്ടുപോയി, ഒരു നിമിഷത്തിനുള്ളിൽ[a] നിവസിതലോകത്തിലെ[b] സകല രാജ്യങ്ങളും അവനു കാണിച്ചുകൊടുത്തു.
