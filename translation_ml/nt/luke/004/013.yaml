  source_fidelity: The draft accurately represents the temporal participle, the devil as subject, his departure from Jesus, and the temporary character of ἄχρι καιροῦ. A small revision makes the comprehensive force of πάντα πειρασμόν and the ἀπό relationship more explicit in idiomatic Malayalam.
