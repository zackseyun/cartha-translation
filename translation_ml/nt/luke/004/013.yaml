id: LUK.4.13
reference: Luke 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ συντελέσας πάντα πειρασμὸν ὁ διάβολος ἀπέστη ἀπ’ αὐτοῦ ἄχρι καιροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: ml
  text: പിശാച് എല്ലാ പ്രലോഭനങ്ങളും[a] തീർത്തശേഷം, അനുകൂലമായ ഒരു സമയംവരെ അവനിൽനിന്ന് അകന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എല്ലാ പരീക്ഷണങ്ങളും.” ഗ്രീക്ക് പദത്തിന് “പ്രലോഭനം” എന്നും “പരീക്ഷണം” എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ പിശാചിന്റെ പങ്ക് പരിഗണിക്കുമ്പോൾ “പ്രലോഭനം” എന്നതാണ് കൂടുതൽ സ്വാഭാവികം.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: പൂർത്തിയാക്കിയശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് പൂർത്തിയായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πάντα πειρασμόν
  choice: എല്ലാ പ്രലോഭനവും
  rationale: ഏകവചനത്തോടുകൂടിയ πᾶς ഇവിടെ സമഗ്രമായ അർഥം നൽകുന്നു; പിശാചിന്റെ പ്രവർത്തനം പശ്ചാത്തലമായതിനാൽ ‘പ്രലോഭനം’ മുഖ്യപാഠത്തിന് യോജിക്കുന്നു.
- source_word: ὁ διάβολος
  choice: പിശാച്
  rationale: ലൂക്കോസിന്റെ വിവരണത്തിൽ വ്യക്തിപരമായ അതീന്ദ്രിയ എതിരാളിയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ പ്രമാണികവും സ്വാഭാവികവുമായ പദമാണിത്.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: അവനെ വിട്ടുപോയി
  rationale: ഒരാളിൽനിന്ന് അകന്നുപോകുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄχρι καιροῦ
  choice: അനുകൂലമായ ഒരു സമയംവരെ
  rationale: καιρός വെറും കാലയളവല്ല, യോജിച്ചോ അവസരോചിതമായോ സമയത്തെയും സൂചിപ്പിക്കാം; പിശാചിന്റെ പിന്മാറ്റം താൽക്കാലികവും തന്ത്രപരവുമാണെന്ന സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ അനുഭവവുമായി ബന്ധപ്പെട്ട πειρασμός എന്ന പദത്തിന്റെ അർഥനിറം
  choice: പ്രലോഭനം
  alternative: പരീക്ഷണം
  rationale: πειρασμός എന്നതിന് ‘പരീക്ഷണം’ എന്നും ‘പ്രലോഭനം’ എന്നും അർഥമാകാം. ഇവിടെ പ്രവർത്തകൻ പിശാചായതിനാലും അനുസരണത്തിൽനിന്ന് വ്യതിചലിപ്പിക്കാൻ ശ്രമിക്കുന്നതിനാലും മുഖ്യപാഠത്തിൽ ‘പ്രലോഭനം’ കൂടുതൽ സ്വാഭാവികമാണ്; യഥാർഥമായ അർഥദ്വന്ദ്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ കാലബന്ധവും πειρασμός എന്ന പദത്തിലെ യഥാർഥ അർഥദ്വന്ദ്വവും സംരക്ഷിച്ചിരിക്കുന്നു.
