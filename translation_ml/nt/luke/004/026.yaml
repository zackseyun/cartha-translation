id: LUK.4.26
reference: Luke 4:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: ml
  text: അവരിൽ ആരുടെയും അടുക്കലേക്ക് ഏലിയാവിനെ അയച്ചില്ല; സീദോൻ പ്രദേശത്തെ സാരെഫാത്തിലുള്ള ഒരു വിധവയുടെ അടുക്കലേക്കു മാത്രമാണ് അയച്ചത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘സീദോൻ പ്രദേശത്തെ സാരെപ്ത’; ഇത് പഴയനിയമത്തിലെ സാരെഫാത്ത് (1 രാജാക്കന്മാർ 17:9) ആണെന്ന് പരമ്പരാഗതമായി തിരിച്ചറിയപ്പെടുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπέμφθη
  choice: അയച്ചത് / അയച്ചില്ല
  rationale: പേരിടാത്ത കർത്താവോടുകൂടിയ ഗ്രീക്ക് കർമണിപ്രയോഗം നിലനിർത്തുന്നു; അയച്ചത് ദൈവമാണെന്ന് സന്ദർഭം സൂചിപ്പിച്ചാലും മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: അവരിൽ ആരുടെയും അടുക്കലേക്ക് ... അയച്ചില്ല
  rationale: വ്യക്തികളിലേക്കുള്ള ദിശയും οὐδεμίαν നൽകുന്ന സമ്പൂർണ നിഷേധവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Ἠλίας
  choice: ഏലിയാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: εἰ μὴ
  choice: മാത്രമാണ്
  rationale: ഇവിടെ നിബന്ധനയല്ല, ഏക അപവാദമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ നിഷേധം–മാത്രം ഘടന അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Σάρεπτα
  choice: സാരെഫാത്ത്
  rationale: ഗ്രീക്ക് Σάρεπτα എന്ന രൂപത്തിനുപിന്നിലെ പഴയനിയമ സ്ഥലനാമമായ സാരെഫാത്തിനെ തിരിച്ചറിയാൻ സഹായിക്കുന്ന പരിചിതരൂപം.
- source_word: τῆς Σιδωνίας
  choice: സീദോൻ പ്രദേശത്തെ
  rationale: ജനിറ്റീവ് ബന്ധത്തെ കൃത്രിമമായ ‘സീദോന്റെ’ എന്നതിനു പകരം ഭൂമിശാസ്ത്രപരമായ ബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γυναῖκα χήραν
  choice: ഒരു വിധവ
  rationale: ‘ഒരു സ്ത്രീ, ഒരു വിധവ’ എന്ന അപ്പോസിഷണൽ പ്രയോഗത്തിന്റെ അർഥം നഷ്ടപ്പെടാതെ സ്വാഭാവികമായി ചുരുക്കുന്നു.
theological_decisions:
- issue: ഏലിയാവിനെ അയച്ച കർത്താവ് ആരെന്നത്
  choice: കർത്താവിനെ പേരെടുത്തു പറയാതെ കർമണിപ്രയോഗം നിലനിർത്തി
  alternative: ‘ദൈവം ഏലിയാവിനെ അയച്ചില്ല ... അയച്ചു’
  rationale: ഗ്രീക്ക് വാക്യം അയച്ചവനെ വ്യക്തമാക്കുന്നില്ല. ദൈവിക പ്രവർത്തനം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും പാഠം പറയുന്നതിലധികം മുഖ്യവാചകത്തിൽ ചേർക്കാതിരിക്കാൻ പേരിടാത്ത കർമണിപ്രയോഗം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ നിഷേധം–അപവാദ ഘടന മലയാളത്തിൽ ‘അയച്ചില്ല ... മാത്രമാണ് അയച്ചത്’ എന്നു പുനഃക്രമീകരിച്ചു. അടുക്കലേക്ക്/അടുക്കലേക്കു എന്ന പ്രയോഗം വ്യക്തികളിലേക്കുള്ള πρὸς എന്ന ദിശാബന്ധം സൂക്ഷിക്കുന്നു.
