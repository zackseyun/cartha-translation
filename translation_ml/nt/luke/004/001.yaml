source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ⸂πλήρης πνεύματος ἁγίου⸃ ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, καὶ ἤγετο ἐν τῷ πνεύματι ⸂ἐν τῇ ἐρήμῳ⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: ml
  text: പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞവനായി യേശു യോർദാനിൽനിന്ന് മടങ്ങി; മരുഭൂമിയിൽ ആത്മാവിനാൽ[a] നയിക്കപ്പെട്ടുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആത്മാവിൽ.’ ഗ്രീക്ക് പ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ ആത്മാവാണ് യേശുവിനെ നയിച്ചതെന്ന അർഥമാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞവനായി
  rationale: πλήρης എന്ന പദത്തോടൊപ്പമുള്ള ജനിറ്റീവ് ഘടന ഒരു നിലയെ—പരിശുദ്ധാത്മാവിന്റെ നിറവുള്ളവനായിരിക്കുക—വിവരിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ഈ പ്രയോഗം ഒരു ക്ഷണിക നിറയ്ക്കൽസംഭവമെന്ന ആശയം പ്രത്യേകം ചേർക്കുന്നില്ല.
- source_word: ὑπέστρεψεν
  choice: മടങ്ങി
  rationale: ὑποστρέφωയുടെ എയോറിസ്റ്റ് രൂപത്തിന്റെ സാധാരണ അർഥമായ ‘തിരികെ വരുക/മടങ്ങുക’ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: യോർദാനിൽനിന്ന്
  rationale: ഗ്രീക്കിൽ ‘നദി’ എന്ന വിശദീകരണപദം ചേർത്തിട്ടില്ല; മലയാളത്തിലും യോർദാൻ എന്ന സ്ഥലനാമം മാത്രം സ്വാഭാവികമാണ്.
- source_word: ἤγετο
  choice: നയിക്കപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് പാസീവ് രൂപത്തിലെ ഭൂതകാല തുടർച്ചയും കർമണിപ്രയോഗവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: ἐν τῷ πνεύματι
  choice: ആത്മാവിനാൽ
  rationale: പാസീവ് ἄγωയോടുള്ള ἐν ഇവിടെ നടത്തിപ്പുകാരനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി ഗ്രഹിക്കാം. തൊട്ടുമുമ്പുള്ള ‘പരിശുദ്ധാത്മാവ്’ തന്നെയാണ് സൂചിതനെന്ന സന്ദർഭബന്ധം നിലനിർത്തുന്നു; അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: ἔρημος ജനവാസമില്ലാത്ത വരണ്ട പ്രദേശത്തെയോ വിജനപ്രദേശത്തെയോ സൂചിപ്പിക്കാം. ‘മരുഭൂമി’ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾപ്രയോഗമാണ്; മണൽമരുഭൂമി മാത്രമെന്ന് നിർബന്ധിക്കുന്നില്ല.
- source_word: δὲ
  choice: വാക്യപ്രവാഹത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: δέ ലഘുവായ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭവുമായി ബന്ധമുള്ള ഒറ്റവാക്യഘടന മലയാളത്തിൽ അതിന്റെ പ്രവാഹം സ്വാഭാവികമായി നൽകുന്നതിനാൽ പ്രത്യേക സംയോജകപദം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ἐν τῷ πνεύματι എന്നതിലെ ‘ആത്മാവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പരിശുദ്ധാത്മാവ് യേശുവിനെ നയിച്ചു
  alternative: യേശുവിന്റെ ആന്തരിക ആത്മീയാവസ്ഥയിൽ
  rationale: തൊട്ടുമുമ്പ് യേശു ‘പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞവൻ’ എന്നു പറയുന്നതും ലൂക്കോസിന്റെ ആഖ്യാനത്തിൽ പരിശുദ്ധാത്മാവ് പ്രവർത്തിക്കുന്ന വ്യക്തിയായി വരുന്നതും ഒരേ പരിശുദ്ധാത്മാവിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നതെന്ന വായനയെ ശക്തമാക്കുന്നു. അതിനപ്പുറമുള്ള സിദ്ധാന്തവ്യാഖ്യാനം പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ആഖ്യാനശൈലി. ഇംപെർഫെക്റ്റിന്റെ തുടർച്ച ‘നയിക്കപ്പെട്ടുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തി; ἐν τῷ πνεύματι എന്നതിലെ യഥാർഥ ഭാഷാപരമായ സാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
