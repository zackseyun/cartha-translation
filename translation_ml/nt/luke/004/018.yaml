revisions:
- from: “കർത്താവിന്റെ ആത്മാവ് എന്റെമേൽ ഉണ്ട്; കാരണം ദരിദ്രരോടു സുവാർത്ത അറിയിക്കാൻ അവിടുന്ന് എന്നെ അഭിഷേകം ചെയ്തു. തടവുകാർക്കു മോചനം[a] പ്രഖ്യാപിക്കാനും അന്ധർക്കു കാഴ്ച വീണ്ടുകിട്ടുമെന്ന് അറിയിക്കാനും തകർന്നവരെ മോചനത്തിലേക്ക് അയയ്ക്കാനും[b] അവിടുന്ന് എന്നെ അയച്ചിരിക്കുന്നു.”
  to: “കർത്താവിന്റെ ആത്മാവ് എന്റെ മേൽ ഉണ്ട്; കാരണം ദരിദ്രരോടു സുവാർത്ത അറിയിക്കാൻ അവിടുന്ന് എന്നെ അഭിഷേകം ചെയ്തു. തടവുകാർക്കു മോചനം[a] പ്രഖ്യാപിക്കാനും അന്ധർക്കു കാഴ്ച വീണ്ടുകിട്ടുമെന്നു പ്രഖ്യാപിക്കാനും തകർക്കപ്പെട്ടവരെ മോചനം നൽകി വിട്ടയക്കാനും[b] അവിടുന്ന് എന്നെ അയച്ചിരിക്കുന്നു.”
  rationale: The revision corrects the final infinitival clause so that liberation describes the condition/result in which the broken are sent out, rather than a destination to which they are sent. It also uses “പ്രഖ്യാപിക്കാനും” for κηρύξαι in both coordinated clauses and narrows the first note to the actual lexical alternative, avoiding an added reference to sins. The translation preserves the deliberate repetition of ἄφεσις as “മോചനം.”
