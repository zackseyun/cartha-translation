id: LUK.4.18
reference: Luke 4:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: ml
  text: “കർത്താവിന്റെ ആത്മാവ് എന്റെ മേൽ ഉണ്ട്; കാരണം ദരിദ്രരോടു സുവാർത്ത അറിയിക്കാൻ അവിടുന്ന് എന്നെ അഭിഷേകം ചെയ്തു. തടവുകാർക്കു മോചനം[a] പ്രഖ്യാപിക്കാനും അന്ധർക്കു കാഴ്ച വീണ്ടുകിട്ടുമെന്നു പ്രഖ്യാപിക്കാനും തകർക്കപ്പെട്ടവരെ മോചനം നൽകി വിട്ടയക്കാനും[b] അവിടുന്ന് എന്നെ അയച്ചിരിക്കുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“മോചനം” എന്നതിന് “ക്ഷമ” എന്നും പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: ἄφεσις). ഇവിടെ തടവുകാരെയും തകർക്കപ്പെട്ടവരെയും കുറിച്ചുള്ള സന്ദർഭം വിടുതൽ എന്ന അർഥത്തിനു മുൻതൂക്കം നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “തകർക്കപ്പെട്ടവരെ.” ഈ പദം പീഡിതരെയോ അടിച്ചമർത്തപ്പെട്ടവരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου ἐπ’ ἐμέ
  choice: കർത്താവിന്റെ ആത്മാവ് എന്റെമേൽ ഉണ്ട്
  rationale: ഗ്രീക്കിലെ ക്രിയാരഹിതമായ വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഉണ്ട്’ ചേർത്തു; ἐπίയുടെ ‘മേൽ’ എന്ന തിരുവെഴുത്തുസ്വരം നിലനിർത്തുന്നു.
- source_word: οὗ εἵνεκεν ἔχρισέν με
  choice: കാരണം ... അവിടുന്ന് എന്നെ അഭിഷേകം ചെയ്തു
  rationale: οὗ εἵνεκεν എന്നതിന്റെ കാരണാർഥം നേരിട്ട് നൽകുകയും χρίωയുടെ അഭിഷേക-മശീഹാ അനുരണനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: ദരിദ്രരോടു സുവാർത്ത അറിയിക്കാൻ
  rationale: εὐαγγελίζωയെ സഭാപരമായ സാങ്കേതിക പദത്തിൽ ചുരുക്കാതെ സന്തോഷവാർത്ത അറിയിക്കുന്ന പ്രവർത്തിയായി നൽകുന്നു; πτωχοίയെ അധികവ്യാഖ്യാനം കൂടാതെ ‘ദരിദ്രർ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἀπέσταλκέν με
  choice: അവിടുന്ന് എന്നെ അയച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ അയയ്ക്കലിന്റെ തുടർന്നുനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന perfect രൂപം ‘അയച്ചിരിക്കുന്നു’ എന്നു നൽകുന്നു.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: തടവുകാർക്കു മോചനം
  rationale: തടവുകാരെന്ന അടുത്ത സന്ദർഭത്തിൽ ἄφεσις മോചനം/വിടുതൽ എന്ന അർഥമാണ് മുൻനിൽക്കുന്നത്; പാപമോചനമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: അന്ധർക്കു കാഴ്ച വീണ്ടുകിട്ടുമെന്ന്
  rationale: ἀνάβλεψις വെറും ‘കാഴ്ച’യല്ല, കാഴ്ച ലഭിക്കുകയോ വീണ്ടുകിട്ടുകയോ ചെയ്യുന്നതാണ്; പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കമായി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: τεθραυσμένους
  choice: തകർന്നവരെ
  rationale: θραύωയുടെ perfect passive participle സൂചിപ്പിക്കുന്ന ‘തകർക്കപ്പെട്ടവർ’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു; ‘പീഡിതർ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἀποστεῖλαι ... ἐν ἀφέσει
  choice: മോചനത്തിലേക്ക് അയയ്ക്കാനും
  rationale: ἀποστέλλωയുടെ ‘അയയ്ക്കുക’ എന്ന ക്രിയയും ആവർത്തിക്കുന്ന ἄφεσις എന്ന നാമവും നിലനിർത്തുന്നു. ἐν എന്നതിനെ ‘-ത്തിലേക്ക്’ എന്നു നൽകുന്നത് സ്വതന്ത്രാവസ്ഥയിലേക്കുള്ള വിടുതൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈ യെശയ്യാ ഉദ്ധരണിയിലെ ἄφεσις എന്ന പദത്തിന്റെ അർഥം
  choice: മോചനം
  alternative: പാപമോചനം / ക്ഷമ
  rationale: തടവുകാർ, അന്ധർ, തകർന്നവർ എന്നീ സമീപപദങ്ങളും യെശയ്യാവിലെ വിടുതൽ പശ്ചാത്തലവും ഇവിടെ മോചനാർഥത്തെ മുൻനിർത്തുന്നു. ലൂക്കോസിൽ ഈ പദത്തിന് പാപമോചനാർഥവും ഉള്ളതിനാൽ ആ യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: τεθραυσμένους എന്നതിന്റെ രൂപകാർഥം
  choice: തകർന്നവർ
  alternative: പീഡിതർ / അടിച്ചമർത്തപ്പെട്ടവർ
  rationale: മൂലത്തിലെ ‘തകർക്കപ്പെട്ടവർ’ എന്ന ശക്തമായ രൂപകം നിലനിർത്തുന്നു; ആരാൽ അല്ലെങ്കിൽ ഏത് വിധത്തിൽ തകർക്കപ്പെട്ടു എന്നു പാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘പീഡിതർ’ എന്നു മാത്രം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമമായി ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. മൂലത്തിലെ ‘പ്രഖ്യാപിക്കുക/അറിയിക്കുക’ എന്ന ആവർത്തനസ്വഭാവവും ἄφεσις എന്ന പദത്തിന്റെ ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തി; എന്നാൽ മലയാളത്തിലെ വ്യക്തതയ്ക്കായി അന്ധരെക്കുറിച്ചുള്ള ഘടകത്തിൽ ‘അറിയിക്കാനും’ ചേർത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
