id: LUK.4.40
reference: Luke 4:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: ml
  text: സൂര്യൻ അസ്തമിച്ചുകൊണ്ടിരിക്കുമ്പോൾ[a], പലതരം രോഗങ്ങൾ ബാധിച്ചവരെ തങ്ങളുടെ പക്കലുണ്ടായിരുന്ന എല്ലാവരും അവരെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു. അവനാകട്ടെ, അവരിൽ ഓരോരുത്തരുടെയുംമേൽ കൈകൾ വെച്ച് അവരെ സൗഖ്യമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സൂര്യൻ അസ്തമിക്കുമ്പോൾ.’ ഗ്രീക്കിൽ വർത്തമാനകാല കൃദന്തരൂപത്തോടുകൂടിയ ഷഷ്ഠീ-നിരപേക്ഷ പ്രയോഗം (genitive absolute) ആണ്; ഈ സംഭവങ്ങൾ നടന്ന സമയത്തെയും പ്രവൃത്തികളുടെ സമകാലികതയെയും അത് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: സൂര്യൻ അസ്തമിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപമുള്ള genitive absolute, സൂര്യൻ അസ്തമിക്കുന്നതിനോടൊപ്പം നടന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ‘അസ്തമിച്ചുകൊണ്ടിരിക്കുമ്പോൾ’ എന്നത് ഈ സമകാലികതയും തുടരുന്ന പ്രവൃത്തിഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἅπαντες ὅσοι
  choice: എല്ലാവരെയും
  rationale: ഈ സംയുക്തപ്രയോഗം സമഗ്രതയ്ക്ക് ഊന്നൽ നൽകുന്നു. മലയാളവാക്യഘടനയിൽ രോഗികളായ ആളുകളെ സൂചിപ്പിക്കുന്ന ‘എല്ലാവരെയും’ അതിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: εἶχον ἀσθενοῦντας νόσοις ποικίλαις
  choice: പലതരം രോഗങ്ങൾ ബാധിച്ചവർ തങ്ങളുടെ പക്കലുണ്ടായിരുന്ന
  rationale: ἔχω ഇവിടെ രോഗികൾ കുടുംബത്തിലോ പരിചരണത്തിലോ ഉണ്ടായിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; νόσοις ποικίλαις രോഗങ്ങളുടെ വൈവിധ്യം വ്യക്തമാക്കുന്നു. ‘തങ്ങളുടെ പക്കലുണ്ടായിരുന്ന’ എന്നത് ബന്ധം അനാവശ്യമായി കുടുംബബന്ധമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: അവർ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: ഈ രോഗശാന്തിസന്ദർഭത്തിൽ ἄγω എന്നതിന് സ്വാഭാവികമായ അർഥം ‘കൊണ്ടുവരുക’ എന്നാണ്.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: അവരിൽ ഓരോരുത്തരുടെയുംമേൽ
  rationale: ഇരട്ട വിതരണപ്രയോഗം ഓരോ വ്യക്തിക്കും ലഭിച്ച പ്രത്യേക ശ്രദ്ധയെ ഊന്നിപ്പറയുന്നു; ‘ഓരോരുത്തരുടെയുംമേൽ’ അത് വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: കൈകൾ വെച്ച്
  rationale: ἐπιτίθημι + χεῖρας എന്നത് ഒരാളുടെമേൽ കൈകൾ വെക്കുന്ന ദൃശ്യവും ശാരീരികവുമായ പ്രവൃത്തിയാണ്. ബഹുവചനമായ ‘കൈകൾ’ മൂലപാഠത്തോട് യോജിക്കുന്നു.
- source_word: ἐθεράπευεν
  choice: സൗഖ്യമാക്കി
  rationale: അപൂർണ്ണഭൂതകാലരൂപം ഓരോരുത്തരെയും തുടർച്ചയായി/ആവർത്തിച്ച് സൗഖ്യമാക്കിയതിനെ സൂചിപ്പിക്കുന്നു. ‘ഓരോരുത്തരുടെയുംമേൽ’ എന്ന വിതരണപ്രയോഗത്തോടൊപ്പം ‘സൗഖ്യമാക്കി’ സ്വാഭാവിക മലയാളത്തിൽ ആ ഭാവം വഹിക്കുന്നു.
theological_decisions:
- issue: കൈകൾ വെച്ചുള്ള രോഗശാന്തിയുടെ അവതരണം
  choice: അവരിൽ ഓരോരുത്തരുടെയുംമേൽ കൈകൾ വെച്ച് അവരെ സൗഖ്യമാക്കി
  alternative: അവരിൽ ഓരോരുത്തരുടെയുംമേൽ കൈകൾ വെച്ചുകൊണ്ട് അവരെ സൗഖ്യമാക്കിക്കൊണ്ടിരുന്നു
  rationale: വാക്യം യേശുവിന്റെ വ്യക്തിപരവും ശാരീരികവുമായ പ്രവൃത്തിയും ഓരോ രോഗിയോടുള്ള ശ്രദ്ധയും രേഖപ്പെടുത്തുന്നു. പിൽക്കാല സഭാചാരങ്ങളെയോ സാക്രമെന്റൽ അർഥങ്ങളെയോ പാഠത്തിലേക്ക് ചേർക്കാതെ മൂലത്തിലെ ദൃശ്യപ്രവൃത്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘അവനാകട്ടെ’ δέയുടെ നേരിയ വിഷയംമാറ്റം പ്രകടമാക്കുന്നു; മതവിഭാഗപരമായ സാങ്കേതികഭാഷ ഒഴിവാക്കിയിരിക്കുന്നു.
