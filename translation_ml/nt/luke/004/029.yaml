id: LUK.4.29
reference: Luke 4:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: ml
  text: അവർ എഴുന്നേറ്റ് അവനെ പട്ടണത്തിൽനിന്ന് പുറത്താക്കി. പിന്നെ, തങ്ങളുടെ പട്ടണം പണിതിരുന്ന മലയുടെ വക്കുവരെ അദ്ദേഹത്തെ കൊണ്ടുചെന്നു, അവിടെനിന്ന് താഴേക്കു തള്ളിയിടുന്നതിനായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: എഴുന്നേറ്റ്
  rationale: കൂട്ടം പെട്ടെന്ന് പ്രവർത്തനത്തിലേക്കു നീങ്ങുന്നതിന്റെ ശാരീരികവും ആഖ്യാനപരവുമായ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐξέβαλον
  choice: പുറത്തേക്കു തള്ളിക്കൊണ്ടുപോയി
  rationale: ബലപ്രയോഗത്തോടെയുള്ള പുറത്താക്കൽ സൂചിപ്പിക്കുന്നു; ഭൂതോച്ചാടനവുമായി ബന്ധപ്പെട്ടേക്കാവുന്ന സഭാപരമായ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: πόλεως
  choice: പട്ടണം
  rationale: πόλις എന്നതിന് നഗരം എന്നും അർഥമുണ്ടെങ്കിലും, നസറത്തിന്റെ സാഹചര്യത്തിൽ ‘പട്ടണം’ സ്വാഭാവികവും യോജിച്ചതുമാണ്.
- source_word: ἤγαγον
  choice: കൊണ്ടുചെന്നു
  rationale: ἄγωയുടെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ഗ്രീക്ക് ക്രിയയിൽ വ്യക്തമല്ലാത്ത ‘വലിച്ചിഴച്ചു’ എന്ന അധിക തീവ്രത ചേർക്കുന്നില്ല.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: മലയുടെ വക്കുവരെ
  rationale: ὀφρύς എന്നതിന്റെ രൂപകാത്മകമായ ‘നെറ്റിത്തടം’ എന്ന പദാനുപദ പ്രയോഗത്തേക്കാൾ ഉയരത്തിന്റെ അരിക് എന്ന സ്ഥലവിവരം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: തങ്ങളുടെ പട്ടണം പണിതിരുന്ന മലയുടെ
  rationale: പട്ടണം ആ മലയുടെമേൽ പണിതിരുന്നതും αὐτῶν സൂചിപ്പിക്കുന്ന പ്രാദേശിക ഉടമസ്ഥബോധവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ὥστε κατακρημνίσαι αὐτόν
  choice: അവിടെനിന്ന് താഴേക്കു തള്ളിയിടാൻ ഒരുങ്ങി
  rationale: ഉയരത്തിൽനിന്ന് തലകീഴായി തള്ളിയിടാനുള്ള ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘കൊല്ലാൻ’ എന്ന വ്യാഖ്യാനം നേരിട്ട് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: കൂട്ടത്തിന്റെ അക്രമവും ഉദ്ദേശ്യവും എത്രത്തോളം വ്യക്തമാക്കണം
  choice: ബലപ്രയോഗവും ഉയരത്തിൽനിന്ന് തള്ളിയിടാനുള്ള ഉദ്ദേശ്യവും പ്രവൃത്തികളുടെ ക്രമത്തിലൂടെ വ്യക്തമാക്കുക
  alternative: ‘കൊല്ലാൻ ശ്രമിച്ചു’ എന്ന് നേരിട്ട് വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ അക്രമത്തിന്റെ തീവ്രത കുറയ്ക്കുന്ന മൃദുവായ ഭാഷ ഉപയോഗിക്കുക
  rationale: വാക്യം കൊലപ്പെടുത്താനുള്ള ഉദ്ദേശ്യം ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഉറവിടത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെ അതു പ്രവർത്തനങ്ങളിൽനിന്ന് വായനക്കാരൻ ഗ്രഹിക്കാൻ അനുവദിക്കുന്നു.
- issue: ὥστε + infinitive ന്റെ ഉദ്ദേശ്യ/ഫല സൂക്ഷ്മത
  choice: ‘തള്ളിയിടാൻ ഒരുങ്ങി’ എന്ന ഉദ്ദേശ്യപ്രധാനമായ പ്രയോഗം
  alternative: ‘അങ്ങനെ താഴേക്കു തള്ളിയിട്ടു’ എന്ന യഥാർത്ഥ ഫലമായി വായിക്കാവുന്ന പ്രയോഗം
  rationale: തുടർന്നുള്ള ആഖ്യാനത്തോടും ഈ ഘടനയുടെ സന്ദർഭോചിതമായ ഉദ്ദേശ്യഭാവത്തോടും യോജിക്കുന്നു; തള്ളിയിടൽ നടന്നുവെന്ന് തെറ്റായി സൂചിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മലയുടെ വക്ക്’ സ്ഥലവിവരം സ്വാഭാവികമായി നൽകുന്നു. യേശുവിനെ ആദ്യം പേരോടെ പരാമർശിക്കുകയും തുടർന്ന് ‘അദ്ദേഹത്തെ’ ഉപയോഗിക്കുകയും ചെയ്തു.
