revisions:
- from: അവർ എഴുന്നേറ്റ് യേശുവിനെ പട്ടണത്തിനു പുറത്തേക്കു തള്ളിക്കൊണ്ടുപോയി. പിന്നെ, തങ്ങളുടെ പട്ടണം പണിതിരുന്ന മലയുടെ വക്കുവരെ അദ്ദേഹത്തെ കൊണ്ടുചെന്നു, അവിടെനിന്ന് താഴേക്കു തള്ളിയിടാൻ ഒരുങ്ങി.
  to: അവർ എഴുന്നേറ്റ് അവനെ പട്ടണത്തിൽനിന്ന് പുറത്താക്കി. പിന്നെ, തങ്ങളുടെ പട്ടണം പണിതിരുന്ന മലയുടെ വക്കുവരെ അദ്ദേഹത്തെ കൊണ്ടുചെന്നു, അവിടെനിന്ന് താഴേക്കു തള്ളിയിടുന്നതിനായി.
