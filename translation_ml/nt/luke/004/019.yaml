  edition: SBLGNT
  text: κηρύξαι ἐνιαυτὸν κυρίου δεκτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/019.yaml
  text: to proclaim the favorable year of the Lord[a][b].
translation:
  language: ml
  text: കർത്താവിന്റെ അനുകൂല വർഷം പ്രഖ്യാപിക്കാൻ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കർത്താവിന്റെ പ്രീതിയുള്ള വർഷം പ്രഖ്യാപിക്കാൻ.”
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പരിഭാഷ: “കർത്താവിന്റെ സ്വീകാര്യവർഷം.” ഈ പ്രയോഗം യെശയ്യാവ് 61:2-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; യോബേൽവർഷവുമായി ബന്ധപ്പെട്ട ആശയങ്ങളെയും ഇത് ഉണർത്തിയേക്കാം.'
    reason: cross_reference
lexical_decisions:
- source_word: κηρύξαι
  choice: പ്രസിദ്ധപ്പെടുത്താൻ
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന അനന്തക്രിയാരൂപം നിലനിർത്തിക്കൊണ്ട്, κηρύσσω എന്നതിന്റെ പരസ്യമായ വിളംബരത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐνιαυτὸν
  choice: വർഷം
  rationale: പദത്തിന്റെ സാധാരണ അർഥമായ ‘വർഷം’ നിലനിർത്തുന്നു; യെശയ്യാവ് 61:2-ലെ സൂചനയുണ്ടെങ്കിലും അതിനെ ‘കാലം’ എന്നു പൊതുവാക്കുന്നില്ല.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്നതിന് പതിവായ ‘കർത്താവ്’ ഉപയോഗിക്കുകയും ഷഷ്ഠീവിഭക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: δεκτόν
  choice: പ്രസാദ
  rationale: ഇവിടെ പദം ദൈവിക സ്വീകാര്യതയും അനുകൂലതയും സൂചിപ്പിക്കുന്നു. ‘പ്രസാദ’ എന്നത് പരമ്പരാഗത ഗൗരവവും ‘കർത്താവിന്റെ അനുഗ്രഹപൂർണമായ അനുകൂലകാലം’ എന്ന ആശയവും ചുരുക്കത്തിൽ വഹിക്കുന്നു.
theological_decisions:
- issue: യെശയ്യാവ് 61:2-ലേക്കുള്ള സൂചനയും യോബേൽവർഷത്തിന്റെ പ്രതിധ്വനിയും
  choice: മുഖ്യവാചകത്തിൽ ‘വർഷം’ നിലനിർത്തി ‘യോബേൽ’ എന്നു ചേർക്കാതിരിക്കുന്നു.
  alternative: കർത്താവിന്റെ യോബേൽവർഷം പ്രസിദ്ധപ്പെടുത്താൻ
  rationale: ഗ്രീക്ക് വാചകം യെശയ്യാവ് 61:2-നെ പ്രതിധ്വനിപ്പിക്കുകയും യോബേൽ ആശയം ഉണർത്തുകയും ചെയ്യാം; എന്നാൽ ‘യോബേൽ’ എന്ന പദം നേരിട്ട് ഉപയോഗിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനവിപുലീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- issue: κύριος എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: ഗ്രീക്കിലുള്ള κύριος എന്ന രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും ഉദ്ധരണിയുടെ പശ്ചാത്തലത്തെ അതിരുകടന്ന് നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. വാക്യം മുൻവാക്യത്തിലെ ഉദ്ദേശ്യക്രമത്തിന്റെ തുടർച്ചയായതിനാൽ ‘പ്രസിദ്ധപ്പെടുത്താൻ’ എന്ന അനന്തക്രിയാരൂപം ഉപയോഗിച്ചു. ‘പ്രസാദവർഷം’ ചുരുക്കവും സ്വാഭാവികവുമായിരിക്കെ ദൈവിക അനുകൂലതയുടെ അർഥം നിലനിർത്തുന്നു.
