  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘സ്വന്തം നാട്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കെ മൂലപദത്തിലെ സ്ഥലപരമായ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
