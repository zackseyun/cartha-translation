  text: εἶπεν δέ· Ἀμὴν λέγω ὑμῖν ὅτι οὐδεὶς προφήτης δεκτός ἐστιν ἐν τῇ πατρίδι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഒരു പ്രവാചകനും സ്വന്തം നാട്ടിൽ[a] സ്വീകാര്യനല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്വന്തം ജന്മസ്ഥലത്ത്,” “സ്വദേശപ്രദേശത്ത്,” അല്ലെങ്കിൽ “മാതൃദേശത്ത്.” ഗ്രീക്കിലെ πατρίς എന്ന പദം ഒരാളുടെ സ്വന്തം പട്ടണത്തെയോ സ്വദേശപ്രദേശത്തെയോ മാതൃദേശത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ നസറത്തിലെ സന്ദർഭത്തിന് “സ്വന്തം നാട്” യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: അവൻ പറഞ്ഞു
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ അത് പ്രത്യേകം വിവർത്തനം ചെയ്യാതിരിക്കുന്നത് സ്വാഭാവികമായ ഒഴുക്ക് നിലനിർത്തുകയും അനാവശ്യമായ വൈരുധ്യം സൂചിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: Ἀμὴν
  choice: സത്യമായി
  rationale: യേശുവിന്റെ വചനത്തിന്റെ ഗൗരവവും ഉറപ്പും പരിചിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പ്രസ്താവനയുടെ ഔപചാരിക ഗൗരവവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: οὐδεὶς προφήτης
  choice: ഒരു പ്രവാചകനും
  rationale: ഗ്രീക്കിലെ സമ്പൂർണ നിഷേധം മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഒരു ... ഉം ... അല്ല’ ഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: δεκτός
  choice: സ്വീകാര്യനല്ല
  rationale: അനുകൂലമായി സ്വീകരിക്കപ്പെടുക, അംഗീകരിക്കപ്പെടുക എന്നീ സാമൂഹികവും വിലയിരുത്തൽപരവുമായ അർഥങ്ങൾ സംക്ഷിപ്തമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: സ്വന്തം നാട്ടിൽ
  rationale: πατρίς എന്ന പദത്തിന് ജന്മസ്ഥലം, സ്വദേശപ്രദേശം, മാതൃദേശം എന്നീ അർഥവ്യാപ്തികളുണ്ട്. നസറത്തിലെ സന്ദർഭത്തിന് ‘സ്വന്തം നാട്’ യോജിക്കുകയും മൂലപദത്തിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
