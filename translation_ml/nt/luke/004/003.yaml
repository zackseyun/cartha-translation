id: LUK.4.3
reference: Luke 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: ml
  text: 'അപ്പോൾ പിശാച് അവനോടു പറഞ്ഞു: “നീ ദൈവപുത്രനാണെങ്കിൽ[a], ഈ കല്ലിനോട് അപ്പമായിത്തീരാൻ പറയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ ദൈവപുത്രനായതിനാൽ.” വെല്ലുവിളിയുടെ ഭാഗമായി ആ വസ്തുത അംഗീകരിച്ചുകൊണ്ടുള്ള വ്യവസ്ഥയായി ഗ്രീക്ക് വാക്യം മനസ്സിലാക്കാം; എന്നാൽ പ്രധാനപാഠം വ്യവസ്ഥാരൂപം നിലനിർത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: മൃദുവായ ആഖ്യാനബന്ധകമായ δέ ഇവിടെ സംഭവക്രമം സ്വാഭാവികമായി മുന്നോട്ടുകൊണ്ടുപോകുന്നു.
- source_word: διάβολος
  choice: പിശാച്
  rationale: ഈ സന്ദർഭത്തിൽ സാത്താനെ സൂചിപ്പിക്കുന്ന വ്യക്തിനാമസദൃശമായ അംഗീകൃത പ്രയോഗമാണ്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവും.
- source_word: Εἰ
  choice: -ആണെങ്കിൽ
  rationale: ഗ്രീക്കിലെ വ്യവസ്ഥാരൂപം നിലനിർത്തുകയും വെല്ലുവിളിയുടെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം മുൻകൂട്ടി പരിഹരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: ഈ ക്രിസ്തുശാസ്ത്രപരമായ സന്ദർഭത്തിൽ അനിശ്ചിതമായ ‘ദൈവത്തിന്റെ ഒരു പുത്രൻ’ എന്നതല്ല, അംഗീകൃത സ്ഥാനനാമമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: εἰπὲ
  choice: പറയുക
  rationale: λέγω എന്ന ക്രിയയുടെ സംസാരപ്രവൃത്തിയെ നേരിട്ട് നിലനിർത്തുന്നു; ‘കല്പിക്കുക’ എന്നത് മൂലപദത്തേക്കാൾ ശക്തമായ വ്യാഖ്യാനമായേനേ.
- source_word: τῷ λίθῳ τούτῳ
  choice: ഈ കല്ല്
  rationale: λίθος എന്നതിന്റെ സാധാരണ അർഥമായ ‘കല്ല്’ എന്നും സൂചകപദമായ ‘ഈ’ എന്നും നിലനിർത്തുന്നു.
- source_word: ἵνα γένηται
  choice: അപ്പമായിത്തീരാൻ
  rationale: സംസാരക്രിയയ്ക്കു ശേഷമുള്ള ἵναയും ഉപവാക്യക്രിയയും മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യ/ഉള്ളടക്കഘടനയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἄρτος
  choice: അപ്പം
  rationale: ἄρτος എന്നതിന്റെ നേരിട്ടുള്ള മലയാളസമാനപദം; ‘ഒരു അപ്പം’ എന്ന അധിക നിർദ്ദിഷ്ടതയോ ‘ഭക്ഷണം’ എന്ന വിശാലതയോ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: εἰ υἱὸς εἶ τοῦ θεοῦ എന്ന വ്യവസ്ഥാവാക്യത്തിന്റെ ഭാവം
  choice: നീ ദൈവപുത്രനാണെങ്കിൽ
  alternative: നീ ദൈവപുത്രനായതിനാൽ / നീ ദൈവപുത്രനല്ലോ, അതുകൊണ്ട്
  rationale: പ്രധാനപാഠം ഗ്രീക്കിലെ വ്യവസ്ഥാരൂപം സംരക്ഷിക്കുന്നു. ഇതു യേശുവിന്റെ പുത്രത്വം നിഷേധിക്കാതെ പരീക്ഷണരംഗത്തിലെ വെല്ലുവിളിയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അവനോടു പറഞ്ഞു’, ‘അപ്പമായിത്തീരാൻ പറയുക’ എന്നീ രൂപങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലപാഠത്തിന്റെ ഘടനയും ഭാവവും സംരക്ഷിക്കുന്നു.
