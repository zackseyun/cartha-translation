  to: 'അപ്പോൾ പിശാച് അവനോടു പറഞ്ഞു: “നീ ദൈവപുത്രനാണെങ്കിൽ[a], ഈ കല്ലിനോട് അപ്പമായിത്തീരാൻ പറയുക.”'
  rationale: The revision supplies the Malayalam dative/postpositional form “കല്ലിനോട്” to reflect Greek τῷ λίθῳ, making clear that the command is directed to the stone. It makes no theological or interpretive alteration; the conditional form and its explanatory footnote are preserved.
