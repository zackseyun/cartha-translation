revisions:
- from: 'യേശു അതിനെ ശാസിച്ചുകൊണ്ട് പറഞ്ഞു: “മിണ്ടരുത്[a]; അവനെ വിട്ട് പുറത്തുവരിക.” ഭൂതം ആ മനുഷ്യനെ നടുവിലേക്ക് തള്ളിയിട്ടശേഷം, അവന് ഒരു ദോഷവും വരുത്താതെ അവനെ വിട്ട് പുറത്തുവന്നു.[b]'
