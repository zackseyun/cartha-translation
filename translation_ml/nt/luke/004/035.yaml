id: LUK.4.35
reference: Luke 4:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: ml
  text: 'യേശു അതിനെ ശാസിച്ചു പറഞ്ഞു: “മിണ്ടരുത്[a]; അവനെ വിട്ട് പുറത്തുവരിക.” ഭൂതം ആ മനുഷ്യനെ നടുവിലേക്ക് എറിഞ്ഞിട്ടശേഷം, അവന് ഒരു ദോഷവും വരുത്താതെ അവനെ വിട്ട് പുറത്തുവന്നു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “വായ്മൂടുക”; ഒരു മൃഗത്തിന് വായ്‌ക്കെട്ടിടുന്നതിന്റെ ചിത്രം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവന് ഒരു ദോഷവും വരുത്തിയില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: ശാസിച്ചു
  rationale: ἐπιτιμάω എന്ന പദത്തിന്റെ ശക്തവും അധികാരപൂർവവുമായ ശാസനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അതിനെ
  rationale: സന്ദർഭത്തിലെ ഭൂതത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; മനുഷ്യനിൽനിന്ന് അതിനെ വ്യക്തമായി വേർതിരിക്കാൻ നപുംസകരൂപം ഉപയോഗിച്ചു.
- source_word: Φιμώθητι
  choice: മിണ്ടരുത്
  rationale: സംസാരം നിർത്താനുള്ള കർശന കല്പന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘വായടയ്ക്കുക/കടിഞ്ഞാണിടപ്പെടുക’ എന്ന അക്ഷരാർഥചിത്രം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: അവനെ വിട്ട് പുറത്തുവരിക
  rationale: ἀπό സൂചിപ്പിക്കുന്ന വേർപാട് വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന നേരിട്ടുള്ള ഭൂതോച്ചാടനകല്പന.
- source_word: ῥίψαν αὐτὸν εἰς τὸ μέσον
  choice: ആ മനുഷ്യനെ നടുവിലേക്ക് തള്ളിയിട്ടശേഷം
  rationale: അയാളെ കൂട്ടത്തിന്റെ നടുവിലേക്കോ മധ്യത്തിലേക്കോ എറിഞ്ഞുവീഴ്ത്തിയ ശക്തമായ പ്രവൃത്തി അധിക വിശദീകരണം ചേർക്കാതെ വ്യക്തമാക്കുന്നു; aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸ δαιμόνιον
  choice: ഭൂതം
  rationale: δαιμόνιον എന്നതിന്റെ നേരിട്ടുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാള തത്തുല്യം.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: അവന് ഒരു ദോഷവും വരുത്താതെ
  rationale: μηδέν എന്ന സമ്പൂർണ നിഷേധവും βλάπτω എന്നതിന്റെ ഹാനി/പരിക്ക് വരുത്തുക എന്ന അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: δαιμόνιον എന്നതിന്റെ അവതരണവും യേശുവിന്റെ നേരിട്ടുള്ള അഭിസംബോധനയും
  choice: ‘ഭൂതം’ എന്നു പരിഭാഷപ്പെടുത്തി, യേശു നേരിട്ട് കല്പിക്കുകയും അത് മനുഷ്യനെ വിട്ടുപോകുകയും ചെയ്യുന്നതായി പാഠം അവതരിപ്പിക്കുന്ന വിധം നിലനിർത്തി.
  alternative: ‘ദുഷ്ടശക്തി’ അല്ലെങ്കിൽ മാനസിക അസ്വാസ്ഥ്യം എന്ന അമൂർത്ത വ്യാഖ്യാനം
  rationale: ഗ്രീക്ക് പാഠം നേരിട്ടുള്ള അഭിസംബോധനയും മനുഷ്യനിൽനിന്നുള്ള പുറപ്പെടലും വിവരിക്കുന്നു; പരിഭാഷ അതിനെ മുൻകൂട്ടി അമൂർത്തമാക്കുകയോ വ്യാഖ്യാനിച്ചു നീക്കുകയോ ചെയ്യരുത്.
- issue: ῥίψαν എന്ന participle-നും μηδὲν βλάψαν എന്ന അവസാന participle-നും ഇടയിലെ ആശയവൈരുധ്യം
  choice: ഭൂതം മനുഷ്യനെ ശക്തമായി തള്ളിയിട്ടെങ്കിലും അവന് ഒരു ദോഷവും വരുത്തിയില്ലെന്ന പാഠത്തിലെ സംഘർഷം നിലനിർത്തി.
  alternative: തള്ളിയിടലിനെ മൃദൂകരിക്കുകയോ ‘ദോഷം’ എന്നത് വെറും സ്ഥിരപരിക്കായി ചുരുക്കുകയോ ചെയ്യുക
  rationale: പാഠം ഹിംസാത്മകമായ പ്രകടനത്തോടൊപ്പം യഥാർഥ ഹാനിയില്ലായ്മയും ഉറപ്പിക്കുന്നു; ഈ രണ്ടും വിവർത്തനത്തിൽ ഒരുമിച്ച് കേൾക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മിണ്ടരുത്’ കല്പനയുടെ മൂർച്ച നിലനിർത്തുന്നു; ‘നടുവിലേക്ക്’ എന്നത് εἰς τὸ μέσον എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭപരമായി തുറന്ന സ്വഭാവം സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
