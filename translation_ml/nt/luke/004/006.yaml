id: LUK.4.6
reference: Luke 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: ml
  text: 'പിശാച് അവനോടു പറഞ്ഞു: “ഈ സകല അധികാരവും അവയുടെ മഹിമയും[a] ഞാൻ നിനക്കു തരും. കാരണം, അത് എനിക്ക് കൈമാറപ്പെട്ടിരിക്കുന്നു; ഞാൻ ആഗ്രഹിക്കുന്നവന് അത് കൊടുക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവയുടെ പ്രതാപം.” ഈ സന്ദർഭത്തിലെ ഗ്രീക്ക് പദത്തിന് മഹിമ, പ്രതാപം, തേജസ്സ് എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: പിശാച്
  rationale: പ്രലോഭനവിവരണത്തിൽ സാത്താനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ വ്യക്തിനാമപദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ, വ്യുത്പത്തിപരമായ ‘അപവാദി’ എന്നതിനെക്കാൾ മലയാളത്തിലെ സ്ഥാപിതമായ ‘പിശാച്’ യോജിക്കുന്നു.
- source_word: Σοὶ δώσω
  choice: ഞാൻ നിനക്കു തരും
  rationale: Σοί മുൻസ്ഥാനത്തുവന്ന് ഊന്നൽ നൽകുന്നുവെങ്കിലും, സ്വാഭാവിക മലയാള പദക്രമത്തിൽ ‘ഞാൻ നിനക്കു തരും’ അർഥവും ആവശ്യമായ ഊന്നലും മതിയായ രീതിയിൽ കൈമാറുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: ഭരിക്കാനുള്ള അവകാശമോ നിയന്ത്രണാധികാരമോ ആണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; അസംസ്കൃത ശക്തിയെ സൂചിപ്പിക്കാവുന്ന ‘ശക്തി’യെക്കാൾ ‘അധികാരം’ കൃത്യമാണ്.
- source_word: ταύτην ἅπασαν
  choice: ഈ അധികാരം മുഴുവനും
  rationale: പ്രദർശകസർവനാമവും ἅπασαν എന്ന സമഗ്രതാസൂചനയും ചേർന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ സമ്പൂർണമായി നിലനിർത്തുന്നു.
- source_word: δόξαν αὐτῶν
  choice: അവയുടെ മഹത്ത്വം
  rationale: αὐτῶν മുൻവാക്യത്തിലെ രാജ്യങ്ങളെ സൂചിപ്പിക്കുന്നു. δόξα ഇവിടെ അവയുടെ പ്രതാപം, തേജസ്സ്, മഹിമ എന്നിവ ഉൾക്കൊള്ളുന്നതിനാൽ ‘മഹത്ത്വം’ സ്വാഭാവികമായ മുഖ്യതിരഞ്ഞെടുപ്പാണ്; പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παραδέδοται
  choice: എനിക്ക് ഏല്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണ്ണകാല കർമണി രൂപം മുൻപ് നടന്ന കൈമാറ്റത്തിന്റെ ഇപ്പോഴും തുടരുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു. ‘ഏല്പിക്കപ്പെട്ടിരിക്കുന്നു’ കർമണി സ്വഭാവം കാത്തുസൂക്ഷിക്കുന്നു; അവകാശവാദത്തിന്റെ നിയമസാധുത വിവർത്തനം സ്വയം ഉറപ്പിക്കുന്നില്ല.
- source_word: ᾧ ἂν θέλω
  choice: ഞാൻ ആഗ്രഹിക്കുന്നവന്
  rationale: ἄν സഹിതമുള്ള ബന്ധസർവനാമവും θέλωയും അനിശ്ചിതമായ ഇച്ഛാവിഷയം പ്രകടിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം പിശാച് അവകാശപ്പെടുന്ന വിവേചനാധികാരം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δίδωμι αὐτήν
  choice: അത് കൊടുക്കുന്നു
  rationale: വർത്തമാനകാലം ഇവിടെ പതിവായോ പൊതുവായോ ഉള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സാധാരണ വർത്തമാനരൂപം അത് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: രാജ്യങ്ങളിന്മേലുള്ള അധികാരം തനിക്കുണ്ടെന്ന പിശാചിന്റെ പ്രസ്താവനയെ വിവർത്തനം അംഗീകരിക്കുന്നതായി തോന്നുമോ എന്ന ചോദ്യം
  choice: പിശാചിന്റെ നേരിട്ടുള്ള അവകാശവാദമായി യാതൊരു വിശദീകരണപദവും ചേർക്കാതെ അവതരിപ്പിക്കുക
  alternative: ‘അവന്റെ അവകാശവാദപ്രകാരം’ എന്നോ ‘തനിക്ക് ഏല്പിക്കപ്പെട്ടതായി അവൻ പറഞ്ഞു’ എന്നോ അകലം സൃഷ്ടിക്കുന്ന ഭാഷ ചേർക്കുക
  rationale: ഗ്രീക്ക് പാഠം ഇത് പിശാചിന്റെ നേരിട്ടുള്ള വാക്കുകളായി നൽകുന്നു. വിവർത്തനം അവകാശവാദത്തെ അംഗീകരിക്കുകയോ ദുർബലപ്പെടുത്തുകയോ ചെയ്യാതെ, പ്രസംഗകന്റെ തിരിച്ചറിയലിലൂടെ നിലനിൽക്കുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം അതേപടി സൂക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഏല്പിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന രൂപം മൂലത്തിലെ പൂർണ്ണകാല കർമണിയുടെ തുടർഫലം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
