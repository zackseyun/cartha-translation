  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: ml
  text: അവൻ ഗലീലയിലെ ഒരു പട്ടണമായ കഫർന്നഹൂമിലേക്കു ഇറങ്ങിച്ചെന്നു. ശബത്തുദിവസങ്ങളിൽ അവൻ അവരെ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατῆλθεν
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: κατέρχομαι എന്ന ക്രിയയിലെ താഴേക്കുള്ള ദിശാസൂചന നിലനിർത്തുന്നു; മലയാളത്തിൽ യാത്രയെ സ്വാഭാവികമായി വിവരിക്കുകയും ചെയ്യുന്നു.
- source_word: Καφαρναοὺμ
  choice: കഫർന്നഹൂം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം സ്വീകരിച്ചു.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: ഗലീലയിലെ ഒരു പട്ടണമായ
  rationale: അനാർത്രസ് πόλιν എന്നതിന്റെ അനിശ്ചിതത്വവും ജനിറ്റീവിന്റെ സ്ഥലസംബന്ധമായ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἦν διδάσκων
  choice: പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: περιφραστικό imperfect ഘടന സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: αὐτοὺς
  choice: അവരെ
  rationale: വാക്യത്തിൽ വ്യക്തമായ നാമപൂർവപദം ചേർക്കാതെ ഗ്രീക്കിലെ സർവനാമത്തെ അതേപടി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐν τοῖς σάββασιν
  choice: ശബത്തുദിവസങ്ങളിൽ
  rationale: σάββασιν എന്ന ബഹുവചനത്തിന്റെ ആവർത്തനസൂചന സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: σάββασιν എന്ന ബഹുവചനം ഏകവചനമായി സ്വാഭാവികവൽക്കരിക്കണമോ എന്നത്
  choice: ശബത്തുദിവസങ്ങളിൽ
  alternative: ശബത്തുദിവസത്തിൽ
  rationale: ബഹുവചനം യേശു ആവർത്തിച്ച് ശബത്തുകളിൽ പഠിപ്പിച്ചിരുന്നുവെന്ന സാധ്യത നിലനിർത്തുന്നു; അതിനെ ഒറ്റ സംഭവമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ദിശാസൂചനയും തുടരുന്ന/ആവർത്തിക്കുന്ന പ്രവർത്തനസ്വഭാവവും സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
