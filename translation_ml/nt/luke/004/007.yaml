source:
  edition: SBLGNT
  text: σὺ οὖν ἐὰν προσκυνήσῃς ἐνώπιον ἐμοῦ, ἔσται σοῦ πᾶσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/007.yaml
  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: ml
  text: അതുകൊണ്ട്, നീ എന്റെ മുമ്പിൽ ആരാധിച്ചാൽ[a], ഇതെല്ലാം നിനക്കുള്ളതാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ മുമ്പിൽ കുമ്പിട്ടാൽ” അല്ലെങ്കിൽ “വീണു നമസ്കരിച്ചാൽ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് കുമ്പിടുക, സാഷ്ടാംഗം വീഴുക, അല്ലെങ്കിൽ ആരാധിക്കുക എന്നിങ്ങനെ അർഥമാകാം. ഇവിടെ പിശാചിന് അർപ്പിക്കേണ്ടിവരുന്ന മതപരമായ ആദരവാണ് സന്ദർഭം.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: നീ
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം പ്രത്യേകം ചേർത്തതിനാൽ നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘നീ’ സ്വാഭാവികമായി ആവശ്യമായ ഊന്നൽ നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പുള്ള വാഗ്ദാനത്തിൽനിന്ന് വരുന്ന നിഗമനപരമായ ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐὰν
  choice: -ആൽ
  rationale: സാധ്യതാപരമായ നിബന്ധന മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധനാപ്രത്യയത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: προσκυνήσῃς
  choice: വീണു നമസ്കരിച്ചാൽ
  rationale: προσκυνέω ശരീരം കുനിച്ചോ വീണോ ആദരവ് അർപ്പിക്കുന്നതും ആരാധിക്കുന്നതും സൂചിപ്പിക്കാം. ഇവിടെ ശാരീരിക പ്രവൃത്തിയും മതപരമായ ആദരവും ഒരുമിച്ച് കേൾക്കാവുന്ന മലയാളപ്രയോഗം മൂലത്തിലെ അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: ἐνώπιον ἐμοῦ
  choice: എന്റെ മുമ്പിൽ
  rationale: സ്ഥലപരവും ബന്ധപരവുമായ ‘എന്റെ സന്നിധിയിൽ/മുമ്പിൽ’ എന്ന ആശയം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἔσται σοῦ
  choice: നിനക്കുള്ളതാകും
  rationale: ഭാവികാലത്തിലുള്ള ഉടമസ്ഥത മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: πᾶσα
  choice: ഇതെല്ലാം
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ πᾶσα മുൻവാക്യത്തിൽ പറഞ്ഞ അധികാരത്തെയും മഹത്വത്തെയും, വിശാലമായി രാജ്യങ്ങളെയാകെയും, സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആവശ്യമായ സൂചകപദം ചേർത്ത് സമഗ്രത നിലനിർത്തുന്നു.
theological_decisions:
- issue: προσκυνέω എന്നത് നിഷ്പക്ഷമായ വണക്കം എന്നോ മതപരമായ ആരാധന എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: വീണു നമസ്കരിച്ചാൽ
  alternative: ആരാധിച്ചാൽ; കുമ്പിട്ടാൽ
  rationale: തുടർന്നുള്ള യേശുവിന്റെ മറുപടി ഇത് ദൈവത്തിനു മാത്രം അർഹമായ മതപരമായ ആദരവുമായി ബന്ധിപ്പിക്കുന്നു. എന്നാൽ ക്രിയയ്ക്ക് ശരീരം കുനിഞ്ഞുള്ള വണക്കത്തിന്റെ ദൃശ്യാർഥവും ഉള്ളതിനാൽ, ‘വീണു നമസ്കരിക്കുക’ എന്നത് ആ ദൃശ്യാർഥവും ആരാധനാപരമായ ഗൗരവവും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് മറ്റൊരു വ്യക്തമായ വായന നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘വീണു നമസ്കരിക്കുക’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ ശാരീരിക-ആരാധനാപരമായ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
