  yaml_path: translation/nt/luke/004/028.yaml
  text: And all in the synagogue were filled with anger when they heard these things,[a]
translation:
  language: ml
  text: ഈ കാര്യങ്ങൾ കേട്ടപ്പോൾ, സിനഗോഗിലുണ്ടായിരുന്ന എല്ലാവരും കോപംകൊണ്ടു നിറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രോധംകൊണ്ടു നിറഞ്ഞു.’ ഗ്രീക്കിലെ θυμός എന്ന പദം തീവ്രമായ കോപത്തെയോ ക്രോധത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: നിറഞ്ഞു
  rationale: πίμπλημι എന്ന ക്രിയയുടെ ഔറിസ്റ്റ് കർമണി രൂപം സൂചിപ്പിക്കുന്ന ‘നിറയുക’ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: സിനഗോഗിൽ സന്നിഹിതരായിരുന്ന മുഴുവൻ ആളുകളെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: θυμοῦ
  choice: കോപംകൊണ്ടു
  rationale: θυμός ഇവിടെ തീവ്രമായ കോപത്തെ സൂചിപ്പിക്കുന്നു. ‘കോപം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; കൂടുതൽ തീവ്രമായ ‘ക്രോധം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐν τῇ συναγωγῇ
  choice: സിനഗോഗിലുണ്ടായിരുന്ന
  rationale: ആ കൂട്ടത്തെ സിനഗോഗിനുള്ളിലുള്ളവരായി തിരിച്ചറിയുന്ന ഗ്രീക്ക് സ്ഥാനപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀκούοντες
  choice: കേട്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയോടു സമകാലികമായ പങ്കാളിക്രിയയെ അതിന്റെ സന്ദർഭപരമായ കാലബന്ധം നിലനിർത്തി സ്വാഭാവിക മലയാള ഉപവാക്യമായി നൽകുന്നു.
- source_word: ταῦτα
  choice: ഇതു
  rationale: മുമ്പ് യേശു പറഞ്ഞ കാര്യങ്ങളിലേക്കാണ് ബഹുവചന സർവനാമം വിരൽചൂണ്ടുന്നത്; മലയാളത്തിൽ ആ മുഴുവൻ പ്രസ്താവനയെ കൂട്ടമായി സൂചിപ്പിക്കാൻ ‘ഇതു’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘സിനഗോഗ്’ എന്ന ചരിത്രപരമായ സ്ഥാപനനാമം നിലനിർത്തി; വാക്യത്തിന്റെ സംക്ഷിപ്തതയും ഗ്രീക്കിലെ ‘നിറഞ്ഞു’ എന്ന രൂപകവും സംരക്ഷിച്ചു.
