id: LUK.4.11
reference: Luke 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ὅτι Ἐπὶ χειρῶν ἀροῦσίν σε μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/011.yaml
  text: and[a], ‘On their hands they will carry you[b], lest you strike your foot against a stone.’
translation:
  language: ml
  text: “അവർ നിന്നെ കൈകളിൽ താങ്ങും; നിന്റെ കാൽ ഒരു കല്ലിൽ തട്ടാതിരിക്കാൻ” എന്നും എഴുതിയിരിക്കുന്നുവല്ലോ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅτι
  choice: എന്നും
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച തിരുവെഴുത്ത് ഉദ്ധരണി തുടരുന്ന ഘടനയാണ്. καὶ-യുടെ ഏകോപനവും ὅτι-യുടെ ഉദ്ധരണി-ആമുഖബലവും സ്വാഭാവിക മലയാളത്തിൽ ‘എന്നും’ എന്ന സമാപനരൂപത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: Ἐπὶ χειρῶν
  choice: കൈകളിൽ
  rationale: ദൂതന്മാരുടെ കൈകളാൽ സംരക്ഷണത്തോടെ വഹിക്കപ്പെടുന്ന ദൃശ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀροῦσίν σε
  choice: അവർ നിന്നെ ... താങ്ങിക്കൊള്ളും
  rationale: αἴρω എന്ന ക്രിയയുടെ ഉയർത്തി വഹിക്കുക/താങ്ങുക എന്ന അർഥം ഇവിടെ സംരക്ഷണത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘താങ്ങിക്കൊള്ളും’ എന്നു വ്യക്തമായി നൽകുന്നു.
- source_word: μήποτε
  choice: ഇടിക്കാതിരിക്കേണ്ടതിന്
  rationale: നിഷേധാത്മക ഉദ്ദേശ്യത്തിന്റെയോ പ്രതിരോധഫലത്തിന്റെയോ ബലം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: προσκόψῃς πρὸς λίθον
  choice: കല്ലിൽ ഇടിക്കുക
  rationale: προσκόπτω + πρός സൂചിപ്പിക്കുന്ന കല്ലുമായുള്ള ആഘാതം ലളിതവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸν πόδα σου
  choice: നിന്റെ കാൽ
  rationale: ഗ്രീക്കിലെ ഏകവചനം അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: സങ്കീർത്തന ഉദ്ധരണിയിലെ ദൈവിക സംരക്ഷണദൃശ്യത്തിന്റെ അവതരണം
  choice: ‘അവർ നിന്നെ കൈകളിൽ താങ്ങിക്കൊള്ളും’
  alternative: ‘അവർ നിന്നെ കൈകളിൽ എടുത്തുകൊണ്ടുപോകും’
  rationale: ‘താങ്ങിക്കൊള്ളും’ എന്നത് ദൂതന്മാർ സംരക്ഷണത്തോടെ ഉയർത്തിവഹിക്കുന്ന ദൃശ്യത്തെ നിലനിർത്തുന്നു; പ്രത്യേകമായ ഒരു വ്യാഖ്യാനപാരമ്പര്യവും ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച ഉദ്ധരണിയുടെ തുടർച്ചയായതിനാൽ, മലയാളത്തിൽ ഉദ്ധരണിയുടെ സമാപനത്തെ വ്യക്തമാക്കുന്ന ‘എന്നും എഴുതിയിരിക്കുന്നുവല്ലോ’ എന്ന ഘടന ഉപയോഗിച്ചു.
