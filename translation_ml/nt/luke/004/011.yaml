- from: ‘അവർ നിന്നെ കൈകളിൽ താങ്ങിക്കൊള്ളും; നിന്റെ കാൽ കല്ലിൽ ഇടിക്കാതിരിക്കേണ്ടതിന്’ എന്നും എഴുതിയിരിക്കുന്നുവല്ലോ.”
  to: “അവർ നിന്നെ കൈകളിൽ താങ്ങും; നിന്റെ കാൽ ഒരു കല്ലിൽ തട്ടാതിരിക്കാൻ” എന്നും എഴുതിയിരിക്കുന്നുവല്ലോ.
