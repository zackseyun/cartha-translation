source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: ml
  text: നേരം പുലർന്നപ്പോൾ, അവൻ പുറപ്പെട്ട് ഒരു വിജനസ്ഥലത്തേക്കു പോയി.[a] ജനക്കൂട്ടങ്ങൾ അവനെ അന്വേഷിച്ചുകൊണ്ടിരുന്നു; അവർ അവന്റെ അടുത്തെത്തി, അവൻ തങ്ങളെ വിട്ടുപോകാതിരിക്കാൻ അവനെ തടഞ്ഞുനിർത്താൻ ശ്രമിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ഒറ്റപ്പെട്ട സ്ഥലത്തേക്ക്’ അല്ലെങ്കിൽ ‘ആൾപ്പാർപ്പില്ലാത്ത സ്ഥലത്തേക്ക്.’ ഗ്രീക്കുപദം വിജനമോ ഒറ്റപ്പെട്ടതോ ആയ സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവനെ പിടിച്ചുനിർത്തിക്കൊണ്ടിരുന്നു.’ ജനക്കൂട്ടങ്ങൾ അവൻ പോകുന്നത് തടയാൻ ശ്രമിച്ചുവെന്നാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: നേരം പുലർന്നപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സൂചിപ്പിക്കുന്ന കാലപരിവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: അവിടെനിന്ന് പുറപ്പെട്ട് ... പോയി
  rationale: മുൻകൃത്യവും പ്രധാനകൃത്യവും വ്യക്തമായി നിലനിർത്തുന്നു; മലയാളത്തിലെ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കാൻ ‘പുറപ്പെട്ട് ... പോയി’ എന്നു നൽകി.
- source_word: εἰς ἔρημον τόπον
  choice: ഒരു വിജനസ്ഥലത്തേക്ക്
  rationale: ἔρημος എന്നത് ഇവിടെ നിർബന്ധമായും മരുഭൂമിയല്ല, ആൾപ്പാർപ്പില്ലാത്തതോ ഒറ്റപ്പെട്ടതോ ആയ സ്ഥലമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: οἱ ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപവും കൂട്ടമായി വന്ന ജനങ്ങളുടെ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ἐπεζήτουν
  choice: അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ തുടരുന്ന പ്രവർത്തനം മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: അവർ അവന്റെ അടുത്തെത്തി
  rationale: അവൻ ഉണ്ടായിരുന്ന സ്ഥലത്തേക്ക് അവർ എത്തിച്ചേർന്നുവെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατεῖχον αὐτὸν
  choice: അവനെ തടഞ്ഞുനിർത്താൻ ശ്രമിച്ചു
  rationale: κατέχω ഇവിടെ അവന്റെ പുറപ്പെടൽ തടയുക എന്ന സാഹചര്യാർഥത്തിലാണ്; ശാരീരികമായി പിടിച്ചുവെന്നത് അനാവശ്യമായി ഉറപ്പിക്കാതെ ഇംപെർഫെക്റ്റിന്റെ ശ്രമഭാവം നൽകുന്നു.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: അവൻ തങ്ങളെ വിട്ടുപോകാതിരിക്കാൻ
  rationale: μή ചേർന്ന ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് സൂചിപ്പിക്കുന്ന തടയലിന്റെ ലക്ഷ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
