id: LUK.4.23
reference: Luke 4:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ തീർച്ചയായും എന്നോട് ഈ പഴഞ്ചൊല്ല് പറയും: ‘വൈദ്യാ, നിന്നെത്തന്നെ സുഖപ്പെടുത്തുക.’ കഫർന്നഹൂമിൽ സംഭവിച്ചതായി ഞങ്ങൾ കേട്ടതെല്ലാം ഇവിടെ നിന്റെ സ്വന്തം നാട്ടിലും ചെയ്യുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ലേക്ക്/ഉള്ളിലേക്ക്’ എന്നർഥമുള്ള εἰς ആണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എന്നാൽ ഇവിടെ സന്ദർഭത്തിൽ അത് സ്ഥലസൂചകമായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: തീർച്ചയായും
  rationale: യേശു അവർ പറയാൻ പോകുന്നതിനെ ഉറപ്പോടെ മുൻകൂട്ടി പ്രസ്താവിക്കുന്നതിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐρεῖτέ μοι
  choice: എന്നോട് ... പറയും
  rationale: ഭാവികാല നിർദ്ദേശകത്തിന്റെ പ്രവചനസ്വഭാവം നിലനിർത്തുന്നു; λέγωയും ദത്തിവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: παραβολὴν
  choice: പഴഞ്ചൊല്ല്
  rationale: ഇവിടെ ഇത് ദീർഘമായ ഉപമകഥയല്ല, ‘വൈദ്യാ, നിന്നെത്തന്നെ സുഖപ്പെടുത്തുക’ എന്ന ഹ്രസ്വമായ പ്രചാരവാക്യമാണ്.
- source_word: Ἰατρέ
  choice: വൈദ്യാ
  rationale: വൈദ്യനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന സംബോധനരൂപവും പഴഞ്ചൊല്ലിന്റെ ഗൗരവമുള്ള ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: θεράπευσον σεαυτόν
  choice: നിന്നെത്തന്നെ സുഖപ്പെടുത്തുക
  rationale: പ്രത്യക്ഷമായ ആജ്ഞയുടെ ശക്തിയും സ്വയം ചികിത്സിക്കണമെന്ന പഴഞ്ചൊല്ലിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: സംഭവിച്ചതായി ഞങ്ങൾ കേട്ടതെല്ലാം
  rationale: γενόμενα എന്നതിന്റെ ‘സംഭവിച്ചത്/നടന്നത്’ എന്ന വിശാലതയും വിവരം കേട്ടറിഞ്ഞതാണ് എന്ന ഭാവവും സംരക്ഷിക്കുന്നു; പ്രവൃത്തികൾ എന്നു അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: കഫർന്നഹൂമിൽ
  rationale: സംഭവിക്കുക എന്ന ക്രിയയോടൊപ്പം εἰς ഇവിടെ സ്ഥലസൂചകമായി ഗ്രഹിക്കുന്നത് സന്ദർഭോചിതവും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്; അസാധാരണമായ മൂലപദപ്രയോഗം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ποίησον καὶ ὧδε
  choice: ഇവിടെ ... ചെയ്യുക
  rationale: ποίησον എന്ന വിശാലമായ ‘ചെയ്യുക’ എന്ന അർഥം നിലനിർത്തുകയും καί-യുടെ ‘കൂടിയും’ എന്ന ആശയം സ്വദേശത്തും എന്ന രൂപത്തിൽ സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ πατρίδι σου
  choice: നിന്റെ സ്വദേശത്തും
  rationale: നസറത്ത് സന്ദർഭത്തിൽ πατρίς ജന്മദേശം/സ്വദേശം എന്ന അർഥത്തിലാണ്; ആധുനിക രാഷ്ട്രം എന്ന ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ παραβολήയുടെ സ്വഭാവം
  choice: ‘പഴഞ്ചൊല്ല്’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ഉപമ’ അല്ലെങ്കിൽ ‘ചൊല്ല്’
  rationale: ‘വൈദ്യാ, നിന്നെത്തന്നെ സുഖപ്പെടുത്തുക’ എന്നത് കഥാരൂപത്തിലുള്ള ഉപമയല്ല, ഹ്രസ്വമായ പഴഞ്ചൊല്ലാണ്; അതിനാൽ സന്ദർഭാർഥം മുൻനിർത്തി.
- issue: γενόμενα സൂചിപ്പിക്കുന്നത് സംഭവങ്ങളോ ചെയ്ത പ്രവൃത്തികളോ
  choice: ‘സംഭവിച്ചതായി’ എന്ന വിശാല രൂപം നിലനിർത്തി
  alternative: ‘ചെയ്യപ്പെട്ടതായി’ അല്ലെങ്കിൽ ‘നടത്തിയതായി’
  rationale: മൂലത്തിലെ γενόμενα സംഭവിച്ചതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭം യേശുവിന്റെ പ്രവൃത്തികളെ ഉദ്ദേശിച്ചേക്കാമെങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത കർത്തൃപ്രവർത്തനത്തെ പരിഭാഷയിൽ നിർബന്ധമായി ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പഴഞ്ചൊല്ലിന്റെ സംക്ഷിപ്തതയും നേരിട്ടുള്ള ആജ്ഞാഭാവവും ഭാവികാല പ്രവചനവും നിലനിർത്തി. ‘കഫർന്നഹൂം’ എന്ന സാധാരണ മലയാള ബൈബിൾ സ്ഥലനാമരൂപം ഉപയോഗിച്ചു; മൂലത്തിലെ അസാധാരണമായ εἰς പ്രയോഗം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
