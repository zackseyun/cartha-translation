  text: ἡμέρας τεσσεράκοντα πειραζόμενος ὑπὸ τοῦ διαβόλου. καὶ οὐκ ἔφαγεν οὐδὲν ἐν ταῖς ἡμέραις ἐκείναις, καὶ συντελεσθεισῶν ⸀αὐτῶν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/002.yaml
  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: ml
  text: നാല്പത് ദിവസത്തേക്ക് പിശാചിനാൽ പ്രലോഭിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നു.[a] ആ ദിവസങ്ങളിൽ അവൻ ഒന്നും ഭക്ഷിച്ചില്ല; അവ അവസാനിച്ചപ്പോൾ അവന് വിശന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരീക്ഷിക്കപ്പെട്ടുകൊണ്ടിരുന്നു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘പ്രലോഭിപ്പിക്കുക’ എന്നും ‘പരീക്ഷിക്കുക’ എന്നും അർഥമാകാം; ഇവിടെ പ്രവർത്തകൻ പിശാചായതിനാൽ ‘പ്രലോഭിപ്പിക്കുക’ എന്ന അർഥമാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: നാല്പതു ദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ദ്വിതീയാവിഭക്തി മലയാളത്തിൽ സ്വാഭാവികമായി ‘നാല്പതു ദിവസം’ എന്നു നൽകുന്നു.
- source_word: πειραζόμενος
  choice: പരീക്ഷിക്കപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: വർത്തമാന കർമണി കൃദന്തം നാല്പതു ദിവസങ്ങളിലുടനീളം നടന്ന അനുഭവത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ പിശാചാണ് കർത്താവ് എന്നതിനാൽ പ്രലോഭനത്തിന്റെ ഭാവം ശക്തമാണെങ്കിലും, ‘പരീക്ഷിക്കുക’ എന്നത് ഗ്രീക്ക് പദത്തിന്റെ പരീക്ഷണം/പ്രലോഭനം എന്നീ അർഥസാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: പിശാചിനാൽ
  rationale: διάβολος ഇവിടെ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്ന അംഗീകൃത സ്ഥാനനാമമാണ്; ‘പിശാച്’ എന്നത് സാധാരണവും വ്യക്തവുമായ മലയാള പ്രയോഗമാണ്.
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: അവൻ ഒന്നും ഭക്ഷിച്ചില്ല
  rationale: ഗ്രീക്കിലെ ശക്തമായ നിഷേധം അർഥനഷ്ടമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: പ്രസ്തുത നാല്പതു ദിവസങ്ങളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഇതാണ് ലളിതവും സ്വാഭാവികവും.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: അവ അവസാനിച്ചപ്പോൾ
  rationale: ഗ്രീക്ക് genitive absolute-നെ സ്വാഭാവികമായ കാലവാക്യമായി മാറ്റുന്നു; ‘അവ’ എന്നത് ദിവസങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπείνασεν
  choice: അവന്നു വിശന്നു
  rationale: കാലയളവ് അവസാനിച്ചപ്പോൾ വിശപ്പ് അനുഭവപ്പെട്ടതിനെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: πειραζόμενος എന്ന പദം യേശുവിന്റെ മരുഭൂമിയിലെ അനുഭവവുമായി ബന്ധപ്പെടുത്തി വിവർത്തനം ചെയ്യുന്നത്
  choice: പരീക്ഷിക്കപ്പെട്ടുകൊണ്ടിരുന്നു
  alternative: പ്രലോഭിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘പരീക്ഷിക്കുക’, ‘പ്രലോഭിപ്പിക്കുക’ എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. പിശാചാണ് പ്രവർത്തകൻ എന്നതിനാൽ പ്രലോഭനഭാവം സന്ദർഭത്തിൽ ശക്തമാണ്; എങ്കിലും മുഖ്യപാഠത്തിലെ ‘പരീക്ഷിക്കുക’ യഥാർഥ പദാർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു, മറ്റർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യാരംഭം മുൻവാക്യവുമായി വ്യാകരണപരമായി ബന്ധപ്പെടുന്ന മൂലപാഠത്തിന്റെ ഘടന നിലനിർത്തുന്നു; തുടർച്ചയായ പ്രവർത്തി ‘-പ്പെട്ടുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കുന്നു.
