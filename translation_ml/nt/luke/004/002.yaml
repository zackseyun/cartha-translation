- from: നാല്പതു ദിവസം പിശാചിനാൽ പരീക്ഷിക്കപ്പെട്ടുകൊണ്ടിരുന്നു.[a] ആ ദിവസങ്ങളിൽ അവൻ ഒന്നും ഭക്ഷിച്ചില്ല; അവ അവസാനിച്ചപ്പോൾ അവന്നു വിശന്നു.
