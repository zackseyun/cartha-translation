id: LUK.4.37
reference: Luke 4:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο ἦχος περὶ αὐτοῦ εἰς πάντα τόπον τῆς περιχώρου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/037.yaml
  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: ml
  text: അവനെക്കുറിച്ചുള്ള വാർത്ത ചുറ്റുമുള്ള പ്രദേശത്തെ എല്ലാ സ്ഥലങ്ങളിലേക്കും പരന്നുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെക്കുറിച്ചുള്ള ഒരു റിപ്പോർട്ട് ചുറ്റുമുള്ള പ്രദേശത്തെ എല്ലാ സ്ഥലങ്ങളിലേക്കും പുറപ്പെട്ടുകൊണ്ടിരുന്നു.’
    reason: ἦχος എന്നതിന് ‘വാർത്ത/റിപ്പോർട്ട്’ എന്നും ἐξεπορεύετο എന്നതിന് പദാനുപദമായി ‘പുറപ്പെട്ടുകൊണ്ടിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താവുന്ന പദപരമായ മറ്റൊരു സാധ്യത രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: ഗ്രീക്കിലെ καί മുൻവിവരണത്തോടുള്ള ലളിതമായ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ നിർബന്ധിതമായ ‘അങ്ങനെ’യോ ‘പിന്നെ’യോ ചേർക്കുന്നത് ഇല്ലാത്ത അർത്ഥനിറം നൽകുന്നതിനാൽ ബന്ധം സ്വാഭാവിക വാക്യക്രമത്തിലൂടെ അറിയിച്ചു.
- source_word: ἐξεπορεύετο
  choice: പരന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം കഴിഞ്ഞകാലത്ത് തുടർന്നുകൊണ്ടിരുന്ന വ്യാപനത്തെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടുകൊണ്ടിരുന്നു’ എന്നത് കൂടുതൽ പദാനുപദമാണെങ്കിലും വാർത്തയെ കർത്താവാക്കി മലയാളത്തിൽ ‘പരന്നുകൊണ്ടിരുന്നു’ എന്നു പറയുന്നത് സന്ദർഭാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἦχος
  choice: വാർത്ത
  rationale: ഈ പദത്തിന്റെ അടിസ്ഥാനാർത്ഥം ‘ശബ്ദം’ ആണെങ്കിലും, περὶ αὐτοῦ എന്ന ഘടനയിലും ഈ സന്ദർഭത്തിലും യേശുവിനെക്കുറിച്ചുള്ള റിപ്പോർട്ട് അഥവാ വാർത്തയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ചുള്ള
  rationale: റിപ്പോർട്ടിന്റെ ഉള്ളടക്കം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: εἰς πάντα τόπον
  choice: എല്ലാ സ്ഥലങ്ങളിലേക്കും
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചനയും πάντα τόπον എന്നതിന്റെ വിതരണബലവും നിലനിർത്തുന്നു.
- source_word: τῆς περιχώρου
  choice: ചുറ്റുമുള്ള പ്രദേശത്തെ
  rationale: περίχωρος എന്നത് സമീപത്തുള്ള അഥവാ ചുറ്റുമുള്ള ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘പ്രദേശത്തെ എല്ലാ സ്ഥലങ്ങളിലേക്കും’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികവും ഗ്രീക്കിലെ ബന്ധം വ്യക്തവുമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പരന്നുകൊണ്ടിരുന്നു’ എന്ന പ്രയോഗം തുടരുന്ന ഭൂതകാലപ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു; അടിക്കുറിപ്പിൽ കൂടുതൽ പദാനുപദമായ സാധ്യത സംരക്ഷിച്ചിട്ടുണ്ട്.
