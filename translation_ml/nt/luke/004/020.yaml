  terminology: “ചുരുൾ” appropriately reflects βιβλίον in this setting. “സിനഗോഗ്” is preferable to “പള്ളി” for the precise Jewish institution intended by συναγωγή. “പരിചാരകന്” is an acceptable contextual rendering of ὑπηρέτῃ.
