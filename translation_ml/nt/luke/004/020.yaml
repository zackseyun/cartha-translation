id: LUK.4.20
reference: Luke 4:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: ml
  text: അവൻ ചുരുൾ ചുരുട്ടി പരിചാരകന് തിരികെ കൊടുത്ത് ഇരുന്നു. സിനഗോഗിലുള്ള എല്ലാവരുടെയും കണ്ണുകൾ അവനിൽ പതിഞ്ഞിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πτύξας
  choice: ചുരുൾ ചുരുട്ടി
  rationale: ഒന്നാം നൂറ്റാണ്ടിലെ വായനാസാമഗ്രി ചുരുളായിരുന്നതിനാൽ, കോഡെക്സ് അടയ്ക്കുന്നതെന്ന ധാരണ ഒഴിവാക്കി അതിന്റെ യഥാർഥ ശാരീരിക പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: βιβλίον
  choice: ചുരുൾ
  rationale: ഈ പള്ളിവായനയുടെ ചരിത്രസന്ദർഭത്തിൽ യെശയ്യാവിന്റെ എഴുത്ത് ചുരുൾരൂപത്തിലായിരുന്നു; പൊതുവായ ‘പുസ്തകം’ എന്നതിനെക്കാൾ സന്ദർഭോചിതമാണ്.
- source_word: ἀποδοὺς
  choice: തിരികെ കൊടുത്തശേഷം
  rationale: ഉപയോഗിച്ച വസ്തു അതിന്റെ ചുമതലക്കാരന് മടക്കിനൽകുന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑπηρέτῃ
  choice: പരിചാരകനു
  rationale: പള്ളിയിലെ ചുരുളുകൾ കൈകാര്യം ചെയ്യുകയും ശുശ്രൂഷയിൽ സഹായിക്കുകയും ചെയ്ത ചുമതലക്കാരനെ സൂചിപ്പിക്കുന്നു; ‘ദാസൻ’ എന്നത് ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കാം.
- source_word: ἐκάθισεν
  choice: ഇരുന്നു
  rationale: കഥനത്തിലെ നേരിട്ടുള്ള പ്രവൃത്തി ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു; പഠിപ്പിക്കാനുള്ള ഇരിപ്പാണെന്ന് മുഖ്യവാചകത്തിൽ അധികമായി വിശദീകരിക്കുന്നില്ല.
- source_word: συναγωγῇ
  choice: പള്ളിയിൽ
  rationale: മലയാള ബൈബിൾ ഭാഷയിലും യഹൂദ ആരാധനാലയത്തെ സൂചിപ്പിക്കുന്ന പ്രചാരത്തിലുള്ള സന്ദർഭോചിത പദമാണ്; സഭാസമൂഹത്തെ മാത്രമല്ല, ഇവിടെ സ്ഥലത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: οἱ ὀφθαλμοὶ ... ἀτενίζοντες αὐτῷ
  choice: കണ്ണുകൾ അവനിൽ പതിഞ്ഞിരുന്നു
  rationale: എല്ലാവരും തുടർച്ചയായി ഉറ്റുനോക്കിയതിന്റെ തീവ്രത, ശത്രുതയോ അപമര്യാദയോ അനാവശ്യമായി സൂചിപ്പിക്കാതെ, സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പള്ളിവായനയിലെ βιβλίον എന്ന വസ്തുവിന്റെ ചരിത്രരൂപം
  choice: ‘പുസ്തകം’ എന്ന പൊതുപദത്തിനു പകരം ‘ചുരുൾ’
  alternative: പുസ്തകം
  rationale: ഇത് ഉപദേശപരമായ തീർപ്പല്ല; മൂലസന്ദർഭത്തിന്റെ ചരിത്രകൃത്യത മുൻനിർത്തുന്ന പരിഭാഷാതീരുമാനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ചുരുൾ ചുരുട്ടി’ എന്ന ആവർത്തനം മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി സ്വാഭാവികമായി സ്വീകരിച്ചു. ഗ്രീക്കിലെ തുടർച്ചയായ പ്രവൃത്തിക്രമം ‘തിരികെ കൊടുത്തശേഷം’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കി. യാതൊരു അടിക്കുറിപ്പും ആവശ്യമായതായി കണ്ടില്ല.
