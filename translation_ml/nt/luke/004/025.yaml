id: LUK.4.25
reference: Luke 4:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: ml
  text: 'എന്നാൽ, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഏലിയാവിന്റെ കാലത്ത് ഇസ്രായേലിൽ അനേകം വിധവകൾ ഉണ്ടായിരുന്നു. അന്ന് ആകാശം മൂന്നു വർഷവും ആറു മാസവും അടഞ്ഞുകിടന്നു; ദേശത്തെങ്ങും വലിയ ക്ഷാമം ഉണ്ടായി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: സത്യമായി
  rationale: ‘in truth/truly’ എന്ന ഊന്നൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκλείσθη ὁ οὐρανός
  choice: ആകാശം ... അടഞ്ഞുകിടന്നു
  rationale: ദൈവിക കർത്താവിനെ പാഠം നേരിട്ട് പറയാത്തതിനാൽ ചേർക്കാതെ, ഗ്രീക്കിലെ കർമ്മണിപ്രയോഗവും മഴ നിലച്ചതിന്റെ ദൃശ്യരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: ദേശത്തെങ്ങും
  rationale: സന്ദർഭത്തിലെ ക്ഷാമബാധിത പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന γῆ എന്ന പദത്തിന്റെ സ്വാഭാവിക അർത്ഥം നൽകുന്നു; അനാവശ്യമായി ലോകമെങ്ങും എന്നു വിപുലീകരിക്കുന്നില്ല.
theological_decisions:
- issue: ആകാശം അടച്ചത് ആരെന്ന പരോക്ഷസൂചന
  choice: കർത്താവിനെ വ്യക്തമാക്കാതെ കർമ്മണിരൂപം നിലനിർത്തി
  alternative: ദൈവം ആകാശം അടച്ചു
  rationale: മൂലപാഠം പ്രവർത്തകനെ പേരെടുത്തു പറയുന്നില്ല; അതിനാൽ അതിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: πᾶσαν τὴν γῆν എന്നതിന്റെ വ്യാപ്തി
  choice: ദേശത്തെങ്ങും
  alternative: ഭൂമിയിലെങ്ങും
  rationale: ഏലിയാവിന്റെ ക്ഷാമസന്ദർഭവുമായി യോജിച്ച പ്രാദേശിക അർത്ഥം സ്വീകരിക്കുമ്പോഴും ബാധയുടെ വ്യാപകത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും പൊതുവായ വായനയ്ക്കു ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്കിനായി രണ്ടു വാക്യങ്ങളാക്കി; ആശയബന്ധം നിലനിർത്തി.
