source:
  edition: SBLGNT
  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: ml
  text: എലീശാ പ്രവാചകന്റെ കാലത്ത് ഇസ്രായേലിൽ കുഷ്ഠരോഗമുള്ള[a] പലരും ഉണ്ടായിരുന്നു. എന്നാൽ സുറിയക്കാരനായ നയമാൻ ഒഴികെ അവരിൽ ആരും ശുദ്ധീകരിക്കപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം ആധുനിക വൈദ്യശാസ്ത്രം ‘ഹാൻസൻസ് രോഗം’ എന്നു വിളിക്കുന്ന കുഷ്ഠം മാത്രമല്ല, ഗുരുതരമായ മറ്റു ചില ചർമരോഗങ്ങളെയും ഉൾക്കൊള്ളാം.
    reason: λεπρός എന്ന ബൈബിൾകാല പദത്തെ ആധുനിക ഹാൻസൻസ് രോഗവുമായി മാത്രം തെറ്റായി സമീകരിക്കാതിരിക്കാനായി.
lexical_decisions:
- source_word: λεπροὶ
  choice: കുഷ്ഠരോഗമുള്ളവർ
  rationale: വ്യക്തിയെ രോഗനാമംകൊണ്ട് മാത്രം വിളിക്കാതെ, ഗ്രീക്കിലെ രോഗബാധിതരായ ആളുകളെ സൂചിപ്പിക്കുന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. ബൈബിൾകാലത്തെ പദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: ഇസ്രായേലിൽ
  rationale: സ്ഥലമോ സമൂഹപരിധിയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും അതിവ്യാഖ്യാനമില്ലാത്തതുമായ മലയാളരൂപം.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: എലീശാ പ്രവാചകന്റെ കാലത്ത്
  rationale: ἐπί + genitive ഇവിടെ കാലസൂചനയാണ്; പദവിയും പേരും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐκαθαρίσθη
  choice: ശുദ്ധീകരിക്കപ്പെട്ടില്ല
  rationale: രോഗശാന്തിയോടൊപ്പം ആചാരപരമായ ശുദ്ധിയുടെ ബൈബിൾപരമായ ധ്വനിയും നിലനിർത്തുന്നു; വെറും ‘സൗഖ്യം പ്രാപിച്ചില്ല’ എന്നാക്കി അർഥം ചുരുക്കുന്നില്ല.
- source_word: εἰ μὴ
  choice: ഒഴികെ
  rationale: ഇവിടെ ഒരേയൊരു അപവാദത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ തുല്യം.
- source_word: Ναιμὰν ὁ Σύρος
  choice: സുറിയക്കാരനായ നയമാൻ
  rationale: നയമാന്റെ വിദേശീയ തിരിച്ചറിയൽ വാക്യത്തിന്റെ പ്രധാന വൈരുധ്യമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ വിശേഷണരൂപം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: കുഷ്ഠരോഗവുമായി ബന്ധപ്പെട്ട ശുദ്ധീകരണഭാഷ
  choice: ἐκαθαρίσθη എന്നത് ‘ശുദ്ധീകരിക്കപ്പെട്ടില്ല’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സൗഖ്യം പ്രാപിച്ചില്ല’ അല്ലെങ്കിൽ ‘സുഖപ്പെട്ടില്ല’
  rationale: ഗ്രീക്ക് പദം ശാരീരിക രോഗമുക്തിയേക്കാൾ വിശാലമായ, ബൈബിൾപരമായ ശുദ്ധി-അശുദ്ധി ധ്വനി വഹിക്കുന്നു. അതിനെ നിലനിർത്തുന്നു; അധികമായ സിദ്ധാന്തവാദം ചേർക്കുന്നില്ല.
- issue: നയമാന്റെ വംശീയ/ദേശീയ തിരിച്ചറിയലിന്റെ പ്രാധാന്യം
  choice: ‘സുറിയക്കാരനായ’ എന്ന വിശേഷണം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: വിശേഷണം ഒഴിവാക്കുക, അല്ലെങ്കിൽ അടിക്കുറിപ്പിലേക്കു മാറ്റുക
  rationale: ഇസ്രായേലിലെ പലർക്കും ലഭിക്കാത്ത ശുദ്ധീകരണം ഒരു വിദേശിക്കു ലഭിച്ചു എന്ന യേശുവിന്റെ ഉദാഹരണത്തിലെ വൈരുധ്യം ഈ തിരിച്ചറിയൽ വഹിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ‘കുഷ്ഠരോഗി’ എന്ന വ്യക്തിനാമകരണം ഒഴിവാക്കി ‘കുഷ്ഠരോഗമുള്ള’ എന്ന മാന്യമായ പ്രയോഗം സ്വീകരിച്ചു. ‘ശുദ്ധീകരിക്കപ്പെട്ടു’ എന്ന ബൈബിൾപരമായ ഭാഷ ഉദ്ദേശപൂർവം നിലനിർത്തി.
