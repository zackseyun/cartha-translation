id: LUK.4.38
reference: Luke 4:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: ml
  text: അവൻ സിനഗോഗിൽനിന്ന് പുറപ്പെട്ട് ശിമോന്റെ വീട്ടിൽ പ്രവേശിച്ചു. ശിമോന്റെ അമ്മായിയമ്മയെ കടുത്ത പനി ബാധിച്ചിരുന്നു; അവർ അവളെക്കുറിച്ച് അവനോടു ചോദിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾക്കുവേണ്ടി അവനോട് അപേക്ഷിച്ചു.” ഗ്രീക്കിൽ അക്ഷരാർഥം “അവളെക്കുറിച്ച് അവനോടു ചോദിച്ചു” എന്നാണ്; ഈ സന്ദർഭത്തിൽ അവളെ സഹായിക്കണമെന്ന അപേക്ഷയായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: അവൻ സിനഗോഗിൽനിന്ന് എഴുന്നേറ്റ്
  rationale: ἀναστάς എന്ന aorist participle മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ἀπό സ്ഥലംവിട്ടുള്ള നീക്കത്തെ അടയാളപ്പെടുത്തുന്നു. ഈ പരിഭാഷ ക്രമവും ചലനവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: ശിമോന്റെ വീട്ടിൽ പ്രവേശിച്ചു
  rationale: εἰσέρχομαι കൂടെ εἰς ഒരു സ്ഥലത്തിനകത്തേക്കുള്ള പ്രവേശനത്തെ വ്യക്തമാക്കുന്നു. ‘പ്രവേശിച്ചു’ ഈ ചലനത്തെ കൃത്യമായും ചുരുക്കമായും നൽകുന്നു.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: ശിമോന്റെ അമ്മായിയമ്മ
  rationale: πενθερά എന്നത് പ്രത്യേകമായി ‘ഭാര്യയുടെ അമ്മ/അമ്മായിയമ്മ’ എന്ന ബന്ധപദമാണ്. മലയാളത്തിലെ സാധാരണ ബന്ധപദം ഉപയോഗിച്ച് അതിനെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: ἦν συνεχομένη πυρετῷ μεγάλῳ
  choice: കടുത്ത പനി ബാധിച്ചിരുന്നു
  rationale: സυνέχω എന്ന ക്രിയയുടെ passive participle രോഗം ഒരാളെ പിടിച്ചമർത്തുന്നതോ ബാധിക്കുന്നതോ സൂചിപ്പിക്കുന്നു; μέγας പനിയുടെ തീവ്രത കൂട്ടുന്നു. ‘കടുത്ത പനി ബാധിച്ചിരുന്നു’ എന്നത് ഈ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: അവർ അവളെക്കുറിച്ച് അവനോടു ചോദിച്ചു
  rationale: ἐρωτάω എന്നതിന് ‘ചോദിക്കുക’ എന്നും ‘അപേക്ഷിക്കുക’ എന്നും അർഥമാകാം. περὶ αὐτῆς എന്ന ഘടന ‘അവളെക്കുറിച്ച്’ എന്നാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്. രോഗശാന്തിക്കായുള്ള അപേക്ഷ സന്ദർഭത്തിൽ സാധ്യതയുള്ളതെങ്കിലും മുഖ്യവാചകത്തിൽ ഗ്രീക്കിന്റെ കുറച്ചുകൂടി തുറന്ന പ്രയോഗം സംരക്ഷിച്ചു.
theological_decisions:
- issue: πενθερά എന്ന ബന്ധപദത്തിൽനിന്ന് ശിമോന്റെ വിവാഹസ്ഥിതിയെക്കുറിച്ചുള്ള സൂചന
  choice: ‘ശിമോന്റെ അമ്മായിയമ്മ’ എന്ന ബന്ധപദം മാത്രം നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  alternative: ശിമോൻ വിവാഹിതനായിരുന്നു എന്ന് വിശദീകരിച്ച് ചേർക്കുക.
  rationale: ഈ ബന്ധപദം വിവാഹത്തെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും മൂലവാചകം അതിനെക്കുറിച്ച് പ്രത്യേകം വിശദീകരിക്കുകയോ നിഗമനം പ്രസ്താവിക്കുകയോ ചെയ്യുന്നില്ല; അതിനാൽ പരിഭാഷയും അങ്ങനെ വികസിപ്പിക്കുന്നില്ല.
- issue: ἠρώτησαν αὐτὸν περὶ αὐτῆς എന്നതിലെ ചോദ്യം/അപേക്ഷ എന്ന അർഥവ്യത്യാസം
  choice: മുഖ്യവാചകത്തിൽ ‘അവളെക്കുറിച്ച് അവനോടു ചോദിച്ചു’ എന്ന് നൽകി, അപേക്ഷ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുക.
  alternative: ‘അവൾക്കുവേണ്ടി അവനോട് അപേക്ഷിച്ചു’ അല്ലെങ്കിൽ ‘അവളെ സുഖപ്പെടുത്താൻ അവനോട് അപേക്ഷിച്ചു.’
  rationale: സന്ദർഭം സഹായത്തിനോ രോഗശാന്തിക്കോ വേണ്ടിയുള്ള അപേക്ഷയെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് പ്രയോഗം രോഗശാന്തി എന്ന് തുറന്നുപറയുന്നില്ല; അതിനാൽ വാചകത്തിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംയമനവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘സിനഗോഗ്’ എന്ന പരിചിതമായ ചരിത്രപദം നിലനിർത്തി. രോഗത്തിന്റെ തീവ്രത വ്യക്തമാക്കുമ്പോഴും മൂലത്തിൽ ഇല്ലാത്ത ‘കിടക്കുകയായിരുന്നു’ പോലുള്ള ദൃശ്യവിവരം ചേർത്തിട്ടില്ല.
