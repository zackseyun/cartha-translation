    rationale: 'The Greek λατρεύσεις, in this Deuteronomy citation, functions as an injunction: God alone is the one whom the hearer must serve. “സേവിക്കണം” communicates this without introducing permission.'
  - severity: low
    issue: “എഴുതിയിരിക്കുന്നുവല്ലോ” adds a discourse particle not required by Γέγραπται.
    rationale: The particle “-വല്ലോ” can sound like an appeal to something already conceded. “എഴുതിയിരിക്കുന്നു” is a natural Malayalam Scripture-citation formula and more closely matches the Greek’s neutral assertion.
