id: LUK.4.8
reference: Luke 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: ml
  text: 'യേശു അവനോടു മറുപടി പറഞ്ഞു: “എഴുതിയിരിക്കുന്നു: ‘നിന്റെ ദൈവമായ കർത്താവിനെ നീ ആരാധിക്കണം[a]; അവനെ മാത്രമേ സേവിക്കണം.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിന്റെ ദൈവമായ കർത്താവിന്റെ മുമ്പിൽ നീ കുനിഞ്ഞു വണങ്ങണം.”'
    reason: lexical_alternative
  - marker: b
    text: ഈ ഉദ്ധരണി ആവർത്തനം 6:13-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: യേശു അവനോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കൃദന്തരൂപവും മുഖ്യക്രിയയും ചേർന്ന പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രതികരണത്തിന്റെ ഭാവവും പരോക്ഷകർമവും നിലനിർത്തി അവതരിപ്പിക്കുന്നു.
- source_word: Γέγραπται
  choice: എഴുതിയിരിക്കുന്നുവല്ലോ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന സ്ഥിരപ്രയോഗവും എഴുതപ്പെട്ട വചനത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യവും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Κύριον τὸν θεόν σου
  choice: നിന്റെ ദൈവമായ കർത്താവിനെ
  rationale: κύριος എന്നതിന് ‘കർത്താവ്’ എന്നും θεόν σου എന്നതിന് ‘നിന്റെ ദൈവം’ എന്നും നൽകി, രണ്ടും ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: προσκυνήσεις
  choice: നീ ആരാധിക്കണം
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ വണക്കം എന്ന സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘സാഷ്ടാംഗം വീഴുക/വണങ്ങുക’ എന്ന ശരീരഭാവത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: λατρεύσεις
  choice: സേവിക്കാവൂ
  rationale: ദൈവത്തിനു നൽകുന്ന ആരാധനാപരമായ സേവനത്തെ ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: αὐτῷ μόνῳ
  choice: അവനെ മാത്രമേ
  rationale: സേവനം ദൈവത്തിനു മാത്രമാണെന്ന ഗ്രീക്കിലെ വ്യക്തമായ ഏകാധികാര ഊന്നൽ മലയാളത്തിലെ ‘മാത്രമേ ... -ആവൂ’ ഘടനയിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: തിരുവെഴുത്ത് ഉദ്ധരണിയിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന κύριος
  choice: കർത്താവ്
  alternative: യഹോവ / കർത്താവായ യഹോവ
  rationale: പുതിയനിയമത്തിലെ ലഭ്യമായ ഗ്രീക്ക് പാഠം κύριος എന്നാണ്; അതിനാൽ പിന്നിലുള്ള എബ്രായ ദൈവനാമം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- issue: προσκυνέω എന്നതിലെ ആരാധനയും ശാരീരികമായി വണങ്ങലും
  choice: ആരാധിക്കണം
  alternative: വണങ്ങണം
  rationale: പരീക്ഷണസന്ദർഭം ദൈവത്തിനുള്ള പ്രത്യേക ആരാധനയെക്കുറിച്ചാണ്; എന്നാൽ പദത്തിന്റെ ശാരീരികമായി കുനിഞ്ഞു വണങ്ങുന്ന ഭാവം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: λατρεύω എന്നതിന്റെ ആരാധനാപരമായ സേവനം
  choice: സേവിക്കാവൂ
  alternative: ആരാധനാപൂർവം സേവിക്കണം
  rationale: ‘സേവിക്കുക’ എന്നത് പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; προσκυνήσεις എന്ന സമാന്തരപദവും ദൈവസന്ദർഭവും അതിന്റെ വിശുദ്ധസേവനഭാവം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ‘എഴുതിയിരിക്കുന്നുവല്ലോ’ ഉദ്ധരണിസൂത്രത്തെ മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു; ‘അവനെ മാത്രമേ സേവിക്കാവൂ’ ഗ്രീക്കിലെ ഏകാധികാര ഊന്നൽ കൃത്യമായി സൂക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
