review_pass:
  verdict: revise
  source_fidelity: The rendering accurately conveys Jesus’ response, the scriptural-citation formula, worship of the Lord as one’s God, and the exclusive object of sacred service. However, “സേവിക്കാവൂ” normally has permissive force (“may serve”), whereas λατρεύσεις is a future-form injunction in the citation; “സേവിക്കണം” preserves the required force.
  naturalness: The Malayalam is clear and appropriately dignified. “എഴുതിയിരിക്കുന്നു” is the more neutral, idiomatic citation formula; “എഴുതിയിരിക്കുന്നുവല്ലോ” can add an unnecessary conversational/emphatic nuance.
  terminology: “കർത്താവ്,” “ആരാധിക്കണം,” and “സേവിക്കണം” are suitable modern-standard Malayalam renderings. The lexical-alternative footnote appropriately retains the bowing/prostration sense of προσκυνέω without weakening the main rendering’s worship sense.
  issues:
