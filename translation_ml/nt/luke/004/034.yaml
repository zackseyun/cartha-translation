  verdict: revise
  source_fidelity: The draft accurately preserves the abrupt cry, the hostile dissociation idiom, the vocative address, the unspecified plural ‘us,’ the question about destructive purpose, and the recognition formula. ‘നശിപ്പിക്കാൻ’ is an appropriate rendering of ἀπολέσαι in this context.
