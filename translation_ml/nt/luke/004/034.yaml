language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: ml
  text: “ആ! ഞങ്ങളുമായി നിനക്കെന്ത് കാര്യം,[a][b] നസറായനായ യേശുവേ?[c][d] ഞങ്ങളെ നശിപ്പിക്കാൻ വന്നതാണോ? നീ ആരാണെന്ന് എനിക്കറിയാം—ദൈവത്തിന്റെ പരിശുദ്ധനായവൻ.”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ!’ എന്നത് ഭയമോ പ്രതിഷേധമോ പ്രകടിപ്പിക്കുന്ന പെട്ടെന്നുള്ള നിലവിളിയാണ്; ആശയം കൂടുതൽ വ്യാഖ്യാനിച്ച് ‘ഞങ്ങളെ വിട്ടേക്കൂ!’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഞങ്ങൾക്കും നിനക്കും എന്ത്?’—അകൽച്ചയോ വിരോധപരമായ പ്രതിഷേധമോ പ്രകടിപ്പിക്കുന്ന സെമിറ്റിക് ശൈലിയിലുള്ള പ്രയോഗം.
    reason: cultural_note
  - marker: c
    text: അല്ലെങ്കിൽ, ‘നസറത്തിലെ യേശുവേ.’
    reason: lexical_alternative
  - marker: d
    text: ‘ഞങ്ങളെ’ എന്ന ബഹുവചനം ആരെ സൂചിപ്പിക്കുന്നുവെന്ന് ഗ്രീക്ക് വ്യക്തമാക്കുന്നില്ല. അശുദ്ധാത്മാവ് പ്രതിനിധിയായി സ്വയം സംസാരിക്കുന്നതോ പൈശാചിക ലോകത്തെ കൂടുതൽ വ്യാപകമായി സൂചിപ്പിക്കുന്നതോ ആകാം.
    reason: alternative_reading
  - marker: e
    text: അല്ലെങ്കിൽ, ‘ദൈവത്തിന്റെ വിശുദ്ധനായവൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: ആ!
  rationale: ഭയമോ പ്രതിഷേധമോ പ്രകടിപ്പിക്കുന്ന പെട്ടെന്നുള്ള നിലവിളി. ‘ഞങ്ങളെ വിട്ടേക്കൂ’ എന്ന വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കി മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: τί ἡμῖν καὶ σοί
  choice: ഞങ്ങളുമായി നിനക്കെന്ത് കാര്യം
  rationale: അകൽച്ചയോ വിരോധപരമായ പ്രതിഷേധമോ സൂചിപ്പിക്കുന്ന സെമിറ്റിക് ശൈലിയിലുള്ള പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: നസറായനായ യേശുവേ
  rationale: സംബോധനാരൂപവും നസറത്തുമായുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന വിശേഷണസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: ഞങ്ങളെ നശിപ്പിക്കാൻ വന്നതാണോ?
  rationale: വരവിന്റെ ഇപ്പോഴത്തെ ഭീഷണിഫലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ἀπόλλυμι എന്ന ക്രിയയുടെ ശക്തമായ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οἶδά σε τίς εἶ
  choice: നീ ആരാണെന്ന് എനിക്കറിയാം
  rationale: തിരിച്ചറിവിന്റെ അവകാശവാദം അലങ്കാരമില്ലാതെ നേരിട്ട് നൽകുന്നു.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പരിശുദ്ധൻ
  rationale: τοῦ θεοῦ എന്ന ബന്ധത്തെ ഔപചാരികമായി നിലനിർത്തി ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരിന്റെ ഗൗരവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൈശാചിക വാക്കിലെ ἡμᾶς എന്ന ബഹുവചനം
  choice: ‘ഞങ്ങളെ’ എന്ന ബഹുവചനം ആരെ സൂചിപ്പിക്കുന്നുവെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കാതെ നിലനിർത്തി.
  alternative: അശുദ്ധാത്മാവും ബാധിതനായ മനുഷ്യനും; അല്ലെങ്കിൽ പൈശാചിക ലോകം മുഴുവനും
  rationale: ഗ്രീക്ക് പാഠം ബഹുവചനം ഉപയോഗിക്കുന്നുവെങ്കിലും അതിന്റെ പരിധി വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായി തീർപ്പാക്കുന്നില്ല.
- issue: ὁ ἅγιος τοῦ θεοῦ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനം
  choice: ‘ദൈവത്തിന്റെ പരിശുദ്ധൻ’ എന്ന് doctrinal expansion ഇല്ലാതെ പരിഭാഷപ്പെടുത്തി.
  alternative: ദൈവത്തിന്റെ വിശുദ്ധൻ; ദൈവത്തിന്റേതായ പരിശുദ്ധൻ
  rationale: വാക്യം യേശുവിന്റെ തിരിച്ചറിയലിന് പ്രാധാന്യമുള്ള ഒരു സ്ഥാനം നൽകുന്നു; എന്നാൽ അതിന്റെ പൂർണ സിദ്ധാന്താർഥം ഇവിടെ വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ‘നസറായനായ’ എന്ന രൂപം മൂലത്തിലെ Ναζαρηνός എന്ന വിശേഷണത്തെ പ്രതിഫലിപ്പിക്കുന്നു; കൂടുതൽ സാധാരണമായ സ്ഥലബന്ധരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു. എല്ലാ അർഥസന്ദിഗ്ധതകളും മുഖ്യപാഠത്തിൽ നിർബന്ധിതമായി തീർപ്പാക്കാതെ സൂക്ഷിച്ചിട്ടുണ്ട്.
