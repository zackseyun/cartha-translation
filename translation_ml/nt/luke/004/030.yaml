id: LUK.4.30
reference: Luke 4:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτὸς δὲ διελθὼν διὰ μέσου αὐτῶν ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: ml
  text: എന്നാൽ അവൻ അവരുടെ നടുവിലൂടെ[a] കടന്നുപോയി തന്റെ വഴിക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ മധ്യത്തിലൂടെ.’ യേശു ജനക്കൂട്ടത്തിലൂടെ നീങ്ങിയതായി ഗ്രീക്ക് പാഠം വിവരിക്കുന്നുവെങ്കിലും അത് എങ്ങനെ സംഭവിച്ചു എന്നു പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: അവൻ
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം വ്യക്തമായി നൽകിയിട്ടുണ്ടെങ്കിലും മലയാളത്തിൽ ‘അവൻതന്നെ’ എന്നു പറയുന്നത് ആവശ്യത്തിലധികം ഊന്നൽ നൽകും; ‘അവൻ’ സ്വാഭാവികമായി ആശയം വഹിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ജനക്കൂട്ടത്തിന്റെ ശത്രുതാപരമായ ഉദ്ദേശ്യത്തിനും യേശുവിന്റെ തടസ്സമില്ലാത്ത പുറപ്പെടലിനും ഇടയിലെ മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: διελθὼν
  choice: കടന്നുപോയി
  rationale: διέρχομαι എന്ന ക്രിയയുടെ കൃതന്തരൂപം ഒരു സ്ഥലത്തിലൂടെ സഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ തുടർക്രിയാരൂപം മുഖ്യക്രിയയുമായുള്ള ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διὰ μέσου αὐτῶν
  choice: അവരുടെ നടുവിലൂടെ
  rationale: ആ കൂട്ടത്തിന്റെ മധ്യത്തിലൂടെയുള്ള ചലനം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπορεύετο
  choice: തന്റെ വഴിക്കു പോയി
  rationale: അപൂർണകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുള്ള സഞ്ചാരത്തെ ‘തന്റെ വഴിക്കു പോയി’ എന്ന പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു; വെറും ‘പോയി’ എന്നതിനെക്കാൾ യാത്ര തുടരുന്ന ഭാവം ഇതിലുണ്ട്.
theological_decisions:
- issue: ഈ വാക്യം അത്ഭുതകരമായ രക്ഷപ്പെടലിനെ സൂചിപ്പിക്കണമോ, വിവരണാത്മകമായി നിഷ്പക്ഷമായി നിൽക്കണമോ
  choice: യേശു അവരുടെ നടുവിലൂടെ കടന്നുപോയി എന്നു മാത്രം പറയുന്ന വിവരണാത്മകമായി നിഷ്പക്ഷമായ ഭാഷ
  alternative: ‘അത്ഭുതകരമായി അവർക്കിടയിലൂടെ കടന്നുപോയി’ എന്നതുപോലെ അമാനുഷിക സംഭവമെന്ന് വ്യക്തമാക്കുന്ന ഭാഷ
  rationale: യേശു ജനക്കൂട്ടത്തിലൂടെ എങ്ങനെ കടന്നുപോയി എന്ന് ഗ്രീക്ക് പാഠം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പാഠത്തിൽ നേരിട്ട് പറയാത്ത അത്ഭുതസ്വഭാവം വിവർത്തനം ചേർക്കുന്നില്ല; സന്ദർഭത്തിൽനിന്ന് വായനക്കാർക്ക് അതിന്റെ പ്രാധാന്യം വിലയിരുത്താം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നടുവിലൂടെ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘തന്റെ വഴിക്കു പോയി’ എന്നത് സഞ്ചാരം തുടർന്നുവെന്ന ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
