  rationale: The revision keeps the favorable but not overly technical sense of ἐμαρτύρουν, more closely represents the ongoing participial phrase describing the words, and renders ἐπὶ τοῖς λόγοις as the basis of the crowd’s amazement. It also separates the two lexical alternatives into accurately placed notes. The crowd’s unqualified designation of Jesus as Joseph’s son is retained exactly as reported.
