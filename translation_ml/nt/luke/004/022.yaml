reference: Luke 4:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: ml
  text: എല്ലാവരും അവനെക്കുറിച്ച് പ്രശംസയോടെ സംസാരിക്കുകയും[a] അവന്റെ വായിൽനിന്നു വന്നുകൊണ്ടിരുന്ന കൃപയാർന്ന വാക്കുകളിൽ[b] വിസ്മയിക്കുകയും ചെയ്തു. അവർ, “ഇവൻ യോസേഫിന്റെ മകനല്ലേ?” എന്നു ചോദിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെക്കുറിച്ച് സാക്ഷ്യം പറയുകയും.” ഗ്രീക്ക് പ്രയോഗത്തിന് അവനെ പ്രശംസിച്ചു സംസാരിക്കുക എന്നോ അവനെക്കുറിച്ച് സാക്ഷ്യം പറയുക എന്നോ അർഥമാകാം. ഇവിടെ തുടർന്നുവരുന്ന വിസ്മയപ്രതികരണത്തോട് അനുകൂലമായ അർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കൃപയുടെ വാക്കുകൾ.” അതായത്, കൃപ, പ്രീതി, അല്ലെങ്കിൽ ആകർഷകത പ്രകടമാക്കുന്ന വാക്കുകൾ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: അവനെക്കുറിച്ച് പ്രശംസയോടെ സംസാരിക്കുകയും
  rationale: ഈ സന്ദർഭത്തിൽ പ്രയോഗം അനുകൂലമായ സാക്ഷ്യമോ പ്രശംസയോ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള വിസ്മയപ്രതികരണവുമായി ചേർന്നുനിൽക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: ἐθαύμαζον
  choice: വിസ്മയിക്കുകയും ചെയ്തു
  rationale: അപൂർണ്ണകാലത്തിന്റെ തുടർച്ചയായ പ്രതികരണം സന്ദർഭത്തിലെ ക്രിയാസമുച്ചയം വഴി പ്രകടമാകുന്നു; പദം അത്ഭുതവും ആദരവോടുകൂടിയ ആശ്ചര്യവും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τοῖς λόγοις
  choice: വാക്കുകൾ കേട്ട്
  rationale: ἐπί ദത്തിവിനോടുകൂടെ അവരുടെ വിസ്മയത്തിന്റെ കാരണമോ അവസരമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കേട്ട്’ എന്നത് ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τῆς χάριτος
  choice: കൃപനിറഞ്ഞ
  rationale: ഗുണസൂചക ഷഷ്ഠിയായി വായിച്ച് കൃപ, പ്രീതി, ആകർഷകത എന്നിവയാൽ സവിശേഷമായ വാക്കുകൾ എന്ന ആശയം നൽകുന്നു; ‘കൃപയുടെ വാക്കുകൾ’ എന്ന കൂടുതൽ ശാബ്ദിക സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: അവന്റെ വായിൽനിന്നു പുറപ്പെട്ട
  rationale: വാക്കുകളുടെ ഉറവിടത്തെ ഊന്നുന്ന മൂലഭാഷയിലെ ദൃശ്യാവിഷ്കാരം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Οὐχὶ
  choice: മകനല്ലേ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യത്തിന്റെ ഭാവം മലയാളത്തിലെ ‘അല്ലേ?’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: ഇവൻ യോസേഫിന്റെ മകൻ
  rationale: ബന്ധസൂചക ഷഷ്ഠിയെ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; ജനക്കൂട്ടത്തിന്റെ ധാരണയ്ക്ക് വിവർത്തകൻ വിശദീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: കന്യകാഗർഭധാരണത്തിന്റെ വെളിച്ചത്തിൽ യേശുവിനെ യോസേഫിന്റെ മകൻ എന്നു വിളിക്കുന്നത്
  choice: ജനക്കൂട്ടത്തിന്റെ വാക്കുകൾ യാതൊരു യോഗ്യതപ്പെടുത്തലുമില്ലാതെ ‘യോസേഫിന്റെ മകൻ’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ വിശദീകരണപരമായ വാക്കുകൾ ചേർക്കുക.
  rationale: ഇത് ആഖ്യാതാവിന്റെ ഉപദേശപരമായ പ്രസ്താവനയല്ല, ജനക്കൂട്ടത്തിന്റെ ധാരണയാണ്. വിശദീകരണം ചേർക്കാതെ മൂലപാഠത്തിലെ നാടകീയവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അല്ലേ?’ വാചകത്തിലെ പ്രതീക്ഷിത അനുകൂല ഉത്തരഭാവം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ രണ്ട് പ്രധാന ശബ്ദാർഥസാധ്യതകളും ഒരൊറ്റ അടിക്കുറിപ്പിൽ വ്യക്തമായി രേഖപ്പെടുത്തി; മുഖ്യവാചകത്തിലെ [a] അടയാളം അതിനോട് പൊരുത്തപ്പെടുന്നു.
