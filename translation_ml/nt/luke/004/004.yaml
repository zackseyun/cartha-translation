id: LUK.4.4
reference: Luke 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: ml
  text: 'യേശു അവനോടു മറുപടി പറഞ്ഞു: “എഴുതപ്പെട്ടിരിക്കുന്നു: ‘മനുഷ്യൻ അപ്പംകൊണ്ടു മാത്രം ജീവിക്കുകയില്ല.’”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു വ്യക്തി അപ്പംകൊണ്ടു മാത്രം ജീവിക്കുകയില്ല” എന്നും വിവർത്തനം ചെയ്യാം; ഇവിടെ “മനുഷ്യൻ” എന്നത് മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: യേശു ആവർത്തനം 8:3 ഉദ്ധരിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: അവനോടു മറുപടി പറഞ്ഞു
  rationale: ἀποκρίνομαι എന്ന ക്രിയയോടൊപ്പം πρός + ദ്വിതീയാവിഭക്തി വന്നിരിക്കുന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്; ഗ്രീക്കിലെ ബന്ധസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Γέγραπται
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന സ്ഥിരപ്രയോഗത്തെയും പൂർത്തികൃത നിഷ്ക്രിയാരൂപം സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന പ്രാബല്യത്തെയും ഈ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: ':'
  rationale: ഇവിടെ ὅτι ഉദ്ധരണിയെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എന്ന്’ ചേർക്കുന്നതിനെക്കാൾ ദ്വിബിന്ദുവിട്ട് നേരിട്ട് ഉദ്ധരിക്കുന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: അപ്പംകൊണ്ടു മാത്രം
  rationale: ജീവനെ നിലനിർത്തുന്ന അടിസ്ഥാനം അഥവാ ഉപാധി എന്ന ἐπίയുടെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ζήσεται
  choice: ജീവിക്കുകയില്ല
  rationale: οὐκ എന്ന നിഷേധത്തോടുകൂടിയ ഭാവികാലത്തിന്റെ അർത്ഥം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ ἄνθρωπος
  choice: മനുഷ്യൻ
  rationale: ഏകവചനരൂപവും മനുഷ്യവർഗത്തെ പൊതുവായി പ്രതിനിധീകരിക്കുന്ന അർത്ഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു; മലയാളത്തിലെ ‘മനുഷ്യൻ’ ഇവിടെ സ്വാഭാവികമായി എല്ലാവരെയും ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ആവർത്തനം 8:3-ൽനിന്നുള്ള ഉദ്ധരണിയിലെ ὁ ἄνθρωπος എന്ന പൊതുവാചക ഏകവചനം
  choice: മനുഷ്യൻ
  alternative: ഒരു വ്യക്തി / മനുഷ്യർ
  rationale: ‘മനുഷ്യൻ’ ഉറവിടത്തിലെ ഏകവചനവും പ്രതിനിധാനപരമായ പൊതുവായ അർത്ഥവും തിരുവെഴുത്താന്തരബന്ധവും സംരക്ഷിക്കുന്നു. മലയാളത്തിൽ ഈ പദം സന്ദർഭത്തിൽ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നില്ല.
- issue: ആവർത്തനം 8:3-ലെ ദീർഘമായ മൂലവാക്യത്തിന്റെ ഭാഗിക ഉദ്ധരണം
  choice: ലൂക്കോസ് നൽകിയിരിക്കുന്ന ചുരുക്കിയ ഉദ്ധരണം മാത്രം മുഖ്യവാചകത്തിൽ നിലനിർത്തി
  alternative: ‘യഹോവയുടെ വായിൽനിന്നു പുറപ്പെടുന്ന സകല വചനത്താലും’ എന്ന തുടർച്ച ചേർക്കുക
  rationale: SBLGNT-യിലെ ലൂക്കോസ് 4:4-ന്റെ വാചകം ആ തുടർച്ച ഉൾക്കൊള്ളുന്നില്ല; അതിനാൽ മറ്റൊരു പാഠപരമ്പരയിലോ ആവർത്തനത്തിലെ പൂർണ്ണവാക്യത്തിലോ നിന്നുള്ള വാക്കുകൾ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തതയും ഉള്ള മലയാളം. ‘എഴുതപ്പെട്ടിരിക്കുന്നു’ എന്ന പരമ്പരാഗത തിരുവെഴുത്ത്-ഉദ്ധരണി പ്രയോഗം നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
