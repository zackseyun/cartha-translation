id: LUK.4.44
reference: Luke 4:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἦν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ τῆς ⸀Ἰουδαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/044.yaml
  text: And he was preaching in the synagogues of Judea[a].
translation:
  language: ml
  text: അവൻ യെഹൂദ്യയിലെ സിനഗോഗുകളിൽ പ്രസംഗിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘യെഹൂദ്യ’ എന്നതിനുപകരം ‘ഗലീല’ എന്നു വായിക്കുന്നു. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിലെ ‘യെഹൂദ്യ’ എന്ന വായനയാണ് മുഖ്യപാഠത്തിൽ പിന്തുടരുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: പ്രസംഗിച്ചുകൊണ്ടിരുന്നു
  rationale: εἰμίയുടെ അപൂർണഭൂതകാലരൂപവും വർത്തമാനകൃ/ദന്തരൂപമായ κηρύσσωνഉം ചേർന്ന ഘടന, ഭൂതകാലത്തിൽ തുടർന്നുകൊണ്ടിരുന്ന അഥവാ ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘പ്രസംഗിച്ചുകൊണ്ടിരുന്നു’ ഈ കാലദൃഷ്ടി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κηρύσσων
  choice: പ്രസംഗിച്ചു
  rationale: κκηρύσσω പരസ്യമായി പ്രഖ്യാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സിനഗോഗിലെ ശുശ്രൂഷാസന്ദർഭത്തിൽ ‘പ്രസംഗിക്കുക’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അർഥസുതാര്യവുമാണ്.
- source_word: εἰς τὰς συναγωγάς
  choice: സിനഗോഗുകളിൽ
  rationale: εἰς സാധാരണയായി ദിശയെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ പ്രസംഗത്തിന്റെ സ്ഥലമോ പ്രവർത്തനമേഖലയോ ആണ് ഉദ്ദേശിക്കുന്നത്. അതിനാൽ സ്ഥാനസൂചകമായ ‘സിനഗോഗുകളിൽ’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: συναγωγάς
  choice: സിനഗോഗുകൾ
  rationale: ഈ സന്ദർഭത്തിൽ συναγωγή യെഹൂദരുടെ ആരാധനാസമ്മേളനസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രചാരമുള്ളതും കൃത്യവുമായ രൂപമാണ് ‘സിനഗോഗ്’.
- source_word: Ἰουδαίας
  choice: യെഹൂദ്യയിലെ
  rationale: SBLGNT പാഠം Ἰουδαίας (‘യെഹൂദ്യ’) എന്നാണ് വായിക്കുന്നത്. ചുറ്റുപാടിലുള്ള ഗലീലാസന്ദർഭവുമായി തോന്നാവുന്ന സംഘർഷം പരിഭാഷയിൽ ഒത്തുതീർക്കാതെ മൂലപാഠത്തിലെ ഭൂമിശാസ്ത്രനാമം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ചുറ്റുപാടിലുള്ള ഗലീലാസന്ദർഭത്തിന്റെ വെളിച്ചത്തിൽ τῆς Ἰουδαίας എന്ന ഭൂമിശാസ്ത്രപരാമർശം
  choice: യെഹൂദ്യ
  alternative: ചില കൈയെഴുത്തുപ്രതികളിലെ ‘ഗലീല’; അല്ലെങ്കിൽ വിശാലമായ അർഥത്തിൽ യെഹൂദരുടെ പ്രദേശം
  rationale: മൂലഭാഷാപാഠത്തിന് മുൻഗണന നൽകി SBLGNTയിലെ ‘യെഹൂദ്യ’ എന്ന വായന നിലനിർത്തുന്നു. സന്ദർഭവുമായി തോന്നാവുന്ന സംഘർഷം പരിഭാഷയിൽ സമന്വയിപ്പിക്കാതെ, പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. തുടർച്ചയായ ഭൂതകാലപ്രവൃത്തി ‘പ്രസംഗിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു; ‘സിനഗോഗ്’, ‘യെഹൂദ്യ’ എന്നീ പരിചിതമായ ബൈബിൾ ഭൂമിശാസ്ത്ര-സാംസ്കാരിക പദങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു.
