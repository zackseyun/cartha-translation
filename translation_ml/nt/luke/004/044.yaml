  source_fidelity: The Malayalam accurately represents the periphrastic imperfect ἦν κηρύσσων with the ongoing past form “പ്രസംഗിച്ചുകൊണ്ടിരുന്നു,” renders the synagogue setting naturally, and retains the SBLGNT reading Ἰουδαίας as “യെഹൂദ്യയിലെ” without harmonizing it to the preceding Galilean setting. The initial connective καί is idiomatically unexpressed in Malayalam and no meaning is materially lost.
