  terminology: “സിനഗോഗുകളിൽ,” “പ്രസംഗിച്ചുകൊണ്ടിരുന്നു,” and “യെഹൂദ്യ” are suitable, recognizable terms. The footnote accurately identifies the relevant textual variant and does not overstate its implications.
