  source_fidelity: മൂലഗ്രീക്കിലെ ‘ἀποκριθεὶς εἶπεν’ സ്വാഭാവികമായി ‘മറുപടി പറഞ്ഞു’ എന്ന് നൽകിയിരിക്കുന്നു. αὐτῷ-യുടെ സന്ദർഭാനുസൃത സൂചനയായ ‘അവനോടു’ ശരിയാണ്. Εἴρηται-യിലെ λέγω-അടിസ്ഥാനത്തിലുള്ള ഉദ്ധരണിസൂത്രവാക്യം ‘ഇങ്ങനെ പറഞ്ഞിരിക്കുന്നു’ എന്നതിലൂടെ നിലനിർത്തിയിരിക്കുന്നു; ‘എഴുതിയിരിക്കുന്നു’ എന്നു മാറ്റിയിട്ടില്ല. ‘നിന്റെ ദൈവമായ കർത്താവിനെ നീ പരീക്ഷിക്കരുത്’ എന്നത് Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου-യുടെ അർത്ഥവും നിരോധനസ്വഭാവവും വിശ്വസ്തമായി നൽകുന്നു.
