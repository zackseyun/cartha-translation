id: LUK.4.12
reference: Luke 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: ml
  text: 'യേശു അവനോടു മറുപടി പറഞ്ഞു: “ഇങ്ങനെ പറഞ്ഞിരിക്കുന്നു:[a] ‘നിന്റെ ദൈവമായ കർത്താവിനെ നീ പരീക്ഷിക്കരുത്.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പാരമ്പര്യ മലയാള പരിഭാഷകളിൽ പലപ്പോഴും “എഴുതിയിരിക്കുന്നു” എന്നു കാണാം. എന്നാൽ ഇവിടെ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “പറഞ്ഞിരിക്കുന്നു” എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: ഇത് ആവർത്തനം 6:16-ൽനിന്നുള്ള ഉദ്ധരണിയാണ്. അവിടത്തെ എബ്രായ പാഠത്തിൽ സാധാരണയായി “യഹോവ” എന്നു പരിഭാഷപ്പെടുത്തുന്ന YHWH എന്ന ദൈവനാമമാണ് ഉള്ളത്.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും സമാപകക്രിയയും ചേർന്ന ഈ സെമിറ്റിക് സ്വാധീനമുള്ള ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്ന് നൽകുന്നു.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: സന്ദർഭത്തിൽ യേശുവിനോടു സംസാരിക്കുന്ന പിശാചിനെയാണ് ദത്തിവ് സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: ὅτι
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: മലയാളത്തിൽ ഉദ്ധരണി നേരിട്ട് അവതരിപ്പിക്കുമ്പോൾ ὅτι-യ്ക്കായി ‘എന്ന്’ ചേർക്കേണ്ടതില്ല.
- source_word: Εἴρηται
  choice: ഇങ്ങനെ പറഞ്ഞിരിക്കുന്നു
  rationale: λέγω എന്ന ക്രിയയുടെ പൂർണകാല കർമണിപ്രയോഗം ‘പറഞ്ഞിരിക്കുന്നു’ എന്ന അർത്ഥം നൽകുന്നു; തിരുവെഴുത്ത് ഉദ്ധരണിയാണെന്ന സൂചന സ്വാഭാവികമാക്കാൻ ‘ഇങ്ങനെ’ ചേർത്തു, എന്നാൽ ‘എഴുതിയിരിക്കുന്നു’ എന്ന് മാറ്റിയിട്ടില്ല.
- source_word: Οὐκ ἐκπειράσεις
  choice: നീ പരീക്ഷിക്കരുത്
  rationale: ἐκπειράζω എന്നത് പരീക്ഷണത്തിനു വിധേയമാക്കുക എന്ന ആശയമാണ് നൽകുന്നത്. ‘പ്രലോഭിപ്പിക്കുക’ എന്ന തെറ്റിദ്ധരിപ്പിക്കാവുന്ന അർത്ഥം ഒഴിവാക്കുന്നു.
- source_word: κύριον τὸν θεόν σου
  choice: നിന്റെ ദൈവമായ കർത്താവിനെ
  rationale: κύριος എന്നതിന് ‘കർത്താവ്’ നിലനിർത്തുകയും τὸν θεόν σου അതിനോടുള്ള വിശദീകരണമായി സ്വാഭാവിക മലയാളത്തിൽ ‘നിന്റെ ദൈവമായ’ എന്നു നൽകുകയും ചെയ്തു.
theological_decisions:
- issue: തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ സൂത്രവാക്യം (Εἴρηται)
  choice: ഇങ്ങനെ പറഞ്ഞിരിക്കുന്നു
  alternative: എഴുതിയിരിക്കുന്നു / പറഞ്ഞിട്ടുണ്ട്
  rationale: ഗ്രീക്കിൽ γράφω അല്ല, λέγω ആണ്. അതിനാൽ പാരമ്പര്യത്തിലുള്ള ‘എഴുതിയിരിക്കുന്നു’ എന്നതിനു പകരം മൂലപാഠത്തിന്റെ വാക്കുതെരഞ്ഞെടുപ്പ് നിലനിർത്തി.
- issue: ആവർത്തനം 6:16-ലെ ഉദ്ധരണിയിൽ κύριος എന്നതിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: ലൂക്കോസിന്റെ ഗ്രീക്ക് പാഠത്തിൽ κύριος ആണുള്ളത്; അതിനാൽ മുഖ്യപാഠം ഗ്രീക്ക് രൂപത്തെ പിന്തുടരുന്നു. എബ്രായ മൂലത്തിൽ ദൈവനാമമായ YHWH ഉണ്ടെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഉദ്ധരണിയുടെ തിരുവെഴുത്തുസ്വഭാവം സൂചിപ്പിക്കാൻ ‘ഇങ്ങനെ’ ഉപയോഗിച്ചെങ്കിലും ഗ്രീക്കിലെ ‘പറഞ്ഞിരിക്കുന്നു’ എന്ന പ്രത്യേകത സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
