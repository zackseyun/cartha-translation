source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ὅτι ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: ml
  text: അവർ അവന്റെ ഉപദേശത്തിൽ വിസ്മയിച്ചുപോയി; കാരണം, അവന്റെ വാക്കിന് അധികാരമുണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ സന്ദേശം അധികാരപൂർണമായിരുന്നു” അല്ലെങ്കിൽ “അവൻ പറഞ്ഞത് അധികാരത്തോടെയായിരുന്നു.”
    reason: λόγος എന്നത് ഇവിടെ ‘വാക്ക്,’ ‘സന്ദേശം,’ അല്ലെങ്കിൽ ‘പറഞ്ഞത്’ എന്നും ἐν ἐξουσίᾳ എന്നത് ‘അധികാരമുള്ളത്’ അല്ലെങ്കിൽ ‘അധികാരത്തോടെ’ എന്നും സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: വിസ്മയിച്ചുപോയി
  rationale: ശക്തമായ വിസ്മയപ്രതികരണത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു. ഗ്രീക്കിലെ അപൂർണകാലം സന്ദർഭത്തിൽ നീണ്ടുനിന്ന പ്രതികരണത്തെ സൂചിപ്പിക്കാമെങ്കിലും, മലയാളത്തിൽ കൃത്രിമമാകുന്ന വിധത്തിൽ അത് വിപുലീകരിച്ചിട്ടില്ല.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: അവന്റെ ഉപദേശത്തിൽ
  rationale: അവരുടെ വിസ്മയത്തിന്റെ വിഷയമോ അടിസ്ഥാനമോ അവന്റെ ഉപദേശമായിരുന്നു എന്ന അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: διδαχῇ
  choice: ഉപദേശം
  rationale: പഠിപ്പിക്കൽ എന്ന പ്രവൃത്തിയെയും അതിന്റെ ഉള്ളടക്കത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന, സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ പദം.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഇവിടെ ὅτι വിസ്മയത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ കാരണബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν ἐξουσίᾳ
  choice: അധികാരമുണ്ടായിരുന്നു
  rationale: യേശുവിന്റെ സംസാരത്തിന് അന്തർലീനമായ അധികാരശക്തിയുണ്ടായിരുന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; കേവലം സംസാരശൈലിയെ മാത്രം സൂചിപ്പിക്കുന്നില്ല.
- source_word: ὁ λόγος αὐτοῦ
  choice: അവന്റെ വാക്ക്
  rationale: λόγος ഇവിടെ യേശുവിന്റെ സംസാരത്തെയോ അദ്ദേഹം പറഞ്ഞ കാര്യത്തെയോ സൂചിപ്പിക്കുന്നു. ഏകവചനത്തിന്റെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സംസാരത്തിലെ അധികാരത്തിന്റെ സ്വഭാവം
  choice: അവന്റെ വാക്കിന് അധികാരമുണ്ടായിരുന്നു
  alternative: അവന്റെ സന്ദേശം അധികാരപൂർണമായിരുന്നു / അവൻ പറഞ്ഞത് അധികാരത്തോടെയായിരുന്നു
  rationale: വാക്യം യേശുവിന്റെ സംസാരത്തെ അധികാരമുള്ളതായി അവതരിപ്പിക്കുന്നു; എന്നാൽ ആ അധികാരത്തിന്റെ പൂർണമായ ദൈവശാസ്ത്രപരമായ അടിസ്ഥാനം ഈ വാക്യം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ഉറവിടത്തിലെ അവകാശവാദം മാത്രം നിലനിർത്തി അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അധികാരത്തോടുകൂടിയതായിരുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായെങ്കിലും ദുർഗ്രഹമായ രൂപത്തിന് പകരം ‘അധികാരമുണ്ടായിരുന്നു’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനുശേഷം നൽകിയിരിക്കുന്നു.
