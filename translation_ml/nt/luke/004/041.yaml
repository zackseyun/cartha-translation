    rationale: κραυγάζοντα καὶ λέγοντα accompanies the imperfect ἐξήρχετο. “വിളിച്ചുപറഞ്ഞു” after a sentence break can sound like a single completed action rather than demons repeatedly coming out while crying and speaking.
