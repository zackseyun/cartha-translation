id: LUK.4.41
reference: Luke 4:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: ml
  text: അനേകരിൽനിന്ന് ഭൂതങ്ങൾ പുറത്തുവന്നുകൊണ്ടിരുന്നു; അവ ഉറക്കെ നിലവിളിച്ചും, “നീ ദൈവപുത്രനാണ്!” എന്നു പറഞ്ഞുംകൊണ്ടിരുന്നു. എന്നാൽ അവൻ അവയെ ശാസിച്ച് സംസാരിക്കാൻ അനുവദിച്ചിരുന്നില്ല; കാരണം, അവൻ മശീഹയാണെന്ന് അവയ്ക്ക് അറിയാമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.” ഗ്രീക്ക് Χριστός എന്നതിന് “മശീഹ/അഭിഷിക്തൻ” എന്നർഥം.
    reason: സ്ഥാനനാമമായ Χριστός എന്ന പദത്തിന്റെ അംഗീകൃത മറ്റൊരു പരിഭാഷ വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: δαιμόνια
  choice: ഭൂതങ്ങൾ
  rationale: δαιμόνια എന്ന പദം നേരിട്ട് ദുഷ്ടാത്മജീവികളെ സൂചിപ്പിക്കുന്നു. മൂലത്തിൽ ‘അശുദ്ധാത്മാക്കൾ’ എന്ന പ്രയോഗമില്ലാത്തതിനാൽ അത് ഇവിടെ ചേർത്തിട്ടില്ല.
- source_word: ἐξήρχετο
  choice: പുറത്തുവന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർന്നോ ആവർത്തിച്ചോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ പ്രയോഗം ആ ആഖ്യാനഭാവം നിലനിർത്തുന്നു.
- source_word: ἀπὸ πολλῶν
  choice: അനേകരിൽനിന്ന്
  rationale: മൂലഗ്രീക്കിൽ മനുഷ്യരെ സൂചിപ്പിക്കുന്ന നാമം വ്യക്തമാക്കാതെ വിട്ടിരിക്കുന്നു. മലയാളത്തിലും അതേ സംക്ഷിപ്തതയും സന്ദർഭത്തിൽനിന്നുള്ള വ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: രണ്ട് കൃതന്തങ്ങളിലുമുള്ള ഉച്ചത്തിലുള്ള വിളിയും വാക്കുകളായുള്ള പ്രസ്താവനയും സ്വാഭാവികമായ ഒറ്റ മലയാളപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: തിരിച്ചറിയാവുന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനനാമത്തിന്റെ ഗൗരവവും നിർദിഷ്ടതയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐπιτιμῶν
  choice: ശാസിച്ച്
  rationale: അധികാരപൂർവമായ വിലക്കും കഠിനമായ ശാസനയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: οὐκ εἴα
  choice: അനുവദിച്ചില്ല
  rationale: യേശു അവയുടെ സംസാരത്തെ തടഞ്ഞുവെന്ന അർഥം വ്യക്തമായി നൽകുന്നു; സന്ദർഭത്തിലെ ആവർത്തനസ്വഭാവം മുൻവാക്യത്തിലെ തുടർച്ചാഭാവത്തോടൊപ്പം വായിക്കാം.
- source_word: ᾔδεισαν
  choice: അറിയാമായിരുന്നു
  rationale: οἶδα എന്ന നിലാവസ്ഥാസൂചക ക്രിയയുടെ ഭൂതകാലബോധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸν χριστὸν
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമമെന്നതിലുപരി ‘അഭിഷിക്തൻ’ എന്ന സ്ഥാനനാമമായി വരുന്നതിനാൽ ‘മശീഹ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: αὐτὸν εἶναι
  choice: അവൻ … ആണെന്ന്
  rationale: അറിയുക എന്ന ക്രിയയെ തുടർന്നുള്ള ഗ്രീക്ക് accusative-infinitive ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: ഭൂതങ്ങളുടെ ഏറ്റുപറച്ചിലിലെ Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം വ്യക്തിനാമമായി അല്ല, അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നു. മറ്റൊരു അംഗീകൃത പരിഭാഷ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ‘ദൈവപുത്രൻ’ എന്നും ‘മശീഹ’ എന്നും ഉള്ള വിശേഷണങ്ങളുടെ ബന്ധം
  choice: ഭൂതങ്ങൾ പറയുന്ന ‘ദൈവപുത്രൻ’ എന്ന വിശേഷണവും ആഖ്യാതാവ് നൽകുന്ന ‘മശീഹ’ എന്ന തിരിച്ചറിവും വേർതിരിച്ചു നിലനിർത്തി
  alternative: രണ്ടിനെയും ഒരൊറ്റ വിശദീകരണപ്രയോഗമായി ലയിപ്പിക്കുക
  rationale: ഗ്രീക്ക് വാക്യം ബന്ധമുള്ളതെങ്കിലും വ്യത്യസ്തമായ രണ്ട് വിശേഷണങ്ങൾ ഉപയോഗിക്കുന്നു. അവയുടെ ദൈവശാസ്ത്രപരമായ ബന്ധം പരിഭാഷയിൽ അധികമായി നിർവചിക്കാതെ മൂലത്തിലെ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അനേകരിൽനിന്ന്’ എന്ന പ്രയോഗം മൂലത്തിലെ സൂചനാത്മകത നിലനിർത്തുന്നു; ‘ഉറക്കെ വിളിച്ചുപറഞ്ഞു’ എന്നത് അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനം ഒഴിവാക്കി രണ്ടു ഗ്രീക്ക് കൃതന്തങ്ങളുടെയും ശക്തി പകരുന്നു.
