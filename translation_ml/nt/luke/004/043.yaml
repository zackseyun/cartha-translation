id: LUK.4.43
reference: Luke 4:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “മറ്റു പട്ടണങ്ങളിലും ദൈവരാജ്യത്തിന്റെ സുവാർത്ത ഞാൻ അറിയിക്കേണ്ടതുണ്ട്; അതിനായിട്ടാണ് ഞാൻ അയക്കപ്പെട്ടത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτέραις πόλεσιν
  choice: മറ്റു പട്ടണങ്ങളിലും
  rationale: ἕτερος ഇപ്പോഴുള്ള സ്ഥലത്തിനു പുറമേയുള്ളവയെ സൂചിപ്പിക്കുന്നു; πόλις എന്നതിന് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാളം ‘പട്ടണം’ ആണ്. καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-ഉം’ വഴി നിലനിർത്തുന്നു.
- source_word: εὐαγγελίσασθαί
  choice: സുവാർത്ത ... അറിയിക്കുക
  rationale: εὐαγγελίζω നല്ല വാർത്ത അറിയിക്കുക/പ്രഖ്യാപിക്കുക എന്ന ക്രിയാഭാവമുള്ളതാണ്. ‘സുവാർത്ത അറിയിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സഭാസാങ്കേതിക ഭാഷയിൽ അനാവശ്യമായി ചുരുങ്ങാത്തതുമാണ്.
- source_word: δεῖ
  choice: ഞാൻ ... അറിയിക്കേണ്ടതാകുന്നു
  rationale: δεῖ ശക്തമായ അനിവാര്യതയെ, ലൂക്കോസിൽ പലപ്പോഴും ദൈവിക ദൗത്യത്തിന്റെ അനിവാര്യതയെ, സൂചിപ്പിക്കുന്നു. ‘വേണ്ടതാകുന്നു’ ആ ഭാരം മാന്യമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തെക്കുറിച്ചുള്ള സുവാർത്ത
  rationale: മലയാളത്തിൽ ‘ദൈവരാജ്യം അറിയിക്കുക’ എന്നതിനെക്കാൾ, εὐαγγελίζομαι എന്ന ക്രിയയുടെ വിഷയമായി ദൈവരാജ്യം വരുന്നതിന്റെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ദൈവരാജ്യത്തെക്കുറിച്ചുള്ള സുവാർത്ത’ എന്നു നൽകി; ദൈവത്തിന്റെ ഭരണം/രാജ്യം എന്ന അടിസ്ഥാനമായ അർഥവ്യാപ്തി ചുരുക്കിയിട്ടില്ല.
- source_word: ἐπὶ τοῦτο
  choice: ഇതിനായിട്ടാണ്
  rationale: ഈ പ്രയോഗം ഉദ്ദേശ്യം അഥവാ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു. ‘ഇതിനായിട്ടാണ്’ അതിന്റെ ഊന്നലും സ്വാഭാവിക മലയാളവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἀπεστάλην
  choice: ഞാൻ അയക്കപ്പെട്ടത്
  rationale: ἀποστέλλωയുടെ അഓറിസ്റ്റ് പാസീവ് രൂപം നേരിട്ട് ‘അയക്കപ്പെട്ടു’ എന്നാണ്. അയച്ചയാളെ വാക്യം വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനത്തിലും ചേർത്തിട്ടില്ല.
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: എന്നാൽ അവൻ അവരോടു പറഞ്ഞു
  rationale: δέ ഇവിടെ മുൻസന്ദർഭത്തിലെ ജനങ്ങളുടെ ആഗ്രഹത്തോടുള്ള മൃദുവായ വൈരുധ്യം/മാറ്റം അടയാളപ്പെടുത്തുന്നു; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ദൗത്യപ്രസ്താവനയുടെ ശക്തി
  choice: ‘അറിയിക്കേണ്ടതാകുന്നു’ എന്നും ‘അയക്കപ്പെട്ടത്’ എന്നും നൽകി ദൈവികമായി നിർണയിക്കപ്പെട്ട ദൗത്യത്തിന്റെ സൂചന നിലനിർത്തുന്നു; അയച്ചയാളെ മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുന്നില്ല.
  alternative: ‘ദൈവം എന്നെ അയച്ചത് ഇതിനായിട്ടാണ്’ എന്ന് അയച്ചയാളെ തുറന്നുപറയുക.
  rationale: ലൂക്കോസിലെ δεῖ ദൈവിക അനിവാര്യതയെ സൂചിപ്പിക്കാം; ἀπεστάλην ദൗത്യനിയോഗത്തെയും സൂചിപ്പിക്കുന്നു. എങ്കിലും ഈ വാക്യത്തിൽ കർത്താവ് വ്യക്തമല്ലാത്തതിനാൽ അത് പൂരിപ്പിക്കാതെ ദൈവശാസ്ത്രപരമായ സൂചനയും വാചകത്തിലെ അപ്രകടതയും ഒരുപോലെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. മൂലത്തിലെ ഏക വാക്യഘടനയും ദൗത്യത്തിന്റെ അനിവാര്യതയും പാസീവ് രൂപവും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളുടെ മാർക്കറുകൾ അവയുടെ മുഖ്യവാചക സ്ഥാനങ്ങളുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലഗ്രീക്കിൽ പ്രത്യേകമായി ആവശ്യമായ പാഠ/അർഥ അടിക്കുറിപ്പ് ഇല്ലെന്ന അടിസ്ഥാനത്തിൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
