  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: ml
  text: അവളുടെ മുകളിൽ നിന്നുകൊണ്ട് അവൻ പനിയെ ശാസിച്ചു; പനി അവളെ വിട്ടുപോയി. ഉടനെ അവൾ എഴുന്നേറ്റ് അവരെ ശുശ്രൂഷിക്കാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: അവളുടെ അരികിൽ കുനിഞ്ഞുനിന്ന്
  rationale: യേശു അവളുടെ മീതെയോ സമീപത്തോ നിന്ന ഭൗതികനിലയാണ് പ്രയോഗം ചിത്രീകരിക്കുന്നത്. മലയാളത്തിൽ ദൃശ്യസാഹചര്യം സ്വാഭാവികമാക്കാൻ ‘അരികിൽ കുനിഞ്ഞുനിന്ന്’ എന്നു നൽകി; കുനിയുക എന്നത് സന്ദർഭാനുസൃതമായെങ്കിലും ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥം സൂചിപ്പിക്കുന്നു.
- source_word: ἐπετίμησεν τῷ πυρετῷ
  choice: പനിയെ ശാസിച്ചു
  rationale: പനിയെത്തന്നെയാണ് ശാസനയുടെ ലക്ഷ്യമായി ഗ്രീക്ക് അവതരിപ്പിക്കുന്നത്. യേശുവിന്റെ അധികാരസ്വരം നിലനിർത്തിക്കൊണ്ട് രോഗത്തിന് പൈശാചികകാരണം ആരോപിക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: ἀφῆκεν αὐτήν
  choice: പനി അവളെ വിട്ടുപോയി
  rationale: ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ് പനിയാണെന്ന് മുൻവാക്യത്തിൽനിന്ന് ഗ്രഹിക്കാം. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘പനി’ ആവർത്തിച്ചു.
- source_word: παραχρῆμα
  choice: ഉടനെ
  rationale: സൗഖ്യത്തിന്റെ തൽക്ഷണത വ്യക്തമാക്കുന്ന സ്വാഭാവികവും ആധുനികവുമായ മലയാളപ്രയോഗം.
- source_word: ἀναστᾶσα
  choice: അവൾ എഴുന്നേറ്റ്
  rationale: സൗഖ്യം ലഭിച്ചതിനു പിന്നാലെയുള്ള അവളുടെ പ്രവർത്തനം ലളിതവും നേരിട്ടുമായി നൽകുന്നു.
- source_word: διηκόνει αὐτοῖς
  choice: അവരെ ശുശ്രൂഷിക്കാൻ തുടങ്ങി
  rationale: അപൂർണഭൂതകാലക്രിയയുടെ ആരംഭപരമായോ തുടർച്ചയായോ ഉള്ള ഭാവം ‘തുടങ്ങി’ വഴി പ്രകടിപ്പിക്കുന്നു. ഇവിടെ ഭക്ഷണം വിളമ്പുന്നതുൾപ്പെടെയുള്ള പരിചരണസേവനം സൂചിപ്പിക്കാവുന്ന ‘ശുശ്രൂഷിക്കുക’ മാന്യവും സാധാരണവുമായ പ്രയോഗമാണ്.
theological_decisions:
- issue: പനിയെ ശാസിച്ചതെന്ന ഭാഷ രോഗത്തെ വ്യക്തിവൽക്കരിക്കുകയോ പൈശാചികകാരണമായി നിർവചിക്കുകയോ ചെയ്യുന്നുണ്ടോ
  choice: ‘പനിയെ ശാസിച്ചു’ എന്ന ഗ്രീക്കിലെ നേരിട്ടുള്ള അവതരണം നിലനിർത്തി
  alternative: ‘പനിയോട് കർശനമായി കല്പിച്ചു’ അല്ലെങ്കിൽ ‘രോഗത്തെ ശാസിച്ചു’
  rationale: ലൂക്കോസ് പനിയെത്തന്നെയാണ് ശാസിക്കപ്പെട്ടതായി അവതരിപ്പിക്കുന്നത്. അതിനെ അതേപടി നിലനിർത്തുന്നത് യേശുവിന്റെ അധികാരം പ്രകടമാക്കുന്നു; എന്നാൽ രോഗം പൈശാചികമാണെന്ന പ്രത്യേക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. വാക്യത്തിന്റെ ദൃശ്യതയും യേശുവിന്റെ അധികാരസ്വരവും സൗഖ്യത്തിന്റെ തൽക്ഷണതയും നിലനിർത്തിയിരിക്കുന്നു.
