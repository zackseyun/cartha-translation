id: LUK.4.17
reference: Luke 4:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: ml
  text: 'യെശയ്യാ പ്രവാചകന്റെ ചുരുൾ അദ്ദേഹത്തിന് കൈമാറിക്കൊടുത്തു[a]. അദ്ദേഹം ചുരുൾ നിവർത്തിയശേഷം, ഇങ്ങനെ എഴുതിയിരുന്ന സ്ഥലം കണ്ടെത്തി:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പുസ്തകം.’ βιβλίον എന്ന ഗ്രീക്കുപദത്തിന് പൊതുവേ ഒരു എഴുതപ്പെട്ട രേഖയെ സൂചിപ്പിക്കാം; എന്നാൽ ഈ സിനഗോഗ് സന്ദർഭത്തിൽ അത് മിക്കവാറും ഒരു ചുരുളിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: കൊടുത്തു
  rationale: നൽകുക/കൈമാറിക്കൊടുക്കുക എന്ന അർഥമുള്ള കർമണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അദ്ദേഹത്തിനു കൊടുത്തു’ എന്നു നൽകുന്നു; ഗ്രീക്കിലെ കർമണിഭാവം നിലനിർത്തുന്നു.
- source_word: βιβλίον
  choice: ചുരുൾ
  rationale: ഒന്നാം നൂറ്റാണ്ടിലെ സിനഗോഗ് വായനാസന്ദർഭത്തിൽ ഇത് കോഡക്സ് രൂപത്തിലുള്ള പുസ്തകത്തേക്കാൾ എഴുത്തുചുരുളിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: യെശയ്യാ പ്രവാചകന്റെ
  rationale: ചുരുൾ യെശയ്യാവിന്റേതാണെന്ന തിരിച്ചറിയലും അദ്ദേഹത്തിന്റെ പ്രവാചകപദവിയും സ്വാഭാവികമായ മലയാളക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀναπτύξας
  choice: നിവർത്തിയപ്പോൾ
  rationale: ചുരുൾ തുറന്നു നിവർത്തുന്ന പ്രവൃത്തിയും അതിനു പിന്നാലെയാണ് പ്രധാനക്രിയ സംഭവിച്ചതെന്ന ക്രമവും വ്യക്തമാക്കുന്നു.
- source_word: εὗρεν
  choice: കണ്ടെത്തി
  rationale: εὑρίσκω എന്നതിന്റെ നേരായ അർഥം നൽകുന്നു; അനാവശ്യമായി പ്രയാസകരമായ തിരച്ചിൽ സൂചിപ്പിക്കുന്നില്ല.
- source_word: τόπον
  choice: സ്ഥലം
  rationale: വാചകത്തിലെ ഒരു ഭാഗത്തെയോ സ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിലെ മൂർത്തമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: οὗ ἦν γεγραμμένον
  choice: ഇങ്ങനെ എഴുതിയിരുന്ന
  rationale: തുടർന്നുവരുന്ന ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുകയും പരിപൂർണകാലത്തിന്റെ നിലനിൽക്കുന്ന ഫലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചരിത്രസന്ദർഭം വ്യക്തമാക്കാൻ ‘ചുരുൾ’ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ സംഭവക്രമവും തുടർന്നുവരുന്ന ഉദ്ധരണിയിലേക്കുള്ള നീക്കവും വ്യക്തമായി നിലനിർത്തി.
