  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ അവരോടു പറഞ്ഞുതുടങ്ങി: “ഇന്ന് ഈ തിരുവെഴുത്ത് നിങ്ങൾ കേൾക്കുമ്പോൾ[a] നിറവേറിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നിങ്ങളുടെ ചെവികളിൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο
  choice: പറഞ്ഞുതുടങ്ങി
  rationale: ἤρξατο എന്ന ക്രിയയും λέγειν എന്ന പൂരകക്രിയയും ചേർന്ന പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ഒറ്റ ക്രിയാരൂപമായി അവതരിപ്പിക്കുന്നു; സംസാരത്തിന്റെ ആരംഭം ഇതിൽ വ്യക്തമാണ്.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ ശക്തമായ വിരോധമല്ല, വായനയ്ക്കുശേഷമുള്ള സംഭവപുരോഗതിയാണ് δέ സൂചിപ്പിക്കുന്നത്. ‘അപ്പോൾ’ ആ ആഖ്യാനമാറ്റം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρὸς αὐτοὺς
  choice: അവരോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതരെ നേരിട്ടും സംക്ഷിപ്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: Σήμερον
  choice: ഇന്ന്
  rationale: വാക്യാരംഭത്തിലെ കാലസൂചനയും അതിന്റെ ഊന്നലും നിലനിർത്തുന്ന സ്വാഭാവിക ആധുനിക മലയാളം.
- source_word: πεπλήρωται
  choice: നിറവേറിയിരിക്കുന്നു
  rationale: പൂർണമായ പ്രവൃത്തിയും ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലവും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് perfect passive-ന്റെ ഭാവം മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; കർത്താവിനെ വിവർത്തനം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἡ γραφὴ αὕτη
  choice: ഈ തിരുവെഴുത്ത്
  rationale: ഇപ്പോൾ വായിച്ച വിശുദ്ധലിഖിതഭാഗത്തെയാണ് γραφή സൂചിപ്പിക്കുന്നത്. ‘തിരുവെഴുത്ത്’ അതിന്റെ അംഗീകൃത വിശുദ്ധഗ്രന്ഥസ്വഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: നിങ്ങൾ കേൾക്കെ
  rationale: അക്ഷരാർഥമായ ‘നിങ്ങളുടെ ചെവികളിൽ’ എന്ന ഗ്രീക്ക് ശൈലിയെ, അവർ അതു കേൾക്കുന്ന സന്ദർഭത്തിൽത്തന്നെ നിറവേറുന്നു എന്ന അർഥം സംരക്ഷിച്ചുകൊണ്ട് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: നിറവേറൽ സംബന്ധിച്ച പ്രഖ്യാപനത്തിന്റെ സ്വഭാവം
  choice: ‘ഈ തിരുവെഴുത്ത്’ ഇന്ന് നിറവേറിയതായി മാത്രം പ്രസ്താവിക്കുന്നു; ആരിലൂടെ അല്ലെങ്കിൽ എങ്ങനെയാണ് നിറവേറിയത് എന്നു വാക്യത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
  alternative: ‘ഈ പ്രവചനം ഇന്ന് എന്നിലൂടെ നിറവേറിയിരിക്കുന്നു’ എന്നു വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക.
  rationale: സന്ദർഭം യേശുവിനോടുള്ള ബന്ധം ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് വാക്യം ‘പ്രവചനം,’ ‘എന്നിലൂടെ’ എന്നീ വാക്കുകൾ തുറന്നുപറയുന്നില്ല. അതിനാൽ വാക്യത്തിന്റെ ശക്തിയും അന്തർനിഹിതമായ ദൈവശാസ്ത്രപരമായ ബന്ധവും നിലനിർത്തി വിശദീകരണവാക്കുകൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പറഞ്ഞുതുടങ്ങി’ എന്നത് ഗ്രീക്കിലെ ക്രിയാസമുച്ചയത്തെ അനായാസമായി നൽകുന്നു; ‘നിങ്ങൾ കേൾക്കെ’ അക്ഷരാർഥം ഒഴിവാക്കിയിട്ടും മൂലത്തിലെ സജീവമായ ശ്രവണസന്ദർഭം നിലനിർത്തുന്നു.
