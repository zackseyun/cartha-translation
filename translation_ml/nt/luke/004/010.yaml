id: LUK.4.10
reference: Luke 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: “നിന്നെ കാത്തുസൂക്ഷിക്കാൻ അവൻ തന്റെ ദൂതന്മാരോടു നിന്നെക്കുറിച്ച് കല്പിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന സമ്പൂർണ കർമണിപ്രയോഗത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിൽ ഉന്നയിച്ച അവകാശവാദത്തിനുള്ള വിശദീകരണമോ അടിസ്ഥാനമോ അവതരിപ്പിക്കുന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: ':'
  rationale: എഴുതിയിരിക്കുന്നു എന്ന ആമുഖത്തിനു ശേഷം ഉദ്ധരണി സ്വാഭാവികമായി വിരാമചിഹ്നംകൊണ്ട് അവതരിപ്പിക്കുന്നു.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: തന്റെ ദൂതന്മാരോടു
  rationale: ദാതൃവിഭക്തിയെയും αὐτοῦ എന്ന ഉടമസ്ഥബന്ധത്തെയും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐντελεῖται
  choice: കല്പിക്കും
  rationale: ἐντέλλομαι എന്ന ക്രിയയുടെ ആജ്ഞ നൽകുക എന്ന അർഥവും ഭാവികാലവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: περὶ σοῦ
  choice: നിന്നെക്കുറിച്ച്
  rationale: περί + genitive എന്നതിന്റെ ‘നിന്നെ സംബന്ധിച്ച്/നിന്നെക്കുറിച്ച്’ എന്ന നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: τοῦ διαφυλάξαι σε
  choice: നിന്നെ കാത്തുസൂക്ഷിക്കാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന articular infinitive-നെയും διαφυλάσσω എന്നതിന്റെ സംരക്ഷണാർഥത്തെയും സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: സാത്താൻ ഉദ്ധരിക്കുന്ന സങ്കീർത്തനവാക്യത്തിന്റെ പരിധി
  choice: ലൂക്കോസ് രേഖപ്പെടുത്തിയിരിക്കുന്ന വാക്കുകൾ മാത്രം പരിഭാഷപ്പെടുത്തി; സങ്കീർത്തനം 91:11-ലെ ഒഴിവാക്കിയ തുടർച്ച ചേർത്തില്ല.
  alternative: സങ്കീർത്തനത്തിലെ പൂർണവാചകം ചേർത്ത് ഉദ്ധരണി വികസിപ്പിക്കുക.
  rationale: ലൂക്കോസിന്റെ ഗ്രീക്ക് പാഠത്തിന്റെ പരിധിയും സാത്താന്റെ യഥാർഥ ഉദ്ധരണിരൂപവും സംരക്ഷിക്കുന്നു; ഉറവിടത്തിൽ ഇല്ലാത്ത വാക്കുകൾ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: τοῦ διαφυλάξαι σε എന്നതും περὶ σοῦ എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ‘നിന്നെ കാത്തുസൂക്ഷിക്കാൻ’ എന്ന ഉദ്ദേശ്യഘടകം പ്രധാന ക്രിയയോടു സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു, അതേസമയം ‘നിന്നെക്കുറിച്ച്’ വേറിട്ട് നിലനിർത്തി.
  alternative: ‘നിന്നെക്കുറിച്ച്, നിന്നെ കാത്തുസൂക്ഷിക്കേണ്ടതിന്’ എന്ന കൂടുതൽ രൂപനിഷ്ഠമായ ക്രമം.
  rationale: ഗ്രീക്കിലെ ഘടനാപരമായ ബന്ധം ഇല്ലാതാക്കാതെ മലയാളത്തിൽ അനാവശ്യ അസ്പഷ്ടതയും കാഠിന്യവും ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ തിരുവെഴുത്ത്-ഉദ്ധരണിശൈലി. ‘കല്പിക്കും’, ‘ദൂതന്മാർ’, ‘കാത്തുസൂക്ഷിക്കാൻ’ എന്നീ പദങ്ങൾ ഔപചാരികതയും സാധാരണ ഗ്രാഹ്യതയും തുല്യമായി നിലനിർത്തുന്നു.
