id: LUK.4.36
reference: Luke 4:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: ml
  text: 'എല്ലാവരെയും വിസ്മയം പിടികൂടി; അവർ തമ്മിൽത്തമ്മിൽ സംസാരിച്ചുകൊണ്ടിരുന്നു: “ഇതെന്തു വാക്കാണ്?[a] അധികാരത്തോടും ശക്തിയോടുംകൂടെ അവൻ അശുദ്ധാത്മാക്കൾക്കു കൽപ്പിക്കുന്നു; അവ പുറത്തുവരുന്നു?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇതെന്തു സന്ദേശമാണ്?” ‘വാക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്കുപദത്തിന് ‘സന്ദേശം’ അല്ലെങ്കിൽ ‘കാര്യം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: വിസ്മയഭരിതരായി
  rationale: പെട്ടെന്നുണ്ടായ അതിശയവും വിസ്മയവും സൂചിപ്പിക്കുന്ന θάμβος എന്ന പദത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: എല്ലാവരും വിസ്മയഭരിതരായി
  rationale: ഗ്രീക്കിലെ ‘എല്ലാവരുടെയുംമേൽ വിസ്മയം വന്നു’ എന്ന ആശയം പദാനുപദമായ അസ്വാഭാവികത ഒഴിവാക്കി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: അവർ പരസ്പരം പറഞ്ഞു
  rationale: പരസ്പര സംഭാഷണം എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ തുടർന്നുനിന്ന സംഭാഷണഭാവം ‘പരസ്പരം’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാണ്.
- source_word: Τίς ὁ λόγος οὗτος
  choice: ഇത് എന്തൊരു വാക്കാണ്!
  rationale: λόγος എന്നതിലെ ഉച്ചരിച്ച വാക്ക്, സന്ദേശം എന്നീ സാധ്യതകൾക്കിടയിൽ ‘വാക്ക്’ എന്ന വിശാലമായ പദം നിലനിർത്തുന്നു; ചോദ്യം ആശ്ചര്യഭരിതമായ ഉദ്ഗാരമാണെന്ന ഭാവവും നൽകുന്നു.
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: അധികാരത്തോടും ശക്തിയോടുംകൂടെ
  rationale: ἐξουσία എന്ന അധികാരവും δύναμις എന്ന ഫലപ്രദമായ ശക്തിയും വേർതിരിച്ചുതന്നെ സൂക്ഷിച്ച് ഗ്രീക്കിലെ ക്രമം പാലിക്കുന്നു.
- source_word: ἐπιτάσσει
  choice: കല്പിക്കുന്നു
  rationale: നിർണായകമായി ആജ്ഞാപിക്കുക എന്ന അർഥം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; വർത്തമാനകാലത്തിന്റെ സജീവതയും നിലനിർത്തുന്നു.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: അശുദ്ധാത്മാക്കളോടു
  rationale: ἀκάθαρτος എന്നതിന്റെ ‘അശുദ്ധം’ എന്ന അർഥവും സുവിശേഷങ്ങളിലെ ആത്മീയജീവികളെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും വ്യാഖ്യാനിച്ചു ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐξέρχονται
  choice: അവ പുറത്തുപോകുകയും ചെയ്യുന്നു
  rationale: ആത്മാക്കൾ ബാധിതനായ വ്യക്തിയിൽനിന്ന് പുറപ്പെടുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ വർത്തമാനകാലഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭൂതോച്ചാടനസന്ദർഭത്തിലെ πνεύματα എന്നതിന്റെ അവതരണം
  choice: അശുദ്ധാത്മാക്കൾ
  alternative: ദുരാത്മാക്കൾ / അശുദ്ധമായ ആത്മാക്കൾ
  rationale: മൂലപാഠത്തിലെ ‘അശുദ്ധ’ എന്ന വിശേഷണം നിലനിർത്തുകയും ജീവികളെ മാനസികമോ രൂപകാത്മകമോ ആയ പ്രതിഭാസങ്ങളായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: λόγος എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: വാക്ക്
  alternative: സന്ദേശം / കാര്യം
  rationale: ഈ സന്ദർഭത്തിൽ യേശുവിന്റെ ഉച്ചരിച്ച കല്പനയെയും അതിലുള്ള സന്ദേശസ്വഭാവത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന അടിസ്ഥാന അർഥം മുഖ്യപാഠത്തിൽ നൽകി, യഥാർഥമായ പദാർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കല്പിക്കുന്നു’, ‘അശുദ്ധാത്മാക്കൾ’ എന്നീ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തിയിരിക്കുന്നു.
