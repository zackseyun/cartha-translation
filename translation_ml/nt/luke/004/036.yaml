revisions:
- from: 'എല്ലാവരും വിസ്മയഭരിതരായി; അവർ പരസ്പരം പറഞ്ഞു: “ഇത് എന്തൊരു വാക്കാണ്![a] അധികാരത്തോടും ശക്തിയോടുംകൂടെ അവൻ അശുദ്ധാത്മാക്കളോടു കല്പിക്കുന്നു; അവ പുറത്തുപോകുകയും ചെയ്യുന്നു!”'
  to: 'എല്ലാവരെയും വിസ്മയം പിടികൂടി; അവർ തമ്മിൽത്തമ്മിൽ സംസാരിച്ചുകൊണ്ടിരുന്നു: “ഇതെന്തു വാക്കാണ്?[a] അധികാരത്തോടും ശക്തിയോടുംകൂടെ അവൻ അശുദ്ധാത്മാക്കൾക്കു കൽപ്പിക്കുന്നു; അവ പുറത്തുവരുന്നു?”'
  rationale: The revision preserves the Greek's collective onset of amazement, the imperfect sense of ongoing mutual conversation, and the interrogative form of the crowd's response. It retains the source's distinction between authority and power and its established designation for unclean spirits, without adding interpretive content.
