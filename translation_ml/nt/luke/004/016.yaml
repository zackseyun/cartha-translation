id: LUK.4.16
reference: Luke 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: ml
  text: അവൻ വളർന്ന നസറായിലേക്കു വന്നു.[a] തന്റെ പതിവുപോലെ, ശബ്ബത്തുദിവസം അവൻ സിനഗോഗിൽ പ്രവേശിച്ചു; വായിക്കാനായി എഴുന്നേറ്റു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നസറെത്ത്.’ ഇവിടെ ഗ്രീക്കിലുള്ളത് ‘നസറാ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: നസറാ
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് സ്ഥലനാമരൂപമായ Ναζαρά നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു; കൂടുതൽ പരിചിതമായ ‘നസറെത്ത്’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τεθραμμένος
  choice: വളർന്ന
  rationale: τρέφω എന്ന ക്രിയയുടെ perfect passive participle ഇവിടെ യേശുവിന്റെ വളർത്തലും ബാല്യകാല വളർച്ചയും സൂചിപ്പിക്കുന്നു; ‘വളർന്ന’ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: പതിവുപോലെ
  rationale: അവന്റെ സ്ഥിരമായ ആചാരമോ പതിവോ ആയിരുന്നു എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: ശബ്ബത്തുദിവസം
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം ഇവിടെ ഏകവചനാർഥമുള്ള യഹൂദപ്രയോഗമാണ്; ‘ശബ്ബത്തുദിവസം’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: συναγωγήν
  choice: സിനഗോഗ്
  rationale: ഈ യഹൂദസന്ദർഭത്തിൽ സമ്മേളനത്തെയും അതിന്റെ സ്ഥലത്തെയും സൂചിപ്പിക്കുന്ന സ്ഥാപനനാമം നിലനിർത്തുന്നു.
- source_word: ἀνέστη ἀναγνῶναι
  choice: വായിക്കാനായി എഴുന്നേറ്റു
  rationale: ക്രിയയും ഉദ്ദേശ്യസൂചക infinitive-ഉം ചേർന്ന ഘടന, അവൻ വായിക്കുക എന്ന ഉദ്ദേശ്യത്തോടെ എഴുന്നേറ്റതായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Ναζαρά എന്ന സ്ഥലനാമത്തിന്റെ പരിഭാഷ
  choice: നസറാ
  alternative: നസറെത്ത്
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് രൂപം സമന്വയിപ്പിക്കാതെ അതേപടി പ്രതിനിധീകരിക്കുന്നു; പരിചിതമായ പരമ്പരാഗത സ്ഥലനാമം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്ക് വാക്യക്രമം നിർബന്ധമായി അനുകരിക്കാതെ അർഥബന്ധങ്ങൾ വ്യക്തമായി നിലനിർത്തി; സ്ഥലനാമത്തിലെ പാഠരൂപവ്യത്യാസം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
