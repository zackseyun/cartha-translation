id: LUK.17.23
reference: Luke 17:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐροῦσιν ὑμῖν· Ἰδοὺ ⸂ἐκεῖ· Ἰδοὺ ὧδε⸃· μὴ ἀπέλθητε μηδὲ διώξητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: ml
  text: 'അവർ നിങ്ങളോടു പറയും: “നോക്കൂ, അവിടെ!” അല്ലെങ്കിൽ “നോക്കൂ, ഇവിടെ!” നിങ്ങൾ പുറപ്പെട്ടുപോകരുത്; പിന്തുടരുകയും അരുത്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ “പിന്തുടരുക” എന്ന ക്രിയയുടെ കർമം വ്യക്തമാക്കിയിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν
  choice: പറയും
  rationale: λέγω എന്ന ക്രിയയുടെ ഭാവികാലരൂപം നേരിട്ടുള്ള ഉദ്ധരണിയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ἰδοὺ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ദൈക്തിക പ്രയോഗത്തിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: ὧδε എന്നതുമായുള്ള സ്ഥലവ്യത്യാസം ലളിതമായും കൃത്യമായും പ്രകടമാക്കുന്നു.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: ἐκεῖ എന്നതിനു വിരുദ്ധമായ സമീപസ്ഥലസൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: μὴ ἀπέλθητε
  choice: നിങ്ങൾ അവിടേക്കു പോകരുത്
  rationale: സ്ഥലം ചൂണ്ടിക്കാണിക്കുന്ന മുൻവാക്യങ്ങളുടെ പശ്ചാത്തലത്തിൽ, അത്തരം അവകാശവാദത്തിന് പ്രതികരിച്ച് അവിടേക്കു പോകുന്നതിനെ വിലക്കുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അവിടേക്കു’ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നതാണ്.
- source_word: μηδὲ διώξητε
  choice: പിന്നാലെ ഓടുകയും അരുത്
  rationale: διώκω എന്നതിന്റെ ‘പിന്തുടരുക/പിന്നാലെ ഓടുക’ എന്ന ശക്തി നിലനിർത്തുന്നു; ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലും കർമം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: διώξητε എന്ന ക്രിയയ്ക്ക് വ്യക്തമാക്കിയിട്ടില്ലാത്ത കർമം ചേർക്കണമോ
  choice: കർമം ചേർക്കാതെ ‘പിന്നാലെ ഓടുകയും അരുത്’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘അവരുടെ പിന്നാലെ ഓടരുത്’
  rationale: ഗ്രീക്ക് പാഠം ആരെയോ എന്തിനെയോ പിന്തുടരണമെന്ന് വ്യക്തമാക്കുന്നില്ല. കർമമില്ലാത്ത മലയാളപ്രയോഗം സ്വാഭാവികമായിരിക്കെ മൂലപാഠത്തിലെ യഥാർഥ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- issue: സ്ഥലസൂചനകളുടെ സംക്ഷിപ്തത
  choice: “നോക്കൂ, അവിടെ!” അല്ലെങ്കിൽ “നോക്കൂ, ഇവിടെ!”
  alternative: “ഇതാ, അവിടെ! ഇതാ, ഇവിടെ!”
  rationale: ആധുനിക വായനക്കാർക്ക് ഉടനടി ഗ്രഹിക്കാവുന്ന രീതിയിൽ ശ്രദ്ധക്ഷണവും സ്ഥലവ്യത്യാസവും നിലനിർത്തുന്നു; അന്തകാലശാസ്ത്രപരമായ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളം; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘നോക്കൂ’ സംഭാഷണത്തിലെ അടിയന്തര ശ്രദ്ധക്ഷണം നൽകുന്നു. ഗ്രീക്കിലെ കർമരഹിതമായ διώξητε മലയാളത്തിലും കർമരഹിതമായി സൂക്ഷിച്ചു.
