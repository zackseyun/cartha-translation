id: LUK.17.20
reference: Luke 17:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: ml
  text: 'ദൈവരാജ്യം എപ്പോഴാണ് വരുന്നതെന്ന് പരീശന്മാർ അവനോട് ചോദിച്ചപ്പോൾ, അവൻ അവരോട് ഉത്തരം പറഞ്ഞു: “ദൈവരാജ്യം നിരീക്ഷിച്ചറിയാവുന്ന വിധത്തിലല്ല[a] വരുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിരീക്ഷണത്തോടെയല്ല,” “കാണാൻ കഴിയുന്ന വിധത്തിലല്ല,” അല്ലെങ്കിൽ “സൂക്ഷ്മമായി നോക്കിക്കൊണ്ടിരിക്കേണ്ട വിധത്തിലല്ല.”
    reason: παρατήρησις എന്ന ഗ്രീക്ക് പദത്തിന് നിരീക്ഷണം, കാണാവുന്ന രീതി, ശ്രദ്ധാപൂർവമായ നോക്കൽ എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: പരീശന്മാർ അവനോട് ചോദിച്ചപ്പോൾ
  rationale: ഗ്രീക്കിലെ ഭൂതകാല നിഷ്ക്രിയ പങ്കാളിത്തരൂപത്തിന്റെ സാഹചര്യാർഥം ‘ചോദിച്ചപ്പോൾ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു. കർത്തരിപ്രയോഗം മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായതിനാൽ പരീശന്മാരെ കർത്താവാക്കി; δέയുടെ മൃദുവായ സംക്രമണബലം പ്രത്യേകം പദമായി ചേർക്കാതെ വാക്യഘടനയിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം എപ്പോഴാണ് വരുന്നത്
  rationale: πότεയുടെ നേരിട്ടുള്ള കാലസംബന്ധമായ ചോദ്യം ‘എപ്പോൾ’ എന്നും, ἔρχεταιയുടെ വർത്തമാനവും ഭാവിമുഖവുമായ ഭാവം ‘വരുന്നു/വരുന്നത്’ എന്നും നിലനിർത്തുന്നു. ‘ദൈവരാജ്യം’ പുതിയനിയമത്തിലെ പരിചിതവും സംക്ഷിപ്തവുമായ പ്രയോഗമാണ്.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: അവൻ അവരോട് ഉത്തരം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ഇരട്ട ക്രിയാപ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ ഒരൊറ്റ പ്രസ്താവനയായി നൽകുന്നു; ‘അവരോട്’ എന്നത് αὐτοῖς നിലനിർത്തുന്നു.
- source_word: Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം … അല്ല വരുന്നത്
  rationale: രാജ്യത്തിന്റെ വരവിന്റെ രീതി സംബന്ധിച്ച പൊതുപ്രസ്താവനയായി ഗ്രീക്ക് വർത്തമാനകാലത്തെ നിലനിർത്തുന്നു.
- source_word: μετὰ παρατηρήσεως
  choice: നിരീക്ഷിച്ചറിയാവുന്ന വിധത്തിലല്ല
  rationale: παρατήρησις എന്ന പദത്തിലെ നിരീക്ഷണം, ശ്രദ്ധാപൂർവമായ നോക്കൽ, പുറമേ തിരിച്ചറിയാവുന്ന പ്രകടനം എന്നീ അർഥസാധ്യതകൾ പരമാവധി തുറന്നുവെക്കുന്നു. ‘അടയാളങ്ങൾ’ എന്നു മുഖ്യവാചകത്തിൽ ചേർക്കാതിരുന്നതിനാൽ ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്ത ആശയം ഉറപ്പിച്ചുപറയുന്നില്ല.
theological_decisions:
- issue: ദൈവരാജ്യത്തിന്റെ വരവിനെക്കുറിച്ചുള്ള യേശുവിന്റെ നിഷേധത്തിന്റെ പരിധി
  choice: ദൈവരാജ്യം നിരീക്ഷിച്ചു തിരിച്ചറിയാൻ കഴിയുന്ന രീതിയിലല്ല വരുന്നതെന്ന് വിവർത്തനം ചെയ്തു.
  alternative: എല്ലാ അന്ത്യകാല അടയാളങ്ങളെയും യേശു പൂർണമായി നിഷേധിക്കുന്നു; അല്ലെങ്കിൽ മനുഷ്യർക്ക് ദൈവരാജ്യം ഒരു വിധത്തിലും ഗ്രഹിക്കാനാവില്ല.
  rationale: μετὰ παρατηρήσεως പ്രധാനമായി നിരീക്ഷിക്കാനോ സൂക്ഷ്മമായി പിന്തുടരാനോ കഴിയുന്ന പ്രകടനരീതിയെ സൂചിപ്പിക്കുന്നു. വാക്യം പറയുന്നതിലുപരി സമഗ്രമായ അന്ത്യകാലസിദ്ധാന്തം വിവർത്തനത്തിൽ ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥവ്യാപ്തിയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ ശൈലി. നിഷ്ക്രിയമായ ഗ്രീക്ക് ഘടനയെ സ്വാഭാവിക മലയാള കർത്തരിപ്രയോഗമാക്കി. മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനപരമായ ‘അടയാളങ്ങൾ’ ചേർക്കാതെ മൂലപദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
