source:
  edition: SBLGNT
  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: ml
  text: രണ്ടു സ്ത്രീകൾ ഒരേ സ്ഥലത്ത് അരച്ചുകൊണ്ടിരിക്കും[a]; ഒരുവൾ കൊണ്ടുപോകപ്പെടും[b], മറ്റവൾ വിടപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരുമിച്ച്.” ഗ്രീക്കുപ്രയോഗത്തിന് “ഒരുമിച്ച്” എന്നും “ഒരേ സ്ഥലത്ത്” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “കൊണ്ടുപോകപ്പെടും” എന്നതുകൊണ്ടുമാത്രം അത് രക്ഷയ്ക്കായാണോ ന്യായവിധിക്കായാണോ എന്നു വ്യക്തമാകുന്നില്ല; ഗ്രീക്ക് പ്രയോഗം അത് വിശാലസന്ദർഭത്തിലേക്ക് വിടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται
  choice: ഉണ്ടായിരിക്കും / അരച്ചുകൊണ്ടിരിക്കും എന്ന ഭാവികാലഘടന
  rationale: ഭാവിയിൽ സംഭവിക്കുന്ന രംഗം അവതരിപ്പിക്കുന്ന εἰμίയുടെ ഭാവികാലരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ഭാവികാലവാക്യമായി ചേർത്തു.
- source_word: δύο … ἀλήθουσαι
  choice: രണ്ടു സ്ത്രീകൾ … ധാന്യം അരച്ചുകൊണ്ടിരിക്കും
  rationale: δύο സ്വതവേ ‘രണ്ട്’ എന്നാണെങ്കിലും സ്ത്രീലിംഗ ബഹുവചനമായ ἀλήθουσαι സ്ത്രീകളെയാണ് സൂചിപ്പിക്കുന്നത്. ക്രിയയുടെ പതിവ് പ്രവർത്തനവസ്തുവായ ധാന്യം മലയാളത്തിൽ പ്രവർത്തനം വ്യക്തമാക്കാൻ ചേർത്തു.
- source_word: ἐπὶ τὸ αὐτό
  choice: ഒരേ സ്ഥലത്ത്
  rationale: പ്രയോഗത്തിന് ‘ഒരുമിച്ച്’ എന്നും ‘ഒരേ സ്ഥലത്ത്’ എന്നും അർഥമാകാം. ഇവിടെ മൂലഭാഷയിലെ സ്ഥലസംബന്ധമായ അർഥം നേരിട്ട് നിലനിർത്തി; മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ἡ μία
  choice: ഒരുവൾ
  rationale: രണ്ടു സ്ത്രീകളിൽ ഒരാളെ വേർതിരിച്ചുകാട്ടുന്ന സ്ത്രീലിംഗപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി.
- source_word: παραλημφθήσεται
  choice: കൊണ്ടുപോകപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുന്നു. കൊണ്ടുപോകുന്നത് രക്ഷയ്ക്കോ ന്യായവിധിക്കോ ആണെന്ന് ക്രിയ തനിയെ വ്യക്തമാക്കാത്തതിനാൽ ആ അനിശ്ചിതത്വം സൂക്ഷിച്ചു.
- source_word: ἡ δὲ ἑτέρα
  choice: മറ്റവൾ
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം അർധവിരാമവും തുടർന്നുള്ള വ്യത്യസ്ത ഫലവും വ്യക്തമാക്കുന്നു; ἑτέρα രണ്ടാമത്തെ സ്ത്രീയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀφεθήσεται
  choice: അവിടെ വിടപ്പെടും
  rationale: ἀφίημι എന്നതിന്റെ ഭാവികാല കർമണിരൂപത്തിന് ‘വിടപ്പെടും’ എന്ന നേരിട്ടുള്ള അർഥം നൽകി. ‘അവിടെ’ എന്നത് വേർപിരിയലിലെ സ്ഥലഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഉപേക്ഷിക്കപ്പെടും എന്ന ശക്തമായ വ്യാഖ്യാനം ഒഴിവാക്കി.
theological_decisions:
- issue: കൊണ്ടുപോകപ്പെടുന്നവളുടെയും വിടപ്പെടുന്നവളുടെയും അന്തിമസ്ഥിതി രക്ഷയാണോ ന്യായവിധിയാണോ എന്ന ചോദ്യം
  choice: ‘ഒരുവൾ കൊണ്ടുപോകപ്പെടും; മറ്റവൾ അവിടെ വിടപ്പെടും’ എന്ന വ്യാഖ്യാനപരമായി തുറന്ന ഭാഷ
  alternative: ഒരുവൾ രക്ഷയ്ക്കായി കൊണ്ടുപോകപ്പെടും, മറ്റവൾ ന്യായവിധിക്കായി വിടപ്പെടും; അല്ലെങ്കിൽ ഒരുവൾ ന്യായവിധിക്കായി കൊണ്ടുപോകപ്പെടും, മറ്റവൾ രക്ഷിക്കപ്പെടും
  rationale: ഈ വാക്യം വേർതിരിവ് പ്രസ്താവിക്കുന്നുവെങ്കിലും രണ്ടു ഫലങ്ങളുടെയും ദൈവശാസ്ത്രപരമായ മൂല്യം സ്വതന്ത്രമായി നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ പിരിമുറുക്കം പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സ്ത്രീലിംഗ സൂചന ‘സ്ത്രീകൾ/ഒരുവൾ/മറ്റവൾ’ എന്നിങ്ങനെ വ്യക്തമായി നിലനിർത്തി. കർമണിപ്രയോഗങ്ങൾ മൂലപാഠത്തിലെ നിർവചിക്കാത്ത പ്രവർത്താവിനെയും ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വത്തെയും സംരക്ഷിക്കുന്നു.
