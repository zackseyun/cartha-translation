  to: അതുപോലെ നിങ്ങളും, നിങ്ങളോടു കൽപ്പിച്ചിട്ടുള്ളതെല്ലാം ചെയ്തുകഴിഞ്ഞാൽ, ‘ഞങ്ങൾ പ്രയോജനമില്ലാത്ത അടിമകളാണ്[a]; ഞങ്ങൾ ചെയ്യാൻ ബാധ്യസ്ഥരായിരുന്നതു മാത്രമേ ചെയ്തിട്ടുള്ളൂ[b]’ എന്നു പറയുക.
