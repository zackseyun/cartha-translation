id: LUK.17.10
reference: Luke 17:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: ml
  text: അതുപോലെ നിങ്ങളും, നിങ്ങളോടു കൽപ്പിച്ചിട്ടുള്ളതെല്ലാം ചെയ്തുകഴിഞ്ഞാൽ, ‘ഞങ്ങൾ പ്രയോജനമില്ലാത്ത അടിമകളാണ്[a]; ഞങ്ങൾ ചെയ്യാൻ ബാധ്യസ്ഥരായിരുന്നതു മാത്രമേ ചെയ്തിട്ടുള്ളൂ[b]’ എന്നു പറയുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉപയോഗമില്ലാത്ത അടിമകൾ.’ ഈ ഗ്രീക്ക് വിശേഷണത്തിന് ‘ലാഭമില്ലാത്ത/പ്രയോജനമില്ലാത്ത’ എന്ന അർഥമുണ്ട്; ഈ സന്ദർഭത്തിൽ പ്രത്യേക പ്രതിഫലത്തിന് അവകാശവാദമില്ലാത്തവർ എന്ന ആശയവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഞങ്ങളുടെ കടമയായിരുന്നതു മാത്രമേ ചെയ്തിട്ടുള്ളൂ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: അതുപോലെ നിങ്ങളും
  rationale: മുൻപുള്ള യജമാനൻ–അടിമ ദൃഷ്ടാന്തത്തെ ശിഷ്യന്മാരിലേക്കു പ്രയോഗിക്കുന്ന ബന്ധവും നിഗമനസ്വഭാവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὅταν ποιήσητε
  choice: ചെയ്തുകഴിയുമ്പോൾ
  rationale: അനുശാസിക്കപ്പെട്ട കാര്യങ്ങൾ പൂർത്തിയാക്കിയശേഷമുള്ള പ്രതികരണമാണ് ഉദ്ദേശിക്കുന്നത്; aorist subjunctive-ന്റെ future-general ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: നിങ്ങളോടു കല്പിച്ചതെല്ലാം
  rationale: διατάσσω എന്ന പദത്തിലെ അധികാരപൂർവമായ കല്പനയുടെ അർഥം ‘കല്പിച്ചത്’ കൃത്യമായി സൂക്ഷിക്കുന്നു.
- source_word: λέγετε
  choice: പറയുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ പതിവായോ പൊതുവായോ ഉള്ള നിർദേശഭാവം ലളിതമായ മലയാള ആജ്ഞാരൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Δοῦλοι
  choice: അടിമകൾ
  rationale: സമീപസന്ദർഭം വ്യക്തമായ യജമാനൻ–അടിമ ബന്ധമാണ്; അതിനാൽ ബന്ധിത സാമൂഹിക നില സൂചിപ്പിക്കുന്ന ‘അടിമകൾ’ എന്നത് ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἀχρεῖοί
  choice: യോഗ്യതയില്ലാത്ത
  rationale: ഇവിടെ അനുസരണം പ്രത്യേക പ്രതിഫലത്തിനോ അംഗീകാരത്തിനോ അവകാശം സൃഷ്ടിക്കുന്നില്ലെന്ന ആശയം പ്രകടമാക്കുന്നു; ‘പ്രയോജനമില്ലാത്ത’ അല്ലെങ്കിൽ ‘വിലയില്ലാത്ത’ എന്നതിലൂടെ വ്യക്തികളുടെ മൂല്യമില്ലായ്മ അനാവശ്യമായി സൂചിപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: ഞങ്ങൾ ചെയ്യാൻ ബാധ്യസ്ഥരായിരുന്നത്
  rationale: ὀφείλω സൂചിപ്പിക്കുന്ന കടപ്പാടും നിർബന്ധിത ഉത്തരവാദിത്വവും ‘ബാധ്യസ്ഥർ’ എന്ന പദം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πεποιήκαμεν
  choice: ചെയ്തിട്ടുള്ളൂ
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി perfect രൂപത്തിന് അനുസൃതമായി നൽകുന്നു; ‘മാത്രമേ ... ഉള്ളൂ’ എന്ന ഘടന അധിക അവകാശവാദമില്ലെന്ന സന്ദർഭാർഥവും സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വദൃഷ്ടാന്തത്തിൽ δοῦλοι എന്നതിന്റെ വിവർത്തനം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: ഉടൻമുമ്പുള്ള സാഹിത്യസന്ദർഭത്തിൽ യജമാനന്റെ കീഴിലുള്ള അടിമയുടെ സ്ഥിതിയാണ് വാദത്തിന്റെ അടിസ്ഥാനം. അതിനാൽ സാമൂഹികവും വാചാടോപപരവുമായ ശക്തി മൃദൂകരിക്കാതെ ‘അടിമകൾ’ ഉപയോഗിച്ചു.
- issue: ἀχρεῖοι എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: യോഗ്യതയില്ലാത്ത
  alternative: പ്രയോജനമില്ലാത്ത / വിലയില്ലാത്ത / പ്രതിഫലത്തിന് അവകാശമില്ലാത്ത
  rationale: അനുസരണത്താൽ യജമാനൻ കടക്കാരനാകുന്നില്ലെന്ന ആശയം ‘യോഗ്യതയില്ലാത്ത’ സംക്ഷിപ്തമായി നൽകുന്നു. എന്നാൽ ഗ്രീക്ക് പദത്തിന്റെ ‘പ്രയോജനമില്ലാത്ത’ എന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു; ശിഷ്യന്മാർ സ്വഭാവതഃ വിലയില്ലാത്തവരാണെന്ന വ്യാഖ്യാനം പ്രധാനവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ശൈലി. ‘കല്പിച്ചതെല്ലാം,’ ‘ബാധ്യസ്ഥരായിരുന്നത്’ എന്നിവ മൂലവാക്യത്തിലെ അധികാരവും കടപ്പാടും നിലനിർത്തുന്നു; ‘അടിമകൾ’ ദൃഷ്ടാന്തത്തിന്റെ സാമൂഹിക ശക്തി മൃദൂകരിക്കാതെ അവതരിപ്പിക്കുന്നു.
