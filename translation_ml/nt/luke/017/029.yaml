revisions:
- from: എന്നാൽ ലോത്ത് സൊദോമിൽനിന്ന് പുറപ്പെട്ട ദിവസം, ആകാശത്തുനിന്ന് തീയും ഗന്ധകവും[a] മഴയായി പെയ്ത് അവരെയെല്ലാം നശിപ്പിച്ചു.
  to: എന്നാൽ ലോത്ത് സൊദോമിൽനിന്ന് പുറപ്പെട്ട ദിവസം, സ്വർഗത്തിൽനിന്ന് തീയും ഗന്ധകവും പെയ്ത് അവരെയെല്ലാം നശിപ്പിച്ചു.
