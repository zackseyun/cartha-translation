id: LUK.17.29
reference: Luke 17:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: ml
  text: എന്നാൽ ലോത്ത് സൊദോമിൽനിന്ന് പുറപ്പെട്ട ദിവസം, സ്വർഗത്തിൽനിന്ന് തീയും ഗന്ധകവും പെയ്ത് അവരെയെല്ലാം നശിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: എന്നാൽ ... ദിവസം
  rationale: ഈ ദത്തിവ് ബന്ധപദപ്രയോഗം ‘പുറപ്പെട്ട ദിവസം’ എന്ന കാലസൂചന നൽകുന്നു. δέ മുൻവാക്യത്തോടുള്ള നേരിയ വൈരുധ്യം/തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ട
  rationale: ലോത്ത് നഗരത്തിനകത്തുനിന്ന് പുറത്തേക്കു പോയെന്ന മൂർത്തമായ ചലനാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Λὼτ
  choice: ലോത്ത്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: ἀπὸ Σοδόμων
  choice: സൊദോമിൽനിന്ന്
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ഏകവചനമായി സ്വാഭാവികമായി നൽകി; ἀπόയുടെ വേർപാട്/ഉത്ഭവസ്ഥലാർഥം ‘-ൽനിന്ന്’ വ്യക്തമാക്കുന്നു.
- source_word: ἔβρεξεν
  choice: മഴയായി പെയ്ത്
  rationale: ഗ്രീക്കിൽ ക്രിയ കർത്താവിനെ വ്യക്തമാക്കാതെ ഉപയോഗിച്ചിരിക്കുന്നു. ദൈവത്തെ പ്രകടമായ കർത്താവായി ചേർക്കാതെ, തീയും ഗന്ധകവും മഴപോലെ പെയ്തുവെന്ന ദൃശ്യാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πῦρ καὶ θεῖον
  choice: തീയും ഗന്ധകവും
  rationale: θεῖον എന്നത് ഗന്ധകത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ, നേരിട്ടുള്ള പദമാണ് ‘ഗന്ധകം’; പരമ്പരാഗത പദപ്രയോഗം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: ἀπ’ οὐρανοῦ
  choice: ആകാശത്തുനിന്ന്
  rationale: οὐρανός ഇവിടെ മുകളിൽനിന്നുള്ള മഴപെയ്യലിന്റെ ദൃശ്യസന്ദർഭത്തിലാണ്. മലയാളത്തിൽ ‘ആകാശത്തുനിന്ന്’ സ്വാഭാവികവും മൂലപാഠത്തിലെ സ്ഥലാർഥം കൃത്യമായി നിലനിർത്തുന്നതുമാണ്; ‘സ്വർഗത്തിൽനിന്ന്’ എന്നും വിവർത്തനം ചെയ്യാം.
- source_word: ἀπώλεσεν πάντας
  choice: അവരെയെല്ലാം നശിപ്പിച്ചു
  rationale: πάντας എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ സന്ദർഭത്തിൽ സൂചിതമായ മനുഷ്യരെ ‘അവരെ’ എന്നു വ്യക്തമാക്കി; ἀπόλλυμι എന്ന ക്രിയയുടെ ന്യായവിധിസന്ദർഭത്തിലെ നേരിട്ടുള്ള അർഥം ‘നശിപ്പിച്ചു’ എന്നു നൽകി.
theological_decisions:
- issue: ന്യായവിധിയുടെ സന്ദർഭത്തിൽ θεῖον എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഗന്ധകം
  alternative: ഗന്ധകക്കല്ല്
  rationale: ‘ഗന്ധകം’ മൂലപദത്തിന്റെ സാധാരണ രാസവസ്തു-അർഥം വ്യക്തവും ആധുനികവുമായ ഭാഷയിൽ നൽകുന്നു. പരമ്പരാഗത രൂപം വായനക്കാരുടെ പരിചയത്തിനായി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: οὐρανός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ആകാശം
  alternative: സ്വർഗം
  rationale: മഴപെയ്യുന്നതിനെ വിവരിക്കുന്ന ഈ വാക്യത്തിൽ ‘ആകാശം’ മലയാളത്തിൽ ഏറ്റവും സ്വാഭാവികമായ സ്ഥലസൂചനയാണ്. അതേസമയം സംഭവം ദൈവിക ന്യായവിധിയാണെന്ന സന്ദർഭത്തെ ഇത് നിഷേധിക്കുന്നില്ല; മൂലപദത്തിൽ സാധ്യമായ ‘സ്വർഗം’ എന്ന വായനയും അംഗീകരിക്കുന്നു.
- issue: ἔβρεξεν, ἀπώλεσεν എന്നീ ഏകവചന ക്രിയകളുടെ സൂചിത കർത്താവ്
  choice: കർത്താവിനെ പ്രത്യേകം ചേർക്കാതെ സംഭവക്രമമായി വിവർത്തനം ചെയ്തു
  alternative: ദൈവം തീയും ഗന്ധകവും പെയ്യിച്ച് എല്ലാവരെയും നശിപ്പിച്ചു
  rationale: ഗ്രീക്ക് വാക്യം ദൈവത്തെ പേരെടുത്ത് കർത്താവായി പറയുന്നില്ല. അതിനാൽ ഉല്പത്തി പശ്ചാത്തലം വിശദീകരണമായി പാഠത്തിലേക്ക് ചേർക്കാതെ, മൂലത്തിലെ സൂചിതത്വം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘എന്നാൽ’ നേരിയ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ‘മഴയായി പെയ്ത്’ ദൃശ്യബിംബം നിലനിർത്തുന്നു. ദൈവത്തെ മൂലപാഠത്തിൽ ഇല്ലാത്ത പ്രകടമായ കർത്താവായി ചേർത്തിട്ടില്ല.
