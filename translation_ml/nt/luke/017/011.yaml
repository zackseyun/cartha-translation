id: LUK.17.11
reference: Luke 17:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: ml
  text: അങ്ങനെ, അവൻ യെരൂശലേമിലേക്കു പോകുമ്പോൾ ശമര്യയ്ക്കും ഗലീലയ്ക്കും ഇടയിലൂടെ[a] കടന്നുപോകുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശമര്യയുടെയും ഗലീലയുടെയും മധ്യത്തിലൂടെ.’ ഈ ഗ്രീക്ക് പ്രയോഗം രണ്ടു പ്രദേശങ്ങൾക്കിടയിലൂടെയുള്ള സഞ്ചാരമെന്നോ അവയെ വേർതിരിക്കുന്ന അതിർത്തിപ്രദേശത്തിലൂടെയുള്ള സഞ്ചാരമെന്നോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: അങ്ങനെ
  rationale: ലൂക്കോസിന്റെ സംഭവവിവരണത്തിന് തുടക്കം കുറിക്കുന്ന സൂത്രപ്രയോഗം. അക്ഷരാർഥത്തിലുള്ള ‘സംഭവിച്ചു’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ആഖ്യാനബന്ധം പ്രകടമാക്കുന്നു.
- source_word: ἐν τῷ πορεύεσθαι
  choice: പോകുമ്പോൾ
  rationale: ἐν സഹിതമുള്ള articular infinitive ഒരേസമയം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പോകുമ്പോൾ’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിലേക്ക്
  rationale: εἰς ഇവിടെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: αὐτός
  choice: അവൻ
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം വ്യക്തമായി നൽകിയിട്ടുണ്ടെങ്കിലും ഇവിടെ ‘അവൻതന്നെ’ എന്നു ശക്തിപ്പെടുത്തേണ്ടതില്ല.
- source_word: διήρχετο
  choice: കടന്നുപോകുകയായിരുന്നു
  rationale: Imperfect രൂപം തുടരുന്ന സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പുരോഗമനരൂപം ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: διὰ μέσον
  choice: ഇടയിലൂടെ
  rationale: രണ്ട് പ്രദേശങ്ങളുടെ ഇടയിലൂടെയോ അവയുടെ അതിർത്തിപ്രദേശത്തിലൂടെയോ ഉള്ള സഞ്ചാരം എന്ന സാധ്യത സ്വാഭാവികമായി നൽകുന്നു; പ്രയോഗത്തിന്റെ സ്ഥലപരമായ അവ്യക്തത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Σαμαρείας καὶ Γαλιλαίας
  choice: ശമര്യയ്ക്കും ഗലീലയ്ക്കും
  rationale: മൂലത്തിലെ സ്ഥലനാമക്രമം നിലനിർത്തുകയും മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപങ്ങൾ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
