  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· ⸀Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν; οἱ δὲ ἐννέα ποῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു മറുപടിയായി പറഞ്ഞു: “ആ പത്തുപേർ ശുദ്ധരാക്കപ്പെട്ടില്ലയോ?[a] എന്നാൽ ആ ഒൻപതുപേർ എവിടെ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ആ പത്തുപേർ ശുദ്ധീകരിക്കപ്പെട്ടില്ലയോ?”'
    reason: καθαρίζω എന്ന പദത്തിന് മലയാളത്തിൽ സാധ്യമായ കൂടുതൽ ഔപചാരികമായ പദവികൽപം നൽകുന്നു.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: അപ്പോൾ യേശു പറഞ്ഞു
  rationale: ἀποκριθεὶς ... εἶπεν എന്നത് വാക്കുകൾ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗമാണ്. സന്ദർഭത്തിലെ പ്രതികരണവും δέ സൂചിപ്പിക്കുന്ന കഥാപുരോഗതിയും ‘അപ്പോൾ’ എന്നതിലൂടെ സ്വാഭാവികമായി വരുന്നു; ‘മറുപടി പറഞ്ഞു’ എന്നു നിർബന്ധിച്ച് ആവർത്തനം സൃഷ്ടിക്കുന്നില്ല.
- source_word: Οὐχὶ
  choice: '...ഇല്ലയോ?'
  rationale: οὐχί അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്. മലയാളത്തിലെ നിഷേധചോദ്യരൂപമായ ‘ഇല്ലയോ?’ അതേ പ്രതീക്ഷ നിലനിർത്തുന്നു.
- source_word: οἱ δέκα
  choice: ആ പത്തുപേർ
  rationale: നിശ്ചയാർഥക ലേഖനത്തോടുകൂടിയ സംഖ്യ സന്ദർഭത്തിൽ മുമ്പേ പരാമർശിച്ച പത്തുപേരെ സൂചിപ്പിക്കുന്നു. ‘ആ പത്തുപേർ’ ഇത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ പ്രകടമല്ലാത്ത ‘എല്ലാവരും’ എന്ന ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: ἐκαθαρίσθησαν
  choice: ശുദ്ധരാക്കപ്പെട്ടില്ലയോ
  rationale: καθαρίζωയുടെ കർമ്മണിപ്രയോഗം രോഗമുക്തിയോടൊപ്പം ശുദ്ധതയുടെ ആശയവും വഹിക്കുന്നു. ‘ശുദ്ധരാക്കപ്പെട്ടു’ ഈ രണ്ടുതലങ്ങളെയും നിലനിർത്തുകയും ‘സൗഖ്യം പ്രാപിച്ചു’ എന്ന ശാരീരിക അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: എന്നാൽ ആ ഒൻപതുപേർ എവിടെ?
  rationale: രണ്ടാമത്തെ δέ മടങ്ങിവന്ന ഒരാളും ശേഷിച്ച ഒൻപതുപേരും തമ്മിലുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു. ‘എന്നാൽ’ ആ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ποῦയുടെ നേരിട്ടുള്ള സ്ഥലചോദ്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുഷ്ഠരോഗികളുടെ കാര്യത്തിൽ καθαρίζω എന്ന പദത്തിന്റെ അർഥം
  choice: ‘സൗഖ്യം പ്രാപിച്ചു’ എന്നതിനു പകരം ‘ശുദ്ധരാക്കപ്പെട്ടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: സൗഖ്യം പ്രാപിച്ചു; ശുദ്ധീകരിക്കപ്പെട്ടു
  rationale: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന καθαρίζω രോഗത്തിൽനിന്നുള്ള വിടുതലിനെയും ആചാരപരമായ ശുദ്ധിയെയും ഒരുമിച്ച് സൂചിപ്പിക്കാൻ കഴിയും. ‘ശുദ്ധരാക്കപ്പെട്ടു’ ഈ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ ശൈലി. അലങ്കാരചോദ്യങ്ങളുടെ ചുരുക്കവും മൂർച്ചയും നിലനിർത്തിയിരിക്കുന്നു; ‘ആ’ എന്ന നിർദ്ദേശകം മുമ്പ് പറഞ്ഞ സംഘങ്ങളെ തിരിച്ചറിയിക്കുന്നു.
