revisions:
- from: ആ ദിവസം, വീടിന്റെ മട്ടുപ്പാവിലിരിക്കുന്നവൻ—അവന്റെ സാധനങ്ങൾ വീടിനകത്തുണ്ടെങ്കിലും—അവ എടുക്കാൻ താഴേക്ക് ഇറങ്ങരുത്; അതുപോലെ, വയലിലുള്ളവൻ പിന്നിലുള്ളവയിലേക്കു തിരിഞ്ഞുപോകരുത്.[a][b]
  to: ആ ദിവസം, വീടിന്റെ മട്ടുപ്പാവിൽ[b] ഉള്ളവൻ വീട്ടിലുള്ള തന്റെ സാധനങ്ങൾ എടുക്കാൻ താഴേക്ക് ഇറങ്ങരുത്; അതുപോലെ, വയലിലുള്ളവൻ പിന്നിലേക്കു മടങ്ങിപ്പോകരുത്.[a]
  rationale: കൂട്ടിച്ചേർക്കൽ സ്വഭാവമുള്ള ഗ്രീക്ക് വാക്യഘടനയെ concessive ആക്കാതിരിക്കാൻ ‘വീട്ടിലുള്ള തന്റെ സാധനങ്ങൾ’ എന്നു പരിഷ്കരിച്ചു. εἰς τὰ ὀπίσω-യുടെ മടങ്ങിപ്പോകൽ/പിന്നിലേക്കുള്ള ദിശാസൂചന സ്വാഭാവിക മലയാളത്തിൽ ‘പിന്നിലേക്കു മടങ്ങിപ്പോകരുത്’ എന്നു നൽകി; പിന്നിൽ വിട്ടുപോയ വസ്തുക്കളെക്കുറിച്ചുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി. സാംസ്കാരിക കുറിപ്പിന്റെ ആങ്കർ ‘മട്ടുപ്പാവ്’ എന്ന പദത്തിലേക്കു മാറ്റി.
