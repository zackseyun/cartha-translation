id: LUK.17.31
reference: Luke 17:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: ml
  text: ആ ദിവസം, വീടിന്റെ മട്ടുപ്പാവിൽ[b] ഉള്ളവൻ വീട്ടിലുള്ള തന്റെ സാധനങ്ങൾ എടുക്കാൻ താഴേക്ക് ഇറങ്ങരുത്; അതുപോലെ, വയലിലുള്ളവൻ പിന്നിലേക്കു മടങ്ങിപ്പോകരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമാക്കിക്കൊണ്ട്: “പിന്നിൽ വിട്ടുപോയവയ്ക്കായി മടങ്ങിപ്പോകരുത്.”'
    reason: lexical_alternative
  - marker: b
    text: “മട്ടുപ്പാവ്” എന്നത് അന്നത്തെ വീടുകളിൽ ആളുകൾക്ക് കയറിച്ചെല്ലാനും ഉപയോഗിക്കാനും കഴിയുമായിരുന്ന പരന്ന മേൽക്കൂരയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ആ ദിവസം
  rationale: കാലസൂചകമായ ഗ്രീക്ക് പ്രയോഗത്തെയും ἐκείνῃ എന്ന നിർദേശക ഊന്നലിനെയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὃς ἔσται ἐπὶ τοῦ δώματος
  choice: വീടിന്റെ മട്ടുപ്പാവിലിരിക്കുന്നവൻ
  rationale: δώμα ഇവിടെ ആളുകൾക്ക് കയറിച്ചെല്ലാനും ഉപയോഗിക്കാനും കഴിയുന്ന പരന്ന മേൽക്കൂരയെ സൂചിപ്പിക്കുന്നു; ഭാവികാലരൂപത്തിന്റെ പൊതുവത്കരണശക്തി മലയാളത്തിലെ പങ്കാളിത്തരൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ σκεύη αὐτοῦ
  choice: അവന്റെ സാധനങ്ങൾ
  rationale: σκεύη എന്നത് ഇവിടെ വീട്ടിനകത്തുള്ള കൊണ്ടുപോകാവുന്ന വസ്തുക്കളെയോ ഉടമസ്ഥവസ്തുക്കളെയോ വിശാലമായി സൂചിപ്പിക്കുന്നു; ‘സാധനങ്ങൾ’ അതിനെ അമിതവ്യാഖ്യാനമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: μὴ καταβάτω ἆραι αὐτά
  choice: അവ എടുക്കാൻ താഴേക്ക് ഇറങ്ങരുത്
  rationale: മൂന്നാംപുരുഷ നിരോധനാജ്ഞയുടെ അടിയന്തരത ‘ഇറങ്ങരുത്’ സംരക്ഷിക്കുന്നു; αἴρωയുടെ സന്ദർഭസൂചന ‘എടുക്കാൻ’ എന്നതിൽ സ്വാഭാവികമായി വരുന്നു.
- source_word: ὁ ἐν ἀγρῷ ὁμοίως
  choice: അതുപോലെ, വയലിലുള്ളവൻ
  rationale: രണ്ടാമത്തെ വ്യക്തിയെയും ആദ്യത്തേതിനോടു സമാന്തരമായി അവതരിപ്പിക്കുകയും ὁμοίως എന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: പിന്നിലുള്ളവയിലേക്കു തിരിഞ്ഞുപോകരുത്
  rationale: ἐπιστρέφωയുടെ മടങ്ങിപ്പോകൽ/തിരിയൽ അർഥവും substantival τὰ ὀπίσωയുടെ ‘പിന്നിലുള്ള കാര്യങ്ങൾ’ എന്ന വസ്തുസൂചനയും നിലനിർത്തുന്നു; വെറും ‘തിരിഞ്ഞുപോകരുത്’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: അന്ത്യകാല അടിയന്തരതയുടെ ദൃശ്യാവിഷ്കാരം
  choice: താഴേക്ക് ഇറങ്ങാതിരിക്കുകയും പിന്നിലുള്ളവയിലേക്കു തിരിയാതിരിക്കുകയും ചെയ്യാനുള്ള മൂർത്തമായ കല്പനകൾ അതേപടി നിലനിർത്തി.
  alternative: സ്വത്തുക്കളോടുള്ള ആസക്തി ഉപേക്ഷിക്കണമെന്ന പൊതുവായ ആത്മീയ ഉപദേശമായി പരാവർത്തനം ചെയ്യുക.
  rationale: വാക്യം ‘ആ ദിവസം’ എന്ന സന്ദർഭത്തിൽ വ്യക്തമായ പ്രവർത്തനദൃശ്യങ്ങളാണ് നൽകുന്നത്. അവയെ പൊതുവായ ധാർമികസന്ദേശമാക്കുന്നത് മൂലപാഠത്തിനപ്പുറമുള്ള വ്യാഖ്യാനം ചേർക്കും.
- issue: εἰς τὰ ὀπίσω എന്ന പ്രയോഗത്തിന്റെ വസ്തുസൂചന
  choice: ‘പിന്നിലുള്ളവയിലേക്കു’ എന്ന് വിവർത്തനം ചെയ്തു.
  alternative: ‘പിന്നോട്ടു തിരിയരുത്’ എന്നു മാത്രം നൽകുക.
  rationale: τὰ ὀπίσωയിൽ വ്യാകരണപരമായി നിലനിൽക്കുന്ന ‘പിന്നിലുള്ളവ/കാര്യങ്ങൾ’ എന്ന സാധ്യത സംരക്ഷിക്കുകയും, പിന്നിൽ ഉപേക്ഷിച്ച വസ്തുക്കളെ സൂചിപ്പിക്കാമെന്ന അർഥതുറവ് അടയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. ‘മട്ടുപ്പാവ്’ സാംസ്കാരിക ദൃശ്യം കൃത്യമായി നൽകുന്നു; ദീർഘവാക്യത്തിലെ ബന്ധങ്ങൾ ഡാഷുകളും വിരാമചിഹ്നങ്ങളും ഉപയോഗിച്ച് വ്യക്തമാക്കിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
