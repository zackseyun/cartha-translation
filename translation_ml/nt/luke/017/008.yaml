  to: 'മറിച്ച്, അവൻ അയാളോട് ഇങ്ങനെ പറയുകയല്ലേ ചെയ്യുക: ‘എനിക്ക് അത്താഴം ഒരുക്കുക; അരമുറുക്കി[a], ഞാൻ തിന്നുകയും കുടിക്കുകയും ചെയ്തുകഴിയുന്നതുവരെ എന്നെ പരിചരിക്കുക. അതിനുശേഷം നീ തിന്നുകയും കുടിക്കുകയും ചെയ്യും’?”'
  rationale: The revision corrects the final future statement, makes the completed endpoint of the ἕως clause explicit in natural Malayalam, and uses a contextually clear term for table service. The cultural note remains anchored to ‘അരമുറുക്കി’; footnote b is removed because its content is now represented directly in the main text.
