id: LUK.17.8
reference: Luke 17:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: ml
  text: 'മറിച്ച്, അവൻ അയാളോട് ഇങ്ങനെ പറയുകയല്ലേ ചെയ്യുക: ‘എനിക്ക് അത്താഴം ഒരുക്കുക; അരമുറുക്കി[a], ഞാൻ തിന്നുകയും കുടിക്കുകയും ചെയ്തുകഴിയുന്നതുവരെ എന്നെ പരിചരിക്കുക. അതിനുശേഷം നീ തിന്നുകയും കുടിക്കുകയും ചെയ്യും’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സേവനത്തിനായി വസ്ത്രം അരയിൽ കെട്ടിയൊതുക്കി.’ അക്ഷരാർഥത്തിൽ ‘അരമുറുക്കി’; ജോലി ചെയ്യാൻ നീണ്ട വസ്ത്രം അരയിൽ കെട്ടിയൊതുക്കുന്ന പതിവിനെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: മറിച്ച് ... പറയുകയല്ലേ ചെയ്യുക
  rationale: ἀλλάയുടെ വൈരുധ്യബലവും അനുകൂല ഉത്തരമാണ് പ്രതീക്ഷിക്കുന്ന οὐχίയോടുകൂടിയ അലങ്കാരചോദ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐρεῖ αὐτῷ
  choice: അവൻ അയാളോട് ... പറയുക
  rationale: λέγωയുടെ അടിസ്ഥാനാർഥമായ ‘പറയുക’യും αὐτῷ എന്ന പരോക്ഷകർമ്മവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: എനിക്കു അത്താഴം ഒരുക്കുക
  rationale: τί δειπνήσω എന്നത് അത്താഴത്തിനായി ഭക്ഷണം ഒരുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ചുരുക്കവും സ്വാഭാവികവുമായ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: περιζωσάμενος
  choice: അരമുറുക്കി
  rationale: ജോലിക്കായി നീണ്ട വസ്ത്രം അരയിൽ കെട്ടിയൊതുക്കുന്ന പുരാതന പ്രവൃത്തിയുടെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: διακόνει μοι
  choice: എന്നെ ശുശ്രൂഷിക്കുക
  rationale: ഇവിടെ മേശയ്ക്കരികിലെ വ്യക്തിഗത സേവനമാണ് ഉദ്ദേശ്യം. ‘ശുശ്രൂഷിക്കുക’ മാന്യവും സന്ദർഭോചിതവുമാണ്; സഭാപദവിയെന്ന അർഥം ഇവിടെ ചുമത്തുന്നില്ല.
- source_word: ἕως φάγω καὶ πίω
  choice: ഞാൻ തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്നതുവരെ
  rationale: ἕωςയോടുകൂടിയ അഓറിസ്റ്റ് സബ്ജങ്ക്റ്റീവുകൾ യജമാനന്റെ ഭക്ഷണപാനം പൂർത്തിയാകുന്നതുവരെയുള്ള പരിധി നൽകുന്നു. മലയാളത്തിലെ ഈ രൂപം സമയപരിധി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μετὰ ταῦτα
  choice: അതിനുശേഷം
  rationale: കാലക്രമം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: φάγεσαι καὶ πίεσαι σύ
  choice: നീ തിന്നുകയും കുടിക്കുകയും ചെയ്യുക
  rationale: രൂപത്തിൽ ഭാവികാലമാണെങ്കിലും നേരിട്ടുള്ള നിർദേശത്തിന്റെ തുടർച്ചയിൽ മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമാണ്; പ്രസക്തമായ σύയുടെ ഊന്നൽ ‘നീ’ എന്നത് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ സാമൂഹികസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന നാമം
  choice: ഈ വാക്യത്തിൽ ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ദാസൻ’ അല്ലെങ്കിൽ ‘അടിമ’ എന്ന നാമം ചേർക്കാതെ സർവനാമങ്ങളും കല്പനകളും നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: മുൻവാക്യത്തിന്റെ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘ആ ദാസനോട്’ എന്നു വികസിപ്പിക്കുക.
  rationale: ഈ വാക്യം തന്നെ αὐτῷ എന്ന സർവനാമം മാത്രമാണ് ഉപയോഗിക്കുന്നത്. ചുറ്റുപാടിലുള്ള δοῦλος എന്ന പരാമർശം ഇവിടെ ആവർത്തിച്ച് ചേർക്കാതെ മൂലപാഠത്തിന്റെ പരോക്ഷതയും യജമാനൻ–ദാസൻ ബന്ധത്തിന്റെ സന്ദർഭവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- issue: ἕως φάγω καὶ πίωയിലെ പ്രവർത്തിയുടെ പൂർത്തീകരണം
  choice: ‘ഞാൻ തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്നതുവരെ’ എന്നു വിവർത്തനം ചെയ്ത്, ദാസന്റെ അവസരം അതിനുശേഷമാണെന്ന ക്രമം നിലനിർത്തി.
  alternative: പൂർത്തീകരണഭാവം കൂടുതൽ തുറന്നുകാട്ടാൻ ‘ഞാൻ തിന്നുകയും കുടിക്കുകയും ചെയ്തുകഴിയുന്നതുവരെ’ എന്നു നൽകുക.
  rationale: ഗ്രീക്ക് രൂപം സമയപരിധിയും പ്രവർത്തിയുടെ അവസാനബിന്ദുവും സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിലെ സ്വാഭാവിക മലയാളത്തോടൊപ്പം അടിക്കുറിപ്പ് കൂടുതൽ പ്രകടമായ പൂർത്തീകരണവായന നൽകുന്നു; അനാവശ്യമായ വ്യാഖ്യാനനിർണ്ണയം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. അലങ്കാരചോദ്യത്തിന്റെ പ്രതീക്ഷിത അനുകൂല ഉത്തരം ‘പറയുകയല്ലേ ചെയ്യുക’ എന്ന രൂപത്തിൽ പ്രകടമാക്കി. പുരാതന വസ്ത്രധാരണചിത്രം ‘അരമുറുക്കി’ എന്നതിലൂടെ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
