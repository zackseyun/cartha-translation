base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: ml
  text: 'അവർ ശബ്ദമുയർത്തി[a] പറഞ്ഞു: “യേശുവേ, ഗുരുനാഥാ[b], ഞങ്ങളോടു കരുണ കാണിക്കണമേ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ശബ്ദം ഉയർത്തി.”'
    reason: lexical_alternative
  - marker: b
    text: “ഗുരുനാഥാ” എന്നത് അധികാരമുള്ള ഒരാളെ അഭിസംബോധന ചെയ്യാൻ ഉപയോഗിക്കുന്ന ഗ്രീക്ക് epistata എന്ന പദത്തിന്റെ വിവർത്തനമാണ്; ഇത് സാധാരണയായി “കർത്താവ്” എന്നു വിവർത്തനം ചെയ്യുന്ന kyrios എന്ന പദമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അവർ… പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സാധാരണ സംയോജകമായ καὶ ഇവിടെ മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹത്തിൽ പ്രത്യേക പദമായി വിവർത്തനം ചെയ്യാതെ വാക്യബന്ധത്തിലൂടെ പ്രകടമാക്കുന്നു; ‘അപ്പോൾ’ എന്ന അധിക കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: αὐτοὶ
  choice: അവർ
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന കർത്തൃസർവനാമം നിലനിർത്തുന്നു; ‘അവർതന്നെ’ എന്നു പറയുന്നത് മലയാളത്തിൽ സന്ദർഭം ആവശ്യപ്പെടാത്ത അധിക ഊന്നൽ നൽകും.
- source_word: ἦραν φωνὴν
  choice: ശബ്ദമുയർത്തി
  rationale: ‘ശബ്ദം ഉയർത്തുക’ എന്ന മൂലചിത്രം കാത്തുകൊണ്ട് ഉച്ചത്തിൽ വിളിച്ചതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്ക് വർത്തമാന കൃദന്തരൂപം മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ സമാപികാക്രിയയായി നൽകുന്നു.
- source_word: Ἰησοῦ
  choice: യേശുവേ
  rationale: സം‌ബോധനരൂപം മലയാളത്തിലെ ‘-വേ’ പ്രത്യയത്തോടെ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἐπιστάτα
  choice: ഗുരുനാഥാ
  rationale: അധികാരവും നേതൃത്വവും ഉള്ള ഒരാളെ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്ന പദമായി നൽകുന്നു; κύριος എന്ന സാധാരണ ‘കർത്താവ്’ പദവുമായി ഇത് കലർത്തുന്നില്ല.
- source_word: ἐλέησον
  choice: കരുണ കാണിക്കണമേ
  rationale: കരുണാപൂർവമായ സഹായത്തിനായുള്ള അടിയന്തര അഭ്യർഥന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἡμᾶς
  choice: ഞങ്ങളോടു
  rationale: ‘കരുണ കാണിക്കുക’ എന്ന മലയാള പ്രയോഗത്തോടു ചേരുന്ന രീതിയിൽ ഗ്രീക്കിലെ കർമബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിനുള്ള ἐπιστάτα എന്ന സംബോധനയുടെ വിവർത്തനം
  choice: ഗുരുനാഥാ
  alternative: കർത്താവേ
  rationale: ഇവിടെ ഗ്രീക്ക് പദം ἐπιστάτης ആണ്, κύριος അല്ല. അതിനാൽ ‘കർത്താവേ’ എന്നു നൽകിയാൽ മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേക ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം വരാനും രണ്ടുപദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം മങ്ങാനും ഇടയുണ്ട്. ‘ഗുരുനാഥാ’ ആദരവും അധികാരവും സൂചിപ്പിക്കുമ്പോൾ ആ വ്യത്യാസം കാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ വേദപാഠത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. അഭ്യർഥനയുടെ ആദരവും അടിയന്തരതയും ‘ണമേ’ രൂപത്തിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
