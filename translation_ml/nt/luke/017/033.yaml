  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: ml
  text: തന്റെ ജീവൻ കാത്തുസൂക്ഷിക്കാൻ ശ്രമിക്കുന്നവൻ അതു നഷ്ടപ്പെടുത്തും; എന്നാൽ അതു നഷ്ടപ്പെടുത്തുന്നവൻ അതിനെ ജീവനോടെ കാത്തുസൂക്ഷിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജീവൻ’ എന്നതിന് ‘ആത്മാവ്’ എന്നും പരിഭാഷപ്പെടുത്താം; എങ്കിലും ഗ്രീക്കിലെ ψυχή ഇവിടെ ശരീരത്തിൽനിന്നു വേറിട്ട ആത്മാവിനെക്കാൾ ഒരാളുടെ ജീവൻ അല്ലെങ്കിൽ സ്വയം എന്ന അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: ശ്രമിക്കുന്നവൻ
  rationale: ഇവിടെ ζητέω വെറും ആഗ്രഹമല്ല, ലക്ഷ്യബോധത്തോടെയുള്ള പരിശ്രമമാണ് സൂചിപ്പിക്കുന്നത്; ‘ശ്രമിക്കുക’ ആ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ψυχὴν
  choice: ജീവൻ
  rationale: ഈ സന്ദർഭത്തിൽ ψυχή ശരീരത്തിൽനിന്നു വേറിട്ട ആത്മാവിനെക്കാൾ ഒരാളുടെ ജീവൻ/സ്വയം എന്ന അർഥത്തിലാണ്; വാക്യത്തിലെ നഷ്ടപ്പെടൽ–ജീവനോടെ നിലനിർത്തൽ വൈരുധ്യത്തിനും ‘ജീവൻ’ യോജിക്കുന്നു.
- source_word: περιποιήσασθαι
  choice: കാത്തുസൂക്ഷിക്കാൻ
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ക്രിയ സ്വന്തം ജീവൻ സുരക്ഷിതമായി നിലനിർത്താനുള്ള ശ്രമത്തെ സൂചിപ്പിക്കുന്നു; ‘കാത്തുസൂക്ഷിക്കുക’ സ്വരക്ഷാപരമായ ഈ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: നഷ്ടപ്പെടുത്തും / നഷ്ടപ്പെടുത്തുന്നവൻ
  rationale: രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള ἀπόλλυμι ഒരേവിധം പരിഭാഷപ്പെടുത്തി മൂലത്തിലെ വിരോധാഭാസം നിലനിർത്തുന്നു.
- source_word: ζῳογονήσει
  choice: ജീവനോടെ നിലനിർത്തും
  rationale: സാധാരണ ‘രക്ഷിക്കുക’ എന്ന ക്രിയയല്ല ഇത്; ജീവിപ്പിക്കുക അഥവാ ജീവനോടെ സൂക്ഷിക്കുക എന്ന സുതാര്യമായ അർഥം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: …ചെയ്യുന്നവൻ …; എന്നാൽ …ചെയ്യുന്നവൻ
  rationale: സാർവത്രികമായ ഉപാധിബന്ധവും δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യവും സ്വാഭാവിക മലയാളഘടനയിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ψυχή എന്ന പദത്തിന്റെ അർഥം
  choice: ‘ജീവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ആത്മാവ്’
  rationale: സന്ദർഭം ജീവൻ നിലനിർത്താനോ നഷ്ടപ്പെടുത്താനോ ഉള്ള വിരോധാഭാസത്തെക്കുറിച്ചാണ്. ‘ആത്മാവ്’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ നിർബന്ധമില്ലാത്ത ശരീരം–ആത്മാവ് വിഭജനം സൂചിപ്പിക്കാം.
- issue: ζῳογονήσει എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: ‘ജീവനോടെ നിലനിർത്തും’
  alternative: ‘രക്ഷിക്കും’
  rationale: ക്രിയയുടെ സവിശേഷമായ ‘ജീവനോടെ സൂക്ഷിക്കുക/ജീവിപ്പിക്കുക’ എന്ന ഭാവം സംരക്ഷിക്കുകയും സാധാരണ ‘രക്ഷിക്കുക’ എന്ന ദൈവശാസ്ത്രപദത്തിലേക്ക് അതിനെ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ വിരോധാഭാസവും ‘നഷ്ടപ്പെടുത്തുക’–‘ജീവനോടെ നിലനിർത്തുക’ എന്ന പദസംഘർഷവും നിലനിർത്തിയിരിക്കുന്നു.
