revisions:
- from: കല്പിച്ചിരുന്നതെല്ലാം ചെയ്തതുകൊണ്ട് അവൻ ആ അടിമയോടു നന്ദി പറയുമോ?[a]
  to: ആ അടിമ കൽപ്പിക്കപ്പെട്ടതെല്ലാം ചെയ്തതുകൊണ്ട് യജമാനൻ അവനോടു നന്ദി പറയുമോ?[a]
  rationale: The revision makes the master, implicit in the Greek and clear from the preceding context, explicit in Malayalam to prevent an unintended pronoun-reference ambiguity. It also uses an explicit passive form for «the things commanded» and corrects the lexical-alternative footnote without changing the passage’s meaning or rhetorical force.
