id: LUK.17.9
reference: Luke 17:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ ⸂ἔχει χάριν⸃ τῷ ⸀δούλῳ ὅτι ἐποίησεν τὰ ⸀διαταχθέντα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: ml
  text: ആ അടിമ കൽപ്പിക്കപ്പെട്ടതെല്ലാം ചെയ്തതുകൊണ്ട് യജമാനൻ അവനോടു നന്ദി പറയുമോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘അടിമ’ എന്നതിന് ‘ദാസൻ’ അല്ലെങ്കിൽ ‘സേവകൻ’ എന്നും പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: δοῦλος).'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: പറയുമോ?
  rationale: μή സൂചകക്രിയയോടൊപ്പം നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ ചോദ്യം സന്ദർഭത്തിലൂടെ ‘ഇല്ല’ എന്ന പ്രതീക്ഷ വ്യക്തമാക്കുന്നു.
- source_word: ἔχει χάριν
  choice: നന്ദി പറയുക
  rationale: ἔχειν χάριν τινί എന്ന പ്രയോഗത്തിന് ഇവിടെ ഒരാളോടു നന്ദി തോന്നുക/പ്രകടിപ്പിക്കുക എന്ന അർഥമാണ്; ‘നന്ദി പറയുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: τῷ δούλῳ
  choice: ആ അടിമയോടു
  rationale: യജമാനന്റെ അധികാരത്തിനും കല്പനയ്ക്കും കീഴിലുള്ള ബന്ധിതസ്ഥിതി ഈ ഉപമയുടെ യുക്തിയിൽ പ്രധാനമായതിനാൽ ‘അടിമ’ സാമൂഹികവും വാഗ്‌പ്രയോഗപരവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: ചെയ്തതുകൊണ്ട്
  rationale: ὅτι ഇവിടെ നന്ദി പറയാനുള്ള സങ്കൽപ്പിത കാരണം അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-തുകൊണ്ട്’ കാരണബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐποίησεν
  choice: ചെയ്തു
  rationale: ποιέω ഇവിടെ നിർദേശിക്കപ്പെട്ട കാര്യങ്ങൾ നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ചെയ്യുക’ ലളിതവും കൃത്യവുമാണ്.
- source_word: τὰ διαταχθέντα
  choice: കല്പിച്ചിരുന്നതെല്ലാം
  rationale: നാമവൽക്കരിച്ച പൂർണകാല കർമണി പങ്കാളിത്തരൂപത്തിന്റെ ‘കല്പിക്കപ്പെട്ട കാര്യങ്ങൾ’ എന്ന അർഥം, കർമണി ഭാവവും മുൻകൂർ കല്പനയുടെ ആശയവും നിലനിർത്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉപമയിലെ യജമാനൻ–δοῦλος ബന്ധത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ / വേലക്കാരൻ
  rationale: വാക്യത്തിന്റെ യുക്തി കല്പന അനുസരിക്കാൻ ബാധ്യസ്ഥനായ കീഴാളന്റെ നിലയെ ആശ്രയിക്കുന്നു. ‘അടിമ’ അധികാരത്തിലെ അസമത്വവും പുരാതന സാമൂഹിക യാഥാർഥ്യവും മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു; പാദക്കുറിപ്പ് സാധ്യമായ മറ്റു പരിഭാഷകൾ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യം സ്വാഭാവിക ചോദ്യരൂപത്തിൽ നിലനിർത്തി; അടിമത്തബന്ധത്തിന്റെ കാഠിന്യം മയപ്പെടുത്തിയിട്ടില്ല.
