revisions:
- from: 'അതുപോലെതന്നെ[a], ലോത്തിന്റെ കാലത്തു സംഭവിച്ചതുപോലെ: അവർ തിന്നുകയും കുടിക്കുകയും വാങ്ങുകയും വിൽക്കുകയും നടുകയും പണിയുകയും ചെയ്തുകൊണ്ടിരുന്നു.'
  to: 'അതുപോലെതന്നെ[a], ലോത്തിന്റെ കാലത്ത് സംഭവിച്ചതുപോലെ: അവർ തിന്നുകയും കുടിക്കുകയും വാങ്ങുകയും വിൽക്കുകയും ചെടികൾ നട്ടുപിടിപ്പിക്കുകയും പണിയുകയും ചെയ്തുകൊണ്ടിരുന്നു.'
