reference: Luke 17:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളോടു പറയുന്നു: ആ രാത്രിയിൽ ഒരേ കിടക്കയിൽ രണ്ടുപേർ ഉണ്ടായിരിക്കും; ഒരാൾ കൊണ്ടുപോകപ്പെടും[a], മറ്റേയാൾ ഉപേക്ഷിക്കപ്പെടും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൂടെ കൊണ്ടുപോകപ്പെടും.’ παραλημφθήσεται എന്ന ക്രിയ, ഈ സന്ദർഭത്തിൽ ഈ കൊണ്ടുപോകൽ രക്ഷയ്ക്കായുള്ളതാണോ ന്യായവിധിക്കായുള്ളതാണോ എന്ന് സ്വയം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പിന്നിൽ ഉപേക്ഷിക്കപ്പെടും.’ ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത പിൽക്കാല അന്ത്യകാല ധാരണകൾ മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരാതിരിക്കാനാണ് ‘ഉപേക്ഷിക്കപ്പെടും’ എന്ന ചുരുക്കരൂപം ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടും ഊന്നലോടെയുമുള്ള അഭിസംബോധന നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: ταύτῃ τῇ νυκτί
  choice: ആ രാത്രിയിൽ
  rationale: ഒരു നിർദിഷ്ട രാത്രിയെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἔσονται δύο
  choice: രണ്ടുപേർ ഉണ്ടായിരിക്കും
  rationale: ഭാവികാല അർഥം നിലനിർത്തിക്കൊണ്ട് വ്യക്തികളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ κλίνης μιᾶς
  choice: ഒരേ കിടക്കയിൽ
  rationale: രാത്രിയുടെ സന്ദർഭത്തിൽ κλίνη എന്നത് ‘കിടക്ക’ എന്നു നൽകുന്നത് ഏറ്റവും സ്വാഭാവികം; μιᾶς സൂചിപ്പിക്കുന്ന പങ്കിട്ട ഒരേ കിടക്ക എന്ന ആശയവും വ്യക്തമാക്കുന്നു.
- source_word: ὁ εἷς
  choice: ഒരാൾ
  rationale: രണ്ടുപേരിൽ ഒരാളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള രൂപം.
- source_word: παραλημφθήσεται
  choice: കൊണ്ടുപോകപ്പെടും
  rationale: παραλαμβάνω എന്ന ക്രിയയുടെ ‘കൂടെ കൊണ്ടുപോകുക/എടുത്തുകൊണ്ടുപോകുക’ എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു; അത് രക്ഷയ്ക്കായാണോ ന്യായവിധിക്കായാണോ എന്ന് മുഖ്യപാഠം തീരുമാനിക്കുന്നില്ല.
- source_word: ὁ ἕτερος
  choice: മറ്റേയാൾ
  rationale: ആദ്യ വ്യക്തിയോടു വിരുദ്ധമായി രണ്ടാമത്തെ വ്യക്തിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: ἀφεθήσεται
  choice: വിട്ടേക്കപ്പെടും
  rationale: ഇവിടെ παραλημφθήσεται എന്നതിനോടുള്ള വിരുദ്ധതയിൽ ‘വിടുക’ എന്ന അർഥമാണ് യോജിക്കുന്നത്; ‘പിന്നിൽ’ എന്ന പദം ചേർക്കാതെ പിന്നീട് രൂപപ്പെട്ട അന്ത്യകാല വ്യാഖ്യാനബന്ധങ്ങൾ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: കൊണ്ടുപോകപ്പെടുന്നയാൾ രക്ഷിക്കപ്പെടുന്നവനോ ന്യായവിധിക്കായി കൊണ്ടുപോകപ്പെടുന്നവനോ എന്ന ചോദ്യം
  choice: ‘ഒരാൾ കൊണ്ടുപോകപ്പെടും, മറ്റേയാൾ വിട്ടേക്കപ്പെടും’ എന്ന നിഷ്പക്ഷ രൂപം
  alternative: കൊണ്ടുപോകപ്പെടുന്നയാൾ രക്ഷയ്ക്കായി സ്വീകരിക്കപ്പെടുന്നു; അല്ലെങ്കിൽ ന്യായവിധിക്കായി കൊണ്ടുപോകപ്പെടുന്നു
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് ക്രിയകൾ മാത്രം കൊണ്ടുപോകലിന്റെ ലക്ഷ്യം നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക അന്ത്യകാല വ്യവസ്ഥ പാഠത്തിൽ ചേർക്കാതെ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തരവിരുദ്ധ ഘടനയും ഭാവികാലവും നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ സ്ഥാനവൈരുധ്യം തിരുത്തി: παραλημφθήσεται-നോട് [a]യും ἀφεθήσεται-നോട് [b]യും ചേർത്തിരിക്കുന്നു.'
