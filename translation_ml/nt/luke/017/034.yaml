- from: 'ഞാൻ നിങ്ങളോടു പറയുന്നു: ആ രാത്രിയിൽ ഒരേ കിടക്കയിൽ രണ്ടുപേർ ഉണ്ടായിരിക്കും; ഒരാൾ കൊണ്ടുപോകപ്പെടും[a], മറ്റേയാൾ വിട്ടേക്കപ്പെടും[b].'
