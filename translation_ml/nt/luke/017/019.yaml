  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ἀναστὰς πορεύου· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “എഴുന്നേറ്റ് പോകുക; നിന്റെ വിശ്വാസം[b] നിന്നെ രക്ഷിച്ചിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിനക്കു സൗഖ്യം നൽകിയിരിക്കുന്നു” അല്ലെങ്കിൽ “നിന്നെ സുഖപ്പെടുത്തിയിരിക്കുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് രക്ഷിക്കുക, വിടുവിക്കുക, സൗഖ്യം നൽകുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വിശ്വാസം” അല്ലെങ്കിൽ “ആശ്രയം.” ഗ്രീക്ക് പദത്തിന് വിശ്വാസം, ആശ്രയം, വിശ്വസ്തത എന്നീ അർഥങ്ങൾ വരാമെങ്കിലും ഇവിടെ “വിശ്വാസം” എന്നതാണ് മുഖ്യപരിഭാഷ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: അവൻ അയാളോടു പറഞ്ഞു
  rationale: ഗ്രീക്ക് ആഖ്യാനത്തിലെ ലളിതമായ പ്രസ്താവന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിലുള്ള ശമര്യക്കാരനെയാണ് ‘അയാൾ’ സൂചിപ്പിക്കുന്നത്.
- source_word: Ἀναστὰς πορεύου
  choice: എഴുന്നേറ്റു പോകുക
  rationale: Ἀναστὰς എന്ന ക്രിയാവിശേഷണരൂപത്തിന്റെ ആജ്ഞാർഥശക്തിയും തുടർന്ന് വരുന്ന πορεύου എന്ന കല്പനയും സംക്ഷിപ്തവും മാന്യവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: πίστις എന്നതിന്റെ പതിവും വിശാലവുമായ മലയാള പരിഭാഷയാണ് ‘വിശ്വാസം’; ഈ സന്ദർഭത്തിൽ ‘ആശ്രയം’ എന്ന അർഥസാധ്യതയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: σέσωκέν σε
  choice: നിന്നെ രക്ഷിച്ചിരിക്കുന്നു
  rationale: σῴζω എന്ന ക്രിയയുടെ രക്ഷ, സൗഖ്യം, വിടുതൽ എന്നീ അർഥവ്യാപ്തികളിൽ വിശാലമായ ‘രക്ഷിച്ചു’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുന്നു. പൂർണകാലരൂപത്തിന്റെ നിലനിൽക്കുന്ന ഫലം ‘രക്ഷിച്ചിരിക്കുന്നു’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: രോഗശാന്തിയുടെ സന്ദർഭത്തിൽ σέσωκέν σε എന്നതിന്റെ അർഥം
  choice: നിന്നെ രക്ഷിച്ചിരിക്കുന്നു
  alternative: നിനക്കു സൗഖ്യം നൽകിയിരിക്കുന്നു / നിന്നെ സുഖപ്പെടുത്തിയിരിക്കുന്നു
  rationale: പത്തുപേരും ശുദ്ധരാക്കപ്പെട്ടെങ്കിലും ദൈവത്തെ മഹത്ത്വപ്പെടുത്താൻ മടങ്ങിവന്ന ഒരുവനോടാണ് ഈ വാക്ക് പറയുന്നത്. അതിനാൽ പ്രസ്താവനയെ ശരീരസൗഖ്യത്തിൽ മാത്രം ചുരുക്കാതെ രക്ഷയുടെയും സൗഖ്യത്തിന്റെയും അർഥപിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: πίστις എന്നതിന്റെ സന്ദർഭാർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം
  rationale: ഇവിടെ യേശുവിലുള്ള ആശ്രയമാണ് ഉദ്ദേശ്യമാകാൻ സാധ്യതയുള്ളത്; എങ്കിലും പതിവായ ദൈവശാസ്ത്രപരവും ഭാഷാപരവുമായ പദം ‘വിശ്വാസം’ ആയതിനാൽ അത് മുഖ്യപാഠത്തിൽ നിലനിർത്തി മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘എഴുന്നേറ്റു പോകുക’ എന്ന പ്രയോഗം മൂലത്തിലെ സംക്ഷിപ്ത ആജ്ഞാഭാവം കാത്തുസൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വ്യാഖ്യാനസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന വാക്യത്തിന്റെ അവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
