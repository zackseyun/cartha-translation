source:
  edition: SBLGNT
  text: οὐχ εὑρέθησαν ὑποστρέψαντες δοῦναι δόξαν τῷ θεῷ εἰ μὴ ὁ ἀλλογενὴς οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/018.yaml
  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: ml
  text: ഈ അന്യജാതിക്കാരനല്ലാതെ, ദൈവത്തിന് മഹത്ത്വം നൽകാൻ മടങ്ങിവന്ന മറ്റാരും ഇല്ലായിരുന്നോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മറ്റൊരു ജനതയിൽപ്പെട്ട ഈ മനുഷ്യൻ” അല്ലെങ്കിൽ “ഈ പരദേശി”; ഗ്രീക്ക് പദം മറ്റൊരു ജനവിഭാഗത്തിൽപ്പെട്ട, ഇസ്രായേലിന് പുറത്തുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: ആരെയും കണ്ടില്ലേ
  rationale: അയോറിസ്റ്റ് കർമണിപ്രയോഗത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ അസ്തിത്വാർഥമുള്ള വാചകരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; മൂലത്തിലെ വാഗ്‌ചോദ്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ὑποστρέψαντες
  choice: മടങ്ങിവന്ന
  rationale: തിരിച്ചുവരുന്ന പ്രവൃത്തി മഹത്ത്വം നൽകുന്നതിന് മുമ്പുള്ളതാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δοῦναι δόξαν
  choice: മഹത്ത്വം നൽകാൻ
  rationale: മൂലത്തിലെ സ്ഥിരപ്രയോഗമായ ‘മഹത്ത്വം നൽകുക’ എന്ന ആശയം ‘സ്തുതിക്കുക’ എന്നു ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിന്
  rationale: ഗ്രീക്ക് ദത്തിവിന്റെ ലക്ഷ്യാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: ഒഴിവാക്കൽ സൂചിപ്പിക്കുന്ന ഈ ഘടനയ്ക്ക് ചുരുക്കവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: ἀλλογενής
  choice: അന്യജാതിക്കാരൻ
  rationale: മറ്റൊരു ജനവിഭാഗത്തിൽപ്പെട്ടവൻ, ഇസ്രായേലിന് പുറത്തുള്ളവൻ എന്ന സാമൂഹിക-വംശീയ അർഥം വ്യക്തമാക്കുന്നു; വെറും അപരിചിതൻ എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: οὗτος
  choice: ഈ
  rationale: ‘ഈ അന്യജാതിക്കാരൻ’ എന്ന മൂലത്തിലെ നിർദ്ദേശക ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സൗഖ്യം ലഭിച്ച മനുഷ്യന്റെ വംശീയ-മതപരമായ പുറത്തുള്ളവൻ എന്ന സ്ഥാനം
  choice: ഈ അന്യജാതിക്കാരൻ
  alternative: ഈ പരദേശി; മറ്റൊരു ജനതയിൽപ്പെട്ട ഈ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ ആ മനുഷ്യൻ ശമര്യക്കാരനാണെങ്കിലും ഈ വാക്യത്തിലെ പദം വിശാലമായി മറ്റൊരു ജനവിഭാഗത്തിൽപ്പെട്ടവനെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘ശമര്യക്കാരൻ’ എന്ന് ഇവിടെ ചേർക്കാതെ മൂലത്തിലെ വൈരുധ്യവും ഊന്നലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആദരപൂർവ മലയാളം. വാഗ്‌ചോദ്യവും ‘ദൈവത്തിന് മഹത്ത്വം നൽകുക’ എന്ന ബൈബിൾ പ്രയോഗവും നിലനിർത്തിയിരിക്കുന്നു.
