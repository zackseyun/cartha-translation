id: LUK.17.26
reference: Luke 17:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: ml
  text: നോഹയുടെ നാളുകളിൽ സംഭവിച്ചതുപോലെതന്നെ, മനുഷ്യപുത്രന്റെ[a] നാളുകളിലും അങ്ങനെ ആയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യനായവൻ.” “മനുഷ്യപുത്രൻ” എന്നു പരമ്പരാഗതമായി പരിഭാഷപ്പെടുത്തുന്ന ഗ്രീക്ക് ശീർഷകം ദാനീയേൽ 7-നെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം; അതിന്റെ സ്ഥാപിതമായ മിശിഹാ-അന്ത്യകാല അനുരണനം നിലനിർത്താനാണ് ഈ രൂപം ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: സംഭവിച്ചതുപോലെതന്നെ
  rationale: തുടർന്നുവരുന്ന οὕτως എന്ന താരതമ്യപദവുമായി ചേർന്ന് ശക്തമായ താരതമ്യം അവതരിപ്പിക്കുന്നു; ‘പോലെതന്നെ’ അത് സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐγένετο
  choice: സംഭവിച്ചത്
  rationale: നോഹയുടെ കാലത്ത് നടന്ന കാര്യങ്ങളെ സൂചിപ്പിക്കുന്ന സംഭവാത്മക അർഥം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: നോഹയുടെ നാളുകളിൽ
  rationale: ഗ്രീക്കിലെ കാലസൂചക പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ രൂപം.
- source_word: οὕτως
  choice: അങ്ങനെ
  rationale: καθὼς ആരംഭിച്ച താരതമ്യത്തിന്റെ മറുപകുതി അടയാളപ്പെടുത്തുന്നു.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: ഗ്രീക്കിലെ ഭാവികാല ക്രിയയുടെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘സംഭവിക്കും’ എന്നു ആവർത്തിച്ച് വ്യാഖ്യാനം ചുരുക്കുന്നില്ല.
- source_word: καὶ
  choice: -ഉം
  rationale: ‘നാളുകളിലും’ എന്നതിലെ ‘-ഉം’ ഗ്രീക്കിലെ രണ്ടാം καί നൽകുന്ന ‘കൂടി/also’ എന്ന വ്യാപ്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രന്റെ
  rationale: സുവിശേഷങ്ങളിൽ യേശുവിന്റെ സ്ഥാപിതമായ സ്വയംവിശേഷണവും ദാനീയേൽ 7-ന്റെ സാധ്യതയുള്ള പ്രതിധ്വനിയുമാണ്; പദരൂപവും മിശിഹാ-അന്ത്യകാല അനുരണനവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπου എന്ന ശീർഷകത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: ‘മനുഷ്യപുത്രൻ’ മൂലപദത്തിന്റെ രൂപത്തോട് അടുത്തുനിൽക്കുകയും സുവിശേഷങ്ങളിലെ സ്ഥാപിതമായ ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകവും ദാനീയേൽ 7-നോടുള്ള സാധ്യതയുള്ള ബന്ധവും നിലനിർത്തുകയും ചെയ്യുന്നു. കൂടുതൽ സാമാന്യമായ പകരംവാക്ക് ആ അനുരണനം മങ്ങിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘നാളുകൾ’ എന്ന സ്ഥാപിത കാലപ്രയോഗവും ‘മനുഷ്യപുത്രൻ’ എന്ന പരിചിത ശീർഷകവും നിലനിർത്തി; താരതമ്യത്തിന്റെ καθὼς … οὕτως ഘടന ‘പോലെതന്നെ … അങ്ങനെ’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
