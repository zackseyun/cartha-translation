  text: Δύο ἔσονται ἐν τῷ ἀγρῷ· εἷς παραληφθήσεται, καὶ ὁ ἕτερος ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: ml
  text: രണ്ടുപേർ[a] വയലിലായിരിക്കും; ഒരാൾ കൊണ്ടുപോകപ്പെടും, മറ്റേയാൾ വിട്ടുകളയപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം ഏറ്റവും പുരാതനമായ ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിലും (നാലാം നൂറ്റാണ്ടിലെ സീനായിറ്റിക്കസ്, വത്തിക്കാനസ് എന്നിവ ഉൾപ്പെടെ) ആദ്യകാല കോപ്റ്റിക് പരിഭാഷകളിലും കാണുന്നില്ല. എന്നാൽ അഞ്ചാം നൂറ്റാണ്ടിലെ കോഡെക്സ് ബെസേ പോലുള്ള പാശ്ചാത്യ പാഠപാരമ്പര്യത്തിലും ബൈസന്റൈൻ ഭൂരിപക്ഷ പാഠപാരമ്പര്യത്തിലും ലത്തീൻ വുൾഗാത്തയിലും ഇത് കാണുന്നു. മത്തായി 24:40-നോട് ഒത്തുവരുത്താൻ പിൽക്കാല പകർപ്പെഴുത്തുകാർ ഇത് ചേർത്തതായിരിക്കാം.
    reason: textual_critical
lexical_decisions:
- source_word: παραλαμβάνω
  choice: കൊണ്ടുപോകപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; ഒരാളെ കൂടെ സ്വീകരിക്കുകയോ കൂട്ടിക്കൊണ്ടുപോകുകയോ ചെയ്യുന്നതെന്ന ആശയം നൽകുന്നു, എന്നാൽ ആരാണ് എവിടേക്കാണ് കൊണ്ടുപോകുന്നതെന്ന് വ്യക്തമാക്കാതെ മൂലപാഠത്തിലെ സന്ദിഗ്ധത സംരക്ഷിക്കുന്നു.
- source_word: ἀφίημι
  choice: വിട്ടേക്കപ്പെടും
  rationale: നേരിട്ടുള്ള വിരുദ്ധതയിൽ ഒരാൾ അവിടെ ശേഷിക്കുകയോ ഉപേക്ഷിക്കപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; കർമണിപ്രയോഗവും വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തുന്നു.
- source_word: ἕτερος
  choice: മറ്റേയാൾ
  rationale: മുമ്പ് പറഞ്ഞ രണ്ടുപേരിൽ രണ്ടാമത്തെയാളെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: δύο
  choice: രണ്ടുപേർ
  rationale: ഗ്രീക്കിൽ ‘പുരുഷന്മാർ’ എന്ന നാമം വ്യക്തമാക്കിയിട്ടില്ല; മനുഷ്യരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ലിംഗനിരപേക്ഷവുമായ മലയാളരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: കൊണ്ടുപോകപ്പെടുന്നയാളുടെയും വിട്ടേക്കപ്പെടുന്നയാളുടെയും അന്തിമസ്ഥിതി
  choice: വാക്യത്തിൽ വിധിനിർണയപരമായ വിശദീകരണം ചേർത്തിട്ടില്ല
  alternative: കൊണ്ടുപോകപ്പെടുന്നത് രക്ഷയ്ക്കാണെന്നോ ന്യായവിധിക്കാണെന്നോ വ്യക്തമാക്കുക
  rationale: ഈ വാക്യം മാത്രം ഏത് വ്യക്തിയാണ് അനുകൂലമോ പ്രതികൂലമോ ആയ ഫലം അനുഭവിക്കുന്നതെന്ന് തീർച്ചപ്പെടുത്തുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സന്ദിഗ്ധതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭാഷ. ‘രണ്ടുപേർ’ എന്നത് ഗ്രീക്കിലുള്ള ലിംഗനിരപേക്ഷത നിലനിർത്തുന്നു. സമാന്തരമായ ‘കൊണ്ടുപോകപ്പെടും / വിട്ടേക്കപ്പെടും’ എന്ന കർമണിരൂപങ്ങൾ മൂലപാഠത്തിന്റെ ഘടനയും സന്ദിഗ്ധതയും സംരക്ഷിക്കുന്നു.
