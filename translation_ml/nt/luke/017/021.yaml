source:
  edition: SBLGNT
  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: ml
  text: “‘ഇതാ, ഇവിടെ!’ എന്നോ ‘അവിടെ!’ എന്നോ അവർ പറയുകയുമില്ല. എന്തെന്നാൽ, ഇതാ, ദൈവരാജ്യം നിങ്ങളുടെ മധ്യേയാണ്[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിങ്ങളുടെ ഉള്ളിലാണ്.” ഗ്രീക്ക് പ്രയോഗത്തിന് ആന്തരികമായ അർഥമോ “നിങ്ങളുടെ ഇടയിൽ / നിങ്ങളുടെ മധ്യേ” എന്ന കൂട്ടായ അർഥമോ വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: അവർ പറയുകയുമില്ല
  rationale: മുൻവാക്യത്തിലെ നിഷേധത്തെ തുടർന്നുകൊണ്ട് ഭാവികാലക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: ‘ഇതാ, ഇവിടെ!’ എന്നോ ‘അവിടെ!’ എന്നോ
  rationale: സ്ഥലസൂചകമായ വിരുദ്ധജോടി നിലനിർത്തുകയും ആദ്യത്തെ ἰδού ശ്രദ്ധ ക്ഷണിക്കുന്ന ‘ഇതാ’യായി നൽകുകയും ചെയ്യുന്നു.
- source_word: γὰρ ἰδοὺ
  choice: എന്തെന്നാൽ, ഇതാ
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധവും ἰδού നൽകുന്ന ഊന്നലോടെയുള്ള ശ്രദ്ധാക്ഷണവും സംരക്ഷിക്കുന്നു.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: രാജഭരണത്തിന്റെയും രാജ്യത്തിന്റെയും അർഥസാധ്യതകൾ അനാവശ്യമായി ചുരുക്കാത്ത, മലയാളത്തിൽ സ്ഥാപിതവും സുതാര്യവുമായ പ്രയോഗം.
- source_word: ἐντὸς ὑμῶν
  choice: നിങ്ങളുടെ മധ്യേ
  rationale: ബഹുവചനസംബോധനയും സന്ദർഭത്തിലെ സ്ഥലസൂചനകളും കണക്കിലെടുത്ത് കൂട്ടായ സാന്നിധ്യാർഥം മുഖ്യപാഠത്തിൽ നൽകുന്നു; ‘നിങ്ങളുടെ ഉള്ളിൽ’ എന്ന യഥാർഥ പകരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐστιν
  choice: ആണ്
  rationale: വർത്തമാനകാലത്തിലുള്ള εἰμίയുടെ ലളിതമായ സമാനരൂപം; സാന്നിധ്യത്തിന്റെ അർഥം സ്ഥാനവാചകപ്രയോഗം വഹിക്കുന്നു.
theological_decisions:
- issue: ἐντὸς ὑμῶν എന്നതിന്റെ അർഥം
  choice: ദൈവരാജ്യം നിങ്ങളുടെ മധ്യേയാണ്
  alternative: ദൈവരാജ്യം നിങ്ങളുടെ ഉള്ളിലാണ്
  rationale: യേശു ബഹുവചനത്തിലുള്ള ഒരു സമൂഹത്തോടാണ് സംസാരിക്കുന്നത്; സമീപസന്ദർഭം കാണാവുന്ന അടയാളങ്ങളെയും സ്ഥലനിർദേശങ്ങളെയും കുറിച്ചുമാണ്. അതിനാൽ ‘നിങ്ങളുടെ മധ്യേ’ എന്ന കൂട്ടായ സാന്നിധ്യാർഥം മുഖ്യപാഠത്തിൽ യോജിക്കുന്നു. എന്നാൽ ആന്തരികാർഥവും ഗ്രീക്കിൽ സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഉദ്ധരണികളുടെ സ്ഥലസൂചക സമാന്തരതയും രണ്ടാം ἰδούയുടെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
