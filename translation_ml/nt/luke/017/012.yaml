source:
  edition: SBLGNT
  text: καὶ εἰσερχομένου αὐτοῦ εἴς τινα κώμην ⸀ἀπήντησαν δέκα λεπροὶ ἄνδρες, οἳ ⸀ἔστησαν πόρρωθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: ml
  text: അവൻ ഒരു ഗ്രാമത്തിലേക്കു പ്രവേശിക്കുമ്പോൾ, കുഷ്ഠബാധിതരായ പത്തു പുരുഷന്മാർ[a] അവനെ എതിരേറ്റു. അവർ അകലെ[b] നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുഷ്ഠരോഗികളായ പത്തു പുരുഷന്മാർ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ ഹാൻസൻസ് രോഗം മാത്രമല്ല, പലതരം ചർമരോഗാവസ്ഥകളെയും സൂചിപ്പിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വളരെ അകലെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: അവൻ … പ്രവേശിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തോടുകൂടിയ genitive absolute, മുഖ്യക്രിയയോടൊപ്പം നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘പ്രവേശിക്കുമ്പോൾ’ എന്നത് തുടർച്ചാഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἴς τινα κώμην
  choice: ഒരു ഗ്രാമത്തിലേക്കു
  rationale: τινα അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഒരു ഗ്രാമത്തിലേക്കു’ എന്നത് അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ഒരു പ്രത്യേക ഗ്രാമത്തിലേക്കു’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ ഇല്ലാത്ത ഊന്നൽ വരാം.
- source_word: ἀπήντησαν
  choice: എതിരേറ്റു
  rationale: ἀπαντάω എന്നതിന്റെ ‘കണ്ടുമുട്ടുക/എതിരേൽക്കുക’ എന്ന അർഥം സന്ദർഭോചിതമായി നൽകുന്നു; അവരുടെ ചലനത്തിന്റെ വിശദാംശങ്ങൾ അനാവശ്യമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: കുഷ്ഠബാധിതരായ പത്തു പുരുഷന്മാർ
  rationale: λεπροί എന്ന വിശേഷണാത്മക വിവരണം നിലനിർത്തുന്നതിനൊപ്പം മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായ വ്യക്തികേന്ദ്രിത പ്രയോഗം നൽകുന്നു. പുരാതന പദത്തെ ആധുനിക ഹാൻസൻസ് രോഗത്തിന്റെ കൃത്യനിർണയമായി ചുരുക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: οἳ ἔστησαν
  choice: അവർ … നിന്നു
  rationale: ബന്ധവാക്യത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ സ്വതന്ത്രവാക്യമായി നൽകിയെങ്കിലും, ആ പത്തു പുരുഷന്മാരെയാണ് അത് സൂചിപ്പിക്കുന്നത് എന്ന ബന്ധം വ്യക്തമാണ്.
- source_word: πόρρωθεν
  choice: അകലെ
  rationale: സ്ഥലപരമായ അകലം ലളിതവും സമകാലികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ദൂരെനിന്ന്’ എന്നതിനെക്കാൾ നിൽക്കുന്ന സ്ഥാനം ഇവിടെ നേരിട്ട് അറിയിക്കുന്നു.
theological_decisions:
- issue: λεπροί എന്ന രോഗസംബന്ധിയായ വിശേഷണം
  choice: കുഷ്ഠബാധിതരായ പത്തു പുരുഷന്മാർ
  alternative: കുഷ്ഠരോഗികളായ പത്തു പുരുഷന്മാർ
  rationale: മൂലപാഠത്തിലെ വിശേഷണാത്മക വിവരണം സംരക്ഷിക്കുകയും ആളുകളെ രോഗനാമംകൊണ്ടു മാത്രം നിർവചിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു. അതേസമയം, പുരാതന λεπρός എന്ന പദം ആധുനിക ഹാൻസൻസ് രോഗവുമായി കൃത്യമായി തുല്യമാണെന്ന അവകാശവാദം ഉന്നയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യം മലയാളത്തിലെ സ്വാഭാവിക വായനയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; കാലബന്ധവും കർത്തൃബന്ധവും മാറ്റിയിട്ടില്ല.
