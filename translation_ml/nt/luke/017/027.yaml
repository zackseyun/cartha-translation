id: LUK.17.27
reference: Luke 17:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: ml
  text: നോഹ പെട്ടകത്തിൽ പ്രവേശിച്ച ദിവസംവരെ അവർ തിന്നുകയും കുടിക്കുകയും വിവാഹം കഴിക്കുകയും വിവാഹത്തിനു കൊടുക്കപ്പെടുകയും ചെയ്തുകൊണ്ടിരുന്നു; പ്രളയം വന്ന് അവരെയെല്ലാം നശിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤσθιον, ἔπινον
  choice: തിന്നുകയും കുടിക്കുകയും ചെയ്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയകൾ കഴിഞ്ഞകാലത്ത് തുടർന്നുകൊണ്ടിരുന്ന പതിവുപ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു; ‘ചെയ്തുകൊണ്ടിരുന്നു’ ആ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐγάμουν
  choice: വിവാഹം കഴിക്കുകയും
  rationale: സജീവരൂപത്തിന്റെ പൊതുവായ അർഥമായ വിവാഹം കഴിക്കൽ ലിംഗം അനാവശ്യമായി വ്യക്തമാക്കാതെ നൽകുന്നു.
- source_word: ἐγαμίζοντο
  choice: വിവാഹം ചെയ്തുകൊടുക്കപ്പെടുകയും
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപവും ἐγάμουν എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു; വിവാഹത്തിനായി മറ്റുള്ളവർ നൽകുന്ന സാമൂഹികപ്രവൃത്തിയാണ് ഇതിലൂടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ἄχρι ἧς ἡμέρας
  choice: പ്രവേശിച്ച ദിവസംവരെ
  rationale: തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തികളുടെ സമയപരിധി വ്യക്തവും സ്വാഭാവികവുമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: നോഹ പെട്ടകത്തിൽ പ്രവേശിച്ചു
  rationale: പൂർത്തിയായ ആഖ്യാനസംഭവത്തെ ലളിതമായി നൽകുന്നു; നോഹയുടെ സന്ദർഭത്തിൽ κιβωτός എന്നത് സ്ഥാപിതമായി ‘പെട്ടകം’ എന്നാണ്.
- source_word: ὁ κατακλυσμός
  choice: പ്രളയം
  rationale: ഉല്പത്തി വിവരണത്തോടുള്ള സൂചനയ്ക്ക് യോജിക്കുന്ന, വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപദം.
- source_word: ἀπώλεσεν πάντας
  choice: അവരെയെല്ലാം നശിപ്പിച്ചു
  rationale: πάντας സൂചിപ്പിക്കുന്ന മനുഷ്യരെ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും സമ്പൂർണത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വിവാഹത്തെക്കുറിച്ചുള്ള രണ്ടു വ്യത്യസ്ത ക്രിയകളുടെ പരിഭാഷ
  choice: വിവാഹം കഴിക്കുകയും വിവാഹം ചെയ്തുകൊടുക്കപ്പെടുകയും
  alternative: വിവാഹം കഴിക്കുകയും വിവാഹിതരാകുകയും
  rationale: മൂലപാഠം ഒരു സജീവക്രിയയും ഒരു നിഷ്ക്രിയക്രിയയും ഉപയോഗിക്കുന്നു. അവയെ വേർതിരിക്കുന്നത് വിധി വരുന്നതുവരെ സാധാരണ സാമൂഹികജീവിതം തുടർന്നുവെന്ന പാഠത്തിന്റെ രൂപവും ഊന്നലും സംരക്ഷിക്കുന്നു; അധികമായ ഉപദേശാർഥം ചേർക്കുന്നില്ല.
- issue: ആരംഭത്തിലെ ക്രിയാശ്രേണിയുടെ കാലഭാവം
  choice: ചെയ്തുകൊണ്ടിരുന്നു
  alternative: ചെയ്തു
  rationale: ആവർത്തിച്ചുവരുന്ന അപൂർണഭൂതകാലരൂപങ്ങൾ തുടർന്നുകൊണ്ടിരുന്ന പതിവുപ്രവൃത്തികളെ ചിത്രീകരിക്കുന്നു. മലയാളത്തിലെ തുടർച്ചാസൂചക രൂപം പെട്ടെന്നെത്തിയ പ്രളയത്തോടുള്ള വൈരുധ്യം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘വിവാഹം ചെയ്തുകൊടുക്കപ്പെടുക’ ദൈനംദിനഭാഷയിൽ അല്പം ഔപചാരികമാണെങ്കിലും മൂലത്തിലെ നിഷ്ക്രിയരൂപം സംരക്ഷിക്കാനാണ് തെരഞ്ഞെടുത്തത്.
