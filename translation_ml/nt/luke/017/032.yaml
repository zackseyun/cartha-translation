translation:
  language: ml
  text: ലോത്തിന്റെ ഭാര്യയെ ഓർക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് ഉല്പത്തി 19:26-ലേക്കുള്ള സൂചനയാണ്; സൊദോമിന്റെ നാശസമയത്ത് ലോത്തിന്റെ ഭാര്യ പിന്നോട്ടു നോക്കി.
    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: ഓർക്കുക
  rationale: വർത്തമാനകാല കർത്തരി ആജ്ഞാരൂപം, ബഹുവചനം. മലയാളത്തിലെ ‘ഓർക്കുക’ യേശുവിന്റെ നേരിട്ടുള്ള ആഹ്വാനം സ്വാഭാവികമായും സംക്ഷിപ്തമായും നൽകുന്നു; വർത്തമാനകാലത്തിന്റെ തുടർച്ചാഭാവം അനാവശ്യമായി വിപുലീകരിക്കുന്നില്ല.
- source_word: τῆς γυναικὸς
  choice: ഭാര്യയെ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. Λώτ എന്ന വ്യക്തിനാമത്തോടുള്ള ബന്ധത്തിൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് ‘ഭാര്യ’യാണ്. μνημονεύω ക്രിയയുടെ ജനിറ്റീവ് കർമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രത്യക്ഷകർമരൂപമായ ‘ഭാര്യയെ’ എന്നു നൽകി.
- source_word: Λώτ
  choice: ലോത്ത്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്കനുസരിച്ച് ‘ലോത്ത്’ എന്നു നൽകി.
theological_decisions:
- issue: മുന്നറിയിപ്പിന്റെ/സൂചനയുടെ രൂപം
  choice: ഉല്പത്തി വിവരണത്തിലേക്കുള്ള യേശുവിന്റെ നേരിട്ടുള്ള, സംക്ഷിപ്തമായ ആഹ്വാനമായി ‘ലോത്തിന്റെ ഭാര്യയെ ഓർക്കുക’ എന്നു നിലനിർത്തി.
  alternative: ‘ലോത്തിന്റെ ഭാര്യയെ മനസ്സിൽ സൂക്ഷിക്കുക.’
  rationale: വാക്യം ഉല്പത്തി 19:26-ലെ സംഭവത്തെ ആധാരമാക്കിയ മുന്നറിയിപ്പാണ്. ‘ഓർക്കുക’ എന്ന നേരിട്ടുള്ള ആജ്ഞ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും മുന്നറിയിപ്പിന്റെ ശക്തിയും സംരക്ഷിക്കുന്നു; സ്ത്രീയുടെ പ്രവൃത്തിയെക്കുറിച്ചുള്ള വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ സംക്ഷിപ്ത ആജ്ഞാരൂപം. മൂലപാഠത്തിലെ ബഹുവചന ആജ്ഞയ്ക്ക് മലയാളത്തിൽ പ്രത്യേക രൂപവ്യത്യാസമില്ല. ഇംഗ്ലീഷ് പതിപ്പിലെ ആദ്യ അടിക്കുറിപ്പിന്റെ അക്ഷരാർഥഘടന മലയാള മുഖ്യപാഠത്തിൽ തന്നെയായതിനാൽ അടിക്കുറിപ്പ് അത് തുറന്നുപറയുന്നു.
