reference: Luke 17:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: ml
  text: 'കർത്താവ് പറഞ്ഞു: “നിങ്ങൾക്കു കടുകുമണിപോലുള്ള വിശ്വാസം ഉണ്ടെങ്കിൽ, ഈ മൾബറി മരത്തോട്[a], ‘വേരോടെ പിഴുതുമാറ്റപ്പെടുക; കടലിൽ നട്ടുവെക്കപ്പെടുക’ എന്നു നിങ്ങൾ പറയുമായിരുന്നു; അതു നിങ്ങളെ അനുസരിക്കുമായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സിക്കമൈൻ മരം”; മൾബറി മരത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ പരമ്പരാഗത പരിഭാഷ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനത്തിൽ യേശുവിനുള്ള ബഹുമാനസൂചകവും ക്രിസ്തുശാസ്ത്രപരവുമായ പതിവു ശീർഷകം നിലനിർത്തുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: ഇവിടെ ദൈവത്തിലുള്ള ആശ്രയവും ഉറപ്പുമാണ് മുഖ്യഭാവം; ‘വിശ്വസ്തത’ എന്ന അർഥമല്ല. പൊതുവായ മലയാള ബൈബിൾ പദപ്രയോഗവും ഇതാണ്.
- source_word: ὡς κόκκον σινάπεως
  choice: കടുകുമണിപോലെയുള്ള
  rationale: ὡς നൽകുന്ന ഉപമ നിലനിർത്തുന്നു; വലുപ്പം മാത്രമാണ് താരതമ്യവിഷയം എന്ന് വിശദീകരിച്ചുചേർക്കുന്നില്ല.
- source_word: συκαμίνῳ
  choice: മൾബറി മരം
  rationale: ഈ ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്ന വൃക്ഷത്തിന് വ്യക്തവും ആധുനികവുമായ പേര് ഉപയോഗിക്കുന്നു; പരമ്പരാഗത ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐλέγετε ἂν
  choice: നിങ്ങൾ പറയുമായിരുന്നു
  rationale: ἄν ചേർന്ന അപൂർണഭൂതകാല ക്രിയയുടെ സാങ്കൽപ്പിക/സാധ്യതാപരമായ ഫലം സ്വാഭാവിക മലയാള വ്യവസ്ഥാരൂപത്തിൽ നൽകുന്നു.
- source_word: Ἐκριζώθητι
  choice: വേരോടെ പിഴുതുമാറ്റപ്പെടുക
  rationale: വേരോടെ നീക്കപ്പെടുക എന്ന അർഥവും ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തിലുള്ള ആജ്ഞയും നിലനിർത്തുന്നു.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: കടലിൽ നട്ടുപിടിപ്പിക്കപ്പെടുക
  rationale: കടലിൽ നടുക എന്ന വൈരുധ്യാത്മകവും ശക്തവുമായ ദൃശ്യബിംബം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: അതു നിങ്ങളെ അനുസരിക്കുമായിരുന്നു
  rationale: ആജ്ഞയ്ക്കു വഴങ്ങുക എന്ന ὑπακούωയുടെ ശക്തമായ അർഥവും സാങ്കൽപ്പിക ഫലവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അത്ഭുതവചനത്തിലെ πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: സന്ദർഭം അസാധ്യമായതിനെ അഭിമുഖീകരിക്കുന്ന ദൈവാശ്രയത്തെക്കുറിച്ചാണ്; ധാർമികമായ സ്ഥിരവിശ്വസ്തതയെ മുഖ്യമായി ഉദ്ദേശിക്കുന്നില്ല. എങ്കിലും പദത്തിന്റെ വിശാലമായ ആശ്രയാർഥം നിഷേധിക്കുന്നില്ല.
- issue: εἰ ἔχετε ... ἂν എന്ന വ്യവസ്ഥയുടെ ഭാവം
  choice: ഉണ്ടായിരുന്നെങ്കിൽ ... പറയുമായിരുന്നു
  alternative: ഉണ്ടെങ്കിൽ ... പറയാം
  rationale: ἄν ഉള്ള ഫലവാക്യത്തിന്റെ സാങ്കൽപ്പിക സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ശിഷ്യന്മാർക്ക് വിശ്വാസമൊട്ടുമില്ലെന്ന അന്തിമ ദൈവശാസ്ത്രവിധി ഇതിലൂടെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉപമയും സാങ്കൽപ്പിക വ്യവസ്ഥയും കർമണിപ്രയോഗത്തിലുള്ള ഇരട്ട ആജ്ഞയും പരമാവധി നിലനിർത്തിയിരിക്കുന്നു.
