    issue: The conditional protasis is rendered as past/counterfactual.
    rationale: “നിങ്ങൾക്കു ... ഉണ്ടായിരുന്നെങ്കിൽ” corresponds to “if you had,” but the source reads εἰ ἔχετε, “if you have.” The potential force belongs to the ἄν clauses in the result, without requiring a claim that the disciples do not have faith.
  - severity: low
    issue: “നട്ടുപിടിപ്പിക്കപ്പെടുക” is slightly more interpretive than the source verb.
    rationale: φυτεύθητι means “be planted.” “നട്ടുവെക്കപ്പെടുക” preserves the passive command without adding the nuance of becoming established.
