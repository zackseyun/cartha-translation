  terminology: «കർത്താവേ» is appropriate for κύριε. «ശരീരം» properly retains the broader sense of σῶμα, while the footnote supplies «മൃതശരീരം/ശവം». «കഴുകന്മാർ» is a suitable contextual rendering of ἀετοί, with the eagle alternative retained in a footnote and without resolving the proverb's referent.
