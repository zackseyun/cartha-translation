  - severity: medium
    issue: «ശവംതീനി കഴുകന്മാർ» is stylistically awkward.
    rationale: The compound is cumbersome and needlessly repeats the scavenging implication already carried by «കഴുകന്മാർ». A simpler term is more idiomatic in modern standard Malayalam while the footnote can preserve the lexical discussion.
