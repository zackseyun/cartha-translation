  source_fidelity: The draft accurately preserves the location question, the address «കർത്താവേ», the proverbial conditional construction, and the deliberately unexplained image. However, «അവർ … ചോദിച്ചു» omits the explicit responsive force of ἀποκριθέντες, which can be retained naturally as «മറുപടിയായി».
