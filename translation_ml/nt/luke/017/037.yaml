  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: ml
  text: 'മറുപടിയായി അവർ അവനോടു, “കർത്താവേ, എവിടെ?” എന്നു ചോദിച്ചു. അവൻ അവരോടു പറഞ്ഞു: “ശരീരം എവിടെയുണ്ടോ[a], അവിടെ കഴുകന്മാരും[b] വന്നുകൂടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശരീരം” എന്നത് സന്ദർഭത്തിൽ “മൃതശരീരം” അല്ലെങ്കിൽ “ശവം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് പദത്തിന് “ഗരുഡന്മാർ” അല്ലെങ്കിൽ “ഈഗിളുകൾ” എന്നും അർഥമാകാം; എന്നാൽ ശരീരത്തിനു ചുറ്റും പക്ഷികൾ കൂടുന്ന ഈ സന്ദർഭത്തിൽ “കഴുകന്മാർ” എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες λέγουσιν
  choice: അവർ അവനോട് … എന്നു ചോദിച്ചു
  rationale: മറുപടി സൂചിപ്പിക്കുന്ന കൃദന്തരൂപവും തുടർന്ന് വരുന്ന ‘പറയുന്നു’ എന്ന ചരിത്രവർത്തമാനവും മലയാളത്തിലെ സ്വാഭാവിക സംഭാഷണശൈലിയിൽ ഏകീകരിച്ചു. ‘എവിടെ?’ എന്നത് ചോദ്യമായതിനാൽ ‘ചോദിച്ചു’ എന്നു നൽകുന്നത് അർഥം വ്യക്തമായി കൈമാറുന്നു.
- source_word: Ποῦ
  choice: എവിടെ
  rationale: സ്ഥലം ചോദിക്കുന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന κύριε എന്ന പദത്തിന്റെ പതിവായും സന്ദർഭോചിതമായും ഉള്ള മലയാളപരിഭാഷ.
- source_word: Ὅπου τὸ σῶμα
  choice: ശരീരം എവിടെയുണ്ടോ
  rationale: പഴമൊഴിസദൃശമായ പൊതുപ്രസ്താവനയുടെ ഭാവം നിലനിർത്തുന്നു; σῶμα എന്നതിനെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘ശവം’ എന്നു മുഖ്യവാചകത്തിൽ മാറ്റാതെ ‘ശരീരം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἀετοὶ
  choice: ശവംതീനി കഴുകന്മാർ
  rationale: ἀετός കഴുകനെയോ പരുന്തുവർഗത്തിലെ വലിയ ഇരപിടിയൻ പക്ഷിയെയോ സൂചിപ്പിക്കാം. ഒരു ശരീരത്തിനു ചുറ്റും പക്ഷികൾ കൂടുന്ന ഈ ദൃശ്യത്തിൽ മാംസഭോജി/ശവംതീനി കഴുകന്മാരാണ് ഉദ്ദേശ്യമെന്ന സാധ്യത മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ‘ഗരുഡന്മാർ/ഈഗിളുകൾ’ എന്ന പദസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐπισυναχθήσονται
  choice: വന്നുകൂടും
  rationale: ഭാവികാലത്തിലുള്ള കൂട്ടിച്ചേരലിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘കൂട്ടിച്ചേർക്കപ്പെടും’ ഇവിടെ കൃത്രിമമായി തോന്നുകയും നിർബന്ധമായിട്ടില്ലാത്ത ഒരു പ്രവർത്തകനെ സൂചിപ്പിക്കുകയും ചെയ്യാം.
theological_decisions:
- issue: ന്യായവിധിയുമായി ബന്ധപ്പെട്ട പഴമൊഴിദൃശ്യത്തിന്റെ നിർവചനം
  choice: ശരീരവും അതിനുചുറ്റും വന്നുകൂടുന്ന ശവംതീനി പക്ഷികളും എന്ന ദൃശ്യം വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: ഇത് അന്ത്യന്യായവിധിയെയോ റോമൻ സൈന്യത്തെയോ അനിവാര്യമായ വെളിപ്പെടുത്തലിനെയും വിധിയെയും കുറിച്ചുള്ള പൊതുതത്ത്വത്തെയോ സൂചിപ്പിക്കുന്നു എന്ന് പരിഭാഷയിൽ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാചകം ദൃശ്യത്തിന്റെ കൃത്യമായ ചരിത്രപരമോ യുഗാന്തപരമോ ആയ സൂചന വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനവിവാദം പരിഭാഷകൊണ്ട് തീർപ്പാക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനഭൂതകാലമായി നൽകി; പഴമൊഴിയുടെ ചുരുക്കവും ഗൗരവവും നിലനിർത്തി.
