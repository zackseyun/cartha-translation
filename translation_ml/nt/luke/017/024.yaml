  to: എന്തെന്നാൽ, ആകാശത്തിൻകീഴിലുള്ള ഒരു ഭാഗത്തുനിന്ന് ആകാശത്തിൻകീഴിലുള്ള മറുഭാഗത്തേക്ക് മിന്നൽ മിന്നിക്കൊണ്ട് പ്രകാശിക്കുന്നതുപോലെ,[a] മനുഷ്യപുത്രൻ തന്റെ നാളിൽ അങ്ങനെ ആയിരിക്കും.[b]
