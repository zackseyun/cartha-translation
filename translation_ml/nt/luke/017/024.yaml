id: LUK.17.24
reference: Luke 17:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: ml
  text: എന്തെന്നാൽ, ആകാശത്തിൻകീഴിലുള്ള ഒരു ഭാഗത്തുനിന്ന് ആകാശത്തിൻകീഴിലുള്ള മറുഭാഗത്തേക്ക് മിന്നൽ മിന്നിക്കൊണ്ട് പ്രകാശിക്കുന്നതുപോലെ,[a] മനുഷ്യപുത്രൻ തന്റെ നാളിൽ അങ്ങനെ ആയിരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “ആകാശത്തിന്റെ ഒരറ്റത്തുനിന്ന് മറ്റേ അറ്റത്തേക്ക്.” ഗ്രീക്കിൽ “ആകാശത്തിൻകീഴിൽ” എന്ന പ്രയോഗം ഇരുഭാഗത്തും ആവർത്തിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “അവന്റെ നാളിൽ.” മനുഷ്യപുത്രനോടു ബന്ധപ്പെട്ട സമയത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; അതിന്റെ കൃത്യമായ സ്വഭാവം ഇവിടെ വിശദീകരിക്കുന്നില്ല.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: എന്തെന്നാൽ ... പോലെ
  rationale: γάρ എന്നതിന്റെ വിശദീകരണഭാവവും ὥσπερ തുടങ്ങുന്ന ഉപമാഘടനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀστραπὴ ἀστράπτουσα
  choice: മിന്നൽ മിന്നി
  rationale: നാമത്തിന്റെയും അതേ മൂലത്തിൽനിന്നുള്ള പങ്കാളിക്രിയയുടെയും ആവർത്തനഭാവം മലയാളത്തിൽ വ്യക്തവും ദൃശ്യസജീവവുമായ രീതിയിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν ... εἰς τὴν ὑπ’ οὐρανόν
  choice: ആകാശത്തിൻകീഴിലുള്ള ഒരു ഭാഗത്തുനിന്ന് ആകാശത്തിൻകീഴിലുള്ള മറുഭാഗത്തേക്ക്
  rationale: ഗ്രീക്കിലെ ‘ആകാശത്തിൻകീഴിൽ’ എന്ന ആവർത്തനം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; കൂടുതൽ പ്രയോഗസഹജമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: λάμπει
  choice: പ്രകാശിക്കുന്നു
  rationale: മുമ്പുള്ള ἀστράπτουσα എന്ന ‘മിന്നുന്നു’ എന്ന ക്രിയയിൽനിന്ന് വ്യത്യസ്തമായ രണ്ടാമത്തെ ക്രിയയെ പ്രത്യേകം നിലനിർത്തുന്നു.
- source_word: οὕτως ἔσται
  choice: അങ്ങനെ ആയിരിക്കും
  rationale: ഉപമയുടെ ലളിതമായ ഭാവികാലസമാപനം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ ഈ സ്വയംവിശേഷണത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥാപിതവും സുതാര്യവുമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: തന്റെ നാളിൽ
  rationale: αὐτοῦ എന്നതിന്റെ ഉടമസ്ഥബന്ധവും ἐν എന്നതിന്റെ കാലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘വരവിൽ’ അല്ലെങ്കിൽ ‘ന്യായവിധിനാളിൽ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിൽ ‘മനുഷ്യപുത്രൻ തന്റെ നാളിൽ’ എന്നതിന്റെ അർഥം
  choice: ‘തന്റെ നാളിൽ’ എന്ന വിശാലമായ പ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: ‘തന്റെ വരവിൽ’ അല്ലെങ്കിൽ ‘ന്യായവിധിനാളിൽ’
  rationale: സന്ദർഭം അന്ത്യകാലപരമാണെങ്കിലും ഗ്രീക്ക് പാഠം ഇവിടെ പറയുന്നത് ‘അവന്റെ നാളിൽ’ എന്നു മാത്രമാണ്. കൂടുതൽ നിർദിഷ്ടമായ വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ വിശാലത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനവും രണ്ടു വ്യത്യസ്ത ക്രിയകളും പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചപ്പോൾ, കൂടുതൽ പ്രയോഗസഹജമായ സ്ഥലവിവരണം അടിക്കുറിപ്പിൽ നൽകി.
