id: LUK.17.25
reference: Luke 17:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: ml
  text: എന്നാൽ ആദ്യം അവൻ അനേകം കഷ്ടങ്ങൾ സഹിക്കുകയും ഈ തലമുറയാൽ തിരസ്കരിക്കപ്പെടുകയും വേണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: സംഭവക്രമത്തിലെ സമയപരമായ മുൻഗണനയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യവും ആശയമാറ്റവും പ്രകടമാക്കുന്നു.
- source_word: δεῖ
  choice: വേണം
  rationale: ദൈവിക പദ്ധതിയുടെ സൂചന വ്യക്തമായി വിശദീകരിച്ചുചേർക്കാതെ ആവശ്യകതയുടെ ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: αὐτὸν
  choice: അവൻ
  rationale: ഗ്രീക്കിൽ അനന്തക്രിയകളുടെ കർത്താവായി ദ്വിതീയാവിഭക്തിയിലാണെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ ‘അവൻ’ ആവശ്യമാണ്.
- source_word: πολλὰ παθεῖν
  choice: അനേകം കഷ്ടങ്ങൾ സഹിക്കുക
  rationale: πολλά സൂചിപ്പിക്കുന്ന ബഹുത്വവും πάσχωയുടെ കഷ്ടാനുഭവസാരവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἀποδοκιμασθῆναι
  choice: തിരസ്കരിക്കപ്പെടുക
  rationale: പരിശോധിച്ചശേഷമുള്ള നിരാകരണം എന്ന സൂക്ഷ്മഭാവം ഉൾക്കൊള്ളുന്ന, പുതിയനിയമസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പദമാണ്.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: ഈ തലമുറയാൽ
  rationale: കർമണിപ്രയോഗത്തോടുകൂടിയ ἀπό പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നതായി എടുത്ത്, സമകാലിക സമൂഹത്തെ സൂചിപ്പിക്കുന്ന γενεάയെ ‘ഈ തലമുറ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: മനുഷ്യപുത്രന്റെ കഷ്ടാനുഭവവുമായി ബന്ധപ്പെട്ട δεῖയുടെ ശക്തി
  choice: ‘വേണം’ എന്നു പരിഭാഷപ്പെടുത്തി ആവശ്യകത നിലനിർത്തി; അത് ദൈവിക നിർണയമാണെന്ന് വാക്യത്തിൽ വിശദീകരിച്ചുചേർത്തില്ല.
  alternative: ‘അനിവാര്യമാണ്’ എന്നു നൽകുക, അല്ലെങ്കിൽ ദൈവത്തിന്റെ പദ്ധതി നിറവേറുന്നതായി തുറന്നുപറയുക.
  rationale: ലൂക്കോസിൽ δεῖ പലപ്പോഴും ദൈവിക ഉദ്ദേശ്യാനുസൃതമായ അനിവാര്യത സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം അതിനെ തുറന്ന് വിശദീകരിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ ഭാരം സൂചനയായി നിലനിർത്തുകയും വ്യാഖ്യാനം മൂലപാഠത്തിലേക്ക് ചേർക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കഷ്ടങ്ങൾ സഹിക്കുക’, ‘തിരസ്കരിക്കപ്പെടുക’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും ഗൗരവവും നിലനിർത്തുന്നു.
