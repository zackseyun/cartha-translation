id: LUK.17.16
reference: Luke 17:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: ml
  text: അവൻ യേശുവിന്റെ കാൽക്കൽ കമിഴ്ന്നുവീണ് അവനു നന്ദി പറഞ്ഞു. അവനാകട്ടെ ഒരു ശമര്യക്കാരനായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: കമിഴ്ന്നുവീണ്
  rationale: πίπτω എന്ന ക്രിയയുടെ ‘വീഴുക’ എന്ന അർഥവും ἐπὶ πρόσωπον സൂചിപ്പിക്കുന്ന മുഖംതാഴ്ത്തിയ സാഷ്ടാംഗഭാവവും സ്വാഭാവികവും സംക്ഷിപ്തവുമായി ചേർത്തു നൽകുന്നു.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: യേശുവിന്റെ കാൽക്കൽ
  rationale: ആദരവോടെയും വിനയത്തോടെയും അവന്റെ പാദങ്ങൾക്കരികിൽ വീണ നിലയെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. വാക്യത്തിനുള്ളിലെ αὐτοῦ യേശുവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് ഉപയോഗിച്ചു.
- source_word: εὐχαριστῶν αὐτῷ
  choice: അവനു നന്ദി പറഞ്ഞു
  rationale: സമകാലികമായി നടക്കുന്ന അനുബന്ധപ്രവൃത്തിയെ മലയാളത്തിലെ ക്രിയാശൃംഖല സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; നന്ദി യേശുവിനാണ് അർപ്പിച്ചതെന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: Σαμαρίτης
  choice: ശമര്യക്കാരൻ
  rationale: കഥയിലെ സാമൂഹികവും മതപരവുമായ പ്രാധാന്യമുള്ള ജനവിഭാഗപരമായ തിരിച്ചറിയലിന്റെ നിലവാരമുള്ള മലയാളരൂപം.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: അവനാകട്ടെ ഒരു ശമര്യക്കാരനായിരുന്നു
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘അവനാകട്ടെ’ എന്നതിലൂടെ മിതമായി നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ അധികവാക്കുകൾ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സൗഖ്യം ലഭിച്ച മനുഷ്യന്റെ ശമര്യ തിരിച്ചറിയലിലുള്ള ആഖ്യാന ഊന്നൽ
  choice: ‘അവനാകട്ടെ ഒരു ശമര്യക്കാരനായിരുന്നു’ എന്ന ലളിതമായ വെളിപ്പെടുത്തൽ നിലനിർത്തി.
  alternative: ‘ഈ മനുഷ്യൻ ഒരു ശമര്യക്കാരനായിരുന്നു’ അല്ലെങ്കിൽ ‘അവൻ ഒരു ശമര്യക്കാരൻപോലും ആയിരുന്നു.’
  rationale: നന്ദി പറഞ്ഞയാൾ സാധാരണയായി പുറംവിഭാഗക്കാരനായി കണക്കാക്കപ്പെട്ടിരുന്ന ശമര്യക്കാരനാണെന്ന അപ്രതീക്ഷിതമായ സാമൂഹിക-ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു; അതിന്റെ അർഥം മുഖ്യപാഠത്തിൽ വിശദീകരിച്ച് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ‘സാഷ്ടാംഗം പ്രണമിച്ചു’ പോലുള്ള കൂടുതൽ ആചാരപരമോ സംസ്കൃതഭാരമുള്ളതോ ആയ പ്രയോഗത്തിന് പകരം ദൃശ്യമായ ശരീരഭാവം സൂചിപ്പിക്കുന്ന ‘കമിഴ്ന്നുവീണ്’ ഉപയോഗിച്ചു.
