id: LUK.17.22
reference: Luke 17:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ ശിഷ്യന്മാരോടു പറഞ്ഞു: “നിങ്ങൾ മനുഷ്യപുത്രന്റെ നാളുകളിൽ ഒന്ന്[a] കാണാൻ അതിയായി ആഗ്രഹിക്കുന്ന നാളുകൾ വരും; എന്നാൽ നിങ്ങൾ അതു കാണുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനുഷ്യപുത്രന്റെ നാളുകൾ’ എന്നത് അവന്റെ സാന്നിധ്യത്തിന്റെയും പ്രവർത്തനത്തിന്റെയും കാലത്തെയോ, കൂടുതൽ പ്രത്യേകമായി അവന്റെ ഭാവി വെളിപ്പെടലിനെയോ സൂചിപ്പിക്കാം; ഗ്രീക്ക് പ്രയോഗം ഇതിന്റെ വ്യാപ്തി തുറന്നുവെക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: പിന്നെ അവൻ ... പറഞ്ഞു
  rationale: δέ ഇവിടെ വിവരണത്തെ മുന്നോട്ടു നയിക്കുന്ന മൃദുവായ ബന്ധകമാണ്; ‘പിന്നെ’ സ്വാഭാവികമായ മലയാള പ്രവാഹം നൽകുന്നു, ശക്തമായ വൈരുധ്യം ചേർക്കുന്നില്ല.
- source_word: πρὸς τοὺς μαθητάς
  choice: ശിഷ്യന്മാരോടു
  rationale: മൂലത്തിൽ ഉടമസ്ഥസർവനാമമില്ല; അതിനാൽ ‘തന്റെ ശിഷ്യന്മാരോട്’ എന്നു ചേർക്കാതെ ഗ്രീക്ക് പാഠത്തെ കൃത്യമായി പിന്തുടരുന്നു.
- source_word: Ἐλεύσονται ἡμέραι ὅτε
  choice: '... കാലം വരും'
  rationale: അക്ഷരാർഥത്തിൽ ‘നാളുകൾ വരും, അപ്പോൾ’ എന്ന ഭാവമാണെങ്കിലും, ഭാവിയിലെ ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിന് ആധുനിക മലയാളത്തിൽ ‘കാലം വരും’ സ്വാഭാവികമാണ്.
- source_word: ἐπιθυμήσετε
  choice: അതിയായി ആഗ്രഹിക്കുന്ന
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന ശക്തമായ അഭിലാഷം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: μίαν τῶν ἡμερῶν
  choice: നാളുകളിൽ ഒരെണ്ണം
  rationale: ഒരു വലിയ ഗണത്തിൽനിന്നുള്ള ഒന്ന് എന്ന partitive genitive ബന്ധം നിലനിർത്തുന്നു.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രന്റെ
  rationale: യേശുവിന്റെ ഈ വിശേഷണം അക്ഷരാർഥത്തിലും അതിന്റെ ദാനിയേൽഗ്രന്ഥപരവും ദൈവശാസ്ത്രപരവുമായ പ്രതിധ്വനികളോടെയും നിലനിർത്തുന്നു.
- source_word: ἰδεῖν
  choice: കാണാൻ
  rationale: ആഗ്രഹത്തിന്റെ പൂരകമായ infinitive-ന് ലളിതവും സ്വാഭാവികവുമായ തർജമ.
- source_word: καὶ οὐκ ὄψεσθε
  choice: എന്നാൽ നിങ്ങൾ അതു കാണുകയില്ല
  rationale: καί അക്ഷരാർഥത്തിൽ ‘കൂടാതെ/ഉം’ ആണെങ്കിലും ഇവിടെ ഫലത്തിലെ വൈരുധ്യം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു; ‘അതു’ മുമ്പ് പറഞ്ഞ ഒരു നാൾ കാണുന്നതിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘മനുഷ്യപുത്രന്റെ നാളുകൾ’ എന്നതിന്റെ വ്യാപ്തി
  choice: മനുഷ്യപുത്രനുമായി ബന്ധപ്പെട്ട കാലത്തെക്കുറിച്ചുള്ള അന്ത്യകാലഭാരമുള്ളതും എന്നാൽ വ്യാപ്തി തുറന്നുവെക്കുന്നതുമായ പരാമർശം
  alternative: യേശുവിന്റെ ഭൂമിയിലെ സാന്നിധ്യകാലം മാത്രം; അല്ലെങ്കിൽ അവന്റെ ഭാവി വെളിപ്പെടലിന്റെയും ന്യായവിധിയുടെയും സമയം മാത്രം
  rationale: സന്ദർഭത്തിൽ ഈ വാക്കുകൾ ശിഷ്യന്മാർ യേശുവിന്റെ സാന്നിധ്യത്തിനായി കൊതിക്കുന്നതും മനുഷ്യപുത്രന്റെ ഭാവി വെളിപ്പെടലും ഒരുപോലെ പ്രതിധ്വനിപ്പിച്ചേക്കാം. വിവർത്തനം അതിനെ ഒരു വ്യാഖ്യാനത്തിലേക്കു ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘മനുഷ്യപുത്രൻ’ എന്ന പരമ്പരാഗത ബൈബിൾ ശീർഷകം നിലനിർത്തി; വാക്യത്തിന്റെ അന്ത്യകാലസംബന്ധിയായ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
