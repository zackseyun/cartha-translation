id: LUK.17.7
reference: Luke 17:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങളിൽ ആർക്ക് ഉഴുകയോ മേയ്ക്കുകയോ ചെയ്യുന്ന ഒരു അടിമ[a] ഉണ്ടായിരിക്കെ, അവൻ വയലിൽനിന്ന് വന്നപ്പോൾ അവനോട്, ‘ഉടനെ വന്ന് ഭക്ഷണത്തിനായി ചാരിയിരിക്കൂ[b]’ എന്നു പറയും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ δοῦλος എന്ന പദം ‘ദാസൻ’ എന്നോ ‘ബന്ധിത ദാസൻ’ എന്നോ പരിഭാഷപ്പെടുത്താവുന്നതാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘ഭക്ഷണത്തിനായി ചാരിയിരിക്കൂ’ എന്നത് ഭക്ഷണം കഴിക്കുമ്പോൾ ചാരിക്കിടന്നിരുന്ന പുരാതന ആചാരത്തെ പ്രതിഫലിപ്പിക്കുന്നു; കൂടുതൽ സ്വതന്ത്രമായി, ‘ഇരുന്ന് ഭക്ഷണം കഴിക്കൂ.’
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: അടിമ
  rationale: കൂലിവേലക്കാരനെയല്ല, യജമാനന്റെ അധികാരത്തിൻകീഴിലുള്ള ബന്ധിത ഗൃഹവേലക്കാരനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ഉപമയിലെ സാമൂഹികവും വാചികവുമായ അസമത്വം ‘അടിമ’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀροτριῶντα
  choice: ഉഴുകയോ
  rationale: കൃഷിയിടം ഉഴുന്ന പ്രവൃത്തിയെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: ποιμαίνοντα
  choice: മേയ്ക്കുകയോ
  rationale: ആട്ടിൻകൂട്ടം എന്ന് മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ, മൃഗത്തെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ ഇടയവേലയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: അവൻ വയലിൽനിന്ന് വന്നപ്പോൾ
  rationale: ദാതൃക വിഭക്തിയിലുള്ള കൃദന്തത്തിന്റെ കാലസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐρεῖ αὐτῷ
  choice: അവനോട് … എന്നു പറയും
  rationale: ഭാവികാലത്തിലുള്ള λέγω എന്ന ക്രിയയെയും അതിന്റെ പരോക്ഷകർമത്തെയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Εὐθέως
  choice: ഉടനെ
  rationale: കല്പനയിലെ അടിയന്തരതയും ഉടനടിയുള്ള പ്രവർത്തനവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: παρελθὼν
  choice: വന്ന്
  rationale: പ്രധാന കല്പനയോടൊപ്പമുള്ള ചലനത്തെ സ്വാഭാവിക മലയാള കൃദന്തരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνάπεσε
  choice: ഭക്ഷണത്തിന് ചാരിയിരിക്കൂ
  rationale: പുരാതന വിരുന്നുകളിൽ ഭക്ഷണത്തിനായി ചാരിക്കിടന്നോ ചാരിയിരുന്നോ ചെയ്തിരുന്ന രീതിയെ സൂചിപ്പിക്കുന്നു; വെറും ‘ഭക്ഷണം കഴിക്കൂ’ എന്നതിനെക്കാൾ ചരിത്രപരമായ ദൃശ്യബിംബം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപമയിലെ ഗൃഹസാഹചര്യത്തിൽ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ; ബന്ധിതദാസൻ
  rationale: ഈ വാക്യത്തിന്റെ വാചികബലം യജമാനനും അടിമയും തമ്മിലുള്ള അസമമായ അധികാരബന്ധത്തെ ആശ്രയിക്കുന്നു. ‘അടിമ’ ആ സാമൂഹിക യാഥാർഥ്യം നിലനിർത്തുന്നു; അതേസമയം പിൽക്കാല ദൈവശാസ്ത്രപരമായ ആശയങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യരൂപം ഉപയോഗിച്ചു. ഉപമയിലെ അധികാരവ്യത്യാസം മൃദൂകരിക്കാതെ സൂക്ഷിച്ചു; പുരാതന ഭക്ഷണരീതിയുടെ ദൃശ്യബിംബം മുഖ്യപാഠത്തിലും വിശദീകരണം അടിക്കുറിപ്പിലും നിലനിർത്തി.
