review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents δοῦλον as ‘അടിമ,’ the paired present participles ‘plowing or shepherding,’ the temporal sense of εἰσελθόντι ἐκ τοῦ ἀγροῦ, the future rhetorical question, and the immediate imperative to recline for a meal. However, ‘തനിക്കുണ്ടെങ്കിൽ’ introduces an explicit conditional (‘if he has’) where Greek uses the descriptive participle ‘having’; ‘ഉണ്ടായിരിക്കെ’ better preserves the construction.
  naturalness: The wording is generally clear modern Malayalam, but the revised opening is more idiomatic and less conditionally framed. ‘ഭക്ഷണത്തിനായി ചാരിയിരിക്കൂ’ is retained with a cultural footnote, since it preserves the meal-reclining image without falsely making a table explicit in the main text.
  terminology: ‘അടിമ’ appropriately retains the socially asymmetrical force of δοῦλος in this parabolic setting. The footnote’s alternatives are adjusted to use the Greek form rather than Latin transliteration and to make ‘ബന്ധിത ദാസൻ’ readable Malayalam.
  issues:
  - severity: medium
    issue: The phrase ‘ഒരു അടിമ തനിക്കുണ്ടെങ്കിൽ’ is conditional.
    rationale: δοῦλον ἔχων means ‘having a slave,’ not ‘if one has a slave.’ The rhetorical question concerns a person characterized as having such a slave; ‘ഉണ്ടായിരിക്കെ’ reflects this without changing the question’s force.
  - severity: low
    issue: Footnote a uses Latin transliteration ‘doulos.’
    rationale: Using the Greek form δοῦλος is more precise for a source-language note and avoids an unnecessary mixed-script transliteration.
  revised_text: എന്നാൽ, നിങ്ങളിൽ ആർക്ക് ഉഴുകയോ മേയ്ക്കുകയോ ചെയ്യുന്ന ഒരു അടിമ[a] ഉണ്ടായിരിക്കെ, അവൻ വയലിൽനിന്ന് വന്നപ്പോൾ അവനോട്, ‘ഉടനെ വന്ന് ഭക്ഷണത്തിനായി ചാരിയിരിക്കൂ[b]’ എന്നു പറയും?
