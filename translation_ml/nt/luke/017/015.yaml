source:
  edition: SBLGNT
  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: ml
  text: എന്നാൽ അവരിൽ ഒരാൾ, താൻ സൗഖ്യം പ്രാപിച്ചെന്നു മനസ്സിലാക്കി, ഉച്ചസ്വരത്തിൽ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തിക്കൊണ്ട്[a] മടങ്ങിവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തെ സ്തുതിച്ചുകൊണ്ട്.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘മഹത്ത്വപ്പെടുത്തുക’ എന്നും ‘സ്തുതിക്കുക/മഹത്ത്വം നൽകുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: എന്നാൽ അവരിൽ ഒരാൾ
  rationale: എἷς ἐξ αὐτῶν എന്ന ഭാഗികപ്രയോഗം ‘അവരിൽ ഒരാൾ’ എന്നു നേരിട്ട് സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ ശേഷിച്ച ഒൻപതുപേരിൽനിന്നുള്ള കഥാപരമായ വ്യത്യാസം കാണിക്കുന്നതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: ἰδὼν ὅτι ἰάθη
  choice: താൻ സൗഖ്യം പ്രാപിച്ചെന്നു കണ്ടപ്പോൾ
  rationale: ἰδών എന്ന എയോറിസ്റ്റ് കൃദന്തത്തിന്റെ സമയബന്ധം ‘കണ്ടപ്പോൾ’ സ്വാഭാവികമായി നൽകുന്നു. ἰάθη രോഗശാന്തിയെ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് കർമണിപ്രയോഗമാണ്; ‘സൗഖ്യം പ്രാപിച്ചു’ പൂർത്തിയായ രോഗശാന്തി വ്യക്തമാക്കുന്നു.
- source_word: ὑπέστρεψεν
  choice: മടങ്ങിവന്നു
  rationale: സന്ദർഭത്തിൽ യേശുവിന്റെ അടുക്കലേക്കുള്ള തിരിച്ചുവരവാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ‘മടങ്ങിവന്നു’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μετὰ φωνῆς μεγάλης
  choice: ഉച്ചസ്വരത്തിൽ
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം വലിയ ശബ്ദത്തോടെ സംസാരിക്കുകയോ വിളിച്ചുപറയുകയോ ചെയ്യുക എന്നതാണ്. ‘ഉച്ചസ്വരത്തിൽ’ ശബ്ദത്തെ സംബന്ധിച്ച അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: δοξάζων τὸν θεόν
  choice: ദൈവത്തെ മഹത്ത്വപ്പെടുത്തിക്കൊണ്ട്
  rationale: δοξάζω എന്ന പദത്തിന്റെ ‘മഹത്ത്വപ്പെടുത്തുക/മഹത്ത്വം നൽകുക’ എന്ന അർഥവും മുഖ്യക്രിയയോടൊപ്പം തുടരുന്ന കൃദന്തരൂപവും ഈ വിവർത്തനം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τὸν θεόν എന്നതിന്റെ വിവർത്തനം
  choice: ദൈവത്തെ
  alternative: —
  rationale: മൂലവാക്യം സൗഖ്യം പ്രാപിച്ച മനുഷ്യൻ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി എന്നു മാത്രം പറയുന്നു; സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കാതെ θεός എന്നതിന് സാധാരണവും കൃത്യവുമായ വിവർത്തനം നൽകിയിരിക്കുന്നു.
- issue: δοξάζων എന്നതിലെ മഹത്ത്വപ്പെടുത്തൽ–സ്തുതിക്കൽ അർഥവ്യാപ്തി
  choice: മഹത്ത്വപ്പെടുത്തിക്കൊണ്ട്
  alternative: സ്തുതിച്ചുകൊണ്ട്
  rationale: മൂലപദത്തിലെ ‘മഹത്ത്വം നൽകുക’ എന്ന ആശയം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; ‘സ്തുതിക്കുക’ എന്ന സാധുവായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘സൗഖ്യം പ്രാപിച്ചു,’ ‘ഉച്ചസ്വരത്തിൽ,’ ‘മഹത്ത്വപ്പെടുത്തുക’ എന്നീ പ്രയോഗങ്ങൾ ഗൗരവമുള്ള തിരുവെഴുത്ത് ശൈലി നിലനിർത്തുമ്പോഴും പഴഞ്ചനായ ഭാഷ ഒഴിവാക്കുന്നു. അടിക്കുറിപ്പിന്റെ അടയാളം ബന്ധപ്പെട്ട ക്രിയാപ്രയോഗത്തിനോടു ചേർത്തിരിക്കുന്നു.
