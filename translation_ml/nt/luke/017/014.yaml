id: LUK.17.14
reference: Luke 17:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: ml
  text: 'അവരെ കണ്ടപ്പോൾ അവൻ അവരോടു പറഞ്ഞു: “പോയി നിങ്ങളെത്തന്നെ പുരോഹിതന്മാർക്കു കാണിക്കുക.[a]” അവർ പോകുന്നതിനിടയിൽ ശുദ്ധീകരിക്കപ്പെട്ടു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ശുദ്ധീകരിക്കപ്പെട്ട ഒരാളെ പുരോഹിതൻ പരിശോധിക്കണമെന്ന നിർദേശം ലേവ്യപുസ്തകം 14-ൽ കാണാം.
    reason: cross_reference
  - marker: b
    text: അഥവാ “അവർ ശുദ്ധരായി.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ശാരീരികമായ രോഗമുക്തിയെയും ആചാരപരമായ ശുദ്ധിയെയും സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: അവരെ കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം പ്രധാനക്രിയയായ εἶπεν-നോടു കാലബന്ധം പുലർത്തുന്നു. സന്ദർഭത്തിൽ നിന്നുള്ള കർമം ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി നൽകി.
- source_word: Πορευθέντες
  choice: പോയി
  rationale: തുടർന്നുള്ള ആജ്ഞാരൂപമായ ἐπιδείξατε-യോടൊപ്പം ആജ്ഞാസ്വഭാവത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന കൃദന്തരൂപമാണിത്. പ്രവർത്തനക്രമം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: നിങ്ങളെത്തന്നെ … കാണിച്ചുകൊടുക്കുക
  rationale: പുരോഹിതരുടെ പരിശോധനയ്ക്കായി തങ്ങളെത്തന്നെ കാണിക്കുക എന്ന നേരിട്ടുള്ള അർഥം വ്യക്തമായി നൽകുന്നു; ആത്മവാചകതയും സംരക്ഷിക്കുന്നു.
- source_word: τοῖς ἱερεῦσιν
  choice: പുരോഹിതന്മാർക്ക്
  rationale: തോരായിൽ നിർദേശിച്ച പരിശോധന നിർവഹിക്കുന്ന പുരോഹിതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. ബഹുവചനം നിലനിർത്തി.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: അവർ പോകുന്നതിനിടയിൽ
  rationale: ശുദ്ധീകരണം യാത്രയ്ക്കിടയിൽ സംഭവിച്ചു എന്ന സമകാലികബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκαθαρίσθησαν
  choice: ശുദ്ധരാക്കപ്പെട്ടു
  rationale: καθαρίζω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം നിലനിർത്തുകയും ശാരീരിക സൗഖ്യത്തിന്റെയും ആചാരപരമായ ശുദ്ധിയുടെയും അർഥസാധ്യതകൾ ഒരുമിച്ച് സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ത്വഗ്രോഗസന്ദർഭത്തിലെ ശുദ്ധീകരണഭാഷ
  choice: ശുദ്ധരാക്കപ്പെട്ടു
  alternative: രോഗമുക്തരായി / ശുദ്ധരായി
  rationale: ഗ്രീക്ക് പദം കേവലം രോഗസൗഖ്യം മാത്രമല്ല, പുരോഹിതപരിശോധനയുമായി ബന്ധപ്പെട്ട ആചാരപരമായ ശുദ്ധിയും സൂചിപ്പിക്കാം. കർമണിരൂപവും ഈ ഇരട്ട അർഥസാധ്യതയും പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ പ്രവർത്തനക്രമം, കർമണിപ്രയോഗം, ശാരീരിക-ആചാരപരമായ അർഥവ്യാപ്തി എന്നിവ സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കത്തോട് പൊരുത്തപ്പെടുന്ന സ്ഥലങ്ങളിലാണ് മലയാളത്തിൽ സൂചകങ്ങൾ ക്രമീകരിച്ചത്.
