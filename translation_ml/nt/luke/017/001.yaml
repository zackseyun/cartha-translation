id: LUK.17.1
reference: Luke 17:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ തന്റെ ശിഷ്യന്മാരോടു പറഞ്ഞു: “ഇടർച്ചകൾ[a] വരാതിരിക്കുക അസാധ്യമാണ്; എന്നാൽ അവ ആരിലൂടെ വരുന്നുവോ, അവന് അയ്യോ കഷ്ടം!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അപരാധങ്ങൾ,’ ‘പാപത്തിലേക്കു നയിക്കുന്ന കാരണങ്ങൾ,’ അല്ലെങ്കിൽ ‘പാപത്തിലേക്കുള്ള പ്രലോഭനങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ σκάνδαλα എന്ന പദം ഒരാളെ ധാർമികമായോ ആത്മീയമായോ തട്ടിവീഴ്ത്തുന്ന കാര്യങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: പിന്നെ അവൻ പറഞ്ഞു
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; ശക്തമായ വിരോധം ചേർക്കാതെ സ്വാഭാവികമായ സംഭവപുരോഗതി അറിയിക്കാൻ ‘പിന്നെ’ ഉപയോഗിച്ചു.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരോടു
  rationale: αὐτοῦ എന്ന ഉടമസ്ഥസൂചന നിലനിർത്തുകയും μαθηταί എന്നതിന് ലൂക്കോസിൽ പതിവായ ‘ശിഷ്യന്മാർ’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: അസാധ്യമാണ്
  rationale: ἀνένδεκτος എന്നത് അസാധ്യതയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള നിഷേധാത്മക infinitive ഘടനയോടൊപ്പം ഇടർച്ചകൾ വരാതിരിക്കാനുള്ള അസാധ്യതയാണ് പ്രസ്താവിക്കുന്നത്.
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: ഇടർച്ചകൾ വരാതിരിക്കുക
  rationale: μή സഹിതമുള്ള articular infinitive സംഭവിക്കാതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ നിഷേധഘടന നേരിട്ട് നിലനിർത്തി.
- source_word: σκάνδαλα
  choice: ഇടർച്ചകൾ
  rationale: σκάνδαλα എന്നതിലെ തട്ടിവീഴ്ത്തുന്ന വസ്തുവിന്റെ രൂപകം നിലനിർത്തുന്നു; അതോടൊപ്പം ധാർമികമോ ആത്മീയമോ ആയ വീഴ്ചയിലേക്കു നയിക്കുന്ന കാര്യങ്ങൾ എന്ന വിശാല അർഥവും തുറന്നുവെക്കുന്നു.
- source_word: πλὴν οὐαὶ
  choice: എന്നാൽ ... അയ്യോ കഷ്ടം
  rationale: πλήν അനിവാര്യതയുടെ പ്രസ്താവനയിൽനിന്ന് ഉത്തരവാദിയോടുള്ള ദുരന്തപ്രഖ്യാപനത്തിലേക്കുള്ള തിരിവ് സൂചിപ്പിക്കുന്നു; οὐαί എന്ന ഗൗരവമുള്ള മുന്നറിയിപ്പ് ‘അയ്യോ കഷ്ടം’ എന്നു നൽകി.
- source_word: δι’ οὗ
  choice: അവ ആരിലൂടെയാണോ വരുന്നത്, അയാൾക്ക്
  rationale: പുരുഷ ഏകവചനത്തിലുള്ള വ്യക്തിപരമായ പരാമർശവും ‘വഴി/മുഖാന്തരം’ എന്ന διάയുടെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔρχεται
  choice: അവ ... വരുന്നത്
  rationale: ഗ്രീക്കിൽ ക്രിയ ഏകവചനമാണെങ്കിലും ആശയപരമായി τὰ σκάνδαλα എന്ന ബഹുവചനത്തോടാണ് ബന്ധം; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘അവ’ എന്ന ബഹുവചനസൂചന ഉപയോഗിച്ചു.
theological_decisions:
- issue: ധാർമിക ഉപദേശത്തിലെ σκάνδαλα എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാനവാക്യത്തിൽ ‘ഇടർച്ചകൾ’
  alternative: കുറ്റങ്ങൾ; പാപകാരണങ്ങൾ; പാപത്തിലേക്കുള്ള പ്രലോഭനങ്ങൾ
  rationale: ഇത് വെറും മനോവിഷമമോ അപമാനമോ മാത്രമായി ചുരുക്കാതെ, മറ്റുള്ളവരെ ധാർമികമോ ആത്മീയമോ ആയ വീഴ്ചയിലേക്കു നയിക്കുന്ന കാര്യങ്ങൾ എന്ന രൂപകവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- issue: δι’ οὗ എന്ന ഏകവചന വ്യക്തിപരമായ പ്രയോഗം
  choice: ‘ആരിലൂടെയാണോ ... അയാൾക്ക്’ എന്ന പ്രതിനിധി ഏകവചനം
  alternative: ‘ആ മനുഷ്യനു’ അല്ലെങ്കിൽ ലിംഗം വ്യക്തമാക്കാത്ത കൂടുതൽ പൊതുവായ ബഹുവചനരൂപം
  rationale: മൂലപാഠത്തിലെ വ്യക്തിഗത ഉത്തരവാദിത്വവും ഏകവചനബലവും നിലനിർത്തുന്നു; അനാവശ്യമായ വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇടർച്ചകൾ’ എന്ന ദൃശ്യരൂപകം പ്രധാനവാക്യത്തിൽ നിലനിർത്തി; അതിന്റെ ധാർമിക-ആത്മീയ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
