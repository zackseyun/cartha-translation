source:
  edition: SBLGNT
  text: κατὰ ⸂τὰ αὐτὰ⸃ ἔσται ᾗ ἡμέρᾳ ὁ υἱὸς τοῦ ἀνθρώπου ἀποκαλύπτεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: ml
  text: മനുഷ്യപുത്രൻ വെളിപ്പെടുന്ന ദിവസം ഇതുപോലെതന്നെയായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതുപോലെയായിരിക്കും” അല്ലെങ്കിൽ “അതേ രീതിയിലായിരിക്കും.” ഈ ഗ്രീക്ക് പ്രയോഗം മുമ്പു പറഞ്ഞ ഉദാഹരണങ്ങളിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: ഇതുപോലെതന്നെ
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം മുൻവാക്യങ്ങളിലെ നോഹയുടെയും ലോത്തിന്റെയും കാലത്തെ ഉദാഹരണങ്ങളിലേക്കു തിരിഞ്ഞുനോക്കി ‘അതേ രീതിയിൽ’ എന്ന താരതമ്യാർഥം നൽകുന്നു. ἔσταιയോടൊപ്പം ചേർത്തപ്പോൾ ‘ഇതുപോലെതന്നെയായിരിക്കും’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: εἰμίയുടെ ഭാവികാലരൂപത്തിന്റെ സമയസൂചനയും മുൻ ഉദാഹരണങ്ങളോടുള്ള താരതമ്യവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ᾗ ἡμέρᾳ
  choice: ദിവസത്തിൽ
  rationale: ആപേക്ഷിക ദത്തിവിഭക്തി ഇവിടെ കാലസൂചകമാണ്. മലയാളത്തിലെ ‘വെളിപ്പെടുന്ന ദിവസത്തിൽ’ എന്ന ഘടന ‘അവൻ വെളിപ്പെടുന്ന ദിവസം’ എന്ന സമയനിർദേശം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിൽ യേശു ഉപയോഗിക്കുന്ന സ്ഥിരമായ പദവിയും ദാനിയേൽ 7-നോടുള്ള അന്ത്യകാല-മശീഹാ ബന്ധവും സംരക്ഷിക്കുന്ന പരമ്പരാഗത മലയാളരൂപമാണിത്.
- source_word: ἀποκαλύπτεται
  choice: വെളിപ്പെടുന്ന
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിന്റെ വെളിപ്പെടുത്തൽ/പ്രത്യക്ഷീകരണം എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘വരുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി മൂലപദത്തിൽ ഇല്ലാത്ത ഗതിയുടെ ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന അന്ത്യകാല പദവിയുടെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: പരമ്പരാഗത രൂപം ദാനിയേൽ 7-ലേക്കുള്ള അന്തർപാഠബന്ധവും സുവിശേഷങ്ങളിലെ തിരിച്ചറിയാവുന്ന മശീഹാ-അന്ത്യകാല ധ്വനിയും നിലനിർത്തുന്നു.
- issue: അന്ത്യകാലസന്ദർഭത്തിലെ ἀποκαλύπτεταιയുടെ ശക്തി
  choice: വെളിപ്പെടുന്ന
  alternative: വരുന്ന / പ്രത്യക്ഷപ്പെടുന്ന
  rationale: മൂലക്രിയ വരവിനെക്കാൾ വെളിപ്പെടുത്തലിനെയോ മറനീക്കലിനെയോ നേരിട്ട് സൂചിപ്പിക്കുന്നു. ‘വെളിപ്പെടുന്ന’ എന്നത് ആ പദാർഥവും കർമണിഭാവവും അമിതവ്യാഖ്യാനം കൂടാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മനുഷ്യപുത്രൻ’ എന്ന സ്ഥാപിത ബൈബിൾ പദവി നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക ഊന്നലനുസരിച്ച് ക്രമപ്പെടുത്തി.
