id: LUK.17.4
reference: Luke 17:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἑπτάκις τῆς ἡμέρας ⸀ἁμαρτήσῃ εἰς σὲ καὶ ⸀ἑπτάκις ἐπιστρέψῃ ⸂πρὸς σὲ⸃ λέγων· Μετανοῶ, ἀφήσεις αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: ml
  text: ഒരു ദിവസത്തിൽ അവൻ നിന്നോടു ഏഴു പ്രാവശ്യം പാപം ചെയ്യുകയും ഏഴു പ്രാവശ്യം നിന്റെ അടുക്കൽ മടങ്ങിവന്ന്[a], ‘ഞാൻ മാനസാന്തരപ്പെടുന്നു’ എന്നു പറയുകയും ചെയ്താൽ, നീ അവനോടു ക്ഷമിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ അടുക്കലേക്കു തിരിഞ്ഞ്.’ ഈ സന്ദർഭത്തിൽ ക്രിയയ്ക്ക് ‘മടങ്ങിവരുക’ എന്നും ‘തിരിയുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ ഇവിടെ ഭാവികാലരൂപമാണ്: അക്ഷരാർഥത്തിൽ, ‘നീ അവനോടു ക്ഷമിക്കും.’ ഈ സന്ദർഭത്തിൽ അതിന് കല്പനയുടെയോ ബാധ്യതയുടെയോ ശക്തിയുണ്ട്.'
    reason: grammatical_force
lexical_decisions:
- source_word: ἑπτάκις
  choice: ഏഴു പ്രാവശ്യം
  rationale: ആവർത്തിച്ചുള്ള പ്രവൃത്തിയെ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ‘ഏഴിരട്ടി’ എന്ന അർഥം വരാതിരിക്കാൻ ഇത് തിരഞ്ഞെടുത്തു.
- source_word: τῆς ἡμέρας
  choice: ഒരു ദിവസത്തിൽ
  rationale: ഒരു ദിവസത്തിന്റെ പരിധിക്കുള്ളിൽ എന്ന കാലാർഥമുള്ള ജനിറ്റീവ് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഒരു’ ഗ്രീക്കിൽ പ്രത്യേകം ഇല്ലെങ്കിലും അനിശ്ചിതമായ ഏകവചന ദിനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: നിന്നോടു ... പാപം ചെയ്യുക
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്ന വ്യക്തിക്കെതിരായ പാപം/കുറ്റം എന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: നിന്റെ അടുക്കൽ മടങ്ങിവരുക
  rationale: ἐπιστρέφω എന്നതിന് ‘മടങ്ങിവരുക’ എന്നും ‘തിരിയുക’ എന്നും അർഥസാധ്യതയുണ്ട്; ആവർത്തിച്ച കുറ്റത്തിനു ശേഷം വീണ്ടും സമീപിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘മടങ്ങിവരുക’ യോജിക്കുന്നു, മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: λέγων
  choice: എന്നു പറയുകയും
  rationale: ഗ്രീക്കിലെ വർത്തമാന കൃതന്തത്തിന്റെ അനുബന്ധപ്രവൃത്തി മലയാളവാക്യഘടനയിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: Μετανοῶ
  choice: ഞാൻ മാനസാന്തരപ്പെടുന്നു
  rationale: വെറും ദുഃഖപ്രകടനമല്ല, മനോഭാവത്തിലും വഴിയിലും വരുന്ന മാറ്റം സൂചിപ്പിക്കുന്ന μετανοέωയുടെ നൈതിക-ആത്മീയ ഭാരം നിലനിർത്തുന്നു.
- source_word: ἀφήσεις αὐτῷ
  choice: നീ അവനോടു ക്ഷമിക്കണം
  rationale: ഭാവികാലരൂപം ഈ പ്രബോധനസന്ദർഭത്തിൽ കല്പനയുടെയോ ബാധ്യതയുടെയോ ശക്തിയോടെ വരുന്നതിനാൽ, ആ നിർദേശബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀφήσεις എന്ന ഭാവികാല സൂചകരൂപത്തിന്റെ ശക്തി
  choice: ‘നീ അവനോടു ക്ഷമിക്കണം’ എന്ന നിർദേശമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘നീ അവനോടു ക്ഷമിക്കും’ എന്ന പ്രവചനാത്മക ഭാവികാല വായന.
  rationale: യേശുവിന്റെ ശിഷ്യോപദേശസന്ദർഭത്തിൽ ഈ ഭാവികാലരൂപം കല്പനയോ ബാധ്യതയോ പ്രകടിപ്പിക്കുന്നു. എങ്കിലും രൂപപരമായ ഭാവികാലസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: Μετανοῶ എന്നതിന്റെ അർഥം
  choice: ‘ഞാൻ മാനസാന്തരപ്പെടുന്നു’.
  alternative: ‘എനിക്ക് ദുഃഖമുണ്ട്’ അല്ലെങ്കിൽ ‘ഞാൻ മനസ്സുമാറ്റുന്നു’.
  rationale: മൂലപദം വെറും ഖേദത്തേക്കാൾ ശക്തമായ തിരിച്ചുവരവും മനോഭാവമാറ്റവും സൂചിപ്പിക്കുന്നു; അതിനാൽ സാധാരണ ബൈബിൾ-മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന ‘മാനസാന്തരപ്പെടുന്നു’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവണ്ണം ദിഗ്നതയുള്ള നേരിട്ടുള്ള ശൈലി സ്വീകരിച്ചു. ‘മാനസാന്തരപ്പെടുന്നു’ എന്ന പദം മൂലത്തിലെ നൈതിക-ആത്മീയ ഭാരം നിലനിർത്തുന്നതിനായി ഉപയോഗിച്ചു; അസ്വാഭാവികമായ അതിപദാനുപദ വിവർത്തനം ഒഴിവാക്കി.
