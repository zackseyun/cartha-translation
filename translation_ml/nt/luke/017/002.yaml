source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: ml
  text: ഈ ചെറിയവരിൽ ഒരാളെ ഇടറാൻ ഇടയാക്കുന്നതിനെക്കാൾ, ഒരു തിരികല്ല് അവന്റെ കഴുത്തിൽ കെട്ടി അവനെ കടലിൽ എറിഞ്ഞുകളയുന്നതാണ് അവനു നല്ലത്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ കൂടുതൽ വ്യക്തമായി, “ഒരു വലിയ തിരികല്ല്.” ഗ്രീക്ക് പ്രയോഗം തിരിയിൽ ഉപയോഗിച്ചിരുന്ന ഭാരമേറിയ കല്ലിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഈ ചെറിയവരിൽ ഒരാളെ പാപം ചെയ്യാൻ ഇടയാക്കുക.” ഗ്രീക്ക് ക്രിയയിൽ ഒരാളെ പാപത്തിലേക്കോ ആത്മീയ നാശത്തിലേക്കോ വീഴാൻ കാരണമാകുക എന്ന അർത്ഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: അവനു നല്ലത്
  rationale: ഒരു ഫലം മറ്റൊന്നിനെക്കാൾ അഭികാമ്യമാണെന്ന താരതമ്യഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λίθος μυλικὸς
  choice: ഒരു തിരികല്ല്
  rationale: ധാന്യം അരയ്ക്കുന്ന തിരിയുടെ കല്ലിനെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളപദം; വലിയ തിരികല്ലെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: അവന്റെ കഴുത്തിൽ കെട്ടി
  rationale: കഴുത്തിനു ചുറ്റും കല്ല് ഉറപ്പിച്ചിരിക്കുന്ന അവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: അവനെ കടലിൽ എറിഞ്ഞുകളയുന്നത്
  rationale: പൂർത്തിയായ ശക്തമായ പ്രവൃത്തിയുടെ ഭാവം ‘എറിഞ്ഞുകളയുക’ എന്ന പ്രയോഗം നൽകുന്നു.
- source_word: σκανδαλίσῃ
  choice: പാപത്തിലേക്കു വീഴാൻ ഇടയാക്കുക
  rationale: വീഴ്ചയുടെ രൂപകവും പാപത്തിലേക്കോ ആത്മീയ നാശത്തിലേക്കോ നയിക്കുന്ന അർത്ഥവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; ചുരുങ്ങിയ പദപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: ഈ ചെറിയവരിൽ ഒരാളെ
  rationale: പ്രായമോ വിശ്വാസിസമൂഹമോ എന്നു നിർണയിക്കാതെ ഗ്രീക്കിലെ വിശാലവും അവ്യക്തവുമായ സൂചന നിലനിർത്തുന്നു.
- source_word: ἢ ἵνα
  choice: …ഇടയാക്കുന്നതിനെക്കാൾ
  rationale: രണ്ട് ഫലങ്ങൾ തമ്മിലുള്ള താരതമ്യം മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ഈ ചെറിയവർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ‘ഈ ചെറിയവർ’ എന്ന് പൊതുവായി നിലനിർത്തുക
  alternative: ഈ കുട്ടികൾ; ഈ എളിയ വിശ്വാസികൾ/ശിഷ്യർ
  rationale: വാക്യം ഈ കൂട്ടത്തെ കുട്ടികളായോ വിശ്വാസികളായോ മാത്രം വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനസാധ്യത ചുരുക്കാതെ മൂലത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: σκανδαλίζω എന്നതിന്റെ ആത്മീയ അർത്ഥം
  choice: ‘പാപത്തിലേക്കു വീഴാൻ ഇടയാക്കുക’
  alternative: ഇടറിക്കുക; കെണിയിലാക്കുക
  rationale: വെറും അസ്വസ്ഥതയോ അപമാനമോ എന്ന ലഘുവായ അർത്ഥം ഒഴിവാക്കി, പാപത്തിലേക്കോ ആത്മീയ നാശത്തിലേക്കോ നയിക്കുന്ന ഗൗരവം പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ചെറിയവർ’ എന്ന പ്രയോഗം മൂലത്തിലെ പരാമർശവ്യാപ്തി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനു ശേഷം ചേർത്തിരിക്കുന്നു.
