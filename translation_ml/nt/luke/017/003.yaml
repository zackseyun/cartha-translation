id: LUK.17.3
reference: Luke 17:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: ml
  text: നിങ്ങളെക്കുറിച്ചു ജാഗ്രത പാലിക്കുക. നിന്റെ സഹോദരൻ[b] പാപം ചെയ്താൽ[a], അവനെ ശാസിക്കുക; അവൻ മാനസാന്തരപ്പെട്ടാൽ, അവനോടു ക്ഷമിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “നിന്റെ സഹോദരൻ നിനക്കെതിരെ പാപം ചെയ്താൽ, അവനെ ശാസിക്കുക” എന്നു വായിക്കുന്നു.'
    reason: textual_variant
  - marker: b
    text: “സഹോദരൻ” എന്നത് ഗ്രീക്കിൽ പുല്ലിംഗ ഏകവചനമാണ്; സന്ദർഭത്തിൽ ഇത് ഒരു സഹശിഷ്യനെ കൂടുതൽ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം തുടർച്ചയായ ജാഗ്രതയെ ആവശ്യപ്പെടുന്നു. മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന പ്രയോഗമാണിത്.
- source_word: ἑαυτοῖς
  choice: നിങ്ങളെത്തന്നെ
  rationale: ആത്മവാചക സർവനാമത്തിന്റെ അർഥം നേരിട്ട് നിലനിർത്തുന്നു; വ്യക്തിപരമായ ആത്മജാഗ്രതയോ സമൂഹത്തിനുള്ളിലെ പരസ്പര ജാഗ്രതയോ എന്ന സാധ്യത അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: ἁμάρτῃ
  choice: പാപം ചെയ്താൽ
  rationale: SBLGNT പാഠത്തിൽ ‘നിനക്കെതിരെ’ എന്ന കർമസൂചന ഇല്ലാത്തതിനാൽ അതു പ്രധാനപാഠത്തിൽ ചേർക്കുന്നില്ല. ഉപാധിവാക്യത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ ἀδελφός σου
  choice: നിന്റെ സഹോദരൻ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനരൂപം കൃത്യമായി നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് ഒരു സഹശിഷ്യനെ വിശാലമായി സൂചിപ്പിക്കാമെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπιτίμησον
  choice: അവനെ ശാസിക്കുക
  rationale: നേരിട്ടും ഗൗരവത്തോടെയും തെറ്റ് ചൂണ്ടിക്കാണിക്കുന്ന ആജ്ഞയുടെ ശക്തി ‘ശാസിക്കുക’ നിലനിർത്തുന്നു; വെറും ഉപദേശമോ മുന്നറിയിപ്പോ ആയി മൃദൂകരിക്കുന്നില്ല.
- source_word: μετανοήσῃ
  choice: മാനസാന്തരപ്പെട്ടാൽ
  rationale: ധാർമികവും ബന്ധപരവുമായ തിരിഞ്ഞുവരവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും മാന്യവുമായ മലയാള പദമാണ്; വെറും ഖേദമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἄφες
  choice: അവനോടു ക്ഷമിക്കുക
  rationale: വ്യക്തികൾ തമ്മിലുള്ള ബന്ധസന്ദർഭത്തിൽ ἀφίημι എന്നതിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ അർഥം ‘ക്ഷമിക്കുക’ എന്നതാണ്.
theological_decisions:
- issue: ‘പാപം ചെയ്താൽ’ എന്നതിനു ശേഷം ‘നിനക്കെതിരെ’ ചേർക്കണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘നിനക്കെതിരെ’ ഒഴിവാക്കി
  alternative: നിന്റെ സഹോദരൻ നിനക്കെതിരെ പാപം ചെയ്താൽ, അവനെ ശാസിക്കുക
  rationale: നൽകിയിരിക്കുന്ന SBLGNT ഗ്രീക്ക് പാഠത്തിൽ εἰς σέ എന്നോ അതിനു തുല്യമായ മറ്റൊരു പ്രയോഗമോ ഇല്ല. അതിനാൽ വിശാലമായ അർഥം പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും ദീർഘവായനയെ പാഠഭേദമായി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
- issue: ἀδελφός എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: നിന്റെ സഹോദരൻ
  alternative: നിന്റെ സഹോദരനോ സഹോദരിയോ / നിന്റെ സഹവിശ്വാസി
  rationale: ഗ്രീക്ക് പദം പുല്ലിംഗ ഏകവചനമാണ്. അതിന്റെ രൂപസൂചന പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; ശിഷ്യസമൂഹത്തിലെ സഹശിഷ്യരെ പൊതുവായി ഉൾക്കൊള്ളാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സൂക്ഷിച്ചുകൊള്ളുക’, ‘ശാസിക്കുക’, ‘മാനസാന്തരപ്പെടുക’, ‘ക്ഷമിക്കുക’ എന്നീ പദങ്ങൾ മുന്നറിയിപ്പ്, തിരുത്തൽ, മനോതിരിവ്, ക്ഷമ എന്നീ ആശയങ്ങളുടെ ശക്തി നിലനിർത്തുന്നു. അടിക്കുറിപ്പുകൾ അവ സൂചിപ്പിക്കുന്ന പദങ്ങളോടു ചേർത്ത് [a], [b] ആയി പ്രധാനപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
