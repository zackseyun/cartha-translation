  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: ml
  text: 'അപ്പൊസ്തലന്മാർ കർത്താവിനോടു പറഞ്ഞു: “ഞങ്ങൾക്ക് വിശ്വാസം വർധിപ്പിച്ചുതരണമേ.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾക്ക് വിശ്വാസം കൂട്ടിച്ചേർക്കണമേ.” ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘കൂട്ടിച്ചേർക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ ‘വർധിപ്പിക്കുക’ എന്നാണ് സ്വാഭാവികമായ അർഥം.
    reason: lexical_alternative
  - marker: b
    text: ‘വിശ്വാസം’ എന്നത് ‘ആശ്രയം’ എന്നും മനസ്സിലാക്കാം; ഈ നാമപദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘വിശ്വസ്തത’ എന്നും അർഥമുണ്ടാകാം, എന്നാൽ ഇവിടെ അതിനുള്ള സാധ്യത കുറവാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: (പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല)
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ വാക്യാരംഭത്തിലെ ‘καί’ പലപ്പോഴും പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല; സംഭവബന്ധം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: εἶπαν
  choice: പറഞ്ഞു
  rationale: ഏകകാലികമായ ഭൂതകാല ആഖ്യാനക്രിയയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: οἱ ἀπόστολοι
  choice: അപ്പൊസ്തലന്മാർ
  rationale: യേശു നിയോഗിച്ച ശിഷ്യവൃന്ദത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാള ബൈബിൾ പദമാണിത്.
- source_word: τῷ κυρίῳ
  choice: കർത്താവിനോട്
  rationale: κύριος എന്ന പദത്തിന്റെ ബഹുമാനപരവും ക്രിസ്തുശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്ന സ്ഥാപിത വിവർത്തനം.
- source_word: Πρόσθες
  choice: വർധിപ്പിക്കണമേ
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘കൂട്ടിച്ചേർക്കുക’ എന്നാണെങ്കിലും πίστιν-നോടൊപ്പം ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഉള്ള വിശ്വാസം വർധിപ്പിക്കണമെന്ന അഭ്യർഥനയാണ്; ‘-ണമേ’ അപേക്ഷയുടെ ഭാവം മാന്യമായി നൽകുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങളുടെ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥമായി ‘ഞങ്ങൾക്ക്’ എന്ന ദത്തിവിഭക്തിയാണെങ്കിലും ‘വിശ്വാസം വർധിപ്പിക്കുക’ എന്ന മലയാള പ്രയോഗത്തിൽ ഉടമസ്ഥരൂപം സ്വാഭാവികമാണ്.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: ഇവിടെ ദൈവത്തിലുള്ള വിശ്വാസം/ആശ്രയം എന്ന അർഥത്തിന് ഏറ്റവും സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാള പദം.
theological_decisions:
- issue: യേശുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: ‘കർത്താവ്’ ആദരസൂചകമായ അഭിസംബോധനയും ലൂക്കോസിലെ ക്രിസ്തുശാസ്ത്രപരമായ അനുരണനവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘യജമാനൻ’ ആ വ്യാപ്തി ചുരുക്കാം.
- issue: πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം / വിശ്വസ്തത
  rationale: അപ്പൊസ്തലന്മാർ തങ്ങളുടെ വിശ്വാസം കൂടുതലാക്കണമെന്നു അപേക്ഷിക്കുന്നതാണ് സന്ദർഭത്തിലെ ഏറ്റവും സ്വാഭാവിക വായന. ‘ആശ്രയം’ അടുത്ത അർഥസാധ്യതയാണ്; ‘വിശ്വസ്തത’ പദത്തിന്റെ അർഥപരിധിയിൽപ്പെടുന്നുവെങ്കിലും ഇവിടെ സാധ്യത കുറവാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. അഭ്യർഥനയുടെ ആദരഭാവം ‘വർധിപ്പിക്കണമേ’ എന്ന രൂപത്തിൽ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന അഭ്യർഥനയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
