id: LUK.12.4
reference: Luke 12:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: ml
  text: 'എന്നാൽ, എന്റെ സുഹൃത്തുക്കളായ നിങ്ങളോടു ഞാൻ പറയുന്നു: ശരീരത്തെ കൊല്ലുകയും അതിനുശേഷം ഇനിയും മറ്റൊന്നും ചെയ്യാൻ കഴിയാതിരിക്കുകയും ചെയ്യുന്നവരെ ഭയപ്പെടരുത്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: എന്നാൽ ... ഞാൻ പറയുന്നു
  rationale: δέ ഇവിടെ പ്രസംഗത്തിലെ നേരിയ മാറ്റമോ വിരുദ്ധഭാവമോ സൂചിപ്പിക്കുന്നു. ‘എന്നാൽ’ അതിനെ അതിശയിപ്പിക്കാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: എന്റെ സുഹൃത്തുക്കളായ നിങ്ങളോട്
  rationale: τοῖς φίλοις μου എന്നത് ὑμῖν-നെ വിശദീകരിക്കുന്ന സമാനാധികരണ പ്രയോഗമാണ്; അഭിസംബോധനയിലെ സ്നേഹവും ‘നിങ്ങൾ’ എന്ന സർവനാമവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: μὴ φοβηθῆτε
  choice: ഭയപ്പെടരുത്
  rationale: μή ചേർന്ന aorist subjunctive ഇവിടെ വിലക്കാണ്. ആ അർഥം ആധുനിക മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπὸ τῶν ἀποκτεινόντων
  choice: കൊല്ലുന്നവരെ
  rationale: φοβέομαι-നോടൊപ്പമുള്ള ἀπό ഭയത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; present participle ഒരു പൊതുവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കൊല്ലുന്നവർ’ അനുയോജ്യം.
- source_word: τὸ σῶμα
  choice: ശരീരത്തെ
  rationale: ഇവിടെ σῶμα ഭൗതിക ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മൂലപാഠത്തിലെ ലളിതമായ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: καὶ μετὰ ταῦτα
  choice: അതിനു ശേഷം
  rationale: μετὰ ταῦτα കാലക്രമം സൂചിപ്പിക്കുന്നു; ശരീരത്തെ കൊല്ലുന്നതിനു ശേഷമുള്ള ഘട്ടം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: കൂടുതലായി ഒന്നും ചെയ്യാൻ കഴിയാതിരിക്കുന്നവർ
  rationale: പ്രയോഗം അവരുടെ തുടർന്നുള്ള പ്രവർത്തനപരിധിയില്ലായ്മയെ സൂചിപ്പിക്കുന്നു. περισσότερόν τι എന്നതിലെ ‘കൂടുതൽ/ഇനിയും എന്തെങ്കിലും’ എന്ന ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശാരീരിക മരണത്തിനുശേഷമുള്ള മനുഷ്യാധികാരത്തിന്റെ പരിധി
  choice: ശരീരത്തെ കൊന്നശേഷം പീഡകർക്ക് കൂടുതലായി ഒന്നും ചെയ്യാൻ കഴിയില്ലെന്നു മാത്രം പറയുന്നു.
  alternative: അവർക്ക് ആത്മാവിനെ കൊല്ലാൻ കഴിയില്ലെന്ന് വ്യാഖ്യാനപരമായി കൂട്ടിച്ചേർക്കുക.
  rationale: അടുത്ത വാക്യം ദൈവത്തിന്റെ അധികാരവുമായി താരതമ്യം ചെയ്യുന്നുണ്ടെങ്കിലും ഈ വാക്യം ആത്മാവിനെ വ്യക്തമായി പരാമർശിക്കുന്നില്ല. അതിനാൽ തുടർന്നുള്ള വാക്യത്തിലെ ആശയം ഇവിടെ ചേർക്കാതെ മൂലപാഠത്തിന്റെ പരിധിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘എന്റെ സുഹൃത്തുക്കളായ നിങ്ങളോട്’ എന്ന രൂപം സ്നേഹപൂർവമായ അഭിസംബോധനയും സമാനാധികരണ ഘടനയും നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാപരമോ വിഭാഗീയമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
