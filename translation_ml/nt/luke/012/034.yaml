reference: Luke 12:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ml
  text: എന്തെന്നാൽ, നിങ്ങളുടെ നിധി എവിടെയാണോ, അവിടെ നിങ്ങളുടെ ഹൃദയവും ആയിരിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: എവിടെയാണോ
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഉപവാക്യം സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ἐκεῖയോടുള്ള ‘എവിടെ… അവിടെ…’ എന്ന പരസ്പരബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻപത്തെ ഉപദേശത്തിന്റെ കാരണം വിശദീകരിക്കുന്ന ബന്ധം വ്യക്തമായും മാന്യമായ ആധുനിക മലയാളത്തിലും പ്രകടിപ്പിക്കുന്നു.
- source_word: θησαυρός
  choice: നിധി
  rationale: ഭൗതിക സമ്പത്തിന്റെയും ഒരാൾ ഏറ്റവും വിലമതിക്കുന്നതിന്റെയും അർഥസാധ്യതകൾ നിലനിർത്തുന്ന നേരിട്ടുള്ള, സ്വാഭാവിക പദമാണ്.
- source_word: καρδία
  choice: ഹൃദയം
  rationale: ആഗ്രഹം, സ്നേഹം, പ്രതിബദ്ധത, ആന്തരിക ദിശാബോധം എന്നിവയുടെ കേന്ദ്രം എന്ന വിശാലമായ ബൈബിൾസംബന്ധമായ അർഥം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: ഗ്രീക്കിലെ ‘എവിടെ… അവിടെ…’ എന്ന ഘടന നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -വും
  rationale: നിധിയോടൊപ്പം ഹൃദയവും അതേ ഇടത്തായിരിക്കും എന്ന കൂട്ടിച്ചേർക്കൽ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: ഗ്രീക്കിലെ ഭാവികാലത്തെ നിലനിർത്തുകയും ഭാവിഫലത്തെയും സുനിശ്ചിതമായ പൊതുസത്യത്തെയും പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: രണ്ടിടത്തുമുള്ള രണ്ടാംപുരുഷ ബഹുവചന ഉടമസ്ഥരൂപത്തെ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: ‘ഹൃദയം’ എന്ന പദത്തിന്റെ മനുഷ്യസ്വഭാവസംബന്ധമായ അർഥം
  choice: സ്നേഹത്തിന്റെയും ആഗ്രഹത്തിന്റെയും പ്രതിബദ്ധതയുടെയും ആന്തരിക കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന ‘ഹൃദയം’ നിലനിർത്തി.
  alternative: ‘ആഗ്രഹങ്ങൾ’, ‘മനസ്സ്’, അല്ലെങ്കിൽ ‘അന്തരംഗം’ എന്നിങ്ങനെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഒരാൾ വിലമതിക്കുന്നതിനെ അയാളുടെ ആന്തരിക ദിശാബോധം പിന്തുടരുന്നു എന്ന പഴഞ്ചൊല്ലുസദൃശമായ ആശയം വാക്യം നൽകുന്നു. ‘ഹൃദയം’ അർഥത്തെ ഒരു മനഃശാസ്ത്രഘടകത്തിലേക്ക് ചുരുക്കാതെ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ തുടർച്ച സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വിശദീകരണബന്ധം, ‘എവിടെ… അവിടെ…’ ഘടന, ഭാവികാലം, ‘നിധി/ഹൃദയം’ എന്നീ മുഖ്യ രൂപകങ്ങൾ എന്നിവ സംരക്ഷിച്ചു.
