source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: ml
  text: നിങ്ങളുടെ സ്വത്തുക്കൾ വിറ്റ് ദരിദ്രർക്കു ദാനം നൽകുക[a]. നിങ്ങൾക്കായി പഴകിപ്പോകാത്ത പണസഞ്ചികൾ ഉണ്ടാക്കുക—കള്ളൻ അടുത്തുവരുകയോ പുഴു നശിപ്പിക്കുകയോ ചെയ്യാത്ത സ്വർഗങ്ങളിലെ[b] ഒരിക്കലും തീർന്നുപോകാത്ത നിധി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭിക്ഷാദാനം നൽകുക.” ഗ്രീക്ക് പദം ആവശ്യക്കാർക്കു നൽകുന്നതിലൂടെ പ്രകടമാകുന്ന കരുണാപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സ്വർഗത്തിൽ.” ഗ്രീക്കിൽ “സ്വർഗങ്ങളിൽ” എന്ന ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε
  choice: വിൽക്കുക
  rationale: നിർണായകമായ പ്രവർത്തനത്തിന് ആഹ്വാനം ചെയ്യുന്ന ബഹുവചന ആജ്ഞാരൂപം; സന്ദർഭം ആവശ്യപ്പെടാത്ത സമ്പൂർണ വിറ്റൊഴിക്കൽ എന്ന അധിക അർഥം ചേർക്കാതെ ലളിതമായി പരിഭാഷപ്പെടുത്തി.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: നിങ്ങളുടെ സ്വത്തുക്കൾ
  rationale: ഒരാളുടെ ഉടമസ്ഥതയിലുള്ള വസ്തുവകകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വിശാലവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: δότε ἐλεημοσύνην
  choice: ദരിദ്രർക്കു ദാനം നൽകുക[a]
  rationale: ἐλεημοσύνη ആവശ്യക്കാരോടുള്ള കരുണ ദാനത്തിലൂടെ പ്രകടിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ദാനത്തിന്റെ ലക്ഷ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: ποιήσατε ἑαυτοῖς
  choice: നിങ്ങൾക്കായി ... ഉണ്ടാക്കുക
  rationale: പ്രവർത്തനം അവരവരുടെ നന്മയ്ക്കായി ചെയ്യുന്നതാണെന്ന ആത്മവാചക ദത്തിവിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: βαλλάντια μὴ παλαιούμενα
  choice: പഴകിപ്പോകാത്ത പണസഞ്ചികൾ
  rationale: പണം സൂക്ഷിക്കുന്ന സഞ്ചി എന്ന മൂർത്തമായ രൂപകം നിലനിർത്തുകയും παλαιόωയുടെ പഴകുക/ജീർണിക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: ഒരിക്കലും തീർന്നുപോകാത്ത നിക്ഷേപം
  rationale: ἀνέκλειπτος സൂചിപ്പിക്കുന്ന പരാജയപ്പെടാത്തതും ക്ഷയിച്ചുതീരാത്തതുമായ സ്വഭാവം വ്യക്തമായി പകരുന്നു.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിൽ[b]
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം നിലനിർത്തുന്നു; മലയാളത്തിൽ മനസ്സിലാക്കാവുന്ന രീതിയിൽ ഉറവിടഭാഷയുടെ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: കള്ളൻ അടുത്തുവരുകയോ ... ചെയ്യാത്ത
  rationale: ἐγγίζωയുടെ സ്ഥലപരമായ ‘അടുത്തുവരുക’ എന്ന ദൃശ്യബിംബം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: പുഴു നശിപ്പിക്കുകയോ ചെയ്യാത്ത
  rationale: σής വസ്ത്രം തിന്നുനശിപ്പിക്കുന്ന പുഴുവിനെയും διαφθείρω നശിപ്പിക്കൽ/കേടുവരുത്തലിനെയും സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകി.
theological_decisions:
- issue: ἐλεημοσύνην എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ദരിദ്രർക്കു ദാനം നൽകുക
  alternative: ദാനധർമം ചെയ്യുക / ഭിക്ഷാദാനം നൽകുക
  rationale: ഇത് പൊതുവായ കരുണാഭാവം മാത്രമല്ല, ആവശ്യക്കാർക്കു നൽകുന്ന മൂർത്തമായ ദാനപ്രവൃത്തിയാണ്. ലക്ഷ്യം വ്യക്തമാക്കുമ്പോഴും പാഠത്തിൽ ഇല്ലാത്ത വിപുലമായ സാമ്പത്തിക പദ്ധതി ഇതിൽ ചേർക്കുന്നില്ല.
- issue: ἐν τοῖς οὐρανοῖς എന്ന ബഹുവചനത്തിന്റെ പരിഭാഷ
  choice: സ്വർഗങ്ങളിൽ
  alternative: സ്വർഗത്തിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം യഹൂദ-പുതിയനിയമ ഭാഷാശൈലിയുടെ ഭാഗമായതിനാൽ അത് നിലനിർത്തി; ഏകവചനവും അർഥസാധ്യമായ സ്വാഭാവിക മലയാളരൂപമാണ്.
- issue: പണസഞ്ചിയും നിക്ഷേപവും തമ്മിലുള്ള ബന്ധം
  choice: ഡാഷിലൂടെ വിശദീകരണസമാനാധികരണം
  alternative: രണ്ട് സ്വതന്ത്ര ആജ്ഞകളായി വായിക്കുക
  rationale: ‘പഴകിപ്പോകാത്ത പണസഞ്ചികൾ’ എന്ന രൂപകത്തെ ‘തീർന്നുപോകാത്ത നിക്ഷേപം’ വിശദീകരിക്കുന്നതായി ഗ്രീക്ക് വാക്യഘടന സൂചിപ്പിക്കുന്നു; ഡാഷ് ഈ ബന്ധം വ്യക്തമാക്കുന്നു, എന്നാൽ രൂപകത്തെ ലയിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പണസഞ്ചികൾ’ എന്ന മൂർത്തരൂപകവും ‘സ്വർഗങ്ങളിൽ’ എന്ന ഉറവിടഭാഷയിലെ ബഹുവചനവും സംരക്ഷിച്ചു; ദാനത്തെ പഴയ ശൈലിയിലുള്ള പദത്തിൽ മാത്രം ഒതുക്കാതെ അതിന്റെ സാമൂഹിക ലക്ഷ്യം വ്യക്തമാക്കി.
