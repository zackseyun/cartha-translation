  text: ἡ ⸀γὰρ ψυχὴ πλεῖόν ἐστιν τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: ml
  text: കാരണം, ജീവൻ ആഹാരത്തെക്കാൾ വിലയേറിയതാണ്[a]; ശരീരം വസ്ത്രത്തെക്കാൾ വിലയേറിയതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘ആത്മാവ്’: ψυχή എന്ന ഗ്രീക്കുപദത്തിന് ‘ജീവൻ’, ‘സ്വത്വം’, ‘ആത്മാവ്’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ സന്ദർഭം ‘ജീവൻ’ എന്ന അർഥത്തെയാണ് പിന്തുണയ്ക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ആണ് എന്നതിലൂടെ വിശദീകരണബന്ധം
  rationale: മുൻവാക്യത്തിലെ ഉത്കണ്ഠപ്പെടരുതെന്ന നിർദേശത്തിന് കാരണം നൽകുന്ന ബന്ധം മലയാളത്തിൽ വാക്യക്രമവും പ്രസ്താവനാഭാവവുംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; പ്രത്യേകം ‘കാരണം’ ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമാകും.
- source_word: ψυχή
  choice: ജീവൻ
  rationale: ആഹാരം, ശരീരം, വസ്ത്രം എന്നീ സന്ദർഭങ്ങളിൽ ψυχή ഭൗമികജീവനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആത്മാവ്’ എന്നു നൽകിയാൽ സന്ദർഭം ആവശ്യപ്പെടാത്ത ദേഹാതീത അർഥം മുൻനിർത്താം.
- source_word: πλεῖόν
  choice: വിലയേറിയതാണ്
  rationale: ജനിറ്റീവിനോടുള്ള താരതമ്യം കേവല അളവിനേക്കാൾ മൂല്യത്തിലെ മേന്മ സൂചിപ്പിക്കുന്നു. ‘കൂടുതലാണ്’ എന്നതിനെക്കാൾ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളം.
- source_word: τροφή
  choice: ആഹാരം
  rationale: ഭക്ഷണത്തെയും പോഷണത്തെയും ഉൾക്കൊള്ളുന്ന, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: σῶμα
  choice: ശരീരം
  rationale: വസ്ത്രത്തോടു ചേർത്തു പറയുന്ന ഭൗതിക ശരീരത്തിന്റെ നേരിട്ടുള്ള സമാനപദം.
- source_word: ἔνδυμα
  choice: വസ്ത്രം
  rationale: ശരീരം മൂടുന്ന വസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപദം.
theological_decisions:
- issue: ഉത്കണ്ഠയെയും ദൈവിക പരിപാലനത്തെയും കുറിച്ചുള്ള ഉപദേശത്തിൽ ψυχή എന്ന പദത്തിന്റെ അർഥം
  choice: ‘ജീവൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘സ്വത്വം’
  rationale: ആഹാരത്തോടു താരതമ്യപ്പെടുന്നതും തുടർന്ന് ശരീരം വസ്ത്രത്തോടു താരതമ്യപ്പെടുന്നതും കണക്കിലെടുക്കുമ്പോൾ, ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഒരാളുടെ ജീവനാണ്. ഇതിലൂടെ ψυχή എന്ന പദത്തിന് മറ്റു സന്ദർഭങ്ങളിൽ ഉണ്ടാകാവുന്ന വിശാലമായ അർഥങ്ങൾ നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തരഘടന നിലനിർത്താൻ രണ്ടു ഖണ്ഡങ്ങളിലും ‘വിലയേറിയതാണ്’ ആവർത്തിച്ചു. മുഖ്യവാക്യത്തിൽ [a] അടയാളം ചേർത്തിട്ടുണ്ട്.
