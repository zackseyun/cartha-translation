review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately reflects the two parallel Greek clauses and the concealment–disclosure imagery overall. However, ‘വെളിപ്പെടാതിരിക്കാൻ’ and ‘അറിയപ്പെടാതിരിക്കാൻ’ are purposive infinitival forms (‘in order not to be revealed/known’), whereas the Greek relative clauses express future negation: nothing concealed will fail to be revealed, and nothing hidden will fail to become known.'
  naturalness: The current sentence is understandable but the purposive forms make its syntax less natural and can suggest intention rather than the stated future outcome. A parallel future-negative construction is both clearer and idiomatic in modern standard Malayalam.
  terminology: ‘മൂടിവെച്ചിരിക്കുന്ന’ suitably represents συγκεκαλυμμένον and preserves the covering image; ‘വെളിപ്പെടും’ is a natural rendering of ἀποκαλυφθήσεται. ‘മറഞ്ഞിരിക്കുന്ന’ and ‘അറിയപ്പെടും’ appropriately retain the second parallel pair without narrowing the scope to secrets as such.
  issues:
  - severity: high
    issue: The phrases ‘വെളിപ്പെടാതിരിക്കാൻ’ and ‘അറിയപ്പെടാതിരിക്കാൻ’ are grammatically purposive rather than future relative clauses.
    rationale: They can mean ‘in order not to be revealed/known,’ while οὐκ ἀποκαλυφθήσεται and οὐ γνωσθήσεται mean ‘will not be revealed’ and ‘will not be known.’ Recasting with ‘വെളിപ്പെടാതിരിക്കില്ല’ / ‘അറിയപ്പെടാതിരിക്കില്ല’ preserves the Greek future force and the negated-relative logic.
