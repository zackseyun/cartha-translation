revisions:
- from: എന്നാൽ വെളിപ്പെടാതിരിക്കാൻ മൂടിവെച്ചിരിക്കുന്നതായി ഒന്നുമില്ല; അറിയപ്പെടാതിരിക്കാൻ മറഞ്ഞിരിക്കുന്നതായും ഒന്നുമില്ല.[a][b][c]
  to: എന്നാൽ മൂടിവെച്ചിരിക്കുന്നതൊന്നും വെളിപ്പെടാതിരിക്കില്ല; മറഞ്ഞിരിക്കുന്നതൊന്നും അറിയപ്പെടാതിരിക്കില്ല.[a][b][c]
