id: LUK.12.2
reference: Luke 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: ml
  text: എന്നാൽ മൂടിവെച്ചിരിക്കുന്നതൊന്നും വെളിപ്പെടാതിരിക്കില്ല; മറഞ്ഞിരിക്കുന്നതൊന്നും അറിയപ്പെടാതിരിക്കില്ല.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മൂടിവെച്ചിരിക്കുന്ന’ എന്നതിന് ‘മറച്ചുവെച്ചിരിക്കുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ ആദ്യം മൂടപ്പെട്ടതും പിന്നീട് വെളിപ്പെടുന്നതുമായ ദൃശ്യരൂപകമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘മറഞ്ഞിരിക്കുന്ന’ എന്നതിന് ‘രഹസ്യമായ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ഈ വചനം ഇപ്പോഴത്തെ കാലത്തോ അന്തിമ ന്യായവിധിയിലോ സംഭവിക്കുന്ന വെളിപ്പെടുത്തൽ ഉൾപ്പെടെ, മറഞ്ഞിരിക്കുന്നത് ഒടുവിൽ വെളിപ്പെടും എന്ന വിശാലമായ അർഥത്തിൽ ഗ്രഹിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: ഒന്നുമില്ല
  rationale: നിഷേധാത്മക അനിശ്ചിത സർവനാമത്തിന്റെ സമ്പൂർണ വ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: സന്ദർഭത്തിലെ മൃദുവായ വൈരുധ്യവും ആശയവികാസവും സൂചിപ്പിക്കുന്നു.
- source_word: συγκεκαλυμμένον
  choice: മൂടിവെച്ചിരിക്കുന്നതായി
  rationale: പെർഫെക്റ്റ് പാസീവ് രൂപം സൂചിപ്പിക്കുന്ന, മൂടപ്പെട്ട നില ഇപ്പോഴും തുടരുന്നു എന്ന ആശയവും മൂടൽ എന്ന ദൃശ്യരൂപകവും നിലനിർത്തുന്നു.
- source_word: ἀποκαλυφθήσεται
  choice: വെളിപ്പെടാതിരിക്കാൻ
  rationale: ഭാവികാല പാസീവ് ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ നിഷേധാത്മക ബന്ധഘടനയിൽ അവതരിപ്പിക്കുന്നു; മൂടിയതും വെളിപ്പെടുന്നതും തമ്മിലുള്ള വിരുദ്ധത നിലനിർത്തുന്നു.
- source_word: κρυπτὸν
  choice: മറഞ്ഞിരിക്കുന്നതായും
  rationale: ഒളിഞ്ഞോ മറഞ്ഞോ ഉള്ള അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘രഹസ്യം’ എന്ന നാമരൂപത്തിലേക്ക് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: γνωσθήσεται
  choice: അറിയപ്പെടാതിരിക്കാൻ
  rationale: ഭാവികാല പാസീവ്/ഫലാവസ്ഥയുടെ ആശയം നിലനിർത്തി, ഒടുവിൽ അത് അറിയപ്പെടും എന്ന വാക്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: വചനത്തിലെ വെളിപ്പെടുത്തലിന്റെ വ്യാപ്തിയും സമയവും
  choice: ഇപ്പോൾ മറഞ്ഞിരിക്കുന്നതെല്ലാം ഒടുവിൽ വെളിപ്പെടുകയും അറിയപ്പെടുകയും ചെയ്യും എന്ന പൊതുതത്ത്വമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് അന്തിമ ന്യായവിധിയിലെ വെളിപ്പെടുത്തൽ മാത്രമാണെന്നോ ഇപ്പോഴത്തെ കാലത്ത് കപടത വെളിച്ചത്താകുന്നതു മാത്രമാണെന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് ഭാവികാല പാസീവ് ക്രിയകൾ ഒടുവിലുള്ള വെളിപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ സമയം നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ട് സമാന്തര ഘടനകളും മൂടൽ–വെളിപ്പെടൽ എന്ന രൂപകവിരുദ്ധതയും നിലനിർത്തിയിട്ടുണ്ട്.
