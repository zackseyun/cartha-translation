id: LUK.12.22
reference: Luke 12:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ തന്റെ ശിഷ്യന്മാരോടു പറഞ്ഞു: “അതുകൊണ്ട് ഞാൻ നിങ്ങളോടു പറയുന്നു: എന്തു ഭക്ഷിക്കുമെന്നോർത്ത് നിങ്ങളുടെ ജീവനെക്കുറിച്ചും[b], എന്തു ധരിക്കുമെന്നോർത്ത് ശരീരത്തെക്കുറിച്ചും ഉത്കണ്ഠപ്പെടരുത്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിഷമിക്കരുത്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ആത്മാവിനെക്കുറിച്ച്”; ഇവിടെ ഗ്രീക്കുപദം സാധാരണയായി ഒരാളുടെ ഭൗമികമായ നിലനിൽപ്പ് എന്ന അർഥത്തിൽ ‘ജീവൻ’ എന്നു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: പിന്നെ അവൻ ... പറഞ്ഞു
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധകമാണ്; ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കാതെ സ്വാഭാവികമായ തുടർച്ച നൽകാൻ ‘പിന്നെ’ ഉപയോഗിച്ചു.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരോടു
  rationale: αὐτοῦ എന്ന വ്യക്തമായ ഉടമസ്ഥസൂചന നിലനിർത്തുന്നു; μαθηταί എന്നതിന് സന്ദർഭോചിതമായ പതിവുപദം ‘ശിഷ്യന്മാർ’ ആണ്.
- source_word: Διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻപത്തെ ഉപദേശത്തിൽനിന്നുള്ള കാരണപരമായ നിഗമനം സംക്ഷിപ്തമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും വർത്തമാനകാല പ്രസ്താവനയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: μὴ μεριμνᾶτε
  choice: ഉത്കണ്ഠപ്പെടരുത്
  rationale: μεριμνάω ഇവിടെ സാധാരണ കരുതലിനേക്കാൾ ആകുലമായ ചിന്തയെയോ ഉത്കണ്ഠയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: τῇ ψυχῇ
  choice: നിങ്ങളുടെ ജീവനെക്കുറിച്ച്
  rationale: ഭക്ഷണവുമായി ബന്ധപ്പെടുത്തി പറയുന്നതിനാൽ ψυχή ഇവിടെ അമൂർത്തമായ ‘ആത്മാവ്’ എന്നതിനേക്കാൾ ഭൂമിയിലെ ജീവിതം അഥവാ ജീവൻ എന്ന അർഥത്തിലാണ്.
- source_word: τί φάγητε
  choice: എന്തു ഭക്ഷിക്കുമെന്നോർത്ത്
  rationale: ഭാവിയിലേക്കു നോക്കുന്ന പരോക്ഷമായ ആലോചനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: μηδὲ τῷ σώματι
  choice: ശരീരത്തെക്കുറിച്ചും
  rationale: μηδέ രണ്ടാമത്തെ സമാന്തര ഘടകത്തെ ആദ്യത്തേതിനോടു ചേർക്കുന്നു; മലയാളത്തിലെ ‘-ഉം’ ആ ഏകോപനം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τί ἐνδύσησθε
  choice: എന്തു ധരിക്കുമെന്നോർത്ത്
  rationale: വസ്ത്രം ധരിക്കുക എന്ന ἐνδύω എന്ന ക്രിയയുടെ സന്ദർഭാർഥവും ഭാവിയിലേക്കുള്ള ആലോചനയും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ ψυχή എന്ന പദത്തിന്റെ അർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: ψυχήയ്ക്കുള്ള ഭക്ഷണവും σώμαയ്ക്കുള്ള വസ്ത്രവും സമാന്തരമായി പറയുന്നതിനാൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഒരാളുടെ ഭൗമികജീവിതമാണ്. ‘ആത്മാവ്’ എന്നു വിവർത്തനം ചെയ്യുന്നത് ഈ വാക്യം ആവശ്യപ്പെടാത്ത ആത്മാവ്–ശരീരം എന്ന സാങ്കേതിക ദ്വന്ദവായന കൊണ്ടുവരാം.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തരഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘എന്തു ... എന്നോർത്ത്’ എന്നും ഏകോപനത്തിന് ‘-ഉം’ എന്നും ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പുചിഹ്നങ്ങളുടെ സ്ഥാനവൈകല്യം തിരുത്തി: [a] ‘ഉത്കണ്ഠപ്പെടരുത്’ എന്നതിനും [b] ‘ജീവൻ’ എന്നതിനും പിന്നാലെ ചേർത്തു.'
