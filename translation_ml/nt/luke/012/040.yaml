id: LUK.12.40
reference: Luke 12:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: ml
  text: നിങ്ങളും ഒരുങ്ങിയിരിക്കണം[a]; കാരണം നിങ്ങൾ പ്രതീക്ഷിക്കാത്ത സമയത്ത്[b] മനുഷ്യപുത്രൻ[c] വരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളും ഒരുങ്ങിയിരിക്കുക.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾ കരുതാത്ത സമയത്ത്’ അല്ലെങ്കിൽ ‘നിങ്ങൾ പ്രതീക്ഷിക്കാത്തപ്പോൾ.’
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘മനുഷ്യപുത്രൻ’; യേശു തന്നെക്കുറിച്ച് ഉപയോഗിക്കുന്ന ഒരു ശീർഷകം. ഇതിൽ ദാനീയേൽ 7:13–14-ന്റെ പ്രതിധ്വനി ഉണ്ടായിരിക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: മുൻപുള്ള ഉപമയിലെ ദാസന്മാരെപ്പോലെ കേൾവിക്കാരും ഇതിൽ ഉൾപ്പെടുന്നു എന്ന ഊന്നൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: γίνεσθε ἕτοιμοι
  choice: ഒരുങ്ങിയിരിക്കണം
  rationale: വർത്തമാനകാല ആജ്ഞ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ സന്നദ്ധാവസ്ഥയും സന്ദർഭത്തിലെ അടിയന്തരതയും സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ആജ്ഞയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ അർഥം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ᾗ ὥρᾳ
  choice: സമയത്ത്
  rationale: കൃത്യമായ ഒരു അറുപത് മിനിറ്റ് ദൈർഘ്യമുള്ള ‘മണിക്കൂർ’ എന്നതിലുപരി, അറിയപ്പെടാത്ത വരവിന്റെ സമയമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ ‘സമയത്ത്’ സ്വാഭാവികമാണ്.
- source_word: οὐ δοκεῖτε
  choice: നിങ്ങൾ പ്രതീക്ഷിക്കാത്ത
  rationale: δοκέω എന്ന പദത്തിന്റെ ‘ചിന്തിക്കുക/കരുതുക’ എന്ന പരിധി നിലനിർത്തിക്കൊണ്ട്, ഈ മുന്നറിയിപ്പിന്റെ സന്ദർഭത്തിൽ പ്രതീക്ഷിക്കാതിരിക്കലെന്ന പ്രായോഗിക അർഥം നൽകുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണമായ ഗ്രീക്ക് ശീർഷകത്തിന്റെ രൂപവും ദാനീയേൽ 7-നോടുള്ള സാധ്യതയുള്ള പ്രതിധ്വനിയും സംരക്ഷിക്കുന്ന, മലയാളത്തിൽ പരിചിതമായ പരിഭാഷയാണ്.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: ഭാവിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ സജീവതയും മുന്നറിയിപ്പിന്റെ അടിയന്തരഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മാനവൻ
  rationale: പരമ്പരാഗതവും അക്ഷരാർഥപരവുമായ ശീർഷകം നിലനിർത്തുന്നത് ദാനീയേലിലുള്ള അന്ത്യകാല-മശീഹാ പ്രതിധ്വനികളെ സംരക്ഷിക്കുന്നു; അതേസമയം വാക്യത്തിന് പുറത്തുള്ള പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: അന്ത്യകാലപ്രസ്താവനയിലെ ἔρχεται എന്ന വർത്തമാനകാലത്തിന്റെ കാലബലം
  choice: വരുന്നു
  alternative: വരും
  rationale: ഗ്രീക്ക് വർത്തമാനകാലത്തിന് ഇവിടെ ഭാവികാലബലം ഉണ്ടായിരിക്കാം. ‘വരുന്നു’ അതിന്റെ രൂപവും അടിയന്തരതയും സംരക്ഷിക്കുന്നു; വിശാലമായ ഏതെങ്കിലും അന്ത്യകാലക്രമം ഇതിലൂടെ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. ‘ഒരുങ്ങിയിരിക്കണം’ എന്ന പ്രയോഗം ആജ്ഞയുടെ ബലവും തുടർച്ചയായ സന്നദ്ധതയും ഒരുമിച്ച് നൽകുന്നു; ‘വരുന്നു’ ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ സജീവത നിലനിർത്തുന്നു.
