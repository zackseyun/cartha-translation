source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: ml
  text: അഞ്ചു കുരുവികളെ രണ്ട് അസ്സാരിയോണിന് വിൽക്കുന്നില്ലേ? എന്നിട്ടും അവയിൽ ഒന്നുപോലും ദൈവസന്നിധിയിൽ മറക്കപ്പെട്ടിട്ടില്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രണ്ട് ചെമ്പുനാണയങ്ങൾക്ക്’; അസ്സാരിയോൺ ചെറിയൊരു റോമൻ ചെമ്പുനാണയമായിരുന്നു. ഇവിടെ രണ്ട് അസ്സാരിയോണുകളെയാണ് പറയുന്നത്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ അവഗണിക്കപ്പെട്ടിട്ടില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: കുരുവികൾ
  rationale: സന്ദർഭത്തിൽ ഈ പദം സാധാരണയായി കുരുവികളെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘ചെറിയ പക്ഷികൾ’ എന്നതിനെക്കാൾ സ്വാഭാവികവും നിർദിഷ്ടവുമാണ്.
- source_word: πωλοῦνται
  choice: വിൽക്കുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിലെ സ്വാഭാവികമായ വില്പനപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: ἀσσαρίων δύο
  choice: രണ്ട് അസ്സാരിയോണിന്
  rationale: കൃത്യമല്ലാത്ത ആധുനിക നാണയമൂല്യം പകരംവയ്ക്കാതെ പുരാതന റോമൻ നാണയത്തിന്റെ പേര് നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അതു വിശദീകരിക്കുന്നു.
- source_word: ἐπιλελησμένον
  choice: മറക്കപ്പെട്ടിട്ടില്ല
  rationale: പൂർണകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന ‘മറന്ന നിലയിൽ ആയിരിക്കുക’ എന്ന ആശയം വ്യക്തമായും നേരിട്ടും നൽകുന്നു.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിൽ, അവിടുത്തെ ദൃഷ്ടിയിൽ എന്ന ബന്ധപരമായ ആശയം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: οὐχὶ ... ;
  choice: വിൽക്കുന്നില്ലേ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: καὶ ἓν ἐξ αὐτῶν
  choice: എന്നിട്ടും അവയിൽ ഒന്നുപോലും
  rationale: ചെറിയ വിപണിമൂല്യവും ദൈവത്തിന്റെ ശ്രദ്ധയും തമ്മിലുള്ള സന്ദർഭോചിതമായ വൈരുധ്യവും ഒരൊറ്റ പക്ഷിക്കുള്ള ഊന്നലും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ഓർമയും പരിപാലനവും സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: അവയിൽ ഒന്നുപോലും ദൈവസന്നിധിയിൽ മറക്കപ്പെട്ടിട്ടില്ല
  alternative: അവയിൽ ഒന്നുപോലും ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ അവഗണിക്കപ്പെട്ടിട്ടില്ല
  rationale: ‘മറക്കപ്പെട്ടിട്ടില്ല’ എന്നത് മൂലപദത്തിന്റെ അർഥത്തോട് അടുത്തുനിൽക്കുകയും ദൈവപരിപാലനത്തെക്കുറിച്ചുള്ള കൂടുതൽ വികസിതമായ ആശയം വാക്യത്തിലേക്ക് ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. പുരാതന നാണയനാമം ലിപ്യന്തരണം ചെയ്ത് സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി. മുഖ്യവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട അടിക്കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
