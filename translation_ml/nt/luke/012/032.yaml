  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: ml
  text: “ചെറിയ ആട്ടിൻകൂട്ടമേ, ഭയപ്പെടേണ്ടാ[a]; കാരണം, നിങ്ങൾക്കു രാജ്യം[b] നൽകാൻ നിങ്ങളുടെ പിതാവ് പ്രസാദിച്ചു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പേടിക്കേണ്ടാ.”
    reason: lexical_alternative
  - marker: b
    text: “രാജ്യം” എന്നത് “രാജവാഴ്ച” അഥവാ “ഭരണം” എന്നും മനസ്സിലാക്കാം; ഈ പദം ദൈവത്തിന്റെ രാജാധികാരത്തെയും അവന്റെ ജനത്തിനു നൽകപ്പെടുന്ന രാജ്യത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: ഭയപ്പെടേണ്ടാ
  rationale: μήയോടുകൂടിയ വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള നിരോധനസ്വരം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ μικρὸν ποίμνιον
  choice: ചെറിയ ആട്ടിൻകൂട്ടമേ
  rationale: ποίμνιον സൂചിപ്പിക്കുന്ന ആടുകളുടെ കൂട്ടമെന്ന ഇടയരൂപകവും μικρόν നൽകുന്ന ചെറുപ്പം/ചെറിയ സംഖ്യ എന്ന ഭാവവും അഭിസംബോധനാരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: ഭയപ്പെടേണ്ടതില്ലെന്ന ആഹ്വാനത്തിന്റെ കാരണം തുടർന്നുവരുന്നു എന്ന കാര്യകാരണബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εὐδόκησεν
  choice: പ്രസാദിച്ചിരിക്കുന്നു
  rationale: പിതാവിന്റെ അനുകൂലമായ ഇഷ്ടവും കൃപാപൂർവമായ സന്തോഷവും അറിയിക്കുന്നു; സാങ്കേതികമായ ദൈവനിർണയഭാഷ അനാവശ്യമായി ചേർക്കുന്നില്ല. ഗ്രീക്ക് എയോറിസ്റ്റിനെ മലയാളത്തിൽ ഫലപ്രസക്തിയുള്ള സ്വാഭാവിക രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὁ πατὴρ ὑμῶν
  choice: നിങ്ങളുടെ പിതാവ്
  rationale: മൂലത്തിലെ ലളിതമായ ബന്ധസൂചന കാത്തുസൂക്ഷിക്കുന്നു; അവിടെ ഇല്ലാത്ത ‘സ്വർഗീയ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: δοῦναι ὑμῖν
  choice: നിങ്ങൾക്കു നൽകുന്നതിൽ
  rationale: δίδωμι എന്നതിന്റെ സാധാരണ അർഥമായ ‘നൽകുക’ നിലനിർത്തി, εὐδόκησεν എന്ന ക്രിയയുമായി സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: τὴν βασιλείαν
  choice: രാജ്യം
  rationale: βασιλείαയുടെ രാജാധികാരവും രാജ്യവും ഉൾക്കൊള്ളാവുന്ന ബൈബിൾപരമായ വിശാലത നിലനിർത്തുന്ന പരിചിതമായ മലയാളപദമാണ്.
theological_decisions:
- issue: βασιλείαയുടെ അർഥവ്യാപ്തി
  choice: രാജ്യം
  alternative: രാജവാഴ്ച / ഭരണം
  rationale: ‘രാജ്യം’ എന്നത് ദൈവത്തിന്റെ രാജാധികാരത്തെയും അവന്റെ ജനത്തിനു ലഭിക്കുന്ന രാജ്യത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്നു; അർഥത്തെ ഒരു ഭൂപ്രദേശത്തിലേക്കോ അമൂർത്തമായ ഭരണത്തിലേക്കോ മാത്രം ചുരുക്കുന്നില്ല.
- issue: εὐδόκησεν എന്നതിലെ ദൈവഹിതത്തിന്റെ ഭാവം
  choice: പ്രസാദിച്ചിരിക്കുന്നു
  alternative: കൃപാപൂർവം തിരഞ്ഞെടുത്തു / നിശ്ചയിച്ചു
  rationale: പിതാവിന്റെ ദയാപൂർവമായ സന്മനസ്സിനെ പ്രകടിപ്പിക്കുമ്പോഴും, മൂലപദം നിർബന്ധിക്കാത്ത സാങ്കേതികമായ ദൈവനിർണയസിദ്ധാന്തം വിവർത്തനത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ചെറിയ ആട്ടിൻകൂട്ടമേ’ എന്ന അഭിസംബോധന ഇടയരൂപകവും സ്നേഹഭാവവും നിലനിർത്തുന്നു. പദക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയിട്ടുണ്ടെങ്കിലും ഗ്രീക്കിലെ ആഹ്വാനം–കാരണം എന്ന ഘടന സംരക്ഷിച്ചിട്ടുണ്ട്.
