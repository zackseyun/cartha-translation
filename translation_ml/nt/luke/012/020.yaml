id: LUK.12.20
reference: Luke 12:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: ml
  text: 'എന്നാൽ ദൈവം അവനോടു പറഞ്ഞു: “മൂഢാ! ഈ രാത്രിതന്നെ നിന്റെ ജീവനെ നിന്നിൽനിന്ന് തിരികെ ആവശ്യപ്പെടുന്നു.[a] നീ ഒരുക്കിവെച്ചതെല്ലാം പിന്നെ ആർക്കുള്ളതാകും?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ആത്മാവിനെ നിന്നിൽനിന്ന് തിരികെ ആവശ്യപ്പെടുന്നു.” ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് “ജീവൻ” എന്നോ “ആത്മാവ്” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: മൂഢാ
  rationale: നേരിട്ടുള്ള സംബോധനയായ ഈ പദത്തിന്റെ ശക്തമായ ശാസനാഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ταύτῃ τῇ νυκτί
  choice: ഈ രാത്രിതന്നെ
  rationale: സംഭവത്തിന്റെ അടിയന്തരതയും ഈ പ്രത്യേക രാത്രിയിലുള്ള ഊന്നലും പ്രകടമാക്കുന്നു.
- source_word: ψυχήν
  choice: ജീവൻ
  rationale: സന്ദർഭം ആ മനുഷ്യന്റെ ആസന്നമരണത്തെക്കുറിച്ചായതിനാൽ ഇവിടെ ‘ജീവൻ’ സ്വാഭാവികമാണ്; ‘ആത്മാവ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: നിന്നിൽനിന്ന് തിരികെ ആവശ്യപ്പെടുന്നു
  rationale: ἀπαιτέω എന്ന പദത്തിലെ ആവശ്യപ്പെടുക/തിരികെ ചോദിക്കുക എന്ന അർഥഭാവം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ വ്യക്തമാക്കാത്ത ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ കൃത്രിമമായി ചേർക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: ἃ δὲ ἡτοίμασας
  choice: നീ ഒരുക്കിവെച്ചതെല്ലാം
  rationale: സമ്പാദിച്ചുവെച്ച വസ്തുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിനോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: τίνι ἔσται
  choice: ആർക്കുള്ളതാകും?
  rationale: ഉടമസ്ഥതയെക്കുറിച്ചുള്ള ഗ്രീക്ക് ചോദ്യത്തിന്റെ ചുരുക്കവും ശക്തവുമായ മലയാളരൂപം.
theological_decisions:
- issue: മരണസന്ദർഭത്തിൽ ψυχή എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: ആസന്നമായ മരണവും ഭൗമികജീവന്റെ നഷ്ടവുമാണ് സന്ദർഭത്തിലെ മുഖ്യ ആശയം. ‘ജീവൻ’ എന്നത് അനാവശ്യമായ മനുഷ്യസ്വഭാവശാസ്ത്ര നിഗമനം ഒഴിവാക്കുന്നു; പദത്തിന്റെ വിപുലമായ അർഥസാധ്യതയായ ‘ആത്മാവ്’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἀπαιτοῦσιν എന്ന വ്യക്തമല്ലാത്ത ബഹുവചന കർത്താവ്
  choice: കർത്താവിനെ വ്യക്തമാക്കാതെ ‘ആവശ്യപ്പെടുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തുക
  alternative: ‘അവർ ആവശ്യപ്പെടുന്നു’ എന്നു വ്യക്തമായ ബഹുവചന കർത്താവ് ചേർക്കുക
  rationale: മൂലപാഠം പ്രവർത്തകരെ തിരിച്ചറിയിക്കുന്നില്ല. ആരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് അനാവശ്യമായി നിർണയിക്കാതെ അതിലെ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉപമയിലെ ശക്തമായ ദൈവിക ശാസനയും അവസാനത്തെ അലങ്കാരചോദ്യത്തിന്റെ മൂർച്ചയും നിലനിർത്തിയിരിക്കുന്നു.
