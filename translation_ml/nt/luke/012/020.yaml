revisions:
- from: 'എന്നാൽ ദൈവം അവനോടു പറഞ്ഞു: “മൂഢാ! ഈ രാത്രിതന്നെ നിന്റെ ജീവൻ നിന്നിൽനിന്ന് തിരികെ ആവശ്യപ്പെടുന്നു.[a] നീ ഒരുക്കിവെച്ചതെല്ലാം പിന്നെ ആർക്കുള്ളതാകും?”'
  to: 'എന്നാൽ ദൈവം അവനോടു പറഞ്ഞു: “മൂഢാ! ഈ രാത്രിതന്നെ നിന്റെ ജീവനെ നിന്നിൽനിന്ന് തിരികെ ആവശ്യപ്പെടുന്നു.[a] നീ ഒരുക്കിവെച്ചതെല്ലാം പിന്നെ ആർക്കുള്ളതാകും?”'
  rationale: A minimal grammatical correction changes ജീവൻ/ആത്മാവ് to their accusative forms, reflecting ψυχήν as the object of the Greek verb and avoiding an unintended reading in which the life itself is the demander. No agent is supplied, so the Greek ambiguity is preserved.
