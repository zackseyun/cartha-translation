id: LUK.12.8
reference: Luke 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: ml
  text: '“ഞാൻ നിങ്ങളോടു പറയുന്നു: മനുഷ്യരുടെ മുമ്പിൽ എന്നെ ഏറ്റുപറയുന്ന ഏവരെയും മനുഷ്യപുത്രനും ദൈവത്തിന്റെ ദൂതന്മാരുടെ മുമ്പിൽ ഏറ്റുപറയും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: λέγω എന്ന വർത്തമാനകാല ക്രിയ ഇവിടെ ഗൗരവമുള്ള പ്രസ്താവനയെ അവതരിപ്പിക്കുന്നു. δέ നേരിയ ബന്ധസൂചകമായതിനാൽ മലയാളത്തിൽ കൃത്രിമമായ ശക്തമായ വൈരുധ്യം സൃഷ്ടിക്കാതെ സ്വാഭാവികമായി വാക്യം ആരംഭിച്ചു.
- source_word: πᾶς ὃς ἂν
  choice: ഏവനെയും
  rationale: അനിശ്ചിതമായ പൊതുനിബന്ധനയും അതിന്റെ സർവവ്യാപക പരിധിയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ὁμολογήσῃ ... ὁμολογήσει
  choice: ഏറ്റുപറയുന്ന ... ഏറ്റുപറയും
  rationale: ὁμολογέω ഇവിടെ പരസ്യമായി അംഗീകരിക്കുക അഥവാ ഏറ്റുപറയുക എന്ന അർഥത്തിലാണ്. രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ മലയാളക്രിയ ഉപയോഗിക്കുന്നത് മനുഷ്യരുടെ മുമ്പിലെ ഏറ്റുപറച്ചിലും സ്വർഗീയസന്നിധിയിലെ പ്രത്യുത്തരമായ ഏറ്റുപറച്ചിലും തമ്മിലുള്ള ബന്ധം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: എന്നെ ... ഏവനെയും
  rationale: ὁμολογέωയോടൊപ്പമുള്ള ἐν + ദത്തിവ് നിർമാണം അക്ഷരാർഥത്തിൽ മലയാളത്തിലാക്കിയാൽ അസ്വാഭാവികമാകും. വ്യക്തിയെ പരസ്യമായി അംഗീകരിക്കുന്ന അർഥം നേരിട്ടുള്ള കർമരൂപത്തിൽ സ്വാഭാവികമായി നൽകി; മൂലനിർമാണം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ മുമ്പിൽ
  rationale: ἔμπροσθεν എന്നതിന്റെ സന്നിധി/സാക്ഷ്യം എന്ന ആശയം ‘മുമ്പിൽ’ നിലനിർത്തുന്നു. ἀνθρώπων വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായിരുന്നാലും ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘മനുഷ്യർ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണവും ദാനീയേൽസംബന്ധമായ ധ്വനിയുമുള്ള അംഗീകൃത ശീർഷകം വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ദൂതന്മാരുടെ മുമ്പിൽ
  rationale: ദൈവദൂതന്മാരുടെ സന്നിധിയിൽ നടക്കുന്ന പരസ്യമായ അംഗീകാരത്തിന്റെ ഗൗരവം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁμολογέωയോടൊപ്പമുള്ള ἐν + ദത്തിവ് നിർമാണത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘എന്നെ ഏറ്റുപറയുന്ന ... ഏവനെയും ... ഏറ്റുപറയും’ എന്ന സ്വാഭാവിക വ്യക്തികർമ നിർമാണം
  alternative: ‘എന്നിൽ ഏറ്റുപറയുന്ന ... അവനിൽ ഏറ്റുപറയും’ എന്ന അക്ഷരാർഥരൂപം
  rationale: ഗ്രീക്ക് നിർമാണം ബന്ധമോ പക്ഷചേരലോ സൂചിപ്പിച്ചേക്കാമെങ്കിലും അതിനെ അക്ഷരാർഥത്തിൽ പകർത്തുന്നത് മലയാളത്തിൽ അർഥം മങ്ങിക്കും. നേരിട്ടുള്ള കർമരൂപം പരസ്യമായ അംഗീകാരത്തിന്റെ പരസ്പരത വ്യക്തമാക്കുന്നു; നിർമാണത്തിലെ പ്രത്യേകത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: ἀνθρώπων എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ പരിധി
  choice: ‘മനുഷ്യർ’ എന്ന് പൊതുവായ മനുഷ്യസൂചനയായി വിവർത്തനം ചെയ്യുക
  alternative: ‘പുരുഷന്മാർ’ എന്ന് വ്യാകരണലിംഗം അക്ഷരാർഥത്തിൽ പകർത്തുക
  rationale: ഈ സന്ദർഭത്തിൽ പദം പുരുഷന്മാരെ മാത്രം വേർതിരിച്ച് സൂചിപ്പിക്കുന്നില്ല; മനുഷ്യസമൂഹത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യർ’ മൂലത്തിന്റെ ഉദ്ദേശ്യം കൃത്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഏറ്റുപറയുക’ എന്ന പദം പരസ്യമായ അംഗീകാരവും സാക്ഷ്യവും ഉൾക്കൊള്ളുന്നു; രണ്ടു ക്ലോസുകളിലെയും ആവർത്തനം മനപ്പൂർവം നിലനിർത്തിയിരിക്കുന്നു.
