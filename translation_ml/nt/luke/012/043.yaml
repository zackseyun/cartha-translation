id: LUK.12.43
reference: Luke 12:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: ml
  text: തന്റെ യജമാനൻ[a] വന്നെത്തുമ്പോൾ അങ്ങനെ ചെയ്യുന്നതായി കണ്ടെത്തുന്ന ആ ദാസൻ ഭാഗ്യവാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ കർത്താവ് വന്നെത്തുമ്പോൾ അങ്ങനെ ചെയ്യുന്നതായി കണ്ടെത്തുന്ന ആ ദാസൻ ഭാഗ്യവാൻ.” ഗ്രീക്ക് പദത്തിന് ഉപമയിലെ ഗൃഹപശ്ചാത്തലത്തിൽ ‘യജമാനൻ’ എന്നും, വിശാലമായ പ്രയോഗത്തിൽ ‘കർത്താവ്’ എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: അനുഗൃഹീതൻ
  rationale: ആത്മനിഷ്ഠമായ ‘സന്തോഷവാൻ’ എന്നതിലുപരി, ദൈവാനുഗ്രഹവും ഭാഗ്യസ്ഥിതിയും സൂചിപ്പിക്കുന്ന ആശീർവചനസ്വരം നിലനിർത്തുന്നു.
- source_word: δοῦλος
  choice: ദാസൻ
  rationale: അടിമയെയോ സേവകനെയോ സൂചിപ്പിക്കാവുന്ന പദമാണ്; വീട്ടുഭരണത്തിന്റെ ഉപമയിൽ യജമാനന്റെ അധികാരത്തിൻ കീഴിലുള്ള ചുമതലയും ബന്ധവും ‘ദാസൻ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: κύριος
  choice: യജമാനൻ
  rationale: ഉപമയുടെ പ്രത്യക്ഷമായ ഗൃഹപശ്ചാത്തലത്തിൽ ദാസന്റെ അധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കർത്താവ്’ എന്ന ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐλθὼν
  choice: വരുമ്പോൾ
  rationale: പ്രധാനക്രിയയായ ‘കാണും’ എന്നതിനോടുള്ള കാലബന്ധം സ്വാഭാവികമായ മലയാള കാലവാക്യമായി നൽകുന്നു.
- source_word: εὑρήσει
  choice: കാണുന്ന
  rationale: ഗ്രീക്കിലെ ഭാവിക്രിയയുടെ അർഥം ‘വരുമ്പോൾ ... കാണുന്ന’ എന്ന മലയാള ബന്ധവാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ποιοῦντα οὕτως
  choice: അങ്ങനെ ചെയ്യുന്നതായി
  rationale: മുൻവാക്യങ്ങളിൽ വിവരിച്ച വിശ്വസ്തമായ പ്രവർത്തനത്തിലേക്ക് ചുരുക്കത്തിലും സ്വാഭാവികമായും വിരൽചൂണ്ടുന്നു.
- source_word: ἐκεῖνος
  choice: ആ
  rationale: ദാസനെ പ്രത്യേകമായി എടുത്തുകാട്ടുന്ന നിർദ്ദേശകപദത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മടങ്ങിവരുന്ന അധികാരിയെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ പ്രതിധ്വനി
  choice: മുഖ്യവാചകത്തിൽ ‘യജമാനൻ’
  alternative: ‘കർത്താവ്’
  rationale: ഉപമയുടെ ഉപരിതലാർത്ഥത്തിൽ ഇത് ഒരു വീട്ടിലെ യജമാനനെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ വിശാലസന്ദർഭത്തിൽ കർത്താവിന്റെ വരവിനെ സൂചിപ്പിക്കാവുന്നതിനാൽ മറ്റർത്ഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ഗൗരവവും ആശീർവചനസ്വരവും നിലനിർത്തി. മലയാളത്തിന്റെ സ്വാഭാവിക ബന്ധവാക്യക്രമം ഉപയോഗിച്ചു.
