id: LUK.12.14
reference: Luke 12:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπε, τίς με κατέστησεν ⸀κριτὴν ἢ μεριστὴν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അയാളോടു പറഞ്ഞു: “മനുഷ്യാ, എന്നെ നിങ്ങളുടെമേൽ ന്യായാധിപനോ ഓഹരിവെപ്പുകാരനോ ആയി നിയമിച്ചത് ആര്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: മനുഷ്യാ
  rationale: നേരിട്ടുള്ള സംബോധനയുടെ ഗൗരവവും അകലം സൂചിപ്പിക്കുന്ന ഭാവവും നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തമായി മനസ്സിലാകുന്നു.
- source_word: κριτήν
  choice: ന്യായാധിപൻ
  rationale: തർക്കത്തിൽ വിധി പറയുന്ന അധികാരസ്ഥനെ സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ പദം.
- source_word: μεριστήν
  choice: ഓഹരിവെപ്പുകാരൻ
  rationale: സ്വത്ത്, പ്രത്യേകിച്ച് അവകാശസ്വത്ത്, പങ്കിട്ടുകൊടുക്കുന്ന വ്യക്തി എന്ന പ്രവർത്തനാർഥം പ്രകടമാക്കുന്നു; 'മധ്യസ്ഥൻ' എന്ന വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: κατέστησεν
  choice: നിയമിച്ചത്
  rationale: ഒരു ചുമതലയിലേക്കോ അധികാരസ്ഥാനത്തിലേക്കോ നിയോഗിക്കുക എന്ന ഗ്രീക്ക് ക്രിയയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐφ’ ὑμᾶς
  choice: നിങ്ങളുടെമേൽ
  rationale: അധികാരപരിധിയെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ രൂപം നിലനിർത്തുന്നു; ബഹുവചനമായ ὑμᾶς-ഉം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ചോദ്യത്തിന്റെ വ്യാപ്തി
  choice: “എന്നെ നിങ്ങളുടെമേൽ ... നിയമിച്ചത് ആര്?” എന്ന ചോദ്യരൂപം അതേപടി നിലനിർത്തി
  alternative: “ഞാൻ നിങ്ങളുടെ തർക്കം തീർക്കാൻ വന്നിട്ടില്ല” എന്ന വ്യാഖ്യാനാത്മക പരാവർത്തനം
  rationale: വാക്യം യേശുവിന്റെ ദൗത്യത്തെക്കുറിച്ചുള്ള സമഗ്രമായ സിദ്ധാന്തപ്രഖ്യാപനമല്ല; ഈ പ്രത്യേക ആവശ്യത്തിൽ അദ്ദേഹത്തെ അധികാരിയായി നിയമിച്ചത് ആരാണെന്ന പ്രതിപ്രശ്നമാണ്. അതിനാൽ ഉള്ളതിലധികം ദൈവശാസ്ത്രനിഗമനം ചേർത്തില്ല.
- issue: μεριστής എന്ന പദത്തിന്റെ അർഥം
  choice: ഓഹരിവെപ്പുകാരൻ
  alternative: മധ്യസ്ഥൻ / വിധികർത്താവ്
  rationale: സഹോദരന്മാർക്കിടയിലെ അവകാശവിഹിതത്തിന്റെ പശ്ചാത്തലത്തിൽ പങ്കുവെക്കുന്ന ചുമതല വ്യക്തമാക്കുകയും κριτής-ൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ δέ-യുടെ വിരുദ്ധ/പ്രതികരണ ഭാവത്തിന് “എന്നാൽ” ഉപയോഗിച്ചു. ഉദ്ധരണിയിലെ നേരിട്ടുള്ളതും അല്പം കഠിനവുമായ സംബോധന മൃദൂകരിക്കാതെ സൂക്ഷിച്ചു.
