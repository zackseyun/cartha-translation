id: LUK.12.46
reference: Luke 12:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: ml
  text: ആ അടിമയുടെ യജമാനൻ, അവൻ പ്രതീക്ഷിക്കാത്ത ഒരു ദിവസത്തിലും അവന് അറിയാത്ത ഒരു മണിക്കൂറിലും വരും; അവനെ രണ്ടായി വെട്ടുകയും[a] അവന് അവിശ്വസ്തരുടെ കൂട്ടത്തിൽ ഓഹരി നിശ്ചയിക്കുകയും ചെയ്യും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ കഷണങ്ങളാക്കും”; ചിലർ ഈ പ്രയോഗത്തെ “അവനെ കഠിനമായി ശിക്ഷിക്കും” എന്ന അർഥത്തിലുള്ള ശൈലിയായി മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവിശ്വാസികളുടെ കൂട്ടത്തിൽ.”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: യജമാനൻ
  rationale: ഉപമയിലെ യജമാനൻ–അടിമ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഇവിടെ നേരിട്ട് ക്രിസ്തുശാസ്ത്രപരമായ ‘കർത്താവ്’ എന്ന പദവി ചുമത്തുന്നില്ല.
- source_word: δοῦλος
  choice: അടിമ
  rationale: ഉടമസ്ഥതയും കീഴ്വഴക്കവും വ്യക്തമായ ഈ ഗൃഹോപമയിൽ ഗ്രീക്ക് പദത്തിന്റെ ശക്തി ‘ദാസൻ’ എന്നതിനെക്കാൾ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἥξει
  choice: വരും
  rationale: യജമാനന്റെ അപ്രതീക്ഷിതമായ വരവിനെ സ്വാഭാവികവും നേരിട്ടുമായ ഭാവികാലപ്രയോഗത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: അവൻ പ്രതീക്ഷിക്കാത്ത ദിവസത്തിൽ
  rationale: പ്രതീക്ഷിക്കാത്തത് യജമാനന്റെ വരവാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ അനാവശ്യമായ കർമപൂരണം ചേർക്കാതെ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: അറിയാത്ത മണിക്കൂറിൽ
  rationale: മുൻവാക്യത്തിലെ ‘പ്രതീക്ഷിക്കുക’ എന്നതിൽനിന്ന് വ്യത്യസ്തമായി γινώσκωയുടെ ‘അറിയുക’ എന്ന അർത്ഥം സംരക്ഷിക്കുന്നു.
- source_word: διχοτομήσει
  choice: അവനെ രണ്ടായി വെട്ടും
  rationale: പദത്തിന്റെ അക്ഷരാർഥമായ കടുത്ത ശിക്ഷാചിത്രം മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു; രൂപകപ്രയോഗമായി മനസ്സിലാക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τὸ μέρος αὐτοῦ
  choice: അവന്റെ ഓഹരി
  rationale: μέρος എന്നതിന്റെ ‘പങ്ക്/ഓഹരി’ എന്ന അർത്ഥം നിലനിർത്തുകയും വിധിയിൽ ലഭിക്കുന്ന നിയുക്തഭാഗം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπίστων
  choice: അവിശ്വസ്തർ
  rationale: ഉപമയുടെ ഉടൻപ്രസക്തമായ വിശ്വസ്തത–അവിശ്വസ്തത വൈരുധ്യത്തിന് യോജിക്കുന്നു; ‘അവിശ്വാസികൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: θήσει
  choice: നിശ്ചയിക്കും
  rationale: അവന്റെ വിധിക്കപ്പെട്ട ഓഹരി ഒരു കൂട്ടത്തോടൊപ്പം നിയോഗിക്കുന്ന ന്യായവിധിസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: διχοτομήσει എന്ന ശിക്ഷാചിത്രം അക്ഷരാർഥത്തിൽ നൽകണമോ രൂപകമായി മയപ്പെടുത്തണമോ
  choice: ‘അവനെ രണ്ടായി വെട്ടും’ എന്ന കടുത്ത അക്ഷരാർഥചിത്രം മുഖ്യവാക്യത്തിൽ നിലനിർത്തി
  alternative: ‘അവനെ കഠിനമായി ശിക്ഷിക്കും’
  rationale: ഗ്രീക്കിലെ ഞെട്ടിപ്പിക്കുന്ന ന്യായവിധിചിത്രം വ്യാഖ്യാനത്തിലൂടെ മയപ്പെടുത്താതിരിക്കാൻ; രൂപകസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἀπίστων എന്നത് വിശ്വസ്തതയില്ലായ്മയെയോ വിശ്വാസമില്ലായ്മയെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: സന്ദർഭാനുസൃതമായി ‘അവിശ്വസ്തർ’ മുഖ്യവാക്യത്തിൽ
  alternative: ‘അവിശ്വാസികൾ’
  rationale: ഉപമയിലെ അടിമയുടെ വിശ്വസ്തതയാണ് ഉടൻപ്രസക്തമായ വിഷയം; എന്നാൽ പദത്തിന്റെ വിശ്വാസമില്ലായ്മ എന്ന ദൈവശാസ്ത്രപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തര സമയവാക്യങ്ങളും കടുത്ത ന്യായവിധിചിത്രവും നിലനിർത്തി; ‘ഓഹരി നിശ്ചയിക്കും’ എന്ന പ്രയോഗം മൂലത്തിലെ μέρος/τίθημι കൂട്ടിന്റെ ന്യായവിധിസൂചന സംരക്ഷിക്കുന്നു.
