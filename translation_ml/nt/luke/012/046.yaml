revisions:
- from: ആ അടിമയുടെ യജമാനൻ, അവൻ പ്രതീക്ഷിക്കാത്ത ദിവസത്തിലും അറിയാത്ത മണിക്കൂറിലും വരും; അവനെ രണ്ടായി വെട്ടി[a], അവന്റെ ഓഹരി അവിശ്വസ്തരോടൊപ്പം നിശ്ചയിക്കും[b].
