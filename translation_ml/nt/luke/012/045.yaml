source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: ml
  text: എന്നാൽ ആ അടിമ[a] തന്റെ മനസ്സിൽ, ‘എന്റെ യജമാനൻ[b] വരാൻ താമസിക്കുന്നു,’ എന്നു പറഞ്ഞ്, വേലക്കാരെയും വേലക്കാരികളെയും അടിക്കാനും ഭക്ഷിക്കാനും കുടിക്കാനും മത്തുപിടിക്കാനും തുടങ്ങുന്നുവെങ്കിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദാസൻ.’ ഗ്രീക്ക് പദമായ δοῦλος ഇവിടെ യജമാനന്റെ അധികാരത്തിനു കീഴിലുള്ള ബന്ധിത ഗൃഹാംഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘എന്റെ കർത്താവ്.’ ഇവിടെ ഗ്രീക്ക് κύριος ഉപമയിലെ ഗൃഹാധിപനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: അടിമ
  rationale: ഗൃഹനാഥന്റെ അധികാരത്തിനു കീഴിലുള്ള ബന്ധിതമായ സാമൂഹിക നില ഈ ഉപമയിൽ പ്രധാനമായതിനാൽ, പൊതുവായ ‘ദാസൻ’ അല്ലെങ്കിൽ ‘വേലക്കാരൻ’ എന്നതിനെക്കാൾ ‘അടിമ’ മൂലപദത്തിന്റെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: തന്റെ മനസ്സിൽ
  rationale: അക്ഷരാർഥമായ ‘തന്റെ ഹൃദയത്തിൽ’ എന്നതിന്റെ ആന്തരികവും സ്വകാര്യവുമായ ചിന്ത എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Χρονίζει … ἔρχεσθαι
  choice: വരാൻ താമസിക്കുന്നു
  rationale: വരവ് വൈകുന്നതിനെക്കുറിച്ചുള്ള അടിമയുടെ ധാരണയും വർത്തമാനകാലത്തിലെ തുടരുന്ന താമസവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κύριός μου
  choice: എന്റെ യജമാനൻ
  rationale: ഉപമയിലെ മനുഷ്യനായ ഗൃഹാധിപനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; അതിനാൽ ദൈവിക സ്ഥാനപ്പേരായി തെറ്റിദ്ധരിക്കാവുന്ന ‘കർത്താവ്’ എന്നതിനു പകരം അധികാരബന്ധം വ്യക്തമാക്കുന്ന ‘യജമാനൻ’ ഉപയോഗിച്ചു.
- source_word: τύπτειν
  choice: അടിക്കാൻ
  rationale: ഒറ്റത്തവണ സ്പർശിക്കുന്നതല്ല, അധികാരദുരുപയോഗമായി മർദിക്കുന്ന പ്രവൃത്തിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ‘അടിക്കാൻ’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: വേലക്കാരെയും വേലക്കാരികളെയും
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ-സ്ത്രീലിംഗ ജോടിയും ഗൃഹസേവനസന്ദർഭവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι
  choice: തിന്നുകയും കുടിക്കുകയും ലഹരിയിലാകുകയും
  rationale: മൂന്ന് സമാന്തര പ്രവൃത്തികളും വേർതിരിച്ചു നിലനിർത്തുകയും അവസാനത്തേതിൽ മദ്യലഹരിയുടെ ഫലം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉപമയിലെ κύριος എന്ന പദം മനുഷ്യനായ ഗൃഹാധിപനെയാണോ ദൈവിക കർത്താവിനെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: കഥയുടെ ഉള്ളിലെ നേരിട്ടുള്ള സൂചന അടിമയുടെ ഗൃഹാധിപനിലേക്കാണ്. ഉപമയുടെ വിപുലമായ പ്രയോഗം മുൻകൂട്ടി വാചകത്തിലേക്ക് ചേർക്കാതെ കഥാതലത്തിലെ അർഥം സംരക്ഷിച്ചു.
- issue: δοῦλος എന്ന സാമൂഹിക പദത്തിന്റെ ശക്തി
  choice: അടിമ
  alternative: ദാസൻ / വേലക്കാരൻ
  rationale: അധികാരം, വിധേയത്വം, കണക്കുബോധിപ്പിക്കൽ എന്നിവ പ്രധാനമായ ഈ സന്ദർഭത്തിൽ ബന്ധിത നില മറച്ചുവയ്ക്കാതിരിക്കാനാണ് ‘അടിമ’ തെരഞ്ഞെടുത്തത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന നിബന്ധനാവാക്യമായതിനാൽ അവസാനത്തിലെ കോമ നിലനിർത്തി. ‘തന്റെ മനസ്സിൽ’ എന്ന പ്രയോഗം ഗ്രീക്ക് ഹൃദയ-പ്രയോഗത്തിന്റെ സ്വകാര്യചിന്ത എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
