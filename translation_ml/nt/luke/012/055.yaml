  text: καὶ ὅταν νότον πνέοντα, λέγετε ὅτι Καύσων ἔσται, καὶ γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: ml
  text: തെക്കൻ കാറ്റ് വീശുമ്പോൾ[a], ‘കടുത്ത ചൂടുണ്ടാകും’[b] എന്നു നിങ്ങൾ പറയുന്നു; അങ്ങനെ സംഭവിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തെക്ക്’—അതായത്, തെക്കൻ കാറ്റ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പൊള്ളുന്ന ചൂട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νότον
  choice: തെക്കൻ കാറ്റ്
  rationale: ഈ പദത്തിന് അക്ഷരാർഥത്തിൽ ‘തെക്ക്’ എന്നും കാലാവസ്ഥാസന്ദർഭത്തിൽ ‘തെക്കൻ കാറ്റ്’ എന്നും അർഥമുണ്ട്. πνέοντα (‘വീശുന്ന’) എന്നതോടൊപ്പം വന്നതിനാൽ മലയാളത്തിൽ ‘തെക്കൻ കാറ്റ്’ എന്നു വ്യക്തമാക്കുന്നത് സ്വാഭാവികവും മൂലാർഥത്തോട് വിശ്വസ്തവുമാണ്.
- source_word: πνέοντα
  choice: വീശുമ്പോൾ
  rationale: വർത്തമാന കൃദന്തരൂപം കാറ്റ് വീശിക്കൊണ്ടിരിക്കുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. ὅταν എന്ന കാലസൂചക ഘടനയോടൊപ്പം മലയാളത്തിൽ ‘വീശുമ്പോൾ’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: λέγετε
  choice: നിങ്ങൾ പറയുന്നു
  rationale: പതിവായി ആവർത്തിക്കുന്ന കാലാവസ്ഥാനിഗമനത്തെ സൂചിപ്പിക്കുന്ന സാമാന്യ വർത്തമാനകാലം നിലനിർത്തുന്നു.
- source_word: Καύσων
  choice: കടുത്ത ചൂട്
  rationale: ഈ നാമം സാധാരണ ചൂടിനെക്കാൾ തീവ്രവും അസഹ്യവുമായ ചൂടിനെ സൂചിപ്പിക്കുന്നു. ‘കടുത്ത ചൂട്’ ആ തീവ്രത സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἔσται
  choice: ഉണ്ടാകും
  rationale: പ്രവചിക്കപ്പെടുന്ന കാലാവസ്ഥാസ്ഥിതിയെ മലയാളത്തിൽ സ്വാഭാവികമായി ഭാവികാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: γίνεται
  choice: അങ്ങനെതന്നെ സംഭവിക്കുന്നു
  rationale: പറഞ്ഞ നിഗമനം യാഥാർഥ്യമാകുന്നു എന്ന ആശയം ‘അങ്ങനെതന്നെ’ വ്യക്തമാക്കുന്നു; γίνεται എന്ന ക്രിയയുടെ സംഭവിക്കുക/ഉണ്ടാകുക എന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. കാലാവസ്ഥയെക്കുറിച്ചുള്ള പതിവ് നിരീക്ഷണത്തിന്റെ ലളിതമായ വാക്യഘടനയും മൂലപാഠത്തിലെ കാരണം–ഫലബന്ധവും നിലനിർത്തിയിരിക്കുന്നു.
