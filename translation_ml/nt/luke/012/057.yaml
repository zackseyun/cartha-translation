  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τί δὲ καὶ ἀφ’ ἑαυτῶν οὐ κρίνετε τὸ δίκαιον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/057.yaml
  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: ml
  text: ശരിയായത് എന്തെന്ന് നിങ്ങൾ സ്വയം വിധിക്കാത്തത് എന്തുകൊണ്ട്?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “നീതിയായത്” അഥവാ “ചെയ്യേണ്ട ശരിയായ കാര്യം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: എന്തുകൊണ്ട്
  rationale: മുൻവാദത്തെ കൂടുതൽ ശക്തമായി ശ്രോതാക്കളിലേക്കു തിരിക്കുന്ന ആലങ്കാരിക ചോദ്യമാണിത്. മലയാളത്തിൽ ‘എന്തുകൊണ്ട്’ സ്വാഭാവികമായി ചോദ്യത്തിന്റെ ഊന്നൽ നൽകുന്നു; തുടക്കത്തിലെ കണികകൾ വേർതിരിച്ച് യാന്ത്രികമായി പരിഭാഷപ്പെടുത്തുന്നത് അസ്വാഭാവികമാകും.
- source_word: ἀφ’ ἑαυτῶν
  choice: നിങ്ങൾ സ്വയം
  rationale: സ്വന്തം മുൻകൈയാലോ വിവേചനശേഷിയാലോ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: οὐ κρίνετε
  choice: വിധിക്കാത്തത്
  rationale: κρίνω ഇവിടെ വിലയിരുത്തി ഒരു നിഗമനത്തിലെത്തുക എന്ന അർഥത്തിലാണ്. ‘വിധിക്കുക’ അതിന്റെ ന്യായനിർണയപരവും വിലയിരുത്തൽപരവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: τὸ δίκαιον
  choice: ശരിയായത്
  rationale: 'നപുംസക ഏകവചന വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു: ‘ശരിയായത്/നീതിയായത്.’ ‘ശരിയായത്’ ഈ സന്ദർഭത്തിലെ വിശാലമായ ധാർമികവും പ്രായോഗികവുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.'
theological_decisions:
- issue: τὸ δίκαιον എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ശരിയായത്
  alternative: നീതിയായത്; ചെയ്യേണ്ട ശരിയായ കാര്യം
  rationale: ഇത് നിയമപരമായ നീതിയിലേക്കു മാത്രം ചുരുക്കാതെ ധാർമികവും പ്രായോഗികവുമായ ശരിതെറ്റുവിവേചനം ഉൾക്കൊള്ളുന്നു. പദത്തിലുള്ള നീതിയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യം. ‘നിങ്ങൾ സ്വയം’ എന്ന പ്രയോഗം വ്യക്തിപരമായ വിവേചനത്തെ വ്യക്തമാക്കുന്നു; ‘വിധിക്കുക’ മൂലപദത്തിന്റെ വിലയിരുത്തൽശക്തി നിലനിർത്തുന്നു.
