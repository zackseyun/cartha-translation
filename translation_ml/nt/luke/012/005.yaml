id: LUK.12.5
reference: Luke 12:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: ml
  text: 'എന്നാൽ ആരെയാണ് ഭയപ്പെടേണ്ടതെന്ന് ഞാൻ നിങ്ങൾക്കു കാണിച്ചുതരാം: കൊന്നശേഷം ഗെഹെന്നയിലേക്ക്[a] എറിഞ്ഞിടാൻ അധികാരമുള്ളവനെ ഭയപ്പെടുക. അതെ, ഞാൻ നിങ്ങളോടു പറയുന്നു, അവനെത്തന്നെ ഭയപ്പെടുക.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നരകത്തിലേക്ക്.’ ഗ്രീക്കുപദം ‘ഗെഹെന്ന’ എന്നാണ്; ഹിന്നോം താഴ്വരയെ ആസ്പദമാക്കിയ പ്രതീകാത്മകതയിൽ വേരുകളുള്ള ഒരു വിധിന്യായപദമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: കാണിച്ചുതരാം
  rationale: ഭാവികാലത്തിലുള്ള ക്രിയ ഒരാളെ ചൂണ്ടിക്കാണിച്ചുകൊണ്ട് ഉപദേശിക്കുന്ന അർഥം നൽകുന്നു. ‘കാണിച്ചുതരാം’ എന്നത് വ്യാഖ്യാനഭാരം കൂട്ടാതെ സ്വാഭാവികമായി ആ അർഥം നിലനിർത്തുന്നു.
- source_word: τίνα φοβηθῆτε
  choice: ആരെയാണ് ഭയപ്പെടേണ്ടതെന്ന്
  rationale: പരോക്ഷചോദ്യത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ഭയത്തിന്റെ ഗൗരവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: φοβήθητε
  choice: ഭയപ്പെടുക
  rationale: ആവർത്തിക്കുന്ന ആജ്ഞാരൂപത്തിന്റെ ശക്തിയും ഒരേ ക്രിയയുടെ പദബന്ധവും നിലനിർത്തുന്നു; ‘ബഹുമാനിക്കുക’ എന്നത് ഈ ന്യായവിധിസന്ദർഭത്തിൽ വേണ്ടത്ര ശക്തമല്ല.
- source_word: τὸν
  choice: അധികാരമുള്ളവനെ
  rationale: സുബന്തമായി പ്രവർത്തിക്കുന്ന നിർദേശകപദം തുടർന്നുള്ള വിശേഷണഘടകവുമായി ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: കൊന്നശേഷം
  rationale: μετάയോടുകൂടിയ articular infinitive സൂചിപ്പിക്കുന്ന കാലക്രമം സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: ἔχοντα ἐξουσίαν
  choice: അധികാരമുള്ളവനെ
  rationale: ἐξουσία വെറും ശക്തിയേക്കാൾ അധികാരമോ അവകാശമോ സൂചിപ്പിക്കുന്നതിനാൽ ‘അധികാരം’ യോജിക്കുന്നു.
- source_word: ἐμβαλεῖν εἰς
  choice: എറിഞ്ഞിടാൻ
  rationale: ഉള്ളിലേക്കു ശക്തിയായി ഇടുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γέενναν
  choice: ഗെഹെന്ന
  rationale: പിന്നീടുണ്ടായ വിപുലമായ ദൈവശാസ്ത്രധാരണകൾ മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ഗ്രീക്ക് വിധിന്യായപദത്തിന്റെ യഹൂദ പശ്ചാത്തലം നിലനിർത്താൻ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: ναί
  choice: അതെ
  rationale: ഉറപ്പിച്ചുപറയുന്ന ഊന്നൽ ലളിതമായും ശക്തമായും നൽകുന്നു.
- source_word: τοῦτον
  choice: അവനെത്തന്നെ
  rationale: അവസാന നിർദേശകസർവനാമത്തിന്റെ പ്രത്യേക ഊന്നൽ ‘-ത്തന്നെ’ വഴി മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിധിന്യായസന്ദർഭത്തിലെ γέενναയുടെ വിവർത്തനം
  choice: ഗെഹെന്ന
  alternative: നരകം
  rationale: മൂലപദത്തിന്റെ സ്ഥലനാമപരവും യഹൂദപ്രതീകാത്മകവുമായ പശ്ചാത്തലം സംരക്ഷിക്കാനും ‘നരകം’ എന്ന പദത്തോട് പിന്നീട് ചേർന്ന എല്ലാ ആശയങ്ങളും മുഖ്യവാചകത്തിൽ നിർബന്ധമായി ഉൾപ്പെടുത്താതിരിക്കാനും ‘ഗെഹെന്ന’ നിലനിർത്തുന്നു. വായനക്കാർക്ക് പരിചിതമായ പ്രവർത്തനസമാനപദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ച ആജ്ഞയുടെ ശക്തി നിലനിർത്താൻ രണ്ടിടത്തും ‘ഭയപ്പെടുക’ ഉപയോഗിച്ചു; അവസാനത്തെ τοῦτον എന്ന പദത്തിന്റെ ഊന്നൽ ‘അവനെത്തന്നെ’ വഴി പ്രകടമാക്കി.
