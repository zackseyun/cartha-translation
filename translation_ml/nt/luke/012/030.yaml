revisions:
- from: ലോകത്തിലെ ജനതകളെല്ലാം ഇവയെല്ലാം തേടിക്കൊണ്ടിരിക്കുന്നു[a]; എന്നാൽ ഇവ നിങ്ങൾക്ക് ആവശ്യമാണെന്ന് നിങ്ങളുടെ പിതാവ് അറിയുന്നു.
  to: ഈ കാര്യങ്ങളെല്ലാം ലോകത്തിലെ ജനതകൾ അന്വേഷിക്കുന്നു[a]; എന്നാൽ, ഇവ നിങ്ങൾക്കു ആവശ്യമുണ്ടെന്ന് നിങ്ങളുടെ പിതാവ് അറിയുന്നു.
  rationale: The revision keeps the Greek contrast, repetition, and filial designation while avoiding an added “all nations” sense and an unnecessarily progressive verbal aspect. “ഈ കാര്യങ്ങളെല്ലാം” explicitly conveys ταῦτα ... πάντα, and the footnote preserves the legitimate alternative sense of ἔθνη without imposing it on the main text.
