source:
  edition: SBLGNT
  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: ml
  text: ഈ കാര്യങ്ങളെല്ലാം ലോകത്തിലെ ജനതകൾ അന്വേഷിക്കുന്നു[a]; എന്നാൽ, ഇവ നിങ്ങൾക്കു ആവശ്യമുണ്ടെന്ന് നിങ്ങളുടെ പിതാവ് അറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ലോകത്തിലെ വിജാതീയർ.’ ഗ്രീക്ക് പദത്തിന് ‘ജനതകൾ’ എന്നോ ‘വിജാതീയർ’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: ഇവയെല്ലാം
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ഭക്ഷണം, പാനം തുടങ്ങിയ ഭൗതിക ആവശ്യങ്ങളെയാണ് നപുംസകലിംഗ ബഹുവചനപ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘ഇവയെല്ലാം’ മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: ലോകത്തിലെ ജനതകളെല്ലാം
  rationale: ἔθνη എന്നതിന് ‘ജനതകൾ’ എന്നും ‘വിജാതീയർ’ എന്നും അർഥമാകാം. പ്രധാന പാഠത്തിൽ വിശാലവും പദാനുസൃതവുമായ ‘ജനതകൾ’ നിലനിർത്തുകയും മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐπιζητοῦσιν
  choice: തേടിക്കൊണ്ടിരിക്കുന്നു
  rationale: ἐπιζητέω സജീവവും തുടർച്ചയുള്ളതുമായ പിന്തുടരലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ പ്രയോഗം അതിന്റെ ശക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑμῶν ... ὁ πατήρ
  choice: നിങ്ങളുടെ പിതാവ്
  rationale: ഗ്രീക്കിലുള്ള വാക്കുകൾ കൃത്യമായി നിലനിർത്തുന്നു; മത്തായിയിലെ സമാന്തരവാക്യത്തിൽനിന്ന് ‘സ്വർഗീയ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: οἶδεν
  choice: അറിയുന്നു
  rationale: രൂപത്തിൽ perfect ആയിരുന്നാലും οἶδα ഇവിടെ വർത്തമാനകാല അർഥത്തിലാണ്; ‘അറിയുന്നു’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: χρῄζετε τούτων
  choice: ഇവ നിങ്ങൾക്ക് ആവശ്യമാണെന്ന്
  rationale: ‘ഇവ നിങ്ങൾക്ക് ആവശ്യമുണ്ട്’ എന്ന ആശയം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ നൽകുകയും demonstrative ആയ τούτωνന്റെ വ്യക്തത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ലോകജനതകളുടെ പിന്തുടരലും ശിഷ്യരുടെ പിതൃബന്ധവും തമ്മിലുള്ള വൈരുധ്യം
  choice: ‘ലോകത്തിലെ ജനതകൾ’ എന്നും ‘നിങ്ങളുടെ പിതാവ്’ എന്നും വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: ἔθνη എന്നത് ‘വിജാതീയർ’ എന്നു പരിഭാഷപ്പെടുത്തുകയോ ‘പിതാവ്’ എന്നതിന് മുമ്പ് ‘സ്വർഗീയ’ ചേർക്കുകയോ ചെയ്യാം.
  rationale: ലൂക്കോസിന്റെ ഗ്രീക്ക് പാഠത്തിലുള്ള വിശാലതയും പിതൃബന്ധത്തിന്റെ ഊന്നലും നിലനിർത്തുന്നു; സമാന്തരപാഠത്തിൽനിന്നോ പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനത്തിൽനിന്നോ വാക്കുകൾ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനവും വൈരുധ്യവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
