id: LUK.12.38
reference: Luke 12:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: ml
  text: അവൻ രണ്ടാം യാമത്തിൽ വന്നാലും[a] മൂന്നാം യാമത്തിൽ വന്നാലും, അവരെ അങ്ങനെതന്നെ കണ്ടെത്തിയാൽ, ആ ദാസന്മാർ[b] ധന്യർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: ‘അവൻ രാത്രിയുടെ രണ്ടാം കാവൽയാമത്തിൽ വന്നാലും രാത്രിയുടെ മൂന്നാം കാവൽയാമത്തിൽ വന്നാലും.’'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അവർ’ അഥവാ ‘ആ ആളുകൾ.’ തൊട്ടുമുൻപുള്ള സന്ദർഭത്തിൽ പറഞ്ഞ ദാസന്മാരെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: ആയാലും ... ആയാലും
  rationale: ആവർത്തിച്ചുള്ള concessive/indefinite conditional ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ ആവർത്തിച്ച ‘ആയാലും’കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: രണ്ടാം യാമം ... മൂന്നാം യാമം
  rationale: ഇവിടെ φυλακή തടവറയെയോ കാവൽസ്ഥാനത്തെയോ അല്ല, രാത്രിയെ വിഭജിച്ചിരുന്ന കാവൽയാമങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘യാമം’ സംക്ഷിപ്തവും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവുമാണ്.
- source_word: ἔλθῃ
  choice: വന്ന്
  rationale: നിബന്ധനാവാക്യത്തിലെ aorist subjunctive-ന്റെ അനിശ്ചിത ഭാവിസാധ്യത ‘വന്ന് ... കണ്ടെത്തിയാൽ’ എന്ന സ്വാഭാവിക ഘടനയിൽ പ്രകടമാകുന്നു.
- source_word: εὕρῃ οὕτως
  choice: അവരെ അങ്ങനെത്തന്നെ കണ്ടെത്തിയാൽ
  rationale: οὕτως മുൻവാക്യത്തിൽ പറഞ്ഞ ദാസന്മാരുടെ ജാഗരൂകമായ നിലയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി സന്ദർഭത്തിൽനിന്നുള്ള ‘അവരെ’ ചേർത്തിരിക്കുന്നു.
- source_word: μακάριοι
  choice: ധന്യർ
  rationale: ദൈവസന്നിധിയിൽ അനുഗൃഹീതവും അഭിലഷണീയവുമായ നില എന്ന വേദപുസ്തകപരമായ ഭാരം ‘ധന്യർ’ നിലനിർത്തുന്നു; വെറും മാനസിക സന്തോഷമായി ചുരുക്കുന്നില്ല.
- source_word: ἐκεῖνοι
  choice: ആ ദാസന്മാർ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘അവർ/ആ ആളുകൾ’ എന്നാണെങ്കിലും, തൊട്ടുമുൻപുള്ള സന്ദർഭത്തിലെ ദാസന്മാരാണ് സൂചന. വ്യക്തതയ്ക്കായി പ്രതിപാദ്യം പരിമിതമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἐκεῖνοι എന്നതിന്റെ പ്രതിപാദ്യം വ്യക്തമാക്കൽ
  choice: ആ ദാസന്മാർ
  alternative: അവർ / ആ ആളുകൾ
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ δοῦλοι ഇല്ലെങ്കിലും, സമീപസന്ദർഭത്തിൽ യജമാനന്റെ ദാസന്മാരാണ് വ്യക്തമായ പ്രതിപാദ്യം. ‘ദാസന്മാർ’ എന്നു ചേർക്കുന്നത് പുതിയ ദൈവശാസ്ത്രപരമായ ആശയം ഇറക്കുമതി ചെയ്യാതെ വായനാസ്പഷ്ടത നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. രാത്രികാല കാവൽവിഭാഗം സൂചിപ്പിക്കാൻ പരിചിതമായ ‘യാമം’ ഉപയോഗിച്ചു; ആവശ്യമുള്ള വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി. വാക്യത്തിലെ ആവർത്തനവും നിബന്ധനാഭാവവും ഗ്രീക്കിനോട് ചേർന്ന് നിലനിർത്തി.
