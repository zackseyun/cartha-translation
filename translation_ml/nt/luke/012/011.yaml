id: LUK.12.11
reference: Luke 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളെ സിനഗോഗുകളുടെയും ഭരണാധികാരികളുടെയും അധികാരികളുടെയും മുമ്പാകെ കൊണ്ടുവരുമ്പോൾ[a], എങ്ങനെ അല്ലെങ്കിൽ എന്ത് പ്രതിവാദം നടത്തണമെന്നോ, എന്ത് പറയണമെന്നോ ഓർത്ത് ഉത്കണ്ഠപ്പെടരുത്;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സിനഗോഗുകളും ഭരണാധികാരികളും അധികാരികളും’ എന്നത് ശിഷ്യരെ ചോദ്യം ചെയ്യുകയോ വിചാരണ ചെയ്യുകയോ ചെയ്തേക്കാവുന്ന മതപരവും ഭരണപരവുമായ സമിതികളെയും അധികാരികളെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ὅταν δὲ
  choice: എന്നാൽ ... കൊണ്ടുവരുമ്പോൾ
  rationale: ὅταν സൂചിപ്പിക്കുന്ന ആവർത്തിക്കാവുന്ന ഭാവിസാഹചര്യം മലയാളത്തിലെ ‘-മ്പോൾ’ ഘടനയിലൂടെ സ്വാഭാവികമായി നൽകുന്നു; δέയുടെ നേരിയ സന്ദർഭമാറ്റം ‘എന്നാൽ’ കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: നിങ്ങളെ ... കൊണ്ടുവരുമ്പോൾ
  rationale: നിയമപരമായ പരിശോധനയ്ക്കായി അധികാരികളുടെ മുമ്പിൽ ഹാജരാക്കുന്നതാണ് സന്ദർഭം; ‘കൊണ്ടുവരുക’ മൂലക്രിയയുടെ വിശാല അർഥവും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: സിനഗോഗുകളുടെയും ഭരണാധികാരികളുടെയും അധികാരസ്ഥാനങ്ങളിലുള്ളവരുടെയും മുമ്പാകെ
  rationale: ἐπί + accusative ഇവിടെ അധികാരസമിതികളുടെ മുമ്പിൽ ഹാജരാക്കപ്പെടുക എന്ന ന്യായവ്യവഹാരപരമായ അർഥത്തിലാണ്. മൂന്നു വിഭാഗങ്ങളും വേർതിരിച്ചു സൂക്ഷിക്കുന്നു.
- source_word: συναγωγάς
  choice: സിനഗോഗുകൾ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള സ്ഥാപനപരമായ അർഥം നിലനിർത്തുന്നു; ഇവിടെ സിനഗോഗുമായി ബന്ധപ്പെട്ട വിചാരണാസമിതികളും ഉൾപ്പെടാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀρχάς
  choice: ഭരണാധികാരികൾ
  rationale: ഈ ഭരണ-ന്യായവ്യവഹാര സന്ദർഭത്തിൽ പദം ഭരണാധികാരികളെയോ ഭരണകർത്താക്കളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἐξουσίας
  choice: അധികാരസ്ഥാനങ്ങളിലുള്ളവർ
  rationale: അധികാരം ഏല്പിക്കപ്പെട്ട ഔദ്യോഗിക വ്യക്തികളെയോ അധികാരകേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്നതിനായി സ്വാഭാവിക മലയാളപ്രയോഗം തെരഞ്ഞെടുത്തു; ἀρχαίയുമായുള്ള പദവ്യത്യാസവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: μὴ μεριμνήσητε
  choice: ഓർത്ത് ഉത്കണ്ഠപ്പെടരുത്
  rationale: മുൻകൂട്ടിയുള്ള ആകുലചിന്തയാണ് വിലക്കപ്പെടുന്നത്. ‘ഉത്കണ്ഠപ്പെടരുത്’ അതിന്റെ ഗൗരവം കാത്തുസൂക്ഷിക്കുന്നു; ‘ഓർത്ത്’ മലയാളത്തിൽ ബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: πῶς ἢ τί
  choice: എങ്ങനെ അല്ലെങ്കിൽ എന്തു പറഞ്ഞ്
  rationale: രീതിയെയും ഉള്ളടക്കത്തെയും സൂചിപ്പിക്കുന്ന πῶς, τί രണ്ടും പ്രത്യക്ഷമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ വാക്യം ഗ്രഹിക്കാനായി ‘പറഞ്ഞ്’ ചേർത്തിരിക്കുന്നു.
- source_word: ἀπολογήσησθε
  choice: സ്വയം പ്രതിവാദിക്കണം
  rationale: ന്യായവ്യവഹാരപരമായ മറുപടി അഥവാ സ്വന്തം ഭാഗം വിശദീകരിച്ചുള്ള പ്രതിരോധം എന്ന അർഥം നൽകുന്നു; middle രൂപത്തിന്റെ ആത്മബന്ധം ‘സ്വയം’ കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: ἢ τί εἴπητε
  choice: എന്തു പറയണമെന്നോ
  rationale: പ്രതിവാദത്തിന്റെ രീതിയും ഉള്ളടക്കവും പറഞ്ഞശേഷം വരുന്ന പൊതുവായ സംസാരവിഷയത്തെ വേറിട്ടുതന്നെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ന്യായവ്യവഹാരസന്ദർഭം വ്യക്തമാക്കുമ്പോഴും സിനഗോഗ് എന്ന മൂലസ്ഥാപനപദവും πῶς ἢ τί എന്ന ഇരട്ടപ്രശ്നരൂപവും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന വാചകഭാഗങ്ങളോടു ചേർത്തിരിക്കുന്നു.
