id: LUK.12.36
reference: Luke 12:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: ml
  text: നിങ്ങളും, തങ്ങളുടെ യജമാനൻ വിവാഹവിരുന്നിൽനിന്ന് എപ്പോൾ മടങ്ങിവരുമെന്ന് കാത്തിരിക്കുന്ന ആളുകളെപ്പോലെ ആയിരിക്കുവിൻ; അവൻ വന്ന് മുട്ടുമ്പോൾ അവർ ഉടൻതന്നെ അവനു വാതിൽ തുറന്നുകൊടുക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν κύριον ἑαυτῶν
  choice: തങ്ങളുടെ യജമാനൻ
  rationale: ഈ ദാസ-ഗൃഹസന്ദർഭത്തിൽ κύριος എന്നത് വീട്ടിലെ യജമാനനെ സൂചിപ്പിക്കുന്നു; ‘കർത്താവ്’ എന്ന ദൈവനാമസദൃശ പ്രയോഗം ഇവിടെ അനാവശ്യമായ വ്യാഖ്യാനഭാരം സൃഷ്ടിക്കും.
- source_word: προσδεχομένοις
  choice: കാത്തിരിക്കുന്ന
  rationale: പ്രതീക്ഷയോടെയും സന്നദ്ധതയോടെയും കാത്തിരിക്കുക എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πότε ἀναλύσῃ ἐκ τῶν γάμων
  choice: വിവാഹവിരുന്നിൽനിന്ന് ... എപ്പോൾ മടങ്ങിവരുമെന്നു
  rationale: ἀναλύω ഇവിടെ പുറപ്പെട്ട് മടങ്ങിവരുക എന്നും γάμοι ബഹുവചനരൂപത്തിൽ വിവാഹാഘോഷം/വിരുന്ന് എന്നും അർഥമാക്കുന്നു.
- source_word: εὐθέως ἀνοίξωσιν αὐτῷ
  choice: അവർ ഉടൻതന്നെ അവനു തുറന്നുകൊടുക്കേണ്ടതിന്
  rationale: ഉടനടിയുള്ള പ്രതികരണവും വാതിൽ യജമാനനുവേണ്ടി തുറക്കുന്നതും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: ഉപമയിലെ നേരിട്ടുള്ള സാമൂഹികബന്ധം യജമാനനും കാത്തിരിക്കുന്ന ഭൃത്യന്മാരും തമ്മിലുള്ളതാണ്. യേശുവിലേക്കുള്ള ഉപമാപരമായ സൂചന ഇല്ലാതാക്കാതെ, നേരിട്ടുള്ള കഥാസന്ദർഭം മുൻനിർത്തുന്നു.
- issue: ἵνα വാക്യത്തിന്റെ ഭാവം
  choice: അവർ ... തുറന്നുകൊടുക്കേണ്ടതിനാണ് ഇത്
  alternative: അവർ ... തുറന്നുകൊടുക്കാൻ
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ലക്ഷ്യം/ഫലം നിലനിർത്തുന്നു; അതിനെ ഒരു കർശന കല്പനയായി അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ ദീർഘവാക്യഘടനയും ഉപമയുടെ ദാസ-യജമാന പശ്ചാത്തലവും കഴിയുന്നത്ര സ്വാഭാവികമായി സംരക്ഷിച്ചു.
