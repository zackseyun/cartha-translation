id: LUK.12.1
reference: Luke 12:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: ml
  text: 'ഇതിനിടെ, ജനക്കൂട്ടത്തിലെ പതിനായിരക്കണക്കിന് ആളുകൾ ഒന്നിച്ചുകൂടി പരസ്പരം ചവിട്ടിമെതിക്കത്തക്കവണ്ണം ആയപ്പോൾ, അവൻ ആദ്യം തന്റെ ശിഷ്യന്മാരോടു പറയാൻ തുടങ്ങി: “പരീശന്മാരുടെ പുളിമാവിൽനിന്ന് സൂക്ഷിക്കുവിൻ; അതു കപടതയാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν οἷς
  choice: ഇതിനിടെ ... ആയപ്പോൾ
  rationale: മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന കാലികവും സാഹചര്യസൂചകവുമായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπισυναχθεισῶν
  choice: ഒന്നിച്ചുകൂടി
  rationale: ജനക്കൂട്ടത്തിന്റെ കൂടിവരവ് പൂർത്തിയായ പശ്ചാത്തലസംഭവമായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിലെ കർമണിപ്രയോഗം മലയാളത്തിൽ നിർബന്ധമായി പദാനുപദം അടയാളപ്പെടുത്തേണ്ടതില്ല.
- source_word: τῶν μυριάδων τοῦ ὄχλου
  choice: ജനക്കൂട്ടം പതിനായിരക്കണക്കിന് ആളുകളായി
  rationale: μυριάδες എന്നത് കൃത്യമായി പതിനായിരങ്ങളുടെ ഗുണിതമോ പൊതുവായി അതിവലിയൊരു സംഖ്യയോ സൂചിപ്പിക്കാം; ‘പതിനായിരക്കണക്കിന്’ ആ വിശാല അർഥപരിധി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: പരസ്പരം ചവിട്ടിമെതിക്കുന്ന സ്ഥിതിയായപ്പോൾ
  rationale: ὥστε + infinitive സൂചിപ്പിക്കുന്ന ഫലവും തിരക്കിലെ തുടർച്ചയായ അരാജകാവസ്ഥയും വ്യക്തമാക്കുന്നു.
- source_word: ἤρξατο λέγειν
  choice: പറയാൻ തുടങ്ങി
  rationale: ആരംഭസൂചകമായ ഗ്രീക്ക് ഘടനയെ സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: ആദ്യം തന്റെ ശിഷ്യന്മാരോട്
  rationale: ആദ്യം അഭിസംബോധന ചെയ്യപ്പെട്ടവർ ശിഷ്യന്മാരാണെന്ന പ്രേക്ഷക-മുൻഗണന നിലനിർത്തുന്നു; പിന്നാലെയുള്ള പ്രസംഗക്രമത്തെക്കുറിച്ച് അനാവശ്യമായ നിഗമനം ചേർക്കുന്നില്ല.
- source_word: Προσέχετε ἑαυτοῖς ἀπό
  choice: '...നെക്കുറിച്ച് ജാഗ്രത പാലിക്കുവിൻ'
  rationale: സ്വയം സൂക്ഷിക്കണമെന്ന മുന്നറിയിപ്പിന്റെ ശക്തി മലയാളത്തിലെ സ്വാഭാവിക നിർദേശരൂപത്തിൽ നൽകുന്നു; പ്രതിഫലന ദത്തിവിനെ അസ്വാഭാവികമായി പദാനുപദം മാറ്റുന്നില്ല.
- source_word: τῆς ζύμης
  choice: പുളിമാവ്
  rationale: അപ്പം പുളിപ്പിക്കുന്ന വസ്തുവിന്റെ ദൃശ്യരൂപകവും തിരുവെഴുത്തിലെ അന്തർപാഠബന്ധവും നിലനിർത്തുന്നു; ‘സ്വാധീനം’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് രൂപകം ചുരുക്കുന്നില്ല.
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: അത substantively?
  rationale: placeholder
theological_decisions:
- issue: ‘പുളിമാവ്’ എന്ന രൂപകത്തിന്റെ സ്വഭാവം
  choice: രൂപകം നിലനിർത്തി, വാക്യം തന്നെയുള്ള വിശദീകരണമായി ‘കപടഭക്തി’ എന്നു ചേർത്തു.
  alternative: ‘ദുഷിച്ച സ്വാധീനം’ അല്ലെങ്കിൽ ‘ഉപദേശം’ എന്ന് വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: ലൂക്കോസ് രൂപകത്തെ ὑπόκρισις എന്നു തിരിച്ചറിയുന്നതിനാൽ രൂപകം മാറ്റാതെ സൂക്ഷിക്കുന്നത് സാഹിത്യ-ദൈവശാസ്ത്ര സാന്ദ്രത നിലനിർത്തുന്നു.
- issue: πρῶτον എന്നതിന്റെ വ്യാപ്തി
  choice: ‘ആദ്യം തന്റെ ശിഷ്യന്മാരോട്’ എന്ന പ്രേക്ഷക-മുൻഗണന.
  alternative: ‘ഒന്നാമതായി അവൻ ശിഷ്യന്മാരോടു പറഞ്ഞു’ എന്ന പ്രസംഗവിഷയക്രമം.
  rationale: ഗ്രീക്ക് രണ്ട് സൂക്ഷ്മതകൾക്കും ഇടവരുത്തുന്നുവെങ്കിലും, തിരഞ്ഞെടുത്ത രൂപം സാധ്യതയേറിയ ആഖ്യാനാർഥം നൽകുകയും പറയാത്ത പിന്നീടുള്ള ക്രമം ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ὑπόκρισις എന്നതിന്റെ അർഥം
  choice: കപടഭക്തി
  alternative: കപടനാട്യം / കപടം
  rationale: പരീശന്മാരുടെ മതപരമായ പുറംപ്രകടനവും ഉള്ളിലെ അസത്യവും ഉൾക്കൊള്ളുന്ന ആശയം സാധാരണ മലയാളിക്ക് വ്യക്തമായി നൽകുന്നു; അതിനെ ഒരു പ്രത്യേക സമുദായത്തിന്റെ സിദ്ധാന്തമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുളിമാവ്’ എന്ന ബൈബിൾരൂപകം നിലനിർത്തി; ‘ജാഗ്രത പാലിക്കുവിൻ’ എന്ന ബഹുവചന നിർദേശരൂപം ശിഷ്യന്മാരോടുള്ള നേരിട്ടുള്ള മുന്നറിയിപ്പ് വ്യക്തമാക്കുന്നു.
