language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ അവരോടു പറഞ്ഞു: “സൂക്ഷിക്കുവിൻ; എല്ലാത്തരം അത്യാഗ്രഹത്തിൽനിന്നും നിങ്ങളെത്തന്നെ കാത്തുകൊള്ളുവിൻ.[a] കാരണം, ഒരാളുടെ ജീവൻ അയാൾക്കുള്ള വസ്തുവകകളുടെ സമൃദ്ധിയിൽ നിന്നല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സകല ദ്രവ്യാഗ്രഹത്തിൽനിന്നും.” πλεονεξία എന്ന ഗ്രീക്ക് പദത്തിന് അത്യാഗ്രഹം, ദ്രവ്യാഗ്രഹം, കൂടുതൽ സ്വന്തമാക്കാനുള്ള മോഹം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: സൂക്ഷിക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ മുന്നറിയിപ്പുസ്വരം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: φυλάσσεσθε
  choice: നിങ്ങളെത്തന്നെ കാത്തുകൊള്ളുവിൻ
  rationale: മധ്യപ്രയോഗത്തിലുള്ള സ്വയം സംരക്ഷിക്കണമെന്ന ആശയം നിലനിർത്തുകയും മുൻ ആജ്ഞയോടുള്ള ആവർത്തനബലം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: എല്ലാത്തരം അത്യാഗ്രഹത്തിൽനിന്നും
  rationale: πάσης എന്നതിന്റെ സമഗ്രതയും πλεονεξία സൂചിപ്പിക്കുന്ന കൂടുതൽ സ്വന്തമാക്കാനുള്ള അതിരില്ലാത്ത മോഹത്തിന്റെ വിശാല അർഥവും നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുന്നറിയിപ്പിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: ഒരാൾക്ക് സമൃദ്ധിയായി സ്വത്തുണ്ടെങ്കിലും അയാളുടെ ജീവൻ ആ സ്വത്തിൽനിന്നല്ല
  rationale: സ്വത്തുക്കൾ ധാരാളമുണ്ടാകുന്നതിൽനിന്നല്ല ജീവൻ ലഭിക്കുകയോ നിലനിൽക്കുകയോ ചെയ്യുന്നത് എന്ന ഗ്രീക്ക് വാക്യത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ജീവൻ’ എന്ന പദത്തിന്റെ അർഥപരമായ തുറന്ന നിലയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: πλεονεξία എന്ന മുന്നറിയിപ്പിന്റെ വ്യാപ്തി
  choice: എല്ലാത്തരം അത്യാഗ്രഹം
  alternative: സകല ദ്രവ്യാഗ്രഹവും
  rationale: മറ്റൊരാളുടെ വസ്തുവിനോടുള്ള മോഹത്തിൽ മാത്രം അർഥം ചുരുക്കാതെ, കൂടുതൽ കൈവശപ്പെടുത്താനുള്ള എല്ലാ രൂപങ്ങളിലുമുള്ള അതിരില്ലാത്ത ആഗ്രഹത്തെ ഉൾക്കൊള്ളുന്നു.
- issue: ἡ ζωή എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ജീവൻ
  alternative: ജീവിതം
  rationale: ജീവന്റെ ഉറവിടം, നിലനിൽപ്പ്, ജീവിതത്തിന്റെ യഥാർഥ സ്വഭാവം എന്നിവയ്ക്കിടയിലെ ഗ്രീക്ക് പദത്തിന്റെ അർഥസാധ്യത അനാവശ്യമായി ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: τινὶ ... αὐτοῦ ... αὐτῷ എന്ന പൊതുവായ ഏകവചനപ്രയോഗം
  choice: ഒരാൾക്ക് ... അയാളുടെ
  alternative: മനുഷ്യന്റെ ... അവന്റെ
  rationale: വാക്യം പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നതല്ലെന്ന പൊതുവായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ബഹുവചന ആജ്ഞകൾക്ക് ‘-വിൻ’ രൂപം ഉപയോഗിച്ച് യേശുവിന്റെ നേരിട്ടുള്ള മുന്നറിയിപ്പിന്റെ ഔന്നത്യം സൂക്ഷിച്ചിരിക്കുന്നു.
