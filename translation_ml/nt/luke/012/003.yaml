id: LUK.12.3
reference: Luke 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഇരുട്ടിൽ നിങ്ങൾ പറഞ്ഞതെല്ലാം വെളിച്ചത്തിൽ കേൾക്കപ്പെടും; അകത്തെ മുറികളിൽ നിങ്ങൾ ചെവിയിൽ പറഞ്ഞത് വീടുകളുടെ മുകളിൽ[a] പരസ്യമായി വിളിച്ചുപറയപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വീടുകളുടെ മുകളിൽനിന്ന്.’ പുരാതനകാലത്തെ പരന്ന മേൽക്കൂരകളിൽനിന്ന് പൊതുവായി അറിയിക്കുന്ന ദൃശ്യമാണ് ഇവിടെ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ മറഞ്ഞിരിക്കുന്നതു വെളിപ്പെടുമെന്ന ആശയത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅσα
  choice: പറഞ്ഞതെല്ലാം
  rationale: രഹസ്യമായി പറഞ്ഞ എല്ലാ കാര്യങ്ങളെയും സമഗ്രമായി ഉൾക്കൊള്ളുന്ന അനിശ്ചിത ബന്ധസർവനാമത്തിന്റെ വ്യാപ്തി നൽകുന്നു.
- source_word: ἐν τῇ σκοτίᾳ / ἐν τῷ φωτί
  choice: ഇരുട്ടിൽ / വെളിച്ചത്തിൽ
  rationale: രഹസ്യവും പരസ്യവുമായ വെളിപ്പെടുത്തലിന്റെ ദൃശ്യവൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἀκουσθήσεται
  choice: കേൾക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πρὸς τὸ οὖς
  choice: ചെവിയിൽ
  rationale: സ്വകാര്യമായി മന്ത്രിച്ചുപറയുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികവും ദൃശ്യവുമായ രീതിയിൽ അറിയിക്കുന്നു.
- source_word: ἐν τοῖς ταμείοις
  choice: അകത്തെ മുറികളിൽ
  rationale: സംഭരണമുറി എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ, സ്വകാര്യവും അടച്ചതുമായ ഉള്ളറകളെ സൂചിപ്പിക്കുന്നു.
- source_word: κηρυχθήσεται
  choice: പരസ്യമായി വിളിച്ചുപറയപ്പെടും
  rationale: κηρύσσω സൂചിപ്പിക്കുന്ന പൊതുഘോഷണത്തിന്റെ ശക്തി നൽകുകയും മതപ്രസംഗം എന്ന ചുരുങ്ങിയ അർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ τῶν δωμάτων
  choice: വീടുകളുടെ മുകളിൽനിന്ന്
  rationale: പരന്ന മേൽക്കൂരകളിൽനിന്നുള്ള പൊതുഘോഷണത്തിന്റെ സാംസ്കാരിക ദൃശ്യം ആധുനിക വായനക്കാരന് വ്യക്തമായി എത്തിക്കുന്നു; ഗ്രീക്കിലെ ἐπί സന്ദർഭത്തിൽ സ്ഥാനമോ ഉറവിടമോ ആയി മനസ്സിലാക്കാം.
theological_decisions:
- issue: മറഞ്ഞ കാര്യങ്ങളുടെ വെളിപ്പെടുത്തൽ എപ്പോൾ, എങ്ങനെ സംഭവിക്കുന്നു
  choice: രഹസ്യമായി പറഞ്ഞത് പരസ്യമാകുമെന്ന പൊതുവായ മുന്നറിയിപ്പായി നിലനിർത്തി
  alternative: ഇത് അന്തിമ ന്യായവിധിയിലോ ചരിത്രത്തിലെ തൽക്കാല വെളിപ്പെടുത്തലിലോ മാത്രം സംഭവിക്കുന്നതായി വ്യക്തമാക്കുക
  rationale: സമീപസന്ദർഭം കപടഭക്തി വെളിപ്പെടുന്നതിനെക്കുറിച്ചാണെങ്കിലും, വാക്യം വെളിപ്പെടുത്തലിന്റെ സമയമോ മാർഗമോ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘ഇരുട്ടിൽ/വെളിച്ചത്തിൽ’ എന്ന രൂപകവൈരുധ്യവും കർമണിപ്രയോഗങ്ങളിലെ വെളിപ്പെടുത്തൽഭാവവും സംരക്ഷിച്ചു.
