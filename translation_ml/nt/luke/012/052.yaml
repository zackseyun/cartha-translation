source:
  edition: SBLGNT
  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: ml
  text: കാരണം, ഇപ്പോൾ മുതൽ ഒരു വീട്ടിൽ അഞ്ചുപേർ ഭിന്നിച്ചിരിക്കും[a]—മൂന്നുപേർ രണ്ടുപേർക്കെതിരെയും രണ്ടുപേർ മൂന്നുപേർക്കെതിരെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു കുടുംബത്തിൽ.” ഗ്രീക്ക് പദം വീടിനെയോ അതിൽ കഴിയുന്ന കുടുംബഘടകത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: ഉണ്ടാകും / ഭിന്നിച്ചുനിൽക്കും
  rationale: ഭാവികാലക്രിയയായ εἰμί ഇവിടെ അഞ്ചുപേരെ പരിചയപ്പെടുത്തുന്നു; മലയാളത്തിൽ വിഭക്താവസ്ഥ സൂചിപ്പിക്കുന്ന കൃതന്തത്തോടൊപ്പം ‘ഭിന്നിച്ചുനിൽക്കും’ എന്നു ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ വിഭജനത്തെ വിശദീകരിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ τοῦ νῦν
  choice: ഇപ്പോൾമുതൽ
  rationale: മുന്നോട്ടുള്ള കാലസൂചന ആധുനികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: πέντε
  choice: അഞ്ചുപേർ
  rationale: വീട്ടിലെ വ്യക്തികളെയാണ് സംഖ്യ സൂചിപ്പിക്കുന്നത്; അതിനാൽ മനുഷ്യരെ എണ്ണുന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: ഒരു വീട്ടിൽ
  rationale: οἶκος എന്നതിന്റെ മൂർത്തമായ ‘വീട്’ എന്ന അർഥം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; കുടുംബം/വീട്ടുകാർ എന്ന സാമൂഹിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: διαμεμερισμένοι
  choice: ഭിന്നിച്ചുനിൽക്കും
  rationale: διαμερίζω എന്ന ക്രിയയുടെ perfect passive participle വിഭജനത്തിന്റെ ഫലമായി തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘ഭിന്നിച്ചുനിൽക്കും’ ആ നിലയും ബന്ധപരമായ എതിർപ്പും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: മൂന്നുപേർ രണ്ടുപേർക്കെതിരെ
  rationale: ഇവിടെയുള്ള ἐπί + dative കൂട്ടത്തിനകത്തെ എതിർപ്പിനെ സൂചിപ്പിക്കുന്നു; ‘എതിരെ’ വ്യക്തവും സമകാലികവുമാണ്.
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: രണ്ടുപേർ മൂന്നുപേർക്കെതിരെ
  rationale: മുൻപ്രയോഗത്തിന്റെ സമാന്തരതയും പരസ്പരവിരുദ്ധതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: οἶκος എന്നത് ഭൗതികമായ ‘വീട്’ എന്നോ കുടുംബഘടകമായ ‘വീട്ടുകാർ/കുടുംബം’ എന്നോ വിവർത്തനം ചെയ്യണമോ
  choice: ഒരു വീട്ടിൽ
  alternative: ഒരു കുടുംബത്തിൽ / ഒരു വീട്ടിലെ ആളുകളിൽ
  rationale: അടുത്ത വാക്യത്തിലെ കുടുംബബന്ധങ്ങൾ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നുവെങ്കിലും, ഗ്രീക്കിലെ പദത്തിന് ഭൗതിക വീടും കുടുംബഘടകവും സൂചിപ്പിക്കാം. അതിനാൽ പ്രധാനപാഠത്തിൽ ‘വീട്’ നിലനിർത്തി അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഭിന്നിച്ചുനിൽക്കും’ എന്ന പ്രയോഗം perfect participle സൂചിപ്പിക്കുന്ന തുടരുന്ന വിഭക്താവസ്ഥയെ സ്വാഭാവികമായി കൈമാറുന്നു; അവസാനത്തെ സമാന്തര ഘടന മൂലപാഠത്തിന്റെ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു.
