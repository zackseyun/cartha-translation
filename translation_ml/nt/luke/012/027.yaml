id: LUK.12.27
reference: Luke 12:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: ml
  text: 'ലില്ലിപ്പൂക്കൾ[a] എങ്ങനെ വളരുന്നു എന്നു ശ്രദ്ധിച്ചു നോക്കൂ: അവ അധ്വാനിക്കുന്നില്ല, നൂൽ നൂൽക്കുന്നതുമില്ല. എന്നിട്ടും ഞാൻ നിങ്ങളോടു പറയുന്നു: ശലോമോൻപോലും തന്റെ സകല മഹത്വത്തിലും[b] ഇവയിൽ ഒന്നിനെപ്പോലെ വസ്ത്രം ധരിച്ചിരുന്നില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കാട്ടുപൂക്കൾ’ അല്ലെങ്കിൽ ‘പൂക്കൾ’; ഗ്രീക്കിൽ പ്രത്യേകമായി ‘ലില്ലിപ്പൂക്കൾ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തന്റെ സകല വൈഭവത്തിലും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: ശ്രദ്ധിച്ചുനോക്കൂ
  rationale: കേവലം കാണുക എന്നതിലുപരി ശ്രദ്ധാപൂർവം നിരീക്ഷിച്ച് ചിന്തിക്കാനുള്ള ബഹുവചന ആജ്ഞയാണ് ഇവിടെ; ആ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὰ κρίνα
  choice: ലില്ലിപ്പൂക്കൾ
  rationale: ഗ്രീക്ക് പദം പ്രത്യേകമായി ലില്ലിപ്പൂക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘പൂക്കൾ’ എന്നു വിപുലീകരിക്കാതെ മൂലപാഠത്തിന്റെ പ്രത്യേകത നിലനിർത്തി.
- source_word: πῶς αὐξάνει
  choice: എങ്ങനെ വളരുന്നു
  rationale: ഗ്രീക്കിൽ നപുംസക ബഹുവചന കർത്താവിനോടൊപ്പം ഏകവചന ക്രിയ വന്നിട്ടുണ്ടെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനസൂചന നിലനിൽക്കുന്നു; πῶς എന്നതിന്റെ രീതിസൂചകമായ അർഥം ‘എങ്ങനെ’ നൽകുന്നു.
- source_word: οὐ κοπιᾷ
  choice: അവ അധ്വാനിക്കുന്നില്ല
  rationale: κοπιάω കഠിനമായി പണിയെടുക്കുക, അധ്വാനിക്കുക എന്ന അർഥം നൽകുന്നു; ‘അധ്വാനിക്കുക’ വ്യക്തവും മാന്യവുമായ ആധുനിക പ്രയോഗമാണ്.
- source_word: οὐδὲ νήθει
  choice: നൂൽ നൂൽക്കുന്നതുമില്ല
  rationale: νήθω നാരിൽനിന്ന് നൂൽ ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; വസ്ത്രനിർമാണവുമായി ബന്ധപ്പെട്ട ആ ചിത്രം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: λέγω δὲ ὑμῖν
  choice: എന്നിട്ടും ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δὲ ഇവിടെ നിരീക്ഷണത്തിൽനിന്ന് ഊന്നലുള്ള നിഗമനത്തിലേക്കുള്ള നേരിയ വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു; ‘എന്നിട്ടും’ ആ പ്രഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐδὲ Σολομὼν
  choice: ശലോമോൻ ... പോലും ... ഇല്ല
  rationale: οὐδὲയിലെ ഊന്നിയ നിഷേധം മലയാളത്തിലെ ‘പോലും ... ഇല്ല’ എന്ന ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: തന്റെ സകല മഹത്വത്തിലും
  rationale: δόξα ഇവിടെ രാജകീയ പ്രഭയെയും വൈഭവത്തെയും സൂചിപ്പിക്കുന്നു; ‘മഹത്വം’ വിശാലമായ പദപ്രതിധ്വനി നിലനിർത്തുകയും സന്ദർഭത്തിൽ സ്വാഭാവികമാവുകയും ചെയ്യുന്നു.
- source_word: περιεβάλετο
  choice: അണിഞ്ഞൊരുങ്ങിയിരുന്നില്ല
  rationale: വസ്ത്രം ധരിച്ച അവസ്ഥയെ സൂചിപ്പിക്കുന്ന മധ്യ/കർമണി രൂപം പൂക്കളുടെ സൗന്ദര്യവുമായുള്ള താരതമ്യത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പ്രവർത്തകനെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ὡς ἓν τούτων
  choice: ഇവയിൽ ഒന്നിനെപ്പോലും
  rationale: ലില്ലിപ്പൂക്കളിലൊന്നുമായുള്ള നേരിട്ടുള്ള താരതമ്യം ചുരുക്കമായും വ്യക്തമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുഷ്പപ്രതീകത്തിന്റെ നിർദേശം
  choice: പൊതുവായി ‘പൂക്കൾ’ എന്നാക്കാതെ പ്രത്യേകമായ ‘ലില്ലിപ്പൂക്കൾ’ നിലനിർത്തി.
  alternative: പൂക്കൾ; കാട്ടുപൂക്കൾ
  rationale: മൂലഗ്രീക്ക് κρίνα എന്നു പ്രത്യേകമായി പറയുന്നു. ദൈവത്തിന്റെ സൃഷ്ടിപരിപാലനമാണ് വിശാലമായ പ്രമേയമെങ്കിലും പദത്തെ പൊതുവാക്കേണ്ട ദൈവശാസ്ത്രപരമായ ആവശ്യമില്ല.
- issue: ശലോമോന്റെ δόξα എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മഹത്വം
  alternative: വൈഭവം; പ്രഭ
  rationale: രാജകീയ വൈഭവം സന്ദർഭാർഥമാണെങ്കിലും ‘മഹത്വം’ മൂലപദത്തിന്റെ വിശാലമായ അർഥവ്യാപ്തിയും ബൈബിൾപരമായ പദബന്ധവും നിലനിർത്തുന്നു.
- issue: περιεβάλετο എന്ന രൂപത്തിലെ പ്രവർത്തകത്വം
  choice: ‘അണിഞ്ഞൊരുങ്ങിയിരുന്നു’ എന്ന അവസ്ഥാസൂചക പ്രയോഗം
  alternative: വസ്ത്രം ധരിച്ചിരുന്നു; അണിയിക്കപ്പെട്ടിരുന്നു
  rationale: ഗ്രീക്ക് മധ്യ/കർമണി രൂപം പ്രവർത്തകനെ വ്യക്തമായി നിർണയിക്കുന്നില്ല; മലയാളത്തിൽ പ്രവർത്തകത്വം അമിതമായി വ്യക്തമാക്കാതെ വസ്ത്രധാരണചിത്രം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യത കൈവിടാത്ത ശൈലി. ‘ശ്രദ്ധിച്ചുനോക്കൂ’ എന്നത് അഭിസംബോധനയുടെ ബഹുവചനഭാവവും ചിന്താപൂർവമായ നിരീക്ഷണവും നൽകുന്നു. ‘നൂൽ നൂൽക്കുക’ വസ്ത്രനിർമാണചിത്രം വ്യക്തമാക്കുന്നു. ഇംഗ്ലീഷ് മാതൃകയിൽ [b] അടയാളം ‘I tell you’ എന്നതിനു പിന്നാലെയുണ്ടായിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് δόξα/‘glory’ എന്ന പദവികല്പത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ‘മഹത്വത്തിലും’ എന്നതിനു പിന്നാലെ ശരിയായ സ്ഥാനത്ത് ചേർത്തിരിക്കുന്നു.
