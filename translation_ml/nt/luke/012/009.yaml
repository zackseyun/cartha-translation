  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: ml
  text: എന്നാൽ മനുഷ്യരുടെ മുമ്പിൽ എന്നെ നിഷേധിക്കുന്നവൻ ദൈവത്തിന്റെ ദൂതന്മാരുടെ മുമ്പിൽ നിഷേധിക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിഷേധിക്കപ്പെടും’ എന്നതിന് ‘തള്ളിപ്പറയപ്പെടും’ എന്നും പരിഭാഷപ്പെടുത്താം; മൂലഭാഷയിലെ രണ്ടാമത്തെ ക്രിയ ആദ്യത്തെ ‘നിഷേധിക്കുക’ എന്ന ക്രിയയുടെ കൂടുതൽ ശക്തമായ ബന്ധുരൂപമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀρνησάμενός με
  choice: എന്നാൽ ... എന്നെ നിഷേധിക്കുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ aorist participle ഒരു പൊതുതത്ത്വം സൂചിപ്പിക്കുന്ന നാമവാചകപ്രയോഗമാണ്. മലയാളത്തിൽ വർത്തമാനകാലരൂപം സ്വാഭാവികമാണ്; ‘നിഷേധിക്കുന്നവൻ ... നിഷേധിക്കപ്പെടും’ എന്ന പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ മുമ്പിൽ
  rationale: ἄνθρωποι ഇവിടെ ലിംഗഭേദമില്ലാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുകയും ദൈവത്തിന്റെ ദൂതന്മാരോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀπαρνηθήσεται
  choice: നിഷേധിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം അതേപടി നിലനിർത്തി, പ്രവർത്തകനെ പാഠം പറയാത്തിടത്ത് ചേർത്തിട്ടില്ല. ആദ്യ ക്രിയയുമായുള്ള ഗൗരവമുള്ള പ്രതിപ്രവർത്തനസാമ്യവും ഇതിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ദൂതന്മാരുടെ മുമ്പിൽ
  rationale: ഗ്രീക്കിലെ genitive ബന്ധവും സ്വർഗീയസന്നിധിയുടെ ആശയവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ‘നിഷേധിക്കപ്പെടും’ എന്ന കർമണിക്രിയയുടെ പരോക്ഷ പ്രവർത്തകൻ
  choice: യേശുവോ ദൈവമോ എന്ന് വ്യക്തമാക്കാതെ കർമണിപ്രയോഗം നിലനിർത്തുക
  alternative: ‘മനുഷ്യപുത്രൻ അവനെ നിഷേധിക്കും’ എന്നോ ‘ദൈവം അവനെ നിഷേധിക്കും’ എന്നോ പ്രവർത്തകനെ വ്യക്തമാക്കുക
  rationale: ഗ്രീക്കിൽ പ്രവർത്തകൻ പറയപ്പെട്ടിട്ടില്ല. സമീപസന്ദർഭം ഒരു നിഗമനത്തിന് വഴിയൊരുക്കുന്നെങ്കിലും, ഈ വാക്യത്തിലെ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ തുറന്ന നില വിവർത്തനം പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവപൂർണവുമായ ശൈലി. ‘മനുഷ്യർ’ എന്ന ഉൾക്കൊള്ളുന്ന പദം ഉപയോഗിച്ച് മനുഷ്യരും ദൈവദൂതന്മാരും തമ്മിലുള്ള വൈരുധ്യം സംരക്ഷിച്ചു; കർമണിപ്രയോഗത്തിന്റെ അവ്യക്തത നിലനിർത്തി.
