id: LUK.12.26
reference: Luke 12:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: ml
  text: അതിനാൽ, ഏറ്റവും ചെറിയ കാര്യംപോലും ചെയ്യാൻ നിങ്ങൾക്കു കഴിയുന്നില്ലെങ്കിൽ, ശേഷിക്കുന്ന കാര്യങ്ങളെക്കുറിച്ച് നിങ്ങൾ ഉത്കണ്ഠപ്പെടുന്നത് എന്തിന്?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: അതിനാൽ ... എങ്കിൽ
  rationale: εἰയുടെ സോപാധിക അർഥവും οὖν നൽകുന്ന മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധവും സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐδὲ ἐλάχιστον
  choice: ഏറ്റവും ചെറിയ കാര്യംപോലും
  rationale: ἐλάχιστον എന്ന നപുംസക ഏകവചന വിശേഷണം ഇവിടെ നാമവാചകമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ‘കാര്യം’ ചേർക്കുന്നത് സൂചിതമായ അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: δύνασθε
  choice: ചെയ്യാൻ നിങ്ങൾക്കു കഴിയുന്നില്ല
  rationale: കഴിവിനെയോ പ്രാപ്തിയെയോ സൂചിപ്പിക്കുന്ന δύναμαιയുടെ അർഥം നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: τί
  choice: എന്തിന്
  rationale: περὶയും ഉത്കണ്ഠയെ സൂചിപ്പിക്കുന്ന ക്രിയയും ചേർന്ന ഈ ചോദ്യത്തിൽ τί കാരണാർഥകമായ അലങ്കാരചോദ്യമാണ്; ‘എന്തിന്’ ആ പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: περὶ τῶν λοιπῶν
  choice: ശേഷിക്കുന്ന കാര്യങ്ങളെക്കുറിച്ച്
  rationale: ‘ഏറ്റവും ചെറിയ കാര്യം’ എന്നതിനപ്പുറമുള്ള ബാക്കി കാര്യങ്ങളെയാണ് λοιπῶν സൂചിപ്പിക്കുന്നത്; താരതമ്യബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: μεριμνᾶτε
  choice: നിങ്ങൾ ഉത്കണ്ഠപ്പെടുന്നത്
  rationale: തുടർച്ചയായ ആശങ്കയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല ഭാവം നിലനിർത്തുന്നു; സാധാരണ വിവേകപൂർവമായ കരുതലിനെ നിരോധിക്കുന്നതായി തെറ്റിദ്ധരിപ്പിക്കാതെയും ഇരിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിൽ ആശ്രയിക്കുന്നതിനെക്കുറിച്ചുള്ള യേശുവിന്റെ ഉപദേശത്തിൽ μεριμνάωയുടെ പരിഭാഷ
  choice: ഉത്കണ്ഠപ്പെടുക
  alternative: വേവലാതിപ്പെടുക / ആശങ്കപ്പെടുക / കരുതൽ കാണിക്കുക
  rationale: സന്ദർഭം എല്ലാ വിവേകപൂർവമായ കരുതലിനെയും അല്ല, അനുചിതമായ ആശങ്കയെയാണ് അഭിസംബോധന ചെയ്യുന്നത്. ‘ഉത്കണ്ഠപ്പെടുക’ ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ ഈ വ്യത്യാസം നിലനിർത്തുന്നു; അതിനെ വൈദ്യശാസ്ത്രപരമായ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ സോപാധിക നിഗമനവും അലങ്കാരചോദ്യത്തിന്റെ ശക്തിയും സംരക്ഷിച്ചിരിക്കുന്നു. ഈ വാക്യത്തിന് നൽകിയിരിക്കുന്ന ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് പ്രധാന പാഠത്തിലെ വേറൊരു ഘടകത്തോട് പൊരുത്തപ്പെടാത്തതിനാൽ, ഗ്രീക്ക് മൂലപാഠത്തിൽ ഇല്ലാത്ത അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
