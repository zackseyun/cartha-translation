id: LUK.12.49
reference: Luke 12:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πῦρ ἦλθον βαλεῖν ⸀ἐπὶ τὴν γῆν, καὶ τί θέλω εἰ ἤδη ἀνήφθη;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: ml
  text: ഭൂമിയിൽ തീ എറിയാൻ ഞാൻ വന്നു; അത് ഇതിനകം കൊളുത്തപ്പെട്ടിരുന്നെങ്കിൽ എന്ന് ഞാൻ എത്ര ആഗ്രഹിക്കുന്നു![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അത് ഇതിനകം കൊളുത്തപ്പെട്ടിട്ടുണ്ടെങ്കിൽ, ഞാൻ എന്താണ് ആഗ്രഹിക്കുന്നത്?” ഗ്രീക്ക് ഉപവാക്യം ദുഷ്കരമാണ്; മുഖ്യപാഠം ശക്തമായ ആഗ്രഹം പ്രകടിപ്പിക്കുന്നതായുള്ള സാധ്യതയേറിയ പ്രയോഗാർഥം നൽകുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: തീ
  rationale: രൂപകത്തെ വ്യാഖ്യാനിച്ച് ‘ന്യായവിധി’ എന്നോ ‘ശുദ്ധീകരണം’ എന്നോ മാറ്റാതെ, ഗ്രീക്കിലെ ദൃശ്യബിംബം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἦλθον
  choice: ഞാൻ വന്നത്
  rationale: യേശുവിന്റെ വരവിന്റെ ദൗത്യലക്ഷ്യം സൂചിപ്പിക്കുന്ന അഒറിസ്റ്റ് രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: βαλεῖν
  choice: എറിയാൻ
  rationale: βάλλω എന്ന ക്രിയയുടെ ശക്തവും സജീവവുമായ ‘എറിയുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘കൊണ്ടുവരുക’ എന്നത് അതിനെ മന്ദമാക്കും.
- source_word: ἐπὶ τὴν γῆν
  choice: ഭൂമിയിൽ
  rationale: γῆ ഇവിടെ പ്രാദേശികമായ ‘ദേശം’ എന്നതിനെക്കാൾ വിശാലമായ ‘ഭൂമി’ എന്ന അർഥത്തിൽ സ്വാഭാവികമാണ്.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: അത് ഇതിനകം കത്തിപ്പടർന്നിരുന്നെങ്കിൽ എന്ന് ഞാൻ എത്ര ആഗ്രഹിക്കുന്നു!
  rationale: ദുഷ്കരമായ ഗ്രീക്ക് ഘടനയെ ശക്തമായ ആഗ്രഹം പ്രകടിപ്പിക്കുന്ന ഉദ്‌ഗാരമായി നൽകുന്നു. ‘കത്തിപ്പടരുക’ തീ കൊളുത്തപ്പെടുന്നതോടൊപ്പം അതിന്റെ സജീവ വ്യാപനഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἤδη
  choice: ഇതിനകം
  rationale: പ്രവൃത്തി അപ്പോഴേക്കും സംഭവിച്ചിരിക്കണമെന്ന ആഗ്രഹം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀνήφθη
  choice: കത്തിപ്പടർന്നിരുന്നെങ്കിൽ
  rationale: ἀνάπτω എന്നതിന്റെ പാസീവ് അർഥമായ ‘കൊളുത്തപ്പെടുക/കത്തുക’ സന്ദർഭോചിതമായ മലയാള ആഗ്രഹവാക്യത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘തീ’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: ‘തീ’ എന്ന രൂപകം വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: ന്യായവിധി, ശുദ്ധീകരണം, പരിശുദ്ധാത്മാവ്, അല്ലെങ്കിൽ യേശുവിന്റെ ദൗത്യം സൃഷ്ടിക്കുന്ന ഭിന്നത എന്നിങ്ങനെ വ്യക്തമാക്കുക.
  rationale: വാക്യം തന്നെ രൂപകത്തിന്റെ കൃത്യമായ സൂചന നിർവചിക്കുന്നില്ല. അതിനാൽ അതിലെ ദൈവശാസ്ത്രപരമായ ബഹുസ്വരതയും സംഘർഷവും വിവർത്തനം തീർപ്പാക്കുന്നില്ല.
- issue: τί θέλω εἰ ἤδη ἀνήφθη എന്ന ദുഷ്കരമായ ഉപവാക്യത്തിന്റെ ഭാവം
  choice: ശക്തമായ ആഗ്രഹം പ്രകടിപ്പിക്കുന്ന ഉദ്‌ഗാരമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘അത് ഇതിനകം കൊളുത്തപ്പെട്ടിട്ടുണ്ടെങ്കിൽ ഞാൻ എന്താണ് ആഗ്രഹിക്കുന്നത്?’ എന്ന അക്ഷരാർഥചോദ്യം.
  rationale: ഗ്രീക്ക് ഘടന ദുഷ്കരവും ഒന്നിലധികം വിധത്തിൽ ഗ്രഹിക്കാവുന്നതുമാണ്. സന്ദർഭത്തിൽ ഉദ്‌ഗാരപരമായ ആഗ്രഹം സ്വാഭാവികമാണെങ്കിലും അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ യേശുവിന്റെ വാക്കുകളുടെ ശക്തിയും ഗൗരവവും നിലനിർത്തിയിരിക്കുന്നു. ‘തീ എറിയുക’ എന്ന ഉജ്ജ്വല രൂപകവും മൂലത്തിലെ ദുഷ്കരതയും സംരക്ഷിക്കുന്നു.
