id: LUK.12.24
reference: Luke 12:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: ml
  text: കാക്കകളെ ശ്രദ്ധാപൂർവം ചിന്തിക്കൂ:[a] അവ വിതയ്ക്കുന്നില്ല, കൊയ്യുന്നതുമില്ല; അവയ്ക്ക് സംഭരണമുറിയോ ധാന്യപ്പുരയോ ഇല്ല,[b] ദൈവം അവയെ പോറ്റുന്നു. പക്ഷികളേക്കാൾ എത്രയോ വിലപ്പെട്ടവരാണ് നിങ്ങൾ![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കാക്കകളെ സൂക്ഷിച്ചു നോക്കൂ” അല്ലെങ്കിൽ “കാക്കകളെക്കുറിച്ച് ശ്രദ്ധാപൂർവം ചിന്തിക്കൂ.”
    reason: lexical_alternative
  - marker: b
    text: “സംഭരണമുറി” എന്നത് ταμεῖον-നെയും “ധാന്യപ്പുര” എന്നത് ἀποθήκη-യെയും പരിഭാഷപ്പെടുത്തുന്നു. ഗ്രീക്കിൽ സംഭരണസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന രണ്ട് വ്യത്യസ്ത പദങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “പക്ഷികളേക്കാൾ നിങ്ങൾ എത്രയോ മേന്മയുള്ളവരാണ്!”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: ശ്രദ്ധിച്ചു ചിന്തിക്കൂ
  rationale: കേവലം നോക്കുക എന്നതിലുപരി ശ്രദ്ധാപൂർവമായ നിരീക്ഷണത്തിനും പരിചിന്തനത്തിനും ആഹ്വാനം ചെയ്യുന്ന ഭൂതകാല ആജ്ഞാരൂപത്തിന്റെ ബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κόρακας
  choice: കാക്കകളെ
  rationale: κόραξ കാക്കവർഗത്തിലെ പക്ഷിയെ സൂചിപ്പിക്കുന്നു; സാധാരണ ആധുനിക മലയാളത്തിൽ ഈ ദൃശ്യരൂപം വ്യക്തമായി നൽകുന്ന പദമാണ് ‘കാക്ക’.
- source_word: σπείρουσιν οὐδὲ θερίζουσιν
  choice: വിതയ്ക്കുന്നില്ല, കൊയ്യുന്നതുമില്ല
  rationale: രണ്ട് കാർഷിക ക്രിയകളുടെയും സംക്ഷിപ്തമായ സമാന്തരത നിലനിർത്തുന്നു.
- source_word: ταμεῖον
  choice: കലവറ
  rationale: വസ്തുക്കളോ വിളവോ സൂക്ഷിക്കുന്ന അകത്തെ സംഭരണമുറി എന്ന ആശയം നൽകുകയും ἀποθήκηയിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀποθήκη
  choice: ധാന്യപ്പുര
  rationale: വിളവ് സംഭരിക്കുന്ന കെട്ടിടത്തെ സൂചിപ്പിക്കുന്നു; ταμεῖον എന്ന ആദ്യ സംഭരണപദവുമായി ലയിപ്പിക്കാതെ ഗ്രീക്കിലെ രണ്ട് വ്യത്യസ്ത പദങ്ങൾ നിലനിർത്തുന്നു.
- source_word: τρέφει
  choice: പോറ്റുന്നു
  rationale: ഭക്ഷണം നൽകുന്നതും തുടർച്ചയായി പരിപാലിക്കുന്നതുമായ അർത്ഥം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πόσῳ μᾶλλον
  choice: എത്രയോ
  rationale: ചെറിയതിൽനിന്ന് വലിയതിലേക്കുള്ള താരതമ്യവാദത്തിന്റെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διαφέρετε
  choice: വിലപ്പെട്ടവരാണ്
  rationale: ഇവിടെ വെറും വ്യത്യാസമല്ല, പക്ഷികളെക്കാൾ കൂടുതൽ മൂല്യമുള്ളവരാകുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; താരതമ്യം ‘പക്ഷികളേക്കാൾ’ എന്നതിലൂടെ വ്യക്തമാണ്.
- source_word: τῶν πετεινῶν
  choice: പക്ഷികളേക്കാൾ
  rationale: മുമ്പ് കാക്കകളെ പ്രത്യേകമായി പറഞ്ഞശേഷം, പൊതുവായ പറവവർഗത്തെ സൂചിപ്പിക്കുന്ന വിശാലമായ താരതമ്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: താരതമ്യത്തിലെ ദൈവിക പരിപാലനം
  choice: എങ്കിലും ദൈവം അവയെ പോറ്റുന്നു
  alternative: ദൈവം അവയ്ക്ക് ആഹാരം നൽകുന്നു
  rationale: ജീവജാലങ്ങളോടുള്ള ദൈവത്തിന്റെ സജീവവും തുടർച്ചയായതുമായ കരുതലാണ് മനുഷ്യരുടെ മൂല്യത്തെക്കുറിച്ചുള്ള യേശുവിന്റെ വാദത്തിന് അടിസ്ഥാനം; വാക്യത്തിന് അതീതമായ സിദ്ധാന്തവികാസം ചേർക്കാതെ അത് നിലനിർത്തുന്നു.
- issue: διαφέρετε എന്നതിന്റെ താരതമ്യാർഥം
  choice: പക്ഷികളേക്കാൾ എത്രയോ വിലപ്പെട്ടവരാണ് നിങ്ങൾ!
  alternative: പക്ഷികളേക്കാൾ നിങ്ങൾ എത്രയോ മേന്മയുള്ളവരാണ്!
  rationale: ‘വിലപ്പെട്ടവർ’ എന്നത് സന്ദർഭത്തിലെ മൂല്യം വ്യക്തമാക്കുന്നു; എന്നാൽ മൂലഗ്രീക്കിലെ ക്രിയയ്ക്ക് ‘മേന്മ പുലർത്തുക/വ്യത്യസ്തരാകുക’ എന്ന വിശാലതയുമുള്ളതിനാൽ പര്യായം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘കലവറ/ധാന്യപ്പുര’ എന്ന കൂട്ടുപദങ്ങൾ മൂലത്തിലെ രണ്ട് സംഭരണപദങ്ങളുടെ വ്യത്യാസം സംരക്ഷിക്കുന്നു. അവസാനത്തെ ആശ്ചര്യചിഹ്നം ഗ്രീക്കിലെ ശക്തമായ ആലങ്കാരിക താരതമ്യം പ്രകടമാക്കുന്നു.
