revisions:
- from: തനിക്കുവേണ്ടി നിധി സ്വരൂപിക്കുകയും ദൈവത്തോടു സമ്പന്നനാകാതിരിക്കുകയും ചെയ്യുന്നവനും ഇങ്ങനെയാണ്[a].
  to: തനിക്കുവേണ്ടി നിധി സ്വരൂപിക്കുകയും ദൈവസന്നിധിയിൽ സമ്പന്നനല്ലാതിരിക്കുകയും ചെയ്യുന്നവൻ ഇങ്ങനെയാണ്[a].
  rationale: The revision removes the unintended additive suffix, uses a stative negative expression appropriate to the present participle πλουτῶν, and replaces an unnatural Malayalam collocation with a clear, standard idiom. The footnote preserves the source phrase’s broader relational nuance and avoids narrowing it to a doctrinal explanation.
