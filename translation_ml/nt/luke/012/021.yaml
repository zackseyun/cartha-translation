id: LUK.12.21
reference: Luke 12:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως ὁ θησαυρίζων ⸀ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: ml
  text: തനിക്കുവേണ്ടി നിധി സ്വരൂപിക്കുകയും ദൈവസന്നിധിയിൽ സമ്പന്നനല്ലാതിരിക്കുകയും ചെയ്യുന്നവൻ ഇങ്ങനെയാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തനിക്കുവേണ്ടി നിധി സ്വരൂപിക്കുകയും ദൈവത്തോടുള്ള ബന്ധത്തിൽ സമ്പന്നനല്ലാതിരിക്കുകയും ചെയ്യുന്നവൻ ഇങ്ങനെയാണ്.”
    reason: εἰς θεόν with πλουτῶν may be expressed relationally (‘rich toward/in relation to God’); the main text uses the natural Malayalam idiom ‘in God’s presence.’
lexical_decisions:
- source_word: οὕτως
  choice: ഇങ്ങനെയാണ്
  rationale: മുമ്പുള്ള ഉപമയിൽ വിവരിച്ച മനുഷ്യന്റെ അവസ്ഥയെ പൊതുവായ പ്രയോഗമായി ചൂണ്ടിക്കാണിക്കുന്ന οὕτως എന്ന പദത്തിന്റെ സംക്ഷിപ്തമായ പ്രയോഗശക്തി നിലനിർത്തുന്നു.
- source_word: ὁ θησαυρίζων
  choice: നിധി സ്വരൂപിക്കുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തം ഒരു പ്രവൃത്തിയാൽ സവിശേഷനാകുന്ന വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘നിധി സ്വരൂപിക്കുക’ എന്നത് സമ്പത്ത് തനിക്കായി കൂട്ടിവെക്കുന്ന ആശയവും θησαυρίζω എന്ന പദത്തിന്റെ നിധിയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἑαυτῷ
  choice: തനിക്കുവേണ്ടി
  rationale: സ്വന്തം പ്രയോജനത്തിലേക്കുള്ള ദിശ വ്യക്തമാക്കുന്ന പ്രത്യാത്മക ദത്തിവിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണിത്.
- source_word: καὶ μὴ
  choice: …ുകയും …ആകാതിരിക്കുകയും
  rationale: രണ്ട് കൃദന്തരൂപങ്ങളെയും സമാന്തരമായി ബന്ധിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു; അനാവശ്യമായി ശക്തമായ വിരോധാർഥം ചേർക്കുന്നില്ല.
- source_word: εἰς θεὸν
  choice: ദൈവത്തോട്
  rationale: ദൈവത്തിലേക്കുള്ള ബന്ധപരമായ ദിശാബോധം നിലനിർത്തുന്നു; അതിനെ ദൈവത്തിന്റെ വിലയിരുത്തലോ ദൈവത്തിനുവേണ്ടിയുള്ള സമ്പത്തോ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: πλουτῶν
  choice: സമ്പന്നനാകുക
  rationale: ‘സമ്പന്നനായിരിക്കുക/ആകുക’ എന്ന ആശയം ലളിതമായി നൽകുകയും ഭൗതിക നിധി സ്വരൂപിക്കുന്നതുമായുള്ള വിരോധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ധാർമ്മിക പ്രസ്താവനയിലെ പ്രതിനിധിപരമായ പുല്ലിംഗ ഏകവചനം
  choice: ചെയ്യുന്നവൻ
  alternative: ആ മനുഷ്യൻ
  rationale: ഗ്രീക്കിലെ ആർട്ടിക്കിളോടുകൂടിയ പുല്ലിംഗ ഏകവചന കൃദന്തം ഇവിടെ പൊതുവായ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ചെയ്യുന്നവൻ’ സ്വാഭാവികമായ പ്രതിനിധിപരമായ ഏകവചനമാണ്; പ്രയോഗം പുരുഷന്മാർക്ക് മാത്രമാണെന്ന ധ്വനി നൽകുന്നില്ല.
- issue: ‘ദൈവത്തോടു സമ്പന്നൻ’ എന്നതിന്റെ അർഥം
  choice: ബന്ധപരമായ പ്രയോഗം വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തുക
  alternative: ദൈവത്തിന് പ്രധാനമായ കാര്യങ്ങളിൽ സമ്പന്നൻ / ദൈവത്തിന്റെ മുമ്പാകെ സമ്പന്നൻ
  rationale: വാക്യം ഈ പ്രയോഗത്തെ വിശദമായി നിർവചിക്കുന്നില്ല. അതിനാൽ അതിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും ദിശാബോധവും സംരക്ഷിച്ച്, ഒരു പ്രത്യേക doctrinal വ്യാഖ്യാനം ചേർക്കാതെ പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ദൈവത്തോടു സമ്പന്നൻ’ എന്ന അപൂർവമായെങ്കിലും ഗ്രഹിക്കാവുന്ന പ്രയോഗം മൂലത്തിലെ ബന്ധപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു; കൂടുതൽ സ്വാഭാവികമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
