  to: കാരണം, നിന്റെ എതിർകക്ഷിയോടൊപ്പം ഒരു അധികാരിയുടെ അടുക്കലേക്കു പോകുമ്പോൾ, വഴിയിൽത്തന്നെ അയാളിൽനിന്നു വിടുതൽ നേടാൻ ശ്രമിക്കുക.[a] അല്ലാത്തപക്ഷം അയാൾ നിന്നെ ന്യായാധിപന്റെ അടുക്കലേക്കു വലിച്ചുകൊണ്ടുപോകും; ന്യായാധിപൻ നിന്നെ ഉദ്യോഗസ്ഥന്റെ കൈയിൽ ഏൽപ്പിക്കും; ഉദ്യോഗസ്ഥൻ നിന്നെ തടവറയിലേക്കു തള്ളിയിടും.
