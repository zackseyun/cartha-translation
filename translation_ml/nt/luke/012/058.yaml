id: LUK.12.58
reference: Luke 12:58
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: ml
  text: കാരണം, നിന്റെ എതിർകക്ഷിയോടൊപ്പം ഒരു അധികാരിയുടെ അടുക്കലേക്കു പോകുമ്പോൾ, വഴിയിൽത്തന്നെ അയാളിൽനിന്നു വിടുതൽ നേടാൻ ശ്രമിക്കുക.[a] അല്ലാത്തപക്ഷം അയാൾ നിന്നെ ന്യായാധിപന്റെ അടുക്കലേക്കു വലിച്ചുകൊണ്ടുപോകും; ന്യായാധിപൻ നിന്നെ ഉദ്യോഗസ്ഥന്റെ കൈയിൽ ഏൽപ്പിക്കും; ഉദ്യോഗസ്ഥൻ നിന്നെ തടവറയിലേക്കു തള്ളിയിടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അയാളുമായി ഒത്തുതീർപ്പിലെത്താൻ.” ഗ്രീക്കിലെ പദപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “അയാളിൽനിന്നു വിടുതൽ നേടാൻ” എന്നാണ്; എന്നാൽ ന്യായാധിപന്റെ മുമ്പിലെത്തുംമുമ്പ് കേസ് പരിഹരിക്കുന്നതിനെ സന്ദർഭം സൂചിപ്പിക്കുന്നുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιδίκου
  choice: എതിർകക്ഷി
  rationale: നിയമവ്യവഹാരത്തിലെ മറുകക്ഷിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘കുറ്റാരോപകൻ’ എന്നതിനെക്കാൾ വിശാലമായ മൂലപദത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ നിയമസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἄρχοντα
  choice: അധികാരി
  rationale: ഇവിടെ പൊതുവായ ‘ഭരണാധികാരി’ എന്ന അർഥത്തോടൊപ്പം നിയമ-ഭരണപരമായ അധികാരസ്ഥാനം ഉദ്ദേശിക്കപ്പെടുന്നു. തുടർന്നുവരുന്ന ‘ന്യായാധിപൻ’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും ഇത് നിലനിർത്തുന്നു.
- source_word: δὸς ἐργασίαν
  choice: ഉത്സാഹിച്ചു ശ്രമിക്കുക
  rationale: കാര്യമായി പരിശ്രമിക്കണമെന്ന ഈ പ്രയോഗത്തിന്റെ ആഹ്വാനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ശക്തമായി അറിയിക്കുന്നു.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: അയാളിൽനിന്നു വിടുതൽ നേടാൻ
  rationale: ഗ്രീക്കിലെ ‘അയാളിൽനിന്നു മോചിതനാകുക’ എന്ന ഘടനയോടു ചേർന്നുനിൽക്കുന്നു. കേസിൽ ഒത്തുതീർപ്പിലെത്തുക എന്ന സന്ദർഭാർഥം സാധ്യതയുള്ളതാണെങ്കിലും അതിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധിതമാക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: κατασύρῃ
  choice: വലിച്ചുകൊണ്ടുപോകുകയും
  rationale: ബലപ്രയോഗത്തോടെയുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ശക്തിയും ദൃശ്യതയും നിലനിർത്തുന്നു.
- source_word: κριτήν / κριτής
  choice: ന്യായാധിപൻ
  rationale: നിയമസന്ദർഭത്തിലെ സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: παραδώσει
  choice: കൈയിൽ ഏൽപ്പിക്കുകയും
  rationale: ന്യായവിധി നടപ്പാക്കുന്ന ഉദ്യോഗസ്ഥനിലേക്കുള്ള ഔദ്യോഗിക കൈമാറ്റം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: πράκτορι / πράκτωρ
  choice: ഉദ്യോഗസ്ഥൻ
  rationale: വിധി നടപ്പാക്കുകയോ പണം ഈടാക്കുകയോ കസ്റ്റഡിയിൽ എടുക്കുകയോ ചെയ്യുന്ന ഉദ്യോഗസ്ഥനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ബെയ്ലിഫ്’ പോലുള്ള പ്രത്യേക നിയമസംവിധാനപദം ഒഴിവാക്കി മൂലത്തിലെ പരിധി നിലനിർത്തുന്നു.
- source_word: βαλεῖ εἰς φυλακήν
  choice: തടവറയിലേക്കു തള്ളിയിടുകയും
  rationale: βάλλω എന്ന ക്രിയയുടെ ശക്തി ‘തടവിലാക്കുക’ എന്നതിനെക്കാൾ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ὡς γὰρ
  choice: …പോകുമ്പോൾ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു; ഒറ്റവാക്യം മാത്രമായി വായിക്കുമ്പോൾ അസ്വാഭാവികമായ ഒരു ആരംഭബന്ധകം ഒഴിവാക്കുന്നു.
- source_word: ἐν τῇ ὁδῷ
  choice: വഴിയിൽവെച്ചുതന്നെ
  rationale: യാത്രാമധ്യേ എന്ന അക്ഷരാർഥവും ഔപചാരിക വിധിക്കുമുമ്പ് പ്രവർത്തിക്കേണ്ട അടിയന്തരതയും ഒരുമിച്ച് അറിയിക്കുന്നു.
theological_decisions:
- issue: നിയമോപമയുടെ വ്യാഖ്യാനപരമായ പ്രത്യേകീകരണം
  choice: വാക്യത്തിലെ നിയമരംഗം അതേപടി നിലനിർത്തി; അതിന്റെ ആത്മീയ പ്രയോഗം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിയില്ല.
  alternative: ദൈവവുമായി അനുരഞ്ജനപ്പെടാനും അന്തിമവിധിക്കുമുമ്പ് പ്രവർത്തിക്കാനുമുള്ള നേരിട്ടുള്ള ആഹ്വാനമായി വിവർത്തനം ചെയ്യുക.
  rationale: ഉടൻ കാണുന്ന ഭാഷ ഒരു നിയമവ്യവഹാരരംഗമാണ്. വിശാലസന്ദർഭത്തിൽ അന്ത്യവിധിയുടെ അടിയന്തരത സൂചിപ്പിക്കാമെങ്കിലും, ഈ വാക്യം എതിർകക്ഷി, ന്യായാധിപൻ, തടവറ എന്നിവയ്ക്ക് പ്രത്യേക ദൈവശാസ്ത്രപരമായ പ്രതിരൂപങ്ങൾ നേരിട്ട് നൽകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി ഉപയോഗിച്ചു. ‘എതിർകക്ഷി,’ ‘അധികാരി,’ ‘ന്യായാധിപൻ,’ ‘ഉദ്യോഗസ്ഥൻ’ എന്നീ പദങ്ങൾ നിയമരംഗം വ്യക്തമാക്കുമ്പോഴും ഏതെങ്കിലും പ്രത്യേക ആധുനിക നിയമസംവിധാനത്തിന്റെ സാങ്കേതിക പദാവലി അടിച്ചേൽപ്പിക്കുന്നില്ല. മൂലത്തിലെ നീണ്ട മുന്നറിയിപ്പ്-ശൃംഖല മലയാളത്തിൽ സുതാര്യമായി വായിക്കാനായി ആവർത്തനഘടന നിലനിർത്തി.
