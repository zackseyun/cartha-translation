source:
  edition: SBLGNT
  text: τὸ γὰρ ἅγιον πνεῦμα διδάξει ὑμᾶς ἐν αὐτῇ τῇ ὥρᾳ ἃ δεῖ εἰπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: ml
  text: കാരണം, എന്തു പറയണമെന്ന് ആ സമയത്തുതന്നെ പരിശുദ്ധാത്മാവ് നിങ്ങളെ പഠിപ്പിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആ മണിക്കൂറിൽത്തന്നെ” അല്ലെങ്കിൽ “ആ മണിക്കൂറിൽ.” ഗ്രീക്ക് പ്രയോഗം ആവശ്യം നേരിടുന്ന കൃത്യസമയത്തിന് ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ആശ്വാസവാഗ്ദാനത്തിന് വിശദീകരണവും അടിസ്ഥാനവും നൽകുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ ἅγιον πνεῦμα
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ദൈവിക ആത്മാവിനെ സൂചിപ്പിക്കുന്ന ഈ നിർദിഷ്ട പദസമുച്ചയത്തിന്റെ പ്രചാരത്തിലുള്ള, ആധുനിക മലയാളരൂപം.
- source_word: διδάξει
  choice: പഠിപ്പിക്കും
  rationale: διδάσκω എന്ന ക്രിയയുടെ ഭാവികാലസൂചനയും ആവശ്യസമയത്ത് ലഭിക്കുന്ന ഉപദേശമെന്ന ആശയവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന കർമരൂപം മലയാളത്തിൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: ആ സമയത്തുതന്നെ
  rationale: αὐτῇ നൽകുന്ന ഊന്നലും ആവശ്യത്തിന്റെ കൃത്യസമയത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ἃ
  choice: എന്താണ്
  rationale: നപുംസകലിംഗ ബഹുവചന ബന്ധസർവനാമത്തിന്റെ ഉള്ളടക്കാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: δεῖ
  choice: പറയേണ്ടത്
  rationale: ആ സാഹചര്യത്തിൽ പറയേണ്ടതായ ആവശ്യമോ ബാധ്യതയോ മലയാളത്തിലെ ‘-േണ്ടത്’ രൂപം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰπεῖν
  choice: പറയുക
  rationale: പ്രതിരോധമായി ഉച്ചരിക്കേണ്ട വാക്കുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പറയുക’ ഏറ്റവും സ്വാഭാവികമായ തുല്യപദമാണ്.
theological_decisions:
- issue: ‘പരിശുദ്ധാത്മാവ്’ എന്ന പരാമർശത്തിന്റെ സ്വഭാവം
  choice: ശിഷ്യർ എന്തു പറയണമെന്ന് സജീവമായി പഠിപ്പിക്കുന്ന ദൈവിക കർത്താവ്
  alternative: വ്യക്തിത്വമില്ലാത്ത ദൈവിക സ്വാധീനമോ പ്രചോദനമോ
  rationale: ‘പഠിപ്പിക്കും’ എന്ന ഭാവികാല സകർമകക്രിയയുടെ കർത്താവായാണ് പരിശുദ്ധാത്മാവിനെ വാക്യം അവതരിപ്പിക്കുന്നത്; പിന്നീടുള്ള സിദ്ധാന്തരൂപീകരണങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ പാഠത്തിലെ വ്യക്തികർത്തൃത്വം ഇത് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ആ സമയത്തുതന്നെ’ എന്നത് മൂലത്തിലെ സമയസൂചനയുടെ ഊന്നൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; അടിക്കുറിപ്പിൽ ‘നാഴിക’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ വഴിയും സൂചിപ്പിച്ചിട്ടുണ്ട്.
