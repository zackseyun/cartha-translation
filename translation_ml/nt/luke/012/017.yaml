id: LUK.12.17
reference: Luke 12:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ διελογίζετο ἐν ⸀ἑαυτῷ λέγων· Τί ποιήσω, ὅτι οὐκ ἔχω ποῦ συνάξω τοὺς καρπούς μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: ml
  text: 'അവൻ തന്നിൽത്തന്നെ ഇങ്ങനെ ആലോചിച്ചുകൊണ്ടിരുന്നു: “ഞാൻ എന്തു ചെയ്യും?[a] എന്റെ വിളവ്[b] ശേഖരിക്കാൻ എനിക്ക് ഒരിടവുമില്ലല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ എന്തു ചെയ്യണം?”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എന്റെ കാർഷിക ഉൽപ്പന്നങ്ങൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζετο
  choice: ആലോചിച്ചുകൊണ്ട്
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം തുടരുന്ന ആന്തരിക ആലോചനയെ സൂചിപ്പിക്കുന്നു. ‘ആലോചിച്ചുകൊണ്ട്’ എന്നത് വെറും ചിന്തയേക്കാൾ മനസ്സിലെ കൂടിയാലോചനയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ἑαυτῷ
  choice: ഉള്ളിൽ
  rationale: ഇത് മറ്റൊരാളോടു പറഞ്ഞതല്ല, അവന്റെ മനസ്സിൽ നടന്ന ആലോചനയാണെന്ന് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: തുടർന്നുവരുന്ന വാക്കുകൾ അവന്റെ ആന്തരിക സംഭാഷണത്തിന്റെ ഉള്ളടക്കമാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Τί ποιήσω
  choice: ഞാൻ എന്തു ചെയ്യും?
  rationale: ആലോചനാത്മകമായ ചോദ്യത്തിലുള്ള aorist subjunctive-ന്റെ തുറന്ന ഭാവി/തീരുമാന ഭാവം നിലനിർത്തുന്ന സാധാരണ മലയാളപ്രയോഗമാണിത്.
- source_word: ὅτι
  choice: …ഇടമില്ലല്ലോ
  rationale: ഗ്രീക്കിൽ ὅτι ചോദ്യത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ല്ലോ’ രൂപം ആ കാരണം മുൻവാക്യത്തോട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; പ്രത്യേകമായ ഒരു കാരണസന്ധി ചേർത്ത് വാക്യം കൃത്രിമമാക്കുന്നില്ല.
- source_word: ποῦ
  choice: ഇടമില്ല
  rationale: οὐκ ἔχω ποῦ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളസമാനത ‘എനിക്ക് ഇടമില്ല’ എന്നാണ്.
- source_word: συνάξω
  choice: ശേഖരിക്കാൻ
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ഒന്നിച്ചുകൂട്ടുക/ശേഖരിക്കുക എന്നത് കാത്തുസൂക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ സംഭരണം ഉൾക്കൊള്ളാമെങ്കിലും അത് വാചകത്തിൽ അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: τοὺς καρπούς μου
  choice: എന്റെ വിളവുകൾ
  rationale: കാർഷികസന്ദർഭത്തിൽ καρποί മരപ്പഴങ്ങളെ മാത്രം അല്ല, നിലത്തിൽനിന്നുള്ള ഉൽപ്പാദനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വിളവുകൾ’ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ആന്തരിക ആലോചനയും കാരണബന്ധവും സ്വാഭാവികമായി പ്രകടമാക്കുമ്പോൾ ഗ്രീക്കിലെ തുറന്ന അർഥപരിധി നിലനിർത്തിയിട്ടുണ്ട്.
