id: LUK.12.25
reference: Luke 12:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: ml
  text: നിങ്ങളിൽ ആർക്കാണ് ഉത്കണ്ഠപ്പെടുന്നതിലൂടെ തന്റെ ജീവിതദൈർഘ്യത്തിലേക്ക് ഒരു മുഴം കൂട്ടിച്ചേർക്കാൻ കഴിയുക?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ ഉയരത്തിലേക്ക് ഒരു മുഴം കൂട്ടിച്ചേർക്കാൻ.” ഗ്രീക്ക് പദത്തിന് പ്രായം/ജീവിതദൈർഘ്യം എന്നും ശരീരവളർച്ച/ഉയരം എന്നും അർഥമാകാം.
    reason: ἡλικίαയുടെ സന്ദർഭാനുസൃതമായ ‘ജീവിതദൈർഘ്യം’ എന്ന മുഖ്യാർഥത്തോടൊപ്പം അതിന്റെ സാധുവായ ‘ഉയരം’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: μεριμνῶν
  choice: ഉത്കണ്ഠപ്പെടുന്നതിലൂടെ
  rationale: ആശങ്കയോടെ ചിന്തിക്കുകയും വ്യാകുലപ്പെടുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ അർഥവും മാർഗസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡλικίαν
  choice: ആയുസ്സ്
  rationale: ഈ പദത്തിന് ‘പ്രായം/ആയുസ്സ്’ എന്നും ‘ശരീരവളർച്ച/ഉയരം’ എന്നും അർഥമാകാം. ‘ഒരു മുഴം കൂട്ടുക’ എന്ന അളവുപ്രയോഗം ജീവിതദൈർഘ്യത്തെ രൂപകമായി സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ എടുത്തിരിക്കുന്നു; യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: πῆχυν
  choice: ഒരു മുഴം
  rationale: മുട്ടുകൈ മുതൽ നടുവിരലിന്റെ അറ്റംവരെയുള്ള പുരാതന നീളയളവായ ‘ക്യൂബിറ്റ്’ എന്നതിന്റെ പരമ്പരാഗതവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളപദം.
- source_word: δύναται … προσθεῖναι
  choice: കൂട്ടാൻ കഴിയുക
  rationale: കഴിവിനെക്കുറിച്ചുള്ള ഗ്രീക്ക് ചോദ്യരൂപവും ‘കൂട്ടിച്ചേർക്കുക’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἡλικία എന്ന പദത്തിന്റെ ദ്വയാർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ആയുസ്സ്’
  alternative: ‘ഉയരം’ അല്ലെങ്കിൽ ‘ശരീരവളർച്ച’
  rationale: സന്ദർഭം ജീവനെക്കുറിച്ചുള്ള ഉത്കണ്ഠയെ ചർച്ച ചെയ്യുന്നതിനാൽ ‘ആയുസ്സ്’ സ്വാഭാവികമാണ്; എന്നാൽ ഗ്രീക്ക് പദത്തിനുള്ള ശരീരവളർച്ച/ഉയരം എന്ന അർഥം നിശ്ശബ്ദമായി ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചോദ്യരൂപം. ‘ഉത്കണ്ഠപ്പെടുക’, ‘ആയുസ്സ്’, ‘മുഴം’ എന്നീ പദങ്ങൾ കൃത്യതയും സാധാരണ വായനാസൗകര്യവും തമ്മിൽ സന്തുലിതമാക്കുന്നു.
