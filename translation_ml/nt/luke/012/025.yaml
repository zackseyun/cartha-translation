    rationale: Malayalam normally adds something ‘to/into’ a duration as ‘ജീവിതദൈർഘ്യത്തിലേക്ക് ... കൂട്ടിച്ചേർക്കുക,’ rather than ‘ആയുസ്സിനോട് ... കൂട്ടുക.’ This is a stylistic correction only and does not alter meaning.
