  revision_rationale: അവസാന ഉപവാക്യത്തിലെ ആവശ്യത്തിന്റെ ദിശ (‘അവനിൽനിന്ന്’) വ്യക്തമാക്കി, ആദ്യ ഉപവാക്യത്തിലെ ശിക്ഷാഭാഷയെ കൂടുതൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിച്ചു. കർത്താവിനെ ‘ദൈവം’ എന്നു വ്യക്തമാക്കാതെയും, അറിവില്ലായ്മയുടെ ധാർമ്മിക കാരണം വ്യാഖ്യാനിക്കാതെയും, മൂലപാഠത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിച്ചിരിക്കുന്നു.
