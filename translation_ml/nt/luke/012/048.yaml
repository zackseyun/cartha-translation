  revised_text: 'എന്നാൽ അറിയാതിരുന്നവൻ, അടിയർഹമായ കാര്യങ്ങൾ ചെയ്തിട്ടും, കുറച്ച് അടികൾ കിട്ടും. വളരെ ലഭിച്ച ഏവനിൽനിന്നും വളരെ ആവശ്യപ്പെടും; ആരുടെ പക്കൽ അവർ വളരെ ഏൽപ്പിച്ചുവോ, അവനിൽനിന്ന് അതിലും അധികം ചോദിക്കും.[a]


