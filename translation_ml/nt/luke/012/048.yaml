  source_fidelity: ആദ്യ ഉപവാക്യത്തിലെ δαρήσεται ὀλίγας എന്നതിന് ‘കുറച്ച് അടിയേ കൊള്ളുകയുള്ളൂ’ എന്നത് അർഥത്തിൽ അടുത്തതാണെങ്കിലും പ്രയോഗം കൃത്യമല്ലാത്തതും അല്പം അസ്വാഭാവികവുമാണ്. ‘കുറച്ച് അടികൾ കിട്ടും’ ഗ്രീക്കിലെ അടിയേറ്റുള്ള ശിക്ഷയുടെ ദൃശ്യവും അളവിലെ വ്യത്യാസവും സ്വാഭാവികമായി നൽകുന്നു. അവസാന ഉപവാക്യത്തിലെ αἰτήσουσιν αὐτόν സന്ദർഭത്തിൽ അവനിൽനിന്നുള്ള ആവശ്യം/കണക്കുചോദിക്കൽ ആണ്; ‘അവനോട് ചോദിക്കും’ എന്നത് അവനോടു ചോദ്യം ചോദിക്കുമെന്ന അർഥത്തിലേക്കും വഴുതാം.
  naturalness: ‘അടിയർഹമായ കാര്യങ്ങൾ’ എന്ന പ്രയോഗം ‘അടികൊള്ളാൻ അർഹമായതു’ എന്നതിനെക്കാൾ വ്യക്തവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്. ‘അവനിൽനിന്ന് ... ചോദിക്കും’ എന്നത് ഉത്തരവാദിത്വം ആവശ്യപ്പെടുന്ന സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നു.
  terminology: ‘അടി,’ ‘ഏൽപ്പിക്കുക,’ ‘ആവശ്യപ്പെടുക,’ ‘ചോദിക്കുക’ എന്നിവ മൂലപാഠത്തിലെ മൂർത്തമായ ശിക്ഷാഭാഷയും ζητέω/αἰτέω ക്രിയകളുടെ സൂക്ഷ്മവ്യത്യാസവും നിലനിർത്തുന്നു. അനിർദിഷ്ട ബഹുവചന കർത്താവായ ‘അവർ’ മാറ്റിയിട്ടില്ല.
