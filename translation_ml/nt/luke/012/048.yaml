id: LUK.12.48
reference: Luke 12:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: ml
  text: 'എന്നാൽ അറിയാതിരുന്നവൻ, അടിയർഹമായ കാര്യങ്ങൾ ചെയ്തിട്ടും, കുറച്ച് അടികൾ കിട്ടും. വളരെ ലഭിച്ച ഏവനിൽനിന്നും വളരെ ആവശ്യപ്പെടും; ആരുടെ പക്കൽ അവർ വളരെ ഏൽപ്പിച്ചുവോ, അവനിൽനിന്ന് അതിലും അധികം ചോദിക്കും.[a]


    [a] അല്ലെങ്കിൽ: “അവനിൽനിന്ന് അതിലും അധികം ആവശ്യപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവനിൽനിന്ന് അതിലും അധികം ആവശ്യപ്പെടും.”'
    reason: αἰτέω എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ‘ചോദിക്കുക’ എന്നും കൂടുതൽ ശക്തമായി ‘ആവശ്യപ്പെടുക’ എന്നും അർഥമുണ്ടാകാം.
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: അറിയാതിരുന്നവൻ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന നിഷേധാർഥക കൃതന്തത്തിന്റെ അർഥം നേരിട്ട് നിലനിർത്തുന്നു; അറിവില്ലായ്മയുടെ കുറ്റസ്വഭാവം വിവർത്തനം തന്നെ നിർണയിക്കുന്നില്ല.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: അടികൊള്ളാൻ അർഹമായതു ചെയ്തിട്ടും
  rationale: പ്രവൃത്തികൾ ശിക്ഷാർഹമായിരുന്നു എന്ന ബന്ധവും πληγή എന്ന പദത്തിലെ മൂർത്തമായ ‘അടി’ എന്ന ദൃശ്യവും സംരക്ഷിക്കുന്നു.
- source_word: δαρήσεται ὀλίγας
  choice: കുറച്ച് അടിയേ കൊള്ളുകയുള്ളൂ
  rationale: δέρω എന്ന ക്രിയയിലെ അടിക്കൽ എന്ന വ്യക്തമായ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി തുറന്നുപറയുകയും ശിക്ഷയുടെ അളവിലുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: വളരെ ലഭിച്ച ഏവനിൽനിന്നും
  rationale: പൊതുവായ ഉത്തരവാദിത്വതത്ത്വം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: വളരെ ആവശ്യപ്പെടും
  rationale: ζητέω ഇവിടെ കണക്കു ചോദിക്കുകയോ ഉത്തരവാദിത്വം ആവശ്യപ്പെടുകയോ ചെയ്യുന്ന അർഥത്തിലാണ്; ‘ആവശ്യപ്പെടും’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: ᾧ παρέθεντο πολύ
  choice: ആരുടെ പക്കൽ അവർ വളരെ ഏൽപ്പിച്ചുവോ
  rationale: παρατίθημι എന്നതിലെ വിശ്വാസത്തോടെ ചുമതല ഏൽപ്പിക്കൽ എന്ന ആശയം നൽകുന്നു; ഗ്രീക്കിലെ വ്യക്തമാക്കാത്ത മൂന്നാംപുരുഷ ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നു നിലനിർത്തുന്നു.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: അവനോട് അതിലും അധികം ചോദിക്കും
  rationale: ζητέω, αἰτέω എന്നീ രണ്ട് വ്യത്യസ്ത ക്രിയകൾ തമ്മിലുള്ള വ്യത്യാസം ‘ആവശ്യപ്പെടും/ചോദിക്കും’ എന്നായി നിലനിർത്തുന്നു; περισσότερον എന്ന താരതമ്യത്തിന് ‘അതിലും അധികം’ യോജിക്കുന്നു.
theological_decisions:
- issue: ശിക്ഷയുടെ ദൃശ്യഭാഷ
  choice: ‘അടി’ എന്ന മൂർത്തമായ ശിക്ഷാചിത്രം നിലനിർത്തി
  alternative: പൊതുവായ ‘ശിക്ഷ’ എന്ന പദമോ പ്രത്യേക ഉപകരണം സൂചിപ്പിക്കുന്ന ‘ചാട്ടവാറടി’യോ ഉപയോഗിക്കുക
  rationale: വാക്യം അറിവിനും ഉത്തരവാദിത്വത്തിനും അനുസരിച്ചുള്ള വ്യത്യസ്ത അളവിലെ ശിക്ഷയെ ഉപമാപരമായി അവതരിപ്പിക്കുന്നു; അതിനെ മയപ്പെടുത്തുകയോ നിർദിഷ്ടമായ ശിക്ഷാരീതിയായി ശക്തിപ്പെടുത്തുകയോ ചെയ്യരുത്.
- issue: അവസാന ഉപവാക്യത്തിലെ കർത്താവ്
  choice: ഗ്രീക്കിലെ അനിർദിഷ്ട ബഹുവചനത്തെ ‘അവർ’ എന്നു നിലനിർത്തി
  alternative: കർത്താവിനെ ‘ദൈവം’ എന്നോ ‘മനുഷ്യർ’ എന്നോ വ്യക്തമാക്കുക
  rationale: മൂലപാഠം കർത്താവിനെ വ്യക്തമാക്കുന്നില്ല; ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ വിവർത്തനത്തിലൂടെ ചേർക്കാതിരിക്കാൻ ഈ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
- issue: അറിവില്ലായ്മയും ഉത്തരവാദിത്വവും
  choice: ‘അറിയാതിരുന്നവൻ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘കുറ്റമില്ലാതെ അറിയാതിരുന്നവൻ’ അല്ലെങ്കിൽ ‘അറിയേണ്ടിയിരുന്നിട്ടും അറിയാതിരുന്നവൻ’ എന്നു വ്യാഖ്യാനിക്കുക
  rationale: വാക്യം അറിവില്ലായ്മയെ കുറഞ്ഞ ശിക്ഷയുമായി ബന്ധിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ ധാർമ്മിക കാരണം വിശദീകരിക്കുന്നില്ല; ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്ന നിലയിൽ വയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അടികൊള്ളാൻ അർഹമായത്’, ‘ഏൽപ്പിച്ചു’, ‘ആവശ്യപ്പെടും’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ ഉത്തരവാദിത്വഭാവം സംരക്ഷിക്കുന്നതുമാണ്.
