id: LUK.12.31
reference: Luke 12:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πλὴν ζητεῖτε τὴν βασιλείαν ⸀αὐτοῦ, καὶ ⸀ταῦτα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: ml
  text: എന്നാൽ അവിടുത്തെ രാജ്യം[b][a] അന്വേഷിക്കുവിൻ; ഇവ നിങ്ങൾക്കു കൂട്ടിച്ചേർക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവത്തിന്റെ രാജ്യം’; ഗ്രീക്കിൽ ‘അവിടുത്തെ രാജ്യം’ എന്നാണ്; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അവിടുത്തെ രാജ്യം’ എന്നതിനുപകരം ‘ദൈവത്തിന്റെ രാജ്യം’ എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: എന്നാൽ
  rationale: മുമ്പുള്ള ഭൗതികാവശ്യങ്ങളെക്കുറിച്ചുള്ള ഉത്കണ്ഠാപൂർവമായ അന്വേഷണമൊഴിവാക്കണമെന്ന നിർദേശത്തോട് വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: ζητεῖτε
  choice: അന്വേഷിക്കുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ ദിശാബോധം സന്ദർഭത്തിൽ നിന്നു വ്യക്തമാകുന്നു. ‘അന്വേഷിച്ചുകൊണ്ടിരിക്കുവിൻ’ എന്നത് കൂടുതൽ വ്യക്തമായെങ്കിലും അല്പം വ്യാഖ്യാനാത്മകമാണ്.
- source_word: βασιλείαν
  choice: രാജ്യം
  rationale: ദൈവത്തിന്റെ ഭരണത്തെയും രാജ്യത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന, പരിചിതവും വിശാലവുമായ പദമാണ്; ‘ഭരണം’ എന്നത് അർത്ഥപരിധി ചുരുക്കാം.
- source_word: αὐτοῦ
  choice: അവിടുത്തെ
  rationale: സന്ദർഭത്തിൽ ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്ന സർവനാമരൂപം നിലനിർത്തുന്നു; ‘ദൈവത്തിന്റെ’ എന്നു വ്യക്തമാക്കുന്നത് മൂലത്തിലെ സർവനാമത്തെ വികസിപ്പിക്കുമായിരുന്നു.
- source_word: ταῦτα
  choice: ഇവ
  rationale: ചുറ്റുമുള്ള സന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന ആവശ്യങ്ങളെ സൂചിപ്പിക്കുന്നു. മത്തായിയിലെ സമാന്തരവാക്യത്തെ അനുകരിച്ച് ‘ഇവയെല്ലാം’ എന്നു ചേർക്കുന്നില്ല.
- source_word: προστεθήσεται
  choice: കൂട്ടിച്ചേർക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും ‘ചേർക്കുക’ എന്ന രൂപകവും സൂക്ഷിക്കുന്നു; ‘നൽകപ്പെടും’ എന്നത് സന്ദർഭാർത്ഥം വ്യക്തമാക്കുമെങ്കിലും കൂടുതൽ പരാവർത്തനമാണ്.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ദാതൃകാർഥമുള്ള ഗ്രീക്ക് രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: αὐτοῦ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: സർവനാമം സന്ദർഭത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി ‘അവിടുത്തെ രാജ്യം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവത്തിന്റെ രാജ്യം’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്താം.
  rationale: അടുത്ത സന്ദർഭത്തിൽ പിതാവിനെയും ദൈവത്തിന്റെ കരുതലിനെയും കുറിച്ചുള്ള പരാമർശങ്ങൾ ഉള്ളതിനാൽ സൂചിതവ്യക്തി വ്യക്തമാണ്. എങ്കിലും മൂലത്തിലെ സർവനാമരൂപം നിലനിർത്തുന്നത് യഥാർത്ഥ പാഠത്തോട് കൂടുതൽ ചേർന്നുനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അവിടുത്തെ’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസർവനാമമായി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ [b][a] എന്ന അടിക്കുറിപ്പുക്രമം മുഖ്യവാചകത്തിൽ അതേപടി നിലനിർത്തി.
