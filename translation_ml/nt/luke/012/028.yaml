id: LUK.12.28
reference: Luke 12:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: ml
  text: എന്നാൽ, ഇന്ന് വയലിലുള്ളതും നാളെ അടുപ്പിലേക്കു[b] എറിയപ്പെടുന്നതുമായ പുല്ലിനെ[a] ദൈവം ഇങ്ങനെ അണിയിക്കുന്നെങ്കിൽ, അല്പവിശ്വാസികളേ, നിങ്ങളെ എത്രയധികം അണിയിക്കും!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുല്ല്’ എന്നതിന് ‘ചെറുസസ്യങ്ങൾ’ അല്ലെങ്കിൽ ‘സസ്യവളർച്ച’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ പറയുന്ന ‘അടുപ്പ്’ അപ്പം ചുടാനുള്ള അടുപ്പാണ്; ഉണങ്ങിയ വയൽപ്പുല്ല് അതിൽ ഇന്ധനമായി ഉപയോഗിക്കാമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: പുല്ല്
  rationale: χόρτος എന്നത് ഇവിടെ വയലിലെ പുല്ലിനെയോ ചെറുസസ്യങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ചുരുങ്ങിയ ആയുസ്സും ഇന്ധനമായി ഉപയോഗിക്കപ്പെടുന്നതുമായ സസ്യവളർച്ചയുടെ പശ്ചാത്തലത്തിൽ ‘പുല്ല്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἐν ἀγρῷ
  choice: വയലിലുള്ള
  rationale: വയലെന്ന സാധാരണ തുറസ്സായ ഇടത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: ഇന്ന് ... ഉള്ളതും നാളെ ... എറിയപ്പെടുന്നതുമായ
  rationale: ഗ്രീക്കിലെ സാന്ദ്രമായ കൃദന്തരൂപം ഇന്നും നാളെയും തമ്മിലുള്ള ക്ഷണികതയുടെ വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തമായി വികസിപ്പിച്ചു.
- source_word: κλίβανον
  choice: അടുപ്പ്
  rationale: κλίβανος അപ്പം ചുടാനുള്ള മൺഅടുപ്പിനെ സൂചിപ്പിക്കാം. വ്യാവസായികമായ ‘ചൂള’യെക്കാൾ ‘അടുപ്പ്’ ഇവിടെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സാംസ്കാരികസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: ἀμφιέζει
  choice: അണിയിക്കുന്നു
  rationale: വസ്ത്രം ധരിപ്പിക്കുക എന്ന രൂപകം നിലനിർത്തുന്നു; ചുറ്റുപാടുള്ള വാക്യങ്ങളിലെ വസ്ത്രത്തെക്കുറിച്ചുള്ള ആശങ്കയോടും ഇത് നേരിട്ട് ബന്ധപ്പെടുന്നു.
- source_word: πόσῳ μᾶλλον
  choice: എത്രയധികം
  rationale: ചെറിയതിൽനിന്ന് വലിയതിലേക്കുള്ള വാദത്തിന്റെ താരതമ്യശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὀλιγόπιστοι
  choice: അല്പവിശ്വാസികളേ
  rationale: നേരിട്ടുള്ള സംബോധനവും മൃദുവായ ശാസനയും നിലനിർത്തുന്നു; രക്ഷാകരവിശ്വാസത്തെക്കുറിച്ചുള്ള സാങ്കേതിക നിഗമനം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: εἰ δὲ
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻവാക്യത്തിന്റെ തുടർച്ചയോടൊപ്പം ചെറിയൊരു വൈരുധ്യവും വാദപരമായ തിരിവും പ്രകടമാക്കുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന കർത്താവിനെ വികസനമില്ലാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: ദൈവം പുല്ലിനെ അണിയിക്കുന്ന രീതിയെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണം ലളിതമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὀλιγόπιστοι എന്ന സംബോധനത്തിന്റെ ശക്തി
  choice: ‘അല്പവിശ്വാസികളേ’ എന്ന നേരിട്ടുള്ളതെങ്കിലും മൃദുവായ ശാസന
  alternative: കടുത്ത അസഹിഷ്ണുതയോടെയുള്ള ശാസന; അല്ലെങ്കിൽ ദുർബലമായ ആശ്രയത്തെക്കുറിച്ചുള്ള വെറും വിവരണം
  rationale: ഈ പദം ദൈവത്തിലുള്ള അപര്യാപ്തമായ ആശ്രയത്തെ വിമർശിക്കുന്നു; എന്നാൽ രക്ഷാകരവിശ്വാസമോ വിശ്വാസത്യാഗമോ സംബന്ധിച്ച സാങ്കേതിക ഉപദേശം നൽകുന്നില്ല. ഗ്രീക്കിലെ ഇടയപരമായ സ്വരവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും അതേപടി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വ്യവസ്ഥാവാക്യവും ഇന്നും നാളെയും തമ്മിലുള്ള വൈരുധ്യവും നേരിട്ടുള്ള സംബോധനവും നിലനിർത്തി. രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
