id: LUK.12.19
reference: Luke 12:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: ml
  text: 'എന്റെ പ്രാണനോട് ഞാൻ പറയും: ‘പ്രാണനേ,[a] അനേക വർഷങ്ങൾക്കായി നിനക്കു ധാരാളം നല്ല വസ്തുക്കൾ ശേഖരിച്ചുവെച്ചിരിക്കുന്നു. വിശ്രമിക്കൂ; തിന്നൂ, കുടിക്കൂ, ആനന്ദിക്കൂ.[b]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്വയം” അല്ലെങ്കിൽ “ജീവൻ”; ഗ്രീക്ക് പദമായ ψυχή സന്ദർഭമനുസരിച്ച് “പ്രാണൻ,” “സ്വയം,” അല്ലെങ്കിൽ “ജീവൻ” എന്നു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഉല്ലസിക്കൂ” അല്ലെങ്കിൽ “ആഹ്ലാദിക്കൂ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: ഞാൻ പറയും
  rationale: λέγω എന്ന ക്രിയയുടെ ഭാവികാലരൂപം; നേരിട്ടുള്ള സ്വയംസംഭാഷണത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ψυχῇ / Ψυχή
  choice: പ്രാണനോട് / പ്രാണനേ
  rationale: ഇവിടെ മനുഷ്യൻ തന്റെ ഉള്ളിലെ സ്വത്വത്തോടാണ് സംസാരിക്കുന്നത്. ‘പ്രാണൻ’ ഗ്രീക്ക് ψυχήയുടെ സാഹിത്യപ്രതിധ്വനിയും അഭിസംബോധനയുടെ ശക്തിയും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘സ്വയം’ അല്ലെങ്കിൽ ‘ജീവൻ’ എന്ന അർത്ഥസാധ്യതയും ഉണ്ട്.
- source_word: πολλὰ ἀγαθὰ
  choice: ധാരാളം നല്ല വസ്തുക്കൾ
  rationale: സന്ദർഭത്തിൽ സമ്പാദിച്ച ഭൗതിക വിഭവങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; അതേസമയം ἀγαθὰ എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: κείμενα
  choice: ശേഖരിച്ചുവെച്ചിരിക്കുന്നു
  rationale: സൂക്ഷിച്ചുവെച്ച സാധനങ്ങളെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: εἰς ἔτη πολλά
  choice: അനേക വർഷങ്ങൾക്കായി
  rationale: ഭാവിയിലേക്കുള്ള ദൈർഘ്യം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀναπαύου
  choice: വിശ്രമിക്കൂ
  rationale: ആശ്വാസത്തോടെയും സ്വസ്ഥതയോടെയും കഴിയാനുള്ള ആജ്ഞയെ ലളിതമായി നൽകുന്നു.
- source_word: φάγε, πίε
  choice: തിന്നൂ, കുടിക്കൂ
  rationale: രണ്ട് ലളിതമായ ആജ്ഞാരൂപങ്ങളും നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: εὐφραίνου
  choice: ആനന്ദിക്കൂ
  rationale: സന്തോഷത്തോടെ സുഖിക്കുക എന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു; മതപരമായ ‘സന്തോഷിക്കുക’ എന്ന പ്രത്യേക ഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഉപമയിലെ സ്വയംസംഭാഷണത്തിൽ ψυχήയുടെ വിവർത്തനം
  choice: പ്രാണൻ
  alternative: സ്വയം; ജീവൻ
  rationale: ഈ വാക്യം മനുഷ്യഘടനയെക്കുറിച്ചുള്ള സാങ്കേതിക നിർവചനം നൽകുന്നതല്ല; ഒരാൾ തന്റെ ഉള്ളിലെ സ്വത്വത്തോട് സംസാരിക്കുന്നതാണ്. ‘പ്രാണൻ’ മൂലപദത്തിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര പ്രതിധ്വനി നിലനിർത്തുമ്പോൾ അടിക്കുറിപ്പ് സന്ദർഭസാധ്യമായ മറ്റു അർത്ഥങ്ങൾ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സ്വയം അഭിസംബോധന ചെയ്യുന്ന ആവർത്തനം മനപ്പൂർവം നിലനിർത്തിയിരിക്കുന്നു.
