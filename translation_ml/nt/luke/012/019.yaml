  - severity: medium
    issue: No footnote anchor or note is supplied for εὐφραίνου, despite the audit trail’s lexical-alternative footnote for that word.
    rationale: A footnote anchored to the final imperative is needed to preserve the lexical-alternative apparatus. It should be anchored to ‘ആനന്ദിക്കൂ,’ not to ‘കുടിക്കൂ,’ because εὐφραίνου is the final verb.
