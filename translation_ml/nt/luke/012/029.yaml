  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: ml
  text: നിങ്ങളും എന്തു ഭക്ഷിക്കും, എന്തു കുടിക്കും എന്ന് അന്വേഷിച്ചുകൊണ്ടിരിക്കരുത്; മനസ്സ് അസ്വസ്ഥമാകരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉത്കണ്ഠപ്പെടരുത്,” “മനസ്സ് ചഞ്ചലപ്പെടരുത്”; കൂടുതൽ അക്ഷരാർഥത്തിൽ, “അനിശ്ചിതത്വത്തിൽ തൂങ്ങിനിൽക്കരുത്.”
    reason: μετεωρίζεσθε എന്ന ക്രിയ മാനസിക അസ്വസ്ഥത, ഉത്കണ്ഠ, അനിശ്ചിതത്വത്തിൽ കഴിയുക എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥങ്ങൾ അനുവദിക്കുന്നു.
lexical_decisions:
- source_word: ὑμεῖς
  choice: നിങ്ങളും
  rationale: ഗ്രീക്കിൽ സർവനാമം വ്യക്തമായി ചേർത്തിരിക്കുന്നത് ഊന്നലിനാണ്. ‘നിങ്ങളും’ എന്നത് ആ ഊന്നലും മുൻസന്ദർഭത്തോടുള്ള ബന്ധവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ζητεῖτε
  choice: അന്വേഷിച്ചുകൊണ്ടിരിക്കരുത്
  rationale: ζητέω എന്നതിലെ ‘തേടുക/അന്വേഷിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും വർത്തമാനകാല നിരോധനത്തിലെ തുടർച്ചയായ വ്യാപൃതിയുടെ ഭാവവും ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു; സാധാരണ ആഹാരസമ്പാദനത്തെ നിരോധിക്കുന്നതായി ഇത് പറയുന്നില്ല.
- source_word: τί φάγητε καὶ τί πίητε
  choice: എന്തു ഭക്ഷിക്കും, എന്തു കുടിക്കും എന്ന്
  rationale: ഈ ആശ്രിതചോദ്യങ്ങളുടെ തുറന്ന, ആലോചനാത്മക ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു. ഭക്ഷണവും പാനീയവും എന്ന ഗ്രീക്കിലെ സമാന്തരഘടനയും നിലനിർത്തുന്നു.
- source_word: μετεωρίζεσθε
  choice: മനസ്സ് അസ്വസ്ഥമാക്കുകയും അരുത്
  rationale: ഈ അപൂർവ ക്രിയ സൂചിപ്പിക്കുന്ന മാനസിക അസ്ഥിരതയും ഉത്കണ്ഠാപൂർണമായ അനിശ്ചിതത്വവും പൊതുവായ മലയാളത്തിൽ പകരുന്നു; ‘ഉത്കണ്ഠപ്പെടുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം മാത്രം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കുന്നില്ല.
- source_word: καὶ ... καὶ ... καὶ
  choice: ഉം ... ഉം ... ചെയ്യുകയും
  rationale: ആവർത്തിച്ചുള്ള καίയുടെ സഞ്ചിതമായ ഏകോപനഭാവം കഴിയുന്നത്ര മലയാളവാക്യഘടനയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭക്ഷണപാനീയങ്ങളെക്കുറിച്ചുള്ള നിരോധനം സാധാരണ കരുതലിനെയോ ഭൗതിക ആവശ്യങ്ങളെയോ തള്ളുന്നതായി വ്യാഖ്യാനിക്കാതിരിക്കുക
  choice: ഭക്ഷണപാനീയങ്ങളെക്കുറിച്ചുള്ള നിരന്തരമായ ഉത്കണ്ഠാഭരിത അന്വേഷണത്തെയും മാനസിക അസ്ഥിരതയെയും നേരിട്ട് നിരോധിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: ഭക്ഷണത്തിനും പാനീയത്തിനുമായി സാധാരണ ആസൂത്രണം ചെയ്യുന്നതുപോലും നിരോധിക്കുന്നു എന്നോ ശരീരാവശ്യങ്ങളോട് പൂർണ ഉദാസീനത ആവശ്യപ്പെടുന്നു എന്നോ വിവർത്തനം ചെയ്യുക.
  rationale: ചുറ്റുപാടിലുള്ള വാക്യങ്ങൾ ദൈനംദിന ആവശ്യങ്ങളെക്കുറിച്ചുള്ള ഉത്കണ്ഠാപൂർണമായ വ്യാപൃതിയെയാണ് അഭിസംബോധന ചെയ്യുന്നത്. അതിനാൽ കല്പനയുടെ മൂർച്ച നിലനിർത്തിക്കൊണ്ട് സന്യാസപരമായ അധികധ്വനി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഭക്ഷിക്കുക’ എന്നത് ‘കഴിക്കുക’ എന്നതിനെക്കാൾ തിരുവെഴുത്തുപാരായണത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; എന്നാൽ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായി സൂക്ഷിച്ചു.
