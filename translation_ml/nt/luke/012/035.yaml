review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains both coordinated exhortations: the girded-waist image (ὀσφύες περιεζωσμέναι) and lamps in an ongoing burning state (λύχνοι καιόμενοι). The cultural footnote appropriately explains the garment-readiness image without importing doctrinal interpretation.'
  naturalness: The repeated construction “...നിലയിലും ...നിലയിലും ആയിരിക്കട്ടെ” is grammatically understandable but stiff and unnatural in modern Malayalam. A direct pair of coordinated imperatival clauses is clearer and more idiomatic. Malayalam normally uses singular “അര” for each person within an addressed group; it avoids the anatomically awkward “അരകൾ.”
  terminology: “അര കെട്ടിയിരിക്കട്ടെ” preserves the concrete readiness metaphor without replacing it with an interpretation. “വിളക്കുകൾ കത്തിക്കൊണ്ടിരിക്കട്ടെ” naturally conveys the continuing force of καιόμενοι. The footnote should identify the clothing/action sense more directly while retaining the explanatory image.
  issues:
  - severity: low
    issue: Stilted repeated state construction
    rationale: “നിങ്ങളുടെ അരകൾ കെട്ടിയ നിലയിലും വിളക്കുകൾ കത്തിക്കൊണ്ടിരിക്കുന്ന നിലയിലും ആയിരിക്കട്ടെ” is overly heavy for a short exhortation and does not read naturally in modern standard Malayalam.
  - severity: low
    issue: Plural “അരകൾ” is unnatural in Malayalam
    rationale: Although Greek uses the plural ὀσφύες, Malayalam idiom ordinarily says “നിങ്ങളുടെ അര” when addressing multiple people. This retains the collective distributive sense without anatomical awkwardness.
  - severity: low
    issue: Footnote alternative is somewhat broader than the garment image
    rationale: “പ്രവർത്തിക്കാൻ സജ്ജരായിരിക്കുക” communicates the result but leaves clothing implicit. Stating that the clothing is secured for action better reflects the source image.
  revised_text: നിങ്ങളുടെ അര കെട്ടിയിരിക്കട്ടെ; നിങ്ങളുടെ വിളക്കുകൾ കത്തിക്കൊണ്ടിരിക്കട്ടെ.[a]
