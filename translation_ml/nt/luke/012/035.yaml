revisions:
- from: നിങ്ങളുടെ അരകൾ കെട്ടിയ നിലയിലും വിളക്കുകൾ കത്തിക്കൊണ്ടിരിക്കുന്ന നിലയിലും ആയിരിക്കട്ടെ.[a]
  to: നിങ്ങളുടെ അര കെട്ടിയിരിക്കട്ടെ; നിങ്ങളുടെ വിളക്കുകൾ കത്തിക്കൊണ്ടിരിക്കട്ടെ.[a]
