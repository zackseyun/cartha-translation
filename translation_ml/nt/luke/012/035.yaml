  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔστωσαν ὑμῶν αἱ ὀσφύες περιεζωσμέναι καὶ οἱ λύχνοι καιόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/035.yaml
  text: Let your waists be girded and your lamps burning,[a]
translation:
  language: ml
  text: നിങ്ങളുടെ അര കെട്ടിയിരിക്കട്ടെ; നിങ്ങളുടെ വിളക്കുകൾ കത്തിക്കൊണ്ടിരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രവർത്തനത്തിനായി വസ്ത്രം മുറുക്കിക്കെട്ടി സജ്ജരായിരിക്കുക.” നീണ്ട വസ്ത്രത്തിന്റെ അറ്റങ്ങൾ ഒതുക്കി അരയിൽ കെട്ടി പ്രവർത്തനത്തിന് ഒരുങ്ങുന്നതിനെയാണ് ഈ ദൃശ്യരൂപം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: ആയിരിക്കട്ടെ
  rationale: εἰμί എന്ന ക്രിയയുടെ മൂന്നാംപുരുഷ ബഹുവചന വർത്തമാനകാല ആജ്ഞാരൂപം; മലയാളത്തിൽ ഉപദേശാത്മകമായ ആഹ്വാനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: രണ്ട് സമന്വിത നാമപദങ്ങളോടും ഉടമസ്ഥബന്ധം സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് സർവനാമം.
- source_word: ὀσφύες
  choice: അരകൾ
  rationale: അര/കടിപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘കടിപ്രദേശം’ എന്നത് അനാവശ്യമായി ശരീരശാസ്ത്രപരവും ‘അരക്കെട്ട്’ ആവർത്തനപരവുമാകും.
- source_word: περιεζωσμέναι
  choice: കെട്ടിയ നിലയിൽ
  rationale: περιζώννυμι എന്ന ക്രിയയുടെ പൂർണ്ണകാല കർമണി പങ്കാളിത്തരൂപം; നീണ്ട വസ്ത്രം അരയിൽ കെട്ടി സജ്ജമായിരിക്കുന്ന തുടർച്ചയായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: λύχνοι
  choice: വിളക്കുകൾ
  rationale: അമൂർത്തമായ വെളിച്ചമല്ല, കത്തുന്ന എണ്ണവിളക്കുകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: καιόμενοι
  choice: കത്തിക്കൊണ്ടിരിക്കുന്ന നിലയിൽ
  rationale: വർത്തമാനകാല പങ്കാളിത്തരൂപത്തിന്റെ തുടരുന്ന ഭാവം പ്രകടമാക്കുന്നു; ‘കത്തിച്ചുവെച്ച’ എന്നതിനെക്കാൾ മൂലപാഠത്തിലെ സജീവാവസ്ഥയോട് അടുത്തതാണ്.
theological_decisions:
- issue: സജ്ജതയെ സൂചിപ്പിക്കുന്ന സാംസ്കാരിക ദൃശ്യരൂപം
  choice: ‘അരകൾ കെട്ടിയ നിലയിൽ’ എന്ന മൂർത്തമായ രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘പ്രവർത്തിക്കാൻ സജ്ജരായിരിക്കുക’ അല്ലെങ്കിൽ ‘വസ്ത്രം മുറുക്കിക്കെട്ടി സജ്ജരായിരിക്കുക’
  rationale: മൂലപാഠം സജ്ജത എന്ന ആശയം നേരിട്ട് പറയാതെ, നീണ്ട വസ്ത്രം അരയിൽ കെട്ടുന്ന ദൃശ്യത്തിലൂടെ അവതരിപ്പിക്കുന്നു. അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ പകരാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അരകൾ കെട്ടുക’ എന്ന അല്പം അപരിചിതമായ പ്രയോഗം മൂലപാഠത്തിലെ സാംസ്കാരിക രൂപകം സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
