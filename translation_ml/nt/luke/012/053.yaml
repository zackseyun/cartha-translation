revisions:
- from: 'അവർ ഭിന്നിച്ചുനിൽക്കും: അപ്പൻ മകന് എതിരായും മകൻ അപ്പന് എതിരായും[a], അമ്മ മകൾക്ക് എതിരായും മകൾ അമ്മയ്ക്ക് എതിരായും, അമ്മായിയമ്മ തന്റെ മരുമകൾക്ക് എതിരായും മരുമകൾ തന്റെ അമ്മായിയമ്മയ്ക്ക് എതിരായും.[b]'
