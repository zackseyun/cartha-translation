id: LUK.12.53
reference: Luke 12:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: ml
  text: 'അവർ ഭിന്നിച്ചുനിൽക്കും: അപ്പൻ മകനെതിരെയും മകൻ അപ്പനെതിരെയും[a], അമ്മ മകൾക്കെതിരെയും മകൾ അമ്മയ്‌ക്കെതിരെയും, അമ്മായിയമ്മ തന്റെ മരുമകൾക്കെതിരെയും മരുമകൾ അമ്മായിയമ്മക്കെതിരെയും.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവർ തമ്മിൽ പിരിഞ്ഞുപോകും.” ഗ്രീക്ക് ക്രിയ ഒരു കുടുംബത്തിന്റെയോ കൂട്ടത്തിന്റെയോ ഉള്ളിലെ വിഭജനത്തിന് ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “മരുമകൾ” എന്നതിനുള്ള ഗ്രീക്ക് പദത്തിന് മറ്റു സന്ദർഭങ്ങളിൽ “വധു” എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ “അമ്മായിയമ്മ” എന്ന ബന്ധപദത്തോടു ജോടിയായി വരുന്നതിനാൽ “മരുമകൾ” എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: അവർ ഭിന്നിച്ചുനിൽക്കും
  rationale: ഭാവികാല കർമണിപ്രയോഗം കുടുംബത്തിനുള്ളിൽ ഉണ്ടാകുന്ന വിഭജനാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ഫലമായുള്ള അകൽച്ചയും എതിർചേരികളായി നിൽക്കുന്നതും ഈ പ്രയോഗം അറിയിക്കുന്നു; ആരാണ് അതിന് കാരണമായതെന്ന് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἐπὶ
  choice: എതിരായി
  rationale: വ്യക്തികൾ തമ്മിലുള്ള ആവർത്തിത ബന്ധഘടനയിൽ ഈ പദം വിരോധത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πατήρ / υἱός
  choice: അപ്പൻ / മകൻ
  rationale: പിതാവും ആൺമകനും എന്ന നിർദിഷ്ടവും പരസ്പരവുമായ കുടുംബബന്ധം നിലനിർത്തുന്നു; ആധുനിക സാധാരണ മലയാളത്തിൽ 'അപ്പൻ' സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: μήτηρ / θυγάτηρ
  choice: അമ്മ / മകൾ
  rationale: അമ്മയും പെൺമകളും എന്ന നിർദിഷ്ട പരസ്പരബന്ധം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: πενθερά
  choice: അമ്മായിയമ്മ
  rationale: വിവാഹബന്ധത്തിലൂടെയുള്ള അമ്മയെ സൂചിപ്പിക്കുന്ന വ്യക്തമായ സമകാലിക മലയാളപദം.
- source_word: νύμφη
  choice: മരുമകൾ
  rationale: മറ്റു സന്ദർഭങ്ങളിൽ 'വധു' എന്നർഥമാകാമെങ്കിലും πενθεράയോടുള്ള പരസ്പര കുടുംബജോടി ഇവിടെ 'മരുമകൾ' എന്ന അർഥം ഉറപ്പിക്കുന്നു.
- source_word: αὐτῆς
  choice: തന്റെ
  rationale: ആദ്യ അമ്മായിയമ്മ–മരുമകൾ ഘടകത്തിലെ ഉടമസ്ഥബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു; അവസാന ഘടകത്തിൽ ഗ്രീക്കിൽ സർവനാമമില്ലെങ്കിലും സ്വാഭാവികമായ പരസ്പരബന്ധം വ്യക്തമാക്കാൻ അതേ പദം ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: വിവരിക്കുന്ന ഭിന്നതയുടെ സ്വഭാവം
  choice: യേശുവിന്റെ ദൗത്യത്തിന്റെ ഫലമായി കുടുംബത്തിലും സമൂഹത്തിലും ഉണ്ടാകുന്ന സംഘർഷത്തിന്റെ വിവരണം
  alternative: കുടുംബവൈരത്തെ അംഗീകരിക്കുന്ന കല്പന; അല്ലെങ്കിൽ കുടുംബകലഹത്തെക്കുറിച്ചുള്ള പൊതുവായ പഴമൊഴി
  rationale: മുൻസന്ദർഭത്തിലെ ഭിന്നതയുടെ ഫലമായി പരസ്പര കുടുംബവിരോധങ്ങൾ ഈ വാക്യം നിരത്തുന്നു. പരിഭാഷ അതിന്റെ തീക്ഷ്ണത മയപ്പെടുത്തുന്നില്ല; അതേസമയം അത്തരം വൈരത്തിന് അംഗീകാരം നൽകുന്നതായും വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തനാത്മകമായ കുടുംബജോടികൾ മൂലപാഠത്തിന്റെ സമാന്തരഘടനയും തീക്ഷ്ണതയും നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് കരടിലെ [c] മുൻപരിഭാഷയെക്കുറിച്ചുള്ള കുറിപ്പ് മൂലഗ്രീക്ക് പിന്തുണയ്ക്കാത്തതിനാൽ പ്രസിദ്ധീകരണ കരടിൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
