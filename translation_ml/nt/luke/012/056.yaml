source:
  edition: SBLGNT
  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: ml
  text: കപടികളേ! ഭൂമിയുടെയും ആകാശത്തിന്റെയും[a] ഭാവം വിവേചിച്ചറിയാൻ നിങ്ങൾക്കറിയാം; എന്നാൽ ഈ കാലം വിവേചിച്ചറിയാൻ നിങ്ങൾക്കറിയാത്തത് എങ്ങനെ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഈ അവസരം’ അല്ലെങ്കിൽ ‘ഈ നിർണായക സമയം.’ ഗ്രീക്കിലെ καιρός എന്ന പദം പൊതുവായ സമയത്തെ മാത്രമല്ല, പ്രത്യേക പ്രാധാന്യമുള്ളതോ യോജിച്ചതോ ആയ സമയത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: കപടഭക്തരേ
  rationale: നേരിട്ടുള്ള സംബോധനയും ശാസനയും നിലനിർത്തുന്നു. ഈ സന്ദർഭത്തിൽ വേദിയിലെ അഭിനേതാക്കളെയല്ല, ഉള്ളിലെ യാഥാർഥ്യത്തിന് വിരുദ്ധമായി നടിക്കുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πρόσωπον
  choice: ഭാവം
  rationale: ഭൂമിയുടെയും ആകാശത്തിന്റെയും ദൃശ്യമായ രൂപഭാവം എന്ന പ്രയോഗാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: γῆς καὶ τοῦ οὐρανοῦ
  choice: ഭൂമിയുടെയും ആകാശത്തിന്റെയും
  rationale: കാലാവസ്ഥാസൂചനകളുടെ സന്ദർഭത്തിൽ γῆയെ ‘ഭൂമി’ എന്നും οὐρανόςനെ ദൈവിക വാസസ്ഥലം എന്നർഥമുള്ള ‘സ്വർഗം’ എന്നതിനു പകരം ‘ആകാശം’ എന്നും വിവർത്തനം ചെയ്യുന്നു.
- source_word: οἴδατε δοκιμάζειν
  choice: വിവേചിച്ചറിയാൻ നിങ്ങൾക്കറിയാം
  rationale: οἶδα + infinitive എന്ന ഘടനയിലെ കഴിവ്/അറിവ് നിലനിർത്തുകയും δοκιμάζωയുടെ പരിശോധിച്ച് തിരിച്ചറിയുക എന്ന അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: τὸν καιρὸν τοῦτον
  choice: ഈ കാലം
  rationale: τοῦτον എന്ന സൂചനാപദം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; καιρός സാധാരണ സമയം മാത്രമല്ല, പ്രസക്തമോ നിർണായകമോ ആയ കാലഘട്ടത്തെയും സൂചിപ്പിക്കാമെന്ന തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: വിവേചിച്ചറിയാൻ നിങ്ങൾക്കറിയാത്തത് എങ്ങനെ?
  rationale: πῶς ഉള്ള രോഷഭരിതമായ അലങ്കാരചോദ്യത്തിന്റെ ശക്തിയും മുൻവാക്യത്തിലെ ആവർത്തനഘടനയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ശാസനയിൽ καιρός എന്നതിന്റെ അർഥം
  choice: ഈ കാലം
  alternative: ഈ നിർണായക സമയം / ഈ അവസരം
  rationale: യേശുവിന്റെ ശുശ്രൂഷയുടെയും ദൈവിക പ്രവർത്തനത്തിന്റെയും പ്രാധാന്യം തിരിച്ചറിയാത്തതിനെ സന്ദർഭം സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തേക്കാൾ അധികമായി അർഥം നിർണയിക്കാതിരിക്കാൻ പൊതുവായതും ഗൗരവമുള്ളതുമായ ‘ഈ കാലം’ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. പ്രത്യക്ഷമായ ശാസനയുടെ മൂർച്ചയും മൂലപാഠത്തിലെ ആവർത്തനവും നിലനിർത്തി.
