    issue: «കപടഭക്തരേ» over-specifies ὑποκριταί.
    rationale: ‘ഭക്തർ’ explicitly identifies the addressees as devotees, an element absent from the Greek noun. «കപടികളേ» retains the moral-rebuking force without narrowing the reference.
  - severity: low
    issue: Footnote anchor placement is imprecise.
    rationale: The supplied note is linked in the English audit trail to ‘sky’ and explains the weather-sign context. Placing [a] immediately after «ആകാശത്തിന്റെയും» gives it a clear anchor while leaving the verse meaning unchanged.
