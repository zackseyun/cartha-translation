revisions:
- from: 'അപ്പോൾ പത്രോസ് പറഞ്ഞു: “കർത്താവേ, ഈ ഉപമ ഞങ്ങളോടാണോ പറയുന്നത്, അതോ എല്ലാവരോടുംകൂടെയോ?”'
  to: 'അപ്പോൾ പത്രോസ് പറഞ്ഞു: “കർത്താവേ, ഈ ഉപമ ഞങ്ങളോടാണോ പറയുന്നത്, അതോ എല്ലാവരോടും കൂടിയാണോ?”'
  rationale: The revision changes only the final interrogative phrasing, clarifying the additive force of καί and producing idiomatic modern Malayalam while retaining the Greek ambiguity as to the precise scope of “all.” No footnote is necessary for the Malayalam rendering.
