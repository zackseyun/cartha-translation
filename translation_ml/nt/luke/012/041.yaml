id: LUK.12.41
reference: Luke 12:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: ml
  text: 'അപ്പോൾ പത്രോസ് പറഞ്ഞു: “കർത്താവേ, ഈ ഉപമ ഞങ്ങളോടാണോ പറയുന്നത്, അതോ എല്ലാവരോടും കൂടിയാണോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ ഭൂതകാലരൂപത്തിന് നേരിട്ടുള്ള തത്തുല്യം. വാക്യം ചോദ്യമായിരുന്നാലും റിപ്പോർട്ടിങ് ക്രിയയെ ‘ചോദിച്ചു’ എന്നു മാറ്റാതെ മൂലത്തിലെ ‘പറഞ്ഞു’ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: മുൻപ്രസംഗത്തോടുള്ള തുടർച്ചയും കഥയിലെ ഈ ഘട്ടത്തിലേക്കുള്ള നീക്കവും സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന κύριε എന്ന പദത്തിന്റെ ആദരപൂർവവും ക്രിസ്തുശാസ്ത്രപരമായ സാധ്യത തുറന്നുവയ്ക്കുന്നതുമായ പതിവ് പരിഭാഷ.
- source_word: πρὸς ἡμᾶς
  choice: ഞങ്ങളോട്
  rationale: λέγεις എന്ന സംസാരക്രിയയോടൊപ്പം πρός സൂചിപ്പിക്കുന്ന അഭിസംബോധനയുടെ ദിശ കൃത്യമായി നൽകുന്നു.
- source_word: τὴν παραβολὴν ταύτην
  choice: ഈ ഉപമ
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ παραβολή എന്ന സാങ്കേതിക-സാഹിത്യ പദത്തിന് വ്യക്തവും പതിവുമായ മലയാള പരിഭാഷ.
- source_word: λέγεις
  choice: പറയുന്നത്
  rationale: നേരിട്ടുള്ള ചോദ്യത്തിൽ ഇപ്പോൾ നടക്കുന്ന സംസാരത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἢ καὶ
  choice: അതോ ... കൂടെയോ
  rationale: ἤയുടെ പകരവികല്പവും καίയുടെ ഉൾപ്പെടുത്തൽബലവും മലയാളത്തിലെ ‘അതോ ... കൂടെയോ’ എന്ന ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς πάντας
  choice: എല്ലാവരോടും
  rationale: πάντας ഇവിടെ വിശാലമായ ശ്രോതൃസമൂഹത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ലിംഗപരമായി അനാവശ്യമായ പരിമിതി വരുത്താതെ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള അഭിസംബോധനയിൽ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: ഗുരു / യജമാനൻ
  rationale: ‘കർത്താവ്’ ആദരസൂചകമായ അഭിസംബോധനയും സാധ്യതയുള്ള ക്രിസ്തുശാസ്ത്രപരമായ അനുരണനവും ഒരുപോലെ തുറന്നുവയ്ക്കുന്നു; സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികം അർത്ഥം നിർണയിക്കുന്നില്ല.
- issue: πάντας എന്ന പൊതുവാചക പുല്ലിംഗ ബഹുവചനത്തിന്റെ വ്യാപ്തി
  choice: എല്ലാവരും
  alternative: എല്ലാ പുരുഷന്മാരും / സകലരും
  rationale: ഇവിടെ ‘ഞങ്ങൾ’ എന്ന വിഭാഗത്തിന് എതിരായി വിശാലമായ ശ്രോതൃസമൂഹമാണ് ഉദ്ദേശ്യം. ‘എല്ലാവരും’ ആ ഉൾക്കൊള്ളുന്ന വ്യാപ്തി കൃത്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ‘ഞങ്ങളോടാണോ ... എല്ലാവരോടുംകൂടെയോ’ എന്ന സമാന്തരഘടന ഗ്രീക്കിലെ രണ്ട് സാധ്യതകളുടെ വൈരുധ്യവും രണ്ടാമത്തേതിലെ ഉൾപ്പെടുത്തൽബലവും വ്യക്തമാക്കുന്നു.
