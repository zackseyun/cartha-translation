    text: ‘ഭൂമിയിൽ’ എന്നത് ‘ദേശത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ വിശാലമായ അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖτε
  choice: നിങ്ങൾ കരുതുന്നുവോ
  rationale: വർത്തമാനകാല ബഹുവചന ക്രിയയുടെ നേരിട്ടുള്ള ആലങ്കാരിക ചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰρήνην
  choice: സമാധാനം
  rationale: വ്യക്തിപരമായ മനശ്ശാന്തിയിൽ മാത്രം ഒതുങ്ങാതെ സാമൂഹിക ഐക്യവും ഉൾക്കൊള്ളുന്ന പദവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: παρεγενόμην
  choice: ഞാൻ വന്നത്
  rationale: παραγίνομαι എന്ന ക്രിയയുടെ ഇവിടെ ഉദ്ദേശ്യത്തോടുകൂടിയ വരവ് എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δοῦναι
  choice: നൽകാൻ
  rationale: ഗ്രീക്കിലെ ‘കൊടുക്കുക/നൽകുക’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മലയാളത്തിലും ഈ പ്രയോഗം വ്യക്തമാണ്.
- source_word: ἐν τῇ γῇ
  choice: ഭൂമിയിൽ
  rationale: γῆയുടെ വിശാലമായ ‘ഭൂമി’ എന്ന അർഥം സ്വീകരിക്കുന്നു; ‘ദേശത്ത്’ എന്ന് പറഞ്ഞ് പ്രദേശപരമായി ചുരുക്കുന്നില്ല.
- source_word: οὐχί
  choice: അല്ല
  rationale: ആലങ്കാരിക ചോദ്യത്തിനുള്ള ശക്തവും സംക്ഷിപ്തവുമായ നിഷേധം.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: സുവിശേഷങ്ങളിലെ ഊന്നലുള്ള നേരിട്ടുള്ള അഭിസംബോധന ഔപചാരികത നഷ്ടപ്പെടാതെ നൽകുന്നു.
- source_word: ἀλλ’ ἢ
  choice: മറിച്ച്
  rationale: മുൻ നിഷേധത്തിനു പിന്നാലെയുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: διαμερισμόν
  choice: ഭിന്നത
  rationale: തുടർന്നുള്ള വാക്യങ്ങളിൽ കുടുംബങ്ങളിലുണ്ടാകുന്ന വേർപാടും ചേരിതിരിവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലവും നേരിട്ടുള്ളതുമായ പദം.
theological_decisions:
- issue: യേശുവിന്റെ വരവും സമാധാനവും സംബന്ധിച്ച മറ്റു വചനങ്ങളുമായുള്ള പ്രത്യക്ഷ സംഘർഷം മയപ്പെടുത്തണമോ എന്നത്
  choice: ‘സമാധാനം’–‘ഭിന്നത’ എന്ന മൂർച്ചയുള്ള വൈരുധ്യം അതേപടി നിലനിർത്തി.
  alternative: ‘സംഘർഷം ഉണ്ടാകാനിടയുണ്ട്’ എന്നോ മറ്റോ പറഞ്ഞ് ഇത് പരോക്ഷ ഫലമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം മനഃപൂർവം ശക്തമായ വൈരുധ്യം സൃഷ്ടിക്കുന്നു. യേശുവിന്റെ ദൗത്യം മനുഷ്യർക്കിടയിൽ, പ്രത്യേകിച്ച് കുടുംബങ്ങളിൽ, ഉണ്ടാക്കുന്ന വിഭജനഫലമാണ് സമീപസന്ദർഭം വിശദീകരിക്കുന്നത്; എന്നാൽ ആ വിശദീകരണം ഈ വാക്യത്തിനകത്ത് ചേർത്ത് ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ആലങ്കാരിക ചോദ്യത്തിന്റെ നേരിട്ടുള്ള വെല്ലുവിളിയും അവസാനത്തെ മൂർച്ചയുള്ള വൈരുധ്യവും നിലനിർത്തി. ഓരോ അടിക്കുറിപ്പുസൂചകവും അതുമായി ബന്ധപ്പെട്ട പദത്തിനരികിൽ ചേർത്തിരിക്കുന്നു.
