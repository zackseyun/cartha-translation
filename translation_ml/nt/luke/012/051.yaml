  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: ml
  text: ഭൂമിയിൽ[b] സമാധാനം നൽകാനാണ്[a] ഞാൻ വന്നതെന്ന് നിങ്ങൾ കരുതുന്നുവോ? അല്ല, ഞാൻ നിങ്ങളോടു പറയുന്നു, മറിച്ച് വിഭജനം നൽകാനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമാധാനം കൊണ്ടുവരാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘നൽകാൻ’ എന്നാണ്.
    reason: lexical_alternative
