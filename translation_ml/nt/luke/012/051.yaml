  to: ഭൂമിയിൽ[b] സമാധാനം നൽകാനാണ്[a] ഞാൻ വന്നതെന്ന് നിങ്ങൾ കരുതുന്നുവോ? അല്ല, ഞാൻ നിങ്ങളോടു പറയുന്നു, മറിച്ച് വിഭജനം നൽകാനാണ്.
