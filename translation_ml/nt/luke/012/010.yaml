id: LUK.12.10
reference: Luke 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: ml
  text: മനുഷ്യപുത്രനെതിരെ ഒരു വാക്കു പറയുന്ന ഏവനോടും അത് ക്ഷമിക്കപ്പെടും[a]; എന്നാൽ പരിശുദ്ധാത്മാവിനെതിരെ ദൂഷണം പറയുന്നവനോടു ക്ഷമിക്കപ്പെടുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: “അവനോട് അത് ക്ഷമിക്കപ്പെടും”; ‘അത്’ എന്നത് പറഞ്ഞ വാക്കിനെയോ അതിലൂടെ ചെയ്ത കുറ്റത്തെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὃς
  choice: ഏവനും
  rationale: വിതരണാത്മകവും പൊതുവ്യാപകവുമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐρεῖ λόγον
  choice: ഒരു വാക്കു പറയുന്ന
  rationale: λόγον എന്ന പദം ഒഴിവാക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: εἰς
  choice: എതിരെ
  rationale: ഇവിടത്തെ വിരോധപരമായ സംസാരസന്ദർഭത്തിൽ ദിശയേക്കാൾ എതിർപ്പാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ഈ വിശേഷനാമപ്രയോഗത്തിന്റെ സെമിറ്റിക് പശ്ചാത്തലവും ക്രിസ്തുവിനെ സംബന്ധിച്ച പ്രാധാന്യവും സൂക്ഷിക്കുന്ന സ്ഥാപിത മലയാളരൂപം.
- source_word: ἀφεθήσεται αὐτῷ
  choice: അവനോട് അത് ക്ഷമിക്കപ്പെടും
  rationale: ക്ഷമിക്കപ്പെടുന്ന കുറ്റം ഗ്രീക്കിൽ സൂചിതമായിരിക്കെ αὐτῷ എന്ന ദാതൃരൂപവും കർമണിപ്രയോഗവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: τῷ ... βλασφημήσαντι
  choice: ദൂഷണം പറയുന്നവൻ
  rationale: സാരവാചക കൃദന്തരൂപത്തെ പൊതുവായ പ്രസ്താവനയ്ക്കു ചേരുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പൂർത്തിയായ പ്രവൃത്തി എന്ന വ്യാഖ്യാനം അനാവശ്യമായി അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: τὸ ἅγιον πνεῦμα
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ദൈവിക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സമകാലികവുമായ മലയാളപദം.
- source_word: οὐκ ἀφεθήσεται
  choice: ക്ഷമിക്കപ്പെടുകയില്ല
  rationale: ഭാവികാല കർമണിനിഷേധത്തിന്റെ ഗൗരവം വ്യക്തമായും സംക്ഷിപ്തമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: മനുഷ്യപുത്രനെതിരെ സംസാരിക്കുന്നതും പരിശുദ്ധാത്മാവിനെതിരെ ദൂഷണം പറയുന്നതും തമ്മിലുള്ള വ്യത്യാസം
  choice: ക്ഷമിക്കപ്പെടുന്നതിനെക്കുറിച്ചുള്ള വാക്യത്തിന്റെ നേരിട്ടുള്ള വ്യത്യാസം വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: ആദ്യത്തേത് അജ്ഞതയാൽ ചെയ്യുന്ന ചെറിയ കുറ്റമെന്നും രണ്ടാമത്തേത് അന്തിമ അനുതാപമില്ലായ്മയെന്നും പരിഭാഷയിൽത്തന്നെ വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം വ്യത്യാസം പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനരീതി നിർവചിക്കുന്നില്ല; അതിനാൽ യഥാർഥ പാഠത്തിലെ സംഘർഷം പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൂഷണം പറയുക’ എന്ന പ്രയോഗം βλασφημέωയുടെ മതപരവും വിരോധപരവുമായ ശക്തി നിലനിർത്തുന്നു. പ്രധാനവാക്യത്തിലെ [a] അടിക്കുറിപ്പ് ഗ്രീക്കിലെ കർമണിപ്രയോഗവും സൂചിതമായ കുറ്റവും വ്യക്തമാക്കുന്നു.
