reference: Luke 12:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: ml
  text: 'അവൻ ജനക്കൂട്ടങ്ങളോടും ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “പടിഞ്ഞാറ് ഒരു മേഘം ഉയരുന്നതു കാണുമ്പോൾത്തന്നെ, ‘മഴ[a] വരുന്നു’ എന്നു നിങ്ങൾ പറയുന്നു; അങ്ങനെതന്നെ സംഭവിക്കുകയും ചെയ്യുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശക്തമായ മഴ വരുന്നു” / “കനത്ത മഴപ്പെയ്ത്ത് വരുന്നു.” ὄμβρος എന്ന ഗ്രീക്കുപദം പൊതുവായി മഴയെയോ കൂടുതൽ പ്രത്യേകമായി ശക്തമായ മഴയെയോ കനത്ത മഴപ്പെയ്ത്തിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം പശ്ചാത്തലത്തിൽ തുടരുന്ന പ്രസംഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ അതിന്റെ ദൈർഘ്യഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ καὶ
  choice: അവൻ ... ഓടും
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-ഓടും’ എന്ന പ്രയോഗത്തിലൂടെ നൽകുന്നു; δέയെ വേറിട്ട് അമിതമായി പരിഭാഷപ്പെടുത്താതെ പ്രസംഗത്തിന്റെ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: τοῖς ὄχλοις
  choice: ജനക്കൂട്ടങ്ങളോട്
  rationale: ഗ്രീക്കിലെ ബഹുവചനം കൃത്യമായി സൂക്ഷിക്കുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: Ὅταν ἴδητε
  choice: കാണുമ്പോൾ
  rationale: പൊതുവായി ആവർത്തിക്കാവുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന ὅταν + ഉപവാക്യക്രിയയുടെ ഭാവം മലയാളത്തിലെ ‘-ുമ്പോൾ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: νεφέλην
  choice: ഒരു മേഘം
  rationale: മൂലപദം പൊതുവായി ‘മേഘം’ എന്നാണ്; മഴമേഘം എന്ന് സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἀνατέλλουσαν
  choice: ഉയരുന്നത്
  rationale: മേഘം ചക്രവാളത്തിൽ ഉയർന്നുവരുന്ന ദൃശ്യത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐπὶ δυσμῶν
  choice: പടിഞ്ഞാറ്
  rationale: പടിഞ്ഞാറൻ ദിശയിലോ ചക്രവാളത്തിലോ മേഘം കാണപ്പെടുന്നതെന്ന കാലാവസ്ഥാനിരീക്ഷണം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; ‘പടിഞ്ഞാറുനിന്ന്’ എന്നും അർഥമാക്കാം.
- source_word: εὐθέως
  choice: കാണുമ്പോൾത്തന്നെ
  rationale: ‘ഉടൻ’ എന്ന ശക്തി ക്രിയാസന്ദർഭത്തോട് ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: λέγετε
  choice: നിങ്ങൾ പറയുന്നു
  rationale: പതിവായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലം നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: നേരിട്ടുള്ള ഉദ്ധരണിയായി
  rationale: പറയുന്നതിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ὅτιയെ മലയാളത്തിൽ ഉദ്ധരണിചിഹ്നങ്ങളും ‘എന്നു’വും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Ὄμβρος
  choice: മഴ
  rationale: പദത്തിന് പൊതുവായ മഴയെയും ശക്തമായ മഴയെയോ മഴക്കാറ്റിനെയോ സൂചിപ്പിക്കാം. മലയാളത്തിലെ ‘മഴ വരുന്നു’ ഏറ്റവും സ്വാഭാവികമായ കാലാവസ്ഥാപ്രയോഗമാണ്; കൂടുതൽ ശക്തമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: സമീപിച്ചുകൊണ്ടിരിക്കുന്ന കാലാവസ്ഥയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലത്തിന്റെ ആസന്നഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καὶ γίνεται οὕτως
  choice: അങ്ങനെതന്നെ സംഭവിക്കുകയും ചെയ്യുന്നു
  rationale: പ്രവചനവും ഫലവും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം ‘അങ്ങനെതന്നെ’ സൂക്ഷിക്കുന്നു; പൊതുവായി സംഭവിക്കുന്നതെന്ന വർത്തമാനഭാവവും നിലനിർത്തുന്നു.
