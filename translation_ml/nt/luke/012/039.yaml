id: LUK.12.39
reference: Luke 12:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: ml
  text: 'എന്നാൽ ഇതു മനസ്സിലാക്കുക: കള്ളൻ ഏതു സമയത്ത് വരുമെന്ന് വീട്ടുടമ അറിഞ്ഞിരുന്നെങ്കിൽ, തന്റെ വീട്ടിൽ കുത്തിത്തുറന്ന് അകത്തു കടക്കാൻ അയാൾ അനുവദിക്കുമായിരുന്നില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘തന്റെ വീട് തുരക്കപ്പെടാൻ.’ അക്കാലത്ത് വീടിന്റെ ചുമർ തുരന്ന് അകത്തു കടക്കുന്ന രീതിയെയാണ് ഇതു സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: എന്നാൽ ഇതു മനസ്സിലാക്കുക
  rationale: γινώσκετε ബഹുവചന വർത്തമാനകാല ആജ്ഞാരൂപമാണ്; മലയാളത്തിൽ ബഹുമാന/ബഹുവചന നിർദേശം സ്വാഭാവികമായി നൽകുന്ന ‘മനസ്സിലാക്കുക’ തിരിച്ചറിവിനെയും ഗ്രഹിക്കലിനെയും വ്യക്തമാക്കുന്നു. δέ സന്ദർഭത്തിലെ മാറ്റം/വ്യത്യാസം സൂചിപ്പിക്കാൻ ‘എന്നാൽ’ ആയി നൽകി.
- source_word: ὅτι
  choice: ':'
  rationale: അറിയേണ്ട ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ὅτιയെ മലയാളത്തിൽ അസ്വാഭാവികമായ ‘എന്ന്’ ഘടനയാക്കാതെ ദ്വിബിന്ദു സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ὁ οἰκοδεσπότης
  choice: വീട്ടുടമ
  rationale: വീടിന്റെയോ കുടുംബത്തിന്റെയോ അധികാരമുള്ള ആളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘വീട്ടുടമ’ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമാണ്; ഉടമസ്ഥാവകാശം മാത്രം മുൻനിർത്താതെ സന്ദർഭത്തിലെ വീടിന്റെ ചുമതലയുള്ള വ്യക്തിയെയും സൂചിപ്പിക്കാനാകും.
- source_word: ποίᾳ ὥρᾳ
  choice: ഏതു സമയത്ത്
  rationale: ὥραയ്ക്ക് അക്ഷരാർഥത്തിൽ ‘മണിക്കൂർ’ എന്നുണ്ടെങ്കിലും ഇവിടെ ഉദ്ദേശ്യം വരവിന്റെ സമയം അറിയുക എന്നതാണ്. ‘ഏതു സമയത്ത്’ മലയാളത്തിൽ സ്വാഭാവികവും അർഥസൂക്ഷ്മത സംരക്ഷിക്കുന്നതുമാണ്.
- source_word: ὁ κλέπτης ἔρχεται
  choice: കള്ളൻ … വരുന്നതെന്ന്
  rationale: ഗ്രീക്കിൽ ἔρχεται വർത്തമാനരൂപമാണെങ്കിലും, ഭൂതകാലത്തിലെ സങ്കൽപ്പവിരുദ്ധ ഉപാധിക്കുള്ള പരോക്ഷ ഉള്ളടക്കമായി മലയാളത്തിലെ ‘വരുന്നതെന്ന്’ സമയബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വരവ് പ്രതീക്ഷിക്കപ്പെട്ട സംഭവമാണെന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: അനുവദിക്കുമായിരുന്നില്ല
  rationale: ἄν സഹിതമുള്ള രൂപം യാഥാർഥ്യത്തിൽ സംഭവിക്കാത്ത ഫലത്തെ സൂചിപ്പിക്കുന്നു. ‘അനുവദിക്കുമായിരുന്നില്ല’ ആ സങ്കൽപ്പവിരുദ്ധ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: διορυχθῆναι
  choice: കുത്തിത്തുറക്കാൻ
  rationale: ഈ ക്രിയയുടെ അടിസ്ഥാനചിത്രം വീടിന്റെ ചുമർ തുരന്ന് അകത്തു കടക്കുന്നതാണ്. ‘കുത്തിത്തുറക്കുക’ ആ ഭൗതിക ദൃശ്യത്തെ മലയാളത്തിൽ നിലനിർത്തുകയും അതിക്രമിച്ചു കടക്കുന്നതെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν οἶκον αὐτοῦ
  choice: തന്റെ വീട്
  rationale: അനുവദിക്കുന്ന വ്യക്തിയിലേക്കുതന്നെ αὐτοῦ മടങ്ങുന്നതിനാൽ ‘തന്റെ’ സ്വാഭാവികവും സംശയരഹിതവുമാണ്; οἶκος ഇവിടെ ഭൗതിക കെട്ടിടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വീട്’ യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. സങ്കൽപ്പവിരുദ്ധ ഉപാധി ‘അറിഞ്ഞിരുന്നെങ്കിൽ … അനുവദിക്കുമായിരുന്നില്ല’ എന്ന സ്വാഭാവിക ഘടനയിൽ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
