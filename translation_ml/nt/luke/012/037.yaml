id: LUK.12.37
reference: Luke 12:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: ml
  text: 'കർത്താവ്[b] വരുമ്പോൾ ഉണർന്നിരിക്കുന്നതായി കണ്ടെത്തുന്ന ആ അടിമകൾ[a] ഭാഗ്യവാന്മാർ! സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അവൻ സേവനത്തിനായി അര മുറുക്കി[c] അവരെ ഭക്ഷണമേശയിൽ ചാരിയിരുത്തും; പിന്നെ അടുത്തുചെന്ന് അവർക്കു വിളമ്പിക്കൊടുക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘അടിമകൾ’ എന്നതിന് ‘ദാസന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: δοῦλοι). ഈ ഉപമയിൽ യജമാനനോടുള്ള അവരുടെ ബന്ധിത ഗൃഹസ്ഥാനം വ്യക്തമായതിനാലാണ് മുഖ്യവാചകത്തിൽ ‘അടിമകൾ’ എന്നു നൽകിയിരിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: 'ഉപമയുടെ തൽസന്ദർഭത്തിൽ ‘കർത്താവ്’ എന്നതിന് ‘യജമാനൻ’ എന്നും പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: κύριος).'
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘അവൻ അര കെട്ടും.’ പ്രവർത്തിക്കാനോ സേവിക്കാനോ വേണ്ടി നീണ്ട വസ്ത്രം അരയിൽ ഒതുക്കിക്കെട്ടി ഒരുങ്ങുന്നതിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: ഭാഗ്യവാന്മാർ
  rationale: ആശീർവചനത്തിന്റെ ഗൗരവവും ദൈവാനുകൂല്യത്തിന്റെ ധ്വനിയും നിലനിർത്തുന്നു; വെറും മാനസികസന്തോഷം സൂചിപ്പിക്കുന്ന പദത്തെക്കാൾ യോജിച്ചത്.
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: ഉടമയും അടിമകളും ഉൾപ്പെടുന്ന ഗൃഹപശ്ചാത്തലത്തിൽ അവരുടെ ബന്ധിത സാമൂഹികസ്ഥാനം ഇവിടെ പ്രസക്തമാണ്; ‘ദാസന്മാർ’ എന്ന പരിഹാരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ഉടൻ കാണുന്ന ഉപമാപശ്ചാത്തലത്തിൽ ‘യജമാനൻ’ സാധ്യമാണെങ്കിലും, ലൂക്കോസിന്റെ പ്രയോഗത്തിലുള്ള വിശാലമായ കർത്തൃത്വധ്വനി നഷ്ടപ്പെടുത്താതെ വയ്ക്കുന്നു.
- source_word: γρηγοροῦντας
  choice: ഉണർന്നിരിക്കുന്നതായി
  rationale: ശാരീരികമായി ഉറങ്ങാതിരിക്കുന്നതും ജാഗ്രതയോടെ കാത്തിരിക്കുന്നതും ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഊന്നൽനൽകുന്ന ആമുഖസൂത്രം ഗൗരവത്തോടെയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും പകരുന്നു.
- source_word: περιζώσεται
  choice: സേവനത്തിനായി അര മുറുക്കി
  rationale: പ്രവർത്തനത്തിനായി നീണ്ട വസ്ത്രം അരയിൽ കെട്ടിയൊരുങ്ങുന്ന സാംസ്കാരിക ദൃശ്യം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀνακλινεῖ αὐτούς
  choice: അവരെ ഭക്ഷണത്തിനിരുത്തും
  rationale: പുരാതന വിരുന്നിൽ ചാരിക്കിടന്ന് ഭക്ഷണം കഴിക്കുന്ന പതിവിനെ അക്ഷരാർഥത്തിൽ അനുകരിക്കാതെ, ഭക്ഷണസന്ദർഭം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: παρελθὼν
  choice: അടുത്തുചെന്ന്
  rationale: അതിഥികളുടെ അടുക്കലൂടെ ചെന്നു സേവിക്കുന്ന യജമാനന്റെ ചലനം സന്ദർഭോചിതമായി പ്രകടമാക്കുന്നു.
- source_word: διακονήσει αὐτοῖς
  choice: അവർക്കു വിളമ്പിക്കൊടുക്കും
  rationale: ഈ ഭക്ഷണസന്ദർഭത്തിലെ മേശശുശ്രൂഷയെ വ്യക്തമായി അറിയിക്കുന്നു; സഭാപരമായ പ്രത്യേക അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഉപമയിലെ κύριος എന്ന പദത്തിന്റെ ഗൃഹപരവും കർത്തൃത്വപരവുമായ ധ്വനികൾ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഗൃഹനാഥനെ സൂചിപ്പിക്കുന്ന തൽസന്ദർഭം ‘യജമാനൻ’ എന്ന പരിഭാഷയെ അനുവദിക്കുന്നു. എന്നാൽ കർത്താവ് തന്നെയുള്ളവരെ സേവിക്കുന്ന മറിച്ചിടലിന്റെ വിശാല ധ്വനി സംരക്ഷിക്കാൻ മുഖ്യവാചകത്തിൽ ‘കർത്താവ്’ നിലനിർത്തി, മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ഗൃഹപശ്ചാത്തലത്തിലെ δοῦλοι എന്ന പദത്തിന്റെ സാമൂഹികസ്ഥാനം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ
  rationale: കർത്താവും അവന്റെ അധികാരത്തിനു കീഴിലുള്ളവരും തമ്മിലുള്ള ബന്ധം ഉപമയിൽ വ്യക്തമായതിനാൽ ‘അടിമകൾ’ മൂലപദത്തിന്റെ കടുപ്പം മറച്ചുവയ്ക്കുന്നില്ല; മലയാളത്തിലെ പരമ്പരാഗത പരിഹാരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: കർത്താവ് അടിമകളെ ഭക്ഷണത്തിനിരുത്തി സേവിക്കുന്ന വേഷമാറ്റം
  choice: വാചകത്തിലെ വിസ്മയകരമായ വേഷമാറ്റം അതേപടി നിലനിർത്തുന്നു
  alternative: ഇത് അന്തിമവിരുന്നിനെയോ പ്രത്യേക ക്രിസ്തുശാസ്ത്ര അവകാശവാദത്തെയോ വ്യക്തമായി സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കൽ
  rationale: വാക്യം യജമാനൻ അടിമകളെ സേവിക്കുന്ന അപ്രതീക്ഷിത പ്രവൃത്തി പറയുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ സാധ്യതകൾ വിശദീകരിച്ച് ഉറപ്പിക്കാതെ തുറന്ന നിലയിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആശീർവചനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. ‘അര മുറുക്കി’ എന്ന ദൃശ്യപ്രയോഗം സാംസ്കാരിക അകലം കുറയ്ക്കാതെ പ്രവർത്തനസജ്ജത അറിയിക്കുന്നു; ‘വിളമ്പിക്കൊടുക്കും’ മേശശുശ്രൂഷയുടെ സന്ദർഭം വ്യക്തമാക്കുന്നു.
