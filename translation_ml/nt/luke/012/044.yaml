  edition: SBLGNT
  text: ἀληθῶς λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അവൻ അവനെ തനിക്കുള്ള സകലത്തിന്റെയും മേൽ നിയമിക്കും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവന്റെ സകല സ്വത്തുക്കളുടെയും മേൽ” അല്ലെങ്കിൽ “അവന്റെ സകല വസ്തുവകകളുടെയും മേൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθῶς
  choice: സത്യമായി
  rationale: പ്രസ്താവനയുടെ സത്യതയും ഗൗരവവും ഊന്നിപ്പറയുന്ന ക്രിയാവിശേഷണത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും അധികാരപൂർവമായ പ്രസ്താവനയും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: ἐπὶ
  choice: മേൽ
  rationale: ദത്തിവിനോടുകൂടിയ ἐπί ഇവിടെ അധികാരത്തിന്റെയോ മേൽനോട്ടത്തിന്റെയോ അർഥം നൽകുന്നു.
- source_word: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: തനിക്കുള്ള സകലത്തിന്റെയും
  rationale: യജമാനനുള്ളതെല്ലാം എന്ന വിശാലമായ പരിധി നിലനിർത്തുന്നു; ഭൗതിക വസ്തുക്കളിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: καταστήσει
  choice: നിയമിക്കും
  rationale: ഒരാളെ ഉത്തരവാദിത്വമുള്ള സ്ഥാനത്ത് ആക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: സമീപസന്ദർഭത്തിലെ പുരുഷലിംഗ ഏകവചന കഥാപാത്രത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപമയിലെ പുരുഷലിംഗ ഏകവചന സർവനാമം
  choice: “അവൻ”, “അവനെ” എന്നീ പുരുഷലിംഗ രൂപങ്ങൾ നിലനിർത്തി
  alternative: ലിംഗനിരപേക്ഷമായ “ആ വ്യക്തിയെ” തുടങ്ങിയ രൂപങ്ങൾ ഉപയോഗിക്കുക
  rationale: ഗ്രീക്ക് പാഠം ഉപമയിലെ പുരുഷ കഥാപാത്രത്തെ പുരുഷലിംഗ ഏകവചന രൂപങ്ങളിൽ പരാമർശിക്കുന്നു; അതിനെ വ്യാഖ്യാനപരമായി പൊതുവൽക്കരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. “തനിക്കുള്ള സകലത്തിന്റെയും” എന്ന പ്രയോഗം αὐτοῦ യജമാനനെ സൂചിപ്പിക്കുന്നതാണെന്ന് മലയാളത്തിൽ വ്യക്തത വരുത്തുകയും മൂലത്തിലെ വിശാലത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
