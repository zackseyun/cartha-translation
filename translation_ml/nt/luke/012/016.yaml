id: LUK.12.16
reference: Luke 12:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ παραβολὴν πρὸς αὐτοὺς λέγων· Ἀνθρώπου τινὸς πλουσίου εὐφόρησεν ἡ χώρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: ml
  text: 'അപ്പോൾ അദ്ദേഹം അവരോട് ഒരു ഉപമ പറഞ്ഞു: “ഒരു ധനികന്റെ ഭൂമി സമൃദ്ധമായി വിളവു നൽകി.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ധാരാളമായി വിളഞ്ഞു” അല്ലെങ്കിൽ “വളരെ ഫലഭൂയിഷ്ഠമായിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: δέയെ ശക്തമായ വിരോധമായി കാണാതെ, ആഖ്യാനത്തിന്റെ സ്വാഭാവിക പുരോഗതി സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമായി ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: παραβολὴν
  choice: ഒരു ഉപമ
  rationale: സുവിശേഷങ്ങളിൽ παραβολή സൂചിപ്പിക്കുന്ന സവിശേഷമായ കഥാരൂപവും ദൈവശാസ്ത്രപരമായ വിഭാഗവും ‘ഉപമ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πρὸς αὐτοὺς
  choice: അവരോട്
  rationale: അഭിസംബോധനയുടെ ദിശ വ്യക്തമായി സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: λέγων
  choice: 'പറഞ്ഞു:'
  rationale: ഉപമയുടെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് വർത്തമാനകൃദന്തരൂപം മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി ഉദ്ധരണിക്കു മുമ്പുള്ള ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: ഒരു ധനികന്റെ
  rationale: τινός എന്ന അനിശ്ചിതത്വം ‘ഒരു’ എന്നതിൽ നിലനിൽക്കുന്നു; പുല്ലിംഗ ഏകവചന വ്യക്തിയെ ‘ധനികൻ’ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: εὐφόρησεν
  choice: സമൃദ്ധമായി വിളവു നൽകി
  rationale: കൃഷിഭൂമി നന്നായി ഉൽപ്പാദിപ്പിച്ചു എന്ന εὐφορέωയുടെ സന്ദർഭാർഥം സാധാരണക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἡ χώρα
  choice: ഭൂമി
  rationale: ഇവിടെ χώρα രാജ്യമല്ല, ആ ധനികന്റെ കൃഷിക്കുപയോഗിക്കുന്ന ഭൂസ്വത്താണ്; ‘ഭൂമി’ ആ അർഥം വിശാലമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അദ്ദേഹം’ മുൻസന്ദർഭത്തിലെ യേശുവിനെ ആദരസൂചകമായി പരാമർശിക്കുന്നു. മൂലത്തിലെ കൃഷിസംബന്ധമായ അർഥം വ്യക്തമാക്കിക്കൊണ്ട് അതിരുകടന്ന വ്യാഖ്യാനം ഒഴിവാക്കി.
