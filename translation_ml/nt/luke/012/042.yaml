id: LUK.12.42
reference: Luke 12:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: ml
  text: 'കർത്താവ് പറഞ്ഞു: “അങ്ങനെയെങ്കിൽ, തന്റെ വീട്ടുജോലിക്കാരുടെ മേൽനോട്ടത്തിന് യജമാനൻ നിയമിക്കുന്ന, അവർക്കു തക്കസമയത്ത് ഭക്ഷണവിഹിതം[b] നൽകേണ്ട വിശ്വസ്തനും വിവേകിയുമായ[a] കാര്യസ്ഥൻ ആരാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജ്ഞാനിയായ’.
    reason: lexical_alternative
  - marker: b
    text: ‘ഭക്ഷണവിഹിതം’ എന്നതിന് പദശഃ ‘അളന്ന ധാന്യവിഹിതം’; അതായത്, ഓരോ സേവകനും നിശ്ചയിച്ചിരുന്ന അളവിലുള്ള ഭക്ഷണപ്പങ്ക്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: കർത്താവ് / യജമാനൻ
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്ത് യേശുവിനെ സൂചിപ്പിക്കുന്ന ബഹുമാനപദമായി ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു; ഉപമയ്ക്കുള്ളിലെ വീട്ടുടമയെ സൂചിപ്പിക്കുന്ന രണ്ടാം പ്രയോഗത്തിൽ ‘യജമാനൻ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: πιστός
  choice: വിശ്വസ്തൻ
  rationale: ഏൽപ്പിച്ച ഉത്തരവാദിത്വത്തിൽ ആശ്രയിക്കാവുന്നവൻ എന്ന അർഥം ഈ പദം വ്യക്തമായി നൽകുന്നു.
- source_word: οἰκονόμος
  choice: കാര്യസ്ഥൻ
  rationale: ഒരു വീടിന്റെയോ സ്വത്തിന്റെയോ നടത്തിപ്പ് ഏൽപ്പിക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പദമാണ്.
- source_word: φρόνιμος
  choice: വിവേകി
  rationale: പ്രായോഗിക ജ്ഞാനവും ഉചിതമായ തീരുമാനശേഷിയും സൂചിപ്പിക്കുന്നു; ‘ജ്ഞാനിയായ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: καταστήσει
  choice: നിയമിക്കുന്ന
  rationale: ഉത്തരവാദിത്വമുള്ള സ്ഥാനത്ത് ഒരാളെ നിർത്തുകയോ ചുമതലപ്പെടുത്തുകയോ ചെയ്യുന്നതാണ് സന്ദർഭത്തിലെ അർഥം.
- source_word: θεραπεία
  choice: വീട്ടുജോലിക്കാർ
  rationale: അമൂർത്തമായ സേവനത്തെയല്ല, കാര്യസ്ഥന്റെ മേൽനോട്ടത്തിലുള്ള വീട്ടിലെ സേവകരുടെ കൂട്ടത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν καιρῷ
  choice: തക്കസമയത്ത്
  rationale: അനുയോജ്യമായ അഥവാ നിശ്ചിതമായ സമയത്ത് എന്ന ആശയം സ്വാഭാവികമായി പകരുന്നു.
- source_word: σιτομέτριον
  choice: ഭക്ഷണവിഹിതം
  rationale: ഓരോ സേവകനും അളന്നുനൽകുന്ന ഭക്ഷണത്തിന്റെ പങ്ക് എന്ന പ്രവർത്തനപരമായ അർഥം വ്യക്തമാക്കുന്നു; ധാന്യവിഹിതം എന്ന പദശഃ സൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ആവർത്തിക്കുന്ന κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: യേശുവിനെ സൂചിപ്പിക്കുമ്പോൾ ‘കർത്താവ്’; ഉപമയിലെ വീട്ടുടമയെ സൂചിപ്പിക്കുമ്പോൾ ‘യജമാനൻ’
  alternative: രണ്ടിടത്തും ‘കർത്താവ്’
  rationale: ഗ്രീക്കിൽ ഒരേ പദമാണെങ്കിലും, വാക്യത്തിലെ രണ്ട് പരാമർശതലങ്ങൾ മലയാളത്തിൽ വ്യക്തമായി വേർതിരിക്കുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു; κύριος എന്ന പദത്തിന്റെ ‘കർത്താവ്/യജമാനൻ’ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉപമയിലെ വീട്ടുഭരണസന്ദർഭം വ്യക്തമാക്കാൻ ‘കാര്യസ്ഥൻ’, ‘വീട്ടുജോലിക്കാർ’, ‘ഭക്ഷണവിഹിതം’ എന്നീ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തെരഞ്ഞെടുത്തു. അടിക്കുറിപ്പ് [a] ബന്ധപ്പെട്ട ‘വിവേകി’ എന്ന പദത്തിനരികിലും [b] ഭക്ഷണവിഹിതത്തെ വിശദീകരിക്കുന്ന വാക്യാവസാനത്തിലും ചേർത്തിരിക്കുന്നു.
