source:
  edition: SBLGNT
  text: βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ πῶς συνέχομαι ἕως ⸀ὅτου τελεσθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: ml
  text: എന്നാൽ എനിക്ക് ഒരു സ്നാനം ഏൽക്കാനുണ്ട്[a][b]; അതു പൂർത്തിയാകുന്നതുവരെ ഞാൻ എത്രമാത്രം ഞെരുക്കത്തിലാണ്![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ സ്നാനപ്പെടേണ്ട ഒരു സ്നാനമുണ്ട്.’ ഗ്രീക്കിൽ ‘സ്നാനം’ എന്ന ദൃശ്യഭാവം നാമത്തിലും ക്രിയയിലും വ്യക്തമായി നിലനിൽക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘സ്നാനം’ ഒരു രൂപകമാണ്; യേശു നേരിടാനിരിക്കുന്ന, തന്നെ മൂടിക്കളയുന്നതുപോലെയുള്ള കഷ്ടാനുഭവത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘അതു പൂർത്തിയാകുന്നതുവരെ ഞാൻ എത്രമാത്രം ബന്ധിതനായിരിക്കുന്നു!’ അല്ലെങ്കിൽ ‘എത്രമാത്രം സമ്മർദത്തിലാണ്!’
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: ഒരു സ്നാനം
  rationale: വരാനിരിക്കുന്ന കഷ്ടാനുഭവത്തെ സൂചിപ്പിക്കുന്ന രൂപകമാണെങ്കിലും, മൂലത്തിലെ സ്നാനത്തിന്റെ ദൃശ്യഭാവം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἔχω βαπτισθῆναι
  choice: എനിക്ക് ഒരു സ്നാനം ഏൽക്കാനുണ്ട്
  rationale: ἔχω + infinitive സൂചിപ്പിക്കുന്ന വരാനിരിക്കുന്ന അനിവാര്യതയും passive ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിലെ നാമ-ക്രിയ ആവർത്തനം മുഖ്യവാക്യത്തിൽ അസ്വാഭാവികമായി പകർത്തുന്നില്ല.
- source_word: πῶς
  choice: എത്രമാത്രം
  rationale: യേശുവിന്റെ തീവ്രമായ അവസ്ഥയെ അവതരിപ്പിക്കുന്ന ആശ്ചര്യാർഥക പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: συνέχομαι
  choice: ഞെരുക്കത്തിലാണ്
  rationale: ‘ഞെരുക്കപ്പെടുക,’ ‘സമ്മർദത്തിലാകുക,’ ‘വ്യാകുലപ്പെടുക’ എന്നീ സാധ്യതകൾക്കിടയിലെ അർഥവ്യാപ്തി കഴിയുന്നത്ര നിലനിർത്തുന്നു; വികാരത്തെ ‘ദുഃഖം’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἕως ὅτου
  choice: വരെ
  rationale: പ്രസ്തുത അവസ്ഥയുടെ സമയപരമായ അവസാനബിന്ദു ലളിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: τελεσθῇ
  choice: പൂർത്തിയാകുന്നതുവരെ
  rationale: τελέω എന്ന പദത്തിന്റെ പൂർത്തീകരണഭാവം നൽകുന്നു; യോഹന്നാൻ 19:30-ലെ പ്രത്യേക പദപ്രയോഗം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുകയോ ‘നിറവേറുക’ എന്ന വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കുകയോ ചെയ്യുന്നില്ല.
theological_decisions:
- issue: ‘സ്നാനം’ എന്നതിന്റെ രൂപകാലങ്കാരപരമായ സൂചന
  choice: യേശുവിന്റെ വരാനിരിക്കുന്ന കഷ്ടാനുഭവത്തെയും മരണത്തെയും സൂചിപ്പിക്കുന്ന രൂപകമായി മനസ്സിലാക്കുന്നു; എന്നാൽ പരിഭാഷയിൽ ‘സ്നാനം’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു.
  alternative: പൊതുവായ അതികഠിന പരീക്ഷണമെന്നോ അക്ഷരാർഥത്തിലുള്ള ജലസ്നാനമെന്നോ വായിക്കാം.
  rationale: സമീപസന്ദർഭം യേശുവിന്റെ വരാനിരിക്കുന്ന പീഡാനുഭവത്തിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. എന്നിരുന്നാലും, മുഖ്യവാക്യത്തിൽ അതിനെ നേരിട്ട് ‘കഷ്ടം’ അല്ലെങ്കിൽ ‘മരണം’ എന്നു മാറ്റുന്നത് മൂലത്തിലെ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്നാനം’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തി; ‘ഏൽക്കാനുണ്ട്’ എന്നത് മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ഉപയോഗിച്ചു. ‘ഞെരുക്കത്തിലാണ്’ എന്ന പ്രയോഗം മാനസിക വ്യാകുലതയും നിയന്ത്രിക്കപ്പെട്ട/സമ്മർദത്തിലായ അവസ്ഥയും തമ്മിലുള്ള ഗ്രീക്ക് പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
