id: LUK.12.59
reference: Luke 12:59
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ⸂καὶ τὸ⸃ ἔσχατον λεπτὸν ἀποδῷς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: ml
  text: 'ഞാൻ നിന്നോടു പറയുന്നു: അവസാനത്തെ ലെപ്തോൻപോലും കൊടുത്തുതീർക്കുന്നതുവരെ നീ അവിടെനിന്ന് തീർച്ചയായും പുറത്തുവരുകയില്ല.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω σοι
  choice: ഞാൻ നിന്നോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയുടെ വർത്തമാനകാല ഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: നീ ... ഒരിക്കലും പുറത്തുവരികയില്ല
  rationale: οὐ μήയും aorist subjunctive-ഉം ചേർന്നുള്ള ശക്തമായ ഭാവിനിഷേധം ‘ഒരിക്കലും ... ഇല്ല’ എന്ന പ്രയോഗം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: സ്ഥലത്തിൽനിന്നുള്ള പുറപ്പെടലിനെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: ἕως
  choice: വരെ
  rationale: നിഷേധിക്കപ്പെട്ട അവസ്ഥ നിലനിൽക്കുന്ന സമയപരിധി അടയാളപ്പെടുത്തുന്നു.
- source_word: καὶ τὸ ἔσχατον
  choice: അവസാനത്തെ ... പോലും
  rationale: καίയുടെ ഊന്നൽ ‘പോലും’ എന്നും ἔσχατον എന്നതിന്റെ അന്തിമത്വം ‘അവസാനത്തെ’ എന്നും പകർത്തുന്നു.
- source_word: λεπτόν
  choice: ലെപ്തോൻ
  rationale: പുരാതന നാണയത്തിന്റെ ചരിത്രപരമായ പ്രത്യേകത ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു; അർത്ഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: ἀποδῷς
  choice: കൊടുത്തുതീർക്കുക
  rationale: കടം/നിയമസന്ദർഭത്തിലെ അടച്ചുകൊടുക്കലും അത് പൂർണമായി നിർവഹിക്കുന്നതും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: വചനത്തിലെ കടം-തടവ് ദൃശ്യത്തിന്റെ സ്വഭാവം
  choice: കടം പൂർണമായി കൊടുത്തുതീർക്കുന്നതുവരെ തടവിൽനിന്ന് പുറത്തുവരാനാകില്ലെന്ന ദൃശ്യം വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി.
  alternative: ഇത് ഭൗമിക നിയമപരിണതിയെയോ ദൈവിക ന്യായവിധിയെയോ ശുദ്ധീകരണസ്ഥലത്തെക്കുറിച്ചുള്ള പിൽക്കാല വ്യാഖ്യാനത്തെയോ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുക.
  rationale: വചനം ഈ ദൃശ്യത്തിന്റെ കൃത്യമായ സൂചിതാർത്ഥം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർത്ഥസാധ്യതകളും പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഏകവചന അഭിസംബോധന ഉപയോഗിച്ചു. ചരിത്രനാണയത്തിന്റെ പേര് ‘ലെപ്തോൻ’ എന്നു നിലനിർത്തുകയും സാധാരണ വായനക്കാർക്കായി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്തു.
