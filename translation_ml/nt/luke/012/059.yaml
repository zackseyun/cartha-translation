revisions:
- from: 'ഞാൻ നിന്നോടു പറയുന്നു: അവസാനത്തെ ലെപ്തോൻപോലും[a] കൊടുത്തുതീർക്കുന്നതുവരെ നീ അവിടെനിന്ന് ഒരിക്കലും പുറത്തുവരികയില്ല.'
  to: 'ഞാൻ നിന്നോടു പറയുന്നു: അവസാനത്തെ ലെപ്തോൻപോലും കൊടുത്തുതീർക്കുന്നതുവരെ നീ അവിടെനിന്ന് തീർച്ചയായും പുറത്തുവരുകയില്ല.'
  rationale: The sole revision replaces an idiom that can imply permanent impossibility with wording that expresses the Greek’s emphatic denial of release before full payment. The debt-prison image and its unresolved possible referent remain unaltered.
