id: LUK.12.18
reference: Luke 12:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ ഇങ്ങനെ ചെയ്യും: എന്റെ കളപ്പുരകൾ[a] പൊളിച്ചുമാറ്റി അവയെക്കാൾ വലിയ കളപ്പുരകൾ പണിയും. അവിടെ ധാന്യമെല്ലാം എന്റെ വസ്തുവകകളെല്ലാം[b] ശേഖരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സംഭരണശാലകൾ” (ἀποθήκας).
    reason: lexical_alternative
  - marker: b
    text: “ധാന്യം” (σῖτος) ചില സന്ദർഭങ്ങളിൽ കൂടുതൽ പ്രത്യേകമായി “ഗോതമ്പ്” എന്നു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: ഞാൻ ഇങ്ങനെ ചെയ്യും
  rationale: τοῦτο എന്നതിന്റെ മുൻനിറുത്തിയ ഊന്നലും ഭാവിയിൽ ചെയ്യാനിരിക്കുന്ന കാര്യത്തെക്കുറിച്ചുള്ള പ്രഖ്യാപനവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καθελῶ
  choice: പൊളിച്ചുമാറ്റി
  rationale: നിലവിലുള്ള കെട്ടിടങ്ങൾ നീക്കംചെയ്യുന്നതിനുള്ള വ്യക്തവും മൂർത്തവുമായ ഭാവിക്രിയയെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀποθήκας
  choice: കളപ്പുരകൾ
  rationale: കാർഷികസന്ദർഭത്തിൽ ധാന്യം സൂക്ഷിക്കുന്ന കെട്ടിടങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം; മൂലപദത്തിന് പൊതുവേ സംഭരണശാലകൾ എന്നും അർഥമാകാം.
- source_word: μείζονας οἰκοδομήσω
  choice: അതിലും വലിയവ പണിയും
  rationale: താരതമ്യാർഥം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സൂചിതമായ ‘കളപ്പുരകൾ’ എന്ന നാമം ‘വലിയവ’ എന്നതിലൂടെ പൂരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: συνάξω ἐκεῖ
  choice: അവിടെ … ശേഖരിക്കും
  rationale: συνάγω എന്നതിന്റെ അടിസ്ഥാനമായ ഒരുമിച്ചുകൂട്ടുക എന്ന അർഥവും ἐκεῖ സൂചിപ്പിക്കുന്ന സ്ഥലവും നിലനിർത്തുന്നു; ‘സംഭരിക്കും’ എന്നത് കൂടുതൽ സന്ദർഭവ്യാഖ്യാനപരമാണ്.
- source_word: πάντα τὸν σῖτον
  choice: ധാന്യമെല്ലാം
  rationale: σῖτος ധാന്യത്തെ, ചില സന്ദർഭങ്ങളിൽ പ്രത്യേകിച്ച് ഗോതമ്പിനെ, സൂചിപ്പിക്കാം. ഗ്രീക്കിൽ ഇവിടെ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ മലയാളത്തിലും ‘എന്റെ’ എന്ന് ചേർത്തിട്ടില്ല.
- source_word: τὰ ἀγαθά μου
  choice: എന്റെ വസ്തുവകകളെല്ലാം
  rationale: പണത്തിലേക്ക് മാത്രം ചുരുക്കാതെ സംസാരിക്കുന്നവന്റെ ഭൗതികസ്വത്തുക്കളെ വ്യാപകമായി സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ഉദ്ധരണിക്കുള്ളിൽ കർഷകന്റെ ദൃഢമായ ഭാവിപദ്ധതി ചെറുതും നേരിട്ടുമായ വാക്യങ്ങളിലൂടെ നിലനിർത്തി. ഗ്രീക്ക് പദക്രമത്തിന്റെ അസ്വാഭാവികത പകർത്താതെ അതിലെ ഊന്നലും ആവർത്തിച്ച ഭാവിക്രിയകളും സംരക്ഷിച്ചു.
