id: LUK.12.47
reference: Luke 12:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: ml
  text: എന്നാൽ, തന്റെ യജമാനന്റെ ഇഷ്ടം അറിഞ്ഞിട്ടും ഒരുങ്ങുകയോ അവന്റെ ഇഷ്ടപ്രകാരം പ്രവർത്തിക്കുകയോ ചെയ്യാത്ത ആ അടിമയ്ക്ക് അനേകം അടിയേൽക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, “പല പ്രാവശ്യം അടിക്കപ്പെടും” അല്ലെങ്കിൽ “അനേകം അടികൾ ലഭിക്കും.” ഗ്രീക്കിൽ “അടികൾ” എന്ന നാമം നേരിട്ട് നൽകിയിട്ടില്ല; അത് സൂചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: അടിമ
  rationale: കൂലിക്കാരനായ ദാസനെയല്ല, യജമാനന്റെ അധികാരത്തിൻകീഴിലുള്ള ബന്ധിതനായ കീഴാളനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ഉപമയിലെ അധികാര-ശിക്ഷാ പശ്ചാത്തലവും ‘അടിമ’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു.
- source_word: γνοὺς
  choice: അറിഞ്ഞിട്ടും
  rationale: യജമാനന്റെ ഇഷ്ടത്തെക്കുറിച്ചുള്ള മുൻകൂട്ടിയുള്ള അറിവും, അതിന് വിരുദ്ധമായി പ്രവർത്തിച്ചതിലെ ഉത്തരവാദിത്വവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: θέλημα
  choice: ഇഷ്ടം
  rationale: ഇവിടെ യജമാനൻ ആഗ്രഹിക്കുന്നതും നിർദേശിക്കുന്നതുമായ കാര്യത്തെ സൂചിപ്പിക്കാൻ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ പദമാണ്.
- source_word: κυρίου αὐτοῦ
  choice: തന്റെ യജമാനന്റെ
  rationale: ഉപമയിലെ ഗൃഹാധികാരബന്ധമാണ് ഇവിടെ നേരിട്ട് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ദൈവിക സ്ഥാനനാമമായി തെറ്റിദ്ധരിക്കാവുന്ന ‘കർത്താവ്’ എന്നതിനെക്കാൾ ‘യജമാനൻ’ യോജിക്കുന്നു.
- source_word: ἑτοιμάσας
  choice: ഒരുങ്ങുക
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല; അതുപോലെ മലയാളത്തിലും എന്തിനുവേണ്ടിയെന്ന് കൂട്ടിച്ചേർക്കാതെ പ്രവർത്തനസജ്ജതയെ സൂചിപ്പിക്കുന്നു.
- source_word: ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: അവന്റെ ഇഷ്ടപ്രകാരം പ്രവർത്തിക്കുക
  rationale: ποιέω + πρός എന്ന പ്രയോഗത്തിന്റെ ‘ഇഷ്ടത്തിന് അനുസൃതമായി ചെയ്യുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δαρήσεται πολλάς
  choice: അനേകം അടിയേൽക്കും
  rationale: ഭാവികാല കർമണിപ്രയോഗത്തെയും, ഗ്രീക്കിൽ നാമം ലോപിച്ചിരിക്കുന്ന πολλάς എന്ന ബഹുവചന വിശേഷണത്തിൽ സൂചിതമായ ആവർത്തിച്ചുള്ള അടികളെയും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിന്റെ നേരിട്ടുള്ള രംഗം അടിമയും അവന്റെ ഗൃഹനാഥനും തമ്മിലുള്ള ബന്ധമാണ്. ‘യജമാനൻ’ ആ സാമൂഹികബന്ധം വ്യക്തമാക്കുന്നു; അതേസമയം ഉപമയുടെ വിശാലമായ ദൈവശാസ്ത്രപരമായ സൂചനയെ നിഷേധിക്കുന്നില്ല.
- issue: πολλάς എന്ന ശിക്ഷാതീവ്രതാ പ്രയോഗം
  choice: അനേകം അടിയേൽക്കും
  alternative: കഠിനമായി അടിക്കപ്പെടും / പല പ്രാവശ്യം അടിക്കപ്പെടും
  rationale: ഗ്രീക്ക് ഒരു നാമം സൂചിതമായി വിടുന്നു. ‘അനേകം അടി’ എന്നത് ശിക്ഷയുടെ മൂർത്തവും ആവർത്തിതവുമായ ചിത്രം നിലനിർത്തുന്നു; ‘കഠിനമായി’ എന്നത് എണ്ണം എന്ന ഘടകത്തെ വ്യാഖ്യാനിച്ച് മാറ്റും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അടിമ’, ‘യജമാനൻ’ എന്നിവ ഉപമയിലെ അധികാരബന്ധം തുറന്നുകാട്ടുന്നു. ഗ്രീക്കിലെ സൂചിതനാമവും ശിക്ഷയുടെ മൂർത്തതയും പ്രധാനവാക്യത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
