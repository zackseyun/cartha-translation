  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: ml
  text: 'അപ്പോൾ ജനക്കൂട്ടത്തിൽനിന്ന് ഒരാൾ അവനോടു പറഞ്ഞു: “ഗുരുവേ, പൈതൃകസ്വത്ത് എന്നോടുകൂടെ പങ്കിടാൻ എന്റെ സഹോദരനോടു പറയണമേ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പൈതൃകസ്വത്ത് എന്നോടുകൂടെ വിഭജിക്കാൻ” അല്ലെങ്കിൽ “പൈതൃകസ്വത്തിൽ എന്നോടൊപ്പം ഓഹരിയിടാൻ.”
    reason: μερίσασθαι μετ’ ἐμοῦ എന്ന പ്രയോഗം പൈതൃകസ്വത്ത് അപേക്ഷകനോടുകൂടെ വിഭജിക്കുകയോ ഓഹരികളായി പങ്കിടുകയോ ചെയ്യുക എന്ന അർഥം നൽകുന്നു.
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: δέ മൃദുവായ ആഖ്യാനബന്ധകമാണ്; ‘അപ്പോൾ’ സ്വാഭാവികമായ കഥാപുരോഗതി സൂചിപ്പിക്കുന്നു, അനാവശ്യമായ വൈരുധ്യം ചേർക്കുന്നില്ല.
- source_word: τις ἐκ τοῦ ὄχλου
  choice: ജനക്കൂട്ടത്തിൽനിന്ന് ഒരാൾ
  rationale: അജ്ഞാതനായ ഒരു വ്യക്തിയെ ജനക്കൂട്ടത്തിലെ അംഗമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന ദത്തിവ് പരോക്ഷകർമ്മം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: പഠിപ്പിക്കുന്നവനെ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്ന സമകാലികവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: εἰπὲ τῷ ἀδελφῷ μου
  choice: എന്റെ സഹോദരനോടു പറയണമേ
  rationale: ആജ്ഞാരൂപത്തെ ഇവിടെ യേശുവിനോടുള്ള ആദരപൂർവമായ അഭ്യർഥനയായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μερίσασθαι μετ’ ἐμοῦ
  choice: എന്നോടുകൂടെ പങ്കിടാൻ
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ക്രിയയുടെ പങ്കുവെക്കുക/വിഭജിക്കുക എന്ന അർഥവും μετάയുടെ സഹപങ്കാളിത്തഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: τὴν κληρονομίαν
  choice: പൈതൃകസ്വത്ത്
  rationale: അവകാശമായി ലഭിക്കുന്ന സ്വത്തിനെ സാധാരണ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; നിയമസ്ഥിതി അമിതമായി നിർവചിക്കുന്നില്ല.
