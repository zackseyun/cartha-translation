id: LUK.12.7
reference: Luke 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ തലയിലെ ഓരോ മുടിയിഴയുംപോലും എണ്ണപ്പെട്ടിരിക്കുന്നു.[a] ഭയപ്പെടേണ്ട; അനേകം കുരുവികളെക്കാൾ നിങ്ങൾ വിലയേറിയവരാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ തലയിലെ മുടിയിഴകൾ ഒന്നൊഴിയാതെ എണ്ണപ്പെട്ടിരിക്കുന്നു.’
    reason: πᾶσαιയുടെ സമഗ്രതയും ἠρίθμηνται എന്ന പൂർണകാല കർമണിപ്രയോഗത്തിന്റെ ഫലനിലയും കൂടുതൽ വ്യക്തമായി പ്രകടമാക്കുന്ന ഭാഷാന്തരവികൽപം.
  - marker: b
    text: അഥവാ, ‘അനേകം കുരുവികളെക്കാൾ നിങ്ങൾ കൂടുതൽ മൂല്യമുള്ളവരാണ്.’
    reason: διαφέρετε എന്ന പദം ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്ന താരതമ്യ മൂല്യത്തിന്റെ മറ്റൊരു സ്വാഭാവിക ഭാഷാന്തരം.
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: എന്നാൽ … പോലും
  rationale: ἀλλά സൂചിപ്പിക്കുന്ന മുൻചിന്തയോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ടും καί നൽകുന്ന ഊന്നൽ ‘പോലും’ കൊണ്ടും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν
  choice: നിങ്ങളുടെ തലയിലെ മുടിയിഴകൾ
  rationale: മൂലത്തിലെ സാക്ഷാത് ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: πᾶσαι
  choice: എല്ലാം
  rationale: ഓരോ മുടിയിഴയും ഉൾപ്പെടുന്നു എന്ന സമഗ്രത ലളിതമായി സംരക്ഷിക്കുന്നു.
- source_word: ἠρίθμηνται
  choice: എണ്ണപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണകാല കർമണിപ്രയോഗത്തിലെ പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലവും ഈ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: μὴ φοβεῖσθε
  choice: ഭയപ്പെടേണ്ട
  rationale: നിഷേധാത്മക കല്പനയെ ചുരുക്കവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ബഹുവചന അഭിസംബോധന ‘നിങ്ങൾ’ വ്യക്തമാക്കുന്നു.
- source_word: πολλῶν στρουθίων
  choice: അനേകം കുരുവികളെക്കാൾ
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭത്തിലെ അതേ പക്ഷിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുരുവികൾ’ നിലനിർത്തുന്നു.
- source_word: διαφέρετε
  choice: നിങ്ങൾ വിലയേറിയവരാണ്
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ സൂചിപ്പിക്കുന്ന താരതമ്യ മൂല്യം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘-യെക്കാൾ’ താരതമ്യം വാക്യത്തിൽ നിലനിർത്തിയിട്ടുണ്ട്.
theological_decisions:
- issue: മനുഷ്യരുടെ മൂല്യവും കുരുവികളുടെ മൂല്യവും തമ്മിലുള്ള താരതമ്യം
  choice: അനേകം കുരുവികളെക്കാൾ നിങ്ങൾ വിലയേറിയവരാണ്
  alternative: അനേകം കുരുവികളെക്കാൾ നിങ്ങൾ ശ്രേഷ്ഠരാണ്
  rationale: ചെറിയ പക്ഷികളോടുപോലുമുള്ള ദൈവത്തിന്റെ കരുതലിൽനിന്ന് ശിഷ്യരോടുള്ള കൂടുതലായ കരുതലിലേക്കുള്ള വാദം പ്രകടമാക്കുന്നു. ‘വിലയേറിയവർ’ സന്ദർഭത്തിലെ താരതമ്യ മൂല്യം അറിയിക്കുന്നു; മനുഷ്യസ്വഭാവത്തെക്കുറിച്ചുള്ള പാഠാതീതമായ സിദ്ധാന്തം ചേർക്കുന്നില്ല.
- issue: മുടിയിഴകൾ എണ്ണപ്പെട്ടിരിക്കുന്നു എന്ന കർമണിപ്രയോഗത്തിലെ പ്രവർത്താവ്
  choice: പ്രവർത്താവായി ദൈവത്തെ വാക്യത്തിൽ ചേർക്കാതെ കർമണിപ്രയോഗം നിലനിർത്തി
  alternative: ദൈവം നിങ്ങളുടെ മുടിയിഴകളെല്ലാം എണ്ണിയിരിക്കുന്നു
  rationale: സന്ദർഭം ദൈവിക അറിവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് വാക്യം പ്രവർത്താവിനെ പേരെടുത്തു പറയുന്നില്ല; അതിനാൽ മൂലത്തിലെ പരോക്ഷത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘മുടിയിഴകൾപോലും’ എന്നത് ആശ്വാസവചനത്തിലെ ഊന്നലും ‘എണ്ണപ്പെട്ടിരിക്കുന്നു’ എന്നത് മൂലത്തിലെ കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു. ‘നിങ്ങൾ’ സന്ദർഭാനുസൃതമായി ശിഷ്യസമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്നു.
