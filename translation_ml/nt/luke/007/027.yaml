  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: ml
  text: 'ഇവനാണ്, ആരെക്കുറിച്ച് ഇപ്രകാരം എഴുതപ്പെട്ടിരിക്കുന്നു: “ഇതാ, ഞാൻ എന്റെ ദൂതനെ[a] നിന്റെ മുഖത്തിനു മുമ്പിൽ[b] അയയ്ക്കുന്നു; അവൻ നിന്റെ വഴി നിനക്കു മുമ്പിൽ ഒരുക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൂതൻ’ എന്നത് ‘മാലാഖ’ എന്നും വിവർത്തനം ചെയ്യാം; എന്നാൽ ഇവിടെ മനുഷ്യനായ സന്ദേശവാഹകനെയാണ്, അതായത് യോഹന്നാനെയാണ്, സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ സ്വാഭാവികമായി: ‘നിനക്കു മുമ്പായി.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘നിന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν περὶ οὗ γέγραπται
  choice: എന്ന് ആരെക്കുറിച്ച് എഴുതിയിരിക്കുന്നുവോ, അവൻ ഇവനാണ്
  rationale: ഗ്രീക്കിലെ ഊന്നൽ നിറഞ്ഞ നിർദേശകപ്രയോഗവും തിരുവെഴുത്ത് ഉദ്ധരണിസൂത്രവും സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രവാചകീയ ഉദ്ധരണിയുടെ ഗൗരവവും ഉയർന്ന ശൈലിയും കാത്തുസൂക്ഷിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സുപരിചിതമായ പ്രയോഗം.
- source_word: ἀποστέλλω
  choice: അയയ്ക്കുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ സജീവതയും പ്രവാചകീയ ഉറപ്പും ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄγγελόν
  choice: ദൂതനെ
  rationale: ἄγγελος എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥമായ സന്ദേശവാഹകനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ പരാമർശം മനുഷ്യനായ യോഹന്നാനെക്കുറിച്ചായതിനാൽ ‘ദൂതൻ’ അനുയോജ്യമാണ്, എന്നാൽ ‘ദൈവദൂതൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- source_word: πρὸ προσώπου σου
  choice: നിന്റെ മുഖത്തിനു മുമ്പായി
  rationale: ഗ്രീക്കിലെ മൂർത്തമായ ‘മുഖം’ എന്ന ദൃശ്യരൂപവും പഴയനിയമ ഉദ്ധരണിയുടെ സ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: κατασκευάσει
  choice: ഒരുക്കും
  rationale: വഴി മുൻകൂട്ടി സജ്ജമാക്കുക എന്ന ഭാവികാല പ്രവർത്തനം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὴν ὁδόν σου
  choice: നിന്റെ വഴി
  rationale: പ്രവാചകീയവും രൂപകപരവുമായ പ്രയോഗത്തിന് അനുയോജ്യമായ മലയാള സമാനപദം.
- source_word: ἔμπροσθέν σου
  choice: നിനക്കു മുമ്പിൽ
  rationale: അവസാന സ്ഥാനസൂചക പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും മുൻപുള്ള ‘നിന്റെ മുഖത്തിനു മുമ്പായി’ എന്ന മൂർത്തപ്രയോഗത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മലാഖി/പുറപ്പാട് ഭാഷയിലുള്ള ഉദ്ധരണി യോഹന്നാനിൽ പ്രയോഗിക്കപ്പെടുകയും രണ്ടാംപുരുഷ സർവനാമങ്ങളിലൂടെ യേശുവുമായി ബന്ധിപ്പിക്കപ്പെടുകയും ചെയ്യുന്നത്
  choice: ‘നിന്റെ മുഖം,’ ‘നിന്റെ വഴി,’ ‘നിനക്കു മുമ്പിൽ’ എന്നീ രണ്ടാംപുരുഷ രൂപങ്ങൾ വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: ദൂതൻ കർത്താവിന്റെയോ മിശിഹായുടെയോ വഴി ഒരുക്കുന്നു എന്ന് വ്യക്തമായി ചേർത്ത് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് വാക്യം നൽകുന്ന ശക്തമായ ദൈവശാസ്ത്രബന്ധം അതിന്റെ സർവനാമങ്ങളിലൂടെ തന്നെ നിലനിൽക്കുന്നു; വിശദീകരണം ചേർക്കാതെ അതിലെ പിരിമുറുക്കവും സൂചനയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ഗൗരവമുള്ള തിരുവെഴുത്ത്-ഉദ്ധരണിശൈലി നിലനിർത്തിക്കൊണ്ട് സാധാരണ ആധുനിക മലയാളവായനക്കാർക്ക് മനസ്സിലാകുന്ന വാക്യഘടന ഉപയോഗിച്ചു. ഉദ്ധരണിയെ ആദ്യം വെച്ചത് മലയാളത്തിൽ ‘ആരെക്കുറിച്ച്… അവൻ ഇവനാണ്’ എന്ന ഊന്നൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാനാണ്.
