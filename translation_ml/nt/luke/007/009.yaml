- from: 'യേശു ഇതു കേട്ടപ്പോൾ, അവനെക്കുറിച്ച് അത്ഭുതപ്പെട്ടു. പിന്നെ തന്നെ അനുഗമിച്ചിരുന്ന ജനക്കൂട്ടത്തിന്റെ നേരെ തിരിഞ്ഞ് പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇസ്രായേലിൽപ്പോലും ഇത്ര വലിയ വിശ്വാസം[a][b] ഞാൻ കണ്ടിട്ടില്ല.”'
  to: 'യേശു ഇതു കേട്ടപ്പോൾ, അവനെക്കുറിച്ച് അത്ഭുതപ്പെട്ടു. പിന്നെ തന്നെ അനുഗമിച്ചുകൊണ്ടിരുന്ന ജനക്കൂട്ടത്തോടു തിരിഞ്ഞ് അവരോടു പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇസ്രായേലിൽപ്പോലും ഇത്ര വലിയ വിശ്വാസം[a][b] ഞാൻ കണ്ടിട്ടില്ല.”'
  rationale: തിരുത്തൽ ഉറവിടത്തിന്റെ അർഥം മാറ്റുന്നില്ല. ജനക്കൂട്ടത്തെ അഭിസംബോധന ചെയ്യുന്ന ദത്തിവ് ബന്ധവും അവരെ പിന്തുടരുന്നതിന്റെ തുടരുന്ന ഭാവവും കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിച്ചു. πίστις-ന്റെ മുഖ്യപരിഭാഷയായ ‘വിശ്വാസം’ നിലനിർത്തി, ബദൽ അടിക്കുറിപ്പിനെ സ്വാഭാവിക മലയാളത്തിലാക്കി. രണ്ടു അടിക്കുറിപ്പുകളും അവ പ്രസക്തമാകുന്ന ‘വിശ്വാസം’ എന്ന പദസമുച്ചയത്തിൽ തന്നെയാണ് നങ്കൂരമിട്ടിരിക്കുന്നത്.
