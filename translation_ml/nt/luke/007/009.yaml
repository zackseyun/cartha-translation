id: LUK.7.9
reference: Luke 7:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: ml
  text: 'യേശു ഇതു കേട്ടപ്പോൾ, അവനെക്കുറിച്ച് അത്ഭുതപ്പെട്ടു. പിന്നെ തന്നെ അനുഗമിച്ചുകൊണ്ടിരുന്ന ജനക്കൂട്ടത്തോടു തിരിഞ്ഞ് അവരോടു പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇസ്രായേലിൽപ്പോലും ഇത്ര വലിയ വിശ്വാസം[a][b] ഞാൻ കണ്ടിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇങ്ങനെയുള്ള വിശ്വാസം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വിശ്വാസപൂർവമായ ആശ്രയം”; ഗ്രീക്കിലെ ഇതേ പദം പലപ്പോഴും “വിശ്വാസം” എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: യേശു ഇതു കേട്ടപ്പോൾ
  rationale: Aorist participle main verb-നു മുമ്പുള്ള സാഹചര്യം സൂചിപ്പിക്കുന്നു. Malayalam-ൽ ‘കേട്ടപ്പോൾ’ സ്വാഭാവികമായി സമയബന്ധം നിലനിർത്തുന്നു; δέ-യുടെ മൃദുവായ ആഖ്യാനമാറ്റം പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല. ταῦτα വ്യാകരണപരമായി ബഹുവചനമാണെങ്കിലും മുൻപറഞ്ഞ വാക്കുകളെ ഒന്നായി സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗത്തിൽ ‘ഇതു’ സ്വാഭാവികമാണ്.
- source_word: ἐθαύμασεν αὐτόν
  choice: അവനെക്കുറിച്ച് അത്ഭുതപ്പെട്ടു
  rationale: θαυμάζω യഥാർഥമായ വിസ്മയം/അത്ഭുതം പ്രകടിപ്പിക്കുന്നു. αὐτόν ശതാധിപനെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദേശവാഹകരിലൂടെ അവന്റെ വാക്കുകൾ കേട്ട സാഹചര്യത്തിൽ ‘അവനെക്കുറിച്ച്’ എന്നത് ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: പിന്നെ തന്നെ അനുഗമിച്ചിരുന്ന ജനക്കൂട്ടത്തിന്റെ നേരെ തിരിഞ്ഞ്
  rationale: στραφεὶς-ന്റെ അനുബന്ധപ്രവർത്തനം ‘തിരിഞ്ഞ്’ എന്നു നൽകുന്നു. ἀκολουθοῦντι തുടരുന്ന അനുഗമനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അനുഗമിച്ചിരുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പ്രസ്താവനയുടെ ഊന്നലും നിലനിർത്തുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: ഇസ്രായേലിൽപ്പോലും
  rationale: οὐδέ-യുടെ ‘not even’ എന്ന ഊന്നൽ ‘-ൽപ്പോലും’ വഴി കൃത്യമായി നിലനിർത്തുന്നു; ‘ഇസ്രായേൽ’ ഇവിടെ ജനസമൂഹത്തെയും അവരുടെ ഇടയെയും സൂചിപ്പിക്കാവുന്ന ഉറവിടത്തിലെ പ്രയോഗം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: τοσαύτην πίστιν
  choice: ഇത്ര വലിയ വിശ്വാസം
  rationale: τοσαύτην വിശ്വാസത്തിന്റെ അളവ്/മഹത്ത്വം ഊന്നുന്നു. ‘ഇത്ര വലിയ വിശ്വാസം’ ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൂടുതൽ സംക്ഷിപ്തമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: εὗρον
  choice: ഞാൻ കണ്ടിട്ടില്ല
  rationale: Greek aorist-നെ നിഷേധത്തോടുകൂടിയ അനുഭവപ്രസ്താവനയായി മലയാളത്തിൽ ‘കണ്ടിട്ടില്ല’ എന്നു നൽകുന്നത് ഇതുവരെയുള്ള അനുഭവത്തിന്റെ ബലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: ആശ്രയം
  rationale: ഇവിടെ ശതാധിപന് യേശുവിന്റെ അധികാരത്തിലുള്ള ഉറച്ച വിശ്വാസമാണ് മുഖ്യം. ‘വിശ്വാസം’ πίστις-ന്റെ സാധാരണവും ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമായ പരിഭാഷയാണ്; ‘ആശ്രയം’ സന്ദർഭത്തിലെ ആത്മവിശ്വാസഭാവം വ്യക്തമാക്കുന്ന സാധ്യതയായി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ആഖ്യാനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനനുസരിച്ച് ക്രമീകരിച്ചെങ്കിലും ഉറവിടത്തിലെ സമയബന്ധം, വിസ്മയം, ജനക്കൂട്ടത്തോടുള്ള തിരിഞ്ഞുള്ള പ്രസ്താവന, ‘ഇസ്രായേലിൽപ്പോലും’ എന്ന ഊന്നൽ എന്നിവ സംരക്ഷിച്ചിരിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അർഥപരമായി തെറ്റായ സ്ഥാനങ്ങളിലായിരുന്നതിനാൽ, അവ രണ്ടും ബന്ധപ്പെട്ട πίστις/τοσαύτην പദസമുച്ചയത്തോടു ചേർത്തു.
