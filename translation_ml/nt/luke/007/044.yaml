id: LUK.7.44
reference: Luke 7:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: ml
  text: 'പിന്നെ സ്ത്രീയുടെ നേരെ തിരിഞ്ഞ് അവൻ ശിമോനോടു പറഞ്ഞു: “ഈ സ്ത്രീയെ കാണുന്നുവോ? ഞാൻ നിന്റെ വീട്ടിൽ പ്രവേശിച്ചു; എന്റെ കാലുകൾക്കായി നീ വെള്ളം തന്നില്ല[a]. എന്നാൽ ഇവൾ തന്റെ കണ്ണുനീർകൊണ്ട് എന്റെ കാലുകൾ നനച്ച്, തന്റെ തലമുടികൊണ്ട് അവ തുടച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “എന്റെ കാലുകളിൽ നീ വെള്ളം തന്നില്ല.” കാലുകൾ കഴുകാൻ വെള്ളം നൽകുന്ന പതിവിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.'
    reason: ἐπὶ πόδας എന്ന പ്രയോഗത്തിന്റെ കൂടുതൽ പദാനുസൃത രൂപവും അതിന്റെ സാംസ്കാരിക അർഥവും വ്യക്തമാക്കുന്നു; പ്രധാനവാചകത്തിൽ ‘കഴുകാൻ’ എന്ന് കൂട്ടിച്ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: സ്ത്രീയുടെ നേരെ തിരിഞ്ഞ്
  rationale: സ്ത്രീയിലേക്കുള്ള യേശുവിന്റെ ശാരീരികമായ തിരിയൽ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മുൻക്രിയ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് കൃദന്തരൂപത്തിന്റെ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: τῷ Σίμωνι ἔφη
  choice: അവൻ ശിമോനോടു പറഞ്ഞു
  rationale: ഗ്രീക്ക് ആഖ്യാനത്തിലെ സ്വാഭാവിക അർഥം ആധുനിക മലയാളത്തിലെ ലളിതമായ ഭൂതകാലപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: ഈ സ്ത്രീയെ കാണുന്നുവോ?
  rationale: വർത്തമാനകാലത്തിലെ നേരിട്ടുള്ള ചോദ്യവും ‘ഈ’ എന്ന സൂചകപദം സൃഷ്ടിക്കുന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: ഞാൻ നിന്റെ വീട്ടിൽ കടന്നുവന്നു
  rationale: οἰκίαയെ സാധാരണവും കൃത്യവുമായ ‘വീട്’ എന്നും εἰσῆλθονനെ സന്ദർഭോചിതമായി ‘കടന്നുവന്നു’ എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: എന്റെ കാലുകൾക്കായി നീ വെള്ളം തന്നില്ല
  rationale: വെള്ളം നൽകാത്തതെന്ന ഗ്രീക്ക് വാചകത്തിന്റെ നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തുന്നു; കഴുകൽ എന്ന പ്രവൃത്തി മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ പ്രധാനവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: αὕτη δὲ
  choice: എന്നാൽ ഇവൾ
  rationale: ശിമോന്റെ ആതിഥ്യമര്യാദയും സ്ത്രീയുടെ പ്രവൃത്തിയും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം പ്രകടമാക്കുന്നു.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: തന്റെ കണ്ണുനീർകൊണ്ട് എന്റെ കാലുകൾ നനച്ച്
  rationale: δάκρυσιν എന്ന കരണാർഥക ദത്തിവിനെ ‘കണ്ണുനീർകൊണ്ട്’ എന്നും βρέχωയെ അതിശയോക്തിയില്ലാതെ ‘നനച്ച്’ എന്നും നൽകുന്നു.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: തന്റെ തലമുടികൊണ്ട് അവ തുടച്ചു
  rationale: മലയാളത്തിൽ ‘മുടി’ എന്നതിനെക്കാൾ ‘തലമുടി’ ഇവിടെ കൂടുതൽ സ്വാഭാവികവും അവ്യക്തത കുറഞ്ഞതുമാണ്; ‘അവ’ മുൻപറഞ്ഞ കാലുകളെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ശിമോനോടു’ പോലുള്ള രൂപങ്ങൾ ഔപചാരികതയും സാധാരണ വായനാസൗകര്യവും തമ്മിൽ സമതുലിതമാക്കുന്നു. ഗ്രീക്കിലെ വൈരുധ്യം ‘എന്നാൽ ഇവൾ’ എന്നതിലൂടെ വ്യക്തമായി നിലനിർത്തി.
