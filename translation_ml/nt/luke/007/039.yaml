id: LUK.7.39
reference: Luke 7:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: ml
  text: 'യേശുവിനെ ക്ഷണിച്ച പരീശൻ ഇതു കണ്ടപ്പോൾ[a] മനസ്സിൽ പറഞ്ഞു: “ഇയാൾ ഒരു പ്രവാചകനായിരുന്നെങ്കിൽ, യേശുവിനെ തൊട്ടുകൊണ്ടിരിക്കുന്ന ഈ സ്ത്രീ ആരാണെന്നും എങ്ങനെയുള്ളവളാണെന്നും അറിയുമായിരുന്നു; അവൾ പാപിനിയാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇതു’ എന്നത് തൊട്ടുമുമ്പ് വിവരിച്ച സ്ത്രീയുടെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ പദം ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലെങ്കിലും സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചതാണ്.
    reason: contextual_ellipsis
  - marker: b
    text: 'അഥവാ: “അവൾ പാപിനിയാണെന്ന്.” ഗ്രീക്ക് വാക്യം, അവൻ അറിയേണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കമായോ സ്ത്രീയെക്കുറിച്ചുള്ള അവന്റെ വിലയിരുത്തലിന്റെ കാരണമായോ മനസ്സിലാക്കാം.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: ഇതു കണ്ടപ്പോൾ
  rationale: അഓറിസ്റ്റ് കൃദന്തത്തിന്റെ സാഹചര്യപരവും കാലസൂചകവുമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘ഇതു’ തൊട്ടുമുമ്പുള്ള സ്ത്രീയുടെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സന്ദർഭപൂരകമാണ്. δέയ്ക്ക് ഇവിടെ ശക്തമായ വിരോധമില്ലാത്തതിനാൽ വേറൊരു വ്യവഹാരപദം ചേർത്തിട്ടില്ല.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτὸν
  choice: തന്നെ ക്ഷണിച്ച പരീശൻ
  rationale: വിരുന്നിന്റെ സന്ദർഭത്തിൽ καλέω എന്നത് ‘ക്ഷണിക്കുക’ എന്നാണ്. αὐτόν യേശുവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘തന്നെ’ ഉപവാക്യത്തിലെ കർത്താവിനെയല്ല, മുഖ്യവാക്യത്തിന്റെ കാഴ്ചപ്പാടിൽ ക്ഷണിക്കപ്പെട്ടയാളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: മനസ്സിൽ പറഞ്ഞു
  rationale: ആന്തരിക സംഭാഷണം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ആവർത്തനം കൂടാതെ സ്വാഭാവികമായി പകരുന്നു.
- source_word: Οὗτος
  choice: ഇയാൾ
  rationale: യേശുവിനെ അകലം പാലിച്ചും സംശയത്തോടെയും പരാമർശിക്കുന്ന നിർദേശസർവനാമത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: εἰ ἦν προφήτης, ἐγίνωσκεν ἂν
  choice: ഒരു പ്രവാചകനായിരുന്നെങ്കിൽ ... അറിയുമായിരുന്നു
  rationale: εἰ + അപൂർണഭൂതവും ἄν സഹിതമുള്ള അപൂർണഭൂതവും ചേർന്ന യാഥാർഥ്യവിരുദ്ധമായ നിബന്ധന മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: τίς καὶ ποταπὴ
  choice: ആരാണെന്നും എങ്ങനെയുള്ളവളാണെന്നും
  rationale: സ്ത്രീയുടെ വ്യക്തിത്വത്തെയും സ്വഭാവം/പ്രശസ്തിയെയും കുറിച്ചുള്ള ഇരട്ട ഊന്നൽ രണ്ടും നിലനിർത്തുന്നു.
- source_word: ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ
  choice: തന്നെ തൊട്ടുകൊണ്ടിരിക്കുന്ന ഈ സ്ത്രീ
  rationale: വർത്തമാനകാലത്തിലെ തുടരുന്ന സ്പർശത്തെ ‘തൊട്ടുകൊണ്ടിരിക്കുന്ന’ എന്നു നൽകുന്നു; αὐτοῦ യേശുവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ഉദ്ധരണിക്കുള്ളിൽ ‘തന്നെ’ സ്വാഭാവികമാണ്.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: അവൾ പാപിനിയാണല്ലോ
  rationale: ὅτιയുടെ വിശദീകരണ/കാരണ ഭാവം ‘ആണല്ലോ’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; എന്നാൽ ഉള്ളടക്കവാക്യമായി കേൾക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശു പ്രവാചകനാണോ എന്ന പരീശന്റെ നിബന്ധനയുടെ ഭാവം
  choice: “ഒരു പ്രവാചകനായിരുന്നെങ്കിൽ ... അറിയുമായിരുന്നു” എന്ന യാഥാർഥ്യവിരുദ്ധ നിബന്ധന
  alternative: “ഒരു പ്രവാചകനാണെങ്കിൽ ... അറിയും” എന്ന കൂടുതൽ നിഷ്പക്ഷ നിബന്ധന
  rationale: εἰ ἦν ... ἐγίνωσκεν ἂν എന്ന ഘടന പരീശന്റെ സംശയാത്മകവും യാഥാർഥ്യവിരുദ്ധവുമായ അനുമാനം സൂചിപ്പിക്കുന്നു. വിവർത്തനം ആ കഥാപാത്രത്തിന്റെ നിലപാട് മാത്രം അവതരിപ്പിക്കുന്നു; അതിനെ അംഗീകരിക്കുന്നില്ല.
- issue: ὅτι ἁμαρτωλός ἐστιν എന്നതിന്റെ ബന്ധം
  choice: 'അവൾ എങ്ങനെയുള്ളവളാണെന്ന വിലയിരുത്തലിന്റെ കാരണം/വിശദീകരണം: “അവൾ പാപിനിയാണല്ലോ”'
  alternative: 'അവൻ അറിയേണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം: “അവൾ പാപിനിയാണെന്ന്”'
  rationale: ഗ്രീക്ക് വാക്യം രണ്ടു രീതിയിലും കേൾക്കാം. മുഖ്യപാഠം സ്വാഭാവികമായ വിശദീകരണഭാവം സ്വീകരിക്കുകയും മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘പരീശൻ’, ‘പ്രവാചകൻ’, ‘പാപിനി’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി. പരീശന്റെ അകലംപാലിക്കുന്ന ശൈലി ‘ഇയാൾ’ എന്നതിലൂടെ സൂക്ഷിച്ചു; ആശയത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
