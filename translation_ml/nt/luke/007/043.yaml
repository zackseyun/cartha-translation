reference: Luke 7:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: ml
  text: 'ശിമോൻ ഉത്തരം പറഞ്ഞു: “ആരോടാണോ കൂടുതൽ കടം ഇളച്ചുകൊടുത്തത്, അവനാണെന്ന് ഞാൻ കരുതുന്നു[a].” യേശു അവനോട് പറഞ്ഞു: “നീ ശരിയായി വിധിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്നു ഞാൻ അനുമാനിക്കുന്നു”; ഗ്രീക്ക് പ്രയോഗം ഉറപ്പോടെ പറയുന്നതിനെക്കാൾ സൂക്ഷ്മമായ ഒരു നിഗമനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: ഉത്തരം പറഞ്ഞു
  rationale: മറുപടി അവതരിപ്പിക്കുന്ന ഈ ഗ്രീക്ക് കൃുദന്തരൂപവും സമാപികാക്രിയയും ചേർന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ഒറ്റ ക്രിയാപ്രയോഗമായി നൽകുന്നു.
- source_word: Ὑπολαμβάνω
  choice: ഞാൻ കരുതുന്നു
  rationale: ഉറച്ച പ്രസ്താവനയല്ല, തെളിവിൽനിന്നുള്ള സൂക്ഷ്മവും താൽക്കാലികവുമായ നിഗമനമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: ᾧ τὸ πλεῖον ἐχαρίσατο
  choice: കൂടുതൽ കടം ഇളച്ചുകൊടുത്തവനോട്
  rationale: സമീപസന്ദർഭത്തിലെ കടക്കാരുടെ ഉപമയെ വ്യക്തമായി നിലനിർത്തുന്നു. χαρίζομαι എന്ന ക്രിയയിലെ ഉദാരമായി കടം ഒഴിവാക്കുന്ന ആശയവും ദത്തിവ് ബന്ധവും ഈ മലയാളപ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Ὀρθῶς
  choice: ശരിയായി
  rationale: ശിമോന്റെ വിലയിരുത്തൽ കൃത്യമാണെന്ന അംഗീകാരം സാധാരണവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔκρινας
  choice: വിധിച്ചു
  rationale: κρίνω എന്നതിന്റെ വിലയിരുത്തി നിഗമനത്തിലെത്തുക എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ന്യായവിധി പ്രഖ്യാപിക്കുന്ന സാങ്കേതിക അർഥമല്ല.
theological_decisions:
- issue: ഉപമയിലെ ἐχαρίσατο എന്ന കടം-ഇളവ് ഭാഷയും പാപമോചനവുമായുള്ള ബന്ധം
  choice: പ്രധാനപാഠത്തിൽ “കടം ഇളച്ചുകൊടുത്ത” എന്നു നൽകി ഉപമയുടെ ധനകാര്യചിത്രം നിലനിർത്തുക
  alternative: “കൂടുതൽ ക്ഷമിച്ചവനോട്”
  rationale: ഈ വാക്യത്തിന്റെ തൊട്ടുമുമ്പുള്ള ഉപമ യഥാർത്ഥത്തിൽ കടത്തെക്കുറിച്ചാണ്; തുടർന്നുള്ള വ്യാഖ്യാനം അതിനെ പാപമോചനവുമായി ബന്ധിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിൽ ഉപമയുടെ രൂപകം നിലനിർത്തുന്നതിലൂടെ ആ ബന്ധവും അതിലെ ദൈവശാസ്ത്രപരമായ പിണക്കവും മുൻകൂട്ടി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സംസാരഭാഗത്തിൽ ശിമോന്റെ മടിച്ചുനിൽക്കുന്ന നിഗമനം നിലനിർത്തുന്നു. ഗ്രീക്ക് പാഠത്തിലെ αὐτῷ എന്ന സർവനാമത്തിന്റെ വ്യക്തമായ സൂചകം സന്ദർഭത്തിൽ യേശുവായതിനാൽ മലയാളത്തിൽ “യേശു” എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
