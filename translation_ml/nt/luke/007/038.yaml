id: LUK.7.38
reference: Luke 7:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: ml
  text: അവൾ കരഞ്ഞുകൊണ്ട് അവന്റെ പിന്നിൽ, അവന്റെ കാൽക്കൽ നിന്നു. അവൾ തന്റെ കണ്ണുനീർകൊണ്ട് അവന്റെ കാലുകൾ നനയ്ക്കാൻ തുടങ്ങി; തന്റെ തലമുടികൊണ്ട് അവ തുടച്ചുകൊണ്ടിരുന്നു. അവന്റെ കാലുകളിൽ വീണ്ടും വീണ്ടും ചുംബിക്കുകയും[a] സുഗന്ധതൈലം പുരട്ടുകയും[b] ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ കാലുകളിൽ ചുംബിച്ചുകൊണ്ടിരുന്നു’; ഗ്രീക്ക് ക്രിയ ശക്തമായതും അതിന്റെ കാലരൂപം ആവർത്തിച്ചോ തുടർന്നോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതുമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘സുഗന്ധലേപനം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദം സുഗന്ധമുള്ള എണ്ണയെയോ ലേപനവസ്തുവെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: നിന്നു
  rationale: അയോറിസ്റ്റ് കൃദന്തത്തിന്റെ രംഗസജ്ജീകരണ സ്വഭാവം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ ക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: അവന്റെ പിന്നിൽ കാൽക്കൽ
  rationale: യേശു ഭക്ഷണമേശയിൽ ചാരിക്കിടന്നിരുന്ന പശ്ചാത്തലത്തിൽ, അവൾ അവന്റെ പിന്നിലായും കാലുകൾക്കരികിലായും നിന്ന സ്ഥാനം വ്യക്തമായി നൽകുന്നു.
- source_word: κλαίουσα
  choice: കരഞ്ഞുകൊണ്ട്
  rationale: തുടർന്നുകൊണ്ടിരുന്ന കരച്ചിലിനെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: കണ്ണുനീരുകൊണ്ട് നനയ്ക്കാൻ തുടങ്ങി
  rationale: ἤρξατο പ്രവർത്തനത്തിന്റെ ആരംഭവും βρέχειν നനയ്ക്കുക എന്ന അടിസ്ഥാന അർഥവും നിലനിർത്തുന്നു.
- source_word: ἐξέμασσεν
  choice: തുടച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് കാലത്തിന്റെ തുടർച്ചാഭാവവും തുടയ്ക്കുക എന്ന ക്രിയയുടെ പ്രക്രിയയും സംരക്ഷിക്കുന്നു; ഫലമായി ഉണക്കി എന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: തന്റെ തലമുടികൊണ്ട്
  rationale: ഗ്രീക്കിലെ പൂർണ്ണപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും സ്ത്രീയുടെ സ്വന്തം തലമുടിയെന്നത് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: κατεφίλει
  choice: വീണ്ടും വീണ്ടും ചുംബിക്കുകയും
  rationale: καταφιλέω എന്ന ശക്തമായ ക്രിയയുടെയും ഇംപെർഫെക്റ്റ് കാലത്തിന്റെയും ആവർത്തനസൂചന പ്രകടമാക്കുന്നു; വികാരത്തിന്റെ അളവ് അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἤλειφεν
  choice: പുരട്ടുകയും ചെയ്തു
  rationale: ഇവിടെ സുഗന്ധതൈലം കാലുകളിൽ പ്രയോഗിച്ച പ്രവൃത്തിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῷ μύρῳ
  choice: സുഗന്ധതൈലം
  rationale: μύρον സുഗന്ധമുള്ള എണ്ണയെയോ ലേപനവസ്തുവെയോ സൂചിപ്പിക്കുന്നു; 'സുഗന്ധതൈലം' ആ വസ്തുവിന്റെ സ്വഭാവം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ കാലുകളോടുള്ള സ്ത്രീയുടെ പ്രവൃത്തികളുടെ അവതരണം
  choice: കരച്ചിൽ, കണ്ണുനീർ, തലമുടികൊണ്ടുള്ള തുടയ്ക്കൽ, ആവർത്തിച്ചുള്ള ചുംബനം, സുഗന്ധതൈലം പുരട്ടൽ എന്നീ മൂർത്തമായ പ്രവൃത്തികൾ നേരിട്ട് നിലനിർത്തി.
  alternative: ഇവയെ 'ഭക്തി പ്രകടിപ്പിച്ചു' എന്നതുപോലുള്ള വ്യാഖ്യാനാത്മക സംഗ്രഹമായി നൽകുക, അല്ലെങ്കിൽ ചുംബനത്തിന്റെ ആവർത്തനസ്വഭാവം മൃദൂകരിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം വികാരതീവ്രവും വിനയപൂർണവുമായ പ്രവൃത്തികളെ ദൃശ്യമായി വിവരിക്കുന്നു. അതിലേക്ക് പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കാതെയും അതിന്റെ ശക്തി കുറയ്ക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് സുഗമവും അതേസമയം തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ തുടർച്ചയായ പ്രവൃത്തികളെ മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; അർഥക്രമം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
