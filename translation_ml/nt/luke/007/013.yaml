id: LUK.7.13
reference: Luke 7:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: ml
  text: കർത്താവ് അവളെ കണ്ടപ്പോൾ അവളോട് കരുണ തോന്നി; അവളോടു, “കരയരുത്[a],” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കരച്ചിൽ നിർത്തുക.” ഗ്രീക്ക് പ്രയോഗം പൊതുവായ ഒരു വിലക്കായോ ഇപ്പോൾ നടന്നുകൊണ്ടിരിക്കുന്ന കരച്ചിൽ നിർത്താനുള്ള നിർദേശമായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കാലസൂചകമായ ‘കണ്ടപ്പോൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനത്തിൽ ഇത് യേശുവിനുള്ള ഉയർന്ന സ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നു; മലയാള ബൈബിൾ ഭാഷയിൽ ‘കർത്താവ്’ സ്വാഭാവികമായി അതു നിലനിർത്തുന്നു.
- source_word: ἐσπλαγχνίσθη
  choice: മനസ്സലിഞ്ഞ്
  rationale: ആഴത്തിലുള്ള ഉള്ളലിവും കരുണയും സൂചിപ്പിക്കുന്ന ക്രിയയാണിത്. ‘മനസ്സലിഞ്ഞ്’ എന്ന പ്രയോഗം അതിന്റെ വൈകാരിക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: ἐπ’ αὐτῇ
  choice: അവളോടു
  rationale: ἐπί + ദത്തിവ് കരുണ ആരിലേക്കാണ് തിരിയുന്നതെന്നു സൂചിപ്പിക്കുന്നു; ‘അവളോടു മനസ്സലിഞ്ഞ്’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: εἶπεν αὐτῇ
  choice: എന്നു പറഞ്ഞു
  rationale: ഉദ്ധരണിക്കു ശേഷമുള്ള ‘എന്നു പറഞ്ഞു’ λέγωയുടെ ലളിതമായ അർഥം കൃത്യമായി നൽകുന്നു; സന്ദർഭംകൊണ്ട് ആരോടാണു പറഞ്ഞതെന്നത് വ്യക്തമാണ്.
- source_word: Μὴ κλαῖε
  choice: കരയരുത്
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപം പൊതുവായ വിലക്കായോ ഇപ്പോൾ നടന്നുകൊണ്ടിരിക്കുന്ന കരച്ചിൽ നിർത്താനുള്ള നിർദേശമായോ കേൾക്കാം. ‘കരയരുത്’ ഈ രണ്ടു സാധ്യതകളും അതിയായി നിർണയിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനുള്ള κύριος എന്ന സ്ഥാനനാമത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഇവിടെ κύριος കേവലം ‘യജമാനൻ’ എന്ന അർഥത്തിലല്ല, ലൂക്കോസിന്റെ ആഖ്യാനത്തിൽ യേശുവിനുള്ള ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നു. ‘കർത്താവ്’ മൂലപാഠത്തിന്റെ ഉയർന്ന ഭാവം അധിക വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവവും സ്വാഭാവികതയും നിലനിർത്തിയിരിക്കുന്നു. ‘മനസ്സലിഞ്ഞ്’ ആഴമുള്ള കരുണയുടെ ഭാവം ചുരുക്കമായും ജീവസ്സുറ്റതായും നൽകുന്നു.
