id: LUK.7.45
reference: Luke 7:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: ml
  text: നീ എനിക്ക് ഒരു ചുംബനം തന്നില്ല[a]; എന്നാൽ, ഞാൻ അകത്തു വന്നതുമുതൽ ഈ സ്ത്രീയോ എന്റെ പാദങ്ങൾ ചുംബിക്കുന്നത്[b] നിർത്തിയിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അഭിവാദനചുംബനം’; ചുംബനം അതിഥിയെ സ്വീകരിക്കുന്ന പതിവിന്റെ ഭാഗമായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: 'ഈ ക്രിയ സ്നേഹപൂർവമോ ആവർത്തിച്ചോ ചുംബിക്കുന്നതിനെ സൂചിപ്പിക്കാം: ‘എന്റെ പാദങ്ങളിൽ തുടർച്ചയായി ചുംബിക്കുന്നത് നിർത്തിയിട്ടില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  choice: ഒരു ചുംബനം
  rationale: φίλημα എന്ന നാമത്തിന്റെ നേരായ അർഥം ‘ചുംബനം’ എന്നാണ്. സന്ദർഭത്തിൽ ഇത് അതിഥിയെ അഭിവാദ്യം ചെയ്യുന്ന പതിവുചുംബനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ആ സാംസ്കാരിക വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μοι
  choice: എനിക്ക്
  rationale: ദത്തിവ് സർവനാമം ἔδωκας എന്ന ക്രിയയുടെ പരോക്ഷകർമമാണ്; ‘എനിക്ക് ... തന്നില്ല’ എന്നത് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἔδωκας
  choice: തന്നില്ല
  rationale: δίδωμι എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കൊടുക്കുക/തരുക’ നിലനിർത്തുന്നു; οὐ എന്ന നിഷേധം ക്രിയയോടു ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: αὕτη δὲ
  choice: എന്നാൽ ... ഇവൾ
  rationale: δὲ സൂചിപ്പിക്കുന്ന വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ടും, αὕτη എന്ന സമീപസൂചക സർവനാമം ‘ഇവൾ’ കൊണ്ടും നിലനിർത്തുന്നു.
- source_word: ἀφ’ ἧς εἰσῆλθον
  choice: ഞാൻ അകത്തു വന്നതുമുതൽ
  rationale: ἀφ’ ἧς എന്നതിന്റെ കാലസൂചനയും εἰσῆλθον എന്നതിന്റെ ‘അകത്തു വരുക/പ്രവേശിക്കുക’ എന്ന അർഥവും ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: οὐ διέλιπεν
  choice: നിർത്തിയിട്ടില്ല
  rationale: διαλείπω എന്നതിന്റെ ‘നിർത്തുക, അവസാനിപ്പിക്കുക’ എന്ന അർഥം നൽകുകയും, പ്രവേശിച്ച സമയംമുതൽ സംസാരസമയംവരെ തുടരുന്ന പ്രവൃത്തിയെ മലയാളത്തിലെ പൂർത്തിവർത്തമാനരൂപം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: καταφιλοῦσά
  choice: ചുംബിക്കുന്നത്
  rationale: καταφιλέω സ്നേഹപൂർവമോ ആവർത്തിച്ചോ ചുംബിക്കുന്നതിനെ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘ചുംബിക്കുന്നത്’ ഉപയോഗിച്ച് ശക്തമായ ആവർത്തനസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μου τοὺς πόδας
  choice: എന്റെ പാദങ്ങളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനമായ ‘പാദങ്ങൾ’ നിലനിർത്തുന്നു. ചുംബനത്തിന്റെ ലക്ഷ്യം മലയാളത്തിൽ അധികരണവിഭക്തിയോടെ ‘പാദങ്ങളിൽ’ എന്നു സ്വാഭാവികമായി പറയുന്നു.
theological_decisions:
- issue: അഭിവാദനചുംബനത്തിൽ ഉൾക്കൊള്ളുന്ന അതിഥിസൽക്കാരരീതി
  choice: മുഖ്യപാഠത്തിൽ പ്രവൃത്തി മാത്രം നേരിട്ട് വിവർത്തനം ചെയ്ത് സാംസ്കാരിക പ്രാധാന്യം അടിക്കുറിപ്പിൽ നൽകുക.
  alternative: ‘അതിഥിയെ അഭിവാദ്യം ചെയ്യുന്ന പതിവുചുംബനം നീ എനിക്ക് തന്നില്ല’ എന്ന് മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുക.
  rationale: വാക്യം ശിമോന്റെ അതിഥിസൽക്കാരത്തിലെ വീഴ്ചയും സ്ത്രീയുടെ ഭക്തിപൂർവമായ പ്രവൃത്തിയും തമ്മിൽ വിരുദ്ധമായി നിർത്തുന്നു. എന്നാൽ ഗ്രീക്ക് പാഠം ആചാരത്തെ വിശദീകരിക്കാതെ ‘ചുംബനം’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പാദങ്ങൾ’ എന്നത് സന്ദർഭത്തിന്റെ ഗൗരവത്തിന് യോജിച്ചും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും ഉള്ള പദമാണ്. മൂലപാഠത്തിലെ നേരിട്ടുള്ള വൈരുധ്യവും തുടരുന്ന പ്രവൃത്തിയും സംരക്ഷിച്ചിരിക്കുന്നു.
