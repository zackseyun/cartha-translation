translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യേശു’ എന്ന പേര് ഗ്രീക്കിലെ സർവനാമത്തിന്റെ വ്യക്തമായ സൂചിതപദമായി ഉപയോഗിച്ചു; ആവർത്തിച്ചുള്ള ‘അവൻ’ മൂലമുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
