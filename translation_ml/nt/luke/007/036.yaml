source:
  edition: SBLGNT
  text: Ἠρώτα δέ τις αὐτὸν τῶν Φαρισαίων ἵνα φάγῃ μετ’ αὐτοῦ· καὶ εἰσελθὼν εἰς ⸂τὸν οἶκον⸃ τοῦ Φαρισαίου ⸀κατεκλίθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: ml
  text: പരീശന്മാരിൽ ഒരാൾ തന്നോടൊപ്പം ഭക്ഷണം കഴിക്കാൻ യേശുവിനെ ക്ഷണിക്കുകയായിരുന്നു[a]. യേശു ആ പരീശന്റെ വീട്ടിൽ പ്രവേശിച്ച് ഭക്ഷണത്തിനായി ചാരിക്കിടന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “തന്നോടൊപ്പം ഭക്ഷണം കഴിക്കേണ്ടതിന് അവനോട് ചോദിക്കുകയായിരുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അന്നത്തെ ഔപചാരിക ഭക്ഷണവേളയിലെ പതിവനുസരിച്ച് നിവർന്നിരിക്കാതെ ചാരിക്കിടന്നുകൊണ്ട് ഭക്ഷണം കഴിക്കാനുള്ള സ്ഥാനം സ്വീകരിച്ചു.
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: അപേക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലക്രിയയുടെ തുടർച്ചയുള്ള ഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ക്ഷണമാണെങ്കിലും, ഗ്രീക്കിലെ ‘ചോദിക്കുക/അപേക്ഷിക്കുക’ എന്ന പദപ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: δέ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ലഘുവായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ബന്ധം സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘ഇപ്പോൾ’ പോലൊരു കാലസൂചകം ചേർത്തിട്ടില്ല.
- source_word: τις τῶν Φαρισαίων
  choice: പരീശന്മാരിൽ ഒരാൾ
  rationale: ഭാഗസൂചക ഷഷ്ഠിയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: തന്നോടൊപ്പം ഭക്ഷണം കഴിക്കാൻ
  rationale: ἵναയും വിധിലിംഗക്രിയയും സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: εἰσελθὼν
  choice: പ്രവേശിച്ച്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാന്യൂനരൂപംകൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: τὸν οἶκον τοῦ Φαρισαίου
  choice: ആ പരീശന്റെ വീട്ടിൽ
  rationale: വാസസ്ഥലവും ഉടമസ്ഥബന്ധവും വ്യക്തമായി നൽകുന്നു; മുമ്പ് പരാമർശിച്ച പരീശനെ ‘ആ’ എന്നു സൂചിപ്പിക്കുന്നു.
- source_word: κατεκλίθη
  choice: ഭക്ഷണത്തിനായി ചാരിക്കിടന്നു
  rationale: ഔപചാരിക ഭക്ഷണവേളയിൽ ഇരിക്കാതെ ചാരിക്കിടക്കുന്ന പുരാതന പതിവിനെ സൂചിപ്പിക്കുന്നു; ‘മേശയ്ക്കരികിൽ’ എന്നത് മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
