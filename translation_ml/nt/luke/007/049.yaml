id: LUK.7.49
reference: Luke 7:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: ml
  text: 'അവനോടൊപ്പം മേശയോടുചേർന്ന് കിടന്നിരുന്നവർ തങ്ങൾക്കിടയിൽ[a] പറയാൻ തുടങ്ങി: “പാപങ്ങൾ ക്ഷമിക്കുകപോലും ചെയ്യുന്ന ഇവൻ ആർ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തങ്ങളോടുതന്നെ.” ഈ ഗ്രീക്ക് പ്രയോഗം വിരുന്നുകാർ തമ്മിലുള്ള സംഭാഷണത്തെയോ അവരുടെ ഉള്ളിലെ ചിന്തയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: പറഞ്ഞുതുടങ്ങി
  rationale: ἄρχω + infinitive എന്ന പ്രയോഗത്തിന്റെ ആരംഭസൂചകമായ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: οἱ συνανακείμενοι
  choice: അവനോടൊപ്പം ഭക്ഷണമേശയ്ക്കരികിൽ ചാരിക്കിടന്നിരുന്നവർ
  rationale: പുരാതന വിരുന്നുകളിൽ മേശയ്ക്കരികിൽ ചാരിക്കിടന്ന് ഭക്ഷണം കഴിച്ചിരുന്ന സാംസ്കാരിക പശ്ചാത്തലവും συν- എന്നതിലെ ‘ഒപ്പം’ എന്ന ആശയവും വ്യക്തമാക്കുന്നു.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: തങ്ങൾക്കിടയിൽ പറഞ്ഞുതുടങ്ങി
  rationale: ബഹുവചനത്തിലുള്ള വിരുന്നുകാരുടെ പരസ്പരസംഭാഷണത്തിന് യോജിച്ച സ്വാഭാവിക വിവർത്തനം; ഈ ഗ്രീക്ക് പ്രയോഗത്തിന് ആത്മഗതമെന്ന അർഥസാധ്യതയും ഉള്ളതിനാൽ അടിക്കുറിപ്പിൽ അത് നിലനിർത്തുന്നു.
- source_word: Τίς οὗτός ἐστιν
  choice: ഇവൻ ആർ?
  rationale: മൂലത്തിൽ ‘മനുഷ്യൻ’ എന്ന പദമില്ല; ചോദ്യത്തിന്റെ സംക്ഷിപ്തതയും നേരിട്ടുള്ള സ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: καὶ
  choice: പോലും
  rationale: ഇവിടെ καί ആശ്ചര്യം ഊന്നുന്ന ascensive പ്രയോഗമാണ്; ‘പോലും’ അതിന്റെ വാഗ്‌ബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἁμαρτίας ἀφίησιν
  choice: പാപങ്ങൾ ക്ഷമിക്കുന്ന
  rationale: ഈ സന്ദർഭത്തിൽ ἀφίημι പാപമോചനത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്; ‘ക്ഷമിക്കുക’ വ്യക്തവും ദൈവശാസ്ത്രപരമായ പ്രാധാന്യം നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: പാപങ്ങൾ ക്ഷമിക്കാനുള്ള യേശുവിന്റെ അധികാരത്തെക്കുറിച്ചുള്ള സൂചന
  choice: “പാപങ്ങൾപോലും ക്ഷമിക്കുന്ന ഇവൻ ആർ?” എന്ന വിരുന്നുകാരുടെ ചോദ്യം വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ നിലനിർത്തുന്നു.
  alternative: “പാപങ്ങൾപോലും ക്ഷമിക്കുന്ന ഈ മനുഷ്യൻ ആർ?”
  rationale: വാക്യം ക്രിസ്തുവിന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ചോദ്യം പരോക്ഷമായി ഉയർത്തുന്നുവെങ്കിലും വിശദീകരണപരമായ നിഗമനം നൽകുന്നില്ല. അതിനാൽ ‘മനുഷ്യൻ’ പോലുള്ള മൂലത്തിലില്ലാത്ത പദം ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും ആശ്ചര്യവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പുരാതന ഭക്ഷണരീതി അനാവശ്യമായി ആധുനികവൽക്കരിക്കാതെ വ്യക്തമാക്കിയിരിക്കുന്നു; ചോദ്യത്തിന്റെ ചുരുക്കവും ആശ്ചര്യഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
