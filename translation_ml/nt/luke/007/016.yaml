id: LUK.7.16
reference: Luke 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: ml
  text: 'എല്ലാവരെയും ഭയം പിടികൂടി. അവർ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തിക്കൊണ്ട് പറഞ്ഞു: “നമ്മുടെ ഇടയിൽ ഒരു മഹാപ്രവാചകൻ എഴുന്നേറ്റിരിക്കുന്നു[a]; ദൈവം തന്റെ ജനത്തെ സന്ദർശിച്ചിരിക്കുന്നു[b].”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മുടെ ഇടയിൽ ഒരു മഹാപ്രവാചകൻ എഴുന്നേല്പിക്കപ്പെട്ടിരിക്കുന്നു”; ദൈവം ഒരു പ്രവാചകനെ എഴുന്നേല്പിച്ചുവെന്ന ആശയത്തിന് ഈ രൂപം ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “സന്ദർശിച്ചിരിക്കുന്നു” എന്നത് ദൈവം തന്റെ ജനത്തെ ശ്രദ്ധയോടും രക്ഷാകരമായ കരുതലോടും കൂടി സമീപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ബൈബിൾ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: 'ഇത് രണ്ട് പ്രഖ്യാപനങ്ങളായും വായിക്കാം: “നമ്മുടെ ഇടയിൽ ഒരു മഹാപ്രവാചകൻ എഴുന്നേറ്റിരിക്കുന്നു,” എന്നും “ദൈവം തന്റെ ജനത്തെ സന്ദർശിച്ചിരിക്കുന്നു” എന്നും.'
    reason: previous_rendering
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: എല്ലാവരെയും ഭയം പിടികൂടി
  rationale: ഭയം എല്ലാവരെയും പെട്ടെന്ന് കീഴടക്കിയെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. ‘ഭക്ത്യാദരം’ എന്നു വ്യാഖ്യാനിച്ച് ഭയവും വിസ്മയവും തമ്മിലുള്ള സംഘർഷം ഇല്ലാതാക്കുന്നില്ല.
- source_word: δὲ
  choice: വാക്യക്രമത്തിലൂടെ ബന്ധിപ്പിച്ചു; പ്രത്യേക പദം ചേർത്തില്ല
  rationale: ഇവിടെ δέ മൃദുവായ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിൽ പുതിയ വാക്യത്തിലേക്കുള്ള സ്വാഭാവിക നീക്കം അതിന്റെ ധർമ്മം വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള അനാവശ്യ വൈരുധ്യം ഒഴിവാക്കി.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: അവർ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തിക്കൊണ്ട്
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവം ‘-കൊണ്ട്’ എന്ന ഘടനയിലൂടെ സൂചിപ്പിക്കുകയും δοξάζω എന്ന പദത്തിന്റെ ‘മഹത്ത്വപ്പെടുത്തുക’ എന്ന ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: ജനങ്ങൾ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തിയതിന്റെ വാക്കുകളെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Προφήτης μέγας
  choice: ഒരു മഹാപ്രവാചകൻ
  rationale: μέγας എന്ന വിലയിരുത്തൽശക്തിയും προφήτης എന്ന പദത്തിന്റെ സാധാരണ ബൈബിൾ അർത്ഥവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἠγέρθη
  choice: എഴുന്നേറ്റിരിക്കുന്നു
  rationale: ഒരു പ്രവാചകൻ ജനമധ്യേ ഉദിച്ചുവന്നുവെന്ന സ്വാഭാവിക അർത്ഥം നൽകുന്നു; ദൈവത്താൽ എഴുന്നേല്പിക്കപ്പെട്ടു എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν ἡμῖν
  choice: നമ്മുടെ ഇടയിൽ
  rationale: സമൂഹത്തിന്റെ മധ്യേ എന്ന അർത്ഥം ലളിതവും നേരിട്ടുമായി നൽകുന്നു.
- source_word: Ἐπεσκέψατο
  choice: സന്ദർശിച്ചിരിക്കുന്നു
  rationale: ദൈവം ശ്രദ്ധയോടും രക്ഷാകരമായ കരുതലോടും കൂടി തന്റെ ജനത്തിലേക്കു വരുന്നതിനെ സൂചിപ്പിക്കുന്ന ബൈബിൾ സന്ദർശനഭാഷ സംരക്ഷിക്കുന്നു; ‘സഹായിച്ചു’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: θεός എന്ന പദത്തിന്റെ പതിവായ മലയാളരൂപം.
- source_word: τὸν λαὸν αὐτοῦ
  choice: തന്റെ ജനത്തെ
  rationale: ഉടമസ്ഥതയും ഉടമ്പടിജനമെന്ന അനുരണനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അത്ഭുതത്തിനു ശേഷമുള്ള φόβος എന്ന പ്രതികരണം
  choice: ഭയം
  alternative: ഭക്ത്യാദരം / വിസ്മയഭക്തി
  rationale: മൂലപദത്തിന്റെ ശക്തിയും ഭയം-ഭക്ത്യാദരം എന്നീ ആശയങ്ങൾക്കിടയിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: പ്രവാചകനെ സംബന്ധിച്ച ἠγέρθη എന്ന കർമണിപ്രയോഗം
  choice: എഴുന്നേറ്റിരിക്കുന്നു
  alternative: എഴുന്നേല്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: സ്വാഭാവിക മലയാളത്തിൽ ‘ഉദിച്ചുവന്നു’ എന്ന ആശയം നൽകുമ്പോഴും ദൈവിക പ്രവർത്തകത്വം സൂചിപ്പിക്കാവുന്ന കൂടുതൽ ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: ദൈവത്തിന്റെ Ἐπεσκέψατο എന്ന പ്രവൃത്തി
  choice: തന്റെ ജനത്തെ സന്ദർശിച്ചിരിക്കുന്നു
  alternative: തന്റെ ജനത്തെ സഹായിക്കാൻ വന്നിരിക്കുന്നു
  rationale: ലൂക്കോസിലെ രക്ഷാചരിത്രപരമായ സന്ദർശനഭാഷയുടെ സമൃദ്ധി നിലനിർത്തുകയും അതിനെ ‘സഹായം’ എന്ന ഒറ്റ വിശദീകരണത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ὅτι ... καὶ ὅτι എന്ന രണ്ടു സമാന്തര പ്രസ്താവനകളുടെ ഉദ്ധരണിരീതി
  choice: ഒരൊറ്റ തുടർച്ചയായ ഉദ്ധരണിയായി അവതരിപ്പിച്ചു
  alternative: രണ്ട് വേർതിരിച്ച ഉദ്ധരണികളായി വായിക്കാം
  rationale: ഗ്രീക്കിൽ രണ്ടും λέγοντες എന്നതിന്റെ ഉള്ളടക്കമാണ്. ഒറ്റ ഉദ്ധരണി മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്; വേർതിരിച്ച പ്രഖ്യാപനങ്ങളെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘മഹത്ത്വപ്പെടുത്തുക’, ‘പ്രവാചകൻ’, ‘സന്ദർശിക്കുക’ എന്നീ ബൈബിൾ പ്രയോഗങ്ങൾ അവയുടെ മൂലഭാഷാപരവും ദൈവശാസ്ത്രപരവുമായ അനുരണനം നിലനിർത്താൻ ഉപയോഗിച്ചു.
