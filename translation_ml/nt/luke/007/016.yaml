  source_fidelity: 'ഗ്രീക്ക് വാക്യത്തിലെ എല്ലാ പ്രധാന ഘടകങ്ങളും വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: φόβος-ന്റെ ശക്തി ‘ഭയം’ എന്നതിൽ, ἐδόξαζον-ന്റെ പ്രവൃത്തിഭാവം ‘മഹത്ത്വപ്പെടുത്തിക്കൊണ്ട്’ എന്നതിൽ, ἠγέρθη-യുടെ സ്വാഭാവിക അർത്ഥം മുഖ്യപാഠത്തിലും അതിന്റെ കർമണിസൂചന അടിക്കുറിപ്പിലും, Ἐπεσκέψατο-യുടെ ബൈബിൾസംബന്ധിയായ ‘സന്ദർശനം’ എന്ന ഭാഷയും സംരക്ഷിച്ചിരിക്കുന്നു. ὅτι ... καὶ ὅτι എന്ന സമാന്തര പ്രഖ്യാപനങ്ങൾ ഒരൊറ്റ ഉദ്ധരണിക്കുള്ളിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.'
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാചകം വ്യക്തവും ഗൗരവമുള്ളതുമാണ്. ‘എല്ലാവരെയും ഭയം പിടികൂടി’യും ‘ദൈവത്തെ മഹത്ത്വപ്പെടുത്തിക്കൊണ്ട് പറഞ്ഞു’യും സ്വാഭാവികമായ ആഖ്യാനശൈലിയാണ്. ഉദ്ധരണിക്കുള്ളിലെ അർധവിരാമം രണ്ടു ബന്ധിത പ്രഖ്യാപനങ്ങൾക്കിടയിലെ വേർതിരിവ് വ്യക്തമായി കാണിക്കുന്നു.
