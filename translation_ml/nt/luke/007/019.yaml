  text: ἔπεμψεν πρὸς τὸν ⸀κύριον λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ⸀ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: ml
  text: 'അവൻ കർത്താവിന്റെ അടുക്കലേക്ക് ആളയച്ച് ചോദിച്ചു: “വരാനിരിക്കുന്നവൻ അങ്ങാണോ,[a] അതോ ഞങ്ങൾ മറ്റൊരാളെ പ്രതീക്ഷിക്കണമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വരുന്നവൻ അങ്ങാണോ?” ഗ്രീക്ക് പ്രയോഗത്തെ കൂടുതൽ വിവരണാത്മകമായും വായിക്കാം; എങ്കിലും ഇവിടെ അത് പ്രതീക്ഷിക്കപ്പെട്ട മിശിഹായെ സൂചിപ്പിക്കുന്ന ഒരു പദവിയായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν πρὸς τὸν κύριον
  choice: അവൻ കർത്താവിന്റെ അടുക്കൽ ആളയച്ച്
  rationale: πέμπω എന്ന ക്രിയയുടെ ഭൂതകാല ആഖ്യാനപ്രയോഗവും πρός + accusative സൂചിപ്പിക്കുന്ന വ്യക്തിയിലേക്കുള്ള ദിശയും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. സന്ദർഭത്തിൽ അയച്ച ശിഷ്യന്മാരെയാണ് ‘ആളയച്ച്’ സൂചിപ്പിക്കുന്നത്.
- source_word: τὸν κύριον
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ ആദരസൂചകവും ക്രിസ്തുശാസ്ത്രപരമായും ഭാരമുള്ള അർഥം നിലനിർത്തുന്നു; ‘യജമാനൻ’ ഇവിടെ അർഥഭാരം കുറയ്ക്കും.
- source_word: λέγων
  choice: ഇങ്ങനെ ചോദിച്ചു
  rationale: തുടർന്നുവരുന്ന വാക്കുകൾ ചോദ്യം ആയതിനാൽ, സന്ദേശത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന participle മലയാളത്തിൽ സ്വാഭാവികമായി പുനർരൂപപ്പെടുത്തി.
- source_word: Σὺ εἶ ὁ ἐρχόμενος
  choice: വരാനിരിക്കുന്നവൻ അങ്ങുതന്നെയോ
  rationale: ആദരസൂചകമായ ‘അങ്ങ്’ യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു. ആർട്ടിക്കിളോടുകൂടിയ substantival participle-ന്റെ പ്രതീക്ഷിക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ബലം ‘വരാനിരിക്കുന്നവൻ’ നിലനിർത്തുന്നു.
- source_word: ἢ ἄλλον προσδοκῶμεν
  choice: അതോ ഞങ്ങൾ മറ്റൊരാളെ പ്രതീക്ഷിക്കണമോ
  rationale: ἢ അവതരിപ്പിക്കുന്ന ബദൽചോദ്യവും προσδοκάω സൂചിപ്പിക്കുന്ന പ്രതീക്ഷയും മലയാളത്തിൽ നേരിട്ട്, സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: κύριος എന്ന യേശുവിനുള്ള സംബോധനയുടെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനത്തിൽ ഈ പദത്തിനുള്ള ആദരസൂചകവും ക്രിസ്തുശാസ്ത്രപരവുമായ ഭാരം ‘കർത്താവ്’ കൂടുതൽ നന്നായി വഹിക്കുന്നു.
- issue: ὁ ἐρχόμενος ഒരു മിശിഹാപദവിയായോ സാധാരണ വിവരണമായോ വായിക്കുന്നത്
  choice: വരാനിരിക്കുന്നവൻ
  alternative: വരുന്നവൻ
  rationale: പ്രയോഗത്തിന്റെ പദവിസദൃശമായ, പ്രതീക്ഷിക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ശക്തി നിലനിർത്തുന്നു; എന്നാൽ ഗ്രീക്ക് participle-ൽ ഉള്ള വിവരണാത്മക സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അങ്ങ്’ നേരിട്ടുള്ള ആദരസംബോധനയായി ഉപയോഗിച്ചു; ‘വരാനിരിക്കുന്നവൻ’ മൂലത്തിലെ θεologically significant ambiguity പൂർണമായി ഇല്ലാതാക്കാതെ പദവിസദൃശമായ ഭാരം നൽകുന്നു.
