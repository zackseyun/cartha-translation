revisions:
- from: 'അവൻ കർത്താവിന്റെ അടുക്കൽ ആളയച്ച് ഇങ്ങനെ ചോദിച്ചു: “വരാനിരിക്കുന്നവൻ അങ്ങുതന്നെയോ,[a] അതോ ഞങ്ങൾ മറ്റൊരാളെ പ്രതീക്ഷിക്കണമോ?”'
  to: 'അവൻ കർത്താവിന്റെ അടുക്കലേക്ക് ആളയച്ച് ചോദിച്ചു: “വരാനിരിക്കുന്നവൻ അങ്ങാണോ,[a] അതോ ഞങ്ങൾ മറ്റൊരാളെ പ്രതീക്ഷിക്കണമോ?”'
  rationale: The revision improves idiomatic Malayalam in the direct question and footnote while preserving the Greek syntax, the alternative question, and the contextual but nonabsolute messianic force of ὁ ἐρχόμενος.
