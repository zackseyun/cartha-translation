  text: καὶ ἐδικαιώθη ἡ σοφία ἀπὸ ⸂πάντων τῶν τέκνων αὐτῆς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: ml
  text: എന്നിട്ടും ജ്ഞാനം അവളുടെ എല്ലാ മക്കളാലും ശരിയെന്ന് തെളിയിക്കപ്പെട്ടു[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീതീകരിക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘ശരിയാണെന്ന് തെളിഞ്ഞു.’
    reason: lexical_alternative
  - marker: b
    text: ‘മക്കൾ’ എന്നത് ജ്ഞാനത്തിന്റെ സത്യതയെ തങ്ങളുടെ പ്രതികരണത്തിലൂടെയോ ജീവിതരീതിയിലൂടെയോ പ്രകടമാക്കുന്നവരെ സൂചിപ്പിക്കുന്ന രൂപകമാണ്.
    reason: lexical_alternative
  - marker: c
    text: മത്തായി 11:19-ൽ, ‘ജ്ഞാനം അവളുടെ പ്രവൃത്തികളാൽ ശരിയെന്ന് തെളിയിക്കപ്പെടുന്നു’ എന്നു വായിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: എന്നിട്ടും
  rationale: മുൻസന്ദർഭത്തിൽ ആ തലമുറയുടെ വൈരുധ്യപൂർണമായ പ്രതികരണത്തെ വിമർശിച്ചതിനു പിന്നാലെ വരുന്ന ലഘുവായ വിപരീതഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἐδικαιώθη
  choice: ശരിയെന്നു തെളിയിക്കപ്പെട്ടു
  rationale: ഇവിടെ പൗലോസിന്റെ ലേഖനങ്ങളിലെ നീതീകരണം എന്ന സാങ്കേതിക അർഥമല്ല; ജ്ഞാനം ശരിയാണെന്ന് പരസ്യമായി തെളിയുകയോ അംഗീകരിക്കപ്പെടുകയോ ചെയ്യുന്നതാണ്. കർമണി രൂപവും നിലനിർത്തുന്നു.
- source_word: σοφία
  choice: ജ്ഞാനം
  rationale: σοφίαയുടെ സ്വാഭാവിക മലയാള പരിഭാഷ; തുടർന്നുള്ള സ്ത്രീലിംഗസൂചനയിലൂടെ മൂലപാഠത്തിലെ വ്യക്തിവൽക്കരണം നിലനിർത്തുന്നു.
- source_word: ἀπὸ πάντων
  choice: എല്ലാ ... മക്കളാലും
  rationale: കർമണി ക്രിയയോടൊപ്പം ἀπό പ്രവർത്തകനെ അല്ലെങ്കിൽ തെളിവിന്റെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ആൽ’ രൂപം ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τέκνων
  choice: മക്കൾ
  rationale: τέκνον എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; അനുയായികൾ, ഫലങ്ങൾ, പ്രവൃത്തികൾ എന്നിങ്ങനെ വ്യാഖ്യാനിച്ച് രൂപകം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: αὐτῆς
  choice: അവളുടെ
  rationale: സ്ത്രീലിംഗത്തിലുള്ള σοφίαയോടുള്ള സർവനാമബന്ധവും ജ്ഞാനത്തിന്റെ വ്യക്തിവൽക്കരണവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ജ്ഞാനത്തിന്റെ ‘മക്കൾ’ എന്നതിന്റെ അർഥം
  choice: ദൈവിക ജ്ഞാനത്തോട് ചേർന്നുനിൽക്കുകയോ അതിനെ ജീവിതത്തിൽ പ്രകടമാക്കുകയോ ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന രൂപകമായി മനസ്സിലാക്കാവുന്നതാണ്; എന്നാൽ മുഖ്യവാചകത്തിൽ ‘മക്കൾ’ എന്നു തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
  alternative: ജ്ഞാനം ഉളവാക്കുന്ന ഫലങ്ങൾ; അല്ലെങ്കിൽ മത്തായി 11:19-ലെ ‘പ്രവൃത്തികൾ’ എന്ന സമാന്തരവാക്യത്തിലേക്കുള്ള ആശയപരമായ ഒത്തുചേരൽ.
  rationale: ലൂക്കോസിന്റെ ഗ്രീക്ക് പാഠം τέκνων (‘മക്കൾ’) എന്നാണ് വായിക്കുന്നത്. അതിനാൽ രൂപകവും അതിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും വ്യാഖ്യാനത്തിലൂടെ ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശരിയെന്നു തെളിയിക്കപ്പെട്ടു’ എന്ന പ്രയോഗം പൊതുവായ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ഗ്രീക്കിലെ കർമണി രൂപവും പൊതുസാക്ഷ്യപ്പെടുത്തൽ എന്ന ആശയവും നിലനിർത്തുന്നു. ‘അവളുടെ മക്കൾ’ എന്നത് ജ്ഞാനത്തിന്റെ വ്യക്തിവൽക്കരണം സംരക്ഷിക്കുന്നു.
