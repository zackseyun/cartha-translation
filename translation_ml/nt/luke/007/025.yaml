id: LUK.7.25
reference: Luke 7:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ എന്തു കാണാനാണ് പുറപ്പെട്ടത്? മൃദുവായ വസ്ത്രങ്ങൾ[a] ധരിച്ച ഒരു മനുഷ്യനെയോ? നോക്കൂ, ഭംഗിയേറിയ വസ്ത്രങ്ങൾ ധരിച്ച് ആഡംബരത്തിൽ കഴിയുന്നവർ രാജകൊട്ടാരങ്ങളിലാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൃദുലമായ വസ്ത്രങ്ങൾ.” ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആഡംബരവുമായി ബന്ധപ്പെട്ട നേർത്തതും മേന്മയേറിയതുമായ വസ്ത്രങ്ങളാണ്; ധാർമിക ദൗർബല്യമല്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “രാജാക്കന്മാരുടെ രാജസഭകളിൽ.” ഗ്രീക്ക് പദം രാജകീയ വസതികളെയോ രാജസഭാ പരിസരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻപത്തെ ആലങ്കാരിക ചോദ്യങ്ങളോടു വിരുദ്ധഭാവത്തിൽ ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാള സംയോജകം.
- source_word: ἐξήλθατε ἰδεῖν
  choice: എന്തു കാണാനാണ് പുറപ്പെട്ടുപോയത്?
  rationale: പുറത്തേക്കു പോയ കഴിഞ്ഞകാല പ്രവർത്തനവും അതിന്റെ ഉദ്ദേശ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യനെ
  rationale: ആലങ്കാരിക ചോദ്യത്തിലെ ഏകവചനത്തിലുള്ള പുരുഷവ്യക്തിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: മൃദുവായ വസ്ത്രങ്ങൾ ധരിച്ച
  rationale: μαλακοῖς എന്നതിന്റെ ദൃശ്യമായ ‘മൃദുവായ’ എന്ന അർഥം നിലനിർത്തുകയും ധാർമിക ദൗർബല്യം എന്ന ആശയം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἰδοὺ
  choice: നോക്കൂ
  rationale: തുടർന്നുള്ള വിശദീകരണത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ആധുനികവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: ഭംഗിയേറിയ വസ്ത്രങ്ങൾ ധരിച്ച്
  rationale: ἐνδόξῳ സൂചിപ്പിക്കുന്ന പ്രൗഢിയും സമ്പന്നതയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: τρυφῇ
  choice: ആഡംബരത്തിൽ
  rationale: സുഖലോലുപമായ സമൃദ്ധജീവിതത്തിന്റെ സാമൂഹിക പശ്ചാത്തലം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐν τοῖς βασιλείοις
  choice: രാജകൊട്ടാരങ്ങളിൽ
  rationale: രാജകീയ വസതികളെയോ രാജസഭാ പരിസരങ്ങളെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ബഹുവചനം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: μαλακοῖς എന്നതിന്റെ സന്ദർഭാർഥം
  choice: മൃദുവും നേർത്തതുമായ ആഡംബരവസ്ത്രങ്ങളെക്കുറിച്ചുള്ള പരാമർശം
  alternative: സ്ത്രൈണമായ വസ്ത്രം അഥവാ ധാർമിക ദൗർബല്യം
  rationale: മരുഭൂമിയിലെ ലാളിത്യവും രാജകീയ ആഡംബരവും തമ്മിലുള്ള വിരോധമാണ് സന്ദർഭം; വ്യക്തിയുടെ ധാർമികമോ ലിംഗപരമോ ആയ വിലയിരുത്തലല്ല.
- issue: βασιλείοις സൂചിപ്പിക്കുന്ന സ്ഥലം
  choice: രാജകൊട്ടാരങ്ങൾ
  alternative: രാജാക്കന്മാരുടെ സഭകൾ
  rationale: പദം രാജകീയ വസതികളെയും രാജസഭാ സാഹചര്യത്തെയും സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ വ്യക്തമായ സ്ഥലാർഥം നൽകി മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നെങ്കിലും ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ആവർത്തിച്ചുള്ള ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തിയും മരുഭൂമി–രാജകൊട്ടാരം എന്ന സാമൂഹിക വിരോധവും സംരക്ഷിച്ചു.
