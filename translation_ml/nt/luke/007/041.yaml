translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്കിലെ പണവായ്പ, കടം, നാണയമൂല്യം എന്നീ ചരിത്രപരമായ ഘടകങ്ങൾ വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
