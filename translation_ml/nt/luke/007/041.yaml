id: LUK.7.41
reference: Luke 7:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: ml
  text: “പണം കടം കൊടുക്കുന്ന ഒരാളോട് കടപ്പെട്ടിരുന്ന രണ്ടുപേർ ഉണ്ടായിരുന്നു. ഒരാൾ അഞ്ഞൂറ് ദെനാരിയ[a] കടപ്പെട്ടിരുന്നു; മറ്റേയാൾ അമ്പതും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ദെനാരിയ റോമൻ സാമ്രാജ്യത്തിലെ ഒരു സാധാരണ വെള്ളിനാണയമായിരുന്നു; പൊതുവേ ഒരു തൊഴിലാളിയുടെ ഏകദേശം ഒരു ദിവസത്തെ കൂലിയുമായി അതിനെ ബന്ധപ്പെടുത്തിയിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: കടപ്പെട്ടിരുന്ന രണ്ടുപേർ
  rationale: കടബാധ്യതയുള്ള ആളുകളെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്. ‘കടപ്പെട്ടിരുന്ന രണ്ടുപേർ’ എന്നത് ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δανιστῇ τινι
  choice: ഒരു പണമിടപാടുകാരനോട്
  rationale: δανιστής പണം വായ്പ കൊടുക്കുന്നയാളെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു; τινι ഇവിടെ കഥയിലെ അനിശ്ചിതനായ ഒരാളെ ‘ഒരു’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὤφειλεν
  choice: കടപ്പെട്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം അന്നുണ്ടായിരുന്ന കടബന്ധത്തെ വിവരിക്കുന്നു; ‘കടപ്പെട്ടിരുന്നു’ അതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δηνάρια
  choice: ദിനാറി
  rationale: ചരിത്രപരമായ പ്രത്യേക നാണയമൂല്യം പൊതുവായ ‘നാണയം’ എന്നാക്കി മായ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πεντακόσια
  choice: അഞ്ഞൂറ്
  rationale: δηνάριαയെ വിശേഷിപ്പിക്കുന്ന സംഖ്യയുടെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: ἕτερος
  choice: മറ്റേയാൾ
  rationale: ὁ εἷς എന്നതിനോടുള്ള വൈരുധ്യജോടിയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πεντήκοντα
  choice: അമ്പത്
  rationale: നേരിട്ടുള്ള സംഖ്യാവിവർത്തനം; ‘ദിനാറി’ എന്ന അളവ് മുൻവാക്യഭാഗത്തിൽനിന്ന് മനസ്സിലാകുന്നതിനാൽ ആവർത്തിച്ചിട്ടില്ല.
