id: LUK.7.2
reference: Luke 7:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: ml
  text: ഒരു ശതാധിപന്റെ അടിമ[a] രോഗബാധിതനായി മരിക്കാനിരിക്കുകയായിരുന്നു; ആ അടിമ ശതാധിപന് വളരെ വിലപ്പെട്ടവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദാസൻ” / “സേവകൻ.” ഗ്രീക്കിലെ doulos എന്ന പദം സന്ദർഭമനുസരിച്ച് “അടിമ” എന്നോ “ദാസൻ/സേവകൻ” എന്നോ പരിഭാഷപ്പെടുത്താം; ഇവിടെ ബന്ധിതമായ സാമൂഹികബന്ധം നിലനിർത്താൻ “അടിമ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: ഒരു ശതാധിപന്റെ
  rationale: ജനിറ്റീവ് പ്രയോഗം അടിമ ശതാധിപന്റേതാണെന്ന ബന്ധവും τινος നൽകുന്ന അനിശ്ചിതത്വവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δέ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇത് നേരിയ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യക്രമവും വിരാമചിഹ്നവും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘ഇപ്പോൾ’ പോലൊരു സമയസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: δοῦλος
  choice: അടിമ
  rationale: ഒന്നാം നൂറ്റാണ്ടിലെ ബന്ധിതവും കീഴ്പ്പെട്ടതുമായ സാമൂഹിക നില മയപ്പെടുത്താതെ അറിയിക്കുന്നു.
- source_word: κακῶς ἔχων
  choice: രോഗബാധിതനായി
  rationale: ‘മോശമായ നിലയിൽ ഇരിക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രോഗസംബന്ധിയായ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἤμελλεν τελευτᾶν
  choice: മരിക്കാറായിരുന്നു
  rationale: മരണം ആസന്നമായിരുന്നു എന്ന μέλλω + infinitive പ്രയോഗത്തിന്റെ ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: അവൻ ശതാധിപന് വളരെ വിലപ്പെട്ടവനായിരുന്നു
  rationale: ἔντιμος സൂചിപ്പിക്കുന്ന ഉയർന്ന വിലമതിപ്പിനെ നിലനിർത്തുന്നു; αὐτῷ ആരെ സൂചിപ്പിക്കുന്നുവെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ശതാധിപന്’ ആവർത്തിക്കുന്നു, അനാവശ്യമായ വികാരാർദ്രത ചേർക്കുന്നില്ല.
theological_decisions:
- issue: വീട്ടടിമത്തത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: ഈ സന്ദർഭത്തിൽ ഉടമസ്ഥതയും സാമൂഹിക കീഴ്വഴക്കവും പദത്തിന്റെ ഭാഗമാണ്. ‘അടിമ’ അത് വ്യക്തമായി കാത്തുസൂക്ഷിക്കുന്നു; ‘ദാസൻ’ അല്ലെങ്കിൽ ‘സേവകൻ’ ബന്ധിതസ്ഥിതി മയപ്പെടുത്താൻ ഇടയുള്ളതിനാൽ അടിക്കുറിപ്പിൽ പകരവായനയായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ശതാധിപൻ’ ബൈബിൾപരിചിതവും സൈനികപദവിയെ കൃത്യമായി സൂചിപ്പിക്കുന്നതുമായ പദമാണ്. മുഖ്യവാചകത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
