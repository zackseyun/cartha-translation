id: LUK.7.6
reference: Luke 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: ml
  text: 'യേശു അവരോടൊപ്പം പോകുകയായിരുന്നു. എന്നാൽ, അദ്ദേഹം വീടിന് അധികം അകലെയല്ലാതിരിക്കെ, ശതാധിപൻ ഇങ്ങനെ പറയാൻ സുഹൃത്തുക്കളെ അയച്ചു: “കർത്താവേ[a], അങ്ങ് സ്വയം ബുദ്ധിമുട്ടേണ്ടാ; അങ്ങ് എന്റെ മേൽക്കൂരയ്ക്കു കീഴിൽ പ്രവേശിക്കുന്നതിന് ഞാൻ യോഗ്യനല്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യജമാനനേ.” ഗ്രീക്കിലെ κύριε ആദരപൂർവമായ അഭിസംബോധനയായി ഉപയോഗിക്കാം; യേശുവിന്റെ അധികാരത്തെ അംഗീകരിക്കുന്ന സൂചനയും അതിൽ ഉണ്ടായേക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “തക്കവനല്ല” / “അർഹനല്ല.” ഗ്രീക്ക് പദത്തിന് പര്യാപ്തതയെയോ യോഗ്യതയെയോ സൂചിപ്പിക്കാം; ഇവിടെ അത് യേശുവിന്റെ മുമ്പിലുള്ള ശതാധിപന്റെ വിനയത്തെ പ്രകടമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: പോയി
  rationale: അപൂർണഭൂതകാലരൂപം യാത്ര പുരോഗമിച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക കഥനത്തിൽ ‘പോയി’ അതിനെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: σὺν αὐτοῖς
  choice: അവരോടൊപ്പം
  rationale: കൂടെ സഞ്ചരിച്ചുവെന്ന അർഥം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: വീടിന് അടുത്തെത്തിയപ്പോൾ
  rationale: ‘വീട്ടിൽനിന്ന് അധികം അകലെയല്ലാതായപ്പോൾ’ എന്ന മൂലവാക്യത്തിന്റെ സമയസാഹചര്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദൂരസൂചനയുടെ അടിസ്ഥാനാർഥം നിലനിൽക്കുന്നു.
- source_word: ἔπεμψεν φίλους
  choice: സുഹൃത്തുക്കളെ അയച്ച്
  rationale: φίλους എന്ന ബഹുവചനത്തെ അധിക നിർണ്ണയം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὁ ἑκατοντάρχης
  choice: ശതാധിപൻ
  rationale: റോമൻ സൈന്യത്തിലെ നൂറുപേർക്കു മേൽ അധികാരമുള്ള ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന, ബൈബിൾ മലയാളത്തിൽ പരിചിതവും കൃത്യവുമായ പദം.
- source_word: λέγων αὐτῷ
  choice: അദ്ദേഹത്തോട് ഇങ്ങനെ പറയിച്ചു
  rationale: സുഹൃത്തുക്കളെ ദൂതന്മാരായി അയച്ച് അവരുടെ മുഖാന്തരം പറഞ്ഞുവെന്ന ആശയം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ആദരപൂർവമായ അഭിസംബോധനയും യേശുവിന്റെ അധികാരത്തെക്കുറിച്ചുള്ള കൂടുതൽ ആഴമുള്ള സൂചനയ്ക്കുള്ള സാധ്യതയും നിലനിർത്തുന്നു.
- source_word: μὴ σκύλλου
  choice: അങ്ങ് ബുദ്ധിമുട്ടേണ്ടാ
  rationale: സ്കുള്ളോ എന്ന ക്രിയയുടെ ‘സ്വയം ബുദ്ധിമുട്ടുക/പ്രയാസപ്പെടുക’ എന്ന സന്ദർഭോചിത അർഥം ആദരസൂചകമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐ ... ἱκανός εἰμι
  choice: ഞാൻ യോഗ്യനല്ല
  rationale: ἱκανός എന്നതിന് കഴിവ്, പര്യാപ്തത, യോഗ്യത എന്നീ അർഥങ്ങൾ സാധ്യമാണെങ്കിലും ഇവിടെ ശതാധിപന്റെ വിനയവും സ്വയം അയോഗ്യനെന്ന ബോധവും ‘യോഗ്യനല്ല’ വ്യക്തമാക്കുന്നു.
- source_word: ὑπὸ τὴν στέγην μου εἰσέλθῃς
  choice: അങ്ങ് എന്റെ മേൽക്കൂരയ്ക്കു കീഴിൽ പ്രവേശിക്കാൻ
  rationale: ‘എന്റെ മേൽക്കൂരയ്ക്കു കീഴിൽ’ എന്ന ദൃശ്യരൂപകം നിലനിർത്തുകയും εἰσέρχομαι എന്ന പ്രവേശനാർഥം കൃത്യമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ
  rationale: ഇവിടെ പദം ആദരസൂചകമായ അഭിസംബോധനയായിരിക്കാം; അതേസമയം യേശുവിന്റെ അധികാരത്തെ അംഗീകരിക്കുന്ന കൂടുതൽ ആഴമുള്ള അർഥവും ഉണ്ടായേക്കാം. ‘കർത്താവേ’ ഈ അർഥവ്യാപ്തി നിർബന്ധിതമായി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- issue: ἱκανός എന്ന പദത്തിലെ പര്യാപ്തതയും യോഗ്യതയും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: യോഗ്യനല്ല
  alternative: തക്കവനല്ല / അർഹനല്ല
  rationale: സന്ദർഭം ശതാധിപന്റെ വിനയത്തെ മുൻനിർത്തുന്നതിനാൽ ‘യോഗ്യനല്ല’ യോജിക്കുന്നു; എന്നാൽ പദത്തിനുള്ള ‘തക്കവൻ/പര്യാപ്തൻ’ എന്ന ആശയം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ ഉപയോഗിച്ച് ആദരം നിലനിർത്തി. ‘ശതാധിപൻ’ എന്ന പരിചിത സാങ്കേതിക പദവും ‘മേൽക്കൂരയ്ക്കു കീഴിൽ’ എന്ന മൂലരൂപകവും സംരക്ഷിച്ചു.
