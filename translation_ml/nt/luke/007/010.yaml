  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: ml
  text: 'അയയ്ക്കപ്പെട്ടവർ വീട്ടിലേക്കു മടങ്ങിയെത്തിയപ്പോൾ, അടിമ[a] സുഖമായിരിക്കുന്നതായി കണ്ടു.


    [a] അഥവാ, “സേവകൻ.” ഗ്രീക്കിലെ ദൂലോസ് എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് “അടിമ” എന്നോ “സേവകൻ” എന്നോ അർഥമാകാം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സേവകൻ.” ഗ്രീക്കിലെ ദൂലോസ് എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് “അടിമ” എന്നോ “സേവകൻ” എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: മടങ്ങിയെത്തിയപ്പോൾ
  rationale: ὑποστρέφω എന്ന ക്രിയയുടെ aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള സമയബന്ധം സൂചിപ്പിക്കുന്നു. ‘മടങ്ങിയെത്തിയപ്പോൾ’ ആ ക്രമവും മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയും നിലനിർത്തുന്നു.
- source_word: εἰς τὸν οἶκον
  choice: വീട്ടിലേക്കു
  rationale: εἰς + accusative ഒരു സ്ഥലത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. ‘വീട്ടിലേക്കു’ സ്ഥലം വ്യക്തമായി നിലനിർത്തുന്നു; ‘സ്വന്തം വീട്ടിലേക്ക്’ എന്ന അനാവശ്യ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: οἱ πεμφθέντες
  choice: അയയ്ക്കപ്പെട്ടവർ
  rationale: πέμπω എന്ന ക്രിയയുടെ articular aorist passive participle ആയതിനാൽ, ‘ദൂതന്മാർ’ എന്ന വ്യാഖ്യാനനാമം ചേർക്കാതെ passive അർഥം നേരിട്ട് സൂക്ഷിക്കുന്നു.
- source_word: εὗρον
  choice: കണ്ടു
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ εὑρίσκω എന്നതിന്റെ സ്വാഭാവിക മലയാളപ്രയോഗം. ഇവിടെ ഉദ്ദേശ്യം തിരച്ചിലിനുശേഷമുള്ള ‘കണ്ടെത്തൽ’ എന്നതിലുപരി മടങ്ങിയെത്തിയപ്പോൾ അവന്റെ അവസ്ഥ കണ്ടറിയുന്നതാണ്.
- source_word: τὸν δοῦλον
  choice: അടിമ
  rationale: δοῦλος ഉടമസ്ഥതയ്ക്കും അധികാരത്തിനും കീഴിലുള്ള സാമൂഹിക നിലയെ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ ‘അടിമ’ ആ നില ‘സേവകൻ’ എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു; പരമ്പരാഗതമായ മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὑγιαίνοντα
  choice: സുഖമായിരിക്കുന്നതായി
  rationale: ὑγιαίνω എന്ന present participle ആരോഗ്യത്തോടെ ഇരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘സുഖമായിരിക്കുന്നതായി’ ഫലാവസ്ഥ വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘സൗഖ്യം പ്രാപിച്ചു’ എന്ന സംഭവവിവരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: രോഗസൗഖ്യവിവരണത്തിൽ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: സേവകൻ
  rationale: ഈ സന്ദർഭത്തിൽ ആ വ്യക്തിയുടെ ബന്ധിതവും അധികാരാധീനവുമായ സാമൂഹിക നില പ്രസക്തമാണ്; അതിനാൽ ‘അടിമ’ മുൻഗണന നേടുന്നു. എന്നാൽ δοῦλος എന്ന പദത്തിന് സന്ദർഭാനുസൃതമായി ‘സേവകൻ’ എന്നും അർഥമാകാമെന്ന യഥാർഥ പദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ participial ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ സമയവാക്യമായി നൽകിയിരിക്കുന്നു. ഇംഗ്ലീഷ് consultation text-ൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘house’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് δοῦλος എന്ന പദത്തെക്കുറിച്ചായതിനാൽ, പ്രസക്തമായ ‘അടിമ’ എന്ന പദത്തിനുശേഷമാണ് [a] ചേർത്തത്.
