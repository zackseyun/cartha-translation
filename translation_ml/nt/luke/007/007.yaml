id: LUK.7.7
reference: Luke 7:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: ml
  text: അതുകൊണ്ട്, അങ്ങയുടെ അടുക്കൽ വരാൻപോലും ഞാൻ എന്നെത്തന്നെ യോഗ്യനായി കരുതിയില്ല. എന്നാൽ ഒരു വാക്ക് അരുളിച്ചെയ്യുക; അപ്പോൾ എന്റെ ദാസൻ[a] സൗഖ്യം പ്രാപിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ ബാലൻ” എന്നും “എന്റെ കുട്ടി” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് കുട്ടി, യുവാവ്, ദാസൻ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐδὲ
  choice: വരാൻപോലും ... കരുതിയില്ല
  rationale: നിഷേധത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘പോലും’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐμαυτὸν ἠξίωσα
  choice: ഞാൻ എന്നെത്തന്നെ യോഗ്യനായി കരുതിയില്ല
  rationale: ἀξιόω എന്നതിന്റെ ‘യോഗ്യനായി കണക്കാക്കുക’ എന്ന അർഥവും പ്രതിഫലക സർവനാമവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: അങ്ങയുടെ അടുക്കൽ വരാൻ
  rationale: യേശുവിനെ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്ന സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗം.
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻപ്രസ്താവനയ്ക്കു വിരുദ്ധമായി വരുന്ന അപേക്ഷയെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: εἰπὲ λόγῳ
  choice: ഒരു വാക്ക് അരുളിച്ചെയ്യുക
  rationale: λόγῳ അനിർദിഷ്ടമായതിനാൽ ‘ഒരു വാക്ക്’ എന്നു നൽകുന്നു; സന്ദർഭത്തിലെ ആദരവും അധികാരമുള്ള വചനവും ‘അരുളിച്ചെയ്യുക’ അറിയിക്കുന്നു.
- source_word: ἰαθήτω
  choice: സൗഖ്യം പ്രാപിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചനത്തിലുള്ള ആജ്ഞാർത്ഥക കർമണിപ്രയോഗത്തിന്റെ അഭിലഷിത ഫലം ‘-ട്ടെ’ രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὁ παῖς μου
  choice: എന്റെ ദാസൻ
  rationale: ശതാധിപന്റെ അധികാരത്തിൻ കീഴിലുള്ള വ്യക്തിയെന്ന സമീപസന്ദർഭം ‘ദാസൻ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു; പദത്തിന്റെ വിശാല അർഥപരിധി അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ശതാധിപന്റെ വിവരണത്തിൽ παῖς എന്ന പദത്തിന്റെ അർഥം
  choice: എന്റെ ദാസൻ
  alternative: എന്റെ ബാലൻ; എന്റെ കുട്ടി
  rationale: παῖς എന്നതിന് കുട്ടി, ബാലൻ, ദാസൻ എന്നീ അർഥങ്ങൾ വരാം. ശതാധിപന്റെ അധികാരബന്ധം വിവരിക്കുന്ന സന്ദർഭത്തിൽ ‘ദാസൻ’ ഏറ്റവും യോജിക്കുന്നു; എന്നാൽ കുടുംബപരമോ വാത്സല്യപരമോ ആയ സൂചന പൂർണമായി ഒഴിവാക്കാതിരിക്കാൻ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അങ്ങയുടെ’ എന്നും ‘അരുളിച്ചെയ്യുക’ എന്നും ഉള്ള പ്രയോഗങ്ങൾ ശതാധിപൻ യേശുവിനോടു കാണിക്കുന്ന ആദരം അറിയിക്കുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
