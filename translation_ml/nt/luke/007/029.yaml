id: LUK.7.29
reference: Luke 7:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: ml
  text: യോഹന്നാന്റെ സ്നാനം ഏറ്റിരുന്ന[b] ജനമെല്ലാം—നികുതിപിരിവുകാരും ഉൾപ്പെടെ—ഇതു കേട്ട്, ദൈവം നീതിമാനാണെന്ന് അംഗീകരിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ രൂപാനുസൃതമായി: “ദൈവത്തെ നീതീകരിച്ചു.” അതായത്, ദൈവമാണ് ശരിയെന്ന് അവർ അംഗീകരിച്ചു.'
    reason: lexical_alternative
  - marker: b
    text: “യോഹന്നാന്റെ സ്നാനം ഏറ്റിരുന്നതിനാൽ” എന്ന കാരണാർഥത്തിലും ഈ പങ്കാളിക്രിയ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: ജനമെല്ലാം
  rationale: ഏകവചനത്തിലുള്ള സമൂഹവാചകപ്രയോഗത്തിന്റെ വ്യാപകമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀκούσας
  choice: ഇതു കേട്ട്
  rationale: സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന കർമം ‘ഇതു’ എന്നു വ്യക്തമാക്കുകയും കാലസംബന്ധിയായ ക്രിയാവിശേഷണഭാവം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: οἱ τελῶναι
  choice: നികുതിപിരിവുകാരും ഉൾപ്പെടെ
  rationale: തൊഴിലിനെ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു; καί എന്ന സംയോജനത്തെ അനാവശ്യ ഊന്നലില്ലാതെ ഉൾപ്പെടുത്തലായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: ദൈവം നീതിമാനാണെന്ന് അംഗീകരിച്ചു
  rationale: മനുഷ്യർ ദൈവത്തെ നീതിമാനാക്കുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി, ദൈവമാണ് ശരിയും നീതിയുമുള്ളവൻ എന്ന് അവർ സമ്മതിച്ചുവെന്ന ന്യായവിധിസംബന്ധിയായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: βαπτισθέντες
  choice: സ്നാനം ഏറ്റിരുന്ന
  rationale: കർത്തരിപ്രയോഗത്തിലേക്ക് മാറ്റാതെ സ്വീകരിക്കപ്പെട്ട സ്നാനത്തെ സൂചിപ്പിക്കുകയും, കാരണബന്ധം തുറന്നുപറയാതെ പശ്ചാത്തലസാഹചര്യമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: യോഹന്നാന്റെ സ്നാനം
  rationale: ബന്ധത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തെ നീതീകരിച്ചു’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ദൈവം നീതിമാനാണെന്ന് അവർ അംഗീകരിച്ചു എന്ന അർഥം മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: കൂടുതൽ രൂപാനുസൃതമായി ‘ദൈവത്തെ നീതീകരിച്ചു’ എന്നു വിവർത്തനം ചെയ്യാം.
  rationale: ഇവിടെ ദൈവത്തിന്റെ നിലയിൽ മനുഷ്യർ മാറ്റം വരുത്തുന്നു എന്നല്ല, ദൈവമാണ് ശരിയെന്ന് അവർ സമ്മതിക്കുന്നു എന്നതാണ് ആശയം; അതേസമയം മൂലത്തിലെ δικαιόω എന്ന പദത്തിന്റെ ന്യായവിധിസംബന്ധിയായ നിറം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: βαπτισθέντες എന്ന പങ്കാളിക്രിയയുടെ ബന്ധം
  choice: വ്യക്തമായ കാരണസൂചന ചേർക്കാതെ പശ്ചാത്തലസാഹചര്യമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘യോഹന്നാന്റെ സ്നാനം ഏറ്റിരുന്നതിനാൽ’ എന്ന കാരണാർഥത്തിൽ മനസ്സിലാക്കാം.
  rationale: സന്ദർഭത്തിൽ കാരണാർഥം സാധ്യമാണെങ്കിലും ഗ്രീക്ക് രൂപം അതു നിർബന്ധിക്കുന്നില്ല; അതിനാൽ മുഖ്യപാഠം ബന്ധത്തെ അമിതമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നികുതിപിരിവുകാർ’ സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന പദമാണ്. പങ്കാളിക്രിയയിലെ യഥാർഥമായ കാരണ/സാഹചര്യ ദ്വയാർഥം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
