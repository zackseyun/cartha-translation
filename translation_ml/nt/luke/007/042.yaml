source:
  edition: SBLGNT
  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: ml
  text: തിരിച്ചടയ്ക്കാൻ അവർക്കു കഴിവില്ലാതിരുന്നതിനാൽ, അയാൾ ഇരുവരുടെയും കടങ്ങൾ ദയാപൂർവം ഇളച്ചുകൊടുത്തു.[a] അതിനാൽ അവരിൽ ആരാണ് അയാളെ കൂടുതൽ സ്നേഹിക്കുക?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അയാൾ ഇരുവരുടെയും കടങ്ങൾ റദ്ദാക്കി.” ഗ്രീക്ക് ക്രിയയ്ക്ക് സൗജന്യമായി നൽകുക അല്ലെങ്കിൽ കടം ദയാപൂർവം മാപ്പാക്കുക എന്ന അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: തിരിച്ചടയ്ക്കാൻ അവർക്കു കഴിവില്ലാതിരുന്നതിനാൽ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടന തിരിച്ചടയ്ക്കാനുള്ള ശേഷിയോ മാർഗമോ ഇല്ലായിരുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്നു. കടത്തിന്റെ പശ്ചാത്തലത്തിൽ ἀποδοῦναι എന്നതിന് ‘തിരിച്ചടയ്ക്കുക’ സ്വാഭാവികമാണ്.
- source_word: ἀμφοτέροις ἐχαρίσατο
  choice: അയാൾ ഇരുവരുടെയും കടം ദയാപൂർവം ഇളച്ചുകൊടുത്തു
  rationale: χαρίζομαι സൗജന്യമായി നൽകുക, അനുഗ്രഹപൂർവം വിട്ടുകൊടുക്കുക, കുടിശ്ശിക ഇളച്ചുകൊടുക്കുക എന്നീ ആശയങ്ങൾ വഹിക്കുന്നു. മലയാളത്തിൽ കടസന്ദർഭം വ്യക്തമാക്കിക്കൊണ്ട് കൃപാപൂർവമായ പ്രവൃത്തിയുടെ ഭാവവും ‘ദയാപൂർവം’ നിലനിർത്തുന്നു.
- source_word: τίς οὖν αὐτῶν
  choice: അപ്പോൾ അവരിൽ ആരായിരിക്കും
  rationale: οὖν മുൻവാക്യത്തിൽനിന്നുള്ള നിഗമനത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം നൽകുന്നു.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: അയാളെ കൂടുതൽ സ്നേഹിക്കുക
  rationale: πλεῖον താരതമ്യമായി ‘കൂടുതൽ’ എന്നും ἀγαπήσει ഭാവികാലത്തിൽ ‘സ്നേഹിക്കും/സ്നേഹിക്കുക’ എന്നും അർഥമാക്കുന്നു. ചോദ്യം ‘ആരായിരിക്കും ... സ്നേഹിക്കുക?’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ അവതരിപ്പിച്ചു.
theological_decisions:
- issue: കടത്തിന്റെ ഉപമയിൽ χαρίζομαι എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: കടം ദയാപൂർവം ഇളച്ചുകൊടുത്തു
  alternative: ഇരുവരോടും ക്ഷമിച്ചു; ഇരുവരുടെയും കടങ്ങൾ റദ്ദാക്കി
  rationale: ഉടൻ കാണുന്ന പശ്ചാത്തലം സാമ്പത്തിക കടമാണെങ്കിലും, ക്രിയയിൽ സൗജന്യമായ വിട്ടുകൊടുക്കലിന്റെയും ദയയുടെയും ഭാവമുണ്ട്. പ്രധാനപാഠത്തിൽ കടസന്ദർഭം വ്യക്തമാക്കുകയും അടിക്കുറിപ്പിൽ ‘ക്ഷമിച്ചു’ എന്ന വിശാലമായ സാധ്യത സൂക്ഷിക്കുകയും ചെയ്യുന്നു; ഇതിലൂടെ ഉപമയുടെ ക്ഷമയുമായുള്ള ബന്ധം നഷ്ടപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ ശൈലി. ‘അയാൾ’ ഉപമയിലെ മനുഷ്യനെ സൂചിപ്പിക്കാൻ ഉപയോഗിച്ചു; ‘അവൻ’ എന്നതിനേക്കാൾ വിവരണശൈലിയിൽ സ്വാഭാവികവും ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി മുൻകൂട്ടി വ്യാഖ്യാനിക്കാത്തതുമാണ്.
