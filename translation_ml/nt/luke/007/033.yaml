  to: 'കാരണം, സ്നാപകനായ യോഹന്നാൻ അപ്പം തിന്നാതെയും വീഞ്ഞ് കുടിക്കാതെയും വന്നിരിക്കുന്നു; നിങ്ങൾ പറയുന്നു: “അവന് ഒരു ഭൂതമുണ്ട്.”[a]'
