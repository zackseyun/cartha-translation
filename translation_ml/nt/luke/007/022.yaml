id: LUK.7.22
reference: Luke 7:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: ml
  text: 'അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു: “നിങ്ങൾ പോയി കണ്ടതും കേട്ടതും യോഹന്നാനെ അറിയിക്കുവിൻ: അന്ധർക്ക് കാഴ്ച ലഭിക്കുന്നു[a], മുടന്തർ നടക്കുന്നു, കുഷ്ഠരോഗികൾ ശുദ്ധരാക്കപ്പെടുന്നു, ബധിരർ കേൾക്കുന്നു, മരിച്ചവർ ഉയിർപ്പിക്കപ്പെടുന്നു, ദരിദ്രർക്കു സുവാർത്ത അറിയിക്കപ്പെടുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അന്ധർ വീണ്ടും കാണുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘മേലോട്ടു നോക്കുക’ എന്ന അർഥവും, കാഴ്ച പ്രാപിക്കുകയോ വീണ്ടെടുക്കുകയോ ചെയ്യുക എന്ന അർഥവും വരാം; ഇവിടെ കാഴ്ച ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, “ദരിദ്രർക്കു സുവാർത്ത പ്രസംഗിക്കപ്പെടുന്നു.” ഗ്രീക്കിൽ ഇത് കർമണിപ്രയോഗമാണ്: ദരിദ്രർക്കു സുവാർത്ത പ്രഖ്യാപിക്കപ്പെടുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: മറുപടിയായി
  rationale: യേശു യോഹന്നാന്റെ ദൂതന്മാരുടെ ചോദ്യത്തോടു പ്രതികരിക്കുന്നുവെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Πορευθέντες
  choice: നിങ്ങൾ പോയി
  rationale: പ്രധാന കല്പനയോടൊപ്പം ചേർന്നുനിൽക്കുന്ന ഗ്രീക്ക് കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ അനുബന്ധക്രിയയായി നൽകുന്നു.
- source_word: ἀπαγγείλατε
  choice: അറിയിക്കുവിൻ
  rationale: ദൂതന്മാർ കണ്ടും കേട്ടും മനസ്സിലാക്കിയ കാര്യങ്ങൾ യോഹന്നാന്റെ അടുക്കൽ മടങ്ങിച്ചെന്ന് അറിയിക്കണമെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: കണ്ടതും കേട്ടതും
  rationale: ബന്ധവാക്യത്തിന്റെ സമാന്തരഘടന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: അന്ധർക്ക് കാഴ്ച ലഭിക്കുന്നു
  rationale: ἀναβλέπω ഇവിടെ കാഴ്ച പ്രാപിക്കുന്നതിനെയോ വീണ്ടെടുക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; മുൻപ് കാഴ്ചയുണ്ടായിരുന്നുവെന്ന് നിർബന്ധമായി വിധിക്കാതെ ആശയം നൽകുന്നു.
- source_word: χωλοὶ περιπατοῦσιν
  choice: മുടന്തർ നടക്കുന്നു
  rationale: വിശേഷണനാമവും ക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള, സാധാരണ മലയാളരൂപം.
- source_word: λεπροὶ καθαρίζονται
  choice: കുഷ്ഠരോഗികൾ ശുദ്ധരാക്കപ്പെടുന്നു
  rationale: καθαρίζονται-യിലെ രോഗസൗഖ്യത്തോടൊപ്പം ആചാരപരമായ ശുദ്ധീകരണത്തിന്റെ സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: κωφοὶ ἀκούουσιν
  choice: ബധിരർ കേൾക്കുന്നു
  rationale: ἀκούουσιν എന്ന ക്രിയയോടൊപ്പം κωφοί ഇവിടെ കേൾവിയില്ലാത്തവരെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ വിവർത്തനം വ്യക്തമാണ്.
- source_word: νεκροὶ ἐγείρονται
  choice: മരിച്ചവർ ഉയിർപ്പിക്കപ്പെടുന്നു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗവും വെളിപ്പെടുത്താത്ത പ്രവർത്തകത്വവും സംരക്ഷിക്കുന്നു.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: ദരിദ്രരോടു സുവാർത്ത അറിയിക്കപ്പെടുന്നു
  rationale: εὐαγγελίζονται എന്ന കർമണിരൂപം നിലനിർത്തിക്കൊണ്ട്, സഭാപരമായ സാങ്കേതികപദം ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ നൽകുന്നു.
theological_decisions:
- issue: അത്ഭുതങ്ങളുടെ പട്ടിക യേശുവിന്റെ വ്യക്തിത്വത്തിന്റെയും ദൗത്യത്തിന്റെയും തെളിവായി പ്രവർത്തിക്കുന്നത്
  choice: പുനഃസ്ഥാപനപ്രവൃത്തികളെ നേരിട്ട് വിവരിക്കുന്നു; മുഖ്യവാചകത്തിൽ അവയെ വ്യക്തമായി ‘മശീഹാസംബന്ധമായ പ്രവചനനിവൃത്തി’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
  alternative: യെശയ്യാവിലെ സൂചനകൾ വ്യക്തമാക്കി ‘പ്രവചനങ്ങൾ നിറവേറുന്നു’ എന്ന ആശയം വിവർത്തനത്തിൽ ചേർക്കുക.
  rationale: വാക്യം തന്നെയാണ് യേശുവിന്റെ പ്രവൃത്തികളെ യോഹന്നാനോടു നൽകേണ്ട മറുപടിയായി അവതരിപ്പിക്കുന്നത്. പ്രവാചകസൂചനകൾ തിരിച്ചറിയാവുന്ന പദാവലിയിലൂടെ നിലനിൽക്കുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനനിഗമനം ചേർക്കുന്നില്ല.
- issue: കർമണിപ്രയോഗങ്ങളുടെ പ്രവർത്തകൻ
  choice: ‘ശുദ്ധരാക്കപ്പെടുന്നു,’ ‘ഉയിർപ്പിക്കപ്പെടുന്നു,’ ‘അറിയിക്കപ്പെടുന്നു’ എന്നീ കർമണിരൂപങ്ങൾ ഉപയോഗിച്ച് പ്രവർത്തകനെ വ്യക്തമാക്കാതെ വിടുന്നു.
  alternative: ‘ദൈവം മരിച്ചവരെ ഉയിർപ്പിക്കുന്നു’ അല്ലെങ്കിൽ ‘ഞാൻ ദരിദ്രരോടു സുവാർത്ത അറിയിക്കുന്നു’ എന്നിങ്ങനെ പ്രവർത്തകനെ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് മൂലപാഠം പ്രവർത്തകനെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവമോ യേശുവോ എന്നു വിവർത്തനത്തിൽ തുറന്നുപറയുന്നത് മൂലപാഠത്തിന് അതീതമായ വ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അറിയിക്കുവിൻ’ എന്നത് വചനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ബഹുവചന കല്പനാരൂപമാണ്. അത്ഭുതങ്ങളുടെ സമാന്തര പട്ടികയും മൂലത്തിലെ കർമണിപ്രയോഗങ്ങളും സാധ്യമായത്ര സംരക്ഷിച്ചിട്ടുണ്ട്.
