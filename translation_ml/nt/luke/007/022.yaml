  source_fidelity: 'മുഖ്യവാചകം ഗ്രീക്ക് പാഠത്തിന്റെ ഘടനയും അർഥവും നന്നായി പകർന്നുനൽകുന്നു: യേശുവിന്റെ പ്രതികരണം, യോഹന്നാനോടുള്ള അറിയിപ്പ്, അത്ഭുതങ്ങളുടെ പട്ടിക, കൂടാതെ καθαρίζονται, ἐγείρονται, εὐαγγελίζονται എന്നീ കർമണിരൂപങ്ങളും സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു. ‘ദരിദ്രരോടു’ എന്ന പ്രയോഗം അർഥത്തിൽ ശരിയാണെങ്കിലും πτωχοὶ-യുടെ സ്വീകരണ-കേന്ദ്രിത കർമണിഭാവം ‘ദരിദ്രർക്കു’ എന്ന രൂപത്തിൽ കൂടുതൽ നേരിട്ടു തെളിയും.'
  naturalness: ‘ദരിദ്രർക്കു സുവാർത്ത അറിയിക്കപ്പെടുന്നു’ ആധുനിക നിലവാരമലയാളത്തിൽ ‘ദരിദ്രരോടു സുവാർത്ത അറിയിക്കപ്പെടുന്നു’ എന്നതിനെക്കാൾ സ്വാഭാവികവും വ്യക്തവുമാണ്. മറ്റു വാക്യഘടകങ്ങൾ മാന്യവും വായനാസുഗമവുമാണ്.
  terminology: ‘അന്ധർ,’ ‘മുടന്തർ,’ ‘കുഷ്ഠരോഗികൾ,’ ‘ബധിരർ,’ ‘ഉയിർപ്പിക്കപ്പെടുന്നു,’ ‘സുവാർത്ത’ എന്നിവ സന്ദർഭത്തിനും വേദപുസ്തക രജിസ്റ്ററിനും യോജിക്കുന്നു. ‘ശുദ്ധരാക്കപ്പെടുന്നു’ καθαρίζονται-യിലെ ശുദ്ധീകരണസൂചന നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് b-യിലെ ‘സുവാർത്ത കേൾക്കുന്നവരാകുന്നു’ എന്ന വിശദീകരണം പ്രഖ്യാപിക്കപ്പെടുന്നു എന്ന ക്രിയയുടെ ശക്തി കുറയ്ക്കുന്നതിനാൽ തിരുത്തണം.
  issues:
  - severity: low
    issue: ദരിദ്രരോടു → ദരിദ്രർക്കു
    rationale: ഗ്രീക്കിലെ πτωχοὶ εὐαγγελίζονται എന്ന കർമണിപ്രയോഗത്തിൽ ദരിദ്രർ അറിയിപ്പിന്റെ സ്വീകർത്താക്കളാണ്. ‘ദരിദ്രർക്കു സുവാർത്ത അറിയിക്കപ്പെടുന്നു’ എന്നത് ആ ബന്ധം മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
