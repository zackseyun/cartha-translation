    rationale: ‘ദരിദ്രർ സുവാർത്ത കേൾക്കുന്നവരാകുന്നു’ എന്നത് പ്രഖ്യാപനം/അറിയിപ്പ് എന്ന εὐαγγελίζω-യുടെ അർഥത്തെ കേൾവിയിലേക്കു ചുരുക്കുന്നു. ഗ്രീക്കിൽ സുവാർത്ത അവർക്കു പ്രഖ്യാപിക്കപ്പെടുന്നു എന്നതാണ്.
