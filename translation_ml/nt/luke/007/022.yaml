    rationale: ἀναβλέπω-യ്ക്ക് ‘വീണ്ടും കാണുക/കാഴ്ച പ്രാപിക്കുക’ എന്ന സന്ദർഭാർഥത്തോടൊപ്പം ‘മേലോട്ടു നോക്കുക’ എന്ന അടിസ്ഥാനാർഥവും ഉണ്ടാകാം. ഇവിടെ സന്ദർഭം കാഴ്ച പ്രാപിക്കുന്നതാണെന്ന് വ്യക്തമായി പറയുന്നതാണ് കൂടുതൽ കൃത്യം.
  revised_text: 'അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു: “നിങ്ങൾ പോയി കണ്ടതും കേട്ടതും യോഹന്നാനെ അറിയിക്കുവിൻ: അന്ധർക്ക് കാഴ്ച ലഭിക്കുന്നു[a], മുടന്തർ നടക്കുന്നു, കുഷ്ഠരോഗികൾ ശുദ്ധരാക്കപ്പെടുന്നു, ബധിരർ കേൾക്കുന്നു, മരിച്ചവർ ഉയിർപ്പിക്കപ്പെടുന്നു, ദരിദ്രർക്കു സുവാർത്ത അറിയിക്കപ്പെടുന്നു[b].”'
  revised_footnotes:
  - marker: a
    text: അഥവാ, “അന്ധർ വീണ്ടും കാണുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘മേലോട്ടു നോക്കുക’ എന്ന അർഥവും, കാഴ്ച പ്രാപിക്കുകയോ വീണ്ടെടുക്കുകയോ ചെയ്യുക എന്ന അർഥവും വരാം; ഇവിടെ കാഴ്ച ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, “ദരിദ്രർക്കു സുവാർത്ത പ്രസംഗിക്കപ്പെടുന്നു.” ഗ്രീക്കിൽ ഇത് കർമണിപ്രയോഗമാണ്: ദരിദ്രർക്കു സുവാർത്ത പ്രഖ്യാപിക്കപ്പെടുന്നു.'
