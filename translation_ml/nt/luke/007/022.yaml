  revision_rationale: 'മുഖ്യവാക്യത്തിൽ ഒരു ചെറിയ സ്വാഭാവികത-തിരുത്തൽ മാത്രം വരുത്തി: ‘ദരിദ്രരോടു’ എന്നതിന് പകരം ‘ദരിദ്രർക്കു’ ഉപയോഗിച്ചു. ഇതിലൂടെ ഗ്രീക്കിലെ കർമണിരൂപത്തിന്റെ സ്വീകർത്തൃബന്ധം കൂടുതൽ തെളിയുന്നു. രണ്ടു അടിക്കുറിപ്പുകളും ലെക്സിക്കൽ/വ്യാകരണവിവരണം കൂടുതൽ കൃത്യമായി നൽകുന്നതിനായി പരിഷ്കരിച്ചു; അർഥത്തിലോ വ്യാഖ്യാനപരമായ അവകാശവാദങ്ങളിലോ മാറ്റമില്ല.'
