id: LUK.7.30
reference: Luke 7:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: ml
  text: എന്നാൽ പരീശന്മാരും ന്യായപ്രമാണപണ്ഡിതന്മാരും യോഹന്നാനാൽ സ്നാനം ഏൽക്കാതെ, തങ്ങളെ സംബന്ധിച്ചുള്ള ദൈവത്തിന്റെ ഉദ്ദേശ്യം[a] നിരസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തങ്ങൾക്കുവേണ്ടിയുള്ള ദൈവത്തിന്റെ ഉദ്ദേശ്യം” എന്നും “തങ്ങൾക്കെതിരായ ദൈവത്തിന്റെ ആലോചന” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: νομικοὶ
  choice: ന്യായപ്രമാണപണ്ഡിതന്മാർ
  rationale: ഇവിടെ νομικοί മോശെയുടെ ന്യായപ്രമാണത്തിൽ വിദഗ്ധരായവരെ സൂചിപ്പിക്കുന്നു. ‘ന്യായപ്രമാണപണ്ഡിതന്മാർ’ എന്നത് ‘അഭിഭാഷകർ’ എന്ന ആധുനിക നിയമവൃത്തി അർത്ഥം ഒഴിവാക്കുകയും ‘ശാസ്ത്രിമാർ’ എന്ന വേറിട്ട കൂട്ടവുമായി ഇവരെ കലർത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: βουλὴν
  choice: ഉദ്ദേശ്യം
  rationale: βουλή എന്നതിന് ഉദ്ദേശ്യം, പദ്ധതി, ആലോചന എന്നീ അർത്ഥങ്ങൾ വരാം. ഈ സന്ദർഭത്തിൽ ‘ഉദ്ദേശ്യം’ സ്വാഭാവികവും വ്യക്തവുമാണ്; ദൈവത്തിന്റെ ഉദ്ദേശ്യത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ ചോദ്യങ്ങൾ ഇത് അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: ἠθέτησαν
  choice: നിരസിച്ചു
  rationale: ἀθετέω ഇവിടെ തള്ളിക്കളയുക, അംഗീകരിക്കാതിരിക്കുക എന്ന ആശയം നൽകുന്നു. ‘നിരസിച്ചു’ അവരുടെ പ്രതികരണത്തെ നേരിട്ടും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: εἰς ἑαυτούς
  choice: തങ്ങളെ സംബന്ധിച്ചുള്ള
  rationale: εἰς ἑαυτούς എന്ന പ്രയോഗത്തിന്റെ വ്യക്തിപരമായ ബന്ധം ഇത് കാത്തുസൂക്ഷിക്കുന്നു; ‘തങ്ങൾക്കുവേണ്ടിയുള്ള’ എന്ന ഗുണകരമായ അർത്ഥമോ ‘തങ്ങൾക്കെതിരായ’ എന്ന വിധിപരമായ അർത്ഥമോ മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: യോഹന്നാനാൽ സ്നാനം ഏൽക്കാതെ
  rationale: നിഷേധാത്മകമായ എയോറിസ്റ്റ് പാസീവ് പാർട്ടിസിപ്പിളിനെ മലയാളത്തിൽ സ്വാഭാവികമായ സാഹചര്യപ്രയോഗമായി നൽകുന്നു. ‘കാരണം’ എന്ന് ചേർക്കാതെ അതിന്റെ കൃത്യമായ ബന്ധത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: αὐτοῦ
  choice: യോഹന്നാനാൽ
  rationale: ഗ്രീക്കിൽ സർവനാമമാണെങ്കിലും തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ അത് യോഹന്നാനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് വ്യക്തമാക്കി.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ യോഹന്നാന്റെ സ്നാനം സ്വീകരിച്ചവരോടുള്ള വ്യക്തമായ വൈരുധ്യം ‘എന്നാൽ’ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: പരീശന്മാരോടും ന്യായപ്രമാണപണ്ഡിതന്മാരോടും ബന്ധപ്പെട്ട ദൈവത്തിന്റെ βουλή എന്നതിന്റെ അർത്ഥം
  choice: തങ്ങളെ സംബന്ധിച്ചുള്ള ദൈവത്തിന്റെ ഉദ്ദേശ്യം
  alternative: തങ്ങൾക്കുവേണ്ടിയുള്ള ദൈവത്തിന്റെ ഉദ്ദേശ്യം; തങ്ങൾക്കെതിരായ ദൈവത്തിന്റെ ആലോചന
  rationale: ഈ പരിഭാഷ ദൈവത്തിന്റെ ഉദ്ദേശ്യം അവരുമായി വ്യക്തിപരമായി ബന്ധപ്പെട്ടിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നു; എന്നാൽ അത് മാറ്റാനാവാത്ത ദൈവനിശ്ചയമായിരുന്നോ, അവർക്കുവേണ്ടിയുള്ള രക്ഷാകരമായ പദ്ധതിയായിരുന്നോ, അവർക്കെതിരായ ആലോചനയായിരുന്നോ എന്ന് വാചകത്തിനു മീതെ ചെന്നു തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ന്യായപ്രമാണപണ്ഡിതന്മാർ’ എന്ന സഭാപരിചിത പദം νομικοί എന്നതിന്റെ പ്രത്യേക അർത്ഥം കാത്തുസൂക്ഷിക്കുന്നു. പരാമർശത്തിന്റെ വ്യക്തതയ്ക്കായി αὐτοῦ എന്ന സർവനാമം മുഖ്യവാചകത്തിൽ ‘യോഹന്നാനാൽ’ എന്നു വ്യക്തമാക്കി; അതിനാൽ അതിനായി വേറെ അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല.
