id: LUK.7.5
reference: Luke 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀγαπᾷ γὰρ τὸ ἔθνος ἡμῶν καὶ τὴν συναγωγὴν αὐτὸς ᾠκοδόμησεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: ml
  text: കാരണം, അവൻ നമ്മുടെ ജനതയെ സ്നേഹിക്കുന്നു; അവൻ തന്നെയാണ് നമുക്കുവേണ്ടി യഹൂദപ്പള്ളി പണിതത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നമുക്കുവേണ്ടി യഹൂദപ്പള്ളി പണിയിച്ചുതന്നു.” ഗ്രീക്കിൽ “പണിതു” എന്നു മാത്രമാണ് പറയുന്നത്; അവൻ നേരിട്ട് നിർമാണത്തിൽ പങ്കെടുത്തു എന്നോ, അതിന്റെ നിർമാണച്ചെലവ് വഹിച്ചു എന്നോ ഇതു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: സ്നേഹിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ ശക്തമായ അനുകൂല മനോഭാവം നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ അപേക്ഷയ്ക്കുള്ള മൂപ്പന്മാരുടെ വിശദീകരണകാരണം വ്യക്തമാക്കുന്നു.
- source_word: τὸ ἔθνος ἡμῶν
  choice: നമ്മുടെ ജനതയെ
  rationale: സ്വന്തം യഹൂദസമൂഹത്തെ വംശീയ-സാമൂഹിക കൂട്ടായ്മയായി സൂചിപ്പിക്കുന്ന ἔθνος എന്ന പദത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: τὴν συναγωγήν
  choice: പള്ളി
  rationale: മലയാളത്തിൽ യഹൂദരുടെ ആരാധനാസ്ഥലത്തെ സൂചിപ്പിക്കാൻ സ്വാഭാവികമായി ഉപയോഗിക്കാവുന്ന പദം; ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘നമ്മുടെ പള്ളി’ എന്ന് വികസിപ്പിച്ചിട്ടില്ല.
- source_word: αὐτὸς
  choice: അവൻതന്നെയാണ്
  rationale: പ്രവർത്തനം അവൻതന്നെ ഏറ്റെടുത്തുവെന്ന ഗ്രീക്കിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ᾠκοδόμησεν
  choice: പണിതു
  rationale: അഓറിസ്റ്റിനെ ലളിതമായ ഭൂതകാലക്രിയയായി പരിഭാഷപ്പെടുത്തുന്നു; നേരിട്ട് പണിതതോ ചെലവു വഹിച്ചു പണിയിച്ചതോ എന്ന് മുഖ്യവാചകം നിർണയിക്കുന്നില്ല.
- source_word: ἡμῖν
  choice: നമുക്കുവേണ്ടി
  rationale: സമൂഹത്തിന്റെ പ്രയോജനത്തിനായുള്ള ദാതിവ് അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
