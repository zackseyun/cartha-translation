translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. γὰρ എന്ന ബന്ധം ‘കാരണം’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു; αὐτός എന്ന ഊന്നൽ ‘അവൻതന്നെയാണ്’ എന്നു സംരക്ഷിച്ചിരിക്കുന്നു. ‘പണിതു’ എന്നതിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
