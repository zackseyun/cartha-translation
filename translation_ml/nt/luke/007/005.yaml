  to: കാരണം, അവൻ നമ്മുടെ ജനതയെ സ്നേഹിക്കുന്നു; അവൻ തന്നെയാണ് നമുക്കുവേണ്ടി യഹൂദപ്പള്ളി പണിതത്.[a]
