  naturalness: The proposed revision is fluent, modern standard Malayalam. Placing ‘അവൻ തന്നെയാണ്’ before the building clause gives the Greek emphatic pronoun a more natural Malayalam expression.
  terminology: ‘യഹൂദപ്പള്ളി’ clearly denotes a synagogue in this historical context while retaining an established Malayalam term for a Jewish place of worship. The note preserves the source’s non-specificity about whether the centurion built personally or as patron.
  issues:
