id: LUK.7.28
reference: Luke 7:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളോടു പറയുന്നു: സ്ത്രീകളിൽനിന്നു ജനിച്ചവരിൽ യോഹന്നാനെക്കാൾ വലിയവൻ ആരുമില്ല[a]. എങ്കിലും ദൈവരാജ്യത്തിൽ ഏറ്റവും ചെറിയവൻ അവനെക്കാൾ വലിയവനാണ്.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സ്ത്രീകളിൽനിന്നു ജനിച്ചവർ” എന്നത് മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “ദൈവരാജ്യത്തിൽ ഏറ്റവും ചെറിയവനായിരിക്കുന്നവൻ.” ഗ്രീക്കിലെ പ്രയോഗം ഇങ്ങനെ കൂടുതൽ വിശദമായി പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള നേരിട്ടുള്ള പ്രഭാഷണസൂത്രം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μείζων
  choice: വലിയവൻ
  rationale: മഹത്വത്തിന്റെ അടിസ്ഥാനം വ്യക്തമാക്കാതെ താരതമ്യാർത്ഥം നിലനിർത്തുന്നു.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: സ്ത്രീകളിൽനിന്നു ജനിച്ചവരിൽ
  rationale: മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ സെമിറ്റിക് സ്വഭാവം സംരക്ഷിക്കുന്ന, മലയാളത്തിൽ മനസ്സിലാകുന്ന പരിഭാഷ.
- source_word: Ἰωάννου
  choice: യോഹന്നാനെക്കാൾ
  rationale: പേരിന്റെ പതിവ് മലയാള ബൈബിൾരൂപം ഉപയോഗിച്ച് ഗ്രീക്ക് താരതമ്യനിർമാണം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐδείς ἐστιν
  choice: ആരുമില്ല
  rationale: അസ്തിത്വനിഷേധം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ὁ δὲ μικρότερος
  choice: എങ്കിലും ... ഏറ്റവും ചെറിയവൻ
  rationale: നാമവൽക്കരിച്ച താരതമ്യരൂപവും δέയുടെ വൈരുധ്യഭാവവും സ്വാഭാവികമായി നൽകുന്നു; വ്യക്തിയെയാണു സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിൽ
  rationale: മലയാളത്തിലെ പരിചിതമായ ബൈബിൾപ്രയോഗവും ἐν എന്നതിന്റെ സ്ഥാനസൂചനയും നിലനിർത്തുന്നു.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: അവനെക്കാൾ വലിയവനാണ്
  rationale: αὐτοῦ യോഹന്നാനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന താരതമ്യം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; 'വലിയ' എന്നതിന്റെ മാനദണ്ഡം നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: യോഹന്നാനും ദൈവരാജ്യത്തിലെ ഏറ്റവും ചെറിയവനും തമ്മിലുള്ള താരതമ്യത്തിന്റെ അടിസ്ഥാനം
  choice: മഹത്വം പദവിയെയോ ആനുകൂല്യത്തെയോ ധാർമിക/ആത്മീയ മേന്മയെയോ രക്ഷാചരിത്രസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നുവെന്ന് തീരുമാനിക്കാതെ വാക്യത്തിലെ വൈരുധ്യാത്മക താരതമ്യം നിലനിർത്തി.
  alternative: ഇത് ഉടമ്പടിപരമായ ആനുകൂല്യം, ധാർമിക/ആത്മീയ മേന്മ, അല്ലെങ്കിൽ മാനമര്യാദാ പശ്ചാത്തലത്തിലുള്ള അതിശയോക്തി എന്നു വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം താരതമ്യം പ്രസ്താവിക്കുന്നുവെങ്കിലും മഹത്വത്തിന്റെ കൃത്യമായ അടിസ്ഥാനം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്ത്രീകളിൽനിന്നു ജനിച്ചവർ,’ ‘ദൈവരാജ്യം’ എന്നീ ബൈബിൾപ്രയോഗങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; അപരിചിതമായ പഴയ പദക്രമവും വിഭാഗീയ വ്യാഖ്യാനവും ഒഴിവാക്കി.
