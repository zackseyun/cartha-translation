id: LUK.7.4
reference: Luke 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: ml
  text: 'അവർ യേശുവിന്റെ അടുക്കൽ വന്ന് അദ്ദേഹത്തോട് വളരെ ആത്മാർഥമായി അപേക്ഷിച്ചുകൊണ്ട് പറഞ്ഞു: “അങ്ങ് ഇത് ചെയ്തുകൊടുക്കാൻ അദ്ദേഹം അർഹനാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: അടുക്കൽ വന്ന്
  rationale: ക്രിയാവിശേഷണരൂപം എത്തിച്ചേരുന്നതിനെയും സന്നിഹിതരാകുന്നതിനെയും സൂചിപ്പിക്കുന്നു; യേശുവിലേക്കുള്ള വരവ് സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρεκάλουν
  choice: അപേക്ഷിച്ചു
  rationale: ഈ സന്ദർഭത്തിലെ ആദരപൂർവവും ശക്തവുമായ അഭ്യർഥനയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σπουδαίως
  choice: വളരെ ആത്മാർഥമായി
  rationale: അഭ്യർഥനയുടെ ഗൗരവവും തീക്ഷ്ണതയും അതിശയോക്തിയില്ലാതെ നൽകുന്നു.
- source_word: Ἄξιός
  choice: തക്കവനാണ്
  rationale: ആ വ്യക്തി അഭ്യർഥിച്ച സഹായം ലഭിക്കാൻ യോഗ്യനോ അർഹനോ ആണെന്ന വിലയിരുത്തൽ ഈ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ᾧ
  choice: അദ്ദേഹം
  rationale: ബന്ധസർവനാമത്തിന്റെ ദ്വിതീയാർഥബന്ധം മലയാളവാക്യഘടനയിൽ ക്രിയയുടെ കർത്താവായി പുനഃക്രമീകരിച്ചാണ് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നത്.
- source_word: παρέξῃ
  choice: അങ്ങ് ... ചെയ്തുകൊടുക്കാൻ
  rationale: παρέχω ഇവിടെ അഭ്യർഥിച്ച കാര്യം ഒരാൾക്കുവേണ്ടി ചെയ്തുകൊടുക്കുക എന്ന വിശാലമായ അർഥത്തിലാണ്; ആദരസൂചകമായ ‘അങ്ങ്’ അപേക്ഷയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: τοῦτο
  choice: ഇത്
  rationale: മുൻസന്ദർഭത്തിൽ ആവശ്യപ്പെട്ട പ്രവൃത്തിയിലേക്കുള്ള നിർദ്ദേശം വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ അർഥബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാകാൻ അവസാന ഉപവാക്യം ‘അങ്ങ് ഇത് ചെയ്തുകൊടുക്കാൻ തക്കവനാണ് അദ്ദേഹം’ എന്നു പുനഃക്രമീകരിച്ചു.
