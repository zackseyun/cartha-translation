reference: Luke 7:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞാൻ നിന്നോടു പറയുന്നു: അവളുടെ അനേകം പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു; കാരണം അവൾ വളരെ സ്നേഹിച്ചു.[a] എന്നാൽ അല്പം ക്ഷമ ലഭിക്കുന്നവൻ അല്പം സ്നേഹിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അതുകൊണ്ടാണ് അവൾ വളരെ സ്നേഹിച്ചത്.” ഇവിടെയുള്ള ഗ്രീക്ക് ബന്ധപദം, അവളുടെ സ്നേഹം ക്ഷമ ലഭിച്ചതിന്റെ കാരണമെന്നതിലുപരി അവൾ ക്ഷമിക്കപ്പെട്ട അവസ്ഥയുടെ തെളിവാണെന്ന് ഊന്നുന്ന വിധത്തിലും മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀφέωνται
  choice: ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന perfect passive ഭാവം നിലനിർത്തുന്നു.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: അവളുടെ അനേകം പാപങ്ങൾ
  rationale: ഗ്രീക്കിലെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഗ്രീക്ക് സംയോജകത്തിന്റെ നേരിട്ടുള്ള കാരണസൂചന സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിലെ വ്യാഖ്യാനസമ്മർദം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἠγάπησεν πολύ
  choice: അവൾ വളരെ സ്നേഹിച്ചു
  rationale: aorist ക്രിയയുടെ ലളിതമായ ഭൂതകാലഭാവവും πολύ എന്നതിന്റെ അളവുസൂചനയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ᾧ δὲ
  choice: എന്നാൽ ... ആൾ
  rationale: ലിംഗവിശേഷം അനാവശ്യമായി ചേർക്കാതെ പൊതുവായ ഏകവചനസൂചന നൽകുന്നു.
- source_word: ὀλίγον ἀφίεται / ὀλίγον ἀγαπᾷ
  choice: അല്പം ക്ഷമിക്കപ്പെടുന്നയാൾ അല്പം സ്നേഹിക്കുന്നു
  rationale: രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള ὀλίγον എന്ന ആവർത്തനവും പഴമൊഴിസദൃശമായ സമാന്തരതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സ്ത്രീയുടെ സ്നേഹം ക്ഷമയുടെ കാരണമാണോ അതിന്റെ തെളിവാണോ എന്ന ὅτι-യുടെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ ‘കാരണം’ എന്നു പരിഭാഷപ്പെടുത്തി ഗ്രീക്കിലെ കാരണരൂപവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
  alternative: ‘അതുകൊണ്ടാണ് അവൾ വളരെ സ്നേഹിച്ചത്’ എന്നു വായിച്ച് അവളുടെ സ്നേഹത്തെ ലഭിച്ച ക്ഷമയുടെ ഫലമോ തെളിവോ ആയി ഊന്നിക്കാട്ടാം.
  rationale: ഉപമയും 50-ാം വാക്യവും ക്ഷമ സ്നേഹത്തിന് മുമ്പുള്ളതാണെന്ന വായനയെ പിന്തുണയ്ക്കുമ്പോഴും, ഈ വാക്യത്തിലെ ὅτι സ്വാഭാവികമായി കാരണസൂചന നൽകാം. അതിനാൽ മുഖ്യപാഠം അത് മായ്ച്ചുകളയാതെ, മറ്റൊരു സാധ്യവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന രൂപം പൂർത്തിയായ ക്ഷമയുടെ ഇപ്പോഴത്തെ ഫലം വ്യക്തമാക്കുന്നു; ആവർത്തിച്ചുള്ള ‘അല്പം’ മൂലപാഠത്തിന്റെ സമാന്തരത നിലനിർത്തുന്നു.
