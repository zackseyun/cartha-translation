- source_word: φίλος
  choice: സ്നേഹിതൻ
  rationale: മുൻപുള്ള ആരോപണങ്ങളോടു ചേർന്നുള്ള വിധേയനാമത്തെ മാന്യവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τελωνῶν
  choice: ചുങ്കക്കാർ
  rationale: റോമൻ ഭരണവ്യവസ്ഥയിൽ നികുതി പിരിച്ചിരുന്നവരെ സൂചിപ്പിക്കുന്ന പരിചിതമായ ബൈബിൾപദം.
- source_word: ἁμαρτωλῶν
  choice: പാപികൾ
  rationale: എതിരാളികൾ ഉപയോഗിച്ച സാമൂഹിക-മതപരമായ മുദ്രയെ മൃദൂകരിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന യേശുവിന്റെ പദവി
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: ക്രിസ്തുശാസ്ത്രപരമായ പദവിയും അതിന്റെ പരമ്പരാഗത തിരിച്ചറിയലും അന്തർപാഠബന്ധത്തിനുള്ള സാധ്യതയും നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായി ഒറ്റ അർത്ഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: യേശുവിനെതിരായ ആരോപണങ്ങളുടെ ശക്തി
  choice: തീറ്റക്കാരനും മദ്യപനും
  alternative: അമിതഭോജിയും വീഞ്ഞുകുടിയനും
  rationale: ഇവ യേശുവിനെക്കുറിച്ചുള്ള വസ്തുനിഷ്ഠമായ വിവരണങ്ങളല്ല, എതിരാളികളുടെ നിന്ദാത്മകമായ ആരോപണങ്ങളാണ്. അതിനാൽ അവയുടെ മൂർച്ച മൃദൂകരിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ‘തീറ്റക്കാരൻ’, ‘മദ്യപൻ’ എന്നീ പദങ്ങൾ ഉദ്ധരിക്കപ്പെട്ട നിന്ദയുടെ മൂർച്ച നിലനിർത്തുന്നു; ‘മനുഷ്യപുത്രൻ’ എന്ന സ്ഥാപിത പദവി സംരക്ഷിച്ചിരിക്കുന്നു.
