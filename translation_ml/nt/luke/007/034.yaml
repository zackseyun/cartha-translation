- source_word: φάγος
  choice: തീറ്റക്കാരൻ
  rationale: അമിതമായി ഭക്ഷിക്കുന്നവനെക്കുറിച്ചുള്ള പരിഹാസപരവും നിന്ദാത്മകവുമായ ആരോപണം സാധാരണ മലയാളത്തിൽ നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: οἰνοπότης
  choice: മദ്യപൻ
