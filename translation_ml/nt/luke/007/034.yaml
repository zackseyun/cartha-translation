- source_word: ἐσθίων καὶ πίνων
  choice: തിന്നുകയും കുടിക്കുകയും ചെയ്തുകൊണ്ട്
  rationale: വരവിനോടൊപ്പമുള്ള പെരുമാറ്റരീതിയെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപങ്ങളുടെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: λέγετε
  choice: നിങ്ങൾ പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയിലെ വർത്തമാനകാലത്തെ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
