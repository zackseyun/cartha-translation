  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: ml
  text: 'മനുഷ്യപുത്രൻ ഭക്ഷിച്ചും കുടിച്ചും വന്നിരിക്കുന്നു; നിങ്ങൾ പറയുന്നു: ‘ഇതാ, ഒരു തീറ്റപ്രിയനും മദ്യപനും[a]—ചുങ്കക്കാരുടെയും പാപികളുടെയും സ്നേഹിതൻ!’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഇതാ, തീറ്റപ്രിയനും വീഞ്ഞുകുടിയനുമായ ഒരു മനുഷ്യൻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: വന്നിരിക്കുന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ പൂർണകാലരൂപം വരവ് സംഭവിച്ചുകഴിഞ്ഞതും അതിന്റെ പ്രസക്തി ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ ഭാവം നൽകുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
