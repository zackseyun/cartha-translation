revisions:
- from: എന്നാൽ നിങ്ങൾ എന്തു കാണാനാണ് പുറപ്പെട്ടുപോയത്? ഒരു പ്രവാചകനെയോ? അതെ, ഞാൻ നിങ്ങളോടു പറയുന്നു, ഒരു പ്രവാചകനെക്കാൾ വലിയവനെത്തന്നെ[a].
