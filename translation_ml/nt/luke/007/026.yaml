  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ എന്തു കാണാനാണ് പുറപ്പെട്ടുപോയത്? ഒരു പ്രവാചകനെയോ? അതെ, ഞാൻ നിങ്ങളോടു പറയുന്നു, ഒരു പ്രവാചകനെക്കാൾ വലിയവൻ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു പ്രവാചകനെക്കാൾ അധികമായവൻ.” ഗ്രീക്കിലെ താരതമ്യപ്രയോഗം ഇങ്ങനെയും നൽകാം; “ഒരു പ്രവാചകനെക്കാൾ വലിയവൻ” എന്നതാണ് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുമ്പത്തെ ആലങ്കാരിക ചോദ്യവുമായി വൈരുധ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാള സംയോജകം.
- source_word: τί
  choice: എന്തു
  rationale: ‘പുറപ്പെട്ടുപോയത്’ എന്ന ക്രിയയോടു ചേർന്ന ഉദ്ദേശ്യവാചകത്തിലെ കർമമായി വരുന്നതിനാൽ ‘എന്തിന്’ എന്നതല്ല, ‘എന്തു’ എന്നാണ് അർഥം.
- source_word: ἐξήλθατε
  choice: നിങ്ങൾ പുറപ്പെട്ടുപോയത്
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലെ ഭൂതകാലപ്രവൃത്തിയെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἰδεῖν
  choice: കാണാനാണ്
  rationale: ἐξήλθατε-യ്ക്കു പിന്നാലെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന അനന്തക്രിയയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: προφήτην
  choice: ഒരു പ്രവാചകനെയോ
  rationale: ആലങ്കാരിക ചോദ്യത്തിൽ കർമരൂപത്തിൽ വരുന്ന സാധാരണ നാമം; ‘-യോ?’ ചോദ്യം അതിന്റെ സംക്ഷിപ്തവും പ്രതീക്ഷാഭരിതവുമായ സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ναί
  choice: അതെ
  rationale: ആലങ്കാരിക ചോദ്യത്തിനുള്ള വ്യക്തവും ശക്തവുമായ സ്ഥിരീകരണം.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: സുവിശേഷങ്ങളിലെ നേരിട്ടുള്ള അഭിസംബോധനാസൂത്രം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καὶ περισσότερον προφήτου
  choice: ഒരു പ്രവാചകനെക്കാൾ വലിയവനെത്തന്നെ
  rationale: താരതമ്യത്തിന്റെ ഊന്നൽ ‘-നെത്തന്നെ’ മുഖേന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; യോഹന്നാന്റെ ശ്രേഷ്ഠതയുടെ കൃത്യസ്വഭാവം വാക്യത്തിലേക്ക് കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ വിവരണത്തിൽ സ്നാപകയോഹന്നാന്റെ സ്ഥാനവും വ്യക്തിത്വവും
  choice: യോഹന്നാൻ ഒരു പ്രവാചകനാണെന്നും ഒരു പ്രവാചകനെക്കാൾ വലിയവനാണെന്നും പ്രസ്താവിക്കുന്നു; ആ ശ്രേഷ്ഠതയുടെ കൃത്യസ്വഭാവം ഈ വാക്യത്തിൽ വിശദീകരിക്കുന്നില്ല.
  alternative: യോഹന്നാൻ ഏറ്റവും വലിയ പ്രവാചകനാണ്; അല്ലെങ്കിൽ, പ്രത്യേകമായി അന്ത്യകാല ദൂതനാണ്.
  rationale: മൂലത്തിലെ സംക്ഷിപ്ത താരതമ്യം നിലനിർത്തുകയും സമീപസന്ദർഭം നൽകുന്ന വിശദീകരണം ഈ വാക്യത്തിലേക്ക് മുൻകൂട്ടി ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ആവർത്തിച്ച ആലങ്കാരിക ചോദ്യത്തിന്റെ രൂപവും അവസാന താരതമ്യത്തിന്റെ ഊന്നലും സംരക്ഷിച്ചിട്ടുണ്ട്.
