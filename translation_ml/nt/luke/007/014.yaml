  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: ml
  text: 'അവൻ അടുത്തുചെന്ന് ശവമഞ്ചത്തിൽ[a] തൊട്ടു. അതു ചുമന്നിരുന്നവർ നിന്നു. അപ്പോൾ അവൻ പറഞ്ഞു: “യുവാവേ, ഞാൻ നിന്നോടു പറയുന്നു, എഴുന്നേൽക്കുക!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശവം വഹിക്കുന്ന മഞ്ചം” അല്ലെങ്കിൽ “ശവചുമട്ടുപലക.” ഗ്രീക്ക് പദം ശവസംസ്കാരയാത്രയിൽ മൃതദേഹം വഹിക്കാൻ ഉപയോഗിച്ചിരുന്ന മഞ്ചത്തെയോ ചട്ടക്കൂടിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: അടുത്തുചെന്ന്
  rationale: യേശു ശവസംസ്കാരയാത്രയുടെ അടുത്തേക്ക് ചെന്നതും തുടർന്ന് തൊട്ടതുമായ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἥψατο
  choice: തൊട്ടു
  rationale: സന്ദർഭത്തിൽ ക്രിയയുടെ സാധാരണ അർഥം കൃത്യമായി നൽകുന്നു; പിടിച്ചുവെന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: σοροῦ
  choice: ശവമഞ്ചത്തിൽ
  rationale: σορός ഇവിടെ മൃതദേഹം വഹിച്ചിരുന്ന തുറന്ന മഞ്ചത്തെയോ ചുമട്ടുപലകയെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക അടച്ച ശവപ്പെട്ടി എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: οἱ δὲ βαστάζοντες
  choice: അതു ചുമന്നിരുന്നവർ
  rationale: വഹിച്ചുകൊണ്ടിരുന്നവരെ ലിംഗം അനാവശ്യമായി വ്യക്തമാക്കാതെ ലളിതവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἔστησαν
  choice: നിന്നു
  rationale: അവർ നീക്കം നിർത്തി നിന്നുവെന്ന സന്ദർഭാർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: Νεανίσκε
  choice: യുവാവേ
  rationale: യുവപുരുഷനോടുള്ള നേരിട്ടുള്ള സംബോധനയെ മാന്യവും നിലവാരമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: σοὶ λέγω
  choice: ഞാൻ നിന്നോടു പറയുന്നു
  rationale: σοί എന്ന ഊന്നിയ ദത്തിവിനെയും വാക്കിന്റെ നേരിട്ടുള്ള ഗൗരവത്തെയും നിലനിർത്തുന്നു.
- source_word: ἐγέρθητι
  choice: എഴുന്നേൽക്കുക
  rationale: മരിച്ച യുവാവിനോടുള്ള നേരിട്ടുള്ള കല്പന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; കർത്തൃപ്രയോഗമോ കർമണി പ്രയോഗമോ എന്ന രൂപപരമായ സാധ്യതയിൽ അനാവശ്യ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: മരിച്ച യുവാവിനോടുള്ള യേശുവിന്റെ കല്പനയുടെ ഭാവം
  choice: “എഴുന്നേൽക്കുക” എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: “എഴുന്നേൽക്കൂ” അല്ലെങ്കിൽ “എഴുന്നേൽപ്പിക്കപ്പെടുക”
  rationale: ആദ്യത്തേത് കൂടുതൽ സംഭാഷണശൈലിയുള്ളതാണ്; രണ്ടാമത്തേത് ഗ്രീക്ക് രൂപത്തിന്റെ കർമണി സാധ്യത പ്രകടമാക്കിയാലും മലയാളത്തിലെ നേരിട്ടുള്ള കല്പനയായി അസ്വാഭാവികമാകും. തിരഞ്ഞെടുത്ത രൂപം യേശുവിന്റെ അധികാരവും സംഭവത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. “ശവമഞ്ചം” ചരിത്രസന്ദർഭം കാക്കുന്നു; കുറിപ്പിൽ കൂടുതൽ സുതാര്യമായ പദവികല്പങ്ങൾ നൽകിയിരിക്കുന്നു.
