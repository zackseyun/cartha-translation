  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀνεκάθισεν ὁ νεκρὸς καὶ ἤρξατο λαλεῖν, καὶ ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/015.yaml
  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: ml
  text: മരിച്ചവൻ എഴുന്നേറ്റ് ഇരുന്നു, സംസാരിക്കാൻ തുടങ്ങി; യേശു അവനെ അവന്റെ അമ്മയ്ക്കു കൊടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശു അവനെ അവന്റെ അമ്മയ്ക്കു തിരികെ കൊടുത്തു” / “യേശു അവനെ അവന്റെ അമ്മയ്ക്കു തിരിച്ചേൽപ്പിച്ചു.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “അവനെ അവന്റെ അമ്മയ്ക്കു കൊടുത്തു” എന്നാണ്; തിരികെ നൽകിയെന്ന അർഥം സന്ദർഭത്തിൽ സൂചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: എഴുന്നേറ്റിരുന്നു
  rationale: കിടന്ന നിലയിൽനിന്ന് എഴുന്നേറ്റ് ഇരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പൂർണമായി എഴുന്നേറ്റുനിന്നു എന്ന അർഥം ചേർക്കുന്നില്ല.
- source_word: ὁ νεκρός
  choice: മരിച്ചവൻ
  rationale: അക്ഷരാർഥത്തോടു ചേർന്നുനിൽക്കുന്നതും വ്യക്തിയെ മാന്യമായി സൂചിപ്പിക്കുന്നതുമായ പ്രയോഗമാണിത്; ‘മൃതശരീരം’ എന്നത് അനാവശ്യമായി വസ്തുവൽക്കരിക്കും.
- source_word: ἤρξατο λαλεῖν
  choice: സംസാരിക്കാൻ തുടങ്ങി
  rationale: ആരംഭത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന കൃത്യമായും സ്വാഭാവികമായും പകരുന്നു.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: യേശു അവനെ അവന്റെ അമ്മയ്ക്കു കൊടുത്തു
  rationale: ഗ്രീക്കിലെ ലളിതമായ ‘കൊടുത്തു’ എന്ന ക്രിയ നിലനിർത്തുന്നു. മലയാളത്തിൽ കർത്താവ് ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാകാൻ മുൻസന്ദർഭത്തിൽ സൂചിതനായ യേശുവിന്റെ പേര് ഉപയോഗിക്കുന്നു; ‘തിരികെ’ എന്ന പുനഃസ്ഥാപനഭാവം മുഖ്യവാചകത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: മകനെ അമ്മയ്ക്കു പുനഃസ്ഥാപിച്ചു എന്ന ആശയം ‘തിരികെ’ എന്നു വ്യക്തമാക്കി ചേർക്കണമോ
  choice: മുഖ്യവാചകത്തിൽ ‘അവനെ അവന്റെ അമ്മയ്ക്കു കൊടുത്തു’ എന്നു നിലനിർത്തുക
  alternative: ‘അവനെ അവന്റെ അമ്മയ്ക്കു തിരികെ കൊടുത്തു’ / ‘അവനെ അമ്മയ്ക്കു തിരിച്ചേൽപ്പിച്ചു’
  rationale: സന്ദർഭം പുനഃസ്ഥാപനത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠത്തിൽ ‘തിരികെ’ എന്ന ആശയം പ്രത്യേകം പ്രകടിപ്പിക്കുന്ന പദമില്ല. അതിനാൽ പാഠത്തിന്റെ ലളിതമായ രൂപം മുഖ്യവാചകത്തിൽ സൂക്ഷിച്ച് സന്ദർഭോചിതമായ മറ്റുവിവർത്തനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പുനരുത്ഥാനത്തിന്റെ അത്ഭുതസ്വഭാവം അധികവ്യാഖ്യാനം കൂടാതെ സംഭവക്രമത്തിലൂടെ പ്രകടമാക്കുന്നു.
