id: LUK.7.20
reference: Luke 7:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: ml
  text: 'ആ പുരുഷന്മാർ അവന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “സ്നാപകനായ യോഹന്നാൻ, ‘വരാനിരിക്കുന്നവൻ[a] നീ തന്നെയോ, അതോ ഞങ്ങൾ മറ്റൊരാളെ പ്രതീക്ഷിക്കണമോ?’ എന്ന് ചോദിച്ച് ഞങ്ങളെ നിന്റെ അടുക്കൽ അയച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വരുന്നവൻ.”
    reason: ഗ്രീക്ക് വർത്തമാനകാല കൃതന്തത്തിന്റെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള പരിഭാഷ.
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: അവന്റെ അടുക്കൽ വന്ന്
  rationale: അവരുടെ സമീപനത്തെ തുടർന്നുള്ള സംഭാഷണം സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οἱ ἄνδρες
  choice: ആ പുരുഷന്മാർ
  rationale: ἀνήρ ഇവിടെ പുരുഷന്മാരായ ദൂതന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: സ്നാപകനായ യോഹന്നാൻ
  rationale: പരക്കെ മനസ്സിലാകുന്ന പരമ്പരാഗത മലയാള പദവി ഉപയോഗിക്കുന്നു; യോഹന്നാന്റെ സ്നാനം നൽകുന്ന പങ്ക് വ്യക്തമാക്കുന്നു.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: ഞങ്ങളെ നിന്റെ അടുക്കൽ അയച്ചിരിക്കുന്നു. അദ്ദേഹം ചോദിക്കുന്നത്
  rationale: ഗ്രീക്കിലെ അയയ്ക്കലും സന്ദേശത്തിന്റെ ഉള്ളടക്കവും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി ബന്ധിപ്പിക്കുന്നു; അയയ്ക്കലിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി ‘അയച്ചിരിക്കുന്നു’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: ὁ ἐρχόμενος
  choice: വരാനിരിക്കുന്നവൻ
  rationale: വരവ് പ്രതീക്ഷിക്കപ്പെടുന്ന വ്യക്തി എന്ന അർഥവും സന്ദർഭത്തിലെ പദവിസ്വഭാവവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: ἄλλον προσδοκῶμεν
  choice: ഞങ്ങൾ മറ്റൊരാളെ പ്രതീക്ഷിക്കണമോ
  rationale: ἄλλον എന്നതിന്റെ വ്യക്തിപരമായ സൂചനയും προσδοκάω എന്നതിലെ പ്രതീക്ഷ/കാത്തിരിപ്പ് ഭാവവും നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ὁ ἐρχόμενος എന്ന പ്രയോഗത്തിന്റെ മശീഹാപരമായ പദവിസ്വഭാവം
  choice: വരാനിരിക്കുന്നവൻ
  alternative: വരുന്നവൻ
  rationale: പ്രയോഗത്തെ വെറും സാധാരണ ചലനമായി ചുരുക്കാതെ പ്രതീക്ഷിക്കപ്പെട്ട വ്യക്തിയിലേക്കുള്ള സൂചന നിലനിർത്തുന്നു; അതേസമയം ‘മശീഹാ’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ നേരിട്ടുള്ള ചോദ്യവും ‘നീ തന്നെയോ’ എന്ന ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
