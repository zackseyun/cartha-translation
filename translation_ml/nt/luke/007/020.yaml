  naturalness: The Malayalam is generally clear and appropriately dignified. Recasting the commission as “ഇങ്ങനെ പറഞ്ഞ് ... അയച്ചിരിക്കുന്നു” is more idiomatic and maintains the direct connection between John’s sending and the quoted question.
  terminology: “സ്നാപകനായ യോഹന്നാൻ” is a suitable established rendering. “വരാനിരിക്കുന്നവൻ” preserves the expectant/titular sense of ὁ ἐρχόμενος without adding an interpretive messianic label. The alternative “വരുന്നവൻ” is appropriately supplied in a footnote.
