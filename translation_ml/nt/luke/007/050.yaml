reference: Luke 7:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὴν γυναῖκα· Ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: ml
  text: 'അവൻ ആ സ്ത്രീയോടു പറഞ്ഞു: “നിന്റെ വിശ്വാസം നിന്നെ രക്ഷിച്ചിരിക്കുന്നു[a]; സമാധാനത്തോടെ പോകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്നെ സൗഖ്യമാക്കിയിരിക്കുന്നു.” ഗ്രീക്കിലെ ക്രിയയ്ക്ക് “രക്ഷിക്കുക,” “വിടുവിക്കുക,” “സൗഖ്യമാക്കുക” എന്നീ അർഥങ്ങൾ വരാം; എന്നാൽ ഇവിടെ സന്ദർഭം പാപമോചനത്തിനും രക്ഷയ്ക്കുമാണ് ഊന്നൽ നൽകുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς τὴν γυναῖκα
  choice: അവൻ ആ സ്ത്രീയോടു പറഞ്ഞു
  rationale: δέ ലളിതമായ ആഖ്യാനത്തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദമില്ലാതെയും ആ തുടർച്ച സ്വാഭാവികമായി നിലനിൽക്കുന്നു. γυνή ഇവിടെ രംഗത്തിലുള്ള സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: Ἡ πίστις σου
  choice: നിന്റെ വിശ്വാസം
  rationale: πίστις ഇവിടെ യേശുവിലുള്ള അവളുടെ ആശ്രയപൂർവമായ വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു. ‘വിശ്വാസം’ എന്നത് സ്വാഭാവികവും ദൈവശാസ്ത്രപരമായി അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാത്തതുമായ പരിഭാഷയാണ്.
- source_word: σέσωκέν σε
  choice: നിന്നെ രക്ഷിച്ചിരിക്കുന്നു
  rationale: σῴζω എന്ന ക്രിയയുടെ പൂർണകാലരൂപം പൂർത്തിയായ പ്രവൃത്തിയെയും അതിന്റെ നിലനിൽക്കുന്ന ഫലത്തെയും സൂചിപ്പിക്കുന്നു. പാപമോചനമാണ് സമീപസന്ദർഭത്തിന്റെ പ്രാധാന്യം; അതിനാൽ ‘രക്ഷിച്ചിരിക്കുന്നു’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: πορεύου εἰς εἰρήνην
  choice: സമാധാനത്തോടെ പോകുക
  rationale: ഗ്രീക്കിലെ ഈ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്; യാത്രയയപ്പിനോടൊപ്പം സമാധാനത്തിന്റെ അവസ്ഥയും ഇതു പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: σῴζω എന്നതിന്റെ അർഥം പാപമോചനത്തോടും രക്ഷയോടും എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നു
  choice: രക്ഷിച്ചിരിക്കുന്നു
  alternative: സൗഖ്യമാക്കിയിരിക്കുന്നു
  rationale: ലൂക്കോസ് 7:36–50-ലെ സന്ദർഭം ശാരീരിക സൗഖ്യത്തേക്കാൾ പാപമോചനത്തെയും സ്ത്രീയുടെ വിശ്വാസത്തെയും മുൻനിർത്തുന്നു. എങ്കിലും ക്രിയയുടെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് പൂർണകാലത്തിന്റെ നിലനിൽക്കുന്ന ഫലം ‘രക്ഷിച്ചിരിക്കുന്നു’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളിൽ marker a-യുടെ ഉള്ളടക്കവും സ്ഥാനവും തമ്മിൽ പൊരുത്തക്കേടുണ്ടായതിനാൽ, യഥാർഥ ഗ്രീക്ക് അർഥസാധ്യതയ്ക്ക് അനുസരിച്ച് σέσωκέν σε എന്ന ഭാഗത്താണ് ഏക അടിക്കുറിപ്പ് ചേർത്തത്.
