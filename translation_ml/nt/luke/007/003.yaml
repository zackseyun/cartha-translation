id: LUK.7.3
reference: Luke 7:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: ml
  text: യേശുവിനെക്കുറിച്ചു കേട്ടപ്പോൾ, തന്റെ അടിമയെ[a] രക്ഷിക്കാൻ വരണമെന്ന് യേശുവിനോട് അപേക്ഷിക്കാനായി അവൻ യെഹൂദന്മാരുടെ മൂപ്പന്മാരെ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദാസനെ.’ ഗ്രീക്ക് പദമായ δοῦλος (ദൂലോസ്) സന്ദർഭമനുസരിച്ച് ‘അടിമ’ എന്നോ ‘ദാസൻ’ എന്നോ അർഥമാക്കാം; ഇവിടെ സൂചിപ്പിക്കുന്ന ബന്ധിതമായ അധീനസ്ഥിതി വ്യക്തമാക്കാൻ ‘അടിമ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: കേട്ടപ്പോൾ
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുണ്ടായ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃദന്തത്തിന്റെ കാലസംബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ ഇത് നേരിയ വാക്യബന്ധകമാണ്; മലയാളത്തിലെ വാക്യപ്രവാഹം തന്നെ ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: യേശുവിനെക്കുറിച്ചു
  rationale: περί + genitive എന്ന ഘടനയുടെ ‘കുറിച്ച്/സംബന്ധിച്ച്’ എന്ന സാധാരണ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: യേശുവിനോട് ... അവൻ ... അയച്ചു
  rationale: ആരെയാണ് അയച്ചതെന്ന് തുടർന്നുള്ള പദസമുച്ചയം വ്യക്തമാക്കുന്നു; αὐτόν ആരെ സൂചിപ്പിക്കുന്നു എന്നത് മലയാളത്തിൽ ആശയക്കുഴപ്പം വരാതിരിക്കാൻ ‘യേശു’ എന്ന പേര് ആവർത്തിച്ചു.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ മൂപ്പന്മാരെ
  rationale: പ്രായംചെന്നവരെ മാത്രമല്ല, സമൂഹത്തിലെ അംഗീകൃത നേതാക്കളെയാണ് ഇവിടെ πρεσβύτεροι സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ genitive ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐρωτῶν αὐτὸν
  choice: യേശുവിനോട് അപേക്ഷിക്കാനായി
  rationale: ഈ സാഹചര്യത്തിൽ ἐρωτάω വിനീതമായ അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു; അയച്ചതിന്റെ ഉദ്ദേശ്യവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാകുന്നു.
- source_word: ὅπως ἐλθὼν
  choice: വരണമെന്ന്
  rationale: ὅπως ഘടനയിൽ അടങ്ങിയിരിക്കുന്ന അഭ്യർഥനയുടെ ഉള്ളടക്കം സ്വാഭാവികമായ മലയാള പരോക്ഷവാക്യമായി നൽകുന്നു.
- source_word: διασώσῃ
  choice: രക്ഷിക്കാൻ
  rationale: രോഗസാഹചര്യത്തിൽ ‘സുഖപ്പെടുത്തുക’ എന്ന ആശയം ഉൾപ്പെടാമെങ്കിലും, διασῴζω എന്ന പദത്തിന്റെ വിശാലമായ ‘രക്ഷിക്കുക/അപകടത്തിൽനിന്ന് വിടുവിക്കുക’ എന്ന അർഥം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: തന്റെ അടിമയെ
  rationale: ഇവിടെ δοῦλος ശതാധിപന്റെ അധികാരത്തിൻ കീഴിലുള്ള ബന്ധിത ഗൃഹാംഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാമൂഹികവും നിയമപരവുമായ അധീനസ്ഥിതി ‘അടിമ’ കൂടുതൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഗൃഹസംബന്ധമായ വിവരണത്തിൽ δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമ
  alternative: ദാസൻ
  rationale: ഈ സന്ദർഭത്തിലെ വ്യക്തി ശതാധിപന്റെ അധികാരത്തിൻ കീഴിലുള്ള ബന്ധിത ഗൃഹാംഗമാണ്. അതിനാൽ ചരിത്രപരമായ അധീനസ്ഥിതി മറച്ചുവയ്ക്കാതിരിക്കാൻ ‘അടിമ’ സ്വീകരിച്ചു; സേവനചുമതലയെ മുൻനിർത്തുന്ന പരമ്പരാഗത സാധ്യതയായ ‘ദാസൻ’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ‘രക്ഷിക്കാൻ’ എന്ന പ്രയോഗം രോഗശാന്തിയുടെ സന്ദർഭം ഉൾക്കൊള്ളുമ്പോഴും മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചേരേണ്ട ശരിയായ സ്ഥാനമായ ‘അടിമയെ’ എന്ന പദത്തിനു പിന്നാലെ [a] ചേർത്തിരിക്കുന്നു.
