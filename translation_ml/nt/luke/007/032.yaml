reference: Luke 7:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: ml
  text: 'അവർ ചന്തസ്ഥലത്ത് ഇരുന്ന് പരസ്പരം വിളിച്ചുപറയുന്ന കുട്ടികളെപ്പോലെയാണ്. അവർ പറയുന്നു: ‘ഞങ്ങൾ നിങ്ങൾക്കുവേണ്ടി കുഴൽ വായിച്ചു; നിങ്ങൾ നൃത്തം ചെയ്തില്ല. ഞങ്ങൾ വിലാപഗാനം പാടി[a]; നിങ്ങൾ കരഞ്ഞില്ല.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞങ്ങൾ വിലപിച്ചു.’ ഗ്രീക്ക് പദത്തിന് വിലപിക്കുക, പ്രത്യേകിച്ച് ശവസംസ്കാരവുമായി ബന്ധപ്പെട്ട വിലാപഗാനം ആലപിക്കുക, എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν παιδίοις
  choice: കുട്ടികളെപ്പോലെയാണ്
  rationale: ഉപമയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; παιδίοις എന്നത് പ്രായമോ ലിംഗമോ അനാവശ്യമായി നിർണയിക്കാതെ ‘കുട്ടികൾ’ എന്നു നൽകുന്നു.
- source_word: ἐν ἀγορᾷ καθημένοις
  choice: ചന്തസ്ഥലത്ത് ഇരുന്ന്
  rationale: ἀγορά പൊതുവായ ചന്തയെയോ തുറസ്സായ പൊതുസ്ഥലത്തെയോ സൂചിപ്പിക്കുന്നു; ദൃശ്യസന്ദർഭം ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: പരസ്പരം വിളിച്ചുപറയുന്ന
  rationale: വിളിച്ചോ അഭിസംബോധന ചെയ്തോ സംസാരിക്കുന്നതും ἀλλήλοις എന്ന പരസ്പരതയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: ഞങ്ങൾ നിങ്ങൾക്കുവേണ്ടി കുഴൽ വായിച്ചു
  rationale: αὐλέω കുഴൽ അഥവാ പൈപ്പ് വായിക്കുന്നതിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘സംഗീതം വായിച്ചു’ എന്നതിനെക്കാൾ മൂലപദസൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: οὐκ ὠρχήσασθε
  choice: നിങ്ങൾ നൃത്തം ചെയ്തില്ല
  rationale: പ്രവൃത്തിയെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: ἐθρηνήσαμεν
  choice: ഞങ്ങൾ വിലാപഗാനം പാടി
  rationale: θρηνέω വിലപിക്കുക എന്നതിനൊപ്പം വിലാപഗാനം ആലപിക്കുക എന്നും അർഥമാക്കാം; കുട്ടികളുടെ വിരുദ്ധ സ്വഭാവമുള്ള കളികളുടെ പ്രകടനാത്മകത ഇവിടെ നിലനിർത്തുന്നു.
- source_word: οὐκ ἐκλαύσατε
  choice: നിങ്ങൾ കരഞ്ഞില്ല
  rationale: κλαίωയുടെ സാധാരണ അർഥം ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: കുട്ടികളുടെ വിരുദ്ധ പ്രവർത്തനങ്ങളുള്ള ഉപമയെ വ്യാഖ്യാനിക്കാതെ നിലനിർത്തൽ
  choice: ‘കുഴൽ വായിച്ചു,’ ‘നൃത്തം ചെയ്തില്ല,’ ‘വിലാപഗാനം പാടി,’ ‘കരഞ്ഞില്ല’ എന്നീ മൂർത്തമായ പ്രവർത്തനപദങ്ങൾ ഉപയോഗിച്ചു
  alternative: ‘ആഘോഷിച്ചു,’ ‘ദുഃഖിച്ചു’ എന്നിങ്ങനെ പ്രയോഗത്തിന്റെ അർഥം മുൻകൂട്ടി വ്യാഖ്യാനിക്കുക
  rationale: വാക്യം ഇവിടെ ഉപമയുടെ ദൃശ്യം തന്നെയാണ് നൽകുന്നത്; അതിന്റെ പ്രയോഗം വിവർത്തനത്തിൽ മുൻകൂട്ടി തീർപ്പാക്കാതെ ദൈവശാസ്ത്രപരമായ സമ്മർദം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘ചന്തസ്ഥലം’ പുരാതന പൊതുചന്തയുടെ സാമൂഹിക പശ്ചാത്തലം വ്യക്തമാക്കുന്നു. മൂലപാഠത്തിന്റെ പ്രത്യേകമായ ‘കുഴൽ’ എന്ന വാദ്യസൂചന മുഖ്യവാചകത്തിൽ തന്നെയുണ്ടാകുന്നതിനാൽ അതിന് വേറൊരു അടിക്കുറിപ്പ് ആവശ്യമില്ല.
