  text: And his disciples reported all these things to John[a]. And John, calling two certain ones of his disciples[b],
translation:
  language: ml
  text: അവന്റെ ശിഷ്യന്മാർ ഈ കാര്യങ്ങളെല്ലാം യോഹന്നാനെ അറിയിച്ചു. യോഹന്നാൻ തന്റെ ശിഷ്യന്മാരിൽ രണ്ടുപേരെ വിളിച്ച്,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നു; പൂർത്തിയാകാത്ത വാക്യഘടന ഇവിടെ കോമ ഉപയോഗിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: അറിയിച്ചു
  rationale: വിവരം എത്തിച്ചു പറയുക എന്ന അർഥം സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ നൽകുന്നു; അതിരുകടന്ന ഔപചാരികത ഒഴിവാക്കുന്നു.
- source_word: Ἰωάννῃ
  choice: യോഹന്നാനെ
  rationale: മലയാളത്തിൽ ‘അറിയിക്കുക’ എന്ന ക്രിയയോടൊപ്പം വിവരം സ്വീകരിക്കുന്ന വ്യക്തിയെ ‘-നെ’ രൂപത്തിൽ പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: μαθηταί സൂചിപ്പിക്കുന്ന ഗുരു-ശിഷ്യ ബന്ധം നിലനിർത്തുന്ന, സുവിശേഷസന്ദർഭത്തിൽ സുപരിചിതമായ പ്രയോഗം.
- source_word: περὶ πάντων τούτων
  choice: ഈ കാര്യങ്ങളെല്ലാം
  rationale: πάντων എന്ന സമഗ്രതയും τούτων എന്ന സമീപസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: προσκαλεσάμενος
  choice: വിളിച്ച്
  rationale: യോഹന്നാൻ അവരെ വിളിച്ചുവരുത്തിയ പ്രവർത്തി ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘തന്റെ അടുക്കലേക്ക്’ എന്ന ഘടകം ചേർക്കുന്നില്ല.
- source_word: δύο τινὰς
  choice: രണ്ടുപേരെ
  rationale: τινάς ഇവിടെ തിരഞ്ഞെടുക്കപ്പെട്ട, നിർദിഷ്ടമായി പേരുപറയാത്ത രണ്ടുപേരെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ശിഷ്യന്മാരിൽ രണ്ടുപേരെ’ ഈ അനിശ്ചിതത്വം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: τῶν μαθητῶν αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരിൽ
  rationale: രണ്ടുപേർ വലിയ ശിഷ്യഗണത്തിൽനിന്നുള്ളവരാണെന്ന ഭാഗിക-ജനിറ്റീവ് ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: ὁ Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: ഗ്രീക്കിൽ ആവർത്തിക്കുന്ന കർത്താവിനെ മലയാളത്തിലും വ്യക്തമാക്കി, രണ്ടാം വാക്യഘടകത്തിന്റെ കർത്താവ് സംശയരഹിതമാക്കുന്നു.
