  terminology: «ശിഷ്യന്മാർ,» «യോഹന്നാൻ,» and «അറിയിച്ചു» are appropriate Gospel-register choices. «തന്റെ ശിഷ്യന്മാരിൽ രണ്ടുപേരെ» correctly expresses the partitive sense; no forced equivalent for τινάς is needed.
