id: LUK.7.46
reference: Luke 7:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: ml
  text: നീ എന്റെ തലയിൽ എണ്ണ പുരട്ടിയില്ല; എന്നാൽ ഇവൾ എന്റെ കാലുകളിൽ സുഗന്ധതൈലം പുരട്ടി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സുഗന്ധമുള്ള എണ്ണ’ എന്നോ ‘സുഗന്ധലേപനം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαίῳ
  choice: എണ്ണ
  rationale: ἔλαιον എന്ന പദത്തിന്റെ കരണം സൂചിപ്പിക്കുന്ന ദത്തിവ് രൂപം. സന്ദർഭത്തിൽ ഒലിവെണ്ണയായിരിക്കാമെങ്കിലും മൂലപാഠം ആവശ്യപ്പെടുന്നതിലധികം പ്രത്യേകത വരുത്താതിരിക്കാൻ പൊതുവായ ‘എണ്ണ’ ഉപയോഗിച്ചു.
- source_word: ἤλειψας / ἤλειψεν
  choice: പുരട്ടിയില്ല / പുരട്ടി
  rationale: ἀλείφω എണ്ണയോ തൈലമോ ശരീരത്തിൽ പുരട്ടുക എന്ന സാധാരണ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അഭിഷേകം ചെയ്യുക’ എന്നത് അനാവശ്യമായ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നൽകാൻ ഇടയുള്ളതിനാൽ സ്വാഭാവികമായ ‘പുരട്ടുക’ തിരഞ്ഞെടുത്തു.
- source_word: τὴν κεφαλήν μου
  choice: എന്റെ തലയിൽ
  rationale: മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിന് അനുയോജ്യമായി ശരീരഭാഗത്തെ അധികരണരൂപത്തിൽ നൽകി; അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: αὕτη δὲ
  choice: എന്നാൽ ഇവൾ
  rationale: മുമ്പുള്ള ‘നീ’ എന്ന അഭിസംബോധനയോടുള്ള ശക്തമായ വൈരുധ്യവും സന്നിഹിതയായ സ്ത്രീയിലേക്കുള്ള സൂചനയും നിലനിർത്തുന്നു.
- source_word: μύρῳ
  choice: സുഗന്ധതൈലം
  rationale: μύρον സുഗന്ധമുള്ള എണ്ണയെയോ ലേപനതൈലത്തെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ എണ്ണയോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുകയും പുരാതന ഉപയോഗരീതിയോട് ചേരുകയും ചെയ്യുന്നതിനാൽ ‘സുഗന്ധതൈലം’ തിരഞ്ഞെടുത്തു.
- source_word: τοὺς πόδας μου
  choice: എന്റെ കാലുകളിൽ
  rationale: ബഹുവചനമായ πόδας മലയാളത്തിലെ സ്വാഭാവിക അധികരണരൂപത്തിൽ നൽകി.
theological_decisions:
- issue: യേശുവിന്റെ ശാസനയിലെ സാമൂഹിക ബഹുമാനത്തിന്റെ വൈരുധ്യം
  choice: സാധാരണ എണ്ണ നൽകാതിരുന്നതും സ്ത്രീ സുഗന്ധതൈലം പുരട്ടിയതും തമ്മിലുള്ള വൈരുധ്യം ലളിതമായി പ്രകടിപ്പിച്ചു.
  alternative: ‘അഭിഷേകം ചെയ്തു’ പോലുള്ള കൂടുതൽ ആചാരപരമായ ഭാഷ ഉപയോഗിക്കുക.
  rationale: ഉടൻ ചുറ്റുമുള്ള സന്ദർഭം അതിഥിസൽക്കാരത്തിലെ വീഴ്ചയും സ്ത്രീ നൽകിയ അസാധാരണ ബഹുമാനവും താരതമ്യം ചെയ്യുന്നു. മൂലപാഠം നിർബന്ധിക്കാത്ത ഔപചാരിക പ്രതിഷ്ഠയോ പ്രത്യേക ക്രിസ്തുശാസ്ത്ര സൂചനയോ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പുരട്ടുക’ എന്നത് സന്ദർഭത്തിലെ ദേഹപരിചരണപ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുകയും അനാവശ്യമായ സഭാപരമായ അർത്ഥഭാരം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
