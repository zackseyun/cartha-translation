id: LUK.7.48
reference: Luke 7:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῇ· Ἀφέωνταί σου αἱ ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/048.yaml
  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ അവളോടു പറഞ്ഞു: “നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടു.” ഗ്രീക്കിലെ perfect passive രൂപം പൂർത്തിയായ പ്രവൃത്തിയെയും അതിന്റെ തുടർന്നുനിൽക്കുന്ന ഫലത്തെയും ഊന്നിപ്പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം ഇവിടെ നേരിട്ടുള്ള സംസാരത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: പിന്നെ
  rationale: വിവരണത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; ഇവിടെ വ്യക്തമായ വിരോധം സൂചിപ്പിക്കാത്തതിനാൽ ‘പിന്നെ’ സ്വാഭാവികമാണ്.
- source_word: αὐτῇ
  choice: അവളോടു
  rationale: ദത്തിവ് സർവനാമം സംസാരത്തിന്റെ അഭിസംബോധിതയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവളോടു പറഞ്ഞു’ എന്നതാണ് സ്വാഭാവിക പ്രയോഗം.
- source_word: Ἀφέωνταί
  choice: ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ἀφίημι എന്ന ക്രിയയുടെ perfect passive രൂപം പൂർത്തിയായ പ്രവൃത്തിയെയും അതിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; ‘ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ ഈ രണ്ടും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σου
  choice: നിന്റെ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ജനിറ്റീവ് പാപങ്ങളോടുള്ള ഉടമസ്ഥബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിന്റെ’ എന്നത് നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: αἱ ἁμαρτίαι
  choice: പാപങ്ങൾ
  rationale: ഇവിടെ ἁμαρτίαι ദൈവസന്നിധിയിലെ ധാർമിക കുറ്റങ്ങളെ സൂചിപ്പിക്കുന്നു; ഉടമസ്ഥസർവനാമത്തോടൊപ്പം ഗ്രീക്ക് നിർദ്ദേശക ലേഖനത്തിന് വേറിട്ട മലയാളരൂപം ആവശ്യമില്ല.
theological_decisions:
- issue: ക്ഷമാപ്രഖ്യാപനത്തിലെ perfect passive Ἀφέωνταίയുടെ പ്രാബല്യം
  choice: പൂർത്തിയായ ക്ഷമയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം പ്രകടമാക്കുന്ന ‘നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന വിവർത്തനം.
  alternative: ‘നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടു.’
  rationale: ഗ്രീക്ക് perfect passive പൂർത്തിയായ പ്രവൃത്തിയെയും അതിൽനിന്നുള്ള നിലവിലെ അവസ്ഥയെയും സൂചിപ്പിക്കാം. ‘ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ സമയത്തെക്കുറിച്ചോ പ്രവർത്തകനെക്കുറിച്ചോ അധിക വ്യാഖ്യാനം ചേർക്കാതെ ആ അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള വാക്യഘടന ഉപയോഗിച്ചു. ‘ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന രൂപം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായിരിക്കെ മൂലഭാഷയിലെ perfect passive-ന്റെ പൂർത്തീകരണവും തുടരുന്ന ഫലവും സംരക്ഷിക്കുന്നു.
