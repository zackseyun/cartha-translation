  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν, καὶ τυφλοῖς πολλοῖς ⸀ἐχαρίσατο βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: ml
  text: ആ സമയത്ത് അദ്ദേഹം രോഗങ്ങൾ, കഠിനപീഡകൾ[a], ദുരാത്മാക്കൾ എന്നിവയിൽനിന്ന് അനേകരെ സൗഖ്യമാക്കി; അനേകം അന്ധർക്കു കാണാൻ കൃപാപൂർവം അനുവദിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കഠിനപീഡകൾ’ എന്നതിന് ‘പീഡകൾ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദത്തിന് അക്ഷരാർഥത്തിൽ ‘ചാട്ടവാറടികൾ’ എന്നും വിപുലാർഥത്തിൽ കഠിനമായ ശാരീരിക പീഡകൾ എന്നും അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘കാണാൻ കൃപാപൂർവം അനുവദിച്ചു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ആ സമയത്തുതന്നെ
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ടമായ സമയസൂചനയും സന്ദർഭത്തിലെ ഉടനടിത്തവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐθεράπευσεν
  choice: സൗഖ്യമാക്കി
  rationale: സുവിശേഷങ്ങളിലെ രോഗശാന്തിസന്ദർഭത്തിന് യോജിച്ച, സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പ്രയോഗം.
- source_word: πολλοὺς
  choice: അനേകരെ
  rationale: ഗ്രീക്കിൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന കർമം സംക്ഷിപ്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἀπὸ νόσων
  choice: രോഗങ്ങളിൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന അവസ്ഥയിൽനിന്നുള്ള മോചനത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: μαστίγων
  choice: കഠിനവേദനകൾ
  rationale: മാസ്റ്റിക്സ് എന്ന പദത്തിന്റെ അക്ഷരാർഥമായ ചാട്ടവാറടി എന്നതിലുപരി, ഈ രോഗശാന്തിസന്ദർഭത്തിലെ കഠിനമായ ശാരീരിക പീഡനം എന്ന വിപുലാർഥം വ്യക്തമാക്കുന്നു.
- source_word: πνευμάτων πονηρῶν
  choice: ദുരാത്മാക്കൾ
  rationale: πονηρός എന്നതിലെ തിന്മയുടെ അർഥം സംരക്ഷിക്കുകയും വ്യക്തിപരമായ ആത്മീയ സത്തകളെ വെറും രോഗരൂപകമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τυφλοῖς πολλοῖς
  choice: അനേകം അന്ധർക്കു
  rationale: ദാതൃവിഭക്തിയിലുള്ള സ്വീകർത്താക്കളെ ലിംഗപരമായ അനാവശ്യ നിയന്ത്രണമില്ലാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐχαρίσατο
  choice: കൃപ നൽകി
  rationale: χαρίζομαι എന്ന ക്രിയയിലെ സൗജന്യവും കൃപാപൂർവവുമായ ദാനത്തിന്റെ ഭാവം മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: βλέπειν
  choice: കാഴ്ച കാണാൻ
  rationale: അക്ഷരാർഥമായ ‘കാണാൻ’ എന്ന infinitive ഘടന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അർഥം സുതാര്യമാക്കുന്നു.
theological_decisions:
- issue: πνεύματα πονηρά ബാധിച്ചവരോടുള്ള യേശുവിന്റെ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: ദുരാത്മാക്കളിൽനിന്നുള്ള മോചനം യേശുവിന്റെ സൗഖ്യപ്രവർത്തനത്തിന്റെ ഭാഗമായി അവതരിപ്പിക്കുന്നു.
  alternative: ‘ദുരാത്മാക്കൾ’ എന്നതിനെ മാനസികമോ ശാരീരികമോ ആയ രോഗങ്ങളുടെ വ്യക്തിത്വരഹിത രൂപകമായി വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് പദസമുച്ചയം നേരിട്ട് തിന്മയുള്ള ആത്മാക്കളെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ആ ആത്മീയ അർഥം ഒഴിവാക്കാതെയും അതിനപ്പുറം സിദ്ധാന്തവിവരണം ചേർക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യത്തിന്റെ സമയസൂചനയും രോഗം, കഠിനപീഡ, ദുരാത്മാവ് എന്നീ മൂന്നു ഉറവിടങ്ങളിൽനിന്നുള്ള മോചനവും വ്യക്തമായി സൂക്ഷിച്ചിട്ടുണ്ട്. ‘കൃപ നൽകി’ എന്ന പ്രയോഗം ἐχαρίσατοയിലെ ദാനാത്മക ഭാവം നിലനിർത്തുന്നു.
