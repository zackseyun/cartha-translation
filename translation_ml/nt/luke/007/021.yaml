revisions:
- from: ആ സമയത്തുതന്നെ അദ്ദേഹം രോഗങ്ങൾ, കഠിനവേദനകൾ[a], ദുരാത്മാക്കൾ എന്നിവയിൽനിന്ന് അനേകരെ സൗഖ്യമാക്കി; അനേകം അന്ധർക്കു കാഴ്ച കാണാൻ കൃപ നൽകി.[b]
  to: ആ സമയത്ത് അദ്ദേഹം രോഗങ്ങൾ, കഠിനപീഡകൾ[a], ദുരാത്മാക്കൾ എന്നിവയിൽനിന്ന് അനേകരെ സൗഖ്യമാക്കി; അനേകം അന്ധർക്കു കാണാൻ കൃപാപൂർവം അനുവദിച്ചു.[b]
  rationale: The revision removes an unwarranted temporal intensifier, replaces the redundant «കാഴ്ച കാണാൻ» with a direct Malayalam infinitive, and renders χαρίζομαι with «കൃപാപൂർവം അനുവദിച്ചു» to preserve its freely/graciously granted sense. It also broadens the contextual rendering of μάστιγες from pain alone to severe affliction. No doctrinal interpretation beyond the Greek wording has been added.
