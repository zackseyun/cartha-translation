  text: καὶ μακάριός ἐστιν ὃς ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: ml
  text: എന്നെ നിമിത്തം ഇടറിപ്പോകാത്തവൻ അനുഗൃഹീതൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നിൽ ഇടറാത്തവൻ’ അല്ലെങ്കിൽ ‘എന്നെ നിമിത്തം തെറ്റിപ്പോകാത്തവൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: അനുഗൃഹീതൻ
  rationale: യേശുവിന്റെ ഭാഗ്യപ്രഖ്യാപനങ്ങളിലെ ദൈവിക അനുഗ്രഹത്തിന്റെ ഭാരം നിലനിർത്തുന്നു; ‘സന്തുഷ്ടൻ’ എന്നത് വികാരാവസ്ഥയിലേക്കും ‘ഭാഗ്യവാൻ’ എന്നത് യാദൃച്ഛിക സൗഭാഗ്യത്തിലേക്കും അർത്ഥം ചുരുക്കാനിടയുണ്ട്.
- source_word: ὃς ἐὰν μὴ
  choice: -ാത്തവൻ
  rationale: സാമാന്യ വ്യവസ്ഥ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിലെ ഏകവചന പ്രതിനിധിരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: σκανδαλισθῇ
  choice: ഇടറിപ്പോകാത്ത
  rationale: അയോറിസ്റ്റ് പാസീവ് സബ്ജങ്‌ടീവിന്റെ രൂപത്തെ മലയാളത്തിൽ യാന്ത്രികമായി പാസീവാക്കാതെ, ഇടർച്ചയ്ക്ക് കാരണമാകുക എന്ന ദൃശ്യബിംബവും വിശ്വാസത്തിൽ പിന്നോട്ടുപോകാനുള്ള സാധ്യതയും നിലനിർത്തുന്നു.
- source_word: ἐν ἐμοί
  choice: എന്നെപ്രതി
  rationale: ഇവിടെ ἐν യേശുവിനെ ഇടർച്ചയുടെ കാരണമോ സന്ദർഭമോ ആയി സൂചിപ്പിക്കുന്നു. ‘എന്നെപ്രതി’ എന്നത് ‘എന്നിൽ’ എന്ന അവ്യക്തമായ അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമായി ആ ബന്ധം പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെപ്രതി ഇടറുക എന്ന പ്രയോഗത്തിലെ അർത്ഥവ്യാപ്തി
  choice: ഇടർച്ചയുടെ ദൃശ്യബിംബം നിലനിർത്തുന്ന ‘എന്നെപ്രതി ഇടറിപ്പോകാത്തവൻ’
  alternative: ‘എന്നിൽ കുറ്റം കാണാത്തവൻ’ അല്ലെങ്കിൽ ‘ഞാൻ നിമിത്തം വിശ്വാസം ഉപേക്ഷിക്കാത്തവൻ’
  rationale: മൂലപദം കേവലം മാനസികമായി വ്രണപ്പെടുന്നതും പൂർണമായി വിശ്വാസത്യാഗം ചെയ്യുന്നതും എന്ന ഏതെങ്കിലും ഒറ്റ അർത്ഥത്തിലേക്ക് ചുരുക്കാതെ, യേശു ഇടർച്ചയ്ക്ക് കാരണമാകുന്നുവെന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘ഇടറിപ്പോകുക’ എന്ന പരിചിതമായ ബൈബിൾ ദൃശ്യബിംബം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നിലനിർത്തിയിരിക്കുന്നു.
