    text: അഥവാ, ‘എന്നിൽ ഇടറാത്തവൻ’ അല്ലെങ്കിൽ ‘എന്നെ നിമിത്തം തെറ്റിപ്പോകാത്തവൻ.’
    reason: lexical_alternative
