id: LUK.7.8
reference: Luke 7:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ml
  text: എന്തെന്നാൽ ഞാനും അധികാരത്തിനു കീഴിൽ നിയമിക്കപ്പെട്ട ഒരു മനുഷ്യനാണ്; എന്റെ കീഴിൽ പടയാളികളുണ്ട്. ഞാൻ ഇവനോട്, ‘പോകുക’ എന്നു പറയുന്നു; അവൻ പോകുന്നു. മറ്റൊരുവനോട്, ‘വരുക’ എന്നു പറയുന്നു; അവൻ വരുന്നു. എന്റെ അടിമയോട്[a], ‘ഇതു ചെയ്യുക’ എന്നു പറയുന്നു; അവൻ അതു ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദാസൻ’ അല്ലെങ്കിൽ ‘സേവകൻ.’ ഗ്രീക്ക് പദമായ δοῦλος ബന്ധിതമോ ഉടമസ്ഥാധീനമോ ആയ കീഴാളപദവിയെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ചില സന്ദർഭങ്ങളിൽ അതിനെ കൂടുതൽ പൊതുവായി ‘സേവകൻ’ എന്നു വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: എന്തെന്നാൽ
  rationale: ശതാധിപൻ തന്റെ മുമ്പത്തെ പ്രസ്താവനയ്ക്കു നൽകുന്ന വിശദീകരണവും അടിസ്ഥാനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; καί വേർതിരിച്ച് അതിവിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: ഞാനും ... ഒരു മനുഷ്യനാണ്
  rationale: പ്രകടമായ ἐγώ നൽകുന്ന ഊന്നലും καί സൂചിപ്പിക്കുന്ന താരതമ്യമായ ‘ഞാനും’ എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: അധികാരത്തിനു കീഴിൽ നിയമിക്കപ്പെട്ട
  rationale: τασσόμενος എന്ന പദത്തിന്റെ നിഷ്ക്രിയഭാവവും സൈനിക അധികാരശ്രേണിയിൽ ഒരാൾ നിയോഗിക്കപ്പെട്ടിരിക്കുന്നു എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: എന്റെ കീഴിലും പടയാളികളുണ്ട്
  rationale: പ്രതിനിധീകരിക്കപ്പെട്ട അധികാരത്തിന്റെ ശ്രേണിബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ‘under me’ എന്ന രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λέγω τούτῳ
  choice: ഞാൻ ഒരുവനോട് ... എന്നു പറയുന്നു
  rationale: τούτῳ എന്ന ചൂണ്ടുപദത്തെ മലയാളത്തിലെ ഉദാഹരണക്രമത്തിന് യോജിച്ച ‘ഒരുവനോട്’ എന്നു നൽകുന്നു; കല്പനയും അനുസരണവും തമ്മിലുള്ള സമാന്തരഘടന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Πορεύθητι / πορεύεται
  choice: ‘പോകുക’ / അവൻ പോകുന്നു
  rationale: കല്പനയ്ക്കും അതിന്റെ ഉടനെയുള്ള ഫലത്തിനുമിടയിലെ ഗ്രീക്ക് സമാന്തരത ലളിതമായി സംരക്ഷിക്കുന്നു.
- source_word: Ἔρχου / ἔρχεται
  choice: ‘വരുക’ / അവൻ വരുന്നു
  rationale: മൂലത്തിലെ നേരിട്ടുള്ള കല്പനയും പ്രതികരണവും അധിക വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: τῷ δούλῳ μου
  choice: എന്റെ അടിമയോട്
  rationale: δοῦλος സൂചിപ്പിക്കുന്ന ബന്ധിതവും യജമാനാധീനവുമായ സാമൂഹിക പദവി അധികാരശ്രേണി പ്രധാനമായ ഈ സന്ദർഭത്തിൽ ‘അടിമ’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; കൂടുതൽ പൊതുവായ മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: ‘ഇതു ചെയ്യുക’ ... അവൻ അതു ചെയ്യുന്നു
  rationale: ചൂണ്ടുപദവും കല്പന–അനുസരണം ഘടനയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശതാധിപന്റെ ഉപമയിൽ δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമ
  alternative: ദാസൻ അഥവാ സേവകൻ
  rationale: ഈ വാക്യം അടിമത്തത്തെക്കുറിച്ചുള്ള സിദ്ധാന്തപ്രസ്താവനയല്ലെങ്കിലും അധികാരത്തിനു കീഴിലുള്ള പദവി ഉപമയുടെ കേന്ദ്രമാണ്. അതിനാൽ ബന്ധിതമോ ഉടമസ്ഥാധീനമോ ആയ സ്ഥിതി വ്യക്തമാക്കുന്ന ‘അടിമ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; സന്ദർഭാനുസൃതമായി സാധ്യമായ കൂടുതൽ പൊതുവായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. അധികാരശ്രേണിയുടെ ആവർത്തനഘടന വ്യക്തമാക്കാൻ ചെറുവാക്യങ്ങൾ ഉപയോഗിച്ചു. കല്പനകൾക്ക് മാന്യമായ infinitive-imperative രൂപങ്ങളായ ‘പോകുക,’ ‘വരുക,’ ‘ചെയ്യുക’ എന്നിവ നൽകി; ഇതിലൂടെ ശൈലി ഗൗരവമുള്ളതായിരിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് സുതാര്യമായി തുടരുന്നു.
