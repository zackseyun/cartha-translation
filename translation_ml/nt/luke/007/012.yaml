id: LUK.7.12
reference: Luke 7:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: ml
  text: അവൻ പട്ടണവാതിലിനോട് അടുത്തപ്പോൾ, അതാ, മരിച്ച ഒരാളെ പുറത്തേക്കു കൊണ്ടുപോകപ്പെടുകയായിരുന്നു. അയാൾ അമ്മയുടെ ഏകമകനായിരുന്നു[a]; അവളോ വിധവയായിരുന്നു. പട്ടണത്തിലെ ഗണ്യമായ ഒരു ജനക്കൂട്ടവും അവളോടൊപ്പം ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളുടെ ഒരേയൊരു മകൻ.”
    reason: μονογενής എന്നതിന്റെ ‘ഏക/ഒരേയൊരു’ എന്ന കുടുംബബന്ധസൂചനയെ കൂടുതൽ സ്പഷ്ടമായി പറയുന്ന ബദൽ പ്രയോഗം.
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: അവൻ ... അടുത്തപ്പോൾ
  rationale: ὡς എന്ന സമയബന്ധവും ἐγγίζω എന്ന ക്രിയയുടെ സമീപിക്കുകയെന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; δέയുടെ മൃദുവായ ആഖ്യാനബന്ധം വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: പട്ടണവാതിലിനോട്
  rationale: പട്ടണത്തിന്റെ പ്രവേശനവാതിൽ എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: καὶ ἰδοὺ
  choice: അതാ
  rationale: ἰδού പെട്ടെന്നു ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഖ്യാനസൂചകമാണ്; മലയാളത്തിലെ ‘അതാ’ അതിന്റെ ദൃശ്യവും നാടകീയവുമായ ബലം നിലനിർത്തുന്നു.
- source_word: ἐξεκομίζετο
  choice: പുറത്തേക്കു കൊണ്ടുപോകുകയായിരുന്നു
  rationale: അപൂർണഭൂതകാല കർമണിപ്രയോഗം നടന്നുകൊണ്ടിരുന്ന പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു; ശവസംസ്കാരയാത്രയുടെ പശ്ചാത്തലത്തിലും ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: τεθνηκώς
  choice: മരിച്ച ഒരാളെ
  rationale: മരിച്ചു കഴിഞ്ഞ നിലയിൽ ഉള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന perfect participle-ന്റെ അർഥം വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: μονογενὴς υἱός
  choice: ഏകമകൻ
  rationale: ഈ കുടുംബസന്ദർഭത്തിൽ μονογενής അമ്മയുടെ ഒരേയൊരു മകനെയാണ് സൂചിപ്പിക്കുന്നത്; അനാവശ്യമായ ക്രിസ്തുശാസ്ത്രപരമായ സാങ്കേതികധ്വനി ഒഴിവാക്കുന്നു.
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: അവളോ വിധവയായിരുന്നു
  rationale: αὐτή നൽകുന്ന അമ്മയിലേക്കുള്ള ഊന്നൽ ‘അവളോ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുകയും സാഹചര്യത്തിന്റെ ദുഃഖഭാരം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: പട്ടണത്തിൽനിന്നുള്ള സാമാന്യം വലിയൊരു ജനക്കൂട്ടം
  rationale: ἱκανός ഇവിടെ ഗണ്യമായ വലുപ്പത്തെ സൂചിപ്പിക്കുന്നു. ‘സാമാന്യം വലിയൊരു’ എന്നത് അതിനെ അതിശയോക്തിയില്ലാതെ പ്രകടിപ്പിക്കുന്നു; genitive-നെ ഉത്ഭവമോ ബന്ധമോ സൂചിപ്പിക്കുന്ന ‘പട്ടണത്തിൽനിന്നുള്ള’ എന്നു നൽകുന്നു.
- source_word: ἦν σὺν αὐτῇ
  choice: അവളോടൊപ്പം ഉണ്ടായിരുന്നു
  rationale: σύν എന്നതിലെ കൂടെയുണ്ടായിരിക്കുക/അനുഗമിക്കുക എന്ന ആശയം ലളിതമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്രിസ്തുശാസ്ത്രപരമല്ലാത്ത സന്ദർഭത്തിലെ μονογενής എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഏകമകൻ
  alternative: ഒരേയൊരു മകൻ
  rationale: ഇവിടെ ഈ പദം വിധവയുടെ ഏകപുത്രനെ കുടുംബബന്ധത്തിൽ വിവരിക്കുന്നു. ‘ഏകമകൻ’ സന്ദർഭാർഥം കൃത്യമായി നൽകുകയും യോഹന്നാന്റെ രചനകളിലെ പ്രത്യേക ദൈവശാസ്ത്രപ്രയോഗം ഈ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ദൃശ്യത്തിന്റെ ആഖ്യാനഗതിയും വിധവയുടെ ദുഃഖാവസ്ഥയിലുള്ള ഊന്നലും നിലനിർത്താൻ വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് ഘടകങ്ങളായി ക്രമപ്പെടുത്തി.
