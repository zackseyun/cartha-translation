  to: അവൻ പട്ടണവാതിലിനോട് അടുത്തപ്പോൾ, അതാ, മരിച്ച ഒരാളെ പുറത്തേക്കു കൊണ്ടുപോകപ്പെടുകയായിരുന്നു. അയാൾ അമ്മയുടെ ഏകമകനായിരുന്നു[a]; അവളോ വിധവയായിരുന്നു. പട്ടണത്തിലെ ഗണ്യമായ ഒരു ജനക്കൂട്ടവും അവളോടൊപ്പം ഉണ്ടായിരുന്നു.
  rationale: കർമണി ക്രിയാരൂപം വ്യക്തമായി കാണിക്കാനും, ἱκανός-ന്റെ അളവുസൂചനയെ കൂടുതൽ കൃത്യവും സ്വാഭാവികവുമായി നൽകാനും ചെറു പരിഷ്കാരങ്ങൾ നടത്തി. മൂലപാഠത്തിന്റെ വാക്യഘടനയും ഊന്നലും, പ്രത്യേകിച്ച് അമ്മ വിധവയായിരുന്നതും ജനക്കൂട്ടം അവളോടൊപ്പമുണ്ടായിരുന്നതും, നിലനിർത്തിയിരിക്കുന്നു.
