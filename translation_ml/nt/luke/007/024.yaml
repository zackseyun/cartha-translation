id: LUK.7.24
reference: Luke 7:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: ml
  text: 'യോഹന്നാന്റെ ദൂതന്മാർ പോയശേഷം, യേശു യോഹന്നാനെക്കുറിച്ച് ജനക്കൂട്ടങ്ങളോടു സംസാരിച്ചുതുടങ്ങി: “നിങ്ങൾ എന്തു കാണാനാണ് വിജനപ്രദേശത്തേക്കു പോയത്? കാറ്റിൽ ആടിയുലയുന്ന ഒരു ഞാങ്ങണയെയോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: പോയശേഷം
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിലുള്ള അയോറിസ്റ്റ് പാർട്ടിസിപ്പിൾ യേശു സംസാരിക്കാൻ തുടങ്ങുന്നതിനു മുമ്പ് ദൂതന്മാർ പോയെന്ന സമയക്രമം സൂചിപ്പിക്കുന്നു.
- source_word: ἀγγέλων
  choice: ദൂതന്മാർ
  rationale: ഇവിടെ യോഹന്നാൻ അയച്ച മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; സ്വർഗീയ ദൂതന്മാരെയല്ല.
- source_word: ἤρξατο λέγειν
  choice: സംസാരിച്ചുതുടങ്ങി
  rationale: പ്രസംഗത്തിന്റെ ആരംഭം വ്യക്തമാക്കുന്ന ഇൻസെപ്റ്റീവ് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളോടു
  rationale: ὄχλους എന്ന ബഹുവചനം നിലനിർത്തുകയും സംസാരത്തിന്റെ അഭിമുഖത പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: περὶ Ἰωάννου
  choice: യോഹന്നാനെക്കുറിച്ച്
  rationale: περί + ജനിറ്റീവിന്റെ സാധാരണ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: Τί ἐξήλθατε
  choice: നിങ്ങൾ എന്തു ... പോയത്?
  rationale: τί ഇവിടെ പ്രധാനമായും ഉദ്ദേശ്യകാരണമല്ല, കാണാൻ പോയ വസ്തു എന്താണെന്ന് ചോദിക്കുന്നു.
- source_word: εἰς τὴν ἔρημον
  choice: വിജനപ്രദേശത്തേക്കു
  rationale: ἔρημος എന്നത് നിർബന്ധമായും മണൽമരുഭൂമിയല്ല; ജനവാസം കുറഞ്ഞ പ്രദേശം എന്ന സന്ദർഭാർഥം ‘വിജനപ്രദേശം’ വ്യക്തമായി നൽകുന്നു.
- source_word: θεάσασθαι
  choice: കാണാൻ
  rationale: ശ്രദ്ധയോടെ നോക്കുക/കാണുക എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭത്തിൽ അധികവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: κάλαμον
  choice: ഞാങ്ങണ
  rationale: കാറ്റിൽ എളുപ്പം ആടുന്ന reed plant എന്ന ദൃശ്യരൂപം മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: കാറ്റിൽ ആടിയുലയുന്ന
  rationale: കാറ്റിന്റെ സ്വാധീനത്തിൽ ഞാങ്ങണ ചലിക്കുന്ന ദൃശ്യവും അസ്ഥിരതയുടെ സൂചനയും സജീവമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാനെക്കുറിച്ചുള്ള ആലങ്കാരിക ചോദ്യത്തിന്റെ വ്യഞ്ജനാർഥം
  choice: “കാറ്റിൽ ആടിയുലയുന്ന ഒരു ഞാങ്ങണയെയോ?” എന്ന മൂലദൃശ്യം വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി.
  alternative: “അസ്ഥിരനായ ഒരാളെയോ?” എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ.
  rationale: യോഹന്നാൻ ദുർബലനോ ചഞ്ചലനോ ആയിരുന്നില്ലെന്ന നിഗമനം ശ്രോതാക്കൾക്കു വിട്ടുകൊടുക്കുന്ന മൂലപാഠത്തിന്റെ ആലങ്കാരിക പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
- issue: λέγειν എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: സ്വാഭാവിക മലയാളത്തിനായി “യേശു” എന്നു വ്യക്തമാക്കി.
  alternative: “അവൻ ... സംസാരിച്ചുതുടങ്ങി” എന്നു സർവനാമം മാത്രം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിൽ കർത്താവ് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നു. ഒറ്റവാക്യമായ മലയാള പ്രസിദ്ധീകരണത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ യേശുവിന്റെ പേര് ചേർക്കുന്നത് സന്ദർഭപരമായ വ്യക്തീകരണമാണ്; പുതിയ ദൈവശാസ്ത്രവിവരം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിജനപ്രദേശം’ ἔρημος എന്ന പദത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ വിശാലത സംരക്ഷിക്കുന്നു; ‘ഞാങ്ങണ’ ദൃശ്യരൂപം നിലനിർത്തുന്നു. ഈ കരടിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ലാത്തതിനാൽ പ്രധാനപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളില്ല.
