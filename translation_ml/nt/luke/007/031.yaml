id: LUK.7.31
reference: Luke 7:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: ml
  text: “അപ്പോൾ ഈ തലമുറയിലെ മനുഷ്യരെ ഞാൻ എന്തിനോടു ഉപമിക്കണം? അവർ എന്തിനോടാണ് സദൃശർ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: എന്തിനോടു ഉപമിക്കണം?
  rationale: ഗ്രീക്ക് ചോദ്യം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: τοὺς ἀνθρώπους
  choice: മനുഷ്യരെ
  rationale: ἄνθρωπος ഇവിടെ പൊതുവായി മനുഷ്യരെയോ ആളുകളെയോ സൂചിപ്പിക്കുന്നു; ലിംഗപരമായി അനാവശ്യമായി ചുരുക്കാതെ ‘മനുഷ്യർ’ എന്നു നൽകി.
- source_word: τῆς γενεᾶς ταύτης
  choice: ഈ തലമുറയിലെ
  rationale: γενεάയുടെ സാധാരണ അർഥമായ സമകാലിക തലമുറയെ നിലനിർത്തുന്നു.
- source_word: τίνι εἰσὶν ὅμοιοι
  choice: അവർ എന്തിനോടു തുല്യരാണ്?
  rationale: ആദ്യ ചോദ്യത്തിലെ ‘ഉപമിക്കുക’ എന്ന ക്രിയ ആവർത്തിക്കാതെ, ὅμοιοι എന്ന വിശേഷണരൂപത്തിന്റെ വ്യത്യാസം സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം വചനവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. οὖν എന്ന ബന്ധപദം സന്ദർഭപരമായ നിഗമനം സൂചിപ്പിക്കാൻ ‘അപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
