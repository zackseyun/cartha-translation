id: LUK.7.1
reference: Luke 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: ml
  text: ജനങ്ങൾ കേൾക്കെ തന്റെ വാക്കുകളെല്ലാം പറഞ്ഞുതീർത്തശേഷം, അദ്ദേഹം കഫർന്നഹൂമിൽ പ്രവേശിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: ശേഷം
  rationale: ഇവിടെ പദം കാരണമല്ല, മുൻപ്രവൃത്തിക്കു പിന്നാലെയുള്ള സമയക്രമമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘പറഞ്ഞുതീർത്തശേഷം’ സ്വാഭാവികമായി ആ ബന്ധം പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπλήρωσεν
  choice: പറഞ്ഞുതീർത്ത
  rationale: ῥήματα എന്നതിനോടൊപ്പമുള്ള പ്രയോഗത്തിൽ ‘നിറച്ചു/നിവർത്തിച്ചു’ എന്നതല്ല, സംസാരിക്കൽ പൂർത്തിയാക്കി എന്ന അർഥമാണ്.
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: തന്റെ വാക്കുകളെല്ലാം
  rationale: ഗ്രീക്കിലെ ‘അവന്റെ എല്ലാ വാക്കുകളും’ എന്ന രൂപം അടുത്തായി നിലനിർത്തുന്നു; സന്ദർഭം യേശുവിന്റെ മുമ്പത്തെ പ്രസംഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: ജനങ്ങൾ കേൾക്കെ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ജനങ്ങളുടെ ചെവികളിലേക്ക്’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും വാക്കുകൾ ജനസമക്ഷം അവർ കേൾക്കുന്ന വിധത്തിൽ പറഞ്ഞുവെന്ന ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λαοῦ
  choice: ജനങ്ങൾ
  rationale: λαός എന്ന കൂട്ടായ അർഥത്തെ സ്വാഭാവികമായി നൽകുന്നു; ‘ജനക്കൂട്ടം’ എന്ന് പറഞ്ഞ് സാഹചര്യം അനാവശ്യമായി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: εἰσῆλθεν
  choice: പ്രവേശിച്ചു
  rationale: സ്ഥലത്തിനകത്തേക്കു കടന്നുവെന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം മാന്യവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Καφαρναούμ
  choice: കഫർന്നഹൂം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം സ്വീകരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ പൊതുശ്രവണത്തിന്റെ ഭാവവും മുൻപ്രവൃത്തി പൂർത്തിയായ ശേഷമുള്ള കഥാക്രമവും സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
