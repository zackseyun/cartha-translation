source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: ml
  text: അടുത്ത ദിവസം അദ്ദേഹം നയീൻ എന്നു പേരുള്ള ഒരു പട്ടണത്തിലേക്കു പോയി.[a] അദ്ദേഹത്തിന്റെ ശിഷ്യന്മാരും വലിയൊരു ജനക്കൂട്ടവും അദ്ദേഹത്തോടൊപ്പം പോകുന്നുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അടുത്ത ദിവസം’ എന്നതിനു പകരം ‘അധികം താമസിയാതെ’ എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: പ്രത്യേകമായി പരിഭാഷയിൽ ആവർത്തിച്ചില്ല
  rationale: ലൂക്കോസിന്റെ സംഭവാവതരണ സൂത്രവാക്യം മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനത്തിൽ ‘അടുത്ത ദിവസം’ എന്നാരംഭിക്കുന്നതിലൂടെ മതിയായവിധം പ്രകടമാകുന്നു; ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമാകും.
- source_word: ἐν τῷ ἑξῆς
  choice: അടുത്ത ദിവസം
  rationale: SBLGNT പാഠത്തിലെ കാലസൂചനയെ സന്ദർഭാനുസൃതമായി വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; വ്യത്യസ്ത പാഠം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπορεύθη
  choice: പോയി
  rationale: πορεύομαι എന്ന ക്രിയയുടെ സാധാരണ സഞ്ചാരാർഥം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς πόλιν
  choice: ഒരു പട്ടണത്തിലേക്കു
  rationale: πόλις നഗരമോ പട്ടണമോ സൂചിപ്പിക്കാം; ചെറിയ കുടിയിരിപ്പായ നയീന് ‘പട്ടണം’ യോജിക്കുന്നു. εἰς ലക്ഷ്യദിശയായി ‘-ലേക്ക്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: καλουμένην Ναΐν
  choice: നയീൻ എന്നു പേരുള്ള
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും καλουμένην സ്വാഭാവികമായി ‘എന്നു പേരുള്ള’ എന്നു നൽകുകയും ചെയ്തു.
- source_word: συνεπορεύοντο
  choice: അദ്ദേഹത്തോടൊപ്പം പോകുന്നുണ്ടായിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടരുന്ന സഹയാത്രാഭാവവും ചലനവും നിലനിർത്തുന്നു.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: അദ്ദേഹത്തിന്റെ ശിഷ്യന്മാർ
  rationale: μαθηταί എന്നതിന് സുവിശേഷസന്ദർഭത്തിലെ സ്ഥിരവും പരിചിതവുമായ മലയാള പദം ഉപയോഗിക്കുന്നു.
- source_word: ὄχλος πολύς
  choice: വലിയൊരു ജനക്കൂട്ടം
  rationale: ὄχλος എന്നതിന്റെ കൂട്ടാർഥവും πολύς സൂചിപ്പിക്കുന്ന വലിപ്പവും സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
