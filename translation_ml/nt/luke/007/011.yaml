translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. യേശുവിനെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ തുടർച്ചയായ സഹയാത്രയെ ‘പോകുന്നുണ്ടായിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
