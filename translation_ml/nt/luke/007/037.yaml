id: LUK.7.37
reference: Luke 7:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: ml
  text: ഇതാ, ആ പട്ടണത്തിലുണ്ടായിരുന്ന ഒരു സ്ത്രീ—ഒരു പാപിനി[a]—അവൻ പരീശന്റെ വീട്ടിൽ ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുകയാണെന്ന്[b] അറിഞ്ഞ്, സുഗന്ധലേപനമുള്ള ഒരു അലബാസ്റ്റർ കുപ്പി[c] കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് പാഠം അവളെ ‘പാപിനി’ എന്നു മാത്രമേ വിളിക്കുന്നുള്ളൂ; അവളുടെ പ്രത്യേക പാപം ഏതെന്ന് പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ഔപചാരിക വിരുന്നിൽ പതിവായിരുന്ന രീതിപോലെ, മേശയ്ക്കരികെ ചാരിക്കിടന്ന് ഭക്ഷണം കഴിക്കുകയായിരുന്നു എന്നർഥം.
    reason: cultural_note
  - marker: c
    text: ‘സുഗന്ധലേപനം നിറച്ച ഒരു അലബാസ്റ്റർ കുപ്പി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: അപ്പോൾ ഇതാ
  rationale: കഥയിലേക്ക് അപ്രതീക്ഷിതമായി പുതിയ വ്യക്തിയെ അവതരിപ്പിക്കുന്ന ഊന്നൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കഥാഖ്യാനബന്ധത്തിനായി ‘അപ്പോൾ’ ചേർത്തു.
- source_word: ἥτις ἦν ἐν τῇ πόλει
  choice: ആ പട്ടണത്തിലുണ്ടായിരുന്ന ഒരു സ്ത്രീ
  rationale: ‘പട്ടണത്തിൽ’ എന്ന ഗ്രീക്ക് പ്രയോഗം ‘അവിടെ താമസിച്ചിരുന്നവൾ’ എന്നാക്കി അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἁμαρτωλός
  choice: ഒരു പാപിനി
  rationale: നാമസ്വഭാവമുള്ള ഗ്രീക്ക് വിശേഷണം സംരക്ഷിക്കുകയും അവളുടെ പാപം ഏതുതരത്തിലുള്ളതാണെന്ന് അനുമാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπιγνοῦσα
  choice: അറിഞ്ഞ്
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുണ്ടായ അറിവിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: κατάκειται
  choice: ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുകയാണ്
  rationale: പുരാതന ഔപചാരിക വിരുന്നുകളിൽ മേശയ്ക്കരികെ ചാരിക്കിടന്ന് ഭക്ഷണം കഴിച്ചിരുന്ന ഭാവം സംരക്ഷിക്കുന്നു; വെറും ‘ഇരിക്കുന്നു’ എന്നാക്കി മാറ്റുന്നില്ല.
- source_word: οἰκίᾳ τοῦ Φαρισαίου
  choice: പരീശന്റെ വീട്ടിൽ
  rationale: നിശ്ചിതനായ പരീശനെയും അവന്റെ വീടിനെയും സ്വാഭാവിക മലയാള ഉടമസ്ഥപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: κομίσασα
  choice: കൊണ്ടുവന്നു
  rationale: വസ്തു കൂടെ കൊണ്ടുവന്ന് അവിടെ എത്തിച്ചെന്ന പങ്കാളിക്രിയയുടെ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: ἀλάβαστρον μύρου
  choice: സുഗന്ധതൈലം നിറച്ച ഒരു അലബാസ്റ്റർ ഭരണി
  rationale: പാത്രവും അതിലെ സുഗന്ധദ്രവ്യവും വേർതിരിച്ചറിയാൻ കഴിയുന്നവിധം, മൂലപദത്തിന്റെ വസ്തുസൂചനയും ഉള്ളടക്കവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്ത്രീയുടെ ധാർമിക വിശേഷണം
  choice: ഒരു പാപിനി
  alternative: പാപജീവിതം നയിച്ച സ്ത്രീ / വേശ്യ
  rationale: ഗ്രീക്ക് അവളെ ‘പാപിനി’ എന്നു മാത്രമാണ് വിളിക്കുന്നത്; പാപത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പരമ്പരാഗതമായെങ്കിലും പാഠത്തിൽ പ്രസ്താവിക്കാത്ത ‘വേശ്യ’ എന്ന തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥാഖ്യാനശൈലി. ‘പാപിനി’ എന്ന പദം മൂലത്തിലെ നാമസ്വഭാവവും അനിശ്ചിതത്വവും നിലനിർത്തുന്നു. ‘ചാരിക്കിടക്കുക’ പുരാതന ഭക്ഷണരീതി വ്യക്തമാക്കുന്നു; ‘അലബാസ്റ്റർ’ എന്ന വസ്തുനാമത്തിന് അടിക്കുറിപ്പ് നൽകി സാധാരണ വായനക്കാരനെ സഹായിക്കുന്നു.
