id: LUK.7.40
reference: Luke 7:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: ml
  text: 'യേശു അവനോടു മറുപടിയായി പറഞ്ഞു: “ശിമോനേ, എനിക്ക് നിന്നോട് ഒരു കാര്യം പറയാനുണ്ട്.” അപ്പോൾ ശിമോൻ പറഞ്ഞു: “ഗുരുവേ, പറഞ്ഞാലും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘ഉത്തരം നൽകി പറഞ്ഞു’ എന്ന ആഖ്യാനപ്രയോഗത്തിന്റെ പ്രതികരണഭാവം നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: εἶπεν πρὸς αὐτόν
  choice: അവനോടു ... പറഞ്ഞു
  rationale: πρὸς αὐτόν എന്ന ദിശാസൂചക പ്രയോഗം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: Σίμων
  choice: ശിമോനേ
  rationale: പേരിനെ മലയാള ബൈബിൾ പ്രയോഗത്തിന് യോജിച്ചവിധം ലിപ്യന്തരം ചെയ്യുകയും നേരിട്ടുള്ള അഭിസംബോധന വിഭക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: എനിക്ക് നിന്നോട് ഒരു കാര്യം പറയാനുണ്ട്
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിലെ σοί (‘നിന്നോട്’) എന്ന ഘടകം തുറന്നുപറഞ്ഞുകൊണ്ട് അർഥവും സ്വാഭാവികതയും സംരക്ഷിക്കുന്നു.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: διδάσκαλος എന്നതിന്റെ അധ്യാപകൻ/ഉപദേഷ്ടാവ് എന്ന അർഥം മലയാളത്തിലെ മാന്യമായ നേരിട്ടുള്ള അഭിസംബോധനയിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘യജമാനൻ’ എന്ന അധികാരസൂചന അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: εἰπέ
  choice: പറഞ്ഞാലും
  rationale: ‘പറയുക’ എന്ന ആജ്ഞയെ, സന്ദർഭത്തിന് അനുയോജ്യമായ മാന്യവും സ്വാഭാവികവുമായ മലയാള അഭ്യർഥനാരൂപത്തിൽ നൽകുന്നു.
- source_word: φησίν
  choice: അവൻ പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനശൈലിയിൽ സ്വാഭാവികമായ ഭൂതകാലമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ ആഖ്യാനഭാഷ. സംഭാഷണത്തിൽ യേശുവിനോടുള്ള ആദരവ് ‘ഗുരുവേ’ എന്നും ‘പറഞ്ഞാലും’ എന്നും പ്രകടമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത സിദ്ധാന്തപരമായ നിറം ചേർത്തിട്ടില്ല.
