  to: 'എന്നാൽ അവൻ അവനോടു പറഞ്ഞു: “അവർ മോശെയെയും പ്രവാചകന്മാരെയും കേൾക്കുന്നില്ലെങ്കിൽ[a], മരിച്ചവരിൽനിന്ന്[b] ഒരാൾ ഉയിർത്തെഴുന്നേറ്റാലും അവർ ബോധ്യപ്പെടുകയില്ല[c].”'
  rationale: The revision removes the supplied noun ‘വാക്ക്’ so that the translation retains the Greek expression ‘Moses and the Prophets’ directly. It also uses the more direct passive-equivalent ‘ബോധ്യപ്പെടുകയില്ല’ and updates its footnote accordingly. The conditional and concessive construction preserves the force of οὐδ’ ἐάν without specifying a theological response beyond persuasion.
