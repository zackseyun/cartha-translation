id: LUK.16.31
reference: Luke 16:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവനോടു പറഞ്ഞു: “അവർ മോശെയെയും പ്രവാചകന്മാരെയും കേൾക്കുന്നില്ലെങ്കിൽ[a], മരിച്ചവരിൽനിന്ന്[b] ഒരാൾ ഉയിർത്തെഴുന്നേറ്റാലും അവർ ബോധ്യപ്പെടുകയില്ല[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കേൾക്കുന്നില്ലെങ്കിൽ’ എന്നതിന് ‘ശ്രദ്ധിച്ചുകേൾക്കുന്നില്ലെങ്കിൽ’ അല്ലെങ്കിൽ ‘ചെവിക്കൊള്ളുന്നില്ലെങ്കിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ കേൾവിയെയും അതിനോടുള്ള പ്രതികരണാത്മക ശ്രദ്ധയെയും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘മരിച്ചവരുടെ ഇടയിൽനിന്ന്.’
    reason: lexical_alternative
  - marker: c
    text: ‘ബോധ്യപ്പെടുകയില്ല’ എന്നതിന് ‘അവർക്ക് ബോധ്യം വരികയില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ‘ബോധ്യപ്പെടുക’ അല്ലെങ്കിൽ ‘സമ്മതിപ്പിക്കപ്പെടുക’ എന്നാണ്; കൂടുതൽ സങ്കുചിതമായ ദൈവശാസ്ത്രാർഥത്തിൽ ‘വിശ്വസിക്കുക’ എന്ന് നിർബന്ധമായും അർഥമാക്കേണ്ടതില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: എന്നാൽ അവൻ അയാളോടു പറഞ്ഞു
  rationale: δέ സംഭാഷണത്തിലെ നേരിയ വൈരുധ്യപരമായ തിരിവ് സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി; αὐτῷ സ്വാഭാവികമായി ‘അയാളോടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: മോശെയുടെയും പ്രവാചകന്മാരുടെയും വാക്ക്
  rationale: ഇത് മോശെയിലൂടെയും പ്രവാചകന്മാരിലൂടെയും ലഭിച്ച തിരുവെഴുത്തുസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. മലയാളത്തിൽ ‘വാക്ക്’ ചേർക്കുന്നത് ἀκούω എന്ന ക്രിയയോടുള്ള ബന്ധം സ്വാഭാവികമാക്കുന്നു; എന്നാൽ അതിനെ ‘തിരുവെഴുത്തുകൾ’ എന്നു പരാവർത്തനം ചെയ്ത് മൂലപ്രയോഗം മായ്ച്ചിട്ടില്ല.
- source_word: οὐκ ἀκούουσιν
  choice: വാക്കു കേൾക്കുന്നില്ലെങ്കിൽ
  rationale: ἀκούω കേൾക്കുക എന്നതിനൊപ്പം ശ്രദ്ധയോടെ സ്വീകരിക്കുക എന്ന അർഥവും വഹിക്കാം. ‘വാക്കു കേൾക്കുക’ എന്ന മലയാളപ്രയോഗം ഈ രണ്ടുതലങ്ങളും നിലനിർത്തുന്നു; പൂർണ അനുസരണം എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: οὐδ’ ἐάν
  choice: ഉയിർത്തെഴുന്നേറ്റാലും ... വരികയില്ല
  rationale: ആദ്യ നിഷേധത്തെ ശക്തിപ്പെടുത്തുന്ന ‘not even if’ എന്ന ഭാവം മലയാളത്തിലെ concessive ‘-ആലും’ ഘടന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τις
  choice: ഒരാൾ
  rationale: അനിശ്ചിത ഏകവചനത്തെ ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: ἐκ എന്നതിന്റെ ‘ഇടയിൽനിന്ന്/കൂട്ടത്തിൽനിന്ന്’ എന്ന സൂചന നിലനിർത്തുന്ന, പുനരുത്ഥാനസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ἀναστῇ
  choice: ഉയിർത്തെഴുന്നേറ്റാലും
  rationale: ἐάν-നോടുകൂടിയ aorist subjunctive-ന്റെ സോപാധിക ഭാവവും പുനരുത്ഥാനാർഥവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: πεισθήσονται
  choice: അവർക്ക് ബോധ്യം വരികയില്ല
  rationale: πεισθήσονται എന്ന future passive രൂപത്തിന്റെ persuaded/convinced എന്ന പൊതുവായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘വിശ്വസിക്കുകയില്ല’ അല്ലെങ്കിൽ ‘മാനസാന്തരപ്പെടുകയില്ല’ എന്ന കൂടുതൽ സവിശേഷമായ ദൈവശാസ്ത്രാർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: ‘മോശെയും പ്രവാചകന്മാരും’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ഇസ്രായേലിനു ഇതിനകം നൽകപ്പെട്ട ആധികാരിക തിരുവെഴുത്തുസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന മൂലപ്രയോഗം നിലനിർത്തി
  alternative: ‘തിരുവെഴുത്തുകൾ’ എന്നു നേരിട്ട് പരാവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ രണ്ട് വ്യക്തികളെ മാത്രം സൂചിപ്പിക്കുന്നതായി വായിക്കുക
  rationale: സന്ദർഭത്തിൽ ഈ പ്രയോഗം മോശെയിലൂടെയും പ്രവാചകന്മാരിലൂടെയും ലഭിച്ച സാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു. എന്നിരുന്നാലും പരിഭാഷ മൂലരൂപം മായ്ച്ച് വ്യാഖ്യാനം മാത്രം നൽകുന്നില്ല.
- issue: πεισθήσονται എന്നതിന്റെ വ്യാപ്തി
  choice: പൊതുവായ ബോധ്യപ്പെടൽ/സമ്മതിപ്പിക്കപ്പെടൽ
  alternative: ‘വിശ്വസിക്കും’ അല്ലെങ്കിൽ ‘മാനസാന്തരപ്പെടും’
  rationale: ഗ്രീക്ക് പദം ഇവിടെ ബോധ്യപ്പെടുകയോ സമ്മതിപ്പിക്കപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; രക്ഷാകരവിശ്വാസമോ മാനസാന്തരമോ എന്നു പ്രത്യേകമായി നിർണ്ണയിക്കുന്നത് വാക്യത്തേക്കാൾ അപ്പുറം പോകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സുഗ്രാഹ്യവുമായ ശൈലി. ‘വാക്കു കേൾക്കുക,’ ‘ഉയിർത്തെഴുന്നേൽക്കുക,’ ‘ബോധ്യം വരുക’ എന്നീ സ്വാഭാവിക പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. മൂലത്തിലെ വ്യവസ്ഥയും ശക്തിപ്പെടുത്തിയ നിഷേധവും ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും നിലനിർത്തി.
