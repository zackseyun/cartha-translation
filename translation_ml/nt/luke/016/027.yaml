source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “പിതാവേ, അതിനാൽ അവനെ എന്റെ പിതാവിന്റെ വീട്ടിലേക്ക് അയയ്ക്കണമെന്ന് ഞാൻ അങ്ങയോട് അപേക്ഷിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞാൻ അങ്ങയോട് യാചിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ഗൗരവമുള്ള അഭ്യർഥന പ്രകടിപ്പിക്കാനാകുമെങ്കിലും, അതിന്റെ അടിസ്ഥാന അർഥം ‘ചോദിക്കുക, അഭ്യർഥിക്കുക’ എന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: അപ്പോൾ അവൻ പറഞ്ഞു
  rationale: δέ ഇവിടെ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ പുരോഗതി വ്യക്തമാക്കുന്നു.
- source_word: Ἐρωτῶ
  choice: ഞാൻ അങ്ങയോട് അപേക്ഷിക്കുന്നു
  rationale: ἐρωτάω എന്നതിന് ‘ചോദിക്കുക, അഭ്യർഥിക്കുക, അപേക്ഷിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ഈ സന്ദർഭത്തിലെ ഗൗരവമുള്ള അഭ്യർഥന ‘അപേക്ഷിക്കുന്നു’ സ്വാഭാവികമായി അറിയിക്കുന്നു; അതേസമയം ‘യാചിക്കുന്നു’ എന്ന അതിശക്തമായ ഭാവം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: σε οὖν
  choice: എങ്കിൽ ... അങ്ങയോട്
  rationale: οὖν മുൻപുണ്ടായ നിരസനത്തിൽനിന്നുള്ള തുടർച്ചയെയോ നിഗമനത്തെയോ സൂചിപ്പിക്കുന്നു. അഭിസംബോധനയോടുകൂടിയ ഈ അപേക്ഷയിൽ ‘എങ്കിൽ’ ആ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; σε എന്നത് ആദരസൂചകമായ ‘അങ്ങയോട്’ ആയി നൽകിയിരിക്കുന്നു.
- source_word: πάτερ
  choice: പിതാവേ
  rationale: ഇത് ഉപമയ്ക്കുള്ളിൽ അബ്രാഹാമിനോടുള്ള അഭിസംബോധനയാണ്. ‘പിതാവേ’ പൂർവപിതാവെന്ന ബന്ധവും സംബോധനരൂപവും നിലനിർത്തുന്നു; ദൈവത്തെ സൂചിപ്പിക്കുന്ന പ്രത്യേക ശീർഷകം ഇവിടെ ചേർക്കുന്നില്ല.
- source_word: ἵνα πέμψῃς
  choice: അയയ്ക്കണമെന്ന്
  rationale: അപേക്ഷയുടെ ഉള്ളടക്കം വ്യക്തമാക്കുന്ന ἵνα + subjunctive ഘടന മലയാളത്തിൽ ‘അയയ്ക്കണമെന്ന്’ എന്ന ആശ്രിതവാക്യരൂപത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: ഈ സർവനാമം മുൻസന്ദർഭത്തിലെ ലാസറിനെ സൂചിപ്പിക്കുന്നു; ‘അവനെ’ അതിന്റെ നേരിട്ടുള്ള മലയാളരൂപമാണ്.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: എന്റെ പിതാവിന്റെ വീട്ടിലേക്ക്
  rationale: εἰς ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു; οἶκος ഇവിടെ വീട്/കുടുംബഭവനം എന്ന അർഥത്തിലാണ്. ‘എന്റെ പിതാവിന്റെ വീട്ടിലേക്ക്’ കൃത്യവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ഉപമയിലെ πάτερ എന്ന സംബോധന
  choice: പിതാവേ
  alternative: ദൈവിക ശീർഷകമായി വായിക്കാവുന്ന പ്രത്യേക പ്രയോഗം
  rationale: സംസാരിക്കുന്നവൻ അബ്രാഹാമിനെ പൂർവപിതാവായി അഭിസംബോധന ചെയ്യുകയാണ്; ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയാണെന്ന് മൂലപാഠം സൂചിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അബ്രാഹാമിനോടുള്ള ആദരസൂചക അഭിസംബോധനയ്ക്കായി ‘അങ്ങയോട്’ ഉപയോഗിച്ചു; വാക്യഘടന മൂലപാഠത്തിലെ അപേക്ഷയുടെ ആശ്രിതരൂപം നിലനിർത്തുന്നു.
