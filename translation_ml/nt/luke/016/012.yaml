id: LUK.16.12
reference: Luke 16:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: ml
  text: കൂടാതെ, മറ്റൊരാളുടേതിൽ[a][c] നിങ്ങൾ വിശ്വസ്തരായിരുന്നില്ലെങ്കിൽ, നിങ്ങളുടേതായതു[b] ആർ നിങ്ങൾക്കു തരും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മറ്റൊരാളുടെ സ്വത്തിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾക്കുള്ളത്.’
    reason: lexical_alternative
  - marker: c
    text: ഇവിടത്തെ വ്യത്യാസം ഇപ്പോഴത്തെ ലൗകിക സമ്പത്തിലെ വിശ്വസ്തതയും പിന്നീട് ലഭിക്കുന്ന യഥാർഥമോ നിലനിൽക്കുന്നതോ ആയ സമ്പത്തും തമ്മിലായിരിക്കാം; എന്നാൽ ഈ വാക്യം അവ എന്താണെന്ന് വ്യക്തമായി പറയുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: മറ്റൊരാളുടേതിൽ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ നപുംസക ഏകവചന വിശേഷണം ഇവിടെ നാമപദമായി പ്രവർത്തിച്ച് ‘മറ്റൊരാളുടേതായതിൽ’ എന്ന അർഥം നൽകുന്നു. ചുരുക്കവും സ്വാഭാവികവുമായ ഈ പ്രയോഗം ഉടമസ്ഥതയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: πιστοὶ
  choice: വിശ്വസ്തരായിരുന്നില്ലെങ്കിൽ
  rationale: ഇവിടെ πιστός വിശ്വാസം സ്വീകരിക്കുന്നതിനെക്കാൾ ഏൽപ്പിക്കപ്പെട്ട കാര്യത്തിലെ വിശ്വസ്തതയെയും ആശ്രയയോഗ്യതയെയും സൂചിപ്പിക്കുന്നു.
- source_word: ἐγένεσθε
  choice: ആയിരുന്നില്ലെങ്കിൽ
  rationale: γίνομαι എന്ന ക്രിയയുടെ ആശയം മലയാളത്തിലെ ഈ നിബന്ധനാവാക്യത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ആയിത്തീർന്നില്ലെങ്കിൽ’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: τὸ ὑμέτερον
  choice: നിങ്ങളുടെ സ്വന്തമായത്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ നപുംസക ഏകവചനം ‘നിങ്ങളുടേതായതു’ എന്ന നാമപദാർഥത്തിലാണ്. ‘സ്വന്തമായത്’ മുൻഭാഗത്തെ ‘മറ്റൊരാളുടേത്’ എന്നതിനോടുള്ള വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δώσει ὑμῖν
  choice: നിങ്ങൾക്കു തരും
  rationale: δίδωμι എന്നതിന്റെ സാധാരണ അർഥമായ ‘തരുക’ നിലനിർത്തുന്നു. സന്ദർഭം കാര്യനിർവഹണത്തെക്കുറിച്ചാണെങ്കിലും ‘ഏൽപ്പിച്ചുതരും’ എന്ന് വ്യാഖ്യാനപരമായി വിപുലീകരിക്കുന്നില്ല.
- source_word: καὶ εἰ
  choice: എങ്കിൽ
  rationale: εἰ നിബന്ധനയെ ‘എങ്കിൽ’ സ്വാഭാവികമായി രേഖപ്പെടുത്തുന്നു. καί സൂചിപ്പിക്കുന്ന മുൻവാക്യബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ വേറൊരു ‘കൂടാതെ’ ചേർക്കാതെയും ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: τίς
  choice: ആർ
  rationale: ദാതാവിനെക്കുറിച്ചുള്ള അലങ്കാരപ്രശ്നം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: ‘മറ്റൊരാളുടേത്’ എന്നും ‘നിങ്ങളുടെ സ്വന്തമായത്’ എന്നും ഉള്ള വൈരുധ്യത്തിന്റെ വ്യാഖ്യാനം
  choice: പ്രധാന പാഠത്തിൽ അവ എന്തിനെ സൂചിപ്പിക്കുന്നു എന്നു നിർണയിക്കാതെ വൈരുധ്യം അതേപടി നിലനിർത്തി.
  alternative: ‘ലൗകിക സമ്പത്ത്’ എന്നും ‘യഥാർഥമോ നിലനിൽക്കുന്നതോ ആയ സമ്പത്ത്’ എന്നും വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ഭൗമിക കാര്യനിർവഹണവും ഭാവിയിലെ അവകാശവും ആയി വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം മാത്രം പരിഗണിക്കുമ്പോൾ ഗ്രീക്ക് പാഠം രണ്ടു പരാമർശങ്ങളുടെയും കൃത്യമായ സൂചിതവിഷയം പറയുന്നില്ല. അതിനാൽ പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം പ്രധാന പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘മറ്റൊരാളുടേതിൽ’–‘നിങ്ങളുടെ സ്വന്തമായത്’ എന്ന സമാന്തര വൈരുധ്യം സംരക്ഷിക്കുകയും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിക്കുകയും ചെയ്തു.
