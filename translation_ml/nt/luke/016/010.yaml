id: LUK.16.10
reference: Luke 16:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: ml
  text: വളരെ ചെറിയതിൽ വിശ്വസ്തനായവൻ വളരെ കൂടുതലിലും വിശ്വസ്തനാണ്[a]; വളരെ ചെറിയതിൽ അനീതി ചെയ്യുന്നവൻ വളരെ കൂടുതലിലും അനീതി ചെയ്യുന്നവനാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏറ്റവും നിസ്സാരമായതിൽ.’ ഗ്രീക്ക് പ്രയോഗം വളരെ ചെറുതോ നിസ്സാരമോ ആയതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അനീതി ചെയ്യുന്നവൻ’ എന്നതിന് ‘സത്യസന്ധനല്ലാത്തവൻ’ എന്നോ ‘അനീതിയുള്ളവൻ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് സാമ്പത്തിക സത്യസന്ധതക്കുറവിനെക്കാൾ വിശാലമായ അർഥമുണ്ടെങ്കിലും, ചുറ്റുപാടിലെ സന്ദർഭത്തിൽ ആ ആശയവും യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: വിശ്വസ്തൻ
  rationale: ഏൽപ്പിക്കപ്പെട്ട കാര്യങ്ങൾ കൈകാര്യം ചെയ്യുന്നതിലെ വിശ്വാസ്യതയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; വെറും വിശ്വസിക്കൽ അല്ല. ‘വിശ്വസ്തൻ’ ഈ അർഥവും രണ്ടു വാക്യഭാഗങ്ങളിലെ സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: ἐν ἐλαχίστῳ
  choice: ഏറ്റവും ചെറിയ കാര്യത്തിൽ
  rationale: ἐν സഹിതമുള്ള ദത്തിവ് പ്രവർത്തനമേഖലയെയോ സാഹചര്യത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്; വളരെ ചെറുതോ നിസ്സാരമോ ആയതെന്ന ആശയവും πολλῷ എന്നതിനോടുള്ള വൈരുധ്യവും വ്യക്തമാക്കുന്നു.
- source_word: πολλῷ
  choice: വലിയ കാര്യത്തിൽ
  rationale: നപുംസക ഏകവചനം അളവിലോ വ്യാപ്തിയിലോ ഉള്ള വലുപ്പത്തെ ἐλαχίστῳ എന്നതിനോട് വിപരീതമായി നിർത്തുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘അധികത്തിൽ’ എന്നതിനെക്കാൾ ‘വലിയ കാര്യത്തിൽ’ ആ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἄδικος
  choice: നീതികെട്ടവൻ
  rationale: പദം അനീതിയെയും പൊതുവായ തെറ്റായ പെരുമാറ്റത്തെയും സൂചിപ്പിക്കാം. സാമ്പത്തിക അവിശ്വസ്തത പശ്ചാത്തലത്തിൽ ഉൾപ്പെടുന്നുവെങ്കിലും ‘സത്യസന്ധനല്ലാത്തവൻ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും; ‘നീതികെട്ടവൻ’ വിശാലമായ ധാർമിക അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: വിശ്വസ്തനായവൻ ... നീതികെട്ടവൻ
  rationale: വിശേഷണം നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ഘടനയെ പ്രതിനിധാനപരമായ ഏകവചനത്തിൽ, അനാവശ്യമായ ലിംഗസൂചന കൂടാതെ, സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: καὶ
  choice: -ത്തിലും / ;
  rationale: ഓരോ പകുതിയിലും καί-യുടെ കൂട്ടിച്ചേർക്കൽ അർഥം ‘-ത്തിലും’ എന്ന രൂപത്തിൽ പ്രകടമാകുന്നു. രണ്ടു സമാന്തര പ്രസ്താവനകളുടെ ബന്ധം അർദ്ധവിരാമം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സമ്പത്ത് കൈകാര്യം ചെയ്യുന്ന പശ്ചാത്തലത്തിലെ ἄδικος എന്ന ധാർമിക വിശേഷണം
  choice: നീതികെട്ടവൻ
  alternative: സത്യസന്ധനല്ലാത്തവൻ / അനീതിയുള്ളവൻ
  rationale: വാക്യം പണകാര്യത്തിലെ സത്യസന്ധതയെ മാത്രം അല്ല, വിശാലമായ ഒരു ധാർമിക തത്ത്വത്തെ പ്രസ്താവിക്കുന്നു. ‘നീതികെട്ടവൻ’ സാമ്പത്തിക പശ്ചാത്തലത്തിന് യോജിക്കുന്നതോടൊപ്പം പദത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ചെറിയ കാര്യം/വലിയ കാര്യം’ എന്ന സമാന്തര പ്രയോഗം ഗ്രീക്കിലെ അളവുസംബന്ധമായ വൈരുധ്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
