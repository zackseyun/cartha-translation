- from: ഏറ്റവും ചെറിയ കാര്യത്തിൽ വിശ്വസ്തനായവൻ വലിയ കാര്യത്തിലും വിശ്വസ്തനാണ്[a]; ഏറ്റവും ചെറിയ കാര്യത്തിൽ നീതികെട്ടവൻ വലിയ കാര്യത്തിലും നീതികെട്ടവനാണ്[b].
