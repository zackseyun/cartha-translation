    issue: ‘അങ്ങനെ’ for ἐγένετο δέ
    rationale: In this context ‘അങ്ങനെ’ normally has a ‘thus/so’ sense and may imply that the death followed as a consequence of what precedes. The Greek is a mild event-transition formula, not a consequential ‘therefore.’ Malayalam can naturally leave this formula unexpressed while preserving the narrated events.
