id: LUK.16.22
reference: Luke 16:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: ml
  text: ആ ദരിദ്രൻ മരിച്ചു; ദൂതന്മാർ അവനെ അബ്രാഹാമിന്റെ മടിയിലേക്കു[a] കൊണ്ടുപോയി. ധനികനും മരിച്ചു, അടക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അബ്രാഹാമിന്റെ അരികിലേക്ക്.” ഗ്രീക്കിൽ അക്ഷരാർഥം “അബ്രാഹാമിന്റെ മടിയിലേക്ക്”; അടുപ്പം, ബഹുമാനം, കൂട്ടായ്മ എന്നിവ സൂചിപ്പിക്കുന്ന ഒരു രൂപകപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: അങ്ങനെ
  rationale: ലൂക്കോസിന്റെ സംഭവപരിവർത്തന സൂത്രവാക്യത്തിന്റെ ലഘുവായ ആഖ്യാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത വ്യക്തമായ കാലസൂചകപദം ചേർക്കുന്നില്ല.
- source_word: ἀποθανεῖν τὸν πτωχὸν
  choice: ആ ദരിദ്രൻ മരിച്ചു
  rationale: ആശ്രിതമായ ഗ്രീക്ക് ക്രിയാരൂപത്തെ സ്വാഭാവിക മലയാളത്തിലെ പൂർണവാക്യമായി നൽകുന്നു; πτωχός സൂചിപ്പിക്കുന്ന ദാരിദ്ര്യം നിലനിർത്തുന്നു, ‘ഭിക്ഷക്കാരൻ’ എന്ന അധികവിശദാംശം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: ദൂതന്മാർ അവനെ ... കൊണ്ടുപോയി
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗവും ദൂതന്മാരുടെ പ്രവർത്തകത്വവും അർഥപരമായി നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തരിപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: അബ്രാഹാമിന്റെ മടിയിലേക്ക്
  rationale: κόλπος എന്നതിന്റെ നെഞ്ച്/മടി/അരികിലെ അടുപ്പം എന്ന ദൃശ്യരൂപം ‘മടി’ സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു; വെറും സ്ഥലനാമമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: ധനികനും മരിച്ചു
  rationale: καί നൽകുന്ന സമാന്തരമായ ‘കൂടി/ഉം’ എന്ന ആശയം ‘-ഉം’ വഴി സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἐτάφη
  choice: അടക്കപ്പെട്ടു
  rationale: θάπτω എന്നതിന്റെ സംസ്കരിച്ച് അടക്കുക എന്ന അർഥവും കർമണിഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: εἰς τὸν κόλπον Ἀβραάμ എന്ന പ്രയോഗത്തിന്റെ അവതരണം
  choice: അബ്രാഹാമിന്റെ മടിയിലേക്ക്
  alternative: അബ്രാഹാമിന്റെ അരികിലേക്ക്
  rationale: മൂലത്തിലെ രൂപകവും അടുപ്പം, ബഹുമാനം, കൂട്ടായ്മ എന്നീ സൂചനകളും നിലനിർത്തുന്നു; അതിനെ പൊതുവായ ഒരു പരലോകസ്ഥലപദമായി നിർവചിച്ച് ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പരമ്പരാഗത രൂപകം നിലനിർത്തിയെങ്കിലും അതിന്റെ സ്വാഭാവിക മലയാളരൂപമായി ‘മടി’ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ അവസാനഭാഗത്തെ ഗ്രീക്ക് സംക്ഷിപ്തതയും സൂക്ഷിച്ചു.
