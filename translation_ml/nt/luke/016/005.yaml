  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: ml
  text: അവൻ തന്റെ യജമാനന്റെ[a] കടക്കാരിൽ ഓരോരുത്തരെയും വിളിച്ചുവരുത്തി, ആദ്യത്തവനോട്, “നീ എന്റെ യജമാനന് എത്ര കടപ്പെട്ടിരിക്കുന്നു?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ κύριος എന്ന പദം പലപ്പോഴും ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്. എന്നാൽ ഇവിടെ അത് കാര്യസ്ഥന്റെ മനുഷ്യ മേലധികാരിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യജമാനൻ’ എന്നാണ് നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: വിളിച്ചുവരുത്തി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist middle participle സൂചിപ്പിക്കുന്ന മുൻപ്രവൃത്തിയും ആളുകളെ തന്റെ അടുക്കലേക്ക് വിളിപ്പിക്കുന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἕνα ἕκαστον
  choice: ഓരോരുത്തരെയും
  rationale: പദസമുച്ചയത്തിന്റെ വിതരണാത്മക ഊന്നൽ കൃത്യമായും സംക്ഷിപ്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: χρεοφειλετῶν
  choice: കടക്കാരിൽ
  rationale: സാമ്പത്തിക ബാധ്യതയുള്ളവരെ സൂചിപ്പിക്കുന്ന നാമത്തിന് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: തന്റെ യജമാനന്റെ
  rationale: ἑαυτοῦ കാര്യസ്ഥനെത്തന്നെ തിരിച്ചുസൂചിപ്പിക്കുന്നു; κύριος ഇവിടെ ദൈവിക പദവിയല്ല, അവന്റെ മനുഷ്യ മേലധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἔλεγεν
  choice: ചോദിച്ചു
  rationale: തുടർന്നുള്ള നേരിട്ടുള്ള ചോദ്യം കണക്കിലെടുത്ത് മലയാളത്തിലെ സ്വാഭാവിക വിവരണരീതി സ്വീകരിക്കുന്നു. ഗ്രീക്കിലെ imperfect പശ്ചാത്തലമോ ആവർത്തനസ്വഭാവമോ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ അതിനെ ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ എന്നു നൽകുന്നത് അസ്വാഭാവികവും അനാവശ്യമായി ഊന്നുന്നതുമായിരിക്കും.
- source_word: τῷ πρώτῳ
  choice: ആദ്യത്തവനോട്
  rationale: ക്രമത്തിൽ ആദ്യം സമീപിച്ച കടക്കാരനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: Πόσον
  choice: എത്ര
  rationale: കടത്തിന്റെ അളവ് ചോദിക്കുന്നതിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: ὀφείλεις
  choice: കടപ്പെട്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള സാമ്പത്തിക ബാധ്യതയെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: τῷ κυρίῳ μου
  choice: എന്റെ യജമാനന്
  rationale: μου സൂചിപ്പിക്കുന്ന ഒന്നാംപുരുഷബന്ധം നിലനിർത്തുകയും κύριος എന്നത് മനുഷ്യ മേലധികാരിയെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വീട്ടുകാര്യ-സാമ്പത്തിക പശ്ചാത്തലത്തിൽ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: ഈ ഉപമയിൽ പദം കാര്യസ്ഥന്റെ മനുഷ്യ മേലധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്; ദൈവികമോ ക്രിസ്തുശാസ്ത്രപരമോ ആയ പദവിയല്ല. അതിനാൽ ‘യജമാനൻ’ സാമൂഹികബന്ധം വ്യക്തമായി അറിയിക്കുകയും തെറ്റായ ദൈവശാസ്ത്രധ്വനി ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘വിളിച്ചുവരുത്തി’ എന്നത് പങ്കാളിക്രിയയുടെ ക്രമം നിലനിർത്തുന്നു; നേരിട്ടുള്ള ചോദ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകിയിരിക്കുന്നു.
