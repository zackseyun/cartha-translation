  to: 'ഞാൻ നിങ്ങളോടു പറയുന്നു: അനീതിയുടെ സമ്പത്ത്[a] ഉപയോഗിച്ച് നിങ്ങൾക്കായി സുഹൃത്തുക്കളെ നേടുക. അങ്ങനെ, അത് ഇല്ലാതാകുമ്പോൾ[b], അവർ നിങ്ങളെ നിത്യവാസസ്ഥലങ്ങളിലേക്ക്[c] സ്വീകരിക്കും.'
