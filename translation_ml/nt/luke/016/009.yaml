  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളോടു പറയുന്നു: അനീതിയുടെ സമ്പത്ത്[a] ഉപയോഗിച്ച് നിങ്ങൾക്കായി സുഹൃത്തുക്കളെ നേടുക. അങ്ങനെ, അത് ഇല്ലാതാകുമ്പോൾ[b], അവർ നിങ്ങളെ നിത്യവാസസ്ഥലങ്ങളിലേക്ക്[c] സ്വീകരിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അനീതിയുടെ മാമോനിൽനിന്ന്’; ‘മാമോൻ’ എന്നത് സമ്പത്ത് അഥവാ പണം എന്നർഥമുള്ള ഗ്രീക്ക് പദത്തിന്റെ പരമ്പരാഗത രൂപമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളുടെ ജീവിതം അവസാനിക്കുമ്പോൾ’ എന്നോ ‘അത് തീർന്നുപോകുമ്പോൾ’ എന്നോ വിവർത്തനം ചെയ്യാം. ഇവിടെ ഗ്രീക്ക് ക്രിയയുടെ കർത്താവ് വ്യക്തമല്ല; പലരും അത് സമ്പത്ത് ഇല്ലാതാകുന്നതിനെ സൂചിപ്പിക്കുന്നു എന്നു കരുതുന്നു, ചിലർ അതിനെ ഒരാളുടെ മരണമായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അല്ലെങ്കിൽ ‘നിത്യകൂടാരങ്ങളിലേക്ക്’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: നിങ്ങൾക്കായി സുഹൃത്തുക്കളെ നേടുക
  rationale: പ്രതിഫലക ദത്തിവും ആജ്ഞാരൂപവും നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായി ‘make friends for yourselves’ എന്ന ആശയം നൽകുന്നു; ‘സുഹൃത്തുക്കളെ ഉണ്ടാക്കുക’ എന്നത് കൂടുതൽ വാക്കക്ഷരപരമായെങ്കിലും അസ്വാഭാവികമാണ്.
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: അനീതിയുടെ സമ്പത്ത് ഉപയോഗിച്ച്
  rationale: ἐκ എന്നതിന്റെ സന്ദർഭപരമായ ഉപകരണാർഥം ‘ഉപയോഗിച്ച്’ വ്യക്തമാക്കുന്നു. τῆς ἀδικίας എന്ന വിശേഷണം ‘അനീതിയുടെ’ എന്നു നിലനിർത്തുന്നത്, ഇത് മോഷണത്തിലൂടെയോ വഞ്ചനയിലൂടെയോ മാത്രം ലഭിച്ച ധനമാണെന്നു ചുരുക്കുന്നില്ല.
- source_word: μαμωνᾶ
  choice: സമ്പത്ത്
  rationale: ഗ്രീക്ക് പദം ഇവിടെ ധനം/സമ്പത്ത് എന്നർഥത്തിലാണ്. മലയാളവായനക്കാർക്ക് അപരിചിതമായേക്കാവുന്ന പരമ്പരാഗത ‘മാമോൻ’ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τῆς ἀδικίας
  choice: അനീതിയുടെ
  rationale: ἀδικίαയുടെ നീതി-ധാർമ്മികത സംബന്ധിച്ച വിശാല അർഥം നിലനിർത്തുന്നു; ‘വഞ്ചനാപരമായ’ എന്നു പറഞ്ഞ് അന്യായമായി സമ്പാദിച്ച ധനത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: അങ്ങനെ, അത് ഇല്ലാതാകുമ്പോൾ
  rationale: അടുത്തുള്ള μαμωνᾶς എന്ന പദത്തെയാണ് ‘അത്’ സൂചിപ്പിക്കുന്നതെന്ന സാധ്യതയേറിയ വായന സ്വീകരിക്കുന്നു. ἐκλίπῃയുടെ ‘പരാജയപ്പെടുക/തീർന്നുപോകുക/ഇല്ലാതാകുക’ എന്ന ആശയം ‘ഇല്ലാതാകുക’ നൽകുന്നു; കർത്താവിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: δέξωνται ὑμᾶς
  choice: അവർ നിങ്ങളെ സ്വീകരിക്കും
  rationale: δέχομαιയുടെ സ്വീകരണം/സ്വാഗതം എന്ന അർഥം നൽകുന്നു. ‘അവർ’ ആരാണെന്ന് ഗ്രീക്ക് വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനത്തിലും തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: നിത്യവാസസ്ഥലങ്ങളിലേക്ക്
  rationale: σκηναίയുടെ പാർപ്പിടസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അതിന്റെ അക്ഷരാർഥമായ ‘കൂടാരങ്ങൾ’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു. αἰωνίους ‘നിത്യ’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: ‘അനീതിയുടെ സമ്പത്ത്’ എന്നതിന്റെ വ്യാഖ്യാനം
  choice: ഇപ്പോഴത്തെ അനീതിനിറഞ്ഞ ലോകക്രമത്തിൽപ്പെട്ട സമ്പത്ത് എന്ന വിശാലത നിലനിർത്തുന്നു
  alternative: വഞ്ചനയിലൂടെ സമ്പാദിച്ച ധനം മാത്രം; വ്യക്തിവൽക്കരിച്ച എതിരാളിയായ മാമോൻ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തെ മോഷ്ടിച്ചതോ വഞ്ചനയിലൂടെ നേടിയതോ ആയ ധനത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല; അതേസമയം മാമോനെ നിർബന്ധമായി വ്യക്തിവൽക്കരിക്കുന്നുമില്ല.
- issue: ἐκλίπῃയുടെ കർത്താവ്
  choice: സമ്പത്ത് ഇല്ലാതാകുന്നു
  alternative: നിങ്ങൾ ഇല്ലാതാകുമ്പോൾ, അഥവാ മരിക്കുമ്പോൾ; അല്ലെങ്കിൽ ലോകവിഭവങ്ങൾ പൊതുവേ തീരുമ്പോൾ
  rationale: ഏറ്റവും അടുത്ത സ്വാഭാവിക പൂർവപദം μαμωνᾶς ആണ്. എങ്കിലും ഗ്രീക്കിൽ കർത്താവ് തുറന്നു പറഞ്ഞിട്ടില്ലാത്തതിനാൽ മറ്റുവായനകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: സ്വീകരിക്കുന്ന ‘അവർ’ ആരാണ്
  choice: തിരിച്ചറിയാതെ അവ്യക്തമായി വിടുന്നു
  alternative: സമ്പത്ത് ഉപയോഗിച്ച് നേടിയ സുഹൃത്തുക്കൾ; ദരിദ്രർ/ദൈവജനങ്ങൾ; സ്വർഗീയ ജീവികൾ
  rationale: δέξωνται എന്ന ക്രിയയുടെ കർത്താവിനെ ഗ്രീക്ക് പ്രത്യേകം തിരിച്ചറിയുന്നില്ല. ഒരു നിർദിഷ്ട വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് അതിവ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യഘടന സ്വാഭാവികമാക്കിയെങ്കിലും ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരമായ അവ്യക്തതകൾ—സമ്പത്തിന്റെ സ്വഭാവം, ἐκλίπῃയുടെ കർത്താവ്, സ്വീകരിക്കുന്നവരുടെ തിരിച്ചറിയൽ—പരിഹരിക്കാതെ സൂക്ഷിച്ചിട്ടുണ്ട്.
