translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ഗ്രീക്കിലെ തുടർച്ചാഭാവം ‘വീണുകൊണ്ടിരുന്നവ’ എന്നും ‘നക്കിക്കൊണ്ടിരുന്നു’ എന്നും നിലനിർത്തി; വ്യാഖ്യാനാത്മകമായ ‘ഭക്ഷണാവശിഷ്ടങ്ങൾ’ അടിക്കുറിപ്പിൽ മാത്രം നൽകി.
