id: LUK.16.26
reference: Luke 16:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: ml
  text: ഇതിനെല്ലാം പുറമേ[a], ഞങ്ങൾക്കും നിങ്ങൾക്കും ഇടയിൽ ഒരു വലിയ അഗാധഗർത്തം ഉറപ്പിക്കപ്പെട്ടിരിക്കുന്നു. അതിനാൽ ഇവിടെനിന്ന് നിങ്ങളുടെ അടുക്കലേക്കു കടന്നുചെല്ലാൻ ആഗ്രഹിക്കുന്നവർക്ക് അതിനു കഴിയുകയില്ല; അവിടെനിന്ന് ഞങ്ങളുടെ അടുക്കലേക്കു കടന്നുവരാനും കഴിയുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ കാര്യങ്ങളിലെല്ലാം.” മറ്റൊരു പരിഗണന കൂട്ടിച്ചേർക്കാൻ ഗ്രീക്ക് പ്രയോഗം സന്ദർഭത്തിൽ ഇങ്ങനെ ഉപയോഗിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: ഇതിനെല്ലാം പുറമേ
  rationale: സന്ദർഭത്തിൽ മറ്റൊരു നിർണായക പരിഗണന കൂട്ടിച്ചേർക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം. കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: ഞങ്ങൾക്കും നിങ്ങൾക്കും ഇടയിൽ
  rationale: ഇരുകൂട്ടർക്കുമിടയിലെ സ്ഥലപരവും ബന്ധപരവുമായ അകലം വ്യക്തമായി നൽകുന്നു; ഗ്രീക്കിലെ ബഹുവചനവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാണ്.
- source_word: χάσμα μέγα
  choice: ഒരു വലിയ പിളർപ്പ്
  rationale: വശങ്ങൾ തമ്മിൽ കടക്കാനാവാത്തവിധം വേർതിരിക്കുന്ന വിടവിനെ സാധാരണ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐστήρικται
  choice: ഉറപ്പിച്ചിരിക്കുന്നു
  rationale: പെർഫെക്റ്റ് പാസീവിലുള്ള സ്ഥാപിക്കപ്പെട്ടതും തുടർന്നുനിൽക്കുന്നതുമായ അവസ്ഥ സംരക്ഷിക്കുന്നു.
- source_word: ὅπως
  choice: അതിനാൽ
  rationale: ഇവിടെ ഉറപ്പിച്ച പിളർപ്പിന്റെ ഫലമായി തുടർന്നുള്ള അസാധ്യത വരുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു; ഉദ്ദേശ്യം/ഫലം എന്ന ഗ്രീക്ക് വ്യാപ്തിയെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: οἱ θέλοντες
  choice: ആഗ്രഹിക്കുന്നവർ
  rationale: സബ്സ്റ്റാന്റിവൽ പാർട്ടിസിപ്പിളിന്റെ പൊതുവായ വ്യക്തിസമൂഹ സൂചന ലളിതമായി നൽകുന്നു.
- source_word: διαβῆναι
  choice: കടന്നുചെല്ലാൻ
  rationale: ഇവിടെനിന്ന് മറുവശത്തേക്കുള്ള ചലനവും ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള കടക്കലും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔνθεν πρὸς ὑμᾶς
  choice: ഇവിടെനിന്ന് നിങ്ങളുടെ അടുക്കലേക്ക്
  rationale: സംസാരിക്കുന്നവന്റെ വശത്തുനിന്നുള്ള ദിശാപരമായ കാഴ്ചപ്പാട് സംരക്ഷിക്കുന്നു.
- source_word: μὴ δύνωνται
  choice: അതിനു കഴിയുകയില്ല
  rationale: നിരോധനമല്ല, കഴിവില്ലായ്മയാണ് വ്യക്തമാക്കുന്നത്.
- source_word: μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν
  choice: അവിടെനിന്ന് ഞങ്ങളുടെ അടുക്കലേക്കു കടന്നുവരാനും കഴിയുകയില്ല
  rationale: മറുദിശയിലെ സമാന്തരമായ അസാധ്യതയും സംസാരിക്കുന്നവന്റെ കാഴ്ചപ്പാടും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ രണ്ടു മേഖലകൾക്കിടയിലെ വേർതിരിവിന്റെ സ്വഭാവം
  choice: ഉറപ്പിക്കപ്പെട്ടതും കടക്കാനാവാത്തതുമായ വേർതിരിവായി വാക്യത്തിന്റെ ഭാഷ വിവർത്തനം ചെയ്യുന്നു; അതിനപ്പുറം വ്യവസ്ഥാപിത സിദ്ധാന്തവിവരണം ചേർക്കുന്നില്ല.
  alternative: ഇത് മരണാനന്തരലോകത്തിലെ അക്ഷരാർഥ ഭൂപ്രകൃതിയായി നിർവചിക്കുക, അല്ലെങ്കിൽ സ്ഥിരമായ മരണാനന്തര വേർതിരിവിന്റെ യാതൊരു സൂചനയുമില്ലാത്ത ശുദ്ധ അലങ്കാരഭാഷയായി മാത്രം കാണുക.
  rationale: വാക്യം വേർതിരിവിന്റെ സ്ഥിരതയും കടക്കാനുള്ള അസാധ്യതയും ഊന്നുന്നു. ആ ശക്തി നിലനിർത്തിക്കൊണ്ട് വാക്യം തുറന്നുപറയാത്ത സിദ്ധാന്തവിശദീകരണം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പിളർപ്പ്’, ‘ഉറപ്പിച്ചിരിക്കുന്നു’, ‘കഴിയുകയില്ല’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ ഗൗരവവും സ്ഥിരമായ അസാധ്യതയും നിലനിർത്തുന്നു; മരണാനന്തരാവസ്ഥയെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്തഭാഷ ഒഴിവാക്കിയിരിക്കുന്നു.
