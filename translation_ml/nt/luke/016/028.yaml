id: LUK.16.28
reference: Luke 16:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔχω γὰρ πέντε ἀδελφούς, ὅπως διαμαρτύρηται αὐτοῖς, ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν εἰς τὸν τόπον τοῦτον τῆς βασάνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: ml
  text: കാരണം, എനിക്ക് അഞ്ചു സഹോദരന്മാരുണ്ട്; അവൻ അവർക്കു ഗൗരവപൂർവം മുന്നറിയിപ്പു നൽകേണ്ടതിന്[a], അവരും ഈ യാതനാസ്ഥലത്തേക്കു വരാതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരോടു ഗൗരവമായി സാക്ഷ്യപ്പെടുത്തേണ്ടതിന്’ അല്ലെങ്കിൽ ‘അവർക്കു ശക്തമായി മുന്നറിയിപ്പു നൽകേണ്ടതിന്.’ ഗ്രീക്കു ക്രിയയ്ക്ക് ഗൗരവപൂർവം സാക്ഷ്യപ്പെടുത്തുക, ശക്തമായി മുന്നറിയിപ്പു നൽകുക എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: കാരണം, എനിക്ക് … ഉണ്ട്
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം ‘കാരണം’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ἔχω എന്ന സാധാരണ ക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ ‘എനിക്ക് … ഉണ്ട്’ എന്നു പറയുന്നു.
- source_word: πέντε ἀδελφούς
  choice: അഞ്ചു സഹോദരന്മാർ
  rationale: പുരുഷലിംഗ ബഹുവചനമായ ἀδελφούς ഈ സന്ദർഭത്തിൽ പുരുഷസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὅπως διαμαρτύρηται αὐτοῖς
  choice: അവൻ അവർക്കു ഗൗരവപൂർവം മുന്നറിയിപ്പു നൽകേണ്ടതിന്
  rationale: ὅπως ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. διαμαρτύρομαι എന്ന ക്രിയയിലെ ഗൗരവമുള്ള സാക്ഷ്യപ്പെടുത്തൽ/മുന്നറിയിപ്പ് എന്ന അർഥവ്യാപ്തിയിൽ, തുടർന്നുള്ള ഒഴിവാക്കൽലക്ഷ്യം പരിഗണിച്ച് ‘ഗൗരവപൂർവം മുന്നറിയിപ്പു നൽകുക’ എന്നു തെരഞ്ഞെടുത്തു.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: അവരും … വരാതിരിക്കേണ്ടതിന്
  rationale: ἵνα μή നിഷേധാത്മക ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; καὶ αὐτοὶ എന്നതിലെ ‘അവരും’ എന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: ഈ യാതനാസ്ഥലത്തേക്ക്
  rationale: εἰς ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ഗതി സൂചിപ്പിക്കുന്നു. βάσανος എന്നതിലെ കഠിനവേദനയുടെ അർഥം ‘യാതന’ വ്യക്തമാക്കുന്നു; വാക്യം പറയുന്നതിലധികമായ പരലോകസിദ്ധാന്തം ഇതിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ധനവാന്റെ വാക്കുകളിലെ പരലോകസ്ഥലത്തിന്റെ വിവരണം
  choice: ഈ യാതനാസ്ഥലം
  alternative: കഠിനവേദനയുടെ ഈ സ്ഥലം; ഈ പീഡനസ്ഥലം
  rationale: βάσανος സൂചിപ്പിക്കുന്ന യാതനയുടെ തീവ്രത നിലനിർത്തുന്നു; എന്നാൽ ഈ വാക്യം നൽകാത്ത കൂടുതൽ സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. മുൻവാക്യത്തിലെ അയയ്ക്കണമെന്ന അപേക്ഷയോടുള്ള ആശ്രിതബന്ധം നിലനിർത്താൻ രണ്ട് ഉദ്ദേശ്യഘടകങ്ങളും ‘…േണ്ടതിന്/…േണ്ടതിനുമാണ്’ എന്ന സമാന്തരരൂപത്തിൽ അവതരിപ്പിച്ചു.
