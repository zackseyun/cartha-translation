  source_fidelity: 'The Malayalam accurately reflects the conditional argument: failure to prove faithful in relation to unrighteous wealth is contrasted with being entrusted with what is true. ‘അനീതിയുള്ള സമ്പത്ത്,’ ‘വിശ്വസ്തർ,’ and ‘വിശ്വസിച്ചേൽപ്പിക്കും’ appropriately render ἀδίκῳ μαμωνᾷ, πιστοί, and πιστεύσει in this stewardship context. The supplied ‘സമ്പത്ത്’ for substantival τὸ ἀληθινόν is a restrained and contextually well-supported clarification.'
