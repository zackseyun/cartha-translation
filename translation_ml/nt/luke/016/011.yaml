id: LUK.16.11
reference: Luke 16:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: ml
  text: അതുകൊണ്ട്, അനീതിയുള്ള സമ്പത്തിന്റെ കാര്യത്തിൽ നിങ്ങൾ വിശ്വസ്തരായില്ലെങ്കിൽ[a], യഥാർഥ സമ്പത്ത്[b] ആർ നിങ്ങളെ വിശ്വസിച്ചേൽപ്പിക്കും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വഞ്ചനാപരമായ സമ്പത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ അക്ഷരാർഥം ‘അനീതിയുള്ള മാമോൻ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘യഥാർഥമായത്’; ലൗകിക സമ്പത്തിനോടുള്ള വൈരുധ്യം വ്യക്തമാക്കാൻ ഇവിടെ ‘യഥാർഥ സമ്പത്ത്’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδίκῳ
  choice: അനീതിയുള്ള
  rationale: ‘അനീതിയുള്ള/നീതികെട്ട’ എന്ന ധാർമ്മിക ഭാവം നിലനിർത്തുന്നു; ‘ലൗകികമായ’ എന്നത് അമിത വ്യാഖ്യാനവും ‘വഞ്ചനയിലൂടെ നേടിയ’ എന്നത് അർഥം അനാവശ്യമായി ചുരുക്കുന്നതുമാണ്.
- source_word: μαμωνᾷ
  choice: സമ്പത്ത്
  rationale: പണം മാത്രമല്ല, സ്വത്തും വിഭവങ്ങളും ഉൾക്കൊള്ളാവുന്ന μαμωνᾶς എന്ന പദത്തിന്റെ വിശാല അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: അനീതിയുള്ള സമ്പത്തിന്റെ കാര്യത്തിൽ
  rationale: വിശ്വസ്തത തെളിയിക്കപ്പെടുന്ന മേഖലയെ സൂചിപ്പിക്കുന്ന ἐν എന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πιστοὶ
  choice: വിശ്വസ്തർ
  rationale: കാര്യവിചാരകത്വത്തിന്റെ പശ്ചാത്തലത്തിൽ ആശ്രയിക്കാവുന്നവരും ഏൽപ്പിക്കപ്പെട്ട കാര്യത്തിൽ നേരുള്ളവരുമായിരിക്കുക എന്ന ആശയം നൽകുന്നു.
- source_word: οὐκ ἐγένεσθε
  choice: വിശ്വസ്തരായില്ലെങ്കിൽ
  rationale: പ്രവൃത്തിയിൽ വിശ്വസ്തരായി തെളിയാതിരുന്നതിനെ ഉപാധിവാക്യത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸ ἀληθινὸν
  choice: യഥാർഥ സമ്പത്ത്
  rationale: ഗ്രീക്കിൽ നാമം വ്യക്തമാക്കാതെ ‘യഥാർഥമായത്’ എന്നു മാത്രമാണെങ്കിലും, μαμωνᾷ എന്നതിനോടുള്ള വൈരുധ്യം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘സമ്പത്ത്’ ചേർത്തിരിക്കുന്നു.
- source_word: πιστεύσει
  choice: വിശ്വസിച്ചേൽപ്പിക്കും
  rationale: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പരോക്ഷ കർമവും ഏൽപ്പിക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പ്രത്യക്ഷ കർമവും ഉള്ളതിനാൽ ഇവിടെ അർഥം ‘വിശ്വസിക്കുക’ എന്നതിലുപരി ‘വിശ്വസിച്ച് ഏൽപ്പിക്കുക’ എന്നാണ്.
theological_decisions:
- issue: τὸ ἀληθινὸν എന്നതിലെ സൂചിത നാമം
  choice: യഥാർഥ സമ്പത്ത്
  alternative: യഥാർഥമായത്
  rationale: മൂലപാഠം നാമത്തെ സൂചിതമായി വിടുന്നു. എന്നാൽ ഉടൻ മുമ്പുള്ള ‘സമ്പത്ത്’ എന്നതിനോടുള്ള വൈരുധ്യം ശക്തമായതിനാൽ, സാധാരണ മലയാളത്തിൽ ആശയം വ്യക്തമാക്കാൻ ‘സമ്പത്ത്’ ചേർത്തു; അത് ഏതെങ്കിലും പ്രത്യേക സ്വർഗീയ പ്രതിഫലമായി നിർവചിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘മാമോൻ’ എന്ന അപരിചിത ലിപ്യന്തരണം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി; മൂലത്തിലെ ധാർമ്മിക ഭാവവും ‘യഥാർഥമായത്’ എന്ന പ്രയോഗത്തിലെ സൂചിതത്വവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
