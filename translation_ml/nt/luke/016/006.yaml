id: LUK.16.6
reference: Luke 16:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: ml
  text: 'അയാൾ പറഞ്ഞു: “നൂറ് ബത്ത്[a] ഒലിവെണ്ണ.” കാര്യസ്ഥൻ അയാളോടു പറഞ്ഞു: “നിന്റെ കടപ്പത്രം[b] എടുക്കുക; വേഗം ഇരുന്ന് അമ്പത് എന്ന് എഴുതുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബത്ത്’ ഒരു പുരാതന ദ്രാവക അളവായിരുന്നു. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘നൂറ് ബത്ത് ഒലിവെണ്ണ’ എന്നാണ്.
    reason: cultural_note
  - marker: b
    text: ‘നിന്റെ എഴുത്തുരേഖകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ബഹുവചനമായി ‘നിന്റെ എഴുത്തുകൾ’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ കടക്കാരന്റെ കടപ്പത്രത്തെയോ കടരേഖയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: ബാത്ത്
  rationale: ഇത് ഒരു പ്രത്യേക പുരാതന ദ്രാവക അളവാണ്. പൊതുവായ ‘അളവ്’ എന്നതിനു പകരം അളവിന്റെ പേര് ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലപാഠത്തിലെ സാമ്പത്തിക വിശദാംശം നിലനിർത്തുന്നു.
- source_word: ἐλαίου
  choice: ഒലിവെണ്ണ
  rationale: ഈ സന്ദർഭത്തിൽ ἔλαιον ഒലിവിൽനിന്നുള്ള എണ്ണയെ സൂചിപ്പിക്കുന്നു; ‘എണ്ണ’ എന്നതിനെക്കാൾ ‘ഒലിവെണ്ണ’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: Δέξαι
  choice: എടുക്കുക
  rationale: രേഖ കൈയിലെടുക്കാനുള്ള നിർദേശമാണ് ഇവിടെ; ‘സ്വീകരിക്കുക’ എന്നതിനെക്കാൾ ‘എടുക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: τὰ γράμματα
  choice: നിന്റെ കടപ്പത്രം
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ബഹുവചനമായ ‘എഴുത്തുകൾ/രേഖകൾ’ എന്നാണ്. കടബാധ്യതയുടെ സന്ദർഭത്തിൽ അത് കടത്തിന്റെ എഴുത്തുരേഖയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കടപ്പത്രം’ വ്യക്തവും സ്വാഭാവികവുമാണ്; മൂലപദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: καθίσας
  choice: ഇരുന്ന്
  rationale: പിന്നാലെയുള്ള ആജ്ഞയോടു ചേർന്നുള്ള പ്രവൃത്തിയായി ഈ കൃുദന്തം വരുന്നു; ‘ഇരുന്ന് ... എഴുതുക’ എന്നത് പ്രവർത്തനക്രമം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ταχέως
  choice: വേഗം
  rationale: ταχέως പ്രവർത്തനത്തിന്റെ ത്വരയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: γράψον
  choice: എന്ന് എഴുതുക
  rationale: കടപ്പത്രത്തിൽ പുതുക്കിയ തുക രേഖപ്പെടുത്താനുള്ള ആജ്ഞയാണ്. മലയാളത്തിൽ സംഖ്യയ്ക്കു ശേഷം ‘എന്ന് എഴുതുക’ എന്നു പറയുന്നത് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: πεντήκοντα
  choice: അമ്പത്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള മലയാള തുല്യപദം.
