translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. സംസാരഭാഗം സ്വാഭാവികമാക്കാൻ ആദ്യ കർത്താവിന് ‘അയാൾ’ എന്നും രണ്ടാമത്തെ സംസാരിക്കുന്ന വ്യക്തിയെ സന്ദർഭാനുസൃതമായി ‘കാര്യസ്ഥൻ’ എന്നും വ്യക്തമാക്കി; പുരാതന അളവുപേര് നിലനിർത്തി അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
