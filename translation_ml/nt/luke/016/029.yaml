  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει ⸀δὲ Ἀβραάμ· Ἔχουσι Μωϋσέα καὶ τοὺς προφήτας· ἀκουσάτωσαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: ml
  text: 'എന്നാൽ അബ്രാഹാം പറഞ്ഞു: “അവർക്ക് മോശയും പ്രവാചകന്മാരും ഉണ്ട്[a]; അവർ അവരെ കേൾക്കട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മോശയും പ്രവാചകന്മാരും” എന്നത് മോശയോടു ബന്ധപ്പെട്ട രചനകളും പ്രവാചകഗ്രന്ഥങ്ങളും നൽകുന്ന തിരുവെഴുത്തുസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവർ അവരെ കേൾക്കട്ടെ.” ഇവിടെ “അവരെ” എന്നത് മോശയെയും പ്രവാചകന്മാരെയും, അഥവാ അവരുടെ തിരുവെഴുത്തുസാക്ഷ്യത്തെയും, സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: λέγει എന്ന ചരിത്രവർത്തമാനത്തെ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായി നൽകി. δέ ഇവിടെ മറുപടിയിലെ മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Ἀβραάμ
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: Ἔχουσι
  choice: അവർക്കു ... ഉണ്ടല്ലോ
  rationale: അവർക്കു ഇപ്പോൾ ലഭ്യമായിരിക്കുന്ന സാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന ലളിത വർത്തമാനരൂപം. ‘ഉണ്ടല്ലോ’ എന്നത് മറുപടിയുടെ ഊന്നൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: മോശയും പ്രവാചകന്മാരും
  rationale: മോശയോടു ബന്ധപ്പെട്ട രചനകളും പ്രവാചകഗ്രന്ഥങ്ങളും ഉൾപ്പെടുന്ന തിരുവെഴുത്തുസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന യഹൂദ പ്രയോഗം വികസിപ്പിക്കാതെ നിലനിർത്തി.
- source_word: ἀκουσάτωσαν
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാം പുരുഷ ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ ശക്തി മലയാളത്തിലെ ‘-ട്ടെ’ രൂപം നേരിട്ട് നൽകുന്നു; സന്ദർഭത്തിൽ ഇത് വെറും ശ്രവണമല്ല, ശ്രദ്ധിച്ചു അനുസരിക്കലും സൂചിപ്പിക്കാം.
- source_word: αὐτῶν
  choice: അവരുടെ വാക്കു
  rationale: ജനിറ്റീവ് രൂപം ‘മോശയും പ്രവാചകന്മാരും’ നൽകുന്ന സാക്ഷ്യം കേൾക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും പറയാൻ ‘അവരുടെ വാക്കു’ എന്നു നൽകി; അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥരൂപം രേഖപ്പെടുത്തി.
theological_decisions:
- issue: ‘മോശയും പ്രവാചകന്മാരും’ എന്നതിന്റെ സൂചിതാർഥം
  choice: ഇതിനകം ലഭ്യമായിരുന്ന അധികാരമുള്ള തിരുവെഴുത്തുസാക്ഷ്യത്തിന്റെ പര്യായപ്രയോഗമായി മനസ്സിലാക്കുന്നു; മുഖ്യപാഠത്തിൽ മൂലത്തിലെ സംക്ഷിപ്ത പ്രയോഗം നിലനിർത്തി.
  alternative: ചരിത്രപുരുഷന്മാരായ മോശയെയും പ്രവാചകന്മാരെയും മാത്രം സൂചിപ്പിക്കുന്ന ഇടുങ്ങിയ വായന.
  rationale: ലൂക്കോസിലും യഹൂദപ്രയോഗത്തിലും ഈ വാക്കുകൾ സാധാരണയായി തിരുവെഴുത്തുകളെ സൂചിപ്പിക്കുന്നു. എന്നാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പരമ്പരാഗതമായി തിരിച്ചറിയാവുന്ന ‘അബ്രാഹാം’, ‘മോശ’, ‘പ്രവാചകന്മാർ’ എന്നീ രൂപങ്ങൾ നിലനിർത്തി; വാക്യത്തിന്റെ ആജ്ഞാഭാവവും തിരുവെഴുത്തുസാക്ഷ്യത്തെക്കുറിച്ചുള്ള സൂചിതാർഥവും സംരക്ഷിച്ചു.
