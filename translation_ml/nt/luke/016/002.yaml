revisions:
- from: 'അവനെ വിളിച്ചുവരുത്തി അയാൾ അവനോടു പറഞ്ഞു: “നിന്നെക്കുറിച്ച് ഞാൻ കേൾക്കുന്ന ഈ കാര്യം എന്താണ്? നിന്റെ കാര്യനിർവഹണത്തിന്റെ കണക്ക് ഏൽപ്പിച്ചുതരുക[a]; ഇനി നിനക്കു കാര്യനിർവാഹകനായി തുടരാൻ കഴിയുകയില്ല[b].”'
  to: 'അവനെ വിളിച്ചിട്ട് അവനോടു പറഞ്ഞു: “നിന്നെക്കുറിച്ച് ഞാൻ കേൾക്കുന്ന ഈ കാര്യം എന്താണ്? നിന്റെ കാര്യനിർവഹണത്തിന്റെ കണക്ക് സമർപ്പിക്കുക[a]; ഇനി നിനക്കു കാര്യനിർവാഹകനായി തുടരാൻ കഴിയുകയില്ല[b].”'
  rationale: The revision improves idiomatic modern Malayalam while retaining the Greek administrative-accounting sense and the cognate relationship between management (οἰκονομία) and serving as manager/steward (οἰκονομεῖν). No theological interpretation has been added.
