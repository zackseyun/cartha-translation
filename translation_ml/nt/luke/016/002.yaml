reference: Luke 16:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: ml
  text: 'അവനെ വിളിച്ചിട്ട് അവനോടു പറഞ്ഞു: “നിന്നെക്കുറിച്ച് ഞാൻ കേൾക്കുന്ന ഈ കാര്യം എന്താണ്? നിന്റെ കാര്യനിർവഹണത്തിന്റെ കണക്ക് സമർപ്പിക്കുക[a]; ഇനി നിനക്കു കാര്യനിർവാഹകനായി തുടരാൻ കഴിയുകയില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ കാര്യനിർവഹണത്തിന്റെ കണക്ക് ഏൽപ്പിച്ചുതരുക.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇനി നിനക്കു കാര്യങ്ങൾ നടത്താൻ കഴിയുകയില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: അവനെ വിളിച്ചുവരുത്തി
  rationale: Aorist participle main verb-നു മുമ്പുള്ള നടപടിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ നേരിട്ടു വിളിക്കുകയെന്നതിലുപരി തന്റെ സന്നിധിയിലേക്കു വരുത്തിയെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: നിന്നെക്കുറിച്ച് ഞാൻ കേൾക്കുന്ന ഈ കാര്യം എന്താണ്?
  rationale: ഗ്രീക്കിലെ ചോദ്യത്തിന്റെ കുറ്റപ്പെടുത്തൽനിറഞ്ഞ വാചകശക്തിയും περὶ σοῦ എന്നതിന്റെ ‘നിന്നെക്കുറിച്ച്’ എന്ന അർഥവും അമിത വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ἀπόδος τὸν λόγον
  choice: കണക്ക് ഏൽപ്പിച്ചുതരുക
  rationale: ഭരണപരമായ ഈ സന്ദർഭത്തിൽ λόγος കണക്കോ കണക്കുബോധിപ്പിക്കലോ ആണ്; ἀπόδος ആവശ്യപ്പെട്ട കണക്ക് സമർപ്പിക്കണം എന്ന അർഥം നൽകുന്നു.
- source_word: τῆς οἰκονομίας σου
  choice: നിന്റെ കാര്യനിർവഹണത്തിന്റെ
  rationale: മറ്റൊരാളുടെ സ്വത്തോ ഭവനകാര്യങ്ങളോ കൈകാര്യം ചെയ്യുന്ന ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വമാണ് οἰκονομία; ‘കാര്യനിർവഹണം’ ആ ചുമതലയുടെ പ്രവർത്തനപരമായ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: ഇനി നിനക്കു കാര്യനിർവാഹകനായി തുടരാൻ കഴിയുകയില്ല
  rationale: δύνῃ + infinitive-ന്റെ കഴിവില്ലായ്മയും ἔτι-യുടെ ‘ഇനി ... ഇല്ല’ എന്ന അവസാനിപ്പിക്കൽഭാവവും സംരക്ഷിക്കുന്നു; οἰκονομεῖν ഇവിടെ ആ പദവിയിൽ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: δύνῃ എന്നത് ശാരീരിക/പ്രായോഗിക അശക്തിയാണോ, അധികാരം പിൻവലിച്ചതാണോ
  choice: ഇനി നിനക്കു കാര്യനിർവാഹകനായി തുടരാൻ കഴിയുകയില്ല
  alternative: ഇനി നീ കാര്യങ്ങൾ നടത്തേണ്ടതില്ല
  rationale: മൂലത്തിലെ ‘കഴിയുക’ എന്ന ഭാഷ നിലനിർത്തുകയും സന്ദർഭം സൂചിപ്പിക്കുന്ന പദവിനഷ്ടം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; വെറും വിലക്കായി മാത്രം മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘കാര്യനിർവഹണം/കാര്യനിർവാഹകൻ’ എന്ന ഒരേ പദകുടുംബം ഉപയോഗിച്ച് οἰκονομία/οἰκονομεῖν തമ്മിലുള്ള ബന്ധം ദൃശ്യമാക്കി; അടിക്കുറിപ്പുകളുടെ [a], [b] അടയാളങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
