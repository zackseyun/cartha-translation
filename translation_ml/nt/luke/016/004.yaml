translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. കാര്യവിചാരകന്റെ സ്ഥാനവും ഭാവിയിലെ നീക്കലും ആതിഥ്യമായി സ്വീകരിക്കപ്പെടുമെന്ന ലക്ഷ്യവും വ്യക്തമായി സൂക്ഷിച്ചു.
