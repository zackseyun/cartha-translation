reference: Luke 16:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: ml
  text: കാര്യനിർവഹണച്ചുമതലയിൽനിന്ന് എന്നെ നീക്കുമ്പോൾ അവർ എന്നെ തങ്ങളുടെ വീടുകളിൽ സ്വീകരിക്കേണ്ടതിന് ഞാൻ എന്തു ചെയ്യണമെന്ന് എനിക്കറിയാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാര്യനിർവഹണച്ചുമതലയിൽനിന്ന് എന്നെ പിരിച്ചുവിടുമ്പോൾ.”
    reason: μετασταθῶ എന്നതിന് ഈ സന്ദർഭത്തിൽ സ്ഥാനത്തുനിന്നുള്ള പിരിച്ചുവിടൽ എന്ന അർഥവുമുണ്ട്; പ്രധാന പാഠത്തിലെ ‘നീക്കുക’ മൂലപദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: ἔγνων
  choice: എനിക്കറിയാം
  rationale: സന്ദർഭത്തിൽ ഈ ഭൂതകാലരൂപം പെട്ടെന്നുണ്ടായ തിരിച്ചറിവിനെയോ തീരുമാനത്തിലെത്തിയതിനെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എനിക്കറിയാം’ എന്നത് ആ ഫലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τί ποιήσω
  choice: എന്തു ചെയ്യണമെന്ന്
  rationale: τί-യോടുകൂടിയ deliberative subjunctive ആലോചിക്കപ്പെടുന്ന പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികവും ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: ἵνα ὅταν
  choice: അങ്ങനെ ... നീക്കുമ്പോൾ
  rationale: ἵνα ഉദ്ദേശ്യവും ὅταν ഭാവിയിലെ സംഭവസാഹചര്യവും പ്രകടിപ്പിക്കുന്നു; മലയാള വാക്യഘടനയിൽ ‘അങ്ങനെ ... ചെയ്യുമ്പോൾ’ രണ്ടിന്റെയും ബലം നിലനിർത്തുന്നു.
- source_word: μετασταθῶ
  choice: എന്നെ നീക്കുമ്പോൾ
  rationale: μεθίστημι-യുടെ കർമണിപ്രയോഗം ഒരു സ്ഥാനത്തുനിന്ന് നീക്കപ്പെടുന്നതാണ്. സന്ദർഭത്തിൽ പിരിച്ചുവിടലാണ് ഉദ്ദേശ്യമെങ്കിലും പ്രധാന പാഠത്തിൽ കൂടുതൽ വിശാലമായ ‘നീക്കുക’ നിലനിർത്തുന്നു.
- source_word: ἐκ τῆς οἰκονομίας
  choice: കാര്യവിചാരകസ്ഥാനത്തുനിന്ന്
  rationale: οἰκονομία ഇവിടെ ഗൃഹകാര്യങ്ങളുടെ ഭരണച്ചുമതലയോ അതിന്റെ ഔദ്യോഗിക സ്ഥാനമോ ആണ്; ‘കാര്യവിചാരകസ്ഥാനം’ ആ സന്ദർഭാർഥം ചുരുക്കമായും മാന്യമായും നൽകുന്നു.
- source_word: δέξωνταί με
  choice: അവർ എന്നെ ... സ്വീകരിക്കും
  rationale: δέχομαι സ്വീകരിക്കുക/വരവേൽക്കുക എന്നർഥമുള്ളതാണ്. ഇവിടെ വീടുകളിൽ പാർപ്പിക്കാൻ ഏറ്റെടുക്കുക എന്ന ആതിഥ്യമർഥം ‘സ്വീകരിക്കും’ നിഷ്പക്ഷമായി നിലനിർത്തുന്നു.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: തങ്ങളുടെ വീടുകളിൽ
  rationale: οἶκος ഇവിടെ താമസത്തിനായി ഒരാളെ ഉൾക്കൊള്ളുന്ന ‘വീട്’ എന്നർഥത്തിലാണ്. ἑαυτῶν എന്ന പ്രത്യാവർത്തക സർവനാമം ‘തങ്ങളുടെ’ വഴി വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
