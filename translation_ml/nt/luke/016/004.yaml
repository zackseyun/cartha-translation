revisions:
- from: എന്തു ചെയ്യണമെന്ന് എനിക്കറിയാം; അങ്ങനെ, കാര്യവിചാരകസ്ഥാനത്തുനിന്ന് എന്നെ നീക്കുമ്പോൾ അവർ എന്നെ തങ്ങളുടെ വീടുകളിൽ സ്വീകരിക്കും.[a]
  to: കാര്യനിർവഹണച്ചുമതലയിൽനിന്ന് എന്നെ നീക്കുമ്പോൾ അവർ എന്നെ തങ്ങളുടെ വീടുകളിൽ സ്വീകരിക്കേണ്ടതിന് ഞാൻ എന്തു ചെയ്യണമെന്ന് എനിക്കറിയാം.[a]
