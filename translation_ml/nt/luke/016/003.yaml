id: LUK.16.3
reference: Luke 16:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: ml
  text: 'കാര്യസ്ഥൻ[a] തന്നോടുതന്നെ പറഞ്ഞു: ‘ഞാൻ എന്തു ചെയ്യും? എന്റെ യജമാനൻ എന്റെ കാര്യസ്ഥചുമതല എന്നിൽനിന്ന് എടുത്തുകളയുന്നതിനാൽ കുഴിക്കാൻ എനിക്കു ശക്തിയില്ല; ഭിക്ഷ യാചിക്കാൻ ലജ്ജ തോന്നുന്നു.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാര്യസ്ഥൻ’ എന്നതിന് ‘വീട്ടുകാര്യസ്ഥൻ’ എന്നും ‘കാര്യസ്ഥചുമതല’ എന്നതിന് ‘കാര്യനിർവഹണച്ചുമതല’ എന്നും പരിഭാഷപ്പെടുത്താം. വ്യക്തിയെയും അയാളുടെ ചുമതലയെയും സൂചിപ്പിക്കാൻ ഗ്രീക്കിൽ ഒരേ പദകുടുംബത്തിലെ വാക്കുകളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: കാര്യസ്ഥൻ / കാര്യനിർവഹണച്ചുമതല
  rationale: മറ്റൊരാളുടെ സ്വത്തും ഇടപാടുകളും ഏൽപ്പിക്കപ്പെട്ട് നടത്തിപ്പു ചെയ്യുന്ന വ്യക്തിയെയും അയാളുടെ ചുമതലയെയും സന്ദർഭോചിതവും ആധുനികവുമായ ഭാഷയിൽ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ ബന്ധപദങ്ങളുടെ ആശയബന്ധം മലയാളത്തിലും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: ἐν ἑαυτῷ
  choice: തന്നോടുതന്നെ പറഞ്ഞു
  rationale: ആന്തരികമായ ആലോചനയെയോ സ്വയം സംസാരിക്കുന്നതിനെയോ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: Τί ποιήσω
  choice: ഞാൻ എന്തു ചെയ്യും?
  rationale: ഭാവിയിൽ സ്വീകരിക്കേണ്ട നടപടിയെക്കുറിച്ചുള്ള സ്വയംചോദ്യത്തിന്റെ ആലോചനാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κύριός μου
  choice: എന്റെ യജമാനൻ
  rationale: ഉപമയിലെ മനുഷ്യനായ അധികാരിയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ദൈവിക സ്ഥാനപ്പേരിന്റെ ധ്വനി വരുത്താതെ അധികാരബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἀφαιρεῖται ... ἀπ’ ἐμοῦ
  choice: എന്നിൽനിന്ന് എടുത്തുകളയുകയാണല്ലോ
  rationale: ചുമതല നീക്കം ചെയ്യപ്പെടുന്ന പ്രക്രിയയും ‘എന്നിൽനിന്ന്’ എന്ന ഉറവിടബന്ധവും നിലനിർത്തുന്നു; ὅτι ഈ സാഹചര്യത്തെ ആലോചനയുടെ കാരണമായി അവതരിപ്പിക്കുന്നതിനാൽ ‘ആണല്ലോ’ യോജിക്കുന്നു.
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: കുഴിക്കാൻ വേണ്ട ശക്തി എനിക്കില്ല
  rationale: കുഴിക്കൽ എന്ന കഠിനാധ്വാനവുമായി ബന്ധപ്പെട്ട ശാരീരിക ശക്തിയുടെ ന്യൂവാൻസ് വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: യാചിക്കാൻ എനിക്ക് ലജ്ജയാണ്
  rationale: ഭിക്ഷ യാചിക്കുന്നതിനെക്കുറിച്ചുള്ള ലജ്ജ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവികമല്ലാത്ത ഉപമാസന്ദർഭത്തിലെ κύριος
  choice: യജമാനൻ
  alternative: കർത്താവ് / ഉടമ
  rationale: ഇവിടെ സൂചിപ്പിക്കുന്നത് ഉപമയിലെ ധനികനായ മനുഷ്യനെയാണ്. ‘യജമാനൻ’ അധികാരബന്ധം സംരക്ഷിക്കുമ്പോൾ അനാവശ്യമായ ദൈവിക അർഥധ്വനി ഒഴിവാക്കുന്നു; ‘ഉടമ’ എന്നത് സ്വത്തുടമസ്ഥതയിൽ മാത്രം അർഥം ചുരുക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ഉപമയിലെ സാമൂഹിക അധികാരബന്ധം വ്യക്തമായി സൂക്ഷിക്കുകയും സംസാരിക്കുന്നവന്റെ ആശങ്കയും ലജ്ജയും നേരിട്ടുള്ള സംഭാഷണശൈലിയിൽ നിലനിർത്തുകയും ചെയ്തു.
