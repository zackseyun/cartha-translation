- from: 'അപ്പോൾ കാര്യസ്ഥൻ[a] തന്നോടുതന്നെ പറഞ്ഞു: ‘എന്റെ യജമാനൻ കാര്യനിർവഹണച്ചുമതല എന്നിൽനിന്ന് എടുത്തുകളയുകയാണല്ലോ; ഞാൻ എന്തു ചെയ്യും? കുഴിക്കാൻ വേണ്ട ശക്തി എനിക്കില്ല; യാചിക്കാൻ എനിക്ക് ലജ്ജയാണ്.’'
  to: 'കാര്യസ്ഥൻ[a] തന്നോടുതന്നെ പറഞ്ഞു: ‘ഞാൻ എന്തു ചെയ്യും? എന്റെ യജമാനൻ എന്റെ കാര്യസ്ഥചുമതല എന്നിൽനിന്ന് എടുത്തുകളയുന്നതിനാൽ കുഴിക്കാൻ എനിക്കു ശക്തിയില്ല; ഭിക്ഷ യാചിക്കാൻ ലജ്ജ തോന്നുന്നു.’'
