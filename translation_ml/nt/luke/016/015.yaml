id: LUK.16.15
reference: Luke 16:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “മനുഷ്യരുടെ മുമ്പിൽ സ്വയം നീതീകരിക്കുന്നവർ നിങ്ങളാണ്[a]. എന്നാൽ ദൈവം നിങ്ങളുടെ ഹൃദയങ്ങൾ അറിയുന്നു. കാരണം, മനുഷ്യരുടെ ഇടയിൽ ഉന്നതമായിരിക്കുന്നത്[b] ദൈവത്തിന്റെ മുമ്പിൽ അറപ്പുളവാക്കുന്ന ഒന്നാണ്[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളെത്തന്നെ നീതിമാന്മാരായി അവതരിപ്പിക്കുന്നവർ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മനുഷ്യരുടെ ഇടയിൽ വളരെ വിലമതിക്കപ്പെടുന്നത്.”
    reason: alternative_reading
  - marker: c
    text: അഥവാ, “ദൈവത്തിന്റെ മുമ്പിൽ ഒരു അറപ്പായ കാര്യമാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτούς
  choice: നിങ്ങളെത്തന്നെ നീതിമാന്മാരായി അവതരിപ്പിക്കുന്നവർ
  rationale: സ്വയം നീതിമാനാണെന്ന് മറ്റുള്ളവരുടെ മുമ്പിൽ സ്ഥാപിക്കുകയോ കാണിക്കുകയോ ചെയ്യുന്നതാണ് സന്ദർഭത്തിലെ ആശയം. മലയാളത്തിൽ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് δικαιόω എന്ന പദത്തിന്റെ നീതി/നീതിമാൻ ബന്ധവും ഈ പരിഭാഷ സൂക്ഷിക്കുന്നു.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ മുമ്പിൽ
  rationale: ἐνώπιον എന്നതിന്റെ ‘മുമ്പിൽ/കൺമുന്നിൽ’ എന്ന അർഥവും ἀνθρώπων എന്നതിന്റെ പൊതുവായ മനുഷ്യസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങൾ അറിയുന്നു
  rationale: ‘ഹൃദയങ്ങൾ’ എന്നത് ഉള്ളിലെ ചിന്തകളും ഉദ്ദേശ്യങ്ങളും ഉൾക്കൊള്ളുന്ന ബൈബിൾപ്രയോഗമാണ്; വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി മൂലരൂപം നിലനിർത്തുന്നു.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλόν
  choice: മനുഷ്യരുടെ ഇടയിൽ ഉന്നതമായി കണക്കാക്കപ്പെടുന്നത്
  rationale: ὑψηλόν എന്ന ഉയരം/ഉന്നതി രൂപകം നിലനിർത്തുകയും സാമൂഹികമായി ആദരിക്കപ്പെടുന്നതോ ഏറെ വിലമതിക്കപ്പെടുന്നതോ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: βδέλυγμα
  choice: അറപ്പുളവാക്കുന്നതാണ്
  rationale: ദൈവത്തിന് അത്യന്തം വെറുപ്പും അറപ്പും ഉളവാക്കുന്ന ഒന്നിനെ സൂചിപ്പിക്കുന്ന ശക്തമായ പദമാണ്; ആ ശക്തി ആധുനികവും മനസ്സിലാക്കാവുന്നതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മുമ്പിൽ
  rationale: ആദ്യത്തെ ἐνώπιον പ്രയോഗത്തോടുള്ള സമാന്തരതയും മനുഷ്യരുടെ വിലയിരുത്തലും ദൈവത്തിന്റെ വിലയിരുത്തലും തമ്മിലുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: '...വർ നിങ്ങളാണ്'
  rationale: ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: δικαιοῦντες എന്നതിന്റെ സന്ദർഭാർഥം
  choice: നിങ്ങളെത്തന്നെ നീതിമാന്മാരായി അവതരിപ്പിക്കുന്നവർ
  alternative: നിങ്ങളെത്തന്നെ നീതീകരിക്കുന്നവർ
  rationale: ഇവിടെ ദൈവം നീതീകരിക്കുന്നതിനെക്കാൾ മനുഷ്യരുടെ മുമ്പിൽ സ്വയം നീതിമാനായി സ്ഥാപിക്കുന്നതാണ് ഊന്നൽ. എങ്കിലും നിയമപരമായ/നീതീകരണപരമായ പദബന്ധം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: τὸ ἐν ἀνθρώποις ὑψηλόν എന്നതിന്റെ വ്യാപ്തി
  choice: മനുഷ്യരുടെ ഇടയിൽ ഉന്നതമായി കണക്കാക്കപ്പെടുന്നത്
  alternative: മനുഷ്യരുടെ ഇടയിൽ വളരെ വിലമതിക്കപ്പെടുന്നത്
  rationale: ഈ പ്രയോഗം സാമൂഹികമായി ഉയർത്തപ്പെടുന്നതും ആദരിക്കപ്പെടുന്നതും വിലമതിക്കപ്പെടുന്നതും സൂചിപ്പിക്കാം. ‘ഉന്നതമായി’ എന്നത് ഉയരം എന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു; മൂല്യനിർണയത്തെ മുൻനിർത്തുന്ന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: βδέλυγμα എന്ന പദത്തിന്റെ ശക്തി
  choice: അറപ്പുളവാക്കുന്നതാണ്
  alternative: ദൈവത്തിന്റെ മുമ്പിൽ ഒരു അറപ്പായ കാര്യമാണ്
  rationale: ദൈവിക വിലയിരുത്തലിന്റെ ശക്തി മയപ്പെടുത്താതെ, എന്നാൽ അത്യന്തം പഴഞ്ചനായ മതപദാവലി ഒഴിവാക്കി, സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഹൃദയങ്ങൾ’, ‘നീതിമാന്മാർ’, ‘ദൈവത്തിന്റെ മുമ്പിൽ’ എന്നീ പരിചിത ബൈബിൾപ്രയോഗങ്ങൾ നിലനിർത്തി; ദുർഗ്രഹമായ പഴയ പദങ്ങൾ ഒഴിവാക്കി. ഗ്രീക്കിലെ മനുഷ്യവിലയിരുത്തലും ദൈവിക അറിവും തമ്മിലുള്ള വൈരുധ്യവും അവസാനവാക്യത്തിലെ ശക്തമായ വിധിയും വ്യക്തമായി സൂക്ഷിച്ചു.
