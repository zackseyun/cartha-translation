- from: 'അവൻ അവരോടു പറഞ്ഞു: “മനുഷ്യരുടെ മുമ്പിൽ നിങ്ങളെത്തന്നെ നീതിമാന്മാരായി അവതരിപ്പിക്കുന്നവർ നിങ്ങളാണ്[a]. എന്നാൽ ദൈവം നിങ്ങളുടെ ഹൃദയങ്ങൾ അറിയുന്നു. കാരണം, മനുഷ്യരുടെ ഇടയിൽ ഉന്നതമായി കണക്കാക്കപ്പെടുന്നത്[b] ദൈവത്തിന്റെ മുമ്പിൽ അറപ്പുളവാക്കുന്നതാണ്[c].”'
  to: 'അവൻ അവരോടു പറഞ്ഞു: “മനുഷ്യരുടെ മുമ്പിൽ സ്വയം നീതീകരിക്കുന്നവർ നിങ്ങളാണ്[a]. എന്നാൽ ദൈവം നിങ്ങളുടെ ഹൃദയങ്ങൾ അറിയുന്നു. കാരണം, മനുഷ്യരുടെ ഇടയിൽ ഉന്നതമായിരിക്കുന്നത്[b] ദൈവത്തിന്റെ മുമ്പിൽ അറപ്പുളവാക്കുന്ന ഒന്നാണ്[c].”'
  rationale: 'മുഖ്യപാഠത്തിൽ ഗ്രീക്കിന്റെ പദബന്ധവും രൂപകവും കൂടുതൽ നേരിട്ട് സംരക്ഷിച്ചു: δικαιοῦντες ἑαυτούς-ന് «സ്വയം നീതീകരിക്കുന്നവർ», τὸ ... ὑψηλόν-ന് «ഉന്നതമായിരിക്കുന്നത്». ആദ്യ കരടിലെ സ്വാഭാവികമായ വ്യാഖ്യാനപരമായ വായനകളും ‘വളരെ വിലമതിക്കപ്പെടുന്നത്’ എന്ന അർഥസാദ്ധ്യതയും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളും അവയ്ക്ക് അനുബന്ധമായ പദപ്രയോഗങ്ങളിൽ തന്നെയാണ് സ്ഥാപിച്ചിരിക്കുന്നത്.'
