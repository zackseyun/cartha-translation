id: LUK.16.8
reference: Luke 16:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: ml
  text: അനീതിക്കാരനായ കാര്യസ്ഥൻ വിവേകപൂർവം പ്രവർത്തിച്ചതുകൊണ്ട് യജമാനൻ അവനെ പ്രശംസിച്ചു.[a] എന്തെന്നാൽ, ഈ യുഗത്തിന്റെ പുത്രന്മാർ തങ്ങളുടെ തലമുറയോടുള്ള ഇടപാടുകളിൽ വെളിച്ചത്തിന്റെ പുത്രന്മാരെക്കാൾ വിവേകശാലികളാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യജമാനൻ’ എന്നതിനു പകരം ‘കർത്താവ്’ എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഇവിടെ ഗ്രീക്കിലെ κύριος ഉപമയിലെ യജമാനനെ സൂചിപ്പിക്കുന്നതാണ് കൂടുതൽ സ്വാഭാവികം.
    reason: alternative_reading
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘ഈ യുഗത്തിന്റെ പുത്രന്മാർ തങ്ങളുടെ സ്വന്തം തലമുറയോടു വെളിച്ചത്തിന്റെ പുത്രന്മാരെക്കാൾ വിവേകശാലികളാണ്.’ ഗ്രീക്ക് പ്രയോഗം ദുഷ്കരമായതിനാൽ മുഖ്യപാഠത്തിൽ അതിന്റെ ബന്ധപരമായ അർഥം വ്യക്തമാക്കിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: യജമാനൻ
  rationale: ഉപമയുടെ തൊട്ടടുത്ത സന്ദർഭത്തിൽ ഇത് കാര്യസ്ഥന്റെ യജമാനനായ ധനികനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. ‘കർത്താവ്’ എന്ന പരിഭാഷ സാധ്യമെങ്കിലും ഇവിടെ യേശുവിനെയോ ദൈവത്തെയോ നേരിട്ട് ഉദ്ദേശിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാം.
- source_word: τὸν οἰκονόμον τῆς ἀδικίας
  choice: അനീതിക്കാരനായ കാര്യസ്ഥനെ
  rationale: οἰκονόμος എന്നത് വീട്ടുടമയുടെ കാര്യങ്ങൾ നടത്തിപ്പു ചെയ്യുന്ന ആളെ സൂചിപ്പിക്കുന്നു; ‘കാര്യസ്ഥൻ’ സ്വാഭാവികമായ മലയാള പദമാണ്. τῆς ἀδικίας അയാളുടെ ധാർമിക സ്വഭാവത്തെ വിശേഷിപ്പിക്കുന്നതിനാൽ ‘അനീതിക്കാരനായ’ എന്നു നൽകി; പ്രത്യേകമായ കുറ്റകൃത്യം അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല.
- source_word: φρονίμως ἐποίησεν
  choice: വിവേകപൂർവം പ്രവർത്തിച്ചു
  rationale: ഇവിടെ ധാർമിക നന്മയേക്കാൾ ഫലം ഉറപ്പാക്കുന്ന പ്രായോഗിക സൂക്ഷ്മബുദ്ധിയാണ് പ്രശംസിക്കപ്പെടുന്നത്. ‘വിവേകപൂർവം’ എന്നത് ആ അർഥം നൽകുകയും അനീതിയെ അംഗീകരിക്കുന്നതായി വരാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: ഈ യുഗത്തിന്റെ പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ പുത്രൻ-രൂപകം നിലനിർത്തുകയും ‘വെളിച്ചത്തിന്റെ പുത്രന്മാർ’ എന്ന സമാന്തര പ്രയോഗവുമായി പൊരുത്തം കാക്കുകയും ചെയ്യുന്നു. ഇത് ഇന്നത്തെ യുഗത്താൽ രൂപപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന സെമിറ്റിക് ശൈലിയിലുള്ള വർഗനാമമാണ്.
- source_word: φρονιμώτεροι
  choice: വിവേകശാലികൾ
  rationale: φρονίμως എന്നതുമായുള്ള പദാർഥബന്ധം നിലനിർത്തുന്നു. ‘ജ്ഞാനികൾ’ എന്നു നൽകിയാൽ അനാവശ്യമായ ധാർമിക അംഗീകാരം സൂചിപ്പിക്കാം.
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: വെളിച്ചത്തിന്റെ പുത്രന്മാർ
  rationale: ദൈവത്തിന്റെ വെളിച്ചവുമായി തിരിച്ചറിയപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകവും മുൻപുള്ള ‘ഈ യുഗത്തിന്റെ പുത്രന്മാർ’ എന്ന പ്രയോഗവുമായുള്ള ഔപചാരിക സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: തങ്ങളുടെ തലമുറയോടുള്ള ഇടപാടുകളിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗം വ്യാകരണപരമായി ദുഷ്കരമാണ്. സ്വന്തം സമകാലികരുടെ മണ്ഡലത്തിൽ അല്ലെങ്കിൽ അവരോടുള്ള ബന്ധത്തിൽ അവർ പ്രകടിപ്പിക്കുന്ന പ്രായോഗിക സൂക്ഷ്മബുദ്ധി വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളമാണിത്; കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ ὁ κύριος ആരെ സൂചിപ്പിക്കുന്നു
  choice: ഉപമയ്ക്കുള്ളിലെ യജമാനൻ
  alternative: കർത്താവ്, അതായത് യേശു അല്ലെങ്കിൽ ദൈവം
  rationale: തൊട്ടടുത്ത കഥാസന്ദർഭം ധനികനായ യജമാനനെയും അവന്റെ കാര്യസ്ഥനെയും കുറിച്ചുള്ളതാണ്. അതിനാൽ ‘യജമാനൻ’ എന്നത് ഏറ്റവും സ്വാഭാവികമായ സൂചനയാണ്. ഇതുവഴി അനീതിയെ യേശു നേരിട്ട് അംഗീകരിച്ചുവെന്ന ധാരണ ഒഴിവാകുന്നു; എന്നാൽ ‘കർത്താവ്’ എന്ന വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: കാര്യസ്ഥന്റെ പ്രവൃത്തിയുടെ ധാർമിക വിലയിരുത്തൽ
  choice: അനീതിയെയല്ല, പ്രായോഗിക വിവേകത്തെയാണ് പ്രശംസിക്കുന്നത്
  alternative: അയാളുടെ അനീതിക്ക് അംഗീകാരം നൽകുന്നു, അല്ലെങ്കിൽ അയാളുടെ പ്രവൃത്തി ധാർമികമായി ജ്ഞാനപൂർവമായിരുന്നു
  rationale: കാര്യസ്ഥനെ വാക്യം ‘അനീതിക്കാരൻ’ എന്ന് വിളിക്കുമ്പോഴും അവൻ പ്രവർത്തിച്ച രീതി φρονίμως എന്ന് പറയുന്നു. ‘അനീതിക്കാരൻ’ എന്നും ‘വിവേകപൂർവം’ എന്നും ഒരുമിച്ച് നിലനിർത്തുന്നത് ഈ പാഠത്തിലെ ധാർമിക സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കാര്യസ്ഥൻ’, ‘യജമാനൻ’, ‘വിവേകപൂർവം’ എന്നീ പദങ്ങൾ സ്വാഭാവികതയും മൂലപാഠത്തിന്റെ ധാർമിക സംഘർഷവും ഒരുമിച്ച് നിലനിർത്തുന്നു. പുത്രൻ-രൂപകങ്ങൾ ഔപചാരിക സമാന്തരതയ്ക്കായി സംരക്ഷിച്ചിട്ടുണ്ട്.
