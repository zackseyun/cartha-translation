id: LUK.16.17
reference: Luke 16:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: ml
  text: എന്നാൽ ന്യായപ്രമാണത്തിൽനിന്ന് ഒരു ചെറുവരി പോലും വീണുപോകുന്നതിനേക്കാൾ ആകാശവും ഭൂമിയും ഒഴിഞ്ഞുപോകുന്നതാണ് എളുപ്പം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, അക്ഷരത്തിന്റെ ‘ഒരു കൊമ്പ്’; ഒരു അക്ഷരത്തെ മറ്റൊന്നിൽനിന്ന് വേർതിരിക്കുന്ന അതിസൂക്ഷ്മമായ വരയോ അടയാളമോ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: എളുപ്പം
  rationale: താരതമ്യാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ‘...നെക്കാൾ എളുപ്പം’ എന്ന ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: ആകാശവും ഭൂമിയും
  rationale: സൃഷ്ടലോകത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: παρελθεῖν
  choice: ഒഴിഞ്ഞുപോകുക
  rationale: വെറും അരികിലൂടെ കടന്നുപോകൽ അല്ല, ഇല്ലാതാകുകയോ കഴിഞ്ഞുപോകുകയോ ചെയ്യുന്ന ആശയം ഈ സന്ദർഭത്തിൽ അറിയിക്കുന്നു.
- source_word: νόμου
  choice: ന്യായപ്രമാണം
  rationale: പൊതുവായ നിയമമല്ല, തിരുവെഴുത്തിലെ ദൈവിക ന്യായപ്രമാണമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നതെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μίαν κεραίαν
  choice: ഒരു അക്ഷരത്തിന്റെ ചെറുവരപോലും
  rationale: അക്ഷരങ്ങളെ വേർതിരിക്കുന്ന അതിസൂക്ഷ്മമായ വരയെയോ കൊമ്പുപോലുള്ള അടയാളത്തെയോ ആധുനിക വായനക്കാരന് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: πεσεῖν
  choice: വീണുപോകുക
  rationale: മൂലത്തിലെ ‘വീഴുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും ഏറ്റവും ചെറിയ ഭാഗംപോലും നഷ്ടപ്പെടുകയോ അസാധുവാകുകയോ ചെയ്യില്ലെന്ന ആശയം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: νόμος എന്നതിന്റെ സൂചന
  choice: തിരുവെഴുത്തിലെ ന്യായപ്രമാണം
  alternative: പൊതുവായ നിയമം
  rationale: ലൂക്കോസിലെ സമീപസന്ദർഭവും ആകാശഭൂമിയോടുള്ള താരതമ്യവും ദൈവം വെളിപ്പെടുത്തിയ ന്യായപ്രമാണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനപ്പുറമുള്ള വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- issue: κεραία എന്നതിന്റെ അവതരണം
  choice: ഒരു അക്ഷരത്തിന്റെ ചെറുവര
  alternative: ഒരു കൊമ്പ്; ഒരു പുള്ളി; ടിറ്റിൽ
  rationale: ന്യായപ്രമാണത്തിലെ ഏറ്റവും ചെറിയ ലിഖിതവിശദാംശത്തെയും ഊന്നിപ്പറയുന്ന മൂലാർഥം പഴഞ്ചൻ സാങ്കേതികപദം ഉപയോഗിക്കാതെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ന്യായപ്രമാണം’ എന്ന പരിചിത ബൈബിൾപദവും ‘ചെറുവര’ എന്ന വ്യക്തമായ വിശദീകരണപദവും ചേർത്ത് കൃത്യതയും വായനാസൗകര്യവും സന്തുലിതമാക്കി.
