- from: എന്നാൽ ആകാശവും ഭൂമിയും ഒഴിഞ്ഞുപോകുന്നതാണ് ന്യായപ്രമാണത്തിലെ ഒരു അക്ഷരത്തിന്റെ ചെറുവരപോലും വീണുപോകുന്നതിനെക്കാൾ എളുപ്പം.[a]
  to: എന്നാൽ ന്യായപ്രമാണത്തിൽനിന്ന് ഒരു ചെറുവരി പോലും വീണുപോകുന്നതിനേക്കാൾ ആകാശവും ഭൂമിയും ഒഴിഞ്ഞുപോകുന്നതാണ് എളുപ്പം.[a]
