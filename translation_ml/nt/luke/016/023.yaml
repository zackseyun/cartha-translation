source:
  edition: SBLGNT
  text: καὶ ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις, ⸀ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: ml
  text: അവൻ ഹേഡീസിൽ[a], യാതനകളിൽ ആയിരിക്കെ, കണ്ണുകൾ ഉയർത്തി ദൂരെ അബ്രാഹാമിനെയും അബ്രാഹാമിന്റെ മടിയിലുള്ള ലാസറിനെയും കാണുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ഹേഡീസ്’; മരിച്ചവരുടെ ലോകം. അന്തിമ ന്യായവിധിയുമായി ബന്ധപ്പെട്ട ‘ഗെഹെന്ന’ എന്ന പദത്തിൽനിന്ന് ഇത് വ്യത്യസ്തമാണ്. ‘നരകം’ എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അബ്രാഹാമിന്റെ മാറിടത്തിൽ/മടിയിൽ’; പരമ്പരാഗതമായി, ‘അബ്രാഹാമിന്റെ മടിയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: പാതാളത്തിൽ
  rationale: മരിച്ചവരുടെ ലോകം എന്ന അർഥത്തിലുള്ള ᾅδης എന്ന ഗ്രീക്ക് പദത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഇതിനെ ഗെഹെന്നയുമായോ അന്തിമ ന്യായവിധിയുടെ സ്ഥലവുമായോ ഒറ്റപ്പെടുത്താതിരിക്കാൻ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: കണ്ണുകളുയർത്തി
  rationale: കണ്ണുകൾ ഉയർത്തുക എന്ന ഗ്രീക്ക് ദൃശ്യബിംബം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: യാതനകളിൽ കഴിയവേ
  rationale: സാഹചര്യസൂചക കൃദന്തരൂപവും βασάνοις എന്ന ബഹുവചനരൂപവും നിലനിർത്തിക്കൊണ്ട് കടുത്ത ദുരിതാവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: ὁρᾷ
  choice: കാണുന്നു
  rationale: ആഖ്യാനത്തിലെ സജീവത നൽകുന്ന ഗ്രീക്ക് വർത്തമാനകാലം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: ἀπὸ μακρόθεν
  choice: ദൂരെ
  rationale: കഥയിൽ ഊന്നിപ്പറയുന്ന സ്ഥലപരമായ അകലം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: അദ്ദേഹത്തിന്റെ മടിയിൽ
  rationale: κόλπος സൂചിപ്പിക്കുന്ന മാറിടം/മടി എന്ന ദൃശ്യവും അടുത്ത സാന്നിധ്യവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; സർവനാമത്തിന്റെ പൂർവപദം അബ്രാഹാമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഇടക്കാല മരിച്ചവരുടെ ലോകത്തെയും അന്തിമ ശിക്ഷയെയും കുറിച്ചുള്ള ചർച്ചകളിൽ ᾅδης എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാതാളം
  alternative: ഹേഡീസ്; നരകം; മരിച്ചവരുടെ ലോകം
  rationale: ഗ്രീക്ക് ᾅδης-നെയും γέεννα-യെയും ഒന്നാക്കാതെ പദവ്യത്യാസം സംരക്ഷിക്കുന്നു; അതേസമയം സാധാരണ മലയാളവായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദം ഉപയോഗിക്കുന്നു.
- issue: ‘അബ്രാഹാമിന്റെ മടി/മാർവ്’ എന്ന പരമ്പരാഗത ദൃശ്യത്തിന്റെ അവതരണം
  choice: അദ്ദേഹത്തിന്റെ മടിയിൽ
  alternative: അബ്രാഹാമിന്റെ മടിയിൽ; അദ്ദേഹത്തിന്റെ മാർവിൽ; അദ്ദേഹത്തിന്റെ അരികിൽ
  rationale: മൂലത്തിലെ αὐτοῦ എന്ന സർവനാമവും κόλπος എന്ന സാന്നിധ്യദൃശ്യവും സംരക്ഷിക്കുന്നു; ‘അരികിൽ’ എന്നത് ദൃശ്യത്തെ അമിതമായി പൊതുവാക്കുന്നതിനാൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ സജീവ വർത്തമാനകാലമായ ‘കാണുന്നു’ നിലനിർത്തി. പദശഃ കൃത്രിമത ഒഴിവാക്കിയെങ്കിലും പാതാളം, യാതനകൾ, മടി എന്നീ പ്രധാന ദൃശ്യങ്ങളും ദൈവശാസ്ത്രപരമായ വ്യത്യാസങ്ങളും സംരക്ഷിച്ചു.
