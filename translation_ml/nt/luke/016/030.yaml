id: LUK.16.30
reference: Luke 16:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു: “അല്ല, പിതാവായ അബ്രാഹാമേ; പക്ഷേ, മരിച്ചവരുടെ ഇടയിൽനിന്ന് ആരെങ്കിലും അവരുടെ അടുക്കൽ ചെന്നാൽ അവർ മാനസാന്തരപ്പെടും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐχί
  choice: അല്ല
  rationale: മുൻ പ്രസ്താവനയെ ശക്തമായി നിഷേധിക്കുന്ന സ്വാഭാവികമായ നേരിട്ടുള്ള മറുപടി.
- source_word: πάτερ Ἀβραάμ
  choice: പിതാവായ അബ്രാഹാമേ
  rationale: അബ്രാഹാമിനെ പൂർവപിതാവായി അഭിസംബോധന ചെയ്യുന്ന വൊക്കേറ്റീവ് ഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀλλ’ ἐάν
  choice: … ആരെങ്കിലും … ചെന്നാൽ
  rationale: നിഷേധത്തിനു പിന്നാലെയുള്ള വിരുദ്ധ നിബന്ധന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ‘എന്നാൽ’ എന്ന ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: τις
  choice: ആരെങ്കിലും
  rationale: അനിശ്ചിത ഏകവചനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ νεκρῶν
  choice: മരിച്ചവരുടെ ഇടയിൽനിന്ന്
  rationale: ἀπό സഹിതമുള്ള ബഹുവചനത്തിന്റെ ‘മരിച്ചവരുടെ കൂട്ടത്തിൽനിന്ന്’ എന്ന ആശയം തെളിമയോടെ നിലനിർത്തുന്നു.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: അവരുടെ അടുക്കൽ ചെന്നാൽ
  rationale: അവരിലേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്ന πορεύομαι, πρός എന്നിവയുടെ ദിശാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μετανοήσουσιν
  choice: അവർ മാനസാന്തരപ്പെടും
  rationale: ലൂക്കോസിലെ നൈതിക-ആത്മീയ തിരിഞ്ഞുവരവിന്റെ അർഥം വെറും അഭിപ്രായമാറ്റമായി ചുരുക്കാതെ നൽകുന്ന സാധാരണ ബൈബിൾ-മലയാള പ്രയോഗം.
theological_decisions:
- issue: μετανοήσουσιν എന്ന മാനസാന്തരഭാഷയുടെ അർഥം
  choice: മാനസാന്തരപ്പെടും
  alternative: മനസ്സ് മാറ്റും / തിരിഞ്ഞുവരും
  rationale: സന്ദർഭത്തിൽ ദൈവിക മുന്നറിയിപ്പിനോടുള്ള നൈതികവും ആത്മീയവുമായ പ്രതികരണമാണ് ഉദ്ദേശിക്കുന്നത്. ‘മാനസാന്തരപ്പെടും’ ആ പൂർണ ഭാവം നിലനിർത്തുന്നു; വെറും ബൗദ്ധിക പുനർവിചാരമായി ചുരുക്കുന്നില്ല.
- issue: ἀπὸ νεκρῶν എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: മരിച്ചവരുടെ ഇടയിൽനിന്ന്
  alternative: മരിച്ചവരിൽനിന്ന്
  rationale: ഒരാൾ മരിച്ചവരുടെ കൂട്ടത്തിൽനിന്ന് അവരുടെ അടുക്കൽ പോകുന്നു എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഭാവം കൂടുതൽ സുതാര്യമാക്കുന്നു; പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള അധിക വിശദീകരണം വാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ വാദാത്മക ശക്തി നിലനിർത്തിയിരിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
