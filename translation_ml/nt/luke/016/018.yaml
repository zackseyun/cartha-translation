reference: Luke 16:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: ml
  text: സ്വന്തം ഭാര്യയെ വിവാഹമോചനം ചെയ്ത് മറ്റൊരുവളെ വിവാഹം കഴിക്കുന്ന ഏവനും വ്യഭിചാരം ചെയ്യുന്നു; ഭർത്താവിൽനിന്ന് വിവാഹമോചിതയായ സ്ത്രീയെ[a] വിവാഹം കഴിക്കുന്നവനും വ്യഭിചാരം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഒരു ഭർത്താവിൽനിന്ന് വിവാഹമോചിതയായവളെ.’'
    reason: ἀπολελυμένην ἀπὸ ἀνδρός എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കർമണിരൂപവും ‘നിന്ന്’ എന്ന ബന്ധവും കാണിക്കുന്നതിനായി.
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: ഏവനും
  rationale: ആർട്ടിക്കിളോടുകൂടിയ πᾶς പൊതുവായതും സാർവത്രികവുമായ പ്രസ്താവന അവതരിപ്പിക്കുന്നു; ‘ഏവനും’ അതിന്റെ വ്യാപ്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀπολύων
  choice: വിവാഹമോചനം ചെയ്ത്
  rationale: വിവാഹസന്ദർഭത്തിൽ ἀπολύω എന്നത് വെറുതെ ‘പറഞ്ഞയയ്ക്കുക’ എന്നതിലുപരി വിവാഹബന്ധം വേർപെടുത്തുക എന്ന അർഥത്തിലാണ്.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: സ്വന്തം ഭാര്യയെ
  rationale: വിവാഹവും വിവാഹമോചനവും സംബന്ധിച്ച സന്ദർഭത്തിൽ γυνή എന്നത് ‘സ്ത്രീ’ എന്ന പൊതുവർഥത്തിലല്ല, ‘ഭാര്യ’ എന്ന അർഥത്തിലാണ്.
- source_word: γαμῶν ἑτέραν
  choice: മറ്റൊരുവളെ വിവാഹം കഴിക്കുന്ന
  rationale: ἑτέραν സ്ത്രീലിംഗത്തിലുള്ള ‘മറ്റൊരുവൾ’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ഈ രൂപം ഉദ്ദേശിക്കുന്ന സ്ത്രീയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μοιχεύει
  choice: വ്യഭിചാരം ചെയ്യുന്നു
  rationale: വിവാഹവിശ്വാസലംഘനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും നിലവാരമുള്ളതുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: ἀπολελυμένην ἀπὸ ἀνδρός
  choice: ഭർത്താവിൽനിന്ന് വിവാഹമോചിതയായ സ്ത്രീയെ
  rationale: പൂർണകാല കർമണിപ്രയോഗം വിവാഹമോചനം സംഭവിച്ച നിലയെ സൂചിപ്പിക്കുന്നു; ἀπό എന്നതിന്റെ ‘നിന്ന്’ എന്ന ബന്ധവും ἀνήρ എന്നതിന്റെ സന്ദർഭോചിതമായ ‘ഭർത്താവ്’ എന്ന അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വിവാഹമോചനവചനത്തിന്റെ വ്യാപ്തിയും ശക്തിയും
  choice: ലൂക്കോസിലെ വാചകം നൽകുന്നതുപോലെ, ഒഴിവുവ്യവസ്ഥ ചേർക്കാതെ പൊതുവായ ധാർമികപ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തി.
  alternative: മത്തായിയിലെ ഒഴിവുവ്യവസ്ഥ ഇവിടെ പരോക്ഷമായി ഉൾപ്പെട്ടതായി കണക്കാക്കി പരിഭാഷയിൽ ചേർക്കുക.
  rationale: ഈ ഗ്രീക്ക് വാചകത്തിൽ ഒരു ഒഴിവുവ്യവസ്ഥയും ഇല്ല. മറ്റു ഭാഗങ്ങളുമായുള്ള വ്യാഖ്യാനപരമായ സമന്വയം പരിഭാഷയിൽ ചേർക്കാതെ, ലൂക്കോസിന്റെ സംക്ഷിപ്തവും ശക്തവുമായ രൂപവും അതിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരമായ അർഥം വ്യക്തമാക്കാൻ ‘വിവാഹമോചനം’ ഉപയോഗിച്ചു; ഗ്രീക്കിൽ ഇല്ലാത്ത ഒഴിവുകളോ വിശദീകരണങ്ങളോ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
