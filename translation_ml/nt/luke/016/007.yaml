source:
  edition: SBLGNT
  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: ml
  text: 'പിന്നെ അവൻ മറ്റൊരാളോടു പറഞ്ഞു: “നീയോ, എത്ര കടപ്പെട്ടിരിക്കുന്നു?” അയാൾ പറഞ്ഞു: “നൂറു കോർ[b] ഗോതമ്പ്.” അവൻ അയാളോടു പറയുന്നു: “നിന്റെ കടപ്പത്രം[a] എടുത്ത് ‘എൺപത്’ എന്ന് എഴുതുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ എഴുതിയ കരാർ” അല്ലെങ്കിൽ “നിന്റെ രേഖകൾ”; ഗ്രീക്കിൽ “നിന്റെ എഴുത്തുകൾ” (τὰ γράμματα). ഇവിടെ കടക്കാരന്റെ കടപ്പത്രത്തെയോ കണക്കുരേഖയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: കോർ ധാന്യത്തിനുപയോഗിച്ചിരുന്ന ഒരു വലിയ പുരാതന അളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἔπειτα
  choice: പിന്നെ
  rationale: അടുത്ത കടക്കാരനിലേക്കുള്ള ആഖ്യാനക്രമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἑτέρῳ
  choice: മറ്റൊരാളോട്
  rationale: മുമ്പ് പറഞ്ഞ കടക്കാരനിൽനിന്നു വ്യത്യസ്തനായ മറ്റൊരാളെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ലിംഗസൂചന ചേർക്കുന്നില്ല.
- source_word: Σὺ δὲ
  choice: നീയോ
  rationale: ഊന്നിപ്പറഞ്ഞിരിക്കുന്ന Σὺ എന്ന സർവനാമവും ലഘുവായ മാറ്റം/വ്യത്യാസം സൂചിപ്പിക്കുന്ന δέയും മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും പകരുന്നു.
- source_word: πόσον ὀφείλεις
  choice: എത്ര കടപ്പെട്ടിരിക്കുന്നു
  rationale: സാമ്പത്തിക ബാധ്യതയാണ് സന്ദർഭം; ചോദ്യം വ്യക്തവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: Ἑκατὸν κόρους σίτου
  choice: നൂറു കോർ ഗോതമ്പ്
  rationale: κόρος എന്ന നിർദിഷ്ട പുരാതന ധാന്യയളവ് പൊതുവായ ‘അളവ്’ എന്നു മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; σῖτος ഇവിടെ ഗോതമ്പാണ്.
- source_word: λέγει αὐτῷ
  choice: അവൻ അയാളോടു പറയുന്നു
  rationale: ഗ്രീക്കിലെ ആഖ്യാന വർത്തമാനകാലം നിലനിർത്തി രംഗത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: Δέξαι
  choice: എടുത്ത്
  rationale: രേഖ കൈവശമെടുക്കാനുള്ള ആജ്ഞയെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σου τὰ γράμματα
  choice: നിന്റെ കടപ്പത്രം
  rationale: അക്ഷരാർഥത്തിൽ ബഹുവചനമായ ‘നിന്റെ എഴുത്തുകൾ/രേഖകൾ’ ഇവിടെ കടബാധ്യത രേഖപ്പെടുത്തിയ പ്രമാണത്തെ സൂചിപ്പിക്കുന്നു; ‘കടപ്പത്രം’ അതിന്റെ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: γράψον ὀγδοήκοντα
  choice: ‘എൺപത്’ എന്ന് എഴുതുക
  rationale: രേഖയിലെ തുക എൺപതായി എഴുതിമാറ്റാനുള്ള നിർദേശം മൂലത്തോട് അടുത്തും മലയാളത്തിൽ വ്യക്തമായും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ ആഖ്യാന വർത്തമാനകാലമായ λέγει ‘പറയുന്നു’ എന്നു നിലനിർത്തി. പുരാതന അളവായ κόρος ‘കോർ’ എന്നു ലിപ്യന്തരിച്ചു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
