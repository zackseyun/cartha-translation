  text: ലാസർ എന്നു പേരുള്ള, വ്രണങ്ങളാൽ നിറഞ്ഞ ഒരു ദരിദ്രൻ[b] അയാളുടെ കവാടത്തിങ്കൽ കിടത്തപ്പെട്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അയാളുടെ കവാടത്തിങ്കൽ എറിഞ്ഞിട്ടിരുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘എറിയുക’ എന്ന ശക്തമായ അർഥവും ഉണ്ടാകാം; അത് ലാസറിന്റെ നിസ്സഹായതയും അവനോടുള്ള അവഗണനയും ഊന്നിക്കാട്ടിയേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വ്രണങ്ങൾകൊണ്ട് മൂടപ്പെട്ടവൻ.” ഗ്രീക്ക് കൃദ്‌ന്തരൂപം ലാസർ വ്രണങ്ങളാൽ ബാധിക്കപ്പെട്ടിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχὸς
  choice: ദരിദ്രൻ
  rationale: സാമൂഹികപങ്കായി ‘ഭിക്ഷക്കാരൻ’ എന്നു കൂടുതൽ നിർദിഷ്ടമാക്കാതെ, ദാരിദ്ര്യാവസ്ഥയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ പദം.
- source_word: τις
  choice: ഒരു
  rationale: പുതിയ കഥാപാത്രത്തെ അനിശ്ചിതമായി പരിചയപ്പെടുത്തുന്ന τις എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ὀνόματι Λάζαρος
  choice: ലാസർ എന്നു പേരുള്ള
  rationale: ദത്തിവ് ഘടനയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും പേര് ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: ἐβέβλητο
  choice: കിടത്തിയിരുന്നു
  rationale: βάλλω എന്ന ക്രിയയുടെ ഭൂതപൂർവകാല കർമണിപ്രയോഗം സംരക്ഷിച്ച്, മറ്റുള്ളവർ അവനെ അവിടെ കൊണ്ടുവന്നു കിടത്തിയെന്ന നിസ്സഹായാവസ്ഥ വ്യക്തമാക്കുന്നു; ക്രിയയ്ക്കുള്ള കടുത്ത ‘എറിഞ്ഞിട്ടിരുന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: അയാളുടെ പടിവാതിൽക്കൽ
  rationale: πυλών വലിയ വീടിന്റെ കവാടമോ പ്രവേശനവാതിലോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ധനികനെയാണ് αὐτοῦ സൂചിപ്പിക്കുന്നത്. ‘പടിവാതിൽക്കൽ’ സ്ഥാനം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἱλκωμένος
  choice: വ്രണങ്ങൾ നിറഞ്ഞവനായി
  rationale: ἑλκόομαι മൂലമുള്ള കൃുദന്തരൂപം വ്രണബാധിതമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ദൃശ്യമായ കഠിനാവസ്ഥ വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
