id: LUK.16.16
reference: Luke 16:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: ml
  text: ന്യായപ്രമാണവും പ്രവാചകന്മാരും യോഹന്നാൻവരെ ആയിരുന്നു; അന്നുമുതൽ ദൈവരാജ്യം സുവാർത്തയായി അറിയിക്കപ്പെടുന്നു, എല്ലാവരും അതിലേക്കു ബലമായി കടക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാവരും അതിലേക്കു തിക്കിക്കയറുന്നു.” ഗ്രീക്ക് ക്രിയ ശക്തമായതോ തീവ്രമായതോ ആയ മുന്നേറ്റത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: മത്തായി 11:12-ലെ സമാനവചനത്തിന്റെ വെളിച്ചത്തിൽ അവസാന ഉപവാക്യത്തെ ചിലർ കൂടുതൽ നിഷേധാത്മകമായി മനസ്സിലാക്കുന്നു. എന്നാൽ ഇവിടെ ഗ്രീക്കിൽ ക്രിയയുടെ കർത്താവ് “എല്ലാവരും” എന്നതാണ്, “ദൈവരാജ്യം” എന്നല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος καὶ οἱ προφῆται
  choice: ന്യായപ്രമാണവും പ്രവാചകന്മാരും
  rationale: യഹൂദതിരുവെഴുത്തിലെ അംഗീകൃത വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: μέχρι Ἰωάννου
  choice: യോഹന്നാൻവരെ
  rationale: രക്ഷാചരിത്രത്തിലെ കാലപരിധി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യോഹന്നാൻ സ്നാപകനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπὸ τότε
  choice: അന്നുമുതൽ
  rationale: കാലഘട്ടത്തിലെ മാറ്റവും തുടർന്നുനിൽക്കുന്ന അവസ്ഥയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: βασιλείαയുടെ രാജ്യം/വാഴ്ച എന്നീ അർത്ഥവ്യാപ്തികൾ അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്ന സുപരിചിത പ്രയോഗം.
- source_word: εὐαγγελίζεται
  choice: സുവിശേഷമായി പ്രസംഗിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണി രൂപവും ‘നല്ല വാർത്ത അറിയിക്കുക’ എന്ന ക്രിയയുടെ സുവിശേഷാർഥവും പ്രകടമാക്കുന്നു.
- source_word: πᾶς
  choice: എല്ലാവരും
  rationale: ഗ്രീക്കിലെ വിതരണാത്മക ഏകവചനത്തിന്റെ പൊതുവ്യാപ്തി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς αὐτὴν βιάζεται
  choice: അതിലേക്കു ബലമായി കടക്കുന്നു
  rationale: രാജ്യത്തിലേക്കുള്ള ദിശയും βιάζεται സൂചിപ്പിക്കുന്ന ശക്തമായ, തീവ്രമായ മുന്നേറ്റവും നിലനിർത്തുന്നു; മലയാളത്തിൽ ലിംഗസൂചന ആവശ്യമില്ല.
theological_decisions:
- issue: βιάζεται എന്നതിന്റെ അർത്ഥവും ദൈവരാജ്യത്തോടുള്ള ബന്ധവും
  choice: ആളുകൾ ദൈവരാജ്യത്തിലേക്കു തീവ്രമായും ബലമായും കടക്കുന്നതായി വാക്യം പറയുന്നു.
  alternative: ദൈവരാജ്യം അക്രമം സഹിക്കുന്നു, അക്രമികൾ അതിനെ പിടിച്ചടക്കുന്നു.
  rationale: ഈ വാക്യത്തിൽ βιάζεται എന്ന ക്രിയയുടെ കർത്താവ് πᾶς (‘എല്ലാവരും’) ആണ്; εἰς αὐτήν രാജ്യമിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. എങ്കിലും ക്രിയയുടെ ബലപ്രയോഗസംബന്ധിയായ അർത്ഥസങ്കീർണത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയും സംയോജിപ്പിച്ചു. തിരുവെഴുത്തുവിഭാഗങ്ങളുടെ പേരുകൾക്ക് സുപരിചിതമായ ‘ന്യായപ്രമാണം’, ‘പ്രവാചകന്മാർ’ എന്നീ പദങ്ങളും ദൈവശാസ്ത്രപരമായി വിശാലമായ ‘ദൈവരാജ്യം’ എന്ന പ്രയോഗവും നിലനിർത്തി.
