reference: Luke 16:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: ml
  text: 'അവൻ ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “പിതാവായ അബ്രാഹാമേ, എന്നോടു കരുണ കാണണമേ; ലാസറിനെ അയയ്ക്കണമേ. അവൻ തന്റെ വിരലിന്റെ അറ്റം വെള്ളത്തിൽ മുക്കി എന്റെ നാവ് തണുപ്പിക്കട്ടെ; കാരണം ഈ ജ്വാലയിൽ ഞാൻ കഠിനവേദന അനുഭവിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഈ ജ്വാലയിൽ ഞാൻ പീഡനമനുഭവിക്കുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് കടുത്ത വേദനയെയോ പീഡനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: അടിയന്തരവും ഉച്ചത്തിലുള്ളതുമായ അഭ്യർഥനയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; φωνέω എന്ന ക്രിയയുടെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: Πάτερ Ἀβραάμ
  choice: പിതാവായ അബ്രാഹാമേ
  rationale: പൂർവപിതാവിനോടുള്ള നേരിട്ടുള്ള സംബോധനയും കുടുംബപരമായ അഭ്യർഥനാഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐλέησόν με
  choice: എന്നോടു കരുണ കാണിച്ച്
  rationale: കരുണയോ ദയയോ കാണിക്കണമെന്ന നേരിട്ടുള്ള അപേക്ഷ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πέμψον
  choice: അയയ്ക്കണമേ
  rationale: ആജ്ഞാരൂപത്തിലുള്ള അപേക്ഷയുടെ ലളിതവും മാന്യവുമായ മലയാളരൂപം.
- source_word: βάψῃ
  choice: മുക്കി
  rationale: വിരലിന്റെ അറ്റം വെള്ളത്തിൽ ഹ്രസ്വമായി മുക്കുന്ന ദൃശ്യത്തെ കൃത്യമായി നൽകുന്നു.
- source_word: τὸ ἄκρον τοῦ δακτύλου αὐτοῦ
  choice: തന്റെ വിരലിന്റെ അറ്റം
  rationale: ഗ്രീക്കിലെ ശരീരഭാഗസൂചനയും ‘അറ്റം’ എന്ന ആശയവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: καταψύξῃ
  choice: തണുപ്പിക്കട്ടെ
  rationale: തണുപ്പിക്കുക എന്ന മൂർത്തമായ ശാരീരിക ദൃശ്യം ‘ആശ്വസിപ്പിക്കുക’ എന്നതിനെക്കാൾ കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: γλῶσσάν μου
  choice: എന്റെ നാവ്
  rationale: ശരീരഭാഗത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: ὀδυνῶμαι
  choice: ഞാൻ കഠിനവേദന അനുഭവിക്കുന്നു
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന കടുത്ത വേദനയുടെ തീവ്രത പ്രകടിപ്പിക്കുമ്പോഴും പുറത്തുനിന്നുള്ള പീഡനം എന്ന വ്യാഖ്യാനം നിർബന്ധമാക്കുന്നില്ല.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: ഈ ജ്വാലയിൽ
  rationale: φλόξ എന്ന പദത്തിന്റെ പ്രത്യേകമായ ‘ജ്വാല’ എന്ന ദൃശ്യവും ഏകവചനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ധനികന്റെ മരണാനന്തര കഠിനവേദനയുടെ വിവർത്തനം
  choice: ഈ ജ്വാലയിൽ ഞാൻ കഠിനവേദന അനുഭവിക്കുന്നു
  alternative: ഈ ജ്വാലയിൽ ഞാൻ പീഡനമനുഭവിക്കുന്നു
  rationale: ὀδυνῶμαι കടുത്ത വേദനയെയോ ദുരിതത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കഠിനവേദന അനുഭവിക്കുന്നു’ തീവ്രത നിലനിർത്തുന്നു; എന്നാൽ വേദനയ്ക്ക് പുറത്തുനിന്നുള്ള ഒരു പീഡകൻ ഉണ്ടെന്ന ധാരണ അനാവശ്യമായി ചേർക്കുന്നില്ല. മറ്റൊരു സാധുവായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പ്രാർഥനാഭാവമുള്ള അപേക്ഷയ്ക്ക് ‘-ണമേ’ രൂപം ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ഉച്ചത്തിലുള്ള വിളി, ശാരീരിക ദൃശ്യം, വേദനയുടെ തീവ്രത എന്നിവ നിലനിർത്തി; വിഭാഗീയമായ മരണാനന്തരജീവിത പദാവലി ചേർത്തിട്ടില്ല.
