  source_fidelity: 'The draft accurately conveys the urgent cry, the address to Abraham, Lazarus’s fingertip being dipped in water, the cooling of the speaker’s tongue, and severe suffering in the flame. However, the Malayalam participial construction “എന്നോടു കരുണ കാണിച്ച് ലാസറിനെ അയയ്ക്കണമേ” can make sending Lazarus sound like the means by which mercy is shown, whereas the Greek has two coordinate imperatives: “have mercy on me” and “send Lazarus.”'
