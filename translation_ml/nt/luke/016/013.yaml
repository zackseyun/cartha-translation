id: LUK.16.13
reference: Luke 16:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: ml
  text: ഒരു വീട്ടുദാസനും രണ്ടു യജമാനന്മാരെ സേവിക്കാൻ കഴിയില്ല. കാരണം, അവൻ ഒരാളെ വെറുക്കുകയും മറ്റേയാളെ സ്നേഹിക്കുകയും ചെയ്യും; അല്ലെങ്കിൽ ഒരാളോടു പറ്റിനിൽക്കുകയും മറ്റേയാളെ അവജ്ഞയോടെ കാണുകയും ചെയ്യും. ദൈവത്തെയും മാമോനെയും[a] സേവിക്കാൻ നിങ്ങൾക്കു കഴിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സമ്പത്ത്’ അല്ലെങ്കിൽ ‘പണം.’ ഗ്രീക്കിൽ ‘മാമോൻ’ എന്ന പദമാണ്; ഇവിടെ സമ്പത്തിനെ എതിരാളിയായ ഒരു യജമാനനെപ്പോലെ അവതരിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: വീട്ടുദാസൻ
  rationale: വീട്ടിലെ സേവകസ്ഥാനത്തുള്ള ആളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘വീട്ടുദാസൻ’ ഗൃഹസന്ദർഭവും യജമാനൻ–ദാസൻ ബന്ധവും ചുരുക്കമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: κυρίοις
  choice: യജമാനന്മാർ
  rationale: ഇവിടെ മനുഷ്യരായ ഉടമകളെയോ അധികാരികളെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘കർത്താക്കന്മാർ’ എന്നതിനെക്കാൾ സാമൂഹികസന്ദർഭത്തിന് യോജിക്കുന്നത് ‘യജമാനന്മാർ’ ആണ്.
- source_word: δουλεύειν
  choice: സേവിക്കാൻ
  rationale: ദാസനായി സേവിക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; യജമാനന്മാർ എന്ന പദം വിധേയത്വത്തിന്റെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: μισήσει
  choice: വെറുക്കുകയും
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള ശക്തമായ അർഥമായ ‘വെറുക്കുക’ നിലനിർത്തുന്നു; മുൻഗണനയെന്നാക്കി മയപ്പെടുത്തുന്നില്ല.
- source_word: ἀγαπήσει
  choice: സ്നേഹിക്കുകയും
  rationale: ‘വെറുക്കുക’ എന്നതിനോടുള്ള ഉദ്ദേശ്യപൂർവമായ വിപരീതത നിലനിർത്തുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: ἀνθέξεται
  choice: പറ്റിനിൽക്കുകയും
  rationale: ഒരാളെ മുറുകെ പിടിക്കുക, അയാളോടു ചേർന്നുനിൽക്കുക, വിശ്വസ്തത പുലർത്തുക എന്നീ ഭാവങ്ങൾ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καταφρονήσει
  choice: അവജ്ഞയോടെ കാണുകയും
  rationale: നിസ്സാരമായി കരുതുകയും ആദരിക്കാതിരിക്കുകയും ചെയ്യുന്ന അവഹേളനഭാവം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: θεῷ
  choice: ദൈവം
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന ദാതൃവിഭക്തി; വാക്യത്തിൽ ‘ദൈവത്തെയും’ എന്ന് സ്വാഭാവികമായി രൂപാന്തരപ്പെടുത്തി.
- source_word: μαμωνᾷ
  choice: മാമോൻ
  rationale: സമ്പത്തിനെ ഒരു എതിരാളിയായ യജമാനനെപ്പോലെ അവതരിപ്പിക്കുന്ന സെമിറ്റിക് വായ്പാപദത്തിന്റെ വ്യക്തിവൽക്കരണശക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: θεῷ എന്നതിനോടു വിരുദ്ധമായി μαμωνᾷ എന്നതിന്റെ വിവർത്തനം
  choice: മാമോൻ
  alternative: സമ്പത്ത് / പണം
  rationale: ദൈവവും സമ്പത്തും എതിരാളികളായ യജമാനന്മാരായി നിൽക്കുന്ന വാക്യത്തിന്റെ വ്യക്തിവൽക്കരണം ‘മാമോൻ’ നിലനിർത്തുന്നു. ഇത് മാമോൻ അക്ഷരാർഥത്തിൽ ഒരു ദേവനാണെന്ന് സൂചിപ്പിക്കുന്നില്ല; സമ്പത്ത് മനുഷ്യന്റെ വിശ്വസ്തത ആവശ്യപ്പെടുന്ന അധികാരമായി അവതരിപ്പിക്കപ്പെടുന്നു.
- issue: ഏകവചനത്തിലുള്ള പ്രതിനിധി ദാസന്റെ പരാമർശം
  choice: അവൻ ഒരാളെ…
  alternative: ആ ദാസൻ ഒരാളെ… / അവർ ഒരാളെ…
  rationale: ഗ്രീക്കിലെ പൊതുവായ പ്രസ്താവന ഏകവചനത്തിലാണ്. മലയാളത്തിലും അതിന്റെ പ്രതിനിധി ഏകവചനം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘വീട്ടുദാസൻ,’ ‘യജമാനന്മാർ’ എന്നീ പദങ്ങൾ ഗൃഹസേവനത്തിന്റെയും വിധേയത്വത്തിന്റെയും പശ്ചാത്തലം നിലനിർത്തുന്നു; ‘മാമോൻ’ എന്ന അപരിചിതപദം അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
