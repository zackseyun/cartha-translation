  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: ml
  text: ധനികനായ ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു. അവൻ ധൂമ്രനിറമുള്ള വസ്ത്രവും നേർത്ത ലിനൻവസ്ത്രവും ധരിച്ച് എല്ലാ ദിവസവും ആഡംബരത്തോടെ ആഹ്ലാദിച്ചുപോന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാ ദിവസവും ആഡംബരമായി വിരുന്നുകഴിച്ചുപോന്നു.” εὐφραινόμενος എന്ന പദത്തിന് ആഹ്ലാദിക്കുക, ആഘോഷിക്കുക, അല്ലെങ്കിൽ വിരുന്നുകഴിക്കുക എന്നർഥം വരാം; λαμπρῶς ആഡംബരപൂർണമായ പ്രൗഢിക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις
  choice: ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു
  rationale: τις സൂചിപ്പിക്കുന്ന അനിശ്ചിത വ്യക്തിയെ സ്വാഭാവികമായ മലയാള കഥനശൈലിയിൽ അവതരിപ്പിക്കുന്നു; δέയുടെ ലഘുവായ കഥനമാറ്റം സന്ദർഭത്തിൽ നിന്നു വ്യക്തമാകുന്നതിനാൽ പ്രത്യേക ബന്ധകപദം ചേർത്തിട്ടില്ല.
