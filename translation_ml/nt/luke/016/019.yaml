revisions:
- from: ധനികനായ ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു. അയാൾ ധൂമ്രവസ്ത്രവും നേർത്ത ചണവസ്ത്രവും ധരിച്ച് എല്ലാ ദിവസവും ആഡംബരത്തോടെ സുഖിച്ചുപോന്നു.[a]
  to: ധനികനായ ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു. അവൻ ധൂമ്രനിറമുള്ള വസ്ത്രവും നേർത്ത ലിനൻവസ്ത്രവും ധരിച്ച് എല്ലാ ദിവസവും ആഡംബരത്തോടെ ആഹ്ലാദിച്ചുപോന്നു.[a]
