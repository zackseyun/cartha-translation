id: LUK.16.1
reference: Luke 16:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: ml
  text: 'അവൻ ശിഷ്യന്മാരോടും പറഞ്ഞു: “ധനികനായ ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു. അയാൾക്ക് ഒരു കാര്യസ്ഥൻ[a] ഉണ്ടായിരുന്നു. ആ കാര്യസ്ഥൻ ധനികന്റെ സ്വത്തുക്കൾ ധൂർത്തടിക്കുന്നുവെന്ന കുറ്റാരോപണം ധനികന് ലഭിച്ചു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മേൽനോട്ടക്കാരൻ.’ οἰκονόμος എന്ന പദം ഒരു വീടിന്റെയോ സ്വത്തിന്റെയോ മേൽനോട്ടവും നടത്തിപ്പും ഏൽപ്പിക്കപ്പെട്ട ആളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അയാൾക്കു പ്രതികൂലമായ ഒരു റിപ്പോർട്ട് ലഭിച്ചു’ / ‘അയാൾക്കെതിരെ പരാതി ലഭിച്ചു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ കുറ്റാരോപണമോ പ്രതികൂലമായ റിപ്പോർട്ടോ സൂചിപ്പിക്കാം; കുറ്റം തെളിഞ്ഞുവെന്നത് നിർബന്ധമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: പറഞ്ഞു
  rationale: അപൂർണഭൂതകാലരൂപം ഇവിടെ പശ്ചാത്തലമൊരുക്കി അടുത്ത ഉപമ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ആവർത്തിച്ചോ ദീർഘമായോ സംസാരിച്ചുവെന്ന അനാവശ്യ സൂചന നൽകാൻ ഇടയുള്ളതിനാൽ സ്വാഭാവികമായ ആഖ്യാനരൂപമായ ‘പറഞ്ഞു’ സ്വീകരിച്ചു.
- source_word: δὲ καὶ
  choice: -ഓടും
  rationale: δέ സൂചിപ്പിക്കുന്ന ആഖ്യാനമാറ്റം മലയാളത്തിലെ വാക്യക്രമത്തിലൂടെ പ്രകടമാകുന്നു; καί എന്ന ‘also’ എന്ന അർഥം ‘ശിഷ്യന്മാരോടും’ എന്നതിലെ ‘-ഉം’ നിലനിർത്തുന്നു.
- source_word: πρὸς τοὺς μαθητάς
  choice: ശിഷ്യന്മാരോടും
  rationale: മൂലത്തിൽ ഉടമസ്ഥസർവനാമം ഇല്ലാത്തതിനാൽ ‘തന്റെ ശിഷ്യന്മാർ’ എന്നു ചേർക്കാതെ ദിശാസംബന്ധം സ്വാഭാവികമായി നൽകി.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: ധനികനായ ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു
  rationale: ഉപമയിലെ ഒരു വ്യക്തിയെ അവതരിപ്പിക്കുന്ന അനിശ്ചിതവും പ്രത്യേകവുമായ പ്രയോഗശക്തി നിലനിർത്തുന്നു.
- source_word: οἰκονόμον
  choice: കാര്യസ്ഥൻ
  rationale: ഒരു വീടിന്റെയോ സ്വത്തിന്റെയോ നടത്തിപ്പ് ഏൽപ്പിക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ പദം.
- source_word: οὗτος
  choice: ആ കാര്യസ്ഥൻ
  rationale: സർവനാമത്തിന്റെ സൂചന കാര്യസ്ഥനിലേക്കാണെന്ന് വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിലെ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: διεβλήθη αὐτῷ
  choice: ആ കാര്യസ്ഥന്റെമേൽ അയാളുടെ മുമ്പാകെ കുറ്റം ആരോപിക്കപ്പെട്ടു
  rationale: പരാതിയോ അപകീർത്തിപ്പെടുത്തുന്ന റിപ്പോർട്ടോ ഉൾക്കൊള്ളാവുന്ന ക്രിയയുടെ ആരോപണസ്വഭാവവും αὐτῷ എന്ന പരോക്ഷബന്ധവും നിലനിർത്തുന്നു; ആരോപണം തെളിയിക്കപ്പെട്ടതായി പറയുന്നില്ല.
- source_word: ὡς διασκορπίζων
  choice: ധൂർത്തടിക്കുന്നു എന്ന്
  rationale: സാമ്പത്തിക-സ്വത്ത് പശ്ചാത്തലത്തിൽ ‘ചിതറിക്കുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ നഷ്ടപ്പെടുത്തിക്കൊണ്ടിരിക്കുന്നതിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ധനികന്റെ സ്വത്തുക്കൾ
  rationale: മൂലത്തിലെ സർവനാമം ധനികന്റെ ആസ്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘അയാളുടെ’ എന്നു പറഞ്ഞാൽ കാര്യസ്ഥനെയോ ധനികനെയോ സൂചിപ്പിക്കാമെന്നതിനാൽ വ്യക്തതയ്ക്കായി നാമം ആവർത്തിച്ചു.
theological_decisions:
- issue: കാര്യസ്ഥനെതിരായ ആരോപണത്തിന്റെ സത്യസ്ഥിതി
  choice: ‘കുറ്റം ആരോപിക്കപ്പെട്ടു’ എന്ന് വിവർത്തനം ചെയ്ത് അത് ആരോപണമാണെന്ന നിലയിൽ മാത്രം അവതരിപ്പിച്ചു
  alternative: ‘സ്വത്തുക്കൾ ധൂർത്തടിക്കുന്നതായി കണ്ടെത്തി’ അല്ലെങ്കിൽ ‘പരാതി ലഭിച്ചു’
  rationale: διαβάλλω എന്ന പദം വിരുദ്ധമായ റിപ്പോർട്ടിനെയോ കുറ്റാരോപണത്തെയോ സൂചിപ്പിക്കാം; ആരോപണം തെളിയിക്കപ്പെട്ടതാണെന്നോ അസത്യമാണെന്നോ വാക്യം തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘കാര്യസ്ഥൻ,’ ‘ധൂർത്തടിക്കുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും പുരാതന സ്വത്തുനടത്തിപ്പിന്റെ പശ്ചാത്തലത്തിന് യോജിച്ചതുമാണ്. പരാമർശങ്ങൾ ആശയക്കുഴപ്പമാകാതിരിക്കാൻ ‘ധനികൻ,’ ‘കാര്യസ്ഥൻ’ എന്നീ നാമങ്ങൾ ആവശ്യമായിടത്ത് ആവർത്തിച്ചു.
