reference: Luke 16:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: ml
  text: 'എന്നാൽ അബ്രാഹാം പറഞ്ഞു: “മകനേ, നിന്റെ ജീവിതകാലത്ത് നിനക്കു നല്ല കാര്യങ്ങൾ ലഭിച്ചു, ലാസറിന് അതുപോലെ ദുരിതങ്ങളും ലഭിച്ചു എന്നു ഓർക്കുക. ഇപ്പോൾ അവന് ഇവിടെ ആശ്വാസം ലഭിക്കുന്നു; നീയോ കടുത്ത വേദനയിലാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, “നീ യാതനയിലാണ്.” ഗ്രീക്ക് പദത്തിന് തീവ്രമായ വേദനയെയോ മനോവ്യഥയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: മകനേ
  rationale: സ്നേഹവും മുതിർന്നവന്റെ നിലയിൽനിന്നുള്ള അഭിസംബോധനയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ഇവിടെ അത് നിർബന്ധമായും ജൈവിക പുത്രത്വം സൂചിപ്പിക്കുന്നില്ല.
- source_word: μνήσθητι
  choice: ഓർക്കുക
  rationale: ഓർമയിലേക്കു വിളിക്കുന്ന ഗ്രീക്ക് ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἀπέλαβες
  choice: ലഭിച്ചു
  rationale: ലഭിച്ചതിനെയോ തനിക്കുള്ളത് പൂർണമായി കൈപ്പറ്റിയതിനെയോ സൂചിപ്പിക്കാവുന്ന ക്രിയ. പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ പൊതുവർത്ഥം നിലനിർത്തി ശക്തമായ സാദ്ധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: τὰ ἀγαθά σου
  choice: നിനക്കുള്ള നല്ല കാര്യങ്ങൾ
  rationale: സുഖകരമോ പ്രയോജനകരമോ ആയ കാര്യങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ‘അനുഗ്രഹങ്ങൾ’ എന്നു നൽകി അധികമായ ദൈവശാസ്ത്രസൂചന ചേർക്കുന്നത് ഒഴിവാക്കി.
- source_word: ἐν τῇ ζωῇ σου
  choice: നിന്റെ ജീവിതകാലത്ത്
  rationale: ഭൗമികജീവിതത്തിലെ കാലപരിധി വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁμοίως
  choice: അതുപോലെ
  rationale: ധനികന്റെ അനുഭവവും ലാസറിന്റെ അനുഭവവും തമ്മിലുള്ള സമാന്തരവൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: τὰ κακά
  choice: ദുരിതങ്ങൾ
  rationale: ലാസർ ചെയ്ത ധാർമികതിന്മകളെയല്ല, അവൻ അനുഭവിച്ച പ്രതികൂല കാര്യങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘ദുരിതങ്ങൾ’ ആ അർത്ഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: παρακαλεῖται
  choice: ആശ്വാസം ലഭിക്കുന്നു
  rationale: ഈ സന്ദർഭത്തിലെ നിഷ്ക്രിയരൂപം ആശ്വസിപ്പിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ നിഷ്ക്രിയ അർത്ഥപ്രയോഗമാണിത്.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: കഥയിലെ ഇപ്പോഴത്തെ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ദർശകക്രിയാവിശേഷണം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: ὀδυνᾶσαι
  choice: കടുത്ത വേദനയിലാണ്
  rationale: ശക്തമായ വേദനയെയോ മനോവ്യഥയെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; ‘യാതന’ എന്ന കൂടുതൽ വ്യാഖ്യാനഭാരമുള്ള പദം പ്രധാനപാഠത്തിൽ ഒഴിവാക്കി.
theological_decisions:
- issue: മരണാനന്തര കഷ്ടാനുഭവത്തെ സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: നീയോ കടുത്ത വേദനയിലാണ്
  alternative: നീയോ യാതനയിലാണ്
  rationale: വാക്യം മരണാനന്തരമുള്ള ബോധപൂർവമായ കഷ്ടാനുഭവം ചിത്രീകരിക്കുന്നു. എന്നാൽ ὀδυνᾶσαι എന്ന പദം സ്വതവേ പറയുന്നതിനെക്കാൾ പ്രത്യേകമായ ശിക്ഷാസിദ്ധാന്തം പരിഭാഷയിൽ ചേർക്കാതെ, ശക്തമായ വേദനയെന്ന അതിന്റെ അർത്ഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സമാന്തരവൈരുധ്യം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമാകുന്ന പദാനുപദഘടന ഒഴിവാക്കി. ദൈവശാസ്ത്രപരമായി അധികവ്യാഖ്യാനം വരുത്തുന്ന ‘അനുഗ്രഹങ്ങൾ’, ‘യാതന’ തുടങ്ങിയ തിരഞ്ഞെടുപ്പുകൾ പ്രധാനപാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
