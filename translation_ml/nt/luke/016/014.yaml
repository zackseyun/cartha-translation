id: LUK.16.14
reference: Luke 16:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: ml
  text: പണത്തെ സ്നേഹിക്കുന്നവരായ പരീശന്മാർ ഇതെല്ലാം കേട്ടുകൊണ്ടിരുന്നു; അവർ യേശുവിനെ പരിഹസിച്ചുകൊണ്ടുമിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ പുച്ഛിച്ചുകൊണ്ടിരുന്നു.’ ഈ ക്രിയയ്ക്ക് പരസ്യമായ അവഹേളനമോ നിന്ദാപൂർവമായ പരിഹാസമോ സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: കേട്ടുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ, സമകാലിക പ്രവൃത്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ആഖ്യാനമാറ്റമാണ്; മലയാളത്തിലെ വാക്യക്രമവും അർധവിരാമവും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ταῦτα πάντα
  choice: ഇതെല്ലാം
  rationale: യേശുവിന്റെ തൊട്ടുമുമ്പുള്ള ഉപദേശങ്ങളെയെല്ലാം സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: οἱ Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: സുവിശേഷങ്ങളിൽ ഈ യഹൂദവിഭാഗത്തിന് മലയാളത്തിൽ സ്ഥാപിതമായ പേര്.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: പണത്തെ സ്നേഹിക്കുന്നവരായിരുന്ന
  rationale: ‘ധനമോഹികൾ’ അല്ലെങ്കിൽ ‘അത്യാഗ്രഹികൾ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ നൈതികപദങ്ങൾക്ക് പകരം, പണത്തോടുള്ള സ്നേഹം എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സുതാര്യത നിലനിർത്തുന്നു.
- source_word: ἐξεμυκτήριζον
  choice: പരിഹസിച്ചുകൊണ്ടുമിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചയും ക്രിയയിലെ പരസ്യമായ അവഹേളനത്തിന്റെയും നിന്ദാപൂർവമായ പരിഹാസത്തിന്റെയും ആശയവും വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: αὐτόν
  choice: യേശുവിനെ
  rationale: സന്ദർഭത്തിലെ സർവനാമസൂചന സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; പുതിയ അർത്ഥം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: φιλάργυροι എന്ന പദത്തിൽ പരീശന്മാരുടെ പാപത്തിന്റെ സ്വഭാവീകരണം
  choice: പണത്തെ സ്നേഹിക്കുന്നവരായിരുന്ന
  alternative: ധനമോഹികളായിരുന്നു / അത്യാഗ്രഹികളായിരുന്നു
  rationale: ഗ്രീക്ക് പദം നേരിട്ട് പണത്തോടുള്ള സ്നേഹത്തെ സൂചിപ്പിക്കുന്നു. സമ്പത്തിനെക്കുറിച്ചുള്ള യേശുവിന്റെ മുൻപത്തെ ഉപദേശവുമായുള്ള ബന്ധം നിലനിർത്തിക്കൊണ്ട്, വിശാലമായ ഒരു നൈതികവിധി പരിഭാഷയിൽ ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. രണ്ട് അപൂർണഭൂതകാല ക്രിയകളുടെയും തുടർച്ച ‘-കൊണ്ടിരുന്നു’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തി. ആവർത്തനം ഭാരമാകാതിരിക്കാൻ രണ്ടാം ക്രിയയിൽ ‘-മിരുന്നു’ ചേർത്ത് സമകാലികത സൂചിപ്പിച്ചു. ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പടയാളം ‘പരീശന്മാർ’ എന്നതിന് പിന്നാലെയുണ്ടെങ്കിലും അടിക്കുറിപ്പ് ἐξεμυκτήριζον എന്ന ക്രിയയെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ബന്ധപ്പെട്ട ക്രിയയ്ക്ക് ശേഷമാണ് [a] നൽകിയിരിക്കുന്നത്.
