id: LUK.9.26
reference: Luke 9:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: ml
  text: എന്തെന്നാൽ, എന്നെയും എന്റെ വചനങ്ങളെയും കുറിച്ച് ലജ്ജിക്കുന്നവൻ ആരായാലും, മനുഷ്യപുത്രൻ തന്റെ മഹത്ത്വത്തിലും പിതാവിന്റെയും വിശുദ്ധ ദൂതന്മാരുടെയും മഹത്ത്വത്തിലും വരുമ്പോൾ, ആ വ്യക്തിയെക്കുറിച്ച് ലജ്ജിക്കും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥമായി: ‘ഈ ഒരാളെക്കുറിച്ച്.’'
    reason: lexical_alternative
  - marker: b
    text: 'മഹത്ത്വത്തെക്കുറിച്ചുള്ള ഗ്രീക്ക് ഘടനയെ ഇങ്ങനെയും പ്രതിനിധീകരിക്കാം: ‘തന്റെയും പിതാവിന്റെയും വിശുദ്ധ ദൂതന്മാരുടെയും മഹത്ത്വത്തിൽ അവൻ വരുമ്പോൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: എന്തെന്നാൽ, ... ആരായാലും
  rationale: γάρ എന്ന വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’ എന്നും ὃς ... ἄν എന്ന പൊതുവ്യാപകമായ അനിശ്ചിത ഘടന ‘ആരായാലും’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: ലജ്ജിക്കുന്നവൻ / ലജ്ജിക്കും
  rationale: ഒരേ ക്രിയയുടെ ആവർത്തനം നിലനിർത്തി, മനുഷ്യന്റെ പ്രതികരണവും മനുഷ്യപുത്രന്റെ ഭാവിപ്രതികരണവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ പരസ്പരസാദൃശ്യം സംരക്ഷിക്കുന്നു; ‘തള്ളിക്കളയും’ പോലുള്ള ശക്തമായ വ്യാഖ്യാനങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: എന്നെയും എന്റെ വചനങ്ങളെയും കുറിച്ച്
  rationale: λόγους എന്നതിനെ ‘വചനങ്ങൾ’ എന്നു നേരിട്ട് പ്രതിനിധീകരിക്കുകയും ക്രിയയുമായുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦτον
  choice: ആ വ്യക്തിയെക്കുറിച്ചും
  rationale: മുമ്പുള്ള പൊതുവ്യാപകമായ ‘ആരായാലും’ എന്നതിലേക്കു തിരികെ ചൂണ്ടുന്ന ഏകവചനപ്രയോഗമാണിത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സ്ത്രീപുരുഷഭേദമില്ലാതെ മുന്നറിയിപ്പിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്നതുമാണ്; അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥമായ രൂപം നൽകുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സ്ഥിരീകരിക്കപ്പെട്ട ശീർഷകവും ദാനീയേൽ പശ്ചാത്തലമുൾപ്പെടെയുള്ള അന്തർപാഠബന്ധങ്ങളും പരാവർത്തനം കൂടാതെ സംരക്ഷിക്കുന്നു.
- source_word: ὅταν ἔλθῃ
  choice: വരുമ്പോൾ
  rationale: ὅταν + aorist subjunctive നൽകുന്ന ഭാവികാലസംബന്ധമായ സമയാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: തന്റെ മഹത്ത്വത്തിലും പിതാവിന്റെയും വിശുദ്ധ ദൂതന്മാരുടെയും മഹത്ത്വത്തിലും
  rationale: പുത്രന്റെ മഹത്ത്വവും പിതാവിനോടും വിശുദ്ധ ദൂതന്മാരോടും ബന്ധപ്പെടുത്തിയ മഹത്ത്വവും വേർതിരിച്ചറിയാൻ കഴിയുന്ന വിധത്തിൽ അവതരിപ്പിക്കുമ്പോഴും ഗ്രീക്കിലെ ഏകോപനത്തിന്റെ ഗാംഭീര്യവും യഥാർഥ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
- source_word: τῶν ἁγίων ἀγγέλων
  choice: വിശുദ്ധ ദൂതന്മാരുടെ
  rationale: വിശേഷണവും നാമവും നേരിട്ടും സ്വാഭാവികമായും വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: പൊതുവ്യാപകമായ പുരുഷലിംഗ ഏകവചനത്തെ മലയാളത്തിൽ എങ്ങനെ പ്രതിനിധീകരിക്കണം
  choice: ആ വ്യക്തിയെക്കുറിച്ചും
  alternative: അവനെക്കുറിച്ചും / ഈ ഒരാളെക്കുറിച്ചും
  rationale: ഗ്രീക്കിലെ ഏകവചനപരാമർശം നിലനിർത്തുന്നു; അതേസമയം മലയാളത്തിൽ ഈ മുന്നറിയിപ്പ് പുരുഷന്മാർക്കു മാത്രം ബാധകമാണെന്ന തെറ്റായ സൂചന ഒഴിവാക്കുന്നു. അടിക്കുറിപ്പ് τοῦτον എന്ന ചൂണ്ടുപദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥമായ ശക്തി രേഖപ്പെടുത്തുന്നു.
- issue: മനുഷ്യപുത്രൻ, പിതാവ്, വിശുദ്ധ ദൂതന്മാർ എന്നിവരോടു ബന്ധപ്പെടുത്തിയ അന്ത്യകാല മഹത്ത്വം
  choice: തന്റെ മഹത്ത്വത്തിലും പിതാവിന്റെയും വിശുദ്ധ ദൂതന്മാരുടെയും മഹത്ത്വത്തിലും
  alternative: തന്റെയും പിതാവിന്റെയും വിശുദ്ധ ദൂതന്മാരുടെയും മഹത്ത്വത്തിൽ
  rationale: മനുഷ്യപുത്രന്റെ സ്വന്തം മഹത്ത്വത്തെ വ്യക്തമായി നിലനിർത്തുകയും അതോടൊപ്പം പിതാവിന്റെയും വിശുദ്ധ ദൂതന്മാരുടെയും മഹത്ത്വവുമായുള്ള ബന്ധം പറയുകയും ചെയ്യുന്നു; അവരുടെ ബന്ധത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം ത്രിത്വപരമോ മറ്റു സിദ്ധാന്തപരമോ ആയ വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ഒരുമിപ്പിച്ചിരിക്കുന്നു. ‘വചനങ്ങൾ,’ ‘മനുഷ്യപുത്രൻ,’ ‘മഹത്ത്വം,’ ‘വിശുദ്ധ ദൂതന്മാർ’ എന്നീ പരിചിതമായെങ്കിലും മാന്യമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; പഴഞ്ചൻ ക്രിയാരൂപങ്ങളും വിഭാഗീയ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
