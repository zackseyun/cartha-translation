id: LUK.9.39
reference: Luke 9:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: ml
  text: ഇതാ, ഒരു ആത്മാവ്[a] അവനെ പിടികൂടുന്നു; പെട്ടെന്ന് അവൻ നിലവിളിക്കുന്നു; അത് നുരയോടെ അവനെ പിടച്ചിലുണ്ടാക്കുന്നു; അവനെ തകർത്തുകൊണ്ട് വളരെ പ്രയാസപ്പെട്ടാണ് അവനിൽനിന്ന് വിട്ടുപോകുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ദുഷ്ടാത്മാവ്” അല്ലെങ്കിൽ “ഒരു ഭൂതം”; ഇവിടെ ഗ്രീക്ക് പാഠത്തിൽ ‘ഒരു ആത്മാവ്’ എന്നു മാത്രമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: പിതാവിന്റെ വിവരണത്തിലെ സജീവത നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിലും സ്വാഭാവികമായ ശ്രദ്ധാകർഷക പ്രയോഗം.
- source_word: πνεῦμα
  choice: ഒരു ആത്മാവ്
  rationale: ഗ്രീക്കിൽ വിശേഷണമില്ലാതെ ‘ആത്മാവ്’ എന്നു മാത്രമാണ്; സന്ദർഭം ദുഷ്ടസ്വഭാവം സൂചിപ്പിച്ചാലും മുഖ്യപാഠം അതിലധികം വ്യക്തമാക്കുന്നില്ല.
- source_word: λαμβάνει
  choice: പിടികൂടുന്നു
  rationale: പെട്ടെന്നുള്ള ശക്തമായ അധീനപ്പെടുത്തലോ ആക്രമണമോ വ്യക്തമാക്കുന്നു; പൊതുവായ ‘എടുക്കുന്നു’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: ἐξαίφνης
  choice: പെട്ടെന്ന്
  rationale: സംഭവത്തിന്റെ അപ്രതീക്ഷിതവും ക്ഷണികവുമായ തുടക്കം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: κράζει
  choice: അവൻ നിലവിളിക്കുന്നു
  rationale: ഗ്രീക്ക് ക്രിയയുടെ സജീവരൂപവും ബാലൻ തന്നെയാണ് നിലവിളിക്കുന്നത് എന്ന സ്വാഭാവിക അർത്ഥവും നിലനിർത്തുന്നു; ‘അത് അവനെക്കൊണ്ട് നിലവിളിപ്പിക്കുന്നു’ എന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: σπαράσσει
  choice: കോച്ചിവലിക്കുന്നു
  rationale: ശരീരം ശക്തമായി ഞെരിച്ചുലയ്ക്കുന്ന കോച്ചിപ്പിടിത്തത്തിന്റെ ദൃശ്യവും ശാരീരികവുമായ ഫലം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μετὰ ἀφροῦ
  choice: നുരയോടെ
  rationale: കോച്ചിവലിക്കലിനോടൊപ്പം നുര വരുന്നതിനെ ഗ്രീക്കിലെ സംക്ഷിപ്ത ഘടനയ്ക്കൊത്ത വിധത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μόγις
  choice: വളരെ പ്രയാസപ്പെട്ടേ
  rationale: ആത്മാവ് എളുപ്പത്തിൽ വിട്ടുപോകുന്നില്ല എന്ന ശക്തമായ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അപൂർവമായി എന്ന സാധ്യത നിർബന്ധിച്ച് തീരുമാനിക്കുന്നില്ല.
- source_word: ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: വിട്ടുപോകുന്നുള്ളൂ
  rationale: ആത്മാവ് ബാലനിൽനിന്ന് പിന്മാറുന്നതിനെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: συντρῖβον αὐτόν
  choice: അവനെ തകർത്തുകൊണ്ട്
  rationale: ക്രിയാവിശേഷണസ്വഭാവമുള്ള വർത്തമാന കൃദന്തരൂപവും കഠിനമായി ദോഷപ്പെടുത്തുന്ന അർത്ഥവും നിലനിർത്തുന്നു; പരിക്കിന്റെ കൃത്യരൂപം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: πνεῦμα എന്നതിനെ മുഖ്യപാഠത്തിൽ ദുഷ്ടാത്മാവോ ഭൂതമോ എന്നു വ്യക്തമാക്കണമോ
  choice: ഒരു ആത്മാവ്
  alternative: ഒരു ദുഷ്ടാത്മാവ് / ഒരു ഭൂതം
  rationale: വിപുലമായ സന്ദർഭം ശത്രുതാപരമായ അതീന്ദ്രിയ സത്തയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ πνεῦμα എന്ന പൊതുപദം മാത്രമാണ്. അതിനാൽ ഗ്രീക്കിലെ അർത്ഥവ്യാപ്തി മുഖ്യപാഠത്തിൽ നിലനിർത്തി സന്ദർഭപരമായ മറ്റു വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. വാക്യത്തിന്റെ സജീവതയ്ക്കായി ചെറുവാക്യങ്ങളും അർദ്ധവിരാമവും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിന്റെ അവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
