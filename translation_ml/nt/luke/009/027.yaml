source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു സത്യമായി പറയുന്നു: ഇവിടെ നിൽക്കുന്നവരിൽ ചിലർ[a] ദൈവരാജ്യം കാണുന്നതുവരെ തീർച്ചയായും മരണം രുചിക്കുകയില്ല[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഇവിടെ നിൽക്കുന്നവരിൽപ്പെട്ട ചിലർ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘മരണം രുചിക്കുക’ എന്നത് ‘മരണം അനുഭവിക്കുക’ അഥവാ ‘മരിക്കുക’ എന്നർഥമുള്ള ഒരു ശൈലീപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു സത്യമായി പറയുന്നു
  rationale: δέ എന്ന സംവാദബന്ധകത്തെ ‘എന്നാൽ’ എന്നും ἀληθῶς എന്ന ക്രിയാവിശേഷണത്തെ ‘സത്യമായി’ എന്നും നൽകി, ഗ്രീക്കിലെ ക്രമവും ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰσίν τινες
  choice: ചിലർ
  rationale: τινες എന്നതിന്റെ അനിശ്ചിതത്വം ‘ചിലർ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ വേറൊരു അസ്തിത്വപ്രയോഗം ചേർക്കേണ്ടതില്ല.
- source_word: τῶν αὐτοῦ ἑστηκότων
  choice: ഇവിടെ നിൽക്കുന്നവരിൽ
  rationale: പങ്കിനെ സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് ഘടനയെ മലയാളത്തിലെ ‘-വരിൽ’ ഉപയോഗിച്ച് പ്രതിഫലിപ്പിക്കുന്നു. ἑστηκότων ഇപ്പോൾ നിൽക്കുന്നവരെ സൂചിപ്പിക്കുകയും αὐτοῦ സ്ഥലസൂചനയായി ‘ഇവിടെ’ എന്നു വരികയും ചെയ്യുന്നു.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: തീർച്ചയായും മരണം രുചിക്കുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധത്തെ ‘തീർച്ചയായും ... ഇല്ല’ എന്നു നൽകുന്നു. γεύομαι എന്ന രുചിക്കൽ-രൂപകം പ്രധാന പാഠത്തിൽ സംരക്ഷിക്കുന്നു; അതിന്റെ ആശയം മരിക്കുക എന്നതാണ്.
- source_word: ἕως ἂν ἴδωσιν
  choice: കാണുന്നതുവരെ
  rationale: ഭാവിയിലേക്കു നോക്കുന്ന ἕως ἄν + അയോറിസ്റ്റ് സബ്ജങ്ക്റ്റീവ് ഘടനയുടെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: βασιλεία എന്ന പദത്തിന്റെ രാജത്വം, ഭരണം, രാജ്യം എന്നീ അർത്ഥവ്യാപ്തികൾ തുറന്നുവെക്കുന്ന സ്ഥിരപ്രയോഗമാണിത്; ‘ദൈവത്തിന്റെ ഭരണം’ എന്ന പരിമിത വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവരാജ്യം കാണുക’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: വ്യാഖ്യാനവികാസമില്ലാതെ ‘ദൈവരാജ്യം കാണുക’ എന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: രൂപാന്തരീകരണത്തിൽ രാജ്യം വെളിപ്പെടുന്നത് കാണുക; പുനരുത്ഥാനം/സ്വർഗാരോഹണം കാണുക; യെരൂശലേമിന്റെ നാശത്തിൽ രാജ്യം കാണുക; സഭയുടെ വ്യാപനത്തിൽ രാജ്യം കാണുക.
  rationale: വ്യാഖ്യാനചരിത്രത്തിൽ പല സാധ്യതകളും നിലനിൽക്കുന്നതിനാൽ ഒരു പ്രത്യേക അന്ത്യകാലരേഖയോ സംഭവതിരിച്ചറിയലോ പരിഭാഷയിൽ അടിച്ചേൽപ്പിക്കാതെ ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മരണം രുചിക്കുക’ എന്ന ബൈബിൾരൂപകം വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തുകയും അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കുകയും ചെയ്തു. ശക്തമായ നിഷേധവും പങ്കുസൂചക ഘടനയും വ്യക്തമായി പ്രതിഫലിപ്പിച്ചു.
