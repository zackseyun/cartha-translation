id: LUK.9.32
reference: Luke 9:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: ml
  text: പത്രോസും അവനോടുകൂടെ ഉണ്ടായിരുന്നവരും ഉറക്കഭാരത്താൽ അമർന്നിരുന്നു; എന്നാൽ പൂർണമായി ഉണർന്നപ്പോൾ[a] അവർ അവന്റെ മഹിമയും അവനോടൊപ്പം നിന്നിരുന്ന ആ രണ്ടു പുരുഷന്മാരെയും കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉറക്കമുണർന്നശേഷം’ അല്ലെങ്കിൽ ‘പൂർണമായി ഉണർന്നുകഴിഞ്ഞപ്പോൾ.’ ഗ്രീക്കിലെ ഈ ക്രിയ അപൂർവമാണ്; അവർ മുഴുവൻ സമയവും ഉണർന്നിരുന്നു എന്നതിനെക്കാൾ പൂർണ ജാഗ്രതയിലേക്കു വന്നതിനു ഊന്നൽ നൽകുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: ഉറക്കത്താൽ ഭാരപ്പെട്ടിരുന്നു
  rationale: βαρέω എന്ന ക്രിയയുടെ പൂർണകാല കർമണി പങ്കാളിരൂപവും ὕπνῳ എന്ന ദത്തിവും ചേർന്ന് ഉറക്കം അവരെ ശക്തമായി അമർത്തിയിരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. വെറും ‘ഉറക്കം വന്നിരുന്നു’ എന്നതിനെക്കാൾ ഉറവിടത്തിലെ രൂപകം ഇത് നിലനിർത്തുന്നു.
- source_word: διαγρηγορήσαντες
  choice: പൂർണമായി ഉണർന്നപ്പോൾ
  rationale: അപൂർവമായ διαγρηγορέω ഇവിടെ ഉറക്കഭാരത്തിൽനിന്ന് പൂർണ ജാഗ്രതയിലേക്കു വന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. അവർ മുഴുവൻ സമയവും ഉണർന്നുതന്നെ ഇരുന്നു എന്ന വ്യാഖ്യാനം ഇത് അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: δόξαν
  choice: മഹത്ത്വം
  rationale: δόξαയുടെ ദൃശ്യതേജസ്സും ബൈബിൾപരമായ ദൈവിക മഹിമയുടെ അനുരണനവും ഉൾക്കൊള്ളുന്ന, മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായ പദമാണ് ‘മഹത്ത്വം’.
- source_word: τοὺς δύο ἄνδρας
  choice: ആ രണ്ടു പുരുഷന്മാരെ
  rationale: ἀνήρ ഇവിടെ പ്രായപൂർത്തിയായ പുരുഷന്മാരായ മോശെയെയും ഏലിയാവിനെയും സൂചിപ്പിക്കുന്നു. ‘ആ രണ്ടു പുരുഷന്മാർ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: συνεστῶτας αὐτῷ
  choice: അവനോടൊപ്പം നിൽക്കുന്ന
  rationale: συνίστημι എന്നതിന്റെ ഈ അകർമക പൂർണകാല പങ്കാളിരൂപം ഒപ്പം സന്നിഹിതരായി നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ദൃശ്യരംഗവും പങ്കാളിരൂപത്തിന്റെ സ്വഭാവവും പരിഭാഷയിൽ നിലനിൽക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: രണ്ടാമത്തെ δέ ഉറക്കത്താൽ ഭാരപ്പെട്ടിരുന്ന അവസ്ഥയും പിന്നീട് കണ്ടതും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു. ആദ്യത്തെ δέ മലയാളത്തിൽ പ്രത്യേക പദമായി നൽകാതെ വാക്യത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിലൂടെ കൈകാര്യം ചെയ്തു.
theological_decisions:
- issue: രൂപാന്തരീകരണസന്ദർഭത്തിലെ δόξαയുടെ പരിഭാഷ
  choice: അവന്റെ മഹത്ത്വം
  alternative: അവന്റെ തേജസ്സ് / അവന്റെ പ്രതാപം
  rationale: ‘മഹത്ത്വം’ ദൃശ്യപ്രകാശത്തെ മാത്രം പരിമിതപ്പെടുത്താതെ യേശുവിന്റെ മഹിമയുടെ ബൈബിൾപരവും ദൈവശാസ്ത്രപരവുമായ അനുരണനം നിലനിർത്തുന്നു; അതിന്റെ സ്വഭാവം പരിഭാഷയിൽ അതിവ്യാഖ്യാനിക്കുന്നില്ല.
- issue: διαγρηγορήσαντες എന്നതിന്റെ വ്യാഖ്യാനം
  choice: പൂർണമായി ഉണർന്നപ്പോൾ
  alternative: ഉണർന്നിരുന്നുകൊണ്ട് / ഉറക്കമുണർന്നശേഷം
  rationale: മുമ്പത്തെ ഉറക്കഭാരവുമായി യോജിച്ച് പൂർണ ജാഗ്രതയിലേക്കു വന്നതിനെ ഈ വായന സൂചിപ്പിക്കുന്നു. അവർ മുഴുവൻ സമയവും ജാഗരിച്ചിരുന്നുവെന്ന് തീർപ്പാക്കാതെ ഗ്രീക്കിലെ അപൂർവ ക്രിയയിലുള്ള ചെറിയ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഉറവിടത്തിലെ ഉറക്കഭാരത്തിന്റെ രൂപകവും δόξαയുടെ ബൈബിൾപരമായ അനുരണനവും സംരക്ഷിച്ചു; അപൂർവ ക്രിയയുടെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
