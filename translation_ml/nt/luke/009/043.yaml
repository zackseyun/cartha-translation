source:
  edition: SBLGNT
  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: ml
  text: 'ദൈവത്തിന്റെ മഹത്വം[a] കണ്ട് എല്ലാവരും അത്യന്തം ആശ്ചര്യപ്പെട്ടു. എന്നാൽ അവൻ ചെയ്തുകൊണ്ടിരുന്ന എല്ലാ കാര്യങ്ങളിലും എല്ലാവരും വിസ്മയിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അവൻ തന്റെ ശിഷ്യന്മാരോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവത്തിന്റെ മഹിമ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് μεγαλειότης എന്ന പദത്തിന് മഹത്വം, മഹിമ, മഹത്ത്വപൂർണമായ പ്രഭാവം എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: അത്യന്തം ആശ്ചര്യപ്പെട്ടു
  rationale: അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന ശക്തവും തുടരുന്നതുമായ ആശ്ചര്യപ്രതികരണം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള θαυμαζόντων എന്നതിനെക്കാൾ ശക്തമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മഹത്വം കണ്ട്
  rationale: ἐπί സഹിതമുള്ള ദത്തിവിഭക്തി ആശ്ചര്യത്തിന്റെ കാരണമോ വിഷയമോ സൂചിപ്പിക്കുന്നു. μεγαλειότης എന്നതിന്റെ greatness, grandeur, majesty എന്നീ അർഥവ്യാപ്തിക്ക് ‘മഹത്വം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദമാണ്.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: എന്നാൽ ... എല്ലാവരും വിസ്മയിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: Genitive absolute ഘടനയെ കാലസാഹചര്യം സൂചിപ്പിക്കുന്ന ഉപവാക്യമായി മാറ്റുന്നു. ‘വിസ്മയിക്കുക’ എന്നത് മുൻവാക്യത്തിലെ ശക്തമായ ἐκπλήσσομαι-യിൽനിന്ന് θαυμάζωയെ വേർതിരിക്കുന്നു.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: അവൻ ചെയ്തുകൊണ്ടിരുന്ന സകലത്തെയും കുറിച്ച്
  rationale: ἐποίει എന്ന അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം ‘ചെയ്തുകൊണ്ടിരുന്ന’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ἐπί ഇവിടെ വിസ്മയത്തിന്റെ വിഷയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: അവൻ തന്റെ ശിഷ്യന്മാരോടു പറഞ്ഞു
  rationale: ഗ്രീക്ക് വാക്യത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: οἷς ἐποίει / εἶπεν എന്നീ ക്രിയകളിലെ മറഞ്ഞിരിക്കുന്ന കർത്താവിന്റെ സൂചകം
  choice: ‘അവൻ’ യേശുവിനെ സൂചിപ്പിക്കുന്നു
  alternative: മുൻപുള്ള ‘ദൈവത്തിന്റെ മഹത്വം’ എന്ന പ്രയോഗത്തിന്റെ അടിസ്ഥാനത്തിൽ ദൈവിക പ്രവർത്തനശേഷിക്ക് കൂടുതൽ ഊന്നൽ നൽകുക
  rationale: അടുത്തുള്ള ആഖ്യാനസന്ദർഭത്തിൽ പ്രവൃത്തികൾ ചെയ്യുന്നവനും ശിഷ്യന്മാരോട് സംസാരിക്കുന്നവനും യേശുവാണ്. അതേസമയം പ്രകടമായ മഹത്വം ദൈവത്തിന്റേതാണെന്ന വാചകവും അതേപടി നിലനിർത്തുന്നതിനാൽ ദൈവത്തെയും യേശുവിനെയും തമ്മിൽ ലയിപ്പിക്കാതെ ലൂക്കോസിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സമാനാർഥമുള്ള രണ്ട് ഗ്രീക്ക് ആശ്ചര്യക്രിയകളുടെ ശക്തിവ്യത്യാസം ‘അത്യന്തം ആശ്ചര്യപ്പെട്ടു’ / ‘വിസ്മയിച്ചുകൊണ്ടിരിക്കുമ്പോൾ’ എന്നിങ്ങനെ സൂക്ഷിച്ചിട്ടുണ്ട്.
