id: LUK.9.33
reference: Luke 9:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: ml
  text: 'അവർ അവനെ വിട്ടുപിരിഞ്ഞുപോകുമ്പോൾ പത്രോസ് യേശുവിനോട് പറഞ്ഞു: “നാഥാ, നാം ഇവിടെ ഇരിക്കുന്നത് നല്ലതാണ്. നമുക്ക് മൂന്ന് കൂടാരങ്ങൾ[a] ഉണ്ടാക്കാം—ഒന്ന് അങ്ങേക്കും, ഒന്ന് മോശെയ്ക്കും, ഒന്ന് ഏലിയാവിനും.” താൻ പറയുന്നത് എന്താണെന്ന് അവൻ അറിഞ്ഞില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “താത്കാലിക പാർപ്പിടങ്ങൾ” എന്നോ “പന്തലുകൾ” എന്നോ പരിഭാഷപ്പെടുത്താം; പരമ്പരാഗതമായി “തിരുനിവാസങ്ങൾ” എന്നും പറഞ്ഞിട്ടുണ്ട്. ഗ്രീക്ക് പദമായ skēnai താത്കാലിക അഭയസ്ഥലങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; അത് ബൈബിളിലെ കൂടാരപ്പെരുന്നാളിന്റെ ദൃശ്യഭാവത്തെ ഓർമിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: അവർ അവനെ വിട്ടുപിരിഞ്ഞുപോകുമ്പോൾ
  rationale: ἐγένετο ἐν τῷ + infinitive എന്ന ആഖ്യാനപ്രയോഗത്തിന്റെ സമകാലികത സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ἀπό സൂചിപ്പിക്കുന്ന യേശുവിൽനിന്നുള്ള വേർപാടും നിലനിർത്തുന്നു.
- source_word: Ἐπιστάτα
  choice: നാഥാ
  rationale: ലൂക്കോസ് യേശുവിനെ അഭിസംബോധന ചെയ്യാൻ പ്രത്യേകമായി ഉപയോഗിക്കുന്ന അധികാരവും ആദരവും സൂചിപ്പിക്കുന്ന ἐπιστάτης എന്ന പദത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; അതിനെ διδάσκαλος എന്ന സാധാരണ ‘ഗുരു’വിനോട് ലയിപ്പിക്കുന്നില്ല.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: നാം ഇവിടെ ഇരിക്കുന്നത് നല്ലതാണ്
  rationale: καλόν എന്നതിന്റെ നേരിട്ടുള്ള മൂല്യനിർണയഭാവവും infinitival construction-ന്റെ അർത്ഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ποιήσωμεν
  choice: നമുക്ക് ... ഉണ്ടാക്കാം
  rationale: ഒന്നാംപുരുഷ hortatory subjunctive ആയതിനാൽ പത്രോസിന്റെ നിർദേശം നേരിട്ട് പ്രകടമാക്കുന്നു; ‘പണിയാം’ എന്നു പറഞ്ഞ് നിർമാണഭാവം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: σκηνὰς
  choice: കൂടാരങ്ങൾ
  rationale: താത്കാലിക അഭയസ്ഥലമോ കൂടാരമോ എന്ന അടിസ്ഥാനാർത്ഥം വ്യക്തമായി നൽകുകയും തിരുനിവാസം എന്ന പ്രത്യേക വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: താൻ പറയുന്നത് എന്താണെന്ന് അവൻ അറിഞ്ഞില്ല
  rationale: പത്രോസ് അപ്പോൾ പറഞ്ഞുകൊണ്ടിരുന്നതിനെക്കുറിച്ചുള്ള അവന്റെ അറിവില്ലായ്മ present λέγει-യുടെ തുടരുന്ന ഭാവത്തോടെ നിലനിർത്തുന്നു; ‘മനസ്സിലാക്കിയില്ല’ എന്ന വ്യാഖ്യാനപരമായ ശക്തീകരണം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: രൂപാന്തരീകരണസന്ദർഭത്തിൽ σκηνάς എന്ന പദത്തിനുള്ള ഉത്സവ/തിരുനിവാസ അനുരണനം
  choice: കൂടാരങ്ങൾ
  alternative: താത്കാലിക പാർപ്പിടങ്ങൾ; പന്തലുകൾ; തിരുനിവാസങ്ങൾ
  rationale: വാക്യം ഈ നിർമിതികളെ കൂടാരപ്പെരുന്നാളുമായോ തിരുനിവാസപാരമ്പര്യവുമായോ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠം നിഷ്പക്ഷവും കൃത്യവുമായി നിർത്തി, സാധ്യതയുള്ള ബൈബിൾ അനുരണനം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ശൈലി. യേശുവിനോടുള്ള അഭിസംബോധനയിൽ ‘നാഥാ’, തുടർന്നുള്ള പരാമർശത്തിൽ ആദരസൂചകമായ ‘അങ്ങേക്ക്’ എന്നിവ ഉപയോഗിച്ചു. പത്രോസിന്റെ വാക്കുകൾക്കുശേഷമുള്ള ആഖ്യാതാവിന്റെ വിലയിരുത്തൽ വ്യക്തമായി വേർതിരിച്ചിരിക്കുന്നു.
