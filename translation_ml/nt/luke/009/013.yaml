id: LUK.9.13
reference: Luke 9:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾതന്നെ[a] അവർക്ക് ഭക്ഷിക്കാൻ എന്തെങ്കിലും കൊടുക്കുക.” അവർ പറഞ്ഞു: “അഞ്ച് അപ്പവും രണ്ട് മീനും അല്ലാതെ മറ്റൊന്നും ഞങ്ങളുടെ പക്കലില്ല—ഞങ്ങൾതന്നെ പോയി ഈ ജനങ്ങൾക്കെല്ലാം[b] ഭക്ഷണം വാങ്ങിയാലൊഴികെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങൾതന്നെ’ എന്നതിന് ഗ്രീക്കിൽ പ്രത്യേക ഊന്നലുണ്ട്.
    reason: lexical_emphasis
  - marker: b
    text: അഥവാ, “ഈ ജനക്കൂട്ടത്തിനെല്ലാം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε
  choice: കൊടുക്കുക
  rationale: δίδωμι എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു; φαγεῖν ചേർന്നതിനാൽ മലയാളത്തിൽ ‘ഭക്ഷിക്കാൻ എന്തെങ്കിലും കൊടുക്കുക’ എന്നു വികസിപ്പിക്കുന്നത് ആശയം വ്യക്തമാക്കുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾതന്നെ
  rationale: പ്രകടമായി ചേർത്തിരിക്കുന്ന കർത്തൃസർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ ‘തന്നെ’ ഉപയോഗിച്ച് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: φαγεῖν
  choice: ഭക്ഷിക്കാൻ എന്തെങ്കിലും
  rationale: ‘അവർക്ക് തിന്നാൻ കൊടുക്കുക’ എന്ന കൂടുതൽ അക്ഷരാർഥരൂപത്തേക്കാൾ, നൽകേണ്ടത് ഭക്ഷണമാണെന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: πλεῖον ἢ
  choice: അല്ലാതെ മറ്റൊന്നും ... ഇല്ല
  rationale: നിഷേധത്തോടുകൂടിയ പ്രയോഗം കൈവശമുള്ളതിന്റെ പരിമിതി വ്യക്തമാക്കുന്നു.
- source_word: ἄρτοι πέντε
  choice: അഞ്ച് അപ്പം
  rationale: ἄρτοι എണ്ണാവുന്ന അപ്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സംഖ്യയ്ക്കുശേഷം ഏകവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: ἰχθύες δύο
  choice: രണ്ട് മീൻ
  rationale: സന്ദർഭത്തിലെ സാധാരണ എണ്ണാവുന്ന ഭക്ഷ്യവസ്തുവിനെ ലളിതമായി നൽകുന്നു.
- source_word: εἰ μήτι
  choice: വാങ്ങിയാലൊഴികെ
  rationale: വ്യത്യസ്തമായ ഏക സാധ്യത അവതരിപ്പിക്കുന്ന ‘unless’ എന്ന മുഖ്യബലം നിലനിർത്തുന്നു; ഗ്രീക്കിലെ നേരിയ അനിശ്ചിതത്വം സന്ദർഭത്തിലും വാക്യഭാവത്തിലും അവശേഷിക്കുന്നു.
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: ഞങ്ങൾതന്നെ പോയി ... വാങ്ങിയാലൊഴികെ
  rationale: പങ്കാളിക്രിയയെ സ്വാഭാവിക മലയാളത്തിലെ തുടർപ്രവർത്തനമായി നൽകുകയും ἡμεῖς എന്ന പ്രകട സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: ഈ ജനങ്ങൾക്കെല്ലാം
  rationale: λαός എന്നതിന്റെ ‘people’ എന്ന കൂട്ടായ അർഥവും πάντα, τοῦτον എന്നിവയുടെ സമഗ്രതയും സമീപസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: βρώματα
  choice: ഭക്ഷണം
  rationale: ഭക്ഷ്യവസ്തുക്കൾ എന്ന ബഹുവചന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായ ദ്രവ്യനാമംകൊണ്ട് നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ കല്പനയുടെയും ശിഷ്യരുടെ മറുപടിയുടെയും ഭാവം
  choice: ഗ്രീക്കിലുള്ള ഊന്നൽ മാത്രം നിലനിർത്തി സംഭാഷണം നേരിട്ട് അവതരിപ്പിച്ചു.
  alternative: യേശുവിന്റെ വാക്കുകൾ ശാസനയായോ ശിഷ്യരുടെ മറുപടി അസഹിഷ്ണുതയായോ കൂടുതൽ ശക്തമാക്കി നൽകുക.
  rationale: മൂലപാഠം നേരിട്ടുള്ള കല്പനയും പ്രായോഗികമായ എതിർവാദവും രേഖപ്പെടുത്തുന്നു; അതിലധികമായ പരിഹാസമോ കോപമോ ചേർക്കുന്നില്ല.
- issue: ശിഷ്യരുടെ അവസാന വാക്കുകളുടെ വാക്യഭാവം
  choice: εἰ μήτι എന്ന ഒഴിവുസാധ്യതയെ ‘...വാങ്ങിയാലൊഴികെ’ എന്നു പ്രസ്താവനാരൂപത്തിൽ നിലനിർത്തി.
  alternative: ‘ഞങ്ങൾ പോയി വാങ്ങണമെന്നാണോ?’ എന്ന വ്യക്തമായ ചോദ്യരൂപം.
  rationale: സന്ദർഭത്തിൽ പ്രതിഷേധാത്മകമായ ചോദ്യം സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്കിൽ നേരിട്ടുള്ള ചോദ്യം അടയാളപ്പെടുത്തിയിട്ടില്ല; അതിനാൽ യഥാർഥമായ വാക്യഘടനയിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി. ‘ഭക്ഷിക്കാൻ എന്തെങ്കിലും കൊടുക്കുക’ എന്നത് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്. ശിഷ്യരുടെ മറുപടിയിലെ അപൂർണവും പ്രതിഷേധസൂചകവുമായ ഭാവം ദീർഘരേഖയിലൂടെ നിലനിർത്തിയെങ്കിലും വ്യക്തമായ ചോദ്യം ചേർത്തിട്ടില്ല.
