id: LUK.9.45
reference: Luke 9:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: ml
  text: എന്നാൽ അവർ ഈ വാക്ക്[a] മനസ്സിലാക്കിയില്ല; അത് അവർ തിരിച്ചറിയാതിരിക്കേണ്ടതിന് അത് അവരിൽനിന്ന് മറച്ചുവെക്കപ്പെട്ടിരുന്നു[b]. ഈ വാക്കിനെക്കുറിച്ച് അവനോട് ചോദിക്കാൻ അവർ ഭയപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വാക്ക്’ (ῥῆμα) എന്നതിന് ‘പ്രസ്താവന’ അല്ലെങ്കിൽ ‘കാര്യം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ആരാണ് മറച്ചുവെച്ചതെന്ന് പറയാതെ, ‘അത് അവരിൽനിന്ന് മറച്ചുവെക്കപ്പെട്ടിരുന്നു’ എന്നാണ് ഗ്രീക്കിലുള്ളത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: മനസ്സിലായില്ല
  rationale: യേശു പറഞ്ഞതിന്റെ അർഥം ഗ്രഹിക്കുന്നതിലെ പരാജയമാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: ῥῆμα
  choice: വചനം
  rationale: ഇവിടെ യേശു തൊട്ടുമുമ്പ് പറഞ്ഞ നിർദിഷ്ടമായ ഉച്ചാരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വചനം’ മാന്യവും പരിചിതവുമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: παρακεκαλυμμένον
  choice: മറച്ചുവെക്കപ്പെട്ടിരുന്നു
  rationale: പെരിഫ്രാസ്റ്റിക് പൂർണ ഭൂതകാല നിഷ്ക്രിയരൂപം സൂചിപ്പിക്കുന്ന നിലനിന്ന മറവ് പ്രകടമാക്കുകയും പ്രവർത്തകനെ പേരെടുത്തുപറയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπ’ αὐτῶν
  choice: അവരിൽനിന്ന്
  rationale: ἀπό എന്നതിന്റെ അടിസ്ഥാനമായ ‘നിന്ന്’ എന്ന അർഥം നിലനിർത്തി, വചനം അവരുടെ ഗ്രഹണത്തിൽനിന്ന് മറഞ്ഞിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: അവർ അത് ഗ്രഹിക്കാതിരിക്കേണ്ടതിന്
  rationale: αἰσθάνομαι എന്നതിലെ തിരിച്ചറിയുക/ഗ്രഹിക്കുക എന്ന ഭാവം നൽകുകയും മുൻപുള്ള ἠγνόουν എന്ന ക്രിയയുമായുള്ള പദവ്യത്യാസം സാധ്യമായത്ര നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐφοβοῦντο
  choice: അവർ ഭയപ്പെട്ടു
  rationale: ചോദിക്കാൻ മടിപ്പിച്ച അവരുടെ ഭയാവസ്ഥയെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐρωτῆσαι
  choice: ചോദിക്കാൻ
  rationale: വിശദീകരണം തേടി യേശുവിനോട് ചോദിക്കുക എന്ന സന്ദർഭാർഥത്തിന് ഏറ്റവും സ്വാഭാവികമായ മലയാളരൂപം.
theological_decisions:
- issue: മറച്ചുവെച്ചതിന്റെ പ്രവർത്തകൻ
  choice: പ്രവർത്തകനെ വ്യക്തമാക്കാതെ ‘അത് അവരിൽനിന്ന് മറച്ചുവെക്കപ്പെട്ടിരുന്നു’ എന്ന നിഷ്ക്രിയപ്രയോഗം നിലനിർത്തി.
  alternative: ദൈവം അത് അവരിൽനിന്ന് മറച്ചുവെച്ചു; അല്ലെങ്കിൽ വ്യക്തമായ ദൈവിക പ്രവർത്തനമില്ലാതെ അത് അവർക്ക് അവ്യക്തമായി തുടർന്നു.
  rationale: ഗ്രീക്ക് നിഷ്ക്രിയനിർമ്മിതി പ്രവർത്തകനെ പേരെടുത്തുപറയുന്നില്ല. അതിനാൽ വാക്യം തന്നെയുറപ്പിക്കാത്ത ദൈവശാസ്ത്രപരമായ നിഗമനം വിവർത്തനത്തിൽ ചേർക്കാതെ അതിലെ സംഘർഷവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ നിഷ്ക്രിയപ്രയോഗവും പ്രവർത്തകനെ സംബന്ധിച്ച അവ്യക്തതയും സൂക്ഷിച്ചിട്ടുണ്ട്; രണ്ടു അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
