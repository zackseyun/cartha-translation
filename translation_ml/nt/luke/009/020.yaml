reference: Luke 9:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “എന്നാൽ നിങ്ങളോ—ഞാൻ ആരാണെന്നാണ് നിങ്ങൾ പറയുന്നത്?” പത്രോസ് മറുപടി പറഞ്ഞു: “ദൈവത്തിന്റെ മശീഹാ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദൈവത്തിന്റെ ക്രിസ്തു.”'
    reason: χριστός എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേരിന്റെ സുപരിചിതമായ പദപരമായ ബദൽ.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: നിങ്ങളോ
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം വ്യക്തമായി ചേർത്തിരിക്കുന്നത് ഊന്നലും മുമ്പുള്ള അഭിപ്രായങ്ങളോടുള്ള വ്യത്യാസവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘നിങ്ങളോ’ അത് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τίνα με λέγετε εἶναι
  choice: ഞാൻ ആരാണെന്നാണ് പറയുന്നത്
  rationale: λέγετε + εἶναι എന്ന പരോക്ഷവാക്യഘടനയുടെ അർഥവും ചോദ്യത്തിന്റെ വ്യക്തതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും പിന്നാലെയുള്ള സമാപികക്രിയയും മലയാളത്തിൽ ഒരു സ്വാഭാവിക ക്രിയാപദസമുച്ചയമായി നൽകിയിരിക്കുന്നു.
- source_word: χριστός
  choice: അഭിഷിക്തൻ
  rationale: χριστός ഇവിടെ യേശുവിനെ തിരിച്ചറിയിക്കുന്ന സ്ഥാനപ്പേരാണ്; അതിനാൽ പേരുപോലെ ലിപ്യന്തരണം ചെയ്യാതെ അതിന്റെ അടിസ്ഥാനാർഥമായ ‘അഭിഷിക്തൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിബന്ധം ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: δέ
  choice: അവൻ അവരോടു ചോദിച്ചു / എന്നാൽ
  rationale: ആദ്യത്തെ δέ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേക ബന്ധകമില്ലാതെ സ്വാഭാവികമായി നൽകി; ചോദ്യത്തിലെ δέ സൂചിപ്പിക്കുന്ന വ്യത്യാസം ‘എന്നാൽ’ എന്നും ‘നിങ്ങളോ’ എന്നും പ്രകടമാക്കി.
theological_decisions:
- issue: പത്രോസിന്റെ ഏറ്റുപറച്ചിലിലെ χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: അഭിഷിക്തൻ
  alternative: മശീഹാ; ക്രിസ്തു
  rationale: χριστός എന്നത് ‘അഭിഷിക്തൻ’ എന്നർഥമുള്ള സ്ഥാനപ്പേരാണ്; ഇവിടെ അത് ഇസ്രായേലിന്റെ മശീഹാ പ്രതീക്ഷയുടെ പശ്ചാത്തലത്തിൽ യേശുവിനെ തിരിച്ചറിയിക്കുന്നു. അതിനാൽ ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർക്കാതെ സ്ഥാനപ്പേരിന്റെ അർഥം മുഖ്യവാചകത്തിൽ നൽകി, സുപരിചിതമായ സമാനപദങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘നിങ്ങളോ’ എന്ന രൂപം ഗ്രീക്കിലെ ഊന്നലും വൈരുധ്യവും അമിതഭാരം കൂടാതെ സംരക്ഷിക്കുന്നു; ‘അഭിഷിക്തൻ’ സ്ഥാനപ്പേരിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് നേരിട്ട് ഗ്രഹിക്കാവുന്നവിധം നൽകുന്നു.
