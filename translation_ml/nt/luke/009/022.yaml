id: LUK.9.22
reference: Luke 9:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: ml
  text: 'ഇങ്ങനെ പറഞ്ഞു[a]: “മനുഷ്യപുത്രൻ അനേകം കഷ്ടങ്ങൾ അനുഭവിക്കുകയും മൂപ്പന്മാർ, മുഖ്യപുരോഹിതന്മാർ, ശാസ്ത്രിമാർ എന്നിവരാൽ തിരസ്കരിക്കപ്പെടുകയും കൊല്ലപ്പെടുകയും മൂന്നാം ദിവസം ഉയിർപ്പിക്കപ്പെടുകയും[b] ചെയ്യേണ്ടത് അനിവാര്യമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യപുത്രൻ അനേകം കഷ്ടങ്ങൾ അനുഭവിക്കേണ്ടിയിരിക്കുന്നു …”
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ കർമണിരൂപം: “ഉയിർപ്പിക്കപ്പെടുക.” മറ്റൊരു വിവർത്തനം: “ഉയിർത്തെഴുന്നേൽക്കുക.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰπὼν
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം തുടർന്നുവരുന്ന വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു. മുൻവിവരണത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കാനും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാനുമായി ‘ഇങ്ങനെ പറഞ്ഞു’ എന്നു നൽകി.
- source_word: Δεῖ
  choice: ചെയ്യേണ്ടത് അനിവാര്യമാണ്
  rationale: സൗകര്യമോ സാധ്യതയോ അല്ല, നിർബന്ധിതമായ ആവശ്യകതയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. വ്യക്തിപരമല്ലാത്ത ഗ്രീക്ക് ഘടനയും ദൈവിക പദ്ധതിയിലുള്ള അനിവാര്യതയും വ്യക്തമായ കർത്താവിനെ കൂട്ടിച്ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിലെ സ്ഥാപിതമായ സ്വയംവിശേഷണവും ശീർഷകവുമാണിത്; ദാനീയേൽ ഗ്രന്ഥത്തോടുള്ള അന്തർപാഠബന്ധവും മിശിഹാ-അന്ത്യകാല അനുരണനങ്ങളും നിലനിർത്തുന്നു.
- source_word: πολλὰ παθεῖν
  choice: അനേകം കഷ്ടങ്ങൾ അനുഭവിക്കുക
  rationale: നപുംസകലിംഗ ബഹുവചനമായ πολλὰ സൂചിപ്പിക്കുന്ന കഷ്ടാനുഭവങ്ങളുടെ വ്യാപ്തി ചുരുക്കാതെ പ്രകടമാക്കുന്നു.
- source_word: ἀποδοκιμασθῆναι
  choice: തിരസ്കരിക്കപ്പെടുക
  rationale: പരിശോധനയ്ക്കുശേഷമുള്ള നിരാകരണത്തിന്റെ ഭാവമുള്ള കർമണിപ്രയോഗം സ്വാഭാവികവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: മൂപ്പന്മാർ, മുഖ്യപുരോഹിതന്മാർ, ശാസ്ത്രിമാർ എന്നിവരാൽ
  rationale: കർമണിപ്രയോഗത്തോടൊപ്പമുള്ള ἀπό പ്രവർത്തകരെ സൂചിപ്പിക്കുന്നു; ‘എന്നിവരാൽ’ എന്നത് ഈ മൂന്നു നേതൃത്വവിഭാഗങ്ങളെയും തിരസ്കരണത്തിന്റെ പ്രവർത്തകരായി വ്യക്തമാക്കുന്നു.
- source_word: πρεσβυτέρων
  choice: മൂപ്പന്മാർ
  rationale: യഹൂദരുടെ അംഗീകൃത നേതൃത്വവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപനപരമായ പദം നിലനിർത്തുന്നു.
- source_word: ἀρχιερέων
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: രണ്ടാം ദേവാലയകാലത്തെ മുഖ്യപുരോഹിതവർഗത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന് യോജിച്ചതാണ്; ഒരേസമയം പല മഹാപുരോഹിതന്മാർ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: γραμματέων
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷങ്ങളിലെ തിരിച്ചറിയാവുന്ന വിഭാഗനാമം നിലനിർത്തുന്ന നേരിട്ടുള്ള സമാനപദമാണിത്; ‘നിയമോപദേഷ്ടാക്കൾ’ എന്ന വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: ἀποκτανθῆναι
  choice: കൊല്ലപ്പെടുക
  rationale: കർമണിപ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: മൂന്നാം ദിവസം
  rationale: കാലസൂചകമായ ഗ്രീക്ക് ദത്തിവിന്റെ സ്വാഭാവിക മലയാളരൂപവും പരിചിതമായ പുനരുത്ഥാനപ്രയോഗവുമാണ്.
- source_word: ἐγερθῆναι
  choice: ഉയിർപ്പിക്കപ്പെടുക
  rationale: ἐγείρω എന്ന ക്രിയയുടെ കർമണിരൂപം നിലനിർത്തുന്നു. പ്രവർത്തകനെ വാക്യത്തിൽ വ്യക്തമാക്കാതെ ദൈവിക പ്രവർത്തനത്തിന്റെ സൂചന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനക്രിയയുടെ കർമണിരൂപം
  choice: ഉയിർപ്പിക്കപ്പെടുക
  alternative: ഉയിർത്തെഴുന്നേൽക്കുക
  rationale: ഗ്രീക്കിൽ കർമണി അനന്തക്രിയയാണ്. ‘ഉയിർപ്പിക്കപ്പെടുക’ എന്നത് വാക്യത്തിൽ പറയാത്ത പ്രവർത്തകനെ ചേർക്കാതെ കർമണിരൂപവും ദൈവിക പ്രവർത്തനത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു.
- issue: Δεῖ എന്ന പദത്തിന്റെ ബലം
  choice: ചെയ്യേണ്ടത് അനിവാര്യമാണ്
  alternative: മനുഷ്യപുത്രൻ ... ചെയ്യണം
  rationale: ഗ്രീക്കിലെ വ്യക്തിപരമല്ലാത്ത ഘടനയും കഷ്ടാനുഭവം, തിരസ്കാരം, മരണം, ഉയിർപ്പിക്കൽ എന്നിവ ദൈവിക പദ്ധതിയിൽ അനിവാര്യമാണെന്ന ഭാവവും നിലനിർത്തുന്നു; ആ അനിവാര്യതയുടെ രീതി അധികമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സുവിശേഷപരമ്പരയിലെ സുപരിചിത സാങ്കേതികപദങ്ങളായ ‘മനുഷ്യപുത്രൻ’, ‘മുഖ്യപുരോഹിതന്മാർ’, ‘ശാസ്ത്രിമാർ’ എന്നിവ നിലനിർത്തി. നീണ്ട ഗ്രീക്ക് അനന്തക്രിയാശൃംഖല മലയാളത്തിൽ ‘അനുഭവിക്കുകയും … തിരസ്കരിക്കപ്പെടുകയും …’ എന്ന സമാന്തരഘടനയിലൂടെ വായനാസൗകര്യത്തോടെ പുനരാവിഷ്കരിച്ചു.
