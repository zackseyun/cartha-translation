id: LUK.9.28
reference: Luke 9:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: ml
  text: ഈ വാക്കുകൾക്കുശേഷം[a] ഏകദേശം എട്ടു ദിവസം[b] കഴിഞ്ഞപ്പോൾ, അവൻ പത്രോസിനെയും യോഹന്നാനെയും യാക്കോബിനെയും കൂട്ടിക്കൊണ്ട് പ്രാർഥിക്കാനായി മലയിലേക്കു കയറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ പറഞ്ഞ കാര്യങ്ങൾക്കുശേഷം.’ ഇവിടെ ഗ്രീക്ക് λόγους എന്ന പദം ‘വാക്കുകൾ’ എന്നോ ‘പറഞ്ഞ കാര്യങ്ങൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ഏകദേശം എട്ടു ദിവസം’; ὡσεὶ എന്ന പദം സമയം ഏകദേശമാണെന്നു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആഖ്യാന-സംക്രമണ സ്വഭാവം മലയാളത്തിലെ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യത്തിൽ ഉൾപ്പെടുത്തി; ഉറവിടത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ എന്ന പദം ചേർത്തിട്ടില്ല.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: ഈ വാക്കുകൾക്കുശേഷം
  rationale: λόγους തൊട്ടുമുമ്പുള്ള യേശുവിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്നു. ‘വാക്കുകൾ’ എന്നത് ഗ്രീക്കിനോട് അടുത്തതും ആധുനിക മലയാളത്തിൽ വ്യക്തവുമാണ്; ‘പറഞ്ഞ കാര്യങ്ങൾ’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: ഏകദേശം എട്ടു ദിവസം
  rationale: ὡσεὶ സമയത്തെ ഏകദേശമായി സൂചിപ്പിക്കുന്നതിനാൽ സംഖ്യയെ കൃത്യമാക്കി മാറ്റാതെ ‘ഏകദേശം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: παραλαβὼν
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: പ്രധാനക്രിയയോടൊപ്പമുള്ള പങ്കാളിത്തക്രിയയായി, പത്രോസ്, യോഹന്നാൻ, യാക്കോബ് എന്നിവർ അവനോടൊപ്പം പോയെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: പത്രോസിനെയും യോഹന്നാനെയും യാക്കോബിനെയും
  rationale: പേരുകളുടെ പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചു; ആവർത്തിച്ച καί-ന്റെ താളം ‘-നെയും’ എന്ന സമാന്തര ഘടനയിൽ നിലനിർത്തി.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: മലയിലേക്കു കയറി
  rationale: ἀνέβη സൂചിപ്പിക്കുന്ന മുകളിലേക്കുള്ള ചലനവും εἰς τὸ ὄρος സൂചിപ്പിക്കുന്ന ലക്ഷ്യവും നിലനിർത്തുന്നു; കൊടുമുടിവരെ എത്തിയെന്ന് അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: προσεύξασθαι
  choice: പ്രാർഥിക്കാനായി
  rationale: ഇൻഫിനിറ്റീവ് സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: സമാന്തര സുവിശേഷവിവരണങ്ങളുമായി ബന്ധപ്പെട്ട കാലക്രമത്തിലെ ഏകദേശത
  choice: ഏകദേശം എട്ടു ദിവസം
  alternative: എട്ടു ദിവസം
  rationale: ലൂക്കോസിന്റെ ὡσεὶ ഏകദേശത വ്യക്തമായി സൂചിപ്പിക്കുന്നു. മറ്റു സുവിശേഷങ്ങളുമായി സമന്വയിപ്പിക്കുകയോ സംഖ്യയെ കൃത്യമാക്കുകയോ ചെയ്യാതെ ഉറവിടത്തിലെ വ്യത്യാസവും സാധ്യതയുള്ള സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ കാലസൂചക ഉപവാക്യമായി പുനഃക്രമീകരിച്ചിരിക്കുന്നു; എന്നാൽ പ്രധാന ലെക്സിക്കൽ വിവരവും ഏകദേശ കാലസൂചനയും നിലനിർത്തിയിട്ടുണ്ട്.
