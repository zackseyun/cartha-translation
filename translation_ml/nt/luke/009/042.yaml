id: LUK.9.42
reference: Luke 9:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: ml
  text: അവൻ അടുത്തുവന്നുകൊണ്ടിരിക്കുമ്പോൾ, ഭൂതം അവനെ നിലത്തുവീഴ്ത്തി കോച്ചിവലിപ്പിച്ചു. എന്നാൽ യേശു അശുദ്ധാത്മാവിനെ ശാസിച്ചു, ബാലനെ സൗഖ്യമാക്കി, അവനെ പിതാവിന് തിരികെ ഏൽപ്പിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ പിതാവിന് മടക്കി നൽകി.’
    reason: ἀπέδωκεν എന്ന ക്രിയയുടെ ‘തിരികെ നൽകുക’ എന്ന അടുത്ത അർഥവികൽപ്പം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: അവൻ അടുത്തുവരികയായിരിക്കുമ്പോൾത്തന്നെ
  rationale: വർത്തമാനകാല കൃദന്തരൂപമുള്ള genitive absolute ഒരേസമയം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ἔτιയുടെ ‘അപ്പോഴും/ഇപ്പോഴും തുടരുന്ന’ ഭാവം ‘-യായിരിക്കുമ്പോൾത്തന്നെ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു. ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: ἔρρηξεν αὐτὸν
  choice: അവനെ നിലത്തുവീഴ്ത്തി
  rationale: ഇവിടെ ῥήγνυμι ഭൂതം ബാലനെ അക്രമാസക്തമായി താഴെയിടുന്നതിനെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘കീറി’ എന്നതിനെക്കാൾ സന്ദർഭോചിതവും വ്യക്തവുമാണ് ഈ പ്രയോഗം.
- source_word: τὸ δαιμόνιον
  choice: ഭൂതം
  rationale: δαιμόνιον സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ ദുഷ്ടാത്മസത്തയെ സാധാരണ ആധുനിക മലയാളത്തിൽ നേരിട്ട് വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള πνεῦμα ἀκάθαρτον എന്ന വ്യത്യസ്ത പദപ്രയോഗവും വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: συνεσπάραξεν
  choice: കോച്ചിവലിപ്പിച്ചു
  rationale: ശക്തമായ ശരീരകോച്ചലുകളും വലിവുകളും ഉണ്ടാക്കുക എന്ന ക്രിയയുടെ അർഥം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπετίμησεν
  choice: ശാസിച്ചു
  rationale: അധികാരത്തോടെ വിലക്കുകയോ കർശനമായി കല്പിക്കുകയോ ചെയ്യുന്ന സുവിശേഷങ്ങളിലെ പ്രയോഗം സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും പകരുന്നു.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: അശുദ്ധാത്മാവിനെ
  rationale: ‘അശുദ്ധമായ ആത്മാവ്’ എന്ന ഗ്രീക്ക് വിശേഷണപ്രയോഗത്തിന്റെ നൈതികവും ആചാരപരവുമായ അശുദ്ധതാഭാവം പരമ്പരാഗതവും വ്യക്തവുമായ രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἰάσατο τὸν παῖδα
  choice: ബാലനെ സുഖപ്പെടുത്തി
  rationale: ἰάομαιയുടെ രോഗശാന്തി/സൗഖ്യപ്പെടുത്തൽ അർഥം സംരക്ഷിക്കുന്നു; παῖς ഇവിടെ പ്രായം കുറഞ്ഞ ആൺകുട്ടിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ബാലൻ’ തിരഞ്ഞെടുത്തു, ‘മകൻ’ എന്ന ബന്ധപദം അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: അവനെ പിതാവിന് തിരികെ ഏൽപ്പിച്ചു
  rationale: ἀποδίδωμι ഇവിടെ തിരികെ നൽകുക/പുനഃസ്ഥാപിക്കുക എന്ന അർഥത്തിലാണ്; വിടുതലിനുശേഷം ബാലനെ പിതാവിന് ഏൽപ്പിക്കുന്ന പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഭൂതബാധയെ വിവരിക്കുന്ന ഭാഷ
  choice: δαιμόνιον, πνεῦμα ἀκάθαρτον എന്നിവ യഥാക്രമം ‘ഭൂതം’, ‘അശുദ്ധാത്മാവ്’ എന്ന വ്യക്തിപരമായ ആത്മസത്തയെ സൂചിപ്പിക്കുന്ന പദങ്ങളായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദുഷ്ടശക്തി’ എന്ന അമൂർത്ത പ്രയോഗമോ മാനസിക/ശാരീരിക രോഗാവസ്ഥ മാത്രമായി വ്യാഖ്യാനിക്കുന്ന ഭാഷയോ ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം പ്രവർത്തിക്കുന്ന ഒരു വ്യക്തിപരമായ ഭൂതത്തെയും അതിനെ അശുദ്ധാത്മാവായി വിശേഷിപ്പിക്കുന്നതെയും അവതരിപ്പിക്കുന്നു. അതിനെ വെറും അമൂർത്ത ശക്തിയായോ സ്വാഭാവിക രോഗമായോ മാറ്റാതെ മൂലപാഠത്തിന്റെ അവതരണം നിലനിർത്തുന്നു. അതേസമയം ἰάσατο എന്നതനുസരിച്ച് യേശു ബാലനെ ‘സുഖപ്പെടുത്തി’ എന്നും പറഞ്ഞ് വിടുതലിന്റെയും സൗഖ്യത്തിന്റെയും വശങ്ങൾ രണ്ടും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. അമിത സംസ്കൃതവത്കരണവും അതിപുരാതന ക്രിയാരൂപങ്ങളും ഒഴിവാക്കി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ [a] ചിഹ്നം തെറ്റായി ‘coming near’ എന്ന ഭാഗത്തിനു പിന്നാലെയുണ്ടെങ്കിലും, അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം ἀπέδωκεν എന്ന അവസാന ക്രിയയോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്; അതിനാൽ അർഥപരമായി ശരിയായ സ്ഥാനമായ ‘തിരികെ ഏൽപ്പിച്ചു’ എന്നതിനു ശേഷം ചിഹ്നം ചേർത്തു.
