id: LUK.9.61
reference: Luke 9:61
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: ml
  text: 'മറ്റൊരാളും പറഞ്ഞു: “കർത്താവേ, ഞാൻ അങ്ങയെ അനുഗമിക്കും; എന്നാൽ ആദ്യം എന്റെ വീട്ടിലുള്ളവരോടു യാത്രപറയാൻ എന്നെ അനുവദിക്കണമേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: മറ്റൊരാൾ
  rationale: മുമ്പ് സംസാരിച്ചവരിൽനിന്നു വ്യത്യസ്തനായ ഒരാളെക്കൂടി പരിചയപ്പെടുത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: Ἀκολουθήσω σοι
  choice: ഞാൻ അങ്ങയെ അനുഗമിക്കാം
  rationale: ഭാവികാലരൂപം സംസാരിക്കുന്നയാളുടെ സന്നദ്ധതയും ഉദ്ദേശ്യവും പ്രകടിപ്പിക്കുന്നു. ആദരസൂചകമായ ‘അങ്ങയെ’ നേരിട്ടുള്ള അഭിസംബോധനയ്ക്കു യോജിക്കുന്നു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള ആദരവും പദത്തിനുണ്ടാകാവുന്ന കൂടുതൽ ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു; അതിനെ വെറും ‘യജമാനനേ’ എന്നോ ‘സാർ’ എന്നോ ചുരുക്കുന്നില്ല.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: മുൻഗണനയെയോ അതിനു മുമ്പ് ചെയ്യേണ്ട കാര്യത്തെയോ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ἐπίτρεψόν μοι
  choice: എന്നെ അനുവദിക്കണമേ
  rationale: അനുമതി അഭ്യർഥിക്കുന്ന ആജ്ഞാരൂപത്തിന്റെ വിനീതഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀποτάξασθαι
  choice: യാത്രപറയാൻ
  rationale: ഈ സന്ദർഭത്തിൽ ആളുകളോടു വിടപറഞ്ഞ് പിരിയുക എന്ന അർഥം നൽകുന്ന പ്രചാരമുള്ള മലയാളപ്രയോഗം.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: എന്റെ വീട്ടിലുള്ളവരോട്
  rationale: അക്ഷരാർഥത്തിലെ അസാധാരണമായ ദിശാസൂചന പകർത്താതെ, വീട്ടിൽ ഉള്ളവരെയോ വീട്ടുമായി ബന്ധപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ആവശ്യത്തിന് വിശാലവുമായ പ്രയോഗം.
- source_word: δὲ καὶ
  choice: മറ്റൊരാളും പറഞ്ഞു
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-ഉം’ മുഖേന നൽകുന്നു; δέ ഇവിടെ സംഭാഷണത്തിന്റെ തുടർച്ചയിൽ നേരിയ ബന്ധം സ്ഥാപിക്കുന്നതിനാൽ മലയാളത്തിൽ വേറെ ബന്ധപദം നിർബന്ധമല്ല.
theological_decisions:
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριε എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ
  rationale: ‘കർത്താവേ’ എന്നത് ആദരപൂർവമായ അഭിസംബോധനയും സാധ്യമായ ദൈവശാസ്ത്രപരമായ സൂചനയും ഒരുമിച്ചു നിലനിർത്തുന്നു; സംസാരിക്കുന്നയാളുടെ ഗ്രഹണം എത്ര ആഴമുള്ളതായിരുന്നു എന്ന് പരിഭാഷ മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന ആദരപൂർവമായ മലയാളം. ‘അങ്ങയെ’, ‘അനുവദിക്കണമേ’ എന്നിവ നേരിട്ടുള്ള അഭിസംബോധനയുടെ വിനീതത നിലനിർത്തുന്നു. ഈ വാക്യത്തിൽ പ്രസിദ്ധീകരണത്തിന് അനിവാര്യമായ പാഠഭേദമോ അർഥവ്യത്യാസമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
