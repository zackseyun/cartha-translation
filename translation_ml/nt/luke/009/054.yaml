revisions:
- from: 'ഇതു കണ്ടപ്പോൾ ശിഷ്യന്മാരായ യാക്കോബും യോഹന്നാനും പറഞ്ഞു: “കർത്താവേ, ആകാശത്തുനിന്ന് തീ ഇറങ്ങിവന്ന് അവരെ ദഹിപ്പിക്കണമെന്ന് ഞങ്ങൾ കല്പിക്കണമെന്നാണോ[a] അങ്ങ് ആഗ്രഹിക്കുന്നത്?”'
  to: 'ഇതു കണ്ടപ്പോൾ ശിഷ്യന്മാരായ യാക്കോബും യോഹന്നാനും പറഞ്ഞു: “കർത്താവേ, ആകാശത്തുനിന്ന് തീ ഇറങ്ങി അവരെ ദഹിപ്പിക്കട്ടെ എന്നു ഞങ്ങൾ പറയണമെന്നാണോ അങ്ങ് ആഗ്രഹിക്കുന്നത്?”'
  rationale: The revision restores the lexical force of εἴπωμεν as ‘say’ while retaining the request’s force through the quoted optative-like Malayalam formulation “തീ ഇറങ്ങി … ദഹിപ്പിക്കട്ടെ എന്നു.” It also supplies a complete, accurately scoped footnote alternative. No disputed textual material is introduced.
