id: LUK.9.54
reference: Luke 9:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: ml
  text: 'ഇതു കണ്ടപ്പോൾ ശിഷ്യന്മാരായ യാക്കോബും യോഹന്നാനും പറഞ്ഞു: “കർത്താവേ, ആകാശത്തുനിന്ന് തീ ഇറങ്ങി അവരെ ദഹിപ്പിക്കട്ടെ എന്നു ഞങ്ങൾ പറയണമെന്നാണോ അങ്ങ് ആഗ്രഹിക്കുന്നത്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: ഇതു കണ്ടപ്പോൾ
  rationale: കാലസൂചകമായ എയോറിസ്റ്റ് കൃദന്തത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. ‘ഇതു’ എന്നത് മുൻവാക്യത്തിലെ ശമര്യരുടെ നിരസനത്തെ സൂചിപ്പിക്കുന്ന, സന്ദർഭത്തിൽനിന്നുള്ള പൂരിപ്പിക്കലാണ്.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: ശിഷ്യന്മാരായ യാക്കോബും യോഹന്നാനും
  rationale: യാക്കോബിനെയും യോഹന്നാനെയും ശിഷ്യന്മാരായി തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള നേരിട്ടുള്ള സംബോധനയിൽ κύριε എന്നതിന്റെ പതിവും സന്ദർഭോചിതവുമായ പരിഭാഷ.
- source_word: θέλεις
  choice: അങ്ങ് ആഗ്രഹിക്കുന്നത്
  rationale: θέλω ഇവിടെ ആഗ്രഹമോ ഉദ്ദേശ്യമോ പ്രകടിപ്പിക്കുന്നു. ആദരസൂചകമായ ‘അങ്ങ്’ നേരിട്ടുള്ള സംബോധനയ്ക്ക് യോജിക്കുന്നു.
- source_word: εἴπωμεν
  choice: ഞങ്ങൾ കല്പിക്കണമെന്ന്
  rationale: λέγω എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘പറയുക’ ആണെങ്കിലും, തീ ഇറങ്ങിവരണമെന്ന് പറയുന്ന ഈ ഘടനയിൽ ഉദ്ദേശിക്കപ്പെടുന്ന ആജ്ഞാർഥശക്തി സ്വാഭാവിക മലയാളത്തിൽ ‘കല്പിക്കുക’ എന്നു വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: ആകാശത്തുനിന്ന് തീ ഇറങ്ങിവന്ന്
  rationale: വിധിന്യായത്തിന്റെ ദൃശ്യബിംബവും ദിശാസൂചനയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ἀναλῶσαι
  choice: ദഹിപ്പിക്കുക
  rationale: തീയുമായി ബന്ധപ്പെട്ട ‘consume’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; പൊതുവായ ‘നശിപ്പിക്കുക’ എന്നതിനെക്കാൾ ദൃശ്യബിംബം വ്യക്തമാണ്.
- source_word: αὐτούς
  choice: അവരെ
  rationale: മുൻസന്ദർഭത്തിലെ ശമര്യഗ്രാമവാസികളെ സൂചിപ്പിക്കുന്ന ബഹുവചന കർമരൂപം.
theological_decisions:
- issue: ‘കണ്ടു’ എന്ന ക്രിയയുടെ സൂചിത കർമം
  choice: മുൻവാക്യത്തിലെ നിരസനത്തെ സൂചിപ്പിക്കാൻ ‘ഇതു’ ചേർത്തു.
  alternative: ‘കണ്ടപ്പോൾ’ എന്നുമാത്രം പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ കർമപദമില്ലെങ്കിലും, മലയാളത്തിൽ ആഖ്യാനബന്ധം സ്വാഭാവികവും വ്യക്തവുമായി വരാൻ സന്ദർഭത്തിൽനിന്ന് ‘ഇതു’ പൂരിപ്പിക്കുന്നു; പുതിയ ആശയം ചേർക്കുന്നില്ല.
- issue: ശിഷ്യന്മാരുടെ നിർദേശത്തിന്റെ ശക്തി
  choice: εἴπωμεν എന്നത് മുഖ്യവാചകത്തിൽ ‘ഞങ്ങൾ കല്പിക്കണമെന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തീ ഇറങ്ങിവരട്ടെ എന്നു ഞങ്ങൾ പറയണമെന്ന്’ അല്ലെങ്കിൽ ‘ആകാശത്തുനിന്ന് തീ വിളിച്ചിറക്കണമെന്ന്’.
  rationale: മൂലക്രിയ λέγω ആയതിനാൽ ‘പറയുക’ എന്ന അക്ഷരാർഥം നിലനിൽക്കുന്നു; എന്നാൽ തീ ഇറങ്ങിവരാനുള്ള ഫലപ്രദമായ വാക്ക് ഉദ്ദേശിക്കുന്നതിനാൽ ‘കല്പിക്കുക’ സ്വാഭാവിക മലയാളത്തിൽ സന്ദർഭശക്തി നൽകുന്നു. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കർത്താവേ’, ‘അങ്ങ്’ എന്നിവ നേരിട്ടുള്ള സംബോധനയുടെ മാന്യത നിലനിർത്തുന്നു; ‘ദഹിപ്പിക്കുക’ തീയുടെ ദൃശ്യബിംബം സംരക്ഷിക്കുന്നു.
