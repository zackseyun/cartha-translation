- from: അവൻ പ്രാർഥിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അവന്റെ മുഖത്തിന്റെ രൂപം വ്യത്യസ്തമായി[a]; അവന്റെ വസ്ത്രം മിന്നൽപോലെ തിളങ്ങുന്ന വെളുപ്പായി[b].
