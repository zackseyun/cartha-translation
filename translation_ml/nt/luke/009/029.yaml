id: LUK.9.29
reference: Luke 9:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: ml
  text: അവൻ പ്രാർഥിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അവന്റെ മുഖത്തിന്റെ രൂപം മറ്റൊന്നായി[a]; അവന്റെ വസ്ത്രം വെളുത്തതും മിന്നൽപോലെ മിന്നുന്നതുമായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ മുഖത്തിന്റെ രൂപം മാറി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവന്റെ വസ്ത്രം വെളുത്തതും ദീപ്തമായതുമായി’; ഗ്രീക്കിലെ കൃദന്തരൂപം മിന്നൽപോലെയുള്ള മിന്നിത്തിളങ്ങലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: അവൻ പ്രാർഥിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ലൂക്കോസിന്റെ ഈ പ്രയോഗം, അവൻ പ്രാർഥിക്കുന്നതിനിടയിൽ സംഭവിച്ച കാര്യം അവതരിപ്പിക്കുന്നു. ‘സംഭവിച്ചു’ എന്നു യാന്ത്രികമായി ചേർക്കാതെ സമയബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ
  choice: അവന്റെ മുഖത്തിന്റെ രൂപം
  rationale: εἶδος ഇവിടെ ദൃശ്യമായ രൂപത്തെയോ കാഴ്ചയെയോ സൂചിപ്പിക്കുന്നു; πρόσωπον എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘മുഖം’ ആണ്. ‘മുഖഭാവം’ എന്നു പറഞ്ഞാൽ വികാരപ്രകടനം മാത്രമായി തെറ്റിദ്ധരിക്കപ്പെടാം.
- source_word: ἕτερον
  choice: വ്യത്യസ്തമായി
  rationale: ἕτερον എന്നതിന്റെ ‘വേറിട്ടത്/വ്യത്യസ്തമായത്’ എന്ന അർഥം നിലനിർത്തുന്നു; സമാന്തര സുവിശേഷങ്ങളിലെ കൂടുതൽ വ്യക്തമായ ഭാഷ ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: അവന്റെ വസ്ത്രം
  rationale: ἱματισμός വസ്ത്രധാരണത്തെ സൂചിപ്പിക്കുന്നു. ഏകവചനമായ ‘വസ്ത്രം’ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: λευκὸς
  choice: വെളുപ്പായി
  rationale: λευκός എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘വെളുപ്പ്’ നിലനിർത്തുന്നു; പ്രകാശതീവ്രത തുടർന്നുള്ള കൃദന്തരൂപത്തിലൂടെ അറിയിക്കുന്നു.
- source_word: ἐξαστράπτων
  choice: മിന്നൽപോലെ തിളങ്ങുന്ന
  rationale: ഈ പദം മിന്നലിന്റെ ദീപ്തമായ മിന്നിച്ചത്തെ ഉണർത്തുന്നു. ‘തിളങ്ങുന്ന’ എന്ന പൊതുവായ പ്രയോഗത്തേക്കാൾ ഉറവിടത്തിലെ സജീവ ദൃശ്യബിംബം ഇതിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ രൂപാന്തരത്തിന്റെ വിവരണം
  choice: മുഖത്തിന്റെ ദൃശ്യരൂപം വ്യത്യസ്തമായി എന്നു ലൂക്കോസിന്റെ മിതമായ ഭാഷയിൽ അവതരിപ്പിച്ചു.
  alternative: അവന്റെ മുഖം പ്രകാശിച്ചു; അവന്റെ മുഖം രൂപാന്തരപ്പെട്ടു.
  rationale: വാക്യം യഥാർഥമായ ദൃശ്യവ്യതിയാനം വിവരിക്കുന്നുവെങ്കിലും മത്തായിയുടെ ‘പ്രകാശിച്ചു’ എന്ന ഭാഷ ഉപയോഗിക്കുന്നില്ല. അതിനാൽ സമാന്തരവിവരണങ്ങളുമായി ഒത്തുചേർക്കാതെ ലൂക്കോസിന്റെ പ്രത്യേക പദപ്രയോഗം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മുഖഭാവം’ പോലുള്ള അർഥം ചുരുക്കുന്ന പദവും പഴയ ‘വദനം/വസ്ത്രാലങ്കാരം’ പോലുള്ള പ്രയോഗങ്ങളും ഒഴിവാക്കി. ഉറവിടത്തിലെ മിന്നൽബിംബവും ലൂക്കോസിന്റെ മിതമായ രൂപാന്തരവിവരണവും സംരക്ഷിച്ചു.
