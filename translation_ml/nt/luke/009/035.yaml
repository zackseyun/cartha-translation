reference: Luke 9:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: ml
  text: 'മേഘത്തിൽനിന്ന് ഒരു ശബ്ദം വന്നു: “ഇവൻ എന്റെ പുത്രൻ, തിരഞ്ഞെടുക്കപ്പെട്ടവൻ; ഇവനെ കേൾക്കുവിൻ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “എന്റെ പുത്രൻ, തിരഞ്ഞെടുക്കപ്പെട്ടവൻ” എന്നതിനുപകരം “എന്റെ പ്രിയപുത്രൻ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: ഒരു ശബ്ദം ഉണ്ടായി
  rationale: ശബ്ദം സംഭവിച്ചതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഒരു ശബ്ദം ഉണ്ടായി’ എന്ന് നൽകി.
- source_word: ἐκ τῆς νεφέλης
  choice: മേഘത്തിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം/ഉത്ഭവം കൃത്യമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: Οὗτός ἐστιν ὁ υἱός μου
  choice: ഇവൻ എന്റെ പുത്രൻ
  rationale: തിരിച്ചറിയൽ പ്രഖ്യാപനത്തിന്റെ ബലം നിലനിർത്തുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം.
- source_word: ὁ ἐκλελεγμένος
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവൻ
  rationale: ἐκλέγομαι എന്ന ക്രിയയുടെ perfect passive participle ആയതിനാൽ ‘തിരഞ്ഞെടുക്കപ്പെട്ടവൻ’ എന്ന് നൽകി; ഗ്രീക്കിൽ ഇവിടെ രണ്ടാമത്തെ ഉടമസ്ഥസർവനാമം ഇല്ലാത്തതിനാൽ ‘എന്റെ തിരഞ്ഞെടുക്കപ്പെട്ടവൻ’ എന്നു ചേർത്തില്ല.
- source_word: αὐτοῦ ἀκούετε
  choice: ഇവന്റെ വാക്കു കേൾക്കുവിൻ
  rationale: ഇവിടെ ἀκούω വെറും ശബ്ദം കേൾക്കുക എന്നതിലുപരി ശ്രദ്ധിച്ചു കേട്ട് അനുസരിക്കുക എന്ന ആജ്ഞാഭാവം വഹിക്കുന്നു; മലയാളത്തിൽ ‘വാക്കു കേൾക്കുക’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: സ്വർഗീയ ശബ്ദത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ വിശേഷണത്തിന്റെ പാഠഭേദം
  choice: ἐκλελεγμένος എന്ന പാഠം ‘തിരഞ്ഞെടുക്കപ്പെട്ടവൻ’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ചില കൈയെഴുത്തുപ്രതികളിലെ ἀγαπητός എന്ന പാഠം ‘പ്രിയപുത്രൻ’ എന്ന് നൽകാം.
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തെ പിന്തുടർന്ന് ലൂക്കോസിന്റെ വ്യത്യസ്തമായ പദപ്രയോഗം നിലനിർത്തി; സമാന്തര സുവിശേഷങ്ങളിലെ കൂടുതൽ പരിചിതമായ ‘പ്രിയപുത്രൻ’ എന്ന വായനയുമായി സമന്വയിപ്പിച്ചില്ല. പാഠഭേദം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. ‘കേൾക്കുവിൻ’ എന്ന ബഹുവചന ആജ്ഞാരൂപം ശിഷ്യന്മാരോടുള്ള കല്പനയുടെ ബലം നിലനിർത്തുന്നു; അത്യന്തം പുരാതനമോ ദുഷ്കരമോ ആയ പദാവലി ഒഴിവാക്കി.
