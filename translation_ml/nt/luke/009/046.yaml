id: LUK.9.46
reference: Luke 9:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: ml
  text: അവരിൽ ആരായിരിക്കും ഏറ്റവും വലിയവൻ എന്നതിനെക്കുറിച്ച് അവർക്കിടയിൽ ഒരു തർക്കം ഉണ്ടായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരിൽ ഒരു ചിന്ത ഉദിച്ചു” അല്ലെങ്കിൽ “അവർക്കിടയിൽ ഒരു ചർച്ച ഉണ്ടായി.”
    reason: διαλογισμός എന്ന പദത്തിന് ഉള്ളിലെ ചിന്തയെയും പരസ്പര ചർച്ചയെയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ ഈ യഥാർഥ അർഥവൈവിധ്യം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: ഉണ്ടായി
  rationale: പദാനുപദമായി ‘പ്രവേശിച്ചു’ എന്നാണെങ്കിലും, διαλογισμός എന്ന നാമത്തോടൊപ്പം ഒരു ചിന്തയോ ചർച്ചയോ ഉദിച്ചതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘ഉണ്ടായി’ എന്നു നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇത് നേരിയ ആഖ്യാനബന്ധകമാണ്. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അസ്വാഭാവികമായ ‘അപ്പോൾ’ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: διαλογισμὸς
  choice: തർക്കം
  rationale: ഈ പദത്തിന് ഉള്ളിലെ ചിന്ത, ആലോചന, ചർച്ച, വാദം എന്നീ അർഥസാധ്യതകളുണ്ട്. ആരാണ് വലിയവൻ എന്ന മത്സരാത്മകമായ സന്ദർഭത്തിൽ ‘തർക്കം’ പരസ്പരവിരോധത്തിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν αὐτοῖς
  choice: അവർക്കിടയിൽ
  rationale: പദാനുപദമായി ‘അവരിൽ’ എന്നാകാമെങ്കിലും, ശിഷ്യരുടെ കൂട്ടത്തിനുള്ളിൽ നടന്ന പരസ്പര തർക്കം എന്ന മുഖ്യവായന മലയാളത്തിൽ ‘അവർക്കിടയിൽ’ എന്നു വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: τὸ τίς ἂν εἴη
  choice: ആരായിരിക്കും ... എന്നതിനെക്കുറിച്ച്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പരോക്ഷചോദ്യം തർക്കത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. ‘ആരായിരിക്കും’ എന്നത് ἄν സഹിതമുള്ള optative-ന്റെ സാധ്യതാഭാവം നിലനിർത്തുന്നു.
- source_word: μείζων
  choice: ഏറ്റവും വലിയവൻ
  rationale: ഗ്രീക്കിൽ താരതമ്യരൂപമായ ‘വലിയവൻ’ ആണെങ്കിലും, ഒരു നിർദിഷ്ട കൂട്ടത്തിലെ പരമസ്ഥാനത്തെക്കുറിച്ചുള്ള ചോദ്യം മലയാളത്തിൽ ‘ഏറ്റവും വലിയവൻ’ എന്നു സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: αὐτῶν
  choice: അവരിൽ
  rationale: താരതമ്യം നടക്കുന്ന നിർദിഷ്ട കൂട്ടത്തെ ഈ ജനിറ്റീവ് സൂചിപ്പിക്കുന്നു; ‘അവരിൽ’ അത് നേരിട്ട് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യരുടെ ഇടപെടലിന്റെ സ്വഭാവം
  choice: തർക്കം
  alternative: ചിന്ത / ആലോചന / ചർച്ച
  rationale: ആരാണ് ഏറ്റവും വലിയവൻ എന്ന മത്സരാത്മകമായ ചോദ്യം പരസ്പര തർക്കത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു. എങ്കിലും διαλογισμός എന്ന പദവും ἐν αὐτοῖς എന്ന പ്രയോഗവും ഉള്ളിലെ ആലോചനയെയോ പൊതുചർച്ചയെയോ അനുവദിക്കുന്നതിനാൽ ആ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ആരായിരിക്കും’ സാധ്യതാഭാവവും ‘ഏറ്റവും വലിയവൻ’ കൂട്ടത്തിനുള്ളിലെ പദവിതാരതമ്യവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
