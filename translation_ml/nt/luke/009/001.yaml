  to: അവൻ പന്ത്രണ്ടുപേരെയും വിളിച്ചുകൂട്ടി[a], സകല ഭൂതങ്ങളുടെയുംമേൽ ശക്തിയും അധികാരവും പ്രയോഗിക്കാനും രോഗങ്ങൾ ഭേദമാക്കാനും അവർക്കു നൽകി.[b]
  rationale: ‘ശക്തിയും അധികാരവും പ്രയോഗിക്കാനും’ എന്നു മാറ്റിയതിലൂടെ ἐπὶ πάντα τὰ δαιμόνια എന്ന വാക്യഭാഗം δύναμιν, ἐξουσίαν എന്നീ ഇരുപദങ്ങൾക്കും ഒരുപോലെ ബാധകമാണെന്ന് വ്യക്തമായി. ‘രോഗങ്ങൾ ഭേദമാക്കാനും’ ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്. പാദക്കുറിപ്പ് b-യുടെ അടയാളം വാക്യാവസാനത്തേക്കു മാറ്റിയെങ്കിലും അതിന്റെ ഉള്ളടക്കം ‘സകല ഭൂതങ്ങളുടെയുംമേൽ’ എന്ന പ്രയോഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
