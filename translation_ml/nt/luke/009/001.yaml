id: LUK.9.1
reference: Luke 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: ml
  text: അവൻ പന്ത്രണ്ടുപേരെയും വിളിച്ചുകൂട്ടി[a], സകല ഭൂതങ്ങളുടെയുംമേൽ ശക്തിയും അധികാരവും പ്രയോഗിക്കാനും രോഗങ്ങൾ ഭേദമാക്കാനും അവർക്കു നൽകി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പന്ത്രണ്ടുപേരെയും വിളിച്ചുകൂട്ടിയശേഷം.’
    reason: കൃദന്തത്തിന് മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെന്ന ബന്ധം കൂടുതൽ വ്യക്തമായി നൽകാവുന്ന പരിഭാഷാന്തരം.
  - marker: b
    text: അഥവാ, ‘ഓരോ ഭൂതത്തിന്റെയുംമേൽ.’
    reason: πάντα τὰ δαιμόνια എന്നത് ‘സകല ഭൂതങ്ങളുടെയുംമേൽ’ എന്നും വിതരണാർഥത്തിൽ ‘ഓരോ ഭൂതത്തിന്റെയുംമേൽ’ എന്നും സ്വാഭാവികമായി അവതരിപ്പിക്കാം.
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: വിളിച്ചുകൂട്ടി
  rationale: ആയോറിസ്റ്റ് മധ്യകർത്തരി കൃദന്തത്തിന്റെ മുൻകൃത്യബന്ധം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു. ‘വിളിച്ചുകൂട്ടുക’ എന്നത് συν- ഉപസർഗത്തിലെ ഒരുമിച്ചുകൂട്ടൽഭാവവും ഉൾക്കൊള്ളുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിലെ വാക്യത്തുടർച്ചയിൽ അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള വിപരീതഭാവം ചേർത്തിട്ടില്ല.
- source_word: τοὺς δώδεκα
  choice: പന്ത്രണ്ടുപേരെ
  rationale: മൂലപാഠത്തിലുള്ള ‘പന്ത്രണ്ടുപേർ’ എന്ന സൂചന മാത്രം നിലനിർത്തി; ഇവിടെ വ്യക്തമല്ലാത്ത ‘ശിഷ്യന്മാർ’ അല്ലെങ്കിൽ ‘അപ്പൊസ്തലന്മാർ’ ചേർത്തിട്ടില്ല.
- source_word: ἔδωκεν
  choice: നൽകി
  rationale: δίδωμι എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുമുള്ള മലയാള തുല്യപദം.
- source_word: δύναμιν
  choice: ശക്തി
  rationale: പ്രവർത്തിക്കാനുള്ള പ്രാപ്തിയെയോ ശേഷിയെയോ സൂചിപ്പിക്കുന്ന δύναμις എന്ന പദത്തെ ἐξουσίαയിൽനിന്ന് വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: അധികാരപ്പെട്ട അവകാശത്തെയോ നിയോഗിക്കപ്പെട്ട അധികാരത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ശക്തി’യുമായി ലയിപ്പിച്ചിട്ടില്ല.
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: സകല ഭൂതങ്ങളുടെയുംമേൽ അധികാരം ചെലുത്താൻ
  rationale: ἐπί സഹിതമുള്ള പ്രയോഗത്തിലെ അധീശത്വബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. πάντα τὰ δαιμόνια എന്ന ബഹുവചനത്തിന്റെ സമഗ്രത ‘സകല’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: δαιμόνια
  choice: ഭൂതങ്ങൾ
  rationale: δαιμόνια എന്ന പദത്തിന്റെ നേരിട്ടുള്ള, സാധാരണ മലയാള ബൈബിൾ-മതഭാഷാ തുല്യപദം; മൂലത്തിൽ ഇല്ലാത്ത ‘അശുദ്ധാത്മാക്കൾ’ എന്നു വികസിപ്പിച്ചിട്ടില്ല.
- source_word: νόσους
  choice: രോഗങ്ങൾ
  rationale: νόσος സൂചിപ്പിക്കുന്ന രോഗാവസ്ഥകൾക്ക് വ്യക്തവും സാധാരണവുമായ മലയാള പദം.
- source_word: θεραπεύειν
  choice: സൗഖ്യമാക്കാൻ
  rationale: രോഗങ്ങളെ ഭേദമാക്കുക എന്ന θεραπεύωയുടെ സന്ദർഭോചിത അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: δύναμις എന്നും ἐξουσία എന്നും തമ്മിലുള്ള വ്യത്യാസം
  choice: ‘ശക്തിയും അധികാരവും’ എന്ന് രണ്ട് പദങ്ങളായിത്തന്നെ നിലനിർത്തി
  alternative: ‘അധികാരം’ എന്ന ഒറ്റ ആശയമായി ലയിപ്പിക്കുക
  rationale: പ്രവർത്തനശേഷിയും അധികാരപ്പെട്ട അവകാശവും എന്ന വ്യത്യസ്ത ഊന്നലുകൾ മൂലപാഠത്തിൽ ഒപ്പത്തിനൊപ്പം വരുന്നു; അവയെ ലയിപ്പിക്കുന്നത് യേശു നൽകിയ നിയോഗത്തിന്റെ വ്യാപ്തി ചുരുക്കും.
- issue: ‘പന്ത്രണ്ടുപേർ’ ആരെന്ന തിരിച്ചറിയൽ
  choice: ‘പന്ത്രണ്ടുപേർ’ എന്നു മാത്രം നൽകി
  alternative: ‘പന്ത്രണ്ട് ശിഷ്യന്മാർ’ അല്ലെങ്കിൽ ‘പന്ത്രണ്ട് അപ്പൊസ്തലന്മാർ’
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ശിഷ്യന്മാർ/അപ്പൊസ്തലന്മാർ എന്ന നാമം ചേർക്കുന്നില്ല; സമീപസന്ദർഭത്തിൽനിന്നുള്ള വിശദീകരണം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വിളിച്ചുകൂട്ടി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; ‘ശക്തി’, ‘അധികാരം’ എന്നീ പ്രധാന ആശയങ്ങൾ വേർതിരിച്ചു സൂക്ഷിച്ചു. വാക്യത്തിന്റെ ഗ്രീക്ക് ഘടന അക്ഷരാർഥത്തിൽ പകർത്താതെ, ഭൂതങ്ങളോടുള്ള അധീശത്വവും രോഗശാന്തിയും ശക്തിയുടെയും അധികാരത്തിന്റെയും പ്രവർത്തനപരിധികളായി വ്യക്തമായി വായിക്കാവുന്ന രീതിയിൽ ക്രമപ്പെടുത്തി.
