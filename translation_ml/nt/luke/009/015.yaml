  yaml_path: translation/nt/luke/009/015.yaml
  text: And they did so[a], and had them all sit down.
translation:
  language: ml
  text: അവർ അങ്ങനെ ചെയ്തു[a]; എല്ലാവരെയും ഭക്ഷണത്തിനായി ഇരുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: ‘എല്ലാവരെയും ഇരുത്തി’ അല്ലെങ്കിൽ ‘എല്ലാവരെയും ചാരിക്കിടത്തി.’ ഗ്രീക്ക് ക്രിയ ഭക്ഷണത്തിനായി ആളുകളെ ക്രമീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അന്നത്തെ പതിവനുസരിച്ച് അവർ ചാരിക്കിടന്നിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അവർ
  rationale: വാക്യാരംഭത്തിലെ καί മുൻവാക്യത്തോടുള്ള ലളിതമായ ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നു. എന്നാൽ മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ചയ്ക്കായി അത് പ്രത്യേകം ‘പിന്നെ/കൂടാതെ’ എന്നു വിവർത്തനം ചെയ്യാതെ, ഗ്രീക്കിൽ ഉൾക്കൊള്ളുന്ന കർത്താവിനെ ‘അവർ’ എന്നു വ്യക്തമാക്കി.
- source_word: ἐποίησαν οὕτως
  choice: അങ്ങനെ ചെയ്തു
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ നിർദേശം അതേപടി നടപ്പാക്കിയതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: καὶ
  choice: ;
  rationale: രണ്ടാമത്തെ പ്രവൃത്തിയെ ആദ്യത്തേതിനോട് ബന്ധിപ്പിക്കുന്ന καί മലയാളത്തിൽ അർദ്ധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി; അധികമായ കാലക്രമമോ വ്യാഖ്യാനബലമോ ചേർത്തിട്ടില്ല.
- source_word: κατέκλιναν
  choice: ഭക്ഷണത്തിനായി ഇരുത്തി
  rationale: κατακλίνω ഇവിടെ ആളുകളെ ഭക്ഷണത്തിനായി ഇരിക്കുകയോ ചാരിക്കിടക്കുകയോ ചെയ്യുന്ന നിലയിൽ ക്രമീകരിക്കുക എന്ന കാരകാർഥമുള്ള ക്രിയയാണ്. ആധുനിക മലയാളത്തിൽ ‘ഇരുത്തി’ കാരകാർഥം നിലനിർത്തുന്നു; ‘ഭക്ഷണത്തിനായി’ സന്ദർഭാർഥം വ്യക്തമാക്കുകയും പുരാതന ചാരിക്കിടക്കുന്ന ഭക്ഷണരീതി നിർബന്ധമായി അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἅπαντας
  choice: എല്ലാവരെയും
  rationale: ക്രിയയുടെ കർമമായി വരുന്ന ἅπαντας സംഘത്തിലെ ഒരാളെയും ഒഴിവാക്കാത്ത സമഗ്രത പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ഭക്ഷണത്തിനായി ഇരുത്തി’ സാധാരണ വായനക്കാർക്ക് പ്രവൃത്തി വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് ഗ്രീക്ക് ക്രിയയിലെ ഭക്ഷണസന്ദർഭവും ചാരിക്കിടക്കുന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
