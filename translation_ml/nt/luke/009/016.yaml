id: LUK.9.16
reference: Luke 9:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: ml
  text: പിന്നെ, ആ അഞ്ച് അപ്പവും രണ്ട് മീനും എടുത്ത് സ്വർഗത്തിലേക്കു നോക്കി, അവയെ അനുഗ്രഹിക്കുകയും നുറുക്കുകയും ചെയ്തു; ജനക്കൂട്ടത്തിന്റെ മുന്നിൽ വെക്കാൻ അവ ശിഷ്യന്മാർക്കു കൊടുത്തുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: എടുത്ത്
  rationale: പ്രധാന പ്രവൃത്തികൾക്കു മുമ്പുള്ള അനുബന്ധ പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പിന്നെ
  rationale: കഥയുടെ തുടർച്ചയും നേരിയ പുരോഗതിയും സൂചിപ്പിക്കുന്ന ബന്ധകമായി പ്രവർത്തിക്കുന്നു.
- source_word: ἄρτους
  choice: അപ്പം
  rationale: ഈ ഭക്ഷണസന്ദർഭത്തിൽ എണ്ണാവുന്ന അപ്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; സംഖ്യയോടൊപ്പം മലയാളത്തിലെ സ്വാഭാവിക ഏകവചനരൂപം ഉപയോഗിച്ചു.
- source_word: ἰχθύας
  choice: മീൻ
  rationale: സംഖ്യയ്ക്കു ശേഷം മലയാളത്തിൽ സ്വാഭാവികമായി ഉപയോഗിക്കുന്ന രൂപം.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: സ്വർഗത്തിലേക്കു നോക്കി
  rationale: മുകളിലേക്കുള്ള ദൃഷ്ടിയും പ്രാർഥനാപരമായ സന്ദർഭവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: εὐλόγησεν αὐτοὺς
  choice: അവയെ അനുഗ്രഹിച്ചു
  rationale: εὐλογέω എന്ന ക്രിയയെയും അപ്പത്തെയും മീനിനെയും ഒരുമിച്ചു സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമത്തെയും നേരിട്ട് നിലനിർത്തുന്നു; സമാന്തര വിവരണങ്ങളിലെ ‘നന്ദി പറഞ്ഞു’ എന്ന ഭാഷയുമായി ഒത്തുചേർക്കുന്നില്ല.
- source_word: κατέκλασεν
  choice: അവ മുറിച്ചിട്ട്
  rationale: വിതരണത്തിനായി ഭക്ഷണം ഭാഗങ്ങളാക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; സൂചിതമായ കർമം മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: ἐδίδου
  choice: കൊടുത്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപത്തിന്റെ തുടർച്ചയായ അല്ലെങ്കിൽ ആവർത്തിച്ചുള്ള വിതരണപ്രവൃത്തിയെ പ്രകടമാക്കുന്നു.
- source_word: μαθηταῖς
  choice: ശിഷ്യന്മാർക്ക്
  rationale: ഗ്രീക്കിലെ നിർദ്ദിഷ്ടരൂപത്തെ സന്ദർഭത്തിൽ വ്യക്തമായ സാധാരണ മലയാളരൂപത്തിൽ നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘തന്റെ’ ചേർത്തിട്ടില്ല.
- source_word: παραθεῖναι
  choice: വിളമ്പാൻ
  rationale: ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ ഭക്ഷണം വെച്ചുകൊടുക്കുക എന്ന ഉദ്ദേശ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὄχλῳ
  choice: ജനക്കൂട്ടത്തിന്
  rationale: ὄχλος എന്ന പദത്തിന്റെ കഥാസന്ദർഭത്തിലെ സാധാരണ അർഥം വ്യക്തവും ആധുനികവുമായി നൽകുന്നു.
theological_decisions:
- issue: പ്രാർഥനാസന്ദർഭത്തിലെ οὐρανός എന്ന പദത്തിന്റെ അർഥം
  choice: സ്വർഗം
  alternative: ആകാശം
  rationale: അനുഗ്രഹിക്കുന്നതോടൊപ്പമുള്ള മുകളിലേക്കുള്ള നോട്ടം ദൈവത്തോടുള്ള പ്രാർഥനാപരമായ ദിശ സൂചിപ്പിക്കുന്നതിനാൽ, വെറും ഭൗതിക ആകാശത്തെക്കാൾ ‘സ്വർഗം’ സന്ദർഭത്തിന്റെ അർഥം നന്നായി നിലനിർത്തുന്നു.
- issue: εὐλόγησεν എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: അനുഗ്രഹിച്ചു
  alternative: അവയ്ക്കുവേണ്ടി നന്ദി പറഞ്ഞു
  rationale: ലൂക്കോസ് ഇവിടെ εὐχαριστέω എന്നല്ല, εὐλογέω എന്ന ക്രിയയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ സമാന്തര വിവരണങ്ങളുമായി സമീകരിക്കാതെ മൂലപദത്തിന്റെ പ്രത്യേകതയും അതിലുള്ള വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘കൊടുത്തുകൊണ്ടിരുന്നു’ എന്ന രൂപം വിതരണത്തിന്റെ തുടർച്ച നിലനിർത്തുന്നു. ‘വിളമ്പാൻ’ എന്നത് അക്ഷരാർഥമായ ‘മുന്നിൽ വെക്കാൻ’ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
