reference: Luke 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἤκουσεν δὲ Ἡρῴδης ὁ τετραάρχης τὰ ⸀γινόμενα πάντα, καὶ διηπόρει διὰ τὸ λέγεσθαι ὑπό τινων ὅτι Ἰωάννης ⸀ἠγέρθη ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: ml
  text: തെത്രാർക്കായ ഹെരോദാവ് നടന്നുകൊണ്ടിരുന്ന എല്ലാ കാര്യങ്ങളെക്കുറിച്ചും കേട്ടു; യോഹന്നാൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടിരുന്നുവെന്ന്[a] ചിലർ പറഞ്ഞുകൊണ്ടിരുന്നതിനാൽ അവൻ ആശയക്കുഴപ്പത്തിലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോഹന്നാൻ മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേറ്റിരുന്നുവെന്ന്.” ഗ്രീക്ക് ക്രിയ കർമണി രൂപത്തിലാണ്; അക്ഷരാർഥത്തിൽ, “ഉയിർപ്പിക്കപ്പെട്ടിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσεν
  choice: കേട്ടറിഞ്ഞു
  rationale: സംഭവങ്ങളെക്കുറിച്ചുള്ള വാർത്തകൾ അറിഞ്ഞു എന്ന അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ കഥയിലെ വിഷയമാറ്റം സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിലെ പുതിയ വാക്യവും കർത്താവിനെ ആദ്യം നിർത്തുന്നതും ഈ പ്രവാഹം മതിയായ വിധത്തിൽ നൽകുന്നു. ‘എന്നാൽ’ എന്നു ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത ശക്തമായ വിരോധം തോന്നാം.
- source_word: ὁ τετραάρχης
  choice: ചതുർഭാഗാധിപനായ
  rationale: ഹെരോദാവിന്റെ പ്രത്യേക ചരിത്ര-രാഷ്ട്രീയ പദവി നിലനിർത്തുന്നു; ‘രാജാവ്’ എന്ന പൊതുവായ പദം ഉപയോഗിച്ച് പദവിയെ മങ്ങിയതാക്കുന്നില്ല.
- source_word: τὰ γινόμενα πάντα
  choice: നടന്നുകൊണ്ടിരുന്നതെല്ലാം
  rationale: γινόμενα എന്ന വർത്തമാന പങ്കാളിക്രിയയുടെ തുടരുന്ന സംഭവഭാവവും πάντα എന്ന സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διηπόρει
  choice: ആശയക്കുഴപ്പത്തിലായി
  rationale: എന്താണ് സത്യമെന്നറിയാതെ കുഴങ്ങുന്ന അവസ്ഥയെ ആധുനികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു; ഭയം എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: എന്ന് ചിലർ പറഞ്ഞുകൊണ്ടിരുന്നതിനാൽ
  rationale: διάയോടുകൂടിയ articular infinitive സൂചിപ്പിക്കുന്ന കാരണം വ്യക്തമാക്കുന്നു. മലയാളത്തിന്റെ സ്വാഭാവിക സജീവവാക്യഘടന ഉപയോഗിച്ചെങ്കിലും ‘ചിലർ’ എന്ന അനിശ്ചിത കർത്താവും തുടരുന്ന റിപ്പോർട്ടുകളുടെ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ἠγέρθη
  choice: ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ἐγείρωയുടെ passive രൂപം നിലനിർത്തുകയും റിപ്പോർട്ടിന്റെ സമയത്ത് പ്രസക്തമായിരുന്ന പൂർത്തിയായ സംഭവത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: ബഹുവചനമായ νεκρῶν എന്ന രൂപവും മരിച്ചവരുടെ ഇടയിൽനിന്നുള്ള ഉയിർപ്പിന്റെ ആശയവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാനെക്കുറിച്ചുള്ള ഉയിർപ്പിന്റെ റിപ്പോർട്ടിലെ ക്രിയാരൂപം
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു
  rationale: ഗ്രീക്കിൽ ക്രിയ passive ആയതിനാൽ പ്രവർത്തനകർത്താവിനെ വ്യക്തമാക്കാതെ passive രൂപം നിലനിർത്തുന്നു; active/intransitive രൂപത്തിലേക്ക് മാറ്റി വാചകത്തിലെ സൂക്ഷ്മത പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ചതുർഭാഗാധിപൻ’ എന്ന ചരിത്രപദവി കൃത്യതയ്ക്കായി നിലനിർത്തി; ശേഷിച്ച വാക്യം ലളിതവും സ്വാഭാവികവുമാക്കി. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാട്ടുന്ന പദപ്രയോഗത്തിനുശേഷം തന്നെയാണ് [a] അടയാളം നൽകിയിരിക്കുന്നത്.
