id: LUK.9.23
reference: Luke 9:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: ml
  text: 'അവൻ എല്ലാവരോടും പറഞ്ഞുകൊണ്ടിരുന്നു: “ആരെങ്കിലും എന്റെ പിന്നാലെ വരാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ, അവൻ തന്നെത്തന്നെ നിഷേധിച്ച് ദിവസവും തന്റെ ക്രൂശ് എടുത്ത് എന്നെ അനുഗമിക്കട്ടെ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ “ആരെങ്കിലും” എന്ന പൊതുവാചക ഏകവചനത്തിനു പിന്നാലെ പുല്ലിംഗ ഏകവചനരൂപങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അർഥം ഏതു വ്യക്തിക്കും ബാധകമാണ്. മറ്റൊരു രീതിയിൽ: “അവർ തങ്ങളെത്തന്നെ നിഷേധിച്ച് ദിവസവും തങ്ങളുടെ ക്രൂശ് എടുത്ത് എന്നെ അനുഗമിക്കട്ടെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലക്രിയയുടെ തുടർച്ചയായ പ്രവൃത്തിഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς πάντας
  choice: എല്ലാവരോടും
  rationale: യേശുവിന്റെ അഭിസംബോധനയുടെ സമഗ്രമായ വ്യാപ്തി നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: Εἴ τις θέλει
  choice: ആരെങ്കിലും ... വരാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ
  rationale: τις എന്ന അനിശ്ചിത ഏകവചനത്തെയും θέλει എന്ന ഇച്ഛാഭാവത്തെയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: എന്റെ പിന്നാലെ വരാൻ
  rationale: ശിഷ്യത്വത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ സ്ഥാനരൂപകം നിലനിർത്തുകയും പിന്നീട് വരുന്ന ‘അനുഗമിക്കുക’ എന്ന ക്രിയയുമായി ഇതിനെ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: അവൻ തന്നെത്താൻ നിഷേധിച്ച്
  rationale: സ്വയം തള്ളിപ്പറയുക എന്ന ആജ്ഞയുടെ അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘അനുഗമിക്കട്ടെ’ എന്ന ആജ്ഞയോടു ചേർന്ന മലയാളഘടനയിൽ ആജ്ഞാഭാവം വഹിക്കുന്നു.
- source_word: ἀράτω
  choice: എടുത്ത്
  rationale: ക്രൂശ് സ്വയം ഏറ്റെടുക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ചുമക്കുക’ എന്നു മാറ്റി പ്രവൃത്തിയുടെ ആരംഭഭാവം ഇല്ലാതാക്കുന്നില്ല.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: തന്റെ ക്രൂശ്
  rationale: σταυρός എന്ന സാക്ഷാൽ പദവും αὐτοῦ എന്ന ഏകവചന ഉടമസ്ഥതയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: καθ’ ἡμέραν
  choice: ദിവസവും
  rationale: ഓരോ ദിവസവും എന്ന ലൂക്കോസിന്റെ തുടർച്ചയായ ശിഷ്യത്വ ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀκολουθείτω μοι
  choice: എന്നെ അനുഗമിക്കട്ടെ
  rationale: വർത്തമാനകാല മൂന്നാംപുരുഷ ആജ്ഞയുടെ തുടർച്ചാഭാവവും ആജ്ഞാസ്വരവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വത്തിലെ ‘ക്രൂശ്’ എന്ന ഭാഷ
  choice: ‘ക്രൂശ്’ എന്ന സാക്ഷാൽ പദം നിലനിർത്തി.
  alternative: ഭാരം, കഷ്ടത, ത്യാഗം എന്നിങ്ങനെ വ്യാഖ്യാനിച്ചെഴുതുക.
  rationale: σταυρός ഒരു മൂർത്തമായ പദമാണ്. അതിന്റെ ശിഷ്യത്വപരമായ പ്രതീകാർഥം വിവർത്തനത്തിൽ മുൻകൂട്ടി ഒറ്റ വ്യാഖ്യാനമായി ചുരുക്കരുത്.
- issue: ἀρνησάσθω ... ἀράτω ... ἀκολουθείτω എന്നതിലെ പൊതുവാചക ഏകവചനം
  choice: ‘ആരെങ്കിലും’ എന്ന ഏകവചനത്തിന് പിന്നാലെ ‘അവൻ ... തന്നെത്താൻ ... തന്റെ’ എന്ന ഏകവചനരൂപം നിലനിർത്തി.
  alternative: ‘അവർ തങ്ങളെത്തന്നെ ... അവരുടെ’ എന്ന ബഹുവചന/ലിംഗനിരപേക്ഷ രൂപം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് അനിശ്ചിത ഏകവചനത്തിൽ തുടങ്ങി വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനത്തിലുള്ള ആജ്ഞകളും പ്രതിബിംബസർവനാമവും ഉപയോഗിക്കുന്നു. മുഖ്യപാഠം ആ പ്രതിനിധാന ഏകവചനഘടന സംരക്ഷിക്കുന്നു; അതിന്റെ പൊതുവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന രൂപം അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ച നിലനിർത്തുന്നു; ‘പിന്നാലെ വരുക’ എന്ന രൂപകം സംരക്ഷിച്ചുകൊണ്ട് ‘അനുഗമിക്കുക’ എന്ന അവസാന ആജ്ഞ വേർതിരിച്ചിരിക്കുന്നു.
