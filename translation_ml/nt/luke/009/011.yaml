id: LUK.9.11
reference: Luke 9:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: ml
  text: എന്നാൽ ജനക്കൂട്ടങ്ങൾ അതറിഞ്ഞപ്പോൾ അവനെ അനുഗമിച്ചു. അവൻ അവരെ സ്വാഗതം ചെയ്ത് ദൈവരാജ്യത്തെക്കുറിച്ച് അവരോടു സംസാരിക്കുകയും ചികിത്സ[a] ആവശ്യമുള്ളവരെ സൗഖ്യമാക്കുകയും ചെയ്തുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സൗഖ്യം ആവശ്യമായിരുന്നവരെ.’ ഗ്രീക്കിലെ θεραπεία എന്ന പദത്തിന് ‘ചികിത്സ,’ ‘പരിചരണം,’ അല്ലെങ്കിൽ ‘സൗഖ്യം’ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: എന്നാൽ ജനക്കൂട്ടങ്ങൾ
  rationale: δέ ഇവിടെ നേരിയ വൈരുധ്യത്തോടെയുള്ള ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നു; ὄχλοι എന്ന ബഹുവചനം നിലനിർത്താൻ ‘ജനക്കൂട്ടങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: γνόντες
  choice: അതറിഞ്ഞപ്പോൾ
  rationale: Aorist participle-ന്റെ കാലസാഹചര്യ അർഥം സ്വാഭാവികമായ മലയാള ഉപവാക്യത്തിലൂടെ നൽകുന്നു; ‘അത്’ യേശുവിന്റെ സ്ഥലം അല്ലെങ്കിൽ നീക്കം അറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἠκολούθησαν αὐτῷ
  choice: അവനെ അനുഗമിച്ചു
  rationale: ശാരീരികമായി പിന്നാലെ ചെന്നത് എന്ന നേരിട്ടുള്ള അർഥവും സുവിശേഷങ്ങളിലെ ‘അനുഗമിക്കൽ’ എന്ന ആഖ്യാനപ്രതിധ്വനിയും അതിശയിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀποδεξάμενος αὐτούς
  choice: അവരെ സ്വാഗതം ചെയ്ത്
  rationale: ἀποδέχομαι ഇവിടെ അനുകൂലമായി സ്വീകരിക്കുക, സ്വാഗതം ചെയ്യുക എന്ന ഊഷ്മളമായ അർഥം നൽകുന്നു.
- source_word: ἐλάλει αὐτοῖς
  choice: അവരോടു സംസാരിക്കുകയും … ചെയ്തുകൊണ്ടിരുന്നു
  rationale: Imperfect രൂപത്തിന്റെ തുടർച്ചയായ പ്രവർത്തനഭാവം ‘ചെയ്തുകൊണ്ടിരുന്നു’ എന്ന സംയുക്ത ക്രിയയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തെക്കുറിച്ച്
  rationale: പ്രധാന ബൈബിൾ പ്രയോഗം വ്യക്തമായും സ്ഥിരതയോടെയും നിലനിർത്തുന്നു.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: ചികിത്സ ആവശ്യമുള്ളവരെ
  rationale: θεραπεία എന്ന നാമത്തിന്റെ ‘ചികിത്സ/പരിചരണം/സൗഖ്യം’ എന്ന അർഥവ്യാപ്തി പരിഗണിച്ച്, പിന്നാലെയുള്ള ἰᾶτο-യുമായി അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്ന സ്വാഭാവിക പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: ἰᾶτο
  choice: സൗഖ്യമാക്കുകയും ചെയ്തുകൊണ്ടിരുന്നു
  rationale: ἰάομαι എന്ന ക്രിയയുടെ സൗഖ്യമാക്കുക എന്ന അർഥവും imperfect രൂപത്തിന്റെ തുടർച്ചാഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവരാജ്യം
  alternative: ദൈവത്തിന്റെ ഭരണം
  rationale: ‘ദൈവരാജ്യം’ സുവിശേഷങ്ങളിലെ സ്ഥാപിതവും വിശാലവുമായ പ്രയോഗമാണ്; അത് സ്ഥലപരമായ ആശയത്തിലേക്ക് മാത്രം ചുരുക്കാതെ മൂലപദവുമായി തുടർച്ച നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ബഹുവചനവും imperfect ക്രിയകളുടെ തുടർച്ചാഭാവവും θεραπεία എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചേരേണ്ട ‘ചികിത്സ’ എന്ന പദത്തിനുതന്നെ [a] അടയാളം ചേർത്തു.
