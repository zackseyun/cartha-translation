id: LUK.9.6
reference: Luke 9:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: ml
  text: അങ്ങനെ അവർ പുറപ്പെട്ട് ഗ്രാമംതോറും[a] സഞ്ചരിച്ച് സുവാർത്ത അറിയിക്കുകയും[b] എല്ലായിടത്തും രോഗികളെ സൗഖ്യമാക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഗ്രാമങ്ങളിലൂടെ.’ ഗ്രീക്ക് പ്രയോഗം ഗ്രാമങ്ങൾക്കിടയിലൂടെയുള്ള സഞ്ചാരത്തെ വിതരണാത്മകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സുവിശേഷം പ്രസംഗിക്കുകയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: പുറപ്പെട്ട്
  rationale: മുൻവാക്യത്തിലെ നിയോഗത്തെത്തുടർന്ന് അവർ യാത്ര ആരംഭിച്ചതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: അങ്ങനെ
  rationale: δέ ഇവിടെ കഥയുടെ തുടർച്ചയോടൊപ്പം മുൻനിർദേശത്തിന്റെ ഫലമായ പുരോഗതിയും സൂചിപ്പിക്കുന്നു.
- source_word: διήρχοντο
  choice: സഞ്ചരിച്ച്
  rationale: അപൂർണ്ണകാല ക്രിയ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ സ്ഥലാന്തര സഞ്ചാരം പകർത്തുന്നു.
- source_word: κατὰ τὰς κώμας
  choice: ഗ്രാമംതോറും
  rationale: κατάയുടെ വിതരണാത്മക അർഥം സ്വാഭാവികമായി നൽകുന്നു; പല ഗ്രാമങ്ങളിലൂടെയുള്ള ക്രമാനുസൃത സഞ്ചാരം വ്യക്തമാക്കുന്നു.
- source_word: εὐαγγελιζόμενοι
  choice: സുവാർത്ത അറിയിക്കുകയും
  rationale: നല്ല വാർത്തയുടെ പരസ്യപ്രഖ്യാപനം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക ഭാഷയിൽ നൽകുന്നു.
- source_word: θεραπεύοντες
  choice: രോഗികളെ സൗഖ്യമാക്കുകയും
  rationale: സന്ദർഭത്തിലെ ശാരീരിക രോഗശാന്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; 'രോഗികളെ' എന്നത് ഗ്രീക്കിൽ വ്യക്തമായി ഇല്ലെങ്കിലും ക്രിയയുടെ സന്ദർഭസിദ്ധമായ കർമം തുറന്നുപറയുന്നു.
- source_word: πανταχοῦ
  choice: എല്ലായിടത്തും
  rationale: ശുശ്രൂഷയുടെ വ്യാപകമായ സ്ഥലപരിധിയെ നേരിട്ട് പകർത്തുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തലിക ദൗത്യത്തിൽ εὐαγγελιζόμενοι എന്നതിന്റെ സ്വഭാവം
  choice: സുവാർത്ത അറിയിക്കുകയും
  alternative: സുവിശേഷം പ്രസംഗിക്കുകയും
  rationale: പിന്നീടുള്ള സാങ്കേതിക ദൈവശാസ്ത്ര അർഥം നിർബന്ധമായി ഇറക്കുമതി ചെയ്യാതെ, ശിഷ്യർ നല്ല വാർത്ത പരസ്യമായി അറിയിച്ചുവെന്ന ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഗ്രാമംതോറും’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ വിതരണാത്മക ചലനം സ്വാഭാവികമായി പകർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
