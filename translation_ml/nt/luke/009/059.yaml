revisions:
- from: 'പിന്നെ അവൻ മറ്റൊരാളോടു പറഞ്ഞു: “എന്നെ അനുഗമിക്കുക.” എന്നാൽ അയാൾ പറഞ്ഞു: “കർത്താവേ, ആദ്യം പോയി എന്റെ പിതാവിനെ സംസ്കരിക്കാൻ എന്നെ അനുവദിക്കണമേ.”'
  to: 'പിന്നെ അവൻ മറ്റൊരാളോടു പറഞ്ഞു: “എന്നെ അനുഗമിക്കുക.” എന്നാൽ അയാൾ പറഞ്ഞു: “കർത്താവേ, ആദ്യം പോയി എന്റെ പിതാവിനെ സംസ്കരിക്കാൻ എനിക്ക് അനുവദിക്കണമേ.”'
