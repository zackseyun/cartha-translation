id: LUK.9.59
reference: Luke 9:59
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ മറ്റൊരാളോടു പറഞ്ഞു: “എന്നെ അനുഗമിക്കുക.” എന്നാൽ അയാൾ പറഞ്ഞു: “കർത്താവേ, ആദ്യം പോയി എന്റെ പിതാവിനെ സംസ്കരിക്കാൻ എനിക്ക് അനുവദിക്കണമേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: മറ്റൊരാളോട്
  rationale: ἕτερος ഇവിടെ മുമ്പ് പരാമർശിച്ച ആളിൽനിന്നു വേറിട്ട മറ്റൊരാളെ സൂചിപ്പിക്കുന്നു; ‘മറ്റൊരാൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: Ἀκολούθει μοι
  choice: എന്നെ അനുഗമിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ സന്ദർഭോചിതമായ മലയാളം; തുടർച്ചയുടെ ഭാവം അനാവശ്യമായി കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള ആദരസംബോധനയും ‘കർത്താവ്’ എന്ന പദത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ സാധ്യതയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: ἐπίτρεψόν μοι
  choice: എന്നെ അനുവദിക്കണമേ
  rationale: അനുമതി അഭ്യർഥിക്കുന്ന ആജ്ഞാരൂപത്തെ ആദരപൂർവവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀπελθόντι πρῶτον
  choice: ആദ്യം പോയി
  rationale: പിതാവിനെ സംസ്കരിക്കുന്നതിനുമുമ്പുള്ള പുറപ്പെട്ടുപോകലിന്റെ ക്രമം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: θάψαι τὸν πατέρα μου
  choice: എന്റെ പിതാവിനെ സംസ്കരിക്കാൻ
  rationale: θάπτω എന്നതിന്റെ സാധാരണ അർഥമായ അടക്കം ചെയ്യൽ കൃത്യമായി നൽകുന്നു; ‘പിതാവ്’ ഗൗരവമുള്ള ആഖ്യാനശൈലിക്ക് യോജിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: ഗുരുവേ / യജമാനനേ
  rationale: ഇത് വെറും സാമൂഹിക ആദരസൂചകമായി ചുരുക്കാതെ, ആദരസംബോധനയും കർത്തൃത്വത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ അനുരണനവും തമ്മിലുള്ള പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: പിതാവിനെ സംസ്കരിക്കണമെന്ന അഭ്യർഥനയുടെ സാഹചര്യാർഥം
  choice: വാചകത്തിൽ പറയുന്നതുപോലെ നേരിട്ട് നിലനിർത്തി
  alternative: പിതാവ് മരിക്കുന്നതുവരെ വീട്ടിൽ തുടരാൻ അനുവദിക്കണമെന്ന വ്യാഖ്യാനം ചേർക്കുക
  rationale: പിതാവ് ഇതിനകം മരിച്ചിരുന്നോ, അതോ ഇത് കുടുംബബാധ്യതയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരുന്നോ എന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം വാചകത്തിൽ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അനുഗമിക്കുക’, ‘കർത്താവേ’, ‘പിതാവ്’, ‘സംസ്കരിക്കുക’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് ചിഹ്നവും അതിന്റെ സ്ഥാനവും തമ്മിൽ പൊരുത്തമില്ലാത്തതിനാലും, നിർദേശിച്ച പദക്രമവ്യത്യാസം മലയാളത്തിൽ അർഥവ്യത്യാസമുണ്ടാക്കാത്തതിനാലും അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
