id: LUK.9.17
reference: Luke 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔφαγον καὶ ἐχορτάσθησαν πάντες, καὶ ἤρθη τὸ περισσεῦσαν αὐτοῖς κλασμάτων κόφινοι δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/017.yaml
  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: ml
  text: എല്ലാവരും ഭക്ഷിച്ചു തൃപ്തരായി; അവർക്കു ശേഷിച്ച പൊട്ടിച്ച കഷണങ്ങൾ[a] പന്ത്രണ്ട് കൊട്ടകളിലായി ശേഖരിക്കപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൊട്ടിച്ച കഷണങ്ങൾ’ എന്നതിന് ‘ഭക്ഷണത്തിന്റെ അവശിഷ്ടങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം (κλασμάτων).
    reason: lexical_alternative
  - marker: b
    text: ‘ശേഖരിക്കപ്പെട്ടു’ എന്നതിന് ‘എടുത്തുയർത്തപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം (ἤρθη).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: ഭക്ഷിച്ചു
  rationale: കേവല ഭൂതകാലത്തിലെ സംഭവവിവരണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐχορτάσθησαν
  choice: തൃപ്തരായി
  rationale: എല്ലാവരും വയറുനിറയെ ഭക്ഷിച്ചു എന്ന ആശയം സ്വാഭാവികവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: സന്നിഹിതരായ എല്ലാവർക്കും ഭക്ഷണം ലഭിച്ചു എന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: τὸ περισσεῦσαν
  choice: ശേഷിച്ച
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന കൃതന്തത്തിന്റെ ‘ബാക്കിയായത്’ എന്ന അർഥം സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: κλασμάτων
  choice: കഷണങ്ങൾ
  rationale: പൊട്ടിച്ചെടുത്ത ഭക്ഷണത്തിന്റെ ഭാഗങ്ങൾ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘അപ്പക്കഷണങ്ങൾ’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കുന്നത് ഒഴിവാക്കി.
- source_word: ἤρθη
  choice: പെറുക്കിയെടുത്തപ്പോൾ
  rationale: ഈ സന്ദർഭത്തിൽ ശേഷിച്ച കഷണങ്ങൾ ശേഖരിച്ചതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ഗ്രീക്കിലെ കർമണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപത്തിൽ പകരുന്നു.
- source_word: κόφινοι δώδεκα
  choice: പന്ത്രണ്ട് കൊട്ട
  rationale: കൊട്ടകളുടെ എണ്ണത്തെ വ്യക്തവും നേരിട്ടും പകരുന്നു; അവയുടെ വസ്തുവിനെക്കുറിച്ചുള്ള അനാവശ്യ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: αὐτοῖς
  choice: പ്രധാനവാക്യത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടത്തെ ദത്തി വ്യാകരണപരമായി അവ്യക്തമാണ്; മലയാളത്തിൽ ‘അവർക്കായി’ അല്ലെങ്കിൽ ‘അവർക്ക്’ എന്നു ചേർത്താൽ ഉദ്ദേശ്യം അനാവശ്യമായി നിർണ്ണയിക്കപ്പെടുകയും വാക്യം അസ്വാഭാവികമാകുകയും ചെയ്യും.
theological_decisions:
- issue: αὐτοῖς എന്ന ദത്തിയുടെ ബന്ധം
  choice: പ്രധാനവാക്യത്തിൽ പ്രത്യേകം പ്രകടമാക്കാതെ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളിച്ചു
  alternative: ‘അവർക്കു ശേഷിച്ച’ / ‘അവർക്കായി പെറുക്കിയെടുത്ത’
  rationale: ദത്തി ശേഷിപ്പിനോടോ ശേഖരണത്തോടോ ബന്ധിപ്പിക്കാവുന്നതാണ്; ഒരു ബന്ധം മാത്രം നിർബന്ധിച്ച് theological അല്ലെങ്കിൽ narrative അർഥം തീർപ്പാക്കാതിരിക്കാൻ സ്വാഭാവിക മലയാളത്തിൽ അത് പരോക്ഷമായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ സംക്ഷിപ്തമായ എണ്ണപ്രസ്താവന മലയാളത്തിൽ പൂർണ്ണവാക്യമാക്കാൻ ‘ഉണ്ടായിരുന്നു’ ഉപയോഗിച്ചു; പന്ത്രണ്ട് കൊട്ട നിറഞ്ഞിരുന്നു എന്ന് മൂലത്തിൽ വ്യക്തമായി പറയാത്തതിനാൽ ‘നിറഞ്ഞ’ ചേർത്തിട്ടില്ല.
