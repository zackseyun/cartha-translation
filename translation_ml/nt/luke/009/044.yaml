id: LUK.9.44
reference: Luke 9:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: ml
  text: “ഈ വാക്കുകൾ നിങ്ങളുടെ ചെവികളിൽ വെച്ചുകൊള്ളുക; കാരണം മനുഷ്യപുത്രൻ മനുഷ്യരുടെ[b] കൈകളിൽ കൈമാറപ്പെടാൻ[a] പോകുകയാണ്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒറ്റിക്കൊടുക്കപ്പെടാൻ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് “കൈമാറുക,” “ഏൽപ്പിക്കുക,” ചില സന്ദർഭങ്ങളിൽ “ഒറ്റിക്കൊടുക്കുക” എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ആളുകളുടെ.” ഗ്രീക്കിലെ പദം ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: നിങ്ങൾ നിങ്ങളുടെ ചെവികളിൽ പതിപ്പിച്ചുകൊള്ളുക
  rationale: കല്പനയുടെ ഊന്നലും ‘ചെവികളിൽ’ എന്ന സജീവമായ ഗ്രീക്ക് രൂപകവും നിലനിർത്തുന്നു. പദാനുപദമായ ‘വെക്കുക’ എന്നതിനെക്കാൾ ‘പതിപ്പിച്ചുകൊള്ളുക’ മലയാളത്തിൽ ശ്രദ്ധയോടെ കേട്ട് മനസ്സിൽ സൂക്ഷിക്കുക എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τοὺς λόγους τούτους
  choice: ഈ വാക്കുകൾ
  rationale: യേശു ഉടൻ പറയാനിരിക്കുന്ന നിർദിഷ്ട പ്രസ്താവനയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ὁ γὰρ
  choice: കാരണം
  rationale: മുൻകല്പനയ്ക്കുള്ള വിശദീകരണകാരണം γάρ അവതരിപ്പിക്കുന്നുവെന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്ഥാപിതമായ സ്വയംവിശേഷണവും ദാനീയേൽ 7-നോടുള്ള സാധ്യതയുള്ള അനുരണനവും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: μέλλει
  choice: പോകുകയാണ്
  rationale: സംഭവിക്കാൻ അടുത്തിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന μέλλωയുടെ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; വിധിനിശ്ചയത്തിന്റെ അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: παραδίδοσθαι
  choice: ഏൽപ്പിക്കപ്പെടാൻ
  rationale: മറ്റുള്ളവരുടെ അധികാരത്തിലേക്ക് കൈമാറപ്പെടുക എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; യൂദായുടെ വഞ്ചനയിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: മനുഷ്യരുടെ കൈകളിൽ
  rationale: മറ്റുള്ളവരുടെ അധികാരത്തിനു കീഴിലാകുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപകവും മനുഷ്യപുത്രനും മനുഷ്യരും തമ്മിലുള്ള വാക്യഘടനാപരമായ വൈരുധ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന വിശേഷണത്തിന്റെ വിവർത്തനം
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: പരമ്പരാഗതവും മൂലരൂപത്തോട് അടുത്തതുമായ വിശേഷണം അതിന്റെ ക്രിസ്തുശാസ്ത്രപരവും ദാനീയേൽസംബന്ധവുമായ അനുരണനങ്ങൾ വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: παραδίδοσθαι എന്ന ക്രിയയുടെ വ്യാപ്തി
  choice: ഏൽപ്പിക്കപ്പെടാൻ
  alternative: ഒറ്റിക്കൊടുക്കപ്പെടാൻ
  rationale: യേശു മനുഷ്യരുടെ അധികാരത്തിലേക്കു കൈമാറപ്പെടുന്നതിന്റെ വിശാലമായ പ്രവചനമാണ് വാക്യം നൽകുന്നത്. ‘ഒറ്റിക്കൊടുക്കപ്പെടാൻ’ എന്നത് യൂദായുടെ വഞ്ചനയിലേക്കു മാത്രം അർഥം നേരത്തേ ചുരുക്കാം.
- issue: ἀνθρώπων എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മനുഷ്യരുടെ
  alternative: പുരുഷന്മാരുടെ
  rationale: ഇവിടെ ബഹുവചനപദം മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കാം. മലയാളത്തിലെ ‘മനുഷ്യർ’ ഈ വ്യാപ്തിയും ‘മനുഷ്യപുത്രൻ’ എന്നതുമായ പദപ്രതിധ്വനിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്ന മലയാളം. ‘ചെവികളിൽ പതിപ്പിച്ചുകൊള്ളുക’ എന്ന പ്രയോഗം മൂലത്തിലെ ശക്തമായ ശ്രവണരൂപകം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ അവതരിപ്പിക്കുന്നു. വാക്യത്തിൽ ഊന്നലുള്ള ὑμεῖς പ്രതിഫലിപ്പിക്കാൻ ‘നിങ്ങൾ’ വ്യക്തമാക്കിയിട്ടുണ്ട്.
