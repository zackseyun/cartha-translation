id: LUK.9.47
reference: Luke 9:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: ml
  text: എന്നാൽ യേശു അവരുടെ ഹൃദയത്തിലെ ആലോചന അറിഞ്ഞ് ഒരു കുട്ടിയെ കൈക്കൊണ്ട് തന്റെ അരികിൽ നിർത്തി,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: അറിഞ്ഞ്
  rationale: ὁράω എന്ന ക്രിയയുടെ ഈ രൂപം സന്ദർഭത്തിൽ മാനസികമായ അറിവിനെയോ ഗ്രഹണത്തെയോ സൂചിപ്പിക്കുന്നു. അറിവിന്റെ രീതി വ്യക്തമാക്കാതെ വാക്യത്തിന്റെ പ്രസ്താവന നിലനിർത്തുന്നു.
- source_word: διαλογισμὸν
  choice: ആലോചന
  rationale: അകത്തെ ചിന്ത, വിചാരം, തർക്കപരമായ പരിഗണന എന്നീ ഭാവങ്ങൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദമാണ്.
- source_word: τῆς καρδίας αὐτῶν
  choice: അവരുടെ ഹൃദയത്തിലെ
  rationale: ഗ്രീക്കിൽ ‘അവരുടെ’ എന്ന ബഹുവചന ഉടമസ്ഥരൂപത്തോടൊപ്പം ‘ഹൃദയം’ ഏകവചനത്തിലാണ്. മലയാളത്തിൽ ‘അവരുടെ ഹൃദയത്തിലെ’ എന്നത് ഈ ഘടനയും കൂട്ടായ ആന്തരിക മനോഭാവത്തിന്റെ സാധ്യതയും നിലനിർത്തുന്നു.
- source_word: ἐπιλαβόμενος
  choice: കൈക്കൊണ്ട്
  rationale: കൈപിടിക്കുക/പിടിച്ചെടുക്കുക എന്ന മൂർത്തമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുമ്പോഴും, കുട്ടിയോടുള്ള പ്രവൃത്തിക്ക് യോജിച്ച സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: παιδίον
  choice: ഒരു കുട്ടിയെ
  rationale: പദം സാധാരണയായി ഒരു കുട്ടിയെ സൂചിപ്പിക്കുന്നു; പ്രായത്തിന്റെ ചെറുപ്പത്തിന് അധിക ഊന്നൽ ചേർക്കാതെ അർത്ഥം നൽകുന്നു.
- source_word: ἔστησεν
  choice: നിർത്തി
  rationale: ἵστημι എന്ന ക്രിയയുടെ കാരണാർഥക ഭാവമായ ‘നിൽക്കുമാറാക്കി’ എന്ന ദൃശ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρ’ ἑαυτῷ
  choice: തന്റെ അരികിൽ
  rationale: യേശുവിന്റെ സമീപത്ത്, അദ്ദേഹത്തിന്റെ അരികിൽ എന്ന അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: യേശു അവരുടെ ആന്തരിക ആലോചന അറിഞ്ഞത്
  choice: യേശു അവരുടെ ഹൃദയത്തിലെ ആലോചന അറിഞ്ഞുവെന്ന് മാത്രം പ്രസ്താവിക്കുന്നു; അതിന്റെ രീതി വിശദീകരിക്കുന്നില്ല.
  alternative: ഇത് ദൈവിക സർവജ്ഞതയാലോ സൂക്ഷ്മമായ മാനുഷിക ഗ്രഹണത്താലോ ഉണ്ടായ അറിവാണെന്ന് വ്യാഖ്യാനിക്കുക.
  rationale: ലൂക്കോസ് ഇവിടെ അറിവിന്റെ രീതി വ്യക്തമാക്കാത്തതിനാൽ, വിവർത്തനം ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കാതെ വാചകത്തിലെ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ മലയാളം. ഗ്രീക്കിലെ ഏകവചന ‘ഹൃദയം’ സംരക്ഷിച്ചിരിക്കുന്നു; വാക്യത്തിന്റെ പ്രവാഹത്തിനായി കൃതന്തങ്ങൾ മലയാളത്തിലെ തുടർക്രിയാരൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു.
