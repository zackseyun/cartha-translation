id: LUK.9.25
reference: Luke 9:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: ml
  text: കാരണം, ഒരു മനുഷ്യൻ ലോകം മുഴുവൻ നേടിയാലും തന്നെത്തന്നെ[a] നഷ്ടപ്പെടുത്തുകയോ നഷ്ടം അനുഭവിക്കുകയോ ചെയ്താൽ അവന് എന്തു പ്രയോജനം?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ ജീവനെ’ അല്ലെങ്കിൽ ‘തന്റെ ആത്മാവിനെ’ എന്നിങ്ങനെയും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘തന്നെത്തന്നെ’ എന്നാണ്; ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘ജീവൻ’ എന്നതിനു സാധാരണ ഉപയോഗിക്കുന്ന പദത്തിനുപകരം ഇവിടെ പ്രതിഫലന സർവനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: വാസ്തവത്തിൽ ... എന്തു പ്രയോജനം?
  rationale: τίയും ὠφελεῖταιയും ചേർന്നുള്ള പ്രയോജനത്തെക്കുറിച്ചുള്ള ആലങ്കാരിക ചോദ്യം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. γὰρ-ന്റെ മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധം ‘വാസ്തവത്തിൽ’ സൂചിപ്പിക്കുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ഏതൊരു മനുഷ്യനെയും പ്രതിനിധാനം ചെയ്യുന്ന ഗ്രീക്ക് ഏകവചനത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: ലോകം മുഴുവൻ നേടിയാലും
  rationale: സാങ്കൽപ്പിക സാഹചര്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും κόσμος, ὅλος എന്നിവയുടെ പൂർണത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἑαυτόν
  choice: തന്നെത്തന്നെ
  rationale: മൂലപാഠത്തിലുള്ള പ്രതിഫലന സർവനാമം തന്നെയാണ് പരിഭാഷപ്പെടുത്തുന്നത്; ‘ആത്മാവ്’ എന്നോ ‘ജീവൻ’ എന്നോ അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἀπολέσας
  choice: നഷ്ടപ്പെടുത്തുകയോ
  rationale: സ്വന്തം അസ്തിത്വത്തെ നഷ്ടമാക്കുക എന്ന വിശാലമായ ആശയം നിലനിർത്തുന്നു.
- source_word: ἢ ζημιωθείς
  choice: നഷ്ടം അനുഭവിക്കുകയോ
  rationale: ἢ-യുടെ വികൽപബന്ധവും ζημιωθείς എന്ന നിഷ്ക്രിയരൂപത്തിന്റെ ‘നഷ്ടം സഹിക്കുക/അനുഭവിക്കുക’ എന്ന ഭാവവും സംരക്ഷിക്കുന്നു; ആദ്യ ക്രിയയുമായി കൃത്രിമമായി ഒന്നാക്കുന്നില്ല.
theological_decisions:
- issue: ἑαυτόν മനുഷ്യന്റെ അന്തിമനിലയുമായി എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നു
  choice: തന്നെത്തന്നെ
  alternative: തന്റെ ആത്മാവിനെ / തന്റെ ജീവനെ
  rationale: ഗ്രീക്ക് പാഠത്തിൽ ψυχή അല്ല, പ്രതിഫലന സർവനാമമാണ്. അതിനാൽ മനുഷ്യന്റെ ഒരു ഘടകത്തിലേക്ക് അർഥം ചുരുക്കാതെ, വ്യക്തിയുടെ സമഗ്രമായ സ്വത്വത്തെ സൂചിപ്പിക്കുന്ന വിശാലത നിലനിർത്തുന്നു.
- issue: ἀπολέσας, ζημιωθείς എന്നീ രണ്ടു പ്രയോഗങ്ങളുടെ ബന്ധം
  choice: നഷ്ടപ്പെടുത്തുകയോ നഷ്ടം അനുഭവിക്കുകയോ
  alternative: പൂർണമായി നശിച്ചുപോകുകയോ
  rationale: മൂലപാഠത്തിലെ ‘അല്ലെങ്കിൽ’ എന്ന വികൽപവും രണ്ടു ക്രിയകളിലെ വ്യത്യസ്ത സൂക്ഷ്മതകളും നിലനിർത്തുന്നു; നാശത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് പാഠത്തിൽ ഇല്ലാത്ത doctrinal വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആലങ്കാരിക ചോദ്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ‘നഷ്ടപ്പെടുത്തുക’ എന്നും ‘നഷ്ടം അനുഭവിക്കുക’ എന്നും ഉള്ള വ്യത്യാസം സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
