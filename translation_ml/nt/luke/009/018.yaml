  source_fidelity: മുഖ്യപാഠം ഗ്രീക്കിലെ കാലസാഹചര്യവും (ἐν τῷ εἶναι … προσευχόμενον), ശിഷ്യന്മാരുടെ സാന്നിധ്യവും, ജനക്കൂട്ടങ്ങളെക്കുറിച്ചുള്ള യേശുവിന്റെ ചോദ്യവും വിശ്വസ്തമായി കൈമാറുന്നു. ἐγένετο എന്ന ലൂക്കൻ ആഖ്യാനസൂത്രം മലയാളത്തിൽ പ്രത്യേക പദമായി പ്രതിഫലിക്കുന്നില്ലെങ്കിലും, ഇവിടെ അത് അർഥനഷ്ടമുണ്ടാക്കുന്നില്ല. ‘തനിച്ച്’ എന്നും ‘അവനോടുകൂടെ ഉണ്ടായിരുന്നു’ എന്നും ഒരുമിച്ചു നിലനിർത്തുന്നത് മൂലപാഠത്തിലെ സൂക്ഷ്മമായ സംഘർഷം വ്യാഖ്യാനിച്ച് ഒഴിവാക്കുന്നില്ല.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ജനക്കൂട്ടങ്ങൾ ഞാൻ ആരാണെന്നാണ് പറയുന്നത്?’ എന്ന ചോദ്യം സംസാരഭാഷയിലും മാന്യമായ തിരുവെഴുത്തുശൈലിയിലും യോജിക്കുന്നു.
  terminology: ‘പ്രാർഥിക്കുക,’ ‘ശിഷ്യന്മാർ,’ ‘ജനക്കൂട്ടങ്ങൾ’ എന്നിവ യോജിച്ച പ്രയോഗങ്ങളാണ്. എന്നാൽ അടിക്കുറിപ്പിലെ ‘ഒഴിഞ്ഞ സ്ഥലത്ത്’ എന്നത് κατὰ μόνας-ന്റെ സാധാരണ ലെക്സിക്കൽ ബദലായ ‘സ്വകാര്യമായി/ഏകാന്തമായി’ എന്നതിനെക്കാൾ ഒരു പ്രത്യേക സ്ഥലസൂചന നൽകുന്നു; അതിനാൽ അത് തിരുത്തണം.
