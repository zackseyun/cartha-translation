id: LUK.9.18
reference: Luke 9:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: ml
  text: 'അവൻ തനിച്ച്[a] പ്രാർഥിച്ചുകൊണ്ടിരിക്കുമ്പോൾ ശിഷ്യന്മാർ അവനോടുകൂടെ ഉണ്ടായിരുന്നു. അവൻ അവരോട് ചോദിച്ചു: “ജനക്കൂട്ടങ്ങൾ ഞാൻ ആരാണെന്നാണ് പറയുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്വകാര്യമായി” അല്ലെങ്കിൽ “ഏകാന്തമായി.” κατὰ μόνας എന്ന പ്രയോഗം, തികച്ചും ശാരീരികമായി ആരും സമീപത്തില്ലായിരുന്നു എന്നതിലുപരി, മറ്റുള്ളവരിൽനിന്ന് മാറിനിന്നുള്ള ഏകാന്തതയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ സംഭവവിവരണത്തിന്റെ തുടക്കത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി
  rationale: ഇത് ലൂക്കോസിന്റെ സാധാരണ ആഖ്യാനസൂത്രമാണ്. മലയാളത്തിൽ ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് ഇവിടെ ഭാരമുള്ളതാകുന്നതിനാൽ, കാലസൂചക ഉപവാക്യത്തിലൂടെ അതിന്റെ ആഖ്യാനധർമ്മം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: അവൻ ... പ്രാർഥിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐν സഹിതമുള്ള articular infinitive ഒരേസമയം നടക്കുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-കൊണ്ടിരിക്കുമ്പോൾ’ അതിന്റെ കാലപരവും തുടർച്ചാപരവുമായ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατὰ μόνας
  choice: തനിച്ച്
  rationale: ഈ പ്രയോഗത്തിന് ‘തനിച്ച്’ എന്നും ‘സ്വകാര്യമായി/ഒഴിഞ്ഞ സ്ഥലത്ത്’ എന്നും അർഥമാകാം. മുഖ്യപാഠത്തിൽ സംക്ഷിപ്തമായ സാധാരണ അർഥം നൽകി, സ്ഥലപരമായ ഏകാന്തതയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: ശിഷ്യന്മാർ അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: ലളിതമായ സഹവർത്തിത്വ അർഥം നേരിട്ട് നിലനിർത്തുന്നു; ശിഷ്യന്മാർ അടുത്തുണ്ടായിരുന്നുവെന്നോ പിന്നീട് വന്നുചേർന്നുവെന്നോ വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: ἐπηρώτησεν αὐτοὺς λέγων
  choice: അവൻ അവരോട് ചോദിച്ചു
  rationale: മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ട് ചോദിച്ചു’ എന്ന ശബ്ദാനുകരണം അനാവശ്യമാണ്; ‘ചോദിച്ചു’ തന്നിൽ സംസാരപ്രവർത്തി വ്യക്തമായതിനാൽ സ്വാഭാവികമായ ചുരുക്കം സ്വീകരിച്ചു.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: ജനക്കൂട്ടങ്ങൾ ഞാൻ ആരാണെന്നാണ് പറയുന്നത്?
  rationale: ഗ്രീക്കിലെ indirect-question ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ആരാണെന്നാണ്’ എന്ന പൂരകഘടനയിലൂടെ കൃത്യമായി നൽകുന്നു.
- source_word: οἱ ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: ‘ജനങ്ങൾ’ എന്ന പൊതുവായ പദത്തേക്കാൾ, ὄχλοι സൂചിപ്പിക്കുന്ന കൂട്ടങ്ങളെന്ന സാമൂഹിക ദൃശ്യം ‘ജനക്കൂട്ടങ്ങൾ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശു ‘തനിച്ച്’ പ്രാർഥിക്കുമ്പോഴും ശിഷ്യന്മാർ അവനോടുകൂടെ ഉണ്ടായിരുന്നുവെന്ന പ്രത്യക്ഷമായ സംഘർഷം
  choice: 'രണ്ട് പ്രസ്താവനകളും നേരിട്ട് നിലനിർത്തി: ‘തനിച്ച് ... ശിഷ്യന്മാർ അവനോടുകൂടെ ഉണ്ടായിരുന്നു.’'
  alternative: ‘സ്വകാര്യമായി’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുക, അല്ലെങ്കിൽ ശിഷ്യന്മാർ അടുത്തുണ്ടായിരുന്നുവെന്ന് വിശദീകരിച്ച് സംഘർഷം നീക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ഏകാന്തപ്രാർഥനയും ശിഷ്യന്മാരുടെ സാന്നിധ്യവും ചേർത്തുപറയുന്നു. അവരുടെ കൃത്യമായ സ്ഥാനം നിർണ്ണയിക്കാതെ ഈ ആഖ്യാനസൂക്ഷ്മത നിലനിർത്തുന്നത് മൂലപാഠത്തോടു കൂടുതൽ വിശ്വസ്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പ്രാർഥിക്കുക,’ ‘അവനോടുകൂടെ,’ ‘ജനക്കൂട്ടങ്ങൾ’ എന്നീ രൂപങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും തിരുവെഴുത്തിന്റെ ഗൗരവത്തിന് യോജിച്ചതുമാണ്. മൂലപാഠത്തിലെ പ്രത്യക്ഷമായ സംഘർഷം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കിയിട്ടില്ല.
