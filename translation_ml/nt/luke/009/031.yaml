  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: ml
  text: മഹത്ത്വത്തിൽ പ്രത്യക്ഷരായ അവർ, യെരൂശലേമിൽ യേശു പൂർത്തിയാക്കാനിരുന്ന തന്റെ പുറപ്പാടിനെക്കുറിച്ച് സംസാരിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പുറപ്പാട്” എന്ന പദം യേശുവിന്റെ മരണം, ഉയിർപ്പ്, സ്വർഗാരോഹണം എന്നിവയിലൂടെ സംഭവിക്കുന്ന വിടവാങ്ങലിനെ സൂചിപ്പിച്ചേക്കാം; ഇസ്രായേലിന്റെ പുറപ്പാടിനോടുള്ള അനുനാദവും ഇതിലുണ്ടാകാം.
    reason: ἔξοδος എന്ന ഗ്രീക്ക് പദത്തിന്റെ ബഹുവിധ സൂചനകൾ പ്രധാനവാചകത്തിൽ അമിതമായി വിശദീകരിക്കാതെ വായനക്കാരനു ലഭ്യമാക്കുന്നു.
lexical_decisions:
- source_word: ἐν δόξῃ
  choice: മഹത്ത്വത്തിൽ
  rationale: ദൈവിക തേജസ്സും മഹിമയും ഉൾക്കൊള്ളുന്ന δόξα എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἔλεγον
  choice: സംസാരിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ സംഭാഷണം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὴν ἔξοδον αὐτοῦ
  choice: അവന്റെ പുറപ്പാട്
  rationale: ἔξοδος എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘പുറപ്പെടൽ’ എന്ന അർഥവും പുറപ്പാട് സംഭവത്തോടുള്ള സാധ്യതയുള്ള അനുനാദവും സംരക്ഷിക്കുന്നു; ‘മരണം’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: πληροῦν
  choice: പൂർത്തിയാക്കുക
  rationale: ‘നിറവേറ്റുക/പൂർത്തിയാക്കുക’ എന്ന അർഥം നൽകുന്നു; യെരൂശലേമിൽ സംഭവിക്കാനിരുന്ന കാര്യത്തെ ദൈവിക ദൗത്യത്തിന്റെ പൂർത്തീകരണമായി തുറന്നുവെക്കുന്നു.
- source_word: ἐν Ἰερουσαλήμ
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἔξοδος എന്നതിന്റെ വ്യാഖ്യാനം
  choice: പുറപ്പാട്
  alternative: മരണം / വിടവാങ്ങൽ
  rationale: ഈ പദം യേശുവിന്റെ മരണം മാത്രമല്ല, മരണം, ഉയിർപ്പ്, സ്വർഗാരോഹണം എന്നിവ ഉൾക്കൊള്ളാവുന്ന പുറപ്പെടലിനെയും പുറപ്പാട് പ്രമേയത്തെയും സൂചിപ്പിച്ചേക്കാം. അതിനാൽ മൂലത്തിലെ സമ്പന്നമായ അവ്യക്തത നിലനിർത്തുന്നു.
- issue: πληροῦν എന്ന ക്രിയയുടെ ഭാവം
  choice: പൂർത്തിയാക്കാനിരുന്ന
  alternative: നിറവേറ്റാനിരുന്ന / സംഭവിപ്പിക്കാനിരുന്ന
  rationale: യേശു ഏറ്റുവാങ്ങുന്ന നിഷ്ക്രിയ സംഭവമെന്നതിലുപരി അവൻ പൂർത്തീകരിക്കുന്ന ദൗത്യം എന്ന മൂലഭാവം സംരക്ഷിക്കുന്നു; അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രപരിധി നിർബന്ധിച്ച് നിശ്ചയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യഘടന മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമത്തിലാക്കിയെങ്കിലും മൂലത്തിലെ തുടർച്ചയായ പ്രവർത്തനം, ‘മഹത്ത്വത്തിൽ’ എന്ന സ്ഥിതി, ‘പുറപ്പാട്’ എന്ന അർഥസാന്ദ്രത, ‘പൂർത്തിയാക്കുക’ എന്ന സജീവ ദൗത്യഭാവം എന്നിവ സംരക്ഷിച്ചു.
