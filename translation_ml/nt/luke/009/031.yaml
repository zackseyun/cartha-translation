    rationale: “യേശു യെരൂശലേമിൽ പൂർത്തിയാക്കാനിരുന്ന അവന്റെ പുറപ്പാട്” വ്യാകരണപരമായി ഗ്രഹിക്കാവുന്നതാണെങ്കിലും, “അവന്റെ” എന്ന രൂപം സമീപത്തെ ബഹുവചനവിഷയമായ “അവർ” എന്നതുമായ ബന്ധത്തെ ഒരു നിമിഷം അസ്പഷ്ടമാക്കാം. “യെരൂശലേമിൽ യേശു പൂർത്തിയാക്കാനിരുന്ന തന്റെ പുറപ്പാട്” യേശുവാണ് ‘പുറപ്പാടിന്റെ’ ഉടമയും പൂർത്തിയാക്കുന്നവനും എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
