revisions:
- from: അവർ മഹത്ത്വത്തിൽ പ്രത്യക്ഷരായി, യേശു യെരൂശലേമിൽ പൂർത്തിയാക്കാനിരുന്ന അവന്റെ പുറപ്പാടിനെക്കുറിച്ച് സംസാരിച്ചുകൊണ്ടിരുന്നു.[a]
