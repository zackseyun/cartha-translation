  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: ml
  text: ആ ശബ്ദം മുഴങ്ങിയപ്പോൾ, യേശു തനിച്ചായി കാണപ്പെട്ടു.[a] അവർ മൗനം പാലിച്ചു; തങ്ങൾ കണ്ട കാര്യങ്ങളിൽ ഒന്നും ആ ദിവസങ്ങളിൽ ആരോടും പറഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “യേശു മാത്രം ശേഷിച്ചു” / “യേശുവിനെ മാത്രമേ കണ്ടുള്ളൂ.” ഗ്രീക്കിൽ അക്ഷരാർഥം: “യേശു തനിച്ചായി കണ്ടെത്തപ്പെട്ടു” (അതായത്, “യേശു തനിച്ചായിരുന്നു എന്നു കണ്ടു”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: ആ ശബ്ദം ഉണ്ടായപ്പോൾ
  rationale: ἐν + articular infinitive സമയബന്ധം സൂചിപ്പിക്കുന്നു. 'ഉണ്ടായപ്പോൾ' എന്നത് ശബ്ദം കേൾപ്പെട്ട സംഭവത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുകയും 'വന്നപ്പോൾ' എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: φωνή
  choice: ശബ്ദം
  rationale: സന്ദർഭത്തിൽ ഇത് സ്വർഗീയമായി കേട്ട ഉച്ചാരണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ 'ശബ്ദം' എന്നത് കേൾക്കപ്പെട്ട ശബ്ദത്തെയും സംസാരശബ്ദത്തെയും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: യേശു തനിച്ചാണെന്ന് കണ്ടു
  rationale: അക്ഷരാർഥത്തിലുള്ള passive രൂപത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ കണ്ടെത്തൽ/കാണൽഭാവം നൽകുന്നു; മോശെയും ഏലിയാവും അപ്രത്യക്ഷരായതിനെ വ്യാഖ്യാനമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἐσίγησαν
  choice: മൗനം പാലിച്ചു
  rationale: അവർ ഒന്നും പറയാതെ ഇരുന്നുവെന്ന തുടർന്നുനിന്ന നിലയെ dignified, current Malayalam-ൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: ആരോടും പറഞ്ഞില്ല
  rationale: ἀπαγγέλλωയുടെ അറിയിക്കുക/പറയുക എന്ന അർഥം ഇവിടെ സാധാരണ വിവരണശൈലിയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: ഗ്രീക്കിലെ സമയസൂചന നേരിട്ട്, സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: തങ്ങൾ കണ്ട കാര്യങ്ങളിൽ ഒന്നും
  rationale: οὐδέν + partitive relative clause എന്ന ഘടനയുടെ അർഥബന്ധം സംരക്ഷിക്കുകയും മലയാളത്തിലെ ഇരട്ടനിഷേധം സ്വാഭാവികമായി ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സ്വർഗീയ ശബ്ദത്തിനു ശേഷം യേശു മാത്രം ഉണ്ടായിരുന്നതിന്റെ വിവരണാത്മകവും ദൈവശാസ്ത്രപരവുമായ സൂചന
  choice: '''യേശു തനിച്ചാണെന്ന് കണ്ടു'' എന്ന് വിവരണാത്മകമായി നിലനിർത്തുക'
  alternative: '''യേശു മാത്രം ശേഷിച്ചു'' / ''അവർ യേശുവിനെ മാത്രമേ കണ്ടുള്ളൂ'''
  rationale: വാക്യം സംഭവത്തിന്റെ ഫലം വിവരിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ അർഥം വിശദീകരിക്കുന്നില്ല. അതിനാൽ അധിക വ്യാഖ്യാനം ചേർക്കാതെ ഗ്രീക്കിലെ സംയമനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രണ്ട് ഘട്ടങ്ങൾ—ശബ്ദത്തിനുശേഷമുള്ള ദൃശ്യം, ശിഷ്യന്മാരുടെ മൗനം—വ്യക്തമായി വേർതിരിക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു.
