revisions:
- from: ആ ശബ്ദം ഉണ്ടായപ്പോൾ, യേശു തനിച്ചാണെന്ന് കണ്ടു.[a] അവർ മൗനം പാലിച്ചു; തങ്ങൾ കണ്ട കാര്യങ്ങളിൽ ഒന്നും ആ ദിവസങ്ങളിൽ ആരോടും പറഞ്ഞില്ല.
  to: ആ ശബ്ദം മുഴങ്ങിയപ്പോൾ, യേശു തനിച്ചായി കാണപ്പെട്ടു.[a] അവർ മൗനം പാലിച്ചു; തങ്ങൾ കണ്ട കാര്യങ്ങളിൽ ഒന്നും ആ ദിവസങ്ങളിൽ ആരോടും പറഞ്ഞില്ല.
  rationale: The revision resolves the subjectless active wording by using “യേശു തനിച്ചായി കാണപ്പെട്ടു,” which is natural in formal Malayalam narrative and preserves the Greek passive’s non-explicit observer. “മുഴങ്ങിയപ്പോൾ” expresses the occurrence of the heavenly voice naturally without adding theological interpretation. The second sentence is retained because it accurately conveys their silence and their telling no one anything they had seen.
