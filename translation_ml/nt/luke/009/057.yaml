id: LUK.9.57
reference: Luke 9:57
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: ml
  text: 'അവർ വഴിയിലൂടെ പോകുമ്പോൾ, ഒരാൾ അവനോട് പറഞ്ഞു: “നീ എവിടേക്കു പോയാലും ഞാൻ നിന്നെ അനുഗമിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: അവർ ... പോകുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തോടുകൂടിയ genitive absolute, പ്രധാനക്രിയയോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന യാത്രയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പോകുമ്പോൾ’ ഈ സമകാലികത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῇ ὁδῷ
  choice: വഴിയിലൂടെ
  rationale: യാത്രയുടെ യഥാർഥ പശ്ചാത്തലം വ്യക്തമായി നിലനിർത്തുകയും ലൂക്കോസിലെ യാത്രാപ്രമേയത്തിന്റെ സാധ്യതയുള്ള അനുരണനം അമിതമായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: εἶπέν τις
  choice: ഒരാൾ ... പറഞ്ഞു
  rationale: τις അനിശ്ചിതമായ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ലിംഗം മലയാളത്തിൽ ചേർക്കാതെ ‘ഒരാൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: πρὸς αὐτόν
  choice: അവനോട്
  rationale: സംസാരക്രിയയോടുകൂടിയ πρός എന്നതിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: Ἀκολουθήσω σοι
  choice: ഞാൻ നിന്നെ അനുഗമിക്കും
  rationale: ഭാവികാലം ഉദ്ദേശ്യവും പ്രതിബദ്ധതയും പ്രകടിപ്പിക്കുന്നു. ‘അനുഗമിക്കും’ എന്നത് ശാരീരികമായി പിന്നാലെ പോകുന്നതും ശിഷ്യത്വപരമായ അനുരണനവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: നീ എവിടേക്കു പോയാലും
  rationale: ὅπου + ἐάν + subjunctive നൽകുന്ന അനിശ്ചിത സാപേക്ഷ അർഥം ‘എവിടേക്കു ... പോയാലും’ സ്വാഭാവികമായി പകരുന്നു. ἀπέρχομαι-യിലെ ‘വിട്ടുപോകുക’ എന്ന സൂക്ഷ്മത ഇവിടെ നിർബന്ധമായി മുൻനിറുത്താതെ പൊതുവായ യാത്രാഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀκολουθέω എന്ന ക്രിയയിലെ ശിഷ്യത്വപരമായ അർഥസാന്ദ്രത
  choice: ‘അനുഗമിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി; വിശദീകരണം ചേർത്തില്ല
  alternative: ‘നിന്റെ ശിഷ്യനായി നിന്നെ അനുഗമിക്കും’
  rationale: ലൂക്കോസിൽ ഈ ക്രിയയ്ക്ക് ശിഷ്യത്വപ്രാധാന്യമുണ്ടെങ്കിലും, ‘ശിഷ്യനായി’ എന്നു ചേർക്കുന്നത് മൂലപാഠത്തിലെ ശാരീരിക പിന്തുടരലിന്റെയും ശിഷ്യത്വത്തിന്റെയും ഇരട്ട അനുരണനം വ്യാഖ്യാനിച്ച് തീർക്കും. ‘അനുഗമിക്കും’ രണ്ടും തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘അവൻ’ എന്ന സർവനാമം സന്ദർഭത്തിലെ യേശുവിനെ സൂചിപ്പിക്കുന്നതായിരുന്നാലും മൂലപാഠത്തിൽ പേരില്ലാത്തതിനാൽ പേര് ചേർത്തിട്ടില്ല. മൂലപാഠത്തിലെ വ്യത്യസ്ത വായനാസൂചനകൾ ഈ വാക്യത്തിന്റെ മലയാള അർഥത്തെ ഗണ്യമായി മാറ്റാത്തതിനാൽ അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല.
