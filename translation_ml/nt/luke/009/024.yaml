source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: ml
  text: കാരണം, തന്റെ ജീവൻ രക്ഷിക്കാൻ ആഗ്രഹിക്കുന്നവൻ അത് നഷ്ടപ്പെടുത്തും[a]; എന്നാൽ എനിക്കുവേണ്ടി തന്റെ ജീവൻ നഷ്ടപ്പെടുത്തുന്നവൻ അതിനെ രക്ഷിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തന്റെ പ്രാണൻ’ അല്ലെങ്കിൽ ‘തന്നെത്തന്നെ’; ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് ജീവൻ, പ്രാണൻ, അല്ലെങ്കിൽ സ്വയം എന്നർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: കാരണം, ... ആഗ്രഹിക്കുന്നവൻ
  rationale: ὃς ... ἂν എന്നത് പൊതുവായ, അനിശ്ചിത വ്യവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘...ആഗ്രഹിക്കുന്നവൻ’ അത് സ്വാഭാവികമായി നൽകുന്നു. γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം നിലനിർത്താൻ ‘കാരണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: തന്റെ ജീവൻ
  rationale: ψυχήയ്ക്ക് ജീവൻ, പ്രാണൻ, സ്വയം എന്നീ അർഥങ്ങൾ വരാം. ശിഷ്യത്വത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള ജീവൻ രക്ഷിക്കലും നഷ്ടപ്പെടുത്തലുമെന്ന വൈരുധ്യത്തിൽ ‘ജീവൻ’ ഉടനടിയുള്ള അർഥത്തിന് ഏറ്റവും യോജിക്കുന്നു; ‘തന്റെ’ എന്നത് കർത്താവിലേക്കുള്ള പ്രത്യാവർത്തകബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: σῶσαι / σώσει
  choice: രക്ഷിക്കാൻ / രക്ഷിക്കും
  rationale: ആദ്യത്തെയും അവസാനത്തെയും σῴζω രൂപങ്ങൾ ഒരേ പദകുടുംബത്തിലൂടെ പരിഭാഷപ്പെടുത്തി വാക്യത്തിലെ വൈരുധ്യവും ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: നഷ്ടപ്പെടുത്തും / നഷ്ടപ്പെടുത്തുന്നവൻ
  rationale: ἀπόλλυμι ഇവിടെ ‘നഷ്ടപ്പെടുക/നഷ്ടപ്പെടുത്തുക’ എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ജീവനെ കർമമായി നിലനിർത്തുന്ന ‘നഷ്ടപ്പെടുത്തുക’ ഗ്രീക്ക് സകർമക ഘടനയും വാക്യസമമിതിയും സംരക്ഷിക്കുന്നു.
- source_word: ἕνεκεν ἐμοῦ
  choice: എനിക്കുവേണ്ടി
  rationale: ἕνεκεν + സമ്പർക്കവിഭക്തി കാരണം അല്ലെങ്കിൽ പ്രേരണം സൂചിപ്പിക്കുന്നു; ‘എനിക്കുവേണ്ടി’ യേശുവിനോടുള്ള വ്യക്തിപരമായ ശിഷ്യത്വകേന്ദ്രം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οὗτος σώσει αὐτήν
  choice: അതിനെ രക്ഷിക്കും
  rationale: οὗτος നൽകുന്ന വ്യക്തിനിർദ്ദേശം മലയാളത്തിലെ അനുബന്ധവാക്യഘടനയിൽ കർത്താവിലൂടെ വ്യക്തമാണ്; ‘അവൻ തന്നെയാണ്’ എന്നു ചേർത്താൽ അനാവശ്യ ഊന്നൽ തോന്നാം. αὐτήν മുൻപുള്ള ‘ജീവൻ’ എന്നതിലേക്കു മടങ്ങുന്നതിനാൽ ‘അതിനെ’ എന്നു നൽകി.
theological_decisions:
- issue: ψυχή എന്ന പദത്തിന്റെ അർഥം
  choice: ജീവൻ
  alternative: പ്രാണൻ; ആത്മാവ്; സ്വയം
  rationale: ഉടനടിയുള്ള സന്ദർഭം സ്വയം നിഷേധിക്കൽ, ശിഷ്യത്വം, ജീവൻ രക്ഷിക്കുകയോ നഷ്ടപ്പെടുത്തുകയോ ചെയ്യുന്ന വൈരുധ്യം എന്നിവയാണ്. ‘ജീവൻ’ എന്നത് ψυχήയെ അമൂർത്തമായ ആത്മാവിൽ മാത്രം പരിമിതപ്പെടുത്താതെ സന്ദർഭത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: പുരുഷലിംഗ ഏകവചനത്തിന്റെ പൊതുവായ പ്രയോഗം
  choice: '...ആഗ്രഹിക്കുന്നവൻ / ...നഷ്ടപ്പെടുത്തുന്നവൻ; തന്റെ ജീവൻ'
  alternative: ആരെങ്കിലും; അവരുടെ ജീവൻ
  rationale: ഗ്രീക്കിലെ ഏകവചന പൊതുപ്രതിനിധി ഘടന മലയാളത്തിലെ സ്വാഭാവികമായ ‘...വൻ’ രൂപത്തിലും ‘തന്റെ’ എന്ന പ്രത്യാവർത്തക സർവനാമത്തിലുമായി നിലനിർത്തി; അർഥം പുരുഷന്മാർക്ക് മാത്രമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: οὗτος എന്നതിലെ ഊന്നൽ
  choice: പ്രത്യേക പ്രകടകസർവനാമം ചേർക്കാതെ അനുബന്ധവാക്യഘടനയിലൂടെ നൽകുക
  alternative: അവൻ തന്നെയാണ് അതിനെ രക്ഷിക്കുക
  rationale: ഗ്രീക്കിൽ οὗτος മുൻവ്യവസ്ഥ നിറവേറ്റുന്ന വ്യക്തിയെ ചൂണ്ടിക്കാണിക്കുന്നു. മലയാളത്തിൽ ‘...നഷ്ടപ്പെടുത്തുന്നവൻ അതിനെ രക്ഷിക്കും’ എന്ന ഘടന ആ തിരിച്ചറിയൽ വ്യക്തമായി നൽകുന്നു; ‘തന്നെയാണ്’ എന്നത് മൂലത്തിൽ ആവശ്യമായതിലധികം വിരുദ്ധ ഊന്നൽ സൃഷ്ടിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലവാക്യത്തിലെ വിശദീകരണബന്ധം, വിരുദ്ധസമാന്തര്യം, ‘രക്ഷിക്കുക—നഷ്ടപ്പെടുത്തുക—രക്ഷിക്കുക’ എന്ന പദപ്രതിധ്വനി എന്നിവ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
