id: LUK.9.37
reference: Luke 9:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο ⸀δὲ τῇ ἑξῆς ἡμέρᾳ κατελθόντων αὐτῶν ἀπὸ τοῦ ὄρους συνήντησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: ml
  text: പിറ്റേന്ന്[a], അവർ മലയിൽനിന്ന് ഇറങ്ങിവന്നപ്പോൾ, വലിയൊരു ജനക്കൂട്ടം അവനെ എതിരേറ്റു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അടുത്ത ദിവസം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ ഈ പ്രയോഗം കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ആഖ്യാനസംക്രമണമാണ്; ‘പിറ്റേന്ന്’ എന്നു തുടങ്ങുന്നത് ആ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി വഹിക്കുന്നു. ‘സംഭവിച്ചു’ എന്നു ചേർത്താൽ അനാവശ്യമായി സംഭവത്തെ മുൻനിരയിൽ കൊണ്ടുവരും.
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: പിറ്റേന്ന്
  rationale: അടുത്തതായി വന്ന ദിവസത്തെ സൂചിപ്പിക്കുന്ന കാലദത്തിവ് മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: κατελθόντων αὐτῶν
  choice: അവർ ... ഇറങ്ങിവന്നപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് നൽകുന്ന സാഹചര്യപശ്ചാത്തലവും മുഖ്യക്രിയയ്ക്കുമുമ്പ് പൂർത്തിയായ ഇറങ്ങിവരലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπὸ τοῦ ὄρους
  choice: മലയിൽനിന്ന്
  rationale: ὄρος എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ സാധാരണവും യോജിച്ചതുമായ അർഥം ‘മല’ ആണ്.
- source_word: συνήντησεν αὐτῷ
  choice: അവനെ എതിരേറ്റു
  rationale: കൂട്ടം അവനെ സമീപിച്ച് കണ്ടുമുട്ടിയെന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഇവിടെ ‘എതിരേറ്റു’ എന്നത് സ്വീകരണത്തിന്റെ പ്രത്യേക ഭാവം നിർബന്ധമായി ചേർക്കാതെ നേരിട്ടുവന്നുകണ്ടതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ὄχλος πολύς
  choice: വലിയൊരു ജനക്കൂട്ടം
  rationale: ജനക്കൂട്ടത്തിന്റെ വലുപ്പം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ സാഹചര്യബന്ധവും വാക്യത്തിന്റെ ലളിതമായ മുന്നേറ്റവും സംരക്ഷിച്ചിട്ടുണ്ട്.
