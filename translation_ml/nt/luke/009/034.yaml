source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: ml
  text: അവൻ ഈ കാര്യങ്ങൾ പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ, ഒരു മേഘം പ്രത്യക്ഷപ്പെട്ട് അവരെ മൂടിത്തുടങ്ങി[a][b]. അവർ മേഘത്തിനുള്ളിലേക്കു പ്രവേശിച്ചപ്പോൾ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഒരു മേഘം വന്ന് അവരെ മൂടി.” ക്രിയയെ പ്രവർത്തനം ആരംഭിച്ചു എന്ന സൂചന കൂടാതെ കൂടുതൽ ലളിതമായി വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ മേഘം ദൈവസാന്നിധ്യം പ്രത്യക്ഷമാകുന്ന പഴയനിയമ സംഭവങ്ങളെ ഓർമിപ്പിക്കുന്നതാകാം; എന്നാൽ ഈ വാക്യം അത് തുറന്നു പറയുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: ബഹുവചനമായ ഗ്രീക്ക് പ്രയോഗം പത്രോസ് തൊട്ടുമുമ്പ് പറഞ്ഞ വാക്കുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ബഹുവചനമായി നിലനിർത്തുന്നു.
- source_word: αὐτοῦ λέγοντος
  choice: അവൻ ... പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപമുള്ള genitive absolute സമകാലികവും തുടരുന്നതുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളരൂപം അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐγένετο νεφέλη
  choice: ഒരു മേഘം പ്രത്യക്ഷപ്പെട്ടു
  rationale: മേഘത്തിന്റെ ഉദയമോ വരവോ വിവരിക്കുന്ന പ്രയോഗമാണിത്; അതിന്റെ ഉത്ഭവത്തെക്കുറിച്ച് അധികമായി വ്യാഖ്യാനിക്കാതെ സംഭവത്തിന്റെ ആരംഭം അറിയിക്കുന്നു.
- source_word: ἐπεσκίαζεν
  choice: മൂടിത്തുടങ്ങി
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ പുരോഗമനമോ ആരംഭസൂചനയോ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. മേഘം അവരെ ആവരണം ചെയ്യുന്ന ദൃശ്യവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: αὐτούς
  choice: അവരെ
  rationale: ഗ്രീക്കിലെ സർവനാമത്തിന്റെ നിർവചിക്കാത്ത പരാമർശം അതേപടി നിലനിർത്തുന്നു; ആരെയെല്ലാം ഉൾക്കൊള്ളുന്നു എന്ന് വിവർത്തനം പ്രത്യേകം തീർപ്പാക്കുന്നില്ല.
- source_word: ἐφοβήθησαν
  choice: ഭയപ്പെട്ടു
  rationale: ഭയം ഉണ്ടായതിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ കഥനരൂപത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς
  choice: അവർ ... പ്രവേശിച്ചപ്പോൾ
  rationale: ἐν സഹിതമുള്ള articular infinitive സമകാലിക സമയബന്ധം പ്രകടിപ്പിക്കുന്നു; accusative subject മലയാളത്തിൽ വാക്യകർത്താവായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς τὴν νεφέλην
  choice: മേഘത്തിനുള്ളിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ചലനം വ്യക്തമായി നിലനിർത്തുന്നു; മേഘത്തിന്റെ കീഴിലേക്കെന്നാക്കി ദുർബലപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: മേഘത്തിന്റെ സ്വഭാവവും പ്രവർത്തനവും
  choice: പ്രധാന പാഠത്തിൽ മേഘത്തെ ദൈവസാന്നിധ്യമായി നേരിട്ട് തിരിച്ചറിയാതെ, അത് പ്രത്യക്ഷപ്പെട്ട് അവരെ മൂടിയതായി വിവരണാത്മകമായി നൽകുന്നു.
  alternative: മേഘത്തെ മഹത്വമേഘമോ ദൈവസാന്നിധ്യമോ ആയി പ്രധാന പാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: പശ്ചാത്തലം പഴയനിയമത്തിലെ ദൈവപ്രത്യക്ഷതാ ദൃശ്യങ്ങളെ ശക്തമായി ഓർമിപ്പിക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യം തന്നെ ആ തിരിച്ചറിയൽ പ്രസ്താവിക്കുന്നില്ല; അതിനാൽ സൂചന അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. “മൂടിത്തുടങ്ങി” സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ഗ്രീക്ക് imperfect-ന്റെ പുരോഗമന/ആരംഭസാധ്യതയും മേഘം ആവരണം ചെയ്യുന്ന ദൃശ്യവും നൽകുന്നു. സർവനാമങ്ങളുടെ പരാമർശം വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തിയിട്ടില്ല.
