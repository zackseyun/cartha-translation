id: LUK.9.49
reference: Luke 9:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: ml
  text: 'അപ്പോൾ യോഹന്നാൻ മറുപടി പറഞ്ഞു: “നാഥാ, അങ്ങയുടെ നാമത്തിൽ ഭൂതങ്ങളെ പുറത്താക്കുന്ന ഒരാളെ ഞങ്ങൾ കണ്ടു. അയാൾ ഞങ്ങളോടൊപ്പം അനുഗമിക്കുന്നില്ല[a] എന്നതിനാൽ ഞങ്ങൾ അയാളെ തടയാൻ ശ്രമിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അയാൾ ഞങ്ങളെ അനുഗമിക്കുന്നില്ല.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ഞങ്ങളോടൊപ്പം’ എന്നാണ്; അയാൾ ശിഷ്യന്മാരുടെ സംഘത്തിന്റെ ഭാഗമായിരുന്നില്ല എന്നതാകാം ഇതിന്റെ സൂചന.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: അപ്പോൾ യോഹന്നാൻ പറഞ്ഞു
  rationale: δέ സഹിതമുള്ള ഈ പ്രയോഗം കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന സ്വാഭാവിക പ്രതികരണസൂചനയാണ്. മലയാളത്തിൽ ‘അപ്പോൾ ... പറഞ്ഞു’ എന്നത് മറുപടിയുടെ ഭാവവും ആഖ്യാനത്തിന്റെ ഒഴുക്കും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἐπιστάτα
  choice: നാഥാ
  rationale: ലൂക്കൊസിൽ ശിഷ്യന്മാർ യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ഉപയോഗിക്കുന്ന ഈ പദം അധികാരവും നേതൃത്വവും സൂചിപ്പിക്കുന്നു. ‘നാഥാ’ ആ ആദരവും അധികാരബന്ധവും നിലനിർത്തുന്നു; ‘ഗുരോ’ എന്നത് അധ്യാപകഭാവത്തിലേക്ക് മാത്രം ചുരുങ്ങാൻ ഇടയുണ്ട്.
- source_word: εἴδομέν τινα
  choice: ഒരാളെ ഞങ്ങൾ കണ്ടു
  rationale: τινα അനിശ്ചിതമായ ഒരാളെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘ഒരാളെ’ സ്വാഭാവികവും ആവശ്യത്തിലധികം വ്യക്തീകരിക്കാത്തതുമാണ്.
- source_word: ἐν τῷ ὀνόματί σου
  choice: അങ്ങയുടെ നാമത്തിൽ
  rationale: യേശുവിന്റെ നാമത്തിന്റെ അടിസ്ഥാനത്തിലോ അധികാരത്തിലോ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. ‘നാമത്തിൽ’ മൂലത്തിലെ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്ന പതിവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: ഭൂതങ്ങളെ പുറത്താക്കുന്ന
  rationale: ἐκβάλλω ഇവിടെ ഭൂതോച്ചാടനസന്ദർഭത്തിൽ പുറത്താക്കുക എന്ന അർഥത്തിലാണ്. ‘ഭൂതങ്ങളെ പുറത്താക്കുക’ വ്യക്തവും പരിചിതവുമായ ബൈബിൾ ഭാഷയാണ്.
- source_word: ἐκωλύομεν αὐτόν
  choice: ഞങ്ങൾ അയാളെ തടയാൻ ശ്രമിച്ചു
  rationale: അപൂർണഭൂതകാലരൂപമായ ἐκωλύομεν തുടരുന്ന പ്രവൃത്തിയെയോ ശ്രമത്തെയോ സൂചിപ്പിക്കാം. ‘തടയാൻ ശ്രമിച്ചു’ എന്നത് അയാളെ വിജയകരമായി തടഞ്ഞുവെന്ന് അനാവശ്യമായി ഉറപ്പിക്കാതെ ആ ഭാവം പകർത്തുന്നു.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: അയാൾ ഞങ്ങളോടൊപ്പം അങ്ങയെ അനുഗമിക്കാത്തതിനാൽ
  rationale: μεθ’ ἡμῶν എന്നത് വ്യക്തമായി ‘ഞങ്ങളോടൊപ്പം’ എന്നാണ്. മലയാളത്തിൽ ക്രിയയുടെ ലക്ഷ്യം വ്യക്തമാക്കാൻ ‘അങ്ങയെ’ ചേർക്കുന്നത്, പരാതി അയാൾ യേശുവിനെ നിരസിച്ചു എന്നല്ല, ശിഷ്യസംഘത്തോടൊപ്പം യേശുവിനെ അനുഗമിച്ചില്ല എന്നാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വബന്ധത്തെക്കുറിച്ചുള്ള പരാതിയിലെ അർഥസാധ്യത
  choice: ‘അയാൾ ഞങ്ങളോടൊപ്പം അങ്ങയെ അനുഗമിക്കാത്തതിനാൽ’
  alternative: ‘അയാൾ ഞങ്ങളെ അനുഗമിക്കാത്തതിനാൽ’
  rationale: ഗ്രീക്കിലെ μεθ’ ἡμῶν എന്നത് ‘ഞങ്ങളോടൊപ്പം’ എന്ന കൂട്ടായ്മാഭാവം നേരിട്ട് നൽകുന്നു. അതിനാൽ ആൾ യേശുവിനെ നിരസിച്ചുവെന്ന് പറയാതെ, പന്ത്രണ്ടുപേരുടെ കൂട്ടത്തിൽ ചേർന്ന് അനുഗമിച്ചില്ല എന്ന പരാതിയിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യേശുവിനോടുള്ള ആദരസൂചകമായി ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു. മൂലത്തിൽ പ്രത്യേകം പാഠഭേദമോ പ്രസിദ്ധീകരണത്തിന് അനിവാര്യമായ വിശദീകരണകുറിപ്പോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
