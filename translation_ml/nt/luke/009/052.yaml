  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: ml
  text: അവൻ തനിക്കു മുമ്പായി ദൂതന്മാരെ അയച്ചു. അവർ പോയി അവനുവേണ്ട ഒരുക്കങ്ങൾ ചെയ്യാൻ ശമര്യരുടെ ഒരു ഗ്രാമത്തിൽ പ്രവേശിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ശമര്യഗ്രാമത്തിൽ.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘ശമര്യരുടെ ഒരു ഗ്രാമത്തിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: ἀποστέλλω എന്ന ക്രിയയുടെ ഭൂതകാലപ്രയോഗം സ്വാഭാവികമായും നേരിട്ടും അറിയിക്കുന്നു.
- source_word: ἀγγέλους
  choice: ദൂതന്മാരെ
  rationale: ഇവിടെ ഗ്രാമത്തിലേക്ക് മുൻകൂട്ടി അയക്കപ്പെട്ട മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ‘ദൂതന്മാർ’ ഈ അർഥം നൽകുന്നു, എങ്കിലും പദത്തിന്റെ വിശാലമായ പ്രയോഗപരിധിയും നിലനിർത്തുന്നു.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: തനിക്കു മുമ്പായി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്നുള്ള ഗ്രീക്ക് ശൈലിയുടെ സന്ദർഭോചിതമായ അർഥം, അവനേക്കാൾ മുന്നേ അയച്ചു എന്നതാണ്; ‘തനിക്കു മുമ്പായി’ മലയാളത്തിൽ സ്വാഭാവികവും അടുപ്പമുള്ളതുമാണ്.
- source_word: πορευθέντες
  choice: അവർ പോയി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃതന്തം മലയാളത്തിൽ തുടർച്ചയായ രണ്ട് ക്രിയകളായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰσῆλθον
  choice: പ്രവേശിച്ചു
  rationale: ഗ്രാമത്തിനകത്തേക്കു കടന്നതിനെ കൃത്യമായി സൂചിപ്പിക്കുന്ന മാന്യവും സാധാരണവുമായ മലയാളപ്രയോഗം.
- source_word: κώμην
  choice: ഒരു ഗ്രാമത്തിൽ
  rationale: κώμη ചെറുകുടിയിരിപ്പിനെയോ ഗ്രാമത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ഗ്രാമം’ ഏറ്റവും കൃത്യമായ സമാനപദമാണ്.
- source_word: Σαμαριτῶν
  choice: ശമര്യരുടെ
  rationale: ഗ്രീക്കിലെ ബഹുവചന ഷഷ്ഠിവിഭക്തി നേരിട്ട് നിലനിർത്തി, ശമര്യർ വസിക്കുന്നതോ അവരുടേതോ ആയ ഗ്രാമം എന്ന ബന്ധം തുറന്നുവെക്കുന്നു.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: അവനുവേണ്ട ഒരുക്കങ്ങൾ ചെയ്യാൻ
  rationale: ὡς സഹിതമുള്ള infinitive ഇവിടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ ഒരുക്കത്തിന്റെ നിർദ്ദിഷ്ട വിഷയം പറയാത്തതിനാൽ മലയാളത്തിലും അത് ചേർക്കുന്നില്ല.
