  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പ്രവർത്തനക്രമം ‘അവർ പോയി ... പ്രവേശിച്ചു’ എന്നു നിലനിർത്തി. ‘ശമര്യരുടെ ഒരു ഗ്രാമം’ എന്ന ഘടന മൂലഭാഷയിലെ genitive plural സംരക്ഷിക്കുന്നു.
