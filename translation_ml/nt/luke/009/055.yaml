  text: στραφεὶς δὲ ἐπετίμησεν ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/055.yaml
  text: But he turned and rebuked them[a].
translation:
  language: ml
  text: എന്നാൽ അവൻ തിരിഞ്ഞ് അവരെ ശാസിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പിൽക്കാലത്തെ ചില കൈയെഴുത്തുപ്രതികൾ ഇങ്ങനെ കൂട്ടിച്ചേർക്കുന്നു: ‘അവൻ പറഞ്ഞു: “നിങ്ങൾ ഏതു വിധത്തിലുള്ള ആത്മാവിന്റേതാണെന്ന് നിങ്ങൾ അറിയുന്നില്ല; മനുഷ്യപുത്രൻ വന്നത് മനുഷ്യരുടെ ജീവൻ നശിപ്പിക്കാനല്ല, രക്ഷിക്കാനാണ്.”’'
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: തിരിഞ്ഞ്
  rationale: στρέφω എന്ന ക്രിയയുടെ aorist participle ഇവിടെ ശിഷ്യന്മാരുടെ നേരെ യേശു തിരിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തിരിഞ്ഞ്’ എന്നത് പങ്കുപ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: δέ മുൻവാക്യത്തിലെ ശിഷ്യന്മാരുടെ അഭ്യർഥനയോടുള്ള ലഘുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു. ആ ബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: ἐπετίμησεν
  choice: ശാസിച്ചു
  rationale: ἐπιτιμάω ശക്തമായ വാക്കാലുള്ള തിരുത്തലിനെയോ ശകാരത്തെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ അതിരുകടന്ന കടുപ്പം ചേർക്കാതെ യേശുവിന്റെ ഉറച്ച തിരുത്തൽ വ്യക്തമാക്കാൻ ‘ശാസിച്ചു’ അനുയോജ്യമാണ്.
- source_word: αὐτοῖς
  choice: അവരെ
  rationale: ഗ്രീക്കിൽ ദത്തിവ് ബഹുവചനമാണെങ്കിലും മലയാളത്തിൽ ‘ശാസിക്കുക’ എന്ന ക്രിയ സാധാരണയായി നേരിട്ടുള്ള കർമത്തോടെയാണ് ഉപയോഗിക്കുന്നത്. സന്ദർഭത്തിൽ ഇത് യാക്കോബിനെയും യോഹന്നാനെയും, അല്ലെങ്കിൽ അഭിസംബോധന ചെയ്യപ്പെട്ട ശിഷ്യന്മാരെയും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പിൽക്കാല കൈയെഴുത്തുപ്രതികളിലുള്ള ദീർഘമായ പാഠവികാസം
  choice: 'SBLGNT-യിലെ ഹ്രസ്വപാഠം മാത്രം മുഖ്യവാചകത്തിൽ വിവർത്തനം ചെയ്തു: ‘എന്നാൽ അവൻ തിരിഞ്ഞ് അവരെ ശാസിച്ചു.’'
  alternative: '‘എന്നാൽ അവൻ തിരിഞ്ഞ് അവരെ ശാസിച്ചുകൊണ്ട് പറഞ്ഞു: “നിങ്ങൾ ഏതു തരത്തിലുള്ള ആത്മാവിനാണ് വിധേയരെന്ന് നിങ്ങൾ അറിയുന്നില്ല; മനുഷ്യപുത്രൻ വന്നത് മനുഷ്യരുടെ ജീവൻ നശിപ്പിക്കാനല്ല, രക്ഷിക്കാനാണ്.”’'
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് സ്രോതസ്സിൽ ഹ്രസ്വപാഠം മാത്രമേയുള്ളൂ. ദീർഘവാക്യം പിൽക്കാല കൈയെഴുത്തുപ്രതികളിലെ സുപരിചിതമായ പാഠഭേദമായതിനാൽ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘ശാസിച്ചു’ ഉറച്ച വാക്കാലുള്ള തിരുത്തൽ സ്വാഭാവികമായി നൽകുന്നു; പാഠഭേദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഉള്ളടക്കം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
