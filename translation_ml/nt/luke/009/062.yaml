id: LUK.9.62
reference: Luke 9:62
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു പറഞ്ഞു: “കലപ്പയിൽ കൈവെച്ചശേഷം പിന്നിലേക്കു നോക്കുന്ന ആരും ദൈവരാജ്യത്തിന് അനുയോജ്യനല്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അനുയോജ്യൻ” എന്നതിന് “നന്നായി യോജിച്ചവൻ” അഥവാ “ഉപയോഗപ്രദൻ” എന്നും അർത്ഥമാകാം. ഇവിടെ ദൈവരാജ്യത്തിനുള്ള യോജ്യതയാണ് ഉദ്ദേശിക്കുന്നത്; അന്തിമരക്ഷയെക്കുറിച്ചുള്ള കൂടുതൽ നിർദിഷ്ടമായ നിഗമനം പദംതന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻപുള്ള പ്രസ്താവനയോടുള്ള യേശുവിന്റെ തിരുത്തൽസ്വഭാവമുള്ള പ്രതികരണത്തിലെ മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: Οὐδεὶς
  choice: ആരും ... അല്ല
  rationale: ലിംഗഭേദമില്ലാതെ സകലരെയും ഉൾക്കൊള്ളുന്ന നിഷേധത്തിന്റെ സർവത്രിക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: കലപ്പയിൽ കൈവെച്ചശേഷം
  rationale: ഉഴവ് ആരംഭിക്കുന്ന നിർണായക പ്രവൃത്തിയും അതിനുശേഷമുള്ള പിന്നോട്ടുനോട്ടവും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കിക്കൊണ്ട് കാർഷിക ദൃശ്യം നിലനിർത്തുന്നു.
- source_word: ἄροτρον
  choice: കലപ്പ
  rationale: ഉഴവിനുള്ള ഉപകരണത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും മനസ്സിലാകുന്നതുമായ മലയാളപദമാണ്.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: പിന്നിലേക്കു നോക്കുന്ന
  rationale: തുടർച്ചയായോ സ്വഭാവപരമായോ ഉള്ള പിന്നോട്ടുനോട്ടം പ്രകടമാക്കുകയും വിഭജിതമായ പ്രതിബദ്ധതയുടെ രൂപകസാധ്യത തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: εὔθετός
  choice: അനുയോജ്യൻ
  rationale: യോഗ്യത, പ്രയോജനക്ഷമത, യോജ്യത എന്നിവയുടെ അർത്ഥപരിധി അനാവശ്യമായി നൈതിക അർഹതയിലേക്കോ അന്തിമരക്ഷയിലേക്കോ ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിന്
  rationale: εὔθετος എന്ന വിശേഷണത്തോടു ചേർന്ന ദത്തിവ് ബന്ധം സ്വാഭാവികമായി നൽകുകയും βασιλεία എന്നതിന് പതിവായ ദൈവരാജ്യം എന്ന രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ എന്നതിന്റെ സൂചന
  choice: ദൈവരാജ്യത്തിന് അനുയോജ്യനല്ല
  alternative: ദൈവരാജ്യത്തിൽ പ്രവേശിക്കാൻ അർഹനല്ല; ദൈവരാജ്യത്തിന്റെ സേവനത്തിന് പ്രയോജനപ്പെടുന്നില്ല
  rationale: ഗ്രീക്ക് പദം യോജ്യതയെയോ അനുയോജ്യതയെയോ സൂചിപ്പിക്കുന്നു. അതുകൊണ്ട് അന്തിമരക്ഷയിൽനിന്നുള്ള പുറത്താക്കലോ ശുശ്രൂഷാപ്രയോജനമോ മാത്രം എന്നു നിർണയിക്കാതെ, ശിഷ്യത്വത്തിലെ അവിഭക്ത പ്രതിബദ്ധതയെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കലപ്പയിൽ കൈവെച്ചശേഷം’ എന്ന പ്രയോഗം കാർഷികരൂപകം വ്യക്തമായി സൂക്ഷിക്കുന്നു; ‘അനുയോജ്യൻ’ εὔθετος എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും നിലനിർത്തുന്നു.
