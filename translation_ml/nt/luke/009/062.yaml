  terminology: “യേശു,” “കലപ്പ,” “ദൈവരാജ്യം,” and “അനുയോജ്യൻ” are suitable standard choices. “അനുയോജ്യൻ” retains the semantic range of εὔθετος without importing a narrower doctrinal interpretation.
