source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἀνὴρ ἀπὸ τοῦ ὄχλου ⸀ἐβόησεν λέγων· Διδάσκαλε, δέομαί σου ἐπιβλέψαι ἐπὶ τὸν υἱόν μου, ὅτι μονογενής ⸂μοί ἐστιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: ml
  text: 'ഇതാ[a], ജനക്കൂട്ടത്തിൽനിന്ന് ഒരു മനുഷ്യൻ ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “ഗുരുവേ, എന്റെ മകനെ നോക്കണമേ എന്നു ഞാൻ അങ്ങയോടു അപേക്ഷിക്കുന്നു; കാരണം, അവൻ എന്റെ ഏകമകനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ ഏകസന്താനമാണ്” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അവൻ പിതാവിന് ഒരേയൊരു സന്താനമാണെന്ന ആശയമാണ് ഉള്ളത്; കുട്ടിയെ ഇതിനകം ‘മകൻ’ എന്നു വിളിച്ചിരിക്കുന്നതിനാൽ രണ്ടു പരിഭാഷകളും സാധ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും ആഖ്യാനത്തിലെ പുതിയ സംഭവത്തിലേക്ക് വായനക്കാരനെ നയിക്കുകയും ചെയ്യുന്ന ഗ്രീക്ക് വ്യവഹാരസൂചകത്തിന്റെ ബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνὴρ
  choice: ഒരാൾ
  rationale: മലയാളത്തിൽ ‘ഒരാൾ’ സ്വാഭാവികമാണ്; തുടർന്ന് വരുന്ന പിതാവിന്റെ വാക്കുകൾ ആ വ്യക്തി പുരുഷനാണെന്ന് സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു. ‘ഒരു മനുഷ്യൻ’ എന്നത് ഇവിടെ താരതമ്യേന കൃത്രിമമാണ്.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: ജനക്കൂട്ടത്തിൽനിന്ന്
  rationale: ആ മനുഷ്യൻ കൂടിനിന്ന ജനങ്ങളിൽ ഒരാളായിരുന്നുവെന്ന ഉറവിടവാചകത്തിന്റെ ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐβόησεν λέγων
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: ഉച്ചത്തിലുള്ള അടിയന്തര അഭ്യർഥനയും participial ബന്ധവും മലയാളത്തിലെ സ്വാഭാവിക ഏകക്രിയാപ്രയോഗത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: διδάσκαλος എന്നതിന്റെ അധ്യാപകസംബന്ധിയായ നേരിട്ടുള്ള അർഥം നൽകുന്ന, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ സംബോധന.
- source_word: δέομαί σου
  choice: ഞാൻ അങ്ങയോട് അപേക്ഷിക്കുന്നു
  rationale: സാധാരണ ചോദിക്കലിനെക്കാൾ ശക്തമായ വിനീതവും ആത്മാർഥവുമായ യാചന പ്രകടിപ്പിക്കുന്നു; ‘അങ്ങയോട്’ സംബോധനയിലെ ആദരം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐπιβλέψαι ἐπὶ
  choice: കരുണയോടെ നോക്കണമേ
  rationale: വെറും ദൃഷ്ടിപതിപ്പിക്കലല്ല, ശ്രദ്ധയും സഹായകമായ പരിഗണനയും നൽകണമെന്ന സന്ദർഭസൂചന സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു. ‘കരുണയോടെ’ എന്നത് ക്രിയയുടെ സന്ദർഭോചിതമായ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: τὸν υἱόν μου
  choice: എന്റെ മകനെ
  rationale: ഉറവിടത്തിലെ ബന്ധവും ലിംഗസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: μονογενής μοί ἐστιν
  choice: അവൻ എന്റെ ഏകമകനാണ്
  rationale: μονογενής ഇവിടെ പിതാവിനുള്ള ഒരേയൊരു സന്തതിയെയോ ഒരേയൊരു മകനെയോ സൂചിപ്പിക്കാം. ഇതിനുമുമ്പ് υἱός എന്ന് വ്യക്തമാക്കിയതിനാൽ ‘ഏകമകൻ’ മലയാളത്തിൽ സ്വാഭാവികവും ഉറവിടത്തിന് അടുത്തതുമാണ്; മറ്റൊരു സാധ്യമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
