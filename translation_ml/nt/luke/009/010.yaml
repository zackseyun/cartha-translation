reference: Luke 9:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: ml
  text: അപ്പൊസ്തലന്മാർ മടങ്ങിവന്ന്, തങ്ങൾ ചെയ്തതെല്ലാം യേശുവിനോടു വിവരിച്ചു. അവരെ കൂട്ടിക്കൊണ്ട്, അവൻ ബേത്ത്സയിദ എന്നു പേരുള്ള ഒരു പട്ടണത്തിലേക്ക് മറ്റുള്ളവരിൽനിന്ന് വേറിട്ട്[a] പിൻവാങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വകാര്യമായി” അല്ലെങ്കിൽ “മാറി.” ഈ പ്രയോഗം മറ്റുള്ളവരിൽനിന്നുള്ള പിൻവാങ്ങലിനെ സൂചിപ്പിക്കുന്നു; യേശു പൂർണമായും തനിച്ചായിരുന്നു എന്ന് നിർബന്ധമായി അർഥമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: മടങ്ങിവന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയും സംഭവക്രമവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἱ ἀπόστολοι
  choice: അപ്പൊസ്തലന്മാർ
  rationale: ലൂക്കോസിൽ ദൗത്യത്തിനായി അയയ്ക്കപ്പെട്ട പന്ത്രണ്ടുപേരെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പദവിയായതിനാൽ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം സ്വീകരിച്ചു.
- source_word: διηγήσαντο
  choice: വിവരിച്ചു
  rationale: വെറുതെ പറയുക എന്നതിലുപരി സംഭവിച്ച കാര്യങ്ങൾ വിവരിച്ചറിയിക്കുക എന്ന ഭാവം നൽകുന്നു; ഔപചാരിക റിപ്പോർട്ടിന്റെ ആശയം അനാവശ്യമായി അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: αὐτῷ
  choice: യേശുവിനോടു
  rationale: സർവനാമം മുൻസന്ദർഭത്തിൽ യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഒറ്റവാക്യവായനയിൽ വ്യക്തതയ്ക്കായി പേര് ഉപയോഗിച്ചു.
- source_word: ὅσα ἐποίησαν
  choice: തങ്ങൾ ചെയ്തതെല്ലാം
  rationale: ὅσα സൂചിപ്പിക്കുന്ന സമഗ്രത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παραλαβὼν αὐτούς
  choice: അവരെയും കൂട്ടിക്കൊണ്ട്
  rationale: അവരെ സഹയാത്രികരായി കൂടെ കൊണ്ടുപോയി എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ὑπεχώρησεν
  choice: പിൻവാങ്ങി
  rationale: പൊതുജനസാന്നിധ്യത്തിൽനിന്നോ പൊതുപ്രവർത്തനത്തിൽനിന്നോ ഒഴിഞ്ഞുമാറുന്ന ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: κατ’ ἰδίαν
  choice: മറ്റുള്ളവരിൽനിന്ന് വേറിട്ട്
  rationale: യേശു അപ്പൊസ്തലന്മാരെ കൂടെ കൊണ്ടുപോയതിനാൽ പൂർണമായ ഏകാന്തത സൂചിപ്പിക്കാതെ, പൊതുജനങ്ങളിൽനിന്നുള്ള വേർപാട് പ്രകടിപ്പിക്കുന്നു.
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: ബേത്ത്സയിദ എന്നു പേരുള്ള ഒരു പട്ടണത്തിലേക്ക്
  rationale: πόλις എന്നത് ഇവിടെ വലിപ്പം അതിശയിപ്പിക്കാത്തവിധം ‘പട്ടണം’ എന്നു നൽകി; καλουμένην സ്വാഭാവികമായി ‘പേരുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Βηθσαϊδά
  choice: ബേത്ത്സയിദ
  rationale: സ്ഥലപ്പേരിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: κατ’ ἰδίαν എന്ന പ്രയോഗവും അപ്പൊസ്തലന്മാർ യേശുവിനൊപ്പമുണ്ടായിരുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: മറ്റുള്ളവരിൽനിന്ന് വേറിട്ട്
  alternative: സ്വകാര്യമായി; തനിച്ച്; മാറി
  rationale: വാക്യം യേശു അപ്പൊസ്തലന്മാരെ കൂടെ കൂട്ടിയെന്ന് വ്യക്തമായി പറയുന്നതിനാൽ ‘തനിച്ച്’ എന്നത് തെറ്റിദ്ധരിപ്പിക്കും. തിരക്കിൽനിന്നോ മറ്റുള്ളവരിൽനിന്നോ വേറിട്ടുള്ള പിൻവാങ്ങലെന്ന അർഥം നിലനിർത്തി, പൂർണ ഏകാന്തത തീരുമാനിച്ചുപറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അപ്പൊസ്തലന്മാർ’ എന്ന പരിചിതമായ സഭാപദം നിലനിർത്തിയെങ്കിലും മറ്റു വാക്യഘടകങ്ങൾ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകി. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന κατ’ ἰδίαν എന്ന ആശയത്തിനുശേഷം സ്ഥാപിച്ചു.
