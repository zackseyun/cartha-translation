  language: ml
  text: നിങ്ങൾ ഏതു വീട്ടിൽ പ്രവേശിച്ചാലും, അവിടെത്തന്നെ താമസിക്കുകയും അവിടെനിന്നുതന്നെ പുറപ്പെടുകയും ചെയ്യുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν οἰκίαν
  choice: ഏതു വീട്ടിൽ
  rationale: അനിശ്ചിത ബന്ധവാക്യത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐκεῖ μένετε
  choice: അവിടെത്തന്നെ താമസിക്കുക
  rationale: μένω എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ അർഥം ‘താമസിക്കുക’ എന്നാണ്; ἐκεῖയുടെ ആവർത്തന ഊന്നൽ ‘-ത്തന്നെ’കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: ἐκεῖθεν ἐξέρχεσθε
  choice: അവിടെനിന്നുതന്നെ പുറപ്പെടുകയും ചെയ്യുക
  rationale: ἐκεῖθεν എന്ന ഉറവിടസൂചനയും ἐξέρχομαι എന്ന സാധാരണ ‘പുറപ്പെടുക’ എന്ന അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു; രണ്ടാമത്തെ കല്പനയെ καί-യോട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
