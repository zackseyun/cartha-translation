revisions:
- from: അവനെ ഉയർത്തിയെടുക്കുന്നതിനുള്ള ദിവസങ്ങൾ പൂർത്തിയായിക്കൊണ്ടിരിക്കുമ്പോൾ[a], അവൻ യെരൂശലേമിലേക്കു പോകാൻ മുഖം ഉറപ്പിച്ചു[b].
  to: അങ്ങനെ, അവൻ ഉയർത്തപ്പെടേണ്ട ദിവസങ്ങൾ പൂർത്തിയായിക്കൊണ്ടിരിക്കെ[a], അവൻ യെരൂശലേമിലേക്കു പോകാൻ മുഖം ഉറപ്പിച്ചു[b].
  rationale: The revision replaces an unclear Malayalam genitive construction with a natural passive expression that preserves the debated breadth of ἀνάλημψις. It adds a modest narrative transition for Ἐγένετο δέ and retains the source’s processive temporal sense, Jerusalem destination, and vivid idiom of resolute intent. Footnote anchors remain attached to the relevant expressions.
