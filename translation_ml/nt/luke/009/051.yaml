id: LUK.9.51
reference: Luke 9:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: ml
  text: അങ്ങനെ, അവൻ ഉയർത്തപ്പെടേണ്ട ദിവസങ്ങൾ പൂർത്തിയായിക്കൊണ്ടിരിക്കെ[a], അവൻ യെരൂശലേമിലേക്കു പോകാൻ മുഖം ഉറപ്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ സ്വർഗാരോഹണത്തിന്റെ ദിവസങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥം ‘അവൻ ഉയർത്തപ്പെടൽ’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘മുഖം ഉറപ്പിച്ചു’ എന്നത് ദൃഢനിശ്ചയം പ്രകടിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: പ്രത്യേക പദപ്രയോഗമായി ചേർക്കാതെ കാലസൂചകവാക്യഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: ഇത് ലൂക്കോസിന്റെ ആഖ്യാനത്തിലെ സൂത്രബദ്ധമായ സംഭവപരിവർത്തനപ്രയോഗമാണ്. മലയാളത്തിൽ ‘സംഭവിച്ചു’ എന്നു വേർതിരിച്ചു ചേർത്താൽ വാക്യം കൃത്രിമമാകുന്നതിനാൽ, തുടർന്നുള്ള ‘...പൂർത്തിയായിക്കൊണ്ടിരിക്കുമ്പോൾ’ എന്ന ഘടനയിലൂടെ അതിന്റെ ആഖ്യാനപ്രവർത്തനം സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: ἐν τῷ συμπληροῦσθαι
  choice: പൂർത്തിയായിക്കൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐν സഹിതമുള്ള articular infinitive കാലസംബന്ധമായ ‘എപ്പോൾ/ആയിരിക്കുമ്പോൾ’ എന്ന അർഥവും present infinitive പൂർത്തിയിലേക്കു നീങ്ങുന്ന പ്രക്രിയയും സൂചിപ്പിക്കുന്നു.
- source_word: τὰς ἡμέρας
  choice: ദിവസങ്ങൾ
  rationale: നിശ്ചിതമായ ഒരു കാലയളവ് പൂർത്തിയാകുന്നതിനെ ലൂക്കോസ് ‘ദിവസങ്ങൾ’ എന്നു പറയുന്നതിനാൽ മൂലപദത്തിന്റെ ദൃശ്യത നിലനിർത്തി.
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: അവനെ ഉയർത്തിയെടുക്കുന്നതിനുള്ള
  rationale: ἀνάλημψις എന്നത് അക്ഷരാർഥത്തിൽ ‘ഉയർത്തിയെടുക്കൽ’ ആണ്. ‘സ്വർഗാരോഹണം’ എന്നു മാത്രം ചുരുക്കാതെ മരണം, പുനരുത്ഥാനം, ഉയർത്തപ്പെടൽ എന്നിവയിലേക്കുള്ള വിശാലമായ സൂചനയ്ക്കുള്ള സാധ്യത നിലനിർത്തുന്നു.
- source_word: καὶ αὐτὸς
  choice: അവൻ
  rationale: മലയാളത്തിൽ ‘അവൻ തന്നെയും’ എന്നു നൽകിയാൽ ഇവിടെ അസ്വാഭാവികമാകാം. തുടർന്നുള്ള ദൃഢനിശ്ചയത്തിന്റെ പ്രയോഗം ഊന്നൽ വഹിക്കുന്നു.
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: മുഖം ഉറപ്പിച്ചു
  rationale: ദൃഢമായി തീരുമാനിച്ചു എന്ന അർഥമുള്ള സെമിറ്റിക് ശൈലിയിലെ സജീവരൂപകം നിലനിർത്തുന്നു; മലയാളത്തിലും സന്ദർഭത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: τοῦ πορεύεσθαι
  choice: പോകാൻ
  rationale: ഇവിടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ന്റെ സ്വാഭാവികവും വിശാലവുമായ മലയാളരൂപം.
- source_word: εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിലേക്കു
  rationale: നഗരത്തിലേക്കുള്ള ദിശയെ സൂചിപ്പിക്കുന്ന εἰς-ന്റെ സാധാരണ അർഥം.
theological_decisions:
- issue: ἀναλήμψεως αὐτοῦ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘അവനെ ഉയർത്തിയെടുക്കുന്നതിനുള്ള’ എന്ന വിശാലവും അക്ഷരാർഥസമീപവുമായ രൂപം
  alternative: ‘അവന്റെ സ്വർഗാരോഹണത്തിനുള്ള’
  rationale: ഗ്രീക്ക് പദം ഉയർത്തിയെടുക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ലൂക്കോസിന്റെ ആഖ്യാനത്തിൽ ഇത് യേശുവിന്റെ മരണം, പുനരുത്ഥാനം, മഹത്ത്വീകരണം എന്നിവയിലേക്കുള്ള ഏകീകൃത നീക്കത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ അർഥം സ്വർഗാരോഹണത്തിലേക്ക് മാത്രം ചുരുക്കിയില്ല.
- issue: τὸ πρόσωπον ἐστήρισεν എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: രൂപകം നിലനിർത്തി ‘മുഖം ഉറപ്പിച്ചു’
  alternative: ‘ദൃഢമായി തീരുമാനിച്ചു’
  rationale: യേശുവിന്റെ ഉറച്ച തീരുമാനം വ്യക്തമാക്കുന്നതോടൊപ്പം പ്രവാചകഭാഷയുമായുള്ള സാഹിത്യപ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു; അധികമായ ഉപദേശപരമായ അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉയർത്തിയെടുക്കുന്നതിനുള്ള’ എന്നത് അല്പം ഔപചാരികമായിരുന്നാലും മൂലത്തിലെ theological ambiguity സംരക്ഷിക്കുന്നു. ‘മുഖം ഉറപ്പിച്ചു’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ അതിന്റെ അർഥം വ്യക്തമാക്കി.
