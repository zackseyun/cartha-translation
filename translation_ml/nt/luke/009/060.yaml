  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അയാളോടു പറഞ്ഞു[a]: “മരിച്ചവർ തങ്ങളുടെ മരിച്ചവരെ അടക്കം ചെയ്യട്ടെ; നീയോ പോയി ദൈവരാജ്യം പ്രഖ്യാപിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആദ്യത്തെ ‘മരിച്ചവർ’ ആലങ്കാരികമായി ആത്മീയമായി പ്രതികരിക്കാത്തവരെ സൂചിപ്പിക്കുന്നതാകാം; രണ്ടാമത്തേത് ശാരീരികമായി മരിച്ചവരെ സൂചിപ്പിക്കുന്നതാകാം. ഗ്രീക്കിൽ രണ്ടിടത്തും ഒരേ പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; പരിഭാഷ ആ പ്രഭാവം നിലനിർത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: ചെയ്യട്ടെ
  rationale: ἀφίημι എന്ന ആജ്ഞാരൂപം ഇവിടെ മറ്റുള്ളവർ ആ പ്രവൃത്തി ചെയ്യാൻ വിടുക എന്ന അർഥത്തിലാണ്. സ്വാഭാവികമായ മലയാളത്തിൽ ‘അടക്കം ചെയ്യട്ടെ’ എന്ന പ്രയോഗം ആ വിട്ടുകൊടുക്കലിന്റെ ശക്തി പ്രകടമാക്കുന്നു.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: മരിച്ചവർ ... തങ്ങളുടെ മരിച്ചവരെ
  rationale: ഗ്രീക്കിലെ νεκρούς എന്ന ഒരേ പദത്തിന്റെ ആവർത്തനം നിലനിർത്തി വാക്യത്തിലെ ഞെട്ടിക്കുന്ന വിരോധാഭാസവും അർഥസമ്മർദവും സംരക്ഷിക്കുന്നു.
- source_word: θάψαι
  choice: അടക്കം ചെയ്യുക
  rationale: മരിച്ച ശരീരം സംസ്കരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἑαυτῶν
  choice: തങ്ങളുടെ
  rationale: പ്രതിഫലക സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀπελθὼν
  choice: പോയി
  rationale: പ്രധാന ആജ്ഞയ്ക്കു മുമ്പുള്ള aorist participle മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാശൃംഖലയായ ‘പോയി ... ഘോഷിക്കുക’ എന്നു നൽകി പ്രവർത്തനക്രമം സംരക്ഷിക്കുന്നു.
- source_word: διάγγελλε
  choice: ഘോഷിക്കുക
  rationale: പരസ്യമായും തുടർച്ചയായും അറിയിക്കുക എന്ന present imperative-ന്റെ ആശയം രാജ്യസന്ദർഭത്തിന് യോജിച്ച dignified മലയാളത്തിൽ നൽകുന്നു.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: ദൈവത്തിന്റെ രാജത്വത്തെയും ഭരണത്തെയും ഉൾക്കൊള്ളുന്ന, മലയാള ബൈബിൾഭാഷയിൽ സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ പ്രയോഗം.
theological_decisions:
- issue: ‘മരിച്ചവർ’ എന്ന പദത്തിന്റെ രണ്ട് പ്രയോഗങ്ങളുടെ അർഥം
  choice: രണ്ടിടത്തും ‘മരിച്ചവർ’ എന്ന ഒരേ പദം നിലനിർത്തുക
  alternative: ആത്മീയമായി മരിച്ചവർ തങ്ങളുടെ മരിച്ചവരെ അടക്കം ചെയ്യട്ടെ
  rationale: ആദ്യ പ്രയോഗം ആത്മീയമായി പ്രതികരിക്കാത്തവരെയും രണ്ടാമത്തേത് ശാരീരികമായി മരിച്ചവരെയും സൂചിപ്പിക്കുന്നതായിരിക്കാം. എന്നാൽ ഗ്രീക്ക് ഈ വ്യത്യാസം തുറന്നുപറയാതെ ഒരേ പദം ആവർത്തിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ വിരോധാഭാസവും വ്യാഖ്യാനസമ്മർദവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ കഠിനമായ വിരോധാഭാസം വിശദീകരിച്ച് മൃദൂകരിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു; ‘പോയി ... ഘോഷിക്കുക’ മലയാളത്തിലെ സ്വാഭാവിക ആജ്ഞാക്രമമാണ്.
