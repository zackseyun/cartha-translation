  source_fidelity: The draft faithfully preserves the repeated Greek νεκρούς as ‘മരിച്ചവർ ... മരിച്ചവരെ,’ retains the reflexive force of ἑαυτῶν with ‘തങ്ങളുടെ,’ and represents the participle-plus-imperative sequence ἀπελθὼν διάγγελλε naturally as ‘പോയി ... പ്രഖ്യാപിക്കുക.’ It does not import the likely metaphorical sense into the main text. ‘ചെയ്യട്ടെ’ adequately conveys Ἄφες in this construction.
