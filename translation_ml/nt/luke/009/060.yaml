  terminology: ‘ദൈവരാജ്യം’ is an established and suitable equivalent for βασιλεία τοῦ θεοῦ. ‘അടക്കം ചെയ്യുക’ is respectful and natural for θάπτειν. The revised footnote maintains the deliberate ambiguity while making its Malayalam syntax more direct.
