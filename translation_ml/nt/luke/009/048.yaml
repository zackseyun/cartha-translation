revisions:
- from: 'അവൻ അവരോടു പറഞ്ഞു: “ഈ കുഞ്ഞിനെ എന്റെ നാമത്തിൽ സ്വീകരിക്കുന്നവൻ എന്നെ സ്വീകരിക്കുന്നു; എന്നെ സ്വീകരിക്കുന്നവൻ എന്നെ അയച്ചവനെ സ്വീകരിക്കുന്നു.[a] നിങ്ങളെല്ലാവരുടെയും ഇടയിൽ ഏറ്റവും ചെറിയവനായി കഴിയുന്നവൻ—അവനാണ് വലിയവൻ.”'
  to: 'അവൻ അവരോടു പറഞ്ഞു: “ഈ കുട്ടിയെ എന്റെ നാമത്തിൽ സ്വീകരിക്കുന്നവൻ[a] എന്നെ സ്വീകരിക്കുന്നു; എന്നെ സ്വീകരിക്കുന്നവൻ എന്നെ അയച്ചവനെ സ്വീകരിക്കുന്നു. നിങ്ങളെല്ലാവരിലും ഏറ്റവും ചെറിയവനായിരിക്കുന്നവൻ—അവനാണ് വലിയവൻ.”'
  rationale: ‘കുട്ടി’ παιδίον-ന്റെ പ്രായനിഷ്പക്ഷമായ അർഥം സംരക്ഷിക്കുന്നു. അവസാനവാക്യത്തിൽ സാമൂഹികമായി ‘least’ എന്ന വിരോധാഭാസം നിലനിർത്തിക്കൊണ്ട്, മൂലപാഠം നിർബന്ധിക്കാത്ത തുടർച്ചയുടെ സൂചന ഒഴിവാക്കി. അടിക്കുറിപ്പ് അതു വിശദീകരിക്കുന്ന മുഖ്യപ്രയോഗത്തോടുതന്നെ ചേർത്തിരിക്കുന്നു.
