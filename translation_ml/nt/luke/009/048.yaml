id: LUK.9.48
reference: Luke 9:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഈ കുട്ടിയെ എന്റെ നാമത്തിൽ സ്വീകരിക്കുന്നവൻ[a] എന്നെ സ്വീകരിക്കുന്നു; എന്നെ സ്വീകരിക്കുന്നവൻ എന്നെ അയച്ചവനെ സ്വീകരിക്കുന്നു. നിങ്ങളെല്ലാവരിലും ഏറ്റവും ചെറിയവനായിരിക്കുന്നവൻ—അവനാണ് വലിയവൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സ്വീകരിക്കുന്നു” എന്നതിന് ഈ വാക്യത്തിലുടനീളം “സ്വാഗതം ചെയ്യുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയയ്ക്ക് അംഗീകരിക്കുക, ആതിഥ്യത്തോടെ സ്വീകരിക്കുക എന്നീ അർഥങ്ങളും വരാം. “എന്റെ നാമത്തിൽ” എന്നതിന് “എന്റെ നാമത്തെ അടിസ്ഥാനമാക്കി” അല്ലെങ്കിൽ “എന്റെ നാമം നിമിത്തം” എന്നും അർഥമാകാം; അത് യേശുവിന്റെ അധികാരത്തോടും അവനോടുള്ള കൂറോടും ബന്ധപ്പെട്ട സ്വീകരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: സ്വീകരിക്കുന്നവൻ / സ്വീകരിക്കുന്നു
  rationale: δέχομαι എന്ന ആവർത്തിത ക്രിയയുടെ സ്വീകരിക്കുക, സ്വാഗതം ചെയ്യുക എന്നീ അർഥസാധ്യതകൾ നിലനിർത്തുകയും വാക്യത്തിലെ ബന്ധശൃംഖല വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: παιδίον
  choice: കുഞ്ഞ്
  rationale: സന്ദർഭത്തിലെ ഒരു ബാലനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; അനാവശ്യമായി പ്രായമോ ചെറുപ്പമോ ഊന്നുന്നില്ല.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ നാമം, അധികാരം, പ്രതിനിധിത്വം എന്നിവയോടുള്ള ബന്ധത്തിന്റെ വിശാലത ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: τὸν ἀποστείλαντά με
  choice: എന്നെ അയച്ചവനെ
  rationale: മൂലത്തിലെ substantival participle നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; പിതാവ്/ദൈവം എന്ന് പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: μικρότερος
  choice: ഏറ്റവും ചെറിയവൻ
  rationale: ഇവിടെ ശരീരവലുപ്പത്തെയോ പ്രായത്തെയോക്കാൾ സമൂഹത്തിലെ താഴ്മയുള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വിരോധാഭാസവും നിലനിർത്തുന്നു.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: നിങ്ങളെല്ലാവരുടെയും ഇടയിൽ
  rationale: ശിഷ്യസമൂഹത്തിനുള്ളിലെ താരതമ്യസ്ഥാനമാണ് ഉദ്ദേശിക്കുന്നത് എന്ന് വ്യക്തമായി നൽകുന്നു.
- source_word: ὑπάρχων
  choice: ആയി കഴിയുന്നവൻ
  rationale: നിലവിലെ നിലയെയോ സ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്ന participial force സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὗτός ἐστιν μέγας
  choice: അവനാണ് വലിയവൻ
  rationale: οὗτος എന്നതിന്റെ ഊന്നൽ ‘ആണ്’ ഉപയോഗിച്ച് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: സ്വീകരിക്കുന്നവൻ ... സ്വീകരിക്കുന്നവൻ
  rationale: അനിശ്ചിതവും പൊതുവുമായ നിബന്ധന മലയാളത്തിലെ ബന്ധവാക്യഘടനയിലൂടെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: ആഖ്യാനമുഖവുര സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വാക്യാരംഭത്തിലെ καί മലയാളത്തിൽ നിർബന്ധമല്ലാത്തതിനാൽ കൃത്രിമമായ ‘എന്നിട്ട്’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘എന്നെ അയച്ചവൻ’ എന്നതിന്റെ സൂചിത വ്യക്തി
  choice: പിതാവിനെയോ ദൈവത്തെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാവുന്നുവെങ്കിലും മൂലപാഠംപോലെ പരോക്ഷമായി നിലനിർത്തി.
  alternative: ‘എന്നെ അയച്ച പിതാവിനെ’ അല്ലെങ്കിൽ ‘എന്നെ അയച്ച ദൈവത്തെ’.
  rationale: ഗ്രീക്ക് പാഠം വ്യക്തമായ നാമമോ പദവിയോ ചേർക്കുന്നില്ല; യേശുവിന്റെ അയക്കപ്പെട്ടതിന്റെ ബന്ധപരമായ അവകാശവാദം വികസിപ്പിക്കാതെ സംരക്ഷിക്കണം.
- issue: കുഞ്ഞിനെ ‘എന്റെ നാമത്തിൽ’ സ്വീകരിക്കുന്നതിന്റെ അർഥം
  choice: യേശുവിന്റെ നാമം, അധികാരം, പ്രതിനിധിത്വം എന്നിവയോടുള്ള ബന്ധം തുറന്നുവെച്ചു.
  alternative: ‘എന്നെപ്രതി’ അല്ലെങ്കിൽ ‘ഈ കുഞ്ഞ് എനിക്കുള്ളവനായതിനാൽ’.
  rationale: ഒരു കാരണത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കാതെ വാക്യത്തിന്റെ പ്രതിനിധിത്വപരവും അധികാരപരവുമായ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- issue: മഹത്വത്തിന്റെ വിരോധാഭാസം
  choice: സമൂഹത്തിൽ ഏറ്റവും ചെറുതായി/താഴ്മയോടെ കഴിയുന്നവനെയാണ് വലിയവൻ എന്നു പറഞ്ഞു.
  alternative: ‘നിങ്ങളിൽ ഏറ്റവും പ്രായം കുറഞ്ഞവൻ വലിയവനാണ്.’
  rationale: μικρότερος ഇവിടെ പ്രായത്തേക്കാൾ സ്ഥാനം, താഴ്മ എന്നിവയെ സൂചിപ്പിക്കുന്നു; യേശുവിന്റെ മൂല്യവിപരീതം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. δέχομαι എന്ന ക്രിയയുടെ ആവർത്തനം സൂക്ഷിച്ചു. ‘അവനാണ്’ എന്ന ഘടനയിൽ അവസാനത്തെ demonstrative emphasis നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
