source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: ml
  text: ഇതാ, രണ്ടു പുരുഷന്മാർ അവനോടു സംസാരിച്ചുകൊണ്ടിരുന്നു; അവർ മോശയും ഏലിയാവും ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: പെട്ടെന്ന് ശ്രദ്ധ ക്ഷണിക്കുകയും രംഗത്തിന് സജീവത നൽകുകയും ചെയ്യുന്ന ലൂക്കോസിന്റെ ആഖ്യാനസൂചകം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἄνδρες δύο
  choice: രണ്ടു പുരുഷന്മാർ
  rationale: ἀνήρ ഇവിടെ മോശയെയും ഏലിയാവിനെയും വ്യക്തമായി പുരുഷന്മാരായി സൂചിപ്പിക്കുന്നു; അതിനാൽ ലിംഗസൂചന നഷ്ടപ്പെടാത്ത കൃത്യമായ പരിഭാഷയാണിത്.
- source_word: συνελάλουν
  choice: സംസാരിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുകയായിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം സംഭാഷണത്തിന്റെ ദൈർഘ്യസ്വഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: συλλαλέω എന്ന ക്രിയയോടുകൂടിയ ദത്തിവിഭക്തി ഒരാളോടൊപ്പം നടത്തുന്ന പരസ്പരസംഭാഷണത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: οἵτινες
  choice: അവർ
  rationale: മുമ്പു പറഞ്ഞ രണ്ടു പുരുഷന്മാരെ തിരിച്ചറിഞ്ഞ് പേരുപറയുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി സ്വതന്ത്രവാക്യമായി അവതരിപ്പിക്കുന്നു; അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: Μωϋσῆς
  choice: മോശ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിലും സാധാരണ ക്രൈസ്തവ ഉപയോഗത്തിലും സുപരിചിതമായ പേരുരൂപം.
- source_word: Ἠλίας
  choice: ഏലിയാവ്
  rationale: എബ്രായ പ്രവാചകന്റെ മലയാളത്തിൽ സുപരിചിതവും ആധുനികവുമായ പേരുരൂപം.
theological_decisions:
- issue: രൂപാന്തരീകരണസന്ദർഭത്തിലെ രണ്ടു വ്യക്തികളുടെ തിരിച്ചറിയൽ
  choice: ആ രണ്ടു പുരുഷന്മാരെ മോശയും ഏലിയാവും എന്നു നേരിട്ട് തിരിച്ചറിയുന്നു.
  alternative: അവരുടെ പ്രതീകാത്മകമോ അന്ത്യകാലപരമോ ആയ പ്രാധാന്യം വിശദീകരിച്ച് ചേർക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം വ്യക്തികളെ നേരിട്ട് തിരിച്ചറിയുക മാത്രമാണ് ചെയ്യുന്നത്. അതിനാൽ വാചകത്തിൽ ഇല്ലാത്ത പ്രതീകാത്മകമോ സിദ്ധാന്തപരമോ ആയ വിശദീകരണം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷക പദം മൂലപാഠത്തിന്റെ സജീവത നിലനിർത്തുന്നു; ‘സംസാരിച്ചുകൊണ്ടിരുന്നു’ അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം വ്യക്തമാക്കുന്നു.
