id: LUK.9.21
reference: Luke 9:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ ἐπιτιμήσας αὐτοῖς παρήγγειλεν μηδενὶ ⸀λέγειν τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/021.yaml
  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: ml
  text: എന്നാൽ യേശു അവരെ ശാസിച്ച്, ഇക്കാര്യം ആരോടും പറയരുതെന്ന് കൽപിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അവർക്കു കർശനമായ താക്കീത് നൽകി, ഇക്കാര്യം ആരോടും പറയരുതെന്ന് കൽപിച്ചു.’'
    reason: ἐπιτιμήσας എന്ന പദത്തിന് ‘ശാസിച്ചു’ എന്നും ‘കർശനമായി താക്കീത് നൽകി’ എന്നും സന്ദർഭോചിതമായി അർഥമാകാം; രണ്ടാമത്തേത് മുന്നറിയിപ്പിന്റെ ഭാവം കൂടുതൽ തുറന്നുപറയുന്നു.
lexical_decisions:
- source_word: ἐπιτιμήσας
  choice: ശാസിച്ച്
  rationale: ἐπιτιμάω എന്ന ക്രിയയുടെ ശാസനാത്മകമായ ശക്തി നിലനിർത്തുന്നു. വെറും ‘മുന്നറിയിപ്പു നൽകി’ എന്നതിനെക്കാൾ മൂലപാഠത്തിലെ കാഠിന്യം ഇതിൽ വ്യക്തമാണ്.
- source_word: παρήγγειλεν
  choice: കല്പിച്ചു
  rationale: പരാമർശിക്കുന്നത് ഒരു സാധാരണ നിർദേശമല്ല, അധികാരപൂർവമായ ആജ്ഞയാണെന്ന παραγγέλλωയുടെ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μηδενὶ
  choice: ആരോടും … അരുത്
  rationale: μηδενὶ എന്ന ദത്തിവിഭക്തിരൂപം സംസാരത്തിന്റെ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ നിഷേധവാക്യത്തിൽ ‘ആരോടും പറയരുത്’ എന്നതാണ് സ്വാഭാവിക രൂപം.
- source_word: λέγειν
  choice: പറയരുതെന്ന്
  rationale: ഒരു വ്യക്തിയോടു വിവരം അറിയിക്കുക എന്ന ഈ സന്ദർഭത്തിലെ λέγωയുടെ അർഥം മലയാളത്തിൽ ‘പറയുക’ എന്നതിലൂടെ സ്വാഭാവികമായി വരുന്നു; നിരോധനം പരോക്ഷവാക്യമായി നൽകിയിരിക്കുന്നു.
- source_word: τοῦτο
  choice: ഇക്കാര്യം
  rationale: തൊട്ടുമുമ്പുള്ള പത്രോസിന്റെ പ്രഖ്യാപനത്തിലേക്കു വിരൽചൂണ്ടുന്ന τοῦτοയുടെ സൂചന നിലനിർത്തുന്നു; അതിന്റെ അർഥം മുഖ്യപാഠത്തിൽ അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുമ്പുള്ള പ്രഖ്യാപനത്തിനും യേശുവിന്റെ പ്രതികരണത്തിനും ഇടയിലെ ലഘുവായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ὁ
  choice: യേശു
  rationale: ഗ്രീക്കിൽ ആർട്ടിക്കിളോടുകൂടിയ പരോക്ഷ കർത്തൃപരാമർശമാണ് ഉള്ളതെങ്കിലും, മലയാളത്തിൽ ഒറ്റവാക്യമായും വ്യക്തത ലഭിക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായ കർത്താവായ യേശുവിന്റെ പേര് ഉപയോഗിച്ചു.
theological_decisions:
- issue: പത്രോസിന്റെ പ്രഖ്യാപനത്തിനു ശേഷമുള്ള യേശുവിന്റെ വിലക്കിന്റെ ശക്തി
  choice: ഈ ഘട്ടത്തിൽ ഇക്കാര്യം ആരോടും വെളിപ്പെടുത്തരുതെന്ന ശക്തമായ വിലക്ക്
  alternative: ഇക്കാര്യം പരാമർശിക്കാതിരിക്കാനുള്ള മൃദുവായ മുന്നറിയിപ്പ്
  rationale: ἐπιτιμήσας, παρήγγειλεν എന്നീ പദങ്ങൾ ചേർന്ന് ഒരു സാധാരണ അഭ്യർഥനയെക്കാൾ ശക്തമായ വിലക്ക് സൂചിപ്പിക്കുന്നു. എന്നാൽ അതിന്റെ പിന്നിലെ കാരണം മുഖ്യപാഠത്തിൽ വിശദീകരിക്കാതെ ആഖ്യാനത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘ശാസിച്ച്’, ‘കല്പിച്ചു’ എന്നീ പദങ്ങൾ വിലക്കിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘ഇക്കാര്യം’ മുൻസന്ദർഭത്തിലേക്കുള്ള സൂചന വ്യക്തമാക്കുകയും അതിനെ വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
