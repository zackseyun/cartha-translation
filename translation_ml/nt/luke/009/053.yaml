id: LUK.9.53
reference: Luke 9:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐδέξαντο αὐτόν, ὅτι τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: ml
  text: അവർ അവനെ സ്വീകരിച്ചില്ല[a]; കാരണം, അവന്റെ മുഖം യെരൂശലേമിലേക്കു തിരിഞ്ഞിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ അവനെ വരവേറ്റില്ല.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് സ്വീകരിക്കുക, അംഗീകരിക്കുക, വരവേൽക്കുക എന്നീ അർഥങ്ങളുണ്ട്; ഈ സന്ദർഭത്തിൽ ആതിഥ്യം നൽകാൻ വിസമ്മതിച്ചതായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിന് അടുത്ത രൂപം: ‘അവന്റെ മുഖം യെരൂശലേമിലേക്കു പോകുകയായിരുന്നു.’ ഈ പ്രയോഗം യെരൂശലേമിലേക്കുള്ള നിശ്ചിത ദിശയെയോ ഉറച്ച യാത്രാഭിമുഖ്യത്തെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: സ്വീകരിച്ചില്ല
  rationale: δέχομαι എന്ന ക്രിയയ്ക്ക് സ്വീകരിക്കുക, വരവേൽക്കുക, അംഗീകരിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. യാത്രാസന്ദർഭത്തിൽ ആതിഥ്യമോ വരവേൽപ്പോ നിഷേധിച്ചതാണ് സാധ്യത; ‘സ്വീകരിച്ചില്ല’ മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: മുഖം തിരിച്ചിരിക്കുകയായിരുന്നു
  rationale: πρόσωπον അക്ഷരാർഥത്തിൽ ‘മുഖം’ എന്നാണ്. ഇവിടെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ദിശയെയോ ഉറച്ച യാത്രാഭിമുഖ്യത്തെയോ സൂചിപ്പിക്കുന്ന സെമിറ്റിക് ശൈലിയിലുള്ള പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἦν πορευόμενον
  choice: പോകാൻ … തിരിച്ചിരിക്കുകയായിരുന്നു
  rationale: ഈ പരിഭാഷ ഗതിയെയും യാത്രാഭിമുഖ്യത്തെയും പ്രകടിപ്പിക്കുന്നു; അതേസമയം സന്ദർഭത്തിന് അതീതമായി ‘ദൃഢനിശ്ചയം ചെയ്തു’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ദിശ മലയാളത്തിലെ ‘-ലേക്കു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ὅτι ഇവിടെ സ്വീകരിക്കാതിരുന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ വ്യക്തമായ കാരണബന്ധം നൽകുന്നു.
theological_decisions:
- issue: ‘അവന്റെ മുഖം യെരൂശലേമിലേക്കു പോകുകയായിരുന്നു’ എന്ന പ്രയോഗത്തിന്റെ ഭാവം
  choice: യെരൂശലേമിലേക്കുള്ള യാത്രാഭിമുഖ്യം സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘മുഖം തിരിച്ചിരിക്കുകയായിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവൻ യെരൂശലേമിലേക്കു പോകുകയായിരുന്നു’ എന്ന ലളിതമായ യാത്രാവിവരണമോ ‘അവൻ യെരൂശലേമിലേക്കു പോകാൻ ദൃഢനിശ്ചയം ചെയ്തിരുന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപമോ ഉപയോഗിക്കാമായിരുന്നു.
  rationale: മൂലത്തിലെ ‘മുഖം’ എന്ന ദൃശ്യപ്രയോഗവും യാത്രയുടെ ദിശയും നിലനിർത്തുന്നു. ഉറച്ച തീരുമാനത്തിന്റെ സൂചന സാധ്യമാണെങ്കിലും, അതിനെ മുഖ്യവാചകത്തിൽ നിർബന്ധിതമായ വ്യാഖ്യാനമാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സ്വീകരിച്ചില്ല’ എന്നത് മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘മുഖം തിരിച്ചിരിക്കുകയായിരുന്നു’ എന്നത് ഗ്രീക്കിലെ ദൃശ്യപ്രയോഗം പൂർണമായി ഇല്ലാതാക്കാതെ മലയാളത്തിൽ വായിക്കാവുന്ന രൂപം നൽകുന്നു.
