id: LUK.9.8
reference: Luke 9:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπό τινων δὲ ὅτι Ἠλίας ἐφάνη, ἄλλων δὲ ὅτι προφήτης ⸀τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: ml
  text: ചിലർ ഏലിയാവ് പ്രത്യക്ഷപ്പെട്ടു എന്നും, മറ്റുചിലർ പണ്ടത്തെ പ്രവാചകന്മാരിൽ ഒരാൾ[a] ഉയിർത്തെഴുന്നേറ്റു എന്നും പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പണ്ടത്തെ ഒരു പ്രവാചകൻ ഉയിർത്തെഴുന്നേറ്റു.’
    reason: τις τῶν ἀρχαίων എന്ന ഗ്രീക്ക് പ്രയോഗം ‘പണ്ടത്തെ പ്രവാചകന്മാരിൽ ഒരാൾ’ എന്നും കൂടുതൽ പൊതുവായി ‘പണ്ടത്തെ ഒരു പ്രവാചകൻ’ എന്നും മലയാളത്തിൽ അവതരിപ്പിക്കാം.
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: ചിലർ ... മറ്റുചിലർ ... പറഞ്ഞു
  rationale: മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന പരോക്ഷവർത്തമാനത്തിന്റെ കർത്താക്കളെ സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ കർത്തൃസൂചകമായ ὑπό-പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: δὲ ... δὲ
  choice: '... എന്നും, ... എന്നും'
  rationale: അഭിപ്രായങ്ങളുടെ പട്ടികയിൽ വരുന്ന മൃദുവായ കൂട്ടിച്ചേർക്കൽ മലയാളത്തിലെ സമാന്തരമായ ‘എന്നും’ ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Ἠλίας
  choice: ഏലിയാവ്
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἐφάνη
  choice: പ്രത്യക്ഷപ്പെട്ടിരിക്കുന്നു
  rationale: φαίνω എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ ‘കാണപ്പെടുക/പ്രത്യക്ഷപ്പെടുക’ എന്ന അർഥം നൽകുന്നു; തുടർന്നുള്ള ἀνέστη എന്ന ഉയിർപ്പുസൂചക ക്രിയയിൽനിന്നുള്ള വ്യത്യാസവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: പണ്ടത്തെ പ്രവാചകന്മാരിൽ ഒരാൾ
  rationale: τις-ഉം വിഭക്തിബഹുവചനമായ τῶν ἀρχαίων-ഉം ചേർന്നുള്ള അനിശ്ചിതമായ കൂട്ടത്തിൽനിന്നുള്ള ഒരാൾ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ഏതു പ്രവാചകനെന്ന് നിർണയിക്കുന്നില്ല.
- source_word: ἀνέστη
  choice: ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു
  rationale: മരിച്ചവരിൽനിന്നുള്ള ഉയിർപ്പിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കർമ്മണിപ്രയോഗം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പണ്ടത്തെ പ്രവാചകനെക്കുറിച്ചുള്ള ജനങ്ങളുടെ ധാരണ
  choice: ‘ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘വീണ്ടും വന്നിരിക്കുന്നു’ / ‘ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു’
  rationale: ἀνέστη ഉയിർത്തെഴുന്നേൽപ്പിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു. ഇത് ജനങ്ങളുടെ റിപ്പോർട്ട് മാത്രമായി അവതരിപ്പിക്കുന്നു; അതിനെ ശരിവയ്ക്കുകയോ ഏതു പ്രവാചകനെന്ന് നിർണയിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: τις τῶν ἀρχαίων എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: ‘പണ്ടത്തെ പ്രവാചകന്മാരിൽ ഒരാൾ’
  alternative: ‘പണ്ടത്തെ ഒരു പ്രവാചകൻ’
  rationale: ഗ്രീക്കിലെ അനിശ്ചിതത്വവും τῶν ἀρχαίων എന്ന കൂട്ടസൂചനയും പ്രധാനപാഠത്തിൽ നിലനിർത്തി; കൂടുതൽ പൊതുവായ ഘടന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. മുൻവാക്യത്തിൽനിന്നുള്ള ഗ്രീക്ക് അപൂർണഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘പറഞ്ഞു’ ചേർത്തിരിക്കുന്നു. സമാന്തരമായ റിപ്പോർട്ടുകൾ ‘എന്നും ... എന്നും’ എന്ന ഘടനയിൽ നൽകിയിരിക്കുന്നു.
