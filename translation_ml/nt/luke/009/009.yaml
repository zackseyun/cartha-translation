revisions:
- from: 'എന്നാൽ ഹെരോദാവ് പറഞ്ഞു: “യോഹന്നാനെ ഞാൻ ശിരഛേദം ചെയ്തു. പിന്നെ, ആരെക്കുറിച്ചാണ് ഞാൻ ഇങ്ങനെയുള്ള കാര്യങ്ങൾ കേൾക്കുന്നത്? ഇയാൾ ആരാണ്?” അവനെ കാണാൻ ഹെരോദാവ് നിരന്തരം ശ്രമിച്ചുകൊണ്ടിരുന്നു.[a]'
