source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: ml
  text: 'എന്നാൽ ഹെരോദാവ് പറഞ്ഞു: “യോഹന്നാനെ ഞാൻ ശിരഛേദം ചെയ്തു; എന്നാൽ, ഇങ്ങനെയുള്ള കാര്യങ്ങൾ ഞാൻ കേൾക്കുന്ന ഈയാൾ ആരാണ്?” അവനെ കാണാൻ ഹെരോദാവ് ശ്രമിച്ചുകൊണ്ടിരുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ കാണാൻ ശ്രമിക്കുകയായിരുന്നു.” ഗ്രീക്കിലെ അപൂർണഭൂതകാലം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ ശ്രമത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തിൽനിന്ന് ഹെരോദാവിന്റെ പ്രതികരണത്തിലേക്കുള്ള നേരിയ വൈരുധ്യമുള്ള സംവാദമാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Ἡρῴδης
  choice: ഹെരോദാവ്
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ നാമരൂപം സ്വീകരിച്ചു.
- source_word: Ἰωάννην ἐγὼ ἀπεκεφάλισα
  choice: യോഹന്നാനെ ഞാൻ ശിരഛേദം ചെയ്തു
  rationale: ἐγώ എന്ന ഊന്നിയ സർവനാമം ‘ഞാൻ’ എന്നു നിലനിർത്തുകയും ἀποκεφαλίζω എന്ന ക്രിയയുടെ നിർദിഷ്ടമായ ‘ശിരഛേദം ചെയ്യുക’ എന്ന അർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τίς δέ ἐστιν οὗτος
  choice: പിന്നെ, ... ഇയാൾ ആരാണ്?
  rationale: δὲ ഇവിടെ ചോദ്യത്തിലെ തുടർച്ചയും വൈരുധ്യവും സൂചിപ്പിക്കുന്നു; οὗτος എന്ന നിർദേശകത്തിന്റെ അകൽച്ചാഭാവം ‘ഇയാൾ’ സംരക്ഷിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി ചോദ്യം അവസാനം വെച്ചു.
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: ആരെക്കുറിച്ചാണ് ഞാൻ ഇങ്ങനെയുള്ള കാര്യങ്ങൾ കേൾക്കുന്നത്?
  rationale: τοιαῦτα എന്ന പൊതുവായ പ്രയോഗത്തെ ‘വാർത്തകൾ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘ഇങ്ങനെയുള്ള കാര്യങ്ങൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: ἐζήτει ἰδεῖν αὐτόν
  choice: അവനെ കാണാൻ ഹെരോദാവ് നിരന്തരം ശ്രമിച്ചുകൊണ്ടിരുന്നു
  rationale: ἐζήτει എന്ന അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്നോ ആവർത്തിക്കുന്നോ ആയ പ്രവർത്തനഭാവം വ്യക്തമാക്കുന്നു; ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ കർത്താവായ ഹെരോദാവിനെ വീണ്ടും പേരെടുത്തു പറയുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ഹെരോദാവിന്റെ ചോദ്യം
  choice: യോഹന്നാനെ താൻ ശിരഛേദം ചെയ്തുവെന്ന പ്രസ്താവനയും ‘ഇയാൾ ആരാണ്?’ എന്ന ചോദ്യവും മാത്രം പരിഭാഷയിൽ വ്യക്തമാക്കി.
  alternative: യോഹന്നാൻ ഉയിർത്തെഴുന്നേറ്റോ എന്ന ഹെരോദാവിന്റെ ഭയം അല്ലെങ്കിൽ ഊഹം വാക്യത്തിൽ തുറന്നുപറയുക.
  rationale: അത്തരം പശ്ചാത്തലം മുൻവാക്യങ്ങളിൽ ഉണ്ടായിരുന്നാലും ഈ വാക്യം അത് നേരിട്ട് പറയുന്നില്ല; അതിനാൽ മൂലപാഠത്തിന്റെ നിയന്ത്രണവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശിരഛേദം ചെയ്തു’ എന്നത് കൃത്യവും പൊതുവേ മനസ്സിലാകുന്നതുമായ ഔപചാരിക പദപ്രയോഗമാണ്. പ്രധാന പാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
