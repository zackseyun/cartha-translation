reference: Luke 9:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Μηδὲν αἴρετε εἰς τὴν ὁδόν, μήτε ⸀ῥάβδον μήτε πήραν μήτε ἄρτον μήτε ἀργύριον, μήτε ⸀ἀνὰ δύο χιτῶνας ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “യാത്രയ്ക്കായി ഒന്നും കൊണ്ടുപോകരുത്—വടിയോ സഞ്ചിയോ[a] അപ്പമോ പണമോ[b] വേണ്ട; ഓരോരുത്തരും രണ്ടു കുപ്പായങ്ങൾ വീതം കരുതരുത്.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യാത്രയ്ക്കുള്ള സാധനങ്ങളോ ഭക്ഷണമോ കൊണ്ടുപോകുന്ന സഞ്ചി.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘വെള്ളി’; ഇവിടെ പണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്ക് പ്രയോഗത്തിന് ‘ഓരോരുത്തരും രണ്ടു കുപ്പായങ്ങൾ വീതം’ അഥവാ ‘ആളൊന്നിന് രണ്ടു കുപ്പായങ്ങൾ’ എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: യാത്രയ്ക്കായി ഒന്നും കൊണ്ടുപോകരുത്
  rationale: യാത്രയ്ക്കു വേണ്ട സാധനങ്ങൾ കൂടെ എടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ῥάβδον
  choice: വടി
  rationale: യാത്രയിൽ ഊന്നിനടക്കാൻ ഉപയോഗിക്കുന്ന വടിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘വടി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: πήραν
  choice: സഞ്ചി
  rationale: യാത്രാസാധനങ്ങളോ ഭക്ഷണമോ കൊണ്ടുപോകുന്ന സഞ്ചിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; കൂടുതൽ പ്രത്യേകമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἄρτον
  choice: അപ്പം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; പൊതുവായി ‘ഭക്ഷണം’ എന്നു വിപുലീകരിക്കുന്നില്ല.
- source_word: ἀργύριον
  choice: പണം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘വെള്ളി’ ആണെങ്കിലും ഈ സന്ദർഭത്തിൽ ചെലവിനുള്ള പണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: ഓരോരുത്തരും രണ്ടു കുപ്പായം വീതം കരുതുകയും അരുത്
  rationale: ἀνά എന്ന പദത്തിന്റെ വിതരണാർഥമായ ‘ഓരോരുത്തർക്കും/വീതം’ വ്യക്തമാക്കുകയും χιτών എന്ന പുരാതന വസ്ത്രത്തെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ‘കുപ്പായം’ എന്നു നൽകുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നെങ്കിലും മാന്യമായ ശൈലി. ആജ്ഞയുടെ കർശനത നിലനിർത്താൻ ‘ഒന്നും കൊണ്ടുപോകരുത്’ എന്നും പട്ടികയുടെ സ്വാഭാവികതയ്ക്കായി ‘വേണ്ട’ എന്നും ഉപയോഗിച്ചു; അവസാന വിലക്കും ‘കരുതുകയും അരുത്’ എന്നു സമാന്തരമായി അവതരിപ്പിച്ചു.
