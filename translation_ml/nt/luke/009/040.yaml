id: LUK.9.40
reference: Luke 9:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: ml
  text: “അതിനെ പുറത്താക്കണമെന്ന് ഞാൻ അങ്ങയുടെ ശിഷ്യന്മാരോട് കേണപേക്ഷിച്ചു[a]; എന്നാൽ അവർക്കു കഴിഞ്ഞില്ല.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അതിനെ’ എന്നതിന് പകരം ‘അവനെ’; സർവനാമം ആത്മാവിനെ അല്ല, ബാലനെയാണ് സൂചിപ്പിക്കുന്നതായി എടുത്താൽ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: കേണപേക്ഷിച്ചു
  rationale: δέομαι ഇവിടെ സാധാരണമായ ഒരു അഭ്യർഥനയല്ല, പിതാവിന്റെ അടിയന്തരവും തീവ്രവുമായ അപേക്ഷയാണ് സൂചിപ്പിക്കുന്നത്. ‘കേണപേക്ഷിച്ചു’ ആ ഭാവം സ്വാഭാവികമായും മാന്യമായും പകർന്നുനൽകുന്നു.
- source_word: μαθητῶν σου
  choice: അങ്ങയുടെ ശിഷ്യന്മാരോട്
  rationale: μαθητής എന്നത് സുവിശേഷസന്ദർഭത്തിലെ ഗുരു–ശിഷ്യബന്ധം നിലനിർത്തുന്ന വിധത്തിൽ ‘ശിഷ്യൻ’ എന്നു പരിഭാഷപ്പെടുത്തി. യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ മാന്യവും ആധുനികവുമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
- source_word: ἵνα ἐκβάλωσιν
  choice: പുറത്താക്കണമെന്ന്
  rationale: ἵνα സഹിതമുള്ള വിധേയക്രിയ അപേക്ഷയുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു. ഭൂതബാധ ഒഴിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ἐκβάλλωയുടെ പതിവ് അർഥം ‘പുറത്താക്കുക’ എന്നത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτό
  choice: അതിനെ
  rationale: നപുംസകലിംഗ സർവനാമം സമീപസന്ദർഭത്തിലെ ആത്മാവിനെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത. ‘അതിനെ’ എന്നത് ഈ സാധ്യത നിലനിർത്തുന്നു; ബാലനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിൽ ‘അവനെ’ എന്നതും സാധ്യമാണ്.
- source_word: οὐκ ἠδυνήθησαν
  choice: അവർക്കു കഴിഞ്ഞില്ല
  rationale: δύναμαι കഴിവിനെയോ സാധ്യതയെയോ സൂചിപ്പിക്കുന്നു. ‘അവർക്കു കഴിഞ്ഞില്ല’ ആ അർഥം വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ഭൂതോച്ചാടനസന്ദർഭത്തിൽ αὐτό എന്ന സർവനാമത്തിന്റെ സൂചിതവസ്തു
  choice: ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന നിലയിൽ ‘അതിനെ’
  alternative: ബാലനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിൽ ‘അവനെ’
  rationale: ἐκβάλλω ഭൂതോച്ചാടനസന്ദർഭങ്ങളിൽ സാധാരണയായി ആത്മാവിനെയോ ഭൂതത്തെയോ കർമമായി സ്വീകരിക്കുന്നു; കൂടാതെ αὐτό എന്ന നപുംസകലിംഗരൂപം πνεῦμα എന്ന നപുംസകലിംഗപദവുമായി സ്വാഭാവികമായി പൊരുത്തപ്പെടുന്നു. എങ്കിലും സർവനാമം ബാലനെ സൂചിപ്പിക്കുന്ന സാധ്യത പൂർണമായി ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പിതാവിന്റെ അപേക്ഷയുടെ തീവ്രത നിലനിർത്താൻ ‘കേണപേക്ഷിച്ചു’ എന്നും യേശുവിനോടുള്ള മാന്യമായ അഭിസംബോധനയ്ക്ക് ‘അങ്ങയുടെ’ എന്നും ഉപയോഗിച്ചു. പ്രധാനവാക്യത്തിലെ [a] അടിക്കുറിപ്പുസൂചകം ബന്ധപ്പെട്ട അർഥവ്യത്യാസത്തോടൊപ്പം ചേർത്തിരിക്കുന്നു.
