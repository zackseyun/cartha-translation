base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: ml
  text: 'അവർ ഉത്തരം പറഞ്ഞു: “സ്നാപകനായ യോഹന്നാൻ എന്നു ചിലർ; ഏലിയാവ് എന്നു വേറെ ചിലർ; പുരാതന പ്രവാചകന്മാരിൽ ആരോ ഒരാൾ എഴുന്നേറ്റിരിക്കുന്നു[a] എന്നു മറ്റുചിലർ പറഞ്ഞു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ഇവിടെ എഴുന്നേൽക്കുന്നതിന്റെയും മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുന്നതിന്റെയും അർഥസൂചന ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: അവർ ഉത്തരം പറഞ്ഞു
  rationale: ക്രിയാവിശേഷണരൂപവും മുഖ്യക്രിയയും ചേർന്ന ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകുന്നു; അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: സ്നാപകനായ യോഹന്നാൻ
  rationale: βαπτιστής എന്ന തിരിച്ചറിയൽപദത്തിന്റെ അർഥം നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും വ്യക്തവുമായ രൂപം.
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: വേറെ ചിലർ ... മറ്റുചിലർ
  rationale: വ്യത്യസ്ത അഭിപ്രായസംഘങ്ങളെ സൂചിപ്പിക്കുന്ന ആവർത്തിത ഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἠλίαν
  choice: ഏലിയാവ്
  rationale: പ്രവാചകന്റെ പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: പുരാതന പ്രവാചകന്മാരിൽ ആരോ ഒരാൾ
  rationale: τις എന്ന അനിശ്ചിതത്വവും τῶν ἀρχαίων എന്ന പുരാതന വ്യക്തികളിലേക്കുള്ള സൂചനയും വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀνέστη
  choice: എഴുന്നേറ്റിരിക്കുന്നു
  rationale: ‘എഴുന്നേൽക്കുക’ എന്ന അടിസ്ഥാനചിത്രവും ഉയിർപ്പിനെ സൂചിപ്പിക്കാവുന്ന സന്ദർഭാർഥവും ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀνέστη എന്നത് ഉയിർപ്പിനെ വ്യക്തമായി പ്രസ്താവിക്കുന്ന രീതിയിൽ പരിഭാഷപ്പെടുത്തണമോ എന്നത്
  choice: എഴുന്നേറ്റിരിക്കുന്നു
  alternative: ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു
  rationale: ഈ സന്ദർഭത്തിൽ പുരാതന പ്രവാചകൻ വീണ്ടും പ്രത്യക്ഷപ്പെട്ടെന്ന ജനങ്ങളുടെ ധാരണയാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്. എന്നാൽ ക്രിയ ഉയിർപ്പിനെ സൂചിപ്പിക്കാനും കഴിയും. പ്രധാന പാഠം ആ സാധ്യത തുറന്നുവെക്കുകയും അടിക്കുറിപ്പ് കൂടുതൽ വ്യക്തമായ പകരം നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പട്ടികയുടെ ആവർത്തിത ഘടന വായിക്കാൻ എളുപ്പമാക്കി; ജനങ്ങളുടെ വ്യത്യസ്ത ഉത്തരങ്ങൾ എന്ന സ്വഭാവം നിലനിർത്തി.
