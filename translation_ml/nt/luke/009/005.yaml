id: LUK.9.5
reference: Luke 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: ml
  text: നിങ്ങളെ സ്വീകരിക്കാത്തവർ ആരായാലും[a], ആ പട്ടണത്തിൽനിന്ന്[b] പുറപ്പെടുമ്പോൾ, അവർക്കെതിരായ സാക്ഷ്യമായി നിങ്ങളുടെ കാലുകളിലെ പൊടി കുടഞ്ഞുകളയുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘നിങ്ങളെ സ്വാഗതം ചെയ്യാത്തവർ ആരായാലും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് ദൂതന്മാരെ സ്വീകരിക്കുക, സ്വാഗതം ചെയ്യുക എന്നീ രണ്ടർഥങ്ങളും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ആ നഗരത്തിൽനിന്ന്.’ ഗ്രീക്ക് പദമായ πόλις സന്ദർഭമനുസരിച്ച് പട്ടണത്തെയോ നഗരത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: നിങ്ങളെ സ്വീകരിക്കാത്തവർ ആരായാലും
  rationale: ὅσοι ἄν എന്ന പ്രയോഗത്തിന്റെ അനിശ്ചിതവും പൊതുവൽക്കരിക്കുന്നതുമായ അർഥം ‘ആരായാലും’ നിലനിർത്തുന്നു. δέχομαι ദൂതന്മാരെ സ്വീകരിക്കുന്നതും സ്വാഗതം ചെയ്യുന്നതും ഉൾക്കൊള്ളുന്നതിനാൽ ‘സ്വീകരിക്കുക’ എന്ന വിശാലമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: ἐξερχόμενοι ἀπὸ τῆς πόλεως ἐκείνης
  choice: ആ പട്ടണത്തിൽനിന്ന് പുറപ്പെടുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തത്തിന്റെ മുഖ്യകല്പനയോടുള്ള സമകാലികബന്ധം ‘പുറപ്പെടുമ്പോൾ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ἐκείνης എന്ന സൂചന ‘ആ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν
  choice: നിങ്ങളുടെ കാലുകളിലെ പൊടി
  rationale: κονιορτός നിലത്തുനിന്നുയരുന്ന പൊടിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രവർത്തിയുടെ ദൃശ്യരൂപം സ്വാഭാവികമായി നൽകാൻ ‘കാലുകളിലെ പൊടി’ ഉപയോഗിച്ചു.
- source_word: ἀποτινάσσετε
  choice: കുടഞ്ഞുകളയുക
  rationale: പൊടി ശക്തമായി നീക്കിക്കളയുന്ന പ്രതീകാത്മക പ്രവർത്തിയെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: അവർക്കെതിരായ സാക്ഷ്യമായി
  rationale: μαρτύριον എന്നതിന്റെ സാക്ഷ്യസ്വഭാവവും ἐπίയുടെ ഈ സന്ദർഭത്തിലെ പ്രതികൂലമായ അർഥവും നിലനിർത്തുന്നു; അന്തിമശിക്ഷയെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പൊടി കുടഞ്ഞുകളയുന്ന പ്രതീകാത്മക പ്രവൃത്തിയുടെ ശക്തി
  choice: നിരസിക്കുന്നവർക്കെതിരായ സാക്ഷ്യമായി
  alternative: അവർക്കുള്ള ഒരു നിഷ്പക്ഷ അടയാളമായി; അന്തിമ ദൈവവിധിയുടെ വ്യക്തമായ പ്രഖ്യാപനമായി
  rationale: εἰς μαρτύριον ἐπ’ αὐτούς ഒരു നിഷ്പക്ഷ സൂചനയെക്കാൾ ഗൗരവമുള്ള മുന്നറിയിപ്പും ന്യായപരമായ സാക്ഷ്യവും സൂചിപ്പിക്കുന്നു. എന്നാൽ ഈ വാക്യം അന്തിമവിധിയുടെ മുഴുവൻ വ്യാപ്തിയും വ്യക്തമാക്കാത്തതിനാൽ അതിലധികം വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, അതേസമയം ഗൗരവവും കല്പനാസ്വരവും നിലനിർത്തുന്ന ഭാഷയാണ് ഉപയോഗിച്ചത്. ‘സ്വീകരിക്കുക,’ ‘പട്ടണം’ എന്നീ പദങ്ങളിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
