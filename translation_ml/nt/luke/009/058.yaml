id: LUK.9.58
reference: Luke 9:58
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “കുറുക്കന്മാർക്കു മാളങ്ങളും ആകാശത്തിലെ പക്ഷികൾക്കു കൂടുകളുമുണ്ട്; എന്നാൽ മനുഷ്യപുത്രന് തല ചായ്ക്കാൻ ഇടമില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനുഷ്യപുത്രൻ’ എന്നത് യേശു തന്നെക്കുറിച്ച് ഉപയോഗിക്കുന്ന വിശേഷണമാണ്; ഇത് ദാനിയേൽ 7:13–14-നെ പ്രതിധ്വനിപ്പിച്ചേക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: കുറുക്കന്മാർ
  rationale: മൃഗത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളപരിഭാഷ.
- source_word: φωλεοὺς
  choice: മാളങ്ങൾ
  rationale: കുറുക്കന്മാരുടെ അഭയസ്ഥാനങ്ങളെയോ പൊത്തുകളെയോ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘മാളങ്ങൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: അക്ഷരാർഥമായ ‘ആകാശത്തിന്റെ പക്ഷികൾ’ എന്ന ആശയം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κατασκηνώσεις
  choice: കൂടുകൾ
  rationale: താമസിക്കാനോ പാർക്കാനോ ഉള്ള ഇടങ്ങൾ എന്ന അടിസ്ഥാനാർഥം പക്ഷികളുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘കൂടുകൾ’ എന്നു വരുന്നു.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണവും ദാനിയേൽ 7:13–14-നോടുള്ള സാധ്യതയുള്ള പ്രതിധ്വനിയും നിലനിർത്തുന്ന അംഗീകൃത ബൈബിൾപരമായ രൂപം.
- source_word: οὐκ ἔχει ποῦ
  choice: ഇടമില്ല
  rationale: ‘എവിടെ’ എന്ന ποῦ-യെ നിഷേധിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം ‘ഇടമില്ല’ എന്നാണ്.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: തല ചായ്ക്കാൻ
  rationale: വിശ്രമിക്കാനോ ഉറങ്ങാനോ ഒരു ഇടമുണ്ടെന്ന ദൃശ്യബിംബം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മൃഗങ്ങൾക്കുള്ള അഭയസ്ഥാനവും മനുഷ്യപുത്രന്റെ അഭാവവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: യേശു അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്ക് വാക്യഘടനയുടെ അർഥം സ്വാഭാവിക മലയാള ആഖ്യാനശൈലിയിൽ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: υἱὸς τοῦ ἀνθρώπου എന്ന യേശുവിന്റെ സ്വയംവിശേഷണത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: സ്ഥാപിതമായ ശീർഷകരൂപം നിലനിർത്തുന്നതിലൂടെ പദത്തിന്റെ അക്ഷരാർഥവും സാധ്യതയുള്ള മിശിഹാ/അന്ത്യകാല പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു; വ്യാഖ്യാനാത്മകമായ ഒരു അർഥത്തിലേക്ക് വാചകത്തെ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വൈരുധ്യവും concrete imagery-യും നിലനിർത്തി; അനാവശ്യമായ സഭാപരമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
