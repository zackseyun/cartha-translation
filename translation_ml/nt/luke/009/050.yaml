reference: Luke 9:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവനോട് പറഞ്ഞു: “അവനെ തടയരുത്[a]. കാരണം, നിങ്ങൾക്ക് എതിരല്ലാത്തവൻ നിങ്ങൾക്ക് അനുകൂലമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ വിലക്കരുത്” അല്ലെങ്കിൽ “അവന് തടസ്സം സൃഷ്ടിക്കരുത്.”
    reason: κωλύω എന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് സന്ദർഭത്തിൽ ‘തടയുക,’ ‘വിലക്കുക,’ ‘തടസ്സപ്പെടുത്തുക’ എന്നീ അടുത്ത അർഥങ്ങൾ സാധ്യമാണ്.
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: എന്നാൽ യേശു അവനോട് പറഞ്ഞു
  rationale: δέ ഇവിടെ മുൻവാക്യത്തിലെ ശിഷ്യന്റെ എതിർപ്പിനോടുള്ള മൃദുവായ പ്രതിവാദം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്. πρὸς αὐτόν എന്ന സർവനാമരൂപം ‘അവനോട്’ എന്നു തന്നെയാണ് നിലനിർത്തിയത്.
- source_word: Μὴ κωλύετε
  choice: അവനെ തടയരുത്
  rationale: κωλύω എന്നതിന് തടയുക, വിലക്കുക, മുടക്കുക എന്നീ അർഥങ്ങളുണ്ട്. മുൻസന്ദർഭത്തിൽ പേരുപറയാത്ത ആ മനുഷ്യന്റെ പ്രവർത്തനം നിർത്തിക്കാൻ ശിഷ്യന്മാർ ശ്രമിച്ചതിനാൽ ‘തടയരുത്’ പ്രായോഗിക ശക്തി വ്യക്തമായി നൽകുന്നു. ക്രിയയുടെ ബഹുവചന അഭിസംബോധന മലയാളത്തിലെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നു; ‘അവനെ’ എന്ന കർമം മുൻവാക്യത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: ὃς γὰρ
  choice: കാരണം, ... അല്ലാത്തവൻ
  rationale: γάρ കാരണം നൽകുന്നു; ὃς ഉടനെയുള്ള വ്യക്തിയെ ഉൾക്കൊള്ളുന്ന പൊതുതത്ത്വവും പ്രകടിപ്പിക്കാം. മലയാളത്തിലെ ‘... അല്ലാത്തവൻ’ ആ പൊതുസ്വഭാവം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: നിങ്ങൾക്ക് എതിരല്ലാത്തവൻ
  rationale: κατά + genitive ഇവിടെ എതിർപ്പ് സൂചിപ്പിക്കുന്നു. ὑμῶν ബഹുവചനമായതിനാൽ ‘നിങ്ങൾക്ക്’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ὑπὲρ ὑμῶν ἐστιν
  choice: നിങ്ങൾക്ക് അനുകൂലമാണ്
  rationale: ὑπέρ ഇവിടെ പിന്തുണയോ അനുകൂല നിലപാടോ സൂചിപ്പിക്കുന്നു. ‘അനുകൂലമാണ്’ എന്നത് ‘എതിരല്ലാത്തവൻ’ എന്നതിനോടുള്ള വിരുദ്ധസമാന്തരത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: ‘നിങ്ങൾക്ക് എതിരല്ലാത്തവൻ നിങ്ങൾക്ക് അനുകൂലമാണ്’ എന്ന പൊതുതത്ത്വമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നിങ്ങൾക്ക് എതിരല്ലാത്ത ആൾ നിങ്ങൾക്ക് അനുകൂലമാണ്’ എന്ന് ഉടനെയുള്ള വ്യക്തിയിലേക്കു മാത്രം ചുരുക്കുക.
  rationale: ὃς ഉടനെയുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുമ്പോഴും പൊതുവായ നയവാക്യശക്തി വഹിക്കാം. തിരഞ്ഞെടുത്ത രൂപം ആ വിശാലത നിലനിർത്തുന്നു; പ്രത്യേക സഭാപരമോ സിദ്ധാന്തപരമോ ആയ പരിധി ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിങ്ങൾക്ക്’ എന്ന ബഹുവചനരൂപം ഗ്രീക്കിലെ ὑμῶν എന്ന ബഹുവചനം വ്യക്തമാക്കുന്നു. ഉദ്ധരണിക്കുള്ളിലെ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്നതായി സൂക്ഷിച്ചു.
