id: LUK.9.14
reference: Luke 9:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν γὰρ ὡσεὶ ἄνδρες πεντακισχίλιοι. εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Κατακλίνατε αὐτοὺς κλισίας ⸀ὡσεὶ ἀνὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: ml
  text: 'ഏകദേശം അയ്യായിരം പുരുഷന്മാർ[a] ഉണ്ടായിരുന്നു. അവൻ തന്റെ ശിഷ്യന്മാരോടു പറഞ്ഞു: “അവരെ ഏകദേശം അമ്പതുപേർ വീതമുള്ള കൂട്ടങ്ങളായി ചാരിക്കിടത്തുക[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘പുരുഷന്മാർ’ എന്നാണ്; ഈ സംഖ്യ പ്രായപൂർത്തിയായ പുരുഷന്മാരെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു. സ്ത്രീകളെയും കുട്ടികളെയും ഈ സംഖ്യയിൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അവരെ ഏകദേശം അമ്പതുപേർ വീതമുള്ള കൂട്ടങ്ങളായി ഇരുത്തുക.’ ഗ്രീക്ക് ക്രിയ ഭക്ഷണം കഴിക്കാനായി ചാരിക്കിടക്കാൻ ക്രമപ്പെടുത്തുന്നതിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: ഏകദേശം
  rationale: രണ്ടിടത്തും കൃത്യസംഖ്യയല്ല, ഏകദേശസംഖ്യയാണെന്ന് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἄνδρες
  choice: പുരുഷന്മാർ
  rationale: ἀνήρ പൊതുവായി ആളുകളെയല്ല, പ്രായപൂർത്തിയായ പുരുഷന്മാരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മൂലത്തിന്റെ ലിംഗവിശദത നിലനിർത്തുന്നു.
- source_word: πεντακισχίλιοι
  choice: അയ്യായിരം
  rationale: പുരുഷന്മാരുടെ എണ്ണം സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സംഖ്യാവിവർത്തനം.
- source_word: Κατακλίνατε
  choice: ഭക്ഷണത്തിനിരുത്തുക
  rationale: ഭക്ഷണം കഴിക്കാനായി ചാരിക്കിടക്കുകയോ ഇരിക്കുകയോ ചെയ്യിക്കുന്നതെന്ന ക്രിയയുടെ സാഹചര്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ശരീരനിലയുടെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κλισίας
  choice: കൂട്ടങ്ങളായി
  rationale: ക്രമീകരിച്ച വിഭാഗങ്ങൾ അഥവാ കൂട്ടങ്ങൾ എന്ന ബഹുവചനാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀνὰ πεντήκοντα
  choice: അമ്പതുപേർ വീതമുള്ള
  rationale: ἀνάയിലുള്ള വിതരണാർഥം ‘വീതമുള്ള’ എന്ന പ്രയോഗം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γὰρ ... δὲ
  choice: ഉണ്ടായിരുന്നു. ... പറഞ്ഞു
  rationale: γάρ മുൻസന്ദർഭത്തിന്റെ വിശദീകരണമായി പ്രവർത്തിക്കുന്നു; δέ കഥയുടെ തുടർച്ച അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ കൃത്രിമമായ ബന്ധകങ്ങൾ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ഈ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരോടു
  rationale: മൂലത്തിലുള്ള സ്വത്തുസൂചക സർവനാമം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഭക്ഷണത്തിനിരുത്തുക’ സാധാരണ വായനക്കാർക്ക് സാഹചര്യം ഉടൻ ഗ്രഹിക്കാവുന്നതാക്കുന്നു; ഗ്രീക്ക് ക്രിയയിലെ ചാരിക്കിടക്കൽസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്. വ്യക്തതയ്ക്കായി കർത്താവായ യേശുവിന്റെ പേര് ചേർത്തത് സന്ദർഭത്തിൽ വ്യക്തമായ സർവനാമത്തെ പ്രതിനിധീകരിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
