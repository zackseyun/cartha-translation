reference: Luke 9:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: ml
  text: 'ദിവസം ചായാൻ തുടങ്ങി; പന്ത്രണ്ടുപേർ അവന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “ജനക്കൂട്ടത്തെ പറഞ്ഞയയ്ക്കുക; അവർ ചുറ്റുമുള്ള ഗ്രാമങ്ങളിലും നാട്ടിൻപുറങ്ങളിലും ചെന്നു താമസിക്കാൻ ഇടം കണ്ടെത്തുകയും ഭക്ഷണസാധനങ്ങൾ[b] കണ്ടെത്തുകയും ചെയ്യട്ടെ; കാരണം നാം ഇവിടെ ഒരു വിജനസ്ഥലത്താണ്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആളൊഴിഞ്ഞ സ്ഥലത്ത്” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ἔρημος എന്ന പദത്തിന് ജനവാസമില്ലാത്തതോ ജനവാസം വിരളമായതോ ആയ പ്രദേശം എന്നർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ഭക്ഷണം” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ἐπισιτισμός എന്ന പദം ഭക്ഷണത്തെയോ ഭക്ഷണസാധനങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: പകൽ ചായാൻ തുടങ്ങി
  rationale: κλίνω എന്നതിലെ ‘ചായുക’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് ദിവസം സന്ധ്യയിലേക്കു നീങ്ങുന്നതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു. δέ-യുടെ ലഘുവായ ആഖ്യാനബന്ധം അടുത്ത വാക്യത്തിലെ ‘അപ്പോൾ’ വഴി പ്രകടമാക്കി.
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: അപ്പോൾ പന്ത്രണ്ടുപേർ അവന്റെ അടുത്തുവന്ന്
  rationale: προσέρχομαι എന്ന ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; οἱ δώδεκα എന്ന സ്ഥിരമായ സംഘസൂചനയെ ‘പന്ത്രണ്ടുപേർ’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തെ പറഞ്ഞയയ്ക്കുക
  rationale: ഇവിടെ ἀπολύω എന്നത് മോചിപ്പിക്കുക എന്നതിലുപരി പിരിച്ചയയ്ക്കുക അഥവാ പറഞ്ഞയയ്ക്കുക എന്ന സന്ദർഭാർഥത്തിലാണ്.
- source_word: ἵνα πορευθέντες
  choice: അവർ ... ചെന്ന് ... ചെയ്യട്ടെ
  rationale: പോയതിനുശേഷമുള്ള ഉദ്ദേശിച്ച പ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുന്ന ἵνα-വാക്യവും participle-ഉം മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യഘടനയായി ചേർത്തു.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: ചുറ്റുമുള്ള ഗ്രാമങ്ങളിലും നാട്ടിൻപുറങ്ങളിലും
  rationale: κύκλῳ എന്ന ‘ചുറ്റുമുള്ള’ അർഥവും κώμαι എന്ന ‘ഗ്രാമങ്ങൾ’ എന്ന അർഥവും നിലനിർത്തുന്നു. ἀγροί ഇവിടെ കൃഷിയിടങ്ങൾ മാത്രമല്ല, വിശാലമായ ഗ്രാമപ്രദേശങ്ങളെയും സൂചിപ്പിക്കാവുന്നതിനാൽ ‘നാട്ടിൻപുറങ്ങൾ’ തെരഞ്ഞെടുത്തു.
- source_word: καταλύσωσιν
  choice: താമസസ്ഥലം കണ്ടെത്തുകയും
  rationale: ഈ സന്ദർഭത്തിൽ καταλύω രാത്രി പാർക്കാനോ തങ്ങാനോ ഇടം നേടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ ‘താമസസ്ഥലം കണ്ടെത്തുക’ എന്നു നൽകി.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: ഭക്ഷണസാധനങ്ങൾ ലഭ്യമാക്കുകയും
  rationale: ἐπισιτισμός ഭക്ഷണമോ ഭക്ഷണവിതരണമോ ആയ കരുതൽസാധനങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘ഭക്ഷണസാധനങ്ങൾ’ അതിന്റെ പരിധി നിലനിർത്തുന്നു; ‘ലഭ്യമാക്കുക’ εὕρωσιν-ന്റെ സന്ദർഭപരമായ ഫലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: കാരണം നാം ഇവിടെ ഒരു വിജനസ്ഥലത്താണ്
  rationale: ὅτι-യുടെ കാരണബന്ധവും ὧδε എന്ന ‘ഇവിടെ’ എന്ന സൂചനയും വ്യക്തമായി നിലനിർത്തി. ἔρημος ജനവാസമില്ലാത്തതോ വിരളമായതോ ആയ പ്രദേശത്തെ സൂചിപ്പിക്കാം; ‘വിജനസ്ഥലം’ അനാവശ്യമായ പ്രത്യേക ദൈവശാസ്ത്രസൂചനകൾ ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പകൽ ചായാൻ തുടങ്ങി’ എന്ന പ്രയോഗം മൂലത്തിലെ രൂപകം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് [a] അതു വിശദീകരിക്കുന്ന ἔρημος എന്ന പദത്തിനരികിലും [b] ἐπισιτισμός എന്ന പദത്തിന്റെ പരിഭാഷയ്ക്കരികിലും ചേർത്തിരിക്കുന്നു.
