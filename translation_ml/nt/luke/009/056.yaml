    text: അഥവാ, ‘വേറൊരു ഗ്രാമത്തിലേക്കു.’ ഗ്രീക്ക് വിശേഷണത്തിന് മറ്റൊന്ന് എന്ന സാധാരണ അർഥത്തോടൊപ്പം വ്യത്യസ്തമായ ഒന്ന് എന്ന ആശയത്തിനും ഊന്നൽ നൽകാനാകും.
