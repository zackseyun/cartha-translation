lexical_decisions:
- source_word: καὶ
  choice: അവർ… പോയി
  rationale: ഗ്രീക്കിലെ ലളിതമായ ആഖ്യാനബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; പ്രത്യേകമായ കാലസൂചന കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἐπορεύθησαν
  choice: പോയി
  rationale: πορεύομαι എന്ന ക്രിയയുടെ ‘പോകുക, യാത്രചെയ്യുക, മുന്നോട്ടുപോകുക’ എന്ന അടിസ്ഥാന ചലനാർഥം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς
  choice: -ലേക്കു
  rationale: ചലനത്തിന്റെ ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ അർഥം മലയാളത്തിലെ ദിശാവിഭക്തിയിലൂടെ കൃത്യമായി നൽകുന്നു.
- source_word: ἑτέραν
  choice: മറ്റൊരു
  rationale: ἕτερος സൂചിപ്പിക്കാവുന്ന ‘വേറൊന്ന്/മറ്റൊന്ന്’ എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘വേറൊരു’ എന്ന ഊന്നലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κώμην
  choice: ഗ്രാമം
  rationale: κώμη വലിയ നഗരത്തേക്കാൾ ചെറിയ ഗ്രാമീണ ജനവാസകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഗ്രാമം’ ഏറ്റവും കൃത്യമാണ്.
