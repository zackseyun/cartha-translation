source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: ml
  text: ദൈവരാജ്യം[a] പ്രസംഗിക്കാനും രോഗികളെ സുഖപ്പെടുത്താനുമായി അവൻ അവരെ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്തിന്റെ രാജവാഴ്ച.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: ἀποστέλλω ഇവിടെ നിയോഗിച്ച് അയയ്ക്കുക എന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ ‘അയച്ചു’ സ്വാഭാവികവും സന്ദർഭത്തിലെ ദൗത്യനിയോഗം ഉൾക്കൊള്ളുന്നതുമാണ്.
- source_word: κηρύσσειν
  choice: പ്രസംഗിക്കാൻ
  rationale: κηρύσσω പരസ്യമായി പ്രഖ്യാപിക്കുക എന്ന ആശയം നൽകുന്നു. മലയാള ബൈബിൾഭാഷയിലും പൊതുവ്യവഹാരത്തിലും ‘പ്രസംഗിക്കുക’ ഈ സന്ദർഭത്തിന് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: ഈ പ്രയോഗത്തിന് ദൈവത്തിന്റെ രാജ്യം എന്നും ദൈവത്തിന്റെ രാജവാഴ്ച എന്നും അർഥവ്യാപ്തിയുണ്ട്. ‘ദൈവരാജ്യം’ സ്ഥാപിതവും വിശാലത നിലനിർത്തുന്നതുമായ മലയാള പ്രയോഗമാണ്.
- source_word: ἰᾶσθαι
  choice: സുഖപ്പെടുത്താൻ
  rationale: ἰάομαι രോഗത്തിൽനിന്നുള്ള സൗഖ്യമാക്കലിനെ സൂചിപ്പിക്കുന്നു. ‘സുഖപ്പെടുത്തുക’ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: τοὺς ἀσθενεῖς
  choice: രോഗികളെ
  rationale: ἀσθενής എന്നതിന് പൊതുവേ ബലഹീനർ എന്നും വരാമെങ്കിലും, ἰᾶσθαι എന്ന ക്രിയയോടൊപ്പമുള്ള ഈ സന്ദർഭത്തിൽ രോഗികളെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: ദൈവരാജ്യം
  alternative: ദൈവത്തിന്റെ രാജവാഴ്ച
  rationale: മൂലപ്രയോഗം ദൈവത്തിന്റെ ഭരണത്തെയും രാജ്യത്തെയും ഉൾക്കൊള്ളാൻ കഴിയും. ‘ദൈവരാജ്യം’ ഈ ദൈവശാസ്ത്രപരമായ വിശാലത ചുരുക്കാതെ നിലനിർത്തുന്നു; ‘രാജവാഴ്ച’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വാക്യക്രമം ലക്ഷ്യഭാഷയിൽ സ്വാഭാവികമാക്കിയെങ്കിലും മൂലത്തിലെ രണ്ടു ലക്ഷ്യങ്ങളും—പ്രസംഗിക്കലും സുഖപ്പെടുത്തലും—വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
