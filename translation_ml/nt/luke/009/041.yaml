id: LUK.9.41
reference: Luke 9:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു മറുപടി പറഞ്ഞു: “അവിശ്വാസം നിറഞ്ഞതും വഴിതെറ്റിയതുമായ തലമുറയേ, എത്രകാലം ഞാൻ നിങ്ങളോടുകൂടെ ഇരിക്കുകയും നിങ്ങളെ സഹിക്കുകയും വേണം? നിന്റെ മകനെ ഇങ്ങോട്ട് കൊണ്ടുവരിക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄπιστος
  choice: അവിശ്വാസമുള്ള
  rationale: വിശ്വാസമില്ലാത്ത എന്ന അടിസ്ഥാനാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: διεστραμμένη
  choice: വഴിതെറ്റിയ
  rationale: വളച്ചുമറിക്കപ്പെട്ട, വികലമായ, നേരായ വഴിയിൽനിന്ന് തെറ്റിയ എന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു; വെറും ബൗദ്ധിക തെറ്റല്ല, ധാർമ്മിക-ആത്മീയ വികലതയും സൂചിപ്പിക്കുന്നു.
- source_word: ἀνέξομαι ὑμῶν
  choice: നിങ്ങളെ സഹിക്കുകയും വേണം
  rationale: ഭാവികാല ക്രിയയുടെ ‘സഹിച്ചുകൊണ്ടിരിക്കുക/പൊറുക്കുക’ എന്ന ഭാവവും ചോദ്യത്തിലെ വ്യാകുലതയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: προσάγαγε ὧδε
  choice: ഇങ്ങോട്ട് കൊണ്ടുവരിക
  rationale: ആജ്ഞയുടെ നേരിട്ടുള്ള സ്വഭാവവും സംസാരിക്കുന്നവന്റെ അടുക്കലേക്കുള്ള ചലനവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘തലമുറ’ ആരെ ഉൾക്കൊള്ളുന്നു എന്ന പരിധി
  choice: മൂലപാഠത്തിലെ പൊതുവായ ബഹുവചന അഭിസംബോധന അതേപടി നിലനിർത്തി
  alternative: ശിഷ്യന്മാരെയോ ജനക്കൂട്ടത്തെയോ മാത്രം വ്യക്തമായി നിർദേശിക്കുക
  rationale: സന്ദർഭത്തിൽ അഭിസംബോധനയുടെ കൃത്യപരിധി വിവാദസാധ്യതയുള്ളതിനാൽ പരിഭാഷയിൽ അത് ചുരുക്കി നിർണ്ണയിച്ചിട്ടില്ല.
- issue: διεστραμμένη എന്നതിന്റെ ധാർമ്മിക തീവ്രത
  choice: വഴിതെറ്റിയ
  alternative: വികൃതമായ / ദുഷിച്ച
  rationale: മൂലത്തിലെ ശക്തമായ വിമർശനം സംരക്ഷിക്കുമ്പോഴും ആധുനിക മലയാളത്തിൽ അനാവശ്യമായ ശാരീരികമോ അപമാനകരമോ ആയ ധ്വനി ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നേരിട്ടുള്ള വാക്യരീതി. ‘തലമുറയേ’ എന്ന സംബോധന ബൈബിൾ പ്രസംഗശൈലിയുടെ ഗൗരവം നിലനിർത്തുന്നു; ശേഷിക്കുന്ന വാചകം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
