id: 1PE.3.4
reference: 1 Peter 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: ml
  text: മറിച്ച്, നിങ്ങളുടെ അലങ്കാരം ഹൃദയത്തിൽ മറഞ്ഞിരിക്കുന്ന വ്യക്തിയിലും സൗമ്യവും ശാന്തവുമായ ആത്മാവിന്റെ നശിക്കാത്ത സൗന്ദര്യത്തിലുമാകട്ടെ[a][b][c]. ഇത് ദൈവസന്നിധിയിൽ വളരെ വിലപ്പെട്ടതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹൃദയത്തിന്റെ മറഞ്ഞിരിക്കുന്ന മനുഷ്യൻ.” ഗ്രീക്കിലെ ἄνθρωπος എന്ന പദത്തിന് ‘മനുഷ്യൻ’ എന്നോ പൊതുവായി ‘വ്യക്തി’ എന്നോ അർഥമാകാം; ഇവിടെ അത് ഉള്ളിലെ സ്വത്വത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “സൗമ്യവും ശാന്തവുമായ ആത്മാവിന്റെ നശിക്കാത്തതിൽ.” മുൻവാക്യത്തിലെ പുറമേയുള്ള അലങ്കാരത്തോടുള്ള വൈരുധ്യത്തിൽനിന്നാണ് ‘സൗന്ദര്യം’ എന്ന പദം ചേർത്തിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘ശാന്തമായ’ എന്നത് മൗനമായിരിക്കുക എന്നല്ല, സമാധാനപൂർണവും കലഹരഹിതവുമായ മനോഭാവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: ഹൃദയത്തിന്റെ മറഞ്ഞിരിക്കുന്ന വ്യക്തി
  rationale: ἄνθρωπος ഇവിടെ പുരുഷനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നില്ല; ഉള്ളിലെ വ്യക്തിത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്. κρυπτός എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മറഞ്ഞിരിക്കുന്ന’ എന്നും നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: നശിക്കാത്ത സൗന്ദര്യത്തിൽ
  rationale: ഗ്രീക്കിൽ നാമം വ്യക്തമാക്കാതെ വന്നിരിക്കുന്ന ചുരുക്കപ്രയോഗമാണിത്. മുൻവാക്യത്തിലെ ബാഹ്യ അലങ്കാരത്തോടുള്ള വൈരുധ്യം കണക്കിലെടുത്ത് ‘സൗന്ദര്യം’ ചേർക്കുന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; ഈ ചേർക്കൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πραέως
  choice: സൗമ്യമായ
  rationale: πραΰς സൂചിപ്പിക്കുന്ന മൃദുത്വവും ആക്രമണരഹിതമായ സ്വഭാവവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἡσυχίου
  choice: ശാന്തമായ
  rationale: നിർബന്ധിത മൗനമല്ല, സമാധാനപൂർണവും കലഹരഹിതവുമായ മനോഭാവമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: πνεύματος
  choice: ആത്മാവ്
  rationale: മനോഭാവം എന്ന ആശയം ഉൾക്കൊള്ളുന്നുവെങ്കിലും, മൂലപാഠത്തിലെ മാനവശാസ്ത്രപരമായ ഭാഷ നിലനിർത്താൻ നേരിട്ടുള്ള തുല്യപദം ഉപയോഗിക്കുന്നു.
- source_word: ὅ ἐστιν
  choice: അതു ... ആണ്
  rationale: മുൻപറഞ്ഞ സൗമ്യവും ശാന്തവുമായ ആത്മാവിന്റെ നശിക്കാത്ത സൗന്ദര്യത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: πολυτελές
  choice: അത്യന്തം വിലയേറിയത്
  rationale: വളരെ ഉയർന്ന മൂല്യം എന്ന തീവ്രത വ്യക്തമാക്കുകയും പുറമേയുള്ള വിലയേറിയ അലങ്കാരങ്ങളോടുള്ള സന്ദർഭപരമായ വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ലിംഗസൂചനയുള്ള സന്ദർഭത്തിലെ ἄνθρωπος എന്ന മാനവശാസ്ത്രപരമായ പ്രയോഗം
  choice: ‘പുരുഷൻ’ എന്നല്ല, ‘വ്യക്തി’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ഹൃദയത്തിന്റെ മറഞ്ഞിരിക്കുന്ന മനുഷ്യൻ
  rationale: ഈ പദം ഇവിടെ പുരുഷലിംഗത്തെ സൂചിപ്പിക്കുന്നതല്ല; ഉള്ളിലെ സ്വത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സ്ത്രീകളെ അഭിസംബോധന ചെയ്യുന്ന സന്ദർഭത്തിൽ ‘പുരുഷൻ’ തെറ്റായ ധാരണ സൃഷ്ടിക്കാം.
- issue: ἀφθάρτῳ എന്ന വിശേഷണത്തോടൊപ്പം സൂചിതമായ നാമം ചേർക്കൽ
  choice: ‘നശിക്കാത്ത സൗന്ദര്യം’ എന്ന് നൽകി.
  alternative: സൗമ്യവും ശാന്തവുമായ ആത്മാവിന്റെ നശിക്കാത്ത ഗുണത്തിൽ
  rationale: മൂലപാഠത്തിലെ ചുരുക്കപ്രയോഗം യഥാതഥമായി മലയാളത്തിലാക്കിയാൽ അസ്വാഭാവികമാകും. മുൻവാക്യത്തിലെ ബാഹ്യ അലങ്കാരത്തോടുള്ള വൈരുധ്യം ‘സൗന്ദര്യം’ എന്ന സൂചിത നാമത്തെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും ചേർത്ത പദമാണെന്നത് അടിക്കുറിപ്പിൽ വെളിപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ ചുരുക്കപ്രയോഗം സ്വാഭാവികമാക്കുമ്പോഴും അതിലെ അർഥവ്യാപ്തിയും വ്യാഖ്യാനസാധ്യതയും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിരിക്കുന്നു.
