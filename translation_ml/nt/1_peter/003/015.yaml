  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: ml
  text: എന്നാൽ കർത്താവായ മശീഹാവിനെ നിങ്ങളുടെ ഹൃദയങ്ങളിൽ വിശുദ്ധനായി കരുതുവിൻ[a]; നിങ്ങളിലുള്ള പ്രത്യാശയെക്കുറിച്ചു നിങ്ങളോടു കാരണം ചോദിക്കുന്ന ഏവർക്കും പ്രതിരോധമറുപടി നൽകാൻ എപ്പോഴും സന്നദ്ധരായിരിക്കുവിൻ,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “കർത്താവായ മശീഹാവിനെ നിങ്ങളുടെ ഹൃദയങ്ങളിൽ വിശുദ്ധീകരിക്കുവിൻ” അഥവാ “വിശുദ്ധനായി വേർതിരിക്കുവിൻ.”'
    reason: lexical_alternative
  - marker: b
    text: “പ്രതിരോധമറുപടി” എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് ഒരാളുടെ നിലപാടിനെ വിശദീകരിക്കുകയോ അതിനെ പ്രതിരോധിക്കുകയോ ചെയ്യുന്ന ഉത്തരം എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριον δὲ τὸν Χριστὸν
  choice: എന്നാൽ കർത്താവായ മശീഹായെ
  rationale: κύριος എന്ന പദത്തിന്റെ ‘കർത്താവ്’ എന്ന അർഥവും Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ ‘മശീഹാ’ എന്ന അർഥവും നിലനിർത്തുന്നു. പദസമുച്ചയം മശീഹായെ കർത്താവായി അംഗീകരിക്കുന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἁγιάσατε
  choice: വിശുദ്ധനായി ആദരിക്കുവിൻ
  rationale: പദത്തിന്റെ അടിസ്ഥാനമായ ‘വിശുദ്ധനായി വേർതിരിക്കുക/കരുതുക’ എന്ന ആശയം കാത്തുകൊണ്ട്, മനുഷ്യർ മശീഹായെ വിശുദ്ധനാക്കുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളിൽ
  rationale: ആന്തരിക വ്യക്തിത്വത്തെയും മനോഭാവത്തെയും സൂചിപ്പിക്കുന്ന രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν
  choice: മറുപടി നൽകാൻ എപ്പോഴും ഒരുക്കമായിരിക്കുവിൻ
  rationale: ἀπολογίαയിൽ അടങ്ങിയ വിശദീകരണപരവും പ്രതിരോധപരവുമായ മറുപടിയുടെ ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον
  choice: നിങ്ങളോടു കാരണം ചോദിക്കുന്ന ഏവർക്കും
  rationale: παντίയുടെ സർവവ്യാപക അർഥവും λόγος ഇവിടെ സൂചിപ്പിക്കുന്ന കാരണം അഥവാ വിശദീകരണം എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: നിങ്ങളിലുള്ള പ്രത്യാശയെക്കുറിച്ച്
  rationale: പ്രത്യാശ വിശ്വാസികളിൽ ഉള്ളതായി പറയുന്ന ഗ്രീക്ക് പ്രയോഗം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός കർത്താവ് എന്ന പദത്തോടു ചേർന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം പരിഭാഷപ്പെടുത്തി ‘മശീഹാ’ എന്നു നൽകിയിരിക്കുന്നു.
- issue: മശീഹാ ἁγιάσατε എന്ന ക്രിയയുടെ കർമമായിരിക്കുന്നത്
  choice: വിശുദ്ധനായി ആദരിക്കുവിൻ
  alternative: വിശുദ്ധീകരിക്കുവിൻ
  rationale: വിശുദ്ധതയെ സംബന്ധിച്ച ഗ്രീക്ക് ക്രിയയുടെ ശക്തി നിലനിർത്തുമ്പോഴും, മശീഹായുടെ വിശുദ്ധി മനുഷ്യരുടെ പ്രവൃത്തിയാൽ ഉണ്ടാകുന്നു എന്ന ധാരണ ഒഴിവാക്കി ഹൃദയത്തിലെ ഭക്തിപൂർവമായ അംഗീകാരം വ്യക്തമാക്കുന്നു.
- issue: ἀπολογίαയുടെ പരിധി
  choice: മറുപടി
  alternative: പ്രതിരോധവാദം
  rationale: സന്ദർഭത്തിൽ ചോദിക്കുന്നവർക്കു കാരണസഹിതമായ വിശദീകരണം നൽകുന്നതാണ് ഉദ്ദേശ്യം; ‘മറുപടി’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്, എന്നാൽ പദത്തിലുള്ള പ്രതിരോധപരമായ ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായി ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവം നിലനിർത്താൻ ബഹുവചന ആജ്ഞാരൂപമായ ‘ആദരിക്കുവിൻ’, ‘ഒരുക്കമായിരിക്കുവിൻ’ എന്നിവ ഉപയോഗിച്ചു; അതേസമയം അനാവശ്യമായി പുരാതനമായ പദക്രമം ഒഴിവാക്കി.
