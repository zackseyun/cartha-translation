id: 1PE.3.6
reference: 1 Peter 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: ml
  text: സാറാ അബ്രാഹാമിനെ അനുസരിക്കുകയും അദ്ദേഹത്തെ “നാഥൻ” എന്നു വിളിക്കുകയും ചെയ്തതുപോലെ, നിങ്ങൾ നന്മ ചെയ്യുകയും യാതൊരു ഭീഷണിയെയും ഭയപ്പെടാതിരിക്കുകയും ചെയ്യുന്നുവെങ്കിൽ അവളുടെ മക്കളായിത്തീർന്നിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാതൊരു ഭീതിയെയും” അല്ലെങ്കിൽ “ഭയപ്പെടുത്തുന്ന ഒന്നിനെയും.”
    reason: πτόησις എന്ന പദത്തിന് ഭീതി, ഭയപ്പെടുത്തുന്ന കാര്യം, ഭീഷണി എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: ὡς
  choice: ചെയ്തതുപോലെതന്നെ
  rationale: മുൻസന്ദർഭത്തിലെ പ്രബോധനത്തോടു സാറായുടെ മാതൃകയെ താരതമ്യപ്പെടുത്തി ബന്ധിപ്പിക്കുന്ന പ്രയോഗം.
- source_word: ὑπήκουσεν
  choice: അനുസരിച്ചു
  rationale: ὑπακούω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘അനുസരിക്കുക’ നിലനിർത്തുന്നു; ആശയത്തെ ദുർബലമാക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
- source_word: κύριον
  choice: യജമാനൻ
  rationale: ഇവിടെ ദൈവിക പദവിയല്ല, അബ്രാഹാമിനെ ആദരപൂർവം വിശേഷിപ്പിക്കുന്ന സാധാരണ നാമമാണ്; മലയാളത്തിൽ ‘കർത്താവ്’ ദൈവിക പദവിയായി തെറ്റിദ്ധരിക്കപ്പെടാൻ സാധ്യതയുള്ളതിനാൽ ‘യജമാനൻ’ തിരഞ്ഞെടുത്തു.
- source_word: καλοῦσα
  choice: വിളിക്കുകയും
  rationale: സാറായുടെ വാക്കിലൂടെ പ്രകടമായ പ്രവൃത്തിയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐγενήθητε τέκνα
  choice: മക്കളായിത്തീർന്നിരിക്കുന്നു
  rationale: γίνομαι സൂചിപ്പിക്കുന്ന ഒരു നിലയിലേക്കുള്ള പ്രവേശനവും അതിന്റെ ഇപ്പോഴത്തെ ഫലവും നിലനിർത്തുന്നു; τέκναയിലെ കുടുംബരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: ἀγαθοποιοῦσαι
  choice: നന്മ ചെയ്യുകയും
  rationale: സ്ത്രീലിംഗ ബഹുവചന കർത്താക്കളോടുള്ള പ്രബോധനം സ്വാഭാവിക മലയാളത്തിൽ ക്രിയാരൂപമായി നൽകുന്നു.
- source_word: μὴ φοβούμεναι
  choice: ഭയപ്പെടാതിരിക്കുകയും
  rationale: തുടർച്ചയായ ഭയരഹിത മനോഭാവം സൂചിപ്പിക്കുകയും മുൻപത്തെ പങ്കാളിക്രിയയോടുള്ള ഏകോപനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μηδεμίαν πτόησιν
  choice: യാതൊരു ഭീഷണിയെയും
  rationale: πτόησις ഭയം, ഭീതിപ്പെടുത്തുന്ന കാര്യം, ഭീഷണി എന്നിവ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ പുറമേ നിന്നുള്ള ഭീതിപ്പെടുത്തലും ഉൾക്കൊള്ളുന്ന ‘ഭീഷണി’ സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ക്രിസ്തീയ ഭാര്യമാർക്കുള്ള മാതൃകയായി സാറായുടെ അനുസരണം
  choice: ὑπήκουσεν എന്നതിന് നേരായ ‘അനുസരിച്ചു’ എന്ന പരിഭാഷ നൽകി, വാക്യം പറയുന്നതിലപ്പുറം വിവാഹത്തെക്കുറിച്ചുള്ള സമഗ്ര സിദ്ധാന്തം ചേർത്തിട്ടില്ല.
  alternative: സാംസ്കാരിക അസ്വസ്ഥത കുറയ്ക്കാൻ ‘കീഴടങ്ങി’ എന്നോ കൂടുതൽ മൃദുവായ പ്രയോഗമോ നൽകുക.
  rationale: മൂലക്രിയയുടെ വ്യക്തമായ അർഥം സിദ്ധാന്തപരമോ സാംസ്കാരികമോ ആയ കാരണങ്ങളാൽ മൃദൂകരിക്കരുത്; അതേസമയം ഈ ഒറ്റ വാക്യത്തിൽ ഇല്ലാത്ത അവകാശവാദങ്ങളും ചേർക്കരുത്.
- issue: ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι എന്നീ പങ്കാളിക്രിയകളുടെ ബന്ധം
  choice: ‘ചെയ്താൽ’ എന്ന വ്യവസ്ഥാപരമായ രൂപത്തിൽ അവതരിപ്പിച്ചു.
  alternative: ‘നന്മ ചെയ്തുകൊണ്ടും ... ഭയപ്പെടാതെയും’ എന്ന വിവരണാത്മക രൂപം.
  rationale: പങ്കാളിക്രിയകൾ സാറായുടെ മക്കളായുള്ള തിരിച്ചറിവ് എങ്ങനെ പ്രകടമാകുന്നു എന്ന് വിവരിക്കുന്നു; സന്ദർഭത്തിൽ പ്രായോഗികമായ വ്യവസ്ഥാഭാവം ഉണ്ടെങ്കിലും അതിനെ കടുത്ത കാരണ-ഫല സിദ്ധാന്തമാക്കി വികസിപ്പിക്കുന്നില്ല.
- issue: κύριος എന്ന പദത്തിന്റെ ദൈവികമല്ലാത്ത പ്രയോഗം
  choice: ‘യജമാനൻ’ എന്ന സാധാരണ നാമം ഉപയോഗിച്ചു.
  alternative: ‘കർത്താവ്’ അല്ലെങ്കിൽ ‘നാഥൻ’.
  rationale: ഉല്പത്തി 18:12-ലെ ആദരസൂചക അഭിസംബോധനയാണ് ഉദ്ദേശ്യം. മലയാളത്തിലെ ‘കർത്താവ്’ സാധാരണയായി ദൈവിക പദവിയായി കേൾക്കുന്നതിനാൽ തെറ്റായ ദൈവശാസ്ത്രസൂചന ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അദ്ദേഹത്തെ’ ആദരസൂചകമായി ഉപയോഗിച്ചു. മൂലത്തിലെ താരതമ്യം, കുടുംബരൂപകം, വ്യവസ്ഥാഭാവം, ഭയം/ഭീഷണി എന്ന ലെക്സിക്കൽ അർഥവ്യാപ്തി എന്നിവ സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തു.
