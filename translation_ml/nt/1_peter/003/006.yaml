- from: സാറാ അബ്രാഹാമിനെ അനുസരിക്കുകയും അദ്ദേഹത്തെ യജമാനൻ എന്നു വിളിക്കുകയും ചെയ്തതുപോലെതന്നെ. നിങ്ങൾ നന്മ ചെയ്യുകയും യാതൊരു ഭീഷണിയെയും ഭയപ്പെടാതിരിക്കുകയും ചെയ്താൽ അവളുടെ മക്കളായിത്തീർന്നിരിക്കുന്നു.[a]
  to: സാറാ അബ്രാഹാമിനെ അനുസരിക്കുകയും അദ്ദേഹത്തെ “നാഥൻ” എന്നു വിളിക്കുകയും ചെയ്തതുപോലെ, നിങ്ങൾ നന്മ ചെയ്യുകയും യാതൊരു ഭീഷണിയെയും ഭയപ്പെടാതിരിക്കുകയും ചെയ്യുന്നുവെങ്കിൽ അവളുടെ മക്കളായിത്തീർന്നിരിക്കുന്നു.[a]
