id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: ml
  text: അതുപോലെ, ഭർത്താക്കന്മാരേ, അറിവോടെ[a] നിങ്ങളുടെ ഭാര്യമാരോടൊപ്പം ജീവിച്ചുകൊണ്ട്, അവർക്കു കൂടുതൽ ബലഹീനമായ പാത്രങ്ങൾ എന്ന നിലയിൽ ബഹുമാനം നൽകുകയും, ജീവന്റെ കൃപയുടെ സഹാവകാശികൾ എന്ന നിലയിലും അവർക്കു ബഹുമാനം നൽകുകയും ചെയ്യുക.[b] നിങ്ങളുടെ പ്രാർഥനകൾക്കു തടസ്സം വരാതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വിവേകത്തോടെ.’
    reason: lexical_alternative
  - marker: b
    text: ‘കൂടുതൽ ബലഹീനമായ പാത്രങ്ങൾ’ ഒരു രൂപകമാണ്. ഇത് സ്ത്രീകൾക്കു മൂല്യം കുറവാണെന്ന് സൂചിപ്പിക്കുന്നില്ല; ആപേക്ഷികമായ ശാരീരിക ബലഹീനതയെയോ സാമൂഹിക ദുർബലാവസ്ഥയെയോ സൂചിപ്പിച്ചേക്കാം. അതേ വാക്യം അവരെ ‘ജീവന്റെ കൃപയുടെ സഹാവകാശികൾ’ എന്നും വിളിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: ഭർത്താക്കന്മാരേ
  rationale: 3:1 മുതൽ തുടരുന്ന കുടുംബബന്ധസന്ദർഭത്തിൽ ഈ പദം പൊതുവായി പുരുഷന്മാരെയല്ല, ഭർത്താക്കന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὁμοίως
  choice: അതുപോലെതന്നെ
  rationale: മുൻപുള്ള ഉപദേശങ്ങളുമായുള്ള ബന്ധവും താരതമ്യസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: നിങ്ങളുടെ ഭാര്യമാരോടൊപ്പം അറിവോടെ ജീവിക്കുകയും
  rationale: പങ്കിട്ട ദാമ്പത്യജീവിതത്തെയും അറിവിനാൽ നയിക്കപ്പെടുന്ന പെരുമാറ്റത്തെയും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; γνῶσις എന്നതിന്റെ വിശാലത ‘മനസ്സിലാക്കി’ എന്നൊന്നിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: സ്ത്രീയെ ബലഹീനതയേറിയ പാത്രമായി കണ്ട്
  rationale: താരതമ്യവിശേഷണവും ‘പാത്രം’ എന്ന രൂപകവും നിലനിർത്തുന്നു; സ്ത്രീക്ക് മൂല്യമോ ആത്മീയസ്ഥാനമോ കുറവാണെന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἀπονέμοντες τιμήν
  choice: അവൾക്കു ബഹുമാനം നൽകുകയും
  rationale: അർഹമായ ബഹുമാനം നൽകുക എന്ന ἀπονέμωയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: συγκληρονόμοις
  choice: നിങ്ങളോടൊപ്പം അവകാശികൾ
  rationale: പങ്കിട്ട അവകാശത്തെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; പാഠഭേദത്തിന്റെ ലിംഗ/വചന വ്യത്യാസം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: χάριτος ζωῆς
  choice: ജീവന്റെ കൃപ
  rationale: കൃപ ജീവൻ തന്നെയാണോ ജീവൻ നൽകുന്നതാണോ എന്ന ജനിറ്റീവ് ബന്ധത്തിന്റെ സാധ്യതകൾ തുറന്നുവെക്കുന്നു.
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: അപ്പോൾ നിങ്ങളുടെ പ്രാർഥനകൾക്കു തടസ്സം നേരിടുകയില്ല
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ഘടനയും പ്രാർഥനകൾ തടസ്സപ്പെടുന്ന നിഷ്ക്രിയ ആശയവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ബലഹീനതയേറിയ പാത്രം’ എന്നതിന്റെ അർഥം
  choice: ആപേക്ഷികമായ ബലഹീനതയെ സൂചിപ്പിക്കുന്ന രൂപകം പ്രധാനപാഠത്തിൽ നിലനിർത്തി; മൂല്യത്തിലോ ആത്മീയസ്ഥാനത്തിലോ താഴ്മയായി വ്യാഖ്യാനിച്ചില്ല.
  alternative: ശാരീരികമായി ബലഹീന; സാമൂഹികമായി കൂടുതൽ ദുർബല; മാനസികമായി ബലഹീന
  rationale: ഗ്രീക്ക് പാഠം ബലഹീനതയുടെ കൃത്യമായ സ്വഭാവം വ്യക്തമാക്കുന്നില്ല. തുടർന്നുള്ള ബഹുമാനകല്പനയും പങ്കിട്ട അവകാശവും സ്ത്രീയുടെ താഴ്ന്ന മൂല്യം എന്ന വായനയെ പിന്തുണയ്ക്കുന്നില്ല.
- issue: ജീവന്റെ കൃപയിലെ പങ്കിട്ട അവകാശം
  choice: ഭാര്യമാർ ഭർത്താക്കന്മാരോടൊപ്പം അവകാശികളാണെന്ന ആശയം വ്യക്തമാക്കി, അവകാശത്തിന്റെ കൃത്യസ്വഭാവം ‘ജീവന്റെ കൃപ’ എന്ന പദസമുച്ചയത്തിൽ തുറന്നുവെച്ചു.
  alternative: നിത്യജീവന്റെ സഹാവകാശികൾ; ദൈവത്തിന്റെ ജീവദായകദാനത്തിന്റെ സഹാവകാശികൾ
  rationale: പാഠം പങ്കിട്ട അവകാശം ഉറപ്പിക്കുന്നുവെങ്കിലും ‘ജീവന്റെ കൃപ’ എന്നതിനെ കൂടുതൽ സങ്കുചിതമായ ഒരു ദൈവശാസ്ത്രവ്യാഖ്യാനത്തിലേക്കു ചുരുക്കുന്നില്ല.
- issue: συγκληρονόμοις എന്ന പാഠഭേദം
  choice: SBLGNTയിലെ ദത്തിവ് ബഹുവചനത്തെ പിന്തുടർന്ന് ഭാര്യമാരെ ഭർത്താക്കന്മാരോടൊപ്പം അവകാശികളായി അവതരിപ്പിച്ചു.
  alternative: ചില കൈയെഴുത്തുപ്രതികളിലെ συγκληρονόμοι എന്ന പുരുഷലിംഗ നാമനിർദ്ദേശ ബഹുവചനം പിന്തുടർന്ന് ഭർത്താക്കന്മാരെയും ഭാര്യമാരെയും സംയുക്തവിഷയമായി വായിക്കുക
  rationale: നൽകിയിരിക്കുന്ന മൂലപാഠപതിപ്പിനോടുള്ള വിശ്വസ്തത മുൻനിർത്തി; പ്രധാനപ്പെട്ട രൂപഭേദം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും പൊതുവായ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പാത്രം’, ‘ജീവന്റെ കൃപ’ തുടങ്ങിയ മൂലപാഠരൂപങ്ങൾ അർഥം അനാവശ്യമായി ചുരുക്കാതിരിക്കാൻ നിലനിർത്തി; നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്നു മലയാളവാക്യങ്ങളാക്കി.
