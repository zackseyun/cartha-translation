  source_fidelity: The concessive potential sense of ἀλλ’ εἰ καὶ πάσχοιτε, the causal force of διὰ δικαιοσύνην, and the deliberate φόβον/φοβηθῆτε repetition are accurately represented. ‘അവരുടെ ഭയത്തെ’ appropriately retains the source phrase’s ambiguity, with alternatives supplied in the footnote.
