source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: ml
  text: എന്നാൽ നീതിനിമിത്തം നിങ്ങൾ കഷ്ടം സഹിക്കേണ്ടിവന്നാലും നിങ്ങൾ അനുഗൃഹീതരാണ്. അവരുടെ ഭയത്തെ[a] ഭയപ്പെടരുത്; പരിഭ്രമിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരെക്കുറിച്ചുള്ള ഭയത്തെ’ എന്നോ ‘അവർ ഭയപ്പെടുന്നതിനെ’ എന്നോ അർഥമാകാം. ഗ്രീക്ക് പ്രയോഗം യെശയ്യാവ് 8:12-ലെ ഭാഷയോട് അടുത്ത് ചേരുന്നതും അതിലെ ദ്വയാർഥത നിലനിർത്തുന്നതുമായതിനാൽ മുഖ്യപാഠത്തിൽ ‘അവരുടെ ഭയത്തെ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ πάσχοιτε
  choice: എന്നാൽ ... കഷ്ടം സഹിക്കേണ്ടിവന്നാലും
  rationale: വിട്ടുവീഴ്ചാസൂചകമായ നിബന്ധനയും optative സൂചിപ്പിക്കുന്ന യഥാർഥമായ സാധ്യതയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: διὰ δικαιοσύνην
  choice: നീതിനിമിത്തം
  rationale: διά + accusative എന്ന കാരണാർഥം പ്രകടമാക്കുകയും δικαιοσύνηയുടെ ധാർമിക-ദൈവശാസ്ത്രപരമായ വ്യാപ്തി ‘നീതി’ എന്ന പദത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μακάριοι
  choice: നിങ്ങൾ അനുഗൃഹീതരാണ്
  rationale: അഭിസംബോധിതരായ വായനക്കാരെ ഉദ്ദേശിക്കുന്ന വിധേയവിശേഷണത്തെ മലയാളത്തിൽ പൂർണവാക്യമായി നൽകുന്നു; വെറും വികാരപരമായ സന്തോഷത്തേക്കാൾ ദൈവാനുകൂല്യത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: τὸν ... φόβον αὐτῶν
  choice: അവരുടെ ഭയത്തെ
  rationale: യെശയ്യാവ് 8:12-നോടുള്ള പദപ്രതിധ്വനിയും ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ ദ്വയാർഥതയും മുഖ്യപാഠത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: μὴ φοβηθῆτε
  choice: ഭയപ്പെടരുത്
  rationale: നിഷേധാത്മക കല്പന സ്വാഭാവികമായി നൽകുകയും φόβος/φοβέομαι എന്ന പദാവർത്തനം മലയാളത്തിലും നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μηδὲ ταραχθῆτε
  choice: പരിഭ്രമിക്കുകയും അരുത്
  rationale: ταράσσω സൂചിപ്പിക്കുന്ന ഉള്ളിലെ അസ്വസ്ഥതയും കലക്കവും അതിവ്യാഖ്യാനമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നീതി
  alternative: നീതിയായതു ചെയ്യുന്നത്; ന്യായം
  rationale: ഇവിടെ ദൈവസന്നിധിയിലും മനുഷ്യരുടെ മുമ്പിലും നേരായ ജീവിതം നയിക്കുന്നതിനാൽ അനുഭവിക്കുന്ന കഷ്ടമാണ് സന്ദർഭം. ‘നീതി’ ധാർമികവും ദൈവശാസ്ത്രപരവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; മറ്റുള്ളവ അർഥം ചുരുക്കുകയോ വ്യാഖ്യാനം ചേർക്കുകയോ ചെയ്യും.
- issue: τὸν φόβον αὐτῶν എന്നതിലെ ദ്വയാർഥത
  choice: അവരുടെ ഭയം
  alternative: അവരെക്കുറിച്ചുള്ള ഭയം; അവർ ഭയപ്പെടുന്നതു
  rationale: ഗ്രീക്ക് പ്രയോഗം അവർ ഉളവാക്കുന്ന ഭയത്തെയോ അവർതന്നെ ഭയപ്പെടുന്ന കാര്യത്തെയോ സൂചിപ്പിക്കാം. യെശയ്യാവ് 8:12-ലെ പ്രതിധ്വനി മാനിച്ച് മുഖ്യപാഠത്തിൽ ദ്വയാർഥത നിലനിർത്തുന്നു; സാധ്യതകൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭയം/ഭയപ്പെടുക’ എന്ന മൂലപദാവർത്തനവും യെശയ്യാവുമായുള്ള അന്തർപാഠബന്ധവും ഉദ്ദേശ്യപൂർവം സംരക്ഷിച്ചിട്ടുണ്ട്.
