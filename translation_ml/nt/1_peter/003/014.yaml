  terminology: ‘നീതിനിമിത്തം’ is an acceptable formal rendering of διὰ δικαιοσύνην in this context, and ‘അനുഗൃഹീതരാണ്’ adequately conveys μακάριοι as divine favor rather than mere happiness. The fear-word repetition is properly retained.
