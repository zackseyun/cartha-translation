id: 1PE.3.1
reference: 1 Peter 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: ml
  text: അതുപോലെ, ഭാര്യമാരേ, നിങ്ങളുടെ സ്വന്തം ഭർത്താക്കന്മാർക്കു വിധേയരായിരിക്കുക; അങ്ങനെ, അവരിൽ ചിലർ വചനത്തെ അനുസരിക്കാത്തവരാണെങ്കിലും, അവരുടെ ഭാര്യമാരുടെ പെരുമാറ്റത്തിലൂടെ, ഒരു വാക്കും കൂടാതെ, അവർ നേടിയെടുക്കപ്പെടേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμοίως
  choice: അതുപോലെ
  rationale: മുൻപുള്ള ഗാർഹിക ഉപദേശങ്ങളുമായുള്ള ആശയബന്ധം സ്വാഭാവികമായും ഔപചാരികമായും നിലനിർത്തുന്നു.
- source_word: γυναῖκες
  choice: ഭാര്യമാരേ
  rationale: ‘സ്വന്തം ഭർത്താക്കന്മാർ’ എന്ന തുടർന്നുള്ള പ്രയോഗം കാരണം ഇവിടെ പൊതുവായ ‘സ്ത്രീകൾ’ എന്നതല്ല, വൈവാഹികബന്ധത്തിലെ ‘ഭാര്യമാർ’ എന്ന അർഥമാണ്.
- source_word: ὑποτασσόμεναι
  choice: കീഴടങ്ങിയിരിക്കുക
  rationale: ബന്ധക്രമത്തിലുള്ള വിധേയത്വം പ്രകടിപ്പിക്കുന്നു; ‘അനുസരിക്കുക’ എന്ന ശക്തമായ പദം ചേർത്ത് സമ്പൂർണ അനുസരണം എന്ന ആശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: നിങ്ങളുടെ സ്വന്തം ഭർത്താക്കന്മാർക്ക്
  rationale: ഗാർഹിക പശ്ചാത്തലത്തിൽ ἀνήρ എന്നതിന് ‘ഭർത്താവ്’ എന്നാണ് അർഥം; ἰδίοις നൽകുന്ന ‘സ്വന്തം’ എന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ἵνα καὶ εἴ τινες
  choice: അങ്ങനെ, അവരിൽ ചിലർ … ആണെങ്കിൽപോലും
  rationale: ἵναയുടെ ഉദ്ദേശ്യ/ഫലസൂചനയും καὶ εἴയുടെ concessive ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: വചനത്തെ അനുസരിക്കാത്തവരാണെങ്കിൽ
  rationale: ἀπειθέωയിൽ അടങ്ങിയിരിക്കുന്ന അവിശ്വാസത്തിന്റെയും അനുസരണക്കേടിന്റെയും ആശയസംഘർഷം പൂർണമായി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു; സന്ദേശം നിരസിക്കുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: അവരുടെ ഭാര്യമാരുടെ പെരുമാറ്റത്തിലൂടെ
  rationale: ἀναστροφή എന്നത് ജീവിതരീതി/പെരുമാറ്റം എന്നാണ്; ഇവിടെ വൈവാഹികബന്ധം വ്യക്തമാക്കാൻ γυναῖκες ‘ഭാര്യമാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἄνευ λόγου
  choice: ഒരു വാക്കും കൂടാതെ
  rationale: മുൻപത്തെ ‘വചനം’ എന്ന പ്രയോഗത്തോടുള്ള λόγος-ന്റെ ആലങ്കാരിക പ്രതിധ്വനി കഴിയുന്നത്ര നിലനിർത്തുകയും ഭാര്യയുടെ വാക്കുകളില്ലാതെ എന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: κερδηθήσονται
  choice: അവർ നേടപ്പെടാം
  rationale: κερδαίνωയുടെ ‘നേടുക/സ്വായത്തമാക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; മൂലത്തിലെ കർമണിപ്രയോഗവും ἵναയോടു ബന്ധപ്പെട്ട പ്രതീക്ഷിത ഫലവും പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ὑποτασσόμεναι എന്ന ഗാർഹിക നിർദേശത്തിന്റെ സ്വഭാവം
  choice: ‘കീഴടങ്ങിയിരിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി; സമ്പൂർണ അനുസരണമോ അധമത്വമോ ചേർത്തിട്ടില്ല.
  alternative: ‘അനുസരിച്ചിരിക്കുക’ അല്ലെങ്കിൽ ‘വിധേയരായിരിക്കുക’
  rationale: മൂലപദം ബന്ധക്രമത്തിലുള്ള കീഴടങ്ങൽ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഇവിടെ ‘അനുസരിക്കുക’ എന്ന ശക്തമായ ക്രിയ ഉപയോഗിക്കുന്നില്ല; അതിനാൽ വാക്യം പറയുന്നതിലപ്പുറമുള്ള സിദ്ധാന്തപരമായ അവകാശവാദങ്ങൾ ചേർക്കുന്നില്ല.
- issue: ἀπειθοῦσιν τῷ λόγῳ എന്നതിലെ വിശ്വാസം–അനുസരണം ബന്ധം
  choice: ‘വചനത്തെ അനുസരിക്കാത്തവർ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി, സുവിശേഷസന്ദേശം നിരസിക്കുന്ന അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘സന്ദേശത്തിൽ വിശ്വസിക്കാത്തവർ’ അല്ലെങ്കിൽ ‘സുവിശേഷം അനുസരിക്കാൻ വിസമ്മതിക്കുന്നവർ’
  rationale: ἀπειθέω എന്ന പദത്തിന് അവിശ്വാസവും അനുസരണക്കേടും സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഈ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് സന്ദർഭപരമായ സുവിശേഷസൂചന വ്യക്തമാക്കുന്നു.
- issue: κερδηθήσονται എന്നതിന്റെ ലക്ഷ്യം
  choice: ‘അവർ നേടപ്പെടാം’ എന്ന രൂപകം നിലനിർത്തി; ആരാൽ അല്ലെങ്കിൽ കൃത്യമായി എന്തിലേക്കാണ് നേടപ്പെടുന്നത് എന്ന് കൂട്ടിച്ചേർത്തില്ല.
  alternative: ‘അവർ വിശ്വാസത്തിലേക്കു കൊണ്ടുവരപ്പെടാം’ അല്ലെങ്കിൽ ‘അവരെ നേടിയെടുക്കാം’
  rationale: സന്ദർഭം സുവിശേഷപരമായ ഫലം സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലവാക്യം ലക്ഷ്യപൂരകം തുറന്നുവെക്കുന്നു. അതിനാൽ പരിഭാഷ അത് സിദ്ധാന്തപരമായി വിശദീകരിച്ച് തീർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കീഴടങ്ങിയിരിക്കുക’ ബന്ധക്രമം വ്യക്തമാക്കുന്നു; ‘ഒരു വാക്കും കൂടാതെ’ എന്നത് വചന/വാക്ക് പ്രതിധ്വനി ഭാഗികമായി സംരക്ഷിക്കുന്നു. വാക്യത്തിന്റെ ദൈർഘ്യം നിയന്ത്രിക്കാൻ ആദ്യ നിർദേശം വേർതിരിച്ചെങ്കിലും ആശയബന്ധം ‘അങ്ങനെ’ വഴി നിലനിർത്തിയിരിക്കുന്നു.
