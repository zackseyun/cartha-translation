source:
  edition: SBLGNT
  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: ml
  text: എന്നാൽ അവൻ തിന്മയിൽനിന്ന് പിന്തിരിയട്ടെ; നന്മ ചെയ്യട്ടെ; സമാധാനം അന്വേഷിക്കട്ടെ; അതിനെ പിന്തുടരട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരാൾ തിന്മയിൽനിന്ന് പിന്തിരിയട്ടെ; നന്മ ചെയ്യട്ടെ; സമാധാനം അന്വേഷിക്കട്ടെ; അതിനെ പിന്തുടരട്ടെ.’ ഗ്രീക്കിൽ മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അവ ഇവിടെ പൊതുവായ, പ്രതിനിധിപരമായ അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: പിന്തിരിയട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചനത്തിലെ ആജ്ഞാരൂപവും തിന്മയിൽനിന്ന് ദിശമാറുന്ന ആശയവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യവും തുടർച്ചയും സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ κακοῦ
  choice: തിന്മയിൽനിന്ന്
  rationale: ἀγαθόν എന്ന നൈതിക പ്രതിപദത്തോട് യോജിച്ച് κακόν ഇവിടെ ദോഷാനുഭവമല്ല, നൈതിക തിന്മയാണ്.
- source_word: ποιησάτω ἀγαθόν
  choice: നന്മ ചെയ്യട്ടെ
  rationale: സജീവമായ നൈതിക പ്രവൃത്തിയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ζητησάτω
  choice: അന്വേഷിച്ച്
  rationale: സമാധാനം കണ്ടെത്താൻ ലക്ഷ്യബോധത്തോടെ തേടുക എന്ന അർഥം നൽകുകയും തുടർന്ന് വരുന്ന διωξάτω എന്ന ശക്തമായ ക്രിയയുമായുള്ള പുരോഗതി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: εἰρήνην
  choice: സമാധാനം
  rationale: വ്യക്തിബന്ധപരവും വിശാലമായ ബൈബിൾപരവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്ന പതിവ് മലയാള പദം.
- source_word: διωξάτω αὐτήν
  choice: അതിനെ പിന്തുടരട്ടെ
  rationale: സമാധാനം വെറും തേടുക മാത്രമല്ല, ഉത്സാഹപൂർവം അതിന്റെ പിന്നാലെ ചെല്ലുക എന്ന ശക്തമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: 3rd person singular imperatives across the verse
  choice: അവൻ ... ചെയ്യട്ടെ / പിന്തുടരട്ടെ
  rationale: ഗ്രീക്കിലെ മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപവും സങ്കീർത്തന ഉദ്ധരണിയുടെ താളവും പരമാവധി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആജ്ഞാരൂപത്തിലെ പ്രതിനിധിപരമായ പുല്ലിംഗ ഏകവചനം
  choice: മുഖ്യപാഠത്തിൽ ‘അവൻ’ എന്ന ഏകവചനരൂപം ഉപയോഗിക്കുക
  alternative: ‘ഒരാൾ’ എന്ന ലിംഗനിരപേക്ഷ രൂപം ഉപയോഗിക്കുക
  rationale: ഗ്രീക്കിലെ രൂപം വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും അർഥത്തിൽ പൊതുവായി ആരെയും പ്രതിനിധീകരിക്കുന്നു. ഉറവിടരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അതിന്റെ പൊതുവായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രബോധനശൈലി. ആവർത്തിക്കുന്ന മൂന്നാംപുരുഷ ആജ്ഞാരൂപങ്ങളും ‘അന്വേഷിക്കുക—പിന്തുടരുക’ എന്ന ക്രിയാപുരോഗതിയും നിലനിർത്തിയിരിക്കുന്നു.
