id: 1PE.3.13
reference: 1 Peter 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τίς ὁ κακώσων ὑμᾶς ἐὰν τοῦ ἀγαθοῦ ⸀ζηλωταὶ γένησθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/013.yaml
  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: ml
  text: നിങ്ങൾ നന്മയോട് അത്യുത്സാഹമുള്ളവരായിത്തീർന്നാൽ, നിങ്ങളെ ദോഷം ചെയ്യാൻ ആരുണ്ട്?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നന്മയോട് ഉത്സുകരായിത്തീർന്നാൽ.’
    reason: ζηλωταί എന്ന പദത്തിന് ‘അത്യുത്സാഹമുള്ളവർ’ എന്നതിനുപുറമേ ‘ഉത്സുകർ’ എന്നും നൽകാവുന്ന അർഥഭേദം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: Καὶ
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള തുടർച്ച മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ, ‘καί’ വേറിട്ട് ‘കൂടാതെ’ എന്നു ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമാകും.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: നിങ്ങളെ ദോഷം ചെയ്യാൻ ആരുണ്ട്?
  rationale: ഭാവികാലസൂചനയുള്ള substantival participle-ന്റെ വാചാടോപചോദ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇത് ഉപദ്രവമോ പരിക്കോ ഉൾക്കൊള്ളാവുന്ന വിശാലമായ പ്രയോഗമാണ്.
- source_word: ἐὰν
  choice: -ആൽ
  rationale: subjunctive ഉള്ള നിബന്ധനാവാക്യം മലയാളത്തിലെ സ്വാഭാവിക നിബന്ധനാപ്രത്യയത്തിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῦ ἀγαθοῦ
  choice: നന്മയ്ക്കായി
  rationale: നപുംസകലിംഗ വിശേഷണത്തിന്റെ ആശയപരമായ അർഥം ‘നന്മ’ എന്നു സ്വാഭാവികമായി നൽകുകയും ζηλωταί ആവശ്യപ്പെടുന്ന ലക്ഷ്യബന്ധം ‘-ക്കായി’ കൊണ്ട് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ζηλωταὶ
  choice: തീക്ഷ്ണതയുള്ളവർ
  rationale: ζηλωτής സൂചിപ്പിക്കുന്ന ശക്തമായ ഉത്സാഹവും പ്രതിബദ്ധതയും നിലനിർത്തുന്നു; ‘ഉത്സുകർ’ എന്ന കൂടുതൽ സാധാരണമായ പദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: γένησθε
  choice: ആയിത്തീർന്നാൽ
  rationale: γίνομαι എന്ന ക്രിയയുടെ ‘become’ എന്ന മാറ്റത്തിലേക്കുള്ള സൂചന നിലനിർത്തുകയും ἐὰν-നോടുള്ള നിബന്ധനാബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നീതിക്കുവേണ്ടിയുള്ള കഷ്ടതയുടെ പശ്ചാത്തലത്തിൽ വാചാടോപചോദ്യത്തിന്റെ ശക്തി
  choice: ‘നിങ്ങളെ ദോഷം ചെയ്യാൻ ആരുണ്ട്?’ എന്ന പൊതുവായ വാചാടോപപരമായ ഉറപ്പ്
  alternative: വിശ്വാസികൾക്ക് യാതൊരു ദോഷവും ഒരിക്കലും സംഭവിക്കില്ലെന്ന കേവല വാഗ്ദാനം
  rationale: തുടർന്നുള്ള വാക്യങ്ങൾ നന്മ ചെയ്യുന്നതിനാൽ കഷ്ടം അനുഭവിക്കാനുള്ള സാധ്യത അംഗീകരിക്കുന്നു. അതിനാൽ വാചാടോപചോദ്യം അതേപടി നിലനിർത്തുന്നു; കഷ്ടതയിൽനിന്നുള്ള പൂർണ സംരക്ഷണമെന്ന വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്നതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാചാടോപചോദ്യവും ‘ആയിത്തീരുക’ എന്ന മാറ്റസൂചനയും സംരക്ഷിച്ചിരിക്കുന്നു.
