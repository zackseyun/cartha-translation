id: 1PE.3.18
reference: 1 Peter 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: ml
  text: എന്തെന്നാൽ, മശീഹയും പാപങ്ങൾക്കുവേണ്ടി ഒരിക്കൽ കഷ്ടം അനുഭവിച്ചു[a]—നീതിമാൻ അനീതിമാന്മാർക്കുവേണ്ടി—നിങ്ങളെ ദൈവത്തിന്റെ അടുക്കലേക്കു കൊണ്ടുവരേണ്ടതിന്; ജഡത്തിൽ മരണത്തിനേൽപ്പിക്കപ്പെട്ടെങ്കിലും ആത്മാവിൽ ജീവിപ്പിക്കപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘കഷ്ടം അനുഭവിച്ചു’ എന്നതിനുപകരം ‘മരിച്ചു’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അല്ലെങ്കിൽ, ‘പരിശുദ്ധാത്മാവിനാൽ ജീവിപ്പിക്കപ്പെട്ടു.’ ഗ്രീക്കുപദം ആത്മാവിന്റെ മണ്ഡലം/വശം എന്നതിനെയോ പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: Χριστός എന്ന പദത്തിന്റെ അഭിഷിക്തൻ/മശീഹ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം നിലനിർത്തുന്നു; കേവലം പേരുപോലെ മാറ്റുന്നില്ല.
- source_word: ἅπαξ
  choice: ഒരിക്കൽ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; മൂലത്തിൽ പ്രത്യേകം പറഞ്ഞിട്ടില്ലാത്ത ‘എന്നേക്കുമായി’ എന്ന ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: περὶ ἁμαρτιῶν
  choice: പാപങ്ങൾക്കുവേണ്ടി
  rationale: ഈ പ്രായശ്ചിത്തപരമായ സന്ദർഭത്തിൽ περί + genitive എന്നതിന്റെ സ്വാഭാവികമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἔπαθεν
  choice: കഷ്ടം അനുഭവിച്ചു
  rationale: SBLGNT-യിലെ സാക്ഷ്യപ്പെടുത്തിയ പാഠമായ ‘സഹിച്ചു/കഷ്ടം അനുഭവിച്ചു’ എന്ന അർഥം പിന്തുടരുന്നു; ‘മരിച്ചു’ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: നീതിമാൻ നീതികെട്ടവർക്കുവേണ്ടി
  rationale: പ്രതിനിധിത്വപരവും പകരമായുള്ളതുമായ ഗുണഭോക്തൃബന്ധം സൂക്ഷിക്കുന്നു; ഒരു സമ്പൂർണ പ്രായശ്ചിത്തസിദ്ധാന്തം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- source_word: προσαγάγῃ
  choice: അടുക്കൽ കൊണ്ടുവരേണ്ടതിന്
  rationale: ദൈവസന്നിധിയിലേക്കു കൊണ്ടുവരുക/പ്രവേശനം നൽകുക എന്ന ബന്ധപരമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: θανατωθεὶς
  choice: മരണത്തിന് ഏൽപ്പിക്കപ്പെട്ടെങ്കിലും
  rationale: passive ഭാവം സൂക്ഷിക്കുകയും μὲν...δὲ വിരോധബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: σαρκὶ
  choice: ജഡത്തിൽ
  rationale: πνεύματι-യോടുള്ള സമാന്തരതയും ദേഹധാരിയായ മർത്യജീവിതത്തിന്റെ മണ്ഡലം/വശം എന്ന ആശയവും സൂക്ഷിക്കുന്നു; ‘പാപസ്വഭാവം’ എന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ζῳοποιηθεὶς
  choice: ജീവിപ്പിക്കപ്പെട്ടു
  rationale: passive രൂപവും ‘ജീവൻ ലഭിച്ചു/ജീവനുള്ളവനാക്കി’ എന്ന അടിസ്ഥാന അർഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: πνεύματι
  choice: ആത്മാവിൽ
  rationale: മണ്ഡലം/വശം എന്ന വായന പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനമെന്ന agentive വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ജഡം/ആത്മാവ് എന്ന അവസാന വിരോധത്തിന്റെ അർഥം
  choice: ‘ജഡത്തിൽ ... ആത്മാവിൽ’ എന്ന സമാന്തര പ്രയോഗം
  alternative: ‘ശരീരത്തിൽ ... പരിശുദ്ധാത്മാവിനാൽ’
  rationale: രണ്ട് dative രൂപങ്ങളും മണ്ഡലം/വശം അല്ലെങ്കിൽ പ്രവർത്തനകാരണം എന്നിങ്ങനെ വായിക്കാവുന്നതാണ്. പ്രധാനപാഠം ഈ സന്ദിഗ്ധത തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു; agentive വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘നീതിമാൻ നീതികെട്ടവർക്കുവേണ്ടി’ എന്നതിലെ പകരംനിൽക്കൽ
  choice: ചുരുക്കമുള്ള മൂലവാക്യഘടന നിലനിർത്തി
  alternative: ‘കുറ്റമില്ലാത്തവൻ കുറ്റക്കാരുടെ സ്ഥാനത്ത്’ എന്ന വ്യാഖ്യാനപരമായ വികസനം
  rationale: ὑπέρ മറ്റുള്ളവർക്കുവേണ്ടിയുള്ള കഷ്ടാനുഭവം വ്യക്തമാക്കുന്നു; എന്നാൽ ഒരു പ്രത്യേക പ്രായശ്ചിത്തമാതൃക പരിഭാഷയിൽ അധികമായി ചേർക്കാതിരിക്കാൻ മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മശീഹ’, ‘ജഡം’, ‘ആത്മാവ്’ എന്നീ പദങ്ങൾ മൂലത്തിലെ സ്ഥാനപ്പേരും സമാന്തരതയും ദൈവശാസ്ത്രപരമായ സന്ദിഗ്ധതയും നിലനിർത്താൻ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
