  source_fidelity: 'മുഖ്യാർത്ഥം വിശ്വസ്തമാണ്: ἔπαθεν ‘കഷ്ടം അനുഭവിച്ചു’ എന്നും, ἅπαξ ‘ഒരിക്കൽ’ എന്നും, δίκαιος ὑπὲρ ἀδίκων എന്ന പ്രതിനിധിപരമായ വിരോധവും ശരിയായി നൽകിയിട്ടുണ്ട്. അവസാനത്തെ ജഡം/ആത്മാവ് ദ്വന്ദ്വത്തിലെ സന്ദിഗ്ധതയും പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു. എന്നാൽ θανατωθείς-ന് ‘മരണത്തിന് ഏൽപ്പിക്കപ്പെട്ട’ എന്നത് സാധ്യമെങ്കിലും ‘put to death’ എന്ന നേരിട്ടുള്ള അർഥത്തെ അല്പം മൃദുവാക്കുന്നു.'
  naturalness: ‘ദൈവത്തിന്റെ അടുക്കലേക്കു’ എന്ന രൂപവും ‘അനീതിമാന്മാർക്കുവേണ്ടി’ എന്ന രൂപവും ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. അവസാനവാക്യം നിലവിലുള്ളതുപോലെ സ്വതന്ത്രവാക്യമായിരിക്കാം; എങ്കിലും മുഖ്യവാക്യത്തോടുള്ള participial ബന്ധം നിലനിർത്തുന്ന രീതിയിൽ പുനഃക്രമീകരിക്കുന്നത് ഉചിതമാണ്.
  terminology: ‘മശീഹ,’ ‘ജഡം,’ ‘ആത്മാവ്’ എന്നിവ അനുയോജ്യമാണ്. ‘ആത്മാവ്’ എന്നത് ചെറിയ അക്ഷരത്തിൽ വെച്ച് ഗ്രീക്കിലെ πνεύματι-യുടെ വ്യാഖ്യാനസന്ദിഗ്ധത കാത്തിരിക്കുന്നു. പാഠഭേദക്കുറിപ്പ് ശരിയാണ്.
