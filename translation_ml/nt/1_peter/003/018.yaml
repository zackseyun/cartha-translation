  to: എന്തെന്നാൽ, മശീഹയും പാപങ്ങൾക്കുവേണ്ടി ഒരിക്കൽ കഷ്ടം അനുഭവിച്ചു[a]—നീതിമാൻ അനീതിമാന്മാർക്കുവേണ്ടി—നിങ്ങളെ ദൈവത്തിന്റെ അടുക്കലേക്കു കൊണ്ടുവരേണ്ടതിന്; ജഡത്തിൽ മരണത്തിനേൽപ്പിക്കപ്പെട്ടെങ്കിലും ആത്മാവിൽ ജീവിപ്പിക്കപ്പെട്ടു[b].
