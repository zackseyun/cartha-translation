source:
  edition: SBLGNT
  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: ml
  text: ഇങ്ങനെയാണല്ലോ പണ്ടുകാലത്ത് ദൈവത്തിൽ പ്രത്യാശ വെച്ചിരുന്ന[a] വിശുദ്ധ സ്ത്രീകളും സ്വന്തം ഭർത്താക്കന്മാർക്കു വിധേയരായിക്കൊണ്ട് തങ്ങളെത്തന്നെ അലങ്കരിച്ചിരുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിൽ പ്രത്യാശ സ്ഥാപിച്ചിരുന്ന.’
    reason: ἐλπίζουσαι εἰς θεόν എന്ന പ്രയോഗത്തിൽ പ്രത്യാശ ദൈവത്തിൽ ഉദ്ദേശപൂർവം സ്ഥാപിക്കുന്നതിനെ ഊന്നുന്ന സാധ്യമായ പരിഭാഷ.
lexical_decisions:
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച അലങ്കാരരീതിയിലേക്കു വിരൽചൂണ്ടുന്ന ക്രിയാവിശേഷണത്തിന്റെ നിർദേശകശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: ആണല്ലോ
  rationale: മുൻപത്തെ പ്രസ്താവനയ്ക്ക് വിശദീകരണവും അടിസ്ഥാനവും നൽകുന്ന ബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ വിശദീകരണഭാവത്തോടെ പ്രകടമാക്കുന്നു.
- source_word: ποτε
  choice: പണ്ടുകാലത്ത്
  rationale: മുൻതലമുറകളിലെ സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന കാലാർഥം വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἅγιαι γυναῖκες
  choice: വിശുദ്ധസ്ത്രീകൾ
  rationale: ἅγιαι എന്ന വിശേഷണത്തിന്റെ മതപരവും നൈതികവുമായ ശക്തി ക്ഷയിപ്പിക്കാതെ, മലയാളത്തിലെ പതിവായ ബൈബിൾപദം ഉപയോഗിക്കുന്നു.
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: ദൈവത്തിൽ പ്രത്യാശവെച്ചിരുന്ന
  rationale: ഈ സ്ത്രീകളെ സവിശേഷിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപം സന്ദർഭാനുസൃതമായ മലയാള കാലരൂപത്തിൽ നൽകുകയും അവരുടെ പ്രത്യാശയുടെ ലക്ഷ്യം ദൈവമാണെന്ന് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐκόσμουν ἑαυτάς
  choice: തങ്ങളെത്തന്നെ അലങ്കരിച്ചത്
  rationale: മുൻസന്ദർഭത്തിലെ അലങ്കാരവും സൗന്ദര്യവും സംബന്ധിച്ച ആശയബന്ധം സംരക്ഷിക്കുകയും പ്രതിഫലക സർവനാമം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὑποτασσόμεναι
  choice: കീഴടങ്ങിക്കൊണ്ട്
  rationale: അവർ തങ്ങളെത്തന്നെ എങ്ങനെ അലങ്കരിച്ചുവെന്ന് വിശദീകരിക്കുന്ന കൃദന്തരൂപത്തിന്റെ രീതിബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: സ്വന്തം ഭർത്താക്കന്മാർക്ക്
  rationale: ഗാർഹികസന്ദർഭത്തിൽ ἀνήρ എന്നതിന് ‘ഭർത്താവ്’ എന്ന അർഥം വ്യക്തമാണ്; ἰδίοις എന്ന പദം നിലനിർത്തുന്നത് പ്രസ്താവനയെ വിവാഹബന്ധത്തിനുള്ളിൽ പരിമിതപ്പെടുത്തുന്നു.
theological_decisions:
- issue: വിവാഹബന്ധത്തിലെ കീഴടങ്ങൽ വിവരിക്കുന്ന കൃദന്തരൂപത്തിന്റെ പരിഭാഷ
  choice: സ്വന്തം ഭർത്താക്കന്മാർക്ക് കീഴടങ്ങിക്കൊണ്ട്
  alternative: സ്വന്തം ഭർത്താക്കന്മാർക്ക് വിധേയരായിക്കൊണ്ട്
  rationale: ഗ്രീക്കിലെ പ്രവർത്തനാത്മകമായ കൃദന്തരൂപവും ‘സ്വന്തം’ എന്ന ബന്ധപരിധിയും സംരക്ഷിക്കുന്നു. ഇത് എല്ലാ സ്ത്രീകളും എല്ലാ പുരുഷന്മാർക്കും കീഴടങ്ങണമെന്ന വിശാലമായ ഉപദേശമായി വാക്യത്തെ വികസിപ്പിക്കാതെ വിവാഹബന്ധത്തെ മാത്രം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ വിശദീകരണബന്ധം, ചരിത്രപരമായ സൂചന, കൃദന്തരൂപത്തിന്റെ രീതിബന്ധം, വിവാഹബന്ധത്തിന്റെ പരിധി എന്നിവ നിലനിർത്തി. വായനാസൗകര്യത്തിനും അവസാന കൃദന്തരൂപത്തിന്റെ വിശദീകരണസ്വഭാവം വ്യക്തമാക്കുന്നതിനുമായി ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
