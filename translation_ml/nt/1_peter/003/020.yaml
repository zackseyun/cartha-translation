id: 1PE.3.20
reference: 1 Peter 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: ml
  text: പണ്ട് അനുസരിക്കാതിരുന്നവർ; നോഹയുടെ നാളുകളിൽ പെട്ടകം ഒരുക്കപ്പെട്ടുകൊണ്ടിരിക്കുമ്പോൾ ദൈവത്തിന്റെ ദീർഘക്ഷമ കാത്തിരുന്ന സമയത്താണ് അവർ അനുസരിക്കാതിരുന്നത്. ആ പെട്ടകത്തിലേക്ക് ചുരുക്കംപേർ—അതായത് എട്ടുപേർ[a]—വെള്ളത്തിലൂടെ സുരക്ഷിതമായി രക്ഷപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “എട്ട് ആത്മാക്കൾ.”
    reason: lexical_alternative
  - marker: b
    text: “വെള്ളത്തിലൂടെ സുരക്ഷിതമായി കടത്തിക്കൊണ്ടുപോകപ്പെട്ടു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν
  choice: അനുസരിക്കാതിരുന്നവർ
  rationale: ഈ പദം വെറും ബൗദ്ധികമായ അവിശ്വാസത്തെക്കാൾ അനുസരിക്കാൻ വിസമ്മതിച്ചതിനെയോ അനുസരണക്കേടിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ποτε
  choice: പണ്ട്
  rationale: മുഖ്യവിവരണത്തോടു താരതമ്യത്തിൽ മുൻകാലത്തെ സ്വാഭാവികവും ലളിതവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀπεξεδέχετο
  choice: കാത്തിരുന്നപ്പോൾ
  rationale: അപൂർണഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്ന കാത്തിരിപ്പിനെ സൂചിപ്പിക്കുന്നു; ദീർഘക്ഷമ എന്ന പദം ക്ഷമയുടെ ആശയം ഇതിനകം നൽകുന്നു.
- source_word: μακροθυμία
  choice: ദീർഘക്ഷമയോടെ
  rationale: ന്യായവിധി ഉടൻ നടപ്പാക്കാതെ ദൈവം ക്ഷമാപൂർവം കാത്തിരുന്നതിനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു. ഗ്രീക്കിൽ ‘ദൈവത്തിന്റെ ദീർഘക്ഷമ കാത്തിരുന്നു’ എന്നാണ് വ്യാകരണഘടന; സ്വാഭാവിക മലയാളത്തിനായി ദൈവത്തെ കർത്താവാക്കി അതേ ആശയം നൽകിയിരിക്കുന്നു.
- source_word: κατασκευαζομένης
  choice: ഒരുക്കപ്പെട്ടുകൊണ്ടിരിക്കെ
  rationale: പെട്ടകം നിർമിക്കുകയും സജ്ജമാക്കുകയും ചെയ്തുകൊണ്ടിരുന്ന തുടർച്ചയായ പ്രക്രിയയെ, ‘നിർമിക്കപ്പെട്ടു’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ, നിലനിർത്തുന്നു.
- source_word: κιβωτοῦ
  choice: പെട്ടകം
  rationale: നോഹയുടെ സന്ദർഭത്തിൽ സ്ഥാപിതവും കൃത്യവുമായ മലയാളപദമാണ്.
- source_word: εἰς ἣν
  choice: ആ പെട്ടകത്തിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ദിശ ‘അതിൽ’ എന്നു സ്ഥലമാത്രമായി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ὀλίγοι
  choice: ചുരുക്കംപേർ
  rationale: സുരക്ഷിതരായവരുടെ എണ്ണം വളരെ കുറവായിരുന്നു എന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ψυχαί
  choice: പേർ
  rationale: ഇവിടെ ψυχή മനുഷ്യരെ എണ്ണാൻ ഉപയോഗിച്ചിരിക്കുന്നു; ആത്മാവിനെക്കുറിച്ചുള്ള സാങ്കേതിക നരവംശശാസ്ത്രപരമായ അവകാശവാദം വരാതിരിക്കാൻ ‘പേർ’ ഉപയോഗിച്ചു. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: διεσώθησαν
  choice: സുരക്ഷിതരായി എത്തിക്കപ്പെട്ടു
  rationale: അപകടത്തിലൂടെ സുരക്ഷിതമായി കൊണ്ടുവരപ്പെടുക എന്ന διασῴζωയുടെ സന്ദർഭോചിതമായ ഭാവം നിലനിർത്തുന്നു; ‘രക്ഷിക്കപ്പെട്ടു’ എന്ന പ്രധാന വ്യത്യസ്ത പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: δι’ ὕδατος
  choice: വെള്ളത്തിലൂടെ
  rationale: διάയും ഷഷ്ഠീവിഭക്തിയും ഇവിടെ വെള്ളത്തിലൂടെയുള്ള കടന്നുപോകൽ എന്ന അർഥസാധ്യത നൽകുന്നു; അടുത്ത വാക്യത്തിലെ സ്നാനസാദൃശ്യത്തെ മുൻകൂട്ടി സിദ്ധാന്തപരമായി നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: διεσώθησαν എന്ന പദത്തിലെ രക്ഷാശാസ്ത്രപരമായി ഭാരം വഹിക്കാവുന്ന ഭാഷ
  choice: സുരക്ഷിതരായി എത്തിക്കപ്പെട്ടു
  alternative: രക്ഷിക്കപ്പെട്ടു
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ പ്രളയാപകടത്തിൽനിന്നുള്ള യാഥാർഥ്യമായ സംരക്ഷണത്തെ വിവരിക്കുന്നു. പ്രധാനപാഠം ആ ദൃശ്യാർഥം വ്യക്തമാക്കുന്നു; എന്നാൽ ക്രിയയുടെ സാധാരണ ‘രക്ഷിക്കപ്പെട്ടു’ എന്ന അർഥവും തുടർന്നുള്ള സ്നാനസാദൃശ്യവുമായി അതിനുള്ള പ്രാധാന്യവും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ψυχαί എന്ന പദത്തിന്റെ മനുഷ്യവ്യക്തികളെ സൂചിപ്പിക്കുന്ന പ്രയോഗം
  choice: പേർ
  alternative: ആത്മാക്കൾ
  rationale: വാക്യം പെട്ടകത്തിലുണ്ടായിരുന്ന മനുഷ്യരുടെ എണ്ണം പറയുന്നു; ആത്മാവും ശരീരവും സംബന്ധിച്ച സാങ്കേതിക വ്യത്യാസം പ്രസ്താവിക്കുന്നില്ല. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: ദൈവത്തിന്റെ ദീർഘക്ഷമയെ വ്യാകരണകർത്താവായി നിലനിർത്തണമോ എന്നത്
  choice: ദൈവം ദീർഘക്ഷമയോടെ കാത്തിരുന്നു
  alternative: ദൈവത്തിന്റെ ദീർഘക്ഷമ കാത്തിരുന്നു
  rationale: ഗ്രീക്കിലെ വ്യക്തിവൽക്കരിച്ച വ്യാകരണഘടനയുടെ അർഥം നഷ്ടപ്പെടുത്താതെ, സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന വിധം ദൈവത്തെ കർത്താവാക്കി. ന്യായവിധിയുടെ താമസം ദൈവത്തിന്റെ ദീർഘക്ഷമയാണെന്ന ആശയം പൂർണമായി നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന ഗ്രീക്ക് കൃതന്തത്തെ മലയാളത്തിൽ വ്യക്തമായ വാക്യമാക്കി; ഇതിലൂടെ സാധാരണ വായനക്കാർക്ക് വ്യക്തത ലഭിക്കുമ്പോഴും മുൻസന്ദർഭത്തിലെ സൂചിതബന്ധം നിലനിൽക്കുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവയുടെ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്ത സ്ഥാനങ്ങളിലായിരുന്നു; മലയാളത്തിൽ [a] ‘എട്ടുപേർ’ എന്നതിനും [b] ‘സുരക്ഷിതരായി എത്തിക്കപ്പെട്ടു’ എന്നതിനും ചേർത്ത് ഉള്ളടക്കാനുസൃതമായി സ്ഥാപിച്ചു.
