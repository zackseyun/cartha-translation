id: 1PE.3.10
reference: 1 Peter 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, ജീവനെ സ്നേഹിക്കാനും നല്ല നാളുകൾ കാണാനും ആഗ്രഹിക്കുന്നവൻ തിന്മയിൽനിന്ന് തന്റെ നാവിനെയും വഞ്ചന പറയുന്നതിൽനിന്ന് തന്റെ അധരങ്ങളെയും[a] തടഞ്ഞുനിർത്തട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കപടം പറയുന്നതിൽനിന്ന്.’ ഗ്രീക്ക് പദത്തിന് വഞ്ചന, ചതി, കപടം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: ആഗ്രഹിക്കുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഏതൊരു വ്യക്തിയെയും പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഏകവചന പൊതുപ്രയോഗം ഉറവിടത്തിന്റെ പ്രതിനിധാനസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രബോധനത്തിന് തിരുവെഴുത്തിൽനിന്നുള്ള വിശദീകരണമോ പിന്തുണയോ അവതരിപ്പിക്കുന്ന ബന്ധകമാണ്.
- source_word: ζωὴν ἀγαπᾶν
  choice: ജീവനെ സ്നേഹിക്കാനും
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള അനന്തക്രിയാപദപ്രയോഗം നിലനിർത്തുന്നു; ഉറവിടത്തിൽ ഇല്ലാത്ത ഉടമസ്ഥസൂചന ചേർക്കുന്നില്ല.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: നല്ല നാളുകൾ കാണാനും
  rationale: ἰδεῖν എന്ന ദൃശ്യരൂപകം അതേപടി സൂക്ഷിക്കുകയും അനുകൂലമായ നാളുകൾ അനുഭവിക്കുക എന്ന പ്രയോഗാർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: παυσάτω
  choice: പിന്തിരിപ്പിക്കട്ടെ
  rationale: ആജ്ഞാരൂപത്തിന്റെ ബലം നിലനിർത്തിക്കൊണ്ട് നാവിനെയും അധരങ്ങളെയും തിന്മയിൽനിന്നും വഞ്ചനാഭാഷണത്തിൽനിന്നും അകറ്റിനിർത്തുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: തന്റെ നാവിനെ തിന്മയിൽനിന്നും
  rationale: ശരീരഭാഗത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥസർവനാമം ചേർക്കുന്നു; κακόν എന്നതിന്റെ വിശാലമായ ധാർമ്മിക അർഥം ‘തിന്മ’ നിലനിർത്തുന്നു.
- source_word: χείλη
  choice: തന്റെ അധരങ്ങളെ
  rationale: ഉറവിടത്തിലെ ബഹുവചന ദൃശ്യരൂപം നിലനിർത്തുകയും മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: വഞ്ചന സംസാരിക്കുന്നതിൽനിന്നും
  rationale: നിയന്ത്രണം അല്ലെങ്കിൽ ഒഴിവാക്കൽ സൂചിപ്പിക്കുന്ന articular infinitive-ന്റെ പ്രവർത്തനം സ്വാഭാവികമായി നൽകുന്നു. δόλος എന്നത് സന്ദർഭത്തിൽ വഞ്ചനാപരമായ സംസാരം സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൊതുവായ ഏകവചനവും ലിംഗപ്രതിനിധാനവും
  choice: ‘ആഗ്രഹിക്കുന്നവൻ’ എന്ന ഏകവചന പൊതുപ്രയോഗവും ‘തന്റെ’ എന്ന സ്വാഭാവിക ഉടമസ്ഥരൂപവും ഉപയോഗിക്കുക.
  alternative: ‘ആഗ്രഹിക്കുന്നവർ ... അവരുടെ’ എന്ന ബഹുവചന പൊതുപ്രയോഗം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് വ്യാകരണപരമായി ഏകവചനവും പൊതുപ്രതിനിധാനപരവുമാണ്. മലയാളത്തിലെ ‘-വൻ’ രൂപം ഈ ഘടനയെ അടുത്തായി പിന്തുടരുന്നു; സന്ദർഭത്തിൽ അത് പുരുഷന്മാർക്ക് മാത്രമായി അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: παυσάτω എന്ന ആജ്ഞയുടെ ഭാവം
  choice: ‘പിന്തിരിപ്പിക്കട്ടെ’ എന്ന ആജ്ഞാരൂപം നിലനിർത്തുക.
  alternative: ‘അടക്കിവെക്കണം’ അല്ലെങ്കിൽ ‘ഒഴിവാക്കണം’ എന്ന നിർബന്ധപ്രയോഗം ഉപയോഗിക്കുക.
  rationale: ഉറവിടത്തിലെ മൂന്നാംപുരുഷ ആജ്ഞയുടെ രൂപവും സങ്കീർത്തന ഉദ്ധരണിയുടെ പ്രബോധനഭാവവും സംരക്ഷിക്കുന്നു; അതിനെ വെറും ഉപദേശമോ ഫലത്തിനുള്ള യാന്ത്രിക വ്യവസ്ഥയോ ആക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സങ്കീർത്തന ഉദ്ധരണിയുടെ കാവ്യാത്മക ദൃശ്യങ്ങൾ—ജീവനെ സ്നേഹിക്കുക, നല്ല നാളുകൾ കാണുക, നാവും അധരങ്ങളും—പരമാവധി നിലനിർത്തിയിരിക്കുന്നു.
