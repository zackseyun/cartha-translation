    rationale: Although understandable, it more readily means ‘cause [someone/something] to turn back.’ ‘തടഞ്ഞുനിർത്തട്ടെ’ naturally conveys the imperative παυσάτω in this ethical exhortation while retaining the source’s broad restraint imagery.
