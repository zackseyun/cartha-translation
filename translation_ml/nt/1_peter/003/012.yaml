id: 1PE.3.12
reference: 1 Peter 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: ml
  text: എന്തെന്നാൽ, കർത്താവിന്റെ കണ്ണുകൾ നീതിമാന്മാരുടെമേലാണ്; അവന്റെ ചെവികൾ അവരുടെ യാചനയിലേക്കു തുറന്നിരിക്കുന്നു[a]. എന്നാൽ, തിന്മ പ്രവർത്തിക്കുന്നവർക്കെതിരെയാണ് കർത്താവിന്റെ മുഖം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ ചെവികൾ അവരുടെ യാചനയിലേക്ക്’; വ്യക്തതയ്ക്കായി ‘തുറന്നിരിക്കുന്നു’ എന്നു ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള പ്രബോധനത്തിന് തിരുവെഴുത്തിൽനിന്നുള്ള കാരണം നൽകുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘കാരണം’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: ὀφθαλμοὶ κυρίου
  choice: കർത്താവിന്റെ കണ്ണുകൾ
  rationale: സങ്കീർത്തന ഉദ്ധരണിയിലെ മനുഷ്യരൂപകൽപ്പനയും സാഹിത്യചിത്രവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐπὶ δικαίους
  choice: നീതിമാന്മാരുടെമേൽ
  rationale: ἐπί സൂചിപ്പിക്കുന്ന ദിശയും ശ്രദ്ധയും നിലനിർത്തുന്നു; ബഹുവചന വിശേഷണം നാമവാചകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: അവന്റെ ചെവികൾ അവരുടെ യാചനയിലേക്കും ഇരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും സമാന്തരവുമായ ഘടന കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു. δέησις പൊതുവായ പ്രാർഥനയെക്കാൾ ആവശ്യം ഉന്നയിക്കുന്ന അപേക്ഷയെയോ യാചനയെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘യാചന’ തിരഞ്ഞെടുത്തു.
- source_word: πρόσωπον δὲ κυρίου
  choice: എന്നാൽ ... കർത്താവിന്റെ മുഖം
  rationale: δέയുടെ വിരുദ്ധബന്ധവും πρόσωπον എന്ന ശരീരരൂപകവും നിലനിർത്തുന്നു.
- source_word: ἐπὶ ποιοῦντας κακά
  choice: തിന്മ ചെയ്യുന്നവർക്കെതിരെയാണ്
  rationale: പ്രതികൂല സന്ദർഭത്തിൽ ἐπί ദൈവിക എതിർപ്പ് സൂചിപ്പിക്കുന്നു; വർത്തമാന കൃദന്തരൂപത്തിന്റെ ക്രിയാത്മകത ‘ചെയ്യുന്നവർ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ കണ്ണുകൾ, ചെവികൾ, മുഖം എന്നീ മനുഷ്യരൂപകൽപ്പനകൾ
  choice: രൂപകങ്ങൾ നേരിട്ട് നിലനിർത്തുക
  alternative: ‘കർത്താവ് നീതിമാന്മാരെ നോക്കിക്കാക്കുകയും അവരുടെ പ്രാർഥന കേൾക്കുകയും ചെയ്യുന്നു’ എന്ന വ്യാഖ്യാനപരമായ പരാവർത്തനം
  rationale: സങ്കീർത്തന പശ്ചാത്തലത്തിലെ ദൈവിക അനുകൂലതയും എതിർപ്പും ശരീരചിത്രങ്ങളിലൂടെ പ്രകടമാകുന്നു; അവയെ വ്യാഖ്യാനിച്ച് ലയിപ്പിക്കാതെ സാഹിത്യ-ദൈവശാസ്ത്ര ശക്തി സംരക്ഷിക്കുന്നു.
- issue: εἰς δέησιν എന്ന സംക്ഷിപ്ത പ്രയോഗം
  choice: ‘അവന്റെ ചെവികൾ അവരുടെ യാചനയിലേക്കും ഇരിക്കുന്നു’ എന്ന ദിശാസൂചക രൂപം
  alternative: ‘അവരുടെ യാചന കേൾക്കാൻ തുറന്നിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘അവരുടെ യാചന ശ്രദ്ധിക്കുന്നു’
  rationale: മൂലപാഠത്തിൽ ‘തുറന്നിരിക്കുന്നു’ എന്ന പദമില്ല. അർത്ഥം ഗ്രഹിക്കാവുന്ന മലയാളത്തിൽ ഗ്രീക്കിന്റെ ഉദ്ദേശപൂർവമായ സംക്ഷിപ്തതയും ദിശയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘കർത്താവ്’, ‘നീതിമാന്മാർ’, ‘യാചന’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ സമാന്തര മനുഷ്യരൂപകങ്ങൾ നിലനിർത്തി.
