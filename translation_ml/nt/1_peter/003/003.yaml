id: 1PE.3.3
reference: 1 Peter 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: ml
  text: നിങ്ങളുടെ അലങ്കാരം ബാഹ്യമായതാകരുത്—മുടി പിന്നുന്നതോ, സ്വർണാഭരണങ്ങൾ അണിയുന്നതോ, വസ്ത്രങ്ങൾ ധര Jenningsുന്നതോ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: നിങ്ങളുടെ
  rationale: മുൻവാക്യത്തിൽ അഭിസംബോധന ചെയ്ത സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന ബന്ധസർവനാമത്തിന്റെ ഉടമസ്ഥതാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ ‘നിങ്ങളുടെ’ എന്നു നൽകി.
- source_word: ἔστω οὐχ
  choice: ആകരുത്
  rationale: εἰμί എന്ന ക്രിയയുടെ മൂന്നാംപുരുഷ വർത്തമാന ആജ്ഞാരൂപത്തെയും അതിന്റെ നിഷേധത്തെയും മലയാളത്തിലെ സ്വാഭാവികമായ ഉപദേശാത്മക നിഷേധരൂപം സംരക്ഷിക്കുന്നു.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: ബാഹ്യ അലങ്കാരം
  rationale: ഇവിടെ κόσμος എന്നത് ‘ലോകം’ എന്നല്ല, ‘അലങ്കാരം/ക്രമീകരണം’ എന്നാണ്; ἔξωθεν അതിനെ ബാഹ്യമെന്ന് വിശേഷിപ്പിക്കുന്നു. അടുത്ത വാക്യത്തിലെ ആന്തരിക വ്യക്തിയുമായുള്ള വൈരുധ്യവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐμπλοκῆς τριχῶν
  choice: മുടി പിന്നുന്നത്
  rationale: മുടി ഇഴചേർത്ത് അലങ്കരിക്കുന്ന പ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും പറയുന്നു.
- source_word: περιθέσεως χρυσίων
  choice: സ്വർണാഭരണങ്ങൾ അണിയുന്നത്
  rationale: περίθεσις ചുറ്റിയിടുകയോ അണിയുകയോ ചെയ്യുന്ന പ്രവൃത്തിയെയും χρυσίων സ്വർണവസ്തുക്കളെയോ ആഭരണങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἢ
  choice: -ഉം ... -ഉം
  rationale: ഗ്രീക്കിലെ വികൽപ/പട്ടികബന്ധം മലയാളത്തിൽ സമാന്തര നാമക്രിയാരൂപങ്ങളെ ‘-ഉം’ കൊണ്ട് ചേർത്ത് സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: ἐνδύσεως ἱματίων
  choice: വസ്ത്രങ്ങൾ ധരിക്കുന്നത്
  rationale: വസ്ത്രം ധരിക്കുന്ന പ്രവൃത്തി എന്ന ഗ്രീക്ക് പദസമുച്ചയത്തിന്റെ നേരായ അർഥം നിലനിർത്തുന്നു; പട്ടികയിലെ സമാന്തര ഘടനയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ബാഹ്യ ശുചീകരണം, ആഭരണം, വസ്ത്രധാരണം എന്നിവ പത്രോസ് പൂർണമായി നിരോധിക്കുന്നുവോ, അതോ ആന്തരിക സ്വഭാവത്തിന് മുൻഗണന നൽകുകയാണോ
  choice: ഗ്രീക്കിലെ നിഷേധാത്മക ആജ്ഞ നേരിട്ട് നിലനിർത്തി; അടുത്ത വാക്യവുമായി ചേർത്ത് വായിക്കുമ്പോൾ ആന്തരിക സ്വഭാവത്തിന് നൽകുന്ന മുൻഗണന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി
  alternative: മുടി പിന്നൽ, സ്വർണം, വസ്ത്രധാരണം എന്നിവയുടെ സമ്പൂർണവും അക്ഷരാർഥത്തിലുള്ളതുമായ നിരോധനം
  rationale: വാക്യം 4 ബാഹ്യ അലങ്കാരത്തെ ‘ഹൃദയത്തിന്റെ മറഞ്ഞിരിക്കുന്ന വ്യക്തി’യുമായി വൈരുധ്യത്തിൽ നിർത്തുന്നു. വസ്ത്രം ധരിക്കുന്നതുപോലും പട്ടികയിൽ ഉള്ളതിനാൽ, എല്ലാത്തരം വസ്ത്രധാരണത്തിന്റെയും സമ്പൂർണ നിരോധനം എന്ന വായന സന്ദർഭത്തിന് യോജിക്കില്ല. എങ്കിലും ഗ്രീക്കിൽ ‘വെറും’ എന്ന പദം വ്യക്തമല്ലാത്തതിനാൽ അത് മുഖ്യവാചകത്തിൽ ചേർക്കാതെ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സമാന്തര പ്രവൃത്തിനാമഘടന ‘മുടി പിന്നുന്നതും ... അണിയുന്നതും ... ധരിക്കുന്നതുമായ’ എന്ന രൂപത്തിൽ നിലനിർത്തി. അടുത്ത വാക്യത്തിലേക്ക് ചിന്ത തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നൽകി.
