revisions:
- from: നിങ്ങളുടെ അലങ്കാരം മുടി പിന്നുന്നതും[a] സ്വർണാഭരണങ്ങൾ അണിയുന്നതും വസ്ത്രങ്ങൾ ധരിക്കുന്നതുമായ ബാഹ്യ അലങ്കാരമാകരുത്—
  to: നിങ്ങളുടെ അലങ്കാരം ബാഹ്യമായതാകരുത്—മുടി പിന്നുന്നതോ, സ്വർണാഭരണങ്ങൾ അണിയുന്നതോ, വസ്ത്രങ്ങൾ ധര Jenningsുന്നതോ—
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മക ആജ്ഞയും ബാഹ്യ അലങ്കാരവും തമ്മിലുള്ള ബന്ധം നേരിട്ട് നിലനിർത്തി. ἢ-യുടെ പട്ടികബന്ധം മലയാളത്തിൽ ‘-ഓ/-തോ’ രൂപങ്ങളാൽ പ്രതിഫലിപ്പിച്ചു. ഉറവിടത്തിൽ ഇല്ലാത്ത ‘വെറും,’ ‘ഭംഗിയുള്ള’ എന്നീ വ്യാഖ്യാന/വിശേഷണചേർക്കലുകൾ ഒഴിവാക്കി; അതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമായില്ല. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം ഡാഷ് നിലനിർത്തി.
