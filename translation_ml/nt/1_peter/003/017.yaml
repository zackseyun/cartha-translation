id: 1PE.3.17
reference: 1 Peter 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: ml
  text: കാരണം, ദൈവത്തിന്റെ ഇഷ്ടം അങ്ങനെ ഇച്ഛിക്കുമെങ്കിൽ[b], തിന്മ ചെയ്തുകൊണ്ട് കഷ്ടം അനുഭവിക്കുന്നതിനെക്കാൾ നന്മ ചെയ്തുകൊണ്ട് കഷ്ടം അനുഭവിക്കുന്നതാണ് നല്ലത്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നന്മ ചെയ്തതിനാൽ കഷ്ടം അനുഭവിക്കുന്നതാണ് ... തിന്മ ചെയ്തതിനാൽ കഷ്ടം അനുഭവിക്കുന്നതിനെക്കാൾ നല്ലത്.’ ഗ്രീക്കിലെ പങ്കുപദങ്ങൾ കാരണത്തെ (‘ചെയ്തതിനാൽ’) സൂചിപ്പിക്കുന്നതായോ, പൊതുവായ സാഹചര്യത്തെ (‘ചെയ്തുകൊണ്ട്’) വിവരിക്കുന്നതായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, ‘ദൈവത്തിന്റെ ഇഷ്ടം അങ്ങനെ ഇച്ഛിക്കുമെങ്കിൽ’ എന്നാണ്. «ഇഷ്ടം» എന്ന നാമവും «ഇച്ഛിക്കുക» എന്ന ക്രിയയും ആവർത്തിക്കുന്നതിലൂടെ ഗ്രീക്കിലെ ഊന്നൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: നല്ലത്
  rationale: താരതമ്യം സൂചിപ്പിക്കുന്ന ഈ പദത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായ വിധിപ്രസ്താവനയായി ‘നല്ലത്’ യോജിക്കുന്നു; ‘കൂടുതൽ നല്ലത്’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻ പ്രസ്താവനയ്ക്കുള്ള വിശദീകരണമോ കാരണമോ അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀγαθοποιοῦντας
  choice: നന്മ ചെയ്തുകൊണ്ട്
  rationale: വർത്തമാനകാല കർത്തൃവാചക പങ്കുപദത്തിന്റെ സാഹചര്യാർഥം നിലനിർത്തുന്നു; കഷ്ടം നന്മ ചെയ്തതിനുള്ള ശിക്ഷയാണെന്ന കാരണാർഥം നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: εἰ θέλοι
  choice: അങ്ങനെയായിരിക്കുമെങ്കിൽ
  rationale: εἰ സഹിതമുള്ള optative രൂപത്തിന്റെ സാധ്യതാപരവും മിതവുമായ വ്യവസ്ഥാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഇഷ്ടം
  rationale: ജനസാധാരണയ്ക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള ജനിറ്റീവ് വിവർത്തനം.
- source_word: πάσχειν
  choice: കഷ്ടം അനുഭവിക്കുന്നത്
  rationale: κρεῖττον ആശ്രയിക്കുന്ന infinitive ആശയം മലയാളത്തിലെ നാമീകരിച്ച ക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἢ
  choice: -നെക്കാൾ
  rationale: κρεῖττον ആവശ്യപ്പെടുന്ന താരതമ്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: κακοποιοῦντας
  choice: തിന്മ ചെയ്തുകൊണ്ട്
  rationale: ἀγαθοποιοῦντας എന്നതിനോടുള്ള സമാന്തരവിരോധം നിലനിർത്തുകയും കാരണാർഥം നിർബന്ധമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കഷ്ടാനുഭവവും ദൈവഹിതവും തമ്മിലുള്ള ബന്ധം
  choice: നന്മ ചെയ്യുന്നതിനിടയിലെ കഷ്ടം ദൈവത്തിന്റെ ഇഷ്ടത്തിന്റെ പരിധിയിൽ സംഭവിക്കാമെന്ന് വ്യവസ്ഥാപരമായി പ്രസ്താവിക്കുന്നു.
  alternative: ഓരോ കഷ്ടാനുഭവവും ദൈവം നിർണായകമായി കല്പിക്കുന്നു; അല്ലെങ്കിൽ ദൈവം അതിനെ വെറുതെ അനുവദിക്കുക മാത്രമാണ് ചെയ്യുന്നത്.
  rationale: εἰ θέλοι τὸ θέλημα τοῦ θεοῦ ദൈവഹിതത്തെ വ്യവസ്ഥാപരമായി പരാമർശിക്കുന്നുവെങ്കിലും നിർണയം-അനുവാദം എന്ന വിശാലമായ തത്ത്വചർച്ച തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. പങ്കുപദങ്ങളുടെ സാഹചര്യാർഥമാണ് മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചത്; കാരണാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. ഗ്രീക്കിലെ optative വ്യവസ്ഥയുടെ അനിശ്ചിതത്വം ‘ആയിരിക്കുമെങ്കിൽ’ വഴി നിലനിർത്തി.
