id: 1PE.3.19
reference: 1 Peter 3:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ τοῖς ἐν φυλακῇ πνεύμασιν πορευθεὶς ἐκήρυξεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/019.yaml
  text: in which also he went and proclaimed to the spirits in prison[c][b][a],
translation:
  language: ml
  text: അതിൽ[a] അവൻ പോയി തടവിലുള്ള ആത്മാക്കൾക്ക്[c] പ്രഖ്യാപിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനിൽ’; അല്ലെങ്കിൽ, ‘അതിലൂടെ.’ മുൻവാക്യത്തോടുള്ള ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കൃത്യമായ ബന്ധം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘പ്രസംഗിച്ചു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ ഒരു സന്ദേശം വിളംബരം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ആ സന്ദേശത്തിന്റെ കൃത്യമായ ഉള്ളടക്കം ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: ‘തടവിലുള്ള ആത്മാക്കൾ’ ആരാണെന്നതിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്; മരിച്ച മനുഷ്യരോ വീണുപോയ ദൂതസത്തകളോ എന്നിങ്ങനെ വ്യാഖ്യാനിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ആ അവസ്ഥയിൽത്തന്നെ
  rationale: മുൻവാക്യത്തിലെ πνεύματι എന്ന നപുംസകലിംഗ ദത്തിവുമായി ബന്ധം നിലനിർത്തുകയും, ‘അതിൽ/അതിനാൽ/അവനിൽ’ എന്ന വ്യാഖ്യാനസാധ്യതകളിൽ ഒന്നിനെ നിർബന്ധമായി ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു. സ്വാഭാവിക മലയാളത്തിനായി ‘ആ അവസ്ഥയിൽത്തന്നെ’ എന്നു നൽകി; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: καὶ
  choice: -ഉം
  rationale: മുൻവാക്യത്തോടു ചേർന്നുള്ള അധിക പ്രവർത്തനമെന്ന സങ്കലനാർഥം മലയാളത്തിലെ ‘-ഉം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῖς ... πνεύμασιν
  choice: ആത്മാക്കളോട്
  rationale: πνεύμασιν എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘മരിച്ചവരുടെ ആത്മാക്കൾ’ എന്നോ ‘ദൂതന്മാർ’ എന്നോ വ്യാഖ്യാനിച്ച് വ്യക്തിത്വം നിശ്ചയിക്കുന്നില്ല.
- source_word: ἐν φυλακῇ
  choice: തടവിലുള്ള
  rationale: കാവലിലോ ബന്ധനത്തിലോ ഇരിക്കുന്ന സ്ഥിതി സൂചിപ്പിക്കുന്ന φυλακήയ്ക്ക് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളം; സ്ഥലമോ അവസ്ഥയോ അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: πορευθεὶς
  choice: പോയി
  rationale: അയോറിസ്റ്റ് പങ്കുപദത്തിന്റെ ചലനാർഥം സ്വാഭാവിക മലയാള ക്രിയാശൃംഖലയായി നൽകുന്നു; കർശനമായ കാലക്രമം അധികമായി ചുമത്തുന്നില്ല.
- source_word: ἐκήρυξεν
  choice: പ്രഖ്യാപിച്ചു
  rationale: κηρύσσω പൊതുവായി അറിയിക്കുകയോ വിളംബരം ചെയ്യുകയോ എന്ന അർഥമുള്ളതാണ്. സന്ദേശം സുവിശേഷപ്രസംഗമോ ന്യായവിധിയുടെ അറിയിപ്പോ വിജയപ്രഖ്യാപനമോ ആയിരുന്നുവെന്ന് പാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘പ്രസംഗിച്ചു’ എന്നതിനെക്കാൾ ‘പ്രഖ്യാപിച്ചു’ തുറന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν ᾧ എന്നതിന്റെ സൂചന
  choice: ‘ആ അവസ്ഥയിൽത്തന്നെ’ എന്നു നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി; മുൻവാക്യത്തിലെ ആത്മാവിലുള്ള/ആത്മീയമായ അവസ്ഥയോടുള്ള ബന്ധം സൂചിപ്പിച്ചെങ്കിലും ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം തീർപ്പാക്കിയില്ല.
  alternative: ‘അവനിൽത്തന്നെ’; ‘അതിനാൽത്തന്നെ’; കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘അതിൽത്തന്നെ’.
  rationale: ഗ്രീക്ക് ഘടനയ്ക്ക് ഒന്നിലധികം വ്യാഖ്യാനങ്ങൾ സാധ്യമാണ്. ഒരു പ്രത്യേക ക്രിസ്തുശാസ്ത്രപരമായ പ്രവർത്തനരീതി പരിഭാഷയിലൂടെ ഉറപ്പിക്കുന്നത് ഒഴിവാക്കി.
- issue: ‘തടവിലുള്ള ആത്മാക്കൾ’ ആരെന്നത്
  choice: പ്രധാനപാഠത്തിൽ ‘ആത്മാക്കൾ’ എന്നതിലപ്പുറം തിരിച്ചറിയൽ നൽകിയില്ല.
  alternative: നോഹയുടെ കാലത്തെ മരിച്ച മനുഷ്യർ; വീണുപോയ ദൂതസത്തകൾ; തടവിലായ ആത്മീയ സത്തകളുടെ വിശാല വിഭാഗം.
  rationale: τοῖς ἐν φυλακῇ πνεύμασιν എന്ന പ്രയോഗം അവരുടെ വ്യക്തിത്വം നിർണായകമായി വ്യക്തമാക്കുന്നില്ല; അതിനാൽ നിലനിൽക്കുന്ന വ്യാഖ്യാനവ്യത്യാസം സംരക്ഷിച്ചു.
- issue: ἐκήρυξεν സൂചിപ്പിക്കുന്ന സന്ദേശത്തിന്റെ സ്വഭാവം
  choice: ‘പ്രഖ്യാപിച്ചു’ എന്നു നൽകി; ഉള്ളടക്കം നിർവചിച്ചില്ല.
  alternative: സുവിശേഷം പ്രസംഗിച്ചു; ന്യായവിധി അറിയിച്ചു; വിജയം വിളംബരം ചെയ്തു.
  rationale: ക്രിയ പ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ ഉള്ളടക്കം ഈ വാക്യത്തിൽ പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദുര്‍ഗ്രാഹ്യമായ അക്ഷരാനുകരണം ഒഴിവാക്കി സ്വാഭാവിക വാക്യക്രമം സ്വീകരിച്ചു; എന്നാൽ ഗ്രീക്കിലെ വ്യാകരണ-ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
