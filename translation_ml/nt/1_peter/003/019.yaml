- from: ആ അവസ്ഥയിൽത്തന്നെ അവൻ പോയി തടവിലുള്ള ആത്മാക്കളോടും പ്രഖ്യാപിച്ചു[a][b][c].
  to: അതിൽ[a] അവൻ പോയി തടവിലുള്ള ആത്മാക്കൾക്ക്[c] പ്രഖ്യാപിച്ചു[b].
  rationale: The revision removes the interpretively expanded “state” language and unexpressed emphasis from the main text, while retaining the disputed relation of ἐν ᾧ through the neutral “അതിൽ” and documenting viable alternatives in the footnote. It also uses more idiomatic Malayalam for the indirect object and corrects the instrumental alternative in footnote a. No doctrinal interpretation of the imprisoned spirits or the content of the proclamation is imposed.
