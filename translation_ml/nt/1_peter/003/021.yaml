revisions:
- from: അതിനു സാദൃശ്യമായ സ്നാനം ഇപ്പോൾ നിങ്ങളെയും രക്ഷിക്കുന്നു—അത് ജഡത്തിലെ അഴുക്ക് നീക്കുന്നതല്ല, മറിച്ച് നല്ല മനസ്സാക്ഷിക്കായി ദൈവത്തോടുള്ള അപേക്ഷയാണ്[a]—യേശുക്രിസ്തുവിന്റെ പുനരുത്ഥാനത്തിലൂടെ.
  to: അതിനോടു സാദൃശ്യമുള്ള സ്നാനം ഇപ്പോൾ നിങ്ങളെയും രക്ഷിക്കുന്നു—ജഡത്തിൽനിന്ന് അഴുക്ക് നീക്കലല്ല, മറിച്ച് നല്ല മനസ്സാക്ഷിക്കായി ദൈവത്തോടുള്ള അപേക്ഷയാണ്[a]—യേശുക്രിസ്തുവിന്റെ പുനരുത്ഥാനത്തിലൂടെ.
  rationale: ഭേദഗതികൾ അർത്ഥപരമായി പരിമിതമാണ്. ‘ജഡത്തിൽനിന്ന് അഴുക്ക് നീക്കൽ’ എന്നത് ബാഹ്യശുദ്ധീകരണം മാത്രമല്ലെന്ന് പത്രോസ് പറയുന്ന വിരുദ്ധതയെ കൃത്യമായി നൽകുന്നു. വിവാദമുള്ള ἐπερώτημαയുടെ പ്രധാനവായനയും അതിന്റെ ബദൽ വായനകളും മാറ്റമില്ലാതെ സംരക്ഷിച്ചിരിക്കുന്നു.
