id: 1PE.3.21
reference: 1 Peter 3:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: ml
  text: അതിനോടു സാദൃശ്യമുള്ള സ്നാനം ഇപ്പോൾ നിങ്ങളെയും രക്ഷിക്കുന്നു—ജഡത്തിൽനിന്ന് അഴുക്ക് നീക്കലല്ല, മറിച്ച് നല്ല മനസ്സാക്ഷിക്കായി ദൈവത്തോടുള്ള അപേക്ഷയാണ്[a]—യേശുക്രിസ്തുവിന്റെ പുനരുത്ഥാനത്തിലൂടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തോടുള്ള നല്ല മനസ്സാക്ഷിയുടെ പ്രതിജ്ഞ.” “അപേക്ഷ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം (ἐπερώτημα) “പ്രതിജ്ഞ” അല്ലെങ്കിൽ “ഉത്തരം” എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: അതിനു സാദൃശ്യമായ
  rationale: മുൻവാക്യത്തിലെ പ്രളയജലത്തിലൂടെ ലഭിച്ച രക്ഷയോടുള്ള correspondence സൂചിപ്പിക്കുന്നു; സാങ്കേതികവും അപരിചിതവുമായ ‘പ്രതിരൂപം’ എന്ന പദം ഒഴിവാക്കി ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: σῴζει
  choice: രക്ഷിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ നേരിട്ടുള്ള ശക്തി മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: βάπτισμα
  choice: സ്നാനം
  rationale: ക്രൈസ്തവ സന്ദർഭത്തിൽ βάπτισμα എന്നതിന്റെ സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാള പദം.
- source_word: σαρκὸς ἀπόθεσις ῥύπου
  choice: ജഡത്തിലെ അഴുക്ക് നീക്കുന്നത്
  rationale: ശാരീരിക ശുദ്ധീകരണത്തെ സൂചിപ്പിക്കുന്ന വാചകം നേരിട്ട് നിലനിർത്തുന്നു; ‘ജഡം’ σάρξ എന്ന പദത്തിന്റെ രൂപവും അർത്ഥവും സംരക്ഷിക്കുന്നു.
- source_word: συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν
  choice: നല്ല മനസ്സാക്ഷിക്കായി ദൈവത്തോടുള്ള അപേക്ഷ
  rationale: ἐπερώτημα എന്ന തർക്കവിധേയ പദത്തിന് ‘അപേക്ഷ’ എന്നും εἰς θεόν എന്നതിന് ദൈവത്തിലേക്കു തിരിയുന്ന ദിശാബോധവും നൽകുന്നു; ജനിറ്റീവിനെ ‘നല്ല മനസ്സാക്ഷിക്കായി’ എന്നു വായിക്കുന്നു, എന്നാൽ മറ്റൊരു സാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ
  choice: യേശുക്രിസ്തുവിന്റെ പുനരുത്ഥാനത്തിലൂടെ
  rationale: διά + ജനിറ്റീവ് സൂചിപ്പിക്കുന്ന മാർഗം/മാധ്യമം ‘-ലൂടെ’ കൊണ്ട് സ്വാഭാവികമായി നൽകുന്നു; ‘യേശുക്രിസ്തു’ മലയാളത്തിലെ സ്ഥാപിതവും ഗൗരവമുള്ളതുമായ രൂപമാണ്.
theological_decisions:
- issue: സ്നാനവും രക്ഷയും തമ്മിലുള്ള ബന്ധം
  choice: ‘സ്നാനം ഇപ്പോൾ നിങ്ങളെയും രക്ഷിക്കുന്നു’ എന്ന നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തി, തുടർന്നുള്ള പത്രോസിന്റെ വിശദീകരണം അതിന്റെ അർത്ഥത്തെ നിയന്ത്രിക്കാൻ അനുവദിച്ചു.
  alternative: ഇത് ‘സ്നാനം രക്ഷയെ പ്രതീകപ്പെടുത്തുന്നു’ എന്നു ദുർബലപ്പെടുത്തുകയോ പ്രത്യേക സഭാവിഭാഗത്തിന്റെ സാക്രമെന്റൽ വ്യാഖ്യാനം ചേർക്കുകയോ ചെയ്യുക.
  rationale: മൂലപാഠം സ്നാനത്തിന് രക്ഷയുമായി നേരിട്ടുള്ള ബന്ധം പ്രസ്താവിക്കുന്നു; അതേസമയം വെറും ബാഹ്യശുദ്ധീകരണമല്ലെന്നും പുനരുത്ഥാനത്തിലൂടെയാണെന്നും വ്യക്തമാക്കുന്നു. ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കണം.
- issue: ἐπερώτημα എന്ന പദത്തിന്റെ അർത്ഥം
  choice: പ്രധാനപാഠത്തിൽ ‘അപേക്ഷ’; ‘പ്രതിജ്ഞ/ഉറപ്പ്’ എന്ന വായന അടിക്കുറിപ്പിൽ.
  alternative: ‘ദൈവത്തോടുള്ള നല്ല മനസ്സാക്ഷിയുടെ പ്രതിജ്ഞ’ അല്ലെങ്കിൽ ‘ഉത്തരം’.
  rationale: εἰς θεόν സഹിതം ‘അപേക്ഷ’ യോജിച്ച വായനയാണ്; എന്നാൽ ‘പ്രതിജ്ഞ’ എന്ന അർത്ഥത്തിനും ഗൗരവമുള്ള ഭാഷാശാസ്ത്രപരമായ പിന്തുണയുള്ളതിനാൽ അത് മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. വാക്യത്തിന്റെ ഗ്രീക്ക് ഘടനയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരമാവധി നിലനിർത്തിക്കൊണ്ട് ദീർഘവാചകം ഡാഷുകൾ ഉപയോഗിച്ച് വ്യക്തമായി ക്രമപ്പെടുത്തി.
