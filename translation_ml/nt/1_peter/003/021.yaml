    rationale: ഗ്രീക്ക് വാക്യഭാഗം ജഡത്തിൽനിന്ന് അഴുക്ക് നീക്കുന്നതിനെ, അഥവാ ബാഹ്യശുദ്ധീകരണത്തെ, നിഷേധിക്കുന്നു. നിലവിലെ രൂപം ‘ജഡത്തിലെ’ അഴുക്കിനെ നീക്കുന്നതായി ചെറിയ അർത്ഥവ്യതിയാനം സൃഷ്ടിക്കാം.
