id: 1PE.3.22
reference: 1 Peter 3:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: ml
  text: സ്വർഗത്തിലേക്കു പോയി ദൈവത്തിന്റെ വലത്തുഭാഗത്തുള്ളവനാണ് അവൻ; ദൂതന്മാരും അധികാരങ്ങളും ശക്തികളും അവനു വിധേയരാക്കപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅς
  choice: അവൻ
  rationale: മുൻവാക്യത്തിലെ യേശുക്രിസ്തുവിനെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വാക്യബന്ധം സ്വാഭാവികമായി നിലനിർത്താൻ ‘അവൻ’ ഉപയോഗിച്ചു.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: ദൈവത്തിന്റെ വലത്തുഭാഗത്ത്
  rationale: ഉന്നതസ്ഥാനവും ബഹുമാനവും സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: സ്വർഗത്തിലേക്കു പോയി
  rationale: ദിശാസൂചകമായ εἰς എന്നതിന്റെയും മുൻകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെയും അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑποταγέντων αὐτῷ
  choice: അവനു കീഴ്പ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ passive subordination-ഉം ക്രിസ്തുവിനോടുള്ള വിധേയത്വവും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀγγέλων
  choice: ദൂതന്മാർ
  rationale: ഈ സ്വർഗീയ-പ്രാപഞ്ചിക സന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരല്ല, സ്വർഗീയ ദൂതന്മാരാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἐξουσιῶν
  choice: അധികാരങ്ങൾ
  rationale: തുടർന്നുള്ള δυνάμεις എന്ന പദത്തിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് പ്രാപഞ്ചികമോ ആത്മീയമോ ആയ അധികാരങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: δυνάμεων
  choice: ശക്തികൾ
  rationale: ത്രയപട്ടികയുടെ വ്യത്യസ്തത നിലനിർത്തുന്ന സംക്ഷിപ്തവും പതിവുമായ തർജമയാണ്.
theological_decisions:
- issue: ദൈവത്തിന്റെ വലത്തുഭാഗത്തുള്ള ക്രിസ്തുവിന്റെ ഉന്നതസ്ഥാനം
  choice: ‘ദൈവത്തിന്റെ വലത്തുഭാഗത്ത്’ എന്ന സ്ഥല-ബന്ധപരമായ ബൈബിൾപ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: ദൈവത്തോടൊപ്പം പരമോന്നത ബഹുമാനസ്ഥാനത്ത്
  rationale: ഇത് വെറും ബഹുമാനത്തിന്റെ രൂപകമായി ചുരുക്കാതെ മൂലപാഠത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ പ്രയോഗവും അതിന്റെ സമ്പന്നതയും സംരക്ഷിക്കുന്നു.
- issue: ‘ദൂതന്മാർ, അധികാരങ്ങൾ, ശക്തികൾ’ എന്നിവരുടെ സ്വഭാവം
  choice: അവരെ നന്മയുള്ളവരോ തിന്മയുള്ളവരോ മിശ്രവിഭാഗമോ എന്ന് നിർണയിക്കാതെ വിശാലമായ സ്വർഗീയ-പ്രാപഞ്ചിക പട്ടികയായി നിലനിർത്തി.
  alternative: നല്ല ദൂതന്മാർ മാത്രം; അല്ലെങ്കിൽ ശത്രുതയുള്ള ആത്മീയശക്തികൾ മാത്രം
  rationale: ഗ്രീക്ക് പട്ടിക ഇവരുടെ ധാർമികസ്വഭാവം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ participial ഘടന വാക്കിന് വാക്കായി അനുകരിക്കാതെ, സംഭവക്രമവും അർഥബന്ധവും സൂക്ഷിച്ച് രണ്ട് സ്വാഭാവിക മലയാളക്രിയാരൂപങ്ങളായി നൽകി. ‘സ്വർഗത്തിലേക്ക്’ എന്നത് εἰς οὐρανόν എന്ന ദിശാസൂചന സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
