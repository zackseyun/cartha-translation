review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the threefold list and their subjection to Christ, but ‘ഇരിക്കുന്നു’ (‘is seated/sits’) adds a posture not expressed by ἐστιν (‘is’). The Greek states that he is at God’s right hand, after going into heaven.
  naturalness: The revised wording is natural, formal modern Malayalam and retains the biblical idiom without an unnecessary interpretive addition.
  terminology: ‘ദൈവത്തിന്റെ വലത്തുഭാഗം,’ ‘ദൂതന്മാർ,’ ‘അധികാരങ്ങൾ,’ and ‘ശക്തികൾ’ are appropriate. ‘വിധേയരാക്കപ്പെട്ടിരിക്കുന്നു’ explicitly reflects the passive force of ὑποταγέντων.
  issues:
  - severity: medium
    issue: ‘ഇരിക്കുന്നു’ introduces sitting/seated posture.
    rationale: The source uses ἐστιν, not a verb for sitting. Malayalam can preserve the idiom more exactly with ‘ദൈവത്തിന്റെ വലത്തുഭാഗത്തുള്ളവനാണ്.’
  - severity: low
    issue: ‘കീഴ്പ്പെട്ടിരിക്കുന്നു’ does not explicitly convey the Greek passive voice.
    rationale: The phrase communicates subordination, but ‘വിധേയരാക്കപ്പെട്ടിരിക്കുന്നു’ more clearly represents the aorist passive participle without changing the sense.
  revised_text: സ്വർഗത്തിലേക്കു പോയി ദൈവത്തിന്റെ വലത്തുഭാഗത്തുള്ളവനാണ് അവൻ; ദൂതന്മാരും അധികാരങ്ങളും ശക്തികളും അവനു വിധേയരാക്കപ്പെട്ടിരിക്കുന്നു.
  revised_footnotes: []
  revision_rationale: 'The revision removes the added notion of sitting, retains the antecedent movement into heaven, and renders the final participle with an explicit passive Malayalam construction. No footnote is needed: ‘സ്വർഗത്തിലേക്കു’ naturally conveys the directional sense of εἰς οὐρανόν.'
