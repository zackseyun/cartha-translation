revisions:
- from: അവൻ സ്വർഗത്തിലേക്കു പോയി ദൈവത്തിന്റെ വലത്തുഭാഗത്ത് ഇരിക്കുന്നു; ദൂതന്മാരും അധികാരങ്ങളും ശക്തികളും അവനു കീഴ്പ്പെട്ടിരിക്കുന്നു.
  to: സ്വർഗത്തിലേക്കു പോയി ദൈവത്തിന്റെ വലത്തുഭാഗത്തുള്ളവനാണ് അവൻ; ദൂതന്മാരും അധികാരങ്ങളും ശക്തികളും അവനു വിധേയരാക്കപ്പെട്ടിരിക്കുന്നു.
