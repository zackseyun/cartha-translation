id: 1PE.3.9
reference: 1 Peter 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: ml
  text: തിന്മയ്ക്കു പകരം തിന്മയോ അധിക്ഷേപത്തിനു പകരം അധിക്ഷേപമോ[a] തിരികെ കൊടുക്കാതെ, മറിച്ച്[b] അനുഗ്രഹിക്കുവിൻ. കാരണം, ഇതിനായിട്ടാണ് നിങ്ങൾ വിളിക്കപ്പെട്ടത്[c]—നിങ്ങൾ അനുഗ്രഹം അവകാശമായി പ്രാപിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിന്ദയ്ക്കു പകരം നിന്ദ.’ ഗ്രീക്കുപദം അധിക്ഷേപകരമോ അപമാനകരമോ ആയ സംസാരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പകരം.’ ഗ്രീക്കിലെ പ്രയോഗം ശക്തമായ വിപരീതതിരിവാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, ദുഷ്പെരുമാറ്റത്തിന് പ്രതികാരം ചെയ്യാതെ അനുഗ്രഹത്തോടെ പ്രതികരിക്കാൻ ദൈവം നിങ്ങളെ വിളിച്ചു.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: തിരികെ കൊടുക്കാതെ
  rationale: മുൻപ് ലഭിച്ച പെരുമാറ്റത്തിന് അതേവിധം പകരം ചെയ്യുക എന്ന പരസ്പരപ്രതികരണത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. μήയോടുകൂടിയ കർത്തൃവാചകത്തെ ഉപദേശാത്മകമായ നിഷേധമായി അവതരിപ്പിക്കുന്നു.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: തിന്മയ്ക്കു പകരം തിന്മ
  rationale: κακόν എന്ന പദത്തിന്റെ ധാർമിക ഗൗരവവും ἀντί സൂചിപ്പിക്കുന്ന പ്രതികാരപരമായ പകരവും സംരക്ഷിക്കുന്നു.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: അധിക്ഷേപത്തിനു പകരം അധിക്ഷേപം
  rationale: λοιδορία ഇവിടെ നിന്ദാപരവും അപമാനകരവുമായ സംസാരത്തെ സൂചിപ്പിക്കുന്നു. ‘അധിക്ഷേപം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും വാക്കാലുള്ള ദുഷ്പെരുമാറ്റത്തിന്റെ ശക്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: τοὐναντίον δὲ
  choice: മറിച്ച്
  rationale: പ്രതികാരത്തിന് പൂർണവിപരീതമായ പെരുമാറ്റത്തിലേക്കുള്ള ശക്തമായ തിരിവ് ചുരുക്കവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εὐλογοῦντες
  choice: അനുഗ്രഹിക്കുവിൻ
  rationale: ഗ്രീക്കിലെ ഉപദേശാത്മക കർത്തൃവാചകത്തിന്റെ ശക്തി മലയാളത്തിൽ വ്യക്തമായ ആജ്ഞാരൂപത്തിൽ നൽകുന്നു. ആരെ അനുഗ്രഹിക്കണം എന്ന കർമം മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: ὅτι
  choice: ആണല്ലോ
  rationale: തുടർന്നുവരുന്ന വാക്യം മുൻ ഉപദേശത്തിന്റെ കാരണം നൽകുന്നതാണെന്ന് മലയാളത്തിലെ സ്വാഭാവിക ഊന്നലോടെ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: ഇതിനായിട്ടാണല്ലോ നിങ്ങൾ വിളിക്കപ്പെട്ടത്
  rationale: ദൈവിക വിളിയുടെ കർമണിപ്രയോഗം നിലനിർത്തുകയും ‘ഇത്’ എന്നതിന്റെ കൃത്യമായ പരിധി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἵνα
  choice: —േണ്ടതിന്
  rationale: ഉദ്ദേശ്യമോ ലക്ഷ്യമോ സൂചിപ്പിക്കുന്ന ἵναയുടെ ശക്തി സ്വാഭാവികമായ മലയാള ഉദ്ദേശ്യഘടനയിൽ നൽകുന്നു.
- source_word: εὐλογίαν
  choice: അനുഗ്രഹം
  rationale: ദൈവത്തിൽനിന്നു ലഭിക്കുന്ന അനുഗ്രഹം എന്ന അർത്ഥം ലളിതമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ അനിശ്ചിത ഉപപദം നിർബന്ധമല്ല.
- source_word: κληρονομήσητε
  choice: അവകാശമായി പ്രാപിക്കേണ്ടതിന്
  rationale: വെറും ‘ലഭിക്കുക’ എന്നതിലുപരി അവകാശിക്ക് നൽകപ്പെടുന്നതു കൈവരിക്കുക എന്ന കുടുംബപരവും ഉടമ്പടിപരവുമായ ഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: εἰς τοῦτο ἐκλήθητε എന്നതിലെ വിളിയുടെ സ്വഭാവവും ‘ഇത്’ എന്നതിന്റെ സൂചനയും
  choice: ദോഷത്തിനു പ്രതികാരം ചെയ്യാതെ അനുഗ്രഹിക്കുന്നതിനോടാണ് അടുത്ത ബന്ധം; ദൈവമാണ് വിളിക്കുന്നവൻ എന്നു അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ക്രിസ്തീയജീവിതത്തിലെ കഷ്ടസഹനവും പ്രതികാരരാഹിത്യവും മുഴുവനായി ‘ഇത്’ സൂചിപ്പിക്കുന്നു എന്നു വായിക്കാം.
  rationale: ഉടൻ മുൻപുള്ള ‘അനുഗ്രഹിക്കുവിൻ’ എന്ന ആഹ്വാനം ഏറ്റവും അടുത്ത സൂചനയാണ്. എന്നാൽ ‘ഇതിനായി’ എന്ന വിവർത്തനം വിശാലമായ സന്ദർഭസാധ്യത അടച്ചുകളയുന്നില്ല; ദൈവത്തെ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ ഗ്രീക്കിലെ കർമണിപ്രയോഗവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഉപദേശാത്മക ശൈലി സ്വീകരിച്ചു. പ്രതികാരപരമായ സമാന്തരഘടന ആവർത്തനത്തിലൂടെ നിലനിർത്തി. അവസാനഘടകത്തിലെ ദൈവിക വിളി, ഉദ്ദേശ്യം, അവകാശഭാവം എന്നിവ അമിതമായി വ്യാഖ്യാനിക്കാതെ സൂക്ഷിച്ചു.
