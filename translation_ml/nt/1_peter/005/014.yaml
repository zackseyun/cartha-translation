id: 1PE.5.14
reference: 1 Peter 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: ml
  text: സ്നേഹത്തിന്റെ ചുംബനത്തോടെ പരസ്പരം അഭിവാദ്യം ചെയ്യുക. മശീഹായിലുള്ള[a] നിങ്ങൾക്കെല്ലാവർക്കും സമാധാനം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി, ‘ക്രിസ്തുവിൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലെ ആജ്ഞാരൂപം സമൂഹാംഗങ്ങൾ നിർവഹിക്കേണ്ട അഭിവാദനത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ലേഖനസമാപനത്തിന് യോജിച്ചതുമായ പ്രയോഗമാണിത്.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: സമൂഹത്തിനുള്ളിലെ അന്യോന്യപ്രവർത്തനം വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: ἐν φιλήματι ἀγάπης
  choice: സ്നേഹത്തിന്റെ ചുംബനത്തോടെ
  rationale: ἐν ഇവിടെ അഭിവാദനത്തിന്റെ മാർഗം അഥവാ രീതി സൂചിപ്പിക്കുന്നതിനാൽ ‘-ത്തോടെ’ എന്നു നൽകി; φίλημα എന്നത് ‘ചുംബനം’ എന്നും ἀγάπης എന്ന ജനിറ്റീവ് ‘സ്നേഹത്തിന്റെ’ എന്നും സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ നാമപദാശീർവാദരൂപം അധിക ക്രിയ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὑμῖν πᾶσιν
  choice: നിങ്ങൾക്കെല്ലാവർക്കും
  rationale: ആശീർവാദം ലഭിക്കുന്ന എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന ദാതൃവിഭക്തിയും πᾶσιν എന്ന പൂർണവ്യാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τοῖς ἐν Χριστῷ
  choice: മശീഹായിൽ ഉള്ള
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പൂർവപ്രത്യയപദസമുച്ചയം ‘ഉള്ളവർ’ എന്ന അർഥത്തിൽ പ്രവർത്തിക്കുന്നു. Χριστός ഇവിടെ അഭിഷിക്തനായവന്റെ പദവിയായതിനാൽ ‘മശീഹാ’ എന്നു നൽകി; പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: ἐν Χριστῷ എന്നതിലെ Χριστῷ-യുടെ പരിഭാഷ
  choice: മശീഹായിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: Χριστός ഇവിടെ വെറും വ്യക്തിനാമത്തേക്കാൾ ‘അഭിഷിക്തൻ’ എന്ന പദവിയുടെ അർഥം വഹിക്കുന്നു. അതിനാൽ പ്രധാനപാഠത്തിൽ ‘മശീഹാ’ ഉപയോഗിച്ചു; വ്യാപകമായി പരിചിതമായ ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള, ലളിതവും മാന്യവുമായ ലേഖനസമാപനശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്ത ആശീർവാദരൂപം സംരക്ഷിക്കാൻ ‘ഉണ്ടാകട്ടെ’ എന്ന ക്രിയ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് സൂചിക ബന്ധപ്പെട്ട പദമായ ‘മശീഹായിൽ’ എന്നതിനോട് ചേർത്തിരിക്കുന്നു.
