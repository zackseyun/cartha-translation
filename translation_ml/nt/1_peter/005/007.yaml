  text: πᾶσαν τὴν μέριμναν ὑμῶν ἐπιρίψαντες ἐπ’ αὐτόν, ὅτι αὐτῷ μέλει περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/007.yaml
  text: casting all your anxiety on him[c][b][a], because he cares for you.
translation:
  language: ml
  text: നിങ്ങളുടെ എല്ലാ ഉത്കണ്ഠയും[a] അവന്റെ മേൽ ഇട്ടുകൊണ്ട്[b][c], കാരണം നിങ്ങളെക്കുറിച്ച് അവന് കരുതലുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കരുതൽ’, ‘വേവലാതി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ആശങ്ക നിറഞ്ഞ കരുതൽ അഥവാ ഉത്കണ്ഠയാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഇട്ടശേഷം’ അഥവാ ‘അവന്റെ മേൽ എറിഞ്ഞിട്ട്’.
    reason: lexical_alternative
  - marker: c
    text: ‘അവൻ’ എന്നത് തൊട്ടുമുൻപുള്ള സന്ദർഭത്തിലെ ദൈവത്തെ സൂചിപ്പിക്കുന്നു (വാക്യം 6).
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν
  choice: എല്ലാ
  rationale: μέριμναν എന്ന ഏകവചന നാമത്തെ വിശേഷിപ്പിക്കുന്ന πᾶσαν ഇവിടെ ഉത്കണ്ഠയുടെ സമഗ്രത സൂചിപ്പിക്കുന്നു; ആ വ്യാപകബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μέριμναν
  choice: ഉത്കണ്ഠ
  rationale: ഈ സന്ദർഭത്തിൽ നിഷ്പക്ഷമായ കരുതലിനേക്കാൾ ആകുലതയോ വേവലാതിയോ ആണ് ഉദ്ദേശ്യം; ‘ഉത്കണ്ഠ’ ആ അർഥം മാന്യവും ആധുനികവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ / നിങ്ങളെക്കുറിച്ച്
  rationale: 'രണ്ടിടത്തും ബഹുവചനമായ രണ്ടാംപുരുഷസൂചന നിലനിർത്തുന്നു: ആദ്യം ഉടമസ്ഥതയായും പിന്നീട് περί എന്നതിനോടൊപ്പമുള്ള ബന്ധസൂചനയായും.'
- source_word: ἐπιρίψαντες
  choice: ഇട്ടുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തോടു ബന്ധപ്പെടുന്ന ഭൂതകാല ക്രിയാവിശേഷണരൂപത്തിന്റെ ആശ്രിതസ്വഭാവം നിലനിർത്തുകയും ഭാരം മറ്റൊരാളുടെമേൽ ഇടുന്ന രൂപകം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπ’ αὐτόν
  choice: അവന്റെമേൽ
  rationale: ἐπί + accusative സൂചിപ്പിക്കുന്ന ഒരാളുടെമേലേക്കുള്ള കൈമാറ്റവും ഭാരം ഏൽപ്പിക്കുന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഉത്കണ്ഠ അവന്റെമേൽ ഇടേണ്ടതിന്റെ കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: μέλει
  choice: കരുതലുണ്ട്
  rationale: ഗ്രീക്കിലെ μέλει എന്ന പ്രയോഗത്തിന്റെ സജീവമായ താത്പര്യവും ശ്രദ്ധയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വെറും വികാരമോ ഭൗതികപരിപാലനം മാത്രമോ എന്ന് അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- source_word: περὶ ὑμῶν
  choice: നിങ്ങളെക്കുറിച്ച്
  rationale: περί + genitive എന്നതിന്റെ ‘കുറിച്ച്/സംബന്ധിച്ച്’ എന്ന ബന്ധാർഥം നേരിട്ട് നിലനിർത്തുന്നു; μέλει-യോടൊപ്പം വ്യക്തികളോടുള്ള കരുതൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: αὐτόν/αὐτῷ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ‘അവൻ’ എന്ന സർവനാമം നിലനിർത്തി, അടിക്കുറിപ്പിൽ ദൈവം എന്നു വ്യക്തമാക്കുന്നു
  alternative: മുഖ്യവാക്യത്തിൽ നേരിട്ട് ‘ദൈവത്തിന്റെമേൽ’ എന്നു പറയുക
  rationale: 5:6-ലെ ‘ദൈവത്തിന്റെ ശക്തമായ കൈക്കീഴിൽ’ എന്ന തൊട്ടുമുൻപുള്ള സന്ദർഭം ദൈവത്തെയാണ് സ്വാഭാവിക സൂചിതനാക്കുന്നത്. എങ്കിലും ഗ്രീക്കിലെ സർവനാമരൂപം മുഖ്യവാക്യത്തിൽ സംരക്ഷിക്കുന്നത് മൂലപാഠത്തെ അനാവശ്യമായി വിശദീകരിക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യം 6-ലെ ആഹ്വാനത്തോടുള്ള വ്യാകരണബന്ധം സൂക്ഷിക്കാൻ ‘ഇട്ടുകൊണ്ട്’ എന്ന ആശ്രിതരൂപം ഉപയോഗിച്ചു. ‘കരുതലുണ്ട്’ എന്നത് ദൈവത്തിന്റെ സജീവമായ ശ്രദ്ധയെ സ്വാഭാവികമായി അറിയിക്കുമ്പോൾ മൂലത്തിലെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
