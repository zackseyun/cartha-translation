- from: അതുപോലെ, യുവാക്കളേ[a], മൂപ്പന്മാർക്കു കീഴടങ്ങുക. നിങ്ങളെല്ലാവരും പരസ്പരം താഴ്മ അണിഞ്ഞുകൊള്ളുക[b]. കാരണം, “ദൈവം അഹങ്കാരികളെ എതിർക്കുന്നു; എന്നാൽ താഴ്മയുള്ളവർക്കു കൃപ നൽകുന്നു.”[c]
  to: അതുപോലെ, യുവാക്കളേ[a], മൂപ്പന്മാർക്കു കീഴടങ്ങുക. നിങ്ങളെല്ലാവരും ഒരാളോടൊരാൾ താഴ്മ അണിഞ്ഞുകൊള്ളുക[b]. കാരണം, “ദൈവം അഹങ്കാരികളെ എതിർക്കുന്നു; എന്നാൽ താഴ്മയുള്ളവർക്കു കൃപ നൽകുന്നു.”[c]
  rationale: “പരസ്പരം” എന്നത് ഇവിടെ വ്യാകരണപരമായി സാധ്യമാണെങ്കിലും, ἀλλήλοις-ന്റെ ‘one another/toward one another’ എന്ന ബന്ധപരമായ അർഥം കൂടുതൽ വ്യക്തമായി നൽകാൻ “ഒരാളോടൊരാൾ” ഉപയോഗിച്ചു. മറ്റെല്ലാ ഘടകങ്ങളും ഉറവിടപാഠത്തോടും ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തോടും യോജിക്കുന്നതിനാൽ നിലനിർത്തി.
