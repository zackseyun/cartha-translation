reference: 1 Peter 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: ml
  text: അതുപോലെ, യുവാക്കളേ[a], മൂപ്പന്മാർക്കു കീഴടങ്ങുക. നിങ്ങളെല്ലാവരും ഒരാളോടൊരാൾ താഴ്മ അണിഞ്ഞുകൊള്ളുക[b]. കാരണം, “ദൈവം അഹങ്കാരികളെ എതിർക്കുന്നു; എന്നാൽ താഴ്മയുള്ളവർക്കു കൃപ നൽകുന്നു.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചെറുപ്പക്കാരായവരേ.’ ഗ്രീക്കിൽ ഇത് പുല്ലിംഗ ബഹുവചനമാണ് (‘യുവാക്കളേ’); എന്നാൽ ചിലർ ഇതിനെ സഭയിലെ പ്രായം കുറഞ്ഞ അംഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘താഴ്മ അരയിൽ കെട്ടിക്കൊള്ളുക.’ വസ്ത്രമോ അരക്കച്ചയോ ധരിച്ച് ഉറപ്പിക്കുന്നതിനെ ഓർമിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയ, താഴ്മ മനഃപൂർവം ധരിക്കണമെന്ന രൂപകത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: c
    text: സദൃശവാക്യങ്ങൾ 3:34-ന്റെ ഗ്രീക്ക് പഴയനിയമപാഠത്തിൽനിന്നുള്ള ഉദ്ധരണി അഥവാ സൂചന.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: അതുപോലെ
  rationale: മുൻവാക്യങ്ങളിലെ പ്രബോധനവുമായി ഈ ആഹ്വാനത്തെ ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികമായ വ്യവഹാരസൂചകം.
- source_word: νεώτεροι
  choice: യുവാക്കളേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ലിംഗസൂചനയോടെ നിലനിർത്തുന്നു.
- source_word: ὑποτάγητε
  choice: കീഴടങ്ങുക
  rationale: പ്രബോധനപരമായ സന്ദർഭത്തിൽ സ്വമേധയായുള്ള വിധേയത്വത്തെ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: πρεσβυτέροις
  choice: മൂപ്പന്മാർക്കു
  rationale: 5:1–4-ലെ തൊട്ടുമുൻപുള്ള സന്ദർഭം സഭയിലെ മൂപ്പന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; എങ്കിലും മൂലപദത്തിന്റെ ലളിതരൂപം വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
- source_word: πάντες δὲ
  choice: നിങ്ങളെല്ലാവരും
  rationale: ആഹ്വാനം യുവാക്കളിൽനിന്ന് മുഴുവൻ സമൂഹത്തിലേക്കും വ്യാപിപ്പിക്കുന്നതിനെ വ്യക്തമാക്കുന്നു.
- source_word: ἀλλήλοις
  choice: പരസ്പരം
  rationale: സമൂഹാംഗങ്ങൾ തമ്മിലുള്ള പരസ്പരബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ταπεινοφροσύνην
  choice: താഴ്മ
  rationale: മനോഭാവത്തെയും പെരുമാറ്റത്തെയും ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ മലയാളപദം.
- source_word: ἐγκομβώσασθε
  choice: അണിഞ്ഞുകൊള്ളുക
  rationale: വസ്ത്രമോ അരക്കച്ചയോ ധരിച്ച് ഉറപ്പിക്കുന്നതിന്റെ രൂപകം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: തുടർന്നുള്ള തിരുവെഴുത്തുവാക്യം പ്രബോധനത്തിന്റെ അടിസ്ഥാനമാണെന്ന് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὑπερηφάνοις
  choice: അഹങ്കാരികളെ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തിന്റെ ശക്തിയും അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀντιτάσσεται
  choice: എതിർക്കുന്നു
  rationale: ദൈവം അഹങ്കാരികൾക്കെതിരെ നിലകൊള്ളുന്നു എന്ന ശക്തമായ അർഥം അനാവശ്യ വ്യാഖ്യാനം കൂടാതെ നൽകുന്നു.
- source_word: ταπεινοῖς δὲ δίδωσιν χάριν
  choice: എന്നാൽ താഴ്മയുള്ളവർക്കു കൃപ നൽകുന്നു
  rationale: വിരുദ്ധസമാന്തരതയും ദൈവകൃപയുടെ ഭാഷയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: πρεσβυτέροις എന്നതിന്റെ സൂചന
  choice: സഭയിലെ മൂപ്പന്മാർ
  alternative: പ്രായംചെന്ന പുരുഷന്മാർ പൊതുവിൽ
  rationale: 5:1–4-ൽ സഭാമൂപ്പന്മാരെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ഇവിടെ അതേ അംഗീകൃത കൂട്ടത്തെയാണ് ഏറ്റവും സാധ്യതയോടെ ഉദ്ദേശിക്കുന്നത്. പ്രധാനപാഠത്തിൽ ‘മൂപ്പന്മാർ’ എന്ന രൂപം നിലനിർത്തി.
- issue: νεώτεροι എന്നതിലെ ലിംഗസൂചന
  choice: യുവാക്കളേ
  alternative: ചെറുപ്പക്കാരായവരേ / യുവജനങ്ങളേ
  rationale: ഗ്രീക്ക് രൂപം പുല്ലിംഗ ബഹുവചനമാണ്. അതിനാൽ ലിംഗനിരപേക്ഷമാക്കി മാറ്റാതെ മലയാളത്തിലെ സ്വാഭാവിക പുല്ലിംഗ സംബോധന ഉപയോഗിച്ചു; തുടർന്ന് വരുന്ന ‘നിങ്ങളെല്ലാവരും’ താഴ്മയെക്കുറിച്ചുള്ള ആഹ്വാനം മുഴുവൻ സമൂഹത്തിനുമാണെന്ന് വ്യക്തമാക്കുന്നു.
- issue: സദൃശവാക്യങ്ങൾ 3:34-ലെ ഉദ്ധരണിയുടെ ബലം
  choice: ദൈവം അഹങ്കാരികളെ എതിർക്കുന്നു
  alternative: ദൈവം അഹങ്കാരികളെ ചെറുക്കുന്നു / അവർക്കെതിരെ നിലകൊള്ളുന്നു
  rationale: ἀντιτάσσεται എന്ന പദത്തിന്റെ ശക്തമായ പ്രതിരോധാർഥം ‘എതിർക്കുന്നു’ സംരക്ഷിക്കുന്നു; ദൈവത്തിന്റെ നിലപാടിനെ മയപ്പെടുത്തുകയോ കൂടുതൽ വ്യാഖ്യാനിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രബോധനശൈലി. ‘കീഴടങ്ങുക’, ‘അണിഞ്ഞുകൊള്ളുക’ എന്നീ രൂപങ്ങൾ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതാണ്. വസ്ത്രധാരണരൂപകം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും കൂടുതൽ സാക്ഷാൽ അർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
