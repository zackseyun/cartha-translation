  to: അതിനാൽ, നിങ്ങളുടെ ഇടയിലുള്ള മൂപ്പന്മാരോട്, സഹമൂപ്പനും മശീഹായുടെ[a] കഷ്ടാനുഭവങ്ങളുടെ സാക്ഷിയും വെളിപ്പെടാനിരിക്കുന്ന മഹത്വത്തിൽ പങ്കാളിയുമായ ഞാൻ ആഹ്വാനം ചെയ്യുന്നു:[b]
