id: 1PE.5.1
reference: 1 Peter 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: ml
  text: അതിനാൽ, നിങ്ങളുടെ ഇടയിലുള്ള മൂപ്പന്മാരോട്, സഹമൂപ്പനും മശീഹായുടെ[a] കഷ്ടാനുഭവങ്ങളുടെ സാക്ഷിയും വെളിപ്പെടാനിരിക്കുന്ന മഹത്വത്തിൽ പങ്കാളിയുമായ ഞാൻ ആഹ്വാനം ചെയ്യുന്നു:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവിന്റെ കഷ്ടാനുഭവങ്ങളുടെ.’ Χριστός എന്ന ഗ്രീക്ക് സ്ഥാനനാമം ‘മശീഹാ’ എന്നും പരമ്പരാഗതമായി ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘വെളിപ്പെടാൻ പോകുന്ന മഹത്വത്തിൽ പങ്കാളിയായവനും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: മൂപ്പന്മാർ
  rationale: ഇവിടെ പ്രായമേറിയ പുരുഷന്മാരെയല്ല, സഭയിലെ നേതൃത്വചുമതലയുള്ളവരെയാണ് സൂചിപ്പിക്കുന്നത്. പിൽക്കാല സഭാവിഭാഗങ്ങളുടെ സാങ്കേതിക പദവി അടിച്ചേൽപ്പിക്കാതെ ഈ പ്രവർത്തനപരമായ അർഥം ‘മൂപ്പന്മാർ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനപരമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിലുള്ള
  rationale: വ്യക്തികളുടെ കൂട്ടത്തിനകത്തെ ബന്ധപരമായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παρακαλῶ
  choice: ഞാൻ അഭ്യർഥിക്കുന്നു
  rationale: സാധാരണ അപേക്ഷയെക്കാൾ ഗൗരവമുള്ള ഇടയപരമായ ആഹ്വാനം അറിയിക്കുന്നു; ‘പ്രബോധിപ്പിക്കുന്നു’ എന്നതിനേക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: συμπρεσβύτερος
  choice: സഹമൂപ്പൻ
  rationale: സംസാരിക്കുന്നവനും അതേ മൂപ്പൻസ്ഥാനത്തിൽ പങ്കാളിയാണെന്ന സംയുക്തപദത്തിന്റെ സഹപ്രവർത്തകഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: μάρτυς
  choice: സാക്ഷി
  rationale: ഇവിടെ മുഖ്യമായി സാക്ഷ്യം വഹിക്കുന്നയാളെയാണ് സൂചിപ്പിക്കുന്നത്; രക്തസാക്ഷി എന്ന അർഥം നിർബന്ധമായി വരുത്തുന്നില്ല.
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: മശീഹായുടെ കഷ്ടാനുഭവങ്ങളുടെ
  rationale: മശീഹാ അനുഭവിച്ച കഷ്ടങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ജനിറ്റീവ് ബന്ധം നിലനിർത്തുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹാ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തൻ എന്ന സ്ഥാനനാമത്തിന്റെ സജീവമായ അർഥം വഹിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κοινωνός
  choice: പങ്കാളി
  rationale: ഒന്നിൽ പങ്കുകൊള്ളുന്നവൻ എന്ന അർഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: വെളിപ്പെടാനിരിക്കുന്ന മഹത്ത്വത്തിൽ
  rationale: μέλλω സൂചിപ്പിക്കുന്ന ഭാവിപ്രതീക്ഷയും ἀποκαλύπτεσθαι എന്ന കർമണിപ്രയോഗവും നിലനിർത്തുന്നു; കൃത്യമായ കാലസമീപ്യം അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: Χριστοῦ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനനാമത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ ‘അഭിഷിക്തൻ’ എന്ന സ്ഥാനനാമാർഥം സജീവമാണ്. ‘മശീഹാ’ അത് വ്യക്തമാക്കുന്നു; സഭാപാരമ്പര്യത്തിൽ സുപരിചിതമായ ‘ക്രിസ്തു’ യഥാർഥ പകരമായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: μελλούσης ἀποκαλύπτεσθαι എന്ന പ്രയോഗത്തിന്റെ ഭാവികാലബലം
  choice: വെളിപ്പെടാനിരിക്കുന്ന
  alternative: വെളിപ്പെടാൻ പോകുന്ന
  rationale: വരാനിരിക്കുന്ന വെളിപ്പാടിന്റെ പ്രതീക്ഷ നിലനിർത്തുന്നു; അത് എത്ര പെട്ടെന്നാണെന്ന വിശാലമായ യുഗാന്ത്യചർച്ചയ്ക്ക് പരിഭാഷയിലൂടെ തീർപ്പുകൽപ്പിക്കുന്നില്ല.
- issue: μάρτυς കഷ്ടാനുഭവങ്ങളുടെ ദൃക്സാക്ഷിയെയോ സാക്ഷ്യം വഹിക്കുന്നയാളെയോ സൂചിപ്പിക്കുന്നുവോ എന്നത്
  choice: സാക്ഷി
  alternative: സാക്ഷ്യം വഹിക്കുന്നവൻ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ യഥാർഥ വ്യാപ്തി നിലനിർത്തി, നേരിട്ടുള്ള ദൃക്സാക്ഷിത്വം മാത്രമെന്ന വ്യാഖ്യാനം പരിഭാഷയിൽ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ നീണ്ട സ്വപരിചയവാക്യം കഴിയുന്നത്ര സ്വാഭാവികമായി നിലനിർത്തി; അടുത്ത വാക്യത്തിലേക്കുള്ള ആഹ്വാനത്തെ സൂചിപ്പിക്കാൻ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
