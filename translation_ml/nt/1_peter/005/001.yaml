  source_fidelity: 'ഗ്രീക്ക് വാക്യത്തിന്റെ പ്രധാന ഘടകങ്ങൾ ശരിയായി പ്രതിഫലിക്കുന്നു: സഭാനേതാക്കളായ ‘മൂപ്പന്മാർ,’ സംസാരിക്കുന്നവന്റെ ‘സഹമൂപ്പൻ’ എന്ന സ്വപരിചയം, മശീഹായുടെ കഷ്ടാനുഭവങ്ങളോടുള്ള സാക്ഷിത്വം, വരാനിരിക്കുന്ന വെളിപ്പാടിലെ മഹത്വത്തിൽ പങ്കാളിത്തം എന്നിവ നിലനിൽക്കുന്നു. μελλούσης ἀποκαλύπτεσθαι എന്ന പ്രയോഗത്തിലെ ഭാവിപ്രതീക്ഷ ‘വെളിപ്പെടാനിരിക്കുന്ന’ എന്നതിൽ യോജ്യമായി സൂക്ഷിച്ചിട്ടുണ്ട്.'
  naturalness: വാക്യക്രമം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘മഹത്വം’ എന്ന സാധാരണ അക്ഷരവിന്യാസവും ‘ആഹ്വാനം ചെയ്യുന്നു’ എന്ന ഇടയപരമായ പ്രബോധനബലമുള്ള ക്രിയയും കൂടുതൽ യോജിച്ചതാണ്.
  terminology: ‘മൂപ്പന്മാർ,’ ‘സഹമൂപ്പൻ,’ ‘സാക്ഷി,’ ‘മശീഹാ,’ ‘പങ്കാളി’ എന്നിവ സന്ദർഭത്തിനും പദ്ധതിയുടെ പദനയത്തിനും യോജിക്കുന്നു. ‘മശീഹാ’യ്ക്കുള്ള പരമ്പരാഗത പകരമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
