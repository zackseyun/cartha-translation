id: 1PE.5.2
reference: 1 Peter 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിലുള്ള ദൈവത്തിന്റെ ആട്ടിൻകൂട്ടത്തെ മേയിക്കുവിൻ; ദൈവത്തിന് അനുസൃതമായി[a], നിർബന്ധത്താലല്ല മറിച്ച് സ്വമനസ്സോടെ മേൽനോട്ടം വഹിച്ചുകൊണ്ട്; നിന്ദ്യമായ ലാഭത്തിനായല്ല, മറിച്ച് ഉത്സാഹപൂർവം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവഹിതത്തിന് അനുസരിച്ച്” / “ദൈവം ആഗ്രഹിക്കുന്നതുപോലെ.”
    reason: κατὰ θεόν എന്ന സംക്ഷിപ്തമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൂടുതൽ വ്യാഖ്യാനാത്മകവുമായ സാധ്യതകൾ അറിയിക്കാൻ.
lexical_decisions:
- source_word: ποιμάνατε
  choice: മേയിക്കുവിൻ
  rationale: മൂപ്പന്മാരോടുള്ള ബഹുവചന കല്പനയും ഇടയപരിപാലനത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു; ‘പാസ്റ്ററായി പ്രവർത്തിക്കുക’ പോലുള്ള പിൽക്കാല ഔദ്യോഗിക പദവി ക്രിയയിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: നിങ്ങളുടെ ഇടയിലുള്ള ദൈവത്തിന്റെ ആട്ടിൻകൂട്ടത്തെ
  rationale: ποίμνιον എന്ന ആട്ടിൻകൂട്ടരൂപകവും കൂട്ടം ദൈവത്തിന്റേതാണെന്ന ഉടമസ്ഥതാസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു. ἐν ὑμῖν എന്നത് മൂപ്പന്മാരുടെ ഉടമസ്ഥതയെന്നല്ല, അവരുടെ ഇടയിലുള്ള കൂട്ടമെന്ന പ്രാദേശിക-ബന്ധപരമായ അർഥത്തിലാണ് നൽകിയിരിക്കുന്നത്.
- source_word: ἐπισκοποῦντες
  choice: മേൽനോട്ടം വഹിച്ചുകൊണ്ട്
  rationale: മേയിക്കൽ എങ്ങനെ നിർവഹിക്കണമെന്നു വിശദീകരിക്കുന്ന കൃതന്തത്തിന്റെ പ്രവർത്തനപരമായ അർഥം നൽകുന്നു; പ്രത്യേക സഭാപദവിയുടെ പേരായി മാറ്റുന്നില്ല.
- source_word: μὴ ἀναγκαστῶς
  choice: നിർബന്ധത്താലല്ല
  rationale: സമ്മർദമോ നിർബന്ധിതാവസ്ഥയോ മൂലം പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള സ്വമനസ്സോടെയുള്ള സേവനവുമായി ഉള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀλλὰ ἑκουσίως
  choice: മനസ്സോടെ
  rationale: നിർബന്ധത്തിനു വിപരീതമായ സ്വമേധയുള്ള സന്നദ്ധത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: κατὰ θεόν
  choice: ദൈവത്തിന് അനുസൃതമായി
  rationale: ദൈവഹിതം, ദൈവത്തിന്റെ മാനദണ്ഡം, ദൈവം ആഗ്രഹിക്കുന്ന വിധം എന്നിവയിൽ ഒന്നിലേക്ക് മാത്രം അർഥം ചുരുക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: നീചലാഭത്തിനുവേണ്ടിയല്ല
  rationale: ലാഭാന്വേഷണത്തിന്റെ നിന്ദ്യവും അപമാനകരവുമായ സ്വഭാവം ചുരുക്കമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀλλὰ προθύμως
  choice: ഉത്സാഹപൂർവം
  rationale: സന്നദ്ധതയോടൊപ്പം तत്പരതയും ഉത്സാഹവും സൂചിപ്പിക്കുന്നു; മുൻപത്തെ ἑκουσίως എന്നതിന് നൽകിയ ‘മനസ്സോടെ’ എന്ന പരിഭാഷയിൽനിന്നുള്ള വ്യത്യാസവും കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐπισκοποῦντες എന്നത് സാങ്കേതിക സഭാപദവിയായി പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘മേൽനോട്ടം വഹിച്ചുകൊണ്ട്’ എന്ന പ്രവർത്തനവിവരണമായി നൽകി.
  alternative: ‘മേൽവിചാരകന്മാരായി സേവിച്ചുകൊണ്ട്’ അല്ലെങ്കിൽ ‘ബിഷപ്പുമാരായി പ്രവർത്തിച്ചുകൊണ്ട്’.
  rationale: സന്ദർഭത്തിൽ ഈ കൃതന്തം മൂപ്പന്മാർ ചെയ്യേണ്ട പ്രവർത്തനത്തെയാണ് വിവരിക്കുന്നത്; പിൽക്കാലത്തെ സ്ഥിരമായ സഭാഭരണപദവി നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക സഭാഭരണരീതി വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ മേൽനോട്ടത്തിന്റെ ആശയം സംരക്ഷിക്കുന്നു.
- issue: κατὰ θεόν എത്രത്തോളം വ്യാഖ്യാനിച്ചു വ്യക്തമാക്കണം
  choice: പ്രധാനവാക്യത്തിൽ ‘ദൈവത്തിന് അനുസൃതമായി’ എന്നു നൽകി, കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപങ്ങൾ അടിക്കുറിപ്പിൽ ചേർത്തു.
  alternative: ‘ദൈവഹിതത്തിന് അനുസരിച്ച്’ അല്ലെങ്കിൽ ‘ദൈവം ആഗ്രഹിക്കുന്നതുപോലെ’.
  rationale: ഈ പ്രയോഗം ദൈവഹിതത്തെയോ ദൈവത്തിന്റെ മാനദണ്ഡത്തെയോ ദൈവം ആഗ്രഹിക്കുന്ന രീതിയെയോ സൂചിപ്പിക്കാം. ഒരു അർഥം മാത്രം ഉറപ്പിക്കാതെ അതിന്റെ യഥാർഥമായ ദൈവശാസ്ത്രപരവും അർഥപരവുമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച മാന്യമായ ശൈലി. ‘മേയിക്കുവിൻ’ എന്ന രൂപം ഇടയരൂപകം കൃത്യമായി നിലനിർത്തുന്നതിനായി സ്വീകരിച്ചു; ശേഷിക്കുന്ന വാക്യഘടന സ്വാഭാവികമായ ആധുനിക പ്രയോഗത്തിലാക്കി. അടിക്കുറിപ്പ് സൂചിക [a] പ്രധാനവാക്യത്തിലെ ബന്ധപ്പെട്ട പ്രയോഗത്തിനു പിന്നാലെ നൽകിയിട്ടുണ്ട്.
