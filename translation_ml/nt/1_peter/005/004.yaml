id: 1PE.5.4
reference: 1 Peter 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ φανερωθέντος τοῦ ἀρχιποίμενος κομιεῖσθε τὸν ἀμαράντινον τῆς δόξης στέφανον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: ml
  text: മുഖ്യ ഇടയൻ വെളിപ്പെടുമ്പോൾ[a], മഹത്ത്വത്തിന്റെ വാടാത്ത കിരീടം നിങ്ങൾക്കു ലഭിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രത്യക്ഷനാകുമ്പോൾ.”
    reason: alternative_reading
  - marker: b
    text: ഇവിടത്തെ ഗ്രീക്ക് പദം രാജകിരീടത്തെ മാത്രമല്ല, വിജയത്തിന്റെയോ ബഹുമതിയുടെയോ സമ്മാനമായി നൽകുന്ന മാലക്കിരീടത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: വെളിപ്പെടുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിലുള്ള എയോറിസ്റ്റ് പാസീവ് പാർട്ടിസിപ്പിളിന്റെ കാലസൂചനയും പാസീവ് ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. ‘പ്രത്യക്ഷനാകുമ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: ἀρχιποίμενος
  choice: മുഖ്യ ഇടയൻ
  rationale: പ്രധാനനായ അഥവാ പരമനായ ഇടയൻ എന്ന സംയുക്തപദത്തിന്റെ അർഥം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κομιεῖσθε
  choice: നിങ്ങൾക്കു ലഭിക്കും
  rationale: പ്രതിഫലമായി ലഭിക്കുന്നതിനെയോ സ്വീകരിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്ന ഭാവികാല മധ്യമക്രിയയ്ക്ക് സന്ദർഭോചിതമായ സ്വാഭാവിക മലയാളം.
- source_word: ἀμαράντινον
  choice: വാടാത്ത
  rationale: പുഷ്പമാലയുടെ ദൃശ്യബിംബത്തോട് ചേർന്ന്, പുതുമ നഷ്ടപ്പെടാത്തതും വാടിപ്പോകാത്തതുമായ സ്വഭാവം കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῆς δόξης
  choice: മഹത്ത്വ
  rationale: ‘മഹത്ത്വത്തിന്റെ’ എന്ന ഗ്രീക്ക് ജനിറ്റീവിന്റെ അർഥം സംയുക്തപ്രയോഗത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; വെറും ‘മഹത്തായ’ എന്ന ഗുണവിശേഷണമായി ചുരുക്കുന്നില്ല.
- source_word: στέφανον
  choice: കിരീടം
  rationale: ബഹുമതിയുടെയോ വിജയത്തിന്റെയോ അടയാളമായി നൽകുന്ന മാലക്കിരീടത്തെ സൂചിപ്പിക്കുന്നു. രാജകിരീടം മാത്രമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: ‘മുഖ്യ ഇടയൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന ക്രിസ്തുസംബന്ധിയായ സ്ഥാനനാമം; മുഖ്യപാഠത്തിൽ പേര് വിശദീകരിച്ചുചേർത്തിട്ടില്ല
  alternative: ‘മുഖ്യ ഇടയനായ യേശു’ എന്ന് വിപുലീകരിക്കുക
  rationale: ഇടയസങ്കല്പവും ഭാവിയിലെ വെളിപ്പെടലും യേശുവിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; എങ്കിലും മൂലപാഠത്തിൽ ഇല്ലാത്ത പേര് ചേർക്കാതെ സ്ഥാനനാമത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- issue: അന്ത്യകാല വെളിപ്പെടലിന്റെ ഭാഷ
  choice: വെളിപ്പെടുമ്പോൾ
  alternative: പ്രത്യക്ഷനാകുമ്പോൾ
  rationale: പാസീവ് രൂപവും വെളിപ്പെടുത്തൽ/പ്രകടനം എന്ന ആശയവും നിലനിർത്തുന്നു; സംഭവത്തിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഇടയൻ, വാടാത്ത, മഹത്ത്വകിരീടം എന്നീ പദങ്ങൾ മൂലത്തിലെ ഇടയ-പ്രതിഫല ദൃശ്യബിംബങ്ങൾ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
