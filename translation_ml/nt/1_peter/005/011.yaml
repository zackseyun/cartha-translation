reference: 1 Peter 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀αὐτῷ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/011.yaml
  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: ml
  text: അവനു എന്നെന്നേക്കും ആധിപത്യം ഉണ്ടായിരിക്കട്ടെ.[a] ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നെന്നേക്കുമുള്ള ആധിപത്യം അവനുള്ളതാണ്.’ അക്ഷരാർഥത്തിൽ കാലപ്രയോഗം ‘യുഗങ്ങളുടെ യുഗങ്ങളിലേക്ക്’ എന്നാണ്.
    reason: ഗ്രീക്കിലെ ക്രിയാരഹിത ഘടനയും കാലപ്രയോഗത്തിന്റെ അക്ഷരാർഥവും സംരക്ഷിക്കുന്ന പരിഭാഷാവികൽപം.
lexical_decisions:
- source_word: αὐτῷ
  choice: അവനു
  rationale: മുൻസന്ദർഭത്തിലെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന ദത്തിവിഭക്തി സർവനാമം. സ്തുതിവാക്യത്തിന്റെ ഘടന നിലനിർത്താൻ ‘അവനു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: κράτος
  choice: ആധിപത്യം
  rationale: ഇവിടെ വെറും ബലത്തേക്കാൾ ഭരണപരമായ പരമാധികാരവും ശക്തിയും സൂചിപ്പിക്കുന്നതിനാൽ ‘ആധിപത്യം’ യോജിക്കുന്നു.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യത്തെ ഊന്നിപ്പറയുന്ന പതിവ് സ്തുതിപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘എന്നെന്നേക്കും’ എന്നു നൽകി.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: ആരാധനാപരമായ ഉറപ്പിക്കൽ നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ലിപ്യന്തരണം.
theological_decisions:
- issue: സ്തുതിവാക്യത്തിലെ ലുപ്തമായ ക്രിയാപദം
  choice: അവനു ... ആധിപത്യം ഉണ്ടായിരിക്കട്ടെ
  alternative: ആധിപത്യം അവനുള്ളതാണ്
  rationale: ഗ്രീക്കിൽ ക്രിയാപദമില്ല. ‘ഉണ്ടായിരിക്കട്ടെ’ എന്ന പൂരണം സ്തുതിവാക്യത്തിന്റെ ആശംസാത്മകവും ആരാധനാപരവുമായ ഭാവം നിലനിർത്തുന്നു; എന്നാൽ പ്രസ്താവനാത്മകമായ മറ്റൊരു വായന സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സ്തുതിവാക്യശൈലി. പരമ്പരാഗതമായി പരിചിതമായ ‘ആമേൻ’ നിലനിർത്തി; അപൂർവമായ അക്ഷരാർഥപ്രയോഗം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ നൽകി.
