  naturalness: ‘അവനു എന്നെന്നേക്കും ആധിപത്യം ഉണ്ടായിരിക്കട്ടെ. ആമേൻ.’ ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും ആരാധനാപരമായ സ്തുതിവാക്യത്തിനു സ്വാഭാവികവുമായ പ്രയോഗമാണ്. ‘അവനു’യും ‘ആധിപത്യം’യും ഈ രജിസ്റ്ററിൽ സ്വീകാര്യമാണ്.
