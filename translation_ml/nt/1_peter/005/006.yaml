id: 1PE.5.6
reference: 1 Peter 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: ml
  text: അതുകൊണ്ട്, ദൈവത്തിന്റെ ശക്തമായ കൈക്കീഴിൽ നിങ്ങളെത്തന്നെ താഴ്ത്തുവിൻ[a], തക്കസമയത്ത് അവൻ നിങ്ങളെ ഉയർത്തേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “താഴ്ത്തപ്പെടുവിൻ … തക്കസമയത്ത് അവൻ നിങ്ങളെ ഉയർത്തേണ്ടതിന്.” ഗ്രീക്കിലെ ആജ്ഞാരൂപം രൂപത്തിൽ നിഷ്ക്രിയരൂപത്തിലാണെങ്കിലും, ഇവിടെ സാധാരണയായി “നിങ്ങളെത്തന്നെ താഴ്ത്തുവിൻ” എന്ന ആത്മനിർദ്ദേശക അർഥത്തിലാണ് മനസ്സിലാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: നിങ്ങളെത്തന്നെ താഴ്ത്തുവിൻ
  rationale: രൂപത്തിൽ ഇത് ഭൂതകാലസൂചകമായ നിഷ്ക്രിയ ആജ്ഞാരൂപമാണെങ്കിലും, ഈ പ്രബോധനസന്ദർഭത്തിൽ ആത്മനിർദ്ദേശക അർഥം സ്വാഭാവികമാണ്. മലയാളത്തിൽ ഈ പ്രയോഗം കല്പനയുടെ ശക്തിയും ദൈവത്തോടുള്ള കീഴടങ്ങലും വ്യക്തമായി നൽകുന്നു; നിഷ്ക്രിയരൂപത്തിലെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ, അഹങ്കാരികളെ ദൈവം എതിർക്കുകയും താഴ്മയുള്ളവർക്ക് കൃപ നൽകുകയും ചെയ്യുന്നു എന്ന പ്രസ്താവനയിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കുന്നു.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα
  choice: ശക്തമായ കൈക്കീഴിൽ
  rationale: ദൈവത്തിന്റെ പ്രബലമായ പ്രവർത്തനവും അധികാരവും സൂചിപ്പിക്കുന്ന പഴയനിയമ പശ്ചാത്തലമുള്ള രൂപകത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ആ കൈ ആരുടേതാണെന്ന് വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള ഷഷ്ഠീവിഭക്തി പ്രയോഗം.
- source_word: ἵνα
  choice: ഉയർത്തേണ്ടതിനാണത്
  rationale: ഉദ്ദേശ്യത്തെയോ ലക്ഷ്യഫലത്തെയോ സൂചിപ്പിക്കുന്ന ἵναയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑμᾶς ὑψώσῃ
  choice: അവൻ നിങ്ങളെ ഉയർത്തേണ്ടതിന്
  rationale: മുൻഖണ്ഡത്തിൽനിന്ന് മനസ്സിലാകുന്ന കർത്താവ് ദൈവമാണ്. 'ഉയർത്തുക' ആദരത്തിലേക്കോ നീതീകരണത്തിലേക്കോ ഉയർത്തുന്ന അർഥം വഹിക്കുകയും ഭൗതികമായി ഉയർത്തുന്നതിൽ മാത്രം ഒതുങ്ങാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν καιρῷ
  choice: തക്കസമയത്ത്
  rationale: വെറും കാലക്രമത്തിലെ ഒരു സമയമല്ല, അനുയോജ്യമായോ നിശ്ചയിക്കപ്പെട്ടതായോ ഉള്ള സമയമാണ് καιρός സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: Ταπεινώθητε എന്നതിലെ വാച്യവും പ്രവർത്തകത്വവും
  choice: '''നിങ്ങളെത്തന്നെ താഴ്ത്തുവിൻ'' എന്ന ആത്മനിർദ്ദേശക അർഥം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; ദൈവത്തിന്റെ ശക്തമായ കൈക്കീഴിൽ എന്ന പ്രയോഗം ഇത് ദൈവത്തോടുള്ള കീഴടങ്ങലാണെന്ന് വ്യക്തമാക്കുന്നു.'
  alternative: '''താഴ്ത്തപ്പെടുവിൻ'''
  rationale: മനുഷ്യന്റെ ഉത്തരവാദിത്വവും പിന്നീട് ഉയർത്തുന്നവൻ ദൈവമാണെന്ന ദൈവിക പ്രവർത്തകത്വവും ഒരുപോലെ നിലനിർത്തുന്നു. ഗ്രീക്ക് രൂപത്തിലെ യഥാർഥമായ നിഷ്ക്രിയസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രബോധനശൈലി. 'ശക്തമായ കൈ' എന്ന ബൈബിൾരൂപകം സംരക്ഷിച്ചു. ബഹുവചന ആജ്ഞയ്ക്ക് ഗൗരവമുള്ള 'താഴ്ത്തുവിൻ' ഉപയോഗിച്ചു; അപൂർവമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
