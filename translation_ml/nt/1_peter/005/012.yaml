id: 1PE.5.12
reference: 1 Peter 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: ml
  text: ഞാൻ വിശ്വസ്തനായ സഹോദരനെന്നു കരുതുന്ന സില്വാനൊസ് മുഖാന്തരം നിങ്ങൾക്കു ചുരുക്കമായി എഴുതിയിരിക്കുന്നു; നിങ്ങളെ പ്രബോധിപ്പിക്കാനും ഇതാണ് ദൈവത്തിന്റെ യഥാർഥ കൃപ എന്നു സാക്ഷ്യപ്പെടുത്താനും. അതിൽ ഉറച്ചുനിൽക്കുവിൻ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അതിൽ നിങ്ങൾ നിലകൊള്ളുന്നു’ എന്നു വായിക്കുന്നു.
    reason: στῆτε എന്ന ആജ്ഞാരൂപത്തിനുപകരം സൂചനാരൂപത്തെ പിന്തുണയ്ക്കുന്ന പാഠഭേദം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: സില്വാനൊസ് മുഖാന്തരം
  rationale: ജനിറ്റീവിനോടുകൂടിയ διά ഇവിടെ ഇടനിലയെയോ പ്രവർത്തകമാധ്യമത്തെയോ സൂചിപ്പിക്കുന്നു. കത്ത് എത്തിച്ചയാൾ, എഴുത്തുസഹായി എന്നിവയിൽ ഏതെങ്കിലും ഒരു പങ്ക് നിർബന്ധിച്ച് നിശ്ചയിക്കാതെ ഗ്രീക്കിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: Σιλουανοῦ
  choice: സില്വാനൊസ്
  rationale: ഗ്രീക്കിലുള്ള വ്യക്തിനാമരൂപം നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു; ബന്ധപ്പെട്ട ചുരുക്കരൂപമായ ‘ശീലാസ്’ ഇവിടെ ഉപയോഗിക്കുന്നില്ല.
- source_word: τοῦ πιστοῦ ἀδελφοῦ
  choice: വിശ്വസ്തനായ സഹോദരൻ
  rationale: πιστός എന്നതിന്റെ വിശ്വസ്തൻ/ആശ്രയിക്കാവുന്നവൻ എന്നീ അർഥങ്ങളിൽ, സഹപ്രവർത്തകനെ പ്രശംസിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘വിശ്വസ്തനായ’ സ്വാഭാവികമാണ്. നിർദ്ദിഷ്ട പുരുഷനെയാണ് ἀδελφός സൂചിപ്പിക്കുന്നത്.
- source_word: ὡς λογίζομαι
  choice: എന്ന് ഞാൻ കരുതുന്ന
  rationale: സില്വാനൊസിനെക്കുറിച്ചുള്ള എഴുത്തുകാരന്റെ വ്യക്തിപരമായ വിലയിരുത്തൽ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δι’ ὀλίγων
  choice: ചുരുക്കമായി
  rationale: ‘കുറച്ചു വാക്കുകളിൽ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തമായി എഴുതുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔγραψα
  choice: ഞാൻ ... എഴുതിയിരിക്കുന്നു
  rationale: കത്തുകളുടെ അവസാനഭാഗത്ത് കാണുന്ന epistolary aorist സ്വീകർത്താക്കളുടെ കാഴ്ചപ്പാടിൽ മലയാളത്തിലെ പൂർത്തികാലരൂപത്തിൽ സ്വാഭാവികമായി വരുന്നു.
- source_word: παρακαλῶν
  choice: പ്രബോധിപ്പിക്കുകയും
  rationale: ഉപദേശിക്കുകയും ഉത്സാഹിപ്പിക്കുകയും ആഹ്വാനം ചെയ്യുകയും ചെയ്യുന്ന παρακαλέωയുടെ ഗൗരവമുള്ള പ്രേരണാത്മകശക്തി സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: ἐπιμαρτυρῶν
  choice: സാക്ഷ്യപ്പെടുത്തുകയും
  rationale: വെറും സ്ഥിരീകരണത്തെക്കാൾ ശക്തമായ, സാക്ഷിയായി ഉറപ്പുനൽകുന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: ഇതാണ് ദൈവത്തിന്റെ യഥാർഥ കൃപ
  rationale: ταύτην എന്നതിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കാതെ, ἀληθῆ എന്ന വിശേഷണവും τοῦ θεοῦ എന്ന ബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἰς ἣν στῆτε
  choice: അതിൽ ഉറച്ചുനിൽക്കുവിൻ
  rationale: στῆτε എന്ന ആജ്ഞാരൂപത്തിന്റെ ദൃഢത ‘ഉറച്ചുനിൽക്കുവിൻ’ നൽകുന്നു. ‘അതിൽ’ മുമ്പുള്ള കൃപയിലേക്കാണ് സൂചിപ്പിക്കുന്നത്; εἰς ഇവിടെ ആ കൃപയുടെ മണ്ഡലത്തിൽ നിലനിൽക്കുക എന്ന ആശയത്തോടെ മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: ‘ഇതാണ്’ എന്നതിലെ ‘ഇത്’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: പത്രത്തിൽ എഴുതിയ സന്ദേശത്തെയും പ്രബോധനത്തെയും പൊതുവായി സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘ഇതാണ്’ എന്ന് നിലനിർത്തി.
  alternative: വായനക്കാരുടെ കൃപാനുഭവമോ സില്വാനൊസ് നൽകിയ സുവിശേഷസന്ദേശമോ മാത്രമായി ഇതിനെ പരിമിതപ്പെടുത്തുക.
  rationale: എഴുതുക, പ്രബോധിപ്പിക്കുക, സാക്ഷ്യപ്പെടുത്തുക എന്നീ അടുത്തുള്ള ഘടകങ്ങൾ പത്രത്തിന്റെ ഉള്ളടക്കത്തിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും സൂചനയുടെ കൃത്യപരിധി വാചകം നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: അവസാനത്തെ στῆτε എന്ന രൂപത്തിന്റെ ഭാവം
  choice: SBLGNT പാഠമനുസരിച്ച് ‘ഉറച്ചുനിൽക്കുവിൻ’ എന്ന ആജ്ഞാരൂപം.
  alternative: പാഠഭേദമനുസരിച്ച് ‘അതിൽ നിങ്ങൾ നിലകൊള്ളുന്നു’ എന്ന സൂചനാരൂപം.
  rationale: നൽകിയിരിക്കുന്ന വിമർശനപാഠം ആജ്ഞാരൂപത്തെ പിന്തുടരുന്നു; പ്രധാന പാഠം അതനുസരിച്ചും മറ്റൊരു വായന അടിക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുഖാന്തരം’, ‘പ്രബോധിപ്പിക്കുക’, ‘സാക്ഷ്യപ്പെടുത്തുക’, ‘ഉറച്ചുനിൽക്കുക’ എന്നിവ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ബൈബിൾസന്ദർഭോചിത പദങ്ങളാണ്. ‘വിശ്വസ്തനായ സഹോദരനെന്ന് ഞാൻ കരുതുന്ന’ എന്ന ഘടന parenthetical വിലയിരുത്തൽ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
