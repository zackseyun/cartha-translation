  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: ml
  text: നിങ്ങളുടെ പരിപാലനത്തിന് ഏല്പിക്കപ്പെട്ടവരുടെമേൽ ആധിപത്യം പുലർത്താതെ, മറിച്ച് ആട്ടിൻകൂട്ടത്തിന് മാതൃകകളായിത്തീരുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിങ്ങളുടെ ഓഹരികളുടെമേൽ ആധിപത്യം പുലർത്താതെ.’ ഗ്രീക്കിൽ പദശഃ ‘നറുക്കുകൾ/ഓഹരികൾ’ എന്നാണ്; ഓരോ മൂപ്പന്റെയും പരിപാലനത്തിന് ഏല്പിക്കപ്പെട്ട ദൈവത്തിന്റെ ആട്ടിൻകൂട്ടത്തിലെ വിഭാഗങ്ങളെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: ആധിപത്യം പുലർത്താതെ
  rationale: മുൻവാക്യത്തിലെ നിഷേധാത്മക നിർദേശത്തെ തുടർന്നുകൊണ്ട്, ശുശ്രൂഷ നിർവഹിക്കരുതാത്ത രീതിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ക്രിയാവിശേഷണരൂപത്തിലുള്ള നിഷേധം സ്വാഭാവികമാണ്.
- source_word: κατακυριεύοντες
  choice: ആധിപത്യം പുലർത്താതെ
  rationale: നിയമാനുസൃതമായ എല്ലാ നേതൃത്വത്തെയും അല്ല, അധികാരം അമിതമായോ അടിച്ചമർത്തുന്ന വിധത്തിലോ പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: τῶν κλήρων
  choice: നിങ്ങളുടെ പരിപാലനത്തിന് ഏല്പിക്കപ്പെട്ടവർ
  rationale: പദശഃ ‘നറുക്കുകൾ/ഓഹരികൾ’ എന്നാണെങ്കിലും, ഈ ഇടയപരിപാലനസന്ദർഭത്തിൽ ഓരോ മൂപ്പന്റെയും ചുമതലയിൽ ഏല്പിക്കപ്പെട്ട ദൈവജനത്തിന്റെ വിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ഉടമസ്ഥതയല്ല, ഉത്തരവാദിത്വമാണ് ഈ വിവർത്തനം വ്യക്തമാക്കുന്നത്; പദശഃ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀλλὰ
  choice: മറിച്ച്
  rationale: നിരോധിക്കപ്പെട്ട അധികാരപ്രയോഗത്തിനും ആവശ്യപ്പെടുന്ന മാതൃകാപരമായ ജീവിതത്തിനുമിടയിലെ ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: τύποι
  choice: മാതൃകകൾ
  rationale: മറ്റുള്ളവർ അനുകരിക്കേണ്ട ദൃഷ്ടാന്തങ്ങളെയോ മാതൃകകളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: γινόμενοι
  choice: ആയിത്തീരുക
  rationale: സ്ഥിരമായ ‘ആയിരിക്കുക’ എന്നതിലുപരി പ്രവൃത്തിയിലൂടെ മാതൃകയായി രൂപപ്പെടുന്ന ചലനാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: τοῦ ποιμνίου
  choice: ആട്ടിൻകൂട്ടം
  rationale: വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായ ഇടയരൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സഭാനേതൃത്വവുമായി ബന്ധപ്പെട്ട് κλήρων എന്നതിന്റെ അർഥം
  choice: മൂപ്പന്മാരുടെ പരിപാലനത്തിന് ഏല്പിക്കപ്പെട്ട വിശ്വാസികളെ സൂചിപ്പിക്കുന്നു; അവരുടെ ഉടമസ്ഥതയിലുള്ള ആളുകളെയല്ല
  alternative: ‘നറുക്കുകൾ/ഓഹരികൾ’ എന്ന് വിശദീകരണമില്ലാതെ പദശഃ നൽകുക; അല്ലെങ്കിൽ മൂപ്പന്മാരുടെ അധികാരമേഖലകൾ എന്നു വായിക്കുക
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭം ദൈവത്തിന്റെ ആട്ടിൻകൂട്ടത്തെ മേയിക്കുന്ന മൂപ്പന്മാരെ അഭിസംബോധന ചെയ്യുന്നു. ‘പരിപാലനത്തിന് ഏല്പിക്കപ്പെട്ടവർ’ എന്നത് ഉടമസ്ഥതയ്ക്കുപകരം കാര്യവിചാരകത്വവും ഉത്തരവാദിത്വവും പ്രകടമാക്കുന്നു; മൂലപദത്തിന്റെ രൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: κατακυριεύοντες എന്നതിന്റെ വ്യാപ്തി
  choice: അടിച്ചമർത്തുന്നതോ അധികാരദുർവിനിയോഗപരമോ ആയ ആധിപത്യം നിരോധിക്കുന്നു; എല്ലാ നേതൃത്വപ്രയോഗവും അല്ല
  alternative: മൂപ്പന്മാരുടെ ഏതൊരു ഭരണപരമായ പങ്കും നിരോധിക്കുന്നു എന്നു വായിക്കുക
  rationale: ക്രിയയുടെ അർഥം അമിതവും മേൽക്കോയ്മാഭാവമുള്ളതുമായ അധികാരപ്രയോഗമാണ്. വാക്യം നേതൃത്വത്തെ തന്നെയല്ല, അതിന്റെ ദുരുപയോഗത്തെ മാതൃകാപരമായ നേതൃത്വവുമായി വിപരീതപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സഭാ-ഇടയപരിപാലന ഭാഷ ഉപയോഗിച്ചു. ‘മാതൃകകളായിത്തീരുക’ എന്ന പ്രയോഗം γινόμενοι എന്നതിന്റെ ചലനാത്മക ഭാവം നിലനിർത്തുന്നു. പ്രധാനവാചകത്തിൽ വ്യാഖ്യാനപരമായി വ്യക്തമായ രൂപവും അടിക്കുറിപ്പിൽ κλήρων എന്നതിന്റെ പദശഃ അർഥവും നൽകിയിരിക്കുന്നു.
