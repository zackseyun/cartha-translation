id: 1PE.5.10
reference: 1 Peter 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: ml
  text: എന്നാൽ, മശീഹയിൽ[a] തന്റെ നിത്യ മഹത്വത്തിലേക്കു നിങ്ങളെ വിളിച്ച സകല കൃപയുടെയും ദൈവം, നിങ്ങൾ അല്പകാലം കഷ്ടം അനുഭവിച്ചശേഷം, താൻ തന്നെ നിങ്ങളെ പുനഃസ്ഥാപിക്കും[b], ഉറപ്പിക്കും, ശക്തിപ്പെടുത്തും, ഉറച്ച അടിത്തറയിൽ സ്ഥാപിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ക്രിസ്തുവിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് Χριστός എന്ന പദവി “മശീഹ” എന്നും, പരമ്പരാഗതമായി “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: “പൂർണരാക്കും” അല്ലെങ്കിൽ “ശരിയായ നിലയിലാക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ക്രിയയിൽ ഒരു വസ്തുവിനെ അതിന്റെ ശരിയായ അവസ്ഥയിലേക്കു പുനഃസ്ഥാപിക്കുന്ന അർത്ഥവും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
  - marker: c
    text: “അടിത്തറയിടും” അല്ലെങ്കിൽ “ഉറച്ച അടിത്തറയിൽ നിർത്തും” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയിൽ അടിത്തറയുടെ ദൃശ്യരൂപമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: സകല കൃപയുടെയും
  rationale: സമഗ്രത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: καλέσας
  choice: വിളിച്ച
  rationale: എയോറിസ്റ്റ് പങ്കുപദത്തെ ലളിതമായ ഭൂതകാലബന്ധമായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത അധിക കാലഭാവം ചേർക്കുന്നില്ല.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: തന്റെ നിത്യമായ മഹത്ത്വത്തിലേക്ക്
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചന സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ ലക്ഷ്യത്തിലേക്കുള്ള വിളി സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ വാഗ്ദത്ത രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയാണ്; 'മശീഹ' ആ അർത്ഥവും 'ἐν' എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ὀλίγον παθόντας
  choice: അല്പകാലം കഷ്ടം അനുഭവിച്ചശേഷം
  rationale: ὀλίγον എന്നത് കാലപരമായി മനസ്സിലാക്കി, കഷ്ടത്തിന്റെ പരിമിത ദൈർഘ്യവും തുടർന്നുള്ള ദൈവിക പ്രവർത്തനവും വ്യക്തമാക്കുന്നു.
- source_word: αὐτὸς
  choice: ദൈവംതന്നെ
  rationale: ദൈവം വ്യക്തിപരമായി പ്രവർത്തിക്കുമെന്ന ഊന്നൽ മലയാളത്തിൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: καταρτίσει
  choice: പുനഃസ്ഥാപിക്കുകയും
  rationale: കേടുപാടിനുശേഷം ശരിയായ നിലയിലാക്കുക എന്ന അർത്ഥം സന്ദർഭത്തിൽ നന്നായി നൽകുന്നു; 'പൂർണരാക്കുക' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: στηρίξει
  choice: ഉറപ്പിക്കുകയും
  rationale: സ്ഥിരതയും ദൃഢതയും സൂചിപ്പിക്കുന്ന ലളിതമായ സമകാലിക മലയാളം.
- source_word: σθενώσει
  choice: ശക്തിപ്പെടുത്തുകയും
  rationale: അയൽക്രിയകളിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് ശക്തനാക്കുക എന്ന നേരിട്ടുള്ള അർത്ഥം നൽകുന്നു.
- source_word: θεμελιώσει
  choice: ഉറച്ച അടിത്തറയിൽ നിർത്തുകയും
  rationale: ഗ്രീക്ക് ക്രിയയിലെ അടിത്തറയുടെ ദൃശ്യരൂപം വ്യക്തമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστῷ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹയിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: Χριστός ഇവിടെ ഒരു പദവിയായി പ്രവർത്തിക്കുന്നു. 'മശീഹ' അതിന്റെ അഭിഷിക്തൻ എന്ന അർത്ഥം നിലനിർത്തുന്നു; പരമ്പരാഗതമായ 'ക്രിസ്തു' എന്ന രൂപം സാധുവായ മറ്റൊരു പരിഭാഷയാണ്.
- issue: കഷ്ടാനുഭവവും ദൈവിക പ്രവർത്തനവും തമ്മിലുള്ള കാലബന്ധം
  choice: അല്പകാലം കഷ്ടം അനുഭവിച്ചശേഷം
  alternative: അല്പകാലം കഷ്ടം അനുഭവിക്കുമ്പോൾ
  rationale: പങ്കുപദപ്രയോഗത്തിന് ചെറിയ കാലവ്യത്യാസസാധ്യത ഉണ്ടെങ്കിലും, കഷ്ടം പരിമിതമാണെന്നും അതിനെ തുടർന്ന് ദൈവം പ്രവർത്തിക്കുമെന്നും വാക്യം അവതരിപ്പിക്കുന്ന ക്രമം ഈ പരിഭാഷ നിലനിർത്തുന്നു; അതിലപ്പുറം ഒരു പ്രത്യേക ദൈവശാസ്ത്രക്രമം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ഗ്രീക്കിലെ നാല് ഭാവിക്രിയകളുടെ നിരയും αὐτός എന്ന ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
