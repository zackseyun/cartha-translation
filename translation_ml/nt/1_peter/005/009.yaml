id: 1PE.5.9
reference: 1 Peter 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: ml
  text: വിശ്വാസത്തിൽ ഉറച്ചുനിന്നുകൊണ്ട് അവനെ[a] ചെറുത്തുനിൽക്കുക. ലോകത്തിലുള്ള നിങ്ങളുടെ സഹോദരസമൂഹം[c] ഇതേ തരത്തിലുള്ള കഷ്ടാനുഭവങ്ങളിലൂടെ കടന്നുപോകുന്നുവെന്ന്[d] അറിഞ്ഞുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ’ എന്നത് മുൻവാക്യത്തിൽ പറഞ്ഞ പിശാചിനെ സൂചിപ്പിക്കുന്നു.
    reason: referent_clarification
  - marker: c
    text: ‘സഹോദരസമൂഹം’ എന്നത് പുരുഷന്മാരെ മാത്രം അല്ല, സഹവിശ്വാസികളായ സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടുന്ന മുഴുവൻ സമൂഹത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: d
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ ചേർന്ന്: ‘ഇതേ തരത്തിലുള്ള കഷ്ടാനുഭവങ്ങൾ പൂർത്തിയായിക്കൊണ്ടിരിക്കുന്നു’ അഥവാ ‘നിറവേറിക്കൊണ്ടിരിക്കുന്നു’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: അവനെ
  rationale: ഈ ബന്ധസർവനാമം മുൻവാക്യത്തിലെ പിശാചിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ചെറുത്തുനിൽക്കുക’ എന്ന ക്രിയയോടൊപ്പം വ്യക്തമായ കർമരൂപം സ്വാഭാവികമാണ്.
- source_word: ἀντίστητε
  choice: ചെറുത്തുനിൽക്കുക
  rationale: നിർണായകമായി എതിർത്തുനിൽക്കാനുള്ള ആജ്ഞയുടെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: στερεοὶ τῇ πίστει
  choice: വിശ്വാസത്തിൽ ഉറച്ചുനിന്നുകൊണ്ട്
  rationale: പ്രതിരോധത്തിന്റെ രീതിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ‘ഉറച്ചുനിന്നുകൊണ്ട്’ സ്ഥിരതയും ദൃഢതയും വ്യക്തമാക്കുന്നു. πίστις ഇവിടെ വ്യക്തിപരമായ ആശ്രയത്തെയും അംഗീകരിച്ച വിശ്വാസത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ ‘വിശ്വാസം’ എന്ന തുറന്ന പദം നിലനിർത്തുന്നു.
- source_word: εἰδότες
  choice: അറിഞ്ഞുകൊള്ളുക
  rationale: ഗ്രീക്കിലെ കൃദ്‌രൂപത്തെ മലയാളത്തിലെ സ്വാഭാവിക ആജ്ഞാസന്ദർഭത്തിൽ അവതരിപ്പിക്കുന്നു; ഈ അറിവ് ചെറുത്തുനിൽപ്പിന്റെ അടിസ്ഥാനമോ അനുബന്ധ സാഹചര്യമോ ആണെന്ന ബന്ധം കർശനമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: ഇതേ തരത്തിലുള്ള കഷ്ടാനുഭവങ്ങൾ
  rationale: ഒരേ സംഭവങ്ങൾ തന്നെയെന്നതിലുപരി സമാന സ്വഭാവമുള്ള കഷ്ടാനുഭവങ്ങളെയാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: ἀδελφότητι
  choice: സഹോദരസമൂഹം
  rationale: സഹവിശ്വാസികളുടെ കുടുംബസദൃശമായ കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സമാഹാരനാമത്തിന്റെ രൂപകവും കൂട്ടായ അർഥവും സംരക്ഷിക്കുന്നു; ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നില്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ κόσμῳ
  choice: ലോകത്തിലുള്ള
  rationale: സഹോദരസമൂഹത്തിന്റെ സ്ഥാനം നേരിട്ട് സൂചിപ്പിക്കുന്ന ലളിതമായ വിവർത്തനം.
- source_word: ἐπιτελεῖσθαι
  choice: കടന്നുപോകുന്നു
  rationale: കഷ്ടാനുഭവങ്ങൾ ഒരു സമൂഹം അനുഭവിക്കുന്നു എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘പൂർത്തിയായിക്കൊണ്ടിരിക്കുന്നു/നിറവേറിക്കൊണ്ടിരിക്കുന്നു’ എന്ന കൂടുതൽ രൂപപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: τῇ πίστει എന്നതിന്റെ അർഥം
  choice: വിശ്വാസത്തിൽ
  alternative: ക്രിസ്തീയ വിശ്വാസസത്യത്തിൽ / ആ വിശ്വാസത്തിൽ
  rationale: ലേഖനസന്ദർഭം അംഗീകരിച്ച ക്രിസ്തീയ വിശ്വാസത്തോടുള്ള സ്ഥിരതയെ പിന്തുണയ്ക്കുന്നുണ്ടെങ്കിലും, വ്യക്തിപരമായ വിശ്വാസമോ ആശ്രയമോ പൂർണമായി ഒഴിവാക്കാനാവില്ല. നിർദ്ദിഷ്ട മതവിഭാഗീയ വ്യാഖ്യാനം ചേർക്കാതെ മലയാളം ഈ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: ἀδελφότητι എന്ന സമാഹാരനാമം
  choice: സഹോദരസമൂഹം
  alternative: സഹവിശ്വാസികളുടെ കുടുംബം / സഹോദരീസഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ കുടുംബബന്ധരൂപകവും സമൂഹത്തെ ഒറ്റ സമാഹാരമായി കാണുന്ന ഭാവവും സംരക്ഷിക്കുന്നു; സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടുന്ന മുഴുവൻ വിശ്വാസിസമൂഹമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἐπιτελεῖσθαι എന്ന ക്രിയയുടെ സൂക്ഷ്മത
  choice: കഷ്ടാനുഭവങ്ങളിലൂടെ കടന്നുപോകുന്നു
  alternative: കഷ്ടാനുഭവങ്ങൾ പൂർത്തിയായിക്കൊണ്ടിരിക്കുന്നു / നിറവേറിക്കൊണ്ടിരിക്കുന്നു
  rationale: പ്രധാനവാചകം സ്വാഭാവികമായി അനുഭവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ കഷ്ടങ്ങൾ നടപ്പാകുന്നു അഥവാ പൂർത്തിയിലേക്കെത്തുന്നു എന്ന ഗ്രീക്ക് ക്രിയയുടെ സാധ്യത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു, ദൈവിക നിയമനം പോലുള്ള ആശയം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സഹോദരസമൂഹം’ എന്നത് കുറച്ചുകൂടി ഔപചാരികമാണെങ്കിലും ഗ്രീക്കിലെ കുടുംബബന്ധരൂപകവും സമാഹാരഭാവവും സംരക്ഷിക്കുന്നതിനായി ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ഉൾക്കൊള്ളുന്ന അർഥം വ്യക്തമാക്കുന്നു.
