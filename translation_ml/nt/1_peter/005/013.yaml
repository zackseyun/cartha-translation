id: 1PE.5.13
reference: 1 Peter 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: ml
  text: ബാബിലോണിൽ ഉള്ള, നിങ്ങളോടൊപ്പം തിരഞ്ഞെടുക്കപ്പെട്ടവൾ നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു; എന്റെ മകനായ മർക്കോസും നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: അഭിവാദ്യം ചെയ്യുന്നു
  rationale: കത്തുകളുടെ സമാപനഭാഗത്തിൽ ആശംസ അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἡ ... συνεκλεκτὴ
  choice: നിങ്ങളോടൊപ്പം തിരഞ്ഞെടുക്കപ്പെട്ടവൾ
  rationale: ഗ്രീക്കിലെ സ്ത്രീലിംഗ ഏകവചനപ്രയോഗത്തിൽ നാമം വ്യക്തമാക്കിയിട്ടില്ല. ‘സഭ’ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കാതെ, സ്ത്രീലിംഗസൂചനയും സൂചിതപദത്തിന്റെ അവ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: ἐν Βαβυλῶνι
  choice: ബാബിലോണിൽ
  rationale: മൂലപാഠത്തിലുള്ള സ്ഥലനാമം അതേപടി നിലനിർത്തുന്നു; ‘റോം’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: συνεκλεκτὴ
  choice: നിങ്ങളോടൊപ്പം തിരഞ്ഞെടുക്കപ്പെട്ടവൾ
  rationale: മറ്റുള്ളവരോടൊപ്പം തിരഞ്ഞെടുക്കപ്പെട്ടിരിക്കുന്നു എന്ന ബന്ധപരമായ അർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: Μᾶρκος
  choice: മർക്കോസ്
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ὁ υἱός μου
  choice: എന്റെ മകൻ
  rationale: υἱός എന്ന പദത്തിന്റെ നേരിട്ടുള്ള കുടുംബബന്ധഭാഷ നിലനിർത്തുന്നു; ആത്മീയബന്ധമാണെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἡ ... συνεκλεκτὴ എന്ന പ്രയോഗത്തിന്റെ വ്യക്തിത്വം
  choice: വ്യക്തമാക്കാത്ത സ്ത്രീലിംഗ സൂചിതപദം നിലനിർത്തി ‘തിരഞ്ഞെടുക്കപ്പെട്ടവൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ബാബിലോണിലുള്ള സഭ, നിങ്ങളോടൊപ്പം തിരഞ്ഞെടുക്കപ്പെട്ടത്’ അല്ലെങ്കിൽ പത്രോസിന്റെ ഭാര്യ/മറ്റൊരു ക്രിസ്തീയ സ്ത്രീ.
  rationale: ഗ്രീക്കിൽ സ്ത്രീലിംഗ ഏകവചന ലേഖനവും വിശേഷണവും ഉണ്ടെങ്കിലും നാമം പ്രസ്താവിച്ചിട്ടില്ല. ‘സഭ’ എന്നത് സാധാരണവും സാധ്യതയുള്ളതുമായ വ്യാഖ്യാനമാണെങ്കിലും അത് പാഠത്തിൽ ചേർത്തിട്ടില്ല; അതിനാൽ മുഖ്യപാഠം യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: ‘ബാബിലോൺ’ എന്നതിന്റെ സൂചന
  choice: മുഖ്യപാഠത്തിൽ ‘ബാബിലോൺ’ നിലനിർത്തി.
  alternative: റോമിനെ സൂചിപ്പിക്കുന്ന പ്രതീകാത്മക നാമം, അല്ലെങ്കിൽ മെസൊപ്പൊത്താമ്യയിലെ അക്ഷരാർഥത്തിലുള്ള ബാബിലോൺ.
  rationale: മൂലപാഠം നേരിട്ട് ബാബിലോൺ എന്നു പറയുന്നു. ചരിത്രപരമായ തിരിച്ചറിയൽ വിവാദവിധേയമായതിനാൽ പരിഭാഷ അത് തീർപ്പാക്കുന്നില്ല.
- issue: മർക്കോസിനെ ‘എന്റെ മകൻ’ എന്നു വിളിക്കുന്നത്
  choice: കുടുംബബന്ധം സൂചിപ്പിക്കുന്ന അക്ഷരാർഥപ്രയോഗം നിലനിർത്തി.
  alternative: ‘എന്റെ ആത്മീയമകൻ’ അല്ലെങ്കിൽ ‘എന്റെ പ്രിയമകൻ.’
  rationale: സന്ദർഭത്തിൽ ആത്മീയബന്ധമായിരിക്കാം; എന്നാൽ ഗ്രീക്കിൽ ആ വിശദീകരണം തുറന്നുപറയുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ വിശേഷണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കത്തുശൈലി. സ്ത്രീലിംഗ ഏകവചനത്തിന്റെ സൂചനയ്ക്കായി ‘തിരഞ്ഞെടുക്കപ്പെട്ടവൾ’ ഉപയോഗിച്ചു. ആവർത്തനം ഒഴിവാക്കി καὶ Μᾶρκος എന്ന സമാന്തര ആശംസ ‘മർക്കോസും അങ്ങനെതന്നെ ചെയ്യുന്നു’ എന്നു സ്വാഭാവികമായി നൽകി.
