id: 1PE.5.8
reference: 1 Peter 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: ml
  text: മനസ്സുതെളിഞ്ഞവരായിരിക്കുവിൻ[a]; ജാഗ്രതയോടെയിരിക്കുവിൻ. നിങ്ങളുടെ എതിരാളിയായ പിശാച് ഗർജിക്കുന്ന സിംഹത്തെപ്പോലെ ചുറ്റിനടക്കുന്നു; വിഴുങ്ങാൻ ആരെയെങ്കിലും തേടുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘സുബോധമുള്ളവരായിരിക്കുവിൻ’; പരമ്പരാഗതമായി, ‘ലഹരിയില്ലാത്തവരായിരിക്കുവിൻ.’ νήψατε എന്ന ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘മദ്യലഹരിയില്ലാതിരിക്കുക’ എന്നാണ്. എന്നാൽ ഇവിടെ അത് ആലങ്കാരികമായി ഉപയോഗിച്ചിരിക്കുന്നു: മദ്യവർജനം അല്ല, ആത്മീയ ഭീഷണിയുടെ നടുവിൽ മനസ്സിന്റെ തെളിമയും ആത്മനിയന്ത്രണവും നിലനിർത്തുക എന്നതാണ് ആശയം.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇരതേടി പതുങ്ങിച്ചുറ്റുന്നു.’ ഗ്രീക്ക് ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥം ‘ചുറ്റിനടക്കുന്നു’ അല്ലെങ്കിൽ ‘ചുറ്റും സഞ്ചരിക്കുന്നു’ എന്നാണ്; പതുങ്ങി ഇരതേടുന്ന ഭാവം സിംഹോപമ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε (νήφω)
  choice: തെളിഞ്ഞ മനസ്സുള്ളവരായിരിക്കുവിൻ
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ മദ്യലഹരിയില്ലായ്മയെ അക്ഷരാർഥത്തിൽ സൂചിപ്പിക്കുന്നില്ല; ആത്മീയ ഭീഷണിക്കിടെ മനസ്സിന്റെ തെളിമയും ആത്മനിയന്ത്രണവും നിലനിർത്തുക എന്ന രൂപകാലങ്കാരപരമായ ആശയമാണ്. തുടർന്നുള്ള γρηγορήσατε എന്ന ജാഗ്രതാനിർദേശത്തിൽനിന്ന് വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: γρηγορήσατε
  choice: ജാഗരൂകരായിരിക്കുവിൻ
  rationale: ഉണർന്നുള്ള നിരന്തര ശ്രദ്ധയും അപകടബോധവും സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἀντίδικος
  choice: എതിരാളി
  rationale: നിയമപരമായ എതിർകക്ഷി എന്ന പശ്ചാത്തലനിറം ഈ പദത്തിനുണ്ടാകാമെങ്കിലും, ഇവിടെ വിശ്വാസികൾക്കെതിരെ നിലകൊള്ളുന്ന ശത്രുവിനെയാണ് പൊതുവായി സൂചിപ്പിക്കുന്നത്; ‘എതിരാളി’ അതിനെ അമിതമായി നിർവചിക്കാതെ നിലനിർത്തുന്നു.
- source_word: διάβολος
  choice: പിശാച്
  rationale: ഇവിടെ ഇത് ഒരു സാധാരണ അപവാദിയെ അല്ല, പുതിയ നിയമത്തിൽ അറിയപ്പെടുന്ന വ്യക്തിപരമായ ദുഷ്ടസത്തയെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
- source_word: ὡς λέων ὠρυόμενος
  choice: ഗർജിക്കുന്ന സിംഹത്തെപ്പോലെ
  rationale: വ്യക്തമായ ഉപമയും ഭീഷണിപ്പെടുത്തുന്ന ഇരപിടിയൻ ചിത്രവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: περιπατεῖ
  choice: ചുറ്റിനടക്കുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘ചുറ്റും നടക്കുക/സഞ്ചരിക്കുക’ എന്നത് നേരിട്ട് സംരക്ഷിക്കുന്നു; ഭീഷണിയുടെ ശക്തി സിംഹോപമയിൽനിന്ന് ലഭിക്കുന്നു.
- source_word: ζητῶν
  choice: തേടിക്കൊണ്ട്
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന അന്വേഷണത്തെയും അതിന്റെ ലക്ഷ്യത്തെയും പങ്കാളിക്രിയയായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τινα
  choice: ആരെയെങ്കിലും
  rationale: ഏതെങ്കിലും ഒരാളെ എന്ന ഏകവചനപരവും അനിശ്ചിതവുമായ സൂചന സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: καταπιεῖν
  choice: വിഴുങ്ങാൻ
  rationale: ‘മുഴുവനായി വിഴുങ്ങുക’ എന്ന മൂലചിത്രവും സിംഹോപമയിലെ ഹിംസാത്മകമായ ഇരപിടിത്തവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: διάβολος എന്നത് സാധാരണനാമമായ ‘അപവാദി’ എന്നോ സാത്താനെ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ സ്ഥാനപ്പേരായോ വിവർത്തനം ചെയ്യണമോ
  choice: പിശാച്
  alternative: അപവാദി
  rationale: സന്ദർഭത്തിൽ വിശ്വാസികളുടെ വ്യക്തിപരമായ ആത്മീയ എതിരാളിയെയാണ് ഉദ്ദേശിക്കുന്നത്. ‘പിശാച്’ എന്നത് പാഠം പറയുന്നതിലധികം സിദ്ധാന്തവിവരം ചേർക്കാതെ പുതിയ നിയമത്തിലെ പതിവുപയോഗം പ്രതിഫലിപ്പിക്കുന്നു.
- issue: സിംഹോപമയ്ക്കുള്ളിൽ περιπατεῖ എന്ന ക്രിയയുടെ ഭീഷണിസ്വരം എത്ര ശക്തമായി പ്രകടിപ്പിക്കണം
  choice: ചുറ്റിനടക്കുന്നു
  alternative: ഇരതേടി പതുങ്ങിച്ചുറ്റുന്നു
  rationale: ഗ്രീക്ക് ക്രിയയുടെ സാധാരണ അർഥം നിലനിർത്തുകയും ഭീഷണി ഉപമ തന്നെ വഹിക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു. കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പകരംവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ തിരുവെഴുത്ത് ശൈലി സ്വീകരിച്ചു. ‘ആയിരിക്കുവിൻ’ എന്ന ബഹുവചന ആജ്ഞാരൂപം ഗൗരവം നിലനിർത്തുന്നു; അതേസമയം അപൂർവമോ അത്യന്തം പഴഞ്ചനോ ആയ പദങ്ങൾ ഒഴിവാക്കി. രണ്ട് ഗ്രീക്ക് ആജ്ഞകളുടെയും വ്യത്യാസം ‘തെളിഞ്ഞ മനസ്സ്’ എന്നും ‘ജാഗ്രത’ എന്നും വ്യക്തമായി സൂക്ഷിച്ചു.
