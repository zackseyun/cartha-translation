id: 1PE.4.3
reference: 1 Peter 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: ml
  text: കാരണം, വിജാതീയരുടെ ഇഷ്ടം നടപ്പാക്കിക്കൊണ്ട് ലജ്ജയില്ലാത്ത ദുർവൃത്തികളിലും[a] ദുർമോഹങ്ങളിലും അമിതമദ്യപാനങ്ങളിലും[b] കൂത്താട്ടങ്ങളിലും മദ്യവിരുന്നുകളിലും നിഷിദ്ധമായ വിഗ്രഹാരാധനകളിലും[c] നിങ്ങൾ ജീവിച്ചുകഴിഞ്ഞ കാലം മതിയല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലജ്ജയില്ലാത്ത അതിരുകടക്കലുകളിലും’ എന്നും പരിഭാഷപ്പെടുത്താം; ἀσέλγεια നിയന്ത്രണമില്ലാത്ത, പലപ്പോഴും ലൈംഗികമായ ദുർവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘മദ്യലഹരികളിലും’ അഥവാ ‘മദ്യപാനഭ്രാന്തുകളിലും’ എന്നും പരിഭാഷപ്പെടുത്താം; οἰνοφλυγία അമിതമദ്യപാനത്തെയും അതിന്റെ ആവർത്തിത പ്രകടനങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘നിയമവിരുദ്ധമായ വിഗ്രഹാരാധനകളിലും’ എന്നും പരിഭാഷപ്പെടുത്താം; ἀθέμιτος എന്നത് അനുവദനീയമല്ലാത്തതോ സ്ഥാപിതമായ ധാർമികക്രമത്തിന് വിരുദ്ധമായതോ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: നിങ്ങൾ കഴിഞ്ഞുപോയ കാലം മതിയല്ലോ
  rationale: ἀρκετός എന്നതിന്റെ ‘മതി/ആവശ്യത്തിലധികം കഴിഞ്ഞു’ എന്ന ഭാവവും γάρ നൽകുന്ന വിശദീകരണസ്വരവും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: വിജാതീയരുടെ ഇഷ്ടം
  rationale: ഈ സന്ദർഭത്തിൽ ἔθνη ഭൗമരാഷ്ട്രീയ ‘ജനതകൾ’ എന്നതിലുപരി ദൈവത്തെ അറിയാത്ത യെഹൂദേതര സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘വിജാതീയർ’ ഈ വ്യത്യാസം നിലനിർത്തുന്നു. βούλημα എന്നത് അവരുടെ ഇഷ്ടം/ഉദ്ദേശ്യം എന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: κατειργάσθαι
  choice: നിറവേറ്റിക്കൊണ്ട്
  rationale: ക്രിയയുടെ പ്രവർത്തിച്ചുതീർക്കുക, നടപ്പാക്കുക എന്ന ശക്തി നിലനിർത്തുകയും, കഴിഞ്ഞകാല ജീവിതത്തെക്കുറിച്ചുള്ള പൂർത്തിയായ പ്രവർത്തനഭാവം മുഴുവൻ വാക്യത്തിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: πεπορευμένους
  choice: ജീവിച്ചു
  rationale: ധാർമിക പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്ന πορεύομαι എന്ന രൂപകപ്രയോഗത്തിന് സാധാരണ മലയാളത്തിൽ ‘ജീവിച്ചു’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐν ἀσελγείαις
  choice: ലജ്ജയില്ലാത്ത ദുർവൃത്തികളിൽ
  rationale: ἀσέλγεια സൂചിപ്പിക്കുന്ന പരസ്യവും നിയന്ത്രണമില്ലാത്തതുമായ ധാർമിക—പ്രത്യേകിച്ച് ലൈംഗിക—അതിരുകടക്കൽ, ലൈംഗിക അർത്ഥത്തിലേക്ക് മാത്രം ചുരുക്കാതെ പ്രകടിപ്പിക്കുന്നു; ബഹുവചനം വിവിധ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπιθυμίαις
  choice: ദുർമോഹങ്ങളിൽ
  rationale: ἐπιθυμία സ്വതവേ ആഗ്രഹം എന്ന നിഷ്പക്ഷ അർത്ഥം വഹിക്കാമെങ്കിലും ഈ ദോഷപ്പട്ടികയിൽ അധാർമികവും നിയന്ത്രണമില്ലാത്തതുമായ മോഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: οἰνοφλυγίαις
  choice: അമിതമദ്യപാനത്തിൽ
  rationale: അപൂർവപദം സൂചിപ്പിക്കുന്ന വീഞ്ഞിന്റെ അമിതോപയോഗവും മദ്യലഹരിയിലെ ആവർത്തിത ജീവിതരീതിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κώμοις
  choice: കൂത്താട്ടങ്ങളിൽ
  rationale: മദ്യപാനവും നിയന്ത്രണമില്ലാത്ത ആഘോഷവും ചേർന്ന ഉന്മത്തവിനോദത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: πότοις
  choice: മദ്യവിരുന്നുകളിൽ
  rationale: πότος എന്നത് മദ്യപാനം കേന്ദ്രീകരിച്ച കൂട്ടായ അവസരങ്ങളെയോ വിരുന്നുകളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: നിഷിദ്ധമായ വിഗ്രഹാരാധനകളിൽ
  rationale: ἀθέμιτος എന്നതിലെ അനുവദനീയമല്ലാത്തത്, ദൈവികമോ അംഗീകൃതമോ ആയ നിയമക്രമത്തിന് വിരുദ്ധമായത് എന്ന ഭാവം ‘നിഷിദ്ധമായ’ എന്നു നൽകുന്നു; ബഹുവചനം വിവിധ വിഗ്രഹാരാധനാചാരങ്ങളെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐθνῶν എന്നതിന്റെ തിരിച്ചറിയൽ
  choice: വിജാതീയർ
  alternative: ജാതികൾ; ദൈവത്തെ അറിയാത്തവർ
  rationale: പത്രോസിന്റെ സന്ദർഭത്തിൽ വായനക്കാരുടെ പഴയ ജീവിതത്തെ യെഹൂദേതര സമൂഹത്തിന്റെ പെരുമാറ്റവുമായി ബന്ധിപ്പിക്കുന്നു. ‘ജാതികൾ’ മലയാളത്തിൽ രാഷ്ട്രങ്ങളെയോ ജാതിവ്യവസ്ഥയെയോ തെറ്റായി സൂചിപ്പിക്കാം; ‘ദൈവത്തെ അറിയാത്തവർ’ കൂടുതൽ വ്യാഖ്യാനപരമാണ്.
- issue: ἀθεμίτοις εἰδωλολατρίαις എന്നതിന്റെ ധാർമിക ശക്തി
  choice: നിഷിദ്ധമായ വിഗ്രഹാരാധനകൾ
  alternative: നിയമവിരുദ്ധമായ വിഗ്രഹാരാധനകൾ; അറപ്പുളവാക്കുന്ന വിഗ്രഹാരാധനകൾ
  rationale: ഗ്രീക്ക് പദം വെറും വൈകാരിക അറപ്പിനേക്കാൾ അനുവദിക്കപ്പെട്ട ക്രമത്തിന് വിരുദ്ധമായ പ്രവൃത്തിയെ കുറ്റപ്പെടുത്തുന്നു. ‘നിഷിദ്ധമായ’ എന്നത് ആ ധാർമിക-നിയമപരമായ ശക്തി അതിശയോക്തിയില്ലാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നടന്നു’ എന്ന അക്ഷരാർഥ രൂപകത്തിന് പകരം ‘ജീവിച്ചു’ ഉപയോഗിച്ച് ധാർമിക ജീവിതരീതിയെ സ്വാഭാവികമായി അറിയിച്ചു. ദോഷപ്പട്ടികയിലെ ഇനങ്ങൾ കഴിയുന്നത്ര വേർതിരിച്ചും ബഹുവചനപ്രവൃത്തികളുടെ ഭാവം നിലനിർത്തിയും നൽകിയിരിക്കുന്നു.
