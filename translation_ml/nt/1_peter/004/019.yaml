id: 1PE.4.19
reference: 1 Peter 4:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: ml
  text: അതുകൊണ്ട്, ദൈവഹിതപ്രകാരം കഷ്ടം അനുഭവിക്കുന്നവരും നന്മ ചെയ്തുകൊണ്ട് തങ്ങളുടെ ജീവനെ[a] വിശ്വസ്തനായ സ്രഷ്ടാവിന് ഏൽപ്പിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആത്മാവിനെ” അല്ലെങ്കിൽ “തങ്ങളെത്തന്നെ”; ഗ്രീക്കുപദത്തിന് ജീവൻ, ആത്മാവ്, അല്ലെങ്കിൽ വ്യക്തി എന്ന അർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: οἱ πάσχοντες
  choice: കഷ്ടം അനുഭവിക്കുന്നവർ
  rationale: കഷ്ടാനുഭവത്താൽ വിശേഷിപ്പിക്കപ്പെടുന്ന ഒരു പൊതുവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: ദൈവഹിതപ്രകാരം
  rationale: κατά എന്നതിലെ അനുരൂപതയുടെ ആശയം നിലനിർത്തുന്നു; കഷ്ടം ദൈവഹിതവുമായി എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നു എന്നത് വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമായി തീർപ്പാക്കുന്നില്ല.
- source_word: πιστῷ κτίστῃ
  choice: വിശ്വസ്തനായ സ്രഷ്ടാവിനെ
  rationale: πιστός എന്നതിലെ വിശ്വസ്തതയും ആശ്രയയോഗ്യതയും ‘വിശ്വസ്തനായ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; κτίστης എന്നതിന് ‘സ്രഷ്ടാവ്’ സ്വാഭാവികമാണ്. മലയാളത്തിലെ ‘ഏൽപ്പിക്കുക’ എന്ന ക്രിയയോടു ചേരുന്ന കർമരൂപമാണ് ഉപയോഗിച്ചത്.
- source_word: παρατιθέσθωσαν
  choice: ഏൽപ്പിക്കട്ടെ
  rationale: മറ്റൊരാളുടെ സുരക്ഷിതപരിപാലനത്തിനു ഭരമേൽപ്പിക്കുക എന്ന മധ്യമപ്രയോഗത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: തങ്ങളുടെ പ്രാണനെ
  rationale: ψυχή എന്ന പദത്തിന്റെ പരമ്പരാഗതവും ദൈവശാസ്ത്രപരവുമായ ഭാരം ‘പ്രാണൻ’ നിലനിർത്തുന്നു; ‘ജീവൻ’ അല്ലെങ്കിൽ ‘തങ്ങളെത്തന്നെ’ എന്ന വിശാലാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: നന്മ ചെയ്തുകൊണ്ട്
  rationale: ഏൽപ്പിക്കൽ നന്മചെയ്യുന്നതിനിടയിലും അതോടൊപ്പവും നടക്കുന്നു എന്ന രീതിയെയോ അനുബന്ധസാഹചര്യത്തെയോ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: കഷ്ടാനുഭവവും ദൈവഹിതവും തമ്മിലുള്ള ബന്ധം
  choice: ദൈവഹിതപ്രകാരം
  alternative: ദൈവത്തിന്റെ ഇഷ്ടത്തോട് ഒത്തവിധം; ദൈവഹിതത്താൽ
  rationale: കഷ്ടാനുഭവം ദൈവഹിതത്തിനു ‘പ്രകാരം’ ആണെന്ന് ഗ്രീക്ക് പറയുന്നു; അത് ദൈവത്തിന്റെ അനുവാദമോ നിർണയമോ അംഗീകാരമോ ആണെന്ന് വിവർത്തനം പ്രത്യേകം തീർപ്പാക്കുന്നില്ല.
- issue: ഈ സന്ദർഭത്തിലെ ψυχή എന്നതിന്റെ അർഥം
  choice: പ്രാണൻ
  alternative: ജീവൻ; തങ്ങളെത്തന്നെ
  rationale: ‘പ്രാണൻ’ മൂലപദത്തിന്റെ പരമ്പരാഗതവും ദൈവശാസ്ത്രപരവുമായ അനുരണനം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സാധ്യമായ വിശാലാർഥം അടിക്കുറിപ്പിലൂടെ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൈവഹിതപ്രകാരം’ എന്ന സംക്ഷിപ്തപ്രയോഗം മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
