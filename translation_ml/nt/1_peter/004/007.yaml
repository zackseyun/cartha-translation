id: 1PE.4.7
reference: 1 Peter 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: ml
  text: എന്നാൽ സകലത്തിന്റെയും അവസാനം അടുത്തിരിക്കുന്നു.[a] അതുകൊണ്ട് പ്രാർഥനകൾക്കായി സുബോധമുള്ളവരും ജാഗ്രതയുള്ളവരും ആയിരിക്കുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അടുത്തുവന്നിരിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയ അടുത്തുവന്നതിന്റെ ഫലമായ ഇപ്പോഴത്തെ സമീപസ്ഥിതി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിവേകബോധമുള്ളവരും ഉണർന്ന മനസ്സുള്ളവരും ആയിരിക്കുക.’ ഈ രണ്ടു ആജ്ഞകളും തെളിഞ്ഞ വിധിനിർണയത്തിനും ആത്മീയ ജാഗ്രതയ്ക്കും ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: സകലത്തിന്റെയും
  rationale: നപുംസകലിംഗ ബഹുവചനമായ πᾶς, τέλος-നോടൊപ്പം ‘സകലത്തിന്റെയും അവസാനം’ എന്ന സമഗ്രമായ അർഥം നൽകുന്നു; മലയാളത്തിൽ വേറെ ‘കാര്യങ്ങൾ’ ചേർക്കാതെ ഇതു സ്വാഭാവികമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള മൃദുവായ തിരിവും അടിയന്തരതയും സൂചിപ്പിക്കുന്നു.
- source_word: τὸ τέλος
  choice: അവസാനം
  rationale: ഇവിടത്തെ അന്ത്യകാലസന്ദർഭത്തിൽ τέλος എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘ലക്ഷ്യം’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἤγγικεν
  choice: അടുത്തിരിക്കുന്നു
  rationale: ഗ്രീക്ക് perfect രൂപം അടുത്തുവന്നതിന്റെ ഫലമായ ഇപ്പോഴത്തെ സമീപസ്ഥിതി സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘അടുത്തിരിക്കുന്നു’ അതു വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: σωφρονήσατε
  choice: സുബോധമുള്ളവരായിരിക്കുക
  rationale: സ്ഥിരമായ വിവേചനബോധം, മനസ്സിന്റെ നിയന്ത്രണം, സംയമിതമായ വിധിനിർണയം എന്നിവ ഉൾക്കൊള്ളുന്ന പ്രയോഗം.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: അവസാനം അടുത്തിരിക്കുന്നു എന്ന പ്രഖ്യാപനത്തിൽനിന്ന് തുടർന്നുള്ള ആഹ്വാനം നിഗമനമായി വരുന്നതു വ്യക്തമാക്കുന്നു.
- source_word: νήψατε
  choice: ജാഗ്രതയുള്ളവരായിരിക്കുക
  rationale: νήφωയുടെ അക്ഷരാർഥം മദ്യലഹരിയില്ലായ്മയായിരിക്കാമെങ്കിലും പുതിയനിയമത്തിലെ ഈ പ്രയോഗം ആന്തരിക ഉണർവും വ്യക്തമായ ആത്മീയ ജാഗ്രതയും സൂചിപ്പിക്കുന്നു; മദ്യവർജനം മാത്രം എന്ന അനാവശ്യ പരിമിതി ഒഴിവാക്കുന്നു.
- source_word: εἰς προσευχάς
  choice: പ്രാർഥനകൾക്കായി
  rationale: εἰς-ന്റെ ഉദ്ദേശ്യസൂചനയും προσευχάς എന്ന ബഹുവചനവും നിലനിർത്തി, ആവർത്തിച്ചുള്ള പ്രാർഥനകളിലേക്കുള്ള സജ്ജത സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘സകലത്തിന്റെയും അവസാനം’ എന്നതിന്റെ അന്ത്യകാലപരമായ ശക്തി
  choice: ഒരു നിർദിഷ്ട കാലക്രമമോ അന്ത്യകാലവ്യവസ്ഥയോ ചേർക്കാതെ നേരിട്ടുള്ള അന്ത്യകാലപ്രഖ്യാപനമായി നിലനിർത്തി.
  alternative: ‘സകലത്തിന്റെയും ലക്ഷ്യം’ എന്ന നിലയിലോ ഭാവിയിലെ അന്ത്യത്തെ ക്ഷയിപ്പിക്കുന്ന പൂർണമായി സാക്ഷാത്കരിച്ച അർഥത്തിലോ വായിക്കുക.
  rationale: വാക്യം അവസാനത്തിന്റെ സമീപതയെ പ്രഖ്യാപിച്ച് അതിനെ പ്രാർഥനാപരമായ ജാഗ്രതയുടെ അടിസ്ഥാനമാക്കുന്നു; വിവർത്തനം ആ അടിയന്തരത നിലനിർത്തുന്നു, എന്നാൽ വിഭാഗീയമായ അന്ത്യകാലപദ്ധതി ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സുബോധമുള്ളവർ’ മാനസിക സംയമനവും ശരിയായ വിധിനിർണയവും സൂചിപ്പിക്കുന്നു; ‘ജാഗ്രതയുള്ളവർ’ νήφωയുടെ രൂപകാലങ്കാരപരമായ ആത്മീയ ഉണർവ് നൽകുന്നു. പ്രധാനവാക്യത്തിലെ രണ്ടു അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
