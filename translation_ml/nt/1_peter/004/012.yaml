id: 1PE.4.12
reference: 1 Peter 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: ml
  text: പ്രിയരേ, നിങ്ങളെ പരീക്ഷിക്കാനായി നിങ്ങളുടെ ഇടയിൽ സംഭവിച്ചുകൊണ്ടിരിക്കുന്ന അഗ്നിപരീക്ഷയെക്കുറിച്ച്, നിങ്ങൾക്കു അസാധാരണമായ എന്തെങ്കിലും സംഭവിക്കുന്നതുപോലെ ആശ്ചര്യപ്പെടരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ഇടയിൽ പരീക്ഷണത്തിനായി സംഭവിച്ചുകൊണ്ടിരിക്കുന്ന തീജ്വാലയെ.” ഗ്രീക്കിലെ πυρώσει എന്ന പദം അക്ഷരാർഥത്തിൽ കത്തിക്കൽ അഥവാ തീയുടെ ദൃശ്യബിംബം ഉണർത്തുന്നു; πειρασμός എന്നതിന് ‘പരീക്ഷണം,’ ‘പരീക്ഷ,’ എന്നും മറ്റു സന്ദർഭങ്ങളിൽ ‘പ്രലോഭനം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: പ്രിയരേ
  rationale: സ്നേഹപൂർവമായ ബഹുവചന സംബോധന. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ മൂലപദത്തിന്റെ ആത്മീയ സ്നേഹഭാവം അറിയിക്കുന്നു.
- source_word: ξενίζεσθε
  choice: ആശ്ചര്യപ്പെടരുത്
  rationale: ‘അപരിചിതമെന്നോ അസാധാരണമെന്നോ കരുതി അത്ഭുതപ്പെടുക’ എന്ന ആശയം നൽകുന്നു. വാക്യത്തിന്റെ അവസാനത്തിലുള്ള ξένου എന്ന പദവുമായി ഉള്ള ആശയബന്ധം ‘അപരിചിതമായ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: πυρώσει
  choice: അഗ്നിപരീക്ഷയെ
  rationale: ‘കത്തിക്കൽ/തീച്ചൂട്’ എന്ന ദൃശ്യബിംബവും കഠിനമായ പരീക്ഷ എന്ന സന്ദർഭാർഥവും ഒരുമിച്ച് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: സമൂഹപരമായ അനുഭവത്തെ മുൻനിർത്തുന്ന ‘among you’ എന്ന അർഥം നൽകുന്നു; വ്യക്തികളുടെ അനുഭവം അതിനാൽ ഒഴിവാകുന്നില്ല.
- source_word: πρὸς πειρασμόν
  choice: നിങ്ങളെ പരീക്ഷിക്കാനായി
  rationale: ഈ പീഡനസന്ദർഭത്തിൽ πειρασμός പാപത്തിലേക്കുള്ള പ്രലോഭനത്തേക്കാൾ ശോധനയെയോ പരീക്ഷയെയോ സൂചിപ്പിക്കുന്നു. ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ ക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: γινομένῃ
  choice: സംഭവിച്ചുകൊണ്ടിരിക്കുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς ξένου
  choice: അപരിചിതമായ എന്തോ ... പോലെ
  rationale: ξένος എന്ന പദത്തിന്റെ ‘അപരിചിതം/അന്യമായത്’ എന്ന അർഥം സംരക്ഷിക്കുകയും ξενίζεσθε എന്നതുമായ പദപ്രയോഗബന്ധം ഭാഗികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: συμβαίνοντος
  choice: സംഭവിക്കുന്നതുപോലെ
  rationale: ഒരാൾക്ക് എന്തെങ്കിലും സംഭവിക്കുക എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സന്ദർഭത്തിലെ πειρασμός എന്നതിന്റെ സ്വഭാവം
  choice: പരീക്ഷ/ശോധന
  alternative: പ്രലോഭനം
  rationale: അടുത്തുള്ള സന്ദർഭം പീഡനവും കഷ്ടാനുഭവവും സംബന്ധിച്ചതിനാൽ ഇവിടെ പാപത്തിലേക്കുള്ള പ്രലോഭനമല്ല, വിശ്വാസത്തെ പരിശോധിക്കുന്ന പരീക്ഷയാണ് പ്രധാന അർഥം.
- issue: അഗ്നിബിംബത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘അഗ്നിപരീക്ഷ’ എന്ന രൂപത്തിൽ ബിംബവും പരീക്ഷയുടെ അർഥവും നിലനിർത്തുക
  alternative: ശുദ്ധീകരിക്കുന്ന തീ എന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: πύρωσις തീ/കത്തിക്കൽ എന്ന ബിംബം ഉണർത്തുന്നുവെങ്കിലും ഈ വാക്യം ശുദ്ധീകരണഫലം വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം ചേർക്കാതെ രൂപകം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘പ്രിയരേ’ എന്ന സംബോധന പാസ്റ്ററൽ സ്നേഹഭാവം നൽകുന്നു. ‘അഗ്നിപരീക്ഷ’ തീയുടെ രൂപകവും കഠിനശോധനയുടെ ആശയവും സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അക്ഷരാർഥവും പദത്തിന്റെ അർഥപരിധിയും വ്യക്തമാക്കുന്നു.
