  text: മശീഹായുടെ[a] നാമത്തിൽ നിങ്ങൾ നിന്ദിക്കപ്പെടുന്നെങ്കിൽ, നിങ്ങൾ അനുഗൃഹീതരാണ്; എന്തെന്നാൽ മഹത്ത്വത്തിന്റെയും ദൈവത്തിന്റെയും ആത്മാവ്[b] നിങ്ങളുടെ മേൽ വന്നു നിലകൊള്ളുന്നു.
