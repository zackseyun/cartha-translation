lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: നിന്ദിക്കപ്പെടുന്നെങ്കിൽ
  rationale: വർത്തമാനകാല കർമണി രൂപം വാക്കുകളാലുള്ള അധിക്ഷേപത്തിനും സാമൂഹിക അപമാനത്തിനും ഇരയാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നിന്ദിക്കപ്പെടുക’ ആ അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: മശീഹായുടെ നാമംനിമിത്തം
  rationale: ഇവിടെ ἐν ὀνόματι എന്നത് മശീഹായുടെ നാമത്തോടുള്ള ബന്ധംമൂലം, അഥവാ ആ നാമം കാരണമായി, എന്ന ആശയം നൽകുന്നു. ‘നാമംനിമിത്തം’ ഗ്രീക്കിന്റെ രൂപവും കാരണാർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; അതിനാൽ പേരുപോലെ ലിപ്യന്തരണം ചെയ്യുന്നതിനെക്കാൾ ‘മശീഹാ’ എന്നത് സ്ഥാനപ്പേരിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: μακάριοι
  choice: അനുഗൃഹീതരാണ്
  rationale: ഈ പദത്തിന് ആശീർവാദവാക്യങ്ങളുടെ ദൈവശാസ്ത്രപരമായ ഭാരം ഉണ്ട്. ‘സന്തുഷ്ടർ’ എന്നത് മാനസികാവസ്ഥയിലേക്കും ‘ഭാഗ്യവാന്മാർ’ എന്നത് ഭാഗ്യധാരണയിലേക്കും ചുരുക്കാൻ ഇടയുള്ളതിനാൽ ‘അനുഗൃഹീതർ’ തിരഞ്ഞെടുത്തു.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: മഹത്ത്വത്തിന്റെയും ദൈവത്തിന്റെയും ആത്മാവ്
  rationale: ആവർത്തിക്കുന്ന നിർദേശകപദങ്ങളോടുകൂടിയ രണ്ടു genitive ഘടകങ്ങളുടെ ചുരുക്കമുള്ള ഗ്രീക്ക് ഘടനയെ ഈ രൂപം സുതാര്യമായി നിലനിർത്തുന്നു; ‘മഹത്ത്വമുള്ള ദൈവാത്മാവ്’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് അത് നിശ്ശബ്ദമായി ചുരുക്കുന്നില്ല.
- source_word: ἀναπαύεται
  choice: ആവസിക്കുന്നു
  rationale: ഈ ക്രിയയ്ക്ക് വിശ്രമിക്കുക, വന്നു നിലകൊള്ളുക എന്ന അർഥമുണ്ട്. ആത്മാവ് ഒരാളുടെമേൽ വന്നു നിലകൊള്ളുന്നതിനെ മലയാളത്തിൽ ‘മേൽ ആവസിക്കുന്നു’ എന്ന് സ്വാഭാവികമായി പറയാം; യെശയ്യാവിലെ ആത്മാവ് ഒരാളുടെമേൽ വസിക്കുന്ന ദൃശ്യത്തോടുള്ള പ്രതിധ്വനിയും ഇത് കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: ‘മഹത്ത്വത്തിന്റെയും ദൈവത്തിന്റെയും ആത്മാവ്’ എന്ന് തുറന്ന ഘടനയിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവത്തിന്റെ മഹത്ത്വമുള്ള ആത്മാവ്’ അല്ലെങ്കിൽ ‘മഹത്ത്വത്തിന്റെ ആത്മാവ്, അതായത് ദൈവത്തിന്റെ ആത്മാവ്’.
  rationale: രണ്ട് genitive ഘടകങ്ങളും സമനിലയിൽ ആത്മാവിനെ വിശേഷിപ്പിക്കുന്നതായോ രണ്ടാമത്തേത് ഒന്നാമത്തേതിനെ വിശദീകരിക്കുന്നതായോ ഗ്രഹിക്കാം. മുഖ്യപാഠത്തിൽ ഏതെങ്കിലും ഒരു വ്യാഖ്യാനം നിർബന്ധിക്കാതെ യഥാർഥ സന്ദിഗ്ധത നിലനിർത്തി.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: ‘മശീഹാ’ എന്ന് അർഥപരമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ക്രിസ്തു’ എന്ന് ലിപ്യന്തരണം ചെയ്യുക.
  rationale: ഈ സന്ദർഭത്തിൽ പദം വെറും വ്യക്തിനാമമല്ല, അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരാണ്. അതിനാൽ ആ സ്ഥാനപ്പേരിന്റെ പ്രവർത്തനം വായനക്കാരന് ദൃശ്യമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നാമംനിമിത്തം’, ‘അനുഗൃഹീതർ’, ‘ആവസിക്കുന്നു’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വേദപാഠത്തിന്റെ ഔന്നത്യവും ഉറവിടത്തിലെ സൂക്ഷ്മതയും നിലനിർത്തുന്നു.
