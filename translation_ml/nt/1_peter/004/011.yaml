id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: ml
  text: ആരെങ്കിലും സംസാരിക്കുന്നെങ്കിൽ, ദൈവത്തിന്റെ അരുളപ്പാടുകൾപോലെ സംസാരിക്കട്ടെ; ആരെങ്കിലും സേവിക്കുന്നെങ്കിൽ, ദൈവം നൽകുന്ന ശക്തികൊണ്ട് സേവിക്കട്ടെ[a]. അങ്ങനെ, എല്ലാറ്റിലും യേശു മശീഹായിലൂടെ ദൈവം മഹത്ത്വപ്പെടേണ്ടതിന്. മഹത്ത്വവും ആധിപത്യവും എന്നെന്നേക്കും അവനുള്ളതാണ്[b][c]. ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദൈവം നൽകുന്ന ശക്തിയിൽനിന്നെന്നപോലെ സേവിക്കട്ടെ.”'
    reason: previous_rendering
  - marker: b
    text: “അവന്” എന്നത് വ്യാകരണപരമായി ഏറ്റവും സ്വാഭാവികമായി യേശു മശീഹായെ സൂചിപ്പിക്കുന്നു. എന്നാൽ മുൻവാക്യത്തെ മുൻനിർത്തി ഇത് പിതാവായ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: “യുഗങ്ങളുടെ യുഗങ്ങളിലേക്ക്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: സംസാരിക്കുന്നെങ്കിൽ
  rationale: പൊതുവായ വാചികശുശ്രൂഷ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പ്രയോഗം; പ്രസംഗത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: λόγια θεοῦ
  choice: ദൈവത്തിന്റെ അരുളപ്പാടുകൾ
  rationale: λόγια എന്നത് സാധാരണ വാക്കുകളേക്കാൾ ദൈവികമായ ഉച്ചാരണങ്ങളെയോ അരുളപ്പാടുകളെയോ സൂചിപ്പിക്കുന്നു; ‘അരുളപ്പാടുകൾ’ ഈ ഉയർന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διακονεῖ
  choice: സേവിക്കുന്നെങ്കിൽ
  rationale: ഔദ്യോഗിക സഭാപദവിയിലേക്കു മാത്രം ചുരുക്കാതെ വിശാലമായ സേവനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐξ ἰσχύος ἧς χορηγεῖ ὁ θεός
  choice: ദൈവം നൽകുന്ന ശക്തിയിൽനിന്ന്
  rationale: ἐξ ശക്തിയുടെ ഉറവിടം ദൈവമാണെന്ന് സൂചിപ്പിക്കുന്നു; χορηγεῖ എന്നതിന് ലളിതവും സ്വാഭാവികവുമായ ‘നൽകുന്ന’ ഉപയോഗിച്ചു.
- source_word: ἐν πᾶσιν
  choice: എല്ലാറ്റിലും
  rationale: വ്യാപകവും സമഗ്രവുമായ പരിധി സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: δοξάζηται
  choice: മഹത്ത്വപ്പെടട്ടെ
  rationale: ἵναയോടൊപ്പമുള്ള ഉദ്ദേശ്യാർഥവും കർമണിഭാവവും മലയാളത്തിലെ ആശംസാ/ഉദ്ദേശ്യ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹായിലൂടെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; διάയുടെ മധ്യസ്ഥതാസൂചന ‘-യിലൂടെ’ നിലനിർത്തുന്നു.
- source_word: κράτος
  choice: ആധിപത്യം
  rationale: സ്തുതിവാക്യത്തിലെ ഭരണാധികാരത്തിന്റെയും പരമാധികാരത്തിന്റെയും ഭാവം നൽകുന്നു.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്ന പ്രയോഗം.
theological_decisions:
- issue: അവസാന സ്തുതിവാക്യത്തിലെ ᾧ (‘അവന്’) ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാന പാഠത്തിൽ ഏറ്റവും അടുത്ത മുൻപദമായ യേശു മശീഹായെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘അവനുള്ളതാണ്’ എന്നു നൽകി.
  alternative: മുൻവാക്യത്തിന്റെ കേന്ദ്രമായ പിതാവായ ദൈവത്തെയാണ് സ്തുതിവാക്യം സൂചിപ്പിക്കുന്നതെന്ന് ഗ്രഹിക്കാം; അല്ലെങ്കിൽ ദൈവത്തെ യേശു മശീഹായിലൂടെ മഹത്ത്വപ്പെടുത്തുന്ന സംക്ഷിപ്തമായ സംയുക്തസൂചനയായി കാണാം.
  rationale: വ്യാകരണപരമായി ഏറ്റവും അടുത്ത മുൻപദം Ἰησοῦ Χριστοῦ ആണ്; എങ്കിലും മുൻവാക്യത്തിലെ θεός കാരണം മറ്റൊരു ബന്ധവും യഥാർഥ സാധ്യതയാണ്. ഈ സംഘർഷം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
- issue: രണ്ട് ഉപവാക്യങ്ങളിലുമുള്ള ὡς എന്നതിന്റെ ബലം
  choice: മലയാളത്തിൽ സ്വാഭാവികമായ ആഹ്വാനരൂപമായി ‘സംസാരിക്കട്ടെ/സേവിക്കട്ടെ’ എന്നു വ്യക്തമാക്കി.
  alternative: ‘ആരെങ്കിലും സംസാരിക്കുന്നെങ്കിൽ, ദൈവത്തിന്റെ അരുളപ്പാടുകൾപോലെ; ആരെങ്കിലും സേവിക്കുന്നെങ്കിൽ, ദൈവം നൽകുന്ന ശക്തിയിൽനിന്നെന്നപോലെ’ എന്ന കൂടുതൽ ദീർഘവൃത്തമായ രൂപം.
  rationale: ഗ്രീക്കിൽ താരതമ്യഘടന സംക്ഷിപ്തമാണെങ്കിലും മലയാളത്തിൽ ക്രിയ ആവർത്തിക്കുന്നത് ആഹ്വാനസ്വഭാവം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു; പുതിയ ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സഭാവായനാ ശൈലി. ‘അരുളപ്പാടുകൾ’ λόγιαയുടെ ദൈവിക ഉച്ചാരണഭാവം കാത്തുസൂക്ഷിക്കുന്നു; ‘സേവിക്കുക’ διακονεῖയെ ഔദ്യോഗിക ശുശ്രൂഷയിലേക്കു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല. സ്തുതിവാക്യത്തിലെ സർവനാമത്തിന്റെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
