id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: ml
  text: എന്നാൽ, മശീഹയുടെ[a] കഷ്ടതകളിൽ നിങ്ങൾ എത്രത്തോളം പങ്കുചേരുന്നുവോ അത്രത്തോളം സന്തോഷിക്കുക; അങ്ങനെ, അവന്റെ മഹത്ത്വം വെളിപ്പെടുമ്പോൾ[b] നിങ്ങളും അത്യാനന്ദത്തോടെ സന്തോഷിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവിന്റെ.’ ഗ്രീക്ക് Χριστός ഒരു സ്ഥാനപ്പേരായി ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ മഹത്ത്വത്തിന്റെ വെളിപ്പാടിൽ’; അഥവാ, ‘അവന്റെ മഹത്ത്വം അനാവൃതമാകുമ്പോൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὸ
  choice: എത്രത്തോളം ... അത്രത്തോളം
  rationale: കേവലം ‘പോലെ’ എന്ന താരതമ്യത്തെക്കാൾ, പങ്കാളിത്തത്തിന്റെ അളവിനനുസരിച്ചുള്ള ആനന്ദം എന്ന ആനുപാതിക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: κοινωνεῖτε
  choice: പങ്കുചേരുന്നുവോ
  rationale: കഷ്ടതകളിലുള്ള യഥാർഥ പങ്കാളിത്തം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; വെറും സഹതാപം എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: മശീഹയുടെ കഷ്ടതകളിൽ
  rationale: ഗ്രീക്കിലെ ദത്തിവ് ഘടനയുടെ പങ്കാളിത്താർഥവും ജനിറ്റീവ് ബന്ധവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ മശീഹീയ അർഥം നിലനിർത്തുന്നു.
- source_word: χαίρετε
  choice: സന്തോഷിക്കുക
  rationale: ആജ്ഞയുടെ സജീവ സ്വഭാവം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുകയും പിന്നീട് വരുന്ന χαρῆτε-യുമായുള്ള പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: ഇപ്പോഴത്തെ സന്തോഷവും മഹത്ത്വത്തിന്റെ വെളിപ്പാടിലെ ഭാവിസന്തോഷവും തമ്മിലുള്ള ഉദ്ദേശ്യ/ഫലബന്ധം അമിതമായി നിർവചിക്കാതെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ
  choice: അവന്റെ മഹത്ത്വം വെളിപ്പെടുമ്പോൾ
  rationale: ഗ്രീക്കിലെ നാമരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി മാറ്റുമ്പോഴും ഭാവിയിലെ പരസ്യമായ വെളിപ്പാടിന്റെ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: χαρῆτε ἀγαλλιώμενοι
  choice: അത്യാനന്ദത്തോടെ സന്തോഷിക്കും
  rationale: χαίρω എന്ന പദത്തിന്റെ ആവർത്തനം ‘സന്തോഷിക്കും’ എന്നതിലൂടെ നിലനിർത്തുകയും ἀγαλλιάω സൂചിപ്പിക്കുന്ന തീവ്രവും ആഘോഷപൂർണവുമായ ആനന്ദം ‘അത്യാനന്ദത്തോടെ’ എന്നതിലൂടെ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ പദം യേശുവിന്റെ മശീഹീയ പദവിയെ സൂചിപ്പിക്കുന്നു. ‘മശീഹ’ എന്നത് ആ സ്ഥാനപ്പേരിന്റെ അർഥവും യഹൂദ പശ്ചാത്തലവും തുറന്നുവെക്കുന്നു; പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: മശീഹയുടെ കഷ്ടതകളിലുള്ള പങ്കാളിത്തത്തിന്റെ സ്വഭാവം
  choice: മശീഹയുടെ കഷ്ടതകളിൽ ... പങ്കുചേരുന്നു
  alternative: മശീഹയ്ക്കുവേണ്ടി കഷ്ടപ്പെടുന്നു
  rationale: വിശ്വാസികളുടെ കഷ്ടതയും മശീഹയുടെ കഷ്ടതയും തമ്മിലുള്ള പങ്കാളിത്തബന്ധം ഗ്രീക്ക് നേരിട്ട് പറയുന്നു. അതിനെ പ്രായശ്ചിത്തകഷ്ടതയുടെ ആവർത്തനമായോ മശീഹയ്ക്കുവേണ്ടിയുള്ള കഷ്ടതയായി മാത്രമോ വ്യാഖ്യാനിക്കാതെ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- issue: ἵνα സൂചിപ്പിക്കുന്ന ബന്ധം
  choice: അങ്ങനെ
  alternative: സന്തോഷിക്കേണ്ടതിന്
  rationale: ഈ ബന്ധകത്തിന് ഉദ്ദേശ്യവും ഫലവും ഉൾക്കൊള്ളാവുന്നതിനാൽ, മലയാളത്തിൽ ഏതെങ്കിലും ഒറ്റ വ്യാഖ്യാനം കർശനമായി ചുമത്താതെ ഇപ്പോഴത്തെ ആനന്ദത്തെയും ഭാവിയിലെ ആനന്ദത്തെയും ബന്ധിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പഴയ ബൈബിൾഭാഷയിലെ ‘സന്തോഷിക്കുവിൻ’ പോലുള്ള രൂപങ്ങൾ ഒഴിവാക്കി ‘സന്തോഷിക്കുക’ ഉപയോഗിച്ചു. ‘എത്രത്തോളം ... അത്രത്തോളം’ എന്ന ഘടന καθὸയുടെ ആനുപാതിക ശക്തി വ്യക്തമായി സൂക്ഷിക്കുന്നു; അവസാന ഭാഗത്തിൽ ആവർത്തിച്ചുള്ള സന്തോഷപദങ്ങളും തീവ്രമായ ആനന്ദവും വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
