id: 1PE.4.4
reference: 1 Peter 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: ml
  text: ഇക്കാര്യത്തിൽ[a], നിങ്ങൾ അവരോടൊപ്പം അതേ ധൂർത്തജീവിതത്തിന്റെ ഒഴുകിപ്പരക്കലിലേക്ക് ഓടിച്ചേരാത്തതിൽ അവർ ആശ്ചര്യപ്പെടുകയും നിങ്ങളെ അധിക്ഷേപിച്ചു സംസാരിക്കുകയും ചെയ്യുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇതുനിമിത്തം” അല്ലെങ്കിൽ “ഇതിൽ.”
    reason: ἐν ᾧ എന്ന പ്രയോഗം മുൻസന്ദർഭവുമായി ബന്ധമോ കാരണമോ സൂചിപ്പിക്കാവുന്നതിനാൽ.
  - marker: b
    text: “ഒഴുകിപ്പരക്കൽ” അക്ഷരാർഥത്തിൽ “ഒഴുകിപ്പരക്കൽ” അല്ലെങ്കിൽ “കവിഞ്ഞൊഴുകൽ” എന്നാണ്. “അധിക്ഷേപിച്ചു സംസാരിക്കുന്നു” എന്നത് “നിന്ദിച്ചു സംസാരിക്കുന്നു” അല്ലെങ്കിൽ “അപമാനിച്ച് സംസാരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ἀνάχυσις എന്ന രൂപകത്തിന്റെയും βλασφημέω എന്ന ക്രിയയുടെയും പ്രസക്തമായ പദവികല്പങ്ങൾ രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ഇക്കാര്യത്തിൽ
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച ജീവിതമാറ്റത്തോടുള്ള ബന്ധം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; കാരണബന്ധം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: ξενίζονται
  choice: ആശ്ചര്യപ്പെടുന്നു
  rationale: അപരിചിതമോ വിചിത്രമോ ആയി കരുതി അതിശയിക്കുന്നതെന്ന വർത്തമാനകാല അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: നിങ്ങൾ അവരോടൊപ്പം ... ഓടിച്ചേരാത്തതിൽ
  rationale: συντρέχω എന്നതിലെ ഒരുമിച്ച് ഓടുക എന്ന ദൃശ്യരൂപവും അവരുടെ പ്രവൃത്തിയിൽ പങ്കുചേരാതിരിക്കുക എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν
  choice: അതേ അഴിഞ്ഞാട്ടത്തിന്റെ കുത്തൊഴുക്കിലേക്ക്
  rationale: ἀσωτίαയിലെ ധാർമിക നിയന്ത്രണമില്ലായ്മയ്ക്ക് ‘അഴിഞ്ഞാട്ടം’ സ്വാഭാവികമാണ്; ἀνάχυσις സൂചിപ്പിക്കുന്ന അതിരുകവിഞ്ഞ ഒഴുക്കിന്റെ രൂപകം ‘കുത്തൊഴുക്ക്’ നിലനിർത്തുന്നു.
- source_word: βλασφημοῦντες
  choice: നിങ്ങളെ ദുഷിക്കുകയും ചെയ്യുന്നു
  rationale: ഇവിടെ ദൈവത്തിനെതിരായ ദൈവദൂഷണമല്ല, വിശ്വാസികളെക്കുറിച്ചുള്ള നിന്ദാപരവും അധിക്ഷേപകരവുമായ സംസാരമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. കൃദ്യന്തരൂപത്തിന്റെ സഹകാലികതയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: βλασφημοῦντες എന്നതിലെ ശത്രുതാപരമായ സംസാരത്തിന്റെ ലക്ഷ്യം
  choice: വിശ്വാസികളെ ദുഷിക്കൽ
  alternative: ദൈവദൂഷണം ചെയ്യുക; പൊതുവായി നിന്ദിച്ചു സംസാരിക്കുക
  rationale: മാറിയ ജീവിതരീതിയെക്കുറിച്ചുള്ള അവിശ്വാസികളുടെ പ്രതികരണമാണ് അടുത്ത സന്ദർഭം. അതിനാൽ ദൈവത്തിനെതിരായ ദൂഷണം എന്ന് പരിമിതപ്പെടുത്താതെ, സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന മനുഷ്യർക്കെതിരായ ദുഷിക്കൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ശൈലി. ‘ഓടിച്ചേരുക’, ‘കുത്തൊഴുക്ക്’ എന്നീ പദങ്ങൾ ഗ്രീക്കിലെ ചലന-ഒഴുക്ക് രൂപകങ്ങൾ നിലനിർത്തുന്നു; ‘അഴിഞ്ഞാട്ടം’ ധാർമിക നിയന്ത്രണമില്ലാത്ത ജീവിതത്തെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം നൽകുന്നു.
