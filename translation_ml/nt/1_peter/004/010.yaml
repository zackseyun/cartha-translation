id: 1PE.4.10
reference: 1 Peter 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: ml
  text: ഓരോരുത്തനും തനിക്കു ലഭിച്ച കൃപാവരം പരസ്പരം[a] ശുശ്രൂഷിക്കാൻ ഉപയോഗിക്കട്ടെ—ദൈവത്തിന്റെ വൈവിധ്യമാർന്ന കൃപയുടെ നല്ല കാര്യസ്ഥന്മാരായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾക്കിടയിൽ.”
    reason: εἰς ἑαυτούς സമൂഹത്തിനകത്തെ സേവനത്തിന്റെ മേഖലയെയോ ഗുണഭോക്താക്കളെയോ സൂചിപ്പിക്കാം; ‘പരസ്പരം’ എന്ന പ്രധാനപാഠ വായനയോടൊപ്പം ഈ കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: ἕκαστος
  choice: ഓരോരുത്തനും
  rationale: വ്യക്തിഗതമായി സമൂഹത്തിലെ ഓരോ അംഗത്തെയും സൂചിപ്പിക്കുന്ന വിതരണാർഥക ഏകവചനം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καθὼς ἔλαβεν
  choice: തനിക്കു ലഭിച്ച
  rationale: ലഭിച്ചതിന്റെ യാഥാർഥ്യം സംക്ഷിപ്തമായി അറിയിക്കുകയും ദാതാവിനെ ക്രിയയിൽ ഇല്ലാത്ത വിധം വ്യക്തമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: χάρισμα
  choice: കൃപാവരം
  rationale: കൃപയിൽനിന്നുള്ള വരം എന്ന പദത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; ‘ആത്മീയവരം’ എന്ന കൂടുതൽ സങ്കുചിതമായ സാങ്കേതിക അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: εἰς ἑαυτοὺς
  choice: പരസ്പരം
  rationale: വിശ്വാസസമൂഹത്തിലെ അംഗങ്ങൾ തന്നെയാണ് ശുശ്രൂഷയുടെ ഗുണഭോക്താക്കൾ എന്ന സമൂഹാത്മകവും പരസ്പരവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτὸ διακονοῦντες
  choice: ശുശ്രൂഷിക്കാൻ ഉപയോഗിക്കട്ടെ
  rationale: ഗ്രീക്ക് വാക്യത്തിലെ കർത്തവ്യബോധമുള്ള വർത്തമാന കൃദന്തരൂപത്തെ മലയാളത്തിലെ വ്യക്തമായ ആഹ്വാനമായി അവതരിപ്പിക്കുന്നു; വരം സേവനത്തിനായി വിനിയോഗിക്കണമെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: καλοὶ οἰκονόμοι
  choice: നല്ല കാര്യസ്ഥന്മാരായി
  rationale: മറ്റൊരാളുടേതായി ഏൽപ്പിക്കപ്പെട്ട വിഭവം ഉത്തരവാദിത്വത്തോടെ കൈകാര്യം ചെയ്യുന്നവരുടെ ആശയം ‘കാര്യസ്ഥന്മാർ’ കൃത്യമായി നൽകുന്നു.
- source_word: ποικίλης χάριτος θεοῦ
  choice: ദൈവത്തിന്റെ വിവിധ രൂപങ്ങളിലുള്ള കൃപയുടെ
  rationale: ദൈവകൃപ പലവിധത്തിൽ പ്രകടമാകുന്നു എന്ന ποικίλης എന്ന വിശേഷണത്തിന്റെ ഭാവം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: χάρισμα എന്നത് സങ്കുചിതമായി ‘ആത്മീയവരം’ എന്നു പരിഭാഷപ്പെടുത്തണമോ
  choice: കൃപാവരം
  alternative: ആത്മീയവരം; വരം
  rationale: സഭാസമൂഹത്തിലെ കൃപാപ്രദത്തമായ സേവനമാണ് പശ്ചാത്തലമെങ്കിലും, ഗ്രീക്ക് പദം ‘ആത്മീയവരം’ എന്ന സാങ്കേതിക അർഥത്തിലേക്ക് മാത്രം ചുരുങ്ങുന്നില്ല. ‘കൃപാവരം’ കൃപയുമായുള്ള ബന്ധവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- issue: εἰς ἑαυτούς എന്നതിന്റെ സമൂഹാത്മക ദിശ എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: പരസ്പരം
  alternative: നിങ്ങൾക്കിടയിൽ; അന്യോന്യം; ഒരുവൻ മറ്റൊരുവനുവേണ്ടി
  rationale: പദപ്രയോഗം സമൂഹത്തെ ശുശ്രൂഷയുടെ ഗുണഭോക്താക്കളായി കാണിക്കുന്നു. പ്രധാന പാഠത്തിലെ ‘പരസ്പരം’ സ്വാഭാവികമാണ്; കൂടുതൽ അക്ഷരാർഥപരമായ ‘നിങ്ങൾക്കിടയിൽ’ അടിക്കുറിപ്പിൽ നിലനിർത്തി യഥാർഥമായ സൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശുശ്രൂഷ’, ‘കൃപാവരം’, ‘കാര്യസ്ഥൻ’ എന്നീ സഭാപരിചിത പദങ്ങൾ ഇവിടെ മൂലപാഠത്തിന്റെ അർഥം കൃത്യമായി വഹിക്കുന്നതിനാൽ നിലനിർത്തി; വാക്യഘടന സ്വാഭാവികമാക്കാൻ കൃദന്തരൂപം ആഹ്വാനരൂപത്തിൽ അവതരിപ്പിച്ചു.
