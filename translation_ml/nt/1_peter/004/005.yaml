revisions:
- from: അവർ ജീവനുള്ളവരെയും മരിച്ചവരെയും ന്യായംവിധിക്കാൻ സന്നദ്ധനായിരിക്കുന്നവനോട് കണക്കു ബോധിപ്പിക്കേണ്ടിവരും.[a]
  to: അവർ ജീവിച്ചിരിക്കുന്നവരെയും മരിച്ചവരെയും ന്യായം വിധിക്കാൻ ഒരുങ്ങിനിൽക്കുന്നവന് കണക്ക് നൽകേണ്ടിവരും.[a]
  rationale: The revision replaces an unnatural account-giving expression with the established Malayalam idiom ‘കണക്ക് നൽകുക.’ It also uses ‘ഒരുങ്ങിനിൽക്കുന്നവന്’ for the judge’s poised present readiness, while the footnote preserves ‘സന്നദ്ധനായിരിക്കുന്നവന്’ as a valid lexical alternative. No identity for the judge has been added.
