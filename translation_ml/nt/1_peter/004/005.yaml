reference: 1 Peter 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἳ ἀποδώσουσιν λόγον τῷ ἑτοίμως ⸂ἔχοντι κρῖναι⸃ ζῶντας καὶ νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: ml
  text: അവർ ജീവിച്ചിരിക്കുന്നവരെയും മരിച്ചവരെയും ന്യായം വിധിക്കാൻ ഒരുങ്ങിനിൽക്കുന്നവന് കണക്ക് നൽകേണ്ടിവരും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ന്യായം വിധിക്കാൻ സന്നദ്ധനായിരിക്കുന്നവന്.” ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ ന്യായം വിധിക്കാനുള്ള സന്നദ്ധതയുള്ള ഒരാളെ വിവരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: അവർ
  rationale: ബന്ധസർവനാമം മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന ആളുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വതന്ത്ര വാക്യമായി ‘അവർ’ എന്നു തുടങ്ങുന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἀποδώσουσιν λόγον
  choice: കണക്കു ബോധിപ്പിക്കേണ്ടിവരും
  rationale: ഈ പ്രയോഗം ഒരാൾ തന്റെ പ്രവൃത്തികൾക്ക് ഉത്തരം പറയുക അഥവാ കണക്കു നൽകുക എന്ന ന്യായവിധിസംബന്ധമായ ആശയം വഹിക്കുന്നു. ‘കണക്കു ബോധിപ്പിക്കേണ്ടിവരും’ ആ ഉത്തരവാദിത്വവും ഭാവിയിലെ അനിവാര്യതയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῷ
  choice: '...വനോട്'
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തപ്രയോഗം ‘ആ വ്യക്തിയോട്’ എന്ന നാമവാചക അർഥത്തിലാണ്. വിധികർത്താവിനെ വാക്യം പേരെടുത്തു പറയാത്തതിനാൽ മലയാളത്തിലും വിശേഷണബന്ധിതമായ ‘...വനോട്’ നിലനിർത്തുന്നു.
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: ന്യായംവിധിക്കാൻ സന്നദ്ധനായിരിക്കുന്നവനോട്
  rationale: ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ വിധിക്കാൻ സന്നദ്ധതയുള്ള നിലയെ വിവരിക്കുന്നു. ഈ പരിഭാഷ ഇപ്പോഴുള്ള സജ്ജതയുടെ ഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ζῶντας καὶ νεκρούς
  choice: ജീവനുള്ളവരെയും മരിച്ചവരെയും
  rationale: വിധിക്കപ്പെടുന്ന രണ്ടു സമഗ്ര വിഭാഗങ്ങളെയും സംക്ഷിപ്തവും പരമ്പരാഗതവുമായ രീതിയിൽ പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: ജീവനുള്ളവരെയും മരിച്ചവരെയും ന്യായംവിധിക്കാൻ സന്നദ്ധനായിരിക്കുന്നവന്റെ വ്യക്തിത്വം
  choice: പ്രധാനപാഠത്തിൽ ‘...വൻ’ എന്ന ഗ്രീക്കിലെ പരോക്ഷ നിർദ്ദേശം നിലനിർത്തി.
  alternative: ദൈവം; മശീഹാ/ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ വിധികർത്താവിനെ ഗ്രീക്ക് പാഠം വ്യക്തമായി പേരെടുത്തു പറയുന്നില്ല. വിശാലമായ പുതിയനിയമസന്ദർഭത്തിൽ ദൈവത്തെയും ക്രിസ്തുവിനെയും വിധികർത്താവായി അവതരിപ്പിക്കുന്നതിനാൽ, പാഠത്തിൽ ഇല്ലാത്ത തിരിച്ചറിയൽ ചേർത്ത് ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ന്യായവിധിയുടെ ഔപചാരിക ഭാവം നിലനിർത്താൻ ‘ന്യായംവിധിക്കുക’, ‘കണക്കു ബോധിപ്പിക്കുക’ എന്നീ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു.
