- from: എന്നാൽ നിങ്ങളിൽ ആരും കൊലപാതകിയോ കള്ളനോ തിന്മ ചെയ്യുന്നവനോ മറ്റുള്ളവരുടെ കാര്യങ്ങളിൽ അനാവശ്യമായി ഇടപെടുന്നവനോ ആയി കഷ്ടം അനുഭവിക്കരുത്.[a]
  to: കാരണം, നിങ്ങളിൽ ആരും കൊലപാതകിയായോ കള്ളനായോ ദുഷ്പ്രവൃത്തിക്കാരനായോ മറ്റുള്ളവരുടെ കാര്യങ്ങളിൽ ഇടപെടുന്നവനായോ കഷ്ടം അനുഭവിക്കരുത്.[a]
  rationale: ‘എന്നാൽ’ എന്ന വിരുദ്ധബന്ധകത്തെ γάρ-ന്റെ വിശദീകരണബന്ധം നൽകുന്ന ‘കാരണം’ എന്നാക്കി തിരുത്തി. പട്ടികയിലെ ഓരോ ഘടകത്തിനും ‘-ആയോ’ ചേർത്ത് ὡς-ന്റെ ആശയവും മലയാളത്തിലെ സമാന്തരഘടനയും വ്യക്തമാക്കി. അവസാന അപൂർവപദത്തിന്റെ മുഖ്യവാചക അർഥവും പാദക്കുറിപ്പിലെ അക്ഷരാർഥ-ബദലും നിലനിർത്തി.
