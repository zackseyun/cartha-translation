id: 1PE.4.15
reference: 1 Peter 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: ml
  text: കാരണം, നിങ്ങളിൽ ആരും കൊലപാതകിയായോ കള്ളനായോ ദുഷ്പ്രവൃത്തിക്കാരനായോ മറ്റുള്ളവരുടെ കാര്യങ്ങളിൽ ഇടപെടുന്നവനായോ കഷ്ടം അനുഭവിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരകാര്യങ്ങളിൽ തലയിടുന്നവൻ’; കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘മറ്റൊരാളുടേതായ കാര്യങ്ങളുടെ മേൽനോട്ടം വഹിക്കുന്നവൻ.’ സ്വന്തം കാര്യമല്ലാത്തതിൽ അനാവശ്യമായി ഇടപെടുന്ന ഒരാളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ
  choice: എന്നാൽ ... അരുത്
  rationale: μὴ സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നിരോധനശക്തി ‘അരുത്’ എന്നു നൽകി. γάρ ഇവിടെ മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധകമായി ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: τις ὑμῶν
  choice: നിങ്ങളിൽ ആരും
  rationale: നിഷേധവാക്യത്തിൽ τις എന്ന അനിശ്ചിത സർവനാമവും ὑμῶν എന്ന ഭാഗസൂചക ഷഷ്ഠിയും ചേർന്നതിന്റെ വ്യക്തിഗതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: πασχέτω
  choice: കഷ്ടം അനുഭവിക്കരുത്
  rationale: πάσχω എന്നതിന്റെ വിശാലമായ ‘കഷ്ടം അനുഭവിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ശിക്ഷ’ എന്ന ആശയം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ὡς
  choice: ആയി
  rationale: ഒരാൾ ഏത് നിലയിലോ കാരണത്താലോ കഷ്ടം അനുഭവിക്കുന്നു എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: φονεύς
  choice: കൊലപാതകി
  rationale: നിയമവിരുദ്ധവും ധാർമികമായി കുറ്റകരവുമായ കൊല നിർവഹിക്കുന്നവനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: κλέπτης
  choice: കള്ളൻ
  rationale: κλέπτης എന്ന സാധാരണ ‘thief’ അർഥത്തിന്റെ നേരിട്ടും പൊതുജനങ്ങൾക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളപദം.
- source_word: κακοποιός
  choice: തിന്മ ചെയ്യുന്നവൻ
  rationale: പദത്തിന്റെ വിശാലമായ ധാർമിക അർഥം നിലനിർത്തുന്നു; ‘കുറ്റവാളി’ എന്നു പറഞ്ഞ് നിയമപരമായ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἀλλοτριεπίσκοπος
  choice: മറ്റുള്ളവരുടെ കാര്യങ്ങളിൽ അനാവശ്യമായി ഇടപെടുന്നവൻ
  rationale: അപൂർവമായ ഈ സംയുക്തപദത്തിന്റെ നിന്ദാസൂചകമായ ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; സഭാപദവിയുമായി ബന്ധപ്പെട്ട തെറ്റായ ധ്വനി ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ἀλλοτριεπίσκοπος എന്ന അപൂർവപദത്തിന്റെ അർഥം
  choice: മറ്റുള്ളവരുടെ കാര്യങ്ങളിൽ അനാവശ്യമായി ഇടപെടുന്നവൻ
  alternative: മറ്റുള്ളവരുടെ കാര്യങ്ങളുടെ മേൽനോട്ടക്കാരൻ; പരകാര്യങ്ങളിൽ തലയിടുന്നവൻ
  rationale: ഈ ദോഷപ്പട്ടികയുടെ സന്ദർഭത്തിൽ മറ്റൊരാളുടേതായ കാര്യങ്ങളിൽ അനുചിതമായി കടന്നുകയറുന്നവനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘മേൽനോട്ടക്കാരൻ’ എന്ന അക്ഷരാർഥം സഭാപരമായോ നിഷ്പക്ഷമായോ തെറ്റിദ്ധരിക്കപ്പെടാം; അതിനാൽ നിന്ദാസൂചകത വ്യക്തമായി നൽകിയെങ്കിലും പാദക്കുറിപ്പിൽ പദത്തിന്റെ അപൂർവതയും കൂടുതൽ അക്ഷരാർഥവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ദോഷപ്പട്ടികയുടെ സമാന്തരഘടന നിലനിർത്തി. അപൂർവപദത്തിന്റെ ആശയവ്യക്തതയ്ക്കായി മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ വിവരണരൂപവും പാദക്കുറിപ്പിൽ അക്ഷരാർഥസാദ്ധ്യതയും നൽകി.
