id: 1PE.4.16
reference: 1 Peter 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: ml
  text: എന്നാൽ, ഒരുവൻ ക്രിസ്ത്യാനിയായതിന്റെ പേരിൽ കഷ്ടം അനുഭവിക്കുന്നെങ്കിൽ, അവൻ ലജ്ജിക്കാതിരിക്കട്ടെ; മറിച്ച്, ഈ പേരിൽ[a] ദൈവത്തെ മഹത്ത്വപ്പെടുത്തട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഈ കാര്യത്തിൽ’ അഥവാ ‘ഈ പേര് നിമിത്തം.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘ഈ പേരിൽ’ എന്നാണ്; ഇത് ‘ക്രിസ്ത്യാനി’ എന്ന പേരിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ ὡς Χριστιανός
  choice: എന്നാൽ ക്രിസ്ത്യാനി എന്ന നിലയിൽ കഷ്ടം അനുഭവിക്കുന്നെങ്കിൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള വ്യത്യാസം δέ സൂചിപ്പിക്കുന്നു. ὡς Χριστιανός എന്നത് ‘ക്രിസ്ത്യാനി എന്ന നിലയിൽ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു. മൂലത്തിൽ ക്രിയ അധ്യാഹൃതമായതിനാൽ സന്ദർഭത്തിൽനിന്ന് ‘കഷ്ടം അനുഭവിക്കുന്നെങ്കിൽ’ ചേർത്തത് വ്യവസ്ഥയുടെ അർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μὴ αἰσχυνέσθω
  choice: ലജ്ജിക്കരുത്
  rationale: മൂന്നാംപുരുഷ ഏകവചന വർത്തമാന ആജ്ഞയുടെ നിഷേധാത്മക പ്രബോധനശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δοξαζέτω δὲ τὸν θεόν
  choice: പകരം, ... ദൈവത്തെ മഹത്ത്വപ്പെടുത്തട്ടെ
  rationale: ലജ്ജിക്കുന്നതിനോടുള്ള ശക്തമായ വൈരുധ്യം δέ മുഖേന വരുന്നതിനാൽ ‘പകരം’ ഉപയോഗിച്ചു; δοξάζω എന്നതിന്റെ ദൈവോന്മുഖമായ അർഥം ‘മഹത്ത്വപ്പെടുത്തുക’ എന്നു നൽകി.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: ഈ നാമത്തിൽ
  rationale: ഗ്രീക്കിലെ ഏറ്റവും നേരിട്ടുള്ള രൂപം സംരക്ഷിക്കുകയും ‘ക്രിസ്ത്യാനി’ എന്ന പേരുമായുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു; കാരണാർഥമോ സാഹചര്യാർഥമോ ഉള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐν τῷ ὀνόματι τούτῳ എന്നതിലെ ‘ഈ നാമം’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘ഈ നാമത്തിൽ’ എന്നു നൽകി, ‘ക്രിസ്ത്യാനി’ എന്ന പേരിലേക്കുള്ള സ്വാഭാവിക സൂചന നിലനിർത്തി.
  alternative: ‘ഈ കാര്യത്തിൽ,’ ‘ഈ നാമം നിമിത്തം’ എന്നിങ്ങനെ മനസ്സിലാക്കാം.
  rationale: അടുത്തുള്ള മുൻപദം Χριστιανός ആയതിനാൽ ὄνομα ഒരു പേരിനെയോ വിശേഷണനാമത്തെയോ സൂചിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്. എന്നിരുന്നാലും ἐν എന്നതിന്റെ കൃത്യബന്ധം നിർബന്ധമായി തീർപ്പാക്കാതെ വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ക്രിസ്ത്യാനി’ എന്ന പ്രചാരത്തിലുള്ള പദം നിലനിർത്തി. ലിംഗസൂചനയുള്ള സർവനാമം ഒഴിവാക്കി പൊതുവായ പ്രബോധനമായി രൂപപ്പെടുത്തി; പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
