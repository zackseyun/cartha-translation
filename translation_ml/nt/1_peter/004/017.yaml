id: 1PE.4.17
reference: 1 Peter 4:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവത്തിന്റെ കുടുംബത്തിൽനിന്ന്[a] ന്യായവിധി ആരംഭിക്കേണ്ട സമയം വന്നിരിക്കുന്നു. അത് ആദ്യം നമ്മിൽനിന്നാണ് ആരംഭിക്കുന്നതെങ്കിൽ, ദൈവത്തിന്റെ സുവിശേഷം അനുസരിക്കാത്തവരുടെ[c] അന്ത്യം[b] എന്തായിരിക്കും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവത്തിന്റെ ഭവനത്തിൽനിന്ന്.’ ഗ്രീക്കിലെ οἶκος എന്ന പദത്തിന് ‘ഭവനം’ എന്നും ‘കുടുംബം’ എന്നും അർഥമാകാം; ഇവിടെ ദൈവജനമാണ് അവന്റെ കുടുംബമായി ഉദ്ദേശിക്കപ്പെടുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അന്ത്യം’ എന്നത് ‘പരിണതി’ അല്ലെങ്കിൽ ‘ഫലം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ‘അനുസരിക്കാത്തവർ’ എന്നത് ‘വിശ്വസിക്കാൻ വിസമ്മതിക്കുന്നവർ’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് ക്രിയയ്ക്ക് സുവിശേഷത്തോടുള്ള അനുസരണക്കേടും അവിശ്വാസവും സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ ആശയത്തിന് കാരണം നൽകുന്ന ബന്ധകമായി സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ὁ καιρός
  choice: സമയം വന്നിരിക്കുന്നു
  rationale: ഒരു യോജിച്ച അഥവാ നിശ്ചയിക്കപ്പെട്ട സമയം എത്തിയെന്ന καιρός എന്ന പദത്തിന്റെ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τοῦ ἄρξασθαι
  choice: ആരംഭിക്കേണ്ട
  rationale: καιρός-നോടു ചേർന്ന ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവിന്റെ ആശയം, ന്യായവിധി തുടങ്ങാനുള്ള സമയം എത്തിയതായി സുതാര്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ κρίμα
  choice: ന്യായവിധി
  rationale: ശിക്ഷാവിധി എന്ന പരിമിതമായ അർഥത്തിലാക്കാതെ ദൈവത്തിന്റെ ന്യായപരമായ വിലയിരുത്തലും ഇടപെടലും ഉൾക്കൊള്ളുന്ന വിശാലത നിലനിർത്തുന്നു.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കുടുംബത്തിൽനിന്ന്
  rationale: οἶκος ഇവിടെ കെട്ടിടത്തെക്കാൾ ദൈവജനത്തെ ഒരു കുടുംബമായി സൂചിപ്പിക്കുന്നു; ἀπό എന്നതിന്റെ ആരംഭബിന്ദുവും ‘നിന്ന്’ നിലനിർത്തുന്നു.
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: അത് ആദ്യം നമ്മിൽനിന്നാണ് ആരംഭിക്കുന്നതെങ്കിൽ
  rationale: മുൻവാക്യത്തിൽനിന്ന് ‘ആരംഭിക്കുന്നു’ എന്ന ക്രിയ വ്യക്തതയ്ക്കായി പൂരിപ്പിക്കുകയും ആവർത്തിച്ച ἀπό-യുടെ ‘നമ്മിൽനിന്ന്’ എന്ന രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τέλος
  choice: അന്ത്യം
  rationale: അവസാനം, പരിണതി, ഫലം എന്നീ സാധ്യതകൾ ഉൾക്കൊള്ളുന്ന τέλος എന്ന പദത്തിന്റെ ഗൗരവവും വാക്യത്തിലെ വാചാടോപചോദ്യത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἀπειθούντων
  choice: അനുസരിക്കാത്തവരുടെ
  rationale: സുവിശേഷത്തോടുള്ള അനുസരണക്കേടും വിശ്വസിക്കാൻ വിസമ്മതിക്കുന്ന പ്രതികരണവും ഉൾക്കൊള്ളാവുന്ന ക്രിയാത്മക ഭാവം സൂക്ഷിക്കുന്നു.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: ദൈവത്തിന്റെ സുവിശേഷം
  rationale: ദൈവത്തിൽനിന്നുള്ളതോ ദൈവത്തിന്റേതോ ആയ സുവിശേഷം എന്ന ജനിറ്റീവ് ബന്ധം ഔപചാരികമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവജനത്തോടു ബന്ധപ്പെട്ട κρίμα-യുടെ സ്വഭാവം
  choice: ‘ന്യായവിധി’ എന്ന് വിവർത്തനം ചെയ്ത് ശിക്ഷാവിധിയെന്നോ ശിക്ഷണമെന്നോ മാത്രം നിർവചിക്കാതെ വിട്ടു.
  alternative: ‘ശിക്ഷാവിധി’ അല്ലെങ്കിൽ ‘ശിക്ഷണം’
  rationale: ദൈവത്തിന്റെ സ്വന്തം ജനത്തിൽ ആരംഭിക്കുന്ന ന്യായപരമായ ഇടപെടലും സുവിശേഷം അനുസരിക്കാത്തവരുടെ ഭാവി അന്ത്യവും തമ്മിലുള്ള വചനത്തിലെ സംഘർഷം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- issue: ‘ദൈവത്തിന്റെ കുടുംബം’ എന്നതിന്റെ സൂചിതാർഥം
  choice: ദൈവജനത്തെ ഒരു കുടുംബമായി സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: ദൈവത്തിന്റെ ആലയം അഥവാ കെട്ടിടം
  rationale: തുടർന്നുള്ള ‘നമ്മിൽനിന്ന്’ എന്ന പ്രയോഗവും 1 പത്രോസിലെ സമൂഹപരമായ ഭവനരൂപകവും വ്യക്തികളുടെ സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ന്യായവിധി,’ ‘സുവിശേഷം,’ ‘അന്ത്യം’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചു; എന്നാൽ വാക്യഘടന സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
