id: 1PE.4.1
reference: 1 Peter 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: ml
  text: അതുകൊണ്ട്, മശീഹാ[a] ജഡത്തിൽ[b] കഷ്ടം അനുഭവിച്ചതിനാൽ, നിങ്ങളും അതേ മനോഭാവംകൊണ്ട് സ്വയം ആയുധമണിയുക. എന്തെന്നാൽ, ജഡത്തിൽ കഷ്ടം അനുഭവിച്ചവൻ പാപത്തിൽനിന്ന് വിട്ടിരിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘മശീഹാ’ എന്നതിന് പകരം ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: Χριστός). ഇവിടെ സ്ഥാനപ്പേരിന്റെ അർത്ഥം നിലനിർത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘ജഡത്തിൽ’ എന്നത് ഗ്രീക്ക് σάρξ എന്ന പദത്തിന്റെ അക്ഷരാർഥപരമായ പരിഭാഷയാണ്. ഇവിടെ അത് ശരീരപരമായ മനുഷ്യജീവിതത്തെ സൂചിപ്പിക്കുന്നു; ‘പാപസ്വഭാവം’ എന്ന അർത്ഥം നിർബന്ധമായും ഉദ്ദേശിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: ‘ജഡത്തിൽ കഷ്ടം അനുഭവിച്ചവൻ പാപത്തിൽനിന്ന് വിട്ടിരിക്കുന്നു’ എന്ന വാക്യം വ്യത്യസ്തമായി വ്യാഖ്യാനിക്കപ്പെടുന്നു. അത് പ്രത്യേകമായി മശീഹാവിനെ സൂചിപ്പിക്കാം; അവന്റെ മാതൃകയിൽ പങ്കുചേരുന്ന വിശ്വാസികളെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ പാപവുമായി നിർണായകമായി ബന്ധം വിച്ഛേദിക്കുന്നതിനെക്കുറിച്ചുള്ള ഒരു പൊതുതത്ത്വമായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: മശീഹാ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേര് അർത്ഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ‘മശീഹാ’ ഉപയോഗിച്ചു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: παθόντος
  choice: കഷ്ടം അനുഭവിച്ചതിനാൽ
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തിന്റെ കാല-കാരണ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: σαρκὶ
  choice: ജഡത്തിൽ
  rationale: σάρξ എന്ന പദത്തിന്റെ ആവർത്തനവും ശരീരപരമായ മനുഷ്യജീവിതത്തെ സൂചിപ്പിക്കുന്ന രൂപകാത്മക സാന്ദ്രതയും നിലനിർത്തുന്നു; ‘പാപസ്വഭാവം’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἔννοιαν
  choice: മനോഭാവം
  rationale: ചിന്ത, ഉദ്ദേശ്യം, ദൃഢനിശ്ചയം എന്നിവ ഉൾക്കൊള്ളുന്ന സന്ദർഭോചിതമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ὁπλίσασθε
  choice: ആയുധമായി ധരിക്കുവിൻ
  rationale: മധ്യമപ്രയോഗത്തിലുള്ള സൈനിക രൂപകം നിലനിർത്തുകയും അതേ മനോഭാവം സ്വയം സ്വീകരിക്കണമെന്ന ആഹ്വാനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: തുടർന്നുവരുന്ന വാക്യം ആഹ്വാനത്തിന്റെ അടിസ്ഥാനകാരണം നൽകുന്നതായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ὁ παθὼν
  choice: കഷ്ടം അനുഭവിച്ചവൻ
  rationale: കൃതന്തത്തിന്റെ പൊതുവായ, എന്നാൽ നിർദിഷ്ടമാക്കാത്ത പരാമർശം സംരക്ഷിക്കുന്നു.
- source_word: πέπαυται
  choice: വിരമിച്ചിരിക്കുന്നു
  rationale: പ്രവൃത്തി അവസാനിച്ച് അതിന്റെ ഫലം തുടരുന്നു എന്ന പൂർണകാല ഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἁμαρτίας
  choice: പാപത്തിൽനിന്ന്
  rationale: παύω-യോടൊപ്പമുള്ള വേർപാടിന്റെ അർത്ഥവും ഏകവചനമായ ‘പാപം’ എന്ന ഗ്രീക്ക് രൂപവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ജഡത്തിൽ കഷ്ടം അനുഭവിച്ചവൻ പാപത്തിൽനിന്ന് വിരമിച്ചിരിക്കുന്നു’ എന്ന വാക്യത്തിന്റെ സൂചിതവ്യക്തിയും വ്യാപ്തിയും
  choice: വാക്യം മശീഹാവിനെ മാത്രമോ വിശ്വാസികളെയോ പൊതുതത്ത്വത്തെയോ സൂചിപ്പിക്കുന്നു എന്ന് മുഖ്യപാഠത്തിൽ നിർണ്ണയിക്കാതെ ഗ്രീക്കിന്റെ സാന്ദ്രവും വിശാലവുമായ രൂപം നിലനിർത്തി.
  alternative: ഇത് മശീഹാവിനെ മാത്രം സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ കഷ്ടാനുഭവത്തിലൂടെ പാപത്തിന്റെ ആധിപത്യവുമായി നിർണായകമായി ബന്ധം വിച്ഛേദിക്കുന്ന വിശ്വാസികളെ സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ പാപജീവിതത്തിൽനിന്നുള്ള നിർണായക വേർപാടിനെക്കുറിച്ചുള്ള പൊതുതത്ത്വമാണ്.
  rationale: ഗ്രീക്ക് വാക്യം വ്യാഖ്യാനപരമായി തർക്കവിധേയമാണ്. മൂലപാഠത്തിലില്ലാത്ത വിശദീകരണം ചേർത്ത് ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ അത് അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആയുധമായി ധരിക്കുവിൻ’ എന്ന പ്രയോഗം സൈനിക രൂപകം നിലനിർത്തുന്നു. ‘ജഡത്തിൽ’ എന്ന ആവർത്തനം ഗ്രീക്ക് പാഠത്തിന്റെ വാക്യഘടനാപരമായ ബന്ധം സംരക്ഷിക്കുന്നു.
