id: 1PE.4.8
reference: 1 Peter 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: ml
  text: എല്ലാറ്റിനുമുപരിയായി, പരസ്പരം തീവ്രമായ സ്നേഹം പുലർത്തുക[a]; കാരണം സ്നേഹം അനേകം പാപങ്ങളെ മൂടുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരസ്പരം ആത്മാർഥമായ സ്നേഹം പുലർത്തുക.” മൂലപദത്തിന് തീവ്രമായ, ആത്മാർഥമായ, സ്ഥിരമായ എന്നീ അർഥഭാവങ്ങൾ ഉണ്ടാകാം. മൂലവാക്യഘടന കൂടുതൽ അക്ഷരാർഥത്തിൽ, “പരസ്പരം തീവ്രമായ സ്നേഹമുള്ളവരായിരിക്കുക” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്കുകൾ സദൃശവാക്യങ്ങൾ 10:12-നെ അനുസ്മരിപ്പിക്കുന്നു. ഇവിടെ “മൂടുന്നു” എന്നത് കുറ്റങ്ങൾ വളർത്താതിരിക്കുകയോ അവയെ അവഗണിക്കുകയോ മറച്ചുവെക്കുകയോ ചെയ്യുന്ന അർഥത്തിലും മനസ്സിലാക്കാം; രൂപകം ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാൻ മൂലപാഠം നിർബന്ധിക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: πρὸ πάντων
  choice: എല്ലാറ്റിനുമുപരി
  rationale: കാലക്രമത്തെക്കാൾ മുൻഗണനയും പരമപ്രാധാന്യവും സൂചിപ്പിക്കുന്ന പ്രയോഗം; ആഹ്വാനത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς ἑαυτοὺς
  choice: പരസ്പരം
  rationale: സമൂഹത്തിനുള്ളിലെ അന്യോന്യബന്ധം സൂചിപ്പിക്കുന്ന പ്രത്യയപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ἀγάπη എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപരിഭാഷ.
- source_word: ἐκτενῆ
  choice: ആത്മാർഥമായ
  rationale: പൂർണമായ ശ്രദ്ധയോടും ഗൗരവത്തോടും നിലനിൽക്കുന്ന സ്നേഹത്തിന്റെ ഭാവം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കുപദത്തിലുള്ള തീവ്രതയുടെയും സ്ഥിരോത്സാഹത്തിന്റെയും അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἔχοντες
  choice: പുലർത്തുക
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തെ തുടരുന്ന വർത്തമാനകാല പങ്കാളിക്രിയയുടെ പ്രേരണാത്മക ബലം മലയാളത്തിലെ സ്വാഭാവികമായ ആജ്ഞാരൂപത്തിൽ നൽകുന്നു; കൈവശംവെക്കുക, തുടർന്നുകൊണ്ടുപോകുക എന്നീ ഭാവങ്ങളും ‘പുലർത്തുക’ ഉൾക്കൊള്ളുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: തുടർന്നുവരുന്നത് ആഹ്വാനത്തിന്റെ കാരണമാണെന്ന് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: καλύπτει
  choice: മൂടുന്നു
  rationale: സദൃശവാക്യങ്ങൾ 10:12-നെ അനുസ്മരിപ്പിക്കുന്ന മൂലരൂപകം നിലനിർത്തുന്നു; അവഗണിക്കുന്നു, മറച്ചുവെക്കുന്നു, ക്ഷമിക്കുന്നു എന്നിവയിൽ ഒന്നായി മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: πλῆθος ἁμαρτιῶν
  choice: അനേകം പാപങ്ങളെ
  rationale: ‘പാപങ്ങളുടെ ബഹുത്വം’ എന്ന വാക്കുതോറുമുള്ളെങ്കിലും അസ്വാഭാവികമായ രൂപത്തിന് പകരം, വലിയൊരു സംഖ്യ എന്ന ആശയവും വാക്യത്തിന്റെ പ്രഭാവവും വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘സ്നേഹം അനേകം പാപങ്ങളെ മൂടുന്നു’ എന്നതിന്റെ അർഥം
  choice: ‘മൂടുന്നു’ എന്ന രൂപകം വിശദീകരിച്ച് ഒറ്റ വ്യാഖ്യാനമായി ചുരുക്കാതെ നിലനിർത്തി.
  alternative: സ്നേഹം അനേകം കുറ്റങ്ങൾ അവഗണിക്കുന്നു; സ്നേഹം അനേകം പാപങ്ങൾക്ക് ക്ഷമ ലഭ്യമാക്കുന്നു; സ്നേഹം കുറ്റങ്ങൾ ഇളക്കിവിടാതെ മറച്ചുവെക്കുന്നു.
  rationale: ഗ്രീക്കുവാക്യം സദൃശവാക്യസ്വഭാവമുള്ളതും സദൃശവാക്യങ്ങൾ 10:12-നെ അനുസ്മരിപ്പിക്കുന്നതുമാണ്. പാപങ്ങൾ ആരുടേതാണെന്നോ ‘മൂടൽ’ കൃത്യമായി ഏതു പ്രക്രിയയെ സൂചിപ്പിക്കുന്നുവെന്നോ വാക്യം നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ കർമ്മഫലപരമോ പ്രായശ്ചിത്തപരമോ വെറും മാനസികമോ ആയ പ്രത്യേക വായന വിവർത്തനത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പുലർത്തുക’ എന്ന പ്രയോഗം ആഹ്വാനത്തിന്റെ തുടർച്ചയും സ്നേഹത്തിന്റെ നിലനിൽപ്പും സ്വാഭാവികമായി അറിയിക്കുന്നു. ‘മൂടുന്നു’ എന്ന പ്രധാന രൂപകം ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വത്തോടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
