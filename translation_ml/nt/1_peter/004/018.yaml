  source_fidelity: The main rendering accurately retains the representative singular, the difficulty expressed by μόλις, the present passive sense of σῴζεται, the distinct pair ‘ungodly’ and ‘sinner,’ and the rhetorical future question. However, ‘തന്നെ’ introduces an emphatic ‘himself/even’ not present in the Greek, and its attachment to ‘നീതിമാൻ’ is orthographically defective.
