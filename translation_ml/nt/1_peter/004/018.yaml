id: 1PE.4.18
reference: 1 Peter 4:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: ml
  text: നീതിമാൻ പ്രയാസത്തോടെ രക്ഷിക്കപ്പെടുന്നുവെങ്കിൽ[a], ദൈവഭക്തിയില്ലാത്തവനും പാപിയും എവിടെ പ്രത്യക്ഷപ്പെടും[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കഷ്ടിച്ചാണ് രക്ഷിക്കപ്പെടുന്നതെങ്കിൽ’ അല്ലെങ്കിൽ ‘വളരെ പ്രയാസപ്പെട്ട് രക്ഷിക്കപ്പെടുന്നതെങ്കിൽ.’ ഇവിടെ നീതിമാൻ കഠിനപരീക്ഷകളിലൂടെ രക്ഷയിലേക്കു കടക്കുന്നതാണ് സൂചന; രക്ഷതന്നെ അനിശ്ചിതമാണെന്നല്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദൈവഭക്തിയില്ലാത്തവനും പാപിയും എവിടെ കാണപ്പെടും?’
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιος
  choice: നീതിമാൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഏകവചന വിശേഷണം പ്രതിനിധാനപരമായ നാമപ്രയോഗമാണ്. മലയാളത്തിലെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ‘നീതിമാൻ’ ആ ഏകവചനവും സദൃശവാക്യശൈലിയും നിലനിർത്തുന്നു.
- source_word: μόλις
  choice: പ്രയാസത്തോടെ
  rationale: μόλις ഇവിടെ പ്രയാസം, കഠിനത, അല്ലെങ്കിൽ കഷ്ടിച്ചുള്ള കടന്നുപോക്ക് സൂചിപ്പിക്കാം. ‘പ്രയാസത്തോടെ’ എന്നത് അന്തിമരക്ഷ അനിശ്ചിതമാണെന്ന് നിർബന്ധമായി സൂചിപ്പിക്കാതെ മൂലപദത്തിന്റെ ആശയവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: σῴζεται
  choice: രക്ഷിക്കപ്പെടുന്നു
  rationale: σῴζω എന്ന ക്രിയയുടെ വർത്തമാനകാല കർമണി/മധ്യമ രൂപം. പൊതുസത്യസ്വഭാവമുള്ള ഈ വാക്യത്തിൽ ‘രക്ഷിക്കപ്പെടുന്നു’ സ്വാഭാവികവും രൂപപരമായി യോജിച്ചതുമാണ്.
- source_word: ἀσεβής
  choice: ദൈവഭക്തിയില്ലാത്തവൻ
  rationale: ദൈവത്തോടുള്ള ഭക്തിയോ ആദരമോ ഇല്ലാത്തവൻ എന്ന മത-നൈതിക അർഥം വ്യക്തമായി നൽകുന്നു; ἁμαρτωλός എന്നതിൽനിന്നുള്ള വ്യത്യാസവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἁμαρτωλός
  choice: പാപി
  rationale: സാധാരണവും കൃത്യവുമായ മലയാള പദം. മുൻപുള്ള ἀσεβής എന്ന വിശേഷണവുമായി ലയിപ്പിക്കാതെ രണ്ടാമത്തെ സ്വതന്ത്ര വിവരണമായി നിലനിർത്തുന്നു.
- source_word: ποῦ
  choice: എവിടെ
  rationale: ചോദ്യക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക വിവർത്തനം; വാക്യത്തിന്റെ ആലങ്കാരിക ചോദ്യശക്തി നിലനിർത്തുന്നു.
- source_word: φανεῖται
  choice: പ്രത്യക്ഷപ്പെടും
  rationale: φαίνωയുടെ ഭാവികാല മധ്യമരൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘പ്രത്യക്ഷപ്പെടുക’ എന്നാണ്. ന്യായവിധിയുടെ മുമ്പിൽ എവിടെ നിലകൊള്ളും/കാണപ്പെടും എന്ന സൂചന വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ മൂലത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: μόλις σῴζεται എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: നീതിമാന്റെ രക്ഷയോടനുബന്ധിച്ച പ്രയാസത്തെയും കഠിനപരീക്ഷയെയും തുറന്ന നിലയിൽ സൂചിപ്പിക്കുന്ന ‘പ്രയാസത്തോടെ രക്ഷിക്കപ്പെടുന്നു’ എന്ന രൂപം
  alternative: ‘കഷ്ടിച്ചാണ് രക്ഷിക്കപ്പെടുന്നത്’ എന്നത് രക്ഷയുടെ അന്തിമഫലം അനിശ്ചിതമാണെന്ന ധാരണ കൂടുതൽ ശക്തമാക്കാം
  rationale: സമീപസന്ദർഭം കഷ്ടാനുഭവത്തെയും ദൈവന്യായവിധി ദൈവഭവനത്തിൽ ആരംഭിക്കുന്നതിനെയും കുറിച്ചാണ്. അതിനാൽ പാഠത്തിലെ ഗൗരവവും പിരിമുറുക്കവും നിലനിർത്തിക്കൊണ്ട് രക്ഷ അനിശ്ചിതമാണെന്ന സിദ്ധാന്തപരമായ നിഗമനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: പ്രതിനിധാനപരമായ ഏകവചന പുല്ലിംഗം
  choice: ‘നീതിമാൻ’ എന്ന ഏകവചനരൂപം നിലനിർത്തുക
  alternative: ‘നീതിമാന്മാർ’ അല്ലെങ്കിൽ ‘നീതിയുള്ള വ്യക്തി’
  rationale: ഗ്രീക്കിൽ ആർട്ടിക്കിളോടുകൂടിയ ഏകവചന പുല്ലിംഗരൂപമാണ്; അത് പൊതുവായ ഒരു വിഭാഗത്തെ പ്രതിനിധാനം ചെയ്യുന്നു. ഏകവചനം സദൃശവാക്യത്തിന്റെ സംക്ഷിപ്തതയും മൂലരൂപവും കാത്തുസൂക്ഷിക്കുന്നു.
- issue: φανεῖται എന്നതിന്റെ ന്യായവിധിസംബന്ധമായ അർഥം
  choice: ‘എവിടെ പ്രത്യക്ഷപ്പെടും?’ എന്ന തുറന്ന ചോദ്യരൂപം
  alternative: ‘എവിടെ കണ്ടെത്തപ്പെടും?’ അല്ലെങ്കിൽ ‘എങ്ങനെ നിലനിൽക്കും?’
  rationale: ‘നിലനിൽക്കും’ എന്നത് വ്യാഖ്യാനപരമായി സാധ്യമെങ്കിലും മൂലത്തിൽ നേരിട്ട് ഇല്ല. ‘പ്രത്യക്ഷപ്പെടും’ എന്നത് സാദ്ധ്യമായ സദൃശവാക്യപ്രതിധ്വനിയും ആലങ്കാരിക അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സദൃശവാക്യശൈലി സ്വീകരിച്ചു. ‘ദൈവഭക്തിയില്ലാത്തവൻ’ എന്നും ‘പാപി’ എന്നും രണ്ടു ഗ്രീക്ക് വിശേഷണങ്ങളും വേർതിരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
