id: 1PE.4.6
reference: 1 Peter 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: ml
  text: 'ഇതിനുവേണ്ടിയാണല്ലോ മരിച്ചവർക്കും സുവിശേഷം അറിയിക്കപ്പെട്ടത്: അവർ ജഡത്തിൽ മനുഷ്യരുടെ മാനദണ്ഡപ്രകാരം വിധിക്കപ്പെട്ടാലും[a], ആത്മാവിൽ[b] ദൈവത്തിന്റെ മാനദണ്ഡപ്രകാരം ജീവിക്കേണ്ടതിന്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘മനുഷ്യർക്കൊത്തവണ്ണം’ / ‘മനുഷ്യരുടെ കാഴ്ചപ്പാടിൽ.’ ഗ്രീക്കിലെ പ്രയോഗം ദൈവത്തോടുള്ള വിരോധത്തിൽ മനുഷ്യരുടെ മാനദണ്ഡമോ കാഴ്ചപ്പാടോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘ആത്മീയനിലയിൽ.’ ഈ പദം ജഡജീവിതത്തിനു വിരുദ്ധമായ ആത്മീയജീവിതത്തിന്റെ മണ്ഡലത്തെ സൂചിപ്പിക്കാം; ചിലർ ഇത് കൂടുതൽ വ്യക്തമായി പരിശുദ്ധാത്മാവിനാൽ ലഭിക്കുന്ന ജീവിതമായി മനസ്സിലാക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: ഇതിനുവേണ്ടിയാണല്ലോ
  rationale: മുൻചർച്ചയ്ക്ക് വിശദീകരണം നൽകുന്ന ഉദ്ദേശ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; γάρ-ന്റെ വിശദീകരണഭാവം ‘ആണല്ലോ’ സൂചിപ്പിക്കുന്നു.
- source_word: νεκροῖς
  choice: മരിച്ചവരോടും
  rationale: ദാതിവ് ബഹുവചന വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു. ഇവർ എപ്പോൾ അല്ലെങ്കിൽ ഏതു അർഥത്തിൽ ‘മരിച്ചവർ’ ആണെന്ന് വിവർത്തനം നിർണ്ണയിക്കുന്നില്ല.
- source_word: εὐηγγελίσθη
  choice: സുവിശേഷം അറിയിക്കപ്പെട്ടത്
  rationale: εὐαγγελίζω എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപം; സുവിശേഷം അറിയിച്ചുവെന്ന അർഥം ആധുനികവും സഭാപരമായ അതിവിശിഷ്ട പദപ്രയോഗം ഒഴിവാക്കുന്നതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ἵνα
  choice: ജീവിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵνα-വാക്യത്തിന്റെ ലക്ഷ്യാർഥം മലയാളത്തിലെ ‘-േണ്ടതിന്’ ഘടനയിൽ നൽകുന്നു.
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: വിധിക്കപ്പെട്ടാലും ... ജീവിക്കേണ്ടതിന്
  rationale: μὲν...δὲ വിരോധഘടനയുടെ concessive ഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘-ആലും’ ഉപയോഗിച്ച് വ്യക്തമാക്കുന്നു; വിധിയുടെ നിഷ്ക്രിയതയും ജീവിതത്തിന്റെ ഉദ്ദേശ്യവും നിലനിർത്തുന്നു.
- source_word: κατὰ ἀνθρώπους
  choice: മനുഷ്യരുടെ മാനദണ്ഡപ്രകാരം
  rationale: κατά ഇവിടെ മാനദണ്ഡമോ കാഴ്ചപ്പാടോ സൂചിപ്പിക്കുന്നു. ἀνθρώπους പ്രതിനിധാനപരമായി മനുഷ്യരെ പൊതുവേ സൂചിപ്പിക്കുന്നതിനാൽ ഉൾക്കൊള്ളുന്ന ‘മനുഷ്യർ’ ഉപയോഗിക്കുന്നു.
- source_word: σαρκὶ
  choice: ജഡത്തിൽ
  rationale: πνεύματι-യോടുള്ള ബോധപൂർവമായ വിരോധം നിലനിർത്തുന്നു; ഇത് ‘പാപസ്വഭാവം’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: κατὰ θεὸν
  choice: ദൈവത്തിന്റെ മാനദണ്ഡപ്രകാരം
  rationale: κατὰ ἀνθρώπους എന്നതിനോടുള്ള സമാന്തരത നിലനിർത്തി ദൈവിക മാനദണ്ഡമോ കാഴ്ചപ്പാടോ സൂചിപ്പിക്കുന്നു.
- source_word: πνεύματι
  choice: ആത്മാവിൽ
  rationale: σαρκί-ക്കു സമാന്തരമായ ദാതിവ് ഓഫ് സ്ഫിയർ എന്ന വായന മുൻനിർത്തുന്നു; ഇത് മനുഷ്യാത്മാവാണോ പരിശുദ്ധാത്മാവിനോടു ബന്ധപ്പെട്ട ജീവിതമാണോ എന്ന് മുഖ്യവാചകം നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ‘മരിച്ചവർ’ ആരാണ്?
  choice: ‘മരിച്ചവർ’ എന്ന് നിഷ്പക്ഷമായി വിവർത്തനം ചെയ്തു.
  alternative: ഇപ്പോൾ ശാരീരികമായി മരിച്ചവരായെങ്കിലും ജീവിച്ചിരിക്കുമ്പോൾ സുവിശേഷം കേട്ടവർ; ആത്മീയമായി മരിച്ചവർ; 3:19-ലെ തടവിലുള്ള ആത്മാക്കളോടുള്ള പ്രഖ്യാപനവുമായി ബന്ധമുള്ള മരിച്ചവർ.
  rationale: വാക്യം ഇവരിൽ ഏതു വിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമായി നിർവചിക്കുന്നില്ല; അതിനാൽ ഒരു പ്രത്യേക മരണാനന്തരാവസ്ഥാ സിദ്ധാന്തം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ‘ജഡത്തിൽ വിധിക്കപ്പെട്ടാലും ... ആത്മാവിൽ ജീവിക്കുക’ എന്ന വിരോധത്തിന്റെ അർഥം
  choice: മനുഷ്യരുടെ മാനദണ്ഡവും ദൈവത്തിന്റെ മാനദണ്ഡവും, ജഡവും ആത്മാവും തമ്മിലുള്ള വിരോധം നിർവചിക്കാതെ നിലനിർത്തി.
  alternative: ശാരീരികജീവിതത്തിൽ മനുഷ്യരാൽ കുറ്റംവിധിക്കപ്പെടുക; എല്ലാ മനുഷ്യരെയുംപോലെ ശാരീരികമരണം അനുഭവിക്കുക; ജഡത്തിൽ ദൈവവിധി ഏറ്റിട്ടും ആത്മീയമായി ജീവിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യഘടന പല അടുത്തബന്ധമുള്ള വ്യാഖ്യാനങ്ങൾ അനുവദിക്കുന്നു. മുഖ്യവാചകം അവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ജഡം/ആത്മാവ്’ എന്ന ഉറവിടവിരോധം സംരക്ഷിച്ചു; വ്യാഖ്യാനവിവാദങ്ങൾ അടിക്കുറിപ്പുകളിലും തീരുമാനക്കുറിപ്പുകളിലും തുറന്നുവെച്ചു.
