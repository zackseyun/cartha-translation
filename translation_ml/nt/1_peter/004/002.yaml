id: 1PE.4.2
reference: 1 Peter 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: ml
  text: ജഡത്തിൽ ജീവിക്കാനുള്ള ശേഷിക്കുന്ന കാലം ഇനി മനുഷ്യരുടെ മോഹങ്ങൾക്കനുസരിച്ചല്ല, ദൈവത്തിന്റെ ഹിതമനുസരിച്ച് ജീവിക്കുന്നതിന്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജഡത്തിൽ’ എന്നത് ഇവിടെ ശരീരത്തോടെയുള്ള ഈ ഭൂമിയിലെ ജീവിതത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പാപസ്വഭാവം’ എന്ന അർഥം നിർബന്ധമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: ജീവിക്കേണ്ടതിന്
  rationale: മുൻവാക്യവുമായി ബന്ധപ്പെടുന്ന ഉദ്ദേശ്യഫലം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μηκέτι
  choice: ഇനി ... അല്ല
  rationale: മുമ്പുണ്ടായിരുന്ന ജീവിതരീതി അവസാനിപ്പിക്കുന്നതിന്റെ അർഥം നൽകുന്നു.
- source_word: ἀνθρώπων ἐπιθυμίαις
  choice: മനുഷ്യരുടെ മോഹങ്ങൾക്കനുസരിച്ച്
  rationale: ἀνθρώπων എന്നത് എല്ലാ മനുഷ്യരെയും പൊതുവായി സൂചിപ്പിക്കുന്നു; ἐπιθυμίαις എന്നത് ലൈംഗിക അർഥത്തിൽ മാത്രം ഒതുങ്ങാത്ത ശക്തമായ ആഗ്രഹങ്ങളാണ്. ദ്വിതീയാവിഭക്തിയുടെ മാനദണ്ഡമോ നിയന്ത്രണമോ സൂചിപ്പിക്കുന്ന ബലം ‘അനുസരിച്ച്’ വ്യക്തമാക്കുന്നു.
- source_word: ἀλλὰ θελήματι θεοῦ
  choice: ദൈവത്തിന്റെ ഹിതമനുസരിച്ച്
  rationale: മനുഷ്യരുടെ മോഹങ്ങളും ദൈവത്തിന്റെ ഹിതവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം നിലനിർത്തുകയും സമാന്തരമായ ദ്വിതീയാവിഭക്തി ഘടന പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: ശേഷിക്കുന്ന കാലം
  rationale: ഈ ഭൂമിയിലെ ജീവിതത്തിൽ ഇനിയും ബാക്കിയുള്ള സമയത്തെ ലളിതമായും കൃത്യമായും സൂചിപ്പിക്കുന്നു.
- source_word: ἐν σαρκὶ
  choice: ജഡത്തിൽ
  rationale: σάρξ എന്ന പദത്തിന്റെ രൂപകാത്മക സാധ്യത ഇല്ലാതാക്കാതെ മൂലഭാഷയോട് അടുപ്പം പാലിക്കുന്നു; ഇവിടെ മുഖ്യമായി ഉദ്ദേശിക്കുന്നത് ശരീരധാരിയായ ഭൗമിക ജീവിതമാണ്.
- source_word: βιῶσαι
  choice: ജീവിക്കേണ്ടതിന്
  rationale: ശേഷിക്കുന്ന ജീവിതകാലം എങ്ങനെ നയിക്കണം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐν σαρκὶ എന്നതിലെ σάρξ-ന്റെ അർഥം
  choice: ശരീരധാരിയായ ഭൗമിക ജീവിതത്തെ സൂചിപ്പിക്കുന്ന ‘ജഡത്തിൽ’
  alternative: പാപസ്വഭാവത്തിൽ
  rationale: സന്ദർഭം വിശ്വാസിയുടെ ശേഷിക്കുന്ന മർത്യജീവിതത്തെക്കുറിച്ചാണ്; ‘പാപസ്വഭാവം’ എന്നു വിവർത്തനം ചെയ്താൽ ഗ്രീക്ക് പ്രയോഗത്തിൽ ഇവിടെ നിർബന്ധമല്ലാത്ത ഒരു പ്രത്യേക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ജഡത്തിൽ’ എന്ന പരമ്പരാഗത പദം മൂലത്തിലെ സാർഥകമായ തുറന്ന നില സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു; തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
