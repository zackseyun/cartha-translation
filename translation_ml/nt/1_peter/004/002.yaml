    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek purpose construction without introducing an unwarranted sense of obligation, and it attaches ‘in the flesh’ more naturally to the act of living. The lexical clarification concerning σάρξ is retained unchanged.
