id: 1PE.1.21
reference: 1 Peter 1:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοὺς δι’ αὐτοῦ ⸀πιστοὺς εἰς θεὸν τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα, ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: ml
  text: അവനിലൂടെ ദൈവത്തിൽ വിശ്വസിക്കുന്നവരാണ് നിങ്ങൾ[a]. ആ ദൈവമാണ് അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കുകയും അവനു മഹത്ത്വം നൽകുകയും ചെയ്തത്. അങ്ങനെ[b] നിങ്ങളുടെ വിശ്വാസവും പ്രത്യാശയും ദൈവത്തിൽ ആയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘വിശ്വസ്തരായവർ’. എന്നാൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് ക്രിസ്തുവിലൂടെ ദൈവത്തിൽ വിശ്വസിക്കുന്നവരെയായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘അതിന്റെ ഫലമായി നിങ്ങളുടെ വിശ്വാസവും പ്രത്യാശയും ദൈവത്തിൽ ആയിരിക്കുന്നു.’
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെ
  rationale: διά + genitive ഇവിടെ മധ്യസ്ഥമായ മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു. ക്രിസ്തുവിലൂടെയാണ് അവർ ദൈവത്തിൽ വിശ്വസിക്കുന്നത് എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πιστούς εἰς θεόν
  choice: ദൈവത്തിൽ വിശ്വസിക്കുന്നവർ
  rationale: πιστός എന്നതിന് ‘വിശ്വസ്തർ’ എന്നും അർഥമുണ്ടാകാമെങ്കിലും, εἰς θεόν എന്ന ഘടന ഇവിടെ ദൈവത്തിൽ വിശ്വസിക്കുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: ആ ദൈവമാണ് അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചത്
  rationale: പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘മരിച്ചവരിൽനിന്ന്’ എന്നത് ἐκ νεκρῶν എന്ന ബഹുവചനപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: δόξαν αὐτῷ δόντα
  choice: അവനു മഹത്ത്വം നൽകിയത്
  rationale: ദൈവം ക്രിസ്തുവിന് മഹത്ത്വം നൽകിയെന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മുൻപുള്ള participle-നോടുള്ള സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: ὥστε
  choice: അങ്ങനെ
  rationale: ദൈവം ക്രിസ്തുവിനെ ഉയിർപ്പിക്കുകയും മഹത്ത്വപ്പെടുത്തുകയും ചെയ്തതിൽനിന്ന് തുടർന്നുവരുന്ന ഫലമോ ഉദ്ദേശ്യമോ അമിതമായി നിർണയിക്കാതെ ബന്ധിപ്പിക്കുന്നു.
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα
  choice: നിങ്ങളുടെ വിശ്വാസവും പ്രത്യാശയും
  rationale: πίστις, ἐλπίς എന്നീ പദങ്ങളുടെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: εἶναι εἰς θεόν
  choice: ദൈവത്തിൽ ആയിരിക്കുന്നു
  rationale: വിശ്വാസത്തിന്റെയും പ്രത്യാശയുടെയും ലക്ഷ്യം ദൈവമാണെന്ന ദിശാസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; വാക്യത്തിലെ ആവർത്തിച്ച εἰς θεόν എന്ന ആശയവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: πιστούς എന്ന പദത്തിന്റെ അർഥം
  choice: ക്രിസ്തുവിലൂടെ ദൈവത്തിൽ വിശ്വസിക്കുന്നവർ
  alternative: വിശ്വസ്തർ
  rationale: εἰς θεόν എന്ന അനുബന്ധഘടന വിശ്വസ്തത എന്ന പൊതുഗുണത്തേക്കാൾ വിശ്വാസത്തിന്റെ ലക്ഷ്യമായ ദൈവത്തെ സൂചിപ്പിക്കുന്നു; എങ്കിലും പദത്തിന്റെ മറ്റൊരു സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ദൈവത്തിലേക്കുള്ള ബന്ധത്തിൽ ക്രിസ്തുവിന്റെ പങ്ക്
  choice: ‘അവനിലൂടെ’ എന്നത് ക്രിസ്തുവിന്റെ മധ്യസ്ഥമായ പങ്കിനെ സൂചിപ്പിക്കുന്നു
  alternative: ‘അവൻ നിമിത്തം’ എന്ന കൂടുതൽ അയഞ്ഞ കാരണാർഥം
  rationale: διά + genitive എന്ന വ്യാകരണഘടന മാർഗമോ മധ്യസ്ഥതയോ സൂചിപ്പിക്കുന്നു; പാഠം പറയുന്നതിലധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ὥστε എന്നതിന്റെ ബലം
  choice: ഫലത്തെയും ഉദ്ദേശ്യത്തെയും പൂർണമായി വേർതിരിക്കാത്ത ‘അങ്ങനെ’
  alternative: ‘അതിന്റെ ഫലമായി’
  rationale: ക്രിസ്തുവിനെ ഉയിർപ്പിക്കുകയും മഹത്ത്വം നൽകുകയും ചെയ്ത ദൈവത്തിന്റെ പ്രവൃത്തിയിൽനിന്ന് വിശ്വാസവും പ്രത്യാശയും ദൈവത്തിലേക്കാകുന്നു എന്ന ബന്ധം നിലനിർത്തുന്നു; ശുദ്ധഫലം മാത്രമാണെന്ന് നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘മഹത്ത്വം’, ‘വിശ്വാസം’, ‘പ്രത്യാശ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാനായി രണ്ട് വാക്യങ്ങളാക്കി.
