  verdict: revise
  source_fidelity: The translation accurately retains both the prior non-seeing (οὐκ ἰδόντες) and present non-seeing (ἄρτι μὴ ὁρῶντες), love, belief directed toward him (εἰς ὃν πιστεύοντες), and present exultant rejoicing. ‘പറഞ്ഞറിയിക്കാനാവാത്ത’ suitably conveys ἀνεκλαλήτῳ. ‘മഹത്വം നിറഞ്ഞ’ is a natural contextual rendering of δεδοξασμένῃ, while the footnote preserves the more formally passive alternative.
