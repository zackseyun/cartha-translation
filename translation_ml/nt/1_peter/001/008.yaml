id: 1PE.1.8
reference: 1 Peter 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: ml
  text: നിങ്ങൾ അവനെ കണ്ടിട്ടില്ലെങ്കിലും സ്നേഹിക്കുന്നു. ഇപ്പോൾ അവനെ കാണുന്നില്ലെങ്കിലും, അവനിൽ വിശ്വസിച്ചുകൊണ്ട്, പറഞ്ഞറിയിക്കാനാവാത്തതും മഹത്വം നിറഞ്ഞതുമായ[a] ആനന്ദത്തോടെ ആഹ്ലാദിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മഹത്വീകരിക്കപ്പെട്ടതുമായ’ അല്ലെങ്കിൽ ‘മഹത്വപൂർണമായ.’
    reason: δεδοξασμένῃ എന്ന പദം രൂപപരമായി ‘മഹത്വീകരിക്കപ്പെട്ട’ എന്നും ആശയപരമായി ‘മഹത്വപൂർണമായ’ എന്നും ഗ്രഹിക്കാം.
lexical_decisions:
- source_word: ὃν
  choice: അവനെ
  rationale: മുൻസന്ദർഭത്തിലെ യേശുക്രിസ്തുവിനെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ കർമരൂപം ഉപയോഗിച്ചു.
- source_word: οὐκ ἰδόντες
  choice: കണ്ടിട്ടില്ലെങ്കിലും
  rationale: ഭൂതകാലത്തെ കാണാതിരിപ്പിന് ഇപ്പോഴത്തെ പ്രസക്തിയുണ്ടെന്ന അർഥവും മുഖ്യക്രിയയോടുള്ള concessive ബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀγαπᾶτε
  choice: സ്നേഹിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ തുടരുന്ന സ്നേഹം ലളിതവും സാധാരണവുമായ മലയാളത്തിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: εἰς ὃν ... πιστεύοντες
  choice: അവനിൽ വിശ്വസിച്ചുകൊണ്ട്
  rationale: εἰς സഹിതമുള്ള πιστεύω വിശ്വാസത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; ‘അവനിൽ വിശ്വസിക്കുക’ മലയാളത്തിൽ വ്യക്തവും പതിവുമായ പ്രയോഗമാണ്.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: ഇപ്പോൾ അവനെ കാണുന്നില്ലെങ്കിലും
  rationale: ഇപ്പോഴത്തെ കാണാതിരിപ്പ് നിലനിർത്തുകയും വാക്യത്തിലെ concessive ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀγαλλιᾶσθε
  choice: അത്യന്തം സന്തോഷിക്കുന്നു
  rationale: ക്രിയയിലെ തീവ്രവും ആഹ്ലാദപൂർണവുമായ സന്തോഷം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി എത്തിക്കുന്നു.
- source_word: χαρᾷ
  choice: ആനന്ദത്തോടെ
  rationale: ക്രിയയോടൊപ്പമുള്ള രീതിസൂചക ദത്തിവിനെ സ്വാഭാവികമായ ‘-ത്തോടെ’ രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀνεκλαλήτῳ
  choice: പറഞ്ഞറിയിക്കാനാവാത്തതും
  rationale: വാക്കുകളാൽ പൂർണമായി പ്രകടിപ്പിക്കാനാവാത്ത ആനന്ദം എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: δεδοξασμένῃ
  choice: മഹത്ത്വം നിറഞ്ഞതുമായ
  rationale: പൂർണ്ണ കർമണി പങ്കാളികയുടെ മഹത്ത്വബന്ധം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ അസ്വാഭാവികമായ ‘മഹത്ത്വീകരിക്കപ്പെട്ട ആനന്ദം’ ഒഴിവാക്കുന്നു; രൂപപരമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: εἰς ὃν സഹിതമുള്ള πιστεύοντες എന്ന പ്രയോഗം
  choice: അവനിൽ വിശ്വസിച്ചുകൊണ്ട്
  alternative: അവനിൽ ആശ്രയിച്ചുകൊണ്ട്
  rationale: ഇവിടെ വിശ്വാസത്തിന്റെ ലക്ഷ്യം ക്രിസ്തുവാണെന്നത് നേരിട്ട് പ്രകടമാക്കുന്നു; ‘ആശ്രയിക്കുക’ വിശ്വാസത്തിന്റെ ഒരു അർഥനിറം മാത്രമായതിനാൽ മുഖ്യപാഠത്തിൽ അതിലേക്ക് ചുരുക്കിയില്ല.
- issue: δεδοξασμένῃ χαρᾷ എന്ന പ്രയോഗം
  choice: മഹത്ത്വം നിറഞ്ഞതുമായ ആനന്ദം
  alternative: മഹത്ത്വീകരിക്കപ്പെട്ട ആനന്ദം; മഹത്ത്വപൂർണമായ ആനന്ദം
  rationale: ഗ്രീക്കിലെ പൂർണ്ണ കർമണി രൂപത്തിന് ‘മഹത്ത്വീകരിക്കപ്പെട്ട’ എന്ന കൂടുതൽ രൂപസമാനമായ പരിഭാഷ സാധ്യമാണെങ്കിലും അത് മലയാളത്തിൽ ദുർഗ്രാഹ്യമാണ്. ‘മഹത്ത്വം നിറഞ്ഞ’ എന്നത് മഹത്ത്വബന്ധം സംരക്ഷിക്കുകയും അതിനെ വെറും സാധാരണ സന്തോഷമായി ലഘൂകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അത്യന്തം സന്തോഷിക്കുന്നു’ എന്നത് ἀγαλλιᾶσθε എന്ന ക്രിയയുടെ ശക്തി വ്യക്തമാക്കുന്നു; വാക്യത്തിലെ രണ്ടു കാണാതിരിപ്പുകളും അവയ്ക്കിടയിലെ കാലവ്യത്യാസവും നിലനിർത്തിയിരിക്കുന്നു.
