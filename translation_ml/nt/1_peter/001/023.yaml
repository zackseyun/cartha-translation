id: 1PE.1.23
reference: 1 Peter 1:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀναγεγεννημένοι οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ λόγου ζῶντος θεοῦ καὶ ⸀μένοντος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: ml
  text: നശിച്ചുപോകുന്ന വിത്തിൽനിന്നല്ല, നശിക്കാത്ത വിത്തിൽനിന്നാണ് നിങ്ങൾ വീണ്ടും ജനിച്ചിരിക്കുന്നത്—ജീവിക്കുന്നതും നിലനിൽക്കുന്നതുമായ ദൈവവചനത്തിലൂടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജീവിക്കുകയും നിലനിൽക്കുകയും ചെയ്യുന്ന ദൈവത്തിന്റെ വചനത്തിലൂടെ.” ‘ജീവിക്കുന്ന’, ‘നിലനിൽക്കുന്ന’ എന്നീ ഗ്രീക്ക് പദങ്ങൾ ‘വചനത്തെ’യോ ‘ദൈവത്തെ’യോ വിശേഷിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം; സന്ദർഭം അവ ‘വചനത്തെ’ വിശേഷിപ്പിക്കുന്ന വായനയ്ക്ക് കൂടുതൽ പിന്തുണ നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: നിങ്ങൾ വീണ്ടും ജനിച്ചിരിക്കുന്നത്
  rationale: പൂർണ ഭൂതകാല നിഷ്ക്രിയ കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന, പൂർത്തിയായ പ്രവൃത്തിയുടെയും തുടരുന്ന ഫലത്തിന്റെയും ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σπορᾶς
  choice: വിത്ത്
  rationale: ജനനരൂപകത്തോടും നശിക്കുന്നതും നശിക്കാത്തതുമായവയുടെ വൈരുധ്യത്തോടും യോജിക്കുന്ന നേരിട്ടുള്ള മലയാളപദം.
- source_word: φθαρτῆς
  choice: നശിച്ചുപോകുന്ന
  rationale: φθαρτός എന്നതിന്റെ ക്ഷയത്തിനും നാശത്തിനും വിധേയമായ സ്വഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἀφθάρτου
  choice: നശിക്കാത്ത
  rationale: φθαρτῆς എന്നതിനോടുള്ള മൂലപാഠത്തിലെ വ്യക്തമായ വൈരുധ്യം അതേ പദകുടുംബത്തിലൂടെ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: διὰ
  choice: -ലൂടെ
  rationale: ജനനത്തിന്റെ മാർഗമോ ഉപകരണമോ എന്ന അർഥം ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: λόγου
  choice: വചനം
  rationale: λόγος എന്നതിന്റെ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥം നൽകുന്നു; അടുത്ത വാക്യത്തിലെ നിലനിൽക്കുന്ന കർത്താവിന്റെ വചനവുമായി ബന്ധവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ζῶντος
  choice: ജീവിക്കുന്നതുമായ
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ സജീവവും തുടരുന്നതുമായ ഭാവം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: θεοῦ
  choice: ദൈവവചനം
  rationale: λόγου θεοῦ എന്ന ബന്ധത്തെ സ്വാഭാവിക മലയാളത്തിലെ സംയുക്തരൂപത്തിൽ നൽകുന്നു; ദൈവത്തിന്റേതായ വചനം എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: μένοντος
  choice: നിലനിൽക്കുന്നതുമായ
  rationale: തുടർച്ചയും സ്ഥിരതയും സൂചിപ്പിക്കുന്ന μένωയുടെ ഭാവം ആധുനികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ζῶντος, μένοντος എന്നീ കൃദന്തരൂപങ്ങൾ λόγου എന്നതിനെയോ θεοῦ എന്നതിനെയോ വിശേഷിപ്പിക്കുന്നുവോ
  choice: “ജീവിക്കുന്നതും നിലനിൽക്കുന്നതുമായ ദൈവവചനം” എന്നായി, രണ്ടും ‘വചനത്തെ’ വിശേഷിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: “ജീവിക്കുകയും നിലനിൽക്കുകയും ചെയ്യുന്ന ദൈവത്തിന്റെ വചനത്തിലൂടെ”
  rationale: വ്യാകരണപരമായി രണ്ട് കൃദന്തരൂപങ്ങളും λόγουവിനോട് യോജിക്കാം; 1:25-ലെ നിലനിൽക്കുന്ന വചനത്തെക്കുറിച്ചുള്ള ഊന്നലും ഇതിനെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും അവ θεοῦവിനെ വിശേഷിപ്പിക്കുന്ന വായനയും ഗ്രീക്കിൽ സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ കൃദന്തരൂപം മലയാളത്തിൽ പദാനുപദമായി അനുകരിക്കാതെ, മുൻസന്ദർഭത്തിലെ അഭിസംബോധനയെ ആശ്രയിച്ച് ‘നിങ്ങൾ’ ചേർത്ത് പൂർത്തിയായ ജനനവും തുടരുന്ന ഫലവും വ്യക്തമാക്കി. മുഖ്യപാഠത്തിലെ യഥാർഥ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
