    issue: “അവർ ഈ കാര്യങ്ങൾ ശുശ്രൂഷ ചെയ്തതെന്ന്” is semantically awkward.
    rationale: Malayalam normally does not use ശുശ്രൂഷ ചെയ്യുക with ‘കാര്യങ്ങൾ’ as its direct object in this sense. The Greek αὐτά refers to the prophetic matters through which the prophets rendered service; “ഈ കാര്യങ്ങളിലൂടെ ... സേവനം ചെയ്തിരുന്നതെന്ന്” communicates this naturally and preserves the ongoing imperfect sense.
