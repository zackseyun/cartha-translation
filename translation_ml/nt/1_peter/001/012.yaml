id: 1PE.1.12
reference: 1 Peter 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: ml
  text: തങ്ങൾക്കുവേണ്ടിയല്ല, നിങ്ങൾക്കുവേണ്ടിയാണ് അവർ ഈ കാര്യങ്ങളിലൂടെ സേവനം ചെയ്തിരുന്നതെന്ന് അവർക്കു വെളിപ്പെടുത്തപ്പെട്ടു.[a] സ്വർഗത്തിൽനിന്ന് അയയ്ക്കപ്പെട്ട പരിശുദ്ധാത്മാവിനാൽ സുവിശേഷം അറിയിച്ചവരിലൂടെ ആ കാര്യങ്ങൾ ഇപ്പോൾ നിങ്ങളോടു പ്രഖ്യാപിക്കപ്പെട്ടിരിക്കുന്നു.[b] ആ കാര്യങ്ങളിലേക്കു ഉറ്റുനോക്കാൻ ദൂതന്മാർപോലും അതിയായി ആഗ്രഹിക്കുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തങ്ങൾക്കല്ല, നിങ്ങൾക്കാണ് അവർ ഈ കാര്യങ്ങളിലൂടെ സേവനം ചെയ്തിരുന്നതെന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ദത്തിവുകൾ പ്രവാചകന്മാരുടെ സേവനത്തിന്റെ ഗുണഭോക്താക്കളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളോടു സുവിശേഷം പ്രസംഗിച്ചവരിലൂടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ‘സുവാർത്ത അറിയിക്കുക’ എന്നർഥമുള്ള ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘ഉറ്റുനോക്കാൻ’ എന്നതിന് ‘ഉള്ളിലേക്കു സൂക്ഷ്മമായി നോക്കാൻ’ അഥവാ ‘കുനിഞ്ഞുനോക്കാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; ആ പദം ആകാംക്ഷയോടെയുള്ള ശ്രദ്ധാപൂർവമായ നിരീക്ഷണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς ἀπεκαλύφθη
  choice: അവർക്കു വെളിപ്പെടുത്തപ്പെട്ടു
  rationale: οἷς മുൻവാക്യത്തിലെ പ്രവാചകന്മാരെ സൂചിപ്പിക്കുന്നു. ἀπεκαλύφθη എന്ന കർമണിപ്രയോഗം നിലനിർത്തുകയും വെളിപ്പെടുത്തിയ കർത്താവിനെ പാഠത്തിൽ ഇല്ലാത്തവിധം വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ
  choice: തങ്ങൾക്കുവേണ്ടിയല്ല, നിങ്ങൾക്കുവേണ്ടിയാണ്
  rationale: രണ്ട് ദത്തിവുകളും സേവനത്തിന്റെ ഗുണഭോക്താക്കളെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഊന്നിയ വിരോധവും നിലനിർത്തുന്നു.
- source_word: διηκόνουν αὐτά
  choice: അവർ ഈ കാര്യങ്ങൾ ശുശ്രൂഷ ചെയ്തു
  rationale: അപൂർണ്ണഭൂതകാലമായ διηκόνουν സൂചിപ്പിക്കുന്ന തുടർന്നുനിന്ന സേവനം സന്ദർഭത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. αὐτά മുൻപു പറഞ്ഞ രക്ഷാസംബന്ധമായ കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: ആ കാര്യങ്ങൾ ഇപ്പോൾ നിങ്ങളോടു പ്രഖ്യാപിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: കർമണിപ്രയോഗവും νῦν എന്ന കാലസൂചനയും നിലനിർത്തുന്നു. ‘പ്രഖ്യാപിക്കപ്പെട്ടിരിക്കുന്നു’ മുൻകാല അറിയിപ്പിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി പ്രകടമാക്കുന്നു.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: നിങ്ങളോടു സുവാർത്ത അറിയിച്ചവർ മുഖാന്തരം
  rationale: εὐαγγελίζω എന്ന ക്രിയയുടെ ‘നല്ല വാർത്ത അറിയിക്കുക’ എന്ന അർഥം സുതാര്യമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; διὰ സൂചിപ്പിക്കുന്ന ഇടനിലക്കാരെയും നിലനിർത്തുന്നു.
- source_word: πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന് അയയ്ക്കപ്പെട്ട പരിശുദ്ധാത്മാവിനാൽ
  rationale: ദത്തിവിനെ ഇവിടെ മാർഗം/പ്രവർത്തകശക്തി സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുന്നു. participial phrase പരിശുദ്ധാത്മാവിനെ വിശേഷിപ്പിക്കുന്ന ബന്ധവും കർമണിരൂപവും നിലനിർത്തുന്നു.
- source_word: εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι
  choice: ആ കാര്യങ്ങളിലേക്കു ഉറ്റുനോക്കാൻ ദൂതന്മാർപോലും അതിയായി ആഗ്രഹിക്കുന്നു
  rationale: εἰς എന്ന ദിശാസൂചന ‘-ലേക്കു’ എന്നതിലൂടെ നിലനിർത്തുന്നു. παρακύψαιയിലെ കൗതുകപൂർവമായ സൂക്ഷ്മനോട്ടം ‘ഉറ്റുനോക്കാൻ’ എന്നും ἐπιθυμοῦσιν എന്ന തുടരുന്ന ശക്തമായ ആഗ്രഹം ‘അതിയായി ആഗ്രഹിക്കുന്നു’ എന്നും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: πνεύματι ἁγίῳ എന്നതിന്റെ വ്യക്തിത്വപരമായ ദൈവിക പരാമർശം
  choice: പരിശുദ്ധാത്മാവ് എന്ന വ്യക്തിത്വപരമായ ദൈവിക പ്രവർത്തകൻ
  alternative: ഒരു വിശുദ്ധ ആത്മീയ ശക്തി അഥവാ മനോഭാവം
  rationale: സ്വർഗത്തിൽനിന്ന് അയയ്ക്കപ്പെട്ടവൻ എന്ന വിശേഷണവും സുവാർത്താപ്രഖ്യാപനത്തിലെ പ്രവർത്തനവും ഈ സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. പരിഭാഷ പാഠത്തിനു പുറത്തുള്ള ത്രിത്വവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: പ്രവാചകന്മാരുടെ സേവനവും വായനക്കാരുടെ ഗുണവും തമ്മിലുള്ള കാലബന്ധം
  choice: പ്രവാചകന്മാർ വെളിപ്പെടുത്തിയ കാര്യങ്ങൾ പിന്നീട് സുവാർത്തയിലൂടെ വായനക്കാർക്കു പ്രഖ്യാപിക്കപ്പെട്ടു
  alternative: പ്രവാചകന്മാരുടെ സേവനം അവരുടെ സ്വന്തം സമകാലികർക്കു മാത്രമായിരുന്നു
  rationale: ‘തങ്ങൾക്കുവേണ്ടിയല്ല, നിങ്ങൾക്കുവേണ്ടി’ എന്ന വ്യക്തമായ വിരോധവും ‘ഇപ്പോൾ’ എന്ന കാലസൂചനയും അതേ കാര്യങ്ങളുടെ പ്രവചനവും സുവാർത്താപ്രഖ്യാപനവും തമ്മിലുള്ള തുടർച്ച പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശുശ്രൂഷ’, ‘സുവാർത്ത’, ‘പരിശുദ്ധാത്മാവ്’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതാക്കി. ഗ്രീക്കിലെ കർമണിപ്രയോഗം, ഗുണഭോക്തൃവിരോധം, ‘ഇപ്പോൾ’ എന്ന കാലസൂചന, ദൂതന്മാരുടെ ആകാംക്ഷ എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്.
