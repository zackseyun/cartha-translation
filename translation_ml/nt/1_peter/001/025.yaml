id: 1PE.1.25
reference: 1 Peter 1:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: ml
  text: എന്നാൽ കർത്താവിന്റെ വചനം എന്നേക്കും നിലനിൽക്കുന്നു.” നിങ്ങൾക്കു സുവാർത്തയായി അറിയിക്കപ്പെട്ട വചനം ഇതുതന്നെയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളോടു സുവിശേഷമായി പ്രസംഗിക്കപ്പെട്ട വചനം.”
    reason: εὐαγγελισθέν എന്ന പദത്തിന്റെ സഭാപരമായി പരിചിതമായ മറ്റൊരു സ്വാഭാവിക വിവർത്തനം നൽകുന്നു.
lexical_decisions:
- source_word: ῥῆμα
  choice: വചനം
  rationale: സംസാരിക്കപ്പെട്ട വാക്ക്, അരുളപ്പാട്, സന്ദേശം എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്ന പദമാണിത്. ‘വചനം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് തൊട്ടുമുമ്പുള്ള യെശയ്യാവ് 40:8 ഉദ്ധരണിയുമായുള്ള ബന്ധം നിലനിർത്തുകയും രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പദം സ്വാഭാവികമായി ഉപയോഗിക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: ജനിറ്റീവ് രൂപമായ κυρίου ഇവിടെ ‘കർത്താവിന്റെ’ എന്നാണ്. പുതിയനിയമത്തിലെ κύριος എന്ന പദത്തിന്റെ പതിവായ വിവർത്തനം നിലനിർത്തുന്നു; യെശയ്യാവിന്റെ പശ്ചാത്തലം വ്യക്തമാക്കാൻ വ്യാഖ്യാനപരമായി മറ്റൊരു രൂപം ചേർക്കുന്നില്ല.
- source_word: μένει
  choice: നിലനിൽക്കുന്നു
  rationale: തുടർച്ചയായ സ്ഥിരതയും ക്ഷയിക്കാത്ത നിലയും സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: εἰς τὸν αἰῶνα
  choice: എന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലസ്ഥിരത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാള തുല്യപദം.
- source_word: τοῦτο δέ ἐστιν
  choice: ഇതുതന്നെയാണ്
  rationale: δέ ഇവിടെ ഉദ്ധരണിയിൽനിന്ന് പത്രോസിന്റെ പ്രയോഗത്തിലേക്കുള്ള മൃദുവായ മാറ്റം അടയാളപ്പെടുത്തുന്നു. മുൻവാക്യത്തിലെ വചനവുമായി ഉള്ള തിരിച്ചറിയൽ ‘ഇതുതന്നെയാണ്’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: സുവാർത്തയായി അറിയിക്കപ്പെട്ട വചനം
  rationale: εὐαγγελίζω എന്ന ക്രിയയുടെ ‘സുവാർത്ത അറിയിക്കുക’ എന്ന ശക്തി സംരക്ഷിക്കുന്നു. വെറും ‘പ്രസംഗിക്കപ്പെട്ടത്’ എന്നതിലേക്കു ചുരുക്കാതെ സുവാർത്തയുടെ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങൾക്കു
  rationale: സന്ദേശം ശ്രോതാക്കളിലേക്കു നയിക്കപ്പെട്ടതായി സൂചിപ്പിക്കുന്ന εἰς + accusative ഘടനയ്ക്ക് നേരിട്ടും സ്വാഭാവികവുമായ മലയാള രൂപം.
theological_decisions:
- issue: യെശയ്യാവ് 40:8-ലെ ‘കർത്താവിന്റെ വചനം’ എന്ന ഉദ്ധരണിയും പത്രോസ് അതിനെ വായനക്കാർക്കു അറിയിക്കപ്പെട്ട സുവാർത്തയുമായി തിരിച്ചറിയുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ഉദ്ധരണിയിൽ ‘കർത്താവിന്റെ വചനം’ നിലനിർത്തി, രണ്ടാം വാക്യത്തിൽ അതുതന്നെ വായനക്കാർക്കു സുവാർത്തയായി അറിയിക്കപ്പെട്ട വചനമാണെന്ന് വ്യക്തമാക്കുന്നു.
  alternative: രണ്ടിടത്തും കൂടുതൽ വ്യാഖ്യാനപരമായി ‘കർത്താവിൽനിന്നുള്ള സന്ദേശം’ എന്നു നൽകുക.
  rationale: ഉദ്ധരണിയുടെ തിരുവെഴുത്തുസ്വരം സംരക്ഷിക്കുമ്പോൾ തന്നെ പത്രോസിന്റെ സുവാർത്താപരമായ പ്രയോഗവും വ്യക്തമാകുന്നു. ഉദ്ധരണിയെയും അതിന്റെ പ്രയോഗത്തെയും ഒരു പരാവർത്തനത്തിലൂടെ ലയിപ്പിക്കുന്നില്ല.
- issue: εὐαγγελισθέν എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ‘സുവാർത്തയായി അറിയിക്കപ്പെട്ട’ എന്ന വ്യക്തമായ സുവാർത്താഭാഷ ഉപയോഗിക്കുന്നു.
  alternative: ‘നിങ്ങളോടു പ്രസംഗിക്കപ്പെട്ട’ അല്ലെങ്കിൽ ‘സുവിശേഷമായി പ്രസംഗിക്കപ്പെട്ട’.
  rationale: ഗ്രീക്ക് ക്രിയയുടെ സുവാർത്ത അറിയിക്കൽ എന്ന അർഥം തുറന്നുകാട്ടുന്നു; അതേസമയം മൂലപാഠത്തിലില്ലാത്ത പ്രത്യേക സഭാപരമോ സിദ്ധാന്തപരമോ ആയ ഉള്ളടക്കം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ‘വചനം’ എന്ന പദം യെശയ്യാവ് ഉദ്ധരണിയുമായുള്ള അന്തർപാഠബന്ധം നിലനിർത്തുന്നു. ഉദ്ധരണിയുടെ അവസാന ഇരട്ട ഉദ്ധരണിച്ചിഹ്നം മുൻവാക്യത്തിൽ ആരംഭിച്ച ഉദ്ധരണി ഇവിടെ അവസാനിക്കുന്നതായി സംരക്ഷിച്ചിരിക്കുന്നു.
