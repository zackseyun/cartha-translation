id: 1PE.1.4
reference: 1 Peter 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: ml
  text: നശിക്കാത്തതും മലിനമാകാത്തതും വാടിപ്പോകാത്തതുമായ, നിങ്ങൾക്കായി സ്വർഗങ്ങളിൽ സൂക്ഷിച്ചുവെച്ചിരിക്കുന്ന ഒരു അവകാശത്തിലേക്ക്
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομίαν
  choice: അവകാശം
  rationale: ലഭിക്കാനിരിക്കുന്ന പൈതൃകസ്വത്തെയോ ദൈവം നൽകുന്ന ഓഹരിയെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄφθαρτον
  choice: നശിക്കാത്തത്
  rationale: ക്ഷയം, നാശം എന്നിവയ്ക്ക് വിധേയമല്ല എന്ന അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀμίαντον
  choice: മലിനമാകാത്തത്
  rationale: അശുദ്ധിയാലോ കളങ്കത്താലോ മലിനപ്പെടാത്തത് എന്ന ആശയം പദാനുസൃതമായി നൽകുന്നു.
- source_word: ἀμάραντον
  choice: വാടിപ്പോകാത്തത്
  rationale: പുഷ്പം വാടുന്നതിന്റെ രൂപകം നിലനിർത്തിക്കൊണ്ട് മങ്ങുകയോ സൗന്ദര്യം നഷ്ടപ്പെടുകയോ ചെയ്യാത്തത് എന്ന അർഥം നൽകുന്നു.
- source_word: τετηρημένην
  choice: സൂക്ഷിച്ചിരിക്കുന്ന
  rationale: പൂർണ്ണകാല കൃതന്തത്തിന്റെ, മുമ്പേ കരുതിവെച്ച് ഇപ്പോഴും സുരക്ഷിതമായി നിലനിർത്തിയിരിക്കുന്നു എന്ന ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν οὐρανοῖς
  choice: സ്വർഗങ്ങളിൽ
  rationale: മൂലത്തിലെ ബഹുവചനരൂപം അനാവശ്യമായി ഏകവചനമാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങൾക്കായി
  rationale: ലക്ഷ്യസ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ പ്രസക്തമായ ഗുണഭോക്തൃഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: അവകാശത്തിന്റെ സ്വഭാവം
  choice: നശിക്കാത്തതും മലിനമാകാത്തതും വാടിപ്പോകാത്തതുമായ
  alternative: നാശമില്ലാത്തതും കളങ്കമില്ലാത്തതും മങ്ങാത്തതുമായ
  rationale: മൂലത്തിലെ മൂന്ന് വ്യത്യസ്ത വിശേഷണങ്ങളും അവയുടെ സമാന്തരഘടനയും നിലനിർത്തുന്നു; അവയെ ഒരു പൊതുവായ ‘നിത്യമായ’ എന്ന പദത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: അവകാശം സൂക്ഷിക്കപ്പെട്ടിരിക്കുന്ന സ്ഥലം
  choice: സ്വർഗങ്ങളിൽ
  alternative: സ്വർഗത്തിൽ
  rationale: οὐρανοῖς എന്ന ബഹുവചനം നിലനിർത്തുന്നു; അതിന്റെ പ്രപഞ്ചശാസ്ത്രപരമായ അർഥം വ്യാഖ്യാനിച്ച് ഏകവചനമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം മുൻവാക്യത്തിൽ നിന്നു തുടരുന്നതായതിനാൽ ‘അവകാശത്തിലേക്ക്’ എന്ന ദിശാഭാവം നിലനിർത്തി; നീണ്ട വിശേഷണശൃംഖല വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു.
