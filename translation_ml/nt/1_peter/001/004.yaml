review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the directional phrase, the three coordinated qualities of the inheritance, its being kept, the plural ‘heavens,’ and its being for the readers. However, it unnecessarily repeats ‘അവകാശത്തിലേക്ക്,’ although the Greek has only one occurrence of κληρονομίαν. The dash construction also makes the repetition read as an appositional restart rather than a single continuous noun phrase.
  naturalness: The individual lexical choices are understandable and suitably modern. A single integrated noun phrase is more natural Malayalam and avoids the awkward dash-enclosed repetition.
  terminology: ‘അവകാശം’ is an appropriate rendering of κληρονομία. ‘നശിക്കാത്തതും മലിനമാകാത്തതും വാടിപ്പോകാത്തതുമായ’ preserves the distinct threefold description. ‘സ്വർഗങ്ങളിൽ’ appropriately retains the source plural without imposing an interpretation.
  issues:
  - severity: medium
    issue: The phrase ‘അവകാശത്തിലേക്ക്’ is repeated.
    rationale: κληρονομίαν occurs once in the Greek. Repeating it is not required for clarity and alters the compact syntactic structure of the verse.
  - severity: low
    issue: Paired em dashes create an unnecessary interruption.
    rationale: The participial phrase ‘kept in the heavens for you’ directly qualifies the inheritance and is best expressed as part of one continuous Malayalam noun phrase.
  revised_text: നശിക്കാത്തതും മലിനമാകാത്തതും വാടിപ്പോകാത്തതുമായ, നിങ്ങൾക്കായി സ്വർഗങ്ങളിൽ സൂക്ഷിച്ചുവെച്ചിരിക്കുന്ന ഒരു അവകാശത്തിലേക്ക്
