  text: διότι γέγραπται ⸀ὅτι Ἅγιοι ⸀ἔσεσθε, ὅτι ἐγὼ ⸀ἅγιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/016.yaml
  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: ml
  text: 'എന്തെന്നാൽ, എഴുതപ്പെട്ടിരിക്കുന്നു[a]: “നിങ്ങൾ വിശുദ്ധരായിരിക്കും, കാരണം ഞാൻ വിശുദ്ധനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ നേരിട്ടുള്ള ഒരു കല്പനയായി: “വിശുദ്ധരായിരിപ്പിൻ.” ഈ ഉദ്ധരണിയിൽ ഗ്രീക്ക് പാഠം “വിശുദ്ധരായിരിക്കും” എന്ന ഭാവികാലരൂപമാണ് ഉപയോഗിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള പ്രബോധനത്തിന് തിരുവെഴുത്തിൽനിന്നുള്ള കാരണം അവതരിപ്പിക്കുന്ന causal ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γέγραπται
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി അവതരിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗവും ഗ്രീക്ക് perfect passive രൂപം സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന പ്രാബല്യവും സംരക്ഷിക്കുന്നു.
- source_word: ὅτι (quotation marker)
  choice: ഇങ്ങനെ / ഉദ്ധരണിചിഹ്നം
  rationale: ആദ്യ ὅτι ഉദ്ധരണിയെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണിക്ക് ‘ഇങ്ങനെ’യും ഉദ്ധരണിചിഹ്നങ്ങളും സ്വാഭാവികമാണ്.
- source_word: Ἅγιοι
  choice: വിശുദ്ധർ
  rationale: ധാർമ്മികവും ഉടമ്പടിസംബന്ധവുമായ പശ്ചാത്തലത്തിൽ ἅγιος എന്നതിന്റെ സമഗ്രമായ അർഥം നൽകുന്നു; വെറും ‘വേർതിരിക്കപ്പെട്ടവർ’ എന്നതിനെക്കാൾ അനുയോജ്യം.
- source_word: ἔσεσθε
  choice: ആയിരിക്കും
  rationale: ഗ്രീക്കിലെ future indicative രൂപം നിലനിർത്തുന്നു; അതേസമയം തിരുവെഴുത്തിലെ ഈ ഭാവികാലപ്രയോഗത്തിന് കല്പനാസ്വഭാവമുണ്ടെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅτι (causal)
  choice: ആയിരിക്കുന്നതിനാൽ
  rationale: ദൈവത്തിന്റെ വിശുദ്ധിയാണ് അഭ്യർഥനയുടെ അടിസ്ഥാനം എന്ന causal ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഉദ്ധരണിയിലെ ഊന്നലുള്ള ദൈവിക സ്വയംപരാമർശം നിലനിർത്തുന്നു.
- source_word: ἅγιος
  choice: വിശുദ്ധൻ
  rationale: ആദ്യ വിശുദ്ധതാപദവുമായി പദസാമ്യം നിലനിർത്തുകയും മനുഷ്യരുടെ വിശുദ്ധതയ്ക്ക് ദൈവത്തിന്റെ വിശുദ്ധിയാണ് അടിസ്ഥാനമെന്ന ആശയം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വിശുദ്ധതയെക്കുറിച്ചുള്ള ഉദ്ധരണിയിൽ ἔσεσθε എന്ന ഭാവികാലരൂപത്തിന്റെ ശക്തി
  choice: ‘നിങ്ങളും വിശുദ്ധരായിരിക്കും’ എന്ന് ഭാവികാലരൂപം പ്രധാനവാചകത്തിൽ നിലനിർത്തുക.
  alternative: ‘നിങ്ങളും വിശുദ്ധരായിരിക്കുവിൻ’ എന്ന നേരിട്ടുള്ള കല്പനാരൂപം.
  rationale: SBLGNT-യിലെ ἔσεσθε future indicative ആണ്; ലേവ്യപുസ്തക ഉദ്ധരണിയുടെ രൂപം സംരക്ഷിക്കാൻ ഭാവികാലം നിലനിർത്തുന്നു. ബൈബിൾ നിയമ-പ്രബോധന ശൈലിയിൽ അതിന് കല്പനാസ്വഭാവമുണ്ടാകാമെന്ന യഥാർഥ പിരിമുറുക്കം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ഭാവികാലരൂപം അസാധാരണമായി തോന്നാമെങ്കിലും മൂലപാഠത്തിലെ രൂപവും അതിന്റെ കല്പനാസ്വഭാവവുമായുള്ള പിരിമുറുക്കം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിരിക്കുന്നു.
