id: 1PE.1.7
reference: 1 Peter 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: ml
  text: തീയാൽ പരിശോധിക്കപ്പെടുന്നുവെങ്കിലും നശിച്ചുപോകുന്ന സ്വർണത്തെക്കാൾ വിലയേറിയ നിങ്ങളുടെ വിശ്വാസത്തിന്റെ തെളിയിക്കപ്പെട്ട യഥാർഥത[a], യേശു മശീഹ വെളിപ്പെടുമ്പോൾ സ്തുതിക്കും മഹത്വത്തിനും ബഹുമാനത്തിനും കാരണമാകുന്നതായി കണ്ടെത്തപ്പെടേണ്ടതിനാണ്[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ വിശ്വാസത്തിന്റെ പരിശോധന’; ഗ്രീക്ക് പദം പരിശോധനയുടെ പ്രക്രിയയെയോ അതിലൂടെ തെളിയുന്ന യഥാർഥതയെയോ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യേശുക്രിസ്തു’; ഇവിടെ Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം അനുസരിച്ചാണ് ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘സ്തുതിക്കും മഹത്വത്തിനും ബഹുമാനത്തിനുമായി കണ്ടെത്തപ്പെടുക’.
    reason: previous_rendering
lexical_decisions:
- source_word: δοκίμιον
  choice: തെളിയിക്കപ്പെട്ട യഥാർഥത
  rationale: പരിശോധനയുടെ പ്രക്രിയയെക്കാൾ, പരിശോധനയിലൂടെ യഥാർഥമെന്ന് തെളിഞ്ഞ ഗുണത്തെയാണ് സന്ദർഭത്തിൽ പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും പ്രക്രിയാസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസത്തിന്റെ
  rationale: ഇവിടെ പരീക്ഷിക്കപ്പെടുന്നത് വിശ്വാസികളുടെ വിശ്വാസമാണ്; ‘വിശ്വാസം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പരിഭാഷയാണ്.
- source_word: πολυτιμότερον
  choice: വിലയേറിയ
  rationale: സ്വർണത്തോടുള്ള മൂല്യത്തിന്റെ താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπολλυμένου
  choice: നശിച്ചുപോകുന്ന
  rationale: ശുദ്ധീകരിക്കപ്പെട്ടാലും സ്വർണം നശ്വരമാണെന്ന വിരോധാഭാസം ക്രിയാത്മകമായി നിലനിർത്തുന്നു.
- source_word: διὰ πυρὸς δὲ δοκιμαζομένου
  choice: തീയിൽ പരിശോധിക്കപ്പെടുന്നുവെങ്കിലും
  rationale: സ്വർണം തീ മുഖേന പരിശോധിക്കപ്പെടുന്നു എന്ന ഉപകരണാർഥവും δέ സൂചിപ്പിക്കുന്ന വിരോധഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: εὑρεθῇ εἰς
  choice: കാരണമാകുന്നതായി കണ്ടെത്തപ്പെടുക
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപവും ഫലത്തിലേക്കുള്ള ദിശയും ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥസമീപമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἔπαινον καὶ δόξαν καὶ τιμήν
  choice: സ്തുതിക്കും മഹത്ത്വത്തിനും ബഹുമാനത്തിനും
  rationale: മൂന്നംഗ പദനിര അതിന്റെ ക്രമത്തിൽ നിലനിർത്തുന്നു; ഇവ ആരെ സംബന്ധിക്കുന്നുവെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പരിഭാഷയും വ്യക്തമാക്കുന്നില്ല.
- source_word: ἐν ἀποκαλύψει
  choice: വെളിപ്പെടുമ്പോൾ
  rationale: ഇവിടെ കാലസൂചനയാണ് ഏറ്റവും സ്വാഭാവികം; നാമരൂപത്തെ മലയാളത്തിലെ സ്വാഭാവിക ഉപവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം പ്രകടമാക്കാൻ ‘മശീഹ’ ഉപയോഗിക്കുന്നു; മലയാളത്തിൽ പേരിനോടു ചേർന്ന സ്ഥാനപ്പേരായി സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: τὸ δοκίμιον ὑμῶν τῆς πίστεως എന്നതിന്റെ അർഥം
  choice: പരിശോധനയിലൂടെ തെളിയിക്കപ്പെട്ട വിശ്വാസത്തിന്റെ യഥാർഥത
  alternative: നിങ്ങളുടെ വിശ്വാസത്തിന്റെ പരിശോധന
  rationale: δοκίμιον ഇവിടെ പരിശോധനയുടെ ഫലമായി തെളിഞ്ഞ ഗുണത്തെ കൂടുതൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; എന്നിരുന്നാലും പ്രക്രിയാർഥം യഥാർഥ സാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘സ്തുതി, മഹത്ത്വം, ബഹുമാനം’ ആരെ സംബന്ധിക്കുന്നു
  choice: സ്വീകർത്താവിനെയോ ഉറവിടത്തെയോ വ്യക്തമാക്കാതെ വിടുന്നു
  alternative: വിശ്വാസികൾക്കു ലഭിക്കുന്ന ബഹുമാനം; ദൈവത്തിനോ മശീഹയ്ക്കോ അർപ്പിക്കപ്പെടുന്ന സ്തുതി; ഇരുവരെയും ഉൾക്കൊള്ളുന്ന അന്തിമ അംഗീകാരം
  rationale: ഗ്രീക്ക് വാക്യം ഇതിന്റെ സ്വീകർത്താവിനെയോ ഉറവിടത്തെയോ തുറന്നുപറയുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ ഒരു വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: Χριστός എന്ന സ്ഥാനപ്പേര്
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥബന്ധം വ്യക്തമാക്കുന്നു; പ്രചാരത്തിലുള്ള മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈർഘ്യമേറിയ ഗ്രീക്ക് വാക്യത്തിന്റെ തർക്കബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിച്ചു. ‘സ്തുതി, മഹത്ത്വം, ബഹുമാനം’ എന്നതിന്റെ അവ്യക്തമായ ബന്ധം ഉദ്ദേശപൂർവം തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
