id: 1PE.1.2
reference: 1 Peter 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: ml
  text: പിതാവായ ദൈവത്തിന്റെ മുൻജ്ഞാനപ്രകാരം[a], പരിശുദ്ധാത്മാവിനാലുള്ള വിശുദ്ധീകരണത്തിൽ[b], അനുസരണത്തിനും മശീഹയായ യേശുവിന്റെ രക്തത്താൽ തളിക്കപ്പെടലിനുമായി[c][d]—നിങ്ങൾക്കു കൃപയും സമാധാനവും പെരുകട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മുൻജ്ഞാനം” എന്നു പരിഭാഷപ്പെടുത്തിയ πρόγνωσις ദൈവത്തിന്റെ മുൻകൂട്ടിയുള്ള അറിവിനെയോ മുൻകൂട്ടിയുള്ള തിരഞ്ഞെടുപ്പിനെയോ രണ്ടിനെയും കൂടിയോ ഊന്നുന്നുവോ എന്നതിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് അടുത്ത രൂപം: “ആത്മാവിന്റെ വിശുദ്ധീകരണത്തിൽ.” ഇവിടെ ആത്മാവാണ് വിശുദ്ധീകരണം പ്രവർത്തിക്കുന്നവൻ എന്ന അർത്ഥത്തിലാണ് പ്രധാന പരിഭാഷ.'
    reason: grammatical_clarification
  - marker: c
    text: “രക്തത്താൽ തളിക്കൽ” പഴയനിയമത്തിലെ ഉടമ്പടി-ശുദ്ധീകരണ ദൃശ്യങ്ങളെ, പ്രത്യേകിച്ച് പുറപ്പാട് 24:8-നെ, ഓർമിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cross_reference
  - marker: d
    text: “മശീഹയായ യേശു” എന്നത് “യേശുക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് Χριστός ചില സന്ദർഭങ്ങളിൽ പേരുപോലെ പ്രവർത്തിക്കാമെങ്കിലും ഇവിടെ അതിന്റെ സ്ഥാനപ്പേരായ അർത്ഥം വ്യക്തമാക്കാൻ “മശീഹ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: മുൻജ്ഞാനപ്രകാരം
  rationale: κατά + accusative സൂചിപ്പിക്കുന്ന മാനദണ്ഡം/അനുസൃതത നിലനിർത്തുന്നു. πρόγνωσις എന്ന പദത്തെ മുൻകൂട്ടിയുള്ള അറിവെന്നോ മുൻനിയമനമെന്നോ മാത്രം വ്യാഖ്യാനിച്ച് തർക്കം തീർക്കാതെ ‘മുൻജ്ഞാനം’ എന്നു നൽകുന്നു.
- source_word: θεοῦ πατρός
  choice: പിതാവായ ദൈവത്തിന്റെ
  rationale: ദൈവവും പിതാവും ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: പരിശുദ്ധാത്മാവിനാലുള്ള വിശുദ്ധീകരണത്തിൽ
  rationale: ത്രിത്വസദൃശമായ വാക്യഘടനയിൽ πνεῦμα പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കർത്തൃത്വം സ്വാഭാവികമായി അറിയിക്കാൻ ‘-നാൽ’ പ്രയോഗിച്ചു; ἐν എന്ന ഘടനയുടെ പരിസരം ‘വിശുദ്ധീകരണത്തിൽ’ നിലനിർത്തുന്നു.
- source_word: εἰς ὑπακοὴν
  choice: അനുസരണത്തിനും
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യം/ഫലം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; അനുസരണത്തിന്റെ കർമം മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: ῥαντισμὸν αἵματος
  choice: രക്തത്താൽ തളിക്കപ്പെടുന്നതിനുമായി
  rationale: രക്തം തളിക്കുന്ന ഉടമ്പടി-ശുദ്ധീകരണ ദൃശ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; passive രൂപം സ്വീകരിക്കുന്നവരുടെമേൽ തളിക്കൽ എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർത്ഥം ‘മശീഹ’ എന്നു നിലനിർത്തുകയും മലയാളത്തിലെ സ്വാഭാവിക നാമ-സ്ഥാനപ്പേര് ക്രമം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: നിങ്ങൾക്കു കൃപയും സമാധാനവും വർധിച്ചുവരട്ടെ
  rationale: optative ആശംസയെ ‘-ട്ടെ’ രൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു; πληθυνθείηയുടെ വർധനാഭാവം ‘വർധിച്ചുവരട്ടെ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: തിരഞ്ഞെടുപ്പുമായി ബന്ധപ്പെട്ട πρόγνωσις എന്ന പദത്തിന്റെ അർത്ഥം
  choice: മുൻജ്ഞാനം
  alternative: മുൻനിയമനം; മുൻകൂട്ടിയുള്ള അറിവ് മാത്രം; മുൻകൂട്ടിയുള്ള സ്നേഹപൂർവ തിരഞ്ഞെടുപ്പ്
  rationale: മൂലപദം ഈ വ്യാഖ്യാനസാധ്യതകളെ പൂർണമായി തീർപ്പാക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ തുറന്നുവെക്കുന്നു.
- issue: πνεύματος എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പരിശുദ്ധാത്മാവ്
  alternative: മനുഷ്യാത്മാവ്; വ്യക്തിത്വമില്ലാത്ത ആത്മീയ അർത്ഥം
  rationale: ‘പിതാവായ ദൈവം—ആത്മാവ്—യേശു മശീഹ’ എന്ന ത്രിഭാഗ ഘടനയിൽ പരിശുദ്ധാത്മാവാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചിതവ്യക്തി.
- issue: Χριστοῦ എന്നതിന്റെ പ്രാബല്യം
  choice: സ്ഥാനപ്പേരായി ‘മശീഹ’
  alternative: പേരുപോലെ ‘ക്രിസ്തു’
  rationale: ഇവിടെ പദത്തിന്റെ അഭിഷിക്തൻ/മശീഹ എന്ന സ്ഥാനപ്പേരായ ഭാരം വായനക്കാരന് ദൃശ്യമാക്കുന്നു; പേരുപോലുള്ള പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: രക്തം തളിക്കുന്നതിന്റെ പശ്ചാത്തലം
  choice: ഉടമ്പടി/ശുദ്ധീകരണ ദൃശ്യസൂചന തുറന്നുവെച്ചു
  alternative: ഒരു പ്രത്യേക പ്രായശ്ചിത്ത സിദ്ധാന്തമായി നേരിട്ട് വിശദീകരിക്കൽ
  rationale: പുറപ്പാട് 24:8 പോലുള്ള പശ്ചാത്തലം സാധ്യതയുള്ളതാണെങ്കിലും വാക്യം തന്നെ അതിന്റെ മുഴുവൻ ദൈവശാസ്ത്രപരമായ അർത്ഥം വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലവാക്യം 1 പത്രോസ് 1:1-ൽ ആരംഭിക്കുന്ന വാക്യഘടനയുടെ തുടർച്ചയായതിനാൽ ആദ്യഭാഗത്തിന്റെ ഖണ്ഡസ്വഭാവം നിലനിർത്തി; ആശംസയിലേക്കുള്ള മാറ്റം ദീർഘചിഹ്നംകൊണ്ട് സൂചിപ്പിച്ചു. പരമ്പരാഗതമായി പരിചിതമായ ‘കൃപ’, ‘സമാധാനം’, ‘വിശുദ്ധീകരണം’, ‘പരിശുദ്ധാത്മാവ്’ എന്നീ പദങ്ങൾ നിലനിർത്തി.
