  source_fidelity: 'പ്രധാന ഘടകങ്ങൾ ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: κατά πρόγνωσιν-ന്റെ ‘മുൻജ്ഞാനപ്രകാരം,’ πνεύματος-ന്റെ പരിശുദ്ധാത്മാവായ വായന, εἰς-ന്റെ ലക്ഷ്യാർഥം, Χριστοῦ-ന്റെ സ്ഥാനപ്പേരായ ‘മശീഹ,’ ഒപ്റ്ററ്റീവ് ആശംസ എന്നിവ ശരിയായി നിലനിർത്തിയിട്ടുണ്ട്. എന്നാൽ ‘രക്തത്താൽ തളിക്കപ്പെടുന്നതിനുമായി’ എന്ന രൂപം നാമരൂപമായ ῥαντισμόν-നോട് കുറച്ചുകൂടി അകന്നതും ‘അനുസരണത്തിനും’ എന്നതോടുള്ള സമാന്തരതയിൽ അസമവുമാണ്. ‘തളിക്കപ്പെടലിനുമായി’ എന്ന നാമരൂപം കൂടുതൽ കൃത്യമാണ്.'
  naturalness: വാക്യത്തിന്റെ ഗൗരവമുള്ള ആധുനിക മാനക-മലയാള ശൈലി നല്ലതാണ്. ‘അനുസരണത്തിനും … തളിക്കപ്പെടലിനുമായി’ എന്ന സമാന്തര ഘടന വായനയിൽ കൂടുതൽ സുഗമമാണ്. πληθυνθείηയ്ക്ക് ‘പെരുകട്ടെ’ എന്നത് സ്വാഭാവികമായ ആശീർവാദരൂപവും ‘വർധിച്ചുവരട്ടെ’യേക്കാൾ നേരിട്ടുള്ളതുമാണ്.
