source:
  edition: SBLGNT
  text: προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπ’ ⸀ἐσχάτου τῶν χρόνων δι’ ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: ml
  text: ലോകം സ്ഥാപിക്കപ്പെടുന്നതിനു മുമ്പ് മുൻകൂട്ടി അറിയപ്പെട്ടവനായിരുന്നു അവൻ[a]; എന്നാൽ കാലങ്ങളുടെ അവസാനത്തിൽ നിങ്ങൾക്കുവേണ്ടി വെളിപ്പെടുത്തപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മുൻകൂട്ടി തിരഞ്ഞെടുക്കപ്പെട്ടവനായിരുന്നു.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘മുൻകൂട്ടി അറിയപ്പെട്ടവൻ’ എന്നാണ്; അതിൽ ദൈവിക ഉദ്ദേശ്യം ഉൾക്കൊള്ളാമെങ്കിലും, പ്രധാന പാഠത്തിൽ ആ വിപുലമായ വ്യാഖ്യാനം നിർബന്ധമല്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഈ അവസാനകാലങ്ങളിൽ.’
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: മുൻകൂട്ടി അറിയപ്പെട്ടവനായിരുന്നു
  rationale: മുൻകാലത്തെ ദൈവിക അറിവ് സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ നിഷ്ക്രിയ അർഥം നിലനിർത്തുന്നു. ‘മുൻകൂട്ടി തിരഞ്ഞെടുക്കപ്പെട്ടവൻ’ എന്നു വ്യാഖ്യാനിച്ച് ആശയം ചുരുക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
- source_word: πρὸ καταβολῆς κόσμου
  choice: ലോകസ്ഥാപനത്തിനു മുമ്പേ
  rationale: സൃഷ്ടിക്ക് മുമ്പുള്ള കാലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബൈബിൾ പ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: φανερωθέντος
  choice: വെളിപ്പെടുത്തപ്പെട്ടു
  rationale: ദൃശ്യനാക്കപ്പെടുക അഥവാ പരസ്യമായി വെളിപ്പെടുക എന്ന നിഷ്ക്രിയ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: കാലങ്ങളുടെ അവസാനത്തിൽ
  rationale: ‘കാലങ്ങളുടെ അവസാനഘട്ടത്തിൽ’ എന്ന യുഗാന്ത്യകാല സൂചന നിലനിർത്തുകയും ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ഈ’ എന്ന സൂചകപദം പ്രധാന പാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: δι’ ὑμᾶς
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: διά + accusative ഇവിടെ വായനക്കാരുടെ പ്രയോജനത്തെ സൂചിപ്പിക്കുന്നു; ‘നിങ്ങൾക്കുവേണ്ടി’ ആ ഗുണഭോക്തൃഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സൃഷ്ടിക്കുമുമ്പ് മശീഹയെക്കുറിച്ചുള്ള προεγνωσμένου എന്ന പദത്തിന്റെ അർഥം
  choice: ‘മുൻകൂട്ടി അറിയപ്പെട്ടവൻ’ എന്ന മൂലാർഥം പ്രധാന പാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘മുൻകൂട്ടി തിരഞ്ഞെടുക്കപ്പെട്ടവൻ’ അല്ലെങ്കിൽ ‘മുൻകൂട്ടി നിയോഗിക്കപ്പെട്ടവൻ.’
  rationale: ദൈവിക ഉദ്ദേശ്യം ഇതിൽ ഉൾക്കൊള്ളാമെങ്കിലും, ഗ്രീക്ക് പദം മുൻജ്ഞാനത്തെ നിർബന്ധമായും തിരഞ്ഞെടുപ്പ് അല്ലെങ്കിൽ മുൻനിയോഗം എന്നാക്കി ചുരുക്കുന്നില്ല. അതിനാൽ യഥാർഥമായ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിച്ചു.
- issue: ἐπ’ ἐσχάτου τῶν χρόνων എന്നതിന്റെ കാലസൂചന
  choice: ‘കാലങ്ങളുടെ അവസാനത്തിൽ.’
  alternative: ‘ഈ അവസാനകാലങ്ങളിൽ.’
  rationale: ഗ്രീക്ക് യുഗാന്ത്യകാലഘട്ടത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘ഈ’ എന്ന പദം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ പ്രധാന പാഠത്തിൽ കൂടുതൽ ഔപചാരികമായി അടുത്ത രൂപം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ശൈലി. വാക്യം 19-ലെ മശീഹയെ സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ ഏകവചന ബന്ധം ‘അവൻ’ എന്നതിലൂടെ വ്യക്തമാക്കി. പ്രധാന പാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുകൾക്കും [a], [b] അടയാളങ്ങൾ ചേർത്തിട്ടുണ്ട്.
