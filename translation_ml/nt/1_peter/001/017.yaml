id: 1PE.1.17
reference: 1 Peter 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: ml
  text: ഓരോരുത്തന്റെയും പ്രവൃത്തിക്കനുസരിച്ച് പക്ഷപാതമില്ലാതെ വിധിക്കുന്നവനെ നിങ്ങൾ പിതാവെന്ന് വിളിക്കുന്നുവെങ്കിൽ[a], നിങ്ങളുടെ പരദേശവാസകാലത്ത്[b] ഭയത്തോടെ[c] ജീവിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പിതാവെന്നു വിളിച്ചപേക്ഷിക്കുന്നുവെങ്കിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘നിങ്ങളുടെ പ്രവാസകാലത്ത്.’ ഗ്രീക്ക് പദം പരദേശിയായോ താൽക്കാലിക താമസക്കാരനായോ കഴിയുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ, ‘ഭക്തിയോടെ’ അഥവാ ‘ഭയഭക്തിയോടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: വിളിക്കുന്നുവെങ്കിൽ
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ഈ ക്രിയ ദൈവത്തെ ഒരു പ്രത്യേക അഭിസംബോധനയോടെ വിളിക്കുന്നതിനെയോ അവിടുത്തെ വിളിച്ചപേക്ഷിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. പ്രധാന പാഠത്തിലെ ലളിതമായ രൂപം πατέρα എന്ന പദത്തോടൊപ്പം സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു; അപേക്ഷയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πατέρα
  choice: പിതാവെന്ന്
  rationale: ഇവിടെ πατέρα വിധേയപൂരകമായി പ്രവർത്തിച്ച് വിശ്വാസികൾ ദൈവത്തെ എങ്ങനെ അഭിസംബോധന ചെയ്യുന്നു എന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἀπροσωπολήμπτως
  choice: പക്ഷപാതമില്ലാതെ
  rationale: പദവി, മുഖം, പുറമേയുള്ള നില എന്നിവ കണക്കിലെടുത്ത് അനുകൂലത കാണിക്കാതെ വിധിക്കുന്നതെന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: κρίνοντα
  choice: വിധിക്കുന്നവനെ
  rationale: വർത്തമാന കൃദന്തരൂപം ദൈവത്തെ ‘വിധിക്കുന്നവൻ’ എന്നു വിശേഷിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഘടന മൂലവാക്യത്തിന്റെ ബന്ധം വ്യക്തമായി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: ഓരോരുത്തന്റെയും പ്രവൃത്തിക്കനുസരിച്ച്
  rationale: κατά വിധിനിർണയത്തിന്റെ മാനദണ്ഡം സൂചിപ്പിക്കുന്നു. ഏകവചനമായ ἔργον ഓരോ വ്യക്തിയുടെയും പ്രവൃത്തിയെ സമഗ്രമായി സൂചിപ്പിക്കുന്നതായി അതേപടി നിലനിർത്തുന്നു.
- source_word: ἐν φόβῳ
  choice: ഭയത്തോടെ
  rationale: φόβος എന്ന പദത്തിൽ ഭയം, ഭക്തിപൂർവമായ ആദരം, ഭയഭക്തി എന്നീ അർഥനിറങ്ങൾ ഉണ്ടാകാം. ‘ഭയത്തോടെ’ എന്നത് പിതൃത്വവും നിഷ്പക്ഷവിധിയും തമ്മിലുള്ള പാഠത്തിലെ ഗൗരവവും പിരിമുറുക്കവും ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: παροικίας
  choice: പരദേശവാസം
  rationale: സ്വദേശമല്ലാത്തിടത്തെ താൽക്കാലിക താമസമെന്ന അർഥവും അന്യനായി കഴിയുന്നതിന്റെ ഭാവവും ഈ പദം നൽകുന്നു; രാഷ്ട്രീയ നാടുകടത്തൽ എന്ന അർഥം അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
- source_word: ἀναστράφητε
  choice: ജീവിക്കുക
  rationale: ഈ ആജ്ഞാരൂപം ഒരാളുടെ ജീവിതനടത്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ജീവിക്കുക’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ധാർമ്മിക ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: നിങ്ങളുടെ പരദേശവാസകാലത്ത്
  rationale: χρόνον കാലദൈർഘ്യം സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം താൽക്കാലിക പരദേശജീവിതത്തിന്റെ മുഴുവൻ കാലത്തെയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: പിതാവായ ദൈവവും വിധികർത്താവായ ദൈവവും തമ്മിലുള്ള ബന്ധത്തിൽ φόβος എന്നതിന്റെ അർഥം
  choice: പ്രധാന പാഠത്തിൽ ‘ഭയത്തോടെ’ നിലനിർത്തി
  alternative: ‘ഭക്തിയോടെ’ അല്ലെങ്കിൽ ‘ഭയഭക്തിയോടെ’
  rationale: ദൈവത്തെ പിതാവെന്ന് വിളിക്കുന്ന അടുപ്പത്തോടൊപ്പം അവിടുത്തെ പക്ഷപാതമില്ലാത്ത വിധിയുടെ ഗൗരവവും വാക്യം ചേർത്തുനിർത്തുന്നു. മൃദുവായ ഒരർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതെ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: പ്രവൃത്തിക്കനുസരിച്ചുള്ള വിധിയുടെ വ്യാപ്തി
  choice: ‘ഓരോരുത്തന്റെയും പ്രവൃത്തിക്കനുസരിച്ച്’ എന്ന് നേരിട്ട് വിവർത്തനം ചെയ്തു
  alternative: വിശ്വാസികളുടെ പ്രവൃത്തികളുടെ അന്തിമവിധി എന്നോ ദൈവിക വിലയിരുത്തലിന്റെ പൊതുതത്ത്വം എന്നോ വിശദീകരിക്കുക
  rationale: ഗ്രീക്ക് പാഠം ഓരോരുത്തന്റെയും പ്രവൃത്തിക്കനുസരിച്ചുള്ള നിഷ്പക്ഷവിധി മാത്രം പ്രസ്താവിക്കുന്നു. പ്രതിഫലം, യോഗ്യത, രക്ഷാനിശ്ചയം എന്നിവയെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പരദേശവാസകാലം’ ഒന്നാം പത്രോസിലെ അന്യതാമസത്തിന്റെ ആശയം നിലനിർത്തുന്നു; ‘ഭയത്തോടെ’ എന്ന നേരിട്ടുള്ള പദപ്രയോഗം ദൈവത്തിന്റെ പിതൃത്വവും വിധിയും തമ്മിലുള്ള പാഠത്തിന്റെ ഗൗരവം സംരക്ഷിക്കുന്നു.
