  yaml_path: translation/nt/1_peter/001/009.yaml
  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: ml
  text: നിങ്ങൾ നിങ്ങളുടെ വിശ്വാസത്തിന്റെ ഫലം[a]—നിങ്ങളുടെ ആത്മാക്കളുടെ[b] രക്ഷ—പ്രാപിച്ചുകൊണ്ടിരിക്കുമ്പോൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങളുടെ വിശ്വാസത്തിന്റെ അവസാനം,’ ‘ലക്ഷ്യം,’ അല്ലെങ്കിൽ ‘പരിണതഫലം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ജീവൻ’ അല്ലെങ്കിൽ ‘വ്യക്തി.’ ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ആത്മാവ്,’ ‘ജീവൻ,’ അല്ലെങ്കിൽ ‘വ്യക്തി’ എന്നർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: പ്രാപിച്ചുകൊണ്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രാപനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; മധ്യമ/കർമണി രൂപത്തിന്റെ സൂക്ഷ്മത അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: τέλος
  choice: ഫലം
  rationale: ഇവിടെ വിശ്വാസം എത്തിച്ചേരുന്ന സാക്ഷാത്കൃത പരിണതഫലമാണ് ഉദ്ദേശിക്കുന്നത്. ‘അവസാനം’ വെറും കാലപരമായ അവസാനമായി തെറ്റിദ്ധരിക്കപ്പെടാം; ‘ലക്ഷ്യം’ ഉദ്ദേശ്യത്തിന് അമിത ഊന്നൽ നൽകാം.
- source_word: πίστεως
  choice: വിശ്വാസത്തിന്റെ
  rationale: സന്ദർഭത്തിൽ ഇത് വായനക്കാരുടെ വിശ്വാസത്തെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ‘വിശ്വസ്തത’യോ ‘ആശ്രയമോ’ ഇവിടെ മുഖ്യവായനയായി നിർബന്ധിതമല്ല.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന ഉടമസ്ഥസർവനാമം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: σωτηρίαν
  choice: രക്ഷ
  rationale: ലേഖനത്തിന്റെ സന്ദർഭത്തിൽ ഇപ്പോഴത്തെ അനുഭവത്തെയും ഭാവിയിലെ പൂർണതയെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന പതിവും യോജിച്ചതുമായ പദമാണ്.
- source_word: ψυχῶν
  choice: ആത്മാക്കളുടെ
  rationale: പരമ്പരാഗതവും നേരിട്ടുള്ളതുമായ വിവർത്തനം നിലനിർത്തുന്നു; എന്നാൽ ഗ്രീക്ക് പദത്തിന് ‘ജീവൻ’ അല്ലെങ്കിൽ ‘വ്യക്തി’ എന്നും അർഥമാകാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ അർഥസൂക്ഷ്മത
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ‘നിങ്ങളുടെ വിശ്വാസം’ എന്ന പ്രയോഗം വായനക്കാരുടെ വിശ്വസിക്കുന്ന പ്രതികരണത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; മറ്റു സാദ്ധ്യതകളെ സന്ദർഭം ഇവിടെ നിർബന്ധിക്കുന്നില്ല.
- issue: ‘ആത്മാക്കളുടെ രക്ഷ’ എന്നതിലെ ψυχαίയുടെ അർഥം
  choice: ആത്മാക്കൾ
  alternative: ജീവനുകൾ; വ്യക്തികൾ
  rationale: ഗ്രീക്ക് വാചകത്തിന്റെ പരമ്പരാഗത രൂപം നിലനിർത്തുന്നു; ഇതിലൂടെ ശരീരരക്ഷയെ നിഷേധിക്കുന്നതോ കർശനമായ ശരീര–ആത്മ ദ്വൈതവാദം സ്ഥാപിക്കുന്നതോ അല്ല. പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലവാക്യം മുൻസന്ദർഭത്തോട് ബന്ധപ്പെടുന്ന കൃദന്തരൂപമാണെങ്കിലും, ഒറ്റവാക്യമായി വായിക്കാവുന്ന വിധത്തിൽ ക്രിയ പൂർണമാക്കി. ഇടയ്ക്കുള്ള ദീർഘരേഖകൾ ‘വിശ്വാസത്തിന്റെ ഫലം’ എന്താണെന്ന് വിശദീകരിക്കുന്ന ‘രക്ഷ’യെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
