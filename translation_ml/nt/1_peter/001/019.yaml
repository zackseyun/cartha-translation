id: 1PE.1.19
reference: 1 Peter 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: ml
  text: മറിച്ച്, ഊനവും കറയും ഇല്ലാത്ത കുഞ്ഞാടിന്റേതുപോലെയുള്ള മശീഹായുടെ[a] വിലയേറിയ രക്തത്താലാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ക്രിസ്തുവിന്റെ.” ഗ്രീക്ക് പദമായ Χριστοῦ പരമ്പരാഗതമായി “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം; “മശീഹാ” എന്നത് ഇവിടെ ആ പദവിയുടെ അർഥം കൂടുതൽ സുതാര്യമാക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: മറിച്ച്
  rationale: മുൻവാക്യത്തിലെ ‘നശിച്ചുപോകുന്ന വസ്തുക്കളാലല്ല’ എന്ന നിഷേധത്തോട് ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: τιμίῳ
  choice: വിലയേറിയ
  rationale: ഉയർന്ന മൂല്യവും ആദരണീയതയും പ്രകടമാക്കുന്നു; രക്തത്തെ വെറും സാമ്പത്തിക വിലയുമായി ബന്ധിപ്പിക്കാതെ സ്വാഭാവികമായി വായിക്കാം.
- source_word: αἵματι
  choice: രക്തത്താൽ
  rationale: ഗ്രീക്കിലെ ഉപാധി സൂചിപ്പിക്കുന്ന ദാതിവിനെ നിലനിർത്തുന്നു. ബലിമരണത്തിന്റെ ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നുണ്ടെങ്കിലും ‘രക്തം’ എന്ന മൂർത്തപദം മാറ്റിയിട്ടില്ല.
- source_word: ὡς
  choice: -ന്റേതുപോലെയുള്ള
  rationale: താരതമ്യം രക്തത്തോടാണെന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀμνοῦ
  choice: കുഞ്ഞാട്
  rationale: നേരിട്ടുള്ള സാധാരണ പരിഭാഷ; ബലിയർപ്പണസംബന്ധമായ പ്രതിധ്വനി മുഖ്യവാചകത്തിൽ വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀμώμου
  choice: ഊനമില്ലാത്ത
  rationale: ബലിക്ക് അയോഗ്യമാക്കുന്ന ദോഷമോ വൈകല്യമോ ഇല്ലാത്തത് എന്ന അർഥം നിലനിർത്തുന്നു; വെറും ധാർമ്മിക കുറ്റമില്ലായ്മയായി ചുരുക്കുന്നില്ല.
- source_word: καὶ
  choice: -വും
  rationale: രണ്ട് സമാന്തര വിശേഷണങ്ങളെ ലളിതമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀσπίλου
  choice: കറയില്ലാത്ത
  rationale: ἀμώμου എന്നതിൽനിന്ന് വ്യത്യസ്തമായ ‘കറ/മലിനത ഇല്ലാത്ത’ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹായുടെ
  rationale: ഇവിടെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം സുതാര്യമായി നൽകുന്നു; ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തിബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഇവിടെ പദവി എന്ന നിലയിലെ അർഥം മുന്നിൽ വരുന്നു. പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപം സാധുവായ പകരമായി അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു; ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചുമത്തുന്നില്ല.
- issue: കുഞ്ഞാടുമായുള്ള താരതമ്യത്തിന്റെ ബന്ധം
  choice: രക്തത്തെ കുഞ്ഞാടിന്റെ രക്തത്തോട് താരതമ്യം ചെയ്യുന്നതായി സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിച്ചു
  alternative: മശീഹായെ ഊനവും കറയും ഇല്ലാത്ത കുഞ്ഞാടിനോട് നേരിട്ട് താരതമ്യം ചെയ്യുന്ന വാക്യക്രമം
  rationale: ὡς ἀμνοῦ എന്നത് τιμίῳ αἵματι എന്നതിനോടുള്ള താരതമ്യമായി വായിക്കുന്നത് വ്യാകരണപരമായി സ്വാഭാവികമാണ്. അതേസമയം മശീഹാ തന്നെയാണ് ആ കുഞ്ഞാടിന്റെ പ്രതിരൂപമെന്ന ദൈവശാസ്ത്രസൂചന ഇല്ലാതാക്കാതെ വാചകം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മുൻവാക്യവുമായി ബന്ധപ്പെടുന്ന ഖണ്ഡവാക്യസ്വഭാവം ‘മറിച്ച്’ എന്നും അവസാനത്തെ ‘രക്തത്താലാണ്’ എന്നും ഉപയോഗിച്ച് സംരക്ഷിച്ചു. ‘ഊനം/കറ’ എന്ന വ്യത്യസ്ത പദങ്ങൾ ബലിയർപ്പണസംബന്ധമായ ഇരട്ട വിവരണത്തെ നിലനിർത്തുന്നു.
