id: 1PE.1.10
reference: 1 Peter 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: ml
  text: ഈ രക്ഷയെക്കുറിച്ച്, നിങ്ങൾക്കായുള്ള കൃപയെപ്പറ്റി പ്രവചിച്ച പ്രവാചകന്മാർ ഉത്സാഹത്തോടെ അന്വേഷിക്കുകയും സൂക്ഷ്മമായി പരിശോധിക്കുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾക്കു വരാനിരുന്ന കൃപയെപ്പറ്റി.” ഭാവികാല ആശയം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കാമെങ്കിലും ഈ വാക്യത്തിൽ അത് വ്യക്തമായി പറഞ്ഞിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: ഈ രക്ഷയെക്കുറിച്ച്
  rationale: περί + ഷഷ്ഠി വിഷയം സൂചിപ്പിക്കുന്നു; ἧς മുൻസന്ദർഭത്തിലെ രക്ഷയിലേക്കു തിരിച്ചുചൂണ്ടുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ഈ രക്ഷ’ എന്നു നൽകി.
- source_word: σωτηρίας
  choice: രക്ഷ
  rationale: ഈ സന്ദർഭത്തിലെ σωτηρία ദൈവത്തിന്റെ രക്ഷാപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ‘രക്ഷ’ അതിന്റെ സാധാരണവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: ἐξεζήτησαν
  choice: ഉത്സാഹത്തോടെ അന്വേഷിച്ചു
  rationale: ἐκζητέω ഗൗരവത്തോടെയും തീക്ഷ്ണതയോടെയും അന്വേഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; രണ്ടാമത്തെ ക്രിയയിൽനിന്ന് അർത്ഥവ്യത്യാസം നിലനിർത്താൻ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: ἐξηραύνησαν
  choice: സൂക്ഷ്മമായി പരിശോധിച്ചു
  rationale: ἐξεραυνάω സമഗ്രമായ പരിശോധനയെയോ തിരച്ചിലെയോ സൂചിപ്പിക്കുന്നു; ആദ്യക്രിയയ്ക്കു പിന്നാലെയുള്ള ശക്തീകരണം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: προφῆται
  choice: പ്രവാചകന്മാർ
  rationale: തുടർന്നുള്ള വിശേഷണാത്മക കർത്തൃവാചക പ്രയോഗം ഏതു പ്രവാചകന്മാരാണെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക നിർദ്ദേശകപദം ആവശ്യമില്ല.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: നിങ്ങൾക്കായുള്ള കൃപയെപ്പറ്റി പ്രവചിച്ച പ്രവാചകന്മാർ
  rationale: കർത്തൃവാചക കൃന്തം ‘പ്രവാചകന്മാർ’ എന്നതിനെ വിശേഷിപ്പിക്കുന്നു; περί പ്രവചനത്തിന്റെ വിഷയവും εἰς ὑμᾶς വായനക്കാർക്കുള്ള ദിശയും പ്രയോജനവും സൂചിപ്പിക്കുന്നു.
- source_word: χάριτος
  choice: കൃപ
  rationale: രക്ഷാചരിത്രപരമായ ഈ സന്ദർഭത്തിൽ χάρις ദൈവത്തിന്റെ സൗജന്യാനുഗ്രഹത്തെ സൂചിപ്പിക്കുന്നു; ‘കൃപ’ സ്ഥാപിതവും യോജിച്ചതുമായ പദമാണ്.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങൾക്കായുള്ള
  rationale: വായനക്കാരിലേക്കുള്ള ദിശയും അവർക്കുള്ള പ്രയോജനവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; വ്യക്തമായി ഇല്ലാത്ത ഭാവികാലം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘നിങ്ങൾക്കായുള്ള കൃപ’ എന്നതിൽ ഭാവികാല ആശയം വ്യക്തമാക്കണമോ
  choice: പ്രധാന പാഠത്തിൽ ‘നിങ്ങൾക്കായുള്ള കൃപ’ എന്നു മാത്രം നിലനിർത്തി
  alternative: ‘നിങ്ങൾക്കു വരാനിരുന്ന കൃപ’
  rationale: പ്രവാചകന്മാരുടെയും വിശാലസന്ദർഭത്തിന്റെയും അടിസ്ഥാനത്തിൽ ഭാവിദിശ അനുമാനിക്കാമെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്കിൽ ഭാവികാലം തുറന്നുപറയുന്നില്ല. അതിനാൽ അത് പ്രധാന പാഠത്തിലേക്ക് ചേർക്കാതെ അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യവും തിരുവെഴുത്തിന് യോജിച്ചതുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ടു അന്വേഷണക്രിയകളുടെ വ്യത്യാസവും ശക്തീകരണവും നിലനിർത്തി; ദീർഘമായ കർത്തൃഭാഗം ഉണ്ടായിട്ടും മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം പിന്തുടർന്നു.
