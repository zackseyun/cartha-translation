id: 1PE.1.6
reference: 1 Peter 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ ⸀δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: ml
  text: ഇതിൽ നിങ്ങൾ ആനന്ദിക്കുന്നു; എങ്കിലും ഇപ്പോൾ അല്പകാലത്തേക്ക്, ആവശ്യമെങ്കിൽ, വിവിധ പരീക്ഷണങ്ങളാൽ ദുഃഖിതരായിട്ടുണ്ടെങ്കിലും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ഇതിൽ
  rationale: മുൻവാക്യങ്ങളിലെ രക്ഷ, പ്രത്യാശ, അവകാശം എന്നിവയുടെ സമുച്ചയത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം. കാരണബന്ധം കൂടുതൽ ശക്തമാക്കാതെ, ἐν എന്നതിന്റെ പരിധി/അടിസ്ഥാനം എന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀγαλλιᾶσθε
  choice: നിങ്ങൾ ആനന്ദിക്കുന്നു
  rationale: ശക്തമായ സന്തോഷത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം; അതേസമയം ‘അതിയായി’ എന്ന ഘടകം ചേർത്ത് തീവ്രത അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ὀλίγον ἄρτι
  choice: ഇപ്പോൾ അല്പകാലത്തേക്ക്
  rationale: ἄρτι സൂചിപ്പിക്കുന്ന ഇപ്പോഴത്തെ സമയവും ὀλίγον സൂചിപ്പിക്കുന്ന ഹ്രസ്വകാലവും രണ്ടും സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰ δέον
  choice: ആവശ്യമായിരിക്കുന്നെങ്കിൽ
  rationale: εἰ എന്ന വ്യവസ്ഥാഭാവവും δέον എന്ന ആവശ്യകതയും വ്യാഖ്യാനാത്മകമായ ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: λυπηθέντες
  choice: നിങ്ങൾ ദുഃഖിതരായിരിക്കുന്നു
  rationale: ദുഃഖം അനുഭവിക്കേണ്ടിവന്ന അവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ഗ്രീക്കിലെ കൃതന്തത്തിന്റെ കാലബന്ധം പ്രധാനക്രിയയോടു ചേർന്നാണ് ഗ്രഹിക്കേണ്ടത്; അതിനാൽ ഇപ്പോഴത്തെ അനുഭവഭാവം നിലനിർത്തി.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: പലതരം പരീക്ഷകളാൽ
  rationale: സന്ദർഭം കഷ്ടാനുഭവങ്ങളെയും വിശ്വാസത്തിന്റെ പരിശോധനയെയും കുറിച്ചായതിനാൽ ‘പരീക്ഷകൾ’ യോജിക്കുന്നു. ‘-കളാൽ’ ദുഃഖത്തിന് ഇടയാക്കുന്ന സാഹചര്യം/മാർഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; പദത്തിന്റെ വിശാല അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: കഷ്ടാനുഭവങ്ങളുടെ സന്ദർഭത്തിൽ πειρασμοῖς എന്നതിന്റെ അർത്ഥം
  choice: പരീക്ഷകൾ
  alternative: പരിശോധനകൾ; പ്രലോഭനങ്ങൾ
  rationale: തുടർന്നുള്ള വാക്യത്തിൽ വിശ്വാസത്തിന്റെ പരിശോധന പറയുന്നതിനാൽ ബാഹ്യമായ കഷ്ടാനുഭവങ്ങളെയും ശോധനാസാഹചര്യങ്ങളെയും ഉൾക്കൊള്ളുന്ന ‘പരീക്ഷകൾ’ ഇവിടെ ഏറ്റവും യോജിക്കുന്നു. പാപത്തിലേക്കുള്ള പ്രലോഭനം എന്ന അർത്ഥത്തിലേക്ക് വാചകത്തെ ചുരുക്കുന്നില്ല; പദത്തിന്റെ മറ്റു സന്ദർഭങ്ങളിലെ അർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: εἰ δέον എന്ന വ്യവസ്ഥയും ആവശ്യകതയും
  choice: ആവശ്യമായിരിക്കുന്നെങ്കിൽ
  alternative: ആവശ്യമെങ്കിൽ; ആവശ്യമായതിനാൽ
  rationale: കഷ്ടത നിർബന്ധമായും സംഭവിക്കണം എന്ന നിലയിൽ വാചകത്തെ ദൃഢപ്പെടുത്താതെ, മൂലത്തിലെ വ്യവസ്ഥാഭാവവും ആവശ്യകതയും തമ്മിലുള്ള പിരിമുറുക്ക് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സന്തോഷവും ഇപ്പോഴത്തെ ദുഃഖവും തമ്മിലുള്ള വിരോധം ‘എങ്കിലും’ മുഖേന വ്യക്തമാക്കുന്നു. പദക്രമം വായനാസൗകര്യത്തിനായി ക്രമപ്പെടുത്തിയെങ്കിലും മൂലത്തിലെ വ്യവസ്ഥാഭാവവും അർത്ഥവ്യാപ്തിയും നിലനിർത്തിയിരിക്കുന്നു.
