revisions:
- from: ഇതിൽ നിങ്ങൾ ആനന്ദിക്കുന്നു; എങ്കിലും ഇപ്പോൾ അല്പകാലത്തേക്ക്, ആവശ്യമായിരിക്കുന്നെങ്കിൽ, പലതരം പരീക്ഷകളാൽ[a] നിങ്ങൾ ദുഃഖിതരായിരിക്കുന്നു.
  to: ഇതിൽ നിങ്ങൾ ആനന്ദിക്കുന്നു; എങ്കിലും ഇപ്പോൾ അല്പകാലത്തേക്ക്, ആവശ്യമെങ്കിൽ, വിവിധ പരീക്ഷണങ്ങളാൽ ദുഃഖിതരായിട്ടുണ്ടെങ്കിലും.
  rationale: തിരുത്തൽ ഗ്രീക്കിലെ ഇപ്പോഴത്തെ ആനന്ദവും അതിനോടു വിരുദ്ധമായി നിലക്കുന്ന, മുൻകൂർ അനുഭവമായി അവതരിപ്പിച്ച ദുഃഖവും സംരക്ഷിക്കുന്നു. εἰ δέον-ന്റെ സോപാധികത ‘ആവശ്യമെങ്കിൽ’ എന്നതിലൂടെ നിലനിർത്തിയിരിക്കുന്നു. ἐν ποικίλοις πειρασμοῖς-നെ ഉപകരണ/കാരണബന്ധത്തിൽ ‘വിവിധ പരീക്ഷണങ്ങളാൽ’ എന്ന് നൽകുകയും പദത്തിന്റെ മറ്റു അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
