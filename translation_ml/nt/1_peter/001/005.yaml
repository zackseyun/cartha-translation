source:
  edition: SBLGNT
  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: ml
  text: ദൈവത്തിന്റെ ശക്തിയാൽ വിശ്വാസത്തിലൂടെ[a], അവസാനകാലത്ത്[b] വെളിപ്പെടാൻ ഒരുങ്ങിയിരിക്കുന്ന രക്ഷയിലേക്കായി കാത്തുസൂക്ഷിക്കപ്പെടുന്ന നിങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആശ്രയത്തിലൂടെ’; ഇവിടെ സാധ്യത കുറവായി, ‘വിശ്വസ്തതയിലൂടെ’.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അവസാന സമയത്ത്’.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουρουμένους
  choice: കാത്തുസൂക്ഷിക്കപ്പെടുന്ന / കാക്കപ്പെടുന്നത്
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ കൃദന്തം അഭിസംബോധിതർ തുടർച്ചയായി കാക്കപ്പെടുന്നു എന്ന ആശയം നൽകുന്നു. ‘കാത്തുസൂക്ഷിക്കുക’ സംരക്ഷണപരവും കാവൽസംബന്ധവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν δυνάμει θεοῦ
  choice: ദൈവത്തിന്റെ ശക്തിയാൽ
  rationale: നിഷ്ക്രിയ ക്രിയയോടു ചേർന്ന ἐν ഇവിടെ മാർഗമോ ഉപകരണമോ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘-ആൽ’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: διὰ πίστεως
  choice: വിശ്വാസത്തിലൂടെ
  rationale: διά + genitive മാർഗത്തെ സൂചിപ്പിക്കുന്നു. πίστις ഇവിടെ സ്വാഭാവികമായി ‘വിശ്വാസം’ എന്നാണ്; ‘ആശ്രയത്തിലൂടെ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εἰς σωτηρίαν
  choice: രക്ഷയ്ക്കായി
  rationale: εἰς ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ഭാവിമുഖമായ വിശേഷണവുമായി ചേർന്ന് ‘രക്ഷയ്ക്കായി’ എന്നത് ലക്ഷ്യദിശ വ്യക്തമാക്കുന്നു.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: വെളിപ്പെടാൻ തയ്യാറായിരിക്കുന്ന
  rationale: ἕτοιμος + നിഷ്ക്രിയ infinitive എന്ന ഘടനയെ നേരിട്ടും സ്വാഭാവികമായും പകർന്നു, രക്ഷയുടെ ഭാവിയിലെ വെളിപ്പെടൽ നിലനിർത്തുന്നു.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: അവസാനകാലത്ത്
  rationale: καιρός നിർണായകമോ നിയുക്തമോ ആയ സമയത്തെ സൂചിപ്പിക്കുന്നു. ‘അവസാനകാലത്ത്’ യുഗാന്തപരമായ ദിശ നിലനിർത്തുന്നു; ‘അവസാന സമയത്ത്’ എന്ന കൂടുതൽ ബിന്ദുസമാന വായന അടിക്കുറിപ്പിലുണ്ട്.
- source_word: τοὺς
  choice: നിങ്ങൾ
  rationale: ആർട്ടിക്കിൾ മുൻവാക്യത്തിലെ അഭിസംബോധിതരെ വീണ്ടും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ മുൻസന്ദർഭബന്ധം വ്യക്തമാക്കാൻ ‘നിങ്ങൾ’ ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ദൈവിക സംരക്ഷണവും മനുഷ്യന്റെ വിശ്വാസവും തമ്മിലുള്ള ബന്ധം
  choice: ദൈവത്തിന്റെ ശക്തിയാണ് കാത്തുസൂക്ഷിക്കുന്ന മാർഗം/ശക്തി; വിശ്വാസത്തിലൂടെയാണ് അത് അഭിസംബോധിതരുമായി ബന്ധപ്പെട്ട് പ്രവർത്തിക്കുന്നത്.
  alternative: വിശ്വാസത്തെ വെറും വിവരണാത്മക കൂട്ടിച്ചേർക്കലായി കാണുക, അല്ലെങ്കിൽ πίστις എന്നതിന് ഇവിടെ പ്രധാനമായി ‘വിശ്വസ്തത’ എന്നു നൽകുക.
  rationale: വാക്യഘടന ദൈവത്തിന്റെ ശക്തിയെയും വിശ്വാസത്തിലൂടെയെന്ന മധ്യസ്ഥതയെയും ഒരുമിച്ച് നിലനിർത്തുന്നു. സ്ഥിരതയെയോ വീഴ്ചയെയോ കുറിച്ചുള്ള ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ നിഗമനം വിവർത്തനം ചേർക്കുന്നില്ല.
- issue: രക്ഷയുടെ യുഗാന്തപരമായ സമയം
  choice: രക്ഷ അതിന്റെ വെളിപ്പെടലിൽ ഭാവിമുഖമാണ്.
  alternative: ഇത് ഇപ്പോഴത്തെ മാനസാന്തരത്തെ മാത്രം സൂചിപ്പിക്കുന്നു, അല്ലെങ്കിൽ രക്ഷയ്ക്ക് യാതൊരു വർത്തമാനവശവുമില്ലെന്ന് നിർണ്ണയിക്കുന്നു.
  rationale: ‘അവസാനകാലത്ത് വെളിപ്പെടാൻ തയ്യാറായിരിക്കുന്ന’ എന്നത് ഭാവിയിലെ അനാവരണം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; എന്നാൽ പുതിയ നിയമത്തിലെ രക്ഷയുടെ മറ്റു കാലപരമായ വശങ്ങളെക്കുറിച്ച് ഈ വാക്യത്തിനപ്പുറം നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഒറ്റ ഗ്രീക്ക് ആശ്രിതഘടന മലയാളത്തിൽ ഭാരം കൂടാതിരിക്കാൻ ‘നിങ്ങൾ’ എന്നു വ്യക്തമാക്കി, അവസാനം ‘ഇങ്ങനെ കാക്കപ്പെടുന്നത്’ എന്നു പുനരാവർത്തിച്ചു; ഇതിലൂടെ തുടരുന്ന നിഷ്ക്രിയ സംരക്ഷണവും രക്ഷയിലേക്കുള്ള ലക്ഷ്യബന്ധവും വ്യക്തമായി.
