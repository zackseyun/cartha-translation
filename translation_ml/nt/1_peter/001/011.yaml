id: 1PE.1.11
reference: 1 Peter 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: ml
  text: അവരിലുള്ള മശീഹയുടെ ആത്മാവ് മശീഹയ്ക്കുള്ള കഷ്ടതകളെക്കുറിച്ചും അവയ്ക്കുശേഷമുള്ള മഹത്വങ്ങളെക്കുറിച്ചും മുൻകൂട്ടി സാക്ഷ്യം പറഞ്ഞുകൊണ്ട്, ഏത് വ്യക്തിയെയോ എങ്ങനെയുള്ള കാലത്തെയോ സൂചിപ്പിച്ചുകൊണ്ടിരുന്നതെന്ന് അവർ അന്വേഷിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മശീഹയുടെ കഷ്ടതകൾ.”
    reason: τὰ εἰς Χριστὸν παθήματα എന്ന പ്രയോഗത്തിന് സന്ദർഭപരമായി ശക്തമായ മറ്റൊരു വ്യാഖ്യാനം.
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: പ്രവാചകന്മാരുടെ സൂക്ഷ്മമായ തിരച്ചിലിനെയും അപൂർണ്ണ ഭൂതകാലസന്ദർഭത്തിലെ തുടർച്ചയെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: ആരെയാണ് അല്ലെങ്കിൽ എങ്ങനെയുള്ള സമയത്തെയാണ്
  rationale: τίνα എന്നതിലെ വ്യക്തിസൂചനയും ποῖον καιρόν എന്നതിലെ സമയത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള ചോദ്യവും രണ്ടായി നിലനിർത്തുന്നു.
- source_word: ἐδήλου
  choice: സൂചിപ്പിച്ചതെന്ന്
  rationale: ആത്മാവ് തിരിച്ചറിയിച്ചുകൊണ്ടിരുന്ന അർഥം നൽകുന്നു; വാക്യഘടനയിൽ തുടർച്ചയുടെ ഭാവം മുഖ്യക്രിയയിലൂടെ പ്രകടമാണ്.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: അവരിലുള്ള മശീഹയുടെ ആത്മാവ്
  rationale: ആത്മാവ് പ്രവാചകന്മാരിൽ ഉണ്ടായിരുന്നുവെന്നതും Χριστός പദത്തിന്റെ പദവിനാമാർഥമായ ‘മശീഹ’യും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: προμαρτυρόμενον
  choice: മുൻകൂട്ടി സാക്ഷ്യം പറഞ്ഞപ്പോൾ
  rationale: προ- എന്ന മുൻകാലസൂചനയും μαρτυρέω എന്ന സാക്ഷ്യത്തിന്റെ ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: മശീഹയ്ക്കുള്ള കഷ്ടതകൾ
  rationale: εἰς എന്ന ദിശാത്മക/ബന്ധപരമായ രൂപം അതിയായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു; സ്വാഭാവികമായ ഉടമസ്ഥവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: അവയ്ക്കുശേഷമുള്ള മഹത്വങ്ങൾ
  rationale: δόξας എന്ന ബഹുവചനവും കഷ്ടതകൾക്കുശേഷമുള്ള കാലക്രമവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രവാചകന്മാരിലുള്ള ‘മശീഹയുടെ ആത്മാവ്’ എന്ന പ്രയോഗം
  choice: ‘അവരിലുള്ള മശീഹയുടെ ആത്മാവ്’ എന്ന നേരിട്ടുള്ള ഭാഷ നിലനിർത്തി.
  alternative: മശീഹയെക്കുറിച്ച് സംസാരിച്ച പ്രവചനാത്മാവ്
  rationale: ഗ്രീക്ക് വാചകം ആത്മാവിനെ മശീഹയോടു നേരിട്ട് ബന്ധിപ്പിക്കുന്നു; അതിനെ വ്യാഖ്യാനപരമായ പുനരാഖ്യാനത്തിലൂടെ ലഘൂകരിക്കുന്നില്ല.
- issue: τὰ εἰς Χριστὸν παθήματα എന്നതിലെ εἰς-ന്റെ ബലം
  choice: പ്രധാനപാഠത്തിൽ ‘മശീഹയ്ക്കുള്ള കഷ്ടതകൾ’.
  alternative: ‘മശീഹയുടെ കഷ്ടതകൾ’
  rationale: മൂലത്തിലെ അസാധാരണമായ മുൻനിലപദബന്ധം പ്രധാനപാഠത്തിൽ പ്രതിഫലിപ്പിക്കുകയും സന്ദർഭപരമായി ശക്തമായ ഉടമസ്ഥവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘എങ്ങനെയുള്ള സമയം’ എന്ന രൂപം ποῖον എന്ന ഗുണപരമായ ഭാവം സംരക്ഷിക്കുന്നു; ‘മഹത്വങ്ങൾ’ എന്ന ബഹുവചനം മൂലപാഠത്തോടൊത്താണ്.
