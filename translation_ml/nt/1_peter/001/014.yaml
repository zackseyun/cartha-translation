source:
  edition: SBLGNT
  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: ml
  text: അനുസരണത്തിന്റെ മക്കളെന്ന നിലയിൽ,[a] നിങ്ങളുടെ അജ്ഞതയിൽ മുമ്പ് ഉണ്ടായിരുന്ന മോഹങ്ങൾക്കനുസരിച്ച് നിങ്ങളെത്തന്നെ അനുരൂപരാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അനുസരണയുള്ള മക്കളെന്ന നിലയിൽ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “അനുസരണത്തിന്റെ മക്കൾ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: എന്ന നിലയിൽ
  rationale: ഉപദേശത്തിൽ അഭിസംബോധിതരുടെ സ്വഭാവപരമായ നിലയെയും അതിനൊത്ത പെരുമാറ്റരീതിയെയും സൂചിപ്പിക്കുന്നു.
- source_word: τέκνα ὑπακοῆς
  choice: അനുസരണത്തിന്റെ മക്കൾ
  rationale: ‘അനുസരണയുള്ള മക്കൾ’ എന്ന സ്വാഭാവിക മലയാളത്തിന് പകരം ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയും അനുസരണത്താൽ സവിശേഷീകരിക്കപ്പെടുന്ന തിരിച്ചറിയലും നിലനിർത്തുന്നു.
- source_word: μὴ συσχηματιζόμενοι
  choice: നിങ്ങളെത്തന്നെ രൂപപ്പെടുത്തരുത്
  rationale: വർത്തമാനകാല മധ്യ/കർമണി പങ്കാളിത്തരൂപത്തിന്റെ നിരോധനാത്മക ശക്തിയും വ്യക്തികളുടെ ധാർമിക ഉത്തരവാദിത്വവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ταῖς ... ἐπιθυμίαις
  choice: മോഹങ്ങൾക്കനുസരിച്ച്
  rationale: ἐπιθυμίαι എന്നത് ഇവിടെ ധാർമികമായി വഴിതെറ്റിയ ശക്തമായ ആഗ്രഹങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘മോഹങ്ങൾ’ അതിന്റെ പ്രതികൂല നൈതിക ഭാവം നിലനിർത്തുകയും ലൈംഗിക അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πρότερον
  choice: മുമ്പ് ... ഉണ്ടായിരുന്ന
  rationale: വായനക്കാരുടെ മുൻകാല ജീവിതാവസ്ഥയോടാണ് മോഹങ്ങൾ ബന്ധപ്പെട്ടിരുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമായി കാണിക്കുന്നു.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: നിങ്ങൾ ... അജ്ഞതയിൽ ആയിരുന്നപ്പോൾ
  rationale: കാലപരവും അവസ്ഥാപരവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അജ്ഞതയുടെ ഉള്ളടക്കം പാഠത്തിൽ ഇല്ലാത്ത വിധം വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: τέκνα ὑπακοῆς എന്ന തിരിച്ചറിയൽസൂചക ജനിറ്റീവ് പ്രയോഗം വിശേഷണരൂപത്തിലാക്കി ലളിതമാക്കണമോ
  choice: അനുസരണത്തിന്റെ മക്കൾ
  alternative: അനുസരണയുള്ള മക്കൾ
  rationale: ഗ്രീക്കിലെ അസാധാരണമായെങ്കിലും അർഥസമ്പന്നമായ ഘടന നിലനിർത്തി, അനുസരണം ഒരു ഗുണം മാത്രമല്ല അവരെ സവിശേഷീകരിക്കുന്ന തിരിച്ചറിയലാണെന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു; അതേസമയം പാഠത്തിന് അതീതമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: συσχηματιζόμενοι എന്ന മധ്യ/കർമണി രൂപത്തിലെ കർത്തൃത്വത്തിന്റെ അനിശ്ചിതത്വം
  choice: നിങ്ങളെത്തന്നെ രൂപപ്പെടുത്തരുത്
  alternative: രൂപപ്പെടുത്തപ്പെടരുത്
  rationale: ഉപദേശാത്മക സന്ദർഭത്തിൽ പ്രതിഫലനാത്മക അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. കർമണി സാധ്യത നിലനിൽക്കുന്നെങ്കിലും ഈ തെരഞ്ഞെടുപ്പ് വ്യക്തികളുടെ ധാർമിക പ്രതികരണത്തെ ഉചിതമായി പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ തിരിച്ചറിയൽസൂചക പ്രയോഗം പ്രധാനവാചകത്തിൽ സൂക്ഷിക്കുകയും കൂടുതൽ സ്വാഭാവികമായ മലയാളരൂപം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
