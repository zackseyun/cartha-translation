  terminology: ‘ആത്മാക്കളെ,’ ‘സഹോദരസ്നേഹം,’ and ‘സ്നേഹിക്കുവിൻ’ appropriately retain the source’s lexical texture without asserting an exaggerated theological distinction between the two Greek love terms. The inclusive scope of φιλαδελφία is appropriately supplied in the footnote.
