id: 1PE.1.22
reference: 1 Peter 1:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: ml
  text: സത്യത്തോടുള്ള അനുസരണത്താൽ നിങ്ങളുടെ ആത്മാക്കളെ ശുദ്ധീകരിച്ചവരായി, നിഷ്കപടമായ സഹോദരസ്നേഹത്തിനായി[a], ഹൃദയത്തിൽനിന്ന്[b] പരസ്പരം തീവ്രമായി സ്നേഹിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹവിശ്വാസികളോടുള്ള സ്നേഹത്തിനായി.’ ‘സഹോദരസ്നേഹം’ എന്ന ഗ്രീക്ക് പദം സഹോദരന്മാരെയും സഹോദരിമാരെയും ഉൾക്കൊള്ളുന്ന സഹവിശ്വാസികളോടുള്ള കുടുംബസദൃശമായ വാത്സല്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ശുദ്ധമായ ഹൃദയത്തിൽനിന്ന്’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: ശുദ്ധീകരിച്ച്
  rationale: പൂർണകാല കർത്തൃപ്രയോഗം മുഖ്യകല്പനയ്ക്കു മുമ്പുള്ളതും ഇപ്പോഴും പ്രസക്തിയുള്ളതുമായ പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നതിനായി ‘ശുദ്ധീകരിച്ച്’ ഉപയോഗിച്ചു.
- source_word: ψυχὰς
  choice: ആത്മാക്കളെ
  rationale: ψυχή ഇവിടെ വ്യക്തികളുടെ ആന്തരികജീവിതം ഉൾപ്പെടുന്ന അവരെത്തന്നെ സൂചിപ്പിക്കുന്നു; ഉറവിടത്തിലെ പദരൂപം നിലനിർത്താൻ ‘ആത്മാക്കളെ’ തെരഞ്ഞെടുത്തു.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: സത്യത്തെ അനുസരിച്ചതിലൂടെ
  rationale: ἐν എന്നതിന്റെ മാർഗസൂചക സാധ്യത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ശുദ്ധീകരണവും സത്യത്തോടുള്ള അനുസരണവും തമ്മിലുള്ള അടുത്ത ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἀληθείας
  choice: സത്യം
  rationale: ഗ്രീക്കിലെ നിർദ്ദിഷ്ടത സന്ദർഭത്തിൽ സുവിശേഷസത്യത്തെ സൂചിപ്പിക്കുന്നു; ‘സത്യത്തെ’ എന്ന വിഭക്തിരൂപം മലയാളത്തിൽ ഈ നിർദ്ദിഷ്ട ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: നിഷ്കപടമായ സഹോദരസ്നേഹത്തിനായി
  rationale: εἰς ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കുന്നു. ἀνυπόκριτος എന്നതിനു ‘നിഷ്കപടമായ’ എന്നും φιλαδελφία എന്നതിനു കുടുംബസദൃശമായ വിശ്വാസിസ്നേഹം നിലനിർത്തുന്ന ‘സഹോദരസ്നേഹം’ എന്നും നൽകി.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പരസ്പരപ്രയോഗം.
- source_word: ἀγαπήσατε
  choice: സ്നേഹിക്കുവിൻ
  rationale: നിർണായക ആഹ്വാനം നൽകുന്ന ബഹുവചന കല്പനയായി പരിഭാഷപ്പെടുത്തി; തുടർച്ച എന്ന ആശയം അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: ἐκ καρδίας
  choice: ഹൃദയത്തിൽനിന്ന്
  rationale: SBLGNT പാഠത്തിൽ വിശേഷണം ഇല്ലാത്തതിനാൽ ‘ശുദ്ധമായ’ എന്നു മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἐκτενῶς
  choice: തീക്ഷ്ണമായി
  rationale: സ്നേഹത്തിന്റെ ശക്തിയും ആത്മാർഥമായ തീവ്രതയും പ്രകടിപ്പിക്കുന്നു; വെറും വികാരഗാഢതയിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: φιλαδελφίαയും ἀγαπάωയും തമ്മിലുള്ള പദവ്യത്യാസം
  choice: φιλαδελφίαയെ ‘സഹോദരസ്നേഹം’ എന്നും ἀγαπήσατεയെ ‘സ്നേഹിക്കുവിൻ’ എന്നും വേർതിരിച്ചു.
  alternative: രണ്ടിടത്തും ‘സ്നേഹം/സ്നേഹിക്കുക’ മാത്രം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ബന്ധമുള്ളതെങ്കിലും വ്യത്യസ്തമായ രണ്ടു സ്നേഹപദങ്ങളുടെ വാചകഘടന നിലനിർത്തുന്നു; അതേസമയം അവയ്ക്കിടയിൽ അതിരുകടന്ന ദൈവശാസ്ത്രവ്യത്യാസം സൃഷ്ടിക്കുന്നില്ല.
- issue: φιλαδελφίαയുടെ ലിംഗവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരസ്നേഹം’ നിലനിർത്തി അതിന്റെ ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘സഹവിശ്വാസികളോടുള്ള സ്നേഹം’ അല്ലെങ്കിൽ ‘സഹോദരീസഹോദരന്മാരോടുള്ള സ്നേഹം’.
  rationale: കുടുംബബന്ധത്തിന്റെ രൂപകവും തുടർന്നുള്ള സാധാരണ സ്നേഹകല്പനയിൽനിന്നുള്ള പദവ്യത്യാസവും സംരക്ഷിക്കുമ്പോൾ, സഹോദരിമാരും ഉൾപ്പെടുന്നു എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἐκ καρδίας എന്നിടത്തെ പാഠഭേദം
  choice: SBLGNT അനുസരിച്ച് ‘ഹൃദയത്തിൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ശുദ്ധമായ ഹൃദയത്തിൽനിന്ന്’.
  rationale: ‘ശുദ്ധമായ’ എന്നത് ചില കൈയെഴുത്തുപ്രതികളിലെ καθαρᾶς ഉൾപ്പെട്ട പാഠഭേദമാണ്; അടിസ്ഥാനപാഠത്തിൽ അത് ചേർക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഹ്വാനശൈലി. ‘സഹോദരസ്നേഹം’ എന്ന പദം ഉറവിടത്തിലെ കുടുംബരൂപകവും രണ്ടു സ്നേഹപദങ്ങളുടെ വ്യത്യാസവും നിലനിർത്തുന്നു; ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു.
