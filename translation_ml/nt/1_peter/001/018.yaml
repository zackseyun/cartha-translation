id: 1PE.1.18
reference: 1 Peter 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: ml
  text: നശിച്ചുപോകുന്ന വസ്തുക്കളായ വെള്ളിയോ പൊന്നോ കൊണ്ടല്ല, നിങ്ങളുടെ പിതാക്കന്മാരിൽനിന്ന് പാരമ്പര്യമായി ലഭിച്ച[b] വ്യർഥമായ ജീവിതരീതിയിൽനിന്ന് നിങ്ങൾ വീണ്ടെടുക്കപ്പെട്ടത്[a] എന്നു നിങ്ങൾ അറിയുന്നുവല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മോചനവില നൽകി വിടുവിക്കപ്പെട്ടത്.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് വിലകൊടുത്ത് മോചിപ്പിക്കുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളുടെ പൂർവികരിൽനിന്ന് കൈമാറിക്കിട്ടിയ.’ അക്ഷരാർഥത്തിൽ, ‘നിങ്ങളുടെ പിതാക്കന്മാരിൽനിന്ന് കൈമാറിക്കിട്ടിയ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: എന്നു നിങ്ങൾ അറിയുന്നുവല്ലോ
  rationale: οἶδα എന്ന ക്രിയയുടെ കൃതന്തസ്വഭാവം ചുറ്റുമുള്ള പ്രബോധനവുമായി ബന്ധിപ്പിച്ചുകൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ കാരണാത്മക പശ്ചാത്തലം നൽകുന്നു.
- source_word: ἐλυτρώθητε
  choice: നിങ്ങൾ വീണ്ടെടുക്കപ്പെട്ടത്
  rationale: λυτρόομαι വിലകൊടുത്തുള്ള മോചനത്തെ സൂചിപ്പിക്കുന്നു. ‘വീണ്ടെടുക്കപ്പെട്ടു’ എന്നത് മോചനത്തിന്റെ അർഥവും തുടർന്നുള്ള വെള്ളി-പൊന്ന് എന്ന വിലസംബന്ധിയായ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: φθαρτοῖς
  choice: നശിച്ചുപോകുന്ന വസ്തുക്കൾ
  rationale: സന്ദർഭത്തിൽ നാമമായി പ്രവർത്തിക്കുന്ന വിശേഷണത്തിന്റെ ക്ഷയിക്കുന്നതും നിലനിൽക്കാത്തതുമായ സ്വഭാവം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: വെള്ളിയോ പൊന്നോ കൊണ്ട്
  rationale: മോചനത്തിനുള്ള വിലയെന്ന ഉപകരണാർഥമുള്ള ദത്തിവ് മലയാളത്തിൽ ‘കൊണ്ട്’ എന്നുപയോഗിച്ച് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐκ
  choice: നിന്ന്
  rationale: മുൻ ജീവിതരീതിയിൽനിന്നുള്ള വേർപാടും മോചനവും സൂചിപ്പിക്കുന്ന ഉറവിടാർഥം നിലനിർത്തുന്നു.
- source_word: ματαίας
  choice: വ്യർഥമായ
  rationale: μάταιος സൂചിപ്പിക്കുന്ന ഫലശൂന്യതയും ശൂന്യതയും സംക്ഷിപ്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀναστροφῆς
  choice: ജീവിതരീതി
  rationale: പെരുമാറ്റം മാത്രമല്ല, ഒരാളുടെ സമഗ്രമായ ജീവിതനടപ്പും ഉൾക്കൊള്ളുന്ന ἀναστροφήയുടെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: πατροπαραδότου
  choice: നിങ്ങളുടെ പിതാക്കന്മാരിൽനിന്ന് പാരമ്പര്യമായി ലഭിച്ച
  rationale: ‘പിതാക്കന്മാരിൽനിന്ന് കൈമാറിക്കിട്ടിയ’ എന്ന ഗ്രീക്ക് ആശയം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുകയും പിതൃസംബന്ധമായ മൂലപദപ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വീണ്ടെടുപ്പിന്റെ പദപ്രയോഗം
  choice: വീണ്ടെടുക്കപ്പെട്ടത്
  alternative: മോചനവില നൽകി വിടുവിക്കപ്പെട്ടത്
  rationale: വിലകൊടുത്തുള്ള മോചനത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; എന്നാൽ ഈ വാക്യഭാഗം മാത്രം പറയുന്നതിലധികമായ ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം അതിൽ ചേർക്കുന്നില്ല.
- issue: പാരമ്പര്യമായി ലഭിച്ച ജീവിതരീതിയുടെ ഉറവിടം
  choice: നിങ്ങളുടെ പിതാക്കന്മാരിൽനിന്ന്
  alternative: നിങ്ങളുടെ പൂർവികരിൽനിന്ന്
  rationale: πατροπαράδοτος എന്ന പദത്തിലെ വ്യക്തമായ പിതൃഭാഷ മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു; വിശാലമായ പൂർവികർ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഗ്രീക്ക് വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ, നിഷേധാത്മക വിലപ്രയോഗം ആദ്യം വെച്ച് മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്ക് പാലിച്ചിരിക്കുന്നു; ‘അറിയുന്നുവല്ലോ’ എന്നത് കൃതന്തത്തിന്റെ മുൻസന്ദർഭബന്ധം നിലനിർത്തുന്നു.
