revisions:
- from: 'യേശു മശീഹയുടെ[a] അപ്പൊസ്തലനായ പത്രോസ്, പൊന്തോസ്, ഗലാത്യ, കപ്പദോക്യ, ഏഷ്യ, ബിഥുന്യ എന്നിവിടങ്ങളിലെ ചിതറിപ്പാർപ്പിൽ കഴിയുന്ന തിരഞ്ഞെടുക്കപ്പെട്ട പരദേശികൾക്ക്[b][c]:'
  to: 'യേശുവായ മശീഹയുടെ അപ്പൊസ്തലനായ പത്രോസ്, പൊന്തൊസ്, ഗലാത്യ, കപ്പദോക്യ, ആസ്യ, ബിഥുന്യ എന്നിവിടങ്ങളിലെ പ്രവാസത്തിൽ ചിതറിപ്പാർക്കുന്ന തിരഞ്ഞെടുക്കപ്പെട്ട പരദേശികൾക്ക്:'
