id: 1PE.1.1
reference: 1 Peter 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: ml
  text: 'യേശുവായ മശീഹയുടെ അപ്പൊസ്തലനായ പത്രോസ്, പൊന്തൊസ്, ഗലാത്യ, കപ്പദോക്യ, ആസ്യ, ബിഥുന്യ എന്നിവിടങ്ങളിലെ പ്രവാസത്തിൽ ചിതറിപ്പാർക്കുന്ന തിരഞ്ഞെടുക്കപ്പെട്ട പരദേശികൾക്ക്:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πέτρος
  choice: പത്രോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം സ്വീകരിച്ചു.
- source_word: ἀπόστολος
  choice: അപ്പൊസ്തലൻ
  rationale: ഇവിടെ വെറും ദൂതൻ എന്ന പൊതുവായ അർഥമല്ല, അയയ്ക്കപ്പെട്ട അംഗീകൃത ശുശ്രൂഷകന്റെ സ്ഥാനവും അധികാരവും സൂചിപ്പിക്കുന്ന പദമായതിനാൽ പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ രൂപം നിലനിർത്തി.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയുടെ
  rationale: Χριστός എന്ന പദത്തിന്റെ അഭിഷിക്തൻ/മശീഹ എന്ന പദവിസ്വഭാവം പ്രകടമാക്കുന്നു; സ്വാഭാവികമായ മലയാള ഉടമസ്ഥവിഭക്തിയും ഉപയോഗിച്ചു.
- source_word: ἐκλεκτοῖς
  choice: തിരഞ്ഞെടുക്കപ്പെട്ട
  rationale: ദൈവത്താൽ തിരഞ്ഞെടുത്തവർ എന്ന അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; പ്രത്യേക സിദ്ധാന്തവ്യവസ്ഥ നിർബന്ധിക്കുന്ന സാങ്കേതിക പദം ഒഴിവാക്കുന്നു.
- source_word: παρεπιδήμοις
  choice: പരദേശികൾ
  rationale: സ്വന്തം നാടല്ലാത്തിടത്ത് താമസിക്കുന്നവരെന്ന അർഥവും അവിടുത്തെ സ്ഥിരാംഗങ്ങളല്ലെന്ന ഭാവവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: διασπορᾶς
  choice: ചിതറിപ്പാർപ്പ്
  rationale: വിവിധ പ്രദേശങ്ങളിലായി ചിതറിപ്പാർക്കുന്ന സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ യഹൂദ പ്രവാസബന്ധവും വിപുലമായ ദൈവജനസംബന്ധിയായ ധ്വനിയും തുറന്നുവെക്കുന്നു.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: പൊന്തോസ്, ഗലാത്യ, കപ്പദോക്യ, ഏഷ്യ, ബിഥുന്യ എന്നിവിടങ്ങളിൽ
  rationale: പുരാതന പ്രവിശ്യകളുടെയും പ്രദേശങ്ങളുടെയും മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണങ്ങൾ; സ്ഥലബന്ധം വ്യക്തമാക്കാൻ ‘എന്നിവിടങ്ങളിലെ’ എന്നു ചേർത്തു.
theological_decisions:
- issue: ἐκλεκτοῖς എന്നതിന്റെ വിവർത്തനം
  choice: തിരഞ്ഞെടുക്കപ്പെട്ട
  alternative: തിരഞ്ഞെടുക്കപ്പെട്ടവർ / ദൈവത്തിന്റെ തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  rationale: തിരഞ്ഞെടുപ്പിന്റെ ആശയം വ്യക്തമായി നിലനിർത്തുന്നു; എന്നാൽ ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ തുറന്നുപറയാത്ത കർത്താവായ ‘ദൈവത്തിന്റെ’ എന്നത് മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- issue: παρεπιδήμοις διασπορᾶς എന്ന സംയുക്തപ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: ചിതറിപ്പാർപ്പിൽ കഴിയുന്ന തിരഞ്ഞെടുക്കപ്പെട്ട പരദേശികൾ
  alternative: പ്രവാസികളായ ദൈവജനം / യഹൂദ പ്രവാസികൾ
  rationale: ഇത് യഥാർഥ സാമൂഹിക-ഭൗമിക പരദേശിത്വമാണോ, യഹൂദ ചിതറിപ്പാർപ്പാണോ, ദൈവജനത്തിന്റെ ആത്മീയ പരദേശിത്വമാണോ എന്നതിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കാതെ പദപ്രയോഗത്തിന്റെ പലതലത്തിലുള്ള ധ്വനി സംരക്ഷിക്കുന്നു.
- issue: Χριστοῦ എന്ന പദവിനാമം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: അഭിഷിക്തനായ രാജാവ് എന്ന പദവിയുടെ അർഥം പ്രകടമാക്കുന്നു; പ്രചാരമുള്ള ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഔപചാരികവും വായനാസൗഹൃദവുമായ ശൈലി. മൂലവാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന കത്താരംഭമാണെങ്കിലും മലയാളത്തിൽ വിലാസഭാഗം വ്യക്തമായി അവസാനിപ്പിക്കാൻ ദ്വിബിന്ദു ഉപയോഗിച്ചു. ‘ചിതറിപ്പാർപ്പ്’ എന്ന അപൂർവമെങ്കിലും സുതാര്യമായ രൂപം സാങ്കേതികവും രൂപകപരവുമായ ഇരട്ടധ്വനി നിലനിർത്താൻ തെരഞ്ഞെടുത്തു.
