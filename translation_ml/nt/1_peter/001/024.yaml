  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: ml
  text: എന്തെന്നാൽ, സകല ജഡവും[a] പുല്ലുപോലെയാണ്; അതിന്റെ സകല മഹിമയും[b] പുല്ലിന്റെ പൂവുപോലെയാണ്; പുല്ല് ഉണങ്ങിപ്പോയി, പൂവ് കൊഴിഞ്ഞുവീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മനുഷ്യരെല്ലാം.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘സകല ജഡവും’ എന്നാണ്; ഇത് യെശയ്യാവ് 40:6-നെ പ്രതിധ്വനിപ്പിക്കുകയും മനുഷ്യന്റെ മർത്യസ്വഭാവത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അതിന്റെ സകല പ്രതാപവും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിന്റെ തിരുവെഴുത്തുപരമായ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ ഗ്രീക്കിലെ കാരണസൂചകഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πᾶσα σὰρξ
  choice: സകല ജഡവും
  rationale: ഇവിടെ σάρξ ധാർമിക ദുഷ്ടതയെയല്ല, മർത്യരായ മനുഷ്യരുടെ ക്ഷണികതയെയാണ് സൂചിപ്പിക്കുന്നത്. യെശയ്യാവ് 40:6-ലേക്കുള്ള പ്രതിധ്വനിയും ‘ജഡം’ നിലനിർത്തുന്നു.
- source_word: ὡς χόρτος
  choice: പുല്ലുപോലെ
  rationale: മനുഷ്യജീവിതത്തിന്റെ ക്ഷണികത വ്യക്തമാക്കുന്ന ഉപമയെ ലളിതവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: πᾶσα δόξα αὐτῆς
  choice: അതിന്റെ സകല മഹിമയും
  rationale: αὐτῆς എന്നത് കൂട്ടവാചകമായ ‘ജഡം’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്; δόξα സൂചിപ്പിക്കുന്ന മനുഷ്യന്റെ മഹിമയോ പ്രതാപമോ ‘മഹിമ’ എന്ന പദം നിലനിർത്തുന്നു.
- source_word: ὡς ἄνθος χόρτου
  choice: പുല്ലിന്റെ പൂവുപോലെ
  rationale: യെശയ്യാവിൽനിന്നുള്ള ഉദ്ധരണിയിലെ ജനിറ്റീവ് ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐξηράνθη
  choice: ഉണങ്ങിപ്പോയി
  rationale: സസ്യം ഉണങ്ങിപ്പോകുന്നതിനെ സൂചിപ്പിക്കുന്ന അഓറിസ്റ്റ് ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἐξέπεσεν
  choice: കൊഴിഞ്ഞുവീണു
  rationale: പൂവ് ചെടിയിൽനിന്ന് വീഴുന്ന ദൃശ്യത്തെ ‘വീണു’ എന്നതിനെക്കാൾ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യന്റെ മർത്യസ്വഭാവത്തെക്കുറിച്ചുള്ള ഉദ്ധരണിയിൽ σάρξ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സകല ജഡവും
  alternative: മനുഷ്യരെല്ലാം
  rationale: സന്ദർഭം പാപസ്വഭാവത്തെക്കുറിച്ചല്ല, മനുഷ്യജീവിതത്തിന്റെ ദുർബലതയെയും ക്ഷണികതയെയും കുറിച്ചാണ്. ‘ജഡം’ എന്ന രൂപം മൂലപാഠത്തിലെ ഉപമയും യെശയ്യാവ് 40:6-ലേക്കുള്ള അന്തർപാഠബന്ധവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ കാവ്യാത്മകമായ തിരുവെഴുത്ത്-ഉദ്ധരണിയുടെ ഗൗരവം നിലനിർത്തി. മൂലത്തിലെ ഏകവാക്യപ്രവാഹം അർധവിരാമത്തിലൂടെ സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ [b] അടയാളം ‘withered’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് δόξα എന്ന പദത്തിന്റെ പര്യായത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ‘മഹിമ’ എന്നതിനുശേഷം ശരിയായ സ്ഥാനത്ത് ചേർത്തു.
