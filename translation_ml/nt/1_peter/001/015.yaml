- issue: γενήθητε എന്ന ആജ്ഞയുടെ ഭാവം
  choice: വിശുദ്ധരായിരിക്കുക
  alternative: വിശുദ്ധരായിത്തീരുക
  rationale: മലയാളത്തിലെ സ്വാഭാവികമായ ധാർമ്മിക ആഹ്വാനമായി അവതരിപ്പിക്കുമ്പോഴും, വിശുദ്ധീകരണത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തമാതൃക അടിച്ചേൽപ്പിക്കുന്നില്ല; കൂടുതൽ പദാനുസൃതമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
