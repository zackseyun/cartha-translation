  - severity: low
    issue: Name-title order and resurrection phrase are awkward.
    rationale: Changing ‘മശീഹ യേശു’ to ‘യേശു മശീഹ’ and placing ‘മരിച്ചവരിൽനിന്നുള്ള’ directly with ‘പുനരുത്ഥാന’ improves modern Malayalam flow without changing meaning.
  - severity: low
