id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ[a] ദൈവവും പിതാവുമായവൻ വാഴ്ത്തപ്പെട്ടവനായിരിക്കട്ടെ! തന്റെ സമൃദ്ധമായ കരുണയ്ക്ക് ഒത്തവണ്ണം, യേശു മശീഹയുടെ മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനത്തിലൂടെ ജീവനുള്ള പ്രത്യാശയിലേക്കു അവൻ നമ്മെ വീണ്ടും ജനിപ്പിച്ചിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശുക്രിസ്തു.’ Χριστός എന്ന ഗ്രീക്ക് പദത്തിന്റെ പദവിസ്വഭാവം നിലനിർത്താൻ മുഖ്യപാഠത്തിൽ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘അവൻ നമുക്ക് പുതുജനനം നൽകിയിരിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയ ദൈവം നമ്മെ വീണ്ടും ജനനത്തിലേക്കു കൊണ്ടുവരുന്നതിന്റെ ദൃശ്യഭാഷ നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: വാഴ്ത്തപ്പെടുമാറാകട്ടെ
  rationale: ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന സ്തുതിവാക്യത്തിന്റെ ആശംസാത്മകവും ആരാധനാപരവുമായ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: ദൈവവും പിതാവുമായവൻ
  rationale: ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന നിലനിർത്തുകയും മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος ഇവിടെ വിനയസൂചകമായ അഭിസംബോധനയല്ല, അധികാരവും സ്ഥാനവും സൂചിപ്പിക്കുന്ന പദവിയാണ്.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹ യേശു
  rationale: Χριστός എന്നത് അർത്ഥമുള്ള പദവിയായി സംരക്ഷിക്കാൻ ‘മശീഹ’ ഉപയോഗിച്ചു; മലയാളത്തിൽ പദവി പേരിനു മുമ്പിൽ വയ്ക്കുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: തന്റെ സമൃദ്ധമായ കരുണയ്ക്ക് ഒത്തവണ്ണം
  rationale: κατά സൂചിപ്പിക്കുന്ന അളവിനോ മാനദണ്ഡത്തിനോ അനുസൃതമായ പ്രവർത്തനം പ്രകടമാക്കുന്നു; πολὺ എന്നതിന്റെ സമൃദ്ധതയും നിലനിർത്തുന്നു.
- source_word: ἀναγεννήσας
  choice: അവൻ നമ്മെ വീണ്ടും ജനിപ്പിച്ചിരിക്കുന്നു
  rationale: പുതുജനനത്തിന്റെ ദൃശ്യഭാഷയും ദൈവം പ്രവർത്തിക്കുന്ന കർത്താവാണെന്ന വ്യാകരണസൂചനയും വ്യക്തമാക്കുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം മലയാളത്തിലെ പൂർണ്ണകാലരൂപം സൂചിപ്പിക്കുന്നു.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: ജീവനുള്ള പ്രത്യാശയിലേക്കു
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യ/ഫല ദിശയും ζῶσαν എന്ന സജീവ രൂപകവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: δι’ ἀναστάσεως
  choice: പുനരുത്ഥാനത്തിലൂടെ
  rationale: ജനനത്തിന്റെ മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്ന διά + genitive എന്ന ഘടന വ്യക്തമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്നുള്ള
  rationale: പുനരുത്ഥാനഭാഷയിലെ ἐκ എന്നതിന്റെ ഉറവിടസൂചന സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന ക്രിസ്തുശാസ്ത്ര പദവിയുടെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: Χριστός എന്നത് വെറും പേരിന്റെ ഭാഗമെന്നതിലുപരി ‘അഭിഷിക്തൻ’ എന്ന പദവിയാണെന്ന അർത്ഥം നിലനിർത്തുന്നു; ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἀναγεννήσας എന്നതിലെ ദൈവിക പ്രവർത്തകത്വം
  choice: അവൻ നമ്മെ വീണ്ടും ജനിപ്പിച്ചിരിക്കുന്നു
  alternative: അവൻ നമുക്ക് പുതുജനനം നൽകിയിരിക്കുന്നു
  rationale: ഗ്രീക്കിൽ ദൈവമാണ് പ്രവർത്തിക്കുന്ന കർത്താവ്; വിവർത്തനം ഈ പ്രവർത്തകത്വവും ജനനരൂപകവും സംരക്ഷിക്കുന്നു, എന്നാൽ അതിൽനിന്ന് വിപുലമായ ഒരു മതവിഭാഗീയ വ്യവസ്ഥ നിർമിക്കുന്നില്ല.
- issue: εἰς ἐλπίδα ζῶσαν എന്നതിന്റെ ലക്ഷ്യാർഥം
  choice: ജീവനുള്ള പ്രത്യാശയിലേക്കു
  alternative: ജീവനുള്ള പ്രത്യാശയ്ക്കായി
  rationale: പുതുജനനത്തിന്റെ ഫലമോ ലക്ഷ്യമോ എന്ന ഗ്രീക്കിലെ തുറന്ന ബന്ധം നിലനിർത്താൻ ദിശാസൂചകമായ രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ മാന്യവും ആരാധനാപരവുമായ ശൈലി. ‘വാഴ്ത്തപ്പെടുമാറാകട്ടെ’ സ്തുതിവാക്യത്തിന്റെ ഔന്നത്യം നിലനിർത്തുന്നു; ശേഷിക്കുന്ന ഭാഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യക്രമത്തിലാണ്. ‘മശീഹ യേശു’ എന്ന ക്രമം പദവിയെ പേരിൽനിന്ന് തിരിച്ചറിയാവുന്നതാക്കുന്നു.
