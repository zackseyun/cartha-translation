id: 1PE.1.13
reference: 1 Peter 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങളുടെ മനസ്സിന്റെ അരകൾ മുറുക്കിക്കെട്ടി[a], തെളിഞ്ഞ മനസ്സോടെ, മശീഹയായ യേശു[c] വെളിപ്പെടുന്ന വേളയിൽ നിങ്ങൾക്ക് കൊണ്ടുവരപ്പെടുന്ന കൃപയിൽ പൂർണമായി പ്രത്യാശ വെക്കുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നിങ്ങളുടെ മനസ്സിന്റെ അരകൾ മുറുക്കിക്കെട്ടി’; അതായത്, പ്രവർത്തനത്തിനായി മനസ്സിനെ ഒരുക്കി.'
    reason: lexical_alternative
  - marker: b
    text: '‘പൂർണമായി’ എന്ന പദം ‘പ്രത്യാശ വെക്കുക’ എന്നതിനോടോ ‘തെളിഞ്ഞ മനസ്സോടെ’ എന്നതിനോടോ ചേർത്തു മനസ്സിലാക്കാം: ‘പൂർണമായി തെളിഞ്ഞ മനസ്സോടെ ... പ്രത്യാശ വെക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: alternative_reading
  - marker: c
    text: 'ഗ്രീക്ക്: ‘യേശു ക്രിസ്തു’; ഇവിടെ Χριστός ഒരു സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ ആശയങ്ങളിൽനിന്നുള്ള നിഗമനത്തിലേക്കുള്ള മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀναζωσάμενοι
  choice: മുറുക്കിക്കെട്ടി
  rationale: പ്രവർത്തനത്തിനായി നീണ്ട വസ്ത്രത്തിന്റെ അര കെട്ടുന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; വെറും ‘ഒരുങ്ങി’ എന്നു പരാവർത്തനം ചെയ്യുന്നില്ല.
- source_word: τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: നിങ്ങളുടെ മനസ്സിന്റെ അര
  rationale: ഗ്രീക്കിലെ ശക്തമായ ശരീരരൂപകം നിലനിർത്തുന്നു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: νήφοντες
  choice: സുബോധമുള്ളവരായി
  rationale: ഇവിടെ പദം മദ്യവർജനത്തെക്കാൾ മാനസിക ജാഗ്രതയും തെളിമയും സൂചിപ്പിക്കുന്നു; സമീപത്തുള്ള ‘മനസ്സ്’ എന്ന രൂപകവും ഇതിനെ പിന്തുണയ്ക്കുന്നു.
- source_word: τελείως
  choice: പൂർണമായി
  rationale: സമ്പൂർണതയുടെ ഭാവം നൽകുന്നു. പ്രധാനപാഠത്തിൽ ഇത് ‘പ്രത്യാശവെക്കുക’ എന്ന ആജ്ഞയോടു ചേർത്തിരിക്കുന്നു; മറ്റൊരു വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐλπίσατε
  choice: പ്രത്യാശവെക്കുക
  rationale: നിർണായകമായി പ്രത്യാശ ഉറപ്പിക്കുന്ന ആജ്ഞാഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπὶ τὴν φερομένην ὑμῖν χάριν
  choice: നിങ്ങൾക്കു കൊണ്ടുവരപ്പെടുന്ന കൃപയിൽ
  rationale: φερομένην എന്ന വർത്തമാനകാല കർമണി പങ്കാളിരൂപവും ഭാവിയിലെ കൃപയിലേക്കുള്ള സന്ദർഭസൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ἐν ἀποκαλύψει
  choice: വെളിപ്പെടുന്ന വേളയിൽ
  rationale: ഇവിടെ പ്രധാനമായ കാലസംബന്ധിയായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശു
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി കേൾക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ വിധത്തിൽ ‘മശീഹയായ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: മനസ്സിന്റെ അര കെട്ടുക എന്ന രൂപകം നിലനിർത്തണമോ അർഥം മാത്രം പറയണമോ
  choice: പ്രധാനപാഠത്തിൽ രൂപകം നിലനിർത്തി, അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: പ്രവർത്തനത്തിനായി നിങ്ങളുടെ മനസ്സുകളെ ഒരുക്കി
  rationale: മൂലത്തിലെ സജീവവും ദേഹാധിഷ്ഠിതവുമായ ദൃശ്യരൂപം നഷ്ടപ്പെടുത്താതെ സാധാരണ വായനക്കാരന് അതിന്റെ ആശയം മനസ്സിലാക്കാൻ ഇത് സഹായിക്കുന്നു.
- issue: τελείως ഏത് ക്രിയയോടാണ് ചേർന്നു നിൽക്കുന്നത്
  choice: പ്രധാനപാഠത്തിൽ ‘പൂർണമായി പ്രത്യാശവെക്കുക’ എന്നതിനോടു ചേർത്തു.
  alternative: ‘പൂർണമായി സുബോധമുള്ളവരായി’ എന്നതിനോടു ചേർത്തു വായിക്കാം.
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ രണ്ടുവായനകൾക്കും സാധ്യതയുള്ളതിനാൽ പ്രധാനപാഠത്തിൽ ഒന്നിനെ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും മറ്റേതിനെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ അന്ത്യകാല വെളിപ്പാടിന്റെ സന്ദർഭത്തിൽ Χριστός ഒരു സ്ഥാനപ്പേരായി വ്യക്തമായി പ്രവർത്തിക്കുന്നു; അതിനാൽ അതിന്റെ അർഥം മലയാളത്തിൽ കേൾക്കത്തക്കവിധം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ ‘മനസ്സിന്റെ അര’ എന്ന അസാധാരണ രൂപകം ഉദ്ദേശപൂർവം നിലനിർത്തിയെങ്കിലും ‘മുറുക്കിക്കെട്ടി’ എന്ന പ്രയോഗം അതിന്റെ പ്രവർത്തനസജ്ജത വ്യക്തമാക്കുന്നു. ‘സുബോധമുള്ളവരായി’ എന്നത് മദ്യപാനവിരുദ്ധ അർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതെ മാനസിക തെളിമയും ജാഗ്രതയും നൽകുന്നു.
