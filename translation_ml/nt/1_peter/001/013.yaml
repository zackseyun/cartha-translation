revisions:
- from: അതുകൊണ്ട്, നിങ്ങളുടെ മനസ്സിന്റെ അര മുറുക്കിക്കെട്ടി[a], സുബോധമുള്ളവരായി, മശീഹയായ യേശു[c] വെളിപ്പെടുന്ന വേളയിൽ നിങ്ങൾക്കു കൊണ്ടുവരപ്പെടുന്ന കൃപയിൽ പൂർണമായി പ്രത്യാശവെക്കുക[b].
  to: അതുകൊണ്ട്, നിങ്ങളുടെ മനസ്സിന്റെ അരകൾ മുറുക്കിക്കെട്ടി[a], തെളിഞ്ഞ മനസ്സോടെ, മശീഹയായ യേശു[c] വെളിപ്പെടുന്ന വേളയിൽ നിങ്ങൾക്ക് കൊണ്ടുവരപ്പെടുന്ന കൃപയിൽ പൂർണമായി പ്രത്യാശ വെക്കുക[b].
  rationale: The revision improves the contextual rendering of νήφοντες from ‘sound-minded/sensible’ to clear-minded alertness, preserves the Greek plural in the girding image, and makes minor standard-prose orthographic adjustments. It retains the source metaphor, the syntactic ambiguity of τελείως in the footnote, and the titular rendering ‘മശീഹ.’
