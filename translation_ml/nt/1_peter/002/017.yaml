id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: ml
  text: എല്ലാവരെയും ബഹുമാനിക്കുവിൻ; സഹോദരസമൂഹത്തെ[a] സ്നേഹിക്കുവിൻ; ദൈവത്തെ ഭയപ്പെടുവിൻ; രാജാവിനെ[b] ബഹുമാനിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരസമൂഹം’ എന്നത് സഹവിശ്വാസികളുടെ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ചക്രവർത്തിയെ’; ഗ്രീക്കുപദത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം ‘രാജാവ്’ എന്നാണെങ്കിലും, പത്രോസിന്റെ റോമൻ പശ്ചാത്തലത്തിൽ അത് ചക്രവർത്തിയെ സൂചിപ്പിച്ചിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: എല്ലാവരെയും
  rationale: സർവരെയും ഉൾക്കൊള്ളുന്ന substantival ഉപയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പകരുന്നു.
- source_word: τιμήσατε / τιμᾶτε
  choice: ബഹുമാനിക്കുവിൻ
  rationale: ആദ്യത്തെയും അവസാനത്തെയും τιμάω രൂപങ്ങളുടെ ആവർത്തനം ഒരേ മലയാളപദത്തിലൂടെ നിലനിർത്തുന്നു; ‘ആദരിക്കുക’ എന്നതിനെക്കാൾ പൊതുവായ മനുഷ്യരോടും ഭരണാധികാരിയോടും യോജിച്ച പ്രയോഗമാണ്.
- source_word: ἀδελφότητα
  choice: സഹോദരസമൂഹത്തെ
  rationale: വിശ്വാസികളായ സഹോദരങ്ങളുടെ കൂട്ടായ്മ എന്ന കുടുംബപരവും സമൂഹപരവുമായ അർത്ഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘സഹോദരത്വം’ എന്ന അമൂർത്തപദത്തേക്കാൾ ഇവിടെ സമൂഹത്തെ സൂചിപ്പിക്കുന്നത് വ്യക്തമാണ്.
- source_word: ἀγαπᾶτε
  choice: സ്നേഹിക്കുവിൻ
  rationale: ἀγαπάω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള, സാധാരണ മലയാള തുല്യപദം; വർത്തമാന ആജ്ഞയുടെ തുടരുന്ന സ്വഭാവം സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: θεὸν
  choice: ദൈവത്തെ
  rationale: നേരിട്ടുള്ള കർമമായി ലളിതവും സ്ഥിരവുമായ പരിഭാഷ.
- source_word: φοβεῖσθε
  choice: ഭയപ്പെടുവിൻ
  rationale: ക്രിയയുടെ ശക്തി മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു; രാജാവിനോടുള്ള ‘ബഹുമാനം’ എന്നതിൽനിന്ന് ദൈവത്തോടുള്ള പ്രതികരണത്തെ വേർതിരിക്കുന്നു.
- source_word: βασιλέα
  choice: രാജാവിനെ
  rationale: ഗ്രീക്കിലെ βασιλεύς എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുന്നു; റോമൻ പശ്ചാത്തലത്തിൽ ചക്രവർത്തിയാകാം എന്ന ചരിത്രസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവത്തോടും ഭരണാധികാരിയോടും കാണിക്കേണ്ട പ്രതികരണങ്ങളുടെ വ്യത്യാസം
  choice: ദൈവത്തെ ‘ഭയപ്പെടുക,’ രാജാവിനെ ‘ബഹുമാനിക്കുക’
  alternative: ദൈവത്തെ ‘ഭക്തിയോടെ ആദരിക്കുക,’ രാജാവിനെ ‘മാനിക്കുക’
  rationale: φοβέομαι, τιμάω എന്നീ വ്യത്യസ്ത ക്രിയകളുടെ ശക്തിവ്യത്യാസം കാത്തുസൂക്ഷിക്കുകയും ദൈവത്തിനുള്ള പ്രതികരണത്തെ ഭരണാധികാരിക്കുള്ളതുമായി സമമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ἀδελφότης സൂചിപ്പിക്കുന്ന സമൂഹത്തിന്റെ പരിധി
  choice: ‘സഹോദരസമൂഹം’ എന്നു പരിഭാഷപ്പെടുത്തി വിശ്വാസികളുടെ സമൂഹമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക
  alternative: മുഖ്യവാക്യത്തിൽ തന്നെ ‘വിശ്വാസികളുടെ കുടുംബം’ എന്നു വിശദീകരിക്കുക
  rationale: മൂലത്തിലെ കുടുംബരൂപകം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. സമാന്തരമായ നാല് ആജ്ഞകൾക്കും ‘-വിൻ’ രൂപം ഉപയോഗിച്ച് വാക്യത്തിന്റെ താളവും ഔപചാരികതയും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് സമീപം വരണം; പ്രസിദ്ധീകരണരൂപം: ‘എല്ലാവരെയും ബഹുമാനിക്കുവിൻ; സഹോദരസമൂഹത്തെ[a] സ്നേഹിക്കുവിൻ; ദൈവത്തെ ഭയപ്പെടുവിൻ; രാജാവിനെ[b] ബഹുമാനിക്കുവിൻ.’'
