id: 1PE.2.12
reference: 1 Peter 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: ml
  text: ജനതകളുടെ ഇടയിൽ നിങ്ങളുടെ പെരുമാറ്റം മാന്യമായി സൂക്ഷിച്ചുകൊള്ളുക; അങ്ങനെ, അവർ നിങ്ങളെ ദുഷ്‌പ്രവൃത്തിക്കാർ എന്നു അപവാദം പറയുന്ന കാര്യത്തിൽ, നിങ്ങളുടെ നല്ല പ്രവൃത്തികൾ കണ്ട്, സന്ദർശനദിവസത്തിൽ അവർ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തേണ്ടതിന്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സന്ദർശനദിവസം” എന്നത് ദൈവം സന്ദർശിക്കുന്ന ദിവസത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭമനുസരിച്ച് അതിൽ രക്ഷാകരമായ സന്ദർശനത്തിന്റെയും ന്യായവിധിയുടെയും സൂചന ഉണ്ടാകാം.
    reason: ἐπισκοπήയുടെ അടിസ്ഥാനമായ ‘സന്ദർശനം’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭം നിർണയിക്കാത്ത രക്ഷയോ ന്യായവിധിയോ എന്ന വ്യാഖ്യാനപ്രശ്നം തുറന്നുവെക്കുന്നു.
lexical_decisions:
- source_word: ἀναστροφή
  choice: പെരുമാറ്റം
  rationale: ജീവിതരീതിയെയും പൊതുവായ നടത്തത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വിപുലവുമായ മലയാളപദം.
- source_word: ἔθνη
  choice: ജനതകൾ
  rationale: യഹൂദേതര ജനങ്ങളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ ബഹുവചനസ്വഭാവം നിലനിർത്തുന്നു; സഭാപരമായ പ്രത്യേക പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: καλήν / καλῶν
  choice: മാന്യമായ / നല്ല
  rationale: ആദ്യത്തേത് പൊതുസമൂഹത്തിനു മുമ്പിലെ ഉത്തമവും ആദരണീയവുമായ പെരുമാറ്റത്തെയും രണ്ടാമത്തേത് ധാർമികമായി നല്ല പ്രവൃത്തികളെയും സ്വാഭാവികമായി വേർതിരിക്കുന്നു.
- source_word: καταλαλοῦσιν
  choice: ദുഷിക്കുന്നു
  rationale: ഒരാൾക്കെതിരെ അപകീർത്തികരമായി സംസാരിക്കുക എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐποπτεύοντες
  choice: നേരിൽ കണ്ട്
  rationale: ശ്രദ്ധാപൂർവം നിരീക്ഷിക്കുന്നതിന്റെ സാക്ഷ്യഭാവം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐπισκοπή
  choice: സന്ദർശനം
  rationale: ദൈവിക സന്ദർശനം, പരിശോധന, അനുഗ്രഹം, ന്യായവിധി എന്നിവയ്ക്കുള്ള സാധ്യത തുറന്നുവെക്കുന്ന അടിസ്ഥാന അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐν ἡμέρᾳ ἐπισκοπῆς എന്നതിന്റെ സ്വഭാവം
  choice: സന്ദർശനദിവസത്തിൽ
  alternative: പരിശോധനാദിവസത്തിൽ / ദൈവം സന്ദർശിക്കുന്ന ദിവസം
  rationale: സന്ദർഭം ഇത് രക്ഷാകരമായ സന്ദർശനമാണോ ന്യായവിധിയാണോ എന്ന് നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല; അതിനാൽ യഥാർഥ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
- issue: ἐν ᾧ എന്ന ബന്ധപ്രയോഗം
  choice: അവർ നിങ്ങളെ ... ദുഷിക്കുമ്പോൾ
  alternative: ഏതു കാര്യത്തിൽ അവർ നിങ്ങളെ ... ദുഷിക്കുന്നുവോ, അതിൽ
  rationale: ഗ്രീക്കിന്റെ വ്യാകരണപരമായ അസ്പഷ്ടത മലയാളത്തിൽ അക്ഷരാർഥമായി പകർത്തിയാൽ അസ്വാഭാവികമാകും. കാലസാഹചര്യാർഥം പ്രധാനവാചകത്തിൽ നൽകി, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: δοξάσωσι എന്ന ക്രിയയുടെ കർത്താവ്
  choice: അവർ ... ദൈവത്തെ മഹത്ത്വപ്പെടുത്തും
  alternative: അവർ ... മഹത്ത്വപ്പെടുത്തേണ്ടതിന്
  rationale: ἵνα ഉദ്ദേശമോ ഫലമോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ പ്രവചനസദൃശമായ നിർബന്ധിതത്വം വരാതിരിക്കാനായി വാക്യബന്ധം സ്വാഭാവികമാക്കി; ഉദ്ദേശാർഥം 'അങ്ങനെ' എന്നതിലൂടെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനയ്ക്ക് സുഗമവുമായ മലയാളം. ‘ജനതകൾ’ എന്നത് മൂലത്തിലെ ബഹുവചനം നിലനിർത്തുന്നു. അമിതമായ സഭാപരമായ സാങ്കേതികഭാഷയും വിഭാഗീയ വ്യാഖ്യാനവും ഒഴിവാക്കി.
