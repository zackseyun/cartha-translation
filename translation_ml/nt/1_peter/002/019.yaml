id: 1PE.2.19
reference: 1 Peter 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവത്തെക്കുറിച്ചുള്ള ബോധം നിമിത്തം ഒരാൾ അന്യായമായി കഷ്ടം അനുഭവിക്കുമ്പോൾ ദുഃഖങ്ങൾ സഹിക്കുന്നുവെങ്കിൽ, ഇതു കൃപയാണ്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തെ മനസ്സിൽ കരുതുന്നതിനാൽ”; അല്ലെങ്കിൽ, “ദൈവത്തോടുള്ള മനസ്സാക്ഷി നിമിത്തം.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “കൃപ” എന്നതിന് കൃപാപൂർവമായതോ പ്രശംസാർഹമായതോ പ്രീതികരമായതോ ആയ കാര്യം എന്ന അർത്ഥവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: മൂലപദത്തിന്റെ വിശാലമായ പുതിയനിയമ അർത്ഥബന്ധം നിലനിർത്തുന്നു. ഇവിടെ അത് ദൈവസന്നിധിയിൽ പ്രശംസാർഹമോ പ്രീതികരമോ ആയ കാര്യം എന്ന വിലയിരുത്തൽസൂചന വഹിക്കാമെങ്കിലും, ആ വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ നിർബന്ധമായി ചേർത്തിട്ടില്ല.
- source_word: διὰ συνείδησιν θεοῦ
  choice: ദൈവത്തെക്കുറിച്ചുള്ള ബോധം നിമിത്തം
  rationale: συνείδησις എന്ന പദത്തിലെ ‘ബോധം/മനസ്സാക്ഷി’ അർത്ഥസാധ്യതയും θεοῦ എന്നതിലെ ദൈവത്തിലേക്കു തിരിഞ്ഞിരിക്കുന്ന സൂചനയും പരമാവധി തുറന്നുവെക്കുന്നു. കാരണവാക്യം ‘സഹിച്ചുനിൽക്കുക’ എന്ന പ്രവൃത്തിയോടു വ്യക്തമായി ബന്ധിപ്പിക്കുന്ന സ്ഥാനത്താണ് നൽകിയിരിക്കുന്നത്.
- source_word: ὑποφέρει
  choice: സഹിച്ചുനിൽക്കുന്നെങ്കിൽ
  rationale: ദുരിതത്തിന്റെ കീഴിൽ ക്ഷമയോടെ നിലകൊള്ളുക എന്ന സന്ദർഭാർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λύπας
  choice: ദുഃഖങ്ങൾ
  rationale: വൈകാരിക വേദനയും ദുരിതാനുഭവങ്ങളും ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ ബഹുവചന വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: πάσχων ἀδίκως
  choice: അന്യായമായി കഷ്ടം അനുഭവിച്ചുകൊണ്ട്
  rationale: അനീതിയായ കഷ്ടാനുഭവം സഹിച്ചുനിൽക്കുന്നതിന്റെ സാഹചര്യമാണെന്ന പങ്കാളിവാക്യബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: τις
  choice: ഒരാൾ
  rationale: ലിംഗനിരപേക്ഷമായ അനിശ്ചിത ഏകവചനത്തെ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: τοῦτο γὰρ
  choice: എന്തെന്നാൽ ... ഇതാണു
  rationale: γάρ മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധവും τοῦτο തുടർന്ന് വരുന്ന നിബന്ധനാസാഹചര്യത്തെ ചൂണ്ടുന്നതും മലയാള വാക്യക്രമത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: സന്ദർഭത്തിലെ χάρις എന്ന പദത്തിന്റെ അർത്ഥം
  choice: ‘കൃപ’ എന്ന് നിലനിർത്തി.
  alternative: ‘ഇത് പ്രശംസാർഹമാണ്’, ‘ഇത് പ്രീതികരമാണ്’, ‘ഇത് ദൈവപ്രീതി നേടുന്നു’.
  rationale: മൂലവാക്യം ഇവിടെ ‘ദൈവസന്നിധിയിൽ’ എന്നു തുറന്നു പറയുന്നില്ല. ‘കൃപ’ എന്ന പദം നിലനിർത്തുന്നത് ദൈവിക പ്രീതിയുമായുള്ള അർത്ഥബന്ധം സംരക്ഷിക്കുകയും വ്യാഖ്യാനപരമായ അധികവാക്കുകൾ മുഖ്യപാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: συνείδησις θεοῦ എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: ദൈവത്തിലേക്കു തിരിഞ്ഞിരിക്കുന്ന ബോധം എന്ന തുറന്ന അർത്ഥത്തിൽ ‘ദൈവത്തെക്കുറിച്ചുള്ള ബോധം’.
  alternative: ‘ദൈവത്തെ മനസ്സിൽ കരുതുന്നതിനാൽ’; ‘ദൈവത്തോടുള്ള മനസ്സാക്ഷി നിമിത്തം’.
  rationale: പ്രയോഗത്തിൽ ബോധവും മനസ്സാക്ഷിയും ഉൾപ്പെടുന്ന അർത്ഥപിരിമുറുക്കം ഉണ്ട്. മുഖ്യപാഠം ഒന്നിനെ മാത്രം അന്തിമമായി നിർണ്ണയിക്കാതെ നിലനിർത്തുന്നു; സ്വാഭാവികമായ മറ്റു വായനകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളം; സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. കാരണപ്രയോഗം ‘സഹിച്ചുനിൽക്കുക’ എന്നതിനോടാണ് ബന്ധപ്പെടുന്നതെന്ന് വാക്യക്രമം വ്യക്തമാക്കുന്നു.
