id: 1PE.2.7
reference: 1 Peter 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: ml
  text: അതുകൊണ്ട്, വിശ്വസിക്കുന്ന നിങ്ങൾക്കാണ് ഈ ബഹുമാനം[a]. എന്നാൽ വിശ്വസിക്കാത്തവർക്ക്[b], “കെട്ടിടപ്പണിക്കാർ നിരസിച്ച കല്ല്—അതുതന്നെ മൂലയുടെ തലക്കല്ലായിത്തീർന്നു[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വിശ്വസിക്കുന്ന നിങ്ങൾക്ക് ഈ കല്ല് വിലയേറിയതാണ്.’
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അനുസരിക്കാത്തവർക്ക്’; ഈ ക്രിയയ്ക്ക് വിശ്വസിക്കാൻ വിസമ്മതിക്കുകയും അതുവഴി അനുസരണക്കേട് കാണിക്കുകയും ചെയ്യുക എന്ന അർഥഛായയും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: c
    text: പരമ്പരാഗതമായി, ‘മൂലക്കല്ല്’ അല്ലെങ്കിൽ ‘പ്രധാന മൂലക്കല്ല്’.
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: ബഹുമാനം
  rationale: τιμή എന്നതിന് ബഹുമാനം, മൂല്യം, വിലയേറിയതെന്ന ഗുണം എന്നീ അർഥങ്ങൾ വരാം. ὑμῖν ... ἡ τιμή എന്ന സംക്ഷിപ്ത പ്രയോഗവും വിശ്വാസികൾക്കുള്ള ബഹുമാനം എന്ന ആശയവും നിലനിർത്താൻ ‘ബഹുമാനം’ സ്വീകരിച്ചു; കല്ലിന്റെ വിലയേറിയത്വത്തെ സൂചിപ്പിക്കുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: τοῖς πιστεύουσιν
  choice: വിശ്വസിക്കുന്ന നിങ്ങൾക്ക്
  rationale: ദ്വിതീയപുരുഷ അഭിസംബോധനയും വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπιστοῦσιν
  choice: വിശ്വസിക്കാത്തവർക്ക്
  rationale: πιστεύουσιν എന്നതോടുള്ള നേരിട്ടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു. അനുസരിക്കാതിരിക്കുക എന്ന അർഥഛായ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: λίθος
  choice: കല്ല്
  rationale: നിർമാണരൂപകത്തിനും ഉദ്ധരണിയുടെ ഭാഷയ്ക്കും യോജിക്കുന്ന സാധാരണ മലയാള പദം.
- source_word: ἀπεδοκίμασαν
  choice: തള്ളിക്കളഞ്ഞ
  rationale: പരിശോധിച്ചശേഷമുള്ള നിരാകരണത്തിന്റെ ആശയം സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
- source_word: οἰκοδομοῦντες
  choice: പണിക്കാർ
  rationale: കെട്ടിടം പണിയുന്നവരെ സൂചിപ്പിക്കുന്ന substantival participle-ന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: κεφαλὴν γωνίας
  choice: മൂലയുടെ തല
  rationale: ‘മൂലക്കല്ല്’ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് രൂപകത്തെ ചുരുക്കാതെ ഗ്രീക്കിലെ സുതാര്യമായ പദചിത്രം നിലനിർത്തുന്നു; പരമ്പരാഗത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: ἡ τιμή വിശ്വാസികളോടും കല്ലായ ക്രിസ്തുവിനോടും എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നു
  choice: ബഹുമാനം വിശ്വസിക്കുന്നവർക്കാണ് എന്ന് മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: വിശ്വസിക്കുന്നവർക്ക് കല്ലിന്റെ വിലയേറിയത്വം അനുഭവപ്പെടുന്നു, അഥവാ കല്ല് അവർക്കു വിലയേറിയതാണ്.
  rationale: ὑμῖν οὖν ἡ τιμή എന്ന വാക്യഘടന വിശ്വാസികൾക്കുള്ള ബഹുമാനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; മുൻവാക്യത്തിലെ ‘വിലയേറിയ’ കല്ലുമായുള്ള ബന്ധം സാധ്യമാകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: κεφαλὴ γωνίας എന്ന ക്രിസ്തുശാസ്ത്രപരമായ രൂപകം
  choice: ‘മൂലയുടെ തല’ എന്ന സുതാര്യമായ രൂപകം നിലനിർത്തി.
  alternative: മൂലക്കല്ല്; പ്രധാന മൂലക്കല്ല്.
  rationale: ഗ്രീക്ക് വാചകം നിർമാണത്തിലെ കൃത്യസ്ഥാനം പൂർണമായി നിർവചിക്കാതെ രൂപകഭാഷ ഉപയോഗിക്കുന്നു. അതിനാൽ പരിചിതമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉദ്ധരണിയുടെ കവിതാത്മക നിർമാണരൂപകം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
