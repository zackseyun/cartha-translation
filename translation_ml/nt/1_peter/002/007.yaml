  verdict: revise
  source_fidelity: 'പ്രധാന അർഥം ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: വിശ്വസിക്കുന്നവർക്കുള്ള τιμήയും വിശ്വസിക്കാത്തവർക്കു ബാധകമാകുന്ന സങ്കീർത്തന-ഉദ്ധരണിയും യഥാക്രമം നിലനിൽക്കുന്നു. എന്നിരുന്നാലും ἀπεδοκίμασαν-ന് ‘നിരസിച്ച’ കൂടുതൽ കൃത്യമായ സമകാലിക സമാനമാണ്; οἱ οἰκοδομοῦντες-ന് ‘കെട്ടിടപ്പണിക്കാർ’ സന്ദർഭം കൂടുതൽ വ്യക്തമായി നൽകുന്നു.'
  naturalness: ‘മൂലയുടെ തലയായിത്തീർന്നു’ ഗ്രീക്കിനെ അനാവശ്യമായി പദാനുപദം പിന്തുടരുന്നതിനാൽ മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ‘മൂലയുടെ തലക്കല്ലായിത്തീർന്നു’ നിർമാണരൂപകം നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യം മെച്ചപ്പെടുത്തുന്നു. അടിക്കുറിപ്പിലെ ‘വിലയേറിയത്വം’ എന്ന രൂപവും സ്വാഭാവികമല്ല.
