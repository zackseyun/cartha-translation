  to: അതുകൊണ്ട്, വിശ്വസിക്കുന്ന നിങ്ങൾക്കാണ് ഈ ബഹുമാനം[a]. എന്നാൽ വിശ്വസിക്കാത്തവർക്ക്[b], “കെട്ടിടപ്പണിക്കാർ നിരസിച്ച കല്ല്—അതുതന്നെ മൂലയുടെ തലക്കല്ലായിത്തീർന്നു[c].”
