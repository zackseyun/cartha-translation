id: 1PE.2.5
reference: 1 Peter 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: ml
  text: നിങ്ങൾതന്നെയും ജീവനുള്ള കല്ലുകളെപ്പോലെ ഒരു ആത്മീയ ഭവനമായും വിശുദ്ധ പുരോഹിതസമൂഹമായും പണിയപ്പെട്ടുവരുന്നു[b]—യേശു എന്ന മശീഹയിലൂടെ ദൈവത്തിനു സ്വീകാര്യമായ ആത്മീയ യാഗങ്ങൾ അർപ്പിക്കാനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘വിശുദ്ധ പുരോഹിതസമൂഹത്തിനായി’ എന്നോ ‘വിശുദ്ധ പുരോഹിതസമൂഹമാകാൻ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് മുൻപ്രത്യയം ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: നിങ്ങളും
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവവും αὐτοίയുടെ ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; മുൻസന്ദർഭത്തിലെ ജീവനുള്ള കല്ലായ ക്രിസ്തുവിനോടു വായനക്കാരെ ബന്ധിപ്പിക്കുന്നു.
- source_word: ὡς λίθοι ζῶντες
  choice: ജീവനുള്ള കല്ലുകളെപ്പോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമയും ζῶντες എന്നതിന്റെ ‘ജീവനുള്ള’ എന്ന പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: οἰκοδομεῖσθε
  choice: പണിയപ്പെട്ടുകൊണ്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാല നിഷ്ക്രിയരൂപവും തുടരുന്ന പ്രവർത്തനഭാവവും നിലനിർത്തുന്നു; പ്രവർത്തകനെ വാക്യം പറയാത്തതിനാൽ ചേർക്കുന്നില്ല.
- source_word: οἶκος πνευματικὸς
  choice: ആത്മീയഭവനമായി
  rationale: കെട്ടിടരൂപകം നിലനിർത്തിക്കൊണ്ട്, പണിയപ്പെടുന്നതിന്റെ ഫലപൂരകമായി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: വിശുദ്ധ പുരോഹിതസമൂഹത്തിലേക്ക്
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യ/ഫല ദിശാബോധം നിലനിർത്തുന്നു; ἱεράτευμα വ്യക്തിഗത പുരോഹിതന്മാരെയല്ല, ഒരു പുരോഹിതസംഘത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുരോഹിതസമൂഹം’ എന്നു നൽകുന്നു.
- source_word: ἀνενέγκαι πνευματικὰς θυσίας
  choice: ആത്മീയയാഗങ്ങൾ അർപ്പിക്കാനായി
  rationale: യാഗസന്ദർഭത്തിലെ ἀναφέρω എന്നതിന്റെ അർഥം ‘അർപ്പിക്കുക’ എന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും πνευματικός എന്ന വിശേഷണം തുറന്ന നിലയിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: εὐπροσδέκτους θεῷ
  choice: ദൈവത്തിനു സ്വീകാര്യമായ
  rationale: യാഗങ്ങൾ ദൈവം സ്വീകരിക്കുന്നതെന്ന ആശയം വ്യക്തമായി നൽകുന്നു; ‘ദൈവത്തിനു’ ഗ്രീക്കിലെ ദാതൃവിഭക്തിയുടെ ദിശ നിലനിർത്തുന്നു.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥതയെ ‘യിലൂടെ’ എന്നു നൽകുന്നു; Χριστός ഇവിടെ യേശുവിനോടു ചേർന്ന പദവിയായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: οἰκοδομεῖσθε എന്നതിലെ വാച്യവും പ്രവർത്തകനും
  choice: നിഷ്ക്രിയരൂപം നിലനിർത്തി പ്രവർത്തകനെ വ്യക്തമാക്കാതെ ‘പണിയപ്പെട്ടുകൊണ്ടിരിക്കുന്നു’
  alternative: ‘നിങ്ങൾ നിങ്ങളെത്തന്നെ പണിയുക’ എന്ന മധ്യമ/ആത്മവാചക വായന
  rationale: രൂപം നിഷ്ക്രിയമായി മനസ്സിലാക്കാൻ ഏറ്റവും യോജിച്ചതും സന്ദർഭം വിശ്വാസികൾ ഒരു കെട്ടിടമായി പണിയപ്പെടുന്നതിനെ പിന്തുണയ്ക്കുന്നതുമാണ്; എങ്കിലും ദൈവത്തെ പ്രവർത്തകനായി വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: εἰς ἱεράτευμα ἅγιον എന്നതിന്റെ ലക്ഷ്യ/ഫലബന്ധം
  choice: ‘വിശുദ്ധ പുരോഹിതസമൂഹത്തിലേക്ക്’
  alternative: ‘വിശുദ്ധ പുരോഹിതസമൂഹത്തിനായി’ അല്ലെങ്കിൽ ‘വിശുദ്ധ പുരോഹിതസമൂഹമാകാൻ’
  rationale: εἰς സൂചിപ്പിക്കാവുന്ന ലക്ഷ്യവും ഫലവും ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ ദിശാബോധമുള്ള രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- issue: Χριστοῦ എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: Χριστός ഇവിടെ യേശുവിനോടു ചേർന്ന പദവിയായി പ്രവർത്തിക്കുന്നു; അതിന്റെ മശീഹാസംബന്ധിയായ അർഥം സുതാര്യമായി പരിഭാഷപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ആത്മീയഭവനം’, ‘പുരോഹിതസമൂഹം’, ‘ആത്മീയയാഗങ്ങൾ’ എന്നീ പദങ്ങൾ മൂലത്തിലെ കെട്ടിട-യാഗ രൂപകങ്ങൾ നിലനിർത്തുന്നു. പ്രധാനപാഠത്തിലെ ഏക അടിക്കുറിപ്പുചിഹ്നമായ [b] അതിന്റെ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
