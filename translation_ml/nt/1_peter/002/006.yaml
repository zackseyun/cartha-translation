id: 1PE.2.6
reference: 1 Peter 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, തിരുവെഴുത്തിൽ ഇപ്രകാരം രേഖപ്പെടുത്തിയിരിക്കുന്നു: “ഇതാ, തിരഞ്ഞെടുക്കപ്പെട്ടതും ആദരണീയവുമായ[a] ഒരു മൂലക്കല്ല് ഞാൻ സീയോനിൽ സ്ഥാപിക്കുന്നു; അവനിൽ[b] വിശ്വസിക്കുന്നവൻ ഒരിക്കലും ലജ്ജിതനാകുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആദരണീയമായ” എന്നതിന് “അമൂല്യമായ” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദം ബഹുമാനത്തെയും ഉയർന്ന മൂല്യത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: കല്ല് എന്ന രൂപകത്തെ മുൻനിർത്തി “അതിൽ” എന്നും പരിഭാഷപ്പെടുത്താം, കാരണം ഉദ്ധരണിയിൽ പറയുന്നത് ഒരു കല്ലിനെക്കുറിച്ചാണ്. എന്നാൽ ചുറ്റുപാടിൽ പത്രോസ് ഈ കല്ലിന്റെ വചനത്തെ ക്രിസ്തുവിനോടു ബന്ധിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് തിരുവെഴുത്തിൽനിന്നുള്ള ആധാരം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: περιέχει ἐν γραφῇ
  choice: തിരുവെഴുത്തിൽ ഇങ്ങനെ കാണുന്നു
  rationale: ഗ്രീക്കിലെ അസാധാരണമായ ‘തിരുവെഴുത്തിൽ ഉൾക്കൊള്ളുന്നു’ എന്ന പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘തിരുവെഴുത്ത് പറയുന്നു’ എന്നതിനെക്കാൾ രൂപകീയമായ അവ്യക്തത കുറച്ചുകൂടി നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: പ്രവാചകീയ ഉദ്ധരണിയിലെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τίθημι ἐν Σιὼν
  choice: ഞാൻ സീയോനിൽ സ്ഥാപിക്കുന്നു
  rationale: കെട്ടിടരൂപകത്തിൽ കല്ല് ഇടുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ἐν എന്നതിന്റെ സ്ഥാനസൂചനയും നിലനിർത്തുന്നു.
- source_word: λίθον ἀκρογωνιαῖον
  choice: ഒരു മൂലക്കല്ല്
  rationale: കെട്ടിടത്തിന്റെ കോണിൽ നിർണായകമായി സ്ഥാപിക്കുന്ന കല്ലിനെ സൂചിപ്പിക്കുന്ന പരിചിതവും കൃത്യവുമായ പദം.
- source_word: ἐκλεκτὸν
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടത്
  rationale: ദൈവിക തിരഞ്ഞെടുപ്പിന്റെ ആശയം നിലനിർത്തുന്നു; സാങ്കേതിക മതശാസ്ത്രപരമായ പദപ്രയോഗം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἔντιμον
  choice: ആദരണീയം
  rationale: ബഹുമാനിക്കപ്പെട്ടത്/ഉയർന്ന മൂല്യമുള്ളത് എന്നീ അർഥവ്യാപ്തിയിൽ ബഹുമാനത്തിന്റെ വശം മുൻനിർത്തുന്നു; അടുത്ത സന്ദർഭത്തിലെ ‘ബഹുമാനം’ എന്ന വിഷയവുമായി ചേരുന്നു.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: അവനിൽ വിശ്വസിക്കുന്നവൻ
  rationale: ചുറ്റുപാടിലുള്ള ക്രിസ്തുസംബന്ധിയായ പ്രയോഗം അനുസരിച്ച് സർവനാമത്തെ വ്യക്തിപരമായി നൽകുന്നു; വിശ്വാസഭാഷ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: ഒരിക്കലും ലജ്ജിതനാകുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധത്തെ ‘ഒരിക്കലും ... ഇല്ല’ എന്നു ഊന്നിപ്പറയുകയും καταισχύνωയുടെ ലജ്ജ/അപമാനം എന്ന അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യെശയ്യാവിന്റെ കല്ല്-ഉദ്ധരണിയിൽ αὐτῷ എന്നതിന്റെ സൂചിതവസ്തു
  choice: വ്യക്തിപരമായി ‘അവനിൽ’
  alternative: കല്ല് എന്ന രൂപകത്തെ കർശനമായി പിന്തുടർന്ന് ‘അതിൽ’
  rationale: ഉടൻ മുമ്പും ശേഷവും പത്രോസ് കല്ലിന്റെ വചനത്തെ ക്രിസ്തുവിനോടു ബന്ധിപ്പിക്കുന്നു (2:4–8). അതിനാൽ ‘അവനിൽ’ എന്നത് രൂപകത്തെ ഇല്ലാതാക്കാതെ പത്രോസിന്റെ വ്യക്തിപരമായ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- issue: ἀκρογωνιαῖον ἐκλεκτὸν ἔντιμον എന്ന വിശേഷണനിര
  choice: ‘തിരഞ്ഞെടുക്കപ്പെട്ടതും ആദരണീയവുമായ ഒരു മൂലക്കല്ല്’
  alternative: ‘ഒരു മൂലക്കല്ല്—തിരഞ്ഞെടുക്കപ്പെട്ടതും അമൂല്യവുമായത്’
  rationale: മൂന്നു ഘടകങ്ങളും വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണക്രമം ഉപയോഗിക്കുന്നു; ἔντιμον എന്നതിലെ ബഹുമാനവും മൂല്യവും തമ്മിലുള്ള അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ ശൈലി. പ്രവാചകീയ ഉദ്ധരണിയുടെ ഗൗരവത്തിനായി ‘ഇതാ’ നിലനിർത്തി. ‘തിരുവെഴുത്തിൽ ഇങ്ങനെ കാണുന്നു’ എന്നത് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അസാധാരണതയും മലയാളത്തിലെ സ്വാഭാവികതയും തമ്മിൽ തുലനം ചെയ്യുന്നു.
