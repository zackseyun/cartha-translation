id: 1PE.2.20
reference: 1 Peter 2:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: ml
  text: നിങ്ങൾ പാപം ചെയ്യുകയും അടിയേൽക്കുകയും ചെയ്യുമ്പോൾ അങ്ങനെ സഹിച്ചുനിൽക്കുന്നതിൽ എന്തു പ്രശംസയുണ്ട്? എന്നാൽ, നിങ്ങൾ നന്മ ചെയ്യുകയും കഷ്ടം അനുഭവിക്കുകയും ചെയ്യുമ്പോൾ അങ്ങനെ സഹിച്ചുനിൽക്കുന്നുവെങ്കിൽ, ഇതു ദൈവസന്നിധിയിൽ കൃപയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇതു ദൈവത്തിന്റെ പ്രീതി നേടുന്നു’ അല്ലെങ്കിൽ ‘ഇതു ദൈവസന്നിധിയിൽ പ്രശംസനീയമാണ്.’
    reason: χάρις παρὰ θεῷ എന്ന പ്രയോഗത്തിൽ ‘കൃപ’ എന്ന പദത്തിനൊപ്പം സന്ദർഭാനുസൃതമായ ദൈവിക പ്രീതി അല്ലെങ്കിൽ അംഗീകാരം എന്ന അർഥവും സാധ്യമാണ്.
lexical_decisions:
- source_word: κλέος
  choice: പ്രശംസ
  rationale: ഈ ആലങ്കാരിക ചോദ്യത്തിൽ പൊതുവായ കീർത്തിയെയല്ല, ഒരാൾക്ക് ലഭിക്കാവുന്ന പ്രശംസയെയോ അംഗീകാരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രശംസ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἁμαρτάνοντες
  choice: പാപം ചെയ്തുകൊണ്ടിരിക്കെ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവവും പദത്തിന്റെ ധാർമിക-ദൈവശാസ്ത്രപരമായ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: κολαφιζόμενοι
  choice: അടിയേറ്റിട്ട്
  rationale: മുഷ്ടികൊണ്ടുള്ള പ്രഹരമോ ശാരീരിക മർദനമോ സൂചിപ്പിക്കുന്ന പദത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὑπομενεῖτε
  choice: നിങ്ങൾ സഹിച്ചുനിൽക്കുന്നു / സഹിച്ചുനിൽക്കുന്നു എങ്കിൽ
  rationale: കഷ്ടതയിൽ ഉറച്ചുനിൽക്കുക എന്ന ആശയം നൽകുകയും രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള ക്രിയാപദത്തിന്റെ ആവർത്തനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀγαθοποιοῦντες
  choice: നന്മ ചെയ്തുകൊണ്ടിരിക്കെ
  rationale: നല്ലതും ശരിയായതുമായ പ്രവൃത്തി ചെയ്യുക എന്ന നേരിട്ടുള്ള അർഥവും കൃദന്തരൂപത്തിന്റെ തുടരുന്ന ഭാവവും നൽകുന്നു.
- source_word: πάσχοντες
  choice: കഷ്ടം അനുഭവിച്ചിട്ട്
  rationale: അന്യായമായി പെരുമാറപ്പെടുക എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ, മൂലപദത്തിലെ വിശാലമായ കഷ്ടാനുഭവത്തെ നിലനിർത്തുന്നു.
- source_word: χάρις
  choice: കൃപ
  rationale: പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനി നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ദൈവത്തിന്റെ പ്രീതിയോ അംഗീകാരമോ എന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρὰ θεῷ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യത്തിലും വിലയിരുത്തലിലും എന്ന ബന്ധാർഥം സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ χάρις എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ദൈവസന്നിധിയിൽ കൃപയാണ്’ എന്ന് നൽകി.
  alternative: ‘ഇതു ദൈവത്തിന്റെ പ്രീതി നേടുന്നു’ അല്ലെങ്കിൽ ‘ഇതു ദൈവസന്നിധിയിൽ പ്രശംസനീയമാണ്.’
  rationale: χάρις എന്ന പദത്തിന്റെ ‘കൃപ’ എന്ന ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും സന്ദർഭത്തിലെ ദൈവിക അംഗീകാരം എന്ന അർഥവും തമ്മിലുള്ള യഥാർഥമായ അർഥവ്യാപ്തി അതിവേഗം ഒറ്റവായനയായി തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സമാന്തരമായ രണ്ടു ഉപവാക്യങ്ങളിലെ കൃദന്തരൂപങ്ങളും ‘സഹിച്ചുനിൽക്കുക’ എന്ന ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
