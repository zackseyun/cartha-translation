revisions:
- from: പാപം ചെയ്തുകൊണ്ടിരിക്കെ അടിയേറ്റിട്ട് നിങ്ങൾ സഹിച്ചുനിൽക്കുന്നതിൽ എന്തു പ്രശംസയാണുള്ളത്? എന്നാൽ നന്മ ചെയ്തുകൊണ്ടിരിക്കെ കഷ്ടം അനുഭവിച്ചിട്ട് നിങ്ങൾ സഹിച്ചുനിൽക്കുന്നുവെങ്കിൽ, അതു ദൈവസന്നിധിയിൽ കൃപയാണ്.[a]
  to: നിങ്ങൾ പാപം ചെയ്യുകയും അടിയേൽക്കുകയും ചെയ്യുമ്പോൾ അങ്ങനെ സഹിച്ചുനിൽക്കുന്നതിൽ എന്തു പ്രശംസയുണ്ട്? എന്നാൽ, നിങ്ങൾ നന്മ ചെയ്യുകയും കഷ്ടം അനുഭവിക്കുകയും ചെയ്യുമ്പോൾ അങ്ങനെ സഹിച്ചുനിൽക്കുന്നുവെങ്കിൽ, ഇതു ദൈവസന്നിധിയിൽ കൃപയാണ്.[a]
  rationale: The revision replaces awkward, potentially sequential participial phrasing with balanced coordinated clauses that mirror the Greek contrast and repeated call to endurance. It retains the draft’s lexical and theological restraint in the closing phrase, while the footnote continues to signal its contextual sense.
