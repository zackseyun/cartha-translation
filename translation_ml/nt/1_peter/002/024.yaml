id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: ml
  text: നാം പാപങ്ങൾക്കു മരിച്ച് നീതിക്കായി ജീവിക്കേണ്ടതിന്, അവൻതന്നെ നമ്മുടെ പാപങ്ങളെ തന്റെ ശരീരത്തിൽ മരത്തിന്മേൽ[a] വഹിച്ചു. അവന്റെ മുറിവിനാൽ[b] നിങ്ങൾ സൗഖ്യം പ്രാപിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ക്രൂശിന്മേൽ’; ഗ്രീക്കിൽ ‘മരത്തിന്മേൽ’ എന്നാണ്. ഈ പ്രയോഗം ആവർത്തനം 21:23-നെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘അവന്റെ അടിയേറ്റ പാടിനാൽ’ അല്ലെങ്കിൽ ‘അവന്റെ ചതവിനാൽ’; ഏകവചനത്തിലുള്ള ഈ പദം യെശയ്യാവ് 53:5-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ സൗഖ്യം വിശാലമായ അർഥത്തിലാണ് പറഞ്ഞിരിക്കുന്നത്. സന്ദർഭത്തിൽ അത് പാപത്തോടും നീതിയോടും ബന്ധപ്പെട്ടിരിക്കുന്നു; എന്നാൽ ശാരീരികമോ ആത്മീയമോ ആയ സൗഖ്യത്തിൽ ഒന്നിലേക്കു മാത്രം വാക്യത്തിന്റെ അർഥം ചുരുക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: വഹിച്ചു
  rationale: ἀναφέρω എന്ന പദത്തിന് ‘മുകളിലേക്കു കൊണ്ടുപോകുക’, ‘അർപ്പിക്കുക’, ‘വഹിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ‘നമ്മുടെ പാപങ്ങൾ’ കർമമായിരിക്കുന്നതും യെശയ്യാവിന്റെ ഭാഷാപ്രതിധ്വനിയും കണക്കിലെടുത്ത്, സാങ്കേതികമായ യാഗാർഥം അമിതമായി വ്യക്തമാക്കാതെ ‘വഹിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: തന്റെ ശരീരത്തിൽ
  rationale: ക്രിസ്തുവിന്റെ യഥാർഥവും ശാരീരികവുമായ കഷ്ടാനുഭവം നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐπὶ τὸ ξύλον
  choice: മരത്തിന്മേൽ
  rationale: ξύλον എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മരം’ നിലനിർത്തുന്നു; ആവർത്തനം 21:23-ലേക്കുള്ള സാധ്യതയുള്ള സൂചനയും സംരക്ഷിക്കുന്നു. ‘ക്രൂശിൽ’ എന്നത് ഉദ്ദേശ്യം വ്യക്തമാക്കുമെങ്കിലും മൂലപദത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: പാപങ്ങൾക്കു മരിച്ച്
  rationale: ἀπογίνομαι സൂചിപ്പിക്കുന്ന നിർണായകമായ വേർപാടിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ബഹുവചനം അനുസരിച്ച് ‘പാപങ്ങൾ’ നിലനിർത്തി.
- source_word: τῇ δικαιοσύνῃ
  choice: നീതിക്കായി
  rationale: ζάω എന്ന ക്രിയയോടുകൂടിയ ദത്തിവ് നീതിയിലേക്കു തിരിഞ്ഞ ജീവിതത്തെ സൂചിപ്പിക്കുന്നു. ‘നീതിക്കായി ജീവിക്കുക’ സാധാരണ വായനക്കാർക്കു സ്വാഭാവികവും ധാർമിക ദിശ വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: μώλωπι
  choice: മുറിവിനാൽ
  rationale: μώλωψ അടിയാൽ ഉണ്ടായ മുറിവിനെയോ ചതവിനെയോ സൂചിപ്പിക്കുന്നു. ഏകവചനം നിലനിർത്തിക്കൊണ്ട് ആധുനിക വായനക്കാർക്കു വ്യക്തമായ ‘മുറിവ്’ തിരഞ്ഞെടുത്തു.
- source_word: ἰάθητε
  choice: നിങ്ങൾ സൗഖ്യം പ്രാപിച്ചു
  rationale: അയോറിസ്റ്റ് കർമണി രൂപം നിലനിർത്തുന്നു. ശാരീരിക സൗഖ്യത്തിലേക്കോ ആത്മീയ സൗഖ്യത്തിലേക്കോ മാത്രം അർഥം ചുരുക്കാതെ ἰάομαι എന്ന പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: αὐτὸς
  choice: അവൻതന്നെ
  rationale: ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിലെ ‘തന്നെ’ ഉപയോഗിച്ച് വ്യക്തമാക്കി.
theological_decisions:
- issue: അവസാന വാക്യഭാഗത്തിലെ സൗഖ്യത്തിന്റെ വ്യാപ്തി
  choice: ‘നിങ്ങൾ സൗഖ്യം പ്രാപിച്ചു’ എന്ന് മാത്രം പറഞ്ഞ് സൗഖ്യത്തെ ഒരു പ്രത്യേക മേഖലയിലേക്കു ചുരുക്കാതിരിക്കുക.
  alternative: ഇത് ശാരീരിക സൗഖ്യം മാത്രമാണെന്നോ പാപത്തിൽനിന്നുള്ള ആത്മീയ സൗഖ്യം മാത്രമാണെന്നോ വ്യക്തമാക്കുക.
  rationale: സമീപസന്ദർഭം പാപം, നീതി, ക്രിസ്തുവിന്റെ കഷ്ടം എന്നിവയെ കേന്ദ്രീകരിക്കുന്നതിനാൽ പാപത്തിൽനിന്നുള്ള പുനഃസ്ഥാപനം ഉൾപ്പെടുന്നു. എങ്കിലും വാക്യംതന്നെ സൗഖ്യത്തെ അതിലേക്കു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല; യെശയ്യാവ് 53:5-ലെ വിശാലമായ ഭാഷയും നിലനിർത്തണം.
- issue: ξύλον എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പ്രധാനപാഠത്തിൽ ‘മരം’ ഉപയോഗിക്കുക.
  alternative: ‘ക്രൂശ്’ ഉപയോഗിക്കുക.
  rationale: ഇത് യേശുവിന്റെ ക്രൂശീകരണത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്കിൽ σταυρός അല്ല, ξύλον ആണ്. ‘മരം’ എന്നു നൽകുന്നത് മൂലഭാഷയും പഴയനിയമസൂചനയും നിലനിർത്തുന്നു; ‘ക്രൂശ്’ അടിക്കുറിപ്പിൽ അർഥവ്യക്തീകരണമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘അവൻതന്നെ’, ‘വഹിച്ചു’, ‘മരത്തിന്മേൽ’ എന്നീ രൂപങ്ങൾ മൂലത്തിലെ ഊന്നലും തിരുവെഴുത്തുപ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു. ദൈർഘ്യമേറിയ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ‘അങ്ങനെ ചെയ്തത്’ എന്ന ചെറിയ ബന്ധകവാക്യം ഉദ്ദേശ്യബന്ധം വ്യക്തമാക്കുന്നു.
