    issue: The phrase ‘അങ്ങനെ ചെയ്തത്’ is not represented in the Greek.
    rationale: The Greek has a purpose clause, ‘so that … we might live,’ directly dependent on Christ’s bearing of sins. ‘അങ്ങനെ ചെയ്തത്’ adds a separate assertion (‘he did so’) and interrupts that syntactic relationship.
