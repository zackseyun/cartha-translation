id: 1PE.2.14
reference: 1 Peter 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ദുഷ്‌പ്രവൃത്തിക്കാരെ ശിക്ഷിക്കാനും നന്മ ചെയ്യുന്നവരെ പ്രശംസിക്കാനും അദ്ദേഹത്തിലൂടെ അയയ്ക്കപ്പെട്ടവരെന്ന നിലയിൽ ഭരണാധികാരികൾക്ക്[a] കീഴടങ്ങുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അദ്ദേഹത്തിലൂടെ” എന്നത് മുൻവാക്യത്തിൽ പറഞ്ഞ രാജാവിനെയോ ചക്രവർത്തിയെയോ സൂചിപ്പിക്കുന്നു. ചിലർ ഇതിനെ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു; അങ്ങനെ വായിക്കുമ്പോൾ, അധികാരക്രമവുമായി ബന്ധപ്പെട്ട ഒരു വിശാലസൂചനയായി ഇത് ഗ്രഹിക്കപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: εἴτε
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ ‘രാജാവിനോ’ എന്ന ഘടന തുടരുന്ന ബദൽബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἡγεμόσιν
  choice: നാടുവാഴികൾക്ക്
  rationale: ἡγεμών ഇവിടെ രാജാവിന്റെ കീഴിൽ ഭരണാധികാരം നിർവഹിക്കുന്ന ഉദ്യോഗസ്ഥരെ സൂചിപ്പിക്കുന്നു; റോമൻ ഭരണഘടനയെ അനാവശ്യമായി പ്രത്യേകീകരിക്കാതെ അർഥം നൽകുന്നു.
- source_word: ὡς δι’ αὐτοῦ πεμπομένοις
  choice: അദ്ദേഹത്താൽ അയയ്ക്കപ്പെട്ടവരെന്ന നിലയിൽ
  rationale: διά + genitive ഇവിടെ അയയ്ക്കുന്ന വ്യക്തിയുടെ agency സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; αὐτοῦയുടെ സമീപസ്ഥ പൂർവപദമായ മുൻവാക്യത്തിലെ രാജാവിനെയാണ് മുഖ്യവായനയായി സ്വീകരിക്കുന്നത്.
- source_word: εἰς ἐκδίκησιν κακοποιῶν
  choice: ദുഷ്‌പ്രവൃത്തിക്കാരെ ശിക്ഷിക്കാനും
  rationale: ഭരണ-ന്യായസന്ദർഭത്തിൽ ἐκδίκησις പ്രതികാരത്തെക്കാൾ ഔദ്യോഗിക ശിക്ഷാനടപടിയെ സൂചിപ്പിക്കുന്നു; κακοποιῶν വ്യക്തികളെ അവരുടെ ദുഷ്‌പ്രവൃത്തിയാൽ വിശേഷിപ്പിക്കുന്നു.
- source_word: ἔπαινον δὲ ἀγαθοποιῶν
  choice: നന്മ ചെയ്യുന്നവരെ പ്രശംസിക്കാനും
  rationale: ശിക്ഷയും പ്രശംസയും തമ്മിലുള്ള സമാന്തര ഉദ്ദേശ്യഘടന നിലനിർത്തുകയും ἀγαθοποιῶν എന്ന ക്രിയാത്മക ആശയം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: δι’ αὐτοῦയിലെ αὐτοῦ ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുൻവാക്യത്തിലെ രാജാവ്/ചക്രവർത്തി
  alternative: ദൈവം
  rationale: വ്യാകരണപരമായി ഏറ്റവും അടുത്തതും സന്ദർഭത്തിൽ സ്വാഭാവികവുമായ പൂർവപദം മുൻവാക്യത്തിലെ രാജാവാണ്. എന്നിരുന്നാലും, അധികാരത്തെ ദൈവം ക്രമീകരിക്കുന്നതിനെക്കുറിച്ചുള്ള വിശാലമായ സൂചനയായി ചിലർ ഇതിനെ മനസ്സിലാക്കുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ, മലയാളത്തിൽ ആശയം പൂർണമാക്കാൻ ‘കീഴടങ്ങുക’ ആവർത്തിച്ചിരിക്കുന്നു. ‘നാടുവാഴികൾ’ ഭരണപ്രതിനിധികളെ സൂചിപ്പിക്കുന്നതും അതിയായി സാങ്കേതികമല്ലാത്തതുമായ പദമായി തിരഞ്ഞെടുത്തു.
