revisions:
- from: അല്ലെങ്കിൽ, ദുഷ്‌പ്രവൃത്തിക്കാരെ ശിക്ഷിക്കാനും നന്മ ചെയ്യുന്നവരെ പ്രശംസിക്കാനും അദ്ദേഹത്താൽ അയയ്ക്കപ്പെട്ടവരെന്ന നിലയിൽ നാടുവാഴികൾക്ക്[a] കീഴടങ്ങുക.
  to: അല്ലെങ്കിൽ, ദുഷ്‌പ്രവൃത്തിക്കാരെ ശിക്ഷിക്കാനും നന്മ ചെയ്യുന്നവരെ പ്രശംസിക്കാനും അദ്ദേഹത്തിലൂടെ അയയ്ക്കപ്പെട്ടവരെന്ന നിലയിൽ ഭരണാധികാരികൾക്ക്[a] കീഴടങ്ങുക.
  rationale: The revision replaces an archaic and overly specific designation for governors with a modern general term, and it restores the prepositional nuance of δι’ αὐτοῦ. The note preserves the debated referent of αὐτοῦ without deciding it on theological grounds. The imperative is retained because this verse continues the submission command from the preceding verse.
