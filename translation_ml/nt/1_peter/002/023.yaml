id: 1PE.2.23
reference: 1 Peter 2:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: ml
  text: അവൻ അധിക്ഷേപിക്കപ്പെട്ടപ്പോൾ[a] തിരിച്ച് അധിക്ഷേപിച്ചില്ല; കഷ്ടം അനുഭവിച്ചപ്പോൾ ഭീഷണിപ്പെടുത്തിയില്ല; പകരം, നീതിയോടെ വിധിക്കുന്നവന് ഏൽപ്പിച്ചുകൊണ്ടിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്ദിക്കപ്പെട്ടപ്പോൾ അവൻ തിരിച്ച് നിന്ദിച്ചില്ല.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ഏൽപ്പിച്ചതിന്റെ കർമം വ്യക്തമാക്കിയിട്ടില്ല; “തന്നെത്തന്നെ” അല്ലെങ്കിൽ “തന്റെ കാര്യം” ഏൽപ്പിച്ചുകൊണ്ടിരുന്നു എന്നും മനസ്സിലാക്കാം.
    reason: source_ambiguity
lexical_decisions:
- source_word: λοιδορούμενος / ἀντελοιδόρει
  choice: അധിക്ഷേപിക്കപ്പെട്ടപ്പോൾ / തിരിച്ച് അധിക്ഷേപിച്ചില്ല
  rationale: ഇവ വാക്കുകളാലുള്ള അപമാനത്തെയും അതിന് അതേ രീതിയിൽ തിരിച്ചടിക്കാതിരുന്നതിനെയും സൂചിപ്പിക്കുന്നു. ‘അധിക്ഷേപിക്കുക’ എന്നത് ആ വാചികസ്വഭാവവും ἀντί-യുടെ പ്രതികാരാർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πάσχων
  choice: കഷ്ടം സഹിച്ചപ്പോൾ
  rationale: വർത്തമാന കൃദന്തത്തെ മുൻവാക്യത്തോടു സമാന്തരമായ കാലസാഹചര്യമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οὐκ ἠπείλει
  choice: ഭീഷണിപ്പെടുത്തിയില്ല
  rationale: ἀπειλέω ഭീഷണിവാക്കുകൾ ഉച്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ലളിതമായ ഭൂതകാലപ്രയോഗം സന്ദർഭത്തിലെ പതിവായ പ്രതികരണമില്ലായ്മ വ്യക്തമാക്കുന്നു.
- source_word: παρεδίδου
  choice: തന്നെത്തന്നെ ഏൽപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപത്തിന്റെ തുടർച്ചയുള്ള സ്വഭാവം ‘ഏൽപ്പിച്ചുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ സൂചിതമായ കർമം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘തന്നെത്തന്നെ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: τῷ κρίνοντι δικαίως
  choice: നീതിയോടെ വിധിക്കുന്നവനു
  rationale: ഗ്രീക്കിലെ വിവരണാത്മകമായ കൃദന്തരൂപവും δικαίως എന്ന ക്രിയാവിശേഷണവും സംരക്ഷിക്കുന്നു; ‘ദൈവം’ അല്ലെങ്കിൽ ‘പിതാവ്’ എന്ന പദവി മൂലപാഠത്തിലില്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
- source_word: δὲ
  choice: പകരം
  rationale: തിരിച്ചടിക്കാതിരുന്നതും വിധിക്കുന്നവനിൽ ആശ്രയിച്ചതും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ὃς
  choice: അവൻ
  rationale: മുൻവാക്യത്തിലെ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന ബന്ധസർവനാമം മലയാളത്തിലെ വാക്യഘടനയ്ക്കനുസരിച്ച് സർവനാമമായി നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ‘നീതിയോടെ വിധിക്കുന്നവൻ’ ആരെന്നത്
  choice: ഗ്രീക്കിലുള്ളതുപോലെ വിവരണാത്മകമായി മാത്രം അവതരിപ്പിച്ചു
  alternative: ‘നീതിയോടെ വിധിക്കുന്ന ദൈവത്തിനു’ അല്ലെങ്കിൽ ‘പിതാവിനു’ എന്ന് വ്യക്തമാക്കുക
  rationale: സന്ദർഭം ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, മൂലപാഠം വ്യക്തിനാമമോ പദവിയോ നൽകുന്നില്ല. അതിനാൽ ദൈവത്തിലെ വ്യക്തിയെ വിവർത്തനം തന്നെ നിർണ്ണയിക്കുന്നില്ല.
- issue: παρεδίδου എന്ന ക്രിയയുടെ സൂചിത കർമം
  choice: ‘തന്നെത്തന്നെ’ എന്ന് പ്രധാനപാഠത്തിൽ നൽകി
  alternative: ‘തന്റെ കാര്യം’ എന്ന് മനസ്സിലാക്കുക, അല്ലെങ്കിൽ കർമം വ്യക്തമാക്കാതെ വിടുക
  rationale: സഹനത്തിന്റെ സന്ദർഭത്തിൽ സ്വയം ഏൽപ്പിക്കൽ ഏറ്റവും സ്വാഭാവികമായ വായനയാണ്; എങ്കിലും ഗ്രീക്കിൽ കർമം തുറന്നുപറഞ്ഞിട്ടില്ലാത്തതിനാൽ ആ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാചികമായ അധിക്ഷേപം, പ്രതികാരമില്ലായ്മ, തുടർച്ചയായ ഏൽപ്പിക്കൽ എന്നിവ വ്യക്തമായി നിലനിർത്തുന്നു; മൂലപാഠം പറയാത്ത ദൈവിക പദവി ചേർത്തിട്ടില്ല.
