id: 1PE.2.4
reference: 1 Peter 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: ml
  text: മനുഷ്യരാൽ തള്ളിക്കളയപ്പെട്ടെങ്കിലും ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ തിരഞ്ഞെടുക്കപ്പെട്ടതും വിലയേറിയതുമായ ജീവനുള്ള കല്ലായ അവന്റെ അടുക്കലേക്കു നിങ്ങൾ വരുമ്പോൾ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരുടെയടുക്കലേക്കു വരുമ്പോൾ.” ഗ്രീക്കിലെ വർത്തമാനകാല പങ്കാളിത്തരൂപം “വന്നുകൊണ്ടിരിക്കുമ്പോൾ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: Πρὸς ὃν എന്ന ബന്ധസർവനാമഘടനയുടെയും προσερχόμενοι എന്ന വർത്തമാനകാല പങ്കാളിത്തരൂപത്തിന്റെയും സാധ്യമായ രൂപങ്ങൾ വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: Πρὸς ὃν
  choice: അവന്റെ അടുക്കലേക്ക്
  rationale: ദിശ സൂചിപ്പിക്കുന്ന πρός എന്നതും ബന്ധസർവനാമവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; മൂലത്തിലെ സർവനാമം നിലനിർത്തുന്നതിനാൽ ‘യേശു’ എന്ന പേര് ചേർത്തിട്ടില്ല.
- source_word: προσερχόμενοι
  choice: വന്നുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല പങ്കാളിത്തരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തിയും സാഹചര്യാർഥവും വ്യക്തമാക്കുന്നു. ‘സമീപിക്കുമ്പോൾ’ എന്നതിനെക്കാൾ വ്യക്തിയിലേക്കു വരുന്നതിന്റെ ബന്ധപരമായ ഭാവം ‘വന്നുകൊണ്ടിരിക്കുമ്പോൾ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λίθον ζῶντα
  choice: ജീവനുള്ള കല്ല്
  rationale: λίθος എന്ന കെട്ടിടനിർമാണ പ്രതീകം ‘കല്ല്’ എന്നു കൃത്യമായി നിലനിർത്തുകയും ζῶντα സൃഷ്ടിക്കുന്ന ഉദ്ദേശ്യപൂർവമായ വിരോധാഭാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὑπὸ ἀνθρώπων
  choice: മനുഷ്യർ
  rationale: ἄνθρωποι ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യർ’ ലിംഗപരമായി തെറ്റായ പരിമിതി സൃഷ്ടിക്കാതെ മനുഷ്യരുടെ വിലയിരുത്തലും ദൈവത്തിന്റെ വിലയിരുത്തലും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἀποδεδοκιμασμένον
  choice: തള്ളിക്കളഞ്ഞത്
  rationale: പരിശോധിച്ചശേഷം അംഗീകരിക്കാതിരിക്കുക എന്ന പൂർണകാല നിഷ്ക്രിയ പങ്കാളിത്തരൂപത്തിന്റെ ഫലാവസ്ഥയെ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: παρὰ δὲ θεῷ
  choice: ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ
  rationale: ദൈവത്തോടുള്ള ബന്ധത്തിൽ ലഭിക്കുന്ന വിലയിരുത്തലോ സ്ഥാനമോ ഇവിടെ ഉദ്ദേശിക്കുന്നു; ‘ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ’ മനുഷ്യരുടെ നിരാകരണത്തോടുള്ള വൈരുധ്യം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἐκλεκτὸν
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടത്
  rationale: ദൈവം തിരഞ്ഞെടുത്തത് എന്ന അർഥം മതസാങ്കേതിക പദപ്രയോഗമില്ലാതെ നേരിട്ട് നൽകുന്നു.
- source_word: ἔντιμον
  choice: വിലയേറിയത്
  rationale: ഉയർന്ന മൂല്യവും ബഹുമാനവും ഉൾക്കൊള്ളുന്ന പദമാണ്; കല്ലിന്റെ പ്രതീകത്തോടും സ്വാഭാവികമായി ചേരുന്നു.
theological_decisions:
- issue: ‘അവൻ’ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തിയും ജീവനുള്ള കല്ലിന്റെ പ്രതീകവും
  choice: സന്ദർഭത്തിൽ കർത്താവായ യേശുക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠത്തിൽ മൂലത്തിലുള്ള സർവനാമം മാത്രം നിലനിർത്തി.
  alternative: ‘യേശുവിന്റെ അടുക്കലേക്ക്’ എന്ന് പേര് വ്യക്തമാക്കി വിവർത്തനം ചെയ്യുക.
  rationale: 2:3-4-ലെ സമീപസന്ദർഭവും 2:6-8-ലെ കല്ലിനെക്കുറിച്ചുള്ള ഉദ്ധരണികളും സൂചിതവ്യക്തി ക്രിസ്തുവാണെന്ന് വ്യക്തമാക്കുന്നു. എങ്കിലും ഗ്രീക്ക് ഇവിടെ പേര് ചേർക്കാത്തതിനാൽ വിവർത്തനവും അത് ചേർക്കുന്നില്ല.
- issue: παρὰ θεῷ എന്നതിലെ ദൈവിക വിലയിരുത്തൽ
  choice: ‘ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ’ എന്ന് നൽകി, മനുഷ്യരുടെ നിരാകരണവും ദൈവത്തിന്റെ തിരഞ്ഞെടുപ്പും മൂല്യനിർണയവും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തി.
  alternative: ‘ദൈവസന്നിധിയിൽ’ അല്ലെങ്കിൽ ‘ദൈവത്തിങ്കൽ’.
  rationale: παρά + ദത്തിവ് ഇവിടെ ദൈവത്തോടുള്ള ബന്ധത്തിലെ സ്ഥാനമോ വിലയിരുത്തലോ സൂചിപ്പിക്കുന്നു. ‘ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ’ എന്നത് ഈ അർഥം വ്യക്തമായി നൽകുന്നു; ദൈവം കല്ലിനെ തിരഞ്ഞെടുക്കുകയും വിലമതിക്കുകയും ചെയ്യുന്നു എന്ന സംഘർഷം മങ്ങിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം 2:5-ലേക്ക് വ്യാകരണപരമായി ഒഴുകുന്നതുകൊണ്ട് അവസാനത്തിൽ പൂർണവിരാമം ഒഴിവാക്കി. ‘ജീവനുള്ള കല്ല്’ എന്ന കേന്ദ്രപ്രതീകവും മനുഷ്യരുടെ നിരാകരണവും ദൈവത്തിന്റെ തിരഞ്ഞെടുപ്പും തമ്മിലുള്ള വൈരുധ്യവും പരമാവധി നിലനിർത്തി.
