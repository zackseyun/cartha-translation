  terminology: ποιμήν-ന് ‘ഇടയൻ’യും ἐπίσκοπος-ന് ‘മേൽനോട്ടക്കാരൻ’യും യോജിച്ച വിവർത്തനങ്ങളാണ്. ‘ആത്മാക്കൾ’ ഇവിടെ ψυχῶν-ന്റെ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ രൂപമാണ്; അതിനെ ശരീരരഹിതമായ അർഥത്തിലേക്ക് നിർബന്ധമായി ചുരുക്കുന്നില്ല. ‘ബിഷപ്പ്’ എന്നത് പിൽക്കാല പദവിസൂചനയായതിനാൽ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു.
