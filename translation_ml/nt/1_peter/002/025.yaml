id: 1PE.2.25
reference: 1 Peter 2:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: ml
  text: എന്തെന്നാൽ, നിങ്ങൾ വഴിതെറ്റിപ്പോകുന്ന ആടുകളെപ്പോലെ ആയിരുന്നു[a]; എന്നാൽ ഇപ്പോൾ നിങ്ങളുടെ ആത്മാക്കളുടെ ഇടയനും മേൽനോട്ടക്കാരനുമായവന്റെ[c] അടുക്കലേക്ക് മടങ്ങിവന്നിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അലഞ്ഞുതിരിയുന്ന’; ‘വഴിതെറ്റിക്കപ്പെടുന്ന’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തിരിഞ്ഞുവന്നിരിക്കുന്നു’; ഗ്രീക്ക് രൂപം കർമണിഭാവത്തിൽ ‘തിരിച്ചുകൊണ്ടുവരപ്പെട്ടിരിക്കുന്നു’ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: c
    text: ‘മേൽനോട്ടക്കാരൻ’ എന്നതിന് ‘കാവൽക്കാരൻ’ എന്നും വിവർത്തനം ചെയ്യാം; പരമ്പരാഗതമായി, ‘ബിഷപ്പ്’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: നിങ്ങൾ ... ആയിരുന്നു
  rationale: γάρ മുൻവാക്യവുമായി കാരണബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും, മലയാളത്തിൽ വാക്യപ്രവാഹം സ്വാഭാവികമാക്കാൻ പ്രത്യേക ബന്ധപദം ചേർക്കാതെ ബന്ധം നിലനിർത്തുന്നു; ἦτε മുൻകാല അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: ὡς πρόβατα
  choice: ആടുകളെപ്പോലെ
  rationale: ὡς എന്ന ഉപമാസൂചകവും πρόβατα എന്ന ബഹുവചനവും സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് പകർന്നു.
- source_word: πλανώμενοι
  choice: വഴിതെറ്റിപ്പോകുന്ന
  rationale: ഇടയ-ആട് രൂപകത്തിൽ ‘വഴിതെറ്റുക’ സ്വാഭാവികമാണ്; അലഞ്ഞുതിരിയുക, വഴിതെറ്റിക്കപ്പെടുക എന്നീ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: എന്നാൽ ഇപ്പോൾ ... മടങ്ങിവന്നിരിക്കുന്നു
  rationale: ἀλλά ശക്തമായ വൈരുധ്യം നൽകുന്നു. ἐπεστράφητε എന്ന രൂപത്തിന്റെ മധ്യമ/കർമണി അർഥസാധ്യത അമിതമായി നിർണയിക്കാതെ, പൂർത്തിയായ തിരിഞ്ഞുവരവും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τὸν ποιμένα
  choice: ഇടയനായവന്റെ അടുക്കലേക്ക്
  rationale: ποιμήν എന്ന ഇടയരൂപകം നിലനിർത്തുന്നു; ഇവിടെ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന വിശേഷണനാമമാണെന്ന് മലയാള വ്യാകരണത്തിൽ വ്യക്തമായി വരുന്നു.
- source_word: καὶ ἐπίσκοπον
  choice: മേൽനോട്ടക്കാരനായവൻ
  rationale: ἐπίσκοπος എന്നത് ശ്രദ്ധയോടെ മേൽനോട്ടം വഹിക്കുന്നവനെ സൂചിപ്പിക്കുന്നു. പിൽക്കാല സഭാപദവിയുടെ പ്രത്യേക അർഥം നിർബന്ധിക്കാതെ മൂലപദത്തിന്റെ പ്രവർത്തനാർഥം നിലനിർത്തുന്നു.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: നിങ്ങളുടെ പ്രാണന്മാരുടെ
  rationale: ψυχήയുടെ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥം നിലനിർത്തുന്നു; ‘ജീവൻ’ അഥവാ ‘നിങ്ങൾ തന്നേ’ എന്ന വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ἐπίσκοπος ക്രിസ്തുവിനുള്ള വിശേഷണനാമമായി വിവർത്തനം ചെയ്യുന്നത്
  choice: മേൽനോട്ടക്കാരൻ
  alternative: കാവൽക്കാരൻ; ബിഷപ്പ്
  rationale: ക്രിസ്തുവിന്റെ കരുതലോടെയുള്ള മേൽനോട്ടം വ്യക്തമാക്കുകയും, പിൽക്കാല സഭാഭരണരീതിയുടെ പദവി അനാവശ്യമായി വചനത്തിലേക്ക് കൊണ്ടുവരാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ἐπεστράφητε എന്നതിന്റെ കർത്തരി/കർമണി ഭാവസൂക്ഷ്മത
  choice: മടങ്ങിവന്നിരിക്കുന്നു
  alternative: തിരിച്ചുകൊണ്ടുവരപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്ക് കർമണിരൂപം ദൈവിക പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാനാകുമെങ്കിലും, ക്രിയയ്ക്ക് അകർമക/മധ്യമ അർഥവും സാധ്യമാണ്. മുഖ്യവാചകം മനുഷ്യരുടെ തിരിച്ചുവരവ് സ്വാഭാവികമായി പറയുന്നു; കർമണിസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ψυχήയുടെ പരിധി
  choice: പ്രാണൻ
  alternative: ജീവൻ; വ്യക്തി
  rationale: ആത്മീയ പരിപാലനത്തിന്റെ സന്ദർഭത്തിൽ പരമ്പരാഗത അർഥം നിലനിർത്തുന്നു; അതിനെ ശരീരത്തിൽനിന്ന് വേർതിരിച്ച ഒരു ഘടകമായി മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഇടയരൂപകം നിലനിർത്തി; സഭാപരമായ സാങ്കേതിക പദവി ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
