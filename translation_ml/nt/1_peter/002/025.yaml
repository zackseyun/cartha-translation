revisions:
- from: നിങ്ങൾ വഴിതെറ്റിപ്പോകുന്ന ആടുകളെപ്പോലെയായിരുന്നു[a]; എന്നാൽ ഇപ്പോൾ നിങ്ങളുടെ പ്രാണന്മാരുടെ ഇടയനും മേൽനോട്ടക്കാരനുമായവന്റെ അടുക്കലേക്കു മടങ്ങിവന്നിരിക്കുന്നു[b][c].
  to: എന്തെന്നാൽ, നിങ്ങൾ വഴിതെറ്റിപ്പോകുന്ന ആടുകളെപ്പോലെ ആയിരുന്നു[a]; എന്നാൽ ഇപ്പോൾ നിങ്ങളുടെ ആത്മാക്കളുടെ ഇടയനും മേൽനോട്ടക്കാരനുമായവന്റെ[c] അടുക്കലേക്ക് മടങ്ങിവന്നിരിക്കുന്നു[b].
  rationale: γάρ-ന്റെ വ്യക്തമായ കാരണബന്ധത്തിനായി ‘എന്തെന്നാൽ’ ചേർത്തു. ἐπίσκοπος-നുള്ള അടിക്കുറിപ്പ് അതിന്റെ മലയാള പരിഭാഷയോടു നേരിട്ട് ചേർത്തു. ‘ആത്മാക്കൾ’ എന്ന പദം ψυχήയുടെ ഈ സന്ദർഭത്തിലെ സ്വാഭാവികവും പരമ്പരാഗതവുമായ അർഥം നിലനിർത്തുന്നു. മറ്റൊരു അർഥവ്യതിയാനവും വരുത്തിയിട്ടില്ല.
