translation:
  language: ml
  text: അവൻ പാപം ചെയ്തില്ല[b]; അവന്റെ വായിൽ വഞ്ചന[a] കണ്ടെത്തപ്പെട്ടതുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കപടം’ അല്ലെങ്കിൽ ‘ചതി’; ഗ്രീക്ക് പദം വഞ്ചന, കബളിപ്പിക്കൽ, ചതി എന്നീ ആശയങ്ങൾ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്കുകൾ യെശയ്യാവ് 53:9-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: അവൻ
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച ക്രിസ്തുവിനെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വാക്യം സ്വാഭാവികമായി തുടരാൻ ‘അവൻ’ ഉപയോഗിക്കുന്നു; പുതിയൊരു വ്യക്തിയെ ഇതിലൂടെ അവതരിപ്പിക്കുന്നില്ല.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: പാപം ചെയ്തില്ല
  rationale: ποιέω എന്ന ക്രിയയ്ക്ക് അടിസ്ഥാനമായി ‘ചെയ്യുക’ എന്ന അർഥമുണ്ടെങ്കിലും ἁμαρτίαν എന്നതിനോടൊപ്പം ‘പാപം ചെയ്യുക’ എന്നതാണ് കൃത്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: οὐδὲ
  choice: …തുമില്ല
  rationale: രണ്ടാമത്തെ നിഷേധവാക്യത്തെ ആദ്യത്തേതിനോട് ചേർക്കുന്ന ഗ്രീക്ക് സംയോജിത നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εὑρέθη
  choice: കണ്ടെത്തിയതുമില്ല
  rationale: ഗ്രീക്കിലെ ഭൂതകാല കർമണിപ്രയോഗത്തിന്റെ ആശയം നിലനിർത്തുകയും ആരാണ് കണ്ടെത്തിയത് എന്ന് പാഠത്തിൽ ഇല്ലാത്ത കർത്താവിനെ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: δόλος
  choice: വഞ്ചന
  rationale: മനഃപൂർവമായ ചതി, കപടം, വഞ്ചന എന്നീ അർഥവ്യാപ്തി ഉൾക്കൊള്ളുന്ന വ്യക്തവും ആധുനികവുമായ മലയാളപദം.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: അവന്റെ വായിൽ
  rationale: ഗ്രീക്കിലെ ശരീരാവയവരൂപകം നേരിട്ട് നിലനിർത്തുകയും യെശയ്യാവ് 53:9-ലേക്കുള്ള സൂചന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പാപരാഹിത്യവും സത്യസന്ധതയും വിവരിക്കുന്നതിലെ യെശയ്യാവ് 53:9-ന്റെ പ്രതിധ്വനി
  choice: ‘പാപം ചെയ്തില്ല’, ‘വായിൽ വഞ്ചന കണ്ടെത്തിയതുമില്ല’ എന്നിങ്ങനെ മൂലപാഠത്തോട് അടുത്ത ഭാഷ നിലനിർത്തി.
  alternative: ‘അവൻ ഒരിക്കലും പാപം ചെയ്തില്ല; ഒരിക്കലും വഞ്ചനയായി സംസാരിച്ചുമില്ല’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം.
  rationale: മൂലപാഠത്തോട് അടുത്ത രൂപം ക്രിസ്തുവിന്റെ പാപരാഹിത്യത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയും യെശയ്യാവിലെ ദാസഗീതത്തിന്റെ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു; ‘സംസാരിച്ചു’ എന്നും ‘ഒരിക്കലും’ എന്നും പാഠത്തിൽ വ്യക്തമല്ലാത്ത പദങ്ങൾ ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവന്റെ വായിൽ’ എന്ന മൂലപാഠരൂപകം നിലനിർത്തിയിട്ടുണ്ട്; അർഥം വിശദീകരിക്കാൻ അനാവശ്യമായ പദങ്ങൾ ചേർത്തിട്ടില്ല.
