id: 1PE.2.13
reference: 1 Peter 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: ml
  text: കർത്താവിനുവേണ്ടി മനുഷ്യർ സ്ഥാപിച്ചിട്ടുള്ള ഓരോ ഭരണക്രമത്തിനും കീഴടങ്ങുക—മേലധികാരമുള്ളവനായ രാജാവിനോ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: കീഴടങ്ങുക
  rationale: ആജ്ഞയുടെ പ്രബോധനസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഗ്രീക്കിലെ മധ്യ/കർമണി ഭാവത്തിലുള്ള ‘നിങ്ങളെത്തന്നെ വിധേയരാക്കുക’ എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: πάσῃ
  choice: എല്ലാ
  rationale: ഏകവചനത്തിലുള്ള κτίσει-യോടൊപ്പം വിതരണാർഥത്തിൽ ‘ഓരോന്നിനും/എല്ലാ ...ത്തിനും’ എന്ന ആശയം നൽകുന്നു.
- source_word: ἀνθρωπίνῃ κτίσει
  choice: മനുഷ്യരുടെ എല്ലാ ഭരണസ്ഥാപനത്തിനും
  rationale: κτίσις എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘സൃഷ്ടി’ നിലനിർത്താനാകുമെങ്കിലും, പിന്നാലെ രാജാവിനെയും ഭരണാധികാരികളെയും ഉദാഹരിക്കുന്നതിനാൽ ഇവിടെ മനുഷ്യസമൂഹത്തിലെ പൗരഭരണസ്ഥാപനമാണ് ഉദ്ദേശിക്കുന്നത്. ‘മനുഷ്യരുടെ’ എന്നത് അവയുടെ സാമൂഹിക-മാനുഷിക സ്വഭാവം സൂചിപ്പിക്കുന്നു; ദൈവിക അംഗീകാരത്തെക്കുറിച്ച് വാചകം പറയുന്നതിലധികം ചേർക്കുന്നില്ല.
- source_word: διὰ τὸν κύριον
  choice: കർത്താവിനുവേണ്ടി
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണം/പ്രേരണ മലയാളത്തിൽ ലളിതമായി നൽകുന്നു.
- source_word: κύριον
  choice: കർത്താവ്
  rationale: ഗ്രീക്ക് പാഠത്തിലുള്ള പദവി അതേപടി നിലനിർത്തുന്നു; ‘യേശു’ എന്നോ ‘ദൈവം’ എന്നോ വിവർത്തനത്തിൽ വ്യക്തമാക്കി ചേർക്കുന്നില്ല.
- source_word: εἴτε
  choice: ആയാലും
  rationale: അടുത്ത വാക്യത്തിൽ തുടരുന്ന ‘...ആയാലും ...ആയാലും’ എന്ന ഘടനയുടെ ആദ്യ അംഗം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: βασιλεῖ
  choice: രാജാവ്
  rationale: βασιλεύς എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; റോമൻ പശ്ചാത്തലത്തിൽ ‘ചക്രവർത്തി’ സാധ്യമെങ്കിലും ഗ്രീക്ക് പദം കൂടുതൽ വിശാലമാണ്.
- source_word: ὡς ὑπερέχοντι
  choice: മേലധികാരിയായ
  rationale: മറ്റുള്ളവരെക്കാൾ ഉയർന്ന സ്ഥാനമോ അധികാരമോ ഉള്ളവൻ എന്ന പങ്കാളിത്തരൂപത്തിന്റെ പ്രവർത്തനാർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; ‘പരമാധികാരി’ എന്ന അതിനിരപ്പായ ധ്വനി ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ἀνθρωπίνῃ κτίσει എന്നതിലെ പൗരാധികാരത്തിന്റെ സ്വഭാവം
  choice: ‘മനുഷ്യരുടെ ... ഭരണസ്ഥാപനം’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘മാനുഷിക സൃഷ്ടി,’ ‘മനുഷ്യന്റെ ചട്ടം,’ അല്ലെങ്കിൽ ‘ഓരോ മനുഷ്യജീവി’
  rationale: രാജാവിനെയും ഭരണാധികാരികളെയും തുടർന്നു പറയുന്നത് പൗരഭരണക്രമങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു. ഈ തിരഞ്ഞെടുപ്പ് ഓരോ വ്യക്തിക്കും കീഴടങ്ങണമെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുകയും, ഭരണസ്ഥാപനങ്ങളുടെ അന്തിമ ദൈവശാസ്ത്രപരമായ ഉറവിടത്തെ വിവർത്തനം തന്നെ നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: κύριον എന്നതിന്റെ പരാമർശവിഷയം
  choice: ‘കർത്താവ്’ എന്ന പദവി മാത്രമായി നിലനിർത്തി.
  alternative: ‘യേശു’ അല്ലെങ്കിൽ ‘ദൈവം’ എന്നു വ്യക്തമാക്കി നൽകുക
  rationale: ഗ്രീക്ക് പാഠം പരാമർശവിഷയത്തെ ഇവിടെ കൂടുതൽ വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഉള്ള യഥാർഥ വിശാലത നിലനിർത്തുന്നു.
- issue: ὑπερέχοντι സൂചിപ്പിക്കുന്ന അധികാരനില
  choice: ‘മേലധികാരിയായ’ എന്നു നൽകി.
  alternative: ‘പരമാധികാരിയായ’ അല്ലെങ്കിൽ ‘പരമോന്നതനായ’
  rationale: രാജാവിന്റെ ഉയർന്ന ഭരണസ്ഥാനം അംഗീകരിക്കുമ്പോഴും, ദൈവത്തിനു മാത്രമുള്ള സമ്പൂർണ പരമാധികാരം രാജാവിന് ആരോപിക്കുന്നതുപോലുള്ള അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘കീഴടങ്ങുവിൻ’ പോലുള്ള പഴയ ആജ്ഞാരൂപത്തിനു പകരം സ്വാഭാവികമായ ‘കീഴടങ്ങുക’ ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
