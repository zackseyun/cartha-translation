  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: ml
  text: ഒരിക്കൽ ഒരു ജനമല്ലായിരുന്ന നിങ്ങൾ[a], ഇപ്പോൾ ദൈവത്തിന്റെ ജനമാണ്; കരുണ ലഭിക്കാതിരുന്ന നിങ്ങൾ[b], ഇപ്പോൾ കരുണ ലഭിച്ചവരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ പത്രോസ് ഹോശേയ 1:9–10; 2:23 എന്നിവയിലെ ഭാഷ പ്രതിധ്വനിപ്പിക്കുകയും, ഇസ്രായേലിന്റെ പുനഃസ്ഥാപനത്തെക്കുറിച്ചുള്ള ആ ഭാഷ തന്റെ വായനക്കാരുടെ ദൈവജനമെന്ന ഇപ്പോഴത്തെ സ്വത്വത്തിനു പ്രയോഗിക്കുകയും ചെയ്യുന്നു.
