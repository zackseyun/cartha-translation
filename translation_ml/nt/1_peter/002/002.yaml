  terminology: ‘കലർപ്പില്ലാത്ത’ ἄδολον-ന് അനുയോജ്യമാണ്. λογικόν-ന് ‘ആത്മികമായ’ എന്ന മുഖ്യവായന സന്ദർഭോചിതമാണ്; എന്നാൽ ‘യുക്തിസംബന്ധമായ’ എന്ന ബദൽ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കണം. ‘രക്ഷയിലേക്കു’ εἰς-ന്റെ ലക്ഷ്യദിശ നിലനിർത്തുന്നു; അതിനെ ഒരു പ്രത്യേക സിദ്ധാന്തഘടനയായി വിശദീകരിക്കരുത്.
