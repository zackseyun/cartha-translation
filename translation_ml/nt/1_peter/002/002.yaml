id: 1PE.2.2
reference: 1 Peter 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: ml
  text: പുതുതായി ജനിച്ച ശിശുക്കളെപ്പോലെ, കലർപ്പില്ലാത്ത ആത്മികമായ പാൽ[a] അതിയായി ആഗ്രഹിക്കുവിൻ; അതിലൂടെ നിങ്ങൾ രക്ഷയിലേക്കു[b] വളരേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മികമായ പാൽ’ എന്നതിന് ‘യുക്തിസംബന്ധമായ പാൽ’ അല്ലെങ്കിൽ ‘അകത്തെ ജീവിതത്തെ പോഷിപ്പിക്കുന്ന പാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് വിശേഷണം യുക്തിയോടോ ആന്തരികജീവിതത്തോടോ ബന്ധപ്പെട്ടതിനെ സൂചിപ്പിക്കാം; ഇവിടെ യഥാർഥ പാലിനുപകരം ആത്മികപോഷണമാണ് സാധ്യതയേറിയ അർഥം.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘രക്ഷയിലേക്കു’ എന്ന വാക്യഭാഗം ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ὡς ἀρτιγέννητα βρέφη
  choice: പുതുതായി ജനിച്ച ശിശുക്കളെപ്പോലെ
  rationale: ὡς അവതരിപ്പിക്കുന്ന ഉപമയും ἀρτιγέννητα സൂചിപ്പിക്കുന്ന ‘ഇപ്പോൾ ജനിച്ച’ എന്ന ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ λογικὸν
  choice: ആത്മികപാൽ
  rationale: λογικός എന്ന പദത്തിന് ‘യുക്തിസംബന്ധമായത്’, ‘ആന്തരികജീവിതവുമായി ബന്ധപ്പെട്ടത്’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ യഥാർഥ പാലിനുപകരം ഉള്ളിലെ ജീവിതത്തെ പോഷിപ്പിക്കുന്ന പാൽ എന്ന രൂപകമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നതിനാൽ ‘ആത്മിക’ എന്നത് വായനാസൗകര്യമുള്ള തിരഞ്ഞെടുപ്പാണ്; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἄδολον
  choice: കലർപ്പില്ലാത്ത
  rationale: മായമോ വഞ്ചനാപരമായ കലർപ്പോ ഇല്ലാത്ത, ശുദ്ധമായ പാൽ എന്ന ആശയം ‘കലർപ്പില്ലാത്ത’ എന്നത് രൂപകത്തോടൊപ്പം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπιποθήσατε
  choice: അതിയായി ആഗ്രഹിക്കുവിൻ
  rationale: തീവ്രമായ അഭിലാഷം ആവശ്യപ്പെടുന്ന ശക്തമായ ആജ്ഞയെ മാന്യവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ἐν αὐτῷ
  choice: അതിലൂടെ
  rationale: നപുംസക ഏകവചന സർവനാമം പാലിലേക്കാണ് മടങ്ങുന്നത്; വളർച്ചയ്ക്കുള്ള മാർഗം എന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: αὐξηθῆτε εἰς σωτηρίαν
  choice: നിങ്ങൾ രക്ഷയിലേക്കു വളരേണ്ടതിന്
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യദിശ നിലനിർത്തുകയും രക്ഷയെ കേവലം ഇപ്പോഴത്തേതോ ഭാവിയിലേതോ ആയി നിർവചിക്കാതെ അതിന്റെ പൂർണതയിലേക്കുള്ള വളർച്ചയുടെ ആശയം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: λογικός എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ആത്മിക’
  alternative: ‘യുക്തിസംബന്ധമായ’ അല്ലെങ്കിൽ ‘അകത്തെ ജീവിതവുമായി ബന്ധപ്പെട്ട’
  rationale: രൂപകത്തിലെ പാൽ ഭൗതികപാൽ അല്ലെന്ന ആശയം ‘ആത്മിക’ സ്വാഭാവികമായി അറിയിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് പദത്തിലെ യുക്തി/ആന്തരികജീവിതം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു; ‘വചനം’ എന്ന് പരിഭാഷപ്പെടുത്തി ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ഒരു പ്രത്യേക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: εἰς σωτηρίαν എന്നതിലെ രക്ഷയുടെ കാലപരവും ലക്ഷ്യപരവുമായ സ്വഭാവം
  choice: ‘രക്ഷയിലേക്കു’ എന്ന ദിശാസൂചന നിലനിർത്തി
  alternative: ‘രക്ഷയിൽ വളരാൻ’ അല്ലെങ്കിൽ ‘രക്ഷ പ്രാപിക്കേണ്ടതിന്’
  rationale: രക്ഷയുടെ പൂർണസാക്ഷാത്കാരത്തിലേക്കുള്ള ദിശ ഗ്രീക്ക് വാചകം സൂചിപ്പിക്കുന്നു. ഇതിനെ രക്ഷ സമ്പാദിക്കുന്നതായോ ഇതിനകം പൂർണമായി കൈവന്ന അവസ്ഥയിൽ മാത്രം വളരുന്നതായോ സിദ്ധാന്തപരമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം മാന്യമായ വേദപുസ്തകശൈലി സ്വീകരിച്ചു. ‘അതിയായി ആഗ്രഹിക്കുവിൻ’ ശക്തമായ ആജ്ഞ നിലനിർത്തുന്നു; ‘വചനമെന്ന പാൽ’ പോലുള്ള ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്ത വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
