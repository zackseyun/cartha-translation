reference: 1 Peter 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: ml
  text: കൂടാതെ, “ഇടർച്ച വരുത്തുന്ന ഒരു കല്ലും വീഴ്ചയ്ക്കു കാരണമാകുന്ന ഒരു പാറയും.” വചനം അനുസരിക്കാത്തതിനാൽ അവർ ഇടറുന്നു; ഇതിനായും അവർ നിയമിക്കപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇതിനായി” എന്നത് അവരുടെ ഇടറലെയോ, വചനം അനുസരിക്കാത്തതെന്ന മുൻവാക്യത്തിലെ കാര്യത്തെയോ സൂചിപ്പിക്കാം; ഗ്രീക്ക് വാചകത്തിലെ സൂചന സംക്ഷിപ്തമാണ്.
    reason: εἰς ὃ എന്നതിന്റെ സൂചനയും നിയമനത്തിന്റെ പരിധിയും വ്യാഖ്യാനപരമായി തർക്കവിഷയമായതിനാൽ, ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം നിർബന്ധിക്കാതെ വ്യാകരണപരമായ അനിശ്ചിതത്വം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: ഇടർച്ച വരുത്തുന്ന ഒരു കല്ല്
  rationale: പ്രസ്‌കൊമ്മ എന്ന പദത്തിന്റെ ഇടറാൻ ഇടയാക്കുന്ന വസ്തു എന്ന ദൃശ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πέτρα σκανδάλου
  choice: വീഴ്ചയ്ക്കു കാരണമാകുന്ന ഒരു പാറ
  rationale: ‘പാറ’ എന്ന രൂപകം കാത്തുകൊണ്ട്, σκάνδαλον സൂചിപ്പിക്കുന്ന വീഴ്ചയ്ക്കുള്ള കാരണത്തെ വ്യക്തമാക്കുന്നു.
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: വചനം അനുസരിക്കാത്തതിനാൽ
  rationale: ἀπειθέω എന്നത് ഇവിടെ വചനത്തോടുള്ള അനുസരണക്കേടിനെ സൂചിപ്പിക്കുന്നു; കാരണസംബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐτέθησαν
  choice: നിയമിക്കപ്പെടുകയും ചെയ്തു
  rationale: τίθημι എന്ന ക്രിയയുടെ ദൈവിക ക്രമീകരണം/നിയോഗം സൂചിപ്പിക്കാവുന്ന നിഷ്ക്രിയരൂപം നിലനിർത്തുന്നു; പ്രവർത്തകനെ വാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: εἰς ὃ എന്നതിന്റെ സൂചനയും നിയമിക്കപ്പെട്ടതിന്റെ പരിധിയും
  choice: ഇതിനായിത്തന്നെ അവർ നിയമിക്കപ്പെടുകയും ചെയ്തു
  alternative: അതിനും അവർ നിയോഗിക്കപ്പെട്ടിരുന്നു
  rationale: ഗ്രീക്ക് വാചകത്തിലെ ‘ഇതിലേക്ക്/ഇതിനായി’ എന്ന യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തുന്നു. ഇത് ഇടറിവീഴലെയോ മുൻവാക്യത്തിലെ അനുസരണക്കേടോടുകൂടിയ ഫലത്തെയോ സൂചിപ്പിക്കാം; ഒരു പ്രത്യേക മുൻനിർണയ സിദ്ധാന്തമായി വാചകം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഉദ്ധരണിയിലെ കല്ല്/പാറ സമാന്തരരൂപം നിലനിർത്തിയിരിക്കുന്നു; വ്യാഖ്യാനാത്മകമായ വിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
