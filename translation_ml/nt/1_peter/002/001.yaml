source:
  edition: SBLGNT
  text: Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ⸀ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: ml
  text: അതുകൊണ്ട്, എല്ലാ ദുഷ്ടതയും എല്ലാ വഞ്ചനയും കപടഭാവങ്ങളും അസൂയകളും എല്ലാ അപവാദപ്രസംഗങ്ങളും മാറ്റിവെച്ച്[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉപേക്ഷിച്ച്’ അല്ലെങ്കിൽ ‘അഴിച്ചുവെച്ച്.’ ഗ്രീക്ക് പദത്തിന് വസ്ത്രം അഴിച്ചുവയ്ക്കുന്നതുപോലുള്ള രൂപകഭാവവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘എല്ലാ അപവാദപ്രസംഗങ്ങളും’ എന്നത് ‘മറ്റുള്ളവർക്കെതിരായ എല്ലാ ദുഷ്പ്രസംഗങ്ങളും’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പ്രയോഗം മറ്റുള്ളവരെ ദോഷകരമായി സംസാരിക്കുന്നതിനെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: ഉപേക്ഷിച്ച്
  rationale: ഇത് 2-ാം വാക്യത്തിലെ മുഖ്യ ആജ്ഞയ്ക്കു മുന്നോടിയായുള്ള ഭൂതകാല ക്രിയാവിശേഷണരൂപമാണ്. ‘ഉപേക്ഷിച്ച്’ എന്നത് പഴയ വസ്ത്രം അഴിച്ചുവയ്ക്കുന്നതുപോലുള്ള രൂപകവും മുന്നൊരുക്കത്തിന്റെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: 1:22–25-ലെ മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: πᾶσαν κακίαν
  choice: എല്ലാ ദുഷ്ടമനോഭാവവും
  rationale: ഈ ദോഷപ്പട്ടികയിൽ κακία പൊതുവായ തിന്മയെക്കാൾ മറ്റുള്ളവരോടുള്ള ദുഷ്ടമായ മനോഭാവത്തെയോ ദ്രോഹബുദ്ധിയെയോ സൂചിപ്പിക്കുന്നു; ‘ദുഷ്ടമനോഭാവം’ അതിന്റെ നൈതികവും ബന്ധപരവുമായ വ്യാപ്തി നൽകുന്നു.
- source_word: πάντα δόλον
  choice: എല്ലാ വഞ്ചനയും
  rationale: δόλος സൂചിപ്പിക്കുന്ന ചതിയെയും വഞ്ചനാപരമായ പെരുമാറ്റത്തെയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὑποκρίσεις
  choice: കപടതയുടെ എല്ലാ രൂപങ്ങളും
  rationale: ഗ്രീക്കിലെ ബഹുവചനം മലയാളത്തിൽ അസ്വാഭാവികമായ ‘കപടതകൾ’ എന്നു പറയാതെ, ആവർത്തിച്ചോ വ്യത്യസ്തമായോ കാണപ്പെടുന്ന കപടതയുടെ രൂപങ്ങൾ എന്ന നിലയിൽ നിലനിർത്തുന്നു.
- source_word: φθόνους
  choice: അസൂയയുടെ എല്ലാ രൂപങ്ങളും
  rationale: ഗ്രീക്കിലെ ബഹുവചനഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: πάσας καταλαλιάς
  choice: മറ്റുള്ളവർക്കെതിരായ എല്ലാ ദുഷ്പ്രസംഗങ്ങളും
  rationale: καταλαλιά മറ്റുള്ളവർക്കെതിരെ അപകീർത്തികരമായോ ദോഷകരമായോ സംസാരിക്കുന്നതിനെ വിശാലമായി സൂചിപ്പിക്കുന്നു; നിയമപരമായ അർഥത്തിൽ മാത്രം ഒതുങ്ങാവുന്ന ‘അപവാദം’ എന്നതിനേക്കാൾ ഈ പ്രയോഗം മൂലത്തിന്റെ വ്യാപ്തി കാക്കുന്നു.
theological_decisions:
- issue: ദോഷപ്പട്ടികയുടെ നൈതിക വ്യാപ്തി
  choice: ഓരോ ദോഷവും വ്യക്തമായി വിവർത്തനം ചെയ്യുകയും ഉപദേശപരമായ വിശദീകരണം ചേർക്കാതിരിക്കുകയും ചെയ്തു.
  alternative: κακίαയെ ‘എല്ലാ തിന്മയും’ എന്നും καταλαλιάςനെ ‘എല്ലാ അപവാദങ്ങളും’ എന്നും കൂടുതൽ പൊതുവായോ ചുരുങ്ങിയതായോ വിവർത്തനം ചെയ്യുക.
  rationale: വാക്യം നൈതിക പ്രബോധനമാണ്. മൂലത്തിലെ ബന്ധപരവും വാക്കുകളുമായി ബന്ധപ്പെട്ടതുമായ ദോഷങ്ങളെ വ്യക്തമായി നിലനിർത്തുന്നതോടൊപ്പം ഏതെങ്കിലും സഭാപാരമ്പര്യത്തിന്റെ പ്രത്യേക വ്യാഖ്യാനം ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഈ വാക്യം 2-ാം വാക്യത്തിലെ മുഖ്യ ആജ്ഞയിലേക്കു നീളുന്നതിനാൽ അവസാനം വിരാമചിഹ്നമായി കോമ നിലനിർത്തി. ബഹുവചനങ്ങളെ വാക്കുതോറും അസ്വാഭാവികമായി പകർത്താതെ ‘എല്ലാ രൂപങ്ങളും’ എന്ന സ്വാഭാവിക ഘടനയിൽ സംരക്ഷിച്ചു.
