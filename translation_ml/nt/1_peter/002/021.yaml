reference: 1 Peter 2:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: ml
  text: ഇതിനായിട്ടാണ് നിങ്ങൾ വിളിക്കപ്പെട്ടത്; കാരണം, മശീഹായും നിങ്ങൾക്കുവേണ്ടി കഷ്ടം സഹിച്ചു, നിങ്ങൾ അവന്റെ കാൽപ്പാടുകൾ പിന്തുടരേണ്ടതിന് നിങ്ങൾക്കായി ഒരു മാതൃക[a] വിട്ടുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാതൃക’ എന്നതിനുള്ള ഗ്രീക്ക് പദം പഠിതാക്കൾ നോക്കി പകർത്തുന്നതിനായി അവരുടെ മുന്നിൽ വെക്കുന്ന എഴുത്തുമാതൃകയെ സൂചിപ്പിക്കാം; ‘പകർത്തിയെഴുതാനുള്ള മാതൃക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: ഇതിനായിട്ടാണ്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ അന്യായമായ കഷ്ടം സഹിക്കുന്നതിലേക്കു പിന്നോട്ടു ചൂണ്ടുകയും εἰς എന്നതിന്റെ ലക്ഷ്യസൂചന നിലനിർത്തുകയും ചെയ്യുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: ἐκλήθητε
  choice: നിങ്ങൾ വിളിക്കപ്പെട്ടത്
  rationale: ദൈവിക വിളിയുടെ ധ്വനി അനാവശ്യമായി വിശദീകരിക്കാതെ കർത്തരിപ്രയോഗത്തിലെ ദൈവശാസ്ത്രപരമായ അർഥസാധ്യത നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: തുടർന്നുള്ള വാക്യം ഈ വിളിയുടെ അടിസ്ഥാനമോ വിശദീകരണമോ ആണെന്ന കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: Χριστὸς
  choice: മശീഹാ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവൻ എന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ സ്ഥാനപ്പേരായ അർഥം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔπαθεν
  choice: കഷ്ടം സഹിച്ചു
  rationale: സഹനത്തിന്റെ സ്വഭാവമോ മരണത്തെയോ മൂലപാഠം ഇവിടെ പ്രത്യേകം പറയാത്തതിനാൽ കൂടുതൽ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: വായനക്കാർക്കായുള്ള പ്രയോജനപരവും പ്രതിനിധിപരവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; പകരക്കാരനായി എന്ന ഒരു സിദ്ധാന്തപരമായ അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: അവൻ നിങ്ങൾക്കായി … അവശേഷിപ്പിച്ചു
  rationale: കൃന്തത്തിന്റെ കർത്താവ് മശീഹായാണെന്നും മാതൃക വായനക്കാർക്കായി വിട്ടുതന്നതാണെന്നും സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑπογραμμὸν
  choice: ഒരു മാതൃക
  rationale: പഠിതാക്കൾ പകർത്തുന്നതിനായി മുന്നിൽ വെക്കുന്ന എഴുത്തുമാതൃക എന്ന ദൃശ്യരൂപം ഉൾക്കൊള്ളുന്ന പദമാണിത്; പൊതുവായ അർഥം മുഖ്യപാഠത്തിലും പ്രത്യേക സൂക്ഷ്മത അടിക്കുറിപ്പിലും നൽകുന്നു.
- source_word: ἵνα
  choice: …േണ്ടതിന്
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵναയുടെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπακολουθήσητε
  choice: പിന്തുടരേണ്ടതിന്
  rationale: ലക്ഷ്യമാക്കിയ പ്രതികരണത്തെ വ്യക്തമാക്കുന്നു; ക്രിയയിലെ പിന്തുടരുക എന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: അവന്റെ കാൽപ്പാടുകൾ
  rationale: മറ്റൊരാൾ നടന്ന വഴിയിലൂടെ പോകുന്നതെന്ന മൂലരൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: മശീഹായുടെ കഷ്ടാനുഭവത്തോടുള്ള ബന്ധത്തിൽ ὑπὲρ ὑμῶν എന്നതിന്റെ ശക്തി
  choice: പ്രയോജനപരവും പ്രതിനിധിപരവുമായ വിശാലത നിലനിർത്തി ‘നിങ്ങൾക്കുവേണ്ടി’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘നിങ്ങളുടെ സ്ഥാനത്ത്’ അല്ലെങ്കിൽ ‘നിങ്ങൾക്കായി’
  rationale: ഈ വാക്യം മശീഹാ വായനക്കാർക്കുവേണ്ടി കഷ്ടം സഹിച്ചുവെന്ന് വ്യക്തമാക്കുന്നു; സമീപസന്ദർഭം അവന്റെ കഷ്ടാനുഭവത്തെ അവർ പിന്തുടരേണ്ട മാതൃകയായും അവതരിപ്പിക്കുന്നു. ‘നിങ്ങൾക്കുവേണ്ടി’ എന്നത് പകരബലിയുടെ സാധ്യതയുള്ള ധ്വനി ഇല്ലാതാക്കാതെയും അതിനെ ഈ വാക്യത്തിൽ മാത്രം നിർബന്ധിതമായ അർഥമാക്കാതെയും ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. നീണ്ട ഗ്രീക്ക് വാക്യത്തെ വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; എന്നാൽ കാരണം, ഉദ്ദേശ്യം, മാതൃക, കാൽപ്പാടുകൾ എന്നീ ബന്ധങ്ങളും രൂപകങ്ങളും നിലനിർത്തി.
