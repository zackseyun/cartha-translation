id: 1PE.2.9
reference: 1 Peter 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ തിരഞ്ഞെടുക്കപ്പെട്ട ജനം[a], രാജകീയ പുരോഹിതസമൂഹം, വിശുദ്ധ ജനത, അവന്റെ സ്വന്തം ജനം ആകുന്നു; നിങ്ങളെ ഇരുട്ടിൽനിന്ന് തന്റെ അത്ഭുതകരമായ വെളിച്ചത്തിലേക്കു വിളിച്ചവന്റെ ശ്രേഷ്ഠതകൾ[b] നിങ്ങൾ പ്രഖ്യാപിക്കേണ്ടതിനാണ് ഇത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തിരഞ്ഞെടുക്കപ്പെട്ട വംശം.” ഗ്രീക്ക് പദത്തിന് വംശം, ജനസമൂഹം, ജനത എന്നീ അർഥങ്ങൾ വരാം. ആധുനിക വംശീയവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാനും സമൂഹപരമായ അർഥം നിലനിർത്താനും ഇവിടെ “ജനം” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സ്തുതികൾ” അല്ലെങ്കിൽ “മഹാപ്രവൃത്തികൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: എന്നാൽ നിങ്ങൾ
  rationale: δὲ മുൻവാക്യത്തിലെ അവിശ്വാസികളോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; വ്യക്തമായി നൽകിയിരിക്കുന്ന Ὑμεῖς നേരിട്ടുള്ള ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: γένος ἐκλεκτόν
  choice: തിരഞ്ഞെടുക്കപ്പെട്ട ജനം
  rationale: γένος എന്നതിന് വംശം, ജനസമൂഹം, ജനത എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. “ജനം” സമൂഹപരമായ തിരഞ്ഞെടുപ്പിന്റെ അർഥം നിലനിർത്തുകയും ആധുനിക വംശീയ ധാരണകളിലേക്കുള്ള തെറ്റിദ്ധാരണ കുറയ്ക്കുകയും ചെയ്യുന്നു; “വംശം” അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
- source_word: βασίλειον ἱεράτευμα
  choice: രാജകീയ പുരോഹിതസമൂഹം
  rationale: ἱεράτευμα ഒറ്റ പുരോഹിതനെയല്ല, കൂട്ടായ പുരോഹിതത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്. “രാജകീയ” എന്നത് βασίλειον-ന്റെ രാജത്വബന്ധം നിലനിർത്തുന്നു.
- source_word: ἔθνος ἅγιον
  choice: വിശുദ്ധ ജനത
  rationale: ἅγιον എന്നതിലെ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടതെന്ന ഉടമ്പടിപരമായ ആശയം “വിശുദ്ധ” നിലനിർത്തുന്നു; ἔθνος-ന്റെ കൂട്ടായ സ്വഭാവം “ജനത” വ്യക്തമാക്കുന്നു.
- source_word: λαὸς εἰς περιποίησιν
  choice: അവന്റെ സ്വന്തമായ ജനം
  rationale: περιποίησις പ്രത്യേക ഉടമസ്ഥതയെയും സ്വന്തമാക്കലിനെയും സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ഉടമ ദൈവമാണെന്നത് വ്യക്തമായതിനാൽ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി “അവന്റെ” എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: ὅπως
  choice: പ്രഖ്യാപിക്കേണ്ടതിനാണ്
  rationale: ὅπως ഉദ്ദേശ്യം അവതരിപ്പിക്കുന്നു. അവസാനത്തെ ഈ പ്രയോഗം ആ ഉദ്ദേശ്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰς ἀρετὰς
  choice: മഹിമകൾ
  rationale: ἀρετή ഇവിടെ ദൈവത്തിന്റെ സ്തുത്യമായ ശ്രേഷ്ഠതകളെയും അവ പ്രകടമാകുന്ന പ്രവൃത്തികളെയും ഉൾക്കൊള്ളാൻ കഴിയും. സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിശാലമായ പദമായി “മഹിമകൾ” ഉപയോഗിച്ചു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἐξαγγείλητε
  choice: നിങ്ങൾ പ്രഖ്യാപിക്കേണ്ടതിന്
  rationale: ἐξαγγέλλω പരസ്യമായി അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. “പ്രഖ്യാപിക്കുക” അതിന്റെ പൊതുവായ സാക്ഷ്യസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: τοῦ ... καλέσαντος
  choice: വിളിച്ചവന്റെ
  rationale: ജനിറ്റീവ് കൃദന്തരൂപം ദൈവത്തെ അവന്റെ വിളിക്കുന്ന പ്രവൃത്തിയാൽ തിരിച്ചറിയിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത “ദൈവം” എന്ന നാമം മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ വ്യക്തിപരമായ സൂചന നിലനിർത്തുന്നു.
- source_word: ἐκ σκότους
  choice: ഇരുട്ടിൽനിന്ന്
  rationale: ἐκ ഒരു അവസ്ഥയുടെയോ മേഖലയുടെയോ ഉള്ളിൽനിന്നുള്ള പുറത്തുവരവ് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ “ഇരുട്ടിൽനിന്ന്” ഈ രൂപകം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: തന്റെ വിസ്മയകരമായ വെളിച്ചത്തിലേക്ക്
  rationale: εἰς ലക്ഷ്യത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; θαυμαστός എന്നതിലെ അതിശയകരവും പ്രശംസാർഹവുമായ ഭാവം “വിസ്മയകരമായ” നിലനിർത്തുന്നു. “തന്റെ” വിളിച്ചവനിലേക്കുള്ള αὐτοῦ-യുടെ മടക്കസൂചന വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ ഉടമ്പടിപദവികളിൽനിന്നെടുത്ത കൂട്ടായ തിരിച്ചറിയൽഭാഷ
  choice: “തിരഞ്ഞെടുക്കപ്പെട്ട ജനം,” “രാജകീയ പുരോഹിതസമൂഹം,” “വിശുദ്ധ ജനത” എന്നീ പദവികൾ നേരിട്ട് നിലനിർത്തി.
  alternative: പകരംവെക്കൽസിദ്ധാന്തത്തെക്കുറിച്ചുള്ള നിഗമനം ഒഴിവാക്കാൻ ഇവയെ കൂടുതൽ രൂപകാത്മകമോ അമൂർത്തമോ ആയി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ വാക്യം പഴയനിയമത്തിലെ ഉടമ്പടിഭാഷ പത്രോസിന്റെ വായനക്കാരിൽ ഉദ്ദേശപൂർവം പ്രയോഗിക്കുന്നു. പരിഭാഷ ആ വാചകശക്തി നിലനിർത്തണം; എന്നാൽ അതിൽനിന്ന് ഒരു സമ്പൂർണ ദൈവശാസ്ത്രവ്യവസ്ഥ നിർബന്ധിച്ച് ചേർക്കരുത്.
- issue: λαὸς εἰς περιποίησιν എന്നതിലെ സൂചിത ഉടമ
  choice: സന്ദർഭത്തിലെ ദൈവിക ഉടമയെ “അവന്റെ” എന്നു വ്യക്തമാക്കി.
  alternative: “സ്വന്തമാക്കാനുള്ള ജനം” എന്നപോലെ ഉടമയെ വ്യക്തമാക്കാതെ വിടുക.
  rationale: ഗ്രീക്കിൽ ഈ പദബന്ധത്തിനുള്ളിൽ αὐτοῦ ഇല്ലെങ്കിലും, സന്ദർഭം ഉടമ ദൈവമാണെന്ന് വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ വ്യക്തതയ്ക്കാവശ്യമായ ഈ വെളിപ്പെടുത്തൽ പുതിയ ഉപദേശവാദം ചേർക്കുന്നില്ല.
- issue: τὰς ἀρετὰς ദൈവത്തിന്റെ ഗുണങ്ങളെയോ പ്രവൃത്തികളെയോ സൂചിപ്പിക്കുന്നതാണോ
  choice: മുഖ്യപാഠത്തിൽ ഇരുവശവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന “മഹിമകൾ” ഉപയോഗിച്ചു.
  alternative: “സ്തുതികൾ” എന്നു പറഞ്ഞ് പ്രതികരണത്തിലേക്ക്, അല്ലെങ്കിൽ “മഹാപ്രവൃത്തികൾ” എന്നു പറഞ്ഞ് പ്രവർത്തികളിലേക്ക് മാത്രം അർഥം ചുരുക്കുക.
  rationale: ἀρεταί സ്തുത്യമായ ഗുണങ്ങളെയും അവയുടെ പ്രകടനങ്ങളെയും സൂചിപ്പിക്കാൻ കഴിയും. പാഠത്തിലെ യഥാർഥ അർഥവ്യാപ്തി നിലനിർത്തി, പ്രത്യേക സാധ്യതകൾ അടിക്കുറിപ്പിൽ കൊടുത്തിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. പഴയനിയമാനുരണനമുള്ള കൂട്ടായ പദവികൾ ലളിതമാക്കാതെ നിലനിർത്തിയെങ്കിലും “പുരോഹിതസമൂഹം” പോലുള്ള രൂപങ്ങൾ സാധാരണ വായനക്കാർക്ക് കൂട്ടായ അർഥം വ്യക്തമാക്കുന്നു. ഗ്രീക്ക് വാക്യത്തിലെ ദീർഘമായ നാമനിരയും ഉദ്ദേശ്യവാക്യവും വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; രണ്ടാം വാക്യത്തിലെ “ഇങ്ങനെ ആയിരിക്കുന്നത്” മുൻപറഞ്ഞ എല്ലാ പദവികളെയും ഉദ്ദേശ്യവുമായി ബന്ധിപ്പിക്കുന്നു.
