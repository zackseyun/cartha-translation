- from: 'എന്നാൽ നിങ്ങൾ തിരഞ്ഞെടുക്കപ്പെട്ട ജനം[a], രാജകീയ പുരോഹിതസമൂഹം, വിശുദ്ധ ജനത, അവന്റെ സ്വന്തമായ ജനം ആകുന്നു. നിങ്ങളെ ഇരുട്ടിൽനിന്ന് തന്റെ വിസ്മയകരമായ വെളിച്ചത്തിലേക്ക് വിളിച്ചവന്റെ മഹിമകൾ[b] നിങ്ങൾ പ്രഖ്യാപിക്കേണ്ടതിനാണ് ഇങ്ങനെ ആയിരിക്കുന്നത്.


    [a] അഥവാ, “തിരഞ്ഞെടുക്കപ്പെട്ട വംശം.” ഗ്രീക്ക് പദത്തിന് വംശം, ജനസമൂഹം, ജനത എന്നീ അർഥങ്ങൾ വരാം. ആധുനിക വംശീയവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാനും സമൂഹപരമായ അർഥം നിലനിർത്താനും ഇവിടെ “ജനം” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.


    [b] അഥവാ, “സ്തുത്യമായ ശ്രേഷ്ഠതകൾ,” “സ്തുതികൾ,” അല്ലെങ്കിൽ “മഹാപ്രവൃത്തികൾ.”'
  to: എന്നാൽ നിങ്ങൾ തിരഞ്ഞെടുക്കപ്പെട്ട ജനം[a], രാജകീയ പുരോഹിതസമൂഹം, വിശുദ്ധ ജനത, അവന്റെ സ്വന്തം ജനം ആകുന്നു; നിങ്ങളെ ഇരുട്ടിൽനിന്ന് തന്റെ അത്ഭുതകരമായ വെളിച്ചത്തിലേക്കു വിളിച്ചവന്റെ ശ്രേഷ്ഠതകൾ[b] നിങ്ങൾ പ്രഖ്യാപിക്കേണ്ടതിനാണ് ഇത്.
  rationale: The revision removes the non-source-based and awkward “ഇങ്ങനെ ആയിരിക്കുന്നത്,” restores a direct purpose construction, and replaces “മഹിമകൾ” with “ശ്രേഷ്ഠതകൾ” to represent the semantic range of ἀρετάς more accurately. The collective covenant terminology and the contextual explicitation of the divine possessor are retained. Footnote b is anchored to “ശ്രേഷ്ഠതകൾ,” the term it explains.
