  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: ml
  text: 'കാരണം, ദൈവഹിതം ഇതാണ്: നന്മ ചെയ്യുന്നതിലൂടെ മൂഢരായ ആളുകളുടെ അജ്ഞതയെ നിങ്ങൾ നിശ്ശബ്ദമാക്കണം[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൂഢരായ ആളുകളുടെ അജ്ഞതയ്ക്കു കടിഞ്ഞാണിടണം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയുടെ അക്ഷരാർഥം “കടിഞ്ഞാണിടുക” എന്നാണ്; ശത്രുതാപരമായ സംസാരം തടയുക എന്ന അർഥത്തിൽ ഇവിടെ അത് രൂപകമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം എന്ന ബന്ധം സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നതിനായി വാക്യത്തെ മുൻവാക്യത്തോടു ബന്ധിപ്പിക്കുന്ന രൂപം
  rationale: ὅτι മുൻപുള്ള പ്രബോധനത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നു; എന്നാൽ ഒറ്റവാക്യമായി സ്വാഭാവിക മലയാളത്തിൽ തുടക്കത്തിലെ ‘കാരണം’ ഒഴിവാക്കിയാലും കാരണബന്ധം സന്ദർഭത്തിൽ നിലനിൽക്കും.
- source_word: οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഇഷ്ടം ഇതാണ്
  rationale: οὕτως സൂചിപ്പിക്കുന്ന രീതിയും θέλημα സൂചിപ്പിക്കുന്ന ദൈവഹിതവും സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἀγαθοποιοῦντας
  choice: നന്മ ചെയ്യുന്നതിലൂടെ
  rationale: പ്രധാനക്രിയയുടെ മാർഗമോ രീതിയോ വ്യക്തമാക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ instrumental force നിലനിർത്തുന്നു.
- source_word: φιμοῦν
  choice: നിശ്ശബ്ദമാക്കണം
  rationale: അക്ഷരാർഥത്തിൽ ‘വായ്ക്കു കടിഞ്ഞാണിടുക/മുഖബന്ധനം ഇടുക’ എന്ന ആശയം ഉണ്ടായാലും ഇവിടെ എതിർവാക്കിനെ തടയുക എന്ന രൂപകാലങ്കാരപരമായ അർഥമാണ്.
- source_word: ἀγνωσίαν
  choice: അജ്ഞതയെ
  rationale: അറിവില്ലായ്മ എന്ന നേരിട്ടുള്ള അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀφρόνων ἀνθρώπων
  choice: വിവേകമില്ലാത്ത മനുഷ്യരുടെ
  rationale: ἄφρων എന്നതിലെ മൂഢത/വിവേകരാഹിത്യം അറിയിക്കുകയും ἄνθρωποι പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നതും നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἀνθρώπων എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: മനുഷ്യരുടെ
  alternative: പുരുഷന്മാരുടെ
  rationale: ഗ്രീക്ക് വ്യാകരണരൂപം പുല്ലിംഗമാണെങ്കിലും ഇവിടെ പരാമർശം പുരുഷന്മാർക്കു മാത്രമല്ല, പൊതുവായ മനുഷ്യ എതിരാളികൾക്കാണ്.
- issue: φιμόω എന്ന രൂപകാലങ്കാരത്തിന്റെ അവതരണം
  choice: നിശ്ശബ്ദമാക്കണം
  alternative: വായടപ്പിക്കണം
  rationale: ശത്രുതാപരമായ ആരോപണങ്ങളെ നന്മയിലൂടെ തടയുക എന്ന ആശയം മാന്യമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള ചിത്രം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കല്പനയുടെ ലക്ഷ്യം ‘നിങ്ങൾ ... നിശ്ശബ്ദമാക്കണം’ എന്ന രൂപത്തിൽ വ്യക്തമായി നൽകിയിരിക്കുന്നു; രൂപകാലങ്കാരത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
