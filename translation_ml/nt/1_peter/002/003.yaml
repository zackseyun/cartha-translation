id: 1PE.2.3
reference: 1 Peter 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εἰ ἐγεύσασθε ὅτι χρηστὸς ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/003.yaml
  text: if indeed you have tasted that the Lord is good[a][b].
translation:
  language: ml
  text: കർത്താവ് നല്ലവനാണെന്ന് നിങ്ങൾ രുചിച്ചറിഞ്ഞിട്ടുണ്ടെങ്കിൽ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ രുചിച്ചറിഞ്ഞിരിക്കുന്നതിനാൽ.’ ഗ്രീക്കിൽ ഉപാധിരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എന്നാൽ ഈ ഉപാധി സത്യമാണെന്ന് കരുതിക്കൊണ്ടുള്ള പ്രയോഗമായിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘നല്ലവൻ’ എന്നത് ‘ദയയുള്ളവൻ’ അല്ലെങ്കിൽ ‘കൃപയുള്ളവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പ്രയോഗം സങ്കീർത്തനം 34:8-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: എങ്കിൽത്തന്നെ
  rationale: ഗ്രീക്കിലെ ഉപാധിരൂപം നിലനിർത്തുകയും, ഈ ഉപാധി സത്യമാണെന്ന പ്രതീക്ഷയോടെയുള്ള ഊന്നൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു. ‘ആയതിനാൽ’ എന്നു മാറ്റി ഉപാധിയെ പ്രസ്താവനയാക്കി തീർക്കുന്നില്ല.
- source_word: ἐγεύσασθε
  choice: രുചിച്ചറിഞ്ഞിട്ടുണ്ടെങ്കിൽ
  rationale: ‘രുചിക്കുക’ എന്ന മൂർത്തമായ ദൃശ്യവും അതിലൂടെ അനുഭവിച്ചറിയുക എന്ന അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു. 2:2–3-ലെ പോഷണദൃശ്യത്തോടും സങ്കീർത്തനപ്രതിധ്വനിയോടും ഇത് ചേരുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: രുചിച്ചറിഞ്ഞതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയെ സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: χρηστὸς
  choice: നല്ലവൻ
  rationale: നന്മ, ദയ, കൃപാപൂർവമായ പെരുമാറ്റം എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘ദയയുള്ളവൻ’ എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പുതിയനിയമത്തിലെ κύριος എന്ന സ്ഥാനപ്പേരിന്റെ പതിവായ മലയാളരൂപമാണിത്. ഇവിടെ യേശുവുമായുള്ള ബന്ധവും സങ്കീർത്തനം 34:8-ലെ കർത്താവിനെക്കുറിച്ചുള്ള ഭാഷയും ഒരുപോലെ തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: εἰ ഉപവാക്യത്തിന്റെ ഉപാധിബലം
  choice: ‘രുചിച്ചറിഞ്ഞിട്ടുണ്ടെങ്കിൽത്തന്നെ’ എന്ന യഥാർഥ ഉപാധിരൂപം
  alternative: ‘രുചിച്ചറിഞ്ഞിരിക്കുന്നതിനാൽ’
  rationale: വായനക്കാർക്ക് ഈ അനുഭവമുണ്ടെന്ന് എഴുത്തുകാരൻ കരുതുന്നതായി തോന്നുന്നുവെങ്കിലും, ഗ്രീക്ക് വാക്യം ഉപാധിരൂപം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. പ്രധാനപാഠത്തിൽ അത് നിലനിർത്തി, സാധ്യതയുള്ള കാരണാർഥവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പ്രധാനപാഠത്തിൽ ‘കർത്താവ്’ എന്നു മാത്രം
  alternative: ‘കർത്താവായ ക്രിസ്തു’
  rationale: സന്ദർഭം യേശുവിനെ ശക്തമായി സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, വാചകം സങ്കീർത്തനം 34:8-നെയും പ്രതിധ്വനിപ്പിക്കുന്നു. ‘ക്രിസ്തു’ എന്നു വിശദീകരണം ചേർക്കാതെ ഇരിക്കുന്നത് ഈ അന്തർപാഠബന്ധവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘രുചിച്ചറിഞ്ഞു’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതോടൊപ്പം മൂലത്തിലെ രുചിദൃശ്യവും അനുഭവാർഥവും സംരക്ഷിക്കുന്നു. ‘എങ്കിൽത്തന്നെ’ ഉപാധിയോടൊപ്പം പ്രതീക്ഷിക്കപ്പെടുന്ന യാഥാർഥ്യത്തിന്റെ ഊന്നലും നൽകുന്നു.
