id: 1PE.2.11
reference: 1 Peter 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: ml
  text: പ്രിയപ്പെട്ടവരേ, പരദേശികളും താൽക്കാലിക താമസക്കാരും[a] എന്ന നിലയിൽ, ആത്മാവിനെതിരെ[c] യുദ്ധം ചെയ്യുന്ന ജഡികമായ മോഹങ്ങളിൽനിന്ന്[b] അകന്നു നിൽക്കാൻ ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അന്യദേശവാസികളും താൽക്കാലിക താമസക്കാരും.’ ഈ ഇരട്ടപ്രയോഗം അവർ ഇപ്പോഴത്തെ യുഗത്തിലോ സമൂഹത്തിലോ പൂർണമായി ഉൾപ്പെട്ടവരല്ലെന്ന ഭാവം ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ജഡികമായ മോഹങ്ങൾ’ എന്നത് ‘ജഡത്തിന്റെ മോഹങ്ങൾ’ എന്നും, കൂടുതൽ വ്യാഖ്യാനപരമായി ‘പാപകരമായ മോഹങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ജീവനെതിരെ’ അല്ലെങ്കിൽ ‘സ്വയത്തിനെതിരെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: പ്രിയപ്പെട്ടവരേ
  rationale: സ്നേഹപൂർവമായ ബഹുവചന സംബോധന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρακαλῶ
  choice: ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: വെറും അപേക്ഷയല്ല, ഗൗരവമുള്ള പ്രബോധനവും ആഹ്വാനവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാം.
- source_word: ὡς
  choice: എന്ന നിലയിൽ
  rationale: വായനക്കാരെ ഏതു തിരിച്ചറിയലിൽ അഭിസംബോധന ചെയ്യുന്നു എന്നത് വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത കാരണാർഥം ചേർക്കുന്നില്ല.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: പരദേശികളും താത്കാലിക പ്രവാസികളും
  rationale: സ്വദേശത്തല്ലാതെ പാർക്കുന്നവരുടെയും സ്ഥിരതാമസമില്ലാത്ത യാത്രികരുടെയും പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ ഭാവങ്ങൾ നിലനിർത്തുന്നു.
- source_word: ἀπέχεσθαι
  choice: ഒഴിഞ്ഞുനിൽക്കുക
  rationale: തുടർച്ചയായി സ്വയം അകറ്റിനിർത്താനുള്ള ആഹ്വാനം സ്വാഭാവികവും ധാർമികമായി വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: ജഡികമായ മോഹങ്ങൾ
  rationale: σάρξ-ബന്ധമുള്ള രൂപകം സംരക്ഷിക്കുന്നു; അതിനെ നേരിട്ട് ‘പാപകരമായ മോഹങ്ങൾ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല. ‘മോഹങ്ങൾ’ ഇവിടെ പ്രതികൂലമായ ആഗ്രഹങ്ങളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: στρατεύονται
  choice: യുദ്ധം ചെയ്യുന്ന
  rationale: സജീവമായ ശത്രുതയെ സൂചിപ്പിക്കുന്ന സൈനികരൂപകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: κατὰ τῆς ψυχῆς
  choice: ആത്മാവിനെതിരെ
  rationale: ψυχήയുടെ വ്യക്തിയുടെ അന്തർജീവൻ/സ്വയം എന്ന ഭാരമുള്ള അർഥം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘നിങ്ങളുടെ’ എന്ന ഉടമസ്ഥസൂചന ചേർക്കുന്നില്ല.
theological_decisions:
- issue: σαρκικῶν എന്ന പദത്തിന്റെ ധാർമികസന്ദർഭത്തിലെ അർഥം
  choice: ജഡികമായ
  alternative: പാപകരമായ; ജഡത്തിന്റെ
  rationale: മൂലത്തിലെ σάρξ-രൂപകവും അതിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു; ‘പാപസ്വഭാവം’ പോലുള്ള വിപുലമായ വ്യാഖ്യാനം പാഠത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ψυχήയുടെ അർഥം
  choice: ആത്മാവ്
  alternative: ജീവൻ; സ്വയം; പ്രാണൻ
  rationale: വ്യക്തിയുടെ അന്തർജീവനെതിരെയുള്ള ആക്രമണം എന്ന ആശയം പ്രകടമാക്കുന്നു. അതേസമയം, സാങ്കേതികമായ ശരീരം–ആത്മാവ് ദ്വൈതം വാക്യം പറയുന്നതിലപ്പുറം ഉറപ്പിക്കുന്നില്ല; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രബോധനശൈലി. ‘പരദേശികൾ,’ ‘പ്രവാസികൾ,’ ‘ജഡികം,’ ‘ആത്മാവ്’ എന്നീ പദങ്ങൾ ബൈബിൾപരമായ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
