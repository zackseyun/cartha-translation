source:
  edition: SBLGNT
  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: ml
  text: സ്വതന്ത്രരായി, സ്വാതന്ത്ര്യത്തെ തിന്മയ്ക്കുള്ള മറയായി ഉപയോഗിക്കുന്നവരായല്ല, മറിച്ച് ദൈവത്തിന്റെ അടിമകളായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ ദാസന്മാരായി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് ‘അടിമകൾ’ എന്നും ‘ദാസന്മാർ’ എന്നും അർഥമാകാം; ‘സ്വതന്ത്രർ’ എന്നതുമായുള്ള ശക്തമായ വിരോധാഭാസം നിലനിർത്താനാണ് മുഖ്യപാഠത്തിൽ ‘അടിമകൾ’ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: സ്വതന്ത്രർ
  rationale: സാമൂഹികവും നിയമപരവുമായ സ്വാതന്ത്ര്യത്തിന്റെ ആശയം നിലനിർത്തുകയും, അഭിസംബോധന ചെയ്യപ്പെടുന്ന സമൂഹത്തെ ലിംഗഭേദമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπικάλυμμα
  choice: മറ
  rationale: തിന്മയെ ഒളിപ്പിക്കുന്ന ഒരു മൂടുപടം എന്ന മൂർത്തമായ രൂപകം ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: സ്വാതന്ത്ര്യത്തെ ... മറയായി ഉപയോഗിക്കുക
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘മറയായി സ്വാതന്ത്ര്യം കൈവശം വെക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഉപകരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κακίας
  choice: തിന്മ
  rationale: ദുഷ്ടതയെയോ തെറ്റായ പെരുമാറ്റത്തെയോ പൊതുവായി സൂചിപ്പിക്കുന്ന പദമായതിനാൽ, ‘വിദ്വേഷം’ പോലുള്ള ഇടുങ്ങിയ അർഥം ഒഴിവാക്കുന്നു.
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: സ്വതന്ത്രർ എന്നതുമായുള്ള ശക്തമായ വിരോധാഭാസവും ദൈവത്തിനുള്ള സമ്പൂർണമായ ഉടമസ്ഥബന്ധവും നിലനിർത്തുന്നു; ‘ദാസർ’ അല്ലെങ്കിൽ ‘ശുശ്രൂഷകർ’ ഈ തീവ്രത മയപ്പെടുത്താം.
- source_word: θεοῦ δοῦλοι
  choice: ദൈവത്തിന്റെ അടിമകൾ
  rationale: ദൈവത്തിന്റേതായവർ എന്ന ബന്ധവും ഉടമസ്ഥതയുടെ ശക്തമായ ആശയവും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ക്രിസ്തീയ തിരിച്ചറിയലുമായി ബന്ധപ്പെട്ട δοῦλοι എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദൈവത്തിന്റെ അടിമകൾ
  alternative: ദൈവത്തിന്റെ ദാസർ
  rationale: വാക്യം സ്വാതന്ത്ര്യത്തെയും ദൈവത്തിനുള്ള സമ്പൂർണമായ അധീനതയെയും ഉദ്ദേശപൂർവം ചേർത്തുനിർത്തുന്നു. ‘അടിമകൾ’ ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ സാധാരണയായി ആദരസൂചകമായി കേൾക്കുന്ന ‘ദാസർ’ മൂലപദത്തിന്റെ സാമൂഹിക ശക്തി കുറയ്ക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ὡς ... ὡς എന്ന സമാന്തര ഘടന മലയാളത്തിൽ ‘...വരെപ്പോലെ ജീവിക്കുക / ...ആയി ജീവിക്കുക’ എന്നു തുറന്നുപറഞ്ഞ് വാക്യത്തിന്റെ ഉപദേശാത്മക പ്രവാഹം സ്വാഭാവികമാക്കി. ‘മറ’ എന്ന രൂപകവും സ്വാതന്ത്ര്യം–അടിമത്തം എന്ന ഉദ്ദേശപൂർവ വിരോധാഭാസവും സംരക്ഷിച്ചു.
