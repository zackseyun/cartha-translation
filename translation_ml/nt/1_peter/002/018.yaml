reference: 1 Peter 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: ml
  text: വീട്ടിലെ ദാസന്മാരേ[a], സകല ആദരവോടും നിങ്ങളുടെ യജമാനന്മാർക്കു വിധേയരായിരിക്കുവിൻ—നല്ലവർക്കും സൗമ്യർക്കും മാത്രമല്ല, വക്രസ്വഭാവമുള്ളവർക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വീട്ടിലെ അടിമകളേ.’ οἰκέται എന്ന ഗ്രീക്കുപദം ഒരു കുടുംബത്തിനുള്ളിലെ അധീന സേവകരെ പ്രത്യേകിച്ച് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘കഠിനമായി പെരുമാറുന്നവർക്കും’ അല്ലെങ്കിൽ ‘അന്യായക്കാർക്കും.’ ഗ്രീക്കുപദത്തിന്റെ അക്ഷരാർഥം ‘വളഞ്ഞവർ’ അഥവാ ‘വക്രർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: വീട്ടിലെ ദാസന്മാർ
  rationale: പൊതുവായ വേലക്കാരെയല്ല, ഒരു കുടുംബത്തിനുള്ളിൽ അധീനസ്ഥിതിയിൽ സേവിച്ചിരുന്ന ഗൃഹദാസരെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘വീട്ടിലെ ദാസന്മാർ’ ഗൃഹസാഹചര്യവും സാമൂഹിക അധീനതയും ഒരുപോലെ വ്യക്തമാക്കുന്നു; അടിമസ്ഥിതിയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὑποτασσόμενοι
  choice: കീഴടങ്ങിയിരിക്കുവിൻ
  rationale: സന്ദർഭത്തിൽ കൽപ്പനയുടെ ശക്തിയുള്ള പങ്കാളിക്രിയയാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ ആഹ്വാനരൂപം ഉപയോഗിച്ച് തുടർച്ചയായ വിധേയത്വത്തിന്റെ ഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἐν παντὶ φόβῳ
  choice: പൂർണ ആദരവോടെ
  rationale: φόβος എന്നതിന് ഭയം, ഭക്ത്യാദരം, ആദരം എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ ആവശ്യപ്പെടുന്ന ആദരപൂർവമായ വിധേയത്വം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: δεσπόταις
  choice: യജമാനന്മാർക്ക്
  rationale: ഗൃഹദാസരുടെമേൽ അധികാരമുള്ളവരെ സൂചിപ്പിക്കുന്ന സാഹചര്യോചിതവും സാധാരണക്കാർക്കു മനസ്സിലാകുന്നതുമായ പദം.
- source_word: ἀγαθοῖς
  choice: നല്ലവർ
  rationale: മൂലപദത്തിന്റെ പൊതുവായ ധാർമിക വിലയിരുത്തൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐπιεικέσιν
  choice: സൗമ്യർ
  rationale: സൗമ്യത, പരിഗണന, വിട്ടുവീഴ്ചയുള്ള ന്യായബോധം എന്നിവ ഉൾക്കൊള്ളുന്ന പദത്തിന്റെ അർഥപരിധിക്ക് യോജിക്കുന്നു.
- source_word: σκολιοῖς
  choice: വക്രമായി പെരുമാറുന്നവർ
  rationale: ‘വളഞ്ഞത്/വക്രമായത്’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട്, വ്യക്തികളുടെ അന്യായമോ കഠിനമോ ആയ പെരുമാറ്റത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ഒരൊറ്റ അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: οἰκέται സൂചിപ്പിക്കുന്ന സാമൂഹിക പദവി മൃദൂകരിക്കാതെയും അതിരുകടന്ന് നിർവചിക്കാതെയും അവതരിപ്പിക്കൽ
  choice: പ്രധാന പാഠത്തിൽ ‘വീട്ടിലെ ദാസന്മാർ’; അടിക്കുറിപ്പിൽ ‘വീട്ടിലെ അടിമകൾ’ എന്ന സാധ്യത
  alternative: വീട്ടിലെ അടിമകൾ
  rationale: ഈ പദം ഗൃഹത്തിനുള്ളിലെ അധീന സേവകരെ പ്രത്യേകിച്ച് സൂചിപ്പിക്കുന്നു. പ്രധാന പാഠം ഗൃഹപരിധിയും അധീനബന്ധവും പ്രകടമാക്കുന്നു; അടിമസ്ഥിതിയുടെ ചരിത്രസാധ്യത അടിക്കുറിപ്പ് തുറന്നുവെക്കുന്നു.
- issue: φόβος എന്നത് ‘ഭയം’ എന്നോ സാഹചര്യപ്രകാരമുള്ള ‘ആദരം’ എന്നോ പരിഭാഷപ്പെടുത്തൽ
  choice: പൂർണ ആദരവോടെ
  alternative: എല്ലാ ഭയത്തോടും
  rationale: ഈ ഗൃഹോപദേശത്തിൽ ആദരപൂർവമായ വിധേയത്വമാണ് സാഹചര്യാർഥം. എങ്കിലും ‘ഭയം’ എന്ന അക്ഷരാർഥവും അതിലെ അർഥപിരിമുറുക്കവും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: σκολιοῖς എന്ന രൂപകപദം ധാർമികമായോ പെരുമാറ്റപരമായോ ചുരുക്കണമോ
  choice: വക്രമായി പെരുമാറുന്നവർ
  alternative: കഠിനർ; അന്യായക്കാർ; വക്രർ
  rationale: മൂലത്തിലെ ‘വളഞ്ഞ/വക്രമായ’ രൂപകം നിലനിർത്തുകയും കഠിനതയിലേക്കോ അന്യായത്തിലേക്കോ മാത്രം അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ഇരിക്കുവിൻ’ എന്ന രൂപം ആഹ്വാനത്തിന്റെ ഔപചാരിക ഗൗരവം നിലനിർത്തുന്നു. സാമൂഹിക യാഥാർഥ്യം മൃദൂകരിക്കാതെയും ഏതെങ്കിലും സഭാപാരമ്പര്യത്തിന്റെ പ്രത്യേക വ്യാഖ്യാനം ചേർക്കാതെയും വിവർത്തനം ചെയ്തിരിക്കുന്നു.
