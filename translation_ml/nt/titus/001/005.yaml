id: TIT.1.5
reference: Titus 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: ml
  text: 'ഇക്കാരണത്താലാണ് ഞാൻ നിന്നെ ക്രേത്തയിൽ വിട്ടത്: അവശേഷിച്ച കാര്യങ്ങൾ[a] നീ ക്രമത്തിലാക്കാനും, ഞാൻ നിന്നോടു നിർദേശിച്ചതുപോലെ[c] ഓരോ പട്ടണത്തിലും[b] മൂപ്പന്മാരെ നിയമിക്കാനുമാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കുറവായിരുന്നവ’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പട്ടണംതോറും’.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ഞാൻ നിന്നോടു കല്പിച്ചതുപോലെ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: ഇക്കാരണത്താലാണ്
  rationale: ഹേതുവിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ വിശദീകരണശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπέλιπόν
  choice: ഞാൻ ... വിട്ടത്
  rationale: തീത്തോസിനെ ക്രേത്തയിൽ ഒരു ദൗത്യത്തിനായി വിട്ടുവെന്ന ഭൂതകാലസംഭവം ലളിതമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: ἐν Κρήτῃ
  choice: ക്രേത്തയിൽ
  rationale: ദ്വീപിന്റെ പേരിന് പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചുള്ള സ്ഥാനസൂചക പ്രയോഗം.
- source_word: ἵνα
  choice: '... ക്രമത്തിലാക്കാനും ... നിയമിക്കാനുമാണ്'
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥം മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ആനും ... -ആനുമാണ്’ ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: τὰ λείποντα
  choice: അവശേഷിച്ച കാര്യങ്ങൾ
  rationale: ഇനിയും പൂർത്തിയാക്കപ്പെടാതെ ശേഷിച്ച കാര്യങ്ങൾ എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു; ‘കുറവായിരുന്നവ’ എന്ന ന്യൂനതാസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐπιδιορθώσῃ
  choice: ക്രമത്തിലാക്കാനും
  rationale: ശേഷിച്ച കാര്യങ്ങളെ തിരുത്തി യഥാക്രമം ക്രമീകരിക്കുന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καταστήσῃς
  choice: നിയമിക്കാനും
  rationale: ഒരു അംഗീകൃത ചുമതലയിലേക്ക് ആളുകളെ നിയോഗിക്കുക എന്ന സന്ദർഭോചിത അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: κατὰ πόλιν
  choice: ഓരോ പട്ടണത്തിലും
  rationale: κατάയും ഏകവചനനാമവും ചേർന്നുള്ള വിതരണാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘പട്ടണംതോറും’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πρεσβυτέρους
  choice: മൂപ്പന്മാരെ
  rationale: ഇവിടെ പ്രായമുള്ള പുരുഷന്മാരെ മാത്രമല്ല, അംഗീകൃത സഭാനേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. പിന്നീടുണ്ടായ പ്രത്യേക സഭാഭരണരീതികൾ ഇതിൽ കയറ്റിവയ്ക്കാതെ പൊതുവായി മനസ്സിലാകുന്ന പദം ഉപയോഗിക്കുന്നു.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: ഞാൻ നിന്നോടു നിർദേശിച്ചതുപോലെ
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന ഭാവം നിലനിർത്തുമ്പോഴും സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികം കടുപ്പം വരുത്തുന്നില്ല.
theological_decisions:
- issue: πρεσβυτέρους എന്ന സഭാനേതൃത്വപദം
  choice: മൂപ്പന്മാർ
  alternative: പ്രസ്ബിറ്റർമാർ; പ്രായമുള്ള പുരുഷന്മാർ
  rationale: വാക്യം അംഗീകൃത സഭാനേതാക്കളെക്കുറിച്ചാണ്; എന്നാൽ പിന്നീടുള്ള ഏതെങ്കിലും പ്രത്യേക സഭാഭരണക്രമം മുൻകൂട്ടി വിധിക്കുന്നില്ല. ‘മൂപ്പന്മാർ’ മൂലപദത്തിന്റെ സന്ദർഭോചിത അർഥം വിശാലമായി നിലനിർത്തുന്നു.
- issue: διεταξάμην എന്ന ക്രിയയുടെ അധികാരഭാവം
  choice: നിർദേശിച്ചതുപോലെ
  alternative: കല്പിച്ചതുപോലെ; ഉപദേശിച്ചതുപോലെ
  rationale: പൗലോസിന്റെ അധികാരപൂർവമായ നിർദേശം നിലനിർത്തുന്നു. ‘കല്പിച്ചു’ കൂടുതൽ ശക്തവും ‘ഉപദേശിച്ചു’ കൂടുതൽ മൃദുവുമായതിനാൽ മധ്യസ്ഥമായ ഈ രൂപം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉദ്ദേശ്യാർഥമുള്ള ദീർഘവാക്യം വായിക്കാൻ എളുപ്പമാക്കാൻ ദ്വിബിന്ദു ഉപയോഗിച്ചു. സഭാഭരണത്തെക്കുറിച്ചുള്ള പിൽക്കാല വിഭാഗീയ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി.
