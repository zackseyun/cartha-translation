source:
  edition: SBLGNT
  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: ml
  text: ഈ സാക്ഷ്യം സത്യമാണ്. ഇക്കാരണത്താൽ, അവർ വിശ്വാസത്തിൽ[a] ഉറച്ചവരായിരിക്കേണ്ടതിന്, അവരെ രൂക്ഷമായി ശാസിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിശ്വാസത്തിൽ” എന്ന ഗ്രീക്ക് പ്രയോഗം അവരുടെ സ്വന്തം വിശ്വാസത്തിൽ ഉറച്ചവരായിരിക്കുക എന്നോ, വിശ്വാസസത്യങ്ങളുടെ സമാഹാരമായ ക്രൈസ്തവവിശ്വാസത്തിൽ ഉറച്ചവരായിരിക്കുക എന്നോ അർഥമാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: സാക്ഷ്യം
  rationale: മുൻവാക്യത്തിൽ ഉദ്ധരിച്ച ക്രീത്തുകാരെക്കുറിച്ചുള്ള പ്രസ്താവനയ്ക്ക് സാക്ഷ്യസ്വഭാവമുണ്ടെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἀληθής
  choice: സത്യമാണ്
  rationale: സാക്ഷ്യം യാഥാർഥ്യത്തോട് ഒത്തുപോകുന്നു എന്ന വിധിപ്രസ്താവം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: δι’ ἣν αἰτίαν
  choice: അതുകൊണ്ട്
  rationale: മുൻപ്രസ്താവനയിൽനിന്നുള്ള കാരണപരമായ നിഗമനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἔλεγχε
  choice: ശാസിക്കുക
  rationale: തെറ്റ് നേരിട്ട് ചൂണ്ടിക്കാട്ടി തിരുത്തുന്ന ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἀποτόμως
  choice: കർശനമായി
  rationale: ശാസനത്തിന്റെ കടുപ്പം വ്യക്തമാക്കുന്നു; ശിക്ഷാത്മകമായ അർഥം അനാവശ്യമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ὑγιαίνωσιν
  choice: ആരോഗ്യമുള്ളവരായിരിക്കേണ്ടതിന്
  rationale: ക്രിയയിലെ ആരോഗ്യരൂപകം നിലനിർത്തിക്കൊണ്ട് ഉദ്ദേശ്യാർഥം പ്രകടമാക്കുന്നു.
- source_word: πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: വ്യക്തിപരമായ വിശ്വാസത്തെയോ ക്രൈസ്തവവിശ്വാസത്തിന്റെ ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ യഥാർഥ അവ്യക്തത പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν τῇ πίστει എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: വിശ്വാസത്തിൽ
  alternative: ക്രൈസ്തവവിശ്വാസത്തിൽ, അതായത് വിശ്വാസസത്യങ്ങളുടെ സമാഹാരത്തിൽ
  rationale: സന്ദർഭം തെറ്റായ ഉപദേശത്തെ അഭിമുഖീകരിക്കുന്നതിനാൽ വിശ്വാസത്തിന്റെ ഉപദേശപരമായ ഉള്ളടക്കം ഉദ്ദേശിച്ചിരിക്കാം; എങ്കിലും വ്യക്തിയുടെ വിശ്വാസജീവിതവും വ്യാകരണപരമായി സാധ്യമാണ്. അതിനാൽ പ്രധാനവാചകം അവ്യക്തത നിലനിർത്തുകയും അടിക്കുറിപ്പ് രണ്ടു സാധ്യതകളും വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ആരോഗ്യമുള്ളവർ’ എന്ന പ്രയോഗം സാധാരണ മലയാളത്തിൽ അല്പം രൂപകാത്മകമായി കേൾക്കുമെങ്കിലും മൂലപാഠത്തിലെ ആരോഗ്യരൂപകം മനപ്പൂർവം നിലനിർത്തുന്നു.
