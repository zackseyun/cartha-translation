    text: “വിശ്വാസത്തിൽ” എന്ന ഗ്രീക്ക് പ്രയോഗം അവരുടെ സ്വന്തം വിശ്വാസത്തിൽ ഉറച്ചവരായിരിക്കുക എന്നോ, വിശ്വാസസത്യങ്ങളുടെ സമാഹാരമായ ക്രൈസ്തവവിശ്വാസത്തിൽ ഉറച്ചവരായിരിക്കുക എന്നോ അർഥമാക്കാം.
    reason: alternative_reading
