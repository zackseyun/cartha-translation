  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: ml
  text: നിത്യജീവന്റെ പ്രത്യാശയിൽ—ആ ജീവൻ, കള്ളം പറയാത്ത ദൈവം യുഗങ്ങൾ ആരംഭിക്കുന്നതിനുമുമ്പ് വാഗ്ദാനം ചെയ്തതാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാലം ആരംഭിക്കുന്നതിനുമുമ്പ്.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “നിത്യമായ/യുഗങ്ങൾ നീളുന്ന കാലങ്ങൾക്കുമുമ്പ്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: പ്രത്യാശയിൽ
  rationale: ἐπί + ദത്തിവ് ഇവിടെ അടിസ്ഥാനം, സാഹചര്യം, ബന്ധപരിധി എന്നിവ സൂചിപ്പിക്കാം. മുൻവാക്യവുമായി ബന്ധം നിലനിർത്തിക്കൊണ്ട് അർഥം അതിയായി നിർണ്ണയിക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: ζωῆς αἰωνίου
  choice: നിത്യജീവന്റെ
  rationale: പ്രത്യാശയുടെ ഉള്ളടക്കമോ ലക്ഷ്യമോ ആയ നിത്യജീവനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ഷഷ്ഠീപ്രയോഗമാണിത്; ദൈർഘ്യവും പുതിയനിയമത്തിലെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ἣν
  choice: ആ ജീവൻ
  rationale: സ്ത്രീലിംഗ ഏകവചന ബന്ധസർവനാമം ഏറ്റവും സ്വാഭാവികമായി ‘നിത്യജീവൻ’ എന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ പരാമർശം അവ്യക്തമാകാതിരിക്കാനായി നാമം ആവർത്തിച്ചു.
- source_word: ἐπηγγείλατο
  choice: വാഗ്ദാനം ചെയ്തതാണ്
  rationale: ആറിസ്റ്റ് മധ്യമരൂപത്തിന്റെ സന്ദർഭോചിതമായ സ്വാഭാവിക മലയാളപരിഭാഷ; മലയാളത്തിൽ മധ്യമവാച്യത്തിന്റെ പ്രത്യേക സൂക്ഷ്മത നിർബന്ധമായി പ്രകടിപ്പിക്കേണ്ടതില്ല.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: കള്ളം പറയാത്ത ദൈവം
  rationale: ἀψευδής എന്നത് ‘കള്ളം പറയാത്ത, സത്യവാനായ’ എന്നാണ്. ‘കള്ളം പറയാൻ കഴിയാത്ത’ എന്നു ശക്തിപ്പെടുത്താതെ ഗ്രീക്ക് വിശേഷണത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: πρὸ χρόνων αἰωνίων
  choice: യുഗങ്ങൾക്കുമുമ്പേ
  rationale: χρόνοι αἰώνιοι എന്ന പ്രയോഗത്തിന്റെ യുഗകാലപരമായ സ്വഭാവവും മുൻകാലബലവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘കാലം ആരംഭിക്കുന്നതിനുമുമ്പ്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം പ്രധാനവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: πρὸ χρόνων αἰωνίων എന്ന കാലപ്രയോഗവും ദൈവിക വാഗ്ദാനവും
  choice: യുഗങ്ങൾക്കുമുമ്പേ ദൈവം നിത്യജീവൻ വാഗ്ദാനം ചെയ്തു എന്നു മാത്രം പ്രസ്താവിക്കുന്നു.
  alternative: കാലം ആരംഭിക്കുന്നതിനുമുമ്പ്; നിത്യതമുതൽ; നിത്യയുഗങ്ങൾക്കുമുമ്പ്
  rationale: വാഗ്ദാനം യുഗങ്ങൾക്കുമുമ്പുള്ളതാണെന്ന് ഗ്രീക്ക് വ്യക്തമാക്കുന്നു; എന്നാൽ അത് ആരോടു ചെയ്തുവെന്നോ അതിന്റെ അധിഭൗതിക ക്രമം എന്തെന്നോ വാക്യം വ്യക്തമാക്കുന്നില്ല. പരിഭാഷ ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: ἀψευδής എന്ന ദൈവവിവരണം
  choice: കള്ളം പറയാത്ത ദൈവം
  alternative: കള്ളം പറയാൻ കഴിയാത്ത ദൈവം; സത്യവാനായ ദൈവം
  rationale: ദൈവത്തിന്റെ സത്യസന്ധത നേരിട്ട് പ്രകടിപ്പിക്കുമ്പോഴും ‘കഴിയാത്ത’ എന്ന അധിക ശേഷിവാദം മൂലപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഈ വാക്യം 1:1-ലെ നീണ്ട വാക്യഘടനയുടെ ഭാഗമായതിനാൽ ‘പ്രത്യാശയിൽ’ എന്ന തുടക്കം നിലനിർത്തി; ഡാഷ് ബന്ധസർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുകുറിയും പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
