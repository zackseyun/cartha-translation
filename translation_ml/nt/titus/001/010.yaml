id: TIT.1.10
reference: Titus 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: ml
  text: എന്തെന്നാൽ, അനുസരണമില്ലാത്തവരും വ്യർഥസംസാരക്കാരും വഞ്ചകരുമായ പലരുണ്ട്; പ്രത്യേകിച്ച് പരിച്ഛേദനയിൽപ്പെട്ടവർ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പരിച്ഛേദനാപക്ഷക്കാർ” എന്നും “പരിച്ഛേദനയിൽനിന്നുള്ളവർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പ്രയോഗം യഹൂദരെയോ യഹൂദാചാരങ്ങൾ നിർബന്ധിച്ച എതിരാളികളെയോ സൂചിപ്പിച്ചിരിക്കാം; എന്നാൽ ഗ്രീക്ക് പാഠം ഇത്ര വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ നിർദേശത്തിന് കാരണം വിശദീകരിക്കുന്ന ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πολλοὶ
  choice: പലരുണ്ട്
  rationale: ഗ്രീക്കിലെ വിശേഷണം ഇവിടെ ആളുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർത്ഥം സ്വാഭാവികമായി പൂർണമാക്കുന്നു.
- source_word: ἀνυπότακτοι
  choice: അനുസരണമില്ലാത്തവർ
  rationale: യോഗ്യമായ അധികാരത്തിനു കീഴടങ്ങാത്ത സ്വഭാവം വ്യക്തമാക്കുകയും അതിരുകടന്ന രാഷ്ട്രീയമോ അക്രമപരമോ ആയ അർത്ഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ματαιολόγοι
  choice: വ്യർഥസംസാരക്കാർ
  rationale: ഫലമോ സാരമോ ഇല്ലാത്ത കാര്യങ്ങൾ സംസാരിക്കുന്നവരെന്ന സംയുക്തപദത്തിന്റെ ധാർമ്മിക വിലയിരുത്തൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: φρεναπάται
  choice: വഞ്ചകർ
  rationale: മനസ്സിനെ വഴിതെറ്റിക്കുന്നവർ എന്ന പദത്തിന്റെ ആശയം സാധാരണവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: μάλιστα
  choice: പ്രത്യേകിച്ച്
  rationale: വലിയ കൂട്ടത്തിനുള്ളിലെ ഒരു വിഭാഗത്തിന് പ്രത്യേക ഊന്നൽ നൽകുന്നു.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: പരിച്ഛേദനയിൽപ്പെട്ടവർ
  rationale: അക്ഷരാർഥത്തിലുള്ള 'പരിച്ഛേദനയിൽനിന്നുള്ളവർ' എന്ന ബന്ധം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത 'യഹൂദർ' എന്നോ 'കക്ഷി' എന്നോ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: οἱ ἐκ τῆς περιτομῆς എന്ന പ്രയോഗത്തിന്റെ സൂചിതവിഭാഗം
  choice: പരിച്ഛേദനയിൽപ്പെട്ടവർ
  alternative: പരിച്ഛേദനാപക്ഷക്കാർ; യഹൂദവിഭാഗത്തിൽപ്പെട്ടവർ
  rationale: ഇത് യഹൂദരെയോ യഹൂദാചാരങ്ങൾ നിർബന്ധിച്ചവരെയോ സൂചിപ്പിച്ചിരിക്കാം. എന്നാൽ ഗ്രീക്ക് പ്രയോഗം അത്ര വ്യക്തമായി വിഭാഗത്തെ നിർവചിക്കുന്നില്ല; അതിനാൽ ആ ചരിത്രപരമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സാങ്കേതികവും വിഭാഗീയവുമായ പദങ്ങൾ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി; ഉറവിടത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
