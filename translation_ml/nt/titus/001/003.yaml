id: TIT.1.3
reference: Titus 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: ml
  text: എന്നാൽ തന്റെതായ സമയങ്ങളിൽ[a] അവിടുന്ന് തന്റെ വചനം, എനിക്ക് ഏൽപ്പിക്കപ്പെട്ട പ്രഘോഷണത്തിലൂടെ[b][c], നമ്മുടെ രക്ഷകനായ ദൈവത്തിന്റെ കൽപ്പനപ്രകാരം വെളിപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തക്ക സമയങ്ങളിൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘തന്റെതായ സമയങ്ങളിൽ’; ദൈവം നിശ്ചയിച്ച സമയങ്ങളെയായിരിക്കാം ഇതു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പ്രസംഗത്തിലൂടെ.’ ഈ പദം പ്രഘോഷിക്കുന്ന പ്രവൃത്തിയെയോ പ്രഘോഷിക്കപ്പെട്ട സന്ദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'ഈ ബന്ധവാക്യം ‘തന്റെ വചനം’ എന്നതിനോടും ചേർത്ത് മനസ്സിലാക്കാം: ‘എനിക്ക് ഏൽപ്പിക്കപ്പെട്ട തന്റെ വചനം ...’'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: വെളിപ്പെടുത്തി
  rationale: മുമ്പ് മറഞ്ഞിരുന്നതിനെ പരസ്യമായി അറിയിക്കുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; മുൻസന്ദർഭത്തിൽനിന്ന് ദൈവമാണ് കർത്താവ്.
- source_word: καιροῖς ἰδίοις
  choice: തന്റെതായ സമയങ്ങളിൽ
  rationale: καιρός എന്നതിലെ നിശ്ചിത അവസരം/കാലഘട്ടം എന്ന ആശയവും ἰδίοις എന്നതിലെ ഉടമസ്ഥസൂചനയും നിലനിർത്തുന്നു; ദൈവം നിശ്ചയിച്ച കാലങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: τὸν λόγον αὐτοῦ
  choice: തന്റെ വചനം
  rationale: ദൈവം അറിയിച്ച സന്ദേശത്തെയാണ് λόγος ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘വചനം’ അതിന്റെ പദബന്ധവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: ἐν κηρύγματι
  choice: പ്രഘോഷണത്തിലൂടെ
  rationale: ἐν ഇവിടെ ഉപാധിയെ സൂചിപ്പിക്കുന്നു. κήρυγμα പ്രഘോഷിക്കുന്ന പ്രവൃത്തിയെയോ പ്രഘോഷിക്കപ്പെടുന്ന സന്ദേശത്തെയോ സൂചിപ്പിക്കാമെന്നതിനാൽ ‘പ്രഘോഷണം’ ആ ഇരട്ടസാധ്യത നിലനിർത്തുന്നു.
- source_word: ὃ ... ἐπιστεύθην ἐγὼ
  choice: എന്നെ ഏൽപ്പിച്ച
  rationale: πιστεύω എന്ന ക്രിയയുടെ ഈ കർമണിപ്രയോഗം ‘വിശ്വസിച്ചു’ എന്നല്ല, ഒരു ചുമതലയോ സന്ദേശമോ ഭരമേൽപ്പിക്കപ്പെട്ടു എന്നാണ്. അടുത്തുള്ള κήρυγμα-ത്തോട് ബന്ധിപ്പിക്കുന്ന വായനയാണ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചത്.
- source_word: κατ’ ἐπιταγὴν
  choice: കല്പനപ്രകാരം
  rationale: അധികാരപൂർവമായ നിർദേശത്തോടുള്ള അനുസൃതതയെയോ അതിന്റെ അടിസ്ഥാനത്തെയോ κατά + accusative ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: നമ്മുടെ രക്ഷകനായ ദൈവത്തിന്റെ
  rationale: ‘രക്ഷകൻ’ എന്ന പദവി ദൈവത്തിനാണ് ചേർക്കുന്നതെന്ന് വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐφανέρωσεν എന്ന ക്രിയയുടെ അപ്രകട കർത്താവും καιροῖς ἰδίοις എന്നതിലെ ഉടമസ്ഥസൂചനയും
  choice: ദൈവത്തെ കർത്താവാക്കി ‘തന്റെതായ സമയങ്ങളിൽ അവിടന്ന് ... വെളിപ്പെടുത്തി’
  alternative: ‘തക്ക സമയത്ത് അതു വെളിപ്പെട്ടു’ എന്ന കർത്താവില്ലാത്ത രൂപം
  rationale: മുൻസന്ദർഭത്തിൽ വാഗ്ദാനം ചെയ്തവൻ ദൈവമാണ്; തുടർന്ന് അതു വെളിപ്പെടുത്തുന്നതും ദൈവമാണെന്ന ചിന്താപ്രവാഹവും ἰδίοις എന്നതിലെ ഉടമസ്ഥസൂചനയും മുഖ്യവായന നിലനിർത്തുന്നു.
- issue: ὃ എന്ന ബന്ധസർവനാമത്തിന്റെ പൂർവപദം
  choice: അടുത്തുള്ള ‘പ്രഘോഷണം’ (κήρυγμα) എന്നതിനോട് ബന്ധിപ്പിച്ചു
  alternative: ‘തന്റെ വചനം ... എന്നെ ഏൽപ്പിച്ചത്’ എന്നവിധം λόγος-നോട് ബന്ധിപ്പിക്കുക
  rationale: വ്യാകരണപരമായി ഏറ്റവും അടുത്ത യോജ്യമായ പൂർവപദം κήρυγμα ആണ്; എങ്കിലും λόγος-നോട് ബന്ധിപ്പിക്കുന്ന വായന സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘പ്രഘോഷണം’ സുവിശേഷസന്ദർഭത്തിന് യോജിക്കുകയും κήρυγμα എന്നതിലെ പ്രവൃത്തി/സന്ദേശം എന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കുകയും ചെയ്യുന്നു. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു.
