id: TIT.1.16
reference: Titus 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θεὸν ὁμολογοῦσιν εἰδέναι, τοῖς δὲ ἔργοις ἀρνοῦνται, βδελυκτοὶ ὄντες καὶ ἀπειθεῖς καὶ πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: ml
  text: അവർ ദൈവത്തെ അറിയുന്നെന്ന് അവകാശപ്പെടുന്നു[a]; എന്നാൽ പ്രവൃത്തികളാൽ അവനെ നിഷേധിക്കുന്നു[b]. അവർ വെറുപ്പുളവാക്കുന്നവരും[c] അനുസരണക്കേടുള്ളവരും എല്ലാ സൽപ്രവൃത്തികൾക്കും അയോഗ്യരുമാണ്[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തെ അറിയുന്നു എന്ന് അവർ പറയുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തങ്ങളുടെ പ്രവൃത്തികളാൽ അവനെ തള്ളിപ്പറയുന്നു.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അറപ്പുളവാക്കുന്നവർ’ അല്ലെങ്കിൽ ‘മ്ലേച്ഛർ.’
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, ‘എല്ലാ സൽപ്രവൃത്തികൾക്കും കൊള്ളാത്തവർ’ അല്ലെങ്കിൽ ‘പരിശോധനയിൽ അംഗീകാരം ലഭിക്കാത്തവർ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: ദൈവത്തെ
  rationale: ὁμολογοῦσιν εἰδέναι എന്ന പ്രയോഗത്തിന്റെ കർമമായി വരുന്ന θεὸν എന്ന പദത്തിന്റെ സ്വാഭാവികവും പ്രമാണികവുമായ മലയാളരൂപം.
- source_word: ὁμολογοῦσιν
  choice: അവകാശപ്പെടുന്നു
  rationale: വാക്കിലുള്ള അവകാശവാദവും പ്രവൃത്തികളിലുള്ള നിഷേധവും തമ്മിലുള്ള വൈരുധ്യം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘ഏറ്റുപറയുന്നു’ എന്നത് ഇവിടെ ആത്മാർഥമായ വിശ്വാസസമ്മതം സൂചിപ്പിക്കാനിടയുണ്ട്.
- source_word: εἰδέναι
  choice: അറിയുന്നെന്ന്
  rationale: ദൈവത്തെ അറിയുന്നു എന്ന അവരുടെ അവകാശവാദത്തെ സ്വാഭാവികമായ മലയാള പരോക്ഷവാക്യമായി നൽകുന്നു.
- source_word: τοῖς δὲ ἔργοις
  choice: എന്നാൽ പ്രവൃത്തികളാൽ
  rationale: 'δέയുടെ വൈരുധ്യവും ദത്തിവിന്റെ ഉപാധി/തെളിവ് ഭാവവും നിലനിർത്തുന്നു: അവരുടെ പ്രവൃത്തികളാണ് നിഷേധം പ്രകടമാക്കുന്നത്.'
- source_word: ἀρνοῦνται
  choice: അവനെ നിഷേധിക്കുന്നു
  rationale: ആദ്യ ഉപവാക്യത്തിലെ ‘ദൈവത്തെ’ എന്ന കർമം രണ്ടാമത്തേതിലും സ്വാഭാവികമായി തുടരുന്നു; ശക്തമായ വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: βδελυκτοὶ
  choice: വെറുപ്പുളവാക്കുന്നവർ
  rationale: ധാർമികമായി അറപ്പും വെറുപ്പും ഉളവാക്കുന്ന അവസ്ഥയുടെ കടുപ്പം, അതിപുരാതനമായ പദപ്രയോഗമില്ലാതെ, വ്യക്തമാക്കുന്നു.
- source_word: ἀπειθεῖς
  choice: അനുസരണകെട്ടവർ
  rationale: വെറും ബോധ്യപ്പെടാത്ത അവസ്ഥയല്ല, അനുസരിക്കാൻ വിസമ്മതിക്കുന്ന ധാർമിക നിലയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: സകല സൽപ്രവൃത്തിക്കും
  rationale: πρός ഇവിടെ യോഗ്യതയുമായുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു; പᾶν എന്നതിന്റെ വ്യാപ്തി ‘സകല’ വഴി സംരക്ഷിക്കുന്നു.
- source_word: ἀδόκιμοι
  choice: കൊള്ളാത്തവർ
  rationale: പരിശോധനയിൽ നിലവാരം തികയാത്തതിനാൽ നല്ല പ്രവൃത്തിക്ക് യോഗ്യമല്ലാത്ത അവസ്ഥയെ സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘അയോഗ്യർ’ എന്ന പകരവും സാധ്യമാണ്.
theological_decisions:
- issue: വാക്കിലുള്ള ദൈവജ്ഞാനാവകാശവും പ്രവൃത്തികളിലുള്ള നിഷേധവും തമ്മിലുള്ള ബന്ധം
  choice: അവർ ദൈവത്തെ അറിയുന്നെന്ന് വാക്കാൽ അവകാശപ്പെടുമ്പോഴും അവരുടെ പ്രവൃത്തികളാൽ ദൈവത്തെത്തന്നെ നിഷേധിക്കുന്നു.
  alternative: പ്രവൃത്തികൾ ദൈവത്തിന്റെ സത്യത്തെ പൊതുവായി നിഷേധിക്കുന്നു എന്നു ഗ്രഹിക്കാം.
  rationale: ആദ്യ ഉപവാക്യത്തിലെ വ്യക്തമായ കർമം ‘ദൈവത്തെ’ എന്നാണ്; രണ്ടാമത്തെ ഉപവാക്യത്തിലെ പ്രകടമല്ലാത്ത കർമം അതിനെ സ്വാഭാവികമായി മുന്നോട്ടുകൊണ്ടുപോകുന്നു. വചനത്തിലുള്ള ധാർമിക-ദൈവശാസ്ത്രപരമായ സംഘർഷം അധികമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. വാക്കും പ്രവൃത്തിയും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം അർദ്ധവിരാമവും ‘എന്നാൽ’ എന്ന ബന്ധകവുംകൊണ്ട് വ്യക്തമാക്കിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
