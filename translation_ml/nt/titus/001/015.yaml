id: TIT.1.15
reference: Titus 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: ml
  text: ശുദ്ധിയുള്ളവർക്ക് എല്ലാം ശുദ്ധമാണ്; എന്നാൽ മലിനരായവർക്കും അവിശ്വാസികൾക്കും[a] ഒന്നും ശുദ്ധമല്ല. മറിച്ച്, അവരുടെ മനസ്സും മനസ്സാക്ഷിയും മലിനമായിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലുടനീളം ‘വെടിപ്പുള്ളത്/വെടിപ്പുള്ളവർ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദത്തിന് ആചാരപരവും ധാർമികവുമായ ശുദ്ധിയുടെ സൂചനകൾ ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: എല്ലാം
  rationale: നപുംസക ബഹുവചനം ഇവിടെ സമഗ്രമായ അർഥത്തിലാണ്; സൂക്തസദൃശമായ വാക്യത്തിന്റെ വിശാലമായ വ്യാപ്തി ‘എല്ലാം’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: ശുദ്ധം / ശുദ്ധിയുള്ളവർ
  rationale: καθαρός എന്ന പദത്തിന് ആചാരപരവും ധാർമികവുമായ ശുദ്ധിയുടെ അർഥങ്ങൾ ഉണ്ടാകാം. ‘ശുദ്ധം’ ഇരു സൂചനകളും നിലനിർത്തുന്നു; നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന ബഹുവചന വിശേഷണത്തിന് ‘ശുദ്ധിയുള്ളവർ’ സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: എന്നാൽ മലിനരായവർക്ക്
  rationale: പൂർണകാല കൃദന്തം മുൻപ് സംഭവിച്ച മലിനീകരണത്തിന്റെ ഫലമായി തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘മലിനരായവർ’ ആ സ്ഥിതിവിശേഷം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἀπίστοις
  choice: അവിശ്വാസികൾക്ക്
  rationale: ഇവിടെ മുഖ്യമായ വൈരുധ്യം യഥാർഥ വിശ്വാസത്തോടാണ്; അതിനാൽ ‘അവിശ്വാസികൾ’ ഏറ്റവും വ്യക്തമാണ്.
- source_word: οὐδὲν καθαρόν
  choice: ഒന്നും ശുദ്ധമല്ല
  rationale: ആദ്യ ഉപവാക്യത്തിലെ പദപ്രയോഗം ആവർത്തിച്ച് മൂലത്തിലെ പ്രതിജ്ഞാപക ഘടനയും വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: ἀλλὰ
  choice: മറിച്ച്
  rationale: ബാഹ്യവസ്തുക്കളല്ല, അവരുടെ ആന്തരിക അവസ്ഥയാണ് യഥാർഥ പ്രശ്നമെന്ന ശക്തമായ വൈരുധ്യവും വിശദീകരണഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: μεμίανται
  choice: മലിനമായിരിക്കുന്നു
  rationale: പൂർണകാല രൂപം ഫലമായി തുടരുന്ന അവസ്ഥയെ ഊന്നുന്നു; ‘മലിനമായിരിക്കുന്നു’ ആ നിലനിൽക്കുന്ന ഫലം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: νοῦς
  choice: മനസ്സ്
  rationale: ചിന്തയുടെയും ഗ്രഹണത്തിന്റെയും ശേഷിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സാധാരണവുമായ മലയാള പദം.
- source_word: συνείδησις
  choice: മനസ്സാക്ഷി
  rationale: ധാർമിക സ്വബോധത്തെയും സ്വയം വിധിക്കുന്ന ആന്തരിക ശേഷിയെയും സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം.
- source_word: καὶ ... καὶ
  choice: മനസ്സും മനസ്സാക്ഷിയും
  rationale: ഇരട്ട ‘-ഉം’ പ്രയോഗം രണ്ടു ശേഷികളും ഒരുപോലെ ബാധിക്കപ്പെട്ടിരിക്കുന്നുവെന്ന ഗ്രീക്ക് ഘടനയുടെ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ശുദ്ധിയെ സൂചിപ്പിക്കുന്ന ഭാഷയുടെ വ്യാപ്തി
  choice: καθαρός എന്നത് എല്ലായിടത്തും ‘ശുദ്ധം’ എന്ന അർഥമേഖലയിൽ പരിഭാഷപ്പെടുത്തി; ഇതിലൂടെ ആചാരപരവും ധാർമികവുമായ സൂചനകൾ ഒരുമിച്ച് നിലനിർത്തി.
  alternative: എല്ലായിടത്തും ‘വൃത്തിയുള്ളത്/വെടിപ്പുള്ളത്’ എന്ന് പരിഭാഷപ്പെടുത്തി ആചാരപരമായ ശുദ്ധിക്ക് കൂടുതൽ ഊന്നൽ നൽകുക.
  rationale: സമീപസന്ദർഭത്തിൽ ശുദ്ധിനിയമങ്ങളോടും യെഹൂദ ചട്ടങ്ങളോടും ബന്ധപ്പെട്ട തർക്കങ്ങൾ ഉണ്ടെങ്കിലും, പ്രസ്താവന ബാഹ്യനിയമങ്ങളെക്കാൾ മനുഷ്യന്റെ ആന്തരിക അവസ്ഥയിലേക്കും വ്യാപിക്കുന്നു. ‘ശുദ്ധം’ ഈ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും പിരിമുറുക്കവും അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ആദ്യ രണ്ടു ഉപവാക്യങ്ങളിലെ ആവർത്തനവും അവസാനത്തെ ‘മനസ്സും മനസ്സാക്ഷിയും’ എന്ന സമാന്തര ഊന്നലും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ശുദ്ധി-ഭാഷ ഉൾപ്പെടുന്ന ഉപവാക്യത്തിന്റെ അവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
