revisions:
- from: സത്യത്തിൽനിന്ന് പിന്തിരിയുന്ന മനുഷ്യരുടെ കൽപ്പനകൾക്കും യെഹൂദരുടെ കെട്ടുകഥകൾക്കും ചെവികൊടുക്കാതിരിക്കേണ്ടതിന്.
  to: യെഹൂദരുടെ കെട്ടുകഥകൾക്കും സത്യത്തിൽനിന്ന് പിന്തിരിയുന്ന മനുഷ്യരുടെ കൽപ്പനകൾക്കും ചെവികൊടുക്കാതെ.
  rationale: The revision restores the source order and uses a Malayalam participial form that more directly reflects the Greek continuing participle. The genitive participle remains linked to ‘മനുഷ്യരുടെ,’ so the commands are those of people who turn away from the truth. No footnote is needed because the translation preserves the most natural grammatical reading without obscuring a textual variant.
