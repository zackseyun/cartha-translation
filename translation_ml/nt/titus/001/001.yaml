id: TIT.1.1
reference: Titus 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: ml
  text: ദൈവത്തിന്റെ അടിമയും യേശുവായ മശീഹയുടെ അപ്പൊസ്തലനുമായ പൗലോസ്—ദൈവം തിരഞ്ഞെടുത്തവരുടെ വിശ്വാസത്തിനും ദൈവഭക്തിക്ക് അനുസൃതമായ സത്യത്തിന്റെ പരിജ്ഞാനത്തിനുംവേണ്ടി[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിശ്വാസത്തിനും ... പരിജ്ഞാനത്തിനും അനുസൃതമായി” എന്നും പരിഭാഷപ്പെടുത്താം. “ദൈവഭക്തിക്ക് അനുസൃതമായ സത്യം” എന്നതിന് “ദൈവഭക്തിയിലേക്കു നയിക്കുന്ന സത്യം” എന്നും അർഥമാകാം.
    reason: κατά എന്ന പദത്തിന്റെ രണ്ടു പ്രയോഗങ്ങളിലുമുള്ള വ്യാകരണ-അർഥവൈവിധ്യം സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: δοῦλος θεοῦ
  choice: ദൈവത്തിന്റെ അടിമ
  rationale: δοῦλος സൂചിപ്പിക്കുന്ന സമ്പൂർണ ഉടമസ്ഥതയും അധീനതയും ‘ദാസൻ’ എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു; ഇവിടെ പൗലോസിന്റെ ദൈവത്തോടുള്ള പൂർണമായ ചേർന്നുനിൽപ്പാണ് ഉന്നയിക്കുന്നത്.
- source_word: ἀπόστολος
  choice: അപ്പൊസ്തലൻ
  rationale: പ്രത്യേകമായി നിയോഗിക്കപ്പെട്ട ദൂതൻ എന്ന സഭാപരവും ചരിത്രപരവുമായ അർഥം നിലനിർത്തുന്ന സ്ഥാപിത മലയാളപദം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός എന്ന അഭിഷിക്തനായ രാജാവിന്റെ സ്ഥാനപ്പേര് കേവലം വ്യക്തിനാമമായി മങ്ങിപ്പോകാതിരിക്കാൻ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: κατὰ πίστιν
  choice: വിശ്വാസത്തിനുവേണ്ടി
  rationale: κατά ഇവിടെ പൗലോസിന്റെ അപ്പൊസ്തലത്വത്തിന്റെ ലക്ഷ്യമോ ദിശയോ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം; ഗ്രീക്ക് വാക്യഘടനയുടെ ചുരുക്കം പൂർണമായി തീർപ്പാക്കാതെ ലക്ഷ്യബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐκλεκτῶν θεοῦ
  choice: ദൈവം തിരഞ്ഞെടുത്തവർ
  rationale: ദൈവിക തിരഞ്ഞെടുപ്പിന്റെ അർഥം സംരക്ഷിക്കുമ്പോഴും പ്രത്യേക മതവിഭാഗത്തിന്റെ സാങ്കേതിക പദാവലി അടിച്ചേൽപ്പിക്കാത്ത, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗം.
- source_word: ἐπίγνωσιν
  choice: പരിജ്ഞാനം
  rationale: സാധാരണ അറിവിനെക്കാൾ തിരിച്ചറിവോടുകൂടിയ അറിവ് എന്ന സാധ്യത മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; ‘പൂർണ പരിജ്ഞാനം’ എന്നു പറഞ്ഞ് തീവ്രത അതിരുകടത്തി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἀληθείας τῆς κατ’ εὐσέβειαν
  choice: ദൈവഭക്തിക്ക് അനുസൃതമായ സത്യം
  rationale: κατά സൂചിപ്പിക്കുന്ന പൊരുത്തബന്ധം പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു; സത്യം ദൈവഭക്തിയിലേക്കു നയിക്കുന്നു എന്ന കാരണാർഥ വായന നിർബന്ധമാക്കുന്നില്ല.
- source_word: εὐσέβειαν
  choice: ദൈവഭക്തി
  rationale: ദൈവത്തോടുള്ള ഭക്തിയിൽ രൂപപ്പെടുന്ന ആദരപൂർവമായ ജീവിതത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: ἐκλεκτῶν θεοῦ എന്നതിന്റെ വിവർത്തനം
  choice: ദൈവം തിരഞ്ഞെടുത്തവർ
  alternative: ദൈവത്തിന്റെ തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  rationale: തിരഞ്ഞെടുപ്പിന്റെ പ്രവർത്തകൻ ദൈവമാണെന്നത് വ്യക്തമാക്കുന്നു; എന്നാൽ തിരഞ്ഞെടുപ്പിന്റെ രീതി സംബന്ധിച്ച ഏതെങ്കിലും മതവിഭാഗീയ വ്യവസ്ഥ പാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- issue: κατὰ πίστιν ... καὶ ἐπίγνωσιν എന്നതും അപ്പൊസ്തലത്വവും തമ്മിലുള്ള ബന്ധം
  choice: വിശ്വാസത്തിനും ... പരിജ്ഞാനത്തിനുംവേണ്ടി
  alternative: വിശ്വാസത്തിനും ... പരിജ്ഞാനത്തിനും അനുസൃതമായി
  rationale: പൗലോസിന്റെ നിയോഗം ദൈവം തിരഞ്ഞെടുത്തവരുടെ വിശ്വാസത്തെയും സത്യപരിജ്ഞാനത്തെയും ലക്ഷ്യമാക്കുന്നു എന്ന സാധ്യതയാണ് പ്രധാനവാചകം സ്വീകരിക്കുന്നത്; ‘അനുസൃതമായി’ എന്ന മാനദണ്ഡാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: τῆς κατ’ εὐσέβειαν എന്നതിലെ ബന്ധം
  choice: ദൈവഭക്തിക്ക് അനുസൃതമായ
  alternative: ദൈവഭക്തിയിലേക്കു നയിക്കുന്ന
  rationale: ഗ്രീക്ക് κατάയുടെ അടിസ്ഥാന പൊരുത്താർഥം നിലനിർത്തുന്നു; ദൈവഭക്തി ഫലമാണെന്ന സാധ്യമായ വായനയെ പ്രധാനവാചകത്തിൽ ഏകാർത്ഥമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഈ വാക്യം അടുത്ത വാക്യങ്ങളിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം കോമ നിലനിർത്തി. ‘അടിമ’ എന്നത് കടുപ്പമുള്ളതെങ്കിലും δοῦλος എന്ന പദത്തിന്റെ ഉടമസ്ഥതാ-അധീനതാഭാവം മനപ്പൂർവം സംരക്ഷിക്കുന്നു.
