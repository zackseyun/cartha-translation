id: TIT.1.4
reference: Titus 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: ml
  text: 'നമുക്കു പൊതുവായ വിശ്വാസപ്രകാരം എന്റെ യഥാർഥ മകനായ തീത്തൊസിന്: പിതാവായ ദൈവത്തിൽനിന്നും നമ്മുടെ രക്ഷകനായ മശീഹാ[b] യേശുവിൽനിന്നും കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ഗ്രീക്കിൽ “ക്രിസ്തുയേശു”; Χριστός ഒരു പദവിയായതിനാൽ ഇവിടെ “മശീഹാ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: എന്റെ യഥാർഥ മകനായ
  rationale: ആത്മികബന്ധത്തിന്റെ ആധികാരികതയാണ് γνήσιος സൂചിപ്പിക്കുന്നത്; ജൈവികമായ നിയമസാധുതയല്ല. τέκνον ലിംഗനിർണയമില്ലാത്ത ‘കുട്ടി/സന്താനം’ എന്ന പദമാണെങ്കിലും, പ്രായപൂർത്തിയായ തീത്തൊസിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന മലയാളത്തിൽ ‘മകൻ’ സ്വാഭാവികമായി ആത്മിക കുടുംബരൂപകം നിലനിർത്തുന്നു.
- source_word: κατὰ κοινὴν πίστιν
  choice: നമുക്കു പൊതുവായ വിശ്വാസമനുസരിച്ച്
  rationale: κατά ബന്ധമോ മാനദണ്ഡമോ സൂചിപ്പിക്കുന്നു; κοινή എന്നത് പൗലൊസും തീത്തൊസും പങ്കിടുന്ന ഒന്നിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നമുക്ക്’ എന്നത് ഗ്രീക്കിൽ ബന്ധസന്ദർഭത്തിൽ അന്തർലീനമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: χάρις καὶ εἰρήνη
  choice: കൃപയും സമാധാനവും
  rationale: പൗലൊസിന്റെ ലേഖനാശംസയിലെ സ്ഥിരവും അർഥസമ്പന്നവുമായ പദജോടി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: θεοῦ πατρὸς
  choice: പിതാവായ ദൈവം
  rationale: ഇവിടെ πατρός-നോടൊപ്പം ‘നമ്മുടെ’ എന്ന സർവനാമം ഗ്രീക്കിൽ ഇല്ല; അതിനാൽ ‘നമ്മുടെ പിതാവായ ദൈവം’ എന്നു ചേർക്കാതെ മൂലപാഠത്തിന്റെ കൃത്യത പാലിക്കുന്നു.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശു
  rationale: Χριστός എന്ന അഭിഷിക്തപദവിയുടെ അർഥം കേവല ലിപ്യന്തരണമായി മറയ്ക്കാതെ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു. മലയാളത്തിൽ പദവിയും വ്യക്തിനാമവും സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘-യായ’ ഉപയോഗിച്ചു.
- source_word: σωτῆρος ἡμῶν
  choice: നമ്മുടെ രക്ഷകൻ
  rationale: ലേഖനകാരനെയും വായനക്കാരെയും ഉൾക്കൊള്ളുന്ന ἡμῶν നേരിട്ട് ‘നമ്മുടെ’ എന്നു നൽകുകയും σωτήρ എന്ന പദവി ‘രക്ഷകൻ’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന അർഥം പ്രകടമാക്കുന്നു; പരമ്പരാഗത ലിപ്യന്തരണരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: τοῦ σωτῆρος ἡμῶν എന്നതിന്റെ ബന്ധം
  choice: ‘നമ്മുടെ രക്ഷകൻ’ എന്ന പദവി മശീഹയായ യേശുവിനെ വിശേഷിപ്പിക്കുന്നു
  alternative: സംയോജിതമായ ഉറവിടവാക്യത്തിലാകെ പൊതുവായി കേൾക്കാവുന്ന ആശംസ
  rationale: Χριστοῦ Ἰησοῦ എന്നതിനു പിന്നാലെയുള്ള നിർദേശകപദമുള്ള τοῦ σωτῆρος ἡμῶν വ്യാകരണപരമായി അതിനോടുള്ള സമാനാധികരണമാണ്; അതിനാൽ യേശുവിനെ ‘നമ്മുടെ രക്ഷകൻ’ എന്നു നേരിട്ട് തിരിച്ചറിയുന്ന ഘടന നിലനിർത്തി.
- issue: ക്രിയയില്ലാത്ത ഗ്രീക്ക് ആശംസയുടെ മലയാളരൂപം
  choice: കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ
  alternative: കൃപയും സമാധാനവും
  rationale: ഗ്രീക്കിൽ ആശംസാവാക്യത്തിൽ ക്രിയ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്നു. മലയാളത്തിൽ ആശംസയുടെ സ്വാഭാവികതയ്ക്കായി ‘ഉണ്ടാകട്ടെ’ ചേർത്തത് പുതിയ ദൈവശാസ്ത്രവാദം ഇറക്കുമതി ചെയ്യാതെ അതേ ആശംസാഭാവം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ലേഖനാശംസാശൈലി. ‘തീത്തൊസ്’ എന്ന രൂപം ഗ്രീക്ക് Τίτος-നോട് ചേർന്ന മലയാള ലിപ്യന്തരണമാണ്. ഉറവിടങ്ങളായ രണ്ടു വ്യക്തികളോടും ‘-ൽനിന്നും’ ആവർത്തിച്ച് ചേർത്തത് കൃപയും സമാധാനവും പിതാവായ ദൈവത്തിൽനിന്നും നമ്മുടെ രക്ഷകനായ യേശുവിൽനിന്നും വരുന്നു എന്ന ഗ്രീക്ക് സംയോജനഘടന വ്യക്തമാക്കുന്നു.
