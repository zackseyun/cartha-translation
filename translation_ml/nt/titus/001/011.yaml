id: TIT.1.11
reference: Titus 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: ml
  text: അവരുടെ വായടപ്പിക്കേണ്ടതാണ്[a]. കാരണം, ലജ്ജാകരമായ ലാഭത്തിനുവേണ്ടി പഠിപ്പിക്കാൻ പാടില്ലാത്ത കാര്യങ്ങൾ പഠിപ്പിച്ചുകൊണ്ട് അവർ മുഴുവൻ ഗൃഹസമൂഹങ്ങളെയും തകിടംമറിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ നിശ്ശബ്ദരാക്കേണ്ടതാണ്.”
    reason: lexical_alternative
  - marker: b
    text: “ഗൃഹസമൂഹങ്ങൾ” എന്നത് വീടെന്ന കെട്ടിടത്തെ മാത്രമല്ല, ഒരു വീട്ടിലെ കുടുംബാംഗങ്ങളെയും ആശ്രിതരെയും ഉൾക്കൊള്ളുന്ന കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: അവരുടെ വായടപ്പിക്കേണ്ടതാണ്
  rationale: ബന്ധസർവനാമം മുൻവാക്യത്തിലെ വ്യാജോപദേഷ്ടാക്കളിലേക്കാണ് ചൂണ്ടുന്നത്. ἐπιστομίζειν എന്നതിന്റെ ‘വായ അടയ്ക്കുക’ എന്ന ശക്തമായ രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; പഠിപ്പിക്കൽ തടയണമെന്ന അർഥമാണ് സന്ദർഭത്തിൽ.
- source_word: οἵτινες
  choice: കാരണം ... അവർ
  rationale: ഇവരെ തടയേണ്ടതിന്റെ കാരണം തുടർന്നുള്ള വാക്യഭാഗം വിശദീകരിക്കുന്നു; അതിനാൽ വിശദീകരണബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅλους οἴκους
  choice: കുടുംബങ്ങളെ മുഴുവനായി
  rationale: οἶκος ഇവിടെ കെട്ടിടങ്ങളെക്കാൾ കുടുംബാംഗങ്ങളും ആശ്രിതരും ഉൾപ്പെടുന്ന ഗൃഹസമൂഹങ്ങളെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
- source_word: ἀνατρέπουσιν
  choice: തകിടംമറിക്കുന്നു
  rationale: ‘മറിച്ചിടുക, അസ്ഥിരമാക്കുക, നശിപ്പിക്കുക’ എന്ന ശക്തമായ ആശയം, സമ്പൂർണ നാശം നിർബന്ധമായി പ്രസ്താവിക്കാതെ, സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: διδάσκοντες ἃ μὴ δεῖ
  choice: പഠിപ്പിക്കരുതാത്ത കാര്യങ്ങൾ പഠിപ്പിച്ചുകൊണ്ട്
  rationale: പഠിപ്പിക്കലാണ് കുടുംബങ്ങളെ അസ്ഥിരമാക്കുന്ന മാർഗമെന്ന് കൃതന്തം സൂചിപ്പിക്കുന്നു; μὴ δεῖ ഉള്ള ധാർമിക അനൗചിത്യവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: ലജ്ജാകരമായ ലാഭത്തിനുവേണ്ടി
  rationale: അവരുടെ ഉദ്ദേശ്യം നിന്ദ്യമായ നേട്ടമാണെന്ന നൈതിക വിലയിരുത്തൽ സുതാര്യമായ ആധുനിക ഭാഷയിൽ പകരുന്നു; ലാഭം പണവുമായി ബന്ധപ്പെട്ടിരിക്കാം, എന്നാൽ ഗ്രീക്ക് പദത്തേക്കാൾ ചുരുക്കി ‘പണം’ എന്നു പറയുന്നില്ല.
theological_decisions:
- issue: വ്യാജോപദേഷ്ടാക്കളുടെ വായടപ്പിക്കണമെന്ന നിർദേശത്തിന്റെ സ്വഭാവം
  choice: അവരുടെ വായടപ്പിക്കേണ്ടതാണ്
  alternative: അവരെ നിശ്ശബ്ദരാക്കേണ്ടതാണ്
  rationale: ഗ്രീക്ക് രൂപകം ശക്തമായി നിലനിർത്തുന്നു; എന്നാൽ അത് നടപ്പാക്കേണ്ട ശാരീരികമോ ഭരണപരമോ ആയ പ്രത്യേക രീതി വാക്യം നിർദേശിക്കുന്നില്ല. സന്ദർഭം അവരുടെ ഹാനികരമായ പഠിപ്പിക്കൽ തടയുന്നതിനെക്കുറിച്ചാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വായടപ്പിക്കുക’ എന്ന രൂപകം മൂലത്തിന്റെ ശക്തി സൂക്ഷിക്കുന്നു; ‘തകിടംമറിക്കുക’ കുടുംബജീവിതത്തെ ഗുരുതരമായി അസ്ഥിരമാക്കുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
