id: TIT.1.7
reference: Titus 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: ml
  text: കാരണം, ദൈവത്തിന്റെ കാര്യസ്ഥൻ എന്ന നിലയിൽ ഒരു മേൽനോട്ടക്കാരൻ[a] ആരുടെയും കുറ്റാരോപണത്തിന് ഇടനൽകാത്തവനായിരിക്കണം. അയാൾ തന്നിഷ്ടക്കാരനോ ക്ഷിപ്രകോപിയോ വീഞ്ഞിൽ മുഴുകുന്നവനോ അക്രമിയോ നിന്ദ്യലാഭം കൊതിക്കുന്നവനോ[b] ആയിരിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബിഷപ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം മേൽനോട്ടം വഹിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു; പിൽക്കാല സഭാപദവികളുടെ അർഥം അനാവശ്യമായി ചുമത്താതിരിക്കാനാണ് ഇവിടെ ‘മേൽനോട്ടക്കാരൻ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ‘നാണക്കേടായ ലാഭം കൊതിക്കുന്നവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ധാർമികമായി ലജ്ജാകരമായ വിധത്തിൽ നേടുന്ന ലാഭത്തെയാണ് ഗ്രീക്ക് പദം ഊന്നിപ്പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: ആയിരിക്കണം
  rationale: ആവശ്യകതയും കടമയും സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ നിർദേശത്തിന് ഈ വാക്യം നൽകുന്ന വിശദീകരണബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐπίσκοπον
  choice: മേൽവിചാരകൻ
  rationale: പിന്നീടുണ്ടായ പ്രത്യേക സഭാപദവികളുടെ അർഥം മുൻകൂട്ടി ചുമത്താതെ, മേൽനോട്ടം വഹിക്കുന്ന വ്യക്തി എന്ന ഗ്രീക്ക് പദത്തിന്റെ അടിസ്ഥാന ആശയം നൽകുന്നു.
- source_word: ἀνέγκλητον
  choice: കുറ്റാരോപണത്തിന് ഇടയില്ലാത്തവൻ
  rationale: പൂർണമായ പാപരാഹിത്യം സൂചിപ്പിക്കാതെ, സാധുവായ കുറ്റം ചുമത്താൻ അവസരമില്ലാത്ത നിലയെ വ്യക്തമാക്കുന്നു.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: ദൈവത്തിന്റെ കാര്യസ്ഥൻ എന്ന നിലയിൽ
  rationale: ഏല്പിക്കപ്പെട്ട കാര്യങ്ങൾ ഉത്തരവാദിത്വത്തോടെ കൈകാര്യം ചെയ്യുന്ന οἰκονόμος എന്ന ആശയവും ദൈവത്തോടുള്ള ഉത്തരവാദിത്വവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αὐθάδη
  choice: തന്നിഷ്ടക്കാരൻ
  rationale: സ്വന്തം ഇഷ്ടം പിടിച്ചുനിർത്തുകയും സ്വയം പ്രസാദിപ്പിക്കുകയും ചെയ്യുന്ന ധിക്കാരപരമായ മനോഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ὀργίλον
  choice: ക്ഷിപ്രകോപി
  rationale: ഒറ്റപ്പെട്ട കോപപ്രകടനമല്ല, പെട്ടെന്ന് കോപിക്കുന്ന സ്വഭാവമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: πάροινον
  choice: വീഞ്ഞിൽ മുഴുകുന്നവൻ
  rationale: വീഞ്ഞുമായി ബന്ധപ്പെട്ട അതിരുകടന്ന ശീലം സൂചിപ്പിക്കുന്നു; ‘മദ്യപൻ’ എന്നതുപോലെ വീഞ്ഞിനെ പൊതുവായ മദ്യമായി മാറ്റുകയോ ‘അടിമ’ എന്നു പറഞ്ഞ് ആശയം ശക്തമാക്കുകയോ ചെയ്യുന്നില്ല.
- source_word: πλήκτην
  choice: അക്രമി
  rationale: അടിക്കാനോ ശാരീരികമായി ആക്രമിക്കാനോ പ്രവണനായ വ്യക്തി എന്ന പെരുമാറ്റാർഥം ഇന്നത്തെ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: αἰσχροκερδῆ
  choice: നിന്ദ്യമായ ലാഭം മോഹിക്കുന്നവൻ
  rationale: ലാഭത്തോടുള്ള മോഹവും ആ ലാഭത്തിന്റെ ധാർമികമായി ലജ്ജാകരമായ സ്വഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു; നിയമവിരുദ്ധ സമ്പാദ്യത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: സഭാശുശ്രൂഷാപശ്ചാത്തലത്തിൽ ἐπίσκοπος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മേൽവിചാരകൻ
  alternative: ബിഷപ്പ്
  rationale: ഗ്രീക്ക് പദത്തിന്റെ മേൽനോട്ടം വഹിക്കുന്നവൻ എന്ന അർഥം മുൻനിർത്തുന്നു. പിൽക്കാല സഭാഘടനകളുമായി ബന്ധമുള്ള ഒരു പ്രത്യേക പദവിയെ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ കടമയുടെ ഭാവവും ഗുണദോഷങ്ങളുടെ പട്ടികയും വ്യക്തമായി നിലനിർത്തി. വായനാസൗകര്യത്തിനായി ദീർഘമായ ഗ്രീക്ക് വാക്യം രണ്ടു മലയാളവാക്യങ്ങളാക്കി; ‘അയാൾ’ എന്ന സർവനാമം പട്ടികയുടെ വ്യാകരണബന്ധം വ്യക്തമാക്കുന്നു.
