id: TIT.1.12
reference: Titus 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: ml
  text: 'അവരിൽ ഒരാൾ—അവരുടെ സ്വന്തം പ്രവാചകൻ—പറഞ്ഞു: “ക്രേത്തക്കാർ എപ്പോഴും കള്ളം പറയുന്നവർ, ദുഷ്ട മൃഗങ്ങൾ, മടിയന്മാരായ തീറ്റപ്രിയർ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: അവരിൽ ഒരാൾ ... പറഞ്ഞിട്ടുണ്ട്
  rationale: τις ἐξ αὐτῶν എന്നത് ആ കൂട്ടത്തിൽപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവരിൽ ഒരാൾ’ എന്നത് ഈ ഭാഗികബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു. ഉദ്ധരിക്കപ്പെട്ട വാക്കിന് ഇപ്പോഴും പ്രസക്തിയുണ്ടെന്ന സന്ദർഭഭാവം ‘പറഞ്ഞിട്ടുണ്ട്’ വ്യക്തമാക്കുന്നു.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: അവരുടെ സ്വന്തം പ്രവാചകൻതന്നെ
  rationale: ἴδιος നൽകുന്ന ‘അവർക്കുതന്നെ സ്വന്തമായ/അവരിൽപ്പെട്ട’ എന്ന ഊന്നൽ ‘സ്വന്തം’ എന്നും ‘തന്നെ’ എന്നും ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Κρῆτες
  choice: ക്രേത്തക്കാർ
  rationale: ക്രേത്ത് ദ്വീപിലെ ജനങ്ങളെ സൂചിപ്പിക്കുന്ന ജനനാമം; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക രൂപം.
- source_word: ἀεὶ ψεῦσται
  choice: എപ്പോഴും കള്ളന്മാർ
  rationale: ἀεί എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘എപ്പോഴും’ എന്നും ψεῦσται എന്നതിന്റെ ‘കള്ളം പറയുന്നവർ’ എന്ന ശക്തമായ നാമരൂപത്തിന് യോജിച്ച ‘കള്ളന്മാർ’ എന്നും നിലനിർത്തുന്നു.
- source_word: κακὰ θηρία
  choice: ദുഷ്ടമൃഗങ്ങൾ
  rationale: θηρίαയുടെ മൃഗരൂപകം മയപ്പെടുത്താതെ സൂക്ഷിക്കുകയും κακάയുടെ ധാർമ്മിക നിഷേധഭാവം ‘ദുഷ്ട’ വഴി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: γαστέρες ἀργαί
  choice: മടിയൻ വയറുകൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘മടിയുള്ള/പ്രവർത്തനരഹിതമായ വയറുകൾ’ എന്ന ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു. ഇത് അസാധാരണമായ പ്രയോഗമായതിനാൽ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗലോസ് ഉദ്ധരിക്കുന്ന ഒരു ജനവിഭാഗത്തെക്കുറിച്ചുള്ള കടുത്ത പൊതുപ്രസ്താവന
  choice: ‘അവരുടെ സ്വന്തം പ്രവാചകൻതന്നെ’ എന്നു പറഞ്ഞ് ഉദ്ധരണിയുടെ ഉറവിടം വ്യക്തമായി അടയാളപ്പെടുത്തുകയും അതിലെ കടുത്ത ഭാഷ മയപ്പെടുത്താതിരിക്കുകയും ചെയ്തു.
  alternative: ജനവിഭാഗത്തെക്കുറിച്ചുള്ള വാക്കുകളുടെ കാഠിന്യം കുറച്ച് പരാവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം ഇത് ക്രേത്തക്കാരിൽപ്പെട്ട ഒരാളുടെ വാക്കായി വ്യക്തമായി അവതരിപ്പിക്കുന്നു. വിവർത്തനം ആ ഉദ്ധരണിസന്ദർഭവും വാചകത്തിന്റെ അസ്വസ്ഥമാക്കുന്ന ശക്തിയും ഒരുപോലെ സംരക്ഷിക്കണം; അതിനെ എല്ലാ ക്രേത്തക്കാരെയും കുറിച്ചുള്ള കാലാതീതമായ സിദ്ധാന്തപ്രസ്താവനയായി വികസിപ്പിക്കരുത്.
- issue: γαστέρες ἀργαί എന്ന രൂപകത്തിന്റെ വ്യാഖ്യാനം
  choice: പ്രധാനപാഠത്തിൽ ‘മടിയൻ വയറുകൾ’ എന്ന രൂപകം നിലനിർത്തി, ഉദ്ദേശിക്കുന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: പ്രധാനപാഠത്തിൽ ‘മടിയന്മാരായ തീറ്റപ്രിയർ’ എന്ന വ്യാഖ്യാനപരമായ രൂപം ഉപയോഗിക്കുക.
  rationale: മൂലപാഠത്തിലെ ശരീരരൂപകവും അപമാനത്തിന്റെ കാഠിന്യവും സംരക്ഷിക്കുമ്പോൾ, അടിക്കുറിപ്പ് ആധുനിക വായനക്കാരന് അതിന്റെ സൂചന മനസ്സിലാക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ഉദ്ധരണിയിലെ കടുത്ത, പഴഞ്ചൊല്ലുസ്വഭാവമുള്ള ത്രിപദപ്രയോഗം ചുരുക്കത്തോടെയും സമാന്തരഘടനയോടെയും നിലനിർത്തി. ‘പ്രവാചകൻതന്നെ’ ഉറവിടത്തിന്റെ ആന്തരികതയ്ക്ക് ഊന്നൽ നൽകുന്നു.
