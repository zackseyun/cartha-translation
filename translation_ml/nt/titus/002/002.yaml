id: TIT.2.2
reference: Titus 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: ml
  text: പ്രായമായ പുരുഷന്മാർ മിതശീലരും മാന്യരും ആത്മനിയന്ത്രണമുള്ളവരും വിശ്വാസത്തിലും[a] സ്നേഹത്തിലും സഹിഷ്ണുതയിലും ദൃഢതയുള്ളവരും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വസ്തതയിൽ.” ഗ്രീക്കിലെ πίστις എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് “വിശ്വാസം” എന്നും “വിശ്വസ്തത” എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: പ്രായമായ പുരുഷന്മാർ
  rationale: സഭയിലെ മൂപ്പൻ എന്ന പദവിയെയല്ല, പ്രായത്തിൽ മുതിർന്ന പുരുഷന്മാരെയാണ് ഈ ഗൃഹോപദേശസന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: νηφαλίους
  choice: സമചിത്തർ
  rationale: മദ്യവർജനം എന്ന ചുരുങ്ങിയ അർഥത്തിൽ ഒതുക്കാതെ, ജാഗ്രതയും മിതത്വവും മനസ്സിന്റെ നിയന്ത്രണവും ഉൾക്കൊള്ളുന്ന നൈതിക അർഥം നൽകുന്നു.
- source_word: σεμνούς
  choice: മാന്യർ
  rationale: ബഹുമാനം ഉണർത്തുന്ന ഗൗരവവും ശ്രേഷ്ഠമായ പെരുമാറ്റവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: σώφρονας
  choice: ആത്മനിയന്ത്രണമുള്ളവർ
  rationale: വിവേകപൂർവമായ സ്വയംനിയന്ത്രണം എന്ന ഈ പദത്തിന്റെ നൈതിക ഊന്നൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὑγιαίνοντας
  choice: ഉറപ്പുള്ളവർ
  rationale: അക്ഷരാർഥത്തിലെ ‘ആരോഗ്യമുള്ളവർ’ എന്ന രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന ‘ഉറപ്പുള്ളവർ’ എന്ന പ്രയോഗത്തിലൂടെ വിശ്വാസം, സ്നേഹം, സഹിഷ്ണുത എന്നീ മൂന്നു മേഖലകളിലേക്കും ബന്ധിപ്പിക്കുന്നു.
- source_word: τῇ πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: πίστις എന്നതിന് ഈ സദ്ഗുണപ്പട്ടികയിൽ ‘വിശ്വാസം’ എന്നും ‘വിശ്വസ്തത’ എന്നും അർഥസാധ്യതയുണ്ട്; മുഖ്യപാഠത്തിൽ വിശ്വാസം സ്വീകരിച്ച് മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τῇ ἀγάπῃ
  choice: സ്നേഹത്തിൽ
  rationale: ἀγάπη എന്നതിന് സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാള തർജമ.
- source_word: τῇ ὑπομονῇ
  choice: സഹിഷ്ണുതയിൽ
  rationale: പ്രയാസങ്ങൾക്കിടയിൽ ക്ഷമയോടെ ഉറച്ചുനിൽക്കുന്ന നിലപാടിനെ സൂചിപ്പിക്കുന്നു; സദ്ഗുണത്രയത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: εἶναι
  choice: ആയിരിക്കണം
  rationale: മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ഉപദേശാത്മക ബലം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: സദ്ഗുണപ്പട്ടികയിലെ πίστις എന്നതിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: വിശ്വാസം, സ്നേഹം, സഹിഷ്ണുത എന്ന ത്രയത്തിൽ πίστις ദൈവത്തിലുള്ള വിശ്വാസത്തെയോ വിശ്വസ്തതയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ‘വിശ്വാസം’ ഉപയോഗിക്കുകയും യഥാർഥമായ മറ്റൊരു അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗുണങ്ങളുടെ പട്ടികയിലെ സമാന്തരഘടന നിലനിർത്തിയിരിക്കുന്നു; സഭാപദവിയെ സൂചിപ്പിക്കാത്ത പ്രായപരമായ പരാമർശം വ്യക്തമായി നൽകിയിരിക്കുന്നു.
