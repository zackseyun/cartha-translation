- from: പ്രായമായ പുരുഷന്മാർ സമചിത്തരും മാന്യരും ആത്മനിയന്ത്രണമുള്ളവരും വിശ്വാസത്തിൽ[a], സ്നേഹത്തിൽ, സഹിഷ്ണുതയിൽ ഉറപ്പുള്ളവരുമായിരിക്കണം.
  to: പ്രായമായ പുരുഷന്മാർ മിതശീലരും മാന്യരും ആത്മനിയന്ത്രണമുള്ളവരും വിശ്വാസത്തിലും[a] സ്നേഹത്തിലും സഹിഷ്ണുതയിലും ദൃഢതയുള്ളവരും ആയിരിക്കണം.
