revisions:
- from: ഇക്കാര്യങ്ങൾ സംസാരിക്കുകയും പൂർണ അധികാരത്തോടെ പ്രബോധിപ്പിക്കുകയും ശാസിക്കുകയും ചെയ്യുക. ആരും നിന്നെ അവഗണിക്കരുത്.[a]
