id: TIT.2.15
reference: Titus 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: ml
  text: ഈ കാര്യങ്ങൾ പൂർണ അധികാരത്തോടെ പറയുകയും പ്രബോധിപ്പിക്കുകയും ശാസിക്കുകയും ചെയ്യുക. ആരും നിന്നെ അവഗണിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരും നിന്നെ തുച്ഛമായി കാണരുത്” / “ആരും നിന്നെ വെറുക്കരുത്.”
    reason: περιφρονέω എന്ന പദത്തിന് ‘അവഗണിക്കുക’ എന്നതിനൊപ്പം ഒരാളെ തുച്ഛമായി കാണുക, നിസ്സാരനായി കരുതുക എന്നീ അർഥങ്ങളും സാധുവാണ്.
lexical_decisions:
- source_word: Ταῦτα
  choice: ഇക്കാര്യങ്ങൾ
  rationale: മുൻപുള്ള അധ്യായനിർദേശങ്ങളെയാകെ സൂചിപ്പിക്കുന്ന നപുംസകലിംഗ ബഹുവചന സർവനാമത്തിന്റെ വിശാലമായ സൂചന നിലനിർത്തുന്നു; ‘ഈ ഉപദേശങ്ങൾ’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: λάλει
  choice: സംസാരിക്കുക
  rationale: തുടർച്ചയായ വാചിക അറിയിപ്പിനുള്ള വർത്തമാനകാല ആജ്ഞയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; കൂടുതൽ പ്രത്യേകമായ ‘പഠിപ്പിക്കുക’ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: παρακάλει
  choice: പ്രബോധിപ്പിക്കുക
  rationale: പ്രോത്സാഹിപ്പിക്കുക, പ്രേരിപ്പിക്കുക, ശക്തമായി ആഹ്വാനം ചെയ്യുക എന്നീ അർഥവ്യാപ്തികൾ ഉള്ള പദത്തിന് ഈ ഇടയപരിപാലനസന്ദർഭത്തിൽ നിർദേശാത്മകവും ധാർമികവുമായ ഭാവം നൽകുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἔλεγχε
  choice: ശാസിക്കുക
  rationale: തെറ്റ് വെളിപ്പെടുത്തി തിരുത്തുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ആജ്ഞാരൂപത്തിലുള്ള ഈ ഇടയപരിപാലനസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: പൂർണ അധികാരത്തോടെ
  rationale: ἐπιταγή എന്നതിലെ കല്പന/അധികാരം എന്ന അർഥവും πάσης നൽകുന്ന സമഗ്രതയും സംരക്ഷിക്കുന്നു; വെറും ആജ്ഞാസ്വരം എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: μηδείς
  choice: ആരും ... അരുത്
  rationale: നിഷേധാത്മക ആജ്ഞയിലെ ‘ഒരാളും ഇല്ല’ എന്ന ആശയം സ്വാഭാവിക മലയാള വിലക്കുരൂപത്തിൽ നൽകുന്നു.
- source_word: σου
  choice: നിന്നെ
  rationale: περιφρονείτω എന്ന ക്രിയയോടുള്ള വ്യക്തിപരമായ ബന്ധം മലയാളത്തിൽ നേരിട്ടുള്ള കർമരൂപമായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: περιφρονείτω
  choice: അവഗണിക്കരുത്
  rationale: ഒരാളെ നിസ്സാരനായി കണക്കാക്കി തള്ളിക്കളയുക എന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ശക്തമായ ‘നിന്ദിക്കുക/തുച്ഛീകരിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: μετὰ πάσης ἐπιταγῆς എന്നതിലെ തീത്തൊസിന്റെ ശുശ്രൂഷാധികാരത്തിന്റെ സ്വഭാവം
  choice: സംസാരിക്കൽ, പ്രബോധിപ്പിക്കൽ, ശാസിക്കൽ എന്നിവ പൂർണ അധികാരത്തോടെ നിർവഹിക്കാൻ തീത്തൊസിനോട് ആവശ്യപ്പെടുന്നു.
  alternative: വെറും ആജ്ഞാപകസ്വരത്തിൽ സംസാരിക്കണമെന്നോ അധികാരം സന്ദേശത്തിനുമാത്രമാണെന്നോ വായിക്കാം.
  rationale: ഈ പദസമുച്ചയം ആജ്ഞാക്രിയകളെ സ്വാഭാവികമായി വിശേഷിപ്പിക്കുകയും അവ നിർവഹിക്കേണ്ട പൂർണ ഭാരത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. ‘പൂർണ അധികാരത്തോടെ’ എന്നത് സ്വതന്ത്രമായ വ്യക്തിപരമായ അധികാരം അവകാശപ്പെടാതെ പാഠത്തിലെ ശുശ്രൂഷാപരമായ അധികാരഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂന്ന് ആജ്ഞാക്രിയകളുടെ സമാന്തരഘടനയും അവസാനത്തെ നിഷേധാത്മക ആജ്ഞയും നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
