id: TIT.2.14
reference: Titus 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: ml
  text: നമ്മെ സകല നിയമലംഘനത്തിൽനിന്നും വീണ്ടെടുക്കുകയും, സൽപ്രവൃത്തികളിൽ ഉത്സാഹമുള്ള തനിക്കു സ്വന്തമായ ഒരു ജനത്തെ തനിക്കായി ശുദ്ധീകരിക്കുകയും ചെയ്യേണ്ടതിന് അവൻ നമുക്കുവേണ്ടി തന്നെത്തന്നെ നൽകി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: തന്നെത്തന്നെ നൽകി
  rationale: സ്വമേധയാ സ്വയം സമർപ്പിച്ചതെന്ന ആശയം പ്രതിഫലനസർവനാമത്തിന്റെ ഊന്നലോടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὑπὲρ ἡμῶν
  choice: നമുക്കുവേണ്ടി
  rationale: നമ്മുടെ നന്മയ്ക്കായും നമ്മുടെ പക്ഷത്തായും എന്ന വിശാലമായ അർഥസാധ്യത നിലനിർത്തുന്നു; ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തത്തിലേക്ക് വാചകത്തെ ചുരുക്കുന്നില്ല.
- source_word: ἵνα λυτρώσηται
  choice: വീണ്ടെടുക്കാനും
  rationale: വിലകൊടുത്തുള്ള മോചനത്തിന്റെയും വിടുതലിന്റെയും അർഥധ്വനി മലയാളത്തിലെ പരിചിതവും പ്രസക്തവുമായ ‘വീണ്ടെടുക്കുക’ സൂക്ഷിക്കുന്നു.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: സകല നിയമലംഘനത്തിൽനിന്നും
  rationale: ἀνομίαയുടെ ‘നിയമവിരുദ്ധത/നിയമലംഘനം’ എന്ന പ്രത്യേക അർഥം ‘ദുഷ്ടത’ എന്ന വിശാലപദത്തേക്കാൾ കൃത്യമായി നൽകുകയും πάσης സൂചിപ്പിക്കുന്ന സമഗ്രത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: καθαρίσῃ
  choice: ശുദ്ധീകരിക്കാനും
  rationale: ധാർമികവും ഉടമ്പടിസംബന്ധവുമായ ശുദ്ധീകരണത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἑαυτῷ
  choice: തനിക്കായി
  rationale: ജനത്തെ ശുദ്ധീകരിക്കുന്നത് അവനുവേണ്ടിയും അവനോടുള്ള സ്വന്തബന്ധത്തിനായുമാണെന്ന ദാതൃകാർഥം വ്യക്തമാക്കുന്നു.
- source_word: λαὸν περιούσιον
  choice: തന്റെ സ്വന്തം ജനത്തെ
  rationale: ദൈവത്തിന് പ്രത്യേകമായി സ്വന്തമായ ജനത്തെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപശ്ചാത്തലം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; മറ്റു സാധുവായ അർഥനിറങ്ങൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: സൽപ്രവൃത്തികൾ ചെയ്യുന്നതിൽ ഉത്സാഹമുള്ള
  rationale: നല്ല പ്രവൃത്തികളോടുള്ള തീക്ഷ്ണമായ പ്രതിബദ്ധത സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ സ്വയംനൽകലിൽ ὑπὲρ ἡμῶν എന്നതിന്റെ വ്യാപ്തി
  choice: ‘നമുക്കുവേണ്ടി’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘നമ്മുടെ പക്ഷത്ത്’ അല്ലെങ്കിൽ ‘നമ്മുടെ സ്ഥാനത്ത്’
  rationale: മൂലപദത്തിന് പ്രയോജനാർഥവും ചില സന്ദർഭങ്ങളിൽ പകരക്കാരനായുള്ള അർഥധ്വനിയും ഉണ്ടാകാം. ഈ വാക്യം മാത്രം വ്യക്തമായി നിർവചിക്കാത്ത ഒരു പ്രത്യേക പ്രായശ്ചിത്തവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ വിശാലത നിലനിർത്തുന്നു.
- issue: λαὸν περιούσιον എന്നതിലെ ഉടമ്പടിസംബന്ധമായ സ്വന്തത
  choice: ‘തന്റെ സ്വന്തം ജനത്തെ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘തന്റെ അമൂല്യജനത്തെ’ അല്ലെങ്കിൽ ‘തനിക്കു പ്രത്യേകമായ ജനത്തെ’
  rationale: പഴയനിയമത്തിലെ ദൈവത്തിന് പ്രത്യേകമായി സ്വന്തമായ ജനമെന്ന ഉടമ്പടിഭാഷയെ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; ‘പ്രത്യേക’ എന്ന അവ്യക്തമായ പ്രയോഗം മാത്രം ഉപയോഗിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ഗ്രീക്ക് ലക്ഷ്യവാക്യത്തിന്റെ ഘടന മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിലാക്കി; ‘അവൻ’ എന്ന കർത്താവിനെ അവസാനംവരെ നീട്ടിയെങ്കിലും വീണ്ടെടുപ്പും ശുദ്ധീകരണവും അവന്റെ സ്വയംനൽകലിന്റെ ലക്ഷ്യങ്ങളാണെന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തി.
