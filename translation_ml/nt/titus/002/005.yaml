revisions:
- from: ആത്മനിയന്ത്രണമുള്ളവരും നിർമലരും വീട്ടുകാര്യങ്ങളിൽ അധ്വാനിക്കുന്നവരും[a] ദയയുള്ളവരും സ്വന്തം ഭർത്താക്കന്മാർക്കു കീഴടങ്ങിയിരിക്കുന്നവരും[b] ആയിരിക്കണം; അങ്ങനെ ദൈവവചനം ദുഷിച്ചു പറയപ്പെടാതിരിക്കട്ടെ.[c]
  to: ആത്മനിയന്ത്രണമുള്ളവരും നിർമലരായവരും വീട്ടുജോലികളിൽ ഏർപ്പെട്ടിരിക്കുന്നവരും[a] ദയയുള്ളവരും സ്വന്തം ഭർത്താക്കന്മാർക്കു വിധേയരായിരിക്കുന്നവരും[b] ആയിരിക്കണം; അങ്ങനെ ദൈവവചനം നിന്ദിക്കപ്പെടാതിരിക്കേണ്ടതിന്.[c]
  rationale: മൂലപാഠത്തിന്റെ അർഥപരിധി മാറ്റാതെ, ὑποτασσομένας-ന് കൂടുതൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം സ്വീകരിച്ചു; βλασφημῆται-യുടെ ഉദ്ദേശ്യവാക്യവും അടിക്കുറിപ്പിലെ അക്ഷരാർഥവും തിരുത്തി; οἰκουργούς-ന്റെ ഗൃഹപ്രവൃത്തിഭാവം അധികമായി പരിമിതിപ്പിക്കാതെ വ്യക്തമാക്കി.
