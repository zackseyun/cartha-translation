    rationale: ‘ദുഷിച്ചു പറയപ്പെടാതിരിക്കട്ടെ’ കുറച്ച് അസ്വാഭാവികമാണ്; കൂടാതെ ‘ദൈവദൂഷണത്തിന് ഇരയാകുക’ എന്ന അടിക്കുറിപ്പ് വ്യാഖ്യാനം അക്ഷരാർഥത്തെ കൃത്യമായി നൽകുന്നില്ല. ‘നിന്ദിക്കപ്പെടാതിരിക്കേണ്ടതിന്’ എന്നും ‘ദൂഷിക്കപ്പെടുക’ എന്നും തിരുത്തുന്നത് അർഥവും ഭാഷാസ്വാഭാവികതയും മെച്ചപ്പെടുത്തുന്നു.
  revised_text: ആത്മനിയന്ത്രണമുള്ളവരും നിർമലരായവരും വീട്ടുജോലികളിൽ ഏർപ്പെട്ടിരിക്കുന്നവരും[a] ദയയുള്ളവരും സ്വന്തം ഭർത്താക്കന്മാർക്കു വിധേയരായിരിക്കുന്നവരും[b] ആയിരിക്കണം; അങ്ങനെ ദൈവവചനം നിന്ദിക്കപ്പെടാതിരിക്കേണ്ടതിന്.[c]
