id: TIT.2.5
reference: Titus 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: ml
  text: ആത്മനിയന്ത്രണമുള്ളവരും നിർമലരായവരും വീട്ടുജോലികളിൽ ഏർപ്പെട്ടിരിക്കുന്നവരും[a] ദയയുള്ളവരും സ്വന്തം ഭർത്താക്കന്മാർക്കു വിധേയരായിരിക്കുന്നവരും[b] ആയിരിക്കണം; അങ്ങനെ ദൈവവചനം നിന്ദിക്കപ്പെടാതിരിക്കേണ്ടതിന്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീട്ടിൽ തിരക്കോടെ പ്രവർത്തിക്കുന്നവർ’ അല്ലെങ്കിൽ ‘വീട് കാത്തുസൂക്ഷിക്കുന്നവർ’ എന്നും പരിഭാഷപ്പെടുത്താം. അപൂർവമായ ഗ്രീക്കുപദം വീട്ടിലെ ജോലികളിലും ഉത്തരവാദിത്വങ്ങളിലും ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സ്വന്തം ഭർത്താക്കന്മാർക്കു കീഴടങ്ങിയിരിക്കുന്നവർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘അപകീർത്തിപ്പെടുത്തപ്പെടാതിരിക്കേണ്ടതിന്’ അല്ലെങ്കിൽ ‘ദുഷിച്ചു പറയപ്പെടാതിരിക്കേണ്ടതിന്’ എന്നും പരിഭാഷപ്പെടുത്താം; കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘ദൂഷിക്കപ്പെടാതിരിക്കേണ്ടതിന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: ആത്മനിയന്ത്രണമുള്ളവർ
  rationale: വിവേകപൂർവമായ സ്വയംനിയന്ത്രണത്തെ സൂചിപ്പിക്കുന്ന ഈ പദത്തിന്, ആധുനിക മലയാളത്തിൽ വ്യക്തവും സദ്ഗുണപ്പട്ടികയുടെ സന്ദർഭത്തിന് യോജിച്ചതുമായ പ്രയോഗമാണിത്.
- source_word: ἁγνάς
  choice: നിർമലർ
  rationale: ധാർമികശുദ്ധി ഉൾപ്പെടെയുള്ള വിശാലമായ ശുദ്ധിയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: οἰκουργούς
  choice: വീട്ടുകാര്യങ്ങളിൽ അധ്വാനിക്കുന്നവർ
  rationale: അപൂർവമായ ഈ പദത്തിൽ വീടും ജോലിയും എന്ന ആശയങ്ങൾ ചേർന്നിരിക്കുന്നു. വീട്ടിലെ ഉത്തരവാദിത്വങ്ങളിൽ സജീവമായി പ്രവർത്തിക്കുന്നതിനെ ഇത് പ്രകടമാക്കുന്നു; വീട്ടിൽ ഒതുങ്ങിക്കഴിയണം എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: ἀγαθάς
  choice: ദയയുള്ളവർ
  rationale: പെരുമാറ്റസദ്ഗുണങ്ങളുടെ പട്ടികയിൽ ἀγαθός എന്ന പദത്തിന്റെ ബന്ധപരവും നന്മനിറഞ്ഞതുമായ ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑποτασσομένας
  choice: കീഴടങ്ങിയിരിക്കുന്നവർ
  rationale: ബന്ധത്തിനുള്ളിലെ ക്രമാനുസൃതമായ വിധേയത്വം സൂചിപ്പിക്കുന്ന പങ്കാളിത്തരൂപത്തെ നിലനിർത്തുന്നു; അതിനപ്പുറമുള്ള ഏതെങ്കിലും സമ്പ്രദായപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: സ്വന്തം ഭർത്താക്കന്മാർക്ക്
  rationale: ഗൃഹബന്ധത്തിന്റെ സന്ദർഭത്തിൽ ἀνήρ ഇവിടെ ഭർത്താവ് എന്നർഥത്തിലാണ്. ἰδίοις എന്നത് പരിധി ഓരോരുത്തരുടെയും സ്വന്തം വിവാഹബന്ധത്തിലേക്കു ചുരുക്കുന്നതിനാൽ ‘സ്വന്തം’ നിലനിർത്തി.
- source_word: ἵνα μὴ
  choice: അങ്ങനെ ... -ാതിരിക്കട്ടെ
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: ദൈവത്തിൽനിന്നുള്ള സന്ദേശത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും നേരിട്ടുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: βλασφημῆται
  choice: ദുഷിച്ചു പറയപ്പെടുക
  rationale: ദൈവവചനത്തെക്കുറിച്ച് അപകീർത്തികരമായോ നിന്ദാപരമായോ സംസാരിക്കുന്നതിനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ‘ദൈവദൂഷണം ചെയ്യുക’ എന്നത് ഇവിടെ അനാവശ്യമായി ഇടുങ്ങിയ മതസാങ്കേതിക അർഥം നൽകാം.
theological_decisions:
- issue: οἰκουργούς എന്ന ഗൃഹജോലി സംബന്ധിച്ച പദം സ്ത്രീകളെ വീട്ടിൽ ഒതുക്കണമെന്ന ആശയം അധികമായി ചേർക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: വീട്ടുകാര്യങ്ങളിൽ അധ്വാനിക്കുന്നവർ
  alternative: വീട്ടിൽ തിരക്കോടെ പ്രവർത്തിക്കുന്നവർ; വീടു കാത്തുസൂക്ഷിക്കുന്നവർ
  rationale: പദം ഗൃഹപരമായ ഉൽപാദകപ്രവർത്തനവും ഉത്തരവാദിത്വവും ഊന്നുന്നു. നിർബന്ധിതമായ ഗൃഹപരിധിയോ ഏകാന്തതയോ വാക്യം വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല.
- issue: ὑποτασσομένας എന്ന പദത്തിലെ വിവാഹബന്ധപരമായ ക്രമം സമ്പ്രദായപരമായ വിപുലീകരണമില്ലാതെ നിലനിർത്തൽ
  choice: സ്വന്തം ഭർത്താക്കന്മാർക്കു കീഴടങ്ങിയിരിക്കുന്നവർ
  alternative: സ്വന്തം ഭർത്താക്കന്മാർക്കു വിധേയരായിരിക്കുന്നവർ
  rationale: മൂലപാഠത്തിലെ കീഴടങ്ങൽ എന്ന അവകാശവാദം നിലനിർത്തുകയും ‘സ്വന്തം’ എന്ന പരിധിയിലൂടെ ഇത് വിവാഹബന്ധത്തിലേക്കു മാത്രം ചുരുക്കുകയും ചെയ്യുന്നു; വിശാലമായ ലിംഗാധികാരസിദ്ധാന്തം വാക്യത്തിലേക്കു ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: βλασφημῆται എന്ന പദം ദൈവവചനവുമായി ബന്ധപ്പെട്ടപ്പോൾ എങ്ങനെ നൽകണം
  choice: ദുഷിച്ചു പറയപ്പെടുക
  alternative: നിന്ദിക്കപ്പെടുക; അപകീർത്തിപ്പെടുത്തപ്പെടുക; ദൈവദൂഷണത്തിന് ഇരയാകുക
  rationale: ഇവിടെ ആശയം ദൈവവചനത്തിന്റെ പൊതുമാനത്തിന് പെരുമാറ്റം മൂലം നിന്ദ വരുന്നതാണ്. ‘ദുഷിച്ചു പറയപ്പെടുക’ ഗ്രീക്കിലെ വാചികനിന്ദയുടെ അർഥം നിലനിർത്തുകയും സാങ്കേതികമായ ‘ദൈവദൂഷണം’ എന്നതിലേക്ക് അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സദ്ഗുണപ്പട്ടികാശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ സ്ത്രീലിംഗ ബഹുവചന വിശേഷണങ്ങളെ ‘-വരും’ എന്ന സമാന്തരഘടനയിൽ നിലനിർത്തി; മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന ഉപദേശസ്വഭാവം വ്യക്തമാക്കാൻ ‘ആയിരിക്കണം’ ചേർത്തു. മതസാങ്കേതികത കൂടിയ പദങ്ങൾ പ്രധാനവാചകത്തിൽ ഒഴിവാക്കി, പ്രസക്തമായ അക്ഷരാർഥങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
