id: TIT.2.10
reference: Titus 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: ml
  text: ഒന്നും അപഹരിക്കാതെ, പകരം തികഞ്ഞ വിശ്വസ്തത[a] കാണിച്ച്, എല്ലാക്കാര്യങ്ങളിലും നമ്മുടെ രക്ഷകനായ ദൈവത്തിന്റെ ഉപദേശത്തെ അവർ അലങ്കരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് പദത്തിന് ‘വിശ്വാസം’ എന്നും അർഥമാകാം; ഇവിടെ ‘പൂർണമായ കൂറ്’ അഥവാ ‘സമ്പൂർണ വിശ്വാസ്യത’ എന്ന നൈതിക അർഥമാണ് സാധ്യതയേറിയത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: νοσφιζομένους
  choice: ഒന്നും അപഹരിക്കാതെ
  rationale: മറ്റൊരാളുടേതു തനിക്കായി മാറ്റിവെക്കുകയോ കൈക്കലാക്കുകയോ ചെയ്യുന്നതാണ് ഈ ക്രിയയുടെ സന്ദർഭാർഥം. ‘അപഹരിക്കുക’ മോഷണം, വെട്ടിച്ചെടുക്കൽ, ദുരുപയോഗം എന്നീ സാധ്യതകളെ അനാവശ്യമായി ചുരുക്കാതെ ഉൾക്കൊള്ളുന്നു.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: തികഞ്ഞ വിശ്വസ്തത കാണിച്ച്
  rationale: വീട്ടുദാസന്മാരുടെ പെരുമാറ്റത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ πίστις വിശ്വാസ്യതയെയോ കൂറിനെയോ സൂചിപ്പിക്കുന്നു. πᾶσαν എന്നതിന്റെ സമഗ്രതയും ἀγαθήν എന്നതിന്റെ നല്ലതും സത്യസന്ധവുമായ ഗുണവും ‘തികഞ്ഞ വിശ്വസ്തത’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: κοσμῶσιν
  choice: അലങ്കരിക്കേണ്ടതിന്
  rationale: ഉപദേശത്തിന്റെ സൗന്ദര്യവും ആകർഷണവും നല്ല പെരുമാറ്റത്തിലൂടെ പ്രകടമാക്കുക എന്ന മൂലരൂപകം നിലനിർത്തുന്നു.
- source_word: διδασκαλίαν
  choice: ഉപദേശത്തെ
  rationale: διδασκαλία എന്നത് ഇവിടെ പഠിപ്പിക്കപ്പെടുന്ന ഉപദേശസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സഭാഭാഷയിൽ പരിചിതവുമായ പദമാണിത്.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: നമ്മുടെ രക്ഷകനായ ദൈവത്തിന്റെ
  rationale: ദൈവത്തെ ‘നമ്മുടെ രക്ഷകൻ’ എന്നു വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത മറ്റൊരു തിരിച്ചറിയൽ ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: ἐν πᾶσιν
  choice: എല്ലാക്കാര്യങ്ങളിലും
  rationale: അവരുടെ പെരുമാറ്റത്തിന്റെ സമഗ്ര വ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: നൈതിക സന്ദർഭത്തിലെ πίστις
  choice: പ്രധാനപാഠത്തിൽ ‘വിശ്വസ്തത’
  alternative: ‘വിശ്വാസം’ അഥവാ ‘നല്ല വിശ്വാസം’
  rationale: πίστις എന്ന പദത്തിന് ‘വിശ്വാസം’ എന്നും അർഥമുണ്ടെങ്കിലും, യജമാനന്മാരോടുള്ള ദാസന്മാരുടെ സത്യസന്ധമായ പെരുമാറ്റമാണ് ഇവിടെ പ്രതിപാദ്യം; അതിനാൽ ‘വിശ്വസ്തത’യാണ് സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ചത്. പദത്തിന്റെ വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ‘നമ്മുടെ രക്ഷകനായ ദൈവം’ എന്ന പ്രയോഗത്തിന്റെ സൂചിതൻ
  choice: വാക്യത്തിൽ ഉള്ളതുപോലെ ദൈവത്തെ രക്ഷകൻ എന്നു വിശേഷിപ്പിച്ചു
  alternative: പാസ്റ്ററൽ ലേഖനങ്ങളിലെ വിശാലമായ ക്രിസ്തുശാസ്ത്രപരമായ ഉപയോഗത്തിന്റെ വെളിച്ചത്തിൽ വായിക്കുക
  rationale: ഈ ഉപവാക്യം നേരിട്ട് പറയുന്നതു മാത്രം വിവർത്തനം ചെയ്യുന്നു; ഇവിടെ വ്യക്തമല്ലാത്ത ക്രിസ്തുശാസ്ത്രപരമായ സമീകരണം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അലങ്കരിക്കുക’ എന്ന രൂപകപ്രയോഗം മൂലപാഠത്തോടുള്ള അടുപ്പത്തിനായി നിലനിർത്തിയിരിക്കുന്നു.
