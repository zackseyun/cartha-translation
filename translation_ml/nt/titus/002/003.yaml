id: TIT.2.3
reference: Titus 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: ml
  text: അതുപോലെ, പ്രായമായ സ്ത്രീകൾ പെരുമാറ്റത്തിൽ വിശുദ്ധതയ്ക്കു യോജിച്ചവരും, അപവാദം പറയാത്തവരും, അധികം വീഞ്ഞിന് അടിമകളായവരല്ലാത്തവരും, നന്മ പഠിപ്പിക്കുന്നവരും ആയിരിക്കണം,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: പ്രായമായ സ്ത്രീകൾ
  rationale: മുൻവാക്യത്തിലെ പ്രായമായ പുരുഷന്മാർക്കു സമാന്തരമായി, പ്രായത്തിൽ മുന്നേറിയ സ്ത്രീകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആദരപൂർവവുമായ പ്രയോഗമാണിത്.
- source_word: ὡσαύτως
  choice: അതുപോലെ
  rationale: മുൻവാക്യത്തിലെ ഉപദേശവുമായി ഈ നിർദേശം ബന്ധിപ്പിക്കുന്ന വാക്യഘടകത്തെ ലളിതമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: പെരുമാറ്റത്തിൽ വിശുദ്ധിക്കു യോജിച്ചവർ
  rationale: κατάστημα സൂചിപ്പിക്കുന്ന പുറമേ പ്രകടമാകുന്ന നടപ്പും ഭാവവും, ἱεροπρεπής സൂചിപ്പിക്കുന്ന വിശുദ്ധമായ കാര്യങ്ങൾക്കു യോജിച്ച നിലയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു. വെറും ‘ഭക്തിയുള്ളവർ’ എന്നതിനെക്കാൾ ഗ്രീക്കിന്റെ പ്രത്യേക ഭാവം ഇത് നിലനിർത്തുന്നു.
- source_word: μὴ διαβόλους
  choice: ദൂഷണം പറയാത്തവർ
  rationale: ഇവിടെ διάβολος പിശാചിനെ സൂചിപ്പിക്കുന്ന നാമമല്ല; മറ്റുള്ളവരെക്കുറിച്ച് അപവാദമോ ദൂഷണമോ പറയുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ നൈതിക അർഥം നൽകുന്നു.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: അധികം വീഞ്ഞിന് അടിമപ്പെട്ടുപോകാത്തവർ
  rationale: δουλόω എന്ന പദത്തിലെ അടിമത്തത്തിന്റെയും നിയന്ത്രണവിധേയത്വത്തിന്റെയും രൂപകം നിലനിർത്തുന്നു. perfect passive participle സൂചിപ്പിക്കുന്ന അടിമപ്പെട്ട അവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καλοδιδασκάλους
  choice: നന്മ പഠിപ്പിക്കുന്നവർ
  rationale: ഈ സംയുക്തപദം പഠിപ്പിക്കുന്നതിന്റെ കഴിവിനെയല്ല, പഠിപ്പിക്കുന്ന ഉള്ളടക്കത്തിന്റെ നന്മയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നല്ല അധ്യാപകർ’ എന്ന സാധ്യതയുള്ള തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: വീഞ്ഞിനോടുള്ള ബന്ധം വിവരിക്കുന്ന δουλόω എന്ന അടിമത്ത-രൂപകം
  choice: അടിമപ്പെട്ടുപോകാത്തവർ
  alternative: ആസക്തരാകാത്തവർ
  rationale: ‘ആസക്തി’ ആശയം സന്ദർഭത്തിൽ യോജിച്ചാലും, ഗ്രീക്ക് മൂലപാഠത്തിലെ അടിമത്തത്തിന്റെയും അധീനതയുടെയും ശക്തമായ രൂപകം അതിൽ മങ്ങിപ്പോകും. അതിനാൽ മൂലപാഠത്തിലെ നൈതിക-ആത്മീയ സംഘർഷം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ἱεροπρεπεῖς എന്ന പദത്തിലെ വിശുദ്ധതയോടു യോജിക്കുന്ന ഭാവം
  choice: വിശുദ്ധിക്കു യോജിച്ചവർ
  alternative: ഭക്തിയുള്ളവർ
  rationale: ‘ഭക്തിയുള്ളവർ’ ഉള്ളിലെ മനോഭാവമായി മാത്രം ഗ്രഹിക്കപ്പെടാം; ഗ്രീക്ക് പദം പെരുമാറ്റത്തിലും ഭാവത്തിലും വിശുദ്ധമായ കാര്യങ്ങൾക്കു ചേരുന്ന ഔചിത്യത്തെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പട്ടികാസ്വഭാവമുള്ള ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ തുടർച്ചയായി നിലനിർത്തി. അടിമത്ത-രൂപകവും വിശുദ്ധിക്കു യോജിച്ച പെരുമാറ്റമെന്ന ആശയവും വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു.
