id: TIT.2.13
reference: Titus 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: ml
  text: അനുഗൃഹീതമായ പ്രത്യാശയെയും നമ്മുടെ മഹാനായ ദൈവവും രക്ഷകനുമായ യേശു മശീഹായുടെ മഹിമയുടെ പ്രത്യക്ഷതയെയും നാം കാത്തിരിക്കുമ്പോൾ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സാധ്യത കുറവുള്ള മറ്റൊരു വിവർത്തനം: “മഹാനായ ദൈവത്തിന്റെയും നമ്മുടെ രക്ഷകനായ യേശു മശീഹായുടെയും മഹിമയുടെ പ്രത്യക്ഷത.” ഈ വായനയിൽ ‘ദൈവം’ എന്നും ‘രക്ഷകൻ’ എന്നും രണ്ടു വ്യത്യസ്ത വ്യക്തികളെ സൂചിപ്പിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: നാം കാത്തിരിക്കുമ്പോൾ
  rationale: മുൻവാക്യവുമായി ബന്ധപ്പെടുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടർച്ചയും പ്രതീക്ഷയോടെയുള്ള കാത്തിരിപ്പും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μακαρίαν
  choice: അനുഗൃഹീത
  rationale: അന്ത്യകാല പ്രത്യാശയുടെ ശ്രേഷ്ഠവും ദൈവാനുഗ്രഹപൂർണവുമായ സ്വഭാവം മാന്യമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐλπίδα
  choice: പ്രത്യാശ
  rationale: വെറും ആഗ്രഹമല്ല, ഉറപ്പോടെ പ്രതീക്ഷിക്കുന്ന ഭാവി യാഥാർഥ്യം എന്ന സന്ദർഭാർത്ഥം നൽകുന്ന പതിവ് ബൈബിൾപദം.
- source_word: ἐπιφάνειαν
  choice: പ്രത്യക്ഷമാകുന്നത്
  rationale: ദൃശ്യമായ വെളിപ്പെടലിന്റെ അന്ത്യകാല അർത്ഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; സാങ്കേതികമായ ‘എപ്പിഫനി’ ഒഴിവാക്കുന്നു.
- source_word: δόξης
  choice: മഹത്ത്വം
  rationale: δόξα എന്ന പദത്തിന്റെ ദൈവിക തേജസ്സും മഹിമയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ഗ്രീക്കിലെ ‘മഹത്ത്വത്തിന്റെ പ്രത്യക്ഷത’ എന്ന ബന്ധം ക്രിയാരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: μεγάλου
  choice: മഹാനായ
  rationale: വ്യക്തിയെ വിശേഷിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘വലിയ’ എന്നതിനെക്കാൾ സ്വാഭാവികവും മാന്യവുമായ രൂപം.
- source_word: θεοῦ
  choice: ദൈവം
  rationale: പതിവ് നേരിട്ടുള്ള വിവർത്തനം; ഇവിടെ രക്ഷകൻ എന്ന പദത്തോടൊപ്പം ഏകീകൃതമായ വിശേഷണപദവിയുടെ ഭാഗമാണ്.
- source_word: σωτῆρος
  choice: രക്ഷകൻ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലും മലയാള ക്രൈസ്തവ ഭാഷയിലും സ്ഥാപിതവും സന്ദർഭോചിതവുമായ വിവർത്തനം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹാ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയായതിനാൽ പരമ്പരാഗത ലിപ്യന്തരണത്തിനു പകരം ‘മശീഹാ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘നമ്മുടെ മഹാനായ ദൈവവും രക്ഷകനും’ എന്നത് യേശുവെന്ന ഒരാളെ സൂചിപ്പിക്കുന്നോ, പിതാവിനെയും യേശുവിനെയും എന്നിങ്ങനെ രണ്ടുപേരെ സൂചിപ്പിക്കുന്നോ
  choice: യേശു മശീഹായെ ‘നമ്മുടെ മഹാനായ ദൈവവും രക്ഷകനും’ എന്ന് തിരിച്ചറിയുന്ന ഏകവ്യക്തി വായന
  alternative: ‘മഹാനായ ദൈവത്തിന്റെ മഹത്ത്വവും നമ്മുടെ രക്ഷകനായ യേശു മശീഹായുടെ പ്രത്യക്ഷതയും’ എന്ന ദ്വിവ്യക്തി വായന
  rationale: ഒരൊറ്റ നിർദ്ദേശകപദം നിയന്ത്രിക്കുന്ന രണ്ടു ഏകവചന വ്യക്തിനാമങ്ങൾ (τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν), തുടർന്ന് വരുന്ന Ἰησοῦ Χριστοῦ എന്നിവ സ്വാഭാവികമായി ഒരേ വ്യക്തിയെ തിരിച്ചറിയുന്നു. എങ്കിലും വ്യാകരണപരമായി നിർദ്ദേശിക്കപ്പെട്ടിട്ടുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യഘടനയിലെ ദൈവശാസ്ത്രപരമായ സാന്ദ്രത നിലനിർത്തിക്കൊണ്ട്, ‘മഹത്ത്വത്തിന്റെ പ്രത്യക്ഷത’ എന്നത് മലയാളത്തിൽ വ്യക്തമായ ‘മഹത്ത്വം പ്രത്യക്ഷമാകുന്നത്’ എന്നു നൽകി. വാക്യം മുൻപും പിന്നാലെയും ആശ്രയിക്കുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
