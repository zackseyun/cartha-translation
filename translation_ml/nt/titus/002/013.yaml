revisions:
- from: നമ്മുടെ മഹാനായ ദൈവവും രക്ഷകനുമായ യേശു മശീഹായുടെ മഹത്ത്വം പ്രത്യക്ഷമാകുന്നതെന്ന അനുഗൃഹീത പ്രത്യാശയ്ക്കായി നാം കാത്തിരിക്കുമ്പോൾ[a],
  to: അനുഗൃഹീതമായ പ്രത്യാശയെയും നമ്മുടെ മഹാനായ ദൈവവും രക്ഷകനുമായ യേശു മശീഹായുടെ മഹിമയുടെ പ്രത്യക്ഷതയെയും നാം കാത്തിരിക്കുമ്പോൾ[a],
