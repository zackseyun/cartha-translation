  terminology: ‘ഉപദേശം’ is an appropriate accessible rendering of διδασκαλία, capable of denoting both instruction and its content. The footnote’s ‘സിദ്ധാന്തം’ is a valid lexical alternative for the doctrinal sense of the phrase. The footnote marker is correctly anchored immediately after the relevant phrase.
