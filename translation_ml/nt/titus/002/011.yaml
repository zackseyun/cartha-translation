  text: Ἐπεφάνη γὰρ ἡ χάρις τοῦ ⸀θεοῦ σωτήριος πᾶσιν ἀνθρώποις
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/011.yaml
  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: ml
  text: എന്തെന്നാൽ, എല്ലാ മനുഷ്യർക്കും രക്ഷ നൽകുന്ന ദൈവകൃപ പ്രത്യക്ഷപ്പെട്ടിരിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇങ്ങനെകൂടി പരിഭാഷപ്പെടുത്താം: ‘എല്ലാ മനുഷ്യരെയും രക്ഷിക്കുന്ന ദൈവകൃപ പ്രത്യക്ഷപ്പെട്ടു’ അല്ലെങ്കിൽ ‘രക്ഷ നൽകുന്ന ദൈവകൃപ എല്ലാ മനുഷ്യർക്കും പ്രത്യക്ഷപ്പെട്ടു.’ ‘രക്ഷാകരമായ’ എന്നർഥമുള്ള σωτήριος എന്ന ഗ്രീക്ക് വിശേഷണവും ‘എല്ലാ മനുഷ്യർക്കും’ എന്ന ദാതൃപ്രയോഗവും തമ്മിലുള്ള ബന്ധം അല്പം വ്യത്യസ്തമായി ഗ്രഹിക്കാവുന്നതാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ‘എല്ലാ മനുഷ്യർക്കും’ എന്നത് പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരാശിയെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പരിഭാഷയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: പ്രത്യക്ഷപ്പെട്ടിരിക്കുന്നു
  rationale: ἐπιφαίνω എന്ന ക്രിയയുടെ ഇവിടെ കാണുന്ന അകർമകമായ അർഥം ‘പ്രത്യക്ഷപ്പെട്ടു/വെളിപ്പെട്ടു’ എന്നതാണ്. പൂർത്തിയായ സംഭവത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും പ്രകടമാകുന്ന ഭാവവും ഈ രൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള പ്രബോധനത്തിന് അടിസ്ഥാനമോ വിശദീകരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകമാണ് γάρ; ‘എന്തെന്നാൽ’ ആ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: ദൈവകൃപ
  rationale: χάρις എന്നത് ദൈവത്തിന്റെ അനുഗ്രഹപൂർണമായ കൃപയെയും അതിന്റെ രക്ഷാകരമായ പ്രവർത്തനത്തെയും സൂചിപ്പിക്കുന്നു. ‘ദൈവകൃപ’ സ്വാഭാവികവും പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ചതുമായ സംക്ഷിപ്തരൂപമാണ്.
- source_word: σωτήριος
  choice: രക്ഷ നൽകുന്ന
  rationale: σωτήριος കൃപയെ വിശേഷിപ്പിച്ച് ‘രക്ഷാകരമായത്’ അഥവാ ‘രക്ഷ കൊണ്ടുവരുന്നത്’ എന്ന അർഥം നൽകുന്നു. ‘രക്ഷ നൽകുന്ന’ എന്നത് ആ വിശേഷണത്തിന്റെ പ്രവർത്തനബലം ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πᾶσιν ἀνθρώποις
  choice: എല്ലാ മനുഷ്യർക്കും
  rationale: ἄνθρωποι ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ദാതൃവിഭക്തി σωτήριος എന്നതോടു ചേർന്ന് ആ രക്ഷയുടെ ഗുണഭോക്താക്കളെ ചൂണ്ടിക്കാണിക്കുന്നു; ‘എല്ലാ മനുഷ്യർക്കും’ ഗ്രീക്കിലെ വിശാലത ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: πᾶσιν ἀνθρώποις എന്നതിന്റെ രക്ഷാശാസ്ത്രപരമായ വ്യാപ്തി
  choice: ‘എല്ലാ മനുഷ്യർക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി വാക്യത്തിന്റെ സാർവത്രികമായ വ്യാപ്തി നിലനിർത്തി.
  alternative: ‘എല്ലാത്തരം മനുഷ്യർക്കും’ എന്നു വ്യാഖ്യാനപരമായി ചുരുക്കുക, അല്ലെങ്കിൽ ഓരോ വ്യക്തിയുടെയും അന്തിമരക്ഷ ഇവിടെ ഉറപ്പാക്കുന്നതായി വിപുലീകരിക്കുക.
  rationale: ഗ്രീക്ക് പ്രയോഗം എല്ലാ മനുഷ്യരിലേക്കും വിശാലമായി വിരൽചൂണ്ടുന്നു; എന്നാൽ അത് ഓരോ വ്യക്തിയെയും ഒഴിവില്ലാതെ ഉദ്ദേശിക്കുന്നുവോ വിവിധ വിഭാഗങ്ങളിലുള്ള മനുഷ്യരെ ഉദ്ദേശിക്കുന്നുവോ എന്ന് പരിഭാഷ തന്നെ തീർപ്പാക്കരുത്. അതുപോലെ, കൃപയുടെ പ്രത്യക്ഷതയും അന്തിമരക്ഷയുടെ പ്രയോഗവും തമ്മിലുള്ള ബന്ധത്തെക്കുറിച്ച് ഒരു പ്രത്യേക സിദ്ധാന്തം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: σωτήριος എന്ന വിശേഷണവും πᾶσιν ἀνθρώποις എന്ന ദാതൃപ്രയോഗവും തമ്മിലുള്ള ബന്ധം
  choice: ‘എല്ലാ മനുഷ്യർക്കും രക്ഷ നൽകുന്ന’ എന്ന് കൃപയെ വിശേഷിപ്പിക്കുന്നതായി മുഖ്യവാചകത്തിൽ നൽകി.
  alternative: ‘രക്ഷ നൽകുന്ന ദൈവകൃപ എല്ലാ മനുഷ്യർക്കും പ്രത്യക്ഷപ്പെട്ടു’ അല്ലെങ്കിൽ ‘എല്ലാ മനുഷ്യരെയും രക്ഷിക്കുന്ന ദൈവകൃപ പ്രത്യക്ഷപ്പെട്ടു.’
  rationale: σωτήριος വ്യാകരണപരമായി ‘കൃപ’യെ വിശേഷിപ്പിക്കുന്നു; ദാതൃപ്രയോഗം ഗുണഭോക്താവിനെയോ ദിശയെയോ സൂചിപ്പിക്കാം. മുഖ്യപരിഭാഷ ഏറ്റവും സ്വാഭാവികമായ ബന്ധം നൽകുന്നു; മറ്റു സാധ്യമായ ഘടനകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘കൃപ,’ ‘രക്ഷ,’ ‘പ്രത്യക്ഷപ്പെട്ടിരിക്കുന്നു’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സ്വാഭാവികമാക്കി. ദൈവശാസ്ത്രപരമായ വ്യാപ്തി വിശദീകരിച്ച് തീർപ്പാക്കാതെ ഗ്രീക്കിലെ തുറന്ന നില സംരക്ഷിച്ചു.
