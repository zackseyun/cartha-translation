  text: Τοὺς νεωτέρους ὡσαύτως παρακάλει σωφρονεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/006.yaml
  text: Likewise[b][a], urge the younger men to be self-controlled.
translation:
  language: ml
  text: അതുപോലെ, യുവാക്കളെ ആത്മനിയന്ത്രണം പാലിക്കാൻ പ്രബോധിപ്പിക്കുക.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യുവാക്കളെ” എന്നത് ഇവിടെ യുവപുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; യുവജനങ്ങളെ പൊതുവായി അല്ല.
    reason: lexical_alternative
  - marker: b
    text: “ആത്മനിയന്ത്രണം പാലിക്കാൻ” എന്നതിന് “വിവേകത്തോടെ പെരുമാറാൻ” അല്ലെങ്കിൽ “സുബോധമുള്ളവരായിരിക്കാൻ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം സുബോധത്തോടെയുള്ള വിവേചനവും ശിക്ഷണപരമായ ആത്മനിയന്ത്രണവും ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: പ്രായം കുറഞ്ഞ പുരുഷന്മാർ
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ട ആർട്ടിക്കിളോടുകൂടിയ പുൽലിംഗ ബഹുവചനം ഈ സന്ദർഭത്തിൽ പ്രായം കുറഞ്ഞ പുരുഷന്മാരെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു. 'യുവാക്കൾ' എന്നതിനെക്കാൾ പ്രായവ്യത്യാസം വ്യക്തമാക്കുകയും ലിംഗസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὡσαύτως
  choice: അതുപോലെ
  rationale: മുൻപുള്ള സമാന്തര നിർദേശങ്ങളുമായുള്ള ബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: παρακάλει
  choice: പ്രബോധിപ്പിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ ഉദ്ബോധനസ്വഭാവം വ്യക്തമാക്കുന്നു; വെറും പ്രോത്സാഹനത്തേക്കാൾ ശക്തവും ആധുനിക മലയാളത്തിൽ മാന്യവുമാണ്.
- source_word: σωφρονεῖν
  choice: ആത്മനിയന്ത്രണമുള്ളവരായിരിക്കാൻ
  rationale: ഈ ക്രിയയിൽ ഉൾക്കൊള്ളുന്ന സുബോധം, വിവേകം, നിയന്ത്രിതമായ പെരുമാറ്റം എന്നീ ആശയങ്ങളിൽ സന്ദർഭത്തിന് പ്രധാനമായ ആത്മനിയന്ത്രണം വ്യക്തമായി നൽകുന്നു; മറ്റു അർത്ഥഛായകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: νεωτέρους എന്നതിലെ ലിംഗസൂചന
  choice: പ്രായം കുറഞ്ഞ പുരുഷന്മാരെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു
  alternative: പ്രായം കുറഞ്ഞ ആളുകളെ പൊതുവായി സൂചിപ്പിക്കുന്നു
  rationale: ഉടൻമുമ്പും ശേഷവും പ്രായവും ലിംഗവും അനുസരിച്ച് വേർതിരിച്ച വിഭാഗങ്ങളോടാണ് നിർദേശങ്ങൾ നൽകുന്നത്. അതിനാൽ മൂലപാഠത്തിലെ പുൽലിംഗസൂചന പൊതുവാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പ്രായവും ലിംഗവും സംബന്ധിച്ച മൂലപാഠത്തിന്റെ കൃത്യത നിലനിർത്തി; പ്രധാന വാക്യം ലളിതമായി സൂക്ഷിച്ച് σωφρονεῖν എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകി.
