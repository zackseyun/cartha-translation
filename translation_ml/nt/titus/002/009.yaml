source:
  edition: SBLGNT
  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: ml
  text: അടിമകൾ[a] സ്വന്തം യജമാനന്മാർക്ക് എല്ലാ കാര്യങ്ങളിലും കീഴടങ്ങുകയും, അവരെ പ്രസാദിപ്പിക്കുന്നവരായിരിക്കുകയും, എതിർത്തു സംസാരിക്കാതിരിക്കുകയും[b] വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദാസന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് doulous എന്ന പദം സേവനത്തിലുള്ളവരെയും സൂചിപ്പിക്കാം, എന്നാൽ ഈ സന്ദർഭത്തിൽ ബന്ധിതമായ അടിമനിലയാണ് സാധ്യതയേറിയത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘തിരിച്ചുപറയാതിരിക്കുകയും’ അല്ലെങ്കിൽ ‘ഖണ്ഡിക്കാതിരിക്കുകയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: അടിമകൾ
  rationale: ഈ ഗൃഹക്രമസന്ദർഭത്തിൽ δεσπόταις എന്ന പദത്തോടുള്ള ബന്ധം ബന്ധിതമായ സാമൂഹിക നിലയെ സൂചിപ്പിക്കുന്നതിനാൽ, അതിനെ മയപ്പെടുത്തി ‘ദാസന്മാർ’ എന്നു പറയാതെ ‘അടിമകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἰδίοις δεσπόταις
  choice: സ്വന്തം യജമാനന്മാർക്ക്
  rationale: ἰδίοις എന്നതിലെ സ്വന്തബന്ധവും δεσπόταις എന്നതിലെ ഉടമസ്ഥാധികാരവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑποτάσσεσθαι
  choice: കീഴടങ്ങുകയും
  rationale: നിർദേശാത്മകമായ ഈ വാക്യത്തിൽ അധികാരത്തിന് വിധേയരായിരിക്കേണ്ട നിലയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐν πᾶσιν
  choice: എല്ലാ കാര്യങ്ങളിലും
  rationale: പ്രയോഗത്തിന്റെ വിശാലമായ പരിധി ചുരുക്കാതെ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὐαρέστους εἶναι
  choice: അവർക്ക് പ്രസാദകരായിരിക്കുകയും
  rationale: ‘പ്രസാദകരായിരിക്കുക/സ്വീകാര്യരായിരിക്കുക’ എന്ന അർഥം നൽകുന്ന εὐάρεστος ഇവിടെ യജമാനന്മാരോടുള്ള പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: μὴ ἀντιλέγοντας
  choice: എതിർത്തു സംസാരിക്കാതിരിക്കുകയും
  rationale: ἀντιλέγω എന്നതിലെ ‘തിരിച്ചുപറയുക, എതിർത്തുപറയുക, ഖണ്ഡിക്കുക’ എന്നീ സാധ്യതകളെ അതിയായി സംസാരഭാഷാപരമാക്കാതെ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ഗൃഹക്രമസന്ദർഭത്തിലെ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: യജമാനന്റെ അധികാരത്തിനും ഉടമസ്ഥതയ്ക്കും കീഴിലുള്ള യഥാർഥ ബന്ധിത സാമൂഹികാവസ്ഥയാണ് ഇവിടെ പ്രധാനമായും സൂചിപ്പിക്കുന്നത്. ‘അടിമകൾ’ എന്ന പരിഭാഷ ആ യാഥാർഥ്യത്തെ മറച്ചുവയ്ക്കുന്നില്ല; അതേസമയം ഈ പരിഭാഷ അടിമത്തത്തെ അംഗീകരിക്കുന്നു എന്ന അർഥവും നൽകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. അനന്തക്രിയകളുടെ നിര മലയാളത്തിലെ സമാന്തരമായ ‘-ുകയും’ ഘടനയിൽ നിലനിർത്തി. മൂലത്തിലെ സാമൂഹിക യാഥാർഥ്യം മയപ്പെടുത്താതെയും അതിനെ അനുകൂലിക്കുന്ന വ്യാഖ്യാനം ചേർക്കാതെയും പരിഭാഷപ്പെടുത്തി.
