    issue: കലർപ്പില്ലായ്മ for ἀφθορίαν
    rationale: This wording chiefly means freedom from admixture and can suggest an overly specific image. In this instructional context, ‘നിർമലത’ naturally conveys purity while allowing the accompanying note to retain the broader sense of incorruptibility/integrity.
  - severity: low
    issue: മാന്യത for σεμνότητα
    rationale: ‘മാന്യത’ may be understood as respectability, propriety, or politeness. ‘ഗൗരവം’ more directly conveys the dignified seriousness denoted by σεμνότης.
