  yaml_path: translation/nt/titus/003/004.yaml
  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: ml
  text: എന്നാൽ നമ്മുടെ രക്ഷകനായ ദൈവത്തിന്റെ ദയയും മനുഷ്യരോടുള്ള സ്നേഹവും വെളിപ്പെട്ടപ്പോൾ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മനുഷ്യവർഗത്തോടുള്ള സ്നേഹം’; ഗ്രീക്ക് പദം മനുഷ്യരോടുള്ള ഉപകാരതത്പരതയെയോ സ്നേഹത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: എന്നാൽ ...പ്പോൾ
  rationale: ὅτε എന്നതിന്റെ കാലസൂചന ‘പ്പോൾ’ കൊണ്ടും, δέ സൂചിപ്പിക്കുന്ന മുൻവിവരണത്തിൽനിന്നുള്ള മൃദുവായ വ്യത്യാസമോ വഴിത്തിരിവോ ‘എന്നാൽ’ കൊണ്ടും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: χρηστότης
  choice: ദയ
  rationale: ബന്ധപരമായ നന്മ, കരുണാപൂർവമായ പെരുമാറ്റം, ദയ എന്നിവ സൂചിപ്പിക്കുന്ന പദമാണിത്. φιλανθρωπίαയിൽനിന്ന് അർത്ഥവ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന തിരഞ്ഞെടുപ്പാണ് ‘ദയ’.
- source_word: φιλανθρωπία
  choice: മനുഷ്യരോടുള്ള സ്നേഹം
  rationale: മനുഷ്യരോടുള്ള സ്നേഹപൂർവമായ മനോഭാവമോ ഉപകാരതത്പരതയോ ആണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്. ‘മനുഷ്യരോടുള്ള സ്നേഹം’ അതിന്റെ അർത്ഥം വ്യക്തമായി നൽകുകയും ‘മാനവികത’ എന്ന പദത്തിനുള്ള ആധുനിക സാങ്കേതികമോ ആശയപരമോ ആയ അർത്ഥങ്ങൾ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπεφάνη
  choice: വെളിപ്പെട്ടു
  rationale: പ്രത്യക്ഷമാകുക, പ്രകടമാകുക എന്ന പ്രകടനാർഥം സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ഗുണങ്ങൾ രക്ഷാപ്രവർത്തനത്തിൽ ദൃശ്യമായതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; പ്രകടനത്തിന്റെ രീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: നമ്മുടെ രക്ഷകനായ ദൈവത്തിന്റെ
  rationale: മുഴുവൻ ഷഷ്ഠീവാക്യം മുൻപുള്ള ‘ദയ’, ‘സ്നേഹം’ എന്നീ രണ്ടു നാമങ്ങളെയും വിശേഷിപ്പിക്കുന്നു. ‘നമ്മുടെ രക്ഷകനായ ദൈവം’ എന്ന രൂപം θεοῦ-നെ ‘രക്ഷകൻ’ എന്നു വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നമ്മുടെ രക്ഷകനായ ദൈവം’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: വാക്യം പറയുന്നതുപോലെ ദൈവത്തെ ‘നമ്മുടെ രക്ഷകൻ’ എന്നു വിളിച്ച്, വ്യക്തിയെ വിവർത്തനത്തിൽ കൂടുതൽ നിർണ്ണയിക്കാതെ നിലനിർത്തുന്നു.
  alternative: ഈ വാക്യത്തിൽ പിതാവായ ദൈവത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നുവെന്ന് വ്യാഖ്യാനിച്ച് വിവർത്തനത്തിൽ വ്യക്തമാക്കുക.
  rationale: പാസ്റ്ററൽ ലേഖനങ്ങളിൽ ഈ വിശേഷണം സാധാരണയായി പിതാവായ ദൈവത്തെ സൂചിപ്പിക്കുകയും 6-ാം വാക്യം യേശുക്രിസ്തുവിനെ വേർതിരിച്ച് പരാമർശിക്കുകയും ചെയ്യുന്നു. എങ്കിലും മൂലവാക്യം ഇവിടെ ‘പിതാവ്’ എന്ന് ചേർക്കാത്തതിനാൽ വിവർത്തനം ആ പദം ഇറക്കുമതി ചെയ്യാതെ, ദൈവശാസ്ത്രപരമായ ഭാരംയും സന്ദർഭപരമായ വ്യത്യാസവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ‘ദയ’യും ‘മനുഷ്യരോടുള്ള സ്നേഹം’യും ചേർത്ത് അടുത്ത അർത്ഥമുള്ള രണ്ടു ഗ്രീക്ക് നാമങ്ങളുടെ വ്യത്യാസം നിലനിർത്തി. ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന കാലവാക്യമായതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം കോമ നിലനിർത്തി.
