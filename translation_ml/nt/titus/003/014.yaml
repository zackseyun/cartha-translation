- from: നമ്മുടെ ആളുകളും അത്യാവശ്യങ്ങൾ നിറവേറ്റുന്നതിനായി സൽപ്രവൃത്തികളിൽ ഏർപ്പെടാൻ പഠിക്കട്ടെ[a][b][c]. അങ്ങനെ അവർ ഫലമില്ലാത്തവരായിരിക്കുകയില്ല.
