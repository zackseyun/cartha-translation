    rationale: ἵνα μὴ ὦσιν ἄκαρποι means ‘so that they may not be unfruitful.’ “അങ്ങനെ അവർ ഫലമില്ലാത്തവരായിരിക്കുകയില്ല” means more nearly ‘thus they will not be unfruitful.’
  - severity: low
    issue: Footnote anchors are accumulated after “പഠിക്കട്ടെ” instead of attached to their corresponding expressions.
    rationale: Marker a belongs with “നമ്മുടെ ആളുകളും,” b with the rendering of προΐστασθαι, and c with the expression for necessary/urgent needs. Correct placement improves auditability without changing meaning.
