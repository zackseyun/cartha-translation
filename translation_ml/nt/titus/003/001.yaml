id: TIT.3.1
reference: Titus 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: ml
  text: ഭരണകർത്താക്കൾക്കും അധികാരികൾക്കും വിധേയരായിരിക്കാനും[a] അവരെ അനുസരിക്കാനും, എല്ലാ നല്ല പ്രവൃത്തിക്കും സന്നദ്ധരായിരിക്കാനും അവരെ ഓർമിപ്പിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഭരണകർത്താക്കൾക്കും അധികാരികൾക്കും കീഴടങ്ങാനും അവരെ അനുസരിക്കാനും.’'
    reason: ‘വിധേയരായിരിക്കുക’ എന്നതിന് ‘കീഴടങ്ങുക’ എന്ന സാധ്യമായ പദപരമായ ബദൽ; രണ്ടു ക്രിയകളും ഭരണകർത്താക്കളെയും അധികാരികളെയും സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: ഓർമിപ്പിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം തീത്തോസ് ഇത് തുടർച്ചയായി ചെയ്യണമെന്ന ആശയം ഉൾക്കൊള്ളുന്നു. മലയാളത്തിൽ ‘ഓർമിപ്പിക്കുക’ സ്വാഭാവികമാണ്; ആവർത്തനഭാവം സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാം.
- source_word: αὐτοὺς
  choice: അവരെ
  rationale: തീത്തോസിലൂടെ അഭിസംബോധന ചെയ്യപ്പെടുന്ന വിശ്വാസികളെ സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമം നേരിട്ട് പകർത്തുന്നു.
- source_word: ἀρχαῖς
  choice: ഭരണകർത്താക്കൾ
  rationale: ഇവിടെ പ്രാപഞ്ചികമോ ആത്മികമോ ആയ ശക്തികളല്ല, പൗരഭരണത്തിൽ നേതൃത്വം വഹിക്കുന്നവരാണ് ഉദ്ദേശ്യം. ‘ഭരണകർത്താക്കൾ’ അതിന്റെ വ്യക്തിപരവും ഭരണപരവുമായ അർഥം നൽകുന്നു.
- source_word: ἐξουσίαις
  choice: അധികാരികൾ
  rationale: ἀρχαῖς എന്ന പദത്തോടൊപ്പം ഭരണാധികാരം വഹിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു. രണ്ടു ഗ്രീക്ക് പദങ്ങളെയും ഒറ്റ പദമായി ലയിപ്പിക്കാതെ ‘ഭരണകർത്താക്കളും അധികാരികളും’ എന്ന ഇരട്ടപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ὑποτάσσεσθαι
  choice: വിധേയരായിരിക്കാനും
  rationale: ക്രമീകൃതമായ കീഴ്പെടൽ അഥവാ അധീനത അംഗീകരിക്കൽ എന്ന ആശയം നൽകുന്നു; നിരുപാധികമായ അടിമത്തം ധ്വനിപ്പിക്കാതെ പൗരബന്ധത്തിന് യോജിക്കുന്നു.
- source_word: πειθαρχεῖν
  choice: അനുസരിക്കാനും
  rationale: അധികാരത്തിലുള്ളവരുടെ നിർദേശങ്ങൾ അനുസരിക്കുക എന്ന ക്രിയാത്മക ഭാവം ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: എല്ലാ നല്ല പ്രവൃത്തിക്കും
  rationale: ഏതൊരു നന്മപ്രവൃത്തിയിലേക്കുമുള്ള സന്നദ്ധതയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἑτοίμους εἶναι
  choice: സന്നദ്ധരായിരിക്കാനും
  rationale: നന്മ ചെയ്യാൻ ഒരുക്കമുള്ള നിലയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗരഭരണസംവിധാനങ്ങളോടുള്ള വിധേയത്വത്തിന്റെ പരിധി
  choice: ഭരണകർത്താക്കൾക്കും അധികാരികൾക്കും വിധേയരായി അവരെ അനുസരിക്കണമെന്ന പൊതുവായ പ്രബോധനമായി പരിഭാഷപ്പെടുത്തി; എല്ലാ സാഹചര്യങ്ങളിലും നിരുപാധിക അനുസരണം വേണമെന്ന ആശയം കൂട്ടിച്ചേർത്തിട്ടില്ല.
  alternative: ഭരണാധികാരികളോടുള്ള നിരുപാധിക അനുസരണം ആവശ്യപ്പെടുന്നതായി കൂടുതൽ ശക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: സന്ദർഭത്തിൽ ἀρχαῖς, ἐξουσίαις എന്നീ പദങ്ങൾ പൗരഭരണാധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്. എന്നാൽ അനുസരണത്തിന്റെ പരിധിയെക്കുറിച്ചുള്ള വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കാതെ, മൂലപാഠത്തിലെ പ്രബോധനവും അതിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ഗൗരവമുള്ള പ്രബോധനശൈലി. ‘വിധേയരായിരിക്കുക’, ‘സന്നദ്ധരായിരിക്കുക’ എന്നീ പദങ്ങൾ സഭാപരമായ അതിരുകടന്ന സാങ്കേതികത ഒഴിവാക്കി മൂലപാഠത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു.
