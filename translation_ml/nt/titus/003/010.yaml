    text: അഥവാ “വിഭാഗീയനായ”; പരമ്പരാഗത പരിഭാഷകളിൽ “വേദവിരുദ്ധനായ ഒരാൾ.” ഗ്രീക്ക് പദം ഇവിടെ വിഭാഗീയമായ ഭിന്നിപ്പ് സൃഷ്ടിക്കുന്ന ഒരാളെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
