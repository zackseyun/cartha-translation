lexical_decisions:
- source_word: αἱρετικὸν
  choice: ഭിന്നിപ്പുണ്ടാക്കുന്ന
  rationale: കൊയ്നേ ഗ്രീക്കിലെ പദം പിൽക്കാലത്തെ സാങ്കേതിക അർഥത്തിലുള്ള ‘വേദവിരുദ്ധൻ’ എന്നതിലുപരി കക്ഷിഭേദമോ വിഭാഗീയതയോ സൃഷ്ടിക്കുന്നവനെ ഇവിടെ സൂചിപ്പിക്കുന്നു. ‘ഭിന്നിപ്പുണ്ടാക്കുന്ന’ എന്നത് ആ സാമൂഹിക ഫലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἄνθρωπον
  choice: ഒരാളെ
  rationale: ഇവിടെ ഒരു വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്ക് രൂപം പുല്ലിംഗ ഏകവചനമാണെങ്കിലും പ്രസക്തിയിൽ പൊതുവായ വ്യക്തിസൂചനയായതിനാൽ മലയാളത്തിലെ സ്വാഭാവികവും ലിംഗനിരപേക്ഷവുമായ ‘ഒരാളെ’ യോജിക്കുന്നു.
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: ഒന്നാമത്തെയും രണ്ടാമത്തെയും മുന്നറിയിപ്പുകൾക്കുശേഷം
  rationale: നടപടി സ്വീകരിക്കുന്നതിനു മുമ്പ് രണ്ടു ഘട്ടങ്ങളിലായി തിരുത്തൽ ലക്ഷ്യമാക്കിയ മുന്നറിയിപ്പ് നൽകണമെന്ന ക്രമം ഈ പ്രയോഗം നിലനിർത്തുന്നു. νουθεσίαയുടെ ശാസനാത്മകവും തിരുത്തൽ ലക്ഷ്യമാക്കിയതുമായ ശക്തി ‘മുന്നറിയിപ്പ്’ വ്യക്തമാക്കുന്നു.
- source_word: παραιτοῦ
  choice: തള്ളിക്കളയുക
  rationale: ബന്ധമോ അംഗീകാരമോ നിരസിക്കുന്ന നിർണായക നടപടിയാണ് മധ്യപ്രയോഗത്തിലുള്ള ആജ്ഞ സൂചിപ്പിക്കുന്നത്. ‘ഒഴിവാക്കുക’ എന്നതിനെക്കാൾ ശക്തമായും ‘യാതൊരു ബന്ധവും പുലർത്തരുത്’ എന്ന വിപുലീകരണത്തെക്കാൾ സംക്ഷിപ്തമായും ഇത് അർഥം നൽകുന്നു.
theological_decisions:
- issue: αἱρετικὸν എന്ന പദം പിൽക്കാല സഭാപരമായ ‘വേദവിരുദ്ധൻ’ എന്ന സാങ്കേതിക ഭാഷയിൽ പരിഭാഷപ്പെടുത്തണമോ, അതോ ഒന്നാം നൂറ്റാണ്ടിലെ വിഭാഗീയത സൃഷ്ടിക്കുന്നവൻ എന്ന സാധ്യതയുള്ള അർഥത്തിൽ നൽകണമോ
  choice: ഭിന്നിപ്പുണ്ടാക്കുന്ന
  alternative: വിഭാഗീയനായ; പരമ്പരാഗത പരിഭാഷകളിൽ ‘വേദവിരുദ്ധനായ’
  rationale: തുടർച്ചയായ തിരുത്തലുകൾക്കുശേഷവും നിലപാട് മാറ്റാത്ത ഒരാളോടുള്ള സഭാസമൂഹത്തിന്റെ നടപടിയാണ് വാക്യത്തിന്റെ വിഷയം. ‘ഭിന്നിപ്പുണ്ടാക്കുന്ന’ എന്നത് പ്രസക്തിയിലെ സാധ്യതയേറിയ അർഥം നിലനിർത്തുകയും പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രവിഭാഗം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘തള്ളിക്കളയുക’ നിർണായകമായ നിരസനം അറിയിക്കുന്നു; എന്നാൽ അതിന്റെ സ്ഥാപനപരമായ കൃത്യരൂപം പാഠം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല. പ്രധാന പാഠത്തിലെ [a] അടയാളം പദത്തിന്റെ ചരിത്രപരവും സന്ദർഭപരവുമായ വിവർത്തനവികല്പങ്ങളുള്ള അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
