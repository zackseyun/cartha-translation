revisions:
- from: ആരെയും ദുഷിക്കാതെയും[a] കലഹിക്കാതെയും സൗമ്യരായും എല്ലാവരോടും പൂർണമായ സൗമ്യത കാണിച്ചും ഇരിക്കണം.
  to: ആരെയും നിന്ദിക്കാതെയും, കലഹിക്കാത്തവരും വിട്ടുവീഴ്ചയുള്ളവരും ആയിരിക്കണം; എല്ലാവരോടും സകല സൗമ്യതയും കാണിക്കണം.
  rationale: The revision more accurately renders βλασφημεῖν as interpersonal maligning, gives ἀμάχους and ἐπιεικεῖς distinct and natural Malayalam expressions, and uses clearer coordinated syntax. ‘സകല സൗമ്യതയും’ preserves the comprehensive force of πᾶσαν while ‘എല്ലാവരോടും’ retains the universal, gender-inclusive sense of πάντας ἀνθρώπους. The existing footnote anchor remains attached to the revised first expression.
