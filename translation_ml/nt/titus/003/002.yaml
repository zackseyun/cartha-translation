id: TIT.3.2
reference: Titus 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: ml
  text: ആരെയും നിന്ദിക്കാതെയും, കലഹിക്കാത്തവരും വിട്ടുവീഴ്ചയുള്ളവരും ആയിരിക്കണം; എല്ലാവരോടും സകല സൗമ്യതയും കാണിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηδένα βλασφημεῖν
  choice: ആരെയും ദുഷിക്കാതെയും
  rationale: മനുഷ്യരെ സംബന്ധിക്കുന്ന ഈ ധാർമിക സന്ദർഭത്തിൽ βλασφημεῖν എന്നത് അപകീർത്തിപ്പെടുത്തുന്നതും അധിക്ഷേപിച്ചു സംസാരിക്കുന്നതും ഉൾപ്പെടുന്ന വിശാലമായ അർഥം നൽകുന്നു. ‘ദുഷിക്കുക’ ഈ പരിധി സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀμάχους εἶναι
  choice: കലഹിക്കാതെയും ... ഇരിക്കണം
  rationale: യുദ്ധത്തിനോ വഴക്കിനോ തുനിയാത്ത സ്വഭാവമാണ് ἄμαχος സൂചിപ്പിക്കുന്നത്. ‘കലഹിക്കാതിരിക്കുക’ അതിന്റെ നിഷേധരൂപവും പ്രായോഗിക ധാർമിക ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ἐπιεικεῖς
  choice: സൗമ്യരായും
  rationale: ἐπιεικής എന്നത് സൗമ്യത, വിട്ടുവീഴ്ച, പരിഗണന, ന്യായബോധം എന്നിവയുടെ അർഥവ്യാപ്തിയുള്ളതാണ്. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രധാന സമാനപദമായി ‘സൗമ്യർ’ തിരഞ്ഞെടുത്തു.
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: പൂർണമായ സൗമ്യത കാണിച്ചും
  rationale: πᾶσαν എന്ന സമഗ്രതയുടെ ഊന്നൽ ‘പൂർണമായ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; πραΰτης താഴ്മയോടുകൂടിയ മൃദുത്വത്തെയും സൗമ്യതയെയും സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: എല്ലാവരോടും
  rationale: ἄνθρωποι ഇവിടെ ലിംഗഭേദമില്ലാതെ സകല മനുഷ്യരെയും സൂചിപ്പിക്കുന്നു. ‘എല്ലാവരോടും’ മലയാളത്തിൽ സ്വാഭാവികവും സർവവ്യാപകത വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: πᾶσαν πραΰτητα എന്ന പ്രയോഗത്തിലെ സമഗ്രതയും സ്വഭാവഗുണവും
  choice: പൂർണമായ സൗമ്യത
  alternative: എല്ലാ വിധത്തിലുള്ള സൗമ്യത / തികഞ്ഞ വിനയം
  rationale: πᾶσαν എന്നതിന്റെ ഊന്നൽ ഒഴിവാക്കാതെ, πραΰτης എന്നതിനെ വെറും വിനയമായി ചുരുക്കാതിരിക്കാനാണ് ‘പൂർണമായ സൗമ്യത’ ഉപയോഗിച്ചത്.
- issue: πάντας ἀνθρώπους എന്നതിന്റെ പൊതുവായ മനുഷ്യസൂചന
  choice: എല്ലാവരോടും
  alternative: സകല മനുഷ്യരോടും
  rationale: മൂലപദം പുരുഷന്മാർക്ക് മാത്രമല്ല, എല്ലാ മനുഷ്യർക്കും ബാധകമാണ്; മലയാളത്തിലെ സ്വാഭാവികമായ സർവസൂചന തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ഉപദേശശൈലി. ഗ്രീക്കിലെ ആശയപരമ്പര മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ബന്ധക ക്രിയാവിശേഷണരൂപങ്ങൾ ഉപയോഗിച്ചു. ἐπιεικεῖς, πραΰτητα എന്നിവയുടെ അർഥപരമായ അടുപ്പം മലയാളത്തിലും ഭാഗികമായി നിലനിൽക്കുന്നതിനാൽ രണ്ടിടത്തും ‘സൗമ്യം’ എന്ന പദകുടുംബം ഉപയോഗിച്ചു; രണ്ടാമത്തേതിലെ πᾶσαν ‘പൂർണമായ’ എന്നതിലൂടെ വേർതിരിച്ചിരിക്കുന്നു.
