  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘യാത്രയാക്കുക’ എന്നതിനൊപ്പം സഹായത്തിന്റെ ആശയം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടുണ്ട്; അടിക്കുറിപ്പ് ക്രിയയുടെ സാധ്യമായ മറ്റൊരു സ്വാഭാവിക ഘടന നൽകുന്നു.
