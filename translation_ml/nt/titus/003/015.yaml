id: TIT.3.15
reference: Titus 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: ml
  text: എന്നോടുകൂടെയുള്ള എല്ലാവരും നിനക്കു വന്ദനം അറിയിക്കുന്നു. വിശ്വാസത്തിൽ[a] നമ്മെ സ്നേഹിക്കുന്നവർക്കു വന്ദനം അറിയിക്കുക. കൃപ നിങ്ങളെല്ലാവരോടും കൂടെ ഇരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘ആ വിശ്വാസത്തിൽ’; മറ്റൊരു സാധ്യത: ‘വിശ്വസ്തതയിൽ.’'
    reason: ἐν πίστει എന്ന പ്രയോഗത്തിലെ യഥാർഥമായ അർഥസാധ്യതകൾ സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: വന്ദനം പറയുന്നു
  rationale: ലേഖനസമാപനത്തിലെ അഭിവാദനാർഥം സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: എന്നോടുകൂടെ ഉള്ള എല്ലാവരും
  rationale: μετά എന്ന ബന്ധസൂചനയും πάντες എന്ന സമഗ്രതയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἄσπασαι
  choice: വന്ദനം പറയുക
  rationale: അഭിവാദനം അറിയിക്കാനുള്ള ഏകവചന ആജ്ഞാരൂപം ലളിതമായി പകർത്തുന്നു.
- source_word: φιλοῦντας
  choice: സ്നേഹിക്കുന്നവർക്കു
  rationale: φιλέω സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ സ്നേഹവും അടുപ്പവും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: πίστις എന്നതിന്റെ പ്രാഥമിക അർഥമായ ‘വിശ്വാസം’ നിലനിർത്തുകയും ἐν സൂചിപ്പിക്കുന്ന മേഖലയെയോ അടിസ്ഥാനത്തെയോ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: ἡ χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ ആശീർവാദസമാപനങ്ങളിൽ പതിവായ ദൈവകൃപയുടെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μετὰ πάντων ὑμῶν
  choice: നിങ്ങളെല്ലാവരോടുംകൂടെ ഇരിക്കട്ടെ
  rationale: ഗ്രീക്കിൽ അധ്യാഹരിച്ചിരിക്കുന്ന ക്രിയ മലയാളത്തിൽ ചേർത്ത് ആശീർവാദം പൂർണമാക്കുകയും πάντων എന്ന ‘എല്ലാവരും’ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐν πίστει എന്നതിലെ πίστις-ന്റെ വിവർത്തനം
  choice: വിശ്വാസത്തിൽ
  alternative: ‘ആ വിശ്വാസത്തിൽ’; അല്ലെങ്കിൽ ‘വിശ്വസ്തതയിൽ’
  rationale: ഇവിടെ വിശ്വാസം സ്നേഹത്തിന്റെ പങ്കിട്ട മേഖലയോ അടിസ്ഥാനമോ ആകുന്നതാണ് ഏറ്റവും സ്വാഭാവികം. എന്നാൽ നിർദിഷ്ടമായ ക്രൈസ്തവ വിശ്വാസസമുച്ചയമോ വിശ്വസ്തതയോ എന്ന വായന പൂർണമായി ഒഴിവാക്കാനാവാത്തതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ലേഖനസമാപനത്തിന്റെ ചുരുക്കവും ഊഷ്മളതയും നിലനിർത്തിയിരിക്കുന്നു; ഏകവചനമായ ‘നിനക്കു’ എന്നതും ബഹുവചനമായ ‘നിങ്ങളെല്ലാവരോടുംകൂടെ’ എന്നതും ഗ്രീക്ക് വചനഭേദത്തിന് അനുസൃതമാണ്.
