id: TIT.3.12
reference: Titus 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: ml
  text: ഞാൻ അർത്തെമാസിനെയോ തിഹിക്കൊസിനെയോ നിന്റെ അടുക്കൽ അയയ്ക്കുമ്പോൾ, നിക്കൊപ്പൊലിസിൽ എന്റെ അടുക്കൽ വരാൻ പരമാവധി ശ്രമിക്കുക[a]. കാരണം, അവിടെ ശീതകാലം ചെലവഴിക്കാൻ ഞാൻ തീരുമാനിച്ചിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ അടുക്കൽ വരുന്നതിൽ ഉത്സാഹം കാണിക്കുക” എന്നും “എന്റെ അടുക്കൽ വരാൻ നിന്റെ കഴിവിന്റെ പരമാവധി ചെയ്യുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവിടെ ശീതകാലം കഴിക്കാൻ ഞാൻ ഉറച്ച തീരുമാനമെടുത്തിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: ഞാൻ ... അയയ്ക്കുമ്പോൾ
  rationale: ὅταν സഹിതമുള്ള aorist subjunctive ഇവിടെ പ്രതീക്ഷിക്കപ്പെടുന്ന ഒരു ഭാവിസംഭവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അയയ്ക്കുമ്പോൾ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Ἀρτεμᾶν ... ἢ Τυχικόν
  choice: അർത്തെമാസിനെയോ തിഹിക്കൊസിനെയോ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; ἢ സൂചിപ്പിക്കുന്ന രണ്ടു സാധ്യതകളിലെ ഒന്നെന്ന അർഥം ‘-ഓ ... -ഓ’ ഘടന നിലനിർത്തുന്നു.
- source_word: πρὸς σὲ
  choice: നിന്റെ അടുക്കൽ
  rationale: പ്രതിനിധികളെ തീത്തൊസിന്റെ അടുത്തേക്ക് അയയ്ക്കുന്നതെന്ന ദിശാസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: σπούδασον
  choice: പരമാവധി ശ്രമിക്കുക
  rationale: കല്പനയിൽ അടങ്ങിയ ഉത്സാഹവും മനഃപൂർവമായ ത്വരയും ഉൾക്കൊള്ളുന്നു; വെറും വേഗത്തിൽ പോകുക എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἐλθεῖν πρός με εἰς Νικόπολιν
  choice: നിക്കൊപ്പൊലിസിൽ എന്റെ അടുക്കൽ വരാൻ
  rationale: ചലനം എഴുത്തുകാരന്റെ അടുക്കലേക്കാണ്; അതിനാൽ ‘വരാൻ’ യോജിക്കുന്നു. εἰς Νικόπολιν ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘നിക്കൊപ്പൊലിസിൽ’ ഉപയോഗിച്ചു.
- source_word: ἐκεῖ γὰρ
  choice: അവിടെ ...
  rationale: ‘അവിടെ’ നിക്കൊപ്പൊലിസിനെ തിരിച്ചുസൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ വാക്യബന്ധം തന്നെ കാരണബന്ധം വ്യക്തമാക്കുന്നതിനാൽ γὰρ പ്രത്യേകം ഭാരമുള്ള ബന്ധപദമായി പരിഭാഷപ്പെടുത്തിയില്ല.
- source_word: κέκρικα
  choice: ഞാൻ തീരുമാനിച്ചിരിക്കുന്നു
  rationale: perfect രൂപം മുൻപ് എടുത്തതും ഇപ്പോഴും പ്രാബല്യത്തിലുള്ളതുമായ ഉറച്ച തീരുമാനത്തെ സൂചിപ്പിക്കുന്നു; ‘തീരുമാനിച്ചിരിക്കുന്നു’ അത് നിലനിർത്തുന്നു.
- source_word: παραχειμάσαι
  choice: ശീതകാലം ചെലവഴിക്കാൻ
  rationale: ഒരു സ്ഥലത്ത് ശീതകാലം കഴിക്കുക/താമസിക്കുക എന്ന ക്രിയയുടെ സന്ദർഭാർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കത്തുശൈലി ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധനയായ σὲ അനുസരിച്ച് ‘നിന്റെ’ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
