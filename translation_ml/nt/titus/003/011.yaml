  text: knowing that such a person is warped and is sinning[c][b][a], being self-condemned.
translation:
  language: ml
  text: അങ്ങനെയുള്ളവൻ വഴിപിഴച്ച നിലയിലാണെന്നും[a] പാപം ചെയ്തുകൊണ്ടിരിക്കുകയാണെന്നും, സ്വയം കുറ്റംവിധിക്കപ്പെട്ടവനാണെന്നും[b] അറിഞ്ഞുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വഴിതിരിഞ്ഞുപോയിരിക്കുന്നു” അല്ലെങ്കിൽ “വികൃതനായിരിക്കുന്നു.” ഗ്രീക്കിലെ പൂർണകാല ക്രിയ, മുമ്പുണ്ടായ വഴിതെറ്റലിന്റെ ഫലമായി തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സ്വന്തം പ്രവൃത്തികളാൽ തന്നെ കുറ്റക്കാരനെന്നു തെളിയിക്കുന്നവൻ” അല്ലെങ്കിൽ “സ്വയം കുറ്റംവിധിക്കപ്പെട്ടവൻ.” ഈ പദം, അയാളുടെ സ്വന്തം പ്രവൃത്തികളോ സാക്ഷ്യമോ അയാൾക്കെതിരായ കുറ്റവിധിക്ക് കാരണമാകുന്നു എന്നു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: അറിഞ്ഞുകൊൾക
  rationale: മുൻവാക്യത്തിലെ നിർദേശവുമായി ബന്ധമുള്ള സാഹചര്യാർഥക കൃഡന്തമാണിത്. സ്വതന്ത്ര വാക്യമായി മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാനായി അതിന്റെ അന്തർലീനമായ ദ്വിതീയപുരുഷ കർത്താവിനെ വ്യക്തമാക്കുന്നു; കാരണാർഥമോ മറ്റേതെങ്കിലും സൂക്ഷ്മബന്ധമോ നിർബന്ധമായി നിശ്ചയിക്കുന്നില്ല.
- source_word: ἐξέστραπται
  choice: വഴിപിഴച്ച നിലയിലാണ്
  rationale: പൂർണകാല ക്രിയ മുൻപ് സംഭവിച്ച വ്യതിചലനത്തിന്റെ ഫലമായ ഇപ്പോഴത്തെ സ്ഥിരാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘വഴിപിഴച്ച നിലയിലാണ്’ ആ അവസ്ഥയും ധാർമിക വ്യതിയാനവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁ τοιοῦτος
  choice: അങ്ങനെയുള്ളവൻ
  rationale: മുൻവാക്യത്തിലെ ഭിന്നതയുണ്ടാക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ ഏകവചന പ്രയോഗം. മലയാളത്തിലെ ‘അങ്ങനെയുള്ളവൻ’ ഈ വ്യക്തിഗതവും പുല്ലിംഗവുമായ പരാമർശം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἁμαρτάνει
  choice: പാപം ചെയ്തുകൊണ്ടിരിക്കുകയാണ്
  rationale: വർത്തമാനകാലത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: ὢν
  choice: അവൻ … ആണ്
  rationale: അവസാന വിശേഷണവിധേയത്തെ മുൻവിവരണത്തോട് ബന്ധിപ്പിക്കുന്ന കൃഡന്തം മലയാളത്തിൽ സ്വാഭാവികമായ സമാപക ഉപവാക്യമായി നൽകിയിരിക്കുന്നു.
- source_word: αὐτοκατάκριτος
  choice: സ്വയം കുറ്റം വിധിച്ചവൻ
  rationale: സ്വന്തം നിലപാടോ പ്രവൃത്തികളോ തന്നെ തനിക്കെതിരായ കുറ്റവിധിക്ക് അടിസ്ഥാനമാകുന്നു എന്ന പ്രത്യാവർത്തക അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; അന്തിമ ന്യായവിധിയെക്കുറിച്ചുള്ള അധിക ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ὁ τοιοῦτος എന്ന പ്രയോഗത്തിലെ ലിംഗസൂചന
  choice: അങ്ങനെയുള്ളവൻ
  alternative: അങ്ങനെയുള്ള ഒരാൾ
  rationale: ഗ്രീക്ക് പ്രയോഗം പുല്ലിംഗ ഏകവചനമാണ്; അടുത്ത സന്ദർഭത്തിലെ ഭിന്നതയുണ്ടാക്കുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ മലയാളത്തിലും പുല്ലിംഗസൂചന നിലനിർത്തുന്നു.
- issue: αὐτοκατάκριτος എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: സ്വയം കുറ്റം വിധിച്ചവൻ
  alternative: സ്വന്തം പ്രവൃത്തികളാൽ കുറ്റക്കാരനായി വിധിക്കപ്പെട്ടവൻ
  rationale: ആ വ്യക്തിയുടെ തന്നെ നിലയും പെരുമാറ്റവും അവനെതിരായി സാക്ഷ്യം വഹിക്കുന്നു എന്ന ഭാരം വിവർത്തനം നിലനിർത്തുന്നു. എന്നാൽ ഇത് ഔപചാരികമായ അന്തിമ ശിക്ഷാവിധിയാണെന്ന് അമിതമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘വഴിപിഴച്ച നിലയിലാണ്’ എന്നത് പൂർണകാലത്തിന്റെ ഫലാവസ്ഥ സ്വാഭാവികമായി നൽകുന്നു; ‘പാപം ചെയ്തുകൊണ്ടിരിക്കുകയാണ്’ തുടരുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു. വാക്യം ഒറ്റയ്ക്കും വായിക്കാവുന്നവിധം കൃഡന്തരൂപം നിർദേശരൂപത്തിൽ അവതരിപ്പിച്ചെങ്കിലും മുൻവാക്യവുമായുള്ള ആശയബന്ധം നിലനിർത്തിയിരിക്കുന്നു.
