  terminology: “നീതീകരിക്കപ്പെട്ടവരായി,” “കൃപയാൽ,” “അവകാശികൾ,” and “നിത്യജീവൻ” are suitable established Malayalam biblical terms. The lexical-alternative notes are accurate and their anchors remain correctly placed after the terms/phrase they elucidate.
