id: TIT.3.7
reference: Titus 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: ml
  text: അവന്റെ കൃപയാൽ നീതീകരിക്കപ്പെട്ടവരായി[a] നാം നിത്യജീവന്റെ പ്രത്യാശയ്ക്കനുസരിച്ച്[b] അവകാശികളായിത്തീരേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീതീകരിക്കപ്പെട്ടവരായി” എന്നത് “നീതിമാന്മാരെന്നു പ്രഖ്യാപിക്കപ്പെട്ടവരായി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിത്യജീവന്റെ പ്രത്യാശയിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: അങ്ങനെ … -േണ്ടതിന്
  rationale: മുൻവാക്യത്തിലെ ദൈവിക രക്ഷാപ്രവർത്തനത്തിന്റെ ഉദ്ദേശ്യമോ ഫലമോ അവതരിപ്പിക്കുന്ന ἵναയുടെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δικαιωθέντες
  choice: നീതീകരിക്കപ്പെട്ടവരായി
  rationale: δικαιόω എന്ന ക്രിയയുടെ ഭൂതകാലസൂചനയും കർമണിപ്രയോഗവും നിലനിർത്തുന്നു; മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെയും സൂചിപ്പിക്കുന്നു.
- source_word: τῇ ἐκείνου χάριτι
  choice: അവന്റെ കൃപയാൽ
  rationale: ഉപകരണാർഥത്തിലുള്ള ദത്തിവ് സ്വാഭാവികമായി നൽകുന്നു. ἐκείνου ആരെ സൂചിപ്പിക്കുന്നു എന്നു പേരെടുത്ത് വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ സന്ദർഭപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- source_word: κληρονόμοι
  choice: അവകാശികൾ
  rationale: പാരമ്പര്യാവകാശത്തിന്റെയും ലഭിക്കാനിരിക്കുന്ന ഓഹരിയുടെയും ബൈബിൾസംബന്ധമായ ദൃശ്യഭാവം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: γενηθῶμεν
  choice: നാം … ആയിത്തീരേണ്ടതിന്
  rationale: γίνομαι സൂചിപ്പിക്കുന്ന ഒരു നിലയിലേക്കുള്ള പ്രവേശനം നൽകുന്നു; ἵναയോടുകൂടിയ ഉപവിധിയുടെ ഉദ്ദേശ്യസ്വഭാവവും പ്രകടമാക്കുന്നു.
- source_word: κατ’ ἐλπίδα
  choice: പ്രത്യാശയ്ക്കൊത്തവിധം
  rationale: κατάയുടെ അടിസ്ഥാനമായ ‘അനുസരിച്ച്/ഒത്തവിധം’ എന്ന ബന്ധം നിലനിർത്തുന്നു; എന്നാൽ ‘പ്രത്യാശയിൽ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ζωῆς αἰωνίου
  choice: നിത്യജീവന്റെ
  rationale: പ്രത്യാശയുടെ ഉള്ളടക്കമോ ലക്ഷ്യമോ വ്യക്തമാക്കുന്ന ജനിറ്റീവ് ബന്ധം സംക്ഷിപ്തമായും പതിവായ ബൈബിൾഭാഷയിലും നൽകുന്നു.
theological_decisions:
- issue: δικαιωθέντες എന്ന രക്ഷാശാസ്ത്രപരമായ പദത്തിന്റെ അർഥം
  choice: നീതീകരിക്കപ്പെട്ടവരായി
  alternative: നീതിമാന്മാരെന്നു പ്രഖ്യാപിക്കപ്പെട്ടവരായി
  rationale: ‘നീതീകരിക്കുക’ എന്നത് പ്രധാന ഗ്രീക്ക് പദവുമായുള്ള പദബന്ധവും ദൈവശാസ്ത്രപരമായ വിശാലതയും നിലനിർത്തുന്നു; പദത്തിന്റെ അർഥം പ്രഖ്യാപനത്തിൽ മാത്രം ഒതുക്കുന്നില്ല.
- issue: ἐκείνου എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: അവന്റെ
  alternative: ദൈവത്തിന്റെ / യേശുക്രിസ്തുവിന്റെ
  rationale: സന്ദർഭത്തിൽ സൂചിതവ്യക്തിയെക്കുറിച്ച് വ്യാഖ്യാനസാധ്യതകളുള്ളതിനാൽ ഗ്രീക്ക് പാഠത്തേക്കാൾ കൃത്യമായി ഒരാളെ പേരെടുത്ത് നിർണ്ണയിക്കുന്നില്ല.
- issue: κατ’ ἐλπίδα എന്നതിന്റെ ബന്ധം
  choice: നിത്യജീവന്റെ പ്രത്യാശയ്ക്കൊത്തവിധം
  alternative: നിത്യജീവന്റെ പ്രത്യാശയിൽ
  rationale: κατά എന്ന മുൻവാക്കിന്റെ രൂപപരമായ ശക്തി മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും കൂടുതൽ പ്രയോഗസഹജമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി ഉപയോഗിച്ചു. വാക്യം മുൻസന്ദർഭത്തോട് ബന്ധപ്പെടുന്ന ഉദ്ദേശ്യവാക്യമായതിനാൽ ‘അങ്ങനെ’ എന്നും അവസാനത്തിൽ ‘-േണ്ടതിന്’ എന്നും നൽകി. ദൈവശാസ്ത്രപരമായ സാങ്കേതികപദമായ ‘നീതീകരിക്കുക’ നിലനിർത്തി, അതിന്റെ വിശദീകരണസാധ്യത അടിക്കുറിപ്പിൽ ചേർത്തു.
