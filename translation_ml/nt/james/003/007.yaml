source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: ml
  text: എന്തെന്നാൽ, വന്യമൃഗങ്ങൾ, പക്ഷികൾ, ഇഴജന്തുക്കൾ, കടൽജീവികൾ എന്നിവയുടെ എല്ലാ ഇനങ്ങളും മനുഷ്യവർഗത്താൽ[a] മെരുക്കപ്പെടുകയും മെരുക്കപ്പെട്ടിട്ടുമുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മനുഷ്യസ്വഭാവത്താൽ.’ τῇ φύσει τῇ ἀνθρωπίνῃ എന്ന ഗ്രീക്ക് പ്രയോഗം മനുഷ്യവർഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായോ, കൂടുതൽ അമൂർത്തമായി മനുഷ്യസ്വഭാവത്തെ സൂചിപ്പിക്കുന്നതായോ മനസ്സിലാക്കാം. പ്രധാനപാഠം കൂട്ടവായന സ്വീകരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: എല്ലാ ഇനങ്ങളും
  rationale: ജന്തുവർഗങ്ങളുടെ ഈ പട്ടികയിൽ φύσις എന്നത് ‘സ്വഭാവം’ എന്നതിലുപരി ‘ഇനം/വർഗം’ എന്ന അർഥത്തിലാണ്. πᾶσα എന്നതിന്റെ വിതരണാർഥം ‘എല്ലാ ഇനങ്ങളും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് വിശദീകരണം നൽകുന്ന γάρ എന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: θηρίων
  choice: വന്യമൃഗങ്ങൾ
  rationale: θηρίον സാധാരണയായി മൃഗത്തെ, പ്രത്യേകിച്ച് വന്യമൃഗത്തെ, സൂചിപ്പിക്കുന്നു; ആ അർഥവ്യത്യാസം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: πετεινῶν
  choice: പക്ഷികൾ
  rationale: പറക്കുന്ന ജീവികളെ സൂചിപ്പിക്കുന്ന പദത്തിന് ഈ പട്ടികയിൽ ഏറ്റവും സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: ἑρπετῶν
  choice: ഇഴജന്തുക്കൾ
  rationale: ഇഴയുന്ന ജീവികൾ എന്ന ഗ്രീക്ക് പദത്തിന്റെ വിശാലത ‘ഉരഗങ്ങൾ’ എന്നതിനെക്കാൾ നന്നായി നിലനിർത്തുന്നു.
- source_word: ἐναλίων
  choice: കടൽജീവികൾ
  rationale: കടലിലുള്ള ജീവികളെ വിശാലമായി സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളപരിഭാഷ.
- source_word: δαμάζεται
  choice: മെരുക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗം തുടരുന്ന അഥവാ പൊതുവായി സംഭവിക്കുന്ന മെരുക്കൽപ്രക്രിയയെ സൂചിപ്പിക്കുന്നു.
- source_word: δεδάμασται
  choice: മെരുക്കപ്പെട്ടിട്ടുമുണ്ട്
  rationale: പൂർണകാല കർമണിപ്രയോഗത്തിലെ പൂർത്തിയായ പ്രവൃത്തിയും അതിന്റെ നിലനിൽക്കുന്ന ഫലവും നൽകുന്നു; മുൻക്രിയയുമായുള്ള വാചകഭേദവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: മനുഷ്യവർഗത്താൽ
  rationale: ഇവിടെ മനുഷ്യരെ കൂട്ടമായി പ്രവർത്തകസ്ഥാനത്ത് കാണുന്ന വായന സ്വാഭാവികമാണ്. അതേസമയം ‘മനുഷ്യസ്വഭാവത്താൽ’ എന്ന അമൂർത്തവായനയ്ക്കുള്ള യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τῇ φύσει τῇ ἀνθρωπίνῃ എന്ന പ്രയോഗത്തിന്റെ കൂട്ടവായനയും അമൂർത്തവായനയും
  choice: പ്രധാനപാഠത്തിൽ ‘മനുഷ്യവർഗത്താൽ’
  alternative: ‘മനുഷ്യസ്വഭാവത്താൽ’
  rationale: സന്ദർഭത്തിൽ ജന്തുവർഗങ്ങളെയും മനുഷ്യവർഗത്തെയും തമ്മിൽ താരതമ്യം ചെയ്യുന്ന കൂട്ടവായന കൂടുതൽ സ്വാഭാവികമാണ്; എങ്കിലും ഗ്രീക്ക് പ്രയോഗത്തിന് അമൂർത്തമായി ‘മനുഷ്യസ്വഭാവം’ എന്നും അർഥമാകാം, അതിനാൽ ആ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ കർമണിപ്രയോഗവും വർത്തമാനകാല–പൂർണകാല വ്യത്യാസവും നിലനിർത്തിയിരിക്കുന്നു; ജന്തുപട്ടിക വായിക്കാൻ എളുപ്പമുള്ള സമാന്തരഘടനയിൽ നൽകിയിരിക്കുന്നു.
