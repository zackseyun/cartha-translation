  source_fidelity: The draft accurately preserves the body-part metaphor in γλῶσσα and μικρὸν μέλος, the boastful force of μεγάλα αὐχεῖ, and the rhetorical comparison of a small fire with a large ὕλη. The main-text treatment of ἡλίκον as ‘small’ is contextually well supported, while the footnote appropriately retains the alternative exclamatory construal. The anchors are correctly placed on the fire and forest expressions in the Malayalam text.
