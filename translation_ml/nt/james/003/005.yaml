id: JAS.3.5
reference: James 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: ml
  text: അതുപോലെതന്നെ, നാവും ചെറിയൊരു അവയവമാണ്; എങ്കിലും അത് വലിയ കാര്യങ്ങൾ വീമ്പോടെ പറയുന്നു. നോക്കൂ, എത്ര ചെറിയ തീയാണ[a] എത്ര വലിയ കാടിനെ[b] കത്തിച്ചുകളയുന്നത്!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എത്ര വലിയ തീയാണു എത്ര വലിയ കാടിനെ കത്തിച്ചുകളയുന്നത്!” ഗ്രീക്ക് വാചകം ആശ്ചര്യസൂചകമായി ഇങ്ങനെ ഗ്രഹിക്കാം. എന്നാൽ ചെറിയൊരു കാരണം വലിയ ഫലം ഉളവാക്കുന്നു എന്ന അർഥമാണ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചിരിക്കുന്നത്; ചെറിയ അവയവമായ നാവിനെക്കുറിച്ചുള്ള തൊട്ടുമുൻപത്തെ താരതമ്യത്തോടും ഇത് യോജിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “മരം,” “തടി,” അല്ലെങ്കിൽ “ഉണങ്ങിയ ചെടിപ്പടർപ്പ്.” ഗ്രീക്ക് പദം കത്താൻ കഴിയുന്ന വസ്തുക്കളെയോ മരങ്ങൾ നിറഞ്ഞ പ്രദേശത്തെയോ പൊതുവായി സൂചിപ്പിക്കാം; ഈ ദൃശ്യത്തിൽ “കാട്” സ്വാഭാവികമായി യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: നാവ്
  rationale: ശരീരാവയവത്തെ ആധാരമാക്കിയ യാക്കോബിന്റെ മൂർത്തമായ രൂപകം നിലനിർത്തുന്നു; ‘സംസാരം’ എന്നു വിവർത്തനം ചെയ്താൽ രൂപകത്തെ വ്യാഖ്യാനിച്ചുകളയും.
- source_word: μικρὸν μέλος
  choice: ചെറിയൊരു അവയവം
  rationale: ശരീരഭാഗം എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുകയും മുൻസന്ദർഭത്തിലെ ശരീരരൂപകവുമായി ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μεγάλα αὐχεῖ
  choice: വലിയ കാര്യങ്ങളെക്കുറിച്ച് വീമ്പുപറയുന്നു
  rationale: μεγάλα എന്ന ബഹുവചനരൂപവും αὐχεῖ എന്ന വീമ്പുപറയൽ അർഥവും സംരക്ഷിച്ച്, മഹത്തായ അവകാശവാദങ്ങളെയോ അഹങ്കാരപൂർണമായ സംസാരത്തെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം നൽകുന്നു.
- source_word: Ἰδοὺ
  choice: നോക്കൂ
  rationale: തുടർന്നുവരുന്ന ദൃഷ്ടാന്തത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ശക്തി, കാലഹരണപ്പെട്ട ശൈലി ഒഴിവാക്കി, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡλίκον πῦρ
  choice: എത്ര ചെറിയ തീ
  rationale: ചെറിയ അവയവമായ നാവിനും അതിന്റെ വലിയ ഫലത്തിനും ഇടയിലുള്ള താരതമ്യത്തോട് യോജിക്കുന്നവിധം, ചെറിയ കാരണത്തിൽനിന്ന് വലിയ ഫലം ഉണ്ടാകുന്നു എന്ന സന്ദർഭാർഥം മുൻനിർത്തുന്നു; ഗ്രീക്ക് വാചകം മറ്റൊരു വിധത്തിലും ഗ്രഹിക്കാമെന്നത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἡλίκην ὕλην
  choice: എത്ര വലിയ കാട്
  rationale: ὕλη എന്നത് കാട്, മരം, ഇന്ധനവസ്തു എന്നിവയെ സൂചിപ്പിക്കാം; ഇവിടെ തീ പടരുന്ന വിശാലമായ പ്രദേശത്തിന്റെ ദൃശ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകാൻ ‘കാട്’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: ἀνάπτει
  choice: തീ കൊളുത്തുന്നു
  rationale: തീ വലിയ കാടിനെ കത്തിച്ചുതുടങ്ങുന്ന ദൃശ്യം വ്യക്തവും സജീവവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
