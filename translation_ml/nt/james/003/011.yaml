  text: μήτι ἡ πηγὴ ἐκ τῆς αὐτῆς ὀπῆς βρύει τὸ γλυκὺ καὶ τὸ πικρόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/003/011.yaml
  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: ml
  text: ഒരു ഉറവിന്റെ ഒരേ തുറവിൽനിന്ന് മധുരമുള്ള വെള്ളവും കയ്പുള്ള വെള്ളവും പൊങ്ങിവരുന്നില്ലല്ലോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഒരു ഉറവിന്റെ ഒരേ തുറവിൽനിന്ന് മധുരമുള്ളതും കയ്പുള്ളതും പൊങ്ങിവരുന്നില്ലല്ലോ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτι
  choice: —മോ?
  rationale: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: πηγή
  choice: ഉറവ്
  rationale: സ്വാഭാവികമായി വെള്ളം പുറപ്പെടുന്ന ജലസ്രോതസ്സിനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: ഒരേ തുറവിൽനിന്ന്
  rationale: ὀπή എന്നതിന്റെ ഭൗതികമായ ‘തുറവ്’ എന്ന അർഥവും ഒരേ പുറപ്പാടിന്റെ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: βρύει
  choice: പൊങ്ങിവരുന്നു
  rationale: ഉറവിൽനിന്ന് വെള്ളം കുതിച്ചോ ഉറന്നോ പുറത്തുവരുന്ന βρύωയുടെ ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: τὸ γλυκύ
  choice: മധുരമുള്ള വെള്ളം
  rationale: ‘മധുരമുള്ളത്’ എന്ന വിശേഷണം ജലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘വെള്ളം’ ചേർക്കുന്നു; ‘ശുദ്ധജലം’ എന്ന വ്യാഖ്യാനപരമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: τὸ πικρόν
  choice: കയ്പുള്ള വെള്ളം
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള ‘കയ്പുള്ളത്’ എന്ന വൈരുധ്യം നിലനിർത്തി, ഉദ്ദേശിക്കുന്ന വസ്തു വ്യക്തമാക്കാൻ ‘വെള്ളം’ ചേർക്കുന്നു.
