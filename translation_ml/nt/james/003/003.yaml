id: JAS.3.3
reference: James 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: ml
  text: കുതിരകൾ നമ്മെ അനുസരിക്കേണ്ടതിന് അവയുടെ വായിൽ വായ്ക്കടിവാൾ ഇടുന്നുവെങ്കിൽ, അവയുടെ മുഴുവൻ ശരീരങ്ങളെയും നാം നയിക്കുകയും ചെയ്യുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കടിഞ്ഞാൺ’ എന്നും വിവർത്തനം ചെയ്യാം; എന്നാൽ ഇവിടെ പ്രത്യേകമായി ഉദ്ദേശിക്കുന്നത് കുതിരയുടെ വായിൽ ഇടുന്ന ഭാഗമായ വായ്ക്കടിവാളാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ഇടുന്നെങ്കിൽ
  rationale: εἰയുടെ നിബന്ധനാഭാവം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ സംരക്ഷിക്കുന്നു. δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, നേരിയ ആശയപുരോഗതിയാണ്; അതിനാൽ ‘എന്നാൽ’ ചേർത്ത് വിരോധം അമിതമാക്കിയിട്ടില്ല.
- source_word: χαλινοὺς
  choice: കടിഞ്ഞാണിന്റെ വായ്പ്പൂട്ട്
  rationale: കുതിരയുടെ വായ്ക്കുള്ളിൽ ഇടുന്ന ‘bit’ ആണ് സന്ദർഭത്തിൽ പ്രത്യേകമായി ഉദ്ദേശിക്കുന്നത്. ‘കടിഞ്ഞാൺ’ മാത്രം എന്നു പറഞ്ഞാൽ മുഴുവൻ bridle എന്ന അർഥവും വരാമെന്നതിനാൽ വായിലിടുന്ന ഭാഗം വ്യക്തമാക്കി.
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: അവയുടെ വായിൽ ... ഇടുന്നെങ്കിൽ
  rationale: εἰς സഹിതമുള്ള βάλλομεν വായ്ക്കുള്ളിലേക്ക് ഇടുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വായിൽ ഇടുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: കുതിരകൾ നമ്മെ അനുസരിക്കേണ്ടതിന്
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; πείθεσθαι + dative ഇവിടെ ‘നമ്മെ അനുസരിക്കുക’ എന്നാണ്.
- source_word: ὅλον τὸ σῶμα αὐτῶν
  choice: അവയുടെ ശരീരം മുഴുവനും
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ σῶμα ബഹുവചനസംബന്ധത്തിൽ വിതരണാർഥത്തിലാണ്. മലയാളത്തിൽ ‘അവയുടെ ശരീരം മുഴുവനും’ ഓരോ കുതിരയുടെയും മുഴുവൻ ശരീരത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: μετάγομεν
  choice: നാം നയിക്കുന്നു
  rationale: ചലനത്തെ നിയന്ത്രിച്ച് ദിശപ്പെടുത്തുക എന്ന ക്രിയയുടെ അർഥം കുതിരയുടെ ദൃശ്യരൂപത്തിലും തുടർന്നുള്ള വാദത്തിലും യോജിക്കുന്നു.
