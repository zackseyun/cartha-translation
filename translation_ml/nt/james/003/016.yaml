  to: എന്തെന്നാൽ, അസൂയയും സ്വാർഥമത്സരവും എവിടെയുണ്ടോ, അവിടെ ക്രമക്കേടും എല്ലാത്തരം ദുഷ്പ്രവൃത്തികളും ഉണ്ട്.[a]
