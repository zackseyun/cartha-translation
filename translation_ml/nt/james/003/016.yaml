id: JAS.3.16
reference: James 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: ml
  text: എന്തെന്നാൽ, അസൂയയും സ്വാർഥമത്സരവും എവിടെയുണ്ടോ, അവിടെ ക്രമക്കേടും എല്ലാത്തരം ദുഷ്പ്രവൃത്തികളും ഉണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: ‘എല്ലാ നീചകാര്യവും’; ‘എല്ലാ ദുഷ്ടകാര്യവും’ എന്നും വിവർത്തനം ചെയ്യാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ... ἐκεῖ
  choice: എവിടെയുണ്ടോ, അവിടെ
  rationale: ഗ്രീക്കിലെ പരസ്പരം ബന്ധിപ്പിച്ച സ്ഥലസൂചക ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; പൊതുവായ നിബന്ധനയുടെ ഭാവവും പ്രകടമാക്കുന്നു.
- source_word: γὰρ
  choice: വാക്യഘടനയിൽ പ്രത്യേകം പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിലെ തുടർച്ചയിലും വാക്യത്തിന്റെ കാരണസൂചക സ്വഭാവത്തിലും വ്യക്തമാകുന്നു; ‘എന്തെന്നാൽ’ ചേർത്താൽ ഒറ്റവാക്യ ഉദ്ധരണിയിൽ കൃത്രിമത്വം തോന്നാം.
- source_word: ζῆλος
  choice: അസൂയ
  rationale: 3:14–15-ലെ പ്രതികൂല പശ്ചാത്തലത്തിൽ ഇത് നല്ല അർഥത്തിലുള്ള തീക്ഷ്ണതയല്ല, മറ്റുള്ളവരോടുള്ള അസൂയയാണ്. ആ ദുഷ്പ്രവണതയെ ആധുനിക മലയാളത്തിൽ ‘അസൂയ’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐριθεία
  choice: സ്വാർഥമോഹം
  rationale: സ്വന്തം നേട്ടത്തിനായി മത്സരിക്കുകയും വിഭാഗീയമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്ന മനോഭാവമാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘സ്വാർഥമോഹം’ പ്രേരണയെ ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀκαταστασία
  choice: ക്രമക്കേട്
  rationale: മാനസിക ആശയക്കുഴപ്പത്തേക്കാൾ സമൂഹത്തിലെ അസ്ഥിരതയും അവ്യവസ്ഥയും ഇവിടെ ഉദ്ദേശിക്കപ്പെടുന്നു; ‘ക്രമക്കേട്’ അതിനെ പൊതുവായ വായനക്കാർക്ക് വ്യക്തമായി കൈമാറുന്നു.
- source_word: πᾶν φαῦλον πρᾶγμα
  choice: സകല നീചപ്രവൃത്തിയും
  rationale: പദശഃ ‘സകല നീചകാര്യവും’ എന്നതിനുപകരം, ദുഷ്ടമായ പ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സ്വാഭാവികവുമായ പ്രയോഗം. πᾶν എന്ന സമഗ്രതയും φαῦλον എന്ന ധാർമിക നിന്ദാഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ζῆλος എന്ന പദത്തിന്റെ ധാർമിക മൂല്യം
  choice: പ്രതികൂല ദുഷ്പ്രവണതയായ ‘അസൂയ’
  alternative: നിഷ്പക്ഷമോ നല്ലതോ ആയ ‘തീക്ഷ്ണത’; അല്ലെങ്കിൽ ‘ഈർഷ്യ’
  rationale: തൊട്ടുമുമ്പുള്ള 3:14–15-ൽ ‘കയ്പേറിയ അസൂയ’യും സ്വാർഥമോഹവും ഭൗമികവും ആത്മീയമല്ലാത്തതുമായ ജ്ഞാനത്തിന്റെ ലക്ഷണങ്ങളാണ്. അതിനാൽ നല്ല അർഥം ഇവിടെ സന്ദർഭവിരുദ്ധമാണ്; ‘അസൂയ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- issue: πᾶν φαῦλον πρᾶγμα എന്നതിന്റെ വ്യാപ്തി
  choice: ‘സകല നീചപ്രവൃത്തിയും’ എന്ന വിപുലമായ ധാർമിക പ്രസ്താവന
  alternative: ‘എല്ലാ തിന്മയും’ അല്ലെങ്കിൽ പദശഃ ‘സകല നീചകാര്യവും’
  rationale: മൂലപാഠം ഒരു പ്രത്യേക പാപത്തെ മാത്രം ചൂണ്ടിക്കാണിക്കാതെ എല്ലാ തരം അധമമായ പ്രവൃത്തികളെയും ഉൾക്കൊള്ളുന്നു. ‘പ്രവൃത്തി’ പ്രായോഗിക ദുഷ്ചെയ്തികളെ വ്യക്തമാക്കുമ്പോഴും അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘എവിടെയുണ്ടോ, അവിടെ’ എന്ന സമാന്തര ഘടന മൂലത്തിലെ സൂക്തിസ്വഭാവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനുശേഷം നൽകിയിരിക്കുന്നു.
