source:
  edition: SBLGNT
  text: ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: ml
  text: ഒരേ വായിൽനിന്ന് അനുഗ്രഹവും ശാപവും പുറപ്പെടുന്നു. എന്റെ സഹോദരന്മാരേ[a], ഇവ ഇങ്ങനെ സംഭവിച്ചുകൂടാ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്റെ സഹോദരന്മാരും സഹോദരിമാരും”; ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്, എന്നാൽ സന്ദർഭത്തിൽ യാക്കോബ് വിശ്വാസസമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്യുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: ഒരേ വായിൽനിന്ന്
  rationale: സംസാരം ഒരേ ഉറവിടത്തിൽനിന്ന് പുറപ്പെടുന്നു എന്ന മൂലഭാഷയിലെ ദൃശ്യരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξέρχεται
  choice: പുറപ്പെടുന്നു
  rationale: വായിൽനിന്ന് വാക്കുകൾ പുറത്തുവരുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം; ഏകവചന ക്രിയയുള്ള ഗ്രീക്ക് ഘടനയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: εὐλογία
  choice: അനുഗ്രഹം
  rationale: ഇവിടെ ഉച്ചരിക്കപ്പെടുന്ന അനുഗ്രഹവാക്കിനെ സൂചിപ്പിക്കുന്നു; ശാപത്തോടുള്ള നേരിട്ടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: κατάρα
  choice: ശാപം
  rationale: വായിൽനിന്ന് പുറപ്പെടുന്ന ശാപവാക്ക് എന്ന പ്രസംഗക്രിയാസന്ദർഭത്തിന് യോജിക്കുന്ന നേരിട്ടുള്ള പദം.
- source_word: οὐ χρή
  choice: പാടില്ല
  rationale: ഇത് ഉചിതമല്ലെന്നും സംഭവിക്കരുതെന്നും ഉള്ള ധാർമിക നിർബന്ധം ലളിതവും ശക്തവുമായി അറിയിക്കുന്നു.
- source_word: ἀδελφοί μου
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ ബഹുവചന സംബോധനയെ പ്രധാന പാഠത്തിൽ നിലനിർത്തുന്നു; സമൂഹമൊട്ടാകെയുള്ള സാധ്യതയുള്ള ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: ഇങ്ങനെ സംഭവിക്കാൻ
  rationale: οὕτως എന്നതിന്റെ ‘ഇങ്ങനെ’ എന്ന ഭാവവും γίνεσθαι എന്നതിന്റെ ‘സംഭവിക്കുക’ എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ταῦτα സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്ന അനുഗ്രഹവും ശാപവും ഒരേ വായിൽനിന്ന് വരുന്നതെന്ന കാര്യത്തെ അനാവശ്യമായി ആവർത്തിക്കുന്നില്ല.
theological_decisions:
- issue: ἀδελφοί μου എന്ന ലിംഗസൂചക കുടുംബസംബോധന
  choice: എന്റെ സഹോദരന്മാരേ
  alternative: എന്റെ സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലപദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്. എന്നാൽ യാക്കോബ് വിശ്വാസസമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്യുന്നതാകാം; അതിനാൽ മൂലരൂപം പ്രധാന പാഠത്തിലും ഉൾക്കൊള്ളുന്ന സാധ്യത അടിക്കുറിപ്പിലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഒരേ വായിൽനിന്ന്’ എന്ന ശക്തമായ ദൃശ്യരൂപവും അനുഗ്രഹം–ശാപം എന്ന വൈരുധ്യവും സംരക്ഷിച്ചിരിക്കുന്നു.
