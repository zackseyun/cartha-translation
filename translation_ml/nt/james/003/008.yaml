id: JAS.3.8
reference: James 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: ml
  text: എന്നാൽ മനുഷ്യരിൽ ആർക്കും നാവിനെ മെരുക്കാൻ കഴിയില്ല. അത് അടങ്ങാത്ത തിന്മയാണ്[a]; മാരകവിഷം നിറഞ്ഞത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അസ്ഥിരമായ തിന്മ” അല്ലെങ്കിൽ “ശാന്തിയില്ലാത്ത തിന്മ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: നാവിനെ
  rationale: ശരീരാവയവത്തെ സൂചിപ്പിക്കുന്ന പദം നിലനിർത്തുന്നത് മനുഷ്യസംസാരത്തിനായി യാക്കോബ് ഉപയോഗിക്കുന്ന രൂപകവും മുൻവാക്യങ്ങളുമായുള്ള തുടർച്ചയും സംരക്ഷിക്കുന്നു.
- source_word: οὐδεὶς ... ἀνθρώπων
  choice: മനുഷ്യരിൽ ആർക്കും
  rationale: οὐδεὶς എന്നതോടു ചേർന്ന ഭാഗികസംബന്ധികയായ ἀνθρώπων എന്നതിന്റെ ‘മനുഷ്യരിൽ ആരും’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഇത് ലിംഗഭേദമില്ലാതെ മനുഷ്യരെയാകെ ഉൾക്കൊള്ളുന്നു.
- source_word: δαμάσαι δύναται
  choice: മെരുക്കാൻ കഴിയില്ല
  rationale: δαμάζω എന്ന ക്രിയയുടെ മൃഗങ്ങളെ മെരുക്കുക എന്ന പ്രാഥമിക ദൃശ്യബിംബവും തൊട്ടുമുൻപുള്ള സന്ദർഭത്തിലെ ക്രിയാബന്ധവും ‘മെരുക്കുക’ നിലനിർത്തുന്നു.
- source_word: ἀκατάστατον
  choice: അടങ്ങാത്ത
  rationale: ക്രമത്തിൽ നിൽക്കാത്തതും നിയന്ത്രണവിധേയമാകാത്തതുമായ സ്വഭാവം സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു; ‘അസ്ഥിരമായ’ എന്നത് മലയാളത്തിൽ ഇവിടെ സ്വാഭാവികതയും ശക്തിയും കുറയ്ക്കാം.
- source_word: κακόν
  choice: തിന്മ
  rationale: കേവലം ദോഷകരമായ വസ്തുവെന്നതിലുപരി പദത്തിന്റെ ധാർമിക ശക്തി നിലനിർത്തുന്നു.
- source_word: μεστὴ ἰοῦ θανατηφόρου
  choice: മാരകവിഷം നിറഞ്ഞത്
  rationale: μεστήയുടെ നിറഞ്ഞ അവസ്ഥയും θανατηφόρος എന്നതിന്റെ മരണകാരക ശക്തിയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: οὐδεὶς ... ἀνθρώπων എന്ന പ്രയോഗത്തിന്റെ ലിംഗവും വ്യാപ്തിയും
  choice: മനുഷ്യരിൽ ആർക്കും
  alternative: ഒരു മനുഷ്യനും
  rationale: ഗ്രീക്കിലെ ἀνθρώπων ഇവിടെ മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ സ്ത്രീപുരുഷന്മാരെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പ്രയോഗം സ്വീകരിച്ചു; വാക്യം ഒരു പ്രത്യേക ലിംഗത്തെക്കുറിച്ചുള്ള ഉപദേശമായി ചുരുക്കുന്നില്ല.
- issue: ἀκατάστατον എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: അടങ്ങാത്ത
  alternative: അസ്ഥിരമായ / ശാന്തിയില്ലാത്ത
  rationale: പദത്തിന് അസ്ഥിരം, ക്രമരഹിതം, അടങ്ങാത്തത് എന്നീ സമീപ അർഥങ്ങൾ സാധ്യമാണ്. നാവിനെ മെരുക്കാനാകില്ലെന്ന മുൻവാക്യത്തോടുള്ള ബന്ധത്തിൽ ‘അടങ്ങാത്ത’ അനുയോജ്യമെങ്കിലും മറ്റു സൂക്ഷ്മാർഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ നാവെന്ന രൂപകവും മെരുക്കുക എന്ന ക്രിയാബന്ധവും നിലനിർത്തിയിരിക്കുന്നു; അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി.
