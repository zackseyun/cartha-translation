id: JAS.3.13
reference: James 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: ml
  text: നിങ്ങളിൽ ജ്ഞാനിയും വിവേകിയുമായവൻ ആര്? അവൻ തന്റെ നല്ല ജീവിതരീതിയിലൂടെ, ജ്ഞാനത്തിൽനിന്നു വരുന്ന സൗമ്യതയോടെ[a], തന്റെ പ്രവൃത്തികൾ കാണിക്കട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജ്ഞാനത്തിന്റെ സൗമ്യതയോടെ.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “അവൻ ... കാണിക്കട്ടെ” എന്ന് പുരുഷലിംഗ ഏകവചനമാണ്; സമൂഹത്തിലെ അത്തരം ഏതു വ്യക്തിയെയും പ്രതിനിധീകരിക്കുന്ന പ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: നിങ്ങളിൽ ജ്ഞാനിയും വിവേകിയുമായവൻ ആര്?
  rationale: ചോദ്യം സമൂഹത്തിനുള്ളിൽ ജ്ഞാനവും പ്രായോഗിക വിവേകവും ഉള്ള വ്യക്തിയെ തിരിച്ചറിയാൻ ആവശ്യപ്പെടുന്നു. σοφός എന്നതിന് ‘ജ്ഞാനി’യും ἐπιστήμων എന്നതിന് ധാർമ്മിക-പ്രായോഗിക സന്ദർഭത്തിന് യോജിച്ച ‘വിവേകി’യും തിരഞ്ഞെടുത്തു.
- source_word: δειξάτω
  choice: കാണിക്കട്ടെ
  rationale: മൂന്നാം പുരുഷ ഏകവചനത്തിലുള്ള ആജ്ഞയുടെ പ്രബോധനസ്വരം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: തന്റെ നല്ല ജീവിതരീതിയിലൂടെ
  rationale: ἀναστροφή ഒറ്റപ്പെട്ട പെരുമാറ്റത്തേക്കാൾ വിശാലമായി ജീവിതനടപ്പിനെയും പതിവായ പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്നു; ἐκ ഇവിടെ പ്രകടമാക്കുന്ന മാർഗമോ ഉറവിടമോ അറിയിക്കുന്നു.
- source_word: τὰ ἔργα αὐτοῦ
  choice: തന്റെ പ്രവൃത്തികൾ
  rationale: ἔργα എന്നതിന്റെ സാധാരണ അർത്ഥവും യാക്കോബിലെ പ്രവൃത്തികളെക്കുറിച്ചുള്ള വിശാലമായ ആശയബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐν πραΰτητι σοφίας
  choice: ജ്ഞാനത്തിൽനിന്നു വരുന്ന സൗമ്യതയോടെ
  rationale: πραΰτης ശക്തിയില്ലായ്മയല്ല, നിയന്ത്രിതമായ സൗമ്യതയാണ്. σοφίας എന്ന ജനിറ്റീവിനെ ഉറവിടബന്ധമായി വായിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം സ്വീകരിച്ചു; ഘടനാപരമായി കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: പുരുഷലിംഗ ഏകവചന ആജ്ഞയും പ്രതിനിധാനാർഥവും
  choice: അവൻ ... കാണിക്കട്ടെ
  alternative: അങ്ങനെയുള്ളയാൾ ... കാണിക്കട്ടെ
  rationale: ഗ്രീക്കിൽ പുരുഷലിംഗ ഏകവചനം ഉണ്ടായതിനാൽ അത് മുഖ്യവാചകത്തിൽ സൂക്ഷിച്ചു. എന്നാൽ പ്രസ്താവന സമൂഹത്തിലെ അത്തരം ഏതു വ്യക്തിക്കും ബാധകമാണെന്ന പ്രതിനിധാനാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: σοφίας എന്ന ജനിറ്റീവിന്റെ ബന്ധം
  choice: ജ്ഞാനത്തിൽനിന്നു വരുന്ന സൗമ്യത
  alternative: ജ്ഞാനത്തിന്റെ സൗമ്യത
  rationale: ഇത് ഉറവിടജനിറ്റീവായോ ഗുണസൂചക ജനിറ്റീവായോ ഗ്രഹിക്കാം. മുഖ്യവാചകത്തിൽ ഉറവിടബന്ധം സ്വാഭാവികമായി അവതരിപ്പിച്ചെങ്കിലും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ പ്രബോധനശൈലി. ‘നല്ല ജീവിതരീതി’ എന്നത് ജീവിതനടപ്പിന്റെ വിശാലതയും ‘സൗമ്യത’ എന്നത് πραΰτης എന്ന ധാർമ്മികഗുണത്തിന്റെ നിയന്ത്രിത സ്വഭാവവും വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
