    reason: lexical_alternative
  - marker: d
    text: അഥവാ, ‘നിങ്ങളുടെ ഹൃദയത്തിൽ.’
    reason: previous_rendering
lexical_decisions:
- source_word: ζῆλον πικρὸν
  choice: കയ്പേറിയ അസൂയ
  rationale: ζῆλος എന്നതിന് സന്ദർഭമനുസരിച്ച് തീക്ഷ്ണത, അസൂയ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ἐριθεία എന്ന ദോഷത്തോടൊപ്പം നിഷേധാത്മകമായി വരുന്നതിനാൽ ‘അസൂയ’യാണ് മുഖ്യാർഥം; ‘കയ്പേറിയ’ πικρόν എന്ന വിശേഷണത്തെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐριθείαν
  choice: സ്വാർഥമോഹം
  rationale: സ്വന്തം നേട്ടം തേടുന്ന അതിമോഹത്തെയും അതിൽനിന്നുണ്ടാകുന്ന മത്സരവും വിഭാഗീയതയും ഈ പദം സൂചിപ്പിക്കാം. ‘സ്വാർഥമോഹം’ ആന്തരിക പ്രേരണയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളിൽ
  rationale: ഗ്രീക്കിൽ καρδίᾳ ഏകവചനവും ὑμῶν ബഹുവചനവുമുള്ള വിതരണപ്രയോഗമാണ്. ഒരു സമൂഹത്തെയാണ് അഭിസംബോധന ചെയ്യുന്നതെന്ന് ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കാൻ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: μὴ κατακαυχᾶσθε
  choice: വീമ്പുപറയുകയോ … അരുത്
  rationale: ക്രിയ അഹങ്കാരത്തോടെ പ്രശംസിക്കുകയോ മറ്റുള്ളവർക്കുമേൽ മേനി നടിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വീമ്പുപറയുക’ ഈ നിഷേധാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: സത്യത്തിനെതിരെ കള്ളം പറയുകയോ അരുത്
  rationale: ψεύδεσθε എന്നതിന്റെ ‘കള്ളം പറയുക’ എന്ന ക്രിയാർഥവും κατά + ഷഷ്ഠിയുടെ എതിർപ്പാർഥവും നിലനിർത്തുന്ന സുതാര്യമായ പരിഭാഷയാണിത്.
- source_word: εἰ δὲ
  choice: എന്നാൽ … ഉണ്ടെങ്കിൽ
  rationale: δέ മുൻവിവരണത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു, εἰ വ്യവസ്ഥയെ ‘ഉണ്ടെങ്കിൽ’ അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘സത്യം’ എന്നതിന്റെ വ്യാപ്തി
  choice: ഒരു പ്രത്യേക സിദ്ധാന്തസംവിധാനമായോ കേവലം വ്യക്തിപരമായ ആത്മാർഥതയായോ ചുരുക്കാതെ ‘സത്യം’ എന്നു പൊതുവായി നിലനിർത്തി.
  alternative: ‘സുവിശേഷസത്യം’; ‘ജ്ഞാനത്തിന്റെ സത്യമായ വഴി’; ‘സംസാരത്തിലെ സത്യസന്ധത’
  rationale: ἀλήθεια ഇവിടെ ദൈവത്തിന്റെ സത്യത്തെയും സ്വയംവഞ്ചനാപരമായ വീമ്പിനോടുള്ള അതിന്റെ എതിർപ്പിനെയും ഉൾക്കൊള്ളാവുന്നത്ര വിശാലമാണ്. വാക്യം പറയുന്നതിലധികം നിർവചിക്കുന്നത് അതിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കയ്പേറിയ അസൂയ,’ ‘സ്വാർഥമോഹം,’ ‘വീമ്പുപറയുക’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ നിഷേധാത്മക നൈതിക ഊന്നൽ നിലനിർത്തുന്നതുമാണ്. ഇരട്ട നിരോധനം മലയാളത്തിലെ സ്വാഭാവിക ‘…യുകയോ …യുകയോ അരുത്’ ഘടനയിൽ നൽകിയിരിക്കുന്നു.
