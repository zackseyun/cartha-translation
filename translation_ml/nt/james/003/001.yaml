id: JAS.3.1
reference: James 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: ml
  text: എന്റെ സഹോദരന്മാരേ,[a] നിങ്ങളിൽ പലരും അധ്യാപകരാകരുത്; നമുക്കു കൂടുതൽ കഠിനമായ ന്യായവിധി ലഭിക്കുമെന്ന് അറിഞ്ഞുകൊണ്ട് തന്നേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാരേ’ എന്ന ഈ അഭിസംബോധന സഹോദരിമാരെയും ഉൾപ്പെടുന്ന മുഴുവൻ സമൂഹത്തെയും ഉദ്ദേശിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ
  choice: നിങ്ങളിൽ അധികംപേർ ... അരുത്
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ വിലക്കിന്റെയും പ്രബോധനത്തിന്റെയും ശക്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; രണ്ടാംപുരുഷ ബഹുവചന അഭിസംബോധന സൂചിപ്പിക്കാൻ ‘നിങ്ങളിൽ’ ചേർത്തു.
- source_word: διδάσκαλοι
  choice: ഉപദേഷ്ടാക്കൾ
  rationale: സമൂഹത്തിൽ പഠിപ്പിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക സഭാപരമായ പദം; മൂലപാഠം നിർബന്ധിക്കാത്ത ഔദ്യോഗിക പദവി ഇതിൽ ചുമത്തുന്നില്ല.
- source_word: γίνεσθε
  choice: ആകരുത്
  rationale: γίνομαι എന്നതിന്റെ ‘ആകുക’ എന്ന അർഥം നിലനിർത്തി, അധ്യാപകപങ്കിലേക്കു കടക്കുന്നതിനെതിരായ വിലക്ക് പ്രകടമാക്കുന്നു.
- source_word: ἀδελφοί μου
  choice: എന്റെ സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചന അഭിസംബോധന മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; മുഴുവൻ സമൂഹത്തെയും ഉൾക്കൊള്ളാൻ സാധ്യതയുള്ള പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰδότες
  choice: അറിയുന്നുവല്ലോ
  rationale: ശ്രോതാക്കൾക്കറിയാവുന്ന കാര്യം അടിസ്ഥാനമാക്കിയുള്ള പ്രബോധനമെന്ന പങ്കാളിത്തരൂപത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μεῖζον
  choice: കൂടുതൽ കഠിനമായ
  rationale: κρίμαയോടൊപ്പം താരതമ്യപരമായ വർധിച്ച ഗൗരവമോ കർശനതയോ സൂചിപ്പിക്കുന്നു; വെറും അളവിലുള്ള ‘വലിയ’ എന്ന പ്രയോഗത്തേക്കാൾ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: κρίμα
  choice: ന്യായവിധി
  rationale: ‘ശിക്ഷാവിധി’ അല്ലെങ്കിൽ ‘നിത്യശിക്ഷ’ എന്ന് മുൻകൂട്ടി നിർണയിക്കാതെ വിധിനിർണയത്തിന്റെ വിശാലമായ അർഥവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: λημψόμεθα
  choice: നമുക്ക് ... ലഭിക്കും
  rationale: ആദ്യപുരുഷ ബഹുവചനം നിലനിർത്തി, എഴുത്തുകാരനും അധ്യാപകരുടെ ഉത്തരവാദിത്തത്തിൽ ഉൾപ്പെടുന്നു എന്ന പാഠസൂചന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἀδελφοί μου എന്നതിന്റെ പരിധി
  choice: മുഖ്യപാഠത്തിൽ ‘എന്റെ സഹോദരങ്ങളേ’ എന്ന് നൽകി, ഉൾക്കൊള്ളുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘എന്റെ സഹോദരീസഹോദരങ്ങളേ’
  rationale: രൂപപരമായ പുരുഷലിംഗം മറച്ചുവയ്ക്കാതെ നിലനിർത്തുകയും, ഈ സംബോധന വിശ്വാസസമൂഹത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാൻ സാധ്യതയുണ്ടെന്ന പ്രയോഗാർഥം രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
- issue: μεῖζον κρίμα എന്ന മുന്നറിയിപ്പിന്റെ ശക്തി
  choice: ‘കൂടുതൽ കഠിനമായ ന്യായവിധി’
  alternative: ‘വലിയ ന്യായവിധി’; ‘കൂടുതൽ കർശനമായ ന്യായവിധി’; ‘കഠിനമായ ശിക്ഷാവിധി’
  rationale: താരതമ്യത്തിന്റെ ശക്തി വ്യക്തമാക്കുന്നു; അതേസമയം κρίμαയെ അന്തിമ ശിക്ഷാവിധിയായി ചുരുക്കാതെ അധ്യാപകരുടെ വർധിച്ച ഉത്തരവാദിത്തത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പ് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അഭിസംബോധനയും വാക്യഘടനയും ഉപയോഗിച്ചു. ‘ഉപദേഷ്ടാക്കൾ’ സഭാസന്ദർഭത്തിൽ എളുപ്പം മനസ്സിലാകുന്നതും അതിരുകടന്ന ഔദ്യോഗികത ഒഴിവാക്കുന്നതുമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട മുഖ്യപാഠത്തിലെ അഭിസംബോധനയ്ക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
