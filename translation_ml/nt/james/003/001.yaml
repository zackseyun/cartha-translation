  to: എന്റെ സഹോദരന്മാരേ,[a] നിങ്ങളിൽ പലരും അധ്യാപകരാകരുത്; നമുക്കു കൂടുതൽ കഠിനമായ ന്യായവിധി ലഭിക്കുമെന്ന് അറിഞ്ഞുകൊണ്ട് തന്നേ.
