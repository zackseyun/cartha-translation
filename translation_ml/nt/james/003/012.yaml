id: JAS.3.12
reference: James 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: ml
  text: എന്റെ സഹോദരന്മാരേ[a], അത്തിമരത്തിന് ഒലിവുപഴങ്ങൾ കായ്ക്കാനോ മുന്തിരിവള്ളിക്ക് അത്തിപ്പഴങ്ങൾ കായ്ക്കാനോ കഴിയുമോ? ഉപ്പുവെള്ളത്തിൽനിന്ന് ശുദ്ധജലം[b] ഉളവാകുകയുമില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ സഹോദരീസഹോദരന്മാരേ.’ ഗ്രീക്കിൽ പുല്ലിംഗ ബഹുവചനമായ ‘സഹോദരന്മാർ’ എന്നാണ്; ഈ രൂപം സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടുന്ന ഒരു കൂട്ടത്തെ അഭിസംബോധന ചെയ്യാനും ഉപയോഗിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘മധുരമുള്ള വെള്ളം’; ഇവിടെ ഉപ്പുവെള്ളത്തിന് വിപരീതമായി ‘ശുദ്ധജലം’ എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: c
    text: അവസാന ഉപവാക്യം ഗ്രീക്കിൽ സംക്ഷിപ്തവും അധ്യാഹൃതപദമുള്ളതുമാണ്. മുൻവാക്യത്തിലെ ഉറവയുടെ ദൃശ്യരൂപത്തിന്റെ വെളിച്ചത്തിൽ, ‘ഉപ്പുറവയ്ക്ക് ശുദ്ധജലം പുറപ്പെടുവിക്കാനും കഴിയില്ല’ എന്നും ഇതിനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധന നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടുന്ന സമൂഹത്തെ അഭിസംബോധന ചെയ്യാനാകുന്നതിനാൽ ഉൾക്കൊള്ളുന്ന വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μὴ δύναται
  choice: കഴിയുമോ?
  rationale: μή കൊണ്ട് തുടങ്ങുന്ന ഈ അലങ്കാരചോദ്യം നിഷേധാത്മക ഉത്തരമാണ് പ്രതീക്ഷിക്കുന്നത്. മലയാളത്തിലെ സ്വാഭാവികമായ ചോദ്യരൂപം അതേ പ്രഭാവം നിലനിർത്തുന്നു.
- source_word: συκῆ
  choice: അത്തിമരം
  rationale: ഈ നാമം പഴത്തെയല്ല, മരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘അത്തിമരം’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: ἐλαίας ποιῆσαι
  choice: ഒലിവുപഴങ്ങൾ കായ്ക്കുക
  rationale: ഫലവൃക്ഷത്തിന്റെ കാര്യത്തിൽ ποιέω എന്നത് ഫലം ഉളവാക്കുക എന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ ‘കായ്ക്കുക’ എന്നതാണ് സ്വാഭാവിക പ്രയോഗം.
- source_word: ἄμπελος
  choice: മുന്തിരിവള്ളി
  rationale: ഉദ്ദേശിക്കുന്നത് മുന്തിരി കായ്ക്കുന്ന വള്ളിയാണെന്ന് വ്യക്തമായി അറിയിക്കുകയും കാർഷിക ദൃശ്യരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: σῦκα
  choice: അത്തിപ്പഴങ്ങൾ
  rationale: അത്തിപ്പഴം എന്ന ഫലത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന് നേരിട്ടുള്ള മലയാളസമാനം.
- source_word: οὔτε ἁλυκὸν
  choice: ഉപ്പുവെള്ളത്തിന് ... ഉളവാക്കാനും കഴിയില്ല
  rationale: ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും അധ്യാഹൃതപദമുള്ളതുമാണ്; ἁλυκόν ‘ഉപ്പുള്ളത്’ എന്ന വിശേഷണം നാമമായി ഉപയോഗിക്കുന്നു. മുഖ്യപാഠം ഉറവെന്ന് അധികമായി വ്യക്തമാക്കാതെ ഉപ്പുവെള്ളം എന്ന ആശയം നൽകുന്നു.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: ശുദ്ധജലം ഉളവാക്കുക
  rationale: γλυκύς അക്ഷരാർഥത്തിൽ ‘മധുരമുള്ള’ എന്നാണ്; എന്നാൽ വെള്ളത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ഉപ്പുവെള്ളത്തിന് വിപരീതമായ ശുദ്ധജലത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
