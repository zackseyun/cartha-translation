id: JAS.3.17
reference: James 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: ml
  text: എന്നാൽ മുകളിൽനിന്നുള്ള ജ്ഞാനം ആദ്യം നിർമലമാണ്; പിന്നെ സമാധാനപ്രിയവും സൗമ്യവും വഴങ്ങുന്നതും കരുണയും നല്ല ഫലങ്ങളും നിറഞ്ഞതും പക്ഷപാതമില്ലാത്തതും[a] കപടമില്ലാത്തതുമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവിഭക്തമായത്”; ഗ്രീക്ക് പദത്തിന് “ചാഞ്ചാട്ടമോ സംശയമോ ഇല്ലാത്തത്” എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: ഉയരത്തിൽനിന്നുള്ള
  rationale: ‘മുകളിൽനിന്നുള്ള’ എന്ന സ്ഥലരൂപകം നിലനിർത്തിക്കൊണ്ട്, 3:15-ലെ ഭൗമിക ജ്ഞാനത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ‘സ്വർഗത്തിൽനിന്നുള്ള’ എന്ന് അതിവ്യാഖ്യാനം ചെയ്യുന്നില്ല.
- source_word: σοφία
  choice: ജ്ഞാനം
  rationale: സന്ദർഭത്തിലെ ജ്ഞാനത്തിന്റെ സ്വഭാവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സ്ഥിരവുമായ മലയാള പദം.
- source_word: πρῶτον μὲν ... ἔπειτα
  choice: ഒന്നാമതായി ... പിന്നെ
  rationale: ഗ്രീക്കിലെ ക്രമസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἁγνή
  choice: നിർമലം
  rationale: ലൈംഗികശുദ്ധിയിലേക്ക് മാത്രം ചുരുക്കാതെ ധാർമിക ശുദ്ധിയും കലർപ്പില്ലായ്മയും പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰρηνική
  choice: സമാധാനപ്രിയം
  rationale: ശാന്തമായ അവസ്ഥയെക്കാൾ സമാധാനം തേടുന്ന പ്രവണതയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: ἐπιεικής
  choice: സൗമ്യം
  rationale: മൃദുത്വം, പരിഗണന, വിട്ടുവീഴ്ചയുള്ള ന്യായബോധം എന്നിവ ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദം.
- source_word: εὐπειθής
  choice: പറയുന്നത് കേൾക്കാൻ മനസ്സുള്ളത്
  rationale: അന്ധമായ അനുസരണമല്ല, ന്യായമായ വാക്ക് കേൾക്കാനും അംഗീകരിക്കാനും തയ്യാറായ, പിടിവാശിയില്ലാത്ത മനോഭാവം വ്യക്തമാക്കുന്നു.
- source_word: μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν
  choice: കരുണയും നല്ല ഫലങ്ങളും നിറഞ്ഞത്
  rationale: ‘നിറഞ്ഞത്’ എന്ന സമൃദ്ധിയുടെ ആശയവും ‘ഫലങ്ങൾ’ എന്ന മൂലരൂപകവും നിലനിർത്തുന്നു.
- source_word: ἀδιάκριτος
  choice: പക്ഷപാതമില്ലാത്തത്
  rationale: യാക്കോബ് 2-ലെ പക്ഷഭേദവിരുദ്ധ പ്രമേയത്തോടും ഈ ധാർമിക ഗുണപ്പട്ടികയോടും നന്നായി ചേരുന്നു; പദത്തിന്റെ മറ്റു സാധുവായ അർത്ഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀνυπόκριτος
  choice: കപടമില്ലാത്തത്
  rationale: ഭാവനാട്യമോ ഇരട്ടത്താപ്പോ ഇല്ലാത്ത യഥാർഥതയെ മൂലപദത്തോട് അടുത്തും സ്വാഭാവികമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: ἀδιάκριτος എന്ന പദത്തിന്റെ വ്യാഖ്യാനം
  choice: പക്ഷപാതമില്ലാത്തത്
  alternative: ഭിന്നതയില്ലാത്തത്; ചാഞ്ചാട്ടമോ സംശയമോ ഇല്ലാത്തത്
  rationale: ധാർമിക ഗുണങ്ങളുടെ ഈ പട്ടികയിലും യാക്കോബ് 2:1–4-ലെ പക്ഷപാതവിരുദ്ധ പശ്ചാത്തലത്തിലും ‘പക്ഷപാതമില്ലാത്തത്’ ഏറ്റവും യോജിക്കുന്നു. എന്നാൽ യാക്കോബ് 1:6–8; 4:8 എന്നിവ കാരണം ‘ഭിന്നതയില്ലാത്തത്’ അഥവാ ‘സംശയമില്ലാത്തത്’ എന്ന സാധ്യതയും നിലനിൽക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ ശൈലി. ഗ്രീക്കിലെ ഗുണപ്പട്ടികയുടെ താളവും നാമവിശേഷണ ഘടനയും കഴിയുന്നത്ര നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം തർക്കവിധേയമായ ἀδιάκριτος-ന്റെ വിവർത്തനത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
