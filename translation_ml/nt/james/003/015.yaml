id: JAS.3.15
reference: James 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: ml
  text: ഈ ജ്ഞാനം മുകളിൽനിന്ന് ഇറങ്ങിവരുന്നതല്ല; മറിച്ച് ഭൗമികവും ആത്മികമല്ലാത്തതും[a] പൈശാചികവുമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രാകൃതമായത്.’ ഗ്രീക്ക് വിശേഷണം ആത്മികമായതിനോട് വിപരീതമായി, കേവലം സ്വാഭാവികജീവനോടു ബന്ധപ്പെട്ടതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: ഈ ജ്ഞാനം
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച ജ്ഞാനത്തെയാണ് നിർദേശകസർവനാമം ചൂണ്ടിക്കാണിക്കുന്നത്; നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἄνωθεν
  choice: മുകളിൽനിന്ന്
  rationale: ദൈവിക ഉത്ഭവത്തിന്റെ ധ്വനി നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്കിലെ സ്ഥാനസൂചന നേരിട്ട് പകരുന്നു; ‘സ്വർഗത്തിൽനിന്ന്’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: κατερχομένη
  choice: ഇറങ്ങിവരുന്നതല്ല
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടർച്ചാഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἐπίγειος
  choice: ഭൗമികം
  rationale: ‘മുകളിൽനിന്ന്’ എന്നതിനോടുള്ള ഭൂമി–മുകൾ വൈരുധ്യം നിലനിർത്തുന്നു; ‘ലൗകികം’ നൽകാവുന്ന അധിക നൈതികധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ψυχική
  choice: ആത്മികമല്ലാത്തത്
  rationale: ψυχικός ഇവിടെ ആത്മാവിനോടു ബന്ധപ്പെട്ടതിനോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു. വായനാസൗകര്യമുള്ള ഈ രൂപം നിഷേധാത്മക ശക്തി വ്യക്തമാക്കുന്നു; ‘പ്രാകൃതം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: δαιμονιώδης
  choice: പൈശാചികം
  rationale: ദുഷ്ടാത്മാക്കളോടു ബന്ധപ്പെട്ടതോ അവയുടെ സ്വഭാവമുള്ളതോ എന്ന ശക്തമായ അർഥം സംക്ഷിപ്തവും സാധാരണവുമായ മലയാളത്തിൽ പകരുന്നു.
theological_decisions:
- issue: ψυχική എന്നതിലെ ആത്മിക–സ്വാഭാവിക വൈരുധ്യം
  choice: ആത്മികമല്ലാത്തത്
  alternative: പ്രാകൃതം; കേവലം സ്വാഭാവികജീവനോടു ബന്ധപ്പെട്ടത്
  rationale: ദൈവികമായ ‘മുകളിൽനിന്നുള്ള’ ജ്ഞാനത്തോടുള്ള നിഷേധാത്മക വൈരുധ്യം സന്ദർഭത്തിൽ പ്രധാനമാണ്. അതേസമയം ഈ പദത്തെ ഒരു പ്രത്യേക സിദ്ധാന്തസംവിധാനത്തിലേക്ക് ചുരുക്കാതെ അതിന്റെ ‘സ്വാഭാവിക ജീവൻ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂന്നു ഗ്രീക്ക് വിശേഷണങ്ങളുടെ കുത്തിനിറച്ച നിഷേധാത്മക ക്രമം ‘ഭൗമികവും ആത്മികമല്ലാത്തതും പൈശാചികവുമാണ്’ എന്ന സമാന്തര ഘടനയിൽ നിലനിർത്തി.
