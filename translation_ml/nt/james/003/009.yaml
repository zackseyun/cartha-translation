id: JAS.3.9
reference: James 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: ml
  text: അതേ നാവുകൊണ്ട് നാം കർത്താവിനെയും പിതാവിനെയും വാഴ്ത്തുന്നു[a]; അതേ നാവുകൊണ്ടുതന്നെ ദൈവത്തിന്റെ സാദൃശ്യപ്രകാരം സൃഷ്ടിക്കപ്പെട്ട മനുഷ്യരെ[b] നാം ശപിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കർത്താവും പിതാവുമായവനെ.’ ഗ്രീക്ക് പ്രയോഗം ‘കർത്താവും പിതാവും’ എന്നത് ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സമാനാധികരണ പ്രയോഗമായോ ദൈവത്തിനുള്ള ചേർന്നൊരു അഭിധാനമായോ മനസ്സിലാക്കാൻ അനുവദിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘മനുഷ്യജീവികളെ’; ഗ്രീക്ക് പദം ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: അതേ നാവുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിലെ ‘നാവ്’ എന്ന പദത്തെയാണ് സ്ത്രീലിംഗ സർവനാമം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ഉപകരണാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അതേ നാവുകൊണ്ട്’ എന്നു നൽകി.
- source_word: εὐλογοῦμεν
  choice: നാം ... വാഴ്ത്തുന്നു
  rationale: ദൈവത്തെ അഭിമുഖീകരിച്ചുള്ള εὐλογέω എന്ന ക്രിയയ്ക്ക് ‘വാഴ്ത്തുന്നു’ സ്വാഭാവികവും ഭക്തിപൂർണവുമായ മലയാളമാണ്; ‘അനുഗ്രഹിക്കുന്നു’ എന്നത് ഇവിടെ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാം.
- source_word: τὸν κύριον καὶ πατέρα
  choice: കർത്താവും പിതാവുമായവനെ
  rationale: ഒരേ വ്യക്തിയെ ‘കർത്താവ്’, ‘പിതാവ്’ എന്നീ വിശേഷണങ്ങളാൽ വിളിക്കുന്ന സാധ്യത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: καταρώμεθα
  choice: നാം ശപിക്കുകയും ചെയ്യുന്നു
  rationale: ‘വാഴ്ത്തുന്നു’ എന്നതിനോടുള്ള ശക്തമായ നൈതിക വൈരുധ്യം നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: τοὺς ἀνθρώπους
  choice: മനുഷ്യരെ
  rationale: ഇവിടെ പദം പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: ദൈവത്തിന്റെ സാദൃശ്യപ്രകാരം
  rationale: κατά എന്നതിന്റെ മാനദണ്ഡാർഥവും ഉല്പത്തി വിവരണത്തോടുള്ള പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: γεγονότας
  choice: സൃഷ്ടിക്കപ്പെട്ട
  rationale: മനുഷ്യർ ദൈവസാദൃശ്യത്തിൽ ഉണ്ടായവരാണെന്ന സൃഷ്ടിസന്ദർഭം വ്യക്തമാക്കുന്നു; കർത്താവ് പരോക്ഷമായി ദൈവമാണെന്ന ആശയവും യോജിക്കുന്നു.
theological_decisions:
- issue: τοὺς ἀνθρώπους എന്നതിന്റെ പൊതുവായ മനുഷ്യസൂചന
  choice: മനുഷ്യരെ
  alternative: പുരുഷന്മാരെ
  rationale: വാക്യം ദൈവസാദൃശ്യത്തിൽ സൃഷ്ടിക്കപ്പെട്ട മനുഷ്യരെ പൊതുവായി ഉദ്ദേശിക്കുന്നു; പുരുഷന്മാരിൽ മാത്രം അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: ‘കർത്താവും പിതാവും’ തമ്മിലുള്ള ബന്ധം
  choice: കർത്താവും പിതാവുമായവനെ
  alternative: കർത്താവിനെയും പിതാവിനെയും
  rationale: ഏകവചന നിർദേശപദത്തോടുകൂടിയ ഗ്രീക്ക് പദസംയോജനം ഒരേ ദൈവത്തെ ഇരട്ട വിശേഷണത്തിലൂടെ വിളിക്കുന്നതായി വായിക്കാം. എങ്കിലും പദാനുപദ രൂപത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി, അനിശ്ചിതത്വം പൂർണമായി മറച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മുൻവാക്യങ്ങളിലെ നാവിനെ വ്യക്തമാക്കാൻ സർവനാമത്തിനു പകരം ‘അതേ നാവ്’ ആവർത്തിച്ചു; വാഴ്ത്തലും ശാപവും തമ്മിലുള്ള വാചകസമാന്തര്യം നിലനിർത്തി.
