id: JAS.3.4
reference: James 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: ml
  text: 'കപ്പലുകളെയും നോക്കൂ: അവ അത്ര വലുതും ശക്തമായ കാറ്റുകളാൽ തള്ളിക്കൊണ്ടുപോകപ്പെടുന്നവയുമാണെങ്കിലും, കപ്പൽ നിയന്ത്രിക്കുന്നവൻ ആഗ്രഹിക്കുന്നിടത്തേക്ക് വളരെ ചെറിയൊരു ചുക്കാൻകൊണ്ട് അവയെ തിരിക്കുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥമായി: “കപ്പൽ നിയന്ത്രിക്കുന്നവന്റെ പ്രേരണ ഇച്ഛിക്കുന്നിടത്തേക്ക്.”'
    reason: ὁρμή (‘പ്രേരണ, ചായ്‌വ്’) എന്ന നാമവും βούλεται (‘ഇച്ഛിക്കുന്നു’) എന്ന ക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സവിശേഷത സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: കപ്പലുകളെയും നോക്കൂ
  rationale: ἰδού എന്ന ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗവും, മുമ്പത്തെ ഉദാഹരണത്തോടു മറ്റൊന്ന് ചേർക്കുന്ന καί-യുടെ ധർമ്മവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τηλικαῦτα ὄντα
  choice: അവ അത്ര വലുതും … ആണെങ്കിലും
  rationale: കപ്പലുകളുടെ ശ്രദ്ധേയമായ വലുപ്പവും ചെറിയ ചുക്കാനുമായുള്ള വിരോധവും concessive ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: ശക്തമായ കാറ്റുകളാൽ തള്ളിക്കൊണ്ടുപോകപ്പെടുന്നവ
  rationale: σκληρός ഇവിടെ കാറ്റിന്റെ ശക്തിയെ സൂചിപ്പിക്കുന്നു; passive രൂപമായ ἐλαυνόμενα-യുടെ ബലം നിലനിർത്തുന്നു.
- source_word: μετάγεται
  choice: അവയെ തിരിക്കുന്നു
  rationale: ചുക്കാന്റെ നാവികസന്ദർഭത്തിൽ കപ്പലിന്റെ ഗതി തിരിച്ചുവിടുന്നതാണ് ക്രിയയുടെ ആശയം; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സജീവവാക്യരൂപം ഉപയോഗിച്ചു.
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: വളരെ ചെറിയൊരു ചുക്കാൻകൊണ്ട്
  rationale: ἐλάχιστος നൽകുന്ന അത്യന്തം ചെറുതെന്ന ഊന്നൽ സ്വാഭാവികമായി നൽകുകയും πηδάλιον-നെ കൃത്യമായ നാവികപദമായ ‘ചുക്കാൻ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: കപ്പൽ നിയന്ത്രിക്കുന്നവൻ ആഗ്രഹിക്കുന്നിടത്തേക്ക്
  rationale: ഗ്രീക്കിലെ അസാധാരണമായ ‘നിയന്ത്രിക്കുന്നവന്റെ പ്രേരണ ഇച്ഛിക്കുന്നിടത്തേക്ക്’ എന്ന ഘടനയുടെ ഉദ്ദേശ്യാർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ὁρμήയും βούλεταιയും ചേർന്ന അസാധാരണമായ ഇച്ഛാ-പ്രയോഗം
  choice: കപ്പൽ നിയന്ത്രിക്കുന്നവൻ ആഗ്രഹിക്കുന്നിടത്തേക്ക്
  alternative: കപ്പൽ നിയന്ത്രിക്കുന്നവന്റെ പ്രേരണ ഇച്ഛിക്കുന്നിടത്തേക്ക്
  rationale: ഇവിടെ പ്രത്യേക സിദ്ധാന്തപരമായ അർഥം ചുമത്താതെ കപ്പൽ നിയന്ത്രിക്കുന്നയാളുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു. അതേസമയം, ὁρμή എന്ന നാമത്തിന്റെ ‘പ്രേരണ/ചായ്‌വ്’ എന്ന ഭാവവും ഗ്രീക്കിലെ വ്യാകരണപരമായ സംഘർഷവും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘ചുക്കാൻ’ എന്ന സാധാരണ നാവികപദം സ്വീകരിച്ചു. ഗ്രീക്കിലെ നീണ്ട participial ഘടന മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ള concessive വാക്യമായി പുനഃക്രമീകരിച്ചു.
