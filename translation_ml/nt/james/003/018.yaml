  text: καρπὸς ⸀δὲ δικαιοσύνης ἐν εἰρήνῃ σπείρεται τοῖς ποιοῦσιν εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: ml
  text: നീതിയുടെ ഫലം[a] സമാധാനത്തിൽ സമാധാനം ഉണ്ടാക്കുന്നവരാൽ വിതയ്ക്കപ്പെടുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായത്തിന്റെ ഫലം.’ ഗ്രീക്ക് പദത്തിന് ധാർമികമായ നേരിനോടൊപ്പം ബന്ധപരവും നിയമപരവുമായ ന്യായത്തിന്റെ അർത്ഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സമാധാനം ഉണ്ടാക്കുന്നവർക്കായി.’ ഗ്രീക്കിലെ ദാതൃവിഭക്തിയെ ഇങ്ങനെയും ഗ്രഹിക്കാം; എങ്കിലും കർമണി ക്രിയയോടൊപ്പം ‘സമാധാനം ഉണ്ടാക്കുന്നവരാൽ’ എന്ന കർത്തൃസൂചനയാണ് കൂടുതൽ സ്വാഭാവികം.
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: ഫലം
  rationale: ഏകവചന നാമത്തിന്റെ അടിസ്ഥാനരൂപകവും വിതയ്ക്കൽ എന്ന ചിത്രവും നിലനിർത്തുന്നു; ‘വിളവ്’ സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: δὲ
  choice: വാക്യക്രമത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മൃദുവായ ബന്ധകമാണ്. സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ’ ചേർക്കുന്നത് അനാവശ്യമായ വിരോധഭാവം സൃഷ്ടിക്കും.
- source_word: δικαιοσύνης
  choice: നീതിയുടെ
  rationale: δικαιοσύνηയുടെ ധാർമികവും ബന്ധപരവും ന്യായപരവുമായ അർത്ഥവ്യാപ്തി ഒരു പരിധിവരെ നിലനിർത്തുന്ന സാധാരണ മലയാള പദമാണ്.
- source_word: ἐν εἰρήνῃ
  choice: സമാധാനത്തിൽ
  rationale: വിതയ്ക്കലിന്റെ രീതിയെയോ സാഹചര്യത്തെയോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ തുറന്ന അർത്ഥം പരമാവധി നിലനിർത്തുന്നു.
- source_word: σπείρεται
  choice: വിതയ്ക്കുന്നത്
  rationale: വർത്തമാനകാല കർമണി ക്രിയയുടെ ആശയം മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: സമാധാനം ഉണ്ടാക്കുന്നവർ
  rationale: ποιέω + εἰρήνην എന്ന വ്യക്തമായ ക്രിയാപ്രയോഗം നിലനിർത്തുന്നു. കർമണി ക്രിയയോടൊപ്പം കർത്തൃസൂചനയായി വായിക്കുന്നതാണ് പ്രധാന പാഠം; ദാതൃവിഭക്തിയുടെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ‘നീതിയുടെ ഫലം’ എന്നതിന്റെ അർത്ഥം
  choice: നീതിയാൽ സ്വഭാവം പ്രാപിച്ച ഫലം/വിളവ് എന്ന അർത്ഥം നിർണ്ണയിക്കാതെ വാക്യഘടന നിലനിർത്തി
  alternative: നീതിയായി തീരുന്ന വിളവ്; നീതി ഉളവാക്കുന്ന ഫലം
  rationale: δικαιοσύνης എന്ന ഷഷ്ഠീവിഭക്തി വിവരണാത്മകമായോ സമാനാധികരണപരമായോ ഫലസൂചകമായോ ഗ്രഹിക്കാം. മലയാള പരിഭാഷ ഈ ദൈവശാസ്ത്രപരമായ അർത്ഥതീവ്രതയെ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വിതയ്ക്കൽ–ഫലം എന്ന രൂപകം നിലനിർത്തി; സമാധാനം എന്ന ആവർത്തനവും മൂലപാഠത്തിനനുസരിച്ച് സംരക്ഷിച്ചു.
