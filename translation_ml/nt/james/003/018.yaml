  source_fidelity: 'The draft reverses the Greek passive construction: σπείρεται means “is sown,” whereas “സമാധാനം ഉണ്ടാക്കുന്നവർ ... വിതയ്ക്കുന്നത്” makes the peacemakers the explicit active subject and makes “നീതിയുടെ ഫലം” the predicate. The agentive reading of τοῖς ποιοῦσιν εἰρήνην can be represented directly in Malayalam with “-വരാൽ.”'
