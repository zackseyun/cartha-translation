reference: James 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: ml
  text: നാവും ഒരു തീയാണ്. അധർമ്മത്തിന്റെ ഒരു ലോകമായി നാവ് നമ്മുടെ അവയവങ്ങൾക്കിടയിൽ സ്ഥിതിചെയ്യുന്നു; അത് ശരീരം മുഴുവനും കറപിടിപ്പിക്കുകയും[a] ജനനത്തിന്റെ ചക്രത്തിന് തീകൊളുത്തുകയും[b] ഗെഹെന്നയാൽ തീകൊളുത്തപ്പെടുകയും ചെയ്യുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശരീരം മുഴുവനും മലിനമാക്കുകയും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ജീവിതഗതിക്ക്’ അല്ലെങ്കിൽ ‘ജീവിതചക്രത്തിന്.’
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിലുള്ള പദം ‘ഗെഹെന്ന’ എന്നാണ്; പരമ്പരാഗതമായി ‘നരകം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: നാവ്
  rationale: സന്ദർഭത്തിലുടനീളം ശരീരാവയവത്തിന്റെ ദൃശ്യരൂപകം നിലനിൽക്കുന്നതിനാൽ അക്ഷരാർഥത്തിലുള്ള പദം ഉപയോഗിച്ചു; അതോടൊപ്പം സംസാരത്തെയും പരോക്ഷമായി സൂചിപ്പിക്കുന്നു.
- source_word: πῦρ
  choice: ഒരു തീ
  rationale: നാവിന്റെ നശീകരണശക്തിയെ വ്യക്തമാക്കുന്ന നാമരൂപകം നിലനിർത്തുന്നു.
- source_word: ὁ κόσμος τῆς ἀδικίας
  choice: അധർമ്മത്തിന്റെ ഒരു ലോകം
  rationale: ഗ്രീക്കിലെ ശക്തവും അസാധാരണവുമായ പ്രയോഗം ‘തിന്മ നിറഞ്ഞത്’ എന്നു ലളിതമാക്കാതെ നിലനിർത്തി; ἀδικίαയുടെ വിശാലമായ ധാർമിക അർഥത്തിന് ‘അധർമ്മം’ യോജിക്കുന്നു.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: നമ്മുടെ അവയവങ്ങൾക്കിടയിൽ സ്ഥിതിചെയ്യുന്നു
  rationale: നാവിന് ശരീരാവയവങ്ങൾക്കിടയിലുള്ള സ്ഥാനവും നിലയും ഉണ്ടെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ആരാണ് അതിനെ സ്ഥാപിച്ചത് എന്നു വാചകം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: σπιλοῦσα ὅλον τὸ σῶμα
  choice: ശരീരം മുഴുവനും കറപിടിപ്പിക്കുകയും
  rationale: ശാരീരിക കറയുടെ രൂപകവും ധാർമിക മലിനീകരണത്തിന്റെ സൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: φλογίζουσα
  choice: തീകൊളുത്തുകയും
  rationale: തീയുടെ ആവർത്തിത രൂപകം വ്യക്തവും സ്വാഭാവികവുമായി സൂക്ഷിക്കുന്നു.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: ജീവിതചക്രം
  rationale: τροχός എന്ന ചക്രരൂപകവും γένεσις സൂചിപ്പിക്കുന്ന ജനനം മുതൽ നീളുന്ന ജീവിതഗതിയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; പദപ്രയോഗത്തിന്റെ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: φλογιζομένη ὑπὸ τῆς γεέννης
  choice: അതിന് ഗെഹെന്നയാണ് തീകൊളുത്തുന്നത്
  rationale: നാവിന്റെ ജ്വലനത്തിന് പുറത്തുനിന്നുള്ള ഉറവിടമുണ്ടെന്ന ഗ്രീക്ക് കർമണിപ്രയോഗം വ്യക്തമായി നൽകുകയും γέεννα എന്ന പ്രത്യേക പദം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: γέεννα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഗെഹെന്ന
  alternative: നരകം
  rationale: മൂലഗ്രീക്കിലെ പ്രത്യേക ചരിത്ര-ഭൗമിക പദം നിലനിർത്തുന്നത് പിന്നീട് രൂപപ്പെട്ട വിശാലമായ ദൈവശാസ്ത്ര ആശയങ്ങളെ വാക്യത്തിലേക്ക് മുൻകൂട്ടി കൊണ്ടുവരുന്നത് ഒഴിവാക്കുന്നു; പരമ്പരാഗത പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: τὸν τροχὸν τῆς γενέσεως എന്ന ദുഷ്കരമായ പ്രയോഗം
  choice: ജീവിതചക്രം
  alternative: ജീവിതഗതി; ജനനചക്രം
  rationale: ചക്രത്തിന്റെ രൂപകം സംരക്ഷിക്കുമ്പോൾ മനുഷ്യജീവിതത്തിന്റെ മുഴുവൻ പ്രവാഹമെന്ന സാധ്യതയും വായനാസൗകര്യവും നിലനിർത്തുന്നു; ഏക വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അധർമ്മത്തിന്റെ ഒരു ലോകം’ എന്ന അസാധാരണ രൂപകവും തീയുടെ ആവർത്തനവും മൂലപാഠത്തിന്റെ തീവ്രതയ്ക്കായി മനപ്പൂർവം നിലനിർത്തിയിരിക്കുന്നു.
