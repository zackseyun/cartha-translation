  naturalness: The Malayalam is generally modern and readable. Recasting the final clause as «ഗെഹെന്നയാൽ തീകൊളുത്തപ്പെടുകയും ചെയ്യുന്നു» makes the participial sequence parallel and unambiguously identifies the tongue as the entity acted upon.
