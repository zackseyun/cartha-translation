  rationale: മുഖ്യപാഠത്തിന്റെ ഘടനയും ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും നിലനിർത്തിയിരിക്കുന്നു. ചെറിയ ഭേദഗതികൾ അടിക്കുറിപ്പിനെ കൂടുതൽ സ്വാഭാവികവും പദാർത്ഥകേന്ദ്രിതവുമാക്കുകയും പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം സ്വീകരിക്കുകയും ചെയ്യുന്നു.
