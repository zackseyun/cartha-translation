  naturalness: മുഖ്യപാഠം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. നിലവിലെ അടിക്കുറിപ്പിൽ മാത്രം ‘നീതിമാനെന്നു സ്ഥാപിക്കപ്പെട്ടില്ലയോ?’ എന്ന രൂപം പദാർത്ഥവിശദീകരണമായി അല്പം അസ്വാഭാവികമാണ്; അതിനെ ക്രിയാർഥസാധ്യതയായ പ്രസ്താവനാരൂപത്തിൽ നൽകുന്നതാണ് കൂടുതൽ തെളിമയുള്ളത്.
  terminology: ‘നമ്മുടെ പിതാവ്,’ ‘പ്രവൃത്തികളാൽ,’ ‘നീതീകരിക്കപ്പെട്ടു,’ ‘യാഗപീഠം’ എന്നിവ യോജിച്ച പദങ്ങളാണ്. ‘ഇസ്ഹാക്ക്’ എന്ന രൂപം ഗ്രീക്ക് Ἰσαὰκ-നോടും സമകാലിക മലയാള ബൈബിൾ ഉപയോഗത്തോടും കൂടുതൽ ഒത്തുപോകുന്നു.
