id: JAS.2.21
reference: James 2:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: ml
  text: നമ്മുടെ പിതാവായ അബ്രാഹാം തന്റെ മകനായ ഇസ്ഹാക്കിനെ യാഗപീഠത്തിന്മേൽ അർപ്പിച്ചപ്പോൾ പ്രവൃത്തികളാൽ നീതീകരിക്കപ്പെട്ടില്ലയോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീതിമാനെന്നു തെളിയിക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘നീതിമാനെന്നു സ്ഥാപിക്കപ്പെട്ടു.’ സന്ദർഭമനുസരിച്ച് ഗ്രീക്ക് ക്രിയയ്ക്ക് നീതിമാനായി പ്രഖ്യാപിക്കുക എന്ന അർഥമോ നീതിമാനെന്നു തെളിയിക്കുക എന്ന അർഥമോ വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: നമ്മുടെ പിതാവ്
  rationale: കുടുംബബന്ധത്തിന്റെയും ഉടമ്പടിജനമായ തിരിച്ചറിവിന്റെയും രൂപകം നിലനിർത്തുന്നു; ‘നമ്മുടെ പൂർവികൻ’ എന്നതിനെക്കാൾ മൂലപാഠത്തിന്റെ ബന്ധപരമായ ശക്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐξ ἔργων
  choice: പ്രവൃത്തികളാൽ
  rationale: ἐξ ഇവിടെ ഉറവിടമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും ഈ ഭാഗത്തിലെ ദൈവശാസ്ത്രപരമായ പദബന്ധം നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: ἐδικαιώθη
  choice: നീതീകരിക്കപ്പെട്ടു
  rationale: δικαιόω എന്ന ക്രിയയുടെ ‘നീതീകരിക്കുക,’ ‘നീതിമാനെന്നു തെളിയിക്കുക,’ ‘നിർദോഷമെന്നു സ്ഥാപിക്കുക’ എന്നീ സാധ്യതകളെ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ, നീതീകരണത്തെക്കുറിച്ചുള്ള വിശാലമായ ചർച്ചയുമായുള്ള പദബന്ധവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: ἀνενέγκας
  choice: അർപ്പിച്ചപ്പോൾ
  rationale: സന്ദർഭത്തിൽ ഈ എയോറിസ്റ്റ് കൃതന്തത്തിന് കാലസൂചനാപരമായ അർഥമാണ് സ്വാഭാവികം; യാഗമായി അർപ്പിക്കുന്നതിന്റെ ഭാവവും ‘അർപ്പിച്ചു’ എന്നതിൽ വ്യക്തമാകുന്നു.
- source_word: Ἰσαὰκ τὸν υἱὸν αὐτοῦ
  choice: തന്റെ മകനായ യിസ്ഹാക്കിനെ
  rationale: മൂലപാഠത്തിലെ ബന്ധസൂചന വ്യക്തമായും സ്വാഭാവികമായ മലയാളക്രമത്തിലും നൽകുന്നു.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ബലിയർപ്പണത്തിനുള്ള പീഠത്തെ സൂചിപ്പിക്കുന്ന θυσιαστήριον എന്ന പദത്തിന്റെ പതിവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: οὐκ ... ἐδικαιώθη;
  choice: നീതീകരിക്കപ്പെട്ടില്ലയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാക്കോബ് 2:21-ൽ പ്രവൃത്തികളുമായി ബന്ധപ്പെട്ട δικαιόω എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘നീതീകരിക്കപ്പെട്ടു’ എന്നു നൽകി.
  alternative: ‘നീതിമാനാണെന്നു തെളിയിക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘നീതിമാനെന്നു സ്ഥാപിക്കപ്പെട്ടു.’
  rationale: വിശ്വാസവും പ്രവൃത്തികളും തമ്മിലുള്ള ബന്ധത്തെക്കുറിച്ചുള്ള ഈ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനം തന്നെ പരിഹരിക്കരുത്. ‘നീതീകരിക്കപ്പെട്ടു’ എന്നത് വിശാലമായ നീതീകരണചർച്ചയുമായുള്ള പദബന്ധം കാത്തുസൂക്ഷിക്കുന്നു; പ്രകടനാത്മകമോ സ്ഥിരീകരണാത്മകമോ ആയ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നമ്മുടെ പിതാവ്,’ ‘പ്രവൃത്തികളാൽ,’ ‘നീതീകരിക്കപ്പെട്ടു,’ ‘യാഗപീഠം’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ കുടുംബപരവും യാഗപരവും ദൈവശാസ്ത്രപരവുമായ ബന്ധങ്ങൾ നിലനിർത്തുന്നു. അലങ്കാരചോദ്യം മലയാളത്തിലെ ‘ഇല്ലയോ?’ രൂപത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
