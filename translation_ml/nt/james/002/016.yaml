id: JAS.2.16
reference: James 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: ml
  text: നിങ്ങളിൽ ഒരാൾ അവരോടു, “സമാധാനത്തോടെ പോകുവിൻ; ചൂടുള്ളവരായിരിക്കുവിൻ; തൃപ്തരായിരിക്കുവിൻ”[a] എന്നു പറയുകയും, ശരീരത്തിന് ആവശ്യമായവ അവർക്കു കൊടുക്കാതിരിക്കുകയും ചെയ്താൽ, അതുകൊണ്ട് എന്തു പ്രയോജനം?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ചൂടാക്കപ്പെടുവിൻ; തൃപ്തരാക്കപ്പെടുവിൻ.” ഗ്രീക്ക് രൂപങ്ങൾ കർമണി അർഥത്തിലോ മധ്യ അർഥത്തിലോ മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις ... ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ഒരാൾ ... എന്നു പറയുകയും
  rationale: സാങ്കൽപ്പിക ഉദാഹരണവും ἐξ ὑμῶν എന്നതിന്റെ വിഭജകാർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; δέ-യുടെ പ്രവാഹം തുടർന്നുള്ള ‘-ഉകയും’ ഘടനയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: സമാധാനത്തോടെ പോകുവിൻ
  rationale: വിടപറയുമ്പോഴുള്ള ആശംസയുടെ സ്വഭാവവും സന്ദർഭത്തിലെ പരിഹാസാത്മക ശക്തിയും നിലനിർത്തുന്നു.
- source_word: θερμαίνεσθε
  choice: ചൂടുപിടിച്ചും ... ഇരിക്കുവിൻ
  rationale: മധ്യ/കർമണി രൂപത്തിലെ അനിശ്ചിതത്വം ഒരളവുവരെ തുറന്നുവെക്കുകയും, വസ്ത്രമില്ലായ്മയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: χορτάζεσθε
  choice: വയറുനിറഞ്ഞും ഇരിക്കുവിൻ
  rationale: ഭക്ഷണത്താൽ തൃപ്തരാകുക എന്ന സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ആരാണ് ഭക്ഷണം നൽകുന്നതെന്ന് നിർണ്ണയിക്കുന്നില്ല.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: അവർക്കു കൊടുക്കാതിരിക്കുകയും ചെയ്താൽ
  rationale: വാക്കുകളും പ്രവൃത്തിയില്ലായ്മയും തമ്മിലുള്ള വൈരുധ്യം മലയാളത്തിലെ സമാന്തര വ്യവസ്ഥാവാക്യഘടനയിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: ശരീരത്തിന് ആവശ്യമായവ
  rationale: ശാരീരിക ആവശ്യങ്ങൾ നിറവേറ്റാനുള്ള സാധനങ്ങൾ എന്ന അർഥം ചുരുക്കമായും കൃത്യമായും നൽകുന്നു.
- source_word: τί ὄφελος;
  choice: അതുകൊണ്ട് എന്തു പ്രയോജനം?
  rationale: പ്രായോഗിക ഫലമില്ലായ്മ ചോദ്യം ചെയ്യുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
theological_decisions:
- issue: θερμαίνεσθε, χορτάζεσθε എന്നീ ആജ്ഞാരൂപങ്ങളുടെ കർത്തരി/കർമണി സൂക്ഷ്മത
  choice: “ചൂടുപിടിച്ചും വയറുനിറഞ്ഞും ഇരിക്കുവിൻ” എന്നു നൽകി പ്രവർത്തിയുടെ ഫലം സൂചിപ്പിക്കുന്നു; അത് സ്വയം ചെയ്യുന്നതാണോ മറ്റൊരാളിൽനിന്ന് ലഭിക്കുന്നതാണോ എന്നു നിർണ്ണയിക്കുന്നില്ല.
  alternative: “ചൂടാക്കപ്പെടുവിൻ; തൃപ്തരാക്കപ്പെടുവിൻ” അല്ലെങ്കിൽ “സ്വയം ചൂടുപിടിച്ച് വയറുനിറയ്ക്കുവിൻ.”
  rationale: ഗ്രീക്ക് രൂപങ്ങൾ മധ്യമായോ കർമണിയായോ ഗ്രഹിക്കാം. യാക്കോബിന്റെ മുഖ്യബിന്ദു ഭൗതികസഹായമില്ലാത്ത ആശംസയുടെ വ്യർഥതയാണ്; സഹായം ലഭിക്കുന്ന രീതിയെ വിവർത്തനം നിർബന്ധമായി തീർപ്പാക്കേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായി ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഉദ്ധരണിയിലെ ബഹുവചന ആജ്ഞയ്ക്ക് ‘പോകുവിൻ/ഇരിക്കുവിൻ’ ഉപയോഗിച്ചു; അത്യന്തം പഴയ ശൈലി ഒഴിവാക്കി, ആശംസയുടെ ഗൗരവം നിലനിർത്തി.
