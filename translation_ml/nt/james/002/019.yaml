id: JAS.2.19
reference: James 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: ml
  text: ദൈവം ഏകനാണെന്ന് നീ വിശ്വസിക്കുന്നു[a]; നീ നന്നായി ചെയ്യുന്നു. ഭൂതങ്ങളും വിശ്വസിക്കുന്നു—വിറയ്ക്കുകയും ചെയ്യുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ദൈവമേ ഉള്ളൂ.” ഗ്രീക്ക് രണ്ടുവിധത്തിലും വിവർത്തനം ചെയ്യാം; “ദൈവം ഏകനാണ്” എന്നത് ഗ്രീക്ക് പദക്രമത്തോട് കൂടുതൽ അടുത്തുനിൽക്കുകയും യഹൂദരുടെ ഏകദൈവ ഏറ്റുപറച്ചിലിനെ പ്രതിധ്വനിപ്പിക്കുകയും ചെയ്തേക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “നടുക്കുകയും ചെയ്യുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: നീ
  rationale: പ്രത്യക്ഷമായ രണ്ടാംപുരുഷ ഏകവചന സർവനാമം അഭിസംബോധനയുടെ ഊന്നൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘നീ’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: πιστεύεις
  choice: വിശ്വസിക്കുന്നു
  rationale: ὅτι കൊണ്ടുവരുന്ന വിശ്വാസത്തിന്റെ ഉള്ളടക്കത്തോട് സ്വാഭാവികമായി ചേരുന്നു; ‘ആശ്രയിക്കുന്നു’ എന്നത് ഇവിടെ ഉള്ള പ്രസ്താവനാത്മക സമ്മതത്തെക്കാൾ വ്യക്തിപരമായ ആശ്രയബോധം അധികമായി ചേർക്കും.
- source_word: εἷς ἐστιν ὁ θεός
  choice: ദൈവം ഏകനാണ്
  rationale: ഗ്രീക്കിലെ വിധേയപ്രസ്താവനയുടെ രൂപം അടുത്തായി നിലനിർത്തുകയും ഏകദൈവവിശ്വാസത്തിന്റെ ഏറ്റുപറച്ചിലിന്റെ സാധ്യതയുള്ള പ്രതിധ്വനി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: καλῶς ποιεῖς
  choice: നീ നന്നായി ചെയ്യുന്നു
  rationale: ചുരുക്കമായ അംഗീകാരം സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; പിന്നാലെയുള്ള വൈരുധ്യത്തിന്റെ മൂർച്ച കുറയ്ക്കുന്നില്ല.
- source_word: καὶ
  choice: -കളും
  rationale: ഇവിടെ καί-യുടെ ‘പോലും’ എന്ന ആരോഹകബലം ‘ഭൂതങ്ങളും’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു; മനുഷ്യന്റെ വിശ്വാസനില ഭൂതങ്ങൾക്കും ഉണ്ടെന്ന താരതമ്യം ഉയർത്തിക്കാട്ടുന്നു.
- source_word: τὰ δαιμόνια
  choice: ഭൂതങ്ങൾ
  rationale: δαιμόνια എന്നതിന്റെ സ്ഥാപിതവും നേരിട്ടുള്ളതുമായ മലയാള തുല്യപദം; ‘ദുഷ്ടാത്മാക്കൾ’ എന്നത് വ്യാഖ്യാനാത്മകമായ വിപുലീകരണമാകും.
- source_word: πιστεύουσιν
  choice: വിശ്വസിക്കുന്നു
  rationale: πιστεύεις എന്ന മുൻക്രിയയോടുള്ള പദാവർത്തനം നിലനിർത്തുന്നു; യാക്കോബിന്റെ വാദത്തിന് ഈ ആവർത്തനം നിർണായകമാണ്.
- source_word: φρίσσουσιν
  choice: വിറയ്ക്കുന്നു
  rationale: ഭയത്താൽ ഉണ്ടാകുന്ന ശക്തമായ ശാരീരിക പ്രതികരണം ഇന്നത്തെ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ‘നടുക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം.
theological_decisions:
- issue: εἷς ἐστιν ὁ θεός എന്ന ഏകദൈവ ഏറ്റുപറച്ചിലിന്റെ വിവർത്തനം
  choice: ദൈവം ഏകനാണ്
  alternative: ഒരു ദൈവമേ ഉള്ളൂ
  rationale: തിരഞ്ഞെടുത്ത രൂപം ഗ്രീക്ക് വാക്യഘടനയോട് അടുത്തുനിൽക്കുകയും ഇസ്രായേലിന്റെ ഏകദൈവ ഏറ്റുപറച്ചിലിലേക്കുള്ള സാധ്യതയുള്ള സൂചന സംരക്ഷിക്കുകയും ചെയ്യുന്നു. മറ്റൊരു രൂപവും വ്യാകരണപരമായി സാധുവാണ്, എന്നാൽ അത് നിലനിൽപ്പിനാണ് അല്പം കൂടുതൽ ഊന്നൽ നൽകുന്നത്.
- issue: മനുഷ്യന്റെ വിശ്വാസവും ഭൂതങ്ങളുടെ വിശ്വാസവും തമ്മിലുള്ള വൈരുധ്യം
  choice: ഭൂതങ്ങളും വിശ്വസിക്കുന്നു—വിറയ്ക്കുകയും ചെയ്യുന്നു
  alternative: ഭൂതങ്ങളും വിശ്വസിക്കുകയും വിറയ്ക്കുകയും ചെയ്യുന്നു
  rationale: ‘-കളും’ എന്ന രൂപവും ദീർഘവിരാമവും താരതമ്യത്തിന്റെ മൂർച്ച നിലനിർത്തുന്നു; ശരിയായ ഉപദേശത്തെ വെറും ബൗദ്ധികമായി അംഗീകരിക്കുന്നതും അതിനൊത്ത പ്രവൃത്തിയുള്ള വിശ്വാസവും തമ്മിലുള്ള വചനത്തിലെ ഉദ്ദേശ്യമായ സംഘർഷം മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൈവം ഏകനാണ്’ എന്ന രൂപം മൂലഭാഷയുടെ ഘടനയും സാധ്യതയുള്ള ഏറ്റുപറച്ചിൽ-പ്രതിധ്വനിയും നിലനിർത്തുന്നു. രണ്ടാം വാക്യത്തിലെ പദാവർത്തനവും വൈരുധ്യവും വ്യക്തമായി സംരക്ഷിച്ചു.
