id: JAS.2.1
reference: James 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: ml
  text: എന്റെ സഹോദരന്മാരേ[a], മഹത്ത്വത്തിന്റെ കർത്താവും നമ്മുടെ കർത്താവുമായ യേശു മശീഹയിലുള്ള[b] വിശ്വാസം പക്ഷപാതം കാണിച്ചുകൊണ്ട് പുലർത്തരുത്.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ സഹോദരീസഹോദരന്മാരേ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “സഹോദരന്മാർ” എന്നാണ്; എന്നാൽ ഈ അഭിസംബോധന വിശ്വാസസമൂഹത്തെ വിശാലമായി ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ വിശ്വാസം.” ഗ്രീക്ക് ഘടനയെ ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, “മഹത്ത്വമുള്ള നമ്മുടെ കർത്താവായ യേശു മശീഹയിലുള്ള വിശ്വാസം.”
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, “നമ്മുടെ കർത്താവായ യേശു മശീഹയിൽ—മഹത്ത്വത്തിന്റെ കർത്താവിൽ—ഉള്ള വിശ്വാസം.”
    reason: previous_rendering
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിശ്വാസസമൂഹം മുഴുവനും ഉൾപ്പെടാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μὴ ... ἔχετε
  choice: പുലർത്തരുത്
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നിരോധനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; വിശ്വാസം കൈവശം വെക്കുക എന്നതിലുപരി അത് ആചരിക്കുന്ന രീതിയും ഇവിടെ ഉദ്ദേശിക്കപ്പെടുന്നു.
- source_word: ἐν προσωπολημψίαις
  choice: മുഖപക്ഷം കാണിച്ചുകൊണ്ട്
  rationale: ആളുകളുടെ പദവി, സമ്പത്ത്, പുറംകാഴ്ച തുടങ്ങിയവ നോക്കി പക്ഷപാതം കാണിക്കുന്നതെന്ന നൈതിക അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ഗ്രീക്കിലെ ബഹുവചനം മലയാളത്തിൽ പ്രയോഗരീതിയായി സ്വാഭാവികമാക്കുന്നു.
- source_word: τὴν πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്നതിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ നിർദ്ദിഷ്ടത പ്രത്യേകം നിർദ്ദേശകപദം ചേർക്കാതെ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: നമ്മുടെ കർത്താവുമായ യേശു മശീഹയിലുള്ള
  rationale: κύριος എന്നതിന് ‘കർത്താവ്’ എന്നും, സജീവമായ സ്ഥാനപ്പേരായ Χριστός എന്നതിന് ‘മശീഹ’ എന്നും നൽകുന്നു. പ്രധാനവാക്യത്തിൽ വിശ്വാസത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കാൻ ‘യിലുള്ള’ ഉപയോഗിച്ചെങ്കിലും ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τῆς δόξης
  choice: മഹത്ത്വത്തിന്റെ കർത്താവ്
  rationale: δόξα എന്നതിന്റെ നാമരൂപവും ഉയർന്ന ക്രിസ്തുശാസ്ത്രപരമായ ‘മഹത്ത്വത്തിന്റെ കർത്താവ്’ എന്ന ബൈബിൾശൈലിയും നിലനിർത്തുന്നു; വ്യാകരണബന്ധത്തിലെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ നൽകുന്നു.
theological_decisions:
- issue: τὴν πίστιν τοῦ κυρίου എന്നതിലെ ഷഷ്ഠീവ്യാകരണബന്ധം
  choice: പ്രധാനവാക്യത്തിൽ ‘നമ്മുടെ കർത്താവായ യേശു മശീഹയിലുള്ള വിശ്വാസം’
  alternative: ‘നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ വിശ്വാസം’
  rationale: മലയാളത്തിൽ ‘യിലുള്ള വിശ്വാസം’ സ്വാഭാവികവും സന്ദർഭസുസ്പഷ്ടവുമാണ്; എങ്കിലും ഗ്രീക്ക് ഘടന ലക്ഷ്യസംബന്ധമായോ ഉടമസ്ഥ/നിർവചനസംബന്ധമായോ വായിക്കാവുന്നതിനാൽ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: τῆς δόξης എന്നതിന്റെ ബന്ധം
  choice: ‘മഹത്ത്വത്തിന്റെ കർത്താവ്’ എന്ന സമാനാധികരണ വായന
  alternative: ‘മഹത്ത്വമുള്ള നമ്മുടെ കർത്താവ്’
  rationale: നാമരൂപത്തിലുള്ള δόξης നിലനിർത്തുകയും ‘കർത്താവ്’ എന്നതോടുള്ള ഉന്നതമായ വിശേഷണബന്ധം പ്രകടമാക്കുകയും ചെയ്യുന്നു; കൂടുതൽ വിശേഷണാത്മകമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേര്
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ‘കർത്താവായ യേശു’ എന്ന ഗൗരവമുള്ള സ്ഥാനപ്പേരുകളുടെ നിരയിൽ Χριστός-ന്റെ അഭിഷിക്ത രാജാവെന്ന അർഥം സജീവമായതിനാൽ ‘മശീഹ’ തിരഞ്ഞെടുത്തു.
- issue: Ἀδελφοί എന്ന ലിംഗസൂചക അഭിസംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുരുഷലിംഗം പ്രധാനവാക്യത്തിൽ നിലനിർത്തുന്നു; മിശ്രവിശ്വാസസമൂഹത്തെ വിശാലമായി അഭിസംബോധന ചെയ്യുന്നതാകാമെന്ന ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മുഖപക്ഷം കാണിക്കുക’ സഭാപരമായ പരിചിതത്വവും സാധാരണ വായനാസൗകര്യവും ഒരുമിപ്പിക്കുന്നു. ഗ്രീക്ക് വാക്യാവസാനത്തിലെ ചോദ്യംചിഹ്നസ്വഭാവമുള്ള ചിഹ്നത്തെ, നിരോധന ആജ്ഞയുടെ അർഥവും യാക്കോബ് 2:2-ലെ തുടർച്ചയും പരിഗണിച്ച് മലയാളത്തിൽ പ്രസ്താവനയായി നൽകി.
