  to: എന്റെ സഹോദരന്മാരേ[a], മഹത്ത്വത്തിന്റെ കർത്താവും നമ്മുടെ കർത്താവുമായ യേശു മശീഹയിലുള്ള[b] വിശ്വാസം പക്ഷപാതം കാണിച്ചുകൊണ്ട് പുലർത്തരുത്.[c][d]
