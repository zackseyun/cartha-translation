id: JAS.2.6
reference: James 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ ആ ദരിദ്രനെ അപമാനിച്ചു.[a] നിങ്ങളെ അടിച്ചമർത്തുന്നതും കോടതികളിലേക്കു വലിച്ചിഴയ്ക്കുന്നതും ധനികർ തന്നെയല്ലേ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദരിദ്രനായ വ്യക്തിയെ”; കൂടുതൽ പൊതുവായി, “ദരിദ്രരെ.” ഗ്രീക്കിൽ ഏകവചനമാണ്. ഇത് മുൻവാക്യങ്ങളിലെ പ്രത്യേക ഉദാഹരണത്തെ ഓർമിപ്പിക്കുമ്പോഴും ദരിദ്രരെ പൊതുവായി പ്രതിനിധീകരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിയമകോടതികളിലേക്ക്” അല്ലെങ്കിൽ “ന്യായാസനങ്ങളിലേക്ക്.” ഗ്രീക്ക് പദം ന്യായവിധി നടത്തുന്ന കോടതികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: അപമാനിച്ചു
  rationale: മാനഹാനിക്കും നിന്ദാപൂർവമായ പെരുമാറ്റത്തിനുമുള്ള ആശയം സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸν πτωχόν
  choice: ആ ദരിദ്രനെ
  rationale: ഗ്രീക്കിലെ ഏകവചനവും നിർദേശക ലേഖനവും മുൻവാക്യങ്ങളിൽ വിവരിച്ച പ്രത്യേക ദരിദ്രനെ ഓർമിപ്പിക്കുന്നു; അതേസമയം അയാൾ ദരിദ്രരുടെ പ്രതിനിധിയായും നിലകൊള്ളുന്നു.
- source_word: οἱ πλούσιοι
  choice: ആ ധനികർ
  rationale: സുബ്സ്റ്റാന്റീവ് വിശേഷണത്തിന്റെ വർഗസൂചന നിലനിർത്തുകയും മുമ്പ് പറഞ്ഞവരിലേക്കുള്ള ഊന്നൽ സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: καταδυναστεύουσιν
  choice: അടിച്ചമർത്തുന്നതും
  rationale: അധികാരം കഠിനമായി ഒരാൾക്കെതിരെ പ്രയോഗിക്കുന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἕλκουσιν
  choice: വലിച്ചിഴയ്ക്കുന്നതും
  rationale: ബലപ്രയോഗത്തോടെയുള്ള വലിച്ചുകൊണ്ടുപോകലിന്റെ സജീവവും പ്രതികൂലവുമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: κριτήρια
  choice: കോടതികളിലേക്ക്
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്ന ന്യായവിധി നടത്തുന്ന നിയമകോടതികളെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: καὶ αὐτοὶ
  choice: ആ ധനികർ തന്നെയല്ലേ
  rationale: പ്രവൃത്തി ചെയ്യുന്നത് ഇവർ തന്നെയാണെന്ന ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിലെ ‘തന്നെ’ വഴി നിലനിർത്തുന്നു.
- source_word: οὐχ ... ;
  choice: തന്നെയല്ലേ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ആ ദരിദ്രനെ’ എന്ന ഏകവചനത്തിന്റെ സൂചന
  choice: സഭായോഗത്തെക്കുറിച്ചുള്ള മുൻ ഉദാഹരണത്തിലെ ദരിദ്രനായ വ്യക്തി; വിപുലമായി ദരിദ്രരുടെ പ്രതിനിധിയും
  alternative: ദരിദ്രരെ പൊതുവായി സൂചിപ്പിക്കുന്ന കൂട്ടായ ഏകവചനം
  rationale: യാക്കോബ് 2:2–3-ൽ വിവരിച്ച പ്രത്യേക ദരിദ്രനുമായുള്ള പ്രഭാഷണബന്ധം ഏകവചനം സംരക്ഷിക്കുന്നു; അതിന്റെ പ്രതിനിധിപരമായ വിപുലമായ പ്രയോഗം തടയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അപമാനിച്ചു’ മാന-അപമാന ഭാവം നിലനിർത്തുന്നു; ‘വലിച്ചിഴയ്ക്കുന്നു’ മൂലത്തിലെ ബലപ്രയോഗത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു. അലങ്കാരചോദ്യം ‘തന്നെയല്ലേ?’ എന്ന രൂപത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
