lexical_decisions:
- source_word: οὕτως καὶ
  choice: അതുപോലെതന്നെ
  rationale: മുൻപുള്ള ഉദാഹരണവുമായി താരതമ്യവും നിഗമനബന്ധവും സൂചിപ്പിക്കുന്ന οὕτως καὶ എന്ന പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἡ πίστις
  choice: വിശ്വാസം
  rationale: യാക്കോബിന്റെ വാദത്തിൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് പ്രവൃത്തികളോടൊപ്പം കാണപ്പെടേണ്ട വിശ്വാസമാണ്. ‘ആശ്രയം’, ‘വിശ്വസ്തത’ എന്നിവയ്ക്ക് സന്ദർഭാനുസൃത സാധ്യതയുണ്ടെങ്കിലും ‘വിശ്വാസം’ തന്നെയാണ് ഏറ്റവും യോജിച്ചത്.
- source_word: ἐὰν μὴ ἔχῃ
  choice: ഇല്ലെങ്കിൽ
  rationale: ἐὰν μή ഉള്ള നിബന്ധനയെ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; ‘പ്രവൃത്തികൾ ഉണ്ടായിരിക്കാതിരുന്നാൽ’ എന്ന ഭാരമുള്ള രൂപം ഒഴിവാക്കുന്നു.
- source_word: ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: പുറമേ പ്രകടമാകുന്ന പ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുകയും യാക്കോബ് 2-ലെ ആവർത്തിച്ചുവരുന്ന പദബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു; ‘സൽപ്രവൃത്തികൾ’ എന്നു ചേർത്ത് അർത്ഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: νεκρά
  choice: നിർജീവം
  rationale: ഇവിടെ ‘മരിച്ചത്’ എന്നതിനെക്കാൾ മലയാളത്തിൽ വിശ്വാസത്തെ വിശേഷിപ്പിക്കാൻ സ്വാഭാവികമായ ശക്തമായ രൂപകമാണ് ‘നിർജീവം’; ജീവനും ഫലപ്രാപ്തിയും ഇല്ലെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: καθ’ ἑαυτήν
  choice: അതിൽത്തന്നെ
  rationale: പ്രവൃത്തികളിൽനിന്ന് വേർതിരിച്ച് തനിയെ പരിഗണിക്കുന്ന വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു; വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസവും പ്രവൃത്തികളും സംബന്ധിച്ച തർക്കങ്ങളിൽ കേന്ദ്രസ്ഥാനമുള്ള πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിച്ചുകളയാതെ നിലനിർത്താൻ ‘വിശ്വാസം’ ഉപയോഗിക്കുന്നു. യാക്കോബ് ഇവിടെ പ്രവൃത്തികളില്ലാത്ത വിശ്വാസത്തെ നിർജീവമെന്നു പറയുന്നു; അതിനപ്പുറമുള്ള ഒരു പ്രത്യേക സഭാവിഭാഗത്തിന്റെ നീതീകരണസിദ്ധാന്തം വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: νεκρά എന്ന രൂപകത്തിന്റെ അവതരണം
  choice: നിർജീവം
  alternative: മരിച്ചതാണ്
  rationale: മൂലത്തിലെ ശക്തമായ ജീവൻ/മരണം രൂപകം ‘നിർജീവം’ സംരക്ഷിക്കുന്നു; അതേസമയം ആധുനിക സാധാരണ മലയാളത്തിൽ വിശ്വാസത്തെക്കുറിച്ച് സ്വാഭാവികമായി വായിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള, ലളിതവും മാന്യവുമായ ശൈലി. ‘പ്രവൃത്തികൾ’ എന്ന പരമ്പരാഗതവും സന്ദർഭപരമായി നിർണായകവുമായ പദം നിലനിർത്തി; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
