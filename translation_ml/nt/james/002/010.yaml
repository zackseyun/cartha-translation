id: JAS.2.10
reference: James 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: ml
  text: എന്തെന്നാൽ, ആരെങ്കിലും മുഴുവൻ ന്യായപ്രമാണവും പാലിച്ചാലും ഒരു കാര്യത്തിൽ ഇടറിയാൽ, അവൻ മുഴുവൻ ന്യായപ്രമാണത്തെ സംബന്ധിച്ച് കുറ്റക്കാരനായിത്തീർന്നിരിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു കാര്യത്തിൽ പരാജയപ്പെട്ടാൽ’ അല്ലെങ്കിൽ ‘അതിലെ ഒരു ഭാഗം ലംഘിച്ചാൽ.’ ധാർമിക പരാജയത്തെ സൂചിപ്പിക്കാൻ ഗ്രീക്കിൽ ‘ഇടറുക’ എന്ന രൂപകമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മുഴുവൻ ന്യായപ്രമാണത്തെ സംബന്ധിച്ച് കുറ്റബാധ്യതയുള്ളവനായിത്തീർന്നിരിക്കുന്നു.’ ഒരു ഭാഗം ലംഘിക്കുന്നത് ഒരാളെ മുഴുവൻ ന്യായപ്രമാണത്തോടു ബന്ധപ്പെട്ട് കണക്കു പറയേണ്ടവനാക്കുന്നു എന്നാണ് ഈ പ്രയോഗത്തിന്റെ അർഥം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: …വൻ
  rationale: പൊതുവായ ഒരു തത്ത്വം അവതരിപ്പിക്കുന്ന അനിശ്ചിത ബന്ധസർവനാമത്തിന്റെ സാർവത്രികത മലയാളത്തിലെ ‘…വൻ’ എന്ന ഘടന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിന് വിശദീകരണമോ അടിസ്ഥാനമോ നൽകുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ὅλον τὸν νόμον
  choice: മുഴുവൻ ന്യായപ്രമാണവും
  rationale: ὅλον സൂചിപ്പിക്കുന്ന സമഗ്രത നിലനിർത്തുന്നു; νόμος എന്നതിന് ബൈബിൾസന്ദർഭത്തിൽ പരിചിതവും മാന്യവുമായ മലയാളപദമാണ് ‘ന്യായപ്രമാണം’.
- source_word: τηρήσῃ
  choice: പാലിച്ചിട്ടും
  rationale: കല്പനകളോ ന്യായപ്രമാണമോ അനുസരിച്ച് കാത്തുപോരുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; δὲ സൂചിപ്പിക്കുന്ന വൈരുധ്യവും ‘ഇട്ടും’ മുഖേന പ്രകടമാക്കുന്നു.
- source_word: πταίσῃ
  choice: ഇടറുന്നവൻ
  rationale: πταίωയുടെ ഇടറുക എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് ധാർമിക പരാജയം സൂചിപ്പിക്കുന്നു.
- source_word: ἐν ἑνί
  choice: ഒരു കാര്യത്തിൽ
  rationale: ഒരൊറ്റ വിഷയത്തിലോ പ്രമാണാംശത്തിലോ എന്ന അർഥം നൽകുന്നു; ഗ്രീക്കിലെ ഉദ്ദേശപൂർവമായ അസ്പഷ്ടത പൂർണമായി ചുരുക്കുന്നില്ല.
- source_word: γέγονεν
  choice: ആയിത്തീർന്നിരിക്കുന്നു
  rationale: പ്രവൃത്തിയുടെ ഫലമായി നിലവിൽ വന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന perfect രൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: πάντων
  choice: അതു മുഴുവനോടും
  rationale: മുമ്പ് പറഞ്ഞ മുഴുവൻ ന്യായപ്രമാണത്തോടുള്ള ഉത്തരവാദിത്വമാണ് ഉദ്ദേശ്യമെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഓരോ കല്പനയും പ്രത്യേകം ലംഘിച്ചു എന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: ἔνοχος
  choice: കുറ്റക്കാരൻ
  rationale: ധാർമികവും നിയമപരവുമായ കുറ്റബാധ്യത വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ന്യായപ്രമാണത്തിന്റെ മുഴുവൻ ഭാഗത്തോടുമുള്ള കുറ്റബാധ്യതയുടെ വ്യാപ്തി
  choice: ഒരു കാര്യത്തിൽ ലംഘനം സംഭവിച്ചാൽ ഒരാൾ മുഴുവൻ ന്യായപ്രമാണത്തോടും കുറ്റബാധ്യതയുള്ളവനായിത്തീരുന്നു എന്നാണ് വാക്യം പറയുന്നത്.
  alternative: ഒരു കല്പന ലംഘിക്കുന്നത് ഓരോ കല്പനയും പ്രത്യേകം ലംഘിച്ചതിന് തുല്യമാണെന്നോ, ഇവിടെ പക്ഷപാതം എന്ന ഒറ്റ വിഷയമേ ഉദ്ദേശിക്കുന്നുള്ളൂ എന്നോ വായിക്കാം.
  rationale: πάντων ἔνοχος എന്നത് മുഴുവനോടുമുള്ള ബാധ്യത സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; എന്നാൽ എല്ലാ പാപങ്ങൾക്കും ഒരേ ഗൗരവമാണെന്നോ ഓരോ കല്പനയും വ്യക്തി ലംഘിച്ചുവെന്നോ വാചകം നിർബന്ധമായി പറയുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ന്യായപ്രമാണം’ ബൈബിൾസന്ദർഭത്തിലെ നിയമത്തെ സൂചിപ്പിക്കുന്നു; ‘ഇടറുക’ എന്ന ഉറവിടരൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി അതിന്റെ ധാർമിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
