id: JAS.2.8
reference: James 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: ml
  text: എന്നാൽ, “നിന്നെപ്പോലെ നിന്റെ അയൽക്കാരനെയും സ്നേഹിക്കണം” എന്ന തിരുവെഴുത്തനുസരിച്ച് രാജകീയ നിയമം[a] നിങ്ങൾ നിറവേറ്റുന്നെങ്കിൽ, നിങ്ങൾ ചെയ്യുന്നത് നല്ലതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “രാജാവിന്റെ നിയമം” എന്നും “രാജ്യത്തിന്റെ നിയമം” എന്നും മനസ്സിലാക്കാം. ഗ്രീക്കിൽ അക്ഷരാർഥം “രാജകീയ നിയമം” എന്നാണ്; അതിന്റെ രാജകീയ ഉറവിടമോ പരമസ്ഥാനമോ ഇവിടെ ഊന്നിപ്പറയുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: εἰയുടെ ഉപാധിസ്വഭാവവും μέντοιയുടെ മൃദുവായ വൈരുധ്യ/തുടർച്ചാഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: νόμον ... βασιλικὸν
  choice: രാജകീയ നിയമം
  rationale: βασιλικός എന്നതിന് നേരിട്ടുള്ള അർഥമായ ‘രാജകീയ’ എന്നത് നിയമത്തിന്റെ രാജാവുമായുള്ള ബന്ധമോ അതിന്റെ പരമസ്ഥാനമോ ഏതാണെന്ന് നിർബന്ധമായി തീരുമാനിക്കാതെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: τελεῖτε
  choice: നിറവേറ്റുന്നെങ്കിൽ
  rationale: നിയമം പ്രാവർത്തികമാക്കുക/പൂർത്തിയാക്കുക എന്ന τελέωയുടെ ഭാവം നൽകുന്നു; വർത്തമാനകാലത്തിലുള്ള പ്രവർത്തനവും ഉപാധിവാക്യവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: κατὰ τὴν γραφήν
  choice: തിരുവെഴുത്തനുസരിച്ച്
  rationale: തിരുവെഴുത്തിൽ പറഞ്ഞിരിക്കുന്നതിനൊത്ത് എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ഏകവചനത്തിലുള്ള γραφήയും പ്രതിഫലിക്കുന്നു.
- source_word: Ἀγαπήσεις
  choice: സ്നേഹിക്കണം
  rationale: ഭാവികാലരൂപത്തിൽ വന്നിരിക്കുന്ന കല്പനയുടെ നിർബന്ധഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τὸν πλησίον σου
  choice: നിന്റെ അയൽക്കാരനെ
  rationale: ധാർമിക അർഥത്തിലുള്ള πλησίον എന്ന ബൈബിൾപദത്തിന് പരിചിതവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: ὡς σεαυτόν
  choice: നിന്നെപ്പോലെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ താരതമ്യം അനാവശ്യ വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: καλῶς ποιεῖτε
  choice: നിങ്ങൾ ചെയ്യുന്നത് നല്ലതാണ്
  rationale: പ്രവൃത്തി ശരിയാണെന്ന അംഗീകാരം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘രാജകീയ നിയമം’ എന്നതിന്റെ അർഥം
  choice: ‘രാജകീയ നിയമം’ എന്ന വിശാലമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘രാജാവ് നൽകിയ നിയമം’; ‘നിയമങ്ങളിൽ പരമമായത്’; ‘രാജ്യത്തിന്റെ നിയമം’.
  rationale: βασιλικός നിയമത്തിന്റെ രാജകീയ ഉറവിടത്തെയോ പരമസ്ഥാനത്തെയോ രാജ്യബന്ധത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഇവയിൽ ഒന്ന് മാത്രം നിർബന്ധിച്ച് ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ലളിതവും മാന്യവുമായ ശൈലി. തിരുവെഴുത്ത് ഉദ്ധരണിയിൽ ഏകവചന അഭിസംബോധന നിലനിർത്തുകയും, യാക്കോബിന്റെ വായനക്കാരോടുള്ള ബഹുവചന അഭിസംബോധന ‘നിങ്ങൾ’ എന്നു നൽകുകയും ചെയ്തു.
