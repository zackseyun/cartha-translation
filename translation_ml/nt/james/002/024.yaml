id: JAS.2.24
reference: James 2:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: ml
  text: ഒരു മനുഷ്യൻ പ്രവൃത്തികളാൽ നീതീകരിക്കപ്പെടുന്നു, വിശ്വാസംമാത്രത്താലല്ല എന്നു നിങ്ങൾ കാണുന്നു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീതിമാനാണെന്ന് തെളിയിക്കപ്പെടുന്നു’ അല്ലെങ്കിൽ ‘നീതിമാനെന്ന് തെളിയിക്കപ്പെടുന്നു.’ ഈ പദം പൗലോസ് ഉപയോഗിക്കുന്ന ‘നീതീകരിക്കുക’ എന്ന പദവുമായി എങ്ങനെ ബന്ധപ്പെടുന്നു എന്ന വ്യാഖ്യാനവിവാദം തീർപ്പാക്കാതെ യാക്കോബിന്റെ പദപ്രയോഗം ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ ‘ഒരു മനുഷ്യൻ’; ഇവിടെ അത് മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന അർഥത്തിലാണ്.
    reason: cultural_note
  - marker: c
    text: ‘വിശ്വാസം’ എന്നതിന് ‘വിശ്വസ്തത’ അല്ലെങ്കിൽ ‘ആശ്രയിക്കൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; എങ്കിലും ഇവിടെ ‘വിശ്വാസം’ ആണ് മുഖ്യപരിഭാഷ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: നിങ്ങൾ കാണുന്നു
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള വർത്തമാനകാല നിർദേശവാക്യത്തിന്റെ സ്വഭാവവും, മുമ്പുള്ള ഉദാഹരണത്തിൽനിന്ന് വായനക്കാർ എത്തുന്ന നിഗമനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξ ἔργων
  choice: പ്രവൃത്തികളാൽ
  rationale: ἐξ ഇവിടെ സൂചിപ്പിക്കുന്ന അടിസ്ഥാനം/മാർഗം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; വാദത്തിലെ ‘പ്രവൃത്തികൾ—വിശ്വാസം’ എന്ന വിരോധവും നിലനിർത്തുന്നു.
- source_word: δικαιοῦται
  choice: നീതീകരിക്കപ്പെടുന്നു
  rationale: δικαιόω എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും പദബന്ധവും നിലനിർത്തുന്നു; ‘നീതിമാനാണെന്ന് തെളിയിക്കപ്പെടുന്നു’ എന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു, മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനവിവാദം തീർപ്പാക്കുന്നില്ല.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ഗ്രീക്കിലെ ഏകവചനരൂപം നിലനിർത്തിക്കൊണ്ട് പൊതുവായി ഒരു മനുഷ്യനെ സൂചിപ്പിക്കുന്നു; ഇത് പുരുഷന്മാർക്കു മാത്രമുള്ള പ്രസ്താവനയല്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസത്താൽ
  rationale: πίστις എന്നതിന് ഇവിടെ സാധാരണവും സന്ദർഭോചിതവുമായ പരിഭാഷ ‘വിശ്വാസം’ ആണ്; ‘വിശ്വസ്തത’, ‘ആശ്രയം’ എന്നീ നിഘണ്ടുസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: μόνον
  choice: മാത്രം അല്ല
  rationale: വിശ്വാസം ഒറ്റയ്ക്കല്ല എന്ന μόνον-ന്റെ ഒഴിവാക്കൽഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: δικαιοῦται എന്നതിന്റെ അർഥവും നീതീകരണത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രബന്ധവും
  choice: മുഖ്യപാഠത്തിൽ ‘നീതീകരിക്കപ്പെടുന്നു’ എന്നു നിലനിർത്തുക
  alternative: ‘നീതിമാനാണെന്ന് തെളിയിക്കപ്പെടുന്നു’ അല്ലെങ്കിൽ ‘നീതിമാനെന്നു സ്ഥാപിക്കപ്പെടുന്നു’
  rationale: യാക്കോബിന്റെ പദപ്രയോഗം പൗലോസിന്റെ നീതീകരണഭാഷയുമായി എങ്ങനെ ബന്ധപ്പെടുന്നു എന്ന ചരിത്രപരമായ വ്യാഖ്യാനവിവാദം വിവർത്തനംകൊണ്ട് തീർപ്പാക്കാതെ, ഗ്രീക്കിലെ യഥാർഥ ദൈവശാസ്ത്രസംഘർഷം നിലനിർത്തുന്നു.
- issue: ἄνθρωπος എന്ന പൊതുവാചക ഏകവചനം
  choice: ‘ഒരു മനുഷ്യൻ’
  alternative: ‘ഒരു വ്യക്തി’ അല്ലെങ്കിൽ ‘മനുഷ്യർ’
  rationale: മൂലത്തിലെ ഏകവചനവും പ്രതിനിധാനസ്വഭാവവും നിലനിർത്തുന്നു; പ്രസ്താവന എല്ലാ മനുഷ്യർക്കും പൊതുവാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ പ്രധാന നിഗമനം ആദ്യം വച്ച്, അവസാനത്തിൽ ‘എന്നു നിങ്ങൾ കാണുന്നു’ എന്നു ചേർക്കുന്നതിനെക്കാൾ ഗ്രീക്ക് ക്രമത്തിനടുത്തും മലയാളത്തിൽ വ്യക്തവുമായ ‘... എന്നു നിങ്ങൾ കാണുന്നു’ എന്ന ഘടന തെരഞ്ഞെടുത്തു. ‘നീതീകരിക്കപ്പെടുന്നു’ എന്ന സഭാപരിചിതമായ ദൈവശാസ്ത്രപദം സാധാരണ വായനക്കാർക്ക് അല്പം സാങ്കേതികമാകുന്നതിനാൽ അതിന്റെ സാധ്യമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
