  terminology: ‘പക്ഷപാതം,’ ‘പാപം,’ ‘നിയമം,’ and ‘നിയമലംഘകർ’ are appropriate modern-standard Malayalam terms and preserve the judicial and biblical register. ‘നിയമം’ rightly remains unqualified.
