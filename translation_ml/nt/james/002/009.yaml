  source_fidelity: The draft accurately represents the conditional contrast, the idiom of showing partiality, committing sin, and the law's role in exposing guilt. A small syntactic revision better preserves the force of ὡς παραβάται (‘as transgressors’) without the somewhat awkward sequence ‘നിയമലംഘകരെന്ന് ... കുറ്റക്കാരായി’.
