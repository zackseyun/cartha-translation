id: JAS.2.9
reference: James 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ προσωπολημπτεῖτε, ἁμαρτίαν ἐργάζεσθε, ἐλεγχόμενοι ὑπὸ τοῦ νόμου ὡς παραβάται.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ പക്ഷപാതം കാണിക്കുന്നുവെങ്കിൽ[a], നിങ്ങൾ പാപം ചെയ്യുന്നു; നിയമം നിങ്ങളെ നിയമലംഘകരായി[b] കുറ്റക്കാരെന്നു തെളിയിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുഖം നോക്കി പെരുമാറുന്നുവെങ്കിൽ’ അല്ലെങ്കിൽ ‘പ്രത്യേക പരിഗണന കാണിക്കുന്നുവെങ്കിൽ.’ ബാഹ്യസ്ഥാനമോ ഭാവമോ നോക്കി ആളുകളെ വിലയിരുത്തുകയോ അവരോട് പെരുമാറുകയോ ചെയ്യുന്നതാണ് ഗ്രീക്ക് ക്രിയ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിയമം ലംഘിക്കുന്നവരായി.’
    reason: lexical_alternative
  - marker: c
    text: ‘കുറ്റക്കാരെന്നു തെളിയിക്കുന്നു’ എന്നതിന് ‘നിങ്ങളുടെ തെറ്റ് വെളിപ്പെടുത്തുന്നു’ അല്ലെങ്കിൽ ‘നിങ്ങളെ ശാസിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: εἰയുടെ വ്യവസ്ഥാഭാവവും δέയുടെ മൃദുവായ വൈരുധ്യ/തുടർച്ചാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: προσωπολημπτεῖτε
  choice: നിങ്ങൾ പക്ഷപാതം കാണിക്കുന്നു
  rationale: പദവി, സമ്പത്ത്, ബാഹ്യനില എന്നിവ നോക്കി ആളുകളോട് വ്യത്യസ്തമായി പെരുമാറുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: നിങ്ങൾ പാപം ചെയ്യുന്നു
  rationale: അക്ഷരാർഥമായ ‘പാപം പ്രവർത്തിക്കുന്നു’ എന്നതിനു പകരം ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥവും വർത്തമാനകാലബലവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐλεγχόμενοι
  choice: കുറ്റക്കാരായി തെളിയിക്കുന്നു
  rationale: നിയമം തെറ്റ് വെളിപ്പെടുത്തുകയും കുറ്റം സ്ഥാപിക്കുകയും ചെയ്യുന്നു എന്ന നിഷ്ക്രിയ പങ്കാളിക്രിയയുടെ ന്യായവിധിസംബന്ധമായ ഭാവം പ്രകടമാക്കുന്നു.
- source_word: ὑπὸ τοῦ νόμου
  choice: നിയമം നിങ്ങളെ
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയ നിർമാണം സ്വാഭാവിക മലയാളത്തിനായി കർത്തരി രൂപത്തിലാക്കിയെങ്കിലും നിയമം പ്രവർത്തകമാണെന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: ὡς παραβάται
  choice: നിയമലംഘകരെന്ന്
  rationale: നിശ്ചയിച്ച അതിർത്തി ലംഘിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന παραβάταιയുടെ നിയമപരവും വേദപുസ്തകപരവുമായ ഭാവം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യാക്കോബിന്റെ ധാർമിക വാദത്തിലെ νόμος എന്ന നിയമത്തിന്റെ സ്വഭാവം
  choice: ‘നിയമം’ എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘മോശെയുടെ നിയമം’ അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ നിയമം’
  rationale: പക്ഷപാതത്തെ പാപമായി വെളിപ്പെടുത്തുന്ന മാനദണ്ഡമായാണ് വാക്യം നിയമത്തെ അവതരിപ്പിക്കുന്നത്. ഗ്രീക്ക് ഇവിടെ പ്രത്യേക ഉടമ്പടിശാസ്ത്ര വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ വ്യാപ്തി ചുരുക്കിയിട്ടില്ല.
- issue: ἐλεγχόμενοι എന്നതിന്റെ കുറ്റസ്ഥാപനഭാവം
  choice: നിയമം ‘കുറ്റക്കാരായി തെളിയിക്കുന്നു’
  alternative: നിയമം ‘ശാസിക്കുന്നു’ അല്ലെങ്കിൽ ‘തെറ്റ് വെളിപ്പെടുത്തുന്നു’
  rationale: ഈ പദത്തിന് വെളിപ്പെടുത്തൽ, ശാസിക്കൽ, കുറ്റം തെളിയിക്കൽ എന്നീ അർഥസാധ്യതകളുണ്ട്. νόμος, παραβάται എന്നീ നിയമപരമായ സന്ദർഭപദങ്ങൾ കാരണം കുറ്റം സ്ഥാപിക്കുന്ന ഭാവം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചെങ്കിലും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. ഗ്രീക്കിലെ നിഷ്ക്രിയ പങ്കാളിക്രിയ മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി കർത്തരി വാക്യമായി മാറ്റി; എന്നാൽ നിയമമാണ് കുറ്റം സ്ഥാപിക്കുന്നത് എന്ന ബന്ധം നിലനിർത്തി. ‘നിയമലംഘകർ’ എന്ന പദം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും സന്ദർഭത്തിലെ നിയമപരമായ ഭാവം സൂക്ഷിക്കുന്നതുമാണ്.
