id: JAS.2.3
reference: James 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: ml
  text: തിളങ്ങുന്ന വസ്ത്രം ധരിച്ചിരിക്കുന്നവനെ നിങ്ങൾ പ്രത്യേകം ശ്രദ്ധിച്ച്, “നീ ഇവിടെ നല്ലൊരു സ്ഥാനത്ത് ഇരിക്കുക” എന്നു പറയുകയും ദരിദ്രനായ മനുഷ്യനോട്, “നീ നിൽക്കുക; അല്ലെങ്കിൽ എന്റെ പാദപീഠത്തിനു താഴെ അവിടെ ഇരിക്കുക”[b] എന്നു പറയുകയും ചെയ്യുന്നുവെങ്കിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികൾ “അല്ലെങ്കിൽ അവിടെ ഇരിക്കുക” എന്ന വാക്കുകൾ ഒഴിവാക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: പ്രത്യേകം ശ്രദ്ധിച്ച്
  rationale: ഈ സന്ദർഭത്തിൽ വെറുതെ നോക്കുക എന്നതിലുപരി അനുകൂലമായ ശ്രദ്ധ നൽകുക എന്ന ആശയമാണ് ക്രിയയ്ക്കുള്ളത്. എന്നാൽ ‘പക്ഷപാതം കാണിക്കുക’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കാതെ പ്രവൃത്തിയെ തന്നെയാണ് പരിഭാഷ വ്യക്തമാക്കുന്നത്.
- source_word: φοροῦντα
  choice: ധരിച്ചിരിക്കുന്നവനെ
  rationale: വസ്ത്രം ധരിച്ചിരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: തിളങ്ങുന്ന വസ്ത്രം
  rationale: ἐσθής എന്നത് വസ്ത്രത്തെയും λαμπρός തിളക്കമുള്ളത്, ശോഭയുള്ളത്, വിശിഷ്ടമായത് എന്നീ അർഥങ്ങളെയും സൂചിപ്പിക്കുന്നു. ‘തിളങ്ങുന്ന വസ്ത്രം’ ദൃശ്യമായ അർഥം നിലനിർത്തുന്നു.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: നീ ഇവിടെ നല്ലൊരു സ്ഥാനത്ത് ഇരിക്കുക
  rationale: ആജ്ഞാരൂപവും ὧδε എന്ന സ്ഥലസൂചനയും നിലനിർത്തുന്നു; καλῶς ഇവിടെ അനുകൂലമായ ഇരിപ്പിടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നല്ലൊരു സ്ഥാനത്ത്’ എന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: τῷ πτωχῷ
  choice: ദരിദ്രനായ മനുഷ്യനോട്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പുല്ലിംഗ ഏകവചന വിശേഷണം ഈ രംഗത്തിലെ ഒരു നിർദിഷ്ട ദരിദ്രനായ പുരുഷനെ സൂചിപ്പിക്കുന്നു.
- source_word: στῆθι
  choice: നിൽക്കുക
  rationale: ἵστημι എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ലളിതമായ കല്പനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἢ κάθου ἐκεῖ
  choice: അല്ലെങ്കിൽ അവിടെ ... ഇരിക്കുക
  rationale: ബദൽ കല്പനയും ἐκεῖ എന്ന അകലസൂചനയും നിലനിർത്തുന്നു.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: എന്റെ പാദപീഠത്തിനു താഴെ
  rationale: ὑπό എന്നതിന്റെ ‘താഴെ’ എന്ന സ്ഥലാർഥം നിലനിർത്തുന്നു. പ്രയോഗം അസ്വാഭാവികമായി തോന്നിയാലും ദരിദ്രനോടുള്ള അപമാനകരമായ പെരുമാറ്റത്തിന്റെ ശക്തി മയപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: സാമൂഹിക പക്ഷപാതത്തിന്റെ ഭാഷ
  choice: സമ്പന്നനു നൽകുന്ന ആദരവും ദരിദ്രനു നൽകുന്ന അപമാനവും ഇരിപ്പിടത്തെക്കുറിച്ചുള്ള വാക്കുകളിലൂടെയും പ്രവൃത്തിയിലൂടെയും പ്രകടമാകാൻ അനുവദിച്ചു.
  alternative: പ്രധാനപാഠത്തിൽത്തന്നെ ‘പ്രത്യേക പരിഗണന കാണിക്കുക’ അല്ലെങ്കിൽ ‘പക്ഷപാതം കാണിക്കുക’ എന്നു കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പറയുക.
  rationale: സന്ദർഭം പക്ഷപാതത്തെ കുറ്റപ്പെടുത്തുന്നുവെങ്കിലും ഈ വാക്യം വ്യത്യസ്തമായ പെരുമാറ്റം വിവരിക്കുന്നു. അതിനാൽ പിൽക്കാല സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ ഭാഷ ചേർത്തിട്ടില്ല.
- issue: πτωχῷ എന്നതിലെ ലിംഗസൂചന
  choice: ദരിദ്രനായ മനുഷ്യൻ
  alternative: ദരിദ്രനായ വ്യക്തി
  rationale: ഗ്രീക്കിൽ നിർദിഷ്ടനായ ഒരാളെ പുല്ലിംഗ ഏകവചനത്തിൽ അവതരിപ്പിക്കുന്നതിനാൽ ലിംഗസൂചന നിലനിർത്തി.
- issue: നേരിട്ടുള്ള അഭിസംബോധനയിലെ സർവനാമം
  choice: രണ്ടുപേരോടും ‘നീ’ ഉപയോഗിച്ചു.
  alternative: സമ്പന്നനോട് ‘താങ്കൾ’ എന്നും ദരിദ്രനോട് ‘നീ’ എന്നും ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിൽ രണ്ടിടത്തും ഒരേ ഏകവചന രണ്ടാംപുരുഷ സർവനാമമായ σύ ആണ്. മലയാളത്തിലെ ആദരസൂചക വ്യത്യാസം ചേർത്ത് മൂലപാഠത്തിലുള്ളതിലധികം സാമൂഹിക ഭേദം സൃഷ്ടിക്കാതെ, ഇരിപ്പിടത്തിലെ വ്യത്യാസം തന്നെ ആശയം വഹിക്കാൻ അനുവദിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. സമ്പന്നനും ദരിദ്രനും തമ്മിലുള്ള പെരുമാറ്റവ്യത്യാസം വ്യക്തമാണ്; എന്നാൽ ഗ്രീക്കിൽ ഇല്ലാത്ത ആദരസൂചക സർവനാമവ്യത്യാസം ചേർത്തിട്ടില്ല. ആശ്രിതവാക്യത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കാൻ അവസാനം ‘പറയുന്നുവെങ്കിൽ’ ഉപയോഗിച്ചു.
