id: JAS.2.26
reference: James 2:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: ml
  text: കാരണം, ആത്മാവില്ലാത്ത[a] ശരീരം മരിച്ചിരിക്കുന്നതുപോലെ, പ്രവൃത്തികളില്ലാത്ത വിശ്വാസവും[b] മരിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശ്വാസമില്ലാത്ത.’ ഗ്രീക്ക് പദത്തിന് ‘ആത്മാവ്’ എന്നും ‘ശ്വാസം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിശ്വസ്തത.’ ഗ്രീക്ക് പദത്തിന് ‘വിശ്വാസം’ എന്നതിനുപുറമേ ‘വിശ്വസ്തത’ എന്നും അർഥമാകാം; പ്രധാനവാചകത്തിൽ പതിവ് പരിഭാഷയായ ‘വിശ്വാസം’ നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: …പോലെതന്നെ
  rationale: ὥσπερ സൂചിപ്പിക്കുന്ന ഉപമ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. γάρ മുൻവാദത്തിനുള്ള വിശദീകരണബന്ധം നൽകുന്നു; മലയാളവാക്യത്തിൽ ഉപമയുടെ ഘടനയിലൂടെ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: τὸ σῶμα
  choice: ശരീരം
  rationale: ഭൗതിക ശരീരത്തിനുള്ള നേരിട്ടുള്ള, സാധാരണ മലയാള പദം.
- source_word: χωρὶς πνεύματος
  choice: ആത്മാവില്ലാത്ത
  rationale: χωρίς എന്നതിന്റെ ‘ഇല്ലാതെ/വേറിട്ട്’ എന്ന അർഥവും πνεῦμα എന്നതിന്റെ പ്രധാന അർഥമായ ‘ആത്മാവ്’ എന്നതും സംക്ഷിപ്തമായി നൽകുന്നു. ‘ശ്വാസം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: νεκρόν ἐστιν
  choice: മരിച്ചിരിക്കുന്നു
  rationale: അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും ശക്തവുമായ സമാനപദം; രണ്ടാം പകുതിയിലും ആവർത്തിച്ച് വാക്യസമാന്തര്യം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: οὕτως καὶ
  choice: …വും
  rationale: ഉപമയുടെ രണ്ടാമത്തെ അനുബന്ധഭാഗം മലയാളത്തിലെ ‘-വും’ കൊണ്ട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ‘പോലെതന്നെ’യും ‘-വും’യും ചേർന്ന് ‘അങ്ങനെതന്നെ … കൂടെ’ എന്ന ശക്തി നൽകുന്നു.
- source_word: ἡ πίστις
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ പതിവും നിഷ്പക്ഷവുമായ പരിഭാഷ. ‘വിശ്വസ്തത’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: χωρὶς ἔργων
  choice: പ്രവൃത്തികളില്ലാത്ത
  rationale: ἔργα എന്ന പദത്തിന്റെ ബൈബിൾപരമായ ബന്ധം നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ; യാക്കോബിന്റെ മുൻവാദവുമായി പദബന്ധം കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ πνεύματος എന്ന പദത്തിന്റെ അർഥം
  choice: ആത്മാവ്
  alternative: ശ്വാസം
  rationale: ‘ആത്മാവ്’ ഗ്രീക്ക് പദത്തിന്റെ സാധാരണ അർഥപരിധിയും ശരീരത്തെ ജീവിപ്പിക്കുന്ന ഘടകമെന്ന ഉപമയും നിലനിർത്തുന്നു. ‘ശ്വാസം’ സാദ്ധ്യമായ മറ്റൊരു അർഥമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: യാക്കോബ് 2:26-ലെ πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: പ്രധാനവാചകത്തിൽ പതിവ് പരിഭാഷയായ ‘വിശ്വാസം’ നിലനിർത്തുന്നു. സന്ദർഭത്തെ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ ‘വിശ്വസ്തത’ എന്ന പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ശരീരം–വിശ്വാസം, ആത്മാവ്–പ്രവൃത്തികൾ, മരണം–മരണം എന്നീ സമാന്തര ഘടകങ്ങൾ വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട ആശയങ്ങൾക്കു പിന്നാലെ വാക്യാവസാനത്തിൽ നൽകിയിരിക്കുന്നു.
