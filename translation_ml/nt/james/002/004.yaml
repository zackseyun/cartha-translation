id: JAS.2.4
reference: James 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οὐ διεκρίθητε ἐν ἑαυτοῖς καὶ ἐγένεσθε κριταὶ διαλογισμῶν πονηρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/004.yaml
  text: have you not made distinctions among yourselves and become judges with evil thoughts?[a][b]
translation:
  language: ml
  text: നിങ്ങൾ നിങ്ങളുടെ ഇടയിൽ വിവേചനം കാണിക്കുകയും ദുഷ്ടചിന്തകളുള്ള ന്യായാധിപന്മാരായിത്തീരുകയും ചെയ്തില്ലയോ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ഇടയിൽ പക്ഷപാതപരമായ വേർതിരിവ് വരുത്തിയില്ലയോ?” ഈ ക്രിയയ്ക്ക് “ഭിന്നിച്ചുപോകുക” എന്നും മറ്റു സന്ദർഭങ്ങളിൽ “സംശയിക്കുക” എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ വിവേചനപരമായ വേർതിരിവാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ദുഷ്ടചിന്തകളുടെ/ദുഷ്ടമായ ന്യായവിചാരങ്ങളുടെ ന്യായാധിപന്മാർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: വിവേചനം കാണിക്കുകയും
  rationale: സമ്പന്നനോടും ദരിദ്രനോടും വ്യത്യസ്തമായി പെരുമാറുന്ന 2:1–3-ലെ സന്ദർഭത്തിൽ, ഇവിടെ ക്രിയ സാമൂഹികമായ പക്ഷപാതപരമായ വേർതിരിവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സംശയിച്ചു’ എന്ന അർഥം യാക്കോബിന്റെ മറ്റു സന്ദർഭങ്ങളിൽ സാധ്യമാണെങ്കിലും ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: ἐν ἑαυτοῖς
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: സഭാസമൂഹത്തിനുള്ളിലെ പരസ്പര പെരുമാറ്റമാണ് സന്ദർഭം; അതിനാൽ ‘നിങ്ങളുടെ ഉള്ളിൽ’ എന്നതിനെക്കാൾ സമൂഹപരമായ അർഥം സ്വാഭാവികമാണ്.
- source_word: ἐγένεσθε
  choice: ആയിത്തീരുകയും
  rationale: മുമ്പ് പറഞ്ഞ വിവേചനത്തിന്റെ ഫലമായി അവർ ഒരു പ്രത്യേക സ്വഭാവമുള്ള ന്യായാധിപന്മാരായിത്തീർന്നു എന്ന ഫലഭാവം നിലനിർത്തുന്നു.
- source_word: κριταὶ
  choice: ന്യായാധിപന്മാർ
  rationale: κριτής എന്ന പദത്തിന്റെ നേരിട്ടുള്ള ന്യായവിധിസംബന്ധമായ അർഥവും വാക്യത്തിലെ ധാർമിക കുറ്റപ്പെടുത്തലും വ്യക്തമാക്കുന്നു.
- source_word: διαλογισμῶν πονηρῶν
  choice: ദുഷ്ടചിന്തകളുള്ള
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ദുഷ്ടചിന്തകളുടെ ന്യായാധിപന്മാർ’ എന്ന ജനിറ്റീവ് ഘടനയുടെ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുമ്പോൾ, മുഖ്യവാചകത്തിൽ ദുഷ്ടമായ ചിന്തകളാൽ സ്വഭാവീകരിക്കപ്പെട്ട ന്യായാധിപന്മാർ എന്ന സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐ
  choice: ചെയ്തില്ലയോ?
  rationale: സമ്മതാത്മകമായ മറുപടി പ്രതീക്ഷിക്കുന്ന ശാസനാത്മക അലങ്കാരചോദ്യത്തിന്റെ ശക്തി മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പക്ഷപാതത്തിന്റെ പശ്ചാത്തലത്തിൽ διακρίνω എന്ന ക്രിയയുടെ അർഥം
  choice: വിശ്വാസസമൂഹത്തിനുള്ളിൽ വിവേചനപരമായ വേർതിരിവ് കാണിച്ചതിനെയാണ് വാക്യം ശാസിക്കുന്നത്.
  alternative: മനസ്സിൽ ഭിന്നിച്ചുപോകുകയോ സംശയിക്കുകയോ ചെയ്തതിനെ വാക്യം സൂചിപ്പിക്കുന്നു.
  rationale: യാക്കോബ് 2:1–3-ൽ ഉടൻ മുമ്പുള്ള വിഷയം സമ്പന്നനോടുള്ള പക്ഷപാതവും ദരിദ്രനോടുള്ള അവഗണനയുമാണ്. അതിനാൽ സാമൂഹിക വിവേചനത്തിന്റെ അർഥമാണ് ഇവിടെ ഏറ്റവും യോജിച്ചത്; എങ്കിലും ക്രിയയുടെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശാസനാത്മക ചോദ്യരൂപം നിലനിർത്തി. ‘വിവേചനം കാണിക്കുക’ സാമൂഹിക discrimination വ്യക്തമാക്കുന്നു; ‘ന്യായാധിപന്മാർ’ മൂലപദത്തിന്റെ ന്യായവിധിസംബന്ധമായ ശക്തി സൂക്ഷിക്കുന്നു.
