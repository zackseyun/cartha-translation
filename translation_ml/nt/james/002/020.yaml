  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: ml
  text: എന്നാൽ, പൊള്ളയായ മനുഷ്യാ[a], പ്രവൃത്തികളില്ലാത്ത വിശ്വാസം നിഷ്‌ഫലമാണെന്ന്[b] അറിയാൻ നിനക്കു മനസ്സുണ്ടോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൂഢനായ മനുഷ്യാ” / “വ്യർഥനായ മനുഷ്യാ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ശൂന്യനായ മനുഷ്യാ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിഷ്‌ക്രിയമാണ്” അല്ലെങ്കിൽ “ഫലപ്രദമല്ല.” ഗ്രീക്ക് പദം പ്രവർത്തനരഹിതമോ ഫലമുളവാക്കാത്തതോ എന്ന അർഥം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: എന്നാൽ ... അറിയാൻ നിനക്കു മനസ്സുണ്ടോ
  rationale: θέλω + infinitive ഇച്ഛയെയോ മനസ്സൊരുക്കത്തെയോ സൂചിപ്പിക്കുന്നു; δέ ഇവിടെ മുൻവാദത്തോടുള്ള പ്രതികരണമായി ‘എന്നാൽ’ എന്നു സ്വാഭാവികമായി വരുന്നു. γνῶναιയുടെ ‘അറിയുക’ എന്ന അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὦ ἄνθρωπε κενέ
  choice: പൊള്ളയായ മനുഷ്യാ
  rationale: ἄνθρωπε ഏകവചന സംബോധനയാണ്. κενός എന്നതിന്റെ അടിസ്ഥാനചിത്രമായ ഉള്ളടക്കമില്ലായ്മ ‘പൊള്ളയായ’ എന്നു നിലനിർത്തുന്നു; ‘മൂഢനായ’ എന്ന വ്യാഖ്യാനാത്മക അർത്ഥത്തിലേക്ക് മുഖ്യപാഠം ചുരുക്കുന്നില്ല.
- source_word: ὅτι
  choice: എന്ന്
  rationale: അറിയേണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ ‘എന്ന്’ സ്വാഭാവികമാണ്.
- source_word: ἡ πίστις
  choice: വിശ്വാസം
  rationale: πίστις എന്നതിന് ഈ വാദസന്ദർഭത്തിൽ പതിവും കുറഞ്ഞ വ്യാഖ്യാനഭാരവുമുള്ള മലയാളപദം ‘വിശ്വാസം’ ആണ്.
- source_word: χωρὶς τῶν ἔργων
  choice: പ്രവൃത്തികളില്ലാത്ത
  rationale: χωρίς + genitive സൂചിപ്പിക്കുന്ന ‘കൂടാതെയുള്ള/വേറിട്ടുള്ള’ ബന്ധം മലയാളത്തിൽ ചുരുക്കവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ἔργα ‘പ്രവൃത്തികൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: ἀργή ἐστιν
  choice: നിഷ്‌ഫലമാണ്
  rationale: ἀργός ഇവിടെ പ്രവർത്തനരഹിതവും ഫലം ഉളവാക്കാത്തതുമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘നിഷ്‌ഫലം’ ആ പ്രായോഗിക ബലം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘നിഷ്‌ക്രിയം’ എന്ന കൂടുതൽ രൂപസമീപമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യാക്കോബിന്റെ വാദത്തിൽ വിശ്വാസവും പ്രവൃത്തികളും തമ്മിലുള്ള ബന്ധം
  choice: പ്രവൃത്തികളില്ലാത്ത വിശ്വാസത്തെ ‘നിഷ്‌ഫലം’ എന്ന് നേരിട്ട് വിശേഷിപ്പിക്കുക
  alternative: ‘നിഷ്‌ക്രിയം’ എന്ന് ദുർബലമായി പറയുക, അല്ലെങ്കിൽ സമീപവാക്യങ്ങളോട് ഒത്തുചേർത്ത് ‘മരിച്ചത്’ എന്ന് ശക്തിപ്പെടുത്തുക
  rationale: ഈ വാക്യത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നത് ἀργή ആണ്, νεκρά അല്ല. അതിനാൽ സമീപവാക്യത്തിലെ ‘മരിച്ചത്’ എന്ന ഭാഷയിലേക്കോ ഏതെങ്കിലും പിൽക്കാല ദൈവശാസ്ത്രവ്യവസ്ഥയിലേക്കോ ഇതിനെ ലയിപ്പിക്കാതെ പാഠത്തിന്റെ സ്വന്തം സംഘർഷവും കൃത്യതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഏകവചന സംബോധനയും κενός എന്ന പദത്തിന്റെ ഉള്ളടക്കമില്ലായ്മയുടെ ചിത്രവും നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
