id: JAS.2.18
reference: James 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: ml
  text: എന്നാൽ ഒരാൾ ഇങ്ങനെ പറയും:[d] “നിനക്കു വിശ്വാസം[a] ഉണ്ട്; എനിക്കു പ്രവൃത്തികളുണ്ട്.” പ്രവൃത്തികളില്ലാതെ[b] നിന്റെ വിശ്വാസം എനിക്കു കാണിച്ചുതരുക; ഞാനോ എന്റെ പ്രവൃത്തികളിലൂടെ[c] എന്റെ വിശ്വാസം നിനക്കു കാണിച്ചുതരാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് pistis എന്ന പദത്തിന് ‘ആശ്രയം’ എന്നും ചില സന്ദർഭങ്ങളിൽ ‘വിശ്വസ്തത’ എന്നും അർത്ഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “പ്രവൃത്തികളിൽനിന്നു വേറിട്ട്.” ഗ്രീക്ക് പ്രയോഗത്തിന് ‘ഇല്ലാതെ’ എന്നും ‘വേറിട്ട്’ എന്നും പരിഭാഷ നൽകാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “എന്റെ പ്രവൃത്തികളിൽനിന്ന്.” ഗ്രീക്ക് പൂർവപ്രത്യയം ഉറവിടമോ മാർഗമോ സൂചിപ്പിക്കാം; പ്രവൃത്തികൾ വിശ്വാസത്തെ ദൃശ്യമാക്കുന്നു എന്ന ആശയം “പ്രവൃത്തികളിലൂടെ” വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: d
    text: പുരാതന ഗ്രീക്ക് പാഠത്തിൽ ഉദ്ധരണിച്ചിഹ്നങ്ങളില്ലാത്തതിനാൽ സാങ്കൽപ്പിക എതിർവാദിയുടെ വാക്കുകൾ എവിടെ അവസാനിക്കുന്നു എന്നത് ഉറപ്പില്ല. ചിലർ തുടർന്നുള്ള വെല്ലുവിളിയും അതേ വ്യക്തിയുടെ വാക്കുകളായി വായിക്കുന്നു.
    reason: quotation_boundary
lexical_decisions:
- source_word: Ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാദത്തോടുള്ള എതിർപ്പോ ആക്ഷേപമോ അവതരിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ വിരുദ്ധബന്ധകമാണ്.
- source_word: ἐρεῖ τις
  choice: ഒരാൾ ഇങ്ങനെ പറയും
  rationale: ഭാവികാല നിർദേശകത്തിന്റെ രൂപവും സാങ്കൽപ്പിക എതിർവാദിയെ അവതരിപ്പിക്കുന്ന വാദശൈലിയും നിലനിർത്തുന്നു.
- source_word: πίστιν / πίστιν
  choice: വിശ്വാസം
  rationale: യാക്കോബിന്റെ വിശ്വാസം–പ്രവൃത്തികൾ എന്ന വാദബന്ധം നിലനിർത്തുകയും ‘ആശ്രയം’ എന്നോ ‘വിശ്വസ്തത’ എന്നോ അർത്ഥം മുൻകൂട്ടി നിശ്ചയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἔργα / ἔργων
  choice: പ്രവൃത്തികൾ
  rationale: ‘പ്രവൃത്തികൾ’ എന്നത് ഈ ഭാഗത്തിന്റെ ആശയപരമായ ആവർത്തനം വ്യക്തമായി കാത്തുസൂക്ഷിക്കുന്ന, സ്ഥാപിതവും കൃത്യവുമായ പദമാണ്.
- source_word: δεῖξόν μοι
  choice: എനിക്കു കാണിച്ചുതരുക
  rationale: നേരിട്ടുള്ള കൽപ്പനയും വ്യക്തമായ തെളിയിച്ചുകാണിക്കൽ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: χωρὶς τῶν ἔργων
  choice: പ്രവൃത്തികൾ കൂടാതെ
  rationale: പ്രവൃത്തികളിൽനിന്നു വേറിട്ട് അഥവാ അവ ഇല്ലാതെ എന്ന χωρίς-ന്റെ അർത്ഥം അധിക വ്യാഖ്യാനം ചേർക്കാതെ നൽകുന്നു.
- source_word: κἀγώ σοι δείξω
  choice: ഞാനോ … നിനക്കു കാണിച്ചുതരാം
  rationale: κἀγώയിലെ ഊന്നലും മറുപക്ഷത്തോടുള്ള പ്രതിവാദസ്വഭാവവും ‘ഞാനോ’ എന്ന രൂപം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐκ τῶν ἔργων μου
  choice: എന്റെ പ്രവൃത്തികളിലൂടെ
  rationale: ἐκ ഇവിടെ ഉറവിടമോ മാർഗമോ സൂചിപ്പിക്കാം; പ്രവൃത്തികൾ വിശ്വാസത്തെ ദൃശ്യമാക്കുന്ന മാർഗമാണെന്ന സന്ദർഭാർഥം ‘പ്രവൃത്തികളിലൂടെ’ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: വിശ്വാസവും പ്രവൃത്തികളും സംബന്ധിച്ച വാദത്തിൽ πίστις എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ‘വിശ്വസ്തത’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഈ സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിച്ചുകളയും. ‘വിശ്വാസം’ അവകാശപ്പെടുന്ന വിശ്വാസവും അതിനെ പ്രകടമാക്കുന്ന പ്രവൃത്തികളും തമ്മിലുള്ള യാക്കോബിന്റെ വാദം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
- issue: സാങ്കൽപ്പിക എതിർവാദിയുടെ ഉദ്ധരണി എവിടെ അവസാനിക്കുന്നു
  choice: “നിനക്കു വിശ്വാസമുണ്ട്; എനിക്കു പ്രവൃത്തികളുണ്ട്” എന്നതിനു ശേഷം ഉദ്ധരണി അവസാനിപ്പിച്ചു
  alternative: വാക്യത്തിന്റെ ശേഷിക്കുന്ന ഭാഗവും എതിർവാദിയുടെ വാക്കുകളായി വായിക്കുക
  rationale: ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിലെ മൂലവിരാമചിഹ്നങ്ങൾ ഉദ്ധരണിയുടെ അതിരുകൾ നിർണ്ണയിക്കുന്നില്ല. മുഖ്യവാചകം സാധാരണമായ വായന പിന്തുടരുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രവൃത്തികൾ’ എന്നും ‘വിശ്വാസം’ എന്നും ആവർത്തിച്ച് ഗ്രീക്കിലെ വാദപരമായ സമാന്തരത നിലനിർത്തി. ‘ഞാനോ’ എന്ന പ്രയോഗം പ്രതിവാദത്തിലെ ഊന്നൽ സംക്ഷിപ്തമായി നൽകുന്നു.
