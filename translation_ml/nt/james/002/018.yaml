  terminology: “വിശ്വാസം” and “പ്രവൃത്തികൾ” are appropriate, consistent renderings for πίστις and ἔργα in James’s argument. “പ്രവൃത്തികളിലൂടെ” suitably expresses the contextual evidential/means sense of ἐκ while the alternative is retained.
