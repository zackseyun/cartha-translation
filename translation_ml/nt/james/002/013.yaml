id: JAS.2.13
reference: James 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: ml
  text: കരുണ കാണിക്കാത്തവനോടുള്ള ന്യായവിധി കരുണയില്ലാത്തതാണ്; കരുണ ന്യായവിധിയിന്മേൽ വിജയം കൊള്ളുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കരുണ ന്യായവിധിയിന്മേൽ വീമ്പുപറയുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് മറ്റൊന്നിന്റെമേൽ വീമ്പുപറയുക അഥവാ ആഹ്ലാദിക്കുക എന്ന അർഥം വരാം; ഇവിടെ അതിന്റെ ആശയം “വിജയം കൊള്ളുന്നു” എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: ന്യായവിധി
  rationale: ദൈവികവും ന്യായപരവുമായ വിലയിരുത്തൽ എന്ന ആശയം നിലനിർത്തുന്നു; ‘ശിക്ഷാവിധി’ എന്നു പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല. രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പദം ഉപയോഗിച്ച് വാക്യത്തിലെ അന്തർവിരുദ്ധത സംരക്ഷിക്കുന്നു.
- source_word: ἀνέλεος
  choice: കരുണയില്ലാത്തത്
  rationale: വിധിയുടെ സ്വഭാവം വ്യക്തമാക്കുന്ന വിശേഷണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും ἔλεος എന്ന പദവുമായുള്ള ശബ്ദാർഥബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: കരുണ കാണിക്കാത്തവനോട്
  rationale: ‘കരുണ പ്രവർത്തിക്കുക’ എന്ന സെമിറ്റിക് സ്വാധീനമുള്ള പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്; വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ആർട്ടിക്കുലാർ പാർട്ടിസിപ്പിളും ധാർമിക പ്രതിഫലനവും സംരക്ഷിക്കുന്നു.
- source_word: κατακαυχᾶται
  choice: വിജയംകൊള്ളുന്നു
  rationale: ‘മേൽ വീമ്പുപറയുക/ആഹ്ലാദിക്കുക’ എന്ന രൂപകത്തെ സന്ദർഭോചിതമായ മലയാളത്തിൽ ‘മേൽ വിജയംകൊള്ളുന്നു’ എന്നു നൽകുന്നു; മൂലക്രിയയുടെ ‘boast over’ എന്ന സാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἔλεος
  choice: കരുണ
  rationale: സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭത്തിന് യോജിച്ചതുമായ തുല്യപദം; വാക്യത്തിലുടനീളമുള്ള ആവർത്തനം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: κατακαυχᾶται ἔλεος κρίσεως എന്ന അവസാന ഉപവാക്യത്തിന്റെ സ്വഭാവം
  choice: ‘കരുണ ന്യായവിധിയുടെമേൽ വിജയംകൊള്ളുന്നു’ എന്ന പൊതുതത്ത്വരൂപം
  alternative: ‘കരുണ ന്യായവിധിയുടെമേൽ വീമ്പുപറയുന്നു’; അല്ലെങ്കിൽ കരുണ കാണിച്ച വ്യക്തിയുടെ കരുണ വിധിയിൽ മേൽക്കൈ നേടുന്നു എന്ന പ്രത്യേകീകരണം
  rationale: ഗ്രീക്ക് ഉപവാക്യം ചുരുക്കവും സൂക്തരൂപത്തിലുള്ളതുമാണ്. ദൈവത്തിന്റെ കരുണയെയാണോ, വിധിയിൽ പ്രവർത്തിക്കുന്ന കരുണയെയാണോ, വിശ്വാസികൾ കാണിച്ച കരുണയുടെ സാക്ഷ്യത്തെയാണോ മുഖ്യമായി ഉദ്ദേശിക്കുന്നത് എന്നു പരിഭാഷയിൽ തീർപ്പാക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘ന്യായവിധി’, ‘കരുണ’ എന്നീ ആവർത്തിത മുഖ്യപദങ്ങൾ മൂലത്തിലെ ബന്ധവും വിരുദ്ധതയും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സൂചകം പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
