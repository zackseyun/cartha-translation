source:
  edition: SBLGNT
  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: ml
  text: എന്തെന്നാൽ, സ്വർണ്ണമോതിരങ്ങൾ അണിഞ്ഞ് തിളക്കമുള്ള വസ്ത്രം ധരിച്ച ഒരുവൻ നിങ്ങളുടെ സമ്മേളനത്തിൽ[a] കടന്നുവരികയും, അഴുക്കുപിടിച്ച വസ്ത്രം ധരിച്ച ഒരു ദരിദ്രനും കടന്നുവരികയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സിനഗോഗിൽ.’ ഗ്രീക്ക് പദം സിനഗോഗേ എന്നാണ്; അതിന് അക്ഷരാർഥത്തിൽ ‘സിനഗോഗ്’ എന്നോ ‘സമ്മേളനം’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: സഭായോഗം
  rationale: സന്ദർഭത്തിൽ വിശ്വാസികളുടെ കൂടിവരവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സഭായോഗം’ എന്നത് ഒരു ഔപചാരിക യഹൂദസ്ഥാപനം മാത്രമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും കൂടിവരവിന്റെ അർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു; ‘സിനഗോഗ്’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀνὴρ
  choice: ഒരാൾ
  rationale: ഗ്രീക്കിൽ പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും, മലയാളത്തിലെ ‘ഒരാൾ’ ഈ ദൃശ്യത്തിലെ വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ദരിദ്രനുമായുള്ള വ്യക്തിവ്യത്യാസവും നിലനിൽക്കുന്നു.
- source_word: χρυσοδακτύλιος
  choice: സ്വർണ്ണമോതിരങ്ങൾ അണിഞ്ഞ്
  rationale: വിരലുകളിൽ സ്വർണ്ണാഭരണങ്ങൾ അണിഞ്ഞിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന വിശേഷണം സമ്പത്തിന്റെ പ്രകടമായ അടയാളം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: ἐσθῆτι λαμπρᾷ
  choice: തിളക്കമുള്ള വസ്ത്രം ധരിച്ച
  rationale: λαμπρός എന്ന പദത്തിന്റെ ദൃശ്യമായ ‘തിളക്കമുള്ള’ എന്ന ഭാവം നിലനിർത്തുന്നു; അതോടൊപ്പം ആകർഷകവും പ്രൗഢവുമായ വേഷത്തിന്റെ സൂചനയും ലഭിക്കുന്നു.
- source_word: πτωχὸς
  choice: ഒരു ദരിദ്രൻ
  rationale: പുരുഷലിംഗ ഏകവചനമായി നാമവത്കരിച്ച വിശേഷണം; ആദ്യ വ്യക്തിയോടുള്ള വ്യാകരണപരവും സാമൂഹികവുമായ വിരുദ്ധത സംരക്ഷിക്കുന്നു.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: അഴുക്കുപിടിച്ച വസ്ത്രം ധരിച്ച
  rationale: ῥυπαρός സൂചിപ്പിക്കുന്ന യഥാർഥ അഴുക്കും താഴ്ന്ന സാമൂഹിക പ്രതീതിയും ‘മുഷിഞ്ഞ’ പോലുള്ള മൃദുവായ പദങ്ങളേക്കാൾ വ്യക്തമായി നൽകുന്നു.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: കടന്നുവരികയും ... കടന്നുവരികയും
  rationale: ആവർത്തിച്ച ഗ്രീക്ക് ക്രിയയും സാങ്കൽപ്പിക സാഹചര്യത്തിന്റെ സമാന്തര ഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പക്ഷപാതനിരോധനത്തെ വിശദീകരിക്കുന്ന ഉദാഹരണത്തിലേക്കുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ക്രിസ്തീയ സന്ദർഭത്തിലെ συναγωγή എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഭായോഗം
  alternative: സിനഗോഗ്
  rationale: ഇവിടെ സഭാഭരണത്തെക്കുറിച്ചുള്ള സാങ്കേതിക അവകാശവാദമല്ല, കൂടിവരവിന്റെ സ്ഥലമോ യോഗമോ ആണ് ഉദ്ദേശ്യം. ‘സഭായോഗം’ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു; ആദ്യകാല യഹൂദ-ക്രിസ്തീയ പ്രയോഗത്തിന്റെ സാധ്യത മറച്ചുവയ്ക്കാതിരിക്കാൻ ‘സിനഗോഗ്’ അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ സാങ്കൽപ്പിക നിബന്ധനയും ഇരട്ട ‘കടന്നുവരികയും’ ഘടനയും നിലനിർത്തി. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ ഉപയോഗിച്ചു.
