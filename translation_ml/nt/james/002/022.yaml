  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: ml
  text: വിശ്വാസം അവന്റെ പ്രവൃത്തികളോടൊപ്പം പ്രവർത്തിച്ചുകൊണ്ടിരുന്നുവെന്നും, പ്രവൃത്തികളാൽ വിശ്വാസം സമ്പൂർണമാക്കപ്പെട്ടുവെന്നും[a] നീ കാണുന്നുവല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രവൃത്തികളാൽ വിശ്വാസം പൂർണത പ്രാപിച്ചു” / “പക്വതയിലെത്തി.” ഗ്രീക്ക് ക്രിയ ഉദ്ദേശിച്ച ലക്ഷ്യത്തിലേക്കോ സമ്പൂർണതയിലേക്കോ എത്തുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: നീ കാണുന്നുവല്ലോ
  rationale: വർത്തമാനകാല ദ്വിതീയപുരുഷ ഏകവചനത്തെ നേരിട്ടുള്ള ആലങ്കാരിക അഭിസംബോധനയായി നിലനിർത്തുന്നു; ‘-വല്ലോ’ വാദത്തിന്റെ നിഗമനം ചൂണ്ടിക്കാട്ടുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: ἡ πίστις
  choice: വിശ്വാസം
  rationale: യാക്കോബിന്റെ വാദത്തിലെ പ്രധാന പദം സ്ഥിരമായി നിലനിർത്തുകയും ‘വിശ്വസ്തത’, ‘ആശ്രയം’ തുടങ്ങിയ സാധ്യതകളാൽ സന്ദർഭത്തെ അതിയായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: συνήργει
  choice: ഒപ്പം പ്രവർത്തിച്ചുകൊണ്ടിരുന്നു
  rationale: സഹകരണം സൂചിപ്പിക്കുന്ന σύν- എന്ന ആശയവും ഭൂതകാലത്തിൽ തുടർന്നുകൊണ്ടിരുന്ന പ്രവർത്തനം സൂചിപ്പിക്കുന്ന അപൂർണഭൂതകാല രൂപവും പ്രകടമാക്കുന്നു.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: അവന്റെ പ്രവൃത്തികളോടൊപ്പം
  rationale: സഹകരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പ്രവൃത്തികൾ’ യാക്കോബ് 2-ലെ ആവർത്തിത പദപ്രയോഗവുമായി യോജിക്കുന്നു.
- source_word: ἐκ τῶν ἔργων
  choice: പ്രവൃത്തികളാൽ
  rationale: ἐκ ഇവിടെ വിശ്വാസം പൂർണതയിലെത്തിയതിന്റെ മാർഗമോ ഉറവിടമോ സൂചിപ്പിക്കുന്നു; ‘-ആൽ’ അതിനെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും തുറന്ന നിലയിലും അവതരിപ്പിക്കുന്നു.
- source_word: ἐτελειώθη
  choice: പൂർണതയിലെത്തി
  rationale: τελειόω എന്ന ക്രിയയുടെ ഉദ്ദേശിച്ച അന്ത്യം, സമ്പൂർണത, പക്വത എന്നിവയിലെത്തുക എന്ന ആശയം നൽകുന്നു; വിശ്വാസം മുമ്പ് ധാർമ്മികമായി ദോഷമുള്ളതായിരുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസവും പ്രവൃത്തികളും തമ്മിലുള്ള ബന്ധം
  choice: വിശ്വാസം പ്രവൃത്തികളോടൊപ്പം പ്രവർത്തിക്കുകയും പ്രവൃത്തികളാൽ പൂർണതയിലെത്തുകയും ചെയ്തു എന്ന ഗ്രീക്ക് വാചകത്തിന്റെ സംഘർഷഭരിതമായ പ്രസ്താവന നേരിട്ട് നിലനിർത്തി.
  alternative: പ്രവൃത്തികൾ മനുഷ്യരുടെ മുമ്പിൽ വിശ്വാസം വെളിപ്പെടുത്തുന്നു എന്നോ, പ്രവൃത്തികൾ വിശ്വാസത്തിന്റെ അനിവാര്യ പ്രകടനമാണെന്നോ, അവ വിശ്വാസത്തെ പക്വമാക്കുന്നു എന്നോ വിശദീകരിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: വാക്യം സഹപ്രവർത്തനവും പൂർണതയിലെത്തലും പറയുന്നു; എന്നാൽ നീതീകരണത്തെക്കുറിച്ചുള്ള സമ്പൂർണ സിദ്ധാന്തവ്യാഖ്യാനം ഇവിടെ നൽകുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ പരിഹാരം വാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഈ സന്ദർഭത്തിൽ അബ്രാഹാമിന്റെ വിശ്വസിക്കുന്ന പ്രതികരണത്തെക്കുറിച്ചുള്ള ചർച്ചയ്ക്ക് ‘വിശ്വാസം’ ഏറ്റവും സ്വാഭാവികമാണ്; ബന്ധപ്പെട്ട മറ്റു അർഥസാധ്യതകൾ മുഖ്യവാചകത്തിൽ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യാക്കോബിന്റെ നേരിട്ടുള്ള വാദശൈലി ‘നീ കാണുന്നുവല്ലോ’ എന്ന രൂപത്തിൽ നിലനിർത്തി. ‘വിശ്വാസം’, ‘പ്രവൃത്തികൾ’ എന്നീ പ്രധാന പദങ്ങൾ ദൈവശാസ്ത്രപരമായ സംഘർഷം മായ്ക്കാതെ സുതാര്യമായി സൂക്ഷിച്ചു.
