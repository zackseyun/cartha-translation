id: JAS.2.12
reference: James 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: ml
  text: സ്വാതന്ത്ര്യത്തിന്റെ നിയമത്തിലൂടെ വിധിക്കപ്പെടാനിരിക്കുന്നവർ എന്ന നിലയിൽ, അങ്ങനെ സംസാരിക്കുകയും അങ്ങനെ പ്രവർത്തിക്കുകയും ചെയ്യുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: അങ്ങനെ സംസാരിക്കുകയും അങ്ങനെ പ്രവർത്തിക്കുകയും ചെയ്യുക
  rationale: രണ്ടുവട്ടം വരുന്ന οὕτως എന്ന പദത്തിന്റെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട്, തുടർച്ചയായ ആജ്ഞയായി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: νόμου ἐλευθερίας
  choice: സ്വാതന്ത്ര്യത്തിന്റെ നിയമം
  rationale: ഗ്രീക്കിലെ ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; യാക്കോബിന്റെ ലേഖനത്തിൽ ഉപയോഗിക്കുന്ന ‘സ്വാതന്ത്ര്യത്തിന്റെ നിയമം’ എന്ന ആശയത്തെ മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: διὰ νόμου
  choice: നിയമം മുഖാന്തരം
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം/മുഖാന്തരം എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘നിയമത്താൽ’ എന്നു മാത്രം പറഞ്ഞ് കർത്തൃബന്ധം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: μέλλοντες κρίνεσθαι
  choice: വിധിക്കപ്പെടാനിരിക്കുന്നവർ
  rationale: μέλλωയുടെ ഭാവിസൂചനയും κρίνεσθαιയുടെ കർമണിപ്രയോഗവും കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിധിയിൽ ‘സ്വാതന്ത്ര്യത്തിന്റെ നിയമം’ വഹിക്കുന്ന പങ്ക്
  choice: ‘നിയമം മുഖാന്തരം’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘നിയമത്താൽ’
  rationale: മൂലത്തിലെ διά + genitive മാധ്യമത്തെയോ വഴിയെയോ സൂചിപ്പിക്കുന്നു. നിയമം തന്നെയാണ് വിധികർത്താവ് എന്ന വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ, മൂലവാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ ബന്ധവും സംഘർഷവും തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ആവർത്തനവും ആജ്ഞാസ്വരവും സംരക്ഷിച്ചിട്ടുണ്ട്; അനാവശ്യമായ സഭാപരമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
