id: JAS.2.25
reference: James 2:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: ml
  text: അതുപോലെതന്നെ, വേശ്യയായ രാഹാബും ദൂതന്മാരെ സ്വീകരിക്കുകയും അവരെ മറ്റൊരു വഴിയിലൂടെ പറഞ്ഞയയ്ക്കുകയും ചെയ്തപ്പോൾ പ്രവൃത്തികളാൽ നീതീകരിക്കപ്പെട്ടതല്ലയോ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നീതിമതിയാണെന്ന് തെളിയിക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘നീതിമതിയായി പ്രഖ്യാപിക്കപ്പെട്ടു.’ ഗ്രീക്കിൽ ‘നീതീകരിക്കപ്പെട്ടു’ എന്നാണ്; ഇവിടെ ഉദ്ദേശിക്കുന്ന സൂക്ഷ്മഭാവത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്ര ചർച്ച തീർപ്പാക്കാതെ പരിഭാഷ ആ പദപ്രയോഗം നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ദൂതന്മാർ.’ സന്ദർഭം രാഹാബ് സ്വീകരിച്ച മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത് (യോശുവ 2), സ്വർഗീയ ദൂതന്മാരെയല്ല.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: അതുപോലെതന്നെ, ...യും
  rationale: മുൻ ഉദാഹരണമായ അബ്രാഹാമിനോടുള്ള താരതമ്യവും രാഹാബിനെ രണ്ടാമത്തെ ഉദാഹരണമായി ചേർക്കുന്ന ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ῥαὰβ
  choice: രാഹാബ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: ἡ πόρνη
  choice: വേശ്യയായ
  rationale: πόρνηയുടെ നേരിട്ടുള്ള അർഥവും സാമൂഹിക-ധാർമിക ശക്തിയും ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ... ἐδικαιώθη
  choice: നീതീകരിക്കപ്പെട്ടതല്ലയോ?
  rationale: δικαιόω എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില ചുരുക്കാതെ, യാക്കോബിന്റെ വാദവുമായി പദബന്ധം നിലനിർത്തുന്ന പ്രചാരത്തിലുള്ള മലയാള പദം.
- source_word: ἐξ ἔργων
  choice: പ്രവൃത്തികളാൽ
  rationale: ἐκ ഇവിടെ സൂചിപ്പിക്കുന്ന അടിസ്ഥാനം/മാർഗം സംക്ഷിപ്തമായും ചുറ്റുപാടിലെ വാദവുമായി യോജിച്ചും നൽകുന്നു.
- source_word: ὑποδεξαμένη
  choice: സ്വീകരിക്കുകയും
  rationale: അതിഥിസത്കാരപൂർവമായ സ്വീകരണം സൂചിപ്പിക്കുന്നു; ചേർന്നിരിക്കുന്ന രണ്ടു പങ്കാളിത്തക്രിയകളുടെ ഘടനയും നിലനിർത്തുന്നു.
- source_word: τοὺς ἀγγέλους
  choice: ദൂതന്മാരെ
  rationale: ἄγγελος എന്നതിന്റെ ‘ദൂതൻ/സന്ദേശവാഹകൻ’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; യോശുവ 2-ലെ മനുഷ്യരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: അവരെ മറ്റൊരു വഴിയിലൂടെ പറഞ്ഞയയ്ക്കുകയും
  rationale: ഇവിടെ ἐκβάλλω ബലമായി പുറത്താക്കുക എന്നതല്ല, യാത്രയാക്കി വിടുക എന്ന അർഥത്തിലാണ്; ἑτέρᾳ ὁδῷ എന്ന വ്യത്യസ്ത പാതയും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യാക്കോബ് 2:25-ൽ വിശ്വാസവും പ്രവൃത്തികളും സംബന്ധിച്ച δικαιόωയുടെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘നീതീകരിക്കപ്പെട്ടു’ എന്നു നിലനിർത്തി അർഥം ഒരൊറ്റ ദൈവശാസ്ത്ര വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കുക.
  alternative: ‘നീതിമതിയാണെന്ന് തെളിയിക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘നീതിമതിയായി പ്രഖ്യാപിക്കപ്പെട്ടു.’
  rationale: ഇവിടെ യാക്കോബ് നീതീകരണത്തെയും പ്രവൃത്തികളെയും ചേർത്ത് പറയുന്നതിലെ യഥാർഥ ദൈവശാസ്ത്ര സംഘർഷം പരിഭാഷ പരിഹരിക്കരുത്. ‘നീതീകരിക്കപ്പെട്ടു’ എന്നത് ഗ്രീക്ക് പദബന്ധവും ചുറ്റുപാടിലെ വാദവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ശൈലി. ഗ്രീക്കിലെ ചോദ്യം, അബ്രാഹാമുമായുള്ള താരതമ്യം, പങ്കാളിത്തക്രിയകളുടെ ബന്ധം, δικαιόωയിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില എന്നിവ സംരക്ഷിച്ചു.
