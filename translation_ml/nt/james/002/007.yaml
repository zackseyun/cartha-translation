id: JAS.2.7
reference: James 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ αὐτοὶ βλασφημοῦσιν τὸ καλὸν ὄνομα τὸ ἐπικληθὲν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/007.yaml
  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: ml
  text: നിങ്ങളുടെമേൽ വിളിക്കപ്പെട്ട മാന്യമായ നാമത്തെ ദുഷിക്കുന്നത് അവർ തന്നെയല്ലേ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ശ്രേഷ്ഠമായ നാമത്തെ’ അല്ലെങ്കിൽ ‘ആദരണീയമായ നാമത്തെ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിങ്ങളുടെമീതെ വിളിക്കപ്പെട്ട.’ വിശ്വാസികൾ തിരിച്ചറിയപ്പെടുന്ന നാമത്തെയായിരിക്കാം ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ഉടമ്പടിയുടെയോ സ്നാനത്തിന്റെയോ ഭാഷയുടെ പ്രതിധ്വനിയും ഇതിലുണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: അവർ തന്നെയല്ലേ?
  rationale: οὐκ കൊണ്ടുള്ള ചോദ്യം അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യമാണ്; αὐτοὶ മുൻപ് പരാമർശിച്ച അതേ ആളുകളെ ഊന്നിപ്പറയുന്നു. മലയാളത്തിലെ ‘അവർ തന്നെയല്ലേ?’ ഈ രണ്ടും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: βλασφημοῦσιν
  choice: ദുഷിക്കുന്നത്
  rationale: ക്രിയയ്ക്ക് അപകീർത്തിപ്പെടുത്തുക, നിന്ദിക്കുക, ദൈവികമായതിനെ ദുഷിക്കുക എന്നീ അർത്ഥവ്യാപ്തിയുണ്ട്. ഇവിടെ ആദരണീയമായ നാമമാണ് കർമം; ‘ദുഷിക്കുക’ മതപരമായ ഗൗരവവും വാക്കാൽ അപമാനിക്കുന്ന ആശയവും സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: τὸ καλὸν ὄνομα
  choice: മാന്യമായ നാമം
  rationale: καλός ഇവിടെ നല്ലത് എന്ന പൊതുവായ അർത്ഥത്തോടൊപ്പം ആദരണീയവും ശ്രേഷ്ഠവുമായത് എന്ന ഭാവം വഹിക്കുന്നു. ‘മാന്യമായ നാമം’ ആ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; നാമം ആരുടേതെന്ന് വാക്യത്തിൽ ചേർത്ത് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: τὸ ἐπικληθὲν
  choice: വിളിക്കപ്പെട്ട
  rationale: ἐπικαλέω എന്ന ക്രിയയുടെ നിഷ്ക്രിയ കൃദന്തരൂപം സംരക്ഷിക്കുന്നു. ‘ആഹ്വാനം ചെയ്യപ്പെട്ട’ എന്നത് സന്ദർഭത്തെ അനാവശ്യമായി ആരാധനാപരമായി നിർണ്ണയിക്കാം; ‘വിളിക്കപ്പെട്ട’ കൂടുതൽ തുറന്നതാണ്.
- source_word: ἐφ’ ὑμᾶς
  choice: നിങ്ങളുടെമേൽ
  rationale: ἐπίയും ἐπικαλέωയും ചേർന്നുള്ള ‘മേൽ/മീതെ വിളിക്കപ്പെടുക’ എന്ന പ്രയോഗത്തെ നേരിട്ട് നിലനിർത്തുന്നു. ഇത് വിശ്വാസികളെ ഒരു നാമത്താൽ തിരിച്ചറിയുന്നതോ അവരുടെമേൽ ആ നാമം ഉച്ചരിക്കപ്പെട്ടതോ എന്ന സാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: ‘മാന്യമായ നാമം’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: വിശ്വാസികളുടെമേൽ വിളിക്കപ്പെട്ട ആദരണീയമായ നാമം എന്ന വിശാലവും നിർവചിക്കാത്തതുമായ പരാമർശം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് യേശുവിന്റെ/കർത്താവിന്റെ നാമമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
  alternative: ‘ക്രിസ്തുവിന്റെ നാമം’ എന്ന് പ്രധാന പാഠത്തിൽ വ്യക്തമായി ചേർക്കുക; അല്ലെങ്കിൽ ദൈവത്തിന്റെ നാമമോ സമൂഹത്തിന്റെ ക്രിസ്തീയ തിരിച്ചറിയലോ എന്നു വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് ഈ വാക്യത്തിൽ യേശുവിനെ നേരിട്ട് പേരെടുത്തു പറയുന്നില്ല. യാക്കോബ് 2:1 ക്രിസ്തുവിനെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ‘ക്രിസ്തുവിന്റെ’ എന്ന് ചേർക്കുന്നത് മൂലപാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ തുറന്ന നില പരിഹരിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാചാടോപചോദ്യത്തിന്റെ ഊന്നൽ നിലനിർത്തി. ‘നാമം’ ആരുടേതെന്ന് പ്രധാന പാഠത്തിൽ വ്യക്തമാക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
