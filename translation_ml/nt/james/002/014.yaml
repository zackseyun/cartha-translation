id: JAS.2.14
reference: James 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: ml
  text: എന്റെ സഹോദരന്മാരേ[a], ഒരാൾ തനിക്കു വിശ്വാസമുണ്ടെന്നു പറയുകയും, എന്നാൽ പ്രവൃത്തികളൊന്നും ഇല്ലാതിരിക്കുകയും ചെയ്താൽ, എന്തു പ്രയോജനം? ആ വിശ്വാസത്തിന് അവനെ രക്ഷിക്കാൻ കഴിയുമോ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ സഹോദരീസഹോദരന്മാരേ.” ഗ്രീക്കിൽ പുല്ലിംഗ ബഹുവചനമായ “സഹോദരന്മാർ” എന്ന പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; വിശ്വാസസമൂഹത്തെ മുഴുവനായി അഭിസംബോധന ചെയ്യുന്ന പ്രതിനിധിരൂപമായും ഇത് ഉപയോഗിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അത്തരമൊരു വിശ്വാസത്തിന് അവനെ രക്ഷിക്കാൻ കഴിയുമോ?” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ആ വിശ്വാസം” എന്നാണ്; പ്രവൃത്തികളില്ലാതെ ഒരാൾ തനിക്കുണ്ടെന്നു പറയുന്ന വിശ്വാസത്തിലേക്കാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: അതുകൊണ്ട് എന്തു പ്രയോജനം?
  rationale: പ്രായോഗിക നേട്ടമോ ഗുണമോ എന്തെന്ന ഗ്രീക്ക് വാചകത്തിലെ ആലങ്കാരിക ചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοί μου
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; വിശ്വാസസമൂഹം മുഴുവനും ഉദ്ദേശിക്കപ്പെടാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: ഒരാൾ തനിക്കുണ്ടെന്ന് പറയുന്ന വിശ്വാസത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘ആശ്രയം’, ‘വിശ്വസ്തത’ എന്നിവ പദസാധ്യതകളാണെങ്കിലും ഈ ഘടനയിൽ ‘വിശ്വാസം’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: λέγῃ τις ἔχειν
  choice: ഒരാൾ തനിക്കു ... ഉണ്ടെന്നു പറയുകയും
  rationale: ‘അവകാശപ്പെടുന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കി, ഗ്രീക്കിലെ ‘ഉണ്ടെന്നു പറയുന്നു’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: യാക്കോബ് 2-ലെ തുടർന്നുള്ള വാദവുമായി പദബന്ധം നിലനിർത്തുകയും വിശ്വാസം–പ്രവൃത്തികൾ എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം മങ്ങാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: μὴ ἔχῃ
  choice: ഇല്ലാതിരിക്കുകയും ചെയ്താൽ
  rationale: പ്രവൃത്തികളുടെ അഭാവം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് നിഷേധത്തെ മലയാളത്തിലെ സോപാധിക വാക്യഘടനയിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: μὴ δύναται
  choice: കഴിയുമോ?
  rationale: μή പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക ഉത്തരത്തെ അധികമായി വ്യാഖ്യാനിക്കാതെ ആലങ്കാരിക ചോദ്യമായി നിലനിർത്തുന്നു.
- source_word: ἡ πίστις
  choice: ആ വിശ്വാസം
  rationale: നേരത്തേ പറഞ്ഞ, പ്രവൃത്തികളില്ലാത്തതായി ഒരാൾ പറയുന്ന വിശ്വാസത്തിലേക്കുള്ള നിർദേശകബന്ധം ഗ്രീക്ക് നിർദേശക ഉപപദത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: σῶσαι αὐτόν
  choice: അവനെ രക്ഷിക്കാൻ
  rationale: σῴζω എന്ന പദത്തിന്റെ സാധാരണവും ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നതുമായ മലയാള പരിഭാഷയാണ് ‘രക്ഷിക്കുക’; αὐτόν എന്ന ഏകവചന പുല്ലിംഗ സർവനാമവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശ്വാസവും പ്രവൃത്തികളും തമ്മിലുള്ള ബന്ധം
  choice: പ്രവൃത്തികളില്ലാതെ ഒരാൾ തനിക്കുണ്ടെന്നു പറയുന്ന പ്രത്യേക വിശ്വാസത്തെയാണ് ‘ആ വിശ്വാസം’ എന്നു പരാമർശിക്കുക.
  alternative: ‘വിശ്വാസത്തിന് അവനെ രക്ഷിക്കാൻ കഴിയുമോ?’ എന്ന് പൊതുവായി പറയുക; അല്ലെങ്കിൽ ‘അത്തരമൊരു വിശ്വാസത്തിന്’ എന്ന് കൂടുതൽ വ്യാഖ്യാനാത്മകമായി നൽകുക.
  rationale: ἡ πίστις മുമ്പു പറഞ്ഞ വിശ്വാസത്തിലേക്കു തിരിഞ്ഞുനോക്കുന്നു. ‘ആ വിശ്വാസം’ ഈ ബന്ധം സൂക്ഷിക്കുകയും വിശ്വാസം പൊതുവിൽ രക്ഷിക്കുമോ എന്ന ചോദ്യമായി മാറ്റാതെയും വിശ്വാസ–പ്രവൃത്തി ബന്ധം doctrinalമായി മുൻകൂട്ടി തീർപ്പാക്കാതെയും ഇരിക്കുന്നു.
- issue: സംബോധനയിലെയും സർവനാമത്തിലെയും ലിംഗപ്രതിനിധാനം
  choice: പ്രധാനപാഠത്തിൽ ‘എന്റെ സഹോദരന്മാരേ’, ‘അവനെ’ എന്നീ പുല്ലിംഗ രൂപങ്ങൾ നിലനിർത്തുക; സംബോധനയുടെ വിശാലമായ സമൂഹപരമായ പ്രയോഗം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുക.
  alternative: ‘എന്റെ സഹോദരീസഹോദരന്മാരേ’, ‘ആ വ്യക്തിയെ’ എന്നീ ഉൾക്കൊള്ളുന്ന രൂപങ്ങൾ ഉപയോഗിക്കുക.
  rationale: മൂലപാഠത്തിലെ വ്യാകരണരൂപം നിലനിർത്തുമ്പോഴും ἀδελφοί മിശ്ര വിശ്വാസസമൂഹത്തോടുള്ള പ്രതിനിധി സംബോധനയായിരിക്കാമെന്നത് വായനക്കാരനിൽനിന്ന് മറച്ചുവെക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രവൃത്തികൾ’, ‘വിശ്വാസം’, ‘രക്ഷിക്കുക’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയിട്ടും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി. സോപാധിക വാക്യത്തിനു പിന്നാലെ വരുന്ന രണ്ട് ആലങ്കാരിക ചോദ്യങ്ങളുടെ സമ്മർദം സംരക്ഷിച്ചിട്ടുണ്ട്.
