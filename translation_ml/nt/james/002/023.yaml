id: JAS.2.23
reference: James 2:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: ml
  text: അങ്ങനെ, “അബ്രാഹാം ദൈവത്തെ വിശ്വസിച്ചു; അത് അവന് നീതിയായി കണക്കാക്കപ്പെട്ടു[a]” എന്നു പറയുന്ന തിരുവെഴുത്ത് നിറവേറി; അവൻ ദൈവത്തിന്റെ സുഹൃത്ത് എന്നു വിളിക്കപ്പെടുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കണക്കിൽ ചേർത്തു” അല്ലെങ്കിൽ “കണക്കിട്ടു.”
    reason: ἐλογίσθη എന്ന ക്രിയയുടെ കണക്കാക്കൽ/വകയിരുത്തൽ എന്ന അർഥസൂക്ഷ്മതയ്ക്കുള്ള സാധുവായ മലയാള ബദലുകൾ.
lexical_decisions:
- source_word: ἐπληρώθη
  choice: നിറവേറി
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന സന്ദർഭത്തിലെ πληρόω-യുടെ നിഷ്ക്രിയരൂപത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മുൻവാക്യത്തിൽ വിവരിച്ച അബ്രാഹാമിന്റെ പ്രവൃത്തിയിൽ ഈ വചനം പൂർണാവിഷ്കാരം പ്രാപിച്ചതെന്ന യാക്കോബിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: ἡ γραφὴ ἡ λέγουσα
  choice: എന്നു പറയുന്ന തിരുവെഴുത്ത്
  rationale: γραφή എന്നത് വിശുദ്ധ തിരുവെഴുത്തിനെയാണ് സൂചിപ്പിക്കുന്നത്; λέγουσα എന്ന വർത്തമാന കൃദന്തം മലയാളത്തിലെ ഉദ്ധരണിശൈലിക്ക് യോജിച്ച വിധത്തിൽ ‘എന്നു പറയുന്ന’ എന്നു നൽകി.
- source_word: Ἐπίστευσεν ... τῷ θεῷ
  choice: അബ്രാഹാം ദൈവത്തെ വിശ്വസിച്ചു
  rationale: πιστεύω ദത്തിവിനോടുകൂടി ഇവിടെ ദൈവം പറഞ്ഞത് സത്യമെന്ന് അംഗീകരിച്ച ആശയം നൽകുന്നു. ‘ദൈവത്തിൽ വിശ്വസിച്ചു’ എന്നതിനെക്കാൾ ‘ദൈവത്തെ വിശ്വസിച്ചു’ എന്നത് ഉറവിടഘടനയോടും ഉല്പത്തി ഉദ്ധരണിയോടും അടുത്തതാണ്.
- source_word: ἐλογίσθη αὐτῷ
  choice: അത് അവന് ... കണക്കാക്കപ്പെട്ടു
  rationale: λογίζομαι എന്ന നിഷ്ക്രിയക്രിയയിലെ കണക്കിടൽ/വകയിരുത്തൽ ഭാവം ‘കണക്കാക്കപ്പെട്ടു’ വ്യക്തമായി സംരക്ഷിക്കുന്നു; ‘അത്’ അബ്രാഹാമിന്റെ വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നതായി ഗ്രീക്കിലെ വ്യാകരണപരമായ പരോക്ഷത നിലനിർത്തുന്നു.
- source_word: εἰς δικαιοσύνην
  choice: നീതിയായി
  rationale: ഉല്പത്തി 15:6-ലെ പ്രസിദ്ധമായ ഉദ്ധരണിസന്ദർഭത്തിലും നീതീകരണവുമായി ബന്ധപ്പെട്ട വാദത്തിലും δικαιοσύνη എന്നതിന്റെ യോജിച്ച മലയാളരൂപം; ‘ന്യായം’ ഇവിടെ അനുയോജ്യമല്ല.
- source_word: φίλος θεοῦ
  choice: ദൈവത്തിന്റെ സുഹൃത്ത്
  rationale: ബന്ധസൂചകമായ ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിയുടെ സ്വാഭാവികവും അമിതവ്യാഖ്യാനമില്ലാത്തതുമായ മലയാളരൂപം.
- source_word: ἐκλήθη
  choice: വിളിക്കപ്പെടുകയും ചെയ്തു
  rationale: καλέω-യുടെ നിഷ്ക്രിയരൂപം നേരിട്ട് നൽകുന്നു; തിരുവെഴുത്തിലോ പാരമ്പര്യത്തിലോ ലഭിച്ച വിശേഷണമാണോ അംഗീകരിക്കപ്പെട്ട നിലയാണോ എന്നത് നിർബന്ധിച്ച് തീരുമാനിക്കുന്നില്ല.
theological_decisions:
- issue: യാക്കോബിന്റെ വാദത്തിൽ അബ്രാഹാമിന്റെ വിശ്വാസവും പ്രവൃത്തിയും തമ്മിലുള്ള ബന്ധം
  choice: മുൻസന്ദർഭത്തിലെ അനുസരണപ്രവൃത്തിയിൽ തിരുവെഴുത്ത് ‘നിറവേറി’ എന്ന അവകാശവാദം നിലനിർത്തി; വിശ്വാസത്തെയും പ്രവൃത്തിയെയും വേർപെടുത്തുകയോ ഒന്നിനെ മറ്റൊന്നിന് പകരമാക്കുകയോ ചെയ്തില്ല.
  alternative: പ്രവൃത്തികളിൽനിന്ന് വേർപെട്ട ശക്തമായ നിയമപരമായ വായന; അല്ലെങ്കിൽ നീതിയുടെ അടിസ്ഥാനമായി പ്രവൃത്തി വിശ്വാസത്തെ മാറ്റിസ്ഥാപിക്കുന്ന വായന.
  rationale: വാക്യം ഉല്പത്തി 15:6-നെ അബ്രാഹാമിന്റെ പിന്നീട് പ്രകടമായ അനുസരണയുമായി ബന്ധിപ്പിക്കുന്നു. വിവർത്തനം ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കണം.
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നീതി
  alternative: ന്യായം
  rationale: അബ്രാഹാമിന്റെ വിശ്വാസം കണക്കാക്കപ്പെടുന്ന ഉല്പത്തി ഉദ്ധരണിയിലും നീതീകരണസന്ദർഭത്തിലും ‘നീതി’ തന്നെയാണ് അർഥസൂക്ഷ്മതയ്ക്കും മലയാള ബൈബിൾ പ്രയോഗത്തിനും യോജിച്ചത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം തിരുവെഴുത്തിന് യോജിച്ച മാന്യവുമായ മലയാളം. വാക്യത്തിന്റെ ഗ്രീക്ക് ഏകവാക്യഘടനയും മൂന്നു καί ഘടകങ്ങളുടെ പ്രവാഹവും മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിച്ചു. ഇവിടെ അർഥവ്യത്യാസം നിർബന്ധമായി വിശദീകരിക്കേണ്ട അടിക്കുറിപ്പ് ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല; നൽകിയ ഇംഗ്ലീഷ് [a] യഥാർഥത്തിൽ ‘says’ എന്നിടത്ത് തെറ്റായി പതിഞ്ഞതായി തോന്നുകയും അതിന്റെ ഉള്ളടക്കം ἐλογίσθη-നോടു ബന്ധപ്പെടുകയും ചെയ്യുന്നു.
