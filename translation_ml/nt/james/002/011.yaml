id: JAS.2.11
reference: James 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: ml
  text: എന്തെന്നാൽ, “വ്യഭിചാരം ചെയ്യരുത്” എന്നു പറഞ്ഞവൻതന്നെ “കൊല ചെയ്യരുത്” എന്നും പറഞ്ഞു. എന്നാൽ, നീ വ്യഭിചാരം ചെയ്യുന്നില്ലെങ്കിലും കൊല ചെയ്യുന്നുവെങ്കിൽ, നീ ന്യായപ്രമാണത്തിന്റെ ലംഘകനായിത്തീർന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: പറഞ്ഞവൻതന്നെ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന articular participle-ന്റെ വ്യക്തിപരമായ പരാമർശം നിലനിർത്തുന്നു; കല്പനകൾ നൽകിയവൻ ദൈവമാണെന്ന് വ്യാഖ്യാനിച്ച് മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല. മലയാളത്തിലെ ‘തന്നെ’ ഒരേ പ്രഭാഷകനാണ് രണ്ടു കല്പനകളും പറഞ്ഞതെന്ന ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Μὴ μοιχεύσῃς
  choice: വ്യഭിചാരം ചെയ്യരുത്
  rationale: μή സഹിതമുള്ള നിരോധനത്തിന്റെ കല്പനാസ്വഭാവം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: καί
  choice: എന്നും
  rationale: അതേ വ്യക്തി രണ്ടാമത്തെ കല്പനയും പറഞ്ഞുവെന്ന ബന്ധം ഉദ്ധരണിക്കുശേഷമുള്ള ‘എന്നും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Μὴ φονεύσῃς
  choice: കൊല ചെയ്യരുത്
  rationale: φονεύω അന്യായമായ മനുഷ്യവധത്തെ സൂചിപ്പിക്കുന്നു; ‘കൊല ചെയ്യുക’ എന്നത് എല്ലാ തരത്തിലുള്ള കൊല്ലലിനെയും പൊതുവാക്കാതെ murder എന്ന നൈതിക അർഥം നൽകുന്നു.
- source_word: εἰ δὲ
  choice: അതുകൊണ്ട്, ... ചെയ്യുന്നുവെങ്കിൽ
  rationale: δέ നയിക്കുന്ന വിരുദ്ധസാഹചര്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മുൻവാക്യത്തിൽനിന്നുള്ള വാദപരമായ പ്രയോഗം ‘അതുകൊണ്ട്’ വ്യക്തമാക്കുന്നു.
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: നീ വ്യഭിചാരം ചെയ്യുന്നില്ലെങ്കിലും കൊല ചെയ്യുന്നുവെങ്കിൽ
  rationale: വർത്തമാനകാലരൂപങ്ങളെ പൊതുവായ സോപാധിക ഉദാഹരണമായി നിലനിർത്തുകയും δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം ‘എങ്കിലും’ വഴി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: γέγονας
  choice: ആയിത്തീർന്നിരിക്കുന്നു
  rationale: γίνομαι-യുടെ perfect രൂപത്തിലെ സംഭവിച്ച മാറ്റവും അതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥയും ഒരുമിച്ച് പകരുന്നു.
- source_word: παραβάτης νόμου
  choice: ന്യായപ്രമാണത്തിന്റെ ലംഘകൻ
  rationale: നിയമത്തിന്റെ അതിർത്തി ലംഘിക്കുന്നവൻ എന്ന നിയമ-നൈതിക ഭാവം നിലനിർത്തുന്നു; ഒരു പ്രത്യേക കല്പനയുടെ മാത്രം ലംഘകനായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: νόμου
  choice: ന്യായപ്രമാണത്തിന്റെ
  rationale: ഇപ്പോൾ ഉദ്ധരിച്ചിരിക്കുന്ന ദൈവിക നിയമസംഹിതയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ മാന്യവും തിരിച്ചറിയാവുന്നതുമായ പദമാണ്.
theological_decisions:
- issue: കല്പനകൾ പറഞ്ഞവന്റെ വ്യക്തിത്വം
  choice: ‘പറഞ്ഞവൻതന്നെ’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘ദൈവം’ എന്നു മുഖ്യപാഠത്തിൽ വിശദീകരിച്ചില്ല.
  alternative: ‘ദൈവം ... പറഞ്ഞു’
  rationale: സന്ദർഭത്തിൽ പ്രഭാഷകൻ ദൈവമാണെങ്കിലും ഗ്രീക്ക് പാഠം പേര് വ്യക്തമാക്കാതെ ‘പറഞ്ഞവൻ’ എന്നാണ് പറയുന്നത്. അതിനാൽ മൂലപാഠത്തിന്റെ സൂചന നിലനിർത്തി വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കി.
- issue: നിയമലംഘനത്തിന്റെ വ്യാപ്തി
  choice: ‘ന്യായപ്രമാണത്തിന്റെ ലംഘകൻ’ എന്നു നിലനിർത്തി.
  alternative: ‘ആ കല്പനയുടെ ലംഘകൻ’
  rationale: ഒരു കല്പന ലംഘിക്കുന്നവൻ നിയമത്തെ ഏകീകൃത സമഗ്രതയായി ലംഘിക്കുന്നു എന്ന യാക്കോബിന്റെ വാദം നിലനിർത്തുന്നു; പാഠത്തിൽ ഇല്ലാത്ത വിധം വ്യാപ്തി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കല്പനകളിൽ നേരിട്ടുള്ളതും സംക്ഷിപ്തവുമായ ശൈലി; നിയമ-നൈതിക ആശയത്തിന് ‘ന്യായപ്രമാണം’, ‘ലംഘകൻ’ എന്നീ സ്ഥാപിത പദങ്ങൾ ഉപയോഗിച്ചു. ആവശ്യമില്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
