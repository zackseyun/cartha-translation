id: JAS.2.5
reference: James 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: ml
  text: 'എന്റെ പ്രിയ സഹോദരന്മാരേ,[a] കേൾക്കൂ: ലോകത്തിന്റെ കാഴ്ചയിൽ ദരിദ്രരായവരെ[b] വിശ്വാസത്തിൽ[c] സമ്പന്നരും തന്നെ സ്നേഹിക്കുന്നവർക്കു ദൈവം വാഗ്ദാനം ചെയ്ത രാജ്യത്തിന്റെ അവകാശികളുമാകാൻ ദൈവം തിരഞ്ഞെടുത്തില്ലയോ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “എന്റെ പ്രിയ സഹോദരന്മാരും സഹോദരിമാരും”; ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്, എന്നാൽ വിശ്വാസിസമൂഹം മുഴുവനെയും ഉൾപ്പെടുത്തി അഭിസംബോധന ചെയ്തതാകാം.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ “ലൗകിക മാനദണ്ഡമനുസരിച്ച് ദരിദ്രരായവരെ.”
    reason: lexical_alternative
  - marker: c
    text: “വിശ്വാസം” എന്നത് “ആശ്രയം” എന്നും, ഇവിടെ സാധ്യത കുറവാണെങ്കിലും “വിശ്വസ്തത” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: കേൾക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ബഹുവചന ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: എന്റെ പ്രിയ സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും ἀγαπητοί എന്നതിന്റെ സ്നേഹപൂർവമായ അഭിസംബോധന ‘പ്രിയ’ എന്നു നൽകുകയും ചെയ്യുന്നു; സഭാസമൂഹം മുഴുവനും ഉൾപ്പെടാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὐχ ... ἐξελέξατο
  choice: തിരഞ്ഞെടുത്തില്ലയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് വാചാടോപചോദ്യത്തിന്റെ സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: ലോകത്തിന്റെ കാഴ്ചയിൽ ദരിദ്രരായവരെ
  rationale: τῷ κόσμῳ എന്ന ദത്തിവ് ലോകത്തിന്റെ മാനദണ്ഡമോ വിലയിരുത്തലോ സംബന്ധിച്ച ദാരിദ്ര്യത്തെ സൂചിപ്പിക്കുന്നു. വെറും ‘ലോകത്തിൽ ദരിദ്രർ’ എന്നതിനെക്കാൾ ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: πλουσίους ἐν πίστει
  choice: വിശ്വാസത്തിൽ സമ്പന്നർ
  rationale: πίστις എന്നതിന് ഈ സാഹചര്യത്തിലെ സ്വാഭാവിക അർഥമായ ‘വിശ്വാസം’ സ്വീകരിച്ച് ഭൗതിക ദാരിദ്ര്യവും ആത്മീയ സമ്പത്തും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: κληρονόμους τῆς βασιλείας
  choice: രാജ്യത്തിന്റെ അവകാശികൾ
  rationale: κληρονόμος എന്ന നിയമപരവും കുടുംബബന്ധപരവുമായ ആശയം മലയാളത്തിലെ സ്ഥാപിതവും വ്യക്തവുമായ ‘അവകാശി’ എന്ന പദം കൃത്യമായി നൽകുന്നു.
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: തന്നെ സ്നേഹിക്കുന്നവർക്കു ദൈവം വാഗ്ദാനം ചെയ്ത
  rationale: ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിലാക്കി, വാഗ്ദാനത്തിന്റെ സ്വീകർത്താക്കളെ ദൈവത്തെ സ്നേഹിക്കുന്നവർ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ തിരഞ്ഞെടുപ്പിനെ സാങ്കേതിക സിദ്ധാന്തമായി അതിവ്യാഖ്യാനിക്കാനുള്ള സാധ്യത
  choice: ἐξελέξατο എന്നത് ലളിതമായി ‘തിരഞ്ഞെടുത്തു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: മുൻനിർണ്ണയവുമായി ബന്ധപ്പെട്ട ഒരു പ്രത്യേക സിദ്ധാന്തം വ്യക്തമാക്കുന്ന വ്യാഖ്യാനപദങ്ങൾ ചേർക്കുക.
  rationale: സന്ദർഭം ദരിദ്രരോടുള്ള ദൈവത്തിന്റെ വിലമതിപ്പിനെയും പക്ഷപാതത്തിന്റെ പൊരുത്തക്കേടിനെയും കുറിച്ചാണ്; പിന്നീടുള്ള സിദ്ധാന്തവിവാദം പരിഭാഷയിൽ തീർപ്പാക്കരുത്.
- issue: ἀδελφοί എന്ന അഭിസംബോധനയുടെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരേ’ നിലനിർത്തി ഉൾക്കൊള്ളുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
  alternative: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരും സഹോദരിമാരും’ എന്നു നൽകുക.
  rationale: ഗ്രീക്ക് രൂപം പുരുഷലിംഗ ബഹുവചനമാണെങ്കിലും ലേഖനത്തിലെ അഭിസംബോധന വിശ്വാസിസമൂഹം മുഴുവനെയും ഉൾക്കൊള്ളാൻ സാധ്യതയുണ്ട്; ഇരു വശങ്ങളും സംരക്ഷിക്കുന്നു.
- issue: πίστις എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘വിശ്വാസം’ ഉപയോഗിച്ചു.
  alternative: ‘ആശ്രയം’ അല്ലെങ്കിൽ, ഇവിടെ സാധ്യത കുറവായ, ‘വിശ്വസ്തത’.
  rationale: ‘വിശ്വാസത്തിൽ സമ്പന്നർ’ എന്ന പ്രയോഗത്തിൽ ദൈവത്തിലുള്ള വിശ്വാസമാണ് ഏറ്റവും സ്വാഭാവികം; സാധ്യമായ പദാർഥഭേദങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാചാടോപചോദ്യത്തിന്റെ ശക്തിയും ദാരിദ്ര്യം–വിശ്വാസസമ്പത്ത് എന്ന വൈരുധ്യവും സംരക്ഷിച്ചിരിക്കുന്നു; വിഭാഗീയ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
