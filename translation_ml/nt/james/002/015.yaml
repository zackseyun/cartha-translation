  to: ഒരു സഹോദരനോ സഹോദരിയോ വേണ്ടത്ര വസ്ത്രമില്ലാതെയും അന്നന്നത്തെ ആഹാരം ഇല്ലാതെയും ഇരിക്കുന്നുവെങ്കിൽ,
