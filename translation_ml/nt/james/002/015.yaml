id: JAS.2.15
reference: James 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ ⸀λειπόμενοι τῆς ἐφημέρου τροφῆς,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: ml
  text: ഒരു സഹോദരനോ സഹോദരിയോ വേണ്ടത്ര വസ്ത്രമില്ലാതെയും അന്നന്നത്തെ ആഹാരം ഇല്ലാതെയും ഇരിക്കുന്നുവെങ്കിൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: ഇരിക്കുന്നെങ്കിൽ
  rationale: സാങ്കൽപ്പികമായ നിബന്ധന അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധനാരൂപത്തിൽ നൽകുന്നു.
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: ഒരു സഹോദരനോ സഹോദരിയോ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പുല്ലിംഗ-സ്ത്രീലിംഗ ജോടി നിലനിർത്തുകയും വിശ്വാസസമൂഹത്തിലെ കുടുംബബന്ധഭാഷ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: γυμνοὶ
  choice: വേണ്ടത്ര വസ്ത്രമില്ലാതെയും
  rationale: പൂർണ നഗ്നത എന്നും അർഥമാകാവുന്ന പദം ഈ ദാരിദ്ര്യസന്ദർഭത്തിൽ ആവശ്യത്തിന് വസ്ത്രമില്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കാനാണ് സാധ്യത; അടിക്കുറിപ്പിൽ അക്ഷരാർഥവും നിലനിർത്തുന്നു.
- source_word: ὑπάρχωσιν
  choice: ഇരിക്കുന്നെങ്കിൽ
  rationale: ഇവിടെ പദം അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ബന്ധകക്രിയയായി പ്രവർത്തിക്കുന്നു; നിബന്ധനയോടു ചേർന്ന ഈ മലയാളരൂപം സ്വാഭാവികമാണ്.
- source_word: λειπόμενοι
  choice: ലഭിക്കാതെയും
  rationale: തുടരുന്ന അഭാവാവസ്ഥയെ ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: അന്നന്നത്തെ ആഹാരം
  rationale: ἐφήμερος എന്നതിലെ ഓരോ ദിവസത്തേക്കുമുള്ള അടിസ്ഥാന ഉപജീവനത്തിന്റെ ഭാവം ‘അന്നന്നത്തെ’ എന്ന പ്രയോഗം വ്യക്തമായി നൽകുന്നു; τροφήയെ ‘ആഹാരം’ എന്ന് മാന്യവും സാധാരണവുമായ ഭാഷയിൽ പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ക്രൈസ്തവസമൂഹത്തിനുള്ളിലെ ἀδελφὸς ἢ ἀδελφή എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: ‘സഹോദരനോ സഹോദരിയോ’ എന്ന കുടുംബബന്ധഭാഷ അതേപടി നിലനിർത്തി.
  alternative: പൊതുവായി ആവശ്യത്തിലിരിക്കുന്ന ഏതൊരു മനുഷ്യനെയും സൂചിപ്പിക്കുന്ന പദപ്രയോഗം
  rationale: സന്ദർഭത്തിൽ ഇത് സഹവിശ്വാസികളെ സൂചിപ്പിക്കാനാണ് സാധ്യത; എങ്കിലും വിവർത്തനം അതിനപ്പുറം വിശദീകരണം ചേർക്കാതെ മൂലപാഠത്തിന്റെ ഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്ന നിബന്ധനാഭാഗമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തിയിരിക്കുന്നു.
