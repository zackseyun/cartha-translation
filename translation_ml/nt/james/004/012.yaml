id: JAS.4.12
reference: James 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: ml
  text: നിയമദാതാവും ന്യായാധിപനും ഒരുവൻ മാത്രമേയുള്ളൂ; രക്ഷിക്കാനും നശിപ്പിക്കാനും കഴിവുള്ളവൻ അവൻ തന്നേ. എന്നാൽ, അയൽക്കാരനെ വിധിക്കുന്ന നീ ആർ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: നിയമദാതാവ്
  rationale: നിയമം നൽകുന്നവൻ എന്ന ഗ്രീക്ക് പദത്തിന്റെ അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: κριτής / κρίνων
  choice: ന്യായാധിപൻ / വിധിക്കുന്ന
  rationale: ആദ്യത്തേത് ഔദ്യോഗിക ന്യായാധിപനെ സൂചിപ്പിക്കുന്ന നാമമായും രണ്ടാമത്തേത് വായനക്കാരൻ ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ക്രിയയായും വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: σῶσαι καὶ ἀπολέσαι
  choice: രക്ഷിക്കാനും നശിപ്പിക്കാനും
  rationale: രക്ഷയും നാശവും തമ്മിലുള്ള ശക്തമായ വിരുദ്ധത മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: πλησίον
  choice: അയൽക്കാരൻ
  rationale: സമീപസ്ഥനായ സഹമനുഷ്യൻ എന്ന ബൈബിൾപ്രയോഗം സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: നിയമദാതാവും ന്യായാധിപനും ഒരുവനാണ് എന്ന പ്രസ്താവനയുടെ തിരിച്ചറിയൽ
  choice: വാചകത്തിലുള്ള പരോക്ഷത നിലനിർത്തി; ദൈവം എന്ന പദം കൂട്ടിച്ചേർത്തില്ല.
  alternative: “ദൈവം മാത്രമാണ് നിയമദാതാവും ന്യായാധിപനും” എന്ന് വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം ദൈവത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് വാക്യം ഇവിടെ അവന്റെ പേര് നേരിട്ട് പറയുന്നില്ല.
- issue: ἀπολέσαι എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: “നശിപ്പിക്കുക”
  alternative: “ശിക്ഷിക്കുക” അല്ലെങ്കിൽ “നരകത്തിലാക്കുക”
  rationale: മൂലപദത്തിന്റെ ശക്തിയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; നിർദ്ദിഷ്ട ശിക്ഷാസിദ്ധാന്തം വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അവസാന ചോദ്യം ഗ്രീക്കിലെ ഊന്നൽ നിലനിർത്താൻ “നീ ആർ?” എന്ന നേരിട്ടുള്ള രൂപത്തിൽ നൽകി.
