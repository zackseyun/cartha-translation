id: JAS.4.7
reference: James 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: ml
  text: അതുകൊണ്ട്, ദൈവത്തിനു കീഴടങ്ങുവിൻ[a]. എന്നാൽ പിശാചിനെ ചെറുത്തുനിൽക്കുവിൻ; അപ്പോൾ അവൻ നിങ്ങളെ വിട്ട് ഓടിപ്പോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിനു വിധേയരാകുവിൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: കീഴടങ്ങുവിൻ
  rationale: ദൈവത്തിന്റെ അധികാരത്തിനു സ്വമേധയാ വിധേയരാകാനുള്ള ആഹ്വാനം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു. ഗ്രീക്കിലെ രൂപം സന്ദർഭത്തിൽ ആത്മവാചക അർഥം വഹിക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിനു
  rationale: ὑποτάγητε എന്ന ക്രിയയുടെ ദാതൃവിഭക്തിയിലുള്ള പൂരകത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἀντίστητε
  choice: ചെറുത്തുനിൽക്കുവിൻ
  rationale: എതിർത്ത് ഉറച്ചുനിൽക്കുക എന്ന ക്രിയയുടെ ശക്തിയും നൈതിക ആഹ്വാനവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ദൈവത്തിനു കീഴടങ്ങുന്നതും പിശാചിനെ എതിർക്കുന്നതും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: τῷ διαβόλῳ
  choice: പിശാചിനെ
  rationale: ഇവിടെ διάβολος വ്യക്തിപരമായ ദുഷ്ട എതിരാളിയുടെ സ്ഥാനപ്പേരായി വരുന്നു; മലയാളത്തിലെ സ്ഥിരപ്രയോഗം ഇതാണ്.
- source_word: καὶ
  choice: അപ്പോൾ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള വാഗ്ദത്തഫലം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ബന്ധകത്തിന്റെ ഫലസൂചന സന്ദർഭാനുസൃതമായി പ്രകടമാക്കുന്നു.
- source_word: φεύξεται
  choice: അവൻ ... ഓടിപ്പോകും
  rationale: ഭാവികാലത്തിലുള്ള ഉറപ്പുള്ള ഫലം നിലനിർത്തുന്നു; മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമായി ചേർക്കുന്നു.
- source_word: ἀφ’ ὑμῶν
  choice: നിങ്ങളെ വിട്ട്
  rationale: അകന്നുപോകുന്ന ദിശയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: διάβολος എന്ന പദത്തിന്റെ അർഥം
  choice: വ്യക്തിപരമായ അതീന്ദ്രിയ എതിരാളിയായ പിശാച്
  alternative: അപവാദി, അല്ലെങ്കിൽ വ്യക്തിത്വമില്ലാത്ത ദുഷ്ടശക്തി
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പ്രയോഗവും ആത്മീയ സംഘർഷത്തിന്റെ സന്ദർഭവും വ്യക്തിപരമായ എതിരാളിയെയാണ് സൂചിപ്പിക്കുന്നത്; അമൂർത്തമായ തിന്മയായി മാത്രം വിവർത്തനം ചെയ്യുന്നത് മൂലപാഠത്തിന്റെ അർഥം ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ബഹുവചന ആജ്ഞകൾക്ക് “-വിൻ” രൂപം ഉപയോഗിച്ചു; വാക്യത്തിന്റെ ഉപദേശാത്മക താളവും മൂലപാഠത്തിലെ നിഗമനം–വൈരുധ്യം–ഫലം എന്ന ക്രമവും സംരക്ഷിച്ചു.
