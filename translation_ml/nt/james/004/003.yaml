id: JAS.4.3
reference: James 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: ml
  text: നിങ്ങൾ ചോദിക്കുന്നു, എങ്കിലും ലഭിക്കുന്നില്ല; കാരണം, നിങ്ങളുടെ സുഖഭോഗങ്ങൾക്കായി[b] ചെലവഴിക്കാൻ നിങ്ങൾ തെറ്റായി[a] ചോദിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തെറ്റായ ഉദ്ദേശ്യത്തോടെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘സുഖഭോഗങ്ങൾ’ എന്നതിന് സ്വയംതൃപ്തിപ്പെടുത്തുന്ന മോഹങ്ങൾ അഥവാ വികാരാസക്തികൾ എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: നിങ്ങൾ ചോദിക്കുന്നു
  rationale: വർത്തമാനകാല ബഹുവചന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ. ദൈവത്തോടുള്ള അപേക്ഷയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കപ്പെടുന്നതെങ്കിലും, മൂലപാഠത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: οὐ λαμβάνετε
  choice: ലഭിക്കുന്നില്ല
  rationale: ചോദിക്കുന്നതും ലഭിക്കുന്നതും തമ്മിലുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διότι
  choice: കാരണം
  rationale: ലഭിക്കാത്തതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന വ്യക്തമായ കാരണസൂചകമാണ്.
- source_word: κακῶς
  choice: തെറ്റായ വിധത്തിൽ
  rationale: ‘മോശമായി/തെറ്റായി’ എന്ന വിശാലമായ ധാർമിക-ഗുണപര അർഥം നിലനിർത്തുന്നു; ‘തെറ്റായ ഉദ്ദേശ്യത്തോടെ’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: αἰτεῖσθε
  choice: നിങ്ങൾ ... ചോദിക്കുന്നു
  rationale: മധ്യമപ്രയോഗത്തെ അനാവശ്യമായി പ്രതിഫലനരൂപത്തിൽ വികസിപ്പിക്കാതെ ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: ചെലവഴിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യസൂചന നിലനിർത്തുന്ന മലയാള പ്രയോഗം.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: നിങ്ങളുടെ സുഖഭോഗങ്ങൾക്കായി
  rationale: ἡδονήയുടെ സുഖം, ആസ്വാദനം, സ്വയംതൃപ്തിപ്പെടുത്തുന്ന മോഹം എന്നീ അർഥവ്യാപ്തിയും ചെലവിടലുമായുള്ള ബന്ധവും സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: δαπανήσητε
  choice: ചെലവഴിക്കേണ്ടതിന്
  rationale: ക്രിയയുടെ നിഷ്പക്ഷമായ ‘ചെലവാക്കുക’ എന്ന അർഥം നൽകുന്നു; ‘ധൂർത്തടിക്കുക’ എന്ന കൂടുതൽ ശക്തമായ വിലയിരുത്തൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ചോദിക്കുന്നത് ദൈവത്തോടുള്ള പ്രാർഥനയാണെന്ന് വ്യക്തമാക്കണമോ
  choice: കർമം വ്യക്തമാക്കാതെ ‘നിങ്ങൾ ചോദിക്കുന്നു’ എന്നു നിലനിർത്തി.
  alternative: ‘നിങ്ങൾ ദൈവത്തോടു ചോദിക്കുന്നു’
  rationale: സന്ദർഭം ദൈവത്തോടുള്ള അപേക്ഷയെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠത്തിൽ ‘ദൈവം’ എന്നു വ്യക്തമാക്കിയിട്ടില്ല.
- issue: κακῶς എന്നത് ഉദ്ദേശ്യത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി വികസിപ്പിക്കണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘തെറ്റായ വിധത്തിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തെറ്റായ ഉദ്ദേശ്യത്തോടെ’
  rationale: κακῶς എന്ന ക്രിയാവിശേഷണം ഉദ്ദേശ്യം മാത്രത്തേക്കാൾ വിശാലമാണ്; തുടർന്നുള്ള ഉദ്ദേശ്യവാക്യം ചോദിക്കുന്നതിലെ തെറ്റ് വിശദീകരിക്കുന്നു.
- issue: ἵναയെ ഉദ്ദേശ്യമോ ഫലമോ ആയി അവതരിപ്പിക്കണമോ
  choice: ഉദ്ദേശ്യബലം മുൻനിർത്തി ‘ചെലവഴിക്കേണ്ടതിന്’ എന്നു നൽകി.
  alternative: ‘അങ്ങനെ ... ചെലവഴിക്കുന്നു’
  rationale: സബ്ജങ്ക്ടീവോടുകൂടിയ ἵνα ഇവിടെ ചോദിക്കുന്നതിന്റെ തെറ്റായ ലക്ഷ്യത്തെ വ്യക്തമാക്കുന്നു; എന്നിരുന്നാലും ഉദ്ദേശ്യം-ഫലം തമ്മിലുള്ള സ്വാഭാവിക ബന്ധം പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ചോദിക്കുക–ലഭിക്കുക എന്ന സമാന്തരതയും കാരണ-ഉദ്ദേശ്യ ഘടനയും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ആശയങ്ങളുടെ അവസാനം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
