- from: നിങ്ങൾ ചോദിക്കുന്നു, എന്നാൽ ലഭിക്കുന്നില്ല; കാരണം, നിങ്ങളുടെ സുഖഭോഗങ്ങൾക്കായി ചെലവഴിക്കേണ്ടതിന് നിങ്ങൾ തെറ്റായ വിധത്തിൽ ചോദിക്കുന്നു.[a]
