id: JAS.4.15
reference: James 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: ml
  text: 'പകരം[a], നിങ്ങൾ ഇങ്ങനെ പറയേണ്ടതാണ്: “കർത്താവ് ഇച്ഛിച്ചാൽ, നാം ജീവിക്കുകയും ഇതോ അതോ ചെയ്യുകയും ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിങ്ങൾ പറയുന്നതിനുപകരം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: പകരം നിങ്ങൾ ഇങ്ങനെ പറയേണ്ടതാണ്
  rationale: ἀντὶ τοῦ + infinitive എന്ന ഘടന അക്ഷരാർഥത്തിൽ ‘നിങ്ങൾ പറയുന്നതിനുപകരം’ എന്നാണ്. മുൻവാക്യത്തിലെ മനോഭാവത്തോടുള്ള തിരുത്തൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘പകരം ... പറയേണ്ടതാണ്’ എന്നു പരിഭാഷപ്പെടുത്തി; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: Ἐὰν
  choice: ഇച്ഛിച്ചാൽ
  rationale: θελήσῃയോടൊപ്പം വ്യവസ്ഥ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ‘-ച്ചാൽ’ രൂപം സ്വാഭാവികമായി ‘if’ എന്ന അർഥം നൽകുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവായ, ഗൗരവമുള്ള മലയാള ബൈബിൾ സമാനപദം; ഇവിടെ ആരെയാണ് പ്രത്യേകമായി ഉദ്ദേശിക്കുന്നതെന്ന് പരിഭാഷയിൽ നിർണയിക്കുന്നില്ല.
- source_word: θελήσῃ
  choice: ഇച്ഛിച്ചാൽ
  rationale: θέλω ഇവിടെ മനസ്സും തീരുമാനവും സൂചിപ്പിക്കുന്നു. ‘ഇച്ഛിക്കുക’ ദൈവഹിതത്തിന്റെ ഗൗരവം കാത്തുസൂക്ഷിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: καὶ ζήσομεν καὶ ποιήσομεν
  choice: നാം ജീവിക്കുകയും ... ചെയ്യുകയും ചെയ്യും
  rationale: രണ്ട് καί-കളുടെ ഏകോപനം മലയാളത്തിലെ ‘-ഉകയും ... -ഉകയും ചെയ്യും’ എന്ന സമാന്തരഘടനയിൽ വ്യക്തമായി നിലനിർത്തുന്നു; ജീവിതവും പ്രവർത്തനവും ഒരുപോലെ കർത്താവിന്റെ ഇച്ഛയിൽ ആശ്രയിക്കുന്നതായി കാണിക്കുന്നു.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: ഇതോ അതോ
  rationale: ആസൂത്രണം ചെയ്യുന്ന ഏതെങ്കിലും പ്രവൃത്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് യുഗ്മത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: വ്യവസ്ഥാവാക്യത്തിലെ ‘കർത്താവ്’ എന്നതിന്റെ പരാമർശം
  choice: ‘കർത്താവ്’ എന്നു മാത്രം നൽകി പരാമർശത്തിലെ അനിശ്ചിതത്വം നിലനിർത്തി.
  alternative: ‘ദൈവം’ അല്ലെങ്കിൽ ‘കർത്താവായ യേശു’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ ὁ κύριος എന്നു മാത്രമാണ്. അതിനാൽ പിതാവിനെയോ യേശുവിനെയോ പ്രത്യേകമായി നിർണയിക്കാതെ, മനുഷ്യജീവിതവും പദ്ധതികളും കർത്താവിന്റെ ഇച്ഛയ്ക്ക് വിധേയമാണെന്ന ആശയം സംരക്ഷിക്കുന്നു.
- issue: ജീവിക്കുകയും പ്രവർത്തിക്കുകയും ചെയ്യുന്നതിന്റെ കർത്താവിന്റെ ഇച്ഛയിലുള്ള ആശ്രയം
  choice: രണ്ട് ഭാവിക്രിയകളെയും വ്യവസ്ഥാവാക്യത്തിന്റെ പരിധിയിൽ സമാന്തരമായി നിലനിർത്തി.
  alternative: ‘നാം ജീവിച്ചിരുന്നാൽ’ എന്ന ആശയം ചേർത്ത് ജീവനെ വേറൊരു മനുഷ്യാനുഭവ വ്യവസ്ഥയായി അവതരിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ Ἐὰν ὁ κύριος θελήσῃ എന്ന വ്യവസ്ഥ ζήσομεν, ποιήσομεν എന്നീ രണ്ടിനെയും നിയന്ത്രിക്കുന്നു; അതിനാൽ രണ്ടും കർത്താവിന്റെ ഇച്ഛയിൽ ആശ്രയിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘ജീവിക്കുകയും ... ചെയ്യുകയും ചെയ്യും’ എന്ന സമാന്തരഘടന മൂലപാഠത്തിലെ രണ്ട് καί-കളെ ഭാരമില്ലാതെ പ്രതിഫലിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
