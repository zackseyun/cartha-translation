id: JAS.4.2
reference: James 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: ml
  text: നിങ്ങൾ ആഗ്രഹിക്കുന്നു, പക്ഷേ നിങ്ങൾക്കില്ല[a]; നിങ്ങൾ കൊല ചെയ്യുകയും[b] അസൂയപ്പെടുകയും[c] ചെയ്യുന്നു, പക്ഷേ നേടാൻ നിങ്ങൾക്കു കഴിയുന്നില്ല; നിങ്ങൾ പോരാടുകയും യുദ്ധം ചെയ്യുകയും ചെയ്യുന്നു. നിങ്ങൾ ചോദിക്കാത്തതിനാൽ[d] നിങ്ങൾക്കില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങൾ മോഹിക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം ശക്തമായ ആഗ്രഹത്തെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ അതിന് തെറ്റായ ആഗ്രഹം എന്ന ഭാവമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങൾ കൊല്ലുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം; എന്നാൽ ഗ്രീക്ക് ക്രിയ സാധാരണയായി കൂടുതൽ വ്യക്തമായി കുറ്റകരമായ കൊലപാതകത്തെ സൂചിപ്പിക്കുന്നു. ചിലർ ഈ വാക്ക് വാഗ്മിതാപരമായ അതിശയോക്തിയായി മനസ്സിലാക്കുന്നുവെങ്കിലും മുഖ്യപാഠം അതിന്റെ ശക്തമായ പദാർഥം നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘അസൂയകൊള്ളുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: d
    text: ചോദിക്കുന്നത് ദൈവത്തോടാണെന്ന് ചുറ്റുമുള്ള സന്ദർഭം സൂചിപ്പിക്കുന്നു; എന്നാൽ ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ദൈവത്തെ തുറന്നുപറയുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: നിങ്ങൾ ആഗ്രഹിക്കുന്നു
  rationale: ശക്തമായ ആഗ്രഹത്തെ സൂചിപ്പിക്കുന്ന പദമാണിത്. ഈ സന്ദർഭത്തിൽ ആ ആഗ്രഹം തെറ്റായ ദിശയിലുള്ളതാണെങ്കിലും, ‘ആഗ്രഹിക്കുന്നു’ എന്നത് പദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; ‘കാമിക്കുന്നു’ എന്ന് വിവർത്തനം ചെയ്താൽ അനാവശ്യമായി ലൈംഗിക അർഥത്തിലേക്കും ‘അന്യന്റേത് മോഹിക്കുന്നു’ എന്ന് പറഞ്ഞാൽ സ്വത്തുമായി മാത്രം ബന്ധപ്പെട്ട അർഥത്തിലേക്കും ചുരുങ്ങാം.
- source_word: οὐκ ἔχετε
  choice: നിങ്ങൾക്കില്ല
  rationale: ἔχω എന്ന ലളിതമായ ക്രിയയുടെ നിഷേധരൂപം മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുമുള്ള രീതിയിൽ നൽകുന്നു.
- source_word: φονεύετε
  choice: നിങ്ങൾ കൊലചെയ്യുന്നു
  rationale: φονεύω സാധാരണയായി വെറും കൊല്ലലിനേക്കാൾ കുറ്റകരമായ കൊലപാതകത്തെ സൂചിപ്പിക്കുന്നു. ‘കൊലചെയ്യുന്നു’ അതിന്റെ ധാർമ്മിക ഗൗരവം നിലനിർത്തുന്നു; പ്രയോഗം ആലങ്കാരികമോ അതിശയോക്തിപരമോ ആണെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ζηλοῦτε
  choice: അസൂയപ്പെടുന്നു
  rationale: ζηλόω ഉത്സാഹം എന്ന അനുകൂല അർഥവും അസൂയ എന്ന പ്രതികൂല അർഥവും വഹിക്കാം. വൈരപരമായ ഈ സന്ദർഭത്തിൽ പ്രതികൂല അർഥമാണ് യോജിക്കുന്നത്.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: നേടാൻ നിങ്ങൾക്കു കഴിയുന്നില്ല
  rationale: ആഗ്രഹിക്കുന്ന കാര്യം കൈവരിക്കാനോ നേടാനോ ഉള്ള കഴിവില്ലായ്മയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μάχεσθε
  choice: നിങ്ങൾ പോരാടുന്നു
  rationale: μάχομαι പോരാട്ടത്തെയോ കലഹത്തെയോ സൂചിപ്പിക്കാം. പിന്നാലെയുള്ള ശക്തമായ πολεμεῖτε-യോടുള്ള പദജോടി നിലനിർത്താൻ ‘പോരാടുന്നു’ തിരഞ്ഞെടുത്തു.
- source_word: πολεμεῖτε
  choice: യുദ്ധം ചെയ്യുന്നു
  rationale: πολεμέω, μάχομαι-നെക്കാൾ ശക്തമായി യുദ്ധപരമായ വൈരത്തെ സൂചിപ്പിക്കുന്നു. ‘യുദ്ധം ചെയ്യുന്നു’ എന്നത് ഈ തീവ്രത നിലനിർത്തുന്നു.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: നിങ്ങൾ ചോദിക്കാത്തതിനാൽ
  rationale: διά സഹിതമുള്ള articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു. ചോദിക്കുന്നത് ദൈവത്തോടാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നുവെങ്കിലും ഗ്രീക്കിൽ ആ കർമം തുറന്നുപറയാത്തതിനാൽ മലയാളത്തിലും ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: φονεύετε എന്ന ശക്തമായ പദത്തെ ആലങ്കാരികമെന്നു കരുതി മൃദൂകരിക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘നിങ്ങൾ കൊലചെയ്യുന്നു’ എന്ന് നിലനിർത്തി
  alternative: ‘നിങ്ങൾ കൊല്ലുന്നു’ അല്ലെങ്കിൽ വ്യാഖ്യാനപരമായി ‘ഹൃദയത്തിൽ കൊലചെയ്യുന്നു’
  rationale: ഗ്രീക്ക് ക്രിയയുടെ ശക്തമായ പദാർഥം വിവർത്തനത്തിൽ മൃദൂകരിക്കരുത്. അത് ആലങ്കാരികമോ വാഗ്മിതാപരമോ ആണെന്ന വിലയിരുത്തൽ വ്യാഖ്യാനത്തിന്റെ പരിധിയിലാണ്.
- issue: αἰτεῖσθαι എന്നതിന് ദൈവത്തെ തുറന്ന കർമമായി ചേർക്കണമോ
  choice: ‘നിങ്ങൾ ചോദിക്കാത്തതിനാൽ’ എന്ന് കർമം സൂചിതമായി വിട്ടു
  alternative: ‘നിങ്ങൾ ദൈവത്തോടു ചോദിക്കാത്തതിനാൽ’
  rationale: തുടർന്നുള്ള സന്ദർഭത്തിൽ ചോദിക്കുന്നത് ദൈവത്തോടാണെന്ന് വ്യക്തമാകുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം θεόν എന്ന് പറയുന്നില്ല. അതിനാൽ സൂചന നിലനിർത്തി, വ്യക്തമാക്കാത്ത കർമം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം നേരിട്ടും ഗൗരവത്തോടെയും രൂപപ്പെടുത്തി. ഗ്രീക്ക് വാക്യത്തിലെ മൂന്നു സംഘർഷഘടകങ്ങളുടെ ക്രമവും തീവ്രതയും അർദ്ധവിരാമങ്ങളിലൂടെ നിലനിർത്തി; അനാവശ്യമായ മതവിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
