id: JAS.4.1
reference: James 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിൽ യുദ്ധങ്ങൾ എവിടെനിന്ന് വരുന്നു? പോരാട്ടങ്ങൾ എവിടെനിന്ന്? നിങ്ങളുടെ അവയവങ്ങളിൽ യുദ്ധം ചെയ്യുന്ന നിങ്ങളുടെ സുഖങ്ങളിൽനിന്നല്ലയോ അവ വരുന്നത്?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യുദ്ധങ്ങൾ ... പോരാട്ടങ്ങൾ’ എന്നതിന് ‘സംഘർഷങ്ങൾ ... കലഹങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ സൈനികപദങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; ഇവിടെ അവ സമൂഹത്തിനുള്ളിലെ തർക്കങ്ങളെ രൂപകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ആദ്യത്തെ ‘നിങ്ങളുടെ ഇടയിൽ’ എന്നതിന് ‘നിങ്ങളിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം വായനക്കാരുടെ ഇടയിലെ സംഘർഷത്തെയോ അവരുടെ ഉള്ളിലെ സംഘർഷത്തെയോ സൂചിപ്പിക്കാം. ഈ വാക്യം പുറമേയുള്ള കലഹത്തെ ഉള്ളിലെ സുഖങ്ങളുമായി ബന്ധിപ്പിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: ‘അവയവങ്ങൾ’ എന്നത് പദാനുപദ പരിഭാഷയാണ്; അത് ശരീരഭാഗങ്ങളെയോ കൂടുതൽ വിശാലമായി ഒരാളുടെ ഉള്ളിലെ പ്രവർത്തനശേഷികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν ... πόθεν
  choice: എവിടെനിന്നാണ് ... വരുന്നത്
  rationale: ഉത്ഭവസ്ഥാനത്തെക്കുറിച്ചുള്ള ആവർത്തിച്ച ചോദ്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ചോദ്യഘടന ഉപയോഗിക്കുന്നു.
- source_word: πόλεμοι
  choice: യുദ്ധങ്ങൾ
  rationale: സമൂഹത്തിലെ കടുത്ത സംഘർഷങ്ങളെ സൂചിപ്പിക്കുന്ന സൈനികരൂപകം വ്യാഖ്യാനിച്ച് മൃദുവാക്കാതെ നിലനിർത്തുന്നു.
- source_word: μάχαι
  choice: പോരാട്ടങ്ങൾ
  rationale: πόλεμοι എന്നതിൽനിന്ന് വേർതിരിച്ച പദമായി സൈനികഭാവവും തർക്കങ്ങളുടെ ആശയവും നിലനിർത്തുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: വിശ്വാസസമൂഹത്തിനുള്ളിലെ പരസ്പരസംഘർഷമാണ് സന്ദർഭത്തിലെ പ്രാഥമിക അർഥം; ‘നിങ്ങളിൽ’ എന്ന ആന്തരിക സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὐκ ἐντεῦθεν, ἐκ
  choice: '...നിന്നല്ലയോ അവ വരുന്നത്?'
  rationale: അടുത്തുവരുന്ന ഉറവിടത്തിലേക്ക് വിരൽചൂണ്ടുന്ന ഗ്രീക്ക് പ്രയോഗത്തെയും അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യത്തെയും സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἡδονῶν
  choice: സുഖമോഹങ്ങൾ
  rationale: ἡδονήയിലെ സുഖാന്വേഷണവും സ്വയംതൃപ്തിപ്പെടുത്താനുള്ള മോഹവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെറും ‘സുഖങ്ങൾ’ എന്നു പറഞ്ഞാൽ സജീവമായി യുദ്ധം ചെയ്യുന്നതിന്റെ ആശയം അസ്വാഭാവികമാകാം.
- source_word: στρατευομένων
  choice: യുദ്ധം ചെയ്യുന്ന
  rationale: തുടർച്ചയായ ആന്തരിക പോരാട്ടത്തെ സൂചിപ്പിക്കുന്ന സൈനികരൂപകം നിലനിർത്തുകയും ‘യുദ്ധങ്ങൾ’ എന്ന മുൻപത്തെ പദവുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: നിങ്ങളുടെ അവയവങ്ങളിൽ
  rationale: ശരീരഭാഗങ്ങളെയോ വ്യക്തിയുടെ പ്രവർത്തനശേഷികളെയോ സൂചിപ്പിക്കാവുന്ന μέλη എന്ന രൂപകം വ്യാഖ്യാനിച്ചു ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആദ്യത്തെ ἐν ὑμῖν ബാഹ്യമായ സമൂഹസംഘർഷമാണോ ആന്തരിക സംഘർഷമാണോ
  choice: പ്രധാനപാഠത്തിൽ ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന് നൽകി സമൂഹത്തിലെ സംഘർഷത്തെ മുൻനിർത്തുന്നു; അവസാനഭാഗത്ത് ‘നിങ്ങളുടെ അവയവങ്ങളിൽ’ എന്ന് നൽകി ആന്തരിക ഉറവിടവും നിലനിർത്തുന്നു.
  alternative: ആദ്യപ്രയോഗവും ‘നിങ്ങളിൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി മുഴുവൻ വാക്യത്തെയും ആന്തരിക സംഘർഷമായി വായിക്കുക.
  rationale: യാക്കോബ് പുറമേയുള്ള കലഹത്തെ ഉള്ളിലെ സുഖമോഹങ്ങളുമായി ബന്ധിപ്പിക്കുന്നു. അതിനാൽ സാമൂഹികവും ആന്തരികവുമായ മാനങ്ങൾ തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: ἡδονῶν എന്നത് നിഷ്പക്ഷമായ സുഖങ്ങളെയോ ക്രമരഹിതമായ മോഹങ്ങളെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ‘സുഖമോഹങ്ങൾ’ എന്ന പദം ഉപയോഗിച്ച് സുഖാന്വേഷണത്തിന്റെ സജീവവും പ്രശ്നകരവുമായ ഭാവം നൽകുന്നു.
  alternative: കൂടുതൽ പദാനുപദമായി ‘സുഖങ്ങൾ’ അല്ലെങ്കിൽ വ്യാഖ്യാനാത്മകമായി ‘ദുരാശകൾ’.
  rationale: സന്ദർഭത്തിലെ യുദ്ധം ചെയ്യുന്ന ശക്തി എന്ന പ്രതികൂലഭാവം അറിയിക്കുമ്പോഴും ‘ദുരാശകൾ’ എന്ന ശക്തമായ നൈതികവ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. മൂലത്തിലെ സൈനികരൂപകം ‘യുദ്ധങ്ങൾ’, ‘പോരാട്ടങ്ങൾ’, ‘യുദ്ധം ചെയ്യുന്ന’ എന്നീ ബന്ധിതപദങ്ങളിലൂടെ നിലനിർത്തി. ആവർത്തിച്ച ἐν ὑμῖν മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ടുതവണ ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന് നൽകിയിരിക്കുന്നു.
