  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: ml
  text: അതുകൊണ്ട്[a], നന്മ ചെയ്യണമെന്ന് അറിഞ്ഞിട്ടും അതു ചെയ്യാത്തവന് അത് പാപമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിനാൽ, ചെയ്യേണ്ട നന്മ എന്തെന്ന് അറിഞ്ഞിട്ടും അതു ചെയ്യാത്തവന് അത് പാപമാണ്.”
    reason: οὖν എന്നതിന്റെ മറ്റൊരു സ്വാഭാവിക വിവർത്തനവും καλὸν ποιεῖν എന്ന പ്രയോഗത്തെ അറിയപ്പെടുന്ന കടമയായി കൂടുതൽ വ്യക്തമാക്കുന്ന സാധ്യതയും നൽകുന്നു.
lexical_decisions:
- source_word: εἰδότι
  choice: അറിഞ്ഞിട്ടും … ചെയ്യാത്തവന്
  rationale: ദത്തിവ് ഏകവചനത്തിലുള്ള കൃദന്തരൂപം പൊതുവായി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അറിഞ്ഞിട്ടും … ചെയ്യാത്തവന്’ എന്ന ഘടന ഏകവചനവും വ്യക്തിപരമായ പ്രയോഗവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ ചർച്ചയിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: καλὸν ποιεῖν
  choice: നന്മ ചെയ്യണമെന്ന്
  rationale: καλόν എന്നതിന്റെ വിശാലമായ ധാർമിക അർഥം ‘നന്മ’ നിലനിർത്തുന്നു; infinitive-നെ അറിയപ്പെടുന്ന കടമയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു, എന്നാൽ ഒരു പ്രത്യേക പ്രവൃത്തിയിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: μὴ ποιοῦντι
  choice: അതു ചെയ്യാത്തവന്
  rationale: മുൻപറഞ്ഞ നന്മയെ ‘അതു’ എന്നു സൂചിപ്പിച്ച്, അറിയുന്നവനും പ്രവർത്തിക്കാത്തവനും ഒരേ വ്യക്തിയാണെന്ന ഗ്രീക്ക് ഘടനയിലെ വിരുദ്ധത നിലനിർത്തുന്നു.
- source_word: ἁμαρτία
  choice: പാപമാണ്
  rationale: ലേഖനമില്ലാത്ത predicate noun-ന്റെ ഗുണനിർണ്ണയശക്തി നിലനിർത്തി, ഈ ചെയ്യാതിരിക്കൽ പാപമാണെന്ന് നേരിട്ട് പ്രസ്താവിക്കുന്നു.
- source_word: αὐτῷ ἐστιν
  choice: അവന് അത് … ആണ്
  rationale: ബന്ധസൂചക ദത്തിവിന്റെ വ്യക്തിപരമായ പ്രയോഗം ‘അവന്’ എന്നും, പരാമർശിക്കപ്പെട്ട വീഴ്ചയെ ‘അത്’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അറിയാവുന്ന നന്മ ചെയ്യാതിരിക്കുന്നതിനെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: അറിഞ്ഞിട്ടും നന്മ ചെയ്യാതിരിക്കുന്നത് പാപമാണെന്ന പൊതുവായ പ്രസ്താവനയായി വിവർത്തനം ചെയ്തു.
  alternative: ഇത് അഹങ്കാരപൂർവമായ ഭാവിപദ്ധതികളെക്കുറിച്ചുള്ള തൊട്ടുമുൻപത്തെ സന്ദർഭത്തിൽ മാത്രം പരിമിതപ്പെടുത്തുക.
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭം സ്വയം ഉറപ്പിച്ചുള്ള പദ്ധതിയിടലാണെങ്കിലും, വാക്യത്തിന്റെ രൂപം വിശാലമായ ധാർമിക പ്രയോഗത്തിന് ഇടനൽകുന്നു. വിവർത്തനം ഈ വ്യാപ്തി നിലനിർത്തുകയും പ്രത്യേക സിദ്ധാന്തവ്യവസ്ഥ ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നന്മ ചെയ്യുക’ എന്ന പരിചിതമായ ധാർമിക പ്രയോഗം ഉപയോഗിച്ചു; വാക്യത്തിന്റെ പൊതുവായ സ്വഭാവവും മുൻസന്ദർഭത്തോടുള്ള നിഗമനബന്ധവും നിലനിർത്തി.
