id: JAS.4.5
reference: James 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: ml
  text: അല്ലെങ്കിൽ, തിരുവെഴുത്ത് വ്യർഥമായി പറയുന്നുവെന്ന് നിങ്ങൾ കരുതുന്നുവോ? നമ്മിൽ വസിക്കുമാറാക്കിയ ആത്മാവ് അസൂയയോടെ കാംക്ഷിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നമ്മിൽ വസിക്കുമാറാക്കിയ ആത്മാവ് അസൂയയിലേക്കു കാംക്ഷിക്കുന്നു.” ഗ്രീക്കിൽ ഇവിടെ ‘ആത്മാവ്’ പരിശുദ്ധാത്മാവിനെയോ മനുഷ്യാത്മാവിനെയോ സൂചിപ്പിക്കാം; “അസൂയയോടെ” എന്നു വിവർത്തനം ചെയ്ത പ്രയോഗത്തിന് തീക്ഷ്ണമായ അവകാശബോധം എന്ന അർത്ഥവും ഉണ്ടാകാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: κενῶς
  choice: വ്യർഥമായി
  rationale: തിരുവെഴുത്ത് ലക്ഷ്യമോ ഫലമോ ഇല്ലാതെ സംസാരിക്കുന്നുവോ എന്ന വാചാടോപചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡ γραφὴ
  choice: തിരുവെഴുത്ത്
  rationale: നിർദ്ദിഷ്ടമായ ഏകവചനപ്രയോഗം ദൈവിക അധികാരമുള്ള ലിഖിതവെളിപ്പാടിനെ സൂചിപ്പിക്കുന്ന പതിവ് പുതിയനിയമ പ്രയോഗമായി അവതരിപ്പിക്കുന്നു.
- source_word: Πρὸς φθόνον
  choice: അസൂയയോടെ
  rationale: ഗ്രീക്കിലെ ദുഷ്കരമായ പ്രയോഗത്തിന്റെ അസൂയ/തീക്ഷ്ണമായ അവകാശബോധം എന്ന അർത്ഥസാധ്യത തുറന്നുവെക്കുന്നു; നിഷേധാർഥം പൂർണമായി നീക്കാതെ അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: ἐπιποθεῖ
  choice: അതിയായി ആഗ്രഹിക്കുന്നു
  rationale: ശക്തവും തീവ്രവുമായ അഭിലാഷം എന്ന ἐπιποθέωയുടെ അർത്ഥം സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: വലിയക്ഷര വ്യത്യാസമില്ലാത്ത മലയാളപ്രയോഗം പരിശുദ്ധാത്മാവിനെയും മനുഷ്യാത്മാവിനെയും സംബന്ധിച്ച ഗ്രീക്ക് വ്യാകരണത്തിലെ യഥാർഥ ദ്വയാർഥത പ്രധാനവാചകത്തിലും നിലനിർത്തുന്നു.
- source_word: κατῴκισεν
  choice: വസിക്കുമാറാക്കിയ
  rationale: സാധാരണ ‘വസിക്കുന്നു’ എന്നതിലുപരി ഗ്രീക്ക് ക്രിയയുടെ കാരകഭാവം സംരക്ഷിക്കുന്നു; പ്രവർത്തകനെ ഗ്രീക്ക് വാചകത്തെപ്പോലെ പരോക്ഷമായി വിടുന്നു.
- source_word: ἐν ἡμῖν
  choice: നമ്മിൽ
  rationale: കൂട്ടത്തിനിടയിലെ സാന്നിധ്യത്തേക്കാൾ ഉള്ളിൽ വസിക്കൽ എന്ന സ്വാഭാവിക അർത്ഥം നൽകുന്നു, എന്നാൽ മലയാളത്തിൽ ആവശ്യത്തിലധികം വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: τὸ πνεῦμα ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനവാചകത്തിലെ ‘ആത്മാവ്’ പരിശുദ്ധാത്മാവായോ മനുഷ്യാത്മാവായോ വായിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി.
  alternative: ദൈവം നമ്മിൽ വസിക്കുമാറാക്കിയ മനുഷ്യാത്മാവ്.
  rationale: ഗ്രീക്ക് വ്യാകരണം രണ്ടുവായനകളും അനുവദിക്കുന്നു. മലയാളത്തിൽ വലിയക്ഷരത്തിലൂടെ വ്യത്യാസം അടയാളപ്പെടുത്താത്തതിനാൽ യഥാർഥ ദ്വയാർഥത സ്വാഭാവികമായി സംരക്ഷിക്കാം; അടിക്കുറിപ്പ് അത് വ്യക്തമായി അറിയിക്കുന്നു.
- issue: φθόνος പ്രയോഗത്തിന്റെ ധാർമ്മിക ഭാവം
  choice: ‘അസൂയയോടെ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: തീക്ഷ്ണമായ അവകാശബോധത്തോടെ / അസൂയയിലേക്കു.
  rationale: φθόνος സാധാരണയായി അസൂയയെ സൂചിപ്പിക്കുമ്പോഴും ഈ ദുഷ്കരവാക്യത്തിൽ ദൈവികമായ തീക്ഷ്ണ അവകാശബോധം എന്ന വായന സാധ്യമാണ്. പ്രധാനവാചകം ഗ്രീക്കിന്റെ മൂർച്ച നിലനിർത്തുകയും അടിക്കുറിപ്പ് അർത്ഥസാധ്യതകൾ വിശദീകരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വസിക്കുമാറാക്കിയ’ എന്ന രൂപം കാരകഭാവം സൂക്ഷിക്കുന്നു. ‘ആത്മാവ്’ എന്ന പദം ഉദ്ദേശപൂർവം ദ്വയാർഥമായി നിലനിർത്തിയിരിക്കുന്നു.
