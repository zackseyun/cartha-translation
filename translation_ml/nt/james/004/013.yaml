id: JAS.4.13
reference: James 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: ml
  text: ഇനി കേൾക്കൂ, “ഇന്നോ നാളെയോ ഞങ്ങൾ ഈ നഗരത്തിലേക്കു പോകും; അവിടെ ഒരു വർഷം ചെലവഴിച്ച് വ്യാപാരം നടത്തി ലാഭമുണ്ടാക്കും” എന്നു പറയുന്നവരേ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ നഗരത്തിലേക്കു’ എന്നതിലെ ‘ഈ’ ഗ്രീക്കിൽ സംസാരിക്കുന്നവരുടെ പദ്ധതിയിലുള്ള ഒരു പ്രത്യേക നഗരത്തെ സൂചിപ്പിക്കുന്ന പ്രദർശകപദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: ഇപ്പോൾ കേൾക്കൂ
  rationale: ശാസനയോ മുന്നറിയിപ്പോ തുടങ്ങുന്ന ശ്രദ്ധക്ഷണിക്കുന്ന പ്രയോഗമാണിത്. അക്ഷരാർഥത്തിലുള്ള ‘വരൂ ഇപ്പോൾ’ എന്നതിനെക്കാൾ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അതിന്റെ നേരിട്ടുള്ള ആഹ്വാനശക്തി ‘ഇപ്പോൾ കേൾക്കൂ’ നൽകുന്നു.
- source_word: οἱ λέγοντες
  choice: എന്നു പറയുന്നവരേ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തം ഇവിടെ അഭിസംബോധനയായി പ്രവർത്തിക്കുന്നു. ‘പറയുന്നവരേ’ എന്നത് അകന്ന വിവരണമായി മാറ്റാതെ നേരിട്ടുള്ള ശാസന നിലനിർത്തുന്നു.
- source_word: Σήμερον ἢ αὔριον
  choice: ഇന്നോ നാളെയോ
  rationale: ἢ വികല്പസൂചകമായതിനാൽ ‘അല്ലെങ്കിൽ’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ഓ ... -ഓ’ ഘടനയിൽ സൂക്ഷിക്കുന്നു.
- source_word: πορευσόμεθα
  choice: ഞങ്ങൾ ... പോകും
  rationale: πορεύομαι എന്നതിന്റെ സാധാരണ സഞ്ചാരാർഥം ലളിതവും സ്വാഭാവികവുമായ ‘പോകും’ കൃത്യമായി നൽകുന്നു.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: ഈ നഗരത്തിലേക്കു
  rationale: τήνδε സൂചിപ്പിക്കുന്ന, സംസാരിക്കുന്നവർ പദ്ധതിയിൽ നിശ്ചയിച്ച പ്രത്യേക നഗരത്തെ ‘ഈ നഗരം’ എന്ന പ്രദർശകപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; εἰς എന്ന ദിശാബോധം ‘-ലേക്കു’ നൽകുന്നു.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: അവിടെ ഒരു വർഷം ചെലവഴിച്ച്
  rationale: കാലദൈർഘ്യത്തോടൊപ്പം ποιέω ഉപയോഗിക്കുന്ന ഗ്രീക്ക് ശൈലിയുടെ അർഥം ‘ഒരു വർഷം ചെലവഴിക്കുക’ എന്നാണ്; മലയാളത്തിൽ ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐμπορευσόμεθα
  choice: വ്യാപാരം നടത്തി
  rationale: വാണിജ്യപ്രവർത്തനം നടത്തുക എന്ന അർഥം ‘വ്യാപാരം നടത്തുക’ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: κερδήσομεν
  choice: ലാഭമുണ്ടാക്കും
  rationale: വ്യാപാരസന്ദർഭത്തിൽ സാമ്പത്തിക നേട്ടമാണ് ഉദ്ദേശ്യം. ‘ലാഭമുണ്ടാക്കും’ അതിനെ പൊതുവായ ‘നേടും’ എന്നതിനെക്കാൾ കൃത്യമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശാസനാത്മകമായ നേരിട്ടുള്ള അഭിസംബോധന
  choice: ‘എന്നു പറയുന്നവരേ’ എന്ന നേരിട്ടുള്ള അഭിസംബോധന
  alternative: ‘എന്നു പറയുന്നവർ’ എന്ന അകന്ന വിവരണം
  rationale: യാക്കോബ് ആസൂത്രകരെക്കുറിച്ച് വെറും വിവരണം നൽകുകയല്ല, അവരെ നേരിട്ട് അഭിസംബോധന ചെയ്യുകയാണ്. അതിനാൽ വാക്യത്തിന്റെ ശാസനാത്മക ശക്തി നിലനിർത്തുന്നു.
- issue: ഭാവിയെക്കുറിച്ചുള്ള ഉറപ്പാർന്ന ആസൂത്രണത്തിന്റെ സ്വരം
  choice: എല്ലാ ക്രിയകളും ഉറപ്പോടെ പ്രഖ്യാപിക്കുന്ന ഭാവികാലത്തിൽ നിലനിർത്തി
  alternative: ‘പോകാൻ ഉദ്ദേശിക്കുന്നു’ പോലുള്ള മൃദുവായ സാധ്യതാപ്രയോഗം
  rationale: ഗ്രീക്കിലെ തുടർച്ചയായ ഭാവികാല ക്രിയകൾ സംസാരിക്കുന്നവരുടെ ആത്മവിശ്വാസപൂർണമായ പദ്ധതി പ്രകടിപ്പിക്കുന്നു. തുടർന്നുള്ള വാക്യങ്ങളിലെ ദൈവഹിതവുമായി ബന്ധപ്പെട്ട സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കാതെ ഇത് നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവവും ശാസനാത്മകമായ നേരിട്ടുള്ള സ്വരവും നിലനിർത്തുന്ന ഭാഷ. ഉദ്ധരണിക്കുള്ളിലെ ക്രിയാശൃംഖല മലയാളത്തിൽ സ്വാഭാവികമായി ഒഴുകാൻ കൃദന്തരൂപങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ ഉറപ്പാർന്ന ഭാവികാലഭാവം അവസാന ക്രിയയിൽ വ്യക്തമായി നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
