  source_fidelity: 'മുഖ്യപാഠം ഗ്രീക്കിലെ ക്രമവും അർഥവും വിശ്വസ്തമായി നൽകുന്നു: വികല്പം (‘ഇന്നോ നാളെയോ’), ഒരു നിശ്ചിത നഗരം, അവിടെ ഒരു വർഷം ചെലവഴിക്കൽ, വ്യാപാരം, ലാഭം എന്നിവ എല്ലാം നിലനിൽക്കുന്നു. Ἄγε νῦν എന്ന പ്രാരംഭ ശാസനാത്മക ശ്രദ്ധക്ഷണത്തെ ‘ഇനി കേൾക്കൂ’ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.'
  naturalness: മലയാളം പൊതുവേ സ്വാഭാവികവും ആധുനിക നിലവാരഭാഷയിലുമാണ്. ‘ഇനി കേൾക്കൂ’ ഇവിടെ ‘ഇപ്പോൾ കേൾക്കൂ’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ പ്രയോഗപരമായ ‘Come now’ എന്ന ആഹ്വാനസ്വരത്തിന് യോജിച്ചതാണ്. ഉദ്ധരണിക്കു ശേഷമുള്ള ‘എന്നു പറയുന്നവരേ’ നേരിട്ടുള്ള അഭിസംബോധന വ്യക്തമായി നിലനിർത്തുന്നു.
  terminology: ‘നഗരത്തിലേക്കു,’ ‘ഒരു വർഷം ചെലവഴിച്ച്,’ ‘വ്യാപാരം നടത്തി,’ ‘ലാഭമുണ്ടാക്കും’ എന്നിവ കൃത്യവും സ്വാഭാവികവുമാണ്. നിലവിലെ അടിക്കുറിപ്പിലെ ‘ഇന്ന നഗരത്തിലേക്കു’ എന്ന പ്രയോഗം ആധുനിക മലയാളത്തിൽ അവ്യക്തവും തെറ്റായി ഗ്രഹിക്കപ്പെടാവുന്നതുമാണ്; അതു നീക്കണം.
