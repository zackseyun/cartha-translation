id: JAS.4.8
reference: James 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: ml
  text: ദൈവത്തോട് അടുത്തുചെല്ലുക; അവൻ നിങ്ങളോടും അടുത്തുവരും. പാപികളേ, നിങ്ങളുടെ കൈകൾ ശുദ്ധമാക്കുക; ഇരുമനസ്സുകാരേ[a], നിങ്ങളുടെ ഹൃദയങ്ങൾ നിർമലമാക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “രണ്ടു മനസ്സുള്ളവരേ.” ഉള്ളിലെ വിശ്വസ്തതയിലോ പ്രതിബദ്ധതയിലോ പിളർന്നുനിൽക്കുന്നവരെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: അടുത്തുചെല്ലുക
  rationale: ബഹുവചനത്തെ അഭിസംബോധന ചെയ്യുന്ന ശക്തമായ ആജ്ഞ നിലനിർത്തുന്നു; ദൈവത്തോടുള്ള ബന്ധപരവും ആത്മീയവുമായ സമീപനത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തോട്
  rationale: ἐγγίζω എന്ന ക്രിയയോടൊപ്പമുള്ള ദത്തിവ് ഇവിടെ സമീപനത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദൈവത്തോട്’ സ്വാഭാവികമാണ്.
- source_word: ἐγγιεῖ
  choice: അവൻ നിങ്ങളോടും അടുത്തുവരും
  rationale: മുൻവാക്യത്തിലെ ദൈവമാണ് സൂചിത കർത്താവ്. ‘അടുത്ത്’ എന്ന ആശയം ആവർത്തിച്ച് ഗ്രീക്കിലെ സമാന്തരതയും ‘നിങ്ങളോടും’ എന്നതിലൂടെ പരസ്പരബന്ധവും നിലനിർത്തുന്നു.
- source_word: καθαρίσατε
  choice: ശുദ്ധമാക്കുക
  rationale: ആചാരപരവും ധാർമികവുമായ ശുദ്ധീകരണസൂചനകൾ രണ്ടും തുറന്നുവയ്ക്കുകയും ആജ്ഞയുടെ മൂർച്ച നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: χεῖρας
  choice: നിങ്ങളുടെ കൈകൾ
  rationale: പുറമേയുള്ള പ്രവൃത്തികളെ സൂചിപ്പിക്കാവുന്ന ശരീരബിംബം വ്യാഖ്യാനിച്ചു മാറ്റാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: ἁμαρτωλοί
  choice: പാപികളേ
  rationale: ബഹുവചന സംബോധനയും നേരിട്ടുള്ള ശാസനയും ചുരുക്കമായും വ്യക്തമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἁγνίσατε
  choice: നിർമലമാക്കുക
  rationale: καθαρίσατε എന്നതിന് ഉപയോഗിച്ച ‘ശുദ്ധമാക്കുക’ എന്ന പദത്തിൽനിന്ന് വേർതിരിച്ച് യാക്കോബിന്റെ പദവൈവിധ്യവും ഹൃദയത്തിന്റെ ആന്തരിക ശുദ്ധിയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: καρδίας
  choice: നിങ്ങളുടെ ഹൃദയങ്ങൾ
  rationale: ഉദ്ദേശ്യങ്ങൾ, ആഗ്രഹങ്ങൾ, വിശ്വസ്തത എന്നിവ ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്ന വേദപുസ്തകബിംബം നിലനിർത്തുന്നു.
- source_word: δίψυχοι
  choice: ഇരുമനസ്സുകാരേ
  rationale: വിഭജിതമായ ആന്തരിക വിശ്വസ്തതയെയോ പ്രതിബദ്ധതയെയോ സ്വാഭാവികവും ഗ്രാഹ്യവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഗ്രീക്കിലെ ഉജ്ജ്വലമായ അക്ഷരാർഥബിംബം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ധാർമിക പ്രബോധനത്തിലെ ശരീരബിംബങ്ങളെ വ്യാഖ്യാനിച്ചു മാറ്റണമോ എന്നത്
  choice: ‘കൈകൾ’, ‘ഹൃദയങ്ങൾ’ എന്നീ ബിംബങ്ങൾ അതേപടി നിലനിർത്തി അവയുടെ ധാർമിക പ്രയോഗം വിശദീകരിക്കാതെ വിടുന്നു.
  alternative: പുറമേയുള്ള പ്രവൃത്തികൾ, ഉള്ളിലെ ഉദ്ദേശ്യങ്ങൾ എന്നിങ്ങനെ പരാവർത്തനം ചെയ്യുക.
  rationale: ഈ ശുദ്ധീകരണഭാഷയ്ക്ക് ധാർമികവും സാധ്യതയുള്ള ആചാരപരവുമായ അനുരണനങ്ങളുണ്ട്. ബിംബങ്ങൾ നിലനിർത്തുന്നത് മൂലപാഠത്തിലെ വ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
- issue: δίψυχοι എന്ന പദം ആധുനിക മലയാളത്തിൽ എങ്ങനെ നൽകണം
  choice: പ്രധാനപാഠത്തിൽ ‘ഇരുമനസ്സുകാരേ’ എന്ന് നൽകുന്നു.
  alternative: ‘രണ്ട് ആത്മാവുള്ളവരേ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം ഉപയോഗിക്കുക.
  rationale: ഈ പദം ഉള്ളിൽ പിളർന്ന വിശ്വസ്തതയെ സൂചിപ്പിക്കുന്നു. ‘ഇരുമനസ്സുകാരേ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘രണ്ട് ആത്മാവുള്ളവർ’ എന്ന ഗ്രീക്ക് ബിംബം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള സംബോധനകളും ആജ്ഞകളും നിലനിർത്തിയിട്ടുണ്ട്; അതിപുരാതനമായ ‘-വിൻ’ രൂപങ്ങൾ ഒഴിവാക്കി. ഗ്രീക്കിലെ രണ്ട് ശുദ്ധീകരണക്രിയകളുടെ പദവൈവിധ്യം ‘ശുദ്ധമാക്കുക/നിർമലമാക്കുക’ എന്ന വ്യത്യാസത്തിലൂടെ സംരക്ഷിച്ചു.
