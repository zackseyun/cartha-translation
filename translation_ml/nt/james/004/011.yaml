id: JAS.4.11
reference: James 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: ml
  text: സഹോദരങ്ങളേ[b], പരസ്പരം ദുഷിച്ചു സംസാരിക്കരുത്.[a] ഒരു സഹോദരനെ ദുഷിച്ചു സംസാരിക്കുകയോ തന്റെ സഹോദരനെ വിധിക്കുകയോ ചെയ്യുന്നവൻ ന്യായപ്രമാണത്തെ ദുഷിച്ചു സംസാരിക്കുകയും ന്യായപ്രമാണത്തെ വിധിക്കുകയും ചെയ്യുന്നു. എന്നാൽ നീ ന്യായപ്രമാണത്തെ വിധിക്കുന്നുവെങ്കിൽ, നീ ന്യായപ്രമാണം അനുഷ്ഠിക്കുന്നവനല്ല, മറിച്ച് ഒരു വിധികർത്താവാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരസ്പരം അപവാദം പറയരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ അപകീർത്തിപ്പെടുത്തുന്ന വിധത്തിൽ അയാൾക്കെതിരെ സംസാരിക്കുക എന്ന അർഥമുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സഹോദരങ്ങളേ’ എന്നത് ഗ്രീക്കിൽ പുരുഷലിംഗ ബഹുവചനമാണ്; എന്നാൽ ഇവിടെ സഹോദരീസഹോദരന്മാർ ഉൾപ്പെടുന്ന വിശ്വാസിസമൂഹം മുഴുവനും ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: ദുഷിച്ചു സംസാരിക്കരുത് / ദുഷിച്ചു സംസാരിക്കുന്നവൻ / ദുഷിച്ചു സംസാരിക്കുന്നു
  rationale: മറ്റൊരാൾക്കെതിരെ അപകീർത്തികരമായോ ദോഷകരമായോ സംസാരിക്കുന്നതെന്ന അർഥം നൽകുന്നു; ‘അപവാദം പറയുക’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ വാക്യത്തിലെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: ἀλλήλων
  choice: പരസ്പരം
  rationale: പരസ്പരപ്രവർത്തനം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചന സംബോധനയും സഭയുടെ കുടുംബരൂപകവും നിലനിർത്തുന്നു; സമൂഹം മുഴുവനും ഉൾപ്പെടാനിടയുള്ളത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: ഒരു സഹോദരനെ / സ്വന്തം സഹോദരനെ
  rationale: യാക്കോബിലെ കുടുംബരൂപകം സംരക്ഷിക്കുകയും αὐτοῦ എന്ന ബന്ധസൂചന ‘സ്വന്തം’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἢ
  choice: അല്ലെങ്കിൽ എന്ന അർഥത്തിൽ ‘-യോ ... -യോ’
  rationale: ദുഷിച്ചു സംസാരിക്കുന്നതും വിധിക്കുന്നതും സമാന്തര പ്രവൃത്തികളായി വേർതിരിക്കുന്ന disjunctive ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κρίνων / κρίνει / κρίνεις
  choice: വിധിക്കുക
  rationale: സഹോദരനെയും ന്യായപ്രമാണത്തെയും ‘വിധിക്കുക’ എന്ന പദബന്ധം നിലനിർത്തി ഗ്രീക്കിലെ ആവർത്തനവും വാദത്തിന്റെ മൂർച്ചയും സംരക്ഷിക്കുന്നു.
- source_word: νόμου / νόμον
  choice: ന്യായപ്രമാണം
  rationale: യാക്കോബിന്റെ പശ്ചാത്തലത്തിലെ ദൈവിക ധാർമ്മികനിയമത്തെ സൂചിപ്പിക്കാൻ ബൈബിൾ മലയാളത്തിൽ പരിചിതമായ പദം; വാക്യം തന്നെ ഏത് പ്രത്യേക നിയമമാണെന്ന് നിർണ്ണയിക്കാത്തതിനാൽ കൂടുതൽ വിശദീകരിച്ചിട്ടില്ല.
- source_word: ποιητὴς
  choice: അനുഷ്ഠിക്കുന്നവൻ
  rationale: നിയമം പ്രവൃത്തിയിൽ നടപ്പാക്കുന്നയാൾ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; ‘ചെയ്യുന്നവൻ’ എന്നതിനെക്കാൾ ഇവിടെ വ്യക്തമാണ്.
- source_word: κριτής
  choice: വിധികർത്താവ്
  rationale: ποιητής-κριτής എന്ന നാമപദവിരോധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന സംബോധനയുടെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരങ്ങളേ’; സ്ത്രീകളും ഉൾപ്പെട്ട വിശ്വാസിസമൂഹമായിരിക്കാമെന്ന് അടിക്കുറിപ്പിൽ.
  alternative: ‘സഹോദരീസഹോദരങ്ങളേ’ അല്ലെങ്കിൽ ‘സഹവിശ്വാസികളേ’
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനവും കുടുംബരൂപകവും കാത്തുസൂക്ഷിക്കുമ്പോൾ സന്ദർഭത്തിലെ ഉൾക്കൊള്ളുന്ന വ്യാപ്തി മറച്ചുവയ്ക്കുന്നില്ല.
- issue: νόμος എന്നതിന്റെ കൃത്യമായ സൂചന
  choice: ‘ന്യായപ്രമാണം’ എന്നു മാത്രം; കൂടുതൽ നിർവചിക്കുന്നില്ല.
  alternative: ‘മോശെയുടെ ന്യായപ്രമാണം’, ‘രാജകീയ ന്യായപ്രമാണം’, അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ ന്യായപ്രമാണം’
  rationale: യാക്കോബിൽ മുമ്പ് ചർച്ചചെയ്ത ദൈവിക ധാർമ്മികനിയമം, പ്രത്യേകിച്ച് അയൽക്കാരനോടുള്ള സ്നേഹത്തിന്റെ കല്പന, പശ്ചാത്തലമായിരിക്കാം; എന്നാൽ ഈ വാക്യം സൂചനയെ കൃത്യമായി ചുരുക്കുന്നില്ല.
- issue: സഹോദരനെ വിധിക്കുന്നത് ന്യായപ്രമാണത്തെ വിധിക്കുന്നതാകുന്ന ബന്ധം
  choice: മൂലത്തിലെ തീവ്രമായ അവകാശവാദം വിശദീകരണമില്ലാതെ നിലനിർത്തുന്നു.
  alternative: ‘ന്യായപ്രമാണത്തിനു മീതെ സ്വയം സ്ഥാപിക്കുന്നു’ എന്ന വ്യാഖ്യാനപരമായ രൂപം
  rationale: വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വാദക്രമവും വായനക്കാരനുവേണ്ടി മുൻകൂട്ടി പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ‘ദുഷിച്ചു സംസാരിക്കുക’, ‘വിധിക്കുക’, ‘ന്യായപ്രമാണം’ എന്നീ ആവർത്തനങ്ങൾ വാദഘടനയ്ക്കായി ഉദ്ദേശപൂർവം നിലനിർത്തി. അടിക്കുറിപ്പ് [a] ബന്ധപ്പെട്ട പ്രയോഗത്തിനു പിന്നാലെയും [b] വാക്യാവസാനത്തും ചേർത്തിരിക്കുന്നു.
