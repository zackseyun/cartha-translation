revisions:
- from: സഹോദരങ്ങളേ, പരസ്പരം ദുഷിച്ചു സംസാരിക്കരുത്.[a] ഒരു സഹോദരനെ ദുഷിച്ചു സംസാരിക്കുകയോ സ്വന്തം സഹോദരനെ വിധിക്കുകയോ ചെയ്യുന്നവൻ ന്യായപ്രമാണത്തെ ദുഷിച്ചു സംസാരിക്കുകയും ന്യായപ്രമാണത്തെ വിധിക്കുകയും ചെയ്യുന്നു. എന്നാൽ നീ ന്യായപ്രമാണത്തെ വിധിക്കുന്നുവെങ്കിൽ, നീ ന്യായപ്രമാണം അനുഷ്ഠിക്കുന്നവനല്ല, അതിന്റെ വിധികർത്താവാണ്.[b]
  to: സഹോദരങ്ങളേ[b], പരസ്പരം ദുഷിച്ചു സംസാരിക്കരുത്.[a] ഒരു സഹോദരനെ ദുഷിച്ചു സംസാരിക്കുകയോ തന്റെ സഹോദരനെ വിധിക്കുകയോ ചെയ്യുന്നവൻ ന്യായപ്രമാണത്തെ ദുഷിച്ചു സംസാരിക്കുകയും ന്യായപ്രമാണത്തെ വിധിക്കുകയും ചെയ്യുന്നു. എന്നാൽ നീ ന്യായപ്രമാണത്തെ വിധിക്കുന്നുവെങ്കിൽ, നീ ന്യായപ്രമാണം അനുഷ്ഠിക്കുന്നവനല്ല, മറിച്ച് ഒരു വിധികർത്താവാണ്.
  rationale: Footnote b has been moved to ‘സഹോദരങ്ങളേ,’ the term it explains. The final clause is adjusted to avoid adding a possessive absent from the Greek, while retaining the deliberate contrast between one who does the law and a judge. ‘തന്റെ’ replaces ‘സ്വന്തം’ for smoother generic reference without changing the sense.
