  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: ml
  text: ദൈന്യത്തിലാകുവിൻ[a], വിലപിക്കുവിൻ, കരയുവിൻ. നിങ്ങളുടെ ചിരി വിലാപമായും നിങ്ങളുടെ സന്തോഷം വിഷാദമായും[b] മാറട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദുരിതത്തിലാകുവിൻ.” ഗ്രീക്ക് ക്രിയ ദുരിതത്തിലോ ദയനീയാവസ്ഥയിലോ ആകുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “മ്ലാനതയായും.” ഗ്രീക്ക് പദം ദുഃഖത്താൽ തലകുനിഞ്ഞ, വിഷാദഭരിതമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: ദൈന്യത്തിലാകുവിൻ
  rationale: ദുരിതവും ദയനീയാവസ്ഥയും അനുഭവിക്കുന്നതിലേക്കുള്ള ശക്തമായ ആഹ്വാനം നിലനിർത്തുന്നു. തുടർന്നുവരുന്ന ‘വിലപിക്കുക’, ‘കരയുക’ എന്നീ ക്രിയകളുമായി അർഥം ലയിപ്പിക്കാതെ ഗ്രീക്കിലെ ആദ്യ ആജ്ഞയുടെ കാഠിന്യം പകരുന്നു.
- source_word: πενθήσατε
  choice: വിലപിക്കുവിൻ
  rationale: ദുഃഖത്തിന്റെയും അനുതാപത്തിന്റെയും ഭാരം വഹിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം; തുടർന്നുള്ള ശാരീരിക കരച്ചിലിൽനിന്ന് ആശയപരമായി വേറിട്ടുനിൽക്കുന്നു.
- source_word: κλαύσατε
  choice: കരയുവിൻ
  rationale: കണ്ണീരോടെയുള്ള കരച്ചിലിനെ നേരായും സ്വാഭാവികമായും സൂചിപ്പിക്കുകയും ത്രിവിധ ആജ്ഞകളുടെ പുരോഗതി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὁ γέλως ὑμῶν
  choice: നിങ്ങളുടെ ചിരി
  rationale: ഉടമസ്ഥതയും ഗ്രീക്കിലെ മൂർത്തനാമവും നേരിട്ട് പകരുന്ന സ്വാഭാവിക മലയാളം.
- source_word: εἰς πένθος
  choice: വിലാപമായി
  rationale: πενθέω എന്ന മുൻക്രിയയുമായുള്ള പദാർഥബന്ധം നിലനിർത്തുകയും ദുഃഖത്തിന്റെ ഗൗരവം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: μετατραπήτω
  choice: മാറട്ടെ
  rationale: അവസ്ഥാമാറ്റത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ആജ്ഞയുടെ സ്വാഭാവിക മലയാളരൂപം. കർത്തരി-കർമണി വ്യത്യാസം മലയാളത്തിൽ അനാവശ്യമായി കൃത്രിമമാക്കുന്നില്ല.
- source_word: ἡ χαρὰ
  choice: സന്തോഷം
  rationale: സമാന്തരഘടനയിൽ മുൻപുള്ള ‘നിങ്ങളുടെ’ എന്ന ഉടമസ്ഥസൂചന ഇതിനും ബാധകമാകുന്ന വിധത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: εἰς κατήφειαν
  choice: മ്ലാനതയായി
  rationale: തലകുനിഞ്ഞ, ദുഃഖഭരിതമായ അവസ്ഥയെ സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും പ്രകടമാക്കുന്നു; വൈദ്യശാസ്ത്രപരമായ അർഥം അനാവശ്യമായി വരുത്തുന്നില്ല.
theological_decisions:
- issue: അനുതാപത്തിനുള്ള ആഹ്വാനത്തിന്റെ വൈകാരിക കാഠിന്യം
  choice: ആജ്ഞകളെ മൃദൂകരിക്കാതെ ദൈന്യം, വിലാപം, കരച്ചിൽ എന്നീ ശക്തമായ പദങ്ങളിലൂടെ ദുഃഖപൂർണമായ അനുതാപത്തിനുള്ള വിളിയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഗൗരവത്തിലേക്കോ ആത്മസംയമനത്തിലേക്കോ ഉള്ള മൃദുവായ ഉപദേശമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: യാക്കോബ് 4:6–10-ന്റെ പശ്ചാത്തലത്തിൽ ദൈവസന്നിധിയിൽ താഴ്മയോടെയുള്ള അനുതാപമാണ് ആവശ്യപ്പെടുന്നത്. മൂലപാഠത്തിലെ കഠിനമായ ആജ്ഞാഭാവം സംരക്ഷിച്ചു; എന്നാൽ പാഠത്തിൽ ഇല്ലാത്ത സിദ്ധാന്തവിശദീകരണം ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ഗൗരവവും ആജ്ഞാഭാവവും നിലനിർത്തി. ‘ദൈന്യത്തിലാകുവിൻ’ അല്പം ഔപചാരികമാണെങ്കിലും ആദ്യ ഗ്രീക്ക് ക്രിയയുടെ പ്രത്യേക ശക്തി സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ നേരിട്ടുള്ള പകരം നൽകുന്നു. സമാന്തരമായ രണ്ടു മാറ്റങ്ങളും ‘മാറട്ടെ’ എന്ന ഒരേയൊരു ക്രിയയിൽ സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
