id: JAS.4.6
reference: James 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ കൂടുതൽ കൃപ നൽകുന്നു. അതുകൊണ്ട് ഇങ്ങനെ പറയുന്നു[a]: “ദൈവം അഹങ്കാരികളോട് എതിർത്തുനിൽക്കുന്നു; എന്നാൽ താഴ്മയുള്ളവർക്ക് കൃപ നൽകുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതുകൊണ്ട് അവൻ പറയുന്നു,” അല്ലെങ്കിൽ “അതുകൊണ്ട് തിരുവെഴുത്ത് പറയുന്നു.” “പറയുന്നു” എന്ന ക്രിയയുടെ കർത്താവ് ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: അധികമായ
  rationale: μέγας എന്ന പദത്തിന്റെ താരതമ്യരൂപമാണ്; മുൻസന്ദർഭത്തോടുള്ള താരതമ്യബലം നിലനിർത്തിക്കൊണ്ട് കൃപയുടെ വർധിത അളവ് സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δίδωσιν χάριν
  choice: കൃപ നൽകുന്നു
  rationale: ക്രിയയും കർമവും നേരിട്ട് പരിഭാഷപ്പെടുത്തുകയും വാക്യത്തിൽ രണ്ടുതവണ വരുന്ന പ്രയോഗത്തിന്റെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻപ്രസ്താവനയിൽനിന്നുള്ള നിഗമനം വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: λέγει
  choice: ഇങ്ങനെ പറയുന്നു
  rationale: ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല. മലയാളത്തിൽ കർത്താവിനെ ചേർക്കാതെ ഉദ്ധരണിയിലേക്കു നയിക്കുന്ന ഈ രൂപം മൂലത്തിലെ അനിശ്ചിതത്വം പരമാവധി നിലനിർത്തുന്നു.
- source_word: ὑπερηφάνοις
  choice: അഹങ്കാരികളോട്
  rationale: വിശേഷണത്തിന്റെ നാമവാചകപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും അഭിമാനവും ധിക്കാരവും ഉൾക്കൊള്ളുന്ന നൈതിക അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀντιτάσσεται
  choice: എതിർത്തുനിൽക്കുന്നു
  rationale: വെറും പ്രതികരണത്തേക്കാൾ സജീവമായ എതിർപ്പിനെ സൂചിപ്പിക്കുന്ന മധ്യവാചക ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ταπεινοῖς
  choice: താഴ്മയുള്ളവർക്ക്
  rationale: വിശേഷണത്തിന്റെ നാമവാചകപ്രയോഗവും സന്ദർഭത്തിലെ നൈതികമായ താഴ്മയും വ്യക്തമാക്കുന്നു; സാമൂഹിക നില മാത്രം സൂചിപ്പിക്കുന്ന ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: വാക്യത്തിന്റെ തുടക്കത്തിലും ഉദ്ധരണിക്കുള്ളിലും ഉള്ള വൈരുധ്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: λέγει എന്ന ഉദ്ധരണിസൂത്രത്തിലെ കർത്താവ്
  choice: അതുകൊണ്ട് ഇങ്ങനെ പറയുന്നു
  alternative: അതുകൊണ്ട് അവൻ പറയുന്നു; അതുകൊണ്ട് തിരുവെഴുത്ത് പറയുന്നു
  rationale: ഗ്രീക്ക് കർത്താവിനെ പരോക്ഷമായി വിടുന്നു. ദൈവമോ തിരുവെഴുത്തോ എന്നു നിർണയിക്കാതെ കർത്താവില്ലാത്ത മലയാളരൂപം ഉപയോഗിക്കുന്നത് മൂലത്തിലെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഉദ്ധരണിയിലെ സമാന്തരഘടനയും ‘കൃപ നൽകുന്നു’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ ഭാഷ ഒഴിവാക്കി.
