  - severity: low
    issue: The Malayalam question can more explicitly reflect the qualitative force of ποία.
    rationale: “നിങ്ങളുടെ ജീവിതം എന്താണ്?” is possible, but “നിങ്ങളുടെ ജീവിതം എങ്ങനെയുള്ളതാണ്?” more clearly asks what life is like in nature/character without adding interpretation.
