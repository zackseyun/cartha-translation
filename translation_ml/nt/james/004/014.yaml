id: JAS.4.14
reference: James 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: ml
  text: നാളെ എന്ത് സംഭവിക്കുമെന്ന് നിങ്ങൾക്കറിയില്ല. നിങ്ങളുടെ ജീവിതം എങ്ങനെയുള്ളതാണ്? കാരണം, അൽപ്പനേരം മാത്രം പ്രത്യക്ഷമായി പിന്നീട് അപ്രത്യക്ഷമാകുന്ന ഒരു മൂടൽമഞ്ഞാണ് നിങ്ങൾ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നീരാവി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασθε
  choice: അറിയില്ല
  rationale: ഭാവിയെക്കുറിച്ചുള്ള മനുഷ്യരുടെ അറിവില്ലായ്മയെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായും നേരിട്ടും അറിയിക്കുന്നു.
- source_word: τὸ τῆς αὔριον
  choice: നാളെ എന്തു സംഭവിക്കുമെന്ന്
  rationale: ‘നാളെയുടേത്’ എന്ന ഗ്രീക്ക് പ്രയോഗം സന്ദർഭത്തിൽ നാളെ സംഭവിക്കാനിരിക്കുന്ന കാര്യങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: നിങ്ങളുടെ ജീവിതം എന്താണ്?
  rationale: ജീവിതത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള മൂർച്ചയുള്ള ആലങ്കാരിക ചോദ്യം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀτμὶς
  choice: മൂടൽമഞ്ഞ്
  rationale: അല്പനേരം മാത്രം കാണപ്പെട്ടിട്ട് അപ്രത്യക്ഷമാകുന്ന ക്ഷണികമായ ദൃശ്യരൂപം മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു; ‘നീരാവി’ എന്നതും സാധ്യമാണ്.
- source_word: πρὸς ὀλίγον
  choice: അല്പനേരത്തേക്കു
  rationale: വളരെ ചുരുങ്ങിയ സമയദൈർഘ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: φαινομένη
  choice: പ്രത്യക്ഷപ്പെട്ടിട്ട്
  rationale: മൂടൽമഞ്ഞ് കുറച്ചുനേരം ദൃശ്യമാകുന്നതിനെ സജീവവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: പിന്നെ മറഞ്ഞുപോകുന്ന
  rationale: ആദ്യം പ്രത്യക്ഷപ്പെടുകയും തുടർന്ന് അപ്രത്യക്ഷമാകുകയും ചെയ്യുന്ന ക്രമം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യജീവിതത്തിന്റെ ക്ഷണികതയെ ചിത്രീകരിക്കുന്ന രൂപകം
  choice: മൂടൽമഞ്ഞിന്റെ രൂപകം അതേപടി നിലനിർത്തി
  alternative: ‘നിങ്ങളുടെ ജീവിതം ക്ഷണികമാണ്’ എന്ന് വ്യാഖ്യാനാത്മകമായി പറയുക
  rationale: ഭാവിയെക്കുറിച്ചുള്ള മനുഷ്യരുടെ പരിമിതിയും ജീവിതത്തിന്റെ ക്ഷണികതയും വാക്യം രൂപകത്തിലൂടെ പ്രകടമാക്കുന്നു. മരണത്തെയോ ന്യായവിധിയെയോ കുറിച്ചുള്ള അധിക ഉപദേശങ്ങൾ ചേർക്കാതെ ആ സാഹിത്യ-ദൈവശാസ്ത്ര പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, സ്വാഭാവികവും മാന്യവുമായ ശൈലി. γάρ എന്ന വിശദീകരണഭാവം ‘ആണല്ലോ’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പകർന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട രൂപകപദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
