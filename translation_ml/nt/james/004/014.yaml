revisions:
- from: നാളെ എന്തു സംഭവിക്കുമെന്ന് നിങ്ങൾക്കറിയില്ല. നിങ്ങളുടെ ജീവിതം എന്താണ്? അല്പനേരത്തേക്കു പ്രത്യക്ഷപ്പെട്ടിട്ട് പിന്നെ മറഞ്ഞുപോകുന്ന മൂടൽമഞ്ഞ്[a] ആണല്ലോ നിങ്ങൾ.
  to: നാളെ എന്ത് സംഭവിക്കുമെന്ന് നിങ്ങൾക്കറിയില്ല. നിങ്ങളുടെ ജീവിതം എങ്ങനെയുള്ളതാണ്? കാരണം, അൽപ്പനേരം മാത്രം പ്രത്യക്ഷമായി പിന്നീട് അപ്രത്യക്ഷമാകുന്ന ഒരു മൂടൽമഞ്ഞാണ് നിങ്ങൾ[a].
