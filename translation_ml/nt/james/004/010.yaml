  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: ml
  text: കർത്താവിന്റെ സന്നിധിയിൽ[a] നിങ്ങളെത്തന്നെ താഴ്ത്തുക; അവിടുന്ന് നിങ്ങളെ ഉന്നതരാക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കർത്താവിന്റെ മുമ്പാകെ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവിടുന്ന് നിങ്ങളെ ഉയർത്തും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: നിങ്ങളെത്തന്നെ താഴ്ത്തുക
  rationale: അഒറിസ്റ്റ് പാസീവ് ആജ്ഞാരൂപം ഈ ഉപദേശസന്ദർഭത്തിൽ ആത്മവാചക/മധ്യമ ഭാവത്തിൽ ഗ്രഹിക്കാം. സ്വമേധയാ വിനയപ്പെടാനുള്ള ആഹ്വാനം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കാൻ ഈ പ്രയോഗം യോജിക്കുന്നു.
- source_word: ἐνώπιον
  choice: സന്നിധിയിൽ
  rationale: ‘മുമ്പാകെ’ എന്നും ‘സാന്നിധ്യത്തിൽ’ എന്നും അർഥമാകാവുന്ന പദമാണ്. ഇവിടെ ‘സന്നിധിയിൽ’ എന്നത് ബന്ധപരവും സാന്നിധ്യസൂചകവുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: നിർദിഷ്ടനായ κύριος എന്ന പരാമർശം ‘കർത്താവ്’ എന്നു നിലനിർത്തുന്നു; അത് ദൈവത്തെയോ കർത്താവായ യേശുവിനെയോ സൂചിപ്പിക്കുന്നുവെന്ന് വാക്യം നിർബന്ധിക്കുന്നതിലധികം വ്യക്തമാക്കുന്നില്ല.
- source_word: ὑψώσει
  choice: ഉയർത്തും
  rationale: വിനയപ്പെടുന്നതിന് പിന്നാലെയുള്ള മാനവും ഉയർച്ചയും സൂചിപ്പിക്കുന്ന രൂപകാർഥം മലയാളത്തിലെ ‘ഉയർത്തും’ സ്വാഭാവികമായി വഹിക്കുന്നു. ‘ഉന്നതനാക്കും’ എന്ന കൂടുതൽ ഔപചാരികമായ പകരം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന കർമം മലയാളത്തിൽ നേരിട്ട് ‘നിങ്ങളെ’ എന്നു വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പ്രധാനപാഠത്തിൽ ‘കർത്താവ്’ എന്നു മാത്രം നൽകി ഗ്രീക്കിലെ അവ്യക്തത നിലനിർത്തി.
  alternative: ‘ദൈവം’ അല്ലെങ്കിൽ ‘കർത്താവായ യേശു’ എന്നു വ്യക്തമാക്കുക.
  rationale: യാക്കോബിന്റെ ലേഖനത്തിൽ κύριος ദൈവത്തെയും യേശുവിനെയും സൂചിപ്പിക്കാം. ഈ വാക്യത്തിന്റെ തൊട്ടടുത്ത സന്ദർഭം സൂചിതവ്യക്തിയെ നിർബന്ധമായി പരിമിതപ്പെടുത്താത്തതിനാൽ വ്യാഖ്യാനപരമായ അധികവ്യക്തത ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ ആദരസൂചകമായി പരാമർശിക്കാൻ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ ആജ്ഞയും വാഗ്ദാനവും സെമിക്കോളൻകൊണ്ട് വ്യക്തമായി ബന്ധിപ്പിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
