  terminology: ‘കർത്താവ്,’ ‘സന്നിധിയിൽ,’ ‘താഴ്ത്തുക,’ and ‘ഉയർത്തും’ are suitable and theologically non-specifying. ‘അവിടുന്ന്’ is a conventional reverential Malayalam pronoun and does not resolve the referent beyond the Greek.
