id: JAS.4.4
reference: James 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: ml
  text: വ്യഭിചാരിണികളേ,[a] ലോകത്തോടുള്ള[b] സൗഹൃദം ദൈവത്തോടുള്ള ശത്രുതയാണെന്ന് നിങ്ങൾ അറിയുന്നില്ലയോ? അതുകൊണ്ട്, ലോകത്തിന്റെ സുഹൃത്തായിരിക്കാൻ ആഗ്രഹിക്കുന്നവൻ ദൈവത്തിന്റെ ശത്രുവായിത്തീരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘വ്യഭിചാരിണികൾ’ എന്നത് പ്രവാചകഗ്രന്ഥങ്ങളിലെ ഉടമ്പടിഭാഷയെ അനുസ്മരിപ്പിക്കുന്ന, ദൈവത്തോടുള്ള ആത്മീയ അവിശ്വസ്തതയുടെ രൂപകമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ലോകം’ എന്നത് ഇവിടെ ദൈവത്തിനെതിരായി നിലകൊള്ളുന്ന മനുഷ്യരുടെ മൂല്യക്രമത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ദൈവത്തിന്റെ സൃഷ്ടിയെ തന്നെയല്ല.
    reason: cultural_note
  - marker: c
    text: 'അഥവാ: ‘തന്നെത്താൻ ദൈവത്തിന്റെ ശത്രുവാക്കുന്നു.’'
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: വ്യഭിചാരിണികളേ
  rationale: സ്ത്രീലിംഗ ബഹുവചന സംബോധനയുടെ മൂർച്ചയും പ്രവാചകഗ്രന്ഥങ്ങളിലെ ആത്മീയ അവിശ്വസ്തതയുടെ രൂപകസാധ്യതയും നിലനിർത്തുന്നു; ‘അവിശ്വസ്തരേ’ എന്ന വ്യാഖ്യാനപരമായ മൃദൂകരണം ഒഴിവാക്കുന്നു.
- source_word: οὐκ οἴδατε
  choice: നിങ്ങൾ അറിയുന്നില്ലയോ?
  rationale: നിഷേധാത്മകമായ അലങ്കാരചോദ്യത്തിന്റെ നേരിട്ടുള്ള അർത്ഥവും ശാസനാത്മക ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: φιλία τοῦ κόσμου
  choice: ലോകത്തോടുള്ള സൗഹൃദം
  rationale: φιλία എന്ന ബന്ധസൂചക നാമവും തുടർന്നുള്ള φίλος എന്ന പദവുമായുള്ള ശബ്ദാർഥബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: ദൈവത്തോടുള്ള ശത്രുത
  rationale: ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തി ദൈവത്തിനെതിരായ ശത്രുതയെന്നോ ദൈവവുമായുള്ള ശത്രുബന്ധമെന്നോ ഗ്രഹിക്കാവുന്നതിനാൽ, മലയാളത്തിലെ ഈ പ്രയോഗം ആ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ὃς ἐὰν οὖν βουληθῇ
  choice: അതുകൊണ്ട്, ... ആഗ്രഹിക്കുന്നവൻ
  rationale: οὖν-ന്റെ നിഗമനസ്വഭാവവും ἐάν ചേർന്ന അനിശ്ചിത സാമാന്യവാക്യവും βούλομαι-യുടെ മനഃപൂർവമായ ഇച്ഛയും പ്രകടമാക്കുന്നു.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: ലോകത്തിന്റെ സുഹൃത്തായിരിക്കാൻ
  rationale: ‘ലൗകികനായിരിക്കാൻ’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കി, സൗഹൃദം/സുഹൃത്ത് എന്ന മൂലപാഠത്തിലെ ബന്ധം സൂക്ഷിക്കുന്നു.
- source_word: καθίσταται
  choice: തന്നെത്താൻ ... ശത്രുവാക്കുന്നു
  rationale: തിരഞ്ഞെടുത്ത ലോകസൗഹൃദത്തിന്റെ ഫലമായി ഒരാൾ ആ നിലയിൽ സ്വയം സ്ഥാപിക്കുന്നു എന്ന പ്രവർത്തകവും ഫലസൂചകവുമായ ഭാവം നൽകുന്നു; ‘ശത്രുവായിത്തീരുന്നു’ എന്നതും സാധ്യമാണ്.
theological_decisions:
- issue: μοιχαλίδες എന്നതിന്റെ രൂപകാർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘വ്യഭിചാരിണികളേ’ എന്ന വ്യക്തമായ സ്ത്രീലിംഗ സംബോധന നിലനിർത്തി, ആത്മീയ/ഉടമ്പടിപരമായ അവിശ്വസ്തതയുടെ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘അവിശ്വസ്തരേ’ അല്ലെങ്കിൽ ‘വ്യഭിചാരികളായ ജനങ്ങളേ’
  rationale: മൂലപാഠത്തിലെ ഞെട്ടിപ്പിക്കുന്ന രൂപകവും ലിംഗചിഹ്നിത രൂപവും സംരക്ഷിക്കണം; എന്നാൽ അത് ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ലൈംഗിക കുറ്റാരോപണമാത്രമാണെന്ന് നിർബന്ധിക്കരുത്.
- issue: κόσμος എന്നതിന്റെ പരിധി
  choice: മുഖ്യപാഠത്തിൽ ‘ലോകം’ എന്നു തന്നെ വിവർത്തനം ചെയ്യുന്നു.
  alternative: ‘ദൈവത്തിനെതിരായ ലോകവ്യവസ്ഥ’
  rationale: സന്ദർഭത്തിൽ മനുഷ്യരുടെ ദൈവവിരുദ്ധ മൂല്യക്രമമാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്; സൃഷ്ടലോകം തന്നെയല്ല. എങ്കിലും ഈ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് മൂലപാഠത്തെക്കാൾ വ്യാഖ്യാനപരമാകും.
- issue: ἔχθρα τοῦ θεοῦ എന്ന ഷഷ്ഠിവിഭക്തി
  choice: ‘ദൈവത്തോടുള്ള ശത്രുത’
  alternative: ‘ദൈവവുമായുള്ള ശത്രുത’ / ‘ദൈവത്തിനെതിരായ ശത്രുത’
  rationale: ദൈവത്തിനെതിരായ വൈരവും ദൈവവുമായുള്ള ശത്രുബന്ധവും തമ്മിലുള്ള യഥാർഥ വ്യാകരണ-ദൈവശാസ്ത്രപരമായ സംഘർഷം പൂർണമായി അടച്ചുപൂട്ടാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- issue: καθίσταται എന്ന ക്രിയയിലെ പ്രവർത്തകത്വം
  choice: ‘തന്നെത്താൻ ... ശത്രുവാക്കുന്നു’
  alternative: ‘ദൈവത്തിന്റെ ശത്രുവായിത്തീരുന്നു’
  rationale: ലോകത്തിന്റെ സുഹൃത്താകാനുള്ള മനഃപൂർവമായ ആഗ്രഹവുമായി ക്രിയയെ ബന്ധിപ്പിച്ച് ധാർമിക ഉത്തരവാദിത്വം പ്രകടമാക്കുന്നു; അതേസമയം ‘ആയിത്തീരുന്നു’ എന്ന നിലമാറ്റവായനയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വ്യഭിചാരിണികളേ’ എന്ന മൂർച്ചയുള്ള സംബോധനയും ‘സൗഹൃദം/സുഹൃത്ത്’ എന്ന പദബന്ധവും ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
