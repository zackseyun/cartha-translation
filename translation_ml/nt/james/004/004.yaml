revisions:
- from: വ്യഭിചാരിണികളേ,[a] ലോകത്തോടുള്ള സൗഹൃദം ദൈവത്തോടുള്ള ശത്രുതയാണെന്ന് നിങ്ങൾ അറിയുന്നില്ലയോ? അതുകൊണ്ട്,[b] ലോകത്തിന്റെ സുഹൃത്തായിരിക്കാൻ ആഗ്രഹിക്കുന്നവൻ തന്നെത്താൻ ദൈവത്തിന്റെ ശത്രുവാക്കുന്നു.[c]
  to: വ്യഭിചാരിണികളേ,[a] ലോകത്തോടുള്ള[b] സൗഹൃദം ദൈവത്തോടുള്ള ശത്രുതയാണെന്ന് നിങ്ങൾ അറിയുന്നില്ലയോ? അതുകൊണ്ട്, ലോകത്തിന്റെ സുഹൃത്തായിരിക്കാൻ ആഗ്രഹിക്കുന്നവൻ ദൈവത്തിന്റെ ശത്രുവായിത്തീരുന്നു.[c]
  rationale: The revision gives καθίσταται its more direct status/result sense (‘becomes’) in natural modern Malayalam. It retains the draft’s faithful rendering of the marked feminine address and its non-interpretive use of ‘ലോകം,’ while keeping the causative/reflexive English-audit rendering available as an alternative note. Footnote anchors remain complete and are positioned more transparently.
