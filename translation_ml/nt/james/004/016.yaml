  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νῦν δὲ καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν· πᾶσα καύχησις τοιαύτη πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, നിങ്ങളുടെ പൊങ്ങച്ചങ്ങളെക്കുറിച്ച്[a] നിങ്ങൾ മേനി പറയുന്നു. അത്തരത്തിലുള്ള എല്ലാ മേനിപറച്ചിലും തിന്മയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൊങ്ങച്ചങ്ങൾ’ എന്നതിന് ‘അഹങ്കാരപൂർണമായ അവകാശവാദങ്ങൾ,’ ‘വ്യാജമായ ആത്മവിശ്വാസപ്രകടനങ്ങൾ,’ അല്ലെങ്കിൽ ‘പൊങ്ങച്ചമുള്ള അവകാശവാദങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം പൊതുവേ അഹങ്കാരപൂർണമായ പൊങ്ങച്ചമോ വ്യാജപ്രതാപമോ സൂചിപ്പിക്കാം; ഇവിടെ മുൻവാക്യങ്ങളിൽ പറഞ്ഞിരിക്കുന്ന, സ്വന്തം നിയന്ത്രണത്തിലാണെന്ന മട്ടിലുള്ള പദ്ധതികളെയാണ് അത് പ്രത്യേകിച്ച് സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ കർത്താവിനോടുള്ള ആശ്രയഭാവത്തിന് വിപരീതമായ ഇപ്പോഴത്തെ നിലയെ δέയുടെ വൈരുധ്യബലത്തോടുകൂടെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: καυχᾶσθε
  choice: അഭിമാനിക്കുന്നു
  rationale: സ്വയം പുകഴ്ത്തുന്നതോ മേനി പറയുന്നതോ ആയ അർഥം നൽകുന്നു; തുടർന്നുള്ള സമാനപദമായ καύχησις-നോടുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: നിങ്ങളുടെ പൊങ്ങച്ചങ്ങളിൽ
  rationale: ἀλαζονεία എന്നത് അഹങ്കാരപൂർണമായ അവകാശവാദം, പൊങ്ങച്ചം, ആത്മവിശ്വാസപ്രകടനം എന്നിവ സൂചിപ്പിക്കാം. ബഹുവചനം നിലനിർത്തുകയും ‘പദ്ധതികൾ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത ആശയം മുഖ്യവാചകത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: അത്തരത്തിലുള്ള അഭിമാനമെല്ലാം
  rationale: τοιαύτηയുടെ ‘ഈ തരത്തിലുള്ള’ എന്ന ഗുണപരമായ ബലവും πᾶσα നൽകുന്ന പൊതുവായ സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πονηρά
  choice: തിന്മയാണ്
  rationale: ഇവിടെ വെറും മോശം എന്നതിലുപരി ധാർമികമായ അപലപനം ഉള്ളതിനാൽ ‘തിന്മ’ എന്ന പദം യോജിക്കുന്നു.
theological_decisions:
- issue: അപലപിക്കപ്പെടുന്ന അഭിമാനത്തിന്റെ സ്വഭാവം
  choice: കർത്താവിനോടുള്ള വിധേയത്വമില്ലാതെ സ്വന്തം പദ്ധതികളിൽ ഉറപ്പുവെച്ച് പൊങ്ങച്ചം പറയുന്നതാണ് സമീപസന്ദർഭത്തിൽ അപലപിക്കപ്പെടുന്നത്; എന്നാൽ വാക്യത്തിന്റെ പൊതുവായ സമാപനബലം നിലനിർത്തുന്നു.
  alternative: എല്ലാത്തരം ആത്മവിശ്വാസത്തെയും പൊതുവായി അപലപിക്കുന്നു; അല്ലെങ്കിൽ വ്യാപാരപദ്ധതികളെ മാത്രം വളരെ ചുരുങ്ങിയ അർഥത്തിൽ അപലപിക്കുന്നു.
  rationale: യാക്കോബ് 4:13–15 സ്വയം ഉറപ്പിച്ച ഭാവിപദ്ധതികളെക്കുറിച്ചാണ്. എന്നിരുന്നാലും ἀλαζονείαις എന്ന പദത്തെ ‘പദ്ധതികൾ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുന്നത് അതിന്റെ വിശാലമായ അഹങ്കാരപൂർണ അവകാശവാദം എന്ന അർഥം ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പൊങ്ങച്ചങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും ഗ്രീക്ക് ബഹുവചനവും അതിലെ അഹങ്കാരപൂർണ അവകാശവാദത്തിന്റെ ഭാവവും നിലനിർത്തുന്നതുമാണ്.
