  yaml_path: translation/nt/james/005/002.yaml
  text: Your wealth has rotted, and your clothes have become moth-eaten.
translation:
  language: ml
  text: നിങ്ങളുടെ സമ്പത്ത് അഴുകിപ്പോയിരിക്കുന്നു; നിങ്ങളുടെ വസ്ത്രങ്ങൾ പുഴുക്കുത്തേറ്റിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτος
  choice: സമ്പത്ത്
  rationale: ഭൗതികമായി സ്വരൂപിച്ച ധനവും വസ്തുവകകളും ഉൾക്കൊള്ളുന്ന സ്വാഭാവികവും ആധുനികവുമായ പദമാണ്; യാക്കോബിന്റെ ധനികർക്കെതിരായ ശാസനയുടെ പശ്ചാത്തലത്തിനും യോജിക്കുന്നു.
- source_word: σέσηπεν
  choice: അഴുകിപ്പോയിരിക്കുന്നു
  rationale: പൂർണ്ണകാലരൂപം, അഴുകൽ സംഭവിച്ചുകഴിഞ്ഞതും അതിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നതും സൂചിപ്പിക്കുന്നു. ഈ തിരഞ്ഞെടുപ്പ് ദൃശ്യബിംബവും ഫലാവസ്ഥയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ἱμάτια
  choice: വസ്ത്രങ്ങൾ
  rationale: വിവിധതരം ഉടുപ്പുകളെ പൊതുവായി സൂചിപ്പിക്കുന്ന, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ പദം.
- source_word: σητόβρωτα
  choice: പുഴു തിന്നത്
  rationale: വസ്ത്രം തിന്നുന്ന ശലഭപ്പുഴുവാൽ നശിച്ചതെന്ന മൂർത്തമായ ചിത്രം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പൊതുവായ വായനയിൽ ‘പുഴു’ എന്നത് വ്യക്തവും പ്രചാരത്തിലുള്ളതുമാണ്.
- source_word: γέγονεν
  choice: ആയിത്തീർന്നിരിക്കുന്നു
  rationale: വസ്ത്രങ്ങൾ അത്തരമൊരു അവസ്ഥയിലെത്തിയതും ആ ഫലാവസ്ഥ ഇപ്പോൾ നിലനിൽക്കുന്നതും ഗ്രീക്ക് പൂർണ്ണകാലരൂപത്തിന് അനുസരിച്ച് വ്യക്തമാക്കുന്നു.
