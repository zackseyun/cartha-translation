    rationale: It does not naturally predicate moth/insect damage of the clothes and obscures the source’s concise adjectival description, σητόβρωτα (‘moth-eaten’).
  revised_text: നിങ്ങളുടെ സമ്പത്ത് അഴുകിപ്പോയിരിക്കുന്നു; നിങ്ങളുടെ വസ്ത്രങ്ങൾ പുഴുക്കുത്തേറ്റിരിക്കുന്നു.
