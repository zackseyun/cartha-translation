translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സമാന്തരമായ രണ്ട് നാശബിംബങ്ങളും ഗ്രീക്ക് പൂർണ്ണകാല ക്രിയകളുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലാവസ്ഥയും സംരക്ഷിച്ചു.
