id: JAS.5.14
reference: James 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: ml
  text: നിങ്ങളിൽ ആരെങ്കിലും രോഗിയാണോ?[a] അയാൾ സഭയിലെ മൂപ്പന്മാരെ വിളിച്ചുവരുത്തട്ടെ. അവർ കർത്താവിന്റെ നാമത്തിൽ അയാളെ എണ്ണ പുരട്ടി, അയാളുടെ മേൽ പ്രാർഥിക്കട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളിൽ ആരെങ്കിലും ബലഹീനനാണോ?” ഗ്രീക്ക് ക്രിയയ്ക്ക് പൊതുവായ ബലഹീനതയെയും സൂചിപ്പിക്കാം. എന്നാൽ പ്രാർഥന, എണ്ണ പുരട്ടൽ, അടുത്ത വാക്യത്തിലെ സൗഖ്യസന്ദർഭം എന്നിവ കണക്കിലെടുക്കുമ്പോൾ ഇവിടെ രോഗമാണ് കൂടുതൽ സാധ്യതയുള്ള അർഥം.
    reason: lexical_alternative
  - marker: b
    text: എണ്ണ പുരട്ടൽ ഔഷധപരമായോ പ്രതീകാത്മകമായോ ഇവ രണ്ടുമായോ മനസ്സിലാക്കാം; അത് എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്ന് പാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: രോഗിയാണോ
  rationale: പദത്തിന് പൊതുവായി ബലഹീനനായിരിക്കുക എന്ന അർഥവും ഉണ്ടെങ്കിലും, മൂപ്പന്മാരെ വിളിക്കുക, എണ്ണ പൂശുക, പ്രാർഥിക്കുക, തുടർന്നുള്ള വാക്യത്തിലെ സൗഖ്യസന്ദർഭം എന്നിവ ഇവിടെ ശാരീരിക രോഗത്തെ പ്രധാനമായി സൂചിപ്പിക്കുന്നു.
- source_word: τις ἐν ὑμῖν
  choice: നിങ്ങളിൽ ആരെങ്കിലും
  rationale: സമൂഹത്തിനുള്ളിലെ ഏതൊരാളെയും ഉൾക്കൊള്ളുന്ന അനിശ്ചിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: προσκαλεσάσθω
  choice: വിളിച്ചുവരുത്തട്ടെ
  rationale: മൂപ്പന്മാർ തന്റെ അടുക്കൽ വരണമെന്ന് ആവശ്യപ്പെടുന്ന മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞയുടെ ശക്തി വ്യക്തമായി നൽകുന്നു.
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: സഭയിലെ മൂപ്പന്മാരെ
  rationale: ഇവിടെ πρεσβύτεροι പ്രായമേറിയ പുരുഷന്മാരെ പൊതുവായി അല്ല, സഭയിലെ അംഗീകൃത നേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; 'സഭയിലെ' സ്വാഭാവിക മലയാളബന്ധപ്രയോഗമാണ്.
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: അയാളുടെമേൽ പ്രാർഥിക്കട്ടെ
  rationale: ബാധിതന്റെമേൽ നടത്തുന്ന പ്രാർഥന എന്ന ἐπίയുടെ ദിശാസൂചന സംരക്ഷിക്കുകയും ബഹുവചന ആജ്ഞാഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: അയാളെ എണ്ണ പൂശി
  rationale: എണ്ണ ശരീരത്തിൽ പുരട്ടുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി പറയുന്നു; അതിന്റെ ഔഷധപരമോ പ്രതീകാത്മകമോ ആചാരപരമോ ആയ പ്രവർത്തനം വിവർത്തനം തീരുമാനിക്കുന്നില്ല.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: കർത്താവിന്റെ നാമത്തിൽ
  rationale: കർത്താവിന്റെ വ്യക്തിയോടും അധികാരത്തോടുമുള്ള ബന്ധം ഉൾക്കൊള്ളുന്ന ബൈബിൾപ്രയോഗവും θεολογിക ഗൗരവവും സംരക്ഷിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന സ്ഥാനപ്പേരിന്റെ സ്ഥിരവും മാന്യവുമായ മലയാളരൂപം; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വാചകം തന്നെ തുറന്നുവെക്കുന്ന പരിധി ലംഘിക്കുന്നില്ല.
theological_decisions:
- issue: ἀσθενεῖ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: പ്രധാന പാഠത്തിൽ ശാരീരിക രോഗം
  alternative: ബലഹീനത, പൊതുവായ ദൗർബല്യം
  rationale: എണ്ണ പൂശൽ, രോഗിയുടെമേലുള്ള പ്രാർഥന, അടുത്ത വാക്യത്തിലെ എഴുന്നേൽപ്പിക്കൽ എന്നിവ ശാരീരിക രോഗത്തെ ശക്തമായി അനുകൂലിക്കുന്നു; വിശാലമായ പദാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: എണ്ണ പൂശലിന്റെ പ്രവർത്തനം
  choice: പ്രവൃത്തി മാത്രം നിഷ്പക്ഷമായി രേഖപ്പെടുത്തുന്നു
  alternative: ഔഷധപ്രയോഗം മാത്രം, പ്രതീകാത്മക പ്രവൃത്തി മാത്രം, അല്ലെങ്കിൽ ഒരു കൂദാശാകർമം
  rationale: ഗ്രീക്ക് പാഠം എണ്ണ പൂശാൻ പറയുന്നു, എന്നാൽ അതിന്റെ പ്രവർത്തനരീതി വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഒരു സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: ഏകവചന വ്യക്തിസൂചന
  choice: ആരെങ്കിലും ... അയാൾ
  alternative: പൂർണമായും ലിംഗനിഷ്പക്ഷമായ ആവർത്തനരൂപം
  rationale: ആരംഭത്തിലെ τις എല്ലാവരെയും ഉൾക്കൊള്ളുന്നതിനാൽ 'ആരെങ്കിലും' എന്നു നൽകി; തുടർന്നുള്ള ഏകവചന സൂചന സ്വാഭാവിക മലയാളത്തിൽ 'അയാൾ' എന്നു നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. 'മൂപ്പന്മാർ', 'കർത്താവിന്റെ നാമത്തിൽ', 'പ്രാർഥിക്കട്ടെ' എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സ്വാഭാവികമാക്കി. ഗ്രീക്കിലെ പ്രവർത്തനക്രമവും പങ്കാളിക്രിയയും മലയാളത്തിൽ വ്യക്തതയ്ക്കായി 'എണ്ണ പൂശി ... പ്രാർഥിക്കട്ടെ' എന്നു നൽകി.
