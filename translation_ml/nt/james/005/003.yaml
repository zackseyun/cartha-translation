id: JAS.5.3
reference: James 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: ml
  text: നിങ്ങളുടെ സ്വർണവും വെള്ളിയും ക്ഷയിച്ചിരിക്കുന്നു[a]. അവയുടെ ക്ഷയം നിങ്ങൾക്കെതിരായ സാക്ഷ്യമായിത്തീരും; തീപോലെ അത് നിങ്ങളുടെ മാംസം തിന്നും[b]. അന്ത്യനാളുകളിൽ നിങ്ങൾ നിധി ശേഖരിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തുരുമ്പിച്ചിരിക്കുന്നു.’ പൊന്നും വെള്ളിയും അക്ഷരാർഥത്തിൽ തുരുമ്പിക്കാത്തതിനാൽ, ഗ്രീക്ക് ക്രിയയെ ലോഹക്ഷയത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായ പദംകൊണ്ടും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അന്ത്യനാളുകളിൽ നിങ്ങൾ തീപോലെ നിധി ശേഖരിച്ചിരിക്കുന്നു.’ ‘തീപോലെ’ എന്നത് മുൻവാക്യത്തിലെ ‘തിന്നും’ എന്നതിനോടല്ല, അവസാന വാക്യത്തോടാണ് ചിലർ ബന്ധിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: തുരുമ്പിച്ചിരിക്കുന്നു
  rationale: പൂർണകാലരൂപം മുൻപ് സംഭവിച്ച ക്ഷയത്തിന്റെ ഇപ്പോഴത്തെ അവസ്ഥ സൂചിപ്പിക്കുന്നു. പൊന്നിനും വെള്ളിക്കും ശാസ്ത്രീയമായി ‘തുരുമ്പ്’ എന്നു പറയുന്നതിലെ അസ്വാഭാവികത നിലനിൽക്കുന്നെങ്കിലും, യാക്കോബിന്റെ ശക്തമായ ലോഹക്ഷയരൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ὁ ἰὸς αὐτῶν
  choice: അവയുടെ തുരുമ്പ്
  rationale: ലോഹങ്ങളുടെ പശ്ചാത്തലത്തിൽ ἰός ക്ഷയപ്പാടിനെയോ തുരുമ്പിനെയോ സൂചിപ്പിക്കുന്നു; ‘വിഷം’ എന്ന മറ്റർഥം ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: നിങ്ങൾക്കെതിരായ സാക്ഷ്യമായിത്തീരും
  rationale: μαρτύριον എന്ന പദത്തിന്റെ നീതിന്യായപരമായ ‘സാക്ഷ്യം’ എന്ന അർഥവും സന്ദർഭത്തിലെ പ്രതികൂലബലവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: നിങ്ങളുടെ മാംസം തിന്നുകളയും
  rationale: വിധിയുടെ ഞെട്ടിക്കുന്നതും മൂർത്തവുമായ ദൃശ്യരൂപം മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: σάρκας
  choice: മാംസം
  rationale: ഇവിടെ പാപസ്വഭാവമെന്ന സാങ്കേതിക അർഥമല്ല, ശരീരത്തെ ബാധിക്കുന്ന നാശത്തിന്റെ ദൃശ്യമാണ്; അതിനാൽ നേരിട്ടുള്ള ‘മാംസം’ ഉപയോഗിക്കുന്നു.
- source_word: ὡς πῦρ
  choice: തീപോലെ
  rationale: ഏറ്റവും സ്വാഭാവികമായി മുൻവാക്യത്തിലെ ‘തിന്നുകളയും’ എന്ന ക്രിയയെ വിശേഷിപ്പിക്കുന്ന ഉപമയായി എടുത്തിരിക്കുന്നു.
- source_word: ἐθησαυρίσατε
  choice: നിക്ഷേപം കൂട്ടിവെച്ചിരിക്കുന്നു
  rationale: നിധിപോലെ സംഭരിക്കുക എന്ന ക്രിയയുടെ ആശയം നൽകുന്നു. ‘പൂഴ്ത്തിവെച്ചു’ എന്നത് നിഷേധാത്മക ഭാവം കൂടുതൽ ചേർക്കുമെന്നതിനാൽ ഒഴിവാക്കി.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: അന്ത്യനാളുകളിൽ
  rationale: അധികവാക്കുകൾ ചേർക്കാതെ പരിചിതമായ യുഗാന്ത്യപ്രയോഗം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ὡς πῦρ എന്ന പദബന്ധം ഏത് വാക്യഘടകത്തോടാണ് ചേരുന്നത്
  choice: 'മുൻവാക്യത്തോടു ചേർത്ത്: തുരുമ്പ് അവരുടെ മാംസം ‘തീപോലെ’ തിന്നുകളയും.'
  alternative: 'തുടർന്നുള്ള വാക്യത്തോടു ചേർത്ത്: ‘അന്ത്യനാളുകളിൽ നിങ്ങൾ തീപോലെ നിക്ഷേപം കൂട്ടിവെച്ചിരിക്കുന്നു.’'
  rationale: തൊട്ടടുത്തുള്ള φάγεται എന്ന ക്രിയയോടു ചേർക്കുന്നതാണ് വാക്യഘടനയിലും അർഥത്തിലും കൂടുതൽ സ്വാഭാവികം. എങ്കിലും മറ്റൊരു പുരാതനമായി അംഗീകരിക്കപ്പെട്ട ബന്ധസാധ്യത ഉള്ളതിനാൽ അടിക്കുറിപ്പിൽ അത് രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘തുരുമ്പ്,’ ‘സാക്ഷ്യം,’ ‘മാംസം തിന്നുകളയും’ എന്നീ മൂർത്തമായ പ്രവാചകദൃശ്യങ്ങൾ സംരക്ഷിച്ചിരിക്കുന്നു; യഥാർഥമായ വാക്യഘടനാസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
