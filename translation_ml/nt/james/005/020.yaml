id: JAS.5.20
reference: James 5:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: ml
  text: 'അറിയട്ടെ: ഒരു പാപിയെ അവന്റെ തെറ്റായ വഴിയിൽനിന്ന് മടക്കിക്കൊണ്ടുവരുന്നവൻ അവന്റെ പ്രാണനെ[a][b] മരണത്തിൽനിന്ന് രക്ഷിക്കുകയും അനേകം പാപങ്ങളെ മൂടുകയും ചെയ്യും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ ജീവനെ മരണത്തിൽനിന്ന് രക്ഷിക്കും.’ ‘പ്രാണൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് ‘ജീവൻ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ’ എന്നത് മടക്കിക്കൊണ്ടുവരപ്പെടുന്ന പാപിയെ സൂചിപ്പിക്കാം; ചിലർ അത് അവനെ മടക്കിക്കൊണ്ടുവരുന്നവനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: അറിയട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ പ്രബോധനസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἐπιστρέψας
  choice: മടക്കിക്കൊണ്ടുവരുന്നവൻ
  rationale: വഴിതെറ്റിയ ഒരാളെ പഴയ വഴിയിലേക്കു പുനഃസ്ഥാപിക്കുന്ന അർഥം നൽകുന്നു; സാങ്കേതിക മതപരമായ അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: ἁμαρτωλὸν
  choice: ഒരു പാപിയെ
  rationale: നിർദ്ദിഷ്ട വ്യക്തിയെയല്ല, പൊതുവായ വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന അനിർദ്ദിഷ്ട പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: അവന്റെ വഴിതെറ്റലിൽനിന്ന്
  rationale: πλάνη എന്നതിലെ തെറ്റും അലച്ചിലും, ὁδός എന്ന ജീവിതവഴിയുടെ രൂപകവും സ്വാഭാവികമായി ഒരുമിപ്പിക്കുന്നു.
- source_word: σώσει
  choice: രക്ഷിക്കുകയും
  rationale: σῴζω എന്ന ക്രിയയുടെ ഭാവികാല അർഥവും ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- source_word: ψυχὴν αὐτοῦ
  choice: അവന്റെ പ്രാണനെ
  rationale: ψυχήയുടെ ‘പ്രാണൻ/ജീവൻ’ എന്ന വിശാലതയ്ക്ക് ഇടം നൽകുന്നു; αὐτοῦ ആരെ സൂചിപ്പിക്കുന്നു എന്ന അവ്യക്തത മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ θανάτου
  choice: മരണത്തിൽനിന്ന്
  rationale: ശാരീരികമോ ആത്മീയമോ എന്ന് ചുരുക്കാതെ മൂലത്തിലെ വിശാലമായ ‘മരണം’ നിലനിർത്തുന്നു.
- source_word: καλύψει
  choice: മൂടുകയും ചെയ്യും
  rationale: καλύπτωയുടെ നേരിട്ടുള്ള രൂപകവും പാപങ്ങൾ മൂടപ്പെടുന്നു എന്ന ബൈബിൾപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: πλῆθος ἁμαρτιῶν
  choice: പാപങ്ങളുടെ ബാഹുല്യം
  rationale: അനേകം പാപങ്ങൾ എന്ന ആശയവും πλῆθος എന്ന സമാഹാരപദത്തിന്റെ ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ψυχὴν αὐτοῦ എന്നതിലെ αὐτοῦയുടെ പൂർവപദം
  choice: മുഖ്യവാചകത്തിൽ ‘അവന്റെ’ എന്ന് അവ്യക്തമായി നിലനിർത്തി
  alternative: മടക്കിക്കൊണ്ടുവരപ്പെടുന്ന പാപിയുടെ പ്രാണൻ; അല്ലെങ്കിൽ അവനെ മടക്കിക്കൊണ്ടുവരുന്നവന്റെ പ്രാണൻ
  rationale: ഗ്രീക്ക് സർവനാമം വ്യാകരണപരമായി രണ്ടുവിധം മനസ്സിലാക്കാൻ കഴിയുന്നതിനാൽ വിവർത്തനം ഒരു വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- issue: ψυχήയും θάνατοςഉം സൂചിപ്പിക്കുന്ന പരിധി
  choice: ‘പ്രാണൻ’ എന്നും ‘മരണം’ എന്നും വിശാലമായി നിലനിർത്തി
  alternative: ജീവൻ മരണത്തിൽനിന്ന്; അല്ലെങ്കിൽ ആത്മാവ് ആത്മീയമരണത്തിൽനിന്ന്
  rationale: വാക്യം ശാരീരിക ജീവരക്ഷയെയോ ആത്മീയ രക്ഷയെയോ രണ്ടിനെയും ചേർന്നോ സൂചിപ്പിക്കാം; മൂലപാഠം നിർണ്ണയിക്കാത്തത് വിവർത്തനം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മുഖ്യവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട പദസംബന്ധവും സർവനാമസംബന്ധവും ആയ അവ്യക്തതകൾ രേഖപ്പെടുത്തുന്നു.
