id: JAS.5.19
reference: James 5:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀδελφοί ⸀μου, ἐάν τις ἐν ὑμῖν πλανηθῇ ἀπὸ τῆς ἀληθείας καὶ ἐπιστρέψῃ τις αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/james/005/019.yaml
  text: My brothers[a], if anyone among you wanders from the truth and someone turns him back[c][b],
translation:
  language: ml
  text: എന്റെ സഹോദരന്മാരേ[a], നിങ്ങളിൽ ആരെങ്കിലും സത്യത്തിൽനിന്ന് വഴിതെറ്റിപ്പോകുകയും ഒരാൾ അവനെ തിരിച്ചുകൊണ്ടുവരുകയും ചെയ്യുന്നെങ്കിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ സഹോദരീസഹോദരന്മാരേ’; ‘സഹോദരന്മാർ’ എന്ന ഗ്രീക്ക് പുംലിംഗ ബഹുവചന സംബോധനയ്ക്ക് സമൂഹം മുഴുവനെയും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: നേരിട്ടുള്ള സംബോധനയും മൂലത്തിലെ പുംലിംഗ ബഹുവചനരൂപവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിശ്വാസസമൂഹം മുഴുവനും ഉൾപ്പെടാം.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: നിങ്ങളിൽ ആരെങ്കിലും
  rationale: നിബന്ധനാത്മകവും അനിശ്ചിതവുമായ ഏകവചന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πλανηθῇ ἀπὸ τῆς ἀληθείας
  choice: സത്യത്തിൽനിന്ന് വഴിതെറ്റിപ്പോകുകയും
  rationale: ക്രിയയുടെ സന്ദർഭോചിതമായ വഴിതെറ്റൽ എന്ന അർഥം നൽകുന്നു; വഞ്ചിക്കപ്പെടുക എന്ന സാധ്യത പൂർണമായി നിഷേധിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാം.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: മറ്റൊരാൾ അവനെ തിരിച്ചുകൊണ്ടുവരുകയും
  rationale: ἐπιστρέφωയുടെ തിരികെ വരുത്തുക എന്ന കാരണാർഥസാധ്യതയും ഏകവചന പുരുഷസർവനാമവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: സംബോധനയിലെ പുംലിംഗരൂപവും അതിന്റെ ഉൾക്കൊള്ളുന്ന പ്രയോഗവും
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരന്മാരേ’ നിലനിർത്തി ഉൾക്കൊള്ളുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: ഗ്രീക്ക് രൂപം പുംലിംഗ ബഹുവചനമാണെങ്കിലും സമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്യാൻ അതിന് കഴിയുന്നു; മൂലരൂപവും സാധ്യതയുള്ള വിപുലമായ സൂചനയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- issue: πλανηθῇ എന്ന ക്രിയയുടെ കർത്തരി/കർമണി സൂക്ഷ്മത
  choice: വഴിതെറ്റിപ്പോകുക
  alternative: വഴിതെറ്റിക്കപ്പെടുക; വഞ്ചിക്കപ്പെടുക
  rationale: ഈ സന്ദർഭത്തിൽ രൂപത്തിന് വഴിതെറ്റുക എന്ന അകർമക അർഥം സ്വാഭാവികമാണ്; പുറംകാരണത്തെ നിർബന്ധമായി പ്രസ്താവിക്കാതെ യഥാർഥമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: ἐπιστρέψῃ എന്നതിലെ പ്രവർത്തക അർഥം
  choice: തിരിച്ചുകൊണ്ടുവരുക
  alternative: തിരിച്ചുവരുത്തുക; തിരികെ തിരിക്കുക
  rationale: ഒരാൾ വഴിതെറ്റിയ വ്യക്തിയെ മടക്കിക്കൊണ്ടുവരുന്നതാണ് സന്ദർഭം; പ്രത്യേക മാനസാന്തരശാസ്ത്രം പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ അർധവിരാമസ്വഭാവമുള്ള കോമ നിലനിർത്തിയിരിക്കുന്നു.
