id: JAS.5.11
reference: James 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: ml
  text: ഇതാ, സഹിച്ചുനിന്നവരെ നാം ഭാഗ്യവാന്മാർ എന്നു വിളിക്കുന്നു. ഇയ്യോബിന്റെ സഹനത്തെക്കുറിച്ച് നിങ്ങൾ കേട്ടിട്ടുണ്ട്; കർത്താവ് നൽകിയ അന്തിമഫലം നിങ്ങൾ കണ്ടിട്ടുമുണ്ട്—കർത്താവ് അത്യന്തം കരുണാർദ്രനും ദയയുള്ളവനും ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μακαρίζομεν
  choice: നാം ഭാഗ്യവാന്മാർ എന്നു കരുതുന്നു
  rationale: ഒരാളെ അനുഗൃഹീതനോ ഭാഗ്യവാനോ എന്നു വിലയിരുത്തുന്ന അർത്ഥം വ്യക്തമാക്കുന്നു; ആരാധനാപരമായ ‘വാഴ്ത്തുന്നു’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τοὺς ὑπομείναντας
  choice: സഹിച്ചുനിന്നവരെ
  rationale: കഷ്ടതയിൽ ഉറച്ചുനിൽക്കുകയും സഹിച്ചുതീരുകയും ചെയ്തവരെ സൂചിപ്പിക്കുന്ന പൂർത്തിയായ ക്രിയാഭാവം നൽകുന്നു.
- source_word: τὴν ὑπομονὴν Ἰὼβ
  choice: ഇയ്യോബിന്റെ സഹനം
  rationale: ὑπομονή എന്നതിന്റെ കഷ്ടതയ്ക്കിടയിലെ സ്ഥിരതയും സഹിച്ചുനിൽപ്പും ലളിതമായി പകർന്നു നൽകുന്നു.
- source_word: τὸ τέλος κυρίου
  choice: കർത്താവ് വരുത്തിയ പര്യവസാനം
  rationale: τέλος എന്നതിന്റെ ‘അന്ത്യം/ഫലം/പര്യവസാനം’ എന്ന അർത്ഥപരിധിയിൽ, ഇയ്യോബിന്റെ അനുഭവത്തിന് കർത്താവ് നൽകിയ അന്തിമഫലം സൂചിപ്പിക്കുന്നു; ‘ഉദ്ദേശ്യം’ എന്ന് വ്യാഖ്യാനിച്ച് തീർക്കുന്നില്ല.
- source_word: πολύσπλαγχνος
  choice: അത്യന്തം കരുണാർദ്രൻ
  rationale: ആഴമേറിയ, ഹൃദയത്തിൽനിന്നുള്ള സമൃദ്ധമായ കരുണ എന്ന അപൂർവ ഗ്രീക്ക് വിശേഷണത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: οἰκτίρμων
  choice: ദയയുള്ളവൻ
  rationale: കരുണ കാണിക്കുന്ന സ്വഭാവത്തെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: τὸ τέλος κυρίου എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: കർത്താവ് വരുത്തിയ പര്യവസാനം
  alternative: കർത്താവിന്റെ ഉദ്ദേശ്യം
  rationale: ഗ്രീക്കിലെ τέλος നേരിട്ട് ‘ഉദ്ദേശ്യം’ എന്നു നിർബന്ധിക്കുന്നില്ല. ഇയ്യോബിന്റെ കഥയിൽ കർത്താവ് വരുത്തിയ അന്തിമഫലം എന്ന വായനയ്ക്ക് മുൻഗണന നൽകിക്കൊണ്ട് മൂലപാഠത്തിലെ അർത്ഥവ്യാപ്തി അനാവശ്യമായി സിദ്ധാന്തവൽക്കരിക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: κύριος എന്നതിന്റെ സൂചന
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: ഈ വാക്യത്തിൽ κύριος എന്ന ഗ്രീക്ക് പദം തന്നെയാണ് ഉള്ളത്; പ്രത്യേക ദൈവനാമം പാഠത്തിൽ ഇല്ലാത്തതിനാൽ ‘കർത്താവ്’ എന്നു നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഇതാ’ എന്ന ബൈബിൾസഹജമായ ശ്രദ്ധാകർഷണം നിലനിർത്തിയെങ്കിലും ശേഷിച്ച വാക്യം സ്വാഭാവികമായ പ്രവാഹത്തിൽ നൽകിയിരിക്കുന്നു. യഥാർത്ഥ പാഠത്തിൽ വിശദീകരണകുറിപ്പ് അനിവാര്യമല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
