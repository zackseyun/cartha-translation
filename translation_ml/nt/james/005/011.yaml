revisions:
- from: ഇതാ, സഹിച്ചുനിന്നവരെ നാം ഭാഗ്യവാന്മാർ എന്നു കരുതുന്നു. ഇയ്യോബിന്റെ സഹനത്തെക്കുറിച്ച് നിങ്ങൾ കേട്ടിട്ടുണ്ട്; കർത്താവ് വരുത്തിയ പര്യവസാനം നിങ്ങൾ കണ്ടിട്ടുമുണ്ട്—കർത്താവ് അത്യന്തം കരുണാർദ്രനും ദയയുള്ളവനും ആകുന്നു.
  to: ഇതാ, സഹിച്ചുനിന്നവരെ നാം ഭാഗ്യവാന്മാർ എന്നു വിളിക്കുന്നു. ഇയ്യോബിന്റെ സഹനത്തെക്കുറിച്ച് നിങ്ങൾ കേട്ടിട്ടുണ്ട്; കർത്താവ് നൽകിയ അന്തിമഫലം നിങ്ങൾ കണ്ടിട്ടുമുണ്ട്—കർത്താവ് അത്യന്തം കരുണാർദ്രനും ദയയുള്ളവനും ആകുന്നു.
  rationale: The sole revision strengthens the rendering of μακαρίζομεν from ‘consider’ to ‘call,’ preserving the Greek’s declarative force. ‘കർത്താവ് നൽകിയ അന്തിമഫലം’ retains the draft’s contextually warranted ‘outcome’ sense for τὸ τέλος κυρίου while using more natural Malayalam than ‘വരുത്തിയ പര്യവസാനം.’ No footnote is needed because the translation does not force the alternative ‘purpose’ interpretation.
