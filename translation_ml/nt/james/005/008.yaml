lexical_decisions:
- source_word: μακροθυμήσατε
  choice: ക്ഷമയോടെ ഇരിക്കുക
  rationale: പ്രയാസത്തിന്റെയും പ്രകോപനത്തിന്റെയും നടുവിൽ ദീർഘമായി സഹിച്ചുനിൽക്കുക എന്ന കല്പനയാണ്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പ്രയോഗം.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: മുൻവാക്യത്തിൽ നൽകിയ മാതൃകയോടു വായനക്കാരെ ബന്ധിപ്പിക്കുകയും ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: στηρίξατε
  choice: ഉറപ്പിക്കുക
  rationale: സ്ഥിരപ്പെടുത്തുക, ദൃഢമാക്കുക എന്ന അർഥം നൽകുന്നു; ‘ഹൃദയങ്ങൾ’ എന്ന രൂപകത്തോടൊപ്പം ആന്തരിക ധൈര്യവും നിശ്ചയദാർഢ്യവും സൂചിപ്പിക്കുന്നു.
- source_word: τὰς καρδίας ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളെ
  rationale: മനസ്സ്, ഇച്ഛ, ധൈര്യം എന്നിവ ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകം നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള കല്പനകൾക്കുള്ള കാരണം വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ കാരണബന്ധപദം.
- source_word: ἡ παρουσία
  choice: വരവ്
  rationale: παρουσίαയ്ക്ക് ‘സാന്നിധ്യം’ എന്നും ‘വരവ്’ എന്നും അർഥമാകാം; യാക്കോബ് 5:7–8-ലെ ഭാവിമുഖമായ അന്തിമകാല സന്ദർഭത്തിൽ ‘വരവ്’ യോജിക്കുന്നു. പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: ഈ അന്തിമകാല സന്ദർഭത്തിൽ κύριος എന്ന സ്ഥാനനാമത്തിന് മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ തർജമ.
- source_word: ἤγγικεν
  choice: അടുത്തിരിക്കുന്നു
  rationale: ഗ്രീക്ക് perfect രൂപം അടുത്തുവന്നതിന്റെ ഫലമായ നിലവിലെ സമീപസ്ഥിതി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അടുത്തിരിക്കുന്നു’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: കർത്താവിനെക്കുറിച്ചുള്ള അന്തിമകാല പ്രസ്താവനയിൽ παρουσία എന്നതിന്റെ അർഥം
  choice: കർത്താവിന്റെ വരവ്
  alternative: കർത്താവിന്റെ സാന്നിധ്യം
  rationale: παρουσία എന്ന പദത്തിന് രണ്ടു അർഥങ്ങളും സാധ്യമാണെങ്കിലും, യാക്കോബ് 5:7–8-ൽ കാത്തിരിപ്പും ക്ഷമയും ആവശ്യപ്പെടുന്ന ഭാവിമുഖ സന്ദർഭം കർത്താവിന്റെ അന്തിമകാല വരവിനെയാണ് സൂചിപ്പിക്കുന്നത്. എന്നിരുന്നാലും പദത്തിന്റെ ‘സാന്നിധ്യം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഹൃദയങ്ങൾ’ എന്ന ബൈബിൾ രൂപകം നിലനിർത്തി; ഗ്രീക്കിലെ രണ്ടു സമാന്തര കല്പനകളുടെ ഘടന അർധവിരാമങ്ങളിലൂടെ സംരക്ഷിച്ചു.
