id: JAS.5.7
reference: James 5:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: ml
  text: അതുകൊണ്ട്, സഹോദരന്മാരേ[a], കർത്താവിന്റെ വരവ്[b] വരെ ക്ഷമയോടിരിക്കുക. നോക്കൂ, കർഷകൻ ഭൂമിയുടെ വിലയേറിയ വിളവിനായി കാത്തിരിക്കുന്നു; അതിനുവേണ്ടി ക്ഷമയോടെ, മുൻമഴയും പിൻമഴയും ലഭിക്കുന്നതുവരെ കാത്തിരിക്കുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ ഈ സംബോധന പലപ്പോഴും വിശ്വാസിസമൂഹം മുഴുവനെയും ഉദ്ദേശിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘വരവ്’ എന്നതിനുള്ള ഗ്രീക്കുപദത്തിന് ‘സാന്നിധ്യം’ എന്നും അർഥമാകാം; ഇവിടെ കർത്താവിന്റെ ഭാവിയിലെ വരവിനെയാണ് സാധ്യതയേറിയവിധം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘വിളവിന് മുൻമഴയും പിൻമഴയും ലഭിക്കുന്നതുവരെ’ എന്നും മനസ്സിലാക്കാം; ഗ്രീക്കിൽ ‘ലഭിക്കുന്നു’ എന്ന ക്രിയയുടെ കർത്താവ് തുറന്നുപറഞ്ഞിട്ടില്ല, എങ്കിലും സന്ദർഭത്തിൽ കർഷകനാണ് കൂടുതൽ സാധ്യതയുള്ള കർത്താവ്.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Μακροθυμήσατε / μακροθυμῶν
  choice: ക്ഷമയോടിരിക്കുക / ക്ഷമയോടിരിക്കുന്നു
  rationale: ദീർഘകാലം സഹിച്ചുനിൽക്കുന്ന ക്ഷമയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്. ഒരേ ഗ്രീക്ക് പദമൂലത്തിന്റെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻഭാഗത്തെ ആശയത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധന നേരിട്ട് നിലനിർത്തുന്നു; വിശ്വാസിസമൂഹം മുഴുവനെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρουσίας
  choice: വരവ്
  rationale: ഈ ഭാവികാല പ്രതീക്ഷയുടെ സന്ദർഭത്തിൽ കർത്താവിന്റെ വരവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘സാന്നിധ്യം’ എന്ന അടിസ്ഥാനാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἰδοὺ
  choice: നോക്കൂ
  rationale: ഉദാഹരണത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ശക്തി പഴഞ്ചൻ ശൈലിയില്ലാതെ നൽകുന്നു.
- source_word: γεωργὸς
  choice: കർഷകൻ
  rationale: പൊതുവായ കൃഷിക്കാരനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: ἐκδέχεται
  choice: കാത്തിരിക്കുന്നു
  rationale: പ്രതീക്ഷയോടെയുള്ള തുടർച്ചയായ കാത്തിരിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: ഭൂമിയിൽനിന്നുള്ള വിലയേറിയ വിളവ്
  rationale: καρπός എന്ന ദൃശ്യബിംബത്തെ കൃഷിസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘വിളവ്’ എന്നു നൽകുകയും അതിന്റെ മൂല്യവും ഭൂമിയിൽനിന്നുള്ള ഉത്ഭവവും നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πρόϊμον καὶ ὄψιμον
  choice: മുൻമഴയും പിൻമഴയും
  rationale: കൃഷിവർഷത്തിലെ ആദ്യകാലത്തെയും അവസാനകാലത്തെയും മഴകളെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളപ്രയോഗം; ഗ്രീക്കിൽ ‘മഴ’ എന്ന നാമം ഉൾക്കൊള്ളപ്പെട്ടിരിക്കുന്നു.
- source_word: ἐπ’ αὐτῷ ἕως λάβῃ
  choice: അതിനു ... ലഭിക്കുന്നതുവരെ അതിന്റെ കാര്യത്തിൽ
  rationale: സർവനാമവും പറയാത്ത കർത്താവും വിളവിനെ സൂചിപ്പിക്കുന്നതായി മുഖ്യവാചകം വായിക്കുന്നു; കർഷകനെ കർത്താവായി വായിക്കാവുന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന ലിംഗസൂചക സംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ / സഹവിശ്വാസികളേ
  rationale: മൂലവാചകത്തിന്റെ വ്യാകരണരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; ആ കാലഘട്ടത്തിലെ ഈ സംബോധന മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ പറയുന്നു.
- issue: παρουσία τοῦ κυρίου
  choice: കർത്താവിന്റെ വരവ്
  alternative: കർത്താവിന്റെ സാന്നിധ്യം / ആഗമനം
  rationale: സന്ദർഭത്തിലെ ഭാവികാല പ്രതീക്ഷയ്ക്ക് ‘വരവ്’ ഏറ്റവും സ്വാഭാവികമാണ്; പദത്തിന്റെ വിശാലമായ ‘സാന്നിധ്യം’ എന്ന അർഥസാധ്യത മറയ്ക്കുന്നില്ല.
- issue: ἕως λάβῃ എന്നതിലെ പറയാത്ത കർത്താവ്
  choice: വിളവിന് മഴ ലഭിക്കുന്നതുവരെ
  alternative: കർഷകനു മഴ ലഭിക്കുന്നതുവരെ
  rationale: വിളവിനെക്കുറിച്ചുള്ള ക്ഷമയും അതിന്റെ വളർച്ചയ്ക്കാവശ്യമായ മഴയും തമ്മിലുള്ള ബന്ധം മുഖ്യവായനയായി നൽകുന്നു. എന്നാൽ ഗ്രീക്കിൽ കർഷകൻ മുൻവാക്യത്തിന്റെ കർത്താവായതിനാൽ മറുവായനയും സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മുൻമഴയും പിൻമഴയും’ എന്ന കൃഷിസംബന്ധിയായ പ്രയോഗം പാഠത്തിന്റെ ദൃശ്യബിംബം നിലനിർത്തുന്നു. ആദ്യ കല്പനയിലും കർഷകന്റെ ഉദാഹരണത്തിലും μακροθυμ- എന്ന പദമൂലത്തിന്റെ ആവർത്തനം ‘ക്ഷമയോടിരിക്കുക/ക്ഷമയോടിരിക്കുന്നു’ എന്നായി സംരക്ഷിച്ചിട്ടുണ്ട്.
