id: JAS.5.18
reference: James 5:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: ml
  text: അവൻ വീണ്ടും പ്രാർഥിച്ചു; ആകാശം[a] മഴ പെയ്യിച്ചു; ഭൂമി അതിന്റെ ഫലം പുറപ്പെടുവിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വർഗം.’ ഈ സന്ദർഭത്തിൽ ഗ്രീക്കുപദത്തിന് ‘സ്വർഗം’ എന്നും ‘ആകാശം’ എന്നും അർഥമാകാം; കാലാവസ്ഥയെക്കുറിച്ചായതിനാൽ ‘ആകാശം’ എന്നു വിവർത്തനം ചെയ്തു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഭൂമി അതിന്റെ വിളവ് പുറപ്പെടുവിച്ചു’ അല്ലെങ്കിൽ ‘നിലം അതിന്റെ വിളവ് നൽകി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: പ്രാർഥന ആവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപദം.
- source_word: προσηύξατο
  choice: പ്രാർഥിച്ചു
  rationale: ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ ‘തീവ്രമായി’ എന്ന ആശയം ഇവിടെ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ὁ οὐρανὸς
  choice: ആകാശം
  rationale: മഴയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ദൃശ്യമായ ആകാശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സ്വർഗം’ എന്ന ദൈവശാസ്ത്രപരമായ അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: ὑετὸν ἔδωκεν
  choice: മഴ നൽകി
  rationale: ഗ്രീക്കിലെ ‘മഴ നൽകി’ എന്ന രൂപകം നിലനിർത്തുകയും ദൈവിക പ്രവർത്തനത്തെക്കുറിച്ചുള്ള വിശദീകരണം വാക്യത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἡ γῆ
  choice: ഭൂമി
  rationale: ആകാശത്തോടുള്ള സമാന്തരത നിലനിർത്തുന്നു; കൃഷിനിലം എന്ന സന്ദർഭാർഥവും ഉൾക്കൊള്ളാൻ കഴിയുന്നു.
- source_word: ἐβλάστησεν
  choice: പുറപ്പെടുവിച്ചു
  rationale: മുളയ്ക്കുകയും വിളവുണ്ടാകുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയെ, καρπός എന്ന കർമത്തോടൊപ്പം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τὸν καρπὸν αὐτῆς
  choice: അതിന്റെ ഫലം
  rationale: മൂലത്തിലെ ‘അതിന്റെ ഫലം’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് കൃഷിവിളവിനെയും ഉത്പന്നങ്ങളെയും ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ഏലീയാവിന്റെ പ്രാർഥനയ്ക്കുള്ള ദൈവിക പ്രതികരണം
  choice: പ്രാർഥനയ്ക്കു പിന്നാലെ ഉണ്ടായ ദൃശ്യഫലം മാത്രം വാക്യത്തിന്റെ സ്വന്തം ഭാഷയിൽ അവതരിപ്പിച്ചു.
  alternative: ‘ദൈവം മഴ അയച്ചു’ എന്ന് വ്യക്തമായി ചേർക്കുക.
  rationale: സന്ദർഭം ദൈവിക പ്രതികരണം സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യം ആകാശം മഴ നൽകിയെന്നും ഭൂമി ഫലം പുറപ്പെടുവിച്ചെന്നും പറയുന്നു. അതിനാൽ മൂലത്തിൽ വ്യക്തമാക്കാത്ത ദൈവിക കർത്തൃത്വം വിവർത്തനത്തിൽ കൂട്ടിച്ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ തുടർച്ചയായ καί ഘടന വായനാസൗകര്യത്തിനായി അർധവിരാമങ്ങളാൽ അവതരിപ്പിച്ചു; ആകാശവും ഭൂമിയും തമ്മിലുള്ള സമാന്തരതയും മൂലത്തിലെ രൂപകഭാഷയും നിലനിർത്തി.
