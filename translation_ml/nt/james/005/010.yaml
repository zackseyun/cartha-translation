reference: James 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], കഷ്ടതയുടെയും ക്ഷമയുടെയും മാതൃകയായി കർത്താവിന്റെ നാമത്തിൽ സംസാരിച്ച പ്രവാചകന്മാരെ സ്വീകരിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാരേ’ എന്നത് പുല്ലിംഗ ബഹുവചനമായ ἀδελφοί എന്ന പദത്തിന്റെ വിവർത്തനമാണ്; ഇവിടെ യാക്കോബ് സ്ത്രീകളുൾപ്പെടെയുള്ള വിശ്വാസസമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്യുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: മാതൃക
  rationale: അനുകരിക്കേണ്ട ഉദാഹരണം അഥവാ മാതൃക എന്ന അർഥം; ഈ പ്രബോധനസന്ദർഭത്തിൽ ‘മാതൃക’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: λάβετε
  choice: സ്വീകരിക്കുവിൻ
  rationale: ὑπόδειγμα എന്നതോടൊപ്പം ‘മാതൃകയായി സ്വീകരിക്കുക’ എന്ന അർഥം നൽകുന്നു; ഗ്രീക്കിലെ ആജ്ഞാരൂപം നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയെ രൂപപരമായി കൃത്യമായി പകർന്നു; വിശ്വാസസമൂഹം മുഴുവനെയും ഉൾക്കൊള്ളാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κακοπαθίας
  choice: കഷ്ടസഹനം
  rationale: കഷ്ടത അനുഭവിക്കുകയും സഹിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കഷ്ടസഹനം’ വേദനയും അതിന്റെ സഹനവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: μακροθυμίας
  choice: ദീർഘക്ഷമ
  rationale: ദീർഘകാലം ക്ഷമയോടെ നിലനിൽക്കുന്ന മനോഭാവം സൂചിപ്പിക്കുന്നു; μακροθυμίαയുടെ ദൈർഘ്യഘടകം ‘ദീർഘക്ഷമ’യിൽ നിലനിൽക്കുന്നു.
- source_word: τοὺς προφήτας
  choice: പ്രവാചകന്മാരെ
  rationale: മാതൃകയായി സ്വീകരിക്കേണ്ടവരെ നേരിട്ടുള്ള കർമമായി തിരിച്ചറിയിക്കുന്ന ലളിതമായ വിവർത്തനം.
- source_word: ἐλάλησαν
  choice: സംസാരിച്ച
  rationale: λαλέωയുടെ സാധാരണ അർഥമായ ‘സംസാരിക്കുക’ നിലനിർത്തുന്നു; ‘പ്രഘോഷിച്ചു’ പോലുള്ള അധിക ഔപചാരിക ഭാവം ചേർക്കുന്നില്ല.
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: കർത്താവിന്റെ നാമത്തിൽ
  rationale: പ്രതിനിധിത്വവും അധികാരവും സൂചിപ്പിക്കുന്ന ബൈബിൾ പ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന് നിലവാരമുള്ള മലയാള ക്രൈസ്തവ പ്രയോഗമായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: സഭാസമൂഹത്തോടുള്ള ἀδελφοί എന്ന ലിംഗസൂചക സംബോധന
  choice: പ്രധാന പാഠത്തിൽ ‘സഹോദരന്മാരേ’, ഉൾക്കൊള്ളുന്ന പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’ അല്ലെങ്കിൽ ‘സഹോദരങ്ങളേ’
  rationale: ഗ്രീക്കിലെ രൂപം പുല്ലിംഗ ബഹുവചനമാണ്; അതേസമയം ലേഖനസംബോധനയിൽ സ്ത്രീകളടക്കമുള്ള വിശ്വാസസമൂഹം മുഴുവനെയും സൂചിപ്പിക്കാം. രൂപകൃത്യത പ്രധാന പാഠത്തിലും സന്ദർഭപരമായ ഉൾക്കൊള്ളൽ അടിക്കുറിപ്പിലും സൂക്ഷിക്കുന്നു.
- issue: പ്രവാചകന്മാരും ὑπόδειγμα എന്ന പദവും തമ്മിലുള്ള അർഥബന്ധം
  choice: പ്രവാചകന്മാരെ കഷ്ടസഹനത്തിന്റെയും ദീർഘക്ഷമയുടെയും മാതൃകയായി സ്വീകരിക്കുക
  alternative: കഷ്ടസഹനത്തിലും ദീർഘക്ഷമയിലും പ്രവാചകന്മാരെ മാതൃകയാക്കുക
  rationale: ഗ്രീക്കിൽ പ്രവാചകന്മാർ സ്വീകരിക്കേണ്ട മാതൃകയാണ്; ജനിറ്റീവ് പദങ്ങൾ അവർ ഏതു കാര്യത്തിൽ മാതൃകയാണെന്ന് വ്യക്തമാക്കുന്നു. തിരഞ്ഞെടുത്ത രൂപം ഈ ഘടന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ശൈലി. ‘സ്വീകരിക്കുവിൻ’ എന്ന ആജ്ഞാരൂപവും ‘കർത്താവിന്റെ നാമത്തിൽ’ എന്ന സ്ഥാപിത പ്രയോഗവും മൂലപാഠത്തിന്റെ ഘടനയും ഭാവവും കാത്തുസൂക്ഷിക്കുന്നു.
