  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: ml
  text: ഏലിയാവ് നമ്മെപ്പോലെതന്നെ മനുഷ്യസ്വഭാവമുള്ളവനായിരുന്നു.[a] മഴ പെയ്യാതിരിക്കാൻ അവൻ തീവ്രമായി പ്രാർഥിച്ചു; ദേശത്ത് മൂന്നു വർഷവും ആറു മാസവും മഴ പെയ്തില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഏലിയാവ് നമ്മെപ്പോലെ ഒരു മനുഷ്യനായിരുന്നു”; അല്ലെങ്കിൽ, “ഏലിയാവിനും നമ്മുടേതുപോലുള്ള വികാരങ്ങളും അനുഭവങ്ങളും ഉണ്ടായിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠλίας
  choice: ഏലിയാവ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പ്രവാചകന്റെ പേരിന് പരിചിതവും സ്വാഭാവികവുമായ രൂപം.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ഏലിയാവ് സാധാരണ മനുഷ്യനായിരുന്നു എന്ന ഊന്നൽ നിലനിർത്തുകയും അദ്ദേഹത്തിന്റെ പുരുഷലിംഗസൂചന മറയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: നമ്മെപ്പോലെതന്നെ മാനുഷിക സ്വഭാവമുള്ള
  rationale: വികാരങ്ങൾക്കു മാത്രം അർഥം ചുരുക്കാതെ, വായനക്കാരുമായി പങ്കിടുന്ന മനുഷ്യാവസ്ഥയെയും അനുഭവത്തെയും വിശാലമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: προσευχῇ προσηύξατο
  choice: തീക്ഷ്ണമായി പ്രാർഥിച്ചു
  rationale: ഗ്രീക്കിലെ സമാനമൂലപദങ്ങളുടെ ആവർത്തനത്തിലൂടെ ലഭിക്കുന്ന ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: τοῦ μὴ βρέξαι
  choice: മഴ പെയ്യാതിരിക്കേണ്ടതിന്
  rationale: പ്രാർഥനയുടെ അഭ്യർഥിത ഫലമോ ഉദ്ദേശ്യമോ വ്യക്തമാക്കുന്നു; ഗ്രീക്ക് ഘടന അനുവദിക്കുന്ന സൂക്ഷ്മത അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: οὐκ ἔβρεξεν
  choice: മഴ പെയ്തില്ല
  rationale: ഗ്രീക്കിലെ അകർതൃകമായ മഴപ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള സമാനരൂപം.
- source_word: ἐπὶ τῆς γῆς
  choice: ദേശത്ത്
  rationale: ഏലിയാവിന്റെ വരൾച്ചാവിവരണത്തിന്റെ പശ്ചാത്തലത്തിൽ γῆ എന്നത് ആഗോളമായ ‘ഭൂമി’യെക്കാൾ ‘ദേശം’ എന്നു സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: മൂന്നു വർഷവും ആറു മാസവും
  rationale: ദൈർഘ്യത്തെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ഏലിയാവിന്റെ മനുഷ്യത്വവുമായി ബന്ധപ്പെട്ട ὁμοιοπαθὴς എന്ന പദത്തിന്റെ അർഥം
  choice: വായനക്കാരെപ്പോലെ മാനുഷിക സ്വഭാവവും അവസ്ഥയും പങ്കിട്ട സാധാരണ മനുഷ്യനായി ഏലിയാവിനെ അവതരിപ്പിക്കുന്നു.
  alternative: ഏലിയാവിനും നമ്മുടേതുപോലുള്ള വികാരങ്ങളോ അഭിനിവേശങ്ങളോ ഉണ്ടായിരുന്നു.
  rationale: വാക്യത്തിന്റെ പ്രോത്സാഹനപരമായ ഊന്നൽ ഏലിയാവിന്റെ സാധാരണ മനുഷ്യത്വത്തിലാണ്. ‘മാനുഷിക സ്വഭാവമുള്ള’ എന്നത് അർഥത്തെ വികാരങ്ങളിൽ മാത്രം പരിമിതപ്പെടുത്താതെ വിശാലത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘തീക്ഷ്ണമായി പ്രാർഥിച്ചു’ എന്നത് മൂലത്തിലെ ഊന്നൽ പകർത്തുന്നു; ‘ദേശം’ കഥാപശ്ചാത്തലത്തിന് യോജിച്ച പരിധി നിലനിർത്തുന്നു.
