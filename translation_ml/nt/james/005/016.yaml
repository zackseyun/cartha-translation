id: JAS.5.16
reference: James 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: ml
  text: അതിനാൽ, നിങ്ങൾ സൗഖ്യം പ്രാപിക്കേണ്ടതിന് നിങ്ങളുടെ പാപങ്ങൾ പരസ്പരം ഏറ്റുപറയുകയും, ഒരുവർക്കുവേണ്ടി മറ്റൊരുവർ പ്രാർഥിക്കുകയും ചെയ്യുക. നീതിയുള്ള ഒരാളുടെ പ്രാർഥന പ്രവർത്തനനിരതമായിരിക്കുമ്പോൾ വളരെ ശക്തമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘പ്രവർത്തനനിരതമായിരിക്കുന്ന നീതിയുള്ള ഒരാളുടെ അപേക്ഷയ്ക്ക് വലിയ പ്രാബല്യമുണ്ട്.’'
    reason: δέησις എന്നതിന്റെ കൂടുതൽ നിർദിഷ്ടമായ ‘അപേക്ഷ’ എന്ന അർഥവും ἐνεργουμένηയെ വിശേഷണപരമായി അവതരിപ്പിക്കുന്ന മറ്റൊരു സ്വാഭാവിക രൂപവും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: ഏറ്റുപറയുക
  rationale: പാപങ്ങളെ തുറന്നും പരസ്പരവും അംഗീകരിക്കുന്നതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഔപചാരികമോ കൂദാശാപരമോ ആയ ഒരു പ്രത്യേക ക്രമം വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിലെ പ്രാർഥന, പാപം, സൗഖ്യം എന്നിവയിൽനിന്നുള്ള നിഗമനബന്ധം നിലനിർത്തുന്നു.
- source_word: ἀλλήλοις
  choice: പരസ്പരം
  rationale: ആജ്ഞയുടെ അന്യോന്യതയും സമൂഹത്തിനുള്ളിലെ പരസ്പര ഉത്തരവാദിത്വവും ചുരുക്കമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: τὰς ἁμαρτίας
  choice: നിങ്ങളുടെ പാപങ്ങൾ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം പ്രകടമല്ലെങ്കിലും പരസ്പരമുള്ള ആജ്ഞയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘നിങ്ങളുടെ’ ചേർക്കുന്നു; ἁμαρτίας നേരിട്ട് ‘പാപങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: εὔχεσθε ὑπὲρ ἀλλήλων
  choice: പരസ്പരം പ്രാർഥിക്കുക
  rationale: ὑπέρ എന്നതിന്റെ ‘ഒരാൾക്കുവേണ്ടി മറ്റൊരാൾ’ എന്ന മധ്യസ്ഥപ്രാർഥനാഭാവം മലയാളത്തിലെ ‘പരസ്പരം പ്രാർഥിക്കുക’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ὅπως ἰαθῆτε
  choice: സൗഖ്യം പ്രാപിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ὅπωςയും നിഷ്ക്രിയമായ ‘സൗഖ്യം പ്രാപിക്കുക’ എന്ന വിശാല അർഥവും നിലനിർത്തുന്നു; ശാരീരികമോ ആത്മീയമോ എന്നു അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: πολὺ ἰσχύει
  choice: വലിയ ശക്തിയുണ്ട്
  rationale: വലിയ പ്രാബല്യമോ ഫലശേഷിയോ ഉണ്ടെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; നിർദിഷ്ട ഫലം ഉറപ്പാക്കുന്ന രീതിയിൽ അധികവ്യാഖ്യാനം ചെയ്യുന്നില്ല.
- source_word: δέησις
  choice: പ്രാർഥന
  rationale: പ്രത്യേകിച്ച് അപേക്ഷയോ യാചനയോ സൂചിപ്പിക്കാമെങ്കിലും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വിശാല പദമായ ‘പ്രാർഥന’ മുഖ്യവാചകത്തിൽ ഉപയോഗിക്കുന്നു; കൂടുതൽ നിർദിഷ്ടമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: δικαίου
  choice: നീതിമാന്റെ
  rationale: വിശേഷണം നാമവൽക്കരിച്ച ഏകവചനരൂപമാണ്; മലയാളത്തിലെ ഈ പ്രയോഗം പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കാനും ഗ്രീക്കിന്റെ ചുരുക്കം നിലനിർത്താനും കഴിയും.
- source_word: ἐνεργουμένη
  choice: പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: പ്രാർഥന പ്രവർത്തനനിരതമാകുന്നതിനെ സൂചിപ്പിക്കുന്ന വർത്തമാന മധ്യ/നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ ദുഷ്കരത പൂർണമായി ‘തീവ്രമായ’ എന്നോ ‘ഫലപ്രദമായ’ എന്നോ വ്യാഖ്യാനിച്ചു തീർക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ വാക്യം വൈദികരോടുള്ള കൂദാശാപരമായ കുമ്പസാരം നിർബന്ധമാക്കുന്നുവോ, വിശ്വാസികൾ തമ്മിലുള്ള പരസ്പര പാപസമ്മതമാണോ പറയുന്നത്
  choice: പരസ്പരമുള്ള പാപസമ്മതം
  alternative: അഭിഷിക്ത വൈദികൻ മുഖേനയുള്ള കുമ്പസാരം
  rationale: ἀλλήλοις എന്ന അന്യോന്യസർവനാമം അഭിസംബോധന ചെയ്യപ്പെട്ട സമൂഹത്തിലെ പരസ്പരത വ്യക്തമായി സൂചിപ്പിക്കുന്നു. അതിനാൽ പ്രത്യേക സഭാക്രമം വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ἰαθῆτε സൂചിപ്പിക്കുന്ന സൗഖ്യത്തിന്റെ പരിധി
  choice: ശാരീരികവും ആത്മീയവുമായ സാധ്യതകൾ തുറന്നുവെക്കുന്ന ‘സൗഖ്യം പ്രാപിക്കുക’
  alternative: ശാരീരിക രോഗശാന്തി മാത്രം; ആത്മീയ സൗഖ്യം മാത്രം
  rationale: സമീപസന്ദർഭത്തിൽ രോഗം പ്രധാനമാണെങ്കിലും പാപങ്ങളുടെ പരാമർശം അർഥപരിധി വിശാലമാക്കുന്നു. മൂലവാചകത്തിലെ ഈ സംഘർഷം പരിഭാഷ നിലനിർത്തുന്നു.
- issue: δικαίου എന്ന പുരുഷലിംഗ ഏകവചനത്തിന്റെ പൊതുവായ പ്രയോഗം
  choice: നീതിമാന്റെ
  alternative: നീതിയുള്ള പുരുഷന്റെ; നീതിയുള്ള വ്യക്തിയുടെ
  rationale: ഗ്രീക്കിൽ ഇത് സദൃശവാക്യശൈലിയിലുള്ള പൊതുവായ നാമവൽക്കൃത വിശേഷണമാണ്. മലയാളത്തിലെ ‘നീതിമാൻ’ ഈ പരമ്പരാഗത പൊതുവായ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു; പുരുഷന്മാർക്ക് മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: ἐνεργουμένηയുടെ മധ്യ/നിഷ്ക്രിയ ഭാവവും പ്രാർഥനയുടെ ഫലശേഷിയും
  choice: പ്രാർഥന ‘പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുമ്പോൾ’ എന്ന് തുറന്ന നിലയിൽ അവതരിപ്പിക്കുക
  alternative: ഫലപ്രദമായ പ്രാർഥന; ദൈവത്താൽ പ്രവർത്തനക്ഷമമാക്കപ്പെട്ട പ്രാർഥന; തീക്ഷ്ണമായ പ്രാർഥന
  rationale: കൃദന്തരൂപം പ്രാർഥന പ്രവർത്തിക്കുന്നതോ പ്രവർത്തനക്ഷമമാക്കപ്പെടുന്നതോ എന്ന സൂക്ഷ്മത പൂർണമായി പരിഹരിക്കുന്നില്ല. ‘തീക്ഷ്ണമായ’ എന്ന പരിചിത വ്യാഖ്യാനം മൂലപദത്തിൽ നേരിട്ട് ഇല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഏറ്റുപറയുക,’ ‘പരസ്പരം,’ ‘സൗഖ്യം പ്രാപിക്കുക’ തുടങ്ങിയ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ഔപചാരിക കൂദാശാഭാഷയും ‘തീക്ഷ്ണമായ പ്രാർഥന’ പോലുള്ള ഉറവിടത്തിൽ തെളിവില്ലാത്ത പരമ്പരാഗത വ്യാഖ്യാനവും ഒഴിവാക്കി.
