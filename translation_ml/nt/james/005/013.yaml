id: JAS.5.13
reference: James 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κακοπαθεῖ τις ἐν ὑμῖν; προσευχέσθω· εὐθυμεῖ τις; ψαλλέτω.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: ml
  text: നിങ്ങളിൽ ആരെങ്കിലും കഷ്ടം അനുഭവിക്കുന്നുണ്ടോ? പ്രാർത്ഥിക്കട്ടെ. ആരെങ്കിലും സന്തോഷത്തിലാണോ? സ്തുതിഗാനം പാടട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സങ്കീർത്തനങ്ങൾ പാടട്ടെ” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയയ്ക്ക് പ്രത്യേകമായി സങ്കീർത്തനങ്ങൾ പാടുക എന്നോ, കൂടുതൽ വിശാലമായി സ്തുതിഗാനം പാടുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: കഷ്ടം അനുഭവിക്കുന്നുണ്ടോ
  rationale: κακοπαθέω എന്ന ക്രിയ രോഗത്തെയോ പീഡനത്തെയോ മാത്രം സൂചിപ്പിക്കാതെ പൊതുവായി കഷ്ടതയും ദുരിതവും അനുഭവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കഷ്ടം അനുഭവിക്കുക’ ആ വിശാലത നിലനിർത്തുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: τις
  choice: ആരെങ്കിലും
  rationale: അനിശ്ചിത സർവനാമത്തിന്റെ ഏകവചനവും പൊതുവായ പ്രയോഗവും ‘ആരെങ്കിലും’ സ്വാഭാവികമായി അറിയിക്കുന്നു; അത് പുരുഷന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്ന സമൂഹത്തിനുള്ളിലുള്ള ഒരാളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപ്രയോഗമാണിത്.
- source_word: προσευχέσθω
  choice: പ്രാർഥിക്കട്ടെ
  rationale: വർത്തമാനകാല മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞയുടെ പ്രബോധനശക്തി ‘പ്രാർഥിക്കട്ടെ’ നിലനിർത്തുന്നു. മലയാളത്തിൽ കർത്തൃസർവനാമം ആവർത്തിക്കാതെതന്നെ ഇത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: εὐθυμεῖ
  choice: സന്തോഷത്തിലാണോ
  rationale: εὐθυμέω നല്ല മനോനിലയിലോ ഉന്മേഷത്തിലോ ആയിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സന്തോഷത്തിലാണോ’ കഷ്ടം അനുഭവിക്കുന്ന അവസ്ഥയോടുള്ള വൈരുധ്യം ലളിതമായി അറിയിക്കുകയും അനാവശ്യമായി ലിംഗസൂചന വരുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ψαλλέτω
  choice: സ്തുതിഗാനം പാടട്ടെ
  rationale: ഈ സന്ദർഭത്തിൽ ψάλλω ദൈവത്തോടുള്ള ഗാനരൂപത്തിലുള്ള സ്തുതിയെ സൂചിപ്പിക്കുന്നു. ‘സ്തുതിഗാനം പാടട്ടെ’ എന്നത് ഭക്തിപരമായ അർഥം വ്യക്തമായി നൽകുന്നു; ‘സങ്കീർത്തനങ്ങൾ പാടുക’ എന്ന കൂടുതൽ നിർദിഷ്ട സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൊതുവായ പ്രബോധനത്തിലെ ഏകവചനരൂപം
  choice: ‘ആരെങ്കിലും’ എന്ന ഏകവചനത്തോടൊപ്പം കർത്തൃസർവനാമമില്ലാത്ത ഏകവചന പ്രബോധനരൂപങ്ങൾ ഉപയോഗിക്കുക
  alternative: ‘അയാൾ പ്രാർഥിക്കട്ടെ … അയാൾ പാടട്ടെ’ അല്ലെങ്കിൽ ബഹുവചനരൂപം ഉപയോഗിക്കുക
  rationale: ഗ്രീക്കിലെ τις എന്ന ഏകവചന അനിശ്ചിത സർവനാമവും മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞകളും നിലനിർത്തുന്നു. മലയാളത്തിൽ കർത്താവിനെ ആവർത്തിക്കാതിരിക്കുന്നത് സ്വാഭാവികമാണ്; അതോടൊപ്പം പുരുഷന്മാർക്കു മാത്രമായുള്ള പ്രയോഗമെന്ന തെറ്റിദ്ധാരണയും ഒഴിവാക്കുന്നു.
- issue: ψαλλέτω എന്നതിന്റെ അർഥം
  choice: സ്തുതിഗാനം പാടട്ടെ
  alternative: സങ്കീർത്തനങ്ങൾ പാടട്ടെ; ഈണം മീട്ടട്ടെ
  rationale: ക്രിയയ്ക്ക് സങ്കീർത്തനങ്ങൾ പാടുക എന്ന പ്രത്യേക ചരിത്രപരമായ അർഥം ഉണ്ടായേക്കാമെങ്കിലും, ഇവിടെ വിശാലമായ ദൈവസ്തുതി എന്ന അർഥം സന്ദർഭത്തിന് യോജിച്ചതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്. കൂടുതൽ നിർദിഷ്ടമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ രണ്ടു സമാന്തര ചോദ്യങ്ങളുടെയും രണ്ടു ഏകവചന പ്രബോധനങ്ങളുടെയും ചുരുക്കവും താളവും നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ [a] ‘pray’ എന്നതിന് ശേഷം വന്നിരുന്നെങ്കിലും, അടിക്കുറിപ്പ് ψαλλέτω എന്ന ക്രിയയെക്കുറിച്ചായതിനാൽ ഉറവിടസാക്ഷ്യത്തിന് അനുസരിച്ച് അടയാളം ‘സ്തുതിഗാനം പാടട്ടെ’ എന്നതിന് ശേഷം ചേർത്തിരിക്കുന്നു.
