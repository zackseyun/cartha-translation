revisions:
- from: വിശ്വാസത്തിന്റെ പ്രാർഥന[c] രോഗിയായവനെ രക്ഷിക്കും[a]; കർത്താവ് അവനെ എഴുന്നേല്പിക്കും. അവൻ പാപങ്ങൾ ചെയ്തിട്ടുണ്ടെങ്കിൽ[b], അവന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെടും.
  to: വിശ്വാസത്തിന്റെ പ്രാർത്ഥന[c] രോഗിയായവനെ രക്ഷിക്കും[a]; കർത്താവ് അവനെ എഴുന്നേൽപ്പിക്കും. അവൻ പാപങ്ങൾ ചെയ്തിട്ടുണ്ടെങ്കിലും[b], അവന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെടും.
  rationale: The revision preserves the draft’s source-faithful lexical choices while making the κἄν clause explicitly concessive, as the Greek construction permits and most naturally suggests. It also standardizes spelling and improves the idiom of the explanatory footnote. The passive forgiveness statement remains impersonal, preserving the Greek’s unstated divine agent and avoiding any claim that sickness is invariably caused by sin.
