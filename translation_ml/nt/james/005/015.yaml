id: JAS.5.15
reference: James 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: ml
  text: വിശ്വാസത്തിന്റെ പ്രാർത്ഥന[c] രോഗിയായവനെ രക്ഷിക്കും[a]; കർത്താവ് അവനെ എഴുന്നേൽപ്പിക്കും. അവൻ പാപങ്ങൾ ചെയ്തിട്ടുണ്ടെങ്കിലും[b], അവന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൗഖ്യമാക്കും’ അല്ലെങ്കിൽ ‘സുഖപ്പെടുത്തും’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്കിൽ ‘രക്ഷിക്കും.’
    reason: lexical_alternative
  - marker: b
    text: ‘അവൻ പാപങ്ങൾ ചെയ്തിട്ടുണ്ടെങ്കിൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ‘വിശ്വാസത്തിന്റെ പ്രാർത്ഥന’ എന്നത് ദൈവത്തിലുള്ള വിശ്വാസമോ ആശ്രയമോ കൊണ്ട് സവിശേഷമാകുന്ന പ്രാർത്ഥന എന്ന അർഥത്തിലാകാം; ഇവിടെ സാധ്യത കുറവാണെങ്കിലും ‘വിശ്വസ്തത’ എന്ന അർഥവും ഈ പദത്തിനുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: പ്രാർഥന
  rationale: മുൻവാക്യത്തിൽ സഭാമൂപ്പന്മാർ രോഗിക്കുവേണ്ടി പ്രാർഥിക്കുന്നതാണ് സന്ദർഭം; അതിനാൽ ഇവിടെ ‘നേർച്ച’ എന്നതിനെക്കാൾ ‘പ്രാർഥന’യാണ് യോജിച്ച അർഥം.
- source_word: πίστεως
  choice: വിശ്വാസത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തി ബന്ധം നിലനിർത്തുകയും, ദൈവത്തിലുള്ള വിശ്വാസം/ആശ്രയംകൊണ്ട് സവിശേഷമാകുന്ന പ്രാർഥന എന്ന പ്രധാന അർഥം ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു.
- source_word: σώσει
  choice: രക്ഷിക്കും
  rationale: σῴζω എന്ന ക്രിയയുടെ വിശാലമായ ‘രക്ഷിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; രോഗസന്ദർഭത്തിൽ സൗഖ്യമാക്കുക എന്ന അർഥവും ഇതിൽ സജീവമാണ്.
- source_word: τὸν κάμνοντα
  choice: രോഗിയായവനെ
  rationale: κάμνω ക്ഷീണിക്കുക എന്നും രോഗിയായിരിക്കുക എന്നും അർഥമാക്കാം; അഭിഷേകം, രോഗാവസ്ഥ, എഴുന്നേല്പിക്കൽ എന്നിവയുള്ള അടുത്ത സന്ദർഭത്തിൽ രോഗിയായ വ്യക്തിയാണ് ഉദ്ദേശ്യം.
- source_word: ἐγερεῖ
  choice: എഴുന്നേല്പിക്കും
  rationale: ἐγείρωയുടെ ദൃശ്യബിംബം നിലനിർത്തുന്നു; ഇവിടെ രോഗക്കിടക്കയിൽനിന്നുള്ള പുനഃസ്ഥാപനമാണ് പ്രാഥമിക സൂചന, എന്നാൽ ദൈവിക പുനഃസ്ഥാപനത്തിന്റെ വിശാല അനുരണനവും നഷ്ടപ്പെടുന്നില്ല.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പുതിയനിയമത്തിലെ κύριος എന്ന ദൈവിക അഭിസംബോധനയ്ക്കുള്ള സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാള പദം.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: അവൻ പാപങ്ങൾ ചെയ്തിട്ടുണ്ടെങ്കിൽ
  rationale: നിബന്ധനാപരമായ ആശയം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ചെയ്തിട്ടുണ്ടെങ്കിൽപോലും’ എന്ന concessive അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀφεθήσεται αὐτῷ
  choice: അവന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെടും
  rationale: ദൈവിക കർതൃത്വം വെളിപ്പെടുത്താതെ ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു; മലയാളത്തിൽ ആശയം പൂർണവും സ്വാഭാവികവുമാക്കാൻ ക്ഷമിക്കപ്പെടുന്നത് പാപങ്ങളാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: σώσει എന്നത് ശാരീരിക സൗഖ്യമായി മാത്രം വിവർത്തനം ചെയ്യണോ, വിശാലമായ രക്ഷ/പുനഃസ്ഥാപന അർഥം നിലനിർത്തണോ
  choice: പ്രധാനപാഠത്തിൽ ‘രക്ഷിക്കും’
  alternative: ‘സൗഖ്യമാക്കും’ അല്ലെങ്കിൽ ‘സുഖപ്പെടുത്തും’
  rationale: രോഗമാണ് ഉടൻപ്രസക്തമായ സന്ദർഭമെങ്കിലും, യാക്കോബ് കൂടുതൽ വിശാലമായ σῴζω എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്. ‘രക്ഷിക്കും’ എന്നത് ആ പദത്തിന്റെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് ശാരീരിക സൗഖ്യത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- issue: ഈ വാക്യം പ്രാർഥനയിലൂടെ എല്ലാ സാഹചര്യത്തിലും യാന്ത്രികമായി സൗഖ്യം ഉറപ്പുനൽകുന്നു എന്നു വ്യാഖ്യാനിക്കണോ
  choice: ഗ്രീക്കിലെ ഭാവികാല പ്രസ്താവനകൾ വിശദീകരണപരമായ നിയന്ത്രണങ്ങളില്ലാതെ നേരിട്ട് നിലനിർത്തി
  alternative: ‘സൗഖ്യമാക്കാം’ എന്ന ദുർബലീകരണമോ ‘എല്ലാ സാഹചര്യത്തിലും തീർച്ചയായും സൗഖ്യമാക്കും’ എന്ന വിപുലീകരണമോ
  rationale: മൂലപാഠത്തിന്റെ ശക്തി കുറയ്ക്കാതെയും അതിലില്ലാത്ത സമ്പൂർണ സൗഖ്യസിദ്ധാന്തം ചേർക്കാതെയും നേരിട്ടുള്ള വാഗ്ദാനം വിവർത്തനം ചെയ്യുന്നു.
- issue: രോഗം എല്ലായ്പ്പോഴും വ്യക്തിപരമായ പാപത്തിന്റെ ഫലമാണെന്ന് വാക്യം സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘പാപങ്ങൾ ചെയ്തിട്ടുണ്ടെങ്കിൽ’ എന്ന നിബന്ധനാപരമായ ഘടന
  alternative: എല്ലാ രോഗത്തിനും വ്യക്തിപരമായ പാപം കാരണമാണെന്ന സൂചന
  rationale: പാപത്തെ ഗ്രീക്ക് സാധ്യമായ ഒരു ഘടകമായാണ് അവതരിപ്പിക്കുന്നത്, സർവസാധാരണ കാരണമായി അല്ല. നിബന്ധന നിലനിർത്തുന്നത് ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: πίστεως എന്ന ഷഷ്ഠീവിഭക്തി എങ്ങനെ മനസ്സിലാക്കണം
  choice: ‘വിശ്വാസത്തിന്റെ പ്രാർഥന’ എന്ന ഘടന നിലനിർത്തി
  alternative: ‘വിശ്വാസത്തോടെയുള്ള പ്രാർഥന’, ‘ആശ്രയപൂർവമായ പ്രാർഥന’, അല്ലെങ്കിൽ സാധ്യത കുറവുള്ള ‘വിശ്വസ്തതയുടെ പ്രാർഥന’
  rationale: മൂലത്തിലെ ബന്ധത്തിന്റെ സംക്ഷിപ്തതയും ചെറിയ അർഥവൈവിധ്യവും നിലനിർത്തുന്നു; പ്രധാന സന്ദർഭാർഥം ദൈവത്തിലുള്ള വിശ്വാസം/ആശ്രയംകൊണ്ട് സവിശേഷമാകുന്ന പ്രാർഥനയാണ്.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘രക്ഷിക്കും’, ‘എഴുന്നേല്പിക്കും’, ‘ക്ഷമിക്കപ്പെടും’ എന്നീ പദങ്ങൾ മൂലത്തിലെ പദബിംബങ്ങളും ദൈവിക കർതൃത്വം സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു; അനാവശ്യ സഭാവിഭാഗീയ വ്യാഖ്യാനം ഒഴിവാക്കി.
