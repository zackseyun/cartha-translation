  text: κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: ml
  text: നിങ്ങൾ നീതിമാനെ[a] കുറ്റം വിധിക്കുകയും കൊലപ്പെടുത്തുകയും ചെയ്തു. അവൻ നിങ്ങളെ എതിർക്കുന്നില്ലേ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതിമാൻ’ എന്നത് സമ്പന്നർ പീഡിപ്പിക്കുന്ന ഒരു പ്രതിനിധിയായ നീതിമാനെ സൂചിപ്പിക്കാം. എന്നാൽ യേശുവിനുള്ള ‘നീതിമാൻ’ എന്ന വിശേഷണപ്പേരിന്റെ ഒരു പരോക്ഷപ്രതിധ്വനിയായി ചിലർ ഇതിനെ കാണുന്നു.
    reason: alternative_reading
  - marker: b
    text: 'ഗ്രീക്ക് പാഠം ഇതിനെ ചോദ്യമായി ചിഹ്നപ്പെടുത്തുന്നു: ‘അവൻ നിങ്ങളെ എതിർക്കുന്നില്ലേ?’ സന്ദർഭത്തിൽ ചിലർ ഇതിനെ ‘അവൻ നിങ്ങളെ എതിർക്കുന്നില്ല’ എന്ന പ്രസ്താവനയായും മനസ്സിലാക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδικάσατε
  choice: നിങ്ങൾ ... കുറ്റംവിധിച്ചു
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള aorist ക്രിയയുടെ ന്യായവിധിസംബന്ധമായ ശക്തി ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐφονεύσατε
  choice: കൊലപ്പെടുത്തി
  rationale: φονεύω എന്നത് വെറും ‘കൊന്നു’ എന്നതിലുപരി അന്യായമായ വധത്തിന്റെ ധാർമിക ഗൗരവം വഹിക്കുന്നതിനാൽ ‘കൊലപ്പെടുത്തി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τὸν δίκαιον
  choice: നീതിമാനെ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ഏകവചന പുല്ലിംഗ വിശേഷണം ഇവിടെ നാമമായി പ്രവർത്തിക്കുന്നു. ‘നീതിമാൻ’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഒരു പ്രതിനിധിയായ നീതിമാനെയും സാധ്യതയുള്ള വിശേഷണപ്പേരിനെയും തുറന്നുവെക്കുന്നു.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: അവൻ നിങ്ങളെ എതിർക്കുന്നില്ല
  rationale: ἀντιτάσσομαι എന്നതിന്റെ ‘സ്വയം എതിർത്തുനിൽക്കുക/എതിർക്കുക’ എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു. ഗ്രീക്ക് പാഠത്തിലെ ചോദ്യരൂപത്തിന്റെ ഉദ്ദേശിക്കപ്പെടാവുന്ന നിഷേധാത്മക അർഥം മുഖ്യപാഠത്തിൽ പ്രസ്താവനയായി അവതരിപ്പിക്കുകയും മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘നീതിമാൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: സമ്പന്നരുടെ പീഡനത്തിന് ഇരയായ പ്രതിനിധിയായ ഒരു നീതിമാനെ മുഖ്യപാഠം തുറന്ന നിലയിൽ സൂചിപ്പിക്കുന്നു.
  alternative: ‘നീതിമാൻ’ എന്ന വിശേഷണപ്പേരോടെ യേശുവിനെ പരോക്ഷമായി സൂചിപ്പിക്കുന്നതാകാം.
  rationale: അടുത്തുള്ള സന്ദർഭം സമ്പന്നർ നീതിമാന്മാരായ ദരിദ്രരെ പീഡിപ്പിക്കുന്നതിനെക്കുറിച്ചാണ്; എങ്കിലും ഏകവചനവും ‘നീതിമാൻ’ എന്ന പ്രയോഗവും ക്രിസ്തുവിനെക്കുറിച്ചുള്ള ഒരു പ്രതിധ്വനി സാധ്യമാക്കുന്നു. പരിഭാഷ ഏതെങ്കിലും ഒറ്റ വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- issue: അവസാന ഉപവാക്യത്തിന്റെ വാക്യഭാവം
  choice: ‘അവൻ നിങ്ങളെ എതിർക്കുന്നില്ല’ എന്ന പ്രസ്താവന
  alternative: ‘അവൻ നിങ്ങളെ എതിർക്കുന്നില്ലേ?’ എന്ന ചോദ്യം
  rationale: SBLGNT ഇതിനെ ചോദ്യമായി ചിഹ്നപ്പെടുത്തുന്നു; οὐκ ഉള്ള ചോദ്യം സാധാരണയായി അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്നതായും വായിക്കാം. എന്നാൽ സന്ദർഭത്തിൽ പ്രതിരോധിക്കാത്ത നീതിമാനെക്കുറിച്ചുള്ള പ്രസ്താവനയായും ഇത് വ്യാപകമായി മനസ്സിലാക്കപ്പെടുന്നു. അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. കുറ്റാരോപണത്തിന്റെ മൂർച്ച നിലനിർത്താൻ ‘കുറ്റംവിധിച്ചു, കൊലപ്പെടുത്തി’ എന്ന സമാന്തര ക്രിയകൾ ഉപയോഗിച്ചു. ‘നീതിമാൻ’ ബൈബിള്‍സംബന്ധമായ ഭാരം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദമാണ്.
