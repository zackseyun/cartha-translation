review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the priority marker, prohibition on oath-taking, the heaven/earth/other-oath sequence, and the broad sense of κρίσις. A small revision makes the final purpose clause more explicitly dependent on the preceding exhortation and renders the repeated Ναί/Οὔ more naturally in modern Malayalam.
  naturalness: Most wording is clear and suitably formal. “നിങ്ങളുടെ ‘അതേ’ അതേ എന്നും ‘അല്ല’ അല്ല എന്നും ആയിരിക്കട്ടെ” is understandable but somewhat strained; using adjectival forms (‘അതേ’യായും, ‘അല്ല’യായും) better expresses the proverbial Greek construction. “ചൊല്ലി ആണയിടരുത്” is a natural Malayalam expression for swearing by something.
  terminology: “ആണയിടരുത്” accurately identifies oath-taking rather than profanity. “ന്യായവിധി” appropriately preserves the breadth of κρίσις. The alternative “ശിക്ഷാവിധി” can imply punishment rather than condemnation; “കുറ്റവിധി” is a closer Malayalam alternative for the stronger reading.
  issues:
  - severity: low
    issue: The repeated yes/no construction is slightly unnatural in the draft.
    rationale: The Greek predicates each response of itself. Malayalam ‘നിങ്ങളുടെ “അതേ” “അതേ”യായും “അല്ല” “അല്ല”യായും ഇരിക്കട്ടെ’ expresses this relationship more idiomatically while retaining the repetition.
  - severity: low
    issue: The final clause is rendered as an independent wish-like clause.
    rationale: Rendering ἵνα with ‘വീഴാതിരിക്കേണ്ടതിന്’ makes its purpose relationship to the command explicit.
  - severity: low
    issue: The footnote alternative ‘ശിക്ഷാവിധി’ is not the closest equivalent of ‘condemnation.’
    rationale: ‘കുറ്റവിധി’ more directly conveys a condemnatory verdict while leaving the main text’s broader ‘ന്യായവിധി’ unchanged.
  revised_text: എന്നാൽ എല്ലാറ്റിനുമുപരി, എന്റെ സഹോദരന്മാരേ[a], സ്വർഗത്തെയോ ഭൂമിയെയോ മറ്റേതെങ്കിലും ശപഥത്തെയോ ചൊല്ലി ആണയിടരുത്. പകരം, നിങ്ങളുടെ ‘അതേ’ ‘അതേ’യായും ‘അല്ല’ ‘അല്ല’യായും ഇരിക്കട്ടെ; നിങ്ങൾ ന്യായവിധിക്കു കീഴിൽ വീഴാതിരിക്കേണ്ടതിന്.[b]
