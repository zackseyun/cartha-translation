id: JAS.5.12
reference: James 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: ml
  text: എന്നാൽ എല്ലാറ്റിനുമുപരി, എന്റെ സഹോദരന്മാരേ[a], സ്വർഗത്തെയോ ഭൂമിയെയോ മറ്റേതെങ്കിലും ശപഥത്തെയോ ചൊല്ലി ആണയിടരുത്. പകരം, നിങ്ങളുടെ ‘അതേ’ ‘അതേ’യായും ‘അല്ല’ ‘അല്ല’യായും ഇരിക്കട്ടെ; നിങ്ങൾ ന്യായവിധിക്കു കീഴിൽ വീഴാതിരിക്കേണ്ടതിന്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ സഹോദരന്മാരും സഹോദരിമാരും’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ വിശ്വാസിസമൂഹം മുഴുവനും ഉദ്ദേശിക്കപ്പെടാൻ സാധ്യതയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കുറ്റവിധിക്കു കീഴിൽ വീഴാതിരിക്കേണ്ടതിന്.’
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: എല്ലാറ്റിനുമുപരി
  rationale: മുഖ്യപ്രാധാന്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοί μου
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ ബഹുവചനരൂപം നിലനിർത്തുന്നു; വിശ്വാസിസമൂഹം മുഴുവനും ഉദ്ദേശിക്കപ്പെടാൻ സാധ്യതയുണ്ടെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μὴ ὀμνύετε
  choice: ആണയിടരുത്
  rationale: ഇവിടെ വിഷയം അസഭ്യവാക്കല്ല, ശപഥം ചെയ്ത് ഉറപ്പുനൽകുന്നതാണ്; ‘ആണയിടുക’ അത് മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν
  choice: സ്വർഗത്തെക്കൊണ്ടോ ഭൂമിയെക്കൊണ്ടോ
  rationale: സൃഷ്ടവസ്തുക്കളെ സാക്ഷിയാക്കി ആണയിടുന്നതിന്റെ അർഥം മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയഘടനയിൽ നൽകുന്നു.
- source_word: μήτε ἄλλον τινὰ ὅρκον
  choice: മറ്റേതെങ്കിലും ശപഥംകൊണ്ടോ
  rationale: നിരോധനത്തിന്റെ സമഗ്രതയും ὅρκον എന്ന പദത്തിന്റെ ശപഥസംബന്ധമായ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: പകരം, നിങ്ങളുടെ ‘അതേ’ അതേ എന്നും ‘അല്ല’ അല്ല എന്നും ആയിരിക്കട്ടെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും പഴഞ്ചൊല്ലുസദൃശവുമായ ആവർത്തനം നിലനിർത്തിക്കൊണ്ട് വൈരുധ്യസൂചകമായ δέ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: അങ്ങനെ നിങ്ങൾ ന്യായവിധിക്ക് കീഴിൽ വീഴാതിരിക്കട്ടെ
  rationale: πέσητε എന്ന വീഴുക എന്ന രൂപകവും κρίσις എന്ന പദത്തിന്റെ വിശാലമായ ‘ന്യായവിധി’ എന്ന അർഥവും നിലനിർത്തുന്നു; ‘ശിക്ഷാവിധി’ എന്നു നൽകി അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: κρίσις എന്നത് ‘ന്യായവിധി’ എന്നോ കൂടുതൽ ശക്തമായ ‘ശിക്ഷാവിധി’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ന്യായവിധി
  alternative: ശിക്ഷാവിധി
  rationale: κρίσις വിശാലമായ അർഥത്തിൽ വിധിനിർണയത്തെ സൂചിപ്പിക്കാം; അന്തിമ കുറ്റവിധി എന്ന കൂടുതൽ ഇടുങ്ങിയ ദൈവശാസ്ത്രപരമായ അർഥം വാചകത്തിൽ നിർബന്ധമല്ല. അതിനാൽ മുഖ്യപാഠം അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: മിശ്രസമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന ἀδελφοί എങ്ങനെ നൽകണം
  choice: എന്റെ സഹോദരന്മാരേ
  alternative: എന്റെ സഹോദരീസഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ അത് വിശ്വാസിസമൂഹം മുഴുവനെയും പ്രതിനിധിയായി അഭിസംബോധന ചെയ്യുന്നതാകാമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അഭിസംബോധനയും വാക്യഘടനയും ഉപയോഗിച്ചു. ‘ആണയിടുക’ എന്നത് ശപഥമെടുക്കൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ഉദ്ധരണിച്ചിഹ്നങ്ങളോടെയുള്ള ‘അതേ/അല്ല’ ഗ്രീക്കിലെ നേരായ, ആവർത്തനാത്മകമായ പ്രയോഗം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
