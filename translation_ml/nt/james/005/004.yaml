id: JAS.5.4
reference: James 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: ml
  text: ഇതാ, നിങ്ങളുടെ നിലങ്ങൾ കൊയ്ത തൊഴിലാളികൾക്കു നിങ്ങൾ കൊടുക്കാതെ പിടിച്ചുവെച്ച കൂലി നിലവിളിക്കുന്നു; കൊയ്ത്തുകാരുടെ നിലവിളികൾ സൈന്യങ്ങളുടെ കർത്താവിന്റെ[a] ചെവികളിൽ എത്തിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കർത്താവായ സബയോത്ത്.” ഗ്രീക്ക് പാഠം എബ്രായത്തിൽനിന്നുള്ള Σαβαώθ എന്ന സ്ഥാനപ്പേര് ലിപ്യന്തരണം ചെയ്തു നിലനിർത്തുന്നു; അതിന്റെ അർഥം “സൈന്യങ്ങൾ” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള കുറ്റാരോപണത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: μισθὸς τῶν ἐργατῶν
  choice: തൊഴിലാളികൾക്കു ... കൂലി
  rationale: μισθός തൊഴിലിന് നൽകേണ്ട പ്രതിഫലമാണ്. മലയാളത്തിൽ അവകാശബന്ധത്തെക്കാൾ ലഭിക്കേണ്ട വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ‘തൊഴിലാളികൾക്കു ... കൂലി’ എന്ന ഘടന കുറ്റാരോപണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: τῶν ἀμησάντων τὰς χώρας ὑμῶν
  choice: നിങ്ങളുടെ നിലങ്ങൾ കൊയ്ത
  rationale: ἀμάω കൃഷിയിടത്തിലെ വിള കൊയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; χώρας എന്നത് ഈ സന്ദർഭത്തിൽ കൃഷിനിലങ്ങളാണ്.
- source_word: ὁ ἀφυστερημένος ἀφ’ ὑμῶν
  choice: നിങ്ങൾ കൊടുക്കാതെ പിടിച്ചുവെച്ച
  rationale: അർഹമായ കൂലി നൽകാതിരുന്നതും അതു അന്യായമായി തടഞ്ഞുവെച്ചതും വ്യക്തമാക്കുന്നു; വെറും ‘വഞ്ചിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് അതിരുകടക്കുന്നില്ല.
- source_word: κράζει
  choice: നിലവിളിക്കുന്നു
  rationale: നൽകാത്ത കൂലിയെ നീതിക്കായി നിലവിളിക്കുന്നതായി വ്യക്തിവൽക്കരിക്കുന്ന വർത്തമാനകാലത്തിന്റെ സജീവത നിലനിർത്തുന്നു.
- source_word: αἱ βοαὶ τῶν θερισάντων
  choice: കൊയ്ത്തുകാരുടെ നിലവിളികൾ
  rationale: വിള കൊയ്തവരുടെ സഹായത്തിനും നീതിക്കുമായുള്ള ശക്തമായ നിലവിളികളെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: εἰς τὰ ὦτα ... εἰσεληλύθασιν
  choice: ചെവികളിൽ എത്തിയിരിക്കുന്നു
  rationale: പ്രവേശനം പൂർത്തിയായിട്ടും അതിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നതായി സൂചിപ്പിക്കുന്ന perfect രൂപവും സെമിറ്റിക് ദൃശ്യഭാഷയും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
- source_word: Κυρίου Σαβαὼθ
  choice: സൈന്യങ്ങളുടെ കർത്താവ്
  rationale: Σαβαώθ എന്ന എബ്രായ പശ്ചാത്തലമുള്ള ദൈവിക സ്ഥാനപ്പേരിന്റെ അർഥം വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; പരമ്പരാഗത ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: Κυρίου Σαβαὼθ എന്ന ദൈവിക സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: സൈന്യങ്ങളുടെ കർത്താവ്
  alternative: കർത്താവായ സബയോത്ത്
  rationale: κύριος എന്നത് ‘കർത്താവ്’ എന്നും Σαβαώθ എന്ന സ്ഥാനപ്പേര് അതിന്റെ അർഥമായ ‘സൈന്യങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്തി പഴയനിയമ പശ്ചാത്തലവും ദൈവിക അധികാരത്തിന്റെ ഭാവവും സംരക്ഷിക്കുന്നു. ഗ്രീക്ക് നിലനിർത്തിയ ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘നിലവിളിക്കുന്നു’ എന്ന വ്യക്തിവൽക്കരണവും ‘ചെവികളിൽ എത്തിയിരിക്കുന്നു’ എന്ന ദൃശ്യപ്രയോഗവും മൂലപാഠത്തിന്റെ ശക്തി നിലനിർത്താൻ സംരക്ഷിച്ചു.
