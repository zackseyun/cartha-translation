  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: ml
  text: ധനികരേ, ഇനി കേൾക്കൂ! നിങ്ങളുടെമേൽ വരാനിരിക്കുന്ന ദുരിതങ്ങളെ[b]ച്ചൊല്ലി ഉച്ചത്തിൽ വിലപിച്ചുകൊണ്ട്[a] കരയുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അലമുറയിട്ടുകൊണ്ട്.’ ഗ്രീക്കുപദം ഉറക്കെയുള്ള, പരസ്യമായ വിലാപത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
