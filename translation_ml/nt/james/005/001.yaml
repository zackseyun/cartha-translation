    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: ഇനി കേൾക്കൂ
  rationale: രൂക്ഷമായ ആഹ്വാനമോ ശാസനയോ ആരംഭിക്കുന്ന പ്രയോഗമാണിത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അതിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു.
- source_word: οἱ πλούσιοι
  choice: ധനികരേ
  rationale: വ്യാകരണരൂപം കർത്തൃവിഭക്തിയിലാണെങ്കിലും ഇവിടെ നേരിട്ടുള്ള സംബോധനയായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിലെ സംബോധനരൂപം അത് വ്യക്തമായി നൽകുന്നു.
- source_word: κλαύσατε
  choice: കരയുവിൻ
  rationale: പ്രകടമായ ദുഃഖപ്രകടനത്തിനുള്ള ആജ്ഞയാണ്; ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: ὀλολύζοντες
  choice: ഉച്ചത്തിൽ വിലപിച്ചുകൊണ്ട്
  rationale: കരച്ചിലിനെ ശക്തിപ്പെടുത്തുന്ന, ഉറക്കെയുള്ള പരസ്യവിലാപത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപമാണിത്. അതിനെ വേറൊരു സ്വതന്ത്ര ആജ്ഞയാക്കാതെ അനുബന്ധപ്രവൃത്തിയായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ ταῖς ταλαιπωρίαις
  choice: ദുരിതങ്ങളെച്ചൊല്ലി
  rationale: ഇവിടെ ἐπί ദുഃഖപ്രകടനത്തിന്റെ കാരണമോ സന്ദർഭമോ സൂചിപ്പിക്കുന്നു. ‘ദുരിതങ്ങളെച്ചൊല്ലി’ എന്നത് മലയാളത്തിൽ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ταλαιπωρίαις
  choice: ദുരിതങ്ങൾ
  rationale: കടുത്ത കഷ്ടതകളെയും ദയനീയ അവസ്ഥകളെയും സൂചിപ്പിക്കുന്ന വിശാലപദം; ന്യായവിധിയുടെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: ταῖς ἐπερχομέναις
  choice: നിങ്ങളുടെമേൽ വരാനിരിക്കുന്ന
  rationale: അടുത്തുവരുന്ന ദുരിതങ്ങളെയാണ് കൃദന്തരൂപം വിശേഷിപ്പിക്കുന്നത്. അവ ധനികരുടെമേൽ വരുന്നു എന്ന ആശയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; സമയസമീപ്യത അനാവശ്യമായി അതിശയിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ധനികരോടുള്ള സംബോധനത്തിന്റെ സ്വഭാവവും പരാമർശിതരും
  choice: വരാനിരിക്കുന്ന ദുരിതമോ ന്യായവിധിയോ നേരിടുന്ന ധനികരോടുള്ള പ്രവാചകസദൃശമായ രൂക്ഷശാസനയായി പരിഭാഷപ്പെടുത്തി; അവർ വിശ്വാസികളാണോ അവിശ്വാസികളാണോ എന്ന് വ്യക്തമാക്കിയില്ല.
  alternative: പീഡകരായ അവിശ്വാസി ഭൂവുടമകളെ മാത്രം അഭിസംബോധന ചെയ്യുന്നതായോ ക്രൈസ്തവസമൂഹത്തിലെ ധനികരെ മാത്രം മുന്നറിയിപ്പു നൽകുന്നതായോ വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം ‘ധനികരെ’ നേരിട്ട് അഭിസംബോധന ചെയ്യുകയും വരാനിരിക്കുന്ന ദുരിതങ്ങൾ അറിയിക്കുകയും ചെയ്യുന്നു; എന്നാൽ അവരുടെ വിശ്വാസപരമായ സ്ഥാനം ഈ വാക്യത്തിൽ മാത്രം നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ വിശാലതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നേരിട്ടുള്ള ശൈലി. പ്രവാചകസദൃശമായ ശാസനയുടെ ശക്തി നിലനിർത്താൻ സംബോധനയ്ക്കുശേഷം ആശ്ചര്യചിഹ്നം ഉപയോഗിച്ചു. കൃദന്തരൂപത്തിന്റെ വ്യാകരണബന്ധം സംരക്ഷിച്ചുകൊണ്ട് വാക്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
