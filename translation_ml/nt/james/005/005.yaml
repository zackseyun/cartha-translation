id: JAS.5.5
reference: James 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: ml
  text: നിങ്ങൾ ഭൂമിയിൽ ആഡംബരത്തോടെ ജീവിച്ചു[a]; സുഖഭോഗങ്ങളിൽ മുഴുകി[b]. കശാപ്പിന്റെ നാളിൽ[d] നിങ്ങൾ നിങ്ങളുടെ ഹൃദയങ്ങളെ കൊഴുപ്പിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘സുഖമായി ജീവിച്ചു.’
    reason: lexical_alternative
  - marker: b
    text: ‘സുഖഭോഗങ്ങളിൽ മുഴുകി’ എന്നതിന് പകരം ‘സുഖാസക്തരായി ജീവിച്ചു’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: അറുക്കുന്നതിനു മുമ്പ് മൃഗങ്ങളെ കൊഴുപ്പിക്കുന്നതാണ് ഇവിടത്തെ ദൃശ്യം; വരാനിരിക്കുന്ന ന്യായവിധിയെ ഇതു സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
  - marker: d
    text: അല്ലെങ്കിൽ ‘കശാപ്പിന്റെ നാളിലേക്കായി.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: ആഡംബരത്തോടെ ജീവിച്ചു
  rationale: ആനന്ദിക്കുക എന്ന പൊതുവായ അർഥത്തേക്കാൾ സുഖലോലുപവും ആഡംബരപൂർണവുമായ ജീവിതത്തെ സൂചിപ്പിക്കുന്ന ശാസനാഭാവം നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: γῆ എന്ന പദത്തിന്റെ വിശാലമായ ‘ഭൂമി’ എന്ന അർഥം സന്ദർഭത്തിന് യോജിക്കുകയും ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐσπαταλήσατε
  choice: സുഖഭോഗങ്ങളിൽ മുഴുകി
  rationale: സ്വയം നിയന്ത്രിക്കാതെ സുഖഭോഗത്തിൽ ഏർപ്പെട്ട ജീവിതത്തെ സ്വാഭാവികവും ശക്തവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐθρέψατε
  choice: കൊഴുപ്പിച്ചു
  rationale: സാധാരണ ‘പോഷിപ്പിച്ചു’ എന്നതിലുപരി, അറുക്കാനായി മൃഗങ്ങളെ കൊഴുപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിലെ പരിഹാസാത്മക ദൃശ്യം നിലനിർത്തുന്നു.
- source_word: τὰς καρδίας ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളെ
  rationale: രൂപകത്തെ വിശദീകരിച്ച് പരാവർത്തനം ചെയ്യാതെ, മൂലത്തിലെ ബൈബിൾസംബന്ധമായ മനുഷ്യാന്തരംഗഭാഷയും വാചകശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: അറുപ്പിന്റെ നാളിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാനബന്ധവും അറുക്കപ്പെടാൻ കൊഴുപ്പിക്കപ്പെടുന്ന മൃഗങ്ങളുടെ തീക്ഷ്ണമായ ദൃശ്യവും നിലനിർത്തുന്നു; ന്യായവിധി എന്നു മുഖ്യവാചകത്തിൽ തുറന്നു പറഞ്ഞ് അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: ‘അറുപ്പിന്റെ നാൾ’ എന്ന രൂപകത്തിന്റെ ദൈവശാസ്ത്രപരമായ സൂചന
  choice: വരാനിരിക്കുന്ന അറുപ്പിന്റെയോ ന്യായവിധിയുടെയോ രൂപകം മുഖ്യവാചകത്തിൽ വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: ‘ദൈവിക ന്യായവിധിയുടെ ദിവസം’ എന്നു വ്യക്തമായി വിവർത്തനം ചെയ്യുക; അല്ലെങ്കിൽ ചുറ്റുപാടിലുള്ള നിരപരാധികളുടെ വധത്തോടുള്ള സൂചനയായി വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം ന്യായവിധിയെ ശക്തമായി സൂചിപ്പിച്ചാലും, ഗ്രീക്ക് പാഠം അതിന്റെ കൃത്യമായ സൂചിതാർത്ഥം തുറന്നു പറയുന്നില്ല. അതിനാൽ രൂപകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സമ്പന്നരോടുള്ള നേരിട്ടുള്ള ശാസനാഭാവം നിലനിർത്താൻ രണ്ടു ചെറുവാക്യഖണ്ഡങ്ങൾ ഉപയോഗിച്ചു. ‘ഹൃദയങ്ങളെ കൊഴുപ്പിച്ചു’ എന്ന അസാധാരണ രൂപകം മിനുക്കിക്കളയാതെ മൂലത്തിലെ തീക്ഷ്ണത സംരക്ഷിച്ചു.
