id: JAS.5.9
reference: James 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: ml
  text: സഹോദരങ്ങളേ,[a] നിങ്ങൾ വിധിക്കപ്പെടാതിരിക്കേണ്ടതിന് പരസ്പരത്തിനെതിരെ പിറുപിറുക്കരുത്. ഇതാ, ന്യായാധിപൻ വാതിലുകളുടെ മുമ്പിൽ നിൽക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരങ്ങളേ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം ἀδελφοί ആണ്; സന്ദർഭമനുസരിച്ച് സ്ത്രീകളുൾപ്പെടെയുള്ള സഹവിശ്വാസികളെ കൂട്ടമായി ഇത് അഭിസംബോധന ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: പിറുപിറുക്കരുത്
  rationale: κατ’ ἀλλήλων എന്ന പ്രയോഗത്തോടൊപ്പം ഇവിടെ ഈ ക്രിയ ഉള്ളിലെ നെടുവീർപ്പിനെക്കാൾ സഹവിശ്വാസികൾക്കെതിരായ നീരസപൂർവമായ പരാതിയെ സൂചിപ്പിക്കുന്നു. ‘പിറുപിറുക്കരുത്’ അതിന്റെ ബന്ധപരവും ധാർമികവുമായ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ ഈ സംബോധന സന്ദർഭത്തിൽ സ്ത്രീകളുൾപ്പെടെയുള്ള വിശ്വാസിസമൂഹത്തെ കൂട്ടമായി അഭിസംബോധന ചെയ്യാം. ഉറവിടരൂപം നിലനിർത്തുകയും ഉൾക്കൊള്ളുന്ന പ്രയോഗപരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: κατ’ ἀλλήλων
  choice: പരസ്പരം
  rationale: κατά + genitive ഇവിടെ ഒരാൾ മറ്റൊരാൾക്കെതിരെ നീരസത്തോടെ പരാതി പറയുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പരസ്പരം പിറുപിറുക്കരുത്’ എന്ന സമഗ്രപ്രയോഗം ഈ വിരോധദിശ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: κριθῆτε
  choice: നിങ്ങൾ വിധിക്കപ്പെടാതിരിക്കേണ്ടതിന്
  rationale: κρίνω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം വിധിക്കപ്പെടുക എന്നാണ്; ഫലം മുൻകൂട്ടി ‘ശിക്ഷിക്കപ്പെടുക’ എന്നു ശക്തമാക്കുന്നില്ല. ἵνα μή സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം/ഫലം മലയാളത്തിൽ ഈ ഘടന നിലനിർത്തുന്നു.
- source_word: κριτὴς
  choice: ന്യായാധിപൻ
  rationale: അന്ത്യകാല ദൈവിക ന്യായാധിപനെ സൂചിപ്പിക്കുന്ന പദവി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; കൃത്യമായ വ്യക്തിസൂചന മൂലപാഠത്തിന് അപ്പുറം ചേർക്കുന്നില്ല.
- source_word: πρὸ τῶν θυρῶν
  choice: വാതിലുകൾക്കു മുമ്പിൽ
  rationale: മൂലത്തിലെ ബഹുവചനം നിലനിർത്തുന്നു. ഈ പ്രയോഗം കൃത്യമായ സ്ഥലവിവരണത്തേക്കാൾ ന്യായവിധിയുടെ സമീപ്യതയും ആസന്നതയും അറിയിക്കുന്നു.
- source_word: ἕστηκεν
  choice: നിൽക്കുന്നു
  rationale: perfect രൂപം മുൻപ് നിലയുറപ്പിച്ചതിന്റെ ഫലമായി ഇപ്പോൾ നിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘നിൽക്കുന്നു’ ആ സജീവമായ ഇപ്പോഴത്തെ സന്നദ്ധാവസ്ഥയെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ന്യായാധിപൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: അന്ത്യകാല ദൈവിക ന്യായാധിപൻ; സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികമായി കർത്താവിനെ/ക്രിസ്തുവിനെ സൂചിപ്പിക്കാം
  alternative: പൊതുവായി ന്യായാധിപനായ ദൈവം
  rationale: യാക്കോബിലെ ആസന്നമായ കർത്താവിന്റെ വരവും ന്യായവിധിയും സംബന്ധിച്ച ഭാഷ ഈ വായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും മൂലഗ്രീക്ക് വ്യക്തിയെ കൂടുതൽ നിർവചിക്കാത്തതിനാൽ പരിഭാഷയും ‘ന്യായാധിപൻ’ എന്നതിൽ നിൽക്കുന്നു; അങ്ങനെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ‘ഇതാ’ മൂലത്തിലെ ἰδού എന്ന ശ്രദ്ധാകർഷക പദം നിലനിർത്തുന്നു. ‘വാതിലുകൾ’ എന്ന ബഹുവചനം അസാധാരണമായി തോന്നാമെങ്കിലും ഉറവിടത്തിലെ θυρῶν എന്ന ബഹുവചനം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
