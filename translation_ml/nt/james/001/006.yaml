source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: ml
  text: എന്നാൽ അവൻ വിശ്വാസത്തോടെ[a], ഒട്ടും സംശയിക്കാതെ ചോദിക്കട്ടെ. കാരണം, സംശയിക്കുന്നവൻ കാറ്റേറ്റ് ഇളകുകയും ആടിയുലയുകയും ചെയ്യുന്ന കടൽത്തിരപോലെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിൽ ആശ്രയമർപ്പിച്ച്.” ഗ്രീക്കിലെ “വിശ്വാസത്തോടെ” എന്ന പ്രയോഗം ഈ സന്ദർഭത്തിൽ ദൈവത്തിലുള്ള ആശ്രയവിശ്വാസത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: ചോദിക്കട്ടെ
  rationale: മൂന്നാം പുരുഷ ഏകവചന വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ പ്രബോധനസ്വരം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; മുൻവാക്യത്തിൽ ദൈവത്തോട് ജ്ഞാനം ചോദിക്കുന്നതാണ് സന്ദർഭം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വാഗ്ദാനത്തിൽനിന്ന് ചോദിക്കേണ്ട രീതിയിലേക്കുള്ള മൃദുവായ വൈരുധ്യവും വികാസവും സൂചിപ്പിക്കുന്നു.
- source_word: ἐν πίστει
  choice: വിശ്വാസത്തോടെ
  rationale: പദശഃ അർത്ഥമായ ‘വിശ്വാസത്തിൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ മലയാളപ്രയോഗം; ദൈവത്തിലുള്ള ആശ്രയവിശ്വാസത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: μηδὲν διακρινόμενος
  choice: ഒട്ടും സംശയിക്കാതെ
  rationale: μηδέν നൽകുന്ന സമ്പൂർണ നിഷേധവും διακρινόμενος എന്നതിന്റെ സന്ദർഭോചിതമായ ആന്തരിക സംശയം/ചാഞ്ചാട്ടം എന്ന അർത്ഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: ὁ γὰρ διακρινόμενος
  choice: സംശയിക്കുന്നവൻ
  rationale: ഗ്രീക്കിലെ പൊതുവായ substantival participle ലിംഗപരമായി അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ ചുരുക്കവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: κλύδωνι θαλάσσης
  choice: കടൽത്തിര
  rationale: കടലിലെ തിരയെയോ അലച്ചിലെയോ സൂചിപ്പിക്കുന്ന ദൃശ്യരൂപം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ജീവസ്സുറ്റതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀνεμιζομένῳ
  choice: കാറ്റിനാൽ അടിച്ചുനീക്കപ്പെടുകയും
  rationale: കാറ്റിന്റെ പ്രവർത്തനത്തിന് വിധേയമായി നീങ്ങുന്ന തിരയുടെ നിഷ്ക്രിയവും അസ്ഥിരവുമായ അവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: ῥιπιζομένῳ
  choice: ആടിയുലയുകയും ചെയ്യുന്ന
  rationale: തിര ഇങ്ങോട്ടും അങ്ങോട്ടും ചലിപ്പിക്കപ്പെടുന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ദിശാവിവരണം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ പ്രാർത്ഥനാസന്ദർഭത്തിലെ അർത്ഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയബോധത്തോടെയുള്ള വിശ്വാസം / ആശ്രയത്തോടെ
  rationale: പ്രധാനപാഠത്തിൽ പരമ്പരാഗതവും വ്യാപകവുമായ ‘വിശ്വാസം’ നിലനിർത്തുന്നു. ഈ സന്ദർഭത്തിൽ ദൈവത്തിലുള്ള ആത്മവിശ്വാസപരമായ ആശ്രയം എന്ന ഭാവം സജീവമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: διακρινόμενος എന്ന പദത്തിലെ അർത്ഥവ്യാപ്തി
  choice: സംശയിക്കുക
  alternative: ചാഞ്ചാടുക / മനസ്സിൽ പിളർന്നുനിൽക്കുക
  rationale: ജ്ഞാനം ചോദിക്കുന്ന പ്രാർത്ഥനയുടെ സന്ദർഭത്തിലും തുടർന്നുള്ള കടൽത്തിരയുടെ ഉപമയിലും ‘സംശയിക്കുക’ ഏറ്റവും നേരിട്ടുള്ള വായനയാണ്; എങ്കിലും അസ്ഥിരതയുടെയും ഉള്ളിലെ ചാഞ്ചാട്ടത്തിന്റെയും ഭാവം ഉപമയിൽ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രബോധനശൈലി. ‘അവൻ’ മുൻവാക്യത്തിൽ ജ്ഞാനം ചോദിക്കേണ്ട വ്യക്തിയെ പിന്തുടരുന്നു; ‘സംശയിക്കുന്നവൻ’ പൊതുവായ പരാമർശമായി നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
