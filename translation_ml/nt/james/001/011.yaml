id: JAS.1.11
reference: James 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: ml
  text: എന്തെന്നാൽ, സൂര്യൻ ചുട്ടുപൊള്ളിക്കുന്ന ചൂടോടെ[a] ഉദിച്ച് പുല്ലിനെ ഉണക്കിക്കളഞ്ഞു; അതിന്റെ പൂവ് കൊഴിഞ്ഞുവീണു, അതിന്റെ രൂപഭംഗി ഇല്ലാതായി. അതുപോലെതന്നെ ധനികനും തന്റെ പ്രവർത്തനങ്ങളുടെ നടുവിൽ[b] വാടിപ്പോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ചുട്ടുപൊള്ളിക്കുന്ന കാറ്റോടെ.” καύσων എന്ന ഗ്രീക്കുപദം കത്തുന്ന ചൂടിനെയോ അതിനോടു ബന്ധപ്പെട്ട ചൂടൻ കാറ്റിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “തന്റെ യാത്രകളിൽ.” πορεία എന്ന ഗ്രീക്കുപദം യാത്രകളെയോ കൂടുതൽ വിശാലമായി ഒരാളുടെ പ്രവർത്തനഗതിയെയോ ഉദ്യമങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: ഉദിച്ച്
  rationale: ദൃഷ്ടാന്തത്തിലെ ലളിതമായ ഭൂതകാല സംഭവക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: σὺν τῷ καύσωνι
  choice: ചുട്ടുപൊള്ളിക്കുന്ന ചൂടോടെ
  rationale: καύσων സൂചിപ്പിക്കുന്ന കത്തുന്ന ചൂട് നിലനിർത്തുന്നു; ചൂടൻ കാറ്റ് എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: പുല്ലിനെ ഉണക്കിക്കളഞ്ഞു
  rationale: കടുത്ത ചൂട് സസ്യത്തിൽ വരുത്തുന്ന ദൃശ്യമായ ഫലം വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: അതിന്റെ പൂവ് കൊഴിഞ്ഞുവീണു
  rationale: ἐκπίπτω എന്നതിലെ വീഴ്ചയുടെ ഭൗതികചിത്രവും പൂവിനോടു ചേർന്ന സ്വാഭാവിക മലയാളപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: അതിന്റെ രൂപഭംഗി
  rationale: പുഷ്പത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ πρόσωπον എന്നതിനെ അക്ഷരാർഥമായ ‘മുഖം’ എന്നു പറയാതെ അതിന്റെ ദൃശ്യരൂപം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀπώλετο
  choice: ഇല്ലാതായി
  rationale: സൗന്ദര്യം നഷ്ടപ്പെടുകയും അപ്രത്യക്ഷമാകുകയും ചെയ്യുന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὁ πλούσιος
  choice: ധനികൻ
  rationale: ഗ്രീക്കിലെ ഏകവചന പുൽലിംഗ പ്രതിനിധിരൂപം സംക്ഷിപ്തമായും കൃത്യമായും നിലനിർത്തുന്നു.
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: തന്റെ പ്രവർത്തനങ്ങളുടെ നടുവിൽ
  rationale: πορείαയുടെ അക്ഷരാർഥമായ യാത്രകൾ എന്ന സാധ്യത മറയ്ക്കാതെ, സന്ദർഭത്തിലെ ജീവിതപ്രവർത്തനങ്ങളുടെയും ഉദ്യമങ്ങളുടെയും വിശാലമായ അർഥം പ്രധാനപാഠത്തിൽ നൽകുന്നു.
- source_word: μαρανθήσεται
  choice: വാടിപ്പോകും
  rationale: സസ്യരൂപകം തുടർന്നുകൊണ്ട് ഭാവിയിലെ അനിവാര്യമായ ക്ഷയത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ὁ πλούσιος എന്നതിലെ ലിംഗസൂചന
  choice: ധനികൻ
  alternative: ധനികനായ വ്യക്തി / സമ്പന്നൻ
  rationale: മൂലത്തിലെ ഏകവചന പുൽലിംഗ പ്രതിനിധിയെ നിലനിർത്തുന്നു; മുന്നറിയിപ്പിന്റെ പ്രയോഗം പുരുഷന്മാർക്കു മാത്രമാണെന്ന് ഇതുകൊണ്ട് ഉദ്ദേശിക്കുന്നില്ല.
- issue: πορείαις എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: പ്രവർത്തനങ്ങൾ
  alternative: യാത്രകൾ / ഉദ്യമങ്ങൾ
  rationale: മുന്നറിയിപ്പ് അക്ഷരാർഥ യാത്രയിൽ മാത്രമായി ചുരുക്കാതെ ധനികന്റെ ജീവിതഗതിയെയും പ്രവർത്തനങ്ങളെയും ഉൾക്കൊള്ളുന്നു; അക്ഷരാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പുല്ല്, പൂവ്, വാടൽ എന്നീ ദൃശ്യരൂപങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; അപൂർവമോ സഭാവിഭാഗവിശേഷമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
