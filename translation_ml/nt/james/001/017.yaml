id: JAS.1.17
reference: James 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ’ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: ml
  text: നല്ലതായ ഓരോ ദാനവും തികവുറ്റ ഓരോ സമ്മാനവും മുകളിൽനിന്നുള്ളതാണ്; അവ വെളിച്ചങ്ങളുടെ പിതാവിൽനിന്ന് ഇറങ്ങിവരുന്നു. അവനിൽ മാറ്റമോ തിരിയുന്നതുമൂലമുള്ള നിഴലോ[b] ഇല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, ‘തിരിവിന്റെ നിഴൽ’ അല്ലെങ്കിൽ ‘മാറിക്കൊണ്ടിരിക്കുന്ന നിഴൽ.’ ആകാശവെളിച്ചങ്ങളുടെ ചലനത്തോടൊപ്പം മാറുന്ന നിഴലുകളെ ഈ പ്രയോഗം സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: നല്ലതായ ഓരോ ദാനവും
  rationale: δόσις എന്നതിന് നൽകുന്ന പ്രവൃത്തിയെയോ നൽകപ്പെട്ട ദാനത്തെയോ സൂചിപ്പിക്കാം. δώρημα എന്ന പദത്തോടു ചേർന്നുള്ള ഈ സമാന്തരപ്രയോഗത്തിൽ, സ്വാഭാവികമായ മലയാളത്തിനായി ‘ദാനം’ എന്നു പരിഭാഷപ്പെടുത്തി; Πᾶσα എന്നതിന്റെ വിതരണാർഥം ‘ഓരോ’ നിലനിർത്തുന്നു.
- source_word: πᾶν δώρημα τέλειον
  choice: തികവുറ്റ ഓരോ സമ്മാനവും
  rationale: δώρημα നൽകപ്പെട്ട വസ്തുവിനെ ഊന്നിപ്പറയുന്നു. ആദ്യത്തെ δόσις-ൽനിന്നുള്ള വ്യത്യാസം സൂക്ഷിക്കാൻ ‘സമ്മാനം’ ഉപയോഗിച്ചു. τέλειον എന്നത് സമ്പൂർണവും കുറവില്ലാത്തതുമായ നന്മയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തികവുറ്റ’ എന്നു നൽകി.
- source_word: ἄνωθέν ἐστιν
  choice: മുകളിൽനിന്നുള്ളതാണ്
  rationale: ἄνωθεν എന്നതിന്റെ ‘മുകളിൽനിന്ന്’ എന്ന ഉറവിടാർഥവും ἐστιν എന്ന ബന്ധക്രിയയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: καταβαῖνον
  choice: ഇറങ്ങിവരുന്നതാണ്
  rationale: വർത്തമാന കൃദന്തരൂപം ദാനങ്ങളുടെ ഉറവിടത്തെയും അവിടെനിന്നുള്ള വരവിനെയും ചിത്രീകരിക്കുന്നു; ‘ഇറങ്ങിവരുന്നു’ എന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: വെളിച്ചങ്ങളുടെ പിതാവിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ രൂപകം വിശദീകരണമായി ചുരുക്കാതെ നിലനിർത്തുന്നു. ‘വെളിച്ചങ്ങൾ’ ആകാശഗോളങ്ങളിലെ പ്രകാശങ്ങളെ സൂചിപ്പിക്കാവുന്നതാണ്.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: അവനിൽ മാറ്റമോ ... ഇല്ല
  rationale: παρ’ ᾧ ദൈവത്തോടുള്ള ബന്ധത്തിലോ അവന്റെ സന്നിധിയിലോ മാറ്റമില്ലെന്നു പറയുന്നു. ആധുനിക മലയാളത്തിൽ ‘അവനിൽ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്; παραλλαγή ‘മാറ്റം’ എന്നു നൽകി.
- source_word: τροπῆς ἀποσκίασμα
  choice: തിരിയുന്നതുമൂലമുള്ള നിഴൽ
  rationale: ദുഷ്കരമായ ഈ പദസമുച്ചയം തിരിയുന്ന ആകാശവെളിച്ചങ്ങളോടൊപ്പം മാറുന്ന നിഴലിനെ സൂചിപ്പിച്ചേക്കാം. രൂപകം നിലനിർത്തിക്കൊണ്ട് ജനസാമാന്യത്തിന് ഗ്രഹിക്കാവുന്ന രീതിയിൽ കാരണബന്ധം പ്രകടമാക്കി.
theological_decisions:
- issue: ‘വെളിച്ചങ്ങളുടെ പിതാവ്’ എന്ന രൂപകവും ദൈവത്തിന്റെ മാറ്റമില്ലായ്മയും
  choice: രൂപകവും മാറ്റമില്ലെന്ന പ്രസ്താവനയും മുഖ്യവാക്യത്തിൽ നിലനിർത്തി.
  alternative: ‘വെളിച്ചങ്ങൾ’ എന്നത് ആകാശഗോളങ്ങളാണെന്ന് മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കുക; അല്ലെങ്കിൽ അവസാനഭാഗം ‘അവൻ ഒരിക്കലും മാറുന്നില്ല’ എന്നു അമൂർത്തമായി പരാവർത്തനം ചെയ്യുക.
  rationale: വാക്യം എല്ലാ നന്മയുടെയും ഉറവിടമായി ദൈവത്തെ അവതരിപ്പിക്കുകയും മാറുന്ന സൃഷ്ടവെളിച്ചങ്ങളുമായി അവനെ താരതമ്യപ്പെടുത്തുകയും ചെയ്യുന്നു. വിശദീകരണപരമായ സിദ്ധാന്തപ്രസ്താവനയാക്കി മാറ്റാതെ മൂലത്തിലെ രൂപകവും ദൈവശാസ്ത്രപരമായ ഭാവവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ദാനം/സമ്മാനം’ എന്ന വ്യത്യാസം ഗ്രീക്കിലെ δόσις/δώρημα എന്ന പദജോടിയുടെ സൂക്ഷ്മഭേദം കാണിക്കുന്നു. ‘വെളിച്ചങ്ങളുടെ പിതാവ്’ എന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തി.
