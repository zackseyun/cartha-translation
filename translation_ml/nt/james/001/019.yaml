source:
  edition: SBLGNT
  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: ml
  text: 'എന്റെ പ്രിയ സഹോദരന്മാരേ[a], ഇതു അറിഞ്ഞുകൊള്ളുവിൻ[c]: ഓരോ മനുഷ്യനും[b] കേൾക്കാൻ സന്നദ്ധനായും സംസാരിക്കാൻ മന്ദഗതിയിലും കോപിക്കുന്നതിൽ മന്ദഗതിയിലും ആയിരിക്കട്ടെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ പ്രിയ സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ യാക്കോബ് വിശ്വാസിസമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്യുന്നതായിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘എല്ലാവരും’ അഥവാ ‘ഓരോ വ്യക്തിയും’; ഗ്രീക്കിലെ ഏകവചനരൂപം ഇവിടെ പൊതുവായ അർഥത്തിലാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘എന്റെ പ്രിയ സഹോദരന്മാരേ, ഇതു നിങ്ങൾ അറിയുന്നു’; ആദ്യത്തെ ക്രിയയെ ആജ്ഞയായല്ല, സൂചകപ്രസ്താവനയായും എടുക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴστε
  choice: ഇതു അറിഞ്ഞുകൊള്ളുവിൻ
  rationale: രൂപം ആജ്ഞയായോ സൂചകപ്രസ്താവനയായോ മനസ്സിലാക്കാം. തുടർന്ന് വരുന്ന പ്രബോധനങ്ങളോടു ചേരുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ആജ്ഞാർഥം സ്വീകരിച്ചു; സ്വാഭാവികമായ മലയാളത്തിനായി ‘ഇതു’ ചേർത്തു.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: എന്റെ പ്രിയ സഹോദരന്മാരേ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ അഭിസംബോധന സംരക്ഷിക്കുന്നു; വിശ്വാസിസമൂഹം മുഴുവനും ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔστω δὲ
  choice: ആയിരിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ആജ്ഞയുടെ പ്രബോധനശക്തി സ്വാഭാവികമായി നൽകുന്നു. δέ ഇവിടെ ലഘുവായ ബന്ധകമായതിനാൽ പ്രത്യേക വിരോധസൂചക പദം ചേർത്തിട്ടില്ല.
- source_word: πᾶς ἄνθρωπος
  choice: ഓരോ മനുഷ്യനും
  rationale: ഏകവചനത്തിലുള്ള പൊതുവായ പ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: കേൾക്കാൻ വേഗമുള്ളവൻ
  rationale: ἀκούω എന്നതിന്റെ അടിസ്ഥാനമായ ‘കേൾക്കുക’ നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്ക് ഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: സംസാരിക്കാൻ താമസമുള്ളവൻ
  rationale: പറയുന്നതിനു മുമ്പ് വൈകുക/അവധാനമുള്ളവനായിരിക്കുക എന്ന പ്രബോധനാർഥം ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: βραδὺς εἰς ὀργήν
  choice: കോപിക്കാൻ താമസമുള്ളവൻ
  rationale: ὀργήയുടെ സാധാരണ അർഥമായ കോപം നിലനിർത്തുകയും ഗ്രീക്ക് സമാന്തരഘടന മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അഭിസംബോധനയിലെയും പൊതുപ്രബോധനത്തിലെയും ലിംഗസൂചക ഭാഷ
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരേ’, ‘ഓരോ മനുഷ്യനും’ എന്നു നിലനിർത്തി
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’, ‘എല്ലാവരും’
  rationale: ഗ്രീക്ക് പദങ്ങളുടെ വ്യാകരണരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; അതേസമയം അവയ്ക്ക് വിശ്വാസിസമൂഹം മുഴുവനെയും ഉൾക്കൊള്ളുന്ന പ്രതിനിധാനപരമായ പ്രയോഗശക്തി ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തുന്നു.
- issue: Ἴστε എന്ന ക്രിയാരൂപത്തിന്റെ ഭാവം
  choice: 'ആജ്ഞാർഥം: ‘ഇതു അറിഞ്ഞുകൊള്ളുവിൻ’'
  alternative: 'സൂചകാർഥം: ‘ഇതു നിങ്ങൾ അറിയുന്നു’'
  rationale: രൂപപരമായി രണ്ടും സാധ്യമാണ്. തുടർന്ന് ഉടൻ വരുന്ന ἔστω എന്ന പ്രബോധനത്തോടു ചേർന്നൊഴുകുന്നതിനാൽ ആജ്ഞാർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മറുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രബോധനശൈലി. ഗ്രീക്കിലെ മൂന്നു സമാന്തര ഗുണവിവരണങ്ങളും ‘...മുള്ളവൻ’ എന്ന ഘടനയിലൂടെ നിലനിർത്തി; യഥാർഥ വ്യാകരണ-അർഥസന്ദിഗ്ധതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
