  to: 'എന്റെ പ്രിയ സഹോദരന്മാരേ[a], ഇതു അറിഞ്ഞുകൊള്ളുവിൻ[c]: ഓരോ മനുഷ്യനും[b] കേൾക്കാൻ സന്നദ്ധനായും സംസാരിക്കാൻ മന്ദഗതിയിലും കോപിക്കുന്നതിൽ മന്ദഗതിയിലും ആയിരിക്കട്ടെ.'
