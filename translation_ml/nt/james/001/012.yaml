    text: അഥവാ, ‘പ്രലോഭനം’ അല്ലെങ്കിൽ ‘പരീക്ഷണം’; ഗ്രീക്ക് പദത്തിന് പരീക്ഷയെയും പ്രലോഭനത്തെയും സൂചിപ്പിക്കാം. എന്നാൽ ഇവിടെ പരീക്ഷിക്കപ്പെടുമ്പോൾ സഹിച്ചുനിൽക്കുന്നതിനാണ് സന്ദർഭം ഊന്നൽ നൽകുന്നത്.
