revisions:
- from: പരീക്ഷ[a] സഹിച്ചുനിൽക്കുന്ന മനുഷ്യൻ അനുഗൃഹീതൻ; കാരണം, പരീക്ഷയിൽ അംഗീകൃതനായിത്തീർന്നശേഷം, തന്നെ സ്നേഹിക്കുന്നവർക്കു അവൻ വാഗ്ദാനം ചെയ്ത ജീവന്റെ കിരീടം[b] അയാൾ പ്രാപിക്കും.
  to: പരീക്ഷ[a] സഹിച്ചുനിൽക്കുന്ന മനുഷ്യൻ ധന്യൻ; കാരണം, അംഗീകൃതനായി തെളിഞ്ഞശേഷം, ദൈവം തന്നെ സ്നേഹിക്കുന്നവർക്ക് വാഗ്ദാനം ചെയ്ത ജീവന്റെ കിരീടം[b] അവന് പ്രാപിക്കും.
  rationale: The revision retains the source’s beatitude, its generic masculine singular expression, the contextual sense of πειρασμός as trial, and the deliberately unexpanded genitive ‘ജീവന്റെ കിരീടം.’ It makes the promiser explicit as God because Malayalam pronoun sequence otherwise obscures the source’s intended referents; this is supported by the immediate context and does not impose a disputed interpretation. The recipient remains singular and generic, matching ἀνήρ and λήμψεται.
