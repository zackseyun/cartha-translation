id: JAS.1.12
reference: James 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: ml
  text: പരീക്ഷ[a] സഹിച്ചുനിൽക്കുന്ന മനുഷ്യൻ ധന്യൻ; കാരണം, അംഗീകൃതനായി തെളിഞ്ഞശേഷം, ദൈവം തന്നെ സ്നേഹിക്കുന്നവർക്ക് വാഗ്ദാനം ചെയ്ത ജീവന്റെ കിരീടം[b] അവന് പ്രാപിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രലോഭനം’ അല്ലെങ്കിൽ ‘പരീക്ഷണം’; ഗ്രീക്ക് പദത്തിന് പരീക്ഷയെയും പ്രലോഭനത്തെയും സൂചിപ്പിക്കാം. എന്നാൽ ഇവിടെ പരീക്ഷിക്കപ്പെടുമ്പോൾ സഹിച്ചുനിൽക്കുന്നതിനാണ് സന്ദർഭം ഊന്നൽ നൽകുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘കിരീടം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം രാജകിരീടത്തെയല്ല, വിജയിക്കു നൽകുന്ന പുഷ്പമാലയെയോ വിജയമാലയെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: അനുഗൃഹീതൻ
  rationale: വെറും മാനസിക സന്തോഷത്തേക്കാൾ അനുഗ്രഹിക്കപ്പെട്ട അവസ്ഥയെ സൂചിപ്പിക്കുന്ന വാഴ്ത്തുവാക്യത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀνὴρ
  choice: മനുഷ്യൻ
  rationale: ഗ്രീക്കിൽ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും ഇവിടെ പ്രതിനിധാനപരമായ പൊതുവർത്ഥത്തിലാണ്; മലയാളത്തിൽ ‘മനുഷ്യൻ’ ഉറവിടരൂപവും പൊതുവായ പ്രയോഗവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὑπομένει
  choice: സഹിച്ചുനിൽക്കുന്ന
  rationale: സമ്മർദത്തിനടിയിൽ സ്ഥിരതയോടെ നിലകൊള്ളുന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: πειρασμόν
  choice: പരീക്ഷ
  rationale: പദത്തിന് പരീക്ഷ, പ്രലോഭനം എന്നീ അർത്ഥങ്ങൾ വരാം; ഇവിടെ സഹനം, അംഗീകാരം, പ്രതിഫലം എന്നിവയുള്ള സന്ദർഭം പരീക്ഷിക്കപ്പെടലിനാണ് ഊന്നൽ നൽകുന്നത്. അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δόκιμος γενόμενος
  choice: പരീക്ഷയിൽ അംഗീകൃതനായിത്തീർന്നശേഷം
  rationale: പരീക്ഷണത്തിലൂടെ സ്വീകാര്യനെന്നു തെളിയുന്നതും തുടർന്ന് പ്രതിഫലം ലഭിക്കുന്നതുമായ മൂലപാഠത്തിന്റെ കാലപരവും മൂല്യനിർണയപരവുമായ ഭാവങ്ങൾ വ്യക്തമാക്കുന്നു.
- source_word: λήμψεται
  choice: പ്രാപിക്കും
  rationale: വാഗ്ദാനം ചെയ്ത പ്രതിഫലം ലഭിക്കുന്ന ഭാവികാല ആശയം dignified modern Malayalam-ൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: στέφανον
  choice: കിരീടം
  rationale: സ്ഥിരവും പരിചിതവുമായ പരിഭാഷ; രാജകിരീടമെന്നതിലുപരി വിജയിക്ക് നൽകുന്ന പുഷ്പമാലയെയോ വലയത്തെയോ സൂചിപ്പിക്കാമെന്ന സാംസ്കാരിക സൂക്ഷ്മത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῆς ζωῆς
  choice: ജീവന്റെ
  rationale: ജനിറ്റീവ് ഘടനയെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു; ‘ജീവൻ തന്നെയായ കിരീടം’ തുടങ്ങിയ സാധ്യതകൾ നിർബന്ധമായി തീരുമാനിക്കുന്നില്ല.
- source_word: ἐπηγγείλατο
  choice: വാഗ്ദാനം ചെയ്ത
  rationale: അഒറിസ്റ്റിന്റെ സാധാരണ ഭൂതകാലഭാവം നൽകുന്നു. സന്ദർഭപ്രകാരം കർത്താവ് ദൈവമാണ്; എന്നാൽ ഗ്രീക്കിലുള്ള സർവനാമരൂപം പ്രധാനവാക്യത്തിൽ അതേപടി നിലനിർത്തുന്നു.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: തന്നെ സ്നേഹിക്കുന്നവർക്കു
  rationale: ദാതൃകാർത്തവും സവിശേഷമായ തുടർച്ചയായ സ്നേഹവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: യാക്കോബ് 1:12-ലെ πειρασμός എന്ന പദത്തിന്റെ അർത്ഥബലം
  choice: പരീക്ഷ
  alternative: പ്രലോഭനം; പരീക്ഷണം
  rationale: സഹിച്ചുനിൽക്കൽ, അംഗീകൃതനാകൽ, പ്രതിഫലം എന്നിവയാണ് ഈ വാക്യത്തിൽ മുൻനിൽക്കുന്നത്; അതിനാൽ പാപത്തിലേക്കുള്ള പ്രേരണയെ മാത്രം സൂചിപ്പിക്കുന്ന ‘പ്രലോഭനം’ എന്നതിനെക്കാൾ ‘പരീക്ഷ’ യോജിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: ‘ജീവന്റെ കിരീടം’ എന്ന ജനിറ്റീവിന്റെ വ്യാഖ്യാനം
  choice: ജീവന്റെ കിരീടം
  alternative: ജീവൻ തന്നെയായ കിരീടം; ജീവൻ നൽകുന്ന കിരീടം
  rationale: മൂലപാഠത്തിലെ ബന്ധത്തിന്റെ സ്വഭാവം പൂർണമായി വിശദീകരിച്ചിട്ടില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായി ഒരൊറ്റ വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ ഔപചാരിക ഘടന നിലനിർത്തുന്നു.
- issue: ἐπηγγείλατο എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: അവൻ
  alternative: കർത്താവ്; ദൈവം
  rationale: സന്ദർഭത്തിൽ വാഗ്ദാനം ചെയ്തവൻ ദൈവമെന്നത് സ്വാഭാവികമാണെങ്കിലും ഈ വാക്യത്തിന്റെ ഗ്രീക്ക് പാഠത്തിൽ നാമം വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ സർവനാമം നിലനിർത്തി ഉറവിടത്തിലെ പരോക്ഷത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ വാഴ്ത്തുവാക്യത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘അനുഗൃഹീതൻ’, ‘അംഗീകൃതനായിത്തീർന്നശേഷം’, ‘പ്രാപിക്കും’ എന്നിവ dignified register നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
