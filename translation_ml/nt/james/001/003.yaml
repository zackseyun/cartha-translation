  text: γινώσκοντες ὅτι τὸ δοκίμιον ὑμῶν τῆς πίστεως κατεργάζεται ὑπομονήν·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/003.yaml
  text: because you know that the testing of your faith produces endurance[a][b].
translation:
  language: ml
  text: നിങ്ങളുടെ വിശ്വാസത്തിന്റെ പരീക്ഷണം[a] സഹനശക്തി[b] ഉളവാക്കുന്നുവെന്ന് നിങ്ങൾ അറിയുന്നതിനാൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘നിങ്ങളുടെ വിശ്വാസത്തിന്റെ തെളിയിക്കപ്പെട്ട യഥാർഥത.’ ഗ്രീക്ക് പദം പരിശോധനയുടെ പ്രക്രിയയെയോ പരിശോധനയിലൂടെ തെളിയുന്ന ഗുണത്തെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘സ്ഥിരത,’ ‘സ്ഥിരോത്സാഹം,’ അല്ലെങ്കിൽ ‘ക്ഷമയോടെയുള്ള സഹനം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: നിങ്ങൾ അറിയുന്നതുകൊണ്ടാണ്
  rationale: വാക്യം 2-ലെ ആഹ്വാനത്തോടു ബന്ധപ്പെടുന്ന വർത്തമാനകാല കർത്തൃവാചക പങ്കാളികയാണ്. പരീക്ഷകളെ സന്തോഷമായി കണക്കാക്കാനുള്ള കാരണം ഇവിടെ വ്യക്തമാകുന്നതിനാൽ മലയാളത്തിൽ കാരണാർഥം സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: ὅτι
  choice: എന്ന്
  rationale: അവർ അറിയുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ ഉദ്ധരണിപൂരകമായ ‘എന്ന്’ ഇതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὸ δοκίμιον
  choice: പരിശോധന
  rationale: ഈ പദത്തിന് പരിശോധനയുടെ പ്രക്രിയയെയോ പരിശോധനയിലൂടെ തെളിയുന്ന ഗുണത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ‘പരിശോധന’ സ്വാഭാവികമാണ്; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ὑμῶν τῆς πίστεως
  choice: നിങ്ങളുടെ വിശ്വാസത്തിന്റെ
  rationale: വായനക്കാരുടെ വിശ്വാസമാണ് പരിശോധിക്കപ്പെടുന്നതെന്ന് ജനിറ്റീവ് ഘടന വ്യക്തമാക്കുന്നു. πίστις എന്നതിന് ഇവിടെ സാധാരണവും യോജിച്ചതുമായ പരിഭാഷ ‘വിശ്വാസം’ ആണ്.
- source_word: κατεργάζεται
  choice: ഉളവാക്കുന്നു
  rationale: പരിശോധന ഒരു ഫലം സൃഷ്ടിക്കുന്നു എന്ന കാരണഫലബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὑπομονήν
  choice: സഹിഷ്ണുത
  rationale: പ്രയാസങ്ങൾക്കിടയിൽ ഉറച്ചുനിൽക്കുന്ന സഹനത്തെ സൂചിപ്പിക്കുന്നു. ‘സഹിഷ്ണുത’ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമാണ്; ‘സ്ഥിരത’, ‘അവസാനംവരെ ഉറച്ചുനിൽപ്പ്’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഈ സന്ദർഭത്തിൽ വായനക്കാരുടെ വിശ്വാസം പരീക്ഷിക്കപ്പെടുന്നതാണ് ആശയം. ‘വിശ്വാസം’ എന്നത് വ്യക്തവും പാരമ്പര്യപരമായി പരിചിതവുമായ പൊതുവായ പരിഭാഷയാണ്; പ്രത്യേക വിഭാഗീയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: δοκίμιον എന്ന പദത്തിലെ പ്രക്രിയ–ഫലം ദ്വയാർഥം
  choice: പരിശോധന
  alternative: പരിശോധനയിലൂടെ തെളിഞ്ഞ നിങ്ങളുടെ വിശ്വാസത്തിന്റെ യഥാർഥത
  rationale: സന്ദർഭം പരീക്ഷണപ്രക്രിയയിലൂടെ സഹിഷ്ണുത ഉണ്ടാകുന്നതിനെ മുൻനിർത്തുന്നു; എന്നാൽ ഗ്രീക്ക് പദത്തിന് തെളിയിക്കപ്പെട്ട ഗുണം എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വാക്യം 2-നോടുള്ള കാരണബന്ധം നിലനിർത്താൻ വാക്യാവസാനത്തിൽ ‘എന്നതുകൊണ്ടാണ്’ ഉപയോഗിച്ചു. സ്രോതസ്സിലെ പദാർഥദ്വയവും സഹനത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
