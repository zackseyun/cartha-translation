id: JAS.1.27
reference: James 1:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: ml
  text: 'പിതാവായ ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ ശുദ്ധവും മലിനമാകാത്തതുമായ മതഭക്തി ഇതാണ്: അനാഥരെയും വിധവകളെയും അവരുടെ കഷ്ടതയിൽ പരിപാലിക്കുക[a]; ലോകത്തിൽനിന്ന് സ്വയം കളങ്കപ്പെടാതെ കാത്തുസൂക്ഷിക്കുക[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അനാഥരെയും വിധവകളെയും അവരുടെ കഷ്ടതയിൽ സന്ദർശിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയയിൽ ചെന്നുകാണുന്നതും സജീവമായി കരുതുകയും സഹായിക്കുകയും ചെയ്യുന്നതും ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ലോകം’ എന്നത് സൃഷ്ടിയെ തന്നെയല്ല, ദൈവത്തോട് വിരോധമുള്ള ധാർമികമായി ദുഷിച്ച വ്യവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: മതഭക്തി
  rationale: വിശ്വാസത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതിലുപരി, പ്രവൃത്തിയിൽ പ്രകടമാകുന്ന മതപരമായ ഭക്തിയെയും ആചരണത്തെയും ഈ പദം സൂചിപ്പിക്കുന്നു. ‘മതഭക്തി’ ഈ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: ശുദ്ധവും മലിനമാകാത്തതുമായ
  rationale: ആരാധനാപരവും ധാർമികവുമായ ശുദ്ധിയുടെ ഇരട്ട ഊന്നൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം കൂടാതെ രണ്ട് ഗ്രീക്ക് വിശേഷണങ്ങളെയും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: പിതാവായ ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ
  rationale: παρά + ദത്തിവ് ദൈവത്തിന്റെ വിലയിരുത്തലിലോ സന്നിധിയിലോ എന്ന ആശയം നൽകുന്നു. ഏക ആർട്ടിക്കിളോടുകൂടിയ ‘ദൈവവും പിതാവും’ ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐπισκέπτεσθαι
  choice: പരിപാലിക്കുക
  rationale: വെറുമൊരു സന്ദർശനത്തേക്കാൾ, ആവശ്യത്തിൽ ചെന്നുകണ്ട് സജീവമായി കരുതുകയും സഹായിക്കുകയും ചെയ്യുന്നതാണ് സന്ദർഭത്തിലെ അർഥം. ‘സന്ദർശിക്കുക’ എന്ന പദസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὀρφανοὺς καὶ χήρας
  choice: അനാഥരെയും വിധവകളെയും
  rationale: സാമൂഹിക സംരക്ഷണം നഷ്ടപ്പെട്ട ദുർബല വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ തത്തുല്യപദങ്ങൾ.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: അവരുടെ കഷ്ടതയിൽ
  rationale: θλῖψις സൂചിപ്പിക്കുന്ന ദുരിതം, ഞെരുക്കം, ക്ലേശം എന്നിവ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: സ്വയം കളങ്കപ്പെടാതെ കാത്തുസൂക്ഷിക്കുക
  rationale: ധാർമിക മലിനീകരണത്തിൽനിന്ന് ജാഗ്രതയോടെ സംരക്ഷിക്കുന്നതെന്ന രൂപകം നിലനിർത്തുന്നു. ἑαυτόν പൊതുവായ ധാർമിക നിർദേശമായതിനാൽ ‘സ്വയം’ എന്ന് നൽകിയിരിക്കുന്നു.
- source_word: ἀπὸ τοῦ κόσμου
  choice: ലോകത്തിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത രൂപം നിലനിർത്തി, ‘ലോകം’ എന്നതിനെ മുഖ്യവാക്യത്തിൽ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല; സന്ദർഭത്തിലെ ധാർമിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: κόσμος എന്ന ‘ലോകം’ ധാർമിക സന്ദർഭത്തിൽ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യവാക്യത്തിൽ ‘ലോകം’ എന്ന രൂപം നിലനിർത്തി; ദൈവത്തോട് വിരോധമുള്ള ധാർമികമായി ദുഷിച്ച വ്യവസ്ഥ എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘ലോകത്തിന്റെ ദുഷിപ്പ്’ അല്ലെങ്കിൽ ‘ദൈവവിരുദ്ധമായ ലോകവ്യവസ്ഥ’ എന്ന് മുഖ്യവാക്യത്തിൽ വികസിപ്പിക്കുക.
  rationale: വികസിപ്പിച്ച പരിഭാഷ ഗ്രീക്ക് പദത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർക്കും. ‘ലോകം’ നിലനിർത്തുന്നത് സൃഷ്ടി തന്നെയാണ് തിന്മയെന്നോ സമൂഹത്തിൽനിന്ന് പൂർണമായി പിൻവാങ്ങണമെന്നോ നിർബന്ധിച്ച് വായിക്കാതെ വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: ἑαυτόν എന്ന ഏകവചന പദത്തിന്റെ പൊതുവായ പ്രയോഗം
  choice: ‘സ്വയം’
  alternative: ‘തന്നെത്താൻ’ അല്ലെങ്കിൽ പുരുഷനെ മാത്രം സൂചിപ്പിക്കുന്ന രൂപം
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗ ഏകവചനം ഇവിടെ എല്ലാവർക്കും ബാധകമായ ഒരു ധാർമിക തത്ത്വം അവതരിപ്പിക്കുന്നു; ‘സ്വയം’ ആ പൊതുവായ പ്രയോഗം കൃത്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ശൈലി. ‘മതഭക്തി’ എന്നത് പ്രവൃത്തിയിൽ പ്രകടമാകുന്ന ഭക്തിയെ സൂചിപ്പിക്കുന്നു. സമാന്തരമായ രണ്ട് infinitive ആശയങ്ങളെ അർദ്ധവിരാമംകൊണ്ട് വേർതിരിച്ച് വാക്യത്തിന്റെ ഘടന തെളിച്ചിരിക്കുന്നു.
