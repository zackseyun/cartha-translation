id: JAS.1.1
reference: James 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: ml
  text: 'ദൈവത്തിന്റെയും കർത്താവായ യേശു മശീഹായുടെയും[a] അടിമയായ[b] യാക്കോബ്, ചിതറിക്കഴിയുന്ന[c] പന്ത്രണ്ടു ഗോത്രങ്ങൾക്ക്: വന്ദനം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യേശുക്രിസ്തു.’ ഗ്രീക്ക് Χριστός എന്ന ശീർഷകം ‘മശീഹാ’ എന്നും, പേരിനോടു ചേർന്ന പതിവുരൂപത്തിൽ ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ദാസൻ.’ ഗ്രീക്ക് δοῦλος ഒരു യജമാനന് അവകാശപ്പെട്ടവനെ സൂചിപ്പിക്കുന്നു; ആ ശക്തമായ അർഥം നിലനിർത്താനാണ് ഇവിടെ ‘അടിമ’ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, ഇസ്രായേൽദേശത്തിനു പുറത്തുള്ള വിവിധ ദേശങ്ങളിൽ ചിതറിക്കഴിയുന്നവർ.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: യാക്കോബ്
  rationale: ഗ്രീക്ക് രൂപത്തിന്റെ ചരിത്രപരവും മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതവുമായ നാമരൂപം; ഇംഗ്ലീഷിലെ ‘James’ എന്ന പ്രത്യേക രൂപത്തെ മലയാളത്തിലേക്ക് ശബ്ദാന്തരം ചെയ്തിട്ടില്ല.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: δοῦλος എന്ന പദത്തോടു ബന്ധപ്പെടുന്ന ലളിതമായ ഉടമസ്ഥതാസംബന്ധം നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവായ
  rationale: യേശുവിന്റെ അധികാരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ പുതിയനിയമ ശീർഷകം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹായുടെ
  rationale: Ἰησοῦ എന്ന പേര് ശബ്ദാന്തരം ചെയ്യുകയും Χριστός എന്ന അഭിഷിക്തശീർഷകത്തിന്റെ അർഥം ‘മശീഹാ’ എന്നായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: ഒരു യജമാനനു പൂർണമായി അവകാശപ്പെട്ടവൻ എന്ന ഗ്രീക്ക് പദത്തിന്റെ ശക്തമായ അർഥം സംരക്ഷിക്കുന്നു; കൂടുതൽ മൃദുവായ ‘ദാസൻ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ταῖς δώδεκα φυλαῖς
  choice: പന്ത്രണ്ടു ഗോത്രങ്ങൾക്ക്
  rationale: ഇസ്രായേലിന്റെ പന്ത്രണ്ടു ഗോത്രങ്ങളെ ഓർമിപ്പിക്കുന്ന ഉടമ്പടിസംബന്ധമായ ഭാഷ പൊതുവാക്കാതെ നിലനിർത്തുന്നു.
- source_word: διασπορᾷ
  choice: ചിതറിപ്പാർക്കുന്ന
  rationale: വിവിധ ദേശങ്ങളിൽ ചിതറിക്കഴിയുന്ന യഹൂദജനത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതികഭാവം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളത്തിൽ നൽകുന്നു.
- source_word: χαίρειν
  choice: വന്ദനം
  rationale: ‘സന്തോഷിക്കുക’ എന്ന പദശഃ അർഥത്തിനുപകരം കത്തിന്റെ ആരംഭത്തിലെ പതിവ് അഭിവാദനപ്രയോഗം നൽകുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന ശീർഷകത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദത്തിന്റെ അഭിഷിക്തശീർഷകസ്വഭാവം സജീവമായതിനാൽ അതിന്റെ അർഥം വെളിപ്പെടുത്തുന്ന ‘മശീഹാ’ ഉപയോഗിച്ചു; പതിവായ നാമസദൃശ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: യാക്കോബിന്റെ സ്വയംവിശേഷണമായ δοῦλος
  choice: അടിമ
  alternative: ദാസൻ
  rationale: ദൈവത്തിനും കർത്താവായ യേശു മശീഹായ്ക്കും പൂർണമായി അവകാശപ്പെട്ടവൻ എന്ന ആശയത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; മലയാളത്തിലെ കൂടുതൽ മൃദുവും പരമ്പരാഗതവുമായ പദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കത്താരംഭശൈലി. മൂലത്തിലെ സംക്ഷിപ്ത അഭിവാദനഘടന നിലനിർത്തി; ‘എഴുതുന്നത്’ പോലുള്ള വിശദീകരണപദം ചേർത്തിട്ടില്ല. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ സ്ഥാനവൈകല്യം അർഥാനുസൃതമായി തിരുത്തി: [a] മശീഹാ, [b] അടിമ, [c] ചിതറിപ്പാർക്കുന്ന എന്നിങ്ങനെ ചേർത്തു.'
