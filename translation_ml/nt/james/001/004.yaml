revisions:
- from: സഹിഷ്ണുത അതിന്റെ പൂർണമായ പ്രവൃത്തി ചെയ്യട്ടെ[a]; അങ്ങനെ നിങ്ങൾ ഒന്നിലും കുറവില്ലാതെ പക്വതയും സമ്പൂർണതയും ഉള്ളവരായിത്തീരും.
  to: സഹിഷ്ണുത അതിന്റെ പൂർണമായ പ്രവൃത്തി ചെയ്യട്ടെ[a]; അങ്ങനെ നിങ്ങൾ പക്വരും സമ്പൂർണരും, ഒന്നിലും കുറവില്ലാത്തവരും ആകേണ്ടതിന്.
