id: JAS.1.22
reference: James 1:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: ml
  text: എന്നാൽ വചനം അനുസരിച്ച് പ്രവർത്തിക്കുന്നവരായിരിപ്പിൻ; നിങ്ങളെത്തന്നെ വഞ്ചിച്ചുകൊണ്ട് കേൾവിക്കാർ മാത്രമാകരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളെത്തന്നെ വ്യാമോഹിപ്പിച്ചുകൊണ്ട്,” അല്ലെങ്കിൽ “തെറ്റായ ന്യായവിചാരത്താൽ നിങ്ങളെത്തന്നെ വഴിതെറ്റിച്ചുകൊണ്ട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γίνεσθε
  choice: ആയിരിക്കുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ ജീവിതരീതിയിലേക്കുള്ള ആഹ്വാനം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യവുമായി ബന്ധിപ്പിച്ചുകൊണ്ട് ഇവിടെ വരുന്ന മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ποιηταὶ λόγου
  choice: വചനം അനുസരിച്ച് പ്രവർത്തിക്കുന്നവർ
  rationale: λόγου എന്നത് പ്രവൃത്തിയുടെ ഉള്ളടക്കമോ മാനദണ്ഡമോ ആണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വചനം’ എന്ന പ്രയോഗം യാക്കോബ് 1:21-നോടുള്ള ബന്ധവും ബൈബിൾപരമായ അനുരണനവും നിലനിർത്തുന്നു.
- source_word: ἀκροαταὶ μόνον
  choice: കേൾവിക്കാർ മാത്രം
  rationale: ποιηταί എന്നതിനോടുള്ള വാഗ്‌വൈരുധ്യവും μόνον എന്നതിന്റെ പരിമിതീകരണബലവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: παραλογιζόμενοι ἑαυτούς
  choice: നിങ്ങളെത്തന്നെ വഞ്ചിക്കരുത്
  rationale: പ്രവൃത്തിയില്ലാത്ത കേൾവിയിലൂടെ സംഭവിക്കുന്ന സ്വയംവഞ്ചന വ്യക്തമായി നൽകുന്നു; തെറ്റായ ന്യായവിചാരത്തിലൂടെ സ്വയം വഴിതെറ്റിക്കുന്ന സൂക്ഷ്മാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാക്കോബ് 1:22-ലെ λόγος എന്നതിന്റെ അർഥം
  choice: ‘വചനം’—സ്വീകരിക്കപ്പെട്ട ദൈവിക സന്ദേശം
  alternative: ‘സന്ദേശം’ അല്ലെങ്കിൽ ‘ഉപദേശം’
  rationale: 1:21-ലെ ‘നട്ടുപിടിപ്പിക്കപ്പെട്ട വചനം’ എന്ന സമീപസന്ദർഭത്തോടുള്ള തുടർച്ചയും ദൈവശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു; അതിനെ അനാവശ്യമായി കൂടുതൽ സങ്കുചിതമായ സാങ്കേതിക അർഥത്തിലാക്കുന്നില്ല.
- issue: Γίνεσθε എന്ന ആജ്ഞയുടെ ബലം
  choice: തുടർച്ചയായി അങ്ങനെ ജീവിക്കാനുള്ള ആഹ്വാനം
  alternative: ‘ആയിത്തീരുവിൻ’ എന്ന ആരംഭക അർഥം
  rationale: വർത്തമാനകാല ആജ്ഞ പതിവായ ജീവിതരീതിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘ആയിരിക്കുവിൻ’ അതിനെ അമിതവ്യാഖ്യാനമില്ലാതെ പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘വചനം പ്രവർത്തിക്കുന്നവർ’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപത്തിനു പകരം ‘വചനം അനുസരിച്ച് പ്രവർത്തിക്കുന്നവർ’ എന്നു നൽകി ഗ്രീക്ക് ആശയം വ്യക്തമായി കൈമാറി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
