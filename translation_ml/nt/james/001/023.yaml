id: JAS.1.23
reference: James 1:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: ml
  text: ഒരുവൻ വചനം കേൾക്കുന്നവനും പ്രവർത്തിക്കുന്നവനല്ലാത്തവനും ആണെങ്കിൽ, അവൻ കണ്ണാടിയിൽ തന്റെ ജന്മസിദ്ധമായ മുഖം[a] ശ്രദ്ധയോടെ നോക്കുന്ന ഒരു പുരുഷനെപ്പോലെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, “തന്റെ ജനനത്തിന്റെ മുഖം”; അതായത്, തനിക്കു ജന്മനാ ഉള്ള സ്വാഭാവിക മുഖം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροατὴς λόγου
  choice: വചനം കേൾക്കുന്നവൻ
  rationale: കേൾക്കുന്നതും പ്രവർത്തിക്കുന്നതും തമ്മിലുള്ള യാക്കോബിന്റെ ധാർമിക വൈരുധ്യം നിലനിർത്തുന്നു; λόγος എന്നതിന് സന്ദർഭാനുസൃതമായി ‘വചനം’ ഉപയോഗിക്കുന്നു.
- source_word: οὐ ποιητής
  choice: അതനുസരിച്ച് പ്രവർത്തിക്കാത്തവൻ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം വ്യക്തമാക്കിക്കൊണ്ട് ποιητής എന്ന കർത്തൃനാമത്തിന്റെ പ്രവർത്തനസാരം പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔοικεν
  choice: പോലെയാണ്
  rationale: വർത്തമാനകാല അർഥമുള്ള താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀνδρὶ
  choice: ഒരു പുരുഷൻ
  rationale: ഗ്രീക്കിലെ പ്രത്യേക പുരുഷലിംഗപദമായ ἀνήρ കൃത്യമായി നിലനിർത്തുന്നു; ഉപമയുടെ പൊതുവായ പ്രയോഗം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: κατανοοῦντι
  choice: ശ്രദ്ധയോടെ നോക്കുന്ന
  rationale: വെറുതെ ഒന്നു നോക്കുക എന്നതിലുപരി സൂക്ഷ്മമായി നിരീക്ഷിക്കുക എന്ന κατανοέωയുടെ ഭാവം പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: തനിക്കു ജന്മനാ ലഭിച്ച മുഖം
  rationale: അക്ഷരാർഥമായ ‘തന്റെ ജനനത്തിന്റെ മുഖം’ എന്ന അസ്വാഭാവിക പ്രയോഗത്തിനു പകരം, ജന്മസിദ്ധമായ സ്വാഭാവിക മുഖം എന്ന സന്ദർഭാർഥം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; അക്ഷരഘടന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν ἐσόπτρῳ
  choice: കണ്ണാടിയിൽ
  rationale: സമകാലിക മലയാളത്തിലെ നേരിട്ടും സ്വാഭാവികവുമായ പദപ്രയോഗം.
theological_decisions:
- issue: ἀνδρὶ എന്ന പദത്തിലെ പുരുഷലിംഗ പ്രതിനിധാനഭാഷ
  choice: ഒരു പുരുഷൻ
  alternative: ഒരു വ്യക്തി
  rationale: മൂലപാഠത്തിലെ ἀνήρ പ്രത്യേകമായി പുരുഷനെ സൂചിപ്പിക്കുന്നതിനാൽ അത് നിലനിർത്തുന്നു; ഉപമയുടെ വ്യാപകമായ പ്രയോഗത്തെ ഇതിലൂടെ പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. ‘കേൾക്കുന്നവൻ—പ്രവർത്തിക്കാത്തവൻ’ എന്ന വൈരുധ്യം സ്വാഭാവികമായി നിലനിർത്തി; ദുഷ്കരമായ ഗ്രീക്ക് ജനിറ്റീവ് പ്രയോഗത്തിന്റെ അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
