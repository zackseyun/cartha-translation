id: JAS.1.20
reference: James 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: ml
  text: കാരണം, മനുഷ്യന്റെ കോപം ദൈവത്തിന്റെ നീതി ഉളവാക്കുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ ἀνδρός
  choice: മനുഷ്യന്റെ കോപം
  rationale: ἀνήρ ഇവിടെ ഒരു പ്രത്യേക പുരുഷനെക്കാൾ പൊതുവായി മനുഷ്യനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ പൊതുപദം തിരഞ്ഞെടുത്തു.
- source_word: δικαιοσύνην θεοῦ
  choice: ദൈവത്തിന്റെ നീതി
  rationale: ജനിറ്റീവ് ഘടനയുടെ യഥാർഥ വ്യാപ്തി നിർബന്ധമായി ചുരുക്കാതെ, ദൈവത്തിന്റേതായതോ ദൈവം ആവശ്യപ്പെടുന്നതോ ആയ നീതി എന്ന സാധ്യതകൾ നിലനിർത്തുന്നു.
- source_word: οὐκ ἐργάζεται
  choice: പ്രവർത്തിച്ചുണ്ടാക്കുന്നില്ല
  rationale: ἐργάζομαι എന്ന ക്രിയയിലെ പ്രവർത്തിക്കുക/ഫലിപ്പിക്കുക എന്ന ഭാവം ഒരുമിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ഉപദേശത്തിന് നൽകുന്ന വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: δικαιοσύνη θεοῦ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ദൈവത്തിന്റെ നീതി
  alternative: ദൈവം ആഗ്രഹിക്കുന്ന നീതി / ദൈവസന്നിധിയിലെ നീതി
  rationale: മൂലത്തിലെ ജനിറ്റീവ് ബന്ധം ദൈവത്തിന്റെ സ്വഭാവം, ദൈവം അംഗീകരിക്കുന്ന നീതി, ദൈവം വരുത്തുന്ന നീതി എന്നിവയിൽ ഒന്നിലേക്ക് മാത്രം തീർപ്പാക്കുന്നില്ല; അതിനാൽ അർഥസാന്ദ്രമായ നേരിട്ടുള്ള രൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വാക്യത്തിന്റെ കാരണസൂചക ബന്ധവും ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
