id: JAS.1.21
reference: James 1:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: ml
  text: അതുകൊണ്ട്, എല്ലാ മാലിന്യവും കവിഞ്ഞൊഴുകുന്ന ദുഷ്ടതയും[a] നീക്കിക്കളഞ്ഞ്, സൗമ്യതയോടെ[b] നട്ടുവെച്ച വചനം[c] സ്വീകരിക്കുവിൻ; നിങ്ങളുടെ ആത്മാക്കളെ[d] രക്ഷിക്കാൻ അതിനു കഴിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദുഷ്ടതയുടെ സമൃദ്ധി’ അല്ലെങ്കിൽ ‘അധികമായ തിന്മ’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിനയത്തോടെ’ അല്ലെങ്കിൽ ‘മൃദുതയോടെ’.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘സ്വതസിദ്ധമായ വചനം’; പരമ്പരാഗതമായി ‘ഒട്ടിച്ചുചേർത്ത വചനം’.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ ‘നിങ്ങളുടെ ജീവനെ’ അല്ലെങ്കിൽ ‘നിങ്ങളെത്തന്നെ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിൽനിന്നുള്ള നിഗമനവും തുടർന്നുള്ള ആഹ്വാനവുമായുള്ള ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀποθέμενοι
  choice: നീക്കിക്കളഞ്ഞ്
  rationale: പ്രധാന കല്പനയായ δέξασθε-യോടൊപ്പമുള്ള മുൻകാലമോ അനുബന്ധമോ ആയ പ്രവൃത്തിയെ മലയാളത്തിലെ ക്രിയാവിശേഷണരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: πᾶσαν ῥυπαρίαν
  choice: എല്ലാ മാലിന്യവും
  rationale: ῥυπαρίαയിലെ അഴുക്കിന്റെ ശക്തമായ രൂപകം നിലനിർത്തുകയും സന്ദർഭത്തിൽ ധാർമിക അശുദ്ധിയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: περισσείαν κακίας
  choice: കവിഞ്ഞൊഴുകുന്ന ദുഷ്ടതയും
  rationale: περισσείαയുടെ സമൃദ്ധി/അധികത എന്ന ആശയം സജീവമായ ഭാഷയിൽ നൽകുന്നു; κακίαയെ ‘വിദ്വേഷം’ എന്ന ഇടുങ്ങിയ അർഥത്തിലാക്കാതെ ‘ദുഷ്ടത’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐν πραΰτητι
  choice: സൗമ്യതയോടെ
  rationale: പ്രതിരോധമില്ലാത്ത, വിനയമുള്ള സ്വീകരണഭാവം സൂചിപ്പിക്കുന്ന πραΰτης-ന്റെ സൗമ്യത എന്ന മുഖ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δέξασθε
  choice: സ്വീകരിക്കുവിൻ
  rationale: ആജ്ഞാരൂപത്തിന്റെ ശക്തി വ്യക്തമായി നിലനിർത്തുന്ന, ഗൗരവമുള്ള പൊതുമലയാള പ്രയോഗം.
- source_word: τὸν ἔμφυτον λόγον
  choice: നിങ്ങളിൽ നട്ടുപിടിപ്പിക്കപ്പെട്ട വചനം
  rationale: ἔμφυτος എന്ന പദത്തിലെ ഉള്ളിൽ നട്ടത്/വേരൂന്നിയത് എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; അത് എങ്ങനെ നട്ടുവെന്നത് വിശദീകരിക്കുന്നില്ല.
- source_word: τὸν δυνάμενον σῶσαι
  choice: രക്ഷിക്കാൻ അതിനു കഴിയും
  rationale: വചനത്തിന്റെ രക്ഷിക്കാനുള്ള കഴിവിനെ വ്യക്തമാക്കുന്നു; പ്രവർത്തനരീതിയെക്കുറിച്ച് മൂലപാഠത്തേക്കാൾ അധികമായി ഒന്നും ചേർക്കുന്നില്ല.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: നിങ്ങളുടെ ആത്മാക്കളെ
  rationale: രക്ഷാസന്ദർഭത്തിലെ ψυχήയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു; ‘ജീവൻ’ അല്ലെങ്കിൽ ‘നിങ്ങളെത്തന്നെ’ എന്ന സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: രക്ഷാസന്ദർഭത്തിലെ ψυχὰς ὑμῶν എന്നതിന്റെ അർഥം
  choice: നിങ്ങളുടെ ആത്മാക്കളെ
  alternative: നിങ്ങളുടെ ജീവനുകളെ; നിങ്ങളെത്തന്നെ
  rationale: ‘ആത്മാക്കളെ’ എന്നത് പരമ്പരാഗതവും ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നതുമാണ്. അതേസമയം ψυχή എന്ന പദത്തിന് ജീവൻ അല്ലെങ്കിൽ വ്യക്തി എന്ന വിശാലമായ അർഥം ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἔμφυτον λόγον എന്നതിന്റെ അർഥം
  choice: നിങ്ങളിൽ നട്ടുപിടിപ്പിക്കപ്പെട്ട വചനം
  alternative: നിങ്ങളിൽ സ്വാഭാവികമായി ഉള്ള വചനം; ഒട്ടിച്ചുചേർത്ത വചനം
  rationale: വചനം ദൈവത്താൽ ഉള്ളിൽ നട്ടതാണോ ഇപ്പോൾ കേൾവിക്കാരിൽ വേരൂന്നിയിരിക്കുന്നതാണോ എന്നതിനെ മൂലപാഠം വിശദീകരിക്കുന്നില്ല. തിരഞ്ഞെടുത്ത പരിഭാഷ ഈ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്വീകരിക്കുവിൻ’ എന്ന രൂപം കല്പനയുടെ ഔന്നത്യം നിലനിർത്തുന്നു; മറ്റു പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദബന്ധങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
