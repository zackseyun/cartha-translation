  naturalness: ‘നട്ടുവെച്ച വചനം’ ആധുനിക നിലവാരമലയാളത്തിൽ ‘നട്ടുപിടിപ്പിക്കപ്പെട്ട വചനം’ എന്നതിനെക്കാൾ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്. അടിക്കുറിപ്പിലെ ‘നിങ്ങളുടെ ജീവനുകളെ’ മലയാളത്തിൽ അസ്വാഭാവികമാണ്; ‘നിങ്ങളുടെ ജീവനെ’ സ്വാഭാവികമാണ്.
