id: JAS.1.18
reference: James 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: ml
  text: തന്റെ ഇഷ്ടപ്രകാരം[a] സത്യത്തിന്റെ വചനത്താൽ അവൻ നമ്മെ ജനിപ്പിച്ചു; നാം അവന്റെ സൃഷ്ടികളിൽ ഒരുതരം ആദ്യഫലമായി[b] ആകേണ്ടതിനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവൻ ഇച്ഛിച്ചതിനാൽ.’'
    reason: കൃദന്തരൂപമായ βουληθεὶς ദൈവത്തിന്റെ സ്വന്തം ഇച്ഛയെയോ തീരുമാനത്തെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അതിന് കാരണാർഥവും ഉണ്ട്.
  - marker: b
    text: ‘ആദ്യഫലം’ എന്നത് വിളവിൽ ആദ്യം ലഭിച്ച് ദൈവത്തിനു സമർപ്പിക്കപ്പെട്ട പങ്കിനെ അനുസ്മരിപ്പിക്കുന്നു. ഇവിടെ വിശ്വാസികളെ ദൈവം സൃഷ്ടിച്ചവയുടെ ഇടയിലെ, അവനുവേണ്ടി വേർതിരിക്കപ്പെട്ട ഒരു ആദ്യപങ്കായി ചിത്രീകരിക്കുന്നു.
    reason: പുരാതന വിളവെടുപ്പ്-സമർപ്പണ രൂപകത്തിന്റെ സാംസ്കാരികവും ബൈബിൾപരവുമായ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: βουληθεὶς
  choice: താൻ ഇച്ഛിച്ചതുകൊണ്ട്
  rationale: അഓറിസ്റ്റ് കൃദന്തരൂപം പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ദൈവിക ഇച്ഛയെയും സന്ദർഭത്തിലെ സാധ്യതയേറിയ കാരണാർഥത്തെയും സൂചിപ്പിക്കുന്നു. ഈ രൂപം ദൈവിക മുൻകൈ വ്യക്തമാക്കുന്നു; എന്നാൽ ഒരു പ്രത്യേക സിദ്ധാന്തവ്യവസ്ഥ ചുമത്തുന്നില്ല.
- source_word: ἀπεκύησεν
  choice: നമ്മെ ജനിപ്പിച്ചു
  rationale: ἀποκυέω എന്ന ക്രിയയിലെ പ്രസവം/ജനനം എന്ന രൂപകം നിലനിർത്തുന്നു; 1:15-ലെ ‘ജനിപ്പിക്കുന്നു’ എന്ന ദൃശ്യവുമായി ഇതു ബന്ധപ്പെടുകയും ചെയ്യുന്നു.
- source_word: λόγῳ ἀληθείας
  choice: സത്യത്തിന്റെ വചനത്താൽ
  rationale: ദാതിവ് ഇവിടെ ഉപകരണാർഥകമാണ്. ‘സത്യത്തിന്റെ വചനം’ എന്നത് സത്യമായ സുവിശേഷസന്ദേശത്തെ സൂചിപ്പിക്കാൻ കഴിയുന്ന, പരിചിതവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ പ്രയോഗമാണ്.
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: നാം ... തീരേണ്ടതിനായിരുന്നു അത്
  rationale: εἰς + ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് ഉദ്ദേശ്യം/ഫലം പ്രകടിപ്പിക്കുന്നു. ഈ മലയാളരൂപം ഉദ്ദേശ്യബലം നിലനിർത്തുമ്പോഴും അതിനെ അനാവശ്യമായി നിർണയവാദപരമാക്കുന്നില്ല.
- source_word: ἀπαρχήν
  choice: ആദ്യഫലം
  rationale: വിളവിന്റെ ആദ്യം ലഭിക്കുന്നതും ദൈവത്തിനു സമർപ്പിക്കപ്പെടുന്നതുമായ പങ്കിനെ സൂചിപ്പിക്കുന്ന ബൈബിൾരൂപകം നിലനിർത്തുന്നു.
- source_word: τινα
  choice: ഒരുതരം
  rationale: ഇത് സംഖ്യയെയല്ല, വിധേയപദത്തെ മൃദുവായി യോഗ്യമാക്കുന്ന അർഥത്തെയാണ് ഇവിടെ നൽകുന്നത്.
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: അവന്റെ സൃഷ്ടികളിൽ
  rationale: κτίσματα എന്ന ബഹുവചനത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; അതിനെ മനുഷ്യരിലേക്കു മാത്രം ചുരുക്കുന്നില്ല. ആദ്യഫലം ഒരു വലിയ കൂട്ടത്തിനുള്ളിലെ ആദ്യപങ്കാണെന്ന ബന്ധം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘സൃഷ്ടികളിൽ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: പുതുജനനത്തിലെ ദൈവിക മുൻകൈ
  choice: ദൈവത്തിന്റെ ഇച്ഛയാണ് നമ്മെ ജനിപ്പിച്ചതിന്റെ കാരണമെന്ന് വാചകം വ്യക്തമാക്കുന്നു; എന്നാൽ മുൻനിർണയത്തെയോ പുതുജനനത്തെയോ കുറിച്ചുള്ള ഏതെങ്കിലും സമ്പൂർണ മതവിഭാഗീയ വ്യവസ്ഥ ഇതിൽ ചേർക്കുന്നില്ല.
  alternative: ‘തന്റെ സ്വന്തം ഇഷ്ടപ്രകാരം’ എന്ന പരമ്പരാഗത രൂപം, അല്ലെങ്കിൽ പുതുജനനസിദ്ധാന്തം തുറന്നുപറയുന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം.
  rationale: ഗ്രീക്കിൽ ദൈവത്തിന്റെ ഇച്ഛ പ്രധാനക്രിയയ്ക്കു മുൻപും അതുമായി കാരണബന്ധത്തിലും നിൽക്കുന്നു; അതിലപ്പുറമുള്ള സിദ്ധാന്തനിഗമനങ്ങൾ വാക്യം തന്നെ നിർവചിക്കുന്നില്ല.
- issue: κτισμάτων എന്നതിന്റെ വ്യാപ്തി
  choice: ‘അവന്റെ സൃഷ്ടികൾ’ എന്ന വിശാലമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘അവന്റെ സകല സൃഷ്ടിയും’ അല്ലെങ്കിൽ ‘അവൻ സൃഷ്ടിച്ച മനുഷ്യർ’.
  rationale: ഗ്രീക്ക് പദം സൃഷ്ടിക്കപ്പെട്ട ജീവികളെയും വസ്തുക്കളെയും വിശാലമായി സൂചിപ്പിക്കാം. മനുഷ്യരിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നത് ഉറവിടത്തിൽ ഇല്ലാത്ത പ്രത്യേകത ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ജനിപ്പിച്ചു’, ‘സത്യത്തിന്റെ വചനം’, ‘ആദ്യഫലം’ എന്നീ പ്രധാന ബൈബിൾരൂപങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; അപരിചിതമായ സംസ്കൃതഭാരമുള്ള പദങ്ങളും മതവിഭാഗീയ സാങ്കേതികഭാഷയും ഒഴിവാക്കി.
