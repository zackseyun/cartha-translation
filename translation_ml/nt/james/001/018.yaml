revisions:
- from: താൻ ഇച്ഛിച്ചതുകൊണ്ട്[a], സത്യത്തിന്റെ വചനത്താൽ അവൻ നമ്മെ ജനിപ്പിച്ചു; നാം അവന്റെ സൃഷ്ടികളിൽ ഒരുതരം ആദ്യഫലമായി[b] തീരേണ്ടതിനായിരുന്നു അത്.
  to: തന്റെ ഇഷ്ടപ്രകാരം[a] സത്യത്തിന്റെ വചനത്താൽ അവൻ നമ്മെ ജനിപ്പിച്ചു; നാം അവന്റെ സൃഷ്ടികളിൽ ഒരുതരം ആദ്യഫലമായി[b] ആകേണ്ടതിനായി.
  rationale: The revision improves natural modern Malayalam while preserving the Greek’s voluntary divine initiative, childbirth metaphor, instrumental phrase, purpose relation, qualifying τις (‘ഒരുതരം’), and the broad scope of ‘his creatures.’ It neither narrows κτισμάτων nor imports a doctrinal account beyond the verse.
