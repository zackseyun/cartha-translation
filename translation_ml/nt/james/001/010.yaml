  terminology: താഴ്ത്തപ്പെടൽ is an apt non-doctrinal choice for ταπείνωσις. ധനികനോ naturally conveys the δέ-linked contrast/parallel with the preceding verse. പുല്ലിന്റെ പൂവ് is suitably literal and the footnote properly explains the image.
