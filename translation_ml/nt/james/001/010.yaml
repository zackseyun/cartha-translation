id: JAS.1.10
reference: James 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: ml
  text: ധനികനോ തന്റെ താഴ്ത്തപ്പെടലിൽ[a]; കാരണം, അവൻ പുല്ലിന്റെ പൂവുപോലെ കടന്നുപോകും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മൂലഗ്രീക്കിൽ ഈ വാക്യത്തിൽ ക്രിയ ഇല്ല; മുൻവാക്യത്തിൽനിന്ന് അർഥം പൂരിപ്പിക്കാം: “ധനികനോ തന്റെ താഴ്ത്തപ്പെടലിൽ അഭിമാനിക്കട്ടെ.” അക്ഷരാർഥത്തിൽ: “ധനികനോ തന്റെ താഴ്ത്തപ്പെടലിൽ.”'
    reason: alternative_reading
  - marker: b
    text: “പുല്ലിന്റെ പൂവ്” എന്നത് ഗ്രീക്കിലെ ദൃശ്യബിംബത്തിന്റെ അക്ഷരാർഥത്തിലുള്ള വിവർത്തനമാണ്; പൂത്തുനിൽക്കുന്ന സസ്യംപോലെ ധനികൻ വേഗത്തിൽ മാഞ്ഞുപോകുന്നതിനെ ഇത് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: ധനികനോ
  rationale: മുൻവാക്യത്തിലെ താഴ്ന്ന നിലയിലുള്ള സഹോദരനോടുള്ള സമാന്തരതയും വ്യത്യാസവും മലയാളത്തിലെ ‘-ഓ’ എന്ന ഘടന സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. substantival masculine singular ആയതിനാൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ‘ധനികൻ’ നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: തന്റെ താഴ്ത്തപ്പെടലിൽ
  rationale: ταπείνωσις ഇവിടെ വിനയമെന്ന ഗുണത്തേക്കാൾ ധനികൻ താഴ്ത്തപ്പെടുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘താഴ്ത്തപ്പെടൽ’ സാമൂഹികമായ താഴ്ചയെയും ജീവിതത്തിന്റെയും സമ്പത്തിന്റെയും ക്ഷണികത മൂലമുള്ള അപമാനകരമായ താഴ്ത്തലിനെയും തുറന്നുവയ്ക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ധനികൻ തന്റെ താഴ്ത്തപ്പെടലിൽ അഭിമാനിക്കേണ്ടതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന വ്യക്തമായ കാരണബന്ധം നിലനിർത്തുന്നു.
- source_word: ὡς ἄνθος χόρτου
  choice: പുല്ലിന്റെ പൂവുപോലെ
  rationale: ഗ്രീക്കിലെ ശാബ്ദിക ദൃശ്യബിംബവും വേഗത്തിൽ വാടിപ്പോകുന്ന സസ്യത്തിന്റെ ക്ഷണികതയും നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘വയൽ’ ചേർക്കുന്നില്ല.
- source_word: παρελεύσεται
  choice: അവൻ കടന്നുപോകും
  rationale: παρέρχομαι എന്ന ക്രിയയുടെ ക്ഷണികതയും അപ്രത്യക്ഷമാകലും ഉൾക്കൊള്ളുന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിലെ കർത്താവായ ധനികനെ ‘അവൻ’ വ്യക്തമാക്കി.
theological_decisions:
- issue: മുൻവാക്യത്തിലെ ക്രിയയുടെ അധ്യാഹാരം
  choice: വായനാസൗകര്യത്തിനായി മുൻവാക്യത്തിലെ ‘അഭിമാനിക്കട്ടെ’ എന്ന ക്രിയ മുഖ്യപാഠത്തിൽ അധ്യാഹരിക്കുന്നു; അത് മൂലഗ്രീക്കിൽ ഈ വാക്യത്തിൽ ആവർത്തിക്കുന്നില്ലെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ഗ്രീക്കിലുള്ള പദങ്ങൾ മാത്രം വിവർത്തനം ചെയ്ത് ക്രിയയെ പറയാതെ വിടുക.
  rationale: യാക്കോബ് 1:10 വ്യാകരണപരമായി 1:9-ലെ ആജ്ഞാക്രിയയെ ആശ്രയിക്കുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ ക്രിയയില്ലാത്ത രൂപം അസ്വാഭാവികവും അവ്യക്തവുമാകുന്നതിനാൽ അധ്യാഹാരം വ്യക്തമാക്കുന്നത് അർഥം മാറ്റാതെ ബന്ധം അറിയിക്കുന്നു.
- issue: ധനികന്റെ ταπείνωσις എന്നതിന്റെ അർഥം
  choice: ധനികൻ താഴ്ത്തപ്പെടുന്ന അവസ്ഥ
  alternative: സ്വമേധയായ വിനയം; പൊതുവായ താഴ്ന്ന സാമൂഹികനില
  rationale: ‘പുല്ലിന്റെ പൂവുപോലെ കടന്നുപോകും’ എന്ന തുടർന്നുള്ള കാരണം സമ്പത്തിന്റെയും ജീവിതത്തിന്റെയും ക്ഷണികതയിലൂടെ സംഭവിക്കുന്ന താഴ്ത്തലിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. ‘താഴ്ത്തപ്പെടൽ’ എന്ന രൂപം അതിനെ ഒരു നൈതിക സദ്ഗുണമായി മാത്രം വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘താഴ്ത്തപ്പെടൽ’ എന്ന പദം ‘അപമാനം’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ, താഴ്ന്ന അവസ്ഥയിലാക്കപ്പെടുന്നതിന്റെ വിശാലമായ ഭാവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
