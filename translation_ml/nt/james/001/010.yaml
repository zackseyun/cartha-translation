  source_fidelity: 'The lexical renderings are sound: ധനികൻ reflects the masculine substantival πλούσιος; തന്റെ താഴ്ത്തപ്പെടലിൽ appropriately expresses ταπείνωσις as being brought low rather than the virtue of humility; and പുല്ലിന്റെ പൂവുപോലെ retains the Greek image. However, the main text supplies അഭിമാനിക്കട്ടെ, whereas the English POB audit decision for this verse deliberately retains the Greek ellipsis and places the supplied sense in a note. The Malayalam should preserve that audited formal feature as far as possible.'
