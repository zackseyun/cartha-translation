id: JAS.1.8
reference: James 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνὴρ δίψυχος, ἀκατάστατος ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/008.yaml
  text: a double-minded man[a], unstable in all his ways.
translation:
  language: ml
  text: ഇരുമനസ്സുള്ള മനുഷ്യൻ[a], തന്റെ എല്ലാ വഴികളിലും അസ്ഥിരനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഇരുമനസ്സുള്ള വ്യക്തി, തന്റെ എല്ലാ വഴികളിലും അസ്ഥിരനാണ്.’ ഗ്രീക്കിൽ പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും ഇവിടെ അത് പൊതുവായ പ്രതിനിധിപരമായ അർഥത്തിലായിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: മനുഷ്യൻ
  rationale: ഗ്രീക്കിൽ പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും മുൻവാക്യത്തിലെ പൊതുവായ അപേക്ഷകനെ പ്രതിനിധീകരിക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യൻ’ മൂലരൂപത്തിന്റെ ഏകവചനസ്വഭാവവും പ്രതിനിധിപരമായ അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δίψυχος
  choice: ഇരുമനസ്സുള്ള
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘രണ്ട് ആത്മാവുള്ള’ എന്നതോടടുത്തതാണെങ്കിലും, വിഭജിതമായ ഉള്ളത്തെയും ചാഞ്ചാട്ടമുള്ള വിശ്വസ്തതയെയും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നത് ‘ഇരുമനസ്സുള്ള’ എന്ന പ്രയോഗമാണ്.
- source_word: ἀκατάστατος
  choice: അസ്ഥിരൻ
  rationale: സ്ഥിരതയില്ലാത്തതും ആശ്രയിക്കാനാവാത്തവിധം ചാഞ്ചാടുന്നതുമായ അവസ്ഥയെ ഈ സന്ദർഭത്തിൽ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ‘ക്രമരഹിതൻ’ എന്നത് സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികം സാമൂഹികമോ ധാർമികമോ ആയ ഊന്നൽ നൽകാം.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: തന്റെ എല്ലാ വഴികളിലും
  rationale: ‘വഴികൾ’ എന്ന രൂപകം ഒരാളുടെ ജീവിതരീതിയുടെയും പ്രവർത്തനങ്ങളുടെയും സമഗ്രതയെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്ക് രൂപകത്തെ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: പുരുഷലിംഗ ഏകവചനത്തിന്റെ പ്രതിനിധിപരമായ പ്രയോഗം
  choice: പ്രധാനപാഠത്തിൽ ‘മനുഷ്യൻ’ നിലനിർത്തി
  alternative: ‘ഇരുമനസ്സുള്ള വ്യക്തി, തന്റെ എല്ലാ വഴികളിലും അസ്ഥിരനാണ്’
  rationale: ഗ്രീക്ക് പുരുഷലിംഗ ഏകവചനരൂപം ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും ആശയം പുരുഷന്മാർക്ക് മാത്രമായി പരിമിതമല്ല. ‘മനുഷ്യൻ’ എന്നത് മൂലരൂപം നിലനിർത്തുകയും അതിന്റെ പൊതുവായ പ്രതിനിധിപരമായ ശക്തി മലയാളത്തിൽ അനുവദിക്കുകയും ചെയ്യുന്നു; ഈ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ഇരുമനസ്സുള്ള’ എന്ന പരിചിതമായ പ്രയോഗം ഉപയോഗിച്ച് δίψυχος എന്ന പദത്തിലെ ആന്തരിക വിഭജനം നിലനിർത്തുന്നു; ‘വഴികൾ’ എന്ന ജീവിതരൂപകവും സംരക്ഷിക്കുന്നു.
