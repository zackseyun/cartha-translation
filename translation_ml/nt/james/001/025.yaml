id: JAS.1.25
reference: James 1:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: ml
  text: എന്നാൽ സമ്പൂർണമായ ന്യായപ്രമാണത്തിലേക്ക്, അതായത് സ്വാതന്ത്ര്യത്തിന്റെ ന്യായപ്രമാണത്തിലേക്ക്[a], ഉറ്റുനോക്കുകയും അതിൽ തുടരുകയും ചെയ്യുന്നയാൾ—മറന്നുപോകുന്ന ഒരു ശ്രോതാവാകാതെ, പ്രവൃത്തി ചെയ്യുന്നവനായി—തന്റെ പ്രവൃത്തിയിൽ അനുഗ്രഹിക്കപ്പെടും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “സ്വാതന്ത്ര്യത്തിന്റെ സമ്പൂർണ ന്യായപ്രമാണം.”'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “തന്റെ ചെയ്യലിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: സൂക്ഷ്മമായി നോക്കുകയും
  rationale: ക്രിയയിൽ കുനിഞ്ഞുനോക്കുക, ശ്രദ്ധാപൂർവം ഉള്ളിലേക്കു നോക്കുക എന്നീ ദൃശ്യഭാവങ്ങൾ അടങ്ങിയിരിക്കുന്നു. ആകസ്മികമായൊരു നോട്ടമല്ലെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘സൂക്ഷ്മമായി നോക്കുക’ വ്യക്തമാക്കുന്നു.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: സ്വാതന്ത്ര്യത്തിന്റെ സമ്പൂർണ ന്യായപ്രമാണം
  rationale: τέλειον എന്നതിന്റെ പൂർണത/സമ്പൂർണത എന്ന അർഥം നിലനിർത്തുന്നു; τὸν τῆς ἐλευθερίας മുൻപുള്ള ന്യായപ്രമാണത്തെ വിശദീകരിക്കുന്ന ഘടനയായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധപ്രയോഗം സ്വീകരിച്ചു.
- source_word: παραμείνας
  choice: അതിൽ നിലനിൽക്കുകയും
  rationale: ഒരിക്കൽ മാത്രം ശ്രദ്ധിക്കുന്നതിനു പകരം തുടർന്നുനിൽക്കുന്നതും സ്ഥിരത പുലർത്തുന്നതുമായ ആശയം നൽകുന്നു.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: മറന്നുപോകുന്ന കേൾവിക്കാരനാകാതെ
  rationale: ‘മറവിയുടെ കേൾവിക്കാരൻ’ എന്ന അക്ഷരാർഥഘടന മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ഗ്രീക്കിലെ ഗുണസൂചകമായ ജനിറ്റീവ് ആശയം വ്യക്തമായി പകരുന്നു.
- source_word: ποιητὴς ἔργου
  choice: പ്രവൃത്തി ചെയ്യുന്നവനായി
  rationale: ἔργον എന്ന ‘പ്രവൃത്തി/ചെയ്തി’യുടെ ആശയം നിലനിർത്തുകയും ‘വചനം ചെയ്യുന്നവൻ’ എന്ന് സമീപസന്ദർഭത്തിൽനിന്ന് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു. ‘പ്രവൃത്തിയുടെ ചെയ്യുന്നവൻ’ എന്ന കടുപ്പമുള്ള രൂപം ഒഴിവാക്കുന്നു.
- source_word: μακάριος
  choice: അനുഗൃഹീതനായിരിക്കും
  rationale: വെറും മാനസിക സന്തോഷത്തേക്കാൾ ദൈവാനുഗ്രഹവുമായി ബന്ധപ്പെട്ട സമൃദ്ധമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: താൻ ചെയ്യുന്നതിൽ
  rationale: ‘ചെയ്യൽ’ എന്ന നാമരൂപവുമായി ഉള്ള ബന്ധം അർഥപരമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ ... οὗτος
  choice: ചെയ്യുന്നയാൾ ... അനുഗൃഹീതനായിരിക്കും
  rationale: പുരുഷന്മാർക്ക് മാത്രമായി ചുരുക്കാതെ, ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിസ്വഭാവം ‘യാൾ’ എന്ന പൊതുപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘സ്വാതന്ത്ര്യത്തിന്റെ ന്യായപ്രമാണം’ എന്നതിന്റെ വ്യാഖ്യാനം
  choice: ‘സ്വാതന്ത്ര്യത്തിന്റെ സമ്പൂർണ ന്യായപ്രമാണം’ എന്ന പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തി.
  alternative: ‘സ്വാതന്ത്ര്യം നൽകുന്ന സമ്പൂർണ ന്യായപ്രമാണം’
  rationale: ഇത് സുവിശേഷത്തെയോ, നിറവേറിയ ധാർമികനിയമത്തെയോ, ദൈവിക ഉപദേശത്തെ പൊതുവായോ സൂചിപ്പിക്കുന്നുവെന്ന് പരിഭാഷയിൽ തീരുമാനിക്കുന്നില്ല; മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: വ generic masculine ഏകവചനത്തിന്റെ പ്രതിനിധാനം
  choice: ലിംഗപരമായി ഉൾക്കൊള്ളുന്ന ഏകവചനമായ ‘ചെയ്യുന്നയാൾ’ ഉപയോഗിച്ചു.
  alternative: ‘ആ മനുഷ്യൻ’ / ‘അവൻ’
  rationale: സന്ദർഭത്തിലെ പുല്ലിംഗ ഏകവചനം പുരുഷന്മാർക്ക് മാത്രമുള്ളതല്ല; അതിന്റെ പ്രതിനിധിസ്വഭാവവും ഏകവചനവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം ഗൗരവവും മാന്യതയും നിലനിർത്തി. ‘ന്യായപ്രമാണം’, ‘അനുഗൃഹീതൻ’ എന്നീ ബൈബിൾപരിചിത പദങ്ങൾ സൂക്ഷിച്ചു; അസ്വാഭാവികമായ അക്ഷരാർഥഘടനകൾ ഒഴിവാക്കി. പ്രധാനപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും [a], [b] എന്നിങ്ങനെ ചേർത്തിരിക്കുന്നു.
