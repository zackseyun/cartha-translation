id: JAS.1.14
reference: James 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: ml
  text: എന്നാൽ ഓരോരുത്തനും പ്രലോഭിപ്പിക്കപ്പെടുന്നത് സ്വന്തം ആഗ്രഹത്താൽ വലിച്ചിഴയ്ക്കപ്പെട്ടും വശീകരിക്കപ്പെട്ടുമാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആഗ്രഹം’ എന്നതിന് ‘തീവ്രമായ മോഹം’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം ലൈംഗിക മോഹം മാത്രമല്ല, ശക്തമായ ആഗ്രഹത്തെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വലിച്ചിഴയ്ക്കപ്പെട്ടും വശീകരിക്കപ്പെട്ടും’ എന്ന പദജോടി, ഇരയെയോ മീനെയോ ഇരകാട്ടി ആകർഷിച്ച് കുടുക്കിലാക്കുന്ന ദൃശ്യരൂപം ഉണർത്തുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: ഓരോരുത്തനും
  rationale: ഗ്രീക്കിലെ വിതരണാത്മകമായ ഏകവചന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ ദൈവം ആരെയും പ്രലോഭിപ്പിക്കുന്നില്ലെന്ന പ്രസ്താവനയോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: πειράζεται
  choice: പ്രലോഭിപ്പിക്കപ്പെടുന്നത്
  rationale: ഈ സന്ദർഭത്തിൽ പൊതുവായ പരീക്ഷയെക്കാൾ പാപത്തിലേക്കുള്ള പ്രേരണയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: സ്വന്തം ആഗ്രഹത്താൽ
  rationale: പ്രലോഭനത്തിന്റെ സമീപകാരണം വ്യക്തിയുടെ സ്വന്തം ആഗ്രഹമാണെന്ന ആശയം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐξελκόμενος
  choice: വലിച്ചിഴയ്ക്കപ്പെട്ടും
  rationale: പുറത്തേക്കു വലിച്ചുകൊണ്ടുപോകപ്പെടുന്ന ശക്തമായ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ഇതോടൊപ്പമുള്ള ഇരയെയോ മീനെയോ കുടുക്കിലേക്കു വശീകരിക്കുന്ന രൂപകത്തോടും യോജിക്കുന്നു.
- source_word: δελεαζόμενος
  choice: വശീകരിക്കപ്പെട്ടുമാണ്
  rationale: ചൂണ്ടയോ ഇരയോ കാണിച്ച് കുടുക്കിലേക്കു ആകർഷിക്കുന്ന രൂപകവും പാപത്തിലേക്കുള്ള മോഹിപ്പിക്കലും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: ദൈവവുമായി ബന്ധപ്പെട്ട് പ്രലോഭനത്തിന്റെ ഉറവിടം
  choice: പ്രലോഭനത്തിന്റെ സമീപ ഉറവിടമായി വ്യക്തിയുടെ സ്വന്തം ആഗ്രഹത്തെ വ്യക്തമാക്കുന്നു.
  alternative: ഇത് ബാഹ്യ സാഹചര്യങ്ങളിൽ നിന്നുള്ള പൊതുവായ പരീക്ഷ മാത്രമാണെന്ന് മൃദൂകരിക്കുക.
  rationale: തൊട്ടുമുൻപുള്ള വാക്യം ദൈവം ആരെയും പ്രലോഭിപ്പിക്കുന്നില്ലെന്ന് നിഷേധിക്കുന്നു; ഈ വാക്യം വ്യക്തിയുടെ സ്വന്തം ആഗ്രഹത്തെ പ്രലോഭനത്തിന്റെ ഉറവിടമായി ചൂണ്ടിക്കാണിക്കുന്നു.
- issue: പ്രതിനിധാന ഏകവചനത്തിന്റെ ലിംഗരൂപം
  choice: ലിംഗം വ്യക്തമാക്കാതെ ‘ഓരോരുത്തനും’, ‘സ്വന്തം’ എന്നീ മലയാള ഏകവചന രൂപങ്ങൾ ഉപയോഗിച്ചു.
  alternative: പുരുഷലിംഗം പ്രകടമാക്കുന്ന ‘അവന്റെ സ്വന്തം’ ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ ഏകവചനവും വ്യക്തിഗത ഉത്തരവാദിത്വവും മലയാളത്തിൽ പൂർണമായി നിലനിൽക്കുന്നു; മലയാളത്തിലെ ‘സ്വന്തം’ സ്വാഭാവികമായി മുൻപുള്ള ‘ഓരോരുത്തനും’ എന്നതിലേക്കു മടങ്ങുന്നതിനാൽ മൂലത്തിൽ ഇല്ലാത്ത ലിംഗഊന്നൽ ചേർക്കേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലത്തിലെ വ്യക്തിഗത ഊന്നലും രണ്ടു പങ്കാളിക്രിയകളുടെ രൂപകാത്മക ശക്തിയും സംരക്ഷിച്ചു.
