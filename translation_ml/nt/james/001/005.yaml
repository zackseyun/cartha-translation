id: JAS.1.5
reference: James 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളിൽ ആർക്കെങ്കിലും ജ്ഞാനം കുറവാണെങ്കിൽ, എല്ലാവർക്കും ഉദാരമായി നൽകുകയും കുറ്റപ്പെടുത്താതിരിക്കുകയും[a] ചെയ്യുന്ന ദൈവത്തോട് ആ വ്യക്തി[b] ചോദിക്കട്ടെ; അത് ആ വ്യക്തിക്ക് നൽകപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കുറ്റം കണ്ടെത്താതിരിക്കുകയും’ അല്ലെങ്കിൽ ‘നിന്ദിക്കാതിരിക്കുകയും.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ഇവിടെ ഏകവചന രൂപങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അവ നിങ്ങളിൽ ഏതൊരു വ്യക്തിയെയും പ്രതിനിധീകരിക്കുന്ന പൊതുവായ അർഥത്തിലാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: Εἰ δέ
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: δέ മുൻവാക്യത്തിൽനിന്നുള്ള മൃദുവായ വികാസമോ വ്യത്യാസമോ സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ അതിന്റെ ബന്ധകശക്തി അതിശയിപ്പിക്കാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τις ὑμῶν
  choice: നിങ്ങളിൽ ആർക്കെങ്കിലും
  rationale: അനിശ്ചിതമായ τις-ഉം ഭാഗിക ഷഷ്ഠിയായ ὑμῶν-ഉം ചേർന്ന പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള ഇടയസംബോധന സ്വാഭാവിക മലയാളത്തിൽ ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: λείπεται σοφίας
  choice: ജ്ഞാനം കുറവാണെങ്കിൽ
  rationale: λείπεται ഇവിടെ എന്തെങ്കിലും ഇല്ലാതിരിക്കുകയോ ആവശ്യത്തിന് തികയാതിരിക്കുകയോ ചെയ്യുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ജ്ഞാനം കുറവാണെങ്കിൽ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്; ജ്ഞാനത്തിന്റെ അർഥം സന്ദർഭാതീതമായി ചുരുക്കുന്നില്ല.
- source_word: αἰτείτω παρὰ τοῦ ... θεοῦ
  choice: ദൈവത്തോട് ... ചോദിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന വർത്തമാന ആജ്ഞയെ ‘ചോദിക്കട്ടെ’ നന്നായി പ്രതിനിധീകരിക്കുന്നു; παράയുടെ ഉറവിടഭാവം മലയാളത്തിലെ ‘ദൈവത്തോട് ചോദിക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിൽ പ്രകടമാകുന്നു.
- source_word: πᾶσιν ἁπλῶς
  choice: എല്ലാവർക്കും ഉദാരമായി
  rationale: ഈ നൽകൽസന്ദർഭത്തിൽ ἁπλῶς ലളിതത്വത്തേക്കാൾ മടിയില്ലാത്ത ഉദാരതയെ സൂചിപ്പിക്കുന്നു. ‘ഉദാരമായി’ ആ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: μὴ ὀνειδίζοντος
  choice: കുറ്റപ്പെടുത്താതിരിക്കുകയും
  rationale: ὀνειδίζω കുറ്റപ്പെടുത്തുക, നിന്ദിക്കുക, അപമാനിക്കുക എന്നീ ആശയങ്ങൾ വഹിക്കുന്നു. ഇവിടെ ചോദിക്കുന്നവനെ ദൈവം കുറ്റം ചുമത്തി ലജ്ജിപ്പിക്കുന്നില്ല എന്ന ആശയം ‘കുറ്റപ്പെടുത്താതിരിക്കുക’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δοθήσεται αὐτῷ
  choice: അത് ആ വ്യക്തിക്ക് നൽകപ്പെടും
  rationale: ഭാവികാല കർമണി രൂപം നേരിട്ട് നിലനിർത്തുന്നു; ‘അത്’ ജ്ഞാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ഏകവചന പരാമർശവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പ്രതിനിധാനപരമായ ഏകവചന വ്യക്തിപരാമർശം
  choice: ആ വ്യക്തി ... ആ വ്യക്തിക്ക്
  alternative: അവൻ ... അവന്
  rationale: ഗ്രീക്കിലെ ഏകവചന രൂപങ്ങളുടെ പൊതുവായ, പ്രതിനിധാനപരമായ വ്യാപ്തി നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അനാവശ്യമായി പുരുഷന്മാരിലേക്കു മാത്രം അർഥം ചുരുങ്ങാതിരിക്കാൻ ഏകവചനമായ ‘ആ വ്യക്തി’ ഉപയോഗിച്ചു.
- issue: ἁπλῶς എന്ന പദത്തിൽ ദൈവത്തിന്റെ നൽകലിന്റെ സ്വഭാവം
  choice: ഉദാരമായി
  alternative: കലർപ്പില്ലാതെ / ലളിതമായി
  rationale: ജ്ഞാനം ചോദിക്കുന്ന സന്ദർഭത്തിൽ ദൈവം മടിയില്ലാതെ ധാരാളമായി നൽകുന്നു എന്നതാണ് ഏറ്റവും സാദ്ധ്യമായ അർഥം. സമൃദ്ധിവാദപരമായ ആശയം ചേർക്കാതെ ‘ഉദാരമായി’ ഈ ഭാവം നൽകുന്നു.
- issue: μὴ ὀνειδίζοντος എന്നതിന്റെ ഭാവം
  choice: കുറ്റപ്പെടുത്താതിരിക്കുകയും
  alternative: നിന്ദിക്കാതിരിക്കുകയും / കുറ്റം കണ്ടെത്താതിരിക്കുകയും
  rationale: ദൈവം ചോദിക്കുന്നവനെ കുറ്റം ചുമത്തിയോ ലജ്ജിപ്പിച്ചോ പിന്തിരിപ്പിക്കുന്നില്ല എന്ന ആശയം നിലനിർത്തുന്നു; മറ്റു യഥാർത്ഥ lexical സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ചോദിക്കട്ടെ’ എന്ന രൂപം ആജ്ഞയുടെ സൗമ്യമായെങ്കിലും വ്യക്തമായ ശക്തി നിലനിർത്തുന്നു. ‘ആ വ്യക്തി’ എന്നത് ഏകവചനം കാത്തുസൂക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ ലിംഗപരമായ അനാവശ്യ ചുരുക്കം ഒഴിവാക്കുന്നു.
