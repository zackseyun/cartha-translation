theological_decisions:
- issue: τοῦ κυρίου എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: കർത്താവ്
  alternative: ദൈവം; കർത്താവായ ദൈവം
  rationale: ഗ്രീക്ക് പാഠം κύριος എന്ന പദവി മാത്രമാണ് ഉപയോഗിക്കുന്നത്. ‘കർത്താവ്’ എന്നത് അതിന്റെ വാചകരൂപം സംരക്ഷിക്കുകയും ഈ വാക്യം വ്യക്തമാക്കാത്ത തിരിച്ചറിയൽ പരിഭാഷയിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ὁ ἄνθρωπος ἐκεῖνος എന്നതിലെ ലിംഗസൂചന
  choice: ആ മനുഷ്യൻ
  alternative: ആ വ്യക്തി; അയാൾ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം സംരക്ഷിച്ചു; അതേസമയം, മുൻവാക്യത്തിൽ വിവരിച്ച സംശയിക്കുന്ന വ്യക്തിയെ പ്രതിനിധിപരമായി സൂചിപ്പിക്കുന്നതാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. ‘എന്തെന്നാൽ’ മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു; ‘കരുതരുത്’ വിലക്കിന്റെ ശക്തി ലളിതമായി നൽകുന്നു. കർത്താവിന്റെ തിരിച്ചറിയലും പ്രതിനിധിപരമായ പുല്ലിംഗപ്രയോഗവും പാഠത്തിലുള്ള പരിധിക്കുള്ളിൽ തന്നെയാക്കി.
