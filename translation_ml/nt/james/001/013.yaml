id: JAS.1.13
reference: James 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: ml
  text: പ്രലോഭിപ്പിക്കപ്പെടുന്നവൻ ആരും, “ദൈവത്തിൽനിന്നാണ് ഞാൻ പ്രലോഭിപ്പിക്കപ്പെടുന്നത്” എന്നു പറയരുത്. കാരണം, തിന്മകളാൽ ദൈവത്തെ പ്രലോഭിപ്പിക്കാനാവില്ല[a]; അവിടുന്നുതന്നെ ആരെയും പ്രലോഭിപ്പിക്കുന്നുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ദൈവം തിന്മകളാൽ പ്രലോഭിപ്പിക്കപ്പെടാത്തവനാണ്.” ഗ്രീക്കിലെ ഈ പ്രയോഗം അപൂർവവും അർഥവ്യാഖ്യാനത്തിൽ ദുഷ്കരവുമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ... λεγέτω
  choice: ആരും ... പറയരുത്
  rationale: നിഷേധാത്മക അനിശ്ചിത സർവനാമവും മൂന്നാംപുരുഷ ആജ്ഞാരൂപവും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള വിലക്കായി അവതരിപ്പിക്കുന്നു.
- source_word: πειραζόμενος
  choice: പരീക്ഷിക്കപ്പെടുമ്പോൾ
  rationale: πειράζω എന്ന പദത്തിന് പരീക്ഷിക്കുക, പ്രലോഭിപ്പിക്കുക എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. ഇവിടെ പങ്കാളിക്രിയയുടെ വിശാലത നിലനിർത്താനും ദൈവത്തെ കുറ്റപ്പെടുത്തുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കാനും ഈ രൂപം തിരഞ്ഞെടുത്തു; പിന്നാലെയുള്ള പ്രയോഗങ്ങൾ ധാർമ്മിക തിന്മയിലേക്കുള്ള പ്രലോഭനത്തെ വ്യക്തമാക്കുന്നു.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: ദൈവത്തിൽനിന്നാണ് ഞാൻ പ്രലോഭിപ്പിക്കപ്പെടുന്നത്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ഉറവിടത്തെ ‘ദൈവത്തിൽനിന്ന്’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭം ധാർമ്മിക തിന്മയിലേക്കുള്ള വശീകരണമായതിനാൽ πειράζομαι ഇവിടെ ‘പ്രലോഭിപ്പിക്കപ്പെടുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: തിന്മയാൽ ദൈവത്തെ പ്രലോഭിപ്പിക്കാനാവില്ല
  rationale: അപൂർവമായ ἀπείραστος എന്ന വിശേഷണത്തിന്റെ സന്ദർഭോചിതമായ അർഥം—തിന്മയ്ക്ക് ദൈവത്തെ പ്രലോഭിപ്പിക്കാൻ കഴിയില്ല—സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. κακῶν എന്ന ബഹുവചനരൂപം മലയാളത്തിൽ കൂട്ടാർഥമുള്ള ‘തിന്മ’യായി വരുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πειράζει δὲ αὐτὸς οὐδένα
  choice: അവിടുന്നുതന്നെ ആരെയും പ്രലോഭിപ്പിക്കുന്നുമില്ല
  rationale: αὐτός എന്ന ഊന്നൽ ‘അവിടുന്നുതന്നെ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു; ആദരസൂചകമായ സർവനാമം മലയാള ബൈബിൾ ഗദ്യത്തിന് യോജിക്കുന്നു. സന്ദർഭം കണക്കിലെടുത്ത് πειράζει എന്നത് ‘പ്രലോഭിപ്പിക്കുന്നു’ എന്നു നൽകി.
theological_decisions:
- issue: വാക്യത്തിലെ πειράζω പദകുടുംബത്തിന്റെ അർഥവ്യാപ്തി
  choice: ആദ്യ പങ്കാളിക്രിയയിൽ ‘പരീക്ഷിക്കപ്പെടുമ്പോൾ’ എന്നും ധാർമ്മിക ദോഷത്തിലേക്കുള്ള വശീകരണം വ്യക്തമായിടങ്ങളിൽ ‘പ്രലോഭിപ്പിക്കുക’ എന്നും നൽകി.
  alternative: എല്ലാ സംഭവങ്ങളിലും ‘പ്രലോഭിപ്പിക്കുക’ ഉപയോഗിക്കുക; അല്ലെങ്കിൽ എല്ലായിടത്തും ‘പരീക്ഷിക്കുക’ ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് പദത്തിന്റെ പരീക്ഷണം/പ്രലോഭനം എന്ന അർഥവ്യാപ്തി തുടക്കത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ ദൈവം തിന്മയുടെ ഉറവിടമാണെന്ന അവകാശവാദം നിഷേധിക്കുന്ന ഉടൻസന്ദർഭത്തിൽ ‘പ്രലോഭിപ്പിക്കുക’ ധാർമ്മിക ആശയം വ്യക്തമായി നൽകുന്നു. ഇതിലൂടെ ദൈവം മറ്റൊരു അർഥത്തിൽ മനുഷ്യരെ പരീക്ഷിക്കുമോ എന്ന വിശാല ദൈവശാസ്ത്രചോദ്യം ഈ വാക്യംകൊണ്ട് മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
- issue: ἀπείραστός ἐστιν κακῶν എന്ന ദുഷ്കരമായ പ്രയോഗം
  choice: ‘തിന്മയാൽ ദൈവത്തെ പ്രലോഭിപ്പിക്കാനാവില്ല’ എന്ന പ്രധാന അർഥം നൽകി.
  alternative: ‘ദൈവം തിന്മകളിൽ അനുഭവമില്ലാത്തവനാണ്’; ‘ദൈവം തിന്മകളാൽ പരീക്ഷിക്കപ്പെടാത്തവനാണ്.’
  rationale: വിരളമായ വിശേഷണത്തിന് ഒന്നിലധികം വ്യാഖ്യാനസാധ്യതകളുണ്ടെങ്കിലും, തുടർന്നുള്ള ‘അവിടുന്നുതന്നെ ആരെയും പ്രലോഭിപ്പിക്കുന്നുമില്ല’ എന്ന പ്രസ്താവനയുമായി ഏറ്റവും നേരിട്ട് ചേരുന്നത് ദൈവം തിന്മയുടെ പ്രലോഭനത്തിന് വിധേയനല്ല എന്ന അർഥമാണ്. മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ‘ആരും ... പറയരുത്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വിലക്കാണ്. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. അപൂർവമായ ഗ്രീക്ക് വിശേഷണത്തിന് കൃത്രിമമായ മലയാള പദനിർമ്മാണം ഒഴിവാക്കി സ്വാഭാവിക വാക്യഘടന സ്വീകരിച്ചു.
