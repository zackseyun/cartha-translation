id: JAS.1.15
reference: James 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: ml
  text: പിന്നെ മോഹം ഗർഭം ധരിച്ച് പാപത്തെ പ്രസവിക്കുന്നു; പാപമാകട്ടെ, പൂർണവളർച്ച പ്രാപിക്കുമ്പോൾ[a] മരണത്തെ ജനിപ്പിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പൂർത്തിയാകുമ്പോൾ’ അല്ലെങ്കിൽ ‘പക്വത പ്രാപിക്കുമ്പോൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: പിന്നെ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള പ്രലോഭനം–മരണം എന്ന ക്രമത്തിന്റെ അടുത്ത ഘട്ടം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐπιθυμία
  choice: മോഹം
  rationale: സന്ദർഭത്തിലെ തെറ്റായ ആഗ്രഹത്തെ സൂചിപ്പിക്കുന്നു; ലൈംഗിക അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്ന പദങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: συλλαβοῦσα
  choice: ഗർഭം ധരിച്ച്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ഗർഭധാരണത്തെ സൂചിപ്പിക്കുകയും പ്രസവരൂപകം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τίκτει
  choice: പ്രസവിക്കുന്നു
  rationale: ഗർഭധാരണവും ജനനവും ഉൾപ്പെട്ട രൂപകം നേരിട്ടും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
- source_word: ἁμαρτίαν
  choice: പാപത്തെ
  rationale: ധാർമിക തിന്മയ്ക്കുള്ള പതിവും കൃത്യവുമായ പരിഭാഷ.
- source_word: δὲ
  choice: പാപമാകട്ടെ
  rationale: വികാസക്രമം തുടരുന്നതിനൊപ്പം വിഷയത്തിലെ മാറ്റം മലയാളത്തിൽ വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു; ശക്തമായ വൈരുധ്യം ചേർക്കുന്നില്ല.
- source_word: ἀποτελεσθεῖσα
  choice: പൂർണവളർച്ച പ്രാപിക്കുമ്പോൾ
  rationale: പാപം പൂർണതയിലേക്കോ പക്വതയിലേക്കോ എത്തുന്നതിനെ ജൈവവളർച്ചയുടെ രൂപകത്തിനുള്ളിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀποκύει
  choice: ജനിപ്പിക്കുന്നു
  rationale: ജനനരൂപകം സംരക്ഷിക്കുമ്പോൾ മുൻപത്തെ ‘പ്രസവിക്കുന്നു’ എന്നതിന്റെ അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: θάνατον
  choice: മരണത്തെ
  rationale: മരണത്തിന്റെ സ്വഭാവം ശാരീരികമോ ആത്മീയമോ നിത്യമോ എന്നു വാചകം നിർവചിക്കാത്തതിനാൽ അതേ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: മോഹം, പാപം, മരണം എന്നിവയെ ബന്ധിപ്പിക്കുന്ന രൂപകം
  choice: ഗർഭധാരണം–പ്രസവം–വളർച്ച–ജനനം എന്ന വ്യക്തിവൽക്കരിച്ച രൂപകം സംരക്ഷിച്ചു.
  alternative: മോഹം പാപത്തിലേക്കും പാപം മരണത്തിലേക്കും നയിക്കുന്നു.
  rationale: വെറും കാരണഫല പ്രസ്താവനയാക്കി മാറ്റുന്നത് മൂലപാഠത്തിന്റെ ശക്തമായ ജനനരൂപകത്തെയും പാപത്തിന്റെ ക്രമിക വികാസത്തെയും മങ്ങിച്ചുകളയും.
- issue: θάνατος എന്നതിന്റെ വ്യാപ്തി
  choice: ‘മരണം’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ആത്മീയ മരണം / നിത്യമരണം
  rationale: ഗ്രീക്ക് പാഠം മരണത്തിന്റെ ഒരു പ്രത്യേക വിഭാഗം നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ ചുരുക്കം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മോഹം’ പൊതുവായ തെറ്റായ ആഗ്രഹത്തെ വ്യക്തമാക്കുന്നു. ജനനരൂപകം മുഴുവൻ നിലനിർത്തിയിട്ടുണ്ട്; ‘മരണം’ വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തിയിട്ടില്ല.
