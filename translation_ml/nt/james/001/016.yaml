id: JAS.1.16
reference: James 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: ml
  text: എന്റെ പ്രിയ സഹോദരന്മാരേ[a], വഞ്ചിക്കപ്പെടരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹോദരീസഹോദരന്മാരേ’; ‘സഹോദരന്മാർ’ എന്ന ഗ്രീക്ക് പദം സ്ത്രീകളെയും ഉൾപ്പെടുത്തി സഹവിശ്വാസികളെ ഒന്നാകെ അഭിസംബോധന ചെയ്യാൻ ഉപയോഗിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: വഞ്ചിക്കപ്പെടരുത്
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപം ഒരു വിലക്ക് അറിയിക്കുന്നു. ഇവിടെ πλανάω എന്നത് തെറ്റായ ധാരണ സ്വീകരിച്ച് വഞ്ചിക്കപ്പെടുക എന്ന അർഥത്തിലാണ്; കർത്തരിപ്രയോഗമാക്കി അർഥം മാറ്റാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നിഷ്ക്രിയഭാവം നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: സംബോധനാരൂപത്തിലുള്ള പുല്ലിംഗ ബഹുവചനം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. വിശ്വാസിസമൂഹത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്ന പ്രതിനിധാനപരമായ പ്രയോഗമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μου
  choice: എന്റെ
  rationale: വക്താവിന്റെ ആത്മബന്ധവും ഇടയസ്നേഹവും സൂചിപ്പിക്കുന്ന ഉടമസ്ഥസർവനാമം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἀγαπητοί
  choice: പ്രിയ
  rationale: ἀγαπητοίയിലെ സ്നേഹപൂർവമായ അഭിസംബോധന ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു; 'എന്റെ പ്രിയ സഹോദരന്മാരേ' എന്ന ക്രമം മലയാളത്തിന് യോജിച്ചതാണ്.
theological_decisions:
- issue: ക്രൈസ്തവസമൂഹത്തോടുള്ള ലിംഗസൂചക അഭിസംബോധന
  choice: പ്രധാനവാക്യത്തിൽ ἀδελφοί എന്നത് ‘സഹോദരന്മാരേ’ എന്നു നൽകി, അതിന്റെ ഉൾക്കൊള്ളുന്ന പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’ അല്ലെങ്കിൽ ‘സഹോദരങ്ങളേ’
  rationale: ഗ്രീക്ക് പദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും സമ്മിശ്രമായ വിശ്വാസിസമൂഹത്തെ ഒന്നാകെ അഭിസംബോധന ചെയ്യാം. മൂലരൂപത്തിന്റെ ലിംഗസൂചന പ്രധാനവാക്യത്തിൽ നിലനിർത്തുകയും സാധ്യതയുള്ള വിശാല പരാമർശം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും സ്നേഹപൂർവവുമായ അഭിസംബോധന. ഗ്രീക്കിലെ ഊന്നൽ നിറഞ്ഞ വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ അഭിസംബോധന ആദ്യം നൽകിയിരിക്കുന്നു; വിലക്കിന്റെ ശക്തി ‘വഞ്ചിക്കപ്പെടരുത്’ എന്നതിൽ നിലനിർത്തുന്നു.
