id: JAS.1.24
reference: James 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: ml
  text: കാരണം, ഒരു വ്യക്തി തന്നെത്തന്നെ നോക്കി പോയശേഷം, താൻ എങ്ങനെയുള്ള വ്യക്തിയാണെന്ന് ഉടനെ മറന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατενόησεν
  choice: നോക്കിയിട്ട്
  rationale: κατανοέω ശ്രദ്ധിച്ചു നോക്കുക, നിരീക്ഷിക്കുക, പരിഗണിക്കുക എന്നീ അർഥങ്ങൾ നൽകാം. കണ്ണാടിയുടെ ദൃഷ്ടാന്തത്തിൽ ‘നോക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; തുടർന്നുള്ള പ്രവൃത്തിയുമായി ബന്ധിപ്പിക്കാൻ ‘നോക്കിയിട്ട്’ എന്നു നൽകി.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ താരതമ്യത്തിന് വിശദീകരണം നൽകുന്ന γάρ-ന്റെ ബന്ധം ‘കാരണം’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἑαυτὸν
  choice: തന്നെത്തന്നെ
  rationale: ഈ വാക്യത്തിൽ ‘മുഖം’ ആവർത്തിക്കാതെ പ്രതിഫലന സർവനാമമായ ‘തന്നെത്തന്നെ’ തന്നെയാണ് ഉള്ളത്; അതിനാൽ മൂലപാഠത്തിന്റെ രൂപം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἀπελήλυθεν
  choice: അവിടെനിന്ന് പോയി
  rationale: ἀπέρχομαι എന്നതിന്റെ പൂർണ്ണഭൂതരൂപത്തിന് ഫലനിലയുടെ സൂചന ഉണ്ടെങ്കിലും, ഇവിടെ സംഭവക്രമത്തിൽ സ്വാഭാവികമായ മലയാള ഭൂതകാലം യോജിക്കുന്നു. കണ്ണാടിയിൽനിന്നുള്ള പിരിഞ്ഞുപോകൽ വ്യക്തമാക്കാൻ ‘അവിടെനിന്ന്’ ചേർത്തു.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: εὐθέως സൂചിപ്പിക്കുന്ന തൽക്ഷണത ലളിതവും ശക്തവുമായി നൽകുന്നു.
- source_word: ἐπελάθετο
  choice: മറന്നുപോയി
  rationale: ἐπιλανθάνομαι എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘മറക്കുക’ എന്നതാണ്; ‘മറന്നുപോയി’ ആ പ്രവൃത്തിയുടെ പെട്ടെന്നുള്ള പൂർത്തീകരണം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁποῖος ἦν
  choice: താൻ എങ്ങനെയുള്ളയാളായിരുന്നു
  rationale: ὁποῖος വ്യക്തിയുടെ വെറും തിരിച്ചറിയലല്ല, സ്വഭാവമോ തരമോ സൂചിപ്പിക്കുന്നു. ‘എങ്ങനെയുള്ളയാൾ’ ഈ ഗുണപരമായ അർഥം നിലനിർത്തുകയും പൊതുവായ പ്രതിനിധിയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കണ്ണാടിദൃഷ്ടാന്തത്തിലെ പൊതുവായ പുല്ലിംഗപ്രയോഗം
  choice: താൻ എങ്ങനെയുള്ളയാളായിരുന്നു
  alternative: താൻ എങ്ങനെയുള്ള പുരുഷനായിരുന്നു
  rationale: ഗ്രീക്കിൽ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും, സന്ദർഭത്തിൽ അത് പുരുഷന്മാരെ മാത്രം അല്ല, പൊതുവായി ഒരാളെ പ്രതിനിധീകരിക്കുന്നു. അതിനാൽ ലിംഗപരിധി അനാവശ്യമായി ചുമത്താത്ത രൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ഗ്രീക്കിലെ പ്രവൃത്തിക്രമം—നോക്കുക, പോകുക, ഉടൻ മറക്കുക—വ്യക്തമായി നിലനിർത്തി. ഈ വാക്യത്തിന് പ്രത്യേക പാഠഭേദമോ അനിവാര്യമായ അടിക്കുറിപ്പോ ആവശ്യമില്ല.
