id: JAS.1.26
reference: James 1:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: ml
  text: താൻ മതനിഷ്ഠനാണെന്ന് കരുതുന്ന[a] ഒരാൾ തന്റെ നാവിനു കടിഞ്ഞാണിടാതെ[b], മറിച്ച് സ്വന്തം ഹൃദയത്തെ വഞ്ചിക്കുന്നുവെങ്കിൽ, അയാളുടെ മതാചരണം വ്യർഥമാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘മതനിഷ്ഠനാണെന്ന് തോന്നുന്ന.’'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘തന്റെ നാവിനു കടിഞ്ഞാണിടാതെ’ എന്നാണ്; മൃഗത്തെ നിയന്ത്രിക്കാൻ ഉപയോഗിക്കുന്ന കടിഞ്ഞാണിന്റെ രൂപകം ഇതിൽ നിലനിൽക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: ‘ഫലശൂന്യമാണ്’ അഥവാ ‘പ്രയോജനമില്ലാത്തതാണ്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: കരുതുന്ന
  rationale: സന്ദർഭത്തിൽ ഇത് ഒരാളുടെ സ്വന്തം മതഭക്തിയെക്കുറിച്ചുള്ള വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്നു; ‘തോന്നുന്ന’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: θρησκὸς
  choice: മതഭക്തൻ
  rationale: മതപരമായ തിരിച്ചറിയലും ആചരണനിഷ്ഠയും സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ പദം.
- source_word: χαλιναγωγῶν
  choice: കടിഞ്ഞാണിടാതെ
  rationale: മൃഗത്തെ നിയന്ത്രിക്കാൻ കടിഞ്ഞാൺ ഉപയോഗിക്കുന്ന മൂലരൂപകം സംരക്ഷിക്കുകയും യാക്കോബ് 3-ലെ നാവിനെക്കുറിച്ചുള്ള തുടർചർച്ചയുമായി ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γλῶσσαν αὐτοῦ
  choice: തന്റെ നാവ്
  rationale: സംസാരത്തെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ ‘നാവ്’ എന്ന രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀπατῶν
  choice: വഞ്ചിക്കുന്ന
  rationale: സ്വന്തം ഹൃദയത്തെ തെറ്റിദ്ധരിപ്പിക്കുന്നതിന്റെ ശക്തമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καρδίαν αὐτοῦ
  choice: സ്വന്തം ഹൃദയം
  rationale: അകത്തെ മനുഷ്യനെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം സംരക്ഷിക്കുന്നു; ‘തന്നെത്തന്നെ’ എന്ന് പരാവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: τούτου
  choice: അയാളുടെ
  rationale: മുമ്പ് വിവരിച്ച വ്യക്തിയിലേക്കുള്ള നിർദേശബലം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μάταιος
  choice: വ്യർഥം
  rationale: ഫലമില്ലാത്തതും മൂല്യമില്ലാത്തതുമായ അവസ്ഥയെ ദൃഢവും പരിചിതവുമായ ഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡ θρησκεία
  choice: മതാചരണം
  rationale: ഇവിടെ വിലയിരുത്തപ്പെടുന്നത് മതം എന്ന ആശയം പൊതുവിൽ അല്ല, ഒരാളുടെ മതപരമായ ആചരണമാണ് എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൊതുവായ അർഥത്തിലുള്ള പുരുഷലിംഗ ഏകവചന പരാമർശം
  choice: ഒരാൾ … അയാളുടെ
  alternative: ആരെങ്കിലും … അവരുടെ
  rationale: ഗ്രീക്കിലെ പൊതുവായ അർഥമുള്ള പുരുഷലിംഗ ഏകവചന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ പ്രതിനിധി ഏകവചനമായി നിലനിർത്തുന്നു; ‘ഒരാൾ’ ഇതിന്റെ പൊതുവ്യാപ്തി വ്യക്തമാക്കുന്നു.
- issue: θρησκός / θρησκεία എന്ന പദജോടിയുടെ അർഥം
  choice: മതഭക്തൻ / മതാചരണം
  alternative: മതനിഷ്ഠൻ / മതാനുഷ്ഠാനം
  rationale: പുറമേ പ്രകടമാകുന്ന മതപരമായ തിരിച്ചറിയലിനെയും ആചരണത്തെയും സൂചിപ്പിക്കുന്നു; ഒരു പ്രത്യേക സഭാപാരമ്പര്യമോ വെറും ആന്തരിക ഭക്തിയോ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: നിയന്ത്രിക്കാത്ത സംസാരവും മതാചരണത്തിന്റെ മൂല്യവും തമ്മിലുള്ള ബന്ധം
  choice: നാവിനു കടിഞ്ഞാണിടാതെ സ്വന്തം ഹൃദയത്തെ വഞ്ചിക്കുന്നവന്റെ മതാചരണം വ്യർഥമാണ്
  alternative: നിയന്ത്രണമില്ലാത്ത സംസാരം മതാചരണത്തെ ദുർബലപ്പെടുത്തുന്നു
  rationale: മൂലപാഠത്തിലെ ശക്തമായ വിധിയായ μάταιος എന്നതിനെ മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു; അതേസമയം വിശാലമായ സിദ്ധാന്തനിഗമനങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കടിഞ്ഞാണിടുക’ എന്ന സജീവ രൂപകവും ‘ഹൃദയം’ എന്ന ബൈബിൾപ്രയോഗവും സംരക്ഷിച്ചിരിക്കുന്നു; വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും മൂലപാഠത്തിലെ വ്യവസ്ഥയും വിരോധസൂചനയും (‘മറിച്ച്’) നിലനിർത്തിയിട്ടുണ്ട്.
