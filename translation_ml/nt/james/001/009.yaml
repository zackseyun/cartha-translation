  yaml_path: translation/nt/james/001/009.yaml
  text: But let the lowly brother boast in his exaltation[b][a],
translation:
  language: ml
  text: എന്നാൽ താഴ്ന്ന നിലയിലുള്ള സഹോദരൻ തന്റെ ഉയർച്ചയിൽ അഭിമാനിക്കട്ടെ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘താഴ്ന്ന പദവിയിലുള്ള സഹോദരൻ.’ ഗ്രീക്കിൽ ഏകവചന പുല്ലിംഗമായ ‘സഹോദരൻ’ എന്നാണ്; സന്ദർഭത്തിൽ ഇത് ഒരു സഹവിശ്വാസിയെ പ്രതിനിധിയായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തന്റെ ഉയർന്ന പദവിയിൽ.’ ഇത് ദൈവസന്നിധിയിൽ താഴ്ന്ന നിലയിലുള്ള വിശ്വാസിക്കുള്ള ബഹുമാനപ്പെട്ട നിലയെ സൂചിപ്പിക്കാം; ഇപ്പോഴത്തെയും ഭാവിയിലെയും നിലമാറ്റത്തിന്റെ ആശയവും ഇതിലുണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: അഭിമാനിക്കട്ടെ
  rationale: വർത്തമാനകാല മധ്യമ ആജ്ഞാരൂപത്തിന്റെ പ്രബോധനസ്വഭാവവും καυχάομαι എന്ന പദത്തിന്റെ ‘അഭിമാനിക്കുക/പ്രശംസിക്കുക’ എന്ന ശക്തിയും നിലനിർത്തുന്നു. ഇവിടെ അഭിമാനത്തിന്റെ അടിസ്ഥാനം സ്വയം നേടിയ മഹത്വമല്ല, ലഭിച്ച ഉയർച്ചയാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള മൃദുവായ വിരോധവും 9–10 വാക്യങ്ങളിലെ താഴ്ന്നവൻ–ധനികൻ എന്ന താരതമ്യത്തിലേക്കുള്ള നീക്കവും സൂചിപ്പിക്കുന്നു.
- source_word: ὁ ἀδελφὸς
  choice: സഹോദരൻ
  rationale: ഗ്രീക്കിലെ ഏകവചന പുല്ലിംഗരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സഹവിശ്വാസിയെ പ്രതിനിധിയായി സൂചിപ്പിക്കാം.
- source_word: ὁ ταπεινὸς
  choice: താഴ്ന്ന നിലയിലുള്ള
  rationale: ταπεινός ഇവിടെ സാമൂഹികമോ സാമ്പത്തികമോ ആയ താഴ്ന്ന നിലയെയും വിനീതാവസ്ഥയുടെ അനുരണനത്തെയും ഉൾക്കൊള്ളാം. ‘ദരിദ്രൻ’ അല്ലെങ്കിൽ ‘വിനീതൻ’ എന്നു മാത്രം ചുരുക്കാതെ ഈ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: തന്റെ ഉയർച്ചയിൽ
  rationale: ὕψος എന്നതിലെ ഉയരം/ഉയർത്തപ്പെട്ട നില എന്ന ആശയവും സന്ദർഭത്തിലെ നിലമാറ്റത്തിന്റെ സൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇപ്പോഴത്തെ ബഹുമാനം, ദൈവസന്നിധിയിലെ പദവി, ഭാവിയിലെ ഉയർത്തൽ എന്നിവയിൽ ഒന്നിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: താഴ്ന്ന നിലയിലുള്ള വിശ്വാസിയുടെ ‘ഉയർച്ച’യുടെ അർഥം
  choice: ഇപ്പോഴത്തെയോ ഭാവിയിലെയോ ഒരു ഘട്ടത്തിലേക്ക് പരിമിതപ്പെടുത്താതെ, ദൈവസന്നിധിയിൽ ലഭിക്കുന്ന ഉയർത്തപ്പെട്ട നിലയെയും ബഹുമാനത്തെയും നിലമാറ്റത്തിന്റെ സൂചനകളോടെ തുറന്നുവയ്ക്കുന്നു.
  alternative: ഇപ്പോഴത്തെ സാമൂഹിക ഉയർച്ച; ദൈവസന്നിധിയിലെ ആത്മീയ പദവി; ഭാവിയിലെ അന്ത്യകാല ഉയർത്തൽ
  rationale: 9–10 വാക്യങ്ങളിലെ താഴ്ന്നവൻ–ധനികൻ താരതമ്യം നിലമാറ്റത്തിന്റെ ഭാഷ ഉപയോഗിക്കുന്നു. മൂലപാഠം അനുവദിക്കുന്ന ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും സംഘർഷവും വിവർത്തനം സംരക്ഷിക്കണം.
- issue: ἀδελφός എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരൻ’ എന്ന് ഏകവചന പുല്ലിംഗമായി നൽകുന്നു; പ്രതിനിധിപരമായ പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: സഹോദരനോ സഹോദരിയോ; സഹവിശ്വാസി
  rationale: മൂലപാഠത്തിന്റെ വ്യാകരണരൂപം നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിൽ അത് സ്ത്രീപുരുഷഭേദമില്ലാതെ സഹവിശ്വാസിയെ സൂചിപ്പിക്കാമെന്ന സാധ്യത മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘താഴ്ന്ന നിലയിലുള്ള’ എന്നത് സാമൂഹിക-സാമ്പത്തിക താഴ്മയും വിനീതാവസ്ഥയുടെ അനുരണനവും ഒരുമിച്ച് തുറന്നുവയ്ക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ഘടകങ്ങൾക്ക് പിന്നാലെ [a][b] എന്ന ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
