book_localizations:
- source_title: Genesis
  title: Mwanzo
  author: Haijulikani; kimapokeo, kitabu hiki huhusishwa na Musa. Wasomi wa kisasa huona kuwa kina historia ndefu ya utunzi, na vyanzo vyake vilihaririwa na kuunganishwa baadaye.
  audience: Israeli katika utambulisho wao wa agano, kikitia mizizi simulizi la asili ya watu hawa katika uumbaji wa Mungu, uchaguzi wake, na ahadi yake.
  date: Kilitungwa kwa karne kadhaa; kilifikia umbo lake lililopokelewa takriban karne ya 6–5 KK, wakati wa uhamisho wa Babeli au baada yake.
  summary: Mwanzo husimulia uumbaji, uasi na kutawanyika kwa wanadamu, na familia ya Abrahamu, Isaka, Yakobo na Yosefu, ambao kupitia kwao ahadi za agano la Mungu kwa Israeli zinaanza.
- source_title: John
  title: Yohana
  author: Haijulikani; mapokeo hukihusisha kitabu hiki na mtume Yohana au “Mwanafunzi Mpendwa.”
  audience: Jumuiya ya Kikristo iliyokuwa na mvutano na Uyahudi wa sinagogi, na iliyojengeka kuzunguka ushuhuda wa Mwanafunzi Mpendwa.
  date: Takriban 90–110 BK.
  summary: Yohana anamwasilisha Yesu kuwa Neno la milele linalemfunua Baba, linalotoa uzima kwa kumwamini, na linalotukuzwa kupitia ishara zake, kifo chake na ufufuo wake.
- source_title: Gospel of Thomas
  title: Injili ya Tomaso
  author: Haijulikani; maneno ya utangulizi yanahusisha mkusanyo huu wa kauli na “Didimo Yuda Tomaso.” Nakala kamili iliyosalia ni tafsiri ya Kikopti ya karne ya 4 kutoka Nag Hammadi (NHC II,2), pamoja na vipande vitatu vya Kigiriki kutoka Oxyrhynchus.
  audience: Wasomaji Wakristo walioundwa na hekima ya Kisiria na fikra za awali za Kignostiki, wakielekezwa kwenye maarifa ya binafsi ya kifumbo katika kauli za Yesu.
  date: Nakala ya awali ya Kigiriki huenda iliandikwa takriban 50–140 BK; hati ya Kikopti ni ya takriban 340 BK.
  summary: Injili ya Tomaso ni mkusanyo wa kauli zinazohusishwa na Yesu. Haina simulizi endelevu, na huwaita wasomaji tena na tena kugundua maana ya kauli hizo.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Mwanzo 1:1
  text: Mungu alipoanza kuumba mbingu na dunia[a]—
  translator_note: '[a] Tafsiri ya kimapokeo hulichukulia hili kuwa sentensi kamili: “Hapo mwanzo, Mungu aliumba mbingu na dunia.” Lakini muundo wa Kiebrania kwa kawaida zaidi huyatanguliza yanayofuata, huku tendo kuu, “Mungu akasema,” likiwa katika mstari wa 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Mhubiri 1:2
  text: “Mvuke wa mivuke[a],” asema Qoheleth[b]. “Kila kitu ni mvuke—ni wa muda mfupi, hakiwezi kushikika, na mara nyingi huwa tofauti na tunavyotarajia.”
  translator_note: '[a] Neno la Kiebrania hevel kwa maana halisi ni pumzi au mvuke. Katika kitabu chote cha Mhubiri, linaeleza jambo linalopita upesi, lisiloweza kushikika au kueleweka kikamilifu, na ambalo mara nyingi hugeuka kuwa tofauti na watu wanavyotarajia. “Mvuke” hudumisha taswira hiyo bila kudai kwamba hakuna kitu chenye maana. Tafsiri nyingine zinazowezekana ni “pumzi,” “pumzi tu,” au “kinachopita upesi.”


    [b] Qoheleth ni jina au cheo cha mwandishi kwa Kiebrania. Mara nyingi hutafsiriwa “Mwalimu” au “Mhubiri,” lakini hapa tunatumia “Qoheleth” ili kuhifadhi maana zote zinazowezekana bila kupendelea fasiri moja.'
- source_path: nt/john/001/001.yaml
  reference: Yohana 1:1
  text: Hapo mwanzo[b], Neno alikuwa tayari alikuwapo. Neno alikuwa pamoja na Mungu, naye Neno alikuwa Mungu.[a]
  translator_note: '[a] Au, “Neno alikuwa wa kimungu,” au “kile alichokuwa Mungu, ndicho alichokuwa Neno.” Muundo wa Kigiriki unathibitisha kuwa Neno ni Mungu kikamilifu, huku ukimtofautisha Neno na Mungu katika kishazi kilichotangulia.


    [b] Ufunguzi huu unarejelea Mwanzo 1:1 na kumhusianisha Neno na mwanzo wa uumbaji. “Alikuwa tayari alikuwapo” huonyesha kuwapo kwa kuendelea; tafsiri nyingine zinazowezekana ni “alikuwa” au “alikuwapo.”'
- source_path: nt/romans/003/025.yaml
  reference: Waroma 3:25
  text: Mungu alimtoa awe dhabihu ya upatanisho[a] kwa njia ya imani katika damu yake[b]. Alifanya hivyo ili kuonyesha uadilifu wake[c], kwa sababu alikuwa ameziacha dhambi zilizotendwa zamani zipite.
  translator_note: '[a] Au “dhabihu ya kutuliza ghadhabu”; au “kiti cha rehema,” yaani kifuniko cha dhahabu cha Sanduku la Agano ambacho damu ya upatanisho ilinyunyiziwa juu yake katika Agano la Kale.


    [b] Au “kwa njia ya imani, kwa damu yake.”


    [c] Au “haki.”'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Petro 1:13
  text: Kwa hiyo, ziandaeni akili zenu kwa ajili ya kutenda.[a] Mwe na akili timamu kabisa, na wekeni tumaini lenu kikamilifu katika neema itakayowaletewa Yesu Masiya atakapofunuliwa.[b]
  translator_note: '[a] Kigiriki husema kihalisi, “fungeni viuno vya akili zenu.” Taswira yake ni kukusanya vazi refu na kulifunga kiunoni ili kuwa tayari kutenda.


    [b] Neno la Kigiriki lililotafsiriwa “kabisa” na “kikamilifu” linaweza kuhusiana na kuwa na akili timamu, na kuweka tumaini, au labda na yote mawili. Taswira halisi, “fungeni viuno vya akili zenu,” imehifadhiwa na kufafanuliwa katika dokezo [a].'
