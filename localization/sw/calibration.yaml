review:
  verdict: revise
  summary: Marekebisho yamefanywa ili kuboresha ufasaha wa Kiswahili, kurekebisha uhusiano wa kisarufi, na kuzuia nyongeza za maana zisizopo katika chanzo, hasa katika Tomaso, Waroma 3:25, na 1 Petro 1:13.
  issues:
  - Maelezo ya walengwa wa Injili ya Tomaso yaliongeza wazo la “kwa njia ya siri”; yamebadilishwa kuwa maarifa ya binafsi ya kifumbo, sambamba na chanzo.
  - Mhubiri 1:2 umeboreshwa kutoka “Mvuke wa mvuke” hadi “Mvuke wa mivuke,” na maelezo yake yamesawazishwa kisarufi.
  - Katika Waroma 3:25, “aliziacha bila kuadhibu” lilikuwa fasiri yenye nyongeza; limerekebishwa ili kudumisha maana ya “passed over.”
  - Katika 1 Petro 1:13, “neema mnayoletwa” haikuwa sahihi kisarufi; imerekebishwa kuwa neema itakayowaletewa. “Mwe na kiasi” pia limebadilishwa kuwa “Mwe na akili timamu” kwa maana ya clear-minded.
