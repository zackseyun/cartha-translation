  Letters of Ignatius:
    display_name: Barua za Ignatius
    author: Ignatius, askofu wa Antiokia, kwa barua saba za toleo la kati linalokubaliwa kwa kawaida; barua za Ignatius zilizopanuliwa baadaye na zile zilizoandikwa kwa jina lake na watu wengine hazimo katika mkusanyo huu.
    audience: Makusanyiko ya Wakristo huko Efeso, Magnesia, Trales, Roma, Filadelfia na Smirna, pamoja na Polycarp, walioandikiwa wakati Ignatius alipokuwa akisafiri kuelekea kifo cha ushahidi.
    date: Kwa kawaida hupewa tarehe ya mwanzoni mwa karne ya 2 BK, mara nyingi takriban 105–117, ingawa mpangilio sahihi wa matukio ya safari ya Ignatius bado unajadiliwa.
