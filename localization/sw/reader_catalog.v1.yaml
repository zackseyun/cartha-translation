  Martyrdom of Polycarp:
    display_name: Kifo cha Ushahidi cha Polikarpo
    author: Waandishi wasiojulikana kutoka miongoni mwa washiriki wa kanisa la Smirna, walioandika kwa jina la jumuiya hiyo; maelezo ya mwisho kuhusu upokezanaji wa maandishi yanaonyesha kunakiliwa na kusambazwa kwake baadaye.
    audience: Kanisa la Filomelio na ushirika mpana wa Wakristo, waliopewa simulizi kuhusu kukamatwa, kushtakiwa, kufa na ustahimilivu wa mfano wa Polikarpo.
    date: Iliandikwa baada ya kifo cha Polikarpo, na kwa kawaida huwekwa katikati au mwishoni mwa karne ya 2 BK; mwaka kamili wa kifo chake cha ushahidi na muundo wa mwisho wa hati hii vyote vinajadiliwa.
