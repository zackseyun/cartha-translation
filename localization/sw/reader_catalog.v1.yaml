  Gospel of Thomas:
    display_name: Injili ya Thomaso
    author: Mwandishi hajulikani; maneno ya mwanzo yanahusisha mkusanyo huu wa semi na “Didymos Yuda Thomaso.” Nakala kamili iliyosalia ipo tu katika tafsiri ya Kikoptiki ya karne ya 4 kutoka Nag Hammadi (NHC II,2), pamoja na vipande vitatu vya Kigiriki kutoka Oxyrhynchus.
    audience: Wasomaji Wakristo walioathiriwa na hekima ya Kisiria na fikra za awali za Kignostiki, wakielekezwa kwenye kujijua kwa siri katika semi za Yesu.
    date: Nakala asilia ya Kigiriki huenda iliandikwa takriban miaka 50–140 BK; hati ya Kikoptiki takriban mwaka 340 BK.
    summary: Injili ya Thomaso ni mkusanyo wa semi zinazohusishwa na Yesu. Haina simulizi inayoendelea na inawahimiza wasomaji mara kwa mara kugundua maana ya semi hizo.
