  Polycarp to the Philippians:
    display_name: Waraka wa Polikarpo kwa Wafilipi
    author: Polikarpo, askofu wa Smirna. Baadhi ya wanazuoni huelewa maandishi yaliyopokelewa kuwa yameunganisha habari zilizotumwa kwa nyakati zaidi ya moja.
    audience: Kusanyiko la Wakristo huko Filipi, ambalo liliomba nyaraka za Ignatio na kupokea ushauri kuhusu imani, mwenendo, uongozi, fedha na ustahimilivu.
    date: Mwanzoni hadi katikati ya karne ya 2 BK; angalau sehemu fulani inahusiana kwa karibu na safari ya Ignatio, huku maoni kwamba waraka huu umeundwa kwa kuunganisha sehemu kadhaa yakiruhusu sehemu fulani kuwa ya baadaye kidogo.
