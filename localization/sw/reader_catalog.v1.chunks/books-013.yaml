payload:
  book_metadata:
    James:
      display_name: Yakobo
      author: Kwa mapokeo, Yakobo ndugu ya Yesu; wanazuoni wa kisasa wamegawanyika kuhusu iwapo ni yeye aliyeandika au iliandikwa kwa jina lake.
      audience: Makusanyiko ya Wakristo Wayahudi waliotawanyika.
      date: Takriban miaka ya 50–60 BK ikiwa iliandikwa na Yakobo; takriban mwishoni mwa karne ya 1 BK ikiwa iliandikwa kwa jina lake.
    1 Peter:
      display_name: 1 Petro
      author: Kwa mapokeo, mtume Petro, huku Silvano akiwa mwandishi wake; baadhi ya wanazuoni wanaona kuwa iliandikwa kwa jina la Petro.
      audience: Wakristo katika Asia Ndogo ya Kirumi waliokuwa wakikabili uhasama wa kijamii.
      date: Takriban miaka ya 60 BK ikiwa iliandikwa na Petro; takriban miaka ya 70–90 BK ikiwa iliandikwa kwa jina lake.
    2 Peter:
      display_name: 2 Petro
      author: Kwa mapokeo, Petro; wanazuoni wengi wa kisasa wanaona kuwa iliandikwa kwa jina lake.
      audience: Wakristo waliokabili watu wenye dhihaka waliokana kurudi kwa Kristo.
      date: Takriban mwanzoni mwa karne ya 2 BK.
    1 John:
      display_name: 1 Yohana
      author: Mwandishi hajulikani; kwa mapokeo, mtume Yohana au mzee wa jumuiya ya Yohana.
      audience: Jumuiya ya Yohana baada ya mgawanyiko, ikifafanua ni nani aliye wa jumuiya hiyo.
      date: Takriban 90–110 BK.
    2 John:
      display_name: 2 Yohana
      author: “Yule mzee.”
      audience: Kusanyiko fulani la Kikristo (“mama mteule”) lililoonywa dhidi ya walimu wa uongo.
      date: Takriban 90–110 BK.
    3 John:
      display_name: 3 Yohana
      author: “Yule mzee.”
      audience: Gayo, kiongozi mmoja aliyewakaribisha wamisionari wasafiri.
      date: Takriban 90–110 BK.
    Jude:
      display_name: Yuda
      author: Kwa mapokeo, Yuda, ndugu ya Yakobo na Yesu.
      audience: Jumuiya za Kikristo zilizokuwa zikipenyezwa na walimu waliohimiza mwenendo usio na mipaka ya maadili.
      date: Takriban miaka ya 60–90 BK.
    Revelation:
      display_name: Ufunuo
      author: Yohana wa Patmo (mtindo wake unatofautiana na ule wa Injili ya Nne).
      audience: Makusanyiko saba ya Kikristo katika Asia Ndogo ya Kirumi yaliyokuwa chini ya shinikizo la utawala wa kifalme.
      date: Takriban miaka ya 90 BK, kwa mapokeo wakati wa utawala wa Domitiano.
    Tobit:
      display_name: Tobiti
      author: Mwandishi hajulikani.
      audience: Wayahudi wa ughaibuni waliotafuta kuishi kwa uchaji, kuzingatia ndoa na kuelewa majaliwa ya Mungu chini ya utawala wa kigeni.
      date: Takriban 225–175 KK; iliandikwa kwa Kiaramu, na toleo la Kiebrania pia limethibitishwa huko Qumran.
    Judith:
      display_name: Yudithi
      author: Mwandishi hajulikani.
      audience: Wayahudi waliokuwa chini ya tishio la kigeni—simulizi thabiti kuhusu upinzani wa kiuchaji.
      date: Takriban 150–100 KK.
    Greek Additions to Esther:
      display_name: Nyongeza za Kigiriki katika Esta
      author: Mwandishi hajulikani; maandishi ya nyongeza yaliyoongezwa katika tafsiri ya Kigiriki ya Esta.
      audience: Wayahudi waliozungumza Kigiriki waliotaka simulizi la Esta lenye sala na marejeo ya wazi kwa Mungu.
      date: Takriban karne ya 2–1 KK.
    Wisdom of Solomon:
      display_name: Hekima ya Sulemani
      author: Mwandishi hajulikani; imehusishwa na Sulemani kwa kutumia jina lake. Iliandikwa kwa Kigiriki na mwandishi Myahudi wa utamaduni wa Kiyunani, huenda huko Aleksandria.
      audience: Wayahudi wa utamaduni wa Kiyunani waliojadiliana na falsafa ya Kigiriki na kuitetea hekima ya Israeli dhidi ya mitazamo mbadala ya kipagani na ya waasi wa imani.
      date: Takriban 50 KK–50 BK.
