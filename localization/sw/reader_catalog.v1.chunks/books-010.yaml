  book_metadata:
    Joel:
      display_name: Yoeli
      author: Yoeli mwana wa Pethueli.
      audience: Yuda baada ya uhamisho, ikikabiliana na pigo la nzige kama ishara ya Siku ya BWANA.
      date: Huenda karibu karne ya 5–4 KK.
    Amos:
      display_name: Amosi
      author: Amosi wa Tekoa, mchungaji kutoka Yuda aliyehubiri kaskazini.
      audience: Israeli ya kaskazini wakati wa ustawi na ukosefu wa haki chini ya Yeroboamu wa Pili.
      date: Karibu 760–750 KK.
    Obadiah:
      display_name: Obadia
      author: Obadia.
      audience: Yuda baada ya Edomu kuusaliti Yerusalemu—unabii kuhusu kuanguka kwa Edomu.
      date: Muda mfupi baada ya 586 KK.
    Jonah:
      display_name: Yona
      author: Mwandishi hajulikani; mhusika mkuu ni Yona mwana wa Amitai.
      audience: Israeli baada ya uhamisho—karipio la dhihaka dhidi ya kujitenga na watu wa makabila mengine, na uthibitisho wa rehema ya Mungu kwa watu wa nje.
      date: Huenda karibu karne ya 5–4 KK.
    Micah:
      display_name: Mika
      author: Mika wa Moreshethi.
      audience: Yuda mwishoni mwa karne ya 8 KK, hasa maskini wake wa vijijini dhidi ya tabaka la juu la mijini.
      date: Karibu 740–700 KK.
    Nahum:
      display_name: Nahumu
      author: Nahumu wa Elkoshi.
      audience: Yuda ikishangilia kuanguka kwa Ninawi kulikokuwa karibu.
      date: Muda mfupi kabla ya 612 KK.
    Habakkuk:
      display_name: Habakuki
      author: Habakuki.
      audience: Yuda ikikabiliana na kuinuka kwa Babeli—mazungumzo ya nabii na Mungu kuhusu haki.
      date: Karibu mwishoni mwa karne ya 7 KK.
    Zephaniah:
      display_name: Sefania
      author: Sefania mwana wa Kushi.
      audience: Yuda chini ya Yosia, muda mfupi kabla ya mageuzi yake.
      date: Karibu 640–609 KK.
    Haggai:
      display_name: Hagai
      author: Hagai.
      audience: Waliorudi kutoka uhamishoni wakijenga upya hekalu chini ya Dario.
      date: 520 KK.
    Zechariah:
      display_name: Zekaria
      author: Zekaria mwana wa Berekia; huenda sura ya 9–14 ziliandikwa baadaye na mtu mwingine.
      audience: Waliorudi kutoka uhamishoni wakijenga upya hekalu, na jumuiya za baadaye za kipindi cha baada ya uhamisho.
      date: Sura ya 1–8 karibu 520–518 KK; 9–14 huenda karne moja baadaye.
    Malachi:
      display_name: Malaki
      author: Mwandishi hajulikani; “Malaki” humaanisha “mjumbe wangu.”
      audience: Yuda baada ya uhamisho, ikizidi kuwa zembe katika ibada na uaminifu chini ya utawala wa Uajemi.
      date: Karibu katikati ya karne ya 5 KK.
    Matthew:
      display_name: Mathayo
      author: Mwandishi hajulikani; mapokeo yanahusisha kitabu hiki na mtume Mathayo. Wasomi wa kisasa wanaona mwandishi kuwa Myahudi Mkristo aliyezungumza Kigiriki na aliyetumia Marko na chanzo kinachofanana na Q.
      audience: Jumuiya ya Wayahudi Wakristo iliyokuwa ikitafakari mambo yaliyoendelea na yaliyobadilika katika uhusiano wake na Uyahudi wa masinagogi.
      date: Karibu 80–90 BK.
    Mark:
      display_name: Marko
      author: Mwandishi hajulikani; mapokeo yanahusisha kitabu hiki na Yohana Marko, mwandamani wa Petro katika safari.
      audience: Jumuiya ya Kikristo iliyozungumza Kigiriki, huenda huko Roma, iliyokuwa chini ya tishio la mateso au karibu kukumbwa nalo.
      date: Karibu 65–75 BK, wakati wa Vita vya Wayahudi na kuharibiwa kwa hekalu.
