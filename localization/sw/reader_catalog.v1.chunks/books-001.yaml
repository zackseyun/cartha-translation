  book_metadata:
    Genesis:
      display_name: Mwanzo
      author: Mwandishi hajulikani; kwa mapokeo, kitabu hiki huhusishwa na Musa. Wasomi wa kisasa huona historia ndefu ya utungaji yenye vyanzo vilivyohaririwa na kuunganishwa baadaye.
      audience: Israeli katika utambulisho wao wa agano, huku simulizi la asili ya watu hao likijengwa juu ya uumbaji wa Mungu, uteuzi wake na ahadi yake.
      date: Kilitungwa katika kipindi cha karne kadhaa; kilifikia umbo lake lililopokelewa takriban karne ya 6–5 KK, wakati wa uhamisho wa Babeli au baada yake.
      summary: Mwanzo husimulia kuhusu uumbaji, uasi na kutawanyika kwa wanadamu, na familia ya Abrahamu, Isaka, Yakobo na Yosefu, ambao kupitia kwao ahadi za agano la Mungu kwa Israeli zinaanza.
    Exodus:
      display_name: Kutoka
      author: Mwandishi hajulikani; kwa mapokeo, kitabu hiki huhusishwa na Musa. Wasomi wa kisasa huona historia ndefu ya utungaji yenye vyanzo vilivyohaririwa na kuunganishwa baadaye.
      audience: Israeli kama watu waliowekwa huru na kuingizwa katika agano, wakijifunza maana ya kuwa taifa la BWANA chini ya sheria yake.
      date: Kilitungwa katika kipindi cha karne kadhaa; kilifikia umbo lake lililopokelewa takriban karne ya 6–5 KK.
    Leviticus:
      display_name: Mambo ya Walawi
      author: Mwandishi hajulikani; kwa mapokeo, kitabu hiki huhusishwa na Musa. Wasomi wa kisasa hukihusisha na chanzo cha Kikuhani.
      audience: Makuhani wa Israeli na jumuiya ya waabudu — maagizo kuhusu dhabihu, utakatifu na kupanga maisha kwa kuzingatia uwepo wa Mungu.
      date: Tabaka za utungaji zinaanzia mwishoni mwa kipindi cha ufalme hadi kipindi cha baada ya uhamisho (takriban karne ya 7–5 KK).
