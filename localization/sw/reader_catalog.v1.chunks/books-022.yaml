    Gospel of Philip:
      display_name: Injili ya Filipo
      author: Mwandishi hajulikani. Jina hili linaonekana katika maneno ya mwisho ya hati hiyo, lakini maandishi yenyewe hayamtambulishi Filipo kuwa mwandishi wake. Nakala pekee iliyosalia ni maandishi ya Kikopti katika Kodeksi ya Nag Hammadi II,3.
      audience: Jumuiya ya Wakristo wa awali iliyofahamu mafundisho ya kisakramenti yenye mtindo wa Kivalentino, hasa kuhusu ubatizo, upako, Ekaristi, ukombozi, ufufuo na taswira ya chumba cha arusi.
      date: Kwa kawaida huwekwa mwishoni mwa karne ya 2 au mwanzoni mwa karne ya 3 BK; imehifadhiwa katika hati ya Kikopti ya karne ya 4 iliyotafsiriwa kutoka maandishi ya awali ya Kigiriki.
