payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: Waraka wa Polikarpo kwa Wafilipi
      author: Polikarpo, askofu wa Smirna. Baadhi ya wanazuoni huelewa maandishi yaliyopokelewa kuwa yameunganisha habari zilizotumwa kwa nyakati zaidi ya moja.
      audience: Kusanyiko la Wakristo huko Filipi, ambalo liliomba nyaraka za Ignatio na kupokea ushauri kuhusu imani, mwenendo, uongozi, fedha na ustahimilivu.
      date: Mwanzoni hadi katikati ya karne ya 2 BK; angalau sehemu fulani inahusiana kwa karibu na safari ya Ignatio, huku maoni kwamba waraka huu umeundwa kwa kuunganisha sehemu kadhaa yakiruhusu sehemu fulani kuwa ya baadaye kidogo.
    Martyrdom of Polycarp:
      display_name: Kifo cha Ushahidi cha Polikarpo
      author: Waandishi wasiojulikana kutoka miongoni mwa washiriki wa kanisa la Smirna, walioandika kwa jina la jumuiya hiyo; maelezo ya mwisho kuhusu upokezanaji wa maandishi yanaonyesha kunakiliwa na kusambazwa kwake baadaye.
      audience: Kanisa la Filomelio na ushirika mpana wa Wakristo, waliopewa simulizi kuhusu kukamatwa, kushtakiwa, kufa na ustahimilivu wa mfano wa Polikarpo.
      date: Iliandikwa baada ya kifo cha Polikarpo, na kwa kawaida huwekwa katikati au mwishoni mwa karne ya 2 BK; mwaka kamili wa kifo chake cha ushahidi na muundo wa mwisho wa hati hii vyote vinajadiliwa.
    Epistle to Diognetus:
      display_name: Waraka kwa Diogneto
      author: Mwandishi hajulikani. Anajiita mwanafunzi au anayejifunza, lakini yeye wala Diogneto anayeandikiwa hawawezi kutambuliwa kwa uhakika.
      audience: Mdadisi msomi asiye Mkristo—pamoja na wasomaji wengine kama yeye—aliyeuliza kuhusu ibada ya Kikristo, maadili, utambulisho katika jamii, upendo na kuonekana kana kwamba imani hiyo ilikuwa mpya.
      date: Mara nyingi huwekwa mwishoni mwa karne ya 2 au mwanzoni mwa karne ya 3 BK, ingawa makadirio hutofautiana sana; sura mbili za mwisho huenda zilitoka katika kazi nyingine.
    Fragments of Papias:
      display_name: Vipande vya Maandishi ya Papia
      author: Papia, askofu wa Hierapoli, ndiye aliyeandika Ufafanuzi wa Vitabu Vitano kuhusu Maneno ya Bwana, ambao umepotea; mkusanyo uliosalia una dondoo na taarifa zilizohifadhiwa na waandishi wa baadaye.
      audience: Wakristo wa awali waliotafuta mafundisho yaliyokumbukwa kuhusu Yesu na mitume, yaliyokusanywa kupitia misururu ya watu waliotajwa ambao walipitisha ushuhuda na ufafanuzi kwa njia ya mdomo.
      date: Kwa kawaida kazi ya Papia huwekwa mwanzoni mwa karne ya 2 BK, mara nyingi takriban mwaka 110–130; vipande vilivyosalia vinapatikana katika maandishi ya waandishi walioandika kuanzia karne ya 2 na kuendelea.
