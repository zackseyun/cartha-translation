payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Injili ya Utoto ya Tomaso
      author: Mwandishi hajulikani. Namna ya awali zaidi inayoweza kubainishwa ya maandishi haya haitaji mwandishi; kuhusishwa kwake na Tomaso kunatokana na vichwa vya hati za baadaye na mapokeo yake.
      audience: Wakristo wenye shauku ya kujua kuhusu utoto wa Yesu na jinsi ambavyo nguvu za kimungu, nidhamu, kujifunza na kukomaa kwake vingeweza kusimuliwa kabla ya kuanza kwa masimulizi ya Injili za kikanoni.
      date: Kwa kawaida hufikiriwa kuwa ya karne ya 2 BK, lakini maandishi haya yamehifadhiwa katika matoleo kadhaa ya Kigiriki yanayotofautiana sana na katika tafsiri za zamani.
    Acts of Paul and Thecla:
      display_name: Matendo ya Paulo na Thekla
      author: Mwandishi hajulikani. Hiki ni kisa kutoka katika Matendo ya Paulo yaliyo marefu zaidi; taarifa ya kale kwamba kasisi mmoja aliandika Matendo hayo haiwezi kutambulisha mwandishi kwa uhakika.
      audience: Wakristo waliovutiwa na masimulizi ya mahubiri ya mitume, useja, ubatizo, uvumilivu unaofanana na wa wafiadini, na mamlaka ya mwanamke kufundisha na kutoa ushahidi.
      date: Yalitungwa katika karne ya 2 BK, huenda katika nusu yake ya pili; yalisambazwa kama sehemu ya Matendo ya Paulo na pia kama kitabu kinachojitegemea.
    Gospel of Peter:
      display_name: Injili ya Petro
      author: Mwandishi hajulikani. Simulizi lililohifadhiwa linazungumza kwa sauti ya Petro na lilipitishwa kwa jina lake, lakini halichukuliwi kuwa kazi ya Petro, mtume wa kihistoria.
      audience: Wakristo wa awali waliopendezwa na simulizi lililopanuliwa la mateso na ufufuo, huenda katika jumuiya ambako mamlaka ya Petro ilikuwa na uzito wa pekee.
      date: Kwa kawaida huwekwa katika karne ya 2 BK; kipande kikuu cha Kigiriki kilichohifadhiwa kinatokana na hati ya baadaye sana iliyopatikana Akhmim.
    2 Clement:
      display_name: 2 Klementi
      author: Mwandishi hajulikani. Licha ya jina lake la kimapokeo, hili ni homilia ya Kikristo ya awali, wala si barua ya pili iliyoandikwa na Klementi wa Roma.
      audience: Kusanyiko la Wakristo linalohimizwa kutubu, kuwa na mwenendo thabiti wa kimaadili, kuwajali walio dhaifu, na kuvumilia kwa uaminifu likitumaini ufufuo na hukumu.
      date: Kwa kawaida huwekwa katika nusu ya kwanza au katikati ya karne ya 2 BK (takriban mwaka 100–160); mahali ilipotungwa hapajulikani kwa uhakika.
    Epistle of Barnabas:
      display_name: Waraka wa Barnaba
      author: Mwandishi hajulikani. Kijadi, kitabu hiki kilihusishwa na Barnaba, mwenzi wa Paulo, lakini wanazuoni wa kisasa hawakubali kwamba ndiye aliyekiandika.
      audience: Wakristo wa Mataifa waliofundishwa kuyapokea Maandiko ya Israeli kwa kuyafasiri kwa kumhusu Kristo na kwa mafumbo, huku wakitofautisha utambulisho wao wa agano na desturi za Kiyahudi.
      date: Kwa kawaida huwekwa kati ya kuharibiwa kwa hekalu la Yerusalemu mwaka 70 BK na mwanzoni mwa karne ya 2, mara nyingi takriban mwaka 80–130.
