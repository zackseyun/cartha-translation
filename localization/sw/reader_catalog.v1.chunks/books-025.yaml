review:
  verdict: revise
  review_summary: Imerekebishwa tafsiri yote ya Kiswahili. Marekebisho yalilenga usahihi wa maana, sarufi, na istilahi, hasa vichwa vilivyokuwa na maana iliyopotoka au wakati wa kitenzi usio sahihi.
  issues:
  - Protoevangelium of James 16 ilikuwa na maana ya kitenzi cha kauli ya kutendwa isiyo sahihi; imerekebishwa ili Yosefu ndiye anayemwachilia Maria.
  - Acts of Paul and Thecla 2 ilipunguza maana ya 'longs for Paul'; imerekebishwa.
  - Gospel of Peter 5 ilitafsiri Judea kama Uyahudi badala ya Yudea; imerekebishwa.
  - Gospel of Peter 12 na 14 zilikuwa katika wakati wa zamani badala ya vichwa vya sasa vya chanzo; zimerekebishwa.
  - 2 Clement 13 ilikuwa na muundo usio sahihi wa kisarufi; imerekebishwa.
