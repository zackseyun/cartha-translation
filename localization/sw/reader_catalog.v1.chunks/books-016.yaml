      display_name: 1 Enoko
      author: Mwandishi hajulikani; kwa jina bandia inahusishwa na Enoko, babu wa kale aliyeishi kabla ya gharika. Ni kazi ya mchanganyiko iliyokusanywa kutoka sehemu kadhaa tofauti.
