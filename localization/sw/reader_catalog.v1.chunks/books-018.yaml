payload:
  book_metadata:
    2 Esdras:
      display_name: 2 Esdras
      author: Mwandishi hajulikani, ikiwa na fremu iliyohaririwa na Wakristo kuzunguka sehemu kuu ya awali ya Kiyahudi (4 Ezra, sura 3–14).
      audience: Wayahudi baada ya mwaka 70 BK waliokuwa wakitafakari tatizo la uovu na mateso; baadaye kilipanuliwa kwa ajili ya wasomaji Wakristo.
      date: Sehemu kuu ya Kiyahudi takriban mwaka 100 BK; nyongeza za Kikristo takriban karne ya 2–3 BK.
    Didache:
      display_name: Didache
      author: Mwandishi hajulikani (jina hili linamaanisha “Mafundisho ya Mitume Kumi na Wawili”).
      audience: Makusanyiko ya Wakristo wa awali — mwongozo mfupi kuhusu maadili, ubatizo, Ekaristi, na walimu wanaosafiri.
      date: Takriban mwishoni mwa karne ya 1 hadi mwanzoni mwa karne ya 2 BK.
    Gospel of Thomas:
      display_name: Injili ya Thomaso
      author: Mwandishi hajulikani; maneno ya mwanzo yanahusisha mkusanyo huu wa semi na “Didymos Yuda Thomaso.” Nakala kamili iliyosalia ipo tu katika tafsiri ya Kikoptiki ya karne ya 4 kutoka Nag Hammadi (NHC II,2), pamoja na vipande vitatu vya Kigiriki kutoka Oxyrhynchus.
      audience: Wasomaji Wakristo walioathiriwa na hekima ya Kisiria na fikra za awali za Kignostiki, wakielekezwa kwenye kujijua kwa siri katika semi za Yesu.
      date: Nakala asilia ya Kigiriki huenda iliandikwa takriban miaka 50–140 BK; hati ya Kikoptiki takriban mwaka 340 BK.
      summary: Injili ya Thomaso ni mkusanyo wa semi zinazohusishwa na Yesu. Haina simulizi inayoendelea na inawahimiza wasomaji mara kwa mara kugundua maana ya semi hizo.
