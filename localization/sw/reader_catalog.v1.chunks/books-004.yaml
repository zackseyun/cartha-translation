review:
  verdict: revise
  review_summary: Imerekebishwa kwa Kiswahili fasaha na kwa uaminifu kwa chanzo. Marekebisho makuu yalihusu maana sahihi ya baadhi ya vichwa na maelezo yaliyokosekana.
  issues:
  - '2 Wafalme 1: kichwa kilirahisishwa ili kisiongeze dhana ya hukumu iliyotangazwa.'
  - '2 Wafalme 5: usemi wa utakaso wa Naamani umefanywa wa kisarufi na kamili.'
  - '2 Wafalme 25: ''katika Babeli'' imeongezwa ili kuhifadhi mahali pa tukio katika chanzo.'
  - '1 Wafalme 10: kichwa kimeeleza kuwa malkia alivutiwa na hekima ya Solomoni, badala ya kudokeza kwamba yeye ndiye mwenye hekima.'
