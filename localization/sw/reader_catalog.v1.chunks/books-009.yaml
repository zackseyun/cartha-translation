      author: Ezekieli, kuhani aliyeishi uhamishoni Babeli; maandishi yalihaririwa na kukuzwa baadaye.
      audience: Watu wa Yuda waliokuwa uhamishoni Babeli, wakitafakari upya uwepo wa Mungu mbali na hekalu.
      date: Takriban 593–571 KK kwa huduma ya nabii; umbo la mwisho lilipatikana baadaye kidogo.
    Daniel:
      display_name: Danieli
      author: Mwandishi hajulikani; kitabu kinajitambulisha kuwa cha Danieli wa kipindi cha uhamisho.
