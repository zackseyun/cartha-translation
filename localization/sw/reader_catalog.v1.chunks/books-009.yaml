  - Ezekieli 9 ilikuwa na ujenzi wa kisarufi usio sahihi.
  - Ezekieli 16 na 33 zilihitaji ufafanuzi wa uhusiano wa maana.
  - Danieli 3 iliongeza maelezo ya 'motoni' yasiyopo katika kichwa cha chanzo.
  - Hosea 9 ilirekebishwa ili kuonyesha kupelekwa uhamishoni.
