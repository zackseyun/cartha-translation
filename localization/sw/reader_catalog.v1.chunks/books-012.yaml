      author: Paulo, pamoja na Sosthene.
      audience: Kusanyiko la Kikristo lenye migawanyiko huko Korintho.
      date: karibu 53–55 BK, iliandikwa kutoka Efeso.
    2 Corinthians:
      display_name: 2 Wakorintho
      author: Paulo, pamoja na Timotheo.
      audience: Kusanyiko la Korintho, baada ya mgogoro wenye kuumiza.
      date: karibu 55–56 BK.
