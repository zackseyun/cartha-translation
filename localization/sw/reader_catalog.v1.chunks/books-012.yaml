      display_name: Wagalatia
      author: Paulo.
      audience: Makusanyiko ya Kikristo huko Galatia (Anatolia ya kati) yaliyokuwa yakishinikizwa kukubali tohara na kushika Torati.
      date: karibu 48–55 BK (tarehe hii inajadiliwa).
    Ephesians:
      display_name: Waefeso
      author: Paulo, au mwanafunzi wake wa karibu aliyeandika kwa jina la Paulo (jambo hili linajadiliwa).
      audience: Wasomaji Wakristo kwa ujumla katika Asia; jina la mahali “Efeso” halipo katika hati za kale zaidi.
      date: karibu miaka ya 60 BK ikiwa iliandikwa na Paulo; karibu miaka ya 80–90 BK ikiwa iliandikwa na mtu mwingine kwa jina lake.
    Philippians:
      display_name: Wafilipi
      author: Paulo, pamoja na Timotheo.
      audience: Kusanyiko la Kikristo huko Filipi, koloni la Roma katika Makedonia.
      date: karibu 60–62 BK, iliandikwa kutoka gerezani.
    Colossians:
      display_name: Wakolosai
      author: Paulo, pamoja na Timotheo—au mwanafunzi wa karibu aliyeandika kwa jina la Paulo (jambo hili linajadiliwa).
      audience: Wakristo wa Kolosai katika bonde la Likosi, waliokuwa wakikabili fundisho lililochanganya imani mbalimbali.
      date: karibu 60–62 BK ikiwa iliandikwa na Paulo; baadaye ikiwa iliandikwa na mtu mwingine kwa jina lake.
    1 Thessalonians:
      display_name: 1 Wathesalonike
      author: Paulo, pamoja na Silvano na Timotheo.
      audience: Kusanyiko changa la Kikristo huko Thesalonike, lililokuwa likikabili mateso.
      date: karibu 50–51 BK—huenda ndiyo barua ya Paulo ya zamani zaidi iliyohifadhiwa.
    2 Thessalonians:
      display_name: 2 Wathesalonike
      author: Paulo (jambo hili linajadiliwa; baadhi ya wasomi huona iliandikwa na mtu mwingine kwa jina lake).
      audience: Kusanyiko la Thesalonike, likishughulikia mkanganyiko kuhusu mambo ya mwisho.
      date: karibu 51 BK ikiwa iliandikwa na Paulo.
    1 Timothy:
      display_name: 1 Timotheo
      author: Paulo, au mwanafunzi aliyeandika kwa jina la Paulo (watu wengi huona kuwa Nyaraka za Kichungaji ziliandikwa na mtu mwingine kwa jina lake).
      audience: Timotheo akiwa mwakilishi wa Paulo huko Efeso; mwongozo wa utaratibu wa kanisa katika kipindi cha baadaye.
      date: karibu katikati ya miaka ya 60 BK ikiwa iliandikwa na Paulo; karibu 90–110 BK ikiwa iliandikwa na mtu mwingine kwa jina lake.
    2 Timothy:
      display_name: 2 Timotheo
      author: Paulo, au mwanafunzi aliyeandika kwa jina la Paulo.
      audience: Timotheo—barua imewasilishwa kama maneno ya kuaga ya Paulo kutoka gerezani.
      date: karibu katikati ya miaka ya 60 BK ikiwa iliandikwa na Paulo; karibu 90–110 BK ikiwa iliandikwa na mtu mwingine kwa jina lake.
    Titus:
      display_name: Tito
      author: Paulo, au mwanafunzi aliyeandika kwa jina la Paulo.
      audience: Tito akiwa mwakilishi wa Paulo huko Krete.
      date: karibu katikati ya miaka ya 60 BK ikiwa iliandikwa na Paulo; karibu 90–110 BK ikiwa iliandikwa na mtu mwingine kwa jina lake.
    Philemon:
      display_name: Filemoni
      author: Paulo, pamoja na Timotheo.
      audience: Filemoni, Mkristo aliyemmiliki mtumwa, kuhusu Onesimo, mtumwa wake aliyekuwa amekimbia.
      date: karibu 60–62 BK.
    Hebrews:
      display_name: Waebrania
      author: Mwandishi hajulikani. Mapokeo yametaja Paulo, Apolo, Barnaba, Prisila na wengine; hakuna pendekezo linalokubaliwa kwa pamoja.
      audience: Wakristo Wayahudi waliozungumza Kigiriki na waliokuwa wakishawishika kuacha ungamo lao la Kikristo na kurudi nyuma.
      date: karibu 60–95 BK.
