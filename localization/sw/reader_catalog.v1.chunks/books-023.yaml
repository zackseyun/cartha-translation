payload:
  book_metadata:
    Gospel of Mary:
      display_name: Injili ya Maria
      author: Mwandishi hajulikani. Kazi hii inamwonyesha Maria kama mpokeaji na mfasiri wa ufunuo wa Yesu, lakini haidai kwamba Maria aliandika injili iliyohifadhiwa hadi leo.
      audience: Wasomaji Wakristo wa awali waliokuwa wakitafakari masuala ya ufunuo, kupaa kiroho, mamlaka ya mitume, na uhalali wa mafundisho ya Maria miongoni mwa wanafunzi wa Yesu.
      date: Kwa kawaida hupewa tarehe ya karne ya 2 BK; vipande vya Kigiriki vilivyohifadhiwa ni vya karne ya 3, na ushahidi mkuu wa Kikopti umehifadhiwa katika Kodeksi ya Berlin 8502 ya karne ya 5.
    Treatise on the Resurrection:
      display_name: Maandiko Kuhusu Ufufuo
      author: Mwandishi hajulikani. Kazi hii imeandaliwa kama barua ya mwalimu kwa mwanafunzi anayeitwa Rheginos; mwalimu huyo wala Rheginos hawawezi kutambuliwa kwa uhakika.
      audience: Wakristo waliotafuta mafundisho kuhusu ufufuo, hasa wasomaji waliokuwa wakizingatia ufufuo wa mwili, ufufuo wa kiroho, na kushiriki maisha ya ufufuo katika wakati wa sasa.
      date: Kwa kawaida huwekwa mwishoni mwa karne ya 2 BK (mara nyingi takriban 170–200); imehifadhiwa katika nakala ya Kikopti ya karne ya 4 iliyotafsiriwa kutoka kazi ya awali ya Kigiriki.
    Dialogue of the Savior:
      display_name: Mazungumzo ya Mwokozi
      author: Mwandishi hajulikani. Mazungumzo haya yanaweka mafundisho ya ufunuo kinywani mwa Yesu katika mazungumzo na Yuda, Mathayo, na Maria, lakini hayatambui aliyekusanya maandishi hayo.
      audience: Kundi la Wakristo wa awali lililopendezwa na ufunuo wa faraghani, uanafunzi, kujijua, sala, na maandalizi ya kujinyima kwa ajili ya wokovu.
      date: Kwa kawaida huhusishwa na karne ya 2 BK, ingawa tabaka zake za utunzi na tarehe yake kamili bado zinabishaniwa; imehifadhiwa katika hati ya Kikopti ya karne ya 4.
    Exegesis on the Soul:
      display_name: Ufafanuzi Kuhusu Nafsi
      author: Mwandishi hajulikani. Mwandishi ni mhubiri Mkristo anayezisoma upya taswira za Biblia na fasihi ya Kigiriki kama mfano wa kuanguka, kutubu, na kurejeshwa kwa nafsi.
      audience: Wakristo waliofahamu Maandiko na mawaidha ya kimaadili, waliokuwa wakiitwa waache tamaa zisizo na utaratibu, watubu, na kuungana tena na Mungu.
      date: Kwa ujumla hupewa tarehe ya mwishoni mwa karne ya 2 au mwanzoni mwa karne ya 3 BK; imehifadhiwa katika tafsiri ya Kikopti ya karne ya 4 kutoka Kigiriki.
    Book of Thomas the Contender:
      display_name: Kitabu cha Thoma Mshindani
      author: Mwandishi hajulikani. Kichwa chake cha mwisho kinahusisha kazi hii na Yuda Thoma na kinamtaja Mathaias kuwa mwandishi wa kumbukumbu, lakini haya ni mahusiano ya kifasihi wala si madai ya uandishi yanayoweza kuthibitishwa.
      audience: Wakristo wenye mwelekeo wa maisha ya kujinyima waliohimizwa kujijua, kuzipinga tamaa za mwili, na kuelewa mafundisho ya faraghani ya Yesu kwa Thoma.
      date: Mara nyingi hupewa tarehe ya mwishoni mwa karne ya 2 au mwanzoni mwa karne ya 3 BK, labda katika mazingira ya Ukristo wa Siria; imehifadhiwa katika hati ya Kikopti ya karne ya 4.
    Tripartite Tractate:
      display_name: Maandiko ya Sehemu Tatu
      author: Mwandishi hajulikani. Mwandishi alikuwa mwanatheolojia Mkristo wa Kivalentiniani mwenye elimu ya juu; haiwezekani kumtambulisha kwa uhakika kuwa mwalimu yeyote anayetajwa kwa jina.
      audience: Jumuiya ya Wakristo wa Kivalentiniani iliyopokea mafundisho ya kina kuhusu Mungu, eoni, uumbaji, Kristo, kanisa, wokovu, na urejesho wa mwisho.
      date: Kwa kawaida hupewa tarehe ya karne ya 3 BK, huku baadhi ya hoja zikielekeza nusu ya mwisho ya karne hiyo; imehifadhiwa kwa Kikopti katika Kodeksi ya Jung ya karne ya 4.
    Apocryphon of John:
      display_name: Kitabu cha Siri cha Yohana
      author: Mwandishi hajulikani. Kwa kutumia jina lisilo la mwandishi halisi, kazi hii inajionyesha kuwa ufunuo wa Yesu aliyefufuka kwa Yohana mwana wa Zebedayo, na imehifadhiwa katika matoleo zaidi ya moja ya kale.
      audience: Wakristo katika mapokeo ya ufunuo ya Kisethi au yanayohusiana kwa karibu nayo, waliotafuta maelezo kuhusu ulimwengu wa kimungu, uumbaji, utambulisho wa mwanadamu, na kukombolewa kutoka kwa watawala wenye uhasama.
      date: Huenda muundo wake wa awali ulisambazwa katika karne ya 2 BK; ushahidi wa Kikopti uliohifadhiwa, wenye matoleo mafupi na marefu, ni wa karne ya 4 na ya 5.
