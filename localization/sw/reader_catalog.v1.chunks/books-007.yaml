    Proverbs:
      display_name: Mithali
      author: Mkusanyo wa maandishi; vichwa vya sehemu vinawataja Sulemani, Aguri, Lemueli, na “wenye hekima.”
      audience: Vijana Waisraeli waliokuwa wakifunzwa hekima kwa ajili ya maisha ya kila siku.
      date: Tabaka za utunzi, takriban karne ya 10–4 KK.
    Ecclesiastes:
      display_name: Mhubiri
      author: Mwandishi hajulikani; msemaji ni “Qoheleti,” ambaye kwa mapokeo hutambulishwa kuwa Sulemani.
      audience: Waisraeli waliokabili mipaka ya hekima, utajiri, na juhudi chini ya jua.
      date: Huenda iliandikwa takriban karne ya 5–3 KK, kwa kuzingatia Kiebrania kilichoathiriwa na Kiaramu.
    Song of Solomon:
      display_name: Wimbo Ulio Bora
      author: Mwandishi hajulikani; kichwa cha utangulizi kinamtaja Sulemani.
      audience: Israeli ikisoma mapenzi ya kimahaba kama njia ya kuelewa ukaribu wa agano—na baadaye, wasomaji Wayahudi na Wakristo wakiusoma kwa njia ya fumbo.
      date: Huenda iliandikwa baada ya uhamisho, takriban karne ya 5–3 KK.
