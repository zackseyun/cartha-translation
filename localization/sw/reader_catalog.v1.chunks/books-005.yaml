    Nehemiah:
      display_name: Nehemia
      author: Haijulikani; kinajumuisha kumbukumbu za nafsi ya kwanza zinazohusishwa na Nehemia.
      audience: Watu waliorudi kutoka uhamishoni, wakajenga upya kuta za Yerusalemu na kufanya upya agano chini ya utawala wa Uajemi.
