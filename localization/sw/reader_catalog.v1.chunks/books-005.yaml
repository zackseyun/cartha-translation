      display_name: Ayubu
      author: Haijulikani.
      audience: Waisraeli wanaotafakari mateso ya mtu asiye na hatia na haki ya Mungu.
      date: Makubaliano ya wataalamu wa mapokeo ya hekima huweka kitabu hiki takriban karne ya 6–4 KK, kikitumia masimulizi ya jadi ya kale zaidi.
