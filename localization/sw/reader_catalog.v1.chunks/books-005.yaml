      display_name: Zaburi
      author: Waandishi wengi katika karne mbalimbali; vichwa vya zaburi vinawataja Daudi, Asafu, Kora, Solomoni, Musa, na wengine.
      audience: Israeli na kusanyiko la hekaluni katika ibada—na kila jumuiya ya baadaye ya sala na maombolezo.
      date: Zilitungwa takriban karne ya 10–3 KK; mkusanyo wa mwisho ulikamilishwa katika kipindi cha baada ya uhamisho.
