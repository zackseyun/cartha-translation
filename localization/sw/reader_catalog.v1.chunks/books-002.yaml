    Numbers:
      display_name: Hesabu
      author: Mwandishi hajulikani; kwa mapokeo, kitabu hiki huhusishwa na Musa.
      audience: Israeli waliokuwa safarini kati ya Misri na nchi ya ahadi—kizazi cha jangwani, pamoja na wasomaji wa baadaye waliojifunza kutokana na makosa yao.
      date: Tabaka za utunzi kutoka kipindi cha mwisho cha ufalme hadi kipindi cha baada ya uhamisho (takriban karne ya 7–5 KK).
    Deuteronomy:
      display_name: Kumbukumbu la Torati
      author: Mwandishi hajulikani; kitabu hiki kinawasilishwa kama hotuba za Musa za kuaga. Usomi wa kisasa unaweka kiini chake katika mageuzi ya mwishoni mwa karne ya 7 KK chini ya Yosia.
      audience: Israeli waliokuwa wakijiandaa kuingia katika nchi—na, baadaye, wahamishwa waliouliza jinsi ya kuishi kwa uaminifu bila hekalu wala mfalme.
      date: Kiini chake ni cha takriban mwishoni mwa karne ya 7 KK; kilifikia muundo wake wa mwisho katika kipindi cha uhamisho.
    Joshua:
      display_name: Yoshua
      author: Mwandishi hajulikani; ni sehemu ya Historia ya Kumbukumbu la Torati.
      audience: Israeli katika nyakati za ufalme na uhamisho, wakitafakari kuhusu kutwaa nchi, agano, na maana ya nchi hiyo.
      date: Kilikusanywa takriban katika karne ya 7–6 KK kutokana na mapokeo ya zamani zaidi.
