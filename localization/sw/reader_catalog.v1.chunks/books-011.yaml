    Luke:
      display_name: Luka
      author: Mwandishi hajulikani; mapokeo yanahusisha kitabu hiki na Luka, aliyesafiri pamoja na Paulo.
      audience: Wasomaji Wakristo wenye elimu katika ulimwengu wa Kigiriki na Kirumi, kikielekezwa kwa “Theofilo.”
      date: Takriban mwaka 80–90 BK.
    John:
      display_name: Yohana
      author: Mwandishi hajulikani; mapokeo yanahusisha kitabu hiki na mtume Yohana au “Mwanafunzi Aliyependwa.”
      audience: Jumuiya ya Kikristo iliyokuwa na mvutano na Uyahudi wa masinagogi, iliyoundwa kuzunguka ushuhuda wa Mwanafunzi Aliyependwa.
      date: Takriban mwaka 90–110 BK.
      summary: Yohana anamwasilisha Yesu kama Neno la milele anayemfunua Baba, anayetoa uzima kwa wale wanaomtumaini, na anayetukuzwa kupitia ishara zake, kifo chake na ufufuo wake.
    Acts:
      display_name: Matendo
      author: Mwandishi hajulikani; ni mwandishi yuleyule wa Luka.
      audience: Wasomaji Wakristo katika ulimwengu wa Kigiriki na Kirumi; ni juzuu ya pili ya kitabu kilichoelekezwa kwa Theofilo.
      date: Takriban mwaka 80–90 BK.
    Romans:
      display_name: Waroma
      author: Paulo, akisaidiwa na mwandishi Tertio.
      audience: Wakristo waliokuwa Roma—waumini Wayahudi na wasio Wayahudi waliokuwa na mvutano kuhusu Torati na utambulisho.
      date: Takriban mwaka 56–58 BK, kikiandikwa kutoka Korintho.
