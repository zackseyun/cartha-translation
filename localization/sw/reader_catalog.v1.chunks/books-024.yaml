payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Uhalisi wa Watawala
      author: Mwandishi hajulikani. Mwandishi anafasiri Mwanzo kupitia simulizi la ufunuo kuhusu watawala wa ulimwengu; kazi hii haiwezi kuhusishwa kwa uhakika na mwalimu yeyote anayetajwa kwa jina.
      audience: Wakristo katika mazingira ya Wasethi au kundi linalohusiana nao, waliosoma Mwanzo kama mgogoro kati ya watawala wajinga wa ulimwengu, hekima ya kimungu, na asili ya kiroho ya wanadamu.
      date: Kwa kawaida huwekwa katika karne ya 3 BK; imehifadhiwa katika nakala ya Kikopti ya karne ya 4 katika Kodeksi ya Pili ya Nag Hammadi.
    On the Origin of the World:
      display_name: Kuhusu Asili ya Ulimwengu
      author: Mwandishi hajulikani. Kazi hii inaunganisha na kurekebisha mapokeo kadhaa ya Kiyahudi, Kikristo, Kiplato na ya kingano bila kumtaja aliyekusanya maandishi hayo.
      audience: Wasomaji katika mazingira ya Kikristo yenye mwelekeo wa Kignostiki waliotafuta simulizi mbadala la historia ya uumbaji, watawala wa ulimwengu, Sofia, Adamu na Hawa, na hatima ya mwisho ya ulimwengu.
      date: Kwa kawaida hupewa tarehe ya karne ya 3 BK, ingawa huenda ikategemea nyenzo za mapema zaidi; imehifadhiwa hasa katika hati za Kikopti za karne ya 4.
    Sophia of Jesus Christ:
      display_name: Hekima ya Yesu Kristo
      author: Mwandishi hajulikani. Mwandishi anabadilisha nyenzo inayojulikana pia kutoka Eugnostos na kuifanya kuwa mazungumzo kati ya Yesu na wanafunzi wake baada ya kufufuka.
      audience: Wakristo waliopendezwa na hekima iliyofunuliwa kuhusu Mungu aliye juu ya yote, mpangilio wa ulimwengu wa mbinguni, na asili na wokovu wa nafsi.
      date: Mara nyingi hupewa tarehe ya mwishoni mwa karne ya 2 au karne ya 3 BK; imehifadhiwa katika nakala za Kikopti kutoka Nag Hammadi na Kodeksi ya Berlin.
    Gospel of the Egyptians:
      display_name: Injili ya Wamisri
      author: Mwandishi hajulikani. Kazi hii ya Nag Hammadi, inayoitwa pia Kitabu Kitakatifu cha Roho Mkuu Asiyeonekana, ni tofauti na Injili ya Wamisri ya awali iliyoandikwa kwa Kigiriki na inayojulikana kupitia nukuu pekee.
      audience: Jumuiya ya Kikristo ya Kisethi iliyotumia ngano nzito, majina matakatifu, taswira za ubatizo na sifa za kiwimbo kueleza utambulisho wa kiroho na ukombozi.
      date: Kwa kawaida huhusishwa na karne ya 2 au ya 3 BK; nakala mbili za Kikopti zimesalia katika kodeksi za Nag Hammadi za karne ya 4.
    Letter of Peter to Philip:
      display_name: Barua ya Petro kwa Filipo
      author: Mwandishi hajulikani. Barua fupi ya utangulizi na ufunuo unaofuata vinahusishwa kwa kutumia majina ya Petro na Filipo, lakini hakuna uhakika kwamba mtume yeyote kati yao ndiye aliyeviandika.
      audience: Wakristo waliotafuta mamlaka ya kitume kwa mafundisho kuhusu Mwokozi, nguvu zenye uhasama, mateso, utume na kurejeshwa kwa wanafunzi.
      date: Kwa kawaida hupewa tarehe ya mwishoni mwa karne ya 2 au mwanzoni mwa karne ya 3 BK; imehifadhiwa katika nakala ya Nag Hammadi ya karne ya 4 na hati nyingine ya Kikopti ya baadaye.
    Gospel of Judas:
      display_name: Injili ya Yuda
      author: Mwandishi hajulikani. Kichwa kinahusisha simulizi hili na Yuda, lakini kazi hii haithibitishi kwamba Yuda Iskariote ndiye mwandishi wake wa kihistoria.
      audience: Kundi la Kikristo lililokosoa desturi za dhabihu na za kikanisa za makundi mengine, likitumia mazungumzo ya ufunuo na kosmolojia ya aina ya Kisethi kutafsiri upya Yuda na kifo cha Yesu.
      date: Kwa kawaida hupewa tarehe ya katikati au mwishoni mwa karne ya 2 BK; Irenaeus aliijua Injili ya Yuda kufikia takriban mwaka 180, na huenda nakala ya Kikopti iliyosalia ni ya karne ya 3 au ya 4.
    Protoevangelium of James:
      display_name: Injili ya Awali ya Yakobo
      author: Mwandishi hajulikani. Msimulizi anadai kuwa Yakobo, lakini kazi hii inatumia jina lake kwa jina la bandia na haikuandikwa na Yakobo ndugu yake Yesu.
      audience: Wakristo waliopendezwa na kuzaliwa na kulelewa kwa Maria, usafi wake wa kudumu, kuzaliwa kwa Yesu, na majibu ya kisimulizi kwa maswali yaliyoachwa wazi na Mathayo na Luka.
      date: Kwa ujumla hupewa tarehe ya nusu ya pili ya karne ya 2 BK; imesalia katika miswada mingi ya baadaye ya Kigiriki na tafsiri za kale.
