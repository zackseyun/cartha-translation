      author: Mwandishi hajulikani; kitabu kimehusishwa kwa jina bandia na Baruku, mwandishi wa Yeremia.
      audience: Wayahudi wa ughaibuni waliotafakari kuhusu uhamisho, toba na hekima.
      date: Takriban karne ya 2 KK.
    1 Maccabees:
      display_name: 1 Wamakabayo
      author: Mwandishi hajulikani, huenda alikuwa mwandishi wa Yerusalemu aliyeandika kwa Kiebrania (ni maandishi ya Kigiriki pekee yaliyosalia).
      audience: Wayahudi wakati wa uasi wa Wahasmonea na baada yake; kitabu kinasimulia uhalali wa nasaba ya Wahasmonea.
      date: Takriban 100 KK.
    2 Maccabees:
      display_name: 2 Wamakabayo
