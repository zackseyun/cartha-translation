      author: Yeshua mwana wa Eleazari mwana wa Sira wa Yerusalemu; tafsiri ya Kigiriki ilifanywa na mjukuu wake.
      audience: Vijana wanaume Wayahudi waliokuwa wakifundishwa hekima katika Yerusalemu ya kipindi cha Uyunani.
