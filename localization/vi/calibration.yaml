book_localizations:
- source_title: Genesis
  title: Sáng Thế Ký
  author: Khuyết danh; theo truyền thống được cho là do Môi-se viết. Giới nghiên cứu hiện đại cho rằng sách có một lịch sử hình thành lâu dài, với các nguồn tư liệu về sau được biên tập lại với nhau.
  audience: Dân Y-sơ-ra-ên trong bản sắc giao ước của mình, qua câu chuyện về nguồn gốc của dân được đặt nền trên công cuộc sáng tạo, sự tuyển chọn và lời hứa của Đức Chúa Trời.
  date: Được hình thành qua nhiều thế kỷ; đạt đến dạng văn bản được tiếp nhận vào khoảng thế kỷ VI–V TCN, trong hoặc sau thời kỳ lưu đày tại Ba-by-lôn.
  summary: Sáng Thế Ký kể về công cuộc sáng tạo, sự phản nghịch và phân tán của loài người, cùng gia đình của Áp-ra-ham, Y-sác, Gia-cốp và Giô-sép, qua đó các lời hứa giao ước của Đức Chúa Trời dành cho Y-sơ-ra-ên bắt đầu.
- source_title: John
  title: Phúc Âm Giăng
  author: Khuyết danh; truyền thống quy sách này cho sứ đồ Giăng hoặc “môn đồ được yêu mến”.
  audience: Một cộng đồng Cơ Đốc đang căng thẳng với Do Thái giáo gắn với hội đường, được hình thành quanh lời chứng của môn đồ được yêu mến.
  date: Khoảng năm 90–110 SCN.
  summary: Phúc Âm Giăng trình bày Giê-su là Ngôi Lời đời đời, Đấng bày tỏ Đức Chúa Cha, ban sự sống cho những ai tin cậy Ngài, và được tôn vinh qua các dấu lạ, sự chết và sự sống lại của Ngài.
- source_title: Gospel of Thomas
  title: Phúc Âm Tô-ma
  author: Khuyết danh; lời mở đầu quy tuyển tập các lời nói này cho “Đi-đi-mô Giu-đa Tô-ma”. Toàn văn chỉ còn được bảo tồn trong một bản dịch tiếng Copt thế kỷ IV từ Nag Hammadi (NHC II,2), cùng ba mảnh tiếng Hy Lạp từ Oxyrhynchus.
  audience: Độc giả Cơ Đốc chịu ảnh hưởng của truyền thống khôn ngoan Syria và tư tưởng tiền Ngộ đạo, hướng đến sự tự nhận biết mang tính bí truyền qua các lời nói của Giê-su.
  date: Bản gốc tiếng Hy Lạp có lẽ vào khoảng năm 50–140 SCN; bản chép tay tiếng Copt vào khoảng năm 340 SCN.
  summary: Phúc Âm Tô-ma là một tuyển tập các lời nói được quy cho Giê-su. Sách không có cốt truyện liên tục và nhiều lần kêu gọi người đọc khám phá ý nghĩa của các lời nói ấy.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Sáng Thế Ký 1:1
  text: Khi Đức Chúa Trời bắt đầu sáng tạo trời và đất[a]—
  translator_note: '[a] Bản dịch truyền thống xem câu này là một câu hoàn chỉnh: “Ban đầu, Đức Chúa Trời sáng tạo trời và đất.” Tuy nhiên, cách diễn đạt tiếng Hê-bơ-rơ tự nhiên hơn khi được hiểu là phần mở đầu cho những gì tiếp theo, còn hành động chính là “Đức Chúa Trời phán” ở câu 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Truyền Đạo 1:2
  text: “Hơi sương của mọi hơi sương[a],” Qoheleth[b] nói. “Mọi sự đều là hơi sương—thoáng qua, không thể nắm giữ và thường không như ta mong đợi.”
  translator_note: '[a] Từ hevel trong tiếng Hê-bơ-rơ có nghĩa đen là hơi thở hoặc hơi sương. Xuyên suốt sách Truyền Đạo, từ này mô tả điều chóng qua, không thể nắm giữ hay hiểu thấu, và thường diễn ra khác với điều người ta mong đợi. “Hơi sương” giữ lại hình ảnh ấy mà không khẳng định rằng mọi sự đều vô nghĩa. Các cách dịch khác có thể là “hơi thở”, “chỉ là hơi thở” hoặc “phù du”. [b] Qoheleth là tên hoặc danh xưng tiếng Hê-bơ-rơ của tác giả. Từ này thường được dịch là “Người Dạy” hoặc “Nhà Truyền Đạo”, nhưng ở đây giữ nguyên “Qoheleth” để bảo toàn mọi nghĩa có thể có mà không thiên về một cách giải thích.'
- source_path: nt/john/001/001.yaml
  reference: Giăng 1:1
  text: Ban đầu[b], Ngôi Lời đã hiện hữu. Ngôi Lời ở cùng Đức Chúa Trời, và Ngôi Lời là Đức Chúa Trời.[a]
  translator_note: '[a] Cũng có thể dịch: “Ngôi Lời có bản tính thần linh” hoặc “Đức Chúa Trời thế nào thì Ngôi Lời cũng như vậy”. Cách diễn đạt trong tiếng Hy Lạp khẳng định Ngôi Lời hoàn toàn là Đức Chúa Trời, đồng thời phân biệt Ngôi Lời với Đức Chúa Trời trong mệnh đề trước. [b] Lời mở đầu này gợi lại Sáng Thế Ký 1:1 và liên kết Ngôi Lời với khởi nguyên của công cuộc sáng tạo. Cụm “đã hiện hữu” cho biết Ngôi Lời vốn hiện hữu khi sự khởi đầu đến, chứ không phải lúc ấy mới bắt đầu hiện hữu; cũng có thể dịch đơn giản là “đã có” hoặc “hiện hữu”.'
- source_path: nt/romans/003/025.yaml
  reference: Rô-ma 3:25
  text: Đức Chúa Trời đã đặt Ngài ra làm sinh tế chuộc tội[a], qua đức tin trong huyết Ngài[b]. Ngài làm vậy để bày tỏ sự công chính[c] của mình, vì Ngài đã bỏ qua những tội lỗi đã phạm trong quá khứ.
  translator_note: '[a] Cũng có thể dịch là “lễ vật làm nguôi cơn thịnh nộ” hoặc “nắp thi ân”, tức nắp bằng vàng của Hòm Giao Ước, nơi huyết chuộc tội được rảy lên trong Cựu Ước. [b] Cũng có thể dịch: “qua đức tin, bởi huyết Ngài”. [c] Cũng có thể dịch là “sự công minh”.'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Phi-e-rơ 1:13
  text: Vì vậy, hãy chuẩn bị tâm trí để hành động.[a] Hãy hoàn toàn tỉnh táo và đặt trọn niềm hy vọng vào ân điển đang được đem đến cho anh chị em khi Giê-su, Đấng Mê-si, được bày tỏ.[b]
  translator_note: '[a] Nguyên văn Hy Lạp nói: “hãy thắt lưng cho tâm trí anh chị em”. Hình ảnh này nói đến việc túm áo dài và buộc quanh eo để sẵn sàng hành động. [b] Từ Hy Lạp được dịch bằng “hoàn toàn” và “trọn” có thể bổ nghĩa cho việc tỉnh táo, cho việc đặt hy vọng, hoặc có thể cho cả hai.'
