review:
  verdict: revise
  summary: Đã chỉnh một số chỗ để sát nguồn hơn và tránh thêm tước hiệu hay sắc thái giải thích không có trong bản nguồn; đồng thời làm cho một số diễn đạt tự nhiên hơn trong tiếng Việt hiện đại.
  issues:
  - Các chỗ “Chúa Giê-su”/“môn đồ được Chúa yêu” thêm tước hiệu “Chúa” không có trong ngữ cảnh nguồn; đã đổi thành “Giê-su” và “môn đồ được yêu mến”.
  - Phần độc giả của Giăng và Tô-ma được diễn đạt lại để sát hơn với “synagogue Judaism” và “esoteric self-knowledge”.
  - Một vài cách diễn đạt về dạng văn bản, sự tuyển chọn và chú thích được hiệu chỉnh cho tự nhiên, chính xác hơn.
  - Câu Rô-ma 3:25 được chỉnh “nhờ đức tin nơi huyết Ngài” thành “qua đức tin trong huyết Ngài” để giữ sát cấu trúc nguồn, trong khi chú thích vẫn giữ phương án thay thế.
