payload:
  book_metadata:
    2 Esdras:
      display_name: 2 Esdras
      author: Khuyết danh, với một phần khung do Cơ Đốc giáo biên tập bao quanh phần cốt lõi Do Thái nguyên thủy (4 Ezra, các chương 3–14).
      audience: Người Do Thái sau năm 70 CN đang trăn trở về vấn đề thần lý; về sau được mở rộng cho độc giả Cơ Đốc.
      date: Phần cốt lõi Do Thái khoảng năm 100 CN; các phần bổ sung Cơ Đốc khoảng thế kỷ 2–3 CN.
    Didache:
      display_name: Didache
      author: Khuyết danh (nhan đề có nghĩa là "Giáo huấn của Mười Hai Sứ Đồ").
      audience: Các hội chúng Cơ Đốc thời kỳ đầu — một cẩm nang ngắn gọn về đạo đức, phép báp-têm, lễ tạ ơn và các giáo sư lưu hành.
      date: Khoảng cuối thế kỷ 1 – đầu thế kỷ 2 CN.
    Gospel of Thomas:
      display_name: Phúc âm Thomas
      author: Khuyết danh; lời mở đầu quy bộ sưu tập các lời nói này cho "Didymos Judas Thomas". Bản văn đầy đủ còn tồn tại chỉ trong một bản dịch tiếng Copt thế kỷ 4 từ Nag Hammadi (NHC II,2), cùng với ba mảnh bản văn tiếng Hy Lạp từ Oxyrhynchus.
      audience: Độc giả Cơ Đốc chịu ảnh hưởng của truyền thống khôn ngoan Syria và tư tưởng tiền Ngộ đạo, hướng đến sự tự tri huyền nhiệm trong các lời nói của Giê-su.
      date: Bản gốc tiếng Hy Lạp có lẽ vào khoảng năm 50–140 CN; bản thảo tiếng Copt khoảng năm 340 CN.
      summary: Phúc âm Thomas là một tuyển tập các lời nói được quy cho Giê-su. Sách không có một câu chuyện xuyên suốt và nhiều lần kêu gọi độc giả khám phá ý nghĩa của các lời nói ấy.
