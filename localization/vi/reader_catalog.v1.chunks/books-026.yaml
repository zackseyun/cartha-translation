  book_metadata:
    Letters of Ignatius:
      display_name: Các thư của Ignatius
      author: Ignatius, giám mục thành Antioch, là tác giả của bảy thư thuộc bản trung bình thường được chấp nhận; các thư Ignatius được mở rộng về sau và các thư mạo danh không nằm trong tuyển tập này.
      audience: Các hội chúng Cơ Đốc tại Ephesus, Magnesia, Tralles, Rome, Philadelphia và Smyrna, cùng với Polycarp, là những người được gửi thư trong hành trình Ignatius hướng đến cuộc tử đạo.
      date: Thường được định niên đại vào đầu thế kỷ II SCN, phổ biến là khoảng năm 105–117, dù niên biểu chính xác về hành trình của Ignatius vẫn còn được tranh luận.
