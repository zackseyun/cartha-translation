      display_name: 1 Tê-sa-lô-ni-ca
      author: Phao-lô, cùng với Sin-vanh và Ti-mô-thê.
      audience: Hội chúng Cơ Đốc non trẻ tại Tê-sa-lô-ni-ca, đang chịu sự bắt bớ.
      date: Khoảng năm 50–51 CN — có lẽ là thư cổ nhất còn lưu lại của Phao-lô.
    2 Thessalonians:
      display_name: 2 Tê-sa-lô-ni-ca
      author: Phao-lô (còn tranh luận; một số học giả cho rằng thư được viết dưới danh nghĩa ông).
      audience: Hội chúng Tê-sa-lô-ni-ca, nhằm giải đáp sự hoang mang về thời kỳ cuối cùng.
      date: Khoảng năm 51 CN nếu do Phao-lô viết.
    1 Timothy:
      display_name: 1 Ti-mô-thê
      author: Phao-lô, hoặc một môn đệ viết dưới danh nghĩa Phao-lô (các Thư Mục vụ được nhiều người cho là viết dưới danh nghĩa ông).
      audience: Ti-mô-thê, người đại diện của Phao-lô tại Ê-phê-sô; đồng thời là sách hướng dẫn về cơ cấu hội thánh trong thời kỳ sau.
      date: Khoảng giữa thập niên 60 CN nếu do Phao-lô viết; khoảng năm 90–110 CN nếu viết dưới danh nghĩa ông.
    2 Timothy:
      display_name: 2 Ti-mô-thê
      author: Phao-lô, hoặc một môn đệ viết dưới danh nghĩa Phao-lô.
      audience: Ti-mô-thê — được trình bày như lời từ biệt của Phao-lô từ trong tù.
      date: Khoảng giữa thập niên 60 CN nếu do Phao-lô viết; khoảng năm 90–110 CN nếu viết dưới danh nghĩa ông.
    Titus:
      display_name: Tít
      author: Phao-lô, hoặc một môn đệ viết dưới danh nghĩa Phao-lô.
      audience: Tít, người đại diện của Phao-lô tại đảo Cơ-rết.
      date: Khoảng giữa thập niên 60 CN nếu do Phao-lô viết; khoảng năm 90–110 CN nếu viết dưới danh nghĩa ông.
    Philemon:
      display_name: Phi-lê-môn
      author: Phao-lô, cùng với Ti-mô-thê.
      audience: Phi-lê-môn, một chủ nô Cơ Đốc, về Ô-nê-sim, người nô lệ đã bỏ trốn của ông.
      date: Khoảng năm 60–62 CN.
    Hebrews:
      display_name: Hê-bơ-rơ
      author: Khuyết danh. Truyền thống từng nêu tên Phao-lô, A-pô-lô, Ba-na-ba, Bê-rít-sin và những người khác; không giả thuyết nào đạt được sự đồng thuận.
      audience: Các Cơ Đốc nhân gốc Do Thái nói tiếng Hy Lạp đang bị cám dỗ trôi giạt trở lại khỏi lời tuyên xưng đức tin Cơ Đốc của mình.
      date: Khoảng năm 60–95 CN.
