  book_metadata:
    1 Corinthians:
      display_name: 1 Cô-rinh-tô
      author: Phao-lô, cùng với Sốt-then.
      audience: Hội chúng Cơ Đốc tại Cô-rinh-tô đang bị chia rẽ.
      date: Khoảng năm 53–55 CN, viết từ Ê-phê-sô.
    2 Corinthians:
      display_name: 2 Cô-rinh-tô
      author: Phao-lô, cùng với Ti-mô-thê.
      audience: Hội chúng Cô-rinh-tô, sau một cuộc xung đột đau lòng.
      date: Khoảng năm 55–56 CN.
    Galatians:
      display_name: Ga-la-ti
      author: Phao-lô.
      audience: Các hội chúng Cơ Đốc tại Ga-la-ti (miền trung Anatolia) đang chịu áp lực phải cắt bì và tuân giữ Luật Torah.
      date: Khoảng năm 48–55 CN (còn tranh luận).
    Ephesians:
      display_name: Ê-phê-sô
      author: Phao-lô, hoặc một môn đệ thân cận viết dưới danh nghĩa Phao-lô (còn tranh luận).
      audience: Độc giả Cơ Đốc nói chung tại Tiểu Á; địa danh “Ê-phê-sô” không xuất hiện trong các thủ bản cổ nhất.
      date: Khoảng thập niên 60 CN nếu do Phao-lô viết; khoảng thập niên 80–90 CN nếu viết dưới danh nghĩa ông.
    Philippians:
      display_name: Phi-líp
      author: Phao-lô, cùng với Ti-mô-thê.
      audience: Hội chúng Cơ Đốc tại Phi-líp, một thuộc địa La Mã ở Ma-xê-đô-ni-a.
      date: Khoảng năm 60–62 CN, viết trong tù.
    Colossians:
      display_name: Cô-lô-se
      author: Phao-lô, cùng với Ti-mô-thê — hoặc một môn đệ thân cận viết dưới danh nghĩa Phao-lô (còn tranh luận).
      audience: Các Cơ Đốc nhân tại Cô-lô-se trong thung lũng Lycus, đang đối diện với một giáo thuyết pha trộn nhiều tín ngưỡng.
      date: Khoảng năm 60–62 CN nếu do Phao-lô viết; muộn hơn nếu viết dưới danh nghĩa ông.
