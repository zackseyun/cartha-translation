review:
  verdict: revise
  review_summary: Đã hiệu chỉnh các chỗ làm lệch sắc thái nguồn, gồm cách diễn đạt về đền thờ, việc Phao-lô bảo vệ chức sứ đồ, lời cam kết về sự nhu mì, “jealousy”, và tình trạng “drift back” trong Hê-bơ-rơ. Các mục còn lại được giữ nguyên vì đầy đủ và trung thành với nguồn.
  issues:
  - '1 Corinthians 3: Bản nháp diễn đạt thiếu tự nhiên và không nêu rõ đối tượng của lời cảnh báo liên quan đến đền thờ.'
  - '1 Corinthians 9: “freely” bị chuyển thành “thẳng thắn”, làm thay đổi sắc thái.'
  - '2 Corinthians 10–11: “pledged” và “jealousy” chưa được phản ánh chính xác.'
  - 'Hebrews metadata audience: “drift back” bị làm mạnh thành “từ bỏ”; đã sửa thành ý trôi giạt/trở lại.'
