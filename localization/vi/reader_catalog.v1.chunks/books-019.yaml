review:
  verdict: revise
  review_summary: Đã rà soát toàn bộ chunk và chỉnh các tiêu đề có sai lệch nghĩa, đảo quan hệ, làm nhẹ sắc thái, hoặc thêm chi tiết không có trong nguồn. Không có trường thiếu và không cần chuyển thẩm định thủ công.
  issues:
  - Gospel of Thomas 55 thêm chi tiết “người thân” không có trong nguồn.
  - Gospel of Thomas 56 và 80 đảo/biến đổi quan hệ của mệnh đề về thế gian, thân xác và sự không xứng đáng.
  - Gospel of Thomas 77 diễn giải quá mức cấu trúc “speaks as”; đã điều chỉnh sát nguồn hơn.
  - Gospel of Thomas 101 làm nhẹ “Hate”, 102 làm nhẹ “Curses”, và 110 thêm trình tự thời gian không có trong nguồn.
  - Gospel of Thomas 111 đã thay đại từ mơ hồ bằng quy chiếu phù hợp với “Him”.
  - Gospel of Truth 7 đã điều chỉnh để giữ đối tượng “Names” là điều được Cha đem ra.
  - Jubilees 6 đã giữ động từ “covenants”; Jubilees 9 đã dịch “spirits” là các linh hồn.
