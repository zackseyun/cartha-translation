payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: Thư của Polycarp gửi tín hữu Philippi
      author: Polycarp, giám mục Smyrna. Một số học giả cho rằng văn bản được lưu truyền là sự kết hợp của những phần được gửi vào nhiều thời điểm khác nhau.
      audience: Cộng đoàn Cơ Đốc tại Philippi, nơi đã xin các thư của Ignatius và nhận được lời khuyên về đức tin, cách sống, vai trò lãnh đạo, tiền bạc và sự bền lòng.
      date: Khoảng đầu đến giữa thế kỷ II sau Công nguyên; ít nhất một phần có liên hệ chặt chẽ với hành trình của Ignatius, trong khi giả thuyết về một bức thư hợp thành cho phép xác định một phần khác vào thời điểm muộn hơn đôi chút.
    Martyrdom of Polycarp:
      display_name: Cuộc tử đạo của Polycarp
      author: Các thành viên khuyết danh của hội thánh tại Smyrna, viết nhân danh cộng đoàn; những ghi chú về quá trình lưu truyền ở phần cuối phản ánh việc sao chép và phổ biến về sau.
      audience: Hội thánh tại Philomelium và cộng đồng Cơ Đốc rộng lớn hơn; tác phẩm thuật lại việc Polycarp bị bắt, bị xét xử và chịu chết, cùng sự kiên trung gương mẫu của ông.
      date: Được viết sau khi Polycarp qua đời, thường được định niên đại vào khoảng giữa hoặc cuối thế kỷ II sau Công nguyên; cả năm chính xác của cuộc tử đạo lẫn hình thức hoàn chỉnh cuối cùng của văn bản đều còn gây tranh luận.
    Epistle to Diognetus:
      display_name: Thư gửi Diognetus
      author: Khuyết danh. Người viết tự gọi mình là môn đệ hoặc người học hỏi, nhưng không thể xác định chắc chắn danh tính của ông hay của Diognetus, người nhận thư.
      audience: Một người ngoài Cơ Đốc giáo có học thức đang tìm hiểu—cùng những độc giả giống ông—với các câu hỏi về sự thờ phượng, đạo đức, căn tính xã hội, tình yêu thương của người Cơ Đốc và vẻ dường như mới mẻ của đức tin này.
      date: Thường được định niên đại vào cuối thế kỷ II hoặc đầu thế kỷ III sau Công nguyên, dù các đề xuất rất khác nhau; hai chương cuối có thể xuất phát từ một tác phẩm khác.
    Fragments of Papias:
      display_name: Các mảnh văn của Papias
      author: Papias, giám mục Hierapolis, là tác giả của bộ Giải thích các lời phán của Chúa gồm năm quyển nay đã thất truyền; tuyển tập còn lại gồm những trích dẫn và lời thuật được các tác giả đời sau lưu giữ.
      audience: Các Cơ Đốc nhân thời kỳ đầu tìm kiếm những lời dạy được lưu truyền về Chúa Giê-su và các sứ đồ, được thu thập qua những chuỗi chứng từ truyền miệng và lời giải thích có nêu danh người truyền lại.
      date: Tác phẩm của Papias thường được định niên đại vào đầu thế kỷ II sau Công nguyên, thường khoảng năm 110–130; các mảnh văn còn lại xuất hiện trong tác phẩm của những tác giả viết từ thế kỷ II trở đi.
