payload:
  book_metadata:
    Joel:
      display_name: Giô-ên
      author: Giô-ên, con trai Phê-thu-ên.
      audience: Người Giu-đa thời hậu lưu đày, đối diện với nạn châu chấu như một dấu hiệu về Ngày của ĐỨC CHÚA.
      date: Có lẽ vào khoảng thế kỷ V–IV TCN.
    Amos:
      display_name: A-mốt
      author: A-mốt quê ở Tê-cô-a, một người chăn chiên xứ Giu-đa rao giảng tại vương quốc phía bắc.
      audience: Vương quốc Y-sơ-ra-ên phía bắc trong thời kỳ thịnh vượng nhưng đầy bất công dưới triều Giê-rô-bô-am II.
      date: Khoảng năm 760–750 TCN.
    Obadiah:
      display_name: Áp-đia
      author: Áp-đia.
      audience: Người Giu-đa sau khi Ê-đôm phản bội Giê-ru-sa-lem — một lời tiên tri về sự sụp đổ của Ê-đôm.
      date: Không lâu sau năm 586 TCN.
    Jonah:
      display_name: Giô-na
      author: Không rõ tác giả; nhân vật chính là Giô-na, con trai A-mi-tai.
      audience: Người Y-sơ-ra-ên thời hậu lưu đày — một lời châm biếm quở trách thái độ khép kín về sắc tộc và khẳng định lòng thương xót của Đức Chúa Trời đối với người ngoài cộng đồng.
      date: Có lẽ vào khoảng thế kỷ V–IV TCN.
    Micah:
      display_name: Mi-chê
      author: Mi-chê quê ở Mô-rê-sết.
      audience: Người Giu-đa vào cuối thế kỷ VIII TCN, đặc biệt là người nghèo ở nông thôn trước giới quyền thế thành thị.
      date: Khoảng năm 740–700 TCN.
    Nahum:
      display_name: Na-hum
      author: Na-hum quê ở Ên-cốt.
      audience: Người Giu-đa vui mừng trước sự sụp đổ sắp xảy ra của Ni-ni-ve.
      date: Không lâu trước năm 612 TCN.
    Habakkuk:
      display_name: Ha-ba-cúc
      author: Ha-ba-cúc.
      audience: Người Giu-đa khi đối diện với sự trỗi dậy của Ba-by-lôn — cuộc đối thoại của một nhà tiên tri với Đức Chúa Trời về công lý.
      date: Khoảng cuối thế kỷ VII TCN.
    Zephaniah:
      display_name: Sô-phô-ni
      author: Sô-phô-ni, con trai Cu-si.
      audience: Người Giu-đa dưới triều Giô-si-a, ngay trước những cuộc cải cách của vua.
      date: Khoảng năm 640–609 TCN.
    Haggai:
      display_name: A-ghê
      author: A-ghê.
      audience: Những người hồi hương đang xây dựng lại đền thờ dưới triều Đa-ri-út.
      date: Năm 520 TCN.
    Zechariah:
      display_name: Xa-cha-ri
      author: Xa-cha-ri, con trai Bê-rê-kia; các chương 9–14 có lẽ do một người khác ở thời kỳ sau viết.
      audience: Những người hồi hương đang xây dựng lại đền thờ, và các cộng đồng hậu lưu đày về sau.
      date: Các chương 1–8 vào khoảng năm 520–518 TCN; các chương 9–14 có lẽ muộn hơn khoảng một thế kỷ.
    Malachi:
      display_name: Ma-la-chi
      author: Không rõ tác giả; “Ma-la-chi” có nghĩa là “sứ giả của ta”.
      audience: Người Giu-đa thời hậu lưu đày, ngày càng lơ là trong việc thờ phượng và giữ lòng trung tín dưới ách cai trị của Ba Tư.
      date: Khoảng giữa thế kỷ V TCN.
    Matthew:
      display_name: Ma-thi-ơ
      author: Không rõ tác giả; truyền thống quy sách này cho sứ đồ Ma-thi-ơ. Giới nghiên cứu hiện đại cho rằng tác giả là một người Do Thái-Cơ Đốc nói tiếng Hy Lạp, sử dụng sách Mác và một nguồn tương tự nguồn Q.
      audience: Một cộng đồng Do Thái-Cơ Đốc đang suy xét những điểm tiếp nối và khác biệt với Do Thái giáo trong hội đường.
      date: Khoảng năm 80–90 SCN.
    Mark:
      display_name: Mác
      author: Không rõ tác giả; truyền thống liên hệ sách này với Giăng Mác, người bạn đồng hành của Phi-e-rơ.
      audience: Một cộng đồng Cơ Đốc nói tiếng Hy Lạp, có thể ở Rô-ma, đang chịu hoặc đứng trước nguy cơ bị bắt bớ.
      date: Khoảng năm 65–75 SCN, vào thời kỳ Chiến tranh Do Thái và đền thờ bị phá hủy.
