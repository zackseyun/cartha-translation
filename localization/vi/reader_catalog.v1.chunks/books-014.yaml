  book_metadata:
    Sirach:
      display_name: Huấn Ca
      author: Yeshua ben Eleazar ben Sira, người Giê-ru-sa-lem; bản dịch Hy Lạp do cháu trai của ông thực hiện.
      audience: Những nam thanh niên Do Thái được đào luyện về sự khôn ngoan tại Giê-ru-sa-lem thời Hy Lạp hóa.
      date: Bản gốc tiếng Hê-bơ-rơ vào khoảng năm 195–175 TCN; bản dịch Hy Lạp vào khoảng năm 132 TCN.
    Baruch:
      display_name: Ba-rúc
      author: Khuyết danh; được gán dưới danh nghĩa Ba-rúc, thư ký của Giê-rê-mi.
      audience: Người Do Thái sống tha hương, suy ngẫm về cảnh lưu đày, sự ăn năn và sự khôn ngoan.
      date: Khoảng thế kỷ 2 TCN.
    1 Maccabees:
      display_name: 1 Ma-ca-bê
      author: Khuyết danh, có lẽ là một tác giả ở Giê-ru-sa-lem viết bằng tiếng Hê-bơ-rơ (chỉ bản tiếng Hy Lạp còn lưu truyền).
      audience: Người Do Thái trong và sau cuộc nổi dậy Ha-smô-nê; sách thuật lại tính chính danh của triều đại Ha-smô-nê.
      date: Khoảng năm 100 TCN.
    2 Maccabees:
      display_name: 2 Ma-ca-bê
      author: Một người khuyết danh đã tóm lược tác phẩm dài hơn của Jason người Ky-rê-nê; sách được soạn bằng tiếng Hy Lạp.
      audience: Người Do Thái tha hương nói tiếng Hy Lạp — nhấn mạnh sự tử đạo, sự quan phòng và sự sống lại.
      date: Khoảng năm 124 TCN hoặc ít lâu sau đó.
