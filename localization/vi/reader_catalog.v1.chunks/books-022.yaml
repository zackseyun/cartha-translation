    Gospel of Philip:
      display_name: Phúc âm theo Phi-líp
      author: Khuyết danh. Nhan đề xuất hiện trong dòng kết của bản chép tay, nhưng tác phẩm không xác định Phi-líp là người viết. Bản duy nhất còn tồn tại là văn bản tiếng Copt trong thủ bản Nag Hammadi, Codex II,3.
      audience: Một cộng đồng Kitô giáo sơ kỳ quen thuộc với lối giáo huấn về nghi lễ mang phong cách Valentinus, đặc biệt là phép báp-têm, xức dầu, tiệc Thánh Thể, sự cứu chuộc, sự phục sinh và hình ảnh phòng tân hôn.
      date: Thường được xác định niên đại vào cuối thế kỷ II hoặc đầu thế kỷ III CN; được lưu giữ trong một bản chép tay tiếng Copt thuộc thế kỷ IV, dịch từ một dạng tiếng Hy Lạp có trước đó.
