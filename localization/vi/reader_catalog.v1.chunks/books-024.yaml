review:
  verdict: revise
  review_summary: Đã hiệu chỉnh các chỗ diễn đạt có thể gây suy diễn giáo phái hoặc lệch nghĩa, đồng thời giữ nguyên đầy đủ cấu trúc và mọi khóa chuẩn.
  issues:
  - 'Hypostasis of the Archons.author: “named teacher” không phải “giáo sư”; đã dịch trung tính là “thầy dạy”.'
  - 'Hypostasis of the Archons.audience: “Sethian” đã được chuyển thành “thuộc truyền thống Seth”, tránh rút gọn sai thành “môi trường Seth”.'
  - 'Sophia of Jesus Christ, chương 5: “Radiant Human” đã dịch là “Con người rực sáng”, không diễn giải thành tước hiệu “Con Người”.'
  - 'Protoevangelium of James.author: “brother of Jesus” đã dịch trung tính là “người anh em của Chúa Giê-su”, không tự xác định là em trai.'
  - 'Protoevangelium of James, chương 6: đã chỉnh trật tự nghĩa để Joachim là chủ thể đón Mary về nhà.'
