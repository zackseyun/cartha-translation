payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Bản thể của các quyền lực cai trị
      author: Khuyết danh. Tác giả giải nghĩa sách Sáng Thế qua một huyền thoại mặc khải về các quyền lực cai trị; không thể xác định chắc chắn tác phẩm là của một thầy dạy có tên tuổi nào.
      audience: Các tín hữu Cơ Đốc trong một môi trường thuộc truyền thống Seth hoặc có liên hệ, là những người đọc sách Sáng Thế như cuộc xung đột giữa các quyền lực vũ trụ thiếu hiểu biết, minh triết thần linh và nguồn gốc thuộc linh của loài người.
      date: Thường được xếp vào thế kỷ 3 CN; được lưu giữ trong một bản chép tiếng Copt thuộc thế kỷ 4, trong Bộ sách Nag Hammadi II.
    On the Origin of the World:
      display_name: Về nguồn gốc của thế giới
      author: Khuyết danh. Tác phẩm kết hợp và biên soạn lại một số truyền thống Do Thái, Cơ Đốc, Platon và thần thoại mà không nêu tên người biên soạn.
      audience: Độc giả trong một môi trường Cơ Đốc chịu ảnh hưởng Ngộ đạo, muốn tìm hiểu một cách kể khác về lịch sử sáng tạo, các quyền lực vũ trụ, Sophia, A-đam và Ê-va, cùng vận mệnh cuối cùng của thế giới.
      date: Thường được xác định vào thế kỷ 3 CN, dù có thể dựa trên những tư liệu sớm hơn; chủ yếu được lưu giữ trong các bản chứng tiếng Copt thuộc thế kỷ 4.
    Sophia of Jesus Christ:
      display_name: Minh triết của Chúa Giê-su Christ
      author: Khuyết danh. Tác giả phỏng theo tư liệu cũng được biết đến qua tác phẩm Eugnostos, biến nó thành cuộc đối thoại giữa Chúa Giê-su và các môn đồ sau khi Ngài sống lại.
      audience: Các tín hữu Cơ Đốc quan tâm đến sự khôn ngoan được mặc khải về Đức Chúa Trời siêu việt, trật tự của thế giới thiên thượng, cùng nguồn gốc và sự cứu rỗi của linh hồn.
      date: Thường được xác định vào cuối thế kỷ 2 hoặc thế kỷ 3 CN; được lưu giữ trong các bản chép tiếng Copt từ Nag Hammadi và Bộ sách Berlin.
    Gospel of the Egyptians:
      display_name: Phúc âm của người Ai Cập
      author: Khuyết danh. Tác phẩm Nag Hammadi này, còn được gọi là Sách Thánh của Thần Linh Vô Hình Vĩ Đại, khác với Phúc âm của người Ai Cập bằng tiếng Hy Lạp có niên đại sớm hơn và chỉ được biết qua các trích dẫn.
      audience: Một cộng đồng Cơ Đốc theo truyền thống Seth, dùng huyền thoại cô đọng, các thánh danh, hình ảnh phép báp-têm và lời ca ngợi mang tính thánh thi để diễn đạt căn tính thuộc linh và sự giải thoát.
      date: Thường được xếp vào thế kỷ 2 hoặc thế kỷ 3 CN; hiện còn hai bản chép tiếng Copt trong các bộ sách Nag Hammadi thuộc thế kỷ 4.
    Letter of Peter to Philip:
      display_name: Thư của Phi-e-rơ gửi Phi-líp
      author: Khuyết danh. Bức thư mở đầu ngắn gọn và phần mặc khải tiếp theo được mạo danh là của Phi-e-rơ và Phi-líp, chứ không thể xác định chắc chắn là do một trong hai sứ đồ viết.
      audience: Các tín hữu Cơ Đốc tìm kiếm thẩm quyền sứ đồ cho giáo huấn về Đấng Cứu Rỗi, các thế lực thù nghịch, sự chịu khổ, sứ mạng và việc các môn đồ được phục hồi.
      date: Thường được xác định vào cuối thế kỷ 2 hoặc đầu thế kỷ 3 CN; được lưu giữ trong một bản chép Nag Hammadi thuộc thế kỷ 4 và một bản chứng tiếng Copt muộn hơn.
    Gospel of Judas:
      display_name: Phúc âm Giu-đa
      author: Khuyết danh. Nhan đề quy câu chuyện này cho Giu-đa, nhưng tác phẩm không chứng minh Giu-đa Ích-ca-ri-ốt là tác giả lịch sử của nó.
      audience: Một nhóm Cơ Đốc phê phán các thực hành tế lễ và giáo hội của những nhóm đối địch, dùng đối thoại mặc khải và vũ trụ luận kiểu Seth để diễn giải lại Giu-đa và cái chết của Chúa Giê-su.
      date: Thường được xác định vào giữa hoặc cuối thế kỷ 2 CN; Irenaeus đã biết đến một Phúc âm Giu-đa vào khoảng năm 180, còn bản chép tiếng Copt hiện còn có lẽ thuộc thế kỷ 3 hoặc thế kỷ 4.
    Protoevangelium of James:
      display_name: Tiền Phúc âm của Gia-cơ
      author: Khuyết danh. Người kể chuyện tự nhận là Gia-cơ, nhưng tác phẩm này mạo danh và không phải do Gia-cơ, người anh em của Chúa Giê-su, viết.
      audience: Các tín hữu Cơ Đốc quan tâm đến sự ra đời và quá trình trưởng thành của Ma-ri, sự trinh khiết trọn đời của bà, sự giáng sinh của Chúa Giê-su, cùng những lời giải đáp bằng hình thức tự sự cho các câu hỏi mà sách Ma-thi-ơ và Lu-ca còn để ngỏ.
      date: Nhìn chung được xác định vào nửa sau thế kỷ 2 CN; tác phẩm còn được lưu truyền trong nhiều bản chép tiếng Hy Lạp muộn hơn và các bản dịch cổ.
