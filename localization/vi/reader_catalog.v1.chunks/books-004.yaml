review:
  verdict: revise
  review_summary: Đã hiệu chỉnh các chỗ cần sát nghĩa hơn, gồm sắc thái “theological autopsy” trong phần độc giả của 2 Kings, mệnh lệnh phải trung tín trong 1 Kings 2, và cách diễn đạt không cường điệu ở 1 Chronicles 3. Các giá trị khác đầy đủ và bám sát nguồn.
  issues:
  - '2 Kings audience: bản nháp làm nhẹ ẩn dụ “theological autopsy”; đã đổi thành “cuộc giải phẫu thần học”.'
  - '1 Kings 2: cần thể hiện Đa-vít căn dặn Sa-lô-môn phải trung tín, thay vì hiểu là Đa-vít trung tín khi căn dặn.'
  - '1 Chronicles 3: “trường tồn” cường điệu hơn “continues on”; đã đổi thành “tiếp diễn”.'
