payload:
  book_metadata:
    Gospel of Mary:
      display_name: Phúc Âm của Ma-ri
      author: Khuyết danh. Tác phẩm trình bày Ma-ri là người tiếp nhận và diễn giải mặc khải của Chúa Giê-su, nhưng không khẳng định rằng Ma-ri đã viết bản phúc âm còn lưu truyền này.
      audience: Các độc giả Cơ Đốc giáo thời kỳ đầu đang suy xét về mặc khải, sự thăng tiến thuộc linh, thẩm quyền tông đồ và tính chính đáng của lời dạy của Ma-ri giữa các môn đồ Chúa Giê-su.
      date: Thường được xác định có niên đại vào thế kỷ 2 CN; các mảnh bản thảo tiếng Hy Lạp còn lại có từ thế kỷ 3, còn chứng bản tiếng Copt chính được lưu giữ trong Bộ thủ bản Berlin 8502 thuộc thế kỷ 5.
    Treatise on the Resurrection:
      display_name: Luận Thuyết về Sự Phục Sinh
      author: Khuyết danh. Tác phẩm được trình bày dưới hình thức thư của một người thầy gửi cho học trò tên là Rheginos; không thể xác định chắc chắn danh tính của người thầy lẫn Rheginos.
      audience: Những người Cơ Đốc tìm kiếm sự chỉ dẫn về sự phục sinh, đặc biệt là các độc giả đang cân nhắc những phương diện thể xác, thuộc linh và sự dự phần ngay trong hiện tại vào sự sống phục sinh.
      date: Thường được xếp vào cuối thế kỷ 2 CN (hay được ước định khoảng năm 170–200); được lưu giữ trong một bản sao tiếng Copt thuộc thế kỷ 4 của một tác phẩm tiếng Hy Lạp có trước đó.
    Dialogue of the Savior:
      display_name: Đối Thoại của Đấng Cứu Thế
      author: Khuyết danh. Trong cuộc đối thoại, những lời dạy mang tính mặc khải được đặt trên môi Chúa Giê-su khi ngài trò chuyện với Giu-đa, Ma-thi-ơ và Ma-ri, nhưng tác phẩm không cho biết người biên soạn là ai.
      audience: Một nhóm Cơ Đốc giáo thời kỳ đầu quan tâm đến mặc khải riêng, đời sống môn đồ, sự tự nhận biết, cầu nguyện và việc chuẩn bị theo lối khổ hạnh cho sự cứu rỗi.
      date: Thường được xếp vào thế kỷ 2 CN, dù các lớp cấu thành và niên đại chính xác của tác phẩm vẫn còn gây tranh luận; được lưu giữ trong một bản thảo tiếng Copt thuộc thế kỷ 4.
    Exegesis on the Soul:
      display_name: Luận Giải về Linh Hồn
      author: Khuyết danh. Tác giả là một người giảng đạo Cơ Đốc, đã diễn giải lại các hình ảnh trong Kinh Thánh và văn học Hy Lạp như một ẩn dụ về sự sa ngã, ăn năn và phục hồi của linh hồn.
      audience: Những người Cơ Đốc quen thuộc với Kinh Thánh và lời khuyên dạy đạo đức, được kêu gọi rời bỏ những ham muốn lệch lạc để ăn năn và tái hợp với thần linh.
      date: Nhìn chung được xác định có niên đại vào cuối thế kỷ 2 hoặc đầu thế kỷ 3 CN; được lưu giữ trong một bản dịch tiếng Copt từ tiếng Hy Lạp thuộc thế kỷ 4.
    Book of Thomas the Contender:
      display_name: Sách Tô-ma, Người Tranh Đấu
      author: Khuyết danh. Nhan đề ở cuối tác phẩm gắn sách này với Giu-đa Tô-ma và nêu Mathaias là người ghi chép, nhưng đây là những quy thuộc mang tính văn chương chứ không phải các tuyên bố có thể kiểm chứng về quyền tác giả.
      audience: Những người Cơ Đốc thiên về lối sống khổ hạnh, được thúc giục tìm kiếm sự tự nhận biết, chống lại các dục vọng thể xác và hiểu lời chỉ dạy riêng của Chúa Giê-su dành cho Tô-ma.
      date: Thường được xác định có niên đại vào cuối thế kỷ 2 hoặc đầu thế kỷ 3 CN, có thể trong một bối cảnh Cơ Đốc giáo tại Syria; được lưu giữ trong một bản thảo tiếng Copt thuộc thế kỷ 4.
    Tripartite Tractate:
      display_name: Luận Thuyết Ba Phần
      author: Khuyết danh. Tác giả là một nhà thần học Cơ Đốc theo truyền thống Valentinus, có học vấn uyên thâm; không thể xác định chắc chắn người này là một giáo sư hữu danh nào.
      audience: Một cộng đồng Cơ Đốc theo truyền thống Valentinus đang tiếp nhận sự chỉ dạy sâu rộng về Đức Chúa Trời, các aeon, sự sáng tạo, Đấng Christ, hội thánh, sự cứu rỗi và sự phục hồi sau cùng.
      date: Thường được xác định có niên đại vào thế kỷ 3 CN, với một số lập luận nghiêng về nửa sau của thế kỷ này; được lưu giữ bằng tiếng Copt trong Bộ thủ bản Jung thuộc thế kỷ 4.
    Apocryphon of John:
      display_name: Ngụy Thư của Giăng
      author: Khuyết danh. Tác phẩm giả danh trình bày một mặc khải của Chúa Giê-su phục sinh cho Giăng, con trai Xê-bê-đê, và còn lưu truyền qua hơn một dị bản cổ.
      audience: Những người Cơ Đốc thuộc truyền thống mặc khải Seth hoặc một truyền thống gần gũi, đang tìm kiếm lời giải thích về cõi thần linh, sự sáng tạo, căn tính con người và sự giải thoát khỏi các nhà cai trị thù nghịch.
      date: Một dạng ban đầu có lẽ đã lưu hành vào thế kỷ 2 CN; các chứng bản tiếng Copt còn lại, bảo tồn cả dị bản ngắn và dài, có niên đại từ thế kỷ 4 và 5.
