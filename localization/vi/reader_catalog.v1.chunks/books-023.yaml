review:
  verdict: revise
  review_summary: Đã hiệu chỉnh các chỗ cần thiết để bám sát nguồn, đặc biệt là mô tả chứng bản Copt của Luận thuyết về Sự phục sinh, tên gọi trung tính cho Apocryphon of John, và các tiêu đề có sắc thái hoặc quan hệ bị lệch.
  issues:
  - 'Treatise on the Resurrection/date: bản Copt được bảo tồn là bản sao của một tác phẩm Hy Lạp có trước, không nhất thiết được nói là ‘dịch từ’ tác phẩm ấy.'
  - 'Apocryphon of John/display_name: ‘Mật Thư’ không phản ánh chính xác nghĩa thể loại của apocryphon; đã dùng tên gọi trung tính hơn.'
  - 'Dialogue of the Savior/3 và Tripartite Tractate/23: bản nháp làm lệch quan hệ nghĩa trong tiêu đề nguồn; đã sửa.'
