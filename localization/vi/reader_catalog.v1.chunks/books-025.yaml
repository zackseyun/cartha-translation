review:
  verdict: revise
  review_summary: 'Đã hiệu chỉnh các tiêu đề có sai lệch về tác động hoặc chi tiết: làm trong nước (không phải gom nước), Giô-sép thả Ma-ri, và địa điểm không xác định. Các mục còn lại đầy đủ và bám sát nguồn.'
  issues:
  - 'Protoevangelium of James 16: bản nháp thêm Giô-sép cũng được tha, trong khi nguồn chỉ nói Giô-sép thả Ma-ri sau cuộc thử nghiệm.'
  - 'Infancy Gospel of Thomas 2: “Clears Water” là làm trong nước, không phải gom nước.'
  - 'Infancy Gospel of Thomas 18: “at Site” không xác định đó là công trường; đã dùng cách diễn đạt trung tính.'
