payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Phúc Âm Thời Thơ Ấu của Tô-ma
      author: Khuyết danh. Dạng thức cổ nhất có thể phục dựng của tác phẩm không nêu tên tác giả; việc quy cho Tô-ma xuất hiện trong nhan đề của các bản chép tay và quá trình lưu truyền về sau.
      audience: Các Cơ Đốc nhân muốn tìm hiểu về thời thơ ấu của Chúa Giê-su và cách quyền năng thiên thượng, sự rèn dạy, việc học hỏi và quá trình trưởng thành của ngài có thể được thuật lại trước khi các trình thuật Phúc Âm chính điển bắt đầu.
      date: Thường được truy nguyên về thế kỷ II SCN, nhưng văn bản còn tồn tại dưới một số dị bản Hy Lạp khác biệt đáng kể và các bản dịch cổ.
    Acts of Paul and Thecla:
      display_name: Công Vụ của Phao-lô và Thê-cơ-la
      author: Khuyết danh. Đây là một phần trong tác phẩm Công Vụ của Phao-lô dài hơn; một ghi chép cổ cho rằng có một trưởng lão đã soạn Công Vụ, nhưng thông tin ấy không đủ để xác định chắc chắn tác giả.
      audience: Các Cơ Đốc nhân yêu thích những câu chuyện về việc rao giảng của các sứ đồ, đời sống độc thân, phép báp-têm, sự chịu đựng như người tuẫn đạo, cùng thẩm quyền giảng dạy và làm chứng của một phụ nữ.
      date: Được sáng tác vào thế kỷ II SCN, có lẽ trong nửa sau thế kỷ; tác phẩm được lưu truyền cả như một phần của Công Vụ của Phao-lô lẫn như một tác phẩm độc lập.
    Gospel of Peter:
      display_name: Phúc Âm của Phi-e-rơ
      author: Khuyết danh. Trình thuật còn tồn tại được kể bằng tiếng nói của Phi-e-rơ và được lưu truyền dưới tên ông, nhưng không được xem là tác phẩm của vị sứ đồ Phi-e-rơ trong lịch sử.
      audience: Các Cơ Đốc nhân thời kỳ đầu quan tâm đến một trình thuật mở rộng về cuộc thương khó và sự phục sinh, có lẽ thuộc những cộng đồng đặc biệt coi trọng thẩm quyền của Phi-e-rơ.
      date: Thường được định niên đại vào thế kỷ II SCN; mảnh bản thảo Hy Lạp chính còn tồn tại thuộc về một bản chép tay muộn hơn nhiều, được tìm thấy tại Akhmim.
    2 Clement:
      display_name: 2 Cơ-lê-men
      author: Khuyết danh. Bất chấp nhan đề truyền thống, đây là một bài giảng Cơ Đốc giáo thời kỳ đầu chứ không phải bức thư thứ hai của Cơ-lê-men thành Rô-ma.
      audience: Một hội chúng Cơ Đốc được khuyên phải ăn năn, sống nhất quán về đạo đức, chăm sóc người yếu thế và trung tín bền lòng trong niềm hy vọng về sự phục sinh và phán xét.
      date: Thường được định niên đại vào nửa đầu hoặc giữa thế kỷ II SCN (khoảng năm 100–160); địa điểm sáng tác chưa chắc chắn.
    Epistle of Barnabas:
      display_name: Thư của Ba-na-ba
      author: Khuyết danh. Theo truyền thống, tác phẩm được gắn với Ba-na-ba, người đồng hành của Phao-lô, nhưng giới nghiên cứu hiện đại không chấp nhận sự quy gán này.
      audience: Các Cơ Đốc nhân dân ngoại được dạy tiếp nhận Kinh Thánh của dân Y-sơ-ra-ên qua lối giải thích quy hướng về Đấng Christ và mang tính ẩn dụ, đồng thời phân biệt căn tính giao ước của họ với các tập tục Do Thái.
      date: Thường được định niên đại trong khoảng từ khi đền thờ Giê-ru-sa-lem bị phá hủy vào năm 70 SCN đến đầu thế kỷ II, thường là khoảng năm 80–130.
