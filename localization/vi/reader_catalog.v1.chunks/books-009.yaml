  verdict: revise
  review_summary: Đã hiệu đính toàn bộ mục. Sửa tên sách Ai ca, làm rõ một số diễn đạt siêu dữ liệu, và điều chỉnh các tiêu đề để trung thành hơn với nguồn, gồm cả mục Ê-xê-chi-ên 48 có ký tự tiếng Trung trong bản nháp.
  issues:
  - Lamentations display_name dùng cách gọi không chuẩn trong ngữ cảnh Kinh Thánh tiếng Việt.
  - Daniel metadata diễn đạt chưa đúng sắc thái 'presents itself as Daniel of the exile' và 'Hellenistic persecution'.
  - Ezekiel 48 chứa ký tự tiếng Trung lẫn trong tiêu đề nguồn/dự thảo; bản dịch đã được chuẩn hóa.
  - Một số tiêu đề được chỉnh để tránh thêm diễn giải hoặc làm mờ tác nhân/hình ảnh của bản nguồn.
