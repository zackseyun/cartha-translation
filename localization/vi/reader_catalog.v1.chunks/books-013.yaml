payload:
  book_metadata:
    James:
      display_name: Gia-cơ
      author: Theo truyền thống là Gia-cơ, em trai của Chúa Giê-su; giới nghiên cứu hiện đại có ý kiến khác nhau, một bên cho rằng chính ông là tác giả, bên kia cho rằng thư được viết dưới tên ông.
      audience: Các hội chúng Cơ Đốc gốc Do Thái sống tản cư.
      date: Khoảng những năm 50–60 CN nếu chính Gia-cơ là tác giả; khoảng cuối thế kỷ 1 CN nếu thư được viết dưới tên ông.
    1 Peter:
      display_name: 1 Phi-e-rơ
      author: Theo truyền thống là sứ đồ Phi-e-rơ, với Si-la làm thư ký; một số học giả cho rằng thư được viết dưới tên Phi-e-rơ.
      audience: Các tín hữu tại Tiểu Á thuộc La Mã đang chịu sự thù nghịch của xã hội.
      date: Khoảng những năm 60 CN nếu do Phi-e-rơ viết; khoảng những năm 70–90 CN nếu được viết dưới tên ông.
    2 Peter:
      display_name: 2 Phi-e-rơ
      author: Theo truyền thống là Phi-e-rơ; giới nghiên cứu hiện đại nhìn chung cho rằng thư được viết dưới tên ông.
      audience: Các tín hữu phải đối diện với những kẻ nhạo báng phủ nhận ngày Chúa quang lâm.
      date: Khoảng đầu thế kỷ 2 CN.
    1 John:
      display_name: 1 Giăng
      author: Khuyết danh; theo truyền thống là sứ đồ Giăng hoặc vị trưởng lão thuộc cộng đồng Giăng.
      audience: Cộng đồng Giăng sau một cuộc chia rẽ, đang xác định ai thật sự thuộc về cộng đồng.
      date: Khoảng năm 90–110 CN.
    2 John:
      display_name: 2 Giăng
      author: “Vị trưởng lão.”
      audience: Một hội chúng Cơ Đốc cụ thể (“bà được chọn”), được cảnh báo về các giáo sư giả.
      date: Khoảng năm 90–110 CN.
    3 John:
      display_name: 3 Giăng
      author: “Vị trưởng lão.”
      audience: Gai-út, một người lãnh đạo tiếp đón các nhà truyền giáo lưu hành.
      date: Khoảng năm 90–110 CN.
    Jude:
      display_name: Giu-đe
      author: Theo truyền thống là Giu-đe, em của Gia-cơ và của Chúa Giê-su.
      audience: Các cộng đồng Cơ Đốc đang bị những kẻ dạy lối sống phóng túng len lỏi vào.
      date: Khoảng những năm 60–90 CN.
    Revelation:
      display_name: Khải Huyền
      author: Giăng ở đảo Bát-mô (văn phong khác với Phúc Âm thứ tư).
      audience: Bảy hội chúng Cơ Đốc tại Tiểu Á thuộc La Mã đang chịu áp lực từ đế quốc.
      date: Khoảng những năm 90 CN, theo truyền thống là dưới triều Đô-mi-ti-a-nô.
    Tobit:
      display_name: Tô-bít
      author: Khuyết danh.
      audience: Người Do Thái sống tản cư, tìm cách giữ lòng đạo, xây dựng hôn nhân và tin cậy sự quan phòng dưới ách ngoại bang.
      date: Khoảng năm 225–175 TCN; được sáng tác bằng tiếng A-ram, và một bản tiếng Hê-bơ-rơ cũng được chứng thực tại Qumran.
    Judith:
      display_name: Giu-đi-tha
      author: Khuyết danh.
      audience: Người Do Thái trước mối đe dọa ngoại bang — một câu chuyện đầy tinh thần bất khuất về sự kháng cự xuất phát từ lòng mộ đạo.
      date: Khoảng năm 150–100 TCN.
    Greek Additions to Esther:
      display_name: Các phần bổ sung bằng tiếng Hy Lạp cho sách Ê-xơ-tê
      author: Khuyết danh; tài liệu bổ sung được thêm vào bản dịch tiếng Hy Lạp của sách Ê-xơ-tê.
      audience: Người Do Thái nói tiếng Hy Lạp muốn câu chuyện Ê-xơ-tê có lời cầu nguyện và nhắc rõ đến Đức Chúa Trời.
      date: Khoảng thế kỷ 2–1 TCN.
    Wisdom of Solomon:
      display_name: Sự Khôn Ngoan của Sa-lô-môn
      author: Khuyết danh; được gán cho Sa-lô-môn dưới tên ông. Tác phẩm được một tác giả Do Thái thời Hy Lạp hóa sáng tác bằng tiếng Hy Lạp, có lẽ tại A-léc-xan-đri-a.
      audience: Người Do Thái thời Hy Lạp hóa đang tiếp xúc với triết học Hy Lạp và bảo vệ sự khôn ngoan của Y-sơ-ra-ên trước những lựa chọn ngoại giáo và bội đạo.
      date: Khoảng năm 50 TCN – 50 CN.
