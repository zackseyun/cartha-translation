  book_metadata:
    1 Esdras:
      display_name: 1 Esdras
      author: Khuyết danh; một bản biên soạn lại bằng tiếng Hy Lạp, sắp xếp lại 2 Sử ký 35–36, Ezra và Nehemiah 7–8.
      audience: Người Do Thái thời Hy Lạp hóa mong muốn một bản tường thuật mạch lạc về cuộc hồi hương và công cuộc khôi phục.
      date: Khoảng thế kỷ 2–1 TCN.
    Prayer of Manasseh:
      display_name: Lời cầu nguyện của Manasseh
      author: Khuyết danh; được gán cho vua Manasseh.
      audience: Những người ăn năn đồng cảm với sự hối cải của Manasseh — được dùng trong phụng vụ ở một số truyền thống.
      date: Khoảng thế kỷ 2–1 TCN.
    Psalm 151:
      display_name: Thi thiên 151
      author: Khuyết danh; được gán cho David. Một dạng tiếng Hebrew được chứng thực trong 11QPsa.
      audience: Các cộng đồng hải ngoại và Qumran tận tâm với tập Thi thiên của David.
      date: Khoảng thế kỷ 2 TCN hoặc sớm hơn.
    3 Maccabees:
      display_name: 3 Maccabees
      author: Khuyết danh; được sáng tác bằng tiếng Hy Lạp.
      audience: Người Do Thái hải ngoại nói tiếng Hy Lạp ở Ai Cập — một câu chuyện giải cứu đặt trong bối cảnh triều Ptolemy IV.
      date: Khoảng thế kỷ 1 TCN đến thế kỷ 1 CN.
    4 Maccabees:
      display_name: 4 Maccabees
      author: Khuyết danh; một tác giả Do Thái nói tiếng Hy Lạp chịu ảnh hưởng của triết học Khắc kỷ.
      audience: Người Do Thái thời Hy Lạp hóa — một bài giảng triết lý về lý trí chế ngự dục vọng qua lòng trung tín.
      date: Khoảng thế kỷ 1 CN.
    Bel and the Dragon:
      display_name: Bel và Con Rồng
      author: Khuyết danh; một trong các Phần bổ sung tiếng Hy Lạp cho Daniel.
      audience: Người Do Thái nói tiếng Hy Lạp — một áng văn châm biếm chống việc thờ thần tượng.
      date: Khoảng thế kỷ 2–1 TCN.
    Letter of Jeremiah:
      display_name: Thư của Jeremiah
      author: Khuyết danh; được gán cho Jeremiah.
      audience: Người Do Thái hải ngoại bị cám dỗ bởi việc thờ thần tượng chung quanh.
      date: Khoảng thế kỷ 4–2 TCN.
    Prayer of Azariah and Song of the Three:
      display_name: Lời cầu nguyện của Azariah và Bài ca của ba người
      author: Khuyết danh; một trong các Phần bổ sung tiếng Hy Lạp cho Daniel.
      audience: Người Do Thái nói tiếng Hy Lạp — tài liệu phụng vụ cho Daniel 3.
      date: Khoảng thế kỷ 2 TCN.
    Susanna:
      display_name: Susanna
      author: Khuyết danh; một trong các Phần bổ sung tiếng Hy Lạp cho Daniel.
      audience: Người Do Thái nói tiếng Hy Lạp — câu chuyện về sự công chính và sự quở trách chứng gian.
      date: Khoảng thế kỷ 2–1 TCN.
    1 Clement:
      display_name: 1 Clement
      author: Khuyết danh, được gán cho Clement thành Rome.
      audience: Hội chúng Cơ Đốc tại Corinth, đang vướng vào một cuộc tranh chấp về lãnh đạo.
      date: Khoảng năm 96 CN.
