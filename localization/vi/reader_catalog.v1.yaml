books:
  Genesis:
    display_name: Sáng Thế Ký
    author: Không rõ tác giả; theo truyền thống được quy cho Môi-se. Nghiên cứu hiện đại cho rằng sách có một lịch sử hình thành lâu dài, với các nguồn tư liệu về sau được biên tập lại thành một thể thống nhất.
    audience: Dân Y-sơ-ra-ên trong căn tính giao ước, với câu chuyện về nguồn gốc của dân tộc được đặt nền trên công cuộc sáng tạo, sự tuyển chọn và lời hứa của Đức Chúa Trời.
    date: Được biên soạn qua nhiều thế kỷ; đạt đến hình thức được lưu truyền vào khoảng thế kỷ VI–V TCN, trong hoặc sau thời kỳ lưu đày tại Ba-by-lôn.
    summary: Sáng Thế Ký thuật lại công cuộc sáng tạo, sự nổi loạn và phân tán của loài người, cùng câu chuyện gia đình Áp-ra-ham, Y-sác, Gia-cốp và Giô-sép, là những người qua đó các lời hứa giao ước của Đức Chúa Trời dành cho Y-sơ-ra-ên bắt đầu được bày tỏ.
    chapters:
      '1':
        title: Đức Chúa Trời Sáng Tạo Trời và Đất
