  Book of Thomas the Contender:
    display_name: Sách Tô-ma, Người Tranh Đấu
    author: Khuyết danh. Nhan đề ở cuối tác phẩm gắn sách này với Giu-đa Tô-ma và nêu Mathaias là người ghi chép, nhưng đây là những quy thuộc mang tính văn chương chứ không phải các tuyên bố có thể kiểm chứng về quyền tác giả.
    audience: Những người Cơ Đốc thiên về lối sống khổ hạnh, được thúc giục tìm kiếm sự tự nhận biết, chống lại các dục vọng thể xác và hiểu lời chỉ dạy riêng của Chúa Giê-su dành cho Tô-ma.
    date: Thường được xác định có niên đại vào cuối thế kỷ 2 hoặc đầu thế kỷ 3 CN, có thể trong một bối cảnh Cơ Đốc giáo tại Syria; được lưu giữ trong một bản thảo tiếng Copt thuộc thế kỷ 4.
