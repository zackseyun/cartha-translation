  Gospel of Mary:
    display_name: Phúc Âm của Ma-ri
    author: Khuyết danh. Tác phẩm trình bày Ma-ri là người tiếp nhận và diễn giải mặc khải của Chúa Giê-su, nhưng không khẳng định rằng Ma-ri đã viết bản phúc âm còn lưu truyền này.
    audience: Các độc giả Cơ Đốc giáo thời kỳ đầu đang suy xét về mặc khải, sự thăng tiến thuộc linh, thẩm quyền tông đồ và tính chính đáng của lời dạy của Ma-ri giữa các môn đồ Chúa Giê-su.
    date: Thường được xác định có niên đại vào thế kỷ 2 CN; các mảnh bản thảo tiếng Hy Lạp còn lại có từ thế kỷ 3, còn chứng bản tiếng Copt chính được lưu giữ trong Bộ thủ bản Berlin 8502 thuộc thế kỷ 5.
    chapters:
      '1':
        title: Đấng Cứu Thế dạy về việc chống lại tội lỗi
      '2':
