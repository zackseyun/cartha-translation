  Letters of Ignatius:
    display_name: Các thư của Ignatius
    author: Ignatius, giám mục thành Antioch, là tác giả của bảy thư thuộc bản trung bình thường được chấp nhận; các thư Ignatius được mở rộng về sau và các thư mạo danh không nằm trong tuyển tập này.
