  Polycarp to the Philippians:
    display_name: Thư của Polycarp gửi tín hữu Philippi
    author: Polycarp, giám mục Smyrna. Một số học giả cho rằng văn bản được lưu truyền là sự kết hợp của những phần được gửi vào nhiều thời điểm khác nhau.
    audience: Cộng đoàn Cơ Đốc tại Philippi, nơi đã xin các thư của Ignatius và nhận được lời khuyên về đức tin, cách sống, vai trò lãnh đạo, tiền bạc và sự bền lòng.
    date: Khoảng đầu đến giữa thế kỷ II sau Công nguyên; ít nhất một phần có liên hệ chặt chẽ với hành trình của Ignatius, trong khi giả thuyết về một bức thư hợp thành cho phép xác định một phần khác vào thời điểm muộn hơn đôi chút.
    chapters:
