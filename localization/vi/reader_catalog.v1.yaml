    audience: Các Cơ Đốc nhân thời kỳ đầu quan tâm đến một trình thuật mở rộng về cuộc thương khó và sự phục sinh, có lẽ thuộc những cộng đồng đặc biệt coi trọng thẩm quyền của Phi-e-rơ.
