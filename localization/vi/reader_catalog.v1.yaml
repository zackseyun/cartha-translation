  Treatise on the Resurrection:
    display_name: Luận Thuyết về Sự Phục Sinh
    author: Khuyết danh. Tác phẩm được trình bày dưới hình thức thư của một người thầy gửi cho học trò tên là Rheginos; không thể xác định chắc chắn danh tính của người thầy lẫn Rheginos.
    audience: Những người Cơ Đốc tìm kiếm sự chỉ dẫn về sự phục sinh, đặc biệt là các độc giả đang cân nhắc những phương diện thể xác, thuộc linh và sự dự phần ngay trong hiện tại vào sự sống phục sinh.
    date: Thường được xếp vào cuối thế kỷ 2 CN (hay được ước định khoảng năm 170–200); được lưu giữ trong một bản sao tiếng Copt thuộc thế kỷ 4 của một tác phẩm tiếng Hy Lạp có trước đó.
