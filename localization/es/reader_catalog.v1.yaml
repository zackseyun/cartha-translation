  Protoevangelium of James:
    display_name: Protoevangelio de Santiago
    author: Anónimo. El narrador afirma ser Santiago, pero la obra es seudónima y no fue escrita por Santiago, el hermano de Jesús.
    audience: Cristianos interesados en el nacimiento y la crianza de María, su pureza perpetua, la natividad de Jesús y las respuestas narrativas a cuestiones que Mateo y Lucas dejaron abiertas.
