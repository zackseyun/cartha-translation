  Hebrews:
    display_name: Hebreos
    author: Anónimo. La tradición ha propuesto a Pablo, Apolos, Bernabé, Priscila y otras personas; ninguna propuesta cuenta con consenso.
    audience: Cristianos judíos de habla griega tentados a apartarse de su confesión cristiana y volver atrás.
    date: Aprox. 60–95 d. C.
    chapters:
      '1':
        title: Dios habla por medio de su Hijo
      '2':
        title: Jesús salva por medio del sufrimiento
      '3':
        title: Fijen la mirada en el fiel Jesús
      '4':
        title: Entren en el descanso prometido por Dios
      '5':
        title: Cristo ofreció el sacrificio perfecto
      '6':
        title: Avancen hacia la madurez espiritual
      '7':
        title: Jesús, sacerdote para siempre según Melquisedec
      '8':
        title: El nuevo pacto por medio de la sangre de Jesús
      '9':
        title: Jesús entra en el verdadero santuario celestial
      '10':
        title: Acerquémonos por la sangre de Cristo
      '11':
        title: Perdura la fe de los antepasados
      '12':
        title: Soporten el sufrimiento con Jesús
      '13':
        title: Vivan con amor y confianza
  James:
    display_name: Santiago
