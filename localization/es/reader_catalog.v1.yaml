      '9':
        title: Eleleth confirma el verdadero origen
      '10':
        title: La hija de la Sabiduría pone límites al gobernante
      '11':
        title: Sabaot se arrepiente y alaba a la Sabiduría
      '12':
        title: El Revelador trae vida eterna
  On the Origin of the World:
    display_name: Sobre el origen del mundo
    author: Anónimo. La obra combina y reelabora varias tradiciones judías, cristianas, platónicas y mitológicas sin identificar a quien las recopiló.
    audience: Lectores de un entorno cristiano con tendencias gnósticas que buscaban una historia alternativa de la creación, los gobernantes cósmicos, Sofía, Adán y Eva, y el destino final del mundo.
    date: Por lo general, se fecha en el siglo III d. C., aunque puede basarse en materiales anteriores; se conserva principalmente en testimonios coptos del siglo IV.
    chapters:
      '1':
        title: El caos surge de la oscuridad
