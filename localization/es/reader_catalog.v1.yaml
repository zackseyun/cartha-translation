    author: Anónimo. El autor es un predicador cristiano que reinterpreta imágenes bíblicas y de la literatura griega como una alegoría de la caída, el arrepentimiento y la restauración del alma.
    audience: Cristianos familiarizados con las Escrituras y la exhortación moral, a quienes se llamaba a abandonar los deseos desordenados, arrepentirse y reunirse con lo divino.
    date: Por lo general, se fecha a finales del siglo II o comienzos del III d. C.; se conserva en una traducción copta del siglo IV hecha a partir del griego.
    chapters:
      '1':
        title: El alma se arrepiente y busca misericordia
      '2':
