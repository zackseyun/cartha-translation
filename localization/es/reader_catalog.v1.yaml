  Fragments of Papias:
    display_name: Fragmentos de Papías
    author: Papías, obispo de Hierápolis, autor de la perdida obra en cinco libros Exposiciones de los dichos del Señor; la colección conservada consta de citas y relatos preservados por autores posteriores.
    audience: Cristianos de los primeros tiempos que buscaban enseñanzas recordadas acerca de Jesús y los apóstoles, recopiladas mediante cadenas identificadas de testimonio oral e interpretación.
    date: La obra de Papías suele fecharse a principios del siglo II d. C., a menudo hacia 110–130; los fragmentos conservados aparecen en autores que escribieron desde el siglo II en adelante.
