      '3':
        title: Vidas transformadas confirman el ministerio
      '4':
        title: La proclamación de la gloria de Cristo
      '5':
        title: El amor de Cristo impulsa el ministerio
      '6':
        title: Soporten el sufrimiento por Dios
      '7':
        title: Busquen la santidad con reverencia
      '8':
        title: La gracia de los macedonios inspira generosidad
      '9':
        title: Den con alegría para los santos
      '10':
        title: Pablo apela a la mansedumbre de Cristo
      '11':
        title: Celo por una vida fiel
      '12':
        title: Gloriarse en la debilidad y la gracia
      '13':
        title: Examinémonos para detectar el pecado
  Galatians:
    display_name: Gálatas
    author: Pablo.
    audience: Las comunidades cristianas de Galacia (Anatolia central), presionadas para adoptar la circuncisión y la observancia de la Torá.
    date: Aprox. 48–55 d. C. (fecha debatida).
    chapters:
      '1':
        title: Pablo defiende su evangelio
      '2':
        title: Pablo confronta el error de Pedro
      '3':
        title: La fe de Abraham justifica
      '4':
        title: Cristo nos libera de la ley
      '5':
        title: Vivan por la fe, no por la ley
      '6':
        title: Lleven las cargas unos de otros
  Ephesians:
    display_name: Efesios
    author: Pablo, o un discípulo cercano que escribió en nombre de Pablo (debatido).
    audience: Lectores cristianos en general de la provincia de Asia; el nombre del lugar «Éfeso» no aparece en los manuscritos más antiguos.
    date: Aprox. década de los 60 d. C. si es paulina; décadas de los 80–90 d. C. si es seudónima.
    chapters:
      '1':
        title: La gracia de Dios sella a los creyentes
      '2':
        title: Cristo trae paz a todos
      '3':
        title: El misterio revelado por medio del evangelio
      '4':
        title: Oración por la unidad del cuerpo de Cristo
      '5':
        title: Imiten a Dios y vivan sabiamente
      '6':
        title: Hijos, obedezcan y honren a sus padres
  Philippians:
    display_name: Filipenses
    author: Pablo, con Timoteo.
    audience: La comunidad cristiana de Filipos, colonia romana de Macedonia.
    date: Aprox. 60–62 d. C., escrita desde la prisión.
    chapters:
      '1':
        title: Pablo ora por los filipenses
      '2':
        title: Jesús, humilde y exaltado
      '3':
        title: Alégrense de conocer a Cristo
      '4':
        title: Manténganse firmes con alegría
  Colossians:
    display_name: Colosenses
    author: Pablo, con Timoteo, o un discípulo cercano que escribió en nombre de Pablo (debatido).
    audience: Los cristianos de Colosas, en el valle del Lico, que enfrentaban una enseñanza sincretista.
    date: Aprox. 60–62 d. C. si es paulina; posterior si es seudónima.
    chapters:
      '1':
        title: Pablo ora por la fe de los colosenses
      '2':
        title: Pablo anima a los creyentes en Cristo
      '3':
        title: Superen el pecado y vivan con amor
      '4':
        title: Pablo pide oración en sus cadenas y da ánimo
  1 Thessalonians:
    display_name: 1 Tesalonicenses
    author: Pablo, con Silvano y Timoteo.
    audience: La joven comunidad cristiana de Tesalónica, que enfrentaba persecución.
    date: Aprox. 50–51 d. C.; probablemente la carta paulina más antigua que se conserva.
    chapters:
      '1':
        title: Gracia, paz, fe, amor y esperanza
      '2':
        title: Predicación valiente con motivos puros
      '3':
        title: Timoteo los anima en el sufrimiento
      '4':
        title: Pablo anima a vivir en santidad
      '5':
        title: Manténganse alerta mientras esperan la salvación
  2 Thessalonians:
    display_name: 2 Tesalonicenses
    author: Pablo (debatido; algunos especialistas consideran que es seudónima).
    audience: La comunidad de Tesalónica, para abordar una confusión escatológica.
    date: Aprox. 51 d. C. si es paulina.
    chapters:
      '1':
        title: Dios recompensa a los fieles perseguidos
      '2':
        title: La rebelión viene antes de la venida de Cristo
      '3':
        title: Pablo ora por el crecimiento de la iglesia
  1 Timothy:
    display_name: 1 Timoteo
    author: Pablo, o un discípulo que escribió en nombre de Pablo (se considera ampliamente que las Epístolas Pastorales son seudónimas).
    audience: Timoteo, como delegado de Pablo en Éfeso; un manual de orientación para la organización posterior de la iglesia.
    date: Aprox. mediados de la década de los 60 d. C. si es paulina; aprox. 90–110 d. C. si es seudónima.
    chapters:
      '1':
        title: Pablo insta a Timoteo a quedarse
      '2':
        title: Oren por los gobernantes y vivan en paz
      '3':
        title: Se afirman las cualidades de los líderes de la iglesia
      '4':
        title: Rechaza a los falsos maestros y los mitos
      '5':
        title: Honra fielmente a las viudas y a los ancianos
      '6':
        title: Pablo aconseja a Timoteo sobre la riqueza
  2 Timothy:
    display_name: 2 Timoteo
    author: Pablo, o un discípulo que escribió en nombre de Pablo.
    audience: Timoteo; presentada como la despedida de Pablo desde la prisión.
    date: Aprox. mediados de la década de los 60 d. C. si es paulina; aprox. 90–110 d. C. si es seudónima.
    chapters:
      '1':
        title: Timoteo, mantente firme en la gracia
      '2':
        title: Soporta el sufrimiento por Cristo
      '3':
        title: Advertencia para evitar a los falsos maestros
      '4':
        title: Predica fielmente a todos
  Titus:
    display_name: Tito
    author: Pablo, o un discípulo que escribió en nombre de Pablo.
    audience: Tito, como delegado de Pablo en Creta.
    date: Aprox. mediados de la década de los 60 d. C. si es paulina; aprox. 90–110 d. C. si es seudónima.
