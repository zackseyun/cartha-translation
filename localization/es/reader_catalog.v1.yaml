      '6':
        title: Jesús promete fortaleza eterna
      '7':
        title: Los apóstoles predican a pesar de la persecución
      '8':
        title: Pedro proclama la herencia santa
  Gospel of Judas:
    display_name: Evangelio de Judas
    author: Anónimo. El título atribuye el relato a Judas, pero la obra no demuestra que Judas Iscariote fuera su autor histórico.
    audience: Un grupo cristiano crítico de las prácticas sacrificiales y eclesiales de otros grupos, que empleaba diálogos revelatorios y una cosmología de tipo setiano para reinterpretar a Judas y la muerte de Jesús.
    date: Suele fecharse a mediados o finales del siglo II d. C.; Ireneo conocía un Evangelio de Judas hacia el año 180, y la copia copta conservada probablemente data del siglo III o IV.
    chapters:
      '1':
        title: Jesús revela misterios a Judas
      '2':
        title: Solo Judas se acerca a Jesús
      '3':
        title: Jesús describe la comunidad santa
