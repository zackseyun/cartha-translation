  Infancy Gospel of Thomas:
    display_name: Evangelio de la infancia de Tomás
    author: Anónimo. Su forma más antigua que puede reconstruirse no nombra a ningún autor; la atribución a Tomás pertenece a títulos de manuscritos posteriores y a la transmisión del texto.
    audience: Cristianos interesados en la infancia de Jesús y en cómo podrían narrarse el poder divino, la disciplina, el aprendizaje y la maduración antes del comienzo de los relatos de los Evangelios canónicos.
