  Gospel of the Egyptians:
    display_name: Evangelio de los egipcios
    author: Anónimo. Esta obra de Nag Hammadi, llamada también Libro Sagrado del Gran Espíritu Invisible, es distinta del Evangelio griego de los egipcios, más antiguo y conocido solo mediante citas.
    audience: Una comunidad cristiana setiana que empleaba mitos complejos, nombres sagrados, imágenes bautismales y alabanzas en forma de himnos para expresar su identidad espiritual y su liberación.
    date: Suele asignarse al siglo II o III d. C.; se conservan dos copias coptas en códices de Nag Hammadi del siglo IV.
    chapters:
      '1':
        title: Dios revela la luz divina eterna
      '2':
        title: Tres poderes surgen del silencio
      '3':
        title: El Padre surge del silencio sagrado
      '4':
