  Letter of Peter to Philip:
    display_name: Carta de Pedro a Felipe
    author: Anónimo. La breve carta inicial y la revelación que sigue se atribuyen de manera seudónima a Pedro y Felipe, y no puede afirmarse con certeza que ninguno de los dos apóstoles las escribiera.
    audience: Cristianos que buscaban autorización apostólica para enseñanzas acerca del Salvador, los poderes hostiles, el sufrimiento, la misión y la restauración de los discípulos.
    date: Suele fecharse a finales del siglo II o comienzos del III d. C.; se conserva en una copia de Nag Hammadi del siglo IV y en un testimonio copto posterior.
    chapters:
      '1':
        title: Pedro insta a Felipe a regresar
      '2':
        title: Los apóstoles oran en el monte de los Olivos
      '3':
        title: Jesús explica la plenitud divina
      '4':
