      '7':
        title: Den gracias a Dios por las heridas de Jesús
      '8':
        title: El sacrificio de la novilla prefigura a Jesús
      '9':
        title: La circuncisión del corazón representa la fe
      '10':
        title: Las leyes alimentarias enseñan lecciones espirituales
      '11':
        title: El bautismo y la cruz traen perdón
      '12':
