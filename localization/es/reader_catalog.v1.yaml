  Sophia of Jesus Christ:
    display_name: La sabiduría de Jesucristo
    author: Anónimo. El autor adapta material conocido también por Eugnosto y lo presenta como un diálogo posterior a la resurrección entre Jesús y sus discípulos.
    audience: Cristianos interesados en la sabiduría revelada acerca del Dios trascendente, el orden del mundo celestial y el origen y la salvación del alma.
    date: A menudo se fecha a finales del siglo II o en el siglo III d. C.; se conserva en copias coptas de Nag Hammadi y del Códice de Berlín.
    chapters:
      '1':
        title: Jesús revela la verdad a sus discípulos
      '2':
        title: Se explica el misterio eterno de Dios
      '3':
        title: La creación surge de la bondad del Dios oculto
      '4':
        title: El mundo visible conduce a la fe
      '5':
