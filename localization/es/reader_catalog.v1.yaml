  Gospel of Philip:
    display_name: Evangelio de Felipe
    author: Anónimo. El título aparece en la nota final del manuscrito, pero la obra no identifica a Felipe como su autor. La única copia conservada es el texto copto del Códice II,3 de Nag Hammadi.
    audience: Una comunidad cristiana primitiva familiarizada con una enseñanza sacramental de estilo valentiniano, especialmente sobre el bautismo, la unción, la eucaristía, la redención, la resurrección y las imágenes de la cámara nupcial.
    date: Suele fecharse a finales del siglo II o principios del siglo III d. C.; se conserva en un manuscrito copto del siglo IV traducido de una forma griega anterior.
