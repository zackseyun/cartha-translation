book_localizations:
- source_title: Genesis
  title: Génesis
  author: Anónimo; tradicionalmente atribuido a Moisés. Los estudios modernos consideran que tuvo una larga historia de composición, con fuentes que posteriormente fueron editadas y reunidas.
  audience: Israel, en el marco de su identidad de pueblo del pacto, para afianzar el relato de los orígenes del pueblo en la creación, la elección y la promesa de Dios.
  date: Compuesto a lo largo de varios siglos; alcanzó la forma en que se ha transmitido hacia los siglos VI–V a. C., durante o después del exilio babilónico.
  summary: Génesis relata la creación, la rebelión y dispersión de la humanidad, y la historia de la familia de Abraham, Isaac, Jacob y José, por medio de la cual comienzan las promesas del pacto de Dios con Israel.
- source_title: John
  title: Juan
  author: Anónimo; la tradición lo atribuye al apóstol Juan o al «Discípulo Amado».
  audience: Una comunidad cristiana en tensión con el judaísmo de la sinagoga, formada en torno al testimonio del Discípulo Amado.
  date: Aprox. 90–110 d. C.
  summary: Juan presenta a Jesús como la Palabra eterna que revela al Padre, da vida por medio de la confianza en él y es glorificado mediante sus señales, muerte y resurrección.
- source_title: Gospel of Thomas
  title: Evangelio de Tomás
  author: Anónimo; el inicio atribuye la colección de dichos a «Dídimo Judas Tomás». Solo se conserva íntegro en una traducción copta del siglo IV de Nag Hammadi (NHC II,2), junto con tres fragmentos griegos de Oxirrinco.
  audience: Lectores cristianos influidos por la sabiduría siria y el pensamiento protognóstico, orientados hacia el autoconocimiento esotérico en los dichos de Jesús.
  date: El original griego probablemente data de aprox. 50–140 d. C.; el manuscrito copto, de aprox. 340 d. C.
  summary: El Evangelio de Tomás es una colección de dichos atribuidos a Jesús. No contiene un relato continuo e invita repetidamente a los lectores a descubrir el significado de los dichos.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Génesis 1:1
  text: Cuando Dios comenzó a crear los cielos y la tierra[a]—
  translator_note: '[a] La traducción tradicional trata estas palabras como una oración completa: «En el principio, Dios creó los cielos y la tierra». Sin embargo, el hebreo introduce de manera más natural lo que sigue, cuya acción principal, «Dios dijo», aparece en el versículo 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Eclesiastés 1:2
  text: '«Vapor de vapores[a] —dice Qohelet[b]—. Todo es vapor: breve, imposible de retener y, a menudo, distinto de lo que esperamos».'
  translator_note: '[a] La palabra hebrea hével significa literalmente «aliento» o «vapor». A lo largo de Eclesiastés describe lo que pasa pronto, no puede retenerse ni comprenderse del todo y, a menudo, resulta distinto de lo esperado. «Vapor» conserva esa imagen sin afirmar que nada tenga sentido. También podría traducirse «aliento», «mero aliento» o «fugaz». [b] Qohelet es el nombre o título hebreo del autor. Suele traducirse «el Maestro» o «el Predicador», pero se conserva «Qohelet» para dar cabida a todos los sentidos posibles sin favorecer una interpretación.'
- source_path: nt/john/001/001.yaml
  reference: Juan 1:1
  text: En el principio[b], la Palabra ya existía. La Palabra estaba con Dios, y la Palabra era Dios.[a]
  translator_note: '[a] O bien: «la Palabra era divina» o «lo que Dios era, la Palabra lo era». La formulación griega afirma que la Palabra es plenamente Dios, a la vez que la distingue de Dios en la cláusula anterior. [b] Este comienzo evoca Génesis 1:1 y vincula a la Palabra con el principio de la creación. «Ya existía» expresa que la Palabra existía al llegar el principio, en vez de comenzar a existir entonces; también puede traducirse «era» o «existía».'
- source_path: nt/romans/003/025.yaml
  reference: Romanos 3:25
  text: Dios lo presentó como sacrificio de expiación[a] mediante la fe en su sangre[b]. Lo hizo para demostrar su rectitud[c], porque había pasado por alto los pecados cometidos anteriormente.
  translator_note: '[a] O bien: «propiciación»; o «lugar de expiación», es decir, la cubierta de oro del arca del pacto donde se rociaba la sangre expiatoria en el Antiguo Testamento. [b] O bien: «mediante la fe, por medio de su sangre». [c] O bien: «justicia».'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Pedro 1:13
  text: Por lo tanto, preparen su mente para actuar.[a] Manténganse plenamente lúcidos y pongan por completo su esperanza en la gracia que se les trae cuando Jesús el Mesías sea revelado.[b]
  translator_note: '[a] El griego dice literalmente: «cíñanse los lomos de su mente». La imagen es la de recoger una prenda larga alrededor de la cintura para estar listos para actuar. [b] La palabra griega traducida «plenamente» y «por completo» puede referirse a mantenerse lúcidos, a poner la esperanza o, posiblemente, a ambas cosas.'
