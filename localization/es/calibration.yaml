review:
  verdict: revise
  summary: 'Se corrigieron una construcción poco natural en la audiencia de Génesis, la concordancia en el resumen de Juan y dos matices de los pasajes críticos: «rectitud/justicia» en Romanos 3:25 y el aspecto verbal, la ambigüedad y «Jesús el Mesías» en 1 Pedro 1:13. El resto se aprueba con ajustes idiomáticos menores.'
  issues:
  - 'Génesis, audiencia: «arraigando» quedaba como gerundio colgante; se reformuló para expresar con claridad la finalidad indicada por el original.'
  - 'Juan, resumen: «es glorificada» no concuerda con «Jesús»; se corrigió a «es glorificado».'
  - 'Romanos 3:25: para conservar la distinción del original entre «righteousness» y la alternativa «justice», se usa «rectitud» en el texto y «justicia» en la nota.'
  - '1 Pedro 1:13: «se les traerá» desplaza el presente participial del original; se restituyó «se les trae». También se hizo explícita la ambigüedad de «plenamente/por completo» y se tradujo «Jesus the Messiah» como «Jesús el Mesías».'
  - 'Génesis 1:1: se empleó raya final, en vez de puntos suspensivos, para reflejar que la construcción queda abierta hacia lo que sigue.'
