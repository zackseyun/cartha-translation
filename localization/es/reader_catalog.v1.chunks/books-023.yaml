  book_metadata:
    Gospel of Mary:
      display_name: Evangelio de María
      author: Anónimo. La obra presenta a María como receptora e intérprete de la revelación de Jesús, pero no afirma que María haya escrito el evangelio conservado.
      audience: Lectores cristianos de los primeros tiempos que reflexionaban sobre la revelación, el ascenso espiritual, la autoridad apostólica y la legitimidad de la enseñanza de María entre los discípulos de Jesús.
      date: Suele fecharse en el siglo II d. C.; se conservan fragmentos griegos del siglo III, y el principal testimonio copto se conserva en el Códice de Berlín 8502, del siglo V.
    Treatise on the Resurrection:
      display_name: Tratado sobre la resurrección
      author: Anónimo. La obra se presenta como la carta de un maestro a un discípulo llamado Regino; ni el maestro ni Regino pueden identificarse con certeza.
      audience: Cristianos que buscaban instrucción acerca de la resurrección, en especial lectores que consideraban sus dimensiones corporal y espiritual, así como la participación presente en la vida de resurrección.
      date: Suele situarse a finales del siglo II d. C. (a menudo, hacia 170–200); se conserva en una copia copta del siglo IV de una obra griega anterior.
    Dialogue of the Savior:
      display_name: Diálogo del Salvador
      author: Anónimo. El diálogo pone enseñanzas reveladas en boca de Jesús durante una conversación con Judas, Mateo y María, pero no identifica a quien lo compiló.
      audience: Un círculo cristiano de los primeros tiempos interesado en la revelación privada, el discipulado, el conocimiento de uno mismo, la oración y la preparación ascética para la salvación.
      date: Por lo general, se atribuye al siglo II d. C., aunque sus distintas etapas de composición y su fecha exacta siguen siendo objeto de debate; se conserva en un manuscrito copto del siglo IV.
    Exegesis on the Soul:
      display_name: Exégesis sobre el alma
      author: Anónimo. El autor es un predicador cristiano que reinterpreta imágenes bíblicas y de la literatura griega como una alegoría de la caída, el arrepentimiento y la restauración del alma.
      audience: Cristianos familiarizados con las Escrituras y la exhortación moral, a quienes se llamaba a abandonar los deseos desordenados, arrepentirse y reunirse con lo divino.
      date: Por lo general, se fecha a finales del siglo II o comienzos del III d. C.; se conserva en una traducción copta del siglo IV hecha a partir del griego.
    Book of Thomas the Contender:
      display_name: Libro de Tomás el Contendiente
      author: Anónimo. El título final relaciona la obra con Judas Tomás y menciona a Matías como escriba, pero estas son atribuciones literarias y no afirmaciones verificables de autoría.
      audience: Cristianos de inclinación ascética exhortados a buscar el conocimiento de sí mismos, resistir las pasiones corporales y comprender la enseñanza privada de Jesús a Tomás.
      date: A menudo se fecha a finales del siglo II o comienzos del III d. C., posiblemente en un entorno cristiano sirio; se conserva en un manuscrito copto del siglo IV.
    Tripartite Tractate:
      display_name: Tratado tripartito
      author: Anónimo. El autor fue un teólogo cristiano valentiniano de gran formación; no es posible identificarlo con certeza con ningún maestro conocido.
      audience: Una comunidad cristiana valentiniana que recibía instrucción extensa acerca de Dios, los eones, la creación, Cristo, la iglesia, la salvación y la restauración final.
      date: Suele fecharse en el siglo III d. C., aunque algunos argumentos favorecen su segunda mitad; se conserva en copto en el Códice Jung, del siglo IV.
    Apocryphon of John:
      display_name: Apócrifo de Juan
      author: Anónimo. La obra presenta de manera seudónima una revelación de Jesús resucitado a Juan, hijo de Zebedeo, y se conserva en más de una recensión antigua.
      audience: Cristianos de una tradición revelatoria setiana o estrechamente relacionada, que buscaban una explicación del ámbito divino, la creación, la identidad humana y la liberación de gobernantes hostiles.
      date: Es probable que una forma temprana circulara en el siglo II d. C.; los testimonios coptos conservados, que contienen recensiones breves y extensas, datan de los siglos IV y V.
