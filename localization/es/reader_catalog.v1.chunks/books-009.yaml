  - 'Ezequiel 24: se evita afirmar explícitamente la muerte de la esposa, pues la fuente dice solo que fue quitada como señal.'
  - 'Ezequiel 40: se corrige la medición para reflejar que la visión comienza en un monte alto.'
  - 'Oseas 10: se conserva el singular de «ídolo» de la fuente.'
