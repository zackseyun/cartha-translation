    Lamentations:
      display_name: Lamentaciones
      author: Anónimo; la tradición lo atribuye a Jeremías.
      audience: Los habitantes de Judá que lloraban la destrucción de Jerusalén en 586 a. C.
      date: Poco después de 586 a. C.
    Ezekiel:
      display_name: Ezequiel
      author: Ezequiel, sacerdote exiliado en Babilonia; con desarrollo editorial.
      audience: Los exiliados de Judá en Babilonia, que reconsideraban la presencia de Dios lejos del templo.
      date: Aprox. 593–571 a. C. para el ministerio del profeta; su forma final es algo posterior.
    Daniel:
      display_name: Daniel
      author: Anónimo; se presenta como obra de Daniel, del tiempo del exilio.
      audience: Los judíos durante la persecución helenística, especialmente bajo Antíoco IV Epífanes (167–164 a. C.).
      date: Alcanzó la forma en que se ha conservado hacia 165 a. C.; los capítulos 1–6 incorporan relatos cortesanos más antiguos.
    Hosea:
      display_name: Oseas
      author: Oseas hijo de Beerí.
      audience: El reino del norte de Israel durante sus últimas décadas antes de la conquista asiria.
      date: Aprox. 750–722 a. C.
