review:
  verdict: revise
  review_summary: Se corrigieron pequeñas ampliaciones interpretativas en títulos para ajustarlos de forma más estricta al inglés canónico, especialmente en Gospel of Peter 9, Acts of Paul and Thecla 11 y Epistle of Barnabas 3. El resto del contenido es fiel y completo.
  issues:
  - Gospel of Peter 9 añadía «habla», ausente de la fuente.
  - Acts of Paul and Thecla 11 convertía la referencia concisa al velo en una acción adicional.
  - Epistle of Barnabas 3 añadía «practicar», no expresado en el título fuente.
