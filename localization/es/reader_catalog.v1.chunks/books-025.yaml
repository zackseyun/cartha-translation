  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Evangelio de la infancia de Tomás
      author: Anónimo. Su forma más antigua que puede reconstruirse no nombra a ningún autor; la atribución a Tomás pertenece a títulos de manuscritos posteriores y a la transmisión del texto.
      audience: Cristianos interesados en la infancia de Jesús y en cómo podrían narrarse el poder divino, la disciplina, el aprendizaje y la maduración antes del comienzo de los relatos de los Evangelios canónicos.
      date: Por lo general, se remonta al siglo II d. C., pero el texto se conserva en varias recensiones griegas considerablemente diferentes y en traducciones antiguas.
    Acts of Paul and Thecla:
      display_name: Hechos de Pablo y Tecla
      author: Anónimo. Es un episodio de la obra más extensa Hechos de Pablo; un informe antiguo según el cual un presbítero compuso los Hechos no permite identificar con certeza al autor.
      audience: Cristianos atraídos por relatos sobre la predicación apostólica, el celibato, el bautismo, la perseverancia semejante a la de los mártires y la autoridad de una mujer para enseñar y dar testimonio.
      date: Compuesto en el siglo II d. C., probablemente durante su segunda mitad; circuló tanto dentro de los Hechos de Pablo como en forma de obra independiente.
    Gospel of Peter:
      display_name: Evangelio de Pedro
      author: Anónimo. El relato conservado habla con la voz de Pedro y fue transmitido bajo su nombre, pero no se considera una obra del apóstol histórico.
      audience: Cristianos de los primeros tiempos interesados en un relato ampliado de la pasión y la resurrección, probablemente en comunidades donde la autoridad de Pedro tenía especial importancia.
      date: Por lo general, se fecha en el siglo II d. C.; el principal fragmento griego conservado procede de un manuscrito muy posterior hallado en Ajmín.
    2 Clement:
      display_name: 2 Clemente
      author: Anónimo. A pesar de su título tradicional, se trata de una homilía cristiana antigua y no de una segunda carta de Clemente de Roma.
      audience: Una asamblea cristiana exhortada al arrepentimiento, la coherencia moral, el cuidado de las personas vulnerables y la perseverancia fiel en la esperanza de la resurrección y el juicio.
      date: Por lo general, se fecha en la primera mitad o hacia mediados del siglo II d. C. (aproximadamente entre 100 y 160); se desconoce con certeza el lugar de composición.
    Epistle of Barnabas:
      display_name: Epístola de Bernabé
      author: Anónimo. La obra se asoció tradicionalmente con Bernabé, compañero de Pablo, pero los estudios modernos no aceptan esa atribución.
      audience: Cristianos gentiles a quienes se enseñaba a hacer suyas las Escrituras de Israel mediante una interpretación cristológica y alegórica, a la vez que distinguían su identidad de pacto de las prácticas judías.
      date: Se suele fechar entre la destrucción del templo de Jerusalén en el año 70 d. C. y comienzos del siglo II, a menudo aproximadamente entre los años 80 y 130.
