    Isaiah:
      display_name: Isaías
      author: Múltiples autores a lo largo de varios siglos; los capítulos 1–39 tienen sus raíces en Isaías de Jerusalén, del siglo VIII a. C., mientras que 40–55 («Segundo Isaías») y 56–66 («Tercer Isaías») responden al exilio y al retorno.
      audience: Judá bajo la amenaza asiria, el exilio babilónico y la restauración posterior al exilio, sucesivamente.
      date: Compuesto aproximadamente entre finales del siglo VIII y el siglo V a. C.
    Jeremiah:
      display_name: Jeremías
      author: Jeremías de Anatot; con una edición considerable de su escriba Baruc y de manos posteriores.
      audience: Judá en vísperas de la conquista babilónica, durante ella y después de ella.
      date: De finales del siglo VII a principios del siglo VI a. C.
