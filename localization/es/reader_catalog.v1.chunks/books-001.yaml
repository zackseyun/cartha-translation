    Genesis:
      display_name: Génesis
      author: Anónimo; tradicionalmente atribuido a Moisés. Los estudios modernos consideran que tuvo una larga historia de composición, con fuentes que posteriormente fueron editadas en conjunto.
      audience: Israel en su identidad de pueblo del pacto, cuya historia de origen se fundamenta en la creación, la elección y la promesa de Dios.
      date: Compuesto a lo largo de varios siglos; alcanzó la forma en que fue recibido aproximadamente entre los siglos VI y V a. C., durante o después del exilio en Babilonia.
      summary: Génesis relata la creación, la rebelión y dispersión de la humanidad, y la historia de la familia de Abraham, Isaac, Jacob y José, por medio de la cual comienzan las promesas del pacto de Dios con Israel.
    Exodus:
      display_name: Éxodo
      author: Anónimo; tradicionalmente atribuido a Moisés. Los estudios modernos consideran que tuvo una larga historia de composición, con fuentes que posteriormente fueron editadas en conjunto.
      audience: Israel como pueblo liberado y unido a Dios por un pacto, que aprende lo que significa ser la nación del SEÑOR bajo su ley.
      date: Compuesto a lo largo de varios siglos; alcanzó la forma en que fue recibido aproximadamente entre los siglos VI y V a. C.
    Leviticus:
      display_name: Levítico
      author: Anónimo; tradicionalmente atribuido a Moisés. Los estudios modernos lo sitúan dentro de la fuente sacerdotal.
      audience: 'Los sacerdotes israelitas y la comunidad de adoradores: instrucciones sobre los sacrificios, la santidad y la organización de la vida en torno a la presencia de Dios.'
      date: Con etapas de composición que abarcan desde finales de la monarquía hasta el período posterior al exilio (aproximadamente entre los siglos VII y V a. C.).
