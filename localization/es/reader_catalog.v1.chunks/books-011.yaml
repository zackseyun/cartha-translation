      author: Anónimo; la tradición lo atribuye a Lucas, compañero de viaje de Pablo.
      audience: Lectores cristianos instruidos del mundo grecorromano; está dirigido a «Teófilo».
      date: Aprox. 80–90 d. C.
    John:
      display_name: Juan
      author: Anónimo; la tradición lo atribuye al apóstol Juan o al «Discípulo Amado».
      audience: Una comunidad cristiana en tensión con el judaísmo de la sinagoga, formada en torno al testimonio del Discípulo Amado.
      date: Aprox. 90–110 d. C.
      summary: Juan presenta a Jesús como la Palabra eterna que revela al Padre, da vida a quienes confían en él y es glorificado mediante sus señales, su muerte y su resurrección.
    Acts:
      display_name: Hechos
      author: Anónimo; es el mismo autor de Lucas.
      audience: Lectores cristianos del mundo grecorromano; es el segundo volumen de la obra dirigida a Teófilo.
      date: Aprox. 80–90 d. C.
    Romans:
      display_name: Romanos
      author: Pablo, con Tercio como escriba.
      audience: 'Los cristianos de Roma: creyentes judíos y gentiles en tensión por la Torá y la identidad.'
      date: Aprox. 56–58 d. C.; escrita desde Corinto.
