      author: Anónimo; atribuido de manera seudónima al patriarca antediluviano Enoc. Es una obra compuesta, reunida a partir de varias secciones distintas.
      audience: Comunidades apocalípticas judías que reflexionaban sobre el mal cósmico, el juicio y el calendario; más tarde también fue leído en círculos cristianos primitivos.
      date: Secciones recopiladas aproximadamente entre el siglo III a. C. y el siglo I d. C.; la obra completa solo se conserva en ge'ez (etíope).
