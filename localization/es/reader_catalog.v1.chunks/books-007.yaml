    Proverbs:
      display_name: Proverbios
      author: Una antología; los encabezamientos nombran a Salomón, Agur, Lemuel y «los sabios».
      audience: Jóvenes israelitas que estaban siendo formados en sabiduría para la vida diaria.
      date: Capas de composición de aproximadamente los siglos X al IV a. C.
    Ecclesiastes:
      display_name: Eclesiastés
      author: Anónimo; el hablante es «Qohélet», tradicionalmente identificado con Salomón.
      audience: Israelitas que afrontaban los límites de la sabiduría, la riqueza y el esfuerzo bajo el sol.
      date: Probablemente de aproximadamente los siglos V al III a. C., según su hebreo influido por el arameo.
    Song of Solomon:
      display_name: Cantar de los Cantares
      author: Anónimo; el encabezamiento invoca a Salomón.
      audience: Israel, que leía el amor erótico como una perspectiva de la intimidad del pacto; y, más tarde, lectores judíos y cristianos que lo interpretaban de manera alegórica.
      date: Probablemente posterior al exilio, de aproximadamente los siglos V al III a. C.
