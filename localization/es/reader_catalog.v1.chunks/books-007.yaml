review:
  verdict: revise
  review_summary: Se corrigieron matices de fidelidad en títulos de Salmos y en la formulación de la metainformación de Cantar de los Cantares; el resto de los valores está completo y es fiel al texto fuente.
  issues:
  - Salmos 110 requería conservar el sentido verbal pasado de «David Ruled with Holy Splendor».
  - Salmos 133 añadía «del pueblo de Dios», detalle no presente en la fuente; se restituyó una formulación equivalente a «Godly Unity».
  - La descripción de autoría de Cantar de los Cantares debía reflejar que el encabezamiento «invoca» a Salomón, no solo que lo menciona.
