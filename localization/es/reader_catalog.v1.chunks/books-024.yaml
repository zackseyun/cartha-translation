payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: La hipóstasis de los arcontes
      author: Anónimo. El autor interpreta el Génesis mediante un mito revelatorio acerca de los arcontes; la obra no puede atribuirse con certeza a un maestro conocido por nombre.
      audience: Cristianos de un entorno setiano o afín que leían el Génesis como un conflicto entre gobernantes cósmicos ignorantes, la sabiduría divina y el origen espiritual de la humanidad.
      date: Suele situarse en el siglo III d. C.; se conserva en una copia copta del siglo IV, en el Códice II de Nag Hammadi.
    On the Origin of the World:
      display_name: Sobre el origen del mundo
      author: Anónimo. La obra combina y reelabora varias tradiciones judías, cristianas, platónicas y mitológicas sin identificar a quien las recopiló.
      audience: Lectores de un entorno cristiano con tendencias gnósticas que buscaban una historia alternativa de la creación, los gobernantes cósmicos, Sofía, Adán y Eva, y el destino final del mundo.
      date: Por lo general, se fecha en el siglo III d. C., aunque puede basarse en materiales anteriores; se conserva principalmente en testimonios coptos del siglo IV.
    Sophia of Jesus Christ:
      display_name: La sabiduría de Jesucristo
      author: Anónimo. El autor adapta material conocido también por Eugnosto y lo presenta como un diálogo posterior a la resurrección entre Jesús y sus discípulos.
      audience: Cristianos interesados en la sabiduría revelada acerca del Dios trascendente, el orden del mundo celestial y el origen y la salvación del alma.
      date: A menudo se fecha a finales del siglo II o en el siglo III d. C.; se conserva en copias coptas de Nag Hammadi y del Códice de Berlín.
    Gospel of the Egyptians:
      display_name: Evangelio de los egipcios
      author: Anónimo. Esta obra de Nag Hammadi, llamada también Libro Sagrado del Gran Espíritu Invisible, es distinta del Evangelio griego de los egipcios, más antiguo y conocido solo mediante citas.
      audience: Una comunidad cristiana setiana que empleaba mitos complejos, nombres sagrados, imágenes bautismales y alabanzas en forma de himnos para expresar su identidad espiritual y su liberación.
      date: Suele asignarse al siglo II o III d. C.; se conservan dos copias coptas en códices de Nag Hammadi del siglo IV.
    Letter of Peter to Philip:
      display_name: Carta de Pedro a Felipe
      author: Anónimo. La breve carta inicial y la revelación que sigue se atribuyen de manera seudónima a Pedro y Felipe, y no puede afirmarse con certeza que ninguno de los dos apóstoles las escribiera.
      audience: Cristianos que buscaban autorización apostólica para enseñanzas acerca del Salvador, los poderes hostiles, el sufrimiento, la misión y la restauración de los discípulos.
      date: Suele fecharse a finales del siglo II o comienzos del III d. C.; se conserva en una copia de Nag Hammadi del siglo IV y en un testimonio copto posterior.
    Gospel of Judas:
      display_name: Evangelio de Judas
      author: Anónimo. El título atribuye el relato a Judas, pero la obra no demuestra que Judas Iscariote fuera su autor histórico.
      audience: Un grupo cristiano crítico de las prácticas sacrificiales y eclesiales de otros grupos, que empleaba diálogos revelatorios y una cosmología de tipo setiano para reinterpretar a Judas y la muerte de Jesús.
      date: Suele fecharse a mediados o finales del siglo II d. C.; Ireneo conocía un Evangelio de Judas hacia el año 180, y la copia copta conservada probablemente data del siglo III o IV.
    Protoevangelium of James:
      display_name: Protoevangelio de Santiago
      author: Anónimo. El narrador afirma ser Santiago, pero la obra es seudónima y no fue escrita por Santiago, el hermano de Jesús.
      audience: Cristianos interesados en el nacimiento y la crianza de María, su pureza perpetua, la natividad de Jesús y las respuestas narrativas a cuestiones que Mateo y Lucas dejaron abiertas.
      date: Por lo general, se fecha en la segunda mitad del siglo II d. C.; se conserva en numerosos manuscritos griegos posteriores y en traducciones antiguas.
