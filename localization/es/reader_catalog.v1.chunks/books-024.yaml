  - 'Sophia of Jesus Christ 10: se ajustó la forma verbal para reflejar el título fuente sin introducir un sujeto plural.'
  - 'Protoevangelium of James 6: se eliminó «y sana», ya que «healthy/sana» no aparece en la fuente.'
