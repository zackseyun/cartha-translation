payload:
  book_metadata:
    Joel:
      display_name: Joel
      author: Joel, hijo de Petuel.
      audience: El Judá posexílico, que responde a una plaga de langostas como señal del Día del SEÑOR.
      date: Probablemente entre los siglos V y IV a. C.
    Amos:
      display_name: Amós
      author: Amós de Tecoa, un pastor de Judá que predicó en el norte.
      audience: El reino del norte de Israel durante un período de prosperidad e injusticia bajo Jeroboam II.
      date: Aprox. 760–750 a. C.
    Obadiah:
      display_name: Abdías
      author: Abdías.
      audience: Judá después de que Edom traicionara a Jerusalén; una profecía sobre la caída de Edom.
      date: Poco después de 586 a. C.
    Jonah:
      display_name: Jonás
      author: Anónimo; el protagonista es Jonás, hijo de Amitai.
      audience: El Israel posexílico; una reprensión satírica del aislamiento étnico y una afirmación de la misericordia de Dios hacia los de afuera.
      date: Probablemente entre los siglos V y IV a. C.
    Micah:
      display_name: Miqueas
      author: Miqueas de Moreset.
      audience: Judá a finales del siglo VIII a. C., especialmente su población rural pobre frente a las élites urbanas.
      date: Aprox. 740–700 a. C.
    Nahum:
      display_name: Nahúm
      author: Nahúm de Elcos.
      audience: Judá, que celebra la inminente caída de Nínive.
      date: Poco antes de 612 a. C.
    Habakkuk:
      display_name: Habacuc
      author: Habacuc.
      audience: Judá ante el ascenso de Babilonia; el diálogo de un profeta con Dios acerca de la justicia.
      date: Aprox. a finales del siglo VII a. C.
    Zephaniah:
      display_name: Sofonías
      author: Sofonías, hijo de Cusí.
      audience: Judá bajo el reinado de Josías, en vísperas de sus reformas.
      date: Aprox. 640–609 a. C.
    Haggai:
      display_name: Hageo
      author: Hageo.
      audience: Los repatriados que reconstruían el templo bajo el reinado de Darío.
      date: 520 a. C.
    Zechariah:
      display_name: Zacarías
      author: Zacarías, hijo de Berequías; los capítulos 9–14 probablemente proceden de una mano posterior.
      audience: Los repatriados que reconstruían el templo y las comunidades posexílicas posteriores.
      date: Capítulos 1–8, aprox. 520–518 a. C.; 9–14, quizá un siglo después.
    Malachi:
      display_name: Malaquías
      author: Anónimo; «Malaquías» significa «mi mensajero».
      audience: El Judá posexílico, cada vez más descuidado en la adoración y la fidelidad bajo el dominio persa.
      date: Aprox. a mediados del siglo V a. C.
    Matthew:
      display_name: Mateo
      author: Anónimo; la tradición lo atribuye al apóstol Mateo. Los estudios modernos consideran que fue un autor judeocristiano de habla griega que se basó en Marcos y en una fuente semejante a Q.
      audience: Una comunidad judeocristiana que afrontaba las continuidades y discontinuidades con el judaísmo de la sinagoga.
      date: Aprox. 80–90 d. C.
    Mark:
      display_name: Marcos
      author: Anónimo; la tradición lo relaciona con Juan Marcos, compañero de viaje de Pedro.
      audience: Una comunidad cristiana de habla griega, posiblemente en Roma, bajo la amenaza de persecución o cerca de ella.
      date: Aprox. 65–75 d. C., en torno a la guerra judía y la destrucción del templo.
