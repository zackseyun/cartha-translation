      author: Anónimo; tradicionalmente atribuido a Moisés.
      audience: 'Israel en camino entre Egipto y la tierra prometida: la generación del desierto y los lectores posteriores que aprendieron de sus fracasos.'
      date: Capas de composición desde finales de la monarquía hasta el período posexílico (aprox. siglos VII–V a. C.).
    Deuteronomy:
      display_name: Deuteronomio
      author: Anónimo; presentado como los discursos de despedida de Moisés. La investigación moderna sitúa un núcleo en la reforma de finales del siglo VII a. C. bajo Josías.
      audience: Israel mientras se preparaba para entrar en la tierra, y más tarde los exiliados que se preguntaban cómo vivir fielmente sin templo ni rey.
      date: Núcleo de finales del siglo VII a. C.; alcanzó su forma final en el período del exilio.
    Joshua:
      display_name: Josué
      author: Anónimo; forma parte de la Historia Deuteronomista.
      audience: Israel durante la monarquía y el exilio, al reflexionar sobre la conquista, el pacto y el significado de la tierra.
      date: Compilado aproximadamente entre los siglos VII y VI a. C. a partir de tradiciones más antiguas.
