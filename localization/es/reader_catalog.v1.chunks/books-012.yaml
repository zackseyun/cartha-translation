payload:
  book_metadata:
    1 Corinthians:
      display_name: 1 Corintios
      author: Pablo, con Sóstenes.
      audience: La conflictiva comunidad cristiana de Corinto.
      date: Aprox. 53–55 d. C., escrita desde Éfeso.
    2 Corinthians:
      display_name: 2 Corintios
      author: Pablo, con Timoteo.
      audience: La comunidad de Corinto, después de un conflicto doloroso.
      date: Aprox. 55–56 d. C.
    Galatians:
      display_name: Gálatas
      author: Pablo.
      audience: Las comunidades cristianas de Galacia (Anatolia central), presionadas para adoptar la circuncisión y la observancia de la Torá.
      date: Aprox. 48–55 d. C. (fecha debatida).
    Ephesians:
      display_name: Efesios
      author: Pablo, o un discípulo cercano que escribió en nombre de Pablo (debatido).
      audience: Lectores cristianos en general de la provincia de Asia; el nombre del lugar «Éfeso» no aparece en los manuscritos más antiguos.
      date: Aprox. década de los 60 d. C. si es paulina; décadas de los 80–90 d. C. si es seudónima.
    Philippians:
      display_name: Filipenses
      author: Pablo, con Timoteo.
      audience: La comunidad cristiana de Filipos, colonia romana de Macedonia.
      date: Aprox. 60–62 d. C., escrita desde la prisión.
    Colossians:
      display_name: Colosenses
      author: Pablo, con Timoteo, o un discípulo cercano que escribió en nombre de Pablo (debatido).
      audience: Los cristianos de Colosas, en el valle del Lico, que enfrentaban una enseñanza sincretista.
      date: Aprox. 60–62 d. C. si es paulina; posterior si es seudónima.
    1 Thessalonians:
      display_name: 1 Tesalonicenses
      author: Pablo, con Silvano y Timoteo.
      audience: La joven comunidad cristiana de Tesalónica, que enfrentaba persecución.
      date: Aprox. 50–51 d. C.; probablemente la carta paulina más antigua que se conserva.
    2 Thessalonians:
      display_name: 2 Tesalonicenses
      author: Pablo (debatido; algunos especialistas consideran que es seudónima).
      audience: La comunidad de Tesalónica, para abordar una confusión escatológica.
      date: Aprox. 51 d. C. si es paulina.
    1 Timothy:
      display_name: 1 Timoteo
      author: Pablo, o un discípulo que escribió en nombre de Pablo (se considera ampliamente que las Epístolas Pastorales son seudónimas).
      audience: Timoteo, como delegado de Pablo en Éfeso; un manual de orientación para la organización posterior de la iglesia.
      date: Aprox. mediados de la década de los 60 d. C. si es paulina; aprox. 90–110 d. C. si es seudónima.
    2 Timothy:
      display_name: 2 Timoteo
      author: Pablo, o un discípulo que escribió en nombre de Pablo.
      audience: Timoteo; presentada como la despedida de Pablo desde la prisión.
      date: Aprox. mediados de la década de los 60 d. C. si es paulina; aprox. 90–110 d. C. si es seudónima.
    Titus:
      display_name: Tito
      author: Pablo, o un discípulo que escribió en nombre de Pablo.
      audience: Tito, como delegado de Pablo en Creta.
      date: Aprox. mediados de la década de los 60 d. C. si es paulina; aprox. 90–110 d. C. si es seudónima.
    Philemon:
      display_name: Filemón
      author: Pablo, con Timoteo.
      audience: Filemón, cristiano dueño de esclavos, respecto de Onésimo, un esclavo suyo que había huido.
      date: Aprox. 60–62 d. C.
    Hebrews:
      display_name: Hebreos
      author: Anónimo. La tradición ha propuesto a Pablo, Apolos, Bernabé, Priscila y otras personas; ninguna propuesta cuenta con consenso.
      audience: Cristianos judíos de habla griega tentados a apartarse de su confesión cristiana y volver atrás.
      date: Aprox. 60–95 d. C.
