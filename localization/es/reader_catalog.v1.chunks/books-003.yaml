    Judges:
      display_name: Jueces
      author: Anónimo; forma parte de la Historia Deuteronomista.
      audience: El Israel de una época posterior, que contempla su pasado anterior a la monarquía como un ciclo aleccionador de apostasía y liberación.
      date: Compilado aproximadamente entre los siglos VII y VI a. C.
    Ruth:
      display_name: Rut
      author: Anónimo.
      audience: El Israel posterior al exilio; posiblemente defiende la inclusión de los extranjeros frente a las políticas excluyentes de Esdras-Nehemías.
      date: Muy probablemente posterior al exilio, aproximadamente entre los siglos VI y IV a. C.
    1 Samuel:
      display_name: 1 Samuel
      author: Anónimo; forma parte de la Historia Deuteronomista.
      audience: Israel, al reflexionar sobre el surgimiento de la monarquía bajo Samuel, Saúl y David.
      date: Compilado aproximadamente entre los siglos VII y VI a. C. a partir de fuentes más antiguas.
    2 Samuel:
      display_name: 2 Samuel
      author: Anónimo; forma parte de la Historia Deuteronomista.
      audience: Israel, al considerar el reinado de David —sus triunfos y tragedias— como el modelo fundacional de la monarquía.
      date: Compilado aproximadamente entre los siglos VII y VI a. C.
