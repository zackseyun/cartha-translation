payload:
  book_metadata:
    1 Esdras:
      display_name: 1 Esdras
      author: Anónimo; una recomposición griega que reordena 2 Crónicas 35–36, Esdras y Nehemías 7–8.
      audience: Judíos del período helenístico que deseaban un relato claro del regreso y la restauración.
      date: Aprox. siglos II–I a. C.
    Prayer of Manasseh:
      display_name: Oración de Manasés
      author: Anónimo; atribuido de manera seudónima al rey Manasés.
      audience: Personas arrepentidas que se identificaban con el arrepentimiento de Manasés; usada litúrgicamente en algunas tradiciones.
      date: Aprox. siglos II–I a. C.
    Psalm 151:
      display_name: Salmo 151
      author: Anónimo; atribuido de manera seudónima a David. Una forma hebrea está atestiguada en 11QPsa.
      audience: Comunidades de la diáspora y de Qumrán devotas del salterio de David.
      date: Aprox. siglo II a. C. o antes.
    3 Maccabees:
      display_name: 3 Macabeos
      author: Anónimo; compuesto en griego.
      audience: Judíos de habla griega de la diáspora en Egipto; un relato de liberación ambientado bajo Ptolomeo IV.
      date: Aprox. entre el siglo I a. C. y el siglo I d. C.
    4 Maccabees:
      display_name: 4 Macabeos
      author: Anónimo; un autor judío de habla griega influido por la filosofía estoica.
      audience: Judíos helenísticos; un sermón filosófico sobre cómo la razón domina las pasiones mediante la fidelidad.
      date: Aprox. siglo I d. C.
    Bel and the Dragon:
      display_name: Bel y el Dragón
      author: Anónimo; una de las adiciones griegas a Daniel.
      audience: Judíos de habla griega; una polémica burlesca contra la idolatría.
      date: Aprox. siglos II–I a. C.
    Letter of Jeremiah:
      display_name: Carta de Jeremías
      author: Anónimo; atribuida de manera seudónima a Jeremías.
      audience: Judíos de la diáspora tentados por la idolatría de su entorno.
      date: Aprox. siglos IV–II a. C.
    Prayer of Azariah and Song of the Three:
      display_name: Oración de Azarías y Cántico de los Tres
      author: Anónimo; una de las adiciones griegas a Daniel.
      audience: Judíos de habla griega; material litúrgico para Daniel 3.
      date: Aprox. siglo II a. C.
    Susanna:
      display_name: Susana
      author: Anónimo; una de las adiciones griegas a Daniel.
      audience: Judíos de habla griega; un relato de rectitud y de reprensión del falso testimonio.
      date: Aprox. siglos II–I a. C.
    1 Clement:
      display_name: 1 Clemente
      author: Anónimo, atribuido a Clemente de Roma.
      audience: La comunidad cristiana de Corinto, envuelta en una disputa por el liderazgo.
      date: Aprox. 96 d. C.
