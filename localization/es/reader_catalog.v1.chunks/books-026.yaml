    Letters of Ignatius:
      display_name: Cartas de Ignacio
      author: Ignacio, obispo de Antioquía, en el caso de las siete cartas de la recensión media comúnmente aceptada; las cartas ignacianas ampliadas posteriormente y las seudónimas no forman parte de esta colección.
      audience: Las comunidades cristianas de Éfeso, Magnesia, Trales, Roma, Filadelfia y Esmirna, junto con Policarpo, a quienes Ignacio se dirigió durante su viaje hacia el martirio.
      date: Por lo general, se fechan a comienzos del siglo II d. C., comúnmente entre c. 105 y 117, aunque la cronología precisa del viaje de Ignacio sigue siendo objeto de debate.
