  verdict: revise
  review_summary: Se corrigieron la transliteración de Burrhus y una formulación que añadía «triunfo» al título 20. El resto de las traducciones es fiel y completo.
  issues:
  - 'Letters of Ignatius 20: «triunfo» no está en el título fuente; se ajustó a «derrocamiento».'
  - 'Letters of Ignatius 88: «Burro» es una traducción errónea del nombre propio Burrhus; se corrigió a «Burrhus».'
  - 'Letters of Ignatius 75: se conservó el nombre propio Rhaius mediante una transliteración española consistente.'
