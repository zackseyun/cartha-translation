payload:
  book_metadata:
    James:
      display_name: Santiago
      author: Tradicionalmente, Santiago, hermano de Jesús; los especialistas modernos están divididos entre considerarla una obra auténtica o seudónima.
      audience: Comunidades judeocristianas de la diáspora.
      date: Aprox. entre los años 50 y 60 d. C. si es auténtica; hacia finales del siglo I d. C. si es seudónima.
    1 Peter:
      display_name: 1 Pedro
      author: Tradicionalmente, el apóstol Pedro, con Silvano como escriba; algunos especialistas consideran que es una obra seudónima.
      audience: Cristianos de Asia Menor romana que sufrían hostilidad social.
      date: Aprox. en la década de los 60 d. C. si es de Pedro; entre las décadas de los 70 y 90 d. C. si es seudónima.
    2 Peter:
      display_name: 2 Pedro
      author: Tradicionalmente, Pedro; gran parte de los especialistas modernos considera que es una obra seudónima.
      audience: Cristianos que enfrentaban a burlones que negaban la parusía.
      date: Aprox. a comienzos del siglo II d. C.
    1 John:
      display_name: 1 Juan
      author: Anónimo; tradicionalmente, el apóstol Juan o el anciano de la comunidad joánica.
      audience: La comunidad joánica después de una división, mientras definía quiénes pertenecían a ella.
      date: Aprox. entre los años 90 y 110 d. C.
    2 John:
      display_name: 2 Juan
      author: «El anciano».
      audience: Una comunidad cristiana específica («la señora elegida»), advertida contra los falsos maestros.
      date: Aprox. entre los años 90 y 110 d. C.
    3 John:
      display_name: 3 Juan
      author: «El anciano».
      audience: Gayo, un líder que hospedaba a misioneros itinerantes.
      date: Aprox. entre los años 90 y 110 d. C.
    Jude:
      display_name: Judas
      author: Tradicionalmente, Judas, hermano de Santiago y de Jesús.
      audience: Comunidades cristianas en las que se infiltraban maestros de conducta desenfrenada.
      date: Aprox. entre las décadas de los 60 y 90 d. C.
    Revelation:
      display_name: Apocalipsis
      author: Juan de Patmos (de estilo distinto al del cuarto Evangelio).
      audience: Siete comunidades cristianas de Asia Menor romana sometidas a presión imperial.
      date: Aprox. en la década de los 90 d. C.; tradicionalmente, durante el reinado de Domiciano.
    Tobit:
      display_name: Tobit
      author: Anónimo.
      audience: Judíos de la diáspora que procuraban vivir con piedad, formar matrimonios y confiar en la providencia bajo dominio extranjero.
      date: Aprox. entre 225 y 175 a. C.; compuesto en arameo, con una versión hebrea también atestiguada en Qumrán.
    Judith:
      display_name: Judit
      author: Anónimo.
      audience: 'Judíos bajo amenaza extranjera: un relato desafiante de resistencia piadosa.'
      date: Aprox. entre 150 y 100 a. C.
    Greek Additions to Esther:
      display_name: Adiciones griegas a Ester
      author: Anónimo; material complementario añadido en la traducción griega de Ester.
      audience: Judíos de habla griega que deseaban un relato de Ester con oraciones y referencias explícitas a Dios.
      date: Aprox. entre los siglos II y I a. C.
    Wisdom of Solomon:
      display_name: Sabiduría de Salomón
      author: Anónimo; atribuido seudónimamente a Salomón. Compuesto en griego por un autor judío helenístico, probablemente en Alejandría.
      audience: Judíos helenísticos que dialogaban con la filosofía griega y defendían la sabiduría de Israel frente a alternativas paganas y apóstatas.
      date: Aprox. entre 50 a. C. y 50 d. C.
