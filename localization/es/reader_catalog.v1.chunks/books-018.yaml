  book_metadata:
    2 Esdras:
      display_name: 2 Esdras
      author: Anónimo, con un marco editado por cristianos en torno a un núcleo originalmente judío (4 Esdras, capítulos 3–14).
      audience: Judíos posteriores al año 70 d. C. que afrontaban el problema de la teodicea; posteriormente ampliado para lectores cristianos.
      date: Núcleo judío, hacia el año 100 d. C.; adiciones cristianas, hacia los siglos II–III d. C.
    Didache:
      display_name: Didaché
      author: Anónimo (el título significa «Enseñanza de los Doce Apóstoles»).
      audience: Comunidades cristianas primitivas; un breve manual sobre ética, bautismo, eucaristía y maestros itinerantes.
      date: Hacia finales del siglo I o comienzos del siglo II d. C.
    Gospel of Thomas:
      display_name: Evangelio de Tomás
      author: Anónimo; el inicio atribuye la colección de dichos a «Dídimo Judas Tomás». Se conserva íntegramente solo en una traducción copta del siglo IV procedente de Nag Hammadi (NHC II,2), además de tres fragmentos griegos de Oxirrinco.
      audience: Un público lector cristiano influido por la sabiduría siria y el pensamiento protognóstico, orientado hacia el autoconocimiento esotérico en los dichos de Jesús.
      date: Original griego probablemente de alrededor de los años 50–140 d. C.; manuscrito copto de alrededor del año 340 d. C.
      summary: El Evangelio de Tomás es una colección de dichos atribuidos a Jesús. No contiene un relato continuo y exhorta repetidamente a los lectores a descubrir el significado de los dichos.
