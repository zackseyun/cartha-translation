  verdict: revise
  review_summary: Se conservaron todos los campos y claves. Se corrigieron títulos que invertían el sentido o añadían detalles no presentes en la fuente inglesa.
  issues:
  - Gospel of Thomas 6 invertía quién come a quién.
  - Gospel of Thomas 35 añadía el saqueo, ausente de la fuente.
  - Gospel of Thomas 47 añadía «dos señores», detalle ausente de la fuente.
  - 2 Esdras 14 se ajustó para no introducir la acción de escribir.
