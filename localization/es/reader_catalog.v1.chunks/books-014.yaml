payload:
  book_metadata:
    Sirach:
      display_name: Sirácida
      author: Yeshua ben Eleazar ben Sira, de Jerusalén; traducción al griego realizada por su nieto.
      audience: Jóvenes judíos que recibían formación en sabiduría en la Jerusalén del período helenístico.
      date: Original hebreo, aprox. 195–175 a. C.; traducción griega, aprox. 132 a. C.
    Baruch:
      display_name: Baruc
      author: Anónimo; atribuido de manera seudónima a Baruc, escriba de Jeremías.
      audience: Judíos de la diáspora que reflexionaban sobre el exilio, el arrepentimiento y la sabiduría.
      date: Aprox. siglo II a. C.
    1 Maccabees:
      display_name: 1 Macabeos
      author: Anónimo, probablemente un autor de Jerusalén que escribió en hebreo (solo se conserva la versión griega).
      audience: Judíos durante y después de la revuelta asmonea; narra la legitimidad de la dinastía asmonea.
      date: Aprox. 100 a. C.
    2 Maccabees:
      display_name: 2 Macabeos
      author: Un epitomador anónimo de una obra más extensa de Jasón de Cirene; compuesto en griego.
      audience: Judíos de habla griega de la diáspora, con énfasis en el martirio, la providencia y la resurrección.
      date: Aprox. 124 a. C. o poco después.
