  book_metadata:
    Polycarp to the Philippians:
      display_name: Policarpo a los filipenses
      author: Policarpo, obispo de Esmirna. Algunos especialistas consideran que el texto conservado combina materiales enviados en más de una ocasión.
      audience: La comunidad cristiana de Filipos, que solicitó las cartas de Ignacio y recibió consejos sobre la fe, la conducta, el liderazgo, el dinero y la perseverancia.
      date: De principios a mediados del siglo II d. C.; al menos una parte está estrechamente relacionada con el viaje de Ignacio, mientras que las propuestas de que se trata de una carta compuesta permiten fechar una sección algo más tarde.
    Martyrdom of Polycarp:
      display_name: Martirio de Policarpo
      author: Miembros anónimos de la iglesia de Esmirna, que escribieron en nombre de la comunidad; las notas finales sobre la transmisión reflejan copias y circulación posteriores.
      audience: La iglesia de Filomelio y la comunidad cristiana en general, a las que se ofrece un relato del arresto, el juicio, la muerte y la perseverancia ejemplar de Policarpo.
      date: Escrito después de la muerte de Policarpo, por lo general se sitúa a mediados o finales del siglo II d. C.; se debaten tanto el año exacto del martirio como la forma final del documento.
    Epistle to Diognetus:
      display_name: Epístola a Diogneto
      author: Anónimo. El autor se llama a sí mismo discípulo o aprendiz, pero no es posible identificar con certeza ni a él ni al destinatario, Diogneto.
      audience: Un investigador no cristiano y culto —y lectores como él— que pregunta sobre el culto, la ética, la identidad social y el amor de los cristianos, así como sobre la aparente novedad de la fe.
      date: Suele fecharse a finales del siglo II o principios del siglo III d. C., aunque las propuestas varían mucho; los dos capítulos finales podrían proceder de otra obra.
    Fragments of Papias:
      display_name: Fragmentos de Papías
      author: Papías, obispo de Hierápolis, autor de la perdida obra en cinco libros Exposiciones de los dichos del Señor; la colección conservada consta de citas y relatos preservados por autores posteriores.
      audience: Cristianos de los primeros tiempos que buscaban enseñanzas recordadas acerca de Jesús y los apóstoles, recopiladas mediante cadenas identificadas de testimonio oral e interpretación.
      date: La obra de Papías suele fecharse a principios del siglo II d. C., a menudo hacia 110–130; los fragmentos conservados aparecen en autores que escribieron desde el siglo II en adelante.
