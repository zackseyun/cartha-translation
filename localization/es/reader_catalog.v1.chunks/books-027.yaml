review:
  verdict: revise
  review_summary: Se corrigieron pequeñas imprecisiones semánticas y una formulación defectuosa en los metadatos; el resto de las traducciones es completo y fiel al texto fuente.
  issues:
  - 'Fragments of Papias.author: se corrigió una construcción española defectuosa y se preservó que Papías es el autor atribuido de la obra perdida en cinco libros.'
  - 'Martyrdom of Polycarp 15 y 23: se corrigieron «ante la estaca» por «en la estaca» y «hasta el reino» por «al reino».'
  - 'Epistle to Diognetus 6: se restituyó el sentido de que el alma reside dentro del mundo.'
  - 'Fragments of Papias 1: se tradujo «reign» como «reinado».'
