review:
  verdict: revise
  summary: 'Corrette alcune imprecisioni di senso e di stile: il soggetto di «è glorificato» in Giovanni è Gesù; in Romani «passed over» non significa «lasciato impuniti»; la descrizione materiale del Vangelo di Tommaso va resa senza suggerire che i frammenti greci siano stati rinvenuti insieme al manoscritto copto. Il resto è reso in italiano moderno e conserva le cautele del contesto sorgente.'
  issues:
  - 'Giovanni, sintesi: «è glorificata» concordava erroneamente con «Parola»; il soggetto è Gesù e va reso «è glorificato».'
  - 'Vangelo di Tommaso, autore: «insieme a tre frammenti» può far pensare che i frammenti greci siano stati trovati a Nag Hammadi; il contesto li identifica separatamente come provenienti da Ossirinco.'
  - 'Vangelo di Tommaso, data: «probabilmente» e «circa» sono ridondanti per l''originale greco.'
  - 'Romani 3:25: «aveva lasciato impuniti» introduce l''idea di impunità; «had passed over» va reso come «aveva sorvolato sui» o equivalente.'
