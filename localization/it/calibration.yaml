book_localizations:
- source_title: Genesis
  title: Genesi
  author: Anonimo; tradizionalmente attribuito a Mosè. La ricerca moderna riconosce una lunga storia compositiva, con fonti successivamente riunite e redatte.
  audience: Israele nella sua identità di popolo dell'alleanza, ancorando il racconto delle origini del popolo nella creazione, nell'elezione e nella promessa di Dio.
  date: Composto nel corso di secoli; raggiunse la forma in cui ci è pervenuto intorno al VI–V secolo a.C., durante o dopo l'esilio babilonese.
  summary: La Genesi racconta la creazione, la ribellione e la dispersione dell'umanità, e la famiglia di Abramo, Isacco, Giacobbe e Giuseppe, attraverso la quale hanno inizio le promesse dell'alleanza di Dio a Israele.
- source_title: John
  title: Giovanni
  author: Anonimo; la tradizione lo attribuisce all'apostolo Giovanni o al «discepolo amato».
  audience: Una comunità cristiana in tensione con il giudaismo sinagogale, formatasi attorno alla testimonianza del discepolo amato.
  date: 90–110 d.C. circa.
  summary: Giovanni presenta Gesù come la Parola eterna che rivela il Padre, dona la vita mediante la fiducia in lui ed è glorificato attraverso i suoi segni, la sua morte e la sua risurrezione.
- source_title: Gospel of Thomas
  title: Vangelo di Tommaso
  author: Anonimo; l'incipit attribuisce la raccolta di detti a «Didimo Giuda Tommaso». Il testo completo sopravvive soltanto in una traduzione copta del IV secolo rinvenuta a Nag Hammadi (NHC II,2); ne esistono anche tre frammenti greci provenienti da Ossirinco.
  audience: Lettori cristiani influenzati dalla sapienza siriaca e dal pensiero protognostico, orientati verso una conoscenza esoterica di sé attraverso i detti di Gesù.
  date: L'originale greco risale probabilmente al 50–140 d.C.; il manoscritto copto al 340 d.C. circa.
  summary: Il Vangelo di Tommaso è una raccolta di detti attribuiti a Gesù. Non presenta una narrazione continua e invita ripetutamente i lettori a scoprire il significato dei detti.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Genesi 1:1
  text: Quando Dio cominciò a creare i cieli e la terra[a]—
  translator_note: '[a] La traduzione tradizionale considera queste parole una frase completa: «In principio Dio creò i cieli e la terra». L''ebraico introduce più naturalmente ciò che segue, mentre l''azione principale, «Dio disse», compare al versetto 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Qoèlet 1:2
  text: '«Vapore dei vapori[a]», dice Qoèlet[b]. «Tutto è vapore: dura poco, è impossibile trattenerlo e spesso non è come ci aspettiamo».'
  translator_note: '[a] La parola ebraica hevel significa letteralmente «respiro» o «vapore». In tutto il libro di Qoèlet descrive ciò che passa rapidamente, non si può trattenere né comprendere pienamente e spesso si rivela diverso da ciò che ci si aspetta. «Vapore» conserva questa immagine senza affermare che nulla abbia significato. Sono possibili anche rese come «respiro», «puro respiro» o «fugace». [b] Qoèlet è il nome o titolo ebraico dell''autore. Viene spesso tradotto «il Maestro» o «il Predicatore», ma qui si conserva «Qoèlet» per lasciare aperti tutti i significati possibili, senza privilegiare una sola interpretazione.'
- source_path: nt/john/001/001.yaml
  reference: Giovanni 1:1
  text: In principio[b], la Parola esisteva già. La Parola era con Dio, e la Parola era Dio.[a]
  translator_note: '[a] Oppure: «la Parola era divina» o «ciò che Dio era, la Parola lo era». La formulazione greca afferma che la Parola è pienamente Dio, distinguendola al tempo stesso da Dio nella proposizione precedente. [b] Questo inizio richiama Genesi 1:1 e collega la Parola con il principio della creazione. «Esisteva già» esprime l''esistenza continuata indicata dall''imperfetto greco ἦν: la Parola esisteva quando ebbe inizio la creazione, invece di venire allora all''esistenza. Sono possibili anche «era» ed «esisteva».'
- source_path: nt/romans/003/025.yaml
  reference: Romani 3:25
  text: Dio lo ha presentato come sacrificio espiatorio[a], mediante la fede nel suo sangue[b]. Lo ha fatto per mostrare la propria giustizia[c], perché aveva sorvolato sui peccati commessi in passato.
  translator_note: '[a] Oppure: «propiziazione»; o «propiziatorio», il coperchio d''oro dell''arca dell''alleanza sul quale, nell''Antico Testamento, veniva asperso il sangue dell''espiazione. [b] Oppure: «mediante la fede, per mezzo del suo sangue». [c] Oppure: «equità».'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Pietro 1:13
  text: Perciò preparate la vostra mente all'azione.[a] Siate pienamente lucidi e riponete tutta la vostra speranza nella grazia che vi viene portata quando Gesù, il Messia, sarà rivelato.[b]
  translator_note: '[a] Il greco dice letteralmente: «cingete i fianchi della vostra mente». L''immagine è quella di raccogliere e stringere alla vita una veste lunga per essere pronti ad agire; qui indica preparazione mentale e prontezza all''azione. [b] La parola greca tradotta con «pienamente» e «tutta» può riferirsi all''essere lucidi, al riporre la speranza oppure, forse, a entrambe le esortazioni.'
