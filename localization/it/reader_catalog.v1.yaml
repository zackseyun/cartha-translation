      '18':
        title: L'unione sacra porta la luce eterna
  Gospel of Mary:
    display_name: Vangelo di Maria
    author: Anonimo. L'opera presenta Maria come destinataria e interprete di una rivelazione di Gesù, ma non afferma che sia stata Maria a scrivere il vangelo giunto fino a noi.
    audience: Lettori cristiani delle origini alle prese con la rivelazione, l'ascesa spirituale, l'autorità apostolica e la legittimità dell'insegnamento di Maria tra i discepoli di Gesù.
    date: Di solito datato al II secolo d.C.; ne sopravvivono frammenti greci del III secolo, mentre il principale testimone copto è conservato nel Codice di Berlino 8502, del V secolo.
    chapters:
      '1':
        title: Il Salvatore insegna contro il peccato
      '2':
