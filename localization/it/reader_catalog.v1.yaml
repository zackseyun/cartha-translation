        title: La giustizia attraverso la morte di Cristo
      '6':
        title: Vivete per Dio, non per il peccato
      '7':
        title: I credenti lottano contro il peccato
      '8':
        title: Nulla ci separa da Cristo
      '9':
        title: Misericordia e ira riguardo a Israele
      '10':
        title: La salvezza è vicina a tutti
      '11':
        title: I non ebrei chiamati per grazia
      '12':
        title: Offrite la vostra vita come sacrificio vivente
      '13':
        title: Sottomettetevi alle autorità e amate
      '14':
        title: Accogliere chi è debole nella fede
      '15':
        title: Unire ebrei e non ebrei
      '16':
        title: Saluti e avvertimenti
  1 Corinthians:
    display_name: 1 Corinzi
    author: Paolo, con Sostene.
    audience: La litigiosa comunità cristiana di Corinto.
    date: Circa 53–55 d.C., scritta da Efeso.
    chapters:
      '1':
        title: Le ricchezze della fedeltà di Dio per tutti
      '2':
        title: Rivelata la sapienza che viene dallo Spirito di Dio
      '3':
        title: Paolo avverte i Corinzi, tempio di Dio
      '4':
        title: La fedeltà conta più dell'orgoglio
      '5':
        title: Paolo ordina alla comunità di esercitare la disciplina
      '6':
        title: Risolvete le controversie all'interno della comunità
      '7':
        title: Paolo insegna a onorare il matrimonio
      '8':
        title: L'amore prevale sulla libertà personale
      '9':
        title: Paolo difende liberamente il proprio apostolato
      '10':
        title: L'avvertimento d'Israele per il popolo di Dio
      '11':
        title: L'unità nel culto onora Cristo
      '12':
        title: I doni dello Spirito edificano l'unità della comunità
      '13':
        title: L'amore non si arrende mai
      '14':
        title: Paolo esorta a preferire l'amore all'apparenza
      '15':
        title: Cristo risorge e la morte è sconfitta
      '16':
        title: Offerte e programmi di viaggio
  2 Corinthians:
    display_name: 2 Corinzi
    author: Paolo, con Timoteo.
    audience: La comunità di Corinto, dopo un doloroso conflitto.
    date: Circa 55–56 d.C.
    chapters:
      '1':
        title: Il conforto di Dio nella sofferenza
      '2':
        title: Esortazione all'amore e al perdono
      '3':
        title: Un ministero attestato da vite trasformate
      '4':
        title: Proclamare la gloria di Cristo
      '5':
        title: L'amore di Cristo spinge al ministero
      '6':
        title: Sopportare la sofferenza per Dio
      '7':
        title: Perseguire la santità con riverenza
      '8':
        title: La grazia dei Macedoni ispira la generosità
      '9':
        title: Donate con gioia per i santi
      '10':
        title: La mansuetudine di Cristo come impegno
      '11':
        title: Zelo per una vita fedele
      '12':
        title: Vantarsi della debolezza e della grazia
      '13':
        title: Esaminiamo noi stessi per riconoscere il peccato
  Galatians:
    display_name: Galati
    author: Paolo.
    audience: Le comunità cristiane della Galazia (Anatolia centrale), sottoposte a pressioni perché adottassero la circoncisione e l'osservanza della Torah.
    date: Circa 48–55 d.C. (datazione dibattuta).
    chapters:
      '1':
        title: Paolo difende il suo vangelo
      '2':
        title: Paolo contesta l'errore di Pietro
      '3':
        title: La fede di Abramo rende giusti
      '4':
        title: Cristo ci libera dalla Legge
      '5':
        title: Vivete per fede, non secondo la Legge
      '6':
        title: Portate i pesi gli uni degli altri
  Ephesians:
    display_name: Efesini
    author: Paolo, oppure un discepolo a lui vicino che scrive a suo nome (questione dibattuta).
    audience: Un pubblico cristiano generico dell'Asia; il nome di luogo «Efeso» è assente nei manoscritti più antichi.
    date: Anni 60 d.C. circa, se paolina; anni 80–90 d.C. circa, se pseudonima.
    chapters:
      '1':
        title: La grazia di Dio suggellata nei credenti
      '2':
        title: Cristo porta pace a tutti
      '3':
        title: Il mistero rivelato mediante il vangelo
      '4':
        title: Preghiera per l'unità nel corpo di Cristo
      '5':
        title: Imitate Dio e comportatevi con saggezza
      '6':
        title: Figli, obbedite ai genitori e onorateli
  Philippians:
    display_name: Filippesi
    author: Paolo, con Timoteo.
    audience: La comunità cristiana di Filippi, colonia romana in Macedonia.
    date: Circa 60–62 d.C., scritta dal carcere.
    chapters:
      '1':
        title: Paolo prega per i Filippesi
      '2':
        title: Gesù umile ed esaltato
      '3':
        title: Rallegratevi di conoscere Cristo
      '4':
        title: Rimanete saldi con gioia
  Colossians:
    display_name: Colossesi
    author: Paolo, con Timoteo, oppure un discepolo a lui vicino che scrive a suo nome (questione dibattuta).
    audience: I cristiani di Colosse, nella valle del Lico, alle prese con un insegnamento sincretistico.
    date: Circa 60–62 d.C., se paolina; più tardi, se pseudonima.
    chapters:
      '1':
        title: Paolo prega per la fede dei Colossesi
      '2':
        title: Paolo incoraggia i credenti a rimanere in Cristo
      '3':
        title: Superate il peccato e vivete nell'amore
      '4':
        title: Paolo prega, è in catene e incoraggia
  1 Thessalonians:
    display_name: 1 Tessalonicesi
    author: Paolo, con Silvano e Timoteo.
    audience: La giovane comunità cristiana di Tessalonica, sottoposta a persecuzione.
    date: Circa 50–51 d.C.; probabilmente la più antica lettera paolina giunta fino a noi.
    chapters:
      '1':
        title: Grazia, pace, fede, amore e speranza
      '2':
        title: Predicare con franchezza e motivazioni pure
      '3':
        title: Timoteo incoraggia nella sofferenza
      '4':
        title: Paolo incoraggia a vivere nella santità
      '5':
        title: Rimanete vigili nell'attesa della salvezza
  2 Thessalonians:
    display_name: 2 Tessalonicesi
    author: Paolo (attribuzione dibattuta; alcuni studiosi la ritengono pseudonima).
    audience: La comunità di Tessalonica, per affrontare una confusione di carattere escatologico.
    date: Circa 51 d.C., se paolina.
    chapters:
      '1':
        title: Dio ricompensa i perseguitati rimasti fedeli
      '2':
        title: La ribellione precede la venuta di Cristo
      '3':
        title: Paolo prega per la crescita della comunità
  1 Timothy:
    display_name: 1 Timoteo
    author: Paolo, oppure un discepolo che scrive a suo nome (le Lettere pastorali sono ampiamente ritenute pseudonime).
    audience: Timoteo, quale delegato di Paolo a Efeso; un manuale di orientamento per il successivo ordinamento della Chiesa.
    date: Metà degli anni 60 d.C. circa, se paolina; circa 90–110 d.C., se pseudonima.
    chapters:
      '1':
        title: Paolo esorta Timoteo a rimanere
      '2':
        title: Pregate per i governanti e vivete in pace
      '3':
        title: Le qualità richieste ai responsabili della comunità
      '4':
        title: Respingi i falsi maestri e i miti
      '5':
        title: Onora fedelmente le vedove e gli anziani
      '6':
        title: Paolo consiglia Timoteo sulla ricchezza
  2 Timothy:
    display_name: 2 Timoteo
    author: Paolo, oppure un discepolo che scrive a suo nome.
    audience: Timoteo; la lettera si presenta come il congedo di Paolo dal carcere.
    date: Metà degli anni 60 d.C. circa, se paolina; circa 90–110 d.C., se pseudonima.
    chapters:
      '1':
        title: Timoteo, rimani saldo nella grazia
      '2':
        title: Sopporta la sofferenza per Cristo
      '3':
        title: 'Avvertimento: evita i falsi maestri'
      '4':
        title: Predica fedelmente a tutti
  Titus:
    display_name: Tito
    author: Paolo, oppure un discepolo che scrive a suo nome.
    audience: Tito, quale delegato di Paolo a Creta.
    date: Metà degli anni 60 d.C. circa, se paolina; circa 90–110 d.C., se pseudonima.
    chapters:
      '1':
        title: Paolo istruisce Tito a Creta
      '2':
        title: Insegna a ogni età a vivere secondo la grazia
      '3':
        title: Vivete con umiltà nell'attesa di Cristo
  Philemon:
    display_name: Filemone
    author: Paolo, con Timoteo.
    audience: Filemone, un cristiano proprietario di schiavi, riguardo al suo schiavo fuggitivo Onesimo.
    date: Circa 60–62 d.C.
    chapters:
      '1':
        title: Paolo supplica per la libertà di Onesimo
  Hebrews:
    display_name: Ebrei
    author: Anonimo. La tradizione ha proposto Paolo, Apollo, Barnaba, Priscilla e altri; nessuna proposta gode di consenso.
    audience: Cristiani ebrei di lingua greca tentati di allontanarsi dalla loro professione di fede cristiana.
    date: Circa 60–95 d.C.
    chapters:
      '1':
        title: Dio parla per mezzo di suo Figlio
      '2':
        title: Gesù salva attraverso la sofferenza
      '3':
        title: Tenete fisso lo sguardo su Gesù, che è fedele
      '4':
        title: Entrate nel riposo promesso da Dio
      '5':
        title: Cristo ha offerto il sacrificio perfetto
      '6':
        title: Progredite verso la maturità spirituale
      '7':
        title: Gesù, sacerdote per sempre al modo di Melchisedec
      '8':
        title: La nuova alleanza mediante il sangue di Gesù
      '9':
        title: Gesù entra nel vero santuario celeste
      '10':
        title: Avviciniamoci mediante il sangue di Cristo
      '11':
        title: La fede degli antenati persevera
      '12':
        title: Perseverare nella sofferenza con Gesù
      '13':
        title: Vivere nell'amore e nella fiducia
  James:
    display_name: Giacomo
    author: Tradizionalmente Giacomo, fratello di Gesù; gli studiosi moderni sono divisi tra l'attribuzione autentica e quella pseudonima.
    audience: Comunità giudeo-cristiane della diaspora.
    date: Circa anni 50–60 d.C. se l'attribuzione è autentica; fine del I secolo d.C. circa se pseudonima.
