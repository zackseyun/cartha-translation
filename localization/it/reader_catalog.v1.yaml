    chapters:
      '1':
        title: Pietro insegna la crescita spirituale
      '2':
        title: I falsi maestri attirano un rapido giudizio
      '3':
        title: Pietro avverte del giudizio finale
  1 John:
    display_name: 1 Giovanni
