      '5':
        title: Fede nella risurrezione di Cristo
      '6':
        title: La sapienza della salvezza dura per sempre
      '7':
        title: La grazia custodisce la vita eterna
      '8':
        title: La risurrezione rivela la vera vita
      '9':
        title: La risurrezione trionfa sulla corruzione
      '10':
        title: Sfuggire alla divisione per risorgere
      '11':
        title: Condividere l'insegnamento per il bene altrui
  Dialogue of the Savior:
    display_name: Dialogo del Salvatore
    author: Anonimo. Il dialogo pone insegnamenti rivelatori sulle labbra di Gesù durante una conversazione con Giuda, Matteo e Maria, ma non identifica chi lo abbia compilato.
    audience: Un gruppo cristiano delle origini interessato alla rivelazione privata, al discepolato, alla conoscenza di sé, alla preghiera e alla preparazione ascetica alla salvezza.
    date: Comunemente attribuito al II secolo d.C., benché i suoi strati compositivi e la data esatta rimangano discussi; è conservato in un manoscritto copto del IV secolo.
    chapters:
