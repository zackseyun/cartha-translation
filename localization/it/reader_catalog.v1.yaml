books:
  Genesis:
    display_name: Genesi
    author: Anonimo; tradizionalmente attribuito a Mosè. Gli studi moderni individuano una lunga storia compositiva, con fonti successivamente riunite mediante un lavoro redazionale.
    audience: Israele nella sua identità di popolo dell'alleanza, radicando il racconto delle origini del popolo nella creazione, nell'elezione e nella promessa di Dio.
    date: Composto nell'arco di secoli; raggiunse la forma in cui ci è pervenuto intorno al VI–V secolo a.C., durante o dopo l'esilio babilonese.
    summary: La Genesi narra la creazione, la ribellione e la dispersione dell'umanità, e la storia della famiglia di Abramo, Isacco, Giacobbe e Giuseppe, attraverso la quale hanno inizio le promesse dell'alleanza di Dio con Israele.
    chapters:
      '1':
        title: Dio crea il cielo e la terra
      '2':
        title: Dio forma l'uomo e la donna
      '3':
        title: L'umanità decade dall'Eden
      '4':
