      '1':
        title: La fede messa alla prova persevera
      '2':
        title: La fede senza opere è morta
      '3':
        title: Dominare la lingua e parlare con saggezza
      '4':
        title: I conflitti nascono dall'egoismo
      '5':
        title: È vicino il giudizio sugli oppressori ricchi
  1 Peter:
    display_name: 1 Pietro
    author: Tradizionalmente l'apostolo Pietro, con Silvano come scriba; alcuni studiosi ritengono che l'opera sia pseudonima.
    audience: Cristiani dell'Asia Minore romana esposti all'ostilità sociale.
    date: Circa anni 60 d.C. se di Pietro; circa anni 70–90 d.C. se pseudonima.
    chapters:
      '1':
        title: Speranza nell'eredità celeste
      '2':
        title: I credenti edificati sulla pietra vivente
      '3':
