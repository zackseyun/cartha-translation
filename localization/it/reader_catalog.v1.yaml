        title: La luce rivela la vera comunione
      '2':
        title: L'amore osserva i comandamenti di Dio
      '3':
        title: Chi è nato da Dio vince il peccato
      '4':
        title: Il vero amore viene da Dio
      '5':
        title: Chi crede in Gesù ha la vita eterna
  2 John:
    display_name: 2 Giovanni
    author: «L'anziano».
    audience: Una specifica comunità cristiana («la signora eletta»), messa in guardia contro i falsi maestri.
    date: Circa 90–110 d.C.
    chapters:
      '1':
        title: L'anziano mette in guardia dai falsi maestri
  3 John:
    display_name: 3 Giovanni
    author: «L'anziano».
    audience: Gaio, un singolo responsabile che ospita missionari itineranti.
    date: Circa 90–110 d.C.
    chapters:
      '1':
        title: L'anziano prega per la prosperità di Gaio
  Jude:
    display_name: Giuda
    author: Tradizionalmente Giuda, fratello di Giacomo e di Gesù.
    audience: Comunità cristiane nelle quali si stanno infiltrando maestri libertini.
