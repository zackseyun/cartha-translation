  Treatise on the Resurrection:
    display_name: Trattato sulla risurrezione
    author: Anonimo. L'opera si presenta come la lettera di un maestro a un discepolo di nome Regino; né il maestro né Regino possono essere identificati con certezza.
    audience: Cristiani in cerca di un insegnamento sulla risurrezione, in particolare lettori che riflettevano sulle sue dimensioni corporea e spirituale e sulla partecipazione già presente alla vita risorta.
    date: Di solito collocato alla fine del II secolo d.C. (spesso intorno al 170–200); è conservato in una copia copta del IV secolo di un'opera greca più antica.
    chapters:
      '1':
        title: Cristo porta il vero compimento
      '2':
        title: Cristo vince la morsa della morte
      '3':
        title: La risurrezione trasforma la realtà
      '4':
