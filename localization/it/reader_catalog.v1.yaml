      '4':
        title: Tobi istruisce il figlio nella giustizia
      '5':
        title: Tobia parte sotto una guida
      '6':
        title: Tobia cattura il pesce che guarisce
      '7':
        title: Tobia sposa Sara a Ecbatana
      '8':
        title: Tobia sposa Sara e prega
      '9':
        title: Gabael restituisce il denaro a Tobi
      '10':
        title: Tobia torna sano e salvo a casa
      '11':
        title: Il figlio restituisce la vista a Tobi
      '12':
