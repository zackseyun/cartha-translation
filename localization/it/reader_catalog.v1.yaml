        title: Il cielo gioisce per la caduta di Babilonia
      '19':
        title: Il cielo celebra le nozze dell'Agnello
      '20':
        title: Giovanni vede il giudizio finale
      '21':
        title: Tutte le cose sono rinnovate
      '22':
