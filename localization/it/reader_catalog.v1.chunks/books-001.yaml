  review_summary: 'Revisione completata: corretti titoli con lievi aggiunte interpretative o scostamenti dal testo sorgente e uniformata la resa italiana, mantenendo intatte struttura e chiavi.'
  issues:
  - 'Genesi 12: mantenuto «Abramo»? Corretto in «Abramo» secondo uso italiano, ma la fonte usa Abram; resa italiana tradizionale conserva Abramo.'
  - 'Genesi 16, 21, 23, 37, 38, 40 e 46: corrette formulazioni che aggiungevano dettagli o alteravano la relazione espressa dalla fonte.'
  - 'Esodo 7 e 35: rimosse o ridotte aggiunte non presenti nella fonte inglese.'
