  book_metadata:
    Genesis:
      display_name: Genesi
      author: Anonimo; tradizionalmente attribuito a Mosè. Gli studi moderni individuano una lunga storia compositiva, con fonti successivamente riunite mediante un lavoro redazionale.
      audience: Israele nella sua identità di popolo dell'alleanza, radicando il racconto delle origini del popolo nella creazione, nell'elezione e nella promessa di Dio.
      date: Composto nell'arco di secoli; raggiunse la forma in cui ci è pervenuto intorno al VI–V secolo a.C., durante o dopo l'esilio babilonese.
      summary: La Genesi narra la creazione, la ribellione e la dispersione dell'umanità, e la storia della famiglia di Abramo, Isacco, Giacobbe e Giuseppe, attraverso la quale hanno inizio le promesse dell'alleanza di Dio con Israele.
    Exodus:
      display_name: Esodo
      author: Anonimo; tradizionalmente attribuito a Mosè. Gli studi moderni individuano una lunga storia compositiva, con fonti successivamente riunite mediante un lavoro redazionale.
      audience: Israele come popolo liberato e legato a Dio dall'alleanza, che impara che cosa significhi essere la nazione del SIGNORE sotto la sua legge.
      date: Composto nell'arco di secoli; raggiunse la forma in cui ci è pervenuto intorno al VI–V secolo a.C.
    Leviticus:
      display_name: Levitico
      author: Anonimo; tradizionalmente attribuito a Mosè. Gli studi moderni lo collocano nella fonte sacerdotale.
      audience: 'I sacerdoti israeliti e la comunità riunita per il culto: istruzioni sui sacrifici, sulla santità e su come ordinare la vita intorno alla presenza di Dio.'
      date: Strati compositivi risalenti dal tardo periodo monarchico fino al periodo postesilico (circa VII–V secolo a.C.).
