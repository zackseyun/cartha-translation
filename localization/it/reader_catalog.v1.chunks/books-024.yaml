payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Ipostasi degli arconti
      author: Anonimo. L'autore interpreta la Genesi attraverso un mito rivelatorio sugli arconti; l'opera non può essere attribuita con certezza a un maestro conosciuto per nome.
      audience: Cristiani appartenenti a un ambiente sethiano o affine, che leggevano la Genesi come un conflitto tra governanti cosmici ignoranti, la sapienza divina e l'origine spirituale dell'umanità.
      date: Comunemente collocata nel III secolo d.C.; è conservata in una copia copta del IV secolo nel Codice II di Nag Hammadi.
    On the Origin of the World:
      display_name: Sull'origine del mondo
      author: Anonimo. L'opera combina e rielabora diverse tradizioni ebraiche, cristiane, platoniche e mitologiche, senza indicare il nome del suo compilatore.
      audience: Lettori di un ambiente cristiano di tendenza gnostica, interessati a una storia alternativa della creazione, dei governanti cosmici, di Sophia, di Adamo ed Eva e del destino finale del mondo.
      date: Di solito datata al III secolo d.C., anche se potrebbe basarsi su materiali più antichi; è conservata principalmente in testimonianze copte del IV secolo.
    Sophia of Jesus Christ:
      display_name: Sapienza di Gesù Cristo
      author: Anonimo. L'autore adatta materiale noto anche da Eugnosto, trasformandolo in un dialogo tra Gesù e i suoi discepoli dopo la risurrezione.
      audience: Cristiani interessati alla sapienza rivelata riguardo al Dio trascendente, all'ordinamento del mondo celeste e all'origine e alla salvezza dell'anima.
      date: Spesso datata alla fine del II o al III secolo d.C.; è conservata in copie copte provenienti da Nag Hammadi e dal Codice di Berlino.
    Gospel of the Egyptians:
      display_name: Vangelo degli Egiziani
      author: Anonimo. Quest'opera di Nag Hammadi, chiamata anche Libro sacro del Grande Spirito invisibile, è distinta dal più antico Vangelo greco degli Egiziani, conosciuto soltanto attraverso citazioni.
      audience: Una comunità cristiana sethiana che ricorreva a una mitologia complessa, a nomi sacri, a immagini battesimali e a lodi inniche per esprimere la propria identità spirituale e la liberazione.
      date: Di solito attribuito al II o al III secolo d.C.; ne sopravvivono due copie copte in codici di Nag Hammadi del IV secolo.
    Letter of Peter to Philip:
      display_name: Lettera di Pietro a Filippo
      author: Anonimo. La breve lettera iniziale e la rivelazione che segue sono attribuite sotto pseudonimo a Pietro e Filippo, ma non possono essere considerate con certezza opera di nessuno dei due apostoli.
      audience: Cristiani che cercavano un'autorità apostolica a sostegno di insegnamenti sul Salvatore, sulle potenze ostili, sulla sofferenza, sulla missione e sul ristabilimento dei discepoli.
      date: Comunemente datata alla fine del II o all'inizio del III secolo d.C.; è conservata in una copia di Nag Hammadi del IV secolo e in una testimonianza copta più tarda.
    Gospel of Judas:
      display_name: Vangelo di Giuda
      author: Anonimo. Il titolo attribuisce il racconto a Giuda, ma l'opera non dimostra che Giuda Iscariota ne sia stato l'autore storico.
      audience: Un gruppo cristiano critico verso pratiche sacrificali ed ecclesiali rivali, che usava il dialogo rivelatorio e una cosmologia di tipo sethiano per reinterpretare Giuda e la morte di Gesù.
      date: Di solito datato alla metà o alla fine del II secolo d.C.; Ireneo conosceva un Vangelo di Giuda intorno al 180 e la copia copta superstite risale probabilmente al III o al IV secolo.
    Protoevangelium of James:
      display_name: Protovangelo di Giacomo
      author: Anonimo. Il narratore afferma di essere Giacomo, ma l'opera è pseudonima e non fu scritta da Giacomo, fratello di Gesù.
      audience: Cristiani interessati alla nascita e all'infanzia di Maria, alla sua purezza perpetua, alla natività di Gesù e a risposte narrative per le questioni lasciate aperte da Matteo e Luca.
      date: Generalmente datato alla seconda metà del II secolo d.C.; è conservato in numerosi manoscritti greci più tardi e in antiche traduzioni.
