review:
  verdict: revise
  review_summary: Traduzione completa e nel complesso fedele. Ho corretto una formulazione che aggiungeva una sfumatura non presente nel testo sorgente e ho reso più aderente il titolo di Apocalisse 10.
  issues:
  - '3 Giovanni, destinatari: «responsabile locale» è un dettaglio aggiunto; il testo sorgente dice soltanto «individual leader».'
  - 'Apocalisse 10: «non vi sarà più indugio» non corrisponde letteralmente a «Final Time»; reso come «il tempo finale».'
  - 'Giacomo, datazione: corretto l''accordo di «autentica» riferendolo esplicitamente all''attribuzione.'
