payload:
  book_metadata:
    James:
      display_name: Giacomo
      author: Tradizionalmente Giacomo, fratello di Gesù; gli studiosi moderni sono divisi tra l'attribuzione autentica e quella pseudonima.
      audience: Comunità giudeo-cristiane della diaspora.
      date: Circa anni 50–60 d.C. se l'attribuzione è autentica; fine del I secolo d.C. circa se pseudonima.
    1 Peter:
      display_name: 1 Pietro
      author: Tradizionalmente l'apostolo Pietro, con Silvano come scriba; alcuni studiosi ritengono che l'opera sia pseudonima.
      audience: Cristiani dell'Asia Minore romana esposti all'ostilità sociale.
      date: Circa anni 60 d.C. se di Pietro; circa anni 70–90 d.C. se pseudonima.
    2 Peter:
      display_name: 2 Pietro
      author: Tradizionalmente Pietro; molti studiosi moderni ritengono che l'opera sia pseudonima.
      audience: Cristiani alle prese con schernitori che negano la parusia.
      date: Inizio del II secolo d.C. circa.
    1 John:
      display_name: 1 Giovanni
      author: Anonimo; tradizionalmente l'apostolo Giovanni o l'anziano della comunità giovannea.
      audience: La comunità giovannea dopo una scissione, intenta a definire chi ne fa parte.
      date: Circa 90–110 d.C.
    2 John:
      display_name: 2 Giovanni
      author: «L'anziano».
      audience: Una specifica comunità cristiana («la signora eletta»), messa in guardia contro i falsi maestri.
      date: Circa 90–110 d.C.
    3 John:
      display_name: 3 Giovanni
      author: «L'anziano».
      audience: Gaio, un singolo responsabile che ospita missionari itineranti.
      date: Circa 90–110 d.C.
    Jude:
      display_name: Giuda
      author: Tradizionalmente Giuda, fratello di Giacomo e di Gesù.
      audience: Comunità cristiane nelle quali si stanno infiltrando maestri libertini.
      date: Circa anni 60–90 d.C.
    Revelation:
      display_name: Apocalisse
      author: Giovanni di Patmos (dallo stile distinto rispetto al quarto Vangelo).
      audience: Sette comunità cristiane dell'Asia Minore romana sottoposte alla pressione imperiale.
      date: Circa anni 90 d.C., tradizionalmente durante il regno di Domiziano.
    Tobit:
      display_name: Tobia
      author: Anonimo.
      audience: Ebrei della diaspora alle prese con la pietà, il matrimonio e la provvidenza sotto il dominio straniero.
      date: Circa 225–175 a.C.; composto in aramaico, con una versione ebraica anch'essa attestata a Qumran.
    Judith:
      display_name: Giuditta
      author: Anonimo.
      audience: 'Ebrei sotto minaccia straniera: una storia audace di pia resistenza.'
      date: Circa 150–100 a.C.
    Greek Additions to Esther:
      display_name: Aggiunte greche a Ester
      author: Anonimo; materiale supplementare aggiunto nella traduzione greca di Ester.
      audience: Ebrei di lingua greca che desideravano un racconto di Ester con preghiere e riferimenti espliciti a Dio.
      date: Circa II–I secolo a.C.
    Wisdom of Solomon:
      display_name: Sapienza di Salomone
      author: Anonimo; attribuito pseudonimamente a Salomone. Composto in greco da un autore ebreo ellenistico, probabilmente ad Alessandria.
      audience: Ebrei ellenistici in dialogo con la filosofia greca, intenti a difendere la sapienza d'Israele dalle alternative pagane e apostate.
      date: Circa 50 a.C.–50 d.C.
