    Isaiah:
      display_name: Isaia
      author: Più autori nell'arco di secoli; i capitoli 1–39 affondano le radici nell'opera di Isaia di Gerusalemme, vissuto nell'VIII secolo, mentre i capitoli 40–55 («Secondo Isaia») e 56–66 («Terzo Isaia») rispondono alle esperienze dell'esilio e del ritorno.
      audience: Giuda sotto la minaccia assira, durante l'esilio babilonese e nella restaurazione postesilica, in fasi successive.
      date: Composto in un arco di tempo che va all'incirca dalla fine dell'VIII al V secolo a.C.
    Jeremiah:
      display_name: Geremia
      author: Geremia di Anatot; con un consistente lavoro redazionale da parte del suo scriba Baruc e di mani successive.
      audience: Giuda alla vigilia della conquista babilonese, durante la conquista e nel periodo successivo.
      date: Dalla fine del VII agli inizi del VI secolo a.C.
