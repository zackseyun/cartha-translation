      display_name: Vangelo di Filippo
      author: Anonimo. Il titolo compare nella sottoscrizione finale del manoscritto, ma l'opera non identifica Filippo come suo autore. L'unica copia superstite è il testo copto del Codice II,3 di Nag Hammadi.
      audience: Una comunità cristiana delle origini che conosceva un insegnamento sacramentale di tipo valentiniano, in particolare sul battesimo, l'unzione, l'eucaristia, la redenzione, la risurrezione e le immagini della camera nuziale.
      date: Generalmente datato alla fine del II o all'inizio del III secolo d.C.; conservato in un manoscritto copto del IV secolo, tradotto da una precedente versione greca.
