  verdict: revise
  review_summary: Corretta la resa di alcuni titoli che alteravano il referente o omettevano elementi del testo canonico; il resto della localizzazione è fedele, completo e neutrale.
  issues:
  - Gospel of Thomas 56 e 80 invertivano il senso di «world unworthy», facendo apparire indegno chi scopre il mondo anziché il mondo indegno di quella persona.
  - Gospel of Thomas 81 ometteva il riferimento a Gesù presente nel titolo sorgente.
  - Jubilees 6 rendeva al singolare «covenants», mentre il sorgente usa il plurale.
