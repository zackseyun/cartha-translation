review:
  verdict: revise
  review_summary: Corretta la resa italiana completa; sono state eliminate alcune aggiunte interpretative nei titoli del Vangelo di Tommaso e precisata la formulazione relativa ai testimoni manoscritti.
  issues:
  - 'Gospel of Thomas metadata.author: «insieme a» suggeriva impropriamente che i frammenti greci fossero rinvenuti a Nag Hammadi.'
  - 'Gospel of Thomas 13, 27, 35 e 47: il progetto aggiungeva o restringeva il significato del titolo inglese; corretti con rese fedeli.'
