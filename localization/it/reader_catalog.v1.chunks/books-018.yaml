  book_metadata:
    2 Esdras:
      display_name: 2 Esdra
      author: Anonimo, con una cornice redatta in ambito cristiano attorno a un nucleo originariamente ebraico (4 Esdra, capitoli 3–14).
      audience: Ebrei che, dopo il 70 d.C., si confrontavano con il problema della teodicea; in seguito l'opera fu ampliata per lettori cristiani.
      date: Nucleo ebraico, 100 d.C. circa; aggiunte cristiane, II–III secolo d.C. circa.
    Didache:
      display_name: Didaché
      author: Anonimo (il titolo significa «Insegnamento dei Dodici Apostoli»).
      audience: 'Prime comunità cristiane: un breve manuale di etica, battesimo, eucaristia e maestri itineranti.'
      date: Tra la fine del I e l'inizio del II secolo d.C. circa.
    Gospel of Thomas:
      display_name: Vangelo di Tommaso
      author: Anonimo; l'incipit attribuisce la raccolta di detti a «Didimo Giuda Tommaso». Il testo completo sopravvive soltanto in una traduzione copta del IV secolo rinvenuta a Nag Hammadi (NHC II,2); esistono inoltre tre frammenti greci provenienti da Ossirinco.
      audience: Lettori cristiani influenzati dalla sapienza siriaca e dal pensiero protognostico, orientati verso una conoscenza esoterica di sé attraverso i detti di Gesù.
      date: Originale greco probabilmente risalente al 50–140 d.C. circa; manoscritto copto del 340 d.C. circa.
      summary: Il Vangelo di Tommaso è una raccolta di detti attribuiti a Gesù. Non presenta una narrazione continua e invita ripetutamente i lettori a scoprire il significato dei detti.
