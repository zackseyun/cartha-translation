  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Vangelo dell'infanzia di Tommaso
      author: Anonimo. La sua più antica forma ricostruibile non indica alcun autore; l'attribuzione a Tommaso appartiene ai titoli e alla trasmissione di manoscritti posteriori.
      audience: Cristiani interessati all'infanzia di Gesù e al modo in cui il potere divino, la disciplina, l'apprendimento e la maturazione potessero essere narrati prima dell'inizio dei racconti dei Vangeli canonici.
      date: Di solito viene fatto risalire al II secolo d.C., ma il testo è conservato in diverse recensioni greche notevolmente differenti e in antiche traduzioni.
    Acts of Paul and Thecla:
      display_name: Atti di Paolo e Tecla
      author: Anonimo. È un episodio dei più ampi Atti di Paolo; un'antica notizia secondo cui un presbitero avrebbe composto gli Atti non consente di identificare con certezza l'autore.
      audience: Cristiani attratti da racconti sulla predicazione apostolica, il celibato, il battesimo, una perseveranza simile a quella dei martiri e l'autorità di una donna nell'insegnare e rendere testimonianza.
      date: Composto nel II secolo d.C., probabilmente nella seconda metà; circolò sia all'interno degli Atti di Paolo sia come opera indipendente.
    Gospel of Peter:
      display_name: Vangelo di Pietro
      author: Anonimo. Il racconto conservato parla con la voce di Pietro ed è stato tramandato sotto il suo nome, ma non è considerato opera dell'apostolo storico.
      audience: Cristiani dei primi secoli interessati a un racconto ampliato della passione e della risurrezione, probabilmente in comunità nelle quali l'autorità di Pietro aveva un'importanza particolare.
      date: Di solito viene datato al II secolo d.C.; il principale frammento greco conservato proviene da un manoscritto molto più tardo rinvenuto ad Akhmim.
    2 Clement:
      display_name: 2 Clemente
      author: Anonimo. Nonostante il titolo tradizionale, si tratta di un'antica omelia cristiana e non di una seconda lettera di Clemente di Roma.
      audience: Un'assemblea cristiana esortata al ravvedimento, alla coerenza morale, alla cura dei vulnerabili e alla perseveranza fedele nella speranza della risurrezione e del giudizio.
      date: Di solito viene datato alla prima metà o alla metà del II secolo d.C. (all'incirca 100–160); il luogo di composizione è incerto.
    Epistle of Barnabas:
      display_name: Lettera di Barnaba
      author: Anonimo. L'opera fu tradizionalmente associata a Barnaba, compagno di Paolo, ma gli studiosi moderni non accettano questa attribuzione.
      audience: Cristiani non ebrei ai quali viene insegnato a fare proprie le Scritture d'Israele mediante un'interpretazione cristologica e allegorica, distinguendo al tempo stesso la propria identità nell'alleanza dalle pratiche ebraiche.
      date: Datata comunemente tra la distruzione del tempio di Gerusalemme nel 70 d.C. e l'inizio del II secolo, spesso intorno all'80–130.
