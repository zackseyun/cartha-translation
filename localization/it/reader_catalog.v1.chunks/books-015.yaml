payload:
  book_metadata:
    1 Esdras:
      display_name: 1 Esdra
      author: Anonimo; rielaborazione greca che riordina 2 Cronache 35–36, Esdra e Neemia 7–8.
      audience: Ebrei del periodo ellenistico che desideravano un racconto lineare del ritorno e della restaurazione.
      date: Circa II–I secolo a.C.
    Prayer of Manasseh:
      display_name: Preghiera di Manasse
      author: Anonimo; attribuito in forma pseudonima al re Manasse.
      audience: Persone penitenti che si riconoscevano nel pentimento di Manasse; usato nella liturgia di alcune tradizioni.
      date: Circa II–I secolo a.C.
    Psalm 151:
      display_name: Salmo 151
      author: Anonimo; attribuito in forma pseudonima a Davide. Una versione ebraica è attestata in 11QPsa.
      audience: Comunità della diaspora e di Qumran devote al salterio di Davide.
      date: Circa II secolo a.C. o prima.
    3 Maccabees:
      display_name: 3 Maccabei
      author: Anonimo; composto in greco.
      audience: Ebrei della diaspora egiziana di lingua greca; un racconto di liberazione ambientato sotto Tolomeo IV.
      date: Circa I secolo a.C.–I secolo d.C.
    4 Maccabees:
      display_name: 4 Maccabei
      author: Anonimo; autore ebreo di lingua greca influenzato dalla filosofia stoica.
      audience: Ebrei ellenistici; un discorso filosofico sul dominio della ragione sulle passioni mediante la fedeltà.
      date: Circa I secolo d.C.
    Bel and the Dragon:
      display_name: Bel e il drago
      author: Anonimo; una delle aggiunte greche a Daniele.
      audience: Ebrei di lingua greca; una polemica derisoria contro l'idolatria.
      date: Circa II–I secolo a.C.
    Letter of Jeremiah:
      display_name: Lettera di Geremia
      author: Anonimo; attribuita in forma pseudonima a Geremia.
      audience: Ebrei della diaspora tentati dall'idolatria circostante.
      date: Circa IV–II secolo a.C.
    Prayer of Azariah and Song of the Three:
      display_name: Preghiera di Azaria e canto dei tre giovani
      author: Anonimo; una delle aggiunte greche a Daniele.
      audience: Ebrei di lingua greca; materiale liturgico per Daniele 3.
      date: Circa II secolo a.C.
    Susanna:
      display_name: Susanna
      author: Anonimo; una delle aggiunte greche a Daniele.
      audience: Ebrei di lingua greca; una storia in cui la giustizia prevale e la falsa testimonianza viene condannata.
      date: Circa II–I secolo a.C.
    1 Clement:
      display_name: Prima lettera di Clemente
      author: Anonimo, attribuito a Clemente di Roma.
      audience: La comunità cristiana di Corinto, coinvolta in una disputa sulla guida della comunità.
      date: Circa 96 d.C.
