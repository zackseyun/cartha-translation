    Thunder, Perfect Mind:
      display_name: Il tuono, mente perfetta
      author: Anonimo.
      audience: Lettori greco-egiziani interessati alla sapienza o allo gnosticismo; poema di autorivelazione al femminile, pronunciato da una figura divina femminile.
      date: Probabilmente tra il I e il II secolo d.C.; conservato a Nag Hammadi (NHC VI,2).
    Testament of Reuben:
      display_name: Testamento di Ruben
      author: Anonimo; fa parte dei Testamenti dei dodici patriarchi, presentati come i discorsi sul letto di morte dei figli di Giacobbe.
      audience: Lettori ebrei (e, in seguito, cristiani) che apprendono insegnamenti etici dalle confessioni dei patriarchi.
      date: Nucleo ebraico precristiano risalente probabilmente al II secolo a.C.; redazione cristiana del I–II secolo d.C.
    Testament of Simeon:
      display_name: Testamento di Simeone
      author: Anonimo; fa parte dei Testamenti dei dodici patriarchi.
      audience: Lettori ebrei (e, in seguito, cristiani).
      date: Nucleo ebraico risalente probabilmente al II secolo a.C.; redazione cristiana del I–II secolo d.C.
    Testament of Levi:
      display_name: Testamento di Levi
      author: Anonimo; fa parte dei Testamenti dei dodici patriarchi.
      audience: Lettori ebrei (e, in seguito, cristiani), in particolare comunità interessate al sacerdozio.
      date: Nucleo ebraico risalente probabilmente al II secolo a.C.; redazione cristiana del I–II secolo d.C.
    Testament of Judah:
