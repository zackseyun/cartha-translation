review:
  verdict: revise
  review_summary: Corretto il riferimento ai nomi canonici di Is-Boset e Mefiboset e resa più precisa la fuga di Davide presso Achimelec; il resto del catalogo è fedele alla fonte inglese.
  issues:
  - '2 Samuel 4, 9 e 16 usavano le varianti Is-Baal/Merib-Baal anziché i nomi presenti nella fonte: Ish-bosheth/Mephibosheth.'
  - 1 Samuel 21 rendeva ambiguamente «flees to» come fuga dal sacerdote anziché rifugio presso Achimelec.
  - Judges 7 è stato reso letteralmente secondo la fonte («alone»), senza introdurre il dettaglio dei pochi uomini.
