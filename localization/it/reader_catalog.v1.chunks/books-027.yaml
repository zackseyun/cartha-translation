payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: Policarpo ai Filippesi
      author: Policarpo, vescovo di Smirne. Alcuni studiosi ritengono che il testo giunto fino a noi riunisca materiale inviato in più di un'occasione.
      audience: La comunità cristiana di Filippi, che aveva richiesto le lettere di Ignazio e ricevette consigli sulla fede, sulla condotta, sulla guida della comunità, sul denaro e sulla perseveranza.
      date: Dall'inizio alla metà del II secolo d.C.; almeno una parte è strettamente legata al viaggio di Ignazio, mentre le ipotesi di una lettera composita ammettono una sezione un po' più tarda.
    Martyrdom of Polycarp:
      display_name: Martirio di Policarpo
      author: Membri anonimi della chiesa di Smirne, che scrivono a nome della comunità; le note conclusive sulla trasmissione riflettono successive attività di copiatura e circolazione.
      audience: La chiesa di Filomelio e la più ampia comunione cristiana, alle quali viene offerto un racconto dell'arresto, del processo, della morte e dell'esemplare perseveranza di Policarpo.
      date: Scritto dopo la morte di Policarpo, viene generalmente collocato verso la metà o nella seconda metà del II secolo d.C.; sono oggetto di dibattito sia l'anno esatto del martirio sia la forma definitiva del documento.
    Epistle to Diognetus:
      display_name: Lettera a Diogneto
      author: Anonimo. L'autore si definisce discepolo o persona desiderosa di apprendere, ma né lui né il destinatario Diogneto possono essere identificati con certezza.
      audience: Un interlocutore colto non cristiano — e lettori simili a lui — che pone domande sul culto cristiano, sull'etica, sull'identità sociale, sull'amore e sull'apparente novità della fede.
      date: Spesso datata alla fine del II o all'inizio del III secolo d.C., sebbene le proposte varino ampiamente; gli ultimi due capitoli potrebbero provenire da un'opera diversa.
    Fragments of Papias:
      display_name: Frammenti di Papia
      author: Papia, vescovo di Ierapoli, per le perdute Spiegazioni dei detti del Signore in cinque libri; la raccolta superstite è composta da citazioni e testimonianze conservate da autori successivi.
      audience: I primi cristiani interessati agli insegnamenti tramandati su Gesù e sugli apostoli, raccolti attraverso catene dichiarate di testimonianza orale e interpretazione.
      date: L'opera di Papia viene generalmente datata all'inizio del II secolo d.C., spesso intorno al 110–130; i frammenti superstiti compaiono in autori che scrissero dal II secolo in poi.
