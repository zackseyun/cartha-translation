payload:
  book_metadata:
    Joel:
      display_name: Gioele
      author: Gioele, figlio di Petuel.
      audience: Giuda nel periodo successivo all'esilio, chiamato a rispondere a una piaga di locuste come segno del Giorno del SIGNORE.
      date: Probabilmente intorno al V–IV secolo a.C.
    Amos:
      display_name: Amos
      author: Amos di Tekoa, un pastore della Giudea che predicò nel regno del nord.
      audience: Il regno d'Israele durante un periodo di prosperità e ingiustizia sotto Geroboamo II.
      date: Circa 760–750 a.C.
    Obadiah:
      display_name: Abdia
      author: Abdia.
      audience: 'Il regno di Giuda dopo il tradimento di Gerusalemme da parte di Edom: una profezia sulla caduta di Edom.'
      date: Poco dopo il 586 a.C.
    Jonah:
      display_name: Giona
      author: Anonimo; il protagonista è Giona, figlio di Amittai.
      audience: 'L''Israele del periodo successivo all''esilio: un rimprovero satirico alla chiusura etnica e un''affermazione della misericordia di Dio verso gli stranieri.'
      date: Probabilmente intorno al V–IV secolo a.C.
    Micah:
      display_name: Michea
      author: Michea di Moreset.
      audience: Il regno di Giuda alla fine dell'VIII secolo a.C., in particolare i poveri delle campagne oppressi dalle élite urbane.
      date: Circa 740–700 a.C.
    Nahum:
      display_name: Naum
      author: Naum di Elcos.
      audience: Il regno di Giuda, che celebra l'imminente caduta di Ninive.
      date: Poco prima del 612 a.C.
    Habakkuk:
      display_name: Abacuc
      author: Abacuc.
      audience: 'Il regno di Giuda di fronte all''ascesa di Babilonia: il dialogo di un profeta con Dio sulla giustizia.'
      date: Verso la fine del VII secolo a.C.
    Zephaniah:
      display_name: Sofonia
      author: Sofonia, figlio di Cusi.
      audience: Il regno di Giuda sotto Giosia, alla vigilia delle sue riforme.
      date: Circa 640–609 a.C.
    Haggai:
      display_name: Aggeo
      author: Aggeo.
      audience: I rimpatriati che ricostruiscono il tempio sotto Dario.
      date: 520 a.C.
    Zechariah:
      display_name: Zaccaria
      author: Zaccaria, figlio di Berechia; i capitoli 9–14 provengono probabilmente da un autore successivo.
      audience: I rimpatriati che ricostruiscono il tempio e le successive comunità del periodo post-esilico.
      date: 'Capitoli 1–8: circa 520–518 a.C.; 9–14: forse un secolo dopo.'
    Malachi:
      display_name: Malachia
      author: Anonimo; «Malachia» significa «il mio messaggero».
      audience: Il regno di Giuda dopo l'esilio, divenuto negligente nel culto e nella fedeltà sotto il dominio persiano.
      date: Circa la metà del V secolo a.C.
    Matthew:
      display_name: Matteo
      author: Anonimo; la tradizione lo attribuisce all'apostolo Matteo. Gli studiosi moderni ritengono che l'autore fosse un giudeo-cristiano di lingua greca, che attinse a Marco e a una fonte simile a Q.
      audience: Una comunità giudeo-cristiana alle prese con gli elementi di continuità e discontinuità rispetto al giudaismo delle sinagoghe.
      date: Circa 80–90 d.C.
    Mark:
      display_name: Marco
      author: Anonimo; la tradizione lo collega a Giovanni Marco, compagno di viaggio di Pietro.
      audience: Una comunità cristiana di lingua greca, forse a Roma, esposta alla persecuzione o alla sua minaccia.
      date: Circa 65–75 d.C., nel periodo della guerra giudaica e della distruzione del tempio.
