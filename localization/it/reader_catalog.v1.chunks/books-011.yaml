      display_name: Luca
      author: Anonimo; la tradizione lo attribuisce a Luca, compagno di viaggio di Paolo.
      audience: Lettori cristiani colti del mondo greco-romano, indirizzati a «Teofilo».
      date: 80–90 d.C. circa.
    John:
      display_name: Giovanni
      author: Anonimo; la tradizione lo attribuisce all'apostolo Giovanni o al «discepolo amato».
      audience: Una comunità cristiana in tensione con il giudaismo delle sinagoghe, formatasi attorno alla testimonianza del discepolo amato.
      date: 90–110 d.C. circa.
      summary: Giovanni presenta Gesù come la Parola eterna che rivela il Padre, dona la vita attraverso la fiducia in lui ed è glorificato attraverso i suoi segni, la sua morte e la sua risurrezione.
