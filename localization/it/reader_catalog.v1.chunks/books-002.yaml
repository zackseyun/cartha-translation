      author: Anonimo; tradizionalmente attribuito a Mosè.
      audience: 'Israele in cammino tra l''Egitto e la terra promessa: la generazione del deserto e i lettori successivi chiamati a imparare dai suoi fallimenti.'
      date: Strati compositivi risalenti dal tardo periodo monarchico al periodo postesilico (ca. VII-V secolo a.C.).
    Deuteronomy:
      display_name: Deuteronomio
      author: Anonimo; presentato come i discorsi d'addio di Mosè. La ricerca moderna colloca un nucleo nella riforma della fine del VII secolo a.C. sotto Giosia.
      audience: Israele che si prepara a entrare nella terra e, in seguito, gli esuli che si chiedono come vivere fedelmente senza tempio né re.
      date: Nucleo risalente circa alla fine del VII secolo a.C.; raggiunse la forma definitiva nel periodo esilico.
