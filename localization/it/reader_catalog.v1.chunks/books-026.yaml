review:
  verdict: revise
  review_summary: Traduzione completa e in gran parte fedele; corretti alcuni titoli per aderire più strettamente alla formulazione inglese canonica, evitando aggiunte interpretative e preservando i nomi propri della fonte.
  issues:
  - 'Titolo 17: rimosso l''oggetto aggiunto «il regno», assente dalla fonte.'
  - 'Titolo 20: eliminata l''interpretazione aggiuntiva «i poteri» e resa la sequenza canonica in modo neutro.'
  - 'Titolo 75: ripristinato il nome canonico «Rhaius», non reso come «Reo».'
  - 'Titolo 79: resa più fedele di «remained embodied».'
  - Alcune formulazioni minori sono state rese più aderenti al significato della fonte.
