      author: Ignazio, vescovo di Antiochia, per le sette lettere della recensione media comunemente accettata; le lettere ignaziane più tarde, ampliate o pseudonime, non fanno parte di questa raccolta.
      audience: Le comunità cristiane di Efeso, Magnesia, Tralli, Roma, Filadelfia e Smirne, insieme a Policarpo, destinatarie delle lettere scritte durante il viaggio di Ignazio verso il martirio.
      date: Generalmente datate all'inizio del II secolo d.C., spesso intorno al 105–117, sebbene la cronologia precisa del viaggio di Ignazio sia ancora dibattuta.
