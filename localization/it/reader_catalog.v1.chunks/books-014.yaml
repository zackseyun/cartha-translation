  book_metadata:
    Sirach:
      display_name: Siracide
      author: Yeshua ben Eleazar ben Sira di Gerusalemme; traduzione greca a opera di suo nipote.
      audience: Giovani ebrei istruiti nella sapienza nella Gerusalemme del periodo ellenistico.
      date: Originale ebraico, 195–175 a.C. circa; traduzione greca, 132 a.C. circa.
    Baruch:
      display_name: Baruc
      author: Anonimo; attribuito sotto pseudonimo a Baruc, scriba di Geremia.
      audience: Ebrei della diaspora che riflettevano sull'esilio, sul pentimento e sulla sapienza.
      date: II secolo a.C. circa.
    1 Maccabees:
      display_name: 1 Maccabei
      author: Anonimo, probabilmente un autore di Gerusalemme che scriveva in ebraico (si è conservato soltanto il testo greco).
      audience: Ebrei durante e dopo la rivolta asmonea; l'opera narra la legittimità della dinastia asmonea.
      date: 100 a.C. circa.
    2 Maccabees:
      display_name: 2 Maccabei
      author: Un anonimo autore del compendio di un'opera più ampia di Giasone di Cirene; composto in greco.
      audience: Ebrei di lingua greca della diaspora, con particolare attenzione al martirio, alla provvidenza e alla risurrezione.
      date: 124 a.C. circa o poco dopo.
