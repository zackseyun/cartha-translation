  review_summary: 'Corretto un falso amico nel titolo Apocryphon of John 4: “Forethought” è reso con “Provvidenza”, non “prescienza”. Tutti i campi richiesti sono completi; le altre rese sono fedeli al testo canonico.'
  issues:
  - 'Apocryphon of John 4: «Divine Forethought» era tradotto impropriamente come «prescienza divina» (foreknowledge); corretto in «Provvidenza divina».'
  - 'Gospel of Mary 1: resa resa più letterale di «Teaches Against Sin», da «insegna a vincere il peccato» a «insegna contro il peccato».'
