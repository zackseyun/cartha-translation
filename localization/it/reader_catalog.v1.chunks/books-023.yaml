  book_metadata:
    Gospel of Mary:
      display_name: Vangelo di Maria
      author: Anonimo. L'opera presenta Maria come destinataria e interprete di una rivelazione di Gesù, ma non afferma che sia stata Maria a scrivere il vangelo giunto fino a noi.
      audience: Lettori cristiani delle origini alle prese con la rivelazione, l'ascesa spirituale, l'autorità apostolica e la legittimità dell'insegnamento di Maria tra i discepoli di Gesù.
      date: Di solito datato al II secolo d.C.; ne sopravvivono frammenti greci del III secolo, mentre il principale testimone copto è conservato nel Codice di Berlino 8502, del V secolo.
    Treatise on the Resurrection:
      display_name: Trattato sulla risurrezione
      author: Anonimo. L'opera si presenta come la lettera di un maestro a un discepolo di nome Regino; né il maestro né Regino possono essere identificati con certezza.
      audience: Cristiani in cerca di un insegnamento sulla risurrezione, in particolare lettori che riflettevano sulle sue dimensioni corporea e spirituale e sulla partecipazione già presente alla vita risorta.
      date: Di solito collocato alla fine del II secolo d.C. (spesso intorno al 170–200); è conservato in una copia copta del IV secolo di un'opera greca più antica.
    Dialogue of the Savior:
      display_name: Dialogo del Salvatore
      author: Anonimo. Il dialogo pone insegnamenti rivelatori sulle labbra di Gesù durante una conversazione con Giuda, Matteo e Maria, ma non identifica chi lo abbia compilato.
      audience: Un gruppo cristiano delle origini interessato alla rivelazione privata, al discepolato, alla conoscenza di sé, alla preghiera e alla preparazione ascetica alla salvezza.
      date: Comunemente attribuito al II secolo d.C., benché i suoi strati compositivi e la data esatta rimangano discussi; è conservato in un manoscritto copto del IV secolo.
    Exegesis on the Soul:
      display_name: Esegesi sull'anima
      author: Anonimo. L'autore è un predicatore cristiano che rilegge immagini bibliche e della letteratura greca come allegoria della caduta, del pentimento e della restaurazione dell'anima.
      audience: Cristiani che conoscevano le Scritture e l'esortazione morale e che venivano richiamati dal desiderio disordinato al pentimento e al ricongiungimento con il divino.
      date: Generalmente datata tra la fine del II e l'inizio del III secolo d.C.; è conservata in una traduzione copta dal greco del IV secolo.
    Book of Thomas the Contender:
      display_name: Libro di Tommaso l'Atleta
      author: Anonimo. Il titolo finale associa l'opera a Giuda Tommaso e nomina Mattia come trascrittore, ma si tratta di attribuzioni letterarie, non di indicazioni di paternità verificabili.
      audience: Cristiani di orientamento ascetico, esortati a cercare la conoscenza di sé, a resistere alle passioni del corpo e a comprendere l'insegnamento privato di Gesù a Tommaso.
      date: Spesso datato tra la fine del II e l'inizio del III secolo d.C., forse in un ambiente cristiano siriaco; è conservato in un manoscritto copto del IV secolo.
    Tripartite Tractate:
      display_name: Trattato tripartito
      author: Anonimo. L'autore era un teologo cristiano valentiniano di grande cultura; non è possibile identificarlo con certezza con alcun maestro conosciuto per nome.
      audience: Una comunità cristiana valentiniana che riceveva un insegnamento approfondito su Dio, gli eoni, la creazione, Cristo, la chiesa, la salvezza e la restaurazione finale.
      date: Di solito datato al III secolo d.C., anche se alcune argomentazioni propendono per la seconda metà del secolo; è conservato in copto nel Codice Jung del IV secolo.
    Apocryphon of John:
      display_name: Apocrifo di Giovanni
      author: Anonimo. L'opera presenta sotto pseudonimo una rivelazione di Gesù risorto a Giovanni, figlio di Zebedeo, ed è giunta fino a noi in più di una recensione antica.
      audience: Cristiani appartenenti a una tradizione rivelatoria sethiana o affine, alla ricerca di un racconto sul regno divino, sulla creazione, sull'identità umana e sulla liberazione dai governanti ostili.
      date: Una forma antica circolava probabilmente nel II secolo d.C.; i testimoni copti conservati, che tramandano recensioni più brevi e più lunghe, risalgono al IV e al V secolo.
