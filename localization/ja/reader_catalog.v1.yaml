  Genesis:
    display_name: 創世記
    author: 著者不詳。伝統的にはモーセの作とされてきた。現代の研究では、長い成立過程を経て、複数の資料が後代に編集されて一つになったと考えられている。
    audience: 契約によって自らの民としてのアイデンティティーを持つイスラエル。民の起源の物語を、神による創造、選び、約束に結びつけている。
    date: 数世紀にわたって成立し、バビロン捕囚期またはその後の紀元前6～5世紀ごろに、現在伝わる形になった。
    summary: 創世記は、天地創造、人類の反逆と離散、そしてアブラハム、イサク、ヤコブ、ヨセフの一族について語る。この一族を通して、イスラエルに対する神の契約の約束が始まる。
    chapters:
      '1':
        title: 神が天と地を造る
      '2':
        title: 神が男と女を形造る
      '3':
        title: 人類がエデンから堕落する
      '4':
        title: カインが弟アベルを殺す
      '5':
        title: アダムからノアまでの系図
      '6':
        title: 神が洪水によって罪を裁く
      '7':
        title: 洪水が地を覆う
      '8':
        title: ノアが箱舟を出て神を礼拝する
      '9':
        title: 洪水後のノアの家族
      '10':
        title: ノアの子孫が各地に広がる
      '11':
        title: 塔で言葉が乱され、人々が散らされる
      '12':
        title: アブラムが従い、カナンへ旅立つ
      '13':
        title: 富を得たアブラムが戻り、祈る
      '14':
        title: アブラムが侵略者からロトを救う
      '15':
        title: 神がアブラムに子孫を約束する
      '16':
        title: ハガルが荒野の泉へ逃げる
      '17':
        title: アブラハムが割礼を受け、神が契約を新たにする
      '18':
        title: 神がアブラハムに息子を約束する
      '19':
        title: ロトが火に包まれる町々から逃れる
      '20':
        title: 警告を受けたアビメレクがサラを返す
      '21':
        title: サラがアブラハムにイサクを産む
      '22':
        title: アブラハムがモリヤでイサクをささげる
      '23':
        title: サラが死に、アブラハムが買い取る
      '24':
        title: しもべがイサクのためにリベカを見つける
      '25':
        title: アブラハムの子孫と死が記される
      '26':
        title: イサクがゲラルにとどまり、守られる
      '27':
        title: ヤコブがイサクを欺いて祝福を得る
      '28':
        title: ヤコブが天使の上り下りする階段を夢に見る
      '29':
        title: ヤコブがラケルを愛し、レアと結ばれる
      '30':
        title: ヤコブが憐れみによって栄える
      '31':
        title: ヤコブがラバンの怒りを恐れる
      '32':
        title: ヤコブが神の使いと格闘する
      '33':
        title: ヤコブがエサウと穏やかに再会する
      '34':
        title: シェケムがディナを乱暴する
      '35':
        title: ヤコブがベテルの祭壇へ戻る
      '36':
        title: セイルの地に住むエサウの子孫
      '37':
        title: ヨセフが兄たちに安く売られる
      '38':
        title: タマルが密かにユダの子を産む
      '39':
        title: ヨセフがポティファルの家で栄える
      '40':
        title: ファラオの家臣たちが夢を見て恐れる
      '41':
        title: ヨセフがファラオの夢を解き明かす
      '42':
        title: ヤコブが息子たちを穀物の買い出しに送る
      '43':
        title: ベニヤミンが兄たちとエジプトへ行く
      '44':
        title: ユダがベニヤミンの命を救おうと嘆願する
      '45':
        title: ヨセフが兄弟たちと再会する
      '46':
        title: イスラエルが無事にゴシェンへ移る
      '47':
        title: ヨセフが家族を養う
      '48':
        title: ヤコブが知恵をもってヨセフの息子たちを祝福する
      '49':
        title: ヤコブが息子たちの将来を預言する
      '50':
        title: ヨセフがヤコブの最後の願いをかなえる
  Exodus:
    display_name: 出エジプト記
    author: 著者不詳。伝統的にはモーセの作とされてきた。現代の研究では、長い成立過程を経て、複数の資料が後代に編集されて一つになったと考えられている。
    audience: 解放されて神と契約を結んだ民イスラエル。神の律法のもとで主の国民として生きることの意味を学ぶ。
    date: 数世紀にわたって成立し、紀元前6～5世紀ごろに現在伝わる形になった。
    chapters:
      '1':
        title: 神がイスラエルの増加を助ける
      '2':
        title: モーセがファラオの手から救われる
      '3':
        title: モーセが神の召しを聞く
      '4':
        title: モーセが神の力に直面する
      '5':
        title: ファラオが心をかたくなにする
      '6':
        title: 主が救い出すと約束する
      '7':
