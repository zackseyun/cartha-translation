  Martyrdom of Polycarp:
    display_name: ポリュカルポスの殉教
    author: スミルナの教会に属する匿名の人々が、共同体の名で執筆しました。末尾の伝承に関する注記には、後代の筆写と流布の過程が反映されています。
    audience: フィロメリオンの教会と、より広いキリスト者の交わり。ポリュカルポスの逮捕、裁判、死、そして模範的な忍耐についての記録として届けられました。
    date: ポリュカルポスの死後に書かれ、通常は紀元2世紀半ばまたは後半のものとされます。ただし、殉教の正確な年も、文書が最終的な形になった時期も議論が続いています。
