      '31':
        title: 神が幕屋を造る職人たちを選ぶ
      '32':
        title: モーセが怒って石の板を砕く
      '33':
        title: モーセが神の栄光を求める
      '34':
        title: モーセが新しい石の板を受け取る
      '35':
        title: モーセがイスラエルを集め、命令を伝える
      '36':
        title: 職人たちが命じられたとおりに聖所を造る
      '37':
        title: ベツァルエルが聖なる備品を精密に作る
      '38':
        title: 青銅の祭壇と洗盤が作られる
      '39':
        title: 聖なる奉仕のためのアロンの祭服
      '40':
        title: モーセが幕屋を設営する
  Leviticus:
    display_name: レビ記
    author: 著者不詳。伝統的にはモーセの作とされてきた。現代の研究では、祭司資料に属すると考えられている。
    audience: イスラエルの祭司たちと礼拝共同体。いけにえ、聖なる生活、神の臨在を中心とする生活の秩序について教える。
    date: 王国時代末期から捕囚後の時代（紀元前7～5世紀ごろ）にかけて成立した、複数の層から成る。
    chapters:
      '1':
        title: 主に喜ばれる全焼のささげ物
      '2':
        title: 主の前で焼かれる穀物のささげ物
      '3':
        title: 祭壇に供える和解のいけにえ
      '4':
        title: 祭司と民の罪
      '5':
        title: 罪を告白し、ささげ物を携える
      '6':
        title: 祭司たちがささげ物を慎重に扱う
      '7':
        title: 罪過のささげ物と和解のいけにえについての規定
      '8':
