  Polycarp to the Philippians:
    display_name: ポリュカルポスのフィリピの信徒への手紙
    author: スミルナの監督ポリュカルポス。一部の研究者は、現存する本文を、複数の時点で送られた資料を組み合わせたものと見ています。
    audience: フィリピのキリスト者の集会。彼らはイグナティオスの手紙を求め、信仰、行い、指導者、金銭、忍耐についての助言を受けました。
    date: 紀元2世紀初頭から半ば。少なくとも一部はイグナティオスの旅と密接に関係していますが、複数の手紙を合成したものだとする説では、やや後の時期に書かれた部分がある可能性も認められています。
