  Exegesis on the Soul:
    display_name: 魂の解釈
    author: 著者不明。著者はキリスト教の説教者であり、聖書とギリシア文学のイメージを、魂の堕落、悔い改め、回復を表す寓意として読み直している。
    audience: 聖書と道徳的な勧めに親しみ、秩序を失った欲望を離れて悔い改め、神との結びつきを回復するよう呼びかけられていたキリスト教徒。
    date: 一般に紀元2世紀後半から3世紀初頭の成立とされる。ギリシア語から翻訳された4世紀のコプト語写本に保存されている。
