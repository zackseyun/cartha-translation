        title: 神、難船の中でパウロを守る
      '28':
        title: 福音、ローマに到着する
  Romans:
    display_name: ローマ人への手紙
    author: パウロ。書記はテルティオ。
    audience: ローマのキリスト教徒。律法と自らのアイデンティティをめぐって緊張関係にあった、ユダヤ人と異邦人の信徒たち。
    date: 紀元56～58年ごろ、コリントで執筆。
    chapters:
      '1':
        title: パウロ、イエスがもたらす義を宣べ伝える
      '2':
        title: 裁きは分け隔てなく下される
      '3':
        title: すべての人が罪に定められている
      '4':
        title: アブラハム、信仰だけによって義と認められる
      '5':
        title: キリストの死による義
      '6':
        title: 罪ではなく神に生きる
      '7':
        title: 信徒たち、罪と葛藤する
      '8':
        title: 何ものも私たちをキリストから引き離せない
      '9':
        title: イスラエルへの憐れみと怒り
      '10':
        title: すべての人の近くにある救い
      '11':
        title: 異邦人も恵みによって招かれる
      '12':
        title: 自分の人生を生きた供え物として献げる
      '13':
        title: 権威に従い、愛に生きる
      '14':
        title: 信仰の弱い人を受け入れる
      '15':
        title: ユダヤ人と異邦人が一つになる
      '16':
        title: あいさつと警告
  1 Corinthians:
    display_name: コリントの信徒への手紙一
    author: パウロ。ソステネも名を連ねている。
    audience: 対立の絶えないコリントのキリスト者共同体。
    date: 紀元53～55年頃、エフェソで執筆。
    chapters:
      '1':
        title: すべての人に注がれる神の豊かな恵み
      '2':
        title: 神の霊が明らかにする知恵
      '3':
        title: パウロがコリントの神殿について警告する
      '4':
        title: 誇りよりも忠実さが大切
      '5':
        title: パウロが教会の規律を守るよう命じる
      '6':
        title: 争いは教会の中で解決する
      '7':
        title: パウロが結婚を尊ぶよう教える
      '8':
        title: 愛は自分の自由に優先する
      '9':
        title: パウロが使徒としての権利と自由を語る
      '10':
        title: 神の民に向けられたイスラエルの警告
      '11':
        title: 礼拝での一致によってキリストを敬う
      '12':
        title: 霊の賜物が教会の一致を築く
      '13':
        title: 愛は決してあきらめない
      '14':
        title: 人の目を引くことより愛を求める
      '15':
        title: キリストは復活し、死は敗れる
      '16':
        title: 献金と旅の計画
  2 Corinthians:
    display_name: コリントの信徒への手紙二
    author: パウロ。テモテも名を連ねている。
    audience: つらい対立を経験した後のコリントの共同体。
    date: 紀元55～56年頃。
    chapters:
      '1':
        title: 苦しみの中で与えられる神の慰め
      '2':
        title: 愛と赦しを勧める
      '3':
        title: 変えられた人生が証しする働き
      '4':
        title: キリストの栄光を告げ知らせる
      '5':
        title: キリストの愛が働きへと駆り立てる
      '6':
        title: 神のために苦しみに耐える
      '7':
        title: 神を畏れ、聖さを追い求める
      '8':
        title: マケドニアの人々への恵みが献げる心を促す
      '9':
        title: 聖なる者たちのために喜んで献げる
      '10':
        title: キリストの柔和さをもって訴える
      '11':
        title: 忠実に生きることへのねたみ
      '12':
        title: 弱さと恵みを誇る
      '13':
        title: 罪がないか自分を吟味する
  Galatians:
    display_name: ガラテヤの信徒への手紙
    author: パウロ。
    audience: 割礼を受けて律法を守るよう圧力を受けていた、ガラテヤ（アナトリア中央部）のキリスト者共同体。
    date: 紀元48～55年頃（議論がある）。
    chapters:
      '1':
        title: パウロが自分の福音を弁明する
      '2':
        title: パウロがペトロの誤りをただす
      '3':
        title: アブラハムの信仰が義とする
      '4':
        title: キリストが私たちを律法から解放する
      '5':
        title: 律法ではなく信仰によって生きる
      '6':
        title: 互いの重荷を担う
  Ephesians:
    display_name: エフェソの信徒への手紙
    author: パウロ、またはパウロの名で書いた近しい弟子（議論がある）。
    audience: 小アジアのキリスト者一般。最古の写本には「エフェソ」という地名がない。
    date: パウロ本人の著作なら紀元60年代頃、別人がパウロの名で書いたものなら紀元80～90年代頃。
    chapters:
      '1':
        title: 信じる者に証印を押す神の恵み
      '2':
        title: キリストがすべての人に平和をもたらす
      '3':
        title: 福音によって明らかにされた秘められた計画
      '4':
        title: キリストの体の一致を願う
      '5':
        title: 神にならい、賢く歩む
      '6':
        title: 子どもは両親に従い、敬う
  Philippians:
    display_name: フィリピの信徒への手紙
    author: パウロ。テモテも名を連ねている。
    audience: マケドニアにあるローマの植民都市フィリピのキリスト者共同体。
    date: 紀元60～62年頃、獄中で執筆。
    chapters:
      '1':
        title: パウロがフィリピの人々のために祈る
      '2':
        title: へりくだり、高く上げられたイエス
      '3':
        title: キリストを知ることを喜ぶ
      '4':
        title: 喜びをもって固く立つ
  Colossians:
    display_name: コロサイの信徒への手紙
    author: パウロ。テモテも名を連ねている。あるいは、パウロの名で書いた近しい弟子（議論がある）。
    audience: リュコス渓谷のコロサイに住み、諸思想を混ぜ合わせた教えに直面していたキリスト者たち。
    date: パウロ本人の著作なら紀元60～62年頃、別人がパウロの名で書いたものならそれより後。
    chapters:
      '1':
        title: パウロがコロサイの人々の信仰のために祈る
      '2':
        title: キリストに結ばれて歩むよう励ます
      '3':
        title: 罪を離れ、愛に生きる
      '4':
        title: 鎖につながれたパウロの祈りと励まし
  1 Thessalonians:
    display_name: テサロニケの信徒への手紙一
    author: パウロ。シルワノとテモテも名を連ねている。
    audience: 迫害に直面していた、テサロニケの若いキリスト者共同体。
    date: 紀元50～51年頃。現存するパウロ書簡の中で最も古い可能性が高い。
    chapters:
      '1':
        title: 恵み、平和、信仰、愛、希望
      '2':
        title: 純粋な動機で大胆に語る
      '3':
        title: 苦しみの中でテモテが励ます
      '4':
        title: 聖く生きるようパウロが励ます
      '5':
        title: 目を覚まし、救いを待ち望む
  2 Thessalonians:
    display_name: テサロニケの信徒への手紙二
    author: パウロ（議論があり、別人がパウロの名で書いたと考える研究者もいる）。
    audience: 終末について混乱していたテサロニケの共同体。
    date: パウロ本人の著作なら紀元51年頃。
    chapters:
      '1':
        title: 迫害に耐え、忠実に歩む人に神が報いる
      '2':
        title: キリストが来られる前に反逆が起こる
      '3':
        title: パウロが教会の成長を祈る
  1 Timothy:
    display_name: テモテへの手紙一
    author: パウロ、またはパウロの名で書いた弟子（牧会書簡は別人がパウロの名で書いたものだと広く考えられている）。
    audience: エフェソにおけるパウロの代理者テモテ。後代の教会運営のための手引きでもある。
    date: パウロ本人の著作なら紀元60年代半ば頃、別人がパウロの名で書いたものなら紀元90～110年頃。
    chapters:
      '1':
        title: パウロがテモテにそこにとどまるよう勧める
      '2':
        title: 為政者のために祈り、平穏に暮らす
      '3':
        title: 教会指導者に求められる資質
      '4':
        title: 偽りの教師と作り話を退ける
      '5':
        title: やもめと長老を忠実に敬う
      '6':
        title: 富についてテモテに助言する
  2 Timothy:
    display_name: テモテへの手紙二
    author: パウロ、またはパウロの名で書いた弟子。
    audience: テモテ。獄中のパウロによる別れの言葉という形で書かれている。
    date: パウロ本人の著作なら紀元60年代半ば頃、別人がパウロの名で書いたものなら紀元90～110年頃。
    chapters:
      '1':
        title: テモテよ、恵みによって固く立て
      '2':
        title: キリストのために苦しみに耐える
      '3':
        title: 偽りの教師を避けるよう警告する
      '4':
        title: すべての人に忠実に宣べ伝える
  Titus:
    display_name: テトスへの手紙
    author: パウロ、またはパウロの名で書いた弟子。
    audience: クレタ島におけるパウロの代理者テトス。
    date: パウロ本人の著作なら紀元60年代半ば頃、別人がパウロの名で書いたものなら紀元90～110年頃。
    chapters:
      '1':
        title: パウロがクレタ島のテトスに指示する
      '2':
        title: あらゆる年代の人に恵みにふさわしい生き方を教える
      '3':
        title: キリストを待ち望み、謙虚に生きる
  Philemon:
    display_name: フィレモンへの手紙
    author: パウロ。テモテも名を連ねている。
    audience: キリスト者で奴隷所有者でもあったフィレモン。逃亡した奴隷オネシモについて書かれている。
    date: 紀元60～62年頃。
    chapters:
      '1':
        title: オネシモの自由を願うパウロ
  Hebrews:
    display_name: ヘブライ人への手紙
    author: 不詳。伝承ではパウロ、アポロ、バルナバ、プリスキラなどの名が挙げられてきたが、どの説にも合意はない。
    audience: キリストへの信仰告白から離れ、以前のあり方に戻りかけていた、ギリシア語を話すユダヤ人キリスト者。
    date: 紀元60～95年頃。
    chapters:
      '1':
        title: 神が御子を通して語る
      '2':
        title: イエスが苦しみを通して救う
      '3':
        title: 忠実なイエスを見つめる
      '4':
        title: 神が約束した安息に入る
      '5':
        title: キリストが完全な供え物を献げる
      '6':
        title: 霊的な成熟を目指して進む
      '7':
        title: イエスはメルキゼデクに等しい永遠の祭司
      '8':
        title: イエスの血による新しい契約
      '9':
        title: イエスが天にある真の聖所に入る
      '10':
        title: キリストの血によって神に近づく
      '11':
        title: 先祖たちの信仰は揺るがない
      '12':
        title: イエスと共に苦難に耐える
      '13':
        title: 愛と信頼に生きる
  James:
    display_name: ヤコブの手紙
    author: 伝統的にはイエスの兄弟ヤコブとされる。現代の研究では、本人による著作とする見解と、名を借りた著作とする見解に分かれている。
    audience: 離散の地にあるユダヤ人キリスト者の諸集会。
    date: 本人による著作なら紀元50～60年代ごろ、名を借りた著作なら紀元1世紀末ごろ。
    chapters:
      '1':
        title: 試練に鍛えられた信仰は耐え抜く
      '2':
        title: 行いのない信仰は死んでいる
      '3':
        title: 舌を制し、知恵をもって語る
      '4':
        title: 争いは利己心から生じる
      '5':
        title: 人を虐げる富裕者に裁きが迫る
  1 Peter:
    display_name: ペトロの手紙一
    author: 伝統的には、シルワノが筆記を務めた使徒ペトロの著作とされる。一部の研究者は、ペトロの名を借りた著作と見ている。
    audience: 社会的な敵意にさらされていた、ローマ領小アジアのキリスト者。
    date: ペトロによる著作なら紀元60年代ごろ、名を借りた著作なら紀元70～90年代ごろ。
    chapters:
      '1':
        title: 天に蓄えられた相続への希望
      '2':
        title: 信じる者は生ける石の上に建てられる
      '3':
        title: 妻たちは生き方によってキリストを敬う
      '4':
        title: 善を行って苦しむ
      '5':
        title: 長老たちは信仰の模範を示して世話をする
  2 Peter:
    display_name: ペトロの手紙二
    author: 伝統的にはペトロとされるが、現代の研究ではペトロの名を借りた著作と広く考えられている。
    audience: キリストの再臨を否定してあざける者たちに直面していたキリスト者。
    date: 紀元2世紀初めごろ。
    chapters:
      '1':
        title: ペトロが教える霊的な成長
      '2':
        title: 偽りの教師たちに速やかな裁きが下る
      '3':
        title: ペトロが最後の裁きを警告する
  1 John:
    display_name: ヨハネの手紙一
    author: 著者不詳。伝統的には使徒ヨハネ、またはヨハネ系共同体の長老とされる。
    audience: 分裂を経験した後、誰が共同体に属するのかを明らかにしようとしていたヨハネ系共同体。
    date: 紀元90～110年ごろ。
    chapters:
      '1':
        title: 光が真の交わりを明らかにする
      '2':
        title: 愛する者は神の命令を守る
      '3':
        title: 神から生まれた者は罪に打ち勝つ
      '4':
        title: 真の愛は神から来る
      '5':
        title: イエスが永遠の命を持つことを信じる
  2 John:
    display_name: ヨハネの手紙二
    author: 「長老」。
    audience: 偽りの教師たちへの警戒を促された、特定のキリスト者の集会（「選ばれた婦人」）。
    date: 紀元90～110年ごろ。
    chapters:
      '1':
        title: 長老が偽りの教師たちを警告する
  3 John:
    display_name: ヨハネの手紙三
    author: 「長老」。
    audience: 巡回宣教者を迎え入れていた一人の指導者ガイオ。
    date: 紀元90～110年ごろ。
    chapters:
      '1':
        title: 長老がガイオの健やかな歩みを祈る
  Jude:
    display_name: ユダの手紙
    author: 伝統的には、ヤコブおよびイエスの兄弟ユダとされる。
    audience: 放縦な教えを説く者たちが入り込んでいたキリスト者の共同体。
    date: 紀元60～90年代ごろ。
    chapters:
      '1':
        title: ユダが神を敬わない侵入者を警告する
  Revelation:
    display_name: ヨハネの黙示録
    author: パトモスのヨハネ（文体は第四福音書と異なる）。
    audience: 帝国からの圧力の下にあった、ローマ領小アジアの七つのキリスト者の集会。
    date: 紀元90年代ごろ。伝統的にはドミティアヌス帝の治世中とされる。
    chapters:
      '1':
        title: 神がヨハネに幻を示す
      '2':
        title: イエスが七つの教会に語る
      '3':
        title: イエスがラオディキアに悔い改めを促す
      '4':
        title: 天の御座が栄光に輝く
      '5':
        title: 小羊が巻物を受け取り、贖いを成し遂げる
      '6':
        title: 四人の騎手が大きな災いをもたらす
      '7':
        title: 証印を押された僕たちが永遠の賛美を歌う
      '8':
        title: 七つのラッパが恐るべき裁きを告げる
      '9':
        title: いなごが地上の罪人たちを苦しめる
      '10':
        title: 力強い天使が時の終わりを誓う
      '11':
        title: 二人の証人が預言し、後に復活する
      '12':
        title: 女が、支配する定めの子を産む
      '13':
        title: 海から獣が現れる
      '14':
        title: 小羊が忠実な者たちをもとに集める
      '15':
        title: ヨハネが天に神の怒りを見る
      '16':
        title: 天使たちが怒りの鉢を注ぐ
      '17':
        title: バビロンへの裁きと神の勝利
      '18':
        title: バビロンの滅亡を天が喜ぶ
      '19':
        title: 天が小羊の婚礼を祝う
      '20':
        title: ヨハネが最後の裁きを見る
      '21':
        title: すべてが新しくされる
      '22':
        title: イエスは間もなく来る
  Tobit:
    display_name: トビト記
    author: 著者不詳。
    audience: 異国の支配下で、信仰深い生活、結婚、神の摂理という課題に向き合っていた離散のユダヤ人。
    date: 紀元前225～175年ごろ。アラム語で書かれ、ヘブライ語版の存在もクムラン文書によって確認されている。
    chapters:
      '1':
        title: トビトが忠実に神を心に留める
      '2':
        title: トビトが蔑まれた同胞を葬る
      '3':
        title: トビトが泣き、死を願って祈る
      '4':
        title: トビトが息子に正しく生きる道を教える
      '5':
        title: 導きを受けてトビアが旅立つ
      '6':
        title: トビアが癒やしをもたらす魚を捕らえる
      '7':
        title: トビアがエクバタナでサラと結婚する
      '8':
        title: トビアがサラと結婚し、祈る
      '9':
        title: ガバエルがトビトの金を返す
      '10':
        title: トビアが無事に帰郷する
      '11':
        title: 息子によってトビトの視力が回復する
      '12':
        title: ラファエルが正体を明かす
      '13':
        title: トビトがエルサレムのために祈る
      '14':
        title: トビトがイスラエルの将来を予見する
  Judith:
    display_name: ユディト記
    author: 著者不詳。
    audience: 異国からの脅威にさらされたユダヤ人。信仰に基づいて毅然と抵抗する物語。
    date: 紀元前150～100年ごろ。
    chapters:
      '1':
        title: ネブカドネツァルがアルファクサドを攻める
      '2':
        title: ホロフェルネスが西へ進軍する
      '3':
        title: 沿岸の民が財宝を差し出して降伏する
      '4':
        title: イスラエルが断食し、助けを求めて祈る
      '5':
        title: アキオルがイスラエルの歴史を語る
      '6':
        title: アキオルがホロフェルネスについて警告を受ける
      '7':
