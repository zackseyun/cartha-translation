  Numbers:
    display_name: 民数記
    author: 著者不明。伝統的にはモーセに帰されている。
    audience: エジプトから約束の地へ向かう途上のイスラエル――荒野の世代と、後にその失敗から学ぶ読者。
    date: 王国時代末期から捕囚後の時代にわたる複数の成立層（紀元前7～5世紀頃）。
    chapters:
      '1':
        title: モーセがイスラエルの男子を数える
      '2':
        title: 諸部族が幕屋の周りに集まる
      '3':
        title: レビ人が神の聖なる住まいに仕える
      '4':
        title: ケハテ族が聖なる用具を管理する
      '5':
        title: 神が隠れた罪を裁く
      '6':
        title: ナジル人の誓願と祝福
      '7':
        title: 指導者たちが聖所のために贈り物を献げる
      '8':
        title: レビ人が神に仕えるため清められる
      '9':
        title: 主が過越祭を守るよう命じる
      '10':
        title: 銀のラッパが神の命令を告げる
      '11':
        title: 渇望が疫病を招く
      '12':
        title: ミリアムがモーセの権威を非難する
      '13':
        title: 十二人が約束の地を探る
      '14':
