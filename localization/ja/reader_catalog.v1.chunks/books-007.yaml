      display_name: 箴言
      author: 複数の資料を集めた書。表題には、ソロモン、アグル、レムエル、「知恵ある者たち」の名が記されている。
      audience: 日々の生活のために知恵を身につけようとする、若いイスラエル人。
      date: 成立には複数の段階があり、紀元前10世紀頃から紀元前4世紀頃。
    Ecclesiastes:
      display_name: コヘレトの言葉
      author: 著者不詳。語り手は「コヘレト」で、伝統的にはソロモンと同一視されてきた。
      audience: 日の下で、知恵、富、努力の限界に直面するイスラエル人。
      date: アラム語の影響を受けたヘブライ語に基づけば、おそらく紀元前5世紀頃から紀元前3世紀頃。
    Song of Solomon:
      display_name: 雅歌
      author: 著者不詳。表題にはソロモンの名が掲げられている。
      audience: 男女の愛を、契約における親密さを映すものとして読むイスラエル。後代には、ユダヤ教徒とキリスト教徒もこれを寓意的に読んだ。
      date: おそらく捕囚後の時代、紀元前5世紀頃から紀元前3世紀頃。
