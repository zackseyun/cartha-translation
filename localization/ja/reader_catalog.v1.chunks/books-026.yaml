    Letters of Ignatius:
      display_name: イグナティオスの書簡
      author: 一般に受容されている中間校訂本文に含まれる七通については、アンティオキアの司教イグナティオス。後代に増補された書簡や、イグナティオスの名を用いた偽名書簡は、この書集には含まれない。
      audience: イグナティオスが殉教へ向かう旅の途上で宛てた、エフェソ、マグネシア、トラレス、ローマ、フィラデルフィア、スミルナのキリスト教会の集会、およびポリュカルポス。
      date: 通常は紀元2世紀初頭、多くの場合105～117年頃とされるが、イグナティオスの旅の正確な年代については今なお議論がある。
