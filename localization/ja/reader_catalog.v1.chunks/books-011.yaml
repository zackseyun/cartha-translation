      date: 紀元80～90年ごろ。
    John:
      display_name: ヨハネの福音書
      author: 著者不詳。伝承では、使徒ヨハネ、または「愛された弟子」の作とされる。
      audience: 「愛された弟子」の証言を中心に形成され、会堂を基盤とするユダヤ教との間に緊張を抱えていたキリスト教共同体。
      date: 紀元90～110年ごろ。
      summary: ヨハネの福音書は、イエスを、父を示し、ご自分を信頼する者に命を与え、しるしと死と復活を通して栄光を受ける永遠の「言」として描く。
