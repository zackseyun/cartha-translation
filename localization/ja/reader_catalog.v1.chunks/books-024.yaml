payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: アルコーンの本性
      author: 著者不詳。著者は、アルコーンたちについての啓示的な神話を通して『創世記』を解釈しているが、この文書を特定の名の知られた教師の作と確実にみなすことはできない。
      audience: 『創世記』を、無知な宇宙の支配者たち、神の知恵、そして人間の霊的起源の間の対立として読む、セツ派またはそれに近い環境のキリスト教徒。
      date: 一般に紀元3世紀の成立とされる。ナグ・ハマディ写本第II冊に収められた、4世紀のコプト語写本によって伝わる。
    On the Origin of the World:
      display_name: 世界の起源について
      author: 著者不詳。この文書は、編者の名を示さず、ユダヤ教、キリスト教、プラトン哲学、神話の複数の伝承を組み合わせ、作り直している。
      audience: 創造、宇宙の支配者たち、ソフィア、アダムとエバ、そして世界の最終的な運命について、対抗的な歴史像を求めた、グノーシス的傾向を持つキリスト教環境の読者。
      date: 通常は紀元3世紀の成立とされるが、それ以前の資料が基礎にある可能性もある。主として4世紀のコプト語写本によって伝わる。
    Sophia of Jesus Christ:
      display_name: イエス・キリストの知恵
      author: 著者不詳。著者は、『エウグノストス』にも見られる資料を、復活後のイエスと弟子たちとの対話として作り直している。
      audience: 超越的な神、天上世界の秩序、魂の起源と救いについての啓示された知恵に関心を持つキリスト教徒。
      date: しばしば紀元2世紀後半または3世紀の成立とされる。ナグ・ハマディ写本とベルリン写本のコプト語写本によって伝わる。
    Gospel of the Egyptians:
      display_name: エジプト人の福音書
      author: 著者不詳。ナグ・ハマディで発見されたこの文書は『大いなる見えない霊の聖なる書』とも呼ばれ、引用だけで知られる、より早い時期のギリシア語『エジプト人の福音書』とは別の作品である。
      audience: 濃密な神話、聖なる名、洗礼のイメージ、賛歌的な称賛を用いて、霊的な自己理解と解放を表現したセツ派のキリスト教共同体。
      date: 通常は紀元2世紀または3世紀の成立とされる。4世紀のナグ・ハマディ写本に、コプト語による二つの写本が現存する。
    Letter of Peter to Philip:
      display_name: ペトロからフィリポへの手紙
      author: 著者不詳。冒頭の短い手紙とそれに続く啓示はペトロとフィリポに仮託されており、どちらかの使徒が実際に書いたと確実にみなすことはできない。
      audience: 救い主、敵対する諸力、苦難、宣教、弟子たちの回復についての教えに、使徒の権威による裏づけを求めるキリスト教徒。
      date: 一般に紀元2世紀後半または3世紀初頭の成立とされる。4世紀のナグ・ハマディ写本と、より後代のコプト語写本によって伝わる。
    Gospel of Judas:
      display_name: ユダの福音書
      author: 著者不詳。題名はこの物語をユダに帰しているが、この文書はイスカリオテのユダが歴史上の著者であることを立証するものではない。
      audience: 対立する集団の犠牲祭儀や教会制度上の慣行を批判し、啓示的な対話とセツ派に似た宇宙論を用いて、ユダとイエスの死を捉え直したキリスト教集団。
      date: 通常は紀元2世紀半ばまたは後半の成立とされる。エイレナイオスは180年ごろまでに『ユダの福音書』を知っており、現存するコプト語写本はおそらく3世紀または4世紀のものである。
    Protoevangelium of James:
      display_name: ヤコブ原福音書
      author: 著者不詳。語り手は自らをヤコブと称しているが、この文書はヤコブに仮託されたもので、イエスの兄弟ヤコブが書いたものではない。
      audience: マリアの誕生と成長、終生保たれたその純潔、イエスの降誕、そして『マタイによる福音書』と『ルカによる福音書』が答えを残していない問いへの物語的な説明に関心を持つキリスト教徒。
      date: 一般に紀元2世紀後半の成立とされる。後代の多数のギリシア語写本と古代の諸翻訳が現存する。
