review:
  verdict: revise
  review_summary: 全項目を確認し、原文の意味により忠実になるよう数か所を修正しました。特に『校訂版』を『異本』に改め、主語・行為者を原文どおりに整えました。
  issues:
  - 'Infancy Gospel of Thomas の date: "recensions" は校訂版ではなく、異本・版として伝わる本文形態を指すため修正。'
  - 'Protoevangelium of James 16: 原文はヨセフが試験後にマリアを解放することであり、両者が解放されるという訳を修正。'
  - 'Gospel of Peter 4、7: "Wrongdoer" と "wrongdoing done" の意味を、原文に沿って『悪事を行った者』『行った悪事』として明確化。'
  - 'Acts of Paul and Thecla 11: 原文の列挙的で省略された題名に合わせ、天の声による救いとベールを過度に説明しない題名に修正。'
