payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: トマスの幼年福音書
      author: 作者不詳。復元可能な最初期の形には作者名が記されておらず、トマスへの帰属は、後代の写本の表題と伝承によるものです。
      audience: 正典福音書の物語が始まる以前のイエスの幼少期に関心を持ち、神の力、しつけ、学び、成長がどのように物語られ得るかを知りたいキリスト者。
      date: 一般に紀元2世紀にさかのぼると考えられていますが、本文は内容がかなり異なる複数のギリシア語異本と初期の翻訳で伝わっています。
    Acts of Paul and Thecla:
      display_name: パウロとテクラの行伝
      author: 作者不詳。より大きな作品『パウロ行伝』の一挿話です。ある長老が同作を書いたという古代の記録はありますが、それによって作者を確実に特定することはできません。
      audience: 使徒による宣教、独身生活、洗礼、殉教者のような忍耐、そして教え、証しする女性の権威を描く物語に心を引かれるキリスト者。
      date: 紀元2世紀、おそらくその後半に成立しました。『パウロ行伝』の一部としても、独立した作品としても流布しました。
    Gospel of Peter:
      display_name: ペトロの福音書
      author: 作者不詳。現存する物語はペトロの一人称で語られ、その名のもとに伝えられましたが、歴史上の使徒ペトロ本人の著作とは見なされていません。
      audience: 受難と復活を詳しく描いた物語に関心を持つ初期のキリスト者。おそらく、ペトロの権威が特に重んじられた共同体の読者です。
      date: 一般に紀元2世紀のものとされています。現存する主要なギリシア語断片は、はるか後代の写本に収められており、アクミームで発見されました。
    2 Clement:
      display_name: 第二クレメンス
      author: 作者不詳。伝統的な表題とは異なり、これはローマのクレメンスが書いた第二の手紙ではなく、初期キリスト教の説教です。
      audience: 悔い改め、言行の一致、弱い立場の人々への配慮、そして復活と裁きへの希望を抱いて忠実に耐え抜くよう勧められているキリスト者の集会。
      date: 一般に紀元2世紀前半から中頃（およそ紀元100～160年）のものとされています。成立地は不明です。
    Epistle of Barnabas:
      display_name: バルナバの手紙
      author: 作者不詳。この作品は伝統的にパウロの同労者バルナバと結び付けられてきましたが、現代の研究ではその帰属は認められていません。
      audience: イスラエルの聖書をキリスト論的かつ寓意的に解釈して自分たちのものとして受け継ぐ一方、ユダヤ教の実践とは異なる契約共同体としての自己理解を教えられていた異邦人キリスト者。
      date: 一般に、紀元70年のエルサレム神殿崩壊から2世紀初頭までの間、多くの場合はおよそ紀元80～130年のものとされています。
