payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: ポリュカルポスのフィリピの信徒への手紙
      author: スミルナの監督ポリュカルポス。一部の研究者は、現存する本文を、複数の時点で送られた資料を組み合わせたものと見ています。
      audience: フィリピのキリスト者の集会。彼らはイグナティオスの手紙を求め、信仰、行い、指導者、金銭、忍耐についての助言を受けました。
      date: 紀元2世紀初頭から半ば。少なくとも一部はイグナティオスの旅と密接に関係していますが、複数の手紙を合成したものだとする説では、やや後の時期に書かれた部分がある可能性も認められています。
    Martyrdom of Polycarp:
      display_name: ポリュカルポスの殉教
      author: スミルナの教会に属する匿名の人々が、共同体の名で執筆しました。末尾の伝承に関する注記には、後代の筆写と流布の過程が反映されています。
      audience: フィロメリオンの教会と、より広いキリスト者の交わり。ポリュカルポスの逮捕、裁判、死、そして模範的な忍耐についての記録として届けられました。
      date: ポリュカルポスの死後に書かれ、通常は紀元2世紀半ばまたは後半のものとされます。ただし、殉教の正確な年も、文書が最終的な形になった時期も議論が続いています。
    Epistle to Diognetus:
      display_name: ディオグネトスへの手紙
      author: 著者不詳。筆者は自らを弟子、または学ぶ者と呼んでいますが、筆者も宛先のディオグネトスも確実には特定できません。
      audience: キリスト教徒ではない教養ある探究者と、同じような問いを抱く読者。キリスト者の礼拝、倫理、社会における立場、愛、そしてこの信仰が新しく見える理由について尋ねる人々です。
      date: 紀元2世紀後半から3世紀初頭とされることが多いものの、年代については幅広い説があります。最後の2章は別の著作に由来する可能性があります。
    Fragments of Papias:
      display_name: パピアス断片集
      author: 失われた全5巻の『主の言葉の解説』の著者である、ヒエラポリスの監督パピアス。現存するこの断片集は、後代の著者たちが保存した引用や報告から成ります。
      audience: イエスと使徒たちについて記憶されていた教えを求めた初期のキリスト者。それらの教えは、名を挙げて示された口伝と解釈の連なりを通して集められました。
      date: パピアスの著作は通常、紀元2世紀初頭、しばしば紀元110～130年ごろのものとされます。現存する断片は、2世紀以降の著者たちの著作に収められています。
