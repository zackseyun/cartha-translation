payload:
  book_metadata:
    1 Esdras:
      display_name: エズラ記一
      author: 著者不詳。歴代誌下35～36章、エズラ記、ネヘミヤ記7～8章を並べ替えて再構成したギリシア語の書物。
      audience: 帰還と復興について筋の通った物語を求めたヘレニズム時代のユダヤ人。
      date: 紀元前2～1世紀頃。
    Prayer of Manasseh:
      display_name: マナセの祈り
      author: 著者不詳。マナセ王の名に仮託されている。
      audience: マナセの悔い改めに自らを重ねる悔悛者。一部の伝統では典礼に用いられた。
      date: 紀元前2～1世紀頃。
    Psalm 151:
      display_name: 詩編151編
      author: 著者不詳。ダビデの名に仮託されている。ヘブライ語形の存在は11QPsaによって確認されている。
      audience: ダビデの詩編を重んじた離散地とクムランの共同体。
      date: 紀元前2世紀頃、またはそれ以前。
    3 Maccabees:
      display_name: マカバイ記三
      author: 著者不詳。ギリシア語で著された。
      audience: エジプトのギリシア語を話す離散ユダヤ人。プトレマイオス4世の治世を舞台とする救出物語。
      date: 紀元前1世紀頃～紀元1世紀頃。
    4 Maccabees:
      display_name: マカバイ記四
      author: 著者不詳。ストア哲学の影響を受けた、ギリシア語を話すユダヤ人著者。
      audience: ヘレニズム時代のユダヤ人。忠実さによって理性が情念を制することを説く哲学的な説教。
      date: 紀元1世紀頃。
    Bel and the Dragon:
      display_name: ベルと竜
      author: 著者不詳。ギリシア語版ダニエル書への付加部分の一つ。
      audience: ギリシア語を話すユダヤ人。偶像崇拝をあざけり批判する物語。
      date: 紀元前2～1世紀頃。
    Letter of Jeremiah:
      display_name: エレミヤの手紙
      author: 著者不詳。エレミヤの名に仮託されている。
      audience: 周囲の偶像崇拝に引かれかねない離散ユダヤ人。
      date: 紀元前4～2世紀頃。
    Prayer of Azariah and Song of the Three:
      display_name: アザリヤの祈りと三人の若者の歌
      author: 著者不詳。ギリシア語版ダニエル書への付加部分の一つ。
      audience: ギリシア語を話すユダヤ人。ダニエル書3章のための典礼資料。
      date: 紀元前2世紀頃。
    Susanna:
      display_name: スザンナ
      author: 著者不詳。ギリシア語版ダニエル書への付加部分の一つ。
      audience: ギリシア語を話すユダヤ人。正しい人が守られ、偽証が退けられる物語。
      date: 紀元前2～1世紀頃。
    1 Clement:
      display_name: クレメンスの第一の手紙
      author: 著者不詳。ローマのクレメンスの作とされている。
      audience: 指導者をめぐる争いに巻き込まれていたコリントのキリスト教集会。
      date: 紀元96年頃。
