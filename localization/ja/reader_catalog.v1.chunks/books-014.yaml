    Sirach:
      display_name: シラ書
      author: エルサレム出身のエレアザルの子、シラの子イエシュア。ギリシア語訳はその孫による。
      audience: ヘレニズム時代のエルサレムで知恵の教育を受けていた若いユダヤ人男性。
      date: ヘブライ語原典は紀元前195～175年頃、ギリシア語訳は紀元前132年頃。
    Baruch:
      display_name: バルク書
      author: 著者不詳。エレミヤの書記バルクの名に仮託されている。
      audience: 捕囚、悔い改め、知恵について思い巡らす離散地のユダヤ人。
      date: 紀元前2世紀頃。
    1 Maccabees:
      display_name: マカバイ記一
      author: 著者不詳。おそらくエルサレムの著者がヘブライ語で執筆したと考えられる（現存するのはギリシア語版のみ）。
      audience: ハスモン朝の反乱期およびその後のユダヤ人。ハスモン朝の正統性を物語る。
      date: 紀元前100年頃。
    2 Maccabees:
      display_name: マカバイ記二
      author: キュレネのヤソンによる、より長い著作を要約した無名の編者。ギリシア語で執筆された。
      audience: ギリシア語を話す離散地のユダヤ人。殉教、神の摂理、復活を強調する。
      date: '紀元前124年頃、またはその少し後。 '
