  book_metadata:
    2 Esdras:
      display_name: 第二エズラ書
      author: 著者不詳。もともとのユダヤ教文書を中核（第四エズラ書、3～14章）とし、その前後にキリスト教徒が編集した枠が加えられている。
      audience: 紀元70年以後、神の正義と苦難の問題に取り組んでいたユダヤ人。後にキリスト教徒の読者向けに増補された。
      date: ユダヤ教文書の中核は紀元100年ごろ。キリスト教徒による付加部分は紀元2～3世紀ごろ。
    Didache:
      display_name: ディダケー
      author: 著者不詳（書名は「十二使徒の教え」という意味）。
      audience: 初期のキリスト教徒の集会。倫理、洗礼、聖餐、巡回教師について記した簡潔な手引き。
      date: 紀元1世紀末～2世紀初頭ごろ。
    Gospel of Thomas:
      display_name: トマスによる福音書
      author: 著者不詳。冒頭では、この語録集を「ディディモス・ユダ・トマス」に帰している。完全な形で現存するのは、ナグ・ハマディ文書（NHC II,2）に収められた4世紀のコプト語訳のみで、オクシリンコス出土のギリシア語断片も3点残っている。
      audience: シリアの知恵の伝統と原始グノーシス的思想の影響を受け、イエスの言葉に秘められた自己認識を重んじたキリスト教徒の読者。
      date: ギリシア語原本はおそらく紀元50～140年ごろ。コプト語写本は紀元340年ごろ。
      summary: 『トマスによる福音書』は、イエスに帰される言葉を集めた文書である。一貫した物語はなく、読者にこれらの言葉の意味を見いだすよう繰り返し促している。
