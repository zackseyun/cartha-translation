review:
  verdict: revise
  review_summary: Complete Japanese localization reviewed and corrected for source fidelity. Corrections address the direction of deception in Jubilees 24, the labor prohibition in Jubilees 50, and several titles whose wording omitted or distorted source details.
  issues:
  - Jubilees 24 incorrectly made Jacob the deceived party; the source says he serves Laban deceitfully.
  - Jubilees 34 omitted the source's tragedy detail.
  - Jubilees 50 could imply that Sabbath rest itself is prohibited; the source prohibits labor.
  - Psalms of Solomon 14 changed the faithful into trees rather than retaining the image of trees of life.
  - Shepherd of Hermas 32 omitted the source's sense that the Holy Spirit dwells freely/abundantly in patience.
  - Shepherd of Hermas 40 was clarified to refer to false-prophetic spirits.
