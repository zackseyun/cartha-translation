payload:
  book_metadata:
    James:
      display_name: ヤコブの手紙
      author: 伝統的にはイエスの兄弟ヤコブとされる。現代の研究では、本人による著作とする見解と、名を借りた著作とする見解に分かれている。
      audience: 離散の地にあるユダヤ人キリスト者の諸集会。
      date: 本人による著作なら紀元50～60年代ごろ、名を借りた著作なら紀元1世紀末ごろ。
    1 Peter:
      display_name: ペトロの手紙一
      author: 伝統的には、シルワノが筆記を務めた使徒ペトロの著作とされる。一部の研究者は、ペトロの名を借りた著作と見ている。
      audience: 社会的な敵意にさらされていた、ローマ領小アジアのキリスト者。
      date: ペトロによる著作なら紀元60年代ごろ、名を借りた著作なら紀元70～90年代ごろ。
    2 Peter:
      display_name: ペトロの手紙二
      author: 伝統的にはペトロとされるが、現代の研究ではペトロの名を借りた著作と広く考えられている。
      audience: キリストの再臨を否定してあざける者たちに直面していたキリスト者。
      date: 紀元2世紀初めごろ。
    1 John:
      display_name: ヨハネの手紙一
      author: 著者不詳。伝統的には使徒ヨハネ、またはヨハネ系共同体の長老とされる。
      audience: 分裂を経験した後、誰が共同体に属するのかを明らかにしようとしていたヨハネ系共同体。
      date: 紀元90～110年ごろ。
    2 John:
      display_name: ヨハネの手紙二
      author: 「長老」。
      audience: 偽りの教師たちへの警戒を促された、特定のキリスト者の集会（「選ばれた婦人」）。
      date: 紀元90～110年ごろ。
    3 John:
      display_name: ヨハネの手紙三
      author: 「長老」。
      audience: 巡回宣教者を迎え入れていた一人の指導者ガイオ。
      date: 紀元90～110年ごろ。
    Jude:
      display_name: ユダの手紙
      author: 伝統的には、ヤコブおよびイエスの兄弟ユダとされる。
      audience: 放縦な教えを説く者たちが入り込んでいたキリスト者の共同体。
      date: 紀元60～90年代ごろ。
    Revelation:
      display_name: ヨハネの黙示録
      author: パトモスのヨハネ（文体は第四福音書と異なる）。
      audience: 帝国からの圧力の下にあった、ローマ領小アジアの七つのキリスト者の集会。
      date: 紀元90年代ごろ。伝統的にはドミティアヌス帝の治世中とされる。
    Tobit:
      display_name: トビト記
      author: 著者不詳。
      audience: 異国の支配下で、信仰深い生活、結婚、神の摂理という課題に向き合っていた離散のユダヤ人。
      date: 紀元前225～175年ごろ。アラム語で書かれ、ヘブライ語版の存在もクムラン文書によって確認されている。
    Judith:
      display_name: ユディト記
      author: 著者不詳。
      audience: 異国からの脅威にさらされたユダヤ人。信仰に基づいて毅然と抵抗する物語。
      date: 紀元前150～100年ごろ。
    Greek Additions to Esther:
      display_name: エステル記補遺（ギリシア語）
      author: 著者不詳。エステル記のギリシア語訳に加えられた補足資料。
      audience: 祈りと神への明確な言及を含むエステルの物語を求めた、ギリシア語を話すユダヤ人。
      date: 紀元前2～1世紀ごろ。
    Wisdom of Solomon:
      display_name: ソロモンの知恵
      author: 著者不詳。ソロモンの名を借りて書かれた。おそらくアレクサンドリアで、ヘレニズム時代のユダヤ人著者がギリシア語で著した。
      audience: ギリシア哲学と向き合い、異教や背教の選択肢に対してイスラエルの知恵を擁護していたヘレニズム時代のユダヤ人。
      date: 紀元前50年～紀元50年ごろ。
