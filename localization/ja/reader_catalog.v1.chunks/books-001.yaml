  book_metadata:
    Genesis:
      display_name: 創世記
      author: 著者不詳。伝統的にはモーセの作とされてきた。現代の研究では、長い成立過程を経て、複数の資料が後代に編集されて一つになったと考えられている。
      audience: 契約によって自らの民としてのアイデンティティーを持つイスラエル。民の起源の物語を、神による創造、選び、約束に結びつけている。
      date: 数世紀にわたって成立し、バビロン捕囚期またはその後の紀元前6～5世紀ごろに、現在伝わる形になった。
      summary: 創世記は、天地創造、人類の反逆と離散、そしてアブラハム、イサク、ヤコブ、ヨセフの一族について語る。この一族を通して、イスラエルに対する神の契約の約束が始まる。
    Exodus:
      display_name: 出エジプト記
      author: 著者不詳。伝統的にはモーセの作とされてきた。現代の研究では、長い成立過程を経て、複数の資料が後代に編集されて一つになったと考えられている。
      audience: 解放されて神と契約を結んだ民イスラエル。神の律法のもとで主の国民として生きることの意味を学ぶ。
      date: 数世紀にわたって成立し、紀元前6～5世紀ごろに現在伝わる形になった。
    Leviticus:
      display_name: レビ記
      author: 著者不詳。伝統的にはモーセの作とされてきた。現代の研究では、祭司資料に属すると考えられている。
      audience: イスラエルの祭司たちと礼拝共同体。いけにえ、聖なる生活、神の臨在を中心とする生活の秩序について教える。
      date: 王国時代末期から捕囚後の時代（紀元前7～5世紀ごろ）にかけて成立した、複数の層から成る。
