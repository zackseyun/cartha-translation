payload:
  book_metadata:
    Gospel of Mary:
      display_name: マリアによる福音書
      author: 著者不明。この書では、マリアはイエスの啓示を受け、それを解き明かす者として描かれているが、現存する福音書をマリアが書いたとは主張していない。
      audience: 啓示、霊的な上昇、使徒の権威、またイエスの弟子たちの間でマリアの教えが正当なものかどうかという問題に取り組んでいた初期キリスト教の読者。
      date: 一般に紀元2世紀の成立とされる。3世紀のギリシア語断片が現存し、主要なコプト語本文は5世紀のベルリン写本8502に保存されている。
    Treatise on the Resurrection:
      display_name: 復活論
      author: 著者不明。この書は、教師がレギノスという弟子に宛てた手紙の形を取っているが、教師とレギノスのいずれも確実には特定できない。
      audience: 復活について教えを求めていたキリスト教徒、とりわけ、身体的な復活、霊的な復活、そして現世ですでに復活の命にあずかることについて考えていた読者。
      date: 一般に紀元2世紀後半（しばしば170～200年ごろ）の成立とされる。より古いギリシア語作品を翻訳した、4世紀のコプト語写本に保存されている。
    Dialogue of the Savior:
      display_name: 救い主との対話
      author: 著者不明。この対話篇では、イエスがユダ、マタイ、マリアとの対話の中で啓示の教えを語るが、編者が誰かは明らかにされていない。
      audience: 秘められた啓示、弟子としての生き方、自己認識、祈り、そして救いに備える禁欲的な修練に関心を持つ初期キリスト教の一集団。
      date: 一般に紀元2世紀の成立とされるが、成立過程の諸段階と正確な年代については見解が分かれている。4世紀のコプト語写本に保存されている。
    Exegesis on the Soul:
      display_name: 魂の解釈
      author: 著者不明。著者はキリスト教の説教者であり、聖書とギリシア文学のイメージを、魂の堕落、悔い改め、回復を表す寓意として読み直している。
      audience: 聖書と道徳的な勧めに親しみ、秩序を失った欲望を離れて悔い改め、神との結びつきを回復するよう呼びかけられていたキリスト教徒。
      date: 一般に紀元2世紀後半から3世紀初頭の成立とされる。ギリシア語から翻訳された4世紀のコプト語写本に保存されている。
    Book of Thomas the Contender:
      display_name: 闘技者トマスの書
      author: 著者不明。末尾の表題はこの書をユダ・トマスと結びつけ、記録者としてマタイアスの名を挙げるが、これらは文学上の帰属であり、検証可能な著者表示ではない。
      audience: 自己認識を求め、肉体の情欲に抗い、イエスがトマスにひそかに授けた教えを理解するよう促された、禁欲的傾向を持つキリスト教徒。
      date: しばしば紀元2世紀後半から3世紀初頭の成立とされ、シリアのキリスト教環境で書かれた可能性もある。4世紀のコプト語写本に保存されている。
    Tripartite Tractate:
      display_name: 三部の教え
      author: 著者不明。著者は高度な教育を受けたウァレンティノス派のキリスト教神学者だったが、名の知られた特定の教師と確実に同定することはできない。
      audience: 神、アイオーン、創造、キリスト、教会、救い、そして最終的な回復について、体系的な教えを受けていたウァレンティノス派のキリスト教共同体。
      date: 一般に紀元3世紀の成立とされ、3世紀後半とする見解もある。4世紀のユング写本にコプト語で保存されている。
    Apocryphon of John:
      display_name: ヨハネの秘義書
      author: 著者不明。この書は、復活したイエスがゼベダイの子ヨハネに授けた啓示であると仮託され、複数の古代の異本系統が現存する。
      audience: 神的な領域、創造、人間の本質、敵対的な支配者たちからの解放についての説明を求めていた、セツ派またはそれに近い啓示的伝統に属するキリスト教徒。
      date: 初期の形は紀元2世紀に流布していた可能性が高い。短い版と長い版を伝える現存のコプト語写本は、4世紀および5世紀のものである。
