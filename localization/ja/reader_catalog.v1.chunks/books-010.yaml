payload:
  book_metadata:
    Joel:
      display_name: ヨエル書
      author: ペトエルの子ヨエル。
      audience: いなごの災害を主の日のしるしとして受け止める、捕囚後のユダ。
      date: おそらく紀元前5～4世紀頃。
    Amos:
      display_name: アモス書
      author: テコア出身のアモス。ユダの羊飼いで、北王国で説教した。
      audience: ヤロブアム2世の治世下、繁栄する一方で不正が横行していた北王国イスラエル。
      date: 紀元前760～750年頃。
    Obadiah:
      display_name: オバデヤ書
      author: オバデヤ。
      audience: エドムがエルサレムを裏切った後のユダ。エドムの滅亡を告げる預言。
      date: 紀元前586年の直後。
    Jonah:
      display_name: ヨナ書
      author: 著者不詳。物語の主人公はアミタイの子ヨナ。
      audience: 捕囚後のイスラエル。民族的な閉鎖性を風刺的に戒め、部外者にも及ぶ神の憐れみを肯定する。
      date: おそらく紀元前5～4世紀頃。
    Micah:
      display_name: ミカ書
      author: モレシェト出身のミカ。
      audience: 紀元前8世紀後半のユダ。特に、都市の有力者に虐げられていた農村の貧しい人々。
      date: 紀元前740～700年頃。
    Nahum:
      display_name: ナホム書
      author: エルコシュ出身のナホム。
      audience: 間近に迫ったニネベの滅亡を喜ぶユダ。
      date: 紀元前612年の少し前。
    Habakkuk:
      display_name: ハバクク書
      author: ハバクク。
      audience: バビロンの台頭に直面するユダ。正義をめぐる預言者と神との対話。
      date: 紀元前7世紀末頃。
    Zephaniah:
      display_name: ゼファニヤ書
      author: クシの子ゼファニヤ。
      audience: ヨシヤの治世下、改革前夜のユダ。
      date: 紀元前640～609年頃。
    Haggai:
      display_name: ハガイ書
      author: ハガイ。
      audience: ダレイオスの治世下で神殿を再建していた帰還者たち。
      date: 紀元前520年。
    Zechariah:
      display_name: ゼカリヤ書
      author: ベレクヤの子ゼカリヤ。9～14章は、後代の別の人物による可能性が高い。
      audience: 神殿を再建していた帰還者たち、および後代の捕囚後共同体。
      date: 1～8章は紀元前520～518年頃。9～14章は、おそらくその約1世紀後。
    Malachi:
      display_name: マラキ書
      author: 著者不詳。「マラキ」は「私の使者」を意味する。
      audience: ペルシア支配下で、礼拝と神への忠実さが緩んでいた捕囚後のユダ。
      date: 紀元前5世紀半ば頃。
    Matthew:
      display_name: マタイによる福音書
      author: 著者不詳。伝承では使徒マタイの著作とされる。現代の研究では、ギリシア語を話すユダヤ人キリスト者の著者が、マルコによる福音書とQ資料に似た資料を用いたと考えられている。
      audience: 会堂を中心とするユダヤ教との連続性と相違をめぐって模索していた、ユダヤ人キリスト者の共同体。
      date: 紀元80～90年頃。
    Mark:
      display_name: マルコによる福音書
      author: 著者不詳。伝承では、ペトロの旅の同伴者だったヨハネ・マルコと結び付けられている。
      audience: 迫害のさなか、またはその脅威が迫る中にあった、ギリシア語を話すキリスト者の共同体。ローマにあった可能性がある。
      date: 紀元65～75年頃。ユダヤ戦争と神殿崩壊の前後。
