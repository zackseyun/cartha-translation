    Isaiah:
      display_name: イザヤ書
      author: 数世紀にわたる複数の著者。1～39章は紀元前8世紀のエルサレムのイザヤに由来し、40～55章（「第二イザヤ」）と56～66章（「第三イザヤ」）は捕囚と帰還を背景としている。
      audience: アッシリアの脅威のもとにあったユダ、バビロン捕囚下の人々、捕囚後の復興期の人々へと、順次語られている。
      date: 紀元前8世紀後半頃から紀元前5世紀頃にかけて成立。
    Jeremiah:
      display_name: エレミヤ書
      author: アナトト出身のエレミヤ。彼の書記バルクと後代の人々による大幅な編集を含む。
      audience: バビロンによる征服の直前、征服の最中、そして征服後のユダ。
      date: 紀元前7世紀後半から紀元前6世紀初頭。
