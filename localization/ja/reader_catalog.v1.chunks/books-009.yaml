      display_name: ダニエル書
      author: 著者不詳。捕囚時代のダニエルによるものとして描かれている。
      audience: ヘレニズム時代の迫害下にあったユダヤ人、特にアンティオコス4世エピファネスの治世（紀元前167～164年）の人々。
      date: 現在伝わる形になったのは紀元前165年頃。1～6章には、より古い宮廷物語が取り入れられている。
