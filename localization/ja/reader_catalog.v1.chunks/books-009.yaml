      author: 著者不詳。伝承ではエレミヤの作とされる。
      audience: 紀元前586年のエルサレム滅亡を嘆くユダの人々。
      date: 紀元前586年のすぐ後。
    Ezekiel:
      display_name: エゼキエル書
      author: バビロンに捕囚となった祭司エゼキエル。編集上の展開を経ている。
      audience: 神殿から離れた地で神の臨在を捉え直そうとしていた、バビロンのユダ人捕囚民。
      date: 預言者としての活動は紀元前593～571年頃。最終的な形になったのは、それよりやや後。
