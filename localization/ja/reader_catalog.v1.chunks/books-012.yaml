payload:
  book_metadata:
    1 Corinthians:
      display_name: コリントの信徒への手紙一
      author: パウロ。ソステネも名を連ねている。
      audience: 対立の絶えないコリントのキリスト者共同体。
      date: 紀元53～55年頃、エフェソで執筆。
    2 Corinthians:
      display_name: コリントの信徒への手紙二
      author: パウロ。テモテも名を連ねている。
      audience: つらい対立を経験した後のコリントの共同体。
      date: 紀元55～56年頃。
    Galatians:
      display_name: ガラテヤの信徒への手紙
      author: パウロ。
      audience: 割礼を受けて律法を守るよう圧力を受けていた、ガラテヤ（アナトリア中央部）のキリスト者共同体。
      date: 紀元48～55年頃（議論がある）。
    Ephesians:
      display_name: エフェソの信徒への手紙
      author: パウロ、またはパウロの名で書いた近しい弟子（議論がある）。
      audience: 小アジアのキリスト者一般。最古の写本には「エフェソ」という地名がない。
      date: パウロ本人の著作なら紀元60年代頃、別人がパウロの名で書いたものなら紀元80～90年代頃。
    Philippians:
      display_name: フィリピの信徒への手紙
      author: パウロ。テモテも名を連ねている。
      audience: マケドニアにあるローマの植民都市フィリピのキリスト者共同体。
      date: 紀元60～62年頃、獄中で執筆。
    Colossians:
      display_name: コロサイの信徒への手紙
      author: パウロ。テモテも名を連ねている。あるいは、パウロの名で書いた近しい弟子（議論がある）。
      audience: リュコス渓谷のコロサイに住み、諸思想を混ぜ合わせた教えに直面していたキリスト者たち。
      date: パウロ本人の著作なら紀元60～62年頃、別人がパウロの名で書いたものならそれより後。
    1 Thessalonians:
      display_name: テサロニケの信徒への手紙一
      author: パウロ。シルワノとテモテも名を連ねている。
      audience: 迫害に直面していた、テサロニケの若いキリスト者共同体。
      date: 紀元50～51年頃。現存するパウロ書簡の中で最も古い可能性が高い。
    2 Thessalonians:
      display_name: テサロニケの信徒への手紙二
      author: パウロ（議論があり、別人がパウロの名で書いたと考える研究者もいる）。
      audience: 終末について混乱していたテサロニケの共同体。
      date: パウロ本人の著作なら紀元51年頃。
    1 Timothy:
      display_name: テモテへの手紙一
      author: パウロ、またはパウロの名で書いた弟子（牧会書簡は別人がパウロの名で書いたものだと広く考えられている）。
      audience: エフェソにおけるパウロの代理者テモテ。後代の教会運営のための手引きでもある。
      date: パウロ本人の著作なら紀元60年代半ば頃、別人がパウロの名で書いたものなら紀元90～110年頃。
    2 Timothy:
      display_name: テモテへの手紙二
      author: パウロ、またはパウロの名で書いた弟子。
      audience: テモテ。獄中のパウロによる別れの言葉という形で書かれている。
      date: パウロ本人の著作なら紀元60年代半ば頃、別人がパウロの名で書いたものなら紀元90～110年頃。
    Titus:
      display_name: テトスへの手紙
      author: パウロ、またはパウロの名で書いた弟子。
      audience: クレタ島におけるパウロの代理者テトス。
      date: パウロ本人の著作なら紀元60年代半ば頃、別人がパウロの名で書いたものなら紀元90～110年頃。
    Philemon:
      display_name: フィレモンへの手紙
      author: パウロ。テモテも名を連ねている。
      audience: キリスト者で奴隷所有者でもあったフィレモン。逃亡した奴隷オネシモについて書かれている。
      date: 紀元60～62年頃。
    Hebrews:
      display_name: ヘブライ人への手紙
      author: 不詳。伝承ではパウロ、アポロ、バルナバ、プリスキラなどの名が挙げられてきたが、どの説にも合意はない。
      audience: キリストへの信仰告白から離れ、以前のあり方に戻りかけていた、ギリシア語を話すユダヤ人キリスト者。
      date: 紀元60～95年頃。
  chapter_titles:
    Romans:
      '11':
        title: 異邦人も恵みによって招かれる
      '12':
        title: 自分の人生を生きた供え物として献げる
      '13':
        title: 権威に従い、愛に生きる
      '14':
        title: 信仰の弱い人を受け入れる
      '15':
        title: ユダヤ人と異邦人が一つになる
      '16':
        title: あいさつと警告
    1 Corinthians:
      '1':
        title: すべての人に注がれる神の豊かな恵み
      '2':
        title: 神の霊が明らかにする知恵
      '3':
        title: パウロがコリントの神殿について警告する
      '4':
