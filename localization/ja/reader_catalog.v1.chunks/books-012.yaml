      '5':
        title: パウロが教会の規律を守るよう命じる
      '6':
        title: 争いは教会の中で解決する
      '7':
        title: パウロが結婚を尊ぶよう教える
      '8':
        title: 愛は自分の自由に優先する
      '9':
        title: パウロが使徒としての権利と自由を語る
      '10':
        title: 神の民に向けられたイスラエルの警告
      '11':
        title: 礼拝での一致によってキリストを敬う
      '12':
        title: 霊の賜物が教会の一致を築く
      '13':
        title: 愛は決してあきらめない
      '14':
        title: 人の目を引くことより愛を求める
      '15':
        title: キリストは復活し、死は敗れる
      '16':
        title: 献金と旅の計画
    2 Corinthians:
      '1':
        title: 苦しみの中で与えられる神の慰め
      '2':
        title: 愛と赦しを勧める
      '3':
        title: 変えられた人生が証しする働き
      '4':
