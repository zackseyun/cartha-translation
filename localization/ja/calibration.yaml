book_localizations:
- source_title: Genesis
  title: 創世記
  author: 著者不明。伝統的にはモーセの著作とされる。現代の研究では、長い成立過程を経て、複数の資料が後に一つに編集されたと考えられている。
  audience: 契約に基づく自らの民としてのアイデンティティーを持つイスラエル。神の創造、選び、約束のうちに、民の起源の物語を位置づける。
  date: 数世紀にわたって成立し、バビロン捕囚期またはその後の紀元前6～5世紀ごろに、現在伝わる形になった。
  summary: 創世記は、天地創造、人類の反逆と離散、そしてアブラハム、イサク、ヤコブ、ヨセフの一族について語る。この一族を通して、イスラエルに対する神の契約の約束が始まる。
- source_title: John
  title: ヨハネによる福音書
  author: 著者不明。伝承では、使徒ヨハネ、または「愛された弟子」の著作とされる。
  audience: 会堂を中心とするユダヤ教との間に緊張を抱え、「愛された弟子」の証言を核として形成されたキリスト者共同体。
  date: 紀元90～110年ごろ。
  summary: ヨハネによる福音書は、イエスを、父を明らかにし、ご自分への信頼を通して命を与え、しるし、死、復活を通して栄光を受ける永遠の「言」として描く。
- source_title: Gospel of Thomas
  title: トマスによる福音書
  author: 著者不明。冒頭では、この語録集は「ディディモス・ユダ・トマス」によるものとされる。完全な形で現存するのは、ナグ・ハマディ文書（NHC II,2）に収められた4世紀のコプト語訳だけであり、ほかにオクシュリュンコス出土のギリシャ語断片が三点ある。
  audience: シリアの知恵の伝統と原グノーシス主義的思想の影響を受け、イエスの言葉における秘教的な自己認識を志向するキリスト者の読者層。
  date: ギリシャ語原典はおそらく紀元50～140年ごろ。コプト語写本は紀元340年ごろ。
  summary: トマスによる福音書は、イエスの言葉とされる語録を集めたものである。連続した物語はなく、読者にこれらの言葉の意味を見いだすよう繰り返し促している。
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: 創世記 1:1
  text: 神が天と地を創造し始められた時[a]――
  translator_note: '[a] 伝統的な訳では、ここを「初めに、神は天と地を創造された」という完結した文としている。ヘブライ語は、これに続く内容を導入し、3節の「神は言われた」を主な動作とする表現だと考えるほうが自然である。'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: コヘレトの言葉 1:2
  text: 「蒸気の中の蒸気[a]」とコヘレト[b]は言う。「すべては蒸気――たちまち過ぎ去り、つかんでおくことができず、しばしば予想どおりにはならない。」
  translator_note: '[a] ヘブライ語の「ヘベル」は、文字どおりには「息」または「蒸気」を意味する。コヘレトの言葉では、すぐに過ぎ去るもの、つかむことも十分に理解することもできないもの、また人の予想とは異なる結果になるものを表す。「蒸気」はこの比喩を保つための訳であり、何事にも意味がないと断定するものではない。「息」「はかないもの」「束の間」とも訳し得る。[b] 「コヘレト」は著者のヘブライ語名または称号である。「教師」や「伝道者」と訳されることも多いが、いずれか一つの解釈に限定しないため、ここでは「コヘレト」とした。'
- source_path: nt/john/001/001.yaml
  reference: ヨハネによる福音書 1:1
  text: 初めに[b]、「言」はすでに存在していた。「言」は神と共におり、「言」は神であった。[a]
  translator_note: '[a] 「『言』は神的であった」、または「神がそうであるように、『言』もそうであった」とも訳せる。ギリシャ語の表現は、「言」を直前に述べた神と区別しながらも、「言」が完全に神であることを肯定している。[b] この書き出しは創世記1:1を響かせ、「言」を創造の初めと結びつけている。「すでに存在していた」は、初めが到来した時に「言」が存在しており、その時に存在するようになったのではないことを表す。「存在していた」または単に「いた」とも訳せる。'
- source_path: nt/romans/003/025.yaml
  reference: ローマの信徒への手紙 3:25
  text: 神はこの方を、その血による信仰を通して、罪を償ういけにえ[a]として示されました。[b] 神がそうされたのは、ご自分の正しさ[c]を明らかにするためです。それまでに犯された罪を、神が見逃しておられたからです。
  translator_note: '[a] 「神の怒りをなだめる供え物」とも訳せる。また、旧約聖書で、罪を償う血が振りかけられた契約の箱の金の蓋、すなわち「贖いの座」を指す可能性もある。[b] 「信仰を通して、彼の血によって」とも訳せる。[c] 「正義」とも訳せる。'
- source_path: nt/1_peter/001/013.yaml
  reference: ペトロの手紙一 1:13
  text: ですから、行動できるよう心を整えなさい。[a] しっかりと目を覚まして、イエス・キリストが現れる時にあなたがたにもたらされる恵みに、希望を余すところなく置きなさい。[b]
  translator_note: '[a] ギリシャ語では文字どおりには、「心の腰に帯を締めなさい」と言っている。行動に備えて、長い衣の裾を腰の周りにたくし上げる姿を描いた表現であり、心を整えて行動の用意をするよう求めている。[b] 「しっかりと／余すところなく」と訳したギリシャ語は、「目を覚ましている」にかかるとも、「希望を置く」にかかるとも、あるいはその両方にかかるとも考えられる。'
