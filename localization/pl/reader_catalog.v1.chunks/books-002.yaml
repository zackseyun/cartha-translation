      author: Autor nieznany; tradycyjnie przypisywana Mojżeszowi.
      audience: Izrael w drodze z Egiptu do ziemi obiecanej — pokolenie wędrujące przez pustynię oraz późniejsi czytelnicy uczący się na jego błędach.
      date: Warstwy kompozycyjne pochodzą z okresu od późnej monarchii po czasy po wygnaniu (ok. VII–V wieku p.n.e.).
    Deuteronomy:
      display_name: Księga Powtórzonego Prawa
      author: Autor nieznany; księga przedstawiona jest jako mowy pożegnalne Mojżesza. Współczesne badania wiążą jej zasadniczy trzon z reformą przeprowadzoną za Jozjasza pod koniec VII wieku p.n.e.
      audience: Izrael przygotowujący się do wejścia do ziemi — a także późniejsi wygnańcy, pytający, jak dochować wierności bez świątyni i króla.
      date: Zasadniczy trzon pochodzi z końca VII wieku p.n.e.; ostateczny kształt księga uzyskała w okresie wygnania.
