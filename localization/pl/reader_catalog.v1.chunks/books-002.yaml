  issues:
  - 'Lb 7: „sanctuary” błędnie oddano jako „świątynia”; poprawiono na „przybytek”.'
  - 'Lb 16: doprecyzowano, że ziemia pochłania buntowników, zgodnie ze źródłem.'
  - 'Pwt 32: usunięto niepotrzebnie rozbudowane sformułowanie i oddano tytuł jako pieśń-świadectwo przeciw Izraelowi.'
