payload:
  book_metadata:
    Gospel of Mary:
      display_name: Ewangelia Marii
      author: Autor nieznany. Utwór przedstawia Marię jako osobę, która otrzymała objawienie Jezusa i je objaśniała, nie twierdzi jednak, że Maria napisała zachowaną ewangelię.
      audience: Pierwsi chrześcijańscy czytelnicy zmagający się z zagadnieniami objawienia, duchowego wstępowania, władzy apostolskiej oraz prawomocności nauczania Marii wśród uczniów Jezusa.
      date: Utwór datuje się zwykle na II wiek n.e.; zachowały się greckie fragmenty z III wieku, a główny koptyjski przekaz znajduje się w pochodzącym z V wieku Kodeksie Berlińskim 8502.
    Treatise on the Resurrection:
      display_name: Traktat o zmartwychwstaniu
      author: Autor nieznany. Utwór ma formę listu nauczyciela do ucznia imieniem Reginos; ani nauczyciela, ani Reginosa nie można z całą pewnością zidentyfikować.
      audience: Chrześcijanie poszukujący pouczenia o zmartwychwstaniu, zwłaszcza czytelnicy rozważający cielesny i duchowy wymiar zmartwychwstania oraz obecne uczestnictwo w życiu zmartwychwstałym.
      date: Utwór umieszcza się zwykle pod koniec II wieku n.e. (często około 170–200 roku); zachował się w koptyjskiej kopii z IV wieku, sporządzonej na podstawie wcześniejszego dzieła greckiego.
    Dialogue of the Savior:
      display_name: Dialog Zbawiciela
      author: Autor nieznany. W dialogu nauki objawione są przedstawione jako wypowiedzi Jezusa w rozmowie z Judaszem, Mateuszem i Marią, lecz utwór nie wskazuje swojego kompilatora.
      audience: Krąg wczesnych chrześcijan zainteresowanych prywatnym objawieniem, byciem uczniem, samopoznaniem, modlitwą i ascetycznym przygotowaniem do zbawienia.
      date: Utwór powszechnie przypisuje się II wiekowi n.e., choć jego warstwy kompozycyjne i dokładne datowanie pozostają przedmiotem sporu; zachował się w koptyjskim rękopisie z IV wieku.
    Exegesis on the Soul:
      display_name: Egzegeza o duszy
      author: Autor nieznany. Autor jest chrześcijańskim homiletą, który na nowo odczytuje obrazy biblijne i pochodzące z literatury greckiej jako alegorię upadku, skruchy i odnowienia duszy.
      audience: Chrześcijanie znający Pismo i pouczenia moralne, wzywani do odwrócenia się od nieuporządkowanych pragnień, do skruchy i ponownego zjednoczenia z tym, co boskie.
      date: Utwór datuje się na ogół na koniec II lub początek III wieku n.e.; zachował się w koptyjskim przekładzie z greki pochodzącym z IV wieku.
    Book of Thomas the Contender:
      display_name: Księga Tomasza Zapaśnika
      author: Autor nieznany. Tytuł końcowy wiąże utwór z Judaszem Tomaszem i wymienia Mathaiasa jako tego, który go zapisał, są to jednak przypisania literackie, a nie możliwe do zweryfikowania twierdzenia o autorstwie.
      audience: Chrześcijanie skłaniający się ku ascezie, zachęcani do szukania samopoznania, opierania się cielesnym namiętnościom oraz zrozumienia prywatnych pouczeń Jezusa udzielonych Tomaszowi.
      date: Utwór często datuje się na koniec II lub początek III wieku n.e. i niekiedy wiąże się go ze środowiskiem chrześcijan syryjskich; zachował się w koptyjskim rękopisie z IV wieku.
    Tripartite Tractate:
      display_name: Traktat trójdzielny
      author: Autor nieznany. Był nim gruntownie wykształcony chrześcijański teolog walentyniański; nie można go z całą pewnością utożsamić z żadnym znanym z imienia nauczycielem.
      audience: Walentyniańska wspólnota chrześcijańska otrzymująca obszerne pouczenie o Bogu, eonach, stworzeniu, Chrystusie, Kościele, zbawieniu i ostatecznym odnowieniu.
      date: Utwór datuje się zwykle na III wiek n.e., choć niektórzy badacze opowiadają się za jego drugą połową; zachował się w języku koptyjskim w Kodeksie Junga z IV wieku.
    Apocryphon of John:
      display_name: Apokryf Jana
      author: Autor nieznany. Utwór przedstawia pod przybranym imieniem objawienie zmartwychwstałego Jezusa dane Janowi, synowi Zebedeusza, i zachował się w więcej niż jednej starożytnej redakcji.
      audience: Chrześcijanie należący do setiańskiej lub blisko z nią związanej tradycji objawieniowej, poszukujący opisu świata boskiego, stworzenia, ludzkiej tożsamości i wyzwolenia spod władzy wrogich zwierzchności.
      date: Wczesna forma utworu krążyła prawdopodobnie już w II wieku n.e.; zachowane koptyjskie przekazy, obejmujące krótsze i dłuższe redakcje, pochodzą z IV i V wieku.
