payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Ewangelia Dzieciństwa Tomasza
      author: Autor anonimowy. Najwcześniejsza możliwa do odtworzenia forma utworu nie podaje autora; przypisanie go Tomaszowi pojawia się w tytułach późniejszych rękopisów i w późniejszym przekazie.
      audience: Chrześcijanie zainteresowani dzieciństwem Jezusa oraz tym, jak można opowiedzieć o Jego boskiej mocy, dyscyplinie, nauce i dojrzewaniu przed początkiem wydarzeń opisanych w kanonicznych Ewangeliach.
      date: Utwór zwykle wywodzi się z II wieku n.e., lecz zachował się w kilku znacznie różniących się greckich redakcjach oraz w dawnych przekładach.
    Acts of Paul and Thecla:
      display_name: Dzieje Pawła i Tekli
      author: Autor anonimowy. Jest to epizod należący do obszerniejszych Dziejów Pawła; starożytna wzmianka, według której Dzieje spisał pewien prezbiter, nie pozwala na pewne ustalenie autora.
      audience: Chrześcijanie zainteresowani opowieściami o nauczaniu apostolskim, bezżenności, chrzcie, wytrwałości podobnej do męczeństwa oraz prawie kobiety do nauczania i dawania świadectwa.
      date: Utwór powstał w II wieku n.e., prawdopodobnie w jego drugiej połowie; krążył zarówno jako część Dziejów Pawła, jak i jako samodzielne dzieło.
    Gospel of Peter:
      display_name: Ewangelia Piotra
      author: Autor anonimowy. Zachowana narracja jest prowadzona w imieniu Piotra i pod jego imieniem była przekazywana, nie uważa się jej jednak za dzieło historycznego apostoła.
      audience: Pierwsi chrześcijanie zainteresowani rozbudowaną opowieścią o męce i zmartwychwstaniu, prawdopodobnie należący do wspólnot, w których autorytet Piotra miał szczególne znaczenie.
      date: Utwór zwykle datuje się na II wiek n.e.; główny zachowany fragment grecki pochodzi ze znacznie późniejszego rękopisu odnalezionego w Achmim.
    2 Clement:
      display_name: 2 List Klemensa
      author: Autor anonimowy. Wbrew tradycyjnemu tytułowi jest to wczesnochrześcijańska homilia, a nie drugi list Klemensa Rzymskiego.
      audience: Zgromadzenie chrześcijańskie wzywane do pokuty, moralnej konsekwencji, troski o słabych oraz wiernej wytrwałości w nadziei na zmartwychwstanie i sąd.
      date: Utwór zwykle datuje się na pierwszą połowę lub połowę II wieku n.e. (około 100–160); miejsce jego powstania pozostaje niepewne.
    Epistle of Barnabas:
      display_name: List Barnaby
      author: Autor anonimowy. Utwór tradycyjnie wiązano z Barnabą, towarzyszem Pawła, lecz współczesna nauka nie uznaje tego przypisania.
      audience: Chrześcijanie pochodzenia pogańskiego, których uczono odczytywać Pisma Izraela jako własne przez interpretację chrystologiczną i alegoryczną, a zarazem odróżniać swoją tożsamość przymierza od praktyk żydowskich.
      date: Utwór powszechnie datuje się na okres między zburzeniem świątyni jerozolimskiej w 70 roku n.e. a początkiem II wieku, często na około 80–130 rok.
