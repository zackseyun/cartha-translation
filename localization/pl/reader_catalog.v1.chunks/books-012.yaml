payload:
  book_metadata:
    1 Corinthians:
      display_name: 1 List do Koryntian
      author: Paweł wraz z Sostenesem.
      audience: Pełna sporów wspólnota chrześcijańska w Koryncie.
      date: Ok. 53–55 r. n.e.; napisany w Efezie.
    2 Corinthians:
      display_name: 2 List do Koryntian
      author: Paweł wraz z Tymoteuszem.
      audience: Wspólnota w Koryncie po bolesnym konflikcie.
      date: Ok. 55–56 r. n.e.
    Galatians:
      display_name: List do Galatów
      author: Paweł.
      audience: Wspólnoty chrześcijańskie w Galacji (środkowej Anatolii), na które wywierano presję, by przyjęły obrzezanie i przestrzeganie Tory.
      date: Ok. 48–55 r. n.e. (datowanie jest przedmiotem sporu).
    Ephesians:
      display_name: List do Efezjan
      author: Paweł albo bliski uczeń piszący w imieniu Pawła (kwestia sporna).
      audience: Ogół chrześcijańskich czytelników w Azji; nazwa miejsca „Efez” nie występuje w najstarszych rękopisach.
      date: Ok. lata 60. I w. n.e., jeśli autorem był Paweł; ok. lata 80.–90. I w. n.e., jeśli list napisano pod jego imieniem.
    Philippians:
      display_name: List do Filipian
      author: Paweł wraz z Tymoteuszem.
      audience: Wspólnota chrześcijańska w Filippi, rzymskiej kolonii w Macedonii.
      date: Ok. 60–62 r. n.e.; napisany w więzieniu.
    Colossians:
      display_name: List do Kolosan
      author: Paweł wraz z Tymoteuszem — albo bliski uczeń piszący w imieniu Pawła (kwestia sporna).
      audience: Chrześcijanie w Kolosach, w dolinie Likosu, wobec nauczania łączącego różne tradycje religijne.
      date: Ok. 60–62 r. n.e., jeśli autorem był Paweł; później, jeśli list napisano pod jego imieniem.
    1 Thessalonians:
      display_name: 1 List do Tesaloniczan
      author: Paweł wraz z Sylwanem i Tymoteuszem.
      audience: Młoda wspólnota chrześcijańska w Tesalonice, doświadczająca prześladowań.
      date: Ok. 50–51 r. n.e. — prawdopodobnie najwcześniejszy zachowany list Pawła.
    2 Thessalonians:
      display_name: 2 List do Tesaloniczan
      author: Paweł (kwestia sporna; część badaczy uważa, że list napisano pod jego imieniem).
      audience: Wspólnota w Tesalonice, zmagająca się z niejasnościami dotyczącymi czasów ostatecznych.
      date: Ok. 51 r. n.e., jeśli autorem był Paweł.
    1 Timothy:
      display_name: 1 List do Tymoteusza
      author: Paweł albo uczeń piszący w imieniu Pawła (Listy Pasterskie są powszechnie uznawane przez badaczy za napisane pod jego imieniem).
      audience: Tymoteusz jako wysłannik Pawła w Efezie; wskazówki dotyczące późniejszego porządku kościelnego.
      date: Ok. połowy lat 60. I w. n.e., jeśli autorem był Paweł; ok. 90–110 r. n.e., jeśli list napisano pod jego imieniem.
    2 Timothy:
      display_name: 2 List do Tymoteusza
      author: Paweł albo uczeń piszący w imieniu Pawła.
      audience: Tymoteusz — list przedstawiony jako pożegnanie Pawła z więzienia.
      date: Ok. połowy lat 60. I w. n.e., jeśli autorem był Paweł; ok. 90–110 r. n.e., jeśli list napisano pod jego imieniem.
    Titus:
      display_name: List do Tytusa
      author: Paweł albo uczeń piszący w imieniu Pawła.
      audience: Tytus jako wysłannik Pawła na Krecie.
      date: Ok. połowy lat 60. I w. n.e., jeśli autorem był Paweł; ok. 90–110 r. n.e., jeśli list napisano pod jego imieniem.
    Philemon:
      display_name: List do Filemona
      author: Paweł wraz z Tymoteuszem.
      audience: Filemon, chrześcijanin będący właścicielem niewolnika, w sprawie jego zbiegłego niewolnika Onezyma.
      date: Ok. 60–62 r. n.e.
    Hebrews:
      display_name: List do Hebrajczyków
      author: Autor anonimowy. Tradycja wskazywała między innymi Pawła, Apollosa, Barnabę i Pryscyllę; żadna propozycja nie zyskała powszechnej zgody.
      audience: Greckojęzyczni chrześcijanie pochodzenia żydowskiego, kuszeni, by odstąpić od chrześcijańskiego wyznania wiary.
      date: Ok. 60–95 r. n.e.
