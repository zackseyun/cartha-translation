review:
  verdict: revise
  review_summary: Wprowadzono korekty w kilku tytułach rozdziałów, aby wierniej oddać znaczenie źródła i usunąć nieuzasadnione dopowiedzenie lokalizacji w 1 Tm 1. Pozostałe pola są kompletne i wiernie zlokalizowane.
  issues:
  - '1 Kor 1: „riches” poprawiono z „dary” na „bogactwa”.'
  - '1 Kor 3 i 5: przywrócono odpowiednio ostrzeżenie oraz dyscyplinę wspólnotową.'
  - '2 Kor 8: skorygowano kierunek znaczeniowy „Macedonian grace”.'
  - '1 Tm 1: usunięto dodane „w Efezie”, którego nie ma w kanonicznym tytule.'
  - '2 Tm 3: przywrócono wezwanie do unikania fałszywych nauczycieli i ostrzegania.'
