payload:
  book_metadata:
    James:
      display_name: List Jakuba
      author: Tradycyjnie za autora uznaje się Jakuba, brata Jezusa; współcześni badacze są podzieleni między uznaniem autorstwa za autentyczne a przypisaniem pisma autorowi posługującemu się imieniem Jakuba.
      audience: Wspólnoty judeochrześcijańskie w diasporze.
      date: Ok. lat 50.–60. n.e., jeśli autorstwo jest autentyczne; ok. końca I wieku n.e., jeśli pismo powstało pod imieniem Jakuba.
    1 Peter:
      display_name: 1 List Piotra
      author: Tradycyjnie za autora uznaje się apostoła Piotra, a Sylwana za skrybę; niektórzy badacze uważają, że pismo powstało pod imieniem Piotra.
      audience: Chrześcijanie w rzymskiej Azji Mniejszej doświadczający wrogości społecznej.
      date: Ok. lat 60. n.e., jeśli autorem był Piotr; ok. lat 70.–90. n.e., jeśli pismo powstało pod jego imieniem.
    2 Peter:
      display_name: 2 List Piotra
      author: Tradycyjnie za autora uznaje się Piotra; wielu współczesnych badaczy uważa, że pismo powstało pod jego imieniem.
      audience: Chrześcijanie stający wobec szyderców, którzy zaprzeczają powtórnemu przyjściu Chrystusa.
      date: Ok. początku II wieku n.e.
    1 John:
      display_name: 1 List Jana
      author: Autor anonimowy; tradycyjnie uznawany za apostoła Jana lub starszego ze wspólnoty Janowej.
      audience: Wspólnota Janowa po rozłamie, określająca, kto do niej należy.
      date: Ok. 90–110 r. n.e.
    2 John:
      display_name: 2 List Jana
      author: „Starszy”.
      audience: Konkretna wspólnota chrześcijańska („wybrana Pani”), ostrzegana przed fałszywymi nauczycielami.
      date: Ok. 90–110 r. n.e.
    3 John:
      display_name: 3 List Jana
      author: „Starszy”.
      audience: Gajus, jeden z przywódców udzielający gościny wędrownym misjonarzom.
      date: Ok. 90–110 r. n.e.
    Jude:
      display_name: List Judy
      author: Tradycyjnie za autora uznaje się Judę, brata Jakuba i Jezusa.
      audience: Wspólnoty chrześcijańskie, do których przenikają nauczyciele głoszący rozwiązłość.
      date: Ok. lat 60.–90. n.e.
    Revelation:
      display_name: Apokalipsa Jana
      author: Jan z Patmos (jego styl różni się od stylu czwartej Ewangelii).
      audience: Siedem wspólnot chrześcijańskich w rzymskiej Azji Mniejszej, znajdujących się pod presją cesarstwa.
      date: Ok. lat 90. n.e.; tradycyjnie przyjmuje się, że za panowania Domicjana.
    Tobit:
      display_name: Księga Tobiasza
      author: Autor anonimowy.
      audience: Żydzi w diasporze, starający się zachować pobożność oraz właściwie rozumieć małżeństwo i opatrzność pod obcym panowaniem.
      date: Ok. 225–175 r. p.n.e.; spisana po aramejsku, przy czym w Qumran poświadczona jest również wersja hebrajska.
    Judith:
      display_name: Księga Judyty
      author: Autor anonimowy.
      audience: Żydzi zagrożeni przez obce potęgi — pełna sprzeciwu opowieść o pobożnym oporze.
      date: Ok. 150–100 r. p.n.e.
    Greek Additions to Esther:
      display_name: Greckie dodatki do Księgi Estery
      author: Autor anonimowy; materiał uzupełniający dodany w greckim przekładzie Księgi Estery.
      audience: Żydzi mówiący po grecku, pragnący opowieści o Esterze zawierającej wyraźne modlitwy i odniesienia do Boga.
      date: Ok. II–I wieku p.n.e.
    Wisdom of Solomon:
      display_name: Księga Mądrości
      author: Autor anonimowy; dzieło przypisane Salomonowi, lecz prawdopodobnie napisane pod jego imieniem. Powstało po grecku, a jego autorem był hellenistyczny Żyd, przypuszczalnie z Aleksandrii.
      audience: Żydzi hellenistyczni podejmujący dialog z filozofią grecką i broniący mądrości Izraela przed alternatywami pogańskimi oraz odstępczymi.
      date: Ok. 50 r. p.n.e. – 50 r. n.e.
