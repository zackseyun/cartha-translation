review:
  verdict: revise
  review_summary: Dokonano pełnej korekty katalogu. Usunięto kilka nieuzasadnionych dopowiedzeń i przywrócono znaczenia odpowiadające angielskiemu źródłu.
  issues:
  - Rdz 22 nie mówi, że Izaak został faktycznie złożony w ofierze, lecz że Abraham go ofiarowuje.
  - Rdz 30 pominięto wzmiankę o miłosierdziu.
  - Wj 33 zmieniono „pragnie ujrzeć” na neutralne „szuka chwały Boga”, zgodnie ze źródłem.
  - Wj 38 przywrócono formę odpowiadającą temu, że przedmioty zostały wykonane.
  - Kpł 1 poprawiono nieidiomatyczne „miłe PANU”.
