    Genesis:
      display_name: Księga Rodzaju
      author: Autor nieznany; tradycyjnie autorstwo przypisuje się Mojżeszowi. Współczesne badania wskazują na długi proces powstawania księgi, w którym wykorzystano źródła zredagowane później w jedną całość.
      audience: Izrael jako lud przymierza, którego opowieść o pochodzeniu jest zakorzeniona w Bożym dziele stworzenia, wybraniu i obietnicy.
      date: Powstawała na przestrzeni wieków; otrzymała znaną dziś postać około VI–V wieku p.n.e., w czasie wygnania babilońskiego lub po nim.
      summary: Księga Rodzaju opowiada o stworzeniu, buncie i rozproszeniu ludzkości oraz o rodzinie Abrahama, Izaaka, Jakuba i Józefa, wraz z którą zaczynają się Boże obietnice przymierza dane Izraelowi.
    Exodus:
      display_name: Księga Wyjścia
      author: Autor nieznany; tradycyjnie autorstwo przypisuje się Mojżeszowi. Współczesne badania wskazują na długi proces powstawania księgi, w którym wykorzystano źródła zredagowane później w jedną całość.
      audience: Izrael jako lud wyzwolony i związany przymierzem, uczący się, co znaczy być narodem PANA i żyć pod Jego Prawem.
      date: Powstawała na przestrzeni wieków; otrzymała znaną dziś postać około VI–V wieku p.n.e.
    Leviticus:
      display_name: Księga Kapłańska
      author: Autor nieznany; tradycyjnie autorstwo przypisuje się Mojżeszowi. Współczesne badania wiążą tę księgę ze źródłem kapłańskim.
      audience: Izraelscy kapłani i wspólnota oddająca Bogu cześć — otrzymujący wskazania dotyczące ofiar, świętości i kształtowania życia wokół Bożej obecności.
      date: Warstwy tekstu powstawały od schyłkowego okresu monarchii po czasy po wygnaniu (około VII–V wieku p.n.e.).
