    Luke:
      display_name: Łukasz
      author: Autor anonimowy; tradycja przypisuje autorstwo Łukaszowi, towarzyszowi podróży Pawła.
      audience: Wykształceni chrześcijańscy czytelnicy ze świata grecko-rzymskiego, do których zwraca się „Teofil”.
      date: ok. 80–90 r. n.e.
    John:
      display_name: Jan
      author: Autor anonimowy; tradycja przypisuje autorstwo apostołowi Janowi lub „umiłowanemu uczniowi”.
      audience: Wspólnota chrześcijańska pozostająca w napięciu z judaizmem synagogalnym, ukształtowana wokół świadectwa umiłowanego ucznia.
      date: ok. 90–110 r. n.e.
      summary: Jan przedstawia Jezusa jako odwieczne Słowo, które objawia Ojca i daje życie przez zaufanie Mu, a także jako tego, który zostaje uwielbiony przez swoje znaki, śmierć i zmartwychwstanie.
    Acts:
      display_name: Dzieje Apostolskie
      author: Autor anonimowy; ten sam autor co Ewangelii Łukasza.
      audience: Chrześcijańscy czytelnicy ze świata grecko-rzymskiego; drugi tom dzieła adresowanego do Teofila.
      date: ok. 80–90 r. n.e.
    Romans:
      display_name: List do Rzymian
      author: Paweł, z pisarzem Tercjuszem.
      audience: Chrześcijanie w Rzymie — wierzący pochodzenia żydowskiego i nieżydowskiego, między którymi istniały napięcia dotyczące Tory i tożsamości.
      date: ok. 56–58 r. n.e., napisany w Koryncie.
