review:
  verdict: revise
  review_summary: Kompletna korekta polska; poprawiono kilka sformułowań dla większej wierności źródłu i neutralności.
  issues:
  - 'J 1: podsumowanie zmieniono tak, by Jezus — nie samo Słowo jako abstrakcja — był uwielbiony przez znaki, śmierć i zmartwychwstanie.'
  - 'Rz 1: autora ujęto jako Pawła z pisarzem Tercjuszem, bez sugerowania nieokreślonego zakresu współudziału.'
  - 'Mk 15: „faithfully” oddano jako „wiernie”, a nie jako dodatkowo wartościujące „godnie”.'
