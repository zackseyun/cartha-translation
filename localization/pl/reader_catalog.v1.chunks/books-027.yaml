payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: Polikarp do Filipian
      author: Polikarp, biskup Smyrny. Niektórzy badacze uważają, że zachowany tekst łączy materiały wysłane w różnym czasie.
      audience: Wspólnota chrześcijańska w Filippi, która poprosiła o listy Ignacego i otrzymała pouczenia dotyczące wiary, postępowania, przywództwa, pieniędzy i wytrwałości.
      date: Od początku do połowy II wieku po Chr.; przynajmniej część jest ściśle związana z podróżą Ignacego, natomiast hipotezy o złożonym charakterze listu dopuszczają, że jeden z jego fragmentów powstał nieco później.
    Martyrdom of Polycarp:
      display_name: Męczeństwo Polikarpa
      author: Anonimowi członkowie Kościoła w Smyrnie, piszący w imieniu wspólnoty; końcowe uwagi o przekazywaniu tekstu odzwierciedlają jego późniejsze kopiowanie i rozpowszechnianie.
      audience: Kościół w Filomelionie i szersza wspólnota chrześcijańska, którym przedstawiono opis aresztowania, procesu i śmierci Polikarpa oraz jego wzorcowej wytrwałości.
      date: Napisane po śmierci Polikarpa, zwykle datowane na połowę lub drugą połowę II wieku po Chr.; zarówno dokładny rok męczeństwa, jak i ostateczna postać dokumentu są przedmiotem dyskusji.
    Epistle to Diognetus:
      display_name: List do Diogneta
      author: Autor anonimowy. Nazywa siebie uczniem, lecz ani jego, ani adresata imieniem Diognet nie można z całą pewnością zidentyfikować.
      audience: Wykształcony człowiek niebędący chrześcijaninem — oraz podobni do niego czytelnicy — pytający o chrześcijański kult, etykę, tożsamość społeczną, miłość i pozorną nowość wiary.
      date: Często datowany na koniec II lub początek III wieku po Chr., choć propozycje znacznie się różnią; dwa ostatnie rozdziały mogą pochodzić z innego dzieła.
    Fragments of Papias:
      display_name: Fragmenty Papiasza
      author: Papiasz, biskup Hierapolis, był autorem zaginionego pięcioksięgu „Objaśnienia wypowiedzi Pana”; zachowany zbiór składa się z cytatów i relacji przekazanych przez późniejszych autorów.
      audience: Pierwsi chrześcijanie poszukujący zapamiętanych nauk o Jezusie i apostołach, zebranych za pośrednictwem imiennie wskazanych łańcuchów ustnego świadectwa i interpretacji.
      date: Dzieło Papiasza datuje się zwykle na początek II wieku po Chr., często około 110–130 roku; zachowane fragmenty występują w pismach autorów tworzących od II wieku i później.
