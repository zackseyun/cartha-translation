payload:
  book_metadata:
    Joel:
      display_name: Księga Joela
      author: Joel, syn Petuela.
      audience: Mieszkańcy Judy po wygnaniu, którzy w pladze szarańczy dostrzegali znak Dnia PANA.
      date: Prawdopodobnie około V–IV wieku p.n.e.
    Amos:
      display_name: Księga Amosa
      author: Amos z Tekoa, judejski pasterz głoszący na północy.
      audience: Mieszkańcy północnego królestwa Izraela w okresie dobrobytu i niesprawiedliwości za panowania Jeroboama II.
      date: Około 760–750 r. p.n.e.
    Obadiah:
      display_name: Księga Abdiasza
      author: Abdiasz.
      audience: Mieszkańcy Judy po tym, jak Edom zdradził Jerozolimę — proroctwo o upadku Edomu.
      date: Wkrótce po 586 r. p.n.e.
    Jonah:
      display_name: Księga Jonasza
      author: Autor nieznany; głównym bohaterem jest Jonasz, syn Amittaja.
      audience: Mieszkańcy Izraela po wygnaniu — satyryczne skarcenie za zamknięcie się na inne narody oraz potwierdzenie Bożego miłosierdzia wobec obcych.
      date: Prawdopodobnie około V–IV wieku p.n.e.
    Micah:
      display_name: Księga Micheasza
      author: Micheasz z Moreszet.
      audience: Mieszkańcy Judy pod koniec VIII wieku p.n.e., zwłaszcza ubodzy z obszarów wiejskich, krzywdzeni przez miejskie elity.
      date: Około 740–700 r. p.n.e.
    Nahum:
      display_name: Księga Nahuma
      author: Nahum z Elkosz.
      audience: Mieszkańcy Judy świętujący zbliżający się upadek Niniwy.
      date: Krótko przed 612 r. p.n.e.
    Habakkuk:
      display_name: Księga Habakuka
      author: Habakuk.
      audience: Mieszkańcy Judy w obliczu wzrostu potęgi Babilonu — dialog proroka z Bogiem o sprawiedliwości.
      date: Około końca VII wieku p.n.e.
    Zephaniah:
      display_name: Księga Sofoniasza
      author: Sofoniasz, syn Kusziego.
      audience: Mieszkańcy Judy za panowania Jozjasza, tuż przed jego reformami.
      date: Około 640–609 r. p.n.e.
    Haggai:
      display_name: Księga Aggeusza
      author: Aggeusz.
      audience: Powracający z wygnania, którzy odbudowywali świątynię za panowania Dariusza.
      date: 520 r. p.n.e.
    Zechariah:
      display_name: Księga Zachariasza
      author: Zachariasz, syn Berekiasza; rozdziały 9–14 prawdopodobnie pochodzą od późniejszego autora.
      audience: Powracający z wygnania, którzy odbudowywali świątynię, oraz późniejsze wspólnoty okresu powygnaniowego.
      date: 'Rozdziały 1–8: około 520–518 r. p.n.e.; rozdziały 9–14 być może powstały około wieku później.'
    Malachi:
      display_name: Księga Malachiasza
      author: Autor nieznany; „Malachiasz” znaczy „mój posłaniec”.
      audience: Mieszkańcy Judy po wygnaniu, którzy pod panowaniem perskim stawali się niedbali w oddawaniu czci Bogu i dochowywaniu Mu wierności.
      date: Około połowy V wieku p.n.e.
    Matthew:
      display_name: Ewangelia według Mateusza
      author: Autor nieznany; tradycja przypisuje ją apostołowi Mateuszowi. Współcześni badacze widzą w autorze greckojęzycznego chrześcijanina pochodzenia żydowskiego, który korzystał z Ewangelii Marka i źródła podobnego do Q.
      audience: Wspólnota chrześcijan pochodzenia żydowskiego mierząca się z kwestią ciągłości i zerwania z judaizmem synagogalnym.
      date: Około 80–90 r. n.e.
    Mark:
      display_name: Ewangelia według Marka
      author: Autor nieznany; tradycja łączy ją z Janem Markiem, towarzyszem podróży Piotra.
      audience: Greckojęzyczna wspólnota chrześcijańska, być może w Rzymie, żyjąca w obliczu prześladowań lub ich groźby.
      date: Około 65–75 r. n.e., w czasie wojny żydowskiej i zburzenia świątyni.
