  book_metadata:
    2 Esdras:
      display_name: 2 Księga Ezdrasza
      author: Autor anonimowy; pierwotnie żydowski trzon (4 Księga Ezdrasza, rozdziały 3–14) został ujęty w ramy zredagowane przez chrześcijan.
      audience: Żydzi po 70 r. n.e., zmagający się z problemem teodycei; dzieło zostało później rozszerzone z myślą o chrześcijańskich czytelnikach.
      date: 'Żydowski trzon: ok. 100 r. n.e.; dodatki chrześcijańskie: ok. II–III w. n.e.'
    Didache:
      display_name: Didache
      author: Autor anonimowy (tytuł oznacza „Naukę Dwunastu Apostołów”).
      audience: Wczesne wspólnoty chrześcijańskie — zwięzły podręcznik dotyczący etyki, chrztu, eucharystii i wędrownych nauczycieli.
      date: Ok. schyłku I–początku II w. n.e.
    Gospel of Thomas:
      display_name: Ewangelia Tomasza
      author: Autor anonimowy; incipit przypisuje zbiór wypowiedzi „Didymosowi Judzie Tomaszowi”. Pełny tekst zachował się jedynie w koptyjskim przekładzie z IV wieku, odnalezionym w Nag Hammadi (NHC II,2); znane są także trzy greckie fragmenty z Oksyrynchos.
      audience: Chrześcijańscy czytelnicy ukształtowani przez syryjską tradycję mądrościową i myśl protognostycką, zwróceni ku ezoterycznemu samopoznaniu w wypowiedziach Jezusa.
      date: Grecki oryginał powstał prawdopodobnie ok. 50–140 r. n.e.; koptyjski rękopis pochodzi z ok. 340 r. n.e.
      summary: Ewangelia Tomasza jest zbiorem wypowiedzi przypisywanych Jezusowi. Nie zawiera ciągłej opowieści i wielokrotnie wzywa czytelników do odkrywania znaczenia tych wypowiedzi.
