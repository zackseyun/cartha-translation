    Sirach:
      display_name: Syrach
      author: Jeszua, syn Eleazara, syna Syracha, z Jerozolimy; przekład grecki sporządził jego wnuk.
      audience: Młodzi żydowscy mężczyźni kształceni w mądrości w Jerozolimie okresu hellenistycznego.
      date: Hebrajski oryginał ok. 195–175 r. p.n.e.; przekład grecki ok. 132 r. p.n.e.
    Baruch:
      display_name: Baruch
      author: Autor anonimowy; dzieło przypisano pseudonimowo Baruchowi, pisarzowi Jeremiasza.
      audience: Żydzi żyjący w diasporze i rozważający wygnanie, skruchę oraz mądrość.
      date: Ok. II w. p.n.e.
    1 Maccabees:
      display_name: 1 Księga Machabejska
      author: Autor anonimowy, prawdopodobnie pochodzący z Jerozolimy i piszący po hebrajsku (zachował się jedynie tekst grecki).
      audience: Żydzi żyjący podczas powstania machabejskiego i po nim; opowieść przedstawia prawomocność dynastii hasmonejskiej.
      date: Ok. 100 r. p.n.e.
    2 Maccabees:
      display_name: 2 Księga Machabejska
      author: Anonimowy autor skrótu obszerniejszego dzieła Jazona z Cyreny; księgę napisano po grecku.
      audience: Greckojęzyczni Żydzi w diasporze — ze szczególnym uwzględnieniem męczeństwa, opatrzności i zmartwychwstania.
      date: Ok. 124 r. p.n.e. lub krótko później.
