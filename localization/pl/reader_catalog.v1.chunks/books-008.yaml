      author: Wielu autorów na przestrzeni stuleci; rozdziały 1–39 mają korzenie w działalności Izajasza z Jerozolimy w VIII wieku p.n.e., natomiast 40–55 („Drugi Izajasz”) i 56–66 („Trzeci Izajasz”) odnoszą się do wygnania i powrotu.
