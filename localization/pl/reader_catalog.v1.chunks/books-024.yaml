payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Hipostaza archontów
      author: Autor anonimowy. Interpretuje Księgę Rodzaju poprzez mit objawieniowy o archontach; dzieła nie można z całą pewnością przypisać żadnemu znanemu z imienia nauczycielowi.
      audience: Chrześcijanie ze środowiska setiańskiego lub pokrewnego, którzy odczytywali Księgę Rodzaju jako opowieść o konflikcie między nieświadomymi władcami kosmosu, boską mądrością a duchowym pochodzeniem ludzkości.
      date: Dzieło umieszcza się powszechnie w III wieku n.e.; zachowało się w koptyjskim odpisie z IV wieku w II kodeksie z Nag Hammadi.
    On the Origin of the World:
      display_name: O początku świata
      author: Autor anonimowy. Dzieło łączy i przetwarza różne tradycje żydowskie, chrześcijańskie, platońskie i mitologiczne, nie podając imienia kompilatora.
      audience: Czytelnicy z chrześcijańskiego środowiska o tendencjach gnostyckich, poszukujący alternatywnej opowieści o stworzeniu, władcach kosmosu, Sofii, Adamie i Ewie oraz ostatecznym losie świata.
      date: Dzieło datuje się zwykle na III wiek n.e., choć jego podstawą mogły być wcześniejsze materiały; zachowało się głównie w koptyjskich świadectwach z IV wieku.
    Sophia of Jesus Christ:
      display_name: Mądrość Jezusa Chrystusa
      author: Autor anonimowy. Przetwarza materiał znany również z Eugnostosa w dialog Jezusa z uczniami po zmartwychwstaniu.
      audience: Chrześcijanie zainteresowani objawioną mądrością dotyczącą transcendentnego Boga, porządku świata niebiańskiego oraz pochodzenia i zbawienia duszy.
      date: Dzieło datuje się często na schyłek II lub na III wiek n.e.; zachowało się w koptyjskich odpisach z Nag Hammadi oraz w Kodeksie Berlińskim.
    Gospel of the Egyptians:
      display_name: Ewangelia Egipcjan
      author: Autor anonimowy. To dzieło z Nag Hammadi, zwane także Świętą księgą Wielkiego Niewidzialnego Ducha, jest odrębne od wcześniejszej greckiej Ewangelii Egipcjan, znanej jedynie z cytatów.
      audience: Setiańska wspólnota chrześcijańska, która posługiwała się złożonym mitem, świętymi imionami, symboliką chrztu i hymniczną pochwałą, aby wyrazić duchową tożsamość i wyzwolenie.
      date: Dzieło przypisuje się zwykle do II lub III wieku n.e.; dwa koptyjskie odpisy zachowały się w kodeksach z Nag Hammadi z IV wieku.
    Letter of Peter to Philip:
      display_name: List Piotra do Filipa
      author: Autor anonimowy. Krótki list otwierający dzieło oraz następujące po nim objawienie przypisano pseudonimowo Piotrowi i Filipowi; nie ma podstaw, by z całą pewnością uznać któregokolwiek z apostołów za autora.
      audience: Chrześcijanie poszukujący apostolskiego autorytetu dla nauczania o Zbawicielu, wrogich mocach, cierpieniu, misji oraz odnowieniu uczniów.
      date: Dzieło datuje się powszechnie na schyłek II lub początek III wieku n.e.; zachowało się w odpisie z Nag Hammadi z IV wieku oraz w późniejszym świadectwie koptyjskim.
    Gospel of Judas:
      display_name: Ewangelia Judasza
      author: Autor anonimowy. Tytuł przypisuje opowieść Judaszowi, lecz dzieło nie wskazuje, że jej historycznym autorem był Judasz Iskariota.
      audience: Grupa chrześcijańska krytyczna wobec praktyk ofiarniczych i kościelnych innych wspólnot, która poprzez dialog objawieniowy i kosmologię typu setiańskiego na nowo interpretowała Judasza oraz śmierć Jezusa.
      date: Dzieło datuje się zwykle na połowę lub schyłek II wieku n.e.; Ireneusz znał Ewangelię Judasza około 180 roku, a zachowany odpis koptyjski pochodzi prawdopodobnie z III lub IV wieku.
    Protoevangelium of James:
      display_name: Protoewangelia Jakuba
      author: Autor anonimowy. Narrator podaje się za Jakuba, lecz dzieło jest pseudonimowe i nie zostało napisane przez Jakuba, brata Jezusa.
      audience: Chrześcijanie zainteresowani narodzinami i wychowaniem Maryi, jej trwałą czystością, narodzeniem Jezusa oraz opowieściami odpowiadającymi na pytania pozostawione bez odpowiedzi przez Mateusza i Łukasza.
      date: Dzieło datuje się na ogół na drugą połowę II wieku n.e.; zachowało się w licznych późniejszych rękopisach greckich i starożytnych przekładach.
