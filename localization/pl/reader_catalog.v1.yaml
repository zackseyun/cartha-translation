  Fragments of Papias:
    display_name: Fragmenty Papiasza
    author: Papiasz, biskup Hierapolis, był autorem zaginionego pięcioksięgu „Objaśnienia wypowiedzi Pana”; zachowany zbiór składa się z cytatów i relacji przekazanych przez późniejszych autorów.
    audience: Pierwsi chrześcijanie poszukujący zapamiętanych nauk o Jezusie i apostołach, zebranych za pośrednictwem imiennie wskazanych łańcuchów ustnego świadectwa i interpretacji.
    date: Dzieło Papiasza datuje się zwykle na początek II wieku po Chr., często około 110–130 roku; zachowane fragmenty występują w pismach autorów tworzących od II wieku i później.
