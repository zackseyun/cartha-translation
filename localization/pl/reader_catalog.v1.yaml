  Epistle to Diognetus:
    display_name: List do Diogneta
    author: Autor anonimowy. Nazywa siebie uczniem, lecz ani jego, ani adresata imieniem Diognet nie można z całą pewnością zidentyfikować.
    audience: Wykształcony człowiek niebędący chrześcijaninem — oraz podobni do niego czytelnicy — pytający o chrześcijański kult, etykę, tożsamość społeczną, miłość i pozorną nowość wiary.
    date: Często datowany na koniec II lub początek III wieku po Chr., choć propozycje znacznie się różnią; dwa ostatnie rozdziały mogą pochodzić z innego dzieła.
