    author: Polikarp, biskup Smyrny. Niektórzy badacze uważają, że zachowany tekst łączy materiały wysłane w różnym czasie.
    audience: Wspólnota chrześcijańska w Filippi, która poprosiła o listy Ignacego i otrzymała pouczenia dotyczące wiary, postępowania, przywództwa, pieniędzy i wytrwałości.
    date: Od początku do połowy II wieku po Chr.; przynajmniej część jest ściśle związana z podróżą Ignacego, natomiast hipotezy o złożonym charakterze listu dopuszczają, że jeden z jego fragmentów powstał nieco później.
