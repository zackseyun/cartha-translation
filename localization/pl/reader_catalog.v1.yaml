  Letter of Peter to Philip:
    display_name: List Piotra do Filipa
    author: Autor anonimowy. Krótki list otwierający dzieło oraz następujące po nim objawienie przypisano pseudonimowo Piotrowi i Filipowi; nie ma podstaw, by z całą pewnością uznać któregokolwiek z apostołów za autora.
    audience: Chrześcijanie poszukujący apostolskiego autorytetu dla nauczania o Zbawicielu, wrogich mocach, cierpieniu, misji oraz odnowieniu uczniów.
    date: Dzieło datuje się powszechnie na schyłek II lub początek III wieku n.e.; zachowało się w odpisie z Nag Hammadi z IV wieku oraz w późniejszym świadectwie koptyjskim.
