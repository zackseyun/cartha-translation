    audience: Kościół w Filomelionie i szersza wspólnota chrześcijańska, którym przedstawiono opis aresztowania, procesu i śmierci Polikarpa oraz jego wzorcowej wytrwałości.
    date: Napisane po śmierci Polikarpa, zwykle datowane na połowę lub drugą połowę II wieku po Chr.; zarówno dokładny rok męczeństwa, jak i ostateczna postać dokumentu są przedmiotem dyskusji.
