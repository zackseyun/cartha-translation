review:
  verdict: revise
  summary: Korekta dotyczy przede wszystkim Księgi Koheleta 1:2, gdzie należy zachować obraz „pary”, a nie zastępować go „marnością”, oraz Listu do Rzymian 3:25, gdzie „passed over” nie znaczy „pozostawiał bez kary”. Ujednolicono też kilka sformułowań, aby bliżej oddawały źródło i brzmiały naturalnie po polsku.
  issues:
  - 'Księga Koheleta 1:2: „marność” i objaśnienie o tradycyjności tego przekładu nie zachowują przyjętego w źródle obrazu hewel jako „pary”; tekst i przypis skorygowano.'
  - 'List do Rzymian 3:25: „pozostawiał ... bez kary” stanowi interpretacyjne dopowiedzenie do „passed over”; zastąpiono je neutralnym „pomijał”.'
  - 'List do Rzymian 3:25, przypis c: źródło podaje wyłącznie alternatywę „justice”; usunięto dodatkowe, bardziej interpretacyjne odpowiedniki.'
  - '1 List Piotra 1:13: doprecyzowano, że łaska jest „przynoszona”, oraz oddano nakaz całkowitego pokładania nadziei bez sugerowania przyszłego trybu dokonanego.'
