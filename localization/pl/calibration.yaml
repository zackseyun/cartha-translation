book_localizations:
- source_title: Genesis
  title: Księga Rodzaju
  author: Autor anonimowy; tradycyjnie autorstwo przypisuje się Mojżeszowi. Współczesne badania wskazują na długi proces powstawania księgi, w którym różne źródła zostały później połączone redakcyjnie.
  audience: Izrael jako lud przymierza, którego opowieść o pochodzeniu zostaje zakorzeniona w Bożym dziele stworzenia, wybraniu i obietnicy.
  date: Księga powstawała na przestrzeni wieków; otrzymała swoją utrwaloną postać około VI–V wieku p.n.e., w czasie wygnania babilońskiego lub po nim.
  summary: Księga Rodzaju opowiada o stworzeniu, buncie i rozproszeniu ludzkości oraz o rodzinie Abrahama, Izaaka, Jakuba i Józefa, przez którą zaczynają się urzeczywistniać Boże obietnice przymierza dane Izraelowi.
- source_title: John
  title: Ewangelia Jana
  author: Autor anonimowy; tradycja przypisuje jej autorstwo apostołowi Janowi lub „umiłowanemu uczniowi”.
  audience: Wspólnota chrześcijańska pozostająca w napiętych relacjach z judaizmem synagogalnym, ukształtowana wokół świadectwa umiłowanego ucznia.
  date: Około 90–110 roku n.e.
  summary: Ewangelia Jana przedstawia Jezusa jako odwieczne Słowo, które objawia Ojca, daje życie tym, którzy Mu ufają, i zostaje otoczone chwałą poprzez swoje znaki, śmierć i zmartwychwstanie.
- source_title: Gospel of Thomas
  title: Ewangelia Tomasza
  author: Autor anonimowy; we wstępie zbiór wypowiedzi przypisano „Didymosowi Judzie Tomaszowi”. Pełny tekst zachował się jedynie w koptyjskim przekładzie z IV wieku, odnalezionym w Nag Hammadi (NHC II,2); znane są też trzy greckie fragmenty z Oksyrynchos.
  audience: Chrześcijańscy czytelnicy ukształtowani przez syryjską tradycję mądrościową i myśl protognostycką, ukierunkowani na ezoteryczne samopoznanie zawarte w wypowiedziach Jezusa.
  date: Grecki oryginał powstał prawdopodobnie około 50–140 roku n.e.; rękopis koptyjski pochodzi z około 340 roku n.e.
  summary: Ewangelia Tomasza jest zbiorem wypowiedzi przypisywanych Jezusowi. Nie zawiera ciągłej narracji i wielokrotnie wzywa czytelników do odkrywania znaczenia tych wypowiedzi.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Księga Rodzaju 1:1
  text: Gdy Bóg zaczął stwarzać niebo i ziemię[a] —
  translator_note: '[a] Tradycyjny przekład traktuje te słowa jako pełne zdanie: „Na początku Bóg stworzył niebo i ziemię”. Składnia hebrajska bardziej naturalnie wprowadza jednak dalszy ciąg, w którym główne działanie — „Bóg powiedział” — pojawia się w wersecie 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Księga Koheleta 1:2
  text: „Para nad parami[a]” — mówi Kohelet[b]. „Wszystko jest parą — krótkotrwałą, nieuchwytną i często inną, niż się spodziewamy”.
  translator_note: '[a] Hebrajskie słowo hewel dosłownie oznacza oddech lub parę. W całej Księdze Koheleta opisuje to, co szybko przemija, czego nie można zatrzymać ani w pełni zrozumieć i co często okazuje się inne, niż ludzie oczekują. „Para” zachowuje ten obraz, nie sugerując, że nic nie ma znaczenia. [b] Kohelet to hebrajskie imię lub tytuł autora. Często tłumaczy się je jako „Nauczyciel” albo „Kaznodzieja”, lecz zachowujemy formę „Kohelet”, aby nie rozstrzygać między możliwymi znaczeniami.'
- source_path: nt/john/001/001.yaml
  reference: Ewangelia Jana 1:1
  text: Na początku[b] Słowo już istniało. Słowo było u Boga i Słowo było Bogiem.[a]
  translator_note: '[a] Możliwe także: „Słowo było boskie” albo „Słowo było tym, czym był Bóg”. Greckie sformułowanie potwierdza, że Słowo jest w pełni Bogiem, a zarazem odróżnia Je od Boga wspomnianego w poprzedniej części zdania. [b] Początek ten nawiązuje do Księgi Rodzaju 1:1 i łączy Słowo z początkiem stworzenia. Czasownik grecki wskazuje na trwające istnienie: Słowo istniało już wtedy, gdy nastał początek, a nie zaczęło wówczas istnieć. Możliwe przekłady: „było” lub „istniało”.'
- source_path: nt/romans/003/025.yaml
  reference: List do Rzymian 3:25
  text: Bóg ustanowił Go ofiarą przebłagalną[a] przez wiarę w Jego krew[b]. Uczynił to, aby ukazać swoją sprawiedliwość[c], ponieważ pomijał grzechy popełnione wcześniej.
  translator_note: '[a] Możliwe także: „przebłaganiem” lub „przebłagalnią”, czyli złotą pokrywą Arki Przymierza, którą w Starym Testamencie skrapiano krwią przebłagania. [b] Możliwe także: „przez wiarę, za sprawą Jego krwi”. [c] Możliwe także: „sprawiedliwość” w znaczeniu „sprawiedliwy osąd”.'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 List Piotra 1:13
  text: Dlatego przygotujcie swoje umysły do działania.[a] Zachowujcie pełną trzeźwość umysłu i całkowicie pokładajcie nadzieję w łasce przynoszonej wam, gdy objawi się Jezus Mesjasz.[b]
  translator_note: '[a] Po grecku dosłownie: „przepaszcie biodra waszego umysłu”. Obraz ten przedstawia podciągnięcie długiej szaty i przewiązanie jej w pasie, aby być gotowym do działania. [b] Greckie słowo oddane jako „pełną” i „całkowicie” może odnosić się do trzeźwości umysłu, do pokładania nadziei albo być może do obu tych wyrażeń.'
