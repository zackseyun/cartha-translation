    1 Esdras:
      display_name: عزرا الأول
      author: مؤلف مجهول؛ إعادة صياغة يونانية تعيد ترتيب أخبار الأيام الثاني 35–36، وعزرا، ونحميا 7–8.
      audience: يهود العصر الهلنستي الراغبون في سرد واضح للعودة والاستعادة.
      date: نحو القرن الثاني إلى الأول قبل الميلاد.
    Prayer of Manasseh:
      display_name: صلاة منسّى
      author: مؤلف مجهول؛ نُسبت باسم مستعار إلى الملك منسّى.
      audience: التائبون الذين يرون أنفسهم في توبة منسّى — وقد استُخدمت طقسيًا في بعض التقاليد.
      date: نحو القرن الثاني إلى الأول قبل الميلاد.
    Psalm 151:
      display_name: المزمور 151
      author: مؤلف مجهول؛ نُسب باسم مستعار إلى داود. وهناك صيغة عبرية مشهود لها في 11QPsa.
      audience: جماعات الشتات وقمران المكرّسة لمزامير داود.
      date: نحو القرن الثاني قبل الميلاد أو قبله.
    3 Maccabees:
      display_name: المكابيين الثالث
      author: مؤلف مجهول؛ أُلّف باليونانية.
      audience: يهود الشتات الناطقون باليونانية في مصر — وهو سرد للنجاة تدور أحداثه في عهد بطليموس الرابع.
      date: نحو القرن الأول قبل الميلاد إلى القرن الأول الميلادي.
    4 Maccabees:
      display_name: المكابيين الرابع
      author: مؤلف مجهول؛ كاتب يهودي ناطق باليونانية متأثر بالفلسفة الرواقية.
      audience: اليهود الهلنستيون — عظة فلسفية عن سيطرة العقل على الأهواء من خلال الأمانة.
      date: نحو القرن الأول الميلادي.
    Bel and the Dragon:
      display_name: بال والتنين
      author: مؤلف مجهول؛ أحد الإضافات اليونانية إلى دانيال.
      audience: اليهود الناطقون باليونانية — جدال ساخر ضد عبادة الأصنام.
      date: نحو القرن الثاني إلى الأول قبل الميلاد.
    Letter of Jeremiah:
      display_name: رسالة إرميا
      author: مؤلف مجهول؛ نُسبت باسم مستعار إلى إرميا.
      audience: يهود الشتات المعرّضون لإغراء عبادة الأصنام المحيطة بهم.
      date: نحو القرن الرابع إلى الثاني قبل الميلاد.
    Prayer of Azariah and Song of the Three:
      display_name: صلاة عزريا وترنيمة الفتية الثلاثة
      author: مؤلف مجهول؛ أحد الإضافات اليونانية إلى دانيال.
      audience: اليهود الناطقون باليونانية — مادة طقسية لدانيال 3.
      date: نحو القرن الثاني قبل الميلاد.
    Susanna:
      display_name: سوسنة
      author: مؤلف مجهول؛ أحد الإضافات اليونانية إلى دانيال.
      audience: اليهود الناطقون باليونانية — قصة عن البر وتفنيد شهادة الزور.
      date: نحو القرن الثاني إلى الأول قبل الميلاد.
    1 Clement:
      display_name: رسالة إكليمندس الأولى
      author: مؤلف مجهول، نُسبت إلى إكليمندس الروماني.
      audience: الجماعة المسيحية في كورنثوس، وكانت منخرطة في نزاع حول القيادة.
      date: نحو سنة 96 ميلادية.
