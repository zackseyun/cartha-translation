payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: بوليكاربوس إلى أهل فيلبي
      author: بوليكاربوس، أسقف سميرنا. ويرى بعض الباحثين أن النص الذي وصل إلينا يجمع مواد أُرسلت في أكثر من وقت.
      audience: الجماعة المسيحية في فيلبي، التي طلبت رسائل إغناطيوس وتلقت إرشادًا بشأن الإيمان والسلوك والقيادة والمال والثبات.
      date: من أوائل القرن الثاني إلى منتصفه الميلادي؛ يرتبط جزء منه على الأقل ارتباطًا وثيقًا برحلة إغناطيوس، في حين تسمح الآراء القائلة بأن الرسالة مركبة بأن يكون أحد أقسامها متأخرًا بعض الشيء.
    Martyrdom of Polycarp:
      display_name: استشهاد بوليكاربوس
      author: أعضاء مجهولون من كنيسة سميرنا كتبوا باسم الجماعة؛ وتعكس ملاحظات نقل النص في خاتمته عمليات النسخ والتداول اللاحقة.
      audience: الكنيسة في فيلومِليوم وسائر الشركة المسيحية، إذ قُدِّم لها وصف لاعتقال بوليكاربوس ومحاكمته وموته وثباته الذي يُقتدى به.
      date: كُتب بعد وفاة بوليكاربوس، ويُؤرَّخ عادةً بمنتصف القرن الثاني الميلادي أو أواخره؛ غير أن سنة الاستشهاد الدقيقة والصيغة النهائية للوثيقة موضع نقاش.
    Epistle to Diognetus:
      display_name: الرسالة إلى ديوغنيتوس
      author: مجهول. يصف الكاتب نفسه بأنه تلميذ أو متعلّم، لكن لا يمكن التحقق على نحو موثوق من هويته ولا من هوية ديوغنيتوس المخاطَب.
      audience: باحث مثقف غير مسيحي—وقرّاء مثله—يسأل عن العبادة المسيحية والأخلاق والهوية الاجتماعية والمحبة وما يبدو من حداثة الإيمان.
      date: تُؤرَّخ غالبًا بأواخر القرن الثاني أو أوائل القرن الثالث الميلادي، مع تفاوت كبير بين الآراء؛ وقد يكون الفصلان الأخيران مأخوذين من مؤلَّف آخر.
    Fragments of Papias:
      display_name: شذرات بابياس
      author: بابياس، أسقف هيرابوليس، هو مؤلف كتاب «شروح أقوال الرب» المفقود، المؤلف من خمسة أجزاء؛ أما المجموعة الباقية فتتكون من اقتباسات وروايات حفظها مؤلفون لاحقون.
      audience: مسيحيون أوائل كانوا يطلبون تعاليم متناقلة عن يسوع والرسل، جُمعت عبر سلاسل مسمّاة من الشهادة الشفوية والتفسير.
      date: يُؤرَّخ عمل بابياس عادةً بأوائل القرن الثاني الميلادي، وكثيرًا ما يُقدَّر بنحو 110–130م؛ أما الشذرات الباقية فترد في كتابات مؤلفين من القرن الثاني فصاعدًا.
