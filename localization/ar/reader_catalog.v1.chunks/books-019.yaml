  verdict: revise
  review_summary: تمت مراجعة جميع القيم وتعريبها مراجعةً مباشرة. صُححت مواضع طفيفة لتحسين مطابقة العناوين للمصدر، ولا سيما علاقة «المشيئة» بالكلام في إنجيل الحق 13، وموضع استراحة الحق في 15، وصياغة عنوان قوس القزح والعهود في اليوبيلات 6.
  issues:
  - 'Gospel of Truth 13: كان حرف الجر في المسودة يوحي بأن المتكلم يتكلم «بالمشيئة»، بينما المصدر يفيد أنه يتكلم عن/في المشيئة في النور.'
  - 'Gospel of Truth 15: عُدلت الصياغة للحفاظ على معنى أن الحق يستريح داخل الآب.'
  - 'Jubilees 6: أزيلت إضافة الفاعل غير المذكور صراحة في العنوان الإنجليزي، مع الحفاظ على المعنى.'
