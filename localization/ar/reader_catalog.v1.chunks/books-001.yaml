  book_metadata:
    Genesis:
      display_name: التكوين
      author: مؤلفه مجهول؛ ويُنسب تقليديًا إلى موسى. ويرى البحث الحديث أن له تاريخًا تأليفيًا طويلًا، جُمعت خلاله مصادر ثم حُررت معًا في وقت لاحق.
      audience: إسرائيل في هويته القائمة على العهد، إذ يرسّخ قصة نشأة الشعب في خلق الله واختياره ووعده.
      date: أُلّف على مدى قرون، وبلغ صورته المتلقاة نحو القرنين السادس والخامس قبل الميلاد، في أثناء السبي البابلي أو بعده.
      summary: يروي سفر التكوين قصة الخلق، وتمرد البشر وتشتتهم، وعائلة إبراهيم وإسحاق ويعقوب ويوسف، التي بدأت من خلالها وعود عهد الله لإسرائيل.
    Exodus:
      display_name: الخروج
      author: مؤلفه مجهول؛ ويُنسب تقليديًا إلى موسى. ويرى البحث الحديث أن له تاريخًا تأليفيًا طويلًا، جُمعت خلاله مصادر ثم حُررت معًا في وقت لاحق.
      audience: إسرائيل بوصفه شعبًا نال الحرية ودخل في عهد، ويتعلم ما يعنيه أن يكون أمة الرَّب الخاضعة لشريعته.
      date: أُلّف على مدى قرون، وبلغ صورته المتلقاة نحو القرنين السادس والخامس قبل الميلاد.
    Leviticus:
      display_name: اللاويين
      author: مؤلفه مجهول؛ ويُنسب تقليديًا إلى موسى. ويضعه البحث الحديث ضمن المصدر الكهنوتي.
      audience: كهنة إسرائيل وجماعة المتعبدين — إرشادات بشأن الذبائح والقداسة وتنظيم الحياة حول حضور الله.
      date: تعود طبقاته التأليفية إلى الفترة الممتدة من أواخر العهد الملكي حتى ما بعد السبي (نحو القرنين السابع والخامس قبل الميلاد).
