payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: حقيقة الأراخنة
      author: مؤلف مجهول. يفسر المؤلف سفر التكوين من خلال أسطورة كشفية عن الأراخنة؛ ولا يمكن نسبة العمل بثقة إلى معلم معروف بالاسم.
      audience: مسيحيون في بيئة سيثية أو قريبة منها، كانوا يقرؤون سفر التكوين بوصفه صراعًا بين حكام كونيين جاهلين، والحكمة الإلهية، والأصل الروحي للبشرية.
      date: يُؤرَّخ عادةً بالقرن الثالث الميلادي؛ وقد حُفظ في نسخة قبطية من القرن الرابع ضمن مخطوطة نجع حمادي الثانية.
    On the Origin of the World:
      display_name: في أصل العالم
      author: مؤلف مجهول. يجمع العمل بين عدة تقاليد يهودية ومسيحية وأفلاطونية وأسطورية ويعيد صياغتها، من غير أن يسمّي من جمعها.
      audience: قراء في بيئة مسيحية ذات نزعة غنوصية، كانوا يطلبون رواية بديلة لتاريخ الخلق والحكام الكونيين وصوفيا وآدم وحواء والمصير النهائي للعالم.
      date: يُؤرَّخ عادةً بالقرن الثالث الميلادي، مع احتمال استناده إلى مواد أقدم؛ وقد حُفظ أساسًا في شواهد قبطية من القرن الرابع.
    Sophia of Jesus Christ:
      display_name: حكمة يسوع المسيح
      author: مؤلف مجهول. يعيد المؤلف صياغة مادة معروفة أيضًا من كتاب «أوغنوستوس» في صورة حوار بعد القيامة بين يسوع وتلاميذه.
      audience: مسيحيون مهتمون بالحكمة المعلنة عن الله المتعالي، وتنظيم العالم السماوي، وأصل النفس وخلاصها.
      date: يُؤرَّخ غالبًا بأواخر القرن الثاني أو بالقرن الثالث الميلادي؛ وقد حُفظ في نسخ قبطية من نجع حمادي ومخطوطة برلين.
    Gospel of the Egyptians:
      display_name: إنجيل المصريين
      author: مؤلف مجهول. هذا العمل من نجع حمادي، المعروف أيضًا باسم «الكتاب المقدس للروح العظيم غير المنظور»، يختلف عن إنجيل المصريين اليوناني الأقدم الذي لا يُعرف إلا من اقتباسات.
      audience: جماعة مسيحية سيثية استخدمت أساطير كثيفة، وأسماء مقدسة، وصورًا معمودية، وتسبيحًا ترنيميًا للتعبير عن الهوية الروحية والنجاة.
      date: يُنسب عادةً إلى القرن الثاني أو الثالث الميلادي؛ وتوجد منه نسختان قبطيتان في مخطوطتين من مخطوطات نجع حمادي ترجعان إلى القرن الرابع.
    Letter of Peter to Philip:
      display_name: رسالة بطرس إلى فيلبس
      author: مؤلف مجهول. تُنسب الرسالة الافتتاحية القصيرة والكشف الذي يليها، على سبيل الاسم المستعار، إلى بطرس وفيلبس، ولا يمكن إثبات أن أيًّا من الرسولين كتبهما.
      audience: مسيحيون كانوا يطلبون سندًا رسوليًا لتعاليم تتناول المخلّص، والقوى المعادية، والمعاناة، والرسالة، واستعادة التلاميذ.
      date: تُؤرَّخ عادةً بأواخر القرن الثاني أو أوائل القرن الثالث الميلادي؛ وقد حُفظت في نسخة من نجع حمادي ترجع إلى القرن الرابع وفي شاهد قبطي لاحق.
    Gospel of Judas:
      display_name: إنجيل يهوذا
      author: مؤلف مجهول. ينسب العنوان الرواية إلى يهوذا، لكن العمل لا يثبت أن يهوذا الإسخريوطي هو مؤلفه التاريخي.
      audience: جماعة مسيحية انتقدت ممارسات الذبيحة والكنيسة لدى جماعات منافسة، واستخدمت الحوار الكشفي وعلم الكونيات ذي الطابع السيثي لإعادة تفسير يهوذا وموت يسوع.
      date: يُؤرَّخ عادةً بمنتصف القرن الثاني الميلادي أو أواخره؛ فقد عرف إيريناوس إنجيلًا ليهوذا نحو سنة 180، ويُرجَّح أن النسخة القبطية الباقية ترجع إلى القرن الثالث أو الرابع.
    Protoevangelium of James:
      display_name: إنجيل يعقوب الأولي
      author: مؤلف مجهول. يدّعي الراوي أنه يعقوب، لكن العمل منحول ولم يكتبه يعقوب أخو يسوع.
      audience: مسيحيون مهتمون بميلاد مريم ونشأتها، وطهارتها الدائمة، وميلاد يسوع، وبإجابات سردية عن أسئلة تركها متى ولوقا بلا جواب.
      date: يُؤرَّخ عمومًا بالنصف الثاني من القرن الثاني الميلادي؛ وقد حُفظ في مخطوطات يونانية لاحقة كثيرة وترجمات قديمة.
