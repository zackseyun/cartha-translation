    Letters of Ignatius:
      display_name: رسائل إغناطيوس
      author: إغناطيوس، أسقف أنطاكية، في الرسائل السبع ذات الصيغة الوسطى المقبولة عمومًا؛ أما الرسائل الإغناطية الموسَّعة اللاحقة والمنحولة، فهي خارج هذه المجموعة.
      audience: جماعات مسيحية في أفسس ومغنيسية وتراليس وروما وفيلادلفيا وسميرنا، إلى جانب بوليكاربوس، وقد وُجِّهت إليهم الرسائل في أثناء رحلة إغناطيوس نحو الاستشهاد.
      date: تؤرَّخ عادةً بأوائل القرن الثاني الميلادي، وغالبًا بنحو 105–117م، مع أن التسلسل الزمني الدقيق لرحلة إغناطيوس ما زال موضع نقاش.
