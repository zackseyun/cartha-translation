  book_metadata:
    Infancy Gospel of Thomas:
      display_name: إنجيل طفولة توما
      author: مؤلف مجهول. لا تذكر أقدم صيغة يمكن استعادتها منه اسم مؤلف؛ أما نسبته إلى توما فتعود إلى عناوين المخطوطات اللاحقة وتاريخ تناقل النص.
      audience: مسيحيون مهتمون بطفولة يسوع وبكيفية سرد القدرة الإلهية والتأديب والتعلّم والنضج قبل بدء روايات الأناجيل القانونية.
      date: يُرجَّح عادة أن أصله يعود إلى القرن الثاني الميلادي، لكن النص باقٍ في عدة صيغ يونانية مختلفة اختلافًا كبيرًا وفي ترجمات مبكرة.
    Acts of Paul and Thecla:
      display_name: أعمال بولس وتكلا
      author: مؤلف مجهول. وهو فصل من مؤلَّف «أعمال بولس» الأكبر؛ ولا يمكن الاستناد بثقة إلى خبر قديم يفيد بأن قسيسًا ألّف هذا العمل لتحديد هوية المؤلف.
      audience: مسيحيون تجذبهم قصص الكرازة الرسولية والعزوبة والمعمودية والثبات الشبيه بثبات الشهداء، وسلطة امرأة على التعليم والشهادة.
      date: أُلّف في القرن الثاني الميلادي، وربما في نصفه الأخير؛ وقد جرى تداوله ضمن «أعمال بولس» وكذلك بوصفه عملًا مستقلًا.
    Gospel of Peter:
      display_name: إنجيل بطرس
      author: مؤلف مجهول. تتكلم الرواية الباقية بلسان بطرس وقد نُقلت تحت اسمه، لكنها لا تُعَدّ من تأليف الرسول بطرس التاريخي.
      audience: مسيحيون أوائل اهتموا برواية موسعة للآلام والقيامة، وربما كانوا ضمن جماعات كانت فيها سلطة بطرس تحظى بثقل خاص.
      date: يؤرَّخ عادة بالقرن الثاني الميلادي؛ أما القطعة اليونانية الرئيسية الباقية فتعود إلى مخطوطة متأخرة جدًا عُثر عليها في أخميم.
    2 Clement:
      display_name: كليمنضس الثانية
      author: مؤلف مجهول. على الرغم من عنوانه التقليدي، فهذا النص عظة مسيحية مبكرة، لا رسالة ثانية كتبها كليمنضس الروماني.
      audience: جماعة مسيحية تُحَثّ على التوبة والثبات الأخلاقي ورعاية الضعفاء، وعلى الأمانة والمثابرة رجاء القيامة والدينونة.
      date: يؤرَّخ عادة بالنصف الأول أو منتصف القرن الثاني الميلادي (نحو 100–160م)؛ ومكان تأليفه غير مؤكد.
    Epistle of Barnabas:
      display_name: رسالة برنابا
      author: مؤلف مجهول. ارتبط هذا العمل تقليديًا ببرنابا رفيق بولس، لكن الدراسات الحديثة لا تقبل هذه النسبة.
      audience: مسيحيون من الأمم يتلقون تعليمًا يجعلهم يتبنون أسفار إسرائيل المقدسة من خلال تفسير متعلق بالمسيح وتفسير رمزي، مع تمييز هويتهم العهدية عن الممارسات اليهودية.
      date: يؤرَّخ عادة بالفترة الممتدة من دمار هيكل أورشليم سنة 70م إلى أوائل القرن الثاني، وغالبًا بنحو 80–130م.
