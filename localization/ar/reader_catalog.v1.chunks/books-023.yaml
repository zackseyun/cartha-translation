payload:
  book_metadata:
    Gospel of Mary:
      display_name: إنجيل مريم
      author: مجهول. يعرض العمل مريم بوصفها متلقية لوحي يسوع ومفسرة له، لكنه لا يدّعي أن مريم كتبت الإنجيل الباقي.
      audience: قراء مسيحيون أوائل يصارعون مسائل الوحي، والارتقاء الروحي، والسلطة الرسولية، ومشروعية تعليم مريم بين تلاميذ يسوع.
      date: يؤرَّخ عادةً بالقرن الثاني الميلادي؛ وقد بقيت منه شذرات يونانية من القرن الثالث، أما الشاهد القبطي الرئيس فمحفوظ في مخطوطة برلين 8502 العائدة إلى القرن الخامس.
    Treatise on the Resurrection:
      display_name: مقالة في القيامة
      author: مجهول. صيغ العمل في هيئة رسالة من معلم إلى تلميذ اسمه ريغينوس؛ ولا يمكن التحقق بثقة من هوية المعلم أو ريغينوس.
      audience: مسيحيون يطلبون إرشادًا بشأن القيامة، ولا سيما القراء الذين يوازنون بين القيامة الجسدية والروحية والمشاركة الحاضرة في حياة القيامة.
      date: يوضع عادةً في أواخر القرن الثاني الميلادي (غالبًا نحو 170–200م)؛ وهو محفوظ في نسخة قبطية من القرن الرابع لعمل يوناني أقدم.
    Dialogue of the Savior:
      display_name: حوار المخلّص
      author: مجهول. يضع الحوار تعليمًا كشفيًا على لسان يسوع في حديث مع يهوذا ومتى ومريم، لكنه لا يحدد هوية من جمعه.
      audience: جماعة مسيحية مبكرة مهتمة بالوحي الخاص، والتلمذة، ومعرفة الذات، والصلاة، والاستعداد الزهدي للخلاص.
      date: يُنسب عادةً إلى القرن الثاني الميلادي، مع بقاء طبقاته التأليفية وتاريخه الدقيق موضع خلاف؛ وهو محفوظ في مخطوط قبطي من القرن الرابع.
    Exegesis on the Soul:
      display_name: تفسير النفس
      author: مجهول. المؤلف واعظ مسيحي يعيد قراءة صور من الكتاب المقدس والأدب اليوناني بوصفها تمثيلًا رمزيًا لسقوط النفس وتوبتها واستعادتها.
      audience: مسيحيون على دراية بالكتاب المقدس والوعظ الأخلاقي، دُعوا إلى ترك الرغبة المنفلتة والتوبة والاتحاد من جديد بالإلهي.
      date: يؤرَّخ عمومًا بأواخر القرن الثاني أو أوائل القرن الثالث الميلادي؛ وهو محفوظ في ترجمة قبطية عن اليونانية من القرن الرابع.
    Book of Thomas the Contender:
      display_name: كتاب توما المجاهد
      author: مجهول. يربط عنوانه الختامي العمل بيهوذا توما ويسمي متّياس مدوِّنًا، لكن هذه نسب أدبية لا ادعاءات تأليف يمكن التحقق منها.
      audience: مسيحيون ذوو نزعة زهدية يُحثّون على طلب معرفة الذات، ومقاومة شهوات الجسد، وفهم تعليم يسوع الخاص لتوما.
      date: يؤرَّخ غالبًا بأواخر القرن الثاني أو أوائل القرن الثالث الميلادي، وربما نشأ في بيئة مسيحية سورية؛ وهو محفوظ في مخطوط قبطي من القرن الرابع.
    Tripartite Tractate:
      display_name: المقالة الثلاثية
      author: مجهول. كان المؤلف لاهوتيًا مسيحيًا فالنتينيًا رفيع الثقافة؛ ولا يمكن التحقق من مطابقته لأي معلم معروف الاسم.
      audience: جماعة مسيحية فالنتينية تتلقى تعليمًا مطولًا عن الله، والدهور، والخلق، والمسيح، والكنيسة، والخلاص، والاستعادة النهائية.
      date: يؤرَّخ عادةً بالقرن الثالث الميلادي، مع وجود آراء ترجّح نصفه الثاني؛ وهو محفوظ بالقبطية في مخطوطة يونغ من القرن الرابع.
    Apocryphon of John:
      display_name: كتاب يوحنا السري
      author: مجهول. ينسب العمل على نحو مستعار وحيًا من يسوع القائم إلى يوحنا بن زبدي، وقد بقي في أكثر من صيغة نصية قديمة.
      audience: مسيحيون ضمن تقليد سيثي أو تقليد كشفي وثيق الصلة به، يطلبون رواية عن العالم الإلهي، والخلق، وهوية الإنسان، والتحرر من الحكام المعادين.
      date: يُرجَّح أن صيغة مبكرة منه كانت متداولة في القرن الثاني الميلادي؛ أما الشواهد القبطية الباقية، التي تحفظ صيغتين أقصر وأطول، فتعود إلى القرنين الرابع والخامس.
