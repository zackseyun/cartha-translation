  book_metadata:
    James:
      display_name: يعقوب
      author: يُنسب تقليديًا إلى يعقوب أخي يسوع؛ وينقسم الباحثون المعاصرون بين القول بصحة هذه النسبة والقول بأنه كُتب باسم يعقوب.
      audience: الجماعات اليهودية المسيحية في الشتات.
      date: نحو خمسينيات أو ستينيات القرن الأول الميلادي إن صحت نسبته؛ أو نحو أواخر القرن الأول الميلادي إن كان مكتوبًا باسم يعقوب.
    1 Peter:
      display_name: بطرس الأولى
      author: تُنسب تقليديًا إلى الرسول بطرس، مع سلوانس ككاتبٍ له؛ ويرى بعض الباحثين أنها كُتبت باسم بطرس.
      audience: المسيحيون في آسيا الصغرى الرومانية ممن كانوا يواجهون عداءً اجتماعيًا.
      date: نحو ستينيات القرن الأول الميلادي إن كانت لبطرس؛ أو نحو سبعينيات إلى تسعينيات القرن الأول الميلادي إن كانت مكتوبة باسمه.
    2 Peter:
      display_name: بطرس الثانية
      author: تُنسب تقليديًا إلى بطرس؛ ويرى قطاع واسع من الباحثين المعاصرين أنها كُتبت باسمه.
      audience: مسيحيون يواجهون ساخرين ينكرون المجيء الثاني.
      date: نحو أوائل القرن الثاني الميلادي.
    1 John:
      display_name: يوحنا الأولى
      author: كاتبها مجهول؛ وتُنسب تقليديًا إلى الرسول يوحنا أو إلى الشيخ المنتمي إلى التقليد اليوحناوي.
      audience: الجماعة اليوحناوية بعد انقسام، في سياق تحديد مَن ينتمي إليها.
      date: نحو 90–110م.
    2 John:
      display_name: يوحنا الثانية
      author: «الشيخ».
      audience: جماعة مسيحية محددة («السيدة المختارة») يجري تحذيرها من المعلمين الكذبة.
      date: نحو 90–110م.
    3 John:
      display_name: يوحنا الثالثة
      author: «الشيخ».
      audience: غايوس، وهو قائد كان يستضيف المبشرين المتنقلين.
      date: نحو 90–110م.
    Jude:
      display_name: يهوذا
      author: تُنسب تقليديًا إلى يهوذا، أخي يعقوب ويسوع.
      audience: جماعات مسيحية يتسلل إليها معلمون مستبيحون.
      date: نحو ستينيات إلى تسعينيات القرن الأول الميلادي.
    Revelation:
      display_name: الرؤيا
      author: يوحنا البطمسي (ويختلف أسلوبه عن أسلوب الإنجيل الرابع).
      audience: سبع جماعات مسيحية في آسيا الصغرى الرومانية كانت ترزح تحت ضغط الإمبراطورية.
      date: نحو تسعينيات القرن الأول الميلادي، ويُربط تقليديًا بعهد دوميتيانوس.
    Tobit:
      display_name: طوبيا
      author: كاتبها مجهول.
      audience: يهود الشتات الذين يتلمسون سبيل التقوى والزواج والعناية الإلهية في ظل حكم أجنبي.
      date: نحو 225–175ق.م.؛ أُلّف بالآرامية، كما تشهد مخطوطات قمران أيضًا على وجود نسخة عبرية.
    Judith:
      display_name: يهوديت
      author: كاتبها مجهول.
      audience: اليهود في مواجهة تهديد أجنبي — وهي قصة جريئة عن المقاومة القائمة على التقوى.
      date: نحو 150–100ق.م.
    Greek Additions to Esther:
      display_name: تتمات أستير اليونانية
      author: كاتبها مجهول؛ وهي مواد تكميلية أُضيفت إلى الترجمة اليونانية لسفر أستير.
      audience: اليهود الناطقون باليونانية الذين أرادوا رواية لأستير تتضمن صلاة صريحة وإشارات واضحة إلى الله.
      date: نحو القرن الثاني إلى القرن الأول قبل الميلاد.
    Wisdom of Solomon:
      display_name: حكمة سليمان
      author: كاتبها مجهول؛ ونُسبت إلى سليمان على غير الحقيقة. ألّفها باليونانية كاتب يهودي هلنستي، يُرجح أنه كان في الإسكندرية.
      audience: اليهود الهلنستيون المنخرطون في حوار مع الفلسفة اليونانية، والمدافعون عن حكمة إسرائيل في مواجهة البدائل الوثنية والمرتدة.
      date: نحو 50ق.م.–50م.
