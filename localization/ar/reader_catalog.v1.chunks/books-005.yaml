  verdict: revise
  review_summary: راجعت الحقول كافة وصححت الصياغات التي كانت أقل دقة من المصدر، ولا سيما مدى تاريخ سفر أيوب، و«فادي» أيوب، وعبارات محددة في عناوين الفصول. جميع المفاتيح والبنية محفوظة.
  issues:
  - تصحيح تاريخ أيوب من صياغة توحي بقرنين منفصلين إلى مدى «من القرن السادس إلى القرن الرابع ق.م.»، وفق المصدر.
  - تصحيح عنوان أيوب 19 ليترجم Redeemer إلى «فاديه»، وعنوان أيوب 20 ليشير إلى هلاك الأشرار.
  - تحسينات دلالية طفيفة في بيانات عزرا والمزامير، وفي عناوين قليلة لتطابق المصدر بدقة.
