      date: يرجح الرأي السائد في دراسة تقليد الحكمة أن الكتاب يعود إلى نحو الفترة من القرن السادس إلى القرن الرابع ق.م.، مع اعتماده على مادة شعبية أقدم.
    Psalms:
      display_name: المزامير
      author: مؤلفون متعددون على مدى قرون؛ وتذكر العناوين داود وآساف وقورح وسليمان وموسى وآخرين.
      audience: إسرائيل وجماعة الهيكل في العبادة، وكل جماعة لاحقة في الصلاة والرثاء.
      date: أُلِّفت المزامير بين نحو القرن العاشر والقرن الثالث ق.م.، وجُمعت في صورتها النهائية في فترة ما بعد السبي.
