payload:
  book_metadata:
    Joel:
      display_name: يوئيل
      author: يوئيل بن فثوئيل.
      audience: يهوذا بعد السبي، وهي تستجيب لوباء الجراد بوصفه علامة على يوم الرب.
      date: على الأرجح نحو القرنين الخامس والرابع ق.م.
    Amos:
      display_name: عاموس
      author: عاموس من تقوع، راعٍ من يهوذا وعظ في المملكة الشمالية.
      audience: إسرائيل الشمالية في عهد يربعام الثاني، خلال فترة من الازدهار والظلم.
      date: نحو 760–750 ق.م.
    Obadiah:
      display_name: عوبديا
      author: عوبديا.
      audience: يهوذا بعد أن خانت أدوم أورشليم — نبوءة بسقوط أدوم.
      date: بعد سنة 586 ق.م. بوقت قصير.
    Jonah:
      display_name: يونان
      author: مؤلف مجهول؛ والشخصية الرئيسة هي يونان بن أمتاي.
      audience: إسرائيل بعد السبي — توبيخ ساخر للانغلاق العرقي، وتأكيد لرحمة الله تجاه الغرباء.
      date: على الأرجح نحو القرنين الخامس والرابع ق.م.
    Micah:
      display_name: ميخا
      author: ميخا المورشتي.
      audience: يهوذا في أواخر القرن الثامن ق.م.، ولا سيما فقراؤها الريفيون في مواجهة نخب المدن.
      date: نحو 740–700 ق.م.
    Nahum:
      display_name: ناحوم
      author: ناحوم الألقوشي.
      audience: يهوذا وهي تحتفل بقرب سقوط نينوى.
      date: قبيل سنة 612 ق.م.
    Habakkuk:
      display_name: حبقوق
      author: حبقوق.
      audience: يهوذا في مواجهة صعود بابل — حوار نبي مع الله بشأن العدل.
      date: نحو أواخر القرن السابع ق.م.
    Zephaniah:
      display_name: صفنيا
      author: صفنيا بن كوشي.
      audience: يهوذا في عهد يوشيا، عشية إصلاحاته.
      date: نحو 640–609 ق.م.
    Haggai:
      display_name: حجّي
      author: حجّي.
      audience: العائدون من السبي الذين يعيدون بناء الهيكل في عهد داريوس.
      date: 520 ق.م.
    Zechariah:
      display_name: زكريا
      author: زكريا بن برخيا؛ ومن المرجح أن الإصحاحات 9–14 كتبها مؤلف لاحق.
      audience: العائدون من السبي الذين يعيدون بناء الهيكل، ثم جماعات لاحقة بعد السبي.
      date: الإصحاحات 1–8 نحو 520–518 ق.م.؛ وربما كُتبت الإصحاحات 9–14 بعد ذلك بنحو قرن.
    Malachi:
      display_name: ملاخي
      author: مؤلف مجهول؛ واسم «ملاخي» يعني «رسولي».
      audience: يهوذا بعد السبي، إذ أخذت تتراخى في العبادة والأمانة تحت الحكم الفارسي.
      date: نحو منتصف القرن الخامس ق.م.
    Matthew:
      display_name: متى
      author: مؤلف مجهول؛ وينسبه التقليد إلى الرسول متى. ويرى البحث الحديث أن مؤلفه مسيحي يهودي ناطق باليونانية، اعتمد على مرقس ومصدر شبيه بالمصدر «ق».
      audience: جماعة مسيحية يهودية تصارع لفهم جوانب الاستمرار والانقطاع بينها وبين اليهودية المرتبطة بالمجمع.
      date: نحو 80–90 م.
    Mark:
      display_name: مرقس
      author: مؤلف مجهول؛ ويربطه التقليد بيوحنا مرقس، رفيق بطرس في أسفاره.
      audience: جماعة مسيحية ناطقة باليونانية، ربما في روما، كانت تحت تهديد الاضطهاد أو قريبة منه.
      date: نحو 65–75 م.، في زمن قريب من الحرب اليهودية ودمار الهيكل.
