review:
  verdict: revise
  review_summary: 'أُكملت مراجعة الحقول كافة. صُحّحت صيغتان في وصف الجمهور لتطابقا المصدر: العائدون في حجّي «يعيدون بناء» الهيكل، والمجتمعات اللاحقة في زكريا «بعد السبي» لا «لعصر السبي».'
  issues:
  - 'حجّي: مسودة الجمهور جعلت إعادة بناء الهيكل حدثًا مكتملًا بدل كونه جاريًا.'
  - 'زكريا: مسودة الجمهور وصفت المجتمعات اللاحقة بأنها «لعصر السبي»، خلاف المصدر الذي يحددها بأنها ما بعد السبي.'
