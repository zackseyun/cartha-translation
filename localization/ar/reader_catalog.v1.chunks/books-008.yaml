      author: مؤلفون متعددون على مدى قرون؛ ترتبط الأصحاحات 1–39 بإشعياء الأورشليمي في القرن الثامن قبل الميلاد، بينما يستجيب القسم 40–55 («إشعياء الثاني») والقسم 56–66 («إشعياء الثالث») للسبي والعودة.
      audience: يهوذا في ظل التهديد الآشوري، ثم السبي البابلي، ثم الاستعادة بعد السبي، على التوالي.
      date: أُلِّف على امتداد الفترة من نحو أواخر القرن الثامن إلى القرن الخامس قبل الميلاد.
