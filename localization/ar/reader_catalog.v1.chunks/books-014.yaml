    Sirach:
      display_name: سيراخ
      author: يشوع بن ألعازار بن سيرا، من أورشليم؛ وترجمه إلى اليونانية حفيده.
      audience: شبان يهود كانوا يتلقون تدريبًا على الحكمة في أورشليم خلال العصر الهلنستي.
      date: الأصل العبري نحو 195–175 ق.م.؛ والترجمة اليونانية نحو 132 ق.م.
    Baruch:
      display_name: باروخ
      author: مؤلف مجهول؛ نُسب الكتاب باسم مستعار إلى باروخ، كاتب إرميا.
      audience: يهود الشتات الذين يتأملون في السبي والتوبة والحكمة.
      date: نحو القرن الثاني ق.م.
    1 Maccabees:
      display_name: المكابيين الأول
      author: مؤلف مجهول، يُرجَّح أنه من أورشليم وكتب بالعبرية (ولم يبقَ إلا النص اليوناني).
      audience: اليهود في أثناء ثورة الحشمونيين وبعدها، مع سرد يبيّن شرعية السلالة الحشمونية.
      date: نحو 100 ق.م.
    2 Maccabees:
      display_name: المكابيين الثاني
      author: مُلخِّص مجهول لعمل أطول ألّفه ياسون القيرواني؛ وقد صيغ باليونانية.
      audience: يهود الشتات الناطقون باليونانية، مع التشديد على الاستشهاد والعناية الإلهية والقيامة.
      date: نحو 124 ق.م. أو بعد ذلك بقليل.
