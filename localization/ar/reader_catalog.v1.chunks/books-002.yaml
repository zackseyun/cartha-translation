  book_metadata:
    Numbers:
      display_name: العدد
      author: مجهول؛ ويُنسب تقليديًا إلى موسى.
      audience: إسرائيل في ترحالها بين مصر وأرض الموعد — جيل البرية، والقراء اللاحقون الذين يتعلمون من إخفاقاته.
      date: طبقات تأليفية تعود إلى الفترة الممتدة من أواخر العهد الملكي حتى ما بعد السبي (نحو القرنين السابع إلى الخامس ق.م.).
    Deuteronomy:
      display_name: التثنية
      author: مجهول؛ ويُقدَّم في صورة خطب موسى الوداعية. ويربط البحث الحديث نواةً منه بالإصلاح الذي جرى في أواخر القرن السابع ق.م. في عهد يوشيا.
      audience: إسرائيل وهي تستعد لدخول الأرض — وكذلك المسبيون لاحقًا، إذ تساءلوا كيف يعيشون بأمانة من دون هيكل أو ملك.
      date: تعود نواته إلى أواخر القرن السابع ق.م. تقريبًا؛ وبلغ صورته النهائية في فترة السبي.
    Joshua:
      display_name: يشوع
      author: مجهول؛ وهو جزء من التاريخ التثنوي.
      audience: إسرائيل في عهدي الملكية والسبي، وهي تتأمل في الغزو والعهد ومعنى الأرض.
      date: جُمِع نحو القرنين السابع والسادس ق.م. من تقاليد أقدم.
