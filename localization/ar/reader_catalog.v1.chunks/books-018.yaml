  book_metadata:
    2 Esdras:
      display_name: عزرا الثاني
      author: مؤلف مجهول، مع إطار حرّره مسيحيون يحيط بنواة يهودية في الأصل (عزرا الرابع، الفصول 3–14).
      audience: اليهود بعد سنة 70م ممن كانوا يتصارعون مع مسألة عدل الله في وجود الشر؛ ثم وُسِّع لاحقًا لقراء مسيحيين.
      date: تعود النواة اليهودية إلى نحو سنة 100م؛ وتعود الإضافات المسيحية إلى نحو القرنين الثاني والثالث الميلاديين.
    Didache:
      display_name: الديداخي
      author: مؤلف مجهول (يعني العنوان «تعليم الرسل الاثني عشر»).
      audience: الجماعات المسيحية الأولى — وهو دليل موجز في الأخلاق والمعمودية والإفخارستيا والمعلّمين المتجولين.
      date: نحو أواخر القرن الأول إلى أوائل القرن الثاني الميلادي.
    Gospel of Thomas:
      display_name: إنجيل توما
      author: مؤلف مجهول؛ وتنسب المقدمة مجموعة الأقوال إلى «ديديموس يهوذا توما». لم يبقَ النص كاملًا إلا في ترجمة قبطية من القرن الرابع عُثر عليها في نجع حمادي (NHC II,2)، إلى جانب ثلاث شذرات يونانية من أوكسيرينخوس.
      audience: قراء مسيحيون تأثروا بالحكمة السورية وبالفكر الغنوصي المبكر، واهتموا بمعرفة الذات الباطنية في أقوال يسوع.
      date: يُرجَّح أن الأصل اليوناني يعود إلى نحو 50–140م؛ أما المخطوطة القبطية فتعود إلى نحو سنة 340م.
      summary: إنجيل توما مجموعة من الأقوال المنسوبة إلى يسوع. ولا يروي قصة متصلة، بل يدعو القراء مرارًا إلى اكتشاف معنى الأقوال.
