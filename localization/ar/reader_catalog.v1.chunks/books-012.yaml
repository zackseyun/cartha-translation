payload:
  book_metadata:
    1 Corinthians:
      display_name: كورنثوس الأولى
      author: بولس، ومعه سوستانيس.
      audience: الجماعة المسيحية المنقسمة في كورنثوس.
      date: نحو 53–55م، كُتبت من أفسس.
    2 Corinthians:
      display_name: كورنثوس الثانية
      author: بولس، ومعه تيموثاوس.
      audience: جماعة كورنثوس، بعد نزاع مؤلم.
      date: نحو 55–56م.
    Galatians:
      display_name: غلاطية
      author: بولس.
      audience: الجماعات المسيحية في غلاطية (وسط الأناضول) التي كانت تتعرض لضغوط كي تقبل الختان وحفظ التوراة.
      date: نحو 48–55م (موضع خلاف).
    Ephesians:
      display_name: أفسس
      author: بولس، أو تلميذ مقرّب كتب باسم بولس (موضع خلاف).
      audience: قراء مسيحيون بوجه عام في آسيا؛ واسم المكان «أفسس» غير وارد في أقدم المخطوطات.
      date: نحو ستينيات القرن الأول الميلادي إن كانت لبولس؛ ونحو ثمانينياته أو تسعينياته إن كُتبت باسم مستعار.
    Philippians:
      display_name: فيلبي
      author: بولس، ومعه تيموثاوس.
      audience: الجماعة المسيحية في فيلبي، وهي مستعمرة رومانية في مقدونية.
      date: نحو 60–62م، كُتبت من السجن.
    Colossians:
      display_name: كولوسي
      author: بولس، ومعه تيموثاوس — أو تلميذ مقرّب كتب باسم بولس (موضع خلاف).
      audience: المسيحيون في كولوسي بوادي ليكوس، وكانوا يواجهون تعليماً توفيقياً يمزج بين معتقدات مختلفة.
      date: نحو 60–62م إن كانت لبولس؛ وفي وقت لاحق إن كُتبت باسم مستعار.
    1 Thessalonians:
      display_name: تسالونيكي الأولى
      author: بولس، ومعه سلوانس وتيموثاوس.
      audience: الجماعة المسيحية الناشئة في تسالونيكي، وكانت تواجه الاضطهاد.
      date: نحو 50–51م — ويُرجّح أنها أقدم رسائل بولس الباقية.
    2 Thessalonians:
      display_name: تسالونيكي الثانية
      author: بولس (موضع خلاف؛ يرى بعض الباحثين أنها كُتبت باسمه).
      audience: جماعة تسالونيكي، لمعالجة الالتباس المتعلق بأحداث نهاية الزمان.
      date: نحو 51م إن كانت لبولس.
    1 Timothy:
      display_name: تيموثاوس الأولى
      author: بولس، أو تلميذ كتب باسم بولس (ويرى كثيرون أن الرسائل الرعوية كُتبت باسم مستعار).
      audience: تيموثاوس بصفته مندوب بولس في أفسس؛ وهي دليل إرشادي لتنظيم الكنيسة في مرحلة لاحقة.
      date: نحو منتصف ستينيات القرن الأول الميلادي إن كانت لبولس؛ ونحو 90–110م إن كُتبت باسم مستعار.
    2 Timothy:
      display_name: تيموثاوس الثانية
      author: بولس، أو تلميذ كتب باسم بولس.
      audience: تيموثاوس — وقد صيغت بوصفها رسالة وداع من بولس في السجن.
      date: نحو منتصف ستينيات القرن الأول الميلادي إن كانت لبولس؛ ونحو 90–110م إن كُتبت باسم مستعار.
    Titus:
      display_name: تيطس
      author: بولس، أو تلميذ كتب باسم بولس.
      audience: تيطس بصفته مندوب بولس في كريت.
      date: نحو منتصف ستينيات القرن الأول الميلادي إن كانت لبولس؛ ونحو 90–110م إن كُتبت باسم مستعار.
    Philemon:
      display_name: فليمون
      author: بولس، ومعه تيموثاوس.
      audience: فليمون، وهو مسيحي مالك لعبد، بشأن عبده الهارب أنسيمس.
      date: نحو 60–62م.
    Hebrews:
      display_name: العبرانيين
      author: مجهول. نسبها التقليد إلى بولس وأبلوس وبرنابا وبريسكلا وغيرهم؛ ولم يحظَ أي اقتراح بإجماع.
      audience: مسيحيون يهود ناطقون باليونانية كانوا معرضين للابتعاد عن اعترافهم المسيحي.
      date: نحو 60–95م.
