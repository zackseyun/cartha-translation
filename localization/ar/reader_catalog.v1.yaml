    author: مؤلف مجهول. يظهر العنوان في خاتمة المخطوطة، لكن العمل لا يذكر أن فيلبس هو كاتبه. والنسخة الوحيدة الباقية هي النص القبطي في مخطوطة نجع حمادي الثانية، 3.
    audience: جماعة مسيحية مبكرة كانت على دراية بتعليم أسراري على نمط فالنتيني، ولا سيما ما يتعلق بالمعمودية والمسحة والإفخارستيا والفداء والقيامة وصور حجرة العرس.
