    display_name: الرسالة إلى ديوغنيتوس
    author: مجهول. يصف الكاتب نفسه بأنه تلميذ أو متعلّم، لكن لا يمكن التحقق على نحو موثوق من هويته ولا من هوية ديوغنيتوس المخاطَب.
    audience: باحث مثقف غير مسيحي—وقرّاء مثله—يسأل عن العبادة المسيحية والأخلاق والهوية الاجتماعية والمحبة وما يبدو من حداثة الإيمان.
    date: تُؤرَّخ غالبًا بأواخر القرن الثاني أو أوائل القرن الثالث الميلادي، مع تفاوت كبير بين الآراء؛ وقد يكون الفصلان الأخيران مأخوذين من مؤلَّف آخر.
