book_localizations:
- source_title: Genesis
  title: التكوين
  author: مجهول؛ وينسبه التقليد إلى موسى. ويرى البحث الحديث أن له تاريخًا تأليفيًا طويلًا، جُمعت خلاله مصادر ثم حُرّرت معًا في وقت لاحق.
  audience: إسرائيل في هويته القائمة على العهد، إذ يرسّخ قصة نشأة الشعب في خلق الله واختياره ووعده.
  date: تألّف عبر قرون، ووصل إلى الصيغة التي وصل بها إلينا نحو القرنين السادس والخامس قبل الميلاد، أثناء السبي البابلي أو بعده.
  summary: يروي سفر التكوين قصة الخلق، وتمرد البشر وتشتتهم، وقصة عائلة إبراهيم وإسحاق ويعقوب ويوسف، التي تبدأ من خلالها وعود الله العهدية لإسرائيل.
- source_title: John
  title: يوحنا
  author: مجهول؛ وينسبه التقليد إلى الرسول يوحنا أو «التلميذ المحبوب».
  audience: جماعة مسيحية كانت في توتر مع يهودية المجمع، وتكوّنت حول شهادة التلميذ المحبوب.
  date: نحو 90–110م.
  summary: يقدّم يوحنا يسوع بوصفه الكلمة الأزلي الذي يعلن الآب، ويمنح الحياة من خلال الإيمان به، ويتمجّد من خلال آياته وموته وقيامته.
- source_title: Gospel of Thomas
  title: إنجيل توما
  author: مجهول؛ وتنسب فاتحة مجموعة الأقوال هذه إلى «ديديموس يهوذا توما». ولا يبقى النص كاملًا إلا في ترجمة قبطية من القرن الرابع عُثر عليها في نجع حمادي (NHC II,2)، إلى جانب ثلاث قصاصات يونانية من أوكسيرينخوس.
  audience: قراء مسيحيون تشكّلت قراءتهم بحكمة سريانية ونزعات غنوصية أولية، وتتجه إلى معرفة باطنية للذات في أقوال يسوع.
  date: يُرجَّح أن الأصل اليوناني يعود إلى نحو 50–140م؛ أما المخطوطة القبطية فتعود إلى نحو 340م.
  summary: إنجيل توما مجموعة من الأقوال المنسوبة إلى يسوع. ولا يشتمل على قصة متصلة، بل يدعو القراء مرارًا إلى اكتشاف معنى الأقوال.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: التكوين 1:1
  text: عندما بدأ الله يخلق السماوات والأرض[أ]—
  translator_note: '[أ] تعدّ الترجمة التقليدية هذه العبارة جملة مكتملة: «في البدء خلق الله السماوات والأرض». لكن تركيب العبرية يقدّم، على نحو أرجح، تمهيدًا لما يلي، ويكون الفعل الرئيس «قال الله» في الآية 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: الجامعة 1:2
  text: «بخار الأبخرة[أ]»، يقول قوهلت[ب]. «كل شيء بخار—قصير الأمد، يستحيل الإمساك به، وكثيرًا ما يأتي على غير ما نتوقع».
  translator_note: '[أ] تعني الكلمة العبرية «هڤِل» حرفيًا نفَسًا أو بخارًا. وهي تصف في سفر الجامعة ما يزول سريعًا، وما لا يمكن الإمساك به أو فهمه تمامًا، وما تؤول نتائجه كثيرًا إلى غير ما يتوقعه الناس. ويحافظ لفظ «بخار» على هذه الصورة من غير أن يزعم أن لا شيء له معنى. ومن الترجمات الممكنة أيضًا: «نفَس»، و«مجرد نفَس»، و«زائل». [ب] «قوهلت» هو اسم المؤلف بالعبرية أو لقبه. وكثيرًا ما يُترجم إلى «المعلّم» أو «الواعظ»، لكننا أبقينا «قوهلت» ليتسع لكل المعاني الممكنة من غير ترجيح تفسير بعينه.'
- source_path: nt/john/001/001.yaml
  reference: يوحنا 1:1
  text: في البدء[ب]، كانت الكلمة موجودة سلفًا. وكانت الكلمة مع الله، وكانت الكلمة الله.[أ]
  translator_note: '[أ] أو: «كانت الكلمة إلهية»، أو: «ما كانه الله، كانت الكلمة». يؤكد التركيب اليوناني أن الكلمة هي الله على نحو كامل، مع تمييز الكلمة من الله في العبارة السابقة. [ب] تردّد هذه الافتتاحية صدى التكوين 1:1، وتربط الكلمة ببدء الخليقة. وعبارة «موجودة سلفًا» توضّح أن الكلمة كانت موجودة حين جاء البدء، لا أنها بدأت توجد عندئذ؛ ويمكن أيضًا ترجمتها: «كانت» أو «كانت موجودة».'
- source_path: nt/romans/003/025.yaml
  reference: رومية 3:25
  text: قدّمه الله ذبيحةً للتكفير[أ] من خلال الإيمان بدمه[ب]. فعل ذلك ليُظهر برَّه[ج]، لأنه كان قد تجاوز عن الخطايا التي ارتُكبت في الماضي.
  translator_note: '[أ] أو: «استرضاء»؛ أو: «غطاء الكفارة»، أي الغطاء الذهبي لتابوت العهد الذي كان يُرش عليه دم التكفير في العهد القديم. [ب] أو: «من خلال الإيمان، بدمه». [ج] أو: «عدله».'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 بطرس 1:13
  text: لذلك هيّئوا أذهانكم للعمل.[أ] وكونوا صاحين تمامًا، واجعلوا رجاءكم كله في النعمة التي تُجلب إليكم عند ظهور يسوع المسيح.[ب]
  translator_note: '[أ] يقول اليوناني حرفيًا: «شدّوا أحقاء أذهانكم». وتستحضر الصورة جمع الثياب الطويلة وشدّها عند الخصر استعدادًا للعمل؛ لذلك تنقل العبارة معنى الاستعداد الذهني والتهيؤ للفعل. [ب] قد تتصل الكلمة اليونانية المترجمة هنا بـ«تمامًا» و«كله» بكونكم صاحين، أو بجعل رجائكم، أو ربما بكليهما.'
