review:
  verdict: revise
  summary: أُجريت مراجعة شاملة للبيانات الوصفية والنصوص النقدية وواجهة القارئ. صُحِّحت مواضع أسلوبية ونحوية، ولا سيما اتساق التأنيث في «الكلمة»، ودقة بدائل الحواشي، وصياغة بعض التراجم التفسيرية، مع الحفاظ على المعنى المصدر وعدم إضافة تفسير مذهبي.
  issues:
  - 'يوحنا 1:1: صُحِّح اتساق الإحالة إلى «الكلمة» المؤنثة في العربية، وعدِّلت صياغة الحاشية لتكون سليمة ودقيقة.'
  - 'رومية 3:25: حُذفت إضافة «غضب الله» من بديل «propitiation»، لأنها ليست مذكورة في النص المصدر.'
  - '1 بطرس 1:13: عُدِّلت «النعمة الآتية» إلى صياغة تعكس النعمة «التي تُجلب إليكم»، وعدِّلت العبارة الحرفية لتكون عربية أوضح.'
  - 'سفر التكوين: صُقلت بعض العبارات الوصفية لتكون أكثر سلاسة ودقة، ومنها «الصيغة التي وصل بها إلينا» و«وعود الله العهدية».'
  - 'واجهة القارئ: عُدِّل وسم الزر «اختيار» إلى «اختر».'
