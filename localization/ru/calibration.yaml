book_localizations:
- source_title: Genesis
  title: Бытие
  author: Автор неизвестен; традиционно авторство приписывается Моисею. Согласно современной библеистике, книга складывалась в течение длительного времени из источников, позднее объединённых редакторами.
  audience: Израиль как народ завета, чья история происхождения укоренена в Божьем творении, избрании и обетовании.
  date: Книга создавалась на протяжении столетий; окончательную форму, в которой она дошла до нас, получила приблизительно в VI–V веках до н. э., во время или после вавилонского плена.
  summary: Книга Бытие повествует о сотворении мира, мятеже и рассеянии человечества, а также о семье Авраама, Исаака, Иакова и Иосифа, через которую начинаются данные Израилю заветные обетования.
- source_title: John
  title: Евангелие от Иоанна
  author: Автор неизвестен; традиция приписывает книгу апостолу Иоанну или «возлюбленному ученику».
  audience: Христианская община, находившаяся в напряжённых отношениях с синагогальным иудаизмом и сложившаяся вокруг свидетельства возлюбленного ученика.
  date: Около 90–110 годов н. э.
  summary: Евангелие от Иоанна представляет Иисуса как вечное Слово, которое открывает Отца, даёт жизнь через доверие ему и прославляется в своих знамениях, смерти и воскресении.
- source_title: Gospel of Thomas
  title: Евангелие от Фомы
  author: Автор неизвестен; во вступлении собрание изречений приписано «Дидиму Иуде Фоме». Полностью текст сохранился лишь в коптском переводе IV века из Наг-Хаммади (NHC II,2); кроме того, известны три греческих фрагмента из Оксиринха.
  audience: Христианские читатели, чьи взгляды формировались под влиянием сирийской традиции мудрости и протогностической мысли и которые были ориентированы на сокровенное самопознание через изречения Иисуса.
  date: Греческий оригинал, вероятно, относится примерно к 50–140 годам н. э.; коптская рукопись — примерно к 340 году н. э.
  summary: Евангелие от Фомы — собрание изречений, приписываемых Иисусу. В нём нет связного повествования, и оно неоднократно призывает читателей открыть смысл этих изречений.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Бытие 1:1
  text: Когда Бог начал творить небо и землю[a]…
  translator_note: '[a] Традиционный перевод понимает эти слова как законченное предложение: «В начале сотворил Бог небо и землю». Однако древнееврейский текст естественнее понимать как введение к последующему повествованию, где основное действие — «Бог сказал» — начинается в стихе 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Экклезиаст 1:2
  text: '«Пар паров[a], — говорит Кохелет[b]. — Всё — пар: мимолётный, неуловимый и часто оказывающийся не тем, чего мы ожидаем».'
  translator_note: '[a] Древнееврейское слово hevel буквально означает «дыхание» или «пар». На протяжении книги Экклезиаста оно описывает то, что быстро проходит, что невозможно удержать или до конца постичь и что часто оборачивается не так, как ожидают люди. Слово «пар» сохраняет этот образ, не утверждая, будто ничто не имеет смысла. Возможны также переводы: «дыхание», «одно лишь дыхание», «мимолётность». [b] Кохелет — древнееврейское имя или титул автора. Его часто переводят как «Учитель» или «Проповедник», но здесь сохранено «Кохелет», чтобы не отдавать предпочтения одному из возможных значений.'
- source_path: nt/john/001/001.yaml
  reference: Иоанна 1:1
  text: В начале[b] Слово уже существовало. Слово было с Богом, и Слово было Богом[a].
  translator_note: '[a] Возможные варианты: «Слово было божественным» или «каков был Бог, таково было и Слово». Греческая формулировка утверждает, что Слово всецело Бог, одновременно отличая Слово от Бога, упомянутого в предыдущей части предложения. [b] Это начало перекликается с Бытие 1:1 и связывает Слово с началом творения. Глагол в греческом тексте указывает, что Слово существовало уже тогда, когда наступило начало, а не возникло в тот момент; возможны также переводы «было» и «существовало».'
- source_path: nt/romans/003/025.yaml
  reference: Римлянам 3:25
  text: Бог представил его как искупительную жертву[a] через веру в его кровь[b]. Он сделал это, чтобы показать свою праведность[c], поскольку прежде оставлял совершённые грехи без внимания.
  translator_note: '[a] Возможные переводы: «жертва умилостивления»; или «крышка ковчега», то есть золотая крышка ковчега завета, которую в Ветхом Завете кропили искупительной кровью. [b] Или: «через веру, посредством его крови». [c] Или: «справедливость».'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Петра 1:13
  text: Поэтому приготовьте свой ум к действию[a]. Будьте совершенно трезвы умом и всецело надейтесь на благодать, даруемую вам, когда явится Иисус Мессия[b].
  translator_note: '[a] Буквально по-гречески: «препояшьте чресла вашего ума». Здесь подразумевается, как человек подбирает длинную одежду и закрепляет её на поясе, чтобы быть готовым действовать. [b] Греческое слово, переданное словами «совершенно» и «всецело», может относиться к трезвости ума, к надежде или, возможно, к тому и другому.'
