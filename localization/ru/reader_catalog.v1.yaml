  Gospel of Peter:
    display_name: Евангелие от Петра
    author: Автор неизвестен. В сохранившемся повествовании рассказ ведётся от лица Петра, и текст передавался под его именем, однако его не считают произведением исторического апостола.
    audience: Ранние христиане, интересовавшиеся расширенным повествованием о Страстях и воскресении, вероятно в общинах, где авторитету Петра придавали особое значение.
    date: Текст обычно датируют II веком н. э.; основной сохранившийся греческий фрагмент происходит из гораздо более поздней рукописи, найденной в Ахмиме.
