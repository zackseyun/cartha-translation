    author: Автор неизвестен. В диалоге учение откровения вложено в уста Иисуса, беседующего с Иудой, Матфеем и Марией, однако составитель произведения не назван.
    audience: Раннехристианский круг, проявлявший интерес к сокровенному откровению, ученичеству, самопознанию, молитве и аскетической подготовке к спасению.
    date: Обычно относится ко II веку н. э., хотя этапы составления и точная датировка остаются предметом споров; сохранился в коптской рукописи IV века.
