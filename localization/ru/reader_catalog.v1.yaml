    audience: Христиане, склонные к аскетической жизни, которых призывали стремиться к самопознанию, противостоять телесным страстям и постигать сокровенные наставления Иисуса Фоме.
    date: Часто датируется концом II или началом III века н. э. и, возможно, возникло в сирийской христианской среде; сохранилось в коптской рукописи IV века.
