  Martyrdom of Polycarp:
    display_name: Мученичество Поликарпа
    author: Неизвестные члены Смирнской церкви, писавшие от имени общины; заключительные примечания о передаче текста отражают его более позднее переписывание и распространение.
    audience: Церковь в Филомелии и более широкий круг христиан; им предлагается рассказ об аресте, суде, смерти Поликарпа и его образцовой стойкости.
    date: Написано после смерти Поликарпа; обычно произведение относят к середине или второй половине II века н. э. Точный год мученической смерти и время окончательного оформления документа остаются предметом споров.
