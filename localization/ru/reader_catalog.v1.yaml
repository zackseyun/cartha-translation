  Leviticus:
    display_name: Левит
    author: Автор неизвестен; традиционно авторство приписывается Моисею. Современные исследователи относят книгу к Священническому источнику.
    audience: Израильские священники и поклоняющаяся община — наставления о жертвоприношениях, святости и устроении жизни вокруг Божьего присутствия.
    date: Композиционные слои относятся к периоду от поздней монархии до времени после плена (приблизительно VII–V века до н. э).
