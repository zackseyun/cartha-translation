  Epistle of Barnabas:
    display_name: Послание Варнавы
    author: Автор неизвестен. Произведение традиционно связывали с Варнавой, спутником Павла, однако современные исследователи не принимают это авторство.
    audience: Христиане из язычников, которых учили воспринимать Писания Израиля посредством христологического и аллегорического толкования, отличая при этом свою идентичность в завете от иудейской религиозной практики.
    date: Обычно датируется периодом между разрушением Иерусалимского храма в 70 году н. э. и началом II века, часто приблизительно 80–130 гг.
