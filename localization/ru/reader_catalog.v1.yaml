      '5':
        title: Суд и чудеса испытывают церковь
      '6':
        title: Семь служителей помогают церкви
      '7':
        title: Стефан видит открытое небо
      '8':
        title: Евангелие достигает Самарии
      '9':
        title: Савл встречает воскресшего Иисуса
      '10':
        title: Язычники получают Святого Духа
      '11':
        title: Пётр защищает принятие язычников
      '12':
        title: Ангел освобождает Петра
      '13':
        title: Павел начинает миссию среди язычников
      '14':
        title: Павел стойко переносит гонения
      '15':
        title: Иерусалимский собор принимает язычников
      '16':
        title: Прославление Бога открывает темницу
      '17':
        title: Павел возвещает неведомого Бога
      '18':
        title: Евангелие достигает Коринфа
      '19':
        title: В Эфесе вспыхивает мятеж из-за Артемиды
      '20':
        title: Павел со слезами прощается со старейшинами
      '21':
        title: Павел возвращается в Иерусалим
      '22':
        title: Павел защищает своё призвание
      '23':
        title: Павел предстаёт перед советом
      '24':
        title: Павел свидетельствует перед Феликсом
      '25':
        title: Павел требует суда кесаря
      '26':
        title: Павел свидетельствует перед Агриппой
      '27':
        title: Бог хранит Павла во время кораблекрушения
      '28':
        title: Евангелие приходит в Рим
  Romans:
    display_name: К Римлянам
    author: Павел, с писцом Тертием.
    audience: Христиане в Риме — верующие из иудеев и язычников, между которыми возникали разногласия о Торе и религиозной принадлежности.
    date: Ок. 56–58 гг. н. э.; написано в Коринфе.
    chapters:
      '1':
        title: Павел возвещает праведность Иисуса
      '2':
        title: Суд совершается нелицеприятно
      '3':
        title: Все виновны во грехе
      '4':
        title: Авраам оправдан только верой
      '5':
        title: Праведность через смерть Христа
      '6':
        title: Живите для Бога, а не для греха
      '7':
        title: Верующие борются с грехом
      '8':
        title: Ничто не отделит нас от Христа
      '9':
        title: Милость и гнев, связанные с Израилем
      '10':
        title: Спасение близко для всех
      '11':
        title: Язычники призваны по благодати
      '12':
        title: Отдайте свою жизнь как живую жертву
      '13':
        title: Повинуйтесь властям и любите друг друга
      '14':
        title: Принимайте немощных в вере
      '15':
        title: Единство иудеев и язычников
      '16':
        title: Приветствия и предостережения
  1 Corinthians:
    display_name: 1-е послание к Коринфянам
    author: Павел вместе с Сосфеном.
    audience: Раздираемая разногласиями христианская община в Коринфе.
    date: Ок. 53–55 гг. н. э.; написано в Эфесе.
    chapters:
      '1':
        title: Верные Божьи богатства для всех
      '2':
        title: Открыта мудрость от Божьего Духа
      '3':
        title: 'Павел предостерегает коринфян: они — Божий храм'
      '4':
        title: Верность важнее гордости
      '5':
        title: Павел требует церковного взыскания
      '6':
        title: Разрешайте споры внутри церкви
      '7':
        title: Павел учит почитать брак
      '8':
        title: Любовь важнее личной свободы
      '9':
        title: Павел бескорыстно защищает своё апостольство
      '10':
        title: История Израиля предостерегает Божий народ
      '11':
        title: Единство в богослужении чтит Христа
      '12':
        title: Дары Духа созидают единство церкви
      '13':
        title: Любовь никогда не сдаётся
      '14':
        title: Павел призывает предпочесть любовь внешнему впечатлению
      '15':
        title: Христос воскресает, и смерть терпит поражение
      '16':
        title: Сбор пожертвований и планы путешествий
  2 Corinthians:
    display_name: 2-е послание к Коринфянам
    author: Павел вместе с Тимофеем.
    audience: Коринфская община после тяжёлого конфликта.
    date: Ок. 55–56 гг. н. э.
    chapters:
      '1':
        title: Божье утешение в страданиях
      '2':
        title: Призыв к любви и прощению
      '3':
        title: Преображённые жизни подтверждают служение
      '4':
        title: Возвещение славы Христа
      '5':
        title: Любовь Христа движет служением
      '6':
        title: Переносите страдания ради Бога
      '7':
        title: Стремитесь к святости в благоговении
      '8':
        title: Благодать македонян вдохновляет на щедрость
      '9':
        title: Охотно жертвуйте для святых
      '10':
        title: Заявление о кротости Христа
      '11':
        title: Ревность о верной жизни
      '12':
        title: Хвалитесь немощью и благодатью
      '13':
        title: Испытывайте себя на предмет греха
  Galatians:
    display_name: Послание к Галатам
    author: Павел.
    audience: Христианские общины в Галатии (центральная Анатолия), которых принуждали принять обрезание и соблюдать Тору.
    date: Ок. 48–55 гг. н. э. (датировка оспаривается).
    chapters:
      '1':
        title: Павел защищает своё благовестие
      '2':
        title: Павел обличает ошибку Петра
      '3':
        title: Вера Авраама оправдывает
      '4':
        title: Христос освобождает нас от Закона
      '5':
        title: Живите верой, а не Законом
      '6':
        title: Носите бремена друг друга
  Ephesians:
    display_name: Послание к Ефесянам
    author: Павел или близкий ученик, писавший от имени Павла (вопрос оспаривается).
    audience: Широкий круг христиан из провинции Азия; название «Эфес» отсутствует в древнейших рукописях.
    date: Ок. 60-х гг. н. э., если автор — Павел; ок. 80–90-х гг. н. э., если послание написано от его имени.
    chapters:
      '1':
        title: Божья благодать запечатлевает верующих
      '2':
        title: Христос приносит мир всем
      '3':
        title: Тайна открыта через Благую весть
      '4':
        title: Молитва о единстве тела Христа
      '5':
        title: Подражайте Богу и живите мудро
      '6':
        title: Дети, слушайтесь и почитайте родителей
  Philippians:
    display_name: Послание к Филиппийцам
    author: Павел вместе с Тимофеем.
    audience: Христианская община в Филиппах — римской колонии в Македонии.
    date: Ок. 60–62 гг. н. э.; написано в заключении.
    chapters:
      '1':
        title: Павел молится о филиппийцах
      '2':
        title: Иисус смирил Себя и был возвышен
      '3':
        title: Радуйтесь тому, что знаете Христа
      '4':
        title: Стойте твёрдо и радуйтесь
  Colossians:
    display_name: Послание к Колоссянам
    author: Павел вместе с Тимофеем — или близкий ученик, писавший от имени Павла (вопрос оспаривается).
    audience: Христиане в Колоссах, в долине реки Лик, столкнувшиеся с синкретическим учением.
    date: Ок. 60–62 гг. н. э., если автор — Павел; позднее, если послание написано от его имени.
    chapters:
      '1':
        title: Павел молится о вере колоссян
      '2':
        title: Павел призывает верующих держаться Христа
      '3':
        title: Оставьте грех и живите в любви
      '4':
        title: Павел просит о молитве в заключении и ободряет верующих
  1 Thessalonians:
    display_name: 1-е послание к Фессалоникийцам
    author: Павел вместе с Силуаном и Тимофеем.
    audience: Молодая христианская община в Фессалонике, подвергавшаяся преследованиям.
    date: Ок. 50–51 гг. н. э. — вероятно, самое раннее из сохранившихся посланий Павла.
    chapters:
      '1':
        title: Благодать, мир, вера, любовь и надежда
      '2':
        title: Смелая проповедь с чистыми побуждениями
      '3':
        title: Тимофей укрепляет страдающих
      '4':
        title: Павел призывает к святой жизни
      '5':
        title: Бодрствуйте в ожидании спасения
  2 Thessalonians:
    display_name: 2-е послание к Фессалоникийцам
    author: Павел (авторство оспаривается; некоторые исследователи считают, что послание написано от его имени).
    audience: Фессалоникийская община, в которой возникло непонимание вопросов о конце времён.
    date: Ок. 51 г. н. э., если автор — Павел.
    chapters:
      '1':
        title: Бог вознаграждает верных в гонениях
      '2':
        title: Отступление произойдёт прежде пришествия Христа
      '3':
        title: Павел молится о росте церкви
  1 Timothy:
    display_name: 1-е послание к Тимофею
    author: Павел или ученик, писавший от имени Павла (Пастырские послания многие считают написанными от его имени).
    audience: Тимофей как представитель Павла в Эфесе; руководство по устройству церкви более позднего времени.
    date: Ок. середины 60-х гг. н. э., если автор — Павел; ок. 90–110 гг. н. э., если послание написано от его имени.
    chapters:
      '1':
        title: Павел просит Тимофея остаться
      '2':
        title: Молитесь о правителях и живите мирно
      '3':
        title: Необходимые качества церковных руководителей
      '4':
        title: Отвергайте лжеучителей и мифы
      '5':
        title: Верно оказывайте почёт вдовам и старейшинам
      '6':
        title: Павел наставляет Тимофея о богатстве
  2 Timothy:
    display_name: 2-е послание к Тимофею
    author: Павел или ученик, писавший от имени Павла.
    audience: Тимофей; послание представлено как прощальное обращение Павла из заключения.
    date: Ок. середины 60-х гг. н. э., если автор — Павел; ок. 90–110 гг. н. э., если послание написано от его имени.
    chapters:
      '1':
        title: Тимофей, твёрдо держись благодати
      '2':
        title: Переноси страдания ради Христа
      '3':
        title: 'Избегай лжеучителей: предостережение'
      '4':
        title: Верно проповедуй всем
  Titus:
    display_name: Послание к Титу
    author: Павел или ученик, писавший от имени Павла.
    audience: Тит как представитель Павла на Крите.
    date: Ок. середины 60-х гг. н. э., если автор — Павел; ок. 90–110 гг. н. э., если послание написано от его имени.
    chapters:
      '1':
        title: Павел наставляет Тита на Крите
      '2':
        title: Учи людей всех возрастов жить по благодати
      '3':
        title: Живите смиренно в ожидании Христа
  Philemon:
    display_name: Послание к Филимону
    author: Павел вместе с Тимофеем.
    audience: Филимон, христианин-рабовладелец, в связи с его беглым рабом Онисимом.
    date: Ок. 60–62 гг. н. э.
    chapters:
      '1':
        title: Павел просит освободить Онисима
  Hebrews:
    display_name: Послание к Евреям
    author: Автор неизвестен. Традиция называла Павла, Аполлоса, Варнаву, Прискиллу и других, но ни одно предположение не получило общего признания.
    audience: Говорящие по-гречески христиане из иудеев, склонявшиеся отойти от исповедуемой ими христианской веры.
    date: Ок. 60–95 гг. н. э.
    chapters:
      '1':
        title: Бог говорит через Своего Сына
      '2':
        title: Иисус спасает через страдание
      '3':
        title: Смотрите на верного Иисуса
      '4':
        title: Войдите в обещанный Богом покой
      '5':
        title: Христос принёс совершенную жертву
      '6':
        title: Стремитесь к духовной зрелости
      '7':
        title: Иисус — священник навеки по чину Мелхиседека
      '8':
        title: Новый завет через кровь Иисуса
      '9':
        title: Иисус входит в истинное небесное святилище
      '10':
        title: Приближайтесь к Богу благодаря крови Христа
      '11':
        title: Стойкая вера предков
      '12':
        title: Переносите страдания вместе с Иисусом
      '13':
        title: Живите в любви и доверии
  James:
    display_name: Послание Иакова
    author: По традиции автором считается Иаков, брат Иисуса; современные исследователи расходятся во мнениях, написано ли послание им самим или от его имени.
    audience: Иудеохристианские общины в диаспоре.
    date: Ок. 50–60-х гг. н. э., если авторство подлинное; конец I в. н. э., если послание написано от имени Иакова.
    chapters:
      '1':
        title: Испытания закаляют стойкую веру
      '2':
        title: Вера без дел мертва
      '3':
        title: Обуздывайте язык и говорите мудро
      '4':
        title: Раздоры рождаются из себялюбия
      '5':
        title: Суд над богатыми угнетателями близок
  1 Peter:
    display_name: Первое послание Петра
    author: По традиции автором считается апостол Пётр, а Силуан — писцом; некоторые исследователи полагают, что послание написано от имени Петра.
    audience: Христиане в римской Малой Азии, сталкивавшиеся с неприязнью общества.
    date: Ок. 60-х гг. н. э., если автором был Пётр; ок. 70–90-х гг. н. э., если послание написано от его имени.
    chapters:
      '1':
        title: Надежда на небесное наследие
      '2':
        title: Верующие созидаются на живом камне
      '3':
        title: Жёны чтят Христа своей жизнью
      '4':
        title: Страдайте за добрые и праведные дела
      '5':
        title: Старейшины заботятся о пастве, подавая пример веры
  2 Peter:
    display_name: Второе послание Петра
    author: По традиции автором считается Пётр; многие современные исследователи полагают, что послание написано от его имени.
    audience: Христиане, столкнувшиеся с насмешниками, отрицавшими грядущее пришествие Христа.
    date: Ок. начала II в. н. э.
    chapters:
      '1':
        title: Пётр учит духовному возрастанию
      '2':
        title: Лжеучителей ждёт скорый суд
      '3':
        title: Пётр предупреждает о последнем суде
  1 John:
    display_name: Первое послание Иоанна
    author: Автор неизвестен; по традиции им считается апостол Иоанн или старейшина из круга Иоанна.
    audience: Община последователей Иоанна после раскола, определявшая, кто к ней принадлежит.
    date: Ок. 90–110 гг. н. э.
    chapters:
      '1':
        title: Свет открывает истинное единство
      '2':
        title: Любовь соблюдает Божьи заповеди
      '3':
        title: Рождённые от Бога побеждают грех
      '4':
        title: Истинная любовь исходит от Бога
      '5':
        title: Верующий в Иисуса имеет вечную жизнь
  2 John:
    display_name: Второе послание Иоанна
    author: «Старейшина».
    audience: Конкретная христианская община («избранная госпожа»), которую предостерегают от лжеучителей.
    date: Ок. 90–110 гг. н. э.
    chapters:
      '1':
        title: Старейшина предостерегает от лжеучителей
  3 John:
    display_name: Третье послание Иоанна
    author: «Старейшина».
    audience: Гаий, отдельный руководитель, принимавший странствующих проповедников.
    date: Ок. 90–110 гг. н. э.
    chapters:
      '1':
        title: Старейшина молится о благополучии Гаия
  Jude:
    display_name: Послание Иуды
    author: По традиции автором считается Иуда, брат Иакова и Иисуса.
    audience: Христианские общины, в которые проникали учителя, оправдывавшие распущенность.
    date: Ок. 60–90-х гг. н. э.
    chapters:
      '1':
        title: Иуда предостерегает от нечестивых пришельцев
  Revelation:
    display_name: Откровение
    author: Иоанн с острова Патмос (по стилю его книга отличается от четвёртого Евангелия).
    audience: Семь христианских общин в римской Малой Азии, испытывавших давление имперской власти.
    date: Ок. 90-х гг. н. э.; по традиции — во время правления Домициана.
    chapters:
      '1':
        title: Бог открывает Иоанну видения
      '2':
        title: Иисус обращается к семи церквам
      '3':
        title: Иисус призывает Лаодикию покаяться
      '4':
        title: Небесный престол сияет славой
      '5':
        title: Агнец принимает свиток и совершает искупление
      '6':
        title: Четыре всадника несут великие бедствия
      '7':
        title: Запечатлённые служители возносят вечную хвалу
      '8':
        title: Семь труб возвещают грозные суды
      '9':
        title: Саранча мучит грешников земли
      '10':
        title: Могучий ангел клянётся, что времени больше не будет
      '11':
        title: Два свидетеля пророчествуют и воскресают
      '12':
        title: Женщина рождает Сына, которому суждено править
      '13':
        title: Зверь выходит из моря
      '14':
        title: Агнец собирает верных вокруг Себя
      '15':
        title: Иоанн видит небесный гнев
      '16':
        title: Ангелы изливают чаши гнева
      '17':
        title: Суд над Вавилоном и торжество Бога
      '18':
        title: Небо радуется падению Вавилона
      '19':
        title: Небо празднует брачный пир Агнца
      '20':
        title: Иоанн видит последний суд
      '21':
        title: Всё становится новым
      '22':
        title: Иисус скоро придёт
  Tobit:
    display_name: Книга Товита
    author: Автор неизвестен.
