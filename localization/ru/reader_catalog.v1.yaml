    audience: Раннехристианская община, знакомая с сакраментальным наставлением валентинианского типа, особенно с учением о крещении, помазании, евхаристии, искуплении, воскресении и образе брачного чертога.
    date: Обычно произведение датируют концом II или началом III века н. э.; оно сохранилось в коптской рукописи IV века, переведённой с более раннего греческого текста.
