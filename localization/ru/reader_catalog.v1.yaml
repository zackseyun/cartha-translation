  Exegesis on the Soul:
    display_name: Толкование о душе
    author: Автор неизвестен. Это христианский проповедник, переосмысливающий библейские образы и образы греческой литературы как аллегорию падения, покаяния и восстановления души.
    audience: Христиане, знакомые с Писанием и нравственными наставлениями, которых призывали обратиться от неупорядоченных желаний к покаянию и воссоединению с божественным.
    date: Обычно датируется концом II или началом III века н. э.; сохранилось в коптском переводе с греческого, выполненном в IV веке.
