  Gospel of Judas:
    display_name: Евангелие Иуды
    author: Автор неизвестен. Заглавие связывает повествование с Иудой, однако само произведение не даёт оснований считать Иуду Искариота его историческим автором.
    audience: Христианская группа, критиковавшая жертвенные и церковные обычаи других общин и переосмыслявшая Иуду и смерть Иисуса с помощью диалогов-откровений и космологии сифианского типа.
    date: Обычно датируется серединой или концом II века н. э.; около 180 года Ириней знал некое «Евангелие Иуды», а сохранившаяся коптская рукопись, вероятно, относится к III или IV веку.
    chapters:
      '1':
        title: Иисус открывает Иуде тайны
      '2':
        title: Только Иуда приближается к Иисусу
      '3':
        title: Иисус описывает святую общину
      '4':
        title: Видение учеников обличает порочность
      '5':
        title: Иуда проклят, но отличается от других
      '6':
        title: Иисус открывает божественные миры
      '7':
        title: Иуда предаёт тело Иисуса
  Protoevangelium of James:
    display_name: Протоевангелие Иакова
    author: Автор неизвестен. Рассказчик называет себя Иаковом, однако произведение написано под чужим именем, и его автором не был Иаков, брат Иисуса.
    audience: Христиане, интересовавшиеся рождением и воспитанием Марии, её неизменной чистотой, Рождеством Иисуса и повествовательными ответами на вопросы, оставленные открытыми в Евангелиях от Матфея и Луки.
    date: Обычно датируется второй половиной II века н. э.; сохранилось во множестве более поздних греческих рукописей и древних переводов.
    chapters:
      '1':
        title: Иоаким молится в пустыне
      '2':
        title: Анна молится под лавром
      '3':
        title: Анна оплакивает своё бесплодие
      '4':
