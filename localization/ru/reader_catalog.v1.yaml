      '20':
        title: Саломея осматривает Марию и обжигается
      '21':
        title: Волхвы ищут новорождённого Царя
      '22':
        title: Ирод приказывает убить младенцев
      '23':
        title: Захарии угрожает Ирод
      '24':
        title: Захарию убивают в святилище
      '25':
        title: Иаков записывает рассказ во время смуты
      '26':
