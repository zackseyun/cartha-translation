    author: Автор неизвестен. Это произведение из Наг-Хаммади, называемое также «Священной книгой Великого Невидимого Духа», следует отличать от более раннего греческого «Евангелия египтян», известного лишь по цитатам.
    audience: Сифианская христианская община, которая выражала представления о духовной идентичности и избавлении посредством сложного мифа, священных имён, образов крещения и гимнического славословия.
    date: Обычно относится ко II или III веку н. э.; две коптские рукописи сохранились в кодексах Наг-Хаммади IV века.
    chapters:
      '1':
        title: Бог являет вечный божественный свет
      '2':
        title: Три силы исходят из Безмолвия
      '3':
        title: Отец возникает из священного Безмолвия
      '4':
        title: Небесные существа прославляют Духа
      '5':
        title: Адамас порождает всё творение
      '6':
        title: Христос утверждает бессмертный народ
      '7':
        title: Божественные силы радуются единству
      '8':
        title: Христос являет полноту величия и славы
      '9':
        title: Сиф молится о духовных потомках
      '10':
        title: София исходит из божественной мудрости
      '11':
        title: Небесные посланники оберегают род
      '12':
        title: Сиф готовит спасение через Христа
      '13':
        title: Говорящий призывает вечного невидимого Бога
      '14':
        title: Сиф записывает тайную книгу
  Letter of Peter to Philip:
    display_name: Послание Петра к Филиппу
    author: Автор неизвестен. Краткое вступительное письмо и следующее за ним откровение приписаны Петру и Филиппу псевдонимно; нет надёжных оснований считать автором кого-либо из этих апостолов.
    audience: Христиане, искавшие апостольское подтверждение учения о Спасителе, враждебных силах, страдании, миссии и восстановлении учеников.
    date: Обычно датируется концом II или началом III века н. э.; сохранилось в рукописи Наг-Хаммади IV века и в более позднем коптском списке.
    chapters:
      '1':
        title: Пётр призывает Филиппа вернуться
      '2':
        title: Апостолы молятся на Елеонской горе
      '3':
        title: Иисус объясняет божественную полноту
      '4':
        title: Правитель противится замыслу истинного Бога
      '5':
        title: Христос верой спасает заблудших
      '6':
        title: Иисус обещает вечную силу
      '7':
        title: Апостолы проповедуют вопреки гонениям
      '8':
