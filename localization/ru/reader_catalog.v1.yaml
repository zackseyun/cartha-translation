    author: Автор неизвестен. Это один из эпизодов более обширных «Деяний Павла»; древнее сообщение о том, что «Деяния» написал некий пресвитер, не позволяет достоверно установить личность автора.
    audience: Христиане, которых привлекали рассказы об апостольской проповеди, безбрачии, крещении, стойкости, подобной мученической, а также о праве женщины учить и свидетельствовать.
    date: Составлено во II веке н. э., вероятно во второй его половине; произведение распространялось и в составе «Деяний Павла», и самостоятельно.
