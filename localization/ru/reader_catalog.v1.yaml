    display_name: Евангелие египтян
    author: Автор неизвестен. Это произведение из Наг-Хаммади, называемое также «Священной книгой великого невидимого Духа», следует отличать от более раннего греческого «Евангелия египтян», известного лишь по цитатам.
    audience: Сифианская христианская община, которая выражала представления о своей духовной идентичности и избавлении с помощью насыщенного мифологического повествования, священных имён, образов крещения и гимнической хвалы.
    date: Обычно произведение относят ко II или III веку н. э.; сохранились две его коптские рукописи в кодексах из Наг-Хаммади IV века.
