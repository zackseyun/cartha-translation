    author: Автор неизвестен. В сохранившемся повествовании рассказ ведётся от лица Петра, и текст передавался под его именем, однако его не считают произведением исторического апостола.
    audience: Ранние христиане, интересовавшиеся расширенным повествованием о страстях и воскресении, вероятно в общинах, где авторитет Петра имел особое значение.
    date: Обычно датируется II веком н. э.; основной сохранившийся греческий фрагмент происходит из гораздо более поздней рукописи, найденной в Ахмиме.
