  Infancy Gospel of Thomas:
    display_name: Евангелие детства от Фомы
    author: Автор неизвестен. В наиболее ранней форме, которую можно восстановить, имя автора не указано; приписывание произведения Фоме появилось в заглавиях более поздних рукописей и в процессе передачи текста.
    audience: Христиане, желавшие узнать о детстве Иисуса и о том, как можно было рассказать о Его божественной силе, воспитании, обучении и взрослении до начала событий, описанных в канонических Евангелиях.
    date: Обычно происхождение текста относят ко II веку н. э., однако он сохранился в нескольких значительно различающихся греческих редакциях и ранних переводах.
