    audience: Христианское собрание, призываемое к покаянию, нравственной последовательности, заботе об уязвимых людях и верной стойкости в надежде на воскресение и суд.
    date: Обычно датируется первой половиной или серединой II века н. э. (приблизительно 100–160 гг.); место создания неизвестно.
