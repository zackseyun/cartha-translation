      display_name: Послания Игнатия
      author: Игнатий, епископ Антиохийский, — автор семи посланий общепринятой средней редакции; позднейшие расширенные и псевдонимные послания, приписываемые Игнатию, в это собрание не входят.
      audience: Христианские общины в Эфесе, Магнесии, Траллах, Риме, Филадельфии и Смирне, а также Поликарп, к которым Игнатий обращался по пути к месту мученической смерти.
      date: Обычно датируются началом II века н. э., чаще всего приблизительно 105–117 годами, хотя точная хронология путешествия Игнатия остаётся предметом споров.
