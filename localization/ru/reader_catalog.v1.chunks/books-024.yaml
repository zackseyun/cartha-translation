payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Ипостась архонтов
      author: Автор неизвестен. Он истолковывает Книгу Бытия через миф-откровение об архонтах; это произведение нельзя с уверенностью приписать какому-либо известному учителю.
      audience: Христиане из сифианской или близкой к ней среды, читавшие Книгу Бытия как повествование о противостоянии невежественных космических правителей, божественной Премудрости и духовного происхождения человечества.
      date: Обычно произведение относят к III веку н. э.; оно сохранилось в коптской рукописи IV века в составе II кодекса из Наг-Хаммади.
    On the Origin of the World:
      display_name: О происхождении мира
      author: Автор неизвестен. В произведении соединены и переработаны различные иудейские, христианские, платонические и мифологические традиции, однако имя составителя не указано.
      audience: Читатели из христианской среды с гностическими тенденциями, стремившиеся узнать альтернативную историю творения, космических правителей, Софии, Адама и Евы, а также конечной судьбы мира.
      date: Обычно произведение датируют III веком н. э., хотя в его основе могут лежать более ранние материалы; оно сохранилось главным образом в коптских рукописях IV века.
    Sophia of Jesus Christ:
      display_name: Премудрость Иисуса Христа
      author: Автор неизвестен. Он переработал материал, известный также по «Евгносту», превратив его в диалог Иисуса с учениками после воскресения.
      audience: Христиане, интересовавшиеся мудростью, открытой свыше, — о трансцендентном Боге, устройстве небесного мира, происхождении души и её спасении.
      date: Произведение часто датируют концом II или III веком н. э.; оно сохранилось в коптских рукописях из Наг-Хаммади и в Берлинском кодексе.
    Gospel of the Egyptians:
      display_name: Евангелие египтян
      author: Автор неизвестен. Это произведение из Наг-Хаммади, называемое также «Священной книгой великого невидимого Духа», следует отличать от более раннего греческого «Евангелия египтян», известного лишь по цитатам.
      audience: Сифианская христианская община, которая выражала представления о своей духовной идентичности и избавлении с помощью насыщенного мифологического повествования, священных имён, образов крещения и гимнической хвалы.
      date: Обычно произведение относят ко II или III веку н. э.; сохранились две его коптские рукописи в кодексах из Наг-Хаммади IV века.
    Letter of Peter to Philip:
      display_name: Послание Петра Филиппу
      author: Автор неизвестен. Краткое вступительное письмо и следующее за ним откровение псевдонимно приписаны Петру и Филиппу, однако ни одного из этих апостолов нельзя с уверенностью считать автором.
      audience: Христиане, искавшие апостольского подтверждения учению о Спасителе, враждебных силах, страдании, миссии и восстановлении учеников.
      date: Обычно произведение датируют концом II или началом III века н. э.; оно сохранилось в рукописи из Наг-Хаммади IV века и в более поздней коптской рукописи.
    Gospel of Judas:
      display_name: Евангелие Иуды
      author: Автор неизвестен. Заглавие приписывает повествование Иуде, однако само произведение не даёт оснований считать Иуду Искариота его историческим автором.
      audience: Христианская группа, критически относившаяся к жертвенным и церковным обычаям соперничающих общин и с помощью диалога-откровения и космологии сифианского типа переосмысливавшая роль Иуды и смерть Иисуса.
      date: Обычно произведение датируют серединой или концом II века н. э.; около 180 года Ириней знал некое «Евангелие Иуды», а сохранившаяся коптская рукопись, вероятно, относится к III или IV веку.
    Protoevangelium of James:
      display_name: Протоевангелие Иакова
      author: Автор неизвестен. Рассказчик называет себя Иаковом, однако произведение псевдонимно и не было написано Иаковом, братом Иисуса.
      audience: Христиане, интересовавшиеся рождением и воспитанием Марии, её неизменной чистотой, Рождеством Иисуса и повествовательными ответами на вопросы, оставленные открытыми в Евангелиях от Матфея и Луки.
      date: Обычно произведение датируют второй половиной II века н. э.; оно сохранилось во множестве более поздних греческих рукописей и древних переводов.
