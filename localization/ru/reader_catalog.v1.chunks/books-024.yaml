payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Ипостась архонтов
      author: Автор неизвестен. Он истолковывает Книгу Бытия через миф-откровение об архонтах; достоверно связать это произведение с каким-либо известным учителем невозможно.
      audience: Христиане из сифианской или близкой к ней среды, читавшие Книгу Бытия как повествование о противоборстве невежественных космических правителей, божественной Премудрости и духовного начала человечества.
      date: Обычно датируется III веком н. э.; сохранилось в коптской рукописи IV века в составе II кодекса Наг-Хаммади.
    On the Origin of the World:
      display_name: О происхождении мира
      author: Автор неизвестен. В произведении объединены и переработаны различные иудейские, христианские, платонические и мифологические традиции, однако имя составителя не названо.
      audience: Читатели из христианской среды с гностическими воззрениями, стремившиеся узнать альтернативную историю творения, космических правителей, Софии, Адама и Евы и конечной участи мира.
      date: Обычно датируется III веком н. э., хотя в его основе могут лежать более ранние материалы; сохранилось главным образом в коптских рукописях IV века.
    Sophia of Jesus Christ:
      display_name: Премудрость Иисуса Христа
      author: Автор неизвестен. Он переработал материал, известный также по «Евгносту», представив его как беседу воскресшего Иисуса с учениками.
      audience: Христиане, интересовавшиеся откровением о премудрости, запредельном Боге, устройстве небесного мира, происхождении души и её спасении.
      date: Часто датируется концом II или III веком н. э.; сохранилось в коптских рукописях из Наг-Хаммади и Берлинского кодекса.
    Gospel of the Egyptians:
      display_name: Евангелие египтян
      author: Автор неизвестен. Это произведение из Наг-Хаммади, называемое также «Священной книгой Великого Невидимого Духа», следует отличать от более раннего греческого «Евангелия египтян», известного лишь по цитатам.
      audience: Сифианская христианская община, которая выражала представления о духовной идентичности и избавлении посредством сложного мифа, священных имён, образов крещения и гимнического славословия.
      date: Обычно относится ко II или III веку н. э.; две коптские рукописи сохранились в кодексах Наг-Хаммади IV века.
    Letter of Peter to Philip:
      display_name: Послание Петра к Филиппу
      author: Автор неизвестен. Краткое вступительное письмо и следующее за ним откровение приписаны Петру и Филиппу псевдонимно; нет надёжных оснований считать автором кого-либо из этих апостолов.
      audience: Христиане, искавшие апостольское подтверждение учения о Спасителе, враждебных силах, страдании, миссии и восстановлении учеников.
      date: Обычно датируется концом II или началом III века н. э.; сохранилось в рукописи Наг-Хаммади IV века и в более позднем коптском списке.
    Gospel of Judas:
      display_name: Евангелие Иуды
      author: Автор неизвестен. Заглавие связывает повествование с Иудой, однако само произведение не даёт оснований считать Иуду Искариота его историческим автором.
      audience: Христианская группа, критиковавшая жертвенные и церковные обычаи других общин и переосмыслявшая Иуду и смерть Иисуса с помощью диалогов-откровений и космологии сифианского типа.
      date: Обычно датируется серединой или концом II века н. э.; около 180 года Ириней знал некое «Евангелие Иуды», а сохранившаяся коптская рукопись, вероятно, относится к III или IV веку.
    Protoevangelium of James:
      display_name: Протоевангелие Иакова
      author: Автор неизвестен. Рассказчик называет себя Иаковом, однако произведение написано под чужим именем, и его автором не был Иаков, брат Иисуса.
      audience: Христиане, интересовавшиеся рождением и воспитанием Марии, её неизменной чистотой, Рождеством Иисуса и повествовательными ответами на вопросы, оставленные открытыми в Евангелиях от Матфея и Луки.
      date: Обычно датируется второй половиной II века н. э.; сохранилось во множестве более поздних греческих рукописей и древних переводов.
