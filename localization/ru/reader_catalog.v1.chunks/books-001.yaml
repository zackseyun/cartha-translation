  book_metadata:
    Genesis:
      display_name: Бытие
      author: Автор неизвестен; традиционно авторство приписывается Моисею. Современные исследователи считают, что книга складывалась на протяжении длительного времени из источников, позднее объединённых редакторами.
      audience: Израиль как народ завета, чья история происхождения укоренена в Божьем творении, избрании и обетовании.
      date: Книга создавалась на протяжении веков; дошедшая до нас форма сложилась приблизительно в VI–V веках до н. э., во время или после вавилонского плена.
      summary: Книга Бытие повествует о сотворении мира, восстании и рассеянии человечества, а также о семье Авраама, Исаака, Иакова и Иосифа, с которой начинаются Божьи обетования завета Израилю.
    Exodus:
      display_name: Исход
      author: Автор неизвестен; традиционно авторство приписывается Моисею. Современные исследователи считают, что книга складывалась на протяжении длительного времени из источников, позднее объединённых редакторами.
      audience: Израиль как освобождённый народ, вступивший в завет и постигающий, что значит быть народом ГОСПОДА и жить по Его закону.
      date: Книга создавалась на протяжении веков; дошедшая до нас форма сложилась приблизительно в VI–V веках до н. э.
    Leviticus:
      display_name: Левит
      author: Автор неизвестен; традиционно авторство приписывается Моисею. Современные исследователи относят книгу к Священническому источнику.
      audience: Израильские священники и поклоняющаяся община — наставления о жертвоприношениях, святости и устроении жизни вокруг Божьего присутствия.
      date: Композиционные слои относятся к периоду от поздней монархии до времени после плена (приблизительно VII–V века до н. э).
