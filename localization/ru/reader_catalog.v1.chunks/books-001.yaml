    Genesis:
      display_name: Бытие
      author: Автор неизвестен; традиционно авторство приписывается Моисею. Современные исследователи считают, что книга складывалась на протяжении долгого времени из источников, позднее сведённых воедино.
      audience: Израиль как народ завета, чья история происхождения укоренена в Божьем творении, избрании и обещании.
      date: Создавалась на протяжении нескольких веков; приняла дошедшую до нас форму приблизительно в VI–V веках до н. э., во время или после Вавилонского плена.
      summary: Книга Бытие повествует о сотворении мира, непослушании и расселении человечества, а также о семье Авраама, Исаака, Иакова и Иосифа, через которую начинают исполняться Божьи обещания завета Израилю.
    Exodus:
      display_name: Исход
      author: Автор неизвестен; традиционно авторство приписывается Моисею. Современные исследователи считают, что книга складывалась на протяжении долгого времени из источников, позднее сведённых воедино.
      audience: Израиль как освобождённый народ, вступивший в завет и познающий, что значит быть народом Господа и жить по Его закону.
      date: Создавалась на протяжении нескольких веков; приняла дошедшую до нас форму приблизительно в VI–V веках до н. э.
    Leviticus:
      display_name: Левит
      author: Автор неизвестен; традиционно авторство приписывается Моисею. Современные исследователи относят книгу к Священническому источнику.
      audience: Израильские священники и община верующих — наставления о жертвоприношениях, святости и устройстве жизни вокруг Божьего присутствия.
      date: В книге выделяют слои, создававшиеся с конца эпохи монархии до периода после Вавилонского плена (приблизительно VII–V века до н. э.).
