payload:
  book_metadata:
    1 Corinthians:
      display_name: Первое послание к Коринфянам
      author: Павел вместе с Сосфеном.
      audience: Раздираемая разногласиями христианская община в Коринфе.
      date: Ок. 53–55 гг. н. э.; написано в Эфесе.
    2 Corinthians:
      display_name: Второе послание к Коринфянам
      author: Павел вместе с Тимофеем.
      audience: Коринфская община после тяжёлого конфликта.
      date: Ок. 55–56 гг. н. э.
    Galatians:
      display_name: Послание к Галатам
      author: Павел.
      audience: Христианские общины Галатии (центральная Анатолия), которых принуждали принять обрезание и соблюдать Тору.
      date: Ок. 48–55 гг. н. э. (датировка спорна).
    Ephesians:
      display_name: Послание к Ефесянам
      author: Павел или близкий ученик, писавший от имени Павла (вопрос спорный).
      audience: Широкий круг христиан провинции Азия; географическое название «Эфес» отсутствует в древнейших рукописях.
      date: Ок. 60-х гг. н. э., если автор — Павел; ок. 80–90-х гг. н. э., если послание написано от его имени.
    Philippians:
      display_name: Послание к Филиппийцам
      author: Павел вместе с Тимофеем.
      audience: Христианская община в Филиппах — римской колонии в Македонии.
      date: Ок. 60–62 гг. н. э.; написано в заключении.
    Colossians:
      display_name: Послание к Колоссянам
      author: Павел вместе с Тимофеем — или близкий ученик, писавший от имени Павла (вопрос спорный).
      audience: Христиане в Колоссах, в долине реки Лик, столкнувшиеся с синкретическим учением.
      date: Ок. 60–62 гг. н. э., если автор — Павел; позднее, если послание написано от его имени.
    1 Thessalonians:
      display_name: Первое послание к Фессалоникийцам
      author: Павел вместе с Силуаном и Тимофеем.
      audience: Молодая христианская община в Фессалонике, подвергавшаяся гонениям.
      date: Ок. 50–51 гг. н. э. — вероятно, самое раннее из сохранившихся посланий Павла.
    2 Thessalonians:
      display_name: Второе послание к Фессалоникийцам
      author: Павел (авторство спорно; некоторые исследователи считают, что послание написано от его имени).
      audience: Фессалоникийская община, в которой возникла путаница относительно последних времён.
      date: Ок. 51 г. н. э., если автор — Павел.
    1 Timothy:
      display_name: Первое послание к Тимофею
      author: Павел или ученик, писавший от имени Павла (Пастырские послания многие исследователи считают написанными от его имени).
      audience: Тимофей как представитель Павла в Эфесе; руководство по устройству церкви более позднего периода.
      date: Ок. середины 60-х гг. н. э., если автор — Павел; ок. 90–110 гг. н. э., если послание написано от его имени.
    2 Timothy:
      display_name: Второе послание к Тимофею
      author: Павел или ученик, писавший от имени Павла.
      audience: Тимофей; послание представлено как прощальное обращение Павла из заключения.
      date: Ок. середины 60-х гг. н. э., если автор — Павел; ок. 90–110 гг. н. э., если послание написано от его имени.
    Titus:
      display_name: Послание к Титу
      author: Павел или ученик, писавший от имени Павла.
      audience: Тит как представитель Павла на Крите.
      date: Ок. середины 60-х гг. н. э., если автор — Павел; ок. 90–110 гг. н. э., если послание написано от его имени.
    Philemon:
      display_name: Послание к Филимону
      author: Павел вместе с Тимофеем.
      audience: Филимон, христианин-рабовладелец; речь идёт о его беглом рабе Онисиме.
      date: Ок. 60–62 гг. н. э.
    Hebrews:
      display_name: Послание к Евреям
      author: Автор неизвестен. Традиция называла Павла, Аполлоса, Варнаву, Прискиллу и других, но ни одно предположение не получило общего признания.
      audience: Говорящие по-гречески христиане из иудеев, склонные отступить от исповедуемой ими христианской веры.
      date: Ок. 60–95 гг. н. э.
