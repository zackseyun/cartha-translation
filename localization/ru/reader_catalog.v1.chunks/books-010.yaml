payload:
  book_metadata:
    Joel:
      display_name: Иоиль
      author: Иоиль, сын Петуила.
      audience: Иудея после плена, воспринявшая нашествие саранчи как знамение Дня ГОСПОДНЯ.
      date: Вероятно, около V–IV веков до н. э.
    Amos:
      display_name: Амос
      author: Амос из Фекои, иудейский пастух, проповедовавший на севере.
      audience: Северное Израильское царство в эпоху процветания и несправедливости при Иеровоаме II.
      date: Около 760–750 годов до н. э.
    Obadiah:
      display_name: Авдий
      author: Авдий.
      audience: Иудея после того, как Эдом предал Иерусалим; пророчество о падении Эдома.
      date: Вскоре после 586 года до н. э.
    Jonah:
      display_name: Иона
      author: Автор неизвестен; главный герой — Иона, сын Амафии.
      audience: Израиль после плена; сатирическое обличение этнической замкнутости и утверждение Божьего милосердия к чужеземцам.
      date: Вероятно, около V–IV веков до н. э.
    Micah:
      display_name: Михей
      author: Михей из Морешета.
      audience: Иудея в конце VIII века до н. э.; особое внимание уделено сельской бедноте, страдавшей от городской знати.
      date: Около 740–700 годов до н. э.
    Nahum:
      display_name: Наум
      author: Наум из Елкоша.
      audience: Иудея, радующаяся предстоящему падению Ниневии.
      date: Незадолго до 612 года до н. э.
    Habakkuk:
      display_name: Аввакум
      author: Аввакум.
      audience: Иудея перед лицом возвышения Вавилона; диалог пророка с Богом о справедливости.
      date: Примерно конец VII века до н. э.
    Zephaniah:
      display_name: Софония
      author: Софония, сын Хуши.
      audience: Иудея при Иосии, накануне его реформ.
      date: Около 640–609 годов до н. э.
    Haggai:
      display_name: Аггей
      author: Аггей.
      audience: Вернувшиеся из плена, восстанавливавшие храм при Дарии.
      date: 520 год до н. э.
    Zechariah:
      display_name: Захария
      author: Захария, сын Варахии; главы 9–14, вероятно, принадлежат более позднему автору.
      audience: Вернувшиеся из плена, восстанавливавшие храм, а также более поздние общины послепленного времени.
      date: Главы 1–8 — около 520–518 годов до н. э.; главы 9–14, возможно, написаны столетием позже.
    Malachi:
      display_name: Малахия
      author: Автор неизвестен; «Малахия» означает «Мой вестник».
      audience: Иудея после плена, где при персидском владычестве ослабевали усердие в богослужении и верность Богу.
      date: Примерно середина V века до н. э.
    Matthew:
      display_name: Матфей
      author: Автор неизвестен; традиция приписывает книгу апостолу Матфею. Современные исследователи полагают, что её написал грекоязычный автор из иудеохристиан, опиравшийся на Евангелие от Марка и источник, подобный Q.
      audience: Иудеохристианская община, осмыслявшая преемственность и разрыв с синагогальным иудаизмом.
      date: Около 80–90 годов н. э.
    Mark:
      display_name: Марк
      author: Автор неизвестен; традиция связывает книгу с Иоанном Марком, спутником Петра.
      audience: Грекоязычная христианская община, возможно находившаяся в Риме под угрозой гонений или вблизи такой угрозы.
      date: Около 65–75 годов н. э., во время Иудейской войны и разрушения храма.
