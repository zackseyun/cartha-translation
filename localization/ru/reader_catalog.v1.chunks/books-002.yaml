      author: Автор неизвестен; традиционно авторство приписывается Моисею.
      audience: Израильтяне на пути из Египта в Землю обетованную — поколение, странствовавшее по пустыне, а также позднейшие читатели, учившиеся на его ошибках.
      date: Текст складывался в несколько этапов с конца периода монархии до времени после Вавилонского плена (ок. VII–V веков до н. э.).
    Deuteronomy:
      display_name: Второзаконие
      author: Автор неизвестен; книга представлена как прощальные речи Моисея. Современные исследователи связывают основу текста с реформой Иосии в конце VII века до н. э.
      audience: Израильтяне, готовившиеся войти в Землю обетованную, а позднее — изгнанники, размышлявшие, как сохранять верность Богу без храма и царя.
      date: Основная часть относится примерно к концу VII века до н. э.; окончательная форма сложилась в период Вавилонского плена.
