      audience: Израиль в пути из Египта в обещанную землю — поколение, странствовавшее по пустыне, и последующие читатели, извлекающие уроки из его ошибок.
      date: Разные слои текста складывались в период от поздней монархии до времени после Вавилонского плена (ок. VII–V веков до н. э.).
    Deuteronomy:
      display_name: Второзаконие
      author: Автор неизвестен; книга представлена как прощальные речи Моисея. Современные исследователи связывают её основную часть с реформой Иосии в конце VII века до н. э.
      audience: Израиль, готовящийся войти в землю, — а позднее изгнанники, размышлявшие, как верно жить без храма и царя.
      date: Основная часть — предположительно конец VII века до н. э.; окончательная форма сложилась в период Вавилонского плена.
