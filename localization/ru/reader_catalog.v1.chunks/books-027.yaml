payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: Послание Поликарпа к филиппийцам
      author: Поликарп, епископ Смирны. Некоторые исследователи полагают, что дошедший до нас текст объединяет материалы, отправленные в разное время.
      audience: Христианская община в Филиппах, которая просила прислать письма Игнатия и получила наставления о вере, поведении, руководстве, деньгах и стойкости.
      date: Начало — середина II века н. э.; по меньшей мере часть послания тесно связана с путешествием Игнатия, однако гипотеза о составном характере текста допускает, что один из его разделов относится к несколько более позднему времени.
    Martyrdom of Polycarp:
      display_name: Мученичество Поликарпа
      author: Неизвестные члены Смирнской церкви, писавшие от имени общины; заключительные примечания о передаче текста отражают его позднейшее переписывание и распространение.
      audience: Церковь в Филомелии и более широкое христианское сообщество, которым предложен рассказ об аресте, суде, смерти Поликарпа и его образцовой стойкости.
      date: Написано после смерти Поликарпа; обычно текст относят к середине или второй половине II века н. э. Точный год мученичества и окончательная форма документа остаются предметом споров.
    Epistle to Diognetus:
      display_name: Послание к Диогнету
      author: Автор неизвестен. Он называет себя учеником или последователем, однако ни его самого, ни адресата по имени Диогнет невозможно достоверно отождествить с кем-либо.
      audience: Образованный человек, не исповедующий христианство, который интересуется этой верой, а также подобные ему читатели, задающиеся вопросами о христианском богопочитании, нравственности, месте в обществе, любви и кажущейся новизне веры.
      date: Послание часто датируют концом II или началом III века н. э., хотя предлагаемые датировки значительно различаются; последние две главы могут происходить из другого произведения.
    Fragments of Papias:
      display_name: Фрагменты Папия
      author: Папий, епископ Иераполя, — автор утраченного пятитомного труда «Толкование изречений Господа»; сохранившееся собрание состоит из цитат и сообщений, переданных позднейшими авторами.
      audience: Ранние христиане, стремившиеся узнать сохранившиеся в памяти учения об Иисусе и апостолах, собранные по названным поимённо цепочкам устных свидетельств и толкований.
      date: Труд Папия обычно датируют началом II века н. э., нередко приблизительно 110–130 годами; сохранившиеся фрагменты встречаются у авторов, писавших начиная со II века.
