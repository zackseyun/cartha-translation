  - 'Letters of Ignatius 98: сохранено множественное число «honorable acts».'
  - 'Martyrdom of Polycarp 2: устранено добавленное значение смерти как увенчания.'
  - 'Martyrdom of Polycarp 18: «magistrate''s denial» передано как побуждение магистрата отказать.'
