payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: Послание Поликарпа к Филиппийцам
      author: Поликарп, епископ Смирны. Некоторые исследователи полагают, что дошедший до нас текст объединяет материалы, отправленные в разное время.
      audience: Христианская община в Филиппах, которая просила прислать письма Игнатия и получила наставления о вере, поведении, руководстве, деньгах и стойкости.
      date: Начало — середина II века н. э.; по меньшей мере часть послания тесно связана с путешествием Игнатия, однако гипотеза о составном характере письма допускает, что один из его разделов появился несколько позднее.
    Martyrdom of Polycarp:
      display_name: Мученичество Поликарпа
      author: Неизвестные члены Смирнской церкви, писавшие от имени общины; заключительные примечания о передаче текста отражают его более позднее переписывание и распространение.
      audience: Церковь в Филомелии и более широкий круг христиан; им предлагается рассказ об аресте, суде, смерти Поликарпа и его образцовой стойкости.
      date: Написано после смерти Поликарпа; обычно произведение относят к середине или второй половине II века н. э. Точный год мученической смерти и время окончательного оформления документа остаются предметом споров.
    Epistle to Diognetus:
      display_name: Послание к Диогнету
      author: Автор неизвестен. Он называет себя учеником или слушателем, однако ни его самого, ни адресата по имени Диогнет невозможно достоверно отождествить с известными лицами.
      audience: Образованный нехристианин, желающий разобраться в вопросе, и подобные ему читатели, которые спрашивают о христианском богопочитании, нравственности, месте в обществе, любви и кажущейся новизне веры.
      date: Послание часто датируют концом II или началом III века н. э., хотя предлагаемые датировки значительно различаются; последние две главы могут происходить из другого произведения.
    Fragments of Papias:
      display_name: Фрагменты Папия
      author: Папий, епископ Иераполя, написал утраченное пятитомное «Изложение изречений Господних»; сохранившееся собрание состоит из цитат и сообщений, переданных более поздними авторами.
      audience: Ранние христиане, искавшие сохранившиеся в памяти учения об Иисусе и апостолах, собранные по названным поимённо цепочкам устных свидетельств и толкований.
      date: Труд Папия обычно датируют началом II века н. э., часто приблизительно 110–130 годами; сохранившиеся фрагменты встречаются у авторов, писавших начиная со II века.
