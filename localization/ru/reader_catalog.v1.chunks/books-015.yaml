      display_name: Молитва Манассии
      author: Автор неизвестен; произведение приписано царю Манассии от его имени.
      audience: Кающиеся, видевшие в раскаянии Манассии пример для себя; в некоторых традициях использовалась в богослужении.
      date: Ок. II–I вв. до н. э.
    Psalm 151:
      display_name: Псалом 151
