    4 Maccabees:
      display_name: Четвёртая книга Маккавейская
      author: Автор неизвестен; грекоязычный иудейский автор, испытавший влияние стоической философии.
      audience: Иудеи эллинистического мира; философская проповедь о том, как разум благодаря верности подчиняет себе страсти.
      date: Ок. I в. н. э.
    Bel and the Dragon:
      display_name: Бел и дракон
      author: Автор неизвестен; одно из греческих дополнений к книге Даниила.
      audience: Грекоязычные иудеи; насмешливая полемика против идолопоклонства.
