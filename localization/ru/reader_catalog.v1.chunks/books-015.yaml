      audience: Общины диаспоры и Кумрана, почитавшие Псалтирь Давида.
      date: Ок. II в. до н. э. или ранее.
    3 Maccabees:
      display_name: Третья книга Маккавейская
      author: Автор неизвестен; произведение написано на греческом языке.
      audience: Грекоязычные иудеи египетской диаспоры; повествование об избавлении, действие которого происходит при Птолемее IV.
