    Letter of Jeremiah:
      display_name: Послание Иеремии
      author: Автор неизвестен; произведение приписано Иеремии от его имени.
      audience: Иудеи диаспоры, испытывавшие соблазн поклоняться окружавшим их идолам.
      date: Ок. IV–II вв. до н. э.
    Prayer of Azariah and Song of the Three:
      display_name: Молитва Азарии и песнь трёх отроков
      author: Автор неизвестен; одно из греческих дополнений к книге Даниила.
      audience: Грекоязычные иудеи; богослужебный материал, дополняющий 3-ю главу книги Даниила.
      date: Ок. II в. до н. э.
    Susanna:
      display_name: Сусанна
      author: Автор неизвестен; одно из греческих дополнений к книге Даниила.
      audience: Грекоязычные иудеи; рассказ о праведности и разоблачении ложного свидетельства.
      date: Ок. II–I вв. до н. э.
    1 Clement:
      display_name: Первое послание Климента
      author: Автор неизвестен; произведение приписывается Клименту Римскому.
      audience: Христианское собрание в Коринфе, охваченное спором о руководстве общиной.
      date: Ок. 96 г. н. э.
