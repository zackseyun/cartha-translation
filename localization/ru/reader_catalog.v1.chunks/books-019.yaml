review:
  verdict: revise
  review_summary: Черновик в целом полный и стилистически пригодный, но несколько заголовков добавляют отсутствующие в английском источнике детали либо смещают смысл. Исправлены эти места; все ключи и поля сохранены.
  issues:
  - 'Gospel of Thomas 55: добавлены «близкие», которых нет в каноническом заголовке.'
  - 'Gospel of Thomas 56 и 80: исправлены неестественные и смыслово смещённые формулировки о мире как трупе/теле.'
  - 'Gospel of Thomas 69: убрано добавленное слово «истины».'
  - 'Gospel of Thomas 79: «не рожавшая» не соответствует «Forbearing Truth»; восстановлено упоминание истины.'
  - 'Gospel of Thomas 101: убраны добавленные «близкие».'
  - 'Gospel of Thomas 110: восстановлены «мирское богатство» и отречение от него.'
  - 'Gospel of Truth 15: порядок образов приведён в соответствие с «Father Within Rests Truth».'
  - 'Jubilees 11: убрано добавленное «всеобщего».'
