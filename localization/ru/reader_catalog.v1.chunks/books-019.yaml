  - Уточнены заголовки, передающие внутреннюю бедность, божественный свет, телесный мир, мирское богатство и зависимость от плоти.
  - Устранено усиление «всеобщего» развращения в Jubilees 11 и уточнено действие с десятиной в Jubilees 13.
