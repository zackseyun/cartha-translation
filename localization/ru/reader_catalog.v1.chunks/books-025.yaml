payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Евангелие детства от Фомы
      author: Автор неизвестен. В наиболее ранней форме, которую можно восстановить, имя автора не указано; приписывание сочинения Фоме появляется в заглавиях более поздних рукописей и в последующей традиции передачи текста.
      audience: Христиане, интересовавшиеся детством Иисуса и тем, как можно было рассказать о Его божественной силе, воспитании, обучении и взрослении до начала событий, описанных в канонических Евангелиях.
      date: Обычно возникновение текста относят ко II веку н. э., однако он сохранился в нескольких существенно различающихся греческих редакциях и ранних переводах.
    Acts of Paul and Thecla:
      display_name: Деяния Павла и Фёклы
      author: Автор неизвестен. Это один из эпизодов более пространных «Деяний Павла»; древнее сообщение о том, что эти «Деяния» составил некий пресвитер, не позволяет достоверно установить личность автора.
      audience: Христиане, которых привлекали рассказы об апостольской проповеди, безбрачии, крещении, стойкости, подобной стойкости мучеников, а также о праве женщины учить и свидетельствовать.
      date: Сочинение создано во II веке н. э., вероятно во второй его половине; оно распространялось как в составе «Деяний Павла», так и как самостоятельное произведение.
    Gospel of Peter:
      display_name: Евангелие от Петра
      author: Автор неизвестен. В сохранившемся повествовании рассказ ведётся от лица Петра, и текст передавался под его именем, однако его не считают произведением исторического апостола.
      audience: Ранние христиане, интересовавшиеся расширенным повествованием о Страстях и воскресении, вероятно в общинах, где авторитету Петра придавали особое значение.
      date: Текст обычно датируют II веком н. э.; основной сохранившийся греческий фрагмент происходит из гораздо более поздней рукописи, найденной в Ахмиме.
    2 Clement:
      display_name: Второе послание Климента
      author: Автор неизвестен. Вопреки традиционному заглавию, это раннехристианская проповедь, а не второе письмо Климента Римского.
      audience: Христианская община, которую призывают к покаянию, последовательности в нравственной жизни, заботе об уязвимых и верной стойкости в надежде на воскресение и суд.
      date: Обычно датируется первой половиной или серединой II века н. э. (приблизительно 100–160 гг.); место создания неизвестно.
    Epistle of Barnabas:
      display_name: Послание Варнавы
      author: Автор неизвестен. Произведение традиционно связывали с Варнавой, спутником Павла, однако современные исследователи не принимают это авторство.
      audience: Христиане из язычников, которых учили воспринимать Писания Израиля через христологическое и аллегорическое толкование, одновременно отличая свою принадлежность к завету от иудейской религиозной практики.
      date: Обычно датируется временем между разрушением Иерусалимского храма в 70 году н. э. и началом II века, часто — приблизительно 80–130 гг.
