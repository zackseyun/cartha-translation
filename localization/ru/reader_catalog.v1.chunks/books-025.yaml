payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Евангелие детства от Фомы
      author: Автор неизвестен. В наиболее ранней форме, которую можно восстановить, имя автора не указано; приписывание произведения Фоме появилось в заглавиях более поздних рукописей и в процессе передачи текста.
      audience: Христиане, желавшие узнать о детстве Иисуса и о том, как можно было рассказать о Его божественной силе, воспитании, обучении и взрослении до начала событий, описанных в канонических Евангелиях.
      date: Обычно происхождение текста относят ко II веку н. э., однако он сохранился в нескольких значительно различающихся греческих редакциях и ранних переводах.
    Acts of Paul and Thecla:
      display_name: Деяния Павла и Феклы
      author: Автор неизвестен. Это один из эпизодов более обширных «Деяний Павла»; древнее сообщение о том, что «Деяния» написал некий пресвитер, не позволяет достоверно установить личность автора.
      audience: Христиане, которых привлекали рассказы об апостольской проповеди, безбрачии, крещении, стойкости, подобной мученической, а также о праве женщины учить и свидетельствовать.
      date: Составлено во II веке н. э., вероятно во второй его половине; произведение распространялось и в составе «Деяний Павла», и самостоятельно.
    Gospel of Peter:
      display_name: Евангелие от Петра
      author: Автор неизвестен. В сохранившемся повествовании рассказ ведётся от лица Петра, и текст передавался под его именем, однако его не считают произведением исторического апостола.
      audience: Ранние христиане, интересовавшиеся расширенным повествованием о страстях и воскресении, вероятно в общинах, где авторитет Петра имел особое значение.
      date: Обычно датируется II веком н. э.; основной сохранившийся греческий фрагмент происходит из гораздо более поздней рукописи, найденной в Ахмиме.
    2 Clement:
      display_name: Второе послание Климента
      author: Автор неизвестен. Несмотря на традиционное название, это раннехристианская проповедь, а не второе послание Климента Римского.
      audience: Христианское собрание, призываемое к покаянию, нравственной последовательности, заботе об уязвимых людях и верной стойкости в надежде на воскресение и суд.
      date: Обычно датируется первой половиной или серединой II века н. э. (приблизительно 100–160 гг.); место создания неизвестно.
    Epistle of Barnabas:
      display_name: Послание Варнавы
      author: Автор неизвестен. Произведение традиционно связывали с Варнавой, спутником Павла, однако современные исследователи не принимают это авторство.
      audience: Христиане из язычников, которых учили воспринимать Писания Израиля посредством христологического и аллегорического толкования, отличая при этом свою идентичность в завете от иудейской религиозной практики.
      date: Обычно датируется периодом между разрушением Иерусалимского храма в 70 году н. э. и началом II века, часто приблизительно 80–130 гг.
