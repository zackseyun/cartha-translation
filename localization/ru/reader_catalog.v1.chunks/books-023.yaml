review:
  verdict: revise
  review_summary: Полный каталог проверен и исправлен. Уточнены отдельные формулировки для более точной передачи английского источника, включая описание автора «Толкования о душе», датировку «Евангелия от Марии» и несколько названий глав.
  issues:
  - В метаданных «Толкования о душе» исправлена неудачная конструкция, чтобы ясно передать, что автор назван христианским проповедником.
  - В метаданных «Евангелия от Марии» уточнено, что основной коптский свидетель сохранился в Берлинском кодексе, а не просто «находится» там.
  - 'В нескольких заголовках устранены небольшие смысловые сдвиги: «против греха», «избегайте разделения», «божественный источник», «Божественный Предзамысел» и «просит о силах».'
