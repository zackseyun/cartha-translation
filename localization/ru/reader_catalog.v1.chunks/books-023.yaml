payload:
  book_metadata:
    Gospel of Mary:
      display_name: Евангелие от Марии
      author: Автор неизвестен. В произведении Мария представлена как получившая и истолковавшая откровение Иисуса, однако в нём не утверждается, что сохранившееся Евангелие написала сама Мария.
      audience: Ранние христиане, осмыслявшие вопросы откровения, духовного восхождения, апостольского авторитета и правомерности учения Марии среди учеников Иисуса.
      date: Обычно датируется II веком н. э.; сохранились греческие фрагменты III века, а основной коптский текст содержится в Берлинском кодексе 8502, относящемся к V веку.
    Treatise on the Resurrection:
      display_name: Трактат о воскресении
      author: Автор неизвестен. Произведение построено как письмо учителя к ученику по имени Регин; достоверно установить личность ни учителя, ни Регина невозможно.
      audience: Христиане, стремившиеся понять воскресение, особенно читатели, размышлявшие о телесном и духовном воскресении, а также о приобщении к жизни воскресения уже в настоящем.
      date: Обычно относится к концу II века н. э. (часто примерно к 170–200 годам); сохранилось в коптской рукописи IV века, представляющей собой перевод более раннего греческого произведения.
    Dialogue of the Savior:
      display_name: Диалог Спасителя
      author: Автор неизвестен. В диалоге учение откровения вложено в уста Иисуса, беседующего с Иудой, Матфеем и Марией, однако составитель произведения не назван.
      audience: Раннехристианский круг, проявлявший интерес к сокровенному откровению, ученичеству, самопознанию, молитве и аскетической подготовке к спасению.
      date: Обычно относится ко II веку н. э., хотя этапы составления и точная датировка остаются предметом споров; сохранился в коптской рукописи IV века.
    Exegesis on the Soul:
      display_name: Толкование о душе
      author: Автор неизвестен. Это христианский проповедник, переосмысливающий библейские образы и образы греческой литературы как аллегорию падения, покаяния и восстановления души.
      audience: Христиане, знакомые с Писанием и нравственными наставлениями, которых призывали обратиться от неупорядоченных желаний к покаянию и воссоединению с божественным.
      date: Обычно датируется концом II или началом III века н. э.; сохранилось в коптском переводе с греческого, выполненном в IV веке.
    Book of Thomas the Contender:
      display_name: Книга Фомы Атлета
      author: Автор неизвестен. В заключительном заглавии произведение связывается с Иудой Фомой, а Матфий назван записавшим его, однако это литературные атрибуции, а не достоверно подтверждённые сведения об авторстве.
      audience: Христиане, склонные к аскетической жизни, которых призывали стремиться к самопознанию, противостоять телесным страстям и постигать сокровенные наставления Иисуса Фоме.
      date: Часто датируется концом II или началом III века н. э. и, возможно, возникло в сирийской христианской среде; сохранилось в коптской рукописи IV века.
    Tripartite Tractate:
      display_name: Трёхчастный трактат
      author: Автор неизвестен. Он был высокообразованным христианским богословом валентинианского направления; достоверно отождествить его с каким-либо известным по имени учителем невозможно.
      audience: Валентинианская христианская община, получавшая последовательное наставление о Боге, эонах, творении, Христе, Церкви, спасении и окончательном восстановлении.
      date: Обычно датируется III веком н. э.; по некоторым предположениям — его второй половиной. Сохранился на коптском языке в Кодексе Юнга IV века.
    Apocryphon of John:
      display_name: Апокриф Иоанна
      author: Автор неизвестен. Произведение псевдонимно представлено как откровение воскресшего Иисуса Иоанну, сыну Зеведея, и сохранилось более чем в одной древней редакции.
      audience: Христиане сифианской или близкой к ней традиции откровения, искавшие объяснение божественного мира, творения, человеческой природы и освобождения от враждебных правителей.
      date: Ранняя форма произведения, вероятно, распространялась во II веке н. э.; сохранившиеся коптские рукописи с краткой и пространной редакциями относятся к IV и V векам.
