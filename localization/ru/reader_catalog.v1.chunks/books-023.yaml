payload:
  book_metadata:
    Gospel of Mary:
      display_name: Евангелие от Марии
      author: Автор неизвестен. В этом произведении Мария представлена как получательница и истолковательница откровения Иисуса, однако в нём не утверждается, что сохранившееся Евангелие написала сама Мария.
      audience: Ранние христиане, размышлявшие об откровении, духовном восхождении, апостольском авторитете и правомерности учения Марии среди учеников Иисуса.
      date: Обычно датируется II веком н. э.; сохранились греческие фрагменты III века, а основной коптский свидетель сохранился в Берлинском кодексе 8502 V века.
    Treatise on the Resurrection:
      display_name: Трактат о воскресении
      author: Автор неизвестен. Произведение построено как письмо наставника ученику по имени Регин; ни наставника, ни Регина невозможно достоверно отождествить с известными лицами.
      audience: Христиане, искавшие наставления о воскресении, особенно читатели, осмыслявшие телесное и духовное воскресение, а также участие в жизни воскресения уже в настоящем.
      date: Обычно относится к концу II века н. э. (часто приблизительно к 170–200 годам); сохранилось в коптской рукописи IV века, представляющей собой перевод более раннего греческого произведения.
    Dialogue of the Savior:
      display_name: Диалог Спасителя
      author: Автор неизвестен. В диалоге учение, представленное как откровение Иисуса, излагается в беседе с Иудой, Матфеем и Марией, однако составитель произведения не назван.
      audience: Раннехристианская община, интересовавшаяся сокровенным откровением, ученичеством, самопознанием, молитвой и аскетической подготовкой к спасению.
      date: Обычно относится ко II веку н. э., хотя этапы формирования текста и его точная дата остаются предметом споров; сохранился в коптской рукописи IV века.
    Exegesis on the Soul:
      display_name: Толкование о душе
      author: Автор неизвестен. Автор — христианский проповедник, переосмысляющий библейские образы и образы греческой литературы как аллегорию падения, покаяния и восстановления души.
      audience: Христиане, знакомые с Писанием и нравственными наставлениями, которых призывали отвернуться от беспорядочных желаний, покаяться и воссоединиться с божественным.
      date: Обычно датируется концом II или началом III века н. э.; сохранилось в коптском переводе с греческого, выполненном в IV веке.
    Book of Thomas the Contender:
      display_name: Книга Фомы Подвижника
      author: Автор неизвестен. В заключительном заглавии произведение связывается с Иудой Фомой, а Матфия назван записавшим его, однако это литературные атрибуции, а не поддающиеся проверке сведения об авторстве.
      audience: Христиане с аскетическими устремлениями, которых призывали искать самопознания, противостоять телесным страстям и постигать сокровенное наставление Иисуса Фоме.
      date: Часто датируется концом II или началом III века н. э. и, возможно, возникло в сирийской христианской среде; сохранилось в коптской рукописи IV века.
    Tripartite Tractate:
      display_name: Трёхчастный трактат
      author: Автор неизвестен. Автор был высокообразованным христианским богословом валентинианского направления; достоверно отождествить его с каким-либо известным наставником невозможно.
      audience: Валентинианская христианская община, получавшая систематическое наставление о Боге, эонах, творении, Христе, Церкви, спасении и окончательном восстановлении.
      date: Обычно датируется III веком н. э.; по некоторым предположениям, его второй половиной. Сохранился на коптском языке в Кодексе Юнга IV века.
    Apocryphon of John:
      display_name: Апокриф Иоанна
      author: Автор неизвестен. Произведение псевдонимно представляет собой откровение воскресшего Иисуса Иоанну, сыну Зеведея, и сохранилось более чем в одной древней редакции.
      audience: Христиане сифианской или близкой к ней традиции откровения, искавшие учения о божественном мире, творении, человеческой природе и освобождении от враждебных властителей.
      date: Ранняя форма текста, вероятно, была в обращении во II веке н. э.; сохранившиеся коптские рукописи IV и V веков передают краткую и пространную редакции.
