      author: Автор неизвестен; традиция приписывает книгу апостолу Иоанну или «любимому ученику».
      audience: Христианская община, находившаяся в напряжённых отношениях с синагогальным иудаизмом и сформировавшаяся вокруг свидетельства любимого ученика.
