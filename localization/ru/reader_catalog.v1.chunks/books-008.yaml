    Isaiah:
      display_name: Исаия
      author: Несколько авторов на протяжении веков; главы 1–39 восходят к деятельности жившего в Иерусалиме Исайи VIII века до н. э., а главы 40–55 («Второисайя») и 56–66 («Третьеисайя») отражают обстоятельства плена и возвращения.
      audience: Жители Иудеи — последовательно во время ассирийской угрозы, вавилонского плена и послепленного восстановления.
      date: Создавалась примерно с конца VIII по V век до н. э.
    Jeremiah:
      display_name: Иеремия
      author: Иеремия из Анафофа; значительную редакторскую работу проделали его писец Варух и более поздние редакторы.
      audience: Жители Иудеи накануне, во время и после вавилонского завоевания.
      date: Конец VII — начало VI века до н. э.
