    Isaiah:
      display_name: Исаия
      author: Несколько авторов на протяжении веков; главы 1–39 восходят к Исаии Иерусалимскому VIII века до н. э., а главы 40–55 («Второисайя») и 56–66 («Тритоисайя») отражают обстоятельства изгнания и возвращения.
      audience: 'Последовательно: Иудея под угрозой Ассирии, народ в вавилонском изгнании и община в период восстановления после изгнания.'
      date: Создавалась приблизительно с конца VIII по V век до н. э.
    Jeremiah:
      display_name: Иеремия
      author: Иеремия из Анафофа; значительную редакционную работу выполнили его писец Варух и более поздние редакторы.
      audience: Иудея накануне, во время и после вавилонского завоевания.
      date: Конец VII — начало VI века до н. э.
