payload:
  book_metadata:
    James:
      display_name: Послание Иакова
      author: По традиции — Иаков, брат Иисуса; современные исследователи расходятся во мнениях, является ли авторство подлинным или псевдонимным.
      audience: Иудеохристианские общины в рассеянии.
      date: Ок. 50-х–60-х гг. н. э., если авторство подлинное; ок. конца I в. н. э., если оно псевдонимное.
    1 Peter:
      display_name: Первое послание Петра
      author: По традиции — апостол Пётр, с Силуаном в качестве писца; некоторые исследователи считают авторство псевдонимным.
      audience: Христиане в римской Малой Азии, сталкивавшиеся с неприязнью общества.
      date: Ок. 60-х гг. н. э., если автором был Пётр; ок. 70-х–90-х гг. н. э., если авторство псевдонимное.
    2 Peter:
      display_name: Второе послание Петра
      author: По традиции — Пётр; многие современные исследователи считают авторство псевдонимным.
      audience: Христиане, столкнувшиеся с насмешниками, которые отрицали парусию.
      date: Ок. начала II в. н. э.
    1 John:
      display_name: Первое послание Иоанна
      author: Автор неизвестен; по традиции — апостол Иоанн или старец из круга Иоанна.
      audience: Община последователей Иоанна после раскола, определявшая, кто к ней принадлежит.
      date: Ок. 90–110 гг. н. э.
    2 John:
      display_name: Второе послание Иоанна
      author: «Старец».
      audience: Конкретная христианская община («избранная госпожа»), предостерегаемая от лжеучителей.
      date: Ок. 90–110 гг. н. э.
    3 John:
      display_name: Третье послание Иоанна
      author: «Старец».
      audience: Гаий, отдельный руководитель, принимавший странствующих миссионеров.
      date: Ок. 90–110 гг. н. э.
    Jude:
      display_name: Послание Иуды
      author: По традиции — Иуда, брат Иакова и Иисуса.
      audience: Христианские общины, в которые проникали учителя, оправдывавшие распущенность.
      date: Ок. 60-х–90-х гг. н. э.
    Revelation:
      display_name: Откровение
      author: Иоанн Патмосский (по стилю отличается от четвёртого Евангелия).
      audience: Семь христианских общин в римской Малой Азии под давлением имперской власти.
      date: Ок. 90-х гг. н. э.; по традиции — время правления Домициана.
    Tobit:
      display_name: Книга Товита
      author: Автор неизвестен.
      audience: Иудеи диаспоры, жившие благочестиво, вступавшие в брак и видевшие Божий промысел под чужеземной властью.
      date: Ок. 225–175 гг. до н. э.; написана на арамейском языке, при этом в Кумране также засвидетельствована древнееврейская версия.
    Judith:
      display_name: Книга Иудифи
      author: Автор неизвестен.
      audience: Иудеи перед лицом чужеземной угрозы — смелый рассказ о благочестивом сопротивлении.
      date: Ок. 150–100 гг. до н. э.
    Greek Additions to Esther:
      display_name: Греческие дополнения к книге Есфирь
      author: Автор неизвестен; дополнительный материал был добавлен в греческом переводе книги Есфирь.
      audience: Грекоязычные иудеи, желавшие видеть в рассказе об Есфири явные молитвы и упоминания Бога.
      date: Ок. II–I вв. до н. э.
    Wisdom of Solomon:
      display_name: Книга Премудрости Соломона
      author: Автор неизвестен; произведение псевдонимно приписано Соломону. Написано по-гречески эллинистическим иудейским автором, вероятно в Александрии.
      audience: Иудеи эллинистического мира, обращавшиеся к греческой философии и отстаивавшие мудрость Израиля перед языческими и отступническими альтернативами.
      date: Ок. 50 г. до н. э. — 50 г. н. э.
