  book_metadata:
    2 Esdras:
      display_name: 2 Ездры
      author: Автор неизвестен; первоначально иудейское ядро (4 Ездры, главы 3–14) позднее было обрамлено христианскими редакционными добавлениями.
      audience: Иудеи после 70 года н. э., пытавшиеся осмыслить проблему теодицеи; позднее текст был расширен для христианских читателей.
      date: Иудейское ядро — ок. 100 года н. э.; христианские добавления — ок. II–III веков н. э.
    Didache:
      display_name: Дидахе
      author: Автор неизвестен (название означает «Учение двенадцати апостолов»).
      audience: Ранние христианские общины — краткое руководство по нравственной жизни, крещению, евхаристии и странствующим учителям.
      date: Ок. конца I — начала II века н. э.
    Gospel of Thomas:
      display_name: Евангелие от Фомы
      author: Автор неизвестен; во вступлении сборник изречений приписывается «Дидиму Иуде Фоме». Полностью сохранился лишь в коптском переводе IV века из Наг-Хаммади (NHC II,2); известны также три греческих фрагмента из Оксиринха.
      audience: Христианские читатели, сформированные сирийской традицией мудрости и протогностической мыслью и ориентированные на сокровенное самопознание в изречениях Иисуса.
      date: Греческий оригинал, вероятно, был создан ок. 50–140 годов н. э.; коптская рукопись — ок. 340 года н. э.
      summary: Евангелие от Фомы — сборник изречений, приписываемых Иисусу. В нём нет связного повествования, и оно неоднократно призывает читателей постичь смысл этих изречений.
