  book_metadata:
    2 Esdras:
      display_name: 2 Ездры
      author: Автор неизвестен; первоначально иудейское ядро (4 Ездры, главы 3–14) позднее было обрамлено христианской редакцией.
      audience: Иудеи после 70 года н. э., пытавшиеся осмыслить проблему зла и Божьей справедливости; позднее текст был расширен для христианских читателей.
      date: Иудейское ядро — около 100 года н. э.; христианские дополнения — предположительно II–III века н. э.
    Didache:
      display_name: Дидахе
      author: Автор неизвестен (название означает «Учение двенадцати апостолов»).
      audience: Ранние христианские общины; краткое руководство по нравственной жизни, крещению, евхаристии и отношению к странствующим учителям.
      date: Предположительно конец I — начало II века н. э.
    Gospel of Thomas:
      display_name: Евангелие от Фомы
      author: Автор неизвестен; во вступлении сборник изречений приписан «Дидиму Иуде Фоме». Полностью текст сохранился лишь в коптском переводе IV века из Наг-Хаммади (NHC II,2); также известны три греческих фрагмента из Оксиринха.
      audience: Христианские читатели, чьи взгляды формировались под влиянием сирийской традиции мудрости и протогностической мысли и были ориентированы на сокровенное самопознание через изречения Иисуса.
      date: Греческий оригинал, вероятно, создан около 50–140 годов н. э.; коптская рукопись — около 340 года н. э.
      summary: Евангелие от Фомы — сборник изречений, приписываемых Иисусу. В нём нет связного повествования, и читателям неоднократно предлагается раскрыть смысл этих изречений.
