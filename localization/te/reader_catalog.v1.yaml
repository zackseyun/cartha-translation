      '35':
        title: నాయకులు వినయంతో, జ్ఞానంతో ఉండాలి
      '36':
        title: ప్రభువుకు భయపడడం ద్వారా రక్షణ వస్తుంది
      '37':
        title: స్నేహితులనూ సలహానూ జ్ఞానంతో ఎంచుకోండి
      '38':
        title: వైద్యులను గౌరవించండి, స్వస్థత కోసం ప్రార్థించండి
      '39':
        title: ధర్మశాస్త్రాన్ని నిబద్ధతతో పాటించేవారిని సీరాఖు ప్రశంసిస్తాడు
