      '6':
        title: నమ్మకమైన ప్రదక్షిణతో కూలిన యెరికో
      '7':
        title: ఆకాను పాపం వల్ల ఇశ్రాయేలుకు ఓటమి
      '8':
        title: ఆయి పట్టుబడింది, ధర్మశాస్త్రం పునరుద్ధరించబడింది
      '9':
        title: శాంతి కోసం గిబియోనీయుల మోసం
      '10':
        title: యుద్ధంలో సూర్యుడు నిలిచిపోవడం
      '11':
        title: ఉత్తర ప్రాంతమంతటా ఇశ్రాయేలు విజయం
      '12':
        title: ఓడిపోయిన ముప్పై ఒక్క మంది రాజులు
      '13':
        title: స్వాధీనం చేసుకోవాల్సిన దేశం ఇంకా ఎంతో ఉంది
      '14':
        title: కాలేబు తన పర్వత నివాసాన్ని కోరడం
