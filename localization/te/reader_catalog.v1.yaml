  John:
    display_name: యోహాను
    author: రచయిత పేరు తెలియదు; సంప్రదాయం ప్రకారం, అపొస్తలుడైన యోహాను లేదా “ప్రియ శిష్యుడు” దీనిని రాశాడని చెబుతారు.
