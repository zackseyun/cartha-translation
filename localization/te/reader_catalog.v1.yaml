  Matthew:
    display_name: మత్తయి
    author: రచయిత తెలియదు; సంప్రదాయం దీన్ని అపొస్తలుడైన మత్తయికి ఆపాదిస్తుంది. ఆధునిక పండితుల అభిప్రాయం ప్రకారం, గ్రీకు మాట్లాడే ఒక యూదు క్రైస్తవ రచయిత మార్కు రచననూ, ‘Q’ను పోలిన ఒక మూలాన్నీ ఉపయోగించాడు.
    audience: సమాజమందిర కేంద్రిత యూదా మతంతో తమకున్న కొనసాగింపునూ, తెగిపోయిన అంశాలనూ అర్థం చేసుకోవడానికి ప్రయత్నిస్తున్న ఒక యూదు క్రైస్తవ సమాజం.
    date: సుమారు క్రీ.శ. 80–90.
    chapters:
      '1':
        title: మెస్సీయ వంశంలో యేసు జననం
      '2':
        title: నవజాత రాజును ఆరాధించిన జ్ఞానులు
      '3':
        title: యోహాను బాప్తిస్మమిచ్చిన అభిషిక్తుడైన యేసు
      '4':
        title: దేవుని రాజ్యం సమీపించిందని యేసు బోధ
      '5':
        title: దేవుని రాజ్య జీవన విధానాన్ని బోధించిన యేసు
      '6':
        title: మొదట తండ్రి రాజ్యాన్ని వెదకండి
      '7':
        title: క్రీస్తు అనే పునాదిపై మీ జీవితాన్ని నిర్మించండి
      '8':
        title: స్వస్థపరచి తన అధికారాన్ని చూపిన యేసు
      '9':
        title: పక్షవాత రోగిని స్వస్థపరచిన యేసు
      '10':
        title: పన్నెండు మంది అపొస్తలులను పంపిన యేసు
      '11':
        title: అవిశ్వాసాన్ని బట్టి పట్టణాలను గద్దించిన యేసు
      '12':
        title: నిజమైన కుటుంబం ఎవరో వివరించిన యేసు
      '13':
        title: దేవుని రాజ్య ఉపమానాలను బోధించిన యేసు
      '14':
        title: అద్భుతంగా జనసమూహాలకు ఆహారం పెట్టిన యేసు
      '15':
        title: మతపరమైన కపటత్వాన్ని ఎదుర్కొన్న యేసు
      '16':
