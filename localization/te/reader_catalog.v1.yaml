    author: రచయిత ఎవరో తెలియదు; సంప్రదాయం ప్రకారం మోషే రాసినదిగా భావిస్తారు. ఆధునిక పండితుల అభిప్రాయం ప్రకారం, దీని రచన సుదీర్ఘ కాలంలో సాగింది; వివిధ మూలాలను ఆ తర్వాత ఒకటిగా కూర్చారు.
    audience: దేవుని సృష్టి, ఎంపిక, వాగ్దానం ఆధారంగా తమ ప్రజల ఆరంభ కథను గ్రహించి, నిబంధనకు చెందిన ప్రజలుగా తమ గుర్తింపును తెలుసుకునే ఇశ్రాయేలు ప్రజలు.
    date: అనేక శతాబ్దాల కాలంలో రచించబడింది; బబులోను చెర కాలంలో లేదా ఆ తర్వాత, సుమారు క్రీ.పూ. 6–5వ శతాబ్దాల్లో, ప్రస్తుతం అందిన రూపానికి వచ్చి ఉండవచ్చు.
    summary: ఆదికాండము సృష్టి గురించి, మానవులు దేవునికి తిరుగుబాటు చేసి చెదరిపోవడం గురించి, అలాగే ఇశ్రాయేలుకు దేవుడు చేసిన నిబంధన వాగ్దానాలు ఆరంభమైన అబ్రాహాము, ఇస్సాకు, యాకోబు, యోసేపుల కుటుంబం గురించి చెబుతుంది.
    chapters:
      '1':
        title: దేవుడు ఆకాశాన్ని, భూమిని సృష్టిస్తాడు
      '2':
        title: దేవుడు పురుషుణ్ణి, స్త్రీని రూపొందిస్తాడు
      '3':
        title: మానవులు ఏదెనులో తమ స్థానాన్ని కోల్పోతారు
      '4':
        title: కయీను తన తమ్ముడు హేబెలును హత్య చేస్తాడు
      '5':
        title: ఆదాము నుంచి నోవహు వరకు వంశావళి
      '6':
        title: దేవుడు జలప్రళయంతో పాపానికి తీర్పు తీరుస్తాడు
      '7':
        title: జలప్రళయం భూమిని కప్పివేస్తుంది
      '8':
        title: నోవహు ఓడ నుంచి బయటికి వచ్చి దేవుణ్ణి ఆరాధిస్తాడు
      '9':
        title: జలప్రళయం తర్వాత నోవహు కుటుంబం
      '10':
        title: నోవహు సంతతి భూమంతటా విస్తరిస్తుంది
      '11':
        title: భాషలు తారుమారై ప్రజలు చెదరిపోతారు
      '12':
        title: అబ్రాము విధేయుడై కనానుకు బయలుదేరుతాడు
      '13':
        title: అబ్రాము సంపన్నుడై తిరిగివచ్చి ప్రార్థిస్తాడు
      '14':
        title: దండెత్తినవారి నుంచి లోతును అబ్రాము రక్షిస్తాడు
      '15':
        title: అబ్రాముకు సంతానం ఇస్తానని దేవుడు వాగ్దానం చేస్తాడు
      '16':
        title: హాగరు పారిపోయి ఎడారి నీటిబుగ్గ దగ్గరకు చేరుతుంది
      '17':
        title: అబ్రాహాము సున్నతి పొందగా దేవుడు నిబంధనను పునరుద్ధరిస్తాడు
      '18':
        title: అబ్రాహాముకు కుమారుడు పుడతాడని దేవుడు వాగ్దానం చేస్తాడు
      '19':
        title: లోతు పారిపోగా పట్టణాలు అగ్నికి ఆహుతవుతాయి
      '20':
        title: హెచ్చరిక పొందిన అబీమెలెకు శారాను తిరిగి అప్పగిస్తాడు
      '21':
        title: శారా అబ్రాహాముకు ఇస్సాకును కంటుంది
      '22':
        title: మోరియాపై అబ్రాహాము ఇస్సాకును అర్పిస్తాడు
      '23':
        title: శారా మరణించగా అబ్రాహాము సమాధి స్థలం కొంటాడు
      '24':
        title: ఇస్సాకు కోసం సేవకుడు రిబ్కాను కనుగొంటాడు
      '25':
        title: అబ్రాహాము సంతతి, మరణం నమోదు చేయబడతాయి
      '26':
        title: ఇస్సాకు గెరారులో ఉండి కాపాడబడతాడు
      '27':
        title: యాకోబు ఇస్సాకును మోసం చేసి దీవెన పొందుతాడు
      '28':
        title: దేవదూతలు సంచరించే మెట్ల మార్గాన్ని యాకోబు కలలో చూస్తాడు
      '29':
        title: యాకోబు రాహేలును ప్రేమించి లేయాను పెళ్లి చేసుకుంటాడు
      '30':
        title: కరుణవల్ల యాకోబు వర్ధిల్లుతాడు
      '31':
        title: లాబాను కోపానికి యాకోబు భయపడతాడు
      '32':
        title: యాకోబు దేవుని దూతతో పెనుగులాడుతాడు
      '33':
        title: యాకోబు ఏశావును శాంతియుతంగా కలుస్తాడు
      '34':
        title: షెకెము దీనాపై దారుణంగా అత్యాచారం చేస్తాడు
      '35':
        title: యాకోబు బేతేలు బలిపీఠం దగ్గరకు తిరిగివస్తాడు
      '36':
        title: శేయీరు దేశంలో ఏశావు సంతతి
      '37':
        title: యోసేపు అన్నలు అతణ్ణి బానిసగా అమ్ముతారు
      '38':
        title: తామారు రహస్యంగా యూదాకు కుమారులను కంటుంది
      '39':
        title: పోతీఫరు ఇంట్లో యోసేపు వర్ధిల్లుతాడు
      '40':
        title: ఫరో అధికారులు కలలు కని కలవరపడతారు
      '41':
        title: యోసేపు ఫరో కలలకు అర్థం చెబుతాడు
      '42':
        title: ధాన్యం కోసం యాకోబు తన కుమారులను పంపుతాడు
      '43':
        title: బెన్యామీను తన అన్నలతో కలిసి ఐగుప్తుకు వెళ్తాడు
      '44':
        title: బెన్యామీను ప్రాణం కోసం యూదా వేడుకుంటాడు
      '45':
        title: యోసేపు తన అన్నలతో తిరిగి కలుస్తాడు
      '46':
        title: ఇశ్రాయేలు క్షేమంగా గోషెనుకు ప్రయాణిస్తాడు
      '47':
        title: యోసేపు తన కుటుంబానికి ఆహారం అందిస్తాడు
      '48':
        title: యాకోబు వివేకంతో యోసేపు కుమారులను దీవిస్తాడు
      '49':
        title: యాకోబు తన కుమారుల భవిష్యత్తు గురించి ప్రవచిస్తాడు
      '50':
        title: యోసేపు యాకోబు చివరి కోరికను నెరవేరుస్తాడు
  Exodus:
    display_name: నిర్గమకాండము
    author: రచయిత ఎవరో తెలియదు; సంప్రదాయం ప్రకారం మోషే రాసినదిగా భావిస్తారు. ఆధునిక పండితుల అభిప్రాయం ప్రకారం, దీని రచన సుదీర్ఘ కాలంలో సాగింది; వివిధ మూలాలను ఆ తర్వాత ఒకటిగా కూర్చారు.
    audience: విడిపించబడి దేవునితో నిబంధన చేసుకున్న ప్రజలైన ఇశ్రాయేలీయులు—ఆయన ధర్మశాస్త్రం కింద యెహోవాకు చెందిన జనంగా జీవించడం అంటే ఏమిటో నేర్చుకునేవారు.
    date: అనేక శతాబ్దాల కాలంలో రచించబడింది; సుమారు క్రీ.పూ. 6–5వ శతాబ్దాల్లో ప్రస్తుతం అందిన రూపానికి వచ్చి ఉండవచ్చు.
    chapters:
      '1':
        title: ఇశ్రాయేలు జనాభా వృద్ధి చెందేలా దేవుడు అనుగ్రహిస్తాడు
      '2':
        title: మోషే ఫరో నుండి రక్షించబడతాడు
      '3':
        title: మోషే దేవుని పిలుపు వింటాడు
      '4':
        title: మోషే దేవుని శక్తిని ఎదుర్కొంటాడు
      '5':
        title: ఫరో తన హృదయాన్ని కఠినం చేసుకుంటాడు
      '6':
        title: విడిపిస్తానని యెహోవా వాగ్దానం చేస్తాడు
      '7':
        title: అహరోను, మోషే ఎదిరిస్తారు
      '8':
        title: తెగుళ్లు ఐగుప్తును తీవ్రంగా దెబ్బతీస్తాయి
      '9':
        title: దేవుడు వడగండ్లతో ఐగుప్తును దెబ్బతీస్తాడు
      '10':
        title: ఫరో మళ్లీ నిరాకరిస్తాడు
      '11':
        title: చివరి తెగులు సమీపిస్తుంది
      '12':
        title: మరణం ఇశ్రాయేలీయులను దాటిపోతుంది
      '13':
        title: ఇశ్రాయేలు ప్రయాణాన్ని యెహోవా నడిపిస్తాడు
      '14':
        title: దేవుడు ఎర్ర సముద్రాన్ని చీలుస్తాడు
      '15':
        title: మోషే, ఇశ్రాయేలీయులు స్తుతిగీతం పాడుతారు
      '16':
        title: యెహోవా ప్రతిరోజూ మన్నాను అందిస్తాడు
      '17':
        title: అమాలేకీయులు ఇశ్రాయేలు శిబిరంపై దాడి చేస్తారు
      '18':
        title: యిత్రో మోషేకు జ్ఞానయుక్తమైన సలహా ఇస్తాడు
      '19':
        title: సీనాయి దగ్గర ఇశ్రాయేలు తనను ప్రతిష్ఠించుకుంటుంది
      '20':
        title: దేవుడు పది ఆజ్ఞలు ఇస్తాడు
      '21':
        title: ఇశ్రాయేలు స్వతంత్ర జీవనానికి సందర్భానుసారమైన చట్టాలు
      '22':
        title: నష్టపరిహారం, న్యాయం నిలబెట్టబడతాయి
      '23':
        title: సత్యం, నిష్పక్షపాతం, కరుణ పాటించాలి
      '24':
        title: బలితో నిబంధన స్థిరపరచబడుతుంది
      '25':
        title: పరిశుద్ధ నివాసం కోసం సూచనలు
      '26':
        title: గుడారం నమూనా వెల్లడవుతుంది
      '27':
        title: ఇత్తడి బలిపీఠం, ప్రాంగణం
      '28':
        title: అహరోను యాజకునిగా ప్రత్యేకించబడతాడు
      '29':
        title: సేవ కోసం యాజకులు ప్రతిష్ఠించబడతారు
      '30':
        title: పరిశుద్ధ అభిషేక తైలం, ధూపం
      '31':
        title: గుడారం పనికి దేవుడు నిపుణులైన శిల్పులను ఎంపిక చేస్తాడు
      '32':
        title: కోపంతో మోషే పలకలను పగలగొడతాడు
      '33':
        title: మోషే దేవుని మహిమను చూడాలని కోరుకుంటాడు
      '34':
        title: మోషే కొత్త పలకలను పొందుతాడు
      '35':
        title: ఆజ్ఞ కోసం మోషే ఇశ్రాయేలీయులను సమకూరుస్తాడు
      '36':
        title: ఆజ్ఞ ప్రకారం శిల్పులు పరిశుద్ధ స్థలాన్ని నిర్మిస్తారు
      '37':
        title: బెసలేలు పరిశుద్ధ ఉపకరణాలను నిర్దిష్టంగా తయారుచేస్తాడు
      '38':
        title: ఇత్తడి బలిపీఠం, కడుగుకొనే గంగాళం తయారవుతాయి
      '39':
        title: పరిశుద్ధ సేవ కోసం అహరోను వస్త్రాలు
      '40':
        title: మోషే గుడారాన్ని నిలబెడతాడు
  Leviticus:
    display_name: లేవీయకాండము
    author: రచయిత ఎవరో తెలియదు; సంప్రదాయం ప్రకారం మోషే రాసినదిగా భావిస్తారు. ఆధునిక పండితులు దీనిని యాజక మూలానికి చెందినదిగా పరిగణిస్తారు.
    audience: ఇశ్రాయేలు యాజకులు, ఆరాధించే సమాజం—బలులు, పరిశుద్ధత, దేవుని సన్నిధిని కేంద్రంగా చేసుకొని జీవనాన్ని క్రమబద్ధం చేసుకోవడం గురించి సూచనలు పొందేవారు.
    date: రాజ్యపాలన చివరి కాలం నుంచి చెర అనంతర కాలం వరకు, అంటే సుమారు క్రీ.పూ. 7–5వ శతాబ్దాల మధ్య, వివిధ దశల్లో రచించబడి ఉండవచ్చు.
    chapters:
      '1':
        title: యెహోవాకు ప్రీతికరమైన దహనబలులు
      '2':
        title: ఆయన సన్నిధిలో దహించే ధాన్యార్పణలు
      '3':
        title: బలిపీఠంపై అర్పించే సమాధానబలి
      '4':
        title: యాజకుల, ప్రజల పాపాలు
      '5':
        title: పాపాలను ఒప్పుకొని బలి తీసుకురావాలి
      '6':
        title: యాజకులు అర్పణలను జాగ్రత్తగా నిర్వహించాలి
      '7':
        title: అపరాధబలి, సమాధానబలి వివరణ
      '8':
        title: యాజకునిగా అహరోను ప్రతిష్ఠ
      '9':
        title: అర్పణను దహించిన అగ్ని
      '10':
        title: నాదాబు, అబీహులకు శిక్ష
      '11':
        title: శుద్ధమైన, అశుద్ధమైన ఆహారాల నియమాలు
      '12':
        title: ప్రసవం తర్వాత స్త్రీ శుద్ధీకరణ
      '13':
        title: చర్మవ్యాధులను పరిశీలించే యాజకులు
      '14':
        title: బలుల ద్వారా శుద్ధి పొంది పునరుద్ధరణ
      '15':
        title: శరీర స్రావాల వల్ల కలిగే అశుద్ధత
      '16':
        title: అన్ని పాపాలకు ప్రాయశ్చిత్తం
      '17':
        title: ప్రత్యక్ష గుడారపు ద్వారం దగ్గరకు బలులు తేవడం
      '18':
        title: నైతిక పవిత్రతను ఆజ్ఞాపించిన ప్రభువు
      '19':
        title: పవిత్రతకు పిలువబడిన ఇశ్రాయేలు
      '20':
        title: తీవ్రమైన పాపాలకు కఠిన తీర్పులు
      '21':
        title: యాజకులు ప్రత్యేక పవిత్రతను కాపాడాలి
      '22':
        title: పవిత్ర అర్పణలను జాగ్రత్తగా చూడాలి
      '23':
        title: ఆరాధనకు నియమించిన సమయాలు
      '24':
        title: దీపాలు వెలగడం, రొట్టెలు అర్పించడం
      '25':
        title: ప్రతి ఏడవ సంవత్సరం భూమికి విశ్రాంతి
      '26':
        title: నిబంధన మార్గం విషయంలో ఇశ్రాయేలు ఎంపిక
      '27':
        title: మొక్కుబడులు, ప్రతిష్ఠిత అర్పణల విషయంలో నమ్మకంగా ఉండాలి
  Numbers:
    display_name: సంఖ్యాకాండము
    author: రచయిత తెలియదు; సంప్రదాయం ప్రకారం మోషేకు ఆపాదించబడింది.
    audience: ఈజిప్టు నుండి వాగ్దాన దేశానికి ప్రయాణిస్తున్న ఇశ్రాయేలు ప్రజలు—అరణ్య తరం, అలాగే వారి వైఫల్యాల నుండి నేర్చుకున్న తరువాతి కాలపు పాఠకులు.
    date: రాజ్యపాలన చివరి కాలం నుండి చెర అనంతర కాలం వరకు ఏర్పడిన రచనా పొరలు (సుమారు క్రీ.పూ. 7వ–5వ శతాబ్దాలు).
    chapters:
      '1':
        title: ఇశ్రాయేలు పురుషులను లెక్కించిన మోషే
      '2':
        title: మందిర గుడారం చుట్టూ సమకూడిన గోత్రాలు
      '3':
        title: దేవుని పవిత్ర నివాసంలో సేవచేసే లేవీయులు
      '4':
        title: పవిత్ర వస్తువుల సంరక్షణలో కహాతీయులు
      '5':
        title: రహస్య పాపానికి దేవుని తీర్పు
      '6':
        title: నాజీర వ్రతం, ఆశీర్వాదం
      '7':
        title: పవిత్రస్థలం కోసం నాయకుల కానుకలు
      '8':
        title: దేవుని సేవకై లేవీయుల శుద్ధీకరణ
      '9':
        title: పస్కాను ఆచరించమని ప్రభువు ఆజ్ఞ
      '10':
        title: దేవుని ఆజ్ఞలను సూచించే వెండి బూరలు
      '11':
        title: దురాశ వల్ల వచ్చిన తెగులు
      '12':
        title: మోషే అధికారానికి వ్యతిరేకంగా మాట్లాడిన మిర్యాము
      '13':
        title: వాగ్దాన దేశాన్ని పరిశీలించిన పన్నెండు మంది
      '14':
        title: సందేహించినందుకు ఇశ్రాయేలుకు శిక్ష
      '15':
        title: అర్పణలు, కుచ్చుల గురించిన సూచనలు
      '16':
        title: కోరహు తిరుగుబాటు; వారిని మింగిన భూమి
      '17':
        title: యాజక వంశాన్ని నిరూపించిన అహరోను కర్ర
      '18':
        title: యాజకుల పర్యవేక్షణలో సేవచేసే లేవీయులు
      '19':
        title: శుద్ధిచేసే ఎర్ర ఆవు నియమం
      '20':
        title: కాదేషులో మోషే ఎదుర్కొన్న సంకటాలు
      '21':
        title: కనానీయ రాజును ఓడించిన ఇశ్రాయేలు
      '22':
        title: ఇశ్రాయేలును శపించడానికి నిరాకరించిన బిలాము
      '23':
        title: ఇశ్రాయేలును పదేపదే ఆశీర్వదించిన బిలాము
      '24':
        title: ఇశ్రాయేలు భవిష్య మహిమను ప్రకటించిన బిలాము
      '25':
        title: జిమ్రీని చంపిన ఫీనెహాసు
      '26':
        title: కొత్త యోధులను లెక్కించిన మోషే
      '27':
        title: తండ్రి వారసత్వాన్ని కోరిన కుమార్తెలు
      '28':
        title: ఇశ్రాయేలు క్రమంగా అర్పించే బలులు
      '29':
        title: నెలలో ఇశ్రాయేలు అర్పించే బలులు
      '30':
        title: మొక్కుబడుల గురించి మాట్లాడిన మోషే
      '31':
        title: మిద్యానుపై ప్రతీకారం తీర్చుకోమని మోషే ఆజ్ఞ
      '32':
        title: తూర్పు భూమిని కోరిన రూబేను, గాదు గోత్రాలు
      '33':
        title: ఈజిప్టు నుండి ఇశ్రాయేలు ప్రయాణ వివరాలు
      '34':
        title: కనాను సరిహద్దులను నిర్ణయించిన ప్రభువు
      '35':
        title: ఆశ్రయం, రక్షణ ఇచ్చే పట్టణాలు
      '36':
        title: తమ వంశంలోనే వివాహం చేసుకున్న సెలోపెహాదు కుమార్తెలు
  Deuteronomy:
    display_name: ద్వితీయోపదేశకాండము
    author: రచయిత తెలియదు; మోషే వీడ్కోలు ప్రసంగాలుగా సమర్పించబడింది. ఆధునిక పరిశోధకులు దీని మూలభాగాన్ని క్రీ.పూ. 7వ శతాబ్దం చివరలో యోషీయా చేపట్టిన సంస్కరణల కాలానికి చెందినదిగా భావిస్తారు.
    audience: దేశంలో ప్రవేశించడానికి సిద్ధమవుతున్న ఇశ్రాయేలు ప్రజలు—అలాగే ఆలయం గానీ రాజు గానీ లేకుండా నమ్మకంగా ఎలా జీవించాలని ప్రశ్నించిన తరువాతి కాలపు చెరలోని ప్రజలు.
    date: మూలభాగం సుమారు క్రీ.పూ. 7వ శతాబ్దం చివరిది; చెర కాలంలో తుది రూపం పొందింది.
    chapters:
      '1':
        title: దేవుని నమ్మకత్వాన్ని వివరించిన మోషే
      '2':
        title: ఎదోము, మోయాబులను తప్పించుకొని వెళ్లిన ఇశ్రాయేలు
      '3':
        title: ఓగు రాజును ఓడించిన ఇశ్రాయేలు
      '4':
        title: జ్ఞానంతో విధేయత చూపమని మోషే ప్రబోధం
      '5':
        title: పది ఆజ్ఞలను మళ్లీ తెలిపిన మోషే
      '6':
        title: దేవుణ్ణి ప్రేమించమని ఇశ్రాయేలుకు మోషే ఆజ్ఞ
      '7':
        title: విగ్రహాలను నాశనం చేయాల్సిన ఇశ్రాయేలు
      '8':
        title: కష్టకాలంలో దేవుని సంరక్షణను జ్ఞాపకం చేసుకోండి
      '9':
        title: ఇశ్రాయేలు కోసం వేడుకున్న మోషే
      '10':
        title: దేవుడు కోరేవాటిని తెలిపిన మోషే
      '11':
        title: ప్రేమించమని ఇశ్రాయేలుకు మోషే ఆజ్ఞ
      '12':
        title: ఎంచుకున్న స్థలంలోనే ఆరాధన
      '13':
        title: అబద్ధ ప్రవక్తలను, విగ్రహాలను తిరస్కరించండి
      '14':
        title: దేవుని ప్రజలుగా భిన్నంగా జీవించండి
      '15':
        title: ప్రతి ఏడవ సంవత్సరం అప్పుల రద్దు
      '16':
        title: ఉదారతతో పండుగలను జరుపుకోండి
      '17':
        title: విగ్రహారాధనకు తీర్పు; ధర్మశాస్త్రాన్ని అనుసరించడం
      '18':
        title: యాజకులను, లేవీయులను నమ్మకంగా పోషించండి
      '19':
        title: అనుకోకుండా చంపినవారికి ఆశ్రయమిచ్చే పట్టణాలు
      '20':
        title: యుద్ధంలో ప్రభువును నమ్మండి
      '21':
        title: హత్యకు గురైనవారి విషయంలో న్యాయంగా వ్యవహరించండి
      '22':
        title: పవిత్రతను, గౌరవాన్ని కాపాడండి
      '23':
        title: ద్వితీయోపదేశకాండములో పవిత్రతకు సంబంధించిన ఆజ్ఞలు
      '24':
        title: న్యాయాన్ని, మానవ గౌరవాన్ని కాపాడండి
      '25':
        title: దోషిని అవమానించకుండా శిక్షించండి
      '26':
        title: ప్రథమ ఫలాల గురించి ప్రభువు ఎదుట ఒప్పుకోలు
      '27':
        title: రాతి బలిపీఠాన్ని నిర్మించమని మోషే ఆజ్ఞ
      '28':
        title: విధేయత తెచ్చే ఆశీర్వాదం
      '29':
        title: రాబోయే తరాలతో కలిసి నిబంధనలో ప్రవేశం
      '30':
        title: జీవాన్ని ఎంచుకోమని ఇశ్రాయేలుకు మోషే ప్రబోధం
      '31':
        title: మోషే రాసి యెహోషువను విడిచిపెడతాడు
      '32':
        title: వారికి వ్యతిరేక సాక్ష్యంగా పాడిన మోషే
      '33':
        title: ప్రతి గోత్రాన్ని ఆశీర్వదించిన మోషే
      '34':
