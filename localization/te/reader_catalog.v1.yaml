        title: నలుగురు గుర్రపు రౌతులు మహా విపత్తులు తెస్తారు
      '7':
        title: ముద్రించబడిన సేవకులు నిత్య స్తుతి పాడుతారు
      '8':
        title: భయంకర తీర్పులను ప్రకటించే ఏడు బూరలు
      '9':
        title: భూమిపై పాపులను మిడతలు హింసిస్తాయి
      '10':
        title: ఇక ఆలస్యం ఉండదని బలవంతుడైన దూత ప్రమాణం
      '11':
        title: ఇద్దరు సాక్షులు ప్రవచించి తిరిగి లేస్తారు
      '12':
        title: పాలించబోయే కుమారుణ్ని కనే స్త్రీ
      '13':
        title: సముద్రం నుంచి పైకి వచ్చే మృగం
      '14':
        title: నమ్మకస్థులను తనవద్దకు చేర్చుకునే గొర్రెపిల్ల
      '15':
        title: పరలోక ఉగ్రతను చూసే యోహాను
      '16':
        title: ఉగ్రత పాత్రలను కుమ్మరించే దూతలు
      '17':
        title: బబులోను తీర్పు, దేవుని విజయం
      '18':
        title: బబులోను పతనంపై పరలోక ఆనందం
      '19':
        title: గొర్రెపిల్ల వివాహాన్ని పరలోకం వేడుక చేసుకుంటుంది
      '20':
        title: చివరి తీర్పును చూసే యోహాను
      '21':
        title: సమస్తం కొత్తగా చేయబడుతుంది
      '22':
        title: యేసు త్వరగా వస్తున్నాడు
  Tobit:
    display_name: తోబీతు
    author: రచయిత పేరు తెలియదు.
    audience: విదేశీ పాలనలో భక్తి, వివాహం, దైవ పరిపాలన సంబంధిత విషయాలను ఎదుర్కొంటున్న ప్రవాస యూదులు.
    date: సుమారు క్రీ.పూ. 225–175; అరామిక్ భాషలో రచించబడింది; దాని హీబ్రూ రూపం కూడా కుమ్రానులో లభించిన ఆధారాల ద్వారా తెలిసింది.
    chapters:
      '1':
        title: దేవుణ్ణి నమ్మకంగా జ్ఞాపకం చేసుకునే తోబీతు
      '2':
        title: తిరస్కరించబడిన పొరుగువానికి సమాధి చేసే తోబీతు
      '3':
        title: మరణం కోసం ఏడుస్తూ ప్రార్థించే తోబీతు
      '4':
        title: నీతిగా జీవించమని కుమారునికి తోబీతు ఉపదేశం
      '5':
        title: మార్గదర్శకునితో బయలుదేరే తోబీయా
      '6':
        title: స్వస్థపరిచే చేపను పట్టే తోబీయా
      '7':
        title: ఎక్బతానాలో సారాను వివాహమాడే తోబీయా
      '8':
        title: సారాను వివాహమాడి ప్రార్థించే తోబీయా
      '9':
        title: తోబీతుకు డబ్బు తిరిగి ఇచ్చే గబాయేలు
      '10':
        title: క్షేమంగా ఇంటికి తిరిగివచ్చే తోబీయా
      '11':
        title: కుమారుని ద్వారా తోబీతుకు తిరిగి వచ్చిన చూపు
      '12':
        title: తన నిజమైన గుర్తింపును వెల్లడించే రఫాయేలు
      '13':
        title: యెరూషలేము కోసం తోబీతు ప్రార్థన
      '14':
        title: ఇశ్రాయేలు భవిష్యత్తును ముందుగా చూసే తోబీతు
  Judith:
    display_name: యూదితు
    author: రచయిత పేరు తెలియదు.
    audience: విదేశీ ముప్పును ఎదుర్కొంటున్న యూదులు—భక్తితో కూడిన ధీటైన ప్రతిఘటన కథ.
    date: సుమారు క్రీ.పూ. 150–100.
    chapters:
      '1':
        title: అర్పక్షదుపై నెబుకద్నెజరు దాడి
      '2':
        title: పడమటి దిశగా దండెత్తే హోలోఫెర్నెసు
      '3':
        title: సంపదను అప్పగించే తీరప్రాంత ప్రజలు
      '4':
        title: ఉపవాసముండి సహాయం కోసం ప్రార్థించే ఇశ్రాయేలు
      '5':
        title: ఇశ్రాయేలు చరిత్రను వివరించే అకియోరు
      '6':
        title: హోలోఫెర్నెసు గురించి హెచ్చరిక పొందిన అకియోరు
      '7':
        title: నీరు అయిపోతున్న బేతూలియా
      '8':
        title: దేవుని రక్షణను ప్రకటించే యూదితు
      '9':
        title: దేవుని బలం కోసం యూదితు ప్రార్థన
      '10':
        title: అష్షూరు శిబిరంలోకి ప్రవేశించే యూదితు
      '11':
        title: యూదితును లోపలికి ఆహ్వానించే హోలోఫెర్నెసు
      '12':
        title: దేవుని మార్గదర్శకం కోరే యూదితు
      '13':
        title: హోలోఫెర్నెసు తలను నరికే యూదితు
      '14':
        title: యూదితు విజయాన్ని వేడుక చేసుకునే ఇశ్రాయేలు
      '15':
        title: అష్షూరు కొల్లసొమ్మును దోచుకునే ఇశ్రాయేలు
      '16':
        title: స్తుతిగీతాన్ని నడిపించే యూదితు
  Greek Additions to Esther:
    display_name: ఎస్తేరు గ్రంథానికి గ్రీకు అనుబంధాలు
    author: రచయిత పేరు తెలియదు; ఎస్తేరు గ్రంథ గ్రీకు అనువాదంలో చేర్చిన అదనపు భాగాలు.
    audience: స్పష్టమైన ప్రార్థనలు, దేవుని ప్రస్తావనలతో కూడిన ఎస్తేరు కథను కోరిన గ్రీకు మాట్లాడే యూదులు.
    date: సుమారు క్రీ.పూ. రెండవ–మొదటి శతాబ్దాలు.
    chapters:
      '1':
        title: మొర్దెకై కల, రాజుకు హెచ్చరిక
      '2':
        title: నాశనం చేయమని ఆజ్ఞలు రాసే రాజు
      '3':
        title: సహాయం కోసం మొర్దెకై, ఎస్తేరు ప్రార్థన
      '4':
        title: రాజు సమక్షంలోకి ప్రవేశించే ఎస్తేరు
      '5':
        title: హామానును శిక్షించి యూదులను రక్షించే రాజు
      '6':
        title: కలను జ్ఞాపకం చేసుకొని ప్రవచించే మొర్దెకై
  Wisdom of Solomon:
    display_name: సొలొమోను జ్ఞానం
    author: రచయిత పేరు తెలియదు; సొలొమోను పేరుతో రాయబడింది. గ్రీకు భాషలో హెలెనిస్టిక్ యూదు రచయిత దీనిని రచించాడు; బహుశా అలెగ్జాండ్రియాలో రచించి ఉండవచ్చు.
    audience: గ్రీకు తత్వశాస్త్రంతో సంభాషిస్తూ, అన్యమత మరియు తమ విశ్వాసాన్ని విడిచిపెట్టినవారి ప్రత్యామ్నాయాలకు ఎదురుగా ఇశ్రాయేలు జ్ఞానాన్ని సమర్థిస్తున్న హెలెనిస్టిక్ యూదులు.
    date: సుమారు క్రీ.పూ. 50–క్రీ.శ. 50.
    chapters:
      '1':
        title: వెదికేవారికి జ్ఞానాన్ని వెల్లడించే దేవుడు
      '2':
        title: జీవితంలోని నిజమైన ఆనందాన్ని తిరస్కరించే దుష్టులు
      '3':
        title: శాంతిగా విశ్రమించే నీతిమంతుల ఆత్మలు
      '4':
        title: సద్గుణానికి గౌరవం, భక్తిహీనులకు అవమానం
      '5':
        title: దుష్టత్వాన్ని ధైర్యంగా బట్టబయలు చేసే నీతిమంతులు
      '6':
        title: నిజమైన రాజ్యపాలనకు నడిపించే జ్ఞానం
      '7':
        title: ప్రార్థన జ్ఞానాన్నీ అవగాహననూ తెస్తుంది
      '8':
        title: జ్ఞానం పాలకులకు మార్గం చూపి బలపరుస్తుంది
      '9':
        title: రాజు దైవజ్ఞానం కోసం ప్రార్థిస్తాడు
      '10':
        title: జ్ఞానం నీతిమంతులను కాపాడి విడిపిస్తుంది
      '11':
        title: దేవుడు క్రమశిక్షణ ద్వారా కరుణ చూపుతాడు
      '12':
        title: విగ్రహాలను ఎగతాళి చేయడం వ్యర్థమైన ఆశనే మిగులుస్తుంది
      '13':
        title: ప్రజలు ప్రాణంలేని విగ్రహాలను పూజిస్తారు
      '14':
        title: దేవుడు ఓడలను సముద్రంలో నడిపిస్తాడు
      '15':
        title: దేవుని కరుణ నిజమైన ఆరాధనకు దారి చూపుతుంది
      '16':
        title: పీడించేవారికి తీర్పు తీరుస్తూనే దేవుడు సమకూరుస్తాడు
      '17':
        title: భయానక రాత్రి కౌగిలిలో చిక్కుకున్నారు
      '18':
        title: దేవుడు వెలుగుతో దారి చూపుతాడు
      '19':
        title: ఇశ్రాయేలు కోసం మేఘాలు పక్కకు తొలగుతాయి
  Sirach:
    display_name: సీరాఖు
    author: యెరూషలేముకు చెందిన యెషువా బెన్ ఎలియాజరు బెన్ సీరా; ఆయన మనవడు గ్రీకులోకి అనువదించాడు.
    audience: హెల్లెనిస్టిక్ కాలపు యెరూషలేములో జ్ఞానవిషయాల్లో శిక్షణ పొందుతున్న యూద యువకులు.
    date: హీబ్రూ మూలగ్రంథం సుమారు క్రీ.పూ. 195–175; గ్రీకు అనువాదం సుమారు క్రీ.పూ. 132.
    chapters:
      '1':
        title: దేవుడు జ్ఞానాన్ని కొలిచి అనుగ్రహిస్తాడు
      '2':
        title: పరీక్షలు నమ్మకమైన సేవకులను రుజువు చేస్తాయి
      '3':
        title: తల్లిదండ్రులను గౌరవించి దీర్ఘాయువు పొందండి
      '4':
        title: పీడితులను కాపాడి జ్ఞానాన్ని వెదకండి
      '5':
        title: సంపదను కాదు, దేవుణ్ణి నమ్మండి
      '6':
        title: రైతులా జ్ఞానాన్ని వెదకండి
      '7':
        title: హృదయంలో లోతైన వినయాన్ని నిలుపుకోండి
      '8':
        title: మూర్ఖులకు దూరంగా ఉండి పెద్దలను గౌరవించండి
      '9':
        title: అసూయ, కామం విషయంలో జాగ్రత్తగా ఉండండి
      '10':
        title: జ్ఞానయుక్తమైన నాయకత్వం క్రమాన్ని తెస్తుంది
      '11':
        title: జ్ఞానం పేదవారిని పైకి లేపుతుంది
      '12':
        title: పాపులకు కాదు, నీతిమంతులకు సహాయం చేయండి
      '13':
        title: తారును తాకితే అంటుకుంటుంది
      '14':
        title: జ్ఞానం శాశ్వతమైన దీవెన తెస్తుంది
      '15':
        title: వెదికేవారిని జ్ఞానం కలుసుకుంటుంది
      '16':
        title: నమ్మకమైన ఒక్క వ్యక్తి నగరాన్ని నిలబెడతాడు
      '17':
        title: మానవులు దేవుని స్వరూపంలో చేయబడ్డారు
      '18':
        title: మంచి పనులను చెడగొట్టవద్దు
      '19':
        title: సుఖాల వెంటపడేవారు నాశనమవుతారు
      '20':
