    chapters:
      '1':
        title: అపవిత్ర తిరుగుబాటుతో బాధపడిన సహోదరులు
      '2':
        title: వినయం తెచ్చే శాంతియుత ఆసక్తి
      '3':
        title: అసూయ తెచ్చిన యుద్ధం, చెర
      '4':
        title: ప్రాచీన హత్యలకు దారితీసిన అసూయ
