        title: అమ్మోనీయుల సైన్యాలను ఓడించిన యోవాబు
      '11':
        title: బత్షెబతో పాపం చేసిన దావీదు
      '12':
        title: దావీదు పాపాన్ని నిలదీసిన నాతాను
      '13':
        title: అమ్నోనును హత్య చేసిన అబ్షాలోము
      '14':
        title: అబ్షాలోముతో సమాధానపడిన దావీదు
      '15':
        title: అబ్షాలోము నుంచి పారిపోతున్న దావీదు
      '16':
        title: మెఫీబోషెతుకు ద్రోహం చేసిన సీబా
      '17':
        title: అహీతోపెలు పథకాన్ని భగ్నం చేసిన హూషై
      '18':
        title: యుద్ధంలో అబ్షాలోమును చంపిన యోవాబు
      '19':
        title: అబ్షాలోము కోసం దుఃఖించిన దావీదు
      '20':
        title: ఇశ్రాయేలీయుల తిరుగుబాటుకు నాయకత్వం వహించిన షెబా
      '21':
        title: సౌలు పాపానికి ప్రాయశ్చిత్తం చేసిన దావీదు
      '22':
        title: దేవుని విమోచనను స్తుతించిన దావీదు
      '23':
        title: పరాక్రమశాలులను గౌరవించిన దావీదు
      '24':
        title: దావీదు తెగులును ఆపుతాడు
  1 Kings:
    display_name: 1 రాజులు
    author: రచయిత తెలియదు; ద్వితీయోపదేశకాండ చరిత్రలో భాగం.
    audience: రాజ్యం ఎందుకు పతనమైందని ప్రశ్నించిన చెరలోని, చెరానంతర ఇశ్రాయేలు ప్రజలు.
    date: బబులోను చెర కాలంలో, సుమారు క్రీ.పూ. 6వ శతాబ్దంలో, తుది రూపం పొందింది.
    chapters:
      '1':
        title: సొలొమోను రాజుగా అభిషేకించబడతాడు
      '2':
        title: దావీదు సొలొమోనుకు నమ్మకంగా ఉండమని ఆదేశిస్తాడు
      '3':
        title: సొలొమోను దైవిక జ్ఞానాన్ని అడుగుతాడు
      '4':
        title: సొలొమోను క్రమబద్ధమైన బలంతో పరిపాలిస్తాడు
      '5':
        title: సొలొమోను ఆలయాన్ని నిర్మించి కీర్తిని పొందుతాడు
      '6':
        title: ఆలయ నిర్మాణం జాగ్రత్తగా ప్రారంభమవుతుంది
      '7':
        title: సొలొమోను ఆలయ సామగ్రిని పూర్తిచేస్తాడు
      '8':
        title: సొలొమోను ఆలయంలో ప్రార్థిస్తాడు
      '9':
        title: యెహోవా సొలొమోనుతో చేసిన నిబంధనను మళ్లీ ధృవీకరిస్తాడు
      '10':
        title: రాణి సొలొమోను జ్ఞానాన్ని మెచ్చుకుంటుంది
      '11':
        title: సొలొమోను తడబడి దేవుని నుండి తొలగిపోతాడు
      '12':
        title: రెహబాము ప్రజల విన్నపాన్ని తిరస్కరిస్తాడు
      '13':
        title: ప్రవక్త రాజును ఎదిరించి మరణిస్తాడు
      '14':
        title: యరొబాము దేవుని తీర్పును ఎదుర్కొంటాడు
      '15':
        title: ఆసా నమ్మకంగా విగ్రహాలను తొలగిస్తాడు
      '16':
        title: యెహోవా ఇశ్రాయేలు రాజులకు తీర్పు తీరుస్తాడు
      '17':
        title: ఏలీయా అద్భుతంగా విధవరాలికి ఆహారం అందిస్తాడు
      '18':
        title: ఏలీయా అహాబును ఎదిరించి తీర్పు ప్రకటిస్తాడు
      '19':
        title: ఏలీయా హోరేబులో తన కార్యనియామకాన్ని పొందుతాడు
      '20':
        title: అహాబు బెన్హదదును విడిచిపెడతాడు
      '21':
        title: యెజెబెలు నాబోతు హత్యకు పథకం వేస్తుంది
      '22':
        title: మీకాయా ముందుగా చెప్పినట్లే అహాబు మరణిస్తాడు
  2 Kings:
    display_name: 2 రాజులు
    author: రచయిత తెలియదు; ద్వితీయోపదేశకాండ చరిత్రలో భాగం.
    audience: చెరలోని ఇశ్రాయేలు ప్రజలు—బబులోను ఆక్రమణతో ముగిసిన విభజిత రాజ్యాలపై ఒక దైవశాస్త్రపర పరిశీలన.
    date: క్రీ.పూ. 586 తర్వాత, సుమారు క్రీ.పూ. 6వ శతాబ్దంలో, తుది రూపం పొందింది.
    chapters:
      '1':
        title: అహజ్యా ఏలీయా ప్రకటించిన తీర్పును ఎదుర్కొంటాడు
      '2':
        title: సుడిగాలిలో ఏలీయా పైకి తీసుకోబడతాడు
      '3':
        title: యెహోరాము ఎలీషాతో కలిసి మోయాబుతో యుద్ధం చేస్తాడు
      '4':
        title: ఎలీషా అవసరంలో ఉన్నవారికి సహాయం చేస్తాడు
      '5':
        title: నయమాను కుష్ఠరోగం నుండి శుద్ధి పొందుతాడు
      '6':
        title: ఎలీషా అరాము పథకాలను వెల్లడిస్తాడు
      '7':
        title: సమరయ కరవు అకస్మాత్తుగా ముగుస్తుంది
      '8':
        title: ఎలీషా రాజులను హెచ్చరించి తీర్పు ప్రకటిస్తాడు
      '9':
        title: యెహూ అహాబు ఇంటివారిని వధిస్తాడు
      '10':
        title: యెహూ బయలు ఆరాధనను నిర్మూలిస్తాడు
      '11':
        title: ఆలయంలో జరిగిన అధికార మార్పిడిలో యోవాషు రాజుగా కిరీటం ధరిస్తాడు
      '12':
        title: యెహోయాషు ఆలయానికి మరమ్మతులు చేయిస్తాడు
      '13':
        title: ఇశ్రాయేలుపై కనికర చక్రం ముగుస్తుంది
      '14':
        title: అమజ్యా ఎదోమును ఓడించినా విఫలమవుతాడు
      '15':
        title: యూదా స్థిరంగా ఉంటుంది, ఇశ్రాయేలు క్షీణిస్తుంది
      '16':
        title: ఆహాజు అష్షూరు సహాయాన్ని ఆశ్రయిస్తాడు
      '17':
        title: పట్టువిడవని పాపం వల్ల ఇశ్రాయేలు చెరకు వెళ్తుంది
      '18':
        title: హిజ్కియా యెహోవాను మాత్రమే నమ్ముతాడు
      '19':
        title: యెహోవా యెరూషలేమును అష్షూరు నుండి విడిపిస్తాడు
      '20':
        title: హిజ్కియా ప్రార్థించి స్వస్థత పొందుతాడు
      '21':
        title: మనష్షే యూదాను దుష్టత్వంలోకి నడిపిస్తాడు
      '22':
        title: యోషీయా ధర్మశాస్త్రాన్ని కనుగొని పశ్చాత్తాపపడతాడు
      '23':
        title: యోషీయా విగ్రహారాధనను తొలగించి పస్కాను పునరుద్ధరిస్తాడు
      '24':
        title: బబులోను యెహోయాకీనును బందీగా తీసుకెళ్తుంది
      '25':
        title: బబులోనులో యెహోయాకీను గౌరవం పొందుతాడు
  1 Chronicles:
    display_name: 1 దినవృత్తాంతాలు
    author: రచయిత తెలియదు; సంప్రదాయం ఆయనను “దినవృత్తాంతకర్త” అని పిలుస్తుంది.
    audience: పర్షియా కాలంలోని యెహూదులోని చెరానంతర యూదా సమాజం; దావీదు, ఆలయం, ఆరాధనల చుట్టూ తమ గుర్తింపును మళ్లీ స్థిరపరచుకుంటున్న ప్రజలు.
    date: సుమారు క్రీ.పూ. 4వ శతాబ్దం.
    chapters:
      '1':
        title: దేవుడు ఇశ్రాయేలు వంశక్రమాన్ని ఏర్పరుస్తాడు
      '2':
        title: తరతరాలుగా కొనసాగిన యూదా వంశం
      '3':
        title: దావీదు వంశం కొనసాగుతుంది
      '4':
        title: యాఫెతు సంతతి పేర్లు
      '5':
        title: తూర్పు గోత్రాలు ఉత్తరదేశానికి చెరగా వెళ్లాయి
      '6':
        title: లేవి యాజక వంశానికి గౌరవం
      '7':
        title: ఇశ్శాఖారు పరాక్రమ యోధులు
      '8':
        title: బెన్యామీను నాయకులు, వంశాలు
      '9':
        title: యెరూషలేముకు తిరిగి వచ్చి పునర్నిర్మించడం
      '10':
        title: గిల్బోవ పర్వతంపై సౌలు మరణిస్తాడు
      '11':
        title: దావీదు అందరికీ రాజుగా అభిషేకించబడతాడు
      '12':
        title: యోధులు దావీదు రాజ్యంలో చేరతారు
      '13':
        title: దావీదు మందసాన్ని తిరిగి తీసుకొస్తాడు
      '14':
        title: దావీదు మళ్లీ ఫిలిష్తీయులను ఓడిస్తాడు
      '15':
        title: మందసం యెరూషలేముకు తీసుకురాబడుతుంది
      '16':
        title: దావీదు ఆలయ ఆరాధనకు సేవకులను నియమిస్తాడు
      '17':
        title: దేవుడు దావీదు రాజవంశం గురించి వాగ్దానం చేస్తాడు
      '18':
        title: దావీదు దేశాలపై విజయం సాధిస్తాడు
      '19':
        title: యోవాబు అమ్మోనును, అరామును ఓడిస్తాడు
      '20':
        title: యోవాబు రబ్బా పట్టణాన్ని స్వాధీనం చేసుకుంటాడు
      '21':
        title: దావీదు జనగణన తెగులును తెస్తుంది
      '22':
        title: దేవుని మందిరాన్ని నిర్మించడానికి సొలొమోను ఎంపికవుతాడు
      '23':
        title: లేవీయులు సేవ కోసం క్రమబద్ధీకరించబడతారు
      '24':
        title: యాజకులు చీట్ల ద్వారా విభజించబడతారు
      '25':
        title: ఆరాధన కోసం సంగీతకారులు క్రమబద్ధీకరించబడతారు
      '26':
        title: ఆలయ కాపలాదారులు జాగ్రత్తగా నియమించబడతారు
      '27':
        title: దావీదు పాలనలో ఇశ్రాయేలు క్రమబద్ధీకరించబడుతుంది
      '28':
        title: దావీదు ఆలయ ప్రణాళికలను అప్పగిస్తాడు
      '29':
        title: దేశాలు దేవుని మందిరానికి కానుకలు ఇస్తాయి
  2 Chronicles:
    display_name: 2 దినవృత్తాంతాలు
    author: రచయిత తెలియదు; దినవృత్తాంతకర్త.
    audience: చెరానంతర యూదా సమాజం.
    date: సుమారు క్రీ.పూ. 4వ శతాబ్దం.
    chapters:
      '1':
        title: సొలొమోను జ్ఞానాన్ని అడుగుతాడు
      '2':
        title: ఆలయ ప్రణాళికలు, వినయం
      '3':
        title: ఆలయ నిర్మాణం ప్రారంభమవుతుంది
      '4':
        title: ఆలయ సామగ్రి తయారవుతుంది
      '5':
        title: మందసం ఆలయానికి తీసుకురాబడుతుంది
      '6':
        title: సొలొమోను ఆలయం కోసం ప్రార్థిస్తాడు
      '7':
        title: అగ్ని బలులను దహిస్తుంది
      '8':
