      '2':
        title: యేసు నీటిని ద్రాక్షారసంగా మారుస్తాడు
      '3':
        title: దేవుడు తన ప్రియ కుమారుణ్ణి ఇస్తాడు
      '4':
        title: యేసు సమరయ స్త్రీని కలుస్తాడు
      '5':
        title: యేసు విశ్రాంతి దినాన ఒక మనిషిని స్వస్థపరుస్తాడు
      '6':
        title: యేసు జనసమూహంలోని ఐదువేల మందికి ఆహారం పెడతాడు
      '7':
        title: యేసు పండుగలో బోధిస్తాడు
      '8':
        title: లోకానికి వెలుగైన యేసు తిరస్కరించబడతాడు
      '9':
        title: యేసు పుట్టుగుడ్డివాణ్ణి స్వస్థపరుస్తాడు
      '10':
        title: యేసు తన గొర్రెల గురించి మాట్లాడుతాడు
      '11':
        title: యేసు లాజరును మృతులలోనుండి లేపుతాడు
      '12':
        title: మరియ యేసు సమాధి కోసం ఆయనకు అభిషేకం చేస్తుంది
      '13':
        title: యేసు శిష్యుల పాదాలు కడుగుతాడు
      '14':
        title: యేసు పరిశుద్ధాత్మను వాగ్దానం చేస్తాడు
