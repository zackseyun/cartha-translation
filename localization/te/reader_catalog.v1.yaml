      '11':
        title: టోలెమీ ముప్పును యోనాతాను ఎదుర్కొంటాడు
      '12':
        title: యూదయలోని కోటలను సీమోను పటిష్ఠం చేస్తాడు
      '13':
        title: యెరూషలేము కోటను సీమోను అణచివేస్తాడు
      '14':
        title: సీమోను ఇశ్రాయేలును పటిష్ఠపరచి శాంతిని నెలకొల్పుతాడు
      '15':
