        title: తన అల్పత్వాన్ని యోబు ఒప్పుకోవడం
      '41':
        title: మానవ బలానికి లొంగని లివ్యాతాను
      '42':
        title: యోబు పశ్చాత్తాపపడి పునరుద్ధరించబడడం
  Psalms:
    display_name: కీర్తనలు
    author: అనేక శతాబ్దాల కాలంలో పలువురు రచయితలు; పైశీర్షికలు దావీదు, ఆసాపు, కోరహు, సొలొమోను, మోషే తదితరుల పేర్లను పేర్కొంటాయి.
    audience: ఆరాధనలో ఉన్న ఇశ్రాయేలు ప్రజలు, దేవాలయ సమాజం—అలాగే తరువాతి కాలాల్లో ప్రార్థించే, విలపించే ప్రతి సమాజం.
    date: సుమారు క్రీ.పూ. 10వ–3వ శతాబ్దాల మధ్య రచించబడింది; చెర అనంతర కాలంలో తుది సంకలనం జరిగింది.
    chapters:
      '1':
        title: నీతిమంతమైన జీవితం ధన్యమైనది
      '2':
        title: తిరుగుబాటు రాజులను చూసి దేవుడు నవ్వడం
      '3':
        title: దేవుని కేడెమును దావీదు నమ్మడం
      '4':
        title: దావీదు దేవుని వెలుగును కోరుతున్నాడు
      '5':
        title: దేవుని ముఖదర్శనం కోసం దావీదు ప్రార్థిస్తున్నాడు
      '6':
        title: దేవుని కరుణ కోసం దావీదు మొరపెడుతున్నాడు
      '7':
        title: నీతిమంతుడైన న్యాయాధిపతికి దావీదు మొరపెడుతున్నాడు
      '8':
        title: దావీదు దేవుని మహిమను స్తుతిస్తున్నాడు
      '9':
        title: దావీదు దేవుని పరిపాలనను వేడుకగా జరుపుకుంటున్నాడు
      '10':
        title: దేవుడు చెడును చూసి తీర్పు తీరుస్తాడు
      '11':
        title: దుష్టులకు భయపడటానికి దావీదు నిరాకరిస్తున్నాడు
      '12':
        title: నమ్మదగిన మాటల కోసం దావీదు ప్రార్థిస్తున్నాడు
      '13':
        title: దావీదు దేవుని ప్రేమను నమ్ముతున్నాడు
      '14':
        title: దేవుణ్ణి తిరస్కరించడం నాశనానికి దారితీస్తుంది
      '15':
        title: అర్హతకు ప్రమాణాలేమిటని దావీదు అడుగుతున్నాడు
      '16':
        title: దేవుణ్ణి నమ్ముతూ దావీదు ప్రార్థిస్తున్నాడు
      '17':
        title: న్యాయమైన విమోచన కోసం దావీదు ప్రార్థిస్తున్నాడు
      '18':
        title: రక్షణకు కృతజ్ఞతాస్తుతి కీర్తన
      '19':
        title: దేవుని ధర్మశాస్త్రం, మహిమ ప్రకాశిస్తున్నాయి
      '20':
        title: యెహోవా అభిషిక్త రాజును కాపాడుతున్నాడు
      '21':
        title: రాజు దేవుని బలాన్ని బట్టి ఆనందిస్తున్నాడు
      '22':
        title: తీవ్రమైన పరిత్యాగ భావం స్తుతిగా మారుతుంది
      '23':
        title: కాపరి నా పక్కనే ఉంటాడు
      '24':
        title: యెహోవా పవిత్ర హృదయాలను కోరుతున్నాడు
      '25':
        title: నమ్మకం, విమోచన గురించిన కీర్తన
      '26':
        title: విమోచన కోసం దావీదు ప్రార్థిస్తున్నాడు
      '27':
        title: యెహోవా సన్నిధి కోసం ఆరాటం
      '28':
        title: దేవుడు వినాలని దావీదు ప్రార్థిస్తున్నాడు
      '29':
        title: యెహోవా పరిశుద్ధ వైభవంతో పరిపాలిస్తున్నాడు
      '30':
        title: మరణం నుంచి రక్షించినందుకు స్తుతి
      '31':
        title: దావీదు దేవుని రక్షణను నమ్ముతున్నాడు
      '32':
        title: క్షమించబడిన పాపులు ధన్యులు
      '33':
        title: నమ్మదగిన సృష్టికర్తను స్తుతించండి
      '34':
        title: దేవుడు మంచివాడని రుచి చూసి తెలుసుకోండి
      '35':
        title: విడుదల కోసం దావీదు మొరపెడుతున్నాడు
      '36':
        title: దేవుని ప్రేమ చెడును ముంచెత్తుతుంది
      '37':
        title: దుష్టులను చూసి అసూయపడకుండా దేవుణ్ణి నమ్మండి
      '38':
        title: తీవ్రమైన బాధలో మౌన ప్రార్థన
      '39':
        title: నమ్మకంతో దావీదు మొరపెడుతున్నాడు
      '40':
        title: దేవుడు దావీదును నాశనం నుంచి పైకి లేపుతున్నాడు
      '41':
        title: బలహీనులను దేవుడు ఆదుకుంటాడు
      '42':
        title: సజీవుడైన దేవుని కోసం ఆరాటం
      '43':
        title: పీడించేవారి నుంచి నన్ను కాపాడు
      '44':
        title: గత విజయాల్లో దేవుని శక్తి
      '45':
        title: రాజు సౌందర్యం, శాశ్వత కృప
      '46':
        title: దేవుడు మనల్ని ఎల్లప్పుడూ సురక్షితంగా ఉంచుతాడు
      '47':
        title: ప్రజలందరూ చప్పట్లు కొట్టి, కేకలు వేసి, పాడండి
      '48':
        title: సీయోను మహాశక్తిగల దేవుణ్ణి స్తుతించండి
      '49':
        title: సంపద మరణం నుంచి రక్షించలేదు
      '50':
        title: మండుతున్న పరిశుద్ధతతో దేవుడు తీర్పు తీరుస్తాడు
      '51':
        title: విరిగిన హృదయం నూతనత్వాన్ని కోరుతుంది
      '52':
        title: మోసపూరితమైన అతిశయాన్ని ఎదుర్కొనడం
      '53':
        title: మూర్ఖుడు దేవుడు లేకుండా అవినీతిగా జీవిస్తాడు
      '54':
        title: క్రూరమైన శత్రువుల నుంచి నన్ను రక్షించు
      '55':
        title: ద్రోహం వల్ల కలిగిన దుఃఖంలో దావీదు మొరపెడుతున్నాడు
      '56':
        title: వేటాడే శత్రువుల మధ్య దేవుణ్ణి నమ్మండి
      '57':
        title: పిల్లలను రెక్కల కింద దాచే పక్షిలాంటి ఆశ్రయం
      '58':
        title: అవినీతిపరులైన మానవ పాలకులను ఎదుర్కొనడం
      '59':
        title: హింసాత్మక మనుషుల నుంచి నన్ను రక్షించు
      '60':
        title: నీ ప్రజలను స్వస్థపరచి పునరుద్ధరించు
      '61':
        title: దేవుని కాపుదల కోసం దావీదు ప్రార్థిస్తున్నాడు
      '62':
        title: దావీదు దేవుణ్ణి మాత్రమే నమ్ముతున్నాడు
      '63':
        title: అరణ్యంలోని రాత్రిలో దావీదు ప్రార్థిస్తున్నాడు
      '64':
        title: శత్రులను ఓడించమని దావీదు ప్రార్థిస్తున్నాడు
      '65':
        title: దేవుడు ప్రార్థనలకు జవాబిచ్చి శాంతిని తెస్తాడు
      '66':
        title: భూమంతా దేవునికి ఆనందధ్వని చేయాలి
      '67':
        title: దేవుడు ప్రజలను న్యాయంతో ఆశీర్వదిస్తున్నాడు
      '68':
        title: దేవుడు దుష్టులను చెదరగొట్టి ఆనందం తెస్తాడు
      '69':
        title: బాధలో మునిగిపోయిన వ్యక్తి నిరాశతో చేసే మొర
      '70':
        title: త్వరగా రక్షించమని దావీదు మొరపెడుతున్నాడు
      '71':
        title: నిలకడైన విశ్వాసాన్ని కోరే కీర్తన
      '72':
        title: న్యాయంగా పాలించాలని రాజు ప్రార్థిస్తున్నాడు
      '73':
        title: ఆసాపు దేవుని నమ్మకత్వాన్ని చూస్తున్నాడు
      '74':
        title: దేవా, జ్ఞాపకం చేసుకోమని కీర్తన మొరపెడుతోంది
      '75':
        title: గర్విష్ఠులైన దుష్టులకు దేవుడు తీర్పు తీరుస్తాడు
      '76':
        title: దేవుడు ఆయుధాలను విరగగొట్టి తన గొప్పతనాన్ని చూపుతున్నాడు
      '77':
        title: ఒకడు మొరపెట్టి, దేవుని వైపు తిరిగి, జ్ఞాపకం చేసుకుంటాడు
      '78':
        title: తరతరాలకు నమ్మకమైన నిరీక్షణను అందించడం
      '79':
        title: యెరూషలేము అపవిత్రమైన తర్వాత చేసే మొర
      '80':
        title: దేవా, మమ్మల్ని పునరుద్ధరించమని ప్రార్థిస్తున్నాం
      '81':
        title: దేవుడు ఇశ్రాయేలు కోసం తపిస్తున్నాడు
      '82':
        title: దేవుడు పాలకులకు తీర్పు తీర్చి బలహీనులను కాపాడుతున్నాడు
      '83':
        title: దేవుడు ఇశ్రాయేలు శత్రువులను చెదరగొడుతున్నాడు
      '84':
        title: దేవుని సన్నిధి కోసం ఆరాటం
      '85':
        title: ప్రభువు తన ప్రజలను మళ్లీ పునరుద్ధరిస్తాడు
      '86':
        title: కరుణ, సహాయం కోసం దావీదు ప్రార్థిస్తున్నాడు
      '87':
        title: సీయోను అన్నిటికంటే దేవుణ్ణి ఎక్కువగా ప్రేమిస్తుంది
      '88':
        title: విడిచిపెట్టబడిన ప్రాణం నిరాశతో చేసే మొర
      '89':
        title: దావీదుతో దేవుడు చేసిన నిబంధనను వేడుకగా జరుపుకోవడం
      '90':
        title: జ్ఞానం కోసం మోషే ప్రార్థిస్తున్నాడు
      '91':
        title: విశ్వాసులను దేవుడు కాపాడుతున్నాడు
      '92':
        title: యెహోవాకు ఎల్లప్పుడూ కృతజ్ఞతలు చెల్లించడం
      '93':
        title: సముద్రాలన్నిటికంటే ఉన్నతంగా యెహోవా పరిపాలిస్తున్నాడు
      '94':
        title: దేవుడు చూసి చెడుకు ప్రతిఫలం ఇస్తాడు
      '95':
        title: కృతజ్ఞతతో వచ్చి దేవుణ్ణి ఆరాధించండి
      '96':
        title: కొత్త పాట పాడండి—యెహోవా పరిపాలిస్తున్నాడు
      '97':
        title: సృష్టి అంతటిపైనా యెహోవా పరిపాలిస్తున్నాడు
      '98':
        title: కొత్త పాట పాడి వేడుక చేసుకోండి
      '99':
        title: ప్రభువు న్యాయంగా, కరుణతో పరిపాలిస్తున్నాడు
      '100':
        title: ప్రతి ఒక్కరూ సంతోషంగా యెహోవాను ఆరాధించండి
      '101':
        title: నిజాయతీతో సేవ చేస్తానని దావీదు ప్రమాణం చేస్తున్నాడు
      '102':
        title: నలిగిన ప్రాణం మార్పులేని దేవునికి ప్రార్థిస్తోంది
      '103':
        title: న్యాయవంతుడైన యెహోవాను దావీదు స్తుతిస్తున్నాడు
      '104':
        title: యెహోవా సృష్టిస్తాడు, పోషిస్తాడు, నూతనపరుస్తాడు
      '105':
        title: దేవునికి కృతజ్ఞతలు చెల్లించండి, నిబంధనను జ్ఞాపకం చేసుకోండి
      '106':
        title: మరచిపోయిన ప్రేమ, శాశ్వత విమోచన
      '107':
        title: విమోచించబడినవారు ప్రభువుకు కృతజ్ఞతలు చెల్లించాలి
      '108':
        title: విడుదల కోసం దావీదు ప్రార్థన
      '109':
        title: దుష్టుడైన పీడకునికి వ్యతిరేకంగా అత్యవసర మొర
      '110':
        title: పరిశుద్ధ వైభవంతో దావీదు పరిపాలన
      '111':
        title: పూర్ణహృదయంతో యెహోవాను స్తుతించండి
      '112':
        title: దైవభక్తిగల వ్యక్తి ధన్యుడు
      '113':
        title: దీనులను హెచ్చించే యెహోవాను స్తుతించండి
      '114':
        title: ఇశ్రాయేలు నిర్గమనం—ప్రకృతి స్పందన
      '115':
        title: యెహోవాకే మహిమ
      '116':
        title: తనను రక్షించే యెహోవాను కీర్తనకర్త ప్రేమిస్తాడు
      '117':
        title: నిలిచే ప్రేమగల యెహోవాను స్తుతించండి
      '118':
        title: కృతజ్ఞతలు చెల్లించమని పిలిచే 118వ కీర్తన
      '120':
        title: కీర్తనకర్త మొరపెట్టగా ప్రభువు జవాబిస్తాడు
      '121':
        title: సహాయం ప్రభువు నుంచే వస్తుంది
      '122':
        title: యెరూషలేము శాంతి కోసం దావీదు ప్రార్థన
      '123':
        title: యెహోవాను నమ్ముతూ పైకి చూసే కీర్తనకర్త
      '124':
        title: ప్రమాదం నుంచి ఇశ్రాయేలును రక్షించే యెహోవా
      '125':
        title: నమ్మకం స్థిరమైన భద్రతను ఇస్తుంది
      '126':
        title: సీయోను పునరుద్ధరణ తెచ్చిన అపార ఆనందం
      '127':
        title: యెహోవా నిర్మిస్తాడు, కాపాడుతాడు
      '128':
        title: దేవునికి భయపడేవారు ధన్యులు
      '129':
        title: ఇశ్రాయేలు శత్రువులు మనలను ఓడించలేరు
      '130':
        title: కరుణ కోసం కీర్తనకర్త మొర
      '131':
        title: దేవుని సన్నిధిలో నిశ్చలంగా విశ్రమించే దావీదు
      '132':
        title: యెహోవా నివాసస్థలాన్ని వెదికే దావీదు
      '133':
        title: దైవభక్తిగల ఐక్యతను ప్రశంసించే దావీదు
      '134':
        title: రాత్రి కావలివారు యెహోవాను స్తుతిస్తారు
      '135':
        title: విగ్రహాలను జయించే యెహోవాను స్తుతించండి
      '136':
        title: అంతులేని ప్రేమగల యెహోవాకు కృతజ్ఞతలు
      '137':
        title: యెరూషలేమును జ్ఞాపకం చేసుకొని విలపించే చెరలోని ప్రజలు
      '138':
        title: బహిరంగంగా యెహోవాకు కృతజ్ఞతలు తెలిపే దావీదు
      '139':
        title: దేవుని పరిపూర్ణ జ్ఞానం, సన్నిధి
      '140':
        title: హింస నుంచి దావీదును కాపాడే దేవుడు
      '141':
        title: తన మాటలకు కాపలా కోసం దావీదు ప్రార్థన
      '142':
        title: ప్రభువుకు మొరపెట్టే దావీదు
      '143':
        title: కరుణ కోసం దావీదు ప్రార్థన
      '144':
        title: రక్షణ కోసం దావీదు ప్రార్థన
      '145':
        title: దేవుని మహిమను స్తుతించే దావీదు
      '146':
        title: ఆత్మ దేవుణ్ణి నిత్యం స్తుతిస్తుంది
      '147':
        title: తిరిగి నిర్మించి స్వస్థపరిచే యెహోవాను స్తుతించండి
      '148':
        title: సృష్టి అంతా ప్రభువును స్తుతిస్తుంది
      '149':
        title: సమస్తం యాహ్‌ను స్తుతించాలి
      '150':
        title: అన్ని వాయిద్యాలతో యాహ్‌ను స్తుతించండి
  Proverbs:
    display_name: సామెతలు
    author: ఇది ఒక సంకలనం; శీర్షికలు సొలొమోను, అగూరు, లెమూయేలు, అలాగే "జ్ఞానులు" అని పేర్కొంటాయి.
    audience: దైనందిన జీవితానికి అవసరమైన జ్ఞానంలో తీర్చిదిద్దబడుతున్న యువ ఇశ్రాయేలీయులు.
    date: రచనలోని వివిధ పొరలు సుమారు క్రీ.పూ. 10వ–4వ శతాబ్దాలకు చెందినవి.
    chapters:
      '1':
        title: ప్రభువుపట్ల భయభక్తులను బోధించే సొలొమోను
      '2':
        title: దేవుని వెదకడం ద్వారా జ్ఞానం లభిస్తుంది
      '3':
        title: దేవుని నమ్మి జ్ఞానం పొందండి
      '4':
        title: అన్నిటికన్నా జ్ఞానమే ముఖ్యమని తండ్రి ప్రబోధం
      '5':
        title: వ్యభిచారానికి దూరంగా ఉండాలని తండ్రి హెచ్చరిక
      '6':
        title: పాపం, సోమరితనానికి వ్యతిరేకంగా హెచ్చరికలు
      '7':
        title: వ్యభిచారపు ప్రలోభానికి చాలా దూరంగా ఉండండి
      '8':
        title: వెదికేవారిని పిలిచే జ్ఞానం
      '9':
        title: జ్ఞానం ఆహ్వానిస్తుంది, మూర్ఖత్వం ప్రలోభపెడుతుంది
      '10':
        title: నీతి, దుష్టత్వం మధ్య వ్యత్యాసాలు
      '11':
        title: యథార్థత ఆశీర్వాదానికి నడిపిస్తుంది
      '12':
        title: నీతిమంతులు జ్ఞానంతో చక్కగా జీవిస్తారు
      '13':
        title: నేర్చుకోవడానికి సిద్ధంగా ఉండడం జీవానికి నడిపిస్తుంది
      '14':
        title: జ్ఞానం ఇంటిని కడుతుంది, ప్రభువును గౌరవిస్తుంది
      '15':
        title: మృదువైన మాట జీవాన్ని తెస్తుంది
      '16':
        title: మనిషి ప్రణాళికలు వేస్తాడు, ఫలితాలను దేవుడు నిర్దేశిస్తాడు
      '17':
        title: దేవునిపట్ల భయభక్తులు జ్ఞానాన్ని ఇస్తాయి
      '18':
        title: జ్ఞానం వింటుంది, మూర్ఖత్వం దిద్దుబాటును తిరస్కరిస్తుంది
      '19':
        title: సంపదకన్నా యథార్థత ఎప్పుడూ మేలు
      '20':
        title: మద్యపానాన్ని నివారించండి, యథార్థతను విలువైనదిగా ఎంచండి
      '21':
        title: హృదయాలను తీర్చే దేవుడు న్యాయాన్ని విలువైనదిగా చూస్తాడు
      '22':
        title: వినయం దేవునికి మరింత ఘనత తెస్తుంది
      '23':
        title: అతిగా తినడం, అత్యాశ గురించి హెచ్చరికలు
      '24':
        title: దుష్టులను చూసి అసూయపడకండి
      '25':
        title: వినయంగా ఉండమని జ్ఞానం పిలుస్తుంది
      '26':
        title: మూర్ఖులు తమకూ ఇతరులకూ హాని చేస్తారు
      '27':
        title: వినయాన్ని, వాస్తవిక దృష్టిని బోధిస్తుంది
      '28':
        title: యెహోవాను వెదకడం ద్వారా నీతిమంతులు జయిస్తారు
      '29':
        title: మొండితనం నాశనానికి నడిపిస్తుంది
      '30':
        title: గాఢమైన వినయంతో మాట్లాడే అగూరు
      '31':
        title: న్యాయాన్ని నిలబెట్టమని రాజును హెచ్చరించే తల్లి
  Ecclesiastes:
    display_name: ప్రసంగి
    author: రచయిత ఎవరో తెలియదు; మాట్లాడే వ్యక్తిని "కోహెలెతు" అని పిలుస్తారు, సంప్రదాయం ప్రకారం ఆయనను సొలొమోనుగా గుర్తిస్తారు.
    audience: సూర్యుని కింద జ్ఞానం, సంపద, శ్రమలకు ఉన్న పరిమితులను ఎదుర్కొంటున్న ఇశ్రాయేలీయులు.
    date: అరామిక్ ప్రభావం ఉన్న హీబ్రూ భాష ఆధారంగా, బహుశా సుమారు క్రీ.పూ. 5వ–3వ శతాబ్దాలు.
    chapters:
      '1':
        title: సూర్యుని కింద ఉన్నదంతా వ్యర్థమే
      '2':
        title: సుఖం శాశ్వతమైన లాభాన్ని ఇవ్వదు
      '3':
        title: ప్రతి కార్యానికీ తగిన సమయం వస్తుంది
      '4':
        title: క్రూరమైన అణచివేతతో నిండిన జీవితం
      '5':
        title: దేవునిపట్ల భయభక్తులు కలిగి మొక్కుబడులు చెల్లించండి
      '6':
        title: అనుభవించలేని సంపద చేదైనది
      '7':
        title: గర్వం కంటే జ్ఞానం మేలు
      '8':
        title: వినయంగా జీవించడాన్ని బోధించే జ్ఞానం
      '9':
        title: నీతిమంతులకూ దుష్టులకూ ఒకే గతి
      '10':
        title: మూర్ఖత్వం జ్ఞానాన్ని త్వరగా పాడుచేస్తుంది
      '11':
        title: అవకాశం ఉన్నప్పుడే సాహసించండి
      '12':
        title: యౌవనంలోనే సృష్టికర్తను జ్ఞాపకం చేసుకోండి
  Song of Solomon:
    display_name: పరమగీతము
    author: రచయిత ఎవరో తెలియదు; పైశీర్షిక సొలొమోనును ప్రస్తావిస్తుంది.
    audience: శృంగార ప్రేమను నిబంధనలోని సాన్నిహిత్యాన్ని అర్థం చేసుకునే దృక్కోణంగా చదివిన ఇశ్రాయేలు—తరువాత దానిని రూపకాలంకారంగా చదివిన యూదు, క్రైస్తవ పాఠకులు కూడా.
    date: బహుశా చెర అనంతర కాలం, సుమారు క్రీ.పూ. 5వ–3వ శతాబ్దాలు.
    chapters:
      '1':
        title: తన ప్రియుణ్ణి వెదికే స్త్రీ
      '2':
        title: ప్రేమికులు పరస్పరం గాఢమైన ప్రశంసను వ్యక్తం చేస్తారు
      '3':
        title: పట్టణంలో తన ప్రియుణ్ణి కనుగొన్న స్త్రీ
      '4':
        title: వధువు శరీర సౌందర్యాన్ని ప్రశంసించే పురుషుడు
      '5':
        title: కనిపించని ప్రియుణ్ణి వెదికే స్త్రీ
      '6':
        title: అద్వితీయమైన అంకితభావాన్ని, ప్రేమను కొనియాడే పురుషుడు
      '7':
        title: స్త్రీ సౌందర్యాన్ని ప్రశంసించే ఆమె ప్రియుడు
      '8':
        title: బహిరంగంగా ప్రేమను వ్యక్తం చేయాలని ఆశించే స్త్రీ
  Isaiah:
    display_name: యెషయా
    author: అనేక శతాబ్దాల కాలంలో పలువురు రచయితలు; 1–39 అధ్యాయాలు క్రీ.పూ. 8వ శతాబ్దపు యెరూషలేము యెషయాలో మూలాలను కలిగివున్నాయి; 40–55 అధ్యాయాలు ("రెండవ యెషయా"), 56–66 అధ్యాయాలు ("మూడవ యెషయా") చెరకు, తిరిగివచ్చుటకు ప్రతిస్పందిస్తాయి.
    audience: వరుసగా అష్షూరు ముప్పును ఎదుర్కొన్న యూదా, బబులోను చెరలోని యూదా, చెర అనంతర పునరుద్ధరణలోని యూదా.
    date: సుమారు క్రీ.పూ. 8వ శతాబ్దం చివరి నుంచి 5వ శతాబ్దం వరకు రచించబడింది.
    chapters:
      '1':
        title: తిరుగుబాటు చేసిన యూదాను దేవుడు తిరస్కరిస్తాడు
      '2':
        title: యెహోవా మందిరం అన్నిటికంటే ఉన్నతంగా నిలుస్తుంది
      '3':
        title: తీర్పు దేశ పతనానికి దారితీస్తుంది
      '4':
        title: నాశనం తర్వాత పునరుద్ధరణ వాగ్దానం
      '5':
        title: ప్రభువు ద్రాక్షతోట హింసను ఫలిస్తుంది
      '6':
        title: దేవుని మహోన్నత మహిమను చూసిన యెషయా
      '7':
        title: అష్షూరు రాకముందే ఇమ్మానుయేలు జన్మిస్తాడు
      '8':
        title: మహేరు-షాలాల్-హాష్-బజ్ అనే పేరు తీర్పును సూచిస్తుంది
      '9':
        title: వెలుగు యెషయాకు నిరీక్షణ తెస్తుంది
      '10':
        title: గర్విష్ఠి అష్షూరుకు దేవుని తీర్పు
      '11':
        title: కొత్త రాజు భూమిపై శాంతిని తెస్తాడు
      '12':
        title: దేవుని ప్రజలు తమ రక్షణకై స్తుతిస్తారు
      '13':
        title: బబులోను సంపూర్ణ నాశనాన్ని ఎదుర్కొంటుంది
      '14':
        title: పతనమైన బబులోను రాజును ఇశ్రాయేలు ఎగతాళి చేస్తుంది
      '15':
        title: మోయాబుకు ఆకస్మికమైన ఘోర విపత్తు
      '16':
        title: మోయాబు గర్వం తీవ్రమైన తీర్పుకు దారితీస్తుంది
      '17':
        title: దమస్కు, ఎఫ్రాయిము పూర్తిగా దోచుకోబడతాయి
      '18':
        title: దూరదేశం సందేశకులను సుదూర ప్రాంతాలకు పంపుతుంది
      '19':
        title: ఐగుప్తు అవమానం తర్వాత స్వస్థత పొందుతుంది
      '20':
        title: యెషయా సూచనగా వస్త్రాలు తీసివేసి నడుస్తాడు
      '21':
        title: బబులోను హఠాత్తుగా కూలిపోతుంది, విందు ముగుస్తుంది
      '22':
        title: యెరూషలేము కోలాహలం తీర్పుకు దారితీస్తుంది
      '23':
        title: తూరు సంపద, అధికారం కూలిపోతాయి
      '24':
        title: భూమి అంతటినీ కమ్మే సంపూర్ణ తీర్పు
      '25':
        title: యెహోవా విందు ఇస్తాడు, మరణాన్ని తొలగిస్తాడు
      '26':
        title: దేవుడు తన ప్రజలను సురక్షితంగా కాపాడుతాడు
      '27':
        title: లెవియాతాను ఓడిపోతుంది, ఇశ్రాయేలు కాపాడబడుతుంది
      '28':
        title: గర్విష్ఠులైన నాయకులు దేవుని వాక్యాన్ని ఎగతాళి చేస్తారు
      '29':
        title: ముట్టడిలో యెరూషలేము అణచివేయబడుతుంది
      '30':
        title: ఐగుప్తును నమ్మిన యూదా నాశనాన్ని ఎదుర్కొంటుంది
      '31':
        title: దేవుడే సీయోను కోసం పోరాడుతాడు
      '32':
        title: నీతిమంతుడైన రాజు న్యాయాన్ని స్థాపిస్తాడు
      '33':
        title: హింస దుష్టుల మీదికే తిరిగి వస్తుంది
      '34':
        title: ఎదోముకు యెహోవా తీవ్రమైన తీర్పు
      '35':
        title: అరణ్యం మహిమతో వికసిస్తుంది
      '36':
        title: యూదా నమ్మకాన్ని రబ్షాకే ఎగతాళి చేస్తాడు
      '37':
        title: హిజ్కియా ప్రార్థిస్తాడు, దేవుడు జవాబిస్తాడు
      '38':
        title: హిజ్కియా అనారోగ్యం, స్వస్థత
      '39':
        title: హిజ్కియా సంపదలను చూసిన బబులోనీయులు
      '40':
        title: దేవుని ప్రజలకు ఆదరణ వస్తుంది
      '41':
        title: యెహోవా ఒక్కడే చరిత్రను పరిపాలిస్తాడు
      '42':
        title: సేవకుడు సౌమ్యంగా న్యాయాన్ని స్థాపిస్తాడు
      '43':
        title: ఇశ్రాయేలుతో ఎల్లప్పుడూ ఉంటానని దేవుని వాగ్దానం
      '44':
        title: యెహోవా ఒక్కడే నిజమైన దేవుడు
      '45':
        title: ఇశ్రాయేలును విడిపించడానికి కోరెషు ఎంపిక
      '46':
        title: ఇశ్రాయేలును జీవితమంతా మోసే యెహోవా
      '47':
        title: ప్రతీకారానికి గురై బబులోను పతనమవుతుంది
      '48':
        title: ఇశ్రాయేలు మొండితనం నిలదీయబడుతుంది
      '49':
        title: సేవకుని కార్యం ఎంతో విస్తృతమైనది
      '50':
        title: బాధల్లోనూ నమ్మకముంచే సేవకుడు
      '51':
        title: అబ్రాహాము నమ్మకత్వాన్ని జ్ఞాపకం చేసుకోండి
      '52':
        title: చెర నుంచి యెరూషలేము మేల్కొంటుంది
      '53':
        title: బాధలు అనుభవించే సేవకుడు పాపాన్ని మోస్తాడు
      '54':
        title: విడిచిపెట్టబడిన తన వధువును దేవుడు పునరుద్ధరిస్తాడు
      '55':
        title: రండి, జీవాన్ని ఉచితంగా పొందండి
      '56':
        title: నమ్మకమైన విదేశీ ఆరాధకులను దేవుడు ఆహ్వానిస్తాడు
      '57':
        title: నీతిగా జీవించండి, రక్షణ సమీపంలో ఉంది
      '58':
        title: దేవుని ప్రజలు పునరుద్ధరించబడతారు
      '59':
        title: న్యాయాన్ని, కరుణను నిజంగా అనుసరించండి
      '60':
        title: సీయోనుకు సహాయం చేయడానికి విమోచకుడు వస్తాడు
      '61':
        title: స్వస్థపరచడానికి సేవకుణ్ణి దేవుడు అభిషేకిస్తాడు
      '62':
        title: సీయోనును ఘనపరుస్తానని యెహోవా ప్రమాణం చేస్తాడు
      '63':
        title: యోధుడైన దేవుడు ఉగ్రతతో తిరిగి వస్తాడు
      '64':
        title: పరిశుద్ధ దేవుడు తిరిగి రావాలని ప్రార్థన
      '65':
        title: నమ్మకమైన శేషజనానికి కొత్త ఆకాశాలు
      '66':
        title: ప్రభువు సీయోనుకు తీర్పుతీర్చి దాన్ని పునరుద్ధరిస్తాడు
  Jeremiah:
    display_name: యిర్మీయా
    author: అనాతోతుకు చెందిన యిర్మీయా; అతని లేఖకుడు బారూకు మరియు తర్వాతి చేతులచే గణనీయంగా సంపాదించబడింది.
    audience: బబులోను జయానికి ముందు, ఆ జయం జరుగుతున్నప్పుడు, ఆ తర్వాత యూదాలో ఉన్న ప్రజలు.
    date: క్రీ.పూ. 7వ శతాబ్దం చివరి నుంచి 6వ శతాబ్దం ఆరంభం వరకు.
    chapters:
      '1':
        title: యిర్మీయాను ప్రవక్తగా నియమించిన దేవుడు
      '2':
        title: జీవజలాన్ని విడిచిపెట్టిన యెరూషలేము
      '3':
        title: నమ్మకమైన దేవుని దగ్గరకు ఇశ్రాయేలు తిరిగి వస్తుంది
      '4':
        title: రాబోయే తీర్పును ఎదుర్కొంటున్న యూదా
      '5':
        title: అవినీతితో నిండిన యెరూషలేము
      '6':
        title: ఉత్తరం నుంచి సైన్యం వస్తుంది
      '7':
        title: దేవాలయం దగ్గర యిర్మీయా హెచ్చరిక
      '8':
        title: యూదా మీద తీర్పు పూర్తయింది
      '9':
        title: ప్రజలు ద్రోహంతో నిండిపోయారు
      '10':
        title: విగ్రహాలు మనుషులు చేసినవి, వ్యర్థమైనవి
      '11':
        title: యూదా నిబంధనను ఉల్లంఘించింది
      '12':
        title: దుష్టులు ఎందుకు వర్ధిల్లుతున్నారు?
      '13':
        title: గర్వం వల్ల యూదా పనికిరాకుండా పోతుంది
      '14':
        title: కరవుతో యూదాలో తీవ్ర నిరాశ
      '15':
        title: తీర్పు ఇప్పుడు తప్పించుకోలేనిది
      '16':
        title: యూదా మీదికి భయంకరమైన తీర్పు వస్తుంది
      '17':
        title: దేవుని తీర్పును ఎదుర్కొంటున్న యూదా
      '18':
        title: మొండి యూదాను హెచ్చరించిన యిర్మీయా
      '19':
        title: నగరం మీదికి భయంకరమైన తీర్పు వస్తుంది
      '20':
        title: యిర్మీయా తీర్పును ప్రకటిస్తాడు
      '21':
        title: సహాయం కోరిన సిద్కియా రాజు
      '22':
        title: న్యాయం, కరుణతో పరిపాలించండి
      '23':
        title: అబద్ధ కాపరులకు దేవుని తీర్పు
      '24':
        title: మంచి అంజూరపు పండ్లు చెరలోని ప్రజలకు ప్రతీక
      '25':
        title: నెబుకద్నెజరు యూదా మీదికి వస్తాడు
      '26':
        title: దేవాలయంలో యిర్మీయా హెచ్చరిక
      '27':
        title: బబులోను పాలనకు లోబడండి
      '28':
        title: అబద్ధ ప్రవచనం వల్ల హనన్యా మరణిస్తాడు
      '29':
        title: బబులోనులోని చెరప్రజలను యిర్మీయా హెచ్చరిస్తాడు
      '30':
        title: భవిష్యత్తు విమోచన గురించి దేవుని వాగ్దానం
      '31':
        title: ఇశ్రాయేలు పునరుద్ధరణ గురించి దేవుని వాగ్దానం
      '32':
        title: నిరీక్షణతో పొలం కొన్న యిర్మీయా
      '33':
        title: శిథిలమైన నగరానికి స్వస్థత వాగ్దానం
      '34':
        title: సిద్కియాకు తీర్పు, హెచ్చరిక
      '35':
        title: రేకాబీయుల నమ్మకమైన విధేయత
      '36':
        title: బారూకు హెచ్చరిక గ్రంథపు చుట్టను రాస్తాడు
      '37':
        title: యిర్మీయా రాజైన సిద్కియాను హెచ్చరిస్తాడు
      '38':
        title: యిర్మీయా నీటి తొట్టిలో పడవేయబడతాడు
      '39':
        title: ఎబెద్మెలెకు యిర్మీయాను రక్షిస్తాడు
      '40':
        title: యెరూషలేము పతనం తర్వాత యిర్మీయాకు విడుదల
      '41':
        title: ఇష్మాయేలు మోసపూరితంగా గెదల్యాను హతమారుస్తాడు
      '42':
        title: ఐగుప్తుకు పారిపోవద్దని యిర్మీయా హెచ్చరిస్తాడు
      '43':
        title: తిరుగుబాటుదారులు యిర్మీయాను ఐగుప్తుకు ఈడ్చుకెళ్తారు
      '44':
        title: దేవుని ఆజ్ఞను పాటించడానికి నిరాకరణ
