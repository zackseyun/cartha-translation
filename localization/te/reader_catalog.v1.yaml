        title: దుఃఖభారంతో అలసిపోయిన బారూకు
      '46':
        title: గర్విష్ఠమైన ఐగుప్తు సామ్రాజ్యానికి దేవుని తీర్పు
      '47':
        title: అడ్డుకోలేని వరదను ఎదుర్కొనే ఫిలిష్తీయులు
      '48':
        title: మోయాబు నాశనం, భవిష్యత్తుపై ఆశ
