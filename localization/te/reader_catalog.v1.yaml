        title: శాంతియుత జీవనానికి దారిచూపే వినయం
      '20':
        title: క్రమబద్ధమైన శాంతిలో నడిచే సృష్టి
      '21':
        title: దేవుని ఎదుట యోగ్యంగా జీవించండి
      '22':
        title: ప్రభువుకు భయపడమని పిలిచే క్రీస్తు
      '23':
        title: నిష్కపట హృదయాన్ని ఆదరించే తండ్రి
      '24':
        title: భవిష్యత్తు పునరుత్థానానికి దేవుని హామీ
      '25':
        title: మరణించి మళ్లీ లేచే ఫీనిక్స్ పక్షి
      '26':
        title: నమ్మకమైన సేవకులను లేపే దేవుడు
      '27':
        title: నమ్మకమైన దేవునితో మనసులను బంధించండి
      '28':
        title: దేవునికి భయపడండి; ఎక్కడా దాగలేరు
      '29':
        title: శుద్ధమైన చేతులతో సమీపించండి
      '30':
        title: పాపాలను విడిచి వినయాన్ని స్వీకరించండి
      '31':
        title: విశ్వాసాన్ని అనుసరించిన అబ్రాహాము, ఇస్సాకు, యాకోబు
      '32':
        title: దేవుని చిత్తమే మనలను నీతిమంతులను చేస్తుంది
      '33':
        title: మంచి పనులు చేయడానికి త్వరపడండి
      '34':
        title: ఆసక్తిగా పనిచేసేవారు తమ ఆహారం సంపాదిస్తారు
      '35':
        title: పరలోక ప్రతిఫలాల కోసం సహించండి
      '36':
        title: రక్షించే మన ప్రధాన యాజకుడు యేసు
      '37':
        title: ఆజ్ఞలను నమ్మకంగా పాటించే సైనికులు
      '38':
        title: మెస్సీయ యేసులో సమాజం
      '39':
        title: ఎగతాళి చేసేవారు తమను తాము శుద్ధి చేసుకోలేరు
      '40':
        title: ప్రభువు నియమాలను అమలు చేయండి
      '41':
        title: నియమించబడిన పరిచర్యలో సేవించండి
      '42':
        title: నాయకులను సక్రమంగా నియమించిన అపొస్తలులు
      '43':
        title: దేవుని ప్రకారం యాజకులను ఎంచుకున్న మోషే
      '44':
        title: ఆమోదం పొందిన పెద్దలను తొలగించవద్దు
      '45':
        title: దేవుణ్ణి ఘనపరచి బాధలు అనుభవించిన నీతిమంతులు
      '46':
        title: పవిత్ర ఆదర్శాలను కలిసికట్టుగా హత్తుకోండి
      '47':
        title: మీకు రాసిన పౌలు పత్రికను జ్ఞాపకం చేసుకోండి
      '48':
        title: పవిత్రులై నీతి ద్వారంలో ప్రవేశించండి
      '49':
        title: ప్రేమ మనలను దేవునితో ఏకం చేస్తుంది
      '50':
        title: ప్రేమ దేవుడు ఎన్నుకున్నవారిని పరిపూర్ణులను చేస్తుంది
      '51':
        title: మన పాపాలను, తప్పులను ఒప్పుకుందాం
      '52':
        title: దేవునికి స్తుతియాగం అర్పించండి
      '53':
        title: మోషే ఇశ్రాయేలు కోసం ధైర్యంగా విజ్ఞాపన చేశాడు
      '54':
        title: శాంతియుత నాయకులు మందను గౌరవిస్తారు
      '55':
        title: స్త్రీలు సాహసకార్యాలు చేశారు
      '56':
        title: దారితప్పినవారు లోబడాలని ప్రార్థించండి
      '57':
        title: వినయమే జ్ఞానమని జ్ఞానం ప్రకటిస్తుంది
      '58':
        title: దేవునిపై నమ్మకముంచి ఎల్లప్పుడూ సురక్షితంగా ఉండండి
      '59':
        title: దేవుడు తాను ఎన్నుకున్నవారిని కాపాడాలని ప్రార్థించండి
      '60':
        title: పాపాలను క్షమించి అడుగులను నడిపించు
      '61':
        title: దేవుడు పాలకులను జ్ఞానంతో నడిపిస్తాడు
      '62':
        title: సద్గుణాలతో జీవించడాన్ని విశ్వాసం నేర్పుతుంది
      '63':
        title: వినయం శాంతిని, ఆనందాన్ని తెస్తుంది
      '64':
        title: అందరికీ విశ్వాసాన్ని, సహనాన్ని అనుగ్రహించు
      '65':
        title: శుభవార్తతో ప్రతినిధులను తిరిగి పంపండి
  1 Enoch:
    display_name: 1 హనోకు
    author: రచయిత తెలియదు; జలప్రళయానికి పూర్వం జీవించిన పితరుడైన హనోకు పేరుతో రాసినదిగా ఆపాదించబడింది. అనేక విభిన్న విభాగాలను కలిపి రూపొందించిన సంకలన గ్రంథం.
    audience: విశ్వవ్యాప్త దుష్టత్వం, తీర్పు, కాలగణన గురించి ఆలోచించిన యూదుల అంత్యకాల దర్శన సమాజాల కోసం; తరువాత తొలి క్రైస్తవ వర్గాల్లోనూ చదవబడింది.
    date: విభాగాలు సుమారు క్రీ.పూ. 3వ శతాబ్దం నుంచి క్రీ.శ. 1వ శతాబ్దం మధ్య సంకలనం చేయబడ్డాయి; సంపూర్ణ రూపం గెయెజ్ (ఇథియోపిక్) భాషలో మాత్రమే భద్రపరచబడింది.
    chapters:
      '1':
        title: దేవుడు నీతిమంతులకు, దుష్టులకు తీర్పుతీరుస్తాడు
      '2':
        title: ఆకాశం, భూమి సాక్ష్యమిస్తున్నాయి
      '3':
        title: పద్నాలుగు చెట్లు శీతకాలాన్ని తట్టుకుంటాయి
      '4':
        title: వేసవి సూర్యుడు క్రమబద్ధమైన శక్తిని సూచిస్తాడు
      '5':
        title: సృష్టి దేవుని పరిపాలనకు నమ్మకంగా ఉంటుంది
      '6':
        title: మానవ స్త్రీల కోసం కావలివారు దిగివస్తారు
      '7':
        title: రాక్షస సంతానం భూమిని నాశనం చేస్తుంది
      '8':
        title: కావలివారు నిషిద్ధ జ్ఞానాన్ని బోధిస్తారు
      '9':
        title: దేవదూతలు భూమిపై అక్రమాన్ని నివేదిస్తారు
      '10':
        title: పతనమైన కావలివారిపై తీర్పు వస్తుంది
      '11':
        title: దేవుడు సమృద్ధియైన ఆశీర్వాదాలను వాగ్దానం చేస్తాడు
      '12':
        title: హనోకు పతనమైన కావలివారిని ఎదిరిస్తాడు
      '13':
        title: కావలివారికి క్షమ లేదని హనోకు చెబుతాడు
      '14':
        title: వెల్లడైన పరలోక మహిమను హనోకు చూస్తాడు
      '15':
        title: కావలివారిపై తీర్పును దేవుడు వివరిస్తాడు
      '16':
        title: దేహరహిత ఆత్మలు భూమిపై సంచరిస్తాయి
      '17':
        title: భయంకరమైన అన్యలోక ప్రాంతాలను హనోకు సందర్శిస్తాడు
      '18':
        title: సృష్టి శక్తుల నిల్వగదులు చూపబడతాయి
      '19':
        title: దేవదూతలు తుది తీర్పును ఎదుర్కొంటారు
      '20':
        title: పవిత్ర కావలి దేవదూతలు, వారి అధికార ప్రాంతాలు
      '21':
        title: అగాధంలో బంధించబడిన ఏడు నక్షత్రాలు
      '22':
        title: ఆత్మల గుహలను హనోకు చూస్తాడు
      '23':
        title: ఆరని అగ్నిని హనోకు చూస్తాడు
      '24':
        title: ఏడు మహిమాన్విత పర్వతాలు మెరుస్తాయి
      '25':
        title: తీర్పు వరకు నిషేధించబడిన సుగంధ వృక్షం
      '26':
        title: పవిత్ర కేంద్రస్థలాన్ని హనోకు చూస్తాడు
      '27':
        title: దైవదూషకుల కోసం శపించబడిన లోయ వెల్లడి
      '28':
        title: ఉప్పొంగే జలాలతో తూర్పు పర్వతాలు
      '29':
        title: తీర్పు వృక్షాలను హనోకు చూస్తాడు
      '30':
        title: తరగని జలాలతో నిండిన లోయ
      '31':
        title: పవిత్ర సువాసనలతో పర్వతాలు వికసిస్తాయి
      '32':
        title: నీతి ఉద్యానవనం వెల్లడి
      '33':
        title: ఆకాశ ద్వారాల్లో నక్షత్రాల పేర్లు
      '34':
        title: ఆకాశ వాతావరణ యంత్రాంగం వెల్లడి
      '35':
        title: పడమటి ద్వారాలు తూర్పు ద్వారాలకు సరిపోలుతాయి
      '36':
        title: ఆకాశ ద్వారాలను హనోకు చూస్తాడు
      '37':
        title: జ్ఞాన ప్రత్యక్షతను హనోకు ప్రకటిస్తాడు
      '38':
        title: నీతిమంతులు సమకూడతారు, పాపులకు తీర్పు జరుగుతుంది
      '39':
        title: ఎన్నుకోబడిన పిల్లలు ఆకాశం నుంచి దిగివస్తారు
      '40':
        title: పరలోక సైన్యాన్ని హనోకు చూస్తాడు
      '41':
        title: ఆకాశ నిధిగదులు, రహస్య నియమాలు
      '42':
        title: జ్ఞానం నివాసాన్ని వెదికినా దొరకదు
      '43':
        title: పరలోక ఉపమానాన్ని హనోకు చూస్తాడు
      '44':
        title: మెరుపు నక్షత్రాలు శక్తిచేత బంధించబడ్డాయి
      '45':
        title: తీర్పుపొందే నిరాకరించేవారి గురించిన రెండవ ఉపమానం
      '46':
        title: మనుష్యకుమారుణ్ణి హనోకు చూస్తాడు
      '47':
        title: నీతిమంతుల రక్తానికి పరలోకంలో జవాబు లభిస్తుంది
      '48':
        title: నీతి ఊట చుట్టుముడుతుంది
      '49':
        title: ఎన్నుకోబడినవాడు దాగివున్నవాటికి తీర్పుతీరుస్తాడు
      '50':
        title: పవిత్రులు గెలుస్తారు, పాపులు త్వరలో నశిస్తారు
      '51':
        title: ఎన్నుకోబడినవాడు రహస్య జ్ఞానాన్ని వెల్లడిస్తాడు
      '52':
        title: లోహ పర్వతాలను హనోకు చూస్తాడు
      '53':
        title: పాపుల అర్పణలతో నిండిన లోయ
      '54':
        title: రాజులు మండుతున్న లోయలో పడవేయబడతారు
      '55':
        title: ప్రాచీనుడు ఇక ఎన్నడూ అలా చేయనని ప్రమాణం చేస్తాడు
      '56':
        title: శిక్ష విధించే దేవదూతలు అజాజేలు సేనను బంధిస్తారు
      '57':
        title: విశ్వమంతా కల్లోలం, పవిత్ర ఆరాధన
      '58':
        title: హనోకు నీతిమంతులను దీవిస్తాడు
      '59':
        title: ఉరుముల రహస్యాలను హనోకు చూస్తాడు
      '60':
        title: అత్యున్నత ఆకాశం కంపిస్తుంది, కరుణ నిలిచి ఉంటుంది
      '61':
        title: దేవదూతలు నీతిమంతుల కోసం కొలమానం చేస్తారు
      '62':
        title: సింహాసనాసీనుడైన మనుష్యకుమారుడు తీర్పుతీరుస్తాడు
      '63':
        title: రాజులు క్షమించమని ప్రభువును వేడుకుంటారు
      '64':
        title: దాగివున్న పాపులను హనోకు చూస్తాడు
      '65':
        title: భూమి కోసం నోవహు విలపిస్తాడు
      '66':
        title: ఆజ్ఞ ప్రకారం దేవదూతలు ప్రళయ జలాలను నిలిపి ఉంచుతారు
      '67':
        title: నోవహు దేవుని వాగ్దానాన్ని వింటాడు
      '68':
        title: హనోకు రహస్య విషయాల వెల్లడి పొందుతాడు
      '69':
        title: పతనమైన దేవదూతల పేర్లు చెప్పబడి, వారికి తీర్పు జరుగుతుంది
      '70':
        title: హనోకు పరలోక న్యాయసభకు తీసుకువెళ్లబడతాడు
      '71':
        title: పరలోక రహస్యాలను హనోకు చూస్తాడు
      '72':
        title: సూర్యుని క్రమబద్ధమైన గమనాన్ని ఊరియేలు వెల్లడిస్తాడు
      '73':
        title: చంద్రుని కళలు ఆజ్ఞ ప్రకారం నడుస్తాయి
      '74':
        title: సూర్యచంద్రుల కచ్చితమైన లయలు
      '75':
        title: విశ్వ నాయకులు తమ నియమిత సేవను కొనసాగిస్తారు
      '76':
        title: భూమిపై వీచే గాలులను హనోకు చూస్తాడు
      '77':
        title: నాలుగు గాలులను హనోకు చూస్తాడు
      '78':
        title: మహా జ్యోతుల పేర్లు వెల్లడి
      '79':
        title: పరలోక నియమాలన్నిటినీ హనోకు వెల్లడిస్తాడు
      '80':
        title: విశ్వవ్యాప్త అస్తవ్యస్తత గురించి ఊరియేలు హెచ్చరిస్తాడు
      '81':
        title: హనోకు పరలోక పలకలను చదువుతాడు
      '82':
        title: భద్రపరచమని మెతూషెలకు హనోకు ఆజ్ఞాపిస్తాడు
      '83':
        title: భూమి నాశనం కావడం హనోకు చూస్తాడు
      '84':
        title: పరిశుద్ధ దేవుణ్ణి హనోకు స్తుతిస్తాడు
      '85':
        title: కుటుంబ భవితవ్యాన్ని హనోకు కలలో చూస్తాడు
      '86':
        title: నక్షత్రాలు పడి పశువుల మధ్య మేస్తాయి
      '87':
        title: ఏడుగురు పరలోక జీవులు గోపురాన్ని చూపిస్తారు
      '88':
        title: పడిపోయిన నక్షత్రాన్ని దేవదూత పట్టుకుంటాడు
      '89':
        title: జంతు సంకేతాలను హనోకు చూస్తాడు
      '90':
        title: కాపరుల దుష్పాలన; గొర్రెల మంద పునర్నిర్మాణం
      '91':
        title: భవిష్యత్తు శిక్షలను హనోకు వెల్లడిస్తాడు
      '92':
        title: నీతిమంతుల తరాల కోసం హనోకు రాస్తాడు
      '93':
        title: వారాలు చరిత్రను, తీర్పును సంక్షిప్తంగా వివరిస్తాయి
      '94':
        title: దుష్ట మార్గాలకు బదులు నీతిని ఎంచుకోండి
      '95':
        title: రాబోయే శిక్షను తలచి హనోకు విలపిస్తాడు
      '96':
        title: పాపులకంటే పైగా నీతిమంతులు ఎగసిపోతారు
      '97':
        title: నీతిమంతులు ఆనందిస్తారు, పాపులు పతనమవుతారు
      '98':
        title: విలాసం అవమానాన్ని, నాశనాన్ని తెస్తుంది
      '99':
        title: దుష్కార్యాలు చేసేవారికి శ్రమలు ప్రకటించబడతాయి
      '100':
        title: దేవదూతలు దుష్టులకు తీర్పుతీర్చి నీతిమంతులను కాపాడుతారు
      '101':
        title: దేవునికి భయపడి చెడు చేయడం మానండి
      '102':
        title: తీర్పు దినాన నీతిమంతులు ఆనందిస్తారు
      '103':
        title: శాశ్వత న్యాయస్థాపనను హనోకు ప్రకటిస్తాడు
      '104':
        title: పాపం గురించి హనోకు హెచ్చరిస్తాడు
      '105':
        title: మహిమ సన్నిధిలో పేర్లు ఉంచబడతాయి
      '106':
        title: భవిష్యత్తు నిరీక్షణకు సూచనగా నోవహుకు పేరు పెట్టబడుతుంది
      '107':
        title: చివరి తరం పునరుద్ధరణను తెస్తుంది
      '108':
        title: హనోకు చివరి హెచ్చరిక రాస్తాడు
  2 Baruch:
    display_name: 2 బారూకు
    author: రచయిత తెలియదు; యిర్మీయా లేఖకుడైన బారూకు పేరుతో రచించబడినదిగా ఆపాదించబడింది.
    audience: క్రీ.శ. 70లో దేవాలయం నాశనమైన తర్వాత, చెర అనుభవాన్ని దేవునితో తమ సంబంధం దృష్ట్యా అర్థం చేసుకోవడానికి ప్రయత్నిస్తున్న యూదులు.
    date: సుమారు క్రీ.శ. 1వ శతాబ్దం చివరి భాగం నుంచి 2వ శతాబ్దం ఆరంభం వరకు; ప్రధానంగా సిరియాక్ భాషలో భద్రపరచబడింది.
    chapters:
      '1':
        title: యూదా గురించి దేవుడు బారూకును హెచ్చరిస్తాడు
      '2':
        title: వెళ్లిపోవాలని ప్రభువు బారూకుకు ఆజ్ఞాపిస్తాడు
      '3':
        title: యెరూషలేము భవితవ్యం గురించి బారూకు వేడుకుంటాడు
      '4':
        title: మరుగైన నగర వాస్తవికతను ప్రభువు వెల్లడిస్తాడు
      '5':
        title: యిర్మీయా బృందంతో కలిసి బారూకు విలపిస్తాడు
      '6':
        title: సీయోనుకు కాపలా కాస్తున్న దేవదూతలను బారూకు చూస్తాడు
      '7':
        title: సీయోనును కూలదోయమని దేవదూతలకు ఆజ్ఞ
      '8':
        title: పరలోక వ్యక్తి పవిత్ర వస్తువులను తొలగిస్తాడు
      '9':
        title: యిర్మీయా, బారూకు కలిసి దుఃఖిస్తారు
      '10':
        title: సీయోను నిర్జనతను తలచి బారూకు తీవ్రంగా విలపిస్తాడు
      '11':
        title: బబులోను సౌభాగ్యాన్ని తలచి బారూకు విలపిస్తాడు
      '12':
        title: రాబోయే ఉగ్రత గురించి బారూకు హెచ్చరిస్తాడు
      '13':
        title: బారూకు భవిష్యత్తులో సాక్ష్యమివ్వడాన్ని దేవుడు చూపిస్తాడు
      '14':
        title: నీతిమంతులకున్న ప్రయోజనం గురించి బారూకు ప్రశ్నిస్తాడు
      '15':
        title: పాపుల జవాబుదారీతనాన్ని ప్రభువు వివరిస్తాడు
      '16':
        title: భవిష్యత్తు మహిమతో బారూకు ధైర్యం పొందుతాడు
      '17':
        title: జీవితకాలపు అర్థాన్ని బారూకు తెలుసుకుంటాడు
      '18':
        title: దైవిక వెలుగును బారూకు వివరిస్తాడు
      '19':
        title: దేవుడు ప్రతి వ్యక్తికి తీర్పుతీరుస్తాడు
      '20':
        title: త్వరగా రానున్న తీర్పును దేవుడు వాగ్దానం చేస్తాడు
      '21':
        title: కిద్రోను దగ్గర బారూకు ప్రార్థిస్తాడు
      '22':
        title: పైనుంచి వినిపించిన స్వరానికి బారూకు లోబడతాడు
      '23':
        title: వేచివున్న తరాలన్నిటినీ దేవుడు జ్ఞాపకం చేసుకుంటాడు
      '24':
        title: భవిష్యత్తు తీర్పును బారూకు చూస్తాడు
      '25':
        title: అంతం వరకు బారూకు కాపాడబడతాడు
      '26':
        title: శ్రమకాలం ఎంతకాలముంటుందని బారూకు ప్రశ్నిస్తాడు
      '27':
        title: రాబోయే కాలపు సంఘటనలను బారూకు వివరిస్తాడు
      '28':
        title: క్షయరహితమైన దాని గురించి బారూకు ప్రశ్నిస్తాడు
      '29':
        title: భూమి సమృద్ధితో పొంగిపొర్లుతుంది
      '30':
        title: మెస్సీయతో పాటు ఆత్మలు లేస్తాయి
      '31':
        title: బారూకు పెద్దలను సీయోనుకు సమకూరుస్తాడు
      '32':
        title: దేవుని ధర్మశాస్త్రం ద్వారా సురక్షితంగా ఉండండి
      '33':
        title: తమతో ఉండమని ప్రజలు బారూకును వేడుకుంటారు
      '34':
        title: బారూకు విలపిస్తూ ప్రజలకు అభయమిస్తాడు
      '35':
        title: సీయోను దుఃఖాన్ని తలచి బారూకు విలపిస్తాడు
      '36':
        title: ద్రాక్షావల్లి దేవదారును నిందిస్తుంది
      '37':
        title: పడిపోయిన దేవదారును ద్రాక్షావల్లి నిందిస్తుంది
      '38':
        title: దర్శన వివరణ కోసం బారూకు ప్రార్థిస్తాడు
      '39':
        title: రాజ్యాల గురించి బారూకు ముందుగా చెబుతాడు
      '40':
        title: మెస్సీయ శేషప్రజలను కాపాడుతాడు
      '41':
        title: భవిష్యత్తు సంఘటనల గురించి బారూకు అడుగుతాడు
      '42':
        title: గతం కంటే విశ్వాసమే ముఖ్యం
      '43':
        title: శాశ్వత ఆదరణను బారూకు స్వీకరిస్తాడు
      '44':
        title: బారూకు తన కుమారుడైన జ్ఞానాన్ని పిలుస్తాడు
      '45':
        title: సహించండి, భయభక్తులతో సీయోనును వెదకండి
      '46':
        title: బారూకు పెద్దలకు నిరీక్షణ కలిగిస్తాడు
      '47':
        title: బారూకు ఏడు రోజులు ఉపవాసముంటాడు
      '48':
        title: శేషప్రజల కోసం బారూకు ప్రార్థిస్తాడు
      '49':
        title: భవిష్యత్తు జీవితం గురించి బారూకు ప్రశ్నిస్తాడు
      '50':
        title: మృతులు గుర్తుపట్టదగినవారిగా లేస్తారు
      '51':
        title: దుష్టులు వాడిపోతారు, నీతిమంతులు మహిమపరచబడతారు
      '52':
        title: తిరిగివచ్చిన మృతులను జీవులు గుర్తుపడతారు
      '53':
        title: మేఘ దర్శనాన్ని బారూకు కలలో చూస్తాడు
      '54':
        title: దర్శన వివరణ కోసం బారూకు ప్రార్థిస్తాడు
      '55':
        title: భవిష్యత్తు మర్మాలను దేవుడు బారూకుకు చూపిస్తాడు
      '56':
        title: మేఘం లోకపు ఆరంభాన్ని సూచిస్తుంది
      '57':
        title: నల్లని జలాలు ఆదాము అతిక్రమాన్ని సూచిస్తాయి
      '58':
        title: పాపం భూమిని కప్పేయడం ఆదాము చూస్తాడు
      '59':
        title: పాపభరిత లోకంపై మేఘం పైకి లేస్తుంది
      '60':
        title: అమోరీయుల దుష్టత్వం ఇశ్రాయేలును కలుషితం చేస్తుంది
      '61':
        title: దావీదు, సొలొమోను యుగం వర్ధిల్లుతుంది
      '62':
        title: యరొబాము పాపం నాశనాన్ని తెస్తుంది
      '63':
        title: హిజ్కియా నీతి విజయం సాధిస్తుంది
      '64':
        title: మనష్షే దుష్టత్వం అపవిత్రం చేస్తుంది
      '65':
        title: ఆమోను దుష్టపాలన చీకటిని కమ్ముతుంది
      '66':
        title: యోషీయా పవిత్రత సీయోనును పునరుద్ధరిస్తుంది
      '67':
        title: ప్రస్తుత విపత్తు దేవదూతలను దుఃఖపరుస్తుంది
      '68':
        title: భవిష్యత్తు రక్షణ ఆనందాన్ని తెస్తుంది
      '69':
        title: చివరి జలాలు లోకానికి సంబంధించినవి
      '70':
        title: లోకకాలం తీర్పుకు పక్వమవుతుంది
      '71':
        title: పరిశుద్ధ ప్రజలపై కరుణ చూపబడుతుంది
      '72':
        title: ప్రకాశవంతమైన జలాలు మెస్సీయ కాలాన్ని సూచిస్తాయి
      '73':
        title: శాంతియుగం కలహాలన్నిటినీ అంతం చేస్తుంది
      '74':
        title: నిర్మించేవారు శాంతిగా పంట కోస్తారు
      '75':
        title: బారూకు దేవుని కరుణను స్తుతిస్తాడు
      '76':
        title: ప్రజలు బారూకు బోధను కోరుతారు
      '77':
        title: బారూకు ప్రజలకు ధర్మశాస్త్రాన్ని గుర్తుచేస్తాడు
      '78':
        title: బారూకు చెరలో ఉన్నవారికి నిరీక్షణ సందేశం రాస్తాడు
      '79':
        title: సృష్టికర్త ప్రేమ మారదు
      '80':
        title: నెబుకద్నెజరు దాడి ముందే నిర్ణయించబడింది
      '81':
        title: బాధల్లో ఉన్నవారికి దేవుని కరుణ సమీపంలో ఉంది
      '82':
        title: దుష్ట జనాలు తీర్పును ఎదుర్కొంటాయి
      '83':
        title: మోషే, యిర్మీయా తీర్పుల గురించి హెచ్చరించారు
      '84':
        title: ధర్మశాస్త్రాన్ని జ్ఞాపకం ఉంచమని బారూకు ప్రోత్సహిస్తాడు
      '85':
        title: అంతం సమీపించింది; ఆజ్ఞలను స్వీకరించండి
      '86':
        title: సమావేశాల్లో ఉత్తరాన్ని బిగ్గరగా చదవండి
      '87':
        title: బోధించిన ఆజ్ఞలను గట్టిగా పట్టుకోండి
  2 Esdras:
    display_name: 2 ఎస్ద్రాస్
    author: రచయిత తెలియదు; మొదట యూదు సంప్రదాయంలో రూపుదిద్దుకున్న ప్రధాన భాగం (4 ఎజ్రా, 3–14 అధ్యాయాలు) చుట్టూ క్రైస్తవ సంపాదకులు చేర్చిన ఆరంభ, ముగింపు భాగాలు ఉన్నాయి.
    audience: క్రీ.శ. 70 తర్వాత దేవుని న్యాయం, లోకంలోని బాధ గురించి ప్రశ్నలతో పోరాడుతున్న యూదులు; ఆ తర్వాత క్రైస్తవ పాఠకుల కోసం విస్తరించబడింది.
    date: యూదు ప్రధాన భాగం బహుశా సుమారు క్రీ.శ. 100; క్రైస్తవ చేర్పులు బహుశా క్రీ.శ. 2–3 శతాబ్దాలు.
    chapters:
      '1':
        title: ఇశ్రాయేలు తిరస్కారం గురించి దేవుడు విలపిస్తాడు
      '2':
        title: ఎజ్రా రాబోయే మహిమను చూస్తాడు
      '3':
        title: ఇశ్రాయేలు చరిత్రను తలచుకుంటూ ఎజ్రా ప్రార్థిస్తాడు
      '4':
        title: ఎజ్రా పరిమితులను యూరియేలు బోధిస్తాడు
      '5':
        title: రాబోయే భయానక పరిస్థితుల్లో ఎజ్రా వేడుకుంటాడు
      '6':
        title: సృష్టి దినాలను తలచుకుంటూ ఎజ్రా ప్రార్థిస్తాడు
      '7':
        title: ఎజ్రా అంతిమ తీర్పును చూస్తాడు
      '8':
        title: అవగాహన కోసం ఎజ్రా ప్రార్థిస్తాడు
      '9':
        title: సీయోను రాబోయే మహిమను ఎజ్రా చూస్తాడు
      '10':
        title: ఎజ్రా సీయోను మహిమను చూస్తాడు
      '11':
        title: గద్దల కల అంతాన్ని ముందే సూచిస్తుంది
      '12':
        title: ఎజ్రా సింహాన్ని, గద్దలను కలలో చూస్తాడు
      '13':
        title: సముద్రం నుంచి వచ్చిన మనిషి సృష్టిని విడిపిస్తాడు
      '14':
        title: నమ్మదగిన మాటలను పలకమని ప్రభువు ఆజ్ఞాపిస్తాడు
      '15':
        title: రాబోయే తీర్పు గురించి ప్రవక్త హెచ్చరిస్తాడు
      '16':
        title: దేవుని తీర్పులు భూమినీ సముద్రాన్నీ కుదిపివేస్తాయి
  Didache:
    display_name: దిదాఖే
    author: రచయిత తెలియదు (ఈ శీర్షికకు “పన్నెండు అపొస్తలుల బోధ” అని అర్థం).
    audience: తొలి క్రైస్తవ సంఘాలు—నైతిక జీవితం, బాప్తిస్మం, ప్రభుభోజనం, సంచార బోధకుల గురించి సంక్షిప్త మార్గదర్శిని.
    date: బహుశా క్రీ.శ. 1వ శతాబ్దం చివరి నుంచి 2వ శతాబ్దం ఆరంభం వరకు.
    chapters:
      '1':
        title: దేవుణ్ణి ప్రేమిస్తూ జీవమార్గాన్ని ఎంచుకోండి
      '2':
        title: చెడును విడిచి ఆజ్ఞలను పాటించండి
      '3':
        title: ప్రతి విధమైన చెడుకు దూరంగా పారిపోండి
      '4':
        title: దేవుని వాక్యాన్ని ఎల్లప్పుడూ గౌరవించండి
      '5':
        title: మరణమార్గం పాపానికి నడిపిస్తుంది
      '6':
        title: ఏమీ చేర్చకుండా బోధను అనుసరించండి
      '7':
        title: ప్రవహించే నీటిలో నమ్మకంగా బాప్తిస్మం ఇవ్వండి
      '8':
        title: నీతిమంతుడైన తండ్రికి ప్రార్థించండి
      '9':
        title: పాత్రకూ రొట్టెకూ కృతజ్ఞతలు
      '10':
        title: పరిశుద్ధ తండ్రికి కృతజ్ఞతార్పణ
      '11':
        title: నిజమైన బోధకులను, ప్రవక్తలను ఆహ్వానించండి
      '12':
        title: ప్రయాణికులకు సహాయం చేయండి, అయితే వారిని పరీక్షించండి
      '13':
        title: నిజమైన ప్రవక్తలను, బోధకులను ఆదరించండి
      '14':
        title: రొట్టె విరిచే ముందు పాపాలను ఒప్పుకోండి
      '15':
        title: యోగ్యులైన పర్యవేక్షకులను, పరిచారకులను నియమించండి
      '16':
        title: మెలకువగా ఉండండి; విశ్వాసం పరీక్షలను సహిస్తుంది
  Gospel of Thomas:
    display_name: తోమా సువార్త
    author: రచయిత తెలియదు; ప్రారంభ వాక్యం ఈ సూక్తుల సంకలనాన్ని “దిదుమోస్ యూదా తోమా”కు ఆపాదిస్తుంది. ఇది సంపూర్ణంగా లభించేది నాగ్ హమ్మాదీ నుంచి దొరికిన 4వ శతాబ్దపు కాప్టిక్ అనువాదంలో మాత్రమే (NHC II,2); ఆక్సిరింకస్ నుంచి మూడు గ్రీకు శకలాలు కూడా లభించాయి.
    audience: సిరియా జ్ఞాన సంప్రదాయం, ఆదిమ జ్ఞానవాద ఆలోచనల ప్రభావం పొందిన క్రైస్తవ పాఠకులు; యేసు సూక్తుల్లోని అంతరార్థం ద్వారా తమను తాము తెలుసుకోవడంపై దృష్టి పెట్టినవారు.
    date: గ్రీకు మూలరచన బహుశా సుమారు క్రీ.శ. 50–140; కాప్టిక్ ప్రతిలిపి సుమారు క్రీ.శ. 340.
    summary: తోమా సువార్త యేసుకు ఆపాదించబడిన సూక్తుల సంకలనం. ఇందులో నిరంతర కథనం లేదు; సూక్తుల అర్థాన్ని కనుగొనమని ఇది పాఠకులను పదేపదే పిలుస్తుంది.
    chapters:
      '0':
        title: యేసు రహస్య సూక్తుల సంకలనం
      '1':
        title: యేసు నిగూఢ జ్ఞానాన్ని బోధిస్తాడు
      '2':
        title: రాజ్యం మీ లోపలా వెలుపలా ఉంది
      '3':
        title: రాజ్యం లోపలా వెలుపలా ఉంది
      '4':
        title: యేసు వినయాన్ని, జ్ఞానాన్ని బోధిస్తాడు
      '5':
        title: యేసు రహస్యాల గురించి మాట్లాడుతాడు
      '6':
        title: మనిషి తిన్న సింహం ధన్యమైనది
      '7':
        title: తెలివైన జాలరి పెద్ద చేపను ఎంచుకుంటాడు
      '8':
        title: తెలివైన జాలరి పెద్దదానిని ఎంచుకుంటాడు
      '9':
        title: విత్తేవాడు విత్తనాన్ని విస్తారంగా చల్లుతాడు
      '10':
        title: యేసు మండుతున్న అగ్నిని కాపాడుతాడు
      '11':
        title: గతించిపోవడం గురించి యేసు మాట్లాడుతాడు
      '12':
        title: యాకోబు శిష్యులకు నాయకత్వం వహిస్తాడు
      '13':
        title: ఉపవాసం, ప్రార్థన, దానధర్మం, పాపం
      '14':
        title: యేసు నిజమైన భక్తిని బోధిస్తాడు
      '15':
        title: మీ తండ్రియైన ఆయనను ఆరాధించండి
      '16':
        title: విభజన గురించి యేసు మాట్లాడుతాడు
      '17':
        title: ఆదిని కనుగొనేవాడు ధన్యుడు
      '18':
        title: యేసు ఆది, అంతాలను వివరిస్తాడు
      '19':
        title: రాజ్యం పెరిగే ఆవగింజ వంటిది
      '20':
        title: శిష్యుల ముగింపు గురించి మరియ అడుగుతుంది
      '21':
        title: శిష్యుల గురించి మరియ యేసును ప్రశ్నిస్తుంది
      '22':
        title: రాజ్యంలో ప్రవేశాన్ని యేసు వివరిస్తాడు
      '23':
        title: నిలిచే కొద్దిమందిని యేసు ఎన్నుకుంటాడు
      '24':
        title: మనిషిలోని వెలుగు ప్రకాశిస్తుంది
      '25':
        title: సోదరుణ్ణి మీ ప్రాణంలా ప్రేమించండి
      '26':
        title: వేషధారణ గురించి యేసు మాట్లాడుతాడు
      '27':
        title: ఉపవాసం ఆధ్యాత్మిక రాజ్యానికి నడిపిస్తుంది
      '28':
        title: మత్తులో ఉన్నవారి గురించి యేసు మాట్లాడుతాడు
      '29':
        title: ఆత్మను చూసి యేసు ఆశ్చర్యపడతాడు
      '30':
        title: దైవ సన్నిధి గురించి యేసు మాట్లాడుతాడు
      '31':
        title: ప్రవక్తకు తన ఊరిలో గుర్తింపు ఉండదు
      '32':
        title: ఎత్తైన కొండపై నిర్మించిన పట్టణం
      '33':
        title: మేడల మీద నుంచి వెలుగును ప్రకటించండి
      '34':
        title: గుడ్డివాడు గుడ్డివాణ్ణి నడిపిస్తే ఇద్దరూ పడిపోతారు
      '35':
        title: చేతులు కట్టి ఇంటిని స్వాధీనం చేసుకోవడం
      '36':
        title: రోజువారీ అవసరాల గురించి చింతించడం మానండి
      '37':
        title: సిగ్గు అనే వస్త్రాన్ని విడిచి సత్యాన్ని చూడండి
      '38':
        title: కోరుకున్న మాటల గురించి యేసు మాట్లాడుతాడు
      '39':
        title: పరిసయ్యులు జ్ఞానపు తాళంచెవులను దాచిపెడతారు
      '40':
        title: తండ్రికి వెలుపల నాటిన ద్రాక్షతీగ నశిస్తుంది
      '41':
        title: ఇవ్వడం గురించి యేసు మాట్లాడుతాడు
      '42':
        title: లోకంలో బాటసారులుగా ఉండండి
      '43':
        title: శిష్యుల ప్రశ్నకు యేసు జవాబిస్తాడు
      '44':
        title: తండ్రిని, కుమారుణ్ణి దూషించినవారికి క్షమాపణ
      '45':
        title: హృదయం గురించి యేసు మాట్లాడుతాడు
      '46':
        title: యోహాను గురించి యేసు మాట్లాడుతాడు
      '47':
        title: అసాధ్యమైన సేవ గురించి యేసు బోధిస్తాడు
      '48':
        title: శాంతి గురించి యేసు మాట్లాడుతాడు
      '49':
        title: ఏకాంతంగా ఉన్న ఎన్నుకోబడినవారు రాజ్యాన్ని కనుగొంటారు
      '50':
        title: వెలుగు గురించి యేసు బోధ
      '51':
        title: మృతుల విశ్రాంతి గుర్తించకుండానే వస్తుంది
      '52':
        title: మాట్లాడే మృతుల మధ్య సజీవుడు
      '53':
        title: సున్నతి గురించి శిష్యుల ప్రశ్న
      '54':
        title: పేదలను ధన్యులని ప్రకటించిన యేసు
      '55':
        title: ద్వేషించండి లేదా క్రీస్తును అనుసరించండి
      '56':
        title: లోకాన్ని శవంగా కనుగొని అనర్హమని ఎంచడం
      '57':
        title: శ్రమించే వ్యక్తి ధన్యుడు
      '58':
        title: కఠినంగా శ్రమించేవారిని ధన్యులని ప్రకటించిన యేసు
      '59':
        title: బతికి ఉండగానే సజీవుడైనవానిని వెదకండి
      '60':
        title: గొర్రెపిల్లను యూదయకు తీసుకెళ్తున్న సమరయుడు
      '61':
        title: వెలుగు గురించి సలోమేకి యేసు బోధ
      '62':
        title: రహస్యంగా బయలుపరచబడిన మర్మాలు
      '63':
        title: సిద్ధంగా లేని ధనవంతుని మరణం
      '64':
        title: అనుకోని అతిథులను ఆహ్వానించిన యజమాని
      '65':
        title: మంచివాని ద్రాక్షతోట నాశనం
      '66':
        title: తిరస్కరించబడిన రాయిని నాకు చూపండి
      '67':
        title: అన్నీ తెలిసినా తనను తాను ఎరుగకపోవడం
      '68':
        title: హింసించబడేవారు ధన్యులు
      '69':
        title: ఆకలిగొన్న ఆత్మలు ధన్యులు
      '70':
        title: అంతరంగ పేదరికం గురించి యేసు బోధ
      '71':
        title: ఇల్లు కూలిపోతుందని యేసు ముందుగా చెప్పడం
      '72':
        title: ఆస్తిని పంచడానికి యేసు నిరాకరణ
      '73':
        title: మరింతమంది పనివారు కావాలని యేసు పిలుపు
      '74':
        title: దప్పిగొన్న జనసమూహాలు ఉన్నా బావి ఖాళీ
      '75':
        title: ఏకాంతంగా ఉన్నవారు పెండ్లి గదిలో ప్రవేశిస్తారు
      '76':
        title: ఎప్పటికీ నిలిచే నిధిని వెదకండి
      '77':
        title: దైవిక వెలుగుగా తన గురించి యేసు బోధ
      '78':
        title: మెత్తని వస్త్రాల గురించి యేసు ప్రశ్న
      '79':
        title: సత్యాన్ని సహించిన స్త్రీ ధన్యురాలు
      '80':
        title: లోకాన్ని దేహంగా కనుగొని అనర్హమని ఎంచడం
      '81':
        title: సంపద, అధికారం గురించిన యేసు విరోధాభాసం
      '82':
        title: సమీపంలో ఉన్నవారికి దగ్గరగా అగ్ని
      '83':
        title: రూపాలు కనిపిస్తాయి, కానీ వెలుగు దాగి ఉంటుంది
      '84':
        title: మీ పోలికను చూడడం ఆనందాన్ని కలిగిస్తుంది
      '85':
        title: ఆదాము గొప్ప శక్తి నుండి వచ్చాడు
      '86':
        title: నివాసం లేకపోవడం గురించి యేసు బోధ
      '87':
        title: దేహం, ఆత్మ పరస్పరం ఆధారపడటం దౌర్భాగ్యకరం
      '88':
        title: దేవదూతలు, ప్రవక్తలు వస్తారు
      '89':
        title: శుద్ధీకరణ గురించి యేసు ప్రశ్న
      '90':
        title: వెదికేవారికి విశ్రాంతిని అందించే యేసు
      '91':
        title: నిజమైన జ్ఞానాన్ని బయలుపరచిన యేసు
      '92':
        title: వెదకండి, మీకు దొరుకుతుంది
      '93':
        title: పవిత్రమైనవాటిని వివేకంతో ఇవ్వండి
      '94':
        title: వెదకడం కనుగొనడానికి దారితీస్తుంది
      '95':
        title: తిరిగి వస్తుందని ఆశించకుండా అప్పివ్వండి
      '96':
        title: దాగి ఉన్న పులిసిన పిండిలాంటి రాజ్యం
      '97':
        title: తెలియకుండానే పిండిని పోగొట్టుకున్న స్త్రీ
      '98':
        title: ముందుగా తన బలాన్ని పరీక్షించుకున్న వ్యక్తి
      '99':
        title: నిజమైన సహోదరులు తండ్రికి విధేయులవుతారు
      '100':
        title: పన్ను గురించి యేసు సమాధానం
      '101':
        title: నిజమైన శిష్యుడు ద్వేషించాలి
      '102':
        title: స్వార్థపరులైన పరిసయ్యులను శపించిన యేసు
      '103':
        title: సిద్ధంగా ఉన్న వ్యక్తి ధన్యుడు
      '104':
        title: పెండ్లికుమారుడు వెళ్లిన తర్వాత ప్రార్థించండి
      '105':
        title: అంతర్దృష్టి బహిరంగ అవమానాన్ని తెస్తుంది
      '106':
        title: ఐక్యత పర్వతాలను కదిలిస్తుంది
      '107':
        title: తప్పిపోయిన గొర్రెను వెదికే రాజ్యం
      '108':
        title: దాగి ఉన్నవాటిని బయలుపరచిన యేసు
      '109':
        title: తనను తాను వెల్లడించుకున్న దాగిన నిధి
      '110':
        title: దొరికిన లోక సంపదను త్యజించండి
      '111':
        title: ఆయన ఎదుట ఆకాశాలు చుట్టబడతాయి
      '112':
        title: శరీరంపై ఆధారపడడం గురించి యేసు హెచ్చరిక
      '113':
        title: రాజ్యం భూమిమీద విస్తరించి ఉంది
      '114':
        title: మరియ సమానత్వం గురించి యేసు బోధ
  Gospel of Truth:
    display_name: సత్య సువార్త
    author: రచయిత తెలియదు; వాలెంటినస్ లేదా ఆయన పాఠశాలకు చెందిన రచనగా విస్తృతంగా భావిస్తారు.
    audience: వాలెంటినియన్ జ్ఞానవాద ఉద్యమానికి చెందిన క్రైస్తవ పాఠకులు.
    date: సుమారు క్రీ.శ. 2వ శతాబ్దం మధ్యకాలం; నాగ్ హమ్మాదిలో భద్రపరచబడింది.
    chapters:
      '1':
        title: కృప తండ్రి సత్యాన్ని బయలుపరుస్తుంది
      '2':
        title: మరుపులో బలపడే తప్పు
      '3':
        title: పిల్లలకు జ్ఞానాన్ని బయలుపరచిన తండ్రి
      '4':
        title: పేరుపెట్టి పిలువబడినవారు విశ్రాంతి పొందుతారు
      '5':
        title: అందరినీ సంపూర్ణతకు చేర్చిన యేసు
      '6':
        title: భ్రాంతిని ఛేదించే వాక్యం
      '7':
        title: తండ్రి పేరు పెట్టి ఉనికిలోకి తెస్తాడు
      '8':
        title: భీతి శూన్యమని వెల్లడించిన వెలుగు
      '9':
        title: ఆయన వారికి వెలుగును, జీవాన్ని బోధించాడు
      '10':
        title: ఒక్క గొర్రెను వెదికే కాపరి
      '11':
        title: గ్రహింపు అంధులను మేల్కొలుపుతుంది
      '12':
        title: పాపాల విమోచనను తెచ్చే వెలుగు
      '13':
        title: వెలుగులో ఆయన తన చిత్తాన్ని వెల్లడిస్తాడు
      '14':
        title: ప్రియ కుమారునికి పేరు పెట్టిన తండ్రి
      '15':
        title: తండ్రిలో విశ్రమించే సత్యం
      '16':
        title: నన్ను నేను తండ్రికి అంకితం చేసుకుంటాను
  Jubilees:
    display_name: యూబిలీలు
    author: రచయిత తెలియదు; మోషేకు సీనాయి పర్వతంపై బయలుపరచబడిన ప్రకటనగా సమర్పించబడింది.
    audience: 364 రోజుల సౌర పంచాంగాన్ని, కఠినమైన హలాఖా ఆచరణను పాటించిన యూద సమాజాలు (బహుశా కుమ్రాన్‌కు చెందిన అదే మత-సాంస్కృతిక వాతావరణం).
    date: సుమారు క్రీ.పూ. 2వ శతాబ్దం మధ్యకాలం; గీజ్ (ఇథియోపిక్) భాషలో సంపూర్ణంగా భద్రపరచబడింది.
    chapters:
      '1':
        title: కరుణ కోసం మోషే విన్నపం
      '2':
        title: ఇశ్రాయేలుకు విశ్రాంతిదిన పవిత్రత
      '3':
        title: ఏదెనులో హవ్వకు పేరు పెట్టిన ఆదాము
      '4':
        title: తీర్పు గురించి హనోకు హెచ్చరిక
      '5':
        title: పాపం కారణంగా జలప్రళయ నిర్ణయం
      '6':
        title: ఇంద్రధనుస్సుతో నోవహుకు చేసిన నిబంధనలు
      '7':
        title: నీతిగా జీవించమని సంతతివారికి నోవహు హెచ్చరిక
      '8':
        title: భూమిని పంచిన నోవహు
      '9':
        title: ఆత్మలపై అధికారం కోరిన మస్తేమా
      '10':
        title: బాబెలు గోపురం వద్ద చెదరగొట్టబడిన ప్రజలు
      '11':
        title: అవినీతి మధ్య కుమారునికి పేరు పెట్టిన సెరూగు
      '12':
        title: పునరుద్ధరించబడిన పరలోక భాష
      '13':
        title: లోతును రక్షించి దశమభాగం ఇచ్చిన అబ్రాము
      '14':
        title: అబ్రాముకు గొప్ప ప్రతిఫలం వాగ్దానం చేసిన దేవుడు
      '15':
        title: నిబంధనకు గుర్తుగా సున్నతి
      '16':
        title: ఇస్సాకు జననం, సొదొమ నాశనం
      '17':
        title: అబ్రాహాము విశ్వాసం రుజువైంది
      '18':
        title: సీయోనులో పరీక్షించబడిన అబ్రాహాము విధేయత
      '19':
        title: అబ్రాహాము మరణం, యాకోబుకు ఆశీర్వాదం
      '20':
        title: పవిత్రతను ఆజ్ఞాపించిన అబ్రాహాము
      '21':
        title: యాకోబు నీతిని ఆశీర్వదించిన అబ్రాహాము
      '22':
        title: వారాల పండుగ ఏర్పాటు
      '23':
        title: ఏశావు కోపం నుంచి పారిపోయిన యాకోబు
      '24':
        title: లాబాను వద్ద మోసపూరితంగా సేవచేసిన యాకోబు
      '25':
        title: కనానుకు తిరిగివచ్చిన యాకోబు
      '26':
        title: ఏశావుతో సమాధానపడిన యాకోబు
      '27':
        title: ఏశావు నుంచి పారిపోతూ కలగన్న యాకోబు
      '28':
        title: యాకోబును మోసగించి వివాహంలోకి నెట్టిన లాబాను
      '29':
        title: లాబానుకు తెలియకుండా వెళ్లిపోయిన యాకోబు
      '30':
        title: దీనాకు ప్రతీకారం తీర్చుకున్న షిమ్యోను, లేవి
      '31':
        title: లేవి, యూదాలను ఆశీర్వదించిన ఇస్సాకు
      '32':
        title: దశమభాగం ఇచ్చి ప్రార్థించిన యాకోబు
      '33':
        title: యాకోబుకు తీవ్రమైన అపరాధం చేసిన రూబేను
      '34':
        title: యోసేపు ఐగుప్తుకు అమ్మబడిన విషాదం
      '35':
        title: మక్పేలా దగ్గర మరణించిన రిబ్కా
      '36':
        title: మరణానికి ముందు ఆశీర్వదించిన ఇస్సాకు
      '37':
        title: తన ప్రమాణాన్ని త్యజించిన ఏశావు
      '38':
        title: యుద్ధంలో ఏశావును చంపిన యాకోబు
      '39':
        title: పోతీఫరు భార్యను ఎదిరించిన యోసేపు
      '40':
        title: ఐగుప్తు పాలకుడిగా ఎదిగిన యోసేపు
      '41':
        title: సంతానం కోసం యూదాను మోసగించిన తామారు
      '42':
        title: తన సహోదరులను పరీక్షించిన యోసేపు
      '43':
        title: బెన్యామీను కోసం వేడుకున్న యూదా
      '44':
        title: యాకోబు ఐగుప్తు ప్రయాణం
      '45':
        title: గోషెనులో స్థిరపడిన ఇశ్రాయేలు
      '46':
        title: యోసేపు ఆధ్వర్యంలో వర్ధిల్లిన ఇశ్రాయేలు
      '47':
        title: రెల్లుల మధ్య దాచబడిన మోషే
      '48':
        title: మోషేపై మస్తేమా విఫల దాడి
      '49':
        title: మొత్తంగా కాల్చిన పస్కా గొర్రెపిల్ల
      '50':
        title: విశ్రాంతిదినపు విశ్రాంతి, నిషేధిత శ్రమ
  Psalms of Solomon:
    display_name: సొలొమోను కీర్తనలు
    author: రచయిత తెలియదు; సొలొమోను పేరుతో ఆపాదించబడింది.
    audience: క్రీ.పూ. 63లో పాంపేయి చేసిన ఆక్రమణకు స్పందించిన యెరూషలేములోని భక్తిశ్రద్ధగల యూదులు.
    date: సుమారు క్రీ.పూ. 1వ శతాబ్దం మధ్యకాలం.
    chapters:
      '1':
        title: నా బాధతో కూడిన మొర విన్న ప్రభువు
      '2':
        title: గర్విష్ఠులైన పాపులను త్వరగా తీర్పుతీర్చే దేవుడు
      '3':
        title: నీతిమంతులు నిరంతరం ప్రభువును స్తుతిస్తారు
      '4':
        title: వేషధారి గతి అవమానకరమైన అంతం
      '5':
        title: అందరికీ సమృద్ధిగా సమకూర్చే దేవుడు
      '6':
        title: సిద్ధమైన హృదయం ప్రభువును పిలుస్తుంది
      '7':
        title: శత్రువుల పట్టు నుంచి కాపాడే ప్రభువు
      '8':
        title: ఎప్పటికీ న్యాయంగా తీర్పుతీర్చే ప్రభువు
      '9':
        title: దేవుని కరుణలో ఇశ్రాయేలు నిరీక్షణ
      '10':
        title: శిక్షణను అంగీకరిస్తే శుద్ధి కలుగుతుంది
      '11':
        title: దూరదేశాల నుంచి ఇశ్రాయేలును సమకూర్చు
      '12':
        title: గుసగుసలాడే అబద్ధాల నుంచి నన్ను రక్షించు
      '13':
        title: నాశనానికి దూరంగా జీవించే నీతిమంతులు
      '14':
        title: నిత్య జీవవృక్షాలైన విశ్వాసులు
      '15':
        title: ఆపదలో ప్రభువును పిలిచాను
      '16':
        title: దేవుని కరుణ నన్ను మేల్కొలిపింది
      '17':
        title: ప్రభువు సత్యవంతుడైన నిత్యరాజు
      '18':
        title: కరుణ దినం కోసం ఇశ్రాయేలును శుద్ధిచేయి
  Shepherd of Hermas:
    display_name: హెర్మాసు కాపరి
    author: రోములో నివసించిన క్రైస్తవుడైన హెర్మాసు.
    audience: రోములోని క్రైస్తవ సంఘం—పశ్చాత్తాపం గురించి నైతిక, అంత్యకాల ప్రవచనం.
    date: సుమారు క్రీ.శ. 2వ శతాబ్దం ఆరంభం నుంచి మధ్యకాలం వరకు.
    chapters:
      '1':
        title: దుష్ట కోరికను ఎదుర్కొన్న హెర్మాసు
      '2':
        title: పుస్తకంతో ప్రత్యక్షమైన స్త్రీ
      '3':
        title: కుటుంబాన్ని పశ్చాత్తాపానికి ప్రోత్సహించిన దూత
      '4':
        title: చదివిన తరువాత వెళ్లిపోయిన స్త్రీ
      '5':
        title: హెర్మాసును మళ్లీ పైకెత్తిన ఆత్మ
      '6':
        title: పశ్చాత్తాపపడమని పిల్లలకు హెచ్చరిక
      '7':
        title: హెర్మాసుకు క్షమాపణ, పిల్లలకు శుద్ధి
      '8':
        title: వృద్ధ స్త్రీగా వెల్లడైన సంఘం
      '9':
        title: పొలంలో స్త్రీని కలిసిన హెర్మాసు
      '10':
        title: నీళ్లపై నిర్మితమవుతున్న గోపుర దర్శనం
      '11':
        title: దర్శనాన్ని వివరించిన స్త్రీ
      '12':
        title: గోపురాన్ని నిర్మించిన దేవదూతలు
      '13':
        title: గోపురంలో సరిగ్గా అమరిన రాళ్లు
      '14':
        title: గోపురం నుంచి తిరస్కరించబడిన పాపులు
      '15':
        title: తిరస్కరించబడిన రాళ్లకు పశ్చాత్తాప అవకాశం
      '16':
        title: గోపురానికి ఆధారంగా నిలిచిన ఏడుగురు స్త్రీలు
      '17':
        title: మూడవ దర్శనం, తొమ్మిదవ భాగం
      '18':
        title: శుద్ధి చేసుకోవాలని నాయకులకు హెచ్చరిక
      '19':
        title: మూడు రూపాలకు తొలి వివరణ
      '20':
        title: 'రెండవ దర్శనం: నూతనమైన ఆత్మలు'
      '21':
        title: నూతనత్వాన్ని చూపిన మూడవ దర్శనం
      '22':
        title: మహా శ్రమకు సూచనైన మృగం
      '23':
        title: నిర్మల హృదయంతో సేవించమన్న కన్య
      '24':
        title: మృగం తలపై నాలుగు రంగులు
      '25':
        title: ముఖ్య విషయాలను వెల్లడించిన కాపరి
      '26':
        title: ఏకైక సత్య దేవునిపై విశ్వాసం
      '27':
        title: గౌరవనీయతను వస్త్రంలా ధరించుకో
      '28':
        title: సత్యంగా జీవించమని ప్రోత్సహించిన దూత
      '29':
        title: శీలాచరణను కచ్చితంగా పాటించమన్న ఆజ్ఞ
      '30':
        title: పశ్చాత్తాపం ఇచ్చే నిజమైన అవగాహన
      '31':
        title: పశ్చాత్తాపం ద్వారా లభించే క్షమాపణ
      '32':
        title: పరిశుద్ధాత్మకు స్వేచ్ఛగా నివాసమిచ్చే సహనం
      '33':
        title: దుష్టత్వం నుంచి నీతి మార్గాన్ని గుర్తించడం
      '34':
        title: ప్రభువుకు భయపడి నీతిగా జీవించు
      '35':
        title: మంచి చెడుల గురించి మాట్లాడిన దూత
      '36':
        title: సందేహాన్ని తృణీకరించి నమ్మకమైన దేవుని సేవించు
      '37':
        title: నాశనం చేసేదీ రక్షించేదీ అయిన దుఃఖం
      '38':
        title: ఆత్మను కృశింపజేసే దుఃఖం
      '39':
        title: ఉల్లాసానందాలను వస్త్రంలా ధరించుకో
      '40':
        title: అబద్ధ ప్రవక్తలకు, ఆత్మలకు దూరంగా ఉండే విశ్వాసులు
      '41':
        title: రక్షించే మంచి కోరిక అనే వస్త్రం
      '42':
        title: దుష్ట కోరికను ఎదిరించి నీతిని సేవించు
      '43':
        title: నీతియుక్తమైన సేవను కోరిన హెర్మాసు
      '44':
        title: ఆజ్ఞలను పాటించాలని నిర్ణయించుకో; అప్పుడు అవి సులభం
      '45':
        title: విశ్వాసులైన సేవకులకు భయపడే అపవాది
      '46':
        title: పశ్చాత్తాపపడమని హెర్మాసును ప్రోత్సహించిన దేవదూత
      '47':
        title: హెర్మాస్ నిజమైన నగరాన్ని ఎంచుకుంటాడు
      '48':
        title: సంపద సేవ చేయాల్సిన బాధ్యతను తెస్తుంది
      '49':
        title: పంచుకున్న సంపద పరిపూర్ణతను తెస్తుంది
      '50':
        title: హెర్మాస్ ఉపవాసాన్ని తప్పుగా అర్థం చేసుకుంటాడు
      '51':
        title: హెర్మాస్ అవగాహన కోసం వెదుకుతాడు
      '52':
        title: ఉపమాన భావం హెర్మాస్‌కు బోధించబడుతుంది
      '53':
        title: హెర్మాస్ శరీరాన్నీ ఆత్మనూ శుద్ధి చేసుకుంటాడు
      '54':
        title: విలాసంగా పెరిగిన గొర్రెలను కాసే కాపరులను చూడు
      '55':
        title: కఠిన కాపరి భోగాసక్తిగల గొర్రెలకు క్రమశిక్షణ నేర్పుతాడు
      '56':
        title: దారి తప్పిన గొర్రెలను కాపరి శిక్షిస్తాడు
      '57':
        title: భోగాసక్తికి తీవ్రమైన శిక్ష పడుతుంది
      '58':
        title: శిక్షాకాలం గురించి హెర్మాస్ ప్రశ్నిస్తాడు
      '59':
        title: ఉపశమనం కోసం హెర్మాస్ ప్రార్థిస్తాడు
      '60':
        title: పశ్చాత్తాపానికి వినయపూర్వక క్రమశిక్షణ, సహనం అవసరం
      '61':
        title: ఫలమున్నవారికి దేవదూత కిరీటాలు పెడతాడు
      '62':
        title: చెట్టు దేవుని ధర్మశాస్త్రానికి ప్రతీక
      '63':
        title: మళ్లీ నాటిన కొమ్మలను కాపరి వేరు చేస్తాడు
  Thunder, Perfect Mind:
    display_name: ఉరుము, పరిపూర్ణ మనస్సు
    author: అజ్ఞాత రచయిత.
    audience: గ్రీకు-ఐగుప్తీయ జ్ఞానసాహిత్య లేదా జ్ఞానవాద పాఠకులు; దైవిక స్త్రీమూర్తి స్వరంలో స్త్రీ రూపక స్వీయప్రకటన కవిత.
    date: బహుశా క్రీ.శ. 1–2వ శతాబ్దాలు; నాగ్ హమ్మాదిలో (NHC VI,2) భద్రపరచబడింది.
    chapters:
      '1':
        title: అన్వేషకులతో ఉరుము మాట్లాడుతుంది
      '2':
        title: నేనే మొదటిదాన్ని, చివరిదాన్ని, కన్యను
      '3':
        title: జ్ఞానం, అజ్ఞానం ఏకమవుతాయి
      '4':
        title: భయం, బలం నాలో ఉన్నాయి
      '5':
        title: ఆమె ద్వేషించబడింది, ప్రేమించబడింది, మరణమని పిలువబడింది
      '6':
        title: మనస్సు, విశ్రాంతి నాలో ఉన్నాయి
      '7':
        title: నా ద్వారా శాంతి యుద్ధాన్ని తెస్తుంది
      '8':
        title: వినబడే స్వరంలో నిశ్శబ్దం
      '9':
        title: నేనే న్యాయం, పక్షవాది
      '10':
        title: సృష్టికర్త పేరును నేను బిగ్గరగా పిలుస్తాను
      '11':
        title: ఓర్పు, క్షమ వస్తాయి
  Testament of Reuben:
    display_name: రూబేను వీలునామా
    author: అజ్ఞాత రచయిత; యాకోబు కుమారులు మరణశయ్యపై చేసిన ప్రసంగాలుగా సమర్పించబడిన పన్నెండు పితరుల వీలునామాలలో భాగం.
    audience: పితరుల పాపాంగీకారాల నుండి నైతికతను నేర్చుకునే యూదు (ఆ తరువాత క్రైస్తవ) పాఠకులు.
    date: క్రైస్తవ పూర్వ యూదు మూలభాగం బహుశా క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదకీయ పొర బహుశా క్రీ.శ. 1–2వ శతాబ్దాలకు చెందినది.
    chapters:
      '1':
        title: పాపపు పట్టు గురించి రూబేను హెచ్చరిస్తాడు
      '2':
        title: ఏడు ఆత్మలు మానవాళిని నియంత్రిస్తాయి
      '3':
        title: ఏడు భ్రమలు యువతను బంధిస్తాయి
      '4':
        title: కామాన్నీ విగ్రహారాధననూ ఇప్పుడే విడిచిపెట్టండి
      '5':
        title: స్త్రీలు ప్రలోభపెట్టి ఉచ్చులో పడేస్తారు
      '6':
        title: బెలియారు ఉచ్చుల నుండి మనస్సులను కాపాడుకోండి
      '7':
        title: రూబేను ఎముకలు స్వదేశానికి చేరుతాయి
  Testament of Simeon:
    display_name: షిమ్యోను వీలునామా
    author: అజ్ఞాత రచయిత; పన్నెండు పితరుల వీలునామాలలో భాగం.
    audience: యూదు (ఆ తరువాత క్రైస్తవ) పాఠకులు.
    date: యూదు మూలభాగం బహుశా క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదన బహుశా క్రీ.శ. 1–2వ శతాబ్దాలకు చెందినది.
    chapters:
      '1':
        title: సాక్ష్యమివ్వడానికి షిమ్యోను తన కుమారులను సమకూరుస్తాడు
      '2':
        title: అసూయతో పన్నిన పన్నాగాల గురించి షిమ్యోను పశ్చాత్తాపపడతాడు
      '3':
        title: షిమ్యోను అసూయాత్మతో పోరాడతాడు
      '4':
        title: యోసేపు కనికరం చూపుతాడు; షిమ్యోను హెచ్చరిస్తాడు
      '5':
        title: పవిత్రత సౌందర్యాన్ని ఇస్తుంది; పాపాన్ని తిరస్కరించండి
      '6':
        title: చెడును తిరస్కరించి పవిత్రతలో వర్ధిల్లండి
      '7':
        title: రాబోయే రాజు గురించి షిమ్యోను ప్రవచిస్తాడు
      '8':
        title: షిమ్యోను మరణిస్తాడు; అతని ఎముకలు హెబ్రోనుకు తీసుకురాబడతాయి
      '9':
        title: షిమ్యోను కోసం దుఃఖిస్తూ నిర్గమణం కోసం వేచి ఉండండి
  Testament of Levi:
    display_name: లేవి వీలునామా
    author: అజ్ఞాత రచయిత; పన్నెండు పితరుల వీలునామాలలో భాగం.
    audience: యూదు (ఆ తరువాత క్రైస్తవ) పాఠకులు; ముఖ్యంగా యాజకత్వం పట్ల ఆసక్తిగల సమూహాలు.
    date: యూదు మూలభాగం బహుశా క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదన బహుశా క్రీ.శ. 1–2వ శతాబ్దాలకు చెందినది.
    chapters:
      '1':
        title: తన మరణాన్ని లేవి ప్రవచిస్తాడు
      '2':
        title: పరలోకపు భ్రష్టతను లేవి చూస్తాడు
      '3':
        title: దేవుని ఉగ్రతకు ఆకాశాలు వణుకుతాయి
      '4':
        title: పవిత్ర పరిచర్య కోసం లేవి ఎన్నుకోబడతాడు
      '5':
        title: ప్రతీకారం కోసం దేవదూత లేవికి ఆయుధాలు ఇస్తాడు
      '6':
        title: సంహారంలో చూపిన ఉగ్రతకు లేవి ప్రాయశ్చిత్తం చేస్తాడు
      '7':
        title: లేవి ఖడ్గం వల్ల షెకెము శాపగ్రస్తమవుతుంది
      '8':
        title: దేవదూతలు లేవిని యాజకత్వానికి ప్రతిష్ఠిస్తారు
      '9':
        title: ఇస్సాకు లేవికి ధర్మశాస్త్రాలను బోధిస్తాడు
      '10':
        title: భవిష్యత్తులోని దుష్టత్వం గురించి లేవి హెచ్చరిస్తాడు
      '11':
        title: ప్రవచనార్థంతో లేవి తన కుమారులకు పేర్లు పెడతాడు
      '12':
        title: లేవి తన వంశావళులను నమోదు చేస్తాడు
      '13':
        title: దేవుని ధర్మశాస్త్రానికి భయభక్తులు చూపమని లేవి ఆజ్ఞాపిస్తాడు
      '14':
        title: యాజకులు తమ పిలుపుకు ద్రోహం చేస్తారు
      '15':
        title: తీర్పు వల్ల దేవాలయం శిథిలమవుతుంది
      '16':
        title: తిరుగుబాటు నిండిన డెబ్బై వారాలు
      '17':
        title: అపవిత్రత నిండిన ఏడు జూబిలీలు
      '18':
        title: నిత్య యాజకుడు లోకాన్ని ప్రకాశింపజేస్తాడు
      '19':
        title: కుమారులు దేవుని ధర్మశాస్త్రాన్ని పాటిస్తామని నిశ్చయించుకుంటారు
  Testament of Judah:
    display_name: యూదా వీలునామా
    author: అజ్ఞాత రచయిత; పన్నెండు పితరుల వీలునామాలలో భాగం.
    audience: యూదు (ఆ తరువాత క్రైస్తవ) పాఠకులు.
    date: యూదు మూలభాగం బహుశా క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదన బహుశా క్రీ.శ. 1–2వ శతాబ్దాలకు చెందినది.
    chapters:
      '1':
        title: యూదా తన కుమారులతో చివరి మాటలు పంచుకుంటాడు
      '2':
        title: దేవుడు అనుగ్రహించిన యోధబలాన్ని యూదా చూపిస్తాడు
      '3':
        title: యూదా ఒంటరిగా కనానీయ రాజులను ఓడిస్తాడు
      '4':
        title: యూదాను కాపాడుతున్న దేవదూతను యాకోబు చూస్తాడు
      '5':
        title: యూదా అరేతాను, తప్పూవేను జయిస్తాడు
      '6':
        title: యూదా భీకర యుద్ధంలో గెలుస్తాడు
      '7':
        title: అస్త్రవర్షంలో యూదా దూసుకుపోతాడు
      '8':
        title: యూదా షూవాను పెళ్లి చేసుకొని కుమారులను కంటాడు
      '9':
        title: ఏశావు మహాసైన్యాన్ని యూదా ఓడిస్తాడు
      '10':
        title: దుష్ట కుమారుల వల్ల తామారు బాధపడుతుంది
      '11':
        title: తన భార్య పాపాలను యూదా శపిస్తాడు
      '12':
        title: తామారు యూదాను మోసగించి అతని దండాన్ని తీసుకుంటుంది
      '13':
        title: పాపాల గురించి యూదా తన పిల్లలను హెచ్చరిస్తాడు
      '14':
        title: మద్యపానం, పాపాల గురించి యూదా హెచ్చరిస్తాడు
      '15':
        title: కామపు పట్టు గురించి యూదా హెచ్చరిస్తాడు
      '16':
        title: ద్రాక్షారసం గురించి యూదా హెచ్చరిస్తాడు
      '17':
        title: దురాశ, కామం గురించి యూదా తన కుమారులను హెచ్చరిస్తాడు
      '18':
        title: లైంగిక అనైతికత, దురాశ పట్ల జాగ్రత్తగా ఉండండి
      '19':
        title: దురాశ గురించి యూదా హెచ్చరిస్తాడు
      '20':
        title: మానవ మనస్సాక్షి రెండు ఆత్మల మధ్య చిక్కుకుంటుంది
      '21':
        title: భవిష్యత్తు రాజులను యూదా హెచ్చరిస్తాడు
      '22':
        title: దైవిక తీర్పు అంతర్గత సంఘర్షణను తెస్తుంది
      '23':
        title: భవిష్యత్తులోని దుష్టత్వం గురించి యూదా విలపిస్తాడు
      '24':
        title: ఆత్మ కుమ్మరింపు, దైవిక పాలకుడు
      '25':
        title: నిత్యజీవం కోసం పితరులు పునరుత్థానం చెందుతారు
      '26':
        title: విశ్వాసపాత్రంగా జీవించమని యూదా ఆజ్ఞాపిస్తాడు
  Testament of Issachar:
    display_name: ఇశ్శాఖారు వీలునామా
    author: అజ్ఞాత రచయిత; పన్నెండు పితరుల వీలునామాలలో భాగం.
    audience: యూదు (ఆ తరువాత క్రైస్తవ) పాఠకులు.
    date: యూదు మూలభాగం బహుశా క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదన బహుశా క్రీ.శ. 1–2వ శతాబ్దాలకు చెందినది.
    chapters:
      '1':
        title: ఇశ్శాఖారు తన పిల్లలకు ఉపదేశిస్తాడు
      '2':
        title: భార్యల ఆశీర్వాదాలను దేవదూత వివరిస్తాడు
      '3':
        title: ఇశ్శాఖారు నిర్మలమైన భక్తితో జీవిస్తాడు
      '4':
        title: నిష్కపటత్వం చెడు నుండి కాపాడుతుంది
      '5':
        title: ధర్మశాస్త్రానికి లోబడి సరళ జీవితం గడపండి
      '6':
        title: వంశస్థులు ప్రవాసాన్ని ఎదుర్కొంటారు
      '7':
        title: నీతి గురించి ఇశ్శాఖారు ఆలోచన
  Testament of Zebulun:
    display_name: జెబులూను వీలునామా
    author: రచయిత తెలియదు; ఇది పన్నెండు మంది పితరుల వీలునామాలలో భాగం.
    audience: యూదు పాఠకులు (ఆ తర్వాతి కాలంలో క్రైస్తవ పాఠకులు కూడా).
    date: యూదు మూలభాగం సుమారు క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదక మార్పులు సుమారు క్రీ.శ. 1వ–2వ శతాబ్దాలలో జరిగాయి.
    chapters:
      '1':
        title: దుష్టత్వం గురించి కుమారులను హెచ్చరించిన పితరుడు
      '2':
        title: మౌనంగా దాచిన అపరాధం కోసం జెబులూను విలాపం
      '3':
        title: ప్రార్థించి గుంటకు కాపలా కాసిన జెబులూను
      '4':
        title: కరుణతో గుంటకు కాపలా కాసిన జెబులూను
      '5':
        title: కరుణ జెబులూను కుటుంబాన్ని కాపాడింది
      '6':
        title: పడవను రూపొందించినవాడు సమృద్ధిగా లభించిన పట్టును పంచాడు
      '7':
        title: నిష్కపట హృదయంతో ఉదారంగా ఉండమని జెబులూను ప్రబోధం
      '8':
        title: కరుణను బోధించిన జెబులూను
      '9':
        title: వంశస్థులను హెచ్చరించిన జెబులూను
      '10':
        title: భవిష్యత్తు విమోచనను ప్రవచించిన జెబులూను
  Testament of Dan:
    display_name: దాను వీలునామా
    author: రచయిత తెలియదు; ఇది పన్నెండు మంది పితరుల వీలునామాలలో భాగం.
    audience: యూదు పాఠకులు (ఆ తర్వాతి కాలంలో క్రైస్తవ పాఠకులు కూడా).
