  Ezekiel:
    display_name: యెహెజ్కేలు
    author: బబులోనులో ప్రవాసంలో ఉన్న యాజకుడైన యెహెజ్కేలు; తరువాత కొంత సంపాదకీయ రూపకల్పన కూడా జరిగింది.
    audience: దేవాలయానికి దూరంగా ఉన్నప్పటికీ దేవుని సన్నిధిని కొత్తగా అర్థం చేసుకుంటున్న బబులోనులోని యూదా ప్రవాసులు.
    date: ప్రవక్త పరిచర్య సుమారు క్రీ.పూ. 593–571లో; తుది రూపం కొంతకాలం తర్వాత ఏర్పడింది.
    chapters:
      '1':
        title: యెహెజ్కేలు పరలోక దర్శనం చూస్తాడు
      '2':
        title: యెహెజ్కేలు దేవుని నియామకం పొందుతాడు
      '3':
        title: యెహెజ్కేలు విలాపాల గ్రంథపు చుట్టను తింటాడు
      '4':
        title: యెరూషలేము ముట్టడిని యెహెజ్కేలు అభినయిస్తాడు
      '5':
        title: యెహెజ్కేలు సూచనార్థంగా తన వెంట్రుకలు కత్తిరించుకుంటాడు
      '6':
        title: ఇశ్రాయేలుకు వ్యతిరేకంగా యెహెజ్కేలు ప్రవచిస్తాడు
      '7':
        title: రాబోయే తీర్పును దేవుడు ప్రకటిస్తాడు
      '8':
        title: దేవాలయంలోని హేయకార్యాలను యెహెజ్కేలు చూస్తాడు
      '9':
        title: శిక్ష అమలుచేసేవారు యెరూషలేము పాపానికి తీర్పు తీరుస్తారు
      '10':
        title: మహిమ తీర్పు నిప్పులను వెదజల్లుతుంది
      '11':
        title: నగర నాశనాన్ని యెహెజ్కేలు ప్రవచిస్తాడు
      '12':
        title: ప్రవాసాన్ని యెహెజ్కేలు అభినయిస్తాడు
      '13':
        title: అబద్ధ ప్రవక్తలను యెహెజ్కేలు ఖండిస్తాడు
      '14':
        title: ఇశ్రాయేలు అపనమ్మకత్వానికి దేవుని తీర్పు
      '15':
        title: పనికిరాని ద్రాక్షావల్లితో యెరూషలేముకు పోలిక
      '16':
        title: యెరూషలేము అపనమ్మకత్వాన్ని బట్టి దేవుని విలాపం
      '17':
        title: గద్దల గురించి యెహెజ్కేలు పొడుపుకథ
      '18':
        title: ప్రతి వ్యక్తికి దేవుడు తీర్పు తీరుస్తాడు
      '19':
        title: ఇశ్రాయేలు అధిపతుల పతనం, వైఫల్యం
      '20':
        title: ఇశ్రాయేలు తిరుగుబాటు గతాన్ని దేవుడు వివరిస్తాడు
      '21':
        title: దేశాలపైకి వచ్చే తీర్పు ఖడ్గం
      '22':
        title: రక్తపాత నగరంగా యెరూషలేము బట్టబయలు
      '23':
        title: విగ్రహాలను మోహించిన ఇద్దరు అక్కచెల్లెళ్లు
      '24':
        title: సూచనగా యెహెజ్కేలు భార్య తీసివేయబడుతుంది
      '25':
        title: యూదా చుట్టుపక్కల దేశాలకు తీర్పు
      '26':
        title: సంతోషించిన తూరుకు దేవుని తీర్పు
      '27':
        title: వైభవోపేతమైన తూరు కోసం శోకగీతం
      '28':
        title: తూరు పాలకుడిని యెహెజ్కేలు ఎదుర్కొంటాడు
      '29':
        title: ఫరో గర్వం ఐగుప్తును కూలదోస్తుంది
      '30':
        title: ఫరో తన శక్తిని కోల్పోతాడు
      '31':
        title: అష్షూరు పతనం, ఫరోకు హెచ్చరిక
      '32':
        title: బబులోను చేతిలో ఫరో పతనం
      '33':
        title: యెహెజ్కేలు కాపలాగా ఉండి దుష్టులను హెచ్చరిస్తాడు
      '34':
        title: కాపరుల వైఫల్యం, దేవుడే కాపరిగా ఉంటాడు
      '35':
        title: ఎదోము ద్వేషిస్తుంది, త్వరలో నాశనం వస్తుంది
      '36':
        title: ఇశ్రాయేలు పునరుద్ధరణ, ఫలించే పర్వతాలు
      '37':
        title: ఎండిన ఎముకలకు జీవం, జాతి మళ్లీ ఏకం
      '38':
        title: గోగు ఇశ్రాయేలుపై దాడి, పరిశుద్ధ దేవుని రక్షణ
      '39':
        title: గోగు నాశనం, యెహోవాను తెలుసుకునే దేశాలు
      '40':
        title: ఎత్తైన పర్వతంపై దర్శనం ఆరంభం, కొలతలు
      '41':
        title: దేవాలయం లోపల కొలతలు, పరిశుద్ధ మహిమ
      '42':
        title: యాజకుల గదుల కొలతలు, ప్రత్యేక ఏర్పాటు
      '43':
        title: మహిమ తిరిగివస్తుంది, దేవాలయం పరిశుద్ధతతో నిండుతుంది
      '44':
        title: మూసివున్న ద్వారాన్ని యెహెజ్కేలు చూస్తాడు
      '45':
        title: దేవునికి, ప్రజలకు భూమి
      '46':
        title: క్రమబద్ధమైన ఆరాధన, అధిపతి కూడా ఆరాధిస్తాడు
      '47':
        title: జీవాన్నిచ్చే సజీవ జలప్రవాహం
      '48':
        title: పరిశుద్ధ ప్రాంతం కేంద్రంగా భూమి పంపిణీ
  Daniel:
    display_name: దానియేలు
    author: రచయిత తెలియదు; ఇది తనను ప్రవాసకాలపు దానియేలుగా ప్రదర్శించుకుంటుంది.
    audience: హెల్లెనీయుల హింసను ఎదుర్కొన్న యూదులు—ముఖ్యంగా నాలుగవ అంతియొకస్ ఎపిఫానెస్ కాలంలో (క్రీ.పూ. 167–164).
    date: సుమారు క్రీ.పూ. 165 నాటికి ప్రస్తుతం అందిన రూపాన్ని పొందింది; 1–6 అధ్యాయాల్లో అంతకంటే పాత రాజసభ కథలు చేర్చబడ్డాయి.
    chapters:
      '1':
        title: రాజు ఆహారాన్ని దానియేలు తిరస్కరిస్తాడు
      '2':
        title: దాచబడిన కలను దానియేలు వెల్లడిస్తాడు
      '3':
        title: నెబుకద్నెజరు మిత్రులను విసిరివేస్తాడు
      '4':
        title: నెబుకద్నెజరు వినయం నేర్చుకుంటాడు
      '5':
        title: బెల్షస్సరు పతనమై మరణిస్తాడు
      '6':
        title: సింహాల గుహ నుంచి దానియేలు తప్పించుకుంటాడు
      '7':
        title: సముద్రం నుంచి పైకివచ్చే నాలుగు మృగాలు
      '8':
        title: పొట్టేలు, మేకపోతు దర్శనం
      '9':
        title: యెరూషలేము కోసం దానియేలు ప్రార్థిస్తాడు
      '10':
        title: దూత దానియేలును బలపరుస్తాడు
      '11':
        title: పరస్పర సంఘర్షణలో భవిష్యత్తు సామ్రాజ్యాలు
      '12':
        title: మీకాయేలు దేవుని ప్రజలను కాపాడుతాడు
  Hosea:
    display_name: హోషేయ
    author: బెయేరి కుమారుడైన హోషేయ.
    audience: అష్షూరు జయించడానికి ముందటి చివరి దశాబ్దాల్లో ఉన్న ఉత్తర ఇశ్రాయేలు రాజ్యం.
    date: సుమారు క్రీ.పూ. 750–722.
    chapters:
      '1':
        title: అపనమ్మకమైన గోమెరును హోషేయ వివాహం చేసుకుంటాడు
      '2':
        title: ప్రియుల వెంటపడుతూ దేవుణ్ణి మరచిన ఇశ్రాయేలు
      '3':
        title: అపనమ్మకమైన స్త్రీని హోషేయ మళ్లీ విమోచిస్తాడు
      '4':
        title: ఇశ్రాయేలులో కనుమరుగైన సత్యం, విశ్వసనీయత
      '5':
        title: యాజకులు, ప్రజలు పాపంలోకి నడిపిస్తారు
      '6':
        title: తిరిగివచ్చి నిజమైన ప్రేమను వెదకండి
      '7':
        title: ఇశ్రాయేలు పాపం బట్టబయలు, శిక్ష
      '8':
        title: ఒడంబడికను ఉల్లంఘించినందుకు తీర్పు
      '9':
        title: శిక్షగా ప్రవాసానికి తరిమివేయబడిన ఇశ్రాయేలు
      '10':
        title: వర్ధిల్లి విగ్రహారాధన వైపు మళ్లిన ఇశ్రాయేలు
      '11':
        title: విడిచిపెట్టడానికి నిరాకరించే దేవుడు
      '12':
        title: అబద్ధాలకు, హింసకు తీర్పుతో ప్రతిఫలం
      '13':
        title: ఒకప్పుడు బలంగా ఉన్న ఎఫ్రాయిము ఇప్పుడు పారిపోతోంది
      '14':
        title: ఇశ్రాయేలు పశ్చాత్తాపపడి కరుణ కోరుతుంది
  Joel:
    display_name: యోవేలు
