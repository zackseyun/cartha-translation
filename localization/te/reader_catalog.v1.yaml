    chapters:
      '1':
        title: గతంలోని అసూయను ఒప్పుకున్న దాను
      '2':
        title: కోపం పట్టులో చిక్కుకోవద్దని దాను హెచ్చరిక
      '3':
        title: కళ్లను కప్పే కోపాన్ని జయించే సత్యం
      '4':
        title: ఆత్మను, మనసును వక్రీకరించే కోపం
      '5':
        title: పశ్చాత్తాపం తెచ్చే శాశ్వత శాంతి
      '6':
        title: దేవునికి భయపడండి, సాతాను అబద్ధాలను తిరస్కరించండి
      '7':
        title: పితరులతో విశ్రమించిన దాను ఎముకలు
  Testament of Naphtali:
    display_name: నఫ్తాలి వీలునామా
    author: రచయిత తెలియదు; ఇది పన్నెండు మంది పితరుల వీలునామాలలో భాగం.
    audience: యూదు పాఠకులు (ఆ తర్వాతి కాలంలో క్రైస్తవ పాఠకులు కూడా).
    date: యూదు మూలభాగం సుమారు క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదక మార్పులు సుమారు క్రీ.శ. 1వ–2వ శతాబ్దాలలో జరిగాయి.
    chapters:
      '1':
        title: తన కుమారులను ఆశీర్వదించిన నఫ్తాలి
      '2':
        title: ప్రతి ఆత్మను పరిపూర్ణంగా రూపొందించే దేవుడు
      '3':
        title: దుష్టాత్మల నుంచి హృదయాలను కాపాడుకోండి
      '4':
        title: దేవుని రక్షణతో ముగిసే ప్రవాసం
      '5':
        title: ఉన్నత స్థితికి చేరిన లేవి, యూదా, యోసేపు
      '6':
        title: యాకోబు కుటుంబాన్ని చెదరగొట్టిన తుఫాను
      '7':
        title: చీకటి సత్యాలను దాచిన నఫ్తాలి
      '8':
        title: దేవుణ్ణి ఘనపరచడానికి జ్ఞానాన్ని అన్వేషించండి
      '9':
        title: స్వదేశానికి తిరిగివచ్చిన నఫ్తాలి ఎముకలు
  Testament of Gad:
    display_name: గాదు వీలునామా
    author: రచయిత తెలియదు; ఇది పన్నెండు మంది పితరుల వీలునామాలలో భాగం.
    audience: యూదు పాఠకులు (ఆ తర్వాతి కాలంలో క్రైస్తవ పాఠకులు కూడా).
    date: యూదు మూలభాగం సుమారు క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదక మార్పులు సుమారు క్రీ.శ. 1వ–2వ శతాబ్దాలలో జరిగాయి.
    chapters:
      '1':
        title: ద్వేషం అనే విషం గురించి గాదు హెచ్చరిక
      '2':
        title: యోసేపుకు చేసిన ద్రోహాన్ని ఒప్పుకున్న గాదు
      '3':
        title: ఆత్మను కబళించే ద్వేషానికి దూరంగా ఉండండి
      '4':
        title: జీవాన్ని కాదు, మరణాన్ని తెచ్చే ద్వేషం
      '5':
        title: పశ్చాత్తాపం తెచ్చే దైవిక వెలుగు
      '6':
        title: హృదయపూర్వకంగా క్షమించి శాంతిని పొందండి
      '7':
        title: శత్రువుల క్షేమం కోసం ప్రార్థించండి
      '8':
        title: భవిష్యత్తు కుమారులకు బోధలను అందించండి
  Testament of Asher:
    display_name: ఆషేరు వీలునామా
    author: రచయిత తెలియదు; ఇది పన్నెండు మంది పితరుల వీలునామాలలో భాగం.
    audience: యూదు పాఠకులు (ఆ తర్వాతి కాలంలో క్రైస్తవ పాఠకులు కూడా).
    date: యూదు మూలభాగం సుమారు క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదక మార్పులు సుమారు క్రీ.శ. 1వ–2వ శతాబ్దాలలో జరిగాయి.
    chapters:
      '1':
        title: నీతిగా జీవించమని పిల్లలకు ఆషేరు ఉపదేశం
      '2':
        title: ముసుగు వేసుకున్న దుష్టత్వానికి సంపూర్ణ ఖండన
      '3':
        title: ద్వంద్వ మనస్సుతో జీవించవద్దని ఆషేరు ఆజ్ఞ
      '4':
        title: దుష్టత్వాన్ని ఎదిరించే భక్తులు
      '5':
        title: రెండు విధాల వాస్తవికతను బోధించిన ఆషేరు
      '6':
        title: ఏకైక లక్ష్యంతో ఆజ్ఞలను అనుసరించండి
      '7':
        title: తీర్పు మధ్యలోనూ నిరీక్షణనిచ్చే ప్రవచనం
      '8':
        title: హెబ్రోనులో ప్రశాంతంగా సమాధి చేయబడిన ఆషేరు
  Testament of Joseph:
    display_name: యోసేపు వీలునామా
    author: రచయిత తెలియదు; ఇది పన్నెండు మంది పితరుల వీలునామాలలో భాగం.
    audience: యూదు పాఠకులు (ఆ తర్వాతి కాలంలో క్రైస్తవ పాఠకులు కూడా).
    date: యూదు మూలభాగం సుమారు క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదక మార్పులు సుమారు క్రీ.శ. 1వ–2వ శతాబ్దాలలో జరిగాయి.
    chapters:
      '1':
        title: తన చివరి వచనాలను పంచుకున్న యోసేపు
      '2':
        title: ప్రతిరోజూ శోధనను ఎదిరించిన యోసేపు
      '3':
        title: ఏడు సంవత్సరాల పాటు ప్రార్థించిన యోసేపు
      '4':
        title: అబద్ధ ఆరాధన ఒప్పందాలను తిరస్కరించిన యోసేపు
      '5':
        title: హత్యకు దారితీసే ప్రలోభాన్ని ధిక్కరించిన యోసేపు
      '6':
        title: విషం కలిపిన ఆహారాన్ని తిరస్కరించిన యోసేపు
      '7':
        title: దేవుని దూతపై నమ్మకంతో భోజనం చేసిన యోసేపు
      '8':
        title: స్త్రీ నుంచి వస్త్రం లేకుండా తప్పించుకున్న యోసేపు
      '9':
        title: సంకెళ్లలో కృతజ్ఞతతో పాడిన యోసేపు
      '10':
        title: సహనం, పవిత్రత పాటించమని యోసేపు ప్రబోధం
      '11':
        title: ప్రవాసంలో సోదరులను గౌరవించిన యోసేపు
      '12':
        title: ఈజిప్టులో అనుగ్రహం పొందిన యోసేపు
      '13':
        title: అబద్ధం చెప్పాడనే ఆరోపణలు ఎదుర్కొన్న యోసేపు
      '14':
        title: తన సాక్ష్యాన్ని మార్చడానికి నిరాకరించిన యోసేపు
      '15':
        title: అవమానం నుంచి సోదరులను కాపాడిన యోసేపు
      '16':
        title: మోసం గురించి మౌనంగా ఉన్న యోసేపు
      '17':
        title: ప్రేమించి, తప్పులను కప్పిపుచ్చిన యోసేపు
      '18':
        title: వినయాన్ని, ఆశీర్వాదాన్ని బోధించిన యోసేపు
      '19':
        title: భవిష్యత్తు రాజ్య దర్శనాన్ని వెల్లడించిన యోసేపు
      '20':
        title: తన ఎముకలను తీసుకెళ్లమని యోసేపు ఆజ్ఞ
  Testament of Benjamin:
    display_name: బెన్యామీను వీలునామా
    author: రచయిత తెలియదు; ఇది పన్నెండు మంది పితరుల వీలునామాలలో భాగం.
    audience: యూదు పాఠకులు (ఆ తర్వాతి కాలంలో క్రైస్తవ పాఠకులు కూడా).
    date: యూదు మూలభాగం సుమారు క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదక మార్పులు సుమారు క్రీ.శ. 1వ–2వ శతాబ్దాలలో జరిగాయి.
    chapters:
      '1':
        title: ఇద్దరు కుమారుల కోసం ప్రార్థించిన బెన్యామీను
      '2':
        title: సోదరుని నుంచి ద్రోహాన్ని దాచిన యోసేపు
      '3':
        title: యోసేపు కరుణను అనుసరించమని బెన్యామీను ప్రబోధం
      '4':
        title: మేలుతో కీడును జయించే నీతిమంతులు
      '5':
        title: చీకటిని తరిమివేసే సత్కార్యాలు
      '6':
        title: దూత మార్గదర్శకత్వంలో శాంతి జయిస్తుంది
      '7':
        title: బెలియారు మోసపూరిత క్రియలకు దూరంగా ఉండండి
      '8':
        title: రక్షకుని మహిమను ప్రవచించిన బెన్యామీను
      '9':
        title: దేవాలయ పునరుద్ధరణను ముందుగా తెలిపిన ప్రవక్త
      '10':
        title: తుది పునరుత్థానం కోసం సత్యాన్ని ఆచరించండి
      '11':
        title: నమ్మకమైన సేవకుని ఎదుగుదలను ప్రవచించిన తోడేలు
      '12':
        title: మరణానికి ముందు హెబ్రోనులో సమాధి చేయమని బెన్యామీను ఆజ్ఞ
  Gospel of Philip:
    display_name: ఫిలిప్పు సువార్త
    author: రచయిత తెలియదు. వ్రాతప్రతి చివరి గమనికలో ఈ శీర్షిక కనిపిస్తుంది; అయితే ఫిలిప్పే దీన్ని రాశాడని ఈ రచన చెప్పదు. ప్రస్తుతం లభ్యమవుతున్న ఏకైక ప్రతి నాగ్ హమ్మాది కోడెక్స్ II,3లోని కాప్టిక్ పాఠం.
    audience: వాలెంటీనియన్ ధోరణిలోని సంస్కార బోధతో—ముఖ్యంగా బాప్తిస్మం, అభిషేకం, ప్రభుభోజనం, విమోచనం, పునరుత్థానం, వధూవరుల గది ప్రతీకలతో—పరిచయమున్న తొలి క్రైస్తవ సమాజం.
    date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దం చివరి భాగం లేదా 3వ శతాబ్దం ఆరంభానికి చెందినదిగా తేదీ నిర్ణయిస్తారు; అంతకుముందటి గ్రీకు రూపం నుంచి అనువదించబడిన 4వ శతాబ్దపు కాప్టిక్ వ్రాతప్రతిలో ఇది భద్రపరచబడింది.
    chapters:
      '1':
        title: సంపూర్ణ దైవిక కుటుంబాన్ని తీసుకువచ్చే క్రీస్తు
      '2':
        title: శీతకాల వాగ్దానాన్ని విత్తే విశ్వాసం
      '3':
        title: నిజమైన ఆధ్యాత్మిక వాస్తవాన్ని వెల్లడించే మాటలు
      '4':
        title: ఆధ్యాత్మిక బంధకత్వం నుంచి విమోచించే క్రీస్తు
      '5':
        title: భూసంబంధమైన తండ్రిని వేరుగా చూపిన యేసు
      '6':
        title: మరుగైన దైవిక వాస్తవాన్ని వెల్లడించిన యేసు
      '7':
        title: శరీరసహిత జీవితాన్ని మార్చే పునరుత్థానం
      '8':
        title: తన్నుతాను క్రమంగా వెల్లడించిన యేసు
      '9':
        title: నిలిచే జీవాన్ని విస్తరించే ఆధ్యాత్మిక సంతానం
      '10':
        title: అందరికీ సేవ చేసే ఆధ్యాత్మిక పరిపూర్ణులు
      '11':
        title: అమర జీవంగా మార్చే బాప్తిస్మం
      '12':
        title: పవిత్ర ఐక్యతను పునరుద్ధరించే వివాహ మర్మం
      '13':
        title: ఆధ్యాత్మిక పునర్జన్మను తెచ్చే దైవిక సత్యం
      '14':
        title: ఐక్యతను, జీవాన్ని పునరుద్ధరించే క్రీస్తు
      '15':
        title: ఇప్పుడే నిజమైన జీవానికి మేల్కొలిపే పునరుత్థానం
      '16':
        title: దైవిక కృప ద్వారా పరిపక్వమయ్యే విశ్వాసం
      '17':
        title: యేసు చెడును బయలుపరచి తొలగిస్తాడు
      '18':
        title: పవిత్ర ఐక్యం నిత్య వెలుగును తెస్తుంది
  Gospel of Mary:
    display_name: మరియ సువార్త
    author: రచయిత తెలియదు. ఈ రచనలో మరియను యేసు వెల్లడిని స్వీకరించి దానికి అర్థం చెప్పిన వ్యక్తిగా చిత్రించారు; అయితే ప్రస్తుతం లభ్యమవుతున్న ఈ సువార్తను మరియ రాసిందని ఈ రచన చెప్పదు.
    audience: వెల్లడి, ఆత్మీయ ఆరోహణ, అపొస్తలుల అధికారం, యేసు శిష్యుల మధ్య మరియ బోధకు ఉన్న సముచితత వంటి అంశాలతో తర్జనభర్జన పడుతున్న తొలి క్రైస్తవ పాఠకులు.
    date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దానికి చెందినదిగా తేదీ నిర్ణయిస్తారు; 3వ శతాబ్దానికి చెందిన గ్రీకు శకలాలు మిగిలివున్నాయి. ప్రధాన కాప్టిక్ ప్రతిని 5వ శతాబ్దపు బెర్లిన్ కోడెక్స్ 8502లో భద్రపరిచారు.
    chapters:
      '1':
        title: రక్షకుడు పాపానికి వ్యతిరేకంగా బోధిస్తాడు
      '2':
        title: యేసు శిష్యులకు శాంతిని ఇచ్చి పంపుతాడు
      '3':
        title: మరియ బోధలతో ఓదారుస్తుంది
      '4':
        title: ఆత్మ మతిమరుపును జయిస్తుంది
      '5':
        title: సువార్త ప్రకటించమని లేవి ప్రోత్సహిస్తాడు
  Treatise on the Resurrection:
    display_name: పునరుత్థానంపై ప్రబంధం
    author: రచయిత తెలియదు. రెగినోస్ అనే శిష్యునికి ఒక బోధకుడు రాసిన ఉత్తరంలా ఈ రచన రూపొందించబడింది; ఆ బోధకుడు గానీ రెగినోస్ గానీ ఎవరో నిర్ధారించడం సాధ్యం కాదు.
    audience: పునరుత్థానం గురించి బోధ కోరుతున్న క్రైస్తవులు—ముఖ్యంగా శరీరసంబంధమైన, ఆత్మీయమైన పునరుత్థాన భావనలను, ప్రస్తుతం పునరుత్థాన జీవంలో పాలుపంచుకోవడాన్ని పరిశీలిస్తున్న పాఠకులు.
    date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దం చివరి కాలానికి (తరచూ సుమారు క్రీ.శ. 170–200కు) చెందినదిగా భావిస్తారు; అంతకుముందు గ్రీకులో రాసిన రచనకు 4వ శతాబ్దంలో చేసిన కాప్టిక్ ప్రతిలో ఇది భద్రపరచబడింది.
    chapters:
      '1':
        title: క్రీస్తు నిజమైన పరిపూర్ణతను తెస్తాడు
      '2':
        title: క్రీస్తు మరణపు పట్టును జయిస్తాడు
      '3':
        title: పునరుత్థానం వాస్తవాన్ని మార్చివేస్తుంది
      '4':
        title: విశ్వాసులు క్రీస్తు పునరుత్థానంలో పాలుపంచుకుంటారు
      '5':
        title: క్రీస్తు పునరుత్థానంపై విశ్వాసం
      '6':
        title: రక్షణ జ్ఞానం ఎప్పటికీ నిలుస్తుంది
      '7':
        title: కృప నిత్యజీవాన్ని కాపాడుతుంది
      '8':
        title: పునరుత్థానం నిజమైన జీవాన్ని వెల్లడిస్తుంది
      '9':
        title: పునరుత్థానం క్షయంపై విజయం సాధిస్తుంది
      '10':
        title: పునరుత్థానం కోసం విభేదాన్ని తప్పించుకోండి
      '11':
        title: ఇతరుల మేలు కోసం బోధను పంచుకోండి
  Dialogue of the Savior:
    display_name: రక్షకుని సంభాషణ
    author: రచయిత తెలియదు. యూదా, మత్తయి, మరియలతో సంభాషిస్తున్న యేసు మాటలుగా వెల్లడికి సంబంధించిన బోధను ఈ రచన అందిస్తుంది; అయితే దీనిని సంకలనం చేసినవారు ఎవరో చెప్పదు.
    audience: వ్యక్తిగత వెల్లడి, శిష్యత్వం, ఆత్మజ్ఞానం, ప్రార్థన, రక్షణ కోసం తపోమయమైన సిద్ధపాటు వంటి విషయాలపై ఆసక్తి ఉన్న తొలి క్రైస్తవ సమూహం.
    date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దానికి చెందినదిగా నిర్ణయిస్తారు; అయితే దీని రచనా పొరలు, ఖచ్చితమైన కాలం ఇప్పటికీ వివాదాస్పదమే. ఇది 4వ శతాబ్దపు కాప్టిక్ రాతప్రతిలో భద్రపరచబడింది.
    chapters:
      '1':
        title: యేసు నిజమైన విశ్రాంతిని బోధిస్తాడు
      '2':
        title: దేవుడు నిత్యజీవానికి నడిపిస్తాడు
      '3':
        title: ప్రమాదాన్ని ఆనందంతో దాటండి
      '4':
        title: అంతరంగంలోని ఆత్మను క్రమపరచండి
      '5':
        title: దుఃఖానికి ఆవల ఉన్న సత్యాన్ని వెదకండి
      '6':
        title: అంతరంగ హృదయాన్ని పవిత్రపరచండి
      '7':
        title: పరలోక మంచితనాన్ని ప్రతిబింబించండి
      '8':
        title: దైవిక శక్తి సమస్తాన్ని నిలబెడుతుంది
      '9':
        title: మొదట దైవిక మూలాన్ని తెలుసుకోండి
      '10':
        title: నిత్యుడైన దేవుణ్ణి ఎల్లప్పుడూ చూడండి
      '11':
        title: దైవిక వెలుగును ధరించండి
      '12':
        title: క్రీస్తు ఆత్మీయ సంపదను వెల్లడించండి
      '13':
        title: ప్రేమతో సంఘర్షణను జయించండి
      '14':
        title: నిజమైన ప్రార్థన అతీతంగా ఎగసిపోతుంది
      '15':
        title: అంతరంగ జీవాన్ని జాగ్రత్తగా కాపాడండి
  Exegesis on the Soul:
    display_name: ఆత్మపై వ్యాఖ్యానం
    author: రచయిత తెలియదు. బైబిలు, గ్రీకు సాహిత్యాల్లోని రూపకాలను ఆత్మ పతనం, పశ్చాత్తాపం, పునరుద్ధరణలకు సూచించే ఉపమానకథగా తిరిగి వ్యాఖ్యానించిన ఒక క్రైస్తవ ప్రసంగకర్త ఈ రచయిత.
    audience: లేఖనాలతో, నైతిక ప్రబోధంతో పరిచయం ఉండి, అదుపులేని కోరికలను విడిచి పశ్చాత్తాపపడి దైవంతో తిరిగి ఏకమవ్వాలని పిలుపు పొందుతున్న క్రైస్తవులు.
    date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దం చివరి కాలానికి లేదా 3వ శతాబ్దం ఆరంభానికి చెందినదిగా నిర్ణయిస్తారు; గ్రీకు మూలం నుంచి చేసిన 4వ శతాబ్దపు కాప్టిక్ అనువాదంలో ఇది భద్రపరచబడింది.
    chapters:
      '1':
        title: ఆత్మ పశ్చాత్తాపపడి కరుణను కోరుతుంది
      '2':
        title: ఆత్మ కోరికల ద్వారా దేవునికి ద్రోహం చేస్తుంది
      '3':
        title: దేవుడు బాప్తిస్మం ద్వారా ఆత్మను శుద్ధి చేస్తాడు
      '4':
        title: ఆత్మ దైవిక మూలంతో తిరిగి ఏకమవుతుంది
      '5':
        title: మరుగైన దేవునికి యథార్థంగా ప్రార్థించండి
      '6':
        title: ఆత్మ కోరికను విడిచి ఇంటికి తిరిగివస్తుంది
      '7':
        title: దేవుడు యథార్థమైన విలాపాన్ని వింటాడు
  Book of Thomas the Contender:
    display_name: పోరాడువాడైన తోమా గ్రంథం
    author: రచయిత తెలియదు. రచన చివర ఉన్న శీర్షిక దీనిని యూదా తోమాతో అనుసంధానించి, మత్తయాస్‌ను లిఖించినవాడిగా పేర్కొంటుంది; అయితే ఇవి నిర్ధారించగల రచయితత్వ వాదనలు కాకుండా సాహిత్యపరమైన ఆపాదనలు.
    audience: ఆత్మజ్ఞానాన్ని వెదకాలని, శరీర వాంఛలను ఎదిరించాలని, తోమాకు యేసు వ్యక్తిగతంగా ఇచ్చిన ఉపదేశాన్ని గ్రహించాలని ప్రోత్సహించబడిన తపోమార్గ ప్రవృత్తిగల క్రైస్తవులు.
    date: తరచూ క్రీ.శ. 2వ శతాబ్దం చివరి కాలానికి లేదా 3వ శతాబ్దం ఆరంభానికి చెందినదిగా భావిస్తారు; బహుశా సిరియా క్రైస్తవ నేపథ్యానికి చెందినది కావచ్చు. ఇది 4వ శతాబ్దపు కాప్టిక్ రాతప్రతిలో భద్రపరచబడింది.
    chapters:
      '1':
        title: మత్తయాస్ తోమా బోధలను లిఖిస్తాడు
      '2':
        title: ఆత్మపరిశీలన చేసుకోమని క్రీస్తు ప్రోత్సహిస్తాడు
      '3':
        title: యేసు అదృశ్య సత్యాన్ని బోధిస్తాడు
      '4':
        title: కోరిక పట్టు గురించి రక్షకుడు హెచ్చరిస్తాడు
      '5':
        title: పాపుల గురించి తోమా అడుగుతాడు
      '6':
        title: ఆత్మీయ చీకటి గురించి రక్షకుడు హెచ్చరిస్తాడు
      '7':
        title: జాగరూకులైన పరిశుద్ధులు ధన్యులు
  Tripartite Tractate:
    display_name: త్రిభాగ ప్రబంధం
    author: రచయిత తెలియదు. ఈ రచయిత ఉన్నత విద్యావంతుడైన వాలెంటీనియన్ క్రైస్తవ వేదాంతి; పేరున్న ఏ బోధకుడితోనూ ఇతన్ని నిశ్చయంగా గుర్తించడం సాధ్యం కాదు.
    audience: దేవుడు, యుగతత్త్వాలు, సృష్టి, క్రీస్తు, సంఘం, రక్షణ, అంతిమ పునరుద్ధరణ గురించి విస్తృతమైన బోధ పొందుతున్న వాలెంటీనియన్ క్రైస్తవ సమాజం.
    date: సాధారణంగా క్రీ.శ. 3వ శతాబ్దానికి చెందినదిగా నిర్ణయిస్తారు; కొందరు ఆ శతాబ్దం చివరి సగానికి చెందినదని వాదిస్తారు. ఇది 4వ శతాబ్దపు కాప్టిక్ జంగ్ కోడెక్స్‌లో భద్రపరచబడింది.
    chapters:
      '1':
        title: దేవుడు శ్రమ లేకుండానే సమస్తాన్ని సృష్టిస్తాడు
      '2':
        title: కుమారుడు దేవుని అగ్రాహ్యమైన మహిమను వెల్లడిస్తాడు
      '3':
        title: సమాజం దైవిక నిత్యజీవంలో పాలుపంచుకుంటుంది
      '4':
        title: దేవుడు జీవులను వెలుగులోకి మేల్కొలుపుతాడు
      '5':
        title: దేవుడు పరిపూర్ణ కుమారుని ద్వారా వెల్లడిస్తాడు
      '6':
        title: నిత్య జీవులు దేవుని స్వభావాన్ని ప్రతిబింబిస్తాయి
      '7':
        title: కుమారుడు మరుగైన దేవుణ్ణి వెల్లడిస్తాడు
      '8':
        title: దేవుడు నిత్య జీవులకు శక్తినిస్తాడు
      '9':
        title: దేవుడు అదృశ్య పరిమళం ద్వారా ఆకర్షిస్తాడు
      '10':
        title: దేవుడు సమస్త జీవుల గుండా ప్రవహిస్తాడు
      '11':
        title: పతనమైన జీవి పరిపూర్ణతను వెదకి విఫలమవుతుంది
      '12':
        title: వాక్కు పశ్చాత్తాపపడి ఐక్యతను తెస్తుంది
      '13':
        title: గర్వం ఆత్మల మధ్య సంఘర్షణను కలిగిస్తుంది
      '14':
        title: రక్షకుడు విమోచన ద్వారా సమస్తాన్ని పునరుద్ధరిస్తాడు
      '15':
        title: జ్ఞాన సందేశం జీవిని బలపరుస్తుంది
      '16':
        title: వాక్కు సృష్టి కోసం ప్రార్థిస్తుంది
      '17':
        title: వాక్కు రక్షణ రాజ్యాన్ని స్థాపిస్తుంది
      '18':
        title: వాక్కు తీర్పును, రక్షణను సిద్ధం చేస్తుంది
      '19':
        title: విరోధ వర్గాలకు క్రమబద్ధమైన హోదాలు లభిస్తాయి
      '20':
        title: సర్వోన్నత పాలకుడు దిగువ లోకాలను క్రమపరుస్తాడు
      '21':
        title: మరణశీలత, బాధల ద్వారా మానవాళి నేర్చుకుంటుంది
      '22':
        title: ఆత్మీయ శక్తులు క్రమాన్ని, అక్రమాన్ని కలగలుపుతాయి
      '23':
        title: రక్షకుని గురించి ప్రవక్తల దర్శనాలు
      '24':
        title: రక్షకుడు నిత్య స్వేచ్ఛను తెస్తాడు
      '25':
        title: రక్షకుడు మానవాళిని విభజిస్తాడు
      '26':
        title: క్రీస్తు సృష్టినంతటినీ ఏకం చేస్తాడు
      '27':
        title: దేవుని జ్ఞానం సృష్టిని శాశ్వతంగా పునరుద్ధరిస్తుంది
      '28':
        title: అంతరంగ విశ్వాసం ద్వారా విమోచన
      '29':
        title: సేవకులను క్రీస్తు నడిపిస్తాడు
      '30':
        title: క్రీస్తు వెలుగు నిత్య పునరుద్ధరణను వెల్లడిస్తుంది
  Apocryphon of John:
    display_name: యోహాను రహస్య గ్రంథం
    author: రచయిత తెలియదు. పునరుత్థానుడైన యేసు జెబెదయి కుమారుడైన యోహానుకు ఇచ్చిన వెల్లడిగా ఈ రచన మారుపేరుతో సమర్పించబడింది; ఇది ఒకటికంటే ఎక్కువ ప్రాచీన పాఠరూపాల్లో మిగిలివుంది.
    audience: దైవిక లోకం, సృష్టి, మానవ అస్తిత్వం, విరోధ పాలకుల నుంచి విముక్తి గురించి వివరణ కోరుతున్న సేతీయ లేదా దానికి సన్నిహితమైన వెల్లడి సంప్రదాయంలోని క్రైస్తవులు.
    date: దీని తొలి రూపం బహుశా క్రీ.శ. 2వ శతాబ్దంలో వ్యాప్తిలో ఉండి ఉండవచ్చు; సంక్షిప్త, విస్తృత పాఠరూపాలను భద్రపరిచిన ప్రస్తుతం లభ్యమయ్యే కాప్టిక్ ప్రతులు 4వ, 5వ శతాబ్దాలకు చెందినవి.
    chapters:
      '1':
        title: యోహాను యేసు జ్ఞానాన్ని కోరుతాడు
      '2':
        title: పరలోకం దైవిక రూపాలను వెల్లడిస్తుంది
      '3':
        title: మరుగైన దేవుడే సర్వోన్నత వాస్తవం
      '4':
        title: దైవిక పూర్వాలోచన ప్రకాశవంతంగా వెలుగుతుంది
      '5':
        title: బార్బెలో శక్తులను కోరుతుంది
      '6':
        title: క్రీస్తు దైవ సంకల్పం నుంచి వస్తాడు
      '7':
        title: నిత్యజీవం ఆత్మను స్తుతిస్తుంది
      '8':
        title: ఆదాము మరుగైన దేవుణ్ణి స్తుతించాడు
      '9':
        title: సోఫియా అసంపూర్ణ జీవిని సృష్టిస్తుంది
      '10':
        title: గర్విష్ఠుడైన పాలకుడు లోకాలను రూపొందిస్తాడు
      '11':
        title: అజ్ఞాన పాలకుడు క్రమాన్ని అనుకరిస్తాడు
      '12':
        title: జ్ఞానం చీకటిలో పశ్చాత్తాపపడుతుంది
      '13':
        title: అధికారులు మానవ శరీరాన్ని రూపొందిస్తారు
      '14':
        title: దేవుడు ఆదాములో వెలుగును దాచుతాడు
      '15':
        title: మరచిపోయేలా పాలకులు ఆదామును ప్రలోభపెడతారు
      '16':
        title: దైవిక వెలుగు మానవాళిని మేల్కొలుపుతుంది
      '17':
        title: దైవ సంరక్షణ మనస్సులను మేల్కొలుపుతుంది
      '18':
        title: ఆత్మలు దుష్ట పోరాటాల నుంచి వెనుదిరుగుతాయి
      '19':
        title: కరుణామయ ఆత్మ ప్రజలను మేల్కొలుపుతుంది
      '20':
        title: ఆత్మలను రక్షించడానికి వెలుగు దిగివస్తుంది
      '21':
        title: రక్షకుడు రహస్య జ్ఞానాన్ని అప్పగిస్తాడు
  Hypostasis of the Archons:
    display_name: ఆర్కోన్ల స్వరూపం
    author: రచయిత తెలియదు. ఆర్కోన్లను గురించిన ప్రత్యక్షతా పురాణం ద్వారా రచయిత ఆదికాండాన్ని వ్యాఖ్యానించారు; ఈ రచనను నిర్దిష్టంగా పేరుగల ఏ బోధకునికీ నిశ్చయంగా ఆపాదించలేము.
    audience: అజ్ఞానులైన విశ్వ పాలకులు, దైవిక జ్ఞానం, మానవాళి ఆత్మసంబంధ మూలం మధ్య సంఘర్షణగా ఆదికాండాన్ని చదివిన సెతీయ లేదా దానికి సంబంధించిన వాతావరణంలోని క్రైస్తవులు.
    date: సాధారణంగా క్రీ.శ. 3వ శతాబ్దానికి చెందినదిగా భావిస్తారు; నాగ్ హమ్మాది కోడెక్స్ IIలోని క్రీ.శ. 4వ శతాబ్దపు కాప్టిక్ ప్రతిలో భద్రపరచబడింది.
    chapters:
      '1':
        title: ఆత్మ విశ్వ శక్తులను వెల్లడిస్తుంది
      '2':
        title: స్వరం అంధ పాలకుణ్ణి బహిర్గతం చేస్తుంది
      '3':
        title: దైవిక వెలుగు ఆదాముకు జీవం ఇస్తుంది
      '4':
        title: స్త్రీ పాలకుల హింస నుంచి తప్పించుకుంటుంది
      '5':
        title: సర్పం ఆధ్యాత్మిక సత్యాన్ని బోధిస్తుంది
      '6':
        title: కయీను హేబెలును చంపుతాడు; షేతు అతని స్థానాన్ని భర్తీ చేస్తాడు
      '7':
        title: నోవహు ఓడను నిర్మిస్తాడు; రెండుసార్లు రక్షించబడతాడు
      '8':
        title: నోరియా చీకటి శక్తులను ధైర్యంగా ఎదిరిస్తుంది
      '9':
        title: ఎలెలెత్ నిజమైన మూలాన్ని ధ్రువపరుస్తాడు
      '10':
        title: జ్ఞానపు కుమార్తె పాలకునికి హద్దులు విధిస్తుంది
      '11':
        title: సబావోతు పశ్చాత్తాపపడి జ్ఞానాన్ని స్తుతిస్తాడు
      '12':
        title: ప్రత్యక్షపరచేవాడు నిత్యజీవాన్ని తెస్తాడు
  On the Origin of the World:
    display_name: లోకపు ఆవిర్భావం గురించి
    author: రచయిత తెలియదు. సంకలనకర్త పేరు చెప్పకుండానే ఈ రచన అనేక యూదు, క్రైస్తవ, ప్లేటో తాత్త్విక, పురాణ సంప్రదాయాలను మేళవించి, సవరించింది.
    audience: సృష్టి, విశ్వ పాలకులు, సోఫియా, ఆదాము హవ్వ, లోకపు తుది గమ్యం గురించి ప్రత్యామ్నాయ చరిత్రను తెలుసుకోవాలని కోరిన జ్ఞానవాద ప్రభావంగల క్రైస్తవ వాతావరణంలోని పాఠకులు.
    date: సాధారణంగా క్రీ.శ. 3వ శతాబ్దానికి చెందినదిగా తేదీ నిర్ణయిస్తారు; అయితే దీనికి మరింత పూర్వపు రచనాసామగ్రి ఆధారమై ఉండవచ్చు. ప్రధానంగా క్రీ.శ. 4వ శతాబ్దపు కాప్టిక్ ప్రతుల్లో భద్రపరచబడింది.
    chapters:
      '1':
        title: చీకటి నుంచి అస్తవ్యస్తత పుడుతుంది
      '2':
        title: జ్ఞానం పరలోకపు సరిహద్దును ఏర్పరుస్తుంది
      '3':
        title: పాలకుడు తానే ఏకైక పాలకుడనని పొరబడతాడు
      '4':
        title: ఏడుగురు జీవులు ఆకాశాలను పరిపాలిస్తారు
      '5':
        title: అంధ దేవుడు తాను మాత్రమే ఉన్నానని ప్రకటిస్తాడు
      '6':
        title: సబావోతు తన తల్లిదండ్రుల చీకటిని తిరస్కరిస్తాడు
      '7':
        title: పరలోక పాలకుడు ప్రతిరూపాలను సృష్టిస్తాడు
      '8':
        title: జీవశక్తులు మరణాన్ని జయిస్తాయి
      '9':
        title: మొదటి పాలకుడు దైవిక విశ్వాసాన్ని చూస్తాడు
      '10':
        title: ప్రకాశవంతమైన ఆదాము వెలుగులో ప్రత్యక్షమవుతాడు
      '11':
        title: ఎరోస్ కోరికను, మరణాన్ని మేల్కొలుపుతాడు
      '12':
        title: పవిత్ర వృక్షాలతో పరదైసు సృష్టించబడుతుంది
      '13':
        title: దైవిక రక్తం పూలను పుట్టిస్తుంది
      '14':
        title: జ్ఞానం ఖగోళ పిండాలను క్రమపరుస్తుంది
      '15':
        title: బోధకుడు విశ్వపు అజ్ఞానాన్ని బహిర్గతం చేస్తాడు
      '16':
        title: హవ్వ భర్త లేకుండానే బిడ్డను కంటుంది
      '17':
        title: విశ్వ పాలకులు ఆదామును రూపొందిస్తారు
      '18':
        title: హవ్వ ఆదామును జీవానికి మేల్కొలుపుతుంది
      '19':
        title: హవ్వ ప్రకాశవంతమైన శక్తికి పాలకులు భయపడతారు
      '20':
        title: విశ్వ పాలకుల ద్వారా హవ్వ గర్భం ధరిస్తుంది
      '21':
        title: హవ్వ ఫలం తిని జ్ఞానం పొందుతుంది
      '22':
        title: ఆదాము పాలక శక్తులను ధిక్కరిస్తాడు
      '23':
        title: జ్ఞానం పాలకులను పరలోకం నుంచి పడదోస్తుంది
      '24':
        title: దయ్యాల సేవకులు మానవాళిని జ్వలింపజేస్తూ నడిపిస్తారు
      '25':
        title: మరుగైన దేవుడు ధన్య ఆత్మలను పంపుతాడు
      '26':
        title: పరమ వాక్కు మరుగైన సత్యాలను వెల్లడిస్తుంది
      '27':
        title: ఉగ్రత అస్తవ్యస్తతను దహిస్తుంది; అంతం వస్తుంది
  Sophia of Jesus Christ:
    display_name: యేసు క్రీస్తు జ్ఞానం
    author: రచయిత తెలియదు. యూగ్నోస్టోస్ రచనలో కూడా కనిపించే విషయాలను, పునరుత్థానం తరువాత యేసుకు ఆయన శిష్యులకు మధ్య జరిగిన సంభాషణగా రచయిత మలిచారు.
    audience: అతీతుడైన దేవుడు, పరలోక వ్యవస్థ, ఆత్మ మూలం మరియు రక్షణ గురించిన ప్రత్యక్ష జ్ఞానంపై ఆసక్తిగల క్రైస్తవులు.
    date: తరచుగా క్రీ.శ. 2వ శతాబ్దపు చివరి కాలానికి లేదా 3వ శతాబ్దానికి చెందినదిగా తేదీ నిర్ణయిస్తారు; నాగ్ హమ్మాది మరియు బెర్లిన్ కోడెక్స్‌లలోని కాప్టిక్ ప్రతుల్లో భద్రపరచబడింది.
    chapters:
      '1':
        title: యేసు శిష్యులకు సత్యాన్ని వెల్లడిస్తాడు
      '2':
        title: దేవుని నిత్య మర్మం వివరించబడుతుంది
      '3':
        title: మరుగైన దేవుని మంచితనం నుంచి సృష్టి పుడుతుంది
      '4':
        title: కనిపించే లోకం విశ్వాసానికి నడిపిస్తుంది
      '5':
        title: ప్రకాశవంతమైన మానవుడు దేవునిచే వెల్లడవుతాడు
      '6':
        title: క్రీస్తు అధికారంతో దేవదూతలను సృష్టిస్తాడు
      '7':
        title: రక్షకుడు అంతరంగంలోని దైవిక వెలుగును మేల్కొలుపుతాడు
      '8':
        title: పరలోక రాజ్యాలు సామరస్యపూర్వక ఐక్యతలో ఉంటాయి
      '9':
        title: దైవిక జ్ఞానం, నిజమైన ఎరుక
      '10':
        title: నిత్య దేవుని పరిపూర్ణ చిత్తాన్ని వెల్లడించండి
  Gospel of the Egyptians:
    display_name: ఐగుప్తీయుల సువార్త
    author: రచయిత తెలియదు. ‘మహా అదృశ్య ఆత్మ పవిత్ర గ్రంథం’ అని కూడా పిలిచే ఈ నాగ్ హమ్మాది రచన, ఉల్లేఖనాల ద్వారా మాత్రమే తెలిసిన అంతకుముందటి గ్రీకు ‘ఐగుప్తీయుల సువార్త’కు భిన్నమైనది.
    audience: తమ ఆధ్యాత్మిక గుర్తింపును, విమోచనను వ్యక్తం చేయడానికి గాఢమైన పురాణకథను, పవిత్ర నామాలను, బాప్తిస్మ సంబంధ ప్రతీకలను, స్తుతిగీతాలను ఉపయోగించిన సెతీయ క్రైస్తవ సమాజం.
    date: సాధారణంగా క్రీ.శ. 2వ లేదా 3వ శతాబ్దానికి చెందినదిగా భావిస్తారు; క్రీ.శ. 4వ శతాబ్దపు నాగ్ హమ్మాది కోడెక్స్‌లలో రెండు కాప్టిక్ ప్రతులు మిగిలి ఉన్నాయి.
    chapters:
      '1':
        title: దేవుడు నిత్య దైవిక వెలుగును వెల్లడిస్తాడు
      '2':
        title: నిశ్శబ్దం నుంచి మూడు శక్తులు విస్తరిస్తాయి
      '3':
        title: పవిత్ర నిశ్శబ్దం నుంచి తండ్రి ఆవిర్భవిస్తాడు
      '4':
        title: పరలోక జీవులు ఆత్మను స్తుతిస్తాయి
      '5':
        title: అదామాస్ సమస్త సృష్టిని ఉనికిలోకి తెస్తాడు
      '6':
        title: క్రీస్తు అమరులైన ప్రజలను స్థాపిస్తాడు
      '7':
        title: దైవిక శక్తులు ఐక్యతలో ఆనందిస్తాయి
      '8':
        title: క్రీస్తు సంపూర్ణ మహిమా వైభవాన్ని వెల్లడిస్తాడు
      '9':
        title: షేతు తన ఆధ్యాత్మిక సంతతి కోసం ప్రార్థిస్తాడు
      '10':
        title: దైవిక జ్ఞానం నుంచి సోఫియా ఆవిర్భవిస్తుంది
      '11':
        title: పరలోక సందేశకులు వంశాన్ని కాపాడతారు
      '12':
        title: షేతు క్రీస్తు ద్వారా రక్షణను సిద్ధం చేస్తాడు
      '13':
        title: వక్త నిత్య అదృశ్య దేవుణ్ణి ప్రార్థిస్తాడు
      '14':
        title: షేతు రహస్య గ్రంథాన్ని రాశాడు
  Letter of Peter to Philip:
    display_name: ఫిలిప్పుకు పేతురు రాసిన పత్రిక
    author: రచయిత తెలియదు. సంక్షిప్తమైన ప్రారంభ పత్రిక, ఆ తరువాతి ప్రత్యక్షత పేతురు మరియు ఫిలిప్పులకు మారుపేరుగా ఆపాదించబడ్డాయి; వాటిని ఈ ఇద్దరు అపొస్తలులలో ఎవరైనా నిశ్చయంగా రచించారని చెప్పలేము.
    audience: రక్షకుడు, శత్రు శక్తులు, శ్రమ, పరిచర్య, శిష్యుల పునరుద్ధరణ గురించిన బోధకు అపొస్తలుల అధికార మద్దతు కోరిన క్రైస్తవులు.
    date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దపు చివరి కాలానికి లేదా 3వ శతాబ్దపు ఆరంభానికి చెందినదిగా తేదీ నిర్ణయిస్తారు; క్రీ.శ. 4వ శతాబ్దపు నాగ్ హమ్మాది ప్రతిలోను, ఆ తరువాతి కాలానికి చెందిన ఒక కాప్టిక్ ప్రతిలోను భద్రపరచబడింది.
    chapters:
      '1':
        title: తిరిగి రమ్మని పేతురు ఫిలిప్పును కోరుతాడు
      '2':
        title: అపొస్తలులు ఒలీవ కొండపై ప్రార్థిస్తారు
      '3':
        title: యేసు దైవిక సంపూర్ణతను వివరిస్తాడు
      '4':
        title: పాలకుడు నిజమైన దేవుని ప్రణాళికను వ్యతిరేకిస్తాడు
      '5':
        title: క్రీస్తు విశ్వాసం ద్వారా తప్పిపోయినవారిని రక్షిస్తాడు
      '6':
        title: యేసు నిత్య బలాన్ని వాగ్దానం చేస్తాడు
      '7':
        title: హింస ఎదురైనా అపొస్తలులు ప్రకటిస్తారు
      '8':
        title: పేతురు పవిత్ర వారసత్వాన్ని ప్రకటిస్తాడు
  Gospel of Judas:
    display_name: యూదా సువార్త
    author: రచయిత తెలియదు. శీర్షిక ఈ కథనాన్ని యూదాకు ఆపాదిస్తుంది; అయితే ఇస్కరియోతు యూదానే దీని చారిత్రక రచయిత అని ఈ రచన నిర్ధారించదు.
    audience: ప్రత్యర్థుల బలి, సంఘ సంబంధ ఆచారాలను విమర్శిస్తూ, ప్రత్యక్షతా సంభాషణను, సెతీయ తరహా విశ్వవర్ణనను ఉపయోగించి యూదాను, యేసు మరణాన్ని కొత్తగా వ్యాఖ్యానించిన ఒక క్రైస్తవ సమూహం.
    date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దపు మధ్య లేదా చివరి కాలానికి చెందినదిగా తేదీ నిర్ణయిస్తారు; సుమారు క్రీ.శ. 180 నాటికి ఇరేనియస్‌కు ‘యూదా సువార్త’ ఒకటి తెలుసు. ప్రస్తుతం మిగిలి ఉన్న కాప్టిక్ ప్రతి బహుశా క్రీ.శ. 3వ లేదా 4వ శతాబ్దానికి చెందినది.
    chapters:
      '1':
        title: యేసు యూదాకు మర్మాలను వెల్లడిస్తాడు
      '2':
        title: యూదా ఒక్కడే యేసు దగ్గరకు వస్తాడు
      '3':
        title: యేసు పవిత్ర సమాజాన్ని వర్ణిస్తాడు
      '4':
        title: శిష్యుల దర్శనం అవినీతిని బహిర్గతం చేస్తుంది
      '5':
        title: యూదా శపించబడినా ప్రత్యేకంగా నిలుస్తాడు
      '6':
        title: యేసు దైవిక రాజ్యాలను వెల్లడిస్తాడు
      '7':
        title: యూదా యేసు దేహాన్ని అప్పగిస్తాడు
  Protoevangelium of James:
    display_name: యాకోబు ప్రథమ సువార్త
    author: రచయిత తెలియదు. కథకుడు తాను యాకోబునని చెప్పుకున్నా, ఇది మరొకరి పేరుతో రాసిన రచన; యేసు సహోదరుడైన యాకోబు దీనిని రాయలేదు.
    audience: మరియ జననం, పెంపకం, ఆమె నిరంతర పవిత్రత, యేసు జననం, మత్తయి మరియు లూకా సమాధానం చెప్పకుండా వదిలిన ప్రశ్నలకు కథారూప జవాబులపై ఆసక్తిగల క్రైస్తవులు.
    date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దపు ద్వితీయార్థానికి చెందినదిగా తేదీ నిర్ణయిస్తారు; ఆ తరువాతి కాలానికి చెందిన అనేక గ్రీకు రాతప్రతుల్లోను, ప్రాచీన అనువాదాల్లోను ఇది మిగిలి ఉంది.
    chapters:
      '1':
        title: యోవాకీము అరణ్యంలో ప్రార్థిస్తాడు
      '2':
        title: అన్నా సుగంధపత్ర వృక్షం కింద ప్రార్థిస్తుంది
      '3':
        title: అన్నా తనకు పిల్లలు లేరని విలపిస్తుంది
      '4':
        title: అన్నా ప్రార్థిస్తుంది; దేవదూత జవాబిస్తాడు
      '5':
        title: యోవాకీము తనలో పాపమేదీ లేదని గ్రహిస్తాడు
      '6':
        title: యోవాకీము మరియను బలంగా ఇంటికి స్వాగతిస్తాడు
      '7':
        title: ప్రియమైన కుమార్తె ఇశ్రాయేలు ఎదుట నాట్యం చేస్తుంది
      '8':
        title: మరియ దేవాలయంలోనే ఉంటుంది
      '9':
        title: కన్య కోసం యోసేపు ఎంపికవుతాడు
      '10':
        title: మరియ ఎర్రని దారాన్ని వడుకుతుంది
      '11':
        title: మరియ పవిత్ర కార్యాన్ని దేవదూత ప్రకటించడం
      '12':
        title: మరియ ఎలీసబెతును దర్శించి తిరిగి రావడం
      '13':
        title: గర్భవతియైన మరియను చూసి యోసేపు దుఃఖించడం
      '14':
        title: యోసేపు కలలో దేవదూత మాట్లాడడం
      '15':
        title: యోసేపు తప్పు చేశాడని యాజకుడు నిందించడం
      '16':
        title: పరీక్ష తరువాత యోసేపు మరియను నిర్దోషిగా విడిచిపెట్టడం
      '17':
        title: మరియ బేత్లెహేముకు ప్రయాణించడం
      '18':
        title: స్తంభించిపోయిన లోకాన్ని యోసేపు చూడడం
      '19':
        title: కన్య ప్రసవాన్ని మంత్రసాని చూడడం
      '20':
        title: మరియను పరీక్షించిన సలోమే చేయి కాలిపోవడం
      '21':
        title: కొత్తగా పుట్టిన రాజును జ్ఞానులు వెదకడం
      '22':
        title: శిశువులను చంపమని హేరోదు ఆజ్ఞాపించడం
      '23':
        title: హేరోదు బెదిరింపును జెకర్యా ఎదుర్కోవడం
      '24':
        title: పరిశుద్ధ స్థలంలో జెకర్యా హత్య
      '25':
        title: కల్లోల సమయంలో యాకోబు వృత్తాంతం రాయడం
      '26':
        title: బోడ్మర్ పపైరస్‌లో సంక్షిప్త పాఠరూపం
      '27':
        title: బేత్లెహేములో మంత్రసానిని యోసేపు వెదకడం
      '28':
        title: మరియకు జరిగిన అద్భుతాన్ని యోసేపు వివరించడం
      '29':
        title: శిశువును తాకి సలోమే స్వస్థత పొందడం
      '30':
        title: యూదుల రాజును జ్ఞానులు వెదకడం
  Infancy Gospel of Thomas:
    display_name: తోమా బాల్య సువార్త
    author: రచయిత తెలియదు. తిరిగి గుర్తించగలిగిన దాని అత్యంత ప్రాచీన రూపంలో రచయిత పేరు లేదు; తోమాకు ఆపాదించడం తరువాతి కాలపు వ్రాతప్రతుల శీర్షికలు, ప్రసార పరంపరకు చెందినది.
    audience: ప్రామాణిక సువార్తల కథనాలు మొదలయ్యే ముందు యేసు బాల్యం గురించి, దైవిక శక్తి, క్రమశిక్షణ, అభ్యాసం, పరిపక్వతలను ఎలా వర్ణించవచ్చో తెలుసుకోవాలనుకున్న క్రైస్తవులు.
    date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దానికి చెందినదిగా భావిస్తారు; అయితే ఈ పాఠం గణనీయంగా భిన్నమైన అనేక గ్రీకు పాఠరూపాల్లో, ప్రాచీన అనువాదాల్లో లభిస్తోంది.
    chapters:
      '1':
        title: యేసు గురించి తోమా చెప్పడం
      '2':
        title: యేసు నీటిని శుభ్రం చేసి పక్షుల బొమ్మలు చేయడం
      '3':
        title: అన్న కుమారుణ్ణి యేసు శపించడం
      '4':
        title: యేసు శపించడంతో బాలుడు చనిపోవడం
      '5':
        title: యోసేపుకు యేసు జ్ఞానం బోధించడం
      '6':
        title: యేసు జ్ఞానాన్ని ఎదుర్కోలేక గురువు తడబడడం
      '7':
        title: యేసు జ్ఞానం శ్రేష్ఠమైనదని గురువు ఒప్పుకోవడం
      '8':
        title: యేసు నవ్వుతూ స్వస్థపరచి ప్రకటించడం
      '9':
        title: కిందపడిన జీనోను యేసు బ్రతికించడం
      '10':
        title: కట్టెలు కొట్టేవాని పాదాన్ని యేసు స్వస్థపరచడం
      '11':
        title: పగిలిన కుండను యేసు అద్భుతంగా నింపడం
      '12':
        title: యేసు విత్తిన విత్తనపు పంటను యోసేపు కోయడం
      '13':
        title: యేసు సహాయంతో యోసేపు మంచాన్ని పూర్తి చేయడం
      '14':
        title: యేసును సవాలు చేసిన గురువు చనిపోవడం
      '15':
        title: యేసు మాటలకు గురువు సంతోషించడం
      '16':
        title: పాము కాటుకు గురైన యాకోబును యేసు స్వస్థపరచడం
      '17':
        title: శిశువు యోసేపును యేసు స్వస్థపరచడం
      '18':
        title: ఆ ప్రదేశంలో ఒక మనిషిని యేసు బ్రతికించడం
      '19':
        title: పన్నెండేళ్ల యేసు దేవాలయంలో బోధించడం
  Acts of Paul and Thecla:
    display_name: పౌలు, తెక్లా కార్యాలు
    author: రచయిత తెలియదు. ఇది విస్తృతమైన పౌలు కార్యాలు అనే రచనలోని ఒక ఘట్టం; ఒక ప్రెస్బిటర్ ఆ కార్యాలను రచించాడనే ప్రాచీన నివేదిక ఆధారంగా రచయితను నిశ్చయంగా గుర్తించలేం.
    audience: అపొస్తలుల బోధ, బ్రహ్మచర్యం, బాప్తిస్మం, హతసాక్షిని పోలిన సహనం, బోధించడానికీ సాక్ష్యమివ్వడానికీ ఒక స్త్రీకి ఉన్న అధికారం వంటి అంశాల కథలపట్ల ఆసక్తి ఉన్న క్రైస్తవులు.
    date: క్రీ.శ. 2వ శతాబ్దంలో, బహుశా దాని ద్వితీయార్ధంలో రచించబడింది; ఇది పౌలు కార్యాలు రచనలో భాగంగానూ, స్వతంత్ర రచనగానూ వ్యాప్తిలో ఉండేది.
    chapters:
      '1':
        title: ఒనేసిఫొరు ఇంట్లో పౌలు బోధించడం
      '2':
        title: తెక్లా వింటూ పౌలును చూడాలని తపించడం
      '3':
        title: అధిపతి ఎదుట పౌలుపై తమీరిస్ నేరం మోపడం
      '4':
        title: తెక్లా చెరసాలకు వెళ్లి పౌలును ప్రోత్సహించడం
      '5':
        title: తెక్లా సజీవ దహనం నుంచి తప్పించుకోవడం
      '6':
        title: పౌలు తెక్లాతో కలిసి ఉపవాసం ఉండి ప్రార్థించడం
      '7':
        title: పౌలు తెక్లాను అంతియొకయకు పంపడం
      '8':
        title: క్రూరమృగాల నుంచి తెక్లాను త్రిఫినా కాపాడడం
      '9':
        title: కొలనులో తెక్లా తనకు తానే బాప్తిస్మం తీసుకోవడం
      '10':
        title: సెలూకియలో స్త్రీలకు తెక్లా బోధించడం
      '11':
        title: పరలోక స్వరం తెక్లాను కాపాడడం
  Gospel of Peter:
    display_name: పేతురు సువార్త
    author: రచయిత తెలియదు. లభ్యమైన కథనం పేతురు స్వరంలో మాట్లాడుతుంది, ఆయన పేరుతోనే ప్రసారమైంది; అయితే ఇది చారిత్రక అపొస్తలుడైన పేతురు రచనగా పరిగణించబడదు.
    audience: విస్తరించిన యేసు శ్రమలు, పునరుత్థాన కథనంపై ఆసక్తి ఉన్న తొలి క్రైస్తవులు; బహుశా పేతురు అధికారానికి ప్రత్యేక ప్రాధాన్యం ఉన్న సమాజాల్లోని వారు.
    date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దానికి చెందినదిగా నిర్ధారిస్తారు; ప్రధానంగా లభించిన గ్రీకు శకలం ఎంతో తరువాతి కాలపు వ్రాతప్రతికి చెందినది, అది అఖ్మీమ్‌లో కనుగొనబడింది.
    chapters:
      '1':
        title: ప్రభువును విచారించమని హేరోదు ఆజ్ఞాపించడం
      '2':
        title: ప్రభువు దేహాన్ని యోసేపు సమాధి చేయడం
      '3':
        title: దేవుని కుమారుణ్ణి జనసమూహం అపహసించడం
      '4':
        title: దోషి యేసు గౌరవాన్ని కాపాడడం
      '5':
        title: మధ్యాహ్నం యూదయను చీకటి కమ్మడం
      '6':
        title: యోసేపు సమాధిలో యేసును ఉంచడం
      '7':
        title: జరిగిన అన్యాయానికి ప్రజలు దుఃఖించడం
      '8':
        title: యేసు సమాధికి పెద్దలు కాపలా పెట్టడం
      '9':
        title: తెల్లవారుజామున పరలోక స్వరం వినిపించడం
      '10':
        title: సమాధి నుంచి ముగ్గురు మనుషులు బయటకు రావడం
      '11':
        title: సైనికులు పిలాతుకు నివేదించడం
      '12':
        title: మగ్దలేనే మరియ సమాధిని వెదకడం
      '13':
        title: దేవదూత వార్త విని స్త్రీలు పారిపోవడం
      '14':
        title: పండుగ తరువాత శిష్యులు విలపించడం
  2 Clement:
    display_name: 2 క్లెమెంట్
    author: రచయిత తెలియదు. సంప్రదాయ శీర్షిక అలా ఉన్నప్పటికీ, ఇది రోమా క్లెమెంట్ రాసిన రెండవ పత్రిక కాదు; తొలి క్రైస్తవ ఉపదేశ ప్రసంగం.
    audience: పశ్చాత్తాపం, నైతిక స్థిరత్వం, బలహీనుల పట్ల శ్రద్ధ, పునరుత్థానం మరియు తీర్పుపై నిరీక్షణతో విశ్వాసపూర్వకంగా సహించడం కోసం ప్రోత్సహించబడిన ఒక క్రైస్తవ సంఘం.
    date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దపు ప్రథమార్ధం లేదా మధ్యకాలానికి (సుమారు క్రీ.శ. 100–160) చెందినదిగా నిర్ధారిస్తారు; ఇది ఎక్కడ రచించబడిందో తెలియదు.
    chapters:
      '1':
        title: మన న్యాయాధిపతి యేసు క్రీస్తు
      '2':
        title: విశ్వాసంతో నిండిన సంఘం
      '3':
        title: క్రీస్తు మనపై కరుణ చూపడం
      '4':
        title: చర్యల్లో నిజమైన విశ్వాస ప్రకటన
      '5':
        title: దేవుని కోసం నిర్భయంగా జీవించడం
      '6':
        title: సంపదకు బదులు దేవుణ్ణి ఎంచుకోవడం
      '7':
        title: పోటీలో పూర్ణహృదయంతో పాల్గొనడం
      '8':
        title: జీవించి ఉండగానే పశ్చాత్తాపపడడం
      '9':
        title: శరీరాన్ని దేవాలయంలా కాపాడుకోవడం
      '10':
        title: సద్గుణాన్ని, సమాధానాన్ని అనుసరించడం
      '11':
        title: పవిత్ర హృదయంతో దేవుణ్ణి సేవించడం
      '12':
        title: ప్రేమ, నీతి ఎదురుచూస్తున్నాయి
      '13':
        title: పశ్చాత్తాపపడి మంచితనాన్ని అనుసరించడం
      '14':
        title: సజీవ సంఘానికి చెందినవారిగా ఉండడం
      '15':
        title: ఆత్మనిగ్రహాన్ని శ్రద్ధగా పాటించడం
      '16':
        title: సమయం ఉండగానే పశ్చాత్తాపపడడం
      '17':
        title: బలహీనులు మంచితనం వైపు సాగేందుకు సహాయపడడం
      '18':
        title: నీతి కోసం శ్రమించడం
      '19':
        title: ఇప్పుడే పూర్ణహృదయంతో పశ్చాత్తాపపడడం
      '20':
        title: బాధల్లో దేవుని శిక్షణను నమ్మడం
  Epistle of Barnabas:
    display_name: బర్నబా పత్రిక
    author: రచయిత తెలియదు. ఈ రచనను సంప్రదాయంగా పౌలు సహచరుడైన బర్నబాతో అనుసంధానించారు; అయితే ఆధునిక పండితులు ఆ ఆపాదనను అంగీకరించరు.
    audience: ఇశ్రాయేలు లేఖనాలను క్రీస్తు-కేంద్రితంగానూ రూపకాలంకార పద్ధతిలోనూ వ్యాఖ్యానించి తమవిగా స్వీకరించాలనీ, తమ నిబంధన సంబంధిత గుర్తింపును యూదుల ఆచారాలనుంచి వేరు చేసుకోవాలనీ బోధించబడుతున్న యూదేతర క్రైస్తవులు.
    date: సాధారణంగా క్రీ.శ. 70లో యెరూషలేము దేవాలయం నాశనమైన కాలానికి, 2వ శతాబ్దపు తొలినాళ్లకు మధ్యన—తరచుగా సుమారు క్రీ.శ. 80–130 మధ్యన—రచించబడిందని నిర్ధారిస్తారు.
    chapters:
      '1':
        title: ప్రియమైన సమాజాన్ని నింపే దేవుని కృప
      '2':
        title: విశ్వాసులు దేవుని నిజమైన ఆజ్ఞను వెదకడం
      '3':
        title: ఉపవాసమంటే కరుణ, న్యాయం
      '4':
        title: జాగరూకులైన క్రైస్తవులు శ్రమల కోసం ఎదురుచూడడం
      '5':
        title: పాపుల కోసం యేసు బాధపడడం
      '6':
        title: వాగ్దానం చేసిన రాజ్యాన్ని యేసు నెరవేర్చడం
      '7':
        title: యేసు గాయాల కోసం దేవునికి కృతజ్ఞతలు చెప్పడం
      '8':
        title: ఆవుదూడ బలి యేసును ముందుగా సూచించడం
      '9':
        title: హృదయ సున్నతి విశ్వాసాన్ని సూచించడం
      '10':
        title: ఆహార నియమాలు ఆధ్యాత్మిక పాఠాలు నేర్పడం
      '11':
        title: బాప్తిస్మం, సిలువ క్షమాపణను తీసుకురావడం
      '12':
        title: మోషే చేతులు యేసును సూచిస్తాయి
      '13':
        title: యాకోబు ఆశీర్వాదం తారుమారును ముందే తెలియజేస్తుంది
      '14':
        title: యేసు హృదయాలను దేవుని కోసం విమోచిస్తాడు
      '15':
        title: న్యాయం తర్వాత విశ్రాంతిదిన విశ్రాంతి వస్తుంది
      '16':
        title: నిజమైన ఆలయం విశ్వాసులలోనే ఉంది
      '17':
        title: రక్షణ ఇప్పుడు స్పష్టంగా వివరించబడింది
      '18':
        title: వెలుగు దూతలు, చీకటి పాలకుడు
      '19':
        title: వెలుగు మార్గం అంకితభావాన్ని ఆదేశిస్తుంది
      '20':
        title: చీకటి మార్గం నిత్యనాశనానికి నడిపిస్తుంది
      '21':
        title: మహిమ కోసం ప్రభువు ఆజ్ఞలకు లోబడండి
  Letters of Ignatius:
    display_name: ఇగ్నాటియస్ పత్రాలు
    author: సాధారణంగా అంగీకరించబడిన మధ్యస్థ పాఠరూపంలోని ఏడు పత్రాలకు అంతియొకయ బిషప్ ఇగ్నాటియస్ రచయిత; తరువాత విస్తరించబడిన పత్రాలు, ఇగ్నాటియస్ పేరుతో ఇతరులు రాసిన పత్రాలు ఈ సంకలనంలో లేవు.
    audience: ఇగ్నాటియస్ హతసాక్ష్యం వైపు ప్రయాణిస్తున్న సమయంలో సంబోధించిన ఎఫెసు, మగ్నేసియా, త్రల్లేసు, రోము, ఫిలదెల్ఫియా, స్ముర్నలోని క్రైస్తవ సంఘాలు, అలాగే పోలికార్పు.
    date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దపు ఆరంభానికి, తరచుగా సుమారు క్రీ.శ. 105–117కు చెందినవిగా తేదీ నిర్ణయిస్తారు; అయితే ఇగ్నాటియస్ ప్రయాణపు ఖచ్చితమైన కాలక్రమం ఇప్పటికీ చర్చనీయాంశమే.
    chapters:
      '1':
        title: ఇగ్నాటియస్ ఎఫెసు సంఘానికి శుభాకాంక్షలు చెబుతాడు
      '2':
        title: విశ్వాసులు ఖైదీ ఇగ్నాటియస్‌కు తోడ్పడతారు
      '3':
        title: ఐక్యతతో, ప్రార్థనతో బిషప్‌ను గౌరవించండి
      '4':
        title: ఇగ్నాటియస్ వినయంగా మాట్లాడతాడు
      '5':
        title: యేసుపట్ల ప్రేమ ద్వారా ఐక్యత
      '6':
        title: బిషప్ విశ్వాసులను ప్రార్థనలో ఏకం చేస్తాడు
      '7':
        title: మౌనంగా చక్కగా నడిపించే బిషప్‌ను గౌరవించండి
      '8':
        title: అబద్ధ బోధకుల ప్రభావం పట్ల జాగ్రత్తపడండి
      '9':
        title: ఎఫెసీయుల అంకితభావం, ఇగ్నాటియస్
      '10':
        title: దుష్ట బోధను తిరస్కరించి స్థిరంగా నిలవండి
      '11':
        title: ప్రజలందరి కోసం నిరంతరం ప్రార్థించండి
      '12':
        title: అన్ని బంధాలకంటే క్రీస్తే ఉన్నతుడు
      '13':
        title: శిక్ష విధించబడినవాడిగా ఇగ్నాటియస్ రాస్తాడు
      '14':
        title: శాంతి సాతాను శక్తినీ పన్నాగాలనూ భగ్నం చేస్తుంది
      '15':
        title: విశ్వాసం మంచితనానికీ ప్రేమకూ నడిపిస్తుంది
      '16':
        title: మౌనం ద్వారా సత్యాన్ని జీవించడం
      '17':
        title: కుటుంబాలను నాశనం చేసేవారు వారసత్వం పొందరు
      '18':
        title: దేవుని గురించిన జ్ఞానాన్ని వివేకంతో స్వీకరించండి
      '19':
        title: సిలువ కోసం తన్ను తాను ఏమీలేనివాడిగా ఎంచుకోవడం
      '20':
        title: మరియ, నక్షత్రం, క్రీస్తు కూలదోసివేత
      '21':
        title: మళ్లీ రాయాలని ఇగ్నాటియస్ ఆశిస్తాడు
      '22':
        title: పాఠకుల కోసం ఇగ్నాటియస్ ప్రార్థిస్తాడు
      '23':
        title: మగ్నేసియా సంఘం కృపచేత ఆశీర్వదించబడింది
      '24':
        title: ఐక్యత కోసం ఇగ్నాటియస్ ప్రార్థిస్తాడు
      '25':
        title: బిషప్ కోసం ఇగ్నాటియస్ దేవునికి కృతజ్ఞత చెబుతాడు
      '26':
        title: మీ యువ బిషప్‌ను గౌరవించండి
      '27':
        title: నిజమైన క్రైస్తవులుగా జీవించండి
      '28':
        title: విశ్వాసం నిత్యమైన ముద్రను ఎంచుకుంటుంది
      '29':
        title: ఇగ్నాటియస్ సంఘ ఐక్యతను ఆలింగనం చేసుకుంటాడు
      '30':
        title: విశ్వాసులు బిషప్ ఆధ్వర్యంలో సమకూడతారు
      '31':
        title: యేసు కృప ద్వారా బయలుపరచబడ్డాడు
      '32':
        title: లేచిన క్రీస్తులో నిరీక్షణ నిలిచి ఉంటుంది
      '33':
        title: పాత పులిసిన పిండిని తొలగించండి
      '34':
        title: క్రీస్తు పునాదిపై స్థిరంగా నిలవండి
      '35':
        title: వినయం విశ్వాసంలో ఆనందాన్ని తెస్తుంది
      '36':
        title: విశ్వాసంలో బిషప్‌తో ఏకమవండి
      '37':
        title: ప్రార్థనలు సంఘానికి సేదదీర్పు తెస్తాయి
      '38':
        title: దైవిక సామరస్యంతో సంఘాలకు అభివందనాలు తెలపండి
      '39':
        title: యేసు అనుభవించిన శ్రమ ద్వారా శాంతి
      '40':
        title: మనస్సులోనూ సహనంలోనూ నిర్దోషులుగా ఉండండి
      '41':
        title: విశ్వాసులు బిషప్‌కూ క్రీస్తుకూ లోబడతారు
      '42':
        title: నాయకులను యేసు క్రీస్తును గౌరవించినట్లు గౌరవించండి
      '43':
        title: గర్వం కంటే సాత్వికతను కోరుకోండి
      '44':
        title: పరలోక జ్ఞానానికి ఇగ్నాటియస్ భయపడ్డాడు
      '45':
        title: విశ్వాసాన్ని పోషించండి, మతవిరుద్ధ బోధలను కాదు
      '46':
        title: సంఘ నాయకత్వానికి నమ్మకంగా ఉండండి
      '47':
        title: సాత్వికతను ఆయుధంగా ధరించండి
      '48':
        title: క్రీస్తు మాత్రమే నిజమైన జీవాన్ని ఇస్తాడు
      '49':
        title: నిజమైన శ్రమ క్రీస్తు వాస్తవికతను నిరూపిస్తుంది
      '50':
        title: అబద్ధ బోధకుల ప్రాణాంతక ఫలానికి దూరంగా ఉండండి
      '51':
        title: ప్రార్థనలోనూ అంకితభావంలోనూ ఏకమవండి
      '52':
        title: ప్రేమతో బిషప్‌కు లోబడండి
      '53':
        title: రోములోని నమ్మకమైన సంఘానికి శుభాకాంక్షలు
      '54':
        title: నా ప్రయాణ ముగింపు కోసం ప్రార్థించండి
      '55':
        title: మనుషుల ఆమోదాన్ని కాదు, దేవుని ఆమోదాన్ని కోరండి
      '56':
        title: అంతరంగ బలం కోసం ప్రార్థించండి
      '57':
        title: దేవుని కోసం ఇష్టపూర్వకంగా మరణాన్ని ఎదుర్కోండి
      '58':
        title: ఇగ్నాటియస్ శ్రమను స్వాగతిస్తాడు
      '59':
        title: క్రీస్తు కోసం లోకసంబంధ కోరికలను సిలువ వేయండి
      '60':
        title: ఇగ్నాటియస్ లోకసంబంధ కోరికలను తిరస్కరిస్తాడు
      '61':
        title: విశ్వాసపూర్వకంగా శ్రమించాలని ఇగ్నాటియస్ కోరుకుంటాడు
      '62':
        title: కాపరిత్వం పొందుతున్న సిరియా సంఘం కోసం ప్రార్థించండి
      '63':
        title: స్ముర్న నుండి సిరియాకు శుభాకాంక్షలు
      '64':
        title: ఐక్యతకు ఫిలదెల్ఫియా ప్రశంసించబడింది
      '65':
        title: బిషప్ సద్గుణంతో దేవునికి సేవ చేస్తాడు
      '66':
        title: మీ కాపరిని నమ్మకంగా అనుసరించండి
      '67':
        title: హానికరమైన బోధలను తిరస్కరించండి
      '68':
        title: అందరూ కలిసి ఒకే ప్రభుభోజనంలో పాలుపంచుకోండి
      '69':
        title: యేసు క్రీస్తు కోసం వేసిన సంకెళ్లలో ఆనందించండి
      '70':
        title: యూదాయిజాన్ని తిరస్కరించి క్రీస్తును స్వీకరించండి
      '71':
        title: ఆత్మ మరుగైన సత్యాలను బయలుపరుస్తాడు
      '72':
        title: ఐక్యత వర్గవాదాన్ని తిరస్కరిస్తుంది
      '73':
        title: క్రీస్తు అందరినీ దేవునిలో ఏకం చేస్తాడు
      '74':
        title: అంతియొకయ సంఘానికి శాంతి వస్తుంది
      '75':
        title: ఫిలో, రయుస్ విశ్వసనీయంగా గౌరవించబడ్డారు
      '76':
        title: స్ముర్న సంఘం సమృద్ధిగా ఆశీర్వదించబడింది
      '77':
        title: యేసు క్రీస్తు నిజమైన అవతరణ
      '78':
        title: క్రీస్తు శ్రమ నిజంగా వాస్తవమైనది
      '79':
        title: లేచిన యేసు శరీరంతోనే ఉన్నాడు
      '80':
        title: పశ్చాత్తాపపడమని క్రూరమృగాలకు హెచ్చరిక
      '81':
        title: క్రీస్తును నిరాకరించడం పునరుత్థానాన్ని నిరాకరించడమే
      '82':
        title: ప్రభుభోజనం క్రీస్తు మాంసము
      '83':
        title: అబద్ధ బోధకుల బోధలకు దూరంగా ఉండండి
      '84':
        title: క్రీస్తును అనుసరించినట్లు బిషప్‌ను అనుసరించండి
      '85':
        title: మేల్కొని పశ్చాత్తాపపడండి
      '86':
        title: క్రీస్తు సేవకులను స్వాగతించండి
      '87':
        title: అంతియొకయకు శాంతి దూతను పంపండి
      '88':
        title: ఖైదీ ఇగ్నాటియస్‌ను బుర్రుస్ ప్రోత్సహిస్తాడు
      '89':
        title: ఇగ్నాటియస్ విశ్వాసులను పేరుపేరునా పలకరిస్తాడు
      '90':
        title: బిషప్పు పోలికార్పుకు ఇగ్నాతియుసు పత్రిక
      '91':
        title: పరిచర్యలో స్థిరంగా ఉండమని ఇగ్నాతియుసు ప్రోత్సహిస్తాడు
      '92':
        title: జ్ఞానంతో హానిని సరిచేయండి
      '93':
        title: దాగలిలా దృఢంగా నిలబడండి
      '94':
        title: దేవుని సమ్మతితో విధవరాళ్లను కాపాడండి
      '95':
        title: చెడు ఆచారాలను విడిచి, వివేకంతో వివాహం చేసుకోండి
      '96':
        title: విధేయులై సేవచేసి, కలిసి పైకి ఎదగండి
      '97':
        title: పోలికార్పు సిరియాకు దూతను పంపుతాడు
      '98':
        title: గౌరవప్రదమైన కార్యాల కోసం దూతలను ఏర్పాటు చేయండి
  Polycarp to the Philippians:
    display_name: ఫిలిప్పీయులకు పోలికార్పు రాసిన పత్రిక
    author: స్ముర్నా బిషప్పు పోలికార్పు. మనకు అందిన పాఠం ఒకటి కంటే ఎక్కువ సందర్భాల్లో పంపిన విషయాలను కలిపి రూపొందిందని కొందరు పండితులు భావిస్తున్నారు.
    audience: ఇగ్నాతియుసు పత్రికలను కోరిన, విశ్వాసం, ప్రవర్తన, నాయకత్వం, ధనం, పట్టుదల గురించి ఉపదేశం పొందిన ఫిలిప్పీలోని క్రైస్తవ సంఘం.
    date: క్రీ.శ. 2వ శతాబ్దపు ఆరంభం నుంచి మధ్యకాలం వరకు; ఇందులో కనీసం కొంత భాగం ఇగ్నాతియుసు ప్రయాణంతో సన్నిహితంగా ముడిపడి ఉంది. ఇది పలు భాగాలతో కూడిన పత్రిక అనే ప్రతిపాదనల ప్రకారం, ఒక భాగం కొంత తరువాతి కాలానికి చెందినదై ఉండవచ్చు.
    chapters:
      '1':
        title: ఫిలిప్పీయులకు పోలికార్పు శుభాకాంక్షలు
      '2':
        title: పాపుల కోసం క్రీస్తు బాధ అనుభవించాడు
      '3':
        title: భక్తితో, సత్యంతో దేవుణ్ణి సేవించండి
      '4':
        title: నీతి గురించి పోలికార్పు రాస్తాడు
      '5':
        title: విధవరాళ్లు నిరంతరం సత్యంగా ప్రార్థించాలి
      '6':
        title: పరిచారకులు ఇప్పుడు నిందారహితంగా క్రీస్తును సేవించాలి
      '7':
        title: పెద్దలు అందరిపట్ల కనికరం చూపాలి
      '8':
        title: క్రీస్తువిరోధిని, తప్పుడు బోధలను తిరస్కరించండి
      '9':
        title: నిరీక్షణను గట్టిగా పట్టుకొని క్రీస్తును అనుసరించండి
      '10':
        title: విశ్వాసులైన పరిశుద్ధుల ఆదర్శాలను అనుసరించండి
      '11':
        title: స్థిరంగా నిలిచి, ప్రేమను అనుసరించండి
      '12':
        title: దురాశను, విగ్రహారాధనను ఇప్పుడే తిరస్కరించండి
      '13':
        title: ఫిలిప్పీయుల విశ్వాసం కోసం పోలికార్పు ప్రార్థిస్తాడు
      '14':
        title: సిరియాకు పత్రికలు పంపారు; జవాబు కోసం ఎదురుచూస్తున్నారు
      '15':
        title: క్రెస్కెన్సు నిందారహితంగా పత్రికను అందజేస్తాడు
  Martyrdom of Polycarp:
    display_name: పోలికార్పు హతసాక్ష్యం
    author: స్ముర్నాలోని సంఘానికి చెందిన పేరు తెలియని సభ్యులు, ఆ సమాజం తరఫున రాశారు; చివర ఉన్న పాఠప్రసార గమనికలు తరువాతి ప్రతుల తయారీని, వ్యాప్తిని ప్రతిబింబిస్తాయి.
    audience: ఫిలోమెలియంలోని సంఘానికి, విస్తృత క్రైస్తవ సహవాసానికి—పోలికార్పు అరెస్టు, విచారణ, మరణం, ఆదర్శప్రాయమైన సహనం గురించిన వృత్తాంతంగా అందించబడింది.
    date: పోలికార్పు మరణం తరువాత రచించబడింది; సాధారణంగా క్రీ.శ. 2వ శతాబ్దపు మధ్యకాలానికి లేదా చివరి కాలానికి చెందినదిగా భావిస్తారు. అయితే హతసాక్ష్యం జరిగిన ఖచ్చితమైన సంవత్సరం, ఈ పత్రం తుది రూపం—రెండూ చర్చనీయాంశాలే.
    chapters:
      '1':
        title: సంఘం అందరికీ కరుణను కోరుతుంది
      '2':
        title: పోలికార్పు హతసాక్ష్యం స్థిరపరచబడింది
      '3':
        title: హతసాక్షులు క్రీస్తు కోసం సహిస్తారు
      '4':
        title: జెర్మానికుసు క్రూరమృగాలను ఎదుర్కొంటాడు
      '5':
        title: క్వింటుసు ధైర్యం కోల్పోతాడు
      '6':
        title: పోలికార్పు అందరి కోసం ప్రార్థిస్తాడు
      '7':
        title: తన ఇంటివారిచేతే అప్పగించబడ్డాడు
      '8':
        title: పోలికార్పు తనకు రానున్నదాన్ని స్వాగతిస్తాడు
      '9':
        title: క్రీస్తును నిరాకరించమని హేరోదు పోలికార్పును ఒత్తిడి చేస్తాడు
      '10':
        title: పరలోక స్వరం పోలికార్పును బలపరుస్తుంది
      '11':
        title: క్రీస్తును నిందించడానికి పోలికార్పు నిరాకరిస్తాడు
      '12':
        title: మరణ బెదిరింపులను పోలికార్పు లెక్కచేయడు
      '13':
        title: పోలికార్పును కాల్చివేయాలని జనసమూహం కోరుతుంది
      '14':
        title: స్తంభానికి కట్టబడిన పోలికార్పు ప్రార్థిస్తాడు
      '15':
        title: దహనస్తంభం వద్ద పోలికార్పు ప్రార్థిస్తాడు
      '16':
        title: మంటలు పోలికార్పు చుట్టూ వలయంగా ఏర్పడతాయి
      '17':
        title: పోలికార్పు రక్తం మంటను ఆర్పుతుంది
      '18':
        title: న్యాయాధికారి నిరాకరించమని నికేతేసు కోరుతాడు
      '19':
        title: క్రైస్తవులు పోలికార్పు ఎముకలను సేకరిస్తారు
      '20':
        title: పోలికార్పు పాలకుణ్ణి జయించి కిరీటం పొందుతాడు
      '21':
        title: మార్కియానుసు విశ్వాసులకు సంక్షిప్త వృత్తాంతాన్ని పంపుతాడు
      '22':
        title: విశ్రాంతిదినాన పోలికార్పు హతసాక్షి అవుతాడు
      '23':
        title: పోలికార్పును అనుసరించి రాజ్యంలో ప్రవేశించండి
  Epistle to Diognetus:
    display_name: దియోగ్నేతుసుకు పత్రిక
    author: రచయిత పేరు తెలియదు. రచయిత తనను తాను శిష్యుడు లేదా నేర్చుకునేవాడిగా పేర్కొంటాడు; అయితే అతణ్ణి గానీ, పత్రిక అందుకున్న దియోగ్నేతుసును గానీ నిశ్చయంగా గుర్తించలేం.
    audience: క్రైస్తవ ఆరాధన, నైతిక జీవితం, సమాజంలో వారి గుర్తింపు, ప్రేమ, ఈ విశ్వాసం కొత్తగా కనిపించడానికి కారణం గురించి ప్రశ్నించిన విద్యావంతుడైన క్రైస్తవేతర అన్వేషకునికి—అతనిలాంటి పాఠకులకు.
    date: తరచుగా క్రీ.శ. 2వ శతాబ్దపు చివరి కాలానికి లేదా 3వ శతాబ్దపు ఆరంభానికి చెందినదిగా తేదీ నిర్ణయిస్తారు; అయితే ప్రతిపాదనలు చాలా భిన్నంగా ఉన్నాయి. చివరి రెండు అధ్యాయాలు వేరొక రచన నుంచి వచ్చి ఉండవచ్చు.
    chapters:
      '1':
        title: దియోగ్నేతుసు విశ్వాసాన్ని అర్థం చేసుకోవాలని కోరుకుంటాడు
      '2':
        title: మనుషుల చేతులతో రూపొందిన విగ్రహాలు
      '3':
        title: క్రైస్తవులు అసత్య ఆరాధనను తిరస్కరిస్తారు
      '4':
        title: దేవుని మంచి వరాలను తిరస్కరించడం
      '5':
