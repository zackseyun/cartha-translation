      '6':
        title: ఓటమి తరువాత అంతియోకు మరణిస్తాడు
      '7':
        title: నికానోరు సైన్యాన్ని యూదా ఓడిస్తాడు
      '8':
        title: రోమీయులతో స్నేహం కోసం యూదా ప్రయత్నిస్తాడు
      '9':
