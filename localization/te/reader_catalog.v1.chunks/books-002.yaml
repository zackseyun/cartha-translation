contract_version: 1
locale: te
source_catalog_sha256: ec74c36516f84fea14e3d62329a38731b464f113276935cab09aa146bdd1e82b
source_chunk_sha256: 0bc82160fe4b26d6ee0a5b96562c849858053fc71029bc43b5be6444adba796d
chunk_id: books-002
status: reviewed
payload:
  book_metadata:
    Numbers:
      display_name: సంఖ్యాకాండము
      author: రచయిత తెలియదు; సంప్రదాయం ప్రకారం మోషేకు ఆపాదించబడింది.
      audience: ఈజిప్టు నుండి వాగ్దాన దేశానికి ప్రయాణిస్తున్న ఇశ్రాయేలు ప్రజలు—అరణ్య తరం, అలాగే వారి వైఫల్యాల నుండి నేర్చుకున్న తరువాతి కాలపు పాఠకులు.
      date: రాజ్యపాలన చివరి కాలం నుండి చెర అనంతర కాలం వరకు ఏర్పడిన రచనా పొరలు (సుమారు క్రీ.పూ. 7వ–5వ శతాబ్దాలు).
    Deuteronomy:
      display_name: ద్వితీయోపదేశకాండము
      author: రచయిత తెలియదు; మోషే వీడ్కోలు ప్రసంగాలుగా సమర్పించబడింది. ఆధునిక పరిశోధకులు దీని మూలభాగాన్ని క్రీ.పూ. 7వ శతాబ్దం చివరలో యోషీయా చేపట్టిన సంస్కరణల కాలానికి చెందినదిగా భావిస్తారు.
      audience: దేశంలో ప్రవేశించడానికి సిద్ధమవుతున్న ఇశ్రాయేలు ప్రజలు—అలాగే ఆలయం గానీ రాజు గానీ లేకుండా నమ్మకంగా ఎలా జీవించాలని ప్రశ్నించిన తరువాతి కాలపు చెరలోని ప్రజలు.
      date: మూలభాగం సుమారు క్రీ.పూ. 7వ శతాబ్దం చివరిది; చెర కాలంలో తుది రూపం పొందింది.
    Joshua:
      display_name: యెహోషువ
      author: రచయిత తెలియదు; ద్వితీయోపదేశకాండ సంబంధిత చరిత్రలో ఒక భాగం.
      audience: రాజ్యపాలన కాలంలోనూ చెర కాలంలోనూ ఉన్న ఇశ్రాయేలు ప్రజలు—దేశాన్ని స్వాధీనం చేసుకోవడం, నిబంధన, దేశం యొక్క అర్థం గురించి ఆలోచించేవారు.
      date: పూర్వ సంప్రదాయాల ఆధారంగా సుమారు క్రీ.పూ. 7వ–6వ శతాబ్దాల్లో సంకలనం చేయబడింది.
  chapter_titles:
    Leviticus:
      '8':
        title: యాజకునిగా అహరోను ప్రతిష్ఠ
      '9':
        title: అర్పణను దహించిన అగ్ని
      '10':
        title: నాదాబు, అబీహులకు శిక్ష
      '11':
        title: శుద్ధమైన, అశుద్ధమైన ఆహారాల నియమాలు
      '12':
        title: ప్రసవం తర్వాత స్త్రీ శుద్ధీకరణ
      '13':
        title: చర్మవ్యాధులను పరిశీలించే యాజకులు
      '14':
        title: బలుల ద్వారా శుద్ధి పొంది పునరుద్ధరణ
      '15':
        title: శరీర స్రావాల వల్ల కలిగే అశుద్ధత
      '16':
        title: అన్ని పాపాలకు ప్రాయశ్చిత్తం
      '17':
        title: ప్రత్యక్ష గుడారపు ద్వారం దగ్గరకు బలులు తేవడం
      '18':
        title: నైతిక పవిత్రతను ఆజ్ఞాపించిన ప్రభువు
      '19':
        title: పవిత్రతకు పిలువబడిన ఇశ్రాయేలు
      '20':
        title: తీవ్రమైన పాపాలకు కఠిన తీర్పులు
      '21':
        title: యాజకులు ప్రత్యేక పవిత్రతను కాపాడాలి
      '22':
        title: పవిత్ర అర్పణలను జాగ్రత్తగా చూడాలి
      '23':
        title: ఆరాధనకు నియమించిన సమయాలు
      '24':
        title: దీపాలు వెలగడం, రొట్టెలు అర్పించడం
      '25':
        title: ప్రతి ఏడవ సంవత్సరం భూమికి విశ్రాంతి
      '26':
        title: నిబంధన మార్గం విషయంలో ఇశ్రాయేలు ఎంపిక
      '27':
        title: మొక్కుబడులు, ప్రతిష్ఠిత అర్పణల విషయంలో నమ్మకంగా ఉండాలి
    Numbers:
      '1':
        title: ఇశ్రాయేలు పురుషులను లెక్కించిన మోషే
      '2':
        title: మందిర గుడారం చుట్టూ సమకూడిన గోత్రాలు
      '3':
        title: దేవుని పవిత్ర నివాసంలో సేవచేసే లేవీయులు
      '4':
        title: పవిత్ర వస్తువుల సంరక్షణలో కహాతీయులు
      '5':
        title: రహస్య పాపానికి దేవుని తీర్పు
      '6':
        title: నాజీర వ్రతం, ఆశీర్వాదం
      '7':
        title: పవిత్రస్థలం కోసం నాయకుల కానుకలు
      '8':
        title: దేవుని సేవకై లేవీయుల శుద్ధీకరణ
      '9':
        title: పస్కాను ఆచరించమని ప్రభువు ఆజ్ఞ
      '10':
        title: దేవుని ఆజ్ఞలను సూచించే వెండి బూరలు
      '11':
        title: దురాశ వల్ల వచ్చిన తెగులు
      '12':
        title: మోషే అధికారానికి వ్యతిరేకంగా మాట్లాడిన మిర్యాము
      '13':
        title: వాగ్దాన దేశాన్ని పరిశీలించిన పన్నెండు మంది
      '14':
        title: సందేహించినందుకు ఇశ్రాయేలుకు శిక్ష
      '15':
        title: అర్పణలు, కుచ్చుల గురించిన సూచనలు
      '16':
        title: కోరహు తిరుగుబాటు; వారిని మింగిన భూమి
      '17':
        title: యాజక వంశాన్ని నిరూపించిన అహరోను కర్ర
      '18':
        title: యాజకుల పర్యవేక్షణలో సేవచేసే లేవీయులు
      '19':
        title: శుద్ధిచేసే ఎర్ర ఆవు నియమం
      '20':
        title: కాదేషులో మోషే ఎదుర్కొన్న సంకటాలు
      '21':
        title: కనానీయ రాజును ఓడించిన ఇశ్రాయేలు
      '22':
        title: ఇశ్రాయేలును శపించడానికి నిరాకరించిన బిలాము
      '23':
        title: ఇశ్రాయేలును పదేపదే ఆశీర్వదించిన బిలాము
      '24':
        title: ఇశ్రాయేలు భవిష్య మహిమను ప్రకటించిన బిలాము
      '25':
        title: జిమ్రీని చంపిన ఫీనెహాసు
      '26':
        title: కొత్త యోధులను లెక్కించిన మోషే
      '27':
        title: తండ్రి వారసత్వాన్ని కోరిన కుమార్తెలు
      '28':
        title: ఇశ్రాయేలు క్రమంగా అర్పించే బలులు
      '29':
        title: నెలలో ఇశ్రాయేలు అర్పించే బలులు
      '30':
        title: మొక్కుబడుల గురించి మాట్లాడిన మోషే
      '31':
        title: మిద్యానుపై ప్రతీకారం తీర్చుకోమని మోషే ఆజ్ఞ
      '32':
        title: తూర్పు భూమిని కోరిన రూబేను, గాదు గోత్రాలు
      '33':
        title: ఈజిప్టు నుండి ఇశ్రాయేలు ప్రయాణ వివరాలు
      '34':
        title: కనాను సరిహద్దులను నిర్ణయించిన ప్రభువు
      '35':
        title: ఆశ్రయం, రక్షణ ఇచ్చే పట్టణాలు
      '36':
        title: తమ వంశంలోనే వివాహం చేసుకున్న సెలోపెహాదు కుమార్తెలు
    Deuteronomy:
      '1':
        title: దేవుని నమ్మకత్వాన్ని వివరించిన మోషే
      '2':
        title: ఎదోము, మోయాబులను తప్పించుకొని వెళ్లిన ఇశ్రాయేలు
      '3':
        title: ఓగు రాజును ఓడించిన ఇశ్రాయేలు
      '4':
        title: జ్ఞానంతో విధేయత చూపమని మోషే ప్రబోధం
      '5':
        title: పది ఆజ్ఞలను మళ్లీ తెలిపిన మోషే
      '6':
        title: దేవుణ్ణి ప్రేమించమని ఇశ్రాయేలుకు మోషే ఆజ్ఞ
      '7':
        title: విగ్రహాలను నాశనం చేయాల్సిన ఇశ్రాయేలు
      '8':
        title: కష్టకాలంలో దేవుని సంరక్షణను జ్ఞాపకం చేసుకోండి
      '9':
        title: ఇశ్రాయేలు కోసం వేడుకున్న మోషే
      '10':
        title: దేవుడు కోరేవాటిని తెలిపిన మోషే
      '11':
        title: ప్రేమించమని ఇశ్రాయేలుకు మోషే ఆజ్ఞ
      '12':
        title: ఎంచుకున్న స్థలంలోనే ఆరాధన
      '13':
        title: అబద్ధ ప్రవక్తలను, విగ్రహాలను తిరస్కరించండి
      '14':
        title: దేవుని ప్రజలుగా భిన్నంగా జీవించండి
      '15':
        title: ప్రతి ఏడవ సంవత్సరం అప్పుల రద్దు
      '16':
        title: ఉదారతతో పండుగలను జరుపుకోండి
      '17':
        title: విగ్రహారాధనకు తీర్పు; ధర్మశాస్త్రాన్ని అనుసరించడం
      '18':
        title: యాజకులను, లేవీయులను నమ్మకంగా పోషించండి
      '19':
        title: అనుకోకుండా చంపినవారికి ఆశ్రయమిచ్చే పట్టణాలు
      '20':
        title: యుద్ధంలో ప్రభువును నమ్మండి
      '21':
        title: హత్యకు గురైనవారి విషయంలో న్యాయంగా వ్యవహరించండి
      '22':
        title: పవిత్రతను, గౌరవాన్ని కాపాడండి
      '23':
        title: ద్వితీయోపదేశకాండములో పవిత్రతకు సంబంధించిన ఆజ్ఞలు
      '24':
        title: న్యాయాన్ని, మానవ గౌరవాన్ని కాపాడండి
      '25':
        title: దోషిని అవమానించకుండా శిక్షించండి
      '26':
        title: ప్రథమ ఫలాల గురించి ప్రభువు ఎదుట ఒప్పుకోలు
      '27':
        title: రాతి బలిపీఠాన్ని నిర్మించమని మోషే ఆజ్ఞ
      '28':
        title: విధేయత తెచ్చే ఆశీర్వాదం
      '29':
        title: రాబోయే తరాలతో కలిసి నిబంధనలో ప్రవేశం
      '30':
        title: జీవాన్ని ఎంచుకోమని ఇశ్రాయేలుకు మోషే ప్రబోధం
      '31':
        title: మోషే రాసి యెహోషువను విడిచిపెడతాడు
      '32':
        title: వారికి వ్యతిరేక సాక్ష్యంగా పాడిన మోషే
      '33':
        title: ప్రతి గోత్రాన్ని ఆశీర్వదించిన మోషే
      '34':
        title: దేశాన్ని చూసి మరణించిన మోషే
    Joshua:
      '1':
        title: నాయకత్వం వహించమని యెహోషువకు దేవుని ఆజ్ఞ
      '2':
        title: ఇశ్రాయేలు గూఢచారులను దాచిన రాహాబు
      '3':
        title: పొడి నేలపై యొర్దాను దాటిన ఇశ్రాయేలు
      '4':
        title: దాటిన సంఘటనకు గుర్తుగా పన్నెండు రాళ్లు
      '5':
        title: ప్రభువు సైన్యాధిపతిని కలిసిన యెహోషువ
      '6':
        title: నమ్మకమైన ప్రదక్షిణతో కూలిన యెరికో
      '7':
        title: ఆకాను పాపం వల్ల ఇశ్రాయేలుకు ఓటమి
