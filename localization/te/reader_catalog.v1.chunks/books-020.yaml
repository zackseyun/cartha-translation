payload:
  book_metadata:
    Psalms of Solomon:
      display_name: సొలొమోను కీర్తనలు
      author: రచయిత తెలియదు; సొలొమోను పేరుతో ఆపాదించబడింది.
      audience: క్రీ.పూ. 63లో పాంపేయి చేసిన ఆక్రమణకు స్పందించిన యెరూషలేములోని భక్తిశ్రద్ధగల యూదులు.
      date: సుమారు క్రీ.పూ. 1వ శతాబ్దం మధ్యకాలం.
    Shepherd of Hermas:
      display_name: హెర్మాసు కాపరి
      author: రోములో నివసించిన క్రైస్తవుడైన హెర్మాసు.
      audience: రోములోని క్రైస్తవ సంఘం—పశ్చాత్తాపం గురించి నైతిక, అంత్యకాల ప్రవచనం.
      date: సుమారు క్రీ.శ. 2వ శతాబ్దం ఆరంభం నుంచి మధ్యకాలం వరకు.
  chapter_titles:
    Jubilees:
      '17':
        title: అబ్రాహాము విశ్వాసం రుజువైంది
      '18':
        title: సీయోనులో పరీక్షించబడిన అబ్రాహాము విధేయత
      '19':
        title: అబ్రాహాము మరణం, యాకోబుకు ఆశీర్వాదం
      '20':
        title: పవిత్రతను ఆజ్ఞాపించిన అబ్రాహాము
      '21':
        title: యాకోబు నీతిని ఆశీర్వదించిన అబ్రాహాము
      '22':
        title: వారాల పండుగ ఏర్పాటు
      '23':
        title: ఏశావు కోపం నుంచి పారిపోయిన యాకోబు
      '24':
        title: లాబాను వద్ద మోసపూరితంగా సేవచేసిన యాకోబు
      '25':
        title: కనానుకు తిరిగివచ్చిన యాకోబు
      '26':
        title: ఏశావుతో సమాధానపడిన యాకోబు
      '27':
        title: ఏశావు నుంచి పారిపోతూ కలగన్న యాకోబు
      '28':
        title: యాకోబును మోసగించి వివాహంలోకి నెట్టిన లాబాను
      '29':
        title: లాబానుకు తెలియకుండా వెళ్లిపోయిన యాకోబు
      '30':
        title: దీనాకు ప్రతీకారం తీర్చుకున్న షిమ్యోను, లేవి
      '31':
        title: లేవి, యూదాలను ఆశీర్వదించిన ఇస్సాకు
      '32':
        title: దశమభాగం ఇచ్చి ప్రార్థించిన యాకోబు
      '33':
        title: యాకోబుకు తీవ్రమైన అపరాధం చేసిన రూబేను
      '34':
        title: యోసేపు ఐగుప్తుకు అమ్మబడిన విషాదం
      '35':
        title: మక్పేలా దగ్గర మరణించిన రిబ్కా
      '36':
        title: మరణానికి ముందు ఆశీర్వదించిన ఇస్సాకు
      '37':
        title: తన ప్రమాణాన్ని త్యజించిన ఏశావు
      '38':
        title: యుద్ధంలో ఏశావును చంపిన యాకోబు
      '39':
        title: పోతీఫరు భార్యను ఎదిరించిన యోసేపు
      '40':
        title: ఐగుప్తు పాలకుడిగా ఎదిగిన యోసేపు
      '41':
        title: సంతానం కోసం యూదాను మోసగించిన తామారు
      '42':
        title: తన సహోదరులను పరీక్షించిన యోసేపు
      '43':
        title: బెన్యామీను కోసం వేడుకున్న యూదా
      '44':
        title: యాకోబు ఐగుప్తు ప్రయాణం
      '45':
        title: గోషెనులో స్థిరపడిన ఇశ్రాయేలు
      '46':
        title: యోసేపు ఆధ్వర్యంలో వర్ధిల్లిన ఇశ్రాయేలు
      '47':
        title: రెల్లుల మధ్య దాచబడిన మోషే
      '48':
        title: మోషేపై మస్తేమా విఫల దాడి
      '49':
        title: మొత్తంగా కాల్చిన పస్కా గొర్రెపిల్ల
      '50':
        title: విశ్రాంతిదినపు విశ్రాంతి, నిషేధిత శ్రమ
    Psalms of Solomon:
      '1':
        title: నా బాధతో కూడిన మొర విన్న ప్రభువు
      '2':
        title: గర్విష్ఠులైన పాపులను త్వరగా తీర్పుతీర్చే దేవుడు
      '3':
        title: నీతిమంతులు నిరంతరం ప్రభువును స్తుతిస్తారు
      '4':
        title: వేషధారి గతి అవమానకరమైన అంతం
      '5':
        title: అందరికీ సమృద్ధిగా సమకూర్చే దేవుడు
      '6':
        title: సిద్ధమైన హృదయం ప్రభువును పిలుస్తుంది
      '7':
        title: శత్రువుల పట్టు నుంచి కాపాడే ప్రభువు
      '8':
        title: ఎప్పటికీ న్యాయంగా తీర్పుతీర్చే ప్రభువు
      '9':
        title: దేవుని కరుణలో ఇశ్రాయేలు నిరీక్షణ
      '10':
        title: శిక్షణను అంగీకరిస్తే శుద్ధి కలుగుతుంది
      '11':
        title: దూరదేశాల నుంచి ఇశ్రాయేలును సమకూర్చు
      '12':
        title: గుసగుసలాడే అబద్ధాల నుంచి నన్ను రక్షించు
      '13':
        title: నాశనానికి దూరంగా జీవించే నీతిమంతులు
      '14':
        title: నిత్య జీవవృక్షాలైన విశ్వాసులు
      '15':
        title: ఆపదలో ప్రభువును పిలిచాను
      '16':
        title: దేవుని కరుణ నన్ను మేల్కొలిపింది
      '17':
        title: ప్రభువు సత్యవంతుడైన నిత్యరాజు
      '18':
        title: కరుణ దినం కోసం ఇశ్రాయేలును శుద్ధిచేయి
    Shepherd of Hermas:
      '1':
        title: దుష్ట కోరికను ఎదుర్కొన్న హెర్మాసు
      '2':
        title: పుస్తకంతో ప్రత్యక్షమైన స్త్రీ
      '3':
        title: కుటుంబాన్ని పశ్చాత్తాపానికి ప్రోత్సహించిన దూత
      '4':
        title: చదివిన తరువాత వెళ్లిపోయిన స్త్రీ
      '5':
        title: హెర్మాసును మళ్లీ పైకెత్తిన ఆత్మ
      '6':
        title: పశ్చాత్తాపపడమని పిల్లలకు హెచ్చరిక
      '7':
        title: హెర్మాసుకు క్షమాపణ, పిల్లలకు శుద్ధి
      '8':
        title: వృద్ధ స్త్రీగా వెల్లడైన సంఘం
      '9':
        title: పొలంలో స్త్రీని కలిసిన హెర్మాసు
      '10':
        title: నీళ్లపై నిర్మితమవుతున్న గోపుర దర్శనం
      '11':
        title: దర్శనాన్ని వివరించిన స్త్రీ
      '12':
        title: గోపురాన్ని నిర్మించిన దేవదూతలు
      '13':
        title: గోపురంలో సరిగ్గా అమరిన రాళ్లు
      '14':
        title: గోపురం నుంచి తిరస్కరించబడిన పాపులు
      '15':
        title: తిరస్కరించబడిన రాళ్లకు పశ్చాత్తాప అవకాశం
      '16':
        title: గోపురానికి ఆధారంగా నిలిచిన ఏడుగురు స్త్రీలు
      '17':
        title: మూడవ దర్శనం, తొమ్మిదవ భాగం
      '18':
        title: శుద్ధి చేసుకోవాలని నాయకులకు హెచ్చరిక
      '19':
        title: మూడు రూపాలకు తొలి వివరణ
      '20':
        title: 'రెండవ దర్శనం: నూతనమైన ఆత్మలు'
      '21':
        title: నూతనత్వాన్ని చూపిన మూడవ దర్శనం
      '22':
        title: మహా శ్రమకు సూచనైన మృగం
      '23':
        title: నిర్మల హృదయంతో సేవించమన్న కన్య
      '24':
        title: మృగం తలపై నాలుగు రంగులు
      '25':
        title: ముఖ్య విషయాలను వెల్లడించిన కాపరి
      '26':
        title: ఏకైక సత్య దేవునిపై విశ్వాసం
      '27':
        title: గౌరవనీయతను వస్త్రంలా ధరించుకో
      '28':
        title: సత్యంగా జీవించమని ప్రోత్సహించిన దూత
      '29':
        title: శీలాచరణను కచ్చితంగా పాటించమన్న ఆజ్ఞ
      '30':
        title: పశ్చాత్తాపం ఇచ్చే నిజమైన అవగాహన
      '31':
        title: పశ్చాత్తాపం ద్వారా లభించే క్షమాపణ
      '32':
        title: పరిశుద్ధాత్మకు స్వేచ్ఛగా నివాసమిచ్చే సహనం
      '33':
        title: దుష్టత్వం నుంచి నీతి మార్గాన్ని గుర్తించడం
      '34':
        title: ప్రభువుకు భయపడి నీతిగా జీవించు
      '35':
        title: మంచి చెడుల గురించి మాట్లాడిన దూత
      '36':
        title: సందేహాన్ని తృణీకరించి నమ్మకమైన దేవుని సేవించు
      '37':
        title: నాశనం చేసేదీ రక్షించేదీ అయిన దుఃఖం
      '38':
        title: ఆత్మను కృశింపజేసే దుఃఖం
      '39':
        title: ఉల్లాసానందాలను వస్త్రంలా ధరించుకో
      '40':
        title: అబద్ధ ప్రవక్తలకు, ఆత్మలకు దూరంగా ఉండే విశ్వాసులు
      '41':
        title: రక్షించే మంచి కోరిక అనే వస్త్రం
      '42':
        title: దుష్ట కోరికను ఎదిరించి నీతిని సేవించు
      '43':
        title: నీతియుక్తమైన సేవను కోరిన హెర్మాసు
      '44':
        title: ఆజ్ఞలను పాటించాలని నిర్ణయించుకో; అప్పుడు అవి సులభం
      '45':
        title: విశ్వాసులైన సేవకులకు భయపడే అపవాది
      '46':
        title: పశ్చాత్తాపపడమని హెర్మాసును ప్రోత్సహించిన దేవదూత
review:
  verdict: revise
  review_summary: తెలుగు స్థానికీకరణ పూర్తిగా ఉంది మరియు ఎక్కువగా మూలానికి నమ్మకంగా ఉంది. కొన్ని శీర్షికలలో అర్థాన్ని మరింత ఖచ్చితంగా చేయడానికి స్వల్ప సవరణలు చేశాను, ముఖ్యంగా వివాహంలో లాబాను చేసిన మోసం, పస్కా గొర్రెపిల్లను మొత్తంగా కాల్చడం, శీలాచరణ, మరియు పరిశుద్ధాత్మతో సంబంధమైన పదప్రయోగంలో.
  issues:
  - Jubilees 28లో లాబాను యాకోబును వివాహంలోకి మోసగించిన భావాన్ని స్పష్టం చేశాను.
  - Jubilees 49లో 'roasted whole'కు 'మొత్తంగా కాల్చిన' అనే ఖచ్చితమైన అనువాదం ఇచ్చాను.
  - Psalms of Solomon 14లో 'trees of life' భావాన్ని స్పష్టంగా ఉంచాను.
  - Shepherd of Hermas 29లో 'chastity'కి 'శీలాచరణ'ను, 32లో పరిశుద్ధాత్మకు సంబంధించిన భావాన్ని మరింత సహజంగా అనువదించాను.
