chunk_id: books-014
status: reviewed
payload:
  book_metadata:
    Sirach:
      display_name: సీరాఖు
      author: యెరూషలేముకు చెందిన యెషువా బెన్ ఎలియాజరు బెన్ సీరా; ఆయన మనవడు గ్రీకులోకి అనువదించాడు.
      audience: హెల్లెనిస్టిక్ కాలపు యెరూషలేములో జ్ఞానవిషయాల్లో శిక్షణ పొందుతున్న యూద యువకులు.
      date: హీబ్రూ మూలగ్రంథం సుమారు క్రీ.పూ. 195–175; గ్రీకు అనువాదం సుమారు క్రీ.పూ. 132.
    Baruch:
      display_name: బారూకు
      author: రచయిత ఎవరో తెలియదు; యిర్మీయా లేఖికుడైన బారూకు పేరుతో రాసినదిగా ఆపాదించబడింది.
      audience: చెర, పశ్చాత్తాపం, జ్ఞానం గురించి ఆలోచిస్తున్న చెదరిపోయిన ప్రాంతాల్లోని యూదులు.
      date: సుమారు క్రీ.పూ. 2వ శతాబ్దం.
    1 Maccabees:
      display_name: 1 మక్కబీయులు
      author: రచయిత ఎవరో తెలియదు; బహుశా యెరూషలేముకు చెందిన రచయిత హీబ్రూలో రాసి ఉండవచ్చు (గ్రీకు పాఠం మాత్రమే మిగిలి ఉంది).
      audience: హాస్మోనీయుల తిరుగుబాటు కాలంలోనూ ఆ తరువాతా జీవించిన యూదులు; హాస్మోనీయ వంశపు పాలనకు ఉన్న చట్టబద్ధతను ఈ గ్రంథం వివరిస్తుంది.
      date: సుమారు క్రీ.పూ. 100.
    2 Maccabees:
      display_name: 2 మక్కబీయులు
      author: కురేనీయుడైన యాసోను రాసిన సుదీర్ఘ గ్రంథాన్ని సంక్షిప్తం చేసిన పేరు తెలియని రచయిత; గ్రీకులో రచించబడింది.
      audience: గ్రీకు మాట్లాడే చెదరిపోయిన ప్రాంతాల్లోని యూదులు—హతసాక్షిత్వం, దైవ పరిపాలన, పునరుత్థానాన్ని నొక్కిచెబుతుంది.
      date: సుమారు క్రీ.పూ. 124 లేదా దానికి కొద్దికాలం తరువాత.
  chapter_titles:
    Wisdom of Solomon:
      '7':
        title: ప్రార్థన జ్ఞానాన్నీ అవగాహననూ తెస్తుంది
      '8':
        title: జ్ఞానం పాలకులకు మార్గం చూపి బలపరుస్తుంది
      '9':
        title: రాజు దైవజ్ఞానం కోసం ప్రార్థిస్తాడు
      '10':
        title: జ్ఞానం నీతిమంతులను కాపాడి విడిపిస్తుంది
      '11':
        title: దేవుడు క్రమశిక్షణ ద్వారా కరుణ చూపుతాడు
      '12':
        title: విగ్రహాలను ఎగతాళి చేయడం వ్యర్థమైన ఆశనే మిగులుస్తుంది
      '13':
        title: ప్రజలు ప్రాణంలేని విగ్రహాలను పూజిస్తారు
      '14':
        title: దేవుడు ఓడలను సముద్రంలో నడిపిస్తాడు
      '15':
        title: దేవుని కరుణ నిజమైన ఆరాధనకు దారి చూపుతుంది
      '16':
        title: పీడించేవారికి తీర్పు తీరుస్తూనే దేవుడు సమకూరుస్తాడు
      '17':
        title: భయానక రాత్రి కౌగిలిలో చిక్కుకున్నారు
      '18':
        title: దేవుడు వెలుగుతో దారి చూపుతాడు
      '19':
        title: ఇశ్రాయేలు కోసం మేఘాలు పక్కకు తొలగుతాయి
    Sirach:
      '1':
        title: దేవుడు జ్ఞానాన్ని కొలిచి అనుగ్రహిస్తాడు
      '2':
        title: పరీక్షలు నమ్మకమైన సేవకులను రుజువు చేస్తాయి
      '3':
        title: తల్లిదండ్రులను గౌరవించి దీర్ఘాయువు పొందండి
      '4':
        title: పీడితులను కాపాడి జ్ఞానాన్ని వెదకండి
      '5':
        title: సంపదను కాదు, దేవుణ్ణి నమ్మండి
      '6':
        title: రైతులా జ్ఞానాన్ని వెదకండి
      '7':
        title: హృదయంలో లోతైన వినయాన్ని నిలుపుకోండి
      '8':
        title: మూర్ఖులకు దూరంగా ఉండి పెద్దలను గౌరవించండి
      '9':
        title: అసూయ, కామం విషయంలో జాగ్రత్తగా ఉండండి
      '10':
        title: జ్ఞానయుక్తమైన నాయకత్వం క్రమాన్ని తెస్తుంది
      '11':
        title: జ్ఞానం పేదవారిని పైకి లేపుతుంది
      '12':
        title: పాపులకు కాదు, నీతిమంతులకు సహాయం చేయండి
      '13':
        title: తారును తాకితే అంటుకుంటుంది
      '14':
        title: జ్ఞానం శాశ్వతమైన దీవెన తెస్తుంది
      '15':
        title: వెదికేవారిని జ్ఞానం కలుసుకుంటుంది
      '16':
        title: నమ్మకమైన ఒక్క వ్యక్తి నగరాన్ని నిలబెడతాడు
      '17':
        title: మానవులు దేవుని స్వరూపంలో చేయబడ్డారు
      '18':
        title: మంచి పనులను చెడగొట్టవద్దు
      '19':
        title: సుఖాల వెంటపడేవారు నాశనమవుతారు
      '20':
        title: మాట్లాడటానికి తగిన సమయాన్ని జాగ్రత్తగా ఎంచుకోండి
      '21':
        title: ప్రార్థించండి, పాపం నుంచి పారిపోండి, జ్ఞానాన్ని వెదకండి
      '22':
        title: సోమరితనం అవమానాన్నీ దుఃఖాన్నీ తెస్తుంది
      '23':
        title: అంతరంగ క్రమశిక్షణ, జ్ఞానం కోసం ప్రార్థించండి
      '24':
        title: జ్ఞానం తనను తానే ప్రశంసించుకుంటూ మాట్లాడుతుంది
      '25':
        title: జ్ఞానం దేవుణ్ణీ ప్రజలనూ గౌరవిస్తుంది
      '26':
        title: భార్య ఆనందాన్నో బాధనో తెస్తుంది
      '27':
        title: నీతిని అనుసరించి దాన్ని గర్వంగా ధరించండి
      '28':
        title: పాపాలను క్షమించి కరుణ పొందండి
      '29':
        title: మీ పొరుగువారిని క్షమించి కరుణ పొందండి
      '30':
        title: కుమారులను గౌరవప్రదంగా పెంచండి
      '31':
        title: సంపద ఆందోళననూ బాధనూ తెస్తుంది
      '32':
        title: వినయంతో ముందుగా ఇతరులకు సేవ చేయండి
      '33':
        title: ప్రభువుకు భయపడేవారిని ఆయన కాపాడుతాడు
      '34':
        title: స్పష్టత లేకపోతే కలలు తప్పుదారి పట్టించగలవు
      '35':
        title: నాయకులు వినయంతో, జ్ఞానంతో ఉండాలి
      '36':
        title: ప్రభువుకు భయపడడం ద్వారా రక్షణ వస్తుంది
      '37':
        title: స్నేహితులనూ సలహానూ జ్ఞానంతో ఎంచుకోండి
      '38':
        title: వైద్యులను గౌరవించండి, స్వస్థత కోసం ప్రార్థించండి
      '39':
        title: ధర్మశాస్త్రాన్ని నిబద్ధతతో పాటించేవారిని సీరాఖు ప్రశంసిస్తాడు
      '40':
        title: జీవితపు భారమూ దీవెనలూ
      '41':
        title: మరణం తుది విశ్రాంతిని తెస్తుంది
      '42':
        title: కష్టమైనా అవసరమైన విషయాలను ప్రస్తావించండి
      '43':
        title: ఆకాశంలోని అద్భుతాలు దేవుణ్ణి స్తుతించేలా ప్రేరేపిస్తాయి
      '44':
        title: విశ్వాసం నడిపించిన పూర్వీకులు
      '45':
        title: అందరికంటే మోషేకు అధిక గౌరవం
      '46':
        title: దేవుని ప్రజల కోసం యెహోషువ యుద్ధం చేస్తాడు
      '47':
        title: నాతానును ఎదిరించిన దావీదు ప్రశంసించబడతాడు
      '48':
        title: మండే మాటలతో ఏలీయా ప్రవచిస్తాడు
      '49':
        title: సంస్కరణ చేసిన యోషీయాకు గౌరవం
      '50':
        title: సీమోను తన ప్రజలను దీవిస్తాడు
      '51':
        title: నేను నా దేవుణ్ణి స్తుతిస్తాను
    Baruch:
      '1':
        title: నది దగ్గర బారూకు పాపాంగీకారాన్ని చదువుతాడు
      '2':
        title: మోషే ద్వారా హెచ్చరించినవాటిని ప్రభువు అమలు చేస్తాడు
      '3':
        title: ప్రజలు మొరపెట్టి, పాపాలు ఒప్పుకొని, తిరుగుతారు
      '4':
        title: దేవుని ఆజ్ఞలు జీవాన్ని ఇస్తాయి
      '5':
        title: యెరూషలేమా, శాశ్వత వైభవాన్ని ధరించు
    1 Maccabees:
      '1':
        title: గ్రీకు నిరంకుశత్వాన్ని ఇశ్రాయేలు ఎదిరిస్తుంది
      '2':
        title: ధర్మశాస్త్రాన్ని పాటిస్తానని మత్తతీయ ప్రతిజ్ఞ చేస్తాడు
      '3':
        title: ఇశ్రాయేలుకు సహాయం కోసం యూదా ప్రార్థిస్తాడు
      '4':
        title: దేవాలయం శుద్ధి చేయబడి మళ్లీ ప్రతిష్ఠించబడుతుంది
      '5':
        title: చుట్టుపక్కల జనాంగాలను యూదా ఓడిస్తాడు
      '6':
        title: ఓటమి తరువాత అంతియోకు మరణిస్తాడు
      '7':
        title: నికానోరు సైన్యాన్ని యూదా ఓడిస్తాడు
      '8':
        title: రోమీయులతో స్నేహం కోసం యూదా ప్రయత్నిస్తాడు
      '9':
        title: యూదా తరువాత యోనాతాను నాయకత్వం వహిస్తాడు
      '10':
        title: అలెగ్జాండరు అనుగ్రహాన్ని యోనాతాను పొందుతాడు
      '11':
        title: టోలెమీ ముప్పును యోనాతాను ఎదుర్కొంటాడు
      '12':
        title: యూదయలోని కోటలను సీమోను పటిష్ఠం చేస్తాడు
      '13':
        title: యెరూషలేము కోటను సీమోను అణచివేస్తాడు
      '14':
        title: సీమోను ఇశ్రాయేలును పటిష్ఠపరచి శాంతిని నెలకొల్పుతాడు
      '15':
        title: యూదుల హక్కులను అంతియోకు ధృవీకరిస్తాడు
      '16':
        title: కెందెబయు సైన్యాలను యోహాను ఓడిస్తాడు
    2 Maccabees:
      '1':
        title: విడుదల కోసం యూదులు ప్రార్థిస్తారు
      '2':
        title: శుద్ధీకరణకు నాయకులు ఆహ్వానిస్తారు
      '3':
        title: హెలియోదోరు దేవాలయాన్ని బెదిరిస్తాడు
      '4':
        title: ఒనీయాకు వ్యతిరేకంగా యాసోను కుట్ర చేస్తాడు
      '5':
        title: అంతియోకు దేవాలయాన్ని అపవిత్రం చేస్తాడు
