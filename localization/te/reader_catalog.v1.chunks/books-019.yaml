payload:
  book_metadata:
    Gospel of Truth:
      display_name: సత్య సువార్త
      author: రచయిత తెలియదు; వాలెంటినస్ లేదా ఆయన పాఠశాలకు చెందిన రచనగా విస్తృతంగా భావిస్తారు.
      audience: వాలెంటినియన్ జ్ఞానవాద ఉద్యమానికి చెందిన క్రైస్తవ పాఠకులు.
      date: సుమారు క్రీ.శ. 2వ శతాబ్దం మధ్యకాలం; నాగ్ హమ్మాదిలో భద్రపరచబడింది.
    Jubilees:
      display_name: యూబిలీలు
      author: రచయిత తెలియదు; మోషేకు సీనాయి పర్వతంపై బయలుపరచబడిన ప్రకటనగా సమర్పించబడింది.
      audience: 364 రోజుల సౌర పంచాంగాన్ని, కఠినమైన హలాఖా ఆచరణను పాటించిన యూద సమాజాలు (బహుశా కుమ్రాన్‌కు చెందిన అదే మత-సాంస్కృతిక వాతావరణం).
      date: సుమారు క్రీ.పూ. 2వ శతాబ్దం మధ్యకాలం; గీజ్ (ఇథియోపిక్) భాషలో సంపూర్ణంగా భద్రపరచబడింది.
  chapter_titles:
    Gospel of Thomas:
      '49':
        title: ఏకాంతంగా ఉన్న ఎన్నుకోబడినవారు రాజ్యాన్ని కనుగొంటారు
      '50':
        title: వెలుగు గురించి యేసు బోధ
      '51':
        title: మృతుల విశ్రాంతి గుర్తించకుండానే వస్తుంది
      '52':
        title: మాట్లాడే మృతుల మధ్య సజీవుడు
      '53':
        title: సున్నతి గురించి శిష్యుల ప్రశ్న
      '54':
        title: పేదలను ధన్యులని ప్రకటించిన యేసు
      '55':
        title: ద్వేషించండి లేదా క్రీస్తును అనుసరించండి
      '56':
        title: లోకాన్ని శవంగా కనుగొని అనర్హమని ఎంచడం
      '57':
        title: శ్రమించే వ్యక్తి ధన్యుడు
      '58':
        title: కఠినంగా శ్రమించేవారిని ధన్యులని ప్రకటించిన యేసు
      '59':
        title: బతికి ఉండగానే సజీవుడైనవానిని వెదకండి
      '60':
        title: గొర్రెపిల్లను యూదయకు తీసుకెళ్తున్న సమరయుడు
      '61':
        title: వెలుగు గురించి సలోమేకి యేసు బోధ
      '62':
        title: రహస్యంగా బయలుపరచబడిన మర్మాలు
      '63':
        title: సిద్ధంగా లేని ధనవంతుని మరణం
      '64':
        title: అనుకోని అతిథులను ఆహ్వానించిన యజమాని
      '65':
        title: మంచివాని ద్రాక్షతోట నాశనం
      '66':
        title: తిరస్కరించబడిన రాయిని నాకు చూపండి
      '67':
        title: అన్నీ తెలిసినా తనను తాను ఎరుగకపోవడం
      '68':
        title: హింసించబడేవారు ధన్యులు
      '69':
        title: ఆకలిగొన్న ఆత్మలు ధన్యులు
      '70':
        title: అంతరంగ పేదరికం గురించి యేసు బోధ
      '71':
        title: ఇల్లు కూలిపోతుందని యేసు ముందుగా చెప్పడం
      '72':
        title: ఆస్తిని పంచడానికి యేసు నిరాకరణ
      '73':
        title: మరింతమంది పనివారు కావాలని యేసు పిలుపు
      '74':
        title: దప్పిగొన్న జనసమూహాలు ఉన్నా బావి ఖాళీ
      '75':
        title: ఏకాంతంగా ఉన్నవారు పెండ్లి గదిలో ప్రవేశిస్తారు
      '76':
        title: ఎప్పటికీ నిలిచే నిధిని వెదకండి
      '77':
        title: దైవిక వెలుగుగా తన గురించి యేసు బోధ
      '78':
        title: మెత్తని వస్త్రాల గురించి యేసు ప్రశ్న
      '79':
        title: సత్యాన్ని సహించిన స్త్రీ ధన్యురాలు
      '80':
        title: లోకాన్ని దేహంగా కనుగొని అనర్హమని ఎంచడం
      '81':
        title: సంపద, అధికారం గురించిన యేసు విరోధాభాసం
      '82':
        title: సమీపంలో ఉన్నవారికి దగ్గరగా అగ్ని
      '83':
        title: రూపాలు కనిపిస్తాయి, కానీ వెలుగు దాగి ఉంటుంది
      '84':
        title: మీ పోలికను చూడడం ఆనందాన్ని కలిగిస్తుంది
      '85':
        title: ఆదాము గొప్ప శక్తి నుండి వచ్చాడు
      '86':
        title: నివాసం లేకపోవడం గురించి యేసు బోధ
      '87':
        title: దేహం, ఆత్మ పరస్పరం ఆధారపడటం దౌర్భాగ్యకరం
      '88':
        title: దేవదూతలు, ప్రవక్తలు వస్తారు
      '89':
        title: శుద్ధీకరణ గురించి యేసు ప్రశ్న
      '90':
        title: వెదికేవారికి విశ్రాంతిని అందించే యేసు
      '91':
        title: నిజమైన జ్ఞానాన్ని బయలుపరచిన యేసు
      '92':
        title: వెదకండి, మీకు దొరుకుతుంది
      '93':
        title: పవిత్రమైనవాటిని వివేకంతో ఇవ్వండి
      '94':
        title: వెదకడం కనుగొనడానికి దారితీస్తుంది
      '95':
        title: తిరిగి వస్తుందని ఆశించకుండా అప్పివ్వండి
      '96':
        title: దాగి ఉన్న పులిసిన పిండిలాంటి రాజ్యం
      '97':
        title: తెలియకుండానే పిండిని పోగొట్టుకున్న స్త్రీ
      '98':
        title: ముందుగా తన బలాన్ని పరీక్షించుకున్న వ్యక్తి
      '99':
        title: నిజమైన సహోదరులు తండ్రికి విధేయులవుతారు
      '100':
        title: పన్ను గురించి యేసు సమాధానం
      '101':
        title: నిజమైన శిష్యుడు ద్వేషించాలి
      '102':
        title: స్వార్థపరులైన పరిసయ్యులను శపించిన యేసు
      '103':
        title: సిద్ధంగా ఉన్న వ్యక్తి ధన్యుడు
      '104':
        title: పెండ్లికుమారుడు వెళ్లిన తర్వాత ప్రార్థించండి
      '105':
        title: అంతర్దృష్టి బహిరంగ అవమానాన్ని తెస్తుంది
      '106':
        title: ఐక్యత పర్వతాలను కదిలిస్తుంది
      '107':
        title: తప్పిపోయిన గొర్రెను వెదికే రాజ్యం
      '108':
        title: దాగి ఉన్నవాటిని బయలుపరచిన యేసు
      '109':
        title: తనను తాను వెల్లడించుకున్న దాగిన నిధి
      '110':
        title: దొరికిన లోక సంపదను త్యజించండి
      '111':
        title: ఆయన ఎదుట ఆకాశాలు చుట్టబడతాయి
      '112':
        title: శరీరంపై ఆధారపడడం గురించి యేసు హెచ్చరిక
      '113':
        title: రాజ్యం భూమిమీద విస్తరించి ఉంది
      '114':
        title: మరియ సమానత్వం గురించి యేసు బోధ
    Gospel of Truth:
      '1':
        title: కృప తండ్రి సత్యాన్ని బయలుపరుస్తుంది
      '2':
        title: మరుపులో బలపడే తప్పు
      '3':
        title: పిల్లలకు జ్ఞానాన్ని బయలుపరచిన తండ్రి
      '4':
        title: పేరుపెట్టి పిలువబడినవారు విశ్రాంతి పొందుతారు
      '5':
        title: అందరినీ సంపూర్ణతకు చేర్చిన యేసు
      '6':
        title: భ్రాంతిని ఛేదించే వాక్యం
      '7':
        title: తండ్రి పేరు పెట్టి ఉనికిలోకి తెస్తాడు
      '8':
        title: భీతి శూన్యమని వెల్లడించిన వెలుగు
      '9':
        title: ఆయన వారికి వెలుగును, జీవాన్ని బోధించాడు
      '10':
        title: ఒక్క గొర్రెను వెదికే కాపరి
      '11':
        title: గ్రహింపు అంధులను మేల్కొలుపుతుంది
      '12':
        title: పాపాల విమోచనను తెచ్చే వెలుగు
      '13':
        title: వెలుగులో ఆయన తన చిత్తాన్ని వెల్లడిస్తాడు
      '14':
        title: ప్రియ కుమారునికి పేరు పెట్టిన తండ్రి
      '15':
        title: తండ్రిలో విశ్రమించే సత్యం
      '16':
        title: నన్ను నేను తండ్రికి అంకితం చేసుకుంటాను
    Jubilees:
      '1':
        title: కరుణ కోసం మోషే విన్నపం
      '2':
        title: ఇశ్రాయేలుకు విశ్రాంతిదిన పవిత్రత
      '3':
        title: ఏదెనులో హవ్వకు పేరు పెట్టిన ఆదాము
      '4':
        title: తీర్పు గురించి హనోకు హెచ్చరిక
      '5':
        title: పాపం కారణంగా జలప్రళయ నిర్ణయం
      '6':
        title: ఇంద్రధనుస్సుతో నోవహుకు చేసిన నిబంధనలు
      '7':
        title: నీతిగా జీవించమని సంతతివారికి నోవహు హెచ్చరిక
      '8':
        title: భూమిని పంచిన నోవహు
      '9':
        title: ఆత్మలపై అధికారం కోరిన మస్తేమా
      '10':
        title: బాబెలు గోపురం వద్ద చెదరగొట్టబడిన ప్రజలు
      '11':
        title: అవినీతి మధ్య కుమారునికి పేరు పెట్టిన సెరూగు
      '12':
        title: పునరుద్ధరించబడిన పరలోక భాష
      '13':
        title: లోతును రక్షించి దశమభాగం ఇచ్చిన అబ్రాము
      '14':
        title: అబ్రాముకు గొప్ప ప్రతిఫలం వాగ్దానం చేసిన దేవుడు
      '15':
        title: నిబంధనకు గుర్తుగా సున్నతి
      '16':
        title: ఇస్సాకు జననం, సొదొమ నాశనం
