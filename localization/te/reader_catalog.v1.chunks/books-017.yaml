source_chunk_sha256: 886ca38f25f85c282e78bde4f46a97993d80ba64511dcbe8b11bf474f6142f36
chunk_id: books-017
status: reviewed
payload:
  book_metadata:
    2 Baruch:
      display_name: 2 బారూకు
      author: రచయిత తెలియదు; యిర్మీయా లేఖకుడైన బారూకు పేరుతో రచించబడినదిగా ఆపాదించబడింది.
      audience: క్రీ.శ. 70లో దేవాలయం నాశనమైన తర్వాత, చెర అనుభవాన్ని దేవునితో తమ సంబంధం దృష్ట్యా అర్థం చేసుకోవడానికి ప్రయత్నిస్తున్న యూదులు.
      date: సుమారు క్రీ.శ. 1వ శతాబ్దం చివరి భాగం నుంచి 2వ శతాబ్దం ఆరంభం వరకు; ప్రధానంగా సిరియాక్ భాషలో భద్రపరచబడింది.
  chapter_titles:
    1 Enoch:
      '81':
        title: హనోకు పరలోక పలకలను చదువుతాడు
      '82':
        title: భద్రపరచమని మెతూషెలకు హనోకు ఆజ్ఞాపిస్తాడు
      '83':
        title: భూమి నాశనం కావడం హనోకు చూస్తాడు
      '84':
        title: పరిశుద్ధ దేవుణ్ణి హనోకు స్తుతిస్తాడు
      '85':
        title: కుటుంబ భవితవ్యాన్ని హనోకు కలలో చూస్తాడు
      '86':
        title: నక్షత్రాలు పడి పశువుల మధ్య మేస్తాయి
      '87':
        title: ఏడుగురు పరలోక జీవులు గోపురాన్ని చూపిస్తారు
      '88':
        title: పడిపోయిన నక్షత్రాన్ని దేవదూత పట్టుకుంటాడు
      '89':
        title: జంతు సంకేతాలను హనోకు చూస్తాడు
      '90':
        title: కాపరుల దుష్పాలన; గొర్రెల మంద పునర్నిర్మాణం
      '91':
        title: భవిష్యత్తు శిక్షలను హనోకు వెల్లడిస్తాడు
      '92':
        title: నీతిమంతుల తరాల కోసం హనోకు రాస్తాడు
      '93':
        title: వారాలు చరిత్రను, తీర్పును సంక్షిప్తంగా వివరిస్తాయి
      '94':
        title: దుష్ట మార్గాలకు బదులు నీతిని ఎంచుకోండి
      '95':
        title: రాబోయే శిక్షను తలచి హనోకు విలపిస్తాడు
      '96':
        title: పాపులకంటే పైగా నీతిమంతులు ఎగసిపోతారు
      '97':
        title: నీతిమంతులు ఆనందిస్తారు, పాపులు పతనమవుతారు
      '98':
        title: విలాసం అవమానాన్ని, నాశనాన్ని తెస్తుంది
      '99':
        title: దుష్కార్యాలు చేసేవారికి శ్రమలు ప్రకటించబడతాయి
      '100':
        title: దేవదూతలు దుష్టులకు తీర్పుతీర్చి నీతిమంతులను కాపాడుతారు
      '101':
        title: దేవునికి భయపడి చెడు చేయడం మానండి
      '102':
        title: తీర్పు దినాన నీతిమంతులు ఆనందిస్తారు
      '103':
        title: శాశ్వత న్యాయస్థాపనను హనోకు ప్రకటిస్తాడు
      '104':
        title: పాపం గురించి హనోకు హెచ్చరిస్తాడు
      '105':
        title: మహిమ సన్నిధిలో పేర్లు ఉంచబడతాయి
      '106':
        title: భవిష్యత్తు నిరీక్షణకు సూచనగా నోవహుకు పేరు పెట్టబడుతుంది
      '107':
        title: చివరి తరం పునరుద్ధరణను తెస్తుంది
      '108':
        title: హనోకు చివరి హెచ్చరిక రాస్తాడు
    2 Baruch:
      '1':
        title: యూదా గురించి దేవుడు బారూకును హెచ్చరిస్తాడు
      '2':
        title: వెళ్లిపోవాలని ప్రభువు బారూకుకు ఆజ్ఞాపిస్తాడు
      '3':
        title: యెరూషలేము భవితవ్యం గురించి బారూకు వేడుకుంటాడు
      '4':
        title: మరుగైన నగర వాస్తవికతను ప్రభువు వెల్లడిస్తాడు
      '5':
        title: యిర్మీయా బృందంతో కలిసి బారూకు విలపిస్తాడు
      '6':
        title: సీయోనుకు కాపలా కాస్తున్న దేవదూతలను బారూకు చూస్తాడు
      '7':
        title: సీయోనును కూలదోయమని దేవదూతలకు ఆజ్ఞ
      '8':
        title: పరలోక వ్యక్తి పవిత్ర వస్తువులను తొలగిస్తాడు
      '9':
        title: యిర్మీయా, బారూకు కలిసి దుఃఖిస్తారు
      '10':
        title: సీయోను నిర్జనతను తలచి బారూకు తీవ్రంగా విలపిస్తాడు
      '11':
        title: బబులోను సౌభాగ్యాన్ని తలచి బారూకు విలపిస్తాడు
      '12':
        title: రాబోయే ఉగ్రత గురించి బారూకు హెచ్చరిస్తాడు
      '13':
        title: బారూకు భవిష్యత్తులో సాక్ష్యమివ్వడాన్ని దేవుడు చూపిస్తాడు
      '14':
        title: నీతిమంతులకున్న ప్రయోజనం గురించి బారూకు ప్రశ్నిస్తాడు
      '15':
        title: పాపుల జవాబుదారీతనాన్ని ప్రభువు వివరిస్తాడు
      '16':
        title: భవిష్యత్తు మహిమతో బారూకు ధైర్యం పొందుతాడు
      '17':
        title: జీవితకాలపు అర్థాన్ని బారూకు తెలుసుకుంటాడు
      '18':
        title: దైవిక వెలుగును బారూకు వివరిస్తాడు
      '19':
        title: దేవుడు ప్రతి వ్యక్తికి తీర్పుతీరుస్తాడు
      '20':
        title: త్వరగా రానున్న తీర్పును దేవుడు వాగ్దానం చేస్తాడు
      '21':
        title: కిద్రోను దగ్గర బారూకు ప్రార్థిస్తాడు
      '22':
        title: పైనుంచి వినిపించిన స్వరానికి బారూకు లోబడతాడు
      '23':
        title: వేచివున్న తరాలన్నిటినీ దేవుడు జ్ఞాపకం చేసుకుంటాడు
      '24':
        title: భవిష్యత్తు తీర్పును బారూకు చూస్తాడు
      '25':
        title: అంతం వరకు బారూకు కాపాడబడతాడు
      '26':
        title: శ్రమకాలం ఎంతకాలముంటుందని బారూకు ప్రశ్నిస్తాడు
      '27':
        title: రాబోయే కాలపు సంఘటనలను బారూకు వివరిస్తాడు
      '28':
        title: క్షయరహితమైన దాని గురించి బారూకు ప్రశ్నిస్తాడు
      '29':
        title: భూమి సమృద్ధితో పొంగిపొర్లుతుంది
      '30':
        title: మెస్సీయతో పాటు ఆత్మలు లేస్తాయి
      '31':
        title: బారూకు పెద్దలను సీయోనుకు సమకూరుస్తాడు
      '32':
        title: దేవుని ధర్మశాస్త్రం ద్వారా సురక్షితంగా ఉండండి
      '33':
        title: తమతో ఉండమని ప్రజలు బారూకును వేడుకుంటారు
      '34':
        title: బారూకు విలపిస్తూ ప్రజలకు అభయమిస్తాడు
      '35':
        title: సీయోను దుఃఖాన్ని తలచి బారూకు విలపిస్తాడు
      '36':
        title: ద్రాక్షావల్లి దేవదారును నిందిస్తుంది
      '37':
        title: పడిపోయిన దేవదారును ద్రాక్షావల్లి నిందిస్తుంది
      '38':
        title: దర్శన వివరణ కోసం బారూకు ప్రార్థిస్తాడు
      '39':
        title: రాజ్యాల గురించి బారూకు ముందుగా చెబుతాడు
      '40':
        title: మెస్సీయ శేషప్రజలను కాపాడుతాడు
      '41':
        title: భవిష్యత్తు సంఘటనల గురించి బారూకు అడుగుతాడు
      '42':
        title: గతం కంటే విశ్వాసమే ముఖ్యం
      '43':
        title: శాశ్వత ఆదరణను బారూకు స్వీకరిస్తాడు
      '44':
        title: బారూకు తన కుమారుడైన జ్ఞానాన్ని పిలుస్తాడు
      '45':
        title: సహించండి, భయభక్తులతో సీయోనును వెదకండి
      '46':
        title: బారూకు పెద్దలకు నిరీక్షణ కలిగిస్తాడు
      '47':
        title: బారూకు ఏడు రోజులు ఉపవాసముంటాడు
      '48':
        title: శేషప్రజల కోసం బారూకు ప్రార్థిస్తాడు
      '49':
        title: భవిష్యత్తు జీవితం గురించి బారూకు ప్రశ్నిస్తాడు
      '50':
        title: మృతులు గుర్తుపట్టదగినవారిగా లేస్తారు
      '51':
        title: దుష్టులు వాడిపోతారు, నీతిమంతులు మహిమపరచబడతారు
      '52':
        title: తిరిగివచ్చిన మృతులను జీవులు గుర్తుపడతారు
      '53':
        title: మేఘ దర్శనాన్ని బారూకు కలలో చూస్తాడు
      '54':
        title: దర్శన వివరణ కోసం బారూకు ప్రార్థిస్తాడు
      '55':
        title: భవిష్యత్తు మర్మాలను దేవుడు బారూకుకు చూపిస్తాడు
      '56':
        title: మేఘం లోకపు ఆరంభాన్ని సూచిస్తుంది
      '57':
        title: నల్లని జలాలు ఆదాము అతిక్రమాన్ని సూచిస్తాయి
      '58':
        title: పాపం భూమిని కప్పేయడం ఆదాము చూస్తాడు
      '59':
        title: పాపభరిత లోకంపై మేఘం పైకి లేస్తుంది
      '60':
        title: అమోరీయుల దుష్టత్వం ఇశ్రాయేలును కలుషితం చేస్తుంది
      '61':
        title: దావీదు, సొలొమోను యుగం వర్ధిల్లుతుంది
      '62':
        title: యరొబాము పాపం నాశనాన్ని తెస్తుంది
      '63':
        title: హిజ్కియా నీతి విజయం సాధిస్తుంది
      '64':
        title: మనష్షే దుష్టత్వం అపవిత్రం చేస్తుంది
      '65':
        title: ఆమోను దుష్టపాలన చీకటిని కమ్ముతుంది
      '66':
        title: యోషీయా పవిత్రత సీయోనును పునరుద్ధరిస్తుంది
      '67':
        title: ప్రస్తుత విపత్తు దేవదూతలను దుఃఖపరుస్తుంది
      '68':
        title: భవిష్యత్తు రక్షణ ఆనందాన్ని తెస్తుంది
      '69':
        title: చివరి జలాలు లోకానికి సంబంధించినవి
      '70':
        title: లోకకాలం తీర్పుకు పక్వమవుతుంది
      '71':
        title: పరిశుద్ధ ప్రజలపై కరుణ చూపబడుతుంది
review:
  verdict: revise
  review_summary: చంక్ పూర్తిగా స్థానికీకరించబడింది. 2 బారూకు 38లో ‘interpretation’ను స్పష్టంగా సరిచేశాను; 2 బారూకు 44లో ‘son Wisdom’ అనే మూలంలోని సూచనను కుమారుని పేరుగా నమ్మకంగా ప్రతిబింబించేలా సరిచేశాను.
