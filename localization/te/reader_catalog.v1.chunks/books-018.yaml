source_chunk_sha256: b37964cbabee1876edf4d107b8624ada36e9fe1b7d6a7126d8718964cc5d83cc
chunk_id: books-018
status: reviewed
payload:
  book_metadata:
    2 Esdras:
      display_name: 2 ఎస్ద్రాస్
      author: రచయిత తెలియదు; మొదట యూదు సంప్రదాయంలో రూపుదిద్దుకున్న ప్రధాన భాగం (4 ఎజ్రా, 3–14 అధ్యాయాలు) చుట్టూ క్రైస్తవ సంపాదకులు చేర్చిన ఆరంభ, ముగింపు భాగాలు ఉన్నాయి.
      audience: క్రీ.శ. 70 తర్వాత దేవుని న్యాయం, లోకంలోని బాధ గురించి ప్రశ్నలతో పోరాడుతున్న యూదులు; ఆ తర్వాత క్రైస్తవ పాఠకుల కోసం విస్తరించబడింది.
      date: యూదు ప్రధాన భాగం బహుశా సుమారు క్రీ.శ. 100; క్రైస్తవ చేర్పులు బహుశా క్రీ.శ. 2–3 శతాబ్దాలు.
    Didache:
      display_name: దిదాఖే
      author: రచయిత తెలియదు (ఈ శీర్షికకు “పన్నెండు అపొస్తలుల బోధ” అని అర్థం).
      audience: తొలి క్రైస్తవ సంఘాలు—నైతిక జీవితం, బాప్తిస్మం, ప్రభుభోజనం, సంచార బోధకుల గురించి సంక్షిప్త మార్గదర్శిని.
      date: బహుశా క్రీ.శ. 1వ శతాబ్దం చివరి నుంచి 2వ శతాబ్దం ఆరంభం వరకు.
    Gospel of Thomas:
      display_name: తోమా సువార్త
      author: రచయిత తెలియదు; ప్రారంభ వాక్యం ఈ సూక్తుల సంకలనాన్ని “దిదుమోస్ యూదా తోమా”కు ఆపాదిస్తుంది. ఇది సంపూర్ణంగా లభించేది నాగ్ హమ్మాదీ నుంచి దొరికిన 4వ శతాబ్దపు కాప్టిక్ అనువాదంలో మాత్రమే (NHC II,2); ఆక్సిరింకస్ నుంచి మూడు గ్రీకు శకలాలు కూడా లభించాయి.
      audience: సిరియా జ్ఞాన సంప్రదాయం, ఆదిమ జ్ఞానవాద ఆలోచనల ప్రభావం పొందిన క్రైస్తవ పాఠకులు; యేసు సూక్తుల్లోని అంతరార్థం ద్వారా తమను తాము తెలుసుకోవడంపై దృష్టి పెట్టినవారు.
      date: గ్రీకు మూలరచన బహుశా సుమారు క్రీ.శ. 50–140; కాప్టిక్ ప్రతిలిపి సుమారు క్రీ.శ. 340.
      summary: తోమా సువార్త యేసుకు ఆపాదించబడిన సూక్తుల సంకలనం. ఇందులో నిరంతర కథనం లేదు; సూక్తుల అర్థాన్ని కనుగొనమని ఇది పాఠకులను పదేపదే పిలుస్తుంది.
  chapter_titles:
    2 Baruch:
      '72':
        title: ప్రకాశవంతమైన జలాలు మెస్సీయ కాలాన్ని సూచిస్తాయి
      '73':
        title: శాంతియుగం కలహాలన్నిటినీ అంతం చేస్తుంది
      '74':
        title: నిర్మించేవారు శాంతిగా పంట కోస్తారు
      '75':
        title: బారూకు దేవుని కరుణను స్తుతిస్తాడు
      '76':
        title: ప్రజలు బారూకు బోధను కోరుతారు
      '77':
        title: బారూకు ప్రజలకు ధర్మశాస్త్రాన్ని గుర్తుచేస్తాడు
      '78':
        title: బారూకు చెరలో ఉన్నవారికి నిరీక్షణ సందేశం రాస్తాడు
      '79':
        title: సృష్టికర్త ప్రేమ మారదు
      '80':
        title: నెబుకద్నెజరు దాడి ముందే నిర్ణయించబడింది
      '81':
        title: బాధల్లో ఉన్నవారికి దేవుని కరుణ సమీపంలో ఉంది
      '82':
        title: దుష్ట జనాలు తీర్పును ఎదుర్కొంటాయి
      '83':
        title: మోషే, యిర్మీయా తీర్పుల గురించి హెచ్చరించారు
      '84':
        title: ధర్మశాస్త్రాన్ని జ్ఞాపకం ఉంచమని బారూకు ప్రోత్సహిస్తాడు
      '85':
        title: అంతం సమీపించింది; ఆజ్ఞలను స్వీకరించండి
      '86':
        title: సమావేశాల్లో ఉత్తరాన్ని బిగ్గరగా చదవండి
      '87':
        title: బోధించిన ఆజ్ఞలను గట్టిగా పట్టుకోండి
    2 Esdras:
      '1':
        title: ఇశ్రాయేలు తిరస్కారం గురించి దేవుడు విలపిస్తాడు
      '2':
        title: ఎజ్రా రాబోయే మహిమను చూస్తాడు
      '3':
        title: ఇశ్రాయేలు చరిత్రను తలచుకుంటూ ఎజ్రా ప్రార్థిస్తాడు
      '4':
        title: ఎజ్రా పరిమితులను యూరియేలు బోధిస్తాడు
      '5':
        title: రాబోయే భయానక పరిస్థితుల్లో ఎజ్రా వేడుకుంటాడు
      '6':
        title: సృష్టి దినాలను తలచుకుంటూ ఎజ్రా ప్రార్థిస్తాడు
      '7':
        title: ఎజ్రా అంతిమ తీర్పును చూస్తాడు
      '8':
        title: అవగాహన కోసం ఎజ్రా ప్రార్థిస్తాడు
      '9':
        title: సీయోను రాబోయే మహిమను ఎజ్రా చూస్తాడు
      '10':
        title: ఎజ్రా సీయోను మహిమను చూస్తాడు
      '11':
        title: గద్దల కల అంతాన్ని ముందే సూచిస్తుంది
      '12':
        title: ఎజ్రా సింహాన్ని, గద్దలను కలలో చూస్తాడు
      '13':
        title: సముద్రం నుంచి వచ్చిన మనిషి సృష్టిని విడిపిస్తాడు
      '14':
        title: నమ్మదగిన మాటలను పలకమని ప్రభువు ఆజ్ఞాపిస్తాడు
      '15':
        title: రాబోయే తీర్పు గురించి ప్రవక్త హెచ్చరిస్తాడు
      '16':
        title: దేవుని తీర్పులు భూమినీ సముద్రాన్నీ కుదిపివేస్తాయి
    Didache:
      '1':
        title: దేవుణ్ణి ప్రేమిస్తూ జీవమార్గాన్ని ఎంచుకోండి
      '2':
        title: చెడును విడిచి ఆజ్ఞలను పాటించండి
      '3':
        title: ప్రతి విధమైన చెడుకు దూరంగా పారిపోండి
      '4':
        title: దేవుని వాక్యాన్ని ఎల్లప్పుడూ గౌరవించండి
      '5':
        title: మరణమార్గం పాపానికి నడిపిస్తుంది
      '6':
        title: ఏమీ చేర్చకుండా బోధను అనుసరించండి
      '7':
        title: ప్రవహించే నీటిలో నమ్మకంగా బాప్తిస్మం ఇవ్వండి
      '8':
        title: నీతిమంతుడైన తండ్రికి ప్రార్థించండి
      '9':
        title: పాత్రకూ రొట్టెకూ కృతజ్ఞతలు
      '10':
        title: పరిశుద్ధ తండ్రికి కృతజ్ఞతార్పణ
      '11':
        title: నిజమైన బోధకులను, ప్రవక్తలను ఆహ్వానించండి
      '12':
        title: ప్రయాణికులకు సహాయం చేయండి, అయితే వారిని పరీక్షించండి
      '13':
        title: నిజమైన ప్రవక్తలను, బోధకులను ఆదరించండి
      '14':
        title: రొట్టె విరిచే ముందు పాపాలను ఒప్పుకోండి
      '15':
        title: యోగ్యులైన పర్యవేక్షకులను, పరిచారకులను నియమించండి
      '16':
        title: మెలకువగా ఉండండి; విశ్వాసం పరీక్షలను సహిస్తుంది
    Gospel of Thomas:
      '0':
        title: యేసు రహస్య సూక్తుల సంకలనం
      '1':
        title: యేసు నిగూఢ జ్ఞానాన్ని బోధిస్తాడు
      '2':
        title: రాజ్యం మీ లోపలా వెలుపలా ఉంది
      '3':
        title: రాజ్యం లోపలా వెలుపలా ఉంది
      '4':
        title: యేసు వినయాన్ని, జ్ఞానాన్ని బోధిస్తాడు
      '5':
        title: యేసు రహస్యాల గురించి మాట్లాడుతాడు
      '6':
        title: మనిషి తిన్న సింహం ధన్యమైనది
      '7':
        title: తెలివైన జాలరి పెద్ద చేపను ఎంచుకుంటాడు
      '8':
        title: తెలివైన జాలరి పెద్దదానిని ఎంచుకుంటాడు
      '9':
        title: విత్తేవాడు విత్తనాన్ని విస్తారంగా చల్లుతాడు
      '10':
        title: యేసు మండుతున్న అగ్నిని కాపాడుతాడు
      '11':
        title: గతించిపోవడం గురించి యేసు మాట్లాడుతాడు
      '12':
        title: యాకోబు శిష్యులకు నాయకత్వం వహిస్తాడు
      '13':
        title: ఉపవాసం, ప్రార్థన, దానధర్మం, పాపం
      '14':
        title: యేసు నిజమైన భక్తిని బోధిస్తాడు
      '15':
        title: మీ తండ్రియైన ఆయనను ఆరాధించండి
      '16':
        title: విభజన గురించి యేసు మాట్లాడుతాడు
      '17':
        title: ఆదిని కనుగొనేవాడు ధన్యుడు
      '18':
        title: యేసు ఆది, అంతాలను వివరిస్తాడు
      '19':
        title: రాజ్యం పెరిగే ఆవగింజ వంటిది
      '20':
        title: శిష్యుల ముగింపు గురించి మరియ అడుగుతుంది
      '21':
        title: శిష్యుల గురించి మరియ యేసును ప్రశ్నిస్తుంది
      '22':
        title: రాజ్యంలో ప్రవేశాన్ని యేసు వివరిస్తాడు
      '23':
        title: నిలిచే కొద్దిమందిని యేసు ఎన్నుకుంటాడు
      '24':
        title: మనిషిలోని వెలుగు ప్రకాశిస్తుంది
      '25':
        title: సోదరుణ్ణి మీ ప్రాణంలా ప్రేమించండి
      '26':
        title: వేషధారణ గురించి యేసు మాట్లాడుతాడు
      '27':
        title: ఉపవాసం ఆధ్యాత్మిక రాజ్యానికి నడిపిస్తుంది
      '28':
        title: మత్తులో ఉన్నవారి గురించి యేసు మాట్లాడుతాడు
      '29':
        title: ఆత్మను చూసి యేసు ఆశ్చర్యపడతాడు
      '30':
        title: దైవ సన్నిధి గురించి యేసు మాట్లాడుతాడు
      '31':
        title: ప్రవక్తకు తన ఊరిలో గుర్తింపు ఉండదు
      '32':
        title: ఎత్తైన కొండపై నిర్మించిన పట్టణం
      '33':
        title: మేడల మీద నుంచి వెలుగును ప్రకటించండి
      '34':
        title: గుడ్డివాడు గుడ్డివాణ్ణి నడిపిస్తే ఇద్దరూ పడిపోతారు
      '35':
        title: చేతులు కట్టి ఇంటిని స్వాధీనం చేసుకోవడం
      '36':
        title: రోజువారీ అవసరాల గురించి చింతించడం మానండి
      '37':
        title: సిగ్గు అనే వస్త్రాన్ని విడిచి సత్యాన్ని చూడండి
      '38':
        title: కోరుకున్న మాటల గురించి యేసు మాట్లాడుతాడు
      '39':
        title: పరిసయ్యులు జ్ఞానపు తాళంచెవులను దాచిపెడతారు
      '40':
