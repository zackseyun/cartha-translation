contract_version: 1
locale: te
source_catalog_sha256: ec74c36516f84fea14e3d62329a38731b464f113276935cab09aa146bdd1e82b
source_chunk_sha256: 2234ad9bba2a0363fc44301dd638a21b3c8a51c371675617ce854314b7a6a548
chunk_id: books-011
status: reviewed
payload:
  book_metadata:
    Luke:
      display_name: లూకా
      author: రచయిత పేరు తెలియదు; సంప్రదాయం ప్రకారం, పౌలు ప్రయాణ సహచరుడైన లూకా దీనిని రాశాడని చెబుతారు.
      audience: “థియొఫిలు”ను ఉద్దేశించి రాసిన ఈ గ్రంథం, చదువుకున్న గ్రీకు-రోమా క్రైస్తవ పాఠకుల కోసం ఉద్దేశించబడింది.
      date: సుమారు క్రీ.శ. 80–90.
    John:
      display_name: యోహాను
      author: రచయిత పేరు తెలియదు; సంప్రదాయం ప్రకారం, అపొస్తలుడైన యోహాను లేదా “ప్రియ శిష్యుడు” దీనిని రాశాడని చెబుతారు.
      audience: ప్రియ శిష్యుని సాక్ష్యం చుట్టూ ఏర్పడి, సమాజమందిరానికి చెందిన యూదా సంప్రదాయంతో ఉద్రిక్తతను ఎదుర్కొన్న ఒక క్రైస్తవ సమాజం.
      date: సుమారు క్రీ.శ. 90–110.
      summary: యోహాను, తండ్రిని బయలుపరచే నిత్య వాక్యంగా యేసును చూపిస్తాడు. యేసుపై నమ్మకం ఉంచడం ద్వారా ఆయన జీవాన్ని ఇస్తాడనీ, తన సూచక క్రియలు, మరణం, పునరుత్థానం ద్వారా మహిమపరచబడతాడనీ వివరిస్తాడు.
    Acts:
      display_name: అపొస్తలుల కార్యాలు
      author: రచయిత పేరు తెలియదు; లూకా సువార్తను రాసిన రచయితే దీనినీ రాశారు.
      audience: గ్రీకు-రోమా క్రైస్తవ పాఠకులు; థియొఫిలును ఉద్దేశించి రాసిన రచనలో ఇది రెండవ భాగం.
      date: సుమారు క్రీ.శ. 80–90.
    Romans:
      display_name: రోమీయులకు
      author: పౌలు; లేఖకుడైన తెర్తియు సహకారంతో.
      audience: రోమాలోని క్రైస్తవులు—ధర్మశాస్త్రం, తమ గుర్తింపు అనే విషయాల్లో ఉద్రిక్తతలు ఎదుర్కొన్న యూదా, యూదేతర విశ్వాసులు.
      date: సుమారు క్రీ.శ. 56–58; కొరింథు నుండి రాయబడింది.
  chapter_titles:
    Mark:
      '4':
        title: యేసు సముద్రతీరంలో ఉపమానాలు బోధిస్తాడు
      '5':
        title: యేసు యూదేతరుడైన మనిషిని స్వస్థపరుస్తాడు
      '6':
        title: యేసు ఐదువేల మందికి ఆహారం పెడతాడు
      '7':
        title: యేసు మానవ సంప్రదాయాలను ప్రశ్నిస్తాడు
      '8':
        title: యేసు నాలుగువేల మందికి ఆహారం పెడతాడు
      '9':
        title: యేసు తన మహిమను బయలుపరుస్తాడు
      '10':
        title: యేసు పిల్లలను రాజ్యంలోకి ఆహ్వానిస్తాడు
      '11':
        title: యేసు ప్రశంసల మధ్య యెరూషలేములో ప్రవేశిస్తాడు
      '12':
        title: యేసు చిక్కుప్రశ్నలకు జవాబిచ్చి బోధిస్తాడు
      '13':
        title: యేసు శ్రమకాలం గురించి బోధిస్తాడు
      '14':
        title: రాత్రివేళ యూదా యేసును అప్పగిస్తాడు
      '15':
        title: యేసు సిలువవేయబడి, శ్రద్ధగా సమాధి చేయబడతాడు
      '16':
        title: యేసు లేస్తాడు; స్త్రీలు ఆ వార్త చెబుతారు
    Luke:
      '1':
        title: దేవుడు రెండు అద్భుత జననాలను ప్రకటిస్తాడు
      '2':
        title: యేసు జననం ఆనందం తెస్తుంది
      '3':
        title: యోహాను యేసుకు మార్గం సిద్ధం చేస్తాడు
      '4':
        title: యేసు శోధనను ఎదిరించి సేవ ప్రారంభిస్తాడు
      '5':
        title: యేసు మనుషులను సమకూర్చే జాలరులను పిలుస్తాడు
      '6':
        title: యేసు పన్నెండు మంది అపొస్తలులను ఎన్నుకుంటాడు
      '7':
        title: యేసు శతాధిపతి సేవకుణ్ణి స్వస్థపరుస్తాడు
      '8':
        title: యేసు రాజ్యం గురించి ఉపమానాలు బోధిస్తాడు
      '9':
        title: యేసు సంపూర్ణ అంకితభావాన్ని కోరుతాడు
      '10':
        title: యేసు శిష్యులను పంపిస్తాడు
      '11':
        title: యేసు పట్టుదలతో ప్రార్థించడం నేర్పిస్తాడు
      '12':
        title: యేసు కపటత్వానికి వ్యతిరేకంగా హెచ్చరిస్తాడు
      '13':
        title: యేసు హెచ్చరిస్తాడు, స్వస్థపరుస్తాడు
      '14':
        title: యేసు వినయం, ఉదారత గురించి బోధిస్తాడు
      '15':
        title: యేసు తప్పిపోయిన పాపులను ఆహ్వానిస్తాడు
      '16':
        title: యేసు సంపదను పూజించడాన్ని ఖండిస్తాడు
      '17':
        title: యేసు శిష్యులను హెచ్చరించి, సేవ చేయమంటాడు
      '18':
        title: యేసు పట్టుదలతో ప్రార్థించడం గురించి బోధిస్తాడు
      '19':
        title: యేసు యెరికోలో జక్కయ్యను రక్షిస్తాడు
      '20':
        title: యేసు దేవాలయ నాయకులను ప్రశ్నిస్తాడు
      '21':
        title: విధవరాలి కానుక, రాబోయే శ్రమకాలం
      '22':
        title: యేసు ఒలీవల కొండపై ప్రార్థిస్తాడు
      '23':
        title: యేసు కొత్త సమాధిలో ఉంచబడతాడు
      '24':
        title: యేసు లేచి, క్షమాపణను ప్రకటిస్తాడు
    John:
      '1':
        title: వాక్యం శరీరధారి అవుతుంది
      '2':
        title: యేసు నీటిని ద్రాక్షారసంగా మారుస్తాడు
      '3':
        title: దేవుడు తన ప్రియ కుమారుణ్ణి ఇస్తాడు
      '4':
        title: యేసు సమరయ స్త్రీని కలుస్తాడు
      '5':
        title: యేసు విశ్రాంతి దినాన ఒక మనిషిని స్వస్థపరుస్తాడు
      '6':
        title: యేసు జనసమూహంలోని ఐదువేల మందికి ఆహారం పెడతాడు
      '7':
        title: యేసు పండుగలో బోధిస్తాడు
      '8':
        title: లోకానికి వెలుగైన యేసు తిరస్కరించబడతాడు
      '9':
        title: యేసు పుట్టుగుడ్డివాణ్ణి స్వస్థపరుస్తాడు
      '10':
        title: యేసు తన గొర్రెల గురించి మాట్లాడుతాడు
      '11':
        title: యేసు లాజరును మృతులలోనుండి లేపుతాడు
      '12':
        title: మరియ యేసు సమాధి కోసం ఆయనకు అభిషేకం చేస్తుంది
      '13':
        title: యేసు శిష్యుల పాదాలు కడుగుతాడు
      '14':
        title: యేసు పరిశుద్ధాత్మను వాగ్దానం చేస్తాడు
      '15':
        title: నిజమైన ద్రాక్షావల్లియైన యేసు కొమ్మలను శుద్ధి చేస్తాడు
      '16':
        title: కష్టాలు వస్తాయి, అయినా ఆనందం నిలుస్తుంది
      '17':
        title: యేసు తన శిష్యుల కోసం ప్రార్థిస్తాడు
      '18':
        title: యేసు బంధించబడతాడు; పేతురు ఆయనను ఎరుగనంటాడు
      '19':
        title: యేసు కొరడాలతో కొట్టబడి, అపహసించబడి, సిలువవేయబడతాడు
      '20':
        title: యేసు మరియకు ప్రత్యక్షమవుతాడు
      '21':
        title: యేసు సముద్రతీరంలో పేతురును పునరుద్ధరిస్తాడు
    Acts:
      '1':
        title: సాక్షులు ఆత్మ కోసం వేచివుంటారు
      '2':
        title: పరిశుద్ధాత్మ పెంతెకొస్తును జ్వలింపజేస్తాడు
      '3':
        title: పేతురు కుంటి బిచ్చగాణ్ణి స్వస్థపరుస్తాడు
      '4':
        title: అపొస్తలులు పరిశుద్ధ ధైర్యంతో మాట్లాడుతారు
      '5':
        title: తీర్పు, అద్భుతాలు సంఘాన్ని పరీక్షిస్తాయి
      '6':
        title: ఏడుగురు సేవకులు సంఘానికి తోడ్పడతారు
      '7':
        title: తెరచిన పరలోకాన్ని స్తెఫను చూస్తాడు
      '8':
        title: సువార్త సమరయకు చేరుతుంది
      '9':
        title: సౌలు లేచిన యేసును ఎదుర్కొంటాడు
      '10':
        title: యూదేతరులు పరిశుద్ధాత్మను పొందుతారు
      '11':
        title: యూదేతరులను చేర్చుకోవడాన్ని పేతురు సమర్థిస్తాడు
      '12':
        title: ఒక దేవదూత పేతురును విడిపిస్తాడు
      '13':
        title: పౌలు యూదేతరుల మధ్య సేవను ప్రారంభిస్తాడు
      '14':
        title: హింసల మధ్య పౌలు పట్టుదలగా కొనసాగుతాడు
      '15':
        title: యెరూషలేము సభ యూదేతరులను ఆహ్వానిస్తుంది
      '16':
        title: ఆరాధన చెరసాలను తెరుస్తుంది
      '17':
        title: పౌలు తెలియని దేవుణ్ణి ప్రకటిస్తాడు
      '18':
        title: సువార్త కొరింథుకు చేరుతుంది
      '19':
        title: అర్తెమి విషయంగా ఎఫెసులో అల్లర్లు చెలరేగుతాయి
      '20':
        title: పౌలు కన్నీటితో పెద్దలకు వీడ్కోలు చెబుతాడు
      '21':
        title: పౌలు యెరూషలేముకు తిరిగివస్తాడు
      '22':
        title: పౌలు తన పిలుపును సమర్థించుకుంటాడు
      '23':
        title: పౌలు మహాసభ ఎదుట నిలుస్తాడు
      '24':
        title: పౌలు ఫేలిక్సు ఎదుట సాక్ష్యమిస్తాడు
      '25':
        title: పౌలు కైసరుకు విజ్ఞప్తి చేస్తాడు
      '26':
        title: పౌలు అగ్రిప్ప ఎదుట సాక్ష్యమిస్తాడు
      '27':
        title: ఓడ పగిలినా దేవుడు పౌలును కాపాడుతాడు
      '28':
        title: సువార్త రోమాకు చేరుతుంది
    Romans:
      '1':
        title: పౌలు యేసు ద్వారా కలిగే నీతిని ప్రకటిస్తాడు
      '2':
        title: పక్షపాతం లేకుండా తీర్పు వస్తుంది
      '3':
        title: అందరూ పాపదోషానికి లోనయ్యారు
      '4':
        title: అబ్రాహాము విశ్వాసం ద్వారానే నీతిమంతుడిగా తీర్చబడ్డాడు
      '5':
        title: క్రీస్తు మరణం ద్వారా నీతి
      '6':
        title: పాపం కోసం కాదు, దేవుని కోసం జీవించండి
      '7':
        title: విశ్వాసులు పాపంతో పోరాడుతారు
      '8':
        title: క్రీస్తు నుండి మనలను ఏదీ వేరుచేయదు
      '9':
