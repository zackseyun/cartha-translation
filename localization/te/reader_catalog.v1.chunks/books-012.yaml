source_chunk_sha256: e9159b14e0bcb28c7d8a4e14e18bbab42efee6ec8ac4ae35f049bdb21c9b0486
chunk_id: books-012
status: reviewed
payload:
  book_metadata:
    1 Corinthians:
      display_name: 1 కొరింథీయులకు
      author: పౌలు, సొస్తెనేసుతో కలిసి.
      audience: కొరింథులో కలహాలతో విభేదిస్తున్న క్రైస్తవ సంఘం.
      date: సుమారు క్రీ.శ. 53–55; ఎఫెసు నుండి రాయబడింది.
    2 Corinthians:
      display_name: 2 కొరింథీయులకు
      author: పౌలు, తిమోతితో కలిసి.
      audience: బాధాకరమైన ఒక ఘర్షణ తర్వాత కొరింథు సంఘానికి.
      date: సుమారు క్రీ.శ. 55–56.
    Galatians:
      display_name: గలతీయులకు
      author: పౌలు.
      audience: సున్నతి చేయించుకొని తోరా ధర్మశాస్త్రాన్ని పాటించాలనే ఒత్తిడిని ఎదుర్కొంటున్న గలతియలోని (మధ్య అనటోలియా) క్రైస్తవ సంఘాలు.
      date: సుమారు క్రీ.శ. 48–55 (వివాదాస్పదం).
    Ephesians:
      display_name: ఎఫెసీయులకు
      author: పౌలు, లేదా పౌలు పేరుతో రాసిన ఆయన సన్నిహిత శిష్యుడు (వివాదాస్పదం).
      audience: ఆసియా ప్రాంతంలోని క్రైస్తవ పాఠకులందరికీ; అతి ప్రాచీన ప్రతుల్లో "ఎఫెసు" అనే స్థలనామం లేదు.
      date: పౌలు రాసినదైతే సుమారు క్రీ.శ. 60లలో; మారుపేరుతో రాసినదైతే సుమారు క్రీ.శ. 80–90లలో.
    Philippians:
      display_name: ఫిలిప్పీయులకు
      author: పౌలు, తిమోతితో కలిసి.
      audience: మాసిదోనియలోని రోమా వలసపట్టణమైన ఫిలిప్పీలో ఉన్న క్రైస్తవ సంఘం.
      date: సుమారు క్రీ.శ. 60–62; చెరసాల నుండి రాయబడింది.
    Colossians:
      display_name: కొలొస్సయులకు
      author: పౌలు, తిమోతితో కలిసి—లేదా పౌలు పేరుతో ఆయన సన్నిహిత శిష్యుడు (వివాదాస్పదం).
      audience: లైకుస్ లోయలోని కొలొస్సయిలో, మిశ్రమ మతబోధను ఎదుర్కొంటున్న క్రైస్తవులు.
      date: పౌలు రాసినదైతే సుమారు క్రీ.శ. 60–62; మారుపేరుతో రాసినదైతే ఆ తర్వాత కాలంలో.
    1 Thessalonians:
      display_name: 1 థెస్సలొనీకయులకు
      author: పౌలు, సిల్వాను, తిమోతితో కలిసి.
      audience: హింసను ఎదుర్కొంటున్న థెస్సలొనీకలోని కొత్త క్రైస్తవ సంఘం.
      date: సుమారు క్రీ.శ. 50–51—బహుశా నేటికీ నిలిచి ఉన్న పౌలు పత్రికల్లో అత్యంత ప్రాచీనమైనది.
    2 Thessalonians:
      display_name: 2 థెస్సలొనీకయులకు
      author: పౌలు (వివాదాస్పదం; కొందరు పండితులు ఇది మారుపేరుతో రాయబడిందని భావిస్తారు).
      audience: అంత్యకాల విషయాల్లోని గందరగోళాన్ని ఉద్దేశించి థెస్సలొనీక సంఘానికి.
      date: పౌలు రాసినదైతే సుమారు క్రీ.శ. 51.
    1 Timothy:
      display_name: 1 తిమోతికి
      author: పౌలు, లేదా పౌలు పేరుతో రాసిన ఒక శిష్యుడు (కాపరి పత్రికలు మారుపేరుతో రాయబడ్డాయని విస్తృతంగా భావిస్తారు).
      audience: ఎఫెసులో పౌలు ప్రతినిధిగా ఉన్న తిమోతికి; అనంతర కాలపు సంఘ వ్యవస్థకు మార్గదర్శక గ్రంథం.
      date: పౌలు రాసినదైతే సుమారు క్రీ.శ. 60ల మధ్యకాలం; మారుపేరుతో రాసినదైతే సుమారు క్రీ.శ. 90–110.
    2 Timothy:
      display_name: 2 తిమోతికి
      author: పౌలు, లేదా పౌలు పేరుతో రాసిన ఒక శిష్యుడు.
      audience: తిమోతికి—చెరసాల నుండి పౌలు చెప్పిన వీడ్కోలు సందేశంగా రూపొందించబడింది.
      date: పౌలు రాసినదైతే సుమారు క్రీ.శ. 60ల మధ్యకాలం; మారుపేరుతో రాసినదైతే సుమారు క్రీ.శ. 90–110.
    Titus:
      display_name: తీతుకు
      author: పౌలు, లేదా పౌలు పేరుతో రాసిన ఒక శిష్యుడు.
      audience: క్రేతులో పౌలు ప్రతినిధిగా ఉన్న తీతుకు.
      date: పౌలు రాసినదైతే సుమారు క్రీ.శ. 60ల మధ్యకాలం; మారుపేరుతో రాసినదైతే సుమారు క్రీ.శ. 90–110.
    Philemon:
      display_name: ఫిలేమోనుకు
      author: పౌలు, తిమోతితో కలిసి.
      audience: క్రైస్తవుడైన బానిస యజమాని ఫిలేమోనుకు, పారిపోయిన అతని బానిస ఒనేసిము గురించి.
      date: సుమారు క్రీ.శ. 60–62.
    Hebrews:
      display_name: హెబ్రీయులకు
      author: రచయిత ఎవరో తెలియదు. సంప్రదాయం పౌలు, అపొల్లో, బర్నబా, ప్రిస్కిల్ల తదితరుల పేర్లను సూచించింది; ఏ ప్రతిపాదనకూ ఏకాభిప్రాయం లేదు.
      audience: తమ క్రైస్తవ విశ్వాస ప్రకటన నుండి వెనుదిరగడానికి మొగ్గుచూపుతున్న గ్రీకు భాష మాట్లాడే యూదు క్రైస్తవులు.
      date: సుమారు క్రీ.శ. 60–95.
  chapter_titles:
    Romans:
      '11':
        title: కృపచేత పిలువబడిన యూదేతరులు
      '12':
        title: జీవితాలను సజీవ బలిగా అర్పించండి
      '13':
        title: అధికారులకు లోబడండి, ప్రేమించండి
      '14':
        title: విశ్వాసంలో బలహీనులను ఆహ్వానించడం
      '15':
        title: యూదులను, యూదేతరులను ఏకం చేయండి
      '16':
        title: అభివందనాలు, హెచ్చరికలు ఇవ్వబడ్డాయి
    1 Corinthians:
      '1':
        title: అందరికీ దేవుని నమ్మకమైన సమృద్ధి
      '2':
        title: దేవుని ఆత్మ బయలుపరచిన జ్ఞానం
      '3':
        title: కొరింథీయులు దేవుని ఆలయమని పౌలు హెచ్చరిక
      '4':
        title: గర్వం కంటే నమ్మకత్వమే ముఖ్యం
      '5':
        title: సంఘ క్రమశిక్షణను ఆదేశించిన పౌలు
      '6':
        title: వివాదాలను సంఘంలోనే పరిష్కరించండి
      '7':
        title: వివాహాన్ని గౌరవించాలని పౌలు బోధ
      '8':
        title: వ్యక్తిగత స్వేచ్ఛ కంటే ప్రేమ గొప్పది
      '9':
        title: తన అపొస్తలత్వాన్ని సమర్థించిన పౌలు
      '10':
        title: దేవుని ప్రజలకు ఇశ్రాయేలు హెచ్చరిక
      '11':
        title: ఆరాధనలో ఐక్యత క్రీస్తును ఘనపరుస్తుంది
      '12':
        title: ఆత్మ వరాలు సంఘ ఐక్యతను నిర్మిస్తాయి
      '13':
        title: ప్రేమ ఎన్నటికీ విడిచిపెట్టదు
      '14':
        title: ప్రదర్శన కంటే ప్రేమకే ప్రాధాన్యమివ్వాలని పౌలు ఉద్బోధ
      '15':
        title: క్రీస్తు లేస్తాడు, మరణం ఓడిపోతుంది
      '16':
        title: కానుకలు, ప్రయాణ ప్రణాళికల చర్చ
    2 Corinthians:
      '1':
        title: బాధల్లో దేవుని ఆదరణ
      '2':
        title: ప్రేమ, క్షమాపణలకు పిలుపు
      '3':
        title: మారిన జీవితాలే పరిచర్యకు ముద్ర
      '4':
        title: క్రీస్తు మహిమను ప్రకటించడం
      '5':
        title: పరిచర్యను నడిపించే క్రీస్తు ప్రేమ
      '6':
        title: దేవుని కోసం బాధలను సహించండి
      '7':
        title: భయభక్తులతో పవిత్రతను అనుసరించండి
      '8':
        title: ఇవ్వడానికి ప్రేరేపించే మాసిదోనియ కృప
      '9':
        title: పరిశుద్ధుల కోసం సంతోషంగా ఇవ్వండి
      '10':
        title: క్రీస్తు సాత్వికతతో చేసిన విన్నపం
      '11':
        title: నమ్మకమైన జీవితం కోసం ఆసక్తి
      '12':
        title: బలహీనతలోను కృపలోను అతిశయించండి
      '13':
        title: పాపం ఉందేమో మనల్ని మనం పరీక్షించుకుందాం
    Galatians:
      '1':
        title: తన సువార్తను సమర్థించిన పౌలు
      '2':
        title: పేతురు తప్పును ఎదిరించిన పౌలు
      '3':
        title: అబ్రాహాము విశ్వాసం నీతిమంతునిగా తీర్చింది
      '4':
        title: ధర్మశాస్త్రం నుండి మనలను విడిపించే క్రీస్తు
      '5':
        title: ధర్మశాస్త్రం వల్ల కాదు, విశ్వాసం వల్ల జీవించండి
      '6':
        title: ఒకరి భారాలను మరొకరు మోయండి
    Ephesians:
      '1':
        title: విశ్వాసుల్లో ముద్రించబడిన దేవుని కృప
      '2':
        title: అందరికీ శాంతి తెచ్చే క్రీస్తు
      '3':
        title: సువార్త ద్వారా బయలుపడిన మర్మం
      '4':
        title: క్రీస్తు శరీరంలో ఐక్యత కోసం ప్రార్థన
      '5':
        title: దేవుణ్ణి అనుకరించి జ్ఞానంతో నడుచుకోండి
      '6':
        title: పిల్లలారా, తల్లిదండ్రులకు లోబడి వారిని గౌరవించండి
    Philippians:
      '1':
        title: ఫిలిప్పీయుల కోసం పౌలు ప్రార్థన
      '2':
        title: తన్నుతాను తగ్గించుకొని హెచ్చింపబడిన యేసు
      '3':
        title: క్రీస్తును తెలుసుకోవడంలో ఆనందించండి
      '4':
        title: ఆనందంతో స్థిరంగా నిలబడండి
    Colossians:
      '1':
        title: కొలొస్సయుల విశ్వాసం కోసం పౌలు ప్రార్థన
      '2':
        title: క్రీస్తులో నిలవమని విశ్వాసులను ప్రోత్సహించిన పౌలు
      '3':
        title: పాపాన్ని అధిగమించి ప్రేమతో జీవించండి
      '4':
        title: సంకెళ్లలోనూ ప్రార్థించి ప్రోత్సహించిన పౌలు
    1 Thessalonians:
      '1':
        title: కృప, శాంతి, విశ్వాసం, ప్రేమ, నిరీక్షణ
      '2':
        title: పవిత్ర ఉద్దేశాలతో ధైర్యంగా ప్రకటించడం
      '3':
        title: బాధల్లో ప్రోత్సహించిన తిమోతి
      '4':
        title: పవిత్ర జీవితం కోసం పౌలు ప్రోత్సాహం
      '5':
        title: మెలకువగా ఉండి రక్షణ కోసం ఎదురుచూడండి
    2 Thessalonians:
      '1':
