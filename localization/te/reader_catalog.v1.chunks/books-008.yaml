chunk_id: books-008
status: reviewed
payload:
  book_metadata:
    Isaiah:
      display_name: యెషయా
      author: అనేక శతాబ్దాల కాలంలో పలువురు రచయితలు; 1–39 అధ్యాయాలు క్రీ.పూ. 8వ శతాబ్దపు యెరూషలేము యెషయాలో మూలాలను కలిగివున్నాయి; 40–55 అధ్యాయాలు ("రెండవ యెషయా"), 56–66 అధ్యాయాలు ("మూడవ యెషయా") చెరకు, తిరిగివచ్చుటకు ప్రతిస్పందిస్తాయి.
      audience: వరుసగా అష్షూరు ముప్పును ఎదుర్కొన్న యూదా, బబులోను చెరలోని యూదా, చెర అనంతర పునరుద్ధరణలోని యూదా.
      date: సుమారు క్రీ.పూ. 8వ శతాబ్దం చివరి నుంచి 5వ శతాబ్దం వరకు రచించబడింది.
    Jeremiah:
      display_name: యిర్మీయా
      author: అనాతోతుకు చెందిన యిర్మీయా; అతని లేఖకుడు బారూకు మరియు తర్వాతి చేతులచే గణనీయంగా సంపాదించబడింది.
      audience: బబులోను జయానికి ముందు, ఆ జయం జరుగుతున్నప్పుడు, ఆ తర్వాత యూదాలో ఉన్న ప్రజలు.
      date: క్రీ.పూ. 7వ శతాబ్దం చివరి నుంచి 6వ శతాబ్దం ఆరంభం వరకు.
  chapter_titles:
    Isaiah:
      '1':
        title: తిరుగుబాటు చేసిన యూదాను దేవుడు తిరస్కరిస్తాడు
      '2':
        title: యెహోవా మందిరం అన్నిటికంటే ఉన్నతంగా నిలుస్తుంది
      '3':
        title: తీర్పు దేశ పతనానికి దారితీస్తుంది
      '4':
        title: నాశనం తర్వాత పునరుద్ధరణ వాగ్దానం
      '5':
        title: ప్రభువు ద్రాక్షతోట హింసను ఫలిస్తుంది
      '6':
        title: దేవుని మహోన్నత మహిమను చూసిన యెషయా
      '7':
        title: అష్షూరు రాకముందే ఇమ్మానుయేలు జన్మిస్తాడు
      '8':
        title: మహేరు-షాలాల్-హాష్-బజ్ అనే పేరు తీర్పును సూచిస్తుంది
      '9':
        title: వెలుగు యెషయాకు నిరీక్షణ తెస్తుంది
      '10':
        title: గర్విష్ఠి అష్షూరుకు దేవుని తీర్పు
      '11':
        title: కొత్త రాజు భూమిపై శాంతిని తెస్తాడు
      '12':
        title: దేవుని ప్రజలు తమ రక్షణకై స్తుతిస్తారు
      '13':
        title: బబులోను సంపూర్ణ నాశనాన్ని ఎదుర్కొంటుంది
      '14':
        title: పతనమైన బబులోను రాజును ఇశ్రాయేలు ఎగతాళి చేస్తుంది
      '15':
        title: మోయాబుకు ఆకస్మికమైన ఘోర విపత్తు
      '16':
        title: మోయాబు గర్వం తీవ్రమైన తీర్పుకు దారితీస్తుంది
      '17':
        title: దమస్కు, ఎఫ్రాయిము పూర్తిగా దోచుకోబడతాయి
      '18':
        title: దూరదేశం సందేశకులను సుదూర ప్రాంతాలకు పంపుతుంది
      '19':
        title: ఐగుప్తు అవమానం తర్వాత స్వస్థత పొందుతుంది
      '20':
        title: యెషయా సూచనగా వస్త్రాలు తీసివేసి నడుస్తాడు
      '21':
        title: బబులోను హఠాత్తుగా కూలిపోతుంది, విందు ముగుస్తుంది
      '22':
        title: యెరూషలేము కోలాహలం తీర్పుకు దారితీస్తుంది
      '23':
        title: తూరు సంపద, అధికారం కూలిపోతాయి
      '24':
        title: భూమి అంతటినీ కమ్మే సంపూర్ణ తీర్పు
      '25':
        title: యెహోవా విందు ఇస్తాడు, మరణాన్ని తొలగిస్తాడు
      '26':
        title: దేవుడు తన ప్రజలను సురక్షితంగా కాపాడుతాడు
      '27':
        title: లెవియాతాను ఓడిపోతుంది, ఇశ్రాయేలు కాపాడబడుతుంది
      '28':
        title: గర్విష్ఠులైన నాయకులు దేవుని వాక్యాన్ని ఎగతాళి చేస్తారు
      '29':
        title: ముట్టడిలో యెరూషలేము అణచివేయబడుతుంది
      '30':
        title: ఐగుప్తును నమ్మిన యూదా నాశనాన్ని ఎదుర్కొంటుంది
      '31':
        title: దేవుడే సీయోను కోసం పోరాడుతాడు
      '32':
        title: నీతిమంతుడైన రాజు న్యాయాన్ని స్థాపిస్తాడు
      '33':
        title: హింస దుష్టుల మీదికే తిరిగి వస్తుంది
      '34':
        title: ఎదోముకు యెహోవా తీవ్రమైన తీర్పు
      '35':
        title: అరణ్యం మహిమతో వికసిస్తుంది
      '36':
        title: యూదా నమ్మకాన్ని రబ్షాకే ఎగతాళి చేస్తాడు
      '37':
        title: హిజ్కియా ప్రార్థిస్తాడు, దేవుడు జవాబిస్తాడు
      '38':
        title: హిజ్కియా అనారోగ్యం, స్వస్థత
      '39':
        title: హిజ్కియా సంపదలను చూసిన బబులోనీయులు
      '40':
        title: దేవుని ప్రజలకు ఆదరణ వస్తుంది
      '41':
        title: యెహోవా ఒక్కడే చరిత్రను పరిపాలిస్తాడు
      '42':
        title: సేవకుడు సౌమ్యంగా న్యాయాన్ని స్థాపిస్తాడు
      '43':
        title: ఇశ్రాయేలుతో ఎల్లప్పుడూ ఉంటానని దేవుని వాగ్దానం
      '44':
        title: యెహోవా ఒక్కడే నిజమైన దేవుడు
      '45':
        title: ఇశ్రాయేలును విడిపించడానికి కోరెషు ఎంపిక
      '46':
        title: ఇశ్రాయేలును జీవితమంతా మోసే యెహోవా
      '47':
        title: ప్రతీకారానికి గురై బబులోను పతనమవుతుంది
      '48':
        title: ఇశ్రాయేలు మొండితనం నిలదీయబడుతుంది
      '49':
        title: సేవకుని కార్యం ఎంతో విస్తృతమైనది
      '50':
        title: బాధల్లోనూ నమ్మకముంచే సేవకుడు
      '51':
        title: అబ్రాహాము నమ్మకత్వాన్ని జ్ఞాపకం చేసుకోండి
      '52':
        title: చెర నుంచి యెరూషలేము మేల్కొంటుంది
      '53':
        title: బాధలు అనుభవించే సేవకుడు పాపాన్ని మోస్తాడు
      '54':
        title: విడిచిపెట్టబడిన తన వధువును దేవుడు పునరుద్ధరిస్తాడు
      '55':
        title: రండి, జీవాన్ని ఉచితంగా పొందండి
      '56':
        title: నమ్మకమైన విదేశీ ఆరాధకులను దేవుడు ఆహ్వానిస్తాడు
      '57':
        title: నీతిగా జీవించండి, రక్షణ సమీపంలో ఉంది
      '58':
        title: దేవుని ప్రజలు పునరుద్ధరించబడతారు
      '59':
        title: న్యాయాన్ని, కరుణను నిజంగా అనుసరించండి
      '60':
        title: సీయోనుకు సహాయం చేయడానికి విమోచకుడు వస్తాడు
      '61':
        title: స్వస్థపరచడానికి సేవకుణ్ణి దేవుడు అభిషేకిస్తాడు
      '62':
        title: సీయోనును ఘనపరుస్తానని యెహోవా ప్రమాణం చేస్తాడు
      '63':
        title: యోధుడైన దేవుడు ఉగ్రతతో తిరిగి వస్తాడు
      '64':
        title: పరిశుద్ధ దేవుడు తిరిగి రావాలని ప్రార్థన
      '65':
        title: నమ్మకమైన శేషజనానికి కొత్త ఆకాశాలు
      '66':
        title: ప్రభువు సీయోనుకు తీర్పుతీర్చి దాన్ని పునరుద్ధరిస్తాడు
    Jeremiah:
      '1':
        title: యిర్మీయాను ప్రవక్తగా నియమించిన దేవుడు
      '2':
        title: జీవజలాన్ని విడిచిపెట్టిన యెరూషలేము
      '3':
        title: నమ్మకమైన దేవుని దగ్గరకు ఇశ్రాయేలు తిరిగి వస్తుంది
      '4':
        title: రాబోయే తీర్పును ఎదుర్కొంటున్న యూదా
      '5':
        title: అవినీతితో నిండిన యెరూషలేము
      '6':
        title: ఉత్తరం నుంచి సైన్యం వస్తుంది
      '7':
        title: దేవాలయం దగ్గర యిర్మీయా హెచ్చరిక
      '8':
        title: యూదా మీద తీర్పు పూర్తయింది
      '9':
        title: ప్రజలు ద్రోహంతో నిండిపోయారు
      '10':
        title: విగ్రహాలు మనుషులు చేసినవి, వ్యర్థమైనవి
      '11':
        title: యూదా నిబంధనను ఉల్లంఘించింది
      '12':
        title: దుష్టులు ఎందుకు వర్ధిల్లుతున్నారు?
      '13':
        title: గర్వం వల్ల యూదా పనికిరాకుండా పోతుంది
      '14':
        title: కరవుతో యూదాలో తీవ్ర నిరాశ
      '15':
        title: తీర్పు ఇప్పుడు తప్పించుకోలేనిది
      '16':
        title: యూదా మీదికి భయంకరమైన తీర్పు వస్తుంది
      '17':
        title: దేవుని తీర్పును ఎదుర్కొంటున్న యూదా
      '18':
        title: మొండి యూదాను హెచ్చరించిన యిర్మీయా
      '19':
        title: నగరం మీదికి భయంకరమైన తీర్పు వస్తుంది
      '20':
        title: యిర్మీయా తీర్పును ప్రకటిస్తాడు
      '21':
        title: సహాయం కోరిన సిద్కియా రాజు
      '22':
        title: న్యాయం, కరుణతో పరిపాలించండి
      '23':
        title: అబద్ధ కాపరులకు దేవుని తీర్పు
      '24':
        title: మంచి అంజూరపు పండ్లు చెరలోని ప్రజలకు ప్రతీక
      '25':
        title: నెబుకద్నెజరు యూదా మీదికి వస్తాడు
      '26':
        title: దేవాలయంలో యిర్మీయా హెచ్చరిక
      '27':
        title: బబులోను పాలనకు లోబడండి
      '28':
        title: అబద్ధ ప్రవచనం వల్ల హనన్యా మరణిస్తాడు
      '29':
        title: బబులోనులోని చెరప్రజలను యిర్మీయా హెచ్చరిస్తాడు
      '30':
        title: భవిష్యత్తు విమోచన గురించి దేవుని వాగ్దానం
      '31':
        title: ఇశ్రాయేలు పునరుద్ధరణ గురించి దేవుని వాగ్దానం
      '32':
        title: నిరీక్షణతో పొలం కొన్న యిర్మీయా
review:
  verdict: revise
  review_summary: పూర్తి తెలుగు స్థానికీకరణను సరిచేశాను. ముఖ్యంగా యెషయా రచయితత్వ వివరణలోని మూలపాఠపు జాగ్రత్తైన చారిత్రక భాషను, యిర్మీయా సంపాదకత్వ వివరణను మరింత నిష్పాక్షికంగా చేశాను.
  issues:
