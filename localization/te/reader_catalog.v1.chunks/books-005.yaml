contract_version: 1
locale: te
source_catalog_sha256: ec74c36516f84fea14e3d62329a38731b464f113276935cab09aa146bdd1e82b
source_chunk_sha256: 5b60d3a15558b9f68c8e1dea8e7b364ae5906d8176acf3f2c721faf6d504696c
chunk_id: books-005
status: reviewed
payload:
  book_metadata:
    Ezra:
      display_name: ఎజ్రా
      author: రచయిత తెలియదు; దినవృత్తాంతాలు రాసిన వ్యక్తే దీనిని కూడా రాసి ఉండవచ్చు.
      audience: పర్షియా పాలనలో యెరూషలేమును పునర్నిర్మించడానికి తిరిగి వచ్చినవారు.
      date: సుమారు క్రీ.పూ. 5వ శతాబ్దం మధ్యకాలం నుంచి 4వ శతాబ్దం వరకు.
    Nehemiah:
      display_name: నెహెమ్యా
      author: రచయిత తెలియదు; నెహెమ్యా రాసినదిగా భావించే ప్రథమ పురుష స్మృతివివరణ ఇందులో భాగంగా ఉంది.
      audience: పర్షియా పాలనలో యెరూషలేము గోడలను పునర్నిర్మిస్తూ, నిబంధనను పునరుద్ధరిస్తున్న తిరిగి వచ్చినవారు.
      date: సుమారు క్రీ.పూ. 5వ శతాబ్దం మధ్యకాలం నుంచి 4వ శతాబ్దం వరకు.
    Esther:
      display_name: ఎస్తేరు
      author: రచయిత తెలియదు.
      audience: విదేశీ పాలనలో, ముఖ్యంగా పర్షియాలో, చెదరిపోయి నివసించిన యూదులు.
      date: సుమారు పర్షియా యుగం చివరిభాగం లేదా హెల్లెనీయ యుగం తొలిభాగం (క్రీ.పూ. 4వ–3వ శతాబ్దం).
    Job:
      display_name: యోబు
      author: రచయిత తెలియదు.
      audience: నిర్దోషుల బాధను, దేవుని న్యాయాన్ని అర్థం చేసుకోవడానికి పోరాడుతున్న ఇశ్రాయేలీయులు.
      date: పురాతన జానపద విషయసామగ్రిని ఉపయోగించిన ఈ గ్రంథాన్ని జ్ఞానసాహిత్య సంప్రదాయంపై ఉన్న సాధారణ పండితాభిప్రాయం సుమారు క్రీ.పూ. 6వ–4వ శతాబ్దానికి చెందినదిగా భావిస్తుంది.
    Psalms:
      display_name: కీర్తనలు
      author: అనేక శతాబ్దాల కాలంలో పలువురు రచయితలు; పైశీర్షికలు దావీదు, ఆసాపు, కోరహు, సొలొమోను, మోషే తదితరుల పేర్లను పేర్కొంటాయి.
      audience: ఆరాధనలో ఉన్న ఇశ్రాయేలు ప్రజలు, దేవాలయ సమాజం—అలాగే తరువాతి కాలాల్లో ప్రార్థించే, విలపించే ప్రతి సమాజం.
      date: సుమారు క్రీ.పూ. 10వ–3వ శతాబ్దాల మధ్య రచించబడింది; చెర అనంతర కాలంలో తుది సంకలనం జరిగింది.
  chapter_titles:
    2 Chronicles:
      '20':
        title: శత్రువులపై యూదా విజయం
      '21':
        title: యెహోరాము తన సోదరులను హతమార్చడం
      '22':
        title: అహజ్యా చెడు మార్గాలను అనుసరించడం
      '23':
        title: యోవాషు తిరిగి రాజుగా నియమించబడడం
      '24':
        title: దేవాలయ పునరుద్ధరణ, ఆ తరువాత పతనం
      '25':
        title: అమజ్యా ఎదోమును ఓడించడం
      '26':
        title: ఉజ్జియా వర్ధిల్లడం అంతమవడం
      '27':
        title: యోతాము యూదాను బలపరచడం
      '28':
        title: ఆహాజు తీవ్రమైన అవిశ్వాసం
      '29':
        title: హిజ్కియా దేవాలయాన్ని తిరిగి తెరవడం
      '30':
        title: ఇశ్రాయేలీయులందరూ పస్కా ఆచరించడం
      '31':
        title: హిజ్కియా దేవాలయ ధనాగారాలను నింపడం
      '32':
        title: దూత బలంతో యెరూషలేముకు విమోచన
      '33':
        title: మనష్షే పశ్చాత్తాపపడి బలిపీఠాన్ని పునరుద్ధరించడం
      '34':
        title: యోషీయా ధర్మశాస్త్రాన్ని కనుగొని చదవడం
      '35':
        title: యోషీయా గొప్ప పస్కా పండుగను నిర్వహించడం
      '36':
        title: బబులోను శక్తికి యూదా పతనం
    Ezra:
      '1':
        title: దేవాలయ పునర్నిర్మాణానికి కోరెషు అనుమతి
      '2':
        title: చెరనుంచి తిరిగివచ్చినవారి జాబితా
      '3':
        title: భయంతోనే యెరూషలేములో బలిపీఠం పునర్నిర్మాణం
      '4':
        title: శత్రువులు దేవాలయ పునర్నిర్మాణాన్ని అడ్డుకోవడం
      '5':
        title: దేవాలయ పునర్నిర్మాణాన్ని దేవుడు నడిపించడం
      '6':
        title: దేవాలయ నిర్మాణాన్ని తిరిగి ప్రారంభించమని దర్యావేషు ఆజ్ఞ
      '7':
        title: ఎజ్రా దేవుని ధర్మశాస్త్రాన్ని బోధించడం
      '8':
        title: ఎజ్రా ప్రార్థించి క్షేమంగా తిరిగి రావడం
      '9':
        title: ఇశ్రాయేలీయుల పాపభరిత వివాహాలపై ఎజ్రా దుఃఖించడం
      '10':
        title: పాపభరిత వివాహాలను ఎజ్రా ఎదుర్కోవడం
    Nehemiah:
      '1':
        title: యెరూషలేము కోసం నెహెమ్యా ప్రార్థన
      '2':
        title: పునర్నిర్మాణానికి రాజు నెహెమ్యాను పంపడం
      '3':
        title: అందరూ కలిసి యెరూషలేము గోడలను నిర్మించడం
      '4':
        title: నెహెమ్యా యెరూషలేమును కాపాడడం
      '5':
        title: సామాజిక అన్యాయంపై నెహెమ్యా పోరాటం
      '6':
        title: దేవుని పనిని అడ్డుకోవడంలో శత్రువుల వైఫల్యం
      '7':
        title: నగర కాపలాదారుల, ప్రజల జాబితా
      '8':
        title: ఎజ్రా ధర్మశాస్త్రాన్ని చదవగా ప్రజలు ఏడవడం
      '9':
        title: ఇశ్రాయేలు దేవుని ఎదుట పాపాలను ఒప్పుకోవడం
      '10':
        title: ప్రజలు దేవునితో నిబంధన చేసుకోవడం
      '11':
        title: నాయకులు పరిశుద్ధ నగరంలో ప్రజలను నివసింపజేయడం
      '12':
        title: గోడ ప్రతిష్ఠను ఆరాధనతో వేడుక చేసుకోవడం
      '13':
        title: నెహెమ్యా దేవాలయాన్ని మళ్లీ శుద్ధి చేయడం
    Esther:
      '1':
        title: వష్తి రాణిని రాజు బహిష్కరించడం
      '2':
        title: ఎస్తేరు కొత్త రాణి కావడం
      '3':
        title: యూదులను నాశనం చేయాలని హామాను పన్నాగం
      '4':
        title: చర్య తీసుకోమని ఎస్తేరును మొర్దెకై కోరడం
      '5':
        title: రాజును, హామానును ఎస్తేరు ఆహ్వానించడం
      '6':
        title: మొర్దెకైని రాజు బహిరంగంగా సత్కరించడం
      '7':
        title: హామాను పన్నాగాన్ని ఎస్తేరు బయటపెట్టడం
      '8':
        title: హామాను అధికార స్థానాన్ని మొర్దెకై పొందడం
      '9':
        title: యూదులు తమను తాము విజయవంతంగా కాపాడుకోవడం
      '10':
        title: మొర్దెకై జ్ఞానంతో చక్కగా పరిపాలించడం
    Job:
      '1':
        title: అన్నీ కోల్పోయినా యోబు ఆరాధించడం
      '2':
        title: యోబు నమ్మకంగా బాధను సహించడం
      '3':
        title: తాను పుట్టిన రోజును యోబు శపించడం
      '4':
        title: యోబు విత్తినదానిపై ఎలీఫజు గద్దింపు
      '5':
        title: దేవుని వెదకమని యోబుకు ఎలీఫజు సలహా
      '6':
        title: తన భారమైన వేదనను యోబు వివరించడం
      '7':
        title: తన బాధ గురించి యోబు ఫిర్యాదు
      '8':
        title: యోబు బాధపై బిల్దదు గద్దింపు
      '9':
        title: దేవుని శక్తి ఎదుట యోబు విలాపం
      '10':
        title: నాతో ఎందుకు పోరాడుతున్నావని యోబు ప్రశ్న
      '11':
        title: జ్ఞానవాక్యాలతో యోబును జోఫరు గద్దించడం
      '12':
        title: స్నేహితుల వ్యర్థ మాటలను యోబు ఎగతాళి చేయడం
      '13':
        title: దేవుని ఎదుట యోబు సత్యం పలకడం
      '14':
        title: జీవితపు అశాశ్వతత్వంపై యోబు విలాపం
      '15':
        title: యోబుపై పాపారోపణ చేసిన ఎలీఫజు
      '16':
        title: దేవునికి యోబు మొరపెట్టుకోవడం
      '17':
        title: స్నేహితుల ఎగతాళితో యోబు నిరాశపడడం
      '18':
        title: దుష్టత్వపు అంతాన్ని బిల్దదు వివరించడం
      '19':
        title: తన విమోచకుని కోసం యోబు ఆశపడడం
      '20':
        title: దుష్టత్వపు నాశనాన్ని జోఫరు ప్రకటించడం
      '21':
        title: దుష్టులు వర్ధిల్లడంపై యోబు సవాలు
      '22':
        title: యోబుపై పాపాల ఆరోపణ చేసిన ఎలీఫజు
      '23':
        title: దేవుని కనుగొనాలని యోబు తపించడం
      '24':
        title: దుష్టులు కలిగించే బాధను యోబు వివరించడం
      '25':
        title: దేవుని అపార శక్తిని బిల్దదు స్తుతించడం
      '26':
        title: స్నేహితుల వ్యర్థ జ్ఞానాన్ని యోబు ఎగతాళి చేయడం
      '27':
        title: యోబు తన యథార్థతను విడువకపోవడం
      '28':
        title: భూసంబంధ సంపదలపై యోబు ఆలోచన
      '29':
        title: గౌరవం పొందిన రోజులను యోబు జ్ఞాపకం చేసుకోవడం
      '30':
        title: ఎగతాళికి, తీవ్రమైన నొప్పికి గురైన యోబు
      '31':
        title: తాను పూర్తిగా నిర్దోషినని యోబు ప్రమాణం
      '32':
        title: యోబుకు వ్యతిరేకంగా ఎలీహు మాట్లాడడం
      '33':
        title: వినయంతో పశ్చాత్తాపపడమని ఎలీహు కోరడం
      '34':
        title: దేవుని న్యాయాన్ని ఎలీహు సమర్థించడం
      '35':
        title: వ్యర్థ మాటల గురించి ఎలీహు హెచ్చరిక
      '36':
        title: దేవుని శక్తిని ఎలీహు ప్రకటించడం
      '37':
        title: దేవుని మహిమను ఎలీహు చూపించడం
      '38':
        title: యోబు జ్ఞానాన్ని దేవుడు సవాలు చేయడం
      '39':
        title: యోబు వివేకాన్ని దేవుడు ప్రశ్నించడం
      '40':
        title: తన అల్పత్వాన్ని యోబు ఒప్పుకోవడం
      '41':
        title: మానవ బలానికి లొంగని లివ్యాతాను
      '42':
