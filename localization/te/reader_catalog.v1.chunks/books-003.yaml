contract_version: 1
locale: te
source_catalog_sha256: ec74c36516f84fea14e3d62329a38731b464f113276935cab09aa146bdd1e82b
source_chunk_sha256: 8e6651b9989bcd70fcef32735a05cf2a4571cacc49a7e74c872bb43068a388e5
chunk_id: books-003
status: reviewed
payload:
  book_metadata:
    Judges:
      display_name: న్యాయాధిపతులు
      author: రచయిత తెలియదు; ద్వితీయోపదేశకాండ చరిత్రలో భాగం.
      audience: రాజరికానికి పూర్వం తమ గతంలో సంభవించిన మతభ్రష్టత, విమోచనాల పునరావృత క్రమాన్ని హెచ్చరికగా చదివిన తరువాతి కాలపు ఇశ్రాయేలు ప్రజలు.
      date: సుమారు క్రీ.పూ. 7వ–6వ శతాబ్దాలలో సంకలనం చేయబడింది.
    Ruth:
      display_name: రూతు
      author: రచయిత తెలియదు.
      audience: చెర అనంతర ఇశ్రాయేలు ప్రజలు—ఎజ్రా-నెహెమ్యా కాలంలోని ఇతరులను దూరంగా ఉంచే విధానాలకు వ్యతిరేకంగా విదేశీయులను చేర్చుకోవాలని బహుశా వాదిస్తూ ఉండవచ్చు.
      date: అత్యంత సంభావ్యంగా చెర అనంతర కాలానికి, సుమారు క్రీ.పూ. 6వ–4వ శతాబ్దాలకు చెందినది.
    1 Samuel:
      display_name: 1 సమూయేలు
      author: రచయిత తెలియదు; ద్వితీయోపదేశకాండ చరిత్రలో భాగం.
      audience: సమూయేలు, సౌలు, దావీదుల కాలంలో రాజరికం ఆవిర్భవించిన తీరును పరిశీలిస్తున్న ఇశ్రాయేలు ప్రజలు.
      date: పురాతన ఆధారాల నుంచి సుమారు క్రీ.పూ. 7వ–6వ శతాబ్దాలలో సంకలనం చేయబడింది.
    2 Samuel:
      display_name: 2 సమూయేలు
      author: రచయిత తెలియదు; ద్వితీయోపదేశకాండ చరిత్రలో భాగం.
      audience: రాజరికానికి పునాది నమూనాగా దావీదు పాలనలోని విజయాలను, విషాదాలను చదివిన ఇశ్రాయేలు ప్రజలు.
      date: సుమారు క్రీ.పూ. 7వ–6వ శతాబ్దాలలో సంకలనం చేయబడింది.
  chapter_titles:
    Joshua:
      '8':
        title: ఆయి పట్టుబడింది, ధర్మశాస్త్రం పునరుద్ధరించబడింది
      '9':
        title: శాంతి కోసం గిబియోనీయుల మోసం
      '10':
        title: యుద్ధంలో సూర్యుడు నిలిచిపోవడం
      '11':
        title: ఉత్తర ప్రాంతమంతటా ఇశ్రాయేలు విజయం
      '12':
        title: ఓడిపోయిన ముప్పై ఒక్క మంది రాజులు
      '13':
        title: స్వాధీనం చేసుకోవాల్సిన దేశం ఇంకా ఎంతో ఉంది
      '14':
        title: కాలేబు తన పర్వత నివాసాన్ని కోరడం
      '15':
        title: యూదా పట్టణాలు, నీటి ఊటలు స్వాధీనం
      '16':
        title: యొర్దానుకు పడమట ఎఫ్రాయిము దేశం
      '17':
        title: మనష్షే స్వాస్థ్యం, బాధ్యత
      '18':
        title: బెన్యామీను సరిహద్దులు, పట్టణాలు
      '19':
        title: లేవీయులకు వారి పట్టణాలు
      '20':
        title: నరహంతకుల కోసం ఆశ్రయ పట్టణాలు
      '21':
        title: యాజక సేవకు లేవీయుల ప్రత్యేక నియామకం
      '22':
        title: తూర్పు గోత్రాలు సాక్ష్యపు బలిపీఠం నిర్మించడం
      '23':
        title: నమ్మకమైన విధేయతకు యెహోషువ పిలుపు
      '24':
        title: ఎంపిక చేసుకోమని ఇశ్రాయేలుకు యెహోషువ పిలుపు
    Judges:
      '1':
        title: కనానీయులతో పోరాడేందుకు యూదా నాయకత్వం
      '2':
        title: ఇశ్రాయేలు ఉల్లంఘనను దూత గద్దించడం
      '3':
        title: ఒత్నీయేలు అరామును ఓడించడం
      '4':
        title: దెబోరా తీర్పు తీర్చి సీసెరాను ఓడించడం
      '5':
        title: విజయానికై దేవుణ్ణి స్తుతించిన దెబోరా
      '6':
        title: విశ్వాస విషయంలో గిద్యోను అంతర్మథనం
      '7':
        title: ఒంటరిగా మిద్యానును ఓడించిన గిద్యోను
      '8':
        title: సహాయం నిరాకరించిన పట్టణాలను గిద్యోను శిక్షించడం
      '9':
        title: షెకెమును హెచ్చరించిన యోతాము
      '10':
        title: విగ్రహారాధన తరువాత ఇశ్రాయేలును అణచివేసిన అమ్మోనీయులు
      '11':
        title: తన కుమార్తెను బలిగా అర్పిస్తానని యెఫ్తా మొక్కుకోవడం
      '12':
        title: షిబ్బోలెతు పరీక్షలో ఎఫ్రాయిమీయుల మరణం
      '13':
        title: సమ్సోను జననాన్ని వాగ్దానం చేసిన దూత
      '14':
        title: దవడ ఎముకతో ఫిలిష్తీయులను ఓడించిన సమ్సోను
      '15':
        title: ప్రతీకారంతో ఫిలిష్తీయులను చంపిన సమ్సోను
      '16':
        title: ఫిలిష్తీయుల దేవాలయాన్ని కూల్చిన సమ్సోను
      '17':
        title: సంచార యాజకుణ్ణి నియమించుకున్న మీకా
      '18':
        title: విగ్రహం కోసం యాజకుణ్ణి తీసుకెళ్లిన దాను గోత్రం
      '19':
        title: లేవీయుని ఉపపత్నిని చంపిన బెన్యామీనీయులు
      '20':
        title: గిబియాలో బెన్యామీనును ఓడించిన ఇశ్రాయేలు
      '21':
        title: సంక్షోభం నుంచి బయటపడిన బెన్యామీను
    Ruth:
      '1':
        title: అన్నీ కోల్పోయి వట్టి చేతులతో తిరిగివచ్చిన నయోమి
      '2':
        title: బోయజు పొలంలో పరిగె ఏరిన రూతు
      '3':
        title: రాత్రివేళ ఆశ్రయం కోరిన రూతు
      '4':
        title: రూతును, ఆమె కుటుంబాన్ని విమోచించిన బోయజు
    1 Samuel:
      '1':
        title: కుమారుని కోసం ప్రార్థించిన హన్నా
      '2':
        title: దేవుని సార్వభౌమాధికారాన్ని స్తుతించిన హన్నా
      '3':
        title: దేవుని పిలుపు విన్న సమూయేలు
      '4':
        title: ఫిలిష్తీయులకు మందసాన్ని కోల్పోయిన ఇశ్రాయేలు
      '5':
        title: మందసం వల్ల బాధపడిన ఫిలిష్తీయులు
      '6':
        title: మందసం తిరిగిరాగా సంతోషించిన బేత్షెమెషు
      '7':
        title: పశ్చాత్తాపపడి ఫిలిష్తీయులను ఓడించిన ఇశ్రాయేలు
      '8':
        title: రాజును కోరిన ఇశ్రాయేలు
      '9':
        title: ప్రవక్త సమూయేలును కలిసిన సౌలు
      '10':
        title: సౌలును రాజుగా అభిషేకించిన సమూయేలు
      '11':
        title: అమ్మోనుకు వ్యతిరేకంగా ఇశ్రాయేలును ఐక్యం చేసిన సౌలు
      '12':
        title: ఇశ్రాయేలు పాపాన్ని ఖండించిన సమూయేలు
      '13':
        title: దేవుని ఆజ్ఞకు అవిధేయుడైన సౌలు
      '14':
        title: విశ్వాసంతో ఫిలిష్తీయులను ఓడించిన దావీదు
      '15':
        title: దావీదును బెదిరించిన సౌలు అసూయ
      '16':
        title: సౌలుకు బదులుగా దావీదును ఎన్నుకున్న దేవుడు
      '17':
        title: గొల్యాతు అనే మహాకాయుణ్ణి ఓడించిన దావీదు
      '18':
        title: దావీదుతో ప్రాణస్నేహం చేసిన యోనాతాను
      '19':
        title: సౌలు నుంచి తప్పించుకున్న దావీదు
      '20':
        title: ప్రమాదం గురించి దావీదును హెచ్చరించిన యోనాతాను
      '21':
        title: యాజకుడైన అహీమెలెకు వద్దకు పారిపోయిన దావీదు
      '22':
        title: అదుల్లాములో నాయకుడైన దావీదు
      '23':
        title: రాజైన సౌలు ప్రాణాన్ని కాపాడిన దావీదు
      '24':
        title: గుహలో సౌలు ప్రాణాన్ని కాపాడిన దావీదు
      '25':
        title: అబీగయీలు వేడుకోవడం, నాబాలు మరణించడం
      '26':
        title: సౌలు ప్రాణాన్ని కాపాడిన దావీదు
      '27':
        title: ఆకీషు కోసం దాడులు చేసినట్లు నటించిన దావీదు
      '28':
        title: నిరాశలో సమూయేలును వెదికిన సౌలు
      '29':
        title: యుద్ధం నుంచి దావీదు తొలగింపు
      '30':
        title: సిక్లగు బందీలను రక్షించిన దావీదు
      '31':
        title: సౌలు పతనం, ఫిలిష్తీయుల విజయం
    2 Samuel:
      '1':
        title: సౌలు మరణానికి దుఃఖించిన దావీదు
      '2':
        title: దావీదును రాజుగా అభిషేకించిన యూదా
      '3':
        title: సౌలు ఇంటివారికి ద్రోహం చేసిన అబ్నేరు
      '4':
        title: ఈష్బోషెతును గౌరవించిన దావీదు
      '5':
        title: దావీదు కింద ఐక్యమైన ఇశ్రాయేలు
      '6':
        title: మందసాన్ని యెరూషలేముకు తెచ్చిన దావీదు
      '7':
        title: దేవుని వాగ్దానాన్ని ప్రకటించిన నాతాను
      '8':
        title: ఫిలిష్తీయుల మిత్రులను ఓడించిన దావీదు
      '9':
        title: మెఫీబోషెతుకు దయ చూపిన దావీదు
      '10':
        title: అమ్మోనీయుల సైన్యాలను ఓడించిన యోవాబు
      '11':
        title: బత్షెబతో పాపం చేసిన దావీదు
      '12':
        title: దావీదు పాపాన్ని నిలదీసిన నాతాను
      '13':
        title: అమ్నోనును హత్య చేసిన అబ్షాలోము
      '14':
        title: అబ్షాలోముతో సమాధానపడిన దావీదు
      '15':
        title: అబ్షాలోము నుంచి పారిపోతున్న దావీదు
      '16':
        title: మెఫీబోషెతుకు ద్రోహం చేసిన సీబా
      '17':
        title: అహీతోపెలు పథకాన్ని భగ్నం చేసిన హూషై
      '18':
        title: యుద్ధంలో అబ్షాలోమును చంపిన యోవాబు
      '19':
        title: అబ్షాలోము కోసం దుఃఖించిన దావీదు
      '20':
        title: ఇశ్రాయేలీయుల తిరుగుబాటుకు నాయకత్వం వహించిన షెబా
      '21':
        title: సౌలు పాపానికి ప్రాయశ్చిత్తం చేసిన దావీదు
      '22':
        title: దేవుని విమోచనను స్తుతించిన దావీదు
      '23':
        title: పరాక్రమశాలులను గౌరవించిన దావీదు
review:
  verdict: revise
  review_summary: Complete Telugu localization retained and corrected for closer fidelity, including the Joshua 8 place name and Judges 2/7 wording.
  issues:
  - Joshua 8 used a nonstandard rendering for Ai.
