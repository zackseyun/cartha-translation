payload:
  book_metadata:
    Testament of Zebulun:
      display_name: జెబులూను వీలునామా
      author: రచయిత తెలియదు; ఇది పన్నెండు మంది పితరుల వీలునామాలలో భాగం.
      audience: యూదు పాఠకులు (ఆ తర్వాతి కాలంలో క్రైస్తవ పాఠకులు కూడా).
      date: యూదు మూలభాగం సుమారు క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదక మార్పులు సుమారు క్రీ.శ. 1వ–2వ శతాబ్దాలలో జరిగాయి.
