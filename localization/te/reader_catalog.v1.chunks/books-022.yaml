    Gospel of Philip:
      display_name: ఫిలిప్పు సువార్త
      author: రచయిత తెలియదు. వ్రాతప్రతి చివరి గమనికలో ఈ శీర్షిక కనిపిస్తుంది; అయితే ఫిలిప్పే దీన్ని రాశాడని ఈ రచన చెప్పదు. ప్రస్తుతం లభ్యమవుతున్న ఏకైక ప్రతి నాగ్ హమ్మాది కోడెక్స్ II,3లోని కాప్టిక్ పాఠం.
      audience: వాలెంటీనియన్ ధోరణిలోని సంస్కార బోధతో—ముఖ్యంగా బాప్తిస్మం, అభిషేకం, ప్రభుభోజనం, విమోచనం, పునరుత్థానం, వధూవరుల గది ప్రతీకలతో—పరిచయమున్న తొలి క్రైస్తవ సమాజం.
      date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దం చివరి భాగం లేదా 3వ శతాబ్దం ఆరంభానికి చెందినదిగా తేదీ నిర్ణయిస్తారు; అంతకుముందటి గ్రీకు రూపం నుంచి అనువదించబడిన 4వ శతాబ్దపు కాప్టిక్ వ్రాతప్రతిలో ఇది భద్రపరచబడింది.
  chapter_titles:
    Testament of Issachar:
      '6':
        title: వంశస్థులు ప్రవాసాన్ని ఎదుర్కొంటారు
      '7':
        title: నీతి గురించి ఇశ్శాఖారు ఆలోచన
    Testament of Zebulun:
      '1':
        title: దుష్టత్వం గురించి కుమారులను హెచ్చరించిన పితరుడు
      '2':
        title: మౌనంగా దాచిన అపరాధం కోసం జెబులూను విలాపం
      '3':
        title: ప్రార్థించి గుంటకు కాపలా కాసిన జెబులూను
      '4':
        title: కరుణతో గుంటకు కాపలా కాసిన జెబులూను
      '5':
        title: కరుణ జెబులూను కుటుంబాన్ని కాపాడింది
      '6':
        title: పడవను రూపొందించినవాడు సమృద్ధిగా లభించిన పట్టును పంచాడు
      '7':
        title: నిష్కపట హృదయంతో ఉదారంగా ఉండమని జెబులూను ప్రబోధం
      '8':
        title: కరుణను బోధించిన జెబులూను
      '9':
        title: వంశస్థులను హెచ్చరించిన జెబులూను
      '10':
        title: భవిష్యత్తు విమోచనను ప్రవచించిన జెబులూను
    Testament of Dan:
      '1':
        title: గతంలోని అసూయను ఒప్పుకున్న దాను
      '2':
        title: కోపం పట్టులో చిక్కుకోవద్దని దాను హెచ్చరిక
      '3':
        title: కళ్లను కప్పే కోపాన్ని జయించే సత్యం
      '4':
        title: ఆత్మను, మనసును వక్రీకరించే కోపం
      '5':
        title: పశ్చాత్తాపం తెచ్చే శాశ్వత శాంతి
      '6':
        title: దేవునికి భయపడండి, సాతాను అబద్ధాలను తిరస్కరించండి
      '7':
        title: పితరులతో విశ్రమించిన దాను ఎముకలు
    Testament of Naphtali:
      '1':
        title: తన కుమారులను ఆశీర్వదించిన నఫ్తాలి
      '2':
        title: ప్రతి ఆత్మను పరిపూర్ణంగా రూపొందించే దేవుడు
      '3':
        title: దుష్టాత్మల నుంచి హృదయాలను కాపాడుకోండి
      '4':
        title: దేవుని రక్షణతో ముగిసే ప్రవాసం
      '5':
        title: ఉన్నత స్థితికి చేరిన లేవి, యూదా, యోసేపు
      '6':
        title: యాకోబు కుటుంబాన్ని చెదరగొట్టిన తుఫాను
      '7':
        title: చీకటి సత్యాలను దాచిన నఫ్తాలి
      '8':
        title: దేవుణ్ణి ఘనపరచడానికి జ్ఞానాన్ని అన్వేషించండి
      '9':
        title: స్వదేశానికి తిరిగివచ్చిన నఫ్తాలి ఎముకలు
    Testament of Gad:
      '1':
        title: ద్వేషం అనే విషం గురించి గాదు హెచ్చరిక
      '2':
        title: యోసేపుకు చేసిన ద్రోహాన్ని ఒప్పుకున్న గాదు
      '3':
        title: ఆత్మను కబళించే ద్వేషానికి దూరంగా ఉండండి
      '4':
        title: జీవాన్ని కాదు, మరణాన్ని తెచ్చే ద్వేషం
      '5':
        title: పశ్చాత్తాపం తెచ్చే దైవిక వెలుగు
      '6':
        title: హృదయపూర్వకంగా క్షమించి శాంతిని పొందండి
      '7':
        title: శత్రువుల క్షేమం కోసం ప్రార్థించండి
      '8':
        title: భవిష్యత్తు కుమారులకు బోధలను అందించండి
    Testament of Asher:
      '1':
        title: నీతిగా జీవించమని పిల్లలకు ఆషేరు ఉపదేశం
      '2':
        title: ముసుగు వేసుకున్న దుష్టత్వానికి సంపూర్ణ ఖండన
      '3':
        title: ద్వంద్వ మనస్సుతో జీవించవద్దని ఆషేరు ఆజ్ఞ
      '4':
        title: దుష్టత్వాన్ని ఎదిరించే భక్తులు
      '5':
        title: రెండు విధాల వాస్తవికతను బోధించిన ఆషేరు
      '6':
        title: ఏకైక లక్ష్యంతో ఆజ్ఞలను అనుసరించండి
      '7':
        title: తీర్పు మధ్యలోనూ నిరీక్షణనిచ్చే ప్రవచనం
      '8':
        title: హెబ్రోనులో ప్రశాంతంగా సమాధి చేయబడిన ఆషేరు
    Testament of Joseph:
      '1':
        title: తన చివరి వచనాలను పంచుకున్న యోసేపు
      '2':
        title: ప్రతిరోజూ శోధనను ఎదిరించిన యోసేపు
      '3':
        title: ఏడు సంవత్సరాల పాటు ప్రార్థించిన యోసేపు
      '4':
        title: అబద్ధ ఆరాధన ఒప్పందాలను తిరస్కరించిన యోసేపు
      '5':
        title: హత్యకు దారితీసే ప్రలోభాన్ని ధిక్కరించిన యోసేపు
      '6':
        title: విషం కలిపిన ఆహారాన్ని తిరస్కరించిన యోసేపు
      '7':
        title: దేవుని దూతపై నమ్మకంతో భోజనం చేసిన యోసేపు
      '8':
        title: స్త్రీ నుంచి వస్త్రం లేకుండా తప్పించుకున్న యోసేపు
      '9':
        title: సంకెళ్లలో కృతజ్ఞతతో పాడిన యోసేపు
      '10':
        title: సహనం, పవిత్రత పాటించమని యోసేపు ప్రబోధం
      '11':
        title: ప్రవాసంలో సోదరులను గౌరవించిన యోసేపు
      '12':
        title: ఈజిప్టులో అనుగ్రహం పొందిన యోసేపు
      '13':
        title: అబద్ధం చెప్పాడనే ఆరోపణలు ఎదుర్కొన్న యోసేపు
      '14':
        title: తన సాక్ష్యాన్ని మార్చడానికి నిరాకరించిన యోసేపు
      '15':
        title: అవమానం నుంచి సోదరులను కాపాడిన యోసేపు
      '16':
        title: మోసం గురించి మౌనంగా ఉన్న యోసేపు
      '17':
