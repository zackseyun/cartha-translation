payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: తోమా బాల్య సువార్త
      author: రచయిత తెలియదు. తిరిగి గుర్తించగలిగిన దాని అత్యంత ప్రాచీన రూపంలో రచయిత పేరు లేదు; తోమాకు ఆపాదించడం తరువాతి కాలపు వ్రాతప్రతుల శీర్షికలు, ప్రసార పరంపరకు చెందినది.
      audience: ప్రామాణిక సువార్తల కథనాలు మొదలయ్యే ముందు యేసు బాల్యం గురించి, దైవిక శక్తి, క్రమశిక్షణ, అభ్యాసం, పరిపక్వతలను ఎలా వర్ణించవచ్చో తెలుసుకోవాలనుకున్న క్రైస్తవులు.
      date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దానికి చెందినదిగా భావిస్తారు; అయితే ఈ పాఠం గణనీయంగా భిన్నమైన అనేక గ్రీకు పాఠరూపాల్లో, ప్రాచీన అనువాదాల్లో లభిస్తోంది.
    Acts of Paul and Thecla:
      display_name: పౌలు, తెక్లా కార్యాలు
      author: రచయిత తెలియదు. ఇది విస్తృతమైన పౌలు కార్యాలు అనే రచనలోని ఒక ఘట్టం; ఒక ప్రెస్బిటర్ ఆ కార్యాలను రచించాడనే ప్రాచీన నివేదిక ఆధారంగా రచయితను నిశ్చయంగా గుర్తించలేం.
      audience: అపొస్తలుల బోధ, బ్రహ్మచర్యం, బాప్తిస్మం, హతసాక్షిని పోలిన సహనం, బోధించడానికీ సాక్ష్యమివ్వడానికీ ఒక స్త్రీకి ఉన్న అధికారం వంటి అంశాల కథలపట్ల ఆసక్తి ఉన్న క్రైస్తవులు.
      date: క్రీ.శ. 2వ శతాబ్దంలో, బహుశా దాని ద్వితీయార్ధంలో రచించబడింది; ఇది పౌలు కార్యాలు రచనలో భాగంగానూ, స్వతంత్ర రచనగానూ వ్యాప్తిలో ఉండేది.
    Gospel of Peter:
      display_name: పేతురు సువార్త
      author: రచయిత తెలియదు. లభ్యమైన కథనం పేతురు స్వరంలో మాట్లాడుతుంది, ఆయన పేరుతోనే ప్రసారమైంది; అయితే ఇది చారిత్రక అపొస్తలుడైన పేతురు రచనగా పరిగణించబడదు.
      audience: విస్తరించిన యేసు శ్రమలు, పునరుత్థాన కథనంపై ఆసక్తి ఉన్న తొలి క్రైస్తవులు; బహుశా పేతురు అధికారానికి ప్రత్యేక ప్రాధాన్యం ఉన్న సమాజాల్లోని వారు.
      date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దానికి చెందినదిగా నిర్ధారిస్తారు; ప్రధానంగా లభించిన గ్రీకు శకలం ఎంతో తరువాతి కాలపు వ్రాతప్రతికి చెందినది, అది అఖ్మీమ్‌లో కనుగొనబడింది.
    2 Clement:
      display_name: 2 క్లెమెంట్
      author: రచయిత తెలియదు. సంప్రదాయ శీర్షిక అలా ఉన్నప్పటికీ, ఇది రోమా క్లెమెంట్ రాసిన రెండవ పత్రిక కాదు; తొలి క్రైస్తవ ఉపదేశ ప్రసంగం.
      audience: పశ్చాత్తాపం, నైతిక స్థిరత్వం, బలహీనుల పట్ల శ్రద్ధ, పునరుత్థానం మరియు తీర్పుపై నిరీక్షణతో విశ్వాసపూర్వకంగా సహించడం కోసం ప్రోత్సహించబడిన ఒక క్రైస్తవ సంఘం.
      date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దపు ప్రథమార్ధం లేదా మధ్యకాలానికి (సుమారు క్రీ.శ. 100–160) చెందినదిగా నిర్ధారిస్తారు; ఇది ఎక్కడ రచించబడిందో తెలియదు.
    Epistle of Barnabas:
      display_name: బర్నబా పత్రిక
      author: రచయిత తెలియదు. ఈ రచనను సంప్రదాయంగా పౌలు సహచరుడైన బర్నబాతో అనుసంధానించారు; అయితే ఆధునిక పండితులు ఆ ఆపాదనను అంగీకరించరు.
      audience: ఇశ్రాయేలు లేఖనాలను క్రీస్తు-కేంద్రితంగానూ రూపకాలంకార పద్ధతిలోనూ వ్యాఖ్యానించి తమవిగా స్వీకరించాలనీ, తమ నిబంధన సంబంధిత గుర్తింపును యూదుల ఆచారాలనుంచి వేరు చేసుకోవాలనీ బోధించబడుతున్న యూదేతర క్రైస్తవులు.
      date: సాధారణంగా క్రీ.శ. 70లో యెరూషలేము దేవాలయం నాశనమైన కాలానికి, 2వ శతాబ్దపు తొలినాళ్లకు మధ్యన—తరచుగా సుమారు క్రీ.శ. 80–130 మధ్యన—రచించబడిందని నిర్ధారిస్తారు.
  chapter_titles:
    Protoevangelium of James:
      '11':
        title: మరియ పవిత్ర కార్యాన్ని దేవదూత ప్రకటించడం
      '12':
        title: మరియ ఎలీసబెతును దర్శించి తిరిగి రావడం
      '13':
        title: గర్భవతియైన మరియను చూసి యోసేపు దుఃఖించడం
      '14':
        title: యోసేపు కలలో దేవదూత మాట్లాడడం
      '15':
        title: యోసేపు తప్పు చేశాడని యాజకుడు నిందించడం
      '16':
        title: పరీక్ష తరువాత యోసేపు మరియను నిర్దోషిగా విడిచిపెట్టడం
      '17':
        title: మరియ బేత్లెహేముకు ప్రయాణించడం
      '18':
        title: స్తంభించిపోయిన లోకాన్ని యోసేపు చూడడం
      '19':
        title: కన్య ప్రసవాన్ని మంత్రసాని చూడడం
      '20':
        title: మరియను పరీక్షించిన సలోమే చేయి కాలిపోవడం
      '21':
        title: కొత్తగా పుట్టిన రాజును జ్ఞానులు వెదకడం
      '22':
        title: శిశువులను చంపమని హేరోదు ఆజ్ఞాపించడం
      '23':
        title: హేరోదు బెదిరింపును జెకర్యా ఎదుర్కోవడం
      '24':
        title: పరిశుద్ధ స్థలంలో జెకర్యా హత్య
      '25':
        title: కల్లోల సమయంలో యాకోబు వృత్తాంతం రాయడం
      '26':
        title: బోడ్మర్ పపైరస్‌లో సంక్షిప్త పాఠరూపం
      '27':
        title: బేత్లెహేములో మంత్రసానిని యోసేపు వెదకడం
      '28':
        title: మరియకు జరిగిన అద్భుతాన్ని యోసేపు వివరించడం
      '29':
        title: శిశువును తాకి సలోమే స్వస్థత పొందడం
      '30':
        title: యూదుల రాజును జ్ఞానులు వెదకడం
    Infancy Gospel of Thomas:
      '1':
        title: యేసు గురించి తోమా చెప్పడం
      '2':
        title: యేసు నీటిని శుభ్రం చేసి పక్షుల బొమ్మలు చేయడం
      '3':
        title: అన్న కుమారుణ్ణి యేసు శపించడం
      '4':
        title: యేసు శపించడంతో బాలుడు చనిపోవడం
      '5':
        title: యోసేపుకు యేసు జ్ఞానం బోధించడం
      '6':
        title: యేసు జ్ఞానాన్ని ఎదుర్కోలేక గురువు తడబడడం
      '7':
        title: యేసు జ్ఞానం శ్రేష్ఠమైనదని గురువు ఒప్పుకోవడం
      '8':
        title: యేసు నవ్వుతూ స్వస్థపరచి ప్రకటించడం
      '9':
        title: కిందపడిన జీనోను యేసు బ్రతికించడం
      '10':
        title: కట్టెలు కొట్టేవాని పాదాన్ని యేసు స్వస్థపరచడం
      '11':
        title: పగిలిన కుండను యేసు అద్భుతంగా నింపడం
      '12':
        title: యేసు విత్తిన విత్తనపు పంటను యోసేపు కోయడం
      '13':
        title: యేసు సహాయంతో యోసేపు మంచాన్ని పూర్తి చేయడం
      '14':
        title: యేసును సవాలు చేసిన గురువు చనిపోవడం
      '15':
        title: యేసు మాటలకు గురువు సంతోషించడం
      '16':
        title: పాము కాటుకు గురైన యాకోబును యేసు స్వస్థపరచడం
      '17':
        title: శిశువు యోసేపును యేసు స్వస్థపరచడం
      '18':
        title: ఆ ప్రదేశంలో ఒక మనిషిని యేసు బ్రతికించడం
      '19':
        title: పన్నెండేళ్ల యేసు దేవాలయంలో బోధించడం
    Acts of Paul and Thecla:
      '1':
        title: ఒనేసిఫొరు ఇంట్లో పౌలు బోధించడం
      '2':
        title: తెక్లా వింటూ పౌలును చూడాలని తపించడం
      '3':
        title: అధిపతి ఎదుట పౌలుపై తమీరిస్ నేరం మోపడం
      '4':
        title: తెక్లా చెరసాలకు వెళ్లి పౌలును ప్రోత్సహించడం
      '5':
        title: తెక్లా సజీవ దహనం నుంచి తప్పించుకోవడం
      '6':
        title: పౌలు తెక్లాతో కలిసి ఉపవాసం ఉండి ప్రార్థించడం
      '7':
        title: పౌలు తెక్లాను అంతియొకయకు పంపడం
      '8':
        title: క్రూరమృగాల నుంచి తెక్లాను త్రిఫినా కాపాడడం
      '9':
        title: కొలనులో తెక్లా తనకు తానే బాప్తిస్మం తీసుకోవడం
      '10':
        title: సెలూకియలో స్త్రీలకు తెక్లా బోధించడం
      '11':
        title: పరలోక స్వరం తెక్లాను కాపాడడం
    Gospel of Peter:
      '1':
        title: ప్రభువును విచారించమని హేరోదు ఆజ్ఞాపించడం
      '2':
        title: ప్రభువు దేహాన్ని యోసేపు సమాధి చేయడం
      '3':
        title: దేవుని కుమారుణ్ణి జనసమూహం అపహసించడం
      '4':
        title: దోషి యేసు గౌరవాన్ని కాపాడడం
      '5':
        title: మధ్యాహ్నం యూదయను చీకటి కమ్మడం
      '6':
        title: యోసేపు సమాధిలో యేసును ఉంచడం
      '7':
        title: జరిగిన అన్యాయానికి ప్రజలు దుఃఖించడం
      '8':
        title: యేసు సమాధికి పెద్దలు కాపలా పెట్టడం
      '9':
        title: తెల్లవారుజామున పరలోక స్వరం వినిపించడం
      '10':
        title: సమాధి నుంచి ముగ్గురు మనుషులు బయటకు రావడం
      '11':
        title: సైనికులు పిలాతుకు నివేదించడం
      '12':
        title: మగ్దలేనే మరియ సమాధిని వెదకడం
      '13':
        title: దేవదూత వార్త విని స్త్రీలు పారిపోవడం
      '14':
