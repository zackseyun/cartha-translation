chunk_id: books-013
status: reviewed
payload:
  book_metadata:
    James:
      display_name: యాకోబు
      author: సంప్రదాయం ప్రకారం యేసు సోదరుడైన యాకోబు; ఆధునిక పండితులు ఇది నిజంగా ఆయన రాసినదా లేక ఆయన పేరుతో మరొకరు రాసినదా అనే విషయంలో భిన్నాభిప్రాయాలు కలిగి ఉన్నారు.
      audience: చెదరిపోయి వివిధ ప్రాంతాల్లో నివసిస్తున్న యూదు క్రైస్తవ సంఘాలు.
      date: నిజంగా యాకోబు రాసినదైతే సుమారు క్రీ.శ. 50–60 దశకాలు; ఆయన పేరుతో మరొకరు రాసినదైతే సుమారు క్రీ.శ. మొదటి శతాబ్దం చివరి భాగం.
    1 Peter:
      display_name: 1 పేతురు
      author: సంప్రదాయం ప్రకారం అపొస్తలుడైన పేతురు, లేఖకుడిగా సిల్వాను; కొందరు పండితులు ఇది పేతురు పేరుతో మరొకరు రాసినదని భావిస్తారు.
      audience: రోమా సామ్రాజ్యంలోని ఆసియా మైనరులో సామాజిక వ్యతిరేకతను ఎదుర్కొంటున్న క్రైస్తవులు.
      date: పేతురు రాసినదైతే సుమారు క్రీ.శ. 60 దశకం; ఆయన పేరుతో మరొకరు రాసినదైతే సుమారు క్రీ.శ. 70–90 దశకాలు.
    2 Peter:
      display_name: 2 పేతురు
      author: సంప్రదాయం ప్రకారం పేతురు; ఆధునిక పండితుల్లో చాలామంది ఇది పేతురు పేరుతో మరొకరు రాసినదని భావిస్తారు.
      audience: క్రీస్తు రెండవ రాకను నిరాకరించే అపహాసకులను ఎదుర్కొంటున్న క్రైస్తవులు.
      date: సుమారు క్రీ.శ. రెండవ శతాబ్దం ఆరంభం.
    1 John:
      display_name: 1 యోహాను
      author: రచయిత పేరు తెలియదు; సంప్రదాయం ప్రకారం అపొస్తలుడైన యోహాను లేదా యోహాను సంప్రదాయానికి చెందిన పెద్ద.
      audience: చీలిక ఏర్పడిన తర్వాత, తమలో నిజంగా ఎవరు దేవునికి చెందినవారో నిర్వచించుకుంటున్న యోహాను సంప్రదాయ సమాజం.
      date: సుమారు క్రీ.శ. 90–110.
    2 John:
      display_name: 2 యోహాను
      author: “పెద్ద.”
      audience: అబద్ధ బోధకుల గురించి హెచ్చరిక పొందిన ఒక నిర్దిష్ట క్రైస్తవ సంఘం (“ఎన్నుకోబడిన అమ్మగారు”).
      date: సుమారు క్రీ.శ. 90–110.
    3 John:
      display_name: 3 యోహాను
      author: “పెద్ద.”
      audience: ప్రయాణించే సువార్త సేవకులకు ఆతిథ్యమిచ్చే నాయకుడైన గాయు అనే వ్యక్తి.
      date: సుమారు క్రీ.శ. 90–110.
    Jude:
      display_name: యూదా
      author: సంప్రదాయం ప్రకారం యాకోబుకు, యేసుకు సోదరుడైన యూదా.
      audience: నైతిక కట్టుబాట్లను తిరస్కరించే బోధకులు చొరబడుతున్న క్రైస్తవ సమాజాలు.
      date: సుమారు క్రీ.శ. 60–90 దశకాలు.
    Revelation:
      display_name: ప్రకటన
      author: పత్మొసుకు చెందిన యోహాను (శైలిపరంగా నాలుగవ సువార్త రచయితకు భిన్నమైనవాడు).
      audience: సామ్రాజ్య ఒత్తిడికి లోనవుతున్న రోమా ఆసియా మైనరులోని ఏడు క్రైస్తవ సంఘాలు.
      date: సుమారు క్రీ.శ. 90 దశకం; సంప్రదాయం ప్రకారం దొమితియను పరిపాలన కాలంలో.
    Tobit:
      display_name: తోబీతు
      author: రచయిత పేరు తెలియదు.
      audience: విదేశీ పాలనలో భక్తి, వివాహం, దైవ పరిపాలన సంబంధిత విషయాలను ఎదుర్కొంటున్న ప్రవాస యూదులు.
      date: సుమారు క్రీ.పూ. 225–175; అరామిక్ భాషలో రచించబడింది; దాని హీబ్రూ రూపం కూడా కుమ్రానులో లభించిన ఆధారాల ద్వారా తెలిసింది.
    Judith:
      display_name: యూదితు
      author: రచయిత పేరు తెలియదు.
      audience: విదేశీ ముప్పును ఎదుర్కొంటున్న యూదులు—భక్తితో కూడిన ధీటైన ప్రతిఘటన కథ.
      date: సుమారు క్రీ.పూ. 150–100.
    Greek Additions to Esther:
      display_name: ఎస్తేరు గ్రంథానికి గ్రీకు అనుబంధాలు
      author: రచయిత పేరు తెలియదు; ఎస్తేరు గ్రంథ గ్రీకు అనువాదంలో చేర్చిన అదనపు భాగాలు.
      audience: స్పష్టమైన ప్రార్థనలు, దేవుని ప్రస్తావనలతో కూడిన ఎస్తేరు కథను కోరిన గ్రీకు మాట్లాడే యూదులు.
      date: సుమారు క్రీ.పూ. రెండవ–మొదటి శతాబ్దాలు.
    Wisdom of Solomon:
      display_name: సొలొమోను జ్ఞానం
      author: రచయిత పేరు తెలియదు; సొలొమోను పేరుతో రాయబడింది. గ్రీకు భాషలో హెలెనిస్టిక్ యూదు రచయిత దీనిని రచించాడు; బహుశా అలెగ్జాండ్రియాలో రచించి ఉండవచ్చు.
      audience: గ్రీకు తత్వశాస్త్రంతో సంభాషిస్తూ, అన్యమత మరియు తమ విశ్వాసాన్ని విడిచిపెట్టినవారి ప్రత్యామ్నాయాలకు ఎదురుగా ఇశ్రాయేలు జ్ఞానాన్ని సమర్థిస్తున్న హెలెనిస్టిక్ యూదులు.
      date: సుమారు క్రీ.పూ. 50–క్రీ.శ. 50.
  chapter_titles:
    Hebrews:
      '11':
        title: పూర్వికుల విశ్వాసం నిలిచి ఉంటుంది
      '12':
        title: యేసుతో కలిసి బాధను సహించండి
      '13':
        title: ప్రేమతో, నమ్మకంతో జీవించండి
    James:
      '1':
        title: పరీక్షల్లో నిరూపితమైన విశ్వాసం నిలుస్తుంది
      '2':
        title: క్రియలు లేని విశ్వాసం మృతమైనది
      '3':
        title: నాలుకను అదుపుచేసి జ్ఞానంతో మాట్లాడండి
      '4':
        title: స్వార్థం నుంచే గొడవలు పుడతాయి
      '5':
        title: ధనిక అణచివేతదారుల తీర్పు సమీపించింది
    1 Peter:
      '1':
        title: పరలోక వారసత్వంపై నిరీక్షణ
      '2':
        title: సజీవ రాతిపై నిర్మించబడిన విశ్వాసులు
      '3':
        title: భార్యలు తమ జీవితం ద్వారా క్రీస్తును ఘనపరచాలి
      '4':
        title: మేలు చేసినందుకు బాధపడండి
      '5':
        title: పెద్దలు విశ్వాసానికి మాదిరిగా ఉండి సంరక్షించాలి
    2 Peter:
      '1':
        title: ఆత్మీయ ఎదుగుదలను బోధించే పేతురు
      '2':
        title: అబద్ధ బోధకులపై త్వరగా వచ్చే తీర్పు
      '3':
        title: చివరి తీర్పు గురించి పేతురు హెచ్చరిక
    1 John:
      '1':
        title: నిజమైన సహవాసాన్ని వెల్లడించే వెలుగు
      '2':
        title: ప్రేమ దేవుని ఆజ్ఞలను పాటిస్తుంది
      '3':
        title: దేవుని మూలంగా పుట్టినవారు పాపాన్ని జయిస్తారు
      '4':
        title: నిజమైన ప్రేమ దేవుని నుంచే వస్తుంది
      '5':
        title: యేసును నమ్మినవారికి నిత్యజీవం ఉంది
    2 John:
      '1':
        title: అబద్ధ బోధకుల గురించి పెద్ద హెచ్చరిక
    3 John:
      '1':
        title: గాయు క్షేమం కోసం పెద్ద ప్రార్థన
    Jude:
      '1':
        title: భక్తిహీన చొరబాటుదారుల గురించి యూదా హెచ్చరిక
    Revelation:
      '1':
        title: దేవుడు యోహానుకు దర్శనాలు చూపిస్తాడు
      '2':
        title: ఏడు సంఘాలతో యేసు మాట్లాడుతాడు
      '3':
        title: పశ్చాత్తాపపడమని లవొదికయను యేసు హెచ్చరిస్తాడు
      '4':
        title: పరలోక సింహాసనం మహిమతో ప్రకాశిస్తుంది
      '5':
        title: గ్రంథపు చుట్టను తీసుకొని విమోచించే గొర్రెపిల్ల
      '6':
        title: నలుగురు గుర్రపు రౌతులు మహా విపత్తులు తెస్తారు
      '7':
        title: ముద్రించబడిన సేవకులు నిత్య స్తుతి పాడుతారు
      '8':
        title: భయంకర తీర్పులను ప్రకటించే ఏడు బూరలు
      '9':
        title: భూమిపై పాపులను మిడతలు హింసిస్తాయి
      '10':
        title: ఇక ఆలస్యం ఉండదని బలవంతుడైన దూత ప్రమాణం
      '11':
        title: ఇద్దరు సాక్షులు ప్రవచించి తిరిగి లేస్తారు
      '12':
        title: పాలించబోయే కుమారుణ్ని కనే స్త్రీ
      '13':
        title: సముద్రం నుంచి పైకి వచ్చే మృగం
      '14':
        title: నమ్మకస్థులను తనవద్దకు చేర్చుకునే గొర్రెపిల్ల
      '15':
        title: పరలోక ఉగ్రతను చూసే యోహాను
      '16':
        title: ఉగ్రత పాత్రలను కుమ్మరించే దూతలు
      '17':
        title: బబులోను తీర్పు, దేవుని విజయం
      '18':
        title: బబులోను పతనంపై పరలోక ఆనందం
      '19':
        title: గొర్రెపిల్ల వివాహాన్ని పరలోకం వేడుక చేసుకుంటుంది
      '20':
        title: చివరి తీర్పును చూసే యోహాను
      '21':
        title: సమస్తం కొత్తగా చేయబడుతుంది
      '22':
        title: యేసు త్వరగా వస్తున్నాడు
    Tobit:
      '1':
        title: దేవుణ్ణి నమ్మకంగా జ్ఞాపకం చేసుకునే తోబీతు
      '2':
        title: తిరస్కరించబడిన పొరుగువానికి సమాధి చేసే తోబీతు
      '3':
        title: మరణం కోసం ఏడుస్తూ ప్రార్థించే తోబీతు
      '4':
        title: నీతిగా జీవించమని కుమారునికి తోబీతు ఉపదేశం
      '5':
        title: మార్గదర్శకునితో బయలుదేరే తోబీయా
      '6':
        title: స్వస్థపరిచే చేపను పట్టే తోబీయా
      '7':
        title: ఎక్బతానాలో సారాను వివాహమాడే తోబీయా
      '8':
        title: సారాను వివాహమాడి ప్రార్థించే తోబీయా
      '9':
        title: తోబీతుకు డబ్బు తిరిగి ఇచ్చే గబాయేలు
      '10':
