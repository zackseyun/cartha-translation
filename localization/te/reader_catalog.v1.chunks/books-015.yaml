contract_version: 1
locale: te
source_catalog_sha256: ec74c36516f84fea14e3d62329a38731b464f113276935cab09aa146bdd1e82b
source_chunk_sha256: a7156e48790f64fc6b2a1a6319102c177563d75f763c0a904b5db6df2658448f
chunk_id: books-015
status: reviewed
payload:
  book_metadata:
    1 Esdras:
      display_name: 1 ఎస్ద్రాసు
      author: రచయిత తెలియదు; 2 దినవృత్తాంతములు 35–36, ఎజ్రా, నెహెమ్యా 7–8 భాగాలను వేరే క్రమంలో అమర్చి గ్రీకు భాషలో పునర్నిర్మించిన రచన.
      audience: తిరిగి రావడం, పునరుద్ధరణ గురించి స్పష్టమైన కథనం కోరుకున్న హెలెనిస్టిక్ కాలపు యూదులు.
      date: సుమారు క్రీ.పూ. 2వ–1వ శతాబ్దం.
    Prayer of Manasseh:
      display_name: మనష్షే ప్రార్థన
      author: రచయిత తెలియదు; మనష్షే రాజు రాసినదిగా ఆపాదించబడింది.
      audience: మనష్షే పశ్చాత్తాపంతో తమను తాము అనుసంధానించుకున్న పశ్చాత్తాపులు — కొన్ని సంప్రదాయాల్లో ఆరాధనలో ఉపయోగించబడింది.
      date: సుమారు క్రీ.పూ. 2వ–1వ శతాబ్దం.
    Psalm 151:
      display_name: కీర్తన 151
      author: రచయిత తెలియదు; దావీదు రాసినదిగా ఆపాదించబడింది. దీని హీబ్రూ రూపం 11QPsaలో లభించింది.
      audience: దావీదు కీర్తనల గ్రంథాన్ని ఆదరించిన ప్రవాస, కుమ్రాన్ సమాజాలు.
      date: సుమారు క్రీ.పూ. 2వ శతాబ్దం లేదా అంతకంటే ముందు.
    3 Maccabees:
      display_name: 3 మక్కబీయులు
      author: రచయిత తెలియదు; గ్రీకు భాషలో రచించబడింది.
      audience: ఐగుప్తులోని గ్రీకు భాష మాట్లాడే ప్రవాస యూదులు — నాలుగవ టోలెమీ కాలంలో జరిగినదిగా చెప్పబడిన విమోచన కథనం.
      date: సుమారు క్రీ.పూ. 1వ శతాబ్దం నుంచి క్రీ.శ. 1వ శతాబ్దం వరకు.
    4 Maccabees:
      display_name: 4 మక్కబీయులు
      author: రచయిత తెలియదు; స్టోయిక్ తత్వశాస్త్ర ప్రభావం పొందిన గ్రీకు భాష మాట్లాడే యూదు రచయిత.
      audience: హెలెనిస్టిక్ యూదులు — విశ్వాసనిష్ఠ ద్వారా వివేకం ఉద్రేకాలను అదుపు చేయడం గురించి తాత్విక ప్రసంగం.
      date: సుమారు క్రీ.శ. 1వ శతాబ్దం.
    Bel and the Dragon:
      display_name: బేలు మరియు ఘటసర్పం
      author: రచయిత తెలియదు; దానియేలు గ్రంథానికి గ్రీకు భాషలో చేర్చబడిన భాగాల్లో ఒకటి.
      audience: గ్రీకు భాష మాట్లాడే యూదులు — విగ్రహారాధనను ఎగతాళి చేస్తూ ఖండించే రచన.
      date: సుమారు క్రీ.పూ. 2వ–1వ శతాబ్దం.
    Letter of Jeremiah:
      display_name: యిర్మీయా పత్రిక
      author: రచయిత తెలియదు; యిర్మీయా రాసినదిగా ఆపాదించబడింది.
      audience: చుట్టూ ఉన్న విగ్రహారాధనకు ఆకర్షితులయ్యే ప్రమాదంలో ఉన్న ప్రవాస యూదులు.
      date: సుమారు క్రీ.పూ. 4వ–2వ శతాబ్దం.
    Prayer of Azariah and Song of the Three:
      display_name: అజర్యా ప్రార్థన మరియు ముగ్గురి గీతం
      author: రచయిత తెలియదు; దానియేలు గ్రంథానికి గ్రీకు భాషలో చేర్చబడిన భాగాల్లో ఒకటి.
      audience: గ్రీకు భాష మాట్లాడే యూదులు — దానియేలు 3 కోసం రూపొందిన ఆరాధనా పాఠ్యం.
      date: సుమారు క్రీ.పూ. 2వ శతాబ్దం.
    Susanna:
      display_name: సూసన్న
      author: రచయిత తెలియదు; దానియేలు గ్రంథానికి గ్రీకు భాషలో చేర్చబడిన భాగాల్లో ఒకటి.
      audience: గ్రీకు భాష మాట్లాడే యూదులు — నీతిని చూపుతూ అబద్ధ సాక్ష్యాన్ని ఖండించే కథ.
      date: సుమారు క్రీ.పూ. 2వ–1వ శతాబ్దం.
    1 Clement:
      display_name: 1 క్లెమెంటు
      author: రచయిత తెలియదు; రోముకు చెందిన క్లెమెంటు రాసినదిగా ఆపాదించబడింది.
      audience: నాయకత్వ వివాదంలో చిక్కుకున్న కొరింథులోని క్రైస్తవ సంఘం.
      date: సుమారు క్రీ.శ. 96.
  chapter_titles:
    2 Maccabees:
      '12':
        title: పడిపోయినవారి కోసం యూదా ప్రార్థన
      '13':
        title: విజయం కోసం యూదా ప్రార్థన
      '14':
        title: నీకానోరు శాంతి ఒప్పందానికి ద్రోహం
      '15':
        title: నీకానోరు ఓటమిని జరుపుకున్న యూదులు
    1 Esdras:
      '1':
        title: యోషీయా పస్కా ఆచరించి మరణించడం
      '2':
        title: యిర్మీయా మాటను నెరవేర్చిన కోరెషు
      '3':
        title: సత్యమే గెలుస్తుందని జెరుబ్బాబెలు ప్రకటన
      '4':
        title: ఆలయ పునర్నిర్మాణానికి దర్యావేషు అనుమతి
      '5':
        title: తిరిగివచ్చి బలిపీఠం నిర్మించిన ప్రవాసులు
      '6':
        title: ఆలయ పనిని ప్రోత్సహించిన ప్రవక్తలు
      '7':
        title: మహా ఆనందంతో ఆలయం పూర్తి
      '8':
        title: ప్రజలను క్షేమంగా తిరిగి నడిపించిన ఎజ్రా
      '9':
        title: విశ్వాసరహిత వివాహాలను ఎదుర్కొన్న ఎజ్రా
    Prayer of Manasseh:
      '1':
        title: దేవుని కరుణ కోసం మనష్షే వేడుకోలు
    Psalm 151:
      '1':
        title: రాజుగా అభిషేకించబడిన చిన్న కాపరి
    3 Maccabees:
      '1':
        title: ఆలయంలో ప్రవేశిస్తానని రాజు పట్టు
      '2':
        title: విమోచన కోసం ఇశ్రాయేలు ప్రార్థన
      '3':
        title: యూదుల నాశనానికి రాజు పథకం
      '4':
        title: బహిరంగ ప్రదర్శనకు గురై విలపించిన యూదులు
      '5':
        title: వధ కోసం సిద్ధమైన ఏనుగులు
      '6':
        title: యూదులను రక్షించిన పరలోక దూతలు
      '7':
        title: యూదులను క్షేమంగా విడుదల చేసిన రాజు
    4 Maccabees:
      '1':
        title: ఉద్రేకాలను ఏలే వివేకం
      '2':
        title: వివేకపు ఆధిపత్యానికి ధర్మశాస్త్ర మార్గదర్శనం
      '3':
        title: శత్రువుల నీటిని తిరస్కరించిన దావీదు
      '4':
        title: యూదులను కాపాడిన పరలోక సైన్యాలు
      '5':
        title: పందిమాంసాన్ని తిరస్కరించిన ఎలియాజరు
      '6':
        title: స్థిరంగా నిలిచి మరణించిన ఎలియాజరు
      '7':
        title: వివేకపు శక్తిని నిరూపించిన ఎలియాజరు
      '8':
        title: నిరంకుశుని ఎదుర్కొన్న ఏడుగురు సోదరులు
      '9':
        title: హతసాక్షిగా మరణించిన మొదటి సోదరుడు
      '10':
        title: నాలుగవ సోదరుడు నాలుక చాపడానికి నిరాకరణ
      '11':
        title: హింసను భరించిన ఆరవ సోదరుడు
      '12':
        title: తనను తాను విసిరుకున్న చిన్న సోదరుడు
      '13':
        title: ఒకరినొకరు ప్రోత్సహించుకున్న సోదరులు
      '14':
        title: మరణాన్ని స్వీకరించమని కుమారులను ప్రోత్సహించిన తల్లి
      '15':
        title: కుమారులకంటే దేవుణ్ణి ఎంచుకున్న తల్లి
      '16':
        title: మరణాన్ని స్వీకరించమని కుమారులను ఒప్పించిన తల్లి
      '17':
        title: దేవుణ్ణి ఘనపరచిన ఏడుగురు హతసాక్షులు
      '18':
        title: ధర్మశాస్త్రాన్ని పాటించి జీవించిన పిల్లలు
    Bel and the Dragon:
      '1':
        title: బేలు, ఘటసర్పాన్ని ఓడించిన దానియేలు
    Letter of Jeremiah:
      '1':
        title: బబులోనులో వ్యర్థంగా భయపెట్టే విగ్రహాలు
    Prayer of Azariah and Song of the Three:
      '1':
        title: మండే అగ్నిలో అజర్యా ప్రార్థన
    Susanna:
      '1':
        title: న్యాయాధిపతుల కుట్రను బయటపెట్టిన దానియేలు
    1 Clement:
      '1':
        title: అపవిత్ర తిరుగుబాటుతో బాధపడిన సహోదరులు
      '2':
        title: వినయం తెచ్చే శాంతియుత ఆసక్తి
      '3':
        title: అసూయ తెచ్చిన యుద్ధం, చెర
      '4':
        title: ప్రాచీన హత్యలకు దారితీసిన అసూయ
      '5':
        title: సహనంతో కష్టాలు భరించిన పేతురు, పౌలు
      '6':
        title: దేవుడు ఎన్నుకున్న స్త్రీలను వేధించిన అసూయ
      '7':
        title: రక్షణ కోసం అమూల్యమైన రక్తం
      '8':
        title: పాపి పశ్చాత్తాపాన్నే కోరే ప్రభువు
      '9':
        title: నీతిమంతుడిగా పైకి తీసుకోబడిన హనోకు
      '10':
        title: విధేయతతో నమ్మకస్థుడని నిరూపించుకున్న అబ్రాహాము
      '11':
        title: ఆతిథ్యం వల్ల రక్షించబడిన లోతు
      '12':
        title: నమ్మకంగా గూఢచారులను దాచిన రాహాబు
      '13':
        title: మనల్ని తగ్గించుకొని ప్రభువును వెదకుదాం
      '14':
        title: ఒకరితో ఒకరు సౌమ్యంగా మెలగండి
      '15':
        title: దైవభక్తితో కూడిన శాంతిని అనుసరించండి
      '16':
        title: దీనత్వంతో, వినయంతో వచ్చిన మెస్సీయ
      '17':
        title: నిరాడంబరంగా జీవించిన ప్రవక్తలను అనుకరించండి
      '18':
        title: తన పాపాలను వినయంగా ఒప్పుకున్న దావీదు
      '19':
        title: శాంతియుత జీవనానికి దారిచూపే వినయం
      '20':
        title: క్రమబద్ధమైన శాంతిలో నడిచే సృష్టి
      '21':
        title: దేవుని ఎదుట యోగ్యంగా జీవించండి
      '22':
        title: ప్రభువుకు భయపడమని పిలిచే క్రీస్తు
      '23':
        title: నిష్కపట హృదయాన్ని ఆదరించే తండ్రి
      '24':
        title: భవిష్యత్తు పునరుత్థానానికి దేవుని హామీ
      '25':
        title: మరణించి మళ్లీ లేచే ఫీనిక్స్ పక్షి
      '26':
        title: నమ్మకమైన సేవకులను లేపే దేవుడు
      '27':
        title: నమ్మకమైన దేవునితో మనసులను బంధించండి
      '28':
