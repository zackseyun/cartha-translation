payload:
  chapter_titles:
    Psalms:
      '4':
        title: దావీదు దేవుని వెలుగును కోరుతున్నాడు
      '5':
        title: దేవుని ముఖదర్శనం కోసం దావీదు ప్రార్థిస్తున్నాడు
      '6':
        title: దేవుని కరుణ కోసం దావీదు మొరపెడుతున్నాడు
      '7':
        title: నీతిమంతుడైన న్యాయాధిపతికి దావీదు మొరపెడుతున్నాడు
      '8':
        title: దావీదు దేవుని మహిమను స్తుతిస్తున్నాడు
      '9':
        title: దావీదు దేవుని పరిపాలనను వేడుకగా జరుపుకుంటున్నాడు
      '10':
        title: దేవుడు చెడును చూసి తీర్పు తీరుస్తాడు
      '11':
        title: దుష్టులకు భయపడటానికి దావీదు నిరాకరిస్తున్నాడు
      '12':
        title: నమ్మదగిన మాటల కోసం దావీదు ప్రార్థిస్తున్నాడు
      '13':
        title: దావీదు దేవుని ప్రేమను నమ్ముతున్నాడు
      '14':
        title: దేవుణ్ణి తిరస్కరించడం నాశనానికి దారితీస్తుంది
      '15':
        title: అర్హతకు ప్రమాణాలేమిటని దావీదు అడుగుతున్నాడు
      '16':
        title: దేవుణ్ణి నమ్ముతూ దావీదు ప్రార్థిస్తున్నాడు
      '17':
        title: న్యాయమైన విమోచన కోసం దావీదు ప్రార్థిస్తున్నాడు
      '18':
        title: రక్షణకు కృతజ్ఞతాస్తుతి కీర్తన
      '19':
        title: దేవుని ధర్మశాస్త్రం, మహిమ ప్రకాశిస్తున్నాయి
      '20':
        title: యెహోవా అభిషిక్త రాజును కాపాడుతున్నాడు
      '21':
        title: రాజు దేవుని బలాన్ని బట్టి ఆనందిస్తున్నాడు
      '22':
        title: తీవ్రమైన పరిత్యాగ భావం స్తుతిగా మారుతుంది
      '23':
        title: కాపరి నా పక్కనే ఉంటాడు
      '24':
        title: యెహోవా పవిత్ర హృదయాలను కోరుతున్నాడు
      '25':
        title: నమ్మకం, విమోచన గురించిన కీర్తన
      '26':
        title: విమోచన కోసం దావీదు ప్రార్థిస్తున్నాడు
      '27':
        title: యెహోవా సన్నిధి కోసం ఆరాటం
      '28':
        title: దేవుడు వినాలని దావీదు ప్రార్థిస్తున్నాడు
      '29':
        title: యెహోవా పరిశుద్ధ వైభవంతో పరిపాలిస్తున్నాడు
      '30':
        title: మరణం నుంచి రక్షించినందుకు స్తుతి
      '31':
        title: దావీదు దేవుని రక్షణను నమ్ముతున్నాడు
      '32':
        title: క్షమించబడిన పాపులు ధన్యులు
      '33':
        title: నమ్మదగిన సృష్టికర్తను స్తుతించండి
      '34':
        title: దేవుడు మంచివాడని రుచి చూసి తెలుసుకోండి
      '35':
        title: విడుదల కోసం దావీదు మొరపెడుతున్నాడు
      '36':
        title: దేవుని ప్రేమ చెడును ముంచెత్తుతుంది
      '37':
        title: దుష్టులను చూసి అసూయపడకుండా దేవుణ్ణి నమ్మండి
      '38':
        title: తీవ్రమైన బాధలో మౌన ప్రార్థన
      '39':
        title: నమ్మకంతో దావీదు మొరపెడుతున్నాడు
      '40':
        title: దేవుడు దావీదును నాశనం నుంచి పైకి లేపుతున్నాడు
      '41':
        title: బలహీనులను దేవుడు ఆదుకుంటాడు
      '42':
        title: సజీవుడైన దేవుని కోసం ఆరాటం
      '43':
        title: పీడించేవారి నుంచి నన్ను కాపాడు
      '44':
        title: గత విజయాల్లో దేవుని శక్తి
      '45':
        title: రాజు సౌందర్యం, శాశ్వత కృప
      '46':
        title: దేవుడు మనల్ని ఎల్లప్పుడూ సురక్షితంగా ఉంచుతాడు
      '47':
        title: ప్రజలందరూ చప్పట్లు కొట్టి, కేకలు వేసి, పాడండి
      '48':
        title: సీయోను మహాశక్తిగల దేవుణ్ణి స్తుతించండి
      '49':
        title: సంపద మరణం నుంచి రక్షించలేదు
      '50':
        title: మండుతున్న పరిశుద్ధతతో దేవుడు తీర్పు తీరుస్తాడు
      '51':
        title: విరిగిన హృదయం నూతనత్వాన్ని కోరుతుంది
      '52':
        title: మోసపూరితమైన అతిశయాన్ని ఎదుర్కొనడం
      '53':
        title: మూర్ఖుడు దేవుడు లేకుండా అవినీతిగా జీవిస్తాడు
      '54':
        title: క్రూరమైన శత్రువుల నుంచి నన్ను రక్షించు
      '55':
        title: ద్రోహం వల్ల కలిగిన దుఃఖంలో దావీదు మొరపెడుతున్నాడు
      '56':
        title: వేటాడే శత్రువుల మధ్య దేవుణ్ణి నమ్మండి
      '57':
        title: పిల్లలను రెక్కల కింద దాచే పక్షిలాంటి ఆశ్రయం
      '58':
        title: అవినీతిపరులైన మానవ పాలకులను ఎదుర్కొనడం
      '59':
        title: హింసాత్మక మనుషుల నుంచి నన్ను రక్షించు
      '60':
        title: నీ ప్రజలను స్వస్థపరచి పునరుద్ధరించు
      '61':
        title: దేవుని కాపుదల కోసం దావీదు ప్రార్థిస్తున్నాడు
      '62':
        title: దావీదు దేవుణ్ణి మాత్రమే నమ్ముతున్నాడు
      '63':
        title: అరణ్యంలోని రాత్రిలో దావీదు ప్రార్థిస్తున్నాడు
      '64':
        title: శత్రులను ఓడించమని దావీదు ప్రార్థిస్తున్నాడు
      '65':
        title: దేవుడు ప్రార్థనలకు జవాబిచ్చి శాంతిని తెస్తాడు
      '66':
        title: భూమంతా దేవునికి ఆనందధ్వని చేయాలి
      '67':
        title: దేవుడు ప్రజలను న్యాయంతో ఆశీర్వదిస్తున్నాడు
      '68':
        title: దేవుడు దుష్టులను చెదరగొట్టి ఆనందం తెస్తాడు
      '69':
        title: బాధలో మునిగిపోయిన వ్యక్తి నిరాశతో చేసే మొర
      '70':
        title: త్వరగా రక్షించమని దావీదు మొరపెడుతున్నాడు
      '71':
        title: నిలకడైన విశ్వాసాన్ని కోరే కీర్తన
      '72':
        title: న్యాయంగా పాలించాలని రాజు ప్రార్థిస్తున్నాడు
      '73':
        title: ఆసాపు దేవుని నమ్మకత్వాన్ని చూస్తున్నాడు
      '74':
        title: దేవా, జ్ఞాపకం చేసుకోమని కీర్తన మొరపెడుతోంది
      '75':
        title: గర్విష్ఠులైన దుష్టులకు దేవుడు తీర్పు తీరుస్తాడు
      '76':
        title: దేవుడు ఆయుధాలను విరగగొట్టి తన గొప్పతనాన్ని చూపుతున్నాడు
      '77':
        title: ఒకడు మొరపెట్టి, దేవుని వైపు తిరిగి, జ్ఞాపకం చేసుకుంటాడు
      '78':
        title: తరతరాలకు నమ్మకమైన నిరీక్షణను అందించడం
      '79':
        title: యెరూషలేము అపవిత్రమైన తర్వాత చేసే మొర
      '80':
        title: దేవా, మమ్మల్ని పునరుద్ధరించమని ప్రార్థిస్తున్నాం
      '81':
        title: దేవుడు ఇశ్రాయేలు కోసం తపిస్తున్నాడు
      '82':
        title: దేవుడు పాలకులకు తీర్పు తీర్చి బలహీనులను కాపాడుతున్నాడు
      '83':
        title: దేవుడు ఇశ్రాయేలు శత్రువులను చెదరగొడుతున్నాడు
      '84':
        title: దేవుని సన్నిధి కోసం ఆరాటం
      '85':
        title: ప్రభువు తన ప్రజలను మళ్లీ పునరుద్ధరిస్తాడు
      '86':
        title: కరుణ, సహాయం కోసం దావీదు ప్రార్థిస్తున్నాడు
      '87':
        title: సీయోను అన్నిటికంటే దేవుణ్ణి ఎక్కువగా ప్రేమిస్తుంది
      '88':
        title: విడిచిపెట్టబడిన ప్రాణం నిరాశతో చేసే మొర
      '89':
        title: దావీదుతో దేవుడు చేసిన నిబంధనను వేడుకగా జరుపుకోవడం
      '90':
        title: జ్ఞానం కోసం మోషే ప్రార్థిస్తున్నాడు
      '91':
        title: విశ్వాసులను దేవుడు కాపాడుతున్నాడు
      '92':
        title: యెహోవాకు ఎల్లప్పుడూ కృతజ్ఞతలు చెల్లించడం
      '93':
        title: సముద్రాలన్నిటికంటే ఉన్నతంగా యెహోవా పరిపాలిస్తున్నాడు
      '94':
        title: దేవుడు చూసి చెడుకు ప్రతిఫలం ఇస్తాడు
      '95':
        title: కృతజ్ఞతతో వచ్చి దేవుణ్ణి ఆరాధించండి
      '96':
        title: కొత్త పాట పాడండి—యెహోవా పరిపాలిస్తున్నాడు
      '97':
        title: సృష్టి అంతటిపైనా యెహోవా పరిపాలిస్తున్నాడు
      '98':
        title: కొత్త పాట పాడి వేడుక చేసుకోండి
      '99':
        title: ప్రభువు న్యాయంగా, కరుణతో పరిపాలిస్తున్నాడు
      '100':
        title: ప్రతి ఒక్కరూ సంతోషంగా యెహోవాను ఆరాధించండి
      '101':
        title: నిజాయతీతో సేవ చేస్తానని దావీదు ప్రమాణం చేస్తున్నాడు
      '102':
        title: నలిగిన ప్రాణం మార్పులేని దేవునికి ప్రార్థిస్తోంది
      '103':
        title: న్యాయవంతుడైన యెహోవాను దావీదు స్తుతిస్తున్నాడు
