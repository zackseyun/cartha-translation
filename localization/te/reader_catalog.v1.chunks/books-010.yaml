contract_version: 1
locale: te
source_catalog_sha256: ec74c36516f84fea14e3d62329a38731b464f113276935cab09aa146bdd1e82b
source_chunk_sha256: 1190a2922e229e19ae5720ec9b28a5a7c3b27d88957949f34f1cb0eacc7f2e8f
chunk_id: books-010
status: reviewed
payload:
  book_metadata:
    Joel:
      display_name: యోవేలు
      author: పెతూయేలు కుమారుడైన యోవేలు.
      audience: మిడతల దండును యెహోవా దినానికి సూచనగా భావించి స్పందిస్తున్న చెర అనంతర యూదా ప్రజలు.
      date: బహుశా క్రీ.పూ. 5వ–4వ శతాబ్దాల కాలం.
    Amos:
      display_name: ఆమోసు
      author: ఉత్తర ప్రాంతంలో ప్రకటించిన యూదా కాపరి, తెకోవకు చెందిన ఆమోసు.
      audience: యరొబాము II పాలనలో సుసంపన్నతతోపాటు అన్యాయం నెలకొన్న కాలంలోని ఉత్తర ఇశ్రాయేలు.
      date: సుమారు క్రీ.పూ. 760–750.
    Obadiah:
      display_name: ఓబద్యా
      author: ఓబద్యా.
      audience: ఎదోము యెరూషలేముకు ద్రోహం చేసిన తర్వాతి యూదా ప్రజలు—ఎదోము పతనాన్ని గురించిన ప్రవచనం.
      date: క్రీ.పూ. 586 తర్వాత కొద్దికాలానికే.
    Jonah:
      display_name: యోనా
      author: రచయిత తెలియదు; కథలో ప్రధాన పాత్ర అమిత్తయి కుమారుడైన యోనా.
      audience: చెర అనంతర ఇశ్రాయేలు—జాతిపరమైన సంకుచిత దృష్టిని వ్యంగ్యంగా మందలిస్తూ, బయటి ప్రజలపట్ల దేవుని కరుణను ధ్రువీకరించే రచన.
      date: బహుశా క్రీ.పూ. 5వ–4వ శతాబ్దాల కాలం.
    Micah:
      display_name: మీకా
      author: మోరెషెతుకు చెందిన మీకా.
      audience: క్రీ.పూ. 8వ శతాబ్దం చివరి భాగంలోని యూదా ప్రజలు; ముఖ్యంగా పట్టణ ఉన్నతవర్గాల చేతిలో బాధపడిన గ్రామీణ పేదలు.
      date: సుమారు క్రీ.పూ. 740–700.
    Nahum:
      display_name: నహూము
      author: ఎల్కోషుకు చెందిన నహూము.
      audience: నినెవె త్వరలో పతనం కానున్నందుకు సంతోషిస్తున్న యూదా ప్రజలు.
      date: క్రీ.పూ. 612కు కొద్దికాలం ముందు.
    Habakkuk:
      display_name: హబక్కూకు
      author: హబక్కూకు.
      audience: బబులోను ఎదుగుదలను ఎదుర్కొంటున్న యూదా ప్రజలు—న్యాయం గురించి ఒక ప్రవక్త దేవునితో జరిపిన సంభాషణ.
      date: సుమారు క్రీ.పూ. 7వ శతాబ్దం చివరి కాలం.
    Zephaniah:
      display_name: జెఫన్యా
      author: కూషీ కుమారుడైన జెఫన్యా.
      audience: యోషీయా సంస్కరణలకు ముందు అతని పాలనలో ఉన్న యూదా ప్రజలు.
      date: సుమారు క్రీ.పూ. 640–609.
    Haggai:
      display_name: హగ్గయి
      author: హగ్గయి.
      audience: దర్యావేషు పాలనలో దేవాలయాన్ని తిరిగి నిర్మిస్తున్న చెరనుంచి వచ్చిన ప్రజలు.
      date: క్రీ.పూ. 520.
    Zechariah:
      display_name: జెకర్యా
      author: బెరెక్యా కుమారుడైన జెకర్యా; 9–14 అధ్యాయాలు బహుశా తర్వాతి రచయిత రాసినవి.
      audience: దేవాలయాన్ని తిరిగి నిర్మిస్తున్న చెరనుంచి వచ్చిన ప్రజలు, అలాగే ఆ తర్వాతి చెర అనంతర సమాజాలు.
      date: 1–8 అధ్యాయాలు సుమారు క్రీ.పూ. 520–518; 9–14 అధ్యాయాలు బహుశా ఒక శతాబ్దం తర్వాత.
    Malachi:
      display_name: మలాకీ
      author: రచయిత తెలియదు; “మలాకీ” అంటే “నా సందేశకుడు.”
      audience: పర్షియా పాలనలో ఆరాధనలోనూ విశ్వాసనీయతలోనూ నిర్లక్ష్యంగా మారుతున్న చెర అనంతర యూదా ప్రజలు.
      date: సుమారు క్రీ.పూ. 5వ శతాబ్దం మధ్యకాలం.
    Matthew:
      display_name: మత్తయి
      author: రచయిత తెలియదు; సంప్రదాయం దీన్ని అపొస్తలుడైన మత్తయికి ఆపాదిస్తుంది. ఆధునిక పండితుల అభిప్రాయం ప్రకారం, గ్రీకు మాట్లాడే ఒక యూదు క్రైస్తవ రచయిత మార్కు రచననూ, ‘Q’ను పోలిన ఒక మూలాన్నీ ఉపయోగించాడు.
      audience: సమాజమందిర కేంద్రిత యూదా మతంతో తమకున్న కొనసాగింపునూ, తెగిపోయిన అంశాలనూ అర్థం చేసుకోవడానికి ప్రయత్నిస్తున్న ఒక యూదు క్రైస్తవ సమాజం.
      date: సుమారు క్రీ.శ. 80–90.
    Mark:
      display_name: మార్కు
      author: రచయిత తెలియదు; సంప్రదాయం దీన్ని పేతురు ప్రయాణ సహచరుడైన యోహాను మార్కుతో అనుసంధానిస్తుంది.
      audience: బహుశా రోములో, హింసను ఎదుర్కొంటున్న లేదా దాని ముప్పులో ఉన్న గ్రీకు మాట్లాడే క్రైస్తవ సమాజం.
      date: యూదుల యుద్ధం, దేవాలయ విధ్వంసం జరిగిన కాలానికి దగ్గరగా, సుమారు క్రీ.శ. 65–75.
  chapter_titles:
    Hosea:
      '12':
        title: అబద్ధాలకు, హింసకు తీర్పుతో ప్రతిఫలం
      '13':
        title: ఒకప్పుడు బలంగా ఉన్న ఎఫ్రాయిము ఇప్పుడు పారిపోతోంది
      '14':
        title: ఇశ్రాయేలు పశ్చాత్తాపపడి కరుణ కోరుతుంది
    Joel:
      '1':
        title: ఉపవాసం చేయాలని యోవేలు పిలుపు
      '2':
        title: పూర్ణహృదయంతో తిరిగి రండి
      '3':
        title: అందరిపై ఆత్మ కుమ్మరింపు
      '4':
        title: తీర్పుకోసం సమకూడే దేశాలు
    Amos:
      '1':
        title: దేశాల క్రూరత్వానికి దేవుని తీర్పు
      '2':
        title: ఇశ్రాయేలుకు తప్పని తీర్పు
      '3':
        title: ఇశ్రాయేలు పాపాలు విపత్తును తెస్తాయి
      '4':
        title: ధనిక స్త్రీలకు తీర్పు
      '5':
        title: పశ్చాత్తాపపడకపోతే దేశం పతనమవుతుంది
      '6':
        title: వినాశాన్ని పట్టించుకోని సుఖజీవులైన ఉన్నతవర్గం
      '7':
        title: వినాశన దర్శనాలు చూసిన ఆమోసు
      '8':
        title: వేసవి పండ్లు ఇశ్రాయేలు అంతాన్ని సూచిస్తాయి
      '9':
        title: తప్పించుకోలేని తీర్పు, పునరుద్ధరణ
    Obadiah:
      '1':
        title: ద్రోహం చేసిన ఎదోముకు తీర్పు
    Jonah:
      '1':
        title: నినెవెకు వెళ్లే బాధ్యతనుంచి పారిపోయిన యోనా
      '2':
        title: చేప కడుపులో యోనా ప్రార్థన
      '3':
        title: యోనా పిలుపుతో నినెవె పశ్చాత్తాపం
      '4':
        title: దేవుని కరుణపై యోనా అసంతృప్తి
    Micah:
      '1':
        title: సమరయకు, యూదాకు దేవుని తీర్పు
      '2':
        title: అత్యాశతో కుట్రలు పన్నేవారిని ఖండించిన మీకా
      '3':
        title: ప్రజలను క్రూరంగా దోచుకునే నాయకులు
      '4':
        title: సమస్త దేశాలపై యెహోవా పరిపాలన
      '5':
        title: బెత్లెహేము నుండి రానున్న దావీదు వంశపు రాజు
      '6':
        title: ఇశ్రాయేలుపై యెహోవా వ్యాజ్యం
      '7':
        title: దుఃఖంలో మీకా ప్రార్థన
    Nahum:
      '1':
        title: నినెవె అపరాధానికి దేవుని శిక్ష
      '2':
        title: యూదాకు శాంతివార్త తెచ్చే సందేశకుడు
      '3':
        title: నినెవెకు సంపూర్ణ అవమానం
    Habakkuk:
      '1':
        title: దుష్టుల పాలనపై హబక్కూకు విలాపం
      '2':
        title: గర్విష్ఠులైన అణచివేతదారులకు దేవుని హెచ్చరిక
      '3':
        title: పవిత్ర భయంతో హబక్కూకు ప్రార్థన
    Zephaniah:
      '1':
        title: పాపం కారణంగా యూదాకు దేవుని తీర్పు
      '2':
        title: దేశాలకు శిక్ష, అయినా మిగిలే నిరీక్షణ
      '3':
        title: శుద్ధీకరించబడిన ప్రజలలో సీయోను ఆనందం
    Haggai:
      '1':
        title: తన మందిరాన్ని తిరిగి నిర్మించమని యెహోవా ప్రోత్సాహం
      '2':
        title: దేవాలయ నిర్మాణకారులను దేవుడు ప్రోత్సహిస్తాడు
    Zechariah:
      '1':
        title: కరుణతో తిరిగి వచ్చే దేవుడు
      '2':
        title: ఆనందంతో నిండిపొంగే యెరూషలేము
      '3':
        title: దేవుడు యెహోషువను శుద్ధి చేస్తాడు
      '4':
        title: ఆత్మచేత నిర్మించే జెరుబ్బాబెలు
      '5':
        title: దేశం నుండి తొలగించబడిన దుష్టత్వం
      '6':
        title: యాజకుడైన యెహోషువకు కిరీటాలు
      '7':
        title: న్యాయం లేకుంటే ఉపవాసం వ్యర్థం
      '8':
        title: శాంతితో పునర్నిర్మితమయ్యే సీయోను
      '9':
        title: వినయంతో వచ్చే ఇశ్రాయేలు రాజు
      '10':
        title: విగ్రహాలను కాదు, వర్షాన్ని కోరండి
      '11':
        title: గొర్రెలను విడిచిపెట్టే కాపరి
      '12':
        title: దేశాలకు భయంకరంగా మారే యెరూషలేము
      '13':
        title: పాపం నుండి శుద్ధీకరించబడే దేశం
      '14':
        title: యెరూషలేము కోసం యుద్ధం చేసే యెహోవా
    Malachi:
      '1':
        title: నిజాయతీలేని యాజకులను దేవుడు ఖండిస్తాడు
      '2':
        title: యూదా ద్రోహం చేసిన నిబంధన
      '3':
        title: శుద్ధీకరణకు మార్గం సిద్ధం చేసే సందేశకుడు
    Matthew:
      '1':
        title: మెస్సీయ వంశంలో యేసు జననం
      '2':
        title: నవజాత రాజును ఆరాధించిన జ్ఞానులు
      '3':
        title: యోహాను బాప్తిస్మమిచ్చిన అభిషిక్తుడైన యేసు
      '4':
        title: దేవుని రాజ్యం సమీపించిందని యేసు బోధ
      '5':
        title: దేవుని రాజ్య జీవన విధానాన్ని బోధించిన యేసు
      '6':
        title: మొదట తండ్రి రాజ్యాన్ని వెదకండి
      '7':
        title: క్రీస్తు అనే పునాదిపై మీ జీవితాన్ని నిర్మించండి
      '8':
        title: స్వస్థపరచి తన అధికారాన్ని చూపిన యేసు
