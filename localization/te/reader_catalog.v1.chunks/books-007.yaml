contract_version: 1
locale: te
source_catalog_sha256: ec74c36516f84fea14e3d62329a38731b464f113276935cab09aa146bdd1e82b
source_chunk_sha256: 802fbd2f0c1e897bd2b820b4768b7c4df6ee5b61f7290f4300b2c66a87501b4f
chunk_id: books-007
status: reviewed
payload:
  book_metadata:
    Proverbs:
      display_name: సామెతలు
      author: ఇది ఒక సంకలనం; శీర్షికలు సొలొమోను, అగూరు, లెమూయేలు, అలాగే "జ్ఞానులు" అని పేర్కొంటాయి.
      audience: దైనందిన జీవితానికి అవసరమైన జ్ఞానంలో తీర్చిదిద్దబడుతున్న యువ ఇశ్రాయేలీయులు.
      date: రచనలోని వివిధ పొరలు సుమారు క్రీ.పూ. 10వ–4వ శతాబ్దాలకు చెందినవి.
    Ecclesiastes:
      display_name: ప్రసంగి
      author: రచయిత ఎవరో తెలియదు; మాట్లాడే వ్యక్తిని "కోహెలెతు" అని పిలుస్తారు, సంప్రదాయం ప్రకారం ఆయనను సొలొమోనుగా గుర్తిస్తారు.
      audience: సూర్యుని కింద జ్ఞానం, సంపద, శ్రమలకు ఉన్న పరిమితులను ఎదుర్కొంటున్న ఇశ్రాయేలీయులు.
      date: అరామిక్ ప్రభావం ఉన్న హీబ్రూ భాష ఆధారంగా, బహుశా సుమారు క్రీ.పూ. 5వ–3వ శతాబ్దాలు.
    Song of Solomon:
      display_name: పరమగీతము
      author: రచయిత ఎవరో తెలియదు; పైశీర్షిక సొలొమోనును ప్రస్తావిస్తుంది.
      audience: శృంగార ప్రేమను నిబంధనలోని సాన్నిహిత్యాన్ని అర్థం చేసుకునే దృక్కోణంగా చదివిన ఇశ్రాయేలు—తరువాత దానిని రూపకాలంకారంగా చదివిన యూదు, క్రైస్తవ పాఠకులు కూడా.
      date: బహుశా చెర అనంతర కాలం, సుమారు క్రీ.పూ. 5వ–3వ శతాబ్దాలు.
  chapter_titles:
    Psalms:
      '104':
        title: యెహోవా సృష్టిస్తాడు, పోషిస్తాడు, నూతనపరుస్తాడు
      '105':
        title: దేవునికి కృతజ్ఞతలు చెల్లించండి, నిబంధనను జ్ఞాపకం చేసుకోండి
      '106':
        title: మరచిపోయిన ప్రేమ, శాశ్వత విమోచన
      '107':
        title: విమోచించబడినవారు ప్రభువుకు కృతజ్ఞతలు చెల్లించాలి
      '108':
        title: విడుదల కోసం దావీదు ప్రార్థన
      '109':
        title: దుష్టుడైన పీడకునికి వ్యతిరేకంగా అత్యవసర మొర
      '110':
        title: పరిశుద్ధ వైభవంతో దావీదు పరిపాలన
      '111':
        title: పూర్ణహృదయంతో యెహోవాను స్తుతించండి
      '112':
        title: దైవభక్తిగల వ్యక్తి ధన్యుడు
      '113':
        title: దీనులను హెచ్చించే యెహోవాను స్తుతించండి
      '114':
        title: ఇశ్రాయేలు నిర్గమనం—ప్రకృతి స్పందన
      '115':
        title: యెహోవాకే మహిమ
      '116':
        title: తనను రక్షించే యెహోవాను కీర్తనకర్త ప్రేమిస్తాడు
      '117':
        title: నిలిచే ప్రేమగల యెహోవాను స్తుతించండి
      '118':
        title: కృతజ్ఞతలు చెల్లించమని పిలిచే 118వ కీర్తన
      '120':
        title: కీర్తనకర్త మొరపెట్టగా ప్రభువు జవాబిస్తాడు
      '121':
        title: సహాయం ప్రభువు నుంచే వస్తుంది
      '122':
        title: యెరూషలేము శాంతి కోసం దావీదు ప్రార్థన
      '123':
        title: యెహోవాను నమ్ముతూ పైకి చూసే కీర్తనకర్త
      '124':
        title: ప్రమాదం నుంచి ఇశ్రాయేలును రక్షించే యెహోవా
      '125':
        title: నమ్మకం స్థిరమైన భద్రతను ఇస్తుంది
      '126':
        title: సీయోను పునరుద్ధరణ తెచ్చిన అపార ఆనందం
      '127':
        title: యెహోవా నిర్మిస్తాడు, కాపాడుతాడు
      '128':
        title: దేవునికి భయపడేవారు ధన్యులు
      '129':
        title: ఇశ్రాయేలు శత్రువులు మనలను ఓడించలేరు
      '130':
        title: కరుణ కోసం కీర్తనకర్త మొర
      '131':
        title: దేవుని సన్నిధిలో నిశ్చలంగా విశ్రమించే దావీదు
      '132':
        title: యెహోవా నివాసస్థలాన్ని వెదికే దావీదు
      '133':
        title: దైవభక్తిగల ఐక్యతను ప్రశంసించే దావీదు
      '134':
        title: రాత్రి కావలివారు యెహోవాను స్తుతిస్తారు
      '135':
        title: విగ్రహాలను జయించే యెహోవాను స్తుతించండి
      '136':
        title: అంతులేని ప్రేమగల యెహోవాకు కృతజ్ఞతలు
      '137':
        title: యెరూషలేమును జ్ఞాపకం చేసుకొని విలపించే చెరలోని ప్రజలు
      '138':
        title: బహిరంగంగా యెహోవాకు కృతజ్ఞతలు తెలిపే దావీదు
      '139':
        title: దేవుని పరిపూర్ణ జ్ఞానం, సన్నిధి
      '140':
        title: హింస నుంచి దావీదును కాపాడే దేవుడు
      '141':
        title: తన మాటలకు కాపలా కోసం దావీదు ప్రార్థన
      '142':
        title: ప్రభువుకు మొరపెట్టే దావీదు
      '143':
        title: కరుణ కోసం దావీదు ప్రార్థన
      '144':
        title: రక్షణ కోసం దావీదు ప్రార్థన
      '145':
        title: దేవుని మహిమను స్తుతించే దావీదు
      '146':
        title: ఆత్మ దేవుణ్ణి నిత్యం స్తుతిస్తుంది
      '147':
        title: తిరిగి నిర్మించి స్వస్థపరిచే యెహోవాను స్తుతించండి
      '148':
        title: సృష్టి అంతా ప్రభువును స్తుతిస్తుంది
      '149':
        title: సమస్తం యాహ్‌ను స్తుతించాలి
      '150':
        title: అన్ని వాయిద్యాలతో యాహ్‌ను స్తుతించండి
    Proverbs:
      '1':
        title: ప్రభువుపట్ల భయభక్తులను బోధించే సొలొమోను
      '2':
        title: దేవుని వెదకడం ద్వారా జ్ఞానం లభిస్తుంది
      '3':
        title: దేవుని నమ్మి జ్ఞానం పొందండి
      '4':
        title: అన్నిటికన్నా జ్ఞానమే ముఖ్యమని తండ్రి ప్రబోధం
      '5':
        title: వ్యభిచారానికి దూరంగా ఉండాలని తండ్రి హెచ్చరిక
      '6':
        title: పాపం, సోమరితనానికి వ్యతిరేకంగా హెచ్చరికలు
      '7':
        title: వ్యభిచారపు ప్రలోభానికి చాలా దూరంగా ఉండండి
      '8':
        title: వెదికేవారిని పిలిచే జ్ఞానం
      '9':
        title: జ్ఞానం ఆహ్వానిస్తుంది, మూర్ఖత్వం ప్రలోభపెడుతుంది
      '10':
        title: నీతి, దుష్టత్వం మధ్య వ్యత్యాసాలు
      '11':
        title: యథార్థత ఆశీర్వాదానికి నడిపిస్తుంది
      '12':
        title: నీతిమంతులు జ్ఞానంతో చక్కగా జీవిస్తారు
      '13':
        title: నేర్చుకోవడానికి సిద్ధంగా ఉండడం జీవానికి నడిపిస్తుంది
      '14':
        title: జ్ఞానం ఇంటిని కడుతుంది, ప్రభువును గౌరవిస్తుంది
      '15':
        title: మృదువైన మాట జీవాన్ని తెస్తుంది
      '16':
        title: మనిషి ప్రణాళికలు వేస్తాడు, ఫలితాలను దేవుడు నిర్దేశిస్తాడు
      '17':
        title: దేవునిపట్ల భయభక్తులు జ్ఞానాన్ని ఇస్తాయి
      '18':
        title: జ్ఞానం వింటుంది, మూర్ఖత్వం దిద్దుబాటును తిరస్కరిస్తుంది
      '19':
        title: సంపదకన్నా యథార్థత ఎప్పుడూ మేలు
      '20':
        title: మద్యపానాన్ని నివారించండి, యథార్థతను విలువైనదిగా ఎంచండి
      '21':
        title: హృదయాలను తీర్చే దేవుడు న్యాయాన్ని విలువైనదిగా చూస్తాడు
      '22':
        title: వినయం దేవునికి మరింత ఘనత తెస్తుంది
      '23':
        title: అతిగా తినడం, అత్యాశ గురించి హెచ్చరికలు
      '24':
        title: దుష్టులను చూసి అసూయపడకండి
      '25':
        title: వినయంగా ఉండమని జ్ఞానం పిలుస్తుంది
      '26':
        title: మూర్ఖులు తమకూ ఇతరులకూ హాని చేస్తారు
      '27':
        title: వినయాన్ని, వాస్తవిక దృష్టిని బోధిస్తుంది
      '28':
        title: యెహోవాను వెదకడం ద్వారా నీతిమంతులు జయిస్తారు
      '29':
        title: మొండితనం నాశనానికి నడిపిస్తుంది
      '30':
        title: గాఢమైన వినయంతో మాట్లాడే అగూరు
      '31':
        title: న్యాయాన్ని నిలబెట్టమని రాజును హెచ్చరించే తల్లి
    Ecclesiastes:
      '1':
        title: సూర్యుని కింద ఉన్నదంతా వ్యర్థమే
      '2':
        title: సుఖం శాశ్వతమైన లాభాన్ని ఇవ్వదు
      '3':
        title: ప్రతి కార్యానికీ తగిన సమయం వస్తుంది
      '4':
        title: క్రూరమైన అణచివేతతో నిండిన జీవితం
      '5':
        title: దేవునిపట్ల భయభక్తులు కలిగి మొక్కుబడులు చెల్లించండి
      '6':
        title: అనుభవించలేని సంపద చేదైనది
      '7':
        title: గర్వం కంటే జ్ఞానం మేలు
      '8':
        title: వినయంగా జీవించడాన్ని బోధించే జ్ఞానం
      '9':
        title: నీతిమంతులకూ దుష్టులకూ ఒకే గతి
      '10':
        title: మూర్ఖత్వం జ్ఞానాన్ని త్వరగా పాడుచేస్తుంది
      '11':
        title: అవకాశం ఉన్నప్పుడే సాహసించండి
      '12':
        title: యౌవనంలోనే సృష్టికర్తను జ్ఞాపకం చేసుకోండి
    Song of Solomon:
      '1':
        title: తన ప్రియుణ్ణి వెదికే స్త్రీ
      '2':
        title: ప్రేమికులు పరస్పరం గాఢమైన ప్రశంసను వ్యక్తం చేస్తారు
      '3':
        title: పట్టణంలో తన ప్రియుణ్ణి కనుగొన్న స్త్రీ
      '4':
        title: వధువు శరీర సౌందర్యాన్ని ప్రశంసించే పురుషుడు
      '5':
        title: కనిపించని ప్రియుణ్ణి వెదికే స్త్రీ
      '6':
        title: అద్వితీయమైన అంకితభావాన్ని, ప్రేమను కొనియాడే పురుషుడు
      '7':
        title: స్త్రీ సౌందర్యాన్ని ప్రశంసించే ఆమె ప్రియుడు
      '8':
