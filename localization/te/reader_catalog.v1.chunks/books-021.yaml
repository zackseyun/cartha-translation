payload:
  book_metadata:
    Thunder, Perfect Mind:
      display_name: ఉరుము, పరిపూర్ణ మనస్సు
      author: అజ్ఞాత రచయిత.
      audience: గ్రీకు-ఐగుప్తీయ జ్ఞానసాహిత్య లేదా జ్ఞానవాద పాఠకులు; దైవిక స్త్రీమూర్తి స్వరంలో స్త్రీ రూపక స్వీయప్రకటన కవిత.
      date: బహుశా క్రీ.శ. 1–2వ శతాబ్దాలు; నాగ్ హమ్మాదిలో (NHC VI,2) భద్రపరచబడింది.
    Testament of Reuben:
      display_name: రూబేను వీలునామా
      author: అజ్ఞాత రచయిత; యాకోబు కుమారులు మరణశయ్యపై చేసిన ప్రసంగాలుగా సమర్పించబడిన పన్నెండు పితరుల వీలునామాలలో భాగం.
      audience: పితరుల పాపాంగీకారాల నుండి నైతికతను నేర్చుకునే యూదు (ఆ తరువాత క్రైస్తవ) పాఠకులు.
      date: క్రైస్తవ పూర్వ యూదు మూలభాగం బహుశా క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదకీయ పొర బహుశా క్రీ.శ. 1–2వ శతాబ్దాలకు చెందినది.
    Testament of Simeon:
      display_name: షిమ్యోను వీలునామా
      author: అజ్ఞాత రచయిత; పన్నెండు పితరుల వీలునామాలలో భాగం.
      audience: యూదు (ఆ తరువాత క్రైస్తవ) పాఠకులు.
      date: యూదు మూలభాగం బహుశా క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదన బహుశా క్రీ.శ. 1–2వ శతాబ్దాలకు చెందినది.
    Testament of Levi:
      display_name: లేవి వీలునామా
      author: అజ్ఞాత రచయిత; పన్నెండు పితరుల వీలునామాలలో భాగం.
      audience: యూదు (ఆ తరువాత క్రైస్తవ) పాఠకులు; ముఖ్యంగా యాజకత్వం పట్ల ఆసక్తిగల సమూహాలు.
      date: యూదు మూలభాగం బహుశా క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదన బహుశా క్రీ.శ. 1–2వ శతాబ్దాలకు చెందినది.
    Testament of Judah:
      display_name: యూదా వీలునామా
      author: అజ్ఞాత రచయిత; పన్నెండు పితరుల వీలునామాలలో భాగం.
      audience: యూదు (ఆ తరువాత క్రైస్తవ) పాఠకులు.
      date: యూదు మూలభాగం బహుశా క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదన బహుశా క్రీ.శ. 1–2వ శతాబ్దాలకు చెందినది.
    Testament of Issachar:
      display_name: ఇశ్శాఖారు వీలునామా
      author: అజ్ఞాత రచయిత; పన్నెండు పితరుల వీలునామాలలో భాగం.
      audience: యూదు (ఆ తరువాత క్రైస్తవ) పాఠకులు.
      date: యూదు మూలభాగం బహుశా క్రీ.పూ. 2వ శతాబ్దానికి చెందినది; క్రైస్తవ సంపాదన బహుశా క్రీ.శ. 1–2వ శతాబ్దాలకు చెందినది.
  chapter_titles:
    Shepherd of Hermas:
      '47':
        title: హెర్మాస్ నిజమైన నగరాన్ని ఎంచుకుంటాడు
      '48':
        title: సంపద సేవ చేయాల్సిన బాధ్యతను తెస్తుంది
      '49':
        title: పంచుకున్న సంపద పరిపూర్ణతను తెస్తుంది
      '50':
        title: హెర్మాస్ ఉపవాసాన్ని తప్పుగా అర్థం చేసుకుంటాడు
      '51':
        title: హెర్మాస్ అవగాహన కోసం వెదుకుతాడు
      '52':
        title: ఉపమాన భావం హెర్మాస్‌కు బోధించబడుతుంది
      '53':
        title: హెర్మాస్ శరీరాన్నీ ఆత్మనూ శుద్ధి చేసుకుంటాడు
      '54':
        title: విలాసంగా పెరిగిన గొర్రెలను కాసే కాపరులను చూడు
      '55':
        title: కఠిన కాపరి భోగాసక్తిగల గొర్రెలకు క్రమశిక్షణ నేర్పుతాడు
      '56':
        title: దారి తప్పిన గొర్రెలను కాపరి శిక్షిస్తాడు
      '57':
        title: భోగాసక్తికి తీవ్రమైన శిక్ష పడుతుంది
      '58':
        title: శిక్షాకాలం గురించి హెర్మాస్ ప్రశ్నిస్తాడు
      '59':
        title: ఉపశమనం కోసం హెర్మాస్ ప్రార్థిస్తాడు
      '60':
        title: పశ్చాత్తాపానికి వినయపూర్వక క్రమశిక్షణ, సహనం అవసరం
      '61':
        title: ఫలమున్నవారికి దేవదూత కిరీటాలు పెడతాడు
      '62':
        title: చెట్టు దేవుని ధర్మశాస్త్రానికి ప్రతీక
      '63':
        title: మళ్లీ నాటిన కొమ్మలను కాపరి వేరు చేస్తాడు
    Thunder, Perfect Mind:
      '1':
        title: అన్వేషకులతో ఉరుము మాట్లాడుతుంది
      '2':
        title: నేనే మొదటిదాన్ని, చివరిదాన్ని, కన్యను
      '3':
        title: జ్ఞానం, అజ్ఞానం ఏకమవుతాయి
      '4':
        title: భయం, బలం నాలో ఉన్నాయి
      '5':
        title: ఆమె ద్వేషించబడింది, ప్రేమించబడింది, మరణమని పిలువబడింది
      '6':
        title: మనస్సు, విశ్రాంతి నాలో ఉన్నాయి
      '7':
        title: నా ద్వారా శాంతి యుద్ధాన్ని తెస్తుంది
      '8':
        title: వినబడే స్వరంలో నిశ్శబ్దం
      '9':
        title: నేనే న్యాయం, పక్షవాది
      '10':
        title: సృష్టికర్త పేరును నేను బిగ్గరగా పిలుస్తాను
      '11':
        title: ఓర్పు, క్షమ వస్తాయి
    Testament of Reuben:
      '1':
        title: పాపపు పట్టు గురించి రూబేను హెచ్చరిస్తాడు
      '2':
        title: ఏడు ఆత్మలు మానవాళిని నియంత్రిస్తాయి
      '3':
        title: ఏడు భ్రమలు యువతను బంధిస్తాయి
      '4':
        title: కామాన్నీ విగ్రహారాధననూ ఇప్పుడే విడిచిపెట్టండి
      '5':
        title: స్త్రీలు ప్రలోభపెట్టి ఉచ్చులో పడేస్తారు
      '6':
        title: బెలియారు ఉచ్చుల నుండి మనస్సులను కాపాడుకోండి
      '7':
        title: రూబేను ఎముకలు స్వదేశానికి చేరుతాయి
    Testament of Simeon:
      '1':
        title: సాక్ష్యమివ్వడానికి షిమ్యోను తన కుమారులను సమకూరుస్తాడు
      '2':
        title: అసూయతో పన్నిన పన్నాగాల గురించి షిమ్యోను పశ్చాత్తాపపడతాడు
      '3':
        title: షిమ్యోను అసూయాత్మతో పోరాడతాడు
      '4':
        title: యోసేపు కనికరం చూపుతాడు; షిమ్యోను హెచ్చరిస్తాడు
      '5':
        title: పవిత్రత సౌందర్యాన్ని ఇస్తుంది; పాపాన్ని తిరస్కరించండి
      '6':
        title: చెడును తిరస్కరించి పవిత్రతలో వర్ధిల్లండి
      '7':
        title: రాబోయే రాజు గురించి షిమ్యోను ప్రవచిస్తాడు
      '8':
        title: షిమ్యోను మరణిస్తాడు; అతని ఎముకలు హెబ్రోనుకు తీసుకురాబడతాయి
      '9':
        title: షిమ్యోను కోసం దుఃఖిస్తూ నిర్గమణం కోసం వేచి ఉండండి
    Testament of Levi:
      '1':
        title: తన మరణాన్ని లేవి ప్రవచిస్తాడు
      '2':
        title: పరలోకపు భ్రష్టతను లేవి చూస్తాడు
      '3':
        title: దేవుని ఉగ్రతకు ఆకాశాలు వణుకుతాయి
      '4':
        title: పవిత్ర పరిచర్య కోసం లేవి ఎన్నుకోబడతాడు
      '5':
        title: ప్రతీకారం కోసం దేవదూత లేవికి ఆయుధాలు ఇస్తాడు
      '6':
        title: సంహారంలో చూపిన ఉగ్రతకు లేవి ప్రాయశ్చిత్తం చేస్తాడు
      '7':
        title: లేవి ఖడ్గం వల్ల షెకెము శాపగ్రస్తమవుతుంది
      '8':
        title: దేవదూతలు లేవిని యాజకత్వానికి ప్రతిష్ఠిస్తారు
      '9':
        title: ఇస్సాకు లేవికి ధర్మశాస్త్రాలను బోధిస్తాడు
      '10':
        title: భవిష్యత్తులోని దుష్టత్వం గురించి లేవి హెచ్చరిస్తాడు
      '11':
        title: ప్రవచనార్థంతో లేవి తన కుమారులకు పేర్లు పెడతాడు
      '12':
        title: లేవి తన వంశావళులను నమోదు చేస్తాడు
      '13':
        title: దేవుని ధర్మశాస్త్రానికి భయభక్తులు చూపమని లేవి ఆజ్ఞాపిస్తాడు
      '14':
        title: యాజకులు తమ పిలుపుకు ద్రోహం చేస్తారు
      '15':
        title: తీర్పు వల్ల దేవాలయం శిథిలమవుతుంది
      '16':
        title: తిరుగుబాటు నిండిన డెబ్బై వారాలు
      '17':
        title: అపవిత్రత నిండిన ఏడు జూబిలీలు
      '18':
        title: నిత్య యాజకుడు లోకాన్ని ప్రకాశింపజేస్తాడు
      '19':
        title: కుమారులు దేవుని ధర్మశాస్త్రాన్ని పాటిస్తామని నిశ్చయించుకుంటారు
    Testament of Judah:
      '1':
        title: యూదా తన కుమారులతో చివరి మాటలు పంచుకుంటాడు
      '2':
        title: దేవుడు అనుగ్రహించిన యోధబలాన్ని యూదా చూపిస్తాడు
      '3':
        title: యూదా ఒంటరిగా కనానీయ రాజులను ఓడిస్తాడు
      '4':
        title: యూదాను కాపాడుతున్న దేవదూతను యాకోబు చూస్తాడు
      '5':
        title: యూదా అరేతాను, తప్పూవేను జయిస్తాడు
      '6':
        title: యూదా భీకర యుద్ధంలో గెలుస్తాడు
      '7':
        title: అస్త్రవర్షంలో యూదా దూసుకుపోతాడు
      '8':
        title: యూదా షూవాను పెళ్లి చేసుకొని కుమారులను కంటాడు
      '9':
        title: ఏశావు మహాసైన్యాన్ని యూదా ఓడిస్తాడు
      '10':
        title: దుష్ట కుమారుల వల్ల తామారు బాధపడుతుంది
      '11':
        title: తన భార్య పాపాలను యూదా శపిస్తాడు
      '12':
        title: తామారు యూదాను మోసగించి అతని దండాన్ని తీసుకుంటుంది
      '13':
        title: పాపాల గురించి యూదా తన పిల్లలను హెచ్చరిస్తాడు
      '14':
        title: మద్యపానం, పాపాల గురించి యూదా హెచ్చరిస్తాడు
      '15':
