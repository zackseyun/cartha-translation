chunk_id: books-016
status: reviewed
payload:
  book_metadata:
    1 Enoch:
      display_name: 1 హనోకు
      author: రచయిత తెలియదు; జలప్రళయానికి పూర్వం జీవించిన పితరుడైన హనోకు పేరుతో రాసినదిగా ఆపాదించబడింది. అనేక విభిన్న విభాగాలను కలిపి రూపొందించిన సంకలన గ్రంథం.
      audience: విశ్వవ్యాప్త దుష్టత్వం, తీర్పు, కాలగణన గురించి ఆలోచించిన యూదుల అంత్యకాల దర్శన సమాజాల కోసం; తరువాత తొలి క్రైస్తవ వర్గాల్లోనూ చదవబడింది.
      date: విభాగాలు సుమారు క్రీ.పూ. 3వ శతాబ్దం నుంచి క్రీ.శ. 1వ శతాబ్దం మధ్య సంకలనం చేయబడ్డాయి; సంపూర్ణ రూపం గెయెజ్ (ఇథియోపిక్) భాషలో మాత్రమే భద్రపరచబడింది.
  chapter_titles:
    1 Clement:
      '47':
        title: మీకు రాసిన పౌలు పత్రికను జ్ఞాపకం చేసుకోండి
      '48':
        title: పవిత్రులై నీతి ద్వారంలో ప్రవేశించండి
      '49':
        title: ప్రేమ మనలను దేవునితో ఏకం చేస్తుంది
      '50':
        title: ప్రేమ దేవుడు ఎన్నుకున్నవారిని పరిపూర్ణులను చేస్తుంది
      '51':
        title: మన పాపాలను, తప్పులను ఒప్పుకుందాం
      '52':
        title: దేవునికి స్తుతియాగం అర్పించండి
      '53':
        title: మోషే ఇశ్రాయేలు కోసం ధైర్యంగా విజ్ఞాపన చేశాడు
      '54':
        title: శాంతియుత నాయకులు మందను గౌరవిస్తారు
      '55':
        title: స్త్రీలు సాహసకార్యాలు చేశారు
      '56':
        title: దారితప్పినవారు లోబడాలని ప్రార్థించండి
      '57':
        title: వినయమే జ్ఞానమని జ్ఞానం ప్రకటిస్తుంది
      '58':
        title: దేవునిపై నమ్మకముంచి ఎల్లప్పుడూ సురక్షితంగా ఉండండి
      '59':
        title: దేవుడు తాను ఎన్నుకున్నవారిని కాపాడాలని ప్రార్థించండి
      '60':
        title: పాపాలను క్షమించి అడుగులను నడిపించు
      '61':
        title: దేవుడు పాలకులను జ్ఞానంతో నడిపిస్తాడు
      '62':
        title: సద్గుణాలతో జీవించడాన్ని విశ్వాసం నేర్పుతుంది
      '63':
        title: వినయం శాంతిని, ఆనందాన్ని తెస్తుంది
      '64':
        title: అందరికీ విశ్వాసాన్ని, సహనాన్ని అనుగ్రహించు
      '65':
        title: శుభవార్తతో ప్రతినిధులను తిరిగి పంపండి
    1 Enoch:
      '1':
        title: దేవుడు నీతిమంతులకు, దుష్టులకు తీర్పుతీరుస్తాడు
      '2':
        title: ఆకాశం, భూమి సాక్ష్యమిస్తున్నాయి
      '3':
        title: పద్నాలుగు చెట్లు శీతకాలాన్ని తట్టుకుంటాయి
      '4':
        title: వేసవి సూర్యుడు క్రమబద్ధమైన శక్తిని సూచిస్తాడు
      '5':
        title: సృష్టి దేవుని పరిపాలనకు నమ్మకంగా ఉంటుంది
      '6':
        title: మానవ స్త్రీల కోసం కావలివారు దిగివస్తారు
      '7':
        title: రాక్షస సంతానం భూమిని నాశనం చేస్తుంది
      '8':
        title: కావలివారు నిషిద్ధ జ్ఞానాన్ని బోధిస్తారు
      '9':
        title: దేవదూతలు భూమిపై అక్రమాన్ని నివేదిస్తారు
      '10':
        title: పతనమైన కావలివారిపై తీర్పు వస్తుంది
      '11':
        title: దేవుడు సమృద్ధియైన ఆశీర్వాదాలను వాగ్దానం చేస్తాడు
      '12':
        title: హనోకు పతనమైన కావలివారిని ఎదిరిస్తాడు
      '13':
        title: కావలివారికి క్షమ లేదని హనోకు చెబుతాడు
      '14':
        title: వెల్లడైన పరలోక మహిమను హనోకు చూస్తాడు
      '15':
        title: కావలివారిపై తీర్పును దేవుడు వివరిస్తాడు
      '16':
        title: దేహరహిత ఆత్మలు భూమిపై సంచరిస్తాయి
      '17':
        title: భయంకరమైన అన్యలోక ప్రాంతాలను హనోకు సందర్శిస్తాడు
      '18':
        title: సృష్టి శక్తుల నిల్వగదులు చూపబడతాయి
      '19':
        title: దేవదూతలు తుది తీర్పును ఎదుర్కొంటారు
      '20':
        title: పవిత్ర కావలి దేవదూతలు, వారి అధికార ప్రాంతాలు
      '21':
        title: అగాధంలో బంధించబడిన ఏడు నక్షత్రాలు
      '22':
        title: ఆత్మల గుహలను హనోకు చూస్తాడు
      '23':
        title: ఆరని అగ్నిని హనోకు చూస్తాడు
      '24':
        title: ఏడు మహిమాన్విత పర్వతాలు మెరుస్తాయి
      '25':
        title: తీర్పు వరకు నిషేధించబడిన సుగంధ వృక్షం
      '26':
        title: పవిత్ర కేంద్రస్థలాన్ని హనోకు చూస్తాడు
      '27':
        title: దైవదూషకుల కోసం శపించబడిన లోయ వెల్లడి
      '28':
        title: ఉప్పొంగే జలాలతో తూర్పు పర్వతాలు
      '29':
        title: తీర్పు వృక్షాలను హనోకు చూస్తాడు
      '30':
        title: తరగని జలాలతో నిండిన లోయ
      '31':
        title: పవిత్ర సువాసనలతో పర్వతాలు వికసిస్తాయి
      '32':
        title: నీతి ఉద్యానవనం వెల్లడి
      '33':
        title: ఆకాశ ద్వారాల్లో నక్షత్రాల పేర్లు
      '34':
        title: ఆకాశ వాతావరణ యంత్రాంగం వెల్లడి
      '35':
        title: పడమటి ద్వారాలు తూర్పు ద్వారాలకు సరిపోలుతాయి
      '36':
        title: ఆకాశ ద్వారాలను హనోకు చూస్తాడు
      '37':
        title: జ్ఞాన ప్రత్యక్షతను హనోకు ప్రకటిస్తాడు
      '38':
        title: నీతిమంతులు సమకూడతారు, పాపులకు తీర్పు జరుగుతుంది
      '39':
        title: ఎన్నుకోబడిన పిల్లలు ఆకాశం నుంచి దిగివస్తారు
      '40':
        title: పరలోక సైన్యాన్ని హనోకు చూస్తాడు
      '41':
        title: ఆకాశ నిధిగదులు, రహస్య నియమాలు
      '42':
        title: జ్ఞానం నివాసాన్ని వెదికినా దొరకదు
      '43':
        title: పరలోక ఉపమానాన్ని హనోకు చూస్తాడు
      '44':
        title: మెరుపు నక్షత్రాలు శక్తిచేత బంధించబడ్డాయి
      '45':
        title: తీర్పుపొందే నిరాకరించేవారి గురించిన రెండవ ఉపమానం
      '46':
        title: మనుష్యకుమారుణ్ణి హనోకు చూస్తాడు
      '47':
        title: నీతిమంతుల రక్తానికి పరలోకంలో జవాబు లభిస్తుంది
      '48':
        title: నీతి ఊట చుట్టుముడుతుంది
      '49':
        title: ఎన్నుకోబడినవాడు దాగివున్నవాటికి తీర్పుతీరుస్తాడు
      '50':
        title: పవిత్రులు గెలుస్తారు, పాపులు త్వరలో నశిస్తారు
      '51':
        title: ఎన్నుకోబడినవాడు రహస్య జ్ఞానాన్ని వెల్లడిస్తాడు
      '52':
        title: లోహ పర్వతాలను హనోకు చూస్తాడు
      '53':
        title: పాపుల అర్పణలతో నిండిన లోయ
      '54':
        title: రాజులు మండుతున్న లోయలో పడవేయబడతారు
      '55':
        title: ప్రాచీనుడు ఇక ఎన్నడూ అలా చేయనని ప్రమాణం చేస్తాడు
      '56':
        title: శిక్ష విధించే దేవదూతలు అజాజేలు సేనను బంధిస్తారు
      '57':
        title: విశ్వమంతా కల్లోలం, పవిత్ర ఆరాధన
      '58':
        title: హనోకు నీతిమంతులను దీవిస్తాడు
      '59':
        title: ఉరుముల రహస్యాలను హనోకు చూస్తాడు
      '60':
        title: అత్యున్నత ఆకాశం కంపిస్తుంది, కరుణ నిలిచి ఉంటుంది
      '61':
        title: దేవదూతలు నీతిమంతుల కోసం కొలమానం చేస్తారు
      '62':
        title: సింహాసనాసీనుడైన మనుష్యకుమారుడు తీర్పుతీరుస్తాడు
      '63':
        title: రాజులు క్షమించమని ప్రభువును వేడుకుంటారు
      '64':
        title: దాగివున్న పాపులను హనోకు చూస్తాడు
      '65':
        title: భూమి కోసం నోవహు విలపిస్తాడు
      '66':
        title: ఆజ్ఞ ప్రకారం దేవదూతలు ప్రళయ జలాలను నిలిపి ఉంచుతారు
      '67':
        title: నోవహు దేవుని వాగ్దానాన్ని వింటాడు
      '68':
        title: హనోకు రహస్య విషయాల వెల్లడి పొందుతాడు
      '69':
        title: పతనమైన దేవదూతల పేర్లు చెప్పబడి, వారికి తీర్పు జరుగుతుంది
      '70':
        title: హనోకు పరలోక న్యాయసభకు తీసుకువెళ్లబడతాడు
      '71':
        title: పరలోక రహస్యాలను హనోకు చూస్తాడు
      '72':
        title: సూర్యుని క్రమబద్ధమైన గమనాన్ని ఊరియేలు వెల్లడిస్తాడు
      '73':
        title: చంద్రుని కళలు ఆజ్ఞ ప్రకారం నడుస్తాయి
      '74':
        title: సూర్యచంద్రుల కచ్చితమైన లయలు
      '75':
        title: విశ్వ నాయకులు తమ నియమిత సేవను కొనసాగిస్తారు
      '76':
        title: భూమిపై వీచే గాలులను హనోకు చూస్తాడు
      '77':
        title: నాలుగు గాలులను హనోకు చూస్తాడు
      '78':
        title: మహా జ్యోతుల పేర్లు వెల్లడి
      '79':
        title: పరలోక నియమాలన్నిటినీ హనోకు వెల్లడిస్తాడు
      '80':
        title: విశ్వవ్యాప్త అస్తవ్యస్తత గురించి ఊరియేలు హెచ్చరిస్తాడు
review:
  verdict: revise
  review_summary: అన్ని కీలు, అధ్యాయాలు, మరియు మెటాడేటా పూర్తిగా ఉన్నాయి. మూలార్థాన్ని మరింత ఖచ్చితంగా ప్రతిబింబించేందుకు కొన్ని శీర్షికలలో స్వల్ప సవరణలు చేశాను.
  issues:
  - 1 Clement 54లో 'peaceful' అర్థాన్ని 'శాంతియుత'గా సరిచేశాను.
