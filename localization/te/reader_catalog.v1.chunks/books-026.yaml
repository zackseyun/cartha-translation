payload:
  book_metadata:
    Letters of Ignatius:
      display_name: ఇగ్నాటియస్ పత్రాలు
      author: సాధారణంగా అంగీకరించబడిన మధ్యస్థ పాఠరూపంలోని ఏడు పత్రాలకు అంతియొకయ బిషప్ ఇగ్నాటియస్ రచయిత; తరువాత విస్తరించబడిన పత్రాలు, ఇగ్నాటియస్ పేరుతో ఇతరులు రాసిన పత్రాలు ఈ సంకలనంలో లేవు.
      audience: ఇగ్నాటియస్ హతసాక్ష్యం వైపు ప్రయాణిస్తున్న సమయంలో సంబోధించిన ఎఫెసు, మగ్నేసియా, త్రల్లేసు, రోము, ఫిలదెల్ఫియా, స్ముర్నలోని క్రైస్తవ సంఘాలు, అలాగే పోలికార్పు.
      date: సాధారణంగా క్రీ.శ. 2వ శతాబ్దపు ఆరంభానికి, తరచుగా సుమారు క్రీ.శ. 105–117కు చెందినవిగా తేదీ నిర్ణయిస్తారు; అయితే ఇగ్నాటియస్ ప్రయాణపు ఖచ్చితమైన కాలక్రమం ఇప్పటికీ చర్చనీయాంశమే.
  chapter_titles:
    Epistle of Barnabas:
      '12':
        title: మోషే చేతులు యేసును సూచిస్తాయి
      '13':
        title: యాకోబు ఆశీర్వాదం తారుమారును ముందే తెలియజేస్తుంది
      '14':
        title: యేసు హృదయాలను దేవుని కోసం విమోచిస్తాడు
      '15':
        title: న్యాయం తర్వాత విశ్రాంతిదిన విశ్రాంతి వస్తుంది
      '16':
        title: నిజమైన ఆలయం విశ్వాసులలోనే ఉంది
      '17':
        title: రక్షణ ఇప్పుడు స్పష్టంగా వివరించబడింది
      '18':
        title: వెలుగు దూతలు, చీకటి పాలకుడు
      '19':
        title: వెలుగు మార్గం అంకితభావాన్ని ఆదేశిస్తుంది
      '20':
        title: చీకటి మార్గం నిత్యనాశనానికి నడిపిస్తుంది
      '21':
        title: మహిమ కోసం ప్రభువు ఆజ్ఞలకు లోబడండి
    Letters of Ignatius:
      '1':
        title: ఇగ్నాటియస్ ఎఫెసు సంఘానికి శుభాకాంక్షలు చెబుతాడు
      '2':
        title: విశ్వాసులు ఖైదీ ఇగ్నాటియస్‌కు తోడ్పడతారు
      '3':
        title: ఐక్యతతో, ప్రార్థనతో బిషప్‌ను గౌరవించండి
      '4':
        title: ఇగ్నాటియస్ వినయంగా మాట్లాడతాడు
      '5':
        title: యేసుపట్ల ప్రేమ ద్వారా ఐక్యత
      '6':
        title: బిషప్ విశ్వాసులను ప్రార్థనలో ఏకం చేస్తాడు
      '7':
        title: మౌనంగా చక్కగా నడిపించే బిషప్‌ను గౌరవించండి
      '8':
        title: అబద్ధ బోధకుల ప్రభావం పట్ల జాగ్రత్తపడండి
      '9':
        title: ఎఫెసీయుల అంకితభావం, ఇగ్నాటియస్
      '10':
        title: దుష్ట బోధను తిరస్కరించి స్థిరంగా నిలవండి
      '11':
        title: ప్రజలందరి కోసం నిరంతరం ప్రార్థించండి
      '12':
        title: అన్ని బంధాలకంటే క్రీస్తే ఉన్నతుడు
      '13':
        title: శిక్ష విధించబడినవాడిగా ఇగ్నాటియస్ రాస్తాడు
      '14':
        title: శాంతి సాతాను శక్తినీ పన్నాగాలనూ భగ్నం చేస్తుంది
      '15':
        title: విశ్వాసం మంచితనానికీ ప్రేమకూ నడిపిస్తుంది
      '16':
        title: మౌనం ద్వారా సత్యాన్ని జీవించడం
      '17':
        title: కుటుంబాలను నాశనం చేసేవారు వారసత్వం పొందరు
      '18':
        title: దేవుని గురించిన జ్ఞానాన్ని వివేకంతో స్వీకరించండి
      '19':
        title: సిలువ కోసం తన్ను తాను ఏమీలేనివాడిగా ఎంచుకోవడం
      '20':
        title: మరియ, నక్షత్రం, క్రీస్తు కూలదోసివేత
      '21':
        title: మళ్లీ రాయాలని ఇగ్నాటియస్ ఆశిస్తాడు
      '22':
        title: పాఠకుల కోసం ఇగ్నాటియస్ ప్రార్థిస్తాడు
      '23':
        title: మగ్నేసియా సంఘం కృపచేత ఆశీర్వదించబడింది
      '24':
        title: ఐక్యత కోసం ఇగ్నాటియస్ ప్రార్థిస్తాడు
      '25':
        title: బిషప్ కోసం ఇగ్నాటియస్ దేవునికి కృతజ్ఞత చెబుతాడు
      '26':
        title: మీ యువ బిషప్‌ను గౌరవించండి
      '27':
        title: నిజమైన క్రైస్తవులుగా జీవించండి
      '28':
        title: విశ్వాసం నిత్యమైన ముద్రను ఎంచుకుంటుంది
      '29':
        title: ఇగ్నాటియస్ సంఘ ఐక్యతను ఆలింగనం చేసుకుంటాడు
      '30':
        title: విశ్వాసులు బిషప్ ఆధ్వర్యంలో సమకూడతారు
      '31':
        title: యేసు కృప ద్వారా బయలుపరచబడ్డాడు
      '32':
        title: లేచిన క్రీస్తులో నిరీక్షణ నిలిచి ఉంటుంది
      '33':
        title: పాత పులిసిన పిండిని తొలగించండి
      '34':
        title: క్రీస్తు పునాదిపై స్థిరంగా నిలవండి
      '35':
        title: వినయం విశ్వాసంలో ఆనందాన్ని తెస్తుంది
      '36':
        title: విశ్వాసంలో బిషప్‌తో ఏకమవండి
      '37':
        title: ప్రార్థనలు సంఘానికి సేదదీర్పు తెస్తాయి
      '38':
        title: దైవిక సామరస్యంతో సంఘాలకు అభివందనాలు తెలపండి
      '39':
        title: యేసు అనుభవించిన శ్రమ ద్వారా శాంతి
      '40':
        title: మనస్సులోనూ సహనంలోనూ నిర్దోషులుగా ఉండండి
      '41':
        title: విశ్వాసులు బిషప్‌కూ క్రీస్తుకూ లోబడతారు
      '42':
        title: నాయకులను యేసు క్రీస్తును గౌరవించినట్లు గౌరవించండి
      '43':
        title: గర్వం కంటే సాత్వికతను కోరుకోండి
      '44':
        title: పరలోక జ్ఞానానికి ఇగ్నాటియస్ భయపడ్డాడు
      '45':
        title: విశ్వాసాన్ని పోషించండి, మతవిరుద్ధ బోధలను కాదు
      '46':
        title: సంఘ నాయకత్వానికి నమ్మకంగా ఉండండి
      '47':
        title: సాత్వికతను ఆయుధంగా ధరించండి
      '48':
        title: క్రీస్తు మాత్రమే నిజమైన జీవాన్ని ఇస్తాడు
      '49':
        title: నిజమైన శ్రమ క్రీస్తు వాస్తవికతను నిరూపిస్తుంది
      '50':
        title: అబద్ధ బోధకుల ప్రాణాంతక ఫలానికి దూరంగా ఉండండి
      '51':
        title: ప్రార్థనలోనూ అంకితభావంలోనూ ఏకమవండి
      '52':
        title: ప్రేమతో బిషప్‌కు లోబడండి
      '53':
        title: రోములోని నమ్మకమైన సంఘానికి శుభాకాంక్షలు
      '54':
        title: నా ప్రయాణ ముగింపు కోసం ప్రార్థించండి
      '55':
        title: మనుషుల ఆమోదాన్ని కాదు, దేవుని ఆమోదాన్ని కోరండి
      '56':
        title: అంతరంగ బలం కోసం ప్రార్థించండి
      '57':
        title: దేవుని కోసం ఇష్టపూర్వకంగా మరణాన్ని ఎదుర్కోండి
      '58':
        title: ఇగ్నాటియస్ శ్రమను స్వాగతిస్తాడు
      '59':
        title: క్రీస్తు కోసం లోకసంబంధ కోరికలను సిలువ వేయండి
      '60':
        title: ఇగ్నాటియస్ లోకసంబంధ కోరికలను తిరస్కరిస్తాడు
      '61':
        title: విశ్వాసపూర్వకంగా శ్రమించాలని ఇగ్నాటియస్ కోరుకుంటాడు
      '62':
        title: కాపరిత్వం పొందుతున్న సిరియా సంఘం కోసం ప్రార్థించండి
      '63':
        title: స్ముర్న నుండి సిరియాకు శుభాకాంక్షలు
      '64':
        title: ఐక్యతకు ఫిలదెల్ఫియా ప్రశంసించబడింది
      '65':
        title: బిషప్ సద్గుణంతో దేవునికి సేవ చేస్తాడు
      '66':
        title: మీ కాపరిని నమ్మకంగా అనుసరించండి
      '67':
        title: హానికరమైన బోధలను తిరస్కరించండి
      '68':
        title: అందరూ కలిసి ఒకే ప్రభుభోజనంలో పాలుపంచుకోండి
      '69':
        title: యేసు క్రీస్తు కోసం వేసిన సంకెళ్లలో ఆనందించండి
      '70':
        title: యూదాయిజాన్ని తిరస్కరించి క్రీస్తును స్వీకరించండి
      '71':
        title: ఆత్మ మరుగైన సత్యాలను బయలుపరుస్తాడు
      '72':
        title: ఐక్యత వర్గవాదాన్ని తిరస్కరిస్తుంది
      '73':
        title: క్రీస్తు అందరినీ దేవునిలో ఏకం చేస్తాడు
      '74':
        title: అంతియొకయ సంఘానికి శాంతి వస్తుంది
      '75':
        title: ఫిలో, రయుస్ విశ్వసనీయంగా గౌరవించబడ్డారు
      '76':
        title: స్ముర్న సంఘం సమృద్ధిగా ఆశీర్వదించబడింది
      '77':
        title: యేసు క్రీస్తు నిజమైన అవతరణ
      '78':
        title: క్రీస్తు శ్రమ నిజంగా వాస్తవమైనది
      '79':
        title: లేచిన యేసు శరీరంతోనే ఉన్నాడు
      '80':
        title: పశ్చాత్తాపపడమని క్రూరమృగాలకు హెచ్చరిక
      '81':
        title: క్రీస్తును నిరాకరించడం పునరుత్థానాన్ని నిరాకరించడమే
      '82':
        title: ప్రభుభోజనం క్రీస్తు మాంసము
      '83':
        title: అబద్ధ బోధకుల బోధలకు దూరంగా ఉండండి
      '84':
        title: క్రీస్తును అనుసరించినట్లు బిషప్‌ను అనుసరించండి
      '85':
        title: మేల్కొని పశ్చాత్తాపపడండి
      '86':
        title: క్రీస్తు సేవకులను స్వాగతించండి
      '87':
        title: అంతియొకయకు శాంతి దూతను పంపండి
      '88':
        title: ఖైదీ ఇగ్నాటియస్‌ను బుర్రుస్ ప్రోత్సహిస్తాడు
      '89':
        title: ఇగ్నాటియస్ విశ్వాసులను పేరుపేరునా పలకరిస్తాడు
