book_localizations:
- source_title: Genesis
  title: ఆదికాండము
  author: రచయిత ఎవరో తెలియదు; సంప్రదాయం ప్రకారం మోషేకు ఆపాదించబడింది. ఆధునిక పరిశోధన ప్రకారం, ఇది సుదీర్ఘ రచనా చరిత్రలో రూపుదిద్దుకొని, వివిధ మూలాలు తరువాత ఒకటిగా సంపాదించబడ్డాయి.
  audience: దేవుని సృష్టి, ఎంపిక, వాగ్దానం అనే పునాదులపై తమ ప్రజల ఆవిర్భావ కథను నిలిపి, నిబంధనలో భాగమైన ప్రజలుగా తమ గుర్తింపును గ్రహించే ఇశ్రాయేలు ప్రజలు.
  date: అనేక శతాబ్దాల కాలంలో రచించబడింది; బబులోను చెర కాలంలో లేదా దాని తరువాత, సుమారు క్రీ.పూ. 6వ–5వ శతాబ్దంలో ప్రస్తుతం అందిన రూపాన్ని పొందింది.
  summary: ఆదికాండము సృష్టి గురించి, మానవుల తిరుగుబాటు మరియు చెదరిపోవడం గురించి, అలాగే ఇశ్రాయేలుకు దేవుడు చేసిన నిబంధన వాగ్దానాలు ఆరంభమైన అబ్రాహాము, ఇస్సాకు, యాకోబు, యోసేపుల కుటుంబం గురించి చెబుతుంది.
- source_title: John
  title: యోహాను సువార్త
  author: రచయిత ఎవరో తెలియదు; సంప్రదాయం దీనిని అపొస్తలుడైన యోహానుకు లేదా “ప్రియ శిష్యునికి” ఆపాదిస్తుంది.
  audience: సమాజమందిర కేంద్రిత యూదమతంతో ఉద్రిక్తతను ఎదుర్కొంటూ, ప్రియ శిష్యుని సాక్ష్యం చుట్టూ ఏర్పడిన క్రైస్తవ సమాజం.
  date: సుమారు క్రీ.శ. 90–110.
  summary: యోహాను సువార్త యేసును తండ్రిని వెల్లడించే నిత్య వాక్యంగా చూపిస్తుంది. ఆయనపై నమ్మకం ఉంచడం ద్వారా జీవాన్ని ఇస్తాడనీ, తన సూచక క్రియలు, మరణం, పునరుత్థానం ద్వారా మహిమపరచబడతాడనీ తెలియజేస్తుంది.
- source_title: Gospel of Thomas
  title: తోమా సువార్త
  author: రచయిత ఎవరో తెలియదు; ఆరంభ వాక్యం ఈ సూక్తుల సంకలనాన్ని “దిదుమోస్ యూదా తోమా”కు ఆపాదిస్తుంది. ఇది సంపూర్ణంగా లభించేది నాగ్ హమ్మాదీ నుండి దొరికిన 4వ శతాబ్దపు కాప్టిక్ అనువాదంలో (NHC II,2) మాత్రమే; ఆక్సిరింకస్ నుండి మూడు గ్రీకు శకలాలు కూడా లభించాయి.
  audience: సిరియా ప్రాంతపు జ్ఞాన సంప్రదాయాలు, ప్రారంభ జ్ఞానవాద ధోరణుల ప్రభావంలో ఉండి, యేసు సూక్తుల ద్వారా గూఢమైన స్వీయజ్ఞానాన్ని అన్వేషించే క్రైస్తవ పాఠకులు.
  date: గ్రీకు మూలరచన బహుశా సుమారు క్రీ.శ. 50–140; కాప్టిక్ ప్రతిలేఖ సుమారు క్రీ.శ. 340.
  summary: తోమా సువార్త యేసుకు ఆపాదించబడిన సూక్తుల సంకలనం. ఇందులో నిరంతర కథనం లేదు; ఈ సూక్తుల అర్థాన్ని కనుగొనమని ఇది పాఠకులను పదేపదే పిలుస్తుంది.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: ఆదికాండము 1:1
  text: దేవుడు ఆకాశాన్నీ భూమినీ సృష్టించడం మొదలుపెట్టినప్పుడు[a]—
  translator_note: '[a] సంప్రదాయ అనువాదం దీనిని సంపూర్ణ వాక్యంగా పరిగణిస్తుంది: “ఆదిలో దేవుడు ఆకాశాన్నీ భూమినీ సృష్టించాడు.” అయితే హీబ్రూ వాక్యనిర్మాణం సహజంగా తరువాతి విషయాన్ని పరిచయం చేస్తుంది; ప్రధాన చర్య అయిన “దేవుడు అన్నాడు” అనేది 3వ వచనంలో వస్తుంది.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: ప్రసంగి 1:2
  text: “ఆవిరులలో ఆవిరి[a],” అని కోహెలెత్[b] అంటున్నాడు. “అంతా ఆవిరే—క్షణికమైనది, పట్టి ఉంచలేనిది, తరచూ మనం ఆశించినట్లు ఉండనిది.”
  translator_note: '[a] హీబ్రూ పదం ‘హెవెల్’కు అక్షరార్థంగా ‘ఊపిరి’ లేదా ‘ఆవిరి’ అని అర్థం. ప్రసంగి గ్రంథమంతటా అది త్వరగా గతించిపోయేదాన్ని, పట్టి ఉంచలేనిదాన్ని లేదా పూర్తిగా అర్థం చేసుకోలేనిదాన్ని, తరచూ మనుషులు ఆశించిన దానికి భిన్నంగా పరిణమించేదాన్ని వర్ణిస్తుంది. ఏదీ అర్థవంతం కాదని చెప్పకుండానే “ఆవిరి” అనే అనువాదం ఆ దృశ్యరూపాన్ని నిలుపుతుంది. ‘ఊపిరి,’ ‘కేవలం ఊపిరి,’ లేదా ‘క్షణభంగురమైనది’ అనే అనువాదాలు కూడా సాధ్యమే. [b] ‘కోహెలెత్’ అనేది రచయిత హీబ్రూ పేరు లేదా బిరుదు. దీనిని తరచూ “బోధకుడు” లేదా “ప్రసంగి” అని అనువదిస్తారు; అయితే ఏ ఒక్క అర్థానికీ ప్రాధాన్యమివ్వకుండా సాధ్యమైన అర్థాలన్నిటికీ చోటివ్వడానికి ఇక్కడ ‘కోహెలెత్’ అనే రూపాన్నే ఉంచాం.'
- source_path: nt/john/001/001.yaml
  reference: యోహాను 1:1
  text: ఆదిలో[b] వాక్యం అప్పటికే ఉనికిలో ఉంది. వాక్యం దేవునితో ఉంది; వాక్యం దేవుడు.[a]
  translator_note: '[a] లేదా, “వాక్యం దైవస్వరూపం కలది”; లేదా, “దేవుడు ఏ స్వరూపం కలవాడో, వాక్యం కూడా అదే స్వరూపం కలది.” ముందటి వాక్యభాగంలో వాక్యాన్ని దేవుని నుండి వేరుగా చూపుతూనే, వాక్యం సంపూర్ణంగా దేవుడని గ్రీకు వాక్యనిర్మాణం ధృవీకరిస్తుంది. [b] ఈ ఆరంభం ఆదికాండము 1:1ను ప్రతిధ్వనింపజేస్తూ, వాక్యాన్ని సృష్టి ఆరంభంతో అనుసంధానిస్తుంది. “ఉంది” లేదా “ఉనికిలో ఉంది” అని కూడా అనువదించవచ్చు; ఇక్కడి గ్రీకు క్రియ ఆది వచ్చినప్పుడు వాక్యం కొత్తగా ఉనికిలోకి రాలేదని, అప్పటికే కొనసాగుతున్న ఉనికిని సూచిస్తుంది.'
- source_path: nt/romans/003/025.yaml
  reference: రోమీయులకు 3:25
  text: ఆయన రక్తంపై విశ్వాసం ద్వారా[b] పాపపరిహార బలిగా[a] దేవుడు ఆయనను అందరి ముందు ఉంచాడు. దేవుడు ఇలా చేసింది తన నీతిని[c] చూపించడానికి; ఎందుకంటే గతంలో చేసిన పాపాలను ఆయన ఉపేక్షించాడు.
  translator_note: '[a] లేదా, “దేవుని ఉగ్రతను తొలగించే బలి”; లేదా, పాత నిబంధనలో పాపపరిహార రక్తం చిలకరించబడిన నిబంధన మందసం బంగారు మూత అయిన “కరుణాపీఠం.” [b] లేదా, “విశ్వాసం ద్వారా, ఆయన రక్తం చేత.” [c] లేదా, “న్యాయం.”'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 పేతురు 1:13
  text: కాబట్టి, కార్యానికి మీ మనసులను సిద్ధం చేసుకోండి.[a] పూర్తిగా స్పష్టమైన బుద్ధితో ఉండండి; యేసు మెస్సీయ బయలుపరచబడినప్పుడు మీకు తీసుకురాబడే కృపపై మీ నిరీక్షణను సంపూర్ణంగా ఉంచండి.[b]
  translator_note: '[a] గ్రీకులో అక్షరార్థంగా, “మీ మనస్సు నడుముకు దట్టీ కట్టుకోండి” అని ఉంది. కార్యానికి సిద్ధపడేందుకు పొడవాటి వస్త్రాన్ని నడుము చుట్టూ పైకి చేర్చి కట్టుకునే దృశ్యాన్ని ఇది చూపిస్తుంది. ఆ అక్షరార్థ దృశ్యం మానసిక సిద్ధతను, కార్యానికి సంసిద్ధతను సూచిస్తుంది. [b] “పూర్తిగా,” “సంపూర్ణంగా” అని అనువదించిన గ్రీకు పదం స్పష్టమైన బుద్ధితో ఉండటానికి వర్తించవచ్చు, నిరీక్షణ ఉంచటానికి వర్తించవచ్చు, లేదా రెండింటికీ వర్తించే అవకాశం ఉంది.'
