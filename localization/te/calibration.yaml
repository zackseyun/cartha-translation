review:
  verdict: revise
  summary: వాక్యార్థం, కాలసూచనలు, మరియు UI పదాలు మొత్తంగా బాగున్నాయి. యోహాను 1:1లో “దేవుడై ఉంది” అనేది మార్పు/అవతరణ భావాన్ని కలిగించగలదు కాబట్టి “దేవుడు”గా సరిచేయబడింది. రోమీయులకు 3:25లో “శిక్షించకుండా” అనే అదనపు నిర్దిష్టతను తొలగించి మూలంలోని “passed over” భావాన్ని నిలిపాం; మరికొన్ని చోట్ల సహజత్వం కోసం స్వల్ప మెరుగులు చేశాం.
  issues:
  - యోహాను 1:1లో “వాక్యం దేవుడై ఉంది” కంటే “వాక్యం దేవుడు” మూల గ్రీకు వాక్యార్థానికి మరింత ఖచ్చితమైనది; “అయింది” అనే భావాన్ని నివారిస్తుంది.
  - రోమీయులకు 3:25లో “పాపాలను శిక్షించకుండా వదిలివేశాడు” అనేది మూలంలోని “passed over” కంటే నిర్దిష్టమైన వివరణ. “ఉపేక్షించాడు” ఆ భావాన్ని అనవసర విస్తరణ లేకుండా ఇస్తుంది.
  - ఆదికాండము ప్రేక్షకుల వివరణలో నిబంధన-గుర్తింపు భావాన్ని మరింత సహజంగా పలికేలా స్వల్ప సవరణ చేశాం.
