review:
  verdict: revise
  summary: An gyara wasu kalmomi na nahawu da salo, an kawar da ƙarin bayani da bai cikin tushen a Romawa 3:25, kuma an daidaita ma’anar wasu bayanan ƙasa da rubutun SPOB da tushen da aka bayar.
  issues:
  - Yohanna 1:1 ya yi amfani da “Kalman” maimakon siffar da ta dace, “Kalmar.”
  - Romawa 3:25 ya ƙara “ba tare da hukunta su nan take ba,” wanda ba ya cikin rubutun tushen.
  - Wasu fannonin bayanin littattafai da na SPOB sun bukaci gyaran salo domin Hausa ta fi zama mai sauƙi daidai da tushen.
