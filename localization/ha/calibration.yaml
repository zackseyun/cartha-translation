book_localizations:
- source_title: Genesis
  title: Farawa
  author: Ba a san marubucin ba; bisa ga al’ada ana danganta littafin ga Musa. Masana na zamani suna ganin cewa yana da dogon tarihin rubuce-rubuce, inda aka haɗa tushe dabam-dabam sannan aka gyara su daga baya.
  audience: Isra’ila a matsayin al’ummar alkawari, domin a kafa labarin asalinsu a kan halittar Allah, zaɓensa, da alkawarinsa.
  date: An tsara shi a tsawon ƙarnuka; ya kai ga sigarsa da aka karɓa wajen ƙarni na 6 zuwa na 5 kafin haihuwar Almasihu, a lokacin zaman bauta a Babila ko bayansa.
  summary: Farawa ya ba da labarin halitta, tawayen ’yan Adam da warwatsewarsu, da kuma iyalin Ibrahim, Ishaku, Yakubu, da Yusufu, waɗanda ta wurinsu alkawuran Allah ga Isra’ila suka fara.
- source_title: John
  title: Yohanna
  author: Ba a san marubucin ba; bisa ga al’ada ana danganta littafin ga manzo Yohanna ko kuma “Almajirin da Yesu yake ƙauna.”
  audience: Wata al’ummar Kirista da take cikin saɓani da Yahudancin majami’a, wadda aka kafa bisa shaidar Almajirin da Yesu yake ƙauna.
  date: Wajen shekara ta 90–110 bayan haihuwar Almasihu.
  summary: Yohanna ya gabatar da Yesu a matsayin Kalma madawwamiya wadda take bayyana Uba, take ba da rai ta wurin dogara gare shi, kuma ake ɗaukaka ta ta wurin alamominta, mutuwarta, da tashinta daga matattu.
- source_title: Gospel of Thomas
  title: Bisharar Toma
  author: Ba a san marubucin ba; farkon rubutun ya danganta tarin maganganun ga “Didymos Yahuda Toma.” Cikakken rubutun da ya tsira yana nan ne kawai a fassarar Koptic ta ƙarni na 4 da aka samo a Nag Hammadi (NHC II,2), tare da gutsattsarin rubutun Helenanci guda uku daga Oxyrhynchus.
  audience: Masu karatu Kirista da hikimar Suriya da tunanin Gnostik na farko suka yi tasiri a kansu, waɗanda suke karkata ga ilimin kai na asiri a cikin maganganun Yesu.
  date: Mai yiwuwa asalin rubutun Helenanci ya kasance wajen shekara ta 50–140 bayan haihuwar Almasihu; rubutun Koptic kuma wajen shekara ta 340 bayan haihuwar Almasihu.
  summary: Bisharar Toma tarin maganganun da aka danganta ga Yesu ne. Ba ta da labari mai gudana, kuma sau da yawa tana kira ga masu karatu su gano ma’anar maganganun.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Farawa 1:1
  text: Sa’ad da Allah ya fara halittar sammai da ƙasa[a]—
  translator_note: '[a] Fassarar gargajiya tana ɗaukar wannan a matsayin cikakkiyar jimla: “A cikin farko Allah ya halicci sammai da ƙasa.” Amma tsarin Ibranancin ya fi dacewa a fahimce shi a matsayin gabatarwar abin da zai biyo baya, inda babban aikin, “Allah ya ce,” yake a aya ta 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Mai-Wa’azi 1:2
  text: “Tururi ne, tururi ne[a],” in ji Qoheleth[b]. “Komai tururi ne—mai wucewa da sauri, wanda ba za a iya riƙewa ba, kuma sau da yawa ya bambanta da yadda muke tsammani.”
  translator_note: '[a] Kalmar Ibrananci hevel a zahiri tana nufin numfashi ko tururi. A ko’ina cikin Mai-Wa’azi tana bayyana abin da yake wucewa da sauri, wanda ba za a iya riƙewa ko fahimtarsa sosai ba, kuma sau da yawa yake faruwa dabam da abin da mutane suke tsammani. “Tururi” yana riƙe wannan hoton ba tare da cewa babu wani abu mai ma’ana ba. Wasu hanyoyin fassara sun haɗa da “numfashi,” “numfashi kawai,” ko “mai wucewa.” [b] Qoheleth sunan Ibrananci ko laƙabin marubucin ne. Sau da yawa ana fassara shi da “Malami” ko “Mai-Wa’azi,” amma mun bar “Qoheleth” domin a bar duk yiwuwar ma’anoninsa ba tare da fifita fassara guda ba.'
- source_path: nt/john/001/001.yaml
  reference: Yohanna 1:1
  text: Tun farko[b], Kalmar ta riga ta kasance. Kalmar tana tare da Allah, Kalmar kuma Allah ce.[a]
  translator_note: '[a] Ko kuma, “Kalmar tana da halin allahntaka,” ko “abin da Allah yake, Kalmar shi ne.” Tsarin Helenancin yana tabbatar da cewa Kalmar cikakkiyar Allah ce, amma yana bambanta Kalmar da Allah da aka ambata a ɓangaren jimlar da ya gabata. [b] Wannan farkon yana maimaita sautin Farawa 1:1, yana kuma haɗa Kalmar da farkon halitta. Kalmar Helenancin tana nuna cewa Kalmar ta wanzu sa’ad da farkon ya zo, ba cewa a lokacin ne ta fara kasancewa ba; ana kuma iya fassarawa “ta kasance” ko “ta wanzu.”'
- source_path: nt/romans/003/025.yaml
  reference: Romawa 3:25
  text: Allah ya gabatar da shi a matsayin hadayar kafara[a] ta wurin bangaskiya ga jininsa[b]. Ya yi haka domin ya nuna adalcinsa[c], saboda ya ƙyale zunuban da aka aikata a dā.
  translator_note: '[a] Ko “hadayar sulhunta fushi”; ko kuma “murfin jinƙai,” wato murfin zinariya na Akwatin Alkawari inda ake yayyafa jinin kafara a Tsohon Alkawari. [b] Ko “ta wurin bangaskiya, ta jininsa.” [c] Ko “adalcin shari’a.”'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Bitrus 1:13
  text: Saboda haka, ku shirya tunaninku domin yin aiki.[a] Ku kasance da cikakkiyar natsuwa, ku kuma sa dukan begenku ga alherin da ake kawo muku sa’ad da aka bayyana Yesu Almasihu.[b]
  translator_note: '[a] Helenancin a zahiri yana cewa, “ku ɗaure ƙugun tunaninku.” Wannan yana zana hoton tattara doguwar riga a ɗaure a kugu domin mutum ya kasance a shirye ya yi aiki. [b] Kalmar Helenanci da aka fassara “cikakkiyar” da “dukan” tana iya shafar kasancewa cikin natsuwa, ko sa bege, ko kuma mai yiwuwa duka biyun.'
