  Genesis:
    display_name: Farawa
    author: Ba a san marubucin ba; bisa al’ada ana danganta littafin ga Musa. Masana na zamani suna ganin cewa an rubuta shi a tsawon lokaci mai tsawo, daga tushe dabam-dabam waɗanda daga baya aka haɗa aka gyara.
    audience: Isra’ila a matsayinta na al’ummar alkawari, domin a kafa labarin asalinta bisa halittar Allah, zaɓensa, da alkawarinsa.
    date: An rubuta shi a tsawon ƙarnuka; ya kai sigar da aka karɓa wajen ƙarni na 6–5 kafin haihuwar Almasihu, a lokacin ko bayan zaman bauta a Babila.
    summary: Farawa ya ba da labarin halitta, tawayen ’yan Adam da warwatsewarsu, da iyalin Ibrahim, Ishaku, Yakubu, da Yusufu, waɗanda ta wurinsu alkawuran Allah ga Isra’ila suka fara.
