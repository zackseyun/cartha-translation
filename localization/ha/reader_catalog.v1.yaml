  Book of Thomas the Contender:
    display_name: Littafin Toma Mai Kokawa
    author: Ba a san marubucin ba. Sunan da ke ƙarshen aikin ya danganta shi da Yahuda Toma kuma ya ambaci Mathaias a matsayin marubucin abin da aka faɗa, amma waɗannan dangantawa ce ta adabi, ba iƙirarin marubuta da za a iya tabbatarwa ba.
    audience: Kiristoci masu karkata ga kame kai, waɗanda aka ƙarfafa su su nemi sanin kansu, su yi tsayayya da sha'awoyin jiki, su kuma fahimci koyarwar sirri da Yesu ya yi wa Toma.
    date: Sau da yawa ana danganta shi da ƙarshen ƙarni na 2 ko farkon ƙarni na 3 bayan haihuwar Almasihu, mai yiwuwa a yanayin Kiristanci na Siriya; an adana shi a cikin rubutun Kofitik na ƙarni na 4.
