  Gospel of Thomas:
    display_name: Bisharar Toma
    author: Ba a san marubucin ba; farkon rubutun ya jingina tarin maganganun ga "Didymos Yahuza Toma." Cikakken rubutun da ya tsira yana cikin fassarar Koptik ta ƙarni na 4 daga Nag Hammadi (NHC II,2) ne kaɗai, tare da gutsattsarin rubutun Helenanci guda uku daga Oxyrhynchus.
    audience: Masu karatu Kirista waɗanda hikimar Siriya da tunanin Gnostik na farko suka rinjaya, masu karkata ga neman ɓoyayyen sanin kai a cikin maganganun Yesu.
    date: Asalin rubutun Helenanci mai yiwuwa kusan 50–140 Miladiyya ne; rubutun Koptik kusan 340 Miladiyya.
    summary: Bisharar Toma tarin maganganun da aka jingina wa Yesu ne. Ba ta da labari mai gudana, kuma tana yawan kira ga masu karatu su gano ma'anar maganganun.
