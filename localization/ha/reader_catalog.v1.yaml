  Treatise on the Resurrection:
    display_name: Muƙala a kan Tashin Matattu
    author: Ba a san marubucin ba. An tsara aikin a matsayin wasiƙar wani malami zuwa ga ɗalibi mai suna Rheginos; ba za a iya tabbatar da ko wanene malamin ko Rheginos ba.
    audience: Kiristoci masu neman koyarwa game da tashin matattu, musamman masu nazarin ko tashin na jiki ne, ko na ruhaniya ne, da kuma yadda ake shiga rayuwar tashin matattu tun yanzu.
    date: Galibi ana sanya shi a ƙarshen ƙarni na 2 bayan haihuwar Almasihu (sau da yawa wajen 170–200); an adana shi a cikin kwafin Kofitik na ƙarni na 4 daga wani aikin Helenanci na farko.
