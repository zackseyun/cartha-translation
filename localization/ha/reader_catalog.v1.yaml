    author: Ba a san marubucin ba. Gajeriyar wasiƙar buɗewa da wahayin da ya biyo baya an jingina su ga Bitrus da Filibus ta amfani da sunayensu, maimakon a tabbatar cewa ɗaya daga cikin manzannin ne ya rubuta su.
    audience: Kiristoci masu neman amincewar manzanni ga koyarwa game da Mai Ceto, iko masu gaba, shan wahala, aikin wa'azi, da maido da almajirai.
    date: Galibi ana sanya shi a ƙarshen ƙarni na 2 ko farkon ƙarni na 3 Miladiyya; an adana shi a cikin kwafin Nag Hammadi na ƙarni na 4 da kuma wata shaidar Kofitik ta baya.
