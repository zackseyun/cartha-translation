    author: Ba a san marubucin ba. Taken ya jingina labarin ga Yahuda, amma aikin bai tabbatar da cewa Yahuda Iskariyoti ne marubucinsa na tarihi ba.
    audience: Wata ƙungiyar Kiristoci da ta soki ayyukan hadaya da tsarin ikkilisiya na abokan hamayyarta, tana amfani da tattaunawar wahayi da tsarin sararin samaniya irin na Setiyawa domin sake fassara Yahuda da mutuwar Yesu.
    date: Yawanci ana sanya shi a tsakiyar ko ƙarshen ƙarni na 2 Miladiyya; Irenaeus ya san wata Bisharar Yahuda wajen shekara ta 180, kuma wataƙila kwafin Kofitik da ya wanzu na ƙarni na 3 ko na 4 ne.
