  Dialogue of the Savior:
    display_name: Tattaunawar Mai Ceto
    author: Ba a san marubucin ba. Tattaunawar ta sa koyarwar wahayi a bakin Yesu a hirarsa da Yahuda, Matiyu, da Maryamu, amma ba ta bayyana wanda ya tattara ta ba.
    audience: Wata ƙungiyar Kiristoci ta farko mai sha'awar wahayi na sirri, zama almajiri, sanin kai, addu'a, da shirye-shiryen kame kai domin samun ceto.
    date: Galibi ana danganta shi da ƙarni na 2 bayan haihuwar Almasihu, ko da yake har yanzu ana saɓani game da matakan da aka bi wajen tsara shi da takamaiman kwanan watansa; an adana shi a cikin rubutun Kofitik na ƙarni na 4.
