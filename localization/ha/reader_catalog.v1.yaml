    display_name: Littafin Sirri na Yohanna
    author: Ba a san marubucin ba. Aikin ya gabatar da kansa da sunan wani dabam, yana cewa wahayi ne daga Yesu wanda ya tashi daga matattu zuwa ga Yohanna ɗan Zabadi, kuma ya tsira a cikin fiye da sigar tsohon rubutu guda ɗaya.
