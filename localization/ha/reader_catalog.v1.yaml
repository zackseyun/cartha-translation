  Gospel of Mary:
    display_name: Bisharar Maryamu
    author: Ba a san marubucin ba. Aikin ya gabatar da Maryamu a matsayin wadda ta karɓi wahayin Yesu kuma ta fassara shi, amma bai yi iƙirarin cewa Maryamu ce ta rubuta bisharar da ta tsira ba.
    audience: Kiristoci na farko da suke kokawa da batutuwan wahayi, hawa ta ruhaniya, ikon manzanni, da halaccin koyarwar Maryamu a cikin almajiran Yesu.
    date: Galibi ana danganta shi da ƙarni na 2 bayan haihuwar Almasihu; gutsattsarin rubutun Helenanci daga ƙarni na 3 sun tsira, kuma babban shaidar rubutun Kofitik tana cikin Kundin Berlin 8502 na ƙarni na 5.
