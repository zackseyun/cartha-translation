review:
  verdict: revise
  review_summary: An duba kuma an gyara fassarar Hausa gaba ɗaya. An inganta wasu kalmomi domin su fi bin ma’anar tushen Ingilishi kai tsaye, musamman game da masu gudun hijira, da ayukan Elihu da Ayuba.
  issues:
  - 'Ezra 2: An gyara kalmar da ke nufin ‘exiles’ zuwa ‘masu gudun hijira’.'
  - 'Job 24: An cire ƙarin fassarar da ta ce mugaye ne suke jawo wahala; tushen ya ce Ayuba ya bayyana wahalar mugaye.'
  - 'Job 32: An fayyace cewa Elihu ya yi magana gāba da Ayuba.'
