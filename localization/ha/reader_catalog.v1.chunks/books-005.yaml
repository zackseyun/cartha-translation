    Ezra:
      display_name: Ezra
      author: Ba a san marubucin ba; mai yiwuwa hannu ɗaya ne da na Tarihi.
      audience: Waɗanda suka dawo daga zaman bauta suna sāke gina Urushalima a ƙarƙashin mulkin Farisa.
      date: Kimanin tsakiyar ƙarni na 5 zuwa ƙarni na 4 K.Z.
    Nehemiah:
      display_name: Nehemiya
      author: Ba a san marubucin ba; littafin ya ƙunshi tarihin da aka rubuta da salon mutum na farko, wanda ake dangantawa da Nehemiya.
      audience: Waɗanda suka dawo daga zaman bauta suna sāke gina garun Urushalima da sabunta alkawari a ƙarƙashin mulkin Farisa.
      date: Kimanin tsakiyar ƙarni na 5 zuwa ƙarni na 4 K.Z.
    Esther:
      display_name: Esta
      author: Ba a san marubucin ba.
      audience: Yahudawan da ke zaune a warwatse a ƙarƙashin mulkin baƙi, musamman a Farisa.
      date: Kimanin ƙarshen zamanin Farisa ko farkon zamanin Helenawa (ƙarni na 4–3 K.Z.).
    Job:
      display_name: Ayuba
      author: Ba a san marubucin ba.
      audience: Isra’ilawa masu kokawa da batun wahalar marar laifi da adalcin Allah.
      date: Ra’ayin da aka fi yarda da shi a nazarin adabin hikima ya sanya littafin kusan ƙarni na 6–4 K.Z., yana kuma amfani da tsofaffin labaran gargajiya.
    Psalms:
      display_name: Zabura
      author: Marubuta da yawa ne suka rubuta a tsawon ƙarnuka; rubutun saman zabura ya ambaci Dawuda, Asaf, Korah, Sulemanu, Musa, da sauransu.
      audience: Isra’ila da taron masu ibada a haikali—da kuma kowace al’ummar da ta biyo baya mai addu’a da makoki.
      date: An tsara su kusan ƙarni na 10–3 K.Z.; an kammala tattara su bayan zaman bauta.
