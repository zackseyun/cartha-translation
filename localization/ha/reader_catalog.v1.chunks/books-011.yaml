    Luke:
      display_name: Luka
      author: Ba a san marubucin ba; al'ada ta danganta littafin ga Luka, abokin tafiyar Bulus.
      audience: Masu karatu Kiristoci masu ilimi na Girka da Roma, waɗanda aka yi wa “Tiyofilus” jawabi.
      date: Kusan 80–90 Miladiyya.
    John:
      display_name: Yohanna
      author: Ba a san marubucin ba; al'ada ta danganta littafin ga manzo Yohanna ko kuma “Almajirin Ƙaunatacce.”
      audience: Wata al'ummar Kiristoci da take cikin saɓani da Yahudancin majami'a, wadda aka kafa a kan shaidar Almajirin Ƙaunatacce.
      date: Kusan 90–110 Miladiyya.
      summary: Yohanna ya gabatar da Yesu a matsayin Kalma madawwamiya wadda take bayyana Uba, tana ba da rai ta wurin dogara gare shi, kuma ake ɗaukaka shi ta wurin alamominsa, mutuwarsa, da tashinsa daga matattu.
    Acts:
      display_name: Ayyukan Manzanni
      author: Ba a san marubucin ba; marubuci ɗaya ne da na Luka.
      audience: Masu karatu Kiristoci na Girka da Roma; shi ne juzu'i na biyu na aikin da aka yi wa Tiyofilus jawabi.
      date: Kusan 80–90 Miladiyya.
    Romans:
      display_name: Romawa
      author: Bulus, tare da magatakardansa Tertiyus.
      audience: Kiristoci a Roma—masu bi Yahudawa da na al'ummai waɗanda suke cikin saɓani game da Attaura da asalinsu.
      date: Kusan 56–58 Miladiyya, an rubuta shi daga Koranti.
