review:
  verdict: revise
  review_summary: An gyara jimlolin da ba su cika ma’ana ba, kalmomin da suka ƙara bayani ko suka karkatar da ma’anar tushen Turanci, da wasu zaɓuɓɓukan nahawu. An adana dukkan maɓallai da filaye.
  issues:
  - An gyara Mark 10, wanda ya bar ma’anar “kingdom” a rataye.
  - An gyara John 1 da taƙaitaccen bayanin Yohanna domin daidaiton nahawu da ma’anar “the eternal Word.”
  - An gyara Acts 2, 4, da 17 domin su ba da ma’anar canonical ba tare da salon da bai dace ba.
  - An cire ƙarin “da aminci” a Mark 15 kuma an daidaita wasu take-taken da suka faɗaɗa ko suka sauya ma’ana.
  - An gyara Romans 4 domin a fassara “by faith alone” ba tare da faɗin da zai iya zama takamaiman koyarwar ƙungiya ba.
