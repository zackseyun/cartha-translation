    Gospel of Philip:
      display_name: Bisharar Filibus
      author: Ba a san marubucin ba. Sunan littafin ya bayyana a bayanin rufewar rubutun hannu, amma littafin bai ce Filibus ne marubucinsa ba. Kwafi guda kaɗai da ya tsira shi ne rubutun Koptik na Kundin Nag Hammadi II,3.
      audience: Wata al'ummar Kiristoci ta farko da ta san koyarwar ibada irin ta mabiyan Valentinos, musamman game da baftisma, shafewa da mai, Jibin Ubangiji, fansa, tashin matattu, da kuma hoton ɗakin amarya.
      date: Galibi ana danganta shi da ƙarshen ƙarni na 2 ko farkon ƙarni na 3 bayan haihuwar Almasihu; an adana shi a cikin wani rubutun hannu na Koptik na ƙarni na 4, wanda aka fassara daga wani tsohon rubutun Helenanci.
