payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Hakikanin Masu Mulkin Sararin Samaniya
      author: Ba a san marubucin ba. Marubucin ya fassara Farawa ta hanyar wani labarin asiri da aka bayyana game da masu mulkin sararin samaniya; ba za a iya danganta aikin da tabbas ga wani malami mai suna ba.
      audience: Kiristoci a cikin al'ummar Setiyawa ko wata al'umma mai alaƙa da su, waɗanda suka karanta Farawa a matsayin rikici tsakanin jahilan masu mulkin sararin samaniya, hikimar Allah, da asalin ruhaniya na ɗan Adam.
      date: Galibi ana sanya shi a ƙarni na 3 Miladiyya; an adana shi a cikin kwafin Kofitik na ƙarni na 4 a Kundin Nag Hammadi na II.
    On the Origin of the World:
      display_name: Game da Asalin Duniya
      author: Ba a san marubucin ba. Aikin ya haɗa ya kuma sake fasalta al'adun Yahudawa, Kiristoci, falsafar Filato, da tatsuniyoyi iri-iri, ba tare da ambaton sunan wanda ya tattara shi ba.
      audience: Masu karatu a yanayin Kiristanci mai ra'ayoyin Gnostik waɗanda suke neman wani labarin dabam na halitta, masu mulkin sararin samaniya, Sofia, Adamu da Hauwa'u, da makomar duniya ta ƙarshe.
      date: Yawanci ana sanya shi a ƙarni na 3 Miladiyya, ko da yake wataƙila an gina shi bisa tsofaffin bayanai; an adana shi musamman a shaidun Kofitik na ƙarni na 4.
    Sophia of Jesus Christ:
      display_name: Hikimar Yesu Almasihu
      author: Ba a san marubucin ba. Marubucin ya daidaita bayanan da ake kuma samu a Eugnostos ya mai da su tattaunawa tsakanin Yesu da almajiransa bayan tashinsa daga matattu.
      audience: Kiristoci masu sha'awar hikimar da aka bayyana game da Allah Maɗaukaki, tsarin duniyar sama, da asali da ceton rai.
      date: Sau da yawa ana sanya shi a ƙarshen ƙarni na 2 ko a ƙarni na 3 Miladiyya; an adana shi a cikin kwafe na Kofitik daga Nag Hammadi da Kundin Berlin.
    Gospel of the Egyptians:
      display_name: Bisharar Masarawa
      author: Ba a san marubucin ba. Wannan aiki na Nag Hammadi, wanda kuma ake kira Littafi Mai Tsarki na Babban Ruhu Marar Ganuwa, ya bambanta da tsohuwar Bisharar Masarawa ta Helenanci wadda aka sani ta hanyar abubuwan da aka nakalto kawai.
      audience: Wata al'ummar Kiristoci ta Setiyawa da ta yi amfani da sarƙaƙƙiyar tatsuniya, sunaye masu tsarki, hoton baftisma, da yabon waƙoƙi domin bayyana asalin ruhaniyarta da samun 'yanci.
      date: Yawanci ana sanya shi a ƙarni na 2 ko na 3 Miladiyya; kwafe biyu na Kofitik sun wanzu a cikin kundin Nag Hammadi na ƙarni na 4.
    Letter of Peter to Philip:
      display_name: Wasiƙar Bitrus zuwa Filibus
      author: Ba a san marubucin ba. Gajeriyar wasiƙar buɗewa da wahayin da ya biyo baya an jingina su ga Bitrus da Filibus ta amfani da sunayensu, maimakon a tabbatar cewa ɗaya daga cikin manzannin ne ya rubuta su.
      audience: Kiristoci masu neman amincewar manzanni ga koyarwa game da Mai Ceto, iko masu gaba, shan wahala, aikin wa'azi, da maido da almajirai.
      date: Galibi ana sanya shi a ƙarshen ƙarni na 2 ko farkon ƙarni na 3 Miladiyya; an adana shi a cikin kwafin Nag Hammadi na ƙarni na 4 da kuma wata shaidar Kofitik ta baya.
    Gospel of Judas:
      display_name: Bisharar Yahuda
      author: Ba a san marubucin ba. Taken ya jingina labarin ga Yahuda, amma aikin bai tabbatar da cewa Yahuda Iskariyoti ne marubucinsa na tarihi ba.
      audience: Wata ƙungiyar Kiristoci da ta soki ayyukan hadaya da tsarin ikkilisiya na abokan hamayyarta, tana amfani da tattaunawar wahayi da tsarin sararin samaniya irin na Setiyawa domin sake fassara Yahuda da mutuwar Yesu.
      date: Yawanci ana sanya shi a tsakiyar ko ƙarshen ƙarni na 2 Miladiyya; Irenaeus ya san wata Bisharar Yahuda wajen shekara ta 180, kuma wataƙila kwafin Kofitik da ya wanzu na ƙarni na 3 ko na 4 ne.
    Protoevangelium of James:
      display_name: Bisharar Farko ta Yakubu
      author: Ba a san marubucin ba. Mai ba da labarin ya yi da'awar cewa shi ne Yakubu, amma an rubuta aikin ta amfani da sunan wani, kuma ba Yakubu ɗan'uwan Yesu ne ya rubuta shi ba.
      audience: Kiristoci masu sha'awar haihuwar Maryamu da tarbiyyarta, tsarkinta na dindindin, haihuwar Yesu, da amsoshin labari ga tambayoyin da Matiyu da Luka suka bari a buɗe.
      date: Gaba ɗaya ana sanya shi a rabin ƙarshe na ƙarni na 2 Miladiyya; ya wanzu a cikin rubuce-rubucen hannu na Helenanci masu yawa na baya da kuma tsofaffin fassarori.
