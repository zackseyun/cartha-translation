review:
  verdict: revise
  review_summary: An gyara fassarori masu karkacewa daga ma’anar tushen Ingilishi, musamman a kan tashin hankali, adalci, da wasu taken Waƙar Sulemanu. An kuma kiyaye tsarin katalogi da dukkan maɓallan.
  issues:
  - An gyara Zabura 140 daga “tashin hankali” zuwa “tashin hankali da zalunci” domin ya dace da “violence.”
  - An gyara Karin Magana 11 daga “gaskiya” zuwa “miƙaƙƙen hali” domin “uprightness.”
  - An daidaita wasu taken Waƙar Sulemanu domin su nuna yabo/kauna mai aminci maimakon ƙarin ma’ana.
