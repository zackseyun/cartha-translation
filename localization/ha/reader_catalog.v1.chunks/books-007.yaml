  book_metadata:
    Proverbs:
      display_name: Karin Magana
      author: Tarin rubuce-rubuce ne; kanun rubutun sun ambaci Sulemanu, Agur, Lemuwel, da “masu hikima.”
      audience: Matasan Isra’ilawa da ake tarbiyyantarwa cikin hikima domin rayuwar yau da kullum.
      date: Matakan tsara rubutun, kusan ƙarni na 10–4 kafin haihuwar Almasihu.
    Ecclesiastes:
      display_name: Mai Wa’azi
      author: Ba a san marubucin ba; mai magana shi ne “Qohelet,” wanda bisa al’ada ake ɗauka Sulemanu ne.
      audience: Isra’ilawa da suke fuskantar iyakokin hikima, dukiya, da ƙoƙari a ƙarƙashin rana.
      date: Mai yiwuwa kusan ƙarni na 5–3 kafin haihuwar Almasihu, bisa ga Ibranancin da Arameyanci ya yi wa tasiri.
    Song of Solomon:
      display_name: Waƙar Sulemanu
      author: Ba a san marubucin ba; kanun rubutun ya ambaci Sulemanu.
      audience: Isra’ila tana karanta soyayyar jima’i a matsayin mahangar fahimtar kusancin alkawari—daga baya kuma, masu karatu Yahudawa da Kiristoci suna karanta ta a alamance.
      date: Mai yiwuwa bayan zaman bauta, kusan ƙarni na 5–3 kafin haihuwar Almasihu.
