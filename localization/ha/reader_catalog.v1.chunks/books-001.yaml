review:
  verdict: revise
  review_summary: An gyara wasu lakabin surori domin su dace da ma’anar Turancin asali, musamman jam’i, kariya, wucewa ta mutuwa, da kuma kauce wa ƙarin bayanin da ba ya cikin lakabin asali.
  issues:
  - Farawa 26 ya rasa ma’anar ‘protected’; an maido ta.
  - Fitowa 8 ya canja ‘plagues’ zuwa annoba guda; an gyara zuwa jam’i.
  - Fitowa 12 ya sauya ‘passes through death’ zuwa ‘escapes death’; an gyara.
  - An gyara wasu lakabi masu ƙara bayani ko masu raunin daidaituwa da asali, ciki har da Farawa 29 da Fitowa 7, 21, 22, 35.
  - An gyara jam’in hadayu a Littafin Firistoci 1–2.
