  book_metadata:
    Genesis:
      display_name: Farawa
      author: Ba a san marubucin ba; bisa al’ada ana danganta littafin ga Musa. Masana na zamani suna ganin cewa an rubuta shi a tsawon lokaci mai tsawo, daga tushe dabam-dabam waɗanda daga baya aka haɗa aka gyara.
      audience: Isra’ila a matsayinta na al’ummar alkawari, domin a kafa labarin asalinta bisa halittar Allah, zaɓensa, da alkawarinsa.
      date: An rubuta shi a tsawon ƙarnuka; ya kai sigar da aka karɓa wajen ƙarni na 6–5 kafin haihuwar Almasihu, a lokacin ko bayan zaman bauta a Babila.
      summary: Farawa ya ba da labarin halitta, tawayen ’yan Adam da warwatsewarsu, da iyalin Ibrahim, Ishaku, Yakubu, da Yusufu, waɗanda ta wurinsu alkawuran Allah ga Isra’ila suka fara.
    Exodus:
      display_name: Fitowa
      author: Ba a san marubucin ba; bisa al’ada ana danganta littafin ga Musa. Masana na zamani suna ganin cewa an rubuta shi a tsawon lokaci mai tsawo, daga tushe dabam-dabam waɗanda daga baya aka haɗa aka gyara.
      audience: Isra’ila a matsayinta na al’ummar da aka ’yantar aka kuma yi wa alkawari, tana koyon ma’anar zama al’ummar UBANGIJI ƙarƙashin dokarsa.
      date: An rubuta shi a tsawon ƙarnuka; ya kai sigar da aka karɓa wajen ƙarni na 6–5 kafin haihuwar Almasihu.
    Leviticus:
      display_name: Littafin Firistoci
      author: Ba a san marubucin ba; bisa al’ada ana danganta littafin ga Musa. Masana na zamani suna sanya shi cikin tushen rubuce-rubucen firistoci.
      audience: Firistocin Isra’ila da jama’ar masu ibada — umarnai game da hadayu, tsarki, da tsara rayuwa bisa kasancewar Allah a tsakaninsu.
      date: Yana da matakan rubutu tun daga ƙarshen zamanin sarakuna har zuwa bayan zaman bauta (wajen ƙarni na 7–5 kafin haihuwar Almasihu).
