    Letters of Ignatius:
      display_name: Wasiƙun Ignatius
      author: Ignatius, bishop na Antakiya, ne ya rubuta wasiƙu bakwai na sigar matsakaici da aka fi amincewa da ita; faɗaɗaɗɗun wasiƙu na baya da kuma wasiƙun Ignatius da aka rubuta da sunansa ba sa cikin wannan tarin.
      audience: Ikilisiyoyin Kirista a Afisa, Magnesiya, Tralles, Roma, Filadelfiya, da Simirna, tare da Polycarp, waɗanda aka yi wa jawabi a lokacin tafiyar Ignatius zuwa shahada.
      date: Yawanci ana sanya lokacin rubuta su a farkon ƙarni na 2 bayan haihuwar Almasihu, galibi wajen 105–117, ko da yake har yanzu ana muhawara game da ainihin jerin lokutan tafiyar Ignatius.
