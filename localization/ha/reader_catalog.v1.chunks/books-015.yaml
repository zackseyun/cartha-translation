  book_metadata:
    1 Esdras:
      display_name: 1 Esdras
      author: Ba a san marubucin ba; wani sabon tsarin rubutu ne na Helenanci da ya sake jera 2 Tarihi 35–36, Ezra, da Nehemiya 7–8.
      audience: Yahudawan zamanin Helenawa da suke son labari mai tsari game da komowa da maido da al'amura.
      date: Kusan ƙarni na 2–1 kafin haihuwar Almasihu.
    Prayer of Manasseh:
      display_name: Addu'ar Manassa
      author: Ba a san marubucin ba; an danganta shi da Sarki Manassa da sunansa.
      audience: Masu tuba da suke danganta kansu da tuban Manassa—ana amfani da shi a ibada a wasu al'adu.
      date: Kusan ƙarni na 2–1 kafin haihuwar Almasihu.
    Psalm 151:
      display_name: Zabura ta 151
      author: Ba a san marubucin ba; an danganta ta ga Dawuda da sunansa. An tabbatar da samuwar wani nau'inta na Ibrananci a cikin 11QPsa.
      audience: Al'ummomin Yahudawa mazauna ƙasashen waje da na Kumran waɗanda suka duƙufa ga littafin zabura na Dawuda.
      date: Kusan ƙarni na 2 kafin haihuwar Almasihu ko kafin haka.
    3 Maccabees:
      display_name: 3 Makabiyawa
      author: Ba a san marubucin ba; an rubuta shi da Helenanci.
      audience: Yahudawan Masar mazauna ƙasashen waje masu magana da Helenanci—labarin kuɓuta ne da aka saita a zamanin Tolomi na Huɗu.
      date: Kusan ƙarni na 1 kafin haihuwar Almasihu zuwa ƙarni na 1 bayan haihuwar Almasihu.
    4 Maccabees:
      display_name: 4 Makabiyawa
      author: Ba a san marubucin ba; wani marubuci Bayahude mai magana da Helenanci ne wanda falsafar Stoikawa ta rinjaya.
      audience: Yahudawan zamanin Helenawa—wa'azi ne na falsafa game da yadda hankali yake rinjayar sha'awa ta wurin aminci.
      date: Kusan ƙarni na 1 bayan haihuwar Almasihu.
    Bel and the Dragon:
      display_name: Bel da Macijin
      author: Ba a san marubucin ba; yana ɗaya daga cikin Ƙarin Rubuce-rubucen Helenanci na Daniyel.
      audience: Yahudawa masu magana da Helenanci—rubutu ne na suka da ba'a ga bautar gumaka.
      date: Kusan ƙarni na 2–1 kafin haihuwar Almasihu.
    Letter of Jeremiah:
      display_name: Wasiƙar Irmiya
      author: Ba a san marubucin ba; an danganta ta ga Irmiya da sunansa.
      audience: Yahudawa mazauna ƙasashen waje da bautar gumakan al'ummomin da ke kewaye da su take jarabta.
      date: Kusan ƙarni na 4–2 kafin haihuwar Almasihu.
    Prayer of Azariah and Song of the Three:
      display_name: Addu'ar Azariya da Waƙar Mutanen Uku
      author: Ba a san marubucin ba; yana ɗaya daga cikin Ƙarin Rubuce-rubucen Helenanci na Daniyel.
      audience: Yahudawa masu magana da Helenanci—kayan ibada ne da ya shafi Daniyel 3.
      date: Kusan ƙarni na 2 kafin haihuwar Almasihu.
    Susanna:
      display_name: Susanna
      author: Ba a san marubucin ba; yana ɗaya daga cikin Ƙarin Rubuce-rubucen Helenanci na Daniyel.
      audience: Yahudawa masu magana da Helenanci—labari ne game da adalci da fallasa shaidar ƙarya.
      date: Kusan ƙarni na 2–1 kafin haihuwar Almasihu.
    1 Clement:
      display_name: 1 Kilementi
      author: Ba a san marubucin ba, amma ana danganta shi ga Kilementi na Roma.
      audience: Taron Kiristoci na Koranti, wanda rikicin shugabanci ya dabaibaye.
      date: Kusan shekara ta 96 bayan haihuwar Almasihu.
