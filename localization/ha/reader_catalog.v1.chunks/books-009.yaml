      display_name: Makoki
      author: Ba a san marubucin ba; al’ada ta danganta littafin ga Irmiya.
      audience: Mutanen Yahudiya da suke jimamin halakar Urushalima a shekara ta 586 kafin zamaninmu.
      date: Jim kaɗan bayan shekara ta 586 kafin zamaninmu.
    Ezekiel:
      display_name: Ezekiyel
      author: Ezekiyel, wani firist da aka kai zaman bauta a Babila; an kuma ci gaba da shirya rubutun.
      audience: Mutanen Yahudiya da aka kai zaman bauta a Babila, waɗanda suke sake fahimtar kasancewar Allah ba tare da haikali ba.
      date: Kusan shekarun 593–571 kafin zamaninmu ne lokacin hidimar annabin; rubutun ya sami sigarsa ta ƙarshe daga baya kaɗan.
    Daniel:
      display_name: Daniyel
      author: Ba a san marubucin ba; littafin ya gabatar da kansa a matsayin Daniyel na zaman bauta.
      audience: Yahudawa da ake tsananta wa a zamanin Helenawa—musamman a ƙarƙashin Antiyokus na Huɗu Epifanes (167–164 kafin zamaninmu).
      date: Ya kai sigar da aka gada wajen shekara ta 165 kafin zamaninmu; surori na 1–6 sun ƙunshi tsofaffin labaran fada.
