review:
  verdict: revise
  review_summary: An gyara sunan Issachar da wasu bayanai/taken babi da suka ƙara ko suka sauya ma’anar tushen Turanci. Sauran fassarar ta cika kuma tana bin tushen yadda ya dace.
  issues:
  - An gyara Testament of Issachar daga “Wasiyyar Issaka” zuwa “Wasiyyar Issakar”, domin Issaka yana nufin Isaac ba Issachar ba.
  - An gyara bayanin Thunder, Perfect Mind domin “divine female figure” ba halittar Allah ba ce.
  - An gyara ƴan taken babi da suka ƙara ma’ana ko suka karkatar da ma’anar tushen, musamman Judah 11 da 24.
