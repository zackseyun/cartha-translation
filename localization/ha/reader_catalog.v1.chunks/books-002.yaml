  book_metadata:
    Numbers:
      display_name: Littafin Ƙidaya
      author: Ba a san marubucin ba; bisa ga al’ada ana danganta littafin ga Musa.
      audience: Isra’ilawa a kan hanyarsu daga Masar zuwa ƙasar alkawari—wato tsarar da ta yi zaman jeji—da kuma masu karatu na baya da suke koyo daga kurakuransu.
      date: An tsara littafin a matakai daban-daban daga ƙarshen zamanin sarauta har zuwa bayan zaman bauta (kimanin ƙarni na 7–5 kafin haihuwar Almasihu).
    Deuteronomy:
      display_name: Maimaitawar Shari’a
      author: Ba a san marubucin ba; an gabatar da littafin a matsayin jawaban bankwana na Musa. Masana na zamani suna ganin cewa ainihin sashinsa ya samo asali ne daga gyaran addini da aka yi a ƙarshen ƙarni na 7 kafin haihuwar Almasihu a zamanin Yosiya.
      audience: Isra’ilawa da suke shirin shiga ƙasar—da kuma waɗanda suka yi zaman bauta daga baya, suna tambayar yadda za su rayu cikin aminci ba tare da haikali ko sarki ba.
      date: Ainihin sashe, kimanin ƙarshen ƙarni na 7 kafin haihuwar Almasihu; ya kai ga tsarinsa na ƙarshe a lokacin zaman bauta.
    Joshua:
      display_name: Yoshuwa
      author: Ba a san marubucin ba; littafin yana cikin jerin tarihin da aka tsara bisa tunanin Maimaitawar Shari’a.
      audience: Isra’ilawa a zamanin sarauta da zaman bauta, suna yin tunani a kan cin ƙasa, alkawari, da ma’anar ƙasar.
      date: An tattara shi kimanin ƙarni na 7–6 kafin haihuwar Almasihu daga tsofaffin al’adun da aka gada.
