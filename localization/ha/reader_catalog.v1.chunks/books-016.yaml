review:
  verdict: revise
  review_summary: An gyara fassarorin da suka karkace daga ma’anar asali, musamman lokacin shekara, batun hukunci, siffar sama, da wasu ayyukan da aka bar ba a bayyana su ba. An kiyaye dukkan maɓallai da cikakken kundin.
  issues:
  - 1 Enoch 4 ya ce bazara maimakon lokacin zafi (summer).
  - Wasu lakabi sun ƙara ko sun sauya ma’ana, ciki har da 1 Clement 48, 1 Enoch 44, 55, 57, 60, 61, 62, 70, da 75.
  - An inganta wasu jimloli domin su bayyana aiki ko dangantaka da ke cikin asalin Turanci ba tare da ƙara wani bayani ba.
