  book_metadata:
    1 Enoch:
      display_name: 1 Enok
      author: Ba a san marubucin ba; an jingina rubutun ga Enok, kakan zamanin kafin ambaliya, ta amfani da sunansa. Aiki ne da aka haɗa daga sassa dabam-dabam da dama.
      audience: Al'ummomin Yahudawa masu nazarin wahayi game da muguntar sararin halitta, hukunci, da kalanda; daga baya an karanta shi a cikin al'ummomin Kirista na farko.
      date: An tattara sassan kusan daga ƙarni na 3 kafin haihuwar Almasihu zuwa ƙarni na 1 bayan haihuwar Almasihu; a harshen Ge'ez (Habasha) kaɗai aka adana shi cikakke.
