review:
  verdict: revise
  review_summary: An gyara wasu take-taken babi domin su bi ma’anar tushen Turanci daidai, musamman 1 Yohanna 5, Ru’uyar Yohanna 10, Tobit 9, da Tobit 12. Sauran fassarar ta cika kuma tana kiyaye bayanan ilimi ba tare da nuna bangaranci ba.
  issues:
  - '1 John 5: an maye gurbin take da ya ce mai ba da gaskiya yana da rai madawwami da take mai bayyana a yi imani cewa Yesu yana da rai madawwami, kamar yadda tushen ya ce.'
  - 'Revelation 10: an gyara ‘Lokaci Ya Ƙare’ zuwa ma’anar lokacin ƙarshe.'
  - 'Tobit 9: an gyara tsarin mai bayarwa da wanda aka ba kuɗin don ya dace da tushen.'
  - 'Tobit 12: an gyara jumlar da ba ta da kyau game da ainihin mutumcin Rafayel.'
