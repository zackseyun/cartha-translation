payload:
  book_metadata:
    James:
      display_name: Yakub
      author: A al’adance, Yakub ɗan’uwan Yesu ne; masana na zamani sun rabu tsakanin ra’ayin cewa shi ne ya rubuta ta da kuma cewa an rubuta ta da sunansa.
      audience: Ikilisiyoyin Yahudawa Kiristoci da ke warwatse a ƙasashe dabam-dabam.
      date: Kimanin shekarun 50–60 bayan haihuwar Almasihu idan shi ne ya rubuta ta; ko kuma ƙarshen ƙarni na 1 bayan haihuwar Almasihu idan an rubuta ta da sunansa.
    1 Peter:
      display_name: 1 Bitrus
      author: A al’adance, manzo Bitrus ne, Silwanus kuma marubucinsa; wasu masana suna ganin an rubuta ta da sunan Bitrus.
      audience: Kiristoci a yankin Asiya Ƙarama na Romawa waɗanda suke fuskantar ƙiyayya daga al’umma.
      date: Kimanin shekarun 60 bayan haihuwar Almasihu idan Bitrus ne ya rubuta ta; ko shekarun 70–90 bayan haihuwar Almasihu idan an rubuta ta da sunansa.
    2 Peter:
      display_name: 2 Bitrus
      author: A al’adance, Bitrus ne; masana na zamani da yawa suna ganin an rubuta ta da sunansa.
      audience: Kiristoci da suke fuskantar masu ba’a waɗanda suke musun dawowar Almasihu.
      date: Kimanin farkon ƙarni na 2 bayan haihuwar Almasihu.
    1 John:
      display_name: 1 Yohanna
      author: Ba a san marubucin ba; a al’adance ana ɗauka manzo Yohanna ne ko kuma dattijon ƙungiyar Yohanna.
      audience: Al’ummar Kiristoci ta Yohanna bayan rarrabuwar kai, tana bayyana waɗanda suke cikinta.
      date: Kimanin shekarun 90–110 bayan haihuwar Almasihu.
    2 John:
      display_name: 2 Yohanna
      author: “Dattijon.”
      audience: Wata takamaiman ikilisiyar Kirista (“zaɓaɓɓiyar baiwar”) da aka gargaɗa game da malaman ƙarya.
      date: Kimanin shekarun 90–110 bayan haihuwar Almasihu.
    3 John:
      display_name: 3 Yohanna
      author: “Dattijon.”
      audience: Gayus, wani shugaba da yake karɓar masu wa’azi masu tafiya a gidansa.
      date: Kimanin shekarun 90–110 bayan haihuwar Almasihu.
    Jude:
      display_name: Yahuda
      author: A al’adance, Yahuda ɗan’uwan Yakub da Yesu ne.
      audience: Al’ummomin Kirista da malaman da ke koyar da rayuwar rashin kamun kai suke kutsawa cikinsu.
      date: Kimanin shekarun 60–90 bayan haihuwar Almasihu.
    Revelation:
      display_name: Ru’uyar Yohanna
      author: Yohanna na Patmos (salon rubutunsa ya bambanta da na Linjila ta huɗu).
      audience: Ikilisiyoyin Kirista bakwai a yankin Asiya Ƙarama na Romawa da suke ƙarƙashin matsin mulkin daular.
      date: Kimanin shekarun 90 bayan haihuwar Almasihu; a al’adance, a zamanin mulkin Domitian.
    Tobit:
      display_name: Tobit
      author: Ba a san marubucin ba.
      audience: Yahudawan da ke warwatse a ƙasashe dabam-dabam, suna neman hanyar yin rayuwa ta ibada da aure da kuma dogara ga tanadin Allah a ƙarƙashin mulkin baƙi.
      date: Kimanin 225–175 kafin haihuwar Almasihu; an rubuta shi da Arameyanci, kuma an tabbatar da kasancewar wani sigar Ibrananci a Qumran.
    Judith:
      display_name: Yudit
      author: Ba a san marubucin ba.
      audience: Yahudawa da suke fuskantar barazanar baƙi — labari mai ƙarfin hali game da tsayin daka cikin ibada.
      date: Kimanin 150–100 kafin haihuwar Almasihu.
    Greek Additions to Esther:
      display_name: Ƙarin Bayanan Helenanci ga Esta
      author: Ba a san marubucin ba; ƙarin bayanai ne da aka saka cikin fassarar littafin Esta ta Helenanci.
      audience: Yahudawa masu jin Helenanci da suke son labarin Esta wanda ya ƙunshi addu’a da ambaton Allah a fili.
      date: Kimanin ƙarni na 2–1 kafin haihuwar Almasihu.
    Wisdom of Solomon:
      display_name: Hikimar Sulemanu
      author: Ba a san marubucin ba; an jingina shi ga Sulemanu ta hanyar amfani da sunansa. Wani marubucin Bayahude na al’adun Helenawa ne ya rubuta shi da Helenanci, mai yiwuwa a Iskandariya.
      audience: Yahudawa masu al’adun Helenawa da suke hulɗa da falsafar Helenawa, suna kare hikimar Isra’ila daga ra’ayoyin arna da na masu ridda.
      date: Kimanin 50 kafin haihuwar Almasihu zuwa 50 bayan haihuwar Almasihu.
