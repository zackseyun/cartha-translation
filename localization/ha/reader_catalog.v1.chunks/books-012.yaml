  book_metadata:
    1 Corinthians:
      display_name: 1 Korintiyawa
      author: Bulus, tare da Sostenes.
      audience: Taron Kiristoci na Koranti da ke fama da rarrabuwar kai.
      date: Kimanin 53–55 Miladiyya, an rubuta daga Afisa.
    2 Corinthians:
      display_name: 2 Korintiyawa
      author: Bulus, tare da Timoti.
      audience: Taron Kiristoci na Koranti, bayan wani rikici mai raɗaɗi.
      date: Kimanin 55–56 Miladiyya.
    Galatians:
      display_name: Galatiyawa
      author: Bulus.
      audience: Taron Kiristoci a Galatiya (tsakiyar Anatoliya) da ake matsa musu su karɓi kaciya da kiyaye Attaura.
      date: Kimanin 48–55 Miladiyya (ana muhawara a kai).
    Ephesians:
      display_name: Afisawa
      author: Bulus, ko kuma wani almajirinsa na kusa da ya rubuta da sunan Bulus (ana muhawara a kai).
      audience: Kiristoci na Asiya gaba ɗaya; sunan wurin nan “Afisa” ba ya cikin rubuce-rubucen hannu mafi daɗewa.
      date: Kimanin shekarun 60 na Miladiyya idan Bulus ne ya rubuta; kimanin shekarun 80–90 na Miladiyya idan wani ne ya rubuta da sunansa.
    Philippians:
      display_name: Filibiyawa
      author: Bulus, tare da Timoti.
      audience: Taron Kiristoci a Filibi, wani birnin mulkin Roma a Makidoniya.
      date: Kimanin 60–62 Miladiyya, an rubuta daga kurkuku.
    Colossians:
      display_name: Kolosiyawa
      author: Bulus, tare da Timoti — ko kuma wani almajirinsa na kusa da ya rubuta da sunan Bulus (ana muhawara a kai).
      audience: Kiristoci a Kolosi da ke kwarin Likus, waɗanda ke fuskantar koyarwar da ta gauraya addinai da ra’ayoyi dabam-dabam.
      date: Kimanin 60–62 Miladiyya idan Bulus ne ya rubuta; daga baya idan wani ne ya rubuta da sunansa.
    1 Thessalonians:
      display_name: 1 Tasalonikawa
      author: Bulus, tare da Silbanus da Timoti.
      audience: Sabon taron Kiristoci a Tasalonika da ke fuskantar tsanantawa.
      date: Kimanin 50–51 Miladiyya — wataƙila ita ce wasiƙar Bulus mafi daɗewa da ta rage.
    2 Thessalonians:
      display_name: 2 Tasalonikawa
      author: Bulus (ana muhawara a kai; wasu masana suna ganin wani ne ya rubuta da sunansa).
      audience: Taron Kiristoci na Tasalonika, domin magance ruɗani game da al’amuran ƙarshen zamani.
      date: Kimanin 51 Miladiyya idan Bulus ne ya rubuta.
    1 Timothy:
      display_name: 1 Timoti
      author: Bulus, ko kuma wani almajiri da ya rubuta da sunan Bulus (masana da yawa suna ganin wani ne ya rubuta Wasiƙun Makiyaya da sunansa).
      audience: Timoti a matsayin wakilin Bulus a Afisa; jagora game da tsarin ikkilisiya na zamanin baya.
      date: Kimanin tsakiyar shekarun 60 na Miladiyya idan Bulus ne ya rubuta; kimanin 90–110 Miladiyya idan wani ne ya rubuta da sunansa.
    2 Timothy:
      display_name: 2 Timoti
      author: Bulus, ko kuma wani almajiri da ya rubuta da sunan Bulus.
      audience: Timoti — an tsara ta a matsayin wasiƙar bankwana ta Bulus daga kurkuku.
      date: Kimanin tsakiyar shekarun 60 na Miladiyya idan Bulus ne ya rubuta; kimanin 90–110 Miladiyya idan wani ne ya rubuta da sunansa.
    Titus:
      display_name: Titus
      author: Bulus, ko kuma wani almajiri da ya rubuta da sunan Bulus.
      audience: Titus a matsayin wakilin Bulus a Karita.
      date: Kimanin tsakiyar shekarun 60 na Miladiyya idan Bulus ne ya rubuta; kimanin 90–110 Miladiyya idan wani ne ya rubuta da sunansa.
    Philemon:
      display_name: Filemon
      author: Bulus, tare da Timoti.
      audience: Filemon, Kirista mai mallakar bawa, game da Onesimus, bawansa da ya gudu.
      date: Kimanin 60–62 Miladiyya.
    Hebrews:
      display_name: Ibraniyawa
      author: Ba a san marubucin ba. Bisa ga al’ada, an ambaci Bulus, Afollos, Barnaba, Biriskila, da wasu; amma babu ra’ayin da kowa ya amince da shi.
      audience: Kiristoci Yahudawa masu jin Helenanci waɗanda suke fuskantar jarabar janyewa daga furucin bangaskiyarsu ta Kirista.
      date: Kimanin 60–95 Miladiyya.
