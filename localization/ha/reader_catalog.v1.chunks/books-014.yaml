payload:
  book_metadata:
    Sirach:
      display_name: Sirak
      author: Yeshua ɗan Ele'azar ɗan Sira na Urushalima; jikansa ne ya fassara shi zuwa Helenanci.
      audience: Samari Yahudawa da ake horarwa cikin hikima a Urushalima a zamanin Helenawa.
      date: Asalin rubutun Ibrananci kusan 195–175 K.Z.; fassarar Helenanci kusan 132 K.Z.
    Baruch:
      display_name: Baruk
      author: Ba a san marubucin ba; an danganta littafin da Baruk, magatakardan Irmiya, ta hanyar amfani da sunansa.
      audience: Yahudawan da suke zaune a warwatse, suna tunani a kan zaman bauta, tuba, da hikima.
      date: Kusan ƙarni na 2 K.Z.
    1 Maccabees:
      display_name: 1 Makabawa
      author: Ba a san marubucin ba; mai yiwuwa marubuci ne daga Urushalima wanda ya rubuta da Ibrananci (fassarar Helenanci kaɗai ce ta wanzu).
      audience: Yahudawa a lokacin tawayen Hasmoniyawa da bayansa; littafin yana ba da labarin halaccin daular Hasmoniyawa.
      date: Kusan 100 K.Z.
    2 Maccabees:
      display_name: 2 Makabawa
      author: Wani marubuci da ba a san shi ba wanda ya taƙaita wani dogon aiki na Yason na Kurane; an rubuta shi da Helenanci.
      audience: Yahudawan da suke zaune a warwatse masu magana da Helenanci—yana nanata shahada, tanadin Allah, da tashin matattu.
      date: Kusan 124 K.Z. ko jim kaɗan bayan haka.
