payload:
  book_metadata:
    Joel:
      display_name: Yowel
      author: Yowel ɗan Fetuwel.
      audience: Yahuda bayan zaman bauta, sa’ad da take amsa annobar fara a matsayin alamar Ranar UBANGIJI.
      date: Mai yiwuwa wajen ƙarni na 5–4 kafin haihuwar Almasihu.
    Amos:
      display_name: Amos
      author: Amos mutumin Tekowa, makiyayi daga Yahuda wanda ya yi wa’azi a arewa.
      audience: Isra’ila ta Arewa a zamanin wadata da rashin adalci a ƙarƙashin Yerobowam na Biyu.
      date: Wajen 760–750 kafin haihuwar Almasihu.
    Obadiah:
      display_name: Obadiya
      author: Obadiya.
      audience: Yahuda bayan Edom ta ci amanar Urushalima — annabci ne game da fāɗuwar Edom.
      date: Jim kaɗan bayan 586 kafin haihuwar Almasihu.
    Jonah:
      display_name: Yunana
      author: Ba a san marubucin ba; babban jigon labarin shi ne Yunana ɗan Amittai.
      audience: Isra’ila bayan zaman bauta — tsawatawa ce ta salon ba’a kan ƙin cuɗanya da sauran ƙabilu, tare da tabbatar da jinƙan Allah ga waɗanda ba Isra’ilawa ba.
      date: Mai yiwuwa wajen ƙarni na 5–4 kafin haihuwar Almasihu.
    Micah:
      display_name: Mika
      author: Mika mutumin Moreshet.
      audience: Yahuda a ƙarshen ƙarni na 8 kafin haihuwar Almasihu, musamman matalautan karkara a gaban manyan birane.
      date: Wajen 740–700 kafin haihuwar Almasihu.
    Nahum:
      display_name: Nahum
      author: Nahum mutumin Elkosh.
      audience: Yahuda tana murna da fāɗuwar Nineba da ke gabatowa.
      date: Jim kaɗan kafin 612 kafin haihuwar Almasihu.
    Habakkuk:
      display_name: Habakkuk
      author: Habakkuk.
      audience: Yahuda tana fuskantar tasowar Babila — tattaunawar wani annabi da Allah game da adalci.
      date: Wajen ƙarshen ƙarni na 7 kafin haihuwar Almasihu.
    Zephaniah:
      display_name: Zafaniya
      author: Zafaniya ɗan Kushi.
      audience: Yahuda a zamanin Yosiya, gab da gyare-gyarensa.
      date: Wajen 640–609 kafin haihuwar Almasihu.
    Haggai:
      display_name: Haggai
      author: Haggai.
      audience: Waɗanda suka dawo daga bauta suna sake gina haikali a ƙarƙashin mulkin Dariyus.
      date: 520 kafin haihuwar Almasihu.
    Zechariah:
      display_name: Zakariya
      author: Zakariya ɗan Berekiya; mai yiwuwa wani marubuci na baya ne ya rubuta surori 9–14.
      audience: Waɗanda suka dawo daga bauta suna sake gina haikali, da kuma al’ummomin zamanin bayan bauta na gaba.
      date: Surori 1–8 wajen 520–518 kafin haihuwar Almasihu; 9–14 wataƙila wajen ƙarni ɗaya bayan haka.
    Malachi:
      display_name: Malaki
      author: Ba a san marubucin ba; “Malaki” yana nufin “manzona.”
      audience: Yahuda bayan zaman bauta, wadda ta fara sakaci da ibada da aminci a ƙarƙashin mulkin Farisa.
      date: Wajen tsakiyar ƙarni na 5 kafin haihuwar Almasihu.
    Matthew:
      display_name: Matiyu
      author: Ba a san marubucin ba; al’ada ta danganta littafin ga manzo Matiyu. Masana na zamani suna ganin wani Kirista Bayahude mai jin Helenanci ne ya rubuta shi, yana amfani da Markus da wata majiya mai kama da Q.
      audience: Wata al’ummar Kiristoci Yahudawa da take kokawa da batun ci gaba da kuma sabani a dangantakarta da addinin Yahudawa na majami’a.
      date: Wajen 80–90 bayan haihuwar Almasihu.
    Mark:
      display_name: Markus
      author: Ba a san marubucin ba; al’ada ta danganta littafin ga Yohanna Markus, abokin tafiyar Bitrus.
      audience: Wata al’ummar Kiristoci masu jin Helenanci, mai yiwuwa a Roma, wadda take ƙarƙashin barazanar tsanantawa ko kuma kusa da ita.
      date: Wajen 65–75 bayan haihuwar Almasihu, a kusan lokacin Yaƙin Yahudawa da rushewar haikali.
