review:
  verdict: revise
  review_summary: An gyara wasu kuskuren ma’ana da suka shafi masu aikatawa, cikakkun bayanai, da kalmomin da ba su dace ba; an kiyaye dukkan maɓallai da tsarin chunk ɗin.
  issues:
  - An gyara Protoevangelium 16 domin Yusufu ne ya saki Maryamu bayan gwaji.
  - An gyara Infancy Gospel of Thomas 12 domin asalin bai ce Yesu ne ya shuka irin ba.
  - An gyara Acts of Paul and Thecla 11 domin muryar sama ce ta ceci mayafin Tekla.
  - An gyara Gospel of Peter 9 domin asalin ya ambaci muryar sama da asuba kawai, ba cewa ta yi magana ba.
  - 'An gyara Epistle of Barnabas 8: heifer saniya mace ce, ba karsana ba.'
