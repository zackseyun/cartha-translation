  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Linjilar Yarintar Toma
      author: Ba a san marubucin ba. Sigar farko da za a iya gano asalinta ba ta ambaci marubuci ba; danganta ta da Toma ya samo asali ne daga sunayen da aka ba ta daga baya a cikin rubuce-rubucen hannu da kuma yadda aka yaɗa ta.
      audience: Kiristoci masu sha’awar yarintar Yesu da yadda za a ba da labarin ikon Allah, horo, koyo, da balagarsa kafin labaran Linjilolin da aka amince da su su fara.
      date: Galibi ana danganta asalinta da ƙarni na 2 bayan haihuwar Almasihu, amma an adana rubutun a sigogin Helenanci da dama da suka bambanta sosai, da kuma a fassarorin farko.
    Acts of Paul and Thecla:
      display_name: Ayyukan Bulus da Tekla
      author: Ba a san marubucin ba. Wani sashe ne daga babban littafin Ayyukan Bulus; wani tsohon rahoto da ya ce wani dattijon coci ne ya rubuta Ayyukan ba zai iya tabbatar da ainihin marubucin ba.
      audience: Kiristoci masu sha’awar labaran wa’azin manzanni, zaman ba aure, baftisma, jimiri irin na shahidai, da ikon mace na koyarwa da ba da shaida.
      date: An rubuta shi a ƙarni na 2 bayan haihuwar Almasihu, wataƙila a rabin ƙarshen ƙarnin; an yaɗa shi a cikin Ayyukan Bulus da kuma a matsayin littafi mai zaman kansa.
    Gospel of Peter:
      display_name: Linjilar Bitrus
      author: Ba a san marubucin ba. Labarin da ya rage yana magana da muryar Bitrus, kuma an yaɗa shi da sunansa, amma ba a ɗauke shi a matsayin aikin Bitrus, manzon da ya rayu a tarihi, ba.
      audience: Kiristoci na farko masu sha’awar faɗaɗa labarin wahala da tashin Yesu daga matattu, wataƙila a cikin al’ummomin da ikon Bitrus yake da muhimmanci na musamman.
      date: Galibi ana sanya lokacin rubuta shi a ƙarni na 2 bayan haihuwar Almasihu; babban gutsuren Helenanci da ya rage ya fito ne daga wani rubutun hannu na zamanin da ya fi baya sosai, wanda aka gano a Akhmim.
    2 Clement:
      display_name: Klementi na Biyu
      author: Ba a san marubucin ba. Duk da sunan da aka saba ba shi, wannan wa’azin Kirista ne na farko, ba wasiƙa ta biyu da Klementi na Roma ya rubuta ba.
      audience: Taron Kiristoci da ake ƙarfafa su su tuba, su daidaita ɗabi’arsu da bangaskiyarsu, su kula da marasa ƙarfi, kuma su jimre da aminci cikin begen tashin matattu da shari’a.
      date: Galibi ana sanya lokacin rubuta shi a rabin farko ko tsakiyar ƙarni na 2 bayan haihuwar Almasihu (kimanin 100–160); ba a tabbatar da wurin da aka rubuta shi ba.
    Epistle of Barnabas:
      display_name: Wasiƙar Barnaba
      author: Ba a san marubucin ba. A al’adance an danganta littafin da Barnaba abokin Bulus, amma masana na zamani ba su amince da wannan dangantawa ba.
      audience: Kiristoci daga al’ummai waɗanda ake koya wa su ɗauki Nassosin Isra’ila a matsayin nasu ta hanyar fassara su game da Almasihu da kuma a matsayin misalai masu ma’ana, tare da bambanta asalin alkawarinsu da ayyukan addinin Yahudawa.
      date: Galibi ana sanya lokacin rubuta shi tsakanin rushewar haikalin Urushalima a shekara ta 70 bayan haihuwar Almasihu da farkon ƙarni na 2, sau da yawa kimanin 80–130.
