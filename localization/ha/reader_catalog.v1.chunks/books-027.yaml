  book_metadata:
    Polycarp to the Philippians:
      display_name: Polikarp zuwa ga Filibiyawa
      author: Polikarp, bishop na Smirna. Wasu masana suna ganin rubutun da aka gada ya haɗa da abubuwan da aka aika a lokuta fiye da ɗaya.
      audience: Taron Kiristoci da ke Filibi, wanda ya nemi wasiƙun Ignatius kuma ya sami shawarwari game da bangaskiya, ɗabi'a, shugabanci, kuɗi, da jimrewa.
      date: Farkon zuwa tsakiyar ƙarni na 2 bayan haihuwar Almasihu; aƙalla wani ɓangarensa yana da alaƙa ta kusa da tafiyar Ignatius, yayin da ra'ayin cewa wasiƙar ta ƙunshi sassa da aka rubuta a lokuta dabam-dabam ya ba da yiwuwar wani sashe ya ɗan fi wannan makara.
    Martyrdom of Polycarp:
      display_name: Shahadar Polikarp
      author: Wasu daga cikin membobin cocin Smirna da ba a san sunayensu ba ne suka rubuta cikin sunan al'ummarsu; bayanan da ke ƙarshen rubutun game da yadda aka isar da shi sun nuna kwafewa da yaɗa shi a zamanai na baya.
      audience: Cocin da ke Filomeliyum da kuma sauran al'ummar Kiristoci, domin ba su labarin kama Polikarp, shari'arsa, mutuwarsa, da juriyarsa abin koyi.
      date: An rubuta shi bayan mutuwar Polikarp, kuma galibi ana sanya shi a tsakiyar ko ƙarshen ƙarni na 2 bayan haihuwar Almasihu; ana muhawara game da ainihin shekarar shahadar da kuma fasalin ƙarshe na rubutun.
    Epistle to Diognetus:
      display_name: Wasiƙa zuwa ga Diognetus
      author: Ba a san marubucin ba. Marubucin ya kira kansa almajiri ko mai koyo, amma ba za a iya tabbatar da ko shi wane ne ko kuma ko Diognetus da aka aika wa wasiƙar wane ne ba.
      audience: Wani mai ilimi da ba Kirista ba mai neman sani—da kuma masu karatu irinsa—wanda yake tambaya game da bautar Kiristoci, ɗabi'unsu, matsayinsu a cikin al'umma, ƙauna, da dalilin da ya sa bangaskiyar take bayyana kamar sabuwa.
      date: Sau da yawa ana danganta shi da ƙarshen ƙarni na 2 ko farkon ƙarni na 3 bayan haihuwar Almasihu, ko da yake ra'ayoyi sun bambanta sosai; wataƙila surori biyu na ƙarshe sun fito ne daga wani rubutu dabam.
    Fragments of Papias:
      display_name: Gutsattsarin Rubuce-rubucen Papias
      author: Papias, bishop na Hierapolis, shi ne marubucin littattafai biyar da suka ɓace, Bayanin Maganganun Ubangiji; tarin da ya rage ya ƙunshi zantattuka da rahotannin da marubuta na baya suka adana.
      audience: Kiristoci na farko masu neman koyarwar da aka tuna game da Yesu da manzanni, wadda aka tattara ta jerin shaidun baka da fassarori da aka ambaci sunayen masu ba da su.
      date: Galibi ana sanya aikin Papias a farkon ƙarni na 2 bayan haihuwar Almasihu, sau da yawa kusan shekara ta 110–130; gutsattsarin da suka tsira suna cikin rubuce-rubucen marubuta tun daga ƙarni na 2 zuwa gaba.
