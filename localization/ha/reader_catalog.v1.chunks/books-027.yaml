review:
  verdict: revise
  review_summary: An gyara fassarorin da suka ƙara ma’ana ko suka sauya ma’ana, musamman wasu kanun Martyrdom of Polycarp, Epistle to Diognetus, da Fragments of Papias. An kiyaye dukkan maɓallai da cikakken tsarin kundin.
  issues:
  - An gyara kanun da suka ƙara bayani ba tare da tushe ba, ciki har da ƙara “bangaskiya” a Martyrdom 9.
  - An gyara fassarorin da ba su isar da ma’anar asali sosai ba, ciki har da “fully belong” a Diognetus 5 da “dictates” a Papias 16.
  - An daidaita wasu rubutun Hausa domin su kasance masu aminci ga ma’anar tushen Turanci ba tare da canjin akida ba.
