  verdict: revise
  review_summary: An gyara harshe, nahawu, da wasu ma’anoni domin su dace da asalin Turanci, musamman 1 Sama’ila 12 (condemns ba la’anta ba), Rut 2 (gleans), da bayanin masu karatu na Rut. An kiyaye dukkan maɓallai da cikakken tsarin chunk.
  issues:
  - An gyara wasu fassarori marasa daidaito ko marasa cikakken ma’ana, ciki har da ‘condemns’ da aka fassara a matsayin ‘la’anta’ a 1 Sama’ila 12.
  - An daidaita wasu jimloli masu nauyin nahawu da zaɓin kalmomi, ba tare da ƙara bayanin da ba ya cikin asalin ba.
