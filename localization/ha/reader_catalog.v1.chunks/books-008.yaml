      author: Marubuta da dama ne suka rubuta shi a cikin ƙarnuka; surori 1–39 sun samo asali daga Ishaya na Urushalima na ƙarni na 8, yayin da 40–55 ("Ishaya na Biyu") da 56–66 ("Ishaya na Uku") suka yi magana game da zaman bauta da dawowa.
      audience: Mutanen Yahuda a ƙarƙashin barazanar Assuriya, da zaman bautar Babila, da kuma maido da ƙasar bayan zaman bauta — bi da bi.
