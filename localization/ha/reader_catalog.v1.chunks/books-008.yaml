review:
  verdict: revise
  review_summary: An gyara wasu fassarori da suka faɗaɗa ma’ana, suka rasa wata alamar ma’ana, ko suka yi amfani da salo marar dacewa. An kiyaye cikakken tsarin kundin da dukkan maɓallai.
  issues:
  - Ishaya 4 ya ƙara ma’anar “komai” wadda babu a tushen.
  - Ishaya 18 ya maimaita “zuwa can nesa” ta hanyar da ba ta bayyana ma’anar tushen sosai.
  - Ishaya 42 ya fassara “gently” da “cikin tawali'u”; an gyara zuwa salon kawo adalci a hankali.
  - Ishaya 49 ya ƙunshi furuci mai rikitarwa wanda bai dace da “far greater” ba.
  - Ishaya 61 ya rasa manufar shafewar bawan, wato domin ya warkar.
  - Irmiya 16 ya sauya lokacin aikin daga mai zuwa zuwa abin da ya riga ya faru.
