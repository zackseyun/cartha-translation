payload:
  book_metadata:
    Gospel of Mary:
      display_name: Bisharar Maryamu
      author: Ba a san marubucin ba. Aikin ya gabatar da Maryamu a matsayin wadda ta karɓi wahayin Yesu kuma ta fassara shi, amma bai yi iƙirarin cewa Maryamu ce ta rubuta bisharar da ta tsira ba.
      audience: Kiristoci na farko da suke kokawa da batutuwan wahayi, hawa ta ruhaniya, ikon manzanni, da halaccin koyarwar Maryamu a cikin almajiran Yesu.
      date: Galibi ana danganta shi da ƙarni na 2 bayan haihuwar Almasihu; gutsattsarin rubutun Helenanci daga ƙarni na 3 sun tsira, kuma babban shaidar rubutun Kofitik tana cikin Kundin Berlin 8502 na ƙarni na 5.
    Treatise on the Resurrection:
      display_name: Muƙala a kan Tashin Matattu
      author: Ba a san marubucin ba. An tsara aikin a matsayin wasiƙar wani malami zuwa ga ɗalibi mai suna Rheginos; ba za a iya tabbatar da ko wanene malamin ko Rheginos ba.
      audience: Kiristoci masu neman koyarwa game da tashin matattu, musamman masu nazarin ko tashin na jiki ne, ko na ruhaniya ne, da kuma yadda ake shiga rayuwar tashin matattu tun yanzu.
      date: Galibi ana sanya shi a ƙarshen ƙarni na 2 bayan haihuwar Almasihu (sau da yawa wajen 170–200); an adana shi a cikin kwafin Kofitik na ƙarni na 4 daga wani aikin Helenanci na farko.
    Dialogue of the Savior:
      display_name: Tattaunawar Mai Ceto
      author: Ba a san marubucin ba. Tattaunawar ta sa koyarwar wahayi a bakin Yesu a hirarsa da Yahuda, Matiyu, da Maryamu, amma ba ta bayyana wanda ya tattara ta ba.
      audience: Wata ƙungiyar Kiristoci ta farko mai sha'awar wahayi na sirri, zama almajiri, sanin kai, addu'a, da shirye-shiryen kame kai domin samun ceto.
      date: Galibi ana danganta shi da ƙarni na 2 bayan haihuwar Almasihu, ko da yake har yanzu ana saɓani game da matakan da aka bi wajen tsara shi da takamaiman kwanan watansa; an adana shi a cikin rubutun Kofitik na ƙarni na 4.
    Exegesis on the Soul:
      display_name: Fassara a kan Rai
      author: Ba a san marubucin ba. Marubucin mai wa'azin Kirista ne wanda ya sake karanta hotunan adabi na Littafi Mai Tsarki da na Helenanci a matsayin misalin faɗuwar rai, tubansa, da maido da shi.
      audience: Kiristoci da suka saba da Nassi da gargaɗin ɗabi'a, waɗanda ake kira su bar sha'awoyi marasa tsari, su tuba, su kuma sake haɗuwa da Allah.
      date: Galibi ana danganta shi da ƙarshen ƙarni na 2 ko farkon ƙarni na 3 bayan haihuwar Almasihu; an adana shi a cikin fassarar Kofitik ta ƙarni na 4 daga Helenanci.
    Book of Thomas the Contender:
      display_name: Littafin Toma Mai Kokawa
      author: Ba a san marubucin ba. Sunan da ke ƙarshen aikin ya danganta shi da Yahuda Toma kuma ya ambaci Mathaias a matsayin marubucin abin da aka faɗa, amma waɗannan dangantawa ce ta adabi, ba iƙirarin marubuta da za a iya tabbatarwa ba.
      audience: Kiristoci masu karkata ga kame kai, waɗanda aka ƙarfafa su su nemi sanin kansu, su yi tsayayya da sha'awoyin jiki, su kuma fahimci koyarwar sirri da Yesu ya yi wa Toma.
      date: Sau da yawa ana danganta shi da ƙarshen ƙarni na 2 ko farkon ƙarni na 3 bayan haihuwar Almasihu, mai yiwuwa a yanayin Kiristanci na Siriya; an adana shi a cikin rubutun Kofitik na ƙarni na 4.
    Tripartite Tractate:
      display_name: Muƙala Mai Sassa Uku
      author: Ba a san marubucin ba. Marubucin masanin tauhidin Kirista ne mai zurfin ilimi, mabiyin ra'ayin Valentinus; ba zai yiwu a tabbatar da cewa shi wani sanannen malami ne ba.
      audience: Wata al'ummar Kiristoci masu bin ra'ayin Valentinus, wadda take samun cikakkiyar koyarwa game da Allah, halittu madawwami, halitta, Almasihu, ikkilisiya, ceto, da maido da kome a ƙarshe.
      date: Galibi ana danganta shi da ƙarni na 3 bayan haihuwar Almasihu, ko da yake wasu hujjoji suna nuna rabin ƙarshe na ƙarnin; an adana shi da harshen Kofitik a cikin Kundin Jung na ƙarni na 4.
    Apocryphon of John:
      display_name: Littafin Sirri na Yohanna
      author: Ba a san marubucin ba. Aikin ya gabatar da kansa da sunan wani dabam, yana cewa wahayi ne daga Yesu wanda ya tashi daga matattu zuwa ga Yohanna ɗan Zabadi, kuma ya tsira a cikin fiye da sigar tsohon rubutu guda ɗaya.
      audience: Kiristoci a cikin al'adar wahayi ta mabiyan Set ko wata al'ada mai kusanci da ita, waɗanda suke neman bayani game da mulkin Allah, halitta, ainihin ɗan Adam, da kuɓuta daga mahukunta masu adawa.
      date: Wata sigarsa ta farko mai yiwuwa ta yaɗu a ƙarni na 2 bayan haihuwar Almasihu; rubuce-rubucen Kofitik da suka tsira, waɗanda suka adana gajerun da dogayen sigogi, sun fito daga ƙarnuka na 4 da na 5.
