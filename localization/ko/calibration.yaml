book_localizations:
- source_title: Genesis
  title: 창세기
  author: 익명입니다. 전통적으로 모세가 저자로 여겨져 왔습니다. 현대 학계에서는 여러 자료가 후대에 함께 편집되는 등 오랜 형성 과정을 거친 것으로 봅니다.
  audience: 언약 백성이라는 정체성을 지닌 이스라엘을 대상으로 하며, 하나님의 창조와 선택과 약속 안에 이 백성의 기원 이야기를 자리매김합니다.
  date: 여러 세기에 걸쳐 형성되었으며, 바빌로니아 유배기 또는 그 이후인 기원전 6~5세기경에 현재 전해지는 형태에 이르렀습니다.
  summary: 창세기는 창조와 인류의 반역과 흩어짐, 그리고 아브라함과 이삭과 야곱과 요셉의 가족을 통해 이스라엘을 향한 하나님의 언약의 약속이 시작되는 과정을 전합니다.
- source_title: John
  title: 요한복음
  author: 익명입니다. 전통적으로 사도 요한 또는 ‘사랑받는 제자’가 저자로 여겨져 왔습니다.
  audience: 회당 유대교와 긴장 관계에 있었으며, 사랑받는 제자의 증언을 중심으로 형성된 그리스도인 공동체를 대상으로 합니다.
  date: 서기 90~110년경입니다.
  summary: 요한복음은 예수님을 아버지를 드러내시고, 자신을 신뢰하는 이들에게 생명을 주시며, 표적과 죽음과 부활을 통해 영광을 받으시는 영원한 말씀으로 제시합니다.
- source_title: Gospel of Thomas
  title: 도마복음
  author: 익명입니다. 서두에서는 이 어록집을 ‘디두모 유다 도마’의 것으로 돌립니다. 완전한 형태로 남아 있는 것은 나그함마디 문서(NHC II,2)에 수록된 4세기 콥트어 번역본뿐이며, 옥시링코스에서 발견된 그리스어 단편 세 점도 전해집니다.
  audience: 시리아계 지혜 전통과 초기 영지주의적 사상의 영향을 받았으며, 예수님의 말씀을 통해 비의적인 자기 인식을 추구하던 그리스도인 독자층을 대상으로 합니다.
  date: 그리스어 원문은 서기 50~140년경에 작성되었을 가능성이 크며, 콥트어 사본은 서기 340년경의 것입니다.
  summary: 도마복음은 예수님의 말씀으로 여겨지는 어록을 모은 책입니다. 연속적인 이야기는 없으며, 독자들에게 그 말씀들의 의미를 발견하라고 거듭 촉구합니다.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: 창세기 1:1
  text: 하나님께서 하늘과 땅을 창조하기 시작하셨을 때에[a]—
  translator_note: '[a] 전통적인 번역은 이 구절을 완결된 문장으로 봅니다. “태초에 하나님께서 하늘과 땅을 창조하셨습니다.” 그러나 히브리어는 뒤따르는 내용을 도입하는 표현으로 보는 편이 더 자연스러우며, 주된 행동은 3절의 “하나님께서 말씀하셨습니다”입니다.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: 전도서 1:2
  text: “숨결 중의 숨결[a]”이라고 코헬렛[b]이 말합니다. “모든 것은 숨결입니다—잠시뿐이고 붙잡을 수 없으며, 흔히 우리가 기대한 대로 되지 않습니다.”
  translator_note: '[a] 히브리어 ‘헤벨’은 문자적으로 숨결이나 수증기를 뜻합니다. 전도서 전체에서 이 말은 빠르게 지나가고 붙잡거나 온전히 이해할 수 없으며, 흔히 사람들이 기대한 것과 다르게 드러나는 것을 묘사합니다. 여기서는 아무것도 의미가 없다고 단정하지 않으면서 그 이미지를 살리기 위해 ‘숨결’로 옮겼습니다. ‘수증기’, ‘한낱 숨결’, ‘잠깐뿐인 것’으로도 옮길 수 있습니다. [b] ‘코헬렛’은 저자의 히브리어 이름 또는 칭호입니다. 흔히 ‘스승’이나 ‘설교자’로 번역하지만, 어느 한 해석에 치우치지 않고 가능한 의미들을 열어 두기 위해 ‘코헬렛’으로 표기했습니다.'
- source_path: nt/john/001/001.yaml
  reference: 요한복음 1:1
  text: 태초에[b] 말씀이 이미 계셨습니다. 말씀은 하나님과 함께 계셨고, 말씀은 하나님이셨습니다.[a]
  translator_note: '[a] 또는 “말씀은 신적인 분이셨습니다”, “하나님이 어떠한 분이신지, 말씀도 그러하셨습니다”라고 옮길 수 있습니다. 그리스어 표현은 말씀이 온전히 하나님이심을 확언하면서도, 앞 절의 하나님과 말씀을 구별합니다. [b] 이 첫머리는 창세기 1:1을 떠올리게 하며, 말씀을 창조의 시작과 연결합니다. ‘이미 계셨습니다’는 시작이 이르렀을 때 말씀이 생겨나신 것이 아니라 계속 존재하고 계셨음을 나타냅니다. ‘계셨습니다’ 또는 ‘존재하셨습니다’로도 옮길 수 있습니다.'
- source_path: nt/romans/003/025.yaml
  reference: 로마서 3:25
  text: 하나님께서는 그분의 피에 대한 믿음을 통하여 그분을 속죄 제물로 내세우셨습니다.[a][b] 이렇게 하신 것은 자신의 의로우심을 드러내시기 위해서였습니다.[c] 하나님께서 과거에 지은 죄들을 넘겨두셨기 때문입니다.
  translator_note: '[a] 또는 ‘진노를 누그러뜨리는 제물’로 옮길 수 있습니다. 또는 구약에서 속죄의 피를 뿌리던 언약궤의 금 덮개인 ‘속죄소’를 가리킬 수도 있습니다. [b] 또는 “믿음을 통하여, 그분의 피로”라고 옮길 수 있습니다. [c] 또는 ‘공의’라고 옮길 수 있습니다.'
- source_path: nt/1_peter/001/013.yaml
  reference: 베드로전서 1:13
  text: 그러므로 행동할 수 있도록 마음을 준비하십시오.[a] 온전히 맑은 정신을 유지하고, 예수 그리스도께서 나타나실 때 여러분에게 주어질 은혜에 모든 소망을 두십시오.[b]
  translator_note: '[a] 그리스어를 문자적으로 옮기면 “여러분의 마음의 허리를 동여매십시오”입니다. 행동할 준비를 하려고 긴 옷자락을 허리춤에 걷어 올려 묶는 모습을 나타냅니다. [b] ‘온전히’ 또는 ‘모든’에 해당하는 그리스어는 맑은 정신을 유지하는 일에 연결될 수도 있고, 소망을 두는 일에 연결될 수도 있으며, 두 가지 모두에 연결될 가능성도 있습니다.'
