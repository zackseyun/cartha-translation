  Polycarp to the Philippians:
    display_name: 폴리카르포스가 빌립보인들에게 보낸 편지
    author: 스미르나의 감독 폴리카르포스입니다. 일부 학자들은 전해지는 본문이 서로 다른 시기에 보낸 자료를 합친 것이라고 봅니다.
    audience: 이그나티오스의 편지들을 요청하고 믿음과 행실, 지도력, 재물, 인내에 관한 권면을 받은 빌립보의 그리스도인 공동체입니다.
    date: 서기 2세기 초에서 중엽으로 추정됩니다. 적어도 일부는 이그나티오스의 여정과 밀접하게 관련되어 있으며, 여러 편지를 합친 것이라는 견해에 따르면 일부 대목은 그보다 조금 뒤에 쓰였을 수 있습니다.
    chapters:
      '1':
        title: 폴리카르포스가 빌립보인들에게 문안합니다
      '2':
        title: 그리스도께서 죄인들을 위해 고난받으셨습니다
      '3':
        title: 경외함과 진실함으로 하나님을 섬기십시오
      '4':
        title: 폴리카르포스가 의에 관해 씁니다
      '5':
        title: 과부들은 언제나 진실하게 기도해야 합니다
      '6':
        title: 집사들은 이제 흠 없이 그리스도를 섬기십시오
      '7':
        title: 장로들은 모든 이에게 자비를 베푸십시오
      '8':
        title: 적그리스도와 거짓 가르침을 부인하십시오
      '9':
        title: 소망을 붙들고 그리스도를 따르십시오
      '10':
        title: 신실한 성도들의 본을 따르십시오
      '11':
        title: 굳게 서서 사랑을 실천하십시오
      '12':
        title: 이제 탐욕과 우상 숭배를 물리치십시오
      '13':
        title: 폴리카르포스가 빌립보인들의 믿음을 위해 기도합니다
      '14':
        title: 시리아로 보낼 편지들을 기다립니다
      '15':
        title: 크레스켄스가 흠 없이 편지를 전달합니다
  Martyrdom of Polycarp:
    display_name: 폴리카르포스의 순교
    author: 스미르나 교회의 익명 구성원들이 공동체의 이름으로 기록했습니다. 끝부분의 전승 기록은 후대의 필사와 유통 과정을 반영합니다.
    audience: 필로멜리온 교회와 더 넓은 그리스도인 공동체를 대상으로 하며, 폴리카르포스의 체포와 재판, 죽음, 본이 되는 인내를 전합니다.
    date: 폴리카르포스가 죽은 뒤에 기록되었으며, 대체로 서기 2세기 중엽이나 후반의 문서로 봅니다. 다만 정확한 순교 연도와 문서가 최종 형태를 갖춘 시점에는 논란이 있습니다.
    chapters:
      '1':
        title: 교회가 모든 이에게 자비의 문안을 보냅니다
      '2':
        title: 폴리카르포스의 순교가 확증됩니다
      '3':
        title: 순교자들이 그리스도를 위해 견딥니다
      '4':
        title: 게르마니쿠스가 맹수들과 맞섭니다
      '5':
        title: 퀸투스가 용기를 잃습니다
      '6':
        title: 폴리카르포스가 모든 이를 위해 기도합니다
      '7':
        title: 자기 집안사람에게 배신당합니다
      '8':
        title: 폴리카르포스가 자신의 운명을 받아들입니다
      '9':
        title: 헤롯이 폴리카르포스에게 신앙을 부인하라고 다그칩니다
      '10':
        title: 하늘의 음성이 폴리카르포스에게 힘을 줍니다
      '11':
        title: 폴리카르포스가 그리스도를 저버리기를 거부합니다
      '12':
        title: 폴리카르포스가 죽음의 위협을 비웃습니다
      '13':
        title: 군중이 폴리카르포스를 불태우라고 요구합니다
      '14':
        title: 폴리카르포스가 기둥에 묶인 채 기도합니다
      '15':
        title: 폴리카르포스가 기둥에서 기도합니다
      '16':
        title: 불길이 폴리카르포스를 에워쌉니다
      '17':
        title: 폴리카르포스의 피가 불을 끕니다
      '18':
        title: 니케테스가 관리에게 유해 인도를 거부하라고 촉구합니다
      '19':
        title: 그리스도인들이 폴리카르포스의 뼈를 거둡니다
      '20':
        title: 폴리카르포스가 통치자를 이기고 면류관을 받습니다
      '21':
        title: 마르키아누스가 신자들에게 요약문을 보냅니다
      '22':
        title: 폴리카르포스가 안식일에 순교합니다
      '23':
        title: 폴리카르포스를 따라 하나님 나라로 들어가십시오
  Epistle to Diognetus:
    display_name: 디오그네토스에게 보낸 편지
    author: 저자는 알려져 있지 않습니다. 글쓴이는 자신을 제자 또는 배우는 사람이라고 부르지만, 그와 수신인 디오그네토스가 누구인지는 확실히 확인할 수 없습니다.
    audience: 그리스도인의 예배와 윤리, 사회적 정체성, 사랑, 그리고 이 신앙이 새롭게 보이는 까닭을 묻는 교양 있는 비그리스도인 탐구자와 그와 같은 독자들을 대상으로 합니다.
    date: 흔히 서기 2세기 후반이나 3세기 초로 추정하지만, 제시된 연대의 범위는 매우 넓습니다. 마지막 두 장은 다른 저술에서 왔을 가능성이 있습니다.
    chapters:
      '1':
        title: 디오그네토스가 신앙에 대한 깨달음을 구합니다
      '2':
        title: 우상들은 사람의 손으로 만들어졌습니다
      '3':
        title: 그리스도인들은 거짓 예배를 거부합니다
      '4':
        title: 하나님이 주신 좋은 선물을 거부합니다
      '5':
        title: 나그네이지만 온전히 그곳에 속합니다
      '6':
        title: 영혼은 세상 안에 있습니다
      '7':
        title: 보이지 않는 창조주에게서 온 진리
      '8':
        title: 믿음이 감추어진 진리를 드러냅니다
      '9':
        title: 놀라운 은혜로 얻는 구원
      '10':
        title: 참된 행복은 사랑에서 옵니다
      '11':
        title: 은혜가 끊임없이 교회를 풍성하게 합니다
      '12':
        title: 지식으로 가득한 마음이 열매를 맺습니다
  Fragments of Papias:
    display_name: 파피아스 단편
    author: 소실된 다섯 권짜리 『주님의 말씀 해설』의 저자는 히에라폴리스의 감독 파피아스입니다. 현존하는 단편 모음은 후대 저자들이 보존한 인용문과 전승으로 이루어져 있습니다.
    audience: 이름이 밝혀진 구전 증언과 해석의 전승 경로를 따라 수집된, 예수와 사도들에 관한 기억 속 가르침을 찾던 초기 그리스도인들을 대상으로 합니다.
    date: 파피아스의 저술은 대체로 서기 2세기 초, 흔히 약 110~130년으로 추정됩니다. 현존 단편들은 2세기 이후의 저자들이 쓴 문헌에 나타납니다.
    chapters:
      '1':
        title: 요한의 통치 뒤에 지도자들이 등장합니다
      '2':
        title: 파피아스가 주님의 가르침을 기록합니다
      '3':
        title: 예수께서 간음한 여인을 구하십니다
      '4':
        title: 파피아스가 장로 요한의 전승을 가르칩니다
      '5':
        title: 히에로니무스가 파피아스의 저술을 설명합니다
      '6':
        title: 이레나이오스가 파피아스에게서 배웁니다
      '7':
        title: 안드레아스가 파피아스의 증언을 인용합니다
      '8':
        title: 사탄이 패배할 때 천사들이 타락합니다
      '9':
        title: 해석자들이 날들을 그리스도와 연결합니다
      '10':
        title: 낙원을 교회로 해석합니다
      '11':
        title: 파피아스가 장차 올 나라를 묘사합니다
      '12':
        title: 파피아스가 어린아이 같은 믿음을 설명합니다
      '13':
        title: 막시무스가 파피아스의 가르침을 인용합니다
      '14':
        title: 포티오스가 파피아스의 견해를 거부합니다
      '15':
        title: 아폴리나리오스가 유다의 최후를 전합니다
      '16':
        title: 요한이 파피아스에게 복음서를 받아쓰게 합니다
