    display_name: 부활에 관한 논고
    author: 저자는 알려져 있지 않습니다. 이 작품은 스승이 레기노스라는 제자에게 보내는 편지 형식이지만, 그 스승과 레기노스가 누구인지는 확실히 밝혀낼 수 없습니다.
    audience: 부활에 관한 가르침을 구하던 그리스도인들, 특히 육체적 부활과 영적 부활, 그리고 현재 부활의 생명에 참여하는 일을 숙고하던 독자들을 대상으로 합니다.
    date: 대체로 서기 2세기 후반, 흔히 약 170~200년의 작품으로 봅니다. 앞선 시기의 그리스어 작품을 옮긴 4세기 콥트어 사본에 보존되어 있습니다.
    chapters:
      '1':
        title: 그리스도께서 참된 완성을 가져오시다
      '2':
        title: 그리스도께서 죽음의 속박을 이기시다
      '3':
        title: 부활이 실재를 변화시키다
      '4':
        title: 신자들이 그리스도의 부활에 참여하다
      '5':
        title: 그리스도의 부활을 믿는 믿음
      '6':
        title: 구원의 지혜가 영원히 지속되다
      '7':
        title: 은혜가 영원한 생명을 지키다
      '8':
        title: 부활이 참된 생명을 드러내다
      '9':
        title: 부활이 부패를 이기다
      '10':
        title: 분열에서 벗어나 부활에 이르다
      '11':
        title: 다른 이들을 위해 가르침을 나누다
  Dialogue of the Savior:
    display_name: 구원자의 대화
    author: 저자는 알려져 있지 않습니다. 이 대화편은 예수님이 유다, 마태, 마리아와 대화하며 계시의 가르침을 전하는 것으로 묘사하지만, 편찬자가 누구인지는 밝히지 않습니다.
    audience: 개인적으로 전해지는 계시, 제자도, 자기 인식, 기도, 그리고 구원을 위한 금욕적 준비에 관심을 둔 초기 그리스도교 공동체를 대상으로 합니다.
    date: 일반적으로 서기 2세기의 작품으로 보지만, 작품의 구성 층위와 정확한 연대에는 여전히 논쟁이 있습니다. 4세기 콥트어 사본에 보존되어 있습니다.
    chapters:
      '1':
        title: 예수님이 참된 안식을 가르치시다
      '2':
        title: 하나님이 영원한 생명으로 이끄시다
      '3':
        title: 기쁨으로 위험을 헤쳐 나아가다
      '4':
        title: 내면의 영혼을 바로 세우다
      '5':
        title: 슬픔 너머의 진리를 찾다
      '6':
        title: 마음속을 깨끗이 하다
      '7':
        title: 하늘의 선함을 비추다
      '8':
        title: 신적 능력이 만물을 지탱하다
      '9':
        title: 먼저 신적 근원을 알다
      '10':
        title: 영원하신 하나님을 영원히 뵙다
      '11':
        title: 신적 빛을 옷 입다
      '12':
        title: 그리스도의 영적 풍요를 드러내다
      '13':
        title: 사랑으로 갈등을 이겨 내다
      '14':
        title: 참된 기도가 저 너머로 오르다
      '15':
        title: 내면의 생명을 세심히 지키다
  Exegesis on the Soul:
    display_name: 영혼에 관한 해설
    author: 저자는 알려져 있지 않습니다. 저자는 그리스도교 설교자로서, 성경과 그리스 문학의 심상을 영혼의 타락과 회개와 회복을 나타내는 비유로 새롭게 해석합니다.
    audience: 성경과 도덕적 권면에 익숙하며, 무질서한 욕망에서 돌이켜 회개하고 신적인 존재와 다시 결합하라는 부름을 받은 그리스도인들을 대상으로 합니다.
    date: 일반적으로 서기 2세기 후반이나 3세기 초반의 작품으로 추정됩니다. 그리스어 원문을 번역한 4세기 콥트어 사본에 보존되어 있습니다.
    chapters:
      '1':
        title: 영혼이 자비를 구하며 회개하다
      '2':
        title: 영혼이 욕망으로 하나님을 저버리다
      '3':
        title: 하나님이 세례로 영혼을 깨끗이 하시다
      '4':
        title: 영혼이 신적 근원과 다시 결합하다
      '5':
        title: 숨겨진 하나님께 진실하게 기도하다
      '6':
        title: 영혼이 욕망에서 벗어나 고향으로 돌아오다
      '7':
        title: 하나님이 진실한 애통을 들으시다
  Book of Thomas the Contender:
    display_name: 투사 도마의 책
    author: 저자는 알려져 있지 않습니다. 작품 끝의 표제는 이 글을 유다 도마와 연관 짓고 마타이아스를 기록자로 지목하지만, 이는 검증할 수 있는 저자 진술이라기보다 문학적 귀속입니다.
    audience: 자기 인식을 추구하고 육체의 욕정을 물리치며, 예수님이 도마에게 개인적으로 주신 가르침을 이해하라는 권면을 받은 금욕 성향의 그리스도인들을 대상으로 합니다.
    date: 흔히 서기 2세기 후반이나 3세기 초반의 작품으로 보며, 시리아계 그리스도교 환경에서 작성되었을 가능성이 있습니다. 4세기 콥트어 사본에 보존되어 있습니다.
    chapters:
      '1':
        title: 마타이아스가 도마의 가르침을 기록하다
      '2':
        title: 그리스도께서 자기 성찰을 촉구하시다
      '3':
        title: 예수님이 보이지 않는 진리를 가르치시다
      '4':
        title: 구원자가 욕망의 속박을 경고하시다
      '5':
        title: 도마가 죄인들에 관해 묻다
      '6':
        title: 구원자가 영적 어둠을 경고하시다
      '7':
        title: 깨어 있는 성도들은 복이 있다
  Tripartite Tractate:
    display_name: 삼부 논고
    author: 저자는 알려져 있지 않습니다. 저자는 고등 교육을 받은 발렌티누스파 그리스도교 신학자였지만, 이름이 알려진 어떤 교사와도 확실히 동일시할 수 없습니다.
    audience: 하나님, 아이온들, 창조, 그리스도, 교회, 구원, 최종적 회복에 관한 체계적인 가르침을 받던 발렌티누스파 그리스도교 공동체를 대상으로 합니다.
    date: 대체로 서기 3세기의 작품으로 보며, 일부 견해는 3세기 후반을 더 유력하게 봅니다. 4세기의 융 코덱스에 콥트어로 보존되어 있습니다.
    chapters:
      '1':
        title: 하나님이 수고 없이 만물을 창조하시다
      '2':
        title: 아들이 측량할 수 없는 하나님의 영광을 드러내시다
      '3':
        title: 공동체가 신적이며 영원한 생명을 함께 누리다
      '4':
        title: 하나님이 존재들을 빛으로 깨우시다
      '5':
        title: 하나님이 완전한 아들을 통해 계시하시다
      '6':
        title: 영원한 존재들이 하나님의 본성을 비추다
      '7':
        title: 아들이 숨겨진 하나님을 드러내시다
      '8':
        title: 하나님이 영원한 존재들에게 능력을 주시다
      '9':
        title: 하나님이 보이지 않는 향기로 이끄시다
      '10':
        title: 하나님이 모든 존재를 통해 흘러가시다
      '11':
        title: 타락한 존재가 완전을 추구하나 실패하다
      '12':
        title: 말씀이 회개하여 하나 됨을 가져오다
      '13':
        title: 교만이 영들 사이에 갈등을 낳다
      '14':
        title: 구원자가 구속을 통해 만물을 회복하시다
      '15':
        title: 지식의 메시지가 존재를 굳세게 하다
      '16':
        title: 말씀이 창조 세계를 위해 기도하다
      '17':
        title: 말씀이 구원의 영역을 세우다
      '18':
        title: 말씀이 심판과 구원을 준비하다
      '19':
        title: 서로 대립하는 무리들이 정해진 지위를 받다
      '20':
        title: 최고 지배자가 하위 영역들을 정돈하다
      '21':
        title: 인류가 죽음과 고난을 통해 배우다
      '22':
        title: 영적 권세들이 질서와 무질서를 뒤섞다
      '23':
        title: 예언자들의 구원자에 관한 환상
      '24':
        title: 구원자가 영원한 자유를 가져오시다
      '25':
        title: 구원자가 인류를 나누시다
      '26':
        title: 그리스도께서 모든 창조 세계를 하나로 묶으시다
      '27':
        title: 하나님에 관한 지식이 창조 세계를 영원히 회복하다
      '28':
        title: 내면의 믿음을 통한 구속
      '29':
        title: 종들이 그리스도의 인도를 받다
      '30':
        title: 그리스도의 빛이 영원한 회복을 드러내다
  Apocryphon of John:
    display_name: 요한 외경
    author: 저자는 알려져 있지 않습니다. 이 작품은 부활하신 예수님이 세베대의 아들 요한에게 주신 계시인 것처럼 가명으로 제시되며, 고대의 여러 판본으로 전해집니다.
    audience: 신적 영역, 창조, 인간의 정체성, 적대적인 지배자들로부터의 해방에 관한 설명을 구하던 세트파 또는 그와 밀접히 관련된 계시 전승의 그리스도인들을 대상으로 합니다.
    date: 초기 형태는 서기 2세기에 유통되었을 가능성이 큽니다. 짧은 판본과 긴 판본을 보존한 현존 콥트어 사본들은 4세기와 5세기의 것입니다.
    chapters:
      '1':
        title: 요한이 예수님의 지혜를 구하다
      '2':
        title: 하늘이 신적 형상들을 드러내다
      '3':
        title: 숨겨진 하나님이 최고의 실재이시다
      '4':
        title: 신적 예지가 밝게 빛나다
      '5':
        title: 바르벨로가 권능들을 구하다
      '6':
        title: 그리스도께서 섭리로부터 오시다
      '7':
        title: 영원한 생명이 영을 찬양하다
      '8':
        title: 아담이 숨겨진 하나님을 찬양하다
      '9':
        title: 소피아가 불완전한 존재를 창조하다
      '10':
        title: 교만한 지배자가 영역들을 만들다
      '11':
        title: 무지한 지배자가 질서를 모방하다
      '12':
        title: 지혜가 어둠 속에서 회개하다
      '13':
        title: 권세자들이 인간의 몸을 만들다
      '14':
        title: 하나님이 아담 안에 빛을 숨기시다
      '15':
        title: 지배자들이 아담을 유혹하여 잊게 하다
      '16':
        title: 신적 빛이 인류를 깨우다
      '17':
        title: 섭리가 마음을 깨우다
      '18':
        title: 영혼들이 악한 투쟁에서 돌아서다
      '19':
        title: 자비로운 영이 사람들을 깨우다
      '20':
        title: 빛이 내려와 영혼들을 구원하다
      '21':
        title: 구원자가 감추어진 지혜를 맡기다
  Hypostasis of the Archons:
    display_name: 집정관들의 본질
    author: 익명입니다. 저자는 집정관들에 관한 계시적 신화를 통해 창세기를 해석하지만, 이 작품을 특정 교사의 저작으로 확실히 돌릴 수는 없습니다.
    audience: 창세기를 무지한 우주적 통치자들과 신적 지혜, 그리고 인류의 영적 기원 사이의 갈등으로 읽었던 셋파 또는 그와 관련된 환경의 그리스도인들을 대상으로 합니다.
    date: 일반적으로 서기 3세기의 작품으로 보며, 나그함마디 문서 II에 수록된 4세기 콥트어 사본으로 보존되어 있습니다.
    chapters:
      '1':
        title: 영이 우주의 권세들을 드러내다
      '2':
        title: 음성이 눈먼 통치자의 실체를 밝히다
      '3':
        title: 신적 빛이 아담을 살리다
      '4':
        title: 여자가 통치자들의 폭력을 피하다
      '5':
        title: 뱀이 영적 진리를 가르치다
      '6':
        title: 가인이 아벨을 죽이고 셋이 대신하다
      '7':
        title: 노아가 방주를 짓고 두 번 구원받다
      '8':
        title: 노레아가 어둠의 권세들에 담대히 맞서다
      '9':
        title: 엘렐레트가 참된 기원을 확증하다
      '10':
        title: 지혜의 딸이 통치자를 묶다
      '11':
        title: 사바오트가 회개하고 지혜를 찬양하다
      '12':
        title: 계시자가 영원한 생명을 가져오다
  On the Origin of the World:
    display_name: 세계의 기원에 관하여
    author: 익명입니다. 이 작품은 편찬자의 이름을 밝히지 않은 채 유대교·그리스도교·플라톤 철학·신화의 여러 전통을 결합하고 수정합니다.
    audience: 창조와 우주적 통치자들, 소피아, 아담과 하와, 그리고 세계의 최종 운명에 관한 대안적 역사를 알고자 했던 영지주의적 성향의 그리스도교 환경에 속한 독자들을 대상으로 합니다.
    date: 대체로 서기 3세기의 작품으로 보지만, 그보다 이른 자료들이 바탕에 놓여 있을 수도 있습니다. 주로 4세기의 콥트어 사본들로 보존되어 있습니다.
    chapters:
      '1':
        title: 어둠에서 혼돈이 생겨나다
      '2':
        title: 지혜가 하늘의 경계를 이루다
      '3':
        title: 통치자가 자신만 다스린다고 잘못 여기다
      '4':
        title: 일곱 존재가 하늘들을 다스리다
      '5':
        title: 눈먼 신이 자신만 존재한다고 주장하다
      '6':
        title: 사바오트가 부모의 어둠을 거부하다
      '7':
        title: 하늘의 통치자가 모형들을 만들다
      '8':
        title: 생명의 힘들이 죽음을 이기다
      '9':
        title: 첫 통치자가 신적 신앙을 보다
      '10':
        title: 빛나는 아담이 빛 가운데 나타나다
      '11':
        title: 에로스가 욕망과 죽음을 일깨우다
      '12':
        title: 거룩한 나무들이 있는 낙원이 창조되다
      '13':
        title: 신적 피에서 꽃들이 피어나다
      '14':
        title: 지혜가 천체들을 배열하다
      '15':
        title: 교사가 우주적 무지를 드러내다
      '16':
        title: 하와가 남편 없이 아이를 낳다
      '17':
        title: 우주적 통치자들이 아담을 빚다
      '18':
        title: 하와가 아담을 깨워 생명을 얻게 하다
      '19':
        title: 통치자들이 하와의 빛나는 권능을 두려워하다
      '20':
        title: 하와가 우주적 통치자들로 말미암아 잉태하다
      '21':
        title: 하와가 열매를 먹고 지혜를 얻다
      '22':
        title: 아담이 지배 권세들에 맞서다
      '23':
        title: 지혜가 통치자들을 하늘에서 내쫓다
      '24':
        title: 악령의 종들이 인류를 불길로 이끌다
      '25':
        title: 감추어진 신이 복된 영들을 보내다
      '26':
        title: 지극히 높은 말씀이 감추어진 진리들을 드러내다
      '27':
        title: 진노가 혼돈을 삼키고 끝내다
  Sophia of Jesus Christ:
    display_name: 예수 그리스도의 지혜
    author: 익명입니다. 저자는 『에우그노스토스』에도 나오는 자료를 예수와 제자들이 부활 후에 나눈 대화 형식으로 각색합니다.
    audience: 초월적 하나님과 하늘 세계의 질서, 영혼의 기원과 구원에 관해 계시된 지혜에 관심을 가진 그리스도인들을 대상으로 합니다.
    date: 흔히 서기 2세기 말 또는 3세기의 작품으로 보며, 나그함마디 문서와 베를린 문서의 콥트어 사본들로 보존되어 있습니다.
    chapters:
      '1':
        title: 예수가 제자들에게 진리를 드러내다
      '2':
        title: 하나님의 영원한 신비가 밝혀지다
      '3':
        title: 감추어진 하나님의 선하심에서 창조가 비롯되다
      '4':
        title: 보이는 세계가 믿음으로 이끌다
      '5':
        title: 하나님이 빛나는 인간을 드러내다
      '6':
        title: 그리스도가 권위로 천사들을 창조하다
      '7':
        title: 구원자가 내면의 신적 빛을 깨우다
      '8':
        title: 하늘 영역들이 조화롭게 하나를 이루다
      '9':
        title: 신적 지혜와 참된 지식
      '10':
        title: 영원하신 하나님의 완전한 뜻을 드러내다
  Gospel of the Egyptians:
    display_name: 이집트인 복음서
    author: 익명입니다. 『위대한 보이지 않는 영의 거룩한 책』이라고도 불리는 이 나그함마디 작품은 인용문으로만 알려진 더 이른 시기의 그리스어 『이집트인 복음서』와는 별개의 작품입니다.
    audience: 복잡한 신화와 신성한 이름들, 세례의 표상, 찬송의 언어를 사용하여 영적 정체성과 해방을 표현했던 셋파 그리스도교 공동체를 대상으로 합니다.
    date: 대체로 서기 2세기 또는 3세기의 작품으로 보며, 4세기 나그함마디 문서들에 두 개의 콥트어 사본이 남아 있습니다.
    chapters:
      '1':
        title: 하나님이 영원한 신적 빛을 드러내다
      '2':
        title: 침묵에서 세 권능이 펼쳐지다
      '3':
        title: 아버지가 거룩한 침묵에서 나타나다
      '4':
        title: 하늘의 존재들이 영을 찬양하다
      '5':
        title: 아다마스가 모든 피조물을 낳다
      '6':
        title: 그리스도가 불멸의 백성을 세우다
      '7':
        title: 신적 권능들이 하나 됨 안에서 기뻐하다
      '8':
        title: 그리스도가 충만한 위엄과 영광을 드러내다
      '9':
        title: 셋이 영적 후손들을 위해 기도하다
      '10':
        title: 소피아가 신적 지혜에서 나타나다
      '11':
        title: 하늘의 사자들이 혈통을 지키다
      '12':
        title: 셋이 그리스도를 통한 구원을 준비하다
      '13':
        title: 화자가 영원하고 보이지 않는 하나님을 부르다
      '14':
        title: 셋이 비밀의 책을 쓰다
  Letter of Peter to Philip:
    display_name: 베드로가 빌립에게 보낸 편지
    author: 익명입니다. 짧은 서두의 편지와 뒤이은 계시는 베드로와 빌립에게 가명으로 귀속된 것이며, 두 사도 가운데 어느 한 사람이 확실히 쓴 것은 아닙니다.
    audience: 구원자와 적대 세력, 고난과 선교, 제자들의 회복에 관한 가르침에 사도적 권위를 부여하고자 했던 그리스도인들을 대상으로 합니다.
    date: 일반적으로 서기 2세기 말 또는 3세기 초의 작품으로 보며, 4세기 나그함마디 사본 하나와 그보다 후대의 콥트어 사본 하나로 보존되어 있습니다.
    chapters:
      '1':
        title: 베드로가 빌립에게 돌아오라고 권하다
      '2':
        title: 사도들이 올리브산에서 기도하다
      '3':
        title: 예수가 신적 충만을 설명하다
      '4':
        title: 통치자가 참하나님의 계획에 맞서다
      '5':
        title: 그리스도가 믿음으로 길 잃은 이들을 구하다
      '6':
        title: 예수가 영원한 힘을 약속하다
      '7':
        title: 사도들이 박해에도 복음을 전하다
      '8':
        title: 베드로가 거룩한 유업을 선포하다
  Gospel of Judas:
    display_name: 유다 복음서
    author: 익명입니다. 제목은 이 이야기를 유다에게 귀속하지만, 이 작품은 가룟 유다가 역사적 저자였음을 입증하지 않습니다.
    audience: 경쟁하는 희생 제의와 교회 관행을 비판하며, 계시적 대화와 셋파 계열의 우주론을 통해 유다와 예수의 죽음을 새롭게 해석했던 그리스도교 집단을 대상으로 합니다.
    date: 대체로 서기 2세기 중엽 또는 후반의 작품으로 봅니다. 이레네우스는 180년경에 『유다 복음서』를 알고 있었으며, 현존하는 콥트어 사본은 아마도 3세기 또는 4세기의 것입니다.
    chapters:
      '1':
        title: 예수가 유다에게 신비들을 드러내다
      '2':
        title: 유다만이 예수에게 다가가다
      '3':
        title: 예수가 거룩한 공동체를 묘사하다
      '4':
        title: 제자들의 환상이 부패를 드러내다
      '5':
        title: 유다가 저주받으나 남다른 자가 되다
      '6':
        title: 예수가 신적 영역들을 드러내다
      '7':
        title: 유다가 예수의 몸을 넘겨주다
  Protoevangelium of James:
    display_name: 야고보 원복음서
    author: 익명입니다. 화자는 자신이 야고보라고 주장하지만, 이 작품은 가명 저작이며 예수의 형제 야고보가 쓴 것이 아닙니다.
    audience: 마리아의 출생과 성장, 그의 변함없는 순결, 예수의 탄생, 그리고 마태복음과 누가복음이 답하지 않은 질문들에 대한 이야기식 해답에 관심을 가진 그리스도인들을 대상으로 합니다.
    date: 일반적으로 서기 2세기 후반의 작품으로 보며, 후대의 수많은 그리스어 사본과 고대 번역본으로 전해집니다.
    chapters:
      '1':
        title: 요아킴이 광야에서 기도하다
      '2':
        title: 안나가 월계수 아래에서 기도하다
      '3':
        title: 안나가 자녀 없음을 한탄하다
      '4':
        title: 안나가 기도하자 천사가 응답하다
      '5':
        title: 요아킴이 죄가 없음을 보다
      '6':
        title: 요아킴이 건강해진 마리아를 집으로 맞이하다
      '7':
        title: 사랑받는 이스라엘의 딸이 춤추다
      '8':
        title: 마리아가 성전에 머물다
      '9':
        title: 요셉이 동정녀를 맡을 사람으로 뽑히다
      '10':
        title: 마리아가 붉은 실을 잣다
      '11':
        title: 천사가 마리아의 거룩한 사명을 알립니다
      '12':
        title: 마리아가 엘리사벳을 방문하고 돌아옵니다
      '13':
        title: 요셉이 임신한 마리아를 두고 슬퍼합니다
      '14':
        title: 천사가 꿈에서 요셉에게 말합니다
      '15':
        title: 제사장이 요셉의 잘못을 고발합니다
      '16':
        title: 요셉이 시험 후 마리아를 풀어 줍니다
      '17':
        title: 마리아가 베들레헴으로 갑니다
      '18':
        title: 요셉이 멈춰 버린 세상을 봅니다
      '19':
        title: 산파가 처녀 출산을 목격합니다
      '20':
        title: 살로메가 마리아를 확인하다 손이 불탑니다
      '21':
        title: 동방 박사들이 갓 태어난 왕을 찾습니다
      '22':
        title: 헤롯이 아기들을 죽이라고 명령합니다
      '23':
        title: 스가랴가 헤롯의 위협에 맞섭니다
      '24':
        title: 스가랴가 성소에서 살해됩니다
      '25':
        title: 야고보가 혼란 중에 이야기를 기록합니다
      '26':
        title: 보드메르 파피루스에 더 짧은 판본이 실려 있습니다
      '27':
        title: 요셉이 베들레헴에서 산파를 찾습니다
      '28':
        title: 요셉이 마리아에게 일어난 기적을 설명합니다
      '29':
        title: 살로메가 아기를 만지고 치유됩니다
      '30':
        title: 동방 박사들이 유대인의 왕을 찾습니다
  Infancy Gospel of Thomas:
    display_name: 도마 유년 복음서
    author: 저자는 알려져 있지 않습니다. 복원할 수 있는 가장 이른 형태의 본문에는 저자 이름이 나오지 않으며, 도마의 저작이라는 귀속은 후대 사본의 제목과 전승에서 비롯되었습니다.
    audience: 정경 복음서의 이야기가 시작되기 전 예수의 어린 시절과 신적 능력, 훈육, 배움, 성장이 어떻게 서술될 수 있는지 궁금해하던 그리스도인들을 대상으로 합니다.
    date: 대체로 서기 2세기에 기원을 둔 것으로 보지만, 본문은 서로 상당히 다른 여러 그리스어 판본과 초기 번역본으로 전해집니다.
    chapters:
      '1':
        title: 도마가 예수에 관해 말합니다
      '2':
        title: 예수가 물을 맑게 하고 새를 빚습니다
      '3':
        title: 예수가 안나스의 아들을 저주합니다
      '4':
        title: 예수가 한 아이를 저주하자 아이가 죽습니다
      '5':
        title: 예수가 요셉에게 지혜를 가르칩니다
      '6':
        title: 교사가 예수의 지혜를 감당하지 못합니다
      '7':
        title: 교사가 예수의 뛰어난 지식을 인정합니다
      '8':
        title: 예수가 웃고 치유하며 선언합니다
      '9':
        title: 예수가 떨어진 제논을 살립니다
      '10':
        title: 예수가 나무꾼의 발을 고칩니다
      '11':
        title: 예수가 깨진 물동이에 기적적으로 물을 채웁니다
      '12':
        title: 요셉이 예수가 뿌린 씨앗을 거둡니다
      '13':
        title: 요셉이 예수와 함께 침상을 완성합니다
      '14':
        title: 예수에게 도전한 교사가 죽습니다
      '15':
        title: 예수가 말하여 교사를 기쁘게 합니다
      '16':
        title: 예수가 뱀에 물린 야고보를 고칩니다
      '17':
        title: 예수가 아기 요셉을 고칩니다
      '18':
        title: 예수가 공사 현장에서 한 남자를 살립니다
      '19':
        title: 열두 살 예수가 성전에서 가르칩니다
  Acts of Paul and Thecla:
    display_name: 바울과 테클라 행전
    author: 저자는 알려져 있지 않습니다. 이 작품은 더 큰 저작인 『바울 행전』의 한 일화입니다. 한 장로가 이 행전을 지었다는 고대의 기록이 있지만, 그것만으로 저자를 확실히 밝혀낼 수는 없습니다.
    audience: 사도들의 설교, 독신 생활, 세례, 순교에 견줄 만한 인내, 그리고 가르치고 증언하는 여성의 권위에 관한 이야기에 관심을 가진 그리스도인들을 대상으로 합니다.
    date: 서기 2세기, 아마도 그 후반부에 작성되었습니다. 『바울 행전』의 일부로도, 독립된 작품으로도 유통되었습니다.
    chapters:
      '1':
        title: 바울이 오네시보로의 집에서 설교합니다
      '2':
        title: 테클라가 귀 기울이며 바울을 사모합니다
      '3':
        title: 타미리스가 총독 앞에서 바울을 고발합니다
      '4':
        title: 테클라가 감옥을 찾아가 바울을 격려합니다
      '5':
        title: 테클라가 화형에서 벗어납니다
      '6':
        title: 바울이 테클라와 함께 금식하며 기도합니다
      '7':
        title: 바울이 테클라를 안티오키아로 보냅니다
      '8':
        title: 트리피나가 맹수들에게서 테클라를 보호합니다
      '9':
        title: 테클라가 웅덩이에서 스스로 세례를 받습니다
      '10':
        title: 테클라가 셀레우키아에서 여성들을 가르칩니다
      '11':
        title: 하늘의 음성이 테클라와 베일을 구합니다
  Gospel of Peter:
    display_name: 베드로 복음서
    author: 저자는 알려져 있지 않습니다. 현존하는 이야기는 베드로의 목소리로 말하며 그의 이름으로 전승되었지만, 역사적 사도 베드로의 저작으로 여겨지지는 않습니다.
    audience: 확장된 수난과 부활 이야기에 관심을 가진 초기 그리스도인들을 대상으로 하며, 아마도 베드로의 권위가 특별히 중시되던 공동체에서 읽혔을 것입니다.
    date: 대체로 서기 2세기의 작품으로 봅니다. 현존하는 주요 그리스어 단편은 훨씬 후대의 사본에 들어 있으며, 아크밈에서 발견되었습니다.
    chapters:
      '1':
        title: 헤롯이 주님을 재판하라고 명령합니다
      '2':
        title: 요셉이 주님의 시신을 장사합니다
      '3':
        title: 무리가 하나님의 아들을 조롱합니다
      '4':
        title: 악행을 저지른 이가 예수의 명예를 지킵니다
      '5':
        title: 한낮에 어둠이 유대를 뒤덮습니다
      '6':
        title: 예수가 요셉의 무덤에 안치됩니다
      '7':
        title: 사람들이 저지른 잘못을 슬퍼합니다
      '8':
        title: 장로들이 예수의 무덤을 지킵니다
      '9':
        title: 새벽에 하늘의 음성이 들립니다
      '10':
        title: 세 사람이 무덤에서 나옵니다
      '11':
        title: 군인들이 빌라도에게 보고합니다
      '12':
        title: 막달라 마리아가 무덤을 찾습니다
      '13':
        title: 여인들이 천사의 소식을 듣고 달아납니다
      '14':
        title: 제자들이 명절이 끝난 뒤 눈물을 흘립니다
  2 Clement:
    display_name: 클레멘스 2서
    author: 저자는 알려져 있지 않습니다. 전통적인 제목과 달리, 이 작품은 로마의 클레멘스가 쓴 두 번째 편지가 아니라 초기 그리스도교의 설교문입니다.
    audience: 회개, 일관된 도덕적 삶, 취약한 이들을 돌보는 일, 그리고 부활과 심판을 바라보며 신실하게 인내하는 삶을 권면받는 그리스도인 회중을 대상으로 합니다.
    date: 대체로 서기 2세기 전반부나 중엽(약 100~160년)의 작품으로 보며, 작성 장소는 확실하지 않습니다.
    chapters:
      '1':
        title: 우리의 심판자이신 예수 그리스도
      '2':
        title: 교회가 믿음으로 충만해집니다
      '3':
        title: 그리스도께서 우리에게 자비를 베푸십니다
      '4':
        title: 행동으로 드러나는 참된 신앙 고백
      '5':
        title: 하나님을 위해 두려움 없이 사십시오
      '6':
        title: 재물보다 하나님을 선택하십시오
      '7':
        title: 온 마음을 다해 경기에 임하십시오
      '8':
        title: 살아 있는 동안 회개하십시오
      '9':
        title: 몸을 성전처럼 지키십시오
      '10':
        title: 덕과 평화를 추구하십시오
      '11':
        title: 깨끗한 마음으로 하나님을 섬기십시오
      '12':
        title: 사랑과 의가 기다리고 있습니다
      '13':
        title: 회개하고 선을 추구하십시오
      '14':
        title: 살아 있는 교회에 속하십시오
      '15':
        title: 힘써 절제하십시오
      '16':
        title: 시간이 남아 있을 때 회개하십시오
      '17':
        title: 약한 이들이 선을 향하도록 도우십시오
      '18':
        title: 의를 얻고자 힘쓰십시오
      '19':
        title: 지금 온 마음으로 회개하십시오
      '20':
        title: 고난 속에서 하나님의 훈련을 신뢰하십시오
  Epistle of Barnabas:
    display_name: 바나바 서신
    author: 저자는 알려져 있지 않습니다. 전통적으로 바울의 동역자 바나바와 관련된 작품으로 여겨졌지만, 현대 학계에서는 그 저자 귀속을 받아들이지 않습니다.
    audience: 이스라엘의 성경을 그리스도론적이고 비유적인 방식으로 해석하여 자신들의 것으로 받아들이는 한편, 자신들의 언약 정체성을 유대교의 관행과 구별하도록 가르침받던 이방인 그리스도인들을 대상으로 합니다.
    date: 일반적으로 예루살렘 성전이 파괴된 서기 70년부터 2세기 초 사이, 흔히 약 80~130년에 작성된 것으로 봅니다.
    chapters:
      '1':
        title: 하나님의 은혜가 사랑받는 공동체를 채웁니다
      '2':
        title: 신자들이 하나님의 참된 명령을 구합니다
      '3':
        title: 금식은 자비와 정의를 실천하는 것입니다
      '4':
        title: 깨어 있는 그리스도인들이 시련을 기다립니다
      '5':
        title: 예수가 죄인들을 위해 고난받으셨습니다
      '6':
        title: 예수가 약속된 나라를 성취하십니다
      '7':
        title: 예수의 상처를 생각하며 하나님께 감사하십시오
      '8':
        title: 암송아지 제사가 예수를 미리 보여 줍니다
      '9':
        title: 마음의 할례는 믿음을 뜻합니다
      '10':
        title: 음식 규정이 영적인 교훈을 가르칩니다
      '11':
        title: 세례와 십자가가 용서를 가져옵니다
      '12':
        title: 모세의 두 팔이 예수님을 가리키다
      '13':
        title: 야곱의 축복이 뒤바뀜을 예고하다
      '14':
        title: 예수님이 마음을 구속하여 하나님께 드리시다
      '15':
        title: 정의가 이루어진 뒤에 안식일의 쉼이 오다
      '16':
        title: 참된 성전은 믿는 이들 안에 있다
      '17':
        title: 이제 구원을 분명히 설명하다
      '18':
        title: 빛의 천사들과 어둠의 통치자
      '19':
        title: 빛의 길이 온전한 헌신을 명하다
      '20':
        title: 어둠의 길이 영원한 멸망으로 이끌다
      '21':
        title: 영광을 얻도록 주님의 명령에 순종하라
  Letters of Ignatius:
    display_name: 이그나티우스의 서신들
    author: 일반적으로 인정되는 중간 판본의 일곱 서신의 저자는 안티오키아의 주교 이그나티우스이며, 후대에 증보된 서신과 이그나티우스의 이름을 빌린 서신은 이 모음집에 포함되지 않습니다.
    audience: 이그나티우스가 순교를 향해 가던 여정 중에 에베소, 마그네시아, 트랄레스, 로마, 필라델피아, 서머나의 그리스도인 공동체와 폴리카르포스에게 보낸 서신입니다.
    date: 대체로 서기 2세기 초, 흔히 약 105~117년으로 추정하지만, 이그나티우스의 여정에 관한 정확한 연대는 여전히 논의되고 있습니다.
    chapters:
      '1':
        title: 이그나티우스가 에베소 교회에 인사하다
      '2':
        title: 신자들이 갇힌 이그나티우스를 돕다
      '3':
        title: 하나 되어 기도하며 주교를 존중하라
      '4':
        title: 이그나티우스가 겸손히 말하다
      '5':
        title: 예수님을 사랑하여 하나 되다
      '6':
        title: 주교가 신자들을 기도로 하나 되게 하다
      '7':
        title: 조용히 훌륭하게 이끄는 주교를 존중하라
      '8':
        title: 거짓 교사들의 영향을 경계하라
      '9':
        title: 에베소 신자들이 이그나티우스에게 헌신하다
      '10':
        title: 악한 가르침을 거부하고 굳게 서라
      '11':
        title: 모든 사람을 위하여 끊임없이 기도하라
      '12':
        title: 모든 결박보다 높으신 그리스도
      '13':
        title: 이그나티우스가 사형수로서 편지를 쓰다
      '14':
        title: 평화가 사탄의 권세와 계략을 꺾다
      '15':
        title: 믿음이 선함과 사랑으로 이끌다
      '16':
        title: 침묵으로 진리를 살아 내다
      '17':
        title: 가정을 파괴하는 자들은 상속받지 못한다
      '18':
        title: 하나님을 아는 지식을 지혜롭게 받아들이라
      '19':
        title: 십자가를 위하여 자신을 아무것도 아닌 것으로 여기다
      '20':
        title: 마리아, 별, 그리고 그리스도의 전복
      '21':
        title: 이그나티우스가 다시 쓰기를 바라다
      '22':
        title: 이그나티우스가 독자들을 위하여 기도하다
      '23':
        title: 마그네시아 교회가 은혜로 복을 받다
      '24':
        title: 이그나티우스가 하나 됨을 위하여 기도하다
      '25':
        title: 이그나티우스가 주교로 인해 하나님께 감사하다
      '26':
        title: 젊은 주교를 존중하라
      '27':
        title: 참된 그리스도인으로 살아가라
      '28':
        title: 믿음으로 영원한 표지를 택하라
      '29':
        title: 이그나티우스가 교회의 하나 됨을 받아들이다
      '30':
        title: 신자들이 주교 아래 함께 모이다
      '31':
        title: 예수님이 은혜를 통하여 나타나시다
      '32':
        title: 부활하신 그리스도에 대한 소망이 지속되다
      '33':
        title: 묵은 누룩을 버리라
      '34':
        title: 그리스도의 터 위에 굳게 서라
      '35':
        title: 겸손이 믿음 안에서 기쁨을 가져오다
      '36':
        title: 믿음 안에서 주교와 하나 되라
      '37':
        title: 기도가 교회에 새 힘을 주다
      '38':
        title: 경건한 화합 속에서 교회들에 인사하라
      '39':
        title: 예수님의 고난을 통하여 평화를 얻다
      '40':
        title: 생각과 인내에 흠이 없으라
      '41':
        title: 신자들이 주교와 그리스도께 순종하다
      '42':
        title: 지도자들을 예수 그리스도처럼 존중하라
