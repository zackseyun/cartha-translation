books:
  Genesis:
    display_name: 창세기
    author: 저자는 알려져 있지 않으며, 전통적으로 모세가 쓴 것으로 여겨집니다. 현대 학계에서는 여러 자료가 오랜 기간에 걸쳐 형성된 뒤 후대에 함께 편집되었다고 봅니다.
    audience: 언약으로 정체성을 이루어 가는 이스라엘을 위한 책으로, 하나님의 창조와 선택과 약속 안에 이 백성의 기원 이야기를 뿌리내리게 합니다.
    date: 여러 세기에 걸쳐 작성되었으며, 바빌론 유배기 또는 그 이후인 기원전 6~5세기경에 오늘날 전해지는 형태를 갖춘 것으로 보입니다.
    summary: 창세기는 창조, 인류의 반역과 흩어짐, 그리고 이스라엘을 향한 하나님의 언약의 약속이 시작되는 통로가 된 아브라함과 이삭과 야곱과 요셉의 가족 이야기를 전합니다.
    chapters:
      '1':
        title: 하나님께서 하늘과 땅을 창조하시다
      '2':
        title: 하나님께서 남자와 여자를 지으시다
      '3':
        title: 인류가 타락하여 에덴에서 쫓겨나다
      '4':
        title: 가인이 동생 아벨을 죽이다
      '5':
        title: 아담에서 노아까지의 계보가 기록되다
      '6':
        title: 하나님께서 홍수로 죄를 심판하시다
      '7':
        title: 홍수가 온 땅을 뒤덮다
      '8':
        title: 노아가 방주에서 나와 하나님께 예배드리다
      '9':
        title: 홍수 이후 노아의 가족
      '10':
        title: 노아의 후손들이 온 땅으로 퍼지다
      '11':
        title: 탑에서 언어가 뒤섞여 사람들이 흩어지다
      '12':
        title: 아브람이 순종하여 가나안으로 떠나다
      '13':
        title: 부유해진 아브람이 돌아와 기도하다
      '14':
        title: 아브람이 침략자들에게서 롯을 구하다
      '15':
        title: 하나님께서 아브람에게 후손을 약속하시다
      '16':
        title: 하갈이 도망하여 광야의 샘에 이르다
      '17':
        title: 아브라함이 할례를 받고 하나님께서 언약을 새롭게 하시다
      '18':
        title: 하나님께서 아브라함에게 아들을 약속하시다
      '19':
        title: 롯이 불타는 성읍들에서 피하다
      '20':
        title: 경고를 받은 아비멜렉이 사라를 돌려보내다
      '21':
        title: 사라가 아브라함에게 이삭을 낳다
      '22':
        title: 아브라함이 모리아에서 이삭을 제물로 바치려 하다
      '23':
        title: 사라가 죽고 아브라함이 땅을 사다
      '24':
        title: 종이 이삭의 아내가 될 리브가를 찾다
      '25':
        title: 아브라함의 후손과 죽음이 기록되다
      '26':
        title: 이삭이 그랄에 머물며 보호받다
      '27':
        title: 야곱이 이삭을 속여 축복을 받다
      '28':
        title: 야곱이 천사들이 오르내리는 층계를 꿈꾸다
      '29':
        title: 야곱이 라헬을 사랑하고 레아를 맞다
      '30':
        title: 야곱이 자비를 입어 번성하다
      '31':
        title: 야곱이 라반의 분노를 두려워하다
      '32':
        title: 야곱이 하나님의 천사와 씨름하다
      '33':
        title: 야곱이 에서와 평화롭게 만나다
      '34':
        title: 세겜이 디나를 잔혹하게 욕보이다
      '35':
        title: 야곱이 벧엘의 제단으로 돌아가다
      '36':
        title: 세일 땅에 정착한 에서의 후손들
      '37':
        title: 요셉의 형들이 그를 헐값에 팔다
      '38':
        title: 다말이 남몰래 유다의 아들들을 낳다
      '39':
        title: 요셉이 보디발의 집에서 형통하다
      '40':
        title: 바로의 신하들이 꿈을 꾸고 두려워하다
      '41':
        title: 요셉이 바로의 꿈을 해석하다
      '42':
        title: 야곱이 곡식을 구하러 아들들을 보내다
      '43':
        title: 베냐민이 형들과 함께 이집트로 가다
      '44':
        title: 유다가 베냐민의 목숨을 살려 달라고 간청하다
      '45':
        title: 요셉이 형제들과 다시 만나다
      '46':
        title: 이스라엘이 무사히 고센으로 가다
      '47':
        title: 요셉이 가족을 먹여 살리다
      '48':
        title: 야곱이 지혜롭게 요셉의 아들들을 축복하다
      '49':
        title: 야곱이 아들들의 앞날을 예언하다
      '50':
        title: 요셉이 야곱의 마지막 소원을 지키다
  Exodus:
    display_name: 출애굽기
    author: 저자는 알려져 있지 않으며, 전통적으로 모세가 쓴 것으로 여겨집니다. 현대 학계에서는 여러 자료가 오랜 기간에 걸쳐 형성된 뒤 후대에 함께 편집되었다고 봅니다.
    audience: 해방되어 하나님과 언약을 맺은 백성 이스라엘을 위한 책으로, 하나님의 율법 아래에서 주님의 나라로 산다는 것이 무엇인지 가르칩니다.
    date: 여러 세기에 걸쳐 작성되었으며, 기원전 6~5세기경에 오늘날 전해지는 형태를 갖춘 것으로 보입니다.
    chapters:
      '1':
        title: 하나님께서 이스라엘의 번성을 돌보시다
      '2':
        title: 모세가 바로의 손에서 구출되다
      '3':
        title: 모세가 하나님의 부르심을 듣다
      '4':
        title: 모세가 하나님의 능력을 마주하다
      '5':
        title: 바로가 마음을 완고하게 하다
      '6':
        title: 주님께서 구원을 약속하시다
      '7':
        title: 아론과 모세가 바로에게 맞서다
      '8':
        title: 재앙들이 이집트를 거세게 치다
      '9':
        title: 하나님께서 우박으로 이집트를 치시다
      '10':
        title: 바로가 다시 거부하다
      '11':
        title: 마지막 재앙이 다가오다
      '12':
        title: 이스라엘이 죽음을 지나가다
      '13':
        title: 주님께서 이스라엘의 길을 인도하시다
      '14':
        title: 하나님께서 홍해를 가르시다
      '15':
        title: 모세와 이스라엘이 찬양의 노래를 부르다
      '16':
        title: 주님께서 날마다 만나를 내려 주시다
      '17':
        title: 아말렉이 이스라엘의 진영을 공격하다
      '18':
        title: 이드로가 모세에게 지혜롭게 조언하다
