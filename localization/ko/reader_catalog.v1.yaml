    display_name: 로마서
    author: 바울이 서기관 더디오와 함께 썼습니다.
    audience: 로마의 그리스도인들, 곧 율법과 정체성 문제로 긴장 관계에 있던 유대인 신자들과 이방인 신자들을 대상으로 합니다.
    date: 서기 약 56~58년, 고린도에서 기록되었습니다.
    chapters:
      '1':
        title: 바울이 예수님을 통해 나타난 의를 선포합니다
      '2':
        title: 심판에는 차별이 없습니다
      '3':
        title: 모든 사람이 죄의 책임 아래 있습니다
      '4':
        title: 아브라함이 오직 믿음으로 의롭다고 인정받습니다
      '5':
        title: 그리스도의 죽음을 통해 얻는 의
      '6':
        title: 죄가 아니라 하나님을 위해 사십시오
      '7':
        title: 신자들이 죄와 씨름합니다
      '8':
        title: 아무것도 우리를 그리스도에게서 끊을 수 없습니다
      '9':
        title: 이스라엘을 향한 자비와 진노
      '10':
        title: 모든 사람에게 가까이 있는 구원
      '11':
        title: 은혜로 부르심받은 이방인들
      '12':
        title: 삶을 산 제물로 드리십시오
      '13':
        title: 권위에 복종하고 사랑하십시오
      '14':
        title: 믿음이 약한 이들을 받아들이십시오
      '15':
        title: 유대인과 이방인이 하나가 되십시오
      '16':
        title: 인사와 경고
  1 Corinthians:
    display_name: 고린도전서
    author: 바울, 소스데네와 함께.
    audience: 분쟁이 잦았던 고린도의 그리스도인 공동체.
    date: 서기 약 53~55년, 에베소에서 기록.
    chapters:
      '1':
        title: 모두에게 베푸시는 하나님의 신실하고 풍성한 은혜
      '2':
        title: 하나님의 영이 계시하시는 지혜
      '3':
        title: 하나님의 성전인 고린도 교회를 향한 바울의 경고
      '4':
        title: 교만보다 중요한 신실함
      '5':
        title: 교회의 징계를 명하는 바울
      '6':
        title: 교회 안에서 분쟁을 해결하십시오
      '7':
        title: 결혼을 존중하라고 가르치는 바울
      '8':
        title: 사랑은 개인의 자유보다 앞섭니다
      '9':
        title: 대가 없이 사도직을 변호하는 바울
      '10':
        title: 하나님의 백성을 위한 이스라엘의 경고
      '11':
        title: 예배의 하나 됨으로 그리스도를 높이십시오
      '12':
        title: 성령의 은사는 교회의 하나 됨을 세웁니다
      '13':
        title: 사랑은 결코 포기하지 않습니다
      '14':
        title: 인상을 남기기보다 사랑을 추구하라고 권하는 바울
      '15':
        title: 그리스도께서 살아나시고 죽음은 무너집니다
      '16':
        title: 헌금과 여행 계획
  2 Corinthians:
    display_name: 고린도후서
    author: 바울, 디모데와 함께.
    audience: 고통스러운 갈등을 겪은 뒤의 고린도 공동체.
    date: 서기 약 55~56년.
    chapters:
      '1':
        title: 고난 중에 주시는 하나님의 위로
      '2':
        title: 사랑하고 용서하십시오
      '3':
        title: 변화된 삶으로 확증되는 사역
      '4':
        title: 그리스도의 영광을 선포하십시오
      '5':
        title: 그리스도의 사랑이 이끄는 사역
      '6':
        title: 하나님을 위해 고난을 견디십시오
      '7':
        title: 경외함으로 거룩함을 추구하십시오
      '8':
        title: 마케도니아인들이 받은 은혜가 나눔을 북돋습니다
      '9':
        title: 성도들을 위해 기쁘게 베푸십시오
      '10':
        title: 그리스도의 온유함으로 호소하는 바울
      '11':
        title: 신실한 삶을 위한 질투
      '12':
        title: 약함과 은혜를 자랑하십시오
      '13':
        title: 죄가 있는지 자신을 살피십시오
  Galatians:
    display_name: 갈라디아서
    author: 바울.
    audience: 할례와 토라 준수를 받아들이라는 압력을 받던 갈라디아(아나톨리아 중부)의 그리스도인 공동체들.
    date: 서기 약 48~55년(논란 있음).
    chapters:
      '1':
        title: 자신이 전한 복음을 변호하는 바울
      '2':
        title: 베드로의 잘못을 지적하는 바울
      '3':
        title: 아브라함의 믿음으로 의롭다 하심을 받습니다
      '4':
        title: 그리스도께서 율법에서 우리를 해방하십니다
      '5':
        title: 율법이 아니라 믿음으로 사십시오
      '6':
        title: 서로의 짐을 지십시오
  Ephesians:
    display_name: 에베소서
    author: 바울, 또는 바울의 이름으로 쓴 가까운 제자(논란 있음).
    audience: 아시아 지역의 그리스도인 일반 독자층. 가장 이른 사본들에는 지명인 "에베소"가 없다.
    date: 바울이 썼다면 서기 60년대, 가명 저작이라면 서기 80~90년대.
    chapters:
      '1':
        title: 믿는 이들 안에 인치신 하나님의 은혜
      '2':
        title: 그리스도께서 모두에게 평화를 주십니다
      '3':
        title: 복음을 통해 드러난 신비
      '4':
        title: 그리스도의 몸이 하나 되기를 구하는 기도
      '5':
        title: 하나님을 본받고 지혜롭게 살아가십시오
      '6':
        title: 자녀들은 부모에게 순종하고 공경하십시오
  Philippians:
    display_name: 빌립보서
    author: 바울, 디모데와 함께.
    audience: 마케도니아의 로마 식민 도시 빌립보에 있던 그리스도인 공동체.
    date: 서기 약 60~62년, 감옥에서 기록.
    chapters:
      '1':
        title: 빌립보 교회를 위해 기도하는 바울
      '2':
        title: 낮아지시고 높임받으신 예수님
      '3':
        title: 그리스도를 아는 기쁨
      '4':
        title: 기뻐하며 굳게 서십시오
  Colossians:
    display_name: 골로새서
    author: 바울, 디모데와 함께 — 또는 바울의 이름으로 쓴 가까운 제자(논란 있음).
    audience: 리쿠스 계곡의 골로새에 살면서 혼합주의적 가르침에 직면한 그리스도인들.
    date: 바울이 썼다면 서기 약 60~62년, 가명 저작이라면 그보다 뒤.
    chapters:
      '1':
        title: 골로새 교회의 믿음을 위해 기도하는 바울
      '2':
        title: 그리스도 안에 굳게 서라고 격려하는 바울
      '3':
        title: 죄를 벗어나 사랑으로 사십시오
      '4':
        title: 감옥에서도 기도하고 격려하는 바울
  1 Thessalonians:
    display_name: 데살로니가전서
    author: 바울, 실루아노, 디모데와 함께.
    audience: 박해를 겪던 데살로니가의 젊은 그리스도인 공동체.
    date: 서기 약 50~51년 — 현존하는 바울 서신 가운데 가장 이른 문서일 가능성이 큼.
    chapters:
      '1':
        title: 은혜와 평화, 믿음과 사랑과 소망
      '2':
        title: 순수한 동기로 담대히 복음을 전하십시오
      '3':
        title: 고난 중에 격려하는 디모데
      '4':
        title: 거룩한 삶을 권하는 바울
      '5':
        title: 깨어서 구원을 기다리십시오
  2 Thessalonians:
    display_name: 데살로니가후서
    author: 바울(논란 있음. 일부 학자들은 가명 저작으로 봄).
    audience: 종말에 관한 혼란을 다루는 데살로니가 공동체.
    date: 바울이 썼다면 서기 약 51년.
    chapters:
      '1':
        title: 박해 속에서도 신실한 이들에게 갚아 주시는 하나님
      '2':
        title: 그리스도께서 오시기 전에 반역이 일어납니다
      '3':
        title: 교회의 성장을 위해 기도하는 바울
  1 Timothy:
    display_name: 디모데전서
    author: 바울, 또는 바울의 이름으로 쓴 제자(목회서신들은 가명 저작이라는 견해가 널리 받아들여짐).
    audience: 에베소에서 바울의 대리자인 디모데; 후대 교회의 질서를 위한 지침서.
    date: 바울이 썼다면 서기 60년대 중반, 가명 저작이라면 서기 약 90~110년.
    chapters:
      '1':
        title: 디모데에게 남아 있으라고 권하는 바울
      '2':
        title: 통치자들을 위해 기도하고 평화롭게 사십시오
      '3':
        title: 교회 지도자에게 필요한 자질
      '4':
        title: 거짓 교사와 신화를 물리치십시오
      '5':
        title: 과부와 장로를 신실하게 존중하십시오
      '6':
        title: 재물에 관해 디모데에게 조언하는 바울
  2 Timothy:
    display_name: 디모데후서
    author: 바울, 또는 바울의 이름으로 쓴 제자.
    audience: 디모데 — 감옥에 갇힌 바울의 작별 인사 형식으로 구성됨.
    date: 바울이 썼다면 서기 60년대 중반, 가명 저작이라면 서기 약 90~110년.
    chapters:
      '1':
        title: 디모데여, 은혜 안에 굳게 서십시오
      '2':
        title: 그리스도를 위해 고난을 견디십시오
      '3':
        title: 거짓 교사들을 피하라는 경고
      '4':
        title: 모든 사람에게 신실하게 말씀을 전하십시오
  Titus:
    display_name: 디도서
    author: 바울, 또는 바울의 이름으로 쓴 제자.
    audience: 크레타에서 바울의 대리자인 디도.
    date: 바울이 썼다면 서기 60년대 중반, 가명 저작이라면 서기 약 90~110년.
    chapters:
      '1':
        title: 크레타의 디도에게 지침을 주는 바울
      '2':
        title: 모든 세대에게 은혜로운 삶을 가르치십시오
      '3':
        title: 그리스도를 기다리며 겸손하게 사십시오
  Philemon:
    display_name: 빌레몬서
    author: 바울, 디모데와 함께.
    audience: 그리스도인이자 노예 소유주인 빌레몬에게, 달아난 그의 노예 오네시모에 관해 쓴 편지.
    date: 서기 약 60~62년.
    chapters:
      '1':
        title: 오네시모의 자유를 간청하는 바울
  Hebrews:
    display_name: 히브리서
    author: 익명. 전통은 바울, 아볼로, 바나바, 브리스길라 등을 저자로 제안했으나, 어느 견해도 합의를 얻지 못했다.
    audience: 그리스도에 대한 신앙 고백에서 물러나려는 유혹을 받던 그리스어권 유대계 그리스도인들.
    date: 서기 약 60~95년.
    chapters:
      '1':
        title: 아들을 통해 말씀하시는 하나님
      '2':
        title: 고난을 통해 구원하시는 예수님
      '3':
        title: 신실하신 예수님을 바라보십시오
      '4':
        title: 하나님께서 약속하신 안식에 들어가십시오
      '5':
        title: 완전한 제사를 드리신 그리스도
      '6':
        title: 영적 성숙을 향해 나아가십시오
      '7':
        title: 멜기세덱의 계열을 따르는 영원한 제사장 예수님
      '8':
        title: 예수님의 피로 세우신 새 언약
      '9':
        title: 참된 하늘 성소에 들어가신 예수님
      '10':
        title: 그리스도의 피를 힘입어 가까이 나아가십시오
      '11':
        title: 조상들의 믿음은 끝까지 이어집니다
      '12':
        title: 예수님과 함께 고난을 견디십시오
      '13':
        title: 사랑과 신뢰로 살아가십시오
  James:
    display_name: 야고보서
    author: 전통적으로 예수의 형제 야고보로 여겨지지만, 현대 학계에서는 실제 저작인지 가명 저작인지 견해가 나뉩니다.
    audience: 디아스포라의 유대계 그리스도인 공동체입니다.
    date: 실제 저작이라면 서기 50~60년대경, 가명 저작이라면 서기 1세기 후반경입니다.
    chapters:
      '1':
        title: 시련으로 검증된 믿음은 견디어 냅니다
      '2':
        title: 행함이 없는 믿음은 죽은 것입니다
      '3':
        title: 혀를 다스리고 지혜롭게 말하십시오
      '4':
        title: 다툼은 이기심에서 비롯됩니다
      '5':
        title: 부유한 압제자들의 심판이 다가옵니다
  1 Peter:
    display_name: 베드로전서
    author: 전통적으로 사도 베드로가 실루아노를 필사자로 두고 쓴 것으로 여겨지지만, 일부 학자들은 가명 저작으로 봅니다.
    audience: 사회적 적대에 시달리던 로마령 소아시아의 그리스도인들입니다.
    date: 베드로의 저작이라면 서기 60년대경, 가명 저작이라면 서기 70~90년대경입니다.
    chapters:
      '1':
        title: 하늘의 유산에 소망을 두십시오
      '2':
        title: 신자들은 산 돌 위에 세워집니다
      '3':
        title: 아내들은 삶으로 그리스도를 높이십시오
      '4':
        title: 선을 행하다 받는 고난을 견디십시오
      '5':
        title: 장로들은 믿음의 본이 되어 돌보십시오
  2 Peter:
    display_name: 베드로후서
    author: 전통적으로 베드로의 저작으로 여겨지지만, 현대 학계에서는 가명 저작이라는 견해가 널리 받아들여집니다.
    audience: 그리스도의 재림을 부인하며 조롱하는 이들과 맞서던 그리스도인들입니다.
    date: 서기 2세기 초경입니다.
    chapters:
      '1':
        title: 베드로가 영적 성장을 가르칩니다
      '2':
        title: 거짓 교사들에게 신속한 심판이 닥칩니다
      '3':
        title: 베드로가 마지막 심판을 경고합니다
  1 John:
    display_name: 요한일서
    author: 저자는 알려져 있지 않으며, 전통적으로 사도 요한 또는 요한 공동체의 장로로 여겨집니다.
    audience: 분열을 겪은 뒤 누가 공동체에 속하는지를 규정하던 요한 공동체입니다.
    date: 서기 90~110년경입니다.
    chapters:
      '1':
        title: 빛이 참된 교제를 드러냅니다
      '2':
        title: 사랑은 하나님의 계명을 지킵니다
      '3':
        title: 하나님에게서 난 사람은 죄를 이깁니다
      '4':
        title: 참된 사랑은 하나님에게서 옵니다
      '5':
        title: 예수님을 믿는 사람에게 영원한 생명이 있습니다
  2 John:
    display_name: 요한이서
    author: “장로”입니다.
    audience: 거짓 교사들을 경계하라는 권고를 받은 특정 그리스도인 공동체(“택하심을 받은 부녀”)입니다.
    date: 서기 90~110년경입니다.
    chapters:
      '1':
        title: 장로가 거짓 교사들을 경고합니다
  3 John:
    display_name: 요한삼서
    author: “장로”입니다.
    audience: 순회 선교사들을 맞아들이던 개인 지도자 가이오입니다.
    date: 서기 90~110년경입니다.
    chapters:
      '1':
        title: 장로가 가이오의 형통을 위해 기도합니다
  Jude:
    display_name: 유다서
    author: 전통적으로 야고보와 예수의 형제 유다로 여겨집니다.
    audience: 방종을 가르치는 교사들이 침투하고 있던 그리스도인 공동체들입니다.
    date: 서기 60~90년대경입니다.
    chapters:
      '1':
        title: 유다가 경건하지 않은 침입자들을 경고합니다
  Revelation:
    display_name: 요한계시록
    author: 밧모섬의 요한입니다(문체상 요한복음의 저자와 구별됩니다).
    audience: 제국의 압력 아래 있던 로마령 소아시아의 일곱 그리스도인 공동체입니다.
    date: 전통적으로 도미티아누스 황제 치세인 서기 90년대경입니다.
    chapters:
      '1':
        title: 하나님께서 요한에게 환상을 보여 주십니다
      '2':
        title: 예수님께서 일곱 교회에 말씀하십니다
      '3':
        title: 예수님께서 라오디게아에 회개를 촉구하십니다
      '4':
        title: 하늘의 보좌가 영광으로 빛납니다
      '5':
        title: 어린양이 두루마리를 받아 구속하십니다
      '6':
        title: 네 기사가 큰 재앙을 가져옵니다
      '7':
        title: 인침을 받은 종들이 영원한 찬송을 부릅니다
      '8':
        title: 일곱 나팔이 무서운 심판을 알립니다
      '9':
        title: 메뚜기들이 땅의 죄인들을 괴롭힙니다
      '10':
        title: 힘센 천사가 마지막 때를 두고 맹세합니다
      '11':
        title: 두 증인이 예언한 뒤 살아납니다
      '12':
        title: 여인이 통치할 운명의 아들을 낳습니다
      '13':
        title: 짐승이 바다에서 올라옵니다
      '14':
        title: 어린양이 신실한 이들을 자신에게 모으십니다
      '15':
        title: 요한이 하늘의 진노를 봅니다
      '16':
        title: 천사들이 진노의 대접을 쏟습니다
      '17':
        title: 바빌론의 심판과 하나님의 승리
      '18':
        title: 하늘이 바빌론의 멸망을 기뻐합니다
      '19':
        title: 하늘이 어린양의 혼인 잔치를 기뻐합니다
      '20':
        title: 요한이 마지막 심판을 봅니다
      '21':
        title: 모든 것이 새롭게 됩니다
      '22':
        title: 예수님께서 곧 오십니다
  Tobit:
    display_name: 토빗기
    author: 저자는 알려져 있지 않습니다.
    audience: 외세의 통치 아래서 경건, 혼인, 섭리를 따라 살아가던 디아스포라 유대인들입니다.
    date: 기원전 225~175년경이며, 아람어로 저술되었고 쿰란에서는 히브리어 판본도 확인되었습니다.
    chapters:
      '1':
        title: 토빗이 하나님을 충실히 기억합니다
      '2':
        title: 토빗이 멸시받던 이웃을 묻어 줍니다
      '3':
        title: 토빗이 울며 죽기를 기도합니다
      '4':
        title: 토빗이 아들에게 의롭게 살도록 가르칩니다
      '5':
        title: 토비야가 인도를 받아 길을 떠납니다
      '6':
        title: 토비야가 치유에 쓸 물고기를 잡습니다
      '7':
        title: 토비야가 엑바타나에서 사라와 혼인합니다
      '8':
        title: 토비야가 사라와 혼인하고 기도합니다
      '9':
        title: 가바엘이 토빗의 돈을 돌려줍니다
      '10':
        title: 토비야가 무사히 집으로 돌아옵니다
      '11':
        title: 토빗이 아들을 통해 시력을 되찾습니다
      '12':
        title: 라파엘이 자신의 참된 정체를 밝힙니다
      '13':
        title: 토빗이 예루살렘을 위해 기도합니다
      '14':
        title: 토빗이 이스라엘의 미래를 내다봅니다
  Judith:
    display_name: 유딧기
    author: 저자는 알려져 있지 않습니다.
    audience: 외세의 위협을 받던 유대인들을 위한, 경건하고 굴하지 않는 저항의 이야기입니다.
    date: 기원전 150~100년경입니다.
    chapters:
      '1':
        title: 느부갓네살이 아르박삿을 공격합니다
      '2':
        title: 홀로페르네스가 서쪽으로 진군합니다
      '3':
        title: 해안 지역 민족들이 재물을 바치며 항복합니다
      '4':
        title: 이스라엘이 금식하며 도움을 구합니다
      '5':
        title: 아키오르가 이스라엘의 역사를 설명합니다
      '6':
        title: 아키오르가 홀로페르네스에 관해 경고합니다
      '7':
        title: 베툴리아의 물이 바닥납니다
      '8':
        title: 유딧이 하나님께서 구원하실 것이라고 약속합니다
      '9':
        title: 유딧이 하나님의 힘을 구하며 기도합니다
      '10':
        title: 유딧이 아시리아 진영에 들어갑니다
      '11':
        title: 홀로페르네스가 유딧을 안으로 불러들입니다
      '12':
        title: 유딧이 하나님의 인도를 구합니다
      '13':
        title: 유딧이 홀로페르네스의 목을 벱니다
      '14':
        title: 이스라엘이 유딧의 승리를 기뻐합니다
      '15':
        title: 이스라엘이 아시리아의 전리품을 거둡니다
      '16':
        title: 유딧이 찬양의 노래를 이끕니다
  Greek Additions to Esther:
    display_name: 에스더기 그리스어 추가 부분
    author: 저자는 알려져 있지 않으며, 에스더기의 그리스어 번역본에 덧붙은 보충 자료입니다.
    audience: 명시적인 기도와 하나님에 대한 언급이 담긴 에스더 이야기를 원하던 그리스어권 유대인들입니다.
    date: 기원전 2~1세기경입니다.
    chapters:
      '1':
        title: 모르드개가 꿈을 꾸고 왕에게 경고합니다
      '2':
        title: 왕이 멸망을 명하는 조서를 씁니다
      '3':
        title: 모르드개와 에스더가 도움을 구하며 기도합니다
      '4':
        title: 에스더가 왕 앞에 나아갑니다
      '5':
        title: 왕이 하만을 벌하고 유대인들을 구합니다
      '6':
        title: 모르드개가 꿈을 되새기며 예언합니다
  Wisdom of Solomon:
    display_name: 솔로몬의 지혜서
    author: 저자는 알려져 있지 않으며, 솔로몬의 이름을 빌린 가명 저작입니다. 헬레니즘 시대의 유대인 저자가 그리스어로 썼으며, 알렉산드리아에서 저술했을 가능성이 큽니다.
    audience: 그리스 철학과 대화하며 이교와 배교의 대안에 맞서 이스라엘의 지혜를 옹호하던 헬레니즘 시대의 유대인들입니다.
    date: 기원전 50년~서기 50년경입니다.
    chapters:
      '1':
        title: 하나님께서 찾는 이들에게 지혜를 드러내십니다
      '2':
        title: 악인들은 삶의 참된 기쁨을 거부합니다
      '3':
        title: 의로운 이들의 영혼은 평안히 쉽니다
      '4':
        title: 덕은 존중받고 경건하지 않은 이들은 수치를 당합니다
      '5':
        title: 의인들이 악을 담대히 드러냅니다
      '6':
        title: 지혜가 참된 왕권으로 이끕니다
      '7':
        title: 기도는 지혜와 깨달음을 가져다줍니다
      '8':
        title: 지혜는 통치자들을 이끌고 강하게 합니다
      '9':
        title: 왕이 하느님의 지혜를 구해 기도합니다
      '10':
        title: 지혜는 의인들을 보호하고 구해 냅니다
      '11':
        title: 하느님은 징계를 통해 자비를 베푸십니다
      '12':
        title: 우상을 조롱하면 헛된 희망만 남습니다
      '13':
        title: 사람들이 생명 없는 우상을 숭배합니다
      '14':
        title: 하느님은 배들이 바다를 건너도록 이끄십니다
      '15':
        title: 하느님의 자비는 참된 예배로 이끕니다
      '16':
        title: 하느님은 억압자들을 심판하시면서 필요한 것을 공급하십니다
      '17':
        title: 두려운 밤의 품에 갇힙니다
      '18':
        title: 하느님은 빛으로 이끄십니다
      '19':
        title: 구름이 갈라져 이스라엘의 길을 엽니다
  Sirach:
    display_name: 집회서
    author: 예루살렘 출신의 예수아 벤 엘아자르 벤 시라가 지었으며, 그의 손자가 그리스어로 번역했습니다.
    audience: 헬레니즘 시대 예루살렘에서 지혜 교육을 받던 젊은 유대인 남성들을 대상으로 했습니다.
    date: 히브리어 원문은 기원전 약 195~175년, 그리스어 번역은 기원전 약 132년입니다.
    chapters:
      '1':
        title: 하느님은 지혜를 헤아려 나누어 주십니다
      '2':
        title: 시련은 충실한 종들을 입증합니다
      '3':
        title: 부모를 공경하면 오래 삽니다
      '4':
        title: 억눌린 이들을 구하고 지혜를 찾으십시오
      '5':
        title: 재물이 아니라 하느님을 신뢰하십시오
      '6':
        title: 농부처럼 지혜를 찾으십시오
      '7':
        title: 마음 깊이 겸손을 간직하십시오
      '8':
        title: 어리석은 자들을 피하고 원로들을 공경하십시오
      '9':
        title: 질투와 욕정을 경계하십시오
      '10':
        title: 지혜로운 지도력은 질서를 세웁니다
      '11':
        title: 지혜는 가난한 이를 높입니다
      '12':
        title: 죄인이 아니라 의인을 도우십시오
      '13':
        title: 역청을 만지면 몸에 달라붙습니다
      '14':
        title: 지혜는 영원한 복을 가져다줍니다
      '15':
        title: 지혜는 자신을 찾는 이들을 맞아 줍니다
      '16':
        title: 충실한 한 사람이 도시를 지탱합니다
      '17':
        title: 인간은 하느님의 모습대로 지음받았습니다
      '18':
        title: 선행을 망치지 마십시오
      '19':
        title: 쾌락을 좇는 사람들은 파멸합니다
      '20':
        title: 말할 때 알맞은 때를 신중히 가리십시오
      '21':
        title: 기도하고 죄를 피하며 지혜를 찾으십시오
      '22':
        title: 게으름은 수치와 슬픔을 가져옵니다
      '23':
        title: 내면의 절제와 지혜를 구해 기도하십시오
      '24':
        title: 지혜가 자신을 찬양하며 말합니다
      '25':
        title: 지혜는 하느님과 사람들을 공경합니다
      '26':
        title: 아내는 기쁨이나 고통을 가져다줍니다
      '27':
        title: 의로움을 추구하고 자랑스럽게 입으십시오
      '28':
        title: 죄를 용서하면 자비를 얻습니다
      '29':
        title: 이웃을 용서하면 자비를 얻습니다
      '30':
        title: 아들들을 명예롭게 기르십시오
      '31':
        title: 재물은 근심과 고통을 가져옵니다
      '32':
        title: 겸손히 다른 이들을 먼저 섬기십시오
      '33':
        title: 주님은 자신을 경외하는 이들을 지켜 주십니다
      '34':
        title: 꿈은 분명하지 않으면 사람을 그릇되게 이끌 수 있습니다
      '35':
        title: 지도자들은 겸손하고 지혜로워야 합니다
      '36':
        title: 주님을 경외함으로 구원을 얻습니다
      '37':
        title: 친구와 조언을 지혜롭게 선택하십시오
      '38':
        title: 의사들을 존중하고 치유를 위해 기도하십시오
      '39':
        title: 시라는 율법을 충실히 지키는 이를 칭송합니다
      '40':
        title: 삶의 짐과 복을 말합니다
      '41':
        title: 죽음은 마지막 안식을 가져옵니다
      '42':
        title: 어렵지만 꼭 필요한 문제들을 다루십시오
      '43':
        title: 놀라운 하늘은 하느님을 찬양하게 합니다
      '44':
        title: 조상들은 믿음의 인도를 받았습니다
      '45':
        title: 모세가 누구보다도 큰 영예를 받습니다
      '46':
        title: 여호수아가 하느님의 백성을 위해 싸웁니다
      '47':
        title: 다윗이 칭송받고 나탄과 마주합니다
      '48':
        title: 엘리야가 불타는 말로 예언합니다
      '49':
        title: 요시야가 개혁으로 영예를 받습니다
      '50':
        title: 시몬이 자기 백성을 축복합니다
      '51':
        title: 저는 제 하느님을 찬양합니다
  Baruch:
    display_name: 바룩서
    author: 저자는 알려져 있지 않으며, 예레미야의 서기관 바룩의 이름을 빌려 기록된 것으로 여겨집니다.
    audience: 유배와 회개와 지혜를 되새기던 디아스포라 유대인들을 대상으로 했습니다.
    date: 기원전 2세기경입니다.
    chapters:
      '1':
        title: 바룩이 강가에서 참회의 글을 읽습니다
      '2':
        title: 주님은 모세를 통해 하신 경고를 실행하십니다
      '3':
        title: 백성이 부르짖고 죄를 고백하며 돌아섭니다
      '4':
        title: 하느님의 계명은 생명을 줍니다
      '5':
        title: 예루살렘아, 영원한 영광을 입으십시오
  1 Maccabees:
    display_name: 마카베오기 상권
    author: 저자는 알려져 있지 않습니다. 예루살렘의 한 저자가 히브리어로 쓴 것으로 보이지만, 현재는 그리스어본만 남아 있습니다.
    audience: 하스몬 항쟁 당시와 그 이후의 유대인들을 대상으로 하며, 하스몬 왕조의 정당성을 서술합니다.
    date: 기원전 100년경입니다.
    chapters:
      '1':
        title: 이스라엘이 그리스의 폭정에 맞섭니다
      '2':
        title: 마타티아스가 율법을 지키겠다고 맹세합니다
      '3':
        title: 유다가 이스라엘을 도와주시기를 기도합니다
      '4':
        title: 성전을 정화하고 다시 봉헌합니다
      '5':
        title: 유다가 주변 민족들을 무찌릅니다
      '6':
        title: 안티오코스가 패배한 뒤 죽습니다
      '7':
        title: 유다가 니카노르의 군대를 무찌릅니다
      '8':
        title: 유다가 로마와 우호 관계를 맺으려 합니다
