        title: 거짓 교사들의 치명적인 열매를 피하라
      '51':
        title: 기도와 헌신으로 하나 되라
      '52':
        title: 사랑으로 주교에게 순종하라
      '53':
        title: 로마의 신실한 교회에 인사하다
      '54':
        title: 내 여정의 마지막을 위하여 기도하라
      '55':
        title: 사람이 아니라 하나님의 인정을 구하라
      '56':
        title: 내면의 힘을 위하여 기도하라
      '57':
        title: 하나님을 위하여 기꺼이 죽음을 맞으라
      '58':
        title: 이그나티우스가 고난을 기꺼이 받아들이다
      '59':
        title: 그리스도를 위하여 세속적인 욕망을 십자가에 못 박으라
      '60':
        title: 이그나티우스가 세속적인 욕망을 거부하다
      '61':
        title: 이그나티우스가 신실하게 고난받기를 바라다
      '62':
        title: 시리아 교회가 돌봄을 받도록 기도하라
