        title: 교만보다 온유를 갈망하라
      '44':
        title: 이그나티우스가 하늘의 지식을 두려워하다
      '45':
        title: 이단의 가르침이 아니라 믿음을 양육하라
      '46':
        title: 교회의 지도자들에게 계속 충실하라
      '47':
