payload:
  book_metadata:
    Gospel of Mary:
      display_name: 마리아 복음서
      author: 저자는 알려져 있지 않습니다. 이 작품은 마리아를 예수님의 계시를 받아 해석하는 인물로 제시하지만, 현존하는 복음서를 마리아가 썼다고 주장하지는 않습니다.
      audience: 계시, 영적 상승, 사도적 권위, 그리고 예수님의 제자들 가운데서 마리아의 가르침이 지니는 정당성을 두고 고심하던 초기 그리스도교 독자들을 대상으로 합니다.
      date: 대체로 서기 2세기의 작품으로 추정됩니다. 서기 3세기의 그리스어 단편들이 남아 있으며, 주요 콥트어 문헌은 5세기의 베를린 코덱스 8502에 보존되어 있습니다.
    Treatise on the Resurrection:
      display_name: 부활에 관한 논고
      author: 저자는 알려져 있지 않습니다. 이 작품은 스승이 레기노스라는 제자에게 보내는 편지 형식이지만, 그 스승과 레기노스가 누구인지는 확실히 밝혀낼 수 없습니다.
      audience: 부활에 관한 가르침을 구하던 그리스도인들, 특히 육체적 부활과 영적 부활, 그리고 현재 부활의 생명에 참여하는 일을 숙고하던 독자들을 대상으로 합니다.
      date: 대체로 서기 2세기 후반, 흔히 약 170~200년의 작품으로 봅니다. 앞선 시기의 그리스어 작품을 옮긴 4세기 콥트어 사본에 보존되어 있습니다.
    Dialogue of the Savior:
      display_name: 구원자의 대화
      author: 저자는 알려져 있지 않습니다. 이 대화편은 예수님이 유다, 마태, 마리아와 대화하며 계시의 가르침을 전하는 것으로 묘사하지만, 편찬자가 누구인지는 밝히지 않습니다.
      audience: 개인적으로 전해지는 계시, 제자도, 자기 인식, 기도, 그리고 구원을 위한 금욕적 준비에 관심을 둔 초기 그리스도교 공동체를 대상으로 합니다.
      date: 일반적으로 서기 2세기의 작품으로 보지만, 작품의 구성 층위와 정확한 연대에는 여전히 논쟁이 있습니다. 4세기 콥트어 사본에 보존되어 있습니다.
    Exegesis on the Soul:
      display_name: 영혼에 관한 해설
      author: 저자는 알려져 있지 않습니다. 저자는 그리스도교 설교자로서, 성경과 그리스 문학의 심상을 영혼의 타락과 회개와 회복을 나타내는 비유로 새롭게 해석합니다.
      audience: 성경과 도덕적 권면에 익숙하며, 무질서한 욕망에서 돌이켜 회개하고 신적인 존재와 다시 결합하라는 부름을 받은 그리스도인들을 대상으로 합니다.
      date: 일반적으로 서기 2세기 후반이나 3세기 초반의 작품으로 추정됩니다. 그리스어 원문을 번역한 4세기 콥트어 사본에 보존되어 있습니다.
    Book of Thomas the Contender:
      display_name: 투사 도마의 책
      author: 저자는 알려져 있지 않습니다. 작품 끝의 표제는 이 글을 유다 도마와 연관 짓고 마타이아스를 기록자로 지목하지만, 이는 검증할 수 있는 저자 진술이라기보다 문학적 귀속입니다.
      audience: 자기 인식을 추구하고 육체의 욕정을 물리치며, 예수님이 도마에게 개인적으로 주신 가르침을 이해하라는 권면을 받은 금욕 성향의 그리스도인들을 대상으로 합니다.
      date: 흔히 서기 2세기 후반이나 3세기 초반의 작품으로 보며, 시리아계 그리스도교 환경에서 작성되었을 가능성이 있습니다. 4세기 콥트어 사본에 보존되어 있습니다.
    Tripartite Tractate:
      display_name: 삼부 논고
      author: 저자는 알려져 있지 않습니다. 저자는 고등 교육을 받은 발렌티누스파 그리스도교 신학자였지만, 이름이 알려진 어떤 교사와도 확실히 동일시할 수 없습니다.
      audience: 하나님, 아이온들, 창조, 그리스도, 교회, 구원, 최종적 회복에 관한 체계적인 가르침을 받던 발렌티누스파 그리스도교 공동체를 대상으로 합니다.
      date: 대체로 서기 3세기의 작품으로 보며, 일부 견해는 3세기 후반을 더 유력하게 봅니다. 4세기의 융 코덱스에 콥트어로 보존되어 있습니다.
    Apocryphon of John:
      display_name: 요한 외경
      author: 저자는 알려져 있지 않습니다. 이 작품은 부활하신 예수님이 세베대의 아들 요한에게 주신 계시인 것처럼 가명으로 제시되며, 고대의 여러 판본으로 전해집니다.
      audience: 신적 영역, 창조, 인간의 정체성, 적대적인 지배자들로부터의 해방에 관한 설명을 구하던 세트파 또는 그와 밀접히 관련된 계시 전승의 그리스도인들을 대상으로 합니다.
      date: 초기 형태는 서기 2세기에 유통되었을 가능성이 큽니다. 짧은 판본과 긴 판본을 보존한 현존 콥트어 사본들은 4세기와 5세기의 것입니다.
