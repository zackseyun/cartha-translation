payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: 도마 유년 복음서
      author: 저자는 알려져 있지 않습니다. 복원할 수 있는 가장 이른 형태의 본문에는 저자 이름이 나오지 않으며, 도마의 저작이라는 귀속은 후대 사본의 제목과 전승에서 비롯되었습니다.
      audience: 정경 복음서의 이야기가 시작되기 전 예수의 어린 시절과 신적 능력, 훈육, 배움, 성장이 어떻게 서술될 수 있는지 궁금해하던 그리스도인들을 대상으로 합니다.
      date: 대체로 서기 2세기에 기원을 둔 것으로 보지만, 본문은 서로 상당히 다른 여러 그리스어 판본과 초기 번역본으로 전해집니다.
    Acts of Paul and Thecla:
      display_name: 바울과 테클라 행전
      author: 저자는 알려져 있지 않습니다. 이 작품은 더 큰 저작인 『바울 행전』의 한 일화입니다. 한 장로가 이 행전을 지었다는 고대의 기록이 있지만, 그것만으로 저자를 확실히 밝혀낼 수는 없습니다.
      audience: 사도들의 설교, 독신 생활, 세례, 순교에 견줄 만한 인내, 그리고 가르치고 증언하는 여성의 권위에 관한 이야기에 관심을 가진 그리스도인들을 대상으로 합니다.
      date: 서기 2세기, 아마도 그 후반부에 작성되었습니다. 『바울 행전』의 일부로도, 독립된 작품으로도 유통되었습니다.
    Gospel of Peter:
      display_name: 베드로 복음서
      author: 저자는 알려져 있지 않습니다. 현존하는 이야기는 베드로의 목소리로 말하며 그의 이름으로 전승되었지만, 역사적 사도 베드로의 저작으로 여겨지지는 않습니다.
      audience: 확장된 수난과 부활 이야기에 관심을 가진 초기 그리스도인들을 대상으로 하며, 아마도 베드로의 권위가 특별히 중시되던 공동체에서 읽혔을 것입니다.
      date: 대체로 서기 2세기의 작품으로 봅니다. 현존하는 주요 그리스어 단편은 훨씬 후대의 사본에 들어 있으며, 아크밈에서 발견되었습니다.
    2 Clement:
      display_name: 클레멘스 2서
      author: 저자는 알려져 있지 않습니다. 전통적인 제목과 달리, 이 작품은 로마의 클레멘스가 쓴 두 번째 편지가 아니라 초기 그리스도교의 설교문입니다.
      audience: 회개, 일관된 도덕적 삶, 취약한 이들을 돌보는 일, 그리고 부활과 심판을 바라보며 신실하게 인내하는 삶을 권면받는 그리스도인 회중을 대상으로 합니다.
      date: 대체로 서기 2세기 전반부나 중엽(약 100~160년)의 작품으로 보며, 작성 장소는 확실하지 않습니다.
    Epistle of Barnabas:
      display_name: 바나바 서신
      author: 저자는 알려져 있지 않습니다. 전통적으로 바울의 동역자 바나바와 관련된 작품으로 여겨졌지만, 현대 학계에서는 그 저자 귀속을 받아들이지 않습니다.
      audience: 이스라엘의 성경을 그리스도론적이고 비유적인 방식으로 해석하여 자신들의 것으로 받아들이는 한편, 자신들의 언약 정체성을 유대교의 관행과 구별하도록 가르침받던 이방인 그리스도인들을 대상으로 합니다.
      date: 일반적으로 예루살렘 성전이 파괴된 서기 70년부터 2세기 초 사이, 흔히 약 80~130년에 작성된 것으로 봅니다.
