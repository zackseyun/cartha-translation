payload:
  book_metadata:
    2 Esdras:
      display_name: 제2에스드라서
      author: 저자는 알려져 있지 않습니다. 본래 유대교 문헌이었던 핵심부(제4에스라서, 3–14장)를 그리스도교 편집자가 앞뒤에서 감싼 형태입니다.
      audience: 서기 70년 이후 신정론의 문제로 고심하던 유대인들을 대상으로 하며, 이후 그리스도교 독자들을 위해 내용이 확장되었습니다.
      date: 유대교 핵심부는 서기 100년경, 그리스도교 추가 부분은 서기 2–3세기경으로 추정됩니다.
    Didache:
      display_name: 디다케
      author: 저자는 알려져 있지 않습니다(제목은 “열두 사도의 가르침”이라는 뜻입니다).
      audience: 초기 그리스도교 공동체를 위한 것으로, 윤리와 세례, 성찬, 순회 교사에 관한 간략한 지침서입니다.
      date: 서기 1세기 말에서 2세기 초경으로 추정됩니다.
    Gospel of Thomas:
      display_name: 도마복음
      author: 저자는 알려져 있지 않습니다. 첫머리에서는 이 어록집을 “디두모 유다 도마”의 것으로 돌립니다. 완전한 형태로 전해지는 것은 나그함마디에서 발견된 4세기 콥트어 번역본(NHC II,2)뿐이며, 옥시링쿠스에서 발견된 그리스어 단편 세 점도 남아 있습니다.
      audience: 시리아계 지혜 전통과 초기 영지주의적 사상의 영향을 받은 그리스도교 독자층을 대상으로 하며, 예수의 말씀을 통한 난해한 자기 인식을 지향합니다.
      date: 그리스어 원문은 서기 50–140년경, 콥트어 사본은 서기 340년경으로 추정됩니다.
      summary: 도마복음은 예수의 말씀으로 전해지는 어록을 모은 책입니다. 이어지는 서사가 없으며, 독자에게 그 말씀의 의미를 깨달으라고 거듭 촉구합니다.
