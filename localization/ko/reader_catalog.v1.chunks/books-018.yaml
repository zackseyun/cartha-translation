review:
  verdict: revise
  review_summary: 전체 필드는 완전하게 유지했으며, 번역은 대체로 충실합니다. 도마복음 메타데이터의 독자층 설명에서 ‘esoteric’을 ‘비전적’으로 옮긴 부분을 ‘난해한’으로 바로잡고, 일부 제목을 원문의 의미에 더 밀착되게 다듬었습니다.
  issues:
  - 'Gospel of Thomas audience: ‘esoteric self-knowledge’를 ‘비전적 자기 인식’으로 번역한 것은 의미가 달라 ‘난해한 자기 인식’으로 수정했습니다.'
  - 'Gospel of Thomas 41: ‘Giving’을 ‘주고받음’으로 확장하지 않고 ‘나눔’으로 수정했습니다.'
  - 'Gospel of Thomas 29: 원문의 ‘spirit’을 ‘영’으로 보고 놀란다는 의미를 더 직접적으로 반영했습니다.'
