    Lamentations:
      display_name: 예레미야애가
      author: 저자는 알려져 있지 않으며, 전승에서는 예레미야가 지었다고 봅니다.
      audience: 기원전 586년 예루살렘의 멸망을 슬퍼하던 유다 사람들입니다.
      date: 기원전 586년 직후입니다.
    Ezekiel:
      display_name: 에스겔
      author: 바빌론으로 유배된 제사장 에스겔이며, 이후 편집 과정을 거친 것으로 보입니다.
      audience: 성전에서 멀리 떨어진 곳에서 하나님의 임재를 새롭게 이해해야 했던 바빌론의 유다 유배민들입니다.
      date: 예언자의 활동 시기는 기원전 약 593~571년이며, 최종 형태는 그보다 다소 뒤에 완성된 것으로 보입니다.
    Daniel:
      display_name: 다니엘
      author: 저자는 알려져 있지 않으며, 본문은 유배 시대의 다니엘이 전하는 형식으로 되어 있습니다.
      audience: 헬레니즘 시대에 박해받던 유대인들, 특히 안티오코스 4세 에피파네스 치하(기원전 167~164년)의 유대인들입니다.
      date: 전해지는 형태로 완성된 시기는 기원전 약 165년이며, 1~6장에는 더 오래된 궁정 이야기들이 포함되어 있습니다.
    Hosea:
      display_name: 호세아
      author: 브에리의 아들 호세아입니다.
      audience: 아시리아에 정복되기 전 마지막 수십 년을 보내던 북왕국 이스라엘 사람들입니다.
      date: 기원전 약 750~722년입니다.
