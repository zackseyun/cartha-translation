  book_metadata:
    Numbers:
      display_name: 민수기
      author: 저자 미상이며, 전통적으로 모세가 쓴 것으로 여겨집니다.
      audience: 이집트에서 약속의 땅으로 이동하던 이스라엘, 곧 광야 세대와 그들의 실패에서 교훈을 얻는 후대의 독자들을 대상으로 합니다.
      date: 군주제 후기부터 포로기 이후까지 형성된 여러 문헌 층으로 이루어진 것으로 봅니다(기원전 약 7~5세기).
    Deuteronomy:
      display_name: 신명기
      author: 저자는 알려져 있지 않으며, 모세의 고별 연설로 제시됩니다. 현대 학계에서는 그 핵심 부분이 기원전 7세기 후반 요시야 시대의 개혁과 관련된 것으로 봅니다.
      audience: 그 땅에 들어갈 준비를 하던 이스라엘과, 훗날 성전이나 왕 없이 어떻게 신실하게 살아갈지를 고민하던 포로들을 대상으로 합니다.
      date: 핵심 부분은 기원전 7세기 후반 무렵에 형성되었으며, 포로기에 최종 형태를 갖춘 것으로 봅니다.
    Joshua:
      display_name: 여호수아
      author: 저자는 알려져 있지 않으며, 신명기계 역사서의 일부입니다.
      audience: 군주제 시대와 포로기의 이스라엘이 정복, 언약, 그리고 땅의 의미를 되돌아보도록 기록되었습니다.
      date: 더 오래된 전승들을 바탕으로 기원전 약 7~6세기에 편집된 것으로 봅니다.
