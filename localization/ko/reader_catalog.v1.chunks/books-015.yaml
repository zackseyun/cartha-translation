      audience: 주변의 우상 숭배에 이끌릴 위험이 있던 디아스포라 유대인들입니다.
      date: 기원전 4–2세기경.
    Prayer of Azariah and Song of the Three:
      display_name: 아사랴의 기도와 세 젊은이의 노래
      author: 익명; 다니엘서의 그리스어 추가 부분 가운데 하나입니다.
      audience: 그리스어권 유대인들 — 다니엘서 3장을 위한 전례 자료입니다.
      date: 기원전 2세기경.
    Susanna:
      display_name: 수산나
      author: 익명; 다니엘서의 그리스어 추가 부분 가운데 하나입니다.
