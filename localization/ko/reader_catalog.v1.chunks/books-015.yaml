    1 Esdras:
      display_name: 에스드라 1서
      author: 익명; 역대기하 35–36장, 에스라서, 느헤미야 7–8장을 재배열하여 그리스어로 재구성한 문헌입니다.
      audience: 귀환과 회복에 관한 정연한 이야기를 원했던 헬레니즘 시대의 유대인들입니다.
      date: 기원전 2–1세기경.
    Prayer of Manasseh:
      display_name: 므낫세의 기도
      author: 익명; 므낫세 왕의 이름을 빌려 쓴 것으로 전해집니다.
      audience: 므낫세의 회개에 자신을 비추어 보는 참회자들 — 일부 전통에서 전례용으로 사용됩니다.
      date: 기원전 2–1세기경.
    Psalm 151:
      display_name: 시편 151편
      author: 익명; 다윗의 이름을 빌려 쓴 것으로 전해집니다. 히브리어 형태의 본문이 11QPsa에서 확인됩니다.
      audience: 다윗의 시편집을 소중히 여기던 디아스포라와 쿰란 공동체입니다.
      date: 기원전 2세기경 또는 그 이전.
    3 Maccabees:
      display_name: 마카베오 3서
      author: 익명; 그리스어로 저술되었습니다.
      audience: 이집트의 그리스어권 디아스포라 유대인들 — 프톨레마이오스 4세 시대를 배경으로 한 구원 이야기입니다.
      date: 기원전 1세기경부터 기원후 1세기경까지.
    4 Maccabees:
      display_name: 마카베오 4서
