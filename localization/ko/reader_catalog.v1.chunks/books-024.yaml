payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: 집정관들의 본질
      author: 익명입니다. 저자는 집정관들에 관한 계시적 신화를 통해 창세기를 해석하지만, 이 작품을 특정 교사의 저작으로 확실히 돌릴 수는 없습니다.
      audience: 창세기를 무지한 우주적 통치자들과 신적 지혜, 그리고 인류의 영적 기원 사이의 갈등으로 읽었던 셋파 또는 그와 관련된 환경의 그리스도인들을 대상으로 합니다.
      date: 일반적으로 서기 3세기의 작품으로 보며, 나그함마디 문서 II에 수록된 4세기 콥트어 사본으로 보존되어 있습니다.
    On the Origin of the World:
      display_name: 세계의 기원에 관하여
      author: 익명입니다. 이 작품은 편찬자의 이름을 밝히지 않은 채 유대교·그리스도교·플라톤 철학·신화의 여러 전통을 결합하고 수정합니다.
      audience: 창조와 우주적 통치자들, 소피아, 아담과 하와, 그리고 세계의 최종 운명에 관한 대안적 역사를 알고자 했던 영지주의적 성향의 그리스도교 환경에 속한 독자들을 대상으로 합니다.
      date: 대체로 서기 3세기의 작품으로 보지만, 그보다 이른 자료들이 바탕에 놓여 있을 수도 있습니다. 주로 4세기의 콥트어 사본들로 보존되어 있습니다.
    Sophia of Jesus Christ:
      display_name: 예수 그리스도의 지혜
      author: 익명입니다. 저자는 『에우그노스토스』에도 나오는 자료를 예수와 제자들이 부활 후에 나눈 대화 형식으로 각색합니다.
      audience: 초월적 하나님과 하늘 세계의 질서, 영혼의 기원과 구원에 관해 계시된 지혜에 관심을 가진 그리스도인들을 대상으로 합니다.
      date: 흔히 서기 2세기 말 또는 3세기의 작품으로 보며, 나그함마디 문서와 베를린 문서의 콥트어 사본들로 보존되어 있습니다.
    Gospel of the Egyptians:
      display_name: 이집트인 복음서
      author: 익명입니다. 『위대한 보이지 않는 영의 거룩한 책』이라고도 불리는 이 나그함마디 작품은 인용문으로만 알려진 더 이른 시기의 그리스어 『이집트인 복음서』와는 별개의 작품입니다.
      audience: 복잡한 신화와 신성한 이름들, 세례의 표상, 찬송의 언어를 사용하여 영적 정체성과 해방을 표현했던 셋파 그리스도교 공동체를 대상으로 합니다.
      date: 대체로 서기 2세기 또는 3세기의 작품으로 보며, 4세기 나그함마디 문서들에 두 개의 콥트어 사본이 남아 있습니다.
    Letter of Peter to Philip:
      display_name: 베드로가 빌립에게 보낸 편지
      author: 익명입니다. 짧은 서두의 편지와 뒤이은 계시는 베드로와 빌립에게 가명으로 귀속된 것이며, 두 사도 가운데 어느 한 사람이 확실히 쓴 것은 아닙니다.
      audience: 구원자와 적대 세력, 고난과 선교, 제자들의 회복에 관한 가르침에 사도적 권위를 부여하고자 했던 그리스도인들을 대상으로 합니다.
      date: 일반적으로 서기 2세기 말 또는 3세기 초의 작품으로 보며, 4세기 나그함마디 사본 하나와 그보다 후대의 콥트어 사본 하나로 보존되어 있습니다.
    Gospel of Judas:
      display_name: 유다 복음서
      author: 익명입니다. 제목은 이 이야기를 유다에게 귀속하지만, 이 작품은 가룟 유다가 역사적 저자였음을 입증하지 않습니다.
      audience: 경쟁하는 희생 제의와 교회 관행을 비판하며, 계시적 대화와 셋파 계열의 우주론을 통해 유다와 예수의 죽음을 새롭게 해석했던 그리스도교 집단을 대상으로 합니다.
      date: 대체로 서기 2세기 중엽 또는 후반의 작품으로 봅니다. 이레네우스는 180년경에 『유다 복음서』를 알고 있었으며, 현존하는 콥트어 사본은 아마도 3세기 또는 4세기의 것입니다.
    Protoevangelium of James:
      display_name: 야고보 원복음서
      author: 익명입니다. 화자는 자신이 야고보라고 주장하지만, 이 작품은 가명 저작이며 예수의 형제 야고보가 쓴 것이 아닙니다.
      audience: 마리아의 출생과 성장, 그의 변함없는 순결, 예수의 탄생, 그리고 마태복음과 누가복음이 답하지 않은 질문들에 대한 이야기식 해답에 관심을 가진 그리스도인들을 대상으로 합니다.
      date: 일반적으로 서기 2세기 후반의 작품으로 보며, 후대의 수많은 그리스어 사본과 고대 번역본으로 전해집니다.
