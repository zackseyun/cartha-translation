review:
  verdict: revise
  review_summary: 초안은 전반적으로 충실했으나, 몇몇 표현을 원문의 의미와 어조에 더 가깝게 다듬었습니다. 특히 룻기 4장의 ‘redeems’, 사사기 11장의 ‘sacrifice’, 사무엘상 21장의 ‘flees to’, 사무엘상 27장의 ‘fakes raids’를 바로잡았습니다.
  issues:
  - 'Ruth 4: ‘redeems’는 ‘되찾아 주다’보다 ‘기업 무를 자의 의무를 이행하다’로 옮겨야 합니다.'
  - 'Judges 11: ‘as sacrifice’를 명시적으로 반영했습니다.'
  - '1 Samuel 21: ‘flees to’는 제사장에게 ‘피신하다’가 아니라 그에게 ‘도피하다/찾아가다’라는 뜻입니다.'
  - '1 Samuel 27: ‘fakes raids for Achish’의 의미를 더 직접적으로 반영했습니다.'
