    Isaiah:
      display_name: 이사야서
      author: 여러 세기에 걸친 복수의 저자들; 1–39장은 기원전 8세기 예루살렘의 이사야에 뿌리를 두며, 40–55장(‘제2이사야’)과 56–66장(‘제3이사야’)은 유배와 귀환에 응답합니다.
      audience: 차례로 앗시리아의 위협 아래 있던 유다, 바빌로니아 유배, 유배 이후의 회복을 대상으로 합니다.
      date: 대략 기원전 8세기 후반부터 5세기에 걸쳐 지어졌습니다.
    Jeremiah:
      display_name: 예레미야서
      author: 아나돗 출신 예레미야; 그의 서기관 바룩과 후대 사람들의 상당한 편집을 거쳤습니다.
      audience: 바빌로니아 정복 직전과 정복 당시, 그리고 그 이후의 유다를 대상으로 합니다.
      date: 기원전 7세기 후반부터 6세기 초입니다.
