  book_metadata:
    Proverbs:
      display_name: 잠언
      author: 여러 자료를 모은 선집입니다. 표제에는 솔로몬, 아굴, 르무엘, 그리고 ‘지혜로운 이들’이 언급됩니다.
      audience: 일상생활에 필요한 지혜를 배우며 성장하던 젊은 이스라엘 사람들입니다.
      date: 여러 집필 층위는 기원전 약 10세기부터 4세기까지 형성되었습니다.
    Ecclesiastes:
      display_name: 전도서
      author: 저자는 알려져 있지 않습니다. 화자는 ‘코헬렛’이며, 전통적으로 솔로몬과 동일시되었습니다.
      audience: 해 아래에서 지혜와 부와 수고가 지닌 한계에 직면한 이스라엘 사람들입니다.
      date: 아람어의 영향을 받은 히브리어에 근거할 때, 기원전 약 5세기부터 3세기 사이로 추정됩니다.
    Song of Solomon:
      display_name: 아가
      author: 저자는 알려져 있지 않습니다. 표제에는 솔로몬이 언급됩니다.
      audience: 성적인 사랑을 언약의 친밀함을 이해하는 렌즈로 읽던 이스라엘과, 후대에 이를 비유적으로 읽은 유대교 및 그리스도교 독자들입니다.
      date: 포로기 이후인 기원전 약 5세기부터 3세기 사이로 추정됩니다.
