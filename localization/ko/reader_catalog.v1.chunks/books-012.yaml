    2 Corinthians:
      '1':
        title: 고난 중에 주시는 하나님의 위로
      '2':
        title: 사랑하고 용서하십시오
      '3':
        title: 변화된 삶으로 확증되는 사역
      '4':
        title: 그리스도의 영광을 선포하십시오
