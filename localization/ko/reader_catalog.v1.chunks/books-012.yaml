      '4':
        title: 거짓 교사와 신화를 물리치십시오
      '5':
        title: 과부와 장로를 신실하게 존중하십시오
      '6':
        title: 재물에 관해 디모데에게 조언하는 바울
    2 Timothy:
      '1':
        title: 디모데여, 은혜 안에 굳게 서십시오
      '2':
        title: 그리스도를 위해 고난을 견디십시오
      '3':
