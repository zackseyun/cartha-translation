      '2':
        title: 낮아지시고 높임받으신 예수님
      '3':
        title: 그리스도를 아는 기쁨
      '4':
        title: 기뻐하며 굳게 서십시오
    Colossians:
      '1':
        title: 골로새 교회의 믿음을 위해 기도하는 바울
      '2':
        title: 그리스도 안에 굳게 서라고 격려하는 바울
      '3':
        title: 죄를 벗어나 사랑으로 사십시오
      '4':
