payload:
  book_metadata:
    Joel:
      display_name: 요엘
      author: 브두엘의 아들 요엘입니다.
      audience: 메뚜기 재앙을 주님의 날을 알리는 징조로 받아들인 포로기 이후의 유다 백성입니다.
      date: 기원전 5~4세기경으로 추정됩니다.
    Amos:
      display_name: 아모스
      author: 남유다 드고아 출신의 목자로, 북왕국에서 말씀을 선포한 아모스입니다.
      audience: 여로보암 2세 치하에서 번영과 불의가 공존하던 북이스라엘 백성입니다.
      date: 기원전 760~750년경입니다.
    Obadiah:
      display_name: 오바댜
      author: 오바댜입니다.
      audience: 에돔이 예루살렘을 배신한 뒤의 유다 백성에게 에돔의 몰락을 예언합니다.
      date: 기원전 586년 직후입니다.
    Jonah:
      display_name: 요나
      author: 저자는 알려져 있지 않으며, 주인공은 아밋대의 아들 요나입니다.
      audience: 포로기 이후의 이스라엘을 향해 민족적 배타성을 풍자적으로 꾸짖고, 이방인에게도 베푸시는 하나님의 자비를 확언합니다.
      date: 기원전 5~4세기경으로 추정됩니다.
    Micah:
      display_name: 미가
      author: 모레셋 출신의 미가입니다.
      audience: 기원전 8세기 후반의 유다 백성, 특히 도시 지배층에게 억압받던 농촌의 가난한 이들입니다.
      date: 기원전 740~700년경입니다.
    Nahum:
      display_name: 나훔
      author: 엘고스 출신의 나훔입니다.
      audience: 니느웨의 임박한 멸망을 기뻐하던 유다 백성입니다.
      date: 기원전 612년 직전입니다.
    Habakkuk:
      display_name: 하박국
      author: 하박국입니다.
      audience: 바빌론의 부상에 직면한 유다 백성에게 정의를 두고 예언자와 하나님이 나누는 대화를 전합니다.
      date: 기원전 7세기 후반경입니다.
    Zephaniah:
      display_name: 스바냐
      author: 구시의 아들 스바냐입니다.
      audience: 요시야의 개혁을 앞둔 시기에 그의 통치를 받던 유다 백성입니다.
      date: 기원전 640~609년경입니다.
    Haggai:
      display_name: 학개
      author: 학개입니다.
      audience: 다리오 통치 아래 성전을 재건하던 귀환민들입니다.
      date: 기원전 520년입니다.
    Zechariah:
      display_name: 스가랴
      author: 베레갸의 아들 스가랴이며, 9~14장은 후대의 다른 저자가 기록했을 가능성이 큽니다.
      audience: 성전을 재건하던 귀환민들과 그 후 포로기 이후의 공동체들입니다.
      date: 1~8장은 기원전 520~518년경이며, 9~14장은 그보다 약 한 세기 뒤일 가능성이 있습니다.
    Malachi:
      display_name: 말라기
      author: 저자는 알려져 있지 않으며, ‘말라기’는 ‘나의 사자’라는 뜻입니다.
      audience: 페르시아 통치 아래 예배와 신실함이 느슨해져 가던 포로기 이후의 유다 백성입니다.
      date: 기원전 5세기 중엽경입니다.
    Matthew:
      display_name: 마태복음
      author: 저자는 알려져 있지 않으며, 전승은 사도 마태가 기록했다고 봅니다. 현대 학계에서는 그리스어를 쓰던 유대계 그리스도인 저자가 마가복음과 Q 자료와 비슷한 자료를 활용했다고 봅니다.
      audience: 회당 중심의 유대교와 무엇이 이어지고 무엇이 달라지는지를 두고 고민하던 유대계 그리스도인 공동체입니다.
      date: 서기 80~90년경입니다.
    Mark:
      display_name: 마가복음
      author: 저자는 알려져 있지 않으며, 전승은 베드로의 여행 동료였던 요한 마가와 이 책을 연결합니다.
      audience: 박해를 받고 있었거나 박해의 위협에 가까이 놓였던 그리스어권 그리스도인 공동체로, 로마에 있었을 가능성이 있습니다.
      date: 유대 전쟁과 성전 파괴 전후인 서기 65~75년경입니다.
  chapter_titles:
