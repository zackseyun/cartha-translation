      display_name: 바룩서
      author: 저자는 알려져 있지 않으며, 예레미야의 서기관 바룩의 이름을 빌려 기록된 것으로 여겨집니다.
      audience: 유배와 회개와 지혜를 되새기던 디아스포라 유대인들을 대상으로 했습니다.
      date: 기원전 2세기경입니다.
    1 Maccabees:
      display_name: 마카베오기 상권
      author: 저자는 알려져 있지 않습니다. 예루살렘의 한 저자가 히브리어로 쓴 것으로 보이지만, 현재는 그리스어본만 남아 있습니다.
      audience: 하스몬 항쟁 당시와 그 이후의 유대인들을 대상으로 하며, 하스몬 왕조의 정당성을 서술합니다.
      date: 기원전 100년경입니다.
    2 Maccabees:
      display_name: 마카베오기 하권
      author: 키레네의 야손이 쓴 더 긴 저술을 한 익명의 편집자가 요약한 것으로, 그리스어로 작성되었습니다.
      audience: 그리스어를 사용하던 디아스포라 유대인들을 대상으로 하며, 순교와 섭리와 부활을 강조합니다.
      date: 기원전 124년경 또는 그 직후입니다.
