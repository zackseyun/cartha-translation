    Sirach:
      display_name: 집회서
      author: 예루살렘 출신의 예수아 벤 엘아자르 벤 시라가 지었으며, 그의 손자가 그리스어로 번역했습니다.
      audience: 헬레니즘 시대 예루살렘에서 지혜 교육을 받던 젊은 유대인 남성들을 대상으로 했습니다.
      date: 히브리어 원문은 기원전 약 195~175년, 그리스어 번역은 기원전 약 132년입니다.
