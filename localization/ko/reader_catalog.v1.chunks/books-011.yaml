  book_metadata:
    Luke:
      display_name: 누가복음
      author: 저자는 알려져 있지 않습니다. 전승에서는 바울의 여행 동반자였던 누가가 썼다고 봅니다.
      audience: “데오빌로”에게 보내는 형식으로 기록되었으며, 글을 읽고 이해할 소양을 갖춘 그리스·로마권의 그리스도인 독자들을 대상으로 합니다.
      date: 서기 약 80~90년.
    John:
      display_name: 요한복음
      author: 저자는 알려져 있지 않습니다. 전승에서는 사도 요한 또는 “예수께서 사랑하신 제자”가 썼다고 봅니다.
      audience: 사랑받는 제자의 증언을 중심으로 형성되었으며, 회당 중심의 유대교와 긴장 관계에 있던 그리스도인 공동체를 대상으로 합니다.
      date: 서기 약 90~110년.
      summary: 요한복음은 예수님을 아버지를 드러내시는 영원한 말씀으로 제시합니다. 예수님을 신뢰하는 이들은 그분을 통해 생명을 얻으며, 예수님은 표적과 죽음과 부활을 통해 영광을 받으십니다.
    Acts:
      display_name: 사도행전
      author: 저자는 알려져 있지 않으며, 누가복음과 같은 저자가 썼습니다.
      audience: 그리스·로마권의 그리스도인 독자들을 대상으로 하며, 데오빌로에게 보낸 저술의 둘째 권입니다.
      date: 서기 약 80~90년.
    Romans:
      display_name: 로마서
      author: 바울이 서기관 더디오와 함께 썼습니다.
      audience: 로마의 그리스도인들, 곧 율법과 정체성 문제로 긴장 관계에 있던 유대인 신자들과 이방인 신자들을 대상으로 합니다.
      date: 서기 약 56~58년, 고린도에서 기록되었습니다.
