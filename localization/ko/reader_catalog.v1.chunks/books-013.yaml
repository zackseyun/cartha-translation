payload:
  book_metadata:
    James:
      display_name: 야고보서
      author: 전통적으로 예수의 형제 야고보로 여겨지지만, 현대 학계에서는 실제 저작인지 가명 저작인지 견해가 나뉩니다.
      audience: 디아스포라의 유대계 그리스도인 공동체입니다.
      date: 실제 저작이라면 서기 50~60년대경, 가명 저작이라면 서기 1세기 후반경입니다.
    1 Peter:
      display_name: 베드로전서
      author: 전통적으로 사도 베드로가 실루아노를 필사자로 두고 쓴 것으로 여겨지지만, 일부 학자들은 가명 저작으로 봅니다.
      audience: 사회적 적대에 시달리던 로마령 소아시아의 그리스도인들입니다.
      date: 베드로의 저작이라면 서기 60년대경, 가명 저작이라면 서기 70~90년대경입니다.
    2 Peter:
      display_name: 베드로후서
      author: 전통적으로 베드로의 저작으로 여겨지지만, 현대 학계에서는 가명 저작이라는 견해가 널리 받아들여집니다.
      audience: 그리스도의 재림을 부인하며 조롱하는 이들과 맞서던 그리스도인들입니다.
      date: 서기 2세기 초경입니다.
    1 John:
      display_name: 요한일서
      author: 저자는 알려져 있지 않으며, 전통적으로 사도 요한 또는 요한 공동체의 장로로 여겨집니다.
      audience: 분열을 겪은 뒤 누가 공동체에 속하는지를 규정하던 요한 공동체입니다.
      date: 서기 90~110년경입니다.
    2 John:
      display_name: 요한이서
      author: “장로”입니다.
      audience: 거짓 교사들을 경계하라는 권고를 받은 특정 그리스도인 공동체(“택하심을 받은 부녀”)입니다.
      date: 서기 90~110년경입니다.
    3 John:
      display_name: 요한삼서
      author: “장로”입니다.
      audience: 순회 선교사들을 맞아들이던 개인 지도자 가이오입니다.
      date: 서기 90~110년경입니다.
    Jude:
      display_name: 유다서
      author: 전통적으로 야고보와 예수의 형제 유다로 여겨집니다.
      audience: 방종을 가르치는 교사들이 침투하고 있던 그리스도인 공동체들입니다.
      date: 서기 60~90년대경입니다.
    Revelation:
      display_name: 요한계시록
      author: 밧모섬의 요한입니다(문체상 요한복음의 저자와 구별됩니다).
      audience: 제국의 압력 아래 있던 로마령 소아시아의 일곱 그리스도인 공동체입니다.
      date: 전통적으로 도미티아누스 황제 치세인 서기 90년대경입니다.
    Tobit:
      display_name: 토빗기
      author: 저자는 알려져 있지 않습니다.
      audience: 외세의 통치 아래서 경건, 혼인, 섭리를 따라 살아가던 디아스포라 유대인들입니다.
      date: 기원전 225~175년경이며, 아람어로 저술되었고 쿰란에서는 히브리어 판본도 확인되었습니다.
    Judith:
      display_name: 유딧기
      author: 저자는 알려져 있지 않습니다.
      audience: 외세의 위협을 받던 유대인들을 위한, 경건하고 굴하지 않는 저항의 이야기입니다.
      date: 기원전 150~100년경입니다.
    Greek Additions to Esther:
      display_name: 에스더기 그리스어 추가 부분
      author: 저자는 알려져 있지 않으며, 에스더기의 그리스어 번역본에 덧붙은 보충 자료입니다.
      audience: 명시적인 기도와 하나님에 대한 언급이 담긴 에스더 이야기를 원하던 그리스어권 유대인들입니다.
      date: 기원전 2~1세기경입니다.
    Wisdom of Solomon:
      display_name: 솔로몬의 지혜서
      author: 저자는 알려져 있지 않으며, 솔로몬의 이름을 빌린 가명 저작입니다. 헬레니즘 시대의 유대인 저자가 그리스어로 썼으며, 알렉산드리아에서 저술했을 가능성이 큽니다.
      audience: 그리스 철학과 대화하며 이교와 배교의 대안에 맞서 이스라엘의 지혜를 옹호하던 헬레니즘 시대의 유대인들입니다.
      date: 기원전 50년~서기 50년경입니다.
  chapter_titles:
    Hebrews:
      '11':
        title: 조상들의 믿음은 끝까지 이어집니다
      '12':
        title: 예수님과 함께 고난을 견디십시오
      '13':
        title: 사랑과 신뢰로 살아가십시오
    James:
      '1':
        title: 시련으로 검증된 믿음은 견디어 냅니다
      '2':
        title: 행함이 없는 믿음은 죽은 것입니다
      '3':
        title: 혀를 다스리고 지혜롭게 말하십시오
      '4':
        title: 다툼은 이기심에서 비롯됩니다
      '5':
        title: 부유한 압제자들의 심판이 다가옵니다
    1 Peter:
      '1':
        title: 하늘의 유산에 소망을 두십시오
      '2':
        title: 신자들은 산 돌 위에 세워집니다
      '3':
        title: 아내들은 삶으로 그리스도를 높이십시오
      '4':
