    Proverbs:
      display_name: Masese
      author: Liboke ya makomi ya bakomi ndenge na ndenge; mitó ya makomi etángi Salomo, Agure, Lemuele, mpe “bato ya bwanya.”
      audience: Bilenge ya Yisraele oyo bazalaki koteyama bwanya mpo na bomoi ya mokolo na mokolo.
      date: Biteni na yango ekomamaki na bileko ndenge na ndenge, pene na ekeke ya 10 tii ya 4 liboso ya ntango na biso.
    Ecclesiastes:
      display_name: Mosakoli
      author: Mokomi ayebani te; molobi azali “Kohelete,” oyo bato mingi banda kala bakanisaka ete azalaki Salomo.
      audience: Bato ya Yisraele oyo bazalaki komona ndelo ya bwanya, bozwi mpe milende na bomoi awa na nse ya moi.
      date: Ekoki kozala ete ekomamaki pene na ekeke ya 5 tii ya 3 liboso ya ntango na biso, na kotalela ndenge monɔkɔ ya Aramɛyɛ ebongolaki Ebre na yango.
    Song of Solomon:
      display_name: Loyembo ya Salomo
      author: Mokomi ayebani te; motó ya mokanda elobeli Salomo.
      audience: Yisraele, oyo ezalaki kotánga bolingo ya nzoto kati na mobali ná mwasi lokola lolenge ya kososola boninga ya mozindo kati na Nzambe ná bato ya kondimana na ye—mpe na nsima, Bayuda ná bakristo oyo batángaki yango na ndenge ya elilingi.
      date: Ekoki kozala ete ekomamaki nsima ya bowumbu, pene na ekeke ya 5 tii ya 3 liboso ya ntango na biso.
