    Gospel of Philip:
      display_name: Nsango Malamu ya Filipe
      author: Mokomi ayebani te. Nkombo yango ezali na maloba ya nsuka ya manuskrí, kasi buku yango elobi te ete Filipe nde akomaki yango. Kopi kaka moko oyo ebatelami ezali makomi ya Kopte na Codex II,3 ya Nag Hammadi.
      audience: Lisangá moko ya bakristo ya liboso oyo eyebaki mateya ya basakrama ya lolenge ya Valentinien, mingimingi batisimo, kopakolama mafuta, Ekaristia, kosikolama, lisekwa mpe bililingi ya ndako ya libala.
      date: Mbala mingi batyaka bokomi na yango na nsuka ya ekeke ya 2 to na ebandeli ya ekeke ya 3 nsima ya Klisto; ebatelami na manuskrí ya Kopte ya ekeke ya 4, oyo ebongolamaki uta na lolenge moko ya kala ya Greke.
