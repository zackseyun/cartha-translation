review:
  verdict: revise
  review_summary: 'Correction complète effectuée : amélioration de plusieurs libellés d’interface, des catégories historiques et des termes relatifs au canon afin de préserver le sens anglais sans affirmation confessionnelle.'
  issues:
  - «Available now» a été rendu plus précisément comme disponibilité immédiate.
  - «Chapter grid» et le chargement des résumés ont été reformulés pour éviter des sens impropres.
  - Le titre des Testaments des douze patriarches et celui des Pères apostoliques ont été corrigés.
  - 'Les libellés d’autorité/canon ont été précisés : «Scripture» est rendu comme «Makomi Mosantu», «canonical» comme appartenance/reconnaissance dans un canon, et les écrits historiques ne sont pas qualifiés simplement d’anciens.'
