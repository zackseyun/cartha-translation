  book_metadata:
    2 Esdras:
      display_name: 2 Esdras
      author: Mokomi ayebani te; bakristo babongisaki ebandeli mpe nsuka oyo ezingeli mokanda moko oyo ezalaki libosoliboso ya Bayuda (4 Ezra, mikapo 3–14).
      audience: Bayuda nsima ya mobu 70 T.B., oyo bazalaki koluka koyeba mpo na nini Nzambe atikaka mpasi; na nsima, babakisaki makambo mpo na batángi bakristo.
      date: Eteni ya Bayuda ekoki kozala ya pene na mobu 100 T.B.; biteni oyo bakristo babakisaki ekoki kozala ya pene na ekeke ya 2–3 T.B.
    Didache:
      display_name: Didache
      author: Mokomi ayebani te (nkombo yango elimboli "Mateya ya Bantoma Zomi na Mibale").
      audience: Masangá ya bakristo ya liboso—mokanda mokuse oyo epesi malako na bizaleli, batisimo, elambo ya Nkolo, mpe bateyi oyo bazalaki kotambola.
      date: Ekoki kozala kobanda na nsuka ya ekeke ya 1 tii na ebandeli ya ekeke ya 2 T.B.
    Gospel of Thomas:
      display_name: Nsango Malamu ya Toma
      author: Mokomi ayebani te; maloba ya ebandeli elobi ete liboke ya maloba yango euti na "Didymos Yuda Toma." Mokanda mobimba oyo etikali ezali kaka libongoli ya monɔkɔ ya Copte ya ekeke ya 4, oyo eutaki na Nag Hammadi (NHC II,2); biteni misato ya monɔkɔ ya Grɛki eutaki na Oxyrhynchus.
      audience: Batángi bakristo oyo makanisi na bango ezwaki bopusi ya bwanya ya Siri mpe ya makanisi oyo ezalaki liboso ya Gnosticisme, mpe oyo bazalaki koluka boyebi ya mozindo na ntina na bango moko kati na maloba ya Yesu.
      date: Mokanda ya ebandeli na Grɛki ekoki kozala ya pene na mobu 50–140 T.B.; maniskri ya Copte ekoki kozala ya pene na mobu 340 T.B.
      summary: Nsango Malamu ya Toma ezali liboke ya maloba oyo balobi ete ezali ya Yesu. Ezali na lisolo moko te oyo ekobi uta ebandeli tii nsuka, mpe ezongelaka kobenga batángi báyeba ndimbola ya maloba yango.
