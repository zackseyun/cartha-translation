    1 Esdras:
      display_name: Esidrasi ya Liboso
      author: Mokomi ayebani te; ebongiseli ya Grɛki oyo ezongisi mpe ebongisi na molɔngɔ mosusu 2 Ntango 35–36, Esidrasi, mpe Nehemia 7–8.
      audience: Bayuda ya eleko ya Helenisime oyo bazalaki koluka lisolo ya polele ya bozongi mpe bozongisi lisusu.
      date: Pene na ekeke ya 2–1 Y.K.
    Prayer of Manasseh:
      display_name: Libondeli ya Manase
      author: Mokomi ayebani te; batyaki yango na nkombo ya Mokonzi Manase.
      audience: Bato oyo bazali kobongola motema mpe bamimonaka lokola Manase na kobongola motema na ye — esalelamaka na losambo na bonkoko mosusu.
      date: Pene na ekeke ya 2–1 Y.K.
    Psalm 151:
      display_name: Nzembo 151
      author: Mokomi ayebani te; batyaki yango na nkombo ya Davidi. Lolenge moko ya Baebele emonani na 11QPsa.
      audience: Masanga ya diaspora mpe ya Qumran oyo epesamaki na nzembo ya Davidi.
      date: Pene na ekeke ya 2 Y.K. to liboso na yango.
    3 Maccabees:
      display_name: Bakabi ya Misato
      author: Mokomi ayebani te; ekomamaki na Grɛki.
      audience: Bayuda ya diaspora na Ezipito oyo bazalaki koloba Grɛki — lisolo ya kobikisama oyo etyami na boyangeli ya Ptolemaios IV.
      date: Pene na ekeke ya 1 Y.K. kino ekeke ya 1 N.K.
    4 Maccabees:
      display_name: Bakabi ya Minei
      author: Mokomi ayebani te; Mokomi Moyuda oyo azalaki koloba Grɛki mpe azalaki na bopusi ya filozofi ya Bastoike.
      audience: Bayuda ya eleko ya Helenisime — lisakola ya filozofi na ntina ya mayele oyo elongaka bamposa na nzela ya bosembo.
      date: Pene na ekeke ya 1 N.K.
    Bel and the Dragon:
      display_name: Bele ná Dalagona
      author: Mokomi ayebani te; moko ya biteni ya Grɛki oyo babakisá na Daniele.
      audience: Bayuda oyo bazalaki koloba Grɛki — mokanda ya kotyola losambo ya bikeko.
      date: Pene na ekeke ya 2–1 Y.K.
    Letter of Jeremiah:
      display_name: Mokanda ya Yirimia
      author: Mokomi ayebani te; batyaki yango na nkombo ya Yirimia.
      audience: Bayuda ya diaspora oyo bazalaki komekama na losambo ya bikeko ya bato oyo bazingaki bango.
      date: Pene na ekeke ya 4–2 Y.K.
    Prayer of Azariah and Song of the Three:
      display_name: Libondeli ya Azaria mpe Loyembo ya Bato Misato
      author: Mokomi ayebani te; moko ya biteni ya Grɛki oyo babakisá na Daniele.
      audience: Bayuda oyo bazalaki koloba Grɛki — makambo ya losambo mpo na Daniele 3.
      date: Pene na ekeke ya 2 Y.K.
    Susanna:
      display_name: Suzana
      author: Mokomi ayebani te; moko ya biteni ya Grɛki oyo babakisá na Daniele.
      audience: Bayuda oyo bazalaki koloba Grɛki — lisolo ya bosembo mpe ya kopamela litatoli ya lokuta.
      date: Pene na ekeke ya 2–1 Y.K.
    1 Clement:
      display_name: Klemente ya Liboso
      author: Mokomi ayebani te, kasi batyaki yango na nkombo ya Klemente ya Roma.
      audience: Lisangá ya bakristo na Korinti, oyo ezalaki na matata mpo na bokambi.
      date: Pene na mobu 96 N.K.
