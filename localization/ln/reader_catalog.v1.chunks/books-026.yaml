    Letters of Ignatius:
      display_name: Mikanda ya Ignatius
      author: Ignatius, episkɔpɔ ya Antiokia, nde akomaki mikanda nsambo ya libongoli ya katikati oyo endimami mingi; mikanda ya Ignatius oyo ebakisamaki na nsima mpe oyo ekomamaki na nkombo na ye ezali na kati ya liboke oyo te.
      audience: Masangá ya bakristo na Efese, Magnesia, Tralles, Roma, Filadelfia mpe Smirna, elongo na Polikarpo; Ignatius akomelaki bango ntango azalaki kokende epai asengelaki kobomama mpo na kondima na ye.
      date: Mbala mingi, bakanisaka ete mikanda yango ekomamaki na ebandeli ya ekeke ya 2 T.B., mingimingi pene na mobu 105–117; kasi bato bazali naino koyokana te na ntina na badati ya sikisiki ya mobembo ya Ignatius.
