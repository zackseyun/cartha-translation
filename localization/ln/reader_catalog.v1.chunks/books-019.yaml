review:
  verdict: revise
  review_summary: Babongisi mwa maloba mpo na kozongisa ndimbola ya source na bosikisiki, mingimingi na makambo ya boyebi epai ya bana, nkombo oyo Tata abimisaka, bosikoli uta na masumu, litonya na Noa, mpe bapanzani na Babele. Makambo nyonso mosusu endimami lokola mabongoli ya bosembo.
  issues:
  - 'Gospel of Truth 3: bobongisi boyokani mpo na koloba ete Tata amonisi boyebi epai ya bana na ye.'
  - 'Gospel of Truth 7: bobongisi mpo na kobatela likanisi ya Tata, na nkombo, abimisi.'
  - 'Gospel of Truth 12: ''bosikoli na masumu'' ezali polele koleka ''lisiko ya masumu''.'
  - 'Jubilees 6: litonya esalaka boyokani na Noa; esengeli kosakola yango polele.'
  - 'Jubilees 10: bapanzani bazali bato, kasi ezalaki na Linɔ́ngi ya Babele.'
