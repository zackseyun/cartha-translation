    1 Enoch:
      display_name: 1 Enoka
      author: Mokomi ayebani te; buku yango epesami na nkombo ya Enoka, nkɔ́kɔ ya kala liboso ya Mpela, atako ye nde akomaki yango te. Ezali mosala oyo esangisami na biteni mingi oyo ekeseni.
      audience: Lisangá ya Bayuda oyo bazalaki kozela makambo ya nsuka mpe kokanisa mabe oyo etondi na molɔ́ngɔ́, kosambisama, mpe manaka ya mikolo; na nsima, buku yango etángamaki mpe na masangá ya bakristo ya liboso.
      date: Biteni na yango esangisamaki pene na ekeke ya 3 liboso ya Klisto tii na ekeke ya 1 nsima ya Klisto; makomi na yango mobimba ebatelamaki kaka na monɔkɔ ya Ge'ez (Ethiopie).
