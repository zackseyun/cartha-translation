  book_metadata:
    Hypostasis of the Archons:
      display_name: Hypostasis ya Bakonzi
      author: Mokomi ayebani te. Mokomi alimboli Ebandeli na nzela ya lisapo ya emoniseli oyo elobeli bakonzi; tokoki te kopesa yango na ntembe te epai ya moteyi moko oyo ayebani na nkombo.
      audience: Baklisto kati na etuluku ya Sɛti to oyo ekokani na yango, oyo batángaki Ebandeli lokola etumba kati na bayangeli ya molɔ́ngɔ́ bazangi boyebi, bwanya ya Nzambe, mpe ebandeli ya molimo ya bato.
      date: Mbala mingi batyaka yango na ekeke ya 3 nsima ya Klisto; ebatelamaki na kopi moko ya Kikɔpti ya ekeke ya 4, na Codex II ya Nag Hammadi.
    On the Origin of the World:
      display_name: Na Ntina ya Ebandeli ya Mokili
      author: Mokomi ayebani te. Mokanda yango esangisi mpe ebongoli mimeseno ndenge na ndenge ya Bayuda, ya Baklisto, ya Platon, mpe ya masapo ya kala, kozanga kopesa nkombo ya mosangisi na yango.
      audience: Batángi kati na ezalela ya boklisto oyo ezalaki kokende na makanisi ya Gnostisime, oyo bazalaki koluka lisolo mosusu ya bozalisi, ya bayangeli ya molɔ́ngɔ́, ya Sofia, ya Adama ná Eva, mpe ya nsuka ya mokili.
      date: Mbala mingi batyaka yango na ekeke ya 3 nsima ya Klisto, atako makambo ya kala ekoki kozala na nsé na yango; ebatelami mingimingi na bakomi ya Kikɔpti ya ekeke ya 4.
    Sophia of Jesus Christ:
      display_name: Bwanya ya Yesu Klisto
      author: Mokomi ayebani te. Mokomi abongoli makambo oyo eyebani mpe na Eugnostos mpo na kosala lisolo kati na Yesu mpe bayekoli na ye nsima ya lisekwa.
      audience: Baklisto oyo bazalaki kosepela na bwanya emonisami etali Nzambe oyo aleki nyonso, bobongisi ya mokili ya likoló, mpe ebandeli ná lobiko ya molimo.
      date: Mbala mingi batyaka yango na nsuka ya ekeke ya 2 to na ekeke ya 3 nsima ya Klisto; ebatelami na bakopi ya Kikɔpti ya Nag Hammadi mpe ya Codex ya Berlin.
    Gospel of the Egyptians:
      display_name: Sango Malamu ya Baebele ya Ezito
      author: Mokomi ayebani te. Mokanda oyo ya Nag Hammadi, oyo babengaka mpe Búku Mosantu ya Elimo Monene oyo Amonanaka Te, ekeseni na Sango Malamu ya Baebele ya Ezito ya kala na Grɛki, oyo eyebani kaka na biteni ya maloba oyo batángi.
      audience: Lisangá ya boklisto ya Sɛti oyo ezalaki kosalela masapo ya mindɔndɔ, bankombo mosantu, bililingi ya batisimo, mpe masanzoli mpo na kolimbola bomoto na bango ya molimo mpe kosikolama.
      date: Mbala mingi batyaka yango na ekeke ya 2 to ya 3 nsima ya Klisto; bakopi mibale ya Kikɔpti ebatelami na ba-codex ya Nag Hammadi ya ekeke ya 4.
    Letter of Peter to Philip:
      display_name: Mokanda ya Petelo epai ya Filipo
      author: Mokomi ayebani te. Mokanda mokuse ya ebandeli mpe emoniseli oyo elandi epesami na nkombo ya Petelo ná Filipo, kasi ekomamaki na nkombo na bango mpe tokoki te koloba ete moko na bango akomaki yango.
      audience: Baklisto oyo bazalaki koluka ndingisa ya bantoma mpo na mateya etali Mobikisi, nguya ya banguna, mpasi, mosala, mpe kozongisama ya bayekoli.
      date: Mbala mingi batyaka yango na nsuka ya ekeke ya 2 to na ebandeli ya ekeke ya 3 nsima ya Klisto; ebatelami na kopi moko ya Nag Hammadi ya ekeke ya 4 mpe na litatoli ya Kikɔpti ya nsima.
    Gospel of Judas:
      display_name: Sango Malamu ya Yuda
      author: Mokomi ayebani te. Motó ya mokanda epesi lisolo yango na nkombo ya Yuda, kasi mokanda yango emonisi te ete Yuda Iskariote azalaki mokomi na yango na lisolo ya solo.
      audience: Etuluku moko ya Baklisto oyo ezalaki kotelemela misala ya mbeka mpe ya eklezia ya bituluku mosusu, mpe ezalaki kosalela lisolo ya emoniseli mpe makanisi ya molɔ́ngɔ́ ya lolenge ya Sɛti mpo na kolimbola lisusu Yuda mpe liwa ya Yesu.
      date: Mbala mingi batyaka yango na katikati to na nsuka ya ekeke ya 2 nsima ya Klisto; Irénée ayebaki Sango Malamu moko ya Yuda pene na mobu 180, mpe kopi ya Kikɔpti oyo ebatelami ekoki kozala ya ekeke ya 3 to ya 4.
    Protoevangelium of James:
      display_name: Protoevangelium ya Yakobo
      author: Mokomi ayebani te. Molobeli amibengi Yakobo, kasi mokanda yango ekomamaki na nkombo ya moto mosusu mpe Yakobo, ndeko ya Yesu, akomaki yango te.
      audience: Baklisto oyo bazalaki kosepela na kobotama mpe kokola ya Maria, bopɛto na ye ya seko, kobotama ya Yesu, mpe biyano ya lisolo na mituna oyo Matai ná Luka batikaki polele.
      date: Mingimingi batyaka yango na ndambo ya mibale ya ekeke ya 2 nsima ya Klisto; ebatelami na bamaniskri mingi ya Grɛki ya nsima mpe na mabongoli ya kala.
