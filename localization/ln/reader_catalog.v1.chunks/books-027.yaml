  book_metadata:
    Polycarp to the Philippians:
      display_name: Polikarpe epai ya Bafilipi
      author: Polikarpe, episkɔpɔ ya Smirne. Bato mosusu ya mayele bakanisaka ete makomi oyo tokómela biso esangisi makambo oyo etindamaki na bantango koleka moko.
      audience: Lisangá ya bakristo na Filipi, oyo esɛngaki mikanda ya Ignace mpe ezwaki batoli na makambo ya kondima, etamboli, bokambi, mbongo mpe koyika mpiko.
      date: Na ebandeli to na katikati ya ekeke ya 2 nsima ya Klisto; ata eteni moko ezali na boyokani makasi na mobembo ya Ignace, nzokande likanisi oyo ete mokanda yango esangisi biteni ndenge na ndenge endimaka ete eteni mosusu ekoki kozala mwa nsima.
    Martyrdom of Polycarp:
      display_name: Liwa ya Polikarpe mpo na kondima
      author: Bato ya lingomba ya Smirne oyo bankombo na bango eyebani te, bakomaki na nkombo ya lisangá na bango; maloba ya nsuka oyo elobeli ndenge makomi yango epesamaki emonisi ete bakopisaki mpe bapalanganisaki yango na nsima.
      audience: Lingomba ya Filomeliume mpe lisangá mobimba ya bakristo, oyo bazwaki lisolo ya ndenge bakangaki Polikarpe, basambisaki ye, abomamaki, mpe ayikaki mpiko na ndenge oyo esengeli kolanda.
      date: Ekomamaki nsima ya liwa ya Polikarpe, mpe mbala mingi batyaka yango na katikati to na nsuka ya ekeke ya 2 nsima ya Klisto; mbula mpenza oyo abomamaki mpo na kondima mpe lolenge ya nsuka ya mokanda yango ezali naino kotyelama ntembe.
    Epistle to Diognetus:
      display_name: Mokanda epai ya Diognète
      author: Nkombo ya mokomi eyebani te. Mokomi amibengi moyekoli, kasi ekoki te koyeba na bosolo soki ye to Diognète oyo akomelaki azalaki nani.
      audience: Moto moko ya kelasi oyo azalaki mokristo te mpe azalaki koluka koyeba—ná batángi mosusu lokola ye—oyo atunaki mituna mpo na losambo ya bakristo, bizaleli na bango, esika na bango kati na bato, bolingo, mpe ntina oyo kondima yango emonanaki lokola likambo ya sika.
      date: Mbala mingi batyaka yango na nsuka ya ekeke ya 2 to na ebandeli ya ekeke ya 3 nsima ya Klisto, atako makanisi ekeseni mingi; mikapo mibale ya nsuka ekoki kouta na mokanda mosusu.
    Fragments of Papias:
      display_name: Biteni ya makomi ya Papias
      author: Papias, episkɔpɔ ya Hierapolisi, mpo na buku na ye ya biteni mitano oyo ebungá, Bandimbola ya maloba ya Nkolo; biteni oyo etikalá ezali maloba oyo bakomi ya nsima bazongelaki mpe bansango oyo babatelaki.
      audience: Bakristo ya liboso oyo bazalaki koluka mateya oyo bato bazalaki kokanisa mpo na Yesu mpe bantoma, oyo esangisamaki na nzela ya milɔngɔ ya bato oyo bankombo na bango epesami, oyo bapesaki litatoli mpe bandimbola na monɔkɔ.
      date: Mbala mingi batyaka mosala ya Papias na ebandeli ya ekeke ya 2 nsima ya Klisto, mingimingi pene na mobu 110–130; biteni oyo etikalá ezali na mikanda ya bakomi oyo bakomaki kobanda na ekeke ya 2 mpe na nsima.
