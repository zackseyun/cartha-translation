review:
  verdict: revise
  review_summary: Nabongisi maloba oyo ezalaki kobongola ndimbola na mitó ya mikapo, mingimingi oyo etali kofinga Klisto, kosɛka makaneli ya liwa, kolonga Satana, mpe Yoane koyebisa Papias Nsango Malamu. Biloko nyonso ezali mobimba mpe bafungola ya source etikalaki ndenge ezalaki.
  issues:
  - 'Martyrdom of Polycarp 11: draft rendered “blame Christ” rather than “blaspheme Christ.”'
  - 'Martyrdom of Polycarp 12: draft softened “mocks threats of death”; corrected to explicit mockery.'
  - 'Fragments of Papias 8: draft stated that Satan did not win, rather than Satan’s defeat.'
  - 'Fragments of Papias 16: draft changed dictation of the Gospel into an instruction to write it.'
