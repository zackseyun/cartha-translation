review:
  verdict: revise
  review_summary: Nabongisi maloba moke oyo ezalaki kopesa ndimbola ekeseni to oyo ezalaki polele te; biteni mosusu ezali na boyokani na source ya Lingelesi.
  issues:
  - Genesis 3 ebongisami mpo eloba kokwea longwa na Edene, kasi bobungisi kaka bomoi te.
  - Genesis 22 ebongisami mpo eloba kopesa Yisaka mbeka, kasi kokana kaka te.
  - Genesis 30 elongoli kobakisa Nzambe oyo source elobi te.
  - 'Exodus 8 ebongisami: plagues ezali bampasi, kasi bamaladi te.'
  - Exodus 21 ebongisami mpo ezala mibeko ya makambo (case laws), kasi koloba kobatela bonsomi te.
