  book_metadata:
    Genesis:
      display_name: Ebandeli
      author: Mokomi ayebani te; engebene mimeseno, mokanda yango ekomamaki na Moize. Bato ya mayele ya mikolo na biso bamonaka ete mokanda yango esalemaki mokemoke na boumeli ya ntango molai, na kosangisáká makomi oyo eutaki na bisika ndenge na ndenge mpe ebongisamaki na nsima mpo ekóma mokanda moko.
      audience: Yisraele, lokola bato oyo bazali na boyokani na Nzambe, mpo báyeba ete lisolo ya ebandeli na bango epikami na bozalisi ya Nzambe, kopona na ye mpe elaka na ye.
      date: Ekomamaki mokemoke na boumeli ya bikeke mingi; ezwaki lolenge oyo toyebi pene na ekeke ya 6–5 L.T.B., na ntango ya bowumbu na Babilone to nsima na yango.
      summary: Ebandeli elobeli bozalisi, botomboki ya bato mpe kopalangana na bango, mpe libota ya Abrahama, Yisaka, Yakobo ná Yozefe, oyo na nzela na bango bilaka ya boyokani ya Nzambe epai ya Yisraele ebandi.
    Exodus:
      display_name: Kobima
      author: Mokomi ayebani te; engebene mimeseno, mokanda yango ekomamaki na Moize. Bato ya mayele ya mikolo na biso bamonaka ete mokanda yango esalemaki mokemoke na boumeli ya ntango molai, na kosangisáká makomi oyo eutaki na bisika ndenge na ndenge mpe ebongisamaki na nsima mpo ekóma mokanda moko.
      audience: Yisraele, lokola bato oyo basikolamaki mpe bakɔtaki na boyokani, mpo báyekola ndimbola ya kozala ekólo ya YAWE oyo etambwisami na mobeko na ye.
      date: Ekomamaki mokemoke na boumeli ya bikeke mingi; ezwaki lolenge oyo toyebi pene na ekeke ya 6–5 L.T.B.
    Leviticus:
      display_name: Balevi
      author: Mokomi ayebani te; engebene mimeseno, mokanda yango ekomamaki na Moize. Bato ya mayele ya mikolo na biso batyaka yango na makomi oyo babengaka liziba ya Banganga-nzambe.
      audience: Banganga-nzambe ya Yisraele mpe lisangá ya basambeli — malako mpo na bambeka, bosantu mpe kobongisa bomoi zingazinga ya bozali ya Nzambe.
      date: Biteni na yango ekomamaki na bileko ndenge na ndenge, banda na nsuka ya bokonzi ya bakonzi tii na eleko oyo elandaki bowumbu (pene na ekeke ya 7–5 L.T.B.).
