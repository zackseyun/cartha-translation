  - Revelation 10 now refers to the final time rather than asserting time has ended.
  - Judith 1, 3, and 6 corrected attack/surrender/agency meanings.
  - Greek Additions to Esther 6 now preserves that Mordecai prophesies.
  - Wisdom of Solomon 5 now explicitly names the wickedness exposed.
