payload:
  book_metadata:
    James:
      display_name: Yakobo
      author: Na bonkɔkɔ, Yakobo ndeko ya Yesu; bato ya mayele ya mikolo na biso bazali na likanisi moko te soki ye moko nde akomaki yango to moto mosusu akomaki yango na nkombo na ye.
      audience: Masangá ya Bayuda oyo bakómaki bakristo mpe bapanzanaki na mikili mosusu.
      date: Pene na bambula 50–60 nsima ya Klisto, soki ye moko nde akomaki yango; pene na nsuka ya ekeke ya 1 nsima ya Klisto, soki moto mosusu akomaki yango na nkombo na ye.
    1 Peter:
      display_name: 1 Petelo
      author: Na bonkɔkɔ, ntoma Petelo, mpe Silvano azalaki mokomi na ye; bato mosusu ya mayele bakanisaka ete moto mosusu akomaki yango na nkombo ya Petelo.
      audience: Bakristo ya Azia Moke oyo ezalaki na nse ya bokonzi ya Roma mpe bazalaki kokutana na bonguna ya bato.
      date: Pene na bambula 60 nsima ya Klisto, soki Petelo nde akomaki yango; pene na bambula 70–90 nsima ya Klisto, soki moto mosusu akomaki yango na nkombo na ye.
    2 Peter:
      display_name: 2 Petelo
      author: Na bonkɔkɔ, Petelo; bato mingi ya mayele ya mikolo na biso bakanisaka ete moto mosusu akomaki yango na nkombo na ye.
      audience: Bakristo oyo bazalaki kokutana na batyoli oyo bawanganaki bozongi ya Klisto.
      date: Pene na ebandeli ya ekeke ya 2 nsima ya Klisto.
    1 John:
      display_name: 1 Yoane
      author: Nkombo ya mokomi eyebani te; na bonkɔkɔ, ntoma Yoane to nkulutu moko ya lisangá ya Yoane.
      audience: Lisangá ya Yoane nsima ya bokabwani, ntango bazalaki kolimbola nani azali mpenza moto ya lisangá.
      date: Pene na bambula 90–110 nsima ya Klisto.
    2 John:
      display_name: 2 Yoane
      author: “Nkulutu.”
      audience: Lisangá moko boye ya bakristo (“mwasi oyo aponami”) oyo bakebisaki mpo na bateyi ya lokuta.
      date: Pene na bambula 90–110 nsima ya Klisto.
    3 John:
      display_name: 3 Yoane
      author: “Nkulutu.”
      audience: Gayusi, mokambi moko oyo azalaki koyamba bamisionɛrɛ oyo bazalaki kosala mibembo.
      date: Pene na bambula 90–110 nsima ya Klisto.
    Jude:
      display_name: Yuda
      author: Na bonkɔkɔ, Yuda, ndeko ya Yakobo mpe ya Yesu.
      audience: Masangá ya bakristo oyo bateyi ya etamboli ya mbindo bazalaki kokɔtela.
      date: Pene na bambula 60–90 nsima ya Klisto.
    Revelation:
      display_name: Emoniseli
      author: Yoane ya Patmosi (lolenge na ye ya kokoma ekeseni na oyo ya Nsango Malamu ya minei).
      audience: Masangá nsambo ya bakristo na Azia Moke oyo ezalaki na nse ya bokonzi ya Roma mpe na mpasi ya bokonzi ya ampire.
      date: Pene na bambula 90 nsima ya Klisto; na bonkɔkɔ, na boyangeli ya Domitien.
    Tobit:
      display_name: Tobiti
      author: Nkombo ya mokomi eyebani te.
      audience: Bayuda oyo bapanzanaki na mikili mosusu mpe bazalaki koluka kobatela ezaleli ya komipesa na Nzambe, libala mpe kondima ete Nzambe azali kotambwisa makambo na nse ya bokonzi ya bapaya.
      date: Pene na bambula 225–175 liboso ya Klisto; ekomamaki na Aramɛyɛ, mpe makomi ya Liebele ezwami mpe na Qumran.
    Judith:
      display_name: Yuditi
      author: Nkombo ya mokomi eyebani te.
      audience: Bayuda oyo bazalaki na nse ya likama ya bapaya — lisolo ya mpiko ya kotɛmɛla bango na ezaleli ya komipesa na Nzambe.
      date: Pene na bambula 150–100 liboso ya Klisto.
    Greek Additions to Esther:
      display_name: Makambo ebakisami na Estere na monɔkɔ ya Grɛki
      author: Nkombo ya mokomi eyebani te; makambo ya kobakisa oyo batyaki na libongoli ya Estere na monɔkɔ ya Grɛki.
      audience: Bayuda oyo bazalaki koloba Grɛki mpe balingaki lisolo ya Estere oyo ezali na mabondeli mpe elobeli Nzambe polele.
      date: Pene na ekeke ya 2–1 liboso ya Klisto.
    Wisdom of Solomon:
      display_name: Bwanya ya Salomo
      author: Nkombo ya mokomi eyebani te; batyaki yango na nkombo ya Salomo atako ye akomaki yango te. Mokomi moko Moyuda oyo azalaki na mimeseno ya Bagrɛki akomaki yango na Grɛki, mbala mosusu na Alekizandria.
      audience: Bayuda oyo bazalaki na mimeseno ya Bagrɛki, bazalaki kotalela filozofi ya Bagrɛki mpe kolongisa bwanya ya Yisraele liboso ya banzela mosusu ya bapakano mpe ya bapɛngwi.
      date: Pene na mobu 50 liboso ya Klisto kino mobu 50 nsima ya Klisto.
