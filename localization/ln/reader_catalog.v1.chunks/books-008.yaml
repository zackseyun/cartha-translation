review:
  verdict: revise
  review_summary: Bobongisi esalemi mpo na kopesa ndimbola ya sembo na Lingala, kobatela makambo ya istware na metadonnées, mpe kosilisa libunga ya mongongo na Yilimia 24.
  issues:
  - Yilimia 24 ezalaki koloba na lolenge ya kozanga mokumbi («bato bamemaki»); ebongisami na «bato oyo bamemamaki na bowumbu».
  - Biteni mosusu ebongisami mpo na kopesa maloba ya source na bosɛmbo mpe na Lingala ya polele, na ndakisa Yisaya 8, 24, mpe 33.
  - Mikolo «BC» elimbolami polele lokola «liboso ya Klisto».
