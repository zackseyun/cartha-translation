      author: Bakomi mingi na boumeli ya bikeke; mikapo 1–39 esimbami na Yisaya ya Yerusaleme, na ekeke ya 8, nzokande mikapo 40–55 («Yisaya ya Mibale») mpe 56–66 («Yisaya ya Misato») eyano na ntango ya bowumbu mpe bozongi.
