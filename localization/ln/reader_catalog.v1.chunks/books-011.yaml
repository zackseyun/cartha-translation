      author: Nkomi ayebani te; engebene na bonkoko, Luka, moninga ya Paulo na mibembo, nde akomaki yango.
      audience: Bakristo ya mimeseno ya Bagreke mpe Baroma oyo bayekolá kotánga mpe kokoma; mokanda yango ekomelamaki «Teofilo».
      date: Pene na mobu 80–90 nsima ya Klisto.
    John:
      display_name: Yoane
      author: Nkomi ayebani te; engebene na bonkoko, ntoma Yoane to «moyekoli oyo Yesu azalaki kolinga» nde akomaki yango.
      audience: Lisangá moko ya Bakristo oyo ezalaki na matata ná losambo ya Bayuda ya sinagoga, mpe oyo esalemaki zingazinga ya litatoli ya moyekoli oyo Yesu azalaki kolinga.
      date: Pene na mobu 90–110 nsima ya Klisto.
      summary: Yoane amonisi Yesu lokola Liloba ya seko oyo amonisi Tata, apesi bomoi na baoyo batyelaka ye motema, mpe azwi nkembo na nzela ya bilembo na ye, liwa na ye mpe lisekwa na ye.
    Acts:
      display_name: Misala ya Bantoma
      author: Nkomi ayebani te; ezali nkomi moko ná oyo akomaki Luka.
      audience: Bakristo ya mimeseno ya Bagreke mpe Baroma; ezali buku ya mibale ya mosala oyo ekomelamaki Teofilo.
      date: Pene na mobu 80–90 nsima ya Klisto.
    Romans:
      display_name: Baroma
      author: Paulo, elongo na Tertio oyo akomaki mokanda yango.
      audience: Bakristo ya Roma—bandimi Bayuda mpe bato ya bikólo mosusu oyo bazalaki na matata mpo na Mobeko ya Moize mpe bomoto na bango.
      date: Pene na mobu 56–58 nsima ya Klisto; ekomamaki na Korinti.
