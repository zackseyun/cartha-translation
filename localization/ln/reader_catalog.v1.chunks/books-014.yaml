    Sirach:
      display_name: Sirake
      author: Yeshua mwana ya Eleazare, mwana ya Sira, moto ya Yerusaleme; mwana ya mwana na ye ya mobali abongolaki yango na Grɛki.
      audience: Bilenge mibali Bayuda oyo bazalaki koteyama bwanya na Yerusaleme na eleko ya mimeseno ya Bagrɛki.
      date: Makomi ya ebandeli na Ebre, soki na mobu 195–175 L.T.B.; libongoli ya Grɛki, soki na mobu 132 L.T.B.
    Baruch:
      display_name: Baruku
      author: Mokomi ayebani te; buku yango ekomamaki lokola nde Baruku, mokomi ya Yirimia, nde akomaki yango.
      audience: Bayuda oyo bazalaki kofanda mosika na mboka na bango mpe bazalaki kokanisa na mozindo mpo na bowumbu, kobongola motema mpe bwanya.
      date: Soki na ekeke ya 2 L.T.B.
    1 Maccabees:
      display_name: 1 Makabe
      author: Mokomi ayebani te; ekoki kozala ete azalaki moto ya Yerusaleme mpe akomaki na Ebre (bobele makomi ya Grɛki nde ebatelamaki).
      audience: Bayuda ya eleko ya botomboki ya Bahasomone mpe ya nsima na yango; lisolo yango emonisi ntina oyo libota ya bakonzi Bahasomone ezalaki na lotomo ya koyangela.
      date: Soki na mobu 100 L.T.B.
    2 Maccabees:
      display_name: 2 Makabe
      author: Mokomi moko oyo ayebani te asalaki mokuse ya buku moko molai ya Yasona moto ya Sirene; akomaki yango na Grɛki.
      audience: Bayuda ya mikili mosusu oyo bazalaki koloba Grɛki — buku yango ezali kolobela mingi liwa mpo na kondima, libateli ya Nzambe mpe lisekwa.
      date: Soki na mobu 124 L.T.B. to mwa moke nsima na yango.
