  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Nsango Malamu ya Bomwana ya Toma
      author: Mokomi ayebani te. Lolenge na yango ya kala koleka oyo ekoki kozongisama eyebisi nkombo ya mokomi te; kobenga yango mosala ya Toma euti na mitó ya makomi mpe na ndenge oyo ekomaki kopalangana na nsima.
      audience: Bakristo oyo balingaki koyeba makambo ya bomwana ya Yesu mpe ndenge nguya ya Nzambe, disiplini, koyekola mpe kokola na ye ekokaki kolobelama liboso ya ebandeli ya masolo ya Nsango Malamu oyo endimami na Biblia.
      date: Mbala mingi balobaka ete ebandaki na ekeke ya 2 nsima ya Klisto, kasi makomi yango ebatelami na mitindo mingi ya Grɛki oyo ekeseni mpenza, mpe na mabongoli ya kala.
    Acts of Paul and Thecla:
      display_name: Misala ya Paulo ná Tekla
      author: Mokomi ayebani te. Ezali eteni moko ya Misala ya Paulo, oyo ezali mokanda monene koleka; lapolo moko ya kala oyo elobaka ete mokambi moko ya lingomba nde akomaki Misala yango epesi biso nzela te ya koyeba na ntembe te soki mokomi azalaki nani.
      audience: Bakristo oyo basepelaki na masolo ya kosakola ya bantoma, koboya libala, batisimo, koyika mpiko lokola bamartiri, mpe bokonzi ya mwasi ya koteya mpe kopesa litatoli.
      date: Ekomamaki na ekeke ya 2 nsima ya Klisto, mbala mosusu na ndambo na yango ya nsuka; epalanganaki ezala na kati ya Misala ya Paulo to lokola mokanda oyo etɛlɛmi yango moko.
    Gospel of Peter:
      display_name: Nsango Malamu ya Petelo
      author: Mokomi ayebani te. Lisolo oyo ebatelami elobi lokola nde Petelo azali koloba mpe epalanganaki na nkombo na ye, kasi batalelaka yango te lokola mosala ya Petelo, ntoma oyo azalaki mpenza na lisolo ya kala.
      audience: Bakristo ya liboso oyo balingaki lisolo ya molai koleka ya mpasi, liwa mpe lisekwa ya Yesu, mbala mosusu na masanga oyo bokonzi ya Petelo ezalaki na motuya mingi.
      date: Mbala mingi batyaka yango na ekeke ya 2 nsima ya Klisto; eteni monene ya Grɛki oyo ebatelami euti na mokanda moko ya nsima mpenza oyo bamonaki na Akhmim.
    2 Clement:
      display_name: 2 Klema
      author: Mokomi ayebani te. Atako nkombo na yango ya bonkɔkɔ, oyo ezali liteya moko ya bokristo ya kala, kasi mokanda ya mibale ya Klema ya Roma te.
      audience: Lisangá moko ya bakristo oyo bazali kolendisama bábongola motema, bálanda bizaleli malamu ntango nyonso, bábatela bato ya bolɛmbu, mpe báyika mpiko na bosembo nyonso, wana bazali kozela lisekwa mpe kosambisama.
      date: Mbala mingi batyaka yango na ndambo ya liboso to na katikati ya ekeke ya 2 nsima ya Klisto (pene na mobu 100–160); esika oyo ekomamaki eyebani te.
    Epistle of Barnabas:
      display_name: Mokanda ya Barnaba
      author: Mokomi ayebani te. Na bonkɔkɔ, bazalaki kokangisa mokanda yango na Barnaba, moninga ya Paulo, kasi bato ya mayele ya mikolo na biso bandimaka te ete ye nde akomaki yango.
      audience: Bakristo oyo bazalaki Bayuda te, oyo bazalaki koteyama bámona Makomami ya Yisraele lokola ya bango na nzela ya ndimbola oyo etali Klisto mpe ya bilembo, wana bazali kokesenisa bomoto na bango ya kondimana na misala ya losambo ya Bayuda.
      date: Mbala mingi batyaka yango kati na kobebisama ya tempelo ya Yerusaleme na mobu 70 nsima ya Klisto mpe ebandeli ya ekeke ya 2, mingi mpenza pene na mobu 80–130.
