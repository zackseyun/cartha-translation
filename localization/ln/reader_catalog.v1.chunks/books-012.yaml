    1 Corinthians:
      display_name: 1 Bakorinti
      author: Paulo, elongo na Sostene.
      audience: Lisangá ya bakristo ya Korinti, oyo ezalaki na bokabwani mpe matata.
      date: Pene na mobu 53–55 T.B., ekomamaki uta na Efese.
    2 Corinthians:
      display_name: 2 Bakorinti
      author: Paulo, elongo na Timote.
      audience: Lisangá ya Korinti, nsima ya matata moko ya mpasi.
      date: Pene na mobu 55–56 T.B.
    Galatians:
      display_name: Bagalatia
      author: Paulo.
      audience: Masangá ya bakristo ya Galatia (na katikati ya Anatolia), oyo bazalaki kotya bango mbamba ete bándima kokatama ngenga mpe kotosa Mobeko ya Mose.
      date: Pene na mobu 48–55 T.B. (likambo yango ezali naino kolobelama).
    Ephesians:
      display_name: Baefese
      author: Paulo, to moyekoli moko ya penepene oyo akomaki na nkombo ya Paulo (likambo yango ezali naino kolobelama).
      audience: Bakristo ya Azia na motindo ya monene; nkombo ya esika “Efese” ezali te na bamaniskri ya kala koleka.
      date: Pene na bambula 60 T.B. soki Paulo nde akomaki yango; pene na bambula 80–90 T.B. soki moto mosusu akomaki na nkombo na ye.
    Philippians:
      display_name: Bafilipi
      author: Paulo, elongo na Timote.
      audience: Lisangá ya bakristo ya Filipi, koloni moko ya Roma na Makedonia.
      date: Pene na mobu 60–62 T.B., ekomamaki na bolɔkɔ.
    Colossians:
      display_name: Bakolose
      author: Paulo, elongo na Timote — to moyekoli moko ya penepene oyo akomaki na nkombo ya Paulo (likambo yango ezali naino kolobelama).
      audience: Bakristo ya Kolose, na lobwaku ya Likuse, oyo bazalaki kokutana na mateya oyo esangisaki bindimeli ndenge na ndenge.
      date: Pene na mobu 60–62 T.B. soki Paulo nde akomaki yango; na nsima koleka soki moto mosusu akomaki na nkombo na ye.
    1 Thessalonians:
      display_name: 1 Batesaloniki
      author: Paulo, elongo na Silvano mpe Timote.
      audience: Lisangá ya sika ya bakristo na Tesaloniki, oyo ezalaki konyokwama.
      date: Pene na mobu 50–51 T.B. — mbala mosusu yango nde mokanda ya Paulo ya kala koleka oyo ebatelami.
    2 Thessalonians:
      display_name: 2 Batesaloniki
      author: Paulo (likambo yango ezali naino kolobelama; bato mosusu ya mayele balobaka ete moto mosusu akomaki yango na nkombo ya Paulo).
      audience: Lisangá ya Tesaloniki, mpo na kosilisa mobulungano oyo etali makambo ya nsuka.
      date: Pene na mobu 51 T.B. soki Paulo nde akomaki yango.
    1 Timothy:
      display_name: 1 Timote
      author: Paulo, to moyekoli moko oyo akomaki na nkombo ya Paulo (bato mingi ya mayele bandimaka ete mikanda oyo babengaka Mikanda ya Babateli ekomamaki na bato mosusu na nkombo ya Paulo).
      audience: Timote, lokola momonisi ya Paulo na Efese; malako mpo na ndenge lisangá esengelaki kobongisama na nsima.
      date: Pene na katikati ya bambula 60 T.B. soki Paulo nde akomaki yango; pene na mobu 90–110 T.B. soki moto mosusu akomaki na nkombo na ye.
    2 Timothy:
      display_name: 2 Timote
      author: Paulo, to moyekoli moko oyo akomaki na nkombo ya Paulo.
      audience: Timote — mokanda yango elakisami lokola maloba ya nsuka ya Paulo uta na bolɔkɔ.
      date: Pene na katikati ya bambula 60 T.B. soki Paulo nde akomaki yango; pene na mobu 90–110 T.B. soki moto mosusu akomaki na nkombo na ye.
    Titus:
      display_name: Tito
      author: Paulo, to moyekoli moko oyo akomaki na nkombo ya Paulo.
      audience: Tito, lokola momonisi ya Paulo na Krete.
      date: Pene na katikati ya bambula 60 T.B. soki Paulo nde akomaki yango; pene na mobu 90–110 T.B. soki moto mosusu akomaki na nkombo na ye.
    Philemon:
      display_name: Filemo
      author: Paulo, elongo na Timote.
      audience: Filemo, mokristo oyo azalaki nkolo ya moombo moko, mpo na Onesime, moombo na ye oyo akimaki.
      date: Pene na mobu 60–62 T.B.
    Hebrews:
      display_name: Baebre
      author: Nkombo eyebani te. Mimeseno etángá Paulo, Apolose, Barnabasi, Prisila mpe bato mosusu; kasi likanisi moko te endimami na bato nyonso.
      audience: Bakristo Bayuda oyo bazalaki koloba Grɛki mpe bazalaki na komekama ya kozonga nsima na kondima ya bokristo oyo bazalaki koyambola.
      date: Pene na mobu 60–95 T.B.
