payload:
  book_metadata:
    Gospel of Mary:
      display_name: Nsango Malamu ya Maria
      author: Mokomi ayebani te. Mokanda yango elakisi Maria lokola moto oyo azwaki emoniseli ya Yesu mpe alimbolaki yango, kasi elobi te ete Maria nde akomaki nsango malamu oyo ebatelamaki.
      audience: Batángi bakristo ya ntango ya ebandeli oyo bazalaki koluka kososola emoniseli, komata na molimo, bokonzi ya bantoma, mpe soki mateya ya Maria kati na bayekoli ya Yesu ezalaki na ntomo.
      date: Mbala mingi batyaka yango na ekeke ya 2 T.B.; biteni na yango na monɔkɔ ya Grɛki, ya ekeke ya 3, ebatelamaki, mpe litatoli na yango ya ntina mingi na monɔkɔ ya Copte ebatelami na Codex ya Berlin 8502, ya ekeke ya 5.
    Treatise on the Resurrection:
      display_name: Lisolo na ntina ya Lisekwa
      author: Mokomi ayebani te. Mokanda yango ebongisami lokola mokanda ya moteyi epai ya moyekoli moko na nkombo Rheginos; tokoki koyeba na bosolo te ezala moteyi yango to Rheginos.
      audience: Bakristo oyo bazalaki koluka mateya na ntina ya lisekwa, mingimingi batángi oyo bazalaki kotalela lisekwa ya nzoto, lisekwa ya molimo, mpe kosangana banda sikoyo na bomoi ya lisekwa.
      date: Mbala mingi batyaka yango pene na nsuka ya ekeke ya 2 T.B. (mbala mingi soki na mobu 170–200); ebatelami na kopi moko ya Copte ya ekeke ya 4, oyo ebongolamaki uta na mokanda ya kala koleka na Grɛki.
    Dialogue of the Savior:
      display_name: Masolo na Mobikisi
      author: Mokomi ayebani te. Masolo yango etye mateya ya emoniseli na monɔkɔ ya Yesu ntango azali kosolola na Yuda, Matai mpe Maria, kasi eyebisi te moto oyo asangisaki yango.
      audience: Etuluku moko ya bakristo ya ntango ya ebandeli oyo bazalaki kosepela na emoniseli ya sekele, kozala moyekoli, komiyeba, libondeli, mpe komibongisa na bomoi ya komipekisa mpo na lobiko.
      date: Mbala mingi batyaka yango na ekeke ya 2 T.B., atako bato bazali naino koyokana te na ntina ya biteni ndenge na ndenge oyo esangisaki mokanda yango mpe dati na yango ya sikisiki; ebatelami na maniskri moko ya Copte ya ekeke ya 4.
    Exegesis on the Soul:
      display_name: Ndimbola na ntina ya Molimo
      author: Mokomi ayebani te. Mokomi azali moteyi mokristo oyo alimboli lisusu bililingi ya Biblia mpe ya mikanda ya Grɛki lokola lisese oyo elobeli kokwea, kobongola motema mpe kozongisama ya molimo.
      audience: Bakristo oyo bayebaki Makomami mpe maloba ya kolendisa bizaleli malamu, mpe bazalaki kobengama bátika bamposa ya mobulu, bábongola motema mpe básangana lisusu na Nzambe.
      date: Mingimingi batyaka yango na nsuka ya ekeke ya 2 to na ebandeli ya ekeke ya 3 T.B.; ebatelami na libongoli ya Copte ya ekeke ya 4, oyo eutaki na Grɛki.
    Book of Thomas the Contender:
      display_name: Mokanda ya Toma Mobundi
      author: Mokomi ayebani te. Motó ya likambo oyo ezali na nsuka na yango ekangisi mokanda yango na Yuda Toma mpe etángi Mathaias lokola mokomi ya makambo yango, kasi wana ezali bankombo oyo mokanda moko emipesi, kasi te bilembeteli oyo ekoki kondimisa nani akomaki yango.
      audience: Bakristo oyo bazalaki komipesa na bomoi ya komipekisa, mpe bazalaki kolendisama báluka komiyeba, bátɛmɛla bamposa ya nzoto mpe básosola mateya ya sekele oyo Yesu apesaki Toma.
      date: Mbala mingi batyaka yango na nsuka ya ekeke ya 2 to na ebandeli ya ekeke ya 3 T.B., mbala mosusu na esika moko ya bakristo na Siri; ebatelami na maniskri moko ya Copte ya ekeke ya 4.
    Tripartite Tractate:
      display_name: Lisolo ya Biteni Misato
      author: Mokomi ayebani te. Mokomi azalaki moto ya teoloji mokristo ya etuluku ya Valentin, oyo atángá mingi; tokoki te koyeba na bosolo ete azalaki moteyi boye to boye oyo nkombo na ye eyebani.
      audience: Lisangá moko ya bakristo ya etuluku ya Valentin, oyo ezalaki kozwa mateya ya mozindo na ntina ya Nzambe, baéon, bozalisi, Kristo, lingomba, lobiko mpe kozongisama ya nsuka.
      date: Mbala mingi batyaka yango na ekeke ya 3 T.B., atako bato mosusu bakanisaka ete ekomamaki nde na ndambo ya mibale ya ekeke yango; ebatelami na monɔkɔ ya Copte na Codex Jung ya ekeke ya 4.
    Apocryphon of John:
      display_name: Mokanda ya Sekele ya Yoane
      author: Mokomi ayebani te. Mokanda yango emipesi nkombo ya moto mosusu mpe elobi ete ezali emoniseli oyo Yesu, nsima ya kosekwa, apesaki Yoane mwana ya Zebede; ebatelami na mitindo mingi koleka moko ya kala.
      audience: Bakristo ya momeseno ya emoniseli ya Basete to ya momeseno moko oyo ekokani mpenza na yango, oyo bazalaki koluka lisolo na ntina ya mokili ya bonzambe, bozalisi, bomoto ya bato mpe kosikolama na bakonzi oyo bazalaki kobundisa bango.
      date: Ekoki kozala ete lolenge moko ya ebandeli epalanganaki na ekeke ya 2 T.B.; batatoli ya Copte oyo ebatelami, oyo ezali na lolenge ya mokuse mpe ya molai, ezali ya ekeke ya 4 mpe ya 5.
