review:
  verdict: revise
  review_summary: Complete Lingala revision supplied. Corrected inaccurate references to the first century, strengthened several historical descriptions, and refined titles where the draft weakened or altered the English sense.
  issues:
  - Two audiences incorrectly described their readership as first-century Christians rather than early Christians.
  - The Gospel of Mary date description treated the principal Coptic witness as merely the first witness.
  - Several wording choices were refined for source fidelity, including hostile rulers, homilist, copied order, and prayer that rises beyond.
