payload:
  book_metadata:
    Joel:
      display_name: Yoele
      author: Yoele, mwana ya Petuele.
      audience: Yuda nsima ya bowumbu, ntango bazalaki koyanola na likama ya mabanki lokola elembo ya Mokolo ya YAWE.
      date: Ekoki kozala pene na ekeke ya 5–4 liboso ya Klisto.
    Amos:
      display_name: Amose
      author: Amose moto ya Tekoa, mobateli ya mpate ya Yuda oyo asakolaki na bokonzi ya nɔrdi.
      audience: Yisraele ya nɔrdi na eleko ya bozwi mpe kozanga bosembo na boyangeli ya Yeroboame II.
      date: Pene na mobu 760–750 liboso ya Klisto.
    Obadiah:
      display_name: Obadia
      author: Obadia.
      audience: Yuda nsima wana Edome ateki Yerusaleme — esakweli ya kokwea ya Edome.
      date: Mwa moke nsima ya mobu 586 liboso ya Klisto.
    Jonah:
      display_name: Yona
      author: Mokomi ayebani te; moto monene na lisolo ezali Yona, mwana ya Amitai.
      audience: Yisraele nsima ya bowumbu — lisolo ya kosɛkisa mpo na komikangela na bato ya ekólo na bango moko, mpe kondimisa motema mawa ya Nzambe epai ya bato ya bikólo mosusu.
      date: Ekoki kozala pene na ekeke ya 5–4 liboso ya Klisto.
    Micah:
      display_name: Mika
      author: Mika moto ya Moreshete.
      audience: Yuda na nsuka ya ekeke ya 8 liboso ya Klisto, mingimingi babola ya bamboka oyo banyokolamaki na bakonzi mpe bazwi ya bingumba.
      date: Pene na mobu 740–700 liboso ya Klisto.
    Nahum:
      display_name: Nahume
      author: Nahume moto ya Elekoshe.
      audience: Yuda oyo esepelaki mpo ete kokwea ya Ninive ekómaki pene.
      date: Mwa moke liboso ya mobu 612 liboso ya Klisto.
    Habakkuk:
      display_name: Habakuku
      author: Habakuku.
      audience: Yuda ntango Babilone ezalaki kokóma nguya — lisolo kati na mosakoli mpe Nzambe na ntina etali bosembo.
      date: Pene na nsuka ya ekeke ya 7 liboso ya Klisto.
    Zephaniah:
      display_name: Sofonia
      author: Sofonia, mwana ya Kushi.
      audience: Yuda na boyangeli ya Yosia, mwa moke liboso abongisa makambo ya ekólo.
      date: Pene na mobu 640–609 liboso ya Klisto.
    Haggai:
      display_name: Hagai
      author: Hagai.
      audience: Baoyo bazongaki na bowumbu mpe bazalaki kotonga lisusu tempelo na boyangeli ya Dariuse.
      date: Mobu 520 liboso ya Klisto.
    Zechariah:
      display_name: Zekaria
      author: Zekaria, mwana ya Berekia; ekoki kozala ete moto mosusu akomaki mikapo 9–14 na eleko moko ya nsima.
      audience: Baoyo bazongaki na bowumbu mpe bazalaki kotonga lisusu tempelo, mpe lisusu masanga ya bato ya bileko ya nsima ya bowumbu.
      date: Mikapo 1–8, pene na mobu 520–518 liboso ya Klisto; mikapo 9–14, mbala mosusu pene na mbula nkama moko na nsima.
    Malachi:
      display_name: Malaki
      author: Mokomi ayebani te; "Malaki" elimboli "momemi-nsango na ngai."
      audience: Yuda nsima ya bowumbu, oyo ezalaki kokóma goigoi na losambo mpe na bosembo epai ya Nzambe na boyangeli ya Baperse.
      date: Pene na katikati ya ekeke ya 5 liboso ya Klisto.
    Matthew:
      display_name: Matai
      author: Mokomi ayebani te; bonkɔkɔ elobaka ete ntoma Matai nde akomaki yango. Bato ya mayele ya mikolo oyo bamonaka ete mokomi azalaki Moyuda moklisto oyo azalaki koloba Grɛki, mpe asalelaki mokanda ya Marko ná liziba moko oyo ekokanaki na Q.
      audience: Lisanga ya Bayuda baklisto oyo bazalaki koluka koyeba makambo nini ekobaki mpe nini ebongwanaki kati na bango ná Lingomba ya Bayuda.
      date: Pene na mobu 80–90 nsima ya Klisto.
    Mark:
      display_name: Marko
      author: Mokomi ayebani te; bonkɔkɔ elobaka ete azalaki Yoane Marko, moninga ya Petelo na mibembo.
      audience: Lisanga ya baklisto oyo bazalaki koloba Grɛki, mbala mosusu na Roma, ntango bazalaki konyokwama to bazalaki pene na kokutana na minyoko.
      date: Pene na mobu 65–75 nsima ya Klisto, na eleko ya Etumba ya Bayuda mpe kobebisama ya tempelo.
