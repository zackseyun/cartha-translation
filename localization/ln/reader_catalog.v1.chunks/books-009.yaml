      author: Mokomi ayebani te; bonkɔkɔ elobaka ete ezali Yeremia.
      audience: Bato ya Yuda oyo bazalaki kolela kobebisama ya Yerusaleme na mobu 586 liboso ya ntango na biso.
      date: Mwa moke nsima ya mobu 586 liboso ya ntango na biso.
    Ezekiel:
      display_name: Ezekiele
      author: Ezekiele, nganga-nzambe moko oyo amemamaki na boombo na Babilone; na nsima, makomi yango ebongisamaki lisusu.
      audience: Bato ya Yuda oyo bamemamaki na boombo na Babilone, mpe bazalaki koluka kososola na lolenge ya sika ndenge Nzambe azalaki elongo na bango mosika na tempelo.
      date: Pene na mobu 593–571 liboso ya ntango na biso mpo na mosala ya mosakoli; ndenge ya nsuka ya buku ebongisamaki mwa nsima.
    Daniel:
      display_name: Daniele
      author: Mokomi ayebani te; buku emimonisi lokola ekomamaki na Daniele, moto ya ntango ya boombo.
      audience: Bayuda oyo bazalaki konyokwama na boyangeli ya Bagreke—mingimingi na nse ya Antiokusi IV Epifane (167–164 liboso ya ntango na biso).
      date: Ezwaki ndenge oyo toyebi yango pene na mobu 165 liboso ya ntango na biso; mikapo 1–6 ezali mpe na masolo ya kala ya ndako ya mokonzi.
    Hosea:
