    Numbers:
      display_name: Mitángo
      author: Mokomi ayebani te; na bonkɔkɔ, balobaka ete Moize nde akomaki yango.
      audience: Yisraele ntango bazalaki na mobembo kati na Ezipito mpe mokili ya elaka—libota oyo ezalaki na esobe, mpe batángi ya nsima oyo bazali kozwa liteya na mabunga na bango.
      date: Biteni na yango ekomamaki na bileko ndenge na ndenge, kobanda na nsuka ya eleko ya bokonzi tii nsima ya bowumbu (pene na ekeke ya 7–5 liboso ya Kristo).
    Deuteronomy:
      display_name: Deteronome
      author: Mokomi ayebani te; buku yango emonisami lokola masukulumpaka ya nsuka ya Moize. Bato ya mayele ya mikolo na biso bakanisaka ete eteni na yango ya moboko eutaki na mbongwana oyo esalemaki na boyangeli ya Yosiya, pene na nsuka ya ekeke ya 7 liboso ya Kristo.
      audience: Yisraele ntango bazalaki komibongisa mpo na kokɔta na mokili—mpe, na nsima, bato oyo bazalaki na bowumbu mpe bazalaki komituna ndenge ya kozala sembo ata soki bazangi tempelo to mokonzi.
      date: 'Eteni ya moboko: pene na nsuka ya ekeke ya 7 liboso ya Kristo; buku ezwaki lolenge na yango ya nsuka na eleko ya bowumbu.'
    Joshua:
      display_name: Yosua
      author: Mokomi ayebani te; ezali eteni ya Lisolo ya Deteronome.
      audience: Yisraele na eleko ya bokonzi mpe ya bowumbu, ntango bazalaki kokanisa na mozindo na ntina ya kozwa mokili, kondimana, mpe ndimbola ya mokili yango.
      date: Esangisamaki pene na ekeke ya 7–6 liboso ya Kristo, na kosaleláká masolo ya kala.
