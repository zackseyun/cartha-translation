  Polycarp to the Philippians:
    display_name: Polikarpe epai ya Bafilipi
    author: Polikarpe, episkɔpɔ ya Smirne. Bato mosusu ya mayele bakanisaka ete makomi oyo tokómela biso esangisi makambo oyo etindamaki na bantango koleka moko.
    audience: Lisangá ya bakristo na Filipi, oyo esɛngaki mikanda ya Ignace mpe ezwaki batoli na makambo ya kondima, etamboli, bokambi, mbongo mpe koyika mpiko.
    date: Na ebandeli to na katikati ya ekeke ya 2 nsima ya Klisto; ata eteni moko ezali na boyokani makasi na mobembo ya Ignace, nzokande likanisi oyo ete mokanda yango esangisi biteni ndenge na ndenge endimaka ete eteni mosusu ekoki kozala mwa nsima.
