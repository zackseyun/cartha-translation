    date: Mbala mingi batyaka yango pene na nsuka ya ekeke ya 2 T.B. (mbala mingi soki na mobu 170–200); ebatelami na kopi moko ya Copte ya ekeke ya 4, oyo ebongolamaki uta na mokanda ya kala koleka na Grɛki.
