  Martyrdom of Polycarp:
    display_name: Liwa ya Polikarpe mpo na kondima
    author: Bato ya lingomba ya Smirne oyo bankombo na bango eyebani te, bakomaki na nkombo ya lisangá na bango; maloba ya nsuka oyo elobeli ndenge makomi yango epesamaki emonisi ete bakopisaki mpe bapalanganisaki yango na nsima.
    audience: Lingomba ya Filomeliume mpe lisangá mobimba ya bakristo, oyo bazwaki lisolo ya ndenge bakangaki Polikarpe, basambisaki ye, abomamaki, mpe ayikaki mpiko na ndenge oyo esengeli kolanda.
    date: Ekomamaki nsima ya liwa ya Polikarpe, mpe mbala mingi batyaka yango na katikati to na nsuka ya ekeke ya 2 nsima ya Klisto; mbula mpenza oyo abomamaki mpo na kondima mpe lolenge ya nsuka ya mokanda yango ezali naino kotyelama ntembe.
