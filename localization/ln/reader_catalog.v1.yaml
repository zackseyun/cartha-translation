  Fragments of Papias:
    display_name: Biteni ya makomi ya Papias
    author: Papias, episkɔpɔ ya Hierapolisi, mpo na buku na ye ya biteni mitano oyo ebungá, Bandimbola ya maloba ya Nkolo; biteni oyo etikalá ezali maloba oyo bakomi ya nsima bazongelaki mpe bansango oyo babatelaki.
    audience: Bakristo ya liboso oyo bazalaki koluka mateya oyo bato bazalaki kokanisa mpo na Yesu mpe bantoma, oyo esangisamaki na nzela ya milɔngɔ ya bato oyo bankombo na bango epesami, oyo bapesaki litatoli mpe bandimbola na monɔkɔ.
    date: Mbala mingi batyaka mosala ya Papias na ebandeli ya ekeke ya 2 nsima ya Klisto, mingimingi pene na mobu 110–130; biteni oyo etikalá ezali na mikanda ya bakomi oyo bakomaki kobanda na ekeke ya 2 mpe na nsima.
