  Gospel of Mary:
    display_name: Nsango Malamu ya Maria
    author: Mokomi ayebani te. Mokanda yango elakisi Maria lokola moto oyo azwaki emoniseli ya Yesu mpe alimbolaki yango, kasi elobi te ete Maria nde akomaki nsango malamu oyo ebatelamaki.
    audience: Batángi bakristo ya ntango ya ebandeli oyo bazalaki koluka kososola emoniseli, komata na molimo, bokonzi ya bantoma, mpe soki mateya ya Maria kati na bayekoli ya Yesu ezalaki na ntomo.
    date: Mbala mingi batyaka yango na ekeke ya 2 T.B.; biteni na yango na monɔkɔ ya Grɛki, ya ekeke ya 3, ebatelamaki, mpe litatoli na yango ya ntina mingi na monɔkɔ ya Copte ebatelami na Codex ya Berlin 8502, ya ekeke ya 5.
