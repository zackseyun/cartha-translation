  Epistle to Diognetus:
    display_name: Mokanda epai ya Diognète
    author: Nkombo ya mokomi eyebani te. Mokomi amibengi moyekoli, kasi ekoki te koyeba na bosolo soki ye to Diognète oyo akomelaki azalaki nani.
    audience: Moto moko ya kelasi oyo azalaki mokristo te mpe azalaki koluka koyeba—ná batángi mosusu lokola ye—oyo atunaki mituna mpo na losambo ya bakristo, bizaleli na bango, esika na bango kati na bato, bolingo, mpe ntina oyo kondima yango emonanaki lokola likambo ya sika.
    date: Mbala mingi batyaka yango na nsuka ya ekeke ya 2 to na ebandeli ya ekeke ya 3 nsima ya Klisto, atako makanisi ekeseni mingi; mikapo mibale ya nsuka ekoki kouta na mokanda mosusu.
