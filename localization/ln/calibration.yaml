review:
  verdict: revise
  summary: 'Ebongisami mpo na kosalela Lingala ya lelo mpe mpo na kobatela maloba ya source: bokeseni kati na oyo mimeseno elobaka mpe oyo bato ya mayele balobaka, ndimbola ya maloba ya ntina, mpe ba-alternatives na banoti. Nabongisi maloba mosusu oyo ezalaki kokómisa makambo makasi koleka source to oyo ezalaki na monɔkɔ ya bapaya.'
  issues:
  - Na bokuse ya Ebandeli, «ebandaki kokokisama» ebakisaki likanisi oyo source elobi te; source elobi ete bilaka ya kondimana epai ya Yisraele ebandi na libota yango.
  - Na metadata ya Yoane mpe ya Toma, attribution esengeli kotikala attribution ya mimeseno/incipit, kasi koloba na bosikisiki te ete bato yango nde bakomaki to basangisaki mokanda.
  - Na Yoane 1:1, «deja» ezali maloba ya Franse; «asilaki kozala» ezali Lingala ya polele. Noti esengeli koloba ete maloba ya Grɛki endimisi bonzambe mobimba ya Liloba, kasi ekaboli Liloba na Nzambe oyo alobelami na fraze ya liboso.
  - Na Baroma 3:25, ndimbola ya «mercy seat» esengeli kobatela ete ezali ezipeli ya wolo ya Sanduku ya Kondimana, epai makila ya mbeka ezalaki kopanzanama; esengeli te kobakisa «esika Nzambe azalaki koyokela bato mawa.»
  - Na 1 Petro 1:13, ngɔlu ezali «oyo ezali komemama epai na bino» ntango Yesu Masiya akomonisama; yango esengeli kobatela na libongoli.
