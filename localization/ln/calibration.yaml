book_localizations:
- source_title: Genesis
  title: Ebandeli
  author: Mokomi ayebani te; engebene mimeseno, bato bapesaka mokanda yango na Moize. Bato ya mayele ya mikolo na biso bamonaka ete ezalaki na lisolo molai ya bokomi, na biteni oyo eutaki na bisika ndenge na ndenge mpe oyo basangisaki mpe babongisaki na nsima.
  audience: Yisraele, mpo na kopikisa bomoto na bango ya bato ya kondimana na lisolo ya bozalisi ya Nzambe, boponi na ye, mpe elaka na ye.
  date: Ekomamaki na boumeli ya bikeke mingi; ezwaki lolenge na yango oyo endimamaka pene na ekeke ya 6–5 liboso ya mbotama ya Yesu, na ntango ya to nsima ya bowumbu na Babilone.
  summary: Ebandeli elobeli bozalisi, botomboki mpe bopanzani ya bato, mpe libota ya Abrahama, Yisaka, Yakobo ná Yozefe; na nzela na bango nde bilaka ya kondimana ya Nzambe epai ya Yisraele ebandi.
- source_title: John
  title: Yoane
  author: Mokomi ayebani te; mimeseno epesaka yango na ntoma Yoane to na «Moyekoli oyo alingamaki.»
  audience: Lisangá moko ya bakristo oyo ezalaki na matata na Bayuda ya sinagoga, mpe oyo etongamaki zingazinga ya litatoli ya Moyekoli oyo alingamaki.
  date: Pene na mobu 90–110 nsima ya mbotama ya Yesu.
  summary: Yoane amonisi Yesu lokola Liloba ya seko oyo amonisaka Tata, apesaka bomoi na baoyo batyelaka ye motema, mpe apesamaka nkembo na nzela ya bilembo na ye, liwa na ye, mpe lisekwa na ye.
- source_title: Gospel of Thomas
  title: Nsango Malamu ya Toma
  author: Mokomi ayebani te; maloba ya ebandeli ya liboke ya maloba yango epesaka yango na «Didimo Yuda Toma.» Mokanda mobimba oyo etikali ezali kaka libongoli ya Koptike ya ekeke ya 4, oyo ezwamaki na Nag Hammadi (NHC II,2); biteni misato ya Grɛki ezwamaki na Oxyrhynchus.
  audience: Batángi bakristo oyo bazalaki kosala na bwanya ya Siri mpe makanisi ya liboso ya Gnostisime, mpe oyo batyelaki likebi na boyebi ya nkuku ya moto ye moko na maloba ya Yesu.
  date: Makomi ya ebandeli na Grɛki ekoki kozala ete ekomamaki pene na mobu 50–140 nsima ya mbotama ya Yesu; maniskri ya Koptike ezali ya pene na mobu 340 nsima ya mbotama ya Yesu.
  summary: Nsango Malamu ya Toma ezali liboke ya maloba oyo bapesaka Yesu. Ezali na lisolo moko te oyo ekobaka banda ebandeli tii nsuka, mpe mbala na mbala esɛngi batángi báluka koyeba ndimbola ya maloba yango.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Ebandeli 1:1
  text: Ntango Nzambe abandaki kokela likoló ná mabele[a]—
  translator_note: '[a] Libongoli oyo bato mingi bamesaná na yango emonaka maloba yango lokola fraze mobimba: «Na ebandeli, Nzambe akelaki likoló ná mabele.» Kasi na Ebre, maloba yango ekɔtisaka na ndenge ya malamu makambo oyo elandi; likambo monene, «Nzambe alobaki,» ezali na vɛrsɛ 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Mosakoli 1:2
  text: «Mópepe ya mipɛpɛ[a],» Kohelete[b] alobi. «Nyonso ezali mópepe—elekaka noki, okoki kokanga yango te, mpe mbala mingi ekómaka ndenge tozalaki kokanisa te.»
  translator_note: '[a] Liloba ya Ebre hevel elimboli mpenza mpema to mópepe. Na mokanda mobimba, elimbolaka eloko oyo elekaka noki, oyo moto akoki kokanga to kososola mobimba te, mpe oyo mbala mingi ekómaka ndenge bato bazalaki kokanisa te. «Mópepe» ebateli elilingi yango kozanga koloba ete eloko moko te ezali na ntina. Ekoki mpe kobongolama «mpema,» «mpema mpamba,» to «eloko oyo eleka noki.» [b] Kohelete ezali nkombo to titre ya mokomi na Ebre. Mbala mingi babongolaka yango «Moteyi» to «Mosakoli,» kasi tobateli «Kohelete» mpo na kotika ndimbola nyonso oyo ekoki kozala polele, kozanga kopona kaka moko.'
- source_path: nt/john/001/001.yaml
  reference: Yoane 1:1
  text: Na ebandeli[b], Liloba asilaki kozala. Liloba azalaki elongo na Nzambe, mpe Liloba azalaki Nzambe.[a]
  translator_note: '[a] Ekoki mpe kobongolama: «Liloba azalaki ya bonzambe» to «Ndenge Nzambe azalaki, Liloba mpe azalaki bongo.» Ebongiseli ya maloba ya Grɛki endimisi ete Liloba azali mpenza Nzambe, nzokande ekesenisi Liloba na Nzambe oyo alobelami na fraze ya liboso. [b] Maloba oyo ya ebandeli ezongeli Ebandeli 1:1 mpe ekangisi Liloba na ebandeli ya bozalisi. «Asilaki kozala» emonisi ete Liloba azalaki wana ntango ebandeli ekómaki, kasi te ete abandaki kozala na ntango yango. Ekoki mpe kobongolama «azalaki» to «azalaki wana.»'
- source_path: nt/romans/003/025.yaml
  reference: Baroma 3:25
  text: Nzambe alakisaki ye polele lokola mbeka ya bolimbisi masumu[a], na nzela ya kondima na makila na ye[b]. Asalaki bongo mpo na komonisa bosembo na ye[c], mpamba te atikaki kopesa etumbu te mpo na masumu oyo bato basalaki kala.
  translator_note: '[a] Ekoki mpe kobongolama «mbeka oyo ekitisa nkanda»; to «ezipeli ya Sanduku ya Kondimana,» elingi koloba ezipeli ya wolo ya Sanduku ya Kondimana epai bazalaki kopanzana makila ya mbeka ya bolimbisi masumu na Boyokani ya Kala. [b] Ekoki mpe kobongolama: «na nzela ya kondima, na makila na ye.» [c] To «bosambisi na bosembo.»'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Petro 1:13
  text: Yango wana, bómibongisa na makanisi mpo na kosala.[a] Bózala na mayele ya kokɛnga mpenza, mpe bótya elikya na bino mobimba na ngɔlu oyo ezali komemama epai na bino ntango Yesu Masiya akomonisama.[b]
  translator_note: '[a] Na Grɛki, elobi mpenza: «bókanga bilamba na loketo ya makanisi na bino.» Ezali elilingi ya kosangisa elamba ya molai mpe kokanga yango na loketo mpo moto azala pene ya kosala. [b] Liloba ya Grɛki oyo ebongolami awa na «mpenza» mpe «mobimba» ekoki kozala mpo na kozala na mayele ya kokɛnga, mpo na kotya elikya, to mbala mosusu mpo na makambo nyonso mibale. Yango wana, elilingi ya liloba na liloba «bókanga bilamba na loketo ya makanisi na bino» ebatelami mpe elimbolami na noti [a].'
