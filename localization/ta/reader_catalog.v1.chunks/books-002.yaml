payload:
  book_metadata:
    Numbers:
      display_name: எண்ணாகமம்
      author: ஆசிரியர் பெயர் அறியப்படவில்லை; மரபுப்படி மோசே எழுதியதாகக் கருதப்படுகிறது.
      audience: எகிப்துக்கும் வாக்குத்தத்த நாட்டுக்கும் இடையே பயணம் செய்த இஸ்ரவேலர்—அதாவது வனாந்தரத் தலைமுறையினர்—மற்றும் அவர்களுடைய தோல்விகளிலிருந்து கற்றுக்கொண்ட பிற்கால வாசகர்கள்.
      date: அரசாட்சிக் காலத்தின் பிற்பகுதியிலிருந்து நாடுகடத்தலுக்குப் பிந்தைய காலம்வரை உருவான பல அடுக்குகள் (கி.மு. சுமார் 7–5ஆம் நூற்றாண்டுகள்).
    Deuteronomy:
      display_name: உபாகமம்
      author: ஆசிரியர் பெயர் அறியப்படவில்லை; மோசேயின் பிரியாவிடை உரைகளாக வழங்கப்படுகிறது. நவீன ஆய்வாளர்கள் இதன் மையப்பகுதியை யோசியாவின் ஆட்சியில் கி.மு. 7ஆம் நூற்றாண்டின் பிற்பகுதியில் நடந்த சீர்திருத்தத்துடன் தொடர்புபடுத்துகின்றனர்.
      audience: நாட்டிற்குள் நுழைய ஆயத்தமான இஸ்ரவேலர்—மேலும், ஆலயமோ அரசனோ இல்லாமல் எவ்வாறு உண்மையுடன் வாழ்வது என்று கேட்ட நாடுகடத்தப்பட்ட பிற்கால மக்களும்.
      date: மையப்பகுதி கி.மு. 7ஆம் நூற்றாண்டின் பிற்பகுதியைச் சேர்ந்ததாக இருக்கலாம்; நாடுகடத்தல் காலத்தில் இறுதி வடிவம் பெற்றது.
    Joshua:
      display_name: யோசுவா
      author: ஆசிரியர் பெயர் அறியப்படவில்லை; உபாகம வரலாற்றுத் தொகுப்பின் ஒரு பகுதி.
      audience: அரசாட்சிக் காலத்திலும் நாடுகடத்தலிலும் இருந்த இஸ்ரவேலர்; வெற்றி கொள்ளுதல், உடன்படிக்கை, நாட்டின் பொருள் ஆகியவற்றைப் பற்றிச் சிந்தித்தவர்கள்.
      date: பழைய மரபுகளிலிருந்து கி.மு. சுமார் 7–6ஆம் நூற்றாண்டுகளில் தொகுக்கப்பட்டது.
  chapter_titles:
    Leviticus:
      '8':
        title: ஆரோன் ஆசாரியராக அர்ப்பணிக்கப்படுகிறார்
      '9':
        title: அக்கினி பலியை எரித்து ஏற்றுக்கொள்ளுதலைக் காட்டுகிறது
      '10':
        title: நாதாபும் அபியூவும் தண்டிக்கப்படுகின்றனர்
      '11':
        title: சுத்தமான, அசுத்தமான உணவுகள் பற்றிய சட்டங்கள்
      '12':
        title: பிரசவத்திற்குப் பின் பெண் தூய்மைப்படுத்தப்படுகிறாள்
      '13':
        title: ஆசாரியர்கள் தோல் நோய்களைப் பரிசோதிக்கின்றனர்
      '14':
        title: பலிகளின் மூலம் மீண்டும் சுத்தமாக்கப்படுதல்
      '15':
        title: உடல் சுரப்புகளால் ஏற்படும் அசுத்தம்
      '16':
        title: எல்லாப் பாவங்களுக்கும் பாவநிவிர்த்தி செய்யப்படுகிறது
      '17':
        title: பலிகள் சந்திப்புக் கூடாரத்தின் வாசலுக்குக் கொண்டுவரப்பட வேண்டும்
      '18':
        title: ஆண்டவர் ஒழுக்கத் தூய்மையைக் கட்டளையிடுகிறார்
      '19':
        title: இஸ்ரவேலர் பரிசுத்த வாழ்வுக்கு அழைக்கப்படுகின்றனர்
      '20':
        title: கடுமையான பாவங்களுக்குக் கடுமையான தண்டனைகள்
      '21':
        title: ஆசாரியர்கள் சிறப்பான பரிசுத்தத்தைக் காக்க வேண்டும்
      '22':
        title: பரிசுத்த காணிக்கைகளைக் கவனமாகக் கையாள வேண்டும்
      '23':
        title: வழிபாட்டுக்கான குறிக்கப்பட்ட காலங்கள் கற்பிக்கப்படுகின்றன
      '24':
        title: விளக்குகள் எரிகின்றன; அப்பம் படைக்கப்படுகிறது
      '25':
        title: ஏழாம் ஆண்டுதோறும் நிலம் ஓய்வுபெறுகிறது
      '26':
        title: இஸ்ரவேலர் உடன்படிக்கையின் வழியைத் தேர்ந்தெடுக்கின்றனர்
      '27':
        title: நேர்த்திக்கடன்களையும் அர்ப்பணிப்புகளையும் உண்மையுடன் நிறைவேற்ற வேண்டும்
    Numbers:
      '1':
        title: மோசே இஸ்ரவேல் ஆண்களை எண்ணுகிறார்
      '2':
        title: கோத்திரங்கள் திருவாசஸ்தலத்தைச் சுற்றி முகாமிடுகின்றன
      '3':
        title: லேவியர்கள் தேவனுடைய பரிசுத்த வாசஸ்தலத்தில் பணிபுரிகின்றனர்
      '4':
        title: கோகாத்தியர் பரிசுத்த பொருட்களைப் பராமரிக்கின்றனர்
      '5':
        title: மறைவான பாவத்தை தேவன் நியாயந்தீர்க்கிறார்
      '6':
        title: நசரேய விரதமும் ஆசீர்வாதமும்
      '7':
        title: தலைவர்கள் பரிசுத்த இடத்திற்குக் காணிக்கைகள் செலுத்துகின்றனர்
      '8':
        title: தேவனுக்குப் பணிபுரிய லேவியர்கள் தூய்மைப்படுத்தப்படுகின்றனர்
      '9':
        title: பஸ்காவைக் கடைப்பிடிக்க ஆண்டவர் கட்டளையிடுகிறார்
      '10':
        title: வெள்ளி எக்காளங்கள் தேவனுடைய கட்டளைகளுக்கு அறிகுறி கொடுக்கின்றன
      '11':
        title: பேராசை கொள்ளைநோயை வரவழைக்கிறது
      '12':
        title: மிரியாம் மோசேயின் அதிகாரத்திற்கு எதிராகப் பேசுகிறாள்
      '13':
        title: பன்னிரண்டு பேர் வாக்குத்தத்த நாட்டை ஆராய்கின்றனர்
      '14':
        title: சந்தேகப்பட்டதற்காக இஸ்ரவேலர் தண்டிக்கப்படுகின்றனர்
      '15':
        title: காணிக்கைகளையும் ஆடைத் தொங்கல்களையும் பற்றிய அறிவுறுத்தல்கள்
      '16':
        title: கோராகு கலகம் செய்கிறான்; பூமி விழுங்குகிறது
      '17':
        title: ஆரோனின் கோல் ஆசாரிய வம்சத்தை உறுதிப்படுத்துகிறது
      '18':
        title: லேவியர்கள் ஆசாரியர்களின் மேற்பார்வையில் பணிபுரிகின்றனர்
      '19':
        title: சிவப்புப் பசுவைப் பற்றிய தூய்மைப்படுத்தும் சட்டம்
      '20':
        title: காதேசில் மோசே தடுமாறுகிறார்
      '21':
        title: இஸ்ரவேலர் கானானிய அரசனைத் தோற்கடிக்கின்றனர்
      '22':
        title: இஸ்ரவேலைச் சபிக்க பிலேயாம் மறுக்கிறான்
      '23':
        title: பிலேயாம் இஸ்ரவேலை மீண்டும் மீண்டும் ஆசீர்வதிக்கிறான்
      '24':
        title: இஸ்ரவேலின் எதிர்கால மகிமையை பிலேயாம் அறிவிக்கிறான்
      '25':
        title: பினெகாஸ் சிம்ரியைக் கொல்கிறான்
      '26':
        title: புதிய போர்வீரர்களை மோசே எண்ணுகிறார்
      '27':
        title: தந்தையின் சொத்துரிமையை மகள்கள் கோருகின்றனர்
      '28':
        title: இஸ்ரவேலர் வழக்கமான பலிகளைச் செலுத்துகின்றனர்
      '29':
        title: மாதத்தில் இஸ்ரவேலர் பலிகளைச் செலுத்துகின்றனர்
      '30':
        title: நேர்த்திக்கடன்களைப் பற்றி மோசே பேசுகிறார்
      '31':
        title: மீதியானுக்கு எதிராகப் பழிவாங்க மோசே கட்டளையிடுகிறார்
      '32':
        title: ரூபனும் காத்தும் கிழக்குப் பகுதி நிலத்தைக் கோருகின்றனர்
      '33':
        title: எகிப்திலிருந்து இஸ்ரவேலர் மேற்கொண்ட பயணம் பட்டியலிடப்படுகிறது
      '34':
        title: கானானின் எல்லைகளை ஆண்டவர் வரையறுக்கிறார்
      '35':
        title: புகலிடப் பட்டணங்கள் பாதுகாப்பு அளிக்கின்றன
      '36':
        title: செலொப்பெகாத்தின் மகள்கள் தங்கள் குலத்திற்குள் மணமுடிக்கின்றனர்
    Deuteronomy:
      '1':
        title: தேவனுடைய உண்மைத்தன்மையை மோசே எடுத்துரைக்கிறார்
      '2':
        title: இஸ்ரவேலர் ஏதோமையும் மோவாபையும் தவிர்த்துச் செல்கின்றனர்
      '3':
        title: இஸ்ரவேலர் ஓகு அரசனைத் தோற்கடிக்கின்றனர்
      '4':
        title: ஞானத்துடன் கீழ்ப்படியுமாறு மோசே வலியுறுத்துகிறார்
      '5':
        title: பத்துக் கட்டளைகளை மோசே மீண்டும் கூறுகிறார்
      '6':
        title: தேவனை நேசிக்குமாறு இஸ்ரவேலருக்கு மோசே கட்டளையிடுகிறார்
      '7':
        title: இஸ்ரவேலர் சிலைகளை அழிக்க வேண்டும்
      '8':
        title: துன்பத்தில் தேவன் பராமரித்ததை நினைவுகூருங்கள்
      '9':
        title: இஸ்ரவேலருக்காக மோசே மன்றாடுகிறார்
      '10':
        title: தேவனுடைய எதிர்பார்ப்புகளை மோசே எடுத்துரைக்கிறார்
      '11':
        title: அன்புகூருமாறு இஸ்ரவேலருக்கு மோசே கட்டளையிடுகிறார்
      '12':
        title: தேர்ந்தெடுக்கப்பட்ட இடத்தில் மட்டுமே வழிபட வேண்டும்
      '13':
        title: பொய்த் தீர்க்கதரிசிகளையும் சிலைகளையும் நிராகரிக்க வேண்டும்
      '14':
        title: தேவனுடைய மக்களாக வேறுபட்டு வாழுங்கள்
      '15':
        title: ஏழாம் ஆண்டுதோறும் கடன்களைத் தள்ளுபடி செய்ய வேண்டும்
      '16':
        title: தாராள மனத்துடன் பண்டிகைகளைக் கொண்டாடுங்கள்
      '17':
        title: சிலைவழிபாட்டை நியாயந்தீர்த்து சட்டத்தைப் பின்பற்ற வேண்டும்
      '18':
        title: ஆசாரியர்களையும் லேவியர்களையும் உண்மையுடன் ஆதரிக்க வேண்டும்
      '19':
        title: தற்செயலாகக் கொன்றவர்களுக்கு பட்டணங்கள் புகலிடம் அளிக்கின்றன
      '20':
        title: போரில் ஆண்டவரை நம்புங்கள்
      '21':
        title: கொலை செய்யப்பட்டவர்களின் வழக்குகளில் நீதியுடன் நடக்க வேண்டும்
      '22':
        title: பரிசுத்தத்தையும் கண்ணியத்தையும் பாதுகாக்க வேண்டும்
      '23':
        title: உபாகமத்தில் பரிசுத்த வாழ்வுக்கான கட்டளைகள்
      '24':
