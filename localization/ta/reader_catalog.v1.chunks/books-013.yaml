payload:
  book_metadata:
    James:
      display_name: யாக்கோபு
      author: மரபுப்படி இயேசுவின் சகோதரரான யாக்கோபு; இது அவரால் எழுதப்பட்டதா அல்லது அவர் பெயரில் எழுதப்பட்டதா என்பதில் நவீன ஆய்வாளர்களிடையே கருத்து வேறுபாடு உள்ளது.
      audience: புலம்பெயர்ந்து வாழ்ந்த யூதக் கிறிஸ்தவச் சபைகள்.
      date: அவரே எழுதியிருந்தால் சுமார் கி.பி. 50–60கள்; அவர் பெயரில் எழுதப்பட்டிருந்தால் சுமார் கி.பி. முதலாம் நூற்றாண்டின் பிற்பகுதி.
    1 Peter:
      display_name: 1 பேதுரு
      author: மரபுப்படி திருத்தூதர் பேதுரு எழுதியதாகவும், சில்வானு எழுத்தராகச் செயல்பட்டதாகவும் கருதப்படுகிறது; சில ஆய்வாளர்கள் இது பேதுருவின் பெயரில் எழுதப்பட்டதாகக் கருதுகின்றனர்.
      audience: சமூகப் பகைமையை எதிர்கொண்ட ரோம ஆசியா மைனரிலிருந்த கிறிஸ்தவர்கள்.
      date: பேதுரு எழுதியிருந்தால் சுமார் கி.பி. 60கள்; அவர் பெயரில் எழுதப்பட்டிருந்தால் சுமார் கி.பி. 70–90கள்.
    2 Peter:
      display_name: 2 பேதுரு
      author: மரபுப்படி பேதுரு; இது அவரது பெயரில் எழுதப்பட்டது என்பது நவீன ஆய்வாளர்களிடையே பரவலாக ஏற்கப்படும் கருத்து.
      audience: கிறிஸ்துவின் மறுவருகையை மறுத்து ஏளனம் செய்தவர்களை எதிர்கொண்ட கிறிஸ்தவர்கள்.
      date: சுமார் கி.பி. இரண்டாம் நூற்றாண்டின் தொடக்கம்.
    1 John:
      display_name: 1 யோவான்
      author: ஆசிரியர் பெயர் தெரியவில்லை; மரபுப்படி திருத்தூதர் யோவான் அல்லது யோவானிய மூப்பர்.
      audience: ஒரு பிளவுக்குப் பிறகு, யார் தங்களைச் சேர்ந்தவர்கள் என்பதை வரையறுத்துக்கொண்டிருந்த யோவானியச் சமூகம்.
      date: சுமார் கி.பி. 90–110.
    2 John:
      display_name: 2 யோவான்
      author: “மூப்பர்.”
      audience: பொய்ப் போதகர்களைக் குறித்து எச்சரிக்கப்பட்ட ஒரு குறிப்பிட்ட கிறிஸ்தவச் சபை (“தேர்ந்தெடுக்கப்பட்ட அம்மையார்”).
      date: சுமார் கி.பி. 90–110.
    3 John:
      display_name: 3 யோவான்
      author: “மூப்பர்.”
      audience: பயணம் செய்த மறைப்பணியாளர்களைத் தங்கவைத்த தனிநபர் தலைவரான காயு.
      date: சுமார் கி.பி. 90–110.
    Jude:
      display_name: யூதா
      author: மரபுப்படி யாக்கோபுக்கும் இயேசுவுக்கும் சகோதரரான யூதா.
      audience: ஒழுக்கக்கேட்டை ஆதரித்த போதகர்கள் ஊடுருவிக்கொண்டிருந்த கிறிஸ்தவச் சமூகங்கள்.
      date: சுமார் கி.பி. 60–90கள்.
    Revelation:
      display_name: திருவெளிப்பாடு
      author: பத்மோசைச் சேர்ந்த யோவான் (அவரது எழுத்துநடை நான்காம் நற்செய்தியிலிருந்து வேறுபட்டது).
      audience: பேரரசின் அழுத்தத்திற்கு உட்பட்ட ரோம ஆசியா மைனரிலிருந்த ஏழு கிறிஸ்தவச் சபைகள்.
      date: சுமார் கி.பி. 90கள்; மரபுப்படி தொமித்தியனின் ஆட்சிக்காலத்தில்.
    Tobit:
      display_name: தோபித்து
      author: ஆசிரியர் பெயர் தெரியவில்லை.
      audience: அந்நிய ஆட்சியின்கீழ் பக்தி, திருமணம், இறைபராமரிப்பு ஆகியவற்றை எதிர்கொண்டு வாழ்ந்த புலம்பெயர் யூதர்கள்.
      date: சுமார் கி.மு. 225–175; அரமேய மொழியில் இயற்றப்பட்டது; எபிரேயப் பதிப்பும் கும்ரானில் கிடைத்த சான்றுகளில் காணப்படுகிறது.
    Judith:
      display_name: யூதித்து
      author: ஆசிரியர் பெயர் தெரியவில்லை.
      audience: அந்நிய அச்சுறுத்தலுக்கு உள்ளான யூதர்கள் — பக்தியுடன் துணிந்து எதிர்த்த கதையாக இது அமைந்துள்ளது.
      date: சுமார் கி.மு. 150–100.
    Greek Additions to Esther:
      display_name: எஸ்தரின் கிரேக்கச் சேர்க்கைகள்
      author: ஆசிரியர் பெயர் தெரியவில்லை; எஸ்தர் நூலின் கிரேக்க மொழிபெயர்ப்பில் சேர்க்கப்பட்ட துணைப் பகுதிகள்.
      audience: வெளிப்படையான மன்றாட்டுகளும் கடவுளைப் பற்றிய குறிப்புகளும் இடம்பெறும் எஸ்தர் கதையை விரும்பிய கிரேக்க மொழி பேசிய யூதர்கள்.
      date: சுமார் கி.மு. இரண்டாம்–முதலாம் நூற்றாண்டு.
    Wisdom of Solomon:
      display_name: சாலொமோனின் ஞானம்
      author: ஆசிரியர் பெயர் தெரியவில்லை; சாலொமோனின் பெயரில் எழுதப்பட்டதாகக் கருதப்படுகிறது. கிரேக்க மொழியில், அநேகமாக அலெக்சாந்திரியாவில், ஹெலனிய யூத ஆசிரியர் ஒருவரால் இயற்றப்பட்டது.
      audience: கிரேக்கத் தத்துவத்துடன் உரையாடி, புறமத மற்றும் விசுவாசத்தைக் கைவிட்ட மாற்றுக் கருத்துகளுக்கு எதிராக இஸ்ரவேலின் ஞானத்தை ஆதரித்த ஹெலனிய யூதர்கள்.
      date: சுமார் கி.மு. 50 – கி.பி. 50.
  chapter_titles:
    Hebrews:
      '11':
        title: முன்னோர்களின் விசுவாசம் நிலைத்திருக்கிறது
      '12':
        title: இயேசுவுடன் துன்பத்தைத் தாங்குங்கள்
      '13':
        title: அன்புடனும் நம்பிக்கையுடனும் வாழுங்கள்
    James:
      '1':
        title: சோதனைகளால் பரிசோதிக்கப்பட்ட விசுவாசம் நிலைத்திருக்கிறது
      '2':
        title: செயல்களில்லாத விசுவாசம் செத்தது
      '3':
        title: நாவை அடக்கி ஞானமாகப் பேசுங்கள்
      '4':
        title: தன்னலத்திலிருந்து சண்டைகள் எழுகின்றன
      '5':
        title: ஒடுக்குகிற செல்வர்களுக்குத் தீர்ப்பு நெருங்குகிறது
    1 Peter:
      '1':
        title: விண்ணக உரிமைப்பேற்றில் நம்பிக்கை
      '2':
        title: உயிருள்ள கல்லின்மேல் கட்டப்படும் விசுவாசிகள்
      '3':
        title: மனைவியர் தங்கள் வாழ்வால் கிறிஸ்துவை மதிக்கிறார்கள்
      '4':
        title: நன்மை செய்வதற்காகத் துன்புறுங்கள்
      '5':
        title: மூப்பர்கள் முன்மாதிரியாக இருந்து பராமரிக்கிறார்கள்
    2 Peter:
      '1':
        title: ஆன்மிக வளர்ச்சியைப் பேதுரு கற்பிக்கிறார்
      '2':
        title: பொய்ப் போதகர்கள் விரைவான தீர்ப்பை வரவழைக்கிறார்கள்
      '3':
        title: இறுதித் தீர்ப்பைக் குறித்து பேதுரு எச்சரிக்கிறார்
    1 John:
      '1':
        title: ஒளி உண்மையான ஒன்றிப்பை வெளிப்படுத்துகிறது
      '2':
        title: அன்பு கடவுளின் கட்டளைகளைக் கடைப்பிடிக்கிறது
      '3':
        title: கடவுளிடமிருந்து பிறந்தவர்கள் பாவத்தை வெல்கிறார்கள்
      '4':
        title: உண்மையான அன்பு கடவுளிடமிருந்து வருகிறது
      '5':
        title: இயேசுவை நம்புகிறவருக்கு நிலைவாழ்வு உண்டு
    2 John:
      '1':
        title: பொய்ப் போதகர்களைக் குறித்து மூப்பர் எச்சரிக்கிறார்
    3 John:
      '1':
        title: காயு நலம்பெற மூப்பர் மன்றாடுகிறார்
    Jude:
      '1':
        title: இறைபக்தியற்ற ஊடுருவலாளர்களைக் குறித்து யூதா எச்சரிக்கிறார்
    Revelation:
      '1':
        title: கடவுள் யோவானுக்குத் தரிசனங்களைக் காட்டுகிறார்
      '2':
        title: இயேசு ஏழு சபைகளிடம் பேசுகிறார்
      '3':
        title: மனம் மாறும்படி லவோதிக்கேயாவை இயேசு எச்சரிக்கிறார்
      '4':
        title: விண்ணக அரியணை மகிமையில் ஒளிர்கிறது
      '5':
        title: ஆட்டுக்குட்டி சுருளை வாங்கி மீட்பளிக்கிறது
      '6':
        title: நான்கு குதிரைவீரர்கள் பெரும் கேடுகளைக் கொண்டுவருகிறார்கள்
      '7':
        title: முத்திரையிடப்பட்ட பணியாளர்கள் நித்தியப் புகழைப் பாடுகிறார்கள்
      '8':
        title: ஏழு எக்காளங்கள் கொடிய தீர்ப்புகளை முழங்குகின்றன
      '9':
        title: வெட்டுக்கிளிகள் பூமியின் பாவிகளை வதைக்கின்றன
      '10':
        title: வல்லமையுள்ள தூதர் இறுதி காலத்தைப் பற்றி ஆணையிடுகிறார்
      '11':
        title: இரு சாட்சிகள் இறைவாக்குரைத்து பின்னர் உயிர்த்தெழுகிறார்கள்
      '12':
        title: ஆட்சி செய்ய விதிக்கப்பட்ட மகனைப் பெண் பெற்றெடுக்கிறாள்
      '13':
        title: கடலிலிருந்து மிருகம் எழுகிறது
      '14':
        title: ஆட்டுக்குட்டி உண்மையுள்ளவர்களைத் தன்னிடம் சேர்க்கிறது
      '15':
        title: விண்ணகத்தின் சினத்தை யோவான் காண்கிறார்
      '16':
        title: தூதர்கள் சினக் கிண்ணங்களை ஊற்றுகிறார்கள்
      '17':
        title: பாபிலோனின் தீர்ப்பும் கடவுளின் வெற்றியும்
      '18':
        title: பாபிலோனின் வீழ்ச்சியைக் கண்டு விண்ணகம் மகிழ்கிறது
      '19':
        title: ஆட்டுக்குட்டியின் திருமணத்தை விண்ணகம் கொண்டாடுகிறது
      '20':
        title: இறுதித் தீர்ப்பை யோவான் காண்கிறார்
      '21':
        title: அனைத்தும் புதிதாக்கப்படுகின்றன
      '22':
        title: இயேசு விரைவில் வருகிறார்
    Tobit:
      '1':
        title: தோபித்து கடவுளை உண்மையுடன் நினைவுகூருகிறார்
      '2':
        title: இகழப்பட்ட அயலாரைத் தோபித்து அடக்கம் செய்கிறார்
      '3':
        title: தோபித்து அழுது, மரணத்திற்காக மன்றாடுகிறார்
      '4':
        title: நீதியாக வாழும்படி தோபித்து தன் மகனுக்கு அறிவுறுத்துகிறார்
      '5':
        title: வழிகாட்டுதலுடன் தோபியா புறப்படுகிறார்
      '6':
