payload:
  book_metadata:
    Ezra:
      display_name: எஸ்றா
      author: ஆசிரியர் பெயர் தெரியவில்லை; நாளாகமங்களின் ஆசிரியரே இதையும் எழுதியிருக்கலாம்.
      audience: பெர்சிய ஆட்சியின் கீழ் எருசலேமை மீண்டும் கட்டியெழுப்பிய தாயகம் திரும்பியவர்கள்.
      date: ஏறத்தாழ கி.மு. 5ஆம் நூற்றாண்டின் நடுப்பகுதி முதல் 4ஆம் நூற்றாண்டு வரை.
    Nehemiah:
      display_name: நெகேமியா
      author: ஆசிரியர் பெயர் தெரியவில்லை; நெகேமியா எழுதியதாகக் கருதப்படும் தன்வரலாற்றுக் குறிப்புகளும் இதில் இடம்பெற்றுள்ளன.
      audience: பெர்சிய ஆட்சியின் கீழ் எருசலேமின் மதில்களை மீண்டும் கட்டியெழுப்பி, உடன்படிக்கையைப் புதுப்பித்த தாயகம் திரும்பியவர்கள்.
      date: ஏறத்தாழ கி.மு. 5ஆம் நூற்றாண்டின் நடுப்பகுதி முதல் 4ஆம் நூற்றாண்டு வரை.
    Esther:
      display_name: எஸ்தர்
      author: ஆசிரியர் பெயர் தெரியவில்லை.
      audience: அந்நிய ஆட்சியின் கீழ், குறிப்பாகப் பெர்சியாவில், புலம்பெயர்ந்து வாழ்ந்த யூதர்கள்.
      date: ஏறத்தாழ பெர்சியக் காலத்தின் இறுதிப்பகுதி அல்லது கிரேக்கக் காலத்தின் தொடக்கப்பகுதி (கி.மு. 4–3ஆம் நூற்றாண்டு).
    Job:
      display_name: யோபு
      author: ஆசிரியர் பெயர் தெரியவில்லை.
      audience: குற்றமற்றவர்களின் துன்பத்தையும் இறைநீதியையும் புரிந்துகொள்ளப் போராடிய இஸ்ரவேலர்.
      date: பழைய நாட்டுப்புற மரபுகளை அடிப்படையாகக் கொண்ட இந்நூல், ஏறத்தாழ கி.மு. 6–4ஆம் நூற்றாண்டைச் சேர்ந்தது என்பது ஞான இலக்கிய ஆய்வாளர்களிடையே பொதுவான கருத்து.
    Psalms:
      display_name: சங்கீதங்கள்
      author: பல நூற்றாண்டுகளில் வாழ்ந்த பல ஆசிரியர்கள்; முன்னுரைக் குறிப்புகள் தாவீது, ஆசாப், கோராகு, சாலொமோன், மோசே மற்றும் பிறரின் பெயர்களைக் குறிப்பிடுகின்றன.
      audience: வழிபாட்டில் ஈடுபட்ட இஸ்ரவேலரும் ஆலயச் சபையாரும்—அதோடு, பிற்காலத்தில் ஜெபமும் புலம்பலும் ஏறெடுத்த ஒவ்வொரு சமூகமும்.
      date: ஏறத்தாழ கி.மு. 10–3ஆம் நூற்றாண்டுகளில் இயற்றப்பட்டது; நாடுகடத்தலுக்குப் பிந்தைய காலத்தில் இறுதியாகத் தொகுக்கப்பட்டது.
  chapter_titles:
    2 Chronicles:
      '20':
        title: எதிரிகளை வென்ற யூதா
      '21':
        title: யோராம் தன் சகோதரர்களைக் கொல்கிறான்
      '22':
        title: அகசியா தீய வழிகளைப் பின்பற்றுகிறான்
      '23':
        title: யோவாஸ் மீண்டும் அரசனாக்கப்படுகிறான்
      '24':
        title: ஆலயப் புதுப்பிப்பும் பின்னடைவும்
      '25':
        title: அமத்சியா ஏதோமைத் தோற்கடிக்கிறான்
      '26':
        title: உசியாவின் செழிப்பு முடிவடைகிறது
      '27':
        title: யோதாம் யூதாவை வலுப்படுத்துகிறான்
      '28':
        title: ஆகாசின் கடும் உண்மையின்மை
      '29':
        title: எசேக்கியா ஆலயத்தை மீண்டும் திறக்கிறான்
      '30':
        title: இஸ்ரவேலர் அனைவரும் பஸ்காவைக் கொண்டாடுகின்றனர்
      '31':
        title: எசேக்கியா ஆலயக் களஞ்சியங்களை நிரப்புகிறான்
      '32':
        title: தூதரின் வல்லமையால் எருசலேம் விடுவிக்கப்படுகிறது
      '33':
        title: மனாசே மனந்திரும்பி பலிபீடத்தைச் சீரமைக்கிறான்
      '34':
        title: யோசியா திருச்சட்டத்தைக் கண்டெடுத்து வாசிக்கிறான்
      '35':
        title: யோசியா மாபெரும் பஸ்கா விழாவை நடத்துகிறான்
      '36':
        title: பாபிலோனிய வல்லரசிடம் யூதா வீழ்கிறது
    Ezra:
      '1':
        title: ஆலயத்தை மீண்டும் கட்ட கோரேசு அனுமதிக்கிறான்
      '2':
        title: நாடுகடத்தப்பட்டவர்களுடன் எஸ்றா திரும்பி வருகிறார்
      '3':
        title: அச்சத்தின் நடுவே எருசலேமில் பலிபீடம் மீண்டும் கட்டப்படுகிறது
      '4':
        title: எதிரிகள் ஆலய மறுகட்டுமானப் பணிகளை நிறுத்துகின்றனர்
      '5':
        title: ஆலய மறுகட்டுமானத்தை கடவுள் வழிநடத்துகிறார்
      '6':
        title: ஆலயக் கட்டுமானத்தை மீண்டும் தொடங்க தாரியு கட்டளையிடுகிறான்
      '7':
        title: எஸ்றா கடவுளின் திருச்சட்டத்தைப் போதிக்கிறார்
      '8':
        title: எஸ்றா ஜெபித்து பாதுகாப்பாகத் திரும்பி வருகிறார்
      '9':
        title: இஸ்ரவேலரின் பாவமிக்க திருமணங்களுக்காக எஸ்றா துயரப்படுகிறார்
      '10':
        title: பாவமிக்க திருமணங்களை எஸ்றா எதிர்கொள்கிறார்
    Nehemiah:
      '1':
        title: எருசலேமுக்காக நெகேமியா ஜெபிக்கிறார்
      '2':
        title: மீண்டும் கட்டியெழுப்ப அரசன் நெகேமியாவை அனுப்புகிறான்
      '3':
        title: ஒன்றிணைந்து எழுப்பப்படும் எருசலேமின் மதில்கள்
      '4':
        title: நெகேமியா எருசலேமைப் பாதுகாக்கிறார்
      '5':
        title: சமூக அநீதியை நெகேமியா எதிர்த்துப் போராடுகிறார்
      '6':
        title: கடவுளின் பணியைத் தடுக்க எதிரிகள் தோற்கின்றனர்
      '7':
        title: நகரக் காவலர்களும் மக்களும் பட்டியலிடப்படுகின்றனர்
      '8':
        title: எஸ்றா திருச்சட்டத்தை வாசிக்க, மக்கள் அழுகின்றனர்
      '9':
        title: இஸ்ரவேலர் கடவுளிடம் தங்கள் பாவங்களை அறிக்கையிடுகின்றனர்
      '10':
        title: மக்கள் கடவுளோடு உடன்படிக்கை செய்கின்றனர்
      '11':
        title: தலைவர்கள் பரிசுத்த நகரத்தில் மக்களைக் குடியமர்த்துகின்றனர்
      '12':
        title: மதில் அர்ப்பணிப்பு வழிபாட்டுடன் கொண்டாடப்படுகிறது
      '13':
        title: நெகேமியா ஆலயத்தை மீண்டும் தூய்மைப்படுத்துகிறார்
    Esther:
      '1':
        title: அரசி வஸ்தியை அரசன் விலக்குகிறார்
      '2':
        title: எஸ்தர் புதிய அரசியாகிறார்
      '3':
        title: யூதர்களை அழிக்க ஆமான் திட்டமிடுகிறான்
      '4':
        title: செயல்படுமாறு எஸ்தரை மொர்தெகாய் வலியுறுத்துகிறான்
      '5':
        title: அரசனையும் ஆமானையும் எஸ்தர் அழைக்கிறார்
      '6':
        title: மொர்தெகாயை அரசன் பொதுமக்கள் முன் கௌரவிக்கிறான்
      '7':
        title: ஆமானின் சதித்திட்டத்தை எஸ்தர் அம்பலப்படுத்துகிறார்
      '8':
        title: ஆமானின் அதிகாரத்தை மொர்தெகாய் பெறுகிறார்
      '9':
        title: யூதர்கள் வெற்றிகரமாகத் தங்களைத் தற்காத்துக்கொள்கின்றனர்
      '10':
        title: மொர்தெகாய் நன்றாகவும் ஞானமாகவும் ஆட்சி செய்கிறார்
    Job:
      '1':
        title: எல்லாவற்றையும் இழந்தும் யோபு வழிபடுகிறார்
      '2':
        title: யோபு உண்மையோடு துன்பத்தைத் தாங்குகிறார்
      '3':
        title: யோபு தான் பிறந்த நாளைச் சபிக்கிறார்
      '4':
        title: யோபு விதைத்ததைக் குறித்து எலிப்பாஸ் கண்டிக்கிறார்
      '5':
        title: கடவுளை நாடுமாறு யோபுக்கு எலிப்பாஸ் அறிவுறுத்துகிறார்
      '6':
        title: தன் கனத்த சுமையை யோபு விவரிக்கிறார்
      '7':
        title: தன் துன்பத்தைக் குறித்து யோபு முறையிடுகிறார்
      '8':
        title: யோபின் துன்பத்தைக் குறித்து பில்தாத் கண்டிக்கிறார்
      '9':
        title: கடவுளின் வல்லமையை எண்ணி யோபு புலம்புகிறார்
      '10':
        title: என்னோடு ஏன் போராடுகிறீர் என யோபு கேட்கிறார்
      '11':
        title: ஞானம் கூறி யோபை சோப்பார் கண்டிக்கிறார்
      '12':
        title: நண்பர்களின் வெற்று வார்த்தைகளை யோபு ஏளனம் செய்கிறார்
      '13':
        title: கடவுளுக்கு முன்பாக யோபு உண்மையைப் பேசுகிறார்
      '14':
        title: வாழ்க்கையின் நிலையாமைக்காக யோபு புலம்புகிறார்
      '15':
        title: யோபு பாவம் செய்ததாக எலிப்பாஸ் குற்றஞ்சாட்டுகிறார்
      '16':
        title: யோபு கடவுளை நோக்கிக் கதறுகிறார்
      '17':
        title: நண்பர்களால் ஏளனம் செய்யப்பட்ட யோபு நம்பிக்கையிழக்கிறார்
      '18':
        title: தீயவர்களின் முடிவை பில்தாத் விவரிக்கிறார்
      '19':
        title: தன் மீட்பருக்காக யோபு ஏங்குகிறார்
      '20':
        title: தீமையின் அழிவை சோப்பார் அறிவிக்கிறார்
      '21':
        title: தீயவர்கள் செழிப்பதை யோபு சுட்டிக்காட்டுகிறார்
      '22':
        title: யோபு பாவங்கள் செய்ததாக எலிப்பாஸ் குற்றஞ்சாட்டுகிறார்
      '23':
        title: கடவுளைக் கண்டடைய யோபு ஏங்குகிறார்
      '24':
        title: தீயவர்களால் ஏற்படும் துன்பத்தை யோபு விவரிக்கிறார்
      '25':
        title: கடவுளின் அளவற்ற வல்லமையை பில்தாத் போற்றுகிறார்
      '26':
        title: நண்பர்களின் வெற்று ஞானத்தை யோபு ஏளனம் செய்கிறார்
      '27':
        title: யோபு தன் நேர்மையை உறுதியாகப் பற்றிக்கொள்கிறார்
      '28':
        title: உலகச் செல்வங்களைப் பற்றி யோபு சிந்திக்கிறார்
      '29':
        title: மதிப்புடன் வாழ்ந்த நாட்களை யோபு நினைவுகூர்கிறார்
      '30':
