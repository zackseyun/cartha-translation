payload:
  book_metadata:
    2 Esdras:
      display_name: 2 எஸ்திரா
      author: ஆசிரியர் பெயர் தெரியவில்லை; முதலில் யூத நூலாக இருந்த மையப் பகுதியைச் (4 எஸ்றா, அதிகாரங்கள் 3–14) சுற்றி கிறிஸ்தவர்களால் தொகுக்கப்பட்ட சட்டகம் உள்ளது.
      audience: கி.பி. 70-க்குப் பிறகு, தீமை ஏன் உள்ளது என்ற இறைநீதிக் கேள்வியோடு போராடிய யூதர்களுக்காக; பின்னர் கிறிஸ்தவ வாசகர்களுக்காக விரிவாக்கப்பட்டது.
      date: யூத மையப் பகுதி ஏறத்தாழ கி.பி. 100; கிறிஸ்தவச் சேர்க்கைகள் ஏறத்தாழ கி.பி. 2–3ஆம் நூற்றாண்டுகள்.
    Didache:
      display_name: திதாக்கே
      author: ஆசிரியர் பெயர் தெரியவில்லை (இத்தலைப்பு, "பன்னிரு அப்போஸ்தலர்களின் போதனை" என்று பொருள்படும்).
      audience: ஆரம்பகால கிறிஸ்தவச் சபைக் கூடுகைகளுக்காக—அறநெறி, திருமுழுக்கு, நற்கருணை விருந்து, பயணம் செய்யும் போதகர்கள் ஆகியவை பற்றிய சுருக்கமான கையேடு.
      date: ஏறத்தாழ கி.பி. 1ஆம் நூற்றாண்டின் பிற்பகுதி முதல் 2ஆம் நூற்றாண்டின் முற்பகுதி வரை.
    Gospel of Thomas:
      display_name: தோமாவின் நற்செய்தி
      author: ஆசிரியர் பெயர் தெரியவில்லை; தொடக்கவுரை இந்த மொழிகளின் தொகுப்பை "திதிமோஸ் யூதா தோமா" என்பவருக்குரியதாகக் குறிப்பிடுகிறது. நாக் ஹம்மாதியில் கிடைத்த 4ஆம் நூற்றாண்டைச் சேர்ந்த காப்டிக் மொழிபெயர்ப்பில் (NHC II,2) மட்டுமே முழுமையாகப் பாதுகாக்கப்பட்டுள்ளது; ஆக்ஸிரின்கஸிலிருந்து மூன்று கிரேக்கத் துண்டுகளும் கிடைத்துள்ளன.
      audience: சிரிய ஞான மரபாலும் தொடக்ககால ஞானவாதச் சிந்தனையாலும் வடிவமைக்கப்பட்டு, இயேசுவின் மொழிகளில் மறைபொருளான சுயஅறிவை நோக்கிய கிறிஸ்தவ வாசகர்களுக்காக.
      date: கிரேக்க மூலநூல் ஏறத்தாழ கி.பி. 50–140; காப்டிக் கையெழுத்துப் பிரதி ஏறத்தாழ கி.பி. 340.
      summary: தோமாவின் நற்செய்தி, இயேசுவுக்குரியதாகக் கூறப்படும் மொழிகளின் தொகுப்பு. இதில் தொடர்ச்சியான கதை இல்லை; அந்த மொழிகளின் பொருளைக் கண்டறியுமாறு வாசகர்களை மீண்டும் மீண்டும் அழைக்கிறது.
  chapter_titles:
    2 Baruch:
      '72':
        title: ஒளிமிகு நீர்கள் மெசியாவின் காலத்தைக் குறிக்கின்றன
      '73':
        title: அமைதியான யுகம் எல்லாப் பூசல்களையும் முடிவுக்குக் கொண்டுவருகிறது
      '74':
        title: கட்டுகிறவர்கள் அமைதியில் அறுவடை செய்கிறார்கள்
      '75':
        title: பாரூக்கு கடவுளின் இரக்கத்தைப் போற்றுகிறார்
      '76':
        title: மக்கள் பாரூக்கின் அறிவுரையை நாடுகிறார்கள்
      '77':
        title: பாரூக்கு மக்களுக்குத் திருச்சட்டத்தை நினைவூட்டுகிறார்
      '78':
        title: நாடுகடத்தப்பட்டோருக்கு பாரூக்கு நம்பிக்கைச் செய்தி எழுதுகிறார்
      '79':
        title: படைப்பாளரின் அன்பு மாறாமல் நிலைக்கிறது
      '80':
        title: நெபுகத்நேச்சரின் தாக்குதல் நியமிக்கப்பட்டது
      '81':
        title: துன்புறுவோருக்குக் கடவுளின் இரக்கம் அருகில் உள்ளது
      '82':
        title: தீய நாடுகள் தீர்ப்பை எதிர்கொள்கின்றன
      '83':
        title: மோசேயும் எரேமியாவும் தீர்ப்புகளைக் குறித்து எச்சரித்தனர்
      '84':
        title: திருச்சட்டத்தை நினைவுகூருமாறு பாரூக்கு வலியுறுத்துகிறார்
      '85':
        title: முடிவு அருகில் உள்ளது; கட்டளைகளை ஏற்றுக்கொள்ளுங்கள்
      '86':
        title: கூடுகைகளில் கடிதத்தை உரக்க வாசியுங்கள்
      '87':
        title: கற்பிக்கப்பட்ட கட்டளைகளை உறுதியாகப் பற்றிக்கொள்ளுங்கள்
    2 Esdras:
      '1':
        title: இஸ்ரவேல் தம்மைப் புறக்கணித்ததற்காகக் கடவுள் வருந்துகிறார்
      '2':
        title: எஸ்றா வருங்கால மகிமையைக் காண்கிறார்
      '3':
        title: இஸ்ரவேலின் வரலாற்றை எடுத்துரைத்து எஸ்றா மன்றாடுகிறார்
      '4':
        title: எஸ்றாவின் வரம்புகளை ஊரியேல் கற்பிக்கிறார்
      '5':
        title: வரவிருக்கும் பேரச்சத்தின் நடுவே எஸ்றா மன்றாடுகிறார்
      '6':
        title: படைப்பின் நாட்களை எடுத்துரைத்து எஸ்றா மன்றாடுகிறார்
      '7':
        title: எஸ்றா இறுதித் தீர்ப்பைக் காண்கிறார்
      '8':
        title: புரிந்துகொள்ள எஸ்றா மன்றாடுகிறார்
      '9':
        title: சீயோனின் வருங்கால மகிமையை எஸ்றா காண்கிறார்
      '10':
        title: சீயோனின் மகிமையை எஸ்றா காண்கிறார்
      '11':
        title: கழுகைப் பற்றிய கனவுகள் முடிவை முன்னறிவிக்கின்றன
      '12':
        title: சிங்கத்தையும் கழுகுகளையும் எஸ்றா கனவில் காண்கிறார்
      '13':
        title: கடலிலிருந்து வரும் மனிதர் படைப்பை விடுவிக்கிறார்
      '14':
        title: நம்பிக்கைக்குரிய வார்த்தைகளைப் பேச ஆண்டவர் கட்டளையிடுகிறார்
      '15':
        title: வரவிருக்கும் தீர்ப்பைக் குறித்து இறைவாக்கினர் எச்சரிக்கிறார்
      '16':
        title: கடவுளின் தீர்ப்புகள் நிலத்தையும் கடலையும் அதிரச்செய்கின்றன
    Didache:
      '1':
        title: கடவுளை நேசித்து வாழ்வின் வழியைத் தேர்ந்தெடுங்கள்
      '2':
        title: தீமையைத் தவிர்த்து கட்டளைகளைப் பின்பற்றுங்கள்
      '3':
        title: எல்லா வகையான தீமையிலிருந்தும் விலகி ஓடுங்கள்
      '4':
        title: கடவுளின் வார்த்தையை எப்போதும் மதியுங்கள்
      '5':
        title: மரணத்தின் வழி பாவத்துக்கு இட்டுச் செல்கிறது
      '6':
        title: எதையும் சேர்க்காமல் போதனையைப் பின்பற்றுங்கள்
      '7':
        title: ஓடும் நீரில் உண்மையுடன் திருமுழுக்குக் கொடுங்கள்
      '8':
        title: நீதியுள்ள தந்தையிடம் மன்றாடுங்கள்
      '9':
        title: கிண்ணத்திற்காகவும் அப்பத்திற்காகவும் நன்றி செலுத்துங்கள்
      '10':
        title: தூய தந்தைக்கு நன்றி செலுத்தப்படுகிறது
      '11':
        title: உண்மையான போதகர்களையும் இறைவாக்கினர்களையும் வரவேற்றிடுங்கள்
      '12':
        title: பயணிகளுக்கு உதவுங்கள்; ஆனால் அவர்களைச் சோதித்தறியுங்கள்
      '13':
        title: உண்மையான இறைவாக்கினர்களையும் போதகர்களையும் ஆதரியுங்கள்
      '14':
        title: அப்பத்தைப் பகிர்வதற்கு முன் பாவங்களை அறிக்கையிடுங்கள்
      '15':
        title: தகுதியான கண்காணிகளையும் திருத்தொண்டர்களையும் நியமியுங்கள்
      '16':
        title: விழிப்புடன் இருங்கள்; விசுவாசம் சோதனைகளில் நிலைத்திருக்கட்டும்
    Gospel of Thomas:
      '0':
        title: இயேசுவின் மறைவான மொழிகளைத் தோமா எழுதுகிறார்
      '1':
        title: இயேசு மறைவான ஞானத்தைக் கற்பிக்கிறார்
      '2':
        title: இறையாட்சி உங்களுக்குள்ளும் வெளியிலும் உள்ளது
      '3':
        title: இறையாட்சி அகத்திலும் புறத்திலும் உள்ளது
      '4':
        title: இயேசு தாழ்மையின் ஞானத்தைக் கற்பிக்கிறார்
      '5':
        title: இயேசு மறைவானவற்றைப் பற்றிப் பேசுகிறார்
      '6':
        title: மனிதனால் உண்ணப்படும் சிங்கம் பேறுபெற்றது
      '7':
        title: ஞானமுள்ள மீனவர் பெரிய மீனைத் தேர்ந்தெடுக்கிறார்
      '8':
        title: ஞானமுள்ள மீனவர் பெரியதைத் தேர்ந்தெடுக்கிறார்
      '9':
        title: விதைப்பவர் விதையைப் பரவலாகத் தூவுகிறார்
      '10':
        title: இயேசு கொழுந்துவிட்டு எரியும் நெருப்பைக் காக்கிறார்
      '11':
        title: கடந்துபோவதைப் பற்றி இயேசு பேசுகிறார்
      '12':
        title: யாக்கோபு சீடர்களை வழிநடத்துவார்
      '13':
        title: நோன்பு, மன்றாட்டு, தருமம் ஆகியவை பாவமாகின்றன
      '14':
        title: இயேசு உண்மையான இறைப்பற்றைக் கற்பிக்கிறார்
      '15':
        title: உங்கள் தந்தையான அவரை வணங்குங்கள்
      '16':
        title: பிரிவினையைப் பற்றி இயேசு பேசுகிறார்
      '17':
        title: தொடக்கத்தைக் கண்டடைவோர் பேறுபெற்றவர்
      '18':
        title: தொடக்கத்தையும் முடிவையும் இயேசு விளக்குகிறார்
      '19':
        title: வளரும் கடுகுவிதையைப் போன்ற இறையாட்சி
      '20':
        title: சீடர்களின் முடிவைப் பற்றி மரியா கேட்கிறார்
      '21':
        title: மரியா இயேசுவிடம் சீடர்களைப் பற்றிக் கேட்கிறார்
      '22':
        title: இறையாட்சிக்குள் நுழைவதை இயேசு விளக்குகிறார்
      '23':
        title: நிலைத்திருக்க இயேசு சிலரைத் தேர்ந்தெடுக்கிறார்
      '24':
        title: மனிதருக்குள் இருக்கும் ஒளி பிரகாசிக்கிறது
      '25':
        title: சகோதரரை உங்கள் உயிரைப்போல் நேசியுங்கள்
      '26':
        title: வெளிவேடத்தைப் பற்றி இயேசு பேசுகிறார்
      '27':
        title: நோன்பு ஆன்மிக இறையாட்சியைக் கண்டடைகிறது
      '28':
        title: போதையுற்றவர்களைப் பற்றி இயேசு பேசுகிறார்
      '29':
        title: ஆவியைக் குறித்து இயேசு வியக்கிறார்
      '30':
