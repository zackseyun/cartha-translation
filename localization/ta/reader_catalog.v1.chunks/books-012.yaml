payload:
  book_metadata:
    1 Corinthians:
      display_name: 1 கொரிந்தியர்
      author: பவுல், சொஸ்தெனேயுடன்.
      audience: பிளவுகளால் பாதிக்கப்பட்ட கொரிந்துவிலுள்ள கிறிஸ்தவச் சபை.
      date: சுமார் கி.பி. 53–55; எபேசுவிலிருந்து எழுதப்பட்டது.
    2 Corinthians:
      display_name: 2 கொரிந்தியர்
      author: பவுல், தீமோத்தேயுவுடன்.
      audience: வேதனைமிக்க ஒரு மோதலுக்குப் பிறகு இருந்த கொரிந்துச் சபை.
      date: சுமார் கி.பி. 55–56.
    Galatians:
      display_name: கலாத்தியர்
      author: பவுல்.
      audience: விருத்தசேதனத்தையும் தோரா சட்டத்தைக் கடைப்பிடிப்பதையும் ஏற்குமாறு அழுத்தம் கொடுக்கப்பட்ட கலாத்தியாவிலுள்ள (மத்திய அனத்தோலியா) கிறிஸ்தவச் சபைகள்.
      date: சுமார் கி.பி. 48–55 (விவாதத்திற்குரியது).
    Ephesians:
      display_name: எபேசியர்
      author: பவுல், அல்லது பவுலின் பெயரில் எழுதிய அவருடைய நெருங்கிய சீடர் (விவாதத்திற்குரியது).
      audience: ஆசியப் பகுதியைச் சேர்ந்த கிறிஸ்தவ வாசகர்களுக்குப் பொதுவாக எழுதப்பட்டது; மிகப் பழமையான கையெழுத்துப் பிரதிகளில் “எபேசு” என்ற இடப்பெயர் இல்லை.
      date: பவுல் எழுதியிருந்தால் சுமார் கி.பி. 60கள்; பவுலின் பெயரில் எழுதப்பட்டிருந்தால் சுமார் கி.பி. 80கள்–90கள்.
    Philippians:
      display_name: பிலிப்பியர்
      author: பவுல், தீமோத்தேயுவுடன்.
      audience: மக்கெதோனியாவிலிருந்த ரோமக் குடியேற்ற நகரமான பிலிப்பியிலுள்ள கிறிஸ்தவச் சபை.
      date: சுமார் கி.பி. 60–62; சிறையிலிருந்து எழுதப்பட்டது.
    Colossians:
      display_name: கொலோசெயர்
      author: பவுல், தீமோத்தேயுவுடன் — அல்லது பவுலின் பெயரில் எழுதிய நெருங்கிய சீடர் (விவாதத்திற்குரியது).
      audience: பல சமயக் கூறுகளைக் கலந்த ஒரு போதனையை எதிர்கொண்ட, லைக்குஸ் பள்ளத்தாக்கிலுள்ள கொலோசெ நகரக் கிறிஸ்தவர்கள்.
      date: பவுல் எழுதியிருந்தால் சுமார் கி.பி. 60–62; பவுலின் பெயரில் எழுதப்பட்டிருந்தால் அதற்குப் பிந்தைய காலம்.
    1 Thessalonians:
      display_name: 1 தெசலோனிக்கேயர்
      author: பவுல், சில்வானுவும் தீமோத்தேயுவும் உடன்.
      audience: துன்புறுத்தலை எதிர்கொண்ட தெசலோனிக்கேயாவிலுள்ள இளம் கிறிஸ்தவச் சபை.
      date: சுமார் கி.பி. 50–51 — இன்று கிடைக்கும் பவுலின் கடிதங்களில் இதுவே மிகப் பழமையானதாக இருக்கலாம்.
    2 Thessalonians:
      display_name: 2 தெசலோனிக்கேயர்
      author: பவுல் (விவாதத்திற்குரியது; சில அறிஞர்கள் இது பவுலின் பெயரில் எழுதப்பட்டது எனக் கருதுகின்றனர்).
      audience: இறுதிக்காலத்தைப் பற்றிய குழப்பத்தை எதிர்கொண்ட தெசலோனிக்கேயச் சபை.
      date: பவுல் எழுதியிருந்தால் சுமார் கி.பி. 51.
    1 Timothy:
      display_name: 1 தீமோத்தேயு
      author: பவுல், அல்லது பவுலின் பெயரில் எழுதிய ஒரு சீடர் (மேய்ப்புப் பணிக் கடிதங்கள் பவுலின் பெயரில் எழுதப்பட்டவை என்ற கருத்து அறிஞர்களிடையே பரவலாக உள்ளது).
      audience: எபேசுவில் பவுலின் பிரதிநிதியாக இருந்த தீமோத்தேயுவுக்கு; பிற்காலத் திருச்சபை ஒழுங்கிற்கான வழிகாட்டிக் கையேடாகவும் உள்ளது.
      date: பவுல் எழுதியிருந்தால் சுமார் கி.பி. 60களின் நடுப்பகுதி; பவுலின் பெயரில் எழுதப்பட்டிருந்தால் சுமார் கி.பி. 90–110.
    2 Timothy:
      display_name: 2 தீமோத்தேயு
      author: பவுல், அல்லது பவுலின் பெயரில் எழுதிய ஒரு சீடர்.
      audience: தீமோத்தேயுவுக்கு — சிறையிலிருந்து பவுல் கூறும் பிரியாவிடையாக வடிவமைக்கப்பட்டுள்ளது.
      date: பவுல் எழுதியிருந்தால் சுமார் கி.பி. 60களின் நடுப்பகுதி; பவுலின் பெயரில் எழுதப்பட்டிருந்தால் சுமார் கி.பி. 90–110.
    Titus:
      display_name: தீத்து
      author: பவுல், அல்லது பவுலின் பெயரில் எழுதிய ஒரு சீடர்.
      audience: கிரேத்தாவில் பவுலின் பிரதிநிதியாக இருந்த தீத்துவுக்கு.
      date: பவுல் எழுதியிருந்தால் சுமார் கி.பி. 60களின் நடுப்பகுதி; பவுலின் பெயரில் எழுதப்பட்டிருந்தால் சுமார் கி.பி. 90–110.
    Philemon:
      display_name: பிலேமோன்
      author: பவுல், தீமோத்தேயுவுடன்.
      audience: கிறிஸ்தவரும் அடிமையின் உரிமையாளருமான பிலேமோனுக்கு, தப்பியோடிய அவரது அடிமை ஒநேசிமுவைக் குறித்து.
      date: சுமார் கி.பி. 60–62.
    Hebrews:
      display_name: எபிரெயர்
      author: ஆசிரியர் பெயர் தெரியவில்லை. மரபில் பவுல், அப்பொல்லோ, பர்னபா, பிரிஸ்கில்லா மற்றும் பிறரின் பெயர்கள் முன்வைக்கப்பட்டுள்ளன; எந்தக் கருத்திலும் பொதுவான ஒருமித்த முடிவு இல்லை.
      audience: தாங்கள் அறிக்கையிட்ட கிறிஸ்தவ நம்பிக்கையிலிருந்து பின்வாங்கத் தூண்டப்பட்ட கிரேக்க மொழி பேசும் யூதக் கிறிஸ்தவர்கள்.
      date: சுமார் கி.பி. 60–95.
  chapter_titles:
    Romans:
      '11':
        title: கிருபையால் அழைக்கப்பட்ட பிற இனத்தார்
      '12':
        title: உங்கள் வாழ்வை உயிருள்ள பலியாக ஒப்புக்கொடுங்கள்
      '13':
        title: அதிகாரிகளுக்குக் கீழ்ப்படிந்து அன்புகூருங்கள்
      '14':
        title: நம்பிக்கையில் பலவீனமானவர்களை ஏற்றுக்கொள்ளுங்கள்
      '15':
        title: யூதர்களையும் பிற இனத்தாரையும் ஒன்றிணைத்தல்
      '16':
        title: வாழ்த்துகளும் எச்சரிக்கைகளும்
    1 Corinthians:
      '1':
        title: அனைவருக்கும் கடவுள் நம்பிக்கையுடன் வழங்கும் செல்வங்கள்
      '2':
        title: கடவுளின் ஆவியானவர் வெளிப்படுத்தும் ஞானம்
      '3':
        title: கொரிந்தியர் கடவுளின் ஆலயம் என்று பவுல் எச்சரிக்கிறார்
      '4':
        title: பெருமையைவிட உண்மைத்தன்மையே முக்கியம்
      '5':
        title: சபை ஒழுங்கு நடவடிக்கையைப் பவுல் கட்டளையிடுகிறார்
      '6':
        title: சபைக்குள்ளேயே சச்சரவுகளைத் தீர்த்துக்கொள்ளுங்கள்
      '7':
        title: திருமணத்தை மதிக்கப் பவுல் கற்பிக்கிறார்
      '8':
        title: தனிப்பட்ட சுதந்திரத்தைவிட அன்பே மேலானது
      '9':
        title: பவுல் தனது அப்போஸ்தலப் பணியைச் சுதந்திரமாக ஆதரிக்கிறார்
      '10':
        title: கடவுளின் மக்களுக்கு இஸ்ரவேலின் எச்சரிக்கை
      '11':
        title: வழிபாட்டில் ஒற்றுமை கிறிஸ்துவை மகிமைப்படுத்துகிறது
      '12':
        title: ஆவியின் வரங்கள் சபையின் ஒற்றுமையை வளர்க்கின்றன
      '13':
        title: அன்பு ஒருபோதும் கைவிடாது
      '14':
        title: வெளித்தோற்றத்தைக் கவர்வதைவிட அன்பையே நாடுங்கள்
      '15':
        title: கிறிஸ்து உயிர்த்தெழுகிறார்; மரணம் வீழ்கிறது
      '16':
        title: காணிக்கைகளும் பயணத் திட்டங்களும்
    2 Corinthians:
      '1':
        title: துன்பத்தில் கடவுளின் ஆறுதல்
      '2':
        title: அன்பும் மன்னிப்பும் வலியுறுத்தப்படுகின்றன
      '3':
        title: மாறிய வாழ்வுகளால் உறுதிப்படுத்தப்படும் ஊழியம்
      '4':
        title: கிறிஸ்துவின் மகிமையை அறிவித்தல்
      '5':
        title: கிறிஸ்துவின் அன்பு ஊழியத்தை இயக்குகிறது
      '6':
        title: கடவுளுக்காகத் துன்பத்தைத் தாங்குங்கள்
      '7':
        title: பயபக்தியுடன் பரிசுத்தத்தை நாடுங்கள்
      '8':
        title: மக்கெதோனியரின் கிருபை கொடுப்பதற்கு ஊக்கமளிக்கிறது
      '9':
        title: இறைமக்களுக்காக மகிழ்ச்சியுடன் கொடுங்கள்
      '10':
        title: கிறிஸ்துவின் சாந்தத்தைப் பின்பற்றுவதாக உறுதி
      '11':
        title: உண்மையான வாழ்வுக்கான ஆழ்ந்த அக்கறை
      '12':
        title: பலவீனத்திலும் கிருபையிலும் பெருமைகொள்ளுங்கள்
      '13':
        title: பாவம் உள்ளதா என நம்மையே சோதிப்போம்
    Galatians:
      '1':
        title: பவுல் தனது நற்செய்தியை ஆதரிக்கிறார்
      '2':
        title: பேதுருவின் தவறைப் பவுல் எதிர்கொள்கிறார்
      '3':
        title: ஆபிரகாமின் நம்பிக்கை நீதிமானாக்குகிறது
      '4':
        title: சட்டத்திலிருந்து கிறிஸ்து நம்மை விடுவிக்கிறார்
      '5':
        title: சட்டத்தால் அல்ல, நம்பிக்கையால் வாழுங்கள்
      '6':
        title: ஒருவருடைய சுமையை மற்றவர் சுமந்துகொள்ளுங்கள்
    Ephesians:
      '1':
        title: நம்பிக்கையாளர்களில் முத்திரையிடப்பட்ட கடவுளின் கிருபை
      '2':
        title: கிறிஸ்து அனைவருக்கும் சமாதானத்தைக் கொண்டுவருகிறார்
      '3':
        title: நற்செய்தியின் மூலம் வெளிப்படுத்தப்பட்ட மறைபொருள்
      '4':
        title: கிறிஸ்துவின் உடலில் ஒற்றுமைக்கான வேண்டுதல்
      '5':
        title: கடவுளைப் பின்பற்றி ஞானமாக வாழுங்கள்
      '6':
        title: பிள்ளைகளே, பெற்றோருக்குக் கீழ்ப்படிந்து மதியுங்கள்
    Philippians:
      '1':
        title: பிலிப்பியருக்காகப் பவுல் வேண்டுகிறார்
      '2':
        title: தாழ்மைப்படுத்தப்பட்டு உயர்த்தப்பட்ட இயேசு
      '3':
        title: கிறிஸ்துவை அறிவதில் மகிழுங்கள்
