payload:
  book_metadata:
    1 Esdras:
      display_name: 1 எஸ்திராஸ்
      author: ஆசிரியர் அறியப்படாதவர்; 2 நாளாகமம் 35–36, எஸ்றா, நெகேமியா 7–8 ஆகியவற்றை வேறு வரிசையில் அமைத்த கிரேக்க மறுதொகுப்பு.
      audience: திரும்பிவருதலையும் மீட்டமைப்பையும் பற்றிய தெளிவான கதையை விரும்பிய ஹெலெனியக் கால யூதர்கள்.
      date: சுமார் பொ.ஆ.மு. 2–1ஆம் நூற்றாண்டு.
    Prayer of Manasseh:
      display_name: மனாசேயின் மன்றாட்டு
      author: ஆசிரியர் அறியப்படாதவர்; மனாசே மன்னரின் பெயரில் புனைவாகச் சார்த்தப்பட்டது.
      audience: மனாசேயின் மனந்திரும்புதலுடன் தங்களை அடையாளப்படுத்திக்கொண்ட மனந்திரும்புவோர் — சில மரபுகளில் வழிபாட்டில் பயன்படுத்தப்பட்டது.
      date: சுமார் பொ.ஆ.மு. 2–1ஆம் நூற்றாண்டு.
    Psalm 151:
      display_name: சங்கீதம் 151
      author: ஆசிரியர் அறியப்படாதவர்; தாவீதின் பெயரில் புனைவாகச் சார்த்தப்பட்டது. இதன் ஓர் எபிரெய வடிவம் 11QPsa-வில் சான்றுபெற்றுள்ளது.
      audience: தாவீதின் சங்கீதத் தொகுப்பில் ஈடுபாடு கொண்ட புலம்பெயர் மற்றும் கும்ரான் சமூகங்கள்.
      date: சுமார் பொ.ஆ.மு. 2ஆம் நூற்றாண்டு அல்லது அதற்கு முன்பு.
    3 Maccabees:
      display_name: 3 மக்கபேயர்
      author: ஆசிரியர் அறியப்படாதவர்; கிரேக்க மொழியில் இயற்றப்பட்டது.
      audience: எகிப்தில் வாழ்ந்த கிரேக்க மொழி பேசிய புலம்பெயர் யூதர்கள் — நான்காம் தாலமியின் ஆட்சிக்காலத்தில் அமைந்த ஒரு விடுதலைக் கதை.
      date: சுமார் பொ.ஆ.மு. 1ஆம் நூற்றாண்டு முதல் பொ.ஆ. 1ஆம் நூற்றாண்டு வரை.
    4 Maccabees:
      display_name: 4 மக்கபேயர்
      author: ஆசிரியர் அறியப்படாதவர்; ஸ்தோயிக் தத்துவத்தின் தாக்கம் பெற்ற, கிரேக்க மொழி பேசிய ஒரு யூத ஆசிரியர்.
      audience: ஹெலெனிய யூதர்கள் — உண்மைப்பற்றின் வழியாக உணர்ச்சிகளைப் பகுத்தறிவு கட்டுப்படுத்துவதைப் பற்றிய ஒரு தத்துவப் பேருரை.
      date: சுமார் பொ.ஆ. 1ஆம் நூற்றாண்டு.
    Bel and the Dragon:
      display_name: பேலும் வலுசர்ப்பமும்
      author: ஆசிரியர் அறியப்படாதவர்; தானியேல் நூலின் கிரேக்கக் கூடுதல் பகுதிகளில் ஒன்று.
      audience: கிரேக்க மொழி பேசிய யூதர்கள் — சிலைவழிபாட்டுக்கு எதிரான ஏளனக் கண்டனப் படைப்பு.
      date: சுமார் பொ.ஆ.மு. 2–1ஆம் நூற்றாண்டு.
    Letter of Jeremiah:
      display_name: எரேமியாவின் கடிதம்
      author: ஆசிரியர் அறியப்படாதவர்; எரேமியாவின் பெயரில் புனைவாகச் சார்த்தப்பட்டது.
      audience: சுற்றியிருந்த சிலைவழிபாட்டால் ஈர்க்கப்படும் ஆபத்தில் இருந்த புலம்பெயர் யூதர்கள்.
      date: சுமார் பொ.ஆ.மு. 4–2ஆம் நூற்றாண்டு.
    Prayer of Azariah and Song of the Three:
      display_name: அசரியாவின் மன்றாட்டும் மூவரின் பாடலும்
      author: ஆசிரியர் அறியப்படாதவர்; தானியேல் நூலின் கிரேக்கக் கூடுதல் பகுதிகளில் ஒன்று.
      audience: கிரேக்க மொழி பேசிய யூதர்கள் — தானியேல் 3-க்கான வழிபாட்டு உள்ளடக்கம்.
      date: சுமார் பொ.ஆ.மு. 2ஆம் நூற்றாண்டு.
    Susanna:
      display_name: சூசன்னா
      author: ஆசிரியர் அறியப்படாதவர்; தானியேல் நூலின் கிரேக்கக் கூடுதல் பகுதிகளில் ஒன்று.
      audience: கிரேக்க மொழி பேசிய யூதர்கள் — நீதிமையையும் கண்டிக்கப்படும் பொய்ச் சாட்சியத்தையும் பற்றிய ஒரு கதை.
      date: சுமார் பொ.ஆ.மு. 2–1ஆம் நூற்றாண்டு.
    1 Clement:
      display_name: 1 கிளெமெந்து
      author: ஆசிரியர் அறியப்படாதவர்; ரோமின் கிளெமெந்துவுக்கு சார்த்தப்படுகிறது.
      audience: தலைமைத்துவப் பூசலில் சிக்கியிருந்த கொரிந்துவின் கிறிஸ்தவச் சபை.
      date: சுமார் பொ.ஆ. 96.
  chapter_titles:
    2 Maccabees:
      '12':
        title: வீழ்ந்தவர்களுக்காக யூதாஸ் மன்றாடுகிறார்
      '13':
        title: வெற்றிக்காக யூதாஸ் மன்றாடுகிறார்
      '14':
        title: நிக்கானோர் சமாதான உடன்பாட்டைத் துரோகம் செய்கிறான்
      '15':
        title: நிக்கானோரின் தோல்வியை யூதர்கள் கொண்டாடுகின்றனர்
    1 Esdras:
      '1':
        title: யோசியா பஸ்காவைக் கொண்டாடி இறக்கிறார்
      '2':
        title: எரேமியாவின் வார்த்தையைச் சைரஸ் நிறைவேற்றுகிறார்
      '3':
        title: சத்தியமே வெல்லும் என செருபாபேல் அறிவிக்கிறார்
      '4':
        title: ஆலயத்தை மீண்டும் கட்ட தரியு அனுமதிக்கிறார்
      '5':
        title: நாடுகடத்தப்பட்டோர் திரும்பி பலிபீடத்தைக் கட்டுகின்றனர்
      '6':
        title: ஆலயப் பணியைத் தீர்க்கதரிசிகள் ஊக்குவிக்கின்றனர்
      '7':
        title: ஆலயம் மிகுந்த மகிழ்ச்சியுடன் கட்டிமுடிக்கப்படுகிறது
      '8':
        title: எஸ்றா மக்களைப் பாதுகாப்பாகத் திரும்ப அழைத்துவருகிறார்
      '9':
        title: உண்மையற்ற திருமணங்களை எஸ்றா எதிர்கொள்கிறார்
    Prayer of Manasseh:
      '1':
        title: இறை இரக்கத்திற்காக மனாசே மன்றாடுகிறார்
    Psalm 151:
      '1':
        title: இளைய மேய்ப்பர் மன்னராக அபிஷேகம் பெறுகிறார்
    3 Maccabees:
      '1':
        title: ஆலயத்திற்குள் நுழைய மன்னன் வற்புறுத்துகிறான்
      '2':
        title: விடுதலைக்காக இஸ்ரவேல் மன்றாடுகிறது
      '3':
        title: யூதர்களை அழிக்க மன்னன் திட்டமிடுகிறான்
      '4':
        title: பொதுமக்கள் முன் கொண்டுவரப்பட்ட யூதர்கள் புலம்புகின்றனர்
      '5':
        title: தண்டனையை நிறைவேற்றுவதற்காக யானைகள் கட்டிவைக்கப்படுகின்றன
      '6':
        title: விண்ணகத் தூதர்கள் யூதர்களைக் காப்பாற்றுகின்றனர்
      '7':
        title: மன்னன் யூதர்களைப் பாதுகாப்பாக விடுவிக்கிறான்
    4 Maccabees:
      '1':
        title: உணர்ச்சிகள்மீது பகுத்தறிவு ஆட்சி செய்கிறது
      '2':
        title: பகுத்தறிவின் கட்டுப்பாட்டைத் திருச்சட்டம் வழிநடத்துகிறது
      '3':
        title: எதிரியின் தண்ணீரைத் தாவீது மறுக்கிறார்
      '4':
        title: விண்ணகப் படைகள் யூதர்களைக் காக்கின்றன
      '5':
        title: பன்றியிறைச்சியை எலெயாசர் மறுக்கிறார்
      '6':
        title: எலெயாசர் உறுதியாக நிலைத்து இறக்கிறார்
      '7':
        title: பகுத்தறிவின் வல்லமையை எலெயாசர் நிரூபிக்கிறார்
      '8':
        title: கொடுங்கோலனை ஏழு சகோதரர்கள் எதிர்கொள்கின்றனர்
      '9':
        title: முதல் சகோதரர் மறைச்சாட்சியாக இறக்கிறார்
      '10':
        title: நாவை அளிக்க நான்காம் சகோதரர் மறுக்கிறார்
      '11':
        title: ஆறாம் சகோதரர் சித்திரவதையைத் தாங்குகிறார்
      '12':
        title: இளைய சகோதரர் தன்னையே எறிகிறார்
      '13':
        title: சகோதரர்கள் ஒருவரையொருவர் ஊக்குவிக்கின்றனர்
      '14':
        title: இறக்கும்படி தாய் தன் மகன்களை ஊக்குவிக்கிறார்
      '15':
        title: மகன்களைவிடக் கடவுளைத் தாய் தேர்ந்தெடுக்கிறார்
      '16':
        title: இறக்கும்படி தாய் தன் மகன்களை இணங்கச் செய்கிறார்
      '17':
        title: ஏழு மறைச்சாட்சிகளும் கடவுளை மகிமைப்படுத்துகின்றனர்
      '18':
        title: பிள்ளைகள் திருச்சட்டத்தைக் கடைப்பிடித்து வாழ்கின்றனர்
    Bel and the Dragon:
      '1':
        title: பேலையும் வலுசர்ப்பத்தையும் தானியேல் தோற்கடிக்கிறார்
    Letter of Jeremiah:
      '1':
        title: பாபிலோனில் சிலைகள் வீணாக அஞ்சப்படுகின்றன
    Prayer of Azariah and Song of the Three:
      '1':
        title: கொழுந்துவிட்டு எரியும் நெருப்பில் அசரியா மன்றாடுகிறார்
    Susanna:
      '1':
        title: நீதிபதிகளின் சதியைத் தானியேல் அம்பலப்படுத்துகிறார்
    1 Clement:
      '1':
        title: பரிசுத்தமற்ற கிளர்ச்சியால் சகோதரர்கள் துன்பப்படுகின்றனர்
      '2':
        title: தாழ்மை அமைதியான ஆர்வத்தைத் தருகிறது
      '3':
        title: பொறாமை போரும் சிறையிருப்பும் கொண்டுவருகிறது
      '4':
        title: பண்டைய கொலைகளுக்குப் பொறாமை வழிவகுத்தது
      '5':
        title: பேதுருவும் பவுலும் உறுதியுடன் துன்பத்தைத் தாங்கினர்
      '6':
        title: பொறாமை கடவுள் தேர்ந்தெடுத்த பெண்களைத் துன்புறுத்தியது
      '7':
        title: மீட்பிற்கான இரத்தம் விலைமதிப்புடையது
      '8':
        title: பாவியின் மனந்திரும்புதலை ஆண்டவர் விரும்புகிறார்
      '9':
        title: நீதிமானான ஏனோக்கு எடுத்துக்கொள்ளப்பட்டார்
      '10':
        title: கீழ்ப்படிதலால் ஆபிரகாம் உண்மையுள்ளவர் என நிரூபித்தார்
      '11':
        title: விருந்தோம்பலினால் லோத்து மீட்கப்பட்டார்
      '12':
        title: ராகாப் உண்மையுடன் உளவாளிகளை மறைக்கிறார்
      '13':
        title: நம்மைத் தாழ்த்தி ஆண்டவரை நாடுவோம்
      '14':
        title: ஒருவரையொருவர் மென்மையாக நடத்துங்கள்
      '15':
        title: இறைப்பற்றுடன் இணைந்த சமாதானத்தை நாடுங்கள்
      '16':
