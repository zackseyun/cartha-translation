payload:
  book_metadata:
    1 Enoch:
      display_name: 1 ஏனோக்கு
      author: ஆசிரியர் பெயர் அறியப்படவில்லை; பெருவெள்ளத்திற்கு முந்தைய முற்பிதாவான ஏனோக்கின் பெயரில் புனைபெயருடன் எழுதப்பட்டதாகக் கருதப்படுகிறது. பல தனித்தனி பகுதிகளை ஒன்றுசேர்த்து உருவாக்கப்பட்ட தொகுப்பு நூல்.
      audience: அண்டமெங்கும் பரவியுள்ள தீமை, நியாயத்தீர்ப்பு, நாட்காட்டி ஆகியவற்றைப் பற்றிச் சிந்தித்த யூத வெளிப்பாட்டு இலக்கியச் சமூகங்களைப் பிரதிபலிக்கிறது; பின்னர் தொடக்ககாலக் கிறிஸ்தவ வட்டாரங்களிலும் வாசிக்கப்பட்டது.
      date: இதன் பகுதிகள் ஏறத்தாழ கி.மு. 3ஆம் நூற்றாண்டிலிருந்து கி.பி. 1ஆம் நூற்றாண்டுவரை தொகுக்கப்பட்டன; முழு நூலும் கீயெஸ் (எத்தியோப்பிய) மொழியில் மட்டுமே பாதுகாக்கப்பட்டுள்ளது.
  chapter_titles:
    1 Clement:
      '47':
        title: உங்களுக்கு எழுதப்பட்ட பவுலின் கடிதத்தை நினைவுகூருங்கள்
      '48':
        title: தூய்மையுடன் நீதியின் வாயிலில் நுழையுங்கள்
      '49':
        title: அன்பு நம்மை தேவனோடு இணைக்கிறது
      '50':
        title: அன்பு தேவனால் தேர்ந்தெடுக்கப்பட்டவர்களை நிறைவாக்குகிறது
      '51':
        title: நம் பாவங்களையும் தவறுகளையும் அறிக்கையிடுவோம்
      '52':
        title: தேவனுக்குத் துதியின் பலியைச் செலுத்துங்கள்
      '53':
        title: மோசே இஸ்ரவேலுக்காகத் துணிவுடன் பரிந்துபேசினார்
      '54':
        title: சமாதானத்தை நாடும் தலைவர்கள் மந்தையை மதிக்கிறார்கள்
      '55':
        title: பெண்கள் துணிச்சலான செயல்களைச் செய்தார்கள்
      '56':
        title: வழிதவறியவர்கள் கீழ்ப்படியும்படி வேண்டுங்கள்
      '57':
        title: தாழ்மையே ஞானம் என்று ஞானம் அறிவிக்கிறது
      '58':
        title: தேவனை நம்பி என்றென்றும் பாதுகாப்பாயிருங்கள்
      '59':
        title: தேர்ந்தெடுக்கப்பட்டவர்களை தேவன் காக்கும்படி வேண்டுங்கள்
      '60':
        title: பாவங்களை மன்னித்து, அடிகளை வழிநடத்தும்
      '61':
        title: தேவன் ஆட்சியாளர்களை ஞானத்தால் வழிநடத்துகிறார்
      '62':
        title: நற்பண்புடன் வாழ விசுவாசம் கற்பிக்கிறது
      '63':
        title: தாழ்மை சமாதானத்தையும் மகிழ்ச்சியையும் தருகிறது
      '64':
        title: அனைவருக்கும் விசுவாசத்தையும் விடாமுயற்சியையும் அருளும்
      '65':
        title: பிரதிநிதிகள் நற்செய்தியுடன் திரும்பட்டும்
    1 Enoch:
      '1':
        title: தேவன் நீதிமான்களுக்கும் தீயவர்களுக்கும் தீர்ப்பளிக்கிறார்
      '2':
        title: வானமும் பூமியும் சாட்சி கூறுகின்றன
      '3':
        title: பதினான்கு மரங்கள் குளிர்காலத்திலும் நிலைத்திருக்கின்றன
      '4':
        title: கோடைக்காலச் சூரியன் ஒழுங்கமைந்த வல்லமையைக் காட்டுகிறது
      '5':
        title: படைப்பு தேவனுடைய ஆட்சிக்கு உண்மையாயிருக்கிறது
      '6':
        title: மனிதப் பெண்களுக்காகக் காவலர்கள் இறங்கி வருகிறார்கள்
      '7':
        title: மாபெரும் சந்ததியினர் பூமியைப் பாழாக்குகிறார்கள்
      '8':
        title: காவலர்கள் தடைசெய்யப்பட்ட அறிவைக் கற்பிக்கிறார்கள்
      '9':
        title: பூமியின் சட்டமீறலைத் தூதர்கள் தெரிவிக்கிறார்கள்
      '10':
        title: வீழ்ந்த காவலர்களுக்கு நியாயத்தீர்ப்பு வருகிறது
      '11':
        title: தேவன் நிறைவான ஆசீர்வாதங்களை வாக்களிக்கிறார்
      '12':
        title: வீழ்ந்த காவலர்களை ஏனோக்கு எதிர்கொள்கிறார்
      '13':
        title: காவலர்களுக்கு இரக்கம் கிடையாது என்று ஏனோக்கு கூறுகிறார்
      '14':
        title: வெளிப்படுத்தப்பட்ட பரலோக மகிமையை ஏனோக்கு காண்கிறார்
      '15':
        title: காவலர்களுக்கான தீர்ப்பை தேவன் விளக்குகிறார்
      '16':
        title: உடலற்ற ஆவிகள் பூமியில் அலைகின்றன
      '17':
        title: திகிலூட்டும் மறுவுலகப் பகுதிகளில் ஏனோக்கு பயணிக்கிறார்
      '18':
        title: படைப்பின் ஆற்றல்கள் சேமிக்கப்பட்டுள்ள இடங்கள் காட்டப்படுகின்றன
      '19':
        title: தூதர்கள் இறுதி நியாயத்தீர்ப்பை எதிர்கொள்வார்கள்
      '20':
        title: பரிசுத்த காவல் தூதர்களும் அவர்களுடைய ஆளுகைப் பகுதிகளும்
      '21':
        title: ஏழு நட்சத்திரங்கள் பாதாளத்தில் சங்கிலிகளால் கட்டப்பட்டுள்ளன
      '22':
        title: ஆத்துமாக்களின் குகைகளை ஏனோக்கு காண்கிறார்
      '23':
        title: தணியாத நெருப்பை ஏனோக்கு காண்கிறார்
      '24':
        title: ஒளிவீசும் ஏழு மகத்தான மலைகள்
      '25':
        title: நியாயத்தீர்ப்புவரை தடைசெய்யப்பட்ட நறுமண மரம்
      '26':
        title: புனித மையத்தை ஏனோக்கு காண்கிறார்
      '27':
        title: தேவதூஷணம் செய்பவர்களுக்கான சபிக்கப்பட்ட பள்ளத்தாக்கு வெளிப்படுத்தப்படுகிறது
      '28':
        title: பொங்கிவரும் நீரூற்றுகளைக் கொண்ட கிழக்கு மலைகள்
      '29':
        title: நியாயத்தீர்ப்பின் மரங்களை ஏனோக்கு காண்கிறார்
      '30':
        title: வற்றாத நீரால் நிறைந்த பள்ளத்தாக்கு
      '31':
        title: மலைகளில் புனித நறுமணங்கள் மலர்கின்றன
      '32':
        title: நீதியின் தோட்டம் வெளிப்படுத்தப்படுகிறது
      '33':
        title: வானத்தின் வாயில்களில் நட்சத்திரங்களுக்குப் பெயரிடப்படுகிறது
      '34':
        title: வானத்தின் வானிலை இயக்கம் வெளிப்படுத்தப்படுகிறது
      '35':
        title: மேற்கு வாயில்கள் கிழக்கு வாயில்களுக்கு ஒத்திருக்கின்றன
      '36':
        title: வானத்தின் வாயில்களை ஏனோக்கு காண்கிறார்
      '37':
        title: ஞானத்தின் வெளிப்பாட்டை ஏனோக்கு அறிவிக்கிறார்
      '38':
        title: நீதிமான்கள் கூடுகிறார்கள்; பாவிகள் தீர்ப்பிடப்படுகிறார்கள்
      '39':
        title: தேர்ந்தெடுக்கப்பட்ட பிள்ளைகள் வானத்திலிருந்து இறங்கி வருகிறார்கள்
      '40':
        title: பரலோகப் படையை ஏனோக்கு காண்கிறார்
      '41':
        title: வானத்தின் கருவூலங்களும் மறைந்த சட்டங்களும்
      '42':
        title: ஞானம் வீணாகத் தனக்கொரு இல்லத்தைத் தேடுகிறது
      '43':
        title: வானத்திற்குரிய உவமையை ஏனோக்கு காண்கிறார்
      '44':
        title: மின்னல் போன்ற நட்சத்திரங்கள் வல்லமையால் கட்டுப்படுத்தப்படுகின்றன
      '45':
        title: மறுப்பவர்களின் தீர்ப்பைப் பற்றிய இரண்டாம் உவமை
      '46':
        title: மனிதகுமாரனை ஏனோக்கு காண்கிறார்
      '47':
        title: நீதிமான்களின் இரத்தத்திற்கு வானத்தில் பதில் கிடைக்கிறது
      '48':
        title: நீதியின் ஊற்று சூழ்ந்திருக்கிறது
      '49':
        title: தேர்ந்தெடுக்கப்பட்டவர் மறைந்திருப்பவற்றைத் தீர்ப்பிடுகிறார்
      '50':
        title: பரிசுத்தர்கள் வெல்வார்கள்; பாவிகள் விரைவில் அழிவார்கள்
      '51':
        title: தேர்ந்தெடுக்கப்பட்டவர் மறைந்த ஞானத்தை வெளிப்படுத்துகிறார்
      '52':
        title: உலோக மலைகளை ஏனோக்கு காண்கிறார்
      '53':
        title: பாவிகளின் காணிக்கைகளால் நிறைந்த பள்ளத்தாக்கு
      '54':
        title: அரசர்கள் எரியும் பள்ளத்தாக்கில் எறியப்படுகிறார்கள்
      '55':
        title: பழமையானவர் இனி ஒருபோதும் அப்படிச் செய்வதில்லை என்று ஆணையிடுகிறார்
      '56':
        title: தண்டனை வழங்கும் தூதர்கள் அசாசேலின் படையைக் கட்டுகிறார்கள்
      '57':
        title: அண்டத்தின் கொந்தளிப்பும் பரிசுத்த வழிபாடும்
      '58':
        title: நீதிமான்களை ஏனோக்கு வாழ்த்துகிறார்
      '59':
        title: இடியின் இரகசியங்களை ஏனோக்கு காண்கிறார்
      '60':
        title: மிக உயர்ந்த வானம் அதிர்கிறது; இரக்கம் நிலைத்திருக்கிறது
      '61':
        title: நீதிமான்களுக்காகத் தூதர்கள் அளவிடுகிறார்கள்
      '62':
        title: அரியணையில் அமர்ந்த மனிதகுமாரன் தீர்ப்பளிக்கிறார்
      '63':
        title: அரசர்கள் ஆண்டவரிடம் மன்னிப்புக் கோருகிறார்கள்
      '64':
        title: மறைந்திருக்கும் பாவிகளை ஏனோக்கு காண்கிறார்
      '65':
        title: பூமிக்காக நோவா அழுகிறார்
      '66':
        title: கட்டளையின்படி தூதர்கள் பெருவெள்ள நீரைத் தடுத்து நிறுத்துகிறார்கள்
      '67':
        title: தேவனுடைய வாக்குறுதியை நோவா கேட்கிறார்
      '68':
        title: மறைந்திருந்தவை ஏனோக்குக்கு வெளிப்படுத்தப்படுகின்றன
      '69':
        title: வீழ்ந்த தூதர்களின் பெயர்கள் கூறப்பட்டு, அவர்களுக்குத் தீர்ப்பளிக்கப்படுகிறது
      '70':
        title: ஏனோக்கு பரலோக அரசவைக்கு எடுத்துக்கொள்ளப்படுகிறார்
      '71':
        title: பரலோக இரகசியங்களை ஏனோக்கு காண்கிறார்
      '72':
        title: சூரியனின் ஒழுங்கமைந்த பாதையை ஊரியேல் வெளிப்படுத்துகிறார்
      '73':
        title: சந்திரனின் பிறைகள் கட்டளையால் ஆளப்படுகின்றன
      '74':
