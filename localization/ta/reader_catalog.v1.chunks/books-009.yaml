payload:
  book_metadata:
    Lamentations:
      display_name: புலம்பல்
      author: ஆசிரியர் பெயர் தெரியவில்லை; எரேமியா எழுதியதாக மரபு கூறுகிறது.
      audience: கி.மு. 586-ல் எருசலேம் அழிக்கப்பட்டதற்காகத் துயருற்ற யூதேய மக்கள்.
      date: கி.மு. 586-க்குச் சற்றுப் பிந்தைய காலம்.
    Ezekiel:
      display_name: எசேக்கியேல்
      author: பாபிலோனுக்குச் சிறைப்பட்டுச் சென்ற ஆசாரியரான எசேக்கியேல்; பின்னர் பதிப்பாசிரியர் பணியால் நூல் மேலும் வளர்ச்சியடைந்தது.
      audience: ஆலயம் இல்லாத நிலையிலும் கடவுளின் பிரசன்னத்தைப் புதிதாகப் புரிந்துகொள்ள முயன்ற, பாபிலோனில் சிறைப்பட்டிருந்த யூதேயர்கள்.
      date: தீர்க்கதரிசியின் பணிக்காலம் ஏறத்தாழ கி.மு. 593–571; நூலின் இறுதி வடிவம் இதற்குச் சற்றுப் பிந்தையது.
    Daniel:
      display_name: தானியேல்
      author: ஆசிரியர் பெயர் தெரியவில்லை; சிறையிருப்புக் காலத்தைச் சேர்ந்த தானியேல் கூறுவதாக இந்நூல் தன்னை முன்வைக்கிறது.
      audience: கிரேக்கப் பண்பாட்டுச் செல்வாக்குள்ள ஆட்சியின்கீழ் துன்புறுத்தப்பட்ட யூதர்கள்—குறிப்பாக நான்காம் அந்தியோக்கஸ் எப்பிபானெஸ் ஆட்சியில் (கி.மு. 167–164).
      date: ஏறத்தாழ கி.மு. 165-ல் இன்று கிடைத்துள்ள வடிவத்தை அடைந்தது; 1–6 அதிகாரங்களில் இதைவிடப் பழமையான அரண்மனைக் கதைகள் இடம்பெற்றுள்ளன.
    Hosea:
      display_name: ஓசியா
      author: பெயேரியின் மகன் ஓசியா.
      audience: அசீரியர்கள் கைப்பற்றுவதற்கு முந்தைய இறுதிப் பத்தாண்டுகளில் இருந்த இஸ்ரவேலின் வடக்கு அரசு.
      date: ஏறத்தாழ கி.மு. 750–722.
  chapter_titles:
    Jeremiah:
      '33':
        title: பாழான நகரத்துக்குக் குணமளிப்பதாக வாக்குறுதி
      '34':
        title: சிதேக்கியாவுக்குத் தீர்ப்பும் எச்சரிக்கையும்
      '35':
        title: ரேகாபியர்கள் உண்மையுடன் கீழ்ப்படிதல்
      '36':
        title: எச்சரிப்புச் சுருளை எழுதும் பாரூக்கு
      '37':
        title: சிதேக்கியா அரசனை எச்சரிக்கும் எரேமியா
      '38':
        title: நீர்த்தொட்டிக்குள் எறியப்படும் எரேமியா
      '39':
        title: எரேமியாவைக் காப்பாற்றும் எபெத்மெலேக்கு
      '40':
        title: எருசலேம் வீழ்ந்தபின் விடுவிக்கப்படும் எரேமியா
      '41':
        title: கெதலியாவை வஞ்சகமாகக் கொல்லும் இஸ்மவேல்
      '42':
        title: எகிப்துக்குத் தப்பியோட வேண்டாமென எரேமியா எச்சரித்தல்
      '43':
        title: எரேமியாவை எகிப்துக்கு இழுத்துச் செல்லும் கலகக்காரர்கள்
      '44':
        title: கடவுளின் கட்டளைக்குக் கீழ்ப்படிய மறுத்தல்
      '45':
        title: துயரத்தால் சோர்ந்துபோன பாரூக்கு
      '46':
        title: பெருமைமிக்க எகிப்தியப் பேரரசைக் கடவுள் தீர்ப்பிடுதல்
      '47':
        title: தடுக்க முடியாத வெள்ளத்தை எதிர்கொள்ளும் பெலிஸ்தியர்கள்
      '48':
        title: மோவாபின் அழிவும் எதிர்கால நம்பிக்கையும்
      '49':
        title: யூதாவைச் சூழ்ந்த நாடுகள்மீது தீர்ப்பு
      '50':
        title: பாபிலோன் வீழ்கிறது; கடவுள் வெல்கிறார்
      '51':
        title: இறைத் தீர்ப்பால் பாபிலோன் வீழ்தல்
      '52':
        title: எருசலேம் வீழ்ந்து ஆலயம் எரிக்கப்படுதல்
    Lamentations:
      '1':
        title: கைவிடப்பட்ட எருசலேம் தனிமையில் அழுகிறது
      '2':
        title: சீயோன்மீது ஆண்டவர் தமது சினத்தைக் கொட்டுதல்
      '3':
        title: காலையின் இரக்கங்களிலிருந்து பிறக்கும் நம்பிக்கை
      '4':
        title: அருமையான சீயோன் பாழாகிப் பட்டினியால் வாடுதல்
      '5':
        title: ஆண்டவரே, கேளும் என மக்கள் கதறுதல்
    Ezekiel:
      '1':
        title: விண்ணுலகக் காட்சியைக் காணும் எசேக்கியேல்
      '2':
        title: கடவுளிடமிருந்து பணிப்பொறுப்பைப் பெறும் எசேக்கியேல்
      '3':
        title: புலம்பல்கள் எழுதப்பட்ட சுருளை உண்ணும் எசேக்கியேல்
      '4':
        title: எருசலேமின் முற்றுகையை நடித்துக் காட்டும் எசேக்கியேல்
      '5':
        title: அடையாளமாகத் தலைமுடியை மழிக்கும் எசேக்கியேல்
      '6':
        title: இஸ்ரவேலுக்கு எதிராக இறைவாக்குரைக்கும் எசேக்கியேல்
      '7':
        title: வரவிருக்கும் தீர்ப்பைக் கடவுள் அறிவித்தல்
      '8':
        title: ஆலயத்தின் அருவருப்புகளைக் காணும் எசேக்கியேல்
      '9':
        title: எருசலேமின் பாவத்திற்குத் தண்டனை வழங்குவோர்
      '10':
        title: மகிமை தீர்ப்பின் நெருப்புத் தணல்களைச் சிதறடித்தல்
      '11':
        title: நகரத்தின் அழிவை முன்னறிவிக்கும் எசேக்கியேல்
      '12':
        title: சிறையிருப்பை நடித்துக் காட்டும் எசேக்கியேல்
      '13':
        title: பொய்த் தீர்க்கதரிசிகளைக் கண்டிக்கும் எசேக்கியேல்
      '14':
        title: இஸ்ரவேலின் உண்மையின்மையைக் கடவுள் தீர்ப்பிடுதல்
      '15':
        title: பயனற்ற திராட்சைக்கொடிக்கு ஒப்பிடப்படும் எருசலேம்
      '16':
        title: எருசலேமின் உண்மையின்மைக்காகக் கடவுள் புலம்புதல்
      '17':
        title: கழுகுகளைப் பற்றிய எசேக்கியேலின் விடுகதை
      '18':
        title: ஒவ்வொருவரையும் கடவுள் தீர்ப்பிடுதல்
      '19':
        title: இஸ்ரவேலின் இளவரசர்களின் தோல்வியும் வீழ்ச்சியும்
      '20':
        title: இஸ்ரவேலின் கலகமிக்க கடந்தகாலத்தை எடுத்துரைக்கும் கடவுள்
      '21':
        title: நாடுகளுக்கு எதிராக வரும் தீர்ப்பின் வாள்
      '22':
        title: இரத்தக்கறை படிந்த நகரமாக வெளிப்படும் எருசலேம்
      '23':
        title: சிலைகளை மோகித்த இரு சகோதரிகள்
      '24':
        title: அடையாளமாக எசேக்கியேலின் மனைவி எடுத்துக்கொள்ளப்படுதல்
      '25':
        title: யூதாவைச் சூழ்ந்த நாடுகள் தீர்ப்பை எதிர்கொள்ளுதல்
      '26':
        title: மகிழ்ச்சி கொண்டாடிய தீருவைக் கடவுள் தீர்ப்பிடுதல்
      '27':
        title: மகத்துவமிக்க தீருவுக்கான இரங்கற்பாடல்
      '28':
        title: தீருவின் ஆட்சியாளரை எதிர்கொள்ளும் எசேக்கியேல்
      '29':
        title: பார்வோனின் பெருமையால் எகிப்து வீழ்தல்
      '30':
        title: பார்வோனிடமிருந்து அதிகாரம் பறிக்கப்படுதல்
      '31':
        title: அசீரியா வீழ்கிறது; பார்வோன் எச்சரிக்கப்படுகிறார்
      '32':
        title: பாபிலோனிடம் பார்வோன் வீழ்தல்
      '33':
        title: காவலிருந்து தீயவர்களை எச்சரிக்கும் எசேக்கியேல்
      '34':
        title: மேய்ப்பர்கள் தவறுகின்றனர்; கடவுளே மேய்ப்பார்
      '35':
        title: ஏதோமின் பகை; விரைவில் வரும் பாழாக்கம்
      '36':
        title: இஸ்ரவேல் மீட்கப்படுகிறது; மலைகள் கனிதருகின்றன
      '37':
        title: உலர்ந்த எலும்புகள் உயிர்பெறுகின்றன; நாடு ஒன்றிணைகிறது
      '38':
        title: கோகு இஸ்ரவேலைத் தாக்குகிறான்; பரிசுத்த கடவுள் காக்கிறார்
      '39':
        title: கோகு அழிக்கப்படுகிறான்; நாடுகள் ஆண்டவரை அறிகின்றன
      '40':
        title: உயர்ந்த மலையில் தொடங்கும் அளவீட்டுக் காட்சி
      '41':
        title: பரிசுத்த மகிமை நிறைந்த ஆலயத்தின் உட்புறம் அளக்கப்படுதல்
      '42':
        title: ஆசாரியர்களின் அறைகள் அளக்கப்பட்டுத் தனியாக ஒதுக்கப்படுதல்
      '43':
        title: மகிமை திரும்புகிறது; ஆலயம் பரிசுத்தத்தால் நிறைகிறது
      '44':
        title: மூடிய வாசலைக் காணும் எசேக்கியேல்
      '45':
        title: கடவுளுக்கும் மக்களுக்கும் உரிய நிலம்
      '46':
        title: வழிபாட்டு ஒழுங்கு; தலைவரும் வழிபடுகிறார்
      '47':
        title: உயிரளிக்கும் தண்ணீர் பாய்ந்து வாழ்வைக் கொண்டுவருதல்
      '48':
        title: பரிசுத்தப் பகுதியை மையமாகக் கொண்டு நிலம் பகிர்ந்தளிக்கப்படுதல்
    Daniel:
      '1':
        title: அரசனின் உணவை மறுக்கும் தானியேல்
      '2':
        title: மறைக்கப்பட்ட கனவை வெளிப்படுத்தும் தானியேல்
      '3':
        title: நண்பர்களை எறியும் நேபுகாத்நேச்சார்
      '4':
        title: தாழ்மையைக் கற்றுக்கொள்ளும் நேபுகாத்நேச்சார்
      '5':
        title: வீழ்ந்து இறக்கும் பெல்ஷாத்சார்
      '6':
        title: சிங்கக் குகையிலிருந்து தப்பும் தானியேல்
      '7':
        title: கடலிலிருந்து எழும் நான்கு மிருகங்கள்
      '8':
        title: செம்மறியாட்டுக்கடாவும் வெள்ளாட்டுக்கடாவும் பற்றிய காட்சி
      '9':
        title: எருசலேமுக்காக மன்றாடும் தானியேல்
      '10':
        title: தானியேலை வலுப்படுத்தும் தூதர்
      '11':
        title: எதிர்காலப் பேரரசுகளின் மோதல்
      '12':
        title: கடவுளின் மக்களைக் காக்கும் மிகாவேல்
    Hosea:
      '1':
        title: உண்மையற்ற கோமேரை மணக்கும் ஓசியா
      '2':
        title: காதலர்களைப் பின்தொடர்ந்து கடவுளை மறக்கும் இஸ்ரவேல்
      '3':
        title: உண்மையற்ற பெண்ணை மீண்டும் மீட்கும் ஓசியா
      '4':
